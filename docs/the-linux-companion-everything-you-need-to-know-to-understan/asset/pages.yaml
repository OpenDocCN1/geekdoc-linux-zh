- pgno: 85
  md: '# The LINUX FUD factor: fear, uncertainty and doubt


    Linux is growing in popularity and, as a consequence, is finding its way into
    everyday conversation and media articles. Unfortunately, much of this information
    is either misconstrued or ill informed. This chapter presents some of the more
    frequently cited myths about Linux and open source software in general and some
    insights into what is really happening in the Linux world.


    # ‘Free/open source software is unreliable’


    This phrase always makes people think of software that is given away at no cost,
    has no owner, and thus has no support or warranty. In the reality ‘free’ in free
    software means that the source code has been liberated and anybody may copy and
    compile it, but that does not exclude payment. The Free Software Foundation, FSF,
    originators of the GNU licence put it: ‘Think free speech not free.


    Most people use Linux for real applications are using commercial distributions,
    which they have paid for. They thus expect, and get, the same level of quality
    and support as with any other commercial product. As much confusion has been caused
    by use of the term free, many developers now prefer to use the term ‘open source’.


    # ‘Linux is a UNIX clone down to run on a PC’


    Linux is not cut down. It is fully fledged and continues to evolve with the latest
    developments in the software industry.


    # ‘Why compromise just to save a few pounds?’


    Many Linux users use words like flexible, open, reliable and efficient to describe
    Linux. Few people use it to save money, although most acknowledge that a lot of
    money can be saved. At the outset many Linux users were people who wanted to play
    with UNIX at home but could not afford the workstation costs. But Linux soon grew
    beyond that.


    But issues are mostly about commercial use. If corporate staff are familiar with
    one OS and not Linux, setting up a server with Linux will probably cost more,
    as savings on the operating system price are absorbed by time'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'spent on the learning curve. But once installed and set up, Linux systems require
    low maintenance, and consequent systems will require less time and consequently
    save money. But beyond saving a few pounds, the licence issue goes further. Many
    system administrators prefer the thin server approach, where services are spread
    across multiple low-cost machines rather than on big boxes, with the load being
    split by service rather than users. This approach is more easily scalable and
    limits downtime. It also makes it easier to upgrade and maintain individual system
    elements. But if you need per licences on each box, it can become an economic
    non-starter. Linux not only makes the thin server model financially viable, but
    its high efficiency means that older desktop machines no longer considered good
    enough may be recycled as non-critical systems and routers.


    # ‘Linux is not warranted nor supported''


    Which software products do have warranties? Most software is sold on an ‘as agreement,
    and it is up to the user to check that the software is suitable for the application.
    Commercial distributions of Linux are widely available, and include support options.
    They offer the same kind of contract as commercial packages and there is no reason
    to differentiate these products just because they have an open source base.


    On the other hand, users of open source software have the source, so they may
    put in that little fix or enhancement they need. If they think their enhancement
    may be useful to others, they release it to be folded back into the main Linux
    release.


    No software is all things to all men, and many people who swear by Linux do so
    in because they have found themselves locked into a system that is not doing all
    they want, but the necessary ‘fix’ has not been forthcoming or, as is more often
    the case, it finally arrives bundled into a paid-for upgrade which includes many
    new but undesired elements with a new set of bugs. Linux allows users to configure
    the system to do what they want it to do.


    # ‘Software developers are reluctant to develop for a platform that requires them
    to release the source code''


    That would be understandable, but there is no obligation for software developers
    to release the source of their software, nor is there any obligation to allow
    the software to be freely copied. There is no difference between selling software
    for Linux and for any other platform. Open source software developers'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'recognise the need for commercial elements in the system; they believe it is
    the core code, the application interfaces and the system utilities that must be
    open in order to get a truly non-proprietary system, extendible by all.


    At the same time, all would agree that commercial distributors are necessary to
    package the software into an end-user package with logos, manuals, phone support
    and so on. As, the open source community welcomes encourages companies to work
    alongside them selling services, packages and support, as well as interfacing
    and integrating ‘licenced’ software with freely available packages. There are
    many companies that have risen to the challenge of this new market, and they are
    making healthy profits.


    # ''Linux is fragmenting''


    There is no credible evidence that this is happening. Although the commercial
    Linux distributors differentiate their products, they are compatible and various
    companies work together in a friendly manner that is uncommon in the software
    world. They adhere to a common filesystem hierarchy standard, which determines
    the layout of the system, and they use kernels and libraries from the same series.
    The misconception that a stand-alone package has to be distributed in a different
    version for each Linux distribution is brought about by FUD.


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_87_0.png)


    File system


    A file system is a system for structuring files. There are many file systems available
    which differ (sometimes considerably) in performance and power. Some file systems
    are strictly tied to certain media.


    # ''Linux has no direction''


    Linus Torvalds, the honorary president of the Linux movement, has clearly stated
    that the long-term goal of Linux is world domination. So Linux is no different
    to other major operating systems except in his goal is not for financial remuneration
    but for the good of society.


    # ''Linux is made up of a lot of little groups running in different directions''


    Linux is made up of lots of little groups running in the same direction. A number
    of mechanisms ensure this. The most important is perhaps the Internet; people
    working on Linux projects are constantly in discussion with


