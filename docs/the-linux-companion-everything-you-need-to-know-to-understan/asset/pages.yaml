- pgno: 154
  md: 'response time of the Linux community is faster than any commercial organization.
    If, for example, there is a virus attack, there will typically be a patch posted
    to the Internet within hours, compared to days or weeks for the larger commercial
    vendors.


    The vast number of developers working on Linux and their constant posting of patches
    and improvements to the Internet means that it has caught up rapidly with other
    versions of UNIX, and is now considered by many to be far more stable than these
    versions. Many believe the same is true of Linux versus NT, a claim that the market
    statistics are progressively supporting.


    # The position of Linux within the OS market


    Linux can be freely downloaded over the Internet and freely copied, the information
    on the actual number of users is difficult to obtain. On some counts there are
    estimated 14 million users of Linux at present (see www.counter.li.org).


    IDC only tracks the paid copies of Linux in distribution, which is in fact more
    pertinent to SuSE. In 1998 the worldwide operating system market was, according
    to IDC, worth some £3.45 billion. The client operating system environment was
    worth slightly more than £4.1 billion.


    According to IDC, the global revenues from Linux in 1998 were estimated £59 million,
    with £38 million of that coming from the client side. The server revenues are
    by far the fastest growing, experiencing nearly 140 per cent revenue growth in
    1998 versus 1997. In terms of revenues, the low price of the Linux operating system
    means that Linux has a very small but rapidly share of the overall market.


    Though Linux has less than one cent share of the market by measurable revenues,
    the picture is quite different if we look at volume shipments. According to IDC,
    Linux had a 25 per cent (from latest IDC reports for 1999, February 2000) market
    share of the worldwide server operating environment market in 1998, having experienced
    180 per cent growth in 1998 versus 1997.


    Looking at the IDC figures there is clearly the potential for an increase in the
    size of the worldwide Linux market in the coming years. This of course will be
    matched by a similar increase in the market for Linux services, benefiting the
    Linux distributors.'
