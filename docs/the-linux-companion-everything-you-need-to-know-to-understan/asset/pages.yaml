    # NASA


    The role of the phytoplankton in global climate change is currently not well understood.
    Learning more about this subject is very important in developing a better understanding
    of the carbon cycle and global climate, not just from a purely scientific view,
    but from a point of view that could impact the well-being of man and all living
    things on Earth.


    The NASA airborne oceanographic lidar (AOL) fluorometer is a laser spectrophotometer
    which is operated from an aircraft. By observing the laser stimulated fluorescence
    (LSF) and the colour of the ocean, NASA can measure levels of phytoplankton. These
    aircraft measurements greatly assist calibrating satellite ocean colour sensors,
    which can help estimate how much raw material they are taking up on a global scale
