    and Apply Linux office suites that can read and write Word and Excel documents
    as carry out PowerPoint-like tasks. There are also individual programs, such as
    AbiWord (which will read and write Word files), Gnumeric (for Excel), and MagicPoint
    (for PowerPoint).



    I think Linux makes a great platform for the desktop or the server environment,
    but I do have to mention that compatibility products is often a problem. This
    issue is not unique to Linux, by means, but has come from vendors such as Corel,
    Lotus and others through the years. The problem is that Microsoft does not remain
    compatible with themselves on internal file formats. I am not sure if this is
    because they have an unclear strategy that they cannot come up with an extendable
    storage format for each of their office products, or if it is a deliberate attempt
    to frustrate the competition from re-engineering your products, but it is a continual
    problem. I recently encountered this problem, not on Linux, but using 98. I installed
