    You are not tied to one operating system. Just as I tried Windows NT, I tried
    Linux on Windows NT; there is a version of VMware for Windows NT too. Not only
    can you run Microsoft’s operating systems or Linux under VMware, you can use BSD
    as well, or BeOS, plain DOS, virtually everything that is made for the same platform,
    the x86. You can run two at the same time, if you wish. However, since it takes
    at least 64Mb of additional RAM for each new virtual machine, not to mention the
    CPU load, your machine will become slower with each application.


    There is much to gain in using virtual machines. If you write code or work at
    a helpdesk you can develop it on your ‘real’ machine and test the software on
    the virtual one. If it


    > Did you know...?


    # Central Processing Unit (CPU)


    Intel x86 processors can run in many different modes. Here, we want to distinguish
    between two of them. Real mode is the ‘original’ mode using a segmented memory
    protocol. This is slow, antiquated and limited to 16-bit software. Protected mode
    (from 386 onwards) has a linear memory. Only this mode uses the full power of
    the CPU. Linux runs only in protected mode. At the time of writing, Linux exists
    for the following processor architectures: Intel x86, DEC alpha, Motorola m68k,
    Sparc, PowerPC, MIPS and ARM.


    Linux Fact and Fiction 93'
