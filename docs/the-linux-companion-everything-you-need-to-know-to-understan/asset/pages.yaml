    Linux kernel programmers makes introducing new techniques a personal chal-

    len. Linux was running in 64-bit on the DEC Alpha from day one. It also

    runs in 64-bit on Sun platforms. It supports SMP, and can be clustered. You can

    connect a room full of cheap dual-Pentium processors to make a low-

