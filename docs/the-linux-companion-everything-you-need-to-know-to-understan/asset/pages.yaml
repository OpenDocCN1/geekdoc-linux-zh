    # Searching for information on the Web


    Searching elsewhere for documentation and general Linux information I found thousands
    of Web sites, at least 370 UseNet groups and more mailing lists that I care to
    count.


    There are many sites containing Linux information that you would end up with information
    overload. But for newcomers, and those'
  merge: -1
