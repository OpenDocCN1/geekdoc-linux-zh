- pgno: 190
  md: 'ions of Linux will generate some revenue, most of the money will probably not
    be made in this area. It will as the corporate sector adopts Linux. These operations
    often involve preconfigured or high-performance computers using Linux. SuSE Linux
    has carved out a space in this market. Check this out at www.suse.de/en/support/prof/index.html.


    SuSE Linux is not going after a small niche market. Silicon Graphics, in a recent
    reorganisation, indicated it intends to be one of the leading vendors of high-end
    Linux systems. That is a confident initiative for a company with sales of almost
    $3 billion. These endeavours are not exclusive, or restricted to the big players.


    A market is also emerging for sophisticated or specialised software that runs
    on the Linux platform. IBM, Hewlett-Packard, Oracle and others are releasing Linux
    versions of their high-end database programs. And you can be sure aren’t doing
    this out of the goodness of their hearts. They expect to make money on the sale
    of such software to the corporate sector, through their support and maintenance
    contracts. Many smaller companies are also developing specialised versions of
    Linux for specific targets such as the small office/home office market. These
    are all sold for a fetch. Watch for huge increase in the demand for a variety
    of Linux-related skills. There are already signs of a flourishing education, publishing,
    conference and support industry around the Linux phenomena. The recent LinuxWorld
    Expo brought record attendance for a show on this topic.


    Embedded technology and Linux is an industry to explode. And where there’s a new
    industry, there’s money to be made.


    # Linux in the embedded system


    Windows is undoubtedly king of the desktop market and will not lose that position
    in the forsee future. On the other hand, Linux is well on its way to a dominant
    position in the server market, as evidenced by its doubling market share during
    1998 and 1999. But what about the third major market for computer operating systems,
    the vast and largely unseen realm of embedded systems? Does Microsoft reign supreme
    there, on the desktop? Not at all.


    # What is an embedded system?


    Embedded systems are devices or pieces of equipment not necessarily thought of
    being computers, but whose operation depends on some sort of internal'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'computer function. Embedded systems are all around us in cars, microwave ovens,
    stereos, home automation systems, lifts, cell phones, security systems, in-flight
    entertainment systems, cash machines, vending machines, medical instruments, information
    kiosks etc. The list goes on and on, to the point where almost every electrically-powered
    device now contains embedded intelligence of one form or another. There are tens
    of thousands of different embedded systems; each contains a highly specialised
    embedded computer that is as unique as the device itself. By contrast, desktop,
    laptop and notebook PCs all perform the same basic job and are therefore architecturally
    similar.


    The main differences tend to be in the size and style of their systems (CRT or
    LCD), pointing devices (mouse, trackball or glide pad), keyboards and enclosures.
    These systems run thousands of different application programs, they primarily
    consist of variations on a single theme, the ''PC architecture''.


    An interesting statistic is more than 90 per of all the microprocessors manufactured
    each year go into embedded systems, while less than 10 per go into PCs. Now that
    make the embedded market seem like an enticing target for a software giant like
    Microsoft. Before jumping to conclusion, consider the implications of the fact
    that the embedded market consists of around 10,000 applications, potentially based
    on thousands of distinct computer architectures. That''s a lot of projects and
    unique computer architectures to support for any company, even Microsoft.


    You can imagine why Microsoft might prefer the PC market with its single architecture
    to the embedded market with its extreme fragmentation.


    # Embedded operating system alternatives


    So which operating system is dominant in the embedded systems market? Interestingly,
    the answer is no. Why? Until recently, there have been three main alternatives:


    +   - general-purpose desktop PC operating systems;

    - commercial off-the-shelf embedded operating systems; and

    - custom-designed operating system software, tuned to the task at hand.


    Desktop PC operating systems are not particularly well suited to the task of satisfying
    the specific needs of most embedded systems. Think about it. Would you be willing
    to wait half a minute (or more) for your microwave to load its operating system
    into 128Mb of DRAM before it starts heating up your meal? You demand instant performance
    from embedded systems, without software crashes, using minimal power and at the
    lowest cost possible.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Although dozens of operating system vendors target their wares, the need to
    accommodate extremely tight hardware, software and cost constraints while meeting
    highly dedicated feature requirements often limits the practicality of using ready-made
    operating systems. For this reason, less than half of all embedded systems use
    commercial operating systems. Instead, the majority run on royalty-free software
    that has been custom-designed to precisely match system requirements and constraints.


    However, this situation is changing, because embedded systems are rapidly becoming
    sophisticated to be supported by home-grown operating system software, and due
    to the growing complexity of today''s 32- and 64-bit processors. Internet connectivity
    weave their way into even the simplest intelligent devices. The idea of ‘rolling
    your own’ operating system is collapsing under the weight of time-to-market pressures,
    technology advances, and functionality expansion.


    The embedded market is, therefore, in transition from a mostly roll-your to a
    mostly off-the-shelf operating system model. Microsoft has developed two operating
    systems to enter this growing market for outsourced embedded operating systems,
    Windows CE and Windows NT Embedded. Linux, now available in a broad spectrum of
    variations tuned to the diverse needs of the embedded market, is ready, waiting
    and able to compete for its share of this market. A third option, made up of a
    legion of proprietary embedded systems each with unique features and benefits,
    is also vying for the opportunity to serve as the selected platform for embedded
    devices.


    Under the assumption that the future belongs to mainstream standards, the choice
    boils down to two main options: Windows and Linux.


    # Why Linux will outclass Windows in the embedded market


    # Control


    Embedded systems are about control. Controlling temperature. All these demand
    fine-tuning of the interface resources. Controlling the system''s software to
    precisely match the needs of its users and its environment.


    With commercial operating systems, your ability to adapt the OS to the needs of
    the particular application is limited. With Linux, you benefit from having a pre-existing
    operating system, including excellent tools, but with the freedom to shape and
    adapt the OS to match your application''s exact requirements, since the source
    code is readily available to modify as you wish.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'For example, one developer experienced in using both Windows CE and Linux his
    frustration with Windows CE:


    Windows isn''t open source. Microsoft won''t let you make modifications to the
    OS. Consequently, we''re all dependent on Microsoft to provide feature enhancements
    and bug fixes. But given the diversity of the embedded market, it''s impossible
    for one company (even Microsoft) to offer every feature that every embedded system
    requires. By contrast, if you need an unsupported feature in a Linux-based embedded
    system, you can simply add it. The embedded market doesn''t need forced ''standardisation''
    on a single feature set. It needs diversity and the ability to innovate for a
    particular system''s unique requirements.


    The beauty of Linux is that it offers the benefits of a ready-made OS plus the
    flexibility of a roll-your-own approach.


    # Support


    Embedded Linux has better support than Microsoft. The availability of source code
    means there are more experts to understand the problem, propose alternatives,
    and create solutions. The lack of this co-operative development model will leave
    Windows CE developers behind.


    Although Microsoft has recently expressed a willingness to give developers access
    to their source code, that source is only made available for reading purposes
    and may not be used to alter the OS in any manner whatsoever, including fixing
    bugs.


    # Rapid innovation


    The nature of the open source model is that Embedded Linux will evolve rapidly
    to meet the needs of the embedded community. Embedded Linux offers greater diversity,
    thus more opportunity, than Windows CE. The fact that there are hundreds of approaches
    to embedded Linux is a great way to ensure that at least one of them works. With
    an off-the-shelf commercial operating system such as Windows CE, if the one approach
    doesn''t work, nothing works.


    # Linux is flexible


    Linux is reaching a whole generation of new programmers, since Linux-based school
    projects are free from licence fees. This situation is reminiscent of Apple''s
    penetration of the educational system through generous hardware and software donations
    in the late 1970s and early 1980s.


    If you have tried to hire system programmers recently, you are probably aware
    of the potential benefit of a strong ''magnet'' like Linux in attracting talent.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# The price is right


    Embedded Linux pricing is infinitely flexible; you can pay as much or as little
    as you want for Embedded Linux. You can get as much or as little commercial support
    as you want. By contrast, a Microsoft OS like Windows CE, is structured pricing
    model that offers much less freedom to match your embedded system''s precise requirements.


    The cost benefit of Linux does not apply only to per-unit licence fees. It''s
    also true of the development tools used by engineers to create the system. There
    are no special tools or expensive expenses needed to create innovative and useful
    prototypes. You can find a broad spectrum of high-quality, readily available development
    tools, ranging from cost-free, open source tools to commercially licensed products
    from a wide range of specialists eager to assist with Embedded Linux system development,
    deployment and support.


    # It''s about choice


    Whenever embedded system developers select technologies and components, an overriding
    concern is the availability of alternate suppliers. Alternate source reduced risk.
    As systems become more complex and challenging to support, it becomes harder to
    justify using sole-sourced components, whether hardware or software. In the past,
    there were no alternate sourced operating systems. Now, Linux has changed the
    rules; because it is open source, it offers an unlimited set of alternatives.
    In effect, open source is the ultimate alternate source. If you don''t like your
    Linux distributor or development partner, you are free to pick another one. Or
    do it yourself. With Linux you are not locked into a single supplier, a situation
    that invariably results in increased costs to both you and your end customers.


    # The Internet


    Linux is truly a child of the Internet. Open communication, made possible by the
    Internet, is a key factor driving the open source revolution. Linux might never
    have achieved the critical mass needed to achieve its current status as a mainstream
    operating system it had not been for the ease and flexibility of communications
    made possible by the Internet. On the other hand, the Internet has benefited greatly
    from Linux. Because Linux is a child of the Internet, the protocols and communications
    requirements needed to support the Internet are woven into the very fabric of
    Linux.


    In short, Linux is connected. The Internet will certainly be a major factor propelling
    Linux into an increasing number of tomorrow''s intelligent interconnected embedded
    devices. Consider the enormous variety of possibilities for such products, and
    you will start to see the huge market opportunity for Linux.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Reliability


    We expect all embedded systems to keep running without operator intervention.
    Microsoft has not yet grasped the concept of reliability, offering ''three nines''
    (99.9 per cent uptime) on their Windows 2000 enterprise system to an industry
    accustomed to ''five nines'' (99.999 per cent). Motorola recently cast its lot
    with Linux, announcing a High Availability Linux (HA Linux), a product they will
    target to the telephony and Internet industries. Motorola says their HA Linux
    (on suitable hardware) will meet or exceed the 99.999 per cent uptime requirements
    of these reliability-intensive applications, which amounts to less than five minutes
    of downtime per year! The Motorola HA site is www.mcg.com/cfm/templates/pressrelease.cfm?pageID=725
    (Figure 6.32).


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_195_0.png)


    Figure 6.32 Linux and Motorola


    While it is not hard to locate Linux-based servers that would proclaim how much
    time has transpired since their last reboot, this is not the case with Windows-based
    systems. How long has it been since your Windows system needed rebooting?


    # Flexibility


    Unlike Windows, Linux is inherently modular and scalable. Linux can readily be
    scaled down into configurations larger than DOS, that fit on'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'a single floppy. Conversely, Linux is well known as the server platform of
    choice, and is designed into numerous Internet and telephony infrastructure programs.
    A growing number of projects use Linux as the OS platform for multi-processor
    supercomputers. Since Linux source code is freely available, it is completely
    practical to customised the OS according to the specific requirements of your
    unique embedded system. Best of all, the enhancements and extensions to Linux
    that occur from these activities are generally returned to the open source code
    base pool for others to benefit from and evolve further.


    # It''s not from Microsoft


    Perhaps one of the main reasons Linux will be selected over Microsoft products
    is the strong undercurrent of anti-Microsoft sentiment among embedded system developers.
    Dr Peter Wurmsdolder of the Centre de Transfert des Microtechniques in France


    # Conclusion


    Microsoft is the most powerful software company in the world. They are obviously
    very proficient at a lot of what they do. They have been extremely successful
    in the personal and corporate computing space, and it is evident that they gain
    an advantage when they can focus their immense resources on what is essentially
    a single, very high-volume system architecture. Consider the market where Microsoft
    has been most successful: the desktop PC market. That market consists of some
    quarter of a billion PC-compatible computers (of various shapes and sizes) throughout
    the world, which share a common system architecture, common hardware components
    and common software components.


    That sort of situation is attractive to Microsoft. On the other hand, the support-intensive
    embedded market, with its extreme diversity and fragmentation, represents a support
    headache for Microsoft and, by extension, Microsoft''s customers. This is probably
    why Microsoft has been unsuccessful in multiple attempts to penetrate the embedded
    market in the past. Who remembers Microsoft At Work, or Microsoft Modular Windows?
    Those are not the only'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'abandoned efforts by Microsoft to establish a presence in the embedded market.
    A similar fate may well be lurking just around the corner for Microsoft’s latest
    embedded offerings, Windows CE and Windows NT Embedded.


    Rest assured, however, that Microsoft will aggressively pursue a handful of cherry-picked
    embedded opportunities that share characteristics such as these: user-interface
    intensive; serving as platforms for a multiplicity of application software; relaxed
    resource constraints; moderate (not high) performance requirements; quantities
    in the 10+ million units per year. What sort of embedded devices fit these criteria?
    Few obvious ones are set-top, home entertainment systems and the automobile PC.
    Embedded device ‘killer apps’ like these will surely be the basis for some high-profile,
    highly contested battles between Windows and Linux in the future.


    However, in the extremely diverse embedded market consisting of tens of thousands
    of unique and highly specialised embedded device applications, home to more than
    90 percent of the world’s annual production of microchips, Linux shows every indication
    of becoming the operating system platform of choice.


    To find out about Embedded Linux visit www.linux-embedded.com/ (Figure 6.33).


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_197_0.png)


