- pgno: 89
  md: 'people started using Linux portables, PCMCIA and power-saving soon found its
    way into stable kernels. Generally speaking, new technologies and techniques find
    their way into the development kernels very quickly, often before they are available
    for other OSs. New technologies that are much sought after end users are likely
    to be made available as ‘unofficial kernel patches’, so that end users may try
    out new (beta) toys with otherwise stable kernels. If demand is high, the new
    toy will get a lot of use and be quickly debugged sufficiently to be a standard
    element in the stable kernel releases. If, as sometimes happens, the new idea
    is unwanted, it just disappears and may never appear as a feature in a stable
    release.


    # The kernel may be advanced, but the applications are old “second-hand” ports


    Linux users make a good deal of use of tried and trusted UNIX applications that
    have been ported to Linux; they are well known and extremely reliable. But Linux’s
    excellence as a software development platform has made it first choice amongst
    programmers, and a look through Linux archives will show a multitude of innovative
    ideas. Most of these are not yet developed enough for practical use, and of course
    ‘innovation’ does not bear fruit. Next-generation software is far more likely
    to come from a Linux platform than any other OS.


    # ‘Linux is insecure’


    Linux is, strictly speaking, a kernel, and an OS kernel is intrinsically secure,
    since it has no means on its own of communicating with the world. Break-ins occur
    via support programs that offer specific network services, and it is in these
    programs that weaknesses normally occur. Linux security may be considered no different
    to UNIX security in general.


    The Linux community takes security seriously. Many Linux systems are in the front
    line and would not last long if problems were not properly addressed. When security
    alerts are issued, fixes arrive very quickly. Linux distributors, consultants
    and large sites where Linux is deployed have people dedicated to security and,
    even in the Linux world, these people collaborate. At the same time the basic
    motto of Linux is flexibility and user choice. You can make or buy a secure system
    with Linux.'
