- pgno: 200
  md: 'who are scratching the surface with Linux, it is difficult to find something
    appropriate. Most sites are geared toward those who have reached a certain level
    of familiarity with Linux, but newcomers need to get their feet wet will have
    a lot of reading to do to find appropriate sites.


    I do not claim to have made a definitive list, or to have located the best Web
    sites for Linux beginners. I don''t even claim to have looked at every relevant
    Web site so I''m sure I''ve missed some good ones. But I have been looking around
    and can tell when information is pertinent or not. Here is a list of the sites
    I found useful to me, along with screenshots of their home pages. We are in no
    particular order.


    The Linux Documentation Project is at http://www.linuxdoc.org/ (Figure 7.2).


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_200_0.png)


    Figure 7.2 The Linux Documentation Project


    As its name implies, this is a large project whose goal is to provide excellent
    documentation on Linux, for free, to anyone who wants it. There is a lot of information
    here but some of it is a little old. The volume and level of information can also
    be a bit much for a beginner. An experienced beginner, and beyond the beginner
    stage, will find this site an excellent source that will be referred to repeatedly.'
