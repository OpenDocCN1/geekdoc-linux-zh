  md: 'ning Linux on an old laptop and get a few more productive years out of a laptop
    that might not be fast enough any more under Windows.


    In many ways Linux is much more suitable for portable operation than Windows.
    Linux seems to be more reliable coming out of suspend mode; Windows 98 will hang
    on my laptop if I open the lid without either reconnecting the Ethernet or unplugging
    the network card. Linux will not, and happily let me change networks without rebooting,
    or even logging out. My desktop machines are also reliable: they stay up for months
    at a time, shutting down only for hardware upgrades and power failures. Linux
    has always used the HALT instruction when the CPU is idle, rather than straining
    in a tight loop wasting power as Windows does. The CVS version-control system
    is wonderful for synchronising working files between work, home and the laptop.


    Using the X Window System, I can log in on my laptop from my desktop machine and
    do anything on it that I could from the keyboard. Any Windows I had open still
    there after I have taken the machine home, used over the weekend, and come back
    to the office on Monday. Because Linux, unlike NT, is a real multi-user OS, I
    do not have to log out in order to perform administration tasks or to switch between
    my work and home roles.


    Linux''s excellent multi-tasking lets lets me run both a Web server and a browser
    without using Netscape and Apache for presentations, and still have plenty of
    computing capacity left. People tend to either use laptops or desktops. I prefer
    laptops. I feel very comfortable using Linux and its unbridided computing power.
    I don''t claim to be a laptop expert, I had the opportunity to install SuLinux
    two years ago on an IBM ThinkPad 380XD and I had a problem getting it to recognise
    the PCMCIA card. This was on a Saturday morning and sent off a plea for help to
    a Linux help group on the Web. Within an hour I had 70 replies to my problem.
    I experienced the worldwide support and help available for Linux, which is given
    voluntarily by the Linux community, and I was smitten. I had my PCMCIARD operational
    and within 20 minutes was surfing the Web.


    # Did you know that...?


    Reset

    If the machine hangs and does not respond to keystrokes, it may be trapped in
    an endless loop. The only solution to such a problem is to bring the machine back
    to a defined state. This is called a reset. After a reset, the machine is exactly
    the same state as when it is started. A reset should always be preferred to a
    power-down, as this puts strain on the electronic components. Important note:
    as you might have guessed, a reset all data residing in the computer''s RAM is
    irrevocably lost.'
