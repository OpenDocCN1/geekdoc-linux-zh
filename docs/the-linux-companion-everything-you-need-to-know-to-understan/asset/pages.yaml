- pgno: 75
  md: 'his chapter discusses the ways in which you can obtain Linux software, including
    pointers to useful and informative Web sites. It goes on how to install it, avoiding
    any installation problems, the best way to migrate from one operating system (Microsoft)
    to another (Linux), and ends with a section on Linux hardware, device drivers
    and applications.


    # Where to find free software


    # FTP and Web sites


    There are many Internet sites that carry Linux software. They do not charge for
    downloads or require you as a user to make uploads in exchange. Three types of
    organisation run these sites: first, the volunteers who write the programs for
    their own use. Their primary aim is to promote use of their programs and get feedback
    from other users to help them improve the programs. Second, companies like SuSE
    who distribute full sets of Linux software. Although companies like this derive
    little income from their Web sites, the Internet provides a fast and cheap way
    to deliver updates to their customers. It also attracts new ones by offering complete
    software programs free of charge. Third, there are other organisations such as
    universities who have an interest in the free flow of software. The differences
    between the sites in terms of the core software they carry are not great and can
    again be split into three categories. Very large sites carry many unusual programs.
    There are well-organised sites that make it easy to find the materials. Finally,
    there are specialist sites that focus on a particular area of interest or concentrate
    on leading-edge Linux software technology.


    # CD-ROM distributions


    There are also CD-ROMs available containing large sets of programs. The better
    ones are produced by groups interested in a particular program or by distribution
    makers. An example is the POVray CD for 3D graphics. There are also several sets
    of CDs available, which aim to be comprehensive, and hold a tremendous amount
    of software on 10 volumes or more. However, unless you have some expertise, they
    can be a waste of time, as they are sometimes badly organised.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# How do I install free software?


    # Package managers


    In the early days of Linux simply producing a working system took a great deal
    of work in obtaining the correct programs. Usually the user would have to spend
    time compiling the programs. Much technical know-how was required to get the simplest
    things to work. Modern Linux systems have overcome these problems. The main tool
    they use is a system called a package manager. Package managers know how different
    programs interact. Take the example of installing a working email server. The
    package manager will check for Internet connectivity before installing the mail
    program. If the necessary software is not installed it will automatically install
    it or stop with an error. Package managers know how to install most available
    programs. The people writing the package add this information. They examine the
    program and bundle extra information and set up scripts with it. The package manager
    then uses this extra information to install software automatically.


    This extra information will include data on the version numbers and facilitates
    the programs so keeping up to date is easy with a package manager. Finding and
    installing Linux software is easy with the aid of the package management software.
    All the major distributions offer something. The crudest and oldest is the Slackpkg
    program. Red Hat''s RPM system is more sophisticated and is the most widely used.
    Debian distributions include several tools including apt, dpkg and dselect that
    together act as a powerful package system.


    The one major problem that Linux does currently is with commercially available
    software. Although Linux is strong in free software, if you have a favourite commercial
    package you would like to use Linux you may have to wait for it. Currently many
    manufacturers are promising Linux versions but there are not many applications
    available for Linux as there are for Microsoft Windows.


    In terms of usability, this is a real problem, switching to an alternative program
    can affect productivity. The solution is in the hands of the applications software
    makers. Given the many advantages of Linux, software makers are turning to it.
    It is only a matter of time before Linux becomes a major market for commercial
    software and free software.'
  merge: -1
  img_proc: true
