- pgno: 180
  md: '# The Linux Professional Institute site


    While the move to provide certification replicates the Microsoft and Novell models,
    the similarities end there. Each offers a real opportunity for development of
    vendor-neutral certification. The Linux Professional Institute''s approach is
    to define distribution-neutral and vendor-neutral certification standards. Its
    multi-level program of exams – the first launched in late 1999 – is being administered
    through Virtual University Enterprise test centres. The Virtual University Enterprise
    Web site is at www.vue.com/linux/ (Figure 6.24).


    The Linux Professional Institute is supported by contributions from business and
    individual sponsors, and its advisory council boasts not only major Linux and
    computing vendors and training providers, but even Novell, a Linux competitor.
    The easiest way to gain corporate, is to ensure there is a bon fide support mechanism
    in place. Certification also provides industry recognition, an academic path for
    students and a mechanism for training centres and recruiting new Linux users.


    The Linux Professional Institute is currently developing three levels of certification
    exams and is tabulating results of the first exam taken by 50 students in late
    1999. The first level will feature three exams: a general Linux exam, an advanced
    exam, and an exam certifying privatisation in a specific distribution system.
    Levels 2 and 3, still in development, will offer administration...


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_180_0.png)'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# VUE exam registration at the LPI site


    The Institute''s certification will provide employers with a standard gauge to
    measure technical quality and competitiveness of a given candidate. The programme
    system and network administrators, job titles such ''high growth'' for Linux support.
    When the Linux Institute revealed that certification exams were in development,
    1900 interested students immediately registered for email notification of exam
    dates. When the first exam went live, 300 people registered for it within 48 hours.
    While the first wave of students appeared to be mostly UNIX professionals, their
    Linux classes are a mine of professionals, causing trainers to move quickly to
    offer new courses.


    Until now, Linux has been a cult, but now it is moving into the mainstream, which
    is where the need for training and certification comes in. As Linux gains in popularity
    and becomes more commercial, there is a growing need for training and certification.
    Clients are asking for Linux training materials, but trainers are unavailable
    to provide them.


    Linux supporters say that the operating system will continue to grow for several
    reasons: it is similar to UNIX, and it does not require as much administration
    as competing systems. Experienced UNIX programmers can expect to achieve Linux
    certification in about two to three months, the time it would take to become a
    Microsoft network engineer or system administrator.


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_181_0.png)'
