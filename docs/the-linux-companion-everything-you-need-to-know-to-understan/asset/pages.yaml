- pgno: 103
  md: 'WordPerfect a much smaller disk and memory requirement than the integrated
    packages, taking about 6Mb of memory to run and 55Mb of disk space for a full
    install. It''s also fairly economical in terms of screen space; it should be fine
    on smaller, older systems. Despite this, it''s not short on power features. In
    terms of word processing facilities, WordPerfect is the equal, superior, of any
    of the integrated packages. In addition, it has some basic setting controls that
    StarOffice and word lack, such as kerning and word/letter spacing controls, which
    make it fundamentally better suited to lightweight DTP (desktop publishing) And
    while it is confusing key bindings, it also understands the UI keystrokes as Alt-F
    for the File menu, then S for Save. The list of formats that WordPerfect 8 understands
    huge, including items like Island Write and Interleave, which will be of use by
    people coming from a UNIX text-processing environment, as well as Windows users.


    On the minus side, WordPerfect cannot convert AppWare or StarOffice documents.
    To be fair, those two packages cannot operate with one another, either. And any
    attempts to import rich text format (RTF) of Word documents created with WordPerfect
    fail, possibly because RTF is not one file format but actually has about a dozen
    different versions that Microsoft puts the name on. If you don''t need a lower-end
    system, I would strongly recommend WordPerfect as your word processor.


    # LyX


    LyX pronounced ‘licks’, and the KDE version, KLyX, is not a word processor. It
    is a graphical front end for the LaTeX typesetting system; you can get it from
    www.lyx.org and see it in Figure 5.7. It behaves like a word processor, and you
    use it for the same purpose, producing efficient printed documents.


    Word processors all attempt emulate typewriters, since people began creating the
    first word processors, typewriters were the users expected. You may use a type
    of text and underline bits of it, or insert markers into the text to indicate
    that the selected chunk is in a different typeface. LyX will not let you do that,
    because LyX is a front end for the LaTeX typesetting package. Tex is a compiler;
    you feed in file containing instructions and it emits PostScript, or an intermediate
    format, called DVI, containing the human-readable text formatted in accordance
    with those instructions. LaTeX (pronounced ‘lay-tek’) is a set of macros, Tex
    programs that give you a useful set of commands for formatting bits of a document;'
  merge: -1
  img_proc: true
- pgno: 104
  md: '![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_104_0.png)


    Figure 5.7 The LyX home page


    if you type \address{hello} in a LaTeX document, TeX will ''hello'' using the
    address style defined by LaTeX.


    TeX and LaTeX are loved by scientists because they produce high-quality documents
    — typesetting quality, in fact, with beautiful kerning and tracking, excellent
    hyphenation control and all the things that professional editors like to see in
    an academic paper. In fact, most referred journals expect papers to be submitted
