    # # VMware


    There is another PC emulation environment you need to know about: VMware. VMware
    enables you to run Windows 98 or NT as an application under Linux or vice versa
    by handling context switching between OSs. VMware is commercial and you have to
    pay for it, though it is worth every penny, by a 30-day limited demo at www.vmware.com
    or in a copy of the SuSE 6.4 distribution (Figure 5.17).


    VMware is not just an emulator. It is a complete virtual machine ‘built'' on the
    underlying layer of hardware and the existing operating system. It does not take
    control of your keyboard, mouse and video; you can run it in full-screen mode
    as in a window. This, however, requires some modifications to get everything to
    act as usual. The virtual machine runs on top of the existing OS, using its devices
    to access the underlying hardware. The great advantage of this is that you can
    have up to four virtual network adapters on your virtual machine, and have them
    all bound to the network, which uses the hosting OS as the gateway.'
