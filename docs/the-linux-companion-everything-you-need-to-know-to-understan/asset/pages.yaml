- pgno: 142
  md: 'In this chapter you will learn some background information on SuSE – the company,
    how it started, how it has evolved and where it is today – some of the many commercial
    implications of Linux and main open source products.


    # SuSE


    SuSE, pronounced zoo-zee, was established in Germany in 1992, making it one of
    the oldest Linux companies. The stamp of the company''s four founders, three mathematicians
    and one computer scientist, all of whom hold masters degrees, is apparent in the
    meticulous development of its software and in SuSE''s commitment to open source
    development.


    SuSE''s goal is to manage the continuous changes in Linux by bundling and issuing
    its version changes with mission-critical applications firmly in mind and to provide
    world-class consulting and services to its business partners.


    SuSE is the leading distribution of Linux in Europe has 12 offices in Germany,
    the UK, the USA, Italy, France and the Czech Republic, and over 50,000 installed
    business customers. The attendees of Linux World Expo in February 2000 visited
    SuSE the Show Favorite Distribution, as they had the previous year.


    SuSE Inc., SuSE''s North American subsidiary, located in Oakland, California,
    provides consulting, technical support, Premier Partner programs and sales support
    to customers, resellers and distributors.


    SuSE offers the most comprehensive packages of Linux-based applications. SuSE
    Linux is available both on CD-ROM and DVD, being the first distribution to be
    available. Version 6.4 featured over 1500 applications as well as a remarkably
    installation process. Targeted at both the desktop and the server market, this
    encyclopaedic library of tools also includes resources for software developers,
    Linux users, network administrators and businesses as:


    > Did you know that...?

    Base Linux

    When you install Linux for the first time, the base Linux has to be brought up.
    It works without the hard disk, which is not accessible at this point. Its kernel
    is on the boot disk or on CD-ROM. The root image (also on CD-ROM or on the boot
    disk) is loaded into a RAM disk. The other programs (for example, YaST) are also
    loaded into the RAM disk. After the first login, you start YaST and prepare for
    installing the ''real'' Linux.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'the latest Linux kernel technology (2.2.14), with its impressive performance,
    networking and multimedia hardware support advances;


    customisable, user-friendly KDE desktop environments;


    Informix SE, MySQL and PostgreSQL databases.


    SuSE Holding AG, based in Nuremberg and the parent company for all other SuSE
    branches, is a privately owned company. Its four founders, Roland Dyroff, Thomas
    Fehr, Hubert Mantel and Burch Steinbild, and a group of employees currently privately
    own SuSE.


    The successful initial public offering (IPO) of Red Hat Software in 1999 has brought
    the Linux operating system to the attention of investors in a way that could never
    have been imagined before. Red Hat, a Linux distributor, is now capitalised at
    £3.9 billion. Meanwhile, other companies in the Linux market have also gone public.
    Well-known examples are Caldera and VA Linux, the latter of which has enjoyed
    the attention of investors. SuSE is currently also working on their IPO, although
    no definitive date for this step has been confirmed yet. Being one of the rare
    examples in the Linux market that has already enjoyed healthy revenues in 1999,
    SuSE''s IPO is likely to be a success.


