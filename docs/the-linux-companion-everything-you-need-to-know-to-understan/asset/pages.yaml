- pgno: 174
  md: 'IBM is also expanding its education curriculum for Linux users, including both
    classroom and Web-based courses available through IBM Global Services. IBM also
    said its Linux-based servers will link to AS/400 servers with the release Yellow
    Dog Linux Champion Server 1.1 from Terra Soft Solutions Inc.


    Network architects who want a taste of the free life know that open source servers
    can be deployed alongside NT machines or both. A free software utility named Samba,
    available on many open source sites, allows Linux to deal with Microsoft Server
    Message Block (SMB) the protocol that NT, Windows 95 and Windows 98 machines use
    to exchange data. Once Samba is installed, Linux and BSD boxes are recognised
    as peers by Microsoft platforms.


    It is the same story with Netware, except in this case the free utility is called
    Mars. The software emulates Netware 3.x, enabling open source servers to access
    file and print resources. Samba is an outstanding piece of freeware.


    # Software giants


    Anything that worries Microsoft, and Linux certainly has, invariably interests
    other software companies. Many in the industry have suddenly declared their support
    for open source software, with Microsoft apparently alone in its distrust of Linux.
    While most of these companies do not plan to change their business models radically
    by releasing their own proprietary source code to the public, they recognise the
    advantages of aligning themselves with the open source movement. In return for
    their support, these companies cultivate a new user group and gain the support
    and input of an active community of developers.


    Large software vendors are expressing their support in a number of ways. Netscape,
    by giving away its browser and releasing its source code, represents one extreme.
    IBM took another tack deciding to bundle the open-source Apache server software
    with its WebSphere Internet commerce package; IBM is also offering free downloads
    of other early-stage software in exchange for developers'' comments and suggestions.
    But by far the most common approach, taken by Hewlett-Packard, Oracle, Unix Microsystems,
    Informix and Computer Associates, have been to announce plans to port proprietary
    software to run on Linux.


    This decision is primarily a response to a growing number of Linux users who are
    demanding vendor support for the operating system. The user'
  merge: -1
  img_proc: true
