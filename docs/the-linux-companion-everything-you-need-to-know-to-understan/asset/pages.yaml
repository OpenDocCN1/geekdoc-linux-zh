- pgno: 133
  md: 'Due to a lack of support by some hardware manufacturers, not every feature
    of a laptop is always supported or fully operational. The main devices which cause
    trouble are graphic chip, infrared (IrDA) port, soundcard, PCMCIA controller,
    plug-and-play devices and internal modem. Try to get as much information about
    these items as you can before buying a laptop. However, often it is very difficult
    to get the necessary information. Sometimes even the specifications or the helpline
