  md: 'nity, it is not as bad as it first appears. Most major programs are released
    in a number of different formats, one for each of the popular distributions. And
    nearly all Linux software is also released as a source code ''tarball'' which
    can be compiled and used without the need for an install/uninstall utility.


    That said, it should be noted that the users who need Linux to run a specific,
    single application should buy the distribution to match the application which
    supports it, and not vice versa.


    # Source compatibility exceptions


    Source code is the set of instructions which, when translated into machine language,
    make a program which a computer can execute. Source code is written by humans
    using computer programming languages like C or C++. Linux is different from operating
    systems like Windows or MacOS in that nearly all source code is available to users
    at no extra cost, including the code for programs and for the operating system


    Linux source code is largely ''portable,'' which means that code can be translated
    into machine language on any Linux computer. There are exceptions to this rule,
    however; most, these exceptions come with age. As was the case with binary executables
    above, old Linux source code is less likely to translate correctly into machine
    language on newer Linux computers, and newer source code is less likely to translate
    correctly into machine language on older Linux computers.


    Tools exist to make source code more globally portable, and many programs already
    make use of these tools to ensure that the code they created on their machine
    will easily translate into machine language on your machine. As time progresses,
    these tools are likely to be used more and more often; we may find that source
    compatibility issues become non-existent in the future. Until then, if you are
    planning to compile your own programs (instead of installing programs created
    by others), the best way to ensure absolute source compatibility from machine
    to machine is to ensure that both machines run identical Linux distributions.


    # Which kind of Linux is right for me?


    It can be difficult to choose a distribution when so many exist, and aside from
    the differences between various Linux distributions, users should also remember
    that Linux is available in multiple forms: as a download, in a book or on a CD-ROM.
    Which of these distributions and/or formats is right for you? Your call but I
    have always come back to SuSE Linux.'
