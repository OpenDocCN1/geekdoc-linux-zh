- pgno: 90
  md: '# The Microsoft perspective


    Microsoft has thrown out a challenge to the biggest threat to its Windows NT operating
    system, listing reasons why it considers NT to be a better operating system than
    rival Linux. The single page titled Linux Myths is published by Microsoft on its
    Windows NT server Web site. You can find it at http://www.microsoft.com/ntserver/nts/news/LinuxMyths.asp.
    This page sums up its assessment of Linux by saying the operating system ''is
    not suitable for usage by business or home users''


    # Linux counter-FUD site is launched


    A Linux counter-FUD site (Figure 5.1) is available at http://noFUD.linuxtoday.com.


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_90_0.png)


    How did it get started?

    In 1999, Linux sent some nasty replies back to the members of the Linux community
    who were saying that Microsoft was being aggressive at all to computer technology.
    The replies, which were sent back after the Halloween, around November 1999, were
    detailed in a Microsoft engineer''s argument that the ''Hate'' proved to Microsoft''s
    market frequency. The replies were sent because they were never asked for. The
    Linux community launched the barrage of FUD—fear, uncertainty, and doubt—that
    met experts said Microsoft to swallow and Linux. So they started talking about
    ways to counter the attacks.


    When was Linux-FUD site opened?

    Linux-FUD site was started after the LastWorld Computing & E-i. went bust in March
    1999. In August, Colorado, the commercial software vendors in Linux had proved
    to be unreliable. The importance of the mouse, keyboard, monitor, printer and
    sound card was critical. The site countered the misconceptions. Linux is only
    made for dicks, that support is not available, or stable.


    Noted: ''meridional evidence doesn''t counter FUD''

    Linux-FUD was created following the news story that Linux was being attacked by
    day and night, over what was needed to counter the FUD factor that puzzled many
    at the time. We noticed a ''confusion''—the type of confusion that has always
