- pgno: 144
  md: 'When you compare SuSE''s revenues to those of Red Hat, it appears that SuSE
    is the largest Linux distributor in the world with sales of £15.2 million in 1999
    versus some £10.3 million for Red Hat. Licence revenues are similar for the two
    at £6.9 million.


    International Data Corporation (IDC) statistics show Linux to be the fastest growing
    operating system in the market, with a current volume share of 25 per of the server
    market. Linux should continue to experience strong market gains in the server
    market and the significant penetration of the desktop is promising in the medium
    term. Figure 6.1 shows a CDE desktop.


    # Open source versus closed source software


    The code for any program can be presented basically in one of two formats: in
    machine-readable binaries (zeros and ones) or in human source code. It is extremely
    difficult, almost impossible, to alter any program if one only has access to the
    binaries and the program remains closed. Access to the human-readable source code
    allows a user to modify the program according to their needs.


    Did you know that...?


    Basic Input Output System (BIOS)

    Every PC includes a small memory area containing the BIOS. This is a system of
    programs for executing basic operations connected to the hardware such as memory
    check and recognising hard drives. In Linux, the BIOS is not active, since it
    runs in real mode, and is switched off by the kernel at boot time. The Linux kernel
    has much more capabilities than the BIOS.


    Nearly all of the code-packaged applications vendors such as Microsoft, SAP, Oracle
    and so on closed source. These companies regard their source code as proprietary
    knowledge developed from their own investment in R&D and believe that releasing
    such code would be to lose a major competitive advantage.


    Open source groups are developing software that in many cases challenges the closed
    source companies. Having supplied much of the software that provides the infrastructure
    of the Internet the open source movement is now making deep inroads into the operating
    systems market with Linux and is more aiming at the applications or end-user market.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# # Defining open source software


    It is comparatively easy to define the difference between open and closed source
    software. It is much more complex to determine what is truly open source software.
    Many different forms of licensing exist, which offer different strains of open
    source software, and there is much animosity over which of these licences can
    be truly labeled open source. The different types of licences are an important
    topic when looking at a distributor such as SuSE, as they affect the ability to
    commercialise the software and to attract developers to maintain and modify the
    code.


    Microsoft''s internal review of the open source movement, nicknamed the Halloween
    Documents, can be seen at www.opensource.org/halloween/ (Figure 6.2).


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_145_0.png)


    Figure 6.2 The ''Halloween documents''


    Within these memos there was an overview of the types of software licensing available
    and applicable to open source.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'Though there are many types of software code available free of charge, the
    open source stipulation is to have the source code available and modifiable. There
    are, however, variants on this, for example, Sun''s Community Source License under
    which it releases the source code for Java, Jini and now Solaris. The licences
    are different principally in terms of the amount of control exerted over the code
    by the group which maintains it and the freedom that is given to others to make
    closed derivatives. Another example is the Mozilla License that is widely considered
    to be more business-friendly.


    The type of licence applied to most components of a Linux distribution is called
    Copyleft, the principal form of which is the GNU Public License or GPL. This is
    critically different from all the others in that any modifications to the code
    must be kept open source. This means that it is not legally possible to add proprietary
    code and create a different/closed version of the software that could be sold
    commercially. Copyleft is also discussed earlier in this book.


    The open community divides broadly into two camps: those that believe the GPL
    is the only proper and moral way to license open source software, as the Free
    Software Foundation, and those that have a less restrictive outlook on licensing,
    as long as the code is freely modifiable, i.e. the Open Source Group. This last
    group distinguishes open source software as superior to closed software, because
    they believe the development process will produce a superior product. They represent
    the more commercial arm of the open source movement and are keen to co-operate
    with big businesses in order to further the penetration of open source software.
    The former believe it is wrong to hoard software by having proprietary code and
    as such represent a less business-friendly strain of open source.


    # What are the implications of this to SuSE?


    The SuSE distribution contains components with licences of all types. It also
    contains its own proprietary software, the set-up tool YaST. While FSF (Free Software
    Foundation) advocates much cringe at the assortment of licences in the SuSE distribution,
    that is not the case for the Open Source Group, to which Linus Torvalds belongs.
    Consequently there is an effectively commercially oriented group of developers
    supporting what SuSE is doing.'
  merge: -1
  img_proc: true
- pgno: 147
  md: "# What is the source of all the free software?\n\nThe Open Source Software\
    \ movement began in universities in the USA in the early 1970s where it grew out\
    \ of the UNIX community. The UNIX operating system was developed at AT&T&s Bell\
    \ Labs in 1969. However, since AT&T was a government-regulated monopoly, it was\
    \ not allowed to compete in the computer business. As a result it licensed UNIX\
    \ to universities for a nominal fee, and students could have access to the source\
    \ code and alter it as they wished. The changes could then be shared between anyone\
    \ with a licence. This built up an abundance of UNIX experts in the educational\
    \ centres of the USA who learned to develop code together and to fix bugs as they\
    \ arose. These programmers went on to create the infrastructure for the Internet,\
    \ the bulk of which is open source and freely downloadable. In turn the Internet\
    \ enabled communication between widely dispersed developers, which became the\
    \ development model for projects such as Linux.\n\n# Definition of free software\n\
    \nThe following quote is from the FSF founder, Richard Stallman:\n\n> The term\
    \ ‘free software’ is sometimes misunderstood; it has nothing to do with price.\
    \ It is about freedom. Here, therefore, is the definition of free software: a\
    \ program is free software, for you, a particular user, if:\n\n You have the freedom\
    \ to run the program,\n You have the freedom to modify the program to suit your\
    \ needs.\n (To make this freedom effective in practice, you must have access to\
    \ the source code, since making changes in a program without having the source\
    \ code is exceedingly difficult).\n You have the freedom to redistribute copies,\
    \ either gratis or for a fee.\n You have the freedom to distribute modified versions\
    \ of the program, so that the community can benefit from your improvements.\n\n\
    Since ‘free’ refers to freedom, not to price, there is no contradiction between\
    \ selling and free software. In fact, the freedom to sell copies is crucial: collections\
    \ of free software sold on CD-ROMs are important for the community, and selling\
    \ them is an important way to raise funds for free software development. Therefore,\
    \ a program which people are not free to include on these collections is not free\
    \ software."
  merge: -1
  img_proc: true
- pgno: 148
  md: 'While Linux is the name under which most of us know the operating system distributed
    by companies such as SuSE and Red Hat, the FSF, in particular Richard Stallman,
    is responsible for the creation of a large number of crucial operating system
    components that make up the whole system. Linux just relates to the system kernel.
    Many of the other components come from Richard Stallman''s GNU Project, discussed
    below.


    # The GNU Project


    Stallman wanted to create an operating system that was based on UNIX but offered
    an open source and freely downloadable alternative to the many commercial variants
    of UNIX available at the time (the project started in 1984). This was the starting
    point for the bottom-up rebuild of the UNIX operating system that has led to Linux.
    GNU components now make up a large part of any distributor''s offering. Some of
    these components are as follows (see Figure 6:3):


    +   - CC (GNU C Compiler) – the most widely used compiler in academia and the
    OS world.


    +   - GNU Emacs originally a powerful character-mode text editor, over time Emacs
    was enhanced to provide a front end to compilers, mail readers and so on.


    +   - GNU GhostScript (PostScript printer/viewer) – this is a good example of
    how combine commercial software and business; GhostScript is released in a commercial
    and a free version.


    +   - GNOME GUI for Linux.


    The GNU Project has created almost every component of a UNIX-like operating system,
    except the kernel. Despite the fact that there is a kernel in production, the
    GNU HURD, it is not yet ready for use. This has not made a difference: as Torvalds
    Linus created the Linux kernel in 1991, and since then, the blending of the Linux
    kernel and the GNU components have been known as the Linux Operating System.'
  merge: -1
  img_proc: true
