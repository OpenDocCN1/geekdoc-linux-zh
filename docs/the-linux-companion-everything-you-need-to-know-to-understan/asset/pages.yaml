  md: 'reason why software manufacturers offer amazing discounts on software to students
    and educators. As a student you can buy MS Office very cheaply. When you are no
    longer a student and need to upgrade, what will you buy? You will most likely
    buy what you are familiar with, and this time you have to pay the full price.


    A problem with getting Linux into the hands of students is convincing the people
    who make the decisions that Linux is good and will help their students function
    in the real world. Most administrators think this teaching students to use Windows
    and MS Office. Administrators believe that teaching a student how to use a specific
    application that helps them perform better later in life. Too many times have
    I seen so-called computer education classes as simple scripted classes where a
    student is simply led by the motions of pointing and clicking. We need to show
    administrators that this does not truly help a student, that we should teach a
    broader understanding of the concepts involved. If we can teach those concepts
    then students can apply them to a wide range of situations, applications and operating
    systems.


    The one big advantage Linux has over Microsoft in the eyes of most school authorities
    is cost. Most school authorities are under pressure to get computers into their
    schools and get students using them. Most school authorities are underfunded anyway
    and this puts a lot of pressure on the individual budgets. If Linux could show
    authorities that by spending the same amount of money they can buy more machines
    and as a result get computers in front of more students, then it would stand a
    chance.


    First us create a typical school authority. This school authority has 15 schools
    in total with 750 teachers, an average of 50 per school. The authority set a target
    of giving each teacher a personal workstation, two 30-station labs in each school,
    and three student workstations in each classroom. All the computers in the authority
    are networked together and fed into a central server. The authority would need
    a minimum of 3901 systems in order to meet this goal; the extra system is the
    server.


    Let us look at the operating system and software costs involved of deploying all
    the workstations. Each workstation will have a minimum of the OS and an office
    suite installed on it. The typical cost for Windows NT/98 and MS Office is around
    £100, compared to what a normal user has to pay. So, for all 3900 workstations
    the OS and office suite would cost £403,450. Now, we have to calculate costs for
    the server OS and seat licences etc. The final costs are staggering, especially
    for small authorities that do not have large budgets in the first place.


    Again, one of the advantages of Linux is that it is free. A real example of this
    took place last year, when the Mexican government embarked on an ambi'
