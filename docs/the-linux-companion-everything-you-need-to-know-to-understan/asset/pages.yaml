- pgno: 126
  md: '# Hardware requirements for VMware:


    +   1. Standard PC with Intel Pentium or compatible processor (Pentium II or recommended).


    +   2. Minimum 64Mb memory (96Mb recommended).


    +   3. 3Mb disk space for basic install.


    +   4. At least 500Mb free disk space recommended for each guest operating system
    and application.


    Rarely do you find a product that makes you think that this is how the future
    of computing will evolve, but VMware is possibly that. The technology behind VMware
    software is nothing short of remarkable, enabling a user to run a second operating
    system in a virtual environment in Linux.


    With the rapid advance of mobile code on the Internet, having a virtual machine
    that runs within a browser and implements all code before it hits the client machine
    will prevent many nasty surprises. Sun has attempted this with Java''s sandbox
    architecture, but VMware does not require a specific language or operating system.


    This technology also could be used in everything from microwaves to cars, selecting
    embedded systems to allow software written for Windows to run on top of real-time
    operating systems.


    VMware acts as a layer between the hardware and the operating system. VMware stress
    that the product is not an emulator, but it most commonly looks like one to.


    VMware abstracts the hardware and intercepts most signals going to the CPU. Products
    such as the open source WINE, in contrast, translate the Win32 APIs into Linux-compatible
    calls, allowing Linux to run Windows applications. Each method has advantages:
    translation can be faster, but emulation offers a higher level of compatibility.


    # Ease of installation


    VMware for Linux installs effortlessly on a 233MHz Pentium PC running Linux. To
    configure the machine, I simply allocated memory and hard disk space to the virtual
    machine, where I installed Windows NT 4.0 along with Service Pack 4. VMware runs
    any Windows operating system and applications without partitioning or rebooting.
    VMware''s emulation was evident in the virtual machines: all that NT saw for networking
    was the Advanced Micro Devices Ethernet network interface card.'
