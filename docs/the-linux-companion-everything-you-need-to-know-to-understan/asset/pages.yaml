- pgno: 8
  md: '# About the author


    Christopher Lynas is a globally acknowledged Internet consultant and commentator.
    He has seen the Internet evolve at an astounding rate as a business tool. In this
    time he has also witnessed the growth and exponential development of Linux, each
    step of progress confirming his belief that it is the next big thing. He has challenged
    audiences from a wide range of industries in many countries to acknowledge the
    massive changes in their market sectors, due to these developments. How will we
    do business as the twenty-first century unfolds? What will we experience in our
    family and leisure time? He effectively bridges the gap between technology and
    the layperson, enlightening his audiences and encouraging them to study and respect
    the new and emerging technology.


    With humour and finesse, he confronts his audiences with the truth of what they
    need to do, and how they need to think, to move into the future with success and
    optimism. Christopher Lynas is a sought-after speaker, dealing with how to adapt
    to the e-world society and the development of Linux.


    He is a member of The Writers Guild and CimTech – The Chartered Institute of Marketing''s
    Technology Interest Group.'
  merge: -1
  img_proc: true
