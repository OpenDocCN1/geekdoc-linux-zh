    Some secondary differences annoy people who expect LyX to behave like a typewriter.
    Do you instinctively insert multiple spaces after a full stop? LyX (and TeX) will
    ignore them. TeX has its own ideas about how to space out a line, and a carriage
    return does not mean ''end of line'': it means ''start a new paragraph''. Subtle
    differences, but they may take some getting used to if you are working with a
    typesetter.


    The quality of output LyX produces is unsurpassed. If you want to grind out essays,
    papers or a book, Linux is highly recommended.


    # Unfamiliar aspects of Linux – an historical perspective


    Linux comes from the wonderful world of UNIX, and a lot of the common tools of
    the PC world do not have exact equivalents in UNIX. UNIX did not evolve big monolithic
    applications like word processors or spreadsheets; extremely powerful processes
    could be constructed from simple tools, instead of needing one powerful program
    to do all the tasks relating to one problem domain.


    For example, UNIX originally spread throughout Bell Labs in the early 1970s as
    a typesetting and word processing system. instead there was the tro typesetter;
    similar to TeX but more primitive and with a tendency towards obscure commands,
    it has been called ''the assembly language of desktop publishing'' with good reason.
    The ed text editor came later, then vi, emacs and others.


    These tools are still part of the Linux heritage, and you can find their up-date
    descendants such as groff, GNU troff, or vim and vi-Improved in any Linux distribution.
    These programs do not have graphical interfaces, and in many cases they have no
    online help, but they work, and still do the job.


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_105_0.png)'
