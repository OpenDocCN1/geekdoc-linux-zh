- pgno: 155
  md: '# Why Linux poses a threat to established operating systems


    The principal benefit that Linux has over the existing closed source operating
    systems is the number of developers working on it from all over the world. This
    has been an important motivational strength in the creation of open source software.
    To a great extent it has been done simply because developers had a problem that
    they needed to solve and did so.


    The Linux operating system is a serious challenger to much older systems in terms
    of stability, scalability and functionality. The last major upgrade to the Linux
    kernel (version 2.2) was in January 1999. There is on average one release per
    week and more stable releases about once a month.


    The aspiration of being the world''s dominant operating system is now clearly
    in the sights of the developers and, if anything, this is likely to stimulate
    development even more. Linux distributors will now pay programmers to develop
    their system as their principal source of revenue. The development of Linux is
    one of very speedy conversion to any of the characteristics of operating systems
    and it is catching up steadily.


    Linux comes at a much lower cost than traditional operating systems. It is not,
    as many people believe, free. As discussed earlier, to have a stable version of
    a software program a company needs a distributor who can provide updates and patches,
    and there are considerable service and support costs associated with using Linux,
    as there are with any other operating system. To give an example of costs, you
    can buy Windows NT workstation online for £200. You can buy SuSE online for about
    £35.


    # What can you run on Linux?


    Linux has been a success in the server environment. This has been due to the fact
    that it has offered a cheap, non-resource hogging platform that is readily compatible
    with a variety of open source applications. The availability of applications is
    a key factor for any operating system. On top of the open source contributions
    there is an ever-increasing number of commercial applications that have been ported
    to Linux, such as Oracle and SAP.'
  merge: -1
  img_proc: true
