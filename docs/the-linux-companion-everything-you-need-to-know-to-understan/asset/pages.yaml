    # What are the quality controls in Linux?


    Because all programmers are free to work on the Linux kernel and to con-ribute
    their ideas, there is still substantial control over the whole process monitored
    by Linux Torvalds, who generally has the last word on any debate- issues. He delegates
    a lot of the day-to-day scrutiny to a handful of trusted colleagues. The continual
    beta processing indicates that many ideas compete for a place within the kernel
    and there is consequently a great deal of effort involved, thus leading to extremely
    high-quality code. This is different from the situation in a commercial organisation
    where an individual may be assigned to a project for which he is not best suited
    or where an individual may consider a project complete while others might disagree.
    Additionally the'
