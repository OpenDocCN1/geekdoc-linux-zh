- pgno: 91
  md: '# # The scale of the change that has to happen for Linux to take the place
    of Windows


    People in the Linux community have been talking about ''world domination'' for
    some time now. Just how seriously people take this, and in what timeframe, is
    hard to judge. But the magnitude of the change that would have to happen in order
    for Linux to replace Windows is one of things that has a writer searching for
    words that would do them justice. Laying out the scale of Microsoft''s market
    dominance is the only way to describe it.


    # ## 90% of computers in the world


    Windows runs about 90 per cent of all the computers in the world. The standard
    productivity applications for businesses worldwide are Microsoft Word, Excel and
    PowerPoint, and most large corporations have major investments in customisations
    that would be expensive to port if they considered switching.


    Microsoft Outlook powers the email servers and clients for most of the businesses
    using Microsoft Windows and Office. Windows NT now handles file and print sharing
    in most of these same businesses. And for most, Microsoft Back Office takes care
    of much of what remains.


    **Developer Tools** Microsoft ''Visual'' developer tools are used in a large proportion
    of application development, in applications both for resale and internal use.
    And the ''tight integration'' between all the Microsoft products makes it easy
    for corporate IT departments to stitch together any and all of the pieces to create
    large, complex systems with relatively little effort.


    **Applications** The vast majority of application programs are available on Windows.
    Most application programs are released first on Windows, and then ported to other
    platforms, if they ported at all. Many Internet browser plugins are available
    only in Windows-specific versions.


    **UNIX under siege** The only areas still holding out against the Microsoft juggernaut
    are very high-end servers and engineering workstations that run UNIX, and Microsoft
    has been promising that NT 5, now renamed Windows 2000, will take away a big chunk
    of that market.


    So even if alternative technology somehow emerges, and is clearly superior to
    a Microsoft product on all counts, the sheer scale, scope, magnitude, whatever
    you choose to call it, of the change that would have to take place for alternative
    to a Microsoft product to present a serious challenge to this market dominance
    is absolutely mind baffling. Even more so for Linux, when you consider that switching
    from proprietary software to open source is a much'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'bigger change than just switching vendors: source requires any commercial vendor
    who wants to make money from it to make big changes to their business model, and
    it requires any corporate IT department that adopts it to make big changes to
    the way they deploy and support software.


    # Change is underway


    However, this change to Linux is happening. A change of incredible proportions
    has been underway since early 1999, when the number of commercial vendors announcing
    support for Linux jumped dramatically. When the Linux bandwagon first began to
    roll, the press suggested, and many members of the Linux and open source communities
    feared, that many of the early announcements might turn out to be just hype, and
    much of the promised support would never be delivered. Less than a year later,
    these fears can be forgotten; a careful examination of the mainstream press uncovers
    an extraordinary picture of the change that is already well under way.


    If you do a series of searches on one very focused topic in the Linux news, such
    as GUIs available for Linux, Linux deployments in business, or what a single vendor
    such as IBM, Compaq or Dell is doing to promote Linux, and browse through the
    articles published since early 1999, then you will realise that what''s happening
    with Linux is massive.


    Repeat that process on all the Linux news that you can think of, and then consider
    all your findings together; then you can appreciate the magnitude of what is happening
    and soon realise that Linux has the potential to accomplish this David versus
    Goliath task.


    # Office applications and word processing


    This section will examine the remarkable world of office software, concentrating
    on spreadsheets and word processors. There are basically three categories of office
    software you need to be aware of on Linux.


    There are integrated office suites similar to Microsoft Office. There are stand-alone
    applications, word processors and spreadsheets. And there are tools that are neither
    word processors nor spreadsheets, but serve the same function.


    These latter items characteristically come from the UNIX rather than being ports
    of Windows applications; I include items like the TeX typesetting system and the
    LyX graphical front-end in this, because although LyX isn''t a'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'word processor you can use it to write letters or books or do the same sort
    of things you''d do with a word processor.


    In the integrated grouping, the two current leaders are StarOffice and ApplixWare.
    However, they will soon have to deal with KOOffice, the KDE integrated office
    suite, which at the time of writing is in beta testing, but like a true challenger.
    There is also SIAG Office, a distinctive open source project that shows significant
    potential. Corel have promised to release CoreOffice 2000 on Linux, but this is
    not yet available.


    In the word processor grouping, there are a number of choices; WordPerfect 8 is,
    of course, the ''old man'' of DOS word processors, and is available in a graphical
    version for Linux. There is also Maxwell, which was a commercial word processor
    that then became open source. In the spreadsheet group, we have WingZ, which was
    heralded as the best example in the spreadsheet marketplace, prior to Excel demolishing
    its Windows-based market, and SIAG, the pride and joy of SIAG Office, which can
    run on its own as a standalone spreadsheet, and is available as a stand-alone
    KDE version, KSIAG.


    The TEX typesetting system is ubiquitous on Unix, and lot more accessible than
    the traditional UNIX typesetter, troff. With the LaTeX macro package, TeX allocates
    tools that make it comparatively straightforward to produce books, articles and
    letters using any text editor. You really don''t need to learn all the controls
    to code into your files, as there is a superb tool called LyX, and a KDE version,
    KLyX; these aren''t WYSIWYG word processors, but a ''what you see is what you
    mean'' word processor-like tool for creating and printing LaTeX files.


    # StarOffice


    StarOffice is basically a clone of Microsoft Office 97. It''s enormous, if you
    download it, running to 70Mb, and it has more functions than anybody could possibly
    use, but demands a lot of machine resources, typically 30-60Mb of memory. In practice,
    to run StarOffice 5.1 on an Intel-based Linux system, you need a minimum spec
    of a 166MHz processor and 64Mb of RAM.


    The German company, Star Division, created StarOffice in 1984 to write a German
    language word processor. It expanded and developed ports into a number of operating
    systems, and was available on Linux in 1995 in a rather antiquated version, which
    bears no similarity to the efficient integrated suite presented today.


    In August 1999, Star Division was bought out by Sun. Sun then announced exciting
    developments. Star Division were formerly working on a port of StarOffice to Java,
    which is still being developed by Sun, whose forthcoming'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Starportal is basically StarOffice for Java, designed to run on network computers.
    They''re also releasing the source code to StarOffice under the Sun ''community
    store'' licence. This is not open source, as defined by Eric Raymond, insofar
    as Sun retain all rights to commercial derivatives; but it means that StarOffice
    will rapidly show up on non-Intel Linux platforms, such as PowerPC Linux and other
    flavours of UNIX. It also means that StarOffice can be used for free, unless you''re
    a major corporation deploying more than 500 copies of it in your organisation.


    StarOffice comes as standard with many Linux distributions; you''ll find it bundled
    with Su Linux. If you don''t have a copy, you can obtain it from Sun Microsystems
    at www.stardivision.com. (see Figure 5.2).


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_94_0.png)


    Figure 5.2 StarOffice


    You can download it (but be warned, it is large and will take some time to (download)
    or order a free CD.


    Because StarOffice used to be shareware, it requires a registration number. Sun
    provide a generic licence, and say versions 5.2 and later won''t need registering;
    meanwhile, you can use the following:


    At the company name in the registration, enter: Sun Free Download Version and
    for the key 680A-0JH7-M60MVR-CQPD-147K.'
