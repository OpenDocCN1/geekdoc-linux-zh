- pgno: 163
  md: '# Power to the people


    The latest bulletin from ''Linux Power'' suggests Linux is starting to appear
    on more and more corporate servers, running alongside or even replacing Network
    and Windows NT. That''s an advanced state of affairs for ''free'' software. The
    revolution is taking place because Linux is more reliable than Windows, the source
    code is open, and the cost of ownership is lower. Microsoft and Novell may not
    be running scared yet, but they know this is a real threat to their earnings source.
    According to internal Microsoft memos leaked to the press, ''Linux Power poses
    a significant near-term revenue threat to Windows NT.''


    One part of the IT community views Linux as a viable choice, but another segment
    does not yet. Microsoft is quick to point out the shortcomings in Linux and is
    says Linux a low-end system with niche appeal. Microsoft says the Linux hype has
    caused people to take its claims at face value. It is ironic that the world''s
    largest software company feels threatened, given the Linux market''s fragmentation
    and the fact that Microsoft has always marketed the advantages of a single version
    of Windows.


    Microsoft''s attitude toward Linux was initially one of astonishment that corporate
    customers were willing to trust and invest in an operating system that did not
    have an identifiable company backing it, followed closely by a sense of frustration
    that many companies were adopting Linux. The bad feels run in both directions.
    ''Microsoft isn''t the disease, but they''re a symptom,'' says Eric Raymond. ''If
    your critical business processes are controlled by software whose insides you
    can''t see, and you''ll pay more to be on the wrong end of a monopoly. Prices
    will rise.''


    Many companies are now realising that the Linux development model creates higher-quality
    code and the beauty of Linux is in its simplicity.


    Many people are currently facing the choice between tuning in, turning on, and
    installing Linux servers, or running them alongside commercial platforms. Making
    this decision means undertaking some operating system insight appraisal. Start
    with the big-picture issues: price, support, training and reliability. Then compare
    the competitors side by side to see how they stand up in a business environment.
    Can the underlying OS kernel scale to thousands of users? Is the network directory
    up to the task of tracking resources and individuals? Does the operating system
    support the requisite protocols, and is efficient in its underlying file system?
    What about scripting tools for stress-free management?'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Trying to manually update any operating system is a considerable task, but
    there is no need to feel alone. The Linux community provides a multitude of Web
    sites and bulletin boards bursting with freeware, shareware, testimonials, advice,
    tips, bug fixes, and endless discussions of the finer points of Linux. These resources
    typically replace the traditional technical support centres offered by proprietary
    software companies.


    # Magical mystery tour


    This section looks at all the companies and organisations which are now working
    and collaborating with Linux. The Linux operating system is a study of contradictions.
    It is free, but businesses are willing to pay for it. It is feature-rich, but
    lacks some functionality IT departments expect. It is reliable but not everyone
    in mission-critical projects are using it.


