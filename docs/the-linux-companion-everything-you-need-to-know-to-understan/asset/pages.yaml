  md: 'Eric Allman has since set up a company that will deliver a commercial version
    of Sendmail. The company will continue to enhance and release the freeware product
    with source code and the right to modify and redistribute. The new commercial
    product line will focus on cost effectiveness with Web-based administration (Figure
    6.8).


    # BIND


    BIND (Berkeley Internet Name Domain) (www.isc.org/) is not well known outside
    the technical elite, but IT professionals are familiar with the service BIND makes
    possible: the domain naming system (DNS). The network of BIND servers that make
    the DNS translates native Internet addresses such as 254.28.58.201 when everyone
    has come to know: names such as ibm.com, amazon.com or eworldbook.com. Originally
    developed in 1984 by Paul Mockapetti, the DNS is currently maintained by Paul
    Vicie under the auspices of the Internet Software Consortium (ISC), an organisation
    formed by Rick Adams when he switched Unet''s status from non-profit to commercial
    in 1993 (Figure 6.9).


    The DNS, along with the rest of the Berkeley TCP/IP suite, provides the foundation
    for the entire Internet, including ISPs, content providers, and value-added companies.


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_160_0.png)


