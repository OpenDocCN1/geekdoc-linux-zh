- pgno: 169
  md: 'This kind commitment is leading more IT managers to adopt Linux, which has
    historically crept into companies from the bottom up. According to the InformationWeek
    research survey mentioned earlier 86 per cent of all IT managers (and 92 per cent
    at companies with more than £345 million in annual revenue) say the support of
    large technology suppliers has made their companies more likely to deploy Linux.


    In some ways, Linux is still in its infancy as an enterprise platform. Two-thirds
    of companies using Linux have been doing so for one year or less. And while Linux
    deployments are widening, they are not deep. Respondents to InformationWeek''s
    survey say just four per cent of their total operating system environments consist
    of Linux. Two years from now, that figure is expected to rise to 15 per cent,
    which is impressive, but still far short of Windows'' position.


    Linux''s main selling point is perhaps unassingly low cost with 61 per cent of
    survey respondents citing low cost as a primary reason for using Linux. But that
    is closely followed by performance and reliability.


    Linux is especially attractive to UNIX users who want to manage without learning
    skills. Linux servers don''t crash or need rebooting for six months or a year
    at a time. Linux''s popularity is fundamentally about the technology market''s
    desire for choice. For a long time in the 1990s, it looked like the computer world
    was rapidly moving towards one where consumers and customers had no choice but
    dominate with the versions of its operating system, and that frightened a lot
    of people. Businesses were undecided about Microsoft, and even its supporters
    were reluctant to give control to any company. Many people threw up their hands
    and said Microsoft would marginalise UNIX. No one could really see anything changing
    that situation. Then, in mid-to late 1998, database vendors view their support
    behind Linux as well. Suddenly, this was a real effort with committed companies
    behind it.


    Wall Street is now betting on a Linux boom. The operating system that grew up
    on the Internet, powering the Web page, application and caching servers that underpin
    the network, is suddenly reaping Internet-like valuations for the companies that
    distribute, preload and support it. As companies expose more of their back-end
    data through the Web, lines between infrastructure and back-office applications
    are blurred, pushing Linux more firmly into the arena of business-critical processing.


    Will Linux fever last among investors? Open source supporters say Linux companies''
    valuations recognise their unconventional development model is more effective
    than proprietary methods of development. The capital mar'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'says this is a fundamentally better way of developing technology. But the cash
    pouring into Linux companies from high-tech vendors, venture capitalists and Wall
    Street investors is raising some questions. How do Linux companies build sustainable
    businesses selling software that is not tied to a traditional licence agreement?
    Can these suppliers make the software run well enough and provide the necessary
    development tools to make Linux a compelling alternative for running back-end
    e-business systems, thereby expanding the market? And, perhaps more importantly,
    Linux satisfy enterprise customers'' demands for formal sales and support chain


    IT managers refer to the lack of business applications among Linux''s most-significant
    weaknesses, with two-thirds of respondents noting that complaint. Many software
    companies have not ported software to Linux, as they feel there is not yet sufficient
    demand. This is changing daily as more software companies are realising they can
    lose market share quickly in this rapidly developing marketplace. For these reasons
    and others, Linux is not being adopted by all businesses. Technology suppliers
    are working to improve Linux''s shortcomings as a platform for e-business, and
    more applications to become available. Oracle plans to ship its front-office suite,
    Oracle11, on Linux. Oracle claims it has 809 customers for the Linux edition of
    its database, accounting for about £4.1 million in revenue, compared with about
    £620 million for Windows NT products. Oracle is aware there was a time when NT
    was only a £4.1 million business. IBM has placed its DB2, Domino, MQSeries, and
    WebSphere middleware to the platform, and its VisualAge for Java builder is available
    on Linux.


    Linux is continually investing in three areas: technology that enhances its platform,
    online content for developers, services and support. The clear trend among Linux
    suppliers is to expand their portfolios of related products and services. Because
    of the way of the market is structured, the way to make money on Linux is to add
    more layers of value above the operating system. That is what vendors are hoping.
    Indeed, if there is one thing on which IT managers and Linux suppliers agree,
    it is the need for at a few strong suppliers to emerge. They will see growth in
    their market share come directly from how they can differentiate themselves.


    IBM has placed its Linux efforts under the control of its top enterprise executives
    to ensure that the system runs smoothly on the IBM hardware. IBM unveiled a reorganization
    that places responsibility for its Linux strategy under senior VP Sam Palmisano,
    who reports to CEO Lou Gerstner. In a memo to Gerstner on 7 January 2000, Palmisano
    wrote that Linux will ''play a pivotal role'' in meeting customers'' demand for
    systems systems heralds ''another important shift in the technology world''.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'IBM has created a unit within its enterprise systems group to oversee all UNIX
    and Linux efforts. IBM dissolved the Internet division, saying a separate group
    was no longer necessary as e-business permeates every corner of the company''s
    operations. As Linux matures, IBM watchers wonder how the company will handle
    the platform alongside AIX, the UNIX variant that runs on its own RS/6000 servers,
    and Project Monterey, for the PC and Intel''s coming 64-bit CPUs that combine
    elements of AIX, SCO, and Dynix. Linux is the next-generation platform for e-business,
    and IBM is repositioning itself to take advantage of that. Linux seems to fit
    squarely in IBM''s portfolio. To advance Linux''s appeal to large companies, IBM
    plans to step up Linux on its four core platforms - System/390, RS/6000, AS/400,
    and Netfinity middleware that enables interoperability between Linux servers and
    legacy systems, and develop scalability, availability and other enhancements to
    the Linux kernel that IBM could license to other suppliers.


    Suppliers are also stepping up their efforts to broaden acceptance of the Linux
    operating system with a flurry of new products, support offerings and business
    partnerships. In the past Linux was seen as a niche operating system with a cult
    following it but it is gaining popularity among administrators of Web and departmental
    servers because of its stability and low cost of ownership.


    However, Linux still has hurdles to clear; it does not scale well beyond four
    processors, and installation can be difficult for non-technical users. Linux distributions
    are increasing their service and support to address these issues.


    While Linux is emerging as a viable operating system at the server level, its
    suitability for business desktops is still a matter of debate. Critics contend
    that despite gains in ease of use, Linux still carries its ''techie'' heritage,
    and the number of applications for the operating system place it in a niche-player
    status in the desktop world. But devotees counter that Linux is already easier
    to install, maintain and use than just a year ago, and that software companies
    are beginning to unveil products ranging from vertical applications to integrated
    office suites to meet customer demand.


    Critics of Linux come in all shapes and sizes, but supporters seem to be a remarkably
    consistent group. Companies that have embraced Linux are typical either those
    that have been UNIX users for some time or those that employ IT staff who champion
    the operating system. Every day I hear of whose initial idea to use Linux originally
    came from a young graduate in the company''s IT department. It is the recently
    graduated, who realise the power and potential of Linux from working with it at
    college and university, who are the real driving force in the adoption of Linux
    in today''s business environments.


    144 The Linux Companion'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Linux''s ability to satisfy companies'' technical requirements is enhanced
    by the fact that it can do so very cheaply. Linux can be downloaded from the Internet
    for free or purchased from SuSE or any of the other distributions at a very low
    cost with a suite of utilities and other support software, services and documentation
    included. Add to the fact that Linux runs efficiently even on 486 PCs, and companies
    looking to save money suddenly pay attention.


    The cost of moving from one version of Windows to the next is enormous, and many
    companies are now choosing to move instead with Linux-based suite of applications.
    It is not likely that the average knowledge worker will see his or her Microsoft
    Office applications swept aside in favour of a suite of Linux productivity software:
    ease of use, data compatibility between Linux and Windows systems and a larger
    variety of software will all have to have a little work done on them.


    That said, there is some momentum in the software world, even in the office suites
    arena, a critical battleground in proving mainstream legitimacy. Corel has sold
    a Linux version of WordPerfect for some time, and Appix offers its AppWare integrated
    office suite for Linux. Sun Microsystems attracted a lot of attention with its
    acquisition of StarOffice suite for Linux, Windows, Solaris, and OS/2, which will
    continue to make available for free. Linux itself, the package can be downloaded
    via the Internet, and Sun will make the source code for Star Portal, the Web-ready
    version of the product, available to suppliers and service providers who wish
    to host the product. If StarOffice addresses users'' basic needs for tasks as
    word processing and spreadsheets, a big roadblock to Linux on the desktop, the
    availability of general desktop applications, will be overcome. But also keep
    your eye on the KDE KOfi developments.


    Linux application vendors acknowledge that there is often a gap between technical
    users'' perceptions and end users'' requirements. On the one hand, you have employees
    and senior management who want to save money and run efficiently. On the other
    hand, you have users who are used to Microsoft Office and Windows in general,
    and who probably do not change.


    That raises the issue of IT managers attempting to provide a solution to something
    end users regard as a problem. The most likely to adopt Linux on the desktop are
    those with a dislike of Microsoft from a business standpoint. Windows is adequate,
    and for most companies, that will remain good enough until the finance department
    realises the cost-saving benefits of Linux, and then things will change rapidly.


    IBM recently unveiled a low-cost Netivity server system for the Linux operating
    system. IBM also support and service the SuSE distribution as well as the other
    major Linux distributions. The IBM Netfinity 3500 M10 will include a driver that
    lets the open source system take RAID'
