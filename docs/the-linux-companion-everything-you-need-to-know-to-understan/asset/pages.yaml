- pgno: 79
  md: '# Did you know that...?


    # Memory


    The memory is the brain of your machine. In Linux, one often refers to two different
    types of memory: physical memory and virtual memory. Physical memory is made up
    of a number of memory (RAM) chips. RAM varies from 8Mb to 128Mb on a typical PC.
    High-performance computers may have 1Gb or more of RAM.


    Virtual (or logical) memory is a concept that, when implemented by a computer
    and its operating system, allows programmers to use a very large range of memory
    or storage addresses for stored data. The computing system maps the programmer''s
    virtual addresses to real hardware addresses. Usually, the programmer is freed
    from having to be concerned about the availability of data storage.


    In addition to managing the mapping of virtual storage addresses to real storage
    addresses, a computer implementing virtual memory or storage also manages storage
    swapping between active storage (RAM) and hard disk or other high-volume devices.
    Data is read in ''pages'' of sizes ranging from thousand bytes up to several megabytes
    in size. This reduces the amount of physical storage access that is required and
    speeds up overall performance.


    # Test the water


    If you have an extra PC with no critical programs or data on it, you might want
    to use it as Linux guinea pig. If you have an old 486, Linux will give it a new
    lease of life and allow you to experiment without running the risk of damaging
    any files on your main computer.


    # Know your resource needs


    Make sure you have enough hard disk space, RAM and CPU speed to accommodate and
    handle a Linux install—either on its own or in separate rate hard disk partitions
    on your Windows PC. Check the Hardware site in Figure 4.1, ascertain your hardware-resource
    requirements and then see what your PC has available.


    # Have a spare floppy disk ready


    Most distributions will prompt you to create a rescue disk installation. Have
    a blank floppy disk ready to carry out this important step.


    # Back up your data


    To be on the safe side, back up all your important data on removable media before
    beginning the Linux installation.


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_79_0.png)


    # Backup


    Backups should be done regularly, especially for important files! It is also worthwhile
    backing up your configuration files. In Linux, one of the commands used for backups
    is tar. It backs up the files to a device or filename. Quite often tar is used
    in combination with gzip.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Linux hardware


    One question that often comes up is what do I need to look for when buying a PC
    to run Linux on? A quick answer is, if you already run Windows on a PC, you have
    everything you need to run Linux. It is not always accurate, but it describes
    the CPU, disk and memory requirements fairly well: Linux needs no more of these
    than Windows, and can get away with less. A sensible minimum specification these
    days is a P200, 64Mb of RAM, and at least 1Gb of disk space – today you''ll be
    hard-pressed to buy a new machine with less.


    But that is not where the story ends. Not all PC hardware is Linux-friendly. The
    first and biggest problem is equipment that relies on Windows software to make
    up for some sort of deficiency. Winmods are a case in point. Most modems have
    a built-in microprocessor and ROM of their own; you can plug them into just any
    computer and they will work. Not so with Winmods; much of their processing work
    is farmed out to a set of Windows drivers that run on the PC. No Windows? No modem,
    then.


    Similar warnings apply to some printers; it is prudent to be suspicious of any
    hardware gadget with ''Win'' as a prefix to its name. It is not necessarily incompatible,
    but it is a sign that you should double-check before spending money on it.


    Probably the most important item is your hard disk subsystem: the drives and controllers.
    At this point it is worth mentioning a simple law – SCSI rules. SCSI (Small Computer
    Systems Interface) is a standard bus for Macintosh and other platforms have used
    for many years in preference to such PC-specific items as IDE, EIDE, or the venerable
    ST-506 interface. Most PC motherboards do not built-in SCSI controllers; you usually
    buy them as separate boards. Furthermore, SCSI drives tend to cost more than EIDE
    drives; in general, prices are about a year behind in terms of the price/capacity
    ratio. However, SCSI kit is of higher performance. In particular, the SCSI bus
    permits asynchronous commands; your computer can send a stream of read/write requests
    to the drive without waiting for each to complete in turn. While UDMA drives probably
    outclass SCSI kit (certain pre-SCSI-3), a machine equipped with an SCSI drive
    easily outperforms equivalent EIDE-dependent kit. Linux does not treat its storage
    in the Windows does; it is very file system intensive, and it is under these conditions
    that SCSI hardware outshines the opposition.'
  merge: -1
  img_proc: true
