  md: '# Emulators


    Having the ideal emulator for another operating system and, if possible, for other
    architectures is many computer users'' dream. What makes them so desirable is
    they can run in a window of your favourite operating system and play all your
    favourite games, and you can use them to do some real work as well.


    Linux has emulators for just about every operating system under the sun. The task
    of a software emulator is to provide an environment in which programs written
    for another system can run. Computers, being general purpose information processors,
    are all functionally equivalent at a very deep level. You might think that an
    emulator will always run much more slowly than the original hardware, but right;
    given that in the computing industry there is a doubling of performance every
    18 months or so, it should come as no surprise to learn that a modern PC or Mac
    running an emulator will outperform any computer which is over four years old.


    In this section I will try to give you some understanding of the wonderful world
    of emulators and what the future will hold for them.


    # DOS emulator


    First there is last standby, the DOS emulator. Linux has a very good DOS emulator
    that allows an Intel-based computer to generate a virtual 8086 (or virtual 386)
    environment in which you can boot a copy of DOS. The main emulation tool, DOSEMU
    (www.dosemu.org/) (Figure 5.12) has been around for years and will run most DOS
    applications.


    If you are running Linux on a Mac or SPARC or Alpha box instead of a PC, there
    is an alternative in the form of Bochs at www.bochs.com. (Figure 5.13)


    Bochs do not rely on forcing your PC to generate a virtual 86 session; instead
    it provides a complete emulation of an Intel 80386 CPU in software — slow, but
    good enough to boot DOS (or Windows NT, for that matter). Bochs is commercial
    software — but with full source code available for 30-day evaluation.


    There is also the very interesting open source WINE project at www.winehq.com
    (Figure 5.14)


    WINE is one of so self-referential acronyms, short for ''WINE is not an emulator''.
    The goal of the WINE project is to allow any Windows application to run transparently
    on Linux, by providing a full array of services that replicate the Windows environment,
    at least as far as an application sees it. With WINE support, Linux on Intel-based
    hardware can load and directly execute Windows applications. Most Windows 3.1
    programs that don''t directly conflict with the'
