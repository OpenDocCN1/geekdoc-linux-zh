    now use the operating system, sharply from 14 per cent in March 1999 and even
    more from the three per cent in 1998. Another 11 per cent of the 300 managers
    surveyed plan to deploy Linux within the next year. That means more than a third
    of businesses use Linux. Not long ago, businesses were being asked, ‘What’s your
    Internet strategy?’ Now they are being asked,


