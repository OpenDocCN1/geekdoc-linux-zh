- pgno: 65
  md: '# Did you know that...?


    X Server

    Machine that run an X Server can use graphical user interface services provided
    by the X Window system. An important task of the X Server is to manage the displays.
    Normally, each terminal has one display. The name of this display is set by the
    environment variable DISPLAY. The format of this variable is <machine name>:<displaynumber>,
    for example, earth:0. You need to know your display''s name for login.


    It doesn''t matter whether the X Clients are executed locally, on the machine
    which you are working, or remotely on another system in the network. In the latter
    case, the screen output of the program is transferred via the network to the local
    machine; all processing is carried out on the remote system. This makes it possible
    for all application programs in a network to be run on a powerful application
    server while the client systems just be simple terminals.


    This configuration saves not only the high costs of new hardware, but also reduces
    administration and maintenance costs for the network.


    Another special feature of the X Window system is its window management. On a
    graphical user interface, all applications are displayed in windows. With X Window,
    the look (frames, size, colours, buttons, and so on) and feel (placement of icons
    and texture) are not controlled by the X Server, but by a window manager.


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_65_0.png)


    Figure 3.3 One of SuSE Linux''s window managers'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'What might at sound confusing soon appears to be a major advantage when you
    take a closer look: the SuSE Linux package provides more than ten different window
    managers, allowing the user to create the look and feel of his interface himself.
    It goes without saying that under Linux every window manager is itself freely
    configurable (Figure 3.3).


    # Did you know that...?


    Rlogin (remote login)


    Using a remote login, you can log into a remote machine via the Internet as if
    you were sitting at its console. If there is an X Server running on both machines,
    you can easily display the output of an X application provided the DISPLAY variable
    is set correctly.


    In larger varied networks, the availability of several window managers makes it
    possible to create a single interface across several hardware architectures. fwwm95
    and qwm are window managers available which have been designed the lines of the
    Windows 95 interface.


    # Did you know that...?


    # Window system


    To facilitate the configuration of the individual window managers for users, SuSE
    has developed a tool called susewm, which does away with the cumbersome editing
    of configuration files to a large extent. Depending on the programs installed,
    susewm automatically generates popmenus. From these menus, you can conveniently
    start X applications. As susewm covers more than seven window managers, you can
    change window managers at any time using the appropriate menus. SuSE Linux provides
    a completely preconfigured fwwm2, the most commonly used window manager under
    Linux, enabling you to work immediately.


    A collection of programs, protocols and routines for organising and maintaining
    a graphical user interface. The X Window system (X for short) was developed by
    Project Athena at Massachusetts Institute of Technology in the USA. The big advantages
    of X Windows compared to other systems (such as MS-Windows or Graphic Environment
    Manager, GEM) are its networking capabilities and its flexibility. It is possible,
    to run programs on other machines and redirect their output to your display while
    freely adapting the look and feel of your system.


    # Did you know that...?


    # Window manager


    A window manager is responsible for (among other things) decorating your windows
    and providing you with certain functionality such as resizing, moving and closing
    windows. It is also responsible for the look and ''feel'' of your system.


    Linux Applications and the Desktop 39'
