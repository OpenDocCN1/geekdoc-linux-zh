    Laptops, especially ones, notorious for causing headaches to users of the Linux-based
    operating system. Laptop manufacturers prefer packing their machines with new
    chips and devices whose such design seems to change by the hour. Linux programmers
    are often one or two steps behind they struggle to write code that allows Linux
    to make use of such hardware. Indeed, one of the main difficulties for the Linux-based
    operating system is its lack of support for brand new hardware. The problem is
    that it is difficult for programmers to guess what they need in order to write
    code that will work with that hardware. In this, it is because many hardware manufacturers,
    especially those who at the consumer marketplace, consider the Linux market too
    small to warrant accommodating.


    In some areas, considerable progress has been made over the last six months. The
    leading makers of 3D video chips are racing to ensure that their most recent developments
    work with Linux; they are increasingly aware that the game players who end to
    pay for the fastest 3D chips are often Linux programmers.


    The biggest problem for anyone installing Linux is any modem carrying the word
