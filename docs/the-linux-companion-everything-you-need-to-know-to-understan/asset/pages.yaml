  md: 'his chapter discusses the specialised software applications that can be run
    on Linux, their features and capabilities, and two of the Linux desktop environments,
    K Desktop Environment and GNOME, touching on the similarities they share with
    other operating systems as well as the differences.


    # The Linux desktop environment: KDE and GNOME


    # Did you know that...?


    # Window


    A window is a rectangular screen segment, usually decorated by a frame. This frame
    normally contains decorations, which can change the window''s size, move the window
    and alter other window properties. In order to work with windows, an X Server
    and a Window manager must be running.


    The K Desktop Environment (KDE) (Figure 3.1) and GNOME (Figure 3.2) provide a
    complete graphical environment under X. On top of a window manager, they also
    contain applications such as file manager, editors, viewers and even some games.
    All these applications have a consistent look and feel, that is, all window elements
    such as button and menu bars look the same.


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_63_0.png)


    The Linux Companion'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_64_0.png)


    Figure 3.2 A GNOME desktop


    KDE and GNOME eliminate the cumbersome editing of configuration files. Colours,
    fonts, menu bars and buttons can be changed using graphical configuration tools,
    and both desktops support ‘drag and drop’.


    # X Window


    In addition to the command line, the so called shell, Linux also provides a graphical
    user interface (GUI). The X Window System (often simply referred to as X or X11),
    the standard for graphical user interfaces under UNIX, has been developed continuously
    and has been ported by the XFree86 project team onto PC UNIX systems.


    Unlike many other GUIs, X11 is based on the client/server model. The X server
    runs locally on a system, handles all access to graphics hardware and processes
    user input via mouse and keyboard. The applications are the so-called X Clients
    which communicate directly with the server.


    > Did you know...?


    # Command line


    Working with UNIX in a shell is a command line-oriented process. This means that
    any process you enter in a shell can have its own command line (for example, the
    command can take a lot of options to change its behaviour).'
