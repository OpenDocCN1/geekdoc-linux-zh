    site is at http://slashdot.org/ (Figure 7.11).


    For total comprehensiveness, nothing can compare to http://linxtoday.com/index.html
    for Linux news. Daily visits to this site will reveal listings of practically
    every mention of Linux in the mainstream press (both print and on the Web), and
    will provide up-to-date information on all important Linux happenings. This site
    is definitely a must for keeping up with the fast-changing world of Linux (Figure
    7.12).


    Another worthy site is the Linux Weekly News (www.lwn.net/), which says it is
    ‘Dedicated to keeping Linux users up-to-date, concise news for all intents.’ This
    site (Figure 7.13) boasts many original editorials, and is worth visiting for
    its informed opinions on Linux and open source.


    Unlike the other news sites, kernelnotes.org specialises in one thing: the Linux
    kernel and its frequent updates and additions. If you enjoy customising your kernel,
    then this is the site for you: it catalogues all the releases, providing a list
