    Commodore 64, Commodore 128, VC20 and Commodore Pet, you can get out all those
    old programs again.


    If you enjoy playing games then you should look at the emulators for game consoles.
    In 1977 Atari launched the video console system VCS 2600. Today it can be emulated
    using Stella. NES (Nintendo Entertainment System) owners will also find their
    own emulation.


    Note that for most of the emulators you will need additional CD-ROMs, which for
    copyright reasons UNIX is not allowed to include on their CD. In order to boot
    the DOS emulation under Linux, you require a DOS licence, i.e. MS-DOS, Windows
    95 (MS-DOS 7), IBM PC-DOS, DR-DOS, Caldera OpenDOS or FreeDOS. Licences are available
    from Microsoft for £160.'
