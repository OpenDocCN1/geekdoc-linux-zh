- pgno: 101
  md: 'open source, written principally by one developer, Ulric Eriksson. The complete
    suite of a spreadsheet (SIAG), a word processor (Pathetic Writer), an animation
    program (Egon), a text editor (XedPlus), a file manager (Xfiler), and a postscript
    file previewer (Gvu).


    SIAG Office was not written to make Windows users feel comfortable. The applications
    all use Emacs bindings rather than the more familiar Windows or KDE key bindings,
    inherited from IBM’s C standard by way of Windows 3. The programs can all run
    as stand-alone applications; however, they integrate tightly, so that you can
