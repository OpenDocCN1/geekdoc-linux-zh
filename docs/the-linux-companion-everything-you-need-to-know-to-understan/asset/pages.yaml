  md: '# Did you know that...?


    # Network File System (NFS)


    This is a protocol to access file systems of networked machines. On the server
    side the configuration file/etc/exports determines which machines may access the
    directory trees on the server. The client may then ''mount'' these directories
    in his own directory tree.


    your Linux server always means closing a door on a potential security hazard.
    Indeed, understanding which network services are enabled by default is the securing
    any new work host. In addition to exposing too much network information through
    DNS, other services, remote procedure calls in, can expose critical information
    about your hosts that you may not want out


    sides to know. As a rule, if you do not need a network service, disable it or,
    better still, remove it from your hosts.


    Learning about Linux also means that you will become more familiar with the security
    options already inherent in Linux, such as its ability to be converted easily
    into an IP firewall or proxy server.


    In a practical sense, Linux''s open source foundation provides another security
    benefit. Realistically, few companies can rigorously review every line of source
    code in an operating system to locate security weaknesses. Just as the open collaborative
    development model makes Linux such a success, the same effect lets all users benefit
    from the security reviews of programmers throughout the world. Because so many
    pairs of eyes have examined parts of the Linux source code, there is a far greater
    chance that security flaws will be found and fixed.


    The bottom line is that open source software represents a few more unknowns than
    traditional commercial software but, with a little time and effort, you can turn
    those unknowns into advantages to keep your network safer than ever.


    # Summary


    Linux does not get viruses; some genius may figure out how to infect it successfully,
    but I''m not holding my breath. Linux is, however, vulnerable to different kinds
    of attack: these are most critical if you run a server which is connected to the
    Internet all the time, but they can still affect dial-up users and a particular
    problem is spammers grabbing mail and news access. The solution is to know how
    the Linux system security works, and attempt to keep abreast of current developments
    and security alerts.'
