    # News


    Freshmeat is the nervous system of the Linux community, then Slashdot is definitely
    its mouthpiece; the site concentrates on technical and scientific articles as
    well as Linux stories. However, what really sets Slashdot apart from all other
    Web sites of its kind are the comments attached to each story. Anyone can log
    in and write a comment, which will instantly be posted to the site. If they wish,
    readers can comment on comments, resulting in long, tree-like discussions, which
    can continue ad infinitum (particularly sensational or interesting stories). This
    kind of interaction has made Slashdot a lively source of digitised information.
    Its greatest accomplishment is the ‘Slash Effect,’ which is what happens to Web
    servers with slow connections that inevitably crash after being linked into this
    site.'
