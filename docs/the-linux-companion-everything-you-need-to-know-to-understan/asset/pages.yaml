    I believe that Linux will come preinstalled on many more desktops and laptops
    in the not so distant future. But until that time, there will be some frustration
    with matching the appropriate hardware that Linux will support. Persevere and
    you will not be disappointed.


    # Linux for Mac and PowerPC platforms


    Software options are opening up for Mac users who want to run PowerPC versions
    of the Linux operating system. There is much development in the Apple Mac and
    PowerPC world. SuSE Linux have just recently completed SuSE Linux 6.4 for the
    PowerPC platform. It will also use YaST2 for the installation, and the look and
    feel of the installed system will be identical to SuSE Linux on Intel systems
    minus the commercial applications because they are not available for Linux on
    PPC. In addition to PowerMacs, it will also run on other systems using the PowerPC
