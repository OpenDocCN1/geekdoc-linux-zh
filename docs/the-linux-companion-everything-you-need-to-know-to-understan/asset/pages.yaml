  md: '# SuSE services and support


    Many organisations allow their business partners to support their shared customer
    base, and this arrangement works very well for all concerned. Having a global
    services organisation backing Linux can only broaden its acceptance as an enterprise-class
    operating system.


    # Training certification


    At the end of the 1990s, most IT personnel would have been hard-pressed to find
    a basic Linux operating system course, wasn''t even discussed in Linux user groups.
    Today, Linux training and certification is a growing field, and the first classes
    of Linux-certified system and network administrators are taking home their certificates.


    The main obstacle to Linux''s gaining broad acceptance throughout companies is
    the lack of an industry-accepted certification process for Linux technicians,
    primarily system and network administrators. However, leaving Linux vendors Red
    Hat and SuSE Linux and the Linux Professional Institute at www.lpi.org (Figure
    6.23) have been encouraging the development of training courses.'
