- pgno: 29
  md: 'his chapter introduces Linux. Many people have heard of Linux and want to understand
    what it is all about. This chapter will give you an understanding of Linux, although
    to fully understand its many facets and complexities is no easy task. I hope this
    book goes some way to showing you what a unique concept Linux is, and I hope you
    will find Linux as remarkable and fulfilling as I have.


    # Introducing Linux


    Linux is a multi-user, multi-tasking freeware UNIX operating system, available
    for many platforms. PCs with x86 processors (Intel, AMD, Cyrix) from 386 onwards
    are the most commonly used platforms. Linux corresponds largely to the POSIX standard.


    The name Linux is derived from the inventor of the system, Linux Torvalds. Strictly
    speaking, it only refers to the operating system kernel, but it is often used
    to describe the complete system, including the applications. Linux today is made
    up of the following structures:


    +   - System software: Whether you want to develop your own software or simply
    deploy a WWW server, an email/news server, an ISBN router or a file and application
    server, Linux provides you with all the necessary tools.


    +   - Applications: A multitude of free software packages (some proven and used
    extensively, some still at an early beta-testing stage), complemented by a growing
    range of commercial software that is being ported to this platform.


    +   - Development teams all over the world, who continuously extend and improve
    Linux, making it available for new platforms.


    +   - And last, hundreds of thousands of enthusiastic users, from students and
    interested individuals to large corporations such as the car rental company, Budget/Sikt,
    IKEA, the Swedish furniture retailer with outlets all over the world, where business-critical
    applications are based on Linux.


    The typical computer user buys a complete computer from a computer shop. Many
    computer users do not realise that when they buy a computer, they are actually
    buying two major items: the computer itself and the operating system which will
    operate it.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'We know what the computer is: it''s the box, the keyboard, the mouse and the
    monitor: in short, the computer is everything that can be seen or held. The computer
    is all of the sheet metal and the plastic, the circuits and the chips. To put
    it another way, the computer is the physical set of components which can be put
    in a box and carried home.


    Most users, however, do not have a clear understanding of the operating system.
    The operating system is the set of actions and information displayed by the computer.
    Operating system determines what the computer does once it is switched on: the
    text, the graphics, the applications, and even the Internet access. The operating
    system determines what is shown on the screen, how files will be saved to disk,
    and what will come out of the printer. The next section-will go into this in more
    detail.


    # What is an operating system?


    An operating system is a group of programs that help you operate your computer.
    It could be considered the administration of your internal society, the central
    program that tells the other programs what they may and provide services they
    need. A computer might contain more than one operating system, but only one operating
    system may be commanded at any time. The action of starting or loading the operating
    system is called booting the computer.


    > Did you know that...?


    Windows 9/98 is an example of an operating system. MS-DOS is (or was) also an
    operating system. Linux is an operating system as well. All of these systems perform
    similar tasks.


    Operating system

    Operating system is a process running permanently in the background, controlling
    the basic operation of the computer. The task of an operating system is to manage
    all the machine-specific resources. In Linux, this is done by the kernel, and
    probably by means of modules as well. Some well-known operating systems are Linux,
    Amiga OS, macOS, OS/2, UNIX, Windows NT and 95/98.


    An operating system normally consists of some basic components. A kernel, a core
    program that controls the essential hardware (the processor and memory, for example);
    some device drivers that control other system hardware (network cards, soundcards);
    and a shell, a program that communicates with the user and allows the user to
    manipulate the computer.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Did you know...?


    The shell is the only part of the operating system that a normal user will see.
    Each operating system presents a different user interface or operating environment.
    An Apple computer running MacOS will look different to a PC running Windows 95
    or Linux, and the way the user goes about accomplishing tasks and giving instructions
    to the computer is different. MS-DOS requires you to type commands at a text prompt


    # Shell


    The shell is the fundamental interface to the operating system kernel. You can
    enter commands using the shell''s command line. In order to make processes run
    automatically, most shells provide a scripting language of their own. These programs,
    called shell scripts, can be seen as intelligent batch files. Examples of shells
    are bash, sh, and tsch.


    start programs, while in MacOS you must use the mouse to click on a picture to
    perform the same task.


    The operating system acts as a type of translator; a human doesn''t know how to
    speak binary language. The operating system allows the user to receive communication
    from the computer via the screen and the printer, and to send communication to
    the computer via the keyboard or disk drive(s). The operating system tells various
    components of the computer, like the screen, the printer, the disk drive(s), and
    programs, such as your favourite games, how to talk to each other effectively.


    # Did you know...?


    # Directories


    These build a file system structure. Files and other directories are listed in
    a directory. File X lies in directory Y if its name is listed in this directory.
    Because there are branches of directories within directories, this is often referred
    to as a directory tree. If you want to see another directory, you can change into
    it. Files can be copied to the leaves of the directory tree and then (quite logically)
    contain any more sub-directories (branches). Directories follow the same restrictions
    as files. The special directories ''.'' and ''..'' refer to the directory itself
    and to its parent directory in file hierarchy, which uses either console 7 (runlevel
    2) or console 3 (runlevel 3).


    Without an operating system, a computer is merely a mass of raw materials which
    can be switched on, but which will do anything useful. The operating system nearly
    every buyer receives with a new computer is Microsoft Windows. This operating
    system, commonly called ''Windows'', is not a part of the computer at all. Windows
    is simply one operating system among a whole host of others, which can be used
    with PCs.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Linux in the context of operating systems


    Linux is a new way for your computer to behave. It is a new set of pictures, screens,
    menus and instructions for the various chips and circuits of your computer to
    manipulate and for you, the user, to interact with. Linux can be installed on
    your computer instead of Windows or MacOS, and Linux provides many of the same
    tools: Linux can talk to a printer, save a file to your hard disk, or display
    a picture on your screen. Users can type letters using Linux, browse the Web using
    Linux, or edit a company spreadsheet while using Linux, in the same way that these
    tasks are accomplished while using Windows or MacOS.


    Linux should not simply be regarded as a direct replacement for the operating
    system which came with your computer, however. It is not simply a ''better'' Windows
    or MacOS, though in many ways it can be superior. Instead, Linux should be considered
    simply as a different operating system, a new set of habits, thoughts and tools
    for you and your computer to share. More importantly, because Linux fundamentally
    affects the operation of your computer, it can never be a ''plug-in replacement''
    for the operating system, which came with your computer. Your favourite Windows
    games will not easily work in Linux, nor many of your favourite tools, such as
    Microsoft Office or Internet Explorer. On the other hand, Linux has games and
    many powerful tools of its own, such as StarOffice and Netscape Communicator,
    which perform similarly to Microsoft Office and Internet Explorer.


    # Who is responsible for Linux?


    Now that you know what Linux is, and you realise that other operating systems,
    like Windows and MacOS, are maintained by Microsoft and Apple respectively, you''re
    probably wondering which company is responsible for Linux.


    Surprisingly, Linux is unlike Windows or MacOS in this respect. Linux is not maintained
    or owned by any single company or for-profit organisation. Linux was started as
    a learning project by a computer student in Finland named Linux Torvalds (hence
    the name Linux). Linux was motivated by two factors when he created Linux. First,
    he wanted to learn more about the microprocessor he was studying at the time –
    and what better to learn than by creating an operating system to talk to it? Second,
    Linux wanted to have access to a mature family of operating systems known as UNIX
    systems, which are often found on very large computers. UNIX operating systems
    were expensive at the time, because they didn''t work on personal computers,'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'large mainframes. So, Linus set out to make something that worked and looked
    like a UNIX operating system, which would run on a personal computer.

    He succeeded.

    He began the Linux experiment nearly a decade ago and has graduated, but he is
    still in charge of the Linux core today, though many companies now exist to help
    promote and distribute the Linux operating system. Millions of computer students
    worldwide use Linux daily for their calculations and studies, and many people
    help Linus maintain Linux, release new versions, and keep it all developing at
    an impressive rate.


    # How computer programs are made


    A computer program is a list of instructions given to a computer to make perform
    a specific task or series of tasks. Computers do not understand English, so programmers
    must communicate these instructions to the computer in a language the computer
    understands. Computers, however, can only operate in numbers, which makes a computer''s
    language very difficult for humans to understand.

    The solution to this problem is to create an intermediate language that both humans
    and computers can understand. This is called programming language, and currently
    there are several languages. Programmers create a list of instructions for the
    computer in a programming language such as C, Pascal or Fortran. This list of
    instructions is known as source code. It is textual in nature, and readable to
    humans (who speak the language). Programmers do all their work in this source
    code, changing instructions to fix bugs, add features, or alter the appearance
    of a program.

    When a programmer believes he has perfected the instructions for his program,
    he uses a special program called a compiler to translate his human-readable text
    into computer-readable numbers that correspond to the same instructions. The resulting
    file is usable by computers but incomprehensible to humans. This is called object
    code. The resulting executable file is often called binary, after the number system
    used by the computer. This translation from source code into binary object code
    is a one-way process. It is impossible to translate a binary executable back into
    the original source code.

    The binary executable is what you need if you want to run and use a program. This
    is what you will usually receive when you shrink-wrapped software from a retail
    store. The source code is what you need if you want to understand how a program
    works internally, or if you want to change, add to or improve a program. If you
    have the source code and an appropriate compiler, you can produce the binary executable,
    but this does not work in reverse.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# A brief history of Linux


    The goal for most programmers is to create a stable and reliable program or application
    that will earn the respect of their peers. Linus Torvalds went much further, laying
    down the foundation that personifies the ultimate hack.


    Linux began in 1991 as a typical programming bit of fun, written to run on a PC
    with 4 Mb of RAM as a free version of the costly UNIX operating system. Today,
    Linux has an installed base conservatively estimated users. And they''re not just
    spotty adolescents playing in their bedrooms: Linux vendors say that most of the
    top companies in the USA have bought Linux in some.


    > Did you know...?


    # UNIX


    UNIX is an operating system widely used on workstations. UNIX supports virtual
    concepts, such as running different machines on a network. It consists of a kernel,
    a shell and applications. Since the mid-1990s, there has been a freeware version
    available for PCs-Linux.


    Linux''s installed base may not be on the level of Windows, but Linux has made
    its mark in just half the time that Microsoft has given your Windows-Linux gives
    you the complete house.


    Linux is freely distributable-one CD-ROM can be passed on hundreds of times-so''s
    particularly popular in countries getting wired to the Internet. And technologically,
    Linux eclipses all the other brands of UNIX. Linux is far and above the most vital
    part of the UNIX market. Dennis Ritchie, one of the fathers of the original UNIX,
    calls Linux ''commendable''.


    > Did you know...?


    # CD-ROM drive


    There are various types of CD-ROM drive. The most common type is ATAPI drives,
    which are connected to a (EIDE) hard disk controller. There are also SCSI CD-ROM
    drives, which are operated via a SCSI host adapter, CD-ROM drives connected to
    the parallel port and proprietary CD-ROM drives which are controlled by special
    controller cards or via the soundcard. Proprietary drives also need special.


    The saga of Linux has many strands. It is the story of Linux. It is also the story
    of the Internet as a model for distributed collaboration.


    Indeed, Linux has used the Internet as a medium to create a huge patchwork of
    code that defines a rapidly growing e-world, the tightly linked community of those
    who make and use it. What unites these programmers is the drive'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'create the world''s greatest operating system (OS), one more powerful than
    any commercial Unix, able to run on practically anything, and infinitely customisable.
    An OS that is fully equal of the Microsoft''s flagship, Windows NT– with true
    multi-tasking, virtual memory, shared libraries, TCP/IP networking and other advanced
    features.


    Many Linus see NT''s most serious competitor, the only practical alternative to
    the Microsoft monoculture – singular proof of the ideal that says we should have
    a choice.


    Linux, it turns out, there was no intentional masterstroke, but an incremental
    process, a combination of experiments, ideas and tiny scraps of code that gradually
    evolved into an organic whole. Many of Linus''s formative years of low-level programming
    were spent poring over Sinclair CL launched in 1984 that had many faults but one
    real virtue: it was a true multi-tasking system that allowed advanced hacking.
    But the key event that ultimately led to Linux occurred in the autumn of 1990,
    when Linus took a UNIX course at the University of Helsinki, where he studied
    and eventually earned a master''s degree in computer science.


    Linux began to experiment, using Minix as scaffolding to develop a new program.
    He never intended to create a kernel, the part of an operating system where the
    real processing and control work was. Instead, a purely practical need to read
    UseNet groups drove him to modify those first two processes. ‘At some point,’
    he recalls, ‘I just noticed, hey, I almost have this functionality.’


    In 1991 he needed a simple terminal emulation program to access newsgroups. So
    Linus sat down and wrote one – based on his two-process lash-up. As Linus tells
    it, doing so was simply a matter of changing those As and Bs into something else.
    ‘One process is reading from the keyboard and sending to the modem’ – which connects
    to the university computer – ‘and the other is reading from the modem’ – receiving
    the news – ‘and sending to the screen.’


    But there was something else Linux needed: drivers. A driver acts as a software
    buffer between something central (like the kernel) and something peripheral (like
    a keyboard, screen or modem). It could be built straight into the kernel, but
    then it would be necessary to rewrite the kernel each time you wanted to use a
    bigger screen, a different keyboard or a faster modem.


    In the summer of 1991 – just six months after he got his first PC – Linus found
    he needed to download some files. But before he could read and write to a disk,
    ‘he had to write a disk driver. Then I had to write a file system so I could read
    the Minix file system in order to be able to write files and files to upload them.
    When you have task-switching, a file system and device drivers, that’s ‘UNIX’
    – or at least its kernel. Linux was born.


    8 The Linux Companion'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'This fledgling system would have been short-lived had Linus not mentioned it
    in the Minix newsgroup. His early posting prompted an offer of space on an FTP
    server at the Helsinki University of Technology, letting people download the first
    public version of Linux.


    By January 1992, only around 100 people were using Linux, but they provided critical
    online baptism. Those early uploads and comments were crucial. Particularly important
    were the patches sent by free programmers to fix problems they found with the
    code. Anybody anywhere on the Net could obtain the basic Linux files. Email enabled
    them to comment and offer improvements, while Usenet provided a forum for discussion.


    A kernel on its is not much use, even if it is being constantly refined through
    patches by interested programmers. Part of the reason Linux took off so spectacularly
    is that nearly everything needed for a complete OS was already there. These programs-waiting
    were part of the Free Software GNU project. The receptively named author – ‘What
    GNU? GNU’s NOT UNIX’ – was begun in 1984 by Richard Stallman as a reaction against
    some of the draconian rules imposed by vendors on software users.


    GNU’s aim was to make a complete ‘free’ version of UNIX – the kernel and all the
    associated elements – that is, one gives users the freedom to share and change
    software not any restrictions or impose on them. With the Linux kernel, Stallman
    says, ‘the available free software added up to a complete system’.


    Rather wait for someone to write applications designed specifically for his operating
    system, Linus tweaked Linux to perfectly GNU’s pre-existing applications. ‘I never
    ported programs,’ Linus says. ‘I ported the kernel to work with the programs.
    Linux was never the primary reason for anything – user programs have always been
    the reason.’


    A similarly approach allowed Linux to acquire, almost overnight, a graphical user
    interface (GUI) similar to Windows – this was indispensable for its wider acceptance.
    (Until then, Linux was controlled through obscure commands entered at a prompt,
    like DOS.) The GUI was provided by the Xfree86 project, a non-profit group that
    provides free software for PC versions of the Windows system.


    Linus also adopted the standard GNU licensing scheme called copyleft. The general
    public licence, or GPL, allows users to sell, copy and change copy-


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_36_0.png)


    # Kernel


    The kernel is the ‘heart’ of the entire system. All the threads are brought together
    in the kernel: memory allocation, managing the process tables, the administration
    of multi-tasking, and multi-user capabilities, management of access to the file
    systems, management of drivers for access to specific hardware and so on.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'lefted programs – which can also be copyrighted – but you must pass along the
    same freedom to sell or copy your modifications and change them further. You must
    also make the source code of your modifications freely available.


    GPL has proved a powerful force for Linux''s success. It has encouraged a flourishing
    commercial Linux sector. GPL also has given programmers an incentive to join the
    essentially philanthropic spirit of the Linux movement. The licence has ensured
    that Linux is freely distributable, but not unfairly exploited or locked into
    proprietary products by unscrupulous commercial organisations.


    In a sense, GPL provided a written constitution for the new online movement of
    Linux programmers. The licence said it was acceptable to build on, or incorporate
    wholesale, other people''s code – just as Linux – and even to make money doing
    so (programmers have to eat, after all). But the programmer''s fundamental law
    of software must not be broken: source code must be freely available for further
    hacking.


    In 1994, the official Linux version 1.0 appeared, almost as a formal declaration
    of independence. By then the user base was already large, and the core Linux development
    team was substantial. Among the thousands of files Linux contains, there is one
    called Credits. In it are the names, addresses and contributions of the main Linux
    programmers. The list runs to more than 100 names, scattered around the world.


    The growth of the development team reflected the natural development of Linux
    itself. Linux began choosing and relying on a few trusted lieutenants from whom
    he took larger trusted patches.


    The Linux approach is deceptively simple. All programmers are free to work on
    any additional features or improvements. Even in the earliest stages, new code
    is freely downloadable for users to try and critique: beta testing is not a last-minute
    attempt to catch the worst flaws, but an integral part of the process. When several
    people work on the same area, they may compete or combine; the best code surfaces
    through raw and thorough selection.


    This freeling situation has allowed hundreds of thousands of users to employ Linux
    on perhaps tens of thousands of hardware configurations: Linux supports everything
    from an Intel 386 to a Pentium Pro, along with platforms based on Alpha (Digital’s
    RISC chip), SPARC (Sun’s RISC chip), MIPS (port to Silicon Graphics’ RISC chip
    under development), and Linux that runs on Intel and PowerPC machines. Users also
    have, via the Net, ready means for communicating any problems to the person who
    knows the program best – the author. That can be a big plus, or a distinct minus.
    While serious programmers might like having just their questions answered fast.
    Providing a reliable Linux helpdesk could help a commercial vendor bring Linux
    to the masses.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'The automatic selection of programmers to work in the areas they know best,
    and the ability of the system to extend endlessly by delegating tasks in this
    naturally distributive way, has produced other benefits. Linux has rapidly obtained
    features that have taken commercial vendors years to develop.


    Indeed, the pace of upgrades is astounding: from the earliest days, the latest
    patches typically appeared every week. And yet in parallel, there is always a
    stable release distribution that moves forward as inexorably as the new features
    have been thoroughly tested. Linux proceeds with point releases –1.1, 1.2, and
    so on. There is also a complicated system of subpoint releases such as 1.1.12.
    When a big enough jump in software functionality occurs, developers move to the
    next version, a process normally proceeded over by Linux.


    This two-track development process has Linux probably more advanced and yet more
    stable than any other version of UNIX today. Linux is now entering an era of pure
    development instead of just catching up, and this is where its huge number of
    developers and testers will give it an incredible edge over any other operating
    system NT included.


    The latest version of Linux offers 64-bit processing (NT and many UNIX systems
    are only 32-bit); symmetric multi-processing, which allows the simultaneous deployment
    of several chips in a system; and networking more advanced than that of any other
    operating system.


    A relative advantage of Linux''s developmental structure is that secures typically
    turn up faster than commercial suppliers. For example, when a ''Ping of Death''
    assault of multiple, low-level messages crashed several operating systems worldwide,
    a quick patch to Linux enabled the attack to be thwarted in a couple of hours.
    Users of other operating systems had to wait far longer for their systems to be
    fixed.


    > Did you know that?


    System administrator

    This is the person responsible for maintaining and supervising a complex system
    or network. Generally, the system administrator is the only person who has access
    to all parts of the system (root permissions).


    # Open Source


    One of the first things which happened to change the face of software was the
    release of the Netscape browser''s source code. This brought to public attention
    a conflict between two dramatically different and fundamentally opposed styles'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'of software development, a confrontation that had been in the making for 30
    years but became inevitable after the advent of the World Wide Web and the explosion
    of the Internet''s popularity in 1993–1994.


    The first of the two growing is closed source, the traditional factory-production
    model of proprietary software, in which customers get a sealed block of bits that
    they cannot examine, modify or evolve. Microsoft is the most famous practitioner
    of this approach. The other style is open source, the Internet engineering tradition
    in which source code is generally available for inspection, independent peer review
    and rapid evolution. The standard-bearer of this approach is the Linux operating
    system.


    The open source model threatens to make closed source software obsolete. To understand
    why, we need to step back from Microsoft and Linux and consider that engineers
    and high-tech executives are attracted to open source development for three reasons:
    reliability, reduced cost of ownership and improved strategic business.


    Historically, the way engineers and scientists have ensured high reliability of
    their products through peer review. Physicists do not conceal their plans from
    each other; instead, they check and recheck each''s work. Engineers do not build
    dams or suspension bridges without having other engineers of the original design
    group examine the blueprints.


    Software companies do not generally do peer review of their code. And in the software
    industry, reliability has always been poor. Crashes, hangs and lost data are commonplace.
    These observations may seem unrelated, but the connection is clear when you look
    at the infrastructure of the Internet.


    Most of the software that runs the Internet, like Apache (the most common Web
    server), Perl programming language and Sendmail email system were developed under
    the open source model, and its reliability is extremely high. This level of reliability
    is even more significant given that the Internet is multipatform, heterogeneous
    and has remained backward-compatible through decades and several generations of
    technology.


    A simple and complex pattern is starting to emerge. Open source software goes
    through rigorous peer review and has high reliability. Without peer review, software
    reliability suffers. This fact in itself may be sufficient to generalise closed
    source commercial development.


    Total cost of ownership is drastically affected by open source software. In a
    closed source world, a producer charges for the bits and has an effective monopoly
    on service for its products. Accordingly, major closed source packages cost thousands
    of pounds up front, thousands of pounds a year in service and upgrade costs. In
    the open source world, by contrast, the bits are free, the source code is available
