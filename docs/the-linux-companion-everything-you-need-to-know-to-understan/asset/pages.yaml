  md: '# # Linux Open Source


    Sun and the Linux Community


    Linux is an open source kernel today, widely used, and mirrors the work of Unix.
    Sun''s Solaris Operating Environment is based on Unix, but Linux has been adapted
    to many platforms through the efforts of many developers.


    Connected with Sun over computing vision, Linux uses open standards and non-proprietary
    interfaces. Sun''s Solaris Operating Environment and Linux share many common features
    through the efforts of the Linux and network community.


    This leads to:


    +   - More innovative and competitive Linux applications

    - A larger, more diverse pool of talented engineers and developers

    - A broad range of computing solutions from multiple vendors


    Sun''s related activities


    +   - Sun participates with the Linux and Open Source communities

    - Sun participates in the Linux-standardization effort - Linux Foundation

    - Co-chair of the Linux-onSPARC architecture

    - Leadership in industry standards


    Sun wants to bridge the gap between the Solaris Operating Environment and Linux
    so that users can easily access both.


    +   - Interoperability

    - Open Standards


    Sun is willing to provide the Solaris Operating Environment and Linux with common
    tools and utilities to ensure seamless use.


