  md: '# Sendmail


    Originally developed by Eric Allman in 1981, Sendmail (www.sendmail.org/) is the
    dominant mail transport agent on the Internet, with an estimated 75 to 80 per
    cent market share.


    Regardless of the email program used to create email, any mail that goes beyond
    the local site is generally routed via a mail transport agent. Given the number
    of ''hops'' any given Internet mail message takes to reach its destination, it
    is likely that virtually every piece of Internet email is handled by a Sendmail
    server somewhere along the route. Sendmail is used by most Internet service providers
    and shipped as the standard MTA solution by all major UNIX vendors, including
    Sun, HP, Compaq and SGI.


    # Did you know that...?


    Account

    This is a combination of login and password. In general, the system administrator
    creates the user account. It also assigns one or more groups to the user, as well
    as the resulting permissions. Creating a user account normally includes assigning
