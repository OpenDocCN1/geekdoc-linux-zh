  md: 'some way to redress the issue, which is one reason viruses are less common
    on Windows NT. Meanwhile, all sorts of automation features were built into their
    applications. Automation, in the form of Visual Basic interpreters with access
    to inter-process communication, via OLE/ActiveX, is a wonderful tool. Automation
    without a security policy is, however, a virus-writer’s dream.


    One of the much-trumpeted design characteristics of Java was that the Java virtual
    machine provided a means of security for Java programs. Standard ActiveX and VBA
    on Windows 98 has no such protection mechanism, which is why a Word document,
    delivered via email and opened by clicking on an attachment’s icon, was allowed
    to rifle through a private address book, maintained by a different application,
    and send email to other people without the user even being aware of it.


    There are many applications on Linux that have built-in automation languages.
    However, unless you deliberately set out to compromise your system’s security
    policy and modify some start-up command files, there is no way that merely opening
    a file in vim will trigger the execution of scripting commands hidden inside it.
    This pattern is repeated across all Linux sub-systems. It does not mean that Linux
    is invincible. A particular point of vulnerability is the Internet; not from random
    viruses, but from bad people who want to get to your machine’s resources or network
    connection from outside.


    If you provide network services like mail and news, programmers can find open
    ports, using tools called port scanners, and attempt to feud data to the servers
    in the hope of crashing them and making them execute arbitrary commands.


    You must be careful about blocking unused services and tracking changes in system
    files. Tripwire is an indispensable tool for monitoring these files; http://www.tripwire.com/
    for details (Figure 5.9). Most of the loopholes exploited by crackers get blocked
    fairly rapidly, but if you run an out-of-date system you may be vulnerable.


    One important law of security is that ‘security through obscurity’ does not work.
    That, if you make some sort of software product and find it has a security hole,
    trying to preserve security by stifling discussion of it simply won’t work; sooner
    or later some curious cracker will figure it out, and when that happens the crackers
    will soon know your users will still be in the security fix. The darkest antidote
    to security holes is Linux Linux is in general very good about this sort of thing;
    security holes are yelled about and patches distributed within hours or days of
    their discovery. So you may get the impression that Linux has more security problems
    than, say, Windows, because you hear more about them: but in reality, what is
    happening is the security problems are being fixed instead of being ignored.'
