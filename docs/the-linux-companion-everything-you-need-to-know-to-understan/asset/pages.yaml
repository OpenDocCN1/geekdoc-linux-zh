    # Viruses


    You probably heard about the Melissa virus. Various members of the great and good
    of the IT community panicked, predicting the end of the Internet; some large financial
    institutions shut down their Internet email gateway in the hope of keeping it
    out.


    Linux is not entirely immune to viruses. For example, a DOS boot sector virus
    that infects a dual-boot Linux/Windows machine can lie dormant while Linux is
    running, whenever the machine reboots it can be activated and if it reboots on
    a flag day (a day when a virus is programmed to start) the virus may trash the
    system.


    But there are some categories of virus that Linux is completely, nearly completely,
    immune to. Many DOS or Macintosh viruses rely on appending copies of themselves
    to other uninfected executable files. Linux viruses have been written just for
    that, have never been seen in operation. One reason for this is the Linux file
    access control system; you cannot write to a file that you do not have permission
    for this. This was inherited from UNIX, which started life as a mincomputer and
    mainframe operating system: many people could use each machine at the same time.
    Almost all of the programs on the system are therefore owned by the super-user,
    ''root'' (or a user ID like ''news'' or ''mail''), specifically to stop any tampering
    with something that is rightfully the province of the mainframe''s system administrator.


    It follows that unless a virus has the luck to get onto the system and is executed
    by a user with root privileges, it cannot append itself to most of the programs
    on the system. If it cannot append itself to programs, it cannot spread. And sensible
    system administrators do not just run binaries downloaded off the net or a CD-ROM
    without taking precautions. Traditionally, system administrators built most of
    the software installed on their machine by hand, compiling and


