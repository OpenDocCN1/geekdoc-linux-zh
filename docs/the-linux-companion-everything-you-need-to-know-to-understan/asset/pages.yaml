  img_proc: true
- pgno: 57
  md: 'An application''s user interface determines its appearance and behaviour. There
    are two commonly used types of user interfaces for Linux.


    # Graphical user interfaces


    When a user interface has graphical objects, such as windows and menus, it is
    called a graphical user interface (GUI). KDE and Gnome provide interfaces between
    you and your computer.


    The graphical window system, which is part of the graphical user interface, organises
    graphics output on the display and does basic text and graphics functions, very
    similar to using Microsoft Windows.


    # Command line interface


    The command line interface (CLI) is also known as the shell. This interface is
    character-based. The screen displays a system prompt, and the commands you type
    from the keyboard appear next to the prompt.


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_57_0.png)


    As well as the GUI discussed above, Linux does access to a powerful command line
    interface. This is unsuitable for general use by the majority of users. But for
    advanced users like programmers the command line interface or ''shell'' is a useful
    alternative. The shell is only superficially like the old MS-DOS prompt. A shell
    language has access to dozens of commands and has a richer syntax. Having different
    ways of doing the same thing provides flexibility as well as adding complexity.
    You can get things in the way you want to do them. Again, this is usability is
    all about.


    # Interface


    Generally speaking, an interface is a device where different systems exchange
    information in any way. An example of such an interface is a keyboard where man
    and machine meet. This is intangible. Some other interfaces are more concrete,
    such as the hardware interface, which connects peripheral devices such as a parallel
    port (printer), SCSI or serial interfaces; the software interface, which assigns
    how programs should communicate; and the user interface, where people and machines
    exchange data by means of keyboard, mouse or monitor.


    # Command line interface vs. graphical user interface: pros and cons


    The shell (CLI) has a rich set of commands but it is easy to make mistakes. The
    GUI only has menu commands but it is easy to see what you are doing. The choice
    is yours. From, a user support point of view, shell commands are often better
    as they are easier to explain.


    Another important usability issue is what to do when you have a problem.'
  merge: -1
  img_proc: true
- pgno: 58
