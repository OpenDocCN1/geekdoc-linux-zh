    With TeX or LaTeX2e, SuSE Linux offers a sophisticated text processing system,
    which is well established in the scientific and the publishing world. If you have
    ever tried to create a document consisting of several hundred pages with a standard
    word processing system, you know why you need LaTeX2e.


    TeX is an interpreter that works similarly to a setter at a printing company.
    Even the very complex setting of mathematical formulae is no problem for TeX.
    Contrary to the usual WYSIWYG (what you see is what you get) word processing you
    enter your text in TeX as ASCII text with the appropriate formatting commands
    in a standard editor. The resulting file is then compiled by the TeX interpreter.


    With the LaTeX package, SuSE Linux provides an extensive collection of TeX programs
