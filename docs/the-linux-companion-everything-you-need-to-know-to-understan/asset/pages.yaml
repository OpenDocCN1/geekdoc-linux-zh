- pgno: 139
  md: '# Printing


    Linux probably would not exist if it were not good at handling the tedious job
    of putting ink, or toner, on paper. When UNIX was first developed within AT&T''s
    research labs, much of the work was funded internally on the promise of developing
    a low-cost document editing and typesetting system for the labs. UNIX machines
    were first deployed within AT&T for document processing, in the early 1970s before
    the personal computer and the modern word process existed.


    When you install SuSE Linux install a print server. You can plug a variety of
    printers into any Linux box and tell the lpr (line printer) subsystem about them;
    thereafter, you can rely on this system to maintain queues of print jobs for each
    printer and do various interesting things to them. If sounds mundane, it is worth
    remembering that DOS did have such facility; while Windows and MacOS have print
    spoolers, UNIX had nearly a decade before those operating systems were written
    and can still show them some effective tricks.


    The most common print subsystem is the Remote Printing ring, LPRng. It consists
    of a group of command-line tools and an lpd (line printer daemon), which listens
    for incoming print jobs and controls everything. You configure lpd by editing
    a file /etc/printcap, although most Linux distributions use graphical tools to
    hide this from you (YaST in SuSE''s case).


    One feature of lpd is that you can tell it to send all incoming print files through
    a chain of filters (pieces of software that reformat the documents in various
    ways).


    A universal trick, which all the major distributions play, is to try to turn all
    incoming print jobs into PostScript; if you do not have a PostScript-capable printer,
    to feed them to GhostScript. GhostScript is basically a PostScript language interpreter;
    it reads PostScript files in one end and generates a graphical bitmap to send
    down the wire to your printer. Unless you have an unintelligent printer, for which
    there are no GhostScript drivers, or an ancient daisywheel printer, you will be
    able to configure your Linux system to use it as the output side of a colour PostScript
    printer.


    Another handy thing is that the printer does not have to be connected to your
    current machine. You can print to a network printer, as long as it has an Internet
    address, or even to the lpd daemon on UNIX or Linux system over the Internet,
    as long as it has permission to receive print jobs from your machine (granted
    in the /etc/lpd.hosts file) and recognises you as a'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'known user. It is also possible (with a little work) to set up a print queue
    recognised by lpd feeds documents into a fax server''s queue, if you have suitable
    fax software installed on your system, as mgetty.


    Linux comes with a selection of tools for manipulating PostScript files. Some
    are of the GhostScript package; ps2pdf, for example, takes PostScript files and
    turns them into Adobe PDF files, suitable for transfer to other machines. The
    very practical mpager filter takes any old text file and turns into a PostScript
    image with headers and footers and can print it two-up or four-up on the paper.
    On the Macintosh and PC interoperability side, both the Netalk (Applet server)
    and Samba (SMB server) systems come with the ability to make a Linux queue show
    up as networked printer to Mac or Windows machines on the network.


    All of the above means that if you have a 486C with, say, 8Mb of RAM and a 120Mb
    hard disk, with an Ethernet card, you can configure the 486 to print to the printer
    while making it looks like a networked PostScript printer to the other machines
    on your local area network (LAN), all of which will save you a few pounds if a
    networked PostScript printer is something you need.


    I have used my trusty Kyocera printer on many Linux installations and never had
    a problem. Kyocera printers appealed to me for their reliability, economy and
    the eco-friendly features. Check them out at www.printer.kyocera.de (Figure 5.33).


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_140_0.png)


    # Figure 5.33 The Kyocera site'
  merge: -1
  img_proc: true
