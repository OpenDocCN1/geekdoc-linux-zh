  md: '# Accompanying CD-ROM

    SuSE Linux 7.0


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_255_0.png)


    # Important


    Please note that the evaluation CD is released without support. Sources of information
    are available on the internet in electronic form, in the handbook, from the SuSE
    Support Database, as well as the SuSE Linux mailing lists.


    # Requirements


    You can set up SuSE Linux on your computer by the evaluation CD without having
    to change the partitioning of the hard drive. If you have approximately 100 MB
    (ideally, 200 MB) of free space available on your hard drive, the evaluation system
    can even be installed permanently.


    A computer with at least the following hardware is required: Pentium processor
    (or compatible), 64 MB RAM (memory), a bootable CD-ROM drive and a BIOS supporting
    2.88 MB boot images, as well as a partitioned and formatted hard drive.


    # Installation with YaST2


    Please note: Be sure to make a back-up copy of your data before the installation.
    There are no guarantees that data will not be lost. If you''re careful the chances
    can be drastically reduced, although not completely. You should therefore make
    a back up before the installation!


    +   1. Insert the CD and start up the computer. After a few seconds Linux will
    begin to load. If the computer does not boot from the CD you will probably need
    to change the boot-order in the BIOS.

    2. An automatic hardware detection is carried out. After the automatic hardware
    detection, the installation routine tries to create an approx-'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'imately 100 MB working file (suselive.usr) but if you have less than 128 MB
    RAM, a swap file for virtual memory (suselive.swp). The actual configuration data
    of the system is stored in the file suselive.640 when the system is shut down.
    As a rule, these files are stored on the first FAT partition (drive C:). The CD
    is mounted.


    +   3. You can determine the basic settings with the help of the graphic installation
    program, YaST2; language, keyboard, and time-zone. The mouse is automatically
    detected in most cases. Detailed texts on the left-hand side provide context-related
    help.


    +   4. The user and root logins need to be given passwords.


    +   5. You have a chance to adjust the standard resolution (1024 × 768 is recommended)
    and the colour depth (16 bpp is recommended) and then to adjust the monitor; for
    this, select the «Test» button.


    If difficulties arise here, to abort the configuration with Ctrl-Alt-Backspace;
    if all fails, switch the computer off, to prevent hardware being damaged. You
    can try the installation again by entering at the boot prompt, right at the beginning:
    linux vga=3.


    +   6. With YaST2 you can configure the »printer», »sound», »Internet access»
    »network. If you want to leave these items out, select »Complete Installations
    straight away.


    +   7. The installed system is started.


    +   8. You can log in via the KDM (KDE Display Manager) and use the programs in
    the KDE graphical interface (K Desktop Environment).


    # Caution


    You should never just switch the computer off. Always shut down the computer.
    To do this, the ending KDE session with »Logout« and in the KDE dialog, again
    with »Logout«.


    # Booting SuSE Linux and working with the system


    If the files to store the system data can be set up as often as your hard drive,
    SuSE Linux 7.0 can be started as often as you want. Boot the computer each time
    with the evaluation CD and just wait until the KDM login-dialog appears.


    Important: since all programs are loaded directly from the CD, you may not remove
    the CD from the drive during operation. It lies in the nature of things that the
    overall system, for this reason, runs a bit slower than if SuSE Linux were installed
    on the hard drive, and would use its own file'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'system. The speed is dependent on the CD-ROM drive used – ‘fast’ drives take
    more time!


    # More information


    The complete handbook for SuSE Linux:


    +   - ftp://ftp.suse.com/pub/suse/i386/6.4/doc/book-de.pdf


    The SuSE Linux mailing lists:


    +   - http://www/en/support/mailinglists/


    If you have questions, please check the SuSE Support Database:


    +   - sdb.suse.de


    More information on SuSE Linux can be found in the Internet at:


    +   - http://www.suse.de


