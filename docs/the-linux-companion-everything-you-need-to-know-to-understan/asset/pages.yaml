- pgno: 122
  md: '# What is the market for VMware?


    There are many market targets that are suitable for VMware: people who need Windows
    productivity applications on Linux (office, mail, browsers) because they can run
    Windows programs without the need to reboot the computer; developers who write
    and test software as well as people who provide tech support, because they can
    have multiple platforms to work on and test various configurations at the same
    time; people who develop Web content and Web sites, because they can use different
    browsers on different platforms to preview the content they are working on.


    VMware can change the way people think about their PC and operating system. Today,
    there is a 1:1 mapping between your hardware, the OS you run and the applications
    you can run; for example, on a PC running a Windows operating system, you can
    run only Windows NT and/or Windows-compatible applications, or a Linux PC you
    can run only Linux-compatible applications, and so on.


    And there is no concurrently running applications for Windows NT and Linux on
    the same PC, natively. As a result, you are limited in what you can do: software
    testing, installs and upgrades are tedious and time-consuming. Operating system
    or application crashes have a high impact and bring down the PC. There is a limit
    in the applications you can run. With VMware, you can


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_122_0.png)


    Figure 5.19 Download VMware for Windows'
