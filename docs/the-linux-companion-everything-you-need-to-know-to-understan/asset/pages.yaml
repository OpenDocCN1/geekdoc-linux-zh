    +   13. VMware Virtual Platform uses all the processor components, consequently
    eliminating the overhead typically associated with PC emulators.


    Power users are the ones who will get the most out of VMware. They will find it
    very convenient to run additional instances of Windows NT or other OSs. VMware
    for Windows NT installs as any standard application would.


    Windows NT power users will get the following benefits. It is possible to:


    +   1. Develop and test applications simultaneously for multiple target environments.


    +   2. Evaluate beta releases without endangering the host OS.


    +   3. Run real MS-DOS, extensions, and applications.


    +   4. Add new OSs without disk repartitioning.


    +   5. Network virtual environments and share files and devices.


    +   6. Undo any changes made in a user session to recover from problems, including
    registry corruption or viruses.


    +   7. Run legacy applications while simultaneously running the latest operating
    systems and applications.


    +   8. Run Linux with concurrent access to Windows NT and any other Windows applications.


    These are some of the incredible features offered by this revolutionary software,
