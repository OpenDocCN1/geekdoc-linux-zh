- pgno: 217
  md: 't is a very exciting time in the development and use of Linux. Its popularity
    is accelerating rapidly. But what is the future of Linux? Where does-it go from
    here? And how does it get there?


    Trying to make confident predictions about the future of Linux is a daunting subject.
    Things are changing so rapidly that most predictions become out of date within
    a few months, if not weeks or days.


    Imagine going back to a Users group meeting in late 1998 and trying to tell them
    what was going to happen over the next two years. You would have been laughed
    out of the room by the most optimistic of the Linux advocates. I know from my
    own speaking experiences in 1998 when I brought the subject of Linux into my presentations,
    nobody knew what I was talking about. Though in all fairness I was one of the
    few who understood Linux at that time I was an IBM vice president asked me what
    I thought of. I replied in four words: "Linux is our future." He then took me
    into a room where many of his senior managers were assembled and, in front of
    them, asked me the same question. I gave the same answer. Today I still reply
    in the same way.


    Now try to look two years forward to 2002. Will Linux and open source software
    be? How will the Intel processor, the 64-bit processor, and IA-64 technology change
    the fortunes of Linux? What will become the commercial flavours of UNIX? Will
    the desktop environment of choice be KDE, GNOME, or something else? The honest
    answer is I have no idea.


    We are in the middle of a revolution, the Internet revolution, of which Linux
    is just one aspect. The thing about revolutions is that nobody knows how they
    will turn out. We only know that things will be different afterwards. All you
    can do stay alert and pay attention!


    Every so often, a technology shift of unprecedented proportions comes along. The
    world economy, the high-tech industry and individual careers are changed by it.
    That is where we are today, with the explosive growth of and interest in Linux.
    Linux will devastate current high-tech business models, causing the most fundamental
    shift in the computing revolution since the arrival of the Internet. Yet Linux
    will provide unprecedented business opportunities to those who take advantage
    of what it offers; it is the Aladdin''s cave of computing technology. The impact
    of Linux on high-tech share prices, margins, profits and costs will be massive,
    as completely new and different software standards takes hold. Companies will
    find it increasingly difficult to recruit and keep the best of the high-tech field,
    unless they are willing to cater for Linux. Linux is more than a piece of software;
    it is a movement.


    Shrink-wrapped games for Linux are now on the retail shelves. Maybe I should have
    seen this one coming, but since I don''t follow the games, I missed it. The implications,
    however, are significant. The fact that profit-seek'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'ing enterprises realise that they can make out of selling games for Linux destroys
    the myth that Linux is a server-only operating system. For years, Linux has been
    a threat to Bill Gates and Microsoft. After the courtroom drama in the USA, which
    culminated with a proposal to force Gates to split the Microsoft empire into two,
    Linux could be about to send further tremors upon the besieged Microsoft camp.
    The US court proposals may well bolster the rapid growth of Linux.


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_218_0.png)


    # # Where is Linux today?


    The following points summarise Linux''s position in the market today:


    +   - It is a proven, efficient and highly stable operating system capable of
    running on desktop PCs as well as larger servers.

    - It is an open source, publicly distributed system that encourages any or any
    company to enhance and redistribute it without exorbitant licensing restrictions
    or fees.

    - It is an architecture and user interface that is very similar to UNIX. Thus,
    a substantial community familiar with the UNIX/Linux model exists within the IT
    industry.

    - Linux is already widely deployed in some segments of the IT industry; it is
    a particularly popular OS for Internet servers.

    - Linux is a relative ''newbie'' in the desktop PC arena but it is getting much
    attention as an alternative to existing systems, particularly to Microsoft Windows.


    Can Linux go further? The answer to this depends upon how attractive Linux is
    to the potential user community.


    Linux''s strength lies in its overall cost-effectiveness when compared to other
    OS alternatives. However, it has one weakness. While it is true that performance
    is a major issue for applications that run on workstations, this is not the case
    in the desktop arena. This arises from the simple fact that many current desktop
    applications perform well enough while using only a fraction of the hardware available
    from current top-end desktop PCs. The real weakness of Linux is not in performance,
    but in the availability of applications and support for the most commonly used
    devices, this is is changing daily.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Where will Linux go in future?


    Linux will go only as far as its strengths and weakness will take it. Since its
    reputation is already accepted in the server community, it requires Linux to be
    accepted within the workstation and desktop communities.


    Wider availability of applications and increased device support will also follow
    upon the heels of the increasing popularity of Linux. While the Linux community
    itself will continue to provide many important applications and enhancements,
    traditional software and hardware vendors will need to do their part by increasing
    support for Linux. Suppliers are more likely to do this as they observe the increased
    popularity of Linux, as their customer base demands it.


    This means that Linux will inevitably become vastly more popular in all of these
    areas. In the desktop arena especially, Linux could become a cost-effective and
    very popular alternative to Microsoft Windows. And if that happens, it will provide
    the industry with a solution to the Microsoft ‘problem’ which does not require
    government intervention or reverse marketplace engineering.


    # The increasing influence of Linux


    Perhaps the most powerful movement in the software industry today is the continuing
    pace of Linux development, producing many reliable and successful applications.
    Linux is a seemingly impossible development methodology in which source code is
    developed and debugged not by one company or even one group of individuals but
    rather by a fragmented and distributed workforce simultaneously working towards
    a common goal. Believe it or not, these individuals are likely to have never met
    in person, and they provide most of their efforts on a volunteer basis. The only
    requirement of the open source movement is that source code must be freely distributed
    to customers and competitors alike.


    Can distributed volunteer developers really produce reliable code? Can Linux further
    impact the industry? How can business models exist if all the code is exposed
    for free? Could Linux influence my business? The answers to these questions may
    be surprising to you.


    What’s more, understanding the Linux movement may be important to all business
    executives, as the lessons learned may be applicable to every industry,'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'particularly as we move toward an increasingly computerised economy. With that
    as a background, there are six things that every person should know about Linux
    and open source.


    +   1. Linux works.


    It may seem unbelievable that volunteers can produce robust and complex software
    applications. Linux works, and it has an increasing base of users for all types
    of open source code, from operating systems to compilers to applications, to prove
    it. This movement, which began years ago, thrives on leverage. By distributing
    a task across a large group of ‘users’, the project as a whole can move faster
    than if the project were controlled by a single entity. The most successful Linux
    projects rely more on distributed testers and debuggers than developers, but the
    result is nonetheless remarkable.


    +   2. Linux development produces business-quality code.


    The most obvious verification to the business success of Linux is the unwavering
    dominance of the Apache web server. According to Netcraft, Apache runs on more
    than 60 per cent of the world’s Web sites and gained consistent market share.
    Linux supporters believe that distributed testing actually leads to more reliable
    code than ever be achieved within a single organisation. Search the Internet for
    open source code on Linux and you will find many users who believe open source
    code is, in fact, more reliable than Microsoft’s Windows NT. And while Microsoft
    will vigorously disagree with this position, the fact that the argument exists
    at all is a testament to the obvious legitimacy of open source code.


    +   3. Linux business models are emerging.


    Believe it or not, it turns out that you can make money off freely available software
    code. SuSE packages, distributes, supports, and more importantly, brands a version
    of the Linux OS. With any software product, users value consistency and trust,
    and SuSE has done a wonderful job of packaging and distributing the Linux OS.
    Yes, you can download the code for free, but for many users, £35 is a reasonable
    fee for code that is easy to install, comes complete with documentation, and comes
    with the support guarantee of SuSE. Compaq, Oracle, Novell, IBM, Intel and Dell
    have all recently invested in Linux, and each company has entered into an agreement
    to either distribute or build upon the Linux OS.


    +   4. Linux is a tough competitor.


    Competing with Linux can be compared to fighting an invisible opponent. For instance,
    Apache and KDE code is maintained by not-for-profit organisations. In addition,
    the software is available for free, which'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'eliminates price as a competitive weapon. The pricing activities used by Microsoft
    Netscape are less effective against an already free solution. And while Microsoft
    has begun to attack Linux, as well as the legitimacy of the open-source model,
    they have placed themselves in an awkward position by maintaining that the success
    of Linux is a competitive threat. As modifications of the Linux model thrive,
    more companies will be forced to adapt to this stable and reliable competitive
    force.


    # Linux models are emerging for subject matter.


    While the Linux elitist will disagree with the specifics of this comparison, we
    are seeing open source models emerge for subject matter in addition to software.
    Unquestionably, the most successful example is Netscape''s Open Directory initiative.
    Once called NewHoo, this alternative directory listing to Yahoo! is built by an
    army of distributed volunteers, much in the same way that Apache and KDE is built
    by distributed programmers. In addition, the results of the directory are freely
    available on the Web for anyone to use, just as with open source code. Open Directory
    supporters argue that no one company''s staff will be able to compete with its
    volunteer base. In addition, the more sites that use the directory, the more volunteer
    editors will be drawn into the project. It is highly likely that the distributed
    open content model will be replicated in other fields, and as with open source
    software, it may prove to be an agile competitor.


    # Linux as a defensive weapon.


    At the end of the day, Linux may prove to be more of a defensive weapon than an
    offensive one. Consider the example of Netscape''s Open Directory project. By
    organising and freely distributing the directory data, Netscape may have neutralised
    the directory as a competitive differentiator for portal sites. We may, in fact,
    see more companies ''donate'' certain intellectual property to the Linux community
    in an effort to diminish a particular aspect of competition.


    As another example, it may be in America Online''s best interests to make sure
    that Netscape''s browser code is fully embraced and absorbed by the open-source
    movement. No single company is likely to challenge Microsoft''s increasingly dominant
    market share in browsers; however, a freely available browser that can be customised
    by ISPs, software sellers and portals alike gain popularity.


    With the rising awareness of the potential for Microsoft to use the client as
    a control point, a true open source browser initiative may be what is required.
    Keep your eye on KDE''s development of a browser.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Linux as a production model should be appreciated in the same light as Henry
    Ford''s assembly line or a ''just-in-time'' manufacturing process. By taking advantage
    of the electronic communication medium of the Internet as well as the distributed
    skills of its volunteers, the Linux community has uncovered a leveraged development
    methodology that is faster and produces more reliable code than traditional internal
    development. You can criticise, doubt it, or ignore it, you will not stop it.
    It is here to stay.


    Part of Linux''s magic is that it offers the computer-using community with a counterbalance
    Microsoft''s dominance. There are many throughout the Linux community worldwide
    who are passionate in their belief that the future of computing should not be
    controlled by one organisation. Consequently, tens of thousands of brilliant programmers
    are dedicating their time to Linux to ensure the world has an alternative.


    The situation with Linux today is the same as it was with the Internet in 1993.
    Back then, the business world had first begun to hear of it and was coming to
    grips with the fact that something was happening. The smart ones kept up-to-date
    with the Internet''s emergence and discovered how to take advantage of it. It
    will be the same with Linux.


    Well-established Linux users tend to be technically orientated people. The average
    Linux aficionado is likely to be more capable of dealing with technicalities than
    the average Windows user. As evident by the trends of today, Linux software is
    going to become a lot easier to use, and the ''winners'' in the application market
    are going to be those companies who have an established presence in the Linux
    world. In order to get that presence, you have to be the best of the best, because
    your critics are going to be extremely technically capable, likely to be more
    interested in the product than the marketing. Just make the best product available,
    and the people who appreciate that will recommend the best product forever. In
    writing this I have no reservations in recommending SU Linux. I have experimented
    with many Linux distributions, and all of them are good, but I always come back
    to SuSE. I feel that they do the is and cross the ts. SuSE Linux is a complete,
    comprehensive Linux distribution with an excellent range of bundled commercial
    software and good support for useful hardware add-ons like ISDN and sound cards.
    If you want a good all-round package that you need no experience to be able to
    use, then SuSE Linux is for.


    As they say SuSE Linux – have a lot of fun!'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# # Appendix I


    # # SuSE Linux Frequently Asked Questions (FAQs)


    After the installation I always get the error message login: – what am I doing
    wrong?


    You are not doing anything wrong. The installation is complete and you may log
    in to the computer with your user name and password; initially, only the ''root''
    user exists.


    I have logged in, but all I can see is earth:# how do I get into Linux itself?


    You are already in Linux. You probably want to start the graphical user interface
    (GUI). This needs to be configured first (with SaX, for example). Then you can
    start the graphical system (X Window System) with the command startx.


    I use my computer on my own, so why do I always need to log in?


    Linux is a multi-user system. In order for Linux to know who is working on it,
    you need to specify a user name and password. Incidentally, you should only work
    as ''root'' if you need to make changes to the system (installing and configuring
    software and on). For normal operation you should create a standard user, then
    you cannot do any damage to the system itself.


    Do I need to compile my own kernel?


    No, in most cases this is definitely not necessary. The kernel has now become
    so large that there are some 800 options which need to be considered in the configuration!
    Since it is impossible to keep track of all these different configurations, I
    strongly recommend inexperienced users not to recompile the kernel. If you still
    want to do this, you do so at your own risk, and SuSE cannot provide any installation
    support if you compile your own kernel.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Do I need to compile the kernel for sound support?


    Not since kernel 2.2.x.


    # Where can I get more information on SuSE Linux?


    For information on SuSE Linux, use the handbook. Documentation on the programs
    can be found in /usr/doc/ packages, introductions in the HOWTos in /usr/doc/doc/howto
    for German, and in /usr/doc/ howto/en for the English HOWTos. They can be read,
    for example, with less/usr/doc/howto/en/DOS-to-Linux-HOWTO.txt.gz. In KDE you
    can also read the files (even though they are compressed) with the command kedit.


    # Where can I get special tips or help?


    You will find the SuSE support database at http://sdb.suse.de/sdb/in/html/index.html.
    Enter a search phrase or browse through the History link of the SDB.


    # How can I enter commands in KDE?


    Click on K, Tools, then Terminal. Alternatively you can press Alt+F2 and then
    enter xterm. Then you will have a ‘Terminal’ (often mistakenly referred to the
    DOS-window), in which you can enter commands.


    # I can''t find many programs in KDE.


    You can start all programs from a terminal window (xterm) by entering the program
    name and pressing Return/Enter.


    # I cannot log in to my computer with telnet. I always get the answer Login incorrect.


    You are probably trying to log in as ‘root’. For security reasons this is not
    possible via telnet. With YaST, set up a normal user account; you can log in with
    this username. Then you can change to the root user with su. It is much better
    and safer, however, to use the program ssh instead of telnet; the ssh program
    uses encoded, and thus secure, connections. You can find this program in the see
    secs.


    # Do I need to worry about viruses in Linux?


    No. In Linux there are no critical viruses to speak of. Also, viruses cannot cause
    any significant damage to the system as long as they are not invoked as root.
    The only virus scanners which exist in Linux are for searching mail for Windows
    viruses (if Linux is being used as a router).'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Where can I see system messages?


    As ''root'', enter the following command in a terminal window: earth:# tail-/var/log/messages.
    Other programs of interest in this respect are: top, procinfo and xosview. Messages
    which are sent at boot time are seen with the command earth: # dmesg or with earth:
    #cat/var/log/boot.msg.


    # Where is StarOffice?


    You will find StarOffice as the package so_en, which can be found in the series
    pay. Use the SuSE installation program YaST to install it, which will then tell
    you which CD need to insert.


    # I have found a bug in SuSE Linux. Where can I report this?


    First, make sure it really is an error in the program, and not just an operating
    or configuration problem. You should also first read the documentation in /usr/doc/packages
    and /usr/doc/howto. It is possible that the error has already been detected, and
    information on this can be found at Linux''s support database at http://sdb.suse.de/sdb/en/html/index.html.
    Enter a search pattern, or step through the History link of the SDB, to see if
    the problem has been registered. If it appears not to have been documented, send
    a description by email to feedback@suse.de, quoting your registration code.


    # How can I access my CD?


    You must first mount the CD.


    # I cannot remove CD from the drive: what should I do?


    You must first unmount ( umount ) the CD.


    # How can I see the space I have available in Linux?


    Use the command df-h.


    # Can I ''cut and paste'' in Linux?


    Yes. If you want to ''cut and paste'' in text mode, the program gpm must be running.
    The rule for both the X Window System and in text mode is highlight by pressing
    the left mouse button, drag and insert with the middle mouse button. The right
    mouse button has a special function in many programs.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# How can I install programs?


    Programs on the SuSE Linux CDs are best installed with YaST. Note that many of
    the larger programs can be found in the series pay.


    # I have a program ''only'' in source code. How can I install it?


    For many programs you need a certain amount of know-how. In short, unpack the
    archive with the command xvzf name.tar.gz, read the file INSTALL or README and
    follow the instructions. Usually this entails a /configure; make; make install.
    Please note that no installation support will be given for soft-compiled kernels.


    # I need firewall, masquerading, mailserver and WWW server software. Can I get
    help for these from Installation Support?


    No. SuSE Installation Support is to help you get Linux and running. For topics
    which go beyond installation support, there are some good books available, as
    well as excellent documentation in /usr/doc/packages and /usr/doc/howto/en/NET3-HOWTO.txt.gz.


    # Is my hardware supported?


    Look at http://cdb.suse.de/cdb_english.html to find out. Also, the command less
    /usr/doc/howto/en/Hardware-HOWTO.gz will provide you with additional information.


    # How can I defragment my hard drive?


    Linux has an intelligent file system. This filesystem defragmenting superfluous,
    because hardly any fragments occur in the first place. You should just make sure
    that your partitions do not become more than 90 cent full (using the command df-h).


    # I have read something about partitioning: what is this?


    Partitioning means the splitting of the hard drive into individual subsections.
    SuSE recommend using SuSE Linux with at least three partitions (for one boot itself,
    and a swap partition).


    # Do I need to delete Windows in order to be able to use Linux?


    No. But Linux needs enough space on the hard drive. Run the program defrag in
    Windows, then run the program fips on the first SuSE Linux CD, in the directory
    \dosutils\fips20. With this program you can resize Windows partitions to create
    more space for Linux. Back up your files first!'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# How much disk space do I need to install Linux?


    You will get by with about 380Mb, but SuSE recommends approximately 1Gb. If you
    want to install everything, you will need over 4Gb.


    # I would like to remove Linux; how do I do this?


    Delete the Linux partitions with the command fdisk; you may need to run the Linux
    version of fdisk. Then you should boot from the MS-DOS floppy disk and enter the
    command fdisk/mbr in DOS or Windows.


    # In YaSt you item ''base network configuration'' cannot be selected.


    During the installation you specified that you would like to run the computer
    as a DHCP client. In this case, the network configuration is performed by the
    DHCP server. If you do not want this (this is the standard case), start YaST,
    and in the network configuration/DHCP Client menu select No. Then you can return
    to the Base network configuration menu.


    # My computer doesn''t seem to react any. Can I just press the reset button, without
    worrying?


    If your computer no reacts to the mouse or keyboard, this does not necessarily
    mean the entire computer has crashed. A single program may have blocked the mouse
    and keyboard, and other programs may continue to run normally. If the computer
    is accessible from outside (serial terminal, network), you can login, and close
    the process which is stuck there using killall. If you do not have this option
    you can try using Ctrl+Alt+F2, to switch to a different console, and to end the
    process which is stuck there. If the computer does not react to any key input,
    wait until there has been no hard drive activity for at least 10 seconds, and
    then press the reset button.


    # What is a mirror? Why shouldn''t I just download things from ftp.suse.com?


    Since there are many users downloading from the server at the same time, it would
    soon become overloaded. For this reason there are number of ftp servers containing
    a mirror-image of the SuSE server. Such servers are referred to as mirrors. You
    should choose the server nearest in physical location (i.e. in your own country)
    to facilitate faster download times. A list of such mirrors is available at http://www.suse.de/en/support/download/ftp/index.html.


    # What sort of directories are /var, /etc, /bin and so on?


    The /var and /etc directories contain system configuration files and /bin contains
    the commands needed to start the system.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# How can I display, edit, move, copy or delete files?


    You can either use the standard Linux shell tools, or you can use the program
    mc in a text console (a clone of a well-known DOS/Windows tool). On the desktop
    (in X Windows mode) you need to open a terminal, using Alt+F2; enter xterm; then
    type mc.


    # I cannot find any .exe files. Where have all the programs gone?


    In Linux, executable files normally have no file extensions. Most programs are
    located in /usr/bin and /usr/X11R/bin.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Appendix II


    # General Linux Frequently Asked Questions (FAQs)


    Does Linux run on Windows?


    NO. Linux and Windows are both operating systems. An operating system is a group
    of programs that control your computer and allow you (and other programs) to interact
    with it. You can only run one operating system at a time (although more than one
    operating system can be installed on the same computer). You either interact with
    your computer through Linux, or you interact with through Windows.


    Will my Windows programs run on Linux?


    The bad news: Probably not. Linux was designed to be compatible with UNIX, a powerful
    operating system designed for multi-user, multi-tasking environments. Windows
    is not designed to be compatible with UNIX. In general, a program designed for
    Linux or another UNIX-like operating system will run on Linux just fine. Because
    the internal structure of Windows is so different, it takes considerable effort
    to ''port'' applications from Windows to UNIX-like systems.


    The good news: There are many applications available that are designed for Linux,
    so whatever applications you used under Windows, you can probably find something
    that runs on Linux, and the chances you will be able to download it for free.
    Many companies publish software that runs on Windows and Linux, notably Netscape,
    Core WordPerfect and StarOffice, a cross-platform office suite that will make
    Windows users feel at home. There is also a project called WISE whose goal is
    to build Windows application support on top of Linux and other UNIX-like systems.
    The project is still'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'under development and may not be suitable for all users, it has reported many
    successes running Windows programs on Linux using its software. Learn more at
    WINE headquarters at www.winehq.com/.


    # Will Linux run on my hardware?


    If you have an off-the-shelf PC, the answer is probably yes. You can check the
    Linux Hardware Compatibility HOWTO at http://metalab.unc.edu/LDP/HOWTO/Hardware-HOWTO.html
    to find out for certain.


    # Can I have Windows and Linux on the same computer?


    Yes, in fact this is very common. It is referred to as a dual boot configuration.
    It''s not difficult to set up a PC this way, but you must be careful not to lose
    any data in the process.


    # Where can I get Linux?


    Linux can be purchased on CD-ROM in retail computer stores or from online vendors,
    or you can download the whole operating system directly from the Internet. You
    can get a list of Linux distributors and links to their Web sites by reading the
    Distribution HOWTO at http://metalab.unc.edu/LDP/HOWTO/Distribution-HOWTO.html
    or Obtaining Your Copy of SuSE Linux at www.suse.com.


    # How do I set up hard partitions for Linux without deleting Windows?


    Normally, you will need to resize your Windows partition in order to make room
    for Linux partitions. Each Linux distribution comes with a utility called FIPS
    that can do this job. Details on using FIPS can be found at the FIPS home page:
    www.igd.fhg/~aschafe/fips/. For more detailed information see the Partition Mini-HOWTO
    at metalab.unc.edu/LDP/HOWTO/mini/Partition.html.


    # How do I edit text files?


    Like many Linux questions, this has many answers. The two classic Linux text editors
    are emacs and vi. Both are available on virtually any Linux installation, though
    if one is missing it is more likely to be emacs due to its larger size. Both are
    well documented, which is good because neither is very intuitive in my opinion.
    For users coming from a Windows world, I would recommend a program called joe,
    a clone of the old WordStar program. It''s not as simple as DOS Edit or Notepad,
    but it has the advantage that you can display'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'the help hints while you type, which makes it extremely easy for beginners.
    There is also an editor called pico that is easy to use and is available on UNIX
    systems since it is included in the pine package. If you have KDE (www.kde.org)
    installed, kedit is by far the easiest text editor to use. It is basically an
    incarnation of Notepad, with similar limitations and ease of use, albeit with
    a few extensions.


    # Tips


    # How do I log in?


    On the console, see http://sdb.suse.de/sdb/en/html/cep_login.html. See also the
    section in the manual. In the graphical login screen enter your username or click
    on the icon for a specific user. Hit Return. Enter the password, and then hit
    Return again. Note that the password will not be shown in a readable-form while
    you enter it.


    # What Linux training is available?


    See www.lpi.org. This presents generic training for a variety of different Linux
    vendors, with a generic part and modules for each distribution.


    # Which application replaces those I am currently running?


    Microsoft Office is replaced by StarOffice (free), ApplixWare (roughly £70), KOffice
    (beta quality), WordPerfect (usually only the word processor function). Visual
    Basic is replaced by Basic implementations. No real VB clone exists. There is
    an attempt to write a VB Virtual Machine for Linux; see http://SoftworksLtd.com/.
    A converter to Java can be found at http// 207.126.104.133/products.asp.


    Internet Explorer is replaced by Netscape Navigator. For email software, Netscape
    mail or pine (in a shell). There is a multitude of other mailers on SuSE Linux
    as well.


    For other software see www.focus.gmd.de/linux-softw.html.


    # How do I install a new package?


    See the corresponding chapter in the SuSE manual for a complete description. Put
    one of the SuSE CDs into the drive. YaST by clicking on the YaST under X or by
    entering ''yast'' in a root-shell. Go to Choose/Install'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'packages/Change/Create configuration/ Name of a soft-ware series, for example,
    ''fun''. Choose a package (''freeeciv'') by highlighting the selection with the
    cursor keys, hitting Return. Press F10 twice. Choose Start Installation. If additional
    packages are needed, YaST will warn you. In this case choose ''Auto'', then Continue.
    The pack-age will then be installed. YaST will prompt you for the correct CD(s).
    When finished, press ESC to go back to the main YaST screen or go to Main menu.
    UseSeconf will run and configure your system, and the package is ready to use.
    Exit YaST by hitting ESC.


    # Is my hardware supported?


    See http://cdb.suse.de/cdb_english.html and www.fokus.gmd.de/linux/linux-hardware.html.
    If you are looking for first-hand experience using the hardware, search on www.searchlinux.com.


    # Why should I use any other user than root?


    The root user can easily destroy the whole system. It is the only one with suff-cient
    permissions to erase every single file in the system. While working as root in
    order to administer the system there is nothing to be afraid of, but working under
    that account daily is dangerous. You might accidentally erase an important file.
    Therefore work under another account, for example, one that was created during
    the installation. The system then not let you erase anything other than your own
    files.


    # How do I access a data CD-Rom?


    Put the CD-ROM into the drive. If you are using KDE, left-click on the CD icon
    on the desktop. The CD-ROM will then be mounted, and it can be accessed as part
    of your normal file system. You can also mount a CD-ROM by executing the command
    ''mount /cdrom'' in a root-shell.


    # The CD drive cannot be opened. What do I do?


    This usually means that there is a CD in the drive which is either being used
    right now (music CD) or is mounted in your file system. Unmount it, by executing
    the command unmount/cdrom as root in a shell or by right-clicking on the CD-ROM
    icon on the KDE desktop and choosing the unmount option. If the system doesn''t
    let you unmount the CD, this means you are still accessing the CD somewhere. This
    can be by either an appli-cation or a file manager that points to the CD-ROM drive.
    Also, when you have changed a shell to the directory where the CD is mounted,
    it will not be'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'possible to unmount the CD and to open the drive. Change to a directory-independent
    of the CD, then try to unmount the drive again.


    # ### How can I hear a music CD?


    There is an icon on the KDE desktop that starts the kscd CD player. Note that
    the soundcard must be configured in order to listen to CDs. See the description
    in the manual for how to configure a soundcard.


    # ### How do I access a floppy disk?


    On the KDE desktop, left-click on the floppy icon. In order to unmount it, either
    enter the command mount/floppy in a root shell or right-click on the floppy icon
    and choose unmount. Do not remove a floppy disk from the drive while it is still
    mounted. This can damage the content of the disk! There are also mformat, mcopy,
    mdir and mdel tools which you can communicate with the floppy drive from the command
    line as you could under DOS systems.


    # ### Why do I have to shut down the system before I switch off the computer?


    Linux is a UNIX system. It always keeps some information stored in the file system
    in order to allow faster access to it. This speeds up the system considerably.
    As a consequence, the information about the disk content which is in memory does
    not necessarily fit the information that can be found on the physical disk. This
    information is only updated every few seconds. Switching the machine off prevents
    an update of the information on the disk. This is the main reason why a UNIX system
    has to be shut down. There are further reasons; all programs running in the system
    should be terminated prior to switching the system off. This again has to do with
    the risk of losing data. The reason why you may not remove a floppy from the drive
    prior to unmounting it is very similar. Most operating systems have to be shut
    down for the same reason before you may switch off the machine.


    # ### Can I access my Windows partition?


    Yes, you can. FAT and FAT32 partitions can be accessed by both reading and writing
    to it. Windows NT file system partitions should be accessed in read-only mode
    only.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Glossary'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Acronym


    Quite often abbreviations are called acronyms. FTP, ASCII and GNU are well-known
    acronyms.


    # Alias


    This expression is often used in connection with the *shell*. An alias is a short
    cut to commands with long names, or frequently used ones.


    # API


    Java application programming interface.


    # Argument


    Functions and routines are passed as arguments to process.


    # ARP


    Address resolution protocol. Used to translate Internet protocol (IP) addresses
    into physical hardware addresses.


    # ASCII


    American Standard Code for Information Interchange. Each letter of the alphabet
    is represented by an 8-bit code. ASCII is most used to store written characters.


    # BeOS


    Be Operating System.


    # Bit


    A single bit of data that represents either 1 or 0 (on or off) in binary code.


    # Bottom-half handler


    Handlers for work queued within the kernel.


    # BSD


    Berkeley Software Design.


    # Byte


    Eight bits of data.


    # C


    A high-level programming language. Most of the Linux kernel is written in C.


    # CISC


    Complex instruction set computer. The opposite of *RISC*, this is a processor
    which supports a large number of often complex assembly instructions. The X86
    architecture is a CISC architecture.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# CPU

    Central processing unit, the main engine of the computer. See also micro-processor
    and processor.


    # CRT

    Cathode-ray tube (used for certain types of monitor).


    # CUI

    Centre Universitaire d''Informatique of the University of Geneva.


    # Data structure

    This is a set of data in memory comprised of fields.


    # Device

    In Linux devices are accessed via special entries in the file system, which are
    located in /dev/. These entries contain the device numbers with which the kernel
    can reach the device drivers.


    # Device driver

    The software controlling a particular device; for example, the NCR 810 device
    driver controls the NCR 810 SCSI device.


    # DMA

    Direct memory access.


    # DNS

    Domain name system.


    # DRAM

    Dynamic random access memory.


    # Editor

    Editors are programs for changing text (for example, by entering text). Well-known
    Linux editors are GNU Emacs and the UNIX editor vi.


    # EIDE

    Extended IDE.


    # ELF

    Executable and linkable format. This object file format designed by the UNIX System
    Laboratories is now firmly established as the most commonly used format in Linux.


    # Ethernet

    Widely-used network hardware for LANs. It has a bus structure. Its speed was originally
    10Mb through coaxial cable, but today networks are usually made of twisted-pair
    cable at speeds of up to 100Mb.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Executable image


    A structured file containing machine instructions and data. This file can be loaded
    into a process''s virtual memory and executed. See also program.


    # EXT2


    Second Extended File System EXT2 is the native file system used by Linux. It offers
    a high throughput, long file names, permissions and error tolerance.


    # FTP


    File transfer protocol is a means under UNIX for transferring files from one machine
    to another. On one side is the FTP server (the machine sending the files), and
    on the other, the FTP client (the receiver of the files).


    # Function


    A piece of software that performs an action. For example, returning the bigger
    of two numbers.


    # GNU


    GNU stands for ''GNU is not Unix'' and is a product of the Free Software Foundation
    (FSF) whose aim is to provide a completely free (source code available at no cost)
    UNIX-compatible operating system. In this process, all UNIX tools are completely
    rewritten and new functionality is added. Linux benefits from these tools but
    should not be confused with GNU.


    # GPL


    General public licence.


    # HTML


    Hypertext markup language.


    # IDE


    Integrated disk electronics.


    # Image


    See executable image.


    # Inode


    The EXT2 file system uses inodes for organising information on files. Inodes contain
    information such as the owner of its file, permissions and so on.


    # Interface


    A standard way of calling routines and passing data structures. For example, the
    interface between two layers of code might be expressed in terms of routes that
    pass and return a particular data structure. Linux''s VFS is a good example of
    an interface.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# IP


    Internet protocol.


    # IP address


    A numerical 32-bit Internet address, usually in decimal notation as four sets
    of numbers separated by dots (for example, 192.168.10.1), which are uniquely assigned
    to a machine connected to the network. If a machine contains several network connections
    (gateways), it will also have several IP addresses.


    # IPC


    Interprocess communication.


    # IPO


    Initial public offering.


    # IRQ


    Interrupt request queue.


    # ISA


    Industry standard architecture. This is a standard, although now rather dated,
    data bus interface for system components such as floppy disk drivers.


    # ISP


    Internet service provider. A firm or person providing Internet services.


    # Kernel module


    A dynamically loaded kernel function such as a file system or a device driver.


    # Kilobyte


    A thousand bytes of data, often written as Kbyte or Kb.


    # LAN


    Local area network. This usually means that it is small and generally supervised
    by one system administrator. LANs are frequently connected to other LANs via a
    gateway, combining to form a WAN.


    # Language


    Computer-readable language, written in binary code, such as C, C+ and Pascal.


    # LCD


    Liquid crystal display (another type of monitor).


    # LISP


    LISt processing.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Main memory


    This is often referred to as RAM, random access memory. RAM access is very fast
    in comparison to hard drive access. On Linux, this memory is often referred to
    as physical memory.


    # Manpages


    Traditionally the documentation for UNIX systems lies in manpages, which can be
    read with the command man.


    # Megabyte


    A million bytes of data, often written as Mbyte or Mb.


    # Microprocessor


    An integrated CPU. Most modern CPUs are microprocessors.


    # MIME


    Multi-purpose Internet mail extensions. These were originally intended to expand
    electronic mail options (for example, to add sounds or images), but the technology
    can be used for many other things.


    # Module


    A file containing CPU instructions in the form of either assembly language instructions
    or a high-level language such as C.


    # Mount point


    The directory where a partition or another device is attached to the Linux system.


    # Mounting


    This describes the ‘mounting’ of file systems into the directory tree of the system.
    As a rule, an empty directory serves as the mount point.


    # Object file


    A file containing machine code and data that has not yet been linked with other
    object files or libraries to become an executable image.


    # ODBC


    Open database connectivity (ODBC) is a widely accepted application program- interface
    (API) for database access.


    # OEM


    Original equipment manufacturer.


    # OS


    Operating system; also open source.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'Page

    Physical memory is divided up into equally sized pages.


    PCI

    Peripheral component interconnect. A standard describing how the peripheral

    components of a computer system may be connected together.


    PCMCIA

    Personal Computer Memory Card International Association.


    Peripheral

    An intelligent processor that carries out work on behalf of the system’s CPU;

    for example, an IDE controller chip.


    Pointer

    A location in memory that contains the address of another location in memory.


    POSIX

    Portable Operating System Interface is a set of standard operating system

    interfaces based on the UNIX operating system.


    Process

    A program or executable file in action. Often, it is referred to as a task.


    Processor

    Short for microprocessor, equivalent to CPU.


    Program

    A coherent set of CPU instructions that performs a task, such as printing ‘hello

    world’. See also executable image.


    Protocol

    A protocol is a networking language used to transfer application data between

    two co-operating processes or network layers.


    RAD

    Retail application developer.


    RAID

    Redundant array of inexpensive disks.


    RAM

    Random access memory; physical memory of limited capacity, which can be

    accessed for read and write purposes at a relatively high speed. See also ROM.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Register


    A location within a chip, used to store information or instructions.


    # Register file


    The set of registers in a processor.


    # RISC


    Reduced instruction set computer. The opposite of CISC, RISC is a processor with
    a small number of assembly instructions, each of which performs simple operations.
    The ARM and Alpha processors are both RISC architectures.


    # ROM


    Read-only memory. A CD is a good example of ROM.


    # Routine


    Similar to a function except that, strictly speaking, routines do not return values.


    # rpm


    From SuSE Linux 5.0, rpm package manager is the standard. With rpm, soft-ware
    packages can be installed and uninstalled, and queries can be made to the database.


    # RSA


    RSA is a public-key cryptosystem developed by MIT professors Ronald L. Rivest,
    Adi Shamir, and Leonard M. Adleman in 1977 in an effort to help ensure Internet
    security.


    # SCSI


    Small computer systems interface.


    # SGML


    Standard generalised markup language.


    # Shell


    This is a program which acts as an interface between the operating system and
    a human user. Also called a *command shell*, the most commonly used shell in Linux
    is the bash shell.


    # SMP


    Symmetrical multi-processing. This occurs in systems with more than one processor
    which share the work fairly amongst those processors.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Socket


    A socket represents one end of a network connection. Linux supports the BSD socket
    interface.


    # Software


    CPU instructions (both assembler and high-level languages such as C) and data.
    Mostly interchangeable with *program*.


    # SQL


    Structured query language.


    # System V


    A variant of UNIX produced in 1983.


    # Task queue


    A mechanism for deferring work in the Linux kernel.


    # TCP


    Transmission control protocol.


    # Telnet


    An Internet software application, Telnet creates a connection to a (remote) host
    and gives you a login to this machine, provided you have an account.


    # UDMA


    Ultra direct memory access.


    # UDP


    User datagram protocol.


    # URL


    Uniform resource locator. The term for the addresses of *HTML* pages in the World
    Wide Web.


    # Virtual memory


    A hardware and software mechanism for making the physical memory in a system appear
    larger than it actually is.


    # WABI


    Windows application binary interface.


    # WAN


    Wide area network. Unlike a *LAN*, this network connects computers that are located
    over a wide area.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# WIMP


    Window, icon, menu, pointing device (or pull-down menu).


    # XML


    Extended markup language.'
  merge: -1
  img_proc: true
