    A special file system in Linux, which enables a UNIX-conform access (including
    long filenames and permissions) within a MS-DOS file system. This is slower than
    a ''normal'' EXT2 file system, but is well-suited to demonstration purposes, as
    it does not need an extra partition.


    the OS and a student who has learned to program and operate in Linux during their
