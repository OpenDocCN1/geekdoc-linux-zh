- pgno: 18
  md: '# Foreword by SuSE Linux


    Being the managing director of SuSE Linux Ltd, the UK branch of Europe’s lead-ing
    manufacturer of Linux distributions, I am happy that this book has appeared.


    Linux has come a long way since the first version was published by Linus Torvals
    on the Internet in 1991. Today – nine years later – it has been adopted by software
    and hardware vendors as a widely used platform. Despite all prophecies of doom
    Linux features and stability have constantly improved over time and the underlying
    open source development model has proven to be effective. This has happened despite
    the fact that the speed of development has shifted to a higher gear due to the
    large-scale participation of commercial companies in the develop-ment of Linux.
    Open source development leads to convergence, not divergence.


    It is fascinating to see how Linux has shaped the information technology market
    over time. While open source was not invented by Linux but had been common since
    the Free Software Foundation was founded by Richard Stallman in the 1980s, Linux
    has brought this development model to the public attention in a way unprecedented
    by other movements. Today open source has become a buzz-word. In 1991, however,
    it was crucial to make the source code available to other people and Linux with
    its multitude of applications would never have become successful as it is today
    without the help of thousands of people loosely connected via the Internet and
    email.


    I started working with Linux in 1992 and at that time its main use was as a tool
    for students. This came about partially because the Internet was not as widely
    used as it is today and companies, such as SuSE, only just started to distribute
    the operating system (OS). Access to Linux was limited to people with Internet
    access. Today a day goes by without some news about big Linux startups and large
    companies, such as IBM, porting their software to Linux. Linux is widely used
    as the main OS, not only in the server market, but increasingly also on the desktop.
    Linux means business.


    Linux has made the step from the specialist’s OS to an OS that most people will
    find surprisingly easy to use and that can be used as the main, if not the only
    OS, on the desktop.


    It is for this reason that I believe, Christopher Lynars’ back is important, since
    it tries to make Linux in general, and SuSE Linux in particular, access-ible and
    understandable for everyone.


    Ruediger Berlich

    SuSE Linux'
  merge: -1
  img_proc: true
