    # Linux in schools


    The Linux community has been extremely focused on getting Linux onto the desktop
    and into people''s homes. Much work has been done in making Linux more user-friendly,
    more graphically-oriented, and easier to install and maintain. I consider this
    to be a good thing the most part. However, the Linux community as a whole has
    ignored one major aspect of making Linux more popular, and that is getting it
    into schools and letting students work with it.


    Today''s educational market is dominated by Microsoft. Students begin learning
    MS Windows at an early age by working with it in schools. When they graduate and
    go on to buy their own computers, what will they buy? Most will buy what they
    are familiar with and that, of course, is a Windows box. In fact most will not
    even know that an alternative even exists. This is the same


