- pgno: 182
  md: 'For businesses network Linux, the logical first line of employees to be trained
    should be existing network administrators, and training should come before deployment.
    System administrators should be trained along with network administrators. While
    a Linux operating system may be less work to maintain in terms of administration,
    companies should not be negligent in staff preparation. There is no need in small
    businesses for a dedicated Linux programmer. Unlike Windows, which requires constant
    reconfiguration and rebooting, Linux solutions require less maintenance.


    # Government and Linux


    Proving that Linux is reaching established, mainstream and conservative organisation,
