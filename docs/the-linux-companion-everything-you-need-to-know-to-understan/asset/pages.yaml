    # Apache


    The Apache Web server is one of the highest-profile, most successful of the open
    source projects. In 1995 the most popular server software on the Web was the public
    domain HTTP daemon developed by the National Center for Supercomputing Applications,
    University of Illinois, Urbana-Champaign. However, development of these lasted
    until 1994, and many Web masters developed their own extensions and bug fixes
    that require a need of common'
