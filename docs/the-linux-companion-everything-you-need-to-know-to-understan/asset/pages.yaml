  md: '# Linux distributions


    # Why are there so many different kinds of Linux?


    Since there is no official, central version of Linux, each distribution maintainer
    is free to construct an operating system which suits their own goals and/or market
    research. Though the most important aspects of operation remain similar across
    all distributions of Linux, different distributions will include or emphasise
    different applications or different behaviours.


    The more familiar operating systems such as Windows or MacOS provide for a very
    basic, consistent level of functionality on a single type of machine. Because
    Linux serves a much broader community, Linux must remain more flexible. Different
    users perform fundamentally different tasks using many different hardware platforms;
    each distribution can be crafted for a subtly unique crowd. For example, the United
    States Postal Service uses Linux and route American mail. On the other hand, a
    company called Digital Domain used Linux to help render the graphics used in the
    creation of the movie Titanic. Intel-based personal computers. At the same time,
    I use SuSE Linux to write articles, surf the Web and send emails. The Queen also
    uses Linux to run her Web site www.royal.gov.uk/index.htm, shown in Figure 2.2.


