- pgno: 53
  md: 'The existence of so many Linux distributions gives users the ability to choose
    the operating system which will best complete the task at hand. Each distribution''s
    heart is still Linux, but the personality will vary according to personal taste
    or corporate needs.


    # Are the different distributions compatible?


    Generally speaking, yes. Since the kernel (core) of the system and the basic utilities
    remain similar, binary executables from one Linux distribution can usually be
    executed without problems on a computer running a separate Linux distribution.
    That said, there are some notable exceptions to this general rule, most often
    when discussing the age of the Linux distribution in question or the hardware
    on which it is operating.


    # Binary compatibility exceptions


    A program ''binary'' is the program''s executable file. This file is not human-readable,
    it''s just full of bit after bit machine code. In Windows, binary files typically
    end in .exe or .com, in macOS, binary files are usually referred to as ''applications''.


    Linux binaries are generally incompatible with Linux distributions, which were
    created earlier or much later than the program in question. In short, old programs
    won''t work well on new Linux machines, and new programs won''t work well on old
    Linux machines, just as Windows 95 programs wont.


    Also, binary compatibility does not extend across multiple hardware platforms.
    Binaries built for Intel-based computers cannot be executed on Macintosh machines.
    The program in question can still be used; it must be recompiled for each platform.
    Recompiling rarely represents a problem, since nearly all Linux software is free
    and includes source code, and source code is portable from one Linux machine to
    the next.


    # Package compatibility exceptions


    ''Packages'' are normal programs which have been pre-tested to work with a specific
    Linux distribution and bundled for an automatic install/uninstall utility. This
    utility is included with the Linux distribution, not with the package itself.


    Multiple package formats exist because most distributions choose to create their
    own. While this incompatibility may seem like a serious fragmentation of the Linux
    commu...'
  merge: -1
  img_proc: true
