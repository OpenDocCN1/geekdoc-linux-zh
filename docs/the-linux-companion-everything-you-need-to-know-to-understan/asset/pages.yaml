- pgno: 123
  md: 'now much more: install software or test upgrades in a safe environment without
    impact on your working world. A crash within a virtual machine is limited to that
    environment and will not affect the rest of the PC. Run the applications you need,
    regardless of the OS requirement.


    # Comparing Bochs and WINE projects with VMware


    WINE allows some unmodified Windows 3.1, 9x and NT binaries to run on Intel PCs
    under Linux and other x86 UNIX-like operating systems. WINE is an implementation
    of the Windows 3.x and Win32 APIs on top of X and Unix. One advantage of WINE
    is that it does not require a separate Microsoft operating system to run applications.
    WINE also provides relatively good performance as application code runs natively
    on the underlying hardware. Individual Windows applications may or may not be
    supported by WINE. WINE is an alternative implementation of the Win32 API while
    VMware is a virtual machine monitor. VMware allows multiple operating systems
    to run by multiplexing them onto the underlying hardware. VMware requires a Microsoft
    operating system to run applications and provides very high levels of application
    compatibility. VMware also provided advanced capabilities such as isolation and
    encapsulation that WINE does not provide.


    Bochs is an emulator: it runs at user level and emulates all of the different
    devices and CPU instructions. VMware is a virtual machine monitor (not an emulator
    or simulator) and as such will take advantage of the underlying hardware to execute
    instructions and have much better performance. Also, Bochs is not feature-complete;
    at the time of writing, networking and some other features were still being worked
    on.


    # How secure is VMware?


    Is it possible to break in from the cracked virtual box to the real operating
    system? The virtual machine is like another computer on the network. If you have
    the virtual machine VM1 running on top of the host H1, it is like having two machines,
    VM1 and H1, on the same LAN. As such, any security violation that can be done
    between two machines on the same LAN can be done between VM1 and H1 (through networking
    protocols). From VMware''s perspective, the memory and disk are completely isolated.
    If you decide not to have networking on VM1, disable the Ethernet interface through
    the settings panel, and it will be isolated from the rest of the world. There
    is a variety of other networking settings that you could apply to VM1 and H1:
    attach H1 to VM1 through a VPN (virtual private network) and VM1 to the world
    on the Internet, set up one as a firewall and use IP masquerading for the other,
    and so so on.'
