- pgno: 130
  md: 'The term WinModem is a trademark owned by 3Com Corp., which itself owns US
    Robotics, one of the world''s leading modem manufacturers. WinModem is used to
    describe a class of products, sometimes called ''software modems'', in which telecommunication
    functions that were once handled by hardware have been moved into the software
    domain.


    For this software to work properly, your computer needs to be running Windows.
    WinModems are popular with both desktop and laptop makers because they are cheaper
    than hardware modems, and therefore lower the-all cost of a computer. They also
    save valuable space, a vital factor for laptop makers. Most machines that have
    a built-in modem have a WinModem and as far as Linux is concerned it is a cheap
    ineffective device.


    It is no fun to buy a new laptop and discover that, no matter how good a programmer
    you are, you cannot get the built-in modem to work with Linux. There are workarounds,
    external modems or network cards that can be plugged in PCMCIA slots or otherwise
    connected, but who wants to use a valuable PCMCIA slot or lug around an external
    modem when your computer already has one built in?


    For Linux users, the fact that most Sony Vaio laptops come with modems that do
    not require Windows is enough to encourage a wave of Vaio buying. But Sony offers
    no universal remedy, because some of their latest models of Vaio now include WinModems.


    Just attempting to discover which modem is inside a laptop can be a major irritation.
    Not only is there a bewildering abundance of laptops on the market, but there
    is no modem consistency within a particular border. Some IBM ThinkPads, for example,
    use a particular type of WinModem made by Lucent. But other models employ IBM''s
    own MWave technology, a complex combination of sound and modem features.


    The Linux community is currently pursuing an independent strategy to address the
    problem of WinModems. In classic fashion, scores of programmers have busied themselves
    with attempts to write their own ''drivers'', swatches of code that allow a particular
    operating system to communicate with a particular piece of hardware, with or without
    the help of the hardware manufacturer.


    Unfortunately the Linux community does not have the necessary technical documents
    and the problem for prospective WinModem users is getting the manufacturers to
    release drivers for Linux. Ideally, Linux programmers would prefer that the source
    code to be released to the general public and then it could be included in the
    Linux kernel. Even if the source were never to be released, most programmers would
    be happy to get drivers that worked with Linux.'
  merge: -1
