    > The Open Source Group


    The Open Source Group

    The Open Source Group was founded in April 1998 when Netscape released

    the the source code to Netscape Navigator to the public. It was a clear attempt

    by some open source advocates to distance themselves from the anti-

    commercial stance of the FSF. It was also to make the distinction that the soft-

    ware is not given away for nothing. They have liaised with the business

    community and tried to influence proprietary software developers such as SAP

    and Oracle to develop for open source platforms, especially GNU/Linux.

    They aim to get rid of the notion that open source software is great for pro-

    grammers but that real companies cannot rely upon it.


    A key member of the open source movement is Eric Raymond, a prolific

    writer. His influential stance on why the open source software movement, with

    th thousands of unco-ordinated developers and constant releases, is superior to

    the monolithic planned commercial approach is called the Cathedral and the

    Bazaar, www.tuxedo.org (Figure 6.4). Raymond has also encouraged comp-

    nies to make money from open source software.'
  merge: -1
