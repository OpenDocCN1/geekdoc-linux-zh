    # Encryption


    Encryption of data means hiding file contents from unwanted intrusion. This is
    useful whenever files are sent through insecure channels (for example, via the
    Internet) and when you want to prevent unauthorised people from accessing confidential
    data (for example, when transferring card numbers, passwords and so on). Here,
    the length of the key is significant for the security of the encryption may be
    ''cracked'' by appropriate programs). In some countries the encryption of data
    is subject to legal restrictions, so in these countries you may not use encryption
    programs such as SSH or PGP Although SuSE makes the above programs available in
    its distribution (insofar as in the respective countries allow this), you must
    check yourself if you use them in your own country - SuSE is not responsible for
    this.


    Network Concierge allows a smallbusiness operator to set up a Linux network server
    for a range of functions in such a way that even the computer-illiterate can master
    the product. The straightforward forward enables you to take any personal computer,
    even an old 486 PC, and turn it into a file/print server for your network of Windows-based
    computers. You can then use this machine to make available printers or shared
    each network with their own private area. In addition, it will provide a Web server
    for internal or external use, as well as an email server. It will also let everyone
    on the network share access to a single Internet connection such as a cable modem,
    ADSL connection or other type of connection.


    Network Concierge comes with a firewall to prevent outsiders from


