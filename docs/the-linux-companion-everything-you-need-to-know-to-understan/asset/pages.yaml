- pgno: 56
  md: 'workstations. However, in several important ways Linux is not like UNIX. Linux
    runs on personal computers. This means that it is suitable for aimed at a wider
    base of users than UNIX. As well as the hardware, the software for Linux is developed
    with a different market in mind. You, the user, are the target for Linux software,
    not a vague set of development goals.


    Another concern with Linux is that it is not like the operating system you used.
    Linux not macOS or Windows. But there are similarities as well as differences.
    All modern operating systems software to run windows, icons, mouse, pull-down
    menus (WIMP) graphical user interface. Linux is no exception. Using a window manager
    under Linux is no different to the desktop on other operating systems.


    Linux was developed as an operating system from scratch to be lightweight and
    run fast. In its early revisions there were no commercial pressures to release
    improvements. This means that Linux had a chance to develop a very stable base.
    It may seem amazing that an operating system written by volunteers would be better
    than something made by a commercial organisation, but of Linux''s results speak
    for themselves. More hours are spent in developing Linux software than any other.


    # The multi-tasking advantage of Linux


    One of the advantages that Linux offers is the speed of the system. Linux is fast
    and it can do many things at once. The machine does not lock up while files are
    deleted or a floppy disk being formatted. Because Linux can do many things at
    once efficiently, the user can get more done. Getting more in less time is what
    usability is all about.


    > Did you know...?


    Multi-tasking

    Operating systems which can invoke one program simultaneously are called multi-tasking
    systems. There are two forms of multi-tasking: pre-emptive multi-tasking, where
    the operating system is responsible for sharing CPU time between processes, and
    co-operative multi-tasking, where the processes themselves give back CPU time.
    As you can see, the first option is the better one, since no process can then
    block the entire CPU. Linux offers preemptive multi-tasking.


    # User interfaces


    How you interact with the operating system depends on your user interface. The
    keyboard and display screen form an interface between you and the systems hardware.
    The user interface is between you and the programs you use.'
