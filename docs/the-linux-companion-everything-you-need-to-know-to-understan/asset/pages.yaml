    # Did you know...?


    # Home directory


    The home directory is the starting point for most user activities on the machine.
    Generally, this is where your private files are located. Besides the system administrator,
    you are the only one who has access to this directory. The location of the home
    directory in the file system on UNIX is given by the environment variable HOME.


    # Linux software availability


    One of the big plus points of Linux is that it has a large body of application
    programs available, most of them of a high quality and free of charge. But once
    Linux is installed how do you go about getting them? And how do updates work?
    Who supports them? Opponents of Linux argue that there are no applications available
    for the systems to run. The truth is that there is free software available for
    the Linux OS for almost task imaginable. While you may not be able to walk into
    a shop and buy Linux versions of every Windows product, the equivalents are out
    there, and they are usually less expensive. There are several popular pieces of
    equivalent software products for the Linux OS, as you will see in this short summary.


    # Netscape Communicator


    Netscape''s Web browser has been available for Linux since before version 1.0.
    It is available from the downloads section of the Netscape Web site. The latest
    version is Communicator 4.5 and includes Netscape Messenger – a combined mail
