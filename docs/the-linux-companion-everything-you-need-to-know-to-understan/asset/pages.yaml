  md: '# # The main open source products


    # Netscape Mozilla project


    The source code of Netscape''s Navigator browser is managed by an entity known
    as Mozilla. The licence is not GPL as Netscape reserves the final right to reject/force
    modifications into the Mozilla codebase and Netscape''s engineers are the appointed
    area directors of large components. The browser is, however, an essential addition
    to any of the Linux distributions. Visit www.mozilla.org/ (Figure 6.6) for details.


