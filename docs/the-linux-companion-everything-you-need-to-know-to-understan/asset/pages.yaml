    operating system, while major technology vendors sell Linux mainstream hardware
    platforms or are porting applications to it. Commercial service and support is
    also more readily available.


    Cost is another important issue. While Linux is available at no cost for downloading
    from the Internet


    Among companies planning to deploy Linux within the next year, 72 per cent say
    they will use it to run a Web or intranet server. That said, Linux is'
