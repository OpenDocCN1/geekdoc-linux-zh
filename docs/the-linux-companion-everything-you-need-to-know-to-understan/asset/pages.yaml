- pgno: 95
  md: 'In use, StarOffice is noticeably similar to the earlier version of Microsoft
    Office. It provides a desktop, StarDesktop, that enables the Windows 95 screen,
    right down to the Start button: the difference is that this is just the main window
    of the application, rather than a window manager. StarDesktop doesn''t overwhelm
    the KDE applications; they run in their own windows, as usual.


    StarOffice thankfully does not have any clone of Microsoft''s talking paperclip
    or those annoying little assistants. It does have a help feature that pops up
    hints and tips which can easily be switched off. There are extensive online tutorials,
    and a huge reference manual for StarBASIC, StarOffice''s built-in clone of Microsoft
    Visual Basic for Applications.


    File compatibility is the important problem for any office suite; we live in a
    world so dominated by Microsoft that their proprietary documents are taken as
    the standard. StarOffice can take this in its stride; it has import and export
    filters for a complete range of formats, including HTML, Microsoft formats as
    far back as Word 6 and as forward as Office 97, RTF, dBase, Lotus, earlier Star
    Division formats, and a range of image types. However, it does not behave with
    some of the UNIX environment''s standards: LaTeX or text documents, While it is
    compared to ApplyWare or WordPerfect, it allows you to read and write Microsoft
    Office documents.


    StarOffice is a very big, versatile package. Like Microsoft Office, it has functions
    that most of us can never even imagine a for. Like Microsoft Office, too, StarOffice
    is a platform that you can write any dedicated business applications on; it incorporates
    the ability to produce HTML for a word processor. If you want to surf the web,
    StarOffice includes a readers, mail tool and capable Web browser; it can even
    run JavaScript content and execute Java applets, if you can tell it where your
    Java SDK (Solaris Development Kit) is installed. If you want to prepare drawings,
    there''s a reasonable sketch package built in. For presentations, there''s a clone
    of Microsoft PowerPoint.


    StarOffice does not have the same range of examples and wizards as the Microsoft
    product but, on the other hand, the autopilots for creating new documents of specific
    types automate a lot of time and effort, and more importantly it has the same
    feel. If you have no knowledge of Linux, and no knowledge of computers but wish
    to be able to type and use spreadsheets, then StarOffice is the application for
    you. It is basically Microsoft Office running on a much more stable platform.
    It does almost everything an office package to do and does so in a manner that
    will make Windows users comfortable.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'Figure 5.3 AppluxWare


    # # AppluxWare


    AppluxWare, from Appix Inc., is another big integrated office package. Unlike
    StarOffice, AppluxWare comes from the UNIX world (Figure 5.3). You can download
    a demo (limited) edition from www.appix.com. SuSE Office 99 comes bundled with
    AppluxWare 4.4.1.


    Installation from the RPM files in the SuSE is very easy, but takes a lot of disk
    space; 250Mb for a single-language kit with fill in. the full documentation and
    samples. There is no registration dialogue to fill in. In use, AppluxWare takes
    up much less memory than StarOffice: 8–16Mb in normal use. It will run happily
    on lower-end hardware, although a realistic minimum is a 70MHz machine with at
    least 32Mb of RAM and if you plan on running GNOME or KDE at the time.


    When you start AppluxWare, you get a small floating window with buttons to start
    up the various sub-applications: word, draw, sheet, mail and data, the SQL database
    query front-end. What you may not notice is the * (asterisk) menu, which gives
    you access to the full range of the AppluxWare suite, including Applux Presents,
    the obligatory PowerPoint clone, the HTML editor, and various customisation and
    macro dialogues.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'AppliWare does not look like Microsoft Office: it has a fairly traditional
    Motif look and feel, which might seem a little strange at first but is highly
    customisable. Motif is an open source GUI which was used to be commercial. It
    has been somewhat left behind in development over the last two years while GNOME
    and KDE have forged ahead.


    It is hard to criticise AppliWare. Anything you could want to do in StarOffice
    you can also do in AppliWare, albeit differently. The user interface incorporates
    pull-down menus and dialogue boxes rather than the cluttered Microsoft-clone style
    favoured by StarOffice. With StarOffice, each application can embed objects that
    are actually documents created using another of the applications.


    AppliWare''s file import and export filters are more extensive than those of StarOffice.
    Interleave and FrameMaker are supported, along with WordPerfect and the usual
    features, but there is no direct file exchange with StarOffice and vice versa.
    Unlike StarOffice, you need to explicitly import or export files; AppliWare only
    works on its own file formats, seamlessly whereas StarOffice tries to deduce the
    type of a file and take appropriate action.


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_97_0.png)


    # Did you know that...?


    # Cursor


    The cursor is normally a block character, which marks the place for inputting
    text on a computer screen. On Linux, this occurs in the following places. In shell/editor,
    it is a spot marked with a rectangle or flashing line showing where the next entry
    will occur. In the shell, the cursor is right of prompt. In the mouse cursor under
    X, depending on the background, the cursor changes its shape. For example, it
    becomes an arrow in an xterm, X-shaped on the root window or I-shaped in an editor
    buffer. The GPU cursor (console) is one character block which can be positioned
    on the console by using the mouse. It can be used for cut and paste.


    Appli Words feels simpler and less cluttered than StarOffice, but this is deceptive,
    because there are fewer toolbars and icons, but the functions are still there,
    under the menu tree. A particularly obvious way of exposing this hidden complexity
    is to look at the Edit/Find and Replace dialogue box. Embedded in this dialogue
    is a powerful regular expression engine that also has the ability to parse styles.
    As StarOffice and the other integrated suites and word processors, AppliWare is
    able to cope with frames and style-based mark-up; that is, to designate blocks
    of text as belonging to a certain style with set characteristics and layout.


    On the database side, integration with ODBC-compatible databases and Informix,
    Ingres, Oracle, or Sybase is provided by Data. Unless you need to work with a
    database probably will not mean much to you, but if you do, AppliWare has extensive
    facilities to help you.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'If you do not like the Microsoft styling of StarOffice, or do not need seamless
    interoperability with Microsoft applications; or if you need industrial-strength
    database integration or the ability to use your office package as a RAD tool,
    then ApplyWare is the tool for you.


    # KOffice


    The potential of KOffice, which is not yet released but is currently in beta form,
    represents the future of office productivity suites.


    Big commercial office suites like ApplyWare, StarOffice, Microsoft Office or Corel
    Office, are all feature-rich; but this is not necessarily a good thing. There
    are commercial pressures to release new versions of the software at regular intervals,
    even though there may be no customer demand: companies are in business to sell
    products, and will always try to persuade customers into purchasing new products
    by any means necessary. Marketing departments are commissioned to dream up new
    features, which may or may not be useful, or change interfaces or file formats
    for whatever reason. Anyone who has been forced to upgrade a copy of Microsoft
    Word 6 because it cannot read or write more Word documents will appreciate how
    useful file formats can be to a marketing department.


    Open source software has traditionally been recognised for bad user interface
    design because it was mostly written by programmers, for programmers: the developer''s
    temptation was always to ignore the user interface and instead expose the workings
    of the program for fellow programmers to tinker with. SuSE Linux has now eliminated
    this with the introduction of YaST2, which provides a graphical interface that
    is very simple to understand and operate.

    Office''s home page can be found at http://koffice.kde.org/ (Figure 5.4). KOffice
    represents a major revolution in the field of office suites. It consists of a
    group of teams working on sub-projects and developing the system using the open
    market technique that is the hallmark of successful open source projects. Office
    has no commercial pressures. The objective is not to maximise sales by forcing
    users to update their software regularly, or by adding obscure features that nobody
    wants: the goal is to produce a stable and reliable advanced integrated office
    environment as part of KDE, the K Desktop Environment. KOffice has been under
    development for about a year; it should be available with the release of KDE 2.0,
    probably in mid-2000, although you can download a developer''s snapshot of the
    source code today.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# KOffice


    KOffice is an open source office suite for KDE. It includes KWord, KSpread, KHipp,
    Kangax, Kod, Krita and Kpaint. KPaint is a simple drawing application, Krita is
    a linear drawing application, KWord is a FreeMaker-like word processor, KDraw
    draws diagrams and annotations.


    +   - KWord

    - KSpread

    - KPaint

    - Krita


    If KOffice is the whole KDE project, it is a project which means that not all
    features are implemented under the GPL.


    All KOffice components are all in use. This does not mean that all applications
    are useful to everyone or that all features are needed by every user. If you want
    to try KOffice, you can download fully and play with them. For beginners it should
    be mentioned that some parts of KOffice have limits that may be strange to you.


    +   - KWord

    - KSpread

    - Kangax

    - Kod

    - Krita

    - KPaint

    - KDraw


    KOffice components are built on KDE and will be used as KOffice components in
    the future. There are special notes included in the manuals: KWord and KSpread
    are also available for KDE stability, so there is no need for additional work
    because KOffice is stable; the KOffice manual is up to date.


    KOffice components work to get together and you can embed any KOffice component
    in any other KOffice component. This is realized using the KParts object model.
    If you want to test our suite, please look at the page for KOffice component.
    For reporting bugs please go to the KOffice mailing list.


    ![](img/3ced384e4d36e4eb3f6ba3ccfc0ce2d9_99_0.png)


    Figure 5.4 KOffice


    > While it is possible to use KOffice in its current state, it is probably a bad
    idea. Compiling it from scratch is not for the faint-hearted. Since it is still
    being developed it is still changing; it will continue to change until reaching
    its serviceable completion, subsequently the developers will concentrate on fixing
    any bugs that are left in it before a public release. So files you produce with
    a current snapshot may not be entirely compatible with a final version.


    KOffice is an outstanding piece of software. At its heart is ORB (object request
    broker), a server that lets programs requests from each other and over a network
    if required. It follows a document-centric model; you can create a document using
    any of the KOffice tools and embed whatever data you want in it. If you are creating
    a word-processed document and want to incorporate a spreadsheet, you use KWord
    to insert a sheet object and a live spreadsheet appears in a frame in your document.
    When you edit the sheet using the sheet application relation after the word processor.


    Like Microsoft Office 2000, KOffice uses XML (extended markup language) as its
    common document format. XML is a subset of SGML (general generalised markup language),
    a document description language which is to'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'textual information pretty much what SQL is to databases. You may be familiar
    with HTML, the common language of the Web; HTML started life as a tiny subset
    of both XML and SGML.


    Components of KOOffice include KWord, a word processor that follows the model
    of FrameMaker, probably the DTP package in the world, and which is already suitable
    for basic DTP work; and KSpread, a spreadsheet. KSpread, and soon the other KOOffice
    tools, use the Python language for automation. This is a big improvement over
    overblown descendants of Basic, as Python is a powerful, modern object-oriented
    language.


    Other components include KImage, an image viewer; KIllrator, a vector graphics
    editor styled on Adobe Illustrator; KImageShop, a Photoshop-like bitmap editor;
    KPresenter, a PowerPoint-like presentation package; KFormula, a mathematical formula
    editor; KChart, for producing attractive output from spreadsheets; and KataBase,
    a relational database system.


    It is also planned to make KLX operate as a KOOffice component, so that any other
    KOOffice-types are embedded in a KLX document, and vice versa. At the time of
    writing, these tools are in various states of completion: some, as KIllrator and
    KPresenter, are very usable; others are usable but short on tend to crash (KWord);
    some are barely present (KataBase). All the parts are present, and possibly by
    mid-2000, KOOffice will appear in Linux distributions everywhere. It is smaller
    in memory and disk space requirements, and more efficient, than other applications
    as it is not overloaded with extras that nobody uses. It has a far better scripting
    model, one based on a modern programming language that is easy to learn and extremely
    powerful. In view of the fact that it is is not competing for market share against
    Microsoft Office or StarOffice, it does not have to capture itself by imitating
    Microsoft''s poor user interface; because it is not a commercial product like
    AppWare or Core Office 2000, the developers can focus on whatever whatever sells
    extra copies. And because it is an open source project, like the Linux kernel,
    it promises to gather momentum and quickly once it moves into beta testing. In
    12 months we may be looking back and wondering why on earth we ever bothered considering
    using a commercial office package.


    # SIAG Office


    SIAG Office is a bit of a novelty. Standing for Scheme in a grid (Scheme is a
    dialect of the LISP programming language), it started out as a spreadsheet tool
    for computer scientists, but has grown into a full-blown office suite. It is'
