    # Tips, tricks and trivia


    Buffer

    A buffer is a sort of intermediate memory, which enables you to speed up access
    to data being moved between different media, and devices that operate at different
    speeds. Linux has many buffers.


    # Emulators


    An emulator is a program that mimics the software and hardware of another computer
    or game system. Emulators are programs that allow you to emulate other terminals
    in order to run specific software on the Linux operating system.


    Instead of rewriting Windows applications for Linux, which requires various coding,
    various workarounds are available, including WINE (discussed briefly below and
    in more detail in Chapter 5.)


    WINE (winehq.com), software that lets Windows programs run on Linux machines,
    provides both a development toolkit for porting Windows source code to Linux and
    a program loader, which allows unmodified Windows 3.1/95 binaries (compiled programs)
    to run under popular Intel UNIX operating systems, including Linux, FreeBSD and
    Solaris.


    Corel, also using WINE with help from Cygnus, demonstrated a Quattro Pro spreadsheet
    running flawlessly under WINE at the recent Linux World Conference and Expo.


    > *WINE is still under development and is not suitable for general use,* warns
    WINE project leader Alexandre Juliard (www.winehq.com/Apps/query.cgi). More than
    1200 applications have been tested with WINE, with varying results.


    There are a great emulators in Linux: SuSE Linux offers fewer than 14. The most
    interesting is surely the DOS emulator, dosemu. Strictly'
