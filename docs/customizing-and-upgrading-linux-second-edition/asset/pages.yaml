  md: '# The Bottom Line: Match Your Video Hardware and Monitor to Your Expectations


    If you have expectations of your monitor (for example, you might want a huge monitor
    to handle high resolutions so that you can have several programs open and displayed
    at once), then try to ensure that your video hardware can process and send the
    necessary information to your monitor. You will need adequate video memory and
    a bus sufficient to handle the flow. Then, on the other end, try to ensure that
    your monitor will indeed handle everything that the video sends. Its bandwidth
    must be high enough to handle line rates and refresh rates. It would be a shame
    to have video hardware that is capable but too powerful for the monitor or a monitor
    that is choked by lower resolutions because the video adapter cannot send it quickly
    enough. Most importantly, it would be a shame if you could not do the work you
    need to without spending money.


    In the next section, we discuss a technique for getting high resolution out of
    a lower-end monitor; that is, a monitor with bandwidth that might not permit it
    to support DCFs.


    # Interlacing


    In previous sections, we examined how the electron beams create frames by line.
    Some video adapters, however, send their information so that the beams scan every
    second line on one pass (that is, the odd-numbered lines) and then go back for
    a second pass, where they scan the lines they missed on the first pass (that is,
    the even-numbered lines). This process is called interlacing, and each pass is
    called a field. Thus, two complete fields equal one frame. Figure 5.5 illustrates
    this technique.

    Why would you to use interlacing? Interlacing can help you by reducing the amount
    of new information carried with each refresh while maintaining high resolution.
    This function would be useful, for example, if your monitor had only a certain
    bandwidth capacity or if your videoadapter hardware had a limited DCF such that
    you could not view a high resolution without flicker or without getting an error
    message announcing that you exceeded bandwidth limits. Thus, using an interlaced
    mode might allow you to display higher resolutions without overtax


