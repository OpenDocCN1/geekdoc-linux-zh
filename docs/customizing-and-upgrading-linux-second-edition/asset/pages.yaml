  md: '# Why Upgrade or Patch the Kernel?


    using packages is much safer and more accurate. There are fewer opportunities
    for errors. Some of the material in this chapter is a restatement of Chapter 7.
    Because we focus on the operating system kernel, however, the steps we outline
    will be more detailed with respect to operating practices, the directory structure,
    and so on.


    The three main reasons for upgrading or patching the operating system kernel are
    as follows:


    +   - To obtain support for new hardware

    - To obtain updated drivers

    - To respond to or remedy security concerns


    In reality, these are the same reasons for upgrading or patching any application.
    We hope to convince you in this chapter that the use of RPM packages is the best
    way to perform upgrades. If you are not convinced by the end of this chapter,
    we think you will be totally convinced by the end of Chapter 10, where we show
    you how to upgrade a kernel from scratch with no RPMs.


    # A Typical Security Advisory


    Examples of the first two reasons for upgrading or patching an application (obtaining
    new hardware support and updating drivers) appeared in Chapter 7. You might ask,
    “What about the third reason—dealing with security?”


    Let''s assume you are running Red Hat 6.2, which shipped with the Linux kernel
    version of 2.2.14-5. At one time, a document appeared at www.redhat.com/support/errata/rh71-errata-security.html
    issue. The document indicated that the security issue would be fixed if users
    upgraded to a kernel level of 2.4.3-12.


    Fortunately, the document also stated that new packages to correct the vulnerability
    were available from ftp://updates.redhat.com. In this situation, you would obtain
    the new RPM packages from the aforementioned FTP site and apply them to the system.
    See Figure 8.1 for an example of a security advisory.'
