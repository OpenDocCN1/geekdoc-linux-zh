  md: '# Monitor Age


    If the monitor is a new multiple-frequency device, then it might be capable of
    handling anything you send to it—especially if the video-adapter hardware and
    computer system precede it by a year or so. If you are trying to make use of an
    older and therefore less-expensive monitor, however, then you should get a handle
    on what you want the monitor to do for you what it can do for you. It could become
    a performance bottleneck, or a bit of a bomb (literally).


    # Bandwidth


    A monitor''s bandwidth is a measure of its capability to accommodate the information
    sent to it. If the monitor is a new model, it might reflect the modern manufacturer''s
    expectations: namely, that video-adapter hardware will continue to become more
    powerful (that is, capable of sending more information via the DCF, or dot clock
    frequency), so monitors should be manufactured to anticipate DCF increases. That
    is why with some systems people say—“Don’t worry, it’s a new monitor, so the DCF
    probably don’t tax the monitor’s bandwidth.”


    As said earlier, though, if the monitor is older—perhaps a fixed-frequency color
    model but with a large screen size that could be potentially beneficial to your
    operations—then you have to determine its capabilities as best you can.


    In this book, we call the bandwidth output from the video adapter the DCF and
    both are measured in MHz. The higher the DCF, the more information being transmitted
    to the monitor in form of refreshes per second, resolution, depth, and rates.
    The higher the bandwidth, the higher the monitor’s capabilities to have the DCF
    sent to.


    If you do not know the clock frequency of your video-adapter hardware, the XF86Free
    - X Server might be able to help. Try running the startx command and read the
    output. Even if it fails, it should give you some useful information in the standard
    error returned. Example output from follows:


    ```

    [root@hostname ~home]# cat versa-video

    -- SVGA: CHIPS: probed memory clock of 31499 KHz

    -- SVGA: chipset: ct65550

    -- SVGA: videoram: 2048k

    (**) SVGA: Using 16 bpp, Depth 16, Color weight: 656

    ```


