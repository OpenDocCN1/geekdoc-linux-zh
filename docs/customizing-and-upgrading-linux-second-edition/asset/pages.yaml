  md: '# Installing Linux by Using NFS


    In Chapter 3, we covered installing Linux on SCSI and IDE systems. For both installations,
    we used a local CD-ROM as the source for the operating system files. In this chapter,
    we install Linux remotely by using a network connection that uses NFS. We will
    set up an NFS server as a source system and an NFS client as a target system.
    This situation is ideal for labs or facilities that need to install many Linux
    systems over the network routinely. This setup also enables you to customize the
    RPMs. Once the RPMs are copied to the hard disk, they can be updated and supplemented
    to create a standard build. A standard build is defined as a complete set of RPMs
    that are known to work together in a very standardized and stable environment.
    Figure 4.1 shows the configuration that we are describing in the following instructions.


    All of the necessary RPMs and binaries will be copied to the NFS server, and the
    installation procedure will take place on the NFS client. When the NFS client
    is installed with Linux, it will be a standalone Linux system and will no longer
    be an NFS client. An additional topic is added to the end of this unit that explains
    how to perform a casual NFS mount that does Unix network file sharing.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Customizing and Upgrading Linux


    ![](img/cf6993b0699c37d6fb92721201c599d8_122_0.png)


    Figure 4.1 NFS server and NFS client.


    There are two major tasks in this type of installation. First, prepare the NFS
    server, and second, prepare the NFS client will end up being a new Linux host
    after the installation completes. Of course, in our example, the NFS server is
    another Red Hat Linux system.


    # Quick Review of Configuration


    Sun Microsystems developed NFS in the 1980s and courteously shared it with the
    industry so NFS became a standard for sharing disk resources across a network.
    Its primary strength is its interoperability. You can find NFS support in every
    UNIX-like operating system, and for just a few dollars (comparatively), you can
    get NFS support for other operating systems, as well as Microsoft. Microsoft has
    recently announced support for NFS on Windows 2000 server. Its second strength
    is its capability to make file systems on remote systems appear to be local on
    client systems on the network. NFS is generic, and you understand the basics,
    you can apply them to other operating systems as well.


    There are a couple of network requirements, however, and here we are going to
    rely on the classic non-Unix definitions of server and client to explain. Specifically,
    a server is a system that responds to commands from clients, providing services
    such as data management, network administration, and security. A client is a standalone
    system that accesses shared network work resources provided by a server. Be careful,
    because these are not Linux/UNIX definitions.


    Referring to Figure 4.1, the network requirements are as follows. HostA and HostB
    must be capable of communicating via the TCP/IP protocol'
  merge: -1
