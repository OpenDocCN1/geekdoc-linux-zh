  md: '# Configuring the Video 145


    millimeters, between successive phosphor stripes of the same color. Dot pitches
    generally vary between 0.31 and 0.22 millimeters.


    On any screen, the dot pitch is easy to see if you use a magnifying glass. On
    something like a Sony Trinitron screen, it is especially easy to see because the
    phosphor stripes are vertical and the shadow mask (which Sony calls its "aperture
    grille") is slotted so that it does not cover too much of the phosphor area. That
    said, we do not suggest that you measure the dot-pitch distance yourself. It is
    a lot easier to consult the manufacturer''s specifications in the monitor''s.


    You might notice that on older color screens, seeing the dot pitch is a little
    more difficult because the shadow mask has holes, as opposed to slots, and the
    color stripes are slanted to left. The dot pitch, therefore, is not measured strictly
    vertically or horizontally, but rather inclined. Your manufacturer''s manual will
    specify horizontal and vertical measurements, but to get the true measurements,
    the manufacturer will have applied a correction factor to account for the angle
    of phosphor stripes. While we do not recommend trying to measure the dot pitch
    on your monitor, it is worthwhile to take a close look to determine the type of
    monitor technology you have.


    Why is the dot pitch important? If you are using a monitor of a certain size and
    want to obtain a certain resolution on it, then you want your monitor''s dot pitch
    small enough to show that resolution. Let''s use the Sony CPD-120VS 15-inch monitor
    as an example. The manual says that it has an aperture grille (that is, dot pitch)
    of 0.25 mm. Assume that you want to display the monitor''s maximum-rate resolution
    of 1,280 dots by 1,024 lines. First, how big is that image? A dot pitch of 0.25
    mm means there are 101 dots per inch. If you divide the 1,280 dots by 101.6 dots
    per inch, you get an image with a width of 12.6 inches (or 320 mm). Consulting
    the manual, we see that the screen is only 11.2 mm (284 mm) wide. If the math
    does not work out perfectly, read on.


    At this juncture, we can say you have to be careful of what you read in the manufacturer''s
    manual. It turns out that the dot pitch is correct. The manual was written for
    both the Sony CPD-120VS (15-inch) monitor and the CPD-220VS (17-inch) monitor,
    the maximum resolution is reproduced in the 15-inch monitor manual. The viewable
    image size is included for both monitors, however, and the 15-inch monitor has
    a viewable image size of 284 mm. If you divide 284 mm by the dot pitch of 0.25
    mm, you get a pixel width of 1,136. Thus, the maximum standard size of your display
    is likely 1024 × 768.


