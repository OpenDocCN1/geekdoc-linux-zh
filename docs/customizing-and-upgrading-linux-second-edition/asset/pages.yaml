    video adapter or monitor amplifiers, or you might obtain a higher resolution on
    a monitor that has less-expensive components (amplifiers, processors, and the
    like) or that is based on an older technology.


    Let’s assume that you are trying to display a high resolution with respectable
    color depth, but your resulting refresh rate comes out (say, at 45 Hz). The flicker
    can be quite annoying. In this case, you could try an interlaced 90 Hz refresh
    rate. You get the same line rate, equivalent to 45 Hz noninteraced, but you (probably)
    get no flicker.

    Guidelines for using interlacing are as follows:


    +   - Do not use interlacing, except maybe for comparison purposes, when your
    hardware can easily handle noninteraced displays.


    +   - Use interlacing where, in noninteraced mode, you are too close to or over
    the limits of your video hardware, monitor DCF, or bandwidth, as is in the example
    cited earlier.


    +   - Try to use interlacing at high resolutions so that the alternately refreshed
    lines are still close together.


