    is called the horizontal synchronization frequency (HSF), or the rate, and this
    value is measured in kilohertz (thousand cycles per second, or kHz; 1 Hz equals
    one cycle per second). In other words, the horizontal scan frequency is the number
    of times per second that the monitor''s electron guns can write a horizontal scan
    line. The actual calculation is the number of lines drawn per screen by the number
    of screens drawn per second. Customarily, HSFs are in the 30 to 70 kHz range.

    The electron beams will continue to traverse from left to right across the display
