  md: '# Installing a New Kernel by Building a New Source Tree 251


    The concept of the module is to have a compiled code segment that be loaded and
    unloaded as desired. The modules can be loaded manually by using the insmod command
    or can be coded to be dynamic. Dynamic implies that the kernel will load the modules
    when a call for that resource is made. The trick here is, of course, performance,
    whereby might be a slight delay when the kernel loads the module before the resource
    is accessed. This situation is referred to as the life cycle. The life cycle behavior
    coded into the module by the programmer and hopefully documented.


    An example would be the modules that are loaded at boot time. During the boot,
    the kernel will make a call for a module. These are the code elements by virtue
    of modules or chosen to be modules during the xconfig process. The kernel will
    call either probe or insmod to load the appropriate module. These utilities, in
    turn, use the sys_create_module to allocate memory resources and get_kernel_syms
    to access the kernel symbol table for linking, and then call init_module to initialize
    the module.


    Of course, the only reason to invoke these features is to unload the module when
    you are done. The rmmod unloads the module and also checks to see whether any
    other module or process is currently using it. If it is in use, it will respond
    accordingly. Those modules that were loaded by kernel will be unloaded by kernel
    when they are no longer used. There is an idle timeout feature that triggers a
    system call for the expired modules to be flagged as autoclean. Anything marked
    autoclean is unloaded, and all resources are released back to the system.


    Before you effectively use a specific module, you have to find out what the behavior
    of the modules is. Only the documentation for the module can tell you what to
    know. You can make assumptions about the behavior, but you might be wrong. For
    example, you might be trying to recompile or patch a kernel, and during the process
    you ask for your working drivers to be modular. After the kernel is compiled,
    the networking modules refuse to load or you get error symbols. The reason is
    probably because although the modular option was available, the driver code is
    not compatible. Or, during the upgrade or patching procedure the module files
    might have become corrupt or were not of the correct version. There are many variables.


    Modules are going to be the future, and there is a large push to code modules.
    Unfortunately, information and documentation on these modules is still somewhat
    difficult to come. Information on exactly how to handle module issues during upgrades
    to properly use the modules is still not available.


