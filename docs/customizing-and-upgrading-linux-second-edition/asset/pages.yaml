    They have only renamed the package from lpr to LPRng. Both contain the same utilities.
    When the lpd daemon is active, you can still use the lpc, lpq, and lpr commands
    to manage printing.


    +   - lpc is the line printer control program. Among other things, you can use
    lpc to enable or disable a prnt queue, get the status of a print queue, and restart
    a daemon should one daemon die (leaving print unprocessed in a queue). Check the
    lpc man pages for the full capabilities of this utility.


    +   - lpq is the spool queue examination program. Use it to display and manipulate
    jobs in a print queue using the lpq -l -Pprinter command. Remove a print job from
    the queue, use the lpq -Pprinter job_ID command.


    +   - The lpr command is a companion to the lpd daemon, and the daemon must be
    available for the two to work together. lpr is used to submit jobs to the printer
    and has many options.


    It is possible to send a job directly to the printer without using lpr, but this
    action is not recommended in a shared printing environment. Print jobs collide
    when multiple users send jobs to the printer at the same time. The lpr command
    solves this by sending signals to the lpd daemon. All lpr processes communicate
    with a single lpd daemon that organizes the requests. When a job is printed with
    lpr, lpr assembles the data and copies it to the spooling queue. At the same time,
    lpr adds to the assembly any instructions passed as arguments to the lpr command,
    which are set using environment variables and system defaults.


    In addition, the lpr command uses the /etc/printcap file to determine the printer
    geometry (that is, the printer-to-print queue relationship) and additional instructions
    that might be in the /etc/printcap file, as remote printing sets.


    You can ensure that lpr is available by querying for the LPRng package, as seen
    in the following example. If the package is installed, lpr should be available.


    ```

    [root@HostA]# # rpm -q LPRng

    LPRng-3.7.4-22

    [root@HostA]#

    ```


    When executed, the lpr command will create two files in the spool directory: a
    control file with name cfid_number, which contains information


