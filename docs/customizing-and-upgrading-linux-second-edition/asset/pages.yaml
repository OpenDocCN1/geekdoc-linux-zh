    The solution is to either upgrade the BIOS or create a floppy boot diskette. We
    would recommend that you create a floppy boot diskette because it is easier. Another
    reason might be that the system might not be configured correctly. This situation
    is usually the case if you have taken the opportunity to add or move drives around
    the system. Check the master/slave jumpers on all the drives and devices. If the
    drives are chained off the same IDE controller, then one device should be configured
    as the master and the other device should be the slave. You will have to locate
    the documentation for the IDE device to find how how jumpers are to be arranged,
    because these instructions vary for different devices.


    Another more interesting problem is dealing with a CD-ROM that will not load automatically
    after the installation. To get the system up running, you can enter the following
    statement at the LILO prompt during the boot sequence:


    ```

    boot: linuxdx=cdrom

    ```


    x is the IDE letter that Linux specifies for the drive. This letter will vary
    depending on the IDE bus to which the drive is attached. This scenario might also
    cause you some problems during boot time. Make a note of it, and if the system
    also fails to boot after the installation, revisit your cabling and master/slave
    configuration.


    # Troubleshooting the IDE Installation


    If you are having trouble with the installation, stop and research what you are
    doing. Based on our experience, most problems involve hard drive configurations
    or hardware compatibility, followed by network card and bad driver configuration.


    With respect to, the problem is often a lack of documentation on either the jumper
    or the termination settings. If you have a pair of IDE drives or a hard drive
    and CD-ROM combination, it is usually a master/slave configuration issue. If it
    is correct, make sure that all the IDE devices are compatible with each other.
    In other words, do not mix older IDE technology with the newer, enhanced IDE technology.
    If they work together, then you are lucky. We have a saying in the industry, "Are
