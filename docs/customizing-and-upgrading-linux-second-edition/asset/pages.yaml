    (2.4.2-2 or 2.2.17-14). If the module is still found, modprobe will look in the
    directory containing modules for a default release (and so on).


    insmod The low-level module loader. It does exactly what you tell it to do, no
    more and no less. If you have any options, you must specify them on the command
    line. You have to load any required modules first, because insmod only loads one
    module at a time.


    rmmod. Removes a module. Modules can only be unloaded if they are not in use.
    Being in use could be caused by a file being on a file system, a network interface
    being up on a driver, or a module marked in use because another module depends
    on it.


    lsmod. Lists modules that are loaded and their status, including dependencies.


