  md: '# Introduction


    While we were updating the book to reflect the more current Linux kernel and Linux
    distributions, we realized two things: 1) the older 6.2 distribution has become
    very pervasive, and 2) the newer 2.4 kernel is favored. Based on these discoveries,
    we decided not to remove much of the information regarding the 6.2 distribution
    and its default behavior. What we chose to instead add was 7.1 distribution information.
    So now, in essence, this book covers both the 6.2 and 7.1 distributions, and it
    also demonstrates how the reader can upgrade either to the most current 2.4 kernel.


    We also enhanced our SCSI installation sections by replacing the SCSI hardware
    with RAID SCSI hardware. We performed this task for two reasons.


    First, we wanted to add some sophistication to the book and show how easy it is
    to install Linux over a set of RAID drives. The system we used was a Compaq Proliant
    800 series machine with a large external RAID tower (as did not want to give the
    impression that our systems were typical, "in your basement" machines). This combination
    is typical of what the reader might see in any large data center.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# xviii Introduction


    Second, we wanted to further demonstrate how hard disk partitioning is practiced
    in the real world. The old cliché is true: A picture is worth 1,000 words, especially
    when it comes to working with partitions and mount points using RAID devices.


    There is an industry opinion now that Red Hat has become more sophisticated than
    the other Linux flavors because of the IBM involvement. You can definitely see
    the influences, once they have been pointed out. For example, it was decided (by
    Red Hat) that for their 7.1 Server class installation, no X Window System components
    would be installed. This change is a big departure from the 6.2 Server class installation.
    Red Hat, of course, says that they implemented this policy because “most” large
    servers do not run X, so if you want to install it (from scratch).


    In the book, we made sure that the reader understands that this move was strategic
    and that they, the reader, this change required adding some information about
    how to handle modules. While Red Hat has done a wonderful job of modularizing
    various components of its operating system, it has done its customers an injustice
    by not documenting this modular behavior. So, we tried to help by clarifying some
    points in our “upgrade” and “kernel compilation” procedures.


    We also tried to implement Iain Campbell''s Robust Linux: Assuring High Availability
    book, also published by Wiley/Gearhead. Iain''s book nicely articulates in many
    areas exactly what we are talking about. For this reason, we think that if someone
    is going to start building and supporting Linux systems in a commercial environment
    (and not just for their own use), they should purchase his book and this book.
    Together, we cover (if not all) of the issues that would be encountered during
    such installation and support.'
  merge: -1
