    # Step 4. Preserve the Old Source Tree


    In this step, we will discuss preserving the old source tree by renaming the directories
    and removing the links to the old Linux source tree.

    First, check to see that you put the new tar file in the correct directory before
    starting. In the following example, we see that the new tar file is called linux-2.4.5.tar.gz
    in the /usr/src directory:


