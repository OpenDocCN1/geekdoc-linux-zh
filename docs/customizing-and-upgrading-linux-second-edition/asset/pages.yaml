  md: '# Customizing and Upgrading Linux


    We will assume that you have an existing functional system, and we are going to
    preserve your existing kernel configuration file by using the make oldconfig method.
    This procedure will enable you to get through this exercise without committing
    suicide. Once you have mastered the many kernel configuration options, we suggest
    using make xconfig.


    As proceed, we are going to encourage you to occasionally use modules as opposed
    to compiling an option into the kernel. The results will show up when you test
    your new system after it is compiled. For example, if you choose to make your
    networking modular, you have to use a tool such as Red Hat, System, Control Panel
    to access your Ethernet interface to actually activate it or read the man pages
    on insmod. If nothing else, it will illustrate both the positive and negative
    aspects of using modules. If this process becomes very confusing to you, you can
    simply go back and change your configuration to compile the feature into the kernel
    as opposed to being modular. Having said, that, if you use the make oldconfig
    method and use your previous .config file, then the new kernel should behave similarly
    to the old kernel. Starting with an existing .config file will reduce the possibility
    that the new kernel will not work due to a missing kernel prerequisite. This situation
    will enable you to focus on the implementation aspect of getting an updated kernel
    with the same features and functionality as before.


    # Modules


    We like to talk about kernel modules from the point of view of a system administrator.
    There are the developers who create them and the system administrators who use
    them. The question is, what are they—and how are they used?


    # The Modules Concept:

    How They Work


    All Linux kernels are used to be monolithic. Monolithic means that all the code
    and functionality that you needed was compiled into a single kernel file. This
    feature is very efficient if you are constantly using all the resources all the
    time. On the other hand, if there is a resource that is used only occasionally,
    then it is not as efficient because you have to have that code loaded all the
    time—even when the resource is not being used.


