  md: '# Upgrading the Kernel by Using RPM Packages


    In Chapter 7, we covered the basics of RPM packages. In this chapter, we upgrade
    a Linux operating system kernel from 2.4.2-2 to 2.4.3-12 by using RPM packages.
    We also provide systematic suggestions for handling the upgrade. Finally, we explain
    what RAM disk support is and how to modify LILO to boot from the new kernel.


    You might decide to modify these suggestions to suit your needs. You can upgrade
    any kernel using these basic instructions, however. Only those steps related to
    the basic preparation and administration of the system must be planned, and they
    can change from system to system.


    Generally, the advantages of using RPM packages are that compiling and tedious
    details are automated. We eventually illustrate the operational advantages of
    performing a kernel upgrade. The upgrade uses RPM packages throughout the chapter.
    A true comparison, however, will come after you perform the "scratch" kernel upgrade
    in the exercise in Chapter 10, "Installing a New Kernel by Building a New Source
    Tree.\ As a system administrator, you might have to perform one upgrade or another
    (or perhaps both). After performing the exercises in both this chapter and Chapter
    10, we think that you will agree with that'
