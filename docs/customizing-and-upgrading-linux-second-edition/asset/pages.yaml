  md: '# Installing a New Kernel by Building a New Source Tree 273


    1. Boot Linux from the boot diskette (that is, the one with the boot image), unless
    your system is capable of booting from the CD.


    2. Quickly, when the boot : prompt appears, type rescue—which will load the kernel
    from the diskette or the CD-ROM, whichever is applicable in this situation.


    3. Follow the prompts. You might need to replace a boot disk with a rescue disk
    when prompted to do so, depending on your configuration.


    4. When you get a shell prompt, you can try to mount your drives.


    5. Create an empty mount point.


    ```

    # mkdir /mnt/linux

    # mount -t ext2 /dev/hdal /mnt/linux

    ```


    Good luck.


    If you are desperate to boot, you can also try to boot from the Linux installation
    CD-ROM.

    If you are super desperate to boot, you can try to do so from DOS via accessing
    the CD-ROM and using the autoboot option under the dosutils.


    # Step 18. Check Kernel


    There are three ways to check on your new kernel. First, make sure the new login
    herald reflects the new kernel revision. Then, when you are logged in, issue a
    uname -a command and make sure it, too, reflects the new revision. At this point,
    you should proceed to check all applications to ensure that they are responding
    correctly and as expected. If all three of these checks work, congratulations
    are in order.


    TEAM LinG - Live, Informative, Non-cost and Genuine!'
