    # Kernel Fails to Load a Module


    If the kernel fails to load a module (say, a loadable module for a network card
    or other devices), you might want to try to build the driver for the device right
    into the kernel. Sometimes the loadable module will not work and the driver needs
    to be built inside the kernel. For example, some network cards do not support
    the loadable module feature—you must build the driver of the network card right
    into the Linux kernel.

    The solution is to revisit xconfig and reset that code to not be modular and try
    again.


    # Reinstall Loadable Modules


    If you are really desperate, you can reinstall the loadable modules. There is
    a chance that the files inside /lib/modules/2.4.2-2 are damaged or are an incorrect
    version to that of the kernel. In previous versions of Linux, the modules were
    in a separate rpm called kernel-modules, but now they are in the kernel rpm file.
    So, to replace the modules, you have to force reinstall the kernel. Be sure that
    you install the CPU architecture.

