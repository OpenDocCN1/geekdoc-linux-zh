    How do you estimate the amount of work that video processors perform? Earlier,
    we discussed the memory required to store information that will be displayed.
    The video processors have to move the stored data through the video bus to the
    monitor and move it there according to the vertical synchronization frequency
    (VSF, also known as the screen refresh rate). We discuss VSF in a bit more later
    in the chapter. The VSF is the rate per second from 40 to 160 refreshes per second
    (measured as cycles per second, or hertz, and abbreviated as Hz). To quickly summarize,
    the work (measured in megabytes per second) is approximately equal to the amount
    of data per second multiplied by the number of lines drawn per second. Table 5
    provides estimates of the image-data transfer rate by the video processors, using
    example refresh rates of 50, 60, and 75 Hz.


    To calculate these estimates, we used the following formula:


    ```

    data transfer rate = line width x number of lines x color depth x

    refresh rate / 1,048,576


    line width is pixels per line; number of lines is lines per screen;

    color depth is bytes per pixel; and 1,048,576 is the number of bytes

    in one megabyte.

    ```


    For example, you would calculate the data transfer rate for 800 × 600

    resolution, 24-bit color, and a 60 Hz refresh rate as follows:


    ```

    800 x 600 x 3 x 60 / 1,048,576 = 82.4 MB/second

    ```


    Note Table 5.2’s heading is Image-Data Transfer Rate. The visible image is not
    the only data processed and transferred from the video hardware to the monitor.
    Later in the chapter, we discuss additional information that must be transferred—the
    synchronization signals that govern the deflection of the electron beams. These
    signals add even more data. The Video Electronics Standards Association (VESA),
    for the sake of safety, recommends that you always add 4 percent to 5 percent
    to any line-rate calculation (the number of lines from a given resolution multiplied
    by the desired or given refresh rate) because of the overscan sync signal. There
    is another 25 percent or so of overhead for the retrace of horizontal scan lines.
    We discuss and clarify these terms and concepts as we progress through the chapter.


