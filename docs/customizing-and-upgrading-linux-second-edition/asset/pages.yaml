    # # Configuring Printers


    In this chapter, we will illustrate how to configure both a local and a remote
    printer. The example printer is a Hewlett-Packard LaserJet 6 in both scenarios.
    In the local printer scenario, the printer is attached directly to the computer
    with a parallel cable. In the remote scenario, HostC will use the printer on HostA
    over the network.


    The following instructions include the use of printool, a printer utility with
    a GUI. Consequently, it is assumed that you have worked through the video configuration
    chapter (Chapter 5) and have a GUI available. Unfortunately, this tool is almost
    the only one available now with this distribution. There are, of course, tools
    within the actual GNOME and KDE desktops that can also use. If you understand
    this tool, you will be able to handle any desktop tool presented.


    # ## Basic Commands and Utilities


    The three main print mechanisms are lpr (line printer command), lpd (line printer
    spooler daemon), and printcap (printer capability database). lpr uses lpd to print
    files. When lpd receives a request to a


    TEAM LinG - Live, Informative, Non-cost and Genuine!'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Customizing and Upgrading Linux


    file, it checks the printcap file to determine whether the printer requested is
    local or remote. If the request is for a local printer, lpd checks for the queue—and
    if the print queue is up, it sends the job to the printer via the queue. If the
    request is for a remote printer, lpd opens a connection to the remote system and
    transfers both the control file and data file to the queue on the remote system.
    Before any printing services will work, the lpd services must be installed on
    the system.


    You can ensure that all the components for lpd are in place by querying Linux
    for the necessary package. In older distributions, this package was lpr-0.50-4.
    The new package is called lPRng-3.7.4-22. These instructions will work for either.


    ```

    [root@Host lpd]$ rpm -aq | grep -i lpr

    LPRng-3.7.4-42

