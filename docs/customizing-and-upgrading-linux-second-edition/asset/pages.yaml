  md: '# Vertical Frequency


    The maximum vertical frequency (or maximum refresh rate) sent from the video-adapter
    hardware to a monitor must not exceed the monitor’s vertical frequency.


    # Horizontal Frequency


    The line rate received by a monitor must not exceed the monitor’s horizontal frequency.
    Remember, the line rate is equal to the number of HSPs, which in turn is equal
    to the number of lines in a desired or given resolution, such as the 600 in 800
    × 600 multiplied by the desired or given refresh rate, such as the 600 in 60 Hz.


    In previous sections, we mentioned VESA, for the sake of safety, recommends that
    we always add 4 to 5 percent to any line-rate calculation because of the overscan
    sync signal. This situation is less likely to be a problem at the present (“present”
    being defined as from the year 2000 into the future), because there are more and
    multiple-frequency monitors being used. Multiple-frequency monitors can detect
    the incoming horizontal and vertical frequencies and adjust their circuits so
    that their amplifiers can handle them. The ways in which these monitors work are
    as follows:


    **Through combinations of synchronization polarities.** For example, the original
    VGA cards used this technique to create screens with 350, 400, or 480 lines.


    **Through the length of the vertical synchronization pulse.** The monitors measure
    the length of the pulse, convert it to the equivalent of scan lines that could
    be drawn during that time, and then calculate the corresponding length and width.


    **By using their own memory and microprocessors to analyze synchronization signals**
    (frequencies, timings, and the like) and then calculating and setting up the corresponding
    resolutions.


    # Dot Pitch


    Monitor size is a very important issue. You should ask yourself, “How big a monitor
    do I need for the resolution(s) I want?” Unfortunately, this question is not simple
    to answer. It depends on the monitor capabilities we have described thus far,
    a grasp of the dot pitch of the monitor. What is the dot pitch? It is the distance
    on the monitor, generally measured in'
