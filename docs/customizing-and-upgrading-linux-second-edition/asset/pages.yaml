  md: '# Preparing for Installation: Chronicling Your Equipment


    # Using Recently Purchased Equipment


    If you are installing on recently purchased equipment, you must take the time
    to do some research on the Internet to learn which systems are or are not supported
    by Linux. Yes, some play better than others do. It is usually not so much the
    system itself as the network interface or video cards inside. There are some good
    Web sites that specialize in this information, including the “gritty stuff” on
    hard drives, controllers, modems, net-work cards, sound cards, ports, memory,
    and video chips, including the definite hardware site is www.redhat.com. From
    there, you can follow links to the hard compatibility lists. Be meticulous.


    You should be obsessed with ensuring that you receive from vendors all technical
    booklets on all parts within the system. At the risk of sounding redundant, this
    information includes all detailed information on the hard drive, controllers,
    modems cards, sound cards, ports, memory, and video chips, including the monitor.
    We cannot emphasize the importance of knowing the exact details of the video and
    monitoring specifications. If a dealer is assembling your system, make sure that
    you get all the booklets and utility dishes that ship with every card inside your
    new system before you leave the premises.


    The “bench guys” that work on these systems collect utilities in systems they
    have ever had to solve an issue with a customer’s system. The utilities could
    be yours. If at all possible, you should try to deal with a company that is willing
    to give you copies of any new drivers or utilities that it has to acquire in order
    to correctly set up your system. The drivers and utilities that ship with the
    interfaces are often obsolete, the “bench guys” have to acquire and use their
    own. Needless to say, the dealers and technicians that share this are worth their
    weight in gold.


    # Using Existing Equipment


    Regarding installation on older or existing equipment, generally the more established
    and better supported the system, the better you will be. There are some exceptions,
    too, however. We recommend that you perform the same checks on hardware, drivers,
    and utilities that you would make on any new system. You might end up replacing
    unsupported hard-. Because of the new interest in Linux, valuable Web sites have
    emerged that specialize in assisting you with acquiring documentation on systems,
    interfaces, and adapters. Again, their premier reference site is www.redhat.com.
    You might have to cover the off from your system and start identifying the varying
    adapters and video cards right down to the


    TEAM Lin - Live, Informative, Non-cost and Genuine!'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Customizing and Upgrading Linux


    chip sets. Information on monitors can be tough to come by, in which case you
    might have to rely upon Linux support groups that have taken the time to share
    their experiences. We must also give you some advice here. If you have invested
    a lot of time looking for information on a specific adapter and just cannot find
    anything, then it probably is not supported. Get another adapter and move on.


    In general, Linux will run on a 386 or 486 with 16MB of memory. Do not expect
    to get a decent X Window System desktop, such as KDE (the K Desktop Environment)
    or GNOME, to perform decently with only 16MB of memory. It is our experience that
    you will require at least 32MB of memory to run an X Window System desktop. Having
    said that, a system with 16MB of memory will work very well at the command line
    if that is sufficient for your needs.


    # Discovering and Chronicycling Your System''s Equipment


    There are many good tools available both on the retail market and via the Internet
    to help you discover what is inside your system. The trick is to find one that
    does not require the installation of another operating system first. Ideally,
    you should find a utility that works on a system that has just been booted by
    a single bootable disk operating system (DOS) diskette. It seems silly and unproductive
    to load another operating system on a machine just to be able to run utilities.
    We have been in the industry for years and have always kept a set of DOS boot
    disks. Nothing is so complicated and beautiful than booting a system with DOS
    and probing hardware for possible IRQ conflicts and chip set information. For
    readers who are pre-DOS, you can go to a site called www.theuseful.com/dos_utils.htm
    or www.dc.ce/Files/Utils to see what is available.


    We are providing an example component list as follows (see Table 1.1). This list
    was taken using the DOS utility Hwininfo, which was downloaded from www.dc.ce/Files/Utils.


    It is very important to capture at least as much detail on the system as possible.
    The installation process will ask you to make choices and decisions based on the
    type of devices that you have inside your system, and you need to be ready correctly.
    Guessing at these responses creates horror stories that you hear about. This task
    is not as daunting a job as one would think, because most including the one we
    chose to use have the capability to save the results to a file that you can print
    for documentation. At the bottom of the table are some networking details


