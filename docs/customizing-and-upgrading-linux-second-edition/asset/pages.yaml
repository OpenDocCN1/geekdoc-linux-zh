  md: '# Review the Logs


    You should review the contents of the following logs for irregularities:


    +   - /tmp/install.log

    - /var/log/boot.log

    - /var/log/dmesg

    - /var/log/messages


    Document the System


    This task is easy. Most of the information that you need is currently sitting
    in the /proc and /etc/sysconfig directories under various directories and files
    labeled by their device names. It is a good idea to print these files and put
    them in a binder in a safe place. We encourage you to read these files. At a minimum,
    you should tar up these directories and keep them some-where in order to access
    them. This material should also be part of your backup and recovery plan. If you
    have to rebuild the system or a similar system, these can be a very valuable resource.


    # Reconfiguring the System


    There is a script called /usr/sbin/sys-unconfig that can be used to reconfigure
    the system. This scripts creates a zero-byte /unconfigured file and halts the
    system. You will have to restart the system. When the system is restarted, the
    /etc/rc.d/rc.sysinit script will systematically guide you through reconfiguring
    the main parameters of the system. The script will run passwd (to change the root
    password), netconfig, timeconfig, authconfig, and ntsys. This feature is very
    handy if you are moving a server from one location to another.'
