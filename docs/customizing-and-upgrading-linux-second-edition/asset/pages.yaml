    # The XF86Config File: Heart of the X Server


    We constantly hear references to “the X server,” but we rarely hear a definition
    of it. Although many refer to individual video-driver packages as the X servers—and
    we do not really blame them because those video-driver and attribute files we
    are focus on most—the(total) X server is actually the X11R6 software you installed
    in the /usr/X11R6 directory in conjunction with other software and configuration
    files. The version of X11R6 used for Intel-based systems is XFree86, and that
    is why we refer to your particular X system as XFree86.


    Thus, when XFree86 is invoked, it XF86Config file follows the instructions found
    there. XF86Config is a text file found in either the /etc/X11 or /usr/X11R6/lib/X11
    directories (one will link to the other). XF86Config is composed of the following
    sections:


    +   - Files (file path names)

    - Module (dynamic module loading)

    - ServerFlags (server flags)

    - Keyboard (keyboard configuration)

    - Pointer (pointer configuration)

    - Monitor (monitor description)

    - Device (graphics device description)

    - Screen (screen configuration)

    - XInput (extended input devices configuration)


    Without going into great detail, let us simply say that the information in these
    sections informs XFree86 how and when to:


    +   - Control and route input to the correct Linux clients

    - Perform basic graphic operations on one or more screens

    - Control video-related attributes such as color, color depth, screen size, and
    so on and other attributes we discuss later in this chapter

    - Allow or prohibit simultaneous access by other hosts or clients


