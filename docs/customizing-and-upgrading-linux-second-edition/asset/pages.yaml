  md: '# Installing Linux by Using NFS 117


    When you get used to the syntax, NFS mounts are easy and have many uses. System
    administrators usually keep all of the software and utilities that they use daily
    on a single system. When they need access to the files, they will quickly set
    up NFS export and mount. It is typical for applications to utilize NFS file system
    mounts. For example, several Web servers in a Web server farm can all access to
    the same Web root for content instead of copying the content to each딨. Database
    servers can be configured to export the directories that have the data to a series
    of clients to balance the load.


    One thing you have to be aware of is the nature of the communication between an
    NFS server and an NFS client. The NFS client is dependent on the NFS server, and
    if the NFS server shuts down or becomes unavailable, the NFS client daemons will
    relentlessly retry the connection. The connection to the point where the NFS client''s
    utilization will be so high that the system is unusable. You can remedy the situation
    somewhat by adjusting timing parameters, but the real solution is to ensure that
    the NFS server remains available. Because of these dependencies and timings, NFS
    mounts should not be performed over unstable network mediums or over routers that
    could slow the connection. You have to start making records of which systems are
    exporters and which systems are monitors so that you can make sure that all mounts
    are taken down before either system is shut down. For example, before you shut
    down an NFS client, you should unmount the NFS file system first. Before you shut
    down an NFS server, you have to unmount all of the NFS file systems at the NFS
    clients.


    There are permission issues involved. At this point, if you are using our example
    to create an NFS mount, you will realize that any user, including the root user,
    cannot access the mounted directory. This behavior is normal for NFS, and there
    are ways to deal with it. One would be to revisit the NFS server and re-export
    the directory, allowing root access. By default, it is assumed that the root user
    on the NFS client system shall not have access to the file system unless you specify
    so. When you think about it, makes perfect sense. Why should we assume that the
    root user on HostB could manipulate permissions and structure of the NFS file
    system that remains owned by HostA? This situation is normal unless you specified
    during the export that on HostB can have access.


    ```

