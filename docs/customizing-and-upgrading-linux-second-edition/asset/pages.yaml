    # Step 8. Optional: Create a RAM Disk Support File


    The only criterion to meet here is "Is this a SCSI or laptop computer that requires
    PCMCIA support?" If so, you need RAM disk support. The easiest way to determine
    whether you need RAM disk support is to examine the `lilo.conf` file in the /etc/lilo.conf
    file that refers to an initial RAM disk file. That reference will resemble initrd/boot/initrd-2.4.3-12.img.
    Upon listing the files in the /boot directory, you will find the initrd-2.4.3-12
    file. Purpose of this initial RAM disk is to allow a modular kernel, such as Linux
    2.2.X, to have access to modules required for the boot process as the system boots.
    Thus, it resolves the catch-22 (or, if you prefer, the chicken-and-egg scenario)
    where you need a driver to talk to the hardware (such as a SCSI or PCMCIA driver)
    that is not available (yet) until the disk is up. Essentially, you solve this
    problem by creating an additional partition (via LILO), which in turn writes to
    the master boot record (MBR). In turn the MBR will now know to use this file to
    boot. The necessary modules are linked within this RAM disk file. You will have
    to create a new initrd file for the system to boot from using the mkinitrd command..
    We do not need this file, but we will go through the procedure to complete the
    example.


    ```

    [root@HostA /]# mkinitrd /boot/initrd-2.4.3-12

    [root@HostA /]# ls -l /boot | grep initrd

    -rw-r--r-- 1 root 251444 Jun 27 11:06 initrd-2.4.3-12

    ```'
