    # RPM Definition and Package Management


    RPM is an open packaging system that software vendors, developers, and others
    use to organize and deliver binary, source, configuration, and other files to
    users, programmers, and administrators. The mechanism that this system uses to
    organize and deliver files is the RPM package. An RPM package typically contains
    binary, executable code and program files. They also have relevant configuration
    and documentation lines that can be read using the rpm utility. They are an effective
    way to distribute program updates and upgrades.


    The RPM system tracks in the RPM database all packages and associated files installed
    on a machine with the rpm utility. The rpm utility is a powerful tool you use
    to install, query, verify, update, erase, and build software packages that conform
    to a specific RPM format. For example, you could use the rpm utility to query
    the RPM database to determine whether you have a particular package on your system,
    whether it is installed, whether it should be upgraded, and so on. The rpm utility
    is executed in both GUI and command-line versions.


    The RPM database and binary files are built right into a distribution. This feature
    is relevant because there are dependencies among the packages themselves. These
    dependencies resolve in shared code. For example, in the new 2.X Linux kernels,
    the GNU standard C library is referred to as glibc or libc6. All executables for
    this kernel version have been linked against this library. Therefore, if you attempt
    to install binary files from a different distribution, chances are that they will
    not work—at best, until you use the lib5 library for backward compatibility.


    Here is an example of the syntax you can use to install an additional XFree86
    RPM package onto your system. The command and its options are explained later


    ```

    rpm -ivh XFree86-76dpi-fonts.rpm

    ```


    Prior to upgrading or installing any RPM package, the rpm man page should be mandatory
    reading. In particular, be sure that you understand


