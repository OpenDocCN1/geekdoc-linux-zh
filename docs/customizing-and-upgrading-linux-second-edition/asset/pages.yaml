    # # Loadable Module Support


    Choosing Enable loadable module support (Figure 9.5) represents a kernel strategy
    and will determine whether you install a “monolithic” kernel or a “modular” kernel.
    One of the most important features of the Linux 2.X kernel is its capability to
    be modular. According to the modular kernel concept, certain options only need
    be loaded on “demand” (that is, when they are required). When those options are
    not required, they are unloaded. The size of the kernel, which is loaded in RAM,
    is kept to a minimum—and resources are not tied up any longer than necessary.
    For performance purposes, we recommend that any feature you expect to use regularly
    should be non-modular. By choosing even one module, however, you are committing
    to a modular kernel. Conversely, if you choose no here, you will find that some
    features might not be available to you.


