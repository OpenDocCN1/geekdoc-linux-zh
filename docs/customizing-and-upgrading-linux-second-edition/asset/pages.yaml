    # NFS Configuration Details


    NFS, as a protocol, has a concept of security and ownership. For the purposes
    of this exercise, we will not configure security on the NFS server. We will export
    the file system in such a way that any NFS client on the network can access it.
    If you are going to share files routinely with other users on your systems, you
    have to ensure to the best of your ability that they are trustworthy and are set
    up using the basic security features of NFS. Otherwise, you might want to consider
    an alternative syntax to that. For more information on NFS, syntax please refer
    to the man pages.


