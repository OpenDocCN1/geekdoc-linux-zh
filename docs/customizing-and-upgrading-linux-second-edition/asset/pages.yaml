  md: '# Networking Support Option


    If you are going to have a network adapter in your system, you should answer y
    to the Networking support option (Figure 9.6). Answering n will dim the network-adapter
    drivers in all subsequent menus.


    # PCI Support Option


    PCI support (Figure 9.6) refers to the type of bus that you have. If you have
    a PCI motherboard, answer y; otherwise, answer n. In other words, answer n if
    your bus is ISA, EISA (Extended Industry Standard Architecture), MCA (Microchannel
    Architecture), or VESA. If you have an ISA bus with a couple of PCI slots, answer
    n.


    # PCI Access Mode Option


    Linux can try to determine the type of PCI devices in your system via the BIOS
    by querying the device directly or by trying other strategies. Note that the PCI
    access mode option (Figure 9.6) does not require the PCI support option to be
    selected. The PCI device can actually be inside an ISA system in a PCI slot.


    # PCI Quirks Option


    The PCI quirks selection provides backward-compatible code for PCI environments
    with broken or obsolete BIOSs.


    # System V IPC Option


    Indicate y for the System V IPC option (Figure 9.6) if you want DOS environments
    to work properly.


    # Kernel Core Option


    It is highly recommended that you enable all three Kernel support options (for
    ELF, MISC, and JAVA binaries) shown in Figure 9.6 for compatibility purposes.
    You should enable them particularly if you have enabled Prompt for development
    and/or incomplete code/drivers back in the Code maturity options dialog box (Figure
    9.2).'
