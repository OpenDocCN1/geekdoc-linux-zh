    # Configuring the Kernel


    In this chapter, we discuss all of the available tools for configuring a Linux
    kernel. We then use xconfig to create an xconfig file used by the compile process.
    We show the necessary and optional configurable parameters for a Linux kernel
    based on hardware requirements. This chapter also makes various recommendations
    for handling major configuration issues for a more efficient kernel.


    The only people who are interested in configuring their own kernels are developers,
    who are looking for code from the Internet that is newer than that offered off-the-shelf
    Linux CD-ROMs, or system administrators, who know exactly what they want and are
