    board processor(s). Indeed, the video-memory chips are probably the most advanced
    (and expensive) dual-port types that enable simultaneous reception and transmission
    of data. In the case of AGP technology, the video hardware might also have direct
    access to the computer system''s main RAM to supplement the otherwise separate
    video memory.


    Regarding how much video memory you need, the amount required is a function of
    color depth and resolution. We define these concepts next, mainly with examples.


    Looking closely at your monitor screen, you can see thousands of individual dots.
    The dots are pixels (short for “picture elements”) and result from electron beams
    being focused through the shadow mask onto the interior of the monitor’s phosphor-coated
    screen. Each pixel is composed of three colors: red, green, and blue. Your screen
    may have as few as 480 lines of 640 pixels or as many as 1,200 lines of 1,600,
    depending on your monitor’s capacity and the video hardware driving it. Each pixel
    represents data stored in your video memory.


    How much data does each pixel represent? That depends on how many colors you want
    on the screen. Assume that you need only 16 different colors for very basic spreadsheets,
    word-processing documents, or other simple images. For 16 colors, each pixel needs
    four bits (half a byte) of video memory. If you have 256 colors, on the other
    hand, each pixel requires eight bits of data (that is, one byte of video memory
    pixel). If you have 65,536 colors (for what is commonly called high color), then
    you need 16 bits (two bytes) of video memory per, and if you need 17.68 million
    colors (true color), then each pixel requires 24 bits (three bytes) of memory.
    There is even a level of color definition based on 32 bits, or four bytes of video
    memory pixel, which could provide up to 4.3 billion colors. These 4-bit, 8-bit,
    16-bit, 24-bit, or 32-bit (or, if you prefer, half-byte, one-byte, two-byte, three-byte,
    or four-byte, respectively) per-pixel specifications are the called depth.


    As mentioned a minute ago, your screen might consist of few as 480 lines of 640
    pixels or as many as 1,200 lines of 1,600 pixels (or somewhere-between). These
    dimensions, which are usually described in width by the number of lines—such as
    640 × 480, 1024 × 768, 1600 × 1200, and so on—are the resolution.


    Another term you will encounter is video mode. A description of a monitor’s display
    capacity is the combination of resolution and color depth. For example, “16 bit,
    800 × 600” is a video mode.


