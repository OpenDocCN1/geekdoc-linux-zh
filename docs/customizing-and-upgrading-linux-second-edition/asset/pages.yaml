    # Entering Information in the Installation Program


    As you install Linux, you will notice several different ways to enter information
    into the dialog boxes. These methods are as follows:


    **Test input.** You will encounter dialog boxes wherein you are to type information,
    usually on a dashed line. This information insertion method is used in conjunction
    with other methods as buttons, toggles, and so on.


    **Check boxes.** These are spaces defined by brackets or boxes, which you will
    select or deselect by pressing the space bar.


    **Buttons.** These are generally square boxes that you select with the Tab key
    and then select by pressing the Enter key.


    **Scroll and select.** Some dialog boxes contain lists of components, packages,
    or default series from which you will choose by scrolling up or down. You will
    use combinations of the Tab and space bar keys, followed by pressing Enter at
    the end of the dialog boxes.


    We present this list for two reasons. First, there are the insertion methods you
    have to use, and this listing serves as a guide. Second and more importantly,
    the list helps you focus on the issue at hand rather than on the collection of
    information. If you occasionally make a mistake, heart—you will not be the first
    or the last to do so.


