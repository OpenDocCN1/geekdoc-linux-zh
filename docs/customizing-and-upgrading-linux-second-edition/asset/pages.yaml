    # Upgrade Issues with Modules


    Most issues evolve around two basic issues:


    +   - It is not well understood that after an upgrade or recompile, new modules
    are made but are not linked.

    - It is up to the system administrator to copy the module files and symlink them.


    The second issue has to do with the version dependencies between the modules themselves
    and the kernel symbol table, particularly with those modules sourced from independent
    code producers or those distributed in binary form. The reason why this situation
    is problematic because the modules should be recompiled for each kernel version.
    And then, the modules are compatible with the new symbol tables that were supplied
    with the new kernel. They say that the module becomes incompatible with a different
    kernel version when the interface symbol table offered by the kernel is modified.
    This situation will result in the following error message:


    ```

    Kernel does not load module - Unresolved symbol error messages

