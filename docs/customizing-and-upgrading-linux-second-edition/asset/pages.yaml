    ```


    Before you exit this section, make sure that the files you are pointing to in
    the image= statements are in the boot directory. The lilo -v command should tell
    you, but only you know if you copied the correct one.


    # Step 16. Update the MBR


    Now run lilo -v to update the MBR with the new LILO information. If you make any
    changes to the /etc/lilo.conf you have to rerun lilo -v to update the master boot
    record.


    ```

    # lilo -v

    LILO version 21, Copyright 1992-1998 Werner Almesberger Reading boot

    sector from /dev/boot Merging with /boot/boot.b

    Boot image: /boot/vmlinux-2.4.5

    Added linux *

    /boot/boot.0300 exists - no backup copy made.

    Writing boot sector.

    ```


    # Step 17. Shut Down and Test System: Rescue If

    Necessary


    Shut down and reboot the system with the following command:


    ```

    # shutdown -r now

    ```


    To boot a system that has a Linux version equivalent to those other Red Hat Linux
    6.1 or 6.2, you will likely need two diskettes: a boot diskette and a rescue diskette.
    If you have Red Hat Linux 6.1 or 6 and the system will boot from a CD-ROM, then
    you only need the Linux CD. When booting from the CD-ROM drive is not an option,
    then you will need the boot diskette.


    Because Step b has to be taken quickly, read this procedure before you begin.


    TEAM LinG - Live, Informative, Non-cost and Genuine!'
