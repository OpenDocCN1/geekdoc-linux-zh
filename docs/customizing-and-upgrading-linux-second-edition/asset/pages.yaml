    # RPM Naming Convention


    The RPM package-naming convention is the key to package identification. Each package
    name consists of `Name-version.arch`, where `Name-version` is the current release
    of that package and `arch` is the platform designation, such as Intel. The standard
    for Intel `i386`, might indicate `i586` or `i686`, although some kernel packages
    might (and so on).


    ```

    # ls | less

    X886-1000dpi-fonts-3.3.6-20.i386.rpm

    X886-3.3.6-20.i386.rpm

    X886-3DLabs-3.3.6-20.i386.rpm

    X886-75dpi-fonts-3.3.6-20.i386.rpm

    X886-8514-3.3.6-20.i386.rpm

    ```


    The packages you install must match the versions of the shared libraries available
    on that. If you try to install an RPM package that does not match the shared libraries,
    you will see an error on the screen. At this point, you could "force" the install.
    In this case, however, you must be sure that you are not affecting other RPM packages.
    Of course, it would be proper to form back up a system before applying this kind
    of technique.


    # SRMP versus RPM


    An SRMP file contains the original source used to build the RPM binaries. It is
    of interest to developers who need to modify and compile RPM packages for their
    systems. Many programmers will make an SRMP file available to other programmers
    to facilitate the free software development philosophy within the Linux community.
    The RPM binaries are the files that system administrators need to apply to the
    system.


