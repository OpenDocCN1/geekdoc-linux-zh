    of data through the video adapter to the monitor.


    Thus, the video signals are processed—and after leaving the accelerator, the actual
    picture element signals are converted from digital to analog format in three of
    the primary colors: red, green, and blue digital-to-analog converters (DACs) on
    the card (called A/Ds in days gone by). Why are they converted? Although this
    story is long, the fundamental reason is to provide more colors and improved control
    of light intensity of


