    are not removed from the local queue until a signal is received from the remote
    system that the job is in the remote queue.


    # Configuring Local Printing


    Before we go through the step-by-step example procedure, we would like to briefly
    discuss the larger scope. It is our experience that most try to make this situation
    more complex than it should be. Do not fall into that rut. There are overwhelming
    sets of configurations. Most of you will never have to deal with, but collectively
    everyone will use the parameters at one time or another. Because there are thousands
    of printers on and without, with some correct drivers and there is an undetermined
    list of ways to configure a printing scenario. We are going to show you a very
    straightforward example, starting with local printing moving on to remote printing
    (see Figure 6.1).


    The trick to creating a simple print environment is to create a print queue first,
    and during the printq definition process, the printer will be chosen. In other
    words, you create a queue first and associate the printer


