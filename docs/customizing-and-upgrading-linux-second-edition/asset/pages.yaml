  md: 'The electron guns are a combination of connected high-voltage cathodes (which
    emit electrons) and anodes. The electron beams are also called cathode rays, which
    is why monitors have historically been called cathode ray tubes. In fact, part
    of the monitor is actually called the CRT (on a TV, it is called the picture tube).
    The cathode ray tube is made of thick glass, and the pressure within it is less
    than atmospheric (that is, it is under a vacuum).


    If you wish to do further research on monitor design, check any elementary and
    television electronics textbook or manual.


    # Video Frame and Synchronization


    In the three previous sections, we discussed how display signals are generated
    and how electrons are emitted from guns and then impact on a phosphor-coated screen
    to create a display image. In this section, we discuss the movement of the electron
    beams across and down the screen itself.


    The entire image frame, from the top-left dot to the bottom-right dot and including
    all of the lines in between, is called a frame.(When we discuss the concept of
    interlacing, you will see how a frame is also considered to be composed of two
    fields.) To create a frame, the electron beams are first aimed at the top-left
    corner of the screen (as seen by the system user). This action is called “beginning
    a frame.” The deflection yoke then causes the beams to traverse horizontally from
    left to right across the screen, creating a scan line. For most of the travel
    across the screen, the phosphor material creates dots in very narrow stripes,
    according to the colors they produce when hit), causing them to light up. Figure
    5.3 illustrates how a frame is created.


    The signals (analog voltages) received at the electron guns determine the intensity
    of the light emitted by the phosphors. After a beam leaves phosphor, the phosphor
    continues to glow very briefly. The capability of a phosphor to continue to glow
    after electron impact is called its persistence.(The phosphors eventually fade,
    but they are reenergized on the next return sweep of the beams–but we are ahead
    of ourselves a little.) If the phosphor persistence is long enough, you will see
    ghost images on the screen because previous images will not have faded sufficiently
    before the phosphors are re-energized. If persistence is too short, the screen
    will be perceived to flicker; that is, to brighten during electron impact, darken
    immediately, brighten significantly during the next electron impact, darken, and
    so on. Screen flicker is not only annoying but also cause severe discomfort.


