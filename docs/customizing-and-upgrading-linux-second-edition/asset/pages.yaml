    with afterwards. This point is where the trouble begins. Do not try to create
    the printer first. As odd as it sounds, Unix printing is almost backwards to most
    other printing environments whereby the queue looks like the printer to the user
    who is using it. The reason is because Unix, the queue and the print driver are
    synonymous. In PC environments, the print stream is processed before entering
    the print queue. In such a case, the print queue is a passive entity. The print
    stream is formatted when it hits the queue. The print queue is active. For this
    reason, as soon as you create a print queue, it wants to know immediately that
    this printer is going to service so that it can format the print job correctly.
    Therefore, we start with defining a print queue and then work out the details
    of the printer and the printer driver later.


    # Step 1. Define the Queue


    To configure a local printer, by logging in as a regular user and switching to
    root user. Enter printtool at the command line.


    When the first printool appears, enter an appropriate name in the Queue Name dialog
    box. We are going to use HostA_q so that we will not confuse us after remote printing
    is set up. See Figure 6.2.


    ```

    [root@HostA \root] # printtool

    ```


    Enter an alias for the Queue Name if you wish. This name can be used to help users
    and applications access the services by an alternative name. For example, someday
    you might wish to change the system in which this printer resides. If all the
    applications on the network have been configured to use the alias and not the
    real name, then your job is easy. All you have to do is give the new printer same
    alias reference as the last printer, and you do not have to reconfigure all those
    applications (they are all now using the new printer). See Figure 6.3.


    # Step 2. Define the Queue Type


    Now that the queue is made, the printool immediately wants to know where the printer
    is going to be attached. In our first example, it will be a local printer. The
    printer device is /dev/lp0, which represents the local parallel port on the same
    system where the print queue is being created. This point is a very important,
    because once local port /dev/lp0 has been indicated, it will not attempt to send
    any information to the network. Notice also that this action is labeled Queue
    Type and not printer. See Figure 6.4.'
