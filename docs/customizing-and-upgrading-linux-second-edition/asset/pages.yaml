    When a PC is turned on, a small boot program that resides on the PC''s Read-Only
    Memory (ROM) BIOS chip performs a Power On Self-Test (POST). The purpose of the
    POST is to check the basic hardware and any Plug-and-Play parameters required
    by boot devices. Immediately after the POST, the boot program (also part of the
    BIOS) sets off in a quest for sector 1 with the hopes of finding where the operating
    system to copy to RAM is located.


    When the PC''s Complementary Metal-Oxide Semiconductor (CMOS) is configured such
    that the BIOS is to search a hard disk, then the BIOS will begin by searching
    sector 1 of the hard for further instructions. These instructions are in a small
    program called the boot manager or bootstrap loader. The BIOS will load a copy
    of the MBR/boot manager into the RAM and then branch to it. Branches means to
    pass control from the BIOS to the boot manager within the copy of the MBR reads
    the partition table, which in turn points to the boot sector within the partition
    table that is the active partition. Active partition is a holdover term from the
    DOS days means bootable. The boot manager now has everything it needs to read
    the boot sector, and the boot sector takes over. The boot manager code contains
    the data that points to the physical device (disk) that points to the logical
    device (partition) that points to the file (kernel) that needs to be loaded in
    RAM.


    The boot sector reads the compressed operating system kernel into RAM, and a small
    program at the beginning of the kernel uncompress the kernel. The kernel takes
    off and continues the boot process by first checking for other installed hardware
    and installing the appropriate drivers. Then, it starts mounting the root file
    system. The root file system is an init tab that invokes the init thread (pid
    1) process, which in turn invokes the other processes and depends on its configuration.
    The init process switches to the default or specified run-level mode and invokes
    the getty, which is the code that generates the login prompt. getty also opens
    lines and sets their modes. At this point, the PC is finished booting and is ready
    for logging into. This process is summarized in Figure 2.3.


    We admit that we have simplified the boot process, but in summary, the MBR generally
    hosts the boot manager and the boot manager reads the partition table to find
