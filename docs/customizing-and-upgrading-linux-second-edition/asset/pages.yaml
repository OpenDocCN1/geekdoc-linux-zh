    # Preparing for Installation:

    Chronicling Your Equipment


    Chronicling your equipment beforehand can prove to be very important to a Linux
    installation. If you have heard a horror story or two about Linux installations
    (overblown, in our opinion), chances are that the source of the horror was a lack
    of complete knowledge of the target system before proceeding. Everyone loves to
    shove that CD-ROM in and go.


    In this chapter, you might be doing one or more of the following: using a hardware
    investigation utility, checking the system basic input/output system (BIOS), or
    even pulling the cover off the system to look inside. It will be in the manner
    of knowing what you are doing and moving ahead in a deliberate manner with everything
    under control.


    # Do Not Be Afraid; Just Do Your Homework


    Linux installation is not a horror story; rather, it is just a different kind
    of operating system installation. Any horror stories you might have heard are
    just myths and generally originate from one of the following circumstances:'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Customizing and Upgrading Linux


    +   - The storytellers either did not investigate or did chronicle their equipment
    for quick and easy reference prior to beginning their Linux installation.


    +   - Perhaps their equipment was too new or too old. Their version of the Linux
    kernel might not yet had the necessary drivers or support for that particular
    new hard disk, video-card, and the like.


    +   - Older BIOSs that do not support the new Plug-and-Play devices.


    The trick of the trade is to avoid spending too time with a system that exhibits
    unpredictable behavior before reaching for a suitable utility to investigate the
    situation—especially if you have just the opportunity to add or change a device.
    The first thing you should check is for a potential misconfiguration. If the system
    processes Plug-and-Play support and is functioning predictably, the BIOS level
    in your system might need updating. But did you not know this function is part
    of your updating and not the hardware. This function is not a Linux problem. This
    situation would confuse Windows 95, given the chance. Older BIOSs might not work
    properly with Plug-and-Play devices, and this is the first thing you need to upgrade
    or take matters of IRQ assignments into your hands. The reason is that each BIOS
    manufacturer has its own algorithm for assigning the next available resource to
    a potential Plug-and-Play device. Unfortunately, we have to direct you to www.hardware.com/
    at this time, because an in-depth conversation about hardware conflicts is outside
    the scope of this book.


    Some of the most recent improvements have to do with increased feature and driver
    support for the new Linux kernel version 2.4 for both Plug-and-Play as well as
    larger systems so that fewer of these experiences occur. We are going to present
    two installations. One uses an Integrated Drive Electronics (IDE) drive configuration
    to represent a typical desktop system, and another uses a SCSI RAID subsystem
    to illustrate how easy it is to build a large server using Linux as an operating
    system. We will chronicle all of the equipment used in each case. These installation
    notes can be used as a model for your own Linux implementation.


    # What Type of System Do You Have?


    You might be building a brand new system or trying to install Linux on an older
    system. We will try to draw your attention to, and comment on, all of the issues
    that pertain to both scenarios.


    TEAM LinG - Live, Informative, Non-cost and Genuine!'
