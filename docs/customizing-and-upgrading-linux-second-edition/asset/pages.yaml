    The entry in the /etc/exports file states that HostB has read-write access to
    /home/monthly/reports. The NFS assumption here is important. The assumption is
    that if there is no host defined or a * symbol, then all hosts have access. Nevertheless,
    once a single host is defined, then only that host has access and all others are
    denied. Therefore, the top two export statements will allow any host, but the
    bottom entry is restricting access to a system HostB (which is 192.168.1.208).
    NFS offers only moderate security. For example, it is possible that someone could
    wait for you to take your system down or take your down. Then, they can spoof
    your system by bringing up another system with the IP address 192.168.1.208 with
    a hostname of HostB and posing as your other system, thus violating the trust
    relationship. For this reason, system administrators restrict the use of NFS.
    NFS systems are generally inside a firewall or a more secure environment that
    can be controlled. There are only two-mission levels here: read-only and read-write.
    The reason we have set up this user scenario is to demonstrate how read-write
    behaves.


