    # # Hard Disk Partition Planning and Preparation


    Two major issues face users who are new to the installation and configuration
    of Linux platforms. One of them is how to handle hard disk partition-ing and the
    other is dual booting.

    Linux users encounter the disk partitioning issue almost immediately upon beginning
    an installation. The first topic we address in this chapter is swap space options,
    because the decision to create a swap partition versus a swap file must be made
    first. Both options work, but one might be more appropriate. This decision will
    depend on your performance expectations.

    We discuss both in the following section.


    After covering swap space options, we turn to dual booting and hard disk partitioning.
    We then illustrate the roles of partitions and other soft-ware during the boot
    process. Finally, we present examples of simple and complex disk partitioning
    strategies and disk usage.


    # ## Swap Space Options


    Before we begin this discussion, it is useful to note that swap space is also
    referred to as *disk paging*, and we will not differentiate between the two.'
  merge: -1
