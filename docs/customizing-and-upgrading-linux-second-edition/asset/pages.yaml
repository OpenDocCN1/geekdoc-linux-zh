    # Troubleshooting the SCSI Installation


    Problems with SCSI drives are often a result of not having the SCSI bus set up
    correctly. For example, it is best practice to have the SCSI controller set with
    SCSI ID of 7 or the suggested manufacturer defaults. Double-check the termination
    rules for all the devices. In most configurations, the SCSI controller card needs
    to be terminated. The only time this situation is not the case is the SCSI controller
    is in the middle. This situation would be the case if some of the SCSI drives
    are internal and some are external. Alternatively, the SCSI controller card is
    self-terminating. The only way you would know is to read the documentation that
    came with the card. It is up to you to make sure each SCSI drive or device has
    a different SCSI ID configured on it. For example, knowing that the SCSI controller
    adapter is using SCSI ID 7, configure the SCSI hard disk to use SCSI ID 5 and
    the CD-ROM to use SCSI ID 3. SCSI IDs also infer to the SCSI


