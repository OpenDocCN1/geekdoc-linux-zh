    The number of times per second that the electron beams move from the top-left
    of the frame to the bottom-right dot is called the vertical synchronization frequency
    or vertical scan frequency (VSF). The VSF is also measured in hertz (Hz), and
    the customary range is from 50 to 100 Hz (although the lowest can be 40 Hz and
    the highest than 160 Hz).


    The VSF is also called the vertical refresh rate or simply “refresh rate.” We
    often generalize and say that a screen is refreshed around 60 times a second.
    Then, the basic meaning of all these vertical sync or refresh terms are simply
    the number of times the electron beams redraw the screen on you. You might notice
    that if the refresh rate drops below 50 Hz, screen flicker can result due to the
    lack of sufficient phosphor persistence. As we mentioned earlier, screen flicker
    should be avoided because it can cause discomfort to the user.


    Let''s quickly review video and synchronization basics: HSFs are in the 30 to
    70 KHz range while VSFs are in the 40 to 160 Hz range. For every VSP (once per
    frame), the beams have to experience many hundreds, or thousands, of HSPs (once
    per line). VSFs and HSFs are critical in designing the amplifiers used by the
    magnetic deflection yoke.


