  md: '# Customizing and Upgrading Linux


    > WARNING Regardless of how you execute an upgrade, we definitely recommend that
    you back up the entire system before proceeding (particularly a production system
    that has data on).


    # Step 1. Check Disk Space


    The kernel will be built inside the /usr/src/linux/arch/ix86/boot directory. If
    you have a file system partition for /usr, make sure that there is at least an
    extra 75MB of additional space in it. This amount of space should also be enough
    for the new RPM packages. The kernel file itself will have to be copied to the
    /boot directory, and the modules will be built in the /lib directory. These two
    items will use approximately 10MB to 15MB inside the root (/) file system.


    The df -h command displays disk usage according to each file system partition.
    The h flag is for human format.


    | Filesystem | Size Avail Use% Mounted on |

    | /dev/hda7 | 4.2G 1.1G 3.0G 26% / |

    | /dev/hda4 | 53M 3.5M 46M 7% / /boot |

    | /dev/hda5 | 988M 36M 902M 4% / /usr/local |


    Refer to the man pages for additional information about the df command.


    # Step 2. Identify Packages Already Installed


    Next, determine which packages are already installed on your system. Make a note
    of them, and compare them to the packages required to upgrade the kernel. Appearing
    as follows is an example to identify installed packages. You will also want to
    run the uname -a command to see which kernel you are currently using. Note in
    the output it states that this is the i686 kernel. Be careful, because you could
    downgrade your kernel here. Our goal here is to replace the old i686 kernel with
    a newer i686 kernel and not a newer i386 kernel. The i386 kernel would work, but
    it would not perform well. We will address this in Chapter 10.


    ```

    [root@HostA /V71]$# rpm -qa grep kernel

    kernel-headers-2.4.2-2

    kernel-2.4.2-2

    kernel-source-2.4.2-2

    [root@HostA /V71]$# uname -a

    Linux Linux 2.4.2-#1 Sun Apr 08 20:41:30 EDT 2001 i686 unknown

    ```


