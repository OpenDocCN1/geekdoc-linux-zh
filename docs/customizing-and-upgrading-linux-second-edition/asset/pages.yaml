  md: '# Configuring the Video


    pushing the limits of your vertical-scan rates, then interlacing cannot help you.
    It cannot get you the vertical-scan limits, either. Your vertical-scan rates have
    to be only 50 percent to 70 percent of the maximum. Even then, interlacing might
    not be a sure thing, but it is worth a try.


    +   If you are custom designing the modelines, remember to use an odd number of
    vertical lines.


    What are the drawbacks of interlacing? If the refresh rate turns out to be too
    low, the persistence of the phosphors is short, then the dots noticeably lose
    their luminosity by electron gun passes and give you that annoying (in extreme
    cases, physically sickening) flicker. In addition, interlaced displays are always
    going to be inferior compared with noninterlaced displays at the same vertical-scan
    frequency (but do not forget that they will use only half the bandwidth and half
    the horizontal scan rate). Anyway, flicker and the loss of quality are the most
    common disadvantages cited after interlacing, and those who do not understand
    the whys and whereof of this technique often cite these problems.


    If the phosphor dots have enough persistence and the vertical scan frequency is
    high enough, however, interlacing might be a better alternative in some situations—especially
    if you are constrained by video bandwidth, DCF, or horizontal bandwidth. Remember
    that television has used interlacing since its inception. That is why picture
    quality (resolution) has always been acceptable on affordable components with
    a reasonably long, useful life.


    Note that noninterlaced line-by-line horizontal scanning developed later than
    TV technology. You can probably guess, now, what highdefinition TV (also called
    “high-density TV” or “HDTV”) is and why it is so more expensive than conventional
    TV.


    Just keep in mind that it is always a better idea to use noninterlaced modes at
    any given resolution as long as you can establish refresh rates that are high
    enough to prevent flickering.


