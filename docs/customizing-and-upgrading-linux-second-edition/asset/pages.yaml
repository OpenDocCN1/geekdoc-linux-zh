    protocol. We recommend that you read about the SCSI protocol before proceeding
    to work these kinds of drives. The SCSI device on the end, which will be either
    the hard drive or the CD-ROM in our example, needs to be terminated well–not both,
    and it is to be the one on the end. So, make sure that the device in the middle
    of the SCSI chain is not (repeat, not) terminated. Think of it as such: SCSI device
    A with termination, SCSI device B no termination, SCSI device C no termination,
    and SCSI device D with termination. The same rule applies to SCSI as applies to
    IDE. Do not mix different SCSI technologies. For example, do not connect a SCSI
    fast and wide device to an older I controller. Again, it might work, but ask yourself
    if you are smart or lucky.


    # Confirm and Test the System


    These are just basic checks that we recommend before you invest many hours configuring
    applications and creating users. The entire installation process takes only an
    hour or two and if anything needs to be addressed, now is the time to do.


    # Networking


    Check the networking first. Most software on the system relies on a proper TCP/IP
    configuration to function properly. Perform a simple ping. Ping your internal
    address. If you cannot see your network card, then you have to revisit your network
    card configuration. By running the netcfg utility and see whether the card is
    active. Sometimes this problem is all that it is, and it only takes a second to
    check before you change any parameters.


    If your Windows is not working but it will present an equivalent text menu version,
    another file that you check is /etc/sysconfig/hwinfo. If the device fails to appear
    in the /etc/sysconfig/hwinfo, then you have a hardware conflict or dead perhaps
    a BIOS problem.


    # Video Configuration


    You can run a utility called /usr/bin/X11/SuperProbe to find out kind of video
    chipset you have. Also check the /var/log/Xfree86.log, where x is the current
    occurrence of the log. If this utility cannot detect the chipset, then head directly
    to the Red Hat support site and check the hardware-compatibility list again. A
    troublesome video configuration can take some time to resolve. We are going to
    refer you to our Chapter 5, “Configuring the Video.”


