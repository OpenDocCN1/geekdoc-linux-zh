- fmt: "\nContinuing with advanced terminal concepts, let us talk about a few quality\
    \ tips and tricks that can save you time in the terminal. When typing a command\
    \ or file name, press tab halfway through. This feature, tab completion, will\
    \ guess what you are attempting to type and fill in the rest of the phrase. For\
    \ files it will complete the name as shown in the directory, or complete a command\
    \ by considering what you are trying to do. Linux experts and anyone that has\
    \ to use the terminal regularly may seem as though they are typing exactly what\
    \ they want with extreme accuracy and speed, but they are actually just using\
    \ tab completion.\n\nUsers, especially administrators, will spend a decent amount\
    \ of time with the `sudo` command because their instructions require elevated\
    \ privileges to run. But when typing out a long command and forgetting to type\
    \ `sudo`, you will be angered at having to type it again. Instead simply type\
    \ `sudo !!`, shorthand for “super user do again`. It generously saves from typing\
    \ an entire command again.\n\nAnother method of repeating commands is to use the\
    \ up and down arrows. Pressing up continuously cycles through previously typed\
    \ commands. You can also edit the commands with the left and right arrows to change\
    \ the text contained within.\n\nAnd the most requested terminal tip involves copy\
    \ and pasting. Attempting to paste a line into the terminal results in the strange\
    \ character `^v`. The keyboard shortcut is not configured to work in the terminal,\
    \ and that is why the strange combination is displayed. To actually paste, right\
    \ click and select the option; or use the key combination `shift+insert`. Copy\
    \ in the same way, but with `ctrl+insert` instead. While it might be okay to copy\
    \ and paste terminal commands from the Internet (provided you understand the risk\
    \ and know what they are doing in the command), do not try to paste from this\
    \ publication. The formatting introduced through the medium in which you are reading\
    \ it might have inserted special characters that are not recognized by the terminal,\
    \ so it is best if you do not copy and paste, but rather you should type manually\
    \ any commands presented.\n\nLinux has a hidden feature that not many users know\
    \ about. Files are displayed to the user when you visit that directory or type\
    \ `ls`, but actually not all of the files are viewable this way. In Linux if you\
    \ name a file with a period as the first character it will be marked as hidden.\
    \ Hidden files are not normally visible by common users, and it acts as a way\
    \ to protect configuration files from accidental editing/deleting/so forth. To\
    \ see those files, we only need to add the `-a` tag to our `ls` search. In the\
    \ GUI press `ctrl+h` in a directory to reveal the secret content. And as you create\
    \ scripts and other configuration files consider hiding them with the period as\
    \ a form of user protection.\n\nAny command within terminal can be interrupted\
    \ or quit with the `ctrl+d` key combination. Use it to stop a lengthy process\
    \ or to exit out of a program/command that you do not understand.\n\n### Aliasing\n\
    \nAliasing is a way to create your own personal shortcuts within the terminal.\
    \ Instead of typing a long command or a bunch of smaller commands aliases can\
    \ be used to combine them into a single user defined option. Just as the name\
    \ implies, aliases are different names for anything you specify. Every alias is\
    \ contained within a hidden config file- begin editing it with `nano ~/.bashrc`.\
    \ Because it exists within the user’s home directory every alias will be pertinent\
    \ only to that user. At the bottom of the file we can begin creating alias as\
    \ per the following example:\n\n```bash\nalias gohome='cd ~ && ls'\n```\n\nThis\
    \ alias will change the directory to home and display the contents by typing `gohome`.\
    \ When creating aliases you must follow the formatting presented above exactly,\
    \ meaning there is no space between the command and the equal sign. Multiple commands\
    \ are strung together inside the single quotes separated by `&&`. For more robust\
    \ aliases, add a function instead. The following example combines `cd` and `ls`\
    \ into a single command.\n\n```bash\nfunction cdls () {\n    cd \"$@\" && ls\n\
    }\n```\n\nAfter writing your aliases, save the file and restart the computer.\
    \ Your new commands are then available for use.\n\nThat file we edit, `.bashrc`,\
    \ is the configuration file for the Ubuntu terminal. Besides making aliases we\
    \ can also use it to customize our terminal settings, such as color, size, etc...\
    \ A quick tip is to uncomment the `#force_color_prompt=yes` by removing the `#`\
    \ and ensuring `yes` is after the equals. This adds color to the terminal, making\
    \ certain words different colors. More options are available when you open a terminal,\
    \ right click on it, and select profiles followed by profile preferences. Through\
    \ the tabs here you can customize the font, size, colors, background colors, and\
    \ much more. Customization of the terminal is recommended if you are going to\
    \ be using it a lot, because it helps to be comfortable with the tools you will\
    \ work with.\n\n### I/O Redirection\n\nDuring normal terminal command execution,\
    \ “normal input” (typed by the user, or read from a file/attribute/hardware) is\
    \ entered and parsed by the command. Sometimes the command has “standard output”\
    \ as well, which is the return text shown in the terminal. In `ls`, the standard\
    \ input is the current working directory, and the standard output is the contents\
    \ of the folder.\n\nInput and output are normally direct, but by using I/O redirection\
    \ we can do more with the terminal. As an example, the `cat` command (concatenate)\
    \ followed by a file will output that file to the screen. Running `cat` by itself\
    \ opens a parser where any line that is input will be immediately output (use\
    \ `ctrl+d`) to quit. But with I/O redirection hotkeys (`<`, `>`, `<<`, `>>`, `|`)\
    \ we can redirect output to another source, such as a file. And `cat > test.txt`\
    \ will now put the standard output in that new file. Double signs signify appending,\
    \ so `cat >> test.txt` will place the output at the end of the file rather than\
    \ erasing the contents at the beginning.\n\nThe vertical line character, or the\
    \ “pipe”, uses another form of I/O redirection to take the output of one command\
    \ and directly insert it into the input of another. `ls | sort –r` would take\
    \ the output of `ls` and sort it into a backwards list. We redirected the output\
    \ and gave it to another command to accomplish this.\n\nAnd finally, the `grep`\
    \ command is used very often within I/O redirection. Grep can search for a certain\
    \ string within a specified file and return the results to standard output. Using\
    \ redirection, this output can be put into other commands. An interesting feature\
    \ of Linux to note is that object is a file, even hardware. So our CPU is actually\
    \ a file that stores relevant data inside of it, and we can use `grep` and other\
    \ tools to search within it. That example is fairly advanced, but here is a simpler\
    \ instance:\n\n```bash\ngrep Conclusion report.txt\n```\n\nAnd it will search\
    \ within the file for that specific word. I/O redirection can become a complicated\
    \ process with all of the new symbols and commands, but it is a feature that you\
    \ can incorporate into your scripts and daily use that often allows for certain\
    \ features and functions of Linux to be done in a single line.\n\nLinux and the\
    \ terminal are difficult concepts to fully master. But with practice and continuing\
    \ dedication you will be able to perform masterful feats of computing and do helpful\
    \ tasks that are not possible in Windows or OSX. Learning more about commands\
    \ and how to use them certainly helps in this regard, so persist in your studies\
    \ of new commands and their use. Positively the only command you actually need\
    \ to memorize is `man`, a command that will show the manual pages and documentation\
    \ of any other command specified. Use the tool to your advantage and gain intimate\
    \ knowledge of your system.\n\n### More Linux Information\n"
  raw: 'Continuing with advanced terminal concepts, let us talk about a few quality
    tips and tricks that can save you time in the terminal.  When typing a command
    or file name, press tab halfway through.  This feature, tab completion, will guess
    what you are attempting to type and fill in the rest of the phrase.  For files
    it will complete the name as shown in the directory, or complete a command by
    considering what you are trying to do.  Linux experts and anyone that has to use
    the terminal regularly may seem as though they are typing exactly what they want
    with extreme accuracy and speed, but they are actually just using tab completion. 


    Users, especially administrators, will spend a decent amount of time with the
    sudo command because their instructions require elevated privileges to run.  But
    when typing out a long command and forgetting to type sudo, you will be angered
    at having to type it again.  Instead simply type “sudo !!”, shorthand for “super
    user do again”.  It generously saves from typing an entire command again.


    Another method of repeating commands is to use the up and down arrows.  Pressing
    up continuously cycles through previously typed commands.  You can also edit the
    commands with the left and right arrows to change the text contained within. 


    And the most requested terminal tip involves copy and pasting.  Attempting to
    paste a line into the terminal results in the strange character ^v. The keyboard
    shortcut is not configured to work in the terminal, and that is why the strange
    combination is displayed.  To actually paste, right click and select the option;
    or use the key combination shift+insert.  Copy in the same way, but with ctrl+insert
    instead.  While it might be okay to copy and paste terminal commands from the
    Internet (provided you understand the risk and know what they are doing in the
    command), do not try to paste from this publication.  The formatting introduced
    through the medium in which you are reading it might have inserted special characters
    that are not recognized by the terminal, so it is best if you do not copy and
    paste, but rather you should type manually any commands presented. 


    Linux has a hidden feature that not many users know about.  Files are displayed
    to the user when you visit that directory or type ls, but actually not all of
    the files are viewable this way.  In Linux if you name a file with a period as
    the first character it will be marked as hidden.  Hidden files are not normally
    visible by common users, and it acts as a way to protect configuration files from
    accidental editing/deleting/so forth.  To see those files, we only need to add
    the –a tag to our ls search.  In the GUI press ctrl+h in a directory to reveal
    the secret content.  And as you create scripts and other configuration files consider
    hiding them with the period as a form of user protection.


    Any command within terminal can be interrupted or quit with the ctrl+d key combination. 
    Use it to stop a lengthy process or to exit out of a program/command that you
    do not understand. 


    Aliasing is a way to create your own personal shortcuts within the terminal. 
    Instead of typing a long command or a bunch of smaller commands aliases can be
    used to combine them into a single user defined option.  Just as the name implies,
    aliases are different names for anything you specify.  Every alias is contained
    within a hidden config file- begin editing it with “nano ~/.bashrc”.  Because
    it exists within the user’s home directory every alias will be pertinent only
    to that user.  At the bottom of the file we can begin creating alias as per the
    following example:


    alias gohome=’cd ~ && ls’


    This alias will change the directory to home and display the contents by typing
    “gohome”.  When creating aliases you must follow the formatting presented above
    exactly, meaning there is no space between the command and the equal sign.  Multiple
    commands are strung together inside the single quotes separated by “&&”.  For
    more robust aliases, add a function instead.  The following example combines cd
    and ls into a single command.


    function cdls () {


        cd "$@" && ls


    }


    After writing your aliases, save the file and restart the computer.  Your new
    commands are then available for use.


    That file we edit, .bashrc, is the configuration file for the Ubuntu terminal. 
    Besides making aliases we can also use it to customize our terminal settings,
    such as color, size, etc... A quick tip is to uncomment the “#force_color_prompt=yes”
    by removing the # and ensuring “yes” is after the equals.  This adds color to
    the terminal, making certain words different colors.  More options are available
    when you open a terminal, right click on it, and select profiles followed by profile
    preferences.  Through the tabs here you can customize the font, size, colors,
    background colors, and much more.  Customization of the terminal is recommended
    if you are going to be using it a lot, because it helps to be comfortable with
    the tools you will work with. 


    I/O Redirection


    During normal terminal command execution, “normal input” (typed by the user, or
    read from a file/attribute/hardware) is entered and parsed by the command.  Sometimes
    the command has “standard output” as well, which is the return text shown in the
    terminal.  In “ls”, the standard input is the current working directory, and the
    standard output is the contents of the folder. 


    Input and output are normally direct, but by using I/O redirection we can do more
    with the terminal.  As an example, the “cat” command (concatenate) followed by
    a file will output that file to the screen.  Running cat by itself opens a parser
    where any line that is input will be immediately output (use ctrl+d) to quit. 
    But with I/O redirection hotkeys (<, >, <<, >>, |) we can redirect the output
    to another source, such as a file.  And “cat > test.txt” will now put the standard
    output in that new file.  Double signs signify appending, so “cat >> test.txt”
    will place the output at the end of the file rather than erasing the contents
    at the beginning. 


    The vertical line character, or the “pipe”, uses another form of I/O redirection
    to take the output of one command and directly insert it into the input of another. 
    “ls | sort –r” would take the output of ls and sort it into a backwards list. 
    We redirected the output and gave it to another command to accomplish this. 


    And finally, the “grep” command is used very often within I/O redirection. Grep
    can search for a certain string within a specified file and return the results
    to standard output.  Using redirection, this output can be put into other commands. 
    An interesting feature of Linux to note is that object is a file, even hardware. 
    So our CPU is actually a file that stores relevant data inside of it, and we can
    use grep and other tools to search within it.  That example is fairly advanced,
    but here is a simpler instance:


    “grep Conclusion report.txt”


    And it will search within the file for that specific word.  I/O redirection can
    become a complicated process with all of the new symbols and commands, but it
    is a feature that you can incorporate into your scripts and daily use that often
    allows for certain features and functions of Linux to be done in a single line. 


    Linux and the terminal are difficult concepts to fully master.  But with practice
    and continuing dedication you will be able to perform masterful feats of computing
    and do helpful tasks that are not possible in Windows or OSX.  Learning more about
    commands and how to use them certainly helps in this regard, so persist in your
    studies of new commands and their use.  Positively the only command you actually
    need to memorize is “man”, a command that will show the manual pages and documentation
    of any other command specified.  The manual pages show switches, examples, and
    the intended use of every command on your system.  Use the tool to your advantage
    and gain intimate knowledge of your system. 


    More Linux Information'
