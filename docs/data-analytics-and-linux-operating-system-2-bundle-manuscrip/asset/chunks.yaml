- fmt: '

    To integrate information technology, business intelligence, and analytics, four
    dominant questions must be under consideration:


    1. Are analytics a key component of the business, in the same categories as finance,
    sales, product development, research and marketing?

    2. Are the appropriate personnel in place?

    3. Do the personnel have the ability for deep knowledge of the business needs?

    4. Is there a governance structure in place?


    This framework is referred to as the `CSPG` framework.


    ### CSPG Framework


    #### Culture

    - Does the business revolve around the data analytics or does analytics take a
    backseat to marketing, R&D, and sales?


    #### Staffing

    - Is there adequate staffing and is hiring of qualified staff a priority? Does
    the IT department work on a shoestring budget or do they have the proper resources
    to conduct big data analysis?


    #### Processes

    - If the analytics process is completed correctly, data can be traded with like
    organizations without fear of contamination, allowing multiple streams of information.


    #### Governance

    - Governance is a new concept for businesses that have come recently to the table
    of data analytics. The governance needs a structure that encompasses people, structure,
    and salaries so that the IT department is not out of variance with the other departments.


    ## Placement of the Analytics Function in the Business


    There are three models for placement of the Data Analytics function:


    1. **Placing the analytics department in a central unit.** The advantage of this
    location is that it is easy to obtain data, integration into the company culture
    is simpler, and the data retrieval is faster. The challenge for a centralized
    department can be the location (as an add-on department it may be located away
    from the hub of decision makers), there may be confusion as to whom the department
    reports, and the data analysts may be so far away from the corporate culture that
    they cannot anticipate the business needs.


    2. **The second possibility is to decentralize the analytics and place analysts
    in each department throughout the company.** This allows the analysts to focus
    on the business sector in which they reside. The challenge is to work together
    on company-wide projects that are not segmented and need all the analysts focused
    on one problem set.


    3. **The third option is a mix of the two previous scenarios.** This places the
    analysts in a centralized location but also deploys analysts throughout the organization.
    This requires a very large staff of analysts, which may be the biggest challenge
    for the business.


    ## The Key Analytics


    Analytics is composed of models, infrastructure and operations. The models are
    statistical or predictive or datamining that are originated from statistical data.
    Key to the analytics process is the building of the models, which is usually performed
    by the analysts or data scientists or statisticians.


    Infrastructure is the software components, applications used and platforms utilized
    for data management, data processing and decision making. The processes connected
    to analytics infrastructure are data management, model deployment and multiple
    analytics that must be incorporated in the business operations.


    Operation are the processes that create the data used for models and actions for
    business use. Data can be purchased, internal, external, or collaborative.


    The Data Analytics team must identify the internal and external relevant data,
    manage the data, build the analytical models and introduce the models into the
    internal systems. Most businesses organize these functions thusly: The business
    department requests the model, the Analytics team constructs the model, the IT
    department supplies the raw data, and operations launches the model. This brings
    us to the why of analytics governance.


    ## Analytics Governance


    The three challenges that businesses face when extracting big data are:


    1. Identifying the unique needs for which the data will be used

    2. Obtaining the needed information

    3. Deploying the analytics models into the organization


    The analytics manager must have enough authority to negate these challenges. The
    structure of governance needs a mechanism for identification, communications and
    resolution of issues stemming from data analysis problems. The analytics manager
    also needs the flexibility to hire qualified and knowledgeable personnel.


    ## Chapter 9: Data Visualization


    Visualization is what makes data come alive to the reader. A list of information
    can be a struggle to try to translate into useable data; translating the groups
    of data into a manageable form is essential to help the reader differentiate between
    the important and the superfluous.


    Using graphic designing software can draw notice to the key statistics, and by
    using visual images, can uncover hidden patterns and connections that might not
    otherwise be detected.


    The following is a list of free data visualization software programs that are
    easily accessible on the web:


    - **Chart.js**: `http://www.chartjs.org/`

    This program offers 6 different graphics HTML5, and is one of the most popular
    small-charting programs.


    - **Dygraphs**: `https://dygraphs.com/`

    This is a JavaScript charting tool that is customizable, works with almost all
    browsers, and is used for dense data sets. It is mobile device and tablet friendly.


    - **FusionCharts**: `http://www.fusioncharts.com/`

    FusionCharts Suite XT offers more than 90 charts, 965 data maps, and customizable,
    interactive business dashboard. FusionCharts is AJAX application-friendly and
    can be used with `JavaScript API`.


    - **Instant Atlas**: `http://www.instantatlas.com/`

    Instant Atlas combines statistics with map data, which is very useful with demographic
    information.


    - **Raw**: `https://raw.densitydesign.org/`

    Raw is customizable and available for modification, can be uploaded from the app
    to the compute, exported as SVG or PNG, can be embedded into the webpage, and
    offers vector-based images.


    - **Tableau**: `http://www.tableau.com/`

    Tableau allows the user to drag and drop data to update immediately into real-time
    charts.


    - **Timeline**: `https://timeline.knightlab.com/`

    Timeline gives a detailed analysis of events that offers a clickable ability to
    open the chart for more particularized information.


    - **Visual.ly**: `https://visual.ly/`

    Visual.ly is a gallery tool and an infographic tool. With Visual.ly one can build
    stunning representations of data that are brilliant and easy to create.


    - **Visualize Free**: `https://visualizefree.com/`

    Visualize Free allows you to upload your own data sets and build HTML5 interactive
    charts for visualization.


    - **ZingChart**: `https://www.zingchart.com/`

    ZingChart is another JavaScript charting program that has interactive Flash and
    HTML5 charts, more than 100 selections for your data analysis.


    ## Chapter 10: Using Social Media


    Domo released the infographic of statistics for Social Media users in 2015. Here
    are the statistics showing the phenomenal increase in users.


    In just one minute:


    - `BuzzFeed` streams 34,000+ videos

    - `Instagram` displays 1.7 million+ photos

    - `Netflix` streams 80,000 video hours

    - `Vine` streams 1,000,000 videos

