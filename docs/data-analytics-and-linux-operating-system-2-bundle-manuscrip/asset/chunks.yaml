    Arranging data in ways that make them simpler to work with.


    How you do this will rely on upon your design of research and your assessment
    questions. You may amass perceptions by the `independent variable` (pointer of
    achievement) they identify with, by people or gatherings of members, by time,
    by movement, and so on. You may likewise need to group the collected information
    in a few distinctive ways, so you can consider interactions and relationships
    among various variables.


    There are two sorts of variables in data. An `independent variable` (the intercession)
    is a condition executed by the analyst or group to check whether it will make
    change and improve the situation. This could be a project, strategy, framework,
    or other activity. A `dependent variable` is the situation that may change as
    a consequence of the `independent variable` or intercession. A `dependent variable`
    could be a conduct or a result.


    ## How Do We Examine Data?


    Investigating data includes looking at it in ways that reveal the connections,
    designs, patterns, and so on that can be found inside. That may mean subjecting
    it to statistical operations that can let you know not just what sorts of connections
    appear to exist among variables and additionally to what level you can believe
    the answers you''re getting. It might mean contrasting your data with that from
    different data sets (a control group, statewide figures, and so on), to reach
    a few inferences from the information. The point, as far as your assessment, is
    to get a precise evaluation so as to better comprehend your work and its consequences.


    There are two sorts of information you will use, even though not all assessments
    will fundamentally incorporate both. `Quantitative data` alludes to the data that
    is gathered as, or can be interpreted into, numbers, which can then be shown and
    broke down mathematically. `Qualitative data` are gathered as descriptions, accounts,
    conclusions, quotes, understandings, and so forth., and are by and large either
    not ready to be reduced to numbers, or are viewed as more important or enlightening
    if left as narratives. As you may anticipate, quantitative and qualitative data
    should be analyzed in different ways.


    ## Quantitative data


    `Quantitative data` is collected as numbers. Examples of `quantitative data` include:


    * Frequency (rate and duration) of specific behaviors or situations

    * Survey results (reported behaviors, ratings of customer satisfaction, etc.)

    * Percentages of people with certain characteristics in the demographic (those
    with diabetes, obese, with heart disease indicators, the education level, etc.)


    Data can also be collected other than numerically, and converted into quantitative
    data that is ready for analysis. `Compilers` can assign numbers to the levels
    of emphasis of a specific behavior. For instance, `compilers` can enumerate the
    quantity of Facebook "likes" or "comments". Whether or not this kind of information
    is necessary or helpful is dependent upon the kinds of questions your data is
    meant to answer.


    `Quantitative data` is converted to statistical procedures such as calculating
    the mean number of times an event repeats. These calculations, because numbers
    are exacting, can offer definitive answers to varying questions. `Quantitative
    analysis` can identify changes in `dependent variables` that are related to –
    duration, frequency, timing intensity, etc. This allows comparative analysis with
    like issues, like changes within the population count of a zip code, or purchasing
    changes between women of a similar age.


    ## Qualitative Data


    Unlike numbers, qualitative information is considered "soft" data, meaning it
    can’t be reduced to a specific conclusion. A number may indicate the population
    in a demographic, but the soft data may tell you the stress levels of the shoppers
    by the attitude and appearance of the customers.


    `Qualitative data` can occasionally be converted into numbers, by counting the
    number of times specific things happen, or by assigning numbers to levels of importance,
    customer satisfaction or whether a `function` is user friendly when placing an
    order on a website.


    The translation of qualitative data into quantitative data is dependent upon the
    human factor. Even if the customers agree to use the numbers 1-5 (1 being very
    unsatisfied and 5 being extremely satisfied) to evaluate customer satisfaction,
    there is still the issue of where 2, 3, and 4 fall on the assessment scale. The
    numbers only give a partial assessment; they give no information about the "why"
    of the customer rating. Was the customer unhappy because of the product inventory
    on the shelf, a detail about the product, a problem with the atmosphere or music
    in the store, the location of the store, etc.?


    Likewise, when counting specific instances of a behavior, did the counter include
    those who exhibited only partial behaviors (those that hit "like" but did not
    comment on `Facebook`, for example)?


    `Qualitative data` can impart particular knowledge that is not available in quantitative
    data, such as why a sales campaign is working, or how the campaign is culturally
    conflicting with the customer base. (In 1962, Chevrolet was puzzled why their
    new "Nova" was so popular in the United States but had almost no sales in Mexico.
    Researchers failed to translate the word "Nova" into Spanish, which means "no
    go." The Spanish vernacular for the name of the car was "doesn''t run." No wonder
    sales were down in Mexico! The automobile was renamed to Caribe and sales increased.)


    It is often helpful to evaluate both quantitative and qualitative data sets.


    ## What are the steps to collecting and analyzing data?


    * Clearly design and define the measurements that are required to answer the questions.

    * Conduct the research for the needed period of time in the correct timeframe.

    * Organize the data dependent on the `function` of the data; how will you use
    the information?

    * If possible and appropriate, change qualitative data into quantitative data.

    * Use graphs and visualization charts (examples are in Chapter 10) to make the
    data easier to assimilate.

    * Visually inspect the patterns of information to identify trends and connections.

    * Seek patterns in the qualitative data, just like the quantitative data. If people
    consistently refer to similar problems, these may be crucial to understanding
    the problem and a workable solution.


    Interpret the findings by using one of the following categories:


    * Your marketing plan is performing on target with no obvious problems.

    * Your marketing plan had no significant effect on sales.

    * Your marketing plan had a negative effect on sales. (Possibly it was offensive
    or deemed silly by consumers.)

    * Your marketing plan had mixed results. The promoted product sold well but a
    previously popular product may have decreased sales. For example, Secret deodorant
    offered a new scent category that was very popular but the unscented product sales
    decreased significantly as loyal users just swapped their preferences.

    * If the analysis shows your marketing program is working you have a simple choice
    of continuing the program or tweaking it to hopefully increase sales.

    * If analysis shows the program isn''t working, interpretation is more convoluted.
    What is missing from the equation? What factor is preventing the desired results?


    Analyzing and interpreting the results brings you full circle in the process;
    now you can use the knowledge you''ve gain to adjust your business and improve
    your service. Continuing to analyze and evaluate the business goals and results
    will keep the business current and an effective presence in the marketplace.


    ## Chapter 8 An Organizational Approach to Data Analytics


    This chapter discusses the framework that needs to be in place in the organization
    that incorporates big data into the corporate culture. A workable analytics governance
    will enable the business to utilize big data for an edge over the competition.


    ### The Framework

