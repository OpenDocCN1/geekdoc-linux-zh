    then by purchasing habits. Connect with your customers on a regular basis to glean
    their input on your products and services.


    4.Data Hygiene


    Data hygiene is the process of keeping data clean and current. Old data and corrupted
    data will only clutter your database and possibly even infect all of your records.
    Just like the previous functions, hygiene should be provided on a regular basis
    to ensure the data is not decayed or contaminated.


    The importance of maintaining a pristine and organized database cannot not be
    overlooked. If the data isn’t good, all the contacts and marketing projects will
    not succeed if they are addressed to the wrong contact point. To enhance the value
    of your database for marketing and sales endeavors, do not neglect database management.


    Chapter 4Real World Examples of Data Management


    An Example of Ineffectual Usage


    *   John Belushi, 33


    *   Chris Farley, 33


    *   Jimi Hendrix, 27


    *   Philip Seymour Hoffman, 46


    *   Whitney Houston, 48


