  trans: '

    如今企业高管接收的数据是详尽、快速且可靠的。这使得决策者能够在收到所需信息后的几分钟内确定最佳行动方案，而不是像以前那样需要几周、几个月甚至几年。


    企业正在挖掘数据矿，以多种方式利用信息，包括但不限于：


    1. **数据存储成本降低。** 1981 年，存储 1GB 信息的费用是 700,000 美元。到 1996 年，这一成本下降到 295.00 美元，而到
    2014 年，同等存储成本仅为 00.03 美元。（来源：[`www.mkomo.com/cost-per-gigabyte-update`](http://www.mkomo.com/cost-per-gigabyte-update)）


    2. **研发实时数据的机会。** 客户现在对自己的需求和想要表达非常直接。在 Twitter 上发布新产品可以快速判断人们对创新产品设计的兴趣。数据分析为市场趋势的研发提供了即时反馈。


    3. **库存与产品分析。** 通过数据分析，公司可以了解货架上什么很受欢迎，哪些产品需要清理灰并移出商店，腾出宝贵的货架空间。为什么杂货店将利用率最高的产品放在最顶层和最底层？他们知道这些产品总是畅销，但利润率最高的产品位于消费者的视线水平。


    联想曾为客户设计一款新键盘，但未能识别出其游戏行业的忠实客户群。在采用数据分析后，联想改变了设计以纳入游戏者的需求，并推出了一款带来数百万销售额的优秀产品。数据分析拯救了他们的产品并增加了利润。


    数据分析绝非局限于零售行业。其他企业也使用数据分析来提高盈利能力和效率。以下是目前行业正在采用的一些用途：


    ### 旅游与酒店业


    客户满意度很难衡量，但它是企业繁荣的关键。大数据分析让管理层在客户办理入住、决策点、甚至离开设施时，能够立即获取客户偏好。这让管理层有机会在问题发生时进行纠正，将潜在的客户关系“炸弹”变为所有利益方满意的体验。


    ### 医疗保健


    在医疗保健行业，大数据正在改变记录保存、研究分析以及患者护理管理的方式。结果是提供了一种更好的患者护理方法，通过计算机记录，无论患者接受何种治疗都能进行追踪。此外，有时由于查询的即时信息，可以立即获得新的疗法或药物。医院的人员配置也通过数据分析发生了转型，允许医疗机构在高峰安排更多人员，在低峰期安排较少人员。


    ### 政府


    地方警察部门正在使用数据分析来确定犯罪统计最高的区域（这些区域增加步行巡逻更有利），甚至是入室盗窃和轻微犯罪的高峰时间。分析技术可以精确定郊区或城市的问题区域，而无需牺牲有限的人力进行监控。


    ### 中小型企业


    中小型企业在收集数据方面与大型机构拥有同样的机会，但记住这些策略将很有帮助：


    要进入消费者的主流市场，企业必须具备数字化形象。购物服务和产品的客户及客户会去网站和社交媒体寻找意见、报告、比较和评论。


    网站应该是简单且诚实的的。它还应该描述产品或服务的益处，而不夸大或误导。消费者看到炒作就会知道，并会刻意避开那些作为潜在信息或产品渠道的网站。网站应该具备提供信息和收集信息的能力。


    网站分析将收集客户的人口统计数据、他们的兴趣、进入点、无聊点和“离开”点，以及他们喜欢的社交媒体网站。


    如果网站设计得当并具有许多互动点，客户或顾客会在意识到自己被“挖掘”之前就明确他们的需求和想要。


    ### 小企业示例


    这是一个使用大数据的小企业的良好示例：


    当地一家面包店发现巧克力曲饼的销量非常火爆，网站和电话订单都是按打计的。然而，巧克力杯蛋糕的销售变得越来越慢。烘焙师阅读了网站上的评论，发现了这条看似不起眼的评论：“我喜欢巧克力杯蛋糕和巧克力曲饼，但我只花
    2 个杯蛋糕的就能买到 12 块巧克力曲饼。”


    这一数据对烘焙师来说是一个“顿悟时刻”。烘焙师迅速为饼干销售制作了一个独立页面（以延续巧克力曲饼的趋势），但并将全尺寸杯蛋糕的产品供应改为迷你杯蛋糕。四个迷你杯蛋糕的价格与一打巧克力曲饼相同。烘焙师还在
    Facebook 列表上发布了优惠券特惠：“提及此广告，购买一打杂锦饼干，即可获得一个自选的免费迷你杯蛋糕。”所有饼干和新产品的销量都因此增加了。


    # 第 2 章 如何处理大数据


    ## 大数据及其问题


    大数据是指由于规模过大、无组织或非结构化，无法使用目前数据管理中使用的传统技术和方法进行分析的挖掘数据。数据的数量并不如数据如何使用和分类重要。


    大数据分为三个领域：容量（volume）、速度（velocity）和多样性（variety）。企业被海量数据淹没，需要识别和利用这些数据集的方法。


    无论管理问题如何，大数据对企业或组织仍然非常有价值。大数据让信息变得透明且可用。现在组织正在收集更大数量的数据，以数字格式存储比以前用磁带存储要便宜得多。管理层利用性能数据来探索病假、员工迟到、产品库存、移动甚至存储容量的趋势。其他企业正在利用数据进行预算预测和购买决策。


    大数据帮助企业对客户群进行细分，以便根据客户的需求和欲望定制产品。更重要的是，大数据正被应用于研发，以改进下一代的服务和产品。


    ## 获取和掌握大数据


    公司现在必须使用新的存储、计算、收集、分析和技术来捕捉并处理大数据。尽管不同公司的技术挑战甚至优先事项有所不同，但它们面临着相同的问题：旧的计算机系统、不兼容的格式以及数据集成整合阻碍了对数据库信息的解释。


    目前有新的方法可以处理数据以协助大数据的质量管理。最好的方法会在做出决策之前分析数据的容量、多样性和复杂性。


    大数据在数据库管理系统方面有开源技术，包括 `Hadoop` 和 `Cassandra`。市场上还有几种商业智能软件产品可以向所有主报告、展示和分析最终产品。

