- fmt: "\nThe first step to intercommunication is installing the `samba` package.\
    \ Either find it through the software center, or type in `sudo apt-get install\
    \ samba` to obtain and install the necessary software.\n\nSharing files from your\
    \ Ubuntu machine to other computers involves creating a `samba` share. Samba runs\
    \ off of the same protocols that other popular file sharing methods use, so files\
    \ shared from the Ubuntu machine can easily be seen on Windows. After installing\
    \ samba, use `sudo nano /etc/samba/smb.conf` to start editing the configuration\
    \ file. At the very bottom of the file add these lines:\n\n```\n[share]\n    comment\
    \ = File Share from Ubuntu\n    path = /srv/samba/share\n    browsable = yes\n\
    \    guest ok = yes\n    read only = no\n    create mask = 0755\n```\n\nNow, create\
    \ the folder specified in `path` (`sudo mkdir -p /srv/samba/share`) and set permissions\
    \ (`sudo chown nobody:nogroup /srv/samba/share/`) so that anybody can access its\
    \ contents. Place any files you want to share within that directory, and then\
    \ restart the service (`sudo restart smbd`, `sudo restart nmbd`) to make the share\
    \ active. Lastly, log on to your other computer and navigate to the network shares.\
    \ In Windows, they will appear in the left panel of file explorer. If the share\
    \ does not appear automatically, type the IP into the file path box (find Ubuntu\
    \ IP with `ifconfig`). You are now able to access Ubuntu’s files from other operating\
    \ systems.\n\nYou might also need to see files from other operating systems in\
    \ the Ubuntu computer. Firstly, open the Ubuntu file explorer. From the menu bar,\
    \ click `files`, and then select `connect to server`. In the resulting box, type\
    \ the URL of the share you wish to access. It could be an ftp address (`ftp://ftp.test.com`),\
    \ an http address (`http://test.com`), or a share address (`smb://share/Folder`).\
    \ Without any additional hardware or setup, you can see the files this way.\n\n\
    Finally, joining a domain such as Active Directory allows your computer to interact\
    \ with other operating systems on the network and achieve other business-oriented\
    \ tasks. Whether you have a small home network, or whether you are adding Linux\
    \ computers to a corporate domain, the process is the same. Install a few extra\
    \ packages (`realmd`, `sssd`, `sssd-tools`, `samba-common`, `samba-common-bin`,\
    \ `samba-libs`, `krb5-user`, `adcli`, `packagekit`). While installing them, it\
    \ will ask for your domain name. Enter it in all caps. Enter `kinit -V adminname`\
    \ replacing that with an actual admin account name in the domain. After entering\
    \ the password you will have been authenticated to the domain. Now joining it\
    \ is done with `realm --verbose join -U adminmame domainname.loc`.\n\nIf it fails,\
    \ it means the DNS is misconfigured on our device. Type `echo ‘ad_hostname = nix01.domainname.loc'\
    \ >> /etc/sssd/sssd.conf`, then `echo ‘dyndns_update = True' >> /etc/sssd/sssd.conf`\
    \ and finally use `service sssd restart` to restart with those new settings. The\
    \ first line sets the FQDN of our computer, so the line needs to be changed according\
    \ to our domain settings. After a successful restart with correctly configured\
    \ settings the terminal will claim it has joined the domain. Test this with `realm\
    \ list`. Now connected to AD you can administer the Linux device from your server!\n\
    \nFor most users, however, creating shares and joining domains is far beyond the\
    \ connectivity needs. Simple file sharing is much better done through USB drive\
    \ transfers or a service such as Dropbox. Indeed Dropbox can be installed on the\
    \ big three operating systems and files can be synced between them with no additional\
    \ setup. On Ubuntu either download the `.deb` file directly from the website,\
    \ install it from the software center, or use `sudo apt-get install nautilus-dropbox`\
    \ to obtain the application. Within the Dropbox folder, place any files that you\
    \ wish to transfer between computers and it will automatically be downloaded and\
    \ updated on all other Dropbox computers you own.\n\nUsing other operating systems\
    \ is not complicated when you connect them together. So long as the computers\
    \ are on the same network you can create file shares, join them into a domain,\
    \ or use a simple service such as Dropbox.\n\n## Useful Applications\n\nHere is\
    \ a list of the best Applications for your Ubuntu system that will help you get\
    \ the most out of your computer.\n\n- **Office Productivity**: Abiword, VI, Emacs,\
    \ LibreOffice, nano\n- **Multimedia**: VLC, DeaDBeef, Cmus, AquaLung, MPlayer,\
    \ Miro\n- **Web Browsing**: Firefox, Chromium, Midori, W3M\n- **Creativity**:\
    \ Aud, acity, GIMP\n- **Other**: Kupfer, Thunderbird, qBittorrent\n\nAnd for programs\
    \ that help with usability, there are so many varied choices that it depends on\
    \ what you are trying to accomplish. The best way to discover a program is to\
    \ search on the internet for a functionality you wish to add. For example, if\
    \ you are searching for a quick way to open and close the terminal you might come\
    \ across the program `Guake`. Or if you are wanting audio within the terminal\
    \ it might recommend `Cmus`. Finding the perfect applications for you is part\
    \ of Linux, and it makes every install a little more.\n\n## Administration\n\n\
    If you are looking for a `Control Panel` of sorts, you can find administrative\
    \ tools such as network, printing, appearance, and more from `Settings`. Some\
    \ Ubuntu variants use `Settings Manager` or `Settings` for the same purpose.\n\
    \nAfter launching it there will be links to configuration applications; just click\
    \ on whichever you need to change to GUI. But not everything is found through\
    \ GUI. Most low-level settings are only available through the command line, and\
    \ as such you will need to know exactly what to type.\n\nAs an example, adding\
    \ a new user to Ubuntu requires the `adduser` command. By following the command\
    \ with a username, the terminal will prompt for basic information and a password.\
    \ Setting that new user to be an administrator is done with `usermod -aG sudo\
    \ nameofuser`. Moreover a user can be deleted with `deluser`. These options are\
    \ difficult to find through GUI but can be done in seconds with a terminal.\n\n\
    `Task Manager`, or the administration of running applications within Ubuntu is\
    \ done through the terminal as well. The program `top` is standardly installed\
    \ on all distributions (mostly), and starting it displays a list of all running\
    \ processes as per task manager. By default though, the list of processes will\
    \ be updated and moving around in such a way that it might be difficult to read\
    \ the data. Press the `f` button to bring up a sorting list, navigate to `PID`\
    \ with the arrow keys and press `s` to set over that option. Now use escape to\
    \ return to top and we can now scroll through the list with page-up and page-down\
    \ to view the tasks. Say, for instance, we want to close the program `Pidgin`\
    \ because it is unresponsive. Find it in the list (or search for it with the above\
    \ filtering commands) and take note of the PID (Process ID) number. Press `q`\
    \ to quit top, then type `kill 4653` obviously replacing the number with the PID.\
    \ At any time within top you can press `h` to see a list of keyboard shortcuts\
    \ for various actions. If top is too difficult to use consider installing `htop`,\
    \ a `human readable` version of the program. It actually shows neat ASCII graphs\
    \ detailing CPU, RAM, and other usage statistics. Search for a program with F3,\
    \ then use F9 and Enter to kill it.\n"
  raw: 'The first step to intercommunication is installing the “samba” package.  Either
    find it through the software center, or type in “sudo apt-get install samba” to
    obtain and install the necessary software. 


    Sharing files from your Ubuntu machine to other computers involves creating a
    samba share.  Samba runs off of the same protocols that other popular file sharing
    methods use, so files shared from the Ubuntu machine can easily be seen on Windows. 
    After installing samba, use “sudo nano /etc/samba/smb.conf” to start editing the
    configuration file.  At the very bottom of the file add these lines:


    [share]


        comment = File Share from Ubuntu


        path = /srv/samba/share


        browsable = yes


        guest ok = yes


        read only = no


        create mask = 0755


    Now, create the folder specified in “path” (sudo mkdir -p /srv/samba/share) and
    set permissions (sudo chown nobody:nogroup /srv/samba/share/) so that anybody
    can access its contents.  Place any files you want to share within that directory,
    and then restart the service (sudo restart smbd, sudo restart nmbd) to make the
    share active.  Lastly, log on to your other computer and navigate to the network
    shares.  In Windows, they will appear in the left panel of file explorer.  If
    the share does not appear automatically, type the IP into the file path box (find
    Ubuntu IP with ifconfig).  You are now able to access Ubuntu’s files from other
    operating systems. 


    You might also need to see files from other operating systems in the Ubuntu computer. 
    Firstly, open the Ubuntu file explorer.  From the menu bar, click “files”, and
    then select “connect to server”.  In the resulting box, type the URL of the share
    you wish to access.  It could be an ftp address (ftp://ftp.test.com), an http
    address (http://test.com), or a share address (smb://share/Folder).  Without any
    additional hardware or setup, you can see the files this way. 


    Finally, joining a domain such as Active Directory allows your computer to interact
    with other operating systems on the network and achieve other business-oriented
    tasks.  Whether you have a small home network, or whether you are adding Linux
    computers to a corporate domain, the process is the same.  Install a few extra
    packages (realmd, sssd, sssd-tools, samba-common, samba-common-bin, samba-libs,
    krb5-user, adcli, packagekit).  While installing them, it will ask for your domain
    name.  Enter it in all caps.  Enter “kinit -V adminname” replacing that with an
    actual admin account name in the domain.  After entering the password you will
    have been authenticated to the domain.  Now joining it is done with “realm –-verbose
    join -U adminmame domainname.loc”. 


    If it fails, it means the DNS is misconfigured on our device. Type “echo ‘ad_hostname
    = nix01.domainname.loc’ >> /etc/sssd/sssd.conf”, then “echo ‘dyndns_update = True’
    >> /etc/sssd/sssd.conf” and finally use “service sssd restart” to restart with
    those new settings.  The first line sets the FQDN of our computer, so the line
    needs to be changed according to our domain settings.  After a successful restart
    with correctly configured settings the terminal will claim it has joined the domain. 
    Test this with “realm list”.  Now connected to AD you can administer the Linux
    device from your server!


    For most users, however, creating shares and joining domains is far beyond the
    connectivity needs.  Simple file sharing is much better done through USB drive
    transfers or a service such as Dropbox.  Indeed Dropbox can be installed on the
    big three operating systems and files can be synced between them with no additional
    setup.  On Ubuntu either download the .deb file directly from the website, install
    it from the software center, or use “sudo apt-get install nautilus-dropbox” to
    obtain the application.  Within the Dropbox folder, place any files that you wish
    to transfer between computers and it will automatically be downloaded and updated
    on all other Dropbox computers you own. 


    Using other operating systems is not complicated when you connect them together.
    So long as the computers are on the same network you can create file shares, join
    them into a domain, or use a simple service such as Dropbox.   


    Useful Applications


    Here is a list of the best Applications for your Ubuntu system that will help
    you get the most out of your computer.


    *   Office Productivity – Abiword, VI, Emacs, LibreOffice, nano


    *   Multimedia – VLC, DeaDBeef, Cmus, AquaLung, MPlayer, Miro


    *   Web Browsing – Firefox, Chromium, Midori, W3M


    *   Creativity – Aud


    *   acity, GIMP


    *   Other – Kupfer, Thunderbird, qBittorrent


    And for programs that help with usability, there are so many varied choices that
    it depends on what you are trying to accomplish. The best way to discover a program
    is to search on the internet for a functionality you wish to add.  For example,
    if you are searching for a quick way to open and close the terminal you might
    come across the program “Guake”.  Or if you are wanting audio within the terminal
    it might recommend “Cmus”.  Finding the perfect applications for you is part of
    the customization aspect of Linux, and it makes every install a little more personal
    for each user. 


    Administration


    If you are looking for a “Control Panel” of sorts, you can find shortcuts to administrative
    tools such as network, printing, keyboard, appearance, and more from within the
    “System Settings” application.  Some Ubuntu variants use “Settings Manager” or
    just “Settings” for the same purpose. 


    After launching it there will be links to other default configuration applications;
    just click on whichever you need to change to obtain a GUI for settings a few
    options.  But not everything administrative is found through the GUI.  Most low-level
    settings are only available through the command line, and as such you will need
    to know exactly what to type to edit them. 


    As an example, adding a new user to Ubuntu requires the “adduser” command.  By
    following the command with a username, the terminal will prompt for basic information
    and a password.  Setting that new user to be an administrator is done with “usermod
    -aG sudo nameofuser”.  Moreover a user can be deleted with “deluser”.  These options
    are difficult to find through GUI but can be done in seconds with a terminal. 


    “Task Manager”, or the administration of running applications within Ubuntu is
    done through the terminal as well.  The program “top” is standardly installed
    on all distributions (mostly), and starting it displays a list of all currently
    running processes as per task manager.  By default though, the list of processes
    will be updated and moving around in such a way that it might be difficult to
    read the data we need.  Press the “f” button to bring up a sorting list, navigate
    to “PID” with the arrow keys and press “s” to set over that option.  Now use escape
    to return to top and we can now scroll through the list with page-up and page-down
    to view the tasks.  Say, for instance, we want to close the program “Pidgin” because
    it is unresponsive.  Find it in the list (or search for it with the above filtering
    commands) and take note of the PID (Process ID) number. Press “q” to quit top,
    then type “kill 4653” obviously replacing the number with the PID.  At any time
    within top you can press “h” to see a list of keyboard shortcuts for various actions. 
    If top is too difficult to use consider installing “htop”, a “human readable”
    version of the program.  It actually shows neat ASCII graphs detailing CPU, RAM,
    and other usage statistics.  Search for a program with F3, then use F9 and Enter
    to kill it. '
