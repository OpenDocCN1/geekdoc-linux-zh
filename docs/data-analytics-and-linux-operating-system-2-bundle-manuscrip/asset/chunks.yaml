  trans: '


    为了继续学习 Linux 及其提供的各种可能性，请考虑本节中的示例。本节将简要讨论 Linux 的更多用途，以及其他尚未介绍过的概念。


    ### Linux 文件系统


    “Linux 文件系统”指的是计算机上文件和文件夹的主要布局。如果你在终端中继续执行 `cd ..`，或者在图形用户界面（GUI）上不断点击后退按钮直到无法再次移动，你就会遇到“根”（root）目录。这里的文件夹，如
    `bin`、`boot`、`usr` 等是你的硬件和设置配置所在。每个文件夹都有特定的用途和功能，你可以通过探索其内容来理解它们。例如，用户数据存储在 `home`
    中，但用户程序存储在 `usr` 中。由于文件系统实际上非常多样且复杂，此处将不再进行讨论，但如果你想了解更多，可以在网上搜索或阅读与你的操作系统相关的文档。


    ### Linux 的各种用例


    Linux 系统通常用于桌面之外的其他用途。由于其提供的强大和稳定性，专用机器运行着 Linux 的变体。甚至我们的汽车也运行着 Linux 内核，用于跟踪错误代码并帮助机械师。


    服务器通常安装 Linux，是因为其可靠性以及发行版内部包含的功能。例如，Linux 机器用作防火墙，因为 `iptables` 应用程序提供了优秀的端口拦截和智能过滤。你也可以通过该应用程序在你的系统上运行防火墙，从而免费获得企业级软件。通过这种方式，Linux
    也适用于网络。只需安装相关的应用程序，该机器就可以充当交换机、路由器、DNS 服务器、DHCP 服务器等。


    最后，Linux 系统不仅限于我们目前所看到的界面。每个发行版都有其偏好的桌面环境（DE），但界面可以根据个人的喜好进行极大的自定义。终端甚至有文件和网络浏览器，这对于那些使用
    `SSH` 或远程计算的人来说非常有帮助。总而言之，你应该尝试通过安装并配置不同的桌面环境来根据你的喜好进行调整。


    ## 接下来做什么与结论


    你如何继续取决于你想对你的 Linux 发行版做什么。对于普通浏览和简单使用，请继续使用 Ubuntu 并安装你需要的程序。对于更具冒险精神的人，可以考虑安装一个新的发行版，看看每个版本提供什么。希望更深入地学习
    Linux 的人可以安装如 `Arch` 或 `DSL` 等系统，从零开始构建自己的独特操作系统。管理员和高级用户可以安装发行版的服务器版本来构建自己的 Linux
    网络，或者他们考虑将环境从其他操作系统切换到完全免费的系统。


    结论是，Linux 是一套强大且相对易于使用的操作系统。但它们真正的潜力来自于难以精的终端和命令行功能。感谢阅读本出版物，希望它能为这个“事实上的替代操作系统”这一神秘主题提供一些启发。如果
    Linux 让你感到困惑或没有达到预期，我恳请你再次审视它能提供的功能。虽然它可能没有同等水准的游戏或第三方专有软件，但该操作系统足够简单且可定制，可以作为主操作系统，而将
    Windows 或 `OSX` 作为辅助操作系统。几乎每个程序都有替代方案，因此如果可能完全摆脱微软和苹果，强烈建议你这样做。再次感谢，并好好利用你的新 Linux
    知识。


