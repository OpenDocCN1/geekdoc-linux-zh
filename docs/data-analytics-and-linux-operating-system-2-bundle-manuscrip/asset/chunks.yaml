    据估计，企业仅使用了其收到的信息的 5%。这留下了巨大的改进空间，可以通过用于大数据分析的工具栈和实施来填补。首先，这涉及到对存储、计算、可视化软件和分析软件的需求。此外，还需要额外的人员，可能还会建立一个
    IT 部门。


    投资大数据能带来投资回报率（ROI）吗？简而言之，答案是肯定的。麦肯锡全球研究院预计，正确利用大数据的企业其运营利润可以提高 60% 以上，这是一个巨大的数字。


    以下是建议在组织中实施大数据的步骤：


    * 盘点所有相关数据资产

    * 转变管理模式以采用数据驱动的世界观

    * 开发技术实施

    * 处理包括数据安全、隐私和所有权的政策问题

    * 识别机会与风险


    数据安全尤为重要。数据库包含机密信息，可能是商业秘密、个人医疗信息，甚至是受版权保护的。数据应该是集中且安全的。由于数据量巨大，且维持此类做法需要大量的时间和人力，加密并非可选。数据库保护始于前面提到的第一步：盘点所有输入源。只有在分析了贡献源的范围后，企业才能确定哪些安全措施需要重新构建，以及哪些特定产品可以胜任工作。


    ## 第 3 章 数据管理的优势与挑战


    很久以前，企业主会看一个新产品，听取供应商的推销演示，并根据他们的“直觉”来决定是否购买该产品。就像带有邮局和加油站的杂货店，那种日子已经过去了。


    这是一个信息时代。企业必须跟上趋势、市场动态、消费者偏好和经济压力，以便就其市场定位做出适当决策。海量的可用信息需要受过教育的人员来熟悉且准确地解读提供的数据。


    克利夫兰的凯西储储立大学近期宣布，很快将短缺 19 万名分析人员和 150 万名数据经理。这个问题将主要影响中小型企业，因为它们无法在有限的预算内聘请专职数据分析师。


    根据《福布》杂志，去年具备大数据技能的信息技术项目经理需求增加了 123.6%，具备大数据技能的计算机系统分析师增加了 89.8%。


    （来源：[`http://www.forbes.com/sites/louiscolumbus/2014/12/29/where-big-data-jobs-will-be-in-2015/#2caeda00404a`](http://www.forbes.com/sites/louiscolumbus/2014/12/29/where-big-data-jobs-will-be-in-2015/%232caeda00404a)）


    即使企业能够获得数据分析能力，除了如何使用提供的信息外，企业仍面临挑战。其中一个挑战就是数据管理。


    数据管理是对数据和收集的信息进行组织化管理，以解决安全、访问限制和存储问题。数据管理要求的任务包括治理政策、数据库管理系统、数据系统集成、数据安全、源识别、数据隔离和存储问题。


    ## 有效数据管理的关键


    数据管理问题并不是新困境。只要数据被收集起来，企业一直在处理保持数据纯净这一性问题。现在，随着数据量的增加和营销自动化的发展，数据安全已成为问题领域的尖端。


    如果数据不干净或不相关，对营销和业务首席官来说毫无用处。数据管理需要持续的监控，因为黑客正等待攫取并破坏数百万相关的信息和资源。对于数据安全问题，很少是应该是自动化的，例如：


    ### 1. 限制访问


    很多时候，对材料和信息的访问对所有员工开放以进行修改。办公室经理、销售人员和办公室员工不应具有进入数据库并更改、访问、删除或添加信息的权限。控制这种情况的最佳方法是建立边界，即限制访问。


    根据特定功能设置控制措施，例如，营销人员仅限于查看市场数据而不能编辑。确定组织中由谁来执行所有数据更改，包括添加/删除和操作（如更改客户的联系信息）。建立数据导入和导出规则，以确保安全数据不会流出，且病毒不会被上传。创建数据主列表，使信息既不重复也不被破坏。


    ### 2. 创建数据地图


    数据地图是描述数据路径的流程图，勾勒出输入和输出、部门集成以及每个数据条目的用途。数据映射是一项持续的练习，用于维护控制和数据一致性。


    ### 3. 分段组织你的数据


    数据不在于数量，而关乎质量。如果你的客户只有数百人，数据库里有几百万个名字毫无用处。如果你没有检索组织，数据库里有几百个名字也没有帮助。


    相反，根据你的需求对数据进行分段。例如可以按性别、年龄、人口统计特征、邮政编码、联系偏好等。正确地细分数据库可以让数据产生潜力，而混乱的数据库看起来和感觉就像一团糟。


    从你目前的活跃客户群开始。将他们按人口统计特征分段，然后按购买习惯分段。定期与客户联系，收集他们对你产品和服务的意见。


    ### 4. 数据卫生


    数据卫生是保持数据清洁和实新的过程。旧数据和损坏的数据只会干扰你的数据库，甚至可能感染你所有的记录。与之前的功能一样，卫生应定期进行，以确保数据不会腐败或污染。


    维护纯净和有序数据库的重要性不容忽视。如果数据不好，即使联系点正确，所有的所有的营销项目也无法成功。为了增强营销和销售努力的价值，请不要忽视数据管理。


    ## 第 4 章 数据管理的现实案例


