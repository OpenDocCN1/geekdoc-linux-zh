    The prescription drug-monitoring program can inform prescribers (doctors and nurse
    practitioners) and dispensers (pharmacists) to establish controls for drug abuse
    and diversion of opioids, the major contributor to the aforementioned deaths.
    Celebrities only make up a small percentage of the yearly deaths attributed to
    drug overdoses. The US Centers for Disease Control and Prevention (the `CDC`)
    has established that it is the primary cause of accidental death in the United
    States. At the last published data analysis, it was determined there were over
    47,000 drug overdoses in 2014. Prescription pain killers were responsible for
    18,893 of those deaths.


    Source: [http://www.cdc.gov/nchs/data/health_policy/AADR_drug_poisoning_involving_OA_Heroin_US_2000-2014.pdf](http://www.cdc.gov/nchs/data/health_policy/AADR_drug_poisoning_involving_OA_Heroin_US_2000-2014.pdf)


    The names of these drugs are common prescriptions when one has surgery or a broken
    arm or just about any circumstance that requires a trip to the local hospital
    emergency room: `Percocet`, `Lortab`, `OxyContin`, `Fentanyl`, `Vicodin`, `Morphine`
    and `Xanax` are just a few examples. `Xanax` is a benzodiazepine, not a painkiller,
    but is lethal when ingested with an opioid, even at the minimal quantity of just
    one dose.


    For preventing this epidemic of drug overdose, the separate states have established
    databases to monitor prescriptions of the products. This database entails the
    dosage, the frequency the prescription is filled, and the prescribing doctor,
    in order to determine which patients may be diverting or mismanaging their dosages
    and which patients are frequenting different doctors and hospitals within a thirty-day
    period to acquire more drugs.


    The concept is great: Have one database that combines the data from various and
    multiple sources of pharmacies and medical personnel to combat the issue. Unfortunately,
    the database has several problems that prevent effective management.


    * Data is derived from multiple sources and is time-consuming and complex.

    * The data is incomplete as many physicians don’t take the time to consult the
    database. Although the installation of the system is mandatory in 49 states, only
    22 states require compliance, and no one is monitored for conformity.

    * There are too few personnel to conduct real-time analysis of the information.
    It is fed into the database but not retrieved effectively.


    Leading Data Analytics at `SAS Institute` have addressed the issue in the report
    `Data and Analytics to Combat the Opioid Epidemic`. Their take is that the information
    at present is almost unusable.


    Source: [http://www.sas.com/en_us/whitepapers/iia-data-analytics-combat-opioid-epidemic-108369.html](http://www.sas.com/en_us/whitepapers/iia-data-analytics-combat-opioid-epidemic-108369.html)


    With better analytics and interpretation physicians could develop improved treatment
    protocols, patient education and policy boundaries. For example:


    * Physicians can compare their treatments with their peers to determine specific
    patterns of early drug addiction.

    * Insurance and government payment systems can catalog the potential misuse or
    diversion, avoiding the expense costs of paying for fraud.

    * Larger hospital and public health systems could develop better educational programs,
    treatment protocols and resource decisions.

    * Pharmacies could compare their dispensing data to determine geographic overlap
    in abuse, among other factors.

    * States could utilize the database for funding treatment centers by demographical
    information.


    Combining and segmenting the data could work to alleviate macabre headlines by
    saving lives.


    ## An Example of Effectual Usage


    A famous mid-sized business owner found $400,000 by using `Data Analytics`. It
    seems that he had lost track 1,000 items of inventory, which was impeding his
    much desired cash-flow. The first day that he started his inventory, he saw the
    product that had not moved from the shelves.


    He initiated a huge warehouse sale and sold the entire stock in one weekend, increasing
    his cash flow by $400,000. This more than paid for the implementation of the new
    database and peripherals. With the quick and decisive move to sell the new-found
    inventory, the company has utilized their data in a positive fashion with immediate
    results.


    Previously this company had no `IT` department and did not have a `POS` system
    that traced product aging. He had money molding on the shelves. Once he had the
    database system installed, he was able to reduce older inventory by 40%, in addition
    to changing price points that were overblown, supplier costs, and profit margins.
    He also cleaned up the customer base with updated information, saving a substantial
    sum on postage and printing costs. With his new information, he can target the
    purchasers of the product to upgrade their sales rather than broadcasting mail
    to uninterested households. This company also uses their data to offer special
    discounts to their loyal and top customers, which generates income through upselling.


    ## Chapter 5: The Different Types of Data Analytics


    Big data is such a buzzword there is a misconception of what it is and what it
    does. The uses of `Big Data` are tremendous: fraud detection, competitive analysis,
    consumer preference analysis, traffic management, call center optimization, managing
    utility power grids, and managing warehouse and inventory, just to name only a
    few. Big data itself is problematic because it is the business intelligence code
    word for data overload.


    There are three V''s of Big data:


    1. Too much data, or volume

    2. Too much speed; the data is moving so quickly it cannot be analyzed, or velocity

    3. Too much information from too many sources, or variety


    Even though the collection and assimilation of big data is daunting, the business
    intelligence that is derived from big data can aid a business immensely.


    ### Four Kinds of Big Data Business Intelligence


    There are four kinds of big data business intelligence that are particularly helpful
    for business owners:


    1. `Prescriptive`

    2. `Predictive`

    3. `Diagnostic`

    4. `Descriptive`


    #### Prescriptive Analysis


    Prescriptive analysis is the most valuable analysis because it informs the business
    what steps should be taken to improve the situation. The use of this data can
    be the beginning of change for the organization. Even though it is considered
    the most valuable, it is the least used as barely 3 percent of the organizations
    reported to use big data. Companies could use prescriptive analysis to give specific
    issues to isolated problems, such as in the health care industry and the problem
    of diabetes and obesity. Big data could identify the obese patients with both
    diabetes and high cholesterol, three contributing factors in the development of
    heart disease. These patients could be targeted immediately to initiate a four-fold
    attack on the risk factors through diet, diabetes education exercise encouragement
    and cholesterol monitoring. At present, the issues are addressed by different
    specialists, if they are even addressed at all. Combining treatment strategies
    would be much more effective and the combination of information could be compiled
    through prescriptive analysis.


    #### Predictive Analysis


    Predictive analysis is the prediction of possible scenarios derived from the analysis
    of the information. This is usually in the form of a business forecast. This form
    of analysis looks at the past to foretell the future. For example, the business
    might look at the previous Christmas sales to predict the future Christmas potential
    sales for a particular product. Predictive analysis is especially useful in marketing
    and sales departments to mimic previous campaigns that were successful. Some businesses
    are using predictive analysis to examine the sales process, from customer introduction,
    communications with the customer, the lead to the customer, the sale to the customer,
    the closing of the sale, and the follow-up communications.

