    rapidly moving marketplace, and stay well ahead of the competition.


    To use the data correctly and quickly, analyzing the data with these tools will
    bring clarity and innovative suggestions.


    Begin with Measuring, determines which analytics will be most helpful for decision
    making within the firm.


    Diagnose the problems that have occurred with customer satisfaction or product
    placement. Why has something happened in an adverse way? Data analytics can help
    you locate the specific issue for a satisfying solution.


    Predict and Optimize to forecast changes and the potential consequences of the
    change. Use the "if"…"then" method of questioning. (If I make this change with
    customer service how can I then anticipate the reaction?) This analytical technique
    helps to determine the direction of the organization and the best route to sustain
    continued growth.


    Operationalize, or placing the information into use by the front-line workers,
    sales staff, engineers, marketers, managers and the remaining decision makers.
    This is the transition from analysis to usefulness, leaving the laboratory and
    moving into real-world experience.'
