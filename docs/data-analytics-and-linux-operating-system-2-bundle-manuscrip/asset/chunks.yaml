  trans: "\n接上高级终端概念，让我们来聊一些可以在终端中节省时间的实用提示和技巧。在输入命令或文件名时，输入到一半按下 Tab 键。这项功能称为“Tab\
    \ 补全”，它会猜测你尝试输入的内容并填充短语的剩余部分。对于文件，它将按照目录显示的方式完成名称，或者根据你正尝试的操作来补全命令。Linux 专家和任何经常使用终端的人看起来似乎是以极高的准确性和速度精确地输入着他们想要的内容，但他们实际上只是在使用\
    \ Tab 补全功能。\n\n用户（尤其是管理员）会在 `sudo` 命令上花费大量时间，因为他们的指令需要提权才能运行。但当你输入一个很长的命令却忘记输入\
    \ `sudo` 时，你会因为必须再次输入它而感到愤怒。相反，只需输入 `sudo !!`，它是“超级用户再次执行”的缩写。这慷慨地避免了重新输入整个命令。\n\
    \n重复执行命令的另一种方法是使用向上和向下方向键。连续按向上键可以循环之前输入过的命令。你还可以使用左、右方向键编辑命令，更改其中包含的文本。\n\n最常用的终端提示涉及复制和粘贴。尝试将一行粘贴到终端会产生奇怪的字符\
    \ `^v`。键盘快捷键没有配置在终端中工作，这就是为什么会显示这种奇怪的组合。要实际粘贴，右键点击并选择该选项；或者使用组合键 `shift+insert`。复制也是一样的方法，但要用\
    \ `ctrl+insert`。虽然从网上复制粘贴终端命令可能是可以的（前提是你理解其中的风险并知道它们在命令中在做什么），但不要尝试从本文中粘贴。通过你阅读它时所在的媒介引入的格式可能插入了终端无法识别的特殊字符，因此最好不要复制粘贴，而是应该手动输入呈现的任何命令。\n\
    \nLinux 有一个许多用户不知道的隐藏功能。当你访问该目录或输入 `ls` 时，文件会显示给用户，但实际上并不是所有文件都能这种方式查看。在 Linux\
    \ 中，如果你以点作为开头命名文件，它将被标记为隐藏。隐藏文件通常对普通用户不可见，它作为一种保护配置文件免受意外编辑/删除等的方法。要查看这些文件，我们只需要在\
    \ `ls` 搜索中添加 `-a` 标签。在 GUI 中，在目录中按 `ctrl+h` 即可显示隐藏内容。当你创建脚本和其他配置文件时，考虑使用点来隐藏它们，作为一种用户保护的形式。\n\
    \n终端中的任何命令都可以通过 `ctrl+d` 组合键中断或退出。使用它来停止长时间进程，或退出你不理解的程序/命令。\n\n### 别名 (Aliasing)\n\
    \n别名（Aliasing）是在终端内创建个人快捷键的方法。与其输入长命令或一组小命令，不如使用别名将它们合并成单一的用户定义选项。正如其名所意，别名是你指定的任何内容的不同名称。每个别名都包含在一个隐藏的配置文件中——使用\
    \ `nano ~/.bashrc` 开始编辑它。因为它存在于用户的家目录下，因此每个别名将只适用于该用户。在文件的底部，我们可以按照示例开始创建别名：\n\
    \n```bash\nalias gohome='cd ~ && ls'\n```\n\n此别名将通过输入 `gohome` 将目录更改到家并显示内容。在创建别名时，你必须严格遵循上述格式，这意味着命令和等号之间没有空格。多个命令在单引号内部通过\
    \ `&&` 连接起来。为了获得更健壮的别名，请添加函数。\n\n下面的示例将 `cd` 和 `ls` 合并为单个命令。\n\n```bash\nfunction\
    \ cdls () {\n    cd \"$@\" && ls\n}\n```\n\n写完别名后，保存文件并重启电脑。你的新命令随后就可以使用了。\n\n\
    我们编辑的那个文件 `.bashrc` 是 Ubuntu 终端的配置文件。除了制作别名，我们还可以用它来自定义终端设置，例如颜色、大小等……一个快速提示是通过删除\
    \ `#` 来取消注释 `#force_color_prompt=yes`，并确保 `yes` 在等号之后。这为终端添加了颜色，使单词显示不同的颜色。当你打开终端时，右键点击它，选择“配置\
    \ (profiles)”然后选择“配置偏好 (profile preferences)”。通过这里的选项卡，你可以自定义字体、大小、颜色、背景颜色等。如果你打算频繁使用终端，建议对其进行自定义，因为这有助于让你对将要使用的工具感到舒适。\n\
    \n### I/O 重定向 (I/O Redirection)\n\n在正常的终端命令执行期间，“正常输入”（用户输入，或从文件/属性/硬件读取）被命令输入并解析。有时命令还有“标准输出”，即在终端中显示的返回文本。在\
    \ `ls` 中，标准输入是当前工作目录，标准输出是文件夹的内容。\n\n输入和输出通常是直接的，但通过使用 I/O 重定向，我们可以让终端完成更多。例如，`cat`\
    \ 命令（连接）后跟一个文件会将该文件输出到屏幕。单独运行 `cat` 会打开一个解析器，其中输入的任何行都将立即输出（使用 `ctrl+d` 退出）。但通过\
    \ I/O 重定向快捷键（`<`, `>`, `<<`, `>>`, `|`），我们可以将输出重定向到另一个源，例如文件。`cat > test.txt`\
    \ 现在将把标准输出放入该新文件中。双符号表示追加，因此 `cat >> test.txt` 将将输出置于文件末尾，而不是覆盖开头的内容。\n\n竖线字符或“管道\
    \ (pipe)”使用了 I/O 重定向的另一种形式，将一个命令的输出直接插入到另一个命令的输入中。`ls | sort –r` 将获取 `ls` 的输出并反向排序。我们重定向了输出并将其交给另一个命令来完成操作。\n\
    \n最后，`grep` 命令在 I/O 重定向中被频繁使用。`grep` 可以在指定文件中搜索特定字符串并将结果返回到标准输出。通过重定向，此输出可以放入其他命令中。注意\
    \ Linux 的一个有趣特点是一切皆文件，甚至是硬件也是。所以我们的 CPU 实际上是一个存储相关数据的文件，我们可以使用 `grep` 和其他工具对其进行搜索。那个示例相当高级，但这里有一个更简单的实例：\n\
    \n```bash\ngrep Conclusion report.txt\n```\n\n它将在文件中搜索那个特定单词。由于有所有新符号和命令，I/O 重定向可能会变成一个复杂的过程，但它是你可以整合到脚本和日常使用的一个功能，通常允许在单行内完成\
    \ Linux 的某些特性和功能。\n\nLinux 和终端是难以完全掌握的概念。但通过练习和持续的努力，你将能够完成大师级的计算操作，并执行在 Windows\
    \ 或 OSX 中无法实现的有用任务。学习更多命令及其使用方法对这方面非常有帮助，因此请继续学习新命令及其用法。你唯一真正需要记忆的命令是 `man`，该命令会显示任何其他指定命令的手册页和文档。利用这个工具的优势，对你的系统建立深入了解。\n\
    \n### 更多 Linux 信息\n\n"
- fmt: '

    To continue learning about Linux and the possibilities it can provide, consider
    the examples in this section. It will briefly discuss more uses for Linux, and
    a few other concepts that have yet to be talked about.


    ### The Linux File System


    The “Linux file system” refers to the main layout of the files and folders on
    your computer. If you continue to `cd ..` in the terminal, or if you click the
    back button on the GUI until it goes no further you will stumble upon the “root”
    directory. The folders here, `bin`, `boot`, etc, `usr`, and so on are how your
    hardware and settings are configured. Each folder has a specific purpose and use,
    and you can understand them by exploring the contents. As an example, user data
    is stored in `home`, but user programs are stored in `usr`. Because of how diverse
    and complicated the file system actually is it will not be discussed here, but
    if you wish to learn more do an Internet search or read the documentation associated
    with your operating system.


    ### Various Use Cases for Linux


    Linux systems are often used for purposes other than desktop use. Dedicated machines
    run variants of Linux because of the power and stability it provides. Even our
    cars have a Linux kernel running to keep track of error codes and help mechanics.


    Servers often have Linux installed because of reliability and the functions the
    distributions have within them. For instance, Linux machines are used as firewalls
    because the `iptables` application provides excellent port blocking and intelligent
    filtering. You yourself can run a firewall on your system with the application
    as well, thus gaining business-level software for free. In this way, Linux is
    also great for networking. The machine can act as a switch, router, DNS server,
    DHCP server, and more just by installing the relevant applications.


    And finally, Linux systems are not limited to the interfaces we have seen insofar.
    Every distro has its preferred desktop environment, but the interface can be extremely
    customized to the individual’s preference. There are even file and web browsers
    for the terminal, which is greatly helpful for those using `SSH` or remote computing.
    All-in-all, you should try out different DE’s by installing them and configuring
    them to your liking.


    ## What Next and Conclusion


    How you continue depends on what you want to do with your Linux distribution.
    For casual browsing and simple use, continue with Ubuntu and install the programs
    you need. For more adventurous people, consider installing a new distribution
    to see what each has to offer. Those wishing to learn even more deeply about Linux
    can install one such as `Arch` or `DSL` to build their own unique OS from scratch.
    Administrators and power users can install a server version of a distro to build
    their own Linux network, or they can consider changing over their environment
    from other operating systems to entirely free ones.


    Conclusively, Linux is a powerful and relatively easy to use set of operating
    systems. But their real potential comes from the hard-to-master terminal and command
    line functions. Thank you for reading this publication, and I hope that it has
