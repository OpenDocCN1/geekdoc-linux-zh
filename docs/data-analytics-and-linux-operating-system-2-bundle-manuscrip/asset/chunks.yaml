- fmt: "\n# Diagnostic Analytics\n\nDiagnostic analysis focuses on past predicaments\
    \ to discern the who, what and why of a situation. This analysis can use an analytic\
    \ dashboard, or widgets that help the reader see at a glance the information at\
    \ hand. An example of use of diagnostic analytics could be examining a sales campaign\
    \ or a social media marketing campaign. With the `widgets`, one could see the\
    \ number of posts, the number of visitors, the quantity of comments and likes,\
    \ the page views and the feedback from the customer. Seeing these analytics at\
    \ a glance instead of paging through reports brings a faster grasp of the salient\
    \ points of the data. Utilizing diagnostic analytics will explain the failure\
    \ of a marketing campaign to increase sales of a specific product.\n\n# Descriptive\
    \ Analytics\n\nThis type of analytics gives real-time data on the current situation.\
    \ Instead of giving last week's or even yesterday's data, this information is\
    \ happening now. An example of the usage of descriptive analytics is pulling the\
    \ current credit report for a customer desiring to purchase a new car. Examining\
    \ the past behavior to assess the current credit risk and predict the future credit\
    \ profile would help the sales manager determine if the potential customer can\
    \ or will fulfill the credit contract.\n\nBig data analytics will bring certain\
    \ value to a company for the ROI because it fills in the blanks regarding customer\
    \ performance and product sales. By reducing the enormity of big data into manageable\
    \ chunks of information, a business owner can make better business decisions regarding\
    \ staffing, sales, profits, and product variances.\n\n# Chapter 6: They all Work\
    \ Together: Data Management, Data Mining, Data Integration and Data Warehousing\n\
    \nThe terms for Big Data are many; this section of the book identifies the most\
    \ useful terminology when addressing the logistics of big data.\n\n## Data management\n\
    Data management is the process of placing restrictions on the access and quality\
    \ of data that flows in and through and out of an organization. Restrictions may\
    \ include limited access, security measures to prevent viruses and corrupted data,\
    \ and maintenance issues.\n\n## Data mining\nData mining is the process of sifting\
    \ through the data to extract patterns and relevant information to solve the current\
    \ issues in the business. Using software, data mining will take all the chaos\
    \ out of the voluminous data.\n\n## Hadoop\nThis is open source software (meaning\
    \ it's free!) to store data and run discriminating applications on commodity hardware.\
    \ It is key to sifting the multiples of data information that is bombarding the\
    \ data sets. It is known for the speed for which it processes data.\n\n## In-memory\
    \ analytics\nBy investigating information from framework memory (rather than from\
    \ your hard plate drive), you can get prompt bits of knowledge from your information\
    \ and follow up on them rapidly. This innovation can expel information prep and\
    \ investigative handling latencies to test new situations and make models; it's\
    \ not just a simple route for businesses to stay agile and settle on better business\
    \ choices, it likewise empowers them to run iterative and intelligent examination\
    \ situations.\n\n## Predictive analytics\nPredictive analytics uses, statistical\
    \ algorithms, machine-learning techniques and data to identify the predictive\
    \ outcomes based on previous patterns of usage. It's about giving a best evaluation\
    \ on what will happen later, so businesses can feel more assured that they're\
    \ settling on the best business choice. The most common and basic utilizations\
    \ of predictive analytics incorporate misrepresentation and fraud, risk management,\
    \ operations management and marketing functions.\n\n## Text mining\nIn utilizing\
    \ text mining technology, the business you examine text data from the world wide\
    \ web, comments, articles and other text sources to uncover insights that were\
    \ previously unseen. Text mining incorporates machine learning and language processing\
    \ to evaluate and sort web documents like blogs, feeds, intelligence on competitors,\
    \ emails, comments and surveys to assist the business in analyzing quantities\
    \ of information and discover tangents and hidden relationships.\n\n## Data integration\n\
    Data integration is the combination of adding new information and data to an old\
    \ computer system while keeping the data both clean and uncorrupted in content.\
    \ Moving data effectively has become a challenge for businesses in the following\
    \ areas:\n\n*   **Data Needs**\n    Delivering the correct data in the required\
    \ format to alleviate the business needs is the primary reason for the integration\
    \ of data. Every new source of data can impact the previous collection of information\
    \ and systems to which it migrates.\n*   **Anticipating the Needs of the Business**\n\
    \    Data is not helpful if it is not available in a timely fashion. Integration\
    \ must be adequate to manage both batches of information and real-time.\n*   **Confirm\
    \ all Data is Stamped with Pertinent Information**\n    Old systems did not time\
    \ stamp or date activity in the server. For quick identification of the changes\
    \ made to the data, the data integration needs to record this information.\n*\
    \   **Be Suspicious of All Incoming Data**\n    It is natural to anticipate data\
    \ from other sources, but be suspicious that it may be infected or other corrupt.\
    \ Scan everything that comes in for compatibility and integration needs.\n*  \
    \ **Validate Customer Information**\n    Compare incoming data to the master database\
    \ to confirm the customer database is correct and current.\n*   **Keep a History\
    \ of Every Change**\n    There is always a need to backtrack changes sometimes\
    \ for statutory compliance and often when integration doesn't work as anticipated.\n\
    *   **Upgrade the Systems and Evaluate the Process**\n    Constantly look for\
    \ ways the system may be deficient for your business needs. Upgrade the systems\
    \ regularly to ensure you have the best possible solution to your data management\
    \ and integration needs.\n\n## Data Warehousing\nData warehousing is the storage\
    \ of electronic data by the organization for which it is prepared. Data must be\
    \ stored so that it is reliable, uncompromised, secure, easily retrievable and\
    \ easily managed.\n\n# Chapter 7: Conducting Data Analysis for Your Business\n\
    \nWe have stressed throughout this book the need for data analysis in the business\
    \ enterprises, but we have yet to explain exactly how to collect data. This chapter\
    \ will focus on basic data collection so that you can implement a strategy that\
    \ will further your organizational goals.\n\n## A Step by Step Guide\n\n### What\
    \ is Collecting Data?\nBasically, gathering collected data implies putting your\
    \ configuration for gathering data into operation. You've chosen how you're going\
    \ to get data – whether by direct perception, interviews, overviews, investigations\
    \ and testing, or different techniques – and now you and/or different spectators\
    \ need to actualize your arrangement. There's more to gathering information, be\
    \ that as it may. You'll need to record the information in suitable ways and sort\
    \ the data so it's ideally helpful.\n\nThe way you gather your information ought\
    \ to identify with how you're wanting to dissect and utilize it. Despite what\
    \ strategy you choose to utilize, recording ought be done simultaneous with information\
    \ accumulation if conceivable, or soon thereafter, so nothing gets lost and memory\
    \ doesn't blur.\n\nSome of the functions necessary for useful data collection:\n\
    \n*   Assembling data from all sources.\n*   Computing any numerical or comparative\
    \ operations expected to get quantitative data prepared for examination. These\
    \ might, for example, entering numerical perceptions into a diagram, table, or\
    \ spreadsheet, or figuring the mean (normal), middle (midpoint), and/or mode (most\
    \ every now and happening) of an arrangement of numbers.\n*   Coding information\
    \ (deciphering information, especially subjective information that isn't communicated\
    \ in numbers, into a structure that permits it to be handled by a particular programming\
    \ project).\n"
