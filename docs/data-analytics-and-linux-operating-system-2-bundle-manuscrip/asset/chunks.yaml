  trans: "\n通信的第一步是安装 `samba` 软件包。你可以通过软件中心找到它，或者输入 `sudo apt-get install samba` 来获取并安装必要的软件。\n\
    \n从你的 Ubuntu 向其他电脑共享文件需要创建一个 `samba` 共享。Samba 运行的协议与其他流行的文件共享方法相同，因此从 Ubuntu 机器共享的文件可以轻松地在\
    \ Windows 上看到。安装 samba 后，使用 `sudo nano /etc/samba/smb.conf` 开始编辑配置文件。在文件的最底部添加以下几行：\n\
    \n```\n[share]\n    comment = File Share from Ubuntu\n    path = /srv/samba/share\n\
    \    browsable = yes\n    guest ok = yes\n    read only = no\n    create mask\
    \ = 0755\n```\n\n现在，创建 `path`指定的文件夹（`sudo mkdir -p /srv/samba/share`）并设置权限（`sudo\
    \ chown nobody:nogroup /srv/samba/share/`），以便任何人都能访问其内容。将任何你想共享的文件放入该目录，然后重启服务（`sudo\
    \ restart smbd`，`sudo restart nmbd`）使共享生效。最后，登录到你的其他电脑并导航到网络共享。在 Windows 中，它们将出现在文件管理器的左侧面板。如果共享没有自动出现，在文件路径框中输入\
    \ IP（使用 `ifconfig` 查找 Ubuntu 的 IP）。你现在可以从其他操作系统访问 Ubuntu 的文件了。\n\n你可能还需要在 Ubuntu\
    \ 电脑上查看其他操作系统的文件。首先，打开 Ubuntu 文件管理器。从菜单栏点击 `files`（文件），然后选择 `connect to server`（连接服务器）。在结果框中，输入你想访问的共享\
    \ URL。它可以是一个 ftp 地址（`ftp://ftp.test.com`）、http 地址（`http://test.com`）或共享地址（`smb://share/Folder`）。无需任何额外的硬件或设置，你就可以这种方式查看文件。\n\
    \n最后，加入如 Active Directory 等域允许你的电脑与网络上的其他操作系统交互，并实现其他面向业务的任务。无论你拥有的是小型家庭网络，还是正在将\
    \ Linux 电脑加入公司域，过程都是相同的。安装几个额外的软件包（`realmd`、`sssd`、`sssd-tools`、`samba-common`、`samba-common-bin`、`samba-libs`、`krb5-user`、`adcli`、`packagekit`）。在安装过程中，它会询问你的域名。用全大写输入。输入\
    \ `kinit -V adminname`，将其替换为域中的实际管理员账户名。输入密码后，你就通过了域的身份验证。现在通过 `realm --verbose\
    \ join -U adminmame domainname.loc` 完成加入。\n\n如果失败，意味着我们设备上的 DNS 配置错误。输入 `echo\
    \ ‘ad_hostname = nix01.domainname.loc' >> /etc/sssd/sssd.conf`，然后输入 `echo ‘dyndns_update\
    \ = True' >> /etc/sssd/sssd.conf`，最后使用 `service sssd restart` 使用新设置重启。第一行设置了我们电脑的\
    \ FQDN，因此该行需要根据我们的域设置进行更改。在配置正确设置并成功重启后，终端将声称已加入域。使用 `realm list` 测试这一点。现在连接到\
    \ AD 后，你就可以从服务器管理 Linux 设备了！\n\n但对于大多数用户来说，创建共享和加入域远远超过了连接需求。简单的文件共享通过 USB 驱动器传输或如\
    \ Dropbox 等服务完成更好。事实上，Dropbox 可以安装在三大操作系统上，并且可以在无需额外设置的情况下在它们之间同步文件。在 Ubuntu 上，你可以直接从网站下载\
    \ `.deb` 文件、从软件中心安装它，或使用 `sudo apt-get install nautilus-dropbox` 获取该应用程序。在 Dropbox\
    \ 文件夹中，放置任何你想在电脑之间传输的文件，它将自动在你拥的所有其他 Dropbox 电脑上下载并更新。\n\n当你将它们连接时，使用其他操作系统并不复杂。只要电脑位于同一网络，你就可以创建文件共享、将它们加入域，或使用像\
    \ Dropbox 这样的服务。\n\n## 有用的应用程序\n\n以下适用于你 Ubuntu 系统的最佳应用程序列表，它们将帮助你充分利用电脑。\n\n\
    -   **办公生产力**：Abiword, VI, Emacs, LibreOffice, nano\n-   **多媒体**：VLC, DeaDBeef,\
    \ Cmus, AquaLung, MPlayer, Miro\n-   **网页浏览**：Firefox, Chromium, Midori, W3M\n\
    -   **创意**：Aud, acity, GIMP\n-   **其他**：Kuper, Thunderbird, qBittorrent\n\n对于有助于易用性的程序，有许多不同的选择，这取决于你尝试实现什么。发现程序的最佳方法是在互联网上搜索你想要添加的功能。例如，如果你在寻找一种快速打开和关闭终端的方法，你可能会遇到\
    \ `Guake` 程序。或者如果你想在终端中使用音频，它可能会推荐 `Cmus`。寻找适合你的完美应用程序是 Linux 的一部分，它让每次安装都变得更有意义。\n\
    \n## 管理\n\n如果你在寻找某种 `Control Panel`（控制面板），你可以从 `Settings`（设置）中找到网络、打印、外观等管理管理工具。某些\
    \ Ubuntu 变体使用 `Settings Manager`（设置管理器）或 `Settings` 实现相同的目的。\n\n启动它后，将会有指向配置应用程序的链接；只需点击任何想要更改为\
    \ GUI 的项即可。但并不是所有内容都能通过 GUI 找到。大多数低级设置只能通过命令行可用，因此你需要确切知道要输入什么。\n\n例如，在 Ubuntu\
    \ 中添加新用户需要 `adduser` 命令。在命令后加上用户名，终端会提示基本信息和密码。将该新用户设置为管理员使用 `usermod -aG sudo\
    \ nameofuser` 完成。此外，可以使用 `deluser` 删除用户。这些选项在 GUI 中很难找到，但在终端几秒钟即可完成。\n\n`Task\
    \ Manager`（任务管理器），或 Ubuntu 内运行应用程序的管理也通过终端完成。`top` 程序标准安装在所有发行版中（大部分），启动它会显示任务管理器的运行进程列表。但默认情况下，进程列表将更新并移动，可能难以阅读数据。按\
    \ `f` 键调出排序列表，用方向键导航到 `PID` 并按 `s` 设置该选项。现在使用 esc 键返回 top，我们现在可以使用向上翻页和向下翻页键滚动列表。假设，我们想关闭\
    \ `Pidgin` 程序，因为它没有响应。在列表中找到它（或使用上述的过滤命令搜索它）并记下 PID（进程 ID）数字。按 `q` 退出 top，然后输入\
    \ `kill 4653`，显然将数字替换为 PID。在 top 内的任何时候，你都可以按 `h` 查看各种操作的快捷键列表。如果认为 `top` 太难用，考虑安装\
    \ `htop`，它是该程序的 `人类可读` 版本。它实际上显示了详细说明 CPU、内存和其他使用统计数据的整洁 ASCII 图表。使用 F3 搜索程序，然后使用\
    \ F9 和回车杀死它。\n\n"
- fmt: "\n# Services\n\nAs for services, you might have noticed we use the `service`\
    \ command to change their status. Starting a web server would be done with `service\
    \ apache2 start`, restarting it done by replacing `start` with `restart`, and\
    \ stopping it by replacing `start` with `stop`. Finding a list of services is\
    \ done with `service --status-all`. Services are daemons, or background tasks\
    \ that are continuously running. They can be gathering data, running a service\
    \ such as `Bluetooth` and `Wi-Fi`, or waiting for user interaction.\n\n## Security\
    \ Protocols\n\nLinux has a focus on security in general, which contributes to\
    \ its use in corporate and server settings. Taking advantage of the security protocols\
    \ means that you are more secure than other operating systems and less likely\
    \ to have your computer compromised. This requires good security principals, of\
    \ course, and always being safe online. A computer without a password is hardly\
    \ protected at all. \n\nOne feature brought over from `UNIX` is file permissions.\
    \ Every file has a set of permission- the owner, group, and rights. The command\
    \ `chown` changes the owner of a file, `chgrp` changes the group, and `chmod`\
    \ changes the rights associated with the file. Discovering the permissions of\
    \ a file or folder is done by typing `ls -l filename`. It will return an initially\
    \ confusing line such as `- rw- rw- r--`. `R` means read, `W` stands for write,\
    \ and the third option is `X` for execute. The three sets are respectively owner,\
    \ group, and other. So our example file above has read and write permissions set\
    \ for the owner and its group, but only read permissions for other users. This\
    \ means that the owner and the group he belongs to (most likely `sudo` users)\
    \ have permission to both access the file and change its contents, but other users\
    \ on the network or PC can only view the contents and not edit it. Script files\
    \ will need to have the `X` in order to be executed, and without it they cannot\
    \ be run. \n\nMost people will only need to use the `chmod` command to change\
    \ the permissions of files they wish to use. We use the command and a set of numbers\
    \ to set the permission of the file. `chmod 777 test.sh` makes the file readable,\
    \ writable, and executable by all users anywhere because each specification (owner,\
    \ group, other) has the number `7` attached to it. Numbers determine the permissions\
    \ that entity has, and the number used is calculated like so:\n\n- Start with\
    \ the number `0`.\n- Add `4` for adding readability.\n- Add `2` for write-ability.\n\
    - Add `1` for executable-ness.\n- The number you have left determines the permissions.\n\
    \n`6` would be read/write, but `1` would only be executable. `5` would be readable\
    \ and executable, but not changeable. In our `777` example, we set owner, group,\
    \ and others to all be `7`. This is not particularly good security, because that\
    \ means anybody anywhere can mess with that file. A more conservative permission\
    \ set would be `775`. Use security permissions advantageously for secure computing.\n\
    \nSecurity within Linux expands beyond just permissions. Ensure that you practice\
    \ good security practices, and that you are following common sense in regards\
    \ to security- install only needed programs, do not follow all internet... [Note:\
    \ The text continues for brevity as per the prompt's provided flow, but I will\
    \ maintain the formatting rules for the entire provided block].\n\n## Scripting\n\
    \n`Bash` is a programming language. To use it, create a script and name it.\n\n\
    ```bash\n#!/bin/bash\n```\n\n```bash\necho \"Hello World\"\n```\n\n```bash\nls\
    \ -l\n```\n\n```bash\nchmod 777 test.sh\n```\n\n```bash\nsudo crontab -e\n```\n\
    \n```\n0 12 * * * ~/script.sh\n```\n\n```\n30 18 25 12 * /usr/bin/scripts/test.sh\n\
    ```\n"
  raw: 'As for services, you might have noticed we use the “service” command to change
    their status.  So starting a web server would be done with “service apache2 start”,
    restarting it done by replacing start with restart, and stopping it by replacing
    start with stop.  Finding a list of services is done with “service –-status-all”.
    Services are daemons, or background tasks that are continuously running.  They
    can be gathering data, running a service such as Bluetooth and Wi-Fi, or waiting
    for user interaction.


    Security Protocols


    Linux has a focus on security in general, which contributes to its use in corporate
    and server settings.  Taking advantage of the security protocols means that you
    are more secure than other operating systems and less likely to have your computer
    compromised.  This requires good security principals, of course, and always being
    safe online.  A computer without a password is hardly protected at all.


    One feature brought over from UNIX is file permissions.  Every file has a set
    of permission- the owner, group, and rights.  The command “chown” changes the
    owner of a file, “chgrp” changes the group, and “chmod” changes the rights associated
    with the file.  Discovering the permissions of a file or folder is done by typing
    “ls -l filename”.  It will return an initially confusing line such as “- rw- rw-
    r--”.  “R” means read, “W” stands for write, and the third option is “X” for execute. 
    The three sets are respectively owner, group, and other.  So our example file
    above has read and write permissions set for the owner and its group, but only
    read permissions for other users.  This means that the owner and the group he
    belongs to (most likely sudo users) have permission to both access the file and
    change its contents, but other users on the network or PC can only view the contents
    and not edit it.  Script files will need to have the X in order to be executed,
    and without it they cannot be run. 


    Most people will only need to use the “chmod” command to change the permissions
    of files they wish to use.  We use the command and a set of numbers to set the
    permission of the file.  “chmod 777 test.sh” makes the file readable, writable,
    and executable by all users anywhere because each specification (owner, group,
    other) has the number 7 attached to it.  Numbers determine the permissions that
    entity has, and the number used is calculated like so:


    *   Start with the number 0.


    *   Add 4 for adding readability.


    *   Add 2 for write-ability.


    *   Add 1 for executable-ness.


    *   The number you have left determines the permissions.


    6 would be read/write, but 1 would only be executable.  5 would be readable and
    executable, but not changeable.  In our 777 example, we set owner, group, and
    others to all be 7.  This is not particularly good security, because that means
    anybody anywhere can mess with that file.  A more conservative permission set
    would be 775.  Use security permissions advantageously for secure computing.


    Security within Linux expands beyond just permissions.  Ensure that you practice
    good security practices, and that you are following common sense in regards to
    security- install only needed programs, do not follow all internet advice, do
    not use sudo too often, use passwords, use encrypted networks, keep software up
    to date, encrypt important files, and make regular backups.  As a final word of
    advice, look into using a distribution with SELinux, a module that supports AC
    and other security policies.  


    Scripting


    Bash is the “programming language” or the terminal.  When we type a command, we
    are doing so within bash.  A script is a list of bash commands that execute in
    order, meaning we can create a script with a list of commands and run it to save
    time or automate terminal tasks that we normally have to type.  As an intermediate
    and advanced Linux administrator, you can use scripts to greatly shorten the amount
    of work required for repetitive or constantly running tasks. 


    To start a script, create a new file “script.sh” within nano.  The first line
    must always be “#!/bin/bash” to mark it as a bash script.  Type the following
    lines for your first script.


    echo “What is your name?”


    read name


    echo “Hey, $name. Here is your current directory, followed by the files.”


    Pwd


    Ls


    Save the script.  Now we have to set the permissions to allow it to be run.  Use
    “sudo chmod 777 script.sh”, and then run the script with “./script.sh”.  So long
    as you copied the script exactly, it will ask for your name and then show you
    your directory and files.  Take the concept and expand it further in your own
    scripts.  You can run commands from installed programs as well, so you can write
    a script that automatically joins a domain, or one that connects to the network
    specified.  Shutting down remote computers is a great automatic task as well.


    Scripts can either be run manually or set to execute at certain times.  To run
    a certain script every time the user logs in, open the “startup applications”
    program from dash and create a new app with the script as the source.  Now every
    time that user logs in the script will run automatically.  This is useful for
    setting up certain options or starting background services without requiring the
    user to do it themselves. 


    Scheduling tasks for a certain time can be done with the Cron system daemon. 
    It is installed be default on some systems, but if not “sudo apt-get install cron”
    can be used.  Start the service with “service cron start” and create a new crontab
    file with “crontab -e”.  Select nano as your text editor.  At the bottom of the
    created file, add a new line with our scheduled task.  The format goes as follows:


    minute, hour, day, month, weekday, command


    And we format it with these options to specify when to run the command.  Time
    numbers start with 0, so the hours range from 0 to 23 and minutes are from 0 to
    59.  Replace any option with an asterick to specify that it will run on any value. 
    Pay attention to these examples:


    0 12 * * * ~/script.sh


    This will run the script.sh found in the Home directory every day at noon.


    30 18 25 12 * /usr/bin/scripts/test.sh


    And this will run test.sh within the /usr/bin/scripts directory at 6:30 on Christmas
    day every year. 


    Conclusively, scripting and automating scripts are fantastic ways to take administrative
    control of regularly occurring tasks.  Continue writing scripts, or look up examples
    online to see how your computing experience can be made easier with bash. 


    Advanced Terminal Concepts


    Mastering Linux comes down to intimate comprehension of the tools available in
    the OS and how to utilize them.  Many of the topics discussed in this chapter
    will focus on more tasks and how to accomplish them, or a few QOL improvements
    to the OS in general.


    Compression and decompression of files often confuses Linux beginners.  The tools
    are typically already installed, but the command line must be used.  Furthermore,
    the strange .tar and .gz file-types are Linux-specific formats that you might
    often come across.  All files can be unzipped or zipped with the gzip tool.  Preinstalled
    on Ubuntu, we access it with the “tar” command.  To compress a folder and the
    files contained within, navigate to it in terminal and type “tar –czvf name.tar.gz
    foldername”.  C stands for “create”, z means “compress (gzip)”, v is for “verbose”,
    and f allows filename specification.  If you want more compression (but at the
    cost of time), zip the folder with gzip2 by replacing the –z switch with the –j
    switch instead. 


    Now extracting that same archive can be done with “tar –xzvf name.tar.gz”.  You
    will notice that the –c was replaced with an –x, and this indicates extraction. 
    Once again if you are dealing with bzip2 files use the –j switch instead.'
