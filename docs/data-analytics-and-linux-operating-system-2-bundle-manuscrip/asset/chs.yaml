  \n## 引言\n\n计算机包含两个组件——软件和硬件。硬件是旋转、计算并使用电力执行计算的物理部分，但软件是一个更虚拟的概念。本质上，软件由向硬件提供指令的程序组成——告诉各个部分做什么。存在“高层”软件，如浏览器浏览器、文字处理器、音乐播放器等。但经常被忽视的组件是被称为“低层”软件的操作系统。\n\
  \n\n\n个人电脑的运行需要操作系统。在办公室或使用相对廉价的台式电脑时，使用的操作系统可能是微软的 `Windows`。内容创作者、作家和图形艺术家更倾向于使用苹果电脑，因为它们配备了专注于创意的\
  \ `OSX` 操作系统。`Windows` 和 `OSX` 这两个操作系统多年来一直主导着消费市场。然而，还有一种在易用性、定制性、安全性和价格方面表现出色的替代操作系统。基于相对不为人知的\
  \ `Linux` 的操作系统在所有这些领域都达到并超过了预期，但它仍然是一个冷门的选项，许多人甚至听说过它。\n\n`Linux` 本身并不是一个操作系统。它是一个内核，或者说是操作系统的“核心”。正如\
  \ `Windows NT` 是 `Windows 7` 的内核，`Linux` 是 `Ubuntu`、`Debian`、`Arch`、`Fedora` 等“发行版”的内核。\n\
  \n但为什么有人会放弃熟悉的 `Windows` 而去选择一个闻所未过的计算环境呢？`Linux` 不仅在金钱上是免费的，而且兼容大量的设备。旧电脑，特别是那些不再运行的电脑，可以通过\
  \ `Linux` 操作系统来焕发新生，使其运行得像新的一样。\n\n本书将详细说明切换到 `Linux` 的好处，并作为安装、配置和使用最流行发行版的入门指南。然后，将解释终端命令行，告诉你如何以其他系统无法实现的方式利用该操作系统。切换到\
  \ `Linux` 确实有许多优势可以获得，通过阅读这本书，你可能会为你的电脑找到一个适用的主操作系统。\n\n# Linux 历史\n\n20 世纪 90 年代初，林纳·托瓦尔斯（Linus\
  \ Torvalds）是芬兰的一个学生。当时的电脑通常运行在 `DOS` 或 `UNIX` 上，这两个操作系统在当时都是专有的且难以使用。托瓦尔斯寻求作为一个爱好项目（业余项目）来创建一个自己的操作系统（基于\
  \ `UNIX`），但该项目迅速壮起来并吸引了更多开发者。内核不断演变，直到它变得具有移植性（可以在各种系统上运行）并且完全可以用于计算。然而，内核并不是操作系统，因此\
  \ `Linux` 与 `GNU` 核心实用程序相结合，创建了一个类似于操作系统的计算环境。\n\n随后，第三方机构获取了基础 `Linux` 产品并添加了他们自己的高层软件和功能，从而创建了\
  \ `Linux` “发行版”。直到今天，`Linux` 仍然是一个免费的爱好项目，因此内核持续接收托瓦尔斯和社区的更新和修订。整个 2000 年代，许多其他第三方看到了\
  \ `Linux` 环境的用途，并开始将其整合到他们的生产环境和企业中。今天，`Linux` 以在服务器和业务环境中被广泛使用而闻名，并拥有小规模的专用桌面用户群。面向未来，内核已经达到了了永远不会消失的流行程度。大公司因为\
  \ `Linux` 的优势和用处而对其青之有加，因此内核和各种发行版将一直作为最佳的替代操作系统存在。\n\n# Linux 的优势\n\n为了比较 `Linux`\
  \ 对于电脑来说是一个多么好的选择，我们将将其与更熟悉的现代操作系统进行比较。\n\n首先，`Linux` 是免费的。`GNU` 的背景将 `Linux` 置于一种“免费和开源”的心态中，大多数（如果不是全部）随\
  \ `Linux` 附发的软件都是免费的。免费开源 (`FOSS`) 指的是两点——软件在金钱上是免费的，而且源代码也是透明的。`FOSS` 与专有软件的区别在于，`FOSS`\
  \ 的一切都是开放的，在使用它时不会涉及任何隐藏的间谍软件、费用或陷阱。软件通常更安全，因为任何人都可以对现有的源代码做出贡献并使其变得更好。由于 `Linux`\
  \ 以及你可以为它下载的大部分软件都是免费的，因此对于预算有限的小企业或个人用户来说，它是一个极佳的操作系统。不收取费用绝没有牺牲质量，因为 `Linux` 项目及其各种发行版是社区驱动的，并通过捐赠获得资金。与\
  \ `Windows` 的成本相比，仅操作系统通常就需要几百美元。`Microsoft Office` 是一个流行的文档编写软件套件，但它的价格也很高。`Linux`\
  \ 中存在这些程序的免费替代方案，它们在质量上绝对可以与大品牌产品媲美。\n\nPC 所有者最大的抱怨可能是病毒。`Windows` 电脑特别容易受到侵害，即使是杀病毒软件公司也一直在追赶最新的威胁。仅仅访问恶意网站通常就足够感染电脑了，许多用户选择\
  \ Mac 电脑是因为与恶意软件相关的事件频率要低得多。基于 `Linux` 的操作系统与 Mac 类似，病毒几乎不存在。这种增强安全性使得任何关心隐私、安全或可靠性的人来说，切换到\
  \ `Linux` 是必须的。\n\n`Linux` 在企业和政府机构中非常流行。这是因为高性能服务器和关键设备在运行 `Linux` 操作系统时，运行情况会出色得多。该操作系统也以可靠性和稳定性闻名。`Windows`\
  \ 电脑需要经常重启和维护来“刷新”状态并防止其运行变慢，而 `Linux` 服务器可以运行几个月甚至几年而不需要重启。IT 专业人员不可避免地选择 `Linux`\
  \ 作为他们网络的骨干，因为它的声誉。它声闻的稳定性在桌面平台上也适用于消费者，对我们来说也绝对有用。\n\n也许使用 `Linux` 最大的好处是速度。低系统要求意味着，在\
  \ `Windows` 上通常运行缓慢、迟钝的电脑在 `Linux` 上将变得敏捷快速。对电脑变慢感到沮丧的用户可以更换操作系统，以获得更快速响应的体验。此外，`Linux`\
  \ 可以安装在旧电脑上以重焕活力。所以，尽管那台旧笔记本电脑可能对于最新版本的 `Windows` 来说太旧了，但可能有一个 `Linux` 发行版能再挤榨出几年的实用寿命。\n\
  \n定制是技术领域梦寐以求的功能。`Windows`，尤其是 `OSX`，由于担心普通用户会弄坏它，限制了你可以在操作系统上能做的事情。`Linux` 并非如此，因为它鼓励编辑和更改操作系统的视觉效果和功能。当然，这不是必要的，而且大多数\
  \ `Linux` 发行版的默认配置非常稳定，不容易被意外破坏。但对于那些喜欢越狱、修改和折腾电脑的人来说，`Linux` 可以促进创意，甚至为好奇黑客提供其他系统中无法使用的工具。\n\
  \n最后，`Linux` 兼容大量的设备。`Linux` 可以运行在几乎任何架构上，这意味着它可以安装在手机、台式机、笔记本电脑、服务器、游戏机和“智能”设备上。爱好者乐于仅仅在小众、老旧或奇特的设备上安装\
  \ `Linux`。对于普通用户来说，这意味着 `Linux` 可能兼容你的电脑。\n\n总的来说，`Linux` 在许多领域都胜过主流操作系统。所有这些因素绝对使\
  \ `Linux` 成为你电脑的更好的选择，你应该使用它来获得这些受推崇的功能。\n\n\n\n\n# Linux 发行版\n\n安装 Linux 有多种方法，例如将操作系统的镜像刻录到光盘、写入\
  \ USB 闪盘、在线订购 Live CD、格式化 SD 卡，或者通过 `Virtual Box` 进行尝试。尽管如此，你不能仅仅安装“Linux”就获得一个可用的操作系统。因为\
  \ Linux 仅仅是内核，你还需要其他提供图形用户界面、互联网访问等软件……正如前所述，Linux 存在许多不同的“发行版”（distributions）。发行版是\
  \ Linux 的不同版本，包含了预装程序以及独特的风格和侧重点。一个发行版提取了 Linux 的核心，并将其变成一个适合日常使用的完整操作系统。\n\n发行版的数量多到令人惊叹。某些发行版具有特定用途，例如用于黑客的\
  \ `Kali Linux`、用于教育的 `Sugar Linux` 或用于自定义的 `Arch Linux`。另一些则更具通用性，如 `Ubuntu` 和 `Debian`。要充分发挥安装\
  \ Linux 的作用，你需要了解不同的发行版，并选择哪种最适合你。请阅读以下章节以了解一些最流行的发行版的用途。\n\n## Ubuntu\n\n`Ubuntu`\
  \ 是本书写作时最广为人知的发行版。在整个 21 世纪 00 代，它因用户友好和直观而流行。`Ubuntu` 基于早期的 `Debian` 发行版，在使用上与\
  \ Windows 电脑非常相似，这意味着它是 Linux 新手的极佳选择。正因如此，我们将在本书后面安装一个 `Ubuntu` 变体。`Canonical Ltd`\
  \ 是积极开发 `Ubuntu` 的公司，年度版本更新意味着该操作系统始终保持最新，并能兼容新兴技术。尽管如此，`Ubuntu` 仍然可以在许多旧设备上以合理的速度运行。应用程序可以从某种“商店”安装，这意味着初学者不需要理解通常很复杂的命令行。总之，`Ubuntu`\
  \ 发行版是首次使用 Linux 的用户的绝佳选择，你应该安装它来学习 Linux 是如何工作的，而无需深陷那些更难的发行版。\n\n对于更具体的计算场景，`Ubuntu`\
  \ 拥有各种子发行版或“口味”（flavors）。这些发行版以 `Ubuntu` 为基础，但有不同的侧重点，例如 `Lubuntu` 强调轻量级应用。以下是其中几个：\n\
  \n*   `Lubuntu` – 一种设计运行在旧硬件或资源有限的计算机上的 `Ubuntu` 版本。安装文件小于 1GB，硬件要求远低于标准的 `Ubuntu`。使用此发行版可以复活旧电脑，同时保留\
  \ `Ubuntu` 的易用性。\n*   `Ubuntu Studio` – 为数字绘画师、音频制作人员和视频编辑师等艺术家设计的 `Ubuntu`。`Ubuntu\
  \ studio` 是已经预装了编辑工具的 `Ubuntu`。\n*   `Kubuntu` – 使用 `KDE` 桌面环境重新装扮的 `Ubuntu`。`Kubuntu`\
  \ 的外观和感受与经典的 `Ubuntu` 感觉不同，它提供了一个更接近其他操作系统的桌面环境。\n*   `Xubuntu` 是另一个轻量级发行版，但不像 `Lubuntu`\
  \ 那么精简。`Xubuntu` 牺牲了体积和硬件要求，以提供一个运行在旧但不过老的计算机上的操作系统。它显然比其他极简 Linux 发行版更美观，并且以 `Ubuntu`\
  \ 为基础以保证用户友好和熟悉。\n*   `Ubuntu Server` – 一种更适合工业和企业需求的 `Ubuntu` 变体，`Ubuntu server`\
  \ 可以无头运行，并为网络中的其他 Linux 系统提供功能。\n*   `Mythbuntu` – 一种预装了电视流媒体和直播电视节目的变体。这是一个通过 `Kodi`\
  \ 将旧电脑转换为“智能电视”设备的绝佳发行版。\n\n总之，广泛的 `Ubuntu` 发行版意味着每个人都有自己的初学者操作系统。强烈建议你利用 `Ubuntu`\
  \ 中包含的易用性特性和通用熟悉感。它作为一个阶石式的操作系统，将逐渐引导你接触 Linux。请务必将其安装作为你的第一个 Linux 体验。\n\n## Linux\
  \ Mint\n\n`Linux Mint` 是 Linux 世界中广泛使用的操作系统。“强大且易用”，`Mint` 包含了开源软件（FOSS）和专有软件，旨在为\
  \ Linux 初学者提供完整的体验。虽然不是完全像 Linux，但 `Mint` 是首次尝试备用操作系统的极佳选择。它一直位列史上最常用的操作系统之列，其默认布局与\
  \ Windows 非常相似，便于平滑过渡到 Linux 世界。\n\n## Debian\n\n`Debian` 是最老的 Linux 发行版之一，创建于 1993\
  \ 年。结合 Linux 哲学，`Debian` 将稳定和稳固作为指导开发的原则。无疑，`Debian` 存在的时间长短是完善程度的指标，因此追求无 Bug 和故障的用户可以转向\
  \ `Debian`。自由开源软件在 `Debian` 中也有一席之地，因为包含的大部分软件都是开源的。但这并不意味着你受到了限制，因为有一个包含像 `Adobe\
  \ Flash` 等专有程序的官方非自由软件存储库。`Debian` 是初学者的不错选择，但 `Ubuntu` 仍然是最好的入门级操作系统。安装 `Debian`\
  \ 是为了稳定性、开源软件和完全的 Linux 体验。\n\n## Slackware\n\n`Slackware` 是一个比 `Debian` 还要早的操作系统。它保持接近原始的\
  \ Linux 意图，这意味着你必须安装自己的 GUI 和程序依赖项。由于这一事实，`Slackware` 主要面向中级 Linux 用户，因为初学者会对不熟悉的方法感到困惑。然而，如果你想体验一个接近\
  \ `UNIX` 根源的 Linux 发行版，`Slackware` 可以提供。\n\n## Fedora\n\n`Fedora` 是一个更倾向于工作站和业务使用的操作系统。甚至\
  \ `Linus Torvalds` 本人也是 `Fedora` 的用户，这归功于该操作系统的普及。`Fedora` 更新非常频繁，这意味着它始终是最新的并处于\
  \ Linux 的前沿。安全和开源软件也是该操作系统的重点，这就是它通常用于小企业的终端电脑的原因。不过， `Fedora` 可能会面临挑战，因此将其视为中级操作系统。\n\
  \n## Arch Linux\n\n`Arch Linux` 是另一个发行版，但它主要为经验丰富的用户设计。该操作系统以系统壳的形式出现，用户可以通过仅添加所需的程序和服务按喜好进行自定义。由于由于，`Arch`\
  \ 很难设置，但也是非常有回报且学习性的体验。通过构建自己的个人系统，你将理解那些在高级发行版中对你隐藏的深层 Linux 概念。在非常熟悉基础知识后，再安装这个高级操作系统。\n\
  \n## 其他发行版\n\n最后，还有许多值得提到的其他独特发行版。在下面的列表中，我们将讨论其中几个。请注意，发行版如此之多，整本书都可以用来描述每一个细分领域了。\n\
  \n*   `CrunchBang` – 一种基于 `Debian` 的发行版，旨在减少资源消耗。它非常简单，没有某些发行版默认包含的某些臃肿软件。`CrunchBang`\
  \ 运行很快，计算效率很高。\n*   `Android` – 流行的手机操作系统实际上是 Linux 变体。由于许多手机的规格低于全功能桌面电脑，因此该操作系统是笔记本电脑、触摸设备或家庭媒体电脑的绝佳选择。此外，你可以使用\
  \ Play 商店中的许多 Google 应用，这意味着成千上万的应用程序、游戏和工具可以在你的手机和电脑上使用。虽然不将其作为你的第一个 Linux 操作系统，但它对于尝试旧电脑或儿童电脑绝对是一个很酷的选择。\n\
  \n\n\n\n\n*   `Chrome OS` – 由 Google 开发的另一种移动类型操作系统，`Chrome OS` 本质上是一个用于在线使用的轻量级\
  \ Linux 浏览器。Google 在他们的 `ChromeBooks` 上预装了这个操作系统，这些电脑的配置比其他笔记本电脑低。但它实际上就是一个全屏 Chrome\
  \ 浏览器，因此对于想要简单或专用上网机器的用户非常完美。\n*   `Tiny Core` – 一个以 MB 为单位的操作系统，`Tiny Core` 适用于旧电脑或嵌入设备。该操作系统主要面向有爱好项目或特定用途的中级用户。\n\
  *   `Damn Small Linux` – 另一个极简 Linux 变体，该操作系统最适合快速访问 Linux 命令行。\n*   `openSUSE`\
  \ – 这是一个面向经验丰富的计算机用户的发行版。它为管理员和程序开发人员提供了许多工具，`openSUSE` 是对技能有自信的用户的最佳操作系统。\n\n基于\
  \ Linux 内核的操作系统数量确实令人惊叹。面对海量的选择，你可能会对从何开始以及如何安装感到困惑。在不确定时（正如我们很快将演示的），请安装 `Ubuntu`\
  \ 或其变体。该操作系统非常适合初学者，并让向 Linux 的过渡更加顺畅。但随着你技能的提高并想要了解更多 Linux 知识，你可以随时安装另一个操作系统。\n\
  \n## 进入 Linux\n\n如果你准备好投身 Linux 发行版，你必须做的第一件事就是备份你的文件。覆盖硬盘上的操作系统将擦除其中包含任何数据，这意味着你必须备份转换后想要保留的任何照片、音乐或文件。使用外部硬盘或在线数据存储网站（如\
  \ `Google Drive`）来临时存放你的文件。我们不对你丢失重要物品负责，请务必进行备份！\n\n接下来我们需要选择一个操作系统。本书将使用 `Ubuntu\
  \ 16.04` 作为扩展示例，建议你也同样这样做。访问 Canonical 的官方网站（[`www.ubuntu.com`](http://www.ubuntu.com)）并获取操作系统的副本。你将从该网站下载镜像到你的电脑。\n\
  \n接下来我们需要获取安装介质。这可以是 `DVD`、`USB 闪存`、`SD 卡` 或任何你的电脑可以读取的可写介质。唯一的限制是设备必须能够容纳与下载的一样大的镜像，因此\
  \ `4GB` 就足够了。请删除驱动器上的所有内容，因为它也将被格式化。\n\n下载一个用于写入镜像文件的工具。对于 `DVDs`，安装 `Imgburn` ([`www.imgburn.com/`](http://www.imgburn.com))，对于闪存介质下载\
  \ `Rufus` ([`rufus.akeo.ie/`](https://rufus.akeo.ie))。最常见的操作系统安装方法是使用 `4GB USB 盘`，且更推荐这种方法。插入介质，启动相应的程序，选择下载的操作系统镜像，并开始写入过程。这需要一些时间，因为镜像需要在介质上制成可启动状态。完成后，你可以完全关闭电脑。\n\
  \n现在请双重确认你已准备好安装 Linux。检查文件是否已备份，理解你将擦除当前的操作系统，并且最好手头有一个 `Windows/OSX` 安装盘，以防你决定切换回去。如果你确实准备好切换了，请继续。\n\
  \n保持安装介质插入，打开电脑。你看到的第一个屏幕是 `BIOS / UEFI POST` 屏幕，它会显示一个你应该按的键盘键以进入设置。这个屏幕每次启动时都会显示，但你可能没有注意它。按下指示按键进入\
  \ `BIOS 设置`。如果你速度太慢，屏幕将会消失，你的操作系统将开始加载。如果发生这种情况，只需关机并重试。\n\n一旦进入 `BIOS / UEFI`，你将需要导航到“启动顺序”设置。每台电脑的\
  \ `BIOS / UEFI` 略有不同，因此我们无法详细解释该过程。但通常你可以按照屏幕底部的按钮提示了解如何导航。到达启动顺序设置后，将你的启动介质置于列表顶部。例如，如果你使用了\
  \ `USB 盘`，你会看到它的名字并将其置于列表顶部。这些设置控制了 PC 搜索操作系统的顺序。将我们的启动介质放在列表顶部，它将引导进入下载的 Linux\
  \ 镜像，而不是常用的操作系统。保存设置并重启电脑。如果一切操作正确，电脑将开始启动进入 `Ubuntu`。\n\n但如果出现问题，请尝试通过以下提示进行故障：\n\
  \n*   启动了主操作系统而非 Linux – 你可能没有保存将备用启动介质置于顶部的设置。PC 仍然默认从内部 `HDD` 启动。\n*   “未找到启动介质”（No\
  \ boot media found）– 你是否只是将 Linux 镜像“拖放”到了介质上而不是写入它？如果不明确告诉电脑它是可启动的，它将不知道如何处理介质上的数据文件。或者，可能是下载的文件损坏或写入不完整。尝试重新下载镜像并再次进行安装。\n\
  *   “内核恐慌”（Kernel Panic） – 启动过程出现问题。见上文关于安装损坏的可能性。否则，你尝试安装的镜像可能与你的硬件不兼容。如果你看到任何其他错误信息，请在互联网上搜索它们。对于预装电脑和笔记本电脑，搜索型号名称和\
  \ Linux 以查找其他用户的经验。最后，你可能尝试在 32 位电脑上安装 64 位镜像。在下次下载镜像时，请专门选择 32 位镜像。\n*   “从 CD-ROM\
  \ 读取数据出错……”（Problem reading data from CD-ROM…） – 尝试使用不同的安装介质，因为某些发行版不再支持 `CD 和 DVD`\
  \ 安装。推荐使用 `USB 盘`。\n*   电脑似乎启动了，但屏幕上没有任何显示 – 如果你正在使用独立显卡（相对于 CPU 的集成 `GFX`），Linux\
  \ 可能无法完全识别它。请将显示器直接插在主板上而不是显卡上。\n\n但这些问题大部分是罕见的，或仅仅是用户操作错误。Linux 具有很高的兼容性，在初始安装之后相对容易安装/使用。典型用户此时应该已成功启动\
  \ `Ubuntu`，并将获得一个可以使用的计算环境。\n\n你看到的桌面被称为“活动光盘”（Live CD），这基本上是操作系统及其工作方式的演示。你尚未实际将操作系统安装到硬盘上，因为它仍在直接从你的启动介质运行。这是一个让你在不实际移除主操作系统的情况下测试\
  \ Linux 的机会，请利用此机会探索 Linux 发行版是如何工作的。\n\n## Ubuntu 基础\n\n与 Windows 类似，Ubuntu 拥有桌面图形用户界面。窗口内打开可以最大化、最小化、关闭和移动应用程序。Ubuntu\
  \ 也有某种“任务栏”，其功能与 Windows 对应部分相似——图标代表可以通过点击启动的程序。任务栏上的“Windows 按钮”（称为 `Dash 按钮`）用于打开搜索功能，你可以在其中输入电脑上程序或文件的名称来快速启动它。\n\
  \n此外，屏幕顶部有一条栏，类似于其他操作系统的“菜单”栏。当程序处于激活时，这里会出现诸如“文件”、“编辑”、“帮助”等下拉菜单。\n\n\n\n\n\n除了少数名称上的细微差别，Ubuntu\
  \ 的功能非常熟悉。事实上，你可能已经在其他操作系统上使用的许多程序（例如 Firefox）在 Linux 发行版中都是可用的，有时甚至是预装的。通过足够的实验和实践，你将像专业人士一样操作\
  \ Ubuntu 的图形用户界面（GUI）。继续探索该系统，如果你准备好用这个 Linux 系统替换你的主操作系统，就请继续下去。\n\n# 安装 Linux\n\
  \n在桌面桌面上，你会看到一个“Install Ubuntu 16.04 LTS”图标。双击它将启动一个让安装变得非常容易的应用程序。如果你没有连接互联网，请现在通过插入以太网线或通过右上角的图标连接\
  \ Wi-Fi 来连接。选择你的语言并点击“继续”。下一个提示将询问你是否想在操作系统安装期间下载更新并安装第三方软件。这些选项对初学者来说是强烈建议的，因此勾选它们并点击“继续”。\n\
  \n应用程序将跳转到另一个屏幕，询问你的安装方法。有多种选项，例如完全删除磁盘、与你的主操作系统一起安装，或更新之前的 Linux 版本。选择一个最适合你的选项。如果你仍然犹豫是否完全切换，请选择将\
  \ Ubuntu 安装为你的辅助操作系统。该选项将允许你在 BIOS 界面后选择进入哪个操作系统。尽管如此，请选择你的选项并点击“现在安装”。\n\n当 Ubuntu\
  \ 安装时，你可以指定一些其他选项，例如时区、计算机名称、帐户名称和密码。整个安装过程不会花费太长时间，但时间长到足以你的电脑应该插上电源（如果是笔记本电脑的话）。完成后，操作系统将要求重启。恭喜你，你现在电脑上拥有了一个可用的\
  \ Linux 系统。在出版物的接下来的章节中，我们将重点关注 Linux 概念、如何完成某些任务以及如何进一步增加你对系统的了解。\n\n# 管理硬件和软件\n\
  \n在 Linux 中，硬件的管理实际上比在 Windows 中要容易得多。你不需要为设备单独下载驱动程序，大多数驱动程序都内置在操作系统本身中。这意味着大多数设备只需简单安装，无需无需进行任何额外步骤即可使用。打印机、网络、硬盘和其他常见设备都包含在内——Linux\
  \ 上通常不需要折腾驱动程序。\n\n然而，强大的显卡和其他特定硬件需要该公司的专有驱动程序才能发挥全效。因为尽管你的显卡在 Linux 下默认可以工作，但其内部秘密且往往隐藏的技术只有通过该公司的软件才能被充分利用。在\
  \ Ubuntu 上，这个过程非常直观——打开“附加驱动”应用程序并让操作系统为你搜索。在确定你是否拥有这些设备后，它会询问你使用哪个版本的驱动程序。遵循屏幕上的任何提示启用第三方驱动程序。对于任何未出现的设备，请在制造商网站上进行网络研究，确定他们是否发布了你可以下载的特定\
  \ Linux 驱动程序。\n\n软件是 Linux 优于 Windows 的另一个方面。就像苹果电脑一样，Ubuntu 也有某种应用商店，你可以在其中搜索与设备兼容的应用程序库，只需点击几次即可下载并安装。只需在\
  \ dash 中搜索“Ubuntu Software Center”打开该应用程序。从那里，你可以浏览各个类别，如“游戏”、“办公”或“系统”以查看程序列表，或者直接通过名称搜索。找到程序后，点击它，然后点击“安装”将下载加入队列。在验证身份后，软件将自动下载并安装。从那里，可以通过\
  \ dash 搜索它来运行应用程序。\n\n另一种安装软件的方法是通过终端提供的，但我们稍后会讨论。Ubuntu 并不完全限于应用商店中找到软件，因为从网上下载的程序也可以安装。再次，我们将在讨论终端后触及这个主题。\n\
  \n总来说，在 Ubuntu 中管理硬件和软件是非常轻松的。无论是安装新硬件设备还是下载流行程序，Linux 发行版都能让你的计算体验毫无故障。这并不是说 Linux\
  \ 完全是为初学者设计的，正如我们将学的，Linux 绝对是高级用户和经验丰富的管理员的绝佳选择。\n\n# 命令行终端\n\n在现代计算机之前，硬件和软件完全通过键盘进行交互。鼠标引入了图形界面并简化了过程，但许多功能仍保持纯文本，以避免向终端用户呈现复杂的选项。在\
  \ Linux 中，这一过程今天仍在继续。虽然大多数发行版都存在 GUI，但每个 Linux 发行版也内置了基于文本的界面，可以在其中输入并执行强大的命令。将终端想象为一个得强大的命令行提示符，因为你可以完全通过终端来使用你的计算机。凭借足够的知识，用户实际上可以通过文本浏览互联网、安装程序、管理文件系统等。\n\
  \n通过从 dash 启动或使用 `Ctrl+Alt+T` 键盘快捷键启动终端。一个紫色窗口将打开并等待你的输入。你可以输入一个命令并按回车键激活它。对于我们的第一个命令，输入\
  \ `ls`。这是 list（列表）的缩写，它将显示当前目录下的所有文件。你将看到 Home（Ubuntu 的主用户文件夹）中的文件和文件夹。如果你迷路了，可以随时输入\
  \ `pwd` 来打印工作目录并显示你正在浏览的文件夹名称。当你学习命令时，将它们写下来有助于强化它们的用法。\n\n## 管理目录\n\n目录（文件夹的另一个名称）的工作方式与其他操作系统相同。目录存放文件，你必须当前正在访问某个目录，才能与其内部的文件进行交互。你可以使用终端命令\
  \ `cd` 来更改目录并在文件系统中移动。例如，从 Home 文件夹输入 `cd Desktop` 将带你进入该文件夹。现在使用 `ls` 将不会显示任何内容（除非你向桌面添加了文件）。要返回上一级，输入\
  \ `cd ..`。练习这种方式在文件系统中进行导航；cd 进入目录并使用 ls 查看文件。\n\n由于你正在输入命令，Linux 期望你的输入是精确的。如果你拼错了命令，它将无法运行；如果你输入的文件夹或文件名称不正确，它将尝试引用一个不存在的内容。在使用终端时，请仔细观察你的输入。\n\
  \n打开文件使用不同的命令——`. `。点号用于启动指定文件，所以如果你尝试打开一张图片，可以这样操作：`./house.png`。点号和斜杠都是必要的，因为它表示你正在运行当前目录下的一个文件。当你运行一个文件时，它将用分配给该文件类型的应用程序打开，因此在图片的情况下，它最会在图像查看器中打开。\n\
  \n\n\n\n你也可以通过终端创建和删除目录及文件。在本例中，导航到主目录（Home）。作为一个快捷方式，你可以输入 `cd ~` 将目录切换到你的主目录，因为波号\
  \ `~` 是“当前用户主目录”的缩写。使用 `mkdir` 命令创建目录；输入 `mkdir Programming` 即可创建一个名为该名称的新文件夹。你可以进入该目录，也可以进入图形用户界面（GUI）进入它以证明你确实创建了一个新文件夹。现在，通过回到主目录并输入\
  \ `rmdir Programming` 来删除该目录。Linux 会毫不犹豫地删除指定的目录。同样地，使用 `rm` 会删除指定的文件。\n\nLinux\
  \ 有一种许多用户并不习惯的设计哲学。在 Windows 和 OSX 中，操作系统几乎总是会双击你是否真的要执行如删除文件或卸载程序之类的操作。Linux 发行版认为，如果你在尝试执行某个事件，你绝对是想要执行到底的。它通常不会确认删除操作，也不会显示任何确认消息（如“文件已成功删除”）。相反，没有消息出现表示过程已成功完成。虽然这种哲学有些危险（因为你可能会在没有警告的情况下破坏操作系统安装），但它与其他操作系统形成了设计对比。Linux\
  \ 赋予你完全的控制权，它永远不会尝试隐藏任何内容或模糊选项，仅仅因为它们可能太复杂。这需要时间来适应，但大多数用户认为，被自己所拥的技术尊重是一种受欢迎的改变。\n\
  \n然而，这并没有损害安全性，因为任何关键操作都需要 `sudo` 命令作为前缀。Sudo 代表“super user do”（超级用户执行），意味着最高权限的用户正在请求执行后续命令。任何\
  \ sudo 条目都需要管理员密码，因此恶意软件或无意的键盘垃圾邮件者无法在不知道密码的情况下意外造成破坏。我们在书中使用的许多命令都需要 sudo 权限，所以如果命令未能完成并显示了说明“没有足够权限”的消息，你可以尝试使用\
  \ `sudo` 重试。\n\n### Apt\n\n学习终端开启了 GUI 无法提供的计算机功能。此外，你还可以通过输入命令来缩短许多任务所需的时间。例如安装程序所需的工作量。如果你想下载\
  \ Google Chromium 浏览器，你需要打开软件中心、输入程序名称、找到正确的包、标记为安装并执行操作。相比之下，在终端中输入 `sudo apt-get\
  \ install chromium-browser`。只需这一个命令，Ubuntu 就能为你节省许多分钟。\n\n`apt`（高级软件包工具）是与 Ubuntu\
  \ 中管理应用程序相关的命令。其他发行版可能使用自己的工具，但 `apt` 因其庞大的仓库和简单的命令而被广泛使用。包使用 `apt-get install`\
  \ 格式进行安装，其中你指定要安装的程序名称。在上面的示例中，我们通过包名 `chromium-browser` 指定 Chromium 程序。鉴于你不知道每一个包名，还有另一个命令\
  \ `apt-cache search` 可用于查找与提供字符串匹配的包名。因此，`apt-cache search chromium` 将显示 `chromium-browser`，你就可以指定正确的名称进行安装。\n\
  \n`apt` 的用处远不止于此，你可以使用几条命令来更新系统上的每一个应用程序。使用 `apt-get update` 刷新仓库，然后使用 `apt-get\
  \ upgrade` 让每个应用程序自行升级到最新版本。Windows OS 用户应该对这种简单的流程感到羡慕，因为更新 Windows 程序需要卸载并重新安装最新版本。\n\
  \n随着时间的推移，你可能需要更新 Ubuntu 版本。每年都会发布新版本，并可以使用 `apt-get dist-upgrade` 进行安装。保持与最新的修复和新增同步，可以确保你的\
  \ Linux 系统长期健康运行。你可能甚至注意到，安装和更新系统不需要重启；这一特性有助于 Linux 计算机实现长时间运行并保持稳定性。最后，删除应用程序通过\
  \ `apt-get remove` 后接包名来完成。\n\n要运行我们安装的程序，我们可以从启动栏（dash）搜索它们，也可以直接在终端中输入包名。输入 `chromium-browser`\
  \ 启动它与双击图标完全一样。某些程序必须通过仅输入包名从命令行启动，因为这些包不会出现在搜索栏搜索中。总的来说，利用终端是一个节省时间的方法，也是摆脱缓慢且复杂的图形用户界面的绝方法。\n\
  \n软件包的轻松安装和管理是 Linux 的一项功能，变得非常有用——精通它将提升你的体验。安装包还有第三种方法，涉及从互联网下载并启动 `.deb` 文件。某些软件以此格式打包的，它们的作用类似于\
  \ `.exe` 文件，只需要双击即可开始安装过程。\n\n### 更多终端命令\n\n这里有几个你应该内化并在系统中使用的更多基础终端命令。完全理解基础知识将为后续的构建提供良好的实基础。\n\
  \n*   `cp` – `cp image1.jpg image2.jpg` – 将第一个参数复制（并重命名）到第二个提供的参数。使用 `-r` 复制目录。\n\
  *   `mv` – `mv cat.jpg /home/Pictures` – 将指定的文件移动到指定的目录。\n*   `shutdown` – `shutdown\
  \ -h now` – 关闭电脑。`-h` 是一个表示“停止”（halt）的标签，你也可以使用 `-r` 重启。now 指的是执行之前的时间。\n*   `date`\
  \ – `date` – 显示当前的日期和时间。\n*   `free` – `free -g` – 显示当前的 RAM 使用情况。\n*   `du` – `du\
  \ -h` – 显示硬盘使用情况。\n*   `ps` – `ps` – 显示使用 CPU 时间的活动进程。\n*   `touch` – `touch memo.txt`\
  \ – 用于在当前目录下创建一个指定名称的新空文件。\n*   `ifconfig` – `ifconfig` – Linux 中等同于 `ipconfig`，它显示网络信息。\n\
  \n某些命令带有相关的“标签”或“开关”。这些是以前折号开头的字母。它们的作用各不相同，为了什么目的使用哪些开关，最好的方法是通过该命令的手册页。请查看高级章节了解如何打开手册。\n\
  \n命令行中最实用的程序之一 `nano` 是一个简单的文本编辑器，可用于编辑文件并快速更改设置或脚本。通过在命令行输入 `nano` 来访问它。你可以根据需要输入文件，然后按\
  \ `ctrl+x` 保存并退出。在保存时，你将赋予它关联的名字和后缀；`notes.txt` 将创建一个名为“notes”的文本文件。或者，你可以通过输入 `nano\
  \ notes.txt` 来编辑文件。在示例中，我们在编辑器中打开 notes 并在可编辑状态下显示其内容。\n\nNano 可能很简单，但它无疑是强大的，并且是快速更改和创建文件的利器。\n\
  \n### 连接到 Windows / Mac 计算机\n\nWindows 和 OSX 计算机内置了网络功能，如工作组、域、共享等。将 Linux 计算机集成到由\
  \ Windows 服务器计算机主导的网络基础设施中相当容易，正确的设置将允许你查看 Windows 共享并加入公司域。\n\n\n\n通信的第一步是安装 `samba`\
  \ 软件包。你可以通过软件中心找到它，或者输入 `sudo apt-get install samba` 来获取并安装必要的软件。\n\n从你的 Ubuntu\
  \ 向其他电脑共享文件需要创建一个 `samba` 共享。Samba 运行的协议与其他流行的文件共享方法相同，因此从 Ubuntu 机器共享的文件可以轻松地在\
  \ Windows 上看到。安装 samba 后，使用 `sudo nano /etc/samba/smb.conf` 开始编辑配置文件。在文件的最底部添加以下几行：\n\
  \n```\n[share]\n    comment = File Share from Ubuntu\n    path = /srv/samba/share\n\
  \    browsable = yes\n    guest ok = yes\n    read only = no\n    create mask =\
  \ 0755\n```\n\n现在，创建 `path`指定的文件夹（`sudo mkdir -p /srv/samba/share`）并设置权限（`sudo chown\
  \ nobody:nogroup /srv/samba/share/`），以便任何人都能访问其内容。将任何你想共享的文件放入该目录，然后重启服务（`sudo restart\
  \ smbd`，`sudo restart nmbd`）使共享生效。最后，登录到你的其他电脑并导航到网络共享。在 Windows 中，它们将出现在文件管理器的左侧面板。如果共享没有自动出现，在文件路径框中输入\
  \ IP（使用 `ifconfig` 查找 Ubuntu 的 IP）。你现在可以从其他操作系统访问 Ubuntu 的文件了。\n\n你可能还需要在 Ubuntu\
  \ 电脑上查看其他操作系统的文件。首先，打开 Ubuntu 文件管理器。从菜单栏点击 `files`（文件），然后选择 `connect to server`（连接服务器）。在结果框中，输入你想访问的共享\
  \ URL。它可以是一个 ftp 地址（`ftp://ftp.test.com`）、http 地址（`http://test.com`）或共享地址（`smb://share/Folder`）。无需任何额外的硬件或设置，你就可以这种方式查看文件。\n\
  \n最后，加入如 Active Directory 等域允许你的电脑与网络上的其他操作系统交互，并实现其他面向业务的任务。无论你拥有的是小型家庭网络，还是正在将\
  \ Linux 电脑加入公司域，过程都是相同的。安装几个额外的软件包（`realmd`、`sssd`、`sssd-tools`、`samba-common`、`samba-common-bin`、`samba-libs`、`krb5-user`、`adcli`、`packagekit`）。在安装过程中，它会询问你的域名。用全大写输入。输入\
  \ `kinit -V adminname`，将其替换为域中的实际管理员账户名。输入密码后，你就通过了域的身份验证。现在通过 `realm --verbose\
  \ join -U adminmame domainname.loc` 完成加入。\n\n如果失败，意味着我们设备上的 DNS 配置错误。输入 `echo ‘ad_hostname\
  \ = nix01.domainname.loc' >> /etc/sssd/sssd.conf`，然后输入 `echo ‘dyndns_update = True'\
  \ >> /etc/sssd/sssd.conf`，最后使用 `service sssd restart` 使用新设置重启。第一行设置了我们电脑的 FQDN，因此该行需要根据我们的域设置进行更改。在配置正确设置并成功重启后，终端将声称已加入域。使用\
  \ `realm list` 测试这一点。现在连接到 AD 后，你就可以从服务器管理 Linux 设备了！\n\n但对于大多数用户来说，创建共享和加入域远远超过了连接需求。简单的文件共享通过\
  \ USB 驱动器传输或如 Dropbox 等服务完成更好。事实上，Dropbox 可以安装在三大操作系统上，并且可以在无需额外设置的情况下在它们之间同步文件。在\
  \ Ubuntu 上，你可以直接从网站下载 `.deb` 文件、从软件中心安装它，或使用 `sudo apt-get install nautilus-dropbox`\
  \ 获取该应用程序。在 Dropbox 文件夹中，放置任何你想在电脑之间传输的文件，它将自动在你拥的所有其他 Dropbox 电脑上下载并更新。\n\n当你将它们连接时，使用其他操作系统并不复杂。只要电脑位于同一网络，你就可以创建文件共享、将它们加入域，或使用像\
  \ Dropbox 这样的服务。\n\n## 有用的应用程序\n\n以下适用于你 Ubuntu 系统的最佳应用程序列表，它们将帮助你充分利用电脑。\n\n- \
  \  **办公生产力**：Abiword, VI, Emacs, LibreOffice, nano\n-   **多媒体**：VLC, DeaDBeef, Cmus,\
  \ AquaLung, MPlayer, Miro\n-   **网页浏览**：Firefox, Chromium, Midori, W3M\n-   **创意**：Aud,\
  \ acity, GIMP\n-   **其他**：Kuper, Thunderbird, qBittorrent\n\n对于有助于易用性的程序，有许多不同的选择，这取决于你尝试实现什么。发现程序的最佳方法是在互联网上搜索你想要添加的功能。例如，如果你在寻找一种快速打开和关闭终端的方法，你可能会遇到\
  \ `Guake` 程序。或者如果你想在终端中使用音频，它可能会推荐 `Cmus`。寻找适合你的完美应用程序是 Linux 的一部分，它让每次安装都变得更有意义。\n\
  \n## 管理\n\n如果你在寻找某种 `Control Panel`（控制面板），你可以从 `Settings`（设置）中找到网络、打印、外观等管理管理工具。某些\
  \ Ubuntu 变体使用 `Settings Manager`（设置管理器）或 `Settings` 实现相同的目的。\n\n启动它后，将会有指向配置应用程序的链接；只需点击任何想要更改为\
  \ GUI 的项即可。但并不是所有内容都能通过 GUI 找到。大多数低级设置只能通过命令行可用，因此你需要确切知道要输入什么。\n\n例如，在 Ubuntu 中添加新用户需要\
  \ `adduser` 命令。在命令后加上用户名，终端会提示基本信息和密码。将该新用户设置为管理员使用 `usermod -aG sudo nameofuser`\
  \ 完成。此外，可以使用 `deluser` 删除用户。这些选项在 GUI 中很难找到，但在终端几秒钟即可完成。\n\n`Task Manager`（任务管理器），或\
  \ Ubuntu 内运行应用程序的管理也通过终端完成。`top` 程序标准安装在所有发行版中（大部分），启动它会显示任务管理器的运行进程列表。但默认情况下，进程列表将更新并移动，可能难以阅读数据。按\
  \ `f` 键调出排序列表，用方向键导航到 `PID` 并按 `s` 设置该选项。现在使用 esc 键返回 top，我们现在可以使用向上翻页和向下翻页键滚动列表。假设，我们想关闭\
  \ `Pidgin` 程序，因为它没有响应。在列表中找到它（或使用上述的过滤命令搜索它）并记下 PID（进程 ID）数字。按 `q` 退出 top，然后输入 `kill\
  \ 4653`，显然将数字替换为 PID。在 top 内的任何时候，你都可以按 `h` 查看各种操作的快捷键列表。如果认为 `top` 太难用，考虑安装 `htop`，它是该程序的\
  \ `人类可读` 版本。它实际上显示了详细说明 CPU、内存和其他使用统计数据的整洁 ASCII 图表。使用 F3 搜索程序，然后使用 F9 和回车杀死它。\n\
  \n\n\n\n\n# 服务\n\n关于服务，你可能已经注意到我们使用 `service` 命令来更改它们的状态。启动 Web 服务器可以使用 `service\
  \ apache2 start`，重启它只需将 `start` 替换为 `restart`，停止它则通过将 `start` 替换为 `stop`。使用 `service\
  \ --status-all` 可以查找服务列表。服务是守护进程（daemons），即持续运行的后台任务。它们可以正在收集数据、运行如 `Bluetooth`\
  \ 和 `Wi-Fi` 等服务，或者等待用户交互。\n\n## 安全协议\n\nLinux 总体上关注安全性，这促成了它在企业和服务器环境中的应用。利用安全协议意味着你比其他操作系统更安全，计算机被入侵的可能性更低。这显然需要良好的安全原则，并始终在网络上保持安全。没有密码的计算机几乎没有任何受到保护。\n\
  \n一个从 `UNIX` 引入的特性是文件权限。每个文件都有一组权限——所有者、用户组和权限。`chown` 命令更改文件的所有者，`chgrp` 更改组，`chmod`\
  \ 更改与文件关联的权限。通过输入 `ls -l filename` 可以查看文件或文件夹的权限。它会返回一行最初看起来很困惑的内容，例如 `- rw- rw-\
  \ r--`。`R` 代表读取，`W` 代表写入，第三个选项是 `X` 代表执行。这三组分别是所有者、组和其他。因此，我们上面的示例文件为所有者及其所属组设置了读和写权限，但对其他用户只有读取权限。这意味着所有者及其所属组（最可能是\
  \ `sudo` 用户）有权访问文件并更改其内容，但网络或 PC 上的其他用户只能查看内容而不能进行编辑。脚本文件需要具有 `X` 才能执行，没有它就无法运行。\n\
  \n大多数人只需要使用 `chmod` 命令来更改他们想要使用的文件的权限。我们使用该命令和一组数字来设置文件权限。`chmod 777 test.sh` 使文件对任何地方的所有用户可读、可写可执行，因为每个规范（所有者、组、其他）都带有数字\
  \ `7`。数字决定了实体拥有的权限，所使用的数字计算方式如下：\n\n- 从数字 `0` 开始。\n- 加上 `4` 表示可读性。\n- 加上 `2` 表示可写性。\n\
  - 加上 `1` 表示可执行性。\n- 剩余的数字决定权限。\n\n`6` 为读/写，但 `1` 仅为执行。`5` 为可读可执行但不可更改。在我们的 `777`\
  \ 示例中，我们将所有者、组和其他都设为 `7`。这并不是特别好的安全性，因为这意味着任何地方的任何人都可以弄那个文件。更保守的权限集是 `775`。充分利用安全权限来实现安全计算。\n\
  \nLinux 内部的安全不仅限于权限。确保你实践了良好的安全规范，并遵循安全方面的常识——只安装需要的程序，不要遵循互联网上……[注：为了简洁，根据提示提供的流程，文本继续下去，但我将对整个提供的文本块中保持格式规则]。\n\
  \n## 脚本编写\n\n`Bash` 是一种编程语言。要使用它，请创建一个脚本并命名。\n\n```bash\n#!/bin/bash\n```\n\n```bash\n\
  echo \"Hello World\"\n```\n\n```bash\nls -l\n```\n\n```bash\nchmod 777 test.sh\n\
  ```\n\n```bash\nsudo crontab -e\n```\n\n```\n0 12 * * * ~/script.sh\n```\n\n```\n\
  30 18 25 12 * /usr/bin/scripts/test.sh\n```\n\n\n\n\n接上高级终端概念，让我们来聊一些可以在终端中节省时间的实用提示和技巧。在输入命令或文件名时，输入到一半按下\
  \ Tab 键。这项功能称为“Tab 补全”，它会猜测你尝试输入的内容并填充短语的剩余部分。对于文件，它将按照目录显示的方式完成名称，或者根据你正尝试的操作来补全命令。Linux\
  \ 专家和任何经常使用终端的人看起来似乎是以极高的准确性和速度精确地输入着他们想要的内容，但他们实际上只是在使用 Tab 补全功能。\n\n用户（尤其是管理员）会在\
  \ `sudo` 命令上花费大量时间，因为他们的指令需要提权才能运行。但当你输入一个很长的命令却忘记输入 `sudo` 时，你会因为必须再次输入它而感到愤怒。相反，只需输入\
  \ `sudo !!`，它是“超级用户再次执行”的缩写。这慷慨地避免了重新输入整个命令。\n\n重复执行命令的另一种方法是使用向上和向下方向键。连续按向上键可以循环之前输入过的命令。你还可以使用左、右方向键编辑命令，更改其中包含的文本。\n\
  \n最常用的终端提示涉及复制和粘贴。尝试将一行粘贴到终端会产生奇怪的字符 `^v`。键盘快捷键没有配置在终端中工作，这就是为什么会显示这种奇怪的组合。要实际粘贴，右键点击并选择该选项；或者使用组合键\
  \ `shift+insert`。复制也是一样的方法，但要用 `ctrl+insert`。虽然从网上复制粘贴终端命令可能是可以的（前提是你理解其中的风险并知道它们在命令中在做什么），但不要尝试从本文中粘贴。通过你阅读它时所在的媒介引入的格式可能插入了终端无法识别的特殊字符，因此最好不要复制粘贴，而是应该手动输入呈现的任何命令。\n\
  \nLinux 有一个许多用户不知道的隐藏功能。当你访问该目录或输入 `ls` 时，文件会显示给用户，但实际上并不是所有文件都能这种方式查看。在 Linux 中，如果你以点作为开头命名文件，它将被标记为隐藏。隐藏文件通常对普通用户不可见，它作为一种保护配置文件免受意外编辑/删除等的方法。要查看这些文件，我们只需要在\
  \ `ls` 搜索中添加 `-a` 标签。在 GUI 中，在目录中按 `ctrl+h` 即可显示隐藏内容。当你创建脚本和其他配置文件时，考虑使用点来隐藏它们，作为一种用户保护的形式。\n\
  \n终端中的任何命令都可以通过 `ctrl+d` 组合键中断或退出。使用它来停止长时间进程，或退出你不理解的程序/命令。\n\n### 别名 (Aliasing)\n\
  \n别名（Aliasing）是在终端内创建个人快捷键的方法。与其输入长命令或一组小命令，不如使用别名将它们合并成单一的用户定义选项。正如其名所意，别名是你指定的任何内容的不同名称。每个别名都包含在一个隐藏的配置文件中——使用\
  \ `nano ~/.bashrc` 开始编辑它。因为它存在于用户的家目录下，因此每个别名将只适用于该用户。在文件的底部，我们可以按照示例开始创建别名：\n\n\
  ```bash\nalias gohome='cd ~ && ls'\n```\n\n此别名将通过输入 `gohome` 将目录更改到家并显示内容。在创建别名时，你必须严格遵循上述格式，这意味着命令和等号之间没有空格。多个命令在单引号内部通过\
  \ `&&` 连接起来。为了获得更健壮的别名，请添加函数。\n\n下面的示例将 `cd` 和 `ls` 合并为单个命令。\n\n```bash\nfunction\
  \ cdls () {\n    cd \"$@\" && ls\n}\n```\n\n写完别名后，保存文件并重启电脑。你的新命令随后就可以使用了。\n\n我们编辑的那个文件\
  \ `.bashrc` 是 Ubuntu 终端的配置文件。除了制作别名，我们还可以用它来自定义终端设置，例如颜色、大小等……一个快速提示是通过删除 `#` 来取消注释\
  \ `#force_color_prompt=yes`，并确保 `yes` 在等号之后。这为终端添加了颜色，使单词显示不同的颜色。当你打开终端时，右键点击它，选择“配置\
  \ (profiles)”然后选择“配置偏好 (profile preferences)”。通过这里的选项卡，你可以自定义字体、大小、颜色、背景颜色等。如果你打算频繁使用终端，建议对其进行自定义，因为这有助于让你对将要使用的工具感到舒适。\n\
  \n### I/O 重定向 (I/O Redirection)\n\n在正常的终端命令执行期间，“正常输入”（用户输入，或从文件/属性/硬件读取）被命令输入并解析。有时命令还有“标准输出”，即在终端中显示的返回文本。在\
  \ `ls` 中，标准输入是当前工作目录，标准输出是文件夹的内容。\n\n输入和输出通常是直接的，但通过使用 I/O 重定向，我们可以让终端完成更多。例如，`cat`\
  \ 命令（连接）后跟一个文件会将该文件输出到屏幕。单独运行 `cat` 会打开一个解析器，其中输入的任何行都将立即输出（使用 `ctrl+d` 退出）。但通过\
  \ I/O 重定向快捷键（`<`, `>`, `<<`, `>>`, `|`），我们可以将输出重定向到另一个源，例如文件。`cat > test.txt` 现在将把标准输出放入该新文件中。双符号表示追加，因此\
  \ `cat >> test.txt` 将将输出置于文件末尾，而不是覆盖开头的内容。\n\n竖线字符或“管道 (pipe)”使用了 I/O 重定向的另一种形式，将一个命令的输出直接插入到另一个命令的输入中。`ls\
  \ | sort –r` 将获取 `ls` 的输出并反向排序。我们重定向了输出并将其交给另一个命令来完成操作。\n\n最后，`grep` 命令在 I/O 重定向中被频繁使用。`grep`\
  \ 可以在指定文件中搜索特定字符串并将结果返回到标准输出。通过重定向，此输出可以放入其他命令中。注意 Linux 的一个有趣特点是一切皆文件，甚至是硬件也是。所以我们的\
  \ CPU 实际上是一个存储相关数据的文件，我们可以使用 `grep` 和其他工具对其进行搜索。那个示例相当高级，但这里有一个更简单的实例：\n\n```bash\n\
  grep Conclusion report.txt\n```\n\n它将在文件中搜索那个特定单词。由于有所有新符号和命令，I/O 重定向可能会变成一个复杂的过程，但它是你可以整合到脚本和日常使用的一个功能，通常允许在单行内完成\
  \ Linux 的某些特性和功能。\n\nLinux 和终端是难以完全掌握的概念。但通过练习和持续的努力，你将能够完成大师级的计算操作，并执行在 Windows\
  \ 或 OSX 中无法实现的有用任务。学习更多命令及其使用方法对这方面非常有帮助，因此请继续学习新命令及其用法。你唯一真正需要记忆的命令是 `man`，该命令会显示任何其他指定命令的手册页和文档。利用这个工具的优势，对你的系统建立深入了解。\n\
  \n### 更多 Linux 信息\n\n\n\n\n\n为了继续学习 Linux 及其提供的各种可能性，请考虑本节中的示例。本节将简要讨论 Linux 的更多用途，以及其他尚未介绍过的概念。\n\
  \n### Linux 文件系统\n\n“Linux 文件系统”指的是计算机上文件和文件夹的主要布局。如果你在终端中继续执行 `cd ..`，或者在图形用户界面（GUI）上不断点击后退按钮直到无法再次移动，你就会遇到“根”（root）目录。这里的文件夹，如\
  \ `bin`、`boot`、`usr` 等是你的硬件和设置配置所在。每个文件夹都有特定的用途和功能，你可以通过探索其内容来理解它们。例如，用户数据存储在 `home`\
  \ 中，但用户程序存储在 `usr` 中。由于文件系统实际上非常多样且复杂，此处将不再进行讨论，但如果你想了解更多，可以在网上搜索或阅读与你的操作系统相关的文档。\n\
  \n### Linux 的各种用例\n\nLinux 系统通常用于桌面之外的其他用途。由于其提供的强大和稳定性，专用机器运行着 Linux 的变体。甚至我们的汽车也运行着\
  \ Linux 内核，用于跟踪错误代码并帮助机械师。\n\n服务器通常安装 Linux，是因为其可靠性以及发行版内部包含的功能。例如，Linux 机器用作防火墙，因为\
  \ `iptables` 应用程序提供了优秀的端口拦截和智能过滤。你也可以通过该应用程序在你的系统上运行防火墙，从而免费获得企业级软件。通过这种方式，Linux\
  \ 也适用于网络。只需安装相关的应用程序，该机器就可以充当交换机、路由器、DNS 服务器、DHCP 服务器等。\n\n最后，Linux 系统不仅限于我们目前所看到的界面。每个发行版都有其偏好的桌面环境（DE），但界面可以根据个人的喜好进行极大的自定义。终端甚至有文件和网络浏览器，这对于那些使用\
  \ `SSH` 或远程计算的人来说非常有帮助。总而言之，你应该尝试通过安装并配置不同的桌面环境来根据你的喜好进行调整。\n\n## 接下来做什么与结论\n\n\
  你如何继续取决于你想对你的 Linux 发行版做什么。对于普通浏览和简单使用，请继续使用 Ubuntu 并安装你需要的程序。对于更具冒险精神的人，可以考虑安装一个新的发行版，看看每个版本提供什么。希望更深入地学习\
  \ Linux 的人可以安装如 `Arch` 或 `DSL` 等系统，从零开始构建自己的独特操作系统。管理员和高级用户可以安装发行版的服务器版本来构建自己的 Linux\
  \ 网络，或者他们考虑将环境从其他操作系统切换到完全免费的系统。\n\n结论是，Linux 是一套强大且相对易于使用的操作系统。但它们真正的潜力来自于难以精的终端和命令行功能。感谢阅读本出版物，希望它能为这个“事实上的替代操作系统”这一神秘主题提供一些启发。如果\
  \ Linux 让你感到困惑或没有达到预期，我恳请你再次审视它能提供的功能。虽然它可能没有同等水准的游戏或第三方专有软件，但该操作系统足够简单且可定制，可以作为主操作系统，而将\
  \ Windows 或 `OSX` 作为辅助操作系统。几乎每个程序都有替代方案，因此如果可能完全摆脱微软和苹果，强烈建议你这样做。再次感谢，并好好利用你的新 Linux\
