- "# 数据分析与 Linux 操作系统合集教程：使用 Linux 操作系统学习数据分析、预测性分析与数据科学初学者指南\n\n\n\n![](img/cover00115.jpeg)\n\
  \n\n\n\n\n![](img/image00106.jpeg)\n\n# 快速目录\n\n本书包含“黑客自由与数据驱动”系列中的两份手稿。它本质上是两本书合为一本。\n\
  \n数据分析 将帮助你学习如何利用数据分析、数据科学和预测性分析的力量。\n\n黑客大学高级版 将开启你学习主宰 Linux 操作系统的之旅！\n\n\n\n\
  ![](img/image00107.jpeg)\n\n\n\n\n\n\n\n\n## 本书预览\n\n你是否想过使用数据分析来支持你的业务？\n\n对于许多企业来说，数据分析可以做到这一点。它是一个观察业务状况的绝佳系统，你可以通过它收集信息并形成结论。但它是如何工作的呢？它的微妙之处何在？这正是本书大显用场的地方。\n\
  \n在书中，你将学到：\n- 什么是数据分析\n- 大数据的重要性\n- 如何进行数据分析\n- 为什么企业现在以及未来需要它来实现成功和繁荣\n\n通过数据分析，你可以拯救你的业务，本书将进一步向你证明这一主题的重要性、它能为你做什么，以及你如何利用数据分析让你的业务大放异彩并成长\n\
  \n\n## 引言\n\n我想感谢你并祝贺你下载了这本书\n\n《数据分析：转型和进化任何业务的实用数据分析与统计指南，初学者利用数据分析、数据科学和预测性分析的力量》\n\
  \n本书包含了关于如何精通大数据、数据分析和预测分析的经过的步骤和策略，即使你从未学习过统计科学。本书将带你从数据分析的初始概念开始，一直学习到处理信息、构建你的组织结构，甚至涉及数据管理中的安全问题。通过书中包含的知识，企业主可以在即使规模最小的企业中创建并安装大数据分析。\n\
  \n数据分析已被证明能够改变商业世界。那些使用数据分析进行决策的公司正远远领先竞争对手。凭借分析师提供的知识，企业主在营销、销售和预测方面做出更好的业务决策，这仅列举了几个有用功能。\n\
  \n# 第 1 章：数据分析的重要性以及为什么你的业务应该使用它\n\n数据分析是这十年的热词。从医疗保健到大企业，每个人都在讨论和推广数据分析。小型企业和跨国公司都在推扬利用大数据转型业务实践的优势。仓库、货运公司和供应商对他们使用数据挖掘来改进组织所节省的资金赞誉有加。这是炒作，还是一个全新的赌场，每次拉动老虎机手柄（在本例中为数据集）都能提供现金？\n\
  \n数据分析（`DA`）是解释原始数据的过程，目的是告知个人（或群体）从数据中得出的结论。数据分析用于整个行业以做出库存、现金流、销售预测、客户特征和防损策略的业务决策，这仅列举了几个实际用途。在科学领域，数据分析用于证明和反驳理论。\n\
  \n业务分析和大数据的概念自 20 世纪 50 年代以来一直存在用于预测消费者市场的洞察和趋势。六年前的数据收集与现在的区别在于，现在的信息几乎是实时的。今天企业可以在三十分钟内收到信息以做出做出业务决策。这使得使用数据分析的公司比不使用的公司具有巨大的竞争优势。\n\
  \n\n\n\n如今企业高管接收的数据是详尽、快速且可靠的。这使得决策者能够在收到所需信息后的几分钟内确定最佳行动方案，而不是像以前那样需要几周、几个月甚至几年。\n\
  \n企业正在挖掘数据矿，以多种方式利用信息，包括但不限于：\n\n1. **数据存储成本降低。** 1981 年，存储 1GB 信息的费用是 700,000 美元。到\
  \ 1996 年，这一成本下降到 295.00 美元，而到 2014 年，同等存储成本仅为 00.03 美元。（来源：[`www.mkomo.com/cost-per-gigabyte-update`](http://www.mkomo.com/cost-per-gigabyte-update)）\n\
  \n2. **研发实时数据的机会。** 客户现在对自己的需求和想要表达非常直接。在 Twitter 上发布新产品可以快速判断人们对创新产品设计的兴趣。数据分析为市场趋势的研发提供了即时反馈。\n\
  \n3. **库存与产品分析。** 通过数据分析，公司可以了解货架上什么很受欢迎，哪些产品需要清理灰并移出商店，腾出宝贵的货架空间。为什么杂货店将利用率最高的产品放在最顶层和最底层？他们知道这些产品总是畅销，但利润率最高的产品位于消费者的视线水平。\n\
  \n联想曾为客户设计一款新键盘，但未能识别出其游戏行业的忠实客户群。在采用数据分析后，联想改变了设计以纳入游戏者的需求，并推出了一款带来数百万销售额的优秀产品。数据分析拯救了他们的产品并增加了利润。\n\
  \n数据分析绝非局限于零售行业。其他企业也使用数据分析来提高盈利能力和效率。以下是目前行业正在采用的一些用途：\n\n## 旅游与酒店业\n\n客户满意度很难衡量，但它是企业繁荣的关键。大数据分析让管理层在客户办理入住、决策点、甚至离开设施时，能够立即获取客户偏好。这让管理层有机会在问题发生时进行纠正，将潜在的客户关系“炸弹”变为所有利益方满意的体验。\n\
  \n## 医疗保健\n\n在医疗保健行业，大数据正在改变记录保存、研究分析以及患者护理管理的方式。结果是提供了一种更好的患者护理方法，通过计算机记录，无论患者接受何种治疗都能进行追踪。此外，有时由于查询的即时信息，可以立即获得新的疗法或药物。医院的人员配置也通过数据分析发生了转型，允许医疗机构在高峰安排更多人员，在低峰期安排较少人员。\n\
  \n## 政府\n\n地方警察部门正在使用数据分析来确定犯罪统计最高的区域（这些区域增加步行巡逻更有利），甚至是入室盗窃和轻微犯罪的高峰时间。分析技术可以精确定郊区或城市的问题区域，而无需牺牲有限的人力进行监控。\n\
  \n## 中小型企业\n\n中小型企业在收集数据方面与大型机构拥有同样的机会，但记住这些策略将很有帮助：\n\n要进入消费者的主流市场，企业必须具备数字化形象。购物服务和产品的客户及客户会去网站和社交媒体寻找意见、报告、比较和评论。\n\
  \n网站应该是简单且诚实的的。它还应该描述产品或服务的益处，而不夸大或误导。消费者看到炒作就会知道，并会刻意避开那些作为潜在信息或产品渠道的网站。网站应该具备提供信息和收集信息的能力。\n\
  \n网站分析将收集客户的人口统计数据、他们的兴趣、进入点、无聊点和“离开”点，以及他们喜欢的社交媒体网站。\n\n如果网站设计得当并具有许多互动点，客户或顾客会在意识到自己被“挖掘”之前就明确他们的需求和想要。\n\
  \n## 小企业示例\n\n这是一个使用大数据的小企业的良好示例：\n\n当地一家面包店发现巧克力曲饼的销量非常火爆，网站和电话订单都是按打计的。然而，巧克力杯蛋糕的销售变得越来越慢。烘焙师阅读了网站上的评论，发现了这条看似不起眼的评论：“我喜欢巧克力杯蛋糕和巧克力曲饼，但我只花\
  \ 2 个杯蛋糕的就能买到 12 块巧克力曲饼。”\n\n这一数据对烘焙师来说是一个“顿悟时刻”。烘焙师迅速为饼干销售制作了一个独立页面（以延续巧克力曲饼的趋势），但并将全尺寸杯蛋糕的产品供应改为迷你杯蛋糕。四个迷你杯蛋糕的价格与一打巧克力曲饼相同。烘焙师还在\
  \ Facebook 列表上发布了优惠券特惠：“提及此广告，购买一打杂锦饼干，即可获得一个自选的免费迷你杯蛋糕。”所有饼干和新产品的销量都因此增加了。\n\n\
  # 第 2 章 如何处理大数据\n\n## 大数据及其问题\n\n大数据是指由于规模过大、无组织或非结构化，无法使用目前数据管理中使用的传统技术和方法进行分析的挖掘数据。数据的数量并不如数据如何使用和分类重要。\n\
  \n大数据分为三个领域：容量（volume）、速度（velocity）和多样性（variety）。企业被海量数据淹没，需要识别和利用这些数据集的方法。\n\n\
  无论管理问题如何，大数据对企业或组织仍然非常有价值。大数据让信息变得透明且可用。现在组织正在收集更大数量的数据，以数字格式存储比以前用磁带存储要便宜得多。管理层利用性能数据来探索病假、员工迟到、产品库存、移动甚至存储容量的趋势。其他企业正在利用数据进行预算预测和购买决策。\n\
  \n大数据帮助企业对客户群进行细分，以便根据客户的需求和欲望定制产品。更重要的是，大数据正被应用于研发，以改进下一代的服务和产品。\n\n## 获取和掌握大数据\n\
  \n公司现在必须使用新的存储、计算、收集、分析和技术来捕捉并处理大数据。尽管不同公司的技术挑战甚至优先事项有所不同，但它们面临着相同的问题：旧的计算机系统、不兼容的格式以及数据集成整合阻碍了对数据库信息的解释。\n\
  \n目前有新的方法可以处理数据以协助大数据的质量管理。最好的方法会在做出决策之前分析数据的容量、多样性和复杂性。\n\n大数据在数据库管理系统方面有开源技术，包括\
  \ `Hadoop` 和 `Cassandra`。市场上还有几种商业智能软件产品可以向所有主报告、展示和分析最终产品。\n\n\n\n据估计，企业仅使用了其收到的信息的\
  \ 5%。这留下了巨大的改进空间，可以通过用于大数据分析的工具栈和实施来填补。首先，这涉及到对存储、计算、可视化软件和分析软件的需求。此外，还需要额外的人员，可能还会建立一个\
  \ IT 部门。\n\n投资大数据能带来投资回报率（ROI）吗？简而言之，答案是肯定的。麦肯锡全球研究院预计，正确利用大数据的企业其运营利润可以提高 60% 以上，这是一个巨大的数字。\n\
  \n以下是建议在组织中实施大数据的步骤：\n\n* 盘点所有相关数据资产\n* 转变管理模式以采用数据驱动的世界观\n* 开发技术实施\n* 处理包括数据安全、隐私和所有权的政策问题\n\
  * 识别机会与风险\n\n数据安全尤为重要。数据库包含机密信息，可能是商业秘密、个人医疗信息，甚至是受版权保护的。数据应该是集中且安全的。由于数据量巨大，且维持此类做法需要大量的时间和人力，加密并非可选。数据库保护始于前面提到的第一步：盘点所有输入源。只有在分析了贡献源的范围后，企业才能确定哪些安全措施需要重新构建，以及哪些特定产品可以胜任工作。\n\
  \n# 第 3 章 数据管理的优势与挑战\n\n很久以前，企业主会看一个新产品，听取供应商的推销演示，并根据他们的“直觉”来决定是否购买该产品。就像带有邮局和加油站的杂货店，那种日子已经过去了。\n\
  \n这是一个信息时代。企业必须跟上趋势、市场动态、消费者偏好和经济压力，以便就其市场定位做出适当决策。海量的可用信息需要受过教育的人员来熟悉且准确地解读提供的数据。\n\
  \n克利夫兰的凯西储储立大学近期宣布，很快将短缺 19 万名分析人员和 150 万名数据经理。这个问题将主要影响中小型企业，因为它们无法在有限的预算内聘请专职数据分析师。\n\
  \n根据《福布》杂志，去年具备大数据技能的信息技术项目经理需求增加了 123.6%，具备大数据技能的计算机系统分析师增加了 89.8%。\n\n（来源：[`http://www.forbes.com/sites/louiscolumbus/2014/12/29/where-big-data-jobs-will-be-in-2015/#2caeda00404a`](http://www.forbes.com/sites/louiscolumbus/2014/12/29/where-big-data-jobs-will-be-in-2015/%232caeda00404a)）\n\
  \n即使企业能够获得数据分析能力，除了如何使用提供的信息外，企业仍面临挑战。其中一个挑战就是数据管理。\n\n数据管理是对数据和收集的信息进行组织化管理，以解决安全、访问限制和存储问题。数据管理要求的任务包括治理政策、数据库管理系统、数据系统集成、数据安全、源识别、数据隔离和存储问题。\n\
  \n## 有效数据管理的关键\n\n数据管理问题并不是新困境。只要数据被收集起来，企业一直在处理保持数据纯净这一性问题。现在，随着数据量的增加和营销自动化的发展，数据安全已成为问题领域的尖端。\n\
  \n如果数据不干净或不相关，对营销和业务首席官来说毫无用处。数据管理需要持续的监控，因为黑客正等待攫取并破坏数百万相关的信息和资源。对于数据安全问题，很少是应该是自动化的，例如：\n\
  \n### 1. 限制访问\n\n很多时候，对材料和信息的访问对所有员工开放以进行修改。办公室经理、销售人员和办公室员工不应具有进入数据库并更改、访问、删除或添加信息的权限。控制这种情况的最佳方法是建立边界，即限制访问。\n\
  \n根据特定功能设置控制措施，例如，营销人员仅限于查看市场数据而不能编辑。确定组织中由谁来执行所有数据更改，包括添加/删除和操作（如更改客户的联系信息）。建立数据导入和导出规则，以确保安全数据不会流出，且病毒不会被上传。创建数据主列表，使信息既不重复也不被破坏。\n\
  \n### 2. 创建数据地图\n\n数据地图是描述数据路径的流程图，勾勒出输入和输出、部门集成以及每个数据条目的用途。数据映射是一项持续的练习，用于维护控制和数据一致性。\n\
  \n### 3. 分段组织你的数据\n\n数据不在于数量，而关乎质量。如果你的客户只有数百人，数据库里有几百万个名字毫无用处。如果你没有检索组织，数据库里有几百个名字也没有帮助。\n\
  \n相反，根据你的需求对数据进行分段。例如可以按性别、年龄、人口统计特征、邮政编码、联系偏好等。正确地细分数据库可以让数据产生潜力，而混乱的数据库看起来和感觉就像一团糟。\n\
  \n从你目前的活跃客户群开始。将他们按人口统计特征分段，然后按购买习惯分段。定期与客户联系，收集他们对你产品和服务的意见。\n\n### 4. 数据卫生\n\n\
  数据卫生是保持数据清洁和实新的过程。旧数据和损坏的数据只会干扰你的数据库，甚至可能感染你所有的记录。与之前的功能一样，卫生应定期进行，以确保数据不会腐败或污染。\n\
  \n维护纯净和有序数据库的重要性不容忽视。如果数据不好，即使联系点正确，所有的所有的营销项目也无法成功。为了增强营销和销售努力的价值，请不要忽视数据管理。\n\n\
  # 第 4 章 数据管理的现实案例\n\n低效使用的示例\n\n* 约翰·贝尔鲁希 (John Belushi), 33 岁\n* 克里斯·法勒里 (Chris\
  \ Farley), 33 岁\n* 吉米·亨德里克斯 (Jimi Hendrix), 27 岁\n* 菲利普·西摩·霍夫曼 (Philip Seymour Hoffman),\
  \ 46 岁\n* 惠特妮·休斯顿 (Whitney Houston), 48 岁\n* 迈克尔·杰克逊 (Michael Jackson), 50 岁\n*\
  \ 珍妮·乔普林 (Janis Joplin), 27 岁\n* 希斯·利杰 (Heath Ledger), 28 岁\n* 考瑞·蒙西斯 (Cory Monteith),\
  \ 31 岁\n* 瑞弗·菲克斯 (River Phoenix), 23 岁\n* 埃尔维斯·普斯利 (Elvis Presley), 42 岁\n* 王子 (Prince),\
  \ 57 岁\n* 安娜·尼科尔·史密斯 (Anna Nicole Smith), 39 岁\n* 艾米·酒酒斯 (Amy Winehouse), 27 岁\n\
  \n来源：[`http://www.usatoday.com/story/life/people/2016/06/02/celebrities-who-have-died-addiction/85314450/`](http://www.usatoday.com/story/life/people/2016/06/02/celebrities-who-have-died-addiction/85314450/)`\n\
  \n这些名人有一个不幸的共同点：他们都在过过年轻的年纪死于药物过量。\n\n\n\n\n\n处方药物监测计划可以告知处方者（医生和护士执业医师）和配药师（药师），建立针对阿片类药物滥用和流用的控制措施，这是上述死亡事件的主要原因。名人仅占因药物过量导致死亡总人数的极小比例。美国疾病控制与预防中心（`CDC`）已证实，这是美国意外死亡的首要原因。在最近发布的数据分析中，确定\
  \ 2014 年有超过 47,000 例药物过量死亡。其中处方止痛药导致了这些死亡中的 18,893 例。\n\n来源：[`www.cdc.gov/nchs/data/health_policy/AADR_drug_poisoning_involving_OA_Heroin_US_2000-2014.pdf`](http://www.cdc.gov/nchs/data/health_policy/AADR_drug_poisoning_involving_OA_Heroin_US_2000-2014.pdf)\n\
  \n这些药物的名称在手术、手臂骨折或几乎任何需要去当地医院急诊室的情况下都是常见的处方药：`Percocet`、`Lortab`、`OxyContin`、`Fentanyl`、`Vicodin`、`Morphine`\
  \ 和 `Xanax` 只是其中的例子。`Xanax`是一种苯二唑类药物，不是止痛药，但与阿片类药物一起服用是致命的，即使只是一剂的最小剂量。\n\n为了防止这种药物过量的流行病，各州已建立建立数据库来监控这些产品的处方情况。该数据库包含了剂量、处方配药的频率以及处方医生，以确定哪些患者可能挪用或误用药物剂量，以及哪些患者在三十天内频繁出入不同的医生和医院以获取更多药物。\n\
  \n这个概念非常棒：拥有一个数据库，整合来自药店和医护人员的各种及多个来源的数据，来对抗这一问题。遗憾的是，该数据库存在几个问题，阻了有效管理。\n\n* 数据源自多个来源，既耗时又复杂。\n\
  * 数据是不完全的，因为许多医生没有花时间查询数据库。尽管在 49 个州强制安装该系统，但只有 22 个州要求合规，而且没有人监控合规性。\n* 人员太少，无法对信息进行实时分析。信息被输入数据库，但没有被有效检索。\n\
  \n`SAS Institute` 的领先数据分析专家在`Data and Analytics to Combat the Opioid Epidemic`报告中已经了这一问题。他们的观点是，目前的信息几乎无法使用。\n\
  \n来源：[`www.sas.com/en_us/whitepapers/iia-data-analytics-combat-opioid-epidemic-108369.html`](http://www.sas.com/en_us/whitepapers/iia-data-analytics-combat-opioid-epidemic-108369.html)\n\
  \n通过更好的分析和解读，医生可以制定改进的治疗方案、患者教育和政策边界。例如：\n\n* 医生可以与其同行的治疗方案进行比较，以确定早期药物成瘾的特定模式。\n\
  * 保险和政府支付系统可以记录潜在的误用或流用，避免支付欺诈费用的成本。\n* 大型医院和公共卫生系统可以开发更好的教育计划、治疗方案和资源决策。\n* 药店可以比较其配药数据，以确定滥用方面的地理重叠等因素。\n\
  * 各州可以根据人口统计信息利用数据库为治疗中心提供资金。\n\n整合和细分数据可以通拯救生命来缓解那些可怕的新闻标题。\n\n## 有效使用的一个示例\n\n\
  一位著名的中型企业主通过使用`Data Analytics` 发现了 400,000 美元。他似乎丢失了 1,000 件库存，这阻碍了他非常渴望的现金流。在他开始盘点的第一天，他发现了这些问题。\n\
  \n（注：原文此后内容似乎存在逻辑跳跃或重复，此处已按原文意思进行翻译）\n\n\n\n\n\n## 诊断性分析\n\n诊断性分析侧重于过去的问题，以识别情况发生的涉及、什么什么以及为什么。这种分析可以使用分析仪表板或小组件（widgets），帮助读者一目了然地获取信息。诊断性分析的一个示例是检查销售活动或社交媒体营销活动。通过`widgets`，用户可以看到帖子数量、访问者人数、评论和点赞数量、页面浏览量以及客户反馈。一目了然地看到这些分析而不是翻阅报告，可以更快地掌握数据的要点。利用诊断性分析可以解释营销活动未能增加特定产品销售额的原因。\n\
  \n## 描述性分析\n\n这类分析提供关于当前状况的实时数据。它提供的不是上周甚至昨晚的数据，而是此时正在发生的信息。描述性分析的一个用用例是为想要购买新汽车的客户提取当前的信用报告。通过检查过去的行为来评估当前的信用风险并预测未来的信用状况，将帮助销售经理判断潜在客户能够或将会履行信用合同。\n\
  \n大数据分析将为公司的投资回报率（ROI）带来了一定的价值，因为它填补了关于客户表现和产品销售的空白。通过将海量数据简化为易于管理的信息块，企业主可以就人员、销售、利润和产品差异做出更佳的业务决策。\n\
  \n# 第 6 章：它们协同工作：数据管理、数据挖掘、数据集成和数据仓库\n\n关于大数据的术语有很多；本书的这一部分识别了处理大数据后勤问题时最有用的术语。\n\
  \n## 数据管理\n数据管理是对流入、流过及流组织的数据访问和质量施加限制的过程。限制可能包括限制访问、防止病毒和损坏数据的安全措施，以及维护问题。\n\n\
  ## 数据挖掘\n数据挖掘是筛选数据以提取模式和相关信息，以解决业务中当前问题的过程。通过软件，数据挖掘可以从海量数据中消除所有的混乱。\n\n## Hadoop\n\
  这是一种开源软件（意味着它是免费的！），用于在通用硬件上存储数据并运行判别性应用程序。它是筛选不断轰集的数据集中的倍倍数据信息的关键。它以处理数据的速度快而闻名。\n\
  \n## 内存分析\n通过研究框架内存（而不是你的硬盘驱动器）中的信息，你可以从信息中获取时的知识片段并进行快速跟进。这种创新可以消除信息准备和调查处理的延迟，从而测试新情况并建立模型；这不仅是企业保持敏捷并做出更好业务选择的简单途径，同样赋予了他们运行迭代和智能分析场景的能力。\n\
  \n## 预测性分析\n预测性分析利用统计算法、机器学习技术和数据，根据以前的使用模式来识别预测结果。它是对以后将发生的情况提供最佳评估，以便企业能够更有信地正在做出最佳业务选择。预测性分析最常见且基础的应用包括误报和欺诈、风险管理、运营管理和营销功能。\n\
  \n## 文本挖掘\n在利用文本挖掘技术时，你研究的企业从全球网上、评论、文章和其他文本源中提取文本数据，以发现以前未见的洞察。文本挖掘结合机器学习和语言处理，以评估和排序博客、馈、竞争对手情报、电子邮件、评论和调查问等网络文档，协助企业分析大量信息并发现趋势和隐藏的关系。\n\
  \n## 数据集成\n数据集成是将向旧计算机系统添加新信息和数据，同时保持数据内容整洁且未损坏。有效地移动数据已成为以下领域面临的挑战：\n\n*   **数据需求**\n\
  \    以所需的格式交付正确的数据以缓解业务需求是数据集成的主要原因。每个新的数据源都可能影响其迁移到的之前的信息集合和系统。\n*   **预判业务需求**\n\
  \    如果数据不能及时提供，它就没有帮助。集成必须能够同时管理批量信息和实时信息。\n*   **确保所有数据都标记了相关信息**\n    旧系统没有在服务器中对活动进行时间戳或日期。为了快速识别对数据进行的更改，数据集成需要记录这些信息。\n\
  *   **对所有输入数据保持怀疑**\n    预期来自其他来源的数据是自然的，但要警惕它们可能被感染或其他损坏。扫描所有输入的内容以检查兼容性和集成需求。\n\
  *   **验证客户信息**\n    将迁入的数据与主数据库进行比较，以确认客户数据库是正确且最新的。\n*   **保留每次更改的历史记录**\n    有时为了法律合规性，需要回溯更改，而且当集成工作没有按预期工作时经常需要这样做。\n\
  *   **升级系统并评估流程**\n    不断寻找系统可能无法满足你业务需求的方法。定期升级系统，以确保你拥有数据管理和集成需求的最可能的解决方案。\n\n\
  ## 数据仓库\n数据仓库是组织为其准备的电子数据的存储。数据的存储必须是可靠的、未受损害的、安全的、易于检索和易于管理的。\n\n# 第 7 章：为你的业务进行数据分析\n\
  \n我们在书中始终强调企业中对数据分析的必要性，但我们还没有解释具体如何收集数据。本章将侧重于基础数据收集，以便你可以实施进一步促进组织目标的策略。\n\n##\
  \ 逐步操作指南\n\n### 什么是收集数据？\n基本上，聚集已收集的数据意味着让你的数据收集配置运行。你已经选择了如何获取数据——无论是通过直接感知、访谈、概览、调查和测试，或其他技术——现在你和/或其他观察者需要执行你的方案。收集数据不仅于此，无论情况如何。你需要以合适的方式记录信息。\n\
  \n\n\n\n以更易于处理的方式组织数据。\n\n你如何做到这一点将取决于你的研究设计和评估问题。你可能会根据它们所认同的`独立变量`（成就的指标）、个人或成员群体、时间、移动等等来汇集感知。你可能同样需要以几种独特的方式对收集到的信息进行分组，以便考虑各种变量之间的交互和关系。\n\
  \n数据中有两种变量。`独立变量`（干预措施）是分析师或小组执行的一项条件，用于检查它是否会产生变化并改善状况。这可以是一个项目、策略、框架或其他活动。`依赖变量`是由于`独立变量`或干预措施而可能发生的情况。`依赖变量`可以是一种行为或结果。\n\
  \n## 我们如何检查数据？\n\n调查数据包括以某些方式观察数据，以揭示内部可以发现连接、设计、模式等。这可能意味着对数据进行统计操作，让你不仅能知道变量之间似乎存在何种联系，还能知道你对所获得的答案有有多大的信任程度。它可能意味着将你的数据与来自不同数据集（控制组、全州数据等）进行对比，从而从信息中得出一些推论。就你的评估而言，重点在于获得精确的评估，以便更好地理解你的工作及其后果。\n\
  \n你将使用两种信息，尽管并非所有评估从根本上都会包含两者。`定量数据`指的是作为数字收集或可以解释为数字的数据，这些数据随后可以通过数学方式进行展示和分解。`定性数据`是以描述、叙述、结论、引用、理解等形式收集的，很大程度上无法还原为数字，或者如果作为叙述会被认为更重要或更具启发性。正如你预期的，定量和定性数据应该以不同的方式进行分析。\n\
  \n## 定量数据\n\n`定量数据`以数字形式收集。定量数据`的示例包括：\n\n* 特定行为或情况的频率（速率和时长）\n* 调查结果（报告的行为、客户满意度评分等）\n\
  * 人口统计中具有某些特征的人的百分比（糖尿病患者、肥胖、心脏疾病指标、教育水平等）\n\n数据也可以以非数值的方式收集，并转换为准备好分析的定量数据。`编译器`可以为特定行为的强调程度分配数字。例如，`编译器`可以统计\
  \ Facebook “点赞”或“评论”的数量。这类信息是否必要或有用取决于你的数据旨在回答的问题类型。\n\n`定量数据`转换为统计程序，例如计算事件重复的平均次数。这些计算因为数字是精确的，可以为各种问题提供确定的答案。`定量分析`可以识别与`依赖变量`相关的变化——持续时间、频率、时机、强度等。这允许与与类似的问题进行比较分析，例如某个邮政编码内人口数量的变化，或年龄相似的女性之间购买变化。\n\
  \n## 定性数据\n\n与数字不同，定性信息被认为是“软”数据，意味着它不能还原为特定的结论。数字可能指示人口统计中的数量，但软性数据可能通过客户的态度和外表告诉你购物者的压力水平。\n\
  \n`定性数据`偶尔可以转换为数字，通过计算特定事件发生的次数，或通过为重要性水平、客户满意度或在网站上订单时某个`函数`是否对用户友好分配数字。\n\n将定性数据翻译为定量数据取决于人为因素。即使客户同意使用数字\
  \ 1-5（1 表示非常不满意，5 表示非常满意）来评估客户满意度，仍然存在 2、3 和 4 在评估量表上处于何位置的问题。数字只提供部分评估；它们没有提供关于客户评分“为什么”的任何信息。客户不开心是因为货架上的产品库存、产品细节、商店氛围或音乐的问题、商店的位置等吗？\n\
  \n同样，在统计特定行为的特定实例时，计数器是否包含了那些表现出部分行为的人（例如，点击了“点赞”但没有在 `Facebook` 上评论的人）？\n\n`定性数据`可以提供定量数据中无法获得的特定知识，例如为什么营销活动有效，或者该活动如何在文化上与客户群产生冲突。（1962\
  \ 年，雪佛兰汽车困于为什么他们新的“Nova”在美国非常，但在墨西哥几乎没有销量。研究人员未能将“Nova”一词翻译成西班牙语，而它的意思是“无法移动”。该汽车名称的西班牙语俗语是“不运转”。难怪墨西哥的销量下降了！汽车被更名为\
  \ Caribe，销量随之增加。）\n\n评估定量和定性数据集通常是有帮助的。\n\n## 收集和分析数据的步骤是什么？\n\n* 清晰地设计和定义回答问题所需的测量方法。\n\
  * 在正确的时间范围内针对需要的时间进行研究。\n* 根据数据的`函数`组织数据；你将如何使用这些信息？\n* 如果可能且合适，将定性数据转换为定量数据。\n\
  * 使用图表和可视化图表（示例见第 10 章）使数据更容易被吸收。\n* 从视觉上检查信息的模式以识别趋势和联系。\n* 像寻找定量数据一样寻找定性数据中的模式。如果人们反复提到类似的问题，这些可能对于理解问题和可行的解决方案至关重要。\n\
  \n使用以下类别之一来解释发现：\n\n* 你的营销计划符合目标，没有明显问题。\n* 你的营销计划对销售没有显著影响。\n* 你的营销计划对销售产生了负面影响。（可能它被消费者认为具有冒犯性或愚蠢。）\n\
  * 你的营销计划结果不一。推广的产品卖得很好，但以前受欢迎的产品销量可能下降了。例如，Secret 除臭剂提供了一种非常受欢迎的新香味类别，但无香味产品的销量大幅下降，因为忠实用户只是切换了他们的偏好。\n\
  * 如果分析显示你的营销计划正在生效，你有一个简单的选择：继续该计划或对其进行微调以期增加销量。\n* 如果分析显示计划不起作用，解释就会变得更加复杂。公式中缺少了什么？什么因素阻止了预期结果产生？\n\
  \n分析和解释结果让你在过程中形成了一个闭环；现在你可以利用所得的知识来调整你的业务并改进服务。继续分析和评估业务目标和结果将使业务在市场上保持活力并有效存在。\n\
  \n# 第 8 章 数据分析的组织方法\n\n本章讨论了在将大数据纳入企业文化的组织中需要建立的框架。可行的分析治理将使企业能够利用大数据来获得竞争优势。\n\n\
  ## 框架\n\n\n\n\n\n为了整合信息技术、商业智能和分析功能，必须考虑四个核心问题：\n\n1. 分析是否是业务的核心组成部分，是否与财务、销售、产品开发、研究和营销处于同一类别？\n\
  2. 是否配备了合适的人员？\n3. 人员是否具备深度理解业务需求的能力？\n4. 是否建立了相应的治理结构？\n\n该框架被称为 `CSPG` 框架。\n\n\
  ### CSPG 框架\n\n#### 文化 (Culture)\n- 业务是围绕数据分析开展的，还是分析让位于营销、研发和销售之后？\n\n#### 人员 (Staffing)\n\
  - 人员配置是否充足？招聘合格的人员是否是首要任务？IT 部门是在预算极其紧张的情况下运营，还是拥有进行大数据分析的妥当资源？\n\n#### 流程 (Processes)\n\
  - 如果分析过程执行正确，数据就可以与类似的组织进行交换而不必担心污染，从而实现多路信息流。\n\n#### 治理 (Governance)\n- 对于近期才接触数据分析的企业来说，治理是一个新概念。治理需要一个涵盖人员、结构和薪资的体系，以确保\
  \ IT 部门与其他部门保持一致。\n\n## 分析功能在业务中的布局\n\n数据分析功能的布局有三种模型：\n\n1. **将分析部门置于中央单元。** 这种位置的优势是容易获取数据、更容易融入公司文化，且数据检索速度更快。集中化部门面临的挑战可能是位置问题（作为一个附加部门，它可能远离决策者中心），可能对部门向谁汇报产生困惑，而且数据分析师可能离公司文化太远，导致无法预测业务需求。\n\
  \n2. **第二种可能性是将分析工作去中心化，将分析师部署在公司的每个部门。** 这允许分析师专注于他们所属的业务领域。挑战在于如何合作完成不分段的公司级项目，这些项目需要所有分析师集中在一个问题集上。\n\
  \n3. **第三种选择是前两种方案的混合。** 这种方式将分析师放在中心位置，同时也向整个组织中部署分析师。这需要庞大的分析师团队，这可能是业务面临的最大挑战。\n\
  \n## 关键分析\n\n分析由模型、基础设施和运营组成。模型是源自统计数据的统计型、预测型或数据挖掘模型。分析过程的关键在于构建模型，这通常由分析师、数据科学家或统计学家完成。\n\
  \n基础设施是用于数据管理、数据处理和决策的软件组件、应用程序和所用平台。与分析基础设施相关的流程包括数据管理、模型部署以及必须纳入业务运营的多种分析。\n\n\
  运营是创建用于模型的数据以及用于业务的行动的过程。数据可以通过购买、内部产生、外部或协作获取。\n\n数据分析团队必须识别内部和外部相关数据、管理数据、构建分析模型并将模型引入内部系统。大多数企业按如下组织这些功能：业务部门请求模型，分析团队构建模型，IT\
  \ 部门提供原始数据，而运营部门发布模型。这引出了分析治理的必要性。\n\n## 分析治理\n\n企业在提取大数据时面临的三个挑战是：\n\n1. 识别数据将要使用的独特需求\n\
  2. 获取所需信息\n3. 将分析模型部署到组织中\n\n分析经理必须拥有足够的权限来应对这些挑战。治理结构需要一种机制来识别、沟通和解决源于数据分析问题的问题。分析经理还需要灵活性来招聘合格且具备专业知识的人员。\n\
  \n# 第 9 章：数据可视化\n\n可视化让数据在读者面前变得生动。信息列表在尝试翻译为可用数据时可能很费力；将数据组转换为易于管理的形式，对于帮助读者区分重要信息和多余信息至关重要。\n\
  \n使用图形设计软件可以吸引人们注意关键统计数据，通过使用视觉图像，可以发现可能无法检测到的隐藏模式和联系。\n\n以下是可以在网上易于访问的免费数据可视化软件列表：\n\
  \n- **Chart.js**: `http://www.chartjs.org/`\n该程序提供 6 种不同的 HTML5 图形，是最流行的小型图表程序之一。\n\
  \n- **Dygraphs**: `https://dygraphs.com/`\n这是一个可自定义的 JavaScript 图表工具，兼容几乎所有浏览器，用于密集数据集。它支持移动设备和平板电脑。\n\
  \n- **FusionCharts**: `http://www.fusioncharts.com/`\nFusionCharts Suite XT 提供了\
  \ 90 多种图表、965 种数据地图以及自定义的交互式业务仪表板。FusionCharts 兼容 AJAX 应用并可配合 `JavaScript API` 使用。\n\
  \n- **Instant Atlas**: `http://www.instantatlas.com/`\nInstant Atlas 将统计数据与地图数据结合，这对于人口统计信息非常有用。\n\
  \n- **Raw**: `https://raw.densitydesign.org/`\nRaw 是自定义且可修改的，可以从应用上传到计算端，导出为 SVG\
  \ 或 PNG，可以嵌入网页，并提供基于向量的图像。\n\n- **Tableau**: `http://www.tableau.com/`\nTableau\
  \ 允许用户拖放数据以立即更新到实时图表中。\n\n- **Timeline**: `https://timeline.knightlab.com/`\nTimeline\
  \ 提供了事件的详细分析，并提供点击打开图表以获取更具体信息的能力。\n\n- **Visual.ly**: `https://visual.ly/`\nVisual.ly\
  \ 是一个画廊工具和信息图工具。通过 Visual.ly 可以创建惊艳的数据表示，且制作简单。\n\n- **Visualize Free**: `https://visualizefree.com/`\n\
  Visualize Free 允许你上传自己的数据集构建可视化的 HTML5 交互图表。\n\n- **ZingChart**: `https://www.zingchart.com/`\n\
  ZingChart 是另一个 JavaScript 图表程序，具有交互式 Flash 和 HTML5 图表，为你的数据分析提供超过 100 种选择。\n\n#\
  \ 第 10 章：使用社交媒体\n\nDomo 发布了 2015 年社交媒体用户的统计信息图。这些统计数据显示了用户惊人的增长。\n\n在短短一分钟内：\n\n\
  - `BuzzFeed` 播放 34000 多段视频\n- `Instagram` 展示 170 万张照片\n- `Netflix` 播放 8 万小时视频\n\
  - `Vine` 播放 100 万个视频\n- `YouTube` 上传了 300 小时的视频\n- `Facebook` 获得超过 410 万次点赞（这不等同于帖子数量，因为并不是每个人都会花时间点赞）\n\
  - `Twitter` 有 34.7 万条推文\n\n来源：Domo，数据永不眠\n\n\n\n\n显然，社交媒体现在已成为触达消费者的主要平台。社交媒体与业务实践的成功整合可以增强客户开发的机会。对于企业来说，通过搜索自己的产品来找到解决棘手故障排除问题的答案是明智之举。\n\
  \n零售相关业务经常被忽视的信息源之一是 YouTube 视频。客户经常发布演示操作方法的视频，而这些视频在产品用户书中是不提供的。有时，常见问题（FAQ）的编写者会在某些冷门故障面前毫无无策。如果分析师进行数据挖掘，YouTube\
  \ 可能提供解决问题的答案。\n\n## 社交媒体分析\n\n社交媒体分析是利用从博客和社交媒体网站收集的信息，使业务更成功、更具知名度。拥有网络存在是吸引年轻客户的关键。在\
  \ 30 岁以下的购买者中，81%的人使用互联网影响他们的购买。与这些购买者建立联系对于业务的增长和发展至关重要。\n\n社交媒体分析涉及数据挖掘、网站信息分析、数据收集以及利用这些信息进行业务预测和产品塑造。社交媒体分析的主要用途是评估客户的反应，以支持营销进展和客户服务决策。社交分析的第二个主要用途是通过维持网络存在感来获得竞争优势。社交媒体分析的第三个用途是衡量客户对产品或服务的感受。社交媒体分析的第四个用途是通过提供仅限网络资源和折扣来增强产品。社交媒体分析的第五个用途是生产不符合逻辑但消费者所需的产品（例如跑步者拉掉跑步鞋内衬，因为这会让他们的脚太热）。\n\
  \n社交媒体分析与其他任何数据分析类似，但有特定的需要考虑，例如：\n\n### 提出假设\n\n社交媒体分析更多是关于为什么发生了某事，而不是报告事件本身。从某种情况甚至从一个“为什么”的问题开始分析。为什么读者参与了这个问题，但没有回应\
  \ Facebook 或 Twitter 上的类似调查？检查你的发布频率和时间。它们对你的品牌或产品是最优的？例如，食物外卖广告在下午 5:00 比在下午 2:00\
  \ 有效得多，因为客户在下班时感到饥饿疲劳，想要为晚餐困境寻求即时解决方案。\n\n利用信息识别新的信息共享方式，以增加读者流量。例如，Twitter 现在允许将\
  \ Vine 视频嵌入帖子中。一个待测试的假设是：Twitter 的新功能是增加了网站的流量，还是仅仅更充分地娱乐了读者？\n\n### 将数据移动到表格\n\n\
  从在电子表格上识别趋势和模式开始。从这些数据中，你可以导出问题和差异进行探索。\n\n### 扩大样本以包含尽可能多的数据\n\n扩大样本可以通过许多方式完成，这里是两种可能性：更改样本的结束日期，或者同时也追踪对手。\n\
  \n### 质疑结果\n\n当数据比需要的多时，很容易确定一个虚假的相关性。就像测试证明一样，通过找到支持你预期和理想结果的数据，可以是一种快速解决的方法。继续测试结果以消除结论中的偏差。\n\
  \n## 帮助管理社交媒体的工具\n\n每天向多个社交媒体平台发布内容是非常耗时的，但也是必要的。与其每天花费几个小时维护社交媒体更新，不如考虑以下一些工具，来消除日常监控的枯燥工作。\n\
  \n以下是推荐工具列表，可以帮助所有主用更短的时间完成任务。其中一些工具是免费的，但大多数需要付费订阅。\n\n### Buffer, HootSuite, 和\
  \ Sprout Social\n\n这些工具允许你登录一次，然后为主要的社交媒体平台安排帖子。你可以同时执行多个功能，编写并安排一周的帖子、分析效力以及共享信息。\n\
  \n### SumAll, Social Express, Socialight\n\n这些程序将数据发送给你，而不是由你去那里检索。你可以选择对你的业务感兴趣的报告。\n\
  \n### Social Count, SharedCount, BuzzSumo\n\n该程序跟踪你来自不同 `URLs` 的“分享”。你输入 `URL`，它就会输出每天、每周和每月的“分享”次数。这节省了时间，让你不需要在各个网站之间穿梭寻找信息。\n\
  \n## 企业主者的社交媒体策略\n\n这些是对于管理业务和社交媒体的中小型企业主来说最有用的提示。\n\n- 使用业务仪表板整合你的社交媒体。\n- 同时完成所有社交媒体帖子并提前安排。\n\
  - 关注你帖子的互动情况。\n- 对你的受众进行细分以便进行快速分析。\n\n社交媒体将一直存在，并且每天变得越来越复杂。管理社交媒体现在对于维持网络存在感至关重要。那些像鸵鸟一样头埋沙子里、忽视社交媒体的企业正在失去新收入来源的机会。产品的在线销售每刻都在增长。在分钟内，Amazon\
  \ 有超过 4000 名新客户购买产品。精明的企业主会希望尽可能地挖掘这一潜在客户群体。\n\n社交媒体分析帮助企业主针对那些对机构推广的产品或服务感兴趣的客户。只要对消费者的服务需求稍加关注，就可以发现一条通过互联网渠道进行沟通和销售的途径。\n\
  \n# 第 11 章 数据分析如何维持任何业务\n\n分析时代已经黎临，水瓶时代已经过去。那些收集、解释并对其获得的原始数据采取行动的组织可以适应快速变化的市场，并保持在竞争的领先地位。\n\
  \n要正确、快速地使用数据，利用这些工具分析数据将带来清晰的创新建议。\n\n从`测量`开始，确定哪些分析对公司内部决策最有帮助。\n\n`诊断`在客户满意度或产品投放上发生的问题。为什么某事会以不利的方式发生？数据分析可以帮助你定位特定问题以获得满意的解决方案。\n\
  \n`预测与优化`以预测变化以及变化的潜在后果。使用“如果……那么……”的方法提问。（如果我在客户服务上做出改变，我将如何预测反应？）这种分析技术有助于确定组织的方向以及持续增长的最佳路线。\n\
  \n\n\n自动化是指业务经理利用实时信息对组织进行即时调整。例如，在杂货行业中，优惠券对客户和杂货商都是巨大的盈利点。杂货商销售产品，但会从优惠券机构获得报销，连同根据优惠券价值的手续费。客户以优惠的价格获得产品，而这些产品通常是新引入的商品，在经济低迷时期会被视为奢侈品。然而，当客户利用零售商的机会，买光了货架上的所有商品，导致后续客户无货可买，并营造了客户不满的环境时，会发生什么？店经理立即评估了情况并执行了“每笔交易限\
  \ 3 张优惠券”的规则。现在客户仍然可以购买该商品，但很少有人愿意离开结账台进行多次交易。零售杂货商利用自动化分析问题并创建了立即解决方案。\n\n实施的最后一个阶段是转型，即企业转向数据驱动的文化，根据当前的分析结果而非传统或直觉做出业务决策。\n\
  \n## 如今你如何为分析收集数据\n\n1. 建立一个既提供信息又接收信息的数字化存在。在收集数据之前，你需要一种像社交媒体平台或交互式网站的方法。\n2.\
  \ 记住你的目标是从尽可能多的来源尽可能快地接收、排序和处理你收集到的数据，以防数据过时甚至不可靠。收集的数据越多，你的发现就越准确。\n3. 关注需要答案的问题。通读并思考一切可能很有诱惑力，但这将违背收集数据的初衷。将问题放在脑海中将帮助你从客户智能中挖掘必要信息，将你的业务实践转变为积极的进展。\n\
  4. 通过社交媒体与客户互动。不要假设你了解他们想要什么。给他们充分的机会点击点赞按钮。这个价值的按钮比正式问卷能更好地针对客户的欲望和需求。\n5. 使用 `Google\
  \ Analytics` 和 `Alex` 来确定有关你客户群的相关信息。它们对网站流量和 SEO 排名提供了易懂的统计数据。利用这些信息来迎合你的客户。只需在网站上更改几个关键词即可增加流量，并让你升至\
  \ `Google` 搜索引擎的首页，这是吸引新客户和读者的绝佳位置。\n\n## 结论\n\n再次感谢你下载这本书，《数据分析：实用数据分析与转型及演变任何业务的统计指南，利用初学者、数据分析、数据科学和预测分析的力量！\n\
  \n希望这本书能够帮助你理解并利用数据分析来增加你的业务销售、营销和效率。\n\n下一步是实施本指南中介绍的数据分析政策和程序。\n\n最后，如果你喜欢这本书，请花时间分享你的想法并在\
