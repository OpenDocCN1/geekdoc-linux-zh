  md: 'Another example would be to read tar data coming from another UNIX system,
    such as Silicon Graphics. Silicon Graphics swaps every pair of bytes, making a
    tar tape unreadable on a Solaris system. To read a tar tape from an SGI system,
    type


    ```

    dd if=/dev/nrst0 conv=swab | tar xvf -

