    can also be the name of a device, such as /dev/rmt/0 or /dev/rfd0. The file list
    is a list of files you want to include in the archive.


    # Table 11-1 Command Options for tar


    | Option | Description |

    |---|---|

    | c | Creates a tar file. |

    | t | Table of contents. Lists the names of the specified files each time they
    occur in the tar filename. If no file argument is given, the names of all files
    in the tar filename are listed. When used with the v function modifier, it displays
    additional information for the specified files. |

    | x | Extracts or restores files from a tar filename. |

    | v | Verbose. Outputs information to the screen as tar reads or writes the archive.
    |

    | f | Uses the tar filename argument as the name of the tar archive. If f is omitted,
    tar uses the device indicated by the TAPE environment variable, if set. If the
    TAPE variable is not set, tar uses the default values defined in /etc/default/tar.
    If the name of the tar file is ''-'', tar writes to the standard output. |


