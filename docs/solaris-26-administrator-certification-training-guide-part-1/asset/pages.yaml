- pgno: 39
  md: '# Using the Run-Control Scripts to Stop or Start Services


    The advantage of having individual scripts for each init is that you can run these
    scripts individually to turn off processes in Solaris without rebooting or changing
    init states.


    For example, you can turn off NFS server functionality by typing `/etc/init.d/nfs.server
    stop` and pressing Enter. After you have changed the system configuration, you
    can restart the functionality by typing `/etc/init.d/nfs.server start` and pressing
    Enter.


    # Adding Scripts to the Run-Control Directories


    If you add a script, put the script in the `/etc/init.d` directory and create
    a link to the appropriate rc*.d directory. Assign appropriate numbers and names
    to the new scripts so they will be run in the proper sequence.


    *TIP.* If you do not want a particular script to run when entering a corresponding
    init state, change the uppercase prefix (S or K) to lowercase (s or k). Only files
    with an uppercase prefix are run. For example, change S99mount to s99mount to
    disable the script.


    # System Shutdown


    Solaris has been designed to run continuously, 7 days a week, 24 hours a day.
    Occasionally, however, you need to shut down the system to carry out administrative
    tasks. At other times, an application might cause the system to go awry and the
    operating system must be stopped to kill off run-away processes and then be restarted.
    You can shut down the system in many ways, using various UNIX commands. With Solaris,
    taking down the operating system in an orderly fashion is important. When the
    system booted, several processes were started and must be shut down before you
    power off the system. In addition, information has been cached in memory and not
    yet written to disk. The process of shutting down Solaris involves shutting down
    processes and flushing data from memory to the disk. Remember that shutting down
    the system improperly can result in loss of data and the risk of corrupting the
    file systems.


    *TIP.* To avoid having your system shut down improperly during a power failure,
    use a UPS (uninterruptible power supply) capable of shutting down the system before
    the power is shut off.'
  merge: -1
  img_proc: true
- pgno: 40
  md: "# Commands to Shut Down the System\n\nWhen preparing to shut down a system,\
    \ you need to determine which of the following commands is appropriate for the\
    \ system and the task at hand:\n\n+   - `/usr/sbin/shutdown`\n- `/sbin/init`\n\
    - `/usr/sbin/halt`\n- `/usr/sbin/reboot`\n- `Stop-a or L1-a (to be used as a last\
    \ resort; see warning earlier in this chapter)`\n\nThe first four commands initiate\
    \ shutdown procedures, kill all running processes, write data to disk, and shut\
    \ down the system software to the appropriate run level. The last command, which\
    \ is really a series of keystrokes, stops the system unconditionally.\n\n# /usr/sbin/shutdown\n\
    \nUse the shutdown command when shutting down a system with multiple users. The\
    \ shutdown command sends a warning message to all users who are logged in, waits\
    \ for 60 seconds (the default), and then shuts down the system to single-user\
    \ state. A command option (-g) lets you choose a different default wait time.\n\
    \nThe shutdown command performs a clean system shutdown, which means all system\
    \ processes and services are terminated normally and file systems are synchronized.\
    \ You need superuser privileges to use the shutdown command.\n\nWhen the shutdown\
    \ command is initiated, all logged-in users and all systems mounting resources\
    \ receive a warning about the impending shutdown, and then a final message. For\
    \ this reason, the shutdown command is recommended over the init command on a\
    \ server.\n\n**TIP.** When using either command, you might want to give users\
    \ more advanced notice by sending an email message about any scheduled system\
    \ shutdown.\n\nThe following are the recommended steps for shutting down the system:\n\
    \n+   1. As superuser, type the following to find out if users are logged in to\
    \ the system.\n   `# who`\n2. A list of all logged-in users is displayed. You\
    \ might want to send mail or broadcast a message to let users know the system\
    \ is being shut down.\n3. Shut down the system by using the shutdown command.\n\
    \   `# shutdown -i<init-state> -g<grace-period> -y`"
  merge: -1
  img_proc: true
- pgno: 41
  md: 'The following describes the shutdown command:


    -i<init-state> Brings the system to an init state different from the default of
    S. The choices are 0, 1, 2, 5, and 6.


    -g<grace-period> Indicates a time (in seconds) before the system is shut down.
    The default is 60 seconds.


    -y Continues to shut down the system without intervention; otherwise, you are
    prompted to continue the shutdown process after 60 seconds. If you used the shutdown
    -y command, you are not prompted to continue; otherwise, you are asked, "Do you
    want to continue? (y or n)."


    # /sbin/init


    Use the init command to shut down a single-user system or to change its run level.
    You can use init to place the system in power-down state (init 0) or in single-user
    state (init 1).


    # /usr/sbin/halt


    Use the halt command when the system must be stopped immediately and it is acceptable
    not to warn any current users. The halt command shuts down the system without
    any delay. It does not warn any other users on the system.


    # /usr/sbin/reboot


    Use the reboot command to shut down a single-user system and bring it into multiuser
    state. Reboot does not warn other users on the system.


    The Solaris reboot and halt commands do an unconditional shutdown of system processes.
    These commands shut down the system much more quickly than the shutdown command,
    but not as gracefully. No messages are sent to users. Reboot and halt do not notify
    all logged-in users and systems mounting resources of the impending shutdown;
    however, the two commands do synchronize file systems.


    > NOTE. init and shutdown are the most reliable ways to shut down a system because
    they use rc scripts to kill running processes and shut down the system with minimal
    data loss. The halt and reboot commands do not run the rc scripts properly and
    are not the preferred method for shutting down the system.


    # How to Stop the System for Recovery Purposes


    Occasionally the system might not respond to the init commands specified earlier.
    A system that doesn''t respond to anything is called a "crashed" or "hung" system.
    After trying the above commands with no response, you can press Stop-A or L1-A
    to get back to the boot'
  merge: -1
  img_proc: true
