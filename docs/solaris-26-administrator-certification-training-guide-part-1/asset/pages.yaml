    - The media is distributed on CD-ROM only, so a CD-ROM is required either locally
    or on the network.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '+   - The system must have at least 300MB of available disk space; 1GB is recommended.

    - The programmable read-only memory (PROM) must be level 1.1 or later.


    # System Configurations


    Before installing the OS, you''ll need to determine the system configuration to
    be installed. System configurations, or types, are defined by the way they access
    the root (/), the /usr file systems, and the swap area. The five system configurations
    are server, standalone, diskless client, dataless client, and AutoClient.


    # Server


    A server system has the following file systems installed locally:


    +   - The root (/) and /usr file systems, plus swap space

    - The /export, /export/swap, and /export/home file systems, which support client
    systems and provide home directories for users

    - The /opt directory or file system for storing application software


    Servers can also contain the following software to support other systems:


    +   - OS services for diskless clients and AutoClient systems

    - Solaris CD image and boot software for networked systems to perform remote installations

    - JumpStart directory for networked systems to perform custom JumpStart installations


    # Standalone


    On a standalone system, the OS is loaded on a local disk and the system is set
    to run independent of other systems for portions of the OS. It might be networked
    to other standalone systems. A networked standalone system can share information
    with other systems on the network, but it can function autonomously because it
    has its own hard disk with enough space to contain the root (/), /usr, and /home
    file systems and swap space. The standalone system has local access to operating
    system software, executables, virtual memory space, and user-created files.


    # Diskless Client


    A diskless client is a system with no local disk that is dependent on a server
    for all of its software and storage area. The OS is located on a server on the
    network. The diskless client'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'boots from the server, remotely mounts its root (/), /usr, and /home file systems
    from a server, and gets all of its data from the server. Any files created are
    stored on the server.


    A diskless client generates significant network traffic because of its need to
    continuously access the server for operating system functions and to access virtual
    memory space across the network. A diskless client cannot operate if it is detached
    from the network or if its server is not available.


    # Dataless Client


    In a dataless client system, the root file system and swap are on a local disk
    and the /usr and /home file systems are located on another system''s disk somewhere
    on the network. If the dataless client is detached from the network, it cannot
    function because its executables (/usr) and user files (/home) are missing.


    > NOTE. SunSoft has begun plans to remove support for dataless clients; therefore,
    AutoClient systems are recommended over dataless clients.


    # Solstice AutoClient


    An AutoClient system is nearly identical to a diskless client. It has the following
    characteristics:


    +   - Requires a 100MB or larger local disk for swapping. Its root (/) file system
    and the /usr file system are on a server somewhere on the network.

    - Can be set up so it can continue to access its cached (/) root and /usr file
    system when the server is unavailable.

    - Relies on servers to provide other file systems and software applications.

    - Contains no permanent data, making it a field-replaceable unit (FRU).


    An AutoClient system has a local disk. It caches (locally stores copies of data
    as it is referenced) all of its needed system software from a server. AutoClient
    systems use Solaris diskless and cache file system (CacheFS) technologies. CacheFS
    is a general-purpose file-system caching mechanism that improves performance and
    scalability by reducing server and network load. An AutoClient system uses its
    local disk for swap space and to cache its individual root (/) file system and
    the /usr file system from a server''s file systems. With the AutoClient configuration,
    administration is streamlined because the system administrator can maintain many
    AutoClient systems from a central location. Changes do not have to be made on
    individual systems.


    Table 2-2 gives a brief overview of each system configuration. It outlines which
    file systems are local and which file systems are accessed over the network.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Table 2-2 System Configurations


    | System Type | Local File Systems | Local Swap | Remote File Systems |

    |---|---|---|---|

    | Server | root (/), /usr, /home, /opt/export, /export/home | Yes | Optional |

    | Standalone | root (/), /usr, /export/home | Yes | Optional |

    | Dataless Client | root (/) | Yes | /usr, /home |

    | Diskless Client | None | No | root (/), swap, /usr, /home |

    | AutoClient System | cached root (/), cached /usr | Yes | root (/), /usr, /home
    |


    # Performance of Clients Relative to a Standalone System


    A system administrator decides which system configuration to use, based on available
    hardware, and how much to streamline the administration of the network. For example,
    does the system have a large enough local disk to hold all of the operating system?
    Also, would the features of the AutoClient, diskless, or dataless system configurations
    facilitate the administration of remote systems? For the most part, AutoClient
    configurations are used to ease system administration in a large network of systems.
    Because the OS is downloaded from a server at bootup, maintaining the workstation''s
    OS from a centralized location is easy. Diskless clients, on the other hand, are
    used when disk space on the workstation is limited. Table 2-3 compares the various
    system configurations for performance and ease of administration.


    # Table 2-3 System Configuration Performance


    | System Type | Centralized Admin | Performance | System Disk Usage | Network
    Use |

    |---|---|---|---|---|

    | AutoClient | Better | Similar | Better | Similar |

    | Diskless client | Better | Worse | Better | Worse |

    | Dataless client | Similar | Worse | Better | Worse |'
