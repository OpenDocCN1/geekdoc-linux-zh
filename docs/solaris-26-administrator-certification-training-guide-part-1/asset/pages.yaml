- pgno: 181
  md: 'If you cannot find a terminfo entry for your printer, you can try selecting
    a similar type of printer; however, you might have trouble keeping the printer
    in the correct modes for each print request. If there is no terminfo entry for
    your type of printer and you want to keep the printer set in the correct modes,
    you can either customize the interface program used with the printer or add an
    entry to the terminfo database. You''ll find the printer interface program located
    under the /etc/lp/interfaces directory. Editing an interface file or adding an
    entry in the terminfo database is beyond the scope of this training guide. A printer
    entry in the terminfo database contains and defines hundreds of items. Refer to
    the Solaris System Administrator''s Guide for information on performing this task.


    # Administering Printers


    Managing the print system involves monitoring the lp system and uncovering reasons
    why the system might not be working properly. Other routine tasks involve canceling
    print jobs and enabling or disabling a printer while it''s being serviced. This
    section provides instructions for the daily tasks you will perform to manage printers
    and the print scheduler. All of the following commands require superuser access.


    # Deleting Printers and Printer Access


    Use the Admintool to delete a printer from the system. In the print manager window
    of Admintool, highlight the printer you want to delete and select Edit, Delete
    as shown in Figure 9-6. The printer queue will be deleted from the system.


    Figure 9-6

    Deleting a printer.


    ![](img/85737305a4c9aeecbcadd9986d604c02_181_0.png)'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'To delete a printer at the command line, issue the following command on the
    system where the printer is connected:


    ```

    lpadmin -x <printer-name>

    ```


    The printer is deleted from the system.


    Maybe you do not want to remove the printer from the print server but you want
    to keep a particular system from printing to the print server. Issue the following
    command on the print client from which you want to delete the printer:


    ```

    lpsystem -r <print-server>

    ```


    The print server is deleted from the print client''s /etc/lp/Systems file.


    Perhaps a printer will be going offline for repairs. To stop accepting print requests
    on a particular printer, type the following command on the system where the printer
    is physically connected:


    ```

    reject <printer-name>

    ```


    This step prevents any new requests from entering the printer''s queue while you
    are in the process of removing the printer.


    To allow a printer to keep taking requests but to stop the printer from printing
    the requests, type the following command on the system where the printer is physically
    connected:


    ```

    disable <printer-name>

    ```


    # Checking Printer Status


    The lpstat command is used to verify the status of a printer. You can use this
    command to determine which printers are available for use or to examine the characteristics
    of a particular printer. The lpstat command syntax and options are described in
    Table 9-5.


    Table 9-5 lpstat Command Syntax and Options


    lpstat [-d] [-p printer-name [-D] [-l]] [-t]


    - **-d**: Shows the system''s default printer.

    - **-p <printer-name>**: Shows if a printer is active or idle, when it was enabled
    or disabled, and whether it is accepting print requests. You can specify multiple
    printer names with this command. Use a space or a comma to separate printer names.
    If you use spaces, enclose the list of printer names in quotes. If you don''t
    specify the printer name, the status of all printers is displayed.

    - **-D**: Shows the description of the specified printer.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Table 9-5 lpstat Command Syntax and Options (continued)


    | Option | Description |

    |---|---|

    | lpstat [-d] [-p printer-name [-D] [-l] [-t]] |  |

    | -l | Shows the characteristics of the specified printer. |

    | -t | Shows status information about the LP print service, including the status
    of all printers—whether they are active and whether they are accepting print requests.
    |


    Here are a few examples of the lpstat command:


    ```

    lpstat -p hplaser

    ```


    The system responds with


    ```

    printer hplaser is idle. enabled since Jun 16 10:09 1998. available.

    ```


    In the following example, the command requests a description of the printers hplaser1
