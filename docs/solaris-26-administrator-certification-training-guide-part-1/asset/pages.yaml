- pgno: 170
  md: 'Printers are a standard peripheral for any computer system. One of the first
    devices added to a new system will be a printer. The multi-user nature of the
    Solaris operating system means that the Solaris printer software is more complex
    than that of a single-user operating system. This means that adding a printer
    to a Solaris system requires more than just plugging it in. This chapter describes
    all aspects of connecting a printer to a Solaris system. It describes how to setup
    the printer in the operating system and how to manage the print queues after they''re
    installed.


    # The UNIX Print Service


    Setting up a Solaris printer involves setting up the hardware: the printer and
    the printer port. In addition, the system administrator needs to verify that there
    is at least 8MB of disk space available for /var/spool/lp. Print files will be
    sent to this location to prepare them for printing. Other configuration files
    are created but the Solaris operating system takes care of that part for you.
    When setting up a printer, the Solaris operating system makes the appropriate
    changes in the system''s /etc/printers.conf and /etc/lp directory as required.


    # The Print Spooler


    Spool stands for simultaneous peripheral operations online. The spooler is also
    referred to as the queue. Users execute the print spooler lp program when they
    want to print something. The print spooler then takes what the user wants to print
    and places it in the pre-defined /var/spool/lp print spooling directory.


    Spooling space is the amount of disk space used to store and process requests
    in the print queue. The size of the /var directory depends on the size of the
    disk and how the disk is partitioned. If /var is not created as a separate partition,
    the /var directory uses some root partition space, which is likely to be quite
    small. A large spool directory could consume 600MB of disk space. Look at the
    size and partitioning of the disks available on systems that could be designated
    as print servers.


    When connecting printers, first carefully evaluate the printing needs and usage
    patterns of the users. If users typically print only short ASCII files without
    sophisticated formatting requirements, a print server with 20 to 25MB of disk
    space allocated to /var is probably sufficient. If, however, many users are printing
    lengthy PostScript files, they will fill up the spooling space quite frequently.
    When /var fills up and users cannot queue their jobs for printing, work flow is
    interrupted. The size of /var is set when the operating system is loaded and disks
    are partitioned.


    For SunOS users, the SVR4 lp program is equivalent to the BSD lpr print program.
    In SunOS, the print spooler is located in /usr/spool. When Sun switched from SunOS
    (which was based on BSD UNIX) to Solaris (which is based on SVR4 UNIX), print
    systems between BSD and SVR4 were quite different. Throughout this chapter, I''ll
    make reference'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'to the BSD print system for system administrators who might be familiar with
    that print system. The BSD printing protocol is an industry standard. It is widely
    used and provides compatibility between different types of systems from various
    manufacturers. For sites that have a mix of BSD and SVR4 UNIX, Sun has provided
    compatibility for both print systems in Solaris.


    # The Print Daemon


    The lp process is the UNIX utility responsible for printing in SVR4 UNIX. The
    lp print daemon is started by lpsched and is the UNIX process responsible for
    taking output from the spooling directory and sending it to the correct printer.
    Again, for SunOS users, lp is equivalent to lpd in BSD UNIX.


    Many methods can be used to define a printer on a Solaris system. Table 9-1 describes
    the tools Solaris provides for adding printers.


    **Table 9-1 Solaris Printer Utilities**


    | Utility | Description |

    |---|---|

    | SunSoft Print Client Software | An interface that was previously available only
    with the Solstice AdminSuite set of administration tools, It is now available
    as part of the standard Solaris distribution software and is used to set up print
    clients. |

    | Admintool | A graphical user interface used to create, modify, and delete printers
    on a local system. This is the recommended method of adding printers for novice
    users. |

    | Solstice AdminSuite | A graphical user interface Print Manager interface used
    to manage printers in a name service environment and available only with the Solaris
    2.6 server software distribution. |

    | LP Print Service Commands | The command line utilities used to set up and manage
    printers. These commands provide complete functionality; Admintool and the AdminSuite
    packages are somewhat limited for advanced tasks. |


    This chapter describes how to set up local printers, set up access to remote printers,
    and perform some printer administration tasks by using the Admintool GUI or from
    the command line. Most of the system administrator''s needs for setting up printing
    services, adding printers to servers, or adding access from print clients to remote
    printers on print servers should be met by Admintool. Setting up a printer from
    the command line can be a very complex task. We''ll examine the hardware issues
    involved in connecting a printer to a Solaris system before moving on to examine
    the more complex part of the process—configuring the software.


    # Setting Up the Hardware


    Connecting printers to a UNIX system is no one''s favorite activity, because it
    can quickly become a time-consuming task. Many printers are on the market, each
    with a slightly different interface. When connecting a printer locally to a Sun
    system, you have one of three options:'
  merge: -1
  img_proc: true
- pgno: 172
  md: '+   - Ethernet connection

    - Parallel connection

    - Serial connection


    The type of connection depends on the connectivity options available on the printer
    itself. If the printer supports the option, an ethernet connection will be the
    best. If ethernet connectivity is not an option, a parallel connection is the
    preferred method. Most, if not all, printers have a parallel port. If no parallel
    option exists, the final choice is a serial connection. The difficulty with a
    serial connection is in establishing the proper handshake between the computer
    and the printer. "Handshaking" is a method for communicating simple information
    between two devices.


    # Ethernet Connection


    Many new printers come standard with an ethernet interface. A printer with its
    own ethernet connection is referred to as a network printer. A network printer
    is a hardware device that provides printing services to print clients without
    being directly cabled to a print server. It is a print server with its own system
    name and IP address, and is connected directly to the network work. The ethernet
    interface may be internal or external to the printer. Using an ethernet interface
    to install a printer is recommended because of its speed.


    # Parallel Connection


    Most printers, with a few rare exceptions, have a parallel interface. A parallel
    interface can have a tremendous advantage over a serial interface, especially
    if it uses a Centronics interface. The Centronics interface completely defines
    all wires used in the parallel connection between the printer and the computer.
    Simply connect the printer to the back of the Sun system by using a Centronics
    parallel cable. Some Sun systems do not have a DB25 parallel connector and require
    a special cable from Sun. Other older Sun systems do not have a parallel interface,
    so you must add one by purchasing an SBUS parallel interface from Sun.


    # Serial Connection


    Some printers support both parallel and serial connections. Sometimes a printer
    is connected via the serial interface because the Sun station does not have an
    available parallel interface. To connect a device using a serial interface requires
    a thorough understanding of serial transmission. This method of connecting a printer
    is the most difficult because of the complexity in establishing the proper handshake
    between the computer and the printer.


    # Setting Up the Software


    For network printers, you use the vendor’s software to configure the operating
    system. After you have completed the vendor software installation, no further
    software configuration is required. You must obtain software from the printer
    manufacturer to install the printer on'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'your system. Most are very easy to configure. The HP Jetdirect print server
    is the most popular but not the only print server available.


    The first step is to connect the print server to the network and set the IP address.
    This process varies on print servers, so follow the manufacturer’s guidelines
    on how to do this. Next, install the print server software and follow the manufacturer’s
    guidelines for configuring the printer. The vendor’s software configures everything—no
    additional software configuration is required.


    For printers with a parallel or serial connection, you must use the Solaris tools
    to configure the operating system to recognize the printer.


    # BSD Versus SVR4 Printing Software


    The software that drives the UNIX printing process is an area in which the two
    UNIX versions, BSD and SystemV, are similar and yet very different. The two print
    systems are similar in that both are based on the concept of spooling. Both SystemV
    and BSD print services support the concept of an interface program, which acts
    as a filter through which all output sent to the printer is passed. Example uses
    of an interface program include


    +   - Adding a banner page—Most UNIX systems automatically add a banner page to
    the front of a print job. The purpose of the page is to identify the owner of
    the printer output.

    - Adding or removing a line feed character—UNIX uses just the line feed character
    to separate lines. The first problem you might encounter when testing a printer
    is that the text comes out in a stair-step manner. Most printers have a carriage
    return/line feed and auto line-feed dip switch that controls what the printer
    will use. The stair-step problem can be fixed by modifying the interface program
    that performs the necessary translation on all output going to the printer or
    by setting the printer’s dip switch to the setting recommended by the hardware
    manufacturer.


    The differences between BSD and SystemV are in the configuration files and the
    spooling directories, which are configured automatically by the Solaris operating
    system. There are also differences in the way the lp daemon handles print jobs
    as compared to the lpd daemon in BSD.


    # BSD Print Service


    Each printer connected to a BSD system must have its own spooling directory that
    is serviced by one lpd daemon. The spool directories are located in the /var/spool/lpd
    directory. Each printer has its own lpd daemon. In BSD, lpd accesses the file
    /etc/printcap for any information it requires concerning the printer. The /etc/printcap
    file is the system’s printer database file and stores all of the necessary information
    about all printers connected to the system. To use a printer, that printer must
    have an entry in the /etc/printcap file. The lpr function is BSD’s equivalent
    to lp under SystemV. If users want to print something, they use the lpr command,
    which sends the necessary information to a specified spooling directory.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# SystemV Print Service


    In SystemV, one lp daemon services all printers. The lp daemon is continually
    running and provides the "power" for the print service. Only one copy of lp should
    be running at any one time. Most of the configuration files are located in the
    /var/spool/lp directory. The exception is the interface files, which are located
    in /etc/interface. There should be a SCHEDLOCK file in /var/spool/lp that is responsible
    for ensuring that only one copy runs. You use the lpadmin command to add, configure,
    and delete printers from the system. Information about printers can be found in
    the /etc/printers.conf and /etc/lp files. The Solaris Admintool provides a graphical
    interface to many of the lp commands listed in Table 9-2.


    Table 9-2 Solaris lp Commands


    | Command | Purpose |

    |---|---|

    | accept/reject | Enables or disables any further requests for a printer or class
    entering the spooling area. |

    | cancel | Enables the user to stop the printing of information. |

    | enable/disable | Enables or disables any more output from the spooler to the
    printer. |

    | lpmove | Moves print requests between destinations. |

    | lp | The user''s print command; places information to be printed into the spooler.
    |

    | lpadmin | Allows the configuration of the print service. |

    | lpsched | Starts the print service. |

    | lpshut | Stops the print service. |

    | lpstat | Displays status of the print service. |


    Although Solaris uses the SystemV print model, it still supports BSD-style printing
    to provide interoperability. The widely used BSD printing protocol provides compatibility
    between different types of systems from various manufacturers.


    # Print Server Versus Print Client


    The print server is a system that has a local printer connected to it and makes
    the printer available to other systems on the network. The print client is a remote
    system that can send print requests to a print server. A system becomes a print
    client when you install the print client software and enable access to remote
    printers on the system. See Table 9-3 for a listing of the Solaris software packages
    that need to be installed to support a print-server and print-client installation.
    If you''ve worked with an earlier version of Solaris, note that the Solaris 2.6
    print software has been redesigned to provide more centralized print administration.
    If you are installing an earlier version of Solaris, the print package configuration
    is different.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Table 9-3 Solaris 2.6 Print Packages


    | Package Instance | Package Name |

    |---|---|

    | SUNWpcr | SunSoft Print - Client |

    | SUNWpcu | SunSoft Print - Client |

    | SUNWpsr | SunSoft Print - LP server |

    | SUNWpsu | SunSoft Print - LP server |

    | SUNWpsf | PostScript filters |

    | SUNWscplp | SunSoft Print - Source compatibility |


    Solaris 2.5 packages no longer found in the software distribution:


    | Package Instance | Package Name |

    |---|---|

    | SUNWlp r | LP print service |

    | SUNWlp u | LP print service - Client |

    | SUNWlp s | LP print service - Server |


    The print client issues print commands that enable the print client to initiate
    print requests. The print command locates a printer and printer configuration
    information.


    When a print job is sent from the print client, the user issues either the SystemV
    style lp command or the BSD style lpr command. Any one of the styles shown in
    Table 9-4 can be used.


    # Table 9-4 Valid Print Styles


    | Style | Description |

    |---|---|

    | Atomic style | The print command and option followed by the printer name or
    class; for example: `lp -d neptune filename` |

    | POSIX style | The print command and option followed by server:printer; for example:
    `lpr -P galaxy:neptune filename` |

    | Context style | Defined in the Federated Naming Service Programming Guide; for
    example: `lpr -d thisdept/service/printer/printer-name filename` |'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'If the user doesn''t specify a printer name or class in a valid style, the
    command checks the user''s PRINTER or LPDEST environment variable for a default
    printer name. These variables can be set in the user''s startup file to specify
    a default printer to use. If neither environment variable for the default printer
    is defined, the command checks the .printers file in the user''s home directory
    for the _default printer alias. If the command does not find a _default printer
    alias in the .printers file, it then checks the print client''s /etc/printers.conf
    file for configuration information. If the printer is not found in the /etc/printers.conf
    file, the command checks the name service (NIS or NIS+), if any.


    # Configuring Software for a Solaris Printer


    The print client software and the Printer Manager application in Solstice AdminSuite
    offer a graphical solution for setting up and managing printers on a network.
    The advantage of the print client software is that it supports a name service
    (NIS or NIS+) that enables you to centralize print administration for a network.
    You can also use the lpadmin command on the command line to configure printers
    on individual systems. Admintool provides an alternative method for installing
    printers in the Solaris environment. Admintool provides a graphical interface
    to the lp commands listed in Table 9-2. This section describes how to use Admintool
    to set up the printer software.


    You must run Admintool on the system to which you have attached the printer, because
    Admintool does not enable you to make changes to a remote system.


    When setting up a printer, Admintool makes the appropriate changes in the system''s
    /etc/printers.conf and /etc/lp directories.


    > **NOTE.** If you''re sitting at systemA and you want to connect a printer to
    systemB, you don''t need to get into the car and drive to that location to run
    Admintool on systemB. From systemA, simply rlogin to systemB and type


    ```

    admintool -display local_systemA:0.0

    ```


    SystemB''s Admintool should now be displayed on systemA just as if you were sitting
    at systemB.


    Use the following steps to configure a printer by using Admintool.


    +   1. Type admintool to bring up the Admintool menu. The Admintool window appears.

    2. Click on the Browse button located in the toolbar and select Printers from
    the pop-up menu, as shown in Figure 9-1.'
  merge: -1
  img_proc: true
