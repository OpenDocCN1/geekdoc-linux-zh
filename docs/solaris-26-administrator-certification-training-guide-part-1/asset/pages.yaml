- pgno: 309
  md: '# Solaris™ 2.6


    # ADMINISTRATOR CERTIFICATION TRAINING GUIDE, Part I


    *Designed specifically to meet the objectives required to become a Solaris certified
    system administrator*


    Solaris 2.6 Administrator Certification Training Guide, Part I is ideal for new
    and experienced system administrators in need of information about and insight
    into the Solaris certification exam. This guide equips administrators with vital
    knowledge for success on exam day and provides information that serves as a daily
    system administration reference.


    Structured according to the exam objectives, Solaris 2.6 Administrator Certification
    Training Guide, Part I prepares networking professionals by concentrating on such
    subjects as system setup and customization, user security, software administration,
    script writing, and networking; all of which are applicable to the exam and the
    tasks of system administration. Expert author Bill Calkins’ extensive compilation
    of real-world experience and test-taking tips will bring all administrators within
    reach of Solaris 2.6 certification.


    +   - Learn how to apply critical concepts through real-world examples and step-by-step
    procedures.

    - Begin as a system trainee and work through Solaris installation and administration
    tasks.

    - Study useful tables that summarize key command line options.

    - Understand all the essential procedures for administering large or small systems.

    - Troubleshoot effectively by analyzing errors and fatal warnings.


    Bill Calkins has more than 15 years of experience as a UNIX® system administrator
    working with Solaris, as well as other UNIX operating systems, Windows NT®, and
    Windows® 98. Over the past five years, Bill has worked as an independent consultant
    helping companies implement client/server technologies and showing system administrators
    how to become more productive. Bill teaches UNIX and system administration courses
    including seminars on improving system and network performance. When he’s not
    conducting a seminar, he’s out in the real-world dealing with problems that help
    him illustrate the importance of the various practices he teaches.


    ![](img/85737305a4c9aeecbcadd9986d604c02_309_0.png)


    Our Top Score Software Suite is a custom-developed set of software applications
    that work in conjunction with the Training Guide by providing you with the following:


    +   - Practice Exam includes over 160 questions that simulate the actual Solaris
    2.6 Administrator Certification Part 1 Exam

    - Electronic Study Cards test your knowledge of the objectives in a customizable
    format

    - Electronic Flash Cards help you retain the facts in a time-tested method, allowing
    you to concentrate on the objectives you find most difficult


    $40.00 USA / $59.95 CAN / £36.99 Net UK (inc. of VAT)

    ISBN 1-57870-085-X


    Covers: Solaris Version 2.6

    Category: Certification—UNIX/Operating Systems


    ![](img/85737305a4c9aeecbcadd9986d604c02_309_1.png)


    ![](img/85737305a4c9aeecbcadd9986d604c02_309_2.png)'
  merge: -1
  img_proc: true
