    # pax


    New in Solaris 2.5 is the pax command, a POSIX conformant archive utility that
    can read and write tar and cpio archives. It is available on most UNIX systems
    that are POSIX compliant.


    pax can read, write, and list the members of an archive file and copy directory
    hierarchies. The pax utility supports a wide variety of archive formats, including
    tar and cpio.


    Here’s a nice feature: if pax finds an archive that is damaged or corrupted while
    processing, pax attempts to recover from media defects. It searches through the
    archive to locate and process the largest possible number of archive members.


    The action to be taken depends on the presence of the -r and -w options, which
    are referred to as the four modes of operation: list, read, write, and copy (described
    in Table 11-4). The syntax for the pax command is


    ```

    pax <mode> <options>

    ```


    Table 11-4 Pax—Four Modes of Operation


    | Mode | Description |

    |------|-------------|

    | -r | Read mode (when -r is specified but -w is not), pax extracts the filenames
    and directories found in the archive file. The archive file is read from disk
    or tape. If an extracted file is a directory, the file hierarchy is extracted
    as well. The extracted files are created relative to the current file hierarchy.
    |

    | (none) | List mode (when neither -r nor -w is specified), pax writes the filenames
    or directories found in the archive file. The archive file is read from disk,
    tape, or the standard input. The list is written to the standard output. |

    | -w | Write mode (when -w is specified but -r is not), pax writes the contents
    of the file to the standard output in an archive format. If no files are specified,
    a list of files to copy (one per line) is read from the standard input. A directory
    includes all of the files in the file hierarchy rooted at the file. |

    | -rw | Copy mode (when both -r and -w are specified), pax copies the specified
    files to the destination directory. |


    In addition to selecting a mode of operation, you can select one or more options
    from Table 11-5. For additional options to the pax command, see the Solaris online
    manual pages.'
