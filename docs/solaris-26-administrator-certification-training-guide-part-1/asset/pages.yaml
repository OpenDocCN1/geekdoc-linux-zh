    - `respawn`  Restart the command.


    # /etc/bcheckrc


    The first script set to run by the /etc/inittab file is the /etc/bcheckrc script,
    which prepares the root file system and other critical file systems such as /usr.
    Solaris uses a state flag, stored on the hard drive, to record the condition of
    the file systems. The flag is checked by the /etc/bcheckrc script during booting
    to determine the state of a file system—clean or unclean. File systems and their
    states are discussed in Chapter 3, "Introduction to File Systems."


    > NOTE. Many of the Solaris startup scripts can be identified by their "rc" prefix
    or suffix, which means "run control."


    # rc Scripts


    For each init state, there is a corresponding series of rc scripts, located in
    the /sbin directory, to control each init state:


    +   - `rc0`

    - `rc1`

    - `rc2`

    - `rc3`

    - `rc5`

    - `rc6`

    - `rcS`


    For each rc script in the /sbin directory, a corresponding directory named /etc/rcn.d
    contains scripts to perform various actions for that run level. For example, /etc/rc2.d
    contains files used to start and stop processes for run level 2. rc scripts are
    run in numerical order until the desired run level is reached; for example, to
    get to run level 3, /sbin/rc1, /sbin/rc2, and /sbin/rc3 are run.


    All run-control scripts are also located in the /etc/init.d directory. These files
    are linked to corresponding run-control scripts in the /etc/rc*.d directories.


    > NOTE. On other UNIX systems, startup scripts are sometimes found in /sbin/rc*.d
    and sometimes in the /etc/rc*.d directories. Links were put into Solaris so users
    who are accustomed to other flavors of UNIX (HP-UX, SunOS, and so on) can locate
    the startup files easily. Also, any scripts they might have ported over that reference
    these startup files are compatible without modification.'
