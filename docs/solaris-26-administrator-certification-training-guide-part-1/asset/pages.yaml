    In a similar way, a Solaris system can create a tar tape that is readable by an
    SGI system:


    ```

    tar cvf - | dd of=/dev/nrst0 conv=swab

    ```


    # cpio


    The cpio command is used for copying data from one place to another. cpio stands
    for “copy input to output.” When copying files with cpio, you present a list of
    files to its standard input and write the file archive to its standard output.
    The principal advantage of cpio is its flexible syntax. The command acts as a
    filter program, taking input information from the standard input file and delivering
    its output to the standard output file. The input and output can be manipulated
    by using the shell to specify redirection and pipelines. The advantages of cpio
    over other UNIX utilities are


    +   - cpio can back up and restore individual files, not just whole file systems.

    - Backups made by cpio are smaller than those created with tar because the header
    is smaller.

    - cpio can span multiple tapes; tar is limited to a single tape.


    Because of its flexibility, cpio has more options and is perceived as a more complex
    command than tar.


    The cpio program operates in one of three modes: copy-out (cpio -o), copy-in (cpio
    -i), and pass (cpio -p). Use copy-out when creating a backup tape and copy-in
    when restoring or listing files from a tape. The pass mode is generally used to
    copy files from one location to another on disk. You must always specify one of
    these three modes. The command syntax for the cpio command is


    ```

    cpio <mode> <option>

    ```


    where mode is -i, -o, or -p and option is an option from Table 11-3.


    Table 11-3 Command Options for cpio


    | Option | Description |

    |---|---|

    | c | Writes header information in ASCII format for portability. |

    | d | Creates as many directories as needed. |

    | B | Specifies that the input has a blocking factor of 5,120 bytes to the record
    instead of the default 512 byte records. You must use the same blocking factor
    when you retrieve or copy files from the tape to the hard disk as you did when
    you copied files from the hard disk to the tape. You must use this option whenever
    you copy files or file systems to and from a tape drive. |'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Table 11-3 Command Options for cpio (continued)


    | Option | Description |

    |---|---|

    | v | Verbose. Reports the names of the files as they are processed. |

    | u | Copies unconditionally. Without this option, an older file will not replace
    a newer file with the same name. |

    | m | Retains previous file modification time. This option is ineffective on directories
    that are being copied. |


    The following example shows how to copy the directory /work and its subdirectories
    to a tape drive with the device name /dev/rmt/0.


    ```

    cd /work

    ls -R | cpio -ocB > /dev/rmt/0

    ```


    The next example shows how to copy the files located on a tape back into the directory
    named /work on a hard disk:


    ```

    cd /work

    cpio -icdB < /dev/rmt/0

    ```


    # Backing Up Files with Copy-Out Mode


    To use the copy-out mode to make backups, you send a list of files to the cpio
    command via the standard input of cpio. In practice, you''ll use the UNIX find
    command to generate the list of files to be backed up. Copy-out mode is specified
    by using the -o option on the cpio command line. In the next example, a file named
    list contains a short list of files to be backed up to tape.


    ```

    cpio -ovB list > /dev/rmt/1

    ```


    Normally, as indicated in Table 11-3, cpio writes files to the standard output
    in 512-byte records. By specifying the -B option, you increase the record size
    to 5,120 bytes to significantly speed up the transfer rate, as shown in the previous
    example.


    You can use UNIX commands to generate a list of files to be backed up by cpio
    in a number of other ways, as shown in the following examples.


    Files can be backed up by entering filenames via the keyboard. Enter Ctrl-D when
    you have finished typing filenames.


    ```

    cpio -o > /dev/rmt/1

    File1.txt

    File2.txt

    <Ctrl-D>

    ```


    The ls command can be used to generate the list of files to be backed up by cpio.


    ```

    cd /home/bcalkins

    ls * | cpio -o > /dev/rmt/1

    ```'
