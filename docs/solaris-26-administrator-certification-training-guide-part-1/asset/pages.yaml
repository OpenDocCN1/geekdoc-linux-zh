- pgno: 113
  md: '3. Fill in text boxes in the Add User window. Table 5-3 describes the information
    needed. If you aren''t sure how to complete a field, click on the Help button
    to see field definitions for this window.


    4. After entering the information, click on OK. The current list of user accounts
    is displayed in the Users main window.


    # Table 5-3 Add User Fields


    | Item | Description |

    |---|---|

    | User Name | Enter the login name that will be entered at the Solaris login prompt.
    Choose a name unique to your organization. The name can contain from two to eight
    letters and numerals, but no underscores. The first character must be a letter,
    and at least one character must be a lowercase letter. |

    | User ID | Enter the unique user ID (discussed in Chapter 4, "System Security").
    Admintool automatically assigns the next available UID; however, in a networked
    environment, make sure this number is not duplicated by another user on another
    system. All UIDs must be consistent across the network. |

    | Primary Group | Enter the primary group name or GID (group ID) number for the
    group to which the user will belong. This is the group the operating system will
    assign to files created by the user. |

    | Secondary Groups | (Optional) Enter the names or GIDs, separated by spaces,
    of any additional groups to which the user belongs. A user can belong to as many
    as 16 secondary groups. |

    | Comment | (Optional) Enter any comments, such as the full user name or phone
    number. |

    | Login Shell | Click on this button to select the shell the user will use; for
    example, /bin/csh. If nothing is selected, the default shell is the Bourne shell
    (/bin/sh). |

    | Password | Click on this button to specify the password status. Selectable options
    are as follows:

    Cleared until first login.

    [Default] Account does not have a password assigned. The user is prompted for
    a password on first login, unless passreq=no is set in /etc/default/login.

    Account is locked.

    Account is disabled with an invalid password and can be unlocked by assigning
    a new password. This type of account allows a user to own files but not to log
    in.

    No password; setuid only.

    Account cannot be logged into directly. This allows programs such as lp or uucp
    to run under an account without allowing a user to log in.

    Normal password.

    Account will have a password that you set in the pop-up window that appears. |'
