    # Shell Conditionals


    In addition to the built-ins listed in Tables 8-4 and 8-5, the Bourne shell also
    contains some simple conditionals. A conditional command makes a choice depending
    on the outcome of some condition. Examples of conditionals are &&, ||, if, and
    case.


    # && and ||


    The simplest conditional in the Bourne shell is the double ampersand (&&). When
    two commands are separated by a double ampersand, the second command executes
    only if the first command returns a zero exit status (an indication of successful
    completion).


    ```

    Example:

    ls -ld /usr/bin > /dev/null && echo "Directory Found"

    ```'
