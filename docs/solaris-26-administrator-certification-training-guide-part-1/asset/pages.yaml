- pgno: 95
  md: '> NOTE. Members of the sysadmin group (group 14) are allowed to use the Solstice
    AdminSuite software. A system administrator may assign this group to a backup
    system administrator or power user. Unless you are a member of the UNIX sysadmin
    group, you must become superuser on your system to use Admintool.


    # Controlling File Access


    After you have established login restrictions, you’ll need to control access to
    the data on the system. Some users only need to look at files; other users need
    the ability to change or delete files. You might have data you do not want anyone
    else to see. Data access is controlled by assigning permission levels to a file.
    Three levels of access permission are assigned to a UNIX file to control access
    by the owner, the group, and all others. Display permissions with the ls -la command.
    The following example shows the use of the ls -la command to display permissions
    on files in the /public directory:


    ```

    ls -la /users

    ```


    The system responds with


    ```

    drwxr-xr-x  2 bill  staff  512 Sep 23 07:02 .

    drwxr-xr-x  3 root  other  512 Sep 23 07:02 ..

    -rw-r--r--  1 bill  staff  124 Sep 23 07:02 .cshrc

    -rw-r--r--  1 bill  staff  575 Sep 23 07:02 .login

    ```


    The first column of information displays the type of file and its access permissions
    for the user, group, and others. The r, w, and x are described in Table 4-6. The
    third column displays the owner of the file—usually the user who created the file.
    The owner of a file can decide who has the right to read it, to write to it, or—if
    it is a command—to execute it. The fourth column displays the group to which this
    file belongs.


    Table 4-6 File Access Permissions


    | Symbol | Permission | Means Designated Users... |

    |---|---|---|

    | r | Read | Can open and read the contents of a file |

    | w | Write | Can write to the file (modify its contents), add to it, or delete
    it |

    | x | Execute | Can execute the file (if it is a program or shell script) |

    | - | Denied | Cannot read, write, or execute the file |


    When listing the permissions on a directory, all columns of information are the
    same as on a file, with one exception. The r, w, and x found in the first column
    are treated slightly differently than for a file and are described in Table 4-7.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Table 4-7 Directory Access Permissions


    | Symbol | Permission | Means Designated Users... |

    |---|---|---|

    | r | Read | Can list files in the directory. |

    | w | Write | Can add or remove files or links in the directory. |

    | x | Execute | Can open or execute files in the directory. Also can make the
    directory and the directories beneath it current. |

    | - | Denied | Neither read, write, nor execute privileges have been assigned.
    |


    Use the following commands to modify file access permissions and ownership, but
    remember that only the owner of the file or root can assign or modify these values.


    +   - **chmod** Changes access permissions on a file. You can use either symbolic
    mode (letters and symbols) or absolute mode (octal numbers) to change permissions
    on a file.

    - **chown** Changes the ownership of a file.

    - **chgrp** Changes the group ownership of a file.


    # Default umask


    When a user creates a file or directory, the default file permissions assigned
    to the file or directory are controlled by the user mask. The user mask should
    be set by the umask command in a user initialization file such as /etc/profile
    or .cshrc. You can display the current value of the user mask by typing umask
    and pressing Enter.


    The user mask is set with a three-digit octal value such as 022. The first digit
    sets permissions for the user; the second sets permissions for the group; the
    third sets permissions for other. To set the umask to 022, type:


    ```

    umask 022

    ```


    By default, the system sets the permissions on a file to 666, granting read and
    write permission to the user, group, and others. The system sets the default permissions
    on a directory or executable file to 777, or rwx. The value assigned by umask
    is subtracted from the default. To determine the umask value you want to set,
    subtract the value of the permissions you want from 666 (for a file) or 777 (for
    a directory). The remainder is the value to use with the umask command. For example,
    suppose you want to change the default mode for files to 644 (rw-r--r--). The
    difference between 666 and 644 is 022, which is the value you would use as an
    argument to the umask command.


    Setting the umask value has the effect of denying permissions in the same way
    chmod grants them. For example, the command chmod 022 grants write permission
    to group and others, and umask 022 denies write permission to group and others.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Sticky Bit


    The sticky bit is a permission bit that protects the files within a directory.
    If the directory has the sticky bit set, a file can be deleted only by the owner
    of the file, the owner of the directory, or by root. This prevents a user from
    deleting other users'' files from public directories. A t or T in the access permissions
    column of a file listing indicates the sticky bit has been set.


    ```

    drwxrwxrwt  2 uucp  uucp  512 Feb 12 07:32 /var/spool/uucppublic

    ```


    Use the chmod command to set the sticky bit. The symbols for setting the sticky
    bit by using the chmod command in symbolic mode are


    +   - t  Sticky bit is on; execution bit for others is on.

    - T  Sticky bit is on; execution bit for others is off.


    # Access Control Lists (ACLs)


    ACLs (ACLs, pronounced "ackls") can provide greater control over file permissions
    when the traditional UNIX file protection in the Solaris operating system is not
    enough. The traditional UNIX file protection provides read, write, and execute
    permissions for the three user classes: owner, group, and other. An ACL provides
    better file security by enabling you to define file permissions for the owner,
    owner''s group, others, specific users, and groups, and default permissions for
    each of those categories.


    For example, assume you have a file you want everyone in a group to be able to
    read. To give everyone access, you would give "group" read permissions on that
    file. Now, assume you want only one person in the group to be able to write to
    that file. Standard UNIX doesn''t let you set that up; however, you can set up
    an ACL to give only one person in the group write permissions on the file. ACL
    entries are the way to define an ACL on a file, and they are set through the ACL
    commands. ACL entries consist of the following fields, separated by colons and
    defined in Table 4-8:


    ```

    entry_type:uid:gid:perms

    ```


    **Table 4-8 ACL Entries**


    | Field | Description |

    |-------|-------------|

    | *entry_type* | Type of ACL entry on which to set file permissions. For example,
    entry_type can be user (the owner of a file) or mask (the ACL mask). |

    | *uid* | User name or identification number. |

    | *gid* | Group name or identification number. |

    | *perms* | Represents the permissions set on entry_type. Permissions are indicated
    by the symbolic characters rwx or an octal number as used with the chmod command.
    |'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'The ACL mask entry indicates the maximum permissions allowed for users, other
    than the owner, and for groups. The mask is a quick way to change permissions
    on all users and groups. For example, the mask:r-- mask entry indicates users
    and groups cannot have more than read permissions, even though they might have
    write/execute permissions.


    Set ACL entries on a file by using the setfacl command.


    ```

    $ setfacl -s user::perms,group::perms,other:perms,mask:perms,acl_entry_list

    filename ...

    ```


    The -s option replaces the entire ACL with the new ACL entries, if an ACL already
    exists on the file.


    The following example sets the user permissions to read/write, group permissions
    to read only, and other permissions to none on the txt1.doc file. In addition,
    the user Bill is given read/write permissions on the file, and the ACL mask permissions
    are set to read/write, which means no user or group can have execute permissions.


    ```

    $ setfacl -s user::rw,group:r--,other:---,mask:rw, user:bill:rw- txt1.doc

    ```


    Check the new file permissions with the ls -l command. The plus sign (+) to the
    right of the mode field indicates the file has an ACL:


    ```

    $ ls -l

    total 210

    -rw-r--...+ 1 mike sysadmin 32100 Sep 11 13:11 txt1.doc

    -rw-r--r-- 1 mike sysadmin 1410 Sep 11 13:11 txt2.doc

    -rw-r--r-- 1 mike sysadmin 1700 Sep 11 13:11 labnotes

    ```


    To verify which ACL entries were set on the file, use the getfacl command:


    ```

    $ getfacl txt1.doc

    ```


    The system responds with


    ```

    # file: txt1.doc

    # owner: mike

    # group: sysadmin

    user::rw-

    user:bill:rw-      #effective:rw-

    group::r--        #effective:r--

    mask:rw-

    other:---

    ```


    In addition to the ACL entries for files, you can set default ACL entries on a
    directory that apply to files created within the directory.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Setting the Correct Path


    Setting your path variable correctly is important: otherwise, you might accidentally
    run a program introduced by someone else that harms the data or your system. This
    kind of program, which creates a security hazard, is referred to as a “Trojan
    horse.” For example, a substitute su program could be placed in a public directory
    where you, as system administrator, might run it. Such a script would look just
    like the regular su command. The script would remove itself after execution. and
    you’d have trouble knowing you actually ran a Trojan horse.


    The path variable is automatically set at login time through the startup files:
    .login, .profile, and .cshrc. Setting up the user search path so the current directory
    (.) comes last prevents you or your users from running this type of Trojan horse.
    The path variable for superuser should not include the current directory (.) at
    all. Solaris provides a utility called ASET (Automated Security Enhancement Tool)
    that examines the startup files to ensure the path variable is set up correctly
    and does not contain a dot (.) entry for the current directory. ASET is discussed
    later in this chapter.


    # setuid and setgid Programs


    When set-user identification (setuid) permission is set on an executable file,
    a process that runs this file is granted access based on the owner of the file
    (usually root) rather than the user who created the process. This allows a user
    to access files and directories normally only available to the owner. For example,
    the setuid permission on the passwd command makes it possible for a user to edit
    the /etc/passwd file to change passwords. When a user executes the passwd command,
    that user assumes the permissions of the root ID, which is UID 0. The setuid permission
    can be identified by using the ls -l command. The -s in the permissions field
    of the following example indicates the use of setuid.


    ```

    ls -l /etc/passwd

    -r-sr-sr-x 1 root sys 10332 May 3 08:23 /usr/bin/passwd

    ```


    Many executable programs have to be run as root (that is, as superuser) to work
    properly. These executables run with the user ID set to 0 (setuid=0). Anyone running
    these programs runs them with the root ID, which creates a potential security
    problem if the programs are not written with security in mind.


    On the other hand, the use of setuid on an executable program presents a security
    risk. A determined user can usually find a way to maintain the permissions granted
    to him by the setuid process, even after the process has finished executing. For
    example, a particular command might grant root privileges through the setuid.
    If a user can break out of this command, that user could still have the root privileges
    granted by the setuid on that file. Any intruder permission who accesses a system
    will look for any files that have the setuid.


    Except for the executables shipped with Solaris with setuid to root, you should
    disallow the use of setuid programs—or at least restrict and keep them to a minimum.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '**TIP.** *To find files with setuid permissions, become superuser. Then use
    the find command to find files with setuid permissions set:*


    ```

    # find [directory] -user root -perm -4000 -exec ls -ldb {} \; > /tmp/filename

    ```


    The set-group identification (setgid) permission is similar to setuid, except
    the process''s effective group ID (GID) is changed to the group owner of the file,
    and a user is granted access based on permissions granted to that group. Using
    the ls -l command, you can see that the file /usr/bin/mail has setgid permissions:


    ```

    -r-xr-s--x 1 bin mail 64376 Jul 16 1997 /usr/bin/mail

    ```


    # Restricted Shells


    System administrators can use restricted versions of the Korn shell (rksh) and
    Bourne shell (rsh) to limit the operations allowed for a particular user account.
    Restricted shells are especially useful for ensuring that timesharing users, or
    users'' guests on a system, have restricted permissions during login sessions.
    When an account is set up with a restricted shell, users may not:


    +   - Change directories

    - Set the $PATH variable

    - Specify path or command names beginning with "/"

    - Redirect output


    You can also provide the user with shell procedures that have access to the full
    power of the standard shell, but impose a limited menu of commands.


    **NOTE.** *Do not confuse the restricted shell with the remote shell:*


    ```

    /usr/lib/rsh - restricted shell

    /usr/bin/rsh - remote shell

    ```


    *When specifying a restricted shell, you should not include the user''s path /bin,
    /sbin, or /usr/bin. Doing so allows the user to start another shell (a nonrestricted
    shell).*


    # Monitoring Users and System Usage


    As the system administrator, you''ll need to monitor system resources and be on
    the lookout for unusual activity. Having a method to monitor the system is very
    useful when there is a'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'suspected breach in security. For example, you might want to monitor the login
    status of a particular user.


    +   1. Become superuser.

    2. Display a user''s login status by using the logins command:


    ```

    # logins -x -l username

    ```


    For example, to monitor login status for the user calkins, type


    ```

    # logins -x -l calkins

    ```


    The system displays the following information:


    ```

    calkins 200 staff 10 Bill S. Calkins

    /export/home/calkins

    /bin/sh

    PS 030195 10 7 -1

    ```


    Table 4-8 describes the information output of the logins command.


    Table 4-8 Output from the logins Command


    | | |

    |---|---|

    | Calkins | The login name |

    | 200 | The UID |

    | staff | The primary group |

    | 10 | The group ID |

    | Bill S. Calkins | The comment field of the /etc/passwd file |

    | /export/home/calkins | The user''s home directory |

    | /bin/sh | The user''s default login shell |

    | PS 030195 10 7 -1 | Specifies the password aging information: last date password
    was changed, number of days required between changes, number of days allowed before
    a change is required, and warning period |


    You''ll want to monitor user logins to ensure their passwords are secure. A potential
    security problem is to have users without passwords (in other words, users who
    use a carriage return for a password). Periodically check user logins by using
    the following method:


    +   1. Become superuser.

    2. Display users who have no passwords by using the logins command:


    ```

    # logins -p

    ```


    The system responds with a list of users who do not have passwords.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'Another good idea is to watch anyone who has tried to access the system but
    failed. You can save failed login attempts by creating the /var/adm/loginlog file
    with read and write permission for root only. After you create the loginlog file,
    all failed login activity is written to this file automatically after five failed
    attempts.


    The loginlog file contains one entry for each failed attempt. Each entry contains
    the user''s login name, the tty device, and the time of the failed attempt. If
    a person makes fewer than five unsuccessful attempts, none of the attempts is
    logged.


    The loginlog file might grow quickly. To use the information in this file and
    to prevent the file from getting too large, you must check it and clear its contents
    occasionally. If this file shows a lot of activity, someone might be attempting
    to break into the computer system.


    # Checking Who''s Logged In


    Use the Solaris who command to find out who''s logged into a system. For each
    user logged in, the who command lists the user''s name, the terminal she is using,
    when she logged in, the elapsed time since activity occurred at the terminal,
    and the process-ID of the shell she is using. To obtain this information, the
    who command examines the /var/adm/utmpx file, which contains a history of all
    logins since the file was last created.


    The Solaris last command looks in the /var/adm/wtmp file for information about
    users who have logged into the system. The last command displays the sessions
    of the specified users and terminals in chronological order. For each user, last
    displays the time when the session began, the duration of the session, and the
    terminal where the session took place. The last command also indicates if the
    session is still active or was terminated by a reboot.


    For example, the command last root console lists all of root''s sessions as well
    as all sessions on the console terminal.


    # Network Security


    The most difficult system administration issue to administer is network security.
    When you connect your computer to the rest of the world via a network, someone
    could find an opening. A way to protect your network from unauthorized users accessing
    hosts on your network is to use a firewall or secure gateway system. A firewall
    is a dedicated system separating two networks, each of which approaches the other
    as not trusted—a secure host that acts as a barrier between your internal network
    and outside networks. The firewall has two primary functions. It acts as a gateway
    to pass data between the networks, and it acts as a barrier to block the passage
    of data to and from the network. In addition, the firewall system receives all
    incoming email and distributes it to the hosts on the internal network.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Modems


    Modems are always a potential point of entry for intruders. Anyone who discovers
    the phone number can attempt to log in. Low-cost computers can be turned into
    automatic calling devices that search for modem lines and then try endlessly to
    guess passwords and break in. If you must use a modem, use it for outgoing calls
    only. An outgoing modem will not answer the phone. If you allow calling in, implement
    a callback system. The callback system guarantees that only authorized phone numbers
    can connect to the system. Another option is to have two modems that establish
    a security key between one and the other. This way, only modems with the security
    key can connect with the system modem and gain access to the computer.


    # The Trusted Host


    Along with protecting the password, you need to protect your system from a root
    user coming in from across the network. For example, systemA is a trusted host
    from which a user can log in without being required to type a password. Be aware
    that a user who has root access on systemA could access the root login on systemB
    simply by logging in across the network if systemA is set up as a trusted host
    on systemB. When systemB attempts to authenticate root from systemA, it relies
    on information in its local files; specifically /etc/hosts.equiv and /.rhosts.


    # The /etc/hosts.equiv File


    The /etc/hosts.equiv file contains a list of trusted hosts for a remote system,
    one per line.


    A hosts.equiv file has the following structure:


    ```

    system1

    system2 user_a

    ```


    If a user (root) attempts to log in remotely by using rlogin from one of the hosts
    listed in this file, and if the remote system can access the user''s password
    entry, the remote system allows the user to log in without a password.


    When an entry for a host is made in hosts.equiv, such as the sample entry for
    system1, it means the host is trusted and so is any user at that machine. If the
    user name is also mentioned, as in the second entry in the same file, the host
    is trusted only if the specified user is attempting access. A single line of +
    in the /etc/hosts.equiv file indicates that every known host is trusted.


    The /etc/hosts.equiv file presents a security risk. If you maintain an /etc/hosts.equiv
    file on your system, this file should include only trusted hosts in your network.
    The file should not include any host that belongs to a different network or any
    machines that are in public areas.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'TIP. Change the root login to something other than "root," and never put a
    system name into the /etc/hosts.equiv file without a name or several names after
    it.


    # The .rhosts File


    The .rhosts file is the user equivalent of the /etc/hosts.equiv file. It contains
    a list of hosts and users. If a host-user combination is listed in this file,
    the specified user is granted permission to log in remotely from the specified
    host without having to supply a password. Note that an .rhosts file must reside
    at the top level of a user''s home directory, because .rhosts files located in
    subdirectories are not consulted. Users can create .rhosts files in their home
    directories—another way to allow trusted access between their own accounts on
    different systems without using the /etc/hosts.equiv file.


    The .rhosts file presents a major security problem. Although the /etc/hosts.equiv
    file is under the system administrator''s control and can be managed effectively,
    any user can create an .rhosts file granting access to whomever the user chooses—without
    the system administrator''s knowledge.


    When all of the users'' home directories are on a single server, and only certain
    people have superuser access on that server, a good way to prevent a user from
    using an .rhosts file is to create (as superuser) an empty file in the user''s
    home directory. Then change the permissions in this file to 000 so changing it
    would be difficult, even as superuser. This would effectively prevent a user from
    risking system security by using an .rhosts file irresponsibly.


    The only secure way to manage .rhosts files is to completely disallow them. One
    possible exception to this policy is the root account, which might need to have
    an .rhosts file to perform network backups and other remote services.


    # Securing Superuser Access


    The UNIX superuser identity is immune from restrictions placed on other users
    of the system. Any UNIX account with a UID of zero (0) is the superuser. All UNIX
    systems have a default superuser login named root. The user of this account can
    access any file and run any command. This login is valuable because any user who
    might have gotten himself into trouble by removing access permissions or forgetting
    his password, or who simply needs a file from an area to which he doesn''t have
    access, can be helped by root. Root access, however, can be very dangerous. Root
    can delete anything, including the operating system (most system administrators
    remember deleting the entire root file system at one time or another). The root
    login is both dangerous and necessary. System administrators must not give this
    password to anyone and should use it themselves only when required.


    NOTE. Change the default root login to another name. The first login attempt made
    by any system cracker is to try logging in as "root." If this login is on the
    system, the cracker is halfway in and only needs to guess the password to gain
    access.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Restricting Root Access


    Root access needs to be safeguarded against unauthorized use. Assume that any
    intruder is looking for root access. You can protect the superuser account on
    a system by restricting access to a specific device through the /etc/default/login
    file. For example, if superuser access is restricted to the console, the superuser
    can only log in at the console, which should be in a locked room. Anybody who
    remotely logs in to the system to perform an administrative function must first
    log in with her user login and then use the su command to become superuser.


    To restrict superuser (root) from logging in to the system console from a remote
    system:


    +   1. Become superuser.

    2. Edit the /etc/default/login file.

    3. Uncomment the following line.


    ```

    CONSOLE=/dev/console

    ```


    # Monitoring Superuser Access


    Solaris provides a utility for monitoring all attempts to become superuser. These
    logs are very useful when you''re trying to track down unauthorized activity.
    Whenever someone issues the su command to switch from user and become root, this
    activity is logged in a file called /var/adm/sulog. The sulog file lists all uses
    of the su command, not only those used to switch user to superuser. The entries
    show the date and time the command was entered, whether it was successful, the
    port from which the command was issued, and the name of the user and the switched
    identity.


    To monitor whom is using the su command, you must first turn on this logging utility.
    To turn on logging of the su command:


    +   1. Become superuser.

    2. Edit the /etc/default/su file.

    3. Uncomment the following line.


    ```

    SULOG=/var/adm/sulog

    ```


    Through the /etc/default/su file, you can also set up the system to display a
    message on the console each time an attempt is made to use the su command to gain
    superuser access from a remote system. This is a good way to immediately detect
    someone trying to gain superuser access on the system on which you are working.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'To display superuser (root) access attempts to the console:


    +   1. Become superuser.

    2. Edit the /etc/default/su file.

    3. Uncomment the following line:

    4. Use the su command to become root, and verify that a message is printed on
    the system console.


    ```

    CONSOLE=/dev/console

    ```


    # Automated Security Enhancement Tool (ASET)


    SunOS 5.x system software includes the Automated Security Enhancement Tool (ASET).
    ASET helps you monitor and control system security by automatically performing
    tasks you would otherwise do manually. ASET performs the following seven tasks,
    each making specific checks and adjustments to system files and permissions to
    assure system security.


    +   - Verifies appropriate system file permissions

    - Verifies system file contents

    - Checks consistency and integrity of /etc/passwd and /etc/group entries

    - Checks on the contents of system configuration files

    - Checks environment files (.profile, .login, .cshrc)

    - Verifies appropriate eeprom settings

    - Builds a firewall on a router


    The ASET security package the provides automated administration tools that enable
    you to control and monitor your system’s security. You specify a low, medium,
    or high security level at which ASET will run. At each higher level, ASET’s file-control
    functions increase to reduce file access and tighten your system security.


    ASET tasks are disk-intensive and can interfere with regular activities. To minimize
    the impact on system performance, schedule ASET to run when the system activity
    level is lowest—for example, once every 24 or 48 hours at midnight.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Common Sense Security Techniques


    A system administrator can have the best system security measures in place, but
    without the users’ cooperation, system security will be compromised. The system
    administrator must teach common-sense rules regarding system security, such as:


    +   - Use proper passwords. Countless sites use passwords such as "admin" or "supervisor"
    for their root accounts.

    - Don’t give your password out to anyone, no matter who they say they are. One
    of the best system crackers of our time would simply pose as a system support
    person, ask a user for his password, and have free reign to the system.

    - If you walk away from the system, log out or lock the screen. Think of the damage
    if someone walked up to your station and sent a scathing email to the president
    of your company—with your name attached!

    - Don’t connect modems to your system without approval from the system administrator.


    We’ve discussed fundamental concepts in system security in this chapter. Although
    system crackers seem to always find new ways to break into systems, the concepts
    described in this chapter provide a strong defense against an attack. Chapter
    5, "Setting Up User Accounts," will put these concepts to practical use as you
    set up and manage user accounts.'
  merge: -1
  img_proc: true
