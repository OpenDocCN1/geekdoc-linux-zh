- pgno: 130
  md: '# Figure 6-9


    The pkginfo output.


    ![](img/85737305a4c9aeecbcadd9986d604c02_130_0.png)


    # Software Patches


    Another system administration task is managing system software patches. A patch
    is a fix to a reported software problem. Sun will ship several software patches
    to customers so problems can be resolved before the next release of software.
    The existing software is derived from a specified package format, which conforms
    to the Application Binary Interface.


    Patches are identified by unique alphanumeric strings, with the patch base code
    first, a hyphen, and then a number that represents the patch revision number.
    For example, patch 101977-04 is a Solaris 2.x patch to correct the lockd daemon.


    You might want to know more about patches that have previously been installed.
    Table 6-2 shows commands that provide useful information about patches already
    installed on a system.


    # Table 6-2 Helpful Commands for Patch Administration


    | Command | Function |

    |---|---|

    | showrev -p | Shows all patches applied to a system. |

    | pkgparam pkgid PATCHLIST | Shows all patches applied to the package identified
    by pkgid. |

    | pkgparam pkgid PATCH_INFO_patch-number | Shows the installation date and name
    of the host from which the patch was applied. pkgid is the name of the package;
    for example, SUNWadmap. |

    | patchadd -R client_root_path -p | Shows all patches applied to a client, from
    the server''s console. |

    | patchadd -p | Shows all patches applied to a system. |

    | patchrm patchname | Removes a specified patch. |'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Installing a Patch


    All Sun customers can access security patches and other recommended patches via
    the World Wide Web or anonymous FTP. Sun customers who have purchased a service
    contract can access an extended set of patches and a complete database of patch
    information. This information is available via the World Wide Web or anonymous
    FTP and is regularly distributed on a CD-ROM. See Appendix D, "On the Web," for
    a listing of useful Web sites and where to access patches via the Web.


    Detailed information about how to install and remove a patch is provided in the
    Install.info file included with each patch. Each patch also contains a README
    file that contains specific information about the patch.


    The patchadd command is used to install directory-format patches to a Solaris
    2.x system and must be run as root. The syntax is


    ```

    patchadd [ -d ] [ -u ] [ -B backout_dir ]

    ```


    The patchadd command is described in Table 6-3.


    # Table 6-3 patchadd Command Options


    | Common Option | Description |

    |---|---|

    | -d | Does not create a backup of the files to be patched. The patch cannot be
    removed when this option has been used to install the patch. By default, patchadd
    saves a copy of all files being updated so the patch can be removed if necessary.
    Do not use the -d option unless you''re positive the patch has been tested. |

    | -p | Displays a list of the patches currently applied. |

    | -u | Installs the patch unconditionally, with file validation turned off. The
    patch is installed even if some of the files to be patched have been modified
    since their original installation. |

    | -B backout_dir | Saves backout data to a directory other than the package database.
    Specify backout_dir as an absolute pathname. |


    Additional options to the patchadd command security can be found online in the
    Solaris system manual pages.


    The following example installs a patch to a standalone machine.


    ```

    patchadd /var/spool/patch/104945-02

    ```


    The following example installs multiple patches. The patchlist file specifies
    a file containing a list of patches to install.


    ```

    patchadd -M /var/spool/patch patchlist

    ```'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'The following example displays the patches installed on a system.


    ```

    patchadd -R /export/root/client1 -p

    ```


    When you''re installing a patch, the patchadd command copies files from the patch
    directory to the local system''s disk. More specifically, patchadd does two things:


    +   - Determines the Solaris version number of the managing host and the target
    host.

    - Updates the patch package''s pkginfo file with information about patches made
    obsolete by the patch being installed, other patches required by this patch, and
    patches incompatible with this patch.


    The patchadd command will not install a patch under the following conditions:


    +   - The package is not fully installed on the host.

    - The patch architecture differs from the system architecture.

    - The patch version does not match the installed package version.

    - There is already an installed patch with the same base code and a higher version
    number.

    - The patch is incompatible with another, already installed patch. (Each installed
    patch keeps this information in its pkginfo file.)

    - The patch being installed requires another patch that is not installed.


    # Removing a Patch


    Sometimes a patch does not work as planned and needs to be removed from the system.
    The utility used to remove or “back out” of a patch is the patchrm command described
    in Table 6-4. Its syntax is


    ```

    patchrm [ -f ] [ -B backout_dir ]

    ```


    The patchrm command removes a Solaris 2.x patch package and restores previously
    saved files, restoring the file system to its state before a patch was applied,
    unless


    +   - The patch was installed with patchadd -a. The -a option instructs patchadd
    not to save copies of files being updated or replaced.

    - The patch has been made obsolete by a later patch.

    - The patch is required by another patch.

    - The patchrm command calls pkgadd to restore packages saved from the initial
    patch installation.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Table 6-4 patchrm Command Options


    | Common Options | Description |

    |---|---|

    | -f | Forces the patch removal regardless of whether the patch was superseded
    by another patch. |

    | -B backout_dir | Removes a patch whose backout data has been saved to a directory
    other than the package database. This option is needed only if the original backout
    directory, supplied to the patchrm command at installation time, has been moved.
    Specify backout_dir as an absolute pathname. |


    The following example removes a patch from a standalone system:


    ```

    patchrm 104945-02

    ```


    # General Guidelines


    Some software packages do not conform to the ABI and therefore cannot be installed
    by using AdminTool or the pkgadd command. For installation of products that do
    not conform to ABI, follow the vendor''s specific installation instructions. Here
    are a few additional guidelines to follow when installing new software on a system:


    +   - Always be cautious with third-party or public-domain software. Make sure
    the software has been tested and is free of viruses before installing it on a
    production system.

    - Make sure the software package is supported under Solaris 2.6.

    - Always read the vendor''s release notes for special loading instructions. They
    might contain kernel parameters that need to be modified or suggest software patches
    that need to be applied.

    - Do not install patches unless directed by Sun or one of your software providers.
    Some patches have not been tested thoroughly, especially when used in conjunction
    with other software patches. Adverse system performance problems could result.


    Adding and removing software packages is one of the simpler tasks you will encounter
    in system administration. As with all computer software, you should first load
    new software packages on a nonproduction system for test purposes. Only after
    the software has been thoroughly tested should you install it on a production
    system.


    This chapter described installing software, creating file systems, and setting
    up user accounts. Now it''s time to start customizing what you have installed
    on the system. Chapter 7, "Administration and Configuration of the CDE," describes
    customization of the user''s work environment. Looking ahead, Chapter 11, "Backup
    and Recovery," describes how to create a tape backup of everything you''ve installed.
    A good backup can save you time in the event of a hardware malfunction. With a
    good backup, you won''t need to retrace the steps of reinstalling software packages
    or patches and setting up users.'
  merge: -1
  img_proc: true
