- pgno: 44
  md: 'The installation process consists of three phases: system configuration, system
    installation, and post-installation tasks, such as setting up printers, users,
    and networking. This chapter describes the various system configurations and the
    installation of the Solaris operating system. Later chapters cover post-installation
    topics.


    The first step in the installation is to determine whether your system type is
    supported under Solaris 2.6. Second, you''ll need to decide on the system configuration
    you want to install and whether you have enough disk space to support that configuration.


    In preparation for installing Solaris 2.6 on a system, use Table 2-1 to check
    if your system type is supported. Also, make sure you have enough disk space for
    Solaris and all of the packages you plan to install. The section on software configuration
    clusters will help you estimate the amount of disk space required to hold the
