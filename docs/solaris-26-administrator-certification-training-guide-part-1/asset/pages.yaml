    # Restoring a File System with ufsrestore


    Use ufsrestore to restore data from tape to disk. The ufsrestore command copies
    files from backups created by using the ufsdump command. You can use ufsrestore
    to reload an entire file system from a level 0 dump and incremental dumps that
    follow it or to restore one or more single files from any dump tape. If ufsrestore
    is run by root, files are restored with their original owner, last modification
    time, and mode (permissions).


    The syntax for the ufsrestore command is


    ```

    ufsrestore options arguments filename(s)

    ```


    where


    | | |

    |---|---|

    | options | You must choose one and only one of these options: i, r, R, t, or
    x. |

    | arguments | Follows the option string with the arguments that match the options.
    |

    | filename(s) | Specifies files to be restored as arguments to the x or t options
    and must always come last. |'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Table 11-9 describes some of the more common options and arguments for the
    ufsrestore command. For a full listing, refer to the Solaris online manual pages.


    # Table 11-9 Command Options for ufsrestore


    | Option | Description |

    |---|---|

    | i | Interactive. Runs ufsrestore in an interactive mode. In this mode, you can
    use a limited set of shell commands to browse the contents of the media and select
    individual files or directories to restore. See Table 11-10 for a list of available
    commands. |

    | r | Recursive. Restores the entire contents of the media into the current working
    directory, which should be the top level of the file system. Information used
    to restore incremental dumps on top of the full dump is also included. To completely
    restore a file system, use this option to restore the full (level 0) dump and
    then for each incremental dump. This is intended for a new file system that was
    just created with the newfs command. |

    | x filename(s) | Extract. Selectively restores the files you specify by the filename(s)
    argument. Filename(s) can be a list of files and directories. All files under
    a specified directory are restored unless you also use the h option. If you omit
    filename(s) or enter "." for the root directory, all files on all volumes of the
    media (or from standard input) are restored. Existing files are overwritten and
    warnings are displayed. |

    | t filename(s) | Table of contents. Checks the files specified in the filename(s)
    argument against the media. For each file, the full filename and the inode number
    (if the file is found) is listed. If the filename is not found, ufsrestore indicates
    the file is not on the "volume," meaning any volume in a multi-volume dump. If
    you do not enter the filename(s) argument, all files on all volumes of the media
    are listed without distinguishing on which volume the files are located. When
    you use the h option, only the directory files specified in filename(s)—not their
    contents—are checked and listed. The table of contents is read from the first
    volume of the media or (if you use the a option) from the specified archive file.
    This option is mutually exclusive with the x and r options. |

    | b factor | Blocking factor. Specifies the number of 512-byte blocks to write
    to tape per operation. By default, ufsrestore tries to figure out the block size
    used in writing the tape. |

    | m | Restores specified files into the current directory on the disk, regardless
    of where they are located in the backup hierarchy, and renames them with their
    inode number. For example, if the current working directory is /files, a file
    in the backup named ./database/test with inode number 156 is restored as /files/156.
    This option is useful when you are extracting only a few files. |

    | s n | Skips to the nth backup file on the media. This option is useful when
    you put more than one backup on a single tape. |

    | v | Verbose. Displays the names and inode numbers of each file as it is restored.
    |'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'Table 11-10 lists the commands that can be used with ufsrestore when selecting
    interactive mode (ufsrestore -i).


    # Table 11-10 Commands for an Interactive Restore


    | Command | Description |

    |---|---|

    | ls directory-name | Lists the contents of either the current directory or the
    specified directory. Directories are suffixed with a /. Entries in the current
    list to be restored (extracted) are marked by an * prefix. if the verbose option
    is in effect, inode numbers are also listed. |

    | cd directory-name | Changes to the specified directory in the backup hierarchy.
    |

    | add filename | Adds the current directory or the specified file or directory
    to the list of files to extract (restore). If you do not use the h option, all
    files in a specified directory and its subdirectories are added to the list. Note
    that all of the files you want to restore to a directory might not be on a single
    backup tape or disk. You might need to restore from multiple backups at different
    levels to get all of the files. |

    | delete filename | Deletes the current directory or the specified file or directory
    from the list of files to extract (restore). If you do not use the h option, all
    files in the specified directory and its subdirectories are deleted from the list.
    Note that the files and directories are deleted only from the extract list you
    are building. They are not deleted from the media. |

    | extract | Extracts the files in the list and restores them to the current working
    directory on the disk. Specify 1 when asked for a volume number. If you are doing
    a multi-tape or multi-disk restore and restoring a small number of files, start
    with the last tape or disk. |

    | help | Displays a list of commands you can use in interactive mode. |

    | pwd | Displays the pathname of the current working directory in the backup hierarchy.
    |

    | q | Quits interactive mode without restoring any additional files. |

    | verbose | Turns on or off the verbose option. Verbose mode can also be entered
    as v on the command line outside of interactive mode. When verbose is on, the
    interactive ls command lists inode numbers and the ufsrestore command displays
    information on each file as it is extracted. |


