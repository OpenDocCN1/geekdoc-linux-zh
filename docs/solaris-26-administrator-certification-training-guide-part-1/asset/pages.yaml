- pgno: 89
  md: '# CHAPTER


    # 4


    # System Security


    The following are the test objectives for this chapter:


    +   - Understanding the superuser account and its importance to system administration

    - Understanding the format of the /etc/passwd, /etc/shadow, and /etc/group files
    and their importance to system security

    - Changing ownership and access permissions on files and directories

    - Displaying and changing default permissions (umask)

    - Setting access control lists (ACLs) on files

    - Monitoring system and user activity

    - Modifying system defaults to control and monitor superuser access to the system

    - Monitoring and restricting access to the root account

    - Understanding how the setuid and setgid permissions relate to system security

    - Understanding how the sticky permission protects files and directories


    ![](img/85737305a4c9aeecbcadd9986d604c02_89_0.png)'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Keeping the system''s information secure is one of the primary tasks for the
    system administrator. System security involves protecting data against loss due
    to a disaster or system failure. In addition, it is the system administrator''s
    responsibility to protect systems from the threat of an unauthorized intruder
    and to protect data on the system from unauthorized users. Some of the worst disasters
    I''ve seen have come from authorized personnel—even system administrators—destroying
    data unintentionally. Therefore, the system administrator is presented with two
    levels of security: protecting data from accidental loss and securing the system
    against intrusion or unauthorized access.


    The first scenario, protecting data from accidental loss, is easy to achieve with
    a full system backup scheme you run regularly. Regular backups provide protection
    in the event of a disaster. If a user accidentally destroys data, the hardware
    malfunctions, or a computer program simply corrupts data, the system administrator
    can restore files from the backup media.


    The second form of security, securing the system against intrusion or unauthorized
    access, is more complex. This chapter cannot cover every security hole or threat,
    but it does discuss UNIX security fundamentals. Protection against intruders involves


    +   - Physical security—Limiting physical access to the computer equipment

    - Access to data—Limiting user access via passwords and permissions

    - Network security—Protecting against access through phone lines, serial lines,
    or the network

    - Superuser access—Reserving superuser access for system administration use only


    # Physical Security


    Physical security is simple: Lock the door. Limit the people who have physical
    access to the computer equipment to prevent theft or vandalism. In addition, limit
    access to the system console. Anyone who has access to the console ultimately
    has access to the data. If the computer contains sensitive data, keep it locked
    in a controlled environment with clean power and adequate protection against fire,
    lightning, flood, or other building disasters. Restrict access to protect against
    tampering with the system and its backups. Anyone with access to the backup media
    could steal it and access the data. Furthermore, if a system is logged in and
    left unattended, anyone who can use that system can gain access to the operating
    system and the network. Make sure your users log out or "lock" their screens before
    walking away. In sum, you need to be aware of your users'' computer surroundings
    and you need to physically protect them from unauthorized access.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Controlling System Access


    Controlling access to systems involves using passwords and appropriate file permissions.
    To control access, all logins must have passwords, and the passwords must be changed
    frequently. Password aging is a system parameter set by the system administrator
    requiring users to change their passwords after a specific number of days. Password
    aging enables you to force users to change their passwords periodically or to
    prevent users from changing a password before a specified interval. Set an expiration
    date for a password to prevent an intruder from gaining undetected access to the
    system through an old and inactive account. For a high level of security, you
    should require users to change their passwords every six weeks. Once every three
    months is adequate for lower levels of security. Change system administration
    logins (such as root and sys) monthly, or whenever a person who knows the root
    password leaves the company or is reassigned.


    Several files that control default system access are stored in the /etc/default
    directory. These files limit access to specific systems on a network. Table 4-1
    summarizes the files in the /etc/default directory.


    **Table 4-1 Files in /etc/default Directory**


    | /etc/default/login | Controls system login policies, including root access.
    The default is to limit root access to the console. |

    | /etc/default/passwd | Controls default policy on password aging. |

    | /etc/default/su | Specifies where attempts to su to root are logged and where
    these log files are located. The file also specifies whether attempts to su to
    root are displayed on a named device (such as a system console). |


    You can set default values in the /etc/default/passwd file to control user passwords.
    See Table 4-2 for the list of options that can be controlled through the /etc/default/passwd
    file.


    **Table 4-2 Flags in /etc/default/passwd**


    | MAXWEEKS | Maximum time period password is valid |

    | MINWEEKS | Minimum time period before the password can be changed |

    | PASSLENGTH | Minimum length of password, in characters |

    | WARNWEEKS | Time period until warning of password''s ensuing expiration date
    |


    The system administrator’s job is to ensure that all users have secure passwords.
    Improper passwords can be broken by a system cracker and could put the entire
    system at risk.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Enforce the following guidelines on passwords:


    +   - Combinations of six to eight letters, numbers, or special characters

    - Phrases (beammeup)

    - Nonsense words made up of the first letters of every word in a phrase (swotrb
    for SomeWhere Over The RainBow)

    - Words with numbers or symbols substituted for letters (sn00py for snoopy)


    On the other hand, poor choices for passwords include:


    +   - Proper nouns, names, login names, and other passwords a person might guess
    just by knowing something about you (the user)

    - Your name forwards, backwards, or jumbled

    - Names of family members or pets

    - Car license numbers

    - Telephone numbers

    - Social Security numbers

    - Employee numbers

    - Names related to a hobby or interest

    - Seasonal themes, such as Santa in December

    - Any word in the dictionary

    - Simple keyboard patterns (asdfgh)

    - Passwords you’ve used previously


    # Where User Account Information is Stored


    User account and group information is stored in files located in the /etc directory.


    Most of the user account information is stored in the /etc/passwd file; however,
    password encryption and password aging are stored in the /etc/shadow file. Group
    information is stored in the /etc/group file. Users are put together into groups
    based on their file access needs; for example, the “acctng” group might be users
    in the accounting department.


    Fields in the /etc/passwd file are separated by colons and contain the following
    information:


    ```

    username:password:uid:gid:comment:home-directory:login-shell

    ```


    Each line in the /etc/passwd file contains several fields, separated by a colon
    (:) and defined in Table 4–3.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Table 4-3 Fields in the /etc/passwd file


    | Field Name | Description |

    |---|---|

    | username | Contains the information user or login name. User names should be
    unique and consist of 1-8 letters (A-Z, a-z) and numerals (0-9) but no underscores
    or spaces. The first character must be a letter, and at least one character must
    be a lowercase letter. |

    | password | Contains an x, which is a placeholder for the encrypted password
    that is stored in the /etc/shadow file. |

    | uid | Contains a user identification (UID) number that identifies the user to
    the system. UID numbers for regular users should range from 100 to 2147483647.
    All UID numbers should be unique. UIDs less than 100 are reserved. To minimize
    security risks, avoid reusing the UIDs from deleted accounts. |

    | gid | Contains a group identification (GID) number that identifies the user''s
    primary group. Each GID number must be a whole number between 0 and 2147483647
    (60001 and 60002 are assigned to nobody and noaccess, respectively). |

    | comment | Usually contains the full name of the user. |

    | home-directory | Contains the user''s home directory path name. |

    | login-shell | Contains the user''s default login shell. |


    Fields in the /etc/shadow file are separated by colons and contain the following
    information:


    ```

    username:password:lastchg:min:max:warn:inactive:expire

    ```


    Each line in the /etc/shadow file contains several fields separated by colons
    (:) and defined in Table 4-4.


    # Table 4-4 Fields in the /etc/shadow file


    | Field Name | Description |

    |---|---|

    | username | Contains the user or login name. |

    | password | Might contain the following entries: a 13-character encrypted user
    password; the string *LK*, which indicates an inaccessible account; or the string
    NP which indicates no password on the account. |

    | lastchg | Indicates the number of days between January 1, 1970, and the last
    password modification date. |

    | min | Contains the minimum number of days required between password changes.
    |

    | max | Contains the maximum number of days the password is valid before the user
    is prompted to specify a new password. |

    | inactive | Contains the number of days a user account can be inactive before
    being locked. |

    | expire | Contains the absolute date when the user account expires. Past this
    date, the user cannot log into the system. |'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'The fields in the group file are separated by colons and contain the following
    information:


    group-name:group-password:gid:user-list


    Each line in the /etc/group file contains several fields, separated by colons
    (:) and defined in Table 4-5.


    # Table 4-5 Fields in the /etc/group File


    | Field Name | Description |

    |---|---|

    | group-name | Contains the name assigned to the group. For example, members of
    the accounting department might be called acct. Group names can have a maximum
    of nine characters. |

    | group-password | Usually contains an asterisk or is empty. The group-password
    field is a relic of earlier versions of UNIX. |

    | gid | Contains the group''s GID number. It must be unique on the local system
    and should be unique across the entire organization. Each GID number must be a
    are whole number between 0 and 60002. Numbers under 100 are reserved for system
    default group accounts. User-defined groups can range from 100 to 60000 (60001
    and 60002 are reserved and assigned to nobody and noaccess, respectively). |

    | user-list | Contains a list of groups and a comma-separated list of user names,
    representing the user''s secondary group memberships. Each user can belong to
    a maximum of 16 secondary groups. |


    By default, all Solaris 2.x systems have the following groups already defined
    in the /etc/group file. Do not use the following groups for users and do not remove
    them.


    ```

    root::0:root

    other::1:

    bin::2:root,bin,daemon

    sys::3:root,bin,sys,adm

    adm::4:root,adm,daemon

    uucp::5:root,uucp

    mail::6:root

    tty::7:root,tty,adm

    lp::8:root,lp,adm

    nuucp::9:root,nuucp

    staff::10:

    daemon::12:root,daemon

    sysadmin::14:

    nobody::60001:

    noaccess::60002:

    nogroup::65534:

    ```'
  merge: -1
