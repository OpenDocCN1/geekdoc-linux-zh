- pgno: 223
  md: '# CHAPTER


    # 12


    # Device Administration


    The following are the test objectives for this chapter:


    +   - Understanding Solaris port monitors, the Service Access Facility (SAF),
    and related configuration files

    - Understanding how to use AdminTool and the Service Access Facility (SAF) commands
    to manage serial ports

    - Adding terminals and modems to a system and using SAF and AdminTool


    ![](img/85737305a4c9aeecbcadd9986d604c02_223_0.png)'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'This chapter describes the administration of terminals and modems within Solaris.
    In that context, we''ll explore terminals, modems, port monitors, and services.


    Terminals and modems provide access to local and remote system resources; therefore,
    setting up terminals and modem access is an important responsibility for a system
    administrator. Most experienced system administrators agree that managing the
    terminals and modems in UNIX is one of their more complex tasks. Solaris provides
    support for nearly all models of alphanumeric terminals and modems, but with this
    flexibility comes complexity. Because of this complexity, Sun has added these
    tasks to the Admintool to make them easier to perform. As with most Admintool
    functions, however, they do not provide the complete functionality you get at
    the command line. Occasionally, you''ll encounter tasks that can be performed
    only from the command line. For this reason, this chapter covers not only the
    Admintool, but the specific SAF commands as well. I''ll begin by describing hardware
    and software terminology before describing how to manage them.


    # Hardware Terminology


    This section briefly describes the hardware components involved—ports, terminals,
    modems, and cabling.


    # Ports


    A port is a channel through which a device communicates with the operating system.
    A port is a "receptacle" into which a terminal or modem cable may be plugged.
    The port is controlled by software in the operating system called a device driver.
    Common types of ports include serial, parallel, small computer systems interface
    (SCSI), and ethernet. The serial port software must be set up to provide a particular
    "service" for the device attached to the port. For example, you can set up a serial
    port to provide bidirectional service for a modem.


    A serial port, using a standard communications protocol, transmits a byte of information
    bit by bit over a single line. Devices that have been designed according to RS-232-C
    or RS-423 standards—such as modems, alphanumeric terminals, plotters, and some
    printers—can be plugged into serial ports. Most systems have one or two serial
    ports. When many serial port devices must be connected to a single computer, you
    sometimes need to add an adapter board to the system. The adapter board, with
    its driver software, provides additional serial ports for connecting more devices
    than could otherwise be accommodated.


    # Terminals


    Solaris supports two types of displays: the alphanumeric display and the bit-mapped
    graphics display. The alphanumeric terminal and keyboard, referred to as a tty
    device, connects to a serial port and displays only text. Because the alphanumeric
    terminal is connected via'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'a serial port. a system can support as many character display terminals as
    it has serial ports. If you run out of ports, you can add more. The disadvantage
    with the alphanumeric display is it will not display windows or graphics and does
    not support a mouse.


    The bit-mapped graphics display is connected to the system via a graphics adapter
    of some kind. You simply need to plug the monitor into the system to make it operational.
    On a bit-mapped graphics display, you don''t have to perform any special steps
    to administer it. The drawback, however, is that most computers support only one
    graphics display.


    # Modems


    Modems are also connected to a system through a serial port and are used for remote
    access over telephone lines. Modems can be set up in three basic configurations:


    +   - Dial-out

    - Dial-in

    - Bidirectional


    A modem connected to the local computer might be set up to provide dial-out service,
    meaning you can access other computers but nobody outside can gain access to this
    computer. Dial-in service is just the opposite. It allows users to access a system
    from remote sites, but it does not permit calls to the outside world. Bidirectional
    access provides both dial-in and dial-out capabilities.


    # Cabling


    Finally, a few words about cabling. The RS-232 standard defines two types of equipment:
    Data Terminal Equipment (DTE) and Data Communications Equipment (DCE). Most computers
    are DTE; modems are always DCE. DTE uses pin 2 to transmit data and pin 3 to receive
    data; DCE does the reverse. To connect a computer to a modem or printer (DTE to
    DCE), you make the cable connection straight through. To make a connection between
    two computers (DTE to DTE) or between a computer and a terminal, you need a cable
    with pins 2 and 3 crossed. This is often called a null-modem or modem-eliminator
    cable. To save yourself a great deal of frustration, make sure you configured
    your cables properly before you configure the port monitor and services.


    # Software Terminology


    Now that I''ve described the hardware pieces, I will briefly describe the components
    of the operating system that add functionality to the ports, terminals, and modems.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Service Access Controller (SAC)


    The Service Access Controller (SAC) oversees the entire service access facility
    (SAF).


    The SAC daemon is started in /etc/inittab by an entry like this one:


    ```

    sc:234:respawn:/usr/lib/saf/sac -t 300

    ```


    The -t option specifies how often the SAC daemon polls the port monitors.


    The SAC daemon starts and controls various port monitors. SAC starts all of the
    port monitors listed in its configuration file, /etc/saf/_sactab.


    # Port Monitors


    The mechanism for gaining access to a service is through a port monitor. A port
    monitor is a program that continuously monitors a port for requests to log in
    or requests to access printers or files.


    When a port monitor detects a request, it sets whatever parameters are required
    to establish communication between the operating system and the device requesting
    service. Then the port monitor transfers control to other processes that provide
    the services needed.


    A port can be an address on a network, a hard-wired terminal line, or an incoming
    phone line. The definition of what constitutes a port is strictly a function of
    the port monitor itself. Port monitors have two main functions: managing ports
    and monitoring ports for indications of activity.


    The first function of a port monitor is to manage a port. The person who defines
    the port monitor defines how a port is managed. A port monitor is not restricted
    to handling a single port; it can handle multiple ports simultaneously. An example
    of port management is setting the line speed on incoming phone connections, reinitializing
    the port when the service terminates, and outputting a login prompt.


    The second function of a port monitor is to watch the port for indications of
    activity. Two types of activity might be detected. The first is an indication
    to the port monitor to take some specific port monitor action; for example, pressing
    the break key to indicate that the line speed should be cycled. Not all port monitors
    need to recognize and respond to the same indications; the person who defines
    the port monitor defines the indication used to attract the attention of the port
    monitor. The second activity a port monitor detects is an incoming service request.
    When a service request is received, a port monitor must be able to determine which
    service is being requested from the port. Note that the same service might be
    available on more than one port.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'Solaris has two types of port monitors: ttymon and listen. ttymon connects
    incoming requests on serial lines to the login service and login program and would
    be the port monitor to handle modems and terminals. listen connects incoming print
    jobs to the lp facility. You might be familiar with an older port monitor called
    getty. In Solaris, getty has been replaced by ttymon. These two programs serve
    the same function, but a single ttymon can replace multiple occurrences of getty.


    # ttymon


    Whenever you attempt to log in via a directly connected modem or alphanumeric
    terminal, the TTY Port Monitor (ttymon) goes to work. ttymon provides Solaris
    users the same services that getty did under previous versions of SunOS 4.1 software.
    When someone attempts to log in via an alphanumeric terminal or a modem, the serial
    port driver passes the operation to the operating system. The ttymon port monitor
    acknowledges the serial port activity and attempts to establish a communications
    link. ttymon determines what data transfer rate, line discipline, and handshaking
    protocol are required to communicate with the device connected to the serial port.
    Having established the proper handshaking with the modem or terminal, ttymon passes
    these parameters to the login program.


    When SAC invokes an instance of ttymon, ttymon starts to monitor its ports. Each
    instance of ttymon can monitor multiple ports, which are specified in the port
    monitor''s administrative file. The values used for initializing the port are
    taken from the appropriate entry in the /etc/ttydefs file. The ttymon port monitor
    then writes the prompt and waits for user input. When valid input is received
    from the user, ttymon interprets the configuration file for the port and creates
    an entry in /etc/utmp. The /etc/utmp file holds accounting information about the
    user for commands such as who. ttymon then establishes the service environment
    and invokes the service associated with the port.


    After the service terminates, ttymon cleans up the /etc/utmp entry and returns
    the port to its initial state.


    # listen


    The network listener service, listen, is a port monitor that runs under SAC. It
    monitors the network for service requests, accepts requests when they arrive,
    and invokes servers in response to those service requests.


    # Port Monitor Tag (pmtag)


    The Port Monitor Tag (pmtag) is the name assigned to an instance of a port monitor.
    The pmtag is used to define groups of one or more actual port monitor processes.
    You can name port monitors anything you want, provided the name is unique and
    is no longer than 14 characters. By default, Solaris assigns names such as zsmon
    for serial ports. Unless you have a good reason to do otherwise, the system-defined
    names are the best to use.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Service Tag (svctag)


    Each port assigned to a port monitor has its own service tag. The name used for
    the service tag is tty followed by the name of the port created in the /dev/term
    directory. For example, the svctag for /dev/term/a would be ttya.


    # Administering Terminals, Modems, and Ports


    Three tools are available for administering terminals and modems: AdminTool, the
    Service Access Facility (SAF) commands, and the Solstice AdminSuite''s Serial
    Port Manager.

    The next section describes how to add a modem to a system by using the AdminTool—the
    preferred method. Second is a description of how to add a modem from the command
    line. The Solstice AdminSuite''s Serial Port Manager is not covered in this manual.
    AdminSuite is much like the AdminTool but is used for configuring systems in a
    networked, name-service environment.


    # Adding a Modem Through the AdminTool


    Setting up a serial port for a modem is much easier when using the AdminTool.
    This is the recommended method because it eliminates the possibility of a typographical
    error.

    Following are the steps used to set up the serial port by using AdminTool:


    +   1. Start AdminTool, if it''s not already running.

    2. Select Browse, Serial Ports, as shown in Figure 12-1.


