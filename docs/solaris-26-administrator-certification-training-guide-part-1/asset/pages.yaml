  md: '# Table 11-8 Options for the ufsdump Command (continued)


    | Option | Description |

    |---|---|

    | l | Autoload. Use this option if you have an autoloading (stackloader) tape
    drive. When the end of a tape is reached, this option takes the drive offline
    and waits up to two minutes for the tape drive to be ready again. If the drive
    is ready within two minutes, it continues. If the drive is not ready after two
    minutes, autoload prompts the operator to load another tape. |

    | n | Notify. When intervention is needed, sends a message to all terminals of
    all users in the sys group. |

    | o | Offline. When finished with a tape or disk, takes the drive offline, rewinds
    (if tape), and removes the media, if possible (for example, ejects disk or removes
    8-mm autoloaded tape). |

    | s size | Size. Specifies the length of tape in feet or size of disk in number
    of 1024-byte blocks. You need to use this option only when ufsdump cannot detect
    the end of the media. |

    | S | Estimates size of backup. Determines the amount of space needed to perform
    the backup (without actually doing it) and outputs a single number indicating
    the estimated size of the backup in bytes. |

    | t tracks | Tracks. Specifies the number of tracks for 1/4-inch cartridge tape.
    You need to use this option only when ufsdump cannot detect the end of the media.
    |

    | u | Updates the dump record. For a completed backup of a file system, adds an
    entry to the file /etc/dumpdates. The entry indicates the device name for the
    file system’s disk slice, the backup level (0-9), and the date. No record is written
    when you do not use the u option or when you back up individual files or directories.
    If a record already exists for a backup at the same level, it is replaced. |

    | v | Verify. After each tape or disk is written, verifies the contents of the
    media against the source file system. If any discrepancies occur, prompts the
    operator to mount new media and then repeats the process. Use this option on an
    unmounted file system only, because any activity in the file system causes it
    to report discrepancies. |

    | w | Warning. Lists the file systems appearing in /etc/dumpdates that have not
    been backed up within a day. When you use this option, all other options are ignored.
    |

    | W | Warning with highlight. Shows all file systems that appear in /etc/dumpdates
    and highlights those file systems that have not been backed up within a day. When
    you use this option, all other options are ignored. |


    The dump command uses these options by default:


    ```

    ufsdump 9uf /dev/rmt/0 files-to-back-up

