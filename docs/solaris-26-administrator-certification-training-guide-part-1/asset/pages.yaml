    ```


    Conditional structures such as while and until are executed by the shell as if
    they were a single command. The entire structure is scanned by the shell before
    any part of it is executed.


    # Shell Functions


    Any good programming language provides support for functions. A function is a
    bundle of statements that is executed as a group. The bundles are executed just
    like a “regular” command and are used to carry out often-required tasks. An advantage
    of a function is that it is held in the computer’s main memory, so execution is
    much quicker than with a script, which must be retrieved from disk. The current
    version of the Bourne shell supports shell functions; older versions of the Bourne
    shell did not. The syntax for shell functions is as follows:


    ```

    ```

    name()

    {

    command-list

    }

    ```

    ```


    The previous command syntax defines a function named “name”. The body of the function
    is the command-list between { and }. This list is executed whenever name is specified
    as the name of a command. For example, at the command prompt, type


    ```

    ```

    hello()

    {

    echo hello there

    }

    ```

    ```


    The function is named “hello” and can be executed by typing hello. The output
    of the function is hello there. The exit status of a function is the exit status
    of the last command executed in the body.


    Constructing your own commands with scripts and shell programs is a powerful and
    flexible tool to assist you in system administration. Routine tasks can be simplified
    and automated to free up your time and allow you to attend to more demanding tasks.
    Shell programming is a skill that all UNIX systems administrators must have and
    is one of the keys to becoming a sophisticated UNIX user.'
  merge: -1
  img_proc: true
