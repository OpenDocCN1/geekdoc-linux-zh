    83.9MB in 32 cyl groups (16 c/g, 2.6MB/g, 1216 i/g)

    super-block backups (for fsck -b #) at:

    32, 5264, 10496, 15728, 20960, 26192, 31424, 36656, 41888,

    47120, 52352, 57584, 62816, 68048, 73280, 78512, 82976, 88208,

    93440, 98672, 103904, 109136, 114388, 119600, 124832, 130064, 135296,

    140528, 145760, 150992, 156224, 161456,

    ```


    The newfs command uses optimized default values to create the file system. The
    default parameters used by the newfs command are


    +   - File system block size = 8,192.

    - File system fragment size (the smallest allocatable unit of disk space) = 1,024
    bytes.

    - Percentage of free space = 10%.

    - Number of inodes or bytes per inode = 2,048. This controls how many inodes are
    created for the file system (one inode for each 2KB of disk space).'
  merge: -1
