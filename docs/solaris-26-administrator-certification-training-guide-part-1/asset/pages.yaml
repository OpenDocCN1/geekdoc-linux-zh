- pgno: 4
  md: '# ABOUT THE AUTHOR


    Bill Calkins is owner and president of Pyramid Design, Inc., a computer consulting
    firm specializing in the implementation of client-server technologies on UNIX
    and Windows NT operating systems. Bill has 15 years of experience in system administration
    and consulting at more than 75 different companies. He has worked as a trainer
    in both corporate and university settings. He speaks frequently at international
    user conferences and has written white papers on TCP/IP networking and UNIX system
    administration and management. Bill draws on his many years of experience in system
    administration and training to provide a unique approach to conducting computer
    training.


    # ABOUT THE TECHNICAL REVIEWER


    Janice Winsor is a senior technical writer with 13 years experience in documenting
    UNIX systems. She worked at Sun Microsystems for seven years. For the past three
    years, she worked at the Filoli Information Systems Company as a project leader
    and manager. She is now working as a freelance author. Janice has received 10
    writing awards from the Society for Technical Communications. Her published works
    include UNIX Book of Games, Jumping JavaScript™, and the first edition of both
    the Solaris System Administrator’s Guide and Solaris Advanced System Administrator’s
    Guide, published by Sun Microsystems Press.


    Janice contributed considerable practical, hands-on expertise to the entire development
    process for Solaris 2.6 Administrator Certification Training Guide, Part 1. As
    the book was being written, Janice reviewed all the material for technical content,
    organization, and flow. Her feedback was critical to ensuring that Solaris 2.6
    Administrator Certification Training Guide, Part 1 fits our readers’ needs for
    the highest quality technical information.'
  merge: -1
  img_proc: true
