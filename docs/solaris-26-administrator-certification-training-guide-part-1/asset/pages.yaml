- pgno: 237
  md: 'The -i option specifies the inactive (disabled) response message sent to a
    terminal or modem when a user attempts to log in to a disabled port.


    To keep the modem connection when a user logs off from a host, type


    ```

    ttyadm -h

    ```


    The system will not hang up on a modem before setting or resetting to the default
    or specified value. If ttyadm -h is not used, the host will hang up the modem
    when the user logs out of a host.


    Use the -r option with ttyadm to require the user to type a character before the
    system displays a prompt:


    ```

    ttyadm -r

    ```


    The -r option specifies that ttymon should require the user to type a character
    or press Return a specified number of times before the login prompt appears. This
    option prevents a terminal server from issuing a welcome message that the Solaris
    host might misinterpret as a user trying to log in. Without the -r option, the
    host and terminal server might begin looping and printing prompts to each other.


    Options to the ttyadm command are described in Table 12-8.


    # Table 12-8 ttyadm Command Options


    | Command Option | Description |

    |---|---|

    | -b | The bidirectional port flag. When this flag is set, the line can be used
    in both directions. |

    | -h | Sets the hangup flag for the port. |

    | -i | Specifies the inactive (disabled) response message. |

    | -l | Specifies which TTY label in /etc/ttydefs to use. |

    | -m | Specifies the streams modules to push before invoking this service. |

    | -p | Specifies the prompt message, for example, login:. |

    | -d | Specifies the full pathname to the device to use for the TTY port. |

    | -r count | When the -r option is invoked, ttymon waits until it receives data
    from the port before it displays a prompt. |

    | -s | Specifies the full pathname of the service to invoke when a connection
    request is received. If arguments are required, enclose the command and its arguments
    in quotation marks (""). |

    | -T | Sets the terminal type. |'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# nlsadmin


    Just as ttyadm works for ttymon, so the nlsadmin command works for listen. The
    listen port monitor''s administrative file is updated by sacadm and pmadm, as
    well as by the nlsadmin command. The nlsadmin command formats listen-specific
    information and writes it to the standard output, providing a means of presenting
    formatted listen-specific data to the sacadm and pmadm commands. nlsadmin does
    not administer listen directly; rather, it complements the generic administrative
    commands sacadm and pmadm.


    Each network can have at least one instance of the network listener process associated
    with it, but each network is configured separately. The nlsadmin command controls
    the operational states of listen port monitors. The nlsadmin command can establish
    a listen port monitor for a given network, configure the specific attributes of
    that port monitor, and start and kill the monitor. The nlsadmin command can also
    report on the listen port monitors on a machine.


    # Setting Up Modems and Terminals by Using SAF


    Now that you''ve learned about sacadm and pmadm, here''s how you put them together
    to add modems and terminals. To set up bidirectional modem service from the command
    line, follow these steps:


    +   1. Check to see if a zsmon process is running under SAC. To do so, type the
    following command:

    ```

    sacadm -l

    ```

    The system responds with

    ```

    PMTAG    PMTYPE   FLAGS   RCNT    STATUS   COMMAND

    tcp      listen   -       0       ENABLED  /usr/lib/saf/listen tcp #

    zsmon    ttymon   -       0       ENABLED  /usr/lib/saf/ttymon #

    ```

    2. If you do not see a zsmon entry under PMTAG, execute the following command:

    ```

    sacadm -a -p zsmon -t ttymon -c /usr/lib/saf/ttymon -v `ttyadm -V`

    ```

    Check again to see if the zsmon entry is present (status will be STARTING—this
    is normal).

    3. Check to see if a zsmon port monitor is present. To do so, type the following
    command:

    ```

    pmadm -p zsmon -l

    ```'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'The system responds with


    ```

    PMTAG PMTYPE SVCTAG FLGS ID <PMSPECIFIC>

    zsmon ttymon ttyb u root /dev/term/b b - /usr/bin/login \

    - 9600m ldterm,ttcompat login: - - n #Modem - Bidirectional

    ```


    4. If a port monitor for zsmon is present, remove it by executing the following
    command:


    ```

    pmadm -r -p zsmon -s <svctag>

    ```


    where the value of <svctag> is found by using the output of the previous command.
    In the above example, this value will be ttyb.


    5. Now configure your port monitor. To do so, type


    ```

    pmadm -a -p zsmon -s ttyb -i root -fu -v ''ttyadm -V'' -m ''ttyadm -Sn -d /dev/term/b
    -b -m -l dterm,ttcompat -l 9600m -s /usr/bin/login'' -y "Modem - Bidirectional"

    ```


    ttyb and /dev/term/b specify serial port B; 9600m specifies 9600 baud. Either
    of these can be modified to reflect a different serial port or baud rate setting.


    6. Verify that the port monitor is present by typing


    ```

    pmadm -p zsmon -l

    ```


    The system should respond with output that looks like the following, but the baud
    rate and service tag might be different:


    ```

    PMTAG PMTYPE SVCTAG FLGS ID <PMSPECIFIC>

    zsmon ttymon ttyb u root /dev/term/b b .

    /usr/bin/login - 9600m ldterm,ttcompat login: - - n #Modem \

    -Bidirectional

    ```


    Serial port B is now configured for a 9600 baud, bidirectional modem. The steps
    are complex, so you need to be careful not to mistype a command string. Because
    of the complexity of adding a modem from the command line, Sun has added this
    task to the Admin tool.


    # Using the Modem


    The following steps outline the process you need to follow to connect and use
    a modem on a Solaris system.


    +   1. Connect the modem to the correct serial port on the Sun system by plugging
    the RS-232 cable into either ttya or ttyb. Make sure the RS-232 cable is a “straight
    through” cable with pins 1–8 and pin 20 provided. Do not use a null modem (cross-over)
    cable or a null-modem gender-adapter cable.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '+   2. Check for the following line in the /etc/remote file. If it is not there,
    add it after the hardware:\ entry. For the ttyb port, add the following lines:

    ```

    hardware:\ :dv=/dev/term/b:br#9600:e1="C''S''Q''U''D:ie=%$ioe=D:

    modem1:\ :dv=/dev/cua/b:br#9600:

    ```

    Make sure the baud rate matches the baud rate you selected when setting up the
    serial port.


    3. Check the permissions and owner of the modem port. The file /dev/cua/b should
    be rw-rw-rw- and the owner should be uucp. If not, use the chmod command to change
    the permission and the chown command to change the owner.


    4. After modifying the /etc/remote file and checking the permission of the port,
    issue the following command:

    ```

    tip modem1

    ```

    You should get a "connected" message. If you get anything else—for example, "all
    ports busy"—check the /etc/remote device entry as described in step 2.


    5. Verify that the modem is responding to commands. Do so by typing

    ```

    at <cr>

    ```

    You should see an OK displayed.


    6. Check the modem register and initialization string. Refer to Table 12-9 for
    common modem initialization strings and see if the modem type is referenced. If
    so, follow the manufacturer''s instructions for using that string to initialize
    the modem. For example, the US Robotic Courier Modem string is

    ```

    AT&F1&B1&C1&D2X50=18W

    ```

    If you do not know the initialization string, refer to the manuals supplied with
    your modem. If you still cannot figure out the initialization string, contact
    the modem manufacturer''s technical support.


    7. After setting up the modem, exit the "tip" utility by typing the following
    sequence:

    ```

    <cr>~.

    ```

    The above sequence is a "carriage return" followed by a "~" character and a "."
    character.'
  merge: -1
  img_proc: true
