    \ message is displayed:\n\n```\n/usr/foo: No such file or directory\nNo directory\
    \ found\n```\n\nThe Bourne shell contains the special programs true and false.\
    \ The only function of the true program is to return a true (zero) exit status.\
    \ Similarly, the function of the false program is to return a false (non-zero)\
    \ exit status.\n\nExample:\n\n```\nTrue && echo True\n```\n\nThe system responds\
    \ with True\n\n```\nFalse || echo False\n```\n\nThe system responds with False\n\
    \nTrue and false tests will be discussed later when we discuss if and while conditionals.\n\
    \nThe && and || are useful conditionals for creating very simple scripts, but\
    \ additional functionality is sometimes required. The Bourne shell offers two\
    \ more conditional commands, if and case.\n\n# if\n\nOne of the more important\
    \ built-ins of the Bourne shell is the if conditional. The syntax of the if conditional\
    \ is\n\n```\nif condition-list\n    then list\n    elif condition-list\n     \
    \   then list\n    else list\nfi\n```\n\nThe list following if is executed; if\
    \ it returns a zero exit status, the list following the first then is executed.\
    \ Otherwise the list following elif is executed; if its value is zero, the list\
    \ following the next then is executed. Failing that, the else list is executed.\
    \ If no list is"
