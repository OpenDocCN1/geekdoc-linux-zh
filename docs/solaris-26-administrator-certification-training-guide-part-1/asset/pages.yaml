    # Built-ins


    Built-ins are used in shell programs to make decisions and add intelligence to
    the task to be performed. Built-ins for the Bourne shell are listed in Tables
    8-4 and 8-5. More information on the built-ins described in Table 8-4 is available
    in the Solaris online manual pages. The shell conditionals listed in Table 8-5
    are described in this chapter. Each shell has its own set of built-ins, with the
    Bourne shell having the fewest. For this reason, it is the smallest and fastest
    of the three shells.


    # Table 8-4 Bourne Shell Built-ins


    |  |  |

    |---|---|

    | break | Exit a For or While loop |

    | continue | Continue next iteration of For or While loop |

    | echo | Write arguments on standard output |

    | eval | Evaluate and execute arguments |

    | exec | Execute the arguments |

    | exit | Exit shell program |

    | export | Create a global variable |

    | priv | Set or display privileges |'
