    # OpenBoot Parameters


    The OpenBoot PROM supports several parameters, which are user-definable (superuser
    only). The following list provides a few common ones you should remember. The
    only time you should need to modify these parameters is if you want to boot from
    a SCSI disk other than target 3, in which case you might want to turn off automatic
    booting (auto-boot). Another reason you might want to change an OpenBoot parameter
    is for setting security. Don''t change OpenBoot parameters unless absolutely necessary.
    Not all OpenBoot systems support all parameters, and defaults can vary, depending
    on the system and the PROM revision.


    # Version 2 OpenBoot Parameters


    Table 1-1 describes some of the OpenBoot parameters. For a more complete listing,
