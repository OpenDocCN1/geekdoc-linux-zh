    \ If not present, the file prints out a message.\n\nThe previous example uses\
    \ the if test -f to evaluate a conditional expression. At the heart of each control\
    \ structure is a conditional test. The test command is commonly used in shell\
    \ programs to perform various tests and to determine if certain files and directories\
    \ exist. The test program performs three types of tests:\n\n+   - It can test\
    \ files for certain characteristics such as file type and permissions.\n- It can\
    \ perform string comparisons.\n- It can make numeric comparisons.\n\nTest indicates\
    \ the success or failure of its testing by its exit status. Test evaluates an\
    \ expression and, if its value is true, sets a zero (true) exit status; otherwise,\
    \ a non-zero (false) exit status is set. All shell commands return a true (0)\
    \ value when they complete successfully or a false (1) value when they fail. The\
    \ exit status of the last shell command can be displayed by looking at the $?\
    \ variable with the echo command. Table 8-6 lists some of the common conditions\
    \ that can be evaluated.\n\nTable 8-6 Built-in Test Functions\n\n| Test | Description\
    \ |\n|---|---|\n| -r filename | True if the filename exists and is readable. |\n\
    | -w filename | True if the filename exists and is writable. |\n| -x filename\
    \ | True if the filename exists and is executable. |\n| -f filename | True if\
    \ the filename exists and is a regular file. |\n| -d filename | True if the filename\
    \ exists and is a directory. |\n| -h filename | True if the filename exists and\
    \ is a symbolic link. With all other primitives (except -L filename), the symbolic\
    \ links are followed by default. |\n| -c filename | True if the filename exists\
