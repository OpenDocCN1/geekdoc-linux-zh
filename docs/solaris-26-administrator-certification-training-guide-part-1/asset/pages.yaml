    > **CAUTION!** *Be sure you have specified the correct device name for the slice
    before performing the next step. You will erase the contents of the slice when
    the new file system is created, and you don''t want to erase the wrong slice.*


    3. Type y to confirm.


    The following example creates a file system on /dev/rdsk/c0t3d0s7:


    +   1. Become superuser, type su, and enter the root password.

    2. Type newfs /dev/rdsk/c0t3d0s7.


    The system responds with


    ```

    newfs: construct a new file system /dev/rdsk/c0t3d0s7 (y/n)? y

