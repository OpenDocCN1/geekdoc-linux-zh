- pgno: 6
  md: '# INTRODUCTION


    Welcome to *Solaris 2.6 Administrator Certification Training Guide, Part I*. My
    goal with this book is to teach you Solaris system administration and, specifically,
    to help you become certified. Sun offers two examinations for the Solaris system
    administrator. This book prepares you for Part I of the Solaris administrator
    examination; it is the single best reference for learning the information necessary
    to pass the certification exam. Each chapter opens with specific test objectives.
    In addition, I provide the background information you’ll need to better understand
    each topic.


    Whether your goal is to become certified or to simply learn more about administering
    a Solaris system, *Solaris 2.6 Administrator Certification Training Guide, Part
    I* provides an easy-to-follow format. This book begins at system installation
    and boot up. It then takes you through the tasks of installing patches and additional
    software packages; setting up file systems and user accounts; customizing the
    CDE environment; setting up printers; and configuring the network. It will even
    introduce you to shell scripts. I describe each topic as though you are new to
    system administrating, and I walk you through the advanced topics slowly. The
    only assumption I make is that you have some basic UNIX experience. I assume that
    you know how to log in and out, copy and remove files, and perform simple tasks
    with the VI editor.


    I am in a good position to help you get through this learning process. I have
    conducted UNIX training for corporations for more than seven years. I have worked
    with SunOS and Solaris since the early 1980s, and I have worked as a system administrator
    for a large site of Sun systems for 14 years. For the past six years, I have worked
    independently as a system administration consultant and trainer on all flavors
    of UNIX, helping users like you with system administration. I have spent hundreds
    of hours training system administrators who had no prior UNIX experience as well
    as administrators who had many years of experience.


    Putting this book together was a great experience. I always learn something when
    going back over the basics, just as I do every time I teach an introductory class.
    I invite even the most experienced system administrator to read this book—I guarantee
    you’ll find something new. I also urge you to take the certification exam, if
    you have not done so already. Certification provides a measure and validation
    of your technical skills, gives you credibility in your job, and is a great way
    to advance your career.'
  merge: -1
  img_proc: true
