    \ voucher from Sun Educational Services (call 1-800-422-8020). Then, call Sylvan\
    \ Prometric at 1-800-792-3926 with your voucher number in hand to register for\
    \ an exam. The test will cost $150 and has approximately 72 questions, which consist\
    \ of multiple choice and short-answer, fill-in questions. You’ll take the exam\
    \ at a local Sylvan Prometric testing center and you’ll have 90 minutes to complete\
    \ the test. You’ll find out right away if you passed or failed. When finished,\
    \ you’ll receive a report showing the percentage of items you answered correctly\
    \ in each section. Keep this report so you know what areas you need to improve.\
    \ You must answer at least 75% of the questions correctly to pass the exam. If\
    \ you need to retake the exam, don’t feel bad—it takes an average of two tries\
    \ to pass the exam.\n\nThe sections you will be graded on, and the chapter(s)\
    \ in this book that cover them, are as follows:\n\n+   - System Concepts (Appendixes\
    \ A and B and Chapters 2 and 10)\n- Solaris Installation (Chapters 1, 2, 3, 6,\
    \ 12, and 13)\n- File Systems (Chapters 3 and 11)\n- Navigating the File System\
