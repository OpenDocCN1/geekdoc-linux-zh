    \ seconds until the file is removed.\n\n```\nwhile [ -f /tmp/errlog ]\n  do echo\
    \ The file is still there ; sleep 5\ndone\n```\n\nNOTE. The special command sleep\
    \ 5 instructs the system to wait 5 seconds before running again.\n\n# Until Loop\n\
    \nThe until loop is a variant of the while statement. Just as the while statement\
    \ repeats as long as the condition-list returns a true value, the until statement\
    \ repeats until the condition-list"
