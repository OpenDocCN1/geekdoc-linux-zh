    # Logical Volumes


    On a large server with many disk drives, standard methods of disk slicing are
    inadequate and inefficient. Limitations imposed by standard file systems include
    the inability to be larger than the size of the file system that holds them. Because
    file systems cannot span multiple disks, the size of the file system is limited
    to the size of the disk. Another problem with standard file systems is that they
    cannot be increased in size without destroying data on the file system. Sun has
    addressed these issues with two unbundled Sun packages: Solstice DiskSuite and
    Sun Enterprise Volume Manager. Both packages allow file systems to span multiple
    disks and provide for improved I/O and reliability compared to the standard Solaris
    file system. We refer to these types of file systems as logical volumes (LVMs).
    Both Sun packages are purchased separately and are not part of the standard Solaris
    operating system distribution. Typically, DiskSuite is used on Sun''s multipacks
    and the Enterprise Volume Manager package is used on the SparcStorage arrays.'
  merge: -1
  img_proc: true
- pgno: 71
  md: "The following is an overview of the primary elements of a logical volume:\n\
    \n+   - **Concatenation and striping**\n  Concatenations and stripes work much\
    \ the way the UNIX cat(1) command program is used to concatenate two or more files\
    \ to create one larger file. When partitions are concatenated, the addressing\
    \ of the component blocks is done on the components sequentially. The file system\
    \ can use the entire concatenation.\n\n  Striping is similar to concatenation,\
    \ except the addressing of the component blocks is interlaced on the slices rather\
    \ than sequentially. Striping is used to gain performance. When data is striped\
    \ across disks, multiple controllers can access data simultaneously.\n- **Mirroring\
    \ (mirrors and submirrors)**\n  Mirroring replicates all writes to a single logical\
    \ device (the mirror) and then to multiple devices (the submirrors), and distributes\
    \ read operations. This provides redundancy of data in the event of a disk or\
    \ hardware failure.\n- **UFS logging (journaled file system)**\n  UFS logging\
    \ records UNIX file system (UFS) updates in a log (the logging device) before\
    \ the updates are applied to the UNIX file system. With this technique, the risk\
    \ of file system corruption due to a power failure or unsafe shutdown is greatly\
    \ reduced.\n- **Hot spare pools**\n  A hot spare pool is a group of spare disk\
    \ drives that automatically replace failed components.\n- **Disksets**\n  A diskset\
    \ is an association of two hosts (servers) and a group of disk drives in which\
    \ all of the drives are accessible by each host. If one host fails, the other\
    \ takes over. This scenario is used where high availability is critical.\n- **RAID\
    \ devices**\n  RAID is an acronym for \"redundant arrays of inexpensive disks.\"\
    \ Many disks are housed in a cabinet to provide large amounts of disk space.\n\
    - **Ability to expand mounted file systems**\n  On a server requiring high availability,\
    \ disk space can be added to a file system without shutting down the system or\
    \ unmounting the file system.\n\nLogical volumes can be made up of one or more\
    \ component slices. You can configure the component slices of one disk or use\
    \ slices from multiple disks. After you create the logical volumes, they are used\
    \ like physical disk slices. Logical volumes provide increased capacity, higher\
    \ availability, and better performance. To gain increased capacity, you create\
    \ logical volumes that are concatenations, stripes, or RAID devices. Disk concatenations\
    \ and"
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Parts of a UFS File System


    stripes can help performance and address capacity issues. Mirroring, UFS logging,
    and RAID devices provide higher availability. Logical volumes are transparent
    to the application software and to the hardware.


    UFS is the default disk-based file system used in the Solaris system software.
    It provides the following features:


    +   - **State flags**—Shows the state of the file system as clean, stable, active,
    or unknown. These flags eliminate unnecessary file system checks. If the file
    system is “clean” or “stable,” fsck (file system check) is not run when the system
    boots.

    - **Extended fundamental types (EFT)**—32-bit user ID (UID), group ID (GID), and
    device numbers.

    - **Large file systems**—A UFS file system can be as large as 1 terabyte (1TB)
    and can have regular files up to 2 gigabytes (2GB). By default, the Solaris system
    software does not provide striping, which is required to make a logical slice
    large enough for a 1TB file system. Optional software packages, such as Solstice
    DiskSuite, provide this capability.


    During the installation of the Solaris software, several UFS file systems are
    created on the system disk. These default file systems and their contents are
    described in Table 3–1.


    ### Table 3-1 Solaris Default File Systems


    | Slice | File System | Description |

    |-------|-------------|-------------|

    | 0 | root | Root (/) is the top of the hierarchical file tree. Root holds files
    and directories that make up the operating system. The root directory contains
    the directories and files critical for system operation, such as the kernel, the
    device drivers, and the programs used to boot the system. It also contains the
    mount point directories, in which local and remote file systems can be attached
    to the file tree. The root (/) file system is always in slice 0. |

    | 1 | swap | Provides virtual memory or swap space. Swap space is used when running
    programs too large to fit in a computer’s memory. The Solaris operating environment
    then "swaps" programs from memory to the disk and back, as needed. The swap slice
    is always located in slice 1 unless /var is set up as a file system. If /var is
    set up, /var uses slice 1 and swap is put on slice 4. The /var file system is
    for files and directories likely to change or grow over the life of the local
    system. These include system logs, vi and ex backup files, and uucp files. On
    a server, a good idea is to have these files in a separate file system. |

    | 2 |  | Refers to the entire disk and is defined automatically by Sun’s format
    utility and the Solaris installation programs. The size of this slice should not
    be changed. |'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Table 3–1 Solaris Default File Systems (continued)


    | Slice | File System | Description |

    |---|---|---|

    | 3 | /export | Holds alternate versions of the operating system. These alternate
    versions are required by client systems whose architectures differ from that of
    the server. Clients with the same architecture type as the server obtain executables
    from the /usr file system, usually slice 6. |

    | 4 | /export/swap | Provides virtual memory space for client systems if the system
    is set up for client support. |

    | 5 | /opt | Holds optional third-party software added to a system. If a slice
    is not allocated for this file system during installation, the /opt directory
    is put in slice 0. |

    | 6 | /usr | Holds operating system commands—also known as executables—designed
    to be run by users. This slice also holds documentation, system programs (init
    and syslogd, for example), and library routines. The /usr file system also includes
    system files and directories that can be shared with other users. Files (such
    as man pages) that can be used on all types of systems are in /usr/share. |

    | 7 | /home | Holds files created by users (also named /export/home). |


    You only need to create (or re-create) a UFS file system when you


    +   - Add or replace disks

    - Change the slices of an existing disk

    - Do a full restore on a file system

    - Change the parameters of a file system, such as block size or free space


    When you create a UFS file system, the disk slice is divided into cylinder groups.
    The slice is then divided into blocks to control and organize the structure of
    the files within the cylinder group. A UFS file system has the following four
    types of blocks, with each performing a specific function in the file system:


    +   - Boot block—Stores information used when booting the system

    - Superblock—Stores much of the information about the file system

    - Inode—Stores all information about a file except its name

    - Storage or data block—Stores data for each file


    # The Boot Block


    The boot block stores the procedures used in booting the system. Without a boot
    block, the system does not boot. If a file system is not to be used for booting,
    the boot block is left blank. The boot block appears only in the first cylinder
    group (cylinder group 0) and is the first 8KB in a slice.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# The Superblock


    The superblock stores much of the information about the file system. A few of
    the more important things contained in a superblock are


    +   - Size and status of the file system

    - Label (file system name and volume name)

    - Size of the file system''s logical block

    - Date and time of the last update

    - Cylinder group size

    - Number of data blocks in a cylinder group

    - Summary data block

    - File system state: clean, stable, or active

    - Pathname of the last mount point


    Without a superblock, the file system becomes unreadable. The superblock is located
    at the beginning of the disk slice and is replicated in each cylinder group. Because
    the superblock contains critical data, multiple superblocks are made when the
    file system is created. A copy of the superblock for each file system is kept
    up-to-date in memory. If the system gets halted before a disk copy of the superblock
    gets updated, the most recent changes to the superblock are lost and the file
    system becomes inconsistent. The sync command forces every superblock in memory
    to write its data to disk. The file system check program fsck can fix problems
    that can occur when the sync command hasn''t been used before a shutdown.


    A summary information block is kept with the superblock. It is not replicated
    but is grouped with the first superblock, usually in cylinder group 0. The summary
    block records changes that take place as the file system is used, listing the
    number of inodes, directories, fragments, and storage blocks within the file system.


    # Inodes


    An inode contains all of the information about a file except its name, which is
    kept in a directory. An inode is 128 bytes. The inode information is kept in the
    cylinder information block and contains the following:


    +   - The type of the file (regular, directory, block special, character, link,
    and so on)

    - The mode of the file (the set of read/write/execute permissions)

    - The number of hard links to the file

    - The user-id of the owner of the file'
  merge: -1
  img_proc: true
- pgno: 75
  md: '+   - The group-id to which the file belongs

    - The number of bytes in the file

    - An array of 15 disk-block addresses

    - The date and time the file was last accessed

    - The date and time the file was last modified

    - The date and time the file was created


    The maximum number of files per UFS file system is determined by the number of
    inodes allocated for a file system. The number of inodes depends on how much disk
    space is allocated for each inode and the total size of the file system. By default,
    one inode is allocated for each 2KB of data space. You can change the default
    allocation by using the -i option of the newfs command.


    # Storage Blocks


    The rest of the space allocated to the file system is occupied by storage blocks,
    also called data blocks. The size of these storage blocks is determined at the
    time a file system is created. Storage blocks are allocated, by default, in two
    sizes: an 8KB logical block size and a 1KB fragmentation size.


    For a regular file, the storage blocks contain the contents of the file. For a
    directory, the storage blocks contain entries that give the inode number and the
    filename of the files in the directory.


    # Free Blocks


    Blocks not currently being used as inodes, indirect address blocks, or storage
    blocks are marked as free in the cylinder group map. This map also keeps track
    of fragments to prevent fragmentation from degrading disk performance.


    # How to Create a UFS File System


    Use the newfs command to create UFS file systems. newfs is a convenient front-end
    to the mkfs command, the program that creates the new file system on a disk slice.
    On Solaris 2.x systems, information used to set some of the parameter defaults,
    such as number of tracks per cylinder and number of sectors per track, is read
    from the disk label. newfs determines the file system parameters to use, based
    on the options you specify and information provided in the disk label. Parameters
    are then passed to the mkfs (make file system) command, which builds the file
    system. Although you can use the mkfs command directly, it''s more difficult to
    use and you must supply many of the parameters manually. The use of the newfs
    command is discussed later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'The disk must be formatted and divided into slices before you can create UFS
    file system on it, newfs removes any data on the disk slice and creates the skeleton
    of a directory structure, including the directory named lost+found. After you
    run newfs successfully, the slice is ready to be mounted as a file system.


    To create a UFS file system on a formatted disk that has already been divided
    into slices, you need to know the raw device filename of the slice that will contain
    the file system. If you are re-creating or modifying an existing UFS file system,
    back up and unmount the file system before performing these steps:


    +   1. Become superuser.

    2. Type newfs /dev/rdsk/device-name and press Enter. You are asked if you want
    to proceed. The newfs command requires the use of the raw device name and not
