    The line speed represents an entry in the /etc/ttydefs file. |

    | Terminal Type | Shows the abbreviation for the type of terminal—for example,
    ansi or vt100. Similar abbreviations are found in /etc/termcap. This value is
    set in the $TERM environment variable. |

    | Option: Initialize Only | Specifies that the port software is initialized but
    not configured. |

    | Option: Bidirectional | Specifies that the port line is used in both directions.
    |

    | Option: Software Carrier | Specifies that the software carrier detection feature
    is used. If the option is not checked, the hardware carrier detection signal is
    used. |

