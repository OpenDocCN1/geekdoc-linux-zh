    # Using the format Utility to Create Slices


    Before you can create a file system on a disk, the disk must be formatted and
    you must divide it into slices by using the Solaris format utility. Formatting
    involves two separate processes:


    +   - Formatting—Writing format information to the disk

    - Surface analysis—Compiling an up-to-date list of disk defects


    When a disk is formatted, header and trailer information is superimposed on the
    disk. When the format utility runs a surface analysis, the controller scans the
    disk for defects. It needs to be noted that defects and formatting information
    reduce the total disk space available for data. This is why a new disk usually
    holds only 90–95% of its capacity after formatting. This percentage varies according
    to disk geometry and decreases as the disk ages and develops more defects.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'The need for performing a surface analysis on a disk drive has dropped as more
    manufacturers ship their disk drives formatted and partitioned. You should not
    need to use the format utility when adding a disk drive to an existing system
    unless you think disk defects are causing problems or you want to change the partitioning
    scheme.


    > **CAUTION!** *Formatting and creating slices is a destructive process, so make
    sure user data is backed up before you start.*


    The `format` utility searches your system for all attached disk drives and reports
    the following information about the disk drives it finds:


    +   - Target location

    - Disk geometry

    - Whether the disk is formatted

    - Whether the disk has mounted partitions


    In addition, the `format` utility is used in disk repair operations to do the
    following:


    +   - Retrieve disk labels

    - Repair defective sectors

    - Format and analyze disks

    - Partition disks

    - Label disks (write disk name and configuration information to the disk for future
    retrieval)


    The Solaris installation program partitions and labels disk drives as part of
    installing the Solaris release. However, you might need to use the `format` utility
    when


    +   - Displaying slice information

    - Dividing a disk into slices

    - Adding a disk drive to an existing system

    - Formatting a disk drive

    - Repairing a disk drive


    The main reason a system administrator uses the `format` utility is to divide
    a disk into disk slices. The process of creating slices is as follows:


    +   1. Become superuser.

    2. Type format.'
