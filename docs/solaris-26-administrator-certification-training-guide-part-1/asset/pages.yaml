    alias that can be user-defined. |

    | input-device | Power-on input device (usually keyboard, ttya, or ttyb). Default=keyboard.
    |

    | output-device | Power-on output device (usually screen, ttya, or ttyb). Default=screen.
    |

    | security-#badlogins | Number of incorrect security password attempts. |

    | security-mode | Firmware security level (options: none, command, or full). If
    set to command or full, system prompts for PROM security password. Default=none.
    |

    | security-password | Firmware security password (never displayed). Can be set
    only when security-mode is set to command or full. |

    | watchdog-reboot? | If true, reboots after watchdog reset. Default=false. |


    The following example demonstrates the method for setting the auto-boot? parameter
