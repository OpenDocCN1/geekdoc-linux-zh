- pgno: 220
  md: "Use this command to restore a file from a backup that was created by using\
    \ ufsdump, as follows:\n\n```\nufsrestore f /dev/rmt/0 filename\n```\n\nYou can\
    \ restore entire directories from a remote drive located on the system called\
    \ sparc1 by adding remote-host: to the front of the tape device name, as illustrated\
    \ in the next example.\n\n```\nufsrestore rf sparc1:/dev/rmt/0 filename\n```\n\
    \nOccasionally a file system becomes so damaged that you must completely restore\
    \ it from a backup. If you have faithfully backed up file systems, you can restore\
    \ them to the state of the last backup. The first step in recovering a file system\
    \ is to delete everything in the damaged file system and re-create the file system\
    \ by using the newfs command. To recover a damaged file system, follow these steps:\n\
    \n+   1. First, unmount the file system as follows:\n\n    umount /filesystem\n\
    \n    where filesystem is the name of the corrupted file system.\n\n2. After unmounting\
    \ the file system, issue the newfs command to create a new file system as follows:\n\
    \n    newfs /dev/rdsk/disk-partition-name\n\n    where disk-partition-name is\
    \ the name of the disk partition containing the corrupted file system.\n\n3. Mount\
    \ the file system to be restored and change into that directory:\n\n    mount\
    \ /dev/dsk/disk-partition-name\n    cd /filesystem\n\n4. Load the tape and issue\
    \ the following command:\n\n    ufsrestore rf /dev/rmt/0\n\nThe entire contents\
    \ of the tape will be restored to the file system. All permissions, ownerships,\
    \ and dates will remain as they were when the last incremental tape was created.\n\
    \n# Additional Notes About Restoring Files\n\nWhen you restore files in a directory\
    \ other than the root directory of the file system, ufsrestore re-creates the\
    \ file hierarchy in the current directory. For example, if you restore"
  merge: -1
  img_proc: true
- pgno: 221
  md: 'files to /home that were backed up from /users/bcalkins/files, the files are
    restored in the directory /home/bcalkins/files.


    When restoring individual files and directories, a good idea is to restore them
    to a temporary directory such as /var/tmp. After you verify the files, you can
    move them to their proper locations. You can restore individual files and directories
    to their original locations; however, if you do so, be sure you are not overwriting
    newer files with older versions from the backup tape.


    Don''t forget to make regular backups of your operating system. With all of the
    customization you''ve done, such as adding user accounts, setting up printers,
    and installing application software, losing this information would be disastrous.
    Whenever you make modifications that affect the root (/), /usr, /opt, and other
    operating system directories, bring the system down into single-user mode and
    do a level 0 dump.


    This chapter described the standard copy and backup utilities available in Solaris.
    Although these utilities do a good job of backing up your data, if your company
    has several servers and large storage pools, you might want to investigate some
    of the more robust backup packages available from third parties. Most of these
    packages provide a comprehensive suite of utilities for conducting and managing
    backups in a complex computing environment. In most cases, they allow single-point
    backups, not only for Solaris but for other operating systems as well.'
