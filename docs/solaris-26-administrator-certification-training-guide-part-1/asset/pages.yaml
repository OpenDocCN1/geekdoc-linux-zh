    The OpenBoot firmware was first introduced on the Sun SPARCstation 1. This chapter
    describes Version 2 of the firmware, which first appeared on the SPARCstation
    2 system. Version 2 of the OpenBoot architecture provides a significant increase
    in functionality over the boot PROMs in earlier Sun systems. One notable feature
    of the OpenBoot firmware is a programmable user interface, based on the interactive
    programming language Forth. In Forth, sequences of user commands can be combined
    to form complete programs. This capability provides a powerful tool for debugging
    hardware and software.


    You can enter the OpenBoot environment in the following ways:


    +   - By halting the operating system with the various UNIX shutdown commands.

    - By using the Stop-A key sequence from the keyboard (simultaneously press the
    Stop key and the A key).


    > **CAUTION!** Using the Stop-A key sequence abruptly breaks execution of the
    operating system and should be used only as a last effort to restart the system.


    +   - By resetting the power to the system.


    > **NOTE.** If your system is configured to boot automatically, you can enter
    the OpenBoot environment by pressing Stop-A after the display console banner appears
    but before the system starts booting the operating system. This procedure is not
    the same as the method described above, in which the Stop-A sequence is pressed
    after the system has booted. If automatic booting is not enabled, the system enters
    the OpenBoot environment on its own instead of booting the operating system.


    +   - When the system hardware detects an error from which it cannot recover.
    (The system halts and puts you at the OpenBoot prompt. This system failure is
    known as a Watchdog Reset.)


