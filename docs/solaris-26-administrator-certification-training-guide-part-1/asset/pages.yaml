  md: '# Table 12-2 Modify Serial Port Window Items (continued)


    | Item | Description |

    |---|---|

    | Port Monitor Tag | Specifies the name of the port monitor to be used for this
    port. The default monitor is typically correct. |

    | Create utmp Entry | Specifies that a utmp entry is created in the accounting
