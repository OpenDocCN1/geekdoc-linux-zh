  md: 'Another operand is the pattern operand, which is used to select one or more
    pathnames of archive members. Archive members are selected by using the filename
    pattern-matching notation described by fnmatch(3). Examples of pattern operands
    are


    +   - ? A question mark is a pattern that will match any character.

    - * An asterisk is a pattern that will match multiple characters.

    - [ The open bracket will introduce a pattern bracket expression.


    When the pattern operand is not supplied, all members of the archive are selected.
    When a pattern matches a directory, the entire file hierarchy rooted at that directory
    is selected. When a pattern operand does not select at least one archive member,
    pax writes these pattern operands in a diagnostic message to standard error and
    then exits with a non-zero exit status.


    The following examples illustrate the use of the pax command. For example, to
    copy files to tape, issue this pax command, using -w to copy the current directory
    contents to tape and -f to specify the tape device:


    ```

    pax -w -f /dev/rmt/0

    ```


    To list a verbose table of contents for an archive stored on tape device /dev/rmt/0,
    issue the following command:


    ```

    pax -v -f /dev/rmt/0

    ```


    The tape device in the two previous examples could have been a filename to specify
    an archive on disk.


    The following command can be used to interactively select the files to copy from
    the current directory to the destination directory:


    ```

    pax -rw -i . <dest_di>

    ```


    As you become more familiar with the pax utility, you''ll begin to use it in place
    of tar and cpio because of its portability to other UNIX systems, its capability
    to recover damaged archives, and its capability to span multiple volumes.


    # ufs dump


    Although the other Solaris utilities discussed in this chapter can be used to
    copy files from disk to tape, ufsdump is designed specifically for backups and
    is the recommended method for backing up your Solaris file systems. The ufsdump
    command copies files, directories, or entire file systems from a hard disk to
    a tape. The only drawback to using ufsdump is that file systems must be inactive
    before you can conduct a full backup. If the file system is still active, anything
    in the memory buffers is not copied to tape.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'You should back up any file systems critical to users, including file systems
    that change frequently. See Table 11-6 for suggestions on what file systems to
    back up and how often.


    # Table 11-6 File Systems to Back Up


    | File System | Frequency |

    |---|---|

    | root (/) | If you frequently add and remove clients and hardware on the network
    or you have to change important files in root (/), this file system should be
    backed up. You should do a full backup on the root (/) file system between once
    a week and once a month. If /var is in the root (/) file system and your site
    keeps user mail in the /var/mail directory on a mail server, you might want to
    back up root (/) daily. |

    | /usr | The contents of this file system are fairly static and need to be backed
    up only from once a week to once a month. |

    | /export/home | The /export/home file system contains the home directories and
    subdirectories of all users on the system; its files are volatile and need to
    be backed up daily. |

    | Data | All data directories should be backed up daily. |


    The ufsdump command has many built-in features the other archive utilities don''t
    have. These features are described here:


    +   - The ufsdump command can be used to back up complete or individual file systems
    to local or remote tape devices. The tape device can be on any system in the network.
    This command works quickly because it is aware of the structure of the UFS file
    system type and it works directly through the raw device file.

    - ufsdump has built-in options to create incremental backups that will back up
    only those files that were changed since a previous backup. This option saves
    tape space and time.

    - ufsdump has the capability to back up groups of systems over the network from
    a single system. You can run ufsdump on each remote system through a remote shell
    or remote login, directing the output to the system on which the drive is located.

    - The system administrator can restrict user access to backup tables.

    - The ufsdump command has a built-in option to verify data on tape against the
    source file system.


    Backing up a file system with ufsdump is referred to as "dumping" a file system.
    When a file system is dumped, a level between 0 and 9 is specified. A level 0
    dump is a full backup and contains everything on the file system. Level 1 through
    9 dumps are incremental backups and contain only files that have changed since
    a previous dump at a lower level.


    A good backup schedule involves a recommended three-level dump strategy: a level
    0 dump at the start of the month (manually), automated weekly level 5 dumps, and
    automated daily'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'level 9 dumps. The automated dumps are performed at 4:30 a.m., a time when
    most systems typically are idle. Automated daily dumps are performed Sunday through
    Friday mornings. Automated weekly dumps are performed on Saturday mornings. Backups
    are automated by creating a shell script and using cron to execute the script
    on a regular basis.


    Table 11-7 shows the dump level performed on each day of a typical month. Note
    that the level 0 dump at the start of the month is performed manually, because
    the entire system must be idle before you can back up the root file system. One
    way to ensure that the system is not being used is to take the system into single-user
    mode. The level 9 and 5 dumps are automated with cron, but also must be conducted
    when the file systems are not being used.


    # Table 11-7 File System Dump Schedule


    | | Floating | Monday | Tuesday | Wednesday | Thursday | Friday |

    |---|---|---|---|---|---|---|

    | 1st of month | 0 | | | | | |

    | Week 1 | | 9 | 9 | 9 | 9 | 5 |

    | Week 2 | | 9 | 9 | 9 | 9 | 5 |

    | Week 3 | | 9 | 9 | 9 | 9 | 5 |

    | Week 4 | | 9 | 9 | 9 | 9 | 5 |


    The backup schedule in Table 11-7 performs the following:


    +   - Each weekday tape accumulates all files changed since the end of the previous
    week or the initial level 0 for the first week. All files that have changed since
    the lower-level backup at the end of the previous week are saved each day.

    - Each Friday''s tape contains all files changed since the last level 0.


    This dump schedule requires at least four sets of five tapes, one set for each
    week and one tape for the level 0 dump. Each set will be rotated each month. The
    level 0 tapes should not be overwritten and should be saved for at least one year.


    Be aware that even with the backup schedule outlined in Table 11-7, data can still
    be lost. If a hard disk fails at 3 p.m., all modifications since the 4:30 a.m.
    backup will be lost. Also, files that were deleted mid-week will not appear on
    the level 5 tapes. Sometimes a user accidentally deletes a file and does not realize
    it for several weeks. When the user wants to use the file, it is not there. If
    he asks you to restore it from backup, the only tape it appears on is the level
    0, and it could be too far out of date to be useful. If you don''t overwrite the
    daily level 9 tapes so frequently, you can minimize this problem.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'The syntax for the ufsdump command is


    ```

    /usr/sbin/ufsdump options arguments file systems to backup

    ```


    where


    | Term | Description |

    |------|-------------|

    | options | Is a single string of one-letter option names. |

    | arguments | Identifies option arguments and may be multiple strings. The option
    letters and the arguments that go with them must be in the same order. |

    | file systems to back up | Identifies the files to back up. This argument must
    always come last and specifies the source or contents of the backup. It usually
    identifies a file system but can also identify individual files or directories.
    |


    For a file system, specify the raw device file for the disk slice where the file
    system is located.


    Table 11-8 describes the options and arguments for the ufsdump command.


    # Table 11-8 Options for the ufsdump Command


    | Option | Description |

    |--------|-------------|

    | 0-9 | Backup level. Specifies level 0 for a full backup of the whole file system
    specified by file systems to backup. Levels 1-9 are for incremental backups of
    files that have changed since the last lower-level backup. |

    | a archive-file | Instructs ufsdump to create an archive file. Stores a backup
    table of the tape contents in a specified file on the disk. The file can be understood
    only by ufsrestore. ufsrestore uses the table to determine whether a file to be
    restored is present in a backup file and, if so, on which volume of the media
    it resides. |

    | b factor | Blocking factor. Specifies the number of 512-byte blocks to write
    to tape per operation. |

    | c | Instructs ufsdump to back up to cartridge tape. When end-of-media detection
    applies, this option sets the block size to 126. |

    | d bpi | Tape density. Use this option only when ufsdump cannot detect the end
    of the media. |

    | D | Disk. Backs up to floppy disk. |

    | f dump-file | Dump file. Specifies the destination of the backup. The dump-file
    argument can be one of the following: |


    +   - Local tape drive or disk drive

    - Remote tape drive or disk drive

    - Standard output


    Use this argument when the destination is not the default local tape drive /dev/rmt/0.
    If you use the f option, you must then specify a value for dump-file.'
