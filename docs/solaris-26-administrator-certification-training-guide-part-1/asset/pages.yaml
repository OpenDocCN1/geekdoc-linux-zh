    ```


    # rcp


    You can also use the rcp (remote copy) command to transfer one or more files between
    two hosts on a network. The other system must trust your ID on the current host.
    This trust relationship was discussed in Chapter 4.


    The rcp command is more convenient than ftp. First, rcp does not require a login
    or password if the proper trust relationship exists between the systems, which
    makes it suitable for scripts. Second, rcp allows complete directory trees to
    be copied from one system to another. However, ftp has more options and is considered
    more secure. An example use of rcp is


    ```

    ```

    rcp /etc/hosts systemB:/etc/hosts

    ```

    ```


    The example uses rcp to copy the file /etc/hosts from the local system to systemB.


    # rsh


    You use the rsh (remote shell) command to execute a shell on another system on
    the network. The other system must trust your ID on the current system. The following
    example uses rsh to get a long listing of the directory /etc on systemB:


    ```

    ```

    rsh systemB ls -la /etc

    ```

    ```


    # rexec


    The rexec command is also used to execute a shell on a remote system. The command
    differs from rsh in that you must enter a password. At many sites, rsh is disabled
    for security reasons and rexec is used as a replacement.


    # rwho


    The rwho command produces output similar to the who command but for all systems
    on the network.'
  merge: -1
