  md: "A case command executes the list associated with the first pattern that matches\
    \ the choice. Here's an example to describe how a case statement works:\n\n```\n\
    ```\necho Please enter the letter next to the command that you want to select:\n\
    echo 'a date'\necho 'b ls'\necho 'c who'\nread choice\ncase $choice in\ndate;;\n\
    ls;;\nwho;;\n*) echo Invalid choice - Bye.\nesac\n```\n```\n\nThe list of choices\
    \ is scanned to find the one that matches the value input by the user. The choice\
    \ *) matches any value so it's usually added as a last option—a catchall.\n\n\
    # Repeated Action Commands\n\nThe Bourne shell provides three repeated action\
    \ commands, each of which corresponds to constructs you might have met before\
    \ in other programming languages:\n\n+   - for\n- while\n- until\n\nThese commands\
    \ cause a program to loop or repeat and are described next.\n\n# For Loop\n\n\
    A useful shell command is the for loop, which is the simplest way to set up repetition\
    \ in a shell script. The syntax of a for loop is as follows:\n\n```\n```\nfor\
    \ name [ in word . . . ]\ndo list\ndone\n```\n```\n\nEach time a for command is\
    \ executed, name is set to the next word taken from the in word list. If in word\
    \ . . . is omitted, the for command executes the do list once for each positional\
    \ parameter that is set. Execution ends when there are no more words in the list.\
    \ The following example illustrates a simple for loop:\n\n```\n```\nfor i in eat\
    \ run jump play\ndo\n    echo See spot $i\ndone\n```\n```"
