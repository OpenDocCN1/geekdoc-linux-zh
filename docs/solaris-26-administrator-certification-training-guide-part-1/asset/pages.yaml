  md: '# INIT Phase


    The init process is the parent of all other processes. Init examines the contents
    of the /etc/inittab file to determine the order for starting up other processes
    and what to do when one of these processes ends. Each entry in the /etc/inittab
    file has the following fields:


    ```

    id:runlevel:action:process

    ```


    Table 1-8 provides a more detailed description of each field.


    # Table 1-8 Fields in the inittab File


    | Field | Description |

    |---|---|

    | id | A unique identifier |

    | runlevel | The run level |

    | action | How the process is to be run |

    | process | The name of the command to execute |


    The following example shows a default /etc/inittab file:


    ```

    ap::sysinit:/sbin/autopush -f /etc/iu.ap

    fs::sysinit:/sbin/bcheckrc >/dev/console 2>&1 </dev/console

    is:3:initdefault:

    p3:s1234:powerfail:/sbin/shutdown -y -i0 -g0 >/dev/console 2>&1 </dev/console

    s0:0:wait:/sbin/rc0 off >/dev/console 2>&1 </dev/console

    s1:1:wait:/sbin/shutdown -y -iS -g0 >/dev/console 2>&1 </dev/console

    s2:23:wait:/sbin/rc2 >/dev/console 2>&1 </dev/console

    s3:3:wait:/sbin/rc3 >/dev/console 2>&1 </dev/console

    s5:5:wait:/sbin/rc5 ask >/dev/console 2>&1 </dev/console

    s6:6:wait:/sbin/rc6 reboot >/dev/console 2>&1 </dev/console

    o f:0:wait:/sbin/uadmin 2 0 >/dev/console 2>&1 </dev/console

    fw:5:wait:/sbin/uadmin 2 2 >/dev/console 2>&1 </dev/console

    RB:6:wait:/sbin/sh -c ''echo "\nThe system is being restarted."'' >/dev/ \

    console 2>&1

    sc:234:respawn:/usr/lib/saf/sac -t 300

    co:234:respawn:/usr/lib/ttymon -g h -p "uname -n" console login: -T \

    sun -d /dev/console -l

    console -m ldterm,ttcompat

    ```


    When the system is first booted, init starts all processes labeled sysinit in
    the inittab file. The initdefault entry in /etc/inittab identifies the default
    run level. In this example, the default is run level 3 (multiuser mode with network
    file sharing). The init daemon runs each process associated with this run level
    (each entry that has a 3 in its run-level field). Each'
  merge: -1
