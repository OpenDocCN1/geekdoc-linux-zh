- pgno: 255
  md: '# finger


    The finger command displays information about users logged on the local or other
    systems. If finger is used without an argument, it gives information concerning
    users currently logged in. If finger is used with an argument (for example, the
    user name glenda) it displays information about all users matching the argument.
    You can also use the finger command to look up users on a remote system by specifying
    the user as username@host. To protect user privacy, many remote systems do not
    allow remote fingering of their systems.


    # Network Maintenance


    In addition to the TCP/IP set of commands, Solaris provides several network commands
    the system administrator can use to check and troubleshoot the network. To verify
    that the network is operational, follow these steps:


    +   1. Check the network connection to another system by typing:

    2. Check for network traffic by typing:


    ```

    ping <options> <ip address>

    ```


    For example, to check the network between systemA and systemB, type ping systemB
    from systemA. If the check is successful, the remote system replies systemB is
    alive. If the network is not active, you get this message: no answer from systemB.
    If this is the response, check your cabling and make sure the remote system is
    configured properly.


    ```

    netstat -i 5

    ```


    The system responds with:


    ```

    input le0 output input (Total) output

    packets errs packets errs colls packets errs packets errs colls

    95218 49983 189 1 0 218706 49983 123677 1 0

    0 0 0 0 0 3 0 3 0 0

    0 0 0 0 0 4 0 4 0 0

    1 1 0 0 0 144 1 143 0 0

    0 0 0 0 0 256 0 256 0 0

    0 0 0 0 0 95 0 95 0 0

    0 0 0 0 0 1171 0 1171 0 0

    ```


    The netstat command is used to monitor the system''s TCP/IP network activity and
    is described in more detail in Volume 2. netstat can provide some basic data about
    how much and what kind of network activity is happening. The -i option shows the
    state of the network interface used for TCP/IP traffic. The last option, -5, reissues
    the netstat'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'command every five seconds to get a good sampling of network activity. Type
    ctrl-c to break out of the netstat command.


    4. Look in the colls column for a high number of collisions. To calculate the
    network collision rate, divide the number of output collisions (Output Colls)
    by the number of output packets. A network-wide collision rate of greater than
    10% can indicate an overloaded network, a poorly configured network, or hardware
    problems.


    5. Examine the errs column for a high number of errors. To calculate the input
    packet error rate, divide the number of input errors by the total number of input
    packets. If the input error rate is high—more than 25%—the host might be dropping
    packets due to transmission problems. Transmission problems can be caused by other
    hardware on the network as well as heavy traffic and low-level hardware problems.
    Routers can drop packets, forcing retransmissions and causing degraded performance.


    6. Type ping -srv <hostname> from the client to determine how long it takes a
    packet to make a round trip on the network. If the round trip takes more than
    a few milliseconds, there are slow routers on the network or the network is very
    busy. Issue the ping command twice and ignore the first set of results. The ping
    -srv command also displays packet losses. If you suspect a physical problem, use
    ping -srv to find the response time of several hosts on the network. If the response
    time (ms) from one host is not what you expect, investigate that host.


    In a networked environment, system performance depends on how well you''ve maintained
    your network. An overloaded network will disguise itself as a slow system and
    can even cause downtime. Monitor your network continuously; you need to know how
    the network looks when things are running well so you know what to look for when
    the network is performing poorly. The network commands described in this chapter
    only report numbers. You''re the one who decides if these numbers are acceptable
    for your environment. As stated before, when it comes to system administration,
    practice and experience will make you excel as a system administrator. The same
    holds true for administering a network.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# APPENDIX


    # A


    # The History of

    UNIX'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'UNIX is plural. It is not one operating system but many implementations of
    an idea that originated in 1965. As a system administrator, you''ll want to understand
    the history of the UNIX operating system—where it came from, how it was built,
    and where it is now. Understanding the various versions of UNIX and its origins
    makes it clear why UNIX became known as a somewhat hostile operating system. For
    example, UNIX was not developed by a single company with a large marketing organization
    driving the user interface. (In other words, it did not follow the development
    path of, say, Microsoft Windows.) On the other hand, UNIX was not invented by
    hackers who were fooling around; it grew out of strong academic roots. The primary
    contributors to UNIX were highly educated mathematicians and computer scientists
    employed by what many people feel is the world''s premier industrial research
    center, Bell Laboratories. Although knowledgeable and experienced in their own
    right, these developers maintained professional contacts with researchers in academia,
    leading to an exchange of ideas that proved beneficial for both sides. Understanding
    the symbiotic relationship between UNIX and the academic community means understanding
    the background of the system''s inventors and the history of interactions between
    universities and Bell Laboratories.


    # How It All Began


    It all began at Bell Labs, the research lab of AT&T, one of the largest and most
    powerful companies of our time. Ironically, AT&T was not interested in developing
    and selling computers or operating systems. In fact, the U.S. Department of Justice
    did not allow AT&T to sell software. However, AT&T''s existing systems, made up
    of people and paper, were in danger of being overwhelmed in the boom of the 1960s.
    By the 1970s, the phone business was in jeopardy. Out of desperation and need,
    Ken Thompson of AT&T set out to develop what no computer company was ready to
    provide—a multiuser, multiprocessing operating system to be used in-house for
    its own information processing department. Specifically, the goal was an operating
    system to support several programmers simultaneously in a more hospitable environment.


    What follows is an account of major dates and events in the development cycle
    of the UNIX operating system.


    # 1965-1969


    In 1965, Bell Labs joins with MIT and General Electric in a cooperative development
    of Multics, a multiuser interactive operating system running on a GE 645 mainframe
    computer. However, unhappy with the progress in the development of a system that
    is experiencing many delays and high costs, Bell Labs drops out of the development
    of Multics in 1969.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# 1970


    Ken Thompson, exposed to Multics at Bell Labs, meets up with Dennis Ritchie, who
    provides a Digital Equipment Corporation PDP-7 minicomputer to continue the development
    of an operating system capable of supporting a team of programmers in a research
    environment. After they create a prototype. Thompson returns to Bell Labs to propose
    the use of this new operating system as a document preparation tool in the Bell
    Labs patent department. The new operating system is named UNIX to distinguish
    it from the complexity of MULTICS. Efforts to develop UNIX continue, and UNIX
    becomes operational at Bell Labs in 1971.


    The first version of UNIX is written in assembly language on a PDP-11/20. It includes
    the file system, fork(), roff, and ed, and is used as a text-processing tool for
    preparation of patents.


    # 1970-1972


    During the early 1970s, UNIX begins to gain popularity throughout Bell Labs, and
    as word of the new operating system spreads, universities embrace it. However,
    although it is looked on favorably by the academic and high technology sectors,
    it is met with skepticism by the business community. In a move to heighten the
    popularity of UNIX, AT&T begins to license the UNIX source code to universities
    at a minimal cost. AT&T provides many licensees with the software code and manuals,
    but doesn''t provide technical support. By the late 1970s, 70% of all colleges
    and universities have UNIX. Computer science graduates are using it, even modifying
    the code to make it more robust. Up to this point, UNIX was written in assembly
    language and ran primarily on DEC hardware—first on the PDP-7, then the PDP-11/40,
    the 11/45, and finally the 11/70, on which it gained wide popularity.


    # 1973-1979


    This period will become the most significant in the development of UNIX. Ritchie
    and Thompson had developed the C programming language between 1969 and 1973 and
    now rewrite the UNIX kernel in the high-level C language. Now the OS can be compiled
    to run on different computers and, within months, UNIX can be ported to new hardware.
    Modifications to the OS are easy. Again, Thompson resonates with the academic
    community already using UNIX in many of its system design courses. UNIX, now written
    in a general-purpose language featuring modern commands, begins to take off in
    the areas of word processing and programming.


    By now, UNIX is at version 6, the first release of UNIX to be picked up by a commercial
    firm, Whitesmiths, Inc., who create a commercial copy of version 6 called Idris.
    In 1973, Ken Thompson visits Berkeley while on sabbatical and installs version
    6 on a PDP-11/70. Two graduate students, Bill Joy and Chuck Haley, get involved
    with version 6'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'and later play an important role in the development of the UNIX system at Berkeley.
    The first project they work on is the development of the UNIX ex editor.


    Joy and Haley begin to take interest in the internal operations of UNIX, specifically
    the kernel. Bill Joy puts together a distribution of UNIX called the “Berkeley
    Software Distribution,” or BSD. He includes enhancements such as the C shell (a
    C-like interface to UNIX) and the VI editor. 1BSD is released in 1975. By the
    second release of BSD (1978), Joy has added virtual memory support, which allows
    programs to run even if they require more physical memory than is available at
    the time. This second edition of BSD has a strong influence on the release of
    Bell Lab’s Version 7 of UNIX, which is released in 1979 and is the last of the
    “clean” versions of UNIX.


    In the late 1970s, the United States Department of Defense’s Advanced Research
    Projects Agency (DARPA) decides to base its universal computing environment on
    Berkeley’s version of UNIX. In the 4.1 release of BSD, DARPA provides some important
    performance tune-ups. The fast file system, which provides a method of improving
    performance of the file system and preventing file fragmentation, is added in
    release 4.2.


    # 1982–1983


    AT&T formally releases a beta version of UNIX to the commercial sector in 1982,
    but in 1983, AT&T releases the first true production version of UNIX, naming it
    System III (Systems I and II never existed). Although based on version 7 of UNIX
    and, thus, including some BSD utilities, the release of System III does not include
    the VI editor or the C shell. Instead, AT&T includes the programmer’s workbench.


    With the release of System III, AT&T sees a future in UNIX and soon releases System
    V. (System IV is never seen outside of AT&T.) System V includes the editor, curses
    (the screen-oriented software libraries), and the init program, which is used
    to start up processes at UNIX boot-up.


    In the early 1980s, Bill Joy leaves Berkeley with a master’s degree in electrical
    engineering and becomes co-founder of Sun Microsystems (Sun stands for Stanford
    University Network). Sun’s implementation of BSD is called SunOS. Sun extends
    the networking tools of the operating system to include the Networked File System
    (NFS) that is to become an industry standard. Sun also does some of the early
    work in developing windowing software for UNIX. SunOS first gets released in 1983.
    With workstation products now being offered by Sun, UNIX begins to gain acceptance
    in the high-technology arena, especially computer-aided design and engineering
    (CAD/CAE) environments. The early 1980s see CAD/CAE become popular. Additional
    workstation vendors such as HP and Apollo begin to exploit CAD/CAE capabilities,
    and performance gains over the popular personal computers of the time. These UNIX
    workstations could out-perform PCs and, with UNIX as an operating system, could
    provide a multiuser environment.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'In other business computing environments, however, UNIX is still considered
    a hostile environment and does not pose a threat to the mainframes of the time.
    UNIX has yet to define itself as a user-friendly, tried-and-tested operating system.
    It is, however, gaining ground in the areas of multitasking and networking. More
    important, UNIX is being touted as the operating system that provides portability
    between different hardware architectures, and as a consequence, software developers
    are getting excited about UNIX. In theory, a program written in C for UNIX would
    be portable to any hardware platform running the UNIX operating system.


    # 1984–1987


    In 1984, AT&T releases System V, release 2, and in 1987, release 3. Release 2
    introduces the terminal capability database termcap file, named terminfo, which
    provides support for various CRT terminals connected to the UNIX system. Other
    changes include the addition of streams and Remote File Systems.


    # 1988–1992


    In 1988, AT&T shocks the UNIX community by purchasing a percentage of Sun Microsystems,
    already a leader in the industry. Other hardware vendors see this as an unfair
    advantage for Sun, so they quickly form a consortium group called Open Software
    Foundation (OSF). Together they raise millions of dollars to develop a new UNIX
    standard to compete against Sun’s.


    In a counter-strike, AT&T, Sun, Data General, and Unisys join forces to start
    their own organization to fight OSF. This consortium of companies, called UNIX
    International (UI), is formed to oversee the development of System V standards.


    OSF and UI will turn out to be the two major competing commercial standards for
    UNIX.


    By the late 1980s, AT&T concludes that UNIX is a distraction from the company’s
    focus on producing hardware. As a result, AT&T forms the UNIX Software LAB (USL),
    ultimately purchased by Novell in 1992.


    In 1992, at the summer Usenix conference, Berkeley announces it will conclude
    its development activities at 4.4 of BSD. Several people who were involved with
    BSD form smaller companies to try to continue development of BSD, but without
    Berkeley and ARPA, it is not the same.


    In the 1990s, BSD and System V dominate the industry, with several vendors providing
    their versions of one of the two operating systems. Soon UNIX, an operating system
    meant to provide portability of applications between multiple hardware platforms,
    is getting out of control. Applications are not portable between UNIX System V,
    release 3, and BSD. To create even more confusion, hardware vendors are enhancing
    their versions of BSD and System V.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# 1993


    Sun announces that SunOS, release 4, will be its last release of an operating
    system based on BSD. Sun sees the writing on the wall and is moving to System
    V, release 4, which they name Solaris. System V, release 4 (SRV4), would be a
    merger of System V and BSD, incorporating the important features found in SunOS.


    As more hardware vendors, such as Sun, begin to come into the picture, a proliferation
    of UNIX versions emerges. Although these hardware vendors have to purchase the
    source code from AT&T and port UNIX to their hardware platforms, AT&T''s policy
    toward licensing the UNIX brand name allows nearly any hardware vendor willing
    to pay for a license to pick up UNIX. Because UNIX is a trademark, hardware vendors
    have to give their operating systems a unique name. A few of the more popular
    versions of UNIX that have survived over the years are


    +   - **SCO UNIX**—SCO Open Desktop and SCO Open Server from the Santa Cruz Operation
    for the Intel platform.

    - **SunOS**—Sun''s early OS and the best known BSD operating system.

    - **Solaris**—Sun''s SRV4 implementation, also referred to as SunOS 5.x.

    - **HP-UX**—Hewlett-Packard''s version of UNIX. HP-UX 9.x was System V, release
    3, and HP-UX 10 is based on the System V, release 4 OS.

    - **Digital UNIX**—Digital Equipment''s version of OSF/1.

    - **IRIX**—The Silicon Graphics version of UNIX. Early versions were BSD-based;
    version 6 is System V, release 4.

    - **AIX**—IBM''s System V-based UNIX.

    - **Linux**—A free UNIX operating system for the INTEL platform.


    With the uncontrolled proliferation of UNIX versions, standards become a major
    issue. In 1993, Sun announces they are moving to System V in an effort to promote
    standards in the UNIX community. With two major flavors of UNIX, standards cannot
    become a reality. Without standards, UNIX would never be taken seriously as a
    business computing system. Thus, Sun develops BSD but provides its users with
    System V, release 4, shrink-wrapped directly from AT&T. In addition, any applications
    developed by Sun to be added onto UNIX are to be SRV4-compliant. Sun challenges
    its competitors to provide true portability for the user community.


    The Graphical User Interface (GUI) is the next wave in the development of the
    UNIX operating system. As each hardware vendor tries to outdo the other, ease
    of use becomes an issue. Again, in this area especially, standards are important.
    Applications that are to be portable need a GUI standard. Therefore, Sun and AT&T
    start promoting OPEN LOOK, which they jointly developed. Their goal is to create
    a consistent look and feel for all flavors of UNIX, but unfortunately, OSF has
    its own GUI called OSF/MOTIF. Thus, round two of the fight for standards begins,
    with MOTIF beating out OPEN LOOK.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'MOTIF is based on a GUI developed at MIT, named X-Windows, which enables a
    user sitting at one machine to run programs on a remote machine while still interacting
    with the program locally. X is, in effect, one way for different systems to interface
    with each other. X-Windows lets a program run on one computer and display its
    output on another computer, even when the other computer is of a different operating
    system and hardware architecture. The program displays its output on the local
    machine, accepts keyboard and mouse input from the local machine, but executes
    on the CPU of the remote machine.


    The local machine is typically a workstation or terminal called a dedicated X
    terminal and built specifically to run X-Windows. The remote machine may be a
    minicomputer or server, a mainframe, or even a supercomputer. In some cases, the
    local machine and the remote machine might, in fact, be the same. In summary,
    X is a distributed, intelligent, device-independent, operating-system-independent
    windowing system.


    As stated earlier, MOTIF beat OPEN LOOK in the standards war. Sun concedes and
    starts to provide a package that contains both OPEN LOOK and MOTIF—called the
    Common Desktop Environment (CDE)—as standard equipment in the Solaris OS.


    # Late 1990s


    Today many hardware vendors have "buried the hatchet" and, for the sake of users,
    are moving their implementations of UNIX to be SRV4-compliant. SRV4 will clearly
    be the dominant flavor of UNIX across most major platforms. As all vendors begin
    to implement SRV4 along with the Common Desktop Environment, users will begin
    to see a more consistent implementation of UNIX. In addition, software providers
    can be assured that applications written to be SVR4 compliant will be portable
    across many hardware platforms.


    # Solaris


    We have discussed the history of UNIX and made predictions. No other flavor of
    UNIX is more popular or has enjoyed a wider user base and cultural following than
    Sun Microsystem’s Solaris. Sun Microsystem’s focus has been on UNIX since it was
    founded in 1982, and it appears to have no intention of moving away from the UNIX
    operating system. Sun’s user base has a strong loyalty for the company as well
    as for the operating system. Sun’s most recent version is Solaris 2.6, based on
    System V, release 4. The Solaris operating system is available for the SPARC architecture,
    Sun’s own processor, and the Intel platform.


    # Milestones in the Development of UNIX


    | Year | Milestone |

    |------|-----------|

    | 1965 | Bell Laboratories joins with MIT and General Electric to develop Multics.
    |

    | 1970 | Ken Thompson and Dennis Ritchie develop UNIX. |

    | 1971 | The B-language version of the OS runs on a PDP-11. |

    | 1973 | UNIX is rewritten in the C language. |'
  merge: -1
  img_proc: true
- pgno: 264
  md: '+   - 1974 Thompson and Ritchie publish a paper and generate enthusiasm in
    the academic community. Berkeley starts the BSD program.

    - 1975 The first licensed version of BSD UNIX is released.

    - 1979 Bill Joy introduces "Berkeley Enhancements" as BSD 4.1.

    - 1982 AT&T first markets UNIX. Sun Microsystems is founded.

    - 1983 Sun Microsystems introduces SunOS.

    - 1984 About 100,000 UNIX sites exist worldwide.

    - 1988 AT&T and Sun start work on SVR4, a unified version of UNIX.

    - 1988 OSF and UI are formed.

    - 1989 AT&T releases System V, release 4.

    - 1990 OSF releases OSF/1.

    - 1993 Novell buys UNIX from AT&T.

    - 1993 Sun introduces Solaris, which is based on System V, release 4. SunOS, which
    is based on BSD UNIX, will be phased out.

    - 1995 Santa Cruz Operation buys UNIXware from Novell. SCO and HP announce a relationship
    to develop a 64-bit version of UNIX.

    - 1997 International Data Corp estimates that approximately three million UNIX
    systems will be shipped worldwide.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# APPENDIX


    # B


    The Fundamentals of Client-Server Computing


    ![](img/85737305a4c9aeecbcadd9986d604c02_265_0.png)'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'When speaking of client-server, open systems, and distributed computing environments,
    UNIX comes up in the same conversation. UNIX provides the foundation required
    to support these environments. This section describes the roll of UNIX in the
    world of client-server computing.


    # The First UNIX Server


    Before 1990, UNIX was used exclusively by scientists, mathematicians, engineers,
    and graduate students. During this period, UNIX ran only on minicomputers, smaller
    than a mainframe but larger than a PC. A typical mini was equipped with 300MB
    of disk space and 2-4MB of RAM. A minicomputer usually supported one to twelve
    users and was accessed via dumb alphanumeric terminals.


    # An OS Designed for Speed


    Disks operate in milliseconds and RAM operates in nanoseconds. UNIX was designed
    to take advantage of RAM; thus, the more RAM, the better the performance. When
    RAM was limited, disk space was substituted for physical RAM. As the number of
    users on a server grew, performance degraded and another server was added. As
    users were moved to the new server, data was shared via the network. Soon, graphical
    terminals became available and replaced the character-based terminals; before
    long, these graphical terminals had their own CPUs and RAM. Because they had no
    disk drive and relied on the minicomputer or "server" for storage, the terminals
    were termed "diskless clients." With their own processing capability, the terminals
    could off-load the task of processing from the server which, by this time, was
    simply used for storage of applications and data. At power-on, the client downloaded
    UNIX into its local memory and—except for retrieving data—operated in a standalone
    mode.


    # The Birth of the Workstation


    As disk drives became less expensive, disks were added to the client and UNIX
    could be loaded locally. The term "diskfull" client was coined, but these were
    soon referred to as "workstations" to differentiate them from the less expensive
    personal computers. Workstations operating with the UNIX OS were multitasking,
    multiuser systems, but the PC was still a single-tasking, single-user environment.


    Workstations were fueled by cheaper memory and faster CPUs. Servers and workstations
    were equipped with 16-32MB of RAM, and applications could be loaded directly on
    the workstations to further improve performance. Workstations could access data
    across several servers and share processing tasks with other workstations, allowing
    the processing load to be distributed across a network of computers.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Workstation costs averaged between $35,000 to $55,000, with servers in the
    $100,000 range. Use of these systems was mainly in high-tech and engineering environments.
    The systems were standalone units, and system management was not a big issue for
    this group of users; however, workstation vendors looking for new opportunities
    knew they must break out of the technical arena. They looked toward general business
    applications such as accounting, finance, and business information systems—environments
    requiring larger systems, supporting hundreds of users and large data pools. Up-time
    was required 24 hours per day, 7 days per week, and system failures and data loss
    were disastrous to these environments.


    # Distributed Computing


    Something else was happening in the computer world that changed the course of
    UNIX: mainframes were running out of power because of the large numbers of users
    and the more complex applications they were supporting. With more users came more
    data and the need to access this data in a timely fashion. To further complicate
    matters, businesses were no longer centralized, and many users needed to connect
    to the mainframe over telephone lines. When the mainframe failed, all users were
    affected.


    UNIX fit perfectly in this environment. It already had the network functionality
    for computers to communicate, and it acted as a single system while providing
    a distributed computing environment. Local systems could run processes on other,
    less loaded systems, and data access was transparent across multiple networks.
    As performance degraded, another server could be added to lighten the load. The
    UNIX system now had a chance to infiltrate the mainframe world. A typical scenario
    placed multiple UNIX servers on a network. Workstations, called clients, were
    placed at the users'' desks. Applications ran on the users'' desktops, accessing
    data on the servers. In a nutshell, this was client-server computing and the advantage
    UNIX used to gain new markets.


    In recent years, PCs and workstations have grown more powerful and less expensive.
    At first, cost and performance constituted the difference between a workstation
    and a personal computer. Today, the distinction between a workstation and a PC
    is less obvious. Whatever we call the desktop system, users no longer need to
    rely on the mainframe when they have high performance and adequate storage on
    their desktop computers. Application developers are porting their applications
    to these high-performance desktops, using the mainframe for storage and large
    database transactions. By moving the application to the local desktop, the load
    of users and their applications is distributed over the network and off the mainframe.
    Unfortunately, this means the network takes a beating and soon becomes the performance
    bottleneck.


    Many advances in network technology are addressing this network bottleneck. Ethernet
    switches and network interfaces that support 100-megabit to 1-gigabit transfer
    rates are being implemented, adding complexity to the system administrator''s
    job. Network management is'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'as important as managing the UNIX system. The system administrator not only
    needs to understand the UNIX operating system and hardware but must be knowledgeable
    in network design and management as well.


    # UNIX Administration in a Mainframe Environment


    Today many businesses are replacing mainframes with several less expensive, more
    powerful UNIX servers. The mainframe world, however, requires consistency and
    robust system management utilities. With 25 years of development under its belt,
    UNIX provides much of the functionality a user would expect. In fact, the last
    few releases of SVR4 have not seen much more development in this area, other than
    the development of GUIs and the windowing system. User enhancements that provide
    general functionality within the OS have been developed and tested and are as
    solid as any OS in existence. Development now lies in the area of performance,
    high availability, and system administration. Hardware vendors competing against
    mainframes are rapidly developing applications and utilities to compete in this
    arena. To appear open and SVR4-compliant, vendors usually refer to features as
    extensions or enhancements. In addition, third-party software developers daily
    create new applications as additional "extensions" to UNIX, to meet the demands
    of the server community. This area is rapidly changing for the UNIX system administrator.


    Unfortunately, even when a system is SVR4-compliant, system administration is
    not consistent between hardware vendors. As standards are developed for the UNIX
    operating system, the area of system administration is often overlooked. Although
    everyone is moving toward SVR4, and to the general user, UNIX is UNIX, be aware
    that system administration on HP, IBM, DEC, and such is very different and will
    probably always remain that way.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# APPENDIX


    # C


    # Overview of

    SCSI Devices'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'SCSI (pronounced "scuzzy") is an acronym for the Small Computer Systems Interface.
    This interface is an American National Standards Institute (ANSI) standard for
    high-speed parallel data communication between computers and their peripheral
    devices. The SCSI standard can be divided into SCSI-1, SCSI-2, and SCSI-3. SCSI-3
    is the most recent version of the SCSI command specification and is also called
    Fast/Wide SCSI. SCSI-2 and SCSI-3 allow scanners, hard disk drives, CD-ROM players,
    tapes, and many other devices to connect to a computer.


    You might be familiar with IDE disk drives but not SCSI drives. IDE drives are
    much more prevalent on PCs. The IDE/ATAPI is also a data interface that often
    is provided by PC manufacturers and is generally included when you purchase a
    new personal computer. Usually, the computer motherboard comes with a primary
    and secondary IDE bus. Up to two IDE/ATAPI devices, a master and slave, can be
    connected to each bus. Because this interface is less sophisticated than the SCSI
    one, ATAPI devices are usually more affordable. Note, however, that IDE/ATAPI
    devices are often slower and—particularly in the case of CD-Readers—less accurate.
    The benefits of SCSI are probably best identified by listing the reasons why anyone
    would use SCSI:


    +   - SCSI makes adding new peripheral devices to a computer system easy.

    - Because the development cycle for SCSI devices is very short, the latest generation
    of SCSI peripherals keeps pace with the latest generation of computer systems.
    SCSI disk drives usually out-perform IDE disk drives.

    - SCSI maintains high performance standards, which is why SCSI is still the dominant
    interface for medium and large systems.

    - SCSI is a smarter bus than IDE. On operating systems that allow multitasking,
    the SCSI drive is a better choice because the extra intelligence of the SCSI bus
    is used. IDE also uses controllers on each device, but they cannot operate at
    the same time and they do not support command queuing. The performance overhead
    of SCSI over IDE comes from the structure of the bus, not the drive. The nature
    of the SCSI bus provides much better performance when you''re doing data-hungry
    tasks such as multitasking. The SCSI bus controller is capable of controlling
    the drives without any work by the processor. Also, all drives on a SCSI chain
    are capable of operating at the same time. With IDE, you''re limited to two drives
    in a chain, and these drives cannot work at the same time (in essence, they must
    "take turns").

    - SCSI is an intelligent interface, which means the intelligence about I/O operations
    is moved from the host CPU to the peripheral device. Data can then be transferred
    at high speeds between the devices without taking any CPU power. Also, computer
    systems can use a standard set of commands to accomplish the moving of data between
    the host and device. Adding to the simplicity of the SCSI interface, you can connect
    a new peripheral device to an existing system with no hardware changes or additional
    hardware parts.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '+   - SCSI has a demonstrated track record of keeping pace with the growing
    and evolving requirements of desktop and server systems.

    - Using SCSI both preserves the investment of installed-base environments and
    maintains a platform for future enhancements of SCSI systems.


    Here are the definitions of a few SCSI terms you''ll come across:


    +   - **Host adapter** The host adapter, or SCSI controller, is the card that
    connects your computer to the SCSI bus.

    - **SCSI device** Any device that attaches to the SCSI host adapter, such as a
    tape drive or disk drive.

    - **SCSI ID** Also referred to as the target ID, this is a unique ID assigned
    to each SCSI device. It is usually selectable on the rear of the device. No two
    devices on the same SCSI chain can share the same ID.

    - **SCSI chain** Devices such as disk drives and tape drives are daisy-chained
    from the host adapter. This chain of devices is referred to as a SCSI chain.

    - **SCSI terminator** The last device on the SCSI chain must be terminated. Termination
    must be present at only two positions on the SCSI bus—the beginning and the end.
    Termination at the beginning of the SCSI bus is done on the motherboard automatically.
    The system administrator usually has to install a terminator on the last SCSI
    device. There must be two terminators on the bus—not more or less. The terminator
    is either passive or active and is usually labeled as such; some active terminators
    have a small LED as well. A passive terminator is a group of resistors on the
    physical end of a single-ended SCSI bus that dampens reflected signals from the
    ends of the bus. Passive terminators do not use a voltage regulator and might
    not be exactly +5 volts. Active terminators use a voltage regulator to make sure
    the voltage is exactly +5 volts. You need to determine what type of termination
    to use, so follow the instructions in the hardware installation guide that comes
    with the equipment. Some peripherals are auto-terminating; terminating these devices
    twice can cause undesirable results.

    - **Single-ended SCSI** An early type of SCSI-1 device. The maximum length for
    a SCSI-1 SCSI chain is 6 meters and the maximum number of devices is eight.

    - **Differential SCSI** The next-generation SCSI type. Allows a maximum cable
    length of 25 meters and is electrically incompatible with single-ended devices.
    Differential SCSI supports a maximum of 16 devices.

    - **Asynchronous SCSI** A way of sending data over the SCSI bus. The initiator
    sends a command or data over the bus and then waits until it receives a reply.

    - **Synchronous SCSI** Rather than waiting for a reply, connected devices that
    both support synchronous SCSI can send multiple bytes over the bus. This improves
    throughput, especially if you use long cables.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '+   - **Fast SCSI (SCSI-2)** Fast SCSI allows faster timing on the bus; 10MHz
    instead of 5MHz. On an 8-bit SCSI bus, this increases the maximum speed from 5MBps
    to 10MBps.

    - **Ultra SCSI** Allows up to 20MHz signals on the bus to achieve speeds of up
    to 20MBps.

    - **Wide SCSI (SCSI-3)** Uses an extra cable (or 68-pin P cable) to send the data
    16 or 32 bits wide. This allows for double or quadruple speed over the SCSI-1
    bus. Currently, no single drive reaches these speeds, but groups of several drives
    can.


    Following is a visual guide for SCSI connectors.


    Most SCSI Slow (5MBps) computers and host adapters use the Centronics-type 50-pin
    connector shown in Figure C-1.


    ![](img/85737305a4c9aeecbcadd9986d604c02_272_0.png)


    Many 8-bit SCSI Fast (up to 10MBps) computers and host adapters use the 50-pin
    high-density connector shown in Figure C-2.


    ![](img/85737305a4c9aeecbcadd9986d604c02_272_1.png)


    All Fast or Wide (16-bit) SCSI-3 computers and host adapters, as well as old DEC
    single-ended SCSI s, use the 68-pin high-density connector shown in Figure C-3.


    ![](img/85737305a4c9aeecbcadd9986d604c02_272_2.png)


    A less common SCSI connector, the New SCA 80-pin connector is shown in Figure
    C-4.


    ![](img/85737305a4c9aeecbcadd9986d604c02_272_3.png)


    As when adding any other peripheral or equipment to your system, consult with
    the manufacturer first. When adding equipment to your Sun system, first call Sun
    and make sure the equipment is supported under Solaris and that you can obtain
    instructions for connecting the equipment. Again, a few minutes of planning will
    save hours of grief and downtime. Most system administrators are more comfortable
    having their hardware maintenance person install the equipment.'
  merge: -1
  img_proc: true
