    | Min Change | (Optional) The minimum number of days allowed between password
    changes. This is intended to prevent a user from changing the password and then
    changing it back a few seconds later, which would defeat the concept of password
    aging. The default is 0. |

    | Max Change | (Optional) The maximum number of days the password is valid before
    it must be changed; otherwise, the account is locked. Leaving the field blank
