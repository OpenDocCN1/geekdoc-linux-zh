  md: "If the directory /usr/bin exists, the message Directory Found is displayed.\n\
    \nThe opposite of && is the double bar (||). When two commands are separated by\
    \ ||, the second command executes only if the first command returns a non-zero\
    \ exit status (indicating failure).\n\nExample:\n\n```\nls -d /usr/foo || echo\
