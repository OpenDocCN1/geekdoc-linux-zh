    # ttyadm


    The ttyadm command is an administrative command that formats ttymon information
    and writes it to standard output. ttyadm provides a means of presenting formatted
    port monitor-specific (ttymon-specific) data to the sacadm and pmadm commands,
    which are described next in this chapter. ttyadm is used, for example, to inform
    users that a port is disabled. Do so by typing


    ```

    ttyadmin -i

    ```'
