- pgno: 117
  md: '+   5. Type the name of the new group in the Group Name text box.

    6. Type the group ID number for the new group in the Group ID text box. This should
    be a unique number.

    7. (Optional) Type user names in the Members List text box. These are the users
    who belong to the new group. User names must be separated by commas. The list
    of users will be added to the group.

    8. Click on OK. The list of groups displayed in the Groups window is updated to
    include the new group.


    # Setting Up User Initialization Files


    Part of setting up a user''s home directory is providing user initialization files
    for the user''s login shell. A user initialization file is a shell script that
    sets up a work environment for a user after the user logs in to a system. You
    can perform any task in a user initialization file that you can perform in a shell
    script, but its primary job is to define the characteristics of the user''s work
    environment, such as search path, environment variables, and windowing environment.
    Each login shell has its own user initialization file (or files), located in the
    user''s home directory. These files are automatically run when the user logs in.


    Default user initialization files, such as .cshrc, .profile, and .login, are created
    automatically in the user''s home directory when a new user account is added.
    The system administrator can predefine the contents of these files or can choose
    to use the system default files. The Solaris 2.x system software provides default
    user initialization files for each shell in the /etc/skel directory on each system.
    These files are named as follows:


    | File | Description |

    |---|---|

    | local.cshrc | The default .cshrc file for the C shell. |

    | local.login | The default .login file for the C shell. |

    | local.profile | The default .profile file for the Bourne and K shells. |


    You can use these initialization files as a starting point and modify them to
    create a standard set of files that will provide a work environment common to
    all users. You can also modify them to provide the working environment for different
    types of users.


    # Customizing User Initialization Files


    When a user logs into a system, the user''s work environment is determined by
    the shell initialization files. The shell start-up scripts can be modified to
    set environment variables and directory paths needed by a specific user. These
    start-up scripts are located in the user''s home directory.


    When you''re setting up user initialization files, it might be important to allow
    the users to customize their own initialization files. This can be accomplished
    with centrally located and globally distributed user initialization files called
    site initialization files. Site initialization files'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'enable you to continually introduce new functionality to all of the user work
    environments by editing one initialization file. A local initialization file enables
    users to further customize their own work environment. Site initialization files
    are located in the /etc directory and can be edited only by root. Site initialization
    files are designed to distribute site-wide changes to all user work environments.
    Individual user initialization files are located in each user''s home directory
    and can be customized by the owner of that directory. When a user logs in, the
    site initialization file is run first, and then the initialization file located
    in the user''s home directory is run.


    **NOTE.** Do not use system initialization files located in the /etc directory
    (/etc/profile, /etc/login) to manage an individual user''s work environment. These
    are site initialization files, considered to be global files, meant to be generic
    and used to set work environments for all users. The system will run this start-up
    file first and will then run the user''s start-up file located in the home directory.


    The most common customizations to shell startup scripts are environment variables.
    Table 5-4 describes environment and shell variables you might want to customize
    in a user initialization file.


    # Table 5-4 Shell and Environment Variable Descriptions


    | Variable | Description |

    |---|---|

    | ARCH | Sets the user''s system architecture (for example, sun4, i386). This
    variable can be set with ARCH = `uname -p` (in Bourne or Korn shell(s) or setenv
    ARCH `uname -p` (in the C shell). The shell has no built-in behavior that depends
    on this variable; it''s just a useful variable for branching within shell scripts.
    |

    | history | Sets history for the C shell. |

    | HOME | Sets the path to the user''s home directory. |

    | LPDEST | Sets the user''s default printer. |

    | PATH (or path in the C shell) | Lists, in order, the directories the shell searches
    to find the program to run when the user types a command. If the directory is
    not in the search path, users must type the complete pathname of a command. |


    The default PATH is automatically defined in .profile (Bourne or Korn shell) or
    .cshrc (C shell) as part of the login process.


    The order of the search path is important. When identical commands exist in different
    locations, the first command found with that name is used. For example, suppose
    PATH is defined (in Bourne and Korn shell syntax) as PATH=/bin:/usr/bin:/usr/sbin:$HOME/bin
    and a file named sample resides in both /usr/bin and /home/glenda/bin. If the
    user types the command sample without specifying its full pathname, the version
    found in /usr/bin is used.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Table 5-4 Shell and Environment Variable Descriptions (continued)


    | Variable | Description |

    |---|---|

    | prompt | Defines the shell prompt for the C shell. |

    | TERM (or term in the C shell) | Defines the terminal. This variable should be
    reset in /etc/profile or /etc/.login. When the user invokes an editor, the system
    looks for a file with the same name as the definition of this environment variable.
    The system searches the directory /usr/share/lib/terminfo to determine the terminal
    characteristics. |

    | MAIL | Sets the path to the user''s mailbox. |

    | MANPATH | Sets the search path for system manual pages. |

    | umask | Sets the default user mask. |


    The following example illustrates how to verify a user''s environment settings
    and how to change them.


    +   1. Log in as the user. This step enables you to see the user''s environment
    as the user will see it.

    2. Edit the user''s initialization files. The following steps suggest some changes
    and show the shell-specific syntax to use.

    3. Set the user''s default path to include the home directory and directories
    or mount points for the user''s windowing environment and applications. To change
    the path setting, add or modify the line for PATH as follows:


    For the Bourne or Korn shell, the syntax is:


    ```

    PATH=/dirname1:/dirname2:/dirname3:; export PATH

    ```


    For example, enter the following line in the user''s $HOME/.profile file:


    ```

    PATH=$PATH:/usr/bin:$HOME/bin:/net/glrr/files1/bin:.;export PATH

    ```


    > NOTE. Prefixing $PATH (K shell) or $path (C shell) appends changes to the user''s
    path settings already set by the site initialization file. When you set the path
    variable with this procedure, initial path settings are not overwritten and lost.
    Also note the "dot" (.) at the end of the list to denote the current working directory.
    The dot should always be at the end of the path, as discussed in Chapter 4.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '4. Check that the environment variables are set to the correct directories
    for the user''s windowing environments and third-party applications. Type env
    and press Enter.


    ```

    $ env

    HOME=/home/ncalkins

    HZ=100

    LOGNAME=ncalkins

    MAIL=/var/mail/ncalkins

    MANSECTS=1:1m:1t:1f:1s:1b:2:\3:3c:3i:3n:3n:3k:3g:3e:3x11:3

    xt:3w:3b:9:4:5:7:8

    PATH=/usr/bin

    SHELL=/bin/sh

    TERM=sun

    TZ=EST5EDT

    $

    ```


    5. Add or change the settings of environment variables by entering either of the
    following lines.


    For the Bourne or Korn shell, the syntax is:


    ```

    VARIABLE=value;export VARIABLE

    ```


    The following example sets the user''s default mail directory:


    ```

    MAIL=/var/mail/ncalkins;export MAIL

    ```


    For the C shell, the syntax is:


    ```

    setenv VARIABLE value

    ```


    The following example sets the history to record the last 100 commands:


    ```

    setenv HISTORY 100

    ```


    # Directories


    The home directory is the portion of a file system allocated to a user for storing
    private files. The amount of space you allocate for home directories depends on
    the kinds of files the users create and the type of work performed. An entire
    file system is usually allocated specifically for home directories, and the users
    all share this space. The system administrator needs to monitor user home directories
    so one user does not use more than his fair share of space. Disk quotas are used
    to control the amount of disk space a user can occupy and are discussed in Chapter
    3, "Introduction to File Systems."


    A home directory can be located either on the user''s local system or on a remote
    file server. Although any directory name can be used, the home directory in either
    case is, by convention, /export/home/username. When you put the home directory
    in /export/home, the home'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'directory is available across the network in case the user logs in from several
    different stations. For a large site, you should store home directories on a server.


    Regardless of where their home directory is located, users usually access them
    through a mount point named /home/username. When AutoFS is used to mount home
    directories, you are not permitted to create any directories under the /home mount
    point on any system. The system recognizes the special status of /home when AutoFS
    is active. For more information about AutoFS and automounting home directories,
    see the NFS Administration Guide.


    To access the home directory anywhere on the network, you should always refer
    to it as $HOME, not as /export/home/username. The latter is machine-specific and
    should be discouraged. In addition, any symbolic links created in a user''s home
    directory should use relative paths (for example, ../../x/y/x) so the links will
    be valid no matter where the home directory is mounted. The location of user home
    directories might change. By not using machine-specific names, you maintain consistency
    and reduce system administration.


    This concludes the discussion on how to add user login accounts to the system.
    By default, when users first log in, they are presented with a default desktop
    window environment called CDE (Common Desktop Environment). Setup and customization
    of CDE is described in Chapter 7, “Administration and Configuration of the CDE.”'
  merge: -1
  img_proc: true
