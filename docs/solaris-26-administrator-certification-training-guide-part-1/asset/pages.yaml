- pgno: 51
  md: 'application vendor for swap-space requirements. Usually vendors give you a
    formula for determining the amount of swap space you need for each application.


    +   - Determine the software packages you will be installing and calculate the
    total amount of disk space required. When planning disk space, remember the Solaris
    Interactive Installation program enables you to add or remove individual software
    packages from the software cluster you select.

    - Create a minimum number of file systems. By default, the Solaris Interactive
    Installation program creates only root (/), /usr, and swap, although /export is
    also created when space is allocated for OS services. Creating a minimum number
    of file systems helps with future upgrades and file system expansion, because
    separate file systems are limited by their slice boundaries. Be generous on the
    size of your file systems, especially root (/) and /usr. These file systems cannot
    be increased without completely reloading the operating system.

    - Calculate additional disk space for co-packaged or third-party software.


    # Partition Arrangements on Multiple Disks


    Although a single large disk can hold all partitions and their corresponding file
    systems, two or more disks are often used to hold a system''s partitions and file
    systems.


    > NOTE. You cannot split a partition between two or more disks.


    For example, a single disk might hold the root (/) file system, a swap area, and
    the /usr file system, and a second disk might be used for the /export/home file
    system and other file systems containing user data. In a multiple disk arrangement,
    the disk containing the root (/), /usr file systems, and swap space is referred
    to as the system disk. Disks other than the system disk are called secondary disks
    or non-system disks.


    Locating a system''s file systems on multiple disks enables you to modify file
    systems and partitions on the secondary disks without shutting down the system
    or reloading the operating system software. Also, multiple disks enable you to
    distribute the workload as evenly as possible among different I/O systems and
    disk drives. They also enable you to distribute /home and swap directories evenly
    across disks.


    Having more than one disk increases input/output (I/O) volume. By distributing
    the I/O load across multiple disks, you can avoid I/O bottlenecks.


    # Device Drivers


    A computer typically uses a wide range of peripheral and mass-storage devices,
    such as a SCSI disk drive, a keyboard, a mouse, and some kind of magnetic backup
    medium. Other commonly used devices include CD-ROM drives, printers, and plotters.
    Solaris'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'communicates with peripheral devices through files called device files. Before
    Solaris can communicate with a device, the device must have a device driver, a
    low-level program that enables the kernel to communicate with a specific piece
    of hardware. The driver serves as the operating system''s "interpreter" for that
    piece of hardware.


    When a system is booted for the first time, the kernel creates a device hierarchy
    to represent all devices connected to the system. Devices are described in three
    ways in the Solaris environment, using three distinct naming conventions: the
    physical device name, the instance name, and the logical device name.


    System administrators need to understand the device names when using commands
    to manage disks, file systems, and other devices.


    # Physical Device Name


    A physical device name represents the full device pathname of the device. Physical
    device files are found in the /devices directory and have the following naming
    convention:


    ```

    /devices/sbus@1,f8000000/esp@0,400000/sd@3,0:a

    ```


    You can display physical device names by using one of the following commands:


    +   - **prtconf**—Displays system configuration information, including total amount
    of memory and the device configuration as described by the system''s hierarchy.
    The output displayed by this command depends on the type of system.

    - **sysdef**—Displays device configuration information, including system hardware,
    pseudo devices, loadable modules, and selected kernel parameters.

    - **dmesg**—Displays system diagnostic messages and a list of devices attached
    to the system since the last reboot.


    *TIP. Use the output of the prtconf and sysdef commands to identify which disk,
    tape, and CD-ROM devices are connected to the system. The output of these commands
    displays the driver not attached messages next to the device instances. Because
    these devices are always being monitored by some system process, the driver not
    attached message is usually a good indication that there is no device at that
    device instance.*


    If you need to remind yourself of the meanings of the fields of a physical device
    name, refer to Chapter 1, "Booting the Workstation," for a detailed discussion.


    # Instance Name


    The instance name represents the kernel''s abbreviated name for every possible
    device on the system. For example, s0 and s1 represent the instance names of two
    SCSI disk devices. Instance names are mapped in the /etc/path_to_inst file and
    are displayed by using the commands dmesg, sysdef, and prtconf.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Logical Device Name: Test Item


    Logical device names are used with most of the Solaris file system commands to
    refer to devices. Logical device files in the /dev directory are symbolically
    linked to physical device files in the /devices directory. Logical device names
    are used to access disk devices in the following circumstances:


    +   - Adding a new disk to the system

    - Moving a disk from one system to another

    - Accessing (or mounting) a file system residing on a local disk

    - Backing up a local file system

    - Repairing a file system


    Logical devices are organized in subdirectories under the /dev directory by their
    device types:


    | Path | Description |

    |---|---|

    | /dev/dsk | Block interface to disk devices |

    | /dev/rdsk | Raw or character interface |

    | /dev/rmt | Tape devices |

    | /dev/term | Serial line devices |

    | /dev/cua | Dial-out modems |

    | /dev/pts | Pseudo terminals |

    | /dev/fbs | Frame buffers |

    | /dev/sad | STREAMS administrative driver |


    Logical device files have major and minor numbers that indicate device drivers,
    hardware addresses, and other characteristics. Furthermore, a device filename
    must follow a specific naming convention. A logical device name for a disk drive
    has the following format:


    ```

    /dev/[r]dsk/cxtxdxsx

    ```


    where


    | Symbol | Meaning |

    |---|---|

    | cx | Refers to the controller number |

    | tx | Refers to the SCSI bus target number |

    | dx | Refers to the disk number (always 0 except on storage arrays) |

    | sx | Refers to the slice or partition number |'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Here are a few examples of logical device filenames for disk drives:


    +   - /dev/dsk/c0t3d0s0—Refers to slice 0 on a SCSI disk drive with a target ID
    of 3 on SCSI controller 0. Buffered device.

    - /dev/rdsk/c0t3d0s0—Refers to slice 0 on a SCSI disk drive with a target ID of
    3 on SCSI controller 0. Raw device.


    # Block and Character Device Files


    Some devices, such as disk drives, have an entry under both the /dev/dsk directory
    and the /dev/rdsk directory. The /dsk directory refers to the block or buffered
    device file, and the /rdsk directory refers to the character or raw device file.
    The “r” in rdsk stands for “raw.” Disk and file administration commands require
    the use of either a raw device interface or a block device interface. The device
    file used specifies whether I/O is to be handled in block or character mode, commonly
    referred to as I/O type.


    Block device files transfer data, using system buffers to speed up I/O transfer.
    Storage devices, such as tape drives, disk drives, and CD-ROMs, use block device
    files. Under most circumstances, Solaris accesses the disk via the block device.
    Data is buffered or cached in memory until the buffer is full and then it is written
    to disk.


    Character device interfaces transfer only small amounts of data, one character
    at a time. With a character device file, data is written directly to the disk,
    bypassing system I/O buffers. Buffering is controlled by the application program.
    Terminals, printers, plotters, and storage devices use character I/O.


    Different commands require different device file interfaces. When a command requires
    the character device interface, specify the /dev/rdsk subdirectory. When a command
    requires the block device interface, specify the /dev/dsk subdirectory. When you’re
    not sure whether a command requires the use of /dev/dsk or /dev/rdsk, check the
    online manual page for that command.


    # Software Terminology


    The Solaris operating system comes on a CD-ROM and is bundled in packages. Packages
    are grouped into clusters. The following sections describe the Solaris bundling
    scheme.


    # Software Package


    A software package is a group of files and directories that describe a software
    application, such as manual pages and line printer support. Solaris 2.6 contains
    approximately 80 software packages that total approximately 300MB of disk space.'
  merge: -1
  img_proc: true
