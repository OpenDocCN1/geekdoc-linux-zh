- pgno: 62
  md: 'All disk-based computer systems have a file system. In UNIX, file systems have
    two basic components: files and directories. A file is the actual information
    as it is stored on the disk, and a directory is a listing of the filenames. In
    addition to keeping track of filenames, the file system must also keep track of
    files'' access dates and of file ownership. Managing the UNIX file systems is
    one of the system administrator''s most important tasks. Administration of the
    file system involves:


    +   - Ensuring users have access to data. This means that systems are up and operational,
    file permissions are set up properly, and data is accessible.

    - Protecting file systems against file corruption and hardware failures. This
    is accomplished by checking the file system regularly and maintaining proper system
    backups.

    - Securing file systems against unauthorized access. Only authorized users should
    have access to them. The data must be protected from intruders.

    - Providing users with adequate space for their files.

    - Keeping the file system file clean. In other words, data in the file system
    must be relevant and not wasteful of disk space. Procedures are needed to make
    sure users follow proper naming conventions and data is stored in an organized
    manner.


    This chapter discusses the basic structures that make up the file system, the
    utility that creates file systems, and how Solaris accesses the file system.


    # A File System Defined


    A file system is a structure of directories used to organize and store files on
    disk. It is a collection of files and directories stored on disk in a standard
    UNIX file system format. You''ll see the term "file system" used in several ways.
    Usually file system describes a particular type of file system (disk-based, network-based,
    or pseudo file system). It might also describe the entire file tree from the root
    directory downward. In another context, the term "file system" might be used to
    describe the structure of a disk slice, described later in this chapter.


    The Solaris system software uses the virtual file system (VFS) architecture, which
    provides a standard interface for different file system types. The VFS architecture
    enables the kernel to handle basic operations, such as reading, writing, and listing
    files, without requiring the user or program to know about the underlying file
    system type. Furthermore, Solaris provides file-system administrative commands
    that enable you to maintain file systems.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Defining a Disk’s Geometry


    Before creating a file system on a disk, you need to understand the basic geometry
    of a disk drive. Disks come in many shapes and sizes. The number of heads, tracks,
    and sectors and the disk capacity vary from one model to another.


    A hard disk consists of several separate disks mounted on a common spindle. Data
    stored on each disk surface is written and read by disk heads. The circular path
    a disk head traces over a spinning disk is called a track.


    Each track is made up of a number of sectors laid end to end. A sector consists
    of a header, a trailer, and 512 bytes of data. The header and trailer contain
    error-checking information to help ensure the accuracy of the data. Taken together,
    the set of tracks traced across all of the individual disk surfaces for a single
    position of the heads is called a cylinder.


    # Disk Controller


    Associated with every disk is a controller, an intelligent device responsible
    for organizing data on the disk. Some disk controllers are located on a separate
    circuit board and some are embedded in the disk drive.


    # Defect List


    Disks might contain areas where data cannot be written and retrieved reliably.
    These areas are called defects. The controller uses the error-checking information
    in each disk block’s trailer to determine whether a defect is present in that
    block. When a block is found to be defective, the controller can be instructed
    to add it to a defect list and avoid using that block in the future. The last
    two cylinders are set aside for diagnostic use and for storing the disk defect
    list.


    # Disk Labels


    A special area of every disk is set aside for storing information about the disk’s
    controller, geometry, and slices. This information is called the disk’s label
    or Volume Table of Contents (VTOC). To label a disk means to write slice information
    onto the disk. You usually label a disk after defining its slices. If you fail
    to label a disk after creating slices, the slices will be unavailable because
    the operating system has no way of “knowing” about the slices.


    # Partition Table


    An important part of the disk label is the partition table that identifies a disk’s
    slices, the slice boundaries (in cylinders), and the total size of the slices.
    A disk’s partition table can be displayed by using the format utility.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Solaris File System Types


    Solaris file systems can be put into three categories: disk-based, network-based,
    and pseudo.


    # Disk-Based File Systems


    Disk-based file systems reside on the system''s local disk. The four types of
    disk file systems are


    +   - **UFS**—The UNIX file system, which is based on the BSD FAT Fast file system
    (the traditional UNIX file system). The UFS file system is the default disk-based
    file system used in Solaris.

    - **HSFS**—The High Sierra and ISO 9660 file system. The HSFS file system is used
    on CD-ROMs and is a read-only file system.

    - **PCFS**—The PC file system, which allows read/write access to data and programs
    on DOS-formatted disks written for DOS-based personal computers.

    - **SS**—The System V file system, which is seldom used. It is supported for backward
    compatibility purposes only.


    # Network-Based File Systems


    Network-based file systems are file systems accessed over the network. Typically,
    network-based file systems reside on one system and are accessed by other systems
    across the network.


    The Network File System (NFS) or remote file systems are systems made available
    from remote systems. NFS is the only available network-based file system.


    # Pseudo File Systems


    Pseudo file systems are virtual or memory-based file systems that provide access
    to special kernel information and facilities. Most pseudo file systems do not
    use file-system disk space, although a few exceptions exist. Cache File Systems,
    for example, use a file system to contain the cache. Some pseudo file systems,
    such as the temporary file system, might use the swap space on a physical disk.


    +   - **SWAPFS**—A file system or one used by the kernel for swapping.

    - **PROCFS**—The Process File System resides in memory. It contains a list of
    active processes, by process number, in the /proc directory. Information in the
    /proc directory is used by commands such as ps. Debuggers and other development
    tools can also access the address space of the processes by using file system
    calls.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '+   - **LOFS**—The Loopback File System enables you to create a new virtual
    file system. You can access files by using an alternative path name. The entire
    file system hierarchy looks as though it is duplicated under /tmp/newroot, including
    any file systems mounted from NFS servers. All files are accessible with either
    a pathname starting from / or a pathname starting from /tmp/newroot.

    - **CacheFS**—The Cache File System enables you to use disk drives on local workstations
    to store frequently used data from a remote file system or CD-ROM. The data stored
    on the local disk is the cache.

    - **TMPFS**—The temporary file system uses local memory for file system reads
    and writes. Because TMPFS uses physical memory and not the disk, access to files
    in a TMPFS file system is typically much faster than to files in a UFS file system.
    Files in the temporary file system are not permanent; they are deleted when the
    file system is unmounted and when the system is shut down or rebooted. TMPFS is
    the default file system type for the /tmp directory in the SunOS system software.
    You can copy or move files into or out of the /tmp directory just as you would
    in a UFS /tmp file system. The TMPFS file system uses swap space as a temporary
    backing store as long as adequate swap space is present.


    # Disk Slices


    Disks are divided into regions called disk slices or disk partitions. This book
    attempts to use the term slice whenever possible; however, certain interfaces,
    such as the format utility, refer to slices as partitions. A slice is composed
    of a single range of contiguous blocks. It is a physical subset of the disk (except
    for slice 2, which represents the entire disk). A UNIX file system is built within
    these disk slices. The boundaries of a disk slice are defined when a disk is formatted
    by using the Solaris format utility. Each disk slice appears to the operating
    system (and to the system administrator) as though it is a separate disk drive.


    **NOTE.** Solaris device names use the term "slice" (and the letter "s" in the
    device name) to refer to the slice number. Slices were called "partitions" in
    SunOS 4.x.


    A physical disk consists of a stack of circular platters. Data is stored on these
    platters in a cylindrical pattern. Cylinders can be grouped and isolated from
    one another. A group of cylinders is referred to as a slice. A slice is defined
    with start and end points, defined from the center of the stack of platters, which
    is called the spindle. To define a slice, the administrator provides a starting
    cylinder and an ending cylinder. A disk can have up to eight slices, named 0–7.
    See Chapter 2, "Installing the Solaris 2.x Software," for a discussion of disk
    storage systems and sizing partitions.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'When setting up slices, remember these rules:


    +   - Each disk slice holds only one file system.

    - No file system can span multiple slices.

    - After a file system is created, its size cannot be increased or decreased without
    repartitioning the entire disk and restoring all data from a backup.

    - Slices cannot span multiple disks; however, multiple swap slices on separate
    disks are allowed.


    Also follow these guidelines when planning the layout of file systems:


    +   - Distribute the workload as evenly as possible among different I/O systems
    and disk drives. Distribute /home and swap directories evenly across disks.

    - Keep projects or groups within the same file system.

    - Use as few file systems per disk as possible. On the system (or boot) disk,
    you usually have three slices: /, /usr, and a swap area. On other disks, create
    one or—at most—two slices. Fewer, roomier slices cause less file fragmentation
    than many small, overcrowded slices. Higher-capacity tape drives and the capability
    of ufsdump to handle multiple volumes facilitate backing up larger file systems.

    - It is not important for most sites to be concerned about keeping similar types
    of user files in the same file system.

    - Infrequently, you might have some users who consistently create very small or
    very large files. You might consider creating a separate file system with more
    inodes for users who consistently create very small files. See the sections on
    inodes and changing the number of bytes per inode later in this chapter.


    # Displaying Disk Configuration Information


    As described earlier, disk configuration information is stored in the disk label.
    If you know the disk and slice number, you can display information for a disk
    by using the prtvtoc (print volume table of contents) command. You can specify
    the volume by specifying any non-zero-size slice defined on the disk (for example,
    /dev/rdsk/c0t3d0s2 for all of disk 3 or /dev/rdsk/c0t3d0s5 for the sixth slice
    of disk 3). If you know the target number of the disk but do not know how it is
    divided into slices, you can show information for the entire disk by specifying
    either slice 2 or slice 0. The following steps show how you can examine information
    stored on a disk''s label by using the prtvtoc command.


    +   1. Become superuser.

    2. Type prtvtoc /dev/rdsk/cntndnsn and press Enter.'
  merge: -1
  img_proc: true
