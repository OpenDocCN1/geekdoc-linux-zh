- pgno: 187
  md: '# CHAPTER


    # 10


    # Process Control


    The following are the test objectives for this chapter:


    +   - Describe a UNIX process

    - Understand how to send a signal to a UNIX process

    - Understand how UNIX schedules processes

    - Understand how to use the UNIX batch-processing facilities


    ![](img/85737305a4c9aeecbcadd9986d604c02_187_0.png)'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Solaris is a multitasking environment in which a number of programs run at
    the same time. Each Solaris program is called a process. A process is a single
    program running in its own address space. A process under Solaris consists of
    an address space and a set of data structures in the kernel to keep track of that
    process. The address space is a section of memory that contains the code to execute
    a task. The kernel must keep track of the following data for each process on the
    system:


    +   - Address space

    - Current status of the process

    - Execution priority of the process

    - Resource usage of the process

    - Current signal mask

    - Ownership of the process


    # Viewing a Process


    A process is distinct from a job or command which may be composed of many processes
    working together to perform a specific task. Each process has a process ID associated
    with it and is referred to as a pid. You can look at processes that are currently
    executing by using the ps command. A process has certain attributes that directly
    affect execution. They are listed in Table 10–1.


    Table 10-1 Process Attributes


    | Attribute | Description |

    |---|---|

    | PID | The process identification, a unique number that defines the process within
    the kernel |

    | PPID | The parent PID (the creator of the process) |

    | UID | The user ID number of the user who owns this process |

    | EUID | The effective user ID of the process |

    | GID | The group ID of the user who owns this process |

    | EGID | The effective group ID that owns this process |

    | Priority | The priority at which this process runs |


    Use the ps command to view processes currently running on the system. Adding the
    -l option to the ps command displays a variety of other information about the
    processes currently running, including the state of each process (listed under
    S). The codes used to show the various process states are shown in Table 10–2.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Table 10-2 Process States


    | Code | Name | Description |

    |---|---|---|

    | O |  | Process is running on a processor. |

    | S | Sleeping | Process is waiting for an event to complete. |

    | R | Runnable | Process is on run queue. |

    | I | Idle | Process is being created. |

    | Z | Zombie state | Process was terminated and parent is not waiting. |

    | T | Traced | Process was stopped by a signal because parent is tracing it. |


    To see all of the processes that are running on a system, type


    ```

    ps -el

    ```


    The system responds with the following output:


    ```

    F S UID PID PPID C PRI NI ADDR SZ WCHAN TTY TIME CMD

    19 T 0 0 0 0 0 SY f627a638 0 ? 0:01 sched

    8 S 0 1 0 0 41 20 f5af4888 162 f5af4a80 ? 0:01 init

    19 S 0 2 0 0 0 SY f5af41c8 0 f028b64 ? 0:00 pageout

    19 S 0 3 0 1 0 SY f5af3b08 0 f0288a4 ? 9:57 fsflush

    8 S 0 299 1 0 65 20 f5af26c8 368 f5970ec console 0:00 ttymon

    8 S 0 101 1 0 41 20 f5af3448 340 f5d5bfae ? 0:00 in.route

    8 S 0 298 1 0 41 20 f5af2d88 350 f5982c78 ? 0:00 sac

    8 S 0 111 1 0 41 20 f5af2b08 455 f5d5bf5e ? 0:01 rpcbind

    8 S 0 164 1 0 41 20 f5d5e9e0 691 f5d5ef3 ? 0:01 syslogd

    8 S 0 138 1 0 41 20 f5d5e1d0 450 f5d5be96 ? 0:00 inetsd

    8 S 0 113 1 0 79 20 f5d5b1d0 462 f5d5bee ? 0:00 keyserv

    8 S 0 160 1 0 41 20 f5d5d450 650 f5d5bc6b ? 0:00 automoun

    8 S 0 143 1 0 74 20 f5d5c9d0 502 f5d5bee ? 0:00 statd

    8 S 0 145 1 0 77 20 f5d5c8d0 469 f5d5be1e ? 0:00 lockd

    8 S 0 242 1 0 41 20 f5d5c010 514 f5d5b8a6 ? 0:01 vold

    8 S 0 184 1 0 46 20 f5e4a898 480 f5e4aa90 ? 0:01 nscd

    8 S 0 178 1 0 51 20 f5e4a1d8 360 f5982eb ? 0:01 cron

    ```


    The man page for the ps command describes all of the fields displayed with the
    ps command as well as all of the command options. Table 10-3 lists some important
    fields.


    # Table 10-3 Process Fields


    | Field | Description |

    |---|---|

    | F | Flags associated with the process. |

    | S | The state of the process; the two most common values are S for sleeping
    and R for running. An important value to look for is X, which means the process
    is waiting for memory to become available. When you see this frequently on your
    system, you are out of memory. Refer to Table 10-2 for a complete list of the
    process states. |'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Table 10-3 Process Fields (continued)


    | Field | Description |

    |---|---|

    | UID | The user ID of the process owner. For many processes this is 0 because
    they are run setuid. |

    | PID | The process ID of each process. This value should be unique. Generally
    PIDs are allocated lowest to highest but wrap at some point. This value is necessary
    for you to send a signal, such as the kill signal, to a process. |

    | PPID | The parent process ID. This identifies the parent process that started
    the process. Using the PPID enables you to trace the sequence of process creation
    that took place. |

    | PRI | The priority of the process. Without the -c option, higher numbers mean
    lower priority. With the -c option, higher numbers mean higher priority. |

    | NI | The nice value, used in priority computation. Not printed when the -c option
    is used. The process''s nice number contributes to its scheduling priority. Making
    a process nicer means lowering its priority. |

    | ADDR | The memory address of the process. |

    | SZ | The SIZE field. This is the total number of pages in the process. Each
    page is 4,096 bytes. |

    | WCHAN | The address of an event for which the process is sleeping (if -, the
    process is running). |

    | STIME | The starting time of the process (in hours, minutes, and seconds). |

    | TTY | The terminal assigned to your process. |

    | TIME | The cumulative CPU time used by the process in minutes and seconds. |

    | CMD | The command that generated the process. |


    You often want to look at all processes, which you can do using the command ps
    -e1. A number of options available with the ps command control what information
    is printed out. A few of them are listed in Table 10-4.


    # Table 10-4 ps Command Options


    | Option | Description |

    |---|---|

    | -A | Lists information for all processes. Identical to -e. |

    | -a | Lists information about all processes most frequently requested. Processes
    not associated with a terminal will not be listed. |

    | -f | Generates a full listing. |

    | -P | Prints the number of the processor to which the process is bound, if any,
    under an additional column header PSR. This is a useful option on systems with
    multiple processors. |

    | -u <username> | Lists only process data for a particular user. In the listing,
    the numerical user ID will be printed unless you give the -f option, which prints
    the login name. |'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'For a complete list of options to the ps command, refer to the Solaris online
    manual pages.


    NOTE. The UNIX sort command is useful when you''re looking at system processes.
    Use the sort command as the pipe output to sort by size or PID. For example, to
    sort by SZ field, use the command ps -el | sort +9 (remember, sort starts numbering
    fields with zero).


    # Signals


    Solaris supports the concept of sending software signals to a process. These signals
    are ways for other processes to interact with a running process outside the context
    of the hardware. The kill command is used to send a signal to a process. System
    administrators most often use the signals SIGHUP, SIGKILL, and SIGSTOP. The SIGHUP
    signal is used by some utilities as a way to notify the process to do something.
    For example, the SIGHUP signal is sent to a process if the telephone connection
    is lost or hangs up. The SIGKILL signal is used to abort a process, and the SIGSTOP
    signal is used to pause a process. Table 10-5 describes the many signals used.


    Table 10-5 Signals Available Under Solaris


    | Signal | Number | Description |

    |---|---|---|

    | SIGHUP | 1 | Hangup; usually means the controlling terminal has been disconnected.
    |

    | SIGINT | 2 | Interrupt; user can generate this signal by pressing Ctrl-C or
    Delete. |

    | SIGQUIT | 3 | Quit process and produce a core dump. |

    | SIGILL | 4 | Illegal instruction. |

    | SIGTRAP | 5 | Trace or breakpoint trap. |

    | SIGABRT | 6 | Abort. |

    | SIGEMT | 7 | Emulation trap. |

    | SIGFPE | 8 | Arithmetic exception; informs a process of a floating point error.
    |

    | SIGKILL | 9 | Killed; forces the process to terminate. This is a sure kill.
    |

    | SIGBUS | 10 | Bus error. |

    | SIGSEGV | 11 | Segmentation fault. |

    | SIGSYS | 12 | Bad system call. |

    | SIGPIPE | 13 | Broken pipe. |

    | SIGALRM | 14 | Alarm clock. |'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Table 10-5 Signals Available Under Solaris (continued)


    | Signal | Number | Description |

    |---|---|---|

    | SIGTERM | 15 | Terminated; a gentle kill that gives processes a chance to clean
    up. |

    | SIGUSR1 | 16 | User signal 1. |

    | SIGUSR2 | 17 | User signal 2. |

    | SIGCHLD | 18 | Child status changed. |

    | SIGPWR | 19 | Power fail or restart. |

    | SIGWINCH | 20 | Window size change. |

    | SIGURG | 21 | Urgent socket condition. |

    | SIGPOLL | 22 | Pollable event. |

    | SIGSTOP | 23 | Stopped (signal); pauses a process. |

    | SIGTSTP | 24 | Stopped (user). |

    | SIGCONT | 25 | Continued. |

    | SIGTTIN | 26 | Stopped (tty input). |

    | SIGTTOU | 27 | Stopped (tty output). |

    | SIGVTALRM | 28 | Virtual timer expired. |

    | SIGPROF | 29 | Profiling timer expired. |

    | SIGXCPU | 30 | CPU time limit exceeded. |

    | SIGXFSZ | 31 | File size limit exceeded. |

    | SIGWAITING | 32 | Concurrency signal reserved by threads library. |

    | SIGLWP | 33 | Inter-LWP signal reserved by threads library. |

    | SIGFREEZE | 34 | Checkpoint freeze. |

    | SIGTHAW | 35 | Checkpoint thaw. |

    | SIGCANCEL | 36 | Cancellation signal reserved by threads library. |


    In addition, you can write a signal handler in the program to respond to a signal
    being sent. For example, many system administration utilities, such as the name
    server, respond to the SIGHUP signal by re-reading their configuration files.
    This signal can then be used to update the process while running, without having
    to terminate and restart the process. For many signals, however, nothing can be
    done other than printing an appropriate error message and terminating the process.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'The kill command sends a terminate signal (signal 15) to the process and the
    process is terminated. Signal 15, which is the default when no options are used
    with the kill command, is a gentle kill that allows a process to perform cleanup
    work before terminating. Signal 9, on the other hand, is called a sure, unconditional
    kill because it cannot be caught or ignored by a process. If the process is still
    around after a kill -9, it is either hung up in the UNIX kernel waiting for an
    event such as disk I/O to complete, or you are not the owner of the process. The
    kill command is routinely used to send signals to a process. You can kill any
    process you own, and superuser can kill all processes in the system except those
    with process IDs 0, 1, 2, 3, and 4. The kill command is poorly named because not
    every signal sent by it is used to kill a process. The command gets its name from
    its most common use—terminating a process with the kill -15 signal.


    A common problem occurs when a process continually starts up new copies of itself—
    referred to as forking or spawning. Users have a limit on the number of new processes
    they can fork. This limit is set in the kernel with the MAXUP (maximum number
    of user processes) value. Sometimes, through user error, a process keeps forking
    new copies of itself until the user hits the MAXUP limit. As a user reaches the
    MAXUP limit, the system appears to be waiting. If you kill some of the user''s
    processes, the system resumes creating new processes on behalf of the user. It
    can be a no-win situation. The best way to handle these run-away processes is
    to send the STOP signal to suspend all processes and then send a KILL signal to
    terminate the processes. Because the processes were first suspended, they can''t
    create new processes as you kill them off.


    You can send a signal to a process you own with the kill command. Many signals
    are available but you only need to worry about two right now—9 and 15. To send
    a signal to a process, first use the ps command to find the process ID (PID) number.
    For example, type ps -ef to list all processes and find the process you wish to
    terminate.


    | UID | PID | PPID | C | STIME | TTY | TIME | CMD |

    |---|---|---|---|---|---|---|---|

    | root | 0 | 0 | 0 | Nov 27 | ? | 0:01 | sched |

    | root | 1 | 0 | 0 | Nov 27 | ? | 0:01 | /etc/init - |

    | root | 2 | 0 | 0 | Nov 27 | ? | 0:00 | pageout |

    | root | 3 | 0 | 0 | Nov 27 | ? | 12:52 | fslush |

    | root | 101 | 1 | 0 | Nov 27 | ? | 0:00 | /usr/sbin/in.routed -q |

    | root | 298 | 1 | 0 | Nov 27 | ? | 0:00 | /usr/lib/saf/sac -t 300 |

    | root | 111 | 1 | 0 | Nov 27 | ? | 0:02 | /usr/sbin/rpcbind |

    | root | 164 | 1 | 0 | Nov 27 | ? | 0:01 | /usr/sbin/syslogd -n -z 12 |

    | root | 138 | 1 | 0 | Nov 27 | ? | 0:00 | /usr/sbin/inetd -s |

    | root | 113 | 1 | 0 | Nov 27 | ? | 0:00 | /usr/sbin/keyserv |

    | root | 160 | 1 | 0 | Nov 27 | ? | 0:01 | /usr/lib/autofs/automountd |

    | . | . | . | . | . | . | . | . |

    | root | 439 | 424 | 0 | Nov 27 | ? | 0:00 | /bin/cat /tmp/.removable/notify0
    |

    | root | 5497 | 433 | 1 | 09:58:02 | pts/4 | 0:00 | script ps ef |


    To kill the process with a PID number of 5497, type


    ```

    kill -15 5497

    ```'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Scheduling Processes


    Processes compete for execution time. Scheduling, one of the key elements on a
    time-sharing system, decides which of the processes will execute next. Although
    hundreds of processes might be present on the system, only one actually uses the
    CPU at any given time. Time-sharing on a CPU involves suspending a process and
    then restarting it at some later time. Because the suspension and resumption of
    active processes occurs several times each second, it appears to the user that
    the system is performing many tasks simultaneously.


    UNIX attempts to manage the priorities of processes by giving a higher priority
    to those that have used the least amount of the CPU. In addition, users who are
    sleeping on an event, such as a keyboard press, get higher priority than processes
    that are purely CPU driven. On any large system with a number of competing user
    groups, the task of managing resources falls on the system administrator. This
    task is both technical and political. As a system administrator, you must understand
    your company goals in order to manage this task.


    When you understand the political implications about who should get priority,
    you are ready to manage the technical details. As root, you can change the priority
    of any process on the system by using the nice or priocnt1 commands. Before you
    do this, you must understand how priorities work.


    # Scheduling Priorities


    All processes have an execution priority assigned to them—an integer value that
    is dynamically computed and updated on the basis of several different factors.
    Whenever the CPU is free, the scheduler selects the most favored process to resume
    executing. The process selected is the process with the lowest priority number,
    because lower numbers are defined as more favored than higher ones. Multiple processes
    at the same priority level are placed into the run queue for that priority level.
    Whenever the CPU is free, the scheduler starts the processes at the head of the
    lowest-numbered non-empty run queue. When the process at the top of a run queue
    stops executing, it goes to the end of the line and the next process moves up
    to the front. After a process begins to run, it continues to execute until it
    needs to wait for an I/O operation to complete, receives an interrupt signal,
    or exhausts the maximum execution time-slice defined on that system. A typical
    time-slice is 10 milliseconds.


    UNIX processes have two priority numbers associated with them. One of the priority
    numbers is its requested execution priority with respect to other processes. This
    value (its nice number) is set by the process''s owner and by root; it appears
    in the NI column in a ps -l listing. The other priority assigned to a process
    is the execution priority. This priority is computed and dynamically updated by
    the operating system, taking into account such factors as the process''s nice
    number, how much CPU time it has had recently, and what other processes are running
    and their priorities. The execution priority value appears in the PRI column on
    a ps -l listing.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Although the CPU is the most watched resource on a system, it is not the only
    one. Memory use, disk use, IO activity, and number of processes all tie together
    in determining throughput of the computer. For example, consider that you have
    two groups, A and B. Both groups require large amounts of memory—more than is
    available when both are running simultaneously. Raising the priority of Group
    A over Group B might not help if Group B does not fully relinquish the memory
    it is using. Although the paging system will do this over time, the process of
    swapping a process out to disk can be intensive and can greatly reduce performance.
    A better alternative might be to completely stop Group B with a signal and then
    continue it later when Group A has finished.


    # Changing the Priority of a Time-Sharing Process with nice


    The nice command is supported only for backward compatibility to previous Solaris
    releases. The priocntl command provides more flexibility in managing processes.
    The priority of a process is determined by the policies of its scheduling class
    and by its nice number. Each time-sharing process has a global priority that is
    calculated by adding the user-supplied priority, which can be influenced by the
    nice or priocntl commands and the system-calculated priority.


    The execution priority number of a process is assigned by the operating system
    and is determined by several factors, including its schedule class, how much CPU
    time it has used, and its nice number. Each time-sharing process starts with a
    default nice number, which it inherits from its parent process. The nice number
    is shown in the NI column of the ps report.


    A user can lower the priority of a process by increasing its user-supplied priority
    number. Only the superuser can increase the priority of a process by lowering
    its nice value. This prevents users from increasing the priorities of their own
    processes, thereby monopolizing a greater share of the CPU.


    In UNIX, nice numbers range from 0 to +19. The highest priority is 0. Two versions
    of the command are available—the standard version, /usr/bin/nice, and a version
    that is part of the C shell. Use the nice command as described in Table 10–6 when
    submitting a program or command.


    **Table 10-6 Setting Priorities with nice**


    *Lowering the priority of a process*


    | Command | Description |

    |---|---|

    | nice command_name | Increases the nice number by four units (the default). |

    | nice +4 command_name | Increases the nice number by four units. |

    | nice +10 command_name | Increases the nice number by 10 units. |


    *Increasing the priority on a process*


    | Command | Description |

    |---|---|

    | nice -10 command_name | Raises the priority of the command by lowering the nice
    number. |

    | nice - -10 command_name | Raises the priority of the command by lowering the
    nice number. The two minus signs are required. The first minus sign is the option
    sign and the second minus sign indicates a negative number. |'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'As system administrator, you can use the renice command to change the priority
    of a process after it has been submitted. The renice command has the following
    form:


    ```

    renice priority -n <value> -p <pid>

    ```


    Use the ps -el command to find the PID of the process for which you want to change
    the priority. The process you want to change in the following example is named
    "largejob":


    ```

    F S UID PID PPID C PRI NI ADDR SZ WCHAN TTY TIME CMD

    9 S 0 8200 4100 0 84 20 f0274e38 193 ? 0:00 largejob

    ```


    Issue the following command to increase the priority of PID 8200:


    ```

    renice -n -4 -p 8200

    ```


    Issuing the ps -el command again shows the process with a higher priority:


    ```

    F S UID PID PPID C PRI NI ADDR SZ WCHAN TTY TIME CMD

    9 S 0 8200 4100 0 60 12 f0274e38 193 ? 0:00 largejob

    ```


    # Changing the Scheduling Priority of Processes with priocntl


    The standard priority scheme has been improved under Solaris as part of its support
    for real-time processes. Real-time processes are designed to work in applications
    areas in which nearly immediate response to events is required. These processes
    are given nearly complete access to all system resources when they are running.
    Solaris uses time-sharing priority numbers ranging from -20 to 20. Solaris uses
    the priocntl command, intended as an improvement over the nice command, to modify
    process priorities. To use priocntl to change a priority on a process, type


    ```

    priocntl -s -p <new-priority> -i pid <process-id>

    ```


    where new-priority is the new priority for the process and process-id is the PID
    of the process you wish to change. The following example sets the priority level
    for process 8200 to -5:


    ```

    priocntl -s -p -5 -i pid 8200

    ```


    The following example is used to set the priority (nice value) for every process
    created by a given parent process:


    ```

    priocntl -s -p -5 -I ppid 8200

    ```


    As a result of this command, all processes forked from process 8200 will have
    a priority of -5.


    Consult the online manual pages for more information about the priocntl command.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Solaris Batch-Processing Facility


    A way to divide processes on a busy system is to schedule jobs so they run at
    different times. A large job, for example, could be scheduled to run at 2 a.m.
    when the system would normally be idle. Solaris supports two methods of batch-processing—the
    crontab and at commands. The crontab command schedules multiple system events
    at regular intervals, and the at command schedules a single system event.


    # crontab


    The cron daemon schedules system events according to commands found within each
    crontab file. A crontab file consists of commands, one per line, that will be
    executed at regular intervals. The beginning of each line contains five date and
    time fields that tell the cron daemon when to execute the command. The sixth field
    is the full pathname of the program you wish to run. These fields, described in
    Table 10–7, are separated by spaces.


    Table 10-7 crontab File


    | Field | Description | Values |

    |---|---|---|

    | 1 | Minute | 0-59 An * in this field means every minute. |

    | 2 | Hour | 0-23 An * in this field means every hour. |

    | 3 | Day of month | 1-31 An * in this field means every day of the month. |

    | 4 | Month | 1-12 An * in this field means every month. |

    | 5 | Day of week | 0-6 (0=Sunday) An * in this field means every day of the week.
    |

    | 6 | Command |  |


    Follow these guidelines when making entries in the crontab:


    +   - Use a space to separate fields.

    - Use a comma to separate multiple values in the time fields.

    - Use a hyphen to designate a range of values in the time field.

    - Use an asterisk as a wildcard to include all possible values in the time field.
    For example, an asterisk (*) can be used in the time field to mean all legal values.

    - Use a comment mark (#) at the beginning of a line to indicate a comment or a
    blank line.

    - Each command within a crontab file must consist of one line, even if it is very
    long, because crontab does not recognize extra carriage returns.'
  merge: -1
  img_proc: true
- pgno: 198
  md: "The following sample crontab command entry displays a reminder in the user's\
    \ console window at 5 p.m. on the 1st and 15th of every month.\n\n```\n0 17 1,15\
    \ * * echo Handing Timesheet > /dev/console\n```\n\ncrontab files are found in\
    \ the /var/spool/cron/crontabs directory. Several crontab files besides root are\
    \ provided during SunOS software installation and are also located in this directory.\
    \ Other crontab files are named after the user accounts in which they are created,\
    \ such as bill, glenda, miguel, or nicole. They are also located in the /var/spool/cron/crontabs\
    \ directory. For example, a crontab file named root is supplied during software\
    \ installation. Its contents include these command lines:\n\n```\n10 3 * * 0,4\
    \ /etc/cron.d/logchecker\n10 3 * * 0 /usr/lib/newsyslog\n15 3 * * /usr/lib/fs/nfs/nfssfind\n\
    1 2 * * * [ -x /usr/sbin/rtc ] && /usr/sbin/rtc -c > /dev/null 2>&1\n```\n\nThe\
    \ first command line instructs the system to run logchecker at 3:10 on Sunday\
    \ and Thursday nights. The second command line schedules the system to run newsyslog\
    \ at 3:10 every Sunday morning. The third command line orders the system to execute\
    \ nfssfind daily at 3:15 in the morning. The fourth command line instructs the\
    \ system to check for daylight savings time and makes corrections if necessary.\
    \ If there is no RTC time zone or no /etc/rtc_config file, this entry will do\
    \ nothing.\n\nThe cron daemon handles the automatic scheduling of crontab commands.\
    \ Its function is to check the /var/spool/cron/crontab directory every 15 minutes\
    \ for the presence of crontab files. It checks for new crontab files or changes\
    \ to existing ones, reads the execution times listed within the files, and submits\
    \ the commands for execution at the proper times.\n\n# How to Create or Edit a\
    \ crontab File\n\nCreating an entry in the crontab file is as easy as editing\
    \ a text file using your favorite editor. The procedure is as follows:\n\n+  \
    \ 1. (Optional) To create or edit a crontab file belonging to root or another\
    \ user, become superuser.\n2. Create a new crontab file, or edit an existing one,\
    \ by typing\n   `crontab -e`\n3. Add command lines to the file, following the\
    \ syntax described in Table 10-7.\n4. Save the changes and exit the file. The\
    \ crontab file is placed in /var/spool/cron/crontabs.\n5. Verify the crontab file\
    \ by typing\n   `crontab -l`\n\nThe system responds by listing the contents of\
    \ the crontab file."
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Controlling Access to crontab


    You can control access to crontab by modifying two files in the /etc/cron.d directory:
    cron.deny and cron.allow. These files permit only specified users to perform crontab
    tasks such as creating, editing, displaying, or removing their own crontab files.
    The cron.deny and cron.allow files consist of a list of usernames, one per line.
    These access control files work together in the following manner:


    +   - If cron.allow exists, only the users listed in this file can create, edit,
    display, or remove crontab files.

    - If cron.allow doesn’t exist, all users may submit crontab files, except for
    users listed in cron.deny.

    - If neither cron.allow nor cron.deny exists, superuser privileges are required
    to run crontab.


    Superuser privileges are required to edit or create cron.deny and cron.allow.


    During Solaris software installation, a default /etc/cron.d/cron.deny file is
    provided and contains the following entries:


    +   - daemon

    - bin

    - smtp

    - nuucp

    - listen

    - nobody

    - noaccess


    None of the users listed in the cron.deny file can access crontab commands. The
    system administrator can edit this file to add other users who will be denied
    access to the crontab command. No default cron.allow file is supplied. This means
    that, after Solaris software installation, all users (except the ones listed in
    the default cron.deny file) can access crontab. If you create a cron.allow file,
    only these users can access crontab commands.


    # Scheduling a Single System Event (at)


    The at command is used to schedule jobs for execution at a later time. Unlike
    crontab, which schedules a job to happen at regular intervals, a job submitted
    with at will execute once, at the designated time.


    To submit an at job, type at. Then specify an execution time and a program to
    run, as shown in the following example:


    ```

    at 07:45am today

    at> who > /tmp/log

    at> <Press Control-d>

    job 912687240.a at Thu Dec 3 07:14:00 1998

    ```'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'When you submit an at job, it is assigned a job identification number, which
    becomes its filename along with the .a extension. The file is stored in the /var/spool/cron/atjobs
    directory. In much the same way as it schedules crontab jobs, the cron daemon
    controls the scheduling of at files.


    The at command syntax is listed in Table 10-8.


    # Table 10-8 at Command Syntax


    |  |  |

    |---|---|

    | at -m <time> <date> |  |

    | -m | Sends you mail after the job is completed. |

    | time | The hour when you want to schedule the job. Add am or pm if you do not
    specify the hours according to a 24-hour clock. "Midnight," "noon," and "now"
    are acceptable keywords. Minutes are optional. |

    | date | The first three or more letters of a month, a day of the week, or the
    keywords "today" or "tomorrow." |


    You can set up a file to control access to the at command, permitting only specified
    users to create, remove, or display queue information about their at jobs. The
    file that controls access to at is /etc/cron.d/at.deny and consists of a list
    of user names, one per line. The users listed in this file cannot access at commands.
    The at.deny file, created during SunOS software installation, contains the following
    usernames:


    +   - daemon

    - bin

    - smtp

    - nuucp

    - listen

    - nobody

    - noaccess


    With superuser privileges, you can edit this file to add other user names whose
    at access you want to restrict.


    To check your jobs that are waiting in the at queue, use the atq command. This
    command displays status information about the at jobs you created. Use the atq
    command to verify that you have created an at job. The atq command confirms that
    at jobs have been submitted to the queue, as shown in the following example:


    ```

    atq

    Rank Execution Date Owner Job Queue Job Name

    1st Dec 3, 1998 08:00 root 912690000.a a stdin

    2nd Dec 3, 1998 08:05 root 912690300.a a stdin

    ```'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Another way to check an at job is by issuing the at -l command. This command
    shows the status information on all jobs submitted by a user, as shown in this
    example:


    ```

    at -l

    user = root  912690000.a  Thu Dec  3 08:00:00 1998

    user = root  912690300.a  Thu Dec  3 08:05:00 1998

    ```


    To remove the at job from the queue before it is executed, type


    ```

    at -r [job-id]

    ```


    where job-id is the identification number of the job you want to remove.


    Verify that the at job is removed by using the at -l (or the atq) command to display
    the jobs remaining in the at queue. The job whose identification number you specified
    should not appear. In the following example, we''ll remove an at job that was
    scheduled to execute at 08:00 a.m. on December 3. First, check the at queue to
    locate the job identification number.


    ```

    at -l

    user = root  912690000.a  Thu Dec  3 08:00:00 1998

    user = root  912690300.a  Thu Dec  3 08:05:00 1998

    ```


    Next, remove the job from the at queue:


    ```

    at -r 912690000.a

    ```


    Finally, verify that this job has been removed from the queue.


    ```

    at -l

    user = root  912690300.a  Thu Dec  3 08:05:00 1998

    ```


    In summary, the system administrator needs to be aware of the processes that belong
    to each application. As users report problems, the system administrator can quickly
    locate the processes being used and look for irregularities. By keeping a close
    watch on system processes, you''ll become familiar with what is normal and what
    is abnormal. Don''t wait for problems to happen—watch system processes daily.
    Create shell scripts to watch processes for you. By taking a proactive approach
    to system administration, you''ll find problems before they affect the users.
    In Chapter 11, “Backup and Recovery,” we''ll move on from system setup and processes
    to take a look at the system administrator''s most important preventive maintenance
    task, system backups.'
  merge: -1
  img_proc: true
