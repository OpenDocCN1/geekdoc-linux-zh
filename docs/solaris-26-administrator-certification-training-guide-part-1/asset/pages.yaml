    # Restoring Files with Copy-In Mode


    Use the copy-in mode of cpio to restore files from tape to disk. The following
    examples describe methods used to restore files from a cpio archive.


    This first example restores all files and directories from tape to disk. The cpio
    options specified will restore files unconditionally (-u) to the /users directory
    and will retain previous file modification times (-m):


    ```

    ```

    cd /users

    cpio -icvumB < /dev/rmt/1

    ```

    ```


    The next example selectively restores files that begin with database. The -d option
    will create directories as needed.


    ```

    ```

    cpio -icvdmB ''database*'' < /dev/rmt/1

    ```

    ```


    NOTE. Single quotes must be used to pass the wild card argument (*) on to cpio.


    # Pass-Mode


    Pass-mode generally is not used for backups. The destination must be a directory
    on a mounted file system, which means pass-mode cannot be used to transfer files
    to tape. However, you can use pass-mode within cpio to copy files from one directory
    to another. The advantage of using cpio over cp is that original modification
    times and ownership are preserved. Specify pass-mode by using the -p option in
    cpio. The following example copies all files from /users to /bkup.'
