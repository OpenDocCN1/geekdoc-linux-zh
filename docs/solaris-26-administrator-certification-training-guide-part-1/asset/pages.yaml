- pgno: 136
  md: 'The Solaris Common Desktop Environment (CDE) is an easy-to-use interface that
    provides a consistent look and feel across UNIX environments. SunSoft, Inc., Hewlett-Packard
    Company, IBM Corporation, and Novell, Inc. each contributed "best-of-breed" technologies
    to establish the new standard for user and application interfaces based on the
    X Window System and MOTIF. While maintaining compliance with the CDE standards,
    Solaris CDE offers additional benefits to its users and developers. For example,
    you can use an image viewer to display, rotate, zoom, and convert images and PostScript
    files.


    If you have used Sun''s older windowing environment, OpenWindows, you have seen
    the familiar backdrops, color palettes, and pop-up Workspace menu. In CDE, a user
    can also run OpenWindows applications without modification. For instance, CDE
    supports drag-and-drop interaction between OpenWindows applications and CDE applications.


    The key features available to you within CDE are CDE environment, desktop tools,
    and the CDE Development Environment. This chapter discusses customization of the
    CDE environment, which consists of


    +   - **Login Manager**—A graphical login window that comes up after the system
    is booted

    - **Session Manager**—A service that starts users'' applications on the desktop
    at login and "remembers" the desktop state the next time they log in

    - **Front Panel**—The set of pop-ups and icons that appear at the bottom of the
    CDE screen

    - **Resetting User Customizations**—Setting the CDE back to its default environment

    - **Actions and Data Types**—Associating commands with icons

    - **Application Manager**—The desktop container displaying applications available
    to the user

    - `dtksh shell`—ksh11 scripting within the desktop


    # The Login Manager


    The Login Manager is a server responsible for displaying a login screen, authenticating
    users, and starting a user''s session. Displays managed by the login server can
    be directly attached to the login server or attached to an X terminal or workstation
    on the network.


    The login screen, displayed by the login server, is an attractive alternative
    to the traditional character-mode login screen and provides capabilities beyond
    those provided by a character-mode login. As with a character-mode login, however,
    the user enters a username, followed by a password. If the user is authenticated,
    the login server starts a desktop session for the user. When the user exits the
    desktop session, the login server displays a new login screen, and the process
    begins again.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'You can customize the login screen in the following ways:


    +   - Change the login screen appearance

    - Configure X server authority

    - Change the default language

    - Issue commands prior to display of the login screen

    - Change the contents of the login screen Language menu

    - Specify the command to start the user''s session

    - Issue commands prior to the start of the user''s desktop session

    - Issue commands after the user''s session ends


    Each of these customizations can be done for all displays or on a per-display
    basis. Refer to the Solaris CDE Advanced User''s and System Administrator''s Guide
    for detailed instructions on making these modifications.


    # Starting the Login Server


    The login server usually starts up the CDE environment when the system is booted.
    It can also be started from a command line. For example, to start the login server
    from a command line, type the following:


    ```

    /usr/dt/bin/dtlogin -daemon; exit

    ```


    > NOTE. Although you can start the login server from the command line for temporary
    configuration testing, you normally set up the login server to start when the
    system is booted.


    To set the login server CDE to start the next time the system is booted, type
    the following:


    ```

    /usr/dt/bin/dtconfig -e

    ```


    The login server will then start automatically after the user reboots the system.


    # Stopping the Login Server


    To disable login server CDE startup the next time the system is booted, type the
    following:


    ```

    /usr/dt/bin/dtconfig -d

    ```'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'This command tells the system not to start the login server on the next reboot.


    You can stop the login server immediately by killing its process ID. Type the
    command `/usr/dt/bin/dtconfig -kill`


    This command issues the command `kill login_server_process_ID`.


    **NOTE.** *If the user is logged in to the desktop at the time you kill the login
    server, the desktop session immediately terminates.*


    # Displaying a Login Screen on a Local Display


    On startup, the login server checks the Xservers file to determine whether an
    Xserver needs to be started and to determine whether and how login screens should
    be displayed on local or network displays. The format of a line in the Xservers
    file is:


    ```

    display_name display_class display_type X_server_command

    ```


    Each field in the Xservers file is described in Table 7-1.


    ### Table 7-1 Fields in the Xservers File


    | Field | Description |

    |---|---|

    | display_name | Tells the login server the name to use when connecting to the
    Xserver (:0 in the following example). A value of * (asterisk) is expanded to
    hostname:0. The number specified must match the number specified in the X_server_command
    connection number. |

    | display_class | Identifies resources specific to this display (Local in the
    following example). |

    | display_type | Tells the login server whether the display is local or network
    and how to manage the Command Line Login option on the login screen (local@console
    in the following example). |

    | x_server_command | Identifies the command line, connection number, and other
    options that the login server will use to start the Xserver (/usr/bin/X11/X :0
    in the following example). The connection number specified must match the number
    specified in the display_name field. |


    The default line in the Xservers file is similar to


    ```

    :0 Local local@console /usr/bin/X11/X :0

    ```


    To modify Xservers, copy Xservers from `/usr/dt/config` to `/etc/dt/config`. The
    `/etc/dt` directory contains customized workstation-specific configuration files.
    If `/etc/dt` does not exist, you might need to create it. The system administrator
    can modify the system default resources by creating the `/etc/dt/config/` directory.
    In this directory, you can create configuration files to override default resources
    or to specify additional resources for all desktop users. This file is merged
    into the desktop default resources during session startup.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Resources specified in this file take precedence over those specified in the
    desktop default resource file. After modifying /etc/dt/config/Xservers, tell the
    login server to reread Xservers by typing


    ```

    /usr/dt/bin/dtconfig -reset

    ```


    The dtconfig -reset issues the command kill -HUP login_server_process_ID.


    If your login server system has a character display and not a bitmap display,
    you need to set `display_terminal_device` to none in the Xservers file to disable
    the login screen and enable the character-mode login screen.


    # The Session Manager


    A session is the collection of applications, settings, and resources present on
    the user''s desktop. Session management is a set of conventions and protocols
    that enable Session Manager to save and restore a user''s session. When a user
    logs in to the desktop for the first time, a default initial session is loaded.
    Afterward, a user is able to log in to the system and be presented with the same
    set of running applications, settings, and resources as were present when she
    last logged out.


    Session Manager is responsible for starting the desktop and automatically saving
    and restoring running applications, colors, fonts, mouse behavior, audio volume,
    and keyboard click. Using Session Manager, you can


    +   - Customize the initial session for all desktop users

    - Customize the environment and resources for all desktop users

    - Change the session startup message

    - Change parameters for session startup tools and daemons

    - Customize desktop color usage for all users


    Session Manager is started through `/usr/dt/bin/Xsession`. When the user logs
    in, using Login Manager, Xsession is started by default. When Session Manager
    is started, it goes through the following steps to start the user''s session:


    +   1. Sources the HomeDirectory/.dtprofile script.

    2. Sources the Xsession.d scripts.

    3. Displays a welcome message.

    4. Sets up desktop search paths.

    5. Gathers available applications.

    6. Optionally sources HomeDirectory/.profile or HomeDirectory/.login.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '+   7. Starts the ToolTalk messaging daemon.

    8. Loads session resources.

    9. Starts the color server.

    10. Starts Workspace Manager.

    11. Starts the session applications.


    # Sourcing the .dtprofile Script


    At session startup, the xsession script sources the user''s HomeDirectory/.dtprofile
    script---a /bin/sh or /bin/ksh script that enables users to set up environment
    variables for their sessions. The .dtprofile accepts only sh or ksh syntax. The
    desktop default is /usr/dt/config/sys.dtprofile. If the HomeDirectory/.dtprofile
    script does not exist (for example, when a user is logging in for the first time),
    xsession copies the desktop default sys.dtprofile to HomeDirectory/.dtprofile.


    You can customize the sys.dtprofile script by copying it from /usr/dt/config to
    /etc/dt/config and editing the new file. You can set up personal environment variables
    in HomeDirectory/.dtprofile. For example,


    ```

    export MYVARIABLE="value"

    ```


    sets the variable MYVARIABLE in the user''s environment at the next login.


    To set system-wide environment variables, create a file in the /etc/dt/config/Xsession.d
    directory that sets and exports the variable. For example, if you create an executable
    ksh script, /etc/dt/config/Xsession.d/sitevars, containing


    ```

    export SITEVARIABLE="value"

    ```


    the variable SITEVARIABLE will be set in each user''s environment at the next
    login.


    > NOTE. Although Session Manager does not automatically read the .profile or .login
    files, it can be configured to use these files. To tell xsession to source the
    .profile or .login script, set the variable DTSOURCEPROFILE to True in HomeDirectory/.dtprofile.


    # Sourcing the Xsession.d Scripts


    After sourcing the HomeDirectory/.dtprofile script, the xsession script sources
    the xsession.d scripts. These scripts set up additional environment variables
    and start optional daemons for the user''s session.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '**CAUTION!** Errors in any of the session startup files could prevent a user
    from logging in. To troubleshoot session startup problems, check the file HomeDirectory/.dt/startlog.
    Session Manager logs each user''s session startup progress in this file.


    # The Welcome Message


    After sourcing HomeDirectory/.dtprofile and the Xsession.d scripts, Xsession displays
    a welcome message that covers the screen. You can customize the welcome message
    or turn off the message entirely.


    The dtHello client is used to display the welcome message. To alter the message
    text, change the dtHello options by modifying the dtstart_hello[] variable. To
    change dtstart_hello[], create a /usr/dt/config/Xsession.d script that sets the
    new value. For example, to display the message of the day for all users, create
    an executable sh or ksh script called /usr/dt/config/Xsession.d/myvars and set
    dtstart_hello[] as follows:


    ```

    dtstart_hello[]="/usr/dt/bin/dthello -file /etc/motd &"

    ```


    Users can also change the welcome message for their sessions by setting dtstart_hello[]
    in HomeDirectory/.dtprofile. To turn off the welcome message, set dtstart_hello[]="
    ".


    # Setting Desktop Search Paths


    The desktop uses search paths, created at login, to locate applications and their
    associated desktop files. The desktop provides four search paths, described in
    Table 7-2.


    # Table 7-2 Desktop Search Paths


    | Search Path | Description |

    |---|---|

    | Applications | Used to locate applications. Application Manager uses the application
    search path to dynamically populate its top level when a user logs in. |

    | Database | Used to specify additional locations for action- and data-type definition
    files (*.dt files) and Front Panel files (*.fp files). |

    | Icons | Used to specify additional locations for icons. |

    | Help data | Used to specify additional locations for desktop help data. |'
  merge: -1
  img_proc: true
- pgno: 142
  md: "# Making Modifications to a Search Path\n\nTo make modifications to the search\
    \ path for a particular user, follow these steps:\n\n+   1. Open HomeDirectory/.dtprofile\
    \ for editing.\n2. Add or edit a line that defines and exports the personal input\
    \ variable.\n   For example, the following line adds a location to the user's\
    \ personal application search path:\n   `export DTSUSERAPPPATHS=:/projects1/editors`\n\
    3. To make the change take effect, log out and then log back in.\n\n# Gathering\
    \ Available Applications\n\nAfter setting up the desktop search paths, the next\
    \ step is to gather available applications by using dtappgather. These are the\
    \ applications that will be displayed in the Application Manager window. The dtappgather\
    \ utility gathers application files for presentation by the Application Manager\
    \ and is responsible for creating and refreshing the user's Application Manager\
    \ subdirectory.\n\nTo alter the command-line options of dtappgather, modify the\
    \ dtstart_appgather variable either in the /etc/dt/config/Xsession.d/sitevars\
    \ file for all users or in the HomeDirectory/.dtprofile for individual users.\
    \ Set dtstart_appgather as follows:\n\n```\ndtstart_appgather=\"/usr/dt/bin/dtappgather\
    \ &\"\n```\n\n# Sourcing a User .profile or .login File\n\nXsession is able to\
    \ source a user's traditional $HOME/.profile or $HOME/.login scripts but by default\
    \ this capability is disabled. To tell Xsession to source the .profile or .login\
    \ script, set DTSOURCEPROFILE to true in $HOME/.dtprofile.\n\n# Starting the ToolTalk\
    \ Messaging Daemon\n\nThe next task for Xsession is to start the ToolTalk messaging\
    \ daemon. The ToolTalk service enables independent applications to communicate\
    \ without having direct knowledge of each other. Applications create and send\
    \ ToolTalk messages to communicate with each other. The ToolTalk service receives\
    \ these messages, determines the recipients, and then delivers the messages to\
    \ the appropriate applications. Users can change the tt session options for their\
    \ own sessions by setting the dtstart_ttsession variable in $HOME/.dtprofile as\
    \ follows:\n\n```\ndtstart_ttsession=\"/usr/dt/bin/ttsession -s\"\n```"
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Loading Session Resources


    Resources are used by applications to set certain aspects of appearance and behavior.
    For example, Style Manager (dtstyle) provides resources that enable you to specify
    where the system looks for files containing information about color palettes:


    ```

    dtstyle*paletteDirectories: /usr/dt/palettes/C \ HomeDirectory/.dt/palettes

    ```


    Resources are loaded at session startup by Session Manager. The desktop default
    resources can be found in /usr/dt/config/language/sys.resources. These resources
    are made available to each user''s session via the RESOURCE_MANAGER property.
    This file should not be edited, as it is overwritten on subsequent desktop installations.
    The system administrator can modify the system default resources by creating /etc/dt/config/language/sys.resources.
    In this file, you can override default resources or specify additional resources
    for all desktop users.


    Users can modify the desktop default and system-wide resources through their HOME/.Xdefaults
    file. Resources specified in this file take precedence over those specified in
    the desktop default or system administrator resource files.


    # Starting the Color Server


    You can choose a wide range of colors for your display either by using Style Manager
    (as shown in Figure 7-1) or by customizing color resources used by Style Manager
    to control desktop color usage.


    Figure 7-1

    The Style Manager.


    ![](img/85737305a4c9aeecbcadd9986d604c02_143_0.png)


    Set color server resources for all users by creating /etc/dt/config/language/sys.resources
    and specifying the color server resources in that file. Users can similarly set
    color server resources for their own sessions by specifying color server resources
    in $HOME/.Xdefaults.


    # Starting the Workspace Manager


    Session Manager is responsible for starting Workspace Manager. By default, /usr/dt/bin/dtwm
    is started. The Workspace Manager is the window manager provided by the desktop,
    which controls'
  merge: -1
  img_proc: true
- pgno: 144
  md: '+   - The appearance of window frame components

    - The behavior of windows, including their stacking order and focus behavior

    - Key bindings and button bindings

    - The appearance of minimized windows

    - Workspace and Window menus


    In addition, the Workspace Manager controls the desktop components outlined in
    Table 7–3.


    Table 7–3 Desktop Components


    |  |  |

    |---|---|

    | Workspaces | The Workspace Manager controls the number of workspaces and keeps
    track of which windows are open in each workspace. |

    | Workspace backdrops | The user can change the backdrop image by using Style
    Manager. Backdrop management, however, is a function of the Workspace Manager.
    |

    | The Front Panel | Although the Front Panel uses its own configuration files,
    it is created and managed by the Workspace Manager. |


    Additional modifications that can be made to the workspace manager include changing
    the number of workspaces and providing system-wide workspace names.


    # Changing the Number of Workspaces on a System-Wide Basis


    The default desktop configuration provides four workspaces. The user can add and
    delete workspaces by using the pop-up menu associated with the workspace switch.


    In the /usr/dt/app-defaults/C/Dtwm file, the workspaceCount resource is set to
    the following default number of workspaces:


    ```

    Dtwm*0*workspaceCount: 4

    Dtwm*workspaceCount: 1

    ```


    Multiple workspaces are specified on screen 0; a single workspace is specified
    on any other screen. You can create (or modify if it exists) the /etc/dt/config/C/sys.resources
    file to change the default number of workspaces for all new users on a workstation.


    Use the 0*workspaceCount resource to set the system-wide default on the primary
    screen:


    ```

    Dtwm*0*workspaceCount: number

    ```


    For example, the following resource sets the number of workspaces system-wide
    on the primary screen to six:


    ```

    Dtwm*0*workspaceCount: 6

    ```'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Providing System-Wide Workspace Names


    Internally, the workspaces are numbered by the numbering convention ws n, where
    n is 0, 1, 2, and so on. For example, the default four workspaces are numbered
    internally ws0 through ws3.


    Use the title resource to change the name of a specified workspace:


    ```

    Dtwm*wsn: name

    ```


    For example, the following resources set the default four workspaces to the specified
    names:


    ```

    Dtwm*ws0*title: Glenda

    Dtwm*ws1*title: Neil

    Dtwm*ws2*title: Nicole

    Dtwm*ws3*title: William

    ```


    # Starting the Session Applications


    At session startup, Session Manager restarts any applications saved in the previous
    session. The system default set of applications to be restored as part of the
    user''s initial session can be found in /usr/dt/config/language/sys.session. Do
    not edit this file.


    A system administrator can replace the set of applications started as part of
    the user''s initial session by copying /usr/dt/config/language/sys.session to
    /etc/dt/config/language/sys.session and modifying the latter file. Unlike the
    resource files, this file is used as a complete replacement for the desktop default
    file.


    # Customizing the Front Panel


    The Front Panel contains a set of icons and pop-up menus (more like roll-up menus)
    that appear at the bottom of the screen. The two main elements of the Front Panel
    are the Main Panel and the subpanels. The Main Panel includes the workspace switch
    shown in Figure 7–2, which contains the buttons you use to change from one workspace
    to another.


    Figure 7-2

    A Front Panel workspace switch.


    ![](img/85737305a4c9aeecbcadd9986d604c02_145_0.png)'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'If a control in the Main Panel has an arrow button on top of it, that control
    has a subpanel, as shown in Figure 7-3.


    # Figure 7-3


    A subpanel.


    ![](img/85737305a4c9aeecbcadd9986d604c02_146_0.png)


    Users can drag and drop icons from the File Manager or Application Manager to
    add them to the subpanels. Up to 12 additional workspaces can be configured, each
    with different backgrounds and colors. Each workspace can have any number of applications
    running in it, and an application can be set to appear in one, more than one,
    or all workspaces simultaneously. In some instances, the system administrator
    might find it necessary to lock the Front Panel so users can''t change it.


    Using the desktop''s interface, the Front Panel can easily be customized in the
    following ways:


    +   - Customizing workspaces

    - Adding and deleting workspaces

    - Renaming workspaces

    - Adding controls to subpanels


    The System Administrator can also do more advanced customization outside of the
    CDE environment by editing CDE configuration files directly from the UNIX command
    line. For more information on advanced front-panel customization, see the CDE
    Advanced User''s and System Administrator''s Guide.


    # Customizing Workspaces


    Users can use the Front Panel workspace switch to rename or change the number
    of workspaces. Click on the workspace buttons to change workspaces. When the cursor
    is positioned on a workspace button, pressing the third mouse button displays
    its pop-up menu, shown in Figure 7-4.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'Figure 7-4

    The workspace button pop-up menu.


    ![](img/85737305a4c9aeecbcadd9986d604c02_147_0.png)


    The workspace button pop-up menu includes the items described in Table 7-4.


    # Table 7-4 Pop-up Menu Options


    | Option | Description |

    |---|---|

    | Add Workspace | Adds a workspace to the list of workspaces |

    | Delete | Deletes the workspace |

    | Rename | Changes the button into a text field for editing the name |

    | Help | Displays help for the workspace switch |


    Use the pop-up menu to modify workspace button parameters. For example, to rename
    a workspace, follow these steps:


    +   1. Point to the workspace button of the workspace you want to rename.

    2. Choose Rename from the button''s pop-up menu (displayed by pressing the third
    mouse button). The workspace button turns into a text field.

    3. Edit the text field.

    4. Press Enter.


    To add a workspace, do the following:


    +   1. Point to any area in the workspace switch and press the third mouse button
    to display the pop-up menu.

    2. Choose Add Workspace from the pop-up menu. The new workspace, named New, is
    placed at the end of the set of workspaces.

    3. Rename the workspace as described earlier.


    To remove a workspace, do the following:


    +   1. Point to the workspace button of the workspace you want to remove.

    2. Choose Delete from the button''s pop-up menu (displayed by pressing the third
    mouse button).'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Customizing Workspace Controls


    Customizing the controls in the workspace switch is an advanced task that requires
    the system administrator to create a Front Panel configuration file. This section
    describes some easy customizations that can be performed from the desktop. Advanced
    customization is covered in the CDE Advanced User''s and System Administrator''s
    Guide.


    # The Front Panel Switch Area


    The switch area shown in Figure 7-5 is the portion of the workspace switch not
    occupied by other controls or workspace buttons.


    Figure 7-5

    The switch area.


    ![](img/85737305a4c9aeecbcadd9986d604c02_148_0.png)


    The switch area has a pop-up menu containing these items:


    +   - Add Workspace: Adds a workspace and creates a workspace button in the workspace
    switch

    - Help: Displays help for the workspace switch


    # Adding an Application or Other Icon to a Subpanel


    The user can add any type of File Manager or Application Manager icon to the Front
    Panel. The most convenient use for this feature is adding application icons. To
    add an application icon to a subpanel, do the following:


    +   1. Display the object''s icon in File Manager or Application Manager.

    2. Display the subpanel to which the object is to be added.

    3. Drag the object to the Install Icon control, using the first mouse button,
    and drop it on the control.


    The behavior of controls added to the Front Panel by using the Install Icon control
    depends on the type of icon dropped. Table 7-5 describes the control behavior
    for each type of icon.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Table 7-5 Icon Control Behavior


    | Type of Icon | Behavior |

    |---|---|

    | File | The same behavior as the file''s icon in File Manager. When the user
    clicks on the file icon, the Text Editor displays the contents of the file ready
    to be edited. |

    | Folder | Opens a File Manager view of the folder. |

    | Application group | Opens an Application Manager view of the application group.
    |

    | Application icon | The same behavior as the application''s icon in File Manager
    or Application Manager. When the user clicks on the icon, the application automatically
    is launched. |


    # Removing All User Customizations


    To reset the Front Panel and remove all user customizations, follow this procedure:


    +   1. Open Application Manager and double-click the Desktop_Tools application
    group icon.

    2. Double-click Restore Front Panel.


    The screen goes blank for several seconds while the Workspace Manager is restarted.
    The Restore Front Panel action removes all customizations made by using the Install
    Icon control or the Front Panel''s pop-up menus.


    NOTE. This procedure does not affect advanced customizations made by manually
    editing Front Panel configuration files.


    # Actions and Data Types


    Actions can be assigned to icons so associated commands are invoked when an icon
    is clicked. Actions are instructions that automate desktop tasks such as running
    applications and opening data files. Actions work much the same as application
    macros or programming functions.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'An action can be created by using the Create Action menu. This menu is accessed
    by first bringing up the Applications pop-up menu shown in Figure 7–6.


    # Figure 7–6


    The Applications pop-up menu.


    ![](img/85737305a4c9aeecbcadd9986d604c02_150_0.png)


    Select Desktop_Apps from the pop-up menu shown in Figure 7–6. The Desktop Apps
    window appears, as shown in Figure 7–7.


    # Figure 7–7


    The Desktop Apps window.


    ![](img/85737305a4c9aeecbcadd9986d604c02_150_1.png)'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'When the Desktop Apps window appears, click on the Create Action icon. The
    Create Action window appears, as shown in Figure 7–8.


    Figure 7-8

    The Create Action window.


    ![](img/85737305a4c9aeecbcadd9986d604c02_151_0.png)


    For information on filling in the appropriate fields and creating an action, click
    on Help, located at the top of the Create Action window.


    After you define an action, you can use that action in the desktop user interface
    to simplify tasks. The desktop provides the capability to attach user interface
    components such as icons, Front Panel controls, and menu items to actions. Each
    of these icons runs an action when the icon is double-clicked.


    Another common use for actions is in menus. Data files usually have actions in
    their selected menu in File Manager. For example, XWD files (files with names
    ending in .xwd or .wd) have an Open action that displays the screen image when
    you run the Xwud action.


    Actions and data types are powerful components for integrating applications into
    the desktop. They provide a way to create a user interface for starting applications
    and manipulating data files. For more information on creating actions, see the
    Solaris CDE Advanced User''s and System Administrator''s Guide.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# The Application Manager


    Application Manager is the desktop container displaying applications available
    to users. It is selected from the Applications pop-up menu located on the Front
    Panel, as shown in Figure 7-6.


    When initially opened, the window displays the top level directory of the Application
    Manager. User interaction with the Application Manager is similar to use of the
    File Manager except the Application Manager contains executable modules. The user
    launches the Application Manager from an icon on the Front Panel, opening the
    window shown in Figure 7-9.


    Figure 7-9

    The Application Manager window.


    ![](img/85737305a4c9aeecbcadd9986d604c02_152_0.png)


    Programs and icons can be installed in the Application Manager by the system administrator
    and pushed out to other workstations as part of the installation process. By default,
    the Application Manager comes preconfigured to include several utilities and programs
    (see Figure 7-9). Each of these utilities is located in a directory, which—with
    its contents—is called an application group. Application groups provided with
    the default desktop are described in Table 7-6.


    Table 7-6 Application Groups


    | Group | Description |

    |---|---|

    | Desktop_Apps | Desktop applications such as File Manager, Style Manager, and
    Calculator |

    | Desktop_Tools | Desktop administration and operating system tools, such as User
    Registration, Reload Application, vi text editor, and Check Spelling |

    | Information | Icons representing frequently used help topics |

    | System_Admin | Tools used by system administrators |

    | Desktop Controls | Tools to set your CDE environment, such as mouse behavior,
    desktop fonts, screen saver, and window behavior |

    | OpenWindows | Contains several OpenWindows-style actions, such as OpenWindows-style
    mail tool and OpenWinwindows-style file manager |


    The top level directory for the Application Manager is the directory /var/dt/appconfig/appmanager/login-hostname-display,
    created dynamically each time the user logs in. For'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'example, if user bcal... logs in from display sparc1:0, the following Application
    Manager directory is created:


    ```

    /var/dt/appconfig/appmanager/bcal...-sparc1-0

    ```


    The Application Manager is built by gathering application groups from directories
    located along the application search path. The default application search path
    consists of the locations shown in Table 7-7.


    # Table 7-7 Default Application Search Path Locations


    | Scope | Location |

    |---|---|

    | Built-in | /usr/dt/appconfig/appmanager/language |

    | System-wide | /etc/dt/appconfig/appmanager/language |

    | Personal | HomeDirectory/.dt/appmanager |


    To create the top-level directory of the application Manager, links are created
    at login time from the application group directories to the Application Manager
    directory, which is /var/dt/appconfig/appmanager/login-hostname-display. The gathering
    operation is done by the desktop utility dtappgather, which is automatically run
    by Login Manager after the user has successfully logged in. For example, the desktop
    provides the built-in application group /usr/dt/appconfig/appmanager/language/Desktop_Tools.
    At login time, a symbolic link is created to /var/dt/appconfig/appmanager/login-hostname-display/Desktop_Tools.


    Applications can be added to the Application Manager by copying icons from other
    application groups to the personal application group. To create a personal application
    group, follow these steps:


    +   1. From your home folder, change to the .dt/appmanager subfolder.

    2. Create a new folder. The folder name will become the name of the new application
    group.

    3. Double-click Reload Applications in the Desktop_Apps application group.

    4. Your new application group becomes registered at the top level of Application
    Manager.


    A personal application group is an application group users can alter because they
    have write permission to it. For example, users can copy (by pressing the Ctrl
    key and dragging) the Calculator icon from the Desktop_Tools application group
    to a new personal application group. Another method is to create an action for
    an application and then place an application (action) icon in the personal application
    group.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# The dtksh Shell


    Available in CDE is the Desktop KornShell (dtksh), which provides ksh11 scripting
    with the capability to easily access most of the existing Xt and MOTIF functions.
    The Desktop KornShell is based on ksh-93, which provides a powerful set of tools
    and commands for the shell programmer and supports the standard set of ksh11 programming
    commands. dtksh is used by developers and programmers to create MOTIF applications
    for the CDE environment.


    # To Customize or Not to Customize


    This question always arises: Should users be allowed to customize the CDE environment
    themselves? Most large institutions frown on letting users customize their own
    environments. Usually, the system administrator provides a default setup that
    is applied to all users. This default setup promotes consistency and prevents
    the “self-inflicted” problems that can occur when users incorrectly modify system
    files. The answer also depends on how much pain you’re willing to endure for the
    good of your user community. Users love an administrator who allows them the flexibility
    to arrange their own desktops; however, you can quickly have a nightmare of problems
    if users are not properly trained in the use of customization utilities.


    The graphical user interface available in CDE is a welcome enhancement to UNIX.
    With CDE, users no longer need to be exposed to the cryptic UNIX shell. Most of
    the routine tasks performed by users can now be done by using the menus and icons
    provided through CDE. As system administrator, your job is to customize CDE, using
    the tools provided, to facilitate tasks and maintain productivity in your specific
    environment.


    Customization of the CDE environment is a large topic. Although this chapter introduced
    you to some basic customization topics, additional information can be found in
    publications focusing on the subject.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# CHAPTER


    # 8


    # Writing Shell Scripts and Programs


    The following are the test objectives for this chapter:


    +   - Understand the traditional uses of shell script types

    - Learn how to set shell variables

    - Understand various quoting techniques

    - Understand how to redirect output and use pipes to string multiple commands

    - Understand the purpose and correct use of exit status

    - Understand how to use the if conditional statement

    - Learn how to create a loop using the for, while, and until statements

    - Understand how to use the case statement to control program execution flow

    - Understand shell functions'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'A thorough understanding of shell programming is a must for any system administrator.
    The system administrator must be able to read and write shell programs because
    many tasks can and should be automated by using shell programs. An advantage in
    using a script or shell program to perform a particular task is that doing so
    ensures consistency—in other words, the task is performed the very same way each
    time. Also, many software products come with install scripts that have to be modified
    for your system before they will work.


    A UNIX script is a sequence of UNIX commands, either in a file or typed at the
    command line, that perform multiple operations. Such files are also known as batch
    files in some systems. Another term for a script that might be familiar to you
    is macro. Usually script or macro refers to a simple command sequence, and shell
    program identifies a file containing a more complicated arrangement of commands.
    Shell programs use the shell''s control and conditional commands, called built-ins,
    which will be discussed later in this chapter.


    To run a file as a script, the file''s execution bit must be set. This means the
    file looks like this when you list it:


    ```

    % ls -l

    -rwxr-xr-x 1 bcal... 425 Jul 10 11:10 program.1

    ```


    If the execution bit is set, what happens next depends on the first line of the
    file. If the first two characters on the first line are anything other than #!,
    the file is interpreted as a Bourne shell script. If the characters #! are followed
    by an explicit program location, such as /bin/csh, that program is run as an interpreter
    on the contents of the file. In other words, the program is run in the shell that
    is specified after the #! characters. To create a C shell script, for example,
    type in the following on the first line of the file:


    ```

    #!/bin/csh

    ```


    > NOTE. A good idea is to put scripts and shell programs into their own directory
    to separate them from standard UNIX programs. They are commonly put into a directory
    named /usr/local/bin.


    # What Shell to Use?


    When writing scripts, you have your choice of using the Bourne shell, the C shell,
    or the Korn shell. Other shells, such as bash and tcsh, are also available. Selecting
    a particular shell to use is personal preference. I find most BSD UNIX users using
    the C shell because of its roots at Berkeley. Many of us old SunOS users still
    prefer to use the C shell because'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'we''ve used it for so many years. On the other hand, I find that SystemV users
    prefer the Korn shell. These preferences stem back to the early development days
    of UNIX and are discussed in Appendix A. “The History of UNIX.” For system administration,
    the Bourne shell is best for writing your scripts. The Bourne shell is the default
    shell in Solaris and is the only shell found on all UNIX systems. The Bourne shell
    was designed from the beginning for use as a programming language, which explains
    its breadth of programming features. An additional reason for using the Bourne
    shell is that its conditionals and controls are compatible with all other shells,
    including the dt*ksh shell used in the CDE environment and discussed in Chapter
    7, “Administration and Configuration of the CDE.” All examples used in this chapter
    will use the Bourne shell.


    # Bourne Shell Variables


    A variable is a name that refers to a temporary storage area in memory. A value
    such as a text string or number is assigned to a variable and can be changed at
    any time. The Bourne shell uses two types of variables to store values: local
    and environmental. Each is described in this chapter.


    A variable is either set to some particular value or is said to be “unset,” which
    means it does not exist as a variable. Shell variables are an integral part of
    shell programming. The shell variable provides the capability to store and manipulate
    information within a shell program. The variables you use are completely under
    your control, and you can set or unset any number of variables as needed to perform
    a particular task.


    A variable name must begin with a letter and may contain letters, digits, and
    underscores but no special characters. In the Bourne shell, environment variables
    are set with an assignment of NAME=value. In the following examples, the ME and
    BC variables are set by entering the following at a command prompt:


    ```

    ME=bill

    BC="bill calkins"

    ```


    Be sure not to have any white space before or after the equals (=) sign. Double
    quotes, as used in the second example, are used when white space is present in
    the text string you are assigning to the variable. Whenever the shell sees a $variable,
    such as $ME, it substitutes into the command line the value stored for that variable.


    Unfortunately, many of the special characters used by the shell are also used
    by other programs—there simply are not enough characters to go around. When the
    special characters shown in Table 8–2 are used in the shell, they must be quoted.
    Quoting is used when an assigned value contains a special character, spaces, tabs,
    or new lines. Without the quotes, the special symbols will be interpreted as shell
    metacharacters instead of being passed as arguments to programs. The three methods
    of quoting used in the Bourne shell are described in Table 8–1.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Table 8-1 Quoting


    | Symbol | Name | Description |

    |---|---|---|

    | \ | backslash | Quotes the next character. |

    | '' | single quote marks | No interpretation occurs. |

    | " | double quotes | All characters enclosed with double quote marks are quoted
    except back slash, accent grave, double quote, and currency symbol. |


    Commands are read from the string between two back ticks (`) and the standard
    output from these commands may be used to set a variable. No interpretation is
    done on the string before the string is read, except to remove back slashes (\
    ) used to escape other characters. Escaping back ticks allows nested command substitution
    like this one:


    ```

    font=`grep font \`cat filelist\``

    ```


    The back slashes inside the imbedded command protect the back ticks from immediate
    interpretation, so the back tick just before cat fails to match the initial one
    before grep.


    Some characters naturally act as delimiters in the Bourne shell and, when encountered,
    such characters have the effect of separating one logical word from the next.
    The characters outlined in Table 8-2 have a special meaning to the shell and cause
    termination unless quoted.


    Table 8-2 Delimiters


    | Symbol | Description |

    |---|---|

    | ; | Command delimiter. Acts as a <return> and executes the commands sequentially.
    |

    | & | Runs commands asynchronously. |

    | () | Groups commands into a single logical word. |

    | newlines | Separates records (the default). |

    | spaces, tabs | Separate fields (the default). |


    To display the value of a variable, enter the following at the command prompt
    (the dollar sign informs the shell that the following name refers to a variable):


    ```

