    # dd


    The main advantage of the dd command is that it quickly converts and copies files
    with different data formats, such as differences in block size or record length.


    The most common use of this command is to transfer a complete file system or partition
    from your hard disk to a tape. You can also use it to copy files from one hard
    disk to another. When you''re copying data, the dd command makes an image copy
    (an exact byte-for-byte copy) of any media, which can be either tape or disk.
    The syntax for the dd command, which follows, is described in Table 11-2.


    ```

    dd if=<input-file> of=<output-file> <option=value>

    ```


    # Table 11-2 dd Command Syntax


    | | |

    |---|---|

    | if | Used to designate an input file. The input file can be a filename or a
    device name, such as /dev/rmt/0. If no input file is specified, input for dd is
    taken from the UNIX standard input. |

    | of | Used to designate an output file. The output file can be a filename or
    a device name, such as /dev/rmt/0. If the output file is omitted, output from
    dd is sent the UNIX standard output. |


    Several other options can follow on the command line to specify buffer sizes,
    block sizes, and data conversions. See the Solaris online manual pages for a list
    of these options.


    The next few examples illustrate the use of the dd command for copying data. The
    first example shows how the dd command is used to duplicate tapes. This procedure
    requires two tape drives: a source tape and a destination tape.


    ```

    dd if=/dev/rmt/0 of=/dev/rmt/1

    ```


    The next example uses dd to copy one entire hard disk to another hard disk. In
    the example, we need two disks and both must have the same geometry.


    ```

    dd if=/dev/rdsk/c0t0d0s2 of=/dev/rdsk/c0t4d0s4 bs=128

    ```


    In this example, the option bs=128 specifies a block size. A large block size,
    such as 128KB or 256KB, will decrease the time to copy by buffering large amounts
    of data. Notice also that the raw device is specified. For this technique to work
    properly, you must use the raw (character) device to avoid the buffered (block)
    I/O system.


    The dd command can be used with tar to create an archive on a remote tape drive.
    In the next example, tar is used to create an archive on a remote system by piping
    the output to a tape drive called /dev/rmt/0 on a remote system named xena.


    ```

    tar cf - files | rsh xena dd of=/dev/rmt/0 obs=128

    ```'
