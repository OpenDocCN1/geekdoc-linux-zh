  md: '■ Changing a user''s password


    Enable a user account by changing the password status to Normal Password or Cleared
    Until First Login.


    6. Click on OK and the modification is made.


    # Adding a Group with Admin tool


    You might need to add a group that does not already exist on the system. Perhaps
    a new group of users called “engrg” (from the engineering department) needs to
    be added. The following steps describe how to add the new “engrg” group.


    +   1. Start Admin tool, if it''s not already running, and choose Browse, Groups.

    2. The Groups window is displayed, as shown in Figure 5-5.


    Figure 5-5

    The Groups window.


    ![](img/85737305a4c9aeecbcadd9986d604c02_116_0.png)


    +   3. Choose Edit, Add.

    4. The Add Group window is displayed, as shown in Figure 5-6. If you''re not sure
    how to complete a field, click on the Help button to see field definitions for
    this window.


    Figure 5-6

