  md: '# CHAPTER


    # 13


    # Networking


    The following are the test objectives for this chapter:


    +   - Defining networking terms

    - Identifying and understanding the various network configuration files

    - Understanding IP addressing and the various classes of networks

    - Understanding name services

    - Understanding network commands used to copy files and executing commands on
