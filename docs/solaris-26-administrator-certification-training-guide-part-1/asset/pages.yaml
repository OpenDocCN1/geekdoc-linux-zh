- pgno: 22
  md: 'Bootstrapping is the process the computer follows to load and execute the bootable
    operating system. The name is coined from the phrase "pulling yourself up by your
    own bootstraps." The instructions for the bootstrap procedure are stored in the
    boot PROM (programmable read-only memory).


    The boot process goes through the following phases:


    +   1. **Boot PROM Phase.** The PROM displays system identification information
    and runs self-test diagnostics to verify the system''s hardware and memory. Then
    the PROM loads the primary boot program, called bootblk.

    2. **Boot Programs Phase.** The bootblk program finds and executes the secondary
    boot program (called ufsboot) from the ufs file system and loads it into memory.
    After the ufsboot program is loaded, it loads the kernel.

    3. **Kernel Initialization Phase.** The kernel initializes itself and begins loading
    modules, using ufsboot to read the files. When the kernel has loaded enough modules
    to mount the root file system, it unmaps the ufsboot program and continues, using
    its own resources. The kernel starts the UNIX operating system, mounts the necessary
    file systems, and runs `/sbin/init` to bring the system to the "initdefault" state
    specified in `/etc/inittab`.

    4. **Init Phase.** The kernel creates a user process and starts the `/sbin/init`
    process, which starts other processes by reading the `/etc/inittab` file.


    The `/sbin/init` process starts the run control (rc) scripts, which execute a
    series of other scripts. These scripts (`/sbin/rc*`) check and mount file systems,
    start various processes, and perform system maintenance tasks.


    # Boot PROM and Program Phases


    The bootstrap process begins after power-up when information located in the hardware''s
    PROM chip is accessed. Sun calls this the OpenBoot firmware, and it is executed
    immediately after you turn on your system. The primary task of the OpenBoot firmware
    is to boot the operating system either from a mass storage device or from a network.


    OpenBoot contains a program called the monitor, which controls the operation of
    the system before the kernel is available. When a system is turned on, the monitor
    runs a quick self-test that checks such things as the hardware and memory on the
    system. If no errors are found, the system begins the automatic boot process.
    OpenBoot contains a set of instructions that locate and start up the system''s
    boot program and eventually start up the UNIX operating system. The boot program
    is stored in a predictable area on the system hard drive, CD-ROM, or other bootable
    device and is referred to as the bootblock. The bootblock is'
