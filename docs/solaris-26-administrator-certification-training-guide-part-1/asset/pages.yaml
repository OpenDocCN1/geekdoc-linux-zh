    - User Security (Chapters 4 and 5)

    - Networks (Chapter 13)

    - LP Print Service and Print Manager (Chapters 9 and 12)

    - Print Commands (Chapter 9)

    - Utilities (Covered throughout the book)


    You’ll also be graded on three areas not covered in this book: File Commands (cp,
    mv, rm, and so on), Visual Text Editor (basic editing tasks), and electronic communications
    (using UNIX email, talk, and wall commands). These are basic UNIX topics that
    you should be familiar with before taking the exam. As I stated earlier, this
    book covers system administration topics; basic UNIX topics are not within that
    scope. If you are not familiar with these three areas, I suggest you learn about
    them before taking the exam. There are many excellent books that cover basic UNIX
    topics and commands.


    Also, watch my Web site, www.pdesigninc.com. I’ll keep it up to date with any
    late breaking changes Sun might make to the exam or the objectives. Once you’re
