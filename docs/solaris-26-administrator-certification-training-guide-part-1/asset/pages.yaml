- pgno: 49
  md: '# Disk Storage Systems


    Before you begin to install a system, you need to spend some time thinking about
    how you want data stored on your system''s disks. With one disk, the decision
    is easy. When multiple disks are installed, you must decide which disks to use
    for the OS, the swap area, and the user data. Solaris breaks up disks into pieces,
    called partitions or slices. A Solaris disk can be divided into one to seven partitions.


    Why would you want to divide the disk into multiple partitions? Some administrators
    don''t; they use the entire disk with no partitions. The following list describes
    why you might want to consider partitioning disks:


    +   - Partitions allow finer control over such tasks as creating backups. UNIX
    commands, such as `ufsdump`, work on entire file systems. For backups, you might
    want to separate data and swap space from the application software so only data
    gets backed up with a `ufsdump`. Partitions containing system software and swap
    can be backed up much less frequently.

    - If one file system gets corrupted, the others remain intact. If you need to
    perform a recovery operation, restoring a smaller file system can be done more
    quickly. Also, when data is separated from system software, you can modify file
    systems without shutting down the system or reloading operating system software.

    - Partitions enable you to control the amount of disk storage allocated to an
    activity or type of use.

    - If file systems are mounted remotely from other systems, you can share only
    the data that needs to be accessed, not the entire system disk.


    The installation process gives you the option of creating partitions. Start with
    the default partition scheme supplied through the installation program. This scheme
    sets up the required partitions and provides you with the sizes required, based
    on the software you select to install. The following is a typical partitioning
    scheme for a system with a single disk drive:


    +   - **root (/) and /usr**—Solaris normally creates two partitions for itself,
    called root (/) and /usr. The installation program determines how much space you
    need. Most of the files in these two partitions are static. Information in these
    file systems will not increase in size unless you add additional software packages
    later. If you plan to add third-party software after the installation of Solaris,
    make sure you increase this partition to accommodate the additional files you
    plan to load. If the root (/) file system fills up, the system will not operate
    properly.

    - **swap**—This area on the disk doesn''t have any files in it. In UNIX you''re
    allowed to have more programs than will fit into memory. The pieces that aren''t
    currently needed in memory are transferred into swap to free up physical memory
    for other active processes. Swapping into a dedicated partition is a good idea
    for two reasons. Swap'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'partitions are isolated so they don''t get put on tape with the daily backups.
    and a swap partition can be laid out on a disk in an area to optimize performance.


    +   - **home**—On a single disk system, everything not in root, /usr, or swap
    should go into a separate partition. Third-party applications are a good example.
    This is also where you would put user-created files.

    - **/var (optional)**—This area is used by Solaris for system log files, print
    spoolers, and email. The name /var is short for variable because this file system
    contains system files that are not static but variable in size. One day the print
    spooler directory might be empty; another day it might contain several 1MB files.
    This separate file system is created to keep the root and /usr directories from
    filling up with these files. If the /var file system does not exist, make sure
    you make root (/) larger.

    - **/opt (optional)**—By default, the Solaris installation program loads optional
    software packages here. If this file system does not exist, install puts the optional
    software in the root file system. If the /opt file system does not exist, make
    sure you make root (/) larger.


    File systems provide a way to segregate data, but when a file system runs out
    of space, you can''t increase it or "borrow" from a file system that has some
    unused space. Therefore, the best plan is to create a minimal number of file systems
    with adequate space for expansion. See Chapter 3, "Introduction to File Systems,"
    for additional information on planning and creating file systems.


    # Basic Considerations for Planning Partition Sizes


    Planning disk and partition space depends on many factors: the number of users,
    application requirements, and the number and size of files and databases. What
    follows are some basic considerations for determining your disk space requirements:


    +   - Allocate additional disk space for each language selected (for example,
    Chinese, Japanese, Korean).

    - If you need printing or mail support, create a partition for the /var file system
    and allocate additional disk space. You need to estimate the number and size of
    email messages and print files to size this partition properly.

    - Allocate additional disk space on a server that is going to provide home file
