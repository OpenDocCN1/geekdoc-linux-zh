- pgno: 235
  md: 'When you use the pmadm command to administer a service, you specify a particular
    port monitor via the pm tag argument and a particular port via the svctag argument.
    For each port monitor type, the SAF requires a specialized command to format port
    monitor-specific configuration data. This data is used by the pmadm command.


    To add a standard terminal service to the mbmon port monitor, type


    ```

    pmadm -a -p mbmon -s a -i root -v ''ttyadm -V'' -m ''"ttyadm -i ''Terminal disabled''
    -l \ contty -m ldterm,ttcompat -S y -d /dev/term/a -s /usr/bin/login"''

    ```


    Options used in the pmadm command are described in Table 12-6. Note that the above
    pmadm command contains an embedded ttyadm command.


    # Table 12-6 pmadm Command Options


    | Command Option | Description |

    |---|---|

    | -a | Adds port monitor status option |

    | -d | Disables the port monitor service |

    | -e | Enables the port monitor service |

    | -l | Lists the port monitor service information |

    | -p | Specifies the pm tag mbmon as the port monitor tag |

    | -s | Specifies the svctag a as the port monitor service tag |

    | -i | Specifies the identity to be assigned to svctag when it runs |

    | -v | Specifies the version number of the port monitor |

    | -m | Specifies the ttymon-specific configuration data formatted by ttyadm |


    The next example uses the pmadm command to list the status of a TTY port, or all
    the ports associated with a port monitor. Type


    ```

    pmadm -l -p mbmon

    ```


    The system outputs the following information:


    ```

    PMTAG PMTYPE SVCTAG FLAGS ID <PMSPECIFIC>

    mbmon ttymon a . root /dev/term/a - - /usr/bin/login \

    - contty ldterm,ttcompat login: Terminal disabled - y #Comment

    ```'
