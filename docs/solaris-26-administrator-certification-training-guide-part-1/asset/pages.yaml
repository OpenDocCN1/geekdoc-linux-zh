    # Adding a Terminal Through the Admintool


    This section describes how to add a terminal by using the Solaris Admintool. Using
    the Admintool is the easiest way to add a terminal to your system. The steps are
    as follows:


    +   1. Follow steps 1–4 outlined in the section "Adding a Modem Through the Admintool."
    When the Modify Serial Port window appears, as shown in Figure 12-7, select Terminal-Hardwired
    from the Template menu.


    Figure 12-7

    Modify Serial Port

    Window:


    ![](img/85737305a4c9aeecbcadd9986d604c02_241_0.png)


    +   2. Change the values of template entries, if desired. The template entries
    are described in Table 12-1.


    +   3. Click OK to configure the port and type pmadm -1 -s ttya to verify that
    the service has been added.


    Setting up terminals and modems has always been a complicated task in UNIX. When
    you encounter problems, pinpointing the cause can be difficult. For example, not
    being able to access the modem could mean an incorrect serial port setting, a
    cable configuration problem, or an incorrect initialization string on the modem.
    This is one of those areas where experience and practice can make all the difference
    in the world. In the early years of UNIX, nearly all peripherals were connected
    to the serial port. Now, many devices—such as printers and terminals—are connected
    via the network. Chapter 13, "Networking," will describe how to set up your network
    and introduce you to some networking fundamentals.'
