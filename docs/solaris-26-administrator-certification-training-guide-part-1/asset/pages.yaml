- pgno: 244
  md: 'One chapter isn''t enough to cover network administration; in fact, Sun has
    developed a certification exam specifically for this area. The basic exam includes
    some networking fundamentals, however, and this chapter provides you with that
    basic information. The topics include designing and planning the network, setting
    up the network, and maintaining the network. As a system administrator, you might
    be responsible for all of these tasks or you might specialize in a particular
    area.


    # Network Fundamentals


    First, we need to define some of the terms used in networking. You''ll find an
    alphabet soup of acronyms, which I''ll try to sort out a bit for you. First, I''ll
    describe the types of networks available and then I''ll describe the various network
    protocols. Last, I''ll identify the physical components of the network hardware,
    including the network interfaces and cabling.


    # Network Topologies


    When we speak of the *network topology*, we describe the overall picture of the
    network. The topology describes large and small networks as LANs and WANs.


    # LAN


    A *local area network (LAN)* is a set of hosts, usually in the same building and
    on the same floor, connected by a high-speed medium such as ethernet. A LAN might
    be a single IP network, or it might be a collection of networks or subnets connected
    through high-speed routers.


    The cabling or wiring used for computer networks is referred to as network media.
    A Solaris local area network is connected by some sort of thick or thin coaxial
    cable, twisted-pair telephone wire, or fiber-optic cable. In the Solaris LAN environment,
    twisted-pair wire is the most commonly used network media. Other types of network
    media used in a Solaris LAN include Fiber Distributed Data Interface (FDDI) or
    Token Ring.


    # WAN


    A *wide area network (WAN)* is a network that covers a potentially vast geographic
    area. An example of a WAN is the Internet. Other examples of WANs are enterprise
    networks linking the separate offices of a single corporation into one network
    spanning an entire country or perhaps an entire continent.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Network Protocols


    The network protocol is the part of the network you configure but cannot see.
    It''s the software portion of the network that controls data transmission between
    systems across the network.


    # Packet


    A packet is the basic unit of information to be transferred over the network.
    A packet is organized much like a conventional letter. Each packet has a header
    that corresponds to an envelope. The header contains the addresses of the recipient
    and the sender, plus information on how to handle the packet as it travels through
    each layer of the protocol suite.


    The message part of the packet corresponds to the letter itself. Packets can contain
    only a finite number of bytes of data, depending on the network media in use.
    Therefore, typical communications such as email messages are sometimes split into
    packet fragments.


    # TCP/IP


    Transmission Control Protocol/Internet Protocol (TCP/IP) is a network communications
    protocol consisting of a set of formal rules that describe how software and hardware
    should interact within a network. For the network to function properly, information
    must be delivered to the intended destination in an intelligible form. Because
    different types of networking software and hardware need to interact to perform
    the network function, designers developed the TCP/IP communications protocol,
    now recognized as a standard by major international standards organizations and
    used throughout the world. Because it is a set of standards, TCP/IP runs on many
    different types of computers, making it easy for you to set up a heterogeneous
    network running any operating system that supports TCP/IP. The Solaris operating
    system includes the networking software to implement the TCP/IP communications
    protocol suite.


    TCP/IP offers a slew of commands and features that are supported on Solaris and
    described later in this chapter.


    # Ethernet


    Ethernet is a standard that defines the physical components a machine uses to
    access the network and the speed at which the network runs. It includes specifications
    for cabling, connectors, and computer interface components. Ethernet is a LAN
    technology that transmits information between computers at speeds of up to 10
    million bits per second (Mbps). Fast Ethernet pushes the speed up to 100Mbps.
    Ethernet can be run over four types of physical media:


    | Media | Type |

    |---|---|

    | Thick Ethernet | Type 10BASE5 |

    | Thin Ethernet | Type 10BASE2 |

    | Twisted-pair Ethernet | Type 10BASE-T |

    | Fiber-optic Ethernet | Types FOIRL and 10BASE-F |


    The 10Base-T type Ethernet is the most popular media in use today.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Ethernet uses a protocol called CSMA/CD for “Carrier Sense, Multiple Access,
    Collision Detect.” The “Multiple Access” part means every station is connected
    to a single cable. The “Carrier Sense” part means that before transmitting data,
    a station checks the cable to determine if any other station is already sending
    something. If the LAN appears to be idle, the station can begin to send data.
    When several computers connected to the same network need to send data, two computers
    might try to send at the same time, causing a collision of data. The ethernet
    protocol senses this collision and notifies the computer to send the data again.
    How can two computers send data at the same time? Isn’t ethernet supposed to check
    the network for other systems that might be transmitting before sending out data
    across the network? Here’s what happens: An ethernet station sends data at a rate
    of 10 megabits per second. This means it allows 100 nanoseconds per bit of information
    that is transmitted. The signal travels about one foot in a nanosecond. After
    the electric signal for the first bit has traveled about 100 feet down the wire,
    the station begins to send the second bit. An ethernet cable can run for hundreds
    of feet. If two stations are located 250 feet apart on the same cable and both
    begin transmitting at the same time, they will be in the middle of the third bit
    before the signal from each reaches the other station. This explains the need
    for the “Collision Detect” part of CSMA/CD. Two stations can begin to send data
    at the same time and their signals will “collide” nanoseconds later. When such
    a collision occurs, the two stations stop transmitting and try again later after
    a randomly chosen delay period.


    Although an ethernet network can be built using one common signal wire, such an
    arrangement is not flexible enough to wire most buildings. Unlike an ordinary
    telephone circuit, ethernet wire cannot be spliced to connect one copper wire
    to another. Instead, ethernet requires a repeater, a simple station that is connected
    to two wires. When the repeater receives data on one wire, it repeats the data
    bit-for-bit on the other wire. When collisions occur, the repeater repeats the
    collision as well. In buildings that have two or more types of ethernet cable,
    a common practice is to use repeaters to convert the ethernet signal from one
    type of wire to another.


    # FDDI


    Fiber Distributed Data Interface (FDDI) is a standard for data transmission on
    fiber-optic lines in a local area network that can extend in range up to 200KM
    (124 miles). The FDDI protocol is based on the token-ring protocol. In addition
    to being large geographically, an FDDI local area network can support thousands
    of users. FDDI also allows for larger packet sizes than lower-speed LANs using
    ethernet.


    An FDDI network can contain two token rings: a primary token ring and a secondary
    token ring for possible backup in case the primary ring fails. The primary ring
    offers up to 100Mbps capacity. If the secondary ring is not needed for backup,
    it can also carry data, doubling the capacity to 200Mbps.


    # ISDN


    Integrated Services Digital Network (ISDN) is a high-quality digital communications
    product that gives a single phone line the capability to transmit voice and packet
    data simultaneously.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Transmission speeds can be either 64Kbps (using one channel) or 128Kbps (with
    the two 64Kbps channels linked). Some ISDN adapters offer compression, with speeds
    to the Internet and dial-up networking approaching 512Kbps.


    # Network Hardware


    The network hardware is the physical part of the network you can actually see.
    The physical components connect the systems together and include the NIC, host,
    cabling, connectors, hubs, and routers.


    # NIC


    The computer hardware that enables you to connect it to a network is known as
    a Network Interface (NIC) or network adapter. The network interface can support
    one or more communication protocols to specify how computers use the physical
    media—the network cable—to exchange data. Many computers come with a preinstalled
    network interface; others require you to purchase the network interface separately.


    Each LAN media type has its own associated network interface. For example, if
    you want to use ethernet as your network media, you must have an ethernet interface
    installed in each host that is to be part of the network. The connectors on the
    board to which you attach the ethernet cable are referred to as ethernet ports.
    The same is true if you plan to use FDDI, and so on.


    # Host


    If you are an experienced Solaris user, you are no doubt familiar with the term
    host, often used as a synonym for “computer” or “machine.” From a TCP/IP perspective,
    only two types of entities exist on a network: routers and hosts. When a host
    initiates communication, it is called a sending host, or the sender. For example,
    a host initiates communications when the user types ping or sends an email message
    to another user. The host that is the target of the communication is called the
    receiving host, or recipient.


    Each host has the following three characteristics that help identify it to its
    peers on the network:


    |  |  |

    |---|---|

    | Hostname | Every system on the network has a unique hostname. Hostnames enable
    users to refer to any computer on the network by using a short, easily remembered
    name rather than the host''s network IP address. |

    | Internet address or IP address | Each machine on a TCP/IP network has an Internet
    address that identifies the machine to its peers on the network. |

    | Hardware address | Each host on a network has a hardware address that also identifies
    it to its peers. This address is physically assigned to the machine''s CPU or
    network interface by the manufacturer. Each hardware address is unique. |'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Hub


    Ethernet cabling is run to each system from a *hub*. The hub connects all of the
    ethernet cables together. Hubs can support from two to several hundred systems.


    # Router


    A *router* is a machine that forwards ethernet packets from one network to another.
    To do this, the router must have at least two network interfaces. A machine with
    only one network interface cannot forward packets; it is considered a host. Most
    of the machines you set up on a network will be hosts.


    # Planning the Network


    You need to do a great deal of planning before you set up your network. As part
    of the planning process, you must go through the following steps:


    +   1. Obtain a network number and, if applicable, register your network domain
    with the InterNIC.

    2. After you receive your IP network number, devise an IP addressing scheme for
    your hosts.

    3. Create a list containing the IP addresses and hostnames of all machines to
    comprise your network. You will use this list as you build network databases.

    4. Determine which name service to use on your network: NIS, NIS+, DNS, or the
    network databases in the local /etc directory. Name services are discussed later
    in this chapter.

    5. Establish administrative subdivisions, if appropriate, for your network.

    6. Determine if your network is large enough to require routers. If appropriate,
    create a network topology that supports them.

    7. Set up subnets, if appropriate, for your network.


    Only after carefully planning your network are you ready to start setting it up.


    # Setting Up the Network


    During the installation of the operating system you''ll use the Solaris software
    installation program to configure your network. The network configuration files
    set up by the Solaris installation program are


    +   - `/etc/hostname.interface`

    - `/etc/nodename.file`

    - `/etc/defaultdomain`

    - `/etc/inet/hosts`'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# /etc/hostname.interface


    This file defines the network interfaces on the local host. At least one /etc/hostname.interface
    file should exist on the local machine. The Solaris installation program creates
    this file for you. In the filename, interface is replaced by the device name of
    the primary network interface.


    The file contains only one entry: the hostname or IP address associated with the
    network interface. For example, suppose le0 is the primary network interface for
    a machine called system1. The filename file would be called /etc/hostname.le0
    and the file would contain the entry system1.


    # /etc/nodename


    This file should contain one entry: the hostname of the local machine. For example,
    on a computer named xena, the file /etc/nodename would contain the entry xena.


    # /etc/defaultdomain


    This file is present only if your network uses a name service (described later
    in this chapter). This file should contain one entry: the fully qualified domain
    name of the administrative domain to which the local host''s network belongs.
    You can supply this name to the Solaris installation program or edit the file
    at a later date.


    For example, if the host is part of the domain pyramid, which is classified as
    a .com domain, the /etc/defaultdomain should contain the entry pyramid.com.


    # /etc/inet/hosts


    The hosts database contains the IP addresses and hostnames of machines on your
    network. This file contains the hostnames and IP addresses of the primary network
    interface and any other network addresses the machine must know about. When a
    user enters a command such as ping xena, the system needs to know how to get to
    the host named xena. The /etc/hosts file provides a cross-reference for the system
    to look up xena and find xena''s network IP address. For compatibility with BSD-based
    operating systems, the file /etc/hosts is a symbolic link to /etc/inet/hosts.


    The /etc/inet/hosts file uses the format described in Table 13-1.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Table 13-1 /etc/inet/hosts File Format


    address hostname <nickname> [#comment]


    | address | The IP address for each interface the local host must know about.
    |

    | hostname | The hostname assigned to the machine at setup and the hostnames assigned
    to additional network interfaces the local host must know about. |

    | [nickname] | An optional field containing a nickname or alias for the host.
    |

    | [# comment] | An optional field where you can include a comment. |


    When you run the Solaris installation program on a system, it sets up the initial
    /etc/inet/hosts file. This file contains the minimum entries the local host requires:
    its loopback address, its IP address, and its hostname.


    For example, the Solaris installation program might create the following entries
    in the /etc/inet/hosts file for a system called xena:


    ```

    127.0.0.1 localhost loghost #loopback address

    192.9.200.3 ahaggar #host name

    ```


    In the /etc/inet/hosts file for machine xena, the IP address 127.0.0.1 is the
    loopback address, the reserved network interface used by the local machine to
    allow interprocess communication so it sends packets to itself. The operating
    system, through the ifconfig command, uses the loopback address for configuration
    and testing. Every machine on a TCP/IP must have an entry for the localhost and
    must use the IP address 127.0.0.1.


    If you''ve already installed your operating system and answered no to installing
    a network, you can either edit the network configuration files manually or reissue
    the network configuration portion of the installation program.


    To reissue the program portion, you must first be superuser. Then type sys-unconfig
    at the command line to restore the system''s configuration to an "as-manufactured"
    state. After you run the command, the system starts up again and prompts you for
    the following information:


    | Hostname | Input a unique name for the computer. |

    | The name service you will use | Select NIS, NIS+, DNS, or a local file. |

    | Time zone | Input your local time zone. |

    | IP address | Input the unique IP address for this host. |

    | IP subnet mask | If your network uses subnets, input the subnet mask. |

    | Root password | Enter a root password. |'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'When the system is finished prompting for input, it continues the startup process.
    When the system is started, the network has been configured.


    # Network Security Files


    Chapter 4, "System Security," included coverage of network security. If necessary,
    refer to that section to review the discussion on configuring the network security
    files /etc/hosts.equiv and /.rhosts.


    # IP Addressing


    Each host on the TCP/IP network has a network address—referred to as the IP address—that
    is unique for each host on the network. If the host will participate on the Internet,
    this address must also be unique to the Internet. For this reason, Internet IP
    addresses are controlled by an administrative agency, such as the InterNIC.


    The IP address is a sequence of four bytes and is written in the form of four
    decimal integers separated by periods (for example, 0.0.0.0). Each integer is
    8 bits long and ranges from 0 to 255. The IP address consists of two parts: a
    network ID assigned by the InterNIC administrative agency and the host ID assigned
    by the local administrator. The first integer of the address (0.0.0.0) determines
    the address type and is referred to as its class. There are five classes of IP
    addresses: A, B, C, D, and E. Without going into great detail, the following is
    a brief description of each class.


    Class A networks are used for very large networks with millions of hosts, such
    as the Internet. A class A network number uses the first eight bits of the IP
    address as its network ID. The remaining 24 bits comprise the host part of the
    IP address. The values assigned to the first byte of class A network numbers fall
    within the range 0–127. For example, consider the IP address 75.4.10.4. The value
    75 in the first byte indicates that the host is on a class A network. The remaining
    bytes, 4.10.4, establish the host address. The InterNIC assigns only the first
    byte of a class A number. Use of the remaining three bytes is left to the discretion
    of the owner of the network number. Only 127 class A networks can exist; each
    of these networks can accommodate up to 16,777,214 hosts.


    Class B networks are medium-size networks, such as universities and large businesses
    with many hosts. A class B network number uses 16 bits for the network number
    and 16 bits for host numbers. The first byte of a class B network number is in
    the range 128–191. In the number 129.144.50.56, the first two bytes, 129.144,
    are assigned by the InterNIC and comprise the network address. The last two bytes,
    50.56, make up the host address and are assigned at the discretion of the owner
    of the network.


    Class C networks are used for small networks containing fewer than 254 hosts.
    Class C network numbers use 24 bits for the network number and 8 bits for host
    numbers. A class C network number occupies the first three bytes of an IP address,
    and only the fourth byte is assigned at the discretion of the network owners.
    The first byte of a class C network number'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'covers the range 192–223. The second and third bytes each cover the range 1–255.
    A typical class C address might be 192.5.2.5, with the first three bytes, 192.5.2,
    forming the network number. The final byte in this example, 5, is the host number.


    Class D addresses are used for IP multicasting as defined in RFC 988, and class
    E addresses are reserved for experimental use.


    The first step in planning for IP addressing on your network is to determine which
    network class is appropriate for your network. After you have done this, you can
    obtain the network number from the InterNIC addressing authority. When you receive
    your network number, you can plan how you will assign the host parts of the IP
    address. You can reach the InterNIC Registration Services in several ways.


    The United States mailing address is


    Network Solutions

    Attn: InterNIC Registration Services

    505 Huntmar Park Drive

    Herndon, Virginia 22070


    You can send email regarding network registration to hostmaster@rs.internic.net.


    The InterNIC phone number is 703-742-4777. Phone service is available from 7 a.m.
    to 7 p.m. (Eastern Standard Time).


    > NOTE. Do not arbitrarily assign network numbers to your network, even if you
    do not plan to attach it to other existing TCP/IP networks. As your network grows,
    you might decide to connect it to other networks. Changing IP addresses at that
    time can be a great deal of work and can cause downtime.


    # Name Service


    When a user enters a command such as ping xena, one of the first things that must
    happen is translation of the hostname xena to an IP address. This can happen in
    either of two ways.


    The IP address can be determined from the /etc/inet/hosts file or it can be resolved
    through the domain name service (DNS). For a small network, using just /etc/hosts
    is not a problem. For a larger network, trying to keep the /etc/inet/hosts file
    in sync on all hosts can result in a great deal of work, because these files must
    be exactly the same on each host. If the same address gets used on two different
    systems, the network could fail.


    DNS relies on the named server to provide hostname-to-IP address translations.
    The named server is a host that permanently stores hostname and IP address information
    for a specific domain. A domain name is the network equivalent of a hostname.
    A hostname refers to a specific system on the network, and a domain name refers
    to a specific network. Sites and institutions are assigned a domain name for their
    network; they, in turn, assign hostnames to systems within their domain. The Internet
    domain name system provides a scheme by which every site in the world has a unique
    name.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# TCP/IP Commands


    TCP/IP offers several commands and features that are supported on the Solaris
    operating system. These commands are part of the TCP/IP networking package and
    are available on most UNIX systems.


    # telnet


    telnet is used to log into another system on the network. The following is a sample
    session:


    ```

    # telnet pyramid1

    Trying 192.9.200.4...

    Connected to pyramid1.

    Escape character is ''^]''.


    SunOS 5.6

    login: bill

    Password:

    Last login: Sat Jan 16 07:55:03 from 192.9.200.1

    Sun Microsystems Inc. SunOS 5.6 Generic August 1997

    pyramid1%

    ```


    # rlogin


    rlogin is also a command for logging into another system on the network. Unlike
    telnet, rlogin has a mechanism whereby you don''t have to enter a login name and
    password.


    # ftp


    The File Transfer Protocol (FTP) is used to transfer one or more files between
    two systems on the network. Here is a sample ftp session:


    ```

    pyramid1% ftp pyramid1

    Connected to pyramid1.

    220 pyramid1 FTP server (SunOS 5.6) ready.

    Name (pyramid1:bill): <cr>

    331 Password required for bill.

    Password: <enter password>

    230 User bill logged in.

    ftp> pwd

    257 "/users/bill" is current directory.

    ftp> ls

    200 PORT command successful.

    150 ASCII data connection for /bin/ls (192.9.200.4,47131) (0 bytes).

    admin

    file1

    data

    226 ASCII Transfer complete.

    19 bytes received in 0.049 seconds (0.38 Kbytes/s)

    ```'
