    # pmadm


    The Port Monitor Service Administrator (pmadm) command enables you to administer
    port monitors'' services. Use pmadm to add services, list the services of one
    or more ports associated with a port monitor, and enable or disable a service.
    An example would be a terminal service. You can also install or replace per-service
    configuration scripts or print information about a service.'
