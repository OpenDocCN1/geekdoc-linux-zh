  md: '# CHAPTER


    # 9


    # The LP Print Service


    The following are the test objectives for this chapter:


    +   - Understand the difference between the BSD and SystemV print systems

    - Understand the Solaris LP print service

    - Describe the print client and print server

    - Understand the difference between local and remote printing

    - Describe the terminfo database

    - Understand how to use Admintool to create, configure, and modify printers'
