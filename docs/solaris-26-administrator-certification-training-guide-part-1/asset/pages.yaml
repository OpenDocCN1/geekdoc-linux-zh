    | -r | Reads an archive file from standard input and extracts the specified files.\
    \ If any intermediate directories are needed for extracting an archive member,\
    \ these directories are created. |\n| -w | Writes files to the standard output\
    \ in the specified archive format. When no file operands are specified, standard\
    \ input is read as a list of pathnames—one per line, without any leading or trailing\
