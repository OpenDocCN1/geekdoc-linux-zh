    # PROM Device Names, Addresses, and Arguments


    Sun''s firmware deals directly with hardware devices in the system. Each device
    has a unique name, representing the type of device and a path to that device''s
    location in the hardware hierarchy or the system addressing structure. The following
    example shows a full device pathname:


    ```

    /sbus1@f8000000/esp@,80000/sd@3,0:a

    ```


    A full device pathname consists of information, or node names, separated by slashes
    (/). The root of the tree is the machine node, which is not named explicitly but
    is indicated by a leading slash (/). Each node name has the form


    ```

    name@address:arguments

    ```


    Table 1-2 describes the parameters in the node name.


    Table 1-2 Full Device Path Node Name Parameters


    | Node Name Parameter | Description |

    |---|---|

    | name | A text string that, ideally, has some mnemonic value (for example, sd
    represents "SCSI disk"). Many names, especially names of plug-in modules, include
    the name or stock symbol of the device''s manufacturer (for example, SUNW is the
    stock symbol for Sun Microsystems). |

    | @ | Separates the name from the address parameter. |

    | address | A text string representing an address, usually of the form hex_number,hex_number.
    (Numbers are given in hexadecimal format.) |

    | : | Must precede the argument''s parameter. |

    | arguments | A text string whose format depends on the particular device. It
    can be used to pass information to the device''s software. |'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'OpenBoot commands require the full device pathname to locate and distinguish
    between different devices. This means you can specify a particular device without
    ambiguity.


    Example:


    ```

    /sbus@1,f8000000/esp@0,40000/sd@3,0:a

    ```


    1,f8000000 represents an address on the main system bus because the SBus interface
    is directly attached to the main system bus.


    0,40000 is an SBus slot number. The esp device is in SBus slot 0 at offset 40000.
    (In this example, the device is a SCSI host adapter, although the name does not
    say so directly.)


    3,0 is a SCSI target and logical unit number. The sd device is attached to a SCSI
    bus at target 3, logical unit 0.


    See Appendix C, "Overview of SCSI Devices," for more information on SCSI host
    adapters, targets, and logical units.


    The :arguments part of the node name is optional. In the previous example, the
    argument for the sd device is the string a. The Solaris software driver for sd
    interprets the argument as a disk partition, so the device pathname refers to
    partition a on that disk.


    # PROM Device Aliases


    OpenBoot recognizes two kinds of device pathnames:


    +   - Full device (discussed in the previous section), such as `/sbus@1,f8000000/esp@0,40000/sd@3,0:a`

    - Device aliases, such as `disk`


    An alias is shorthand representing a long device pathname. An alias represents
    an entire device pathname, not a component of it. For example, the alias disk
    might represent the device pathname


    `/sbus@1,f8000000/esp@0,40000/sd@3,0:a`


    OpenBoot has the following predefined device aliases for commonly used devices,
    so you rarely need to type a full device pathname.


    | Alias | Device Pathname |

    |---|---|

    | disk | /sbus@1,f8000000/esp@0,40000/sd@3,0:a |

    | disk1 | /sbus@1,f8000000/esp@0,40000/sd@1,0:a |

    | disk2 | /sbus@1,f8000000/esp@0,40000/sd@2,0:a |

    | disk3 | /sbus@1,f8000000/esp@0,40000/sd@3,0:a |'
