- pgno: 124
  md: 'The system administrator is responsible for managing all software installed
    on a system. Installing and removing software is a routine task that is performed
    frequently. In Chapter 2, “Installing the Solaris 2.x Software,” I described the
    installation of the Solaris operating system. In this chapter, I explain how to
    add and remove additional applications after the operating system has already
    been installed.


    Sun and its third-party vendors deliver software products in a form called a software
    package. The term “package” refers to a method of distributing and installing
    software products to systems where the products will be used. A package is a collection
    of files and directories in a defined format that conforms to the Application
    Binary Interface (ABI), a supplement to the System V Interface Definition. The
    Solaris operating environment provides a set of utilities that interpret the ABI
    format and provide the means to install or remove a package or to verify its installation.


    # Tools for Managing Software


    Solaris provides two tools for adding and removing software from a system. Both
    are shown in Table 6–1.


    Table 6–1 Tools for Managing Software


    | Command | Description |

    |---|---|

    | *Managing software from the command line* | |

    | pkgadd | Adds software packages to the system |

    | pkgrm | Removes software packages from the system |

    | pkgchk | Checks the accuracy of a software package installation |

    | pkginfo | Displays software package information |

    | pkgask | Stores answers in a response file so they can be supplied automatically
    during an installation |

    | *Managing software from the graphical user interface* | |

    | Admintool™ | A GUI that is invoked from within CDE or OpenWindows |


    Use the pkgadd or pkgrm commands directly from the command line to load or remove
    software. The pkgadd and pkgrm commands can be incorporated into scripts to automate
    the software installation process. Many third-party vendors use pkgadd in scripts
    as a means to install their software.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Admintool, on the other hand, provides an easy-to-use interface for installing
    or removing software. It is simply a graphical user interface to the pkgadd and
    pkgrm. Using the Admintool graphical interface is a convenient way to view software
    already installed on a system or to view the software that resides on the installation
    media. If you''re unfamiliar with software-package naming conventions or uncomfortable
    using command-line options, or if you''re managing software on only one system
    at time, you''ll find Admintool an easy way to add and remove software.


    # Adding and Removing Software Packages


    When you add a software package, the pkgadd command uncompresses and copies files
    from the installation media, such as the CD-ROM, to a local system''s disk. When
    you use packages, files are delivered in package format and are unusable as they
    are delivered. The pkgadd command interprets the software package''s control files
    and then uncompresses the product files and installs them on the system''s local
    disk.


    Here are a few things you should know before installing additional application
    software:


    +   - Sun packages always begin with the prefix SUNW, as in SUNWvolr, SUNWadmap,
    and SUNWab2m. Third-party packages usually begin with a prefix that corresponds
    to the company''s stock symbol.

    - You can use the pkginfo command or Admintool to view software already installed
    on a system.

    - Clients might have software that resides partially on a server and partially
    on the client. If this is the case, adding software for the client requires adding
    packages to both the server and the client.

    - You need to know where the software will be installed and make sure you have
    a file system with enough disk space to store the application software. Use the
    pkgparam command to determine where the package will be loaded. For example, type


    ```

    pkgparam -d /cdrom/cdrom0/s0/Solaris_2.6 /Product SUNWvolr SUNW_PKGTYPE

    ```


    The system responds with the location where the application will be stored:


    ```

    root

    ```


    When you remove a package, the pkgrm command deletes all files associated with
    that package unless those files are also shared with other packages. Be sure you
    do not delete application software without using pkgrm. For example, some system
    administrators delete an application simply by removing the directory containing
    the application software. With this method, files belonging to the application
    that might reside in other directories are missed. With pkgrm, you''ll be assured
    of removing all files associated with the application.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Although the pkgadd and pkgrm commands do not log their output to a standard
    location, they do keep track of the product installed or removed. The pkgadd and
    pkgrm commands store information about a package that has been installed or removed
    in a software product database. By updating this database, the pkgadd and pkgrm
    commands keep a record of all software products installed on the system.


