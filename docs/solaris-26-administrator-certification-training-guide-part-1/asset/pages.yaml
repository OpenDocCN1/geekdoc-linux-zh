- pgno: 204
  md: 'Backing up a system involves copying data from the system’s hard disks onto
    removable media that can be safeguarded in a secure area. Backups are used to
    restore data if files get corrupted or data gets destroyed by system failure or
    a building disaster. Having a fault-tolerant disk array is not enough. Disk mirroring
    and RAID 5 protect your data in case of a hardware failure, but they do not protect
    against file corruption, natural disaster, or accidentally deleting a file. Backing
    up system data—the most important task you will perform—must be carried out on
    a regular basis. Although even a comprehensive backup scheme can’t guarantee against
    loss of information, you can make sure the loss will be minimal. This chapter
    describes methods available to perform a backup, types of backups, development
    of a solid backup strategy, and restoring of data if you encounter a loss. First
    you’ll find an explanation of the tar, dd, cpio, and pax commands, which are used
    to copy data from disk to disk or from disk to tape. Then the ufsdump and ufsrestore
    utilities are described as the preferred method of backing up data from a Solaris
    system to tape on a regular basis.


    # Solaris Backup and Restore Utilities


    Solaris provides the following utilities that can be used to copy data from disk
    to removable media and restore it:


    | Utility | Description |

    |---|---|

    | tar | Used to archive data to another directory, system, or media. |

    | dd | Used to copy data quickly. |

    | cpio | Used to copy data from one location to another. |

    | pax | Use pax to copy files and directory subtrees to a single tape. This command
    provides better portability than tar or cpio, so it can be used to transport files
    to other types of UNIX systems. |

    | ufsdump | Used to back up all files in a file system. |

    | ufsrestore | Used to restore some or all of the files archived with the ufsdump
    command. |


    # tar


    The primary use of the tar (tape archiver) command is to copy file systems or
    individual files from a hard disk to a tape or from a tape to a hard disk. You
    can also use it to create a tar archive on a hard disk or floppy and to extract
    files from a tar archive on a hard disk or floppy. The tar command is popular
    because it’s available on most UNIX systems; however, it is limited to a single
    tape. If the data you are backing up requires more than one tape, use the cpio,
    pax, or ufsdump command.


    The tar command has the following syntax:


    ```

    tar <options> <tar filename> <file list>

    ```'
