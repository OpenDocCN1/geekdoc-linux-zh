- pgno: 10
  md: '# Conventions Used in This Book


    **Commands** In the steps and examples, the commands you enter are boldface and
    in a monospaced font. For example: `ls -l <return>`. The `<return>` means to press
    the Enter key to enter the command. Only press Enter when instructed to do so.


    **Arguments and Options** When describing command syntax, command options and
    arguments are in an italic monospaced font, and they are enclosed within angle
    brackets (< >). For example,


    ```

    lp -d<printer name> <filename> <return>

    ```


    **Using the Mouse** When using menus and windows, you''ll be selecting items with
    the mouse. Here is the default mapping for a three-button mouse:


    |  |  |

    |---|---|

    | Left button | Selects objects or activates controls |

    | Middle button | Moves or adjusts objects |

    | Right button | Displays pop-up menus |'
