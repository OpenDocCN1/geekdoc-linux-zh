  \ 在指定的宽度内左对齐 `s`。\n- `lower()`: 转换为小写。\n- `capitalize()`: 将首字母大写。\n- `casefold()`:\
  \ 用于不区分大小写的转换。\n- `center(width [, fill])`: 在指定的宽度内居中对齐 `s`。\n- `count(sub [, start\
  \ [, end]])`: 计算子字符串出现的次数。\n- `decode([encoding [, errors])`: 将字节解码为文本。\n- `encode([encoding\
  \ [, errors])`: 返回字符串的编码版本。\n- `expandtabs([tabsize])`: 替换表符。\n- `find(sub [, start\
  \ [, end]])`: 查找子字符串首次的位置。\n- `format(*args, **kwargs)`: 格式化 `s`。\n- `format_map(m)`:\
  \ 使用映射格式化 `s`。\n- `index(sub [, start [, end]])`: 查找子字符串的位置或报错。\n- `ljust(width\
  \ [, fill])`: 见上。\n- `replace(old, new [, count])`: 替换 `count` 次 `old`。\n- `partition(sep)`:\
  \ 返回包含分隔符之前、分隔符和之后部分的三元组。\n- `split(sep=None, maxsplit=-1)`: 根据分隔符分割字符串。\n- `rsplit(sep=None,\
  \ maxsplit=-1)`: 从右侧分割字符串。\n- `startswith(prefix [, start [, end]])`: 检查字符串是否以前缀开头。\n\
  - `translate(table)`: 根据翻译表返回字符串。\n- `strip(chars)`: 移除首尾字符。\n- `lstrip(chars)`:\
  \ 移除头部字符。\n- `rstrip(chars)`: 移除尾部字符。\n\n\n\n\n\n## 字符串运算符与方法\n\n| 方法 |  |\n| :---\
  \ | :--- |\n| `s.lstrip([chrs])` | 删除开头的空白字符或 `chrs` 中指定的字符。 |\n| `s.maketrans(x\
  \ [, y [, z]])` | 为 `s.translate()` 创建一个翻译表。 |\n| `s.partition(sep)` | 根据分隔符字符串\
  \ `sep` 分割字符串。返回元组 `(head, sep, tail)`；如果未找到 `sep`，则返回 `(s, '', '')`。 |\n| `s.removeprefix(prefix)`\
  \ | 如果存在指定的前缀 `prefix`，则返回移除该前缀后的 `s`。 |\n| `s.removesuffix(suffix)` | 如果存在指定的后缀\
  \ `suffix`，则返回移除该后缀后的 `s`。 |\n| `s.replace(old, new [, maxreplace])` | 替换子字符串。 |\n\
  | `s.rfind(sub [, start [, end]])` | 查找子字符串的最后一次出现。 |\n| `s.rindex(sub [, start\
  \ [, end]])` | 查找子字符串的最后一次出现或抛出错误。 |\n| `s.rjust(width [, fill])` | 在长度为 `width`\
  \ 的字符串中对 `s` 进行右对齐。 |\n| `s.rpartition(sep)` | 根据分隔符 `sep` 分割 `s`，但从字符串末尾开始搜索。 |\n\
  | `s.rsplit([sep [, maxsplit]])` | 使用 `sep` 作为分隔符从字符串末尾分割。`maxsplit` 是允许执行的最大分割次数。如果省略\
  \ `maxsplit`，结果与 `split()` 方法相同。 |\n| `s.rstrip([chrs])` | 删除结尾的空白字符或 `chrs` 中指定的字符。\
  \ |\n| `s.split([sep [, maxsplit]])` | 使用 `sep` 作为分隔符分割字符串。`maxsplit` 是允许执行的最大分割次数。\
  \ |\n| `s.splitlines([keepends])` | 将字符串分割为行列表。如果 `keepends` 为 `1`，则保留结尾的换行符。 |\n\
  | `s.startswith(prefix [, start [, end]])` | 检查字符串是否以 `prefix` 开头。 |\n| `s.strip([chrs])`\
  \ | 删除开头和结尾的空白字符或 `chrs` 中指定的字符。 |\n| `s.swapcase()` | 将大写转换为小写，反之亦然。 |\n| `s.title()`\
  \ | 返回字符串的标题格式版本。 |\n| `s.translate(table [, deletechars])` | 使用字符翻译表 `table` 翻译字符串，并删除\
  \ `deletechars` 中的字符。 |\n| `s.upper()` | 将字符串转换为大写。 |\n| `s.zfill(width)` | 在字符串左侧填充零直到达到指定的宽度。\
  \ |\n\n表 10.9 字符串运算符与方法\n\n```\nsum(items [,initial])\n```\n\n计算从可迭代对象 `items` 中取出的序列项之和。`initial`\
  \ 提供起始值，默认认为 `0`。此函数通常只适用于数字。\n\n```\nsuper()\n```\n\n返回一个表示其所在类类的所有父类的对象。该对象的主要用途是调用基类中的方法。示例如下：\n\
  \n点击此处查看代码图片\n\n```\nclass B(A):\n\n     def foo(self):\n\n         super().foo()\
  \     # 调用由父类定义的 foo()\n```\n\n```\ntuple([items])\n```\n\n表示元组的类型。如果提供了 `items`，它是一个用于填充元组的可迭代对象。然而，如果\
  \ `items` 已经是元组，则将其原样返回。如果没有给出任何参数，则返回一个空元组。\n\n表 10.10 显示了定义在元组上的方法。\n\n| 操作 |\
  \ 说明 |\n| :--- | :--- |\n| `s + t` | 如果 `t` 是列表，则进行拼接。 |\n| `s * n` | 如果 `n` 是整数，则进行复制。\
  \ |\n| `s[i]` | 返回 `s` 的第 `i` 个元素。 |\n| `s[i:j]` | 返回一个切片。 |\n| `s[i:j:stride]`\
  \ | 返回一个扩展切片。 |\n| `len(s)` | `s` 中的元素个数。 |\n| `s.append(x)` | 在 `s` 的末尾添加新元素 `x`。\
  \ |\n| `s.count(x)` | 统计 `x` 在 `s` 中出现的次数。 |\n| `s.index(x [, start [, stop]])`\
  \ | 返回 `s[i] == x` 的最小索引 `i`。`start` 和 `stop` 可选指定搜索的起始和结束索引。 |\n\n表 10.10 元组运算符与方法\n\
  \n```\ntype(object)\n```\n\nPython 中所有类型的基类。当作为函数调用用时，返回 `object` 的类型。该类型与对象的类相同。对于整数、浮点数和列表等常见类型，该类型将指向其他内置类之一，如\
  \ `int`、`float`、`list` 等。对于用户定义的对象，类型是关联的类。对于与 Python 内部相关的对象，你通常会获得 `types` 模块中定义的类的一个引用。\n\
  \n```\nvars([object])\n```\n\n返回 `object` 的符号表（通常位于其 `__dict__` 中）。\n\n```\nzip([s1\
  \ [, s2]])\n```\n\n创建一个产生包含 `s1` 的元组的迭代器。\n\n### 0.2 内置异常\n\n本节描述了用于报告不同类型错误的内置异常。\n\
  \n#### 0.2.1 异常基类\n\n以下异常作为基类：\n\n```\nBaseException\n```\n\n所有异常的根类。\n\n```\nException\n\
  ```\n\n除 `SystemExit`、`GeneratorExit` 和 `KeyboardInterrupt` 外的所有异常的基类。\n\n```\n\
  ArithmeticError\n```\n\n算术异常的基类，包括 `OverflowError`、`ZeroDivisionError` 和 `FloatingPointError`。\n\
  \n```\nLookupError\n```\n\n索引和键错误的基类，包括 `IndexError` 和 `KeyError`。\n\n```\nEnvironmentError\n\
  ```\n\n发生在 Python 之外错误的基类。是 `OSError` 的别名。这些异常不会显式抛出，但可以用于捕获某些错误。\n\n#### 0.2.2\
  \ 异常属性\n\n异常实例 `e` 具有一些标准属性：\n\n```\ne.args\n\n```\n\n抛出异常时提供的参数元组。在大多数情况下，这是一个描述错误的单项元组。对于\
  \ `EnvironmentError` 异常，该值是一个包含整数错误代码、字符串错误消息和可选文件名的二元组或三元组。如果在不同的上下文中重建异常（例如在不同的解释器进程中抛出异常），此元组的内容可能有用。\n\
  \n```\ne.__cause__\n\n```\n\n显式链式异常的上一个异常。\n\n```\ne.__context__\n\n```\n\n隐式链式异常的上一个异常。\n\
  \n```\ne.__traceback__\n\n```\n\n与异常关联的回溯对象。\n\n#### 0.2.3 预定义异常类\n\n以下异常由程序抛出：\n\
  \n```\nAssertionError\n```\n\n断言语句失败。\n\n```\nAttributeError\n```\n\n属性引用或赋值失败。\n\
  \n```\nBufferError\n```\n\n内存内存缓冲区。\n\n```\nEOFError\n```\n\n文件末尾错误。由内置函数 `input()`\
  \ 和 `raw_input()` 生成。需要注意的是，大多数其他 I/O 操作（如文件的 `read()` 和 `readline()` 方法）通过返回空字符串来指示\
  \ EOF，而不是抛出异常。\n\n```\nFloatingPointError\n\n```\n\n浮点运算失败。需要注意的是，浮点异常处理是一个棘手的问题，只有当\
  \ Python 被配置并构建为启用它时才会抛出此异常。更常见的情况是浮点错误静默地产生 `float('nan')` 或 `float('inf')` 等结果。`ArithmeticError`\
  \ 的子类。\n\n```\nGeneratorExit\n\n```\n\n\n\n\n\n在生成器函数内部抛出，用于信号终止。这发生在生成器被过早销毁（在所有生成器值被消费之前）或调用了生成器的\
  \ `close()` 方法时。如果生成器忽略了此异常，则生成器将终止，且异常会被静默忽略。\n\n```\nIOError\n```\n\nI/O 操作失败。该值是一个\
  \ `IOError` 实例，具有 `errno`、`strerror` 和 `filename` 属性。`errno` 是一个整数错误代码，`strerror`\
  \ 是一个字符串错误消息，`filename` 是可选的文件名。它是 `EnvironmentError` 的子类。\n\n```\nImportError\n\
  ```\n\n当 `import` 语句无法找到模块或当 `from` 无法在模块中找到名称时抛出。\n\n```\nIndentationError\n```\n\
  \n缩进错误。它是 `SyntaxError` 的子类。\n\n```\nIndexError\n```\n\n序列下标超出范围。它是 `LookupError`\
  \ 的子类。\n\n```\nKeyError\n```\n\n在映射中未找到键。它是 `LookupError` 的子类。\n\n```\nKeyboardInterrupt\n\
  ```\n\n当用户按下中断键（通常是 `Ctrl+C`）时抛出。\n\n```\nMemoryError\n```\n\n可恢复的内存溢出错误。\n\n```\n\
  ModuleNotFoundError\n```\n\n`import` 语句无法找到模块。\n\n```\nNameError\n```\n\n在本地或全局命名空间中未找到名称。\n\
  \n```\nNotImplementedError\n```\n\n未实现的功能。可以由要求派生类实现某些方法的基类抛出。它是 `RuntimeError`\
  \ 的子类。\n\n```\nOSError\n```\n\n操作系统错误。主要由 `os` 模块中的函数抛出。以下异常是其子类：`BlockingIOError`、`BrokenPipeError`、`ChildProcessError`、`ConnectionAbortedError`、`ConnectionError`、`ConnectionRefusedError`、`ConnectionResetError`、`FileExistsError`、`FileNotFoundError`、`InterruptedError`、`IsADirectoryError`、`NotADirectoryError`、`PermissionError`、`ProcessLookupError`、`TimeoutError`。\n\
  \n```\nOverflowError\n```\n\n整数值太大无法表示。此异常通常只发生在内部内部依赖固定精度机器整数的对象。例如，如果你指定的起始或结束值超过\
  \ 32 位，在 `range` 或 `xrange` 对象中可能会出现此错误。它是 `ArithmeticError` 的子类。\n\n```\nRecursionError\n\
  ```\n\n超过递归深度限制。\n\n```\nReferenceError\n```\n\n在底层对象被销毁后访问弱引用（参见 `weakref` 模块）。\n\
  \n```\nRuntimeError\n```\n\n未被任何其他类别涵盖的通用错误。\n\n```\nStopIteration\n```\n\n用于信号迭代的结束。这通常发生在对象的\
  \ `next()` 方法中或生成器函数中。\n\n```\nStopAsyncIteration\n```\n\n用于信号异步迭代的结束。仅适用于 `async`\
  \ 函数和生成器的语文中。\n\n```\nSyntaxError\n```\n\n解析器语法错误。实例具有 `filename`、`lineno`、`offset`\
  \ 和 `text` 属性，可用这些属性来收集更多信息。\n\n```\nSystemError\n```\n\n解释器内部错误。该值是一个指示该的字符串。\n\
  \n```\nSystemExit\n```\n\n由 `sys.exit()` 函数抛出。该值是一个表示返回代码的整数。如果需要立即退出，可以使用 `os._exit()`。\n\
  \n```\nTabError\n```\n\n制表符使用不一致。当使用 `-tt` 运行 Python 时生成。它是 `SyntaxError` 的子类。\n\
  \n```\nTypeError\n```\n\n当将操作或函数应用于不适当类型的对象时发生。\n\n```\nUnboundLocalError\n```\n\
  \n引用了未绑定的局部变量。如果变量在函数中定义之前被引用，则发生此错误。它是 `NameError` 的子类。\n\n```\nUnicodeError\n\
  ```\n\nUnicode 编码或解码错误。它是 `ValueError` 的子类。以下异常是其子类：`UnicodeEncodeError`、`UnicodeDecodeError`、`UnicodeTranslateError`。\n\
  \n```\nValueError\n```\n\n当函数或操作的参数类型正确但值不时不生成。\n\n```\nWindowsError\n```\n\n在 Windows\
  \ 上因系统调用失败而生成。它是 `OSError` 的子类。\n\n```\nZeroDivisionError\n```\n\n除以零。它是 `ArithmeticError`\
  \ 的子类。\n\n## 10.3 标准库\n\nPython 自带了一个庞大的标准库。其中许多模块在书中之前描述过。参考材料可以在 `https://docs.python.org/library`\
  \ 找到。这些材料在此处不再重复。\n\n列出的模块之所以值得关注，是因为它们通常对各种应用程序以及一般的 Python 编程非常有用。\n\n### 10.3.1\
  \ `collections` 模块\n\n`collections` 模块为 Python 提供了许多额外的容器对象，这些对象在处理数据时非常有用——例如双端队列\
  \ (`deque`)、自动初始化缺失项的字典 (`defaultdict`) 以及用于计数统计的计数器 (`Counter`)。\n\n### 10.3.2\
  \ `datetime` 模块\n\n`datetime` 模块包含了与日期、时间以及涉及这些计算相关的函数。\n\n### 10.3.3 `itertools`\
  \ 模块\n\n`itertools` 模块提供了各种常用的迭代模式——将可迭代对象链在一起、遍历积集、排列、分组以及类似的操作。\n\n### 10.3.4\
  \ `inspect` 模块\n\n`inspect` 模块提供了检查代码相关元素（如函数、类、生成器和协程）内部结构的函数。\n\n### 10.3.5 `math`\
  \ 模块\n\n`math` 模块提供了常用的函数，如 `sqrt()`、`cos()` 和 `sin()`。\n\n### 10.3.6 `os` 模块\n\n\
  `os` 模块包含了与主机系统相关的底层函数——进程、文件、权限等功能。\n\n### 10.3.7 `random` 模块\n\n`random` 模块提供了与随机数生成的各种函数。\n\
  \n### 10.3.8 `re` 模块\n\n`re` 模块提供了通过正则表达式匹配处理文本的支持。\n\n### 10.3.9 `shutil` 模块\n\n\
  `shutil` 模块拥有执行 shell 操作相关的函数，例如复制文件和目录。\n\n### 10.3.10 `statistics` 模块\n\n`statistics`\
  \ 模块提供了计算常见统计值如平均值、位数和标准差。\n\n### 10.3.11 `sys` 模块\n\n`sys` 模块包含了与 Python 运行时相关的各种属性和方法。。命令行选项、标准输入输出流、导入路径等功能。\n\
  \n### 10.3.12 `time` 模块\n\n`time` 模块包含了与系统时间相关的各种函数，如获取系统时钟值、睡眠以及经过的 CPU 秒数。\n\n\
  ### 10.3.13 `turtle` 模块\n\n乌龟图形。你知道的，是给孩子玩的。\n\n### 10.3.14 `unittest` 模块\n\n`unittest`\
  \ 模块提供了编写单元测试的内置支持。Python 本身使用 `unittest` 进行测试。\n\n## 10.4 结语：使用内置函数\n\n在拥有成千上万\
