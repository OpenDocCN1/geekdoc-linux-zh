  \n\n\n\n动态绑定是 Python 用来查找对象属性的运行时机制。这使得 Python 能够在不考虑类型的情况下与实例交互。在 Python 中，变量名没有关联的类型。因此，属性绑定过程独立于\
  \ `obj` 是什么类型的对象。如果你进行查找，例如 `obj.name`，它将适用于任何恰好拥有 `name` 属性的 `obj`。这种行为有时被称为“鸭子类型”（duck\
  \ typing）——引用自那句谚言：“如果它看起来像鸭子，叫起来像鸭子，走起来像鸭子，那么它就是鸭子。”\n\nPython 程序员经常编写依赖这种行为的程序。例如，如果你想为现有对象创建一个自定义版本，既可以继承它，也可以创建一个在外观和行为上与其相似、但在其他方面无关的全新对象。后者方法通常用于保持程序组件的松散耦合。例如，可以编写代码来与任何类型的对象工作，只要它拥有一组特定的方法。最常见的例子之一是标准库中定义的各种迭代对象。有各种配合\
  \ `for` 循环工作产生值的对象——列表、文件、生成器、字符串等。然而，这些对象中没有一个继承自任何特殊的 `Iterable` 基类。它们仅仅实现了执行迭代所需的方法——而这一切都能正常工作。\n\
  \n### 7.11 继承内置类型的危险\n\nPython 允许继承内置类型。然而，这样做会带来危险。例如，如果你决定通过对 `dict` 进行子化来强制所有键变为大写，你可能会像这样重定义\
  \ `__setitem__()` 方法：\n\n点击此处查看代码图片\n\n```\nclass udict(dict):\n    def __setitem__(self,\
  \ key, value):\n        super().__setitem__(key.upper(), value)\n```\n\n事实上，它最初看起来甚至是有效的：\n\
  \n点击此处查看代码图片\n\n```\n>>> u = udict()\n>>> u['name'] = 'Guido'\n>>> u['number'] =\
  \ 37\n>>> u\n{ 'NAME': 'Guido', 'NUMBER': 37 }\n>>>\n```\n\n然而，进一步的使用会发现，它似乎看起来有效。事实上，它看起来根本没有起作用：\n\
  \n点击此处查看代码图片\n\n```\n>>> u = udict(name='Guido', number=37)\n>>> u\n{ 'name': 'Guido',\
  \ 'number': 37 }\n>>> u.update(color='blue')\n>>> u\n{ 'name': 'Guido', 'number':\
  \ 37, 'color': 'blue' }\n>>>\n```\n\n这里的问题在于，Python 的内置类型并不是像普通 Python 类那样实现的——它们是用\
  \ C 语言实现的。大多数方法都在 C 世界中操作。例如，`dict.update()` 方法直接操作字典数据，而从未通过你上面定义的 `udict` 方法。\n\
  \n`collections` 模块有特殊的类 `UserDict`、`UserList` 和 `UserString`，可以用于创建 `dict`、`list`\
  \ 和 `str` 类型的安全子类。例如，你会发现这种解决方案效果要好得多：\n\n点击此处查看代码图片\n\n```\nfrom collections import\
  \ UserDict\n\nclass udict(UserDict):\n    def __setitem__(self, key, value):\n \
  \       super().__setitem__(key.upper(), value)\n```\n\n这是这个新版本的运行示例：\n\n点击此处查看代码图片\n\
  \n```\n>>> u = udict(name='Guido', num=37)\n>>> u.update(color='Blue')\n>>> u\n\
  {'NAME': 'Guido', 'NUM': 37, 'COLOR': 'Blue'}\n>>> v = udict(u)\n>>> v['title']\
  \ = 'BDFL'\n>>> v\n{'NAME': 'Guido', 'NUM': 37, 'COLOR': 'Blue', 'TITLE': 'BDFL'}\n\
  >>>\n```\n\n大多数时候，可以避免对内置类型进行子化。例如，在构建新容器时，创建一个新类可能更好，正如第 7.8 节中 `Stack` 类所示。如果你确实需要继承内置类型，其工作量可能比你想象的要得多。\n\
  \n### 7.12 类变量和方法\n\n在类定义中，所有函数都被假设在实例上操作，实例始终作为第一个参数 `self` 传递。然而，类本身也是一个可以携带状态并被操作的对象。例如，你可以使用类变量\
  \ `num_accounts` 来跟踪创建了多少实例：\n\n点击此处查看代码图片\n\n```\nclass Account:\n    num_accounts\
  \ = 0\n\n    def __init__(self, owner, balance):\n        self.owner = owner\n \
  \       self.balance = balance\n\n    def __repr__(self):\n        return f'{type(self).__name__}(self.owner!r},\
  \ {self.balance!r})\n\n    def deposit(self, amount):\n        self.balance += amount\n\
  \n    def withdraw(self, amount):\n        self.balance -= amount\n\n    @classmethod\n\
