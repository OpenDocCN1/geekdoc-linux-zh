  \ % other` |\n| `__matmul__(self, other)` | `self @ other` |\n| `__divmod__(self,\
  \ other)` | `divmod(self, other)` |\n| `__pow__(self, other [, modulo])` | `self\
  \ ** other`, `pow(self, other, modulo)` |\n| `__lshift__(self, other)` | `self <<\
  \ other` |\n| `__rshift__(self, other)` | `self >> other` |\n| `__and__(self, other)`\
