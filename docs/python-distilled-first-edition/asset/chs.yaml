  \ other)` | `self ^ other` |\n| `__radd__(self, other)` | `other + self` |\n| `__rsub__(self,\
  \ other)` | `other - self` |\n| `__rmul__(self, other)` | `other * self` |\n| `__rtruediv__(self,\
  \ other)` | `other / self` |\n| `__rfloordiv__(self, other)` | `other // self` |\n\
  | `__rmod__(self, other)` | `other % self` |\n| `__rmatmul__(self, other)` | `other\
  \ @ self` |\n| `__rdivmod__(self, other)` | `divmod(other, self)` |\n| `__rpow__(self,\
  \ other)` | `other ** self` |\n| `__rlshift__(self, other)` | `other << self` |\n\
  | `__rrshift__(self, other)` | `other >> self` |\n| `__rand__(self, other)` | `other\
  \ & self` |\n| `__ror__(self, other)` | `other | self` |\n| `__rxor__(self, other)`\
  \ | `other ^ self` |\n| `__iadd__(self, other)` | `self += other` |\n| `__isub__(self,\
  \ other)` | `self -= other` |\n| `__imul__(self, other)` | `self *= other` |\n|\
  \ `__itruediv__(self, other)` | `self /= other` |\n| `__ifloordiv__(self, other)`\
  \ | `self //= other` |\n| `__imod__(self, other)` | `self %= other` |\n| `__imatmul__(self,\
  \ other)` | `self @= other` |\n| `__ipow__(self, other)` | `self **= other` |\n\
  | `__iand__(self, other)` | `self &= other` |\n| `__ior__(self, other)` | `self\
  \ |= other` |\n| `__ixor__(self, other)` | `self ^= other` |\n| `__ilshift__(self,\
  \ other)` | `self <<= other` |\n| `__irshift__(self, other)` | `self >>= other`\
  \ |\n| `__neg__(self)` | `–self` |\n| `__pos__(self)` | `+self` |\n| `__invert__(self)`\
  \ | `~self` |\n| `__abs__(self)` | `abs(self)` |\n| `__round__(self)` | `round(self)`\
  \ |\n| `__floor__(self)` | `floor(self)` |\n| `__ceil__(self)` | `ceil(self)` |\n\
  | `__trunc__(self)` | `trunc(self)` |\n\n### 4.11 比较协议\n\n对象可以通过多种方式比较。最基本的检查是使用\
  \ `is` 运算符进行恒性检查。例如，`a is b`。即使对象的值相同，恒性检查也不考虑内部的值。例如：\n\n```\n>>> a = [1, 2, 3]\n\
  >>> b = a\n>>> a is b\nTrue\n>>> c = [1, 2, 3]\n>>> a is c\nFalse\n```\n\n`is` 运算符是\
  \ Python 的内部部分，无法重定义。对象上的其他比较都是通过表 4.3 中的方法实现的。\n\n| 方法 | 描述 |\n| --- | --- |\n\
  | `__bool__(self)` | 真值测试返回 `False` 或 `True` |\n| `__eq__(self, other)` | `self\
  \ == other` |\n| `__ne__(self, other)` | `self != other` |\n| `__lt__(self, other)`\
  \ | `self < other` |\n| `__le__(self, other)` | `self <= other` |\n| `__gt__(self,\
  \ other)` | `self > other` |\n| `__ge__(self, other)` | `self >= other` |\n| `__hash__(self)`\
  \ | 计算整数哈希索引 |\n\n表 4.3 实例比较与哈希方法\n\n如果存在 `__bool__()` 方法，当对象作为条件或条件表达式的一部分进行测试时，将确定其真值。例如：\n\
  \n点击此处查看代码图像\n\n```\nif a:              # 执行 a.__bool__()\n\n   ...\n\nelse:\n\n\
  \   ...\n```\n\n如果未定义 `__bool__()`，则使用 `__len__()` 作为备。如果 `__bool__()` 和 `__len__()`\
  \ 都未定义，则对象被简单地视为 `True`。\n\n\n\n\n`__eq__()` 方法用于确定配合 `==` 和 `!=` 运算符的基本相等性。`__eq__()`\
  \ 的默认实现使用 `is` 运算符通过对象标识性对对象进行比较。如果存在 `__ne__()` 方法，可以使用它为 `!=` 实现特殊处理，但只要定义了 `__eq__()`，通常不需要它。\n\
  \n排序通过关系运算符（`<`、`>`、`<=` 和 `>=`）使用 `__lt__()` 和 `__gt__()` 等方法确定。与其他运算一样，其求值规则是细微的。要评估\
  \ `a < b`，解释器将首先尝试执行 `a.__lt__(b)`，但 `b` 是 `a` 的子类除外。在一种特定情况下，会执行 `b.__gt__(a)`。如果该初始方法未定义或返回\
  \ `NotImplemented`，解释器将尝试反向比较，调用 `b.__gt__(a)`。类似的规则也适用于 `<=` 和 `>=` 等运算符。例如，评估\
  \ `<=` 时，首先会尝试评估 `a.__le__(b)`。如果未实现，则尝试 `b.__ge__(a)`。\n\n每个比较方法都接受两个参数，并允许返回任何类型的值，包括布尔值、列表或其他任何\
  \ Python 类型。例如，数值包可能会使用此方法对两个矩阵进行逐元素比较，并返回一个包含结果的矩阵。如果无法进行比较，方法应返回内置对象 `NotImplemented`。这与\
  \ `NotImplementedError` 异常不同。例如：\n\n点击此处此处查看代码图像\n\n```\n>>> a = 42      # int\n\
  \n>>> b = 52.3    # float\n\n>>> a.__lt__(b)\n\nNotImplemented\n\n>>> b.__gt__(a)\n\
  \nTrue\n\n>>>\n```\n\n有序对象没有必要实现 表 4.3 中的所有比较操作。如果你希望能够对对象进行排序或使用如 `min()` 或 `max()`\
  \ 等函数，那么至少必须定义 `__lt__()`。如果你在用户自定义的类中添加比较运算符，`functools` 模块中的 `@total_ordering`\
  \ 类装饰器可能会很有用。只要你最少实现了 `__eq__()` 和另一个比较方法，它就可以生成所有方法。\n\n`__hash__()` 方法定义在要放入集合（set）或用作映射（字典）键的实例上。返回的值是一个整数，对于两个比较相等的实例，该值应该是相同的。此外，`__eq__()`\
  \ 应该始终与 `__hash__()` 一起定义，因为这两个方法是协同工作的。`__hash__()` 返回的值通常用作各种数据结构的内部实现细节。然而，两个不同的对象可能有相同的哈希值。因此，`__eq__()`\
  \ 对于解决潜在冲突是必要的。\n\n### 4.12 转换协议\n\n有时，你必须将对象转换为内置类型（如字符串或数字）。表 4.4 中的方法可以为此目的。\n\
  \n| 方法 | 说明 |\n| --- | --- |\n| `__str__(self)` | 转换为字符串 |\n| `__bytes__(self)`\
  \ | 转换为字节 (bytes) |\n| `__format__(self, format_spec)` | 创建格式化表示 |\n| `__bool__(self)`\
  \ | `bool(self)` |\n| `__int__(self)` | `int(self)` |\n| `__float__(self)` | `float(self)`\
  \ |\n| `__complex__(self)` | `complex(self)` |\n| `__index__(self)` | 转换为整数索引 `[self]`\
  \ |\n\n表 4.4 转换方法\n\n`__str__()` 方法由内置函数 `str()` 以及与打印相关的函数调用。`__format__()` 方法由\
  \ `format()` 函数或字符串的 `format()` 方法调用。`format_spec` 参数是一个包含格式规范的字符串。该字符串与 `format()`\
  \ 函数的 `format_spec` 参数相同。例如：\n\n点击此处查看代码图像\n\n```\nf'{x:spec}'                 #\
  \ 调用 x.__format__('spec')\n\nformat(x, 'spec')           # 调用 x.__format__('spec')\n\
  \n'x is {0:spec}' .format(x)  # 调用 x.__format__('spec')\n```\n\n格式规范的语法是任意的，并且可以根据每个对象进行自定义。然而，对于内置类型，有一套标准的约定。。关于字符串格式化的更多信息（包括指定符的通用格式）可以在\
  \ 第 9 章中找到。\n\n`__bytes__()` 方法用于在传递给 `bytes()` 时创建字节表示。并非所有类型都支持字节转换。\n\n数值转换 `__bool__()`、`__int__()`、`__float__()`\
  \ 和 `__complex__()` 应产生对应内置类型的值。\n\nPython 永远不会使用这些方法执行隐式类型转换。因此，即使对象 `x` 实现了一个\
  \ `__int__()` 方法，表达式 `3 + x` 仍然产生 `TypeError`。执行 `__int__()` 的唯一方法是通过显式转换。\n\n###\
  \ 4.13 容器协议\n\n表 4.5 中的方法被容器（列表、字典、集合）使用。\n\n| 方法 | 说明 |\n| --- | --- |\n| `__len__(self)`\
  \ | 返回 `self` 的长度 |\n| `__getitem__(self, key)` | 返回 `self[key]` |\n| `__setitem__(self,\
  \ key, value)` | 设置 `self[key] = value` |\n| `__delitem__(self, key)` | 删除 `self[key]`\
  \ |\n| `__contains__(self, obj)` | `obj in self` |\n\n表 4.5 容器方法\n\n这是一个示例：\n\n\
  点击此处查看代码图像\n\n```\na = [1,2,3,4,5,6]\n\nlen(a)               # a.__len__()\n\nx\
  \ = a[2]             # a.__getitem__(2)\n\na[1] = 7             # a.__setitem__(1)\n\
  \ndel a[2]             # a.__delitem__(2)\n\n5 in a               # a.__contains__(5)\n\
  ```\n\n`__len__()` 方法由内置函数 `len()` 调用以返回非负长度。除非定义了 `__bool__()`，否则该函数还决定真值。\n\n\
  对于访问项，`__getitem__()` 获取项。键可以是任何 Python 对象，但对于列表和数组等序列，预期是整数。`__setitem__()` 方法为元素赋值。每对单个元素应用\
  \ `del` 操作时，都会调用 `__delitem__()` 方法。`__contains__()` 方法用于实现 `in` 运算符。\n\n切片操作如 `x\
  \ = s[i:j]` 也通过 `__getitem__()`、`__setitem__()` 和 `__delitem__()` 实现。对于切片，传递的是特殊的\
  \ `slice` 实例。该实例具有描述所请求切片范围的属性。例如：\n\n点击此处查看代码图像\n\n```\na = [1,2,3,4,5,6]\n\nx\
  \ = a[1:5]           # x = a.__getitem__(slice(1, 5, None))\n\na[1:3] = [10,11,12]\
  \  # a.__setitem__(slice(1, 3, None), [10, 11, 12])\n\ndel a[1:4]           # a.__delitem__(slice(1,\
  \ 4, None))\n```\n\nPython 的切片功能比许多程序员想象的要强大。例如，所有扩展切片的变体都支持，并且可能对于处理矩阵和数组等多维数据结构非常有用。\n\
  \n\n\n\n\n```\na = m[0:100:10]          # 步切片 (step=10)\n\nb = m[1:10, 3:20]   \
  \     # 多维切片\n\nc = m[0:100:10, 50:75:5] # 带有步长的多维切片\n\nm[0:5, 5:10] = n       \
  \  # 扩展切片赋值\n\ndel m[:10, 15:]          # 扩展切片删除\n```\n\n扩展切片每个维度的通用格式为 `i:j[:stride]`，其中\
  \ `stride` 可可选。与普通切片一样，你可以省略切片每个部分的起始值或结束值。\n\n此外，`Ellipsis`（写做 `...`）可表示扩展切片中任意数量的后续或前维度：\n\
  \n点击此处查看代码图片\n\n```\na = m[..., 10:20]    # 使用 Ellipsis 的扩展切片访问\n\nm[10:20, ...]\
  \ = n\n```\n\n在使用扩展切片时，`__getitem__()`、`__setitem__()` 和 `__delitem__()` 方法分别实现访问、修改和删除。然而，传递给这些方法的值不是整数，而是一个包含切片对象或\
  \ `Ellipsis` 对象组合的元组。例如，\n\n点击此处查看代码图片\n\n```\na = m[0:10, 0:100:5, ...]\n```\n\n\
  会按如下方式调用 `__getitem__()`：\n\n点击此处查看代码图片\n\n```\na = m.__getitem__((slice(0,10,None),\
  \ slice(0,100,5), Ellipsis))\n```\n\nPython 字符串、元组和列表目前对扩展切片提供一些支持。Python 的任何部分或其标准库都没有使用多维切片或\
  \ `Ellipsis`。这些功能完全是为第三方库和框架保留的。你最常看到它们使用的地方可能是像 `numpy` 这样的库。\n\n### 4.14 迭代协议\n\
  \n如果一个实例 `obj` 支持迭代，它会提供一个方法 `obj.__iter__()`，返回一个迭代器。迭代器 `iter` 反而实现了一个单一方法 `iter.__next__()`，该方法返回下一个对象或抛出\
  \ `StopIteration` 以信号迭代的结束。这些方法被 `for` 语句的实现以及其他隐式执行迭代的操作使用。例如，语句 `for x in s` 通过执行以下步骤完成：\n\
  \n点击此处查看代码图片\n\n```\n_iter = s.__iter__()\n\nwhile True:\n    try:\n         x =\
  \ _iter.__next__()\n    except StopIteration:\n         break\n    # 在 for 循环体中执行语句\n\
  \    ...\n```\n\n如果一个对象实现了 `__reversed__()` 特殊方法，则它可以可选地提供一个反向迭代器。该方法应该返回一个与普通迭代器具有相同接口的迭代器对象（即在迭代结束抛出\
  \ `StopIteration` 的 `__next__()` 方法）。该方法被内置函数 `reversed()` 使用。例如：\n\n点击此处查看代码图片\n\
  \n```\n>>> for x in reversed([1,2,3]):\n...     print(x)\n\n3\n\n2\n\n1\n\n>>>\n\
  ```\n\n迭代的一种常见实现技术是使用涉及 `yield` 的生成器函数。例如，\n\n点击此处查看代码图片\n\n```python\nclass FRange:\n\
  \    def __init__(self, start, stop, step):\n        self.start = start\n      \
  \  self.stop = stop\n        self.step = step\n    def __iter__(self):\n       \
  \ x = self.start\n        while x < self.stop:\n            yield x\n          \
  \  x += self.step\n\n# 使用示例：\n\nnums = FRange(0.0, 1.0, 0.1)\n\nfor x in nums:\n\
  \    print(x)     # 0.0, 0.1, 0.2, 0.3, ...\n```\n\n这之所以有效，是因为生成器函数本身符合迭代协议。以这种方式实现迭代器稍微简单一点，因为你只需要担心\
  \ `__iter__()` 方法。迭代的其余部分由生成器提供。\n\n### 4.15 属性协议\n\n表 4.6 中的方法分别使用点 (`.`) 运算符和\
  \ `del` 运算符来读取、写入和删除对象的属性。\n\n| 方法 | 说明 |\n| --- | --- |\n| `__getattribute__(self,\
  \ name)` | 返回属性 `self.name` |\n| `__getattr__(self, name)` | 如果通过 `__getattribute__()`\
  \ 未找到，则返回属性 `self.name` |\n| `__setattr__(self, name, value)` | 设置属性 `self.name\
  \ = value` |\n| `__delattr__(self, name)` | 删除属性 `del self.name` |\n\n表 4.6 属性访问方法\n\
  \n每当访问属性时，都会调用 `__getattribute__()` 方法。如果找到了属性，就会调用 `__getattr__()` 方法。在设置属性时，总是调用\
  \ `__setattr__()` 方法，在删除属性时，总是调用 `__delattr__()` 方法。这些方法非常粗犷——因为它们允许精细的控制。这在第 7\
  \ 章 中进一步讨论。\n\n### 4.16 函数协议\n\n对象可以通过提供 `__call__()` 方法来模拟函数。如果一个对象 `x` 提供了此方法，就可以像函数一样被调用。也就是说，`x(arg1,\
  \ arg2, ...)` 会调用 `x.__call__(arg1, arg2, ...)`。\n\n有很多支持函数调用的内置类型。例如，类型实现 `__call__()`\
  \ 来创建新实例。绑定方法实现 `__call__()`。\n\n### 4.17 上下文管理器协议\n\n`with` 语句允许一组语句在被称为上下文管理器的实例的控制下执行。通用语法如下：\n\
  \n```python\nwith context [ as var]:\n     statements\n```\n\n这里显示的上下文对象预计将实现 表\
  \ 4.7 中列出的方法。\n\n| 方法 | 说明 |\n| --- | --- |\n| `__enter__(self)` | 进入新上下文时调用。返回值被放置在\
  \ `with` 语句中通过 `as` 指定变量中。 |\n| `__exit__(self, type, value, tb)` | 离开上下文时调用。如果发生了异常，`type`、`value`\
  \ 和 `tb` 异常类型、值和回溯信息。 |\n\n表 4.7 上下文管理器方法\n\n执行 `with` 语句时会调用 `__enter__()` 方法。该方法返回的值被放置在可选的\
  \ `as var` 指定变量中。一旦控制流离开与 `with` 语句相关的语句块，就会调用 `__exit__()` 方法。作为参数，如果发生了异常，`__exit__()`\
  \ 接收当前的异常类型、值和回溯。如果没有处理任何错误，这三个值都设置为 `None`。`__exit__()` 方法应该返回 `True` 或 `False`\
  \ 以指示抛出的异常是否已处理。如果返回 `True`，任何待处理的异常将被清除，程序执行正常继续到 `with` 块后的第一条语句。\n\n上下文管理接口的主要用途是允许对涉及系统状态（如打开的文件、网络连接和锁）的对象进行简化资源控制。通过实现此接口，对象可以在执行离开使用对象的上下文时安全地清理资源。\n\
  \n\n\n\n\n一个经常被提及的设计目标是编写“符合 Python 习惯”（Pythonic）的代码。这可能意味着许多事情，但基本上它是鼓励你遵循 Python\
  \ 社区通用的既定用法（idioms）。这意味着要熟悉 Python 容器、迭代对象、资源管理等协议。许多许多流行的框架都使用这些协议来提供良好的用户体验。你也应该努力做到这一点。\n\
  \n在这些协议中，有三个由于其被广泛使用而值得特别关注。其一是使用 `__repr__()` 方法创建适当的对象表示。Python 程序通常会在交互式 REPL\
  \ 中进行调试和实验。使用 `print()` 或日志库输出对象也是很常见的做法。如果你能让观察对象的状态变得简单，将让所有这些工作都变得更容易。\n\n其次，遍历数据是最常见的编程任务之一。如果你要这样做，就应该让你的代码能够与\
  \ Python 的 `for` 语句配合工作。Python 的许多核心部分和标准库都是为了与迭代对象配合设计的。通过通常的方式支持迭代，你将自动获得大量的额外功能，而且你的代码对其他程序员来说将是直观的。\n\
  \n最后，使用上下文管理器和 `with` 语句来处理常见的编程模式，即语句被夹在某些启动和清理步骤之间的模式——例如，打开和关闭资源、获取和释放锁、订阅和取消订阅等。\n\
  \n# 5. 函数\n\n函数是大多数 Python 程序的的基础构建块。本章描述了函数定义、函数调用、作用域规则、闭包、装饰器以及其他函数编程特性。特别关注了与函数相关的不同编程用法、评估模型和模式。\n\
  \n## 5.1 函数定义\n\n函数使用 `def` 语句定义：\n\n```python\ndef add(x, y):\n\n    return x +\
  \ y\n```\n\n函数定义的第一部分指定了函数名和代表输入值的参数名。函数体是一系列语句，这些语句在函数被调用或应用时执行。你通过编写函数名后跟括号括起的参数来将函数应用于参数上：`a\
  \ = add(3, 4)`。在执行函数体之前，参数会从左到右进行完全求值。例如，`add(1+1, 2+2)` 先被还原为 `add(2, 4)` 然后再调用函数。这被称为*应用型求值顺序*（applicative\
  \ evaluation order）。参数的顺序和数量必须与函数定义中给出的参数匹配。如果不匹配，将抛出 `TypeError` 异常。调用函数的结构（例如所需参数的数量）被称为函数的调用签名（call\
  \ signature）。\n\n## 5.2 默认参数\n\n你可以通过在函数定义中赋值来为函数参数附加默认值。例如：\n\n点击此处查看代码图像\n\n```python\n\
  def split(line, delimiter=','):\n\n    statements\n```\n\n当函数定义了一个带有默认值的参数时，该参数以及其其后的所有参数都是可选的。在任何带有默认值的参数之后，无法指定没有默认值的参数。\n\
  \n默认参数值在函数首次被定义时求值一次，而不是在每次调用函数时求值。如果使用可变对象作为默认值，这通常会导致出意之外的行为：\n\n点击此处查看代码图像\n\n\
  ```python\ndef func(x, items=[]):\n\n    items.append(x)\n\n    return items\n\n\
  func(1)       # 返回 [1]\n\nfunc(2)       # 返回 [1, 2]\n\nfunc(3)       # 返回 [1, 2,\
  \ 3]\n```\n\n注意默认参数是如何保留从之前的调用中进行的修改的。为了防止这种情况，最好使用 `None` 并添加如下的检查：\n\n点击此处查看代码图像\n\
  \n```python\ndef func(x, items=None):\n\n     if items is None:\n\n         items\
  \ = []\n\n     items.append(x)\n\n     return items\n```\n\n作为一种通用做法，为了避免此类意外，仅使用不可变对象作为默认参数值——数字、字符串、布尔值、`None`\
  \ 等。\n\n## 5.3 变长参数\n\n如果使用最后一个参数名前缀加一个星号（`*`），则函数可以接受任意数量的参数。例如：\n\n点击此处查看代码图像\n\
  \n```python\ndef product(first, *args):\n\n    result = first\n\n    for x in args:\n\
  \n        result = result * x\n\n    return result\n\nproduct(10, 20)       # ->\
  \ 200\n\nproduct(2, 3, 4, 5)   # -> 120\n```\n\n在这种情况下，所有额外的参数都以元组的形式放入 `args` 变量中。你可以使用标准的序列操作（迭代、切片、解包等）来处理这些参数。\n\
  \n## 5.4 关键字参数\n\n可以通过显式命名每个参数并指定值来提供函数参数。这些被称为关键字参数。这是一个示例：\n\n点击此处查看代码图像\n\n```python\n\
  def func(w, x, y, z):\n\n    statements\n\n# 关键字参数调用\n\nfunc(x=3, y=22, w='hello',\
  \ z=[1, 2])\n```\n\n使用关键字参数时，只要每个参数都有一个值，顺序就不重要。如果你遗掉了任何必要参数，或者关键字名称不匹配函数中的任何参数名，将抛出\
  \ `TypeError` 异常。位置参数和关键字参数可以出现在同一个函数调用中，前提是位置参数在前。这是一个示例：\n\n点击此处查看代码图像\n\n```python\n\
  func(x=3, y=22, w='hello', z=[1, 2]) # 是\n\n# TypeError. w 有多个值\n```\n\n如果需要，可以强制使用关键字参数。这是通过在\
  \ `*` 参数之后列出参数或直接在定义中包含单个 `*` 实现的。例如：\n\n点击此处查看代码图像\n\n```python\ndef read_data(filename,\
  \ *, debug=False):\n\n    ...\n\ndef product(first, *values, scale=1):\n\n    result\
  \ = first * scale\n\n    for val in values:\n\n        result = result * val\n\n\
  \    return result\n```\n\n在这个示例中，`read_data()` 的 `debug` 参数只能通过关键字指定。这种限制通常提高了代码的可读性：\n\
  \n点击此处查看代码图像\n\n```python\ndata = read_data('Data.csv', True)        # 否。TypeError\n\
  \ndata = read_data('Data.csv', debug=True)  # 是。\n```\n\n`product()` 函数接受任意数量的位置参数和一个可选的关键字仅参数。例如：\n\
  \n点击此处查看代码图像\n\n```python\nresult = product(2,3,4)             # 结果为 24\n\nresult\
  \ = product(2,3,4, scale=10)   # 结果为 240\n```\n\n## 5.5 变长关键字参数\n\n如果函数定义的最后一个参数前缀为\
  \ `**`，则所有额外的关键字参数（不匹配任何其他参数名的参数）将被放入一个字典并传递给函数。字典中项的顺序保证与提供关键字参数的顺序一致。\n\n任意关键字参数可能在定义接受大量潜在的开放的配置选项的函数时非常有用，而如果这样做的话，将这些选项作为参数列出来就太繁琐了。这是一个示例：\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```python\ndef make_table(data, **parms):\n\n    # Get configuration\
  \ parameters from parms (a dict)\n\n    fgcolor = parms.pop('fgcolor', 'black')\n\
  \n    bgcolor = parms.pop('bgcolor', 'white')\n\n    width = parms.pop('width',\
  \ None)\n\n    ...\n\n    # No more options\n\n    if parms:\n\n         raise TypeError(f'Unsupported\
  \ configuration options {list(parms)}')\nmake_table(items, fgcolor='black', bgcolor='white',\
  \ border=1,\n\n                  borderstyle='grooved', cellpadding=10,\n      \
  \            width=400)\n```\n\n字典的 `pop()` 方法会从字典中移除一个项，如果该项未定义，则返回一个可能的默认值。代码中使用的\
  \ `parms.pop('fgcolor', 'black')` 表达式模拟了带有默认值的关键字参数的行为。\n\n### 5.6 接受所有输入输入的函数\n\
  \n通过同时使用 `*` 和 `**`，你可以编写一个接受任意参数组合的函数。位置参数以元组的形式传递，关键字参数以字典的形式传递。例如：\n\n点击此处查看代码图像\n\
  \n```python\n# 接受可数量的位置参数或关键字参数\n\ndef func(*args, **kwargs):\n\n    # args 是位置参数的元组\n\
  \n    # kwargs 是关键字参数的字典\n\n    ...\n```\n\n这种 `*args` 和 `**kwargs` 的组合使用通常用于编写器（wrappers）、装饰器（decorators）、代理以及类似的函数。例如，假设你有一个函数用于解析从迭代对象获取的文本行：\n\
  \n点击此处查看代码图像\n\n```python\ndef parse_lines(lines, separator=',', types=(), debug=False):\n\
  \n    for line in lines:\n\n        ...\n\n        statements\n\n        ...\n```\n\
  \n现在，假设你想创建一个特殊的函数，改为从文件名指定的文件解析数据。为了实现这一点，你可以这样写：\n\n点击此处查看代码图像\n\n```python\n\
  def parse_file(filename, *args, **kwargs):\n\n    with open(filename, 'rt') as file:\n\
  \n        return parse_lines(file, *args, **kwargs)\n```\n\n这种方法的好处是 `parse_file()`\
  \ 函数不需要关于 `parse_lines()` 参数的任何信息。它接受调用者提供的任何额外参数并将其传递下去。这也简化了 `parse_file()` 函数的维护。例如，如果为\
  \ `parse_lines()` 添加了新参数，这些参数也会“神奇地”适用于 `parse_file()` 函数。\n\n## 5.7 仅限位置参数\n\n\
  Python 的许多内置函数只接受按位置参数。你将通过各种帮助工具和 IDE 显示的函数调用签名中存在的斜杠（`/`）来指示这一点。例如，你可能会看到类似 `func(x,\
  \ y, /)` 的内容。这意味着斜杠之前的所有参数都只能通过位置指定。因此，你可以通过 `func(2, 3)` 调用函数，但不能通过 `func(x=2,\
  \ y=3)` 调用。为了完整起见，这种语法也可以用于定义函数时。例如，你可以写以下代码：\n\n```python\ndef func(x, y, /):\n\
  \n    pass\n\nfunc(1, 2)     # Ok\n\nfunc(1, y=2)   # Error\n```\n\n这种定义形式在代码中很少见，因为它最初只在\
  \ Python 3.8 中被支持。然而，它可以作为避免参数名称之间潜在冲突的有用方法。例如，考虑以下代码：\n\n点击此处查看代码图像\n\n```python\n\
  import time\n\ndef after(seconds, func, /, *args, **kwargs):\n\n    time.sleep(seconds)\n\
  \n    return func(*args, **kwargs)\n\ndef duration(*, seconds, minutes, hours):\n\
  \n    return seconds + 60 * minutes + 3600 * hours\n\nafter(5, duration, seconds=20,\
  \ minutes=3, hours=2)\n```\n\n在这段代码中，`seconds` 是关键字参数传递的，但它是用于传递给 `after()` 的 `duration`\
  \ 函数。在 `after()` 中使用仅限位置参数防止了与第一个出现的 `seconds` 参数发生冲突。\n\n## 5.8 命名、文档字符串和类型提示\n\
  \n函数的标准命名规范是使用小写字母，并用下划线（`_`）作为单词分隔符——例如，`read_data()` 而不是 `readData()`。如果一个函数不是为了直接使用（因为它是辅助函数或某种内部实现细节），那么它的名称通常会在前面加一个单下划线——例如，`_helper()`。然而，这些只是约定。只要名称是有效的标识符，你可以自由地为函数命名任何名称。\n\
  \n函数的名称可以通过 `__name__` 属性获取。这在调试时有时很有用。\n\n```python\n>>> def square(x):\n...  \
  \  return x * x\n\n...\n\n>>> square.__name__\n\n'square'\n\n>>>\n```\n\n函数的第一个语句通常是描述其用法的文档字符串（documentation\
  \ string）。例如：\n\n点击此处查看代码图像\n\n```python\ndef factorial(n):\n    '''Computes n.'''\n\
  \    if n <= 1:\n        return 1\n    else:\n        \n```\n\n文档字符串存储在函数的 `__doc__`\
  \ 属性中。IDE 经常访问它以提供帮助。函数还可以带有类型提示。例如：\n\n点击此处查看代码图像\n\n```python\ndef factorial(n:\
  \ int) -> int:\n    if n <= 1:\n        return 1\n    else:\n```\n\n类型提示仅存储在函数的\
  \ `__annotations__` 属性中，这是一个映射参数名称到提示的字典。第三方工具如 IDE 和代码检查器可能会使用这些提示。此类提示被解释器完全忽略。它们没有被检查、存储或评估。再次，类型提示的目的是帮助代码检查工具。除非你正在使用代码检查工具，否则不建议为函数添加类型提示。有时你会看到类型提示附加在函数的局部变量上。例如：\n\
  \n点击此处查看代码图像\n\n```python\ndef factorial(n:int) -> int:\n    result: int = 1   \
  \     # Type hinted variable\n\n    while n > 1:\n        result *= n\n\n      \
  \  n -= 1\n\n    return result\n```\n\n### 5.9 函数应用与参数传递\n\n调用函数时，函数参数是绑定到传递对象的本地名称。Python\
  \ “按原样”将提供的对象传递给函数，而不进行额外的拷贝。如果传递的可变对象（如列表或字典），则需要小心。如果发生了更改，这些更改将反映在原始对象中。这是一个示例：\n\
  \n点击此处查看代码图像\n\n```python\ndef square(items):\n    for i, x in enumerate(items):\n\
  \        items[i] = x * x    # Modify items in-place\n\na = [1, 2, 3, 4, 5]\n\n\
  square(a)         # Changes a to [1, 4, 9, 16, 25]\n```\n\n修改输入值或在后台更改程序其他状态的函数被称为具有“副作用”（side\
  \ effects）。作为一个一般原则，最好避免副作用。随着程序规模和复杂性的增加，副作用可能会成为微妙编程错误的根源——从读取函数调用可能无法看出一个函数是否具有副作用。此类函数在涉及线程和并发的程序中交互效果糟糕，因为副作用通常需要锁来保护。\n\
  \n\n\n\n区分修改对象和重新赋值变量名是重要的。考虑此函数：\n\n点击此处此处查看代码图片\n\n```python\ndef sum_squares(items):\n\
  \n    items = [x*x for x in items]    # 重新赋值 \"items\" 名称\n\n    return sum(items)\n\
  \na = [1, 2, 3, 4, 5]\n\nresult = sum_squares(a)\n\nprint(a)        # [1, 2, 3,\
  \ 4, 5]    (未改变)\n```\n\n在这个示例中，看起来 `sum_squares()` 函数似乎可能会覆盖所传递的 `items` 变量。是的，局部的\
  \ `items` 标签被重新赋值了一个新值。但原始输入值（`a`）并没有因为该操作而改变。相反，局部变量名 `items` 被绑定到了完全不同的对象——即内部列表推导式的结果。赋值变量名和修改对象之间是有区别的。当你给一个名称赋值值时，你并不是在覆盖已经存在的对象——你只是将该名称重新赋值到另一个对象上。\n\
  \n从风格上来说，具有副作用的函数通常返回 `None` 作为结果。例如，考虑列表的 `sort()` 方法：\n\n点击此处查看代码图片\n\n```python\n\
  >>> items = [10, 3, 2, 9, 5]\n\n>>> items.sort()      # 注意：没有返回值\n\n>>> items\n\n\
  [2, 3, 5, 9, 10]\n\n>>>\n```\n\n`sort()` 方法对列表项进行就地排序（in-place）。它不返回任何结果。缺乏结果是副作用的强有力指示——在这种情况下，列表的元素被重新排列了。\n\
  \n有时你已经在序列或映射中拥有数据，并想将其传递给函数。要实现这一点，你可以在函数调用中使用 `*` 和 `**`。例如：\n\n点击此处查看代码图片\n\n\
  ```python\ndef func(x, y, z):\n\n    ...\n\ns = (1, 2, 3)\n# 将序列作为参数传递\n\nresult\
  \ = func(*s)\n\n# 将映射作为关键字参数传递\n\nd = { 'x':1, 'y':2, 'z':3 }\n\nresult = func(**d)\n\
  ```\n\n你可能从多个源获取数据，甚至显式地提供某些参数，只要函数获取了所有必需参数、没有重复且调用签名中的所有内容都对齐，一切就能正常工作。你甚至可以在同一个函数调用中多次使用\
  \ `*` 和 `**`。如果你缺少参数或为参数指定了重复的值，将得到错误。Python 永远不会允许你调用不符合其签名参数的函数。\n\n## 5.10 返回值\n\
  \n`return` 语句从函数返回一个值。如果没有指定值或遗漏了 `return` 语句，将返回 `None`。要返回多个值，请将它们放在元组中：\n\n点击此处查看代码图片\n\
  \n```python\ndef parse_value(text):\n\n    '''\n    将格式为 name=val 的文本拆分为 (name,\
  \ val)\n    '''\n\n    parts = text.split('=', 1)\n\n    return (parts[0].strip(),\
  \ parts[1].strip())\n```\n\n元组中返回的值可以解包为单个变量：\n\n点击此处查看代码图片\n\n```python\nname,\
  \ value = parse_value('url=http://www.python.org')\n```\n\n有时也使用命名元组（named tuples）作为替代方案：\n\
  \n点击此处查看代码图片\n\n```python\nfrom typing import NamedTuple\n\nclass ParseResult(NamedTuple):\n\
  \n    name: str\n\n    value: str\n\ndef parse_value(text):\n    '''\n    将格式为 name=val\
  \ 的文本拆分为 (name, val)\n    '''\n\n    parts = text.split('=', 1)\n\n    return ParseResult(parts[0].strip(),\
  \ parts[1].strip())\n```\n\n命名元组的工作方式与普通元组相同（你可以执行所有相同的操作和解包），但你也可以使用命名属性来引用返回的值：\n\
  \n点击此处查看代码图片\n\n```python\nr = parse_value('url=http://www.python.org')\n\nprint(r.name,\
  \ r.value)\n```\n\n## 5.11 错误处理\n\n上一节中 `parse_value()` 函数的一个问题是错误处理。如果输入文本格式不正确且无法返回正确的结果，应该采取什么行动方案？\n\
  \n一种方法是将结果视为可选的——也就是说，函数要么通过返回答案来工作，要么返回 `None`（后者通常用于表示缺失值）。例如，可以将函数修改如下所示：\n\n\
  点击此处查看代码图片\n\n```python\ndef parse_value(text):\n\n    parts = text.split('=', 1)\n\
  \n    if len(parts) == 2:\n        return (parts[0].strip(), parts[1].strip())\n\
  \    return None\n```\n\n在这种情况下，检查结果的负担被置给了调用者：\n\n点击此处查看代码图片\n\n```python\nname,\
  \ value = parse_value('url=http://www.python.org')\n```\n\n或者，在 Python 3.8+ 中，更简洁地：\n\
  \n点击此处查看代码图片\n\n```python\nif value := parse_value('url=http://www.python.org'):\n\
  \    ...\n```\n\n与其返回 `None`，不如通过抛出异常来处理格式不正确的文本。例如：\n\n点击此处查看代码图片\n\n```python\n\
  def parse_value(text):\n\n    parts = text.split('=', 1)\n\n    if len(parts) ==\
  \ 2:\n        return (parts[0].strip(), parts[1].strip())\n    raise ValueError('Bad\
  \ value')\n```\n\n是否使用异常来处理并非显而易见。作为一个通用规则，异常是更常见的方法。然而，如果异常频繁发生，开销是很大的。\n\n## 5.12\
  \ 作用域规则\n\n每次执行函数时都会创建一个局部命名空间。该命名空间包含了参数的名称和值，以及在函数内部赋值的所有变量。在定义函数时，名称的绑定是已知的；其他在函数体内未使用但未赋值的名称（自由变量）都会在全局命名空间中查找。\n\
  \n在函数执行期间可能会发生两种与名称相关的错误。在全局环境中查找未定义的自由变量会导致 `NameError` 异常。查找未赋值的局部变量会导致 `UnboundLocalError`\
  \ 异常。后一种错误通常是控制流 bug 的结果。例如：\n\n点击此处查看代码图片\n\n```python\ndef func(x):\n    if x\
  \ > 0:\n        y = 42\n    return x + y    # 如果条件为假，y 未被赋值\n\nfunc(10)    # 返回\
  \ 52\n\nfunc(-10)   # UnboundLocalError: y referenced before assignment\n```\n\n\
  `UnboundLocalError` 有时由粗心使用就地赋值运算符引起。如 `n += 1` 的语句被处理为 `n = n + 1`。如果在给 `n` 赋初值之前使用，它将失败。\n\
  \n点击此处查看代码图片\n\n```python\ndef func():\n\n    n += 1    # 错误：UnboundLocalError\n\
  ```\n\n必须强调的是，变量名永远不会改变其作用域——它们要么是全局变量或局部变量，这在函数定义时就确定。这里有一个说明这一点的示例：\n\n点击此处查看代码图片\n\
  \n```python\nx = 42\n\ndef func():\n    print(x)    # 失败。UnboundLocalError\n\n \
  \   x = 13\n\nfunc()\n```\n\n\n\n\n在这个示例中，`print()` 函数似乎会输出全局变量 `x` 的值。然而，稍后出现的对\
  \ `x` 的赋值将 `x` 标记为了局部变量。该错误是由于访问了尚未赋值的局部变量导致的。\n\n如果你移除 `print()` 函数，你得到的代码看起来可能是在重新给全局变量\
  \ `x` 赋值。例如，考虑以下内容：\n\n点击此处查看代码图像\n\n```\nx = 42\n\ndef func():\n    x = 13\n\n\
  func()\n\n# x 仍然是 42\n```\n\n当这段代码执行时，`x` 保持了它的值 `42`，尽管看起来它似乎正在从函数 `func()` 内部修改全局变量\
  \ `x`。当变量在函数内部被赋值时，它们始终会被绑定为局部变量；因此，函数体中的变量 `x` 指向的是一个包含值 `13` 的完全新对象，而不是外部变量。要改变这种行为，请使用\
  \ `global` 语句。`global` 将名称属于全局命名空间，当需要修改全局变量时，它是必要的。这里有一个示例：\n\n点击此处查看代码图像\n\n```\n\
  x = 42\ny = 37\n\ndef func():\n    global x        # 'x' 在全局命名空间中\n    x = 13\n\
  \    y = 0\n\nfunc()\n\n# x 现在是 13。y 仍然是 37。\n```\n\n需要注意的是，使用 `global` 语句通常被认为是不良好的\
  \ Python 风格。如果你编写的代码需要函数在后台修改状态，请考虑使用类定义，并通过通过修改实例或类变量来修改状态。例如：\n\n```\nclass Config:\n\
  \    x = 42\n\ndef func():\n    Config.x = 13\n```\n\nPython 允许嵌套函数定义。这里有一个示例：\n\
  \n点击此处查看代码图像\n\n```python\ndef countdown(start):\n    n = start\n\n    def display():\
  \        # 嵌套函数定义\n        print('T-minus', n)\n\n    while n > 0:\n        display()\n\
  \        n -= 1\n```\n\n嵌套函数中的变量使用词法作用域进行绑定。这意味着，名称首先在局部作用域中解析，然后从最内层作用域到最外层作用域逐层向解析。再次，这不是一个动态过程——名称的绑定在函数定义时根据语法确定的。与全局变量一样，内部函数无法重新赋值外部函数中定义的局部变量的值。例如，这段代码无法工作：\n\
  \n点击此处查看代码图像\n\n```python\ndef countdown(start):\n    n = start\n\n    def display():\n\
  \        print('T-minus', n)\n\n    def decrement():\n        n -= 1           \
  \ # 失败：UnboundLocalError\n\n    while n > 0:\n         display()\n         decrement()\n\
  ```\n\n要修复这个问题，你可以像这样将 `n` 声明为 `nonlocal`：\n\n点击此处查看代码图像\n\n```python\ndef countdown(start):\n\
  \    n = start\n\n    def display():\n        print('T-minus', n)\n\n    def decrement():\n\
  \        nonlocal n\n        n -= 1        # 修改外部的 n\n\n    while n > 0:\n     \
  \    display()\n         decrement()\n```\n\n`nonlocal` 不能用于引用全局变量——它必须引用外部作用域中的局部变量。因此，如果函数正在给全局变量赋值，你仍然应该像之前的那样使用\
  \ `global` 声明。\n\n嵌套函数和 `nonlocal` 并不是常见的编程风格。例如，内部函数没有外部可见性，这可能会增加测试和调试。尽管如此，嵌套函数有时有助于将复杂的计算拆分为更小的部分并隐藏实现细节。\n\
  \n## 5.13 递归\n\nPython 支持递归函数。例如：\n\n点击此处查看代码图像\n\n```python\ndef sumn(n):\n   \
  \ if n == 0:\n        return 0\n    else:\n        return n + sumn(n-1)\n```\n\n\
  然而，递归函数调用的深度是有限制的。函数 `sys.getrecursionlimit()` 返回当前的最大递归深度，可以使用函数 `sys.setrecursionlimit()`\
  \ 来更改该值。默认值为 `1000`。虽然可以增加该值，但程序仍然受到主机操作系统强制的栈限制。当超过递归深度限制时，会抛出 `RuntimeError` 异常。如果增加过多，Python\
  \ 可能因为段错误或其他操作系统错误而崩溃。\n\n在实践中，只有当你处理深度嵌套的递归数据结构（如树和图）时，才会出现递归限制的问题。许多涉及树的算法天然适用于递归解决方案——如果你的数据结构太大，可能会超出栈限制。然而，有一些巧妙的变通方法；请参见第\
  \ 6 章 关于生成器的示例。\n\n## 5.14 lambda 表达式\n\n匿名——无名函数可以使用 `lambda` 定义。多个语句（如 `try` 和\
  \ `while`）不能出现在 `lambda` 中。\n\n`lambda` 的主要用途之一是定义回调函数。例如，你可以看到它与内置操作如 `sorted()`\
  \ 一起使用。例如：\n\n点击此处查看代码图像```python\n\n# 按唯一字母数量对单词排序\nresult = sorted(words, key=lambda\
  \ word: len(set(word)))\n```\n\n当 `lambda` 表达式包含自由变量（未指定为参数）时需要小心。考虑这个示例：\n\n点击此处查看代码图像```python\n\
  \nx = 2\nf = lambda y: x * y\n\nx = 3\ng = lambda y: x * y\n\nprint(f(10))     \
  \  # 输出 30\nprint(g(10))       # 输出 30\n```\n\n在这个示例中，你可能期望 `f(10)` 输出 `20`，反映了定义时\
  \ `x` 为 `2` 的事实。然而事实并非如此。作为自由变量，`f(10)` 的求可能与 `lambda` 函数定义时的值不同。这种行为有时被称为*延迟绑定*。\n\
  \n如果要在定义时捕获变量的值，请使用默认参数：\n\n点击此处查看代码图像```python\n\nx = 2\nf = lambda y, x=x: x *\
  \ y\n\nx = 3\ng = lambda y, x=x: x * y\n\nprint(f(10))       # 输出 20\nprint(g(10))\
  \       # 输出 30\n```\n\n之所以有效是因为默认参数值只在函数定义时计算一次，因此会捕获 `x` 的当前值。\n\n## 5.15 高阶函数\n\
  \nPython 支持*高阶函数*的概念。这意味着函数可以作为参数传递给其他函数，放入数据结构中，并作为函数的返回结果。函数被称为*一等公民*，这意味着处理函数的方式与处理任何其他数据没有区别。这里有一个接受另一个函数作为输入并在延迟一段时间后调用它的函数示例——例如，模拟云端微服务的性能：\n\
  \n点击此处查看代码图像```python\n\nimport time\n\ndef after(seconds, func):\n    time.sleep(seconds)\n\
  \    func()\n\n# 使用示例\ndef greeting():\n    print('Hello World')\n\nafter(10, greeting)\
  \    # 10 秒后打印'Hello World'\n```\n\n\n\n\n\n在这里，`after()` 的参数 `func` 是所谓的*回调函数*（callback\
  \ function）的示例。这意味着 `after()` 函数会“回调”到作为参数提供的函数。\n\n当一个函数被当作数据传递时，它隐式地携带了与定义该函数的环境的信息。例如，假设\
  \ `greeting()` 函数使用了如下变量：\n\n点击此处查看代码图片\n\n```python\ndef main():\n    name = 'Guido'\n\
  \n    def greeting():\n        print('Hello', name)\n\n    after(10, greeting) \
  \       # 输出：'Hello Guido'\n\nmain()\n```\n\n在这个示例中，变量 `name` 被 `greeting()` 使用，但它是外部函数\
  \ `main()` 的局部变量。当 `greeting` 被传递给 `after()` 时，该函数会记住它的环境并使用所需的 `name` 变量的值。这依赖于一种被称为*闭包*（closure）的特性。闭包是一个函数以及一个包含执行函数体所需的所有变量的环境。\n\
  \n当你基于惰性求或延迟评估的概念编写代码时，闭包和嵌套函数非常有用。上面显示的 `after()` 函数就是这一概念的范例。它接收一个不会立即评估的函数——该评估会在之后的某个时间点发生。这是一个在其他场景中也会出现的编程模式。例如，程序可能拥有仅在响应事件（按键按下、鼠标移动、网络包到达等）时执行的函数。在所有这些情况下，函数的评估都被推迟到某些事情发生。当函数最终执行时，闭包确保了函数能够获取它需要的所有内容。\n\
  \n你还可以编写创建并返回其他函数的。例如：\n\n点击此处查看代码图片\n\n```python\ndef make_greeting(name):\n  \
  \  def greeting():\n        print('Hello', name)\n    return greeting\n\nf = make_greeting('Guido')\n\
  g = make_greeting('Ada')\n\nf() # 输出：'Hello Guido'\ng() # 输出：'Hello Ada'\n```\n\n\
  在这个示例中，`make_greeting()` 函数没有执行任何有趣的计算。相反，它创建并返回了一个执行实际工作的函数 `greeting()`。这些工作只有在该函数稍后被评估时才会发生。\n\
  \n在这个示例中，变量 `f` 和 `g` 存储了两个不同版本的 `greeting()` 函数。尽管创建这些函数的 `make_greeting()` 函数已不再执行，但\
  \ `greeting()` 函数仍然记得定义过的 `name` 变量——它是每个函数闭包的一部分。\n\n关于闭包的一个注意事项是，对变量名的绑定并不是一个“快照”，而是一个动态过程——意味着闭包指向\
  \ `name` 变量以及它最近一次被赋值的值。这很微妙，但这里有一个示例说明了问题可能何处产生：\n\n点击此处查看代码图片\n\n```python\ndef\
  \ make_greetings(names):\n    funcs = []\n    for name in names:\n        funcs.append(lambda:\
  \ print('Hello', name))\n    return funcs\n\n# 尝试一下\na, b, c = make_greetings(['Guido',\
  \ 'Ada', 'Margaret'])\na()    # 打印 'Hello Margaret'\nb()    # 打印 'Hello Margaret'\n\
  c()    # 打印 'Hello Margaret'\n```\n\n在这个示例中，创建了一个不同函数的列表（使用 `lambda`）。它们看起来似乎都在使用\
  \ `name` 的唯一值，因为 `name` 在每次 `for` 循环的迭代中都会发生变化。事实并非如此。所有函数最终都使用了相同的 `name` 值——即外部函数\
  \ `make_greetings()` 返回时的值。\n\n这可能是乎意料的，而且并不是你想要的。如果你想捕获变量的副本，请像之前描述的那样作为默认参数捕获：\n\
  \n点击此处查看代码图片\n\n```python\ndef make_greetings(names):\n    funcs = []\n    for name\
  \ in names:\n        funcs.append(lambda name=name: print('Hello', name))\n    return\
  \ funcs\n\n# 尝试一下\na, b, c = make_greetings(['Guido', 'Ada', 'Margaret'])\na() \
  \   # 打印 'Hello Guido'\nb()    # 打印 'Hello Ada'\nc()    # 打印 'Hello Margaret'\n\
  ```\n\n在最后两个示例中，函数是使用 `lambda` 定义的。这通常用作创建小型回调函数的快捷方式。然而，这并不是强制要求。你可以像这样重写它：\n\n\
  点击此处查看代码图片\n\n```python\ndef make_greetings(names):\n    funcs = []\n    for name\
  \ in names:\n        def greeting(name=name):\n            print('Hello', name)\n\
  \        funcs.append(greeting)\n    return funcs\n```\n\n何时以及何处使用 `lambda` 取决于个人偏好和代码清晰度的问题。如果它让代码更难读，也许应该避免使用。\n\
  \n### 5.16 回调函数中的参数传递\n\n回调函数的一个极具挑战性的问题是向所提供的函数传递参数。考虑之前编写的 `after()` 函数：\n\n点击此处查看代码图片\n\
  \n```python\nimport time\ndef after(seconds, func):\n    time.sleep(seconds)\n \
  \   func()\n```\n\n在此代码中，`func()` 是不带参数调用的。如果你想传递额外参数，你就没辙了。例如，你可能会尝试：\n\n点击此处查看代码图片\n\
  \n```python\ndef add(x, y):\n    return x + y\n\nafter(10, add) # 失败：add() 缺少两个位置参数\n\
  ```\n\n这个问题指向了一个更高层次的函数组合问题。解决方案是使用 `lambda` 将计算封装成零参数函数：\n\n点击此处查看代码图片\n\n```python\n\
  after(10, lambda: add(2, 3))\n```\n\n这种小型零参数函数有时被称为*thunk*（停顿）。基本上，它是一个在最终被调用时才会评估的表达式。这是一种将任何表达式的评估延迟到未来的通用方法：将表达式放在\
  \ `lambda` 中，并在实际需要值时调用函数。\n\n作为使用 `lambda` 的替代方案，你可以使用 `functools.partial()` 创建一个部分评估的函数：\n\
  \n点击此处查看代码图片\n\n```python\nfrom functools import partial\nafter(10, partial(add,\
  \ 2, 3))\n```\n\n`partial()` 创建了一个可调用对象，其中一个或多个参数已经指定并缓存。它可以使不符合规范的函数匹配回调和其他应用程序中预期的调用签的有用方法。这里有更多使用\
  \ `partial()` 的示例：\n\n点击此处查看代码图片\n\n```python\ndef func(a, b, c, d):\n    print(a,\
  \ b, c, d)\n\nf = partial(func, 1, 2)   # 固定 a=1, b=2\nf(3, 4)                 \
  \  # func(1, 2, 3, 4)\nf(10, 20)                 # func(1, 2, 10, 20)\n\ng = partial(func,\
  \ 1, 2, d=4) # 固定 a=1, b=2, d=4\ng(3)                      # func(1, 2, 3, 4)\n\
  g(10)                     # func(1, 2, 10, 4)\n```\n\n\n\n\n`partial()` 和 `lambda`\
  \ 可以用于相似的目的，但这两种技术之间在语义上存在重要的区别。使用 `partial()` 时，参数在部分函数首次定义时就会被求值并绑定。而对于零参数的 `lambda`，参数是在之后\
  \ `lambda` 函数实际执行时才被求值并绑定（所有内容的评估都是延迟执行的）。为了说明这一点：\n\n点击此处查看代码图片\n\n```python\n\
  >>> def func(x, y):\n...    return x + y\n...\n>>> a = 2\n>>> b = 3\n>>> f = lambda:\
  \ func(a, b)\n>>> g = partial(func, a, b)\n>>> a = 10\n>>> b = 20\n>>> f()    #\
  \ 使用 a, b 的当前值\n30\n>>> g()    # 使用 a, b 的初始值\n5\n>>>\n```\n\n由于 partial 是经过完全评估的，因此由\
  \ `partial()` 创建的可调用对象是就可以序列化为字节、保存到文件中、甚至跨网络连接进行传输的对象（例如使用 `pickle` 标准库模块）。这在使用\
  \ `lambda` 函数是无法实现的。因此，在需要传递函数的应用中（可能传递给运行在不同进程或不同机器上的 Python 解释器），你会发现 `partial()`\
  \ 更有适应性。\n\n顺带提一下，部分函数应用与被称为 `currying`（柯里化）的概念密切相关。柯里化是一种函数编程技术，将多参数函数表示为一系列嵌套的单参数函数。这里有一个示例：\n\
  \n点击此处查看代码图片\n\n```python\n# 三参数函数\ndef f(x, y, z):\n    return x + y + z\n\n# 柯里化版本\n\
  def fc(x):\n    return lambda y: (lambda z: x + y + z)\n\n# 使用示例\na = f(2, 3, 4)\
  \      # 三参数函数\nb = fc(2)(3)(4)     # 柯里化版本\n```\n\n这不是常见的 Python 编程风格，这样做的实际理由很少。然而，有时你会在与花费了太多时间研究\
  \ `lambda` 演算等等的程序员聊天时，听到“柯里化”这个词。这种处理多个参数的技术是为了纪念著名的逻辑学家哈斯凯尔·柯里（Haskell Curry）。了解它是什么，这可能很有用——万一你在社交活动中偶然遇到一群正在进行激烈口论战的函数式程序员呢。\n\
  \n回到参数传递的原始问题，向回调函数传递参数的另一种方法是将它们作为外部调用函数的参数单独接收。考虑以下这个 `after()` 函数的版本：\n\n点击此处查看代码图片\n\
  \n```python\ndef after(seconds, func, *args):\n    time.sleep(seconds)\n    func(*args)\n\
  \nafter(10, add, 2, 3)   # 10 秒后调用 add(2, 3)\n```\n\n你会注意到不支持向 `func()` 传递关键字参数。这是设计使然的。关键字参数的一个问题是，给定函数的参数名称可能与已使用的参数名称冲突（即\
  \ `seconds` 和 `func`）。关键字参数还可能被留用于指定 `after()` 函数本身的选项。例如：\n\n点击此处查看代码图片\n\n```python\n\
  def after(seconds, func, *args, debug=False):\n    time.sleep(seconds)\n    if debug:\n\
  \        print('About to call', func, args)\n    func(*args)\n```\n\n然而，一切并非无可挽回。如果你需要为\
  \ `func()` 指定关键字参数，你仍然可以使用 `partial()` 来实现。例如：\n\n点击此处查看代码图片\n\n```python\nafter(10,\
  \ partial(add, y=3), 2)\n```\n\n如果你想让 `after()` 函数接受关键字参数，一种安全方法可能是使用位置仅限参数。例如：\n\
  \n点击此处查看代码图片\n\n```python\ndef after(seconds, func, debug=False, /, *args, **kwargs):\n\
  \    time.sleep(seconds)\n    if debug:\n        print('About to call', func, args,\
  \ kwargs)\n    func(*args, **kwargs)\n\nafter(10, add, 2, y=3)\n```\n\n另一个可能令人不安的洞察是，`after()`\
  \ 实际上代表了合并在一起两个不同的函数调用。也许传递参数的问题可以分解为两个函数：\n\n点击此处查看代码图片\n\n```python\ndef after(seconds,\
  \ func, debug=False):\n    def call(*args, **kwargs):\n        time.sleep(seconds)\n\
  \        if debug:\n            print('About to call', func, args, kwargs)\n   \
  \     func(*args, **kwargs)\n    return call\n\nafter(10, add)(2, y=3)\n```\n\n\
  现在，`after()` 的参数与 `func` 的参数之间完全没有冲突。但是，这样做可能会在你和你的同事之间引入冲突。\n\n### 5.17 从回调返回结果\n\
  \n另一个在前节中未解决的问题是返回回调的结果。考虑这个修改后的 `after()` 函数：\n\n点击此处查看代码图片\n\n```python\ndef after(seconds,\
  \ func, *args):\n    time.sleep(seconds)\n    return func(*args)\n```\n\n这种方法可行，但存在一些微妙的情况，涉及到两个函数——`after()`\
  \ 函数本身和提供的回调。一个问题是异常处理。例如，尝试这些：\n\n点击此处查看代码图片\n\n```python\nafter(\"1\", add, 2)\
  \   # TypeError：预期为整数\nafter(1, add, \"2\")   # TypeError：无法连接到 str\n```\n\n`TypeError`\
  \ 在两种情况下都会抛出，但原因不同。第一个错误由于 `after()` 身——`time.sleep()`。\n\n如果要区分这两种情况，有几种方法。一种方法是依赖异常链。想法是将回调的错误封装在不同的异常中，以便与其他错误分开处理。例如：\n\
  \n点击此处查看代码图片\n\n```python\nclass CallbackError(Exception):\n    pass\n\ndef after(seconds,\
  \ func, *args):\n    time.sleep(seconds)\n    try:\n        return func(*args)\n\
  \    except Exception as err:\n        raise CallbackError('Callback failed') from\
  \ err\n```\n\n这段修改后的代码将回调错误隔离到它们自己的类别中。像这样使用：\n\n点击此处查看代码图片\n\n```python\ntry:\n\
  \    r = after(delay, add, y)\nexcept CallbackError as err:\n    print(\"It failed.\
  \ Reason\", err.__cause__)\n```\n\n如果 `after()` 的执行出现问题，该异常将未捕获地传播。相反，与回调执行相关的问题将被捕获并报告为\
  \ `CallbackError`。这一切非常微妙，但在实践中，管理错误是很的。这种方法使得归因更加精确，`after()` 的行为更容易记录。具体来说，如果回调出现问题，它总是会被报告为\
  \ `CallbackError`。\n\n另一种方案是将回调的结果封装进某种同时持有值和错误的类型实例中。例如，定义这样一个类：\n\n点击此处查看代码图片\n\
  \n```python\nclass Result:\n    def __init__(self, value=None, exc=None):\n    \
  \    self._value = value\n        self._exc = exc\n\n    def result(self):\n   \
  \     if self._exc:\n            raise self._exc\n        else:\n            return\
  \ self._value\n```\n\n然后，使用这个类从 `after()` 函数返回结果：\n\n点击此处查看代码图片\n\n\n\n\n\n```python\n\
  def after(seconds, func, *args):\n    time.sleep(seconds)\n    try:\n        return\
  \ Result(value=func(*args))\n    except Exception as err:\n        return Result(exc=err)\n\
  \n# Example use:\n\nr = after(1, add, 2, 3)\nprint(r.result())            # Prints\
  \ 5\n\ns = after(\"1\", add, 2, 3)    # Immediately raises TypeError. Bad sleep()\
  \ arg.\n\nt = after(1, add, \"2\", 3)    # Returns a \"Result\"\n\nprint(t.result())\
  \            # Raises TypeError\n```\n\n第二种方法通过将回调函数的结果报告推迟到单独的步骤来实现。如果 `after()`\
  \ 出现问题，它会立即报告。如果回调函数 `func()` 出现问题，则会在用户尝试通过 `result()` 方法获取结果时进行报告。\n\n这种将结果包装在特殊实例中以备以后解包的风格，在现代编程语言中是一种越来越常见的模式。使用这种模式的原因之一是它方便了类型检查。例如，如果你为\
  \ `after()` 添加了类型提示，它的行为就是完全定义的——它始终返回一个 `Result`，而不返回其他内容：\n\n点击此处查看代码图像\n\n```python\n\
  def after(seconds, func, *args) -> Result:\n    ...\n```\n\n虽然在 Python 代码中看到这种模式并不常见，但在处理线程和进程等并发原语时，它会经常出现。例如，所谓的\
  \ `Future` 实例在与线程池工作时表现就像这样。例如：\n\n点击此处查看代码图像\n\n```python\nfrom concurrent.futures\
  \ import ThreadPoolExecutor\n\npool = ThreadPoolExecutor(16)\n\nr = pool.submit(add,\
  \ 2, 3)     # Returns a Future\n\nprint(r.result())              # Unwrap the Future\
  \ result\n```\n\n## 5.18 装饰器 (Decorators)\n\n装饰器是一个为另一个函数创建包装器的函数。这种包装的主要目的是为了改变或增强被包装对象的行为。在语法上，装饰器使用特殊的\
  \ `@` 符号表示，如下：\n\n```python\n@decorate\n\ndef func(x):\n     ...\n```\n\n上述代码是以下内容的简写形式：\n\
  \n```python\ndef func(x):\n     ...\n\nfunc = decorate(func)\n```\n\n在示例中，定义了一个函数\
  \ `func()`。然而，在定义之后，函数对象本身被传递给函数 `decorate()`，该函数返回一个替换原始 `func` 的对象。\n\n作为一个具体实现的示例，这里有一个\
  \ `@trace` 装饰器，它可以向函数添加调试信息：\n\n点击此处查看代码图像\n\n```python\ndef trace(func):\n    def\
  \ call(*args, **kwargs):\n        print('Calling', func.__name__)\n        return\
  \ func(*args, **kwargs)\n    return call\n\n# Example use\n\n@trace\ndef square(x):\n\
  \    return x * x\n```\n\n在这段代码中，`trace()` 创建了一个包装函数，它写入一些调试输出，然后调用原始函数对象。因此，如果你调用\
  \ `square()`，你将看到包装器中 `print()` 函数的输出。\n\n如果有那么简单就好了！在实践中，函数还包含元数据，如函数名、文档字符串和类型提示。如果你在函数周围放置一个包装器，这些信息就会被隐藏。在编写装饰器时，最佳实践是使用示例所示的\
  \ `@wraps()` 装饰器：\n\n点击此处查看代码图像\n\n```python\nfrom functools import wraps\n\ndef\
  \ trace(func):\n    @wraps(func)\n    def call(*args, **kwargs):\n        print('Calling',\
  \ func.__name__)\n        return func(*args, **kwargs)\n    return call\n```\n\n\
  `@wraps()` 装饰器会将各种函数元数据复制到替换函数。在这种情况下，来自给定函数 `func()` 的元数据被复制到返回的包装函数 `call()` 中。\n\
  \n当应用装饰器时，它们必须单独成一行并紧跟在函数之前。可以应用多个装饰器。这里有一个例子：\n\n```python\n@decorator1\n@decorator2\n\
  def func(x):\n    pass\n```\n\n在这种情况下，装饰器的应用方式如下：\n\n点击此处查看代码图像\n\n```python\ndef\
  \ func(x):\n    pass\n\nfunc = decorator1(decorator2(func))\n```\n\n装饰器出现的顺序可能很重要。例如，在类定义中，像\
  \ `@classmethod` 和 `@staticmethod` 这样的装饰器通常必须放在最外层。例如：\n\n点击此处查看代码图像\n\n```python\n\
  class SomeClass(object):\n    @classmethod            # 是\n    @trace\n    def a(cls):\n\
  \        pass\n\n    @trace                  #否。失败。\n    @classmethod\n    def b(cls):\n\
  \        pass\n```\n\n这种位置限制的原因与 `@classmethod` 返回的值有关。有时装饰器返回的是一个与普通函数不同的对象。如果最外层的装饰器没有预料到这一点，就会出错。在这种情况下，`@classmethod`\
  \ 创建了一个 `classmethod` 描述符对象（参见第 7 章）。除非 `@trace` 装饰器在编写时考虑了这一点，否则如果装饰器列表顺序错误，将会失败。\n\
  \n装饰器也可以接受参数。假设你想更改 `@trace` 装饰器以允许此类自定义消息：\n\n点击此处查看代码图像\n\n```python\n@trace(\"\
  You called {func.__name__}\")\ndef func():\n    pass\n```\n\n如果提供了参数，装饰过程的语义如下：\n\
  \n点击此处查看代码图像\n\n```python\ndef func():\n    pass\n\n# 创建装饰函数\n\ntemp = trace(\"\
  You called {func.__name__}\")\n\n# 将其应用到 func\nfunc = temp(func)\n```\n\n在这种情况下，接受参数的最外层函数负责创建一个装饰函数。然后调用该函数传入待装饰的函数，以获取最终结果。这里是装饰器的实现可能的样子：\n\
  \n点击此处查看代码图像\n\n```python\nfrom functools import wraps\n\ndef trace(message):\n\
  \    def decorate(func):\n        @wraps(func)\n        def wrapper(*args, **kwargs):\n\
  \            print(message.format(func=func))\n            return func(*args, **kwargs)\n\
  \        return wrapper\n    return decorate\n```\n\n这种实现的一个有趣特性是，外层函数实际上是一种“装饰器工厂”。假设你发现自己在编写如下代码：\n\
  \n点击此处查看代码图像\n\n```python\n@trace('You called {func.__name__}')\ndef func1():\n\
  \    pass\n\n@trace('You called {func.__name__}')\ndef func2():\n    pass\n```\n\
  \n那很快就会变得繁琐。你可以通过如下调用一次装饰器函数并重用其结果来简化：\n\n点击此处查看代码图像\n\n```python\nlogged = trace('You\
  \ called {func.__name__}')\n\n@logged\ndef func1():\n    pass\n\n@logged\ndef func2():\n\
  \    pass\n```\n\n装饰器并不一定替换原始函数。有时装饰器仅执行注册等操作。例如，如果你正在构建一个事件处理器注册表，你可以定义一个如下工作的装饰器：\n\
  \n点击此处查看代码图像\n\n```python\n@eventhandler('BUTTON')\ndef handle_button(msg):\n  \
  \   ...\n\n@eventhandler('RESET')\ndef handle_reset(msg):\n     ...\n```\n\n这里是管理它的装饰器：\n\
  \n点击此处查看代码图像\n\n```python\n# 事件处理器装饰器\n\n_event_handlers = { }\n\ndef eventhandler(event):\n\
  \    def register_function(func):\n        _event_handlers[event] = func\n     \
  \   return func\n    return register_function\n```\n\n## 5.19 Map, Filter, and Reduce\n\
  \n\n\n\n\n熟悉函数式语言的程序员经常会询问 `map`、`filter` 和 `reduce` 等常见的列表操作。这些许多功能可以通过列表推导式和生成器表达式来实现。例如：\n\
  \n点击此处查看代码图片\n\n```\ndef square(x):\n    return x * x\n\nnums = [1, 2, 3, 4, 5]\n\
  \nsquares = [ square(x) for x in nums ]    # [1, 4, 9, 16, 25]\n```\n\n从技术上讲，你甚至不需要那个短的单行函数。你可以这样写：\n\
  \n点击此处查看代码图片\n\n```\nsquares = [ x * x for x in nums ]\n```\n\n过滤也可以列表推导式完成：\n\n\
  点击此处查看代码图片\n\n```\na = [ x for x in nums if x > 2 ]    # [3, 4, 5]\n```\n\n如果你使用生成器表达式，你将得到一个生成器，它通过迭代量产生结果。例如：\n\
  \n点击此处查看代码图片\n\n```\nsquares = (x*x for x in nums)    # 创建一个生成器\n\nfor n in squares:\n\
  \    print(n)\n```\n\nPython 提供了一个内置的 `map()` 函数，它与使用生成器表达式映射函数是相同的。例如，上面的示例可以写成：\n\
  \n点击此处查看代码图片\n\n```\nsquares = map(lambda x: x*x, nums)\n\nfor n in squares:\n \
  \   print(n)\n```\n\n内置的 `filter()` 函数创建一个过滤数值值的生成器：\n\n点击此处查看代码图片\n\n```\nfor n\
  \ in filter(lambda x: x > 2, nums):\n    print(n)\n```\n\n如果你想累积或归约值，可以使用 `functools.reduce()`。例如：\n\
  \n点击此处查看代码图片\n\n```python\nfrom functools import reduce\n\ntotal = reduce(lambda\
  \ x, y: x + y, nums)\n```\n\n在通用形式下，`reduce()` 接受一个双参数函数、一个迭代对象和一个初始值。以下是几个示例：\n\
  \n点击此处查看代码图片\n\n```\nnums = [1, 2, 3, 4, 5]\n\ntotal = reduce(lambda x, y: x + y,\
  \ nums)         # 15\n\nproduct = reduce(lambda x, y: x * y, nums, 1)    # 120\n\
  \npairs = reduce(lambda x, y: (x, y), nums, None)\n\n# (((((None, 1), 2), 3), 4),\
  \ 5)\n```\n\n`reduce()` 在提供的迭代对象上从左到右累积值。这被称为左折叠（left-fold）操作。以下是 `reduce(func,\
  \ items, initial)` 的伪代码：\n\n点击此处查看代码图片\n\n```python\ndef reduce(func, items, initial):\n\
  \    result = initial\n    for item in items:\n        result = func(result, item)\n\
  \    return result\n```\n\n在实践中使用 `reduce()` 可能会令人困惑。此外，常见的归约操作如 `sum()`、`min()`\
  \ 和 `max()` 已经是内置的。如果你使用这些函数而不是尝试用 `reduce` 实现，你的代码将更容易读。\n\n## 5.20 函数内省、属性和签名\n\
  \n正如你所看到的，函数是对象——这意味着它们可以赋值给变量、放入数据结构中，并像任何其他数据一样使用。它们还可以通过多种方式进行检查。表 5.1 显示了一些函数的常用属性。这些属性在调试、日志记录和其他涉及函数的可能会非常有用。\n\
  \n| 属性 | 描述 |\n| --- | --- |\n| `f.__name__` | 函数名 |\n| `f.__qualname__` | 全限定名（嵌套时）\
  \ |\n| `f.__module__` | 定义所在的模块名 |\n| `f.__doc__` | 文档字符串 |\n| `f.__annotations__`\
  \ | 类型提示 |\n| `f.__globals__` | 全局命名空间的字典 |\n| `f.__closure__` | 闭包变量（如果有） |\n|\
  \ `f.__code__` | 底层代码对象 |\n\n表 5.1 函数属性\n\n\n\n\n在此示例中，可选参数 `z` 将在对 `func` 的进一步检查中被隐藏。相反，`inspect.signature()`\
  \ 将返回附加的签名（signature）。\n\n## 5.21 环境检查\n\n函数可以使用内置函数 `globals()` 和 `locals()` 来检查其执行环境。`globals()`\
  \ 返回一个作为全局命名空间的字典。这与 `func.__globals__` 属性相同。该字典通常是包含闭包模块内容的字典。`locals()` 返回一个包含所有局部变量和闭包变量值的字典。此字典并不是用于存储这些变量的实际数据结构。局部变量可以来自外部函数（通过闭包），也可以在内部定义。`locals()`\
  \ 会收集所有这些变量并将它们放入字典中供你使用。修改 `locals()` 字典中的项对底层变量没有影响。例如：\n\n点击此处查看代码图片\n\n```python\n\
  def func():\n    y = 20\n    locs = locals()\n    locs['y'] = 30       # 尝试修改 y\n\
  \    print(locs['y'])     # 打印 30\n    print(y)             # 打印 20\n```\n\n如果你想让更改生效，必须使用普通赋值将更改复制回局部变量。\n\
  \n点击此处查看代码图片\n\n```python\ndef func():\n    y = 20\n    locs = locals()\n    locs['y']\
  \ = 30\n    y = locs['y']\n```\n\n函数可以使用 `inspect.currentframe()` 获取其自身的栈帧（stack\
  \ frame）。函数可以通过通过帧上的 `f.f_back` 属性追踪栈回溯，从而获取其调用者的栈帧。这里有一个示例：\n\n点击此处查看代码图片\n\n```python\n\
  import inspect\n\ndef spam(x, y):\n    z = x + y\n    grok(z)\n\ndef grok(a):\n\
  \    b = a * 10\n    # 输出: {'a':5, 'b':50 }\n    print(inspect.currentframe().f_locals)\n\
  \    # 输出: {'x':2, 'y':3, 'z':5 }\n    print(inspect.currentframe().f_back.f_locals)\n\
  \nspam(2, 3)\n```\n\n有时你会看到使用 `sys._getframe()` 函数获取的栈帧。例如：\n\n点击此处查看代码图片\n\n```python\n\
  import sys\n\ndef grok(a):\n    b = a * 10\n    print(sys._getframe(0).f_locals)\
  \    # 我\n    print(sys._getframe(1).f_locals)    # 我的调用者\n```\n\n表 5.2 中的属性对于检查帧可能非常有用。\n\
  \n| 属性 | 描述 |\n| --- | --- |\n| `f.f_back` | 上一个栈帧（通向调用者） |\n| `f.f_code` | 正在执行的代码对象\
  \ |\n| `f.f_locals` | 局部变量字典 (`locals()`) |\n| `f.f_globals` | 用于全局变量的字典 (`globals()`)\
  \ |\n| `f.f_builtins` | 用于内置名的字典 |\n| `f.f_lineno` | 行号 |\n| `f.f_lasti` | 当前指令。这是\
  \ `f_code` 字节码字符串中的索引 |\n| `f.f_trace` | 在每行源代码开始时调用的函数 |\n\n表 5.2 帧属性\n\n查看栈帧对于调试和代码检查非常用。例如，这里有一个有趣的调试函数，它允许你查看调用者所选变量的值：\n\
  \n点击此处查看代码图片\n\n```python\nimport inspect\nfrom collections import ChainMap\n\n\
  def debug(*varnames):\n    f = inspect.currentframe().f_back\n    vars = ChainMap(f.f_locals,\
  \ f.f_globals)\n    print(f'{f.f_code.co_filename}:{f.f_lineno}')\n    for name\
  \ in varnames:\n        print(f'    {name} = {vars[name]!r}')\n\n# 示例用法\ndef func(x,\
  \ y):\n    z = x + y\n    debug('x','y')  # 显示 x 和 y 以及文件/行号\n    return z\n```\n\
  \n### 5.22 动态代码执行与创建\n\n`exec(str [, globals [, locals]])` 函数执行包含任意 Python 代码的字符串。传递给\
  \ `exec()` 的代码执行方式就像该代码实际上出现在 `exec` 操作的位置一样。这里有一个示例：\n\n点击此处查看代码图片\n\n```python\n\
  a = [3, 5, 10, 13]\nexec('for i in a: print(i)')\n```\n\n传递给 `exec()` 的代码在调用者的局部和全局命名空间内执行。但请注意，对局部变量的更改没有影响。例如：\n\
  \n点击此处查看代码图片\n\n```python\ndef func():\n    x = 10\n    exec('x = 20')\n    print(x)\
  \  # 打印 10\n```\n\n### 5.23 异步函数与 await\n\nPython 提供了许多与异步执行相关的语言特性。这些包括所谓的*异步函数*（协程）和可等待对象（awaitables）。它们主要用于涉及并发的\
  \ `asyncio` 模块。然而，其他库也会基于这些特性。\n\n异步函数（或协程）通过在普通函数定义加上 `async` 关键字来定义。例如：\n\n点击此处查看代码图片\n\
  \n```python\nasync def greeting(name):\n    print(f'Hello {name}')\n```\n\n如果你调用这样的函数，你会发现它并没有以通常的方式执行——事实上，它根本没有执行。相反，它返回了一个协程对象的实例。例如：\n\
  \n点击此处查看代码图片\n\n```python\n>>> greeting('Guido')\n<coroutine object greeting at\
  \ 0x10417dc8>\n\n>>>\n```\n\n要让函数运行，它必须在其他代码的监督下执行。一种常见的选择是 `asyncio`。例如：\n\n点击此处查看代码图片\n\
  \n```python\n>>> import asyncio\n>>> asyncio.run(greeting('Guido'))\nHello Guido\n\
  >>>\n```\n\n示例引出了异步函数最重要的特性——它们永远不会独立运行。始终需要某种管理程序或库代码来执行它们。这不一定是如所示的 `asyncio`，但总会有东西参与。\n\
  \n除了被管理之外，异步函数的求值方式与其他任何 Python 函数相同。语句按顺序执行，所有的控制流功能都有效。如果你想返回一个结果，请使用普通的 `return`\
  \ 语句。例如：\n\n点击此处查看代码图片\n\n```python\nasync def make_greeting(name):\n    return\
  \ f'Hello {name}'\n```\n\n\n\n传递给 `return` 的值由用于执行异步函数的外部 `run()` 函数返回。例如：\n\n点击此处查看代码图片\n\
  \n```python\n>>> import asyncio\n\n>>> a = asyncio.run(make_greeting('Paula'))\n\
  \n>>> a\n\n'Hello Paula'\n\n>>>\n```\n\n异步函数可以使用像这样的 `await` 表达式来调用其他异步函数：\n\n点击此处查看代码图片\n\
  \n```python\nasync def make_greeting(name):\n    return f'Hello {name}'\n\nasync\
  \ def main():\n    for name in ['Paula', 'Thomas', 'Lewis']:\n        a = await\
  \ make_greeting(name)\n        print(a)\n\n# 运行它。将看到对 Paula、Thomas 和 Lewis 的问候。\n\
  \nasyncio.run(main())\n```\n\n`await` 的使用仅在包含它的 `async` 函数定义内部有效。它也是使异步函数执行的必要部分。如果你漏掉了\
  \ `await`，你会发现代码会报错。\n\n对 `await` 的要求暗示了异步函数的一个通用用法问题。也就是说，它们不同的评估模型阻止了它们与 Python\
  \ 的其他部分结合使用。具体来说，无法编写出从非异步函数调用异步函数的代码：\n\n点击此处查看代码图片\n\n```python\nasync def twice(x):\n\
  \    return 2 * x\n\ndef main():\n    print(twice(2))         # 错误。没有执行函数\n    print(await\
  \ twice(2))   # 错误。在这里不能使用 await。\n```\n\n在同一个应用程序中结合异步和非异步功能是一个复杂的话题，特别是当你考虑到涉及高阶函数、回调和装饰器的编程技术时。在大多数情况下，对异步函数的支持必须作为特殊情况来构建。\n\
  \nPython 在迭代器和上下文管理器协议上恰恰是这样做的。例如，异步上下文管理器可以使用所示所示在类上使用 `__aenter__()` 和 `__aexit__()`\
  \ 方法来定义：\n\n点击此处查看代码图片\n\n```python\nclass AsyncManager(object):\n    def __init__(self,\
  \ x):\n        self.x = x\n\n    async def yow(self):\n        pass\n\n    async\
  \ def __aenter__(self):\n        return self\n\n    async def __aexit__(self, ty,\
  \ val, tb):\n        pass\n```\n\n注意这些方法是异步函数，因此可以使用 `await` 执行其他异步函数。要使用此类管理器，你必须使用特殊的\
  \ `async with` 语法，该语法仅在异步函数内部合法的：\n\n点击此处查看代码图片\n\n```python\n# 示例用法\n\nasync def\
  \ main():\n    async with AsyncManager(42) as m:\n         await m.yow()\n\nasyncio.run(main())\n\
  ```\n\n类同样可以通过定义方法 `__aiter__()` 和 `__anext__()` 来定义一个异步迭代器。这些方法由 `async for` 语句使用，而该语句只能出现在异步函数内部。从实践角度来看，异步函数的行为与普通函数完全相同——只是它必须在如\
  \ `asyncio` 这样的管理环境中执行。除非你自觉决定在这样的环境中工作，否则你应该继续后续并忽略异步函数。\n\n## 5.2 结语：关于函数和组合的思考\n\
  \n任何系统都是作为组件的组合构建的。在 Python 中，这些组件包含了各种库和对象。然而，支撑一切的是用于组合系统的函数以及移动数据的基本机制。本章的大部分讨论集中在函数的性质及其接口上。输入是如何呈现给函数的？输出是如何处理的？错误是如何报告的？如何对所有这些内容进行紧密控制并更好地理解？在处理大型项目时，函数之间的交互作为潜在的复杂性来源值得思考。这通常意味着直观易用的\
  \ API 与一团糟之间的区别。\n\n# 6 生成器\n\n生成器函数是 Python 最有趣且强大的特性之一。生成器通常被呈现为定义新类型迭代模式的方便方式。然而，它们远不止于：生成器还可以改变函数的整个执行模型。本章将讨论生成器、生成器委托、基于生成器的协程以及生成器的常见应用。\n\
  \n### 6.1 生成器和 `yield`\n\n如果一个函数使用了 `yield` 关键字，它定义了一个名为生成器的对象。生成器的主要用途是产生用于迭代的值。这里有一个示例：\n\
  \n点击此处查看代码图片\n\n```python\ndef countdown(n):\n     print('Counting down', n)\n \
  \    while n > 0:\n          yield n\n          n -= 1\n\n# 示例用法\nfor x in countdown(10):\n\
  \    print('T-minus', x)\n```\n\n如果你调用这个函数，你会发现它的任何代码都没有开始执行。例如：\n\n点击此处查看代码图片\n\
  \n```python\n>>> c = countdown(10)\n>>> c\n<generator object countdown at 0x105f734>\n\
  ```\n\n相反，一个生成器对象被创建了。只有当你迭代它时，代码才会开始执行。例如，你会看到 `<generator object countdown at\
  \ 0x105f734>`。一个生成器对象，只有当你开始迭代它时，函数才会执行语句。一种方法是在它上调用 `next()`：\n\n点击此处查看代码图片\n\n\
  ```python\n>>> next(c)\nCounting down 10\n10\n>>> next(c)\n9\n```\n\n当 `next()`\
  \ 被调用时，生成器函数执行直到遇到 `yield` 语句。`yield` 语句返回一个结果，此时函数的执行被暂停。在被暂停期间，生成器保留了所有的局部变量和执行环境。`next()`\
  \ 是调用生成器 `__next__()` 方法的简写。例如，你也可以这样做：\n\n点击此处查看代码图片\n\n```python\n>>> c.__next__()\n\
  8\n>>> c.__next__()\n7\n```\n\n通常我们不会直接在生成器上调用 `next()`，而是使用 `for` 语句或其他消耗项的操作。例如：\n\
  \n点击此处查看代码图片\n\n```python\nfor n in countdown(10):\n     pass\na = sum(countdown(10))\n\
  ```\n\n生成器函数产生项目，直到它返回——通过到达函数末或使用 `return` 语句。这会抛出一个 `StopIteration` 异常，终止 `for`\
  \ 循环。如果生成器函数返回一个非 `None` 值，它会附加到 `StopIteration` 异常上。例如，这个生成器函数使用了 `yield` 和 `return`：\n\
  \n```python\ndef func():\n    yield 37\n    return 42\n```\n\n以下是代码执行的方式：\n\n点击此处查看代码图片\n\
  \n```python\n>>> f = func()\n>>> f\n<generator object func at 0x10b7cd48>\n>>> next(f)\n\
  37\n>>> next(f)\nTraceback (most recent call last):\n  File \"<stdin>\", line 1,\
  \ in <module>\nStopIteration: 42\n```\n\n注意返回值附加在 `StopIteration`。为了收集这个值，你需要显式地捕获\
  \ `StopIteration` 并提取值：\n\n点击此处查看代码图片\n\n```python\ntry:\n    next(f)\nexcept StopIteration\
  \ as e:\n    value = e.value\n```\n\n通常，生成器函数不返回值。生成器几乎总是被 `for` 循环消耗的，在那里没有方法获取异常值。这意味着获取值的唯一实际方法是通过显式的\
  \ `next()` 调用来手动驱动生成器。大多数涉及生成器的代码并没有这样做。\n\n生成器的一个微妙问题是生成器函数可能只被部分消耗。例如，考虑这段提早放弃循环的代码：\n\
  \n点击此处查看代码图片\n\n\n\n\n\n```python\nfor n in countdown(10):\n\n     if n == 2:\n\n\
  \         break\n\n     statements\n```\n\n在这个示例中，`for` 循环通过调用 `break` 终止，相关的生成器永远不会运行到完成。如果对于生成器函数执行某些清理操作至关重要，请确保你使用了\
  \ `try-finally` 或上下文管理器（context manager）。例如：\n\n点击此处查看代码\n\n```python\ndef countdown(n):\n\
  \n    print('Counting down from', n)\n\n    try:\n\n         while n > 0:\n\n  \
  \            yield n\n\n              n = n - 1\n\n    finally:\n\n         print('Only\
  \ made it to', n)\n```\n\n生成器保证即使生成器没有被完全消耗，也会执行 `finally` 块的代码——它会在遗弃的生成器被垃圾回收时执行。同样，任何涉及上下文管理器的清理代码也保证在生成器终止时执行：\n\
  \n点击此处查看代码\n\n```python\ndef func(filename):\n\n    with open(filename) as file:\n\
  \n         ...\n\n         yield data\n\n         ...\n\n    # file closed here\
  \ even if generator is abandoned\n```\n\n妥善清理资源是一个棘手的问题。只要你使用 `try-finally` 或上下文管理器等结构，即使生成器被提前终止，它们也保证会执行正确的操作。\n\
  \n### 6.2 可重启的生成器\n\n通常情况下，生成器函数只执行一次。例如：\n\n点击此处查看代码\n\n```python\n>>> c = countdown(3)\n\
  \n>>> for n in c:\n\n...    print('T-minus', n)\n\n...\n\nT-minus 3\n\nT-minus 2\n\
  \nT-minus 1\n\n>>> for n in c:\n\n...    print('T-minus', n)\n\n...\n\n>>>\n```\n\
  \n如果你想要一个允许重复迭代的实例，请将其定义为一个类，并将 `__iter__()` 方法定义为生成器：\n\n点击此处查看代码\n\n```python\n\
  class countdown:\n\n    def __init__(self, start):\n\n        self.start = start\n\
  \n    def __iter__(self):\n\n        n = self.start\n\n        while n > 0:\n\n\
  \            yield n\n\n            n -= 1\n```\n\n这之所以有效，是因为每次迭代时，`__iter__()`\
  \ 都会创建一个全新的生成器。\n\n### 6.3 生成器委托\n\n生成器的一个基本特性是，包含 `yield` 的函数永远不会自己执行——它必须由其他代码通过\
  \ `for` 循环或显式的 `next()` 调用来驱动。这使得编写涉及 `yield` 的库函数变得有些困难，因为仅仅调用生成器函数并不足以让它执行。为了解决这个问题，可以使用\
  \ `yield from` 语句。例如：\n\n点击此处查看代码\n\n```python\ndef countup(stop):\n\n    n = 1\n\
  \n    while n <= stop:\n\n        yield n\n\n        n += 1\n\ndef countdown(start):\n\
  \n    n = start\n\n    while n > 0:\n\n        yield n\n\n        n -= 1\n\ndef\
  \ up_and_down(n):\n\n    yield from countup(n)\n\n    yield from countdown(n)\n\
  ```\n\n`yield from` 有效地将迭代过程委托给外部迭代。例如，你会编写如下代码来驱动迭代：\n\n点击此处查看代码\n\n```python\n\
  >>> for x in up_and_down(5):\n\n...    print(x, end=' ')\n\n1 2 3 4 5 5 4 3 2 1\n\
  \n>>>\n```\n\n`yield from` 主要避免了你亲自亲自去驱动迭代的麻烦。如果没有这个功能，你必须按照如下方式编写 `up_and_down(n)`：\n\
  \n点击此处查看代码\n\n```python\ndef up_and_down(n):\n\n    for x in countup(n):\n\n   \
  \     yield x\n\n    for x in countdown(n):\n\n        yield x\n```\n\n在编写必须递归迭代嵌套可迭代对象时，`yield\
  \ from` 特别有用。例如，这段代码可以平坦化嵌套列表：\n\n点击此处查看代码\n\n```python\ndef flatten(items):\n\n\
  \    for i in items:\n\n        if isinstance(i, list):\n\n            yield from\
  \ flatten(i)\n\n        else:\n\n            yield i\n```\n\n这里是它是如何工作的示例：\n\n点击此处查看代码\n\
  \n```python\n>>> a = [1, 2, [3, [4, 5], 6, 7], 8]\n\n>>> for x in flatten(a):\n\n\
  ...    print(x, end=' ')\n\n...\n\n1 2 3 4 5 6 7 8\n\n>>>\n```\n\n该实现的一个局限性是它仍然受\
  \ Python 递归限制的影响，因此它无法处理深度嵌套的结构。这将在下一节中解决。\n\n### 6.4 在实践中使用生成器\n\n初看之下可能并不清楚如何使用生成器。然而，生成器在结构问题方面非常有效。考虑这个在目录中查找“spam”单词的脚本：\n\
  \n点击此处查看代码\n\n```python\nimport pathlib\nimport re\n\nfor path in pathlib('.').rglob('.py'):\n\
  \n    if path.exists():\n\n        with path.open('rt', encoding='latin-1') as file:\n\
  \n            for line in file:\n\n                m = re.match('..*)$', line)\n\
  \n                if m:\n\n                     comment = m.group(1)\n\n       \
  \              if 'spam' in comment:\n\n                         print(comment)\n\
  ```\n\n注意到嵌套层数你的眼睛已经开始疼了。现在考虑使用生成器的版本：\n\n点击此处查看代码\n\n```python\nimport pathlib\n\
  import re\n\ndef get_paths(topdir, pattern):\n\n    for path in pathlib.Path(topdir).rglob(pattern):\n\
  \n        if path.exists():\n\n            yield path\n\ndef get_files(paths):\n\
  \n    for path in paths:\n\n        with path.open('rt', encoding='latin-1') as\
  \ file:\n            yield file\n\ndef get_lines(files):\n\n    for file in files:\n\
  \n        for line in file:\n\n            m = re.match('..*)$', line)\n\n     \
  \       if m:\n\n                yield m.group(1)\n\ndef get_comments(lines):\n\n\
  \    for line in lines:\n\n        yield from line\n\ndef print_matching(lines,\
  \ substring):\n\n    for line in lines:\n\n        if substring in line:\n\n   \
  \         print(line)\n\npaths = get_paths('.', '.py')\nfiles = get_files(paths)\n\
  lines = get_lines(files)\ncomments = get_comments(lines)\n\nprint_matching(comments,\
  \ 'spam')\n```\n\n小型自包含组件。使每个组件变小且独立是一种良好的抽象技术。例如，考虑 `get_comments()` 生成器。它接收任何产生文本的可迭代对象。这些文本可以来自任何地方——文件、列表、生成器等。因此，这种功能比它嵌入深度嵌套的\
  \ `for` 循环中时要强大灵活得多。生成器通过将问题拆分为小定义的计算任务来鼓励代码复用。较小的任务也更容易推理、调试和测试。\n\n\n\n\n\n这种实现的一个问题是，由于\
  \ `Python` 的递归深度限制，它无法处理深层嵌套的结构。可以通过使用栈以不同的方式驱动迭代来修复这个问题。考虑下面这个版本：\n\n点击此处查看代码图片\n\
  \n```python\ndef flatten(items):\n    stack = [ iter(items) ]\n    while stack:\n\
  \        try:\n            item = next(stack[-1])\n            if isinstance(item,\
  \ list):\n                stack.append(iter(item))\n            else:\n        \
  \        yield item\n        except StopIteration:\n            stack.pop()\n```\n\
  \n这种实现构建了一个内部的迭代器栈。它不受 `Python` 递归深度限制的影响，因为它将数据放在了内部列表中，而不是在解释器的内部堆栈上构建帧帧（frames）。因此，如果你发现自己需要平化某些具有数百万层深度的非常特殊的数据结构，你会发现这个版本运行良好良好。\n\
  \n这些示例意味着你应该使用通配生成器模式重写你所有的代码吗？并不是。要点在于，生成器的延迟求值允许你改变普通函数求值的时空维度。在许多现实场景中，这些技术可以非常有用并以意想不到的方式应用。\n\
  \n### 6.5 增强型生成器与 `yield` 表达式\n\n在生成器函数内部，`yield` 语句也可以用作赋值运算符右侧的表达式出现。例如：\n\n点击此处查看代码图片\n\
  \n```python\ndef receiver():\n    print('Ready to receive')\n    while True:\n \
  \         n = yield\n          print('Got', n)\n```\n\n以这种方式使用 `yield` 的函数有时被称为“增强型生成器”或“基于生成器的协程”。遗憾的是，这个术语有点不准确，并且变得更加令人困惑，因为“协程”最近更多地与\
  \ `async` 函数联系在一起。为了避免这种混淆，我们将使用“增强型生成器”一词，以明确我们仍然是在讨论使用 `yield` 的标准函数。\n\n使用 `yield`\
  \ 作为表达式的函数仍然是一个生成器，但它的用法不同。它不是产生值，而是响应发送给它的值来执行。例如：\n\n点击此处查看代码图片\n\n```python\n\
  >>> r = receiver()\n>>> r.send(None)        # 推进到第一个 yield\n\nReady to receive\n\
  \n>>> r.send(1)\n\nGot 1\n\n>>> r.send(2)\n\nGot 2\n\n>>> r.send('Hello')\n\nGot\
  \ Hello\n\n>>>\n```\n\n在这个示例中，初始调用 `r.send(None)` 是必要的，以便生成器执行通向第一个 `yield` 表达式的语句。此时，生成器挂起，等待使用关联的生成器对象\
  \ `r` 的 `send()` 方法向其发送一个值。传递给 `send()` 的值由生成器中的 `yield` 表达式返回。在接收到一个值后，生成器将执行语句直到遇到下一个\
  \ `yield`。\n\n按照目前的写法方式，该函数会无限运行。可以使用 `close()` 方法如下所示关闭生成器：\n\n点击此处查看代码图片\n\n```python\n\
  >>> r.close()\n>>> r.send(4)\n\nTraceback (most recent call last):\n  File \"<stdin>\"\
  , line 1, in <module>\n\nStopIteration\n\n>>>\n```\n\n`close()` 操作会在生成器当前 `yield`\
  \ 处抛出一个 `GeneratorExit` 异常。通常情况下，这会导致生成器静默终止；如果你有兴趣，可以捕获它以执行清理操作。一旦关闭，如果进一步操作，将会抛出\
  \ `StopIteration` 异常。\n\n`close()` 操作会在生成器在当前 `yield` 处抛出一个 `GeneratorExit` 异常。通常情况下，这会导致生成器静默终止；如果你有兴趣，可以捕获它以执行清理操作。一旦关闭，如果进一步操作，将会抛出\
  \ `StopIteration` 异常。\n\n`close()` 操作会在生成器在当前 `yield` 处抛出一个 `GeneratorExit` 异常。通常情况下，这会导致生成器静默终止；如果你有兴趣，可以捕获它以执行清理操作。一旦关闭，如果进一步操作，将会抛出\
  \ `StopIteration` 异常。\n\n`close()` 操作会在生成器在当前 `yield` 处抛出一个 `GeneratorExit` 异常。通常情况下，这会导致生成器静默终止；如果你有兴趣，可以捕获它以执行清理操作。一旦关闭，如果进一步操作，将会抛出\
  \ `StopIteration` 异常。\n\n`close()` 操作会在生成器在当前 `yield` 处抛出一个 `GeneratorExit` 异常。通常情况下，这会导致生成器静默终止；如果你有兴趣，可以捕获它以执行清理操作。一旦关闭，如果进一步操作，将会抛出\
  \ `StopIteration` 异常。\n\n`close()` 操作会在生成器在当前 `yield` 处抛出一个 `GeneratorExit` 异常。通常情况下，这会导致生成器静默终止；如果你有兴趣，可以捕获它以执行清理操作。一旦关闭，如果进一步操作，将会抛出\
