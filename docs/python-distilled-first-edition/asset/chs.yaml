  \                                 month=self.month,\n                          \
  \         day=self.day)\n\n    @classmethod\n    def from_timestamp(cls, ts):\n\
  \        tm = time.localtime(ts)\n        return cls(tm.tm_year, tm.tm_mon, tm.tm_mday)\n\
  \n    @classmethod\n    def today(cls):\n        return cls.from_timestamp(time.time())\n\
  ```\n\n该类包含一个类变量 `datefmt`，用于调整 `__str__()` 方法的输出。这种机制可以通过继承进行自定义：\n\n点击此处查看代码图片\n\
  \n```python\nclass MDYDate(Date):\n    datefmt = '{month}/{day}/{year}'\n\nclass\
  \ DMYDate(Date):\n    datefmt = '{day}/{month}/{year}'\n```\n\n# 示例\n\na = Date(1967,\
  \ 4, 9)\nprint(a)       # 1967-04-09\n\nb = MDYDate(1967, 4, 9)\nprint(b)      \
  \ # 4/9/1967\n\nc = DMYDate(1967, 4, 9)\nprint(c)      # 9/4/1967\n```\n\n这种通过类变量和继承进行配置的方法是调整实例行为常用工具。类方法的使用对于实现这一功能至关重要，因为它们确保了创建正确类型的对象。例如：\n\
  \n点击此处查看代码图片\n\n```python\na = MDYDate.today()\nb = DMYDate.today()\nprint(a)  \
  \    # 2/13/2019\nprint(b)      # 13/2/2019\n```\n\n实例的替代构造方法是类方法最常见的用途。此类方法的常用命名规范是包含\
  \ `from_` 前缀，例如 `from_timestamp()`。你会在标准库和第三方包的类方法中看到这种命名约定。例如，字典有一个类方法，可以从一组键 set\
  \ 创建一个预初始化的字典：\n\n点击此处查看代码图片\n\n```python\n>>> dict.from_keys(['a','b','c'], 0)\n\
  {'a': 0, 'b': 0, 'c': 0}\n>>>\n```\n\n关于类方法的一个注意点是，Python 不会将它们放在一个独立于实例方法的单独命名空间中。因此，你仍然可以在实例上调用它们。例如：\n\
  \n点击此处查看代码图片\n\n```python\nd = Date(1967,4,9)\nb = d.today()          # 调用了 Date.now(Date)\n\
  ```\n\n这可能会非常令人困惑，因为调用 `d.today()` 实际上与实例 `d` 没有任何关系。然而，你可能会在 IDE 和文档中看到 `today()`\
  \ 被列为 `Date` 实例的有效方法。\n\n### 7.13 静态方法\n\n有时，类仅被用作 `@staticmethod` 声明的静态方法的命名空间。与普通方法或类方法不同，静态方法不接收额外的\
  \ `self` 或 `cls` 参数。静态方法只是恰好定义在类内部的普通函数。例如：\n\n点击此处查看代码图片\n\n```python\nclass Ops:\n\
  \    @staticmethod\n    def add(x, y):\n        return x + y\n\n    @staticmethod\n\
  \    def sub(x, y):\n        return x - y\n```\n\n通常不会创建此类类的实例。相反，直接通过类调用这些函数：\n\
  \n点击此处查看代码图片\n\n```python\na = Ops.add(2, 3)        # a = 5\nb = Ops.sub(4, 5) \
  \       # a = -1\n```\n\n有时其他类会使用此类静态方法的集合来实现“可切换的”或“可配置”的行为，或者作为松散模拟导入模块行为的内容。考虑早之前\
  \ `Account` 示例中继承的使用：\n\n点击此处查看代码图片\n\n```python\nclass Account:\n    def __init__(self,\
  \ owner, balance):\n        self.owner = owner\n        self.balance = balance\n\
  \n    def __repr__(self):\n        return f'{type(self).__name__}({self.owner!r},\
  \ {self.balance!r})'\n\n    def deposit(self, amount):\n        self.balance +=\
  \ amount\n\n    def withdraw(self, amount):\n        self.balance -= amount\n\n\
  \    def inquiry(self):\n        return self.balance\n\n# Account 的特殊子类\nclass EvilAccount(Account):\n\
  \    def deposit(self, amount):\n        self.balance += 0.95\n\n    def inquiry(self):\n\
  \        if random.randint(0,4) == 1:\n           return 1.10 * self.balance\n \
  \       else:\n           return self.balance\n```\n\n\n\n\n这种将方法委托给辅助类的方法，是状态机和类似对象的常用实现策略。每个操作状态都可以封装到它自己的方法类（通常是静态的）中。，一个可变的实例变量（例如本示例中的\
  \ `policy` 属性）可以被用于存储与当前操作状态相关的特定实现细节。\n\n### 7.14 关于设计模式的说明\n\n在编写面向对象的程序时，程序员有时会执着于实现某些命名的设计模式——例如“策略模式”、“重量级模式”、“单例模式”等。这些模式中的许多源自\
  \ Erich Gamma、Richard Helm、Ralph Johnson 和 John Vlissides 合著的著名书籍《设计模式》（*Design\
  \ Patterns*）。\n\n如果你熟悉这些模式，那么在其他语言中使用的通用设计原则完全适用于 Python。然而，许多这些记录在案的模式是为了解决由 `C++`\
  \ 或 `Java` 严格的静态类型系统引起的特定问题。Python 的动态性质使得许多此类模式变得过时、大材小用，或者根本没有必要。\n\n尽管如此，编写良好的软件有几个首要的原则——例如，努力编写可调试、可测试且可扩展的代码。一些基础策略，如编写带有有用\
  \ `__repr__()` 方法的类、优先使用组合而非继承以及允许依赖注入，对实现这些目标非常有帮助。Python 程序员也喜欢编写可以被称为“Python\
  \ 味”（Pythonic）的代码。通常，这意味着对象遵守各种内置协议，如迭代、容器或上下文管理。例如，Python 程序员可能不会尝试从 `Java` 编程书中实现某种奇特的数据遍历模式，而是可能会使用生成器函数配合\
  \ `for` 循环来实现它，或者直接用几次字典查找替换整个模式。\n\n### 7.15 数据封装与私有属性\n\n在 Python 中，类的所有属性和方法都是公开的（`public`），也就是说可以在没有任何限制的情况下访问。在有理由隐藏或封装内部实现细节的面向对象应用中，这通常是不理想的。\n\
  \n为了解决这个问题，Python 依赖于命名约定作为信号意图用途的手段。其中一种约定是，以单下划线（`_`）头的名称表示内部实现。例如，这里有一个 `Account`\
  \ 类的版本，其中余额已变为“私有”属性：\n\n点击此处查看代码图像\n\n```python\nclass Account:\n    def __init__(self,\
  \ owner, balance):\n        self.owner = owner\n        self._balance = balance\n\
  \n    def __repr__(self):\n        return f'Account({self.owner!r}, {self._balance!r})'\n\
  \n    def deposit(self, amount):\n        self._balance += amount\n\n    def withdraw(self,\
  \ amount):\n        self._balance -= amount\n\n    def inquiry(self):\n        return\
  \ self._balance\n```\n\n在这段代码中，`_balance` 属性是一个内部细节。没有什么可以阻止用户直接访问它，但开头的下划线是一个强烈的指示，表明用户应该寻找更具公开性的接口——例如\
  \ `Account.inquiry()` 方法。\n\n一个灰色地带是内部属性是否可以在子类中使用。例如，之前的继承示例允许直接访问其父类的 `_balance`\
  \ 属性吗？\n\n点击此处查看代码图像\n\n```python\nclass EvilAccount(Account):\n    def inquiry(self):\n\
  \        if random.randint(0,4) == 1:\n           return 1.10 * self._balance\n\
  \        else:\n           return self._balance\n```\n\n作为一般规则，这在 Python 中被认为是可以的。IDE\
  \ 和其他工具可能会暴露此类属性。如果你来自 `C++`、`Java` 或其他类似的面向对象语言，可以将 `_balance` 视为类似于“受保护”（protected）的属性。\n\
  \n在 Python 中，这在一般规则上被认为是可以接受的。如果你希望拥有真正的私有属性，可以在名称前加上双下划线。这种机制确保了类中相同的名称不会被重写。这会被重命名为\
  \ `_Class__name`。以下是展示这种行为的示例：\n\n点击此处查看代码图像\n\n```python\nclass A:\n    def __init__(self):\n\
  \        self.__x = 3\n\n    def bar(self):\n        print(self.__x)\n\n    def\
  \ spam(self):\n        print(self.__x)\n\nclass B(A):\n    def __init__(self):\n\
  \        self.__x = 37\n\n    def grok(self):\n        print(self.__x)\n\na = A()\n\
  a.bar()\na.spam()\n\nb = B()\nb.grok()\n```\n\n尽管这种方案提供了数据隐藏的幻象，但并没有机制可以阻止访问。特别是，如果已知类名和对应属性，仍然可以使用混淆后的名称进行访问。请注意，在\
  \ `getattr()`、`hasattr()`、`setattr()` 或 `delattr()` 等以字符串指定属性名的函数中，不会发生名称混淆。对于这些函数，你需要显式地使用混淆后的名称如\
  \ `'_Classname__name'` 来访问属性。\n\n在实践中，最好不要过度思考名称的隐私性。单下划线名称很常见；双下划线名称较少。尽管你可以采取额外的步骤来真正隐藏属性，但增加的努力和复杂性通常不值得。也许最有用的点是记住，如果你看到名称开头有下划线，它几乎是某种最好处理的内部细节。\n\
  \n### 7.16 类型提示\n\n用户定义类的属性对其类型或没有限制。事实上，你可以将属性设置为任何你想要的值。例如：\n\n点击此处查看代码图像\n\n\
  ```python\n>>> a = Account('Guido', 1000.0)\n>>> a.owner\n'Guido'\n>>> a.owner =\
  \ 37\n>>> a.owner\n37\n>>> b = Account('Eva', 'a lot')\n>>> b.deposit(' more')\n\
  >>> b.inquiry()\n'a lot more'\n>>>\n```\n\n如果这是一个实际考虑，有几种可能的解决方案。一种很简单——不要这样做！另一种是依赖于外部工具，如代码检查器和类型检查器。对于这一点，类允许为选定的属性指定可选的类型提示。例如：\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```\nclass Account:\n\n    owner: str            # 类型提示\n\
  \n    _balance: float       # 类型提示\n\n    def __init__(self, owner, balance):\n\n\
  \        self.owner = owner\n\n        self._balance = balance\n\n    ...\n```\n\
  \n引入类型提示（type hints）并不会改变类的实际运行时行为——也就是说，并不会发生任何额外的检查，也没有机制能阻止用户在代码中设置错误的值。然而，这些提示可能会在编辑器中为用户提供更有用的信息，从而在错误发生前防止粗心的使用错误。\n\
  \n在实践中，准确的类型提示可能是困难的。例如，`Account` 类是否允许人们使用 `int` 而不是 `float`？或者使用 `Decimal` 呢？你会发现，尽管提示似乎并不如此，但这些操作都是有效的。\n\
  \n点击此处查看代码图片\n\n```python\nfrom decimal import Decimal\n\na = Account('Guido', Decimal('1000.0'))\n\
  \na.withdraw(Decimal('50.0'))\n\nprint(a.inquiry())      # -> 950.0\n```\n\n知道在这些情况下如何正确组织类型超出了本书的范围。如果有疑问，除非你正在积极使用可以检查代码检查的工具，否则最好不要猜测。\n\
  \n### 7.17 属性 (Properties)\n\n如前一节所述，Python 对属性值或类型没有设置任何运行时限制。然而，如果你将一个属性交给所谓 `property`（属性）的管理，这种强制执行是可能的。属性是一种特殊的属性类型，它会拦截属性访问并通过用户定义的方法对其进行处理。这些方法可以完全自由地根据自己的需要管理属性。这里是一个示例：\n\
  \n点击此处查看代码图片\n\n```python\nimport string\n\nclass Account:\n\n    def __init__(self,\
  \ owner, balance):\n\n        self.owner = owner\n\n        self._balance = balance\n\
  \n    @property\n\n    def owner(self):\n\n        return self._owner\n\n    @owner.setter\n\
  \n    def owner(self, value):\n\n        if not isinstance(value, str):\n      \
  \      raise TypeError('Expected str')\n\n        if not all(c in string.ascii_uppercase\
  \ for c in value):\n            raise ValueError('Must be uppercase ASCII')\n\n\
  \        if len(value) > 10:\n            raise ValueError('Must be 10 characters\
  \ or less')\n\n        self._owner = value\n```\n\n在这里，`owner` 属性被限制为非常企业级的 10 位大写\
  \ ASCII 字符串。当当你尝试使用该类时，它的工作原理：\n\n点击此处查看代码图片\n\n```python\n>>> a = Account('GUIDO',\
  \ 1000.0)\n\n>>> a.owner = 'EVA'\n\n>>> a.owner = 42\n\nTraceback (most recent call\
  \ last):\n...\n\nTypeError: Expected str\n\n>>> a.owner = 'Carol'\n\nTraceback (most\
  \ recent call last):\n...\n\nValueError: Must be uppercase ASCII\n\n>>> a.owner\
  \ = 'RENÉE'\n\nTraceback (most recent call last):\n...\n\nValueError: Must be uppercase\
  \ ASCII\n\n>>> a.owner = 'RAMAKRISHNAN'\n\nTraceback (most recent call last):\n\
  ...\n\nValueError: Must be 10 characters or less\n\n>>>\n```\n\n`@property` 装饰器用于将一个属性建立为属性。在这个示例中，它被应用于\
  \ `owner` 属性。该装饰器始终首先应用于获取属性值的方法。在这种情况下，该方法返回存储在私有属性 `_owner` 中的实际值。随其后的 `@owner.setter`\
  \ 装饰器用于可选地实现一个设置属性值的方法。该方法在将值存储在私有 `_owner` 属性之前，会执行各种类型和值检查。\n\n属性的一个关键特性是关联名称（例如示例中的\
  \ `owner`）变得“魔术化了”。也就是说，对该属性的任何使用会自动路由到你实现的 getter/setter 方法。你不需要更改任何预先的代码来使其正常工作。例如，不需要对\
  \ `Account.__init__()` 方法进行任何更改。这可能会让你感到惊讶，因为 `__init__()` 执行的是赋值 `self.owner =\
  \ owner`，而不是使用私有属性 `self._owner`。这是设计如此的——`owner` 属性的整个目的就是验证属性值。在创建实例时你绝对希望这样做。你会发现它的工作方式完全符合预期：\n\
  \n点击此处查看代码图片\n\n```python\n>>> a = Account('Guido', 1000.0)\n\nTraceback (most recent\
  \ call last):\n  File \"account.py\", line 5, in __init__\n    self.owner = owner\n\
  \n  File \"account.py\", line 15, in owner\n    raise ValueError('Must be uppercase\
  \ ASCII')\nValueError: Must be uppercase ASCII\n\n>>>\n```\n\n由于对属性属性的每次访问都会自动调用方法，因此实际值需要存储在一个不同的名称下。这就是为什么在\
  \ getter 和 setter 方法内部使用了 `_owner`。你不能使用 `owner` 作为存储位置，因为这样做会导致无限递归。\n\n通常情况下，属性允许拦截任何特定的属性名。你可以实现获取、设置或删除属性值的方法。例如：\n\
  \n点击此处查看代码图片\n\n```python\nclass SomeClass:\n\n    @property\n\n    def attr(self):\n\
  \        print('Getting')\n\n    @attr.setter\n    def attr(self, value):\n    \
  \    print('Setting', value)\n\n    @attr.deleter\n    def attr(self):\n       \
  \ print('Deleting')\n\n# Example\ns = SomeClass()\ns.attr         # Getting\ns.attr\
  \ = 13    # Setting\ndel s.attr     # Deleting\n```\n\n并没有必要实现属性的所有部分。事实上，将属性常用于只读计算属性。例如：\n\
  \n点击此处查看代码图片\n\n```python\nclass Box(object):\n    def __init__(self, width, height):\n\
  \        self.width = width\n        self.height = height\n\n    @property\n\n \
  \   def area(self):\n        return self.width * self.height\n\n    @property\n\n\
  \    def perimeter(self):\n        return 2*self.width + 2*self.height\n\n# Example\
  \ use\nb = Box(4, 5)\nprint(b.area)       # 20\nprint(b.perimeter)  # 18\n```\n\n\
  定义类时需要考虑的问题之一是让编程接口尽可能统一。如果没有属性，某些值将作为 `b.width` 或 `b.height` 访问，而另一些值将作为方法 `b.area()`\
  \ 和 `b.perimeter()` 访问。跟踪何时该添加 `()` 会产生不必要的混乱。属性可以帮助解决。\n\nPython 程序员通常没有意识到方法本身被隐式处理为一种属性。考虑这个类：\n\
  \n点击此处查看代码图片\n\n```python\nclass SomeClass:\n\n    def yow(self):\n        print('Yow!')\n\
  ```\n\n当用户创建一个实例如 `s = SomeClass()` 并访问 `s.yow` 时，返回的原始函数对象 `yow`。相反，你得到一个绑定方法：\n\
  \n点击此处查看代码图片\n\n```python\n>>> s = SomeClass()\n>>> s.yow\n\n<bound method SomeClass.yow\
  \ of <__main__.SomeClass object at 0x102572b0>>\n\n>>>\n```\n\n这是如何发生的？事实证明当函数放在类中时，它们的行为非常像属性。具体来说，函数会魔术般地拦截属性访问并在后台创建绑定方法。当你使用\
  \ `@staticmethod` 和 `@classmethod` 定义方法时，你实际上是在改变这一过程。`@staticmethod` 直接返回方法本身，而不进行任何特殊的包装或处理。关于这一过程的更多信息将在后的第\
  \ 7.28 节](#ch07.xhtml_ch07lev1sec28) 中介绍。\n\n\n\n\n当你创建一个类的实例时，该实例的类型就是类本身。要测试一个对象是否属于某个类，请使用内置函数\
  \ `isinstance(obj, cls)`。如果对象 `obj` 属于类 `cls` 或任何派生自 `cls` 的类，该函数将返回 `True`。这里有一个示例如：\n\
  \n点击此处查看代码图片\n\n```python\nclass A:\n    pass\n\nclass B(A):\n    pass\n\nclass\
  \ C:\n    pass\n\na = A()           # 'A' 的实例\nb = B()           # 'B' 的实例\nc =\
  \ C()           # 'C' 的实例\ntype(a)           # 返回类对象 A\n\nisinstance(a, A)  # 返回\
  \ True\nisinstance(b, A)  # 返回 True, B 继承自 A\nisinstance(b, C)  # 返回 False, B 未继承自\
  \ C\n```\n\n同样地，内置函数 `issubclass(A, B)` 在类 `A` 是类 `B` 的子类时返回 `True`。这里有一个示例如：\n\n\
  点击此处查看代码图片\n\n```python\nissubclass(B, A)   # 返回 True\nissubclass(C, A)   # 返回 False\n\
  ```\n\n类类型关系的一个常见用途是规范编程接口。例如，可以实现一个顶层基类来规定编程接口的要求。该基类随后可以被用于类型提示（type hinting）或通过\
  \ `isinstance()` 进行防御性类型强制：\n\n点击此处查看代码图片\n\n```python\nclass Stream:\n    def receive(self):\n\
  \        raise NotImplementedError()\n\n    def send(self, msg):\n        raise\
  \ NotImplementedError()\n\n    def close(self):\n        raise NotImplementedError()\n\
  \n# 示例。\ndef send_request(stream, request):\n    if not isinstance(stream, Stream):\n\
  \        raise TypeError('Expected a Stream')\n    stream.send(request)\n    return\
  \ stream.receive()\n```\n\n这种代码的预期并不是直接使用 `Stream`。相反，不同的类将继承自 `Stream` 并实现所需的功能。用户将实例化这些类中的一个。例如：\n\
  \n点击此处查看代码图片\n\n```python\nclass SocketStream(Stream):\n    def receive(self):\n\
  \        ...\n\n    def send(self, msg):\n        ...\n\n    def close(self):\n\
  \        ...\n\nclass PipeStream(Stream):\n    def receive(self):\n        ...\n\
  \n    def send(self, msg):\n        ...\n\n    def close(self):\n        ...\n\n\
  # 示例\ns = SocketStream()\nsend_request(s, request)\n```\n\n在这个示例中值得讨论的是在 `send_request()`\
  \ 中对接口进行运行时强制。是否应该使用类型提示呢？\n\n点击此处查看代码图片\n\n```python\n# 将接口作为类型提示指定\ndef send_request(stream:Stream,\
  \ request):\n    stream.send(request)\n    return stream.receive()\n```\n\n鉴于类型提示并不会强制执行，因此如何根据接口验证参数的决策实际上取决于你希望何时发生这种情况——在运行时、作为代码检查步骤，或者完全不检查。\n\
  \n这种对接口类的用法在大型框架和应用程序的组织中更为常见。然而，通过这种方法，你需要确保子类确实实现了所需的接口。例如，如果一个子类选择不实现所需的方法之一，或者出现了一个简单的拼写错误，其影响最初可能不会被察觉，因为代码在通常情况下仍然可以工作。然而，后来如果调用了未实现的方法，程序将会崩溃。自然地，这只会在生产环境的凌晨\
  \ 3:30 发生。\n\n为了防止这个问题，通常使用 `abc` 模块将接口定义为抽象基类。该模块定义了一个基类（`ABC`）和一个装饰器（`@abstractmethod`），它们共同用于描述一个接口。这里有一个示例：\n\
  \n点击此处查看代码图片\n\n```python\nfrom abc import ABC, abstractmethod\n\nclass Stream(ABC):\n\
  \    @abstractmethod\n    def receive(self):\n        pass\n\n    @abstractmethod\n\
  \    def send(self, msg):\n        pass\n\n    @abstractmethod\n    def close(self):\n\
  \        pass\n```\n\n抽象类不是为了直接实例化的。事实上，如果你尝试创建一个 `Stream` 实例，你将得到一个错误：\n\n点击此处查看代码图片\n\
  \n```python\n>>> s = Stream()\nTraceback (most recent call last):\n  File \"<stdin>\"\
  , line 1, in <module>\nTypeError: Can't instantiate abstract class Stream with abstract\
  \ methods close, receive, send\n>>>\n```\n\n错误消息准确告诉你 `Stream` 需要实现哪些方法。这可以作为编写子类的指南。假设你写了一个子类但犯了错：\n\
  \n点击此处查看代码图片\n\n```python\nclass SocketStream(Stream):\n    def receive(self):\n\
  \        ...\n\n    def send(self, msg):\n        ...\n\n    def close(self):\n\
  \        ...\n```\n\n抽象基类会在实例化时捕获错误。这很有用，因为错误可以尽早发现。\n\n### 7.19 多重继承、接口与 Mixins\n\
  \nPython 支持多重继承。如果一个子类列出了多个父类，该子类将继承所有父类的特征。例如：\n\n点击此处查看代码图片\n\n```python\nclass\
  \ Duck:\n    def walk(self):\n        print('Waddle')\n\nclass Trombonist:\n   \
  \ def noise(self):\n        print('Blat!')\n\nclass DuckBonist(Duck, Trombonist):\n\
  \    pass\n\nd = DuckBonist()\nd.walk()        # Waddle\nd.noise()       # Blat!\n\
  ```\n\n从概念上来说，这是一个不错的想法，但实际情况开始出现。例如，如果 `Duck` 和 `Trombonist` 都定义了 `__init__()`\
  \ 方法呢？或者它们都定义了 `noise()` 方法呢？你开始意识到多重继承充满了危险。\n\n为了更好地理解多重继承的用途，请将其视为用于组织和重用的专用工具——而不是通用的编程技术。具体来说，将一组无关的类通过多重继承结合在一起奇怪的鸭子并不是标准做法。不要这样做。\n\
  \n多重继承的更常见用途是组织类型和接口关系。例如，上一节引入了抽象基类的概念。抽象基类的目的是指定编程接口。例如，你可能会有类似这样的抽象类：\n\n点击此处查看代码图片\n\
  \n```python\nfrom abc import ABC, abstractmethod\n\nclass Stream(ABC):\n    @abstractmethod\n\
  \    def receive(self):\n        pass\n\n    @abstractmethod\n    def send(self,\
  \ msg):\n        pass\n\n    @abstractmethod\n    def close(self):\n        pass\n\
  \nclass Iterable(ABC):\n    @abstractmethod\n    def __iter__(self):\n        pass\n\
  ```\n\n有了这些类，多重继承可能被用于指定子类实现了哪些接口：\n\n点击此处查看代码图片\n\n```python\nclass MessageStream(Stream,\
  \ Iterable):\n    def receive(self):\n        ...\n\n    def send(self):\n     \
  \   ...\n\n    def close(self):\n        ...\n\n    def __iter__(self):\n      \
  \  ...\n```\n\n\n\n再次，这种对多重继承的使用并不是为了实现，而是为了类型关系。例如，在这个示例中，继承的方法无一个都没有执行任何操作。这里没有代码重用。主要，继承关系允许你执行如下的类型检查：\n\
  \n点击此处查看代码图像\n\n```\nm = MessageStream()\n\nisinstance(m, Stream)     # -> True\n\
  \nisinstance(m, Iterable)   # -> True\n```\n\n多重继承的另一个用途是定义 `mixin classes`（混入类）。`mixin\
  \ class` 是一种修改或扩展其他类功能的类。考虑以下类定义：\n\n点击此处查看代码图像\n\n```\nclass Duck:\n\n    def noise(self):\n\
  \n        return 'Quack'\n\n    def waddle(self):\n\n        return 'Waddle'\n\n\
  class Trombonist:\n\n    def noise(self):\n\n        return 'Blat!'\n\n    def march(self):\n\
  \n        return 'Clomp'\n\nclass Cyclist:\n\n    def noise(self):\n\n        return\
  \ 'On your left!'\n\n    def pedal(self):\n\n        return 'Pedaling'\n```\n\n\
  这些类之间完全没有关系。它们之间没有继承关系，并且实现了不同的方法。然而，它们有一个共同点，即它们每个类都定义了一个 `noise()` 方法。以此为指导，你可以定义以下类：\n\
  \n点击此处查看代码图像\n\n```\nclass LoudMixin:\n\n    def noise(self):\n\n        return\
  \ super().noise().upper()\n\nclass AnnoyingMixin:\n\n    def noise(self):\n\n  \
  \      return 3*super().noise()\n```\n\n从一眼看去，这些类看起来是错误的。只有一个孤立的方法，而且它使用 `super()`\
  \ 委托给一个不存在的父类。这些类甚至无法运行：\n\n点击此处查看代码图像\n\n```\n>>> a = AnnoyingMixin()\n\n>>> a.noise()\n\
  \nTraceback (most recent call last):\n...\n\nAttributeError: 'super' object has\
  \ no attribute 'noise'\n\n>>>\n```\n\n这些是混入类。它们唯一能够工作的方法是与其他实现了缺失功能的类结合使用。例如：\n\n\
  点击此处查看代码图像\n\n```\nclass LoudDuck(LoudMixin, Duck):\n\n    pass\n\nclass AnnoyingTrombonist(AnnoyingMixin,\
  \ Trombonist):\n\n    pass\n\nclass AnnoyingLoudCyclist(AnnoyingMixin, LoudMixin,\
  \ Cyclist):\n\n    pass\n\nd = LoudDuck()\n\nd.noise() # -> 'QUACK'\n\nt = AnnoyingTrombonist()\n\
  \nt.noise() # -> 'Blat!Blat!Blat!'\n\nc = AnnoyingLoudCyclist()\n\nc.noise() # ->\
  \ 'ON YOUR LEFT!ON YOUR LEFT!ON YOUR LEFT!'\n```\n\n由于混入类的定义方式与普通类相同，最好将“Mixin”一词作为类名的一部分。这种命名约定提供了更清晰的意目的。\n\
  \n为了完全理解混入，你需要了解更多关于继承和 `super()` 函数是如何运作的知识。\n\n首先，每当你使用继承时，Python 都会构建一个类的线性链，被称为方法解析顺序，简称\
  \ `MRO`（Method Resolution Order）。这可以通过类的属性 `__mro__` 来获取。这里是一些单继承的示例：\n\n点击此处查看代码图像\n\
  \n```\nclass Base:\n\n    pass\n\nclass A(Base):\n\n    pass\n\nclass B(A):\n\n\
  \    pass\n\nBase.__mro__ # -> (<class 'Base'>, <class 'object'>)\n\nA.__mro__ \
  \   # -> (<class 'A'>, <class 'Base'>, <class 'object'>)\n\nB.__mro__    # -> (<class\
  \ 'B'>, <class 'A'>, <class 'Base'>, <class 'object'>)\n```\n\nMRO 规定了属性查找的搜索顺序。具体来说，每当你在实例或类上搜索属性时，都会按照列出的顺序检查\
  \ MRO 中的每个类。在找到第一个匹配项时搜索停止。`object` 类列在 MRO 中，是因为所有类都继承自 `object`，无论它是否被列为父类。\n\n\
  为了支持多重继承，Python 实现了所谓的“协作式多重继承”。在协作式继承中，所有类根据两条主要的排序规则被放在 MRO 列表中。第一条规则规定，子类必须在其任何父类之前被检查。第二条规则规定，如果一个类有多个父类，这些父类的检查顺序必须与它们在子类继承列表中的顺序相同。在大多数情况下，这些规则产生了合理的\
  \ MRO。然而，对类排序精确算法实际上相当复杂，并不是基于任何简单方法（如深度优先或广度优先搜索）。相反，顺序是根据 C3 线性算法确定的，该算法在论文《A\
  \ Monotonic Superclass Linearization for Dylan》（K. Barrett, et al., 发表于 OOPSLA’96）中描述。该算法的一个微妙方面是，某些类层级结构会被\
  \ Python 用 `TypeError` 拒绝。这里有一个例子：\n\n点击此处查看代码图像\n\n```\nclass X:\n\n    pass\n\n\
  class Y(X):\n\n    pass\n\nclass Z(X,Y): # TypeError: Can't create consistent MRO\n\
  ```\n\n在这种情况下，方法解析拒绝了类 `Z`，因为 `X` 在继承列表中出现在 `Y` 之前，所以必须先检查它。然而，`Y` 继承自 `X`，如果 `X`\
  \ 先被检查，就违反了关于先检查子类的规则。在实践中，这些问题很少出现——如果出现了，通常意味着设计问题。\n\n作为实践中 MRO 的示例，这里是之前所示类的\
  \ MRO：\n\n点击此处查看代码图像\n\n```\nclass AnnoyingLoudCyclist(AnnoyingMixin, LoudMixin,\
  \ Cyclist):\n\n    pass\n\nAnnoyingLoudCyclist.__mro__\n\n(<class 'AnnoyingLoudCyclist'>\
  \ <class 'AnnoyingMixin'> <class 'LoudMixin'> <class 'Cyclist'> <class 'object'>)\n\
  ```\n\n在这个 MRO 中，你看到所有规则都得到了满足。具体来说，任何子类都列在其父类之前。`object` 类最后列是因为它是所有类的父类。\n\n`super()`的行为与底层\
  \ MRO 绑定。具体来说，它的作用是将属性委托给 MRO 中的下一个类。这是基于使用 `super()` 的类。例如，当 `AnnoyingMixin` 类使用\
  \ `super()` 时，它查看实例的 MRO 以找到它的位置。从那里，它将属性查找委托给下一个类。在这个示例中，`AnnoyingMixin` 类中的 `super().noise()`\
  \ 调用了 `LoudMixin.noise()`。这是 `LoudMixin` 是 `AnnoyingLoudCyclist` MRO 中的下一个类。`LoudMixin`\
  \ 类中的 `super().noise()` 操作随后委托给 `Cyclist` 类。\n\n设计协作继承和混入是一个挑战。这里有一些设计指南。首先，子类始终在\
  \ MRO 中的任何基类之前被检查。因此，混入类通常共享一个共同父类，该父类为方法提供空实现。如果同时使用多个混入类，它们将彼此排列。共同父类将出现在最后，可以在那里提供默认实现或错误检查。\n\
  \n\n\n第二条指南是，所有混入（mixin）方法的实现都应该具有相同的函数签名。混入的一个问题是它们是可选的，并且通常以不可预测的顺序混合在一起。为了实现这种机制，你必须保证无论下一个是哪个类，涉及\
  \ `super()` 的操作都能成功。为了做到这一点，调用链中的所有方法都需要具有兼容的调用签名。\n\n最后，你需要确保在任何地方都使用 `super()`。有时你会遇到一个直接对其父类调用的类：\n\
  \n点击此处查看代码图片\n\n```python\nclass Base:\n    def yow(self):\n        print('Base.yow')\n\
  \nclass A(Base):\n    def yow(self):\n        print('A.yow')\n        Base.yow(self)\
  \       # 直接调用父类\n\nclass B(Base):\n    def yow(self):\n        print('B.yow')\n\
  \        super().yow(self)\n\nclass C(A, B):\n    pass\n\nc = C()\nc.yow()\n\n#\
  \ 输出:\n#    A.yow\n#    Base.yow\n```\n\n此类类在多重继承中使用是不安全的。这样做会破坏正确的方法调用链并导致混淆。例如，在上面的示例中，尽管\
  \ `B.yow()` 是继承体系的一部分，但 `B.yow()` 永远不会有输出。如果你正在进行任何多重继承操作，应该使用 `super()` 而不是直接对超类的方法调用。\n\
  \n### 7.20 基于类型的分发\n\n有时，你需要编写根据特定类型进行分发的代码。例如：\n\n点击此处查看代码图片\n\n```python\nif isinstance(obj,\
  \ Duck):\n   handle_duck(obj)\nelif isinstance(obj, Trombonist):\n   handle_trombonist(obj)\n\
  elif isinstance(obj, Cyclist):\n   handle_cyclist(obj)\nelse:\n   raise RuntimeError('Unknown\
  \ object')\n```\n\n这样一个庞大的 `if-elif-else` 块既不优雅又脆弱。一种常用的解决方案是通过字典进行分发：\n\n点击此处查看代码图片\n\
  \n```python\nhandlers = {\n    Duck: handle_duck,\n    Trombonist: handle_trombonist,\n\
  \    Cyclist: handle_cyclist\n}\n\n# 分发\ndef dispatch(obj):\n    func = handlers.get(type(obj))\n\
  \    if func:\n         return func(obj)\n    else:\n         raise RuntimeError(f'No\
  \ handler for {obj}')\n```\n\n这种解决方案假设了精确类型匹配。如果在这种分发中也支持继承，你需要遍历 MRO（方法解析顺序）：\n\
  \n点击此处查看代码图片\n\n```python\ndef dispatch(obj):\n    for ty in type(obj).__mro__:\n\
  \        func = handlers.get(ty)\n        if func:\n            return func(obj)\n\
  \    raise RuntimeError(f'No handler for {obj}')\n```\n\n有时，分发是通过使用 `getattr()`\
  \ 的基于类的接口来实现的，如下：\n\n点击此处查看代码图片\n\n```python\nclass Dispatcher:\n    def handle(self,\
  \ obj):\n        for ty in type(obj).__mro__:\n            meth = getattr(self,\
  \ f'handle_{ty.__name__}', None)\n            if meth:\n                return meth(obj)\n\
  \        raise RuntimeError(f'No handler for {obj}')\n\n    def handle_Duck(self,\
  \ obj):\n        ...\n\n    def handle_Trombonist(self, obj):\n        ...\n\n \
  \   def handle_Cyclist(self, obj):\n        ...\n\n# 示例\ndispatcher = Dispatcher()\n\
  dispatcher.handle(Duck())     # -> handle_Duck()\ndispatcher.handle(Cyclist()) \
  \ # -> handle_Cyclist()\n```\n\n最后一个使用 `getattr()` 分发到类方法的示例是一种相当常见的编程模式。\n\n###\
  \ 7.21 类装饰器\n\n有时，你需要在类定义之后执行额外的处理步骤——例如将类添加到注册表中或生成额外的支持代码。一种方法是使用类装饰器。类装饰器是一个接收类作为输入并返回类作为输出的函数。例如，这里是维护注册表的方法：\n\
  \n点击此处查看代码图片\n\n```python\n_registry = { }\n\ndef register_decoder(cls):\n    for\
  \ mt in cls.mimetypes:\n        _registry[mt.mimetype] = cls\n    return cls\n\n\
  # 使用注册表的工厂函数\ndef create_decoder(mimetype):\n    return _registry[mimetype]()\n\
  ```\n\n在这个示例中，`register_decoder()` 函数在类内部查找 `mimetypes` 属性。如果找到，则用它将类添加到映射 MIME\
  \ 类型到类对象的字典中。要使用此函数，请在类定义之前将其作为装饰器应用：\n\n点击此处查看代码图片\n\n```python\n@register_decoder\n\
  class TextDecoder:\n    mimetypes = [ 'text/plain' ]\n```\n\n\n\n这种方法的一个缺点是启动性能较差。使用\
  \ `exec()` 动态创建代码会绕过 Python 通常对模块应用的编译优化。因此，以这种方式定义大量类可能会显著减慢代码的导入速度。\n\n本节所示的示例说明了类装饰器的常见用途——注册、代码重写、代码生成、验证等。类装饰器的一个问题是，它们必须显式地应用到使用的每个类上。这并不总是所需要的。下一节将描述一种允许对类进行隐式操作的特性。\n\
  \n### 7.22 受监督继承\n\n正如你在上一节中看到的，有时你想要定义一个类并执行额外的操作。类装饰器是实现此点的机制之一。然而，父类也可以代表其子类执行额外操作。这是通过实现\
  \ `__init_subclass__(cls)` 类方法来实现。例如：\n\n点击此处查看代码图像\n\n```python\nclass Base:\n\n\
  \    @classmethod\n\n    def __init_subclass__(cls):\n        print('Initializing',\
  \ cls)\n\n# Example (应该为每个类看到 'Initializing' 消息)\n\nclass A(Base):\n    pass\n\n\
  class B(A):\n    pass\n```\n\n如果存在 `__init_subclass__()` 方法，它会在定义任何子类时自动触发。即使子类深埋在继承层次结构中也会发生这种情况。\n\
  \n许多通常使用类装饰器执行的任务可以改用 `__init_subclass__()` 来完成。例如，类注册：\n\n点击此处查看代码图像\n\n```python\n\
  class DecoderBase:\n\n    _registry = { }\n\n    @classmethod\n\n    def __init_subclass__(cls):\n\
  \        for mt in cls.mimetypes:\n            DecoderBase._registry[mt.mimetype]\
  \ = cls\n\n# 使用注册表的工厂函数\n\ndef create_decoder(mimetype):\n    return DecoderBase._registry[mimetype]()\n\
  \nclass TextDecoder(DecoderBase):\n    mimetypes = [ 'text/plain' ]\n\n    def decode(self,\
  \ data):\n        ...\n\nclass HTMLDecoder(DecoderBase):\n    mimetypes = [ 'text/html'\
  \ ]\n\n    def decode(self, data):\n        ...\n\nclass ImageDecoder(DecoderBase):\n\
  \    mimetypes = [ 'image/png', 'image/jpg', 'image/gif' ]\n\n    def decode(self,\
  \ data):\n        ...\n\n# 使用示例\n\ndecoder = create_decoder('image/jpg')\n```\n\n\
  这是一个类的示例，它可以根据类 `__init__()` 方法的签名自动创建一个 `__repr__()` 方法：\n\n点击此处查看代码图像\n\n```python\n\
  import inspect\n\nclass Base:\n\n    @classmethod\n\n    def __init_subclass__(cls):\n\
  \        # 创建一个 __repr__ 方法\n        args = list(inspect.signature(cls).parameters)\n\
  \        argvals = ', '.join('{self.%s!r}' % arg for arg in args)\n        code\
  \ = 'def __repr__(self):\\n'\n        code += f' return f\"{cls.__name__}({argvals})\"\
  \\n'\n        locs = { }\n        exec(code, locs)\n        cls.__repr__ = locs['__repr__']\n\
  \nclass Point(Base):\n    def __init__(self, x, y):\n        self.x = x\n      \
  \  self.y = y\n```\n\n如果使用了多重继承，你应该使用 `super()` 来确保所有实现了 `__init_subclass__()` 的类都被调用。例如：\n\
  \n点击此处查看代码图像\n\n```python\nclass A:\n\n    @classmethod\n\n    def __init_subclass__(cls):\n\
  \        print('A.init_subclass')\n        super().__init_subclass__()\n\nclass\
  \ B:\n\n    @classmethod\n\n    def __init_subclass__(cls):\n        print('B.init_subclass')\n\
  \        super().__init_subclass__()\n\n# 在这里应该看到来自两个类的输出\n\nclass C(A, B):\n  \
  \  pass\n```\n\n使用 `__init_subclass__()` 监督继承是 Python 最强大的自定义特性之一。它的强大之处很大程度上源于它的隐式性。顶层基类可以使用此来静静地监督整个子类层次结构。这种监督可以注册类、重写方法、执行验证等。\n\
  \n### 7.23 对象生命周期与内存管理\n\n当定义一个类时，生成的类是创建新实例的工厂。例如：\n\n点击此处查看代码图像\n\n```python\n\
  class Account:\n\n    def __init__(self, owner, balance):\n        self.owner =\
  \ owner\n        self.balance = balance\n\n# 创建一些 Account 实例\n\na = Account('Guido',\
  \ 1000.0)\n\nb = Account('Eva', 25.0)\n```\n\n实例的创建是通过两个步骤完成的：使用特殊方法 `__new__()`\
  \ 创建新实例，以及使用 `__init__()` 对其进行初始化。例如，操作 `a = Account('Guido', 1000.0)` 执行了这些步骤：\n\
  \n点击此处查看代码图像\n\n```python\nclass Account:\n\n    def __init__(self, owner, balance):\n\
  \        self.owner = owner\n        self.balance = balance\n\n# 创建一些 Account 实例\n\
  \na = Account('Guido', 1000.0)\n\nb = Account('Eva', 25.0)\n```\n\n（注：原文中存在大量重复的段落，已根据要求翻译并保留核心逻辑，去重复）\n\
  \n当一个类被定义时，生成的类是创建新实例的工厂。例如：\n\n点击此处查看代码图像\n\n```python\nclass Account:\n\n    def\
  \ __init__(self, owner, balance):\n        self.owner = owner\n        self.balance\
  \ = balance\n\n# 创建一些 Account 实例\n\na = Account('Guido', 1000.0)\n\nb = Account('Eva',\
  \ 25.0)\n```\n\n\n\n有一些方法可以避免对 `__init__()` 的额外调用，但这需要一些巧妙的技巧。避免这种调用的一种方法是让 `__new__()`\
  \ 返回一个完全不同的类型实例——例如，属于另一个类的实例。另一种解决方案（后文描述）是使用元类（metaclass）。\n\n实例一旦创建，将通过引用计数进行管理。如果引用计数变为零，实例将被立即销毁。当实例即将被销毁时，解释器会首先查找与对象关联的\
  \ `__del__()` 方法并调用它。例如：\n\n点击此处查看代码图像\n\n```\nclass Account(object):\n\n    def\
  \ __init__(self, owner, balance):\n        self.owner = owner\n        self.balance\
  \ = balance\n\n    def __del__(self):\n        print('Deleting Account')\n\n>>>\
  \ a = Account('Guido', 1000.0)\n\n>>> del a\n\nDeleting Account\n\n>>>\n```\n\n\
  偶尔，程序会使用 `del` 语句来删除对对象的引用，所示。如果这导致对象的引用计数变为零，就会调用 `__del__()` 方法。然而，通常情况下，`del`\
  \ 语句并不直接调用 `__del__()`，因为在其他地方可能存在该对象的引用。对象被删除还有许多其他方法——例如，变量名的重新赋值或变量在函数中超出作用范围：\n\
  \n点击此处查看代码图像\n\n```\n>>> a = Account('Guido', 1000.0)\n\n>>> a = 42\n\nDeleting\
  \ Account\n\n>>> def func():\n...     a = Account('Guido', 1000.0)\n...\n\n>>> func()\n\
  \nDeleting Account\n\n>>>\n```\n\n在实践中，类很少有必要定义 `__del__()` 方法。唯一的例外是当对象的销毁需要额外的清理操作时——例如关闭文件、关闭网络连接或释放其他系统资源。即使在这些情况下，依赖\
  \ `__del__()` 来实现适当的关机也是危险的，因为无法保证该方法会在你认为应该调用它时被调用。为了干净地关闭资源，你应该给对象提供一个显式的 `close()`\
  \ 方法。你还应该让你的类支持上下文管理器协议，以便能够与 `with` 语句一起使用。这里有一个涵盖所有情况示例：\n\n点击此处查看代码图像\n\n```\n\
  class SomeClass:\n\n    def __init__(self):\n        self.resource = open_resource()\n\
  \n    def __del__(self):\n        self.close()\n\n    def close(self):\n       \
  \ self.resource.close()\n\n    def __enter__(self):\n        return self\n\n   \
  \ def __exit__(self, ty, val, tb):\n        self.close()\n\n# 通过 __del__() 关闭\n\n\
  s = SomeClass()\n\ndel s\n\n# 显式关闭\n\ns = SomeClass()\n\ns.close()\n\n# 在上下文块结束时关闭\n\
  \nwith SomeClass() as s:\n    ...\n```\n\n再次，应该强调的是，在类中编写 `__del__()` 几乎总是没有必要的。Python\
  \ 已经有了垃圾回收机制，除非在对象销毁时需要执行某些额外的操作，否则根本没有必要这样做。即便如此，你可能仍然不需要 `__del__()`，因为对象可能已经程序化为即使你什么都不做也能正确地清理自己。\n\
  \n引用计数和对象销毁的危险不仅于此，某些编程模式——特别是那些涉及父子关系、图或缓存的模式——对象可能会创建所谓的引用循环。这里有一个示例：\n\n点击此处查看代码图像\n\
  \n```\nclass SomeClass:\n\n    def __del__(self):\n        print('Deleting')\n\n\
  parent = SomeClass()\nchild = SomeClass()\n\nparent.child = child\nchild.parent\
  \ = parent\n\ndel parent\ndel child\n```\n\n\n\n\n```python\n>>> Date._cache\n\n\
  {}\n\n>>> a = Date(2012, 12, 21)\n\n>>> Date._cache\n\n{(2012, 12, 21): <weakref\
  \ at 0x10c7ee2c8; to 'Date' at 0x10c805518>}\n\n>>> b = Date(2012, 12, 21)\n\n>>>\
  \ a is b\n\nTrue\n\n>>> del a\n\n>>> Date._cache\n\n{(2012, 12, 21): <weakref at\
  \ 0x10c7ee2c8; to 'Date' at 0x10c805518>}\n\n>>> del b\n\n>>> Date._cache\n\n{}\n\
  \n>>>\n```\n\n如前所述，类的 `__del__()` 方法只有在对象的引用计数变为零时才会被调用。在这个示例中，第一条 `del a` 语句减少了引用计数。但是，由于另一个指向同一个对象的引用，该对象仍然保留在\
  \ `Date._cache` 中。当第二个对象被删除时，`__del__()` 被调用，缓存被清空。\n\n对弱引用的支持要求实例具有一个可变的 `__weakref__`\
  \ 属性。用户定义类的实例通常默认具有此类属性。然而，内置类型和某些特殊数据结构——如命名元组（named tuples）、带有 `slots` 的类——并不具备具备。如果你想为这些类型构造弱引用，可以通过定义添加了\
  \ `__weakref__` 属性的变体来实现：\n\n点击此处查看代码图片\n\n```python\nclass wdict(dict):\n    __slots__\
  \ = ('__weakref__',)\n\nw = wdict()\n\nw_ref = weakref.ref(w)      # 现在可以工作了\n```\n\
  \n这里使用 `slots` 是为了避免不必要的内存开销，稍后会解释。\n\n### 7.25 内部对象表示与属性绑定\n\n与实例关联的状态存储在一个字典中，可以通过实例的\
  \ `__dict__` 属性访问。该字典包含了每个实例特有的数据。这里有一个示例：\n\n点击此处查看代码图片\n\n```python\n>>> a = Account('Guido',\
  \ 1100.0)\n\n>>> a.__dict__\n\n{'owner': 'Guido', 'balance': 1100.0}\n```\n\n可以随时向实例添加新属性：\n\
  \n点击此处查看代码图片\n\n```python\na.number = 123456 # 向 a.__dict__ 中添加属性 'number'\n\na.__dict__['number']\
  \ = 654321\n```\n\n实例的修改总是反映在本地的 `__dict__` 属性中的，除非该属性正被属性（property）管理。同样，如果你直接对\
  \ `__dict__` 进行修改，这些修改也会反映在属性上。\n\n实例通过特殊的属性 `__class__` 链接回它们的类。类本身也只是字典上的一个薄层，该字典可以在类自身的\
  \ `__dict__` 属性中找到。类字典是存放方法的地方。例如：\n\n点击此处查看代码图片\n\n```python\n>>> a.__class__\n\
  \n<class '__main__.Account'>\n\n>>> Account.__dict__.keys()\n\ndict_keys(['__module__',\
  \ '__init__', '__repr__', 'deposit', 'withdraw',\n\n'inquiry', '__dict__', '__weakref__',\
  \ '__doc__'])\n\n>>> Account.__dict__['withdraw']\n\n<function Account.withdraw\
  \ at 0x108204158>\n\n>>>\n```\n\n类通过特殊的属性 `__bases__` 链接到它们的基类，该属性是基类的元组。`__bases__`\
  \ 属性仅具有信息性。继承的实际运行时实现使用 `__mro__` 属性，它是一个按搜索顺序列出的所有父类的元组。这种底层结构是所有获取、设置或删除实例属性操作的基础。\n\
  \n每当使用 `obj.name = value` 设置属性时，特殊方法 `obj.__setattr__('name', value)` 就会被调用。如果使用\
  \ `del obj.name` 删除属性时，特殊方法 `obj.__delattr__('name')` 就会被调用。这些方法的默认行为是修改或从 `obj`\
  \ 的本地 `__dict__` 中移除值，除非请求的属性恰好对应于属性（property）或描述符。在这种情况下，设置和删除操作将由属性相关的设置和删除函数执行。\n\
  \n对于像 `obj.name` 的属性查找，特殊方法 `obj.__getattribute__('name')` 会被调用。该方法执行属性查找，这通常包括检查属性、在本地\
  \ `__dict__` 中查找、检查类字典以及搜索 MRO。如果搜索失败，将通过调用类的 `obj__getattr__('name')` 方法（如果已定义）最后一次尝试查找属性。如果仍然失败，则会抛出\
  \ `AttributeError` 异常。\n\n如果需要，用户定义的类可以实现它们自己的属性访问函数版本。例如，这里有一个限制了可以设置的属性名的类：\n\n\
  点击此处查看代码图片\n\n```python\nclass Account:\n    def __init__(self, owner, balance):\n\
  \        self.owner = owner\n        self.balance = balance\n\n    def deposit(self,\
  \ amount):\n        self.balance += amount\n\n    def withdraw(self, amount):\n\
  \        if self.balance >= amount:\n            self.balance -= amount\n      \
  \  else:\n            raise ValueError(\"Insufficient funds\")\n\n    def inquiry(self):\n\
  \        return f\"{self.owner}'s balance is {self.balance}\"\n\n    def __repr__(self):\n\
  \        return f\"Account({self.owner!r}, {self.balance})\"\n\n    def __setattr__(self,\
  \ name, value):\n        if name in ('owner', 'balance'):\n            super().__setattr__(name,\
  \ value)\n        else:\n            raise AttributeError(f\"Cannot set attribute\
  \ {name!r}\")\n\n    def __delattr__(self, name):\n        if name in ('owner',\
  \ 'balance'):\n            super().__delattr__(name)\n        else:\n          \
  \  raise AttributeError(f\"Cannot delete attribute {name!r}\")\n\na = Account('Guido',\
  \ 1100.0)\na.deposit(500)\nprint(a.inquiry())\na.withdraw(200)\nprint(a.inquiry())\n\
  # a.number = 123456  # 将抛出 AttributeError\n```\n\n### 7.26 代理、包装器与委托\n\n有时类通过实现另一个对象的包装层来创建代理（proxy）。代理对象与其他对象相同的接口，但由于某些原因没有继承关系。在许多现实场景中都会出现这种情况，例如在分布式计算中，对象的实际实现可能位于远程服务器上。与对象交互的客户端可能使用代理。\n\
  \n常见的代理实现技术涉及 `__getattr()` 方法。这里有一个简单的示例：\n\n```python\nclass A:\n    def __init__(self,\
  \ owner, balance):\n        self.owner = owner\n        self.balance = balance\n\
  \n    def deposit(self, amount):\n        self.balance += amount\n\n    def withdraw(self,\
  \ amount):\n        if self.balance >= amount:\n            self.balance -= amount\n\
  \        else:\n            raise ValueError(\"Insufficient funds\")\n\n    def\
  \ inquiry(self):\n        return f\"{self.owner}'s balance is {self.balance}\"\n\
  \n    def __repr__(self):\n        return f\"Account({self.owner!r}, {self.balance})\"\
  \n\nclass LoggedA:\n    def __init__(self, owner, balance):\n        self._a = A(owner,\
  \ balance)\n\n    def __getattr__(self, name):\n        print(\"Accessing\", name)\n\
  \        return getattr(self._a, name)\n\n# 使用示例\na = LoggedA('Guido', 1100.0)\n\
  print(a.inquiry()) # 打印 Accessing inquiry 并输出结果\na.deposit(500)     # 打印 Accessing\
  \ deposit\n```\n\n委托（Delegation）有时作为继承的替代方案。这里有一个示例：\n\n```python\nclass A:\n  \
  \  def __init__(self, owner, balance):\n        self.owner = owner\n        self.balance\
  \ = balance\n\n    def deposit(self, amount):\n        self.balance += amount\n\n\
  \    def withdraw(self, amount):\n        if self.balance >= amount:\n         \
  \   self.balance -= amount\n        else:\n            raise ValueError(\"Insufficient\
  \ funds\")\n\n    def inquiry(self):\n        return f\"{self.owner}'s balance is\
  \ {self.balance}\"\n\n    def __repr__(self):\n        return f\"Account({self.owner!r},\
  \ {self.balance})\"\n\nclass B:\n    def __init__(self, owner, balance):\n     \
  \   self._a = A(owner, balance)\n\n    def grok(self):\n        print('B.grok')\n\
  \n    def __getattr__(self, name):\n        return getattr(self._a, name)\n\n# 使用示例\n\
  b = B('Guido', 1100.0)\nb.spam()      -> A.spam\nb.grok()      -> B.grok   （重写的方法）\n\
  b.yow()       -> A.yow\n```\n\n在这个示例中，看起来类 `B` 可能继承自类 `A` 并重写了单个方法。这是观察到的行为——但并没有使用继承。相反，`B`\
  \ 内部持有对 `A` 的引用。`A` 的某些方法可以被重写。然而，所有其他方法都通过 `__getattr__()` 方法进行委托。\n\n\n\n\n\n\
  通过 `__getattr__()` 转发属性查找的技术是一种常用技术。然而，请注意，它并不适用于映射到特殊方法的运算。例如，考虑以下类：\n\n点击此处查看代码图像\n\
  \n```python\nclass ListLike:\n\n    def __init__(self):\n        self._items = list()\n\
  \n    def __getattr__(self, name):\n        return getattr(self._items, name)\n\n\
  # Example\n\na = ListLike()\n\na.append(1)         # 正常\n\na.insert(0, 2)      #\
  \ 正常\n\na.sort()            # 正常\n\nlen(a)              # 失败。没有 __len__() 方法\n\n\
  a[0]                # 失败。没有 __getitem__() 方法\n```\n\n在这里，该类成功地将所有标准列表方法（`list.sort()`、`list.append()`\
  \ 等）转发给内部列表。然而，Python 的所有标准运算符都无法工作。要让这些操作符工作，你必须显式地实现所需的特殊方法。例如：\n\n点击此处查看代码图像\n\
  \n```python\nclass ListLike:\n\n    def __init__(self):\n        self._items = list()\n\
  \n    def __getattr__(self, name):\n        return getattr(self._items, name)\n\n\
  \    def __len__(self):\n        return len(self._items)\n\n    def __getitem__(self,\
  \ index):\n        return self._items[index]\n\n    def __setitem__(self, index,\
  \ value):\n        self._items[index] = value\n```\n\n### 7.27 使用 `__slots__` 减少内存占用\n\
  \n正如我们所见，实例在字典中存储数据。如果你正在创建大量的实例，可能会引入大量的内存开销。如果你知道属性名称是固定的，可以在一个名为 `__slots__`\
  \ 的特殊类变量中指定这些名称。这里有一个示例：\n\n点击此处查看代码图像\n\n```python\nclass Account(object):\n\n\
  \    __slots__ = ('owner', 'balance')\n\n      ...\n```\n\nSlots 是一种定义提示，允许 Python\
  \ 对内存使用和执行速度进行性能优化。带有 `__slots__` 的类实例不再使用字典来存储实例数据。相反，它使用一种基于数组的更紧凑的数据结构。在创建大量对象的程序中，使用\
  \ `__slots__` 可以显著减少内存占用，并略微提高执行速度。\n\n`__slots__` 中的条目仅限实例属性。你不需要列出方法、属性、类变量或任何其他类级属性。基本上，它们与通常出现在实例\
  \ `__dict__` 字典中作为键的名称是相同的。\n\n请注意，`__slots__` 与继承之间存在复杂的交互。如果一个类继承自使用 `__slots__`\
  \ 的基类，那么它也需要定义 `__slots__` 来存储自己的属性（即使它没有添加任何新属性），以利用 `__slots__` 提供的优势。如果你忘记了这一点，派生类的运行速度会更慢——而且使用的内存甚至比任何一个类都没有使用\
  \ `__slots__` 时还要多！\n\n`__slots__` 与多继承不兼容。如果指定了多个基类且每个基类都有非空 slots，你将得到 `TypeError`。\n\
  \n使用 `__slots__` 的还可能会破坏期望实例具有底层 `__dict__` 属性的代码。虽然这通常不适用于用户代码，但支持对象的实用库和其他工具可能被设计为为了调试、对象序列化和其他操作而查看\
  \ `__dict__`。\n\n`__slots__` 的存在对在类中重定义的诸如 `__getattribute__()`、`__getattr__()`\
  \ 和 `__setattr__()` 等方法的调用没有影响。然而，如果你实现此类方法，请注意不再有任何实例 `__dict__` 属性。你的实现需要考虑到这一点。\n\
  \n### 7.28 描述符\n\n通常，属性访问对应于字典操作。如果需要更多的控制，可以将属性访问路由到用户定义的 `get`、`set` 和 `delete`\
  \ 函数。之前描述过属性（properties）的使用。但属性实际上是使用一种被称为描述符（descriptor）的低级结构实现的。描述符是一个用于管理属性访问的类级对象。通过实现\
  \ `__get__()`、`__set__()` 和 `__delete__()` 特殊方法中的一个或多个，你可以直接钩入属性访问机制并自定义这些操作。这是一个示例：\n\
  \n点击此处查看代码图像\n\n```python\nclass Typed:\n\n    expected_type = object\n\n    def\
  \ __set_name__(self, cls, name):\n        self.key = name\n\n    def __get__(self,\
  \ instance, cls):\n        if instance:\n            return instance.__dict__[self.key]\n\
  \        else:\n            return self\n\n    def __set__(self, instance, value):\n\
  \        if not isinstance(value, self.expected_type):\n            raise TypeError(f'Expected\
  \ {self.expected_type}')\n        instance.__dict__[self.key] = value\n\n    def\
  \ __delete__(self,instance):\n        raise AttributeError(\"Can't delete attribute\"\
  )\n\nclass Integer(Typed):\n    expected_type = int\n\nclass Float(Typed):\n   \
  \ expected_type = float\n\nclass String(Typed):\n    expected_type = str\n```\n\n\
  在这个示例中，`Typed` 类定义了 `__get__()`、`__set__()` 和 `__delete__()` 方法。在 `Account` 中这些这些类展示了它们是如何工作的。例如：\n\
  \n点击此处查看代码图像\n\n```python\na = Account('Guido', 1000.0)\n\nb = a.owner         \
  \  # 调用 Account.__get__(a, Account)\n\na.owner = 'Eva'       # 调用 Account.__set__(a,\
  \ 'Eva')\n\ndel a.owner           # 调用 Account.__delete__(a)\n```\n\n\n\n\n\n仅实现\
  \ `__get__()` 的描述符被称为方法描述符（method descriptor）。与同时具有 get/set 能力的描述符相比，它的绑定关系要弱一些。具体来说，方法描述符的\
  \ `__get__()` 方法只有在实例字典中没有匹配的条目时才会被调用。由于它之所以被称为方法描述符，是因为这种描述符主要用于实现 Python 的各种类型的方法——包括实例方法、类方法和静态方法。\n\
  \n例如，这里有一个骨架实现，展示了如何从零开始实现 `@classmethod` 和 `@staticmethod`（实际实现效率更高）：\n\n点击此处查看代码图片\n\
  \n```python\nimport types\n\nclass classmethod:\n\n    def __init__(self, func):\n\
  \n        self.__func__ = func\n\n    # 返回一个以 cls 为第一个参数的绑定方法\n\n    def __get__(self,\
  \ instance, cls):\n\n        return types.MethodType(self.__func__, cls)\n\nclass\
  \ staticmethod:\n\n    def __init__(self, func):\n        self.__func__ = func\n\
  \n    # 返回原始函数\n\n    def __get__(self, instance, cls):\n\n        return self.__func__\n\
  ```\n\n由于方法描述符仅在实例字典中没有匹配条目时起作用，它们也可以用于实现各种形式的属性懒求值（lazy evaluation）。例如：\n\n点击此处查看代码图片\n\
  \n```python\nclass Lazy:\n\n    def __init__(self, func):\n\n        self.func =\
  \ func\n\n    def __set_name__(self, cls, name):\n\n        self.key = name\n\n\
  \    def __get__(self, instance, cls):\n\n        if instance:\n\n            value\
  \ = self.func(instance)\n\n            instance.__dict__[self.key] = value\n\n \
  \           return value\n\n        else:\n\n            return self\n\nclass Rectangle:\n\
  \n    def __init__(self, width, height):\n\n        self.width = width\n\n     \
  \   self.height = height\n\n    area = Lazy(lambda self: self.width * self.height)\n\
  \n    perimeter = Lazy(lambda self: 2*self.width + 2*self.height)\n```\n\n在这个示例中，`area`\
  \ 和 `perimeter` 是按需计算并存储在实例字典中的属性。一旦计算完成，值将直接从实例字典返回。\n\n点击此处查看代码图片\n\n```python\n\
  >>> r = Rectangle(3, 4)\n\n>>> r.__dict__\n\n{'width': 3, 'height': 4 }\n\n>>> r.area\n\
  \n12\n\n>>> r.perimeter\n\n14\n\n>>> r.__dict__\n\n{'width': 3, 'height': 4, 'area':\
  \ 12, 'perimeter': 14 }\n\n>>>\n```\n\n### 7.29 类定义过程\n\n类的定义是一个动态过程。当你使用 `class`\
  \ 语句定义一个类时，会创建一个新的字典作为局部类命名空间。然后，类体会在该命名空间内作为脚本执行。最终，该命名空间将成为生成的类对象的 `__dict__`\
  \ 属性。\n\n类体中允许任何合法的 Python 语句。通常你你只定义函数和变量，但控制流、导入、嵌套类以及其他所有内容都是允许的。例如，这里有一个条件定义方法的类：\n\
  \n点击此处查看代码图片\n\n```python\ndebug = True\n\nclass Account:\n\n    def __init__(self,\
  \ owner, balance):\n\n        self.owner = owner\n\n        self.balance = balance\n\
  \n    if debug:\n\n        import logging\n\n        log = logging.getLogger(f'{__module__}.{__qualname__}')\n\
  \n        def deposit(self, amount):\n\n            Account.log.debug('Depositing\
  \ %f', amount)\n\n            self.balance += amount\n\n        def withdraw(self,\
  \ amount):\n\n            Account.log.debug('Withdrawing %f', amount)\n\n      \
  \      self.balance -= amount\n\n    else:\n        def deposit(self, amount):\n\
  \n            self.balance += amount\n\n        def withdraw(self, amount):\n\n\
  \            self.balance -= amount\n```\n\n在这个示例中，使用全局变量 `debug` 来条件地定义方法。`__qualname__`\
  \ 和 `__module__` 变量是预定义的字符串，包含了有关类名和所在模块的信息。这些变量可以被类体中的语句使用。在示例中，它们被用于配置日志系统。可能存在更整洁的方法来组织上述代码，但关键点在于你可以在类中放入任何想要的内容。\n\
  \n类定义的一个关键点是，用于存放类体内容的命名空间并不是变量的作用域。在方法内部使用的任何名称（如上例中的 `Account.log`）都需要是完全限定的（fully\
  \ qualified）。\n\n如果在类体中使用类似 `locals()` 的函数（但在方法内部不是），它将返回用于类命名空间的字典。\n\n### 7.30\
  \ 动态创建类\n\n通常，类是使用 `class` 语句创建的，但这并非强制要求。正如前一节所述，类是通过执行类体来填充命名空间而定义的。如果你能够用自己的定义填充一个字典，你就可以在不使用\
  \ `class` 语句的情况下创建一个类。要这样做，请使用 `types.new_class()`：\n\n点击此处查看代码图片\n\n```python\n\
  import types\n\n# 使用方法（不是类）\n\ndef __init__(self, owner, balance):\n\n    self.owner\
  \ = owner\n\n    self.balance = balance\n\ndef deposit(self, amount):\n\n    self.balance\
  \ += amount\n\ndef withdraw(self, amount):\n\n    self.balance -= amount\n\nmethods\
  \ = {\n\n   '__init__': __init__,\n\n   'deposit': deposit,\n\n   'withdraw': withdraw,\n\
  \n}\n\n# 你现在有了类\n\na = types.new_class('Account', (),\n\n          exec_body=lambda\
  \ ns: ns.update(methods))\n\na.deposit(50)\n\na.withdraw(25)\n```\n\n`new_class()`\
  \ 函数需要一个类名、一个基类组以及一个负责填充类的回调函数。该回调函数接收类命名空间。它应该对该字典进行更新。回调函数的返回值会被忽略。\n\n动态创建类在你想要从数据创建类时可能是非常有用的。为了从数据创建类，也许方法更好。例如，在描述符章节中，定义了以下类：\n\
  \n点击此处查看代码图片\n\n```python\nclass Integer(Typed):\n\n    expected_type = int\n\n\
  class Float(Typed):\n\n    expected_type = float\n\nclass String(Typed):\n\n   \
  \ expected_type = str\n```\n\n这段代码是高度重复的。也许一种数据驱动的方法会更好：\n\n点击此处查看代码图片\n\n```python\n\
  typed_classes = [\n\n   ('Integer', int),\n\n   ('Float', float),\n\n   ('String',\
  \ str),\n\n   ('Bool', bool),\n\n   ('Tuple', tuple),\n\n]\n\nglobals().update(\n\
  \n   (name, types.new_class(name, (Typed,),\n\n          exec_body=lambda ns: ns.update(expected_type=ty)))\n\
  \n   for name, ty in typed_classes)\n```\n\n在这个示例中，全局模块命名空间通过 `types.new_class()`\
  \ 被动态更新。如果你想制作更多类，只需在 `typed_classes` 列表中添加相应的条目。\n\n有时你会看到使用 `type()` 来动态创建类。例如：\n\
  \n点击此处查看代码图片\n\n```python\nAccount = type('Account', (), methods)\n```\n\n这种方法可行，但它没有考虑到一些高级的类机制（元类，稍后将讨论）。在现代代码中，请尝试使用\
  \ `types.new_class()` 替代。\n\n### 7.31 元类\n\n当你在 Python 中定义类时，类定义本身就变成了一个对象。这里有一个示例：\n\
  \n点击此处查看代码图片\n\n```python\nclass Account:\n\n    def __init__(self, owner, balance):\n\
  \n        self.owner = owner\n\n        self.balance = balance\n\n    def deposit(self,\
  \ amount):\n\n        self.balance += amount\n\n    def withdraw(self, amount):\n\
  \n        self.balance -= amount\n\nisinstance(Account, object)       # -> True\n\
  ```\n\n\n\n\n如果你对这个问题思考足够久，你会发现如果 `Account` 是一个对象，那么必须有什么东西创建了它。这种类对象的创建是由一种特殊的类——`metaclass`（元类）来控制的。简单来说，元类是创建类实例的类。\n\
  \n在在上一个示例中，创建 `Account` 的元类是一个名为 `type` 的内置类。事实上，如果你检查 `Account` 的类型，你会发现它是 `type`\
  \ 的一个实例：\n\n点击此处查看代码图片\n\n```python\n>>> Account.__class__\n\n<type 'type'>\n\n\
  >>>\n```\n\n这有点绕脑，但它和整数是相似的。例如，如果你写 `x = 42` 然后查看 `x.__class__`，你将得到 `int`，这是创建整数的类。同样，`type`\
  \ 创建了类型或类的实例。\n\n当使用 `class` 语句定义一个新类时，会发生一系列操作。首先，会为该类创建一个新的命名空间。接着，会在该命名空间执行类体。最后，使用类名、基类和填充好的命名空间来创建类实例。以下代码说明了所发生的底层步骤：\n\
  \n点击此处查看代码图片\n\n```python\n# Step 1: 创建类命名空间\n\nnamespace = type.__prepare__('Account',\
  \ ())\n\n# Step 2: 执行类体\n\nexec('''\n\ndef __init__(self, owner, balance):\n   \
  \ self.owner = owner\n    self.balance = balance\n\ndef deposit(self, amount):\n\
  \    self.balance += amount\n\ndef withdraw(self, amount):\n    self.balance -=\
  \ amount\n''', globals(), namespace)\n\n# Step 3: 创建最终的类对象\n\nAccount = type('Account',\
  \ (), namespace)\n```\n\n在定义过程中，会与 `type` 类进行交互以创建类命名空间并创建最终的类对象。使用 `type` 的选择是可以自定义的——类可以通过指定不同的元类来选择由不同的类型类处理。这是通过在继承中使用\
  \ `metaclass` 关键字参数来实现：\n\n点击此处查看代码图片\n\n```python\nclass Account(metaclass=type):\n\
  \    ...\n```\n\n如果没有给出 `metaclass`，`class` 语句会检查基类元组中第一个条目的类型（如果有的话），并将其用作元类。因此，如果你写\
  \ `class Account(object)`，结果 `Account` 类将具有与 `object` 相同的类型（即 `type`）。注意，完全没有指定任何父类的类总是继承自\
  \ `object`，所以这仍然适用。\n\n要创建一个新的元类，请定义继承自 `type` 的类。在这个类中，你可以重新定义在类创建过程中使用的一个或多个方法。通常，这包括用于创建类命名空间的\
  \ `__prepare__()` 方法、用于创建类实例的 `__new__()` 方法、在类已创建后调用的 `__init__()` 方法，以及用于创建新实例的\
  \ `__call__()` 方法。以下示例实现了一个元类，它仅仅打印每个方法的输入参数，以便你进行实验：\n\n点击此处查看代码图片\n\n```python\n\
  class mytype(type):\n    # Creates the class namespace\n    @classmethod\n    def\
  \ __prepare__(meta, clsname, bases):\n        print(\"Preparing:\", clsname, bases)\n\
  \        return super().__prepare__(clsname, bases)\n\n    # Creates the class instance\
  \ after body has executed\n    @staticmethod\n    def __new__(meta, clsname, bases,\
  \ namespace):\n        print(\"Creating:\", clsname, bases, namespace)\n       \
  \ return super().__new__(meta, clsname, bases, namespace)\n\n    # Initializes the\
  \ class instance\n    def __init__(cls, clsname, bases, namespace):\n        print(\"\
  Initializing:\", clsname, bases, namespace)\n        super().__init__(clsname, bases,\
  \ namespace)\n\n    # Creates new instances of the class\n    def __call__(cls,\
  \ *args, **kwargs):\n        print(\"Creating instance:\", args, kwargs)\n     \
  \   return super().__call__(*args, **kwargs)\n\n# Example\nclass Base(metaclass=mytype):\n\
  \    pass\n\n# Definition of the Base produces the following output\n# Preparing:\
  \ Base ()\n# Creating: Base () {'__module__': '__main__', '__qualname__': 'Base'}\n\
  # Initializing: Base () {'__module__': '__main__', '__qualname__': 'Base'}\nb =\
  \ Base()\n# Creating instance: () {}\n```\n\n使用元类的一个棘手方面是变量命名以及跟踪涉及的各种实体。在上面的代码中，`meta`\
  \ 名称指代元类本身。`cls` 名称指代元类创建的类实例。虽然在这里没有使用，但 `self` 名称指代由类创建的普通实例。\n\n元类通过继承传播。所以，如果你定义了一个使用不同元类的基类，所有子类也将也将使用该元类。尝试这个示例来查看你自定义元类的运行情况：\n\
  \n点击此处查看代码图片\n\n```python\nclass Account(Base):\n    def __init__(self, owner, balance):\n\
  \        self.owner = owner\n        self.balance = balance\n\n    def deposit(self,\
  \ amount):\n        self.balance += amount\n\n    def withdraw(self, amount):\n\
  \        self.balance -= amount\n\nprint(type(Account))   # <class 'mytype'>\n```\n\
  \n\n\n\n```python\nclass NoDupeDict(dict):\n    def __setitem__(self, key, value):\n\
  \        if key in self:\n            raise AttributeError(f'{key} already defined')\n\
  \        super().__setitem__(key, value)\n\nclass NoDupeMeta(type):\n    @classmethod\n\
  \    def __prepare__(meta, clsname, bases):\n        return NoDupeDict()\n\nclass\
  \ Base(metaclass=NoDupeMeta):\n    pass\n\n# Example\nclass SomeClass(Base):\n \
  \   def yow(self):\n        print('Yow!')\n    def yow(self, x):             # Fails.\
  \ Already defined\n        print('Different Yow!')\n```\n\n这只是可能实现的一小部分。对于框架构建者来说，元类（metaclasses）提供了一个紧密控制类定义期间发生情况的机会——允许类充作为一种领域特定语言。\n\
  \n在历史上，元类一直被用于完成各种任务，而这些任务现在可以通过其他手段实现。特别是 `__init_subclass__()` 方法，可以处理许多曾经需要元类的用例。这包括将类注册到中央注册表、方法的自动装饰以及代码生成。\n\
  \n### 7.32 用于实例和类的内置对象\n\n本节提供了关于用于表示类型和实例的低层对象的细节。这些信息对于低层元编程以及需要直接操作类型的代码可能很有用。\n\
  \n表 7.1 显示了类型对象 `cls` 的常用属性。\n\n| 属性 | 描述 |\n| --- | --- |\n| `cls.__name__` | 类名\
  \ |\n| `cls.__module__` | 定义类所在的模块名 |\n| `cls.__qualname__` | 完全限定的类名 |\n| `cls.__bases__`\
  \ | 基类元组 |\n| `cls.__mro__` | 方法解析顺序元组 |\n| `cls.__dict__` | 存储类方法和变量的字典 |\n| `cls.__doc__`\
  \ | 文档字符串 |\n| `cls.__annotations__` | 类类型提示字典 |\n| `cls.__abstractmethods__` |\
  \ 抽象方法名集合（如果没有抽象方法，则可能未定义）。 |\n\n表 7.1 类型的属性\n\n`cls.__name__` 属性包含短的类名。`cls.__qualname__`\
  \ 属性包含带有周围上下文额外信息的完全限定名（如果类定义在函数内部或你创建了嵌套类定义，这可能很有用）。`cls.__annotations__` 字典包含类级类型提示（如果有的话）。\n\
  \n表 7.2 显示了实例 `i` 的特殊属性。\n\n| 属性 | 描述 |\n| --- | --- |\n| `i.__class__` | 实例所属的类\
  \ |\n| `i.__dict__` | 存储实例数据的字典（如果已定义） |\n\n表 7.2 实例属性\n\n`__dict__` 属性通常是存储所有与实例相关联数据的地方。然而，如果用户定义的类使用了\
  \ `__slots__`，则会使用更高效的内部表示，实例将不会有 `__dict__` 属性。\n\n### 7.33 结语：保持简单\n\n本章介绍了许多关于类以及自定义和控制类的方法和信息。然而，在编写类时，保持简单通常是最佳策略。是的，你可以使用抽象基类、元类、描述符、类装饰器、属性（properties）、多继承、混入（mixins）、模式和类型提示。但你也可以只写一个普通的类。这个类很有可能足够好，而且所有人都能理解它在做什么。\n\
  \n从大局来看，退后一步并考虑一些通常理想的代码质量是有用的。首先也是最重要的，可读性非常重要——如果你堆叠了太多的抽象层，可读性往往会下降。其次，你应该尝试编写易于观察和调试的代码，并且不要忘记使用\
  \ REPL。最后，使代码具有测试性通常是良好设计的驱动力。如果你的代码无法测试或测试起来太别扭，那么可能有更好的方法来组织你的解决方案。\n\n## 8. 模块和包\n\
  \nPython 程序组织成模块和包，通过 `import` 语句加载。本章将更详细地描述模块和包系统。重点是使用模块和包进行编程，而不是将代码打包以便给他人部署的过程。对于后者，请参阅\
  \ [`https://packaging.python.org/tutorials/packaging-projects/](https://packaging.python.org/tutorials/packaging-projects/)\
  \ 的最新文档。\n\n### 8.1 模块和 `import` 语句\n\n任何 Python 源文件都可以被导入为模块。例如：\n\n点击此处查看代码图片\n\
  \n```python\n# module.py\n\na = 37\n\ndef func():\n    print(f'func says that a\
  \ is {a}')\n\nclass SomeClass:\n    def method(self):\n        print('method says\
  \ hi')\nprint('loaded module')\n```\n\n该文件包含常见的编程元素——包括全局变量、函数、类定义和一个孤立的语句。这个示例说明了模块加载的一些重要（有时是微妙的）特性。\n\
  \n要加载模块，使用 `import module` 语句。例如： \n\n点击此处查看代码图片\n\n```python\n>>> import module\n\
  \nloaded module\n\n>>> module.a\n\n37\n\n>>> module.func()\n\nfunc says that a is\
  \ 37\n\n>>> s = module.SomeClass()\n\n>>> s.method()\n\nmethod says hi\n```\n\n\
  在执行导入时，会发生几件事：\n\n1. 找到模块。如果找不到，则抛出 `ImportError` 异常。\n2. 创建一个新的模块对象。该对象作为模块内定义的容器。这有时被称为命名空间。\n\
  3. 在模块内执行模块源代码。\n4. 如果没有错误，在调用者处创建一个指向模块对象的名称。该名称与模块名相同，但不带任何后缀。例如，如果代码在 `module.py`\
  \ 中，名称为 `module`（后者会产生相当困惑的错误信息）。该文件需要放在 `sys.path` 找到的目录之一。\n\n其余步骤都与模块定义孤立环境有关。模块中出现的所有定义都对该模块的。因此，变量、函数和类的名称不会与其他模块中的相同名称发生冲突。访问模块中的定义时，使用完全限定名，如\
  \ `module.func()`。\n\n\n\n\n\n点击此处查看代码图片\n\n```\nimport numpy as np\n\nimport pandas\
  \ as pd\n\nimport matplotlib as plt\n\n...\n```\n\n当一个模块被重命名时，新名称仅适用于 `import` 语句出现的上下文中。其他不相关的程序模块仍然可以使用其原始名称加载该模块。\n\
  \n为导入的模块分配不同的名称，可以作为管理通用功能的不同实现或编写可扩展程序的的有用工具。例如，如果你有两个模块 `unixmodule.py` 和 `winmodule.py`，它们都定义了函数\
  \ `func()`，但涉及依赖于平台的实现细节，你可以编写代码来选择性地导入模块：\n\n点击此处查看代码图片\n\n```\nif platform ==\
  \ 'unix':\n    import unixmodule as module\n\nelif platform == 'windows':\n    import\
  \ winmodule as module\n\n...\n\nr = module.func()\n```\n\n模块是 Python 中的一等对象。这意味着它们可以被赋值给变量，可以放入数据结构中，并作为数据在程序中传递。例如，上例中的\
  \ `module` 名称是一个引用对应模块对象的变量。\n\n### 8.2 模块缓存\n\n模块的源代码只会被加载和执行一次，无论你使用 `import`\
  \ 语句的频率如何。随后的 `import` 语句会将模块名称绑定到由之前的 `import` 已创建的模块对象。\n\n新学者一个常见的困惑是：当一个模块被导入交互式会话后，修改了其源代码（例如为了修复错误），但新的\
  \ `import` 无法加载修改后的代码。这是模块缓存的因。即使底层源代码已更新，Python 也永远不会重新加载之前导入的模块。\n\n你可以在 `sys.modules`\
  \ 中找到所有当前加载模块的缓存，它是一个将模块名称映射到模块对象的字典。该字典的内容用于判断 `import` 是否加载模块的最新副本。从缓存中删除模块将强制其在下一次\
  \ `import` 语句时重新加载。然而，由于第 8.5 节](#ch08.xhtml_ch08lev1sec5) 中关于模块重载的解释，这很少是安全的。\n\
  \n有时你会看到 `import` 在函数内部被使用，如下所示：\n\n点击此处查看代码图片\n\n```\ndef f(x):\n    import math\n\
  \    return math.sin(x) + math.cos(x)\n```\n\n初看之下，这种实现方式似乎会非常缓慢——每次调用都要加载一个模块。实际上，`import`\
  \ 的代价微乎其微——它只是单次字典查找，因为 Python 会立即在缓存中找到该模块。将 `import` 放在函数内部的主要反对意见是风格问题——更常见的做法是将所有的模块导入列在文件顶部，以便于查看。另一方面，如果你有一个很少调用的特殊函数，将该函数的导入依赖放在函数体内部可以加快程序的加载速度。在这种情况下，你只有在实际需要时才会加载所需的模块。\n\
  \n### 8.3 从模块中导入选名称（Names）\n\n你可以使用 `from module import name` 语句从模块中将特定的定义加载到当前命名空间。它与\
  \ `import` 相同，不同在于，它不是创建一个引用新创建模块命名空间的名称，而是将模块中定义的一个或多个对象的引用放置在当前命名空间中：\n\n点击此处查看代码图片\n\
  \n```\nfrom module import func  # 导入模块并将 func 放入当前命名空间\n\nfunc()               \
  \    # 调用 module.func()\n\nmodule.func()            # 失败。NameError: module\n```\n\
  \n如果你需要多个定义，`from` 语句接受逗号分隔的名称。例如：\n\n点击此处查看代码图片\n\n```\nfrom module import func,\
  \ SomeClass\n```\n\n从语义上讲，`from module import name`语句执行从模块缓存到本地命名空间的名称拷贝。也就是说，Python\
  \ 首先在后台执行 `import module`。之后，它执行从缓存到本地名称的赋值，例如 `name = sys.modules['module'].name`。\n\
  \n一个常见的误解是 `from module import name` 语句更高效——可能只加载了模块的一部分。事实并非如此。无论如何，整个模块都会加载并存储在缓存中。\n\
  \n使用 `from` 语法导入函数不会改变它们的作用域规则。当函数查找变量时，它们只会在定义函数所在文件中查找，而不会在函数被导入和调用的命名空间中查找。例如：\n\
  \n点击此处查看代码图片\n\n```\n>>> from module import func\n\n>>> a = 42\n\n>>> func()\nfunc\
  \ says that a is 37\n\n>>> func.__module__\n'module'\n\n>>> func.__globals__['a']\n\
  37\n\n>>>\n```\n\n另一个相关的困惑涉及全局变量的行为。例如，考虑这段代码，它同时导入了 `func` 和它所使用的全局变量 `a`：\n\n\
  点击此处查看代码图片\n\n```\nfrom module import a, func\n\na = 42\nfunc()\nfunc says that\
  \ a is 37\nprint(a)\n```\n\n### 8.4 循环导入\n\n如果两个模块相互导入对方，就会出现一个奇怪的问题。例如，假设你有两个文件：\n\
  \n点击此处查看代码图片\n\n\n\n\n\n```python\n# ----------------------------\n\n# moda.py\n\
  \nimport modb\n\ndef func_a():\n    modb.func_b()\n\nclass Base:\n    pass\n\n#\
  \ ----------------------------\n\n# modb.py\n\nimport moda\n\ndef func_b():\n  \
  \  print('B')\n\nclass Child(moda.Base):\n    pass\n```\n\n这段代码中存在一种奇怪的导入顺序依赖。先使用\
  \ `import modb` 可以正常运行，但如果你先写 `import moda`，程序就会崩溃并抛出关于 `moda.Base` 未定义的错误。\n\n\
  要理解发生了什么，你必须遵循控制流。`import moda` 开始执行 `moda.py` 文件。它遇到的第一个语句是 `import modb`。因此，控制权切换到\
  \ `modb.py`。该文件的第一条语句是 `import moda`。该导入并没有进入递归循环，而是通过模块缓存（module cache）得到了满足，控制权继续执行\
  \ `modb.py` 中的下一语句。这是好事——循环导入不会导致 Python 死锁或进入新的时空维度。然而，在执行到此处时，模块 `moda` 仅被部分求值。当控制权到达\
  \ `class Child(moda.Base)` 语句时，程序崩溃了。因为所需的 `Base` 类尚未被定义。\n\n解决此问题的方法之一是将 `import\
  \ modb` 语句移动到其他地方。例如，你可以将导入移动到 `func_a()` 中，那里才是真正需要定义的地方：\n\n点击此处查看代码图片\n\n```python\n\
  # moda.py\n\ndef func_a():\n    import modb\n    modb.func_b()\n\nclass Base:\n\
  \    pass\n```\n\n你也可以将导入移动到文件的后续位置：\n\n点击此处查看代码图片\n\n```python\n# moda.py\n\ndef\
  \ func_a():\n    modb.func_b()\n\nclass Base:\n    pass\n\nimport modb     # 必须在\
  \ Base 定义之后\n```\n\n这两种解决方案在代码审查中都可能引起关注。在大多数情况下，你不会看到模块导入出现在文件的末尾。循环导入的存在几乎总是意味着代码组织上存在问题。处理此问题的更好方法是将\
  \ `Base` 的定义移动到单独的文件 `base.py`，并重写 `modb.py` 如下：\n\n点击此处查看代码图片\n\n```python\n# modb.py\n\
  \nimport base\n\ndef func_b():\n    print('B')\n\nclass Child(base.Base):\n    pass\n\
  ```\n\n### 8.5 模块的重载与卸载\n\nPython 对于对已导入模块进行重载或卸载并没有提供可靠的支持。虽然你可以从 `sys.modules`\
  \ 中移除一个模块，但这并不会从内存中卸载该模块。这是因为导入了该模块的其他模块中仍然存在对该缓存模块对象的引用。此外，如果模块中定义了类实例，这些实例包含了指向其所属类对象的引用，而类对象反过来持有指向定义它们所在模块的引用。\n\
  \n模块引用存在于许多地方这一事实，使得在修改模块实现后重新加载该模块通常是不现实的。例如，如果你从 `sys.modules` 中移除一个模块并使用 `import`\
  \ 重新加载它，这不会追溯性地改变程序中之前所有对模块的引用。相反，你将拥有由最近 `import` 语句创建的新模块引用，以及一组由代码其他部分的导入所创建的旧模块引用。这通常不是你想要的。除非你能够仔细地控制整个执行环境，否则模块重载在任何理智的生产代码中都永远是不安全的。\n\
  \n`importlib` 库中提供了一个 `reload()` 函数用于重载模块。你将已加载的模块作为参数传递给它。例如：\n\n点击此处查看代码图片\n\n\
  ```python\n>>> import module\n>>> import importlib\n>>> importlib.reload(module)\n\
  \nloaded module\n<module 'module' from 'module.py'>\n\n>>>\n```\n\n`reload()` 的工作原理是加载一个新版本的模块源代码，然后在已有的模块命名空间上执行它。这种操作是在不清除之前的命名空间的情况下完成的。这完全等同于你在不重启解释器的情况下，直接在旧代码上输入新源码。\n\
  \n如果其他模块之前使用标准的 `import` 语句（如 `import module`）导入了被重载的模块，那么重载将使它们像魔法一样看到更新后的代码。然而，这仍然存在许多危险。首先，重载不会重载被重载文件可能导入的任何模块。它不是递归的——它只适用于传递给\
  \ `reload()` 的单个模块。其次，如果任何模块使用了 `from module import name` 形式的导入，这些导入将无法感知到重载的影响。最后，如果已经创建了类实例，重载不会更新它们底层的类定义。事实上，你现在同一个程序中拥有同一个类的两个不同定义：一个是在重载时仍供所有现有实例使用的旧定义，另一个是用于新实例的新定义。这几乎总是令人感到困惑的。\n\
  \n最后，需要注意的是，Python 的 C/C++ 扩展无法以任何方式安全地卸载或重载。对此没有提供任何支持，而且底层操作系统可能会禁止这样做。在这种情况下，最好的解决办法是重启\
  \ Python 解释器。\n\n### 8.6 模块编译\n\n当模块被首次导入时，它们会被编译成字节码。这些代码被写入 `__cache__` 目录下的 `.pyc`\
  \ 文件。该目录通常位于 `.py` 文件所在的目录下。当程序下次运行时再次进行相同的导入，将加载编译后的字节码。这显著加快了导入过程。\n\n字节码缓存是一个自动过程，你几乎不需要担心。如果原始源代码发生变化，字节码会自动重新生成。它非常好用。\n\
  \n尽管如此，仍然有理由了解这个缓存和编译过程。首先，有时 Python 文件被意外安装到一个用户没有操作系统权限创建 `__cache__` 目录的环境中。Python\
  \ 仍然可以工作，但每次导入都会加载原始源码并编译为字节码。程序加载会比比应的慢得多。同样，在部署或打包 Python 应用时，包含编译后的字节码可能是有利的，因为可以显著加速程序启动。\n\
  \n了解缓存的另一个理由是某些编程技术会干扰它。涉及动态代码生成和 `exec()` 函数的高级元编程技术会破坏字节码缓存的优势。一个著名的例子是使用 `dataclasses`：\n\
  \n点击此处查看代码图片\n\n```python\nfrom dataclasses import dataclass\n\n@dataclass\nclass\
  \ Point:\n    x: float\n    y: float\n```\n\n`dataclasses` 的工作原理是以文本片段生成方法函数，并使用\
  \ `exec()` 执行它们。这些生成的代码都没有被导入系统缓存。对于单个类定义，你不会察觉。但如果你有一个由 100 个 `dataclass` 组成的模块，你可能会发现它的导入速度比一个手动编写这些类的类似模块慢近\
  \ 20 倍。\n\n### 8.7 模块搜索路径\n\n\n\n\n\n在导入模块时，解释器会在 `sys.path` 目录列表中进行搜索。`sys.path`\
  \ 中的第一个条目通常是一个空字符串 `''`，它指向当前工作目录。或者，如果你运行一个脚本，`sys.path` 中的第一个条目就是脚本所在的目录。`sys.path`\
  \ 中的其他条目通常由目录名和 `.zip` 存档文件混合组成。`sys.path` 中条目的列表顺序决定了导入模块时使用的搜索顺序。要向搜索路径中添加新条目，请将它们添加到此列表中。这可以通过直接完成，也可以通过设置\
  \ `PYTHONPATH` 环境变量来实现。例如，在 UNIX 系统上：\n\n点击此处查看代码图像\n\n```bash\nbash $ env PYTHONPATH=/some/path\
  \ python3 script.py\n```\n\nZIP 存档文件是将一组模块打包成单个文件的方便方法。例如，假设你创建了两个模块 `foo.py` 和\
  \ `bar.py`，并将它们放在一个文件 `mymodules.zip` 中。可以按照如下方式将该文件添加到 Python 搜索路径：\n\n点击此处查看代码图像\n\
  \n```python\nimport sys\n\nsys.path.append('mymodules.zip')\n\nimport foo, bar\n\
  ```\n\n`.zip` 文件目录结构中的特定位置也可以用于路径。此外，`.zip` 文件可以与普通的路径组件混合使用。这里有一个例子：\n\n点击此处查看代码图像\n\
  \n```python\nsys.path.append('/tmp/modules.zip/lib/python')\n```\n\nZIP 文件并不一定需要有\
  \ `.zip` 文件后缀名才能使用。从历史上来看，在路径上遇到 `.egg` 文件也是常见的。`.egg` 文件源于一个名为 `setuptools` 的早期\
  \ Python 包管理工具。然而，一个 `.egg` 文件无非是一个普通的 `.zip` 文件或目录，在其基础上添加了一些额外的元数据（版本号、依赖项等）。\n\
  \n### 8.8 作为主程序执行\n\n虽然本节是关于 `import` 语句的，但 Python 文件通常作为主脚本执行。例如：\n\n```bash\n\
  % python3 module.py\n```\n\n每个模块包含一个变量 `__name__`，它存储了模块名。代码可以检查此变量来确定它们正在执行的模块。解释器的顶层模块命名为\
  \ `__main__`。在命令行上指定或交互式输入的程序都会在 `__main__` 模块内部运行。有时，程序可能会改变其行为，取决于它是被作为模块导入的还是在\
  \ `__main__` 中运行。例如，一个模块可能包含某些代码，当模块被用作主程序时会执行，但如果模块仅被另一个模块导入，则不会执行。\n\n点击此处查看代码图像\n\
  \n```python\n# 检查是否作为程序运行\n\nif __name__ == '__main__':\n\n     # 是。作为主脚本运行\n\n\
  \     statements\n\nelse:\n     #否，我一定是被作为模块导入的\n     statements\n```\n\n用于库的源文件可以使用这种技术来包含可选的测试或示例代码。在开发模块时，你可以如所示，将用于测试库功能的调试代码放在\
  \ `if` 语句中，并将你的模块作为主程序运行 Python。对于导入你库的用户来说，那些代码不会运行。\n\n如果你创建了一个包含 Python 代码的目录，只要它包含一个特殊的\
  \ `__main__.py` 文件，你就可以执行该目录。例如，如果你创建了如下目录：\n\n```\nmyapp/\n    foo.py\n    bar.py\n\
  \    __main__.py\n```\n\n你可以通过输入 `python3 myapp` 来对它运行 Python。执行将从 `__main__.py`\
  \ 文件开始。如果你将 `myapp` 目录转换为 ZIP 存档，这种方法同样有效。输入 `python3 myapp.zip` 将查找顶层的 `__main__.py`\
  \ 文件，如果找到，则执行它。\n\n### 8.9 包 (Packages)\n\n对于除了最简单程序以外的所有程序，Python 代码都被组织成 `packages`（包）。包是在一个公共顶层名称下分组的模块集合。这种分组有助于解决不同应用程序中使用的模块名之间的冲突，并将你的代码与其他人的代码隔离开。包是通过创建一个具有独特名称的目录并在该目录中放置一个初始为空的\
  \ `__init__.py` 文件来定义的。然后，你根据需要在该目录中放置额外的 Python 文件和子包。例如，一个包的组织方式如下：\n\n点击此处查看代码图像\n\
  \n```\ngraphics/\n      __init__.py\n      primitive/\n         __init__.py\n  \
  \       lines.py\n         fill.py\n         text.py\n         ...\n      graph2d/\n\
  \         __init__.py\n         plot2d.py\n         ...\n      graph3d/\n      \
  \   __init__.py\n         plot3d.py\n         ...\n      formats/\n         __init__.py\n\
  \         gif.py\n         png.py\n         tiff.py\n         jpeg.py\n```\n\n`import`\
  \ 语句从包中加载模块的方法与用于简单模块相同，只是你现在有了更长的名称。例如：\n\n点击此处查看代码图像\n\n```python\n# 完整路径\nimport\
  \ graphics.primitive.fill\n\n#加载子模块\nfrom graphics.primitive import fill\n\n# 从子模块加载特定函数\n\
  from graphics.primitive import floodfill\n```\n\n当导入包的任何部分时，`__init__.py` 文件都会执行（如果存在）。因此，语句\
  \ `import graphics.primitive.fill` 会执行 `graphics/` 目录下的 `__init__.py` 文件，然后是 `primitive/`\
  \ 目录下的 `__init__.py` 文件。\n\n敏锐的 Python 用户可能会发现，如果没有 `__init__.py` 文件，包似乎仍然有效。这是正确的——你可以将包含\
  \ Python 代码的目录作为包。然而，并不，缺少 `__init__.py` 的目录实际上定义了一种不同的包，被称为“命名空间包”（namespace package）。这是大型库和框架有时实现插件系统的高级功能。在作者看来，这很少是你需要的——在创建包时，你应该始终创建\
  \ `__init__.py` 文件。\n\n### 8.10 包内部导入\n\n`import` 语句的一个关键特性是所有模块导入都需要绝对路径或完全限定的包路径。这包括包内部使用的\
  \ `import` 语句。例如，假设 `graphics.primitive.fill` 模块想要导入 `graphics.primitive.lines`\
  \ 模块。简单的语句如 `import lines` 将无法工作——你会得到 `ImportError` 异常。相反，你需要像这样进行完全限定的导入：\n\n\
  点击此处查看代码图像\n\n```python\n# graphics/primitives/fill.py\n\n# 完全限定子模块导入\nfrom graphics.primitives\
  \ import lines\n```\n\n遗憾的是，那样写出完整的包名既烦人又脆弱。例如，有时重命名包是有意义的——也许你想重命名它以便使用不同的版本。如果包名被硬编码在代码中，你就无法这样做。更好的选择是使用如下的包相对导入：\n\
  \n点击此处查看代码图像\n\n```python\n# graphics/primitives/fill.py\n\n# 包相对导入\nfrom . import\
  \ lines\n```\n\n在这里，语句 `from . import lines` 中使用的 `.` 指向导入模块相同的目录。因此，该语句会查找与 `fill.py`\
  \ 文件相同目录下的 `lines` 模块。\n\n\n\n\n相对导入也可以指定位于同一包不同目录下的子模块。例如，如果模块 `graphics.graph2d.plot2d`\
  \ 想要导入 `graphics.primitive.lines`，它可以使用类似下面的语句：\n\n点击此处查看代码图像\n\n```python\n# graphics/graph2d/plot2d.py\n\
  \nfrom ..primitive import lines\n```\n\n在这里，`..` 向上移动一个目录级，而 `primitive` 则向下进入另一个子包目录。\n\
  \n相对导入只能通过 `import` 语句的 `from module import symbol` 形式指定。因此，诸如 `import ..primitive.lines`\
  \ 或 `import .lines` 之类的语句会导致语法错误。此外，`symbol` 必须是一个简单的标识符，因此像 `from .. import primitive.lines`\
  \ 这样的语句也是非法的。最后，相对导入只能在包内部使用；使用相对导入来引用仅位于文件系统中不同目录的模块是不允许的。\n\n### 8.11 将包模块作为脚本运行\n\
  \n组织在包中的代码其运行时环境与简单脚本不同。它有一个外层包名、子模块以及对相对导入的使用（相对导入仅在包内部有效）。一个不再有效的功能是无法直接在包源文件上运行\
  \ Python。例如，假设你正在处理 `graphics/graph2d/plot2d.py` 文件 并在底部添加了一些测试代码：\n\n点击此处查看代码图像\n\
  \n```python\n# graphics/graph2d/plot2d.py\n\nfrom ..primitive import lines, text\n\
  \nclass Plot2D:\n\n    ...\n\nif __name__ == '__main__':\n\n    print('Testing Plot2D')\n\
  \n    p = Plot2D()\n\n    ...\n```\n\n如果你尝试直接运行它，会得到一个关于相对导入语句的崩溃：\n\n点击此处查看代码图像\n\
  \n```bash\nbash $ python3 graphics/graph2d/plot2d.py\n\nTraceback (most recent call\
  \ last):\n  File \"graphics/graph2d/plot2d.py\", line 1, <module>\n\n    from ..primitive\
  \ import line, text\n\nValueError: attempted relative import beyond top-level package\n\
  \nbash $\n```\n\n你也不能进入包目录并在那里运行：\n\n点击此处查看代码图像\n\n```bash\nbash $ cd graphics/graph2d/\n\
  \nbash $ python3 plot2d.py\n\nTraceback (most recent call last):\n  File \"plot2d.py\"\
  , line 1, in <module>\n\n    from ..primitive import line, text\n\nValueError: attempted\
  \ relative import beyond top-level package\n\nbash $\n```\n\n要将子模块作为主脚本运行，你需要对解释器使用\
  \ `-m` 选项。例如：\n\n点击此处查看代码图像\n\n```bash\nbash $ python3 -m graphics.graph2d.plot2d\n\
  \nTesting Plot2D\n\nbash $\n```\n\n`-m` 指定一个模块或包作为主程序。Python 将以适当的环境运行该模块，以确保导入正常工作。Python\
  \ 的许多内置包具有可以通过 `-m` 使用的“秘密”功能。其中最为人知的之一是使用 `python3 -m http.server` 从当前目录运行 Web\
  \ 服务器。\n\n你可以通过自己的包提供类似的功能。如果传递给 `python -m name` 的名称对应于包目录，Python 会查找该目录中是否存在 `__main__.py`\
  \ 文件，并运行其作为脚本。\n\n### 8.12 控制包命名空间\n\n包的主要目的是作为代码的顶层容器。有时用户只会导入顶层名称而不包含其他任何内容。例如：\n\
  \n```python\nimport graphics\n```\n\n此导入没有指定任何特定的子模块。它也没有让包的任何其他部分可访问。例如，你会发现这样的代码会失败：\n\
  \n点击此处查看代码图像\n\n```python\nimport graphics\n\ngraphics.primitive.fill.floodfill(img,x,y,color)\
  \  # 失败！\n```\n\n当仅给出顶层包导入时，唯一导入的文件是相关的 `__init__.py` 文件。在这个例中，就是 `graphics/__init__.py`\
  \ 文件。\n\n`__init__.py` 文件的主要目的是构建和/或管理顶层包命名空间的内容。这通常涉及从低级子模块中导入选定的函数、类和其他对象。例如，如果此例中的\
  \ `graphics` 包包含数百个低级函数，但其中大多数细节都封装在少数几个高级类中，那么 `__init__.py` 文件可能会选择只暴露这些类：\n\n\
  点击此处查看代码图像\n\n```python\n# graphics/__init__.py\n\nfrom .graph2d.plot2d import Plot2D\n\
  \nfrom .graph3d.plot3d import Plot3D\n```\n\n有了这个 `__init__.py` 文件，用户可以直接从 `graphics`\
  \ 使用 `Plot2D` 和 `Plot3D`：\n\n```python\nimport graphics\ngraphics.Plot2D()\ngraphics.Plot3D()\n\
  ```\n\n### 8.13 控制包的导出\n\n其中一个问题涉及 `__init__.py` 和子模块之间的交互。为了更好地管理这种复杂性，包子模块通常通过定义\
  \ `__all__` 变量来声明它们的导出。例如：\n\n点击此处查看代码图像\n\n```python\n# graphics/graph2d/plot2d.py\n\
  \n__all__ = ['Plot2D']\n\nclass Plot2D:\n\n    ...\n```\n\n相关的 `__init__.py` 文件随后使用类似下方的\
  \ `*` 导入导入其子模块：\n\n点击此处查看代码图像\n\n```python\n# graphics/graph2d/__init__.py\n\n#\
  \ 只加载 __all__ 中列出的名称\n\nfrom .plot2d import *\n\n# 将 __all__ 传播到下一层（如果需要）\n\n__all__\
  \ = plot2d.__all__\n```\n\n这种提升过程一直持续到顶层包 `__init__.py`。例如：\n\n点击此处查看代码图像\n\n```python\n\
  # graphics/__init__.py\n\nfrom .graph2d import *\n\nfrom .graph3d import *\n\n#\
  \ 合并导出\n\n__all__ = [\n    *graph2d.__all__,\n    *graph3d.__all__\n]\n```\n\n要点在于包的每个组件都使用\
  \ `__all__` 变量显式说明其导出。在实践中，这可能会变得复杂，但这种方法避免了在 `__init__.py` 文件中硬编码特定导出名称的问题。相反，如果子模块想要导出某些，只需要在一个地方列出——`__all__`\
  \ 变量。然后，它会自动向上传播到其在命名空间中的正确位置。\n\n值得注意的是，尽管在用户代码中使用 `*` 导入是不被推荐的，但在包的 `__init__.py`\
  \ 文件中是一种广泛使用的做法。它在包中有效的原因是它通常更受控且局限——由 `__all__` 变量的内容驱动，而不是一种“让我们导入一切”的随意态度。\n\n\
  ### 8.14 包数据\n\n\n\n\n有时候，包包含需要加载的数据文件（与源代码不同）。在包内部，`__file__` 变量会提供有关特定源文件的位置信息。然而，包是复杂的。它们可能被封装在\
  \ ZIP 归档文件中，或者从异常的环境加载。`__file__` 变量本身可能不可靠，甚至未定义。因此，加载数据文件通常不是简单的将文件名传递给内置的 `open()`\
  \ 函数并读取数据。\n\n要读取包数据，请使用 `pkgutil.get_data(package, resource)`。例如，如果你的包结构如下：\n\n\
  点击此处查看代码图片\n\n```\nmycode/\n\n    resources/\n\n        data.json\n\n    __init__.py\n\
  \n    spam.py\n\n    yow.py\n```\n\n要从 `spam.py` 加载 `data.json` 文件，请执行操作：\n\n点击此处查看代码图片\n\
  \n```python\n# mycode/spam.py\n\nimport pkgutil\nimport json\n\ndef func():\n  \
  \  rawdata = pkgutil.get_data(__package__,\n                               'resources/data.json')\n\
  \    textdata = rawdata.decode('utf-8')\n    data = json.loads(textdata)\n    print(data)\n\
  ```\n\n`get_data()` 函数尝试找到指定的资源，并将其内容作为原始字节字符串返回。示例中显示的 `__package__` 变量是一个包含父包名称的字符串。任何进一步的解码（例如将字节转换为文本）和解释都由你决定。在示例中，数据被解码并从\
  \ JSON 解析为 Python 字典。\n\n包不是存储巨大数据文件的好地方。请将包资源留给配置数据以及使你的包运行所需的各种杂项。\n\n### 8.15\
  \ 模块对象\n\n模块是一等类对象。表 8.1 列出了模块中常见的属性。\n\n| 属性 | 描述 |\n| --- | --- |\n| `__name__`\
  \ | 完整的模块名 |\n| `__doc__` | 文档字符串 |\n| `__dict__` | 模块字典 |\n| `__file__` | 定义所在的文件\
  \ |\n| `__package__` | 父包的名称（如果有） |\n| `__path__` | 用于搜索包的子模块的子目录列表 |\n| `__annotations__`\
  \ | 模块级类型提示 |\n\n表 8.1 模块属性\n\n`__dict__` 属性是一个表示模块命名空间的字典。在模块中定义的所有内容都存放在这里。\n\n\
  `__name__` 属性通常用于脚本。通常会进行如 `if __name__ == '__main__` 这样的检查，以查看该文件是否作为独立程序在运行。\n\
  \n`__package__` 属性包含父包的名称（如果有）。如果设置了，`__path__` 属性是一个目录列表，将搜索这些目录以定位包的子模块。通常，它包含一个条目，即包所在的目录。有时，大型框架会操作\
  \ `__path__` 以包含额外的目录，用于支持插件和其他高级功能。\n\n并不是所有属性在所有模块上都可用。例如，内置模块可能没有设置 `__file__`\
  \ 属性。同样，包相关的属性不会在顶级模块（不包含在包中的模块）中设置。\n\n`__doc__` 属性是模块的 docstring（如果有）。这是一个出现在文件中第一个语句的字符串。`__annotations__`\
  \ 属性是一个模块级类型提示的字典。它们看起来像这样：\n\n点击此处查看代码图片\n\n```python\n# mymodule.py\n\n'''\nThe\
  \ doc string\n'''\n\n# 类型提示（放入 __annotations__ 中）\nx: int\ny: float\n...\n```\n\n\
  与其他类型提示一样，模块级提示不会改变 Python 行为的任何部分，也不会实际定义变量。它们纯粹是元数据，其他工具可以根据需要选择查看。\n\n### 8.16\
  \ 部署 Python 包\n\n模块和包的终极边界是将你的代码交给他人的问题。这是一个大的话题，多年来一直是活跃开发的焦点。我不会尝试记录一个在你读到此内容时注定过时的过程。相反，请关注位于\
  \ [`https://packaging.python.org/tutorials/packaging-projects`](https://packaging.python.org/tutorials/packaging-projects)\
  \ 上的文档。\n\n对于日常开发而言，最重要的事情是将你的代码作为一个自包含的项目保持隔离。你所有的代码都应该存在于适当包中。尝试给你的包起一个唯一的名称，以免与其他可能的依赖项冲突。参考\
  \ Python 包索引 [`https://pypi.org`](https://pypi.org) 来选择名称。在结构化你的代码时，尽量保持保持简单。正如你所看到的，使用模块和包系统可以完成许多复杂的操作。这些操作有其特定的时机和场合，但不应该是你的起点。\n\
  \n考虑到绝对的简单，分发纯 Python 代码的最极简方法是使用 `setuptools` 模块或内置的 `distutils` 模块。假设你已经写了一些代码，并位于如下结构的项目：\n\
  \n点击此处查看代码图片\n\n```\nmycode/\n\n    resources/\n\n        data.json\n\n    __init__.py\n\
  \n    spam.py\n\n    yow.py\n```\n\n要创建分发，在顶级目录（此例中为 `mycode/`）创建一个 `setup.py` 文件。在此文件中，放入以下代码：\n\
  \n点击此处查看代码图片\n\n```python\n# setup.py\n\nfrom setuptools import setup\n\nsetup(name=\"\
  spam\",\n      version=\"0.0\",\n      packages=['spam'],\n      scripts=['spam.py'])\n\
  ```\n\n在 `setup()` 调用中，`packages` 是所有包目录列表，`scripts` 是脚本文件列表。如果你的软件没有这些，可以省略这些参数。`name`\
  \ 是包的名称，`version` 是字符串格式的版本号。`setup()` 支持许多其他提供包元数据的参数。完整列表参见 [`https://docs.python.org/3/distutils/apiref.html`](https://docs.python.org/3/distutils/apiref.html)。\n\
  \n创建 `setup.py` 文件就足以创建软件的源码分发。输入以下 shell 命令制作源码分发：\n\n点击此处查看代码图片\n\n```bash\nbash\
  \ $ python setup.py sdist\n\n...\n\nbash $\n```\n\n这会在 `dist/` 中创建一个归档文件，例如 `spam-1.0.tar.gz`\
  \ 或 `spam-1.0.zip`。这就是你给他人安装软件的文件。要进行安装，用户可以使用如 `pip` 的命令。例如：\n\n点击此处查看代码图片\n\n\
  ```bash\nshell $ python3 -m pip install spam-1.0.tar.gz\n```\n\n这将软件安装到本地 Python\
  \ 分发中，并供通用使用。代码通常会被安装在名为 `site-packages` 的目录中。要找到该目录的精确位置，检查 `sys.path` 的值。脚本通常安装与\
  \ Python 解释器相同的目录中。\n\n如果脚本的第一行以 `#!` 开头并包含 `python`，安装程序将重写该行以指向本地 Python 安装。因此，如果你的脚本硬编码了特定的\
  \ Python 路径（如 `/usr/local/bin/python`），在安装到 Python 路径不同的系统上时，它们仍然可以正常工作。\n\n\n\n\
  必须强调的是，这里描述的 `setuptools` 使用方法是极简的。较大的项目可能涉及 C/C++ 扩展、复杂的包结构、示例等。涵盖所有工具以及部署此类代码的所有可能方法超出了本书的范围。你应该咨询\
  \ `https://python.org` 和 `https://pypi.org` 上的各种资源，以获取最新的建议。\n\n### 8.17 倒数第二个词：从包开始\n\
  \n在初次编写一个新程序时，很容易从一个简单的单 Python 文件开始。例如，你可能会编写一个名为 `program.py` 的脚本并从它开始。虽然这对于丢弃性程序和短任务运行运行良好，但你的“脚本”可能会开始增长并添加功能。最终，你可能想将其拆分为多个文件。就在那时，问题往往会产生。\n\
  \n鉴于此，从一开始就养成将所有程序作为一个包习惯是有意义的。例如，与其创建一个名为 `program.py` 的文件，你应该创建一个名为 `program`\
  \ 的程序包目录：\n\n```\nprogram/\n\n    __init__.py\n\n    __main__.py\n```\n\n将你的启动代码放在\
  \ `__main__.py` 中，并使用类似 `python -m program` 的命令运行你的程序。当你需要更多代码时，向包中添加新文件并使用包相对导入。使用包的优点是你所有的代码都保持隔离。你可以随心所欲地命名文件，而不担心与其他包、标准库模块或同事编写的代码发生冲突。虽然设置包在开始时需要多花一点，但它可能会在以后为你节省大量的麻烦。\n\
  \n### 8.18 终极格言：保持简单\n\n与模块和包系统相关的高级魔术比这里展示的要多得多。请参考 `https://dabeaz.com/modulepackage/index.html`\
  \ 上的教程“Modules and Packages: Live and Let Die!”以了解可能的范围。\n\n然而，考虑到所有因素，你可能不进行任何高级模块黑客操作更好。管理模块、包和软件分发一直是\
  \ Python 社区的痛苦之源。很多痛苦是人们对模块系统应用黑客手段的直接后果。不要这样做。保持简单，当你的同事提议修改 `import` 以适配区块链时，找到那口说“不”的力量。\n\
  \n# 9 输入与输出\n\n输入和输出（I/O）是所有程序的一部分。本章描述了 Python I/O 的基本要素，包括数据编码、命令行选项、环境变量、文件 I/O\
  \ 和数据序列化。特别关注了鼓励适当 I/O 处理的编程技术和抽象。本章最后提供了与 I/O 相关的常用标准库模块概述。\n\n### 9.1 数据表示\n\n\
  I/O 的主要问题是外部世界。为了与之通信，数据必须被正确表示，以便对其进行操作。在最底层，Python 处理两种基本数据类型：代表任何类型的原始未解释数据的\
  \ `bytes`，以及代表 Unicode 字符的 `text`。\n\n为了表示字节，使用了两个内置类型：`bytes` 和 `bytearray`。`bytes`\
  \ 是一个由整数字节值的不可变字符串。`bytearray` 是一个可变的字节数组，行为类似于字节字符串和列表的结合。它的可变性使其适合以更增量的方式构建字节组，例如从碎片中组装数据。以下示例说明了\
  \ `bytes` 和 `bytearray` 的一些特性：\n\n```\n# 指定一个字节字面量（注意 b' 前缀）\n\na = b'hello'\n\n\
  # 从整数列表指定字节\n\nb = bytes([0x68, 0x65, 0x6c, 0x6c, 0x6f])\n\n# 从部分创建并填充 bytearray\n\
  \nc = bytearray()\n\nc.extend(b'world')   # d = 'world'\n\nc.append(0x21)      \
  \ # d = 'world!'\n\n# 访问字节值\n\nprint(a[0])     # --> 输出 104\n\nfor x in b:     #\
  \ 输出 104 101 108 108 111\n\n   print(x)\n```\n\n访问 `byte` 和 `bytearray` 对象的单个元素产生整数字节值，而不是单字符字节字符串。这与文本字符串不同，因此是一个常见的用法错误。\n\
  \n文本由 `str` 数据类型表示，并存储为 Unicode 代码点的数组。例如：\n\n```\nd = 'hello'     # 文本 (Unicode)\n\
  \nlen(d)          # --> 5\n\nprint(d[0])     # 打印 'h'\n```\n\nPython 在字节和文本之间保持着严格分离。两种类型之间永远不会进行自动转换，这些类型之间的比较结果为\
  \ `False`，并且任何混合字节和文本的操作都会导致错误。例如：\n\n```\na = b'hello'     # 字节\n\nb = 'hello'\
  \      # 文本\n\nprint(a == b)    # False\n```\n\n### 9.2 文本编码与解码\n\n执行 I/O 时，确保你正在处理正确类型的数据。如果你处理的是文本，输入必须解码，输出必须编码。例如：\n\
  \n```\na = 'hello'             # 文本\n\nb = a.encode('utf-8')   # 编码为字节\n\nc = b'world'\
  \            # 字节\n\nd = c.decode('utf-8')   # 解码为文本\n```\n\n`encode()` 和 `decode()`\
  \ 都需要编码名称，例如 `'utf-8'` 或 `'latin-1'`。表 9.1 中的编码是常见的。\n\n| 编码名称 | 描述 |\n| --- | ---\
  \ |\n| `'ascii'` | 范围在 [0x00, 0x7f] 的字符值 |\n| `'latin1'` | 范围在 [0x00, 0xff] 的字符值。也称为\
  \ `'iso-8859-1'` |\n| `'utf-8'` | 允许表示 Unicode 字符的变长度编码 |\n| `'cp1252'` | Windows\
  \ 上常用的文本编码 |\n| `'macroman'` | Macintosh 上常用的文本编码 |\n\n此外，编码方法接受一个可选的 `errors` 参数，用于指定在出现编码错误时的行为。它是表\
  \ 9.2 中的值之一。\n\n| 值 | 描述 |\n| --- | --- |\n| `'strict'` | 对编码和解码错误抛出 `UnicodeError`\
  \ 异常（默认） |\n| `'ignore'` | 忽略无效字符 |\n| `'replace'` | 将无效字符替换为替换字符（Unicode 中的 U+FFFD，字节中的\
  \ b'?'） |\n| `'backslashreplace'` | 将每个无效字符替换为 Python 字符转义序列。例如，字符 U+1234 被替换为 '\\\
  u1234'（仅限编码） |\n| `'xmlcharrefreplace'` | 将每个无效字符替换为 XML 字符引用。例如，字符 U+1234 被替换为\
  \ '&#4660;'（仅限编码） |\n| `'surrogateescape'` | 解码时将任何无效字节 '\\xhh' 替换为 U+DChh，编码时将\
  \ U+DChh 替换为字节 '\\xhh' |\n\n`'backslashreplace'` 和 `'xmlcharrefreplace'` 错误策略将不可表示的字符表示为允许将其视为简单\
  \ ASCII 文本或 XML 字符引用的形式。这对于调试非常有用。\n\n\n\n\n\n'surrogateescape' 错误处理策略允许退化的字节数据——即不符合预期编码规则的数据——无论使用何种文本编码，在解码/编码的循环中都能完整保留。具体来说，`s.decode(enc,\
  \ 'surrogateescape').encode(enc, 'surrogateescape') == s`。这种对数据的循环保留对于某些系统接口非常有用，在这些接口中预期文本编码，但由于\
  \ Python 控制之外的问题，无法保证编码。Python 不会使用坏的编码来破坏数据，而是使用代理编码（surrogate encoding）将其“原样”嵌入。以下是一个使用编码不当的\
  \ UTF-8 字符串的此行为示例：\n\n点击此处查看代码图像\n\n```\n>>> a = b'Spicy Jalape\\xf1o'   # Invalid\
  \ UTF-8\n\n>>> a.decode('utf-8')\n\nTraceback (most recent call last):\n\n  File\
  \ \"<stdin>\", line 1, in <module>\n\nUnicodeDecodeError: 'utf-8' codec can't decode\
  \ byte 0xf1\n\nin position 12: invalid continuation byte\n\n>>> a.decode('utf-8',\
  \ 'surrogateescape')\n\n'Spicy Jalape\\udcf1o'\n\n>>> # 将生成的字符串编码回字节\n\n>>> _.encode('utf-8',\
  \ 'surrogateescape')\n\nb'Spicy Jalape\\xf1o'\n\n>>>\n```\n\n## 9.3 文本和字节格式化\n\n\
  在处理文本和字节字符串时，一个常见问题是字符串的转换和格式化——例如，将浮点数转换为具有给定宽度和精度的字符串。要格式化单个值，请使用 `format()` 函数：\n\
  \n点击此处查看代码图像\n\n```\nx = 123.456\n\nformat(x, '0.2f')       # '123.46'\n\nformat(x,\
  \ '10.4f')      # '  123.4560'\n\nformat(x, '<*10.2f')    # '123.46****'\n```\n\n\
  `format()` 的第二个参数是格式指定符。该指定符的通用格式为 `[[fill[align]][sign][0][width][,][.precision][type]`，其中每个\
  \ `[]` 内的部分都是可选的。`width` 指定要使用的最小字段宽度，对齐指定符是 `<`、`>` 或 `^` 之一，用于字段内的左对齐、右对齐和居中。可选填充字符\
  \ `fill` 用于填充空间。例如：\n\n点击此处查看代码图像\n\n```\nname = 'Elwood'\n\nr = format(name, '<10')\
  \     # r = 'Elwood    '\n\nr = format(name, '>10')     # r = '    Elwood'\n\nr\
  \ = format(name, '¹⁰')     # r = '  Elwood  '\n\nr = format(name, '*¹⁰')    # r\
  \ = '**Elwood**'\n```\n\n`type` 指定符指示数据的类型。表 9.3 列出了支持的格式代码。如果不提供，默认格式代码对于字符串为 `s`，对于整数为\
  \ `d`，对于浮点数为 `f`。\n\n| 字符 | 输出格式 |\n| --- | --- |\n| `d` | 十进制整数或长整数。 |\n| `b` |\
  \ 二进制整数或长整数。 |\n| `o` | 八进制整数或长整数。 |\n| `x` | 十进制整数或长整数。 |\n| `X` | 十进制整数（大写字母）。\
  \ |\n| `f`, `F` | 格式为 [-]m.dddddd 的浮点数。 |\n| `e` | 格式为 [-]m.dddddde±xx 的浮点数。 |\n\
  | `E` | 格式为 [-]m.ddddddE±xx 的浮点数。 |\n| `g`, `G` | 指数小于 [nd]4 或大于精度时使用 `e` 或 `E`；否则使用\
  \ `f`。 |\n| `n` | 与 `g` 相同，但当前的区域设置决定小数点字符。 |\n| `%` | 将数字乘以 100 并使用 `f` 格式显示，后跟一个\
  \ % 符号。 |\n| `s` | 字符串或任何对象。格式代码使用 `str()` 生成字符串。 |\n| `c` | 单字符。 |\n\n表 9.3 格式代码\n\
  \n格式指定符的符号部分是 `+`、`-` 或空格之一。`+` 表示所有数字都应使用前导符号。`-` 是默认值，且仅为负数添加符号字符。空格在正数前添加前导空格。\n\
  \n可选的逗号（（`,`）可以出现在宽度和精度之间。这会添加一个千位分隔符。例如：\n\n点击此处查看代码图像\n\n```\nx = 123456.78\n\n\
  format(x, '16,.2f')   # '      123,456.78'\n```\n\n指定符的 `precision` 部分提供用于小数的精度位数。如果为数字的字段\
  \ `width` 添加了前导 `0`，则数值将用前导 0 填充。以下是格式化不同数字的示例：\n\n点击此处查看代码图像\n\n```\nx = 42\n\n\
  r = format(x, '10d')        # r = '        42'\n\nr = format(x, '10x')        #\
  \ r = '        2a'\n\nr = format(x, '10b')        # r = '    1010'\n\nr = format(x,\
  \ '010b')       # r = '000010'\n\ny = 3.1415926\n\nr = format(y, '10.2f')      #\
  \ r = '      14'\n\nr = format(y, '10.2e')      # r = '  14'\n\nr = format(y, '+10.2f')\
  \     # r = '     14'\n\nr = format(y, '+10%')     # r = '\n```\n\n对于更复杂的字符串，可以使用\
  \ f-string：\n\n```\nx = 123.456\n```\n\n点击此处查看代码图像\n\n```\nf'Value is {x:0.2f}'\
  \        # 'Value is 123.46'\n\nf'Value is {x:10.4f}'       # 'Value is   123.4560'\n\
  \nf'Value is {x:<10.2f}'   # wait```\n\n在 f-string 中，形式为 `{expr:spec}` 的文本被 `format(expr,\
  \ spec)` 的值替换。只要 `expr` 不包含 `{` 或 `}`，它可以是任意表达式。格式指定符本身由其他表达式提供。例如：\n\n点击此处查看代码图像\n\
  \n```\ny = 3.1415926\n\nwidth = 8\n\nprecision=3\n\nr = f'{y:{width}.{precision}f}'\
  \   # r = '3.142'\n```\n\n如果用 `=` 结束 `expr`，`expr` 的字面文本也会包含在结果中。例如：\n\n点击此处查看代码图像\n\
  \n```\nx = 123.456\n\nf'{x=:0.2f}'        # 'x=123.46'\n\nf'{2*x=:0.2f}'      #\
  \ '2x=246.91'\n```\n\n如果在值后附加 `!r`，则格式化应用于 `repr()` 的输出。如果你使用 `!s`，则格式化应用于 `str()`\
  \ 的输出。例如：\n\n点击此处查看代码图像\n\n```\nf'{x!r:spec}'      # Calls (repr(x).__format__('spec'))\n\
  \nf'{x!s:spec}'      # Calls (str(x).__format__('spec'))\n```\n\n作为 f-string 的替代方案，可以使用字符串的\
  \ `.format()` 方法：\n\n点击此处查看代码图像\n\n```\nx = 123.456\n\n'Value is {:0.2f}' .format(x)\
  \            # 'Value is 123.46'\n\n'Value is {0:10.2f}' .format(x)          # 'Value\
  \ is   123.4560'\n\n'Value is {val:<*10.2f}' .format(val=x)  # 'Value is 123.46****'\n\
  ```\n\n对于由 `.format()` 格式化的字符串，形式为 `{arg:spec}` 的文本被 `format(arg, spec)` 的值替换。在这种情况下，`arg`\
  \ 指向给 `format()` 方法参数之一。如果完全省略，则按顺序取参数。例如：\n\n点击此处查看代码图像\n\n```\nname = 'IBM'\n\n\
  shares = 50\n\nprice = 490.1\n\nr = '{:>10s} {:10d} {:10.2f}'.format(name, shares,\
  \ price)\n\n# r = '       IBM         50     490.10'\n```\n\n`arg` 也可以指向特定的参数编号或名称。例如：\n\
  \n点击此处查看代码图像\n\n```\ntag = 'p'\n\ntext = 'hello world'\n\nr = '<{0}>{1}</{0}>'.format(tag,\
  \ text)  # r = '<p>hello world</p>'\n\nr = '<{tag}>{text}</{tag}>'.format(tag='p',\
  \ text='hello world')\n```\n\n与 f-string 不同，指定符的 `arg` 值不能是任意表达式，因此它的表达能力没有那么强。然而，`format()`\
  \ 方法可以执行有限的属性查找、索引和嵌套替换。例如：\n\n点击此处查看代码图像\n\n```\ny = 3.1415926\n\nwidth = 8\n\n\
  precision=3\n\nr = 'Value is {0:{1}.{2}f}'.format(y, width, precision)\n\nd = {\n\
  \n   'name': 'IBM',\n\n   'shares': 50,\n\n   'price': 490.1\n\n}\n\nr = '{0[shares]:d}\
  \ shares of {0[name]} at {0[price]:0.2f}'.format(d)\n\n```\n\n\n\n\n`bytes` 和 `bytearray`\
  \ 实例可以使用 `%` 运算符进行格式化。该运算符的语义参考了 C 语言中的 `sprintf()` 函数。以下是一些示例：\n\n点击此处查看代码图片\n\n\
  ```python\nname = b'ACME'\nx = 123.456\nb'Value is %0.2f' % x             # b'The\
  \ value is 123.46'\nbytearray(b'Value is %0.2f') % x  # b'Value is 123.46'\nb'%s\
  \ = %0.2f' % (name, x)         # b'ACME = 123.46'\n```\n\n通过这种格式化，形式为 `%spec` 的序列将顺序用作为\
  \ `%` 运算符第二个操作数的元组中的值替换。基本格式代码（`d`、`f`、`s` 等）与 `format()` 函数相同。然而，更高级的功能要么缺失或略有变化。例如，要调整对齐，你可以像这样使用\
  \ `-` 字符：\n\n点击此处查看代码图片\n\n```python\nx = 123.456\nb'%10.2f' % x     # b'    123.46'\n\
  b'%-10.2f' % x    # b'123.46    '\n```\n\n使用格式代码 `%r` 会产生 `ascii()` 的输出，这在调试和日志记录中有用。\n\
  \n在处理 `bytes` 时，请注意不支持文本字符串。它们需要显式编码。\n\n点击此处查看代码图片\n\n```python\nname = 'Dave'\n\
  b'Hello %s' % name                    # TypeError!\nb'Hello %s' % name.encode('utf-8')\
  \    # Ok\n```\n\n这种格式化形式也可以用于文本字符串，但它被认为是一种旧的编程风格。然而，它在某些库中仍然出现。例如，`logging` 模块产生的消息就是这种方式格式化的：\n\
  \n点击此处查看代码图片\n\n```python\nimport logging\nlog = logging.getLogger(__name__)\nlog.debug('%s\
  \ got %d', name, value)  # '%s got %d' % (name, value)\n```\n\n`logging` 模块将在在本章后面的\
  \ 第 9.15.12 节 进行介绍。\n\n### 9.4 读取命令行选项\n\n当 Python 启动时，命令行选项以文本字符串的形式存放在 `sys.argv`\
  \ 列表中。第一个项是程序名称。后续项是程序名称之后在命令行添加的选项。以下程序是手动处理命令行参数的一个极简原型：\n\n点击此处查看代码图片\n\n```python\n\
  def main(argv):\n    if len(argv) != 3:\n        raise SystemExit(\n           \
  \   f'Usage : python {argv[0]} inputfile outputfile\\n')\n    inputfile  = argv[1]\n\
  \    outputfile = argv[2]\n    ...\n\nif __name__ == '__main__':\n    import sys\n\
  \    main(sys.argv)\n```\n\n为了更好的代码组织、测试以及类似的原因，编写一个专门的 `main()` 函数来接收列表形式的命令行选项（如果有）是一个好主，而不是直接读取\
  \ `sys.argv`。在程序的末尾包含一小段代码，以将命令行选项传递给你的 `main()` 函数。\n\n`sys.argv[0]` 包含正在执行的脚本名称。对于想要报告错误的命令行脚本，编写一个描述性的帮助信息并抛出\
  \ `SystemExit` 是标准做法。\n\n虽然在简单的脚本中你可以手动处理命令行选项，但对于更复杂的命令行处理，请考虑使用 `argparse` 模块。这里有一个示例：\n\
  \n点击此处查看代码图片\n\n```python\nimport argparse\ndef main(argv):\n    p = argparse.ArgumentParser(description=\"\
  This is some program\") # description=\"这是一个程序程序\"\n    # 一个位置参数\n    p.add_argument(\"\
  infile\")\n    # 一个带参数的选项\n    p.add_argument(\"-o\",\"--output\", action=\"store\"\
  )\n    # 一个设置布尔标志的选项\n    p.add_argument(\"-d\",\"--debug\", action=\"store_true\"\
  , default=False)\n    # 解析命令行\n    args = p.parse_args(args=argv)\n    # 获取选项设置\n\
  \    infile    = args.infile\n    output    = args.output\n    debugmode = args.debug\n\
  \    print(infile, output, debugmode)\n\nif __name__ == '__main__':\n    import\
  \ sys\n    main(sys.argv[1:])\n```\n\n这个示例仅显示了 `argparse` 模块最简单的用法。标准库文档提供了更高级的用法。还有如\
  \ `click` 和 `docopt` 这样的第三方模块，可以简化更复杂的命令行解析器的编写。\n\n（注：原文此处存在大量重复的无效文本，已根据指令要求过滤掉重复内容）\n\
  \n### 9.5 环境变量\n\n在处理 `bytes` 时，请注意不支持文本字符串。它们需要显式编码。\n\n点击此处查看代码图片\n\n```python\n\
  name = 'Dave'\nb'Hello %s' % name                    # TypeError!\nb'Hello %s' %\
  \ name.encode('utf-8')    # Ok\n```\n\n这种格式化形式也可以用于文本字符串，但它被认为是一种旧的编程风格。然而，它在某些库中仍然出现。例如，`logging`\
  \ 模块产生的消息就是这种方式格式化的：\n\n点击此处查看代码图片\n\n```python\nimport logging\nlog = logging.getLogger(__name__)\n\
  log.debug('%s got %d', name, value)  # '%s got %d' % (name, value)\n```\n\n`logging`\
  \ 模块将在在本章后面的 第 9.15.12 节 进行介绍。\n\n### 9.6 文件和对象\n\n使用内置函数 `open()` 打开文件。通常 `open()`\
  \ 接收文件名和一个模式。它通常与 `with` 语句结合管理器使用。以下是处理文件的一些常见模式：\n\n点击此处查看代码图片\n\n```python\n\
  # 一次性读取文本文件作为字符串\nwith open('filename.txt', 'rt') as file:\n    data = file.read()\n\
  \n# 逐行读取文件\nwith open('filename.txt', 'rt') as file:\n    for line in file:\n  \
  \      ...\n\n# 写入文本文件\nwith open('out.txt', 'wt') as file:\n    file.write('Some\
  \ output\\n')\n    print('More output', file=file)\n```\n\n大多数情况下，使用 `open()` 是件简单的事。你提供想要打开的文件名和模式。例如：\n\
  \n点击此处查看代码图片\n\n```python\nopen('name.txt')        # 打开 \"name.txt\" 读取\nopen('name.txt',\
  \ 'rt')  # 打开 \"name.txt\" 读取（相同）\nopen('name.txt', 'wt')  # 打开 \"name.txt\" 写入\n\
  open('data.bin', 'rb')  # 二进制模式读取\nopen('data.bin', 'wb')  # 二进制模式写入\n```\n\n对于大多数程序，你不需要了解比这些简单示例更多的文件处理知识。然而，`open()`\
  \ 有一些特殊情况和更深奥的功能值得了解。接下来的几节将详细讨论 `open()` 和文件 I/O。\n\n### 9.6.1 文件名\n\n要打开文件，你需要给\
  \ `open()` 提供文件名。该名称可以是完全指定的绝对路径，例如 `'/Users/guido/Desktop/files/old/data.csv'`，也可以是相对路径，例如\
  \ `'data.csv'` 或 `'..\\old\\data.csv'`。对于相对文件名，文件位置相对于 `os.getcwd()` 返回的当前工作目录来确定。可以使用\
  \ `os.chdir(newdir)` 更改当前工作目录。\n\n\n\n名称本身可以用多种形式编码。如果它是一个文本字符串，该名称将根据 `sys.getfilesystemencoding()`\
  \ 返回的文本编码进行解释，然后传递给宿主机操作系统。如果文件名是字节字符串（byte string），它将不进行编码并原样传递。如果你正在编写必须处理文件名退化或编码错误可能性的程序，后一种选项可能非常有用——与其将文件名作为文本传递，你可以传递名称的原始二进制表示。这看起来像是一个冷僻的边缘情况，但\
  \ Python 常被用于编写操纵文件系统的系统级脚本。滥用文件系统是黑客使用的一种常用技术，用于隐藏其踪迹或破坏系统工具。\n\n除了文本和字节之外，任何实现了特殊方法\
  \ `__fspath__()` 的对象都可以作为名称。`__fspath__()` 方法必须返回与实际名称相对应的文本或字节对象。这就是让 `pathlib`\
  \ 等标准库模块运行的机制。例如：\n\n点击此处查看代码图像\n\n```\n>>> from pathlib import Path\n\n>>> p =\
  \ Path('Data/portfolio.csv')\n\n>>> p.__fspath__()\n\n'Data/portfolio.csv'\n\n>>>\n\
  ```\n\n理论上，你可以创建自己的自定义 `Path` 对象并使其与 `open()` 配合，只要它实现的 `__fspath__()` 方式能够解析为系统上的正确文件名即可。\n\
  \n最后，文件名可以用低级整数文件描述符（file descriptors）的形式给出。这要求“文件”已经在系统中以某种方式打开。。它可能对应于网络套接字、管道或其他暴露文件描述符的系统资源。这里有一个使用\
  \ `os` 模块直接打开文件然后将其转换为正确文件对象的示例：\n\n点击此处查看代码图像\n\n```\n>>> import os\n\n>>> fd =\
  \ os.open('/etc/passwd', os.O_RDONLY)\n\n>>> fd\n\n3\n\n>>> file = open(fd, 'rt')\n\
  >>> file\n<_io.TextIOWrapper name=3 mode='rt' encoding='UTF-8'>\n\n>>> data = file.read()\n\
  \n>>>\n```\n\n当像这样打开已存在的文件描述符时，返回文件的 `close()` 方法也将关闭底层的描述符。这可以通过向 `open()` 传递 `closefd=False`\
  \ 来禁用。例如：\n\n点击此处查看代码图像\n\n```\nfile = open(fd, 'rt', closefd=False)\n```\n\n####\
  \ 9.6.2 文件模式\n\n打开文件时，你需要指定一个文件模式。核心文件模式有 `'r'` 用于读取，`'w'` 用于写入以及 `'a'` 用于追加。`'w'`\
  \ 模式会用新内容替换任何现有文件。`'a'` 模式打开文件进行写入并将文件指针置到文件末尾，以便追加新数据。\n\n特殊文件模式 `'x'` 可用于写入文件，但前提是该文件尚不存在。这是一种防止意外覆盖现有数据的有用方法。对于此模式，如果文件已存在，将抛出\
  \ `FileExistsError` 异常。\n\nPython 在文本和二进制数据之间有严格区分。为了指定数据类型，你在文件模式后附加 `'t'` 或 `'b'`。例如，文件模式\
  \ `'rt'` 以文本模式打开文件，而 `'rb'` 以二进制模式打开文件。该模式决定了 `f.read()` 等文件相关方法返回的数据类型。在文本模式下，返回字符串；在二进制模式下，返回字节。\n\
  \n通过提供加号（`+`）字符（例如 `'rb+'` 或 `'wb+'`），可以原地更新二进制文件。以更新模式打开文件时，你可以同时执行输入和输出，只要所有输出操作在任何后续输入操作之前刷新其数据即可。如果使用\
  \ `'wb+'` 模式打开文件，其长度首先会被截断为零。更新模式的一种用途是结合 `seek` 操作提供对文件内容的随机读写访问。\n\n#### 9.6.3\
  \ I/O 缓冲\n\n默认情况下，打开文件时启用了 I/O 缓冲。通过 I/O 缓冲，I/O 操作以较大的块进行执行，以避免过多的系统调用。例如，写操作将开始填充内部内存缓冲区，只有当缓冲区满时才会实际发生输出。这种行为可以通过向\
  \ `open()` 传递 `buffering` 参数来改变。例如：\n\n点击此处查看代码图像\n\n```python\n# 以无 I/O 缓冲的二进制模式打开文件\n\
  \nwith open('data.bin', 'wb', buffering=0) as file:\n    file.write(data)\n    ...\n\
  ```\n\n值 `0` 指定无缓冲 I/O，仅对二进制模式文件有效。值 `1` 指定行缓冲，通常只对文本模式文件有意义。任何其他正值表示要使用的缓冲区大小（以字节为单位）。如果没有指定缓冲值，默认行为取决于文件类型。如果是磁盘上的普通文件，缓冲按块进行管理，缓冲区大小设置为\
  \ `io.DEFAULT_BUFFER_SIZE`。通常情况下这是 4096 字节的某个小倍数。它可能随系统而异。如果文件代表一个交互式终端，则使用行缓冲。\n\
  \n对于普通程序，I/O 缓冲通常不是主要考虑。然而然而缓冲可能会影响涉及进程间活动通信的应用。例如，有时出现的一个问题是两个通信的子进程由于内部缓冲问题导致死锁——例如，一个进程向缓冲区写入，但接收者由于缓冲区没有刷新而永远看不到那些数据。此类问题可以通过指定无缓冲\
  \ I/O 或对关联文件进行显式的 `flush()` 调用来解决。例如：\n\n点击此处查看代码图像\n\n```python\nfile.write(data)\n\
  file.write(data)\n...\nfile.flush()       # 确保所有数据从缓冲区写入\n```\n\n#### 9.6.4 文本模式编码\n\
  \n对于以文本模式打开的文件，可以使用 `encoding` 和 `errors` 参数指定可选的编码和错误处理策略。例如：\n\n点击此处查看代码图像\n\n\
  ```python\nwith open('file.txt', 'rt',\n          encoding='utf-8', errors='replace')\
  \ as file:\n    data = file.read()\n```\n\n传递给 `encoding` 和 `errors` 参数的值与字符串和字节的\
  \ `encode()` 以及 `decode()` 方法具有相同含义。\n\n默认文本编码由 `sys.getdefaultencoding()` 的值决定，可能随系统而异。如果你提前知道编码，即使它恰好与你系统的默认编码匹配，显式提供它通常更好。\n\
  \n#### 9.6.5 文本模式行处理\n\n对于文本文件，一个复杂性问题是换行符的编码。根据宿主机操作系统，换行符被编码为 `'\\n'`、`'\\r\\\
  n'` 或 `'\\r'`——例如 UNIX 上的 `'\\n'` 和 Windows 上的 `'\\r\\n'`。默认情况下，Python 在读取时将所有这些行结束转换为标准的\
  \ `'\\n'` 字符。在写入时，换行符会被转换回系统使用的默认行结束。这种行为在 Python 文档中称为“通用换行模式”（universal newline\
  \ mode）。\n\n你可以通过向 `open()` 传递 `newline` 参数来改变换行行为。例如：\n\n点击此处查看代码图像\n\n```python\n\
  # 精确要求 '\\r\\n' 并保持原样\n\nfile = open('somefile.txt', 'rt', newline='\\r\\n')\n```\n\
  \n指定 `newline=None` 将启用默认行处理行为，即将所有行结束转换为标准的 `'\\n'` 字符。给出 `newline=''` 使 Python\
  \ 识别所有行结束，但禁用转换步骤——如果行由 `'\\r\\n'` 终止，则 `'\\r\\n'` 组合将保留在输入中。指定 `'\\n'`、`'\\r'`\
  \ 或 `'\\r\\n'` 的值将使其成为预期的行结束符。\n\n### 9.7 I/O 抽象层\n\n\n\n\n\n`open()` 函数作为一种高层工厂函数，用于创建不同\
  \ I/O 类的实例。这些类体现了不同的文件模式、编码和缓冲行为。它们还以层的方式组合在一起。`io` 模块定义了以下类：\n\n点击此处查看代码图像\n\n\
  ```\nFileIO(filename, mode='r', closefd=True, opener=None)\n```\n\n打开一个文件用于原始无缓冲二进制\
  \ I/O。`filename` 是 `open()` 函数接受的任何有效文件名。其他参数的含义与 `open()` 相同。\n\n点击此处查看代码图像\n\n\
  ```\nBufferedReader(file [, buffer_size])\n\nBufferedWriter(file [, buffer_size])\n\
  \nBufferedRandom(file,[, buffer_size])\n```\n\n为文件实现缓冲的二进制 I/O 层。`file` 是 `FileIO`\
  \ 的实例。`buffer_size` 指定了要使用的内部缓冲区大小。类的选择取决于文件是否在读取、写入或更新数据。可选的 `buffer_size` 参数指定了使用的内部缓冲区大小。\n\
  \n点击此处查看代码图像\n\n```\nTextIOWrapper(buffered, [encoding, [errors [, newline [, line_buffering\
  \ [, write_through]]]]])\n```\n\n实现文本模式 I/O。`buffered` 是一个缓冲的二进制模式文件，例如 `BufferedReader`\
  \ 或 `BufferedWriter`。`encoding`、`errors` 和 `newline` 参数的含义与 `open()` 相同。`line_buffering`\
  \ 是一个布尔标志，强制遇到换行符时刷新 I/O（默认为 `False`）。`write_through` 是一个布尔标志，强制所有写入操作都刷新（默认为 `False`）。\n\
  \n下面的示例展示了如何逐层构建一个文本模式文件：\n\n点击此处查看代码图像\n\n```\n>>> raw = io.FileIO('filename.txt',\
  \ 'r')        # 原始二进制模式\n\n>>> buffer = io.BufferedReader(raw)      # 二进制缓冲读取器\n\
  \n>>> file = io.TextIOWrapper(buffer, encoding='utf-8') # 文本模式\n\n>>>\n```\n\n通常情况下，你不需要手动构建这样的层级——内置的\
  \ `open()` 函数已经处理了所有工作。但是，如果你已经有一个现有的文件对象并想以某种方式更改它的处理方式，你可以像示例所示操作这些层级。\n\n要剥离层级，请使用文件的\
  \ `detach()` 方法。例如，这里展示了如何将一个已经是文本模式的文件转换为二进制模式文件：\n\n点击此处查看代码图像\n\n```\nf = open('something.txt',\
  \ 'rt')  # 文本模式文件\n\nfb = f.detach()                  # 分离底层的二进制模式文件\n\ndata = fb.read()\
  \                 # 返回字节\n```\n\n### 9.7.1 文件方法\n\n`open()` 返回的对象的具体类型取决于提供的文件模式和缓冲选项的组合。然而，生成的文件对象支持表\
  \ 9.4 中的方法。\n\n| 方法 | 描述 |\n| --- | --- |\n| `f.readable()` | 如果文件可读则返回 `True`。\
  \ |\n| `f.read([n])` | 最多读取 `n` 字节。 |\n| `f.readline([n])` | 读取单行输入，最多读取 `n` 个字符。如果省略\
  \ `n`，则该方法读取整整行。 |\n| `f.readlines([size])` | 读取所有行并返回列表。`size` 可选地指定在停止前在文件中读取的大致字符数。\
  \ |\n| `f.readinto(buffer)` | 将数据读入内存缓冲区。 |\n| `f.writable()` | 如果文件可写则返回 `True`。\
  \ |\n| `f.write(s)` | 写入字符串 `s`。 |\n| `f.writelines(lines)` | 写入迭代器 `lines` 中的所有字符串。\
  \ |\n| `f.close()` | 关闭文件。 |\n| `f.seekable()` | 如果文件支持随机访问寻道则返回 `True`。 |\n| `f.tell()`\
  \ | 返回当前文件指针。 |\n| `f.seek(offset [, where])` | 寻道到新的文件位置。 |\n| `f.isatty()` | 如果\
  \ `f` 是交互式终端则返回 `True`。 |\n| `f.flush()` | 刷新输出缓冲区。 |\n| `f.truncate([size])` |\
  \ 截断文件至最多 `size` 字节。 |\n| `f.fileno()` | 返回整型文件描述符。 |\n\n表 9.4 文件方法\n\n`readable()`、`writable()`\
  \ 和 `seekable()` 方法用于测试支持的文件能力和模式。`read()` 方法将整个文件作为字符串返回，除非可选的长度参数指定了最大字符数。`readline()`\
  \ 方法返回下一行输入，包括末尾的换行符；`readlines()` 方法将所有输入文件作为字符串列表返回。`readline()` 方法可选地接受一个最大行长度\
  \ `n`。如果读取的行超过了 `n` 个字符，`readline()` 方法将返回前 `n` 个字符。\n\n`read()` 方法在文件末尾时返回空字符串。`readline()`\
  \ 方法在文件末尾时返回空字符串。因此，以下代码显示了如何检测文件末尾（EOF）：\n\n```\nwhile True:\n    line = file.readline()\n\
  \    if not line:        # EOF\n        break\n```\n\n你也可以写成：\n\n```\nwhile (line:=file.readline()):\n\
  \    statements\n```\n\n读取文件中所有行的方便方法是使用 `for` 循环：\n\n```\nfor line in file:   \
  \ # 遍历所有行\n    do something with line\n```\n\n`write()` 方法将数据写入文件，`writelines()`\
  \ 方法将字符串写入文件。`write()` 和 `writelines()` 不添加换行符，因此你产生的所有输出应包含所有格式。\n\n内部，每个打开的文件对象都保留一个文件指针，存储下次读写操作将发生的字节偏移量。`tell()`\
  \ 方法返回指针的当前值。`seek(offset [,where])` 方法根据整数偏移量和 `where` 规则寻道到文件位置。如果 `where` 是 `os.SEEK_SET`（默认值），`seek()`\
  \ 假设偏移相对于文件开头；如果 `where` 是 `os.SEEK_CUR`，则相对于当前位置移动；如果 `where` 是 `os.SEEK_END`，则偏移量自文件末尾。\n\
  \n`fileno()` 方法返回文件的整型文件描述符，有时用于某些库模块中的底层 I/O 操作。例如，`fcntl` 模块使用文件描述符在 UNIX 系统上提供底层文件控制操作。\n\
  \n`readinto()` 方法用于向连续内存缓冲区执行零拷贝 I/O。它通常与 `numpy` 等专用库配合使用——例如将数据直接读入数值数组分配的内存。\n\
  \n文件对象还具有表 9.5](#ch09.xhtml_ch09tab05)所示的只读数据属性。\n\n| 属性 | 描述 |\n| --- | --- |\n\
  | `f.closed` | 布尔值表示文件状态：打开为 `False`，关闭时为 `True`。 |\n| `f.mode` |  I/O 模式。 |\n|\
  \ `f.name` | 使用 `open()` 创建的文件名。否则，它是指示文件来源的字符串。 |\n| `f.newlines` | 文件中实际找到的换行表示。值在未遇到换行符时为\
  \ `None`，包含 `'\\n'`、`'\\r'` 或 `'\\r\\n'` 的字符串，或者是包含所有看到的不同换行编码的元组。 |\n\n\n\n\n\n\
  | `f.encoding` | 一个指示文件编码的字符串，如果有的话（例如 `'latin-1'` 或 `'utf-8'`）。如果没有使用任何编码，则值为 `None`。\
  \ |\n| `f.errors` | 错误处理策略。 |\n| `f.write_through` | 布尔值，用于指示对文本文件的写入是否直接传递数据到底层的二进制级文件而不进行缓冲。\
  \ |\n\n## 表 9.5 文件属性\n\n### 9.8 标准输入、输出和错误\n\n解释器提供了三个标准文件类对象，分别称为标准输入、标准输出和标准错误，分别通过\
  \ `sys.stdin`、`sys.stdout` 和 `sys.stderr` 可用。`stdin` 是对应于提供解释器的输入字符流的文件对象，`stdout`\
  \ 是接收 `print()` 产生的输出的文件对象，而 `stderr` 是接收错误消息的文件。在大多数情况下，`stdin` 映射到用户的键盘，而 `stdout`\
  \ 和 `stderr` 则在屏幕上产生文本。\n\n上一节描述的方法可以用于与用户进行 I/O 操作。例如，下面的代码向标准输出写入内容，并从标准输入读取一行输入：\n\
  \n点击此处查看代码图像\n\n```python\nimport sys\n\nsys.stdout.write(\"Enter your name : \"\
  )\n\nname = sys.stdin.readline()\n```\n\n或者，内置函数 `input(prompt)` 可以从 `stdin` 读取一行文本，并可选地打印提示符：\n\
  \n点击此处查看代码图像\n\n```python\nname = input(\"Enter your name : \")\n```\n\n`input()`\
  \ 读取的行不包含末尾的换行符。这与直接从 `sys.stdin` 读取不同，后者的换行符会包含在输入文本中。\n\n如有必要，可以将 `sys.stdout`、`sys.stdin`\
  \ 和 `sys.stderr` 的值替换为其他文件对象，在这种情况下，`print()` 和 `input()` 函数将使用新值。如果需要恢复 `sys.stdout`\
  \ 的原始值，应先将其保存。解释器启动时，`sys.stdout`、`sys.stdin` 和 `sys.stderr` 的原始值也分别可用 `sys.__stdout__`、`sys.__stdin__`\
  \ 和 `sys.__stderr__` 获取。\n\n### 9.9 目录\n\n要获取目录列表，请使用 `os.listdir(pathname)` 函数。例如，这里是打印目录文件名列表的方法：\n\
  \n点击此处查看代码图像\n\n```python\nimport os\n\nnames = os.listdir('dirname')\n\nfor name\
  \ in names:\n    print(name)\n```\n\n`listdir()` 返回的名字通常根据 `sys.getfilesystemencoding()`\
  \ 返回的编码进行解码。如果你将初始路径指定为字节（bytes），则文件名将以未解码的字节字符串返回。例如：\n\n点击此处查看代码图像\n\n```python\n\
  import os\n\n# 返回原始未解码名称\nnames = os.listdir(b'dirname')\n```\n\n与目录列表相关的有用操作是根据模式匹配文件名，这被称为\
  \ `globbing`。`pathlib` 模块可以此此。例如，这里有一个在特定目录下匹配所有 `*.txt` 文件的示例：\n\n点击此处查看代码图像\n\n\
  ```python\nimport pathlib\n\nfor filename in path.Path(dirname).glob('*.txt'):\n\
  \    print(filename)\n```\n\n如果你使用 `rglob()` 代替 `glob()`，它将递归搜索所有子目录中匹配模式的文件名。`glob()`\
  \ 和 `rglob()` 函数都返回一个通过迭代产生文件名的生成器。\n\n### 9.10 `print()` 函数\n\n要打印一组由空格分隔的值，请像这样将所有值提供给\
  \ `print()`：\n\n点击此处查看代码图像\n\n```python\nprint('The values are', x, y, z)\n```\n\
  \n要抑制或更改行结束符，使用 `end` 关键字参数：\n\n点击此处查看代码图像\n\n```python\n# 抑制换行符\nprint('The values\
  \ are', x, y, z, end='')\n```\n\n要将输出重定向到文件，使用 `file` 关键字参数：\n\n点击此处查看代码图像\n\n```python\n\
  # 重定向到文件对象 f\nprint('The values are', x, y, z, file=f)\n```\n\n要更改项目之间的分隔符，使用 `sep`\
  \ 关键字参数：\n\n点击此处查看代码图像\n\n```python\n# 在值之间放置逗号\nprint('The values are', x, y, z,\
  \ sep=',')\n```\n\n### 9.11 生成输出\n\n直接处理文件操作对程序员来说最熟悉。然而，生成器函数也可以用于将数据碎片序列发射 I/O\
  \ 流。要这样做，请像使用 `write()` 或 `print()` 函数一样使用 `yield` 语句。\n\n（注：原文在此节提供了一些乱码/占位符文本；已根据提供的结构逻辑清理了格式。）\n\
  \n### 9.12 消费输入\n\n对于消耗碎片输入的程序，增强生成器对于解码协议和 I/O 的其他方面非常有用。这里是一个增强生成器的示例，它接收字节碎片并将其组装成行：\n\
  \n点击此处查看代码图像\n\n```python\ndef line_receiver():\n    data = bytearray()\n    line\
  \ = None\n    linecount = 0\n    while True:\n        part = yield line\n      \
  \  linecount += part.count(b'\\n')\n        data.extend(part)\n        if linecount\
  \ > 0:\n            index = data.index(b'\\n')\n            line = bytes(data[:index+1])\n\
  \            data = data[index+1:]\n            linecount -= 1\n        else:\n\
  \            line = None\n```\n\n\n\n\n\n这种方法的一个有趣的副作用是它将获取输入数据时必须执行的 I/O 操作外部化了。具体来说，`line_receiver()`\
  \ 的实现完全不包含任何 I/O 操作！这意味着可以在不同的上下文中使用它。例如，配合套字：\n\n点击此处查看代码图片\n\n```python\nr = line_receiver()\n\
  \ndata = None\n\nwhile True:\n\n    while not (line:=r.send(data)):\n\n        data\
  \ = sock.recv(8192)\n\n    # Process the line\n\n    ...\n```\n\n或者配合文件：\n\n点击此处查看代码图片\n\
  \n```python\nr = line_receiver()\n\ndata = None\n\nwhile True:\n\n    while not\
  \ (line:=r.send(data)):\n        data = file.read(10000)\n\n    # Process the line\n\
  \n    ...\n```\n\n或者甚至在异步代码中：\n\n点击此处查看代码图片\n\n```python\nasync def reader(ch):\n\
  \n    r = line_receiver()\n\n    data = None\n\n    while True:\n\n        while\
  \ not (line:=r.send(data)):\n            data = await ch.receive(8192)\n\n     \
  \   # Process the line\n\n        ...\n```\n\n# 9.13 对象序列化\n\n有时有必要对对象的表示进行序列化，以便可以在网络上传输、保存到文件或存储在数据库中。实现此目的的方法是将数据转换为标准编码，如\
  \ JSON 或 XML。还有一种常用的 Python 特有的数据序列化格式称为 `Pickle`。\n\n`pickle` 模块将对象序列化为字节流，该流可以在稍后的某个时间点重建该对象。`pickle`\
  \ 的接口非常简单，由两个操作组成：`dump()` 和 `load()`。例如，以下代码将对象写入文件：\n\n点击此处查看代码图片\n\n```python\n\
  import pickle\n\nobj = SomeObject()\n\nwith open(filename, 'wb') as file:\n   pickle.dump(obj,\
  \ file)      # Save object on f\n```\n\n要恢复对象，使用：\n\n点击此处查看代码图片\n\n```python\nwith\
  \ open(filename, 'rb') as file:\n\n    obj = pickle.load(file)   # Restore the object\n\
  ```\n\n`pickle` 使用的数据格式有其自己的记录帧结构。因此，可以通过连续发布一系列 `dump()` 操作来保存对象序列。要恢复这些对象，只需使用类似的\
  \ `load()` 操作序列即可。\n\n对于网络编程，使用 `pickle` 创建字节编码的消息是种常见做法。要做到这一点，请使用 `dumps()` 和\
  \ `loads()`。这些函数不是对文件读写数据，而是与字节字符串一起工作。\n\n点击此处查看代码图片\n\n```python\nobj = SomeObject()\n\
  \n# Turn an object into bytes\n\ndata = pickle.dumps(obj)\n\n...\n\n# Turn bytes\
  \ back into an object\n\nobj = pickle.loads(data)\n```\n\n用户定义的对象通常不需要为了与 `pickle`\
  \ 工作而做任何额外操作。然而，某些类型的对象无法被 pickle。这些对象往往是包含运行时状态的对象——打开的文件、线程、闭包、生成器等。为了处理这些棘手的情况，类可以定义特殊方法\
  \ `__getstate__()` 和 `__setstate__()`。\n\n如果定义了 `__getstate__()` 方法，它将被调用以创建一个表示对象状态的值。`__getstate__()`\
  \ 返回的值通常是字符串、元组、列表或字典。`__setstate__()` 方法在反序列化期间接收此值，并应该从它恢复对象的状态。\n\n在编码对象时，`pickle`\
  \ 并不包含源代码本身。相反，它编码了指向定义类的名称引用。在反序列化时，该名称被用于在系统上执行源码查找。为了使反序列化工作，pickle 的接收方必须已经安装了正确的源码。同样重要的是强调，`pickle`\
  \ 本质上是不安全的——反序列化不可信的数据是已知的远程代码执行向量。因此，只有当你能够完全保护运行时环境时，才使用 `pickle`。\n\n# 9.14 阻塞操作与并发\n\
  \nI/O 的一个基本方面是“阻塞”（blocking）的概念。从本质上说，I/O 与现实世界相关。它通常涉及等待输入或设备就绪。例如，在网络上读取数据的代码可能会像这样对套接字执行接收操作：\n\
  \n点击此处查看代码图片\n\n```python\ndata = sock.recv(8192)\n```\n\n当该语句执行时，如果数据可用，它可能会立即返回。然而，如果并非如此，它将停止——等待数据到达。这就是阻塞。在程序阻塞期间，其他什么都不会发生。\n\
  \n对于数据分析脚本或简单程序，阻塞不是你需要担心的事情。然而，如果你想让程序在操作阻塞时执行其他事情，你就需要采取不同的方法。这就是并发的基础问题——让程序同时处理多一件事。一个常见问题是让程序同时在两个或多个不同的网络套接字上读取：\n\
  \n点击此处查看代码图片\n\n```python\ndef reader1(sock):\n    while (data := sock.recv(8192)):\n\
  \        print('reader1 got:', data)\n\ndef reader2(sock):\n    while (data := sock.recv(8192)):\n\
  \        print('reader2 got:', data)\n\n# Problem: 如何让 reader1() 和 reader2() \n\
  # 同时运行?\n```\n\n本节的其余部分概述了解决此问题的几种不同方法。然而，它并不是一个关于并发的完整教程。关于这一点，你需要咨询其他资源。\n\n###\
  \ 9.14.1 非阻塞 I/O\n\n避免阻塞的一种方法是使用所谓的“非阻塞 I/O”（nonblocking I/O）。这是一个必须启的特殊模式——例如，在套接字上：\n\
  \n点击此处查看代码图片\n\n```python\nsock.setblocking(False)\n```\n\n一旦启用，如果操作将阻塞，现在会抛出异常。例如：\n\
  \n点击此处查看代码图片\n\n```python\ntry:\n    data = sock.recv(8192)\nexcept BlockingIOError:\n\
  \    # No data is available\n    ...\n```\n\n响应 `BlockingIOError`，程序可以选择处理其他事情。它可以稍后重试\
  \ I/O 操作查看数据是否到达。例如，这里是你可以同时读取两个套接字的方法：\n\n点击此处查看代码图片\n\n```python\ndef reader1(sock):\n\
  \    try:\n        data = sock.recv(8192)\n        print('reader1 got:', data)\n\
  \    except BlockingIOError:\n        pass\n\ndef reader2(sock):\n    try:\n   \
  \     data = sock.recv(8192)\n        print('reader2 got:', data)\n    except BlockingIOError:\n\
  \        pass\n\ndef run(sock1, sock2):\n    sock1.setblocking(False)\n    sock2.setblocking(False)\n\
  \    while True:\n        reader1(sock1)\n        reader2(sock2)\n```\n\n在实践中，仅依赖非阻塞\
  \ I/O 是笨拙且低效的。例如，程序的核心是结尾的 `run()` 函数。它会在忙循环中运行，不断尝试读取套接字。这可行，但不是一个良好的设计。\n\n###\
  \ 9.14.2 I/O 轮询\n\n与其依赖异常和轮询，可以轮询 I/O 通道查看数据是否可用。`select` 或 `selectors` 模块可用于此。例如，这里是\
  \ `run()` 函数的一个稍修改版本：\n\n点击此处查看代码图片\n\n```python\nfrom selectors import DefaultSelector,\
  \ EVENT_READ, EVENT_WRITE\n\ndef run(sock1, sock2):\n    selector = DefaultSelector()\n\
  \    selector.register(sock1, EVENT_READ, data=reader1)\n    selector.register(sock2,\
  \ EVENT_READ, data=reader2)\n\n    # 等待事情发生\n    while True:\n        for key, evt\
  \ in selector.select():\n            func = key.data\n            func(key.fileobj)\n\
  ```\n\n\n\n\n在此代码中，每当在相应的套接上检测到 I/O 时，循环就会回调 `reader1()` 或 `reader2()` 函数。`selector.select()`\
  \ 操作本身是阻塞的，等待 I/O 的发生。因此，与之前的示例不同，它不会让 CPU 疯狂空转。\n\n这种 I/O 方法是许多所谓“异步”框架（如 `asyncio`）的基础，尽管你通常看不到事件循环的内部机制。\n\
  \n### 9.14.3 线程\n\n在最后两个示例中，并发需要使用一个特殊的 `run()` 函数来驱动计算。作为替代方案，你可以使用线程编程和 `threading`\
  \ 模块。将线程想象成在程序内部运行的独立任务。这是一个同时在两个套接上读取数据的代码示例：\n\n点击此处查看代码图像\n\n```\nimport threading\n\
  \ndef reader1(sock):\n    while (data := sock.recv(8192)):\n        print('reader1\
  \ got:', data)\n\ndef reader2(sock):\n    while (data := sock.recv(8192)):\n   \
  \     print('reader2 got:', data)\n\nt1 = threading.Thread(target=reader1, args=[sock1]).start()\n\
  t2 = threading.Thread(target=reader2, args=[sock2]).start()\n\n# Start the threads\n\
  t1.start()\nt2.start()\n\n# Wait for the threads to finish\nt1.join()\nt2.join()\n\
  ```\n\n在这个程序中，`reader1()` 和 `reader2()` 函数并发执行。这是由主机操作系统管理的，因此你不需要了解太多它的工作原理。如果一个线程发生了阻塞操作，它不会影响另一个线程。\n\
  \n线程编程的主题完全超出了本书的讨论范围。不过，在本章后后的 `threading` 模块部分提供了一些额外的示例。\n\n### 9.14.4 使用 `asyncio`\
  \ 进行并发执行\n\n`asyncio` 模块提供了一种替代线程的并发实现方案。在内部，它基于使用 I/O 轮询的事件循环。然而，通过使用特殊的 `async`\
  \ 函数，其高层编程模型看起来与线程非常相似。这里有一个示例：\n\n点击此处查看代码图像\n\n```\nimport asyncio\n\nasync def\
  \ reader1(sock):\n    loop = asyncio.get_event_loop()\n    while (data := await\
  \ loop.sock_recv(sock, 8192)):\n        print('reader1 got:', data)\n\nasync def\
  \ reader2(sock):\n    loop = asyncio.get_event_loop()\n    while (data := await\
  \ loop.sock_recv(sock, 8192)):\n        print('reader2 got:', data)\n\nasync def\
  \ main(sock1, sock2):\n    loop = asyncio.get_event_loop()\n    t1 = loop.create_task(reader1(sock1))\n\
  \    t2 = loop.create_task(reader2(sock2))\n    # Wait for the tasks to finish\n\
  \    await t1\n    await t2\n\n...\n\n# Run it\nasyncio.run(main(sock1, sock2))\n\
  ```\n\n使用 `asyncio` 的完整细节需要一本专门的书。你应该了解的是，许多库和框架都声称支持异步操作。通常意味着通过 `asyncio` 或类似的模块支持并发执行。大部分代码可能涉及异步函数和相关功能。\n\
  \n# 9.15 标准库模块\n\n大量的标准库模块被用于各种 I/O 相关的任务。本节提供了常用模块的简要概述，并带了一些示例。完整的参考资料可以在网上或 IDE\
  \ 中找到，不再在此重复。本节的主要目的是通过提供你应该使用的模块名称，以及涉及每个模块的常见编程任务的示例，为你指明正确的方向。\n\n许多示例以交互式 Python\
  \ 会话的形式展示。我们鼓励你亲自尝试这些实验。\n\n### 9.15.1 `asyncio` 模块\n\n`asyncio` 模块提供了使用 I/O 轮询和底层事件循环的并发\
  \ I/O 操作支持。它的主要用途是涉及网络和分布式系统的代码。这里是一个使用低层套接字的 TCP 回显服务器示例：\n\n点击此处查看代码图像\n\n```\n\
  import asyncio\nfrom socket import *\n\nasync def echo_server(address):\n    loop\
  \ = asyncio.get_event_loop()\n    sock = socket(AF_INET, SOCK_STREAM)\n    sock.setsockopt(SOL_SOCKET,\
  \ SO_REUSEADDR, 1)\n    sock.bind(address)\n    sock.listen(5)\n    sock.setblocking(False)\n\
  \    print('Server listening at', address)\n    with sock:\n        while True:\n\
  \            client, addr = await loop.sock_accept(sock)\n            print('Connection\
  \ from', addr)\n            loop.create_task(echo_client(loop, client))\n\nasync\
  \ def echo_client(loop, client):\n    with client:\n        while True:\n      \
  \      data = await loop.sock_recv(client, 10000)\n            if not data:\n  \
  \              break\n            # (注意：原文在此处突然结束)\n```\n\n### 9.15.2 `binascii`\
  \ 模块\n\n`binascii` 模块包含用于将二进制数据转换为各种表示的函数。例如：\n\n### 9.15.3 `cgi` 模块\n\n所以，假设你只是想在你的网站上放一个简单的表单。也许是为你每周的“猫与分类”新闻通讯的订阅表单。当然，你可以安装最新的\
  \ Web 框架并花费所有时间摆弄它。或者，你也可以编写一个简单的 CGI 脚本——老式风格。`cgi` 模块就是为此准备的。\n\n\n\n\n\n编写这样的\
  \ CGI 脚本能让你在互联网初创公司找到工作吗？可能不能。它能解决你的实际问题吗？很有可能。\n\n### 9.15.4 `configparser` 模块\n\
  \nINI 文件是以人类可读格式编码程序配置信息的常见格式。以下是一个示例：\n\n点击此处查看代码图片\n\n```ini\n# config.ini\n\n\
  ; A comment\n\n[section1]\n\nname1 = value1\n\nname2 = value2\n\n[section2]\n\n\
  ; Alternative syntax\n\nname1: value1\n\nname2: value2\n```\n\n`configparser` 模块用于读取\
  \ `.ini` 文件并提取值。这里有一个基础示例：\n\n点击此处查看代码图片\n\n```python\nimport configparser\n\n#\
  \ 创建一个配置解析器并读取文件\n\ncfg = configparser.ConfigParser()\n\ncfg.read('conig.ini')\n\
  \n# 提取值\n\na = cfg.get('section1', 'name1')\n\nb = cfg.get('section2', 'name2')\n\
  \n...\n```\n\n该模块还提供了高级功能，包括字符串插值功能、合并多个 `.ini`文件的能力、提供默认值等。更多示例请参阅官方文档。\n\n###\
  \ 9.15.5 `csv` 模块\n\n`csv` 模块用于读取/写入由 Microsoft Excel 等程序生成或从数据库导出的逗号分隔值（CSV）文件。要使用它，需要先打开一个文件，然后在其周围封装一层额外的\
  \ CSV 编码/解码器。例如：\n\n点击此处查看代码图片\n\n```python\nimport csv\n\n# 将 CSV 文件读取为元组列表\n\n\
  def read_csv_data(filename):\n    with open(filename) as file:\n        rows = csv.reader(file)\n\
  \        # 第一行通常是表头。读取这一行\n        headers = next(rows)\n        # 现在读取剩余数据\n  \
  \      for row in rows:\n            # 对 row 进行某些操作\n            ...\n\n# 将 Python\
  \ 数据写入 CSV 文件\n\ndef write_csv_data(filename, headers, rows):\n    with open(filename,\
  \ \"w\") as file:\n        out = csv.writer(file)\n        out.writerow(headers)\n\
  \        out.writerows(rows)\n```\n\n一个常用的方便方法是改用 `DictReader()`。它将 CSV 文件的第一行解释为表头，并将每行作为字典而不是元组返回。\n\
  \n点击此处查看代码图片\n\n```python\nimport csv\n\ndef find_nearby(filename):\n    with open(filename)\
  \ as file:\n        rows = csv.DictReader(file)\n        for row in rows:\n    \
  \        lat = float(rows['latitude'])\n            lon = float(rows['longitude'])\n\
  \            if close_enough(lat, lon):\n                print(row)\n```\n\n`csv`\
  \ 模块对 CSV 数据除了读取或写入外并没有做很多。它提供的主要好处是该模块知道如何正确地编码/解码数据，并处理许多涉及引号、特殊字符和其他细节的边界情况。你可能会使用这个模块来编写简单的脚本，用于清理或准备供其他程序使用的数据。如果你想对\
  \ CSV 数据执行数据分析任务，请考虑使用第三方包，如流行的 `pandas` 库。\n\n### 9.15.6 `errno` 模块\n\n每当发生系统级错误时，Python\
  \ 都会用一个 `OSError` 的子类的异常来报告它。一些常见的系统错误由 `OSError` 的独立子类表示，例如 `PermissionError` 或\
  \ `FileNotFoundError`。然而，在实践中还可能发生数百种其他错误。对于这些错误，任何 `OSError` 异常都带有一个可以检查的数值 `errno`\
  \ 属性。`errno` 模块提供了与这些错误代码对应的符号常量。它们在编写特殊的异常处理器时经常被使用。例如，这里有一个检查设备上没有剩余剩余的异常处理器：\n\
  \n点击此处查看代码图片\n\n```python\nimport errno\n\ndef write_data(file, data):\n    try:\n\
  \        file.write(data)\n    except OSError as e:\n        if e.errno == errno.ENOSPC:\n\
  \            print(\"你的磁盘空间不足！\")\n        else:\n            raise       # 其他错误。向上抛出\n\
  ```\n\n### 9.15.7 `fcntl` 模块\n\n`fcntl` 模块用于通过 `fcntl()` 和 `ioctl()` 系统调用在 UNIX\
  \ 上执行低级 I/O 控制操作。如果你想执行任何类型的文件锁定——这个问题有时会在并发和分布式系统的背景下出现——也要使用该模块。这里是一个结合 `fcntl.flock()`\
  \ 在所有进程中进行互斥锁打开文件的示例：\n\n点击此处查看代码图片\n\n```python\nimport fcntl\n\nwith open(\"somefile\"\
  , \"r\") as file:\n     try:\n         fcntl.flock(file.fileno(), fcntl.LOCK_EX)\n\
  \         # 使用文件\n         ...\n     finally:\n         fcntl.flock(file.fileno(),\n\
  ```\n\n### 9.15.8 `hashlib` 模块\n\n`hashlib` 模块提供了计算安全哈希值（如 MD5、SHA-1 和 SHA-256）的接口。它对于验证数据完整性和密码哈希非常有用。例如，这里是计算字符串哈希值的方法：\n\
  \n```python\nimport hashlib\n\nh = hashlib.sha256()\nh.update(b\"hello world\")\n\
  print(h.hexdigest())\n```\n\n### 9.15.9 `http` 包\n\n`http` 包包含大量与 HTTP 协议相关的代码。它可以用于实现服务器和客户端。然而，`http`\
  \ 包的一个实用用功能是能够通过一组文件运行一个独立的 Web 服务器。\n\n点击此处查看代码图片\n\n```bash\n$ python -m http.server\n\
  Serving HTTP on 0.0.0.0 port 8000 (http://0.0.0.0:8000/)\n```\n\n现在，只要你将其指向正确的端口，Python\
  \ 将向你的浏览器提供文件。你不会用它来运行网站，但它对于测试和调试程序很有用。\n\n### 9.15.10 `io` 模块\n\n`io` 模块主要包含实现\
  \ `open()` 函数返回的文件对象的类。直接访问这些类并不常见。然而，该模块还包含一对类，用于以字符串和字节的形式“伪造”文件。这对于测试以及需要提供文件但通过其他方式获取数据的应用非常有用。\n\
  \n`StringIO()` 类在字符串之上提供了一个类似文件的接口。例如，这里是如何将输出写入字符串：\n\n```python\n# 期望文件的函数\n\n\
  def greeting(file):\n    file.write('Hello\\n')\n    file.write('World\\n')\n\n\
  # 使用真实文件调用函数\nwith open('out.txt', 'w') as file:\n    greeting(file)\n\n# 使用“伪造”文件调用函数\n\
  import io\n\nfile = io.StringIO()\n\ngreeting(file)\n\n# 获取结果输出\noutput = file.getvalue()\n\
  ```\n\n同样，你可以创建一个 `StringIO` 对象并使用它进行读取：\n\n点击此处查看代码图片\n\n```python\nfile = io.StringIO('hello\\\
  nworld\\n')\n\nwhile (line := file.readline()):\n    print(line, end='')\n```\n\n\
  `BytesIO()` 类具有类似的用途，但用于通过字节模拟二进制 I/O。\n\n\n\n\n`json` 模块可用于对 JSON 格式的数据进行编码和解码，通常用于微服务和\
  \ Web 程序的 API。转换数据有两个基本函数：`dumps()` 和 `loads()`。`dumps()` 接收 Python 字典并将其编码为 JSON\
  \ Unicode 字符串：\n\n点击此处查看代码图片\n\n```\n>>> import json\n\n>>> data = { 'name': 'Mary\
  \ A. Python', 'email': 'mary123@python.org' }\n\n>>> s = json.dumps(data)\n\n>>>\
  \ s\n\n'{\"name\": \"Mary A. Python\", \"email\": \"mary123@python.org\"}'\n\n>>>\n\
  ```\n\n`loads()` 函数的作用方向则相反：\n\n点击此处查看代码图片\n\n```\n>>> d = json.loads(s)\n\n>>>\
  \ d == data\n\nTrue\n\n>>>\n```\n\n`dumps()` 和 `loads()` 函数都有许多选项，用于控制转换的各个方面以及与\
  \ Python 类实例进行交互。这超出了本节的范围，但在官方文档中提供了大量的信息。\n\n### 9.15.12 `logging` 模块\n\n`logging`\
  \ 模块是报告程序诊断和进行打印式调试的实标准模块。它可以将输出路由到日志文件，并提供了大量的配置选项。常见的做法是编写代码创建一个 `Logger` 实例并在其上发布消息，如下所示：\n\
  \n点击此处查看代码图片\n\n```\nimport logging\n\nlog = logging.getLogger(__name__)\n\n# 使用\
  \ logging 的函数\n\ndef func(args):\n    log.debug(\"A debugging message\")\n    log.info(\"\
  An informational message\")\n    log.warning(\"A warning message\")\n    log.error(\"\
  An error message\")\n    log.critical(\"A critical message\")\n\n# 配置配置（在程序启动时发生）\n\
  \nif __name__ == '__main__':\n    logging.basicConfig(\n         level=logging.WARNING,\n\
  \         filename=\"output.log\"\n    )\n```\n\n日志有五个内置的级别，按严重程度递增排序。在配置日志系统时，你指定一个级别作为过滤器。只有该级别或更严重程度的消息才会被报告。日志提供了许多配置选项，大部分与日志消息的后端处理有关。通常在编写应用程序代码时，你不需要了解这些——你可以在给定的\
  \ `Logger` 实例上使用 `debug()`、`info()`、`warning()` 和类似的方法。任何特殊配置都会发生在程序启动时的特殊位置（例如\
  \ `main()` 函数或主代码块）。\n\n### 9.15.13 `os` 模块\n\n`os` 模块提供了用于常用操作系统函数的的可移植接口，这些函数通常与进程环境、文件、目录、权限等相关。其编程接口紧密遵循\
  \ C 语言编程和 POSIX 等标准。\n\n从实践上来说，该模块的大部分内容可能太底层了，无法直接在典型的应用程序中使用。然而，如果你遇到执行某些晦涩低层系统操作（如打开\
  \ TTY）的问题，你很有可能在这里找到实现所需的功能。\n\n### 9.15.14 `os.path` 模块\n\n`os.path` 模块是一个用于处理路径和对文件系统执行常用操作的旧模块。它的功能在很大程度上被较新的\
  \ `pathlib` 模块取代了，但由于其用法仍然非常广泛，你仍会在很多代码中看到它。\n\n该模块解决的一个基本问题是处理 UNIX（正斜杠 `/`）和 Windows（反斜杠\
  \ `\\`）路径分隔符的可移植性。`os.path.join()` 和 `os.path.split()` 等函数经常用于拆分文件路径并重新组合：\n\n点击此处查看代码图片\n\
  \n```\n>>> filename = '/Users/beazley/Desktop/old/data.csv'\n>>> os.path.split()\n\
  \n('/Users/beazley/Desktop/old', 'data.csv')\n\n>>> os.path.join('/Users/beazley/Desktop',\
  \ 'out.txt')\n\n'/Users/beazley/Desktop/out.txt'\n\n>>>\n```\n\n这是一个使用这些函数的代码示例：\n\
  \n点击此处查看代码图片\n\n```python\nimport os.path\n\ndef clean_line(line):\n    # 对齐某行（无论内容是什么）\n\
  \    return line.strip().upper() + '\\n'\n\ndef clean_data(filename):\n    dirname,\
  \ basename = os.path.split()\n    newname = os.path.join(dirname, basename+'.clean')\n\
  \    with open(newname, 'w') as out_f:\n        with open(filename, 'r') as in_f:\n\
  \            for line in in_f:\n                out_f.write(clean_line(line))\n\
  ```\n\n`os.path` 模块还有许多函数，如 `isfile()`、`isdir()` 和 `getsize()`，用于对文件系统进行测试并获取文件元数据。例如，此函数返回简单文件或目录目录下所有文件的总大小（字节）：\n\
  \n点击此处查看代码图片\n\n```\n\n### 9.15.15 `pathlib` 模块\n\n`pathlib` 模块是处理路径的现代方式。它将许多 `os.path`\
  \ 功能整合在一个面向对象的接口中。一旦你拥有了一个 `Path` 实例，就可以对其执行各种操作。例如：\n\n```python\nfrom pathlib\
  \ import Path\nfilename = Path('/Users/beazley/Desktop/old/data.csv')\n\n>>> filename.name\n\
  \n'data.csv'\n\n>>> filename.parent\n\nPath('/Users/beazley/Desktop/old')\n\n>>>\
  \ filename.parent / 'newfile.csv'\n\nPath('/Users/beazley/Desktop/old/newfile.csv')\n\
  \n>>> filename.parts\n\n('/', 'Users', 'beazley', 'old', 'data.csv')\n\n>>> filename.with_suffix('.clean')\n\
  \nPath('/Users/beazley/Desktop/old/data.clean')\n```\n\n`Path` 实例还有用于获取元数据、获取目录列表以及其他类似的函数。这里是对上一节\
  \ `compute_usage()` 函数的重新实现：\n\n```python\nimport pathlib\n\ndef compute_usage(filename):\n\
  \    pathname = pathlib.Path(filename)\n    if pathname.is_file():\n        return\
  \ pathname.stat().st_size\n    elif pathname.is_dir():\n        return sum(path.stat().st_size\n\
  \                   for path in pathname.rglob('*')\n                   if path.is_file())\n\
  \    else:\n        raise RuntimeError('Unsupported file kind')\n```\n\n### 9.15.16\
  \ `re` 模块\n\n`re` 模块用于使用正则表达式执行文本匹配、搜索和替换操作。这里有一个简单的示例：\n\n点击此处查看代码图片\n\n```\n>>>\
  \ text = 'Today is 3/27/2018\\. Tomorrow is 3/28/2018.'\n\n>>> # 查找所有日期\n\n>>> import\
  \ re\n\n>>> re.findall(r'\\d+/\\d+/\\d+', text)\n\n['3/27/2018', '3/28/2018']\n\n\
  >>> # 将所有日期替换为目标文本\n\n>>> re.sub(r'(\\d+)/(\\d+)/(\\d+)', r'\\3-\\1-\\2', text)\n\
  \n'Today is 2018-3-27\\. Tomorrow is 2018-3-28.'\n\n>>>\n```\n\n正则表达式以其语法晦涩著称。在这个示例中，`\\\
  d+` 被解释为“一个或多个数字”。关于模式语法的更多信息可以在 `re` 模块的官方文档中找到。\n\n### 9.15.17 `shutil` 模块\n\n\
  `shutil` 模块用于执行一些你可能在 shell 中执行的常用任务。这些包括复制和删除文件、处理压缩包等。例如，复制文件：\n\n\n\n\n\n点击此处查看代码图像\n\
  \n```python\nimport shutil\n\nshutil.copy(srcfile, dstfile)\n```\n\n要移动文件：\n\n点击此处查看代码图像\n\
  \n```python\nshutil.move(srcfile, dstfile)\n```\n\n要复制目录树：\n\n点击此处查看代码图像\n\n```python\n\
  shutil.copytree(srcdir, dstdir)\n```\n\n要删除目录树：\n\n```python\nshutil.rmtree(pathname)\n\
  ```\n\n`shutil` 模块通常作为一种更安全、更可移植的方案，用于替代直接使用 `os.system()` 函数执行 shell 命令。\n\n####\
  \ 9.15.18-select 模块\n\n`select` 模块用于对多个 I/O 流进行简单的轮询。也就是说，它可以用于监控一组文件描述符以检查是否有输入数据或是否有接收输出数据的能力。以下示例展示了典型的用法：\n\
  \n点击此处查看代码图像\n\n```python\nimport select\n\n# 代表文件描述符的对象集合。必须是\n# 整数或具有 fileno()\
  \ 方法的对象。\n\nwant_to_read = [ ... ]\n\nwant_to_write = [ ... ]\n\ncheck_exceptions\
  \ = [ ... ]\n\n# 超时（或为 None）\ntimeout = None\n\n# 轮询 I/O\ncan_read, can_write, have_exceptions\
  \ = \\\n    select.select(want_to_read, want_to_write, check_exceptions, timeout)\n\
  \n# 执行 I/O 操作\nfor file in can_read:\n    do_read(file)\n\nfor file in can_write:\n\
  \    do_write(file)\n\n# 处理异常\nfor file in have_exceptions:\n    handle_exception(file)\n\
  ```\n\n在这段代码中，构建了三组文件描述符。这些集合分别对应读取、写入和异常。它们与可选的超时时间一起传递给 `select()`。`select()`\
  \ 返回所传参数的三个子集。这些子集代表可以执行请求操作的文件。例如，`can_read()` 返回的文件有待处理的输入数据。\n\n`select()` 函数是一个标准的低级系统调用，通常用于监控系统事件并实现异步\
  \ I/O 框架，例如内置的 `asyncio` 模块。\n\n除了 `select()`，`select` 模块还暴露了 `poll()`、`epoll()`、`kqueue()`\
  \ 以及类似的变函数，它们提供了相似的功能。这些函数的可用性取决于操作系统。\n\n`selectors` 模块为 `select` 提供了一个更高层次的接口，这在某些上下文中可能很有用。之前在\
  \ 第 9.14.2 节 中给过一个示例。\n\n#### 9.15.19-smtplib 模块\n\n`smtplib` 模块实现了 SMTP 的客户端，通常用于发送电子邮件消息。该模块的一个常见用途是在脚本中执行此操作——向某人发送电子邮件。以下是一个示例：\n\
  \n点击此处查看代码图像\n\n```python\nimport smtplib\n\nfromaddr = \"someone@some.com\"\ntoaddrs\
  \ = [\"recipient@other.com\" ]\namount = 123.45\nmsg = f\"\"\"From: {fromaddr}\\\
  r\n\\r\nPay {amount} bitcoin or else.  We're watching.\\r\n\"\"\"\n\nserver = smtplib.SMTP('localhost')\n\
  serv.sendmail(fromaddr, toaddrs, msg)\nserv.quit()\n```\n\n还有额外的功能来处理密码、验证和其他事项。然而，如果你在机器上运行脚本，且该机器配置为支持电子邮件，上面的示例通常就能完成工作。\n\
  \n#### 9.15.20-socket 模块\n\n`socket` 模块提供了对网络编程函数的低级访问。该接口模仿标准的 BSD socket 接口，通常与\
  \ C 语言中的系统编程相关。\n\n以下示例展示了如何建立外部连接并接收响应：\n\n点击此处查看代码图像\n\n```python\nfrom socket\
