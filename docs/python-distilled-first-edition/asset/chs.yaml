  | `s.translate(table[, deletechars])` | 使用翻译表翻译字符串。 |\n| `s.upper()` |转换为大写。 |\n\
  | `s.zfill(width)` | 在左侧填充零直到达到指定的 `width`。 |\n\n表 10.2 bytes 和 bytearrays 的额外操作\n\
