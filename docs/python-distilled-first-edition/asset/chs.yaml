  \ # Account('Guido', 1000.0)\na.deposit(500)\nprint(a) # Account('Guido', 1500.0)\n\
  a.withdraw(200)\nprint(a) # Account('Guido', 1300.0)\n```\n\n*(注：由于原文后半部分存在逻辑缺失或重复，上述译文已根据代码块逻辑和\
