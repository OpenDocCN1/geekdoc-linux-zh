  \ | 在长度为 `width` 的字符串中使 `s` 右对齐。 |\n| `s.rpartition(sep)` | 根据分隔符 `sep` 分割 `s`，但从字符串结尾搜索。\
  \ |\n| `s.rsplit([sep [, maxsplit]])` | 使用 `sep` 作为分隔符从字符串末尾分割字符串。`maxsplit` 是允许的最大分割次数。如果省略\
