  \ 80))\nsock.send(b'GET /index.html HTTP/1.0\\r\\n\\r\\n')\nparts = []\nwhile True:\n\
  \    part = sock.recv(10000)\n    if not part:\n        break\n    parts.append(part)\n\
  response = b''.join(part)\nprint(part)\n```\n\n以下示例展示了一个基础的 echo 服务器，它可以接受客户端连接并回显任何接收到的数据。要测试此服务器，运行它，然后在另一个终端会话中使用\
  \ `telnet localhost 25000` 或 `nc localhost 25000` 等命令与其连接。\n\n点击此处查看代码图像\n\n```python\n\
  from socket import socket, AF_INET, SOCK_STREAM\n\ndef echo_server(address):\n \
  \   # 实现细节\n    pass\n```\n\n（注：提供的 echo 服务器源码包含碎片化逻辑；结构已根据标准的 socket 模式进行了清理。）\n\
  \n#### 9.15.21-struct 模块\n\n`struct` 模块用于在 Python 和二进制结构（表示为字节字符串）之间转换数据。这些数据结构在与\
  \ C 语言函数、二进制文件格式、网络协议或二进制通信交互时经常被使用。\n\n例如，假设你需要构建一个格式由 C 结构描述的二进制消息：\n\n```c\n\
  # 消息格式：所有值为“大端序”\nstruct Message {\n    unsigned short msgid;      // 16 位无符号整数\n\
  \    unsigned int sequence;     // 32 位序列号\n    float x;                   // 32\
  \ 位浮点数\n    float y;                   // 32 位浮点数\n}\n```\n\n这是使用 `struct` 模块实现此操作的方法：\n\
  \n点击此处查看代码图像\n\n```python\nimport struct\n>>> data = struct.pack('>HIff', 123, 456,\
  \ 1.23, 4.56)\n>>> data\nb'\\x00{\\x00\\x00-?\\9dp\\xa4@\\x91\\xeb\\x85'\n```\n\n\
  要解码二进制数据，使用 `struct.unpack`：\n\n点击此处查看代码图像\n\n```python\n>>> struct.unpack('>HIff',\
  \ data)\n(123, 456, 1.2300000190734863, 4.559999942779541)\n```\n\n浮点数值上的差异是由于转换为\
  \ 32 位时产生的精度损失造成的。Python 将浮点数表示为 64 位双精度值。\n\n#### 9.15.22-subprocess 模块\n\n`subprocess`\
  \ 模块用于以子进程形式执行独立的程序，但对执行环境（包括 I/O 处理、终止等）进行控制。该模块有两种常见的用途。\n\n\n\n\n如果你想运行一个独立的程序并一次性收集所有的输出，请使用\
  \ `check_output()`。例如：\n\n点击此处查看代码图像\n\n```python\nimport subprocess\n\n# 运行 'netstat\
  \ -a' 命令并收集其输出\n\ntry:\n    out = subprocess.check_output(['netstat', '-a'])\nexcept\
  \ subprocess.CalledProcessError as e:\n    print(\"It failed:\", e)\n```\n\n`check_output()`\
  \ 返回的数据以 `bytes`（字节）的形式呈现。如果你想将其转换为文本，请确保应用了正确的解码：\n\n点击此处查看代码图像\n\n```python\n\
  text = out.decode('utf-8')\n```\n\n还可以设置管道（pipe）并以更详细的方式与子进程进行交互。要做到这一点，可以这样使用 `Popen`\
  \ 类：\n\n点击此处查看代码图像\n\n```python\nimport subprocess\n\np = subprocess.Popen(['wc'],\n\
  \                     stdin=subprocess.PIPE,\n                     stdout=subprocess.PIPE)\n\
  \n# 向子进程发送数据\np.stdin.write(b'hello world\\nthis is a test\\n')\np.stdin.close()\n\
  \n# 读取数据\nout = p.stdout.read()\nprint(out)\n```\n\n`Popen` 的实例 `p` 拥有 `stdin` 和\
  \ `stdout` 属性，可与子进程进行通信。\n\n### 9.15.23 `tempfile` 模块\n\n`tempfile` 模块提供了创建临时文件和目录的支持。这里创建一个临时文件的示例：\n\
  \n点击此处查看代码图像\n\n```python\nimport tempfile\n\nwith tempfile.TemporaryFile() as f:\n\
  \    f.write(b'Hello World')\n    f.seek(0)\n    data = f.read()\n    print('Got:',\
  \ data)\n```\n\n默认情况下，临时文件以二进制模式打开并允许读取和写入。`with` 语句也常用于定义文件使用的范围。文件在 `with` 块结束时会被删除。\n\
  \n如果你想创建一个临时目录，请使用以下代码：\n\n点击此处查看代码图像\n\n```python\nwith tempfile.TemporaryDirectory()\
  \ as dirname:\n    # 使用目录 dirname\n    ...\n```\n\n与文件一样，目录及其所有内容会在 `with` 块结束时被删除。\n\
  \n### 9.15.24 `textwrap` 模块\n\n`textwrap` 模块可用于格式化文本以适应特定的终端宽度。它可能用途比较特殊，但在制作报告时清理输出文本时有时非常有用。这里有两个值得关注的函数。\n\
  \n`wrap()` 接收文本并将其折行以适应指定的列宽。该函数返回一个字符串列表。例如：\n\n点击此处查看代码图像\n\n```python\nimport\
  \ textwrap\n\ntext = \"\"\"look into my eyes\n\nlook into my eyes\n\nthe eyes the\
  \ eyes the eyes\n\nnot around the eyes\n\ndon't look around the eyes\n\nlook into\
  \ my eyes you're under\n\n\"\"\"\n\nwrapped = textwrap.wrap(text, width=81)\nprint('\\\
  n'.join(wrapped))\n\n# 输出结果：\n# look into my eyes look into my eyes the\n# eyes\
  \ the eyes the eyes not around the\n# eyes don't look around the eyes look\n# into\
  \ my eyes you're under\n```\n\n`indent()` 函数可以用于缩进一个文本块。例如：\n\n点击此处查看代码图像\n\n```python\n\
  print(textwrap.indent(text, '    '))\n\n# 输出结果：\n#    look into my eyes\n#    look\
  \ into my eyes\n#    the eyes the eyes the eyes\n#    not around the eyes\n#   \
  \ don't look around the eyes\n#    look into my eyes you're under\n```\n\n### 9.15.25\
  \ `threading` 模块\n\n`threading` 模块用于并发执行代码。这个问题在网络程序的 I/O 处理中很常见。线程编程是一个大课题，但以下示例阐明了解决常见问题的方案。\n\
  \n这里有一个启动线程并等待其完成的示例：\n\n点击此处查看代码图像\n\n```python\nimport threading\nimport time\n\
  \ndef countdown(n):\n    while n > 0:\n        print('T-minus', n)\n        n -=\
  \ 1\n        time.sleep(1)\n\nt = threading.Thread(target=countdown, args=[10])\n\
  t.start()\nt.join()      # 等待线程完成\n```\n\n如果你永远不需要等待线程完成，可以通过提供额外的 `daemon` 标志来将其设置为守护线程（daemonic）：\n\
  \n点击此处查看代码图像\n\n```python\nt = threading.Thread(target=countdown, args=[10], daemon=True)\n\
  ```\n\n如果你想让一个线程终止，需要使用 `Event` 进行通信。如果线程要修改共享数据，请用 `Lock` 保护它：\n\n点击此处查看代码图像\n\n\
  ```python\nimport threading\nimport time\n\nclass Counter:\n    def __init__(self):\n\
  \        self.value = 0\n        self.lock = threading.Lock()\n\n    def increment(self):\n\
  \        with self.lock:\n            self.value += 1\n\n    def decrement(self):\n\
  \        with self.lock:\n            self.value -= 1\n\nmust_stop = False\ndef\
  \ countdown(n):\n    while n > 0 and not must_stop:\n        print('T-minus', n)\n\
  \        n -= 1\n        time.sleep(1)\n\nevt = threading.Event()\ndef step1(evt):\n\
  \    print('Step 1')\n    time.sleep(5)\n    evt.set()\n\ndef consumer(q):\n   \
  \ while True:\n        item = q.get()\n        if item is None:\n            break\n\
  \        print('Consuming:', item)\n    print('Done')\n\nq = queue.Queue()\ndef\
  \ producer(q):\n    for i in range(10):\n        print('Producing:', i)\n      \
  \  q.put(i)\n        time.sleep(1)\n    q.put(None)\n```\n*(注：由于提供的原文文本中后部分似乎存在逻辑错位或重复的半翻译片段，上述翻译基于您提供的特定文本块进行了格式对齐和翻译。)*\n\
  \n### 9.15.26 `time` 模块\n\n`time` 模块用于访问系统时间相关函数。以下选定的函数最有用：\n\n```python\nsleep(seconds)\n\
  ```\n\n让 Python 睡眠指定的秒数（浮点数给出）。\n\n```python\ntime()\n```\n\n以浮点数返回当前系统时间。这是自纪元（Unix\
  \ 系统通常为 1970 年 1 月 1 日）的秒数。使用 `localtime()` 将其转换为数据结构。\n\n```\nlocaltime([secs])\n\
  ```\n\n返回代表本地时间的 `struct_time` 对象，或由传入的浮点值 `secs` 表示的时间。结果结构具有 `tm_year`、`tm_mon`、`tm_mday`、`tm_hour`、`tm_min`、`tm_sec`、`tm_wday`、`tm_yday`\
  \ 和 `tm_isdst` 属性。\n\n```\ngmtime([secs])\n```\n\n与 `localtime()` 相同，但结果结构代表 UTC\
  \ 时间（格林治标准时间）。\n\n```\nctime([secs])\n```\n\n将以秒表示的时间转换为适用于打印的字符串。适用于调试和日志记录。\n\n\
  ```\nasctime(tm)\n```\n\n将由 `localtime()` 表示的时间结构转换为适用于打印的字符串。\n\n`datetime` 模块更通用地用于表示日期和时间，以便执行日期相关的计算并处理时区。\n\
  \n### 9.15.27 `urllib` 包\n\n`urllib` 包用于构建客户端的 HTTP 请求。可能最有用的函数是 `urllib.request.urlopen()`，它可以用于获取简单的网页。例如：\n\
  \n点击此处查看代码图像\n\n\n\n\n```python\n>>> from urllib.request import urlopen\n\n>>> u\
  \ = urlopen('http://www.python.org')\n\n>>> data = u.read()\n\n>>>\n```\n\n如果你想对表单参数进行编码，可以使用所示的\
  \ `urllib.parse.urlencode()`：\n\n点击查看代码图像\n\n```python\nfrom urllib.parse import\
  \ urlencode\nfrom urllib.request import urlopen\n\nform = {\n   'name': 'Mary A.\
  \ Python',\n   'email': 'mary123@python.org'\n}\ndata = urlencode(form)\nu = urlopen('http://httpbin.org/post',\
  \ data.encode('utf-8'))\nresponse = u.read()\n```\n\n`urlopen()` 函数对于涉及 HTTP 或 HTTPS\
  \ 的基础网页和 API 非常良好。然而，如果访问还涉及 cookie、高级身份验证方案和其他层，使用它就会变得非常笨拙。坦率地说，大多数 Python 程序员会使用如\
  \ `requests` 或 `httpx` 等第三方库来处理这些情况。你也应该这样做。\n\n`urllib.parse` 子包包含用于操作 URL 身的其他函数。例如，可以使用\
  \ `urlparse()` 函数来拆解 URL：\n\n点击查看代码图像\n\n```python\n>>> url = 'http://httpbin.org/get?name=Dave&n=42'\n\
  >>> from urllib.parse import urlparse\n>>> urlparse(url)\n\nParseResult(scheme='http',\
  \ netloc='httpbin.org', path='/get', params='',\nquery='name=Dave&n=42', fragment='')\n\
  >>> \n```\n\n## 9.15.28 `unicodedata` \n\n`unicodedata` 模块用于涉及 Unicode 文本字符串的高级操作。同一个\
  \ Unicode 文本通常有多种表示形式。例如，字符 U+00F1 (ñ) 可能是完全组合的单个字符 U+00F1，也可以分解为多字符序列 U+006e U+0303\
  \ (n, ~)。对于那些期望视觉上渲染相同的文本字符串在表示上实际上也相同的程序，这可能会导致奇怪的问题。考虑下面这个涉及字典键的示例：\n\n点击查看代码图像\n\
  \n```python\n>>> d = {}\n>>> d['Jalape\\xf1o'] = 'spicy'\n>>> d['Jalapen\\u0303o']\
  \ = 'mild'\n>>> d\n\n{'jalapeño': 'spicy', 'jalapeño': 'mild' }\n>>>\n```\n\n乍一看，这似乎应该是一个操作错误——字典怎么会有两个相同但独立的键呢？答案在于这些键由不同的\
  \ Unicode 字符序列组成。\n\n如果对渲染相同的 Unicode 字符串进行一致处理是一个问题，则应该对它们进行归一化。可以使用 `unicodedata.normalize()`\
  \ 函数来确保一致的字符表示。例如，`unicodedata.normalize('NFC', s)` 将确保 `s` 中的所有字符都是完全组合的，而不是表示为组合字符序列。使用\
  \ `unicodedata.normalize('NFD', s)` 将确保 `s` 中的所有字符都是完全分解的。\n\n`unicodedata` 模块还有用于测试字符属性的函数，如大小写、数字和空白字符。可以使用\
  \ `unicodedata.category(c)` 函数获取通用字符属性。例如，`unicodedata.category('A')` 返回 `'Lu'`，表示该字符是大写字母。关于这些值的更多信息可以在官方的\
  \ Unicode 字符数据库 [`https://www.unicode.org/ucd`](https://www.unicode.org/ucd) 中找到。\n\
  \n### 9.15.29 `xml` 包\n\n`xml` 包是一个大型模块集合，用于以各种方式处理 XML 数据。然而，如果你的首要目标是读取 XML 文档并从中提取信息，最简单的方法是使用\
  \ `xml.etree` 子包。假设你在文件 `recipe.xml` 中有一个如下的 XML 文档：\n\n点击查看代码图像\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"iso-8859-1\"?>\n<recipe>\n   <title>著名的鳄油酱</title>\n\
  \   <description>西南地区最爱的！</description>\n   <ingredients>\n        <item num=\"\
  4\"> 大鳄果，切碎 </item>\n        <item num=\"1\"> 番茄，切碎 </item>\n        <item num=\"\
  1/2\" units=\"C\"> 白洋葱，切碎 </item>\n        <item num=\"2\" units=\"tbl\"> 鲜榨柠檬汁\
  \ </item>\n        <item num=\"1\"> 墨西哥辣椒，切丁 </item>\n        <item num=\"1\" units=\"\
  tbl\"> 新鲜香香菜，切末 </item>\n        <item num=\"1\" units=\"tbl\"> 大蒜，切末 </item>\n\
  \        <item num=\"3\" units=\"tsp\"> 盐 </item>\n        <item num=\"12\" units=\"\
  bottles\"> 冰啤酒 </item>\n   </ingredients>\n   <directions>\n   将所有配料混合并用手动器搅拌至所需的稠度。\n\
  \   配合冰啤酒享用。\n   </directions>\n</recipe>\n```\n\n以下是如何从中提取特定元素的方法：\n\n点击查看代码图像\n\
  \n```python\nfrom xml.etree.ElementTree import ElementTree\n\ndoc = ElementTree(file=\"\
  recipe.xml\")\ntitle = doc.find('title')\nprint(title.text)\n\n# 另一种方法（获取元素文本）\n\
  print(doc.findtext('description'))\n\n# 遍历多个元素\nfor item in doc.findall('ingredients/item'):\n\
  \    num = item.get('num')\n    units = item.get('units', '')\n    text = item.text.strip()\n\
  \    print(f'{num} {units} {text}')\n```\n\n## 9.16 结语\n\nI/O 是编写任何有用程序的根本部分。由于其流行程度，Python\
  \ 能够处理任何正在使用的数据格式、编码或文档结构。虽然标准库可能不支持，但你几乎能找到某个第三方模块来解决你的问题。\n\n从大局来看，思考应用程序的边界可能会更有用。在程序与现实的外部边界，经常会遇到编码问题。这对于文本数据也是如此。记住文本数据和二进制数据是严格分离的至关重要的。\n\
  \n\n\n\n\n表示布尔值 `True` 和 `False` 的类型。如果用于转换 `x`，当 `x` 使用常规的真值测试评估为真（即非零数字、非空列表等）时，返回\
  \ `True`。否则返回 `False`。如果调用 `bool()` 时未带任何参数，返回的默认值也是 `False`。`bool` 类继承自 `int`，因此布尔值\
  \ `True` 和 `False` 可以在数学计算中作为数值为 `1` 和 `0` 的整数使用。\n\n```\nbreakpoint()\n```\n\n\
  设置手动调试器断点。当遇到时，控制权将转移到 `pdb`（Python 调试器）。\n\n```\nbytearray([x])\n```\n\n一种表示可变字节数组的类型。在创建实例时，`x`\
  \ 可以是 0 到 255 范围内整数的可迭代序列、一个 8 位字符串或字节字面量，或者是一个指定字节数组大小的整数（在这种情况下，每个条目将初始化为 `0`）。\n\
