  \n\n索引\n\n** 前序**\n\n自从我编写 *Python Essential Reference* 以来，已经过去了 20 多年。那时，Python\
  \ 是一门规模小得多的语言，它的标准库中带有一组实用的“电池”（内置功能）。它大部分内容都能装进你的大脑里。《Essential Reference* 反映了那个时代。它是一本小书，你可以随身携带它，在荒岛或秘密地下库里编写一些\
  \ Python 代码。在随后的三次修订中，《Essential Reference* 始终坚持着成为紧凑但完整的语言参考的愿景——因为如果你要在假期期间用 Python\
  \ 写代码，为什么不把所有的用上呢？\n\n今天，在上一版出版十多年后，Python 的世界已经大不相同了。Python 不再是一门小众语言，已成为世界上最流行的编程语言之一。Python\
  \ 程序员还通过高级编辑器、IDE、笔记本、网页等形式拥有触手可及的丰富信息。事实上，当你几乎可能需要的任何参考资料只需敲击几个键就能出现在眼前时，可能就不太需要查阅参考书了。\n\
  \n如果说有什么的话，信息检索的易易性和 Python 宇宙的规模带来了一种不同的挑战。如果你刚开始学习或需要解决一个新问题，知道该从何处入手可能会让你无所从。将各种工具的特性与语言本身区分开来也很困难。这类问题正是本书的初衷所在。\n\
  \n*Python Distilled* 是一本关于 Python 编程的书。它并不试图记录 Python 中所有可能或已经实现的功能。它的重点在于呈现一个现代且经过精选（或提炼）的语言核心。这源于我多年向科学家、工程师和软件专业人士教授\
  \ Python 的经验。\n\n** 致谢**\n\n我想感谢技术评审人员 Shawn Brown、Sophie Tabac 和 Pete Fein，感谢他们的建议。感谢长期编辑\
