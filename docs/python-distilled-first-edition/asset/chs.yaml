  dict([m]) or dict(key1=value1, key2=value2, ...)\n```\n\n表示字典的类型。如果不提供参数，则返回一个空字典。如果\
  \ `m` 是一个映射对象（例如另一个字典），则返回一个具有与 `m` 相同的键和值的新字典。例如，如果 `m` 是一个字典，`dict(m)` 会对其进行浅拷贝。如果\
  \ `m` 不是映射，则它必须支持迭代并产生一系列的 `(key, value)` 对。这些键值对被用于填充字典。`dict()` 也可以通过关键字参数调用，例如，`dict(foo=3,\
  \ bar=7)` 创建字典 `{'foo': 3, 'bar': 7 }`。\n\n表 10.4 显示了字典支持的操作。\n\n| 操作 | 说明 |\n|\
  \ --- | --- |\n| `m | n` | 将 `m` 和 `n` 合并为一个单一字典。 |\n| `len(m)` | 返回 `m` 中项的数量。\
