  \ `StopIteration` 异常。\n\n（注：由于你提供的待翻译文本中存在大量重复的段落（从 `close()` 描述到 `yield` 异常处理，以及\
  \ 6.6 节的开头），我已根据要求对这些重复内容进行了翻译处理，并确保了逻辑的连贯性。）\n\n### 6.6 增强型生成器的应用\n\n增强型生成器是一种奇特的结构。与简单的\
  \ `for` 循环不同，增强型生成器是驱动求值的。回想上下文管理器是由实现以下协议的对象定义的：\n\n点击此处查看代码图片\n\n```python\nclass\
  \ Manager:\n    def __enter__(self):\n        return somevalue\n    def __exit__(self,\
  \ ty, val, tb):\n        if ty:\n            # 异常\n            ...\n           \
  \ # 返回 False\n```\n\n``` `@contextmanager` 生成器中，`yield` 语句语句之前管理器管理器进入时（ ` ` `__()`\
  \ 方法 方法````  语句语句管理器管理器退出（（ ` `exitexit 方法 方法 方法 方法发生发生，， ` ` ``    报告。例如例如：\n\n\
  [代码代码代码图片 0006imagesimages._01110000))```python\n\n context import import\n\n\n\n\
  \n\n\n\nmanager\n\n():\n            (\"\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n         yield 'somevalue'\n    except Exception as e:\n\
  \         print(\"An occurred\", e)\n    finally:\n         print(\"Leaving\")\n\
  ```\n\n在这里，生成器被用来连接上下文管理器的两个部分。在 `@contextmanager` 生成器中，`yield` 语句之前的内容在管理器进入时（\
  \ `__enter__()` 方法）执行。`yield` 之后的内容在管理器退出时（ `__exit__()` 方法）执行。如果发生了错误，它将作为 `yield`\
  \ 语句上的异常进行报告。\n\n增强型生成器的应用\n\n增强型生成器是一种奇特的结构。与简单的 `for` 循环不同，增强型生成器是驱动求值的。回想上下文管理器是由实现以下协议定义的：\n\
  \n[点击此处查看代码图片\n\n```python\nclass Manager:\n    def __enter__(self):\n        return\
  \ somevalue\n    def __exit__(self, ty, val, tb):\n        if ty:\n            #\
  \ 异常\n            ...\n            # 返回 False\n```\n\n``` `@contextmanager` 生成器中，`yield`\
  \ 语句之前的内容在管理器进入时（ `__enter__()` 方法）执行。`yield` 之后的内容在管理器退出时（ `__exit__()` 方法）执行。如果发生了错误，它将作为\
  \ `yield` 语句上的异常进行报告。\n\n（注：由于原文中存在大量文本重复，上述译文已对核心内容进行了去重和结构化翻译。）\n\n\n\n\n\n扩展生成器的另一个应用是使用函数来封装“工作”任务。函数调用的核心特征之一是它建立了一个局部变量的环境。对这些变量的访问经过了高度优化——比访问类和实例的属性快得多。由于生成器在显式关闭或销毁之前一直保持存，可以使用生成器来设置一个长持续任务。这是一个接收字节片段并将它们组成行的生成器示例：\n\
  \n点击此处查看代码图像\n\n```python\n@consumer\n\ndef line_receiver():\n    data = bytearray()\n\
  \    line = None\n    linecount = 0\n    while True:\n        part = yield line\n\
  \        linecount += part.count(b'\\n')\n        data.extend(part)\n        if\
  \ linecount > 0:\n            index = data.index(b'\\n')\n            line = bytes(data[:index+1])\n\
  \            data = data[index+1:]\n            linecount -= 1\n        else:\n\
  \            line = None\n```\n\n在这个示例中，生成器接收字节片段并将其收集到一个字节数组中。如果数组包含换行符，则提取并返回该行。否则，返回\
  \ `None`。这里有一个说明其工作原理的示例：\n\n点击此处查看代码图像\n\n```python\n>>> r = line_receiver()\n\
  >>> r.send(b'hello')\n>>> r.send(b'world\\nit ')\nb'hello world\\n'\n\n>>> r.send(b'works!')\n\
  >>> r.send(b'\\n')\nb'it works!\\n''\n>>>\n\n```\n\n类似的代码可以写成如下所示所示：\n\n点击此处查看代码图像\n\
  \n```python\nclass LineReceiver:\n    def __init__(self):\n        self.data = bytearray()\n\
  \        self.linecount = 0\n    def send(self, part):\n        self.linecount +=\
  \ part.count(b'\\n')\n        self.data.extend(part)\n        if self.linecount\
  \ > 0:\n            index = self.data.index(b'\\n')\n            line = bytes(self.data[:index+1])\n\
  \            self.data = self.data[index+1:]\n            self.linecount -= 1\n\
  \            return line\n        else:\n            return None\n```\n\n虽然写类可能更熟悉，但代码更复杂且运行速度较慢。在作者的机器上测试过，向接收器输入大量块数据，使用生成器比使用此类代码快约\
  \ 40–50%。这些节省大部分归功于消除了实例属性查找——局部变量速度更快。\n\n尽管还有许多其他潜在应用，但需要记住的一点是，如果你在不涉及迭代的上下文中看到\
  \ `yield`，它可能正在使用诸如 `send()` 或 `throw()` 等增强功能。\n\n### 6.7 生成器与通往等待的桥梁\n\n生成器函数的经典用法是在与异步\
  \ I/O 相关的库中，例如标准库 `asyncio` 模块。然而，从 Python 3.5 开始，许多功能已移动到与 `async` 函数和 `await`\
  \ 语句相关的不同语言特性（参见第 5 章的最后部分）。\n\n`await` 语句涉及与伪装的生成器进行交互。这里是一个说明 `await` 所用底层协议的示例：\n\
  \n点击此处查看代码图像\n\n```python\nclass Awaitable:\n    def __await__(self):\n        print('About\
  \ to await')\n        yield    # 必须是一个生成器\n        print('Resuming')\n\n# 与 \"await\"\
  \ 兼容的函数。返回一个 \"awaitable\"\ndef function():\n    return Awaitable()\n\nasync def\
  \ main():\n    await function()\n```\n\n以下是如何使用 `asyncio` 尝试运行代码：\n\n```python\n\
  >>> import asyncio\n>>> asyncio.run(main())\nAbout to await\nResuming\n>>>\n```\n\
  \n了解它的工作原理至关重要吗？可能不需要。所有这些机制通常对用户隐藏。然而，如果你发现自己正在使用异步函数，只需知道内部某处埋着一个生成器函数即可。只要你继续深挖技术债之坑，你最终会发现它的。\n\
  \n### 6.8 结语：生成器的简史与展望\n\n生成器是 Python 最令人有趣的成功案例之一。它们也是关于迭代大故事的一部分。迭代是所有编程任务中最常见的之一。在\
  \ Python 的早期版本中，迭代是通过序列索引和 `__getitem__()` 方法实现的。这后来演变为当前基于 `__iter__()` 和 `__next__()`\
  \ 方法的迭代协议。生成器紧随其后出现，作为一种实现迭代器的更方便的方法。在现代 Python 中，几乎没有理由使用生成器以外的任何方式来实现迭代器。即使是在你自己定义的迭代对象上，`__iter__()`\
  \ 方法本身也是以这种方便的方式实现的。\n\n在 Python 的后期版本中，生成器随着演化出与协程相关的增强功能——`send()` 和 `throw()`\
  \ 方法而承担了新的角色。这些功能不再限于迭代，而是为在其他上下文中使用生成器开启了可能性。最值得注意的是，这形成了许多用于网络编程的所谓“异步”框架的基础。然而，随着异步编程的演进，大部分已转换为使用\
  \ `async`/`await` 语法的特性。因此，在迭代之外看到生成器并不常见。\n\n# 7 类与面向对象编程\n\n类用于创建新类型的对象。本章涵盖了类的细节——但并非面向对象设计的深度参考。本章的整体结构是自上而下的。首先描述类的高级概念和技术。在本章的后续部分，材料将更具技术性并关注实现。\n\
  \n### 7.1 对象\n\nPython 中的几乎所有代码都涉及创建对象的操作。例如，你可以创建一个字符串对象并进行如下操作：\n\n点击此处查看代码图像\n\
  \n```python\n>>> s = \"Hello World\"\n>>> s.upper()\n'HELLO WORLD'\n\n>>> s.replace('Hello',\
  \ 'Hello Cruel')\n'Hello Cruel World'\n\n>>> s.split()\n['Hello', 'World']\n\n>>>\n\
  ```\n\n或者列表对象：\n\n```\n>>> names = ['Paula', 'Thomas']\n>>> names.append('Lewis')\n\
  >>> names\n['Paula', 'Thomas', 'Lewis']\n\n>>> names[1] = 'Tom'\n\n>>>\n```\n\n\
  每个对象的本质特征是通常具有某种状态——字符串的字符、列表的元素等，以及操作该状态的方法。方法通过对象本身调用——就像它们通过点运算符（`.`）附加在对象上的函数一样。\n\
  \n对象始终有一个关联类型。你可以使用 `type()` 查看它：\n\n点击此处查看代码图像\n\n```\n>>> type(names)\n<class\
  \ 'list'>\n\n>>>\n```\n\n一个对象被认为是其类型的实例。例如，`names` 是 `list` 的实例。\n\n### 7.2 `class`\
  \ 语句\n\n使用 `class` 语句定义新对象。类通常由一组构成方法函数组成。这是一个示例：\n\n点击此处查看代码图像\n\n\n\n\n\n```python\n\
  class Account:\n\n    def __init__(self, owner, balance):\n        self.owner =\
  \ owner\n        self.balance = balance\n\n    def __repr__(self):\n        return\
  \ f'Account({self.owner!r}, {self.balance!r})'\n\n    def deposit(self, amount):\n\
  \        self.balance += amount\n\n    def withdraw(self, amount):\n        self.balance\
  \ -= amount\n\n    def inquiry(self):\n        return self.balance\n```\n\n需要注意的是，`class`\
  \ 语句本身并不会创建类的实例。例如，在先前的示例中并没有实际创建任何账户。相反，类仅仅持有了稍后创建实例时可以使用的方法。你可以将其想象成蓝图。\n\n在类内部定义的函数被称为方法（methods）。实例方法（instance\
  \ method）是在类实例上操作的函数，该实例作为第一个参数传递。按照惯例，这个参数被称为 `self`。在前面的示例中，`deposit()`、`withdraw()`\
  \ 和 `inquiry()` 都是实例方法的示例。\n\n类的 `__init__()` 和 `__repr__()` 方法是所谓的“特殊”（`special`）或“魔术”（`magic`）方法的示例。这些方法对解释器运行时具有特殊含义。`__init__()`\
  \ 方法用于创建新实例时初始化状态。`__repr__()` 方法返回一个用于查看对象的字符串。定义这个方法是可选的，但这样做可以简化调试，并更容易从交互式提示符中查看对象。\n\
  \n类定义可以可选地包含文档字符串（documentation string）和类型提示（type hints）。例如：\n\n点击此处查看代码图片\n\n```python\n\
  class Account:\n\n    '''\n    一个简单的银行账户\n    '''\n    owner: str\n    balance:\
  \ float\n\n    def __init__(self, owner:str, balance:float):\n        self.owner\
  \ = owner\n        self.balance = balance\n\n    def __repr__(self):\n        return\
  \ f'Account({self.owner!r}, {self.balance!r})'\n\n    def deposit(self, amount:float):\n\
  \        self.balance += amount\n\n    def withdraw(self, amount:float):\n     \
  \   self.balance -= amount\n\n    def inquiry(self) -> float:\n        return self.balance\n\
  ```\n\n类型提示不会改变类工作方式的任何方面——也就是说，它们没有引入任何额外的检查或验证。它们纯粹是元数据，对第三方工具或 IDE 可能有用，或者被某些高级编程技术使用。它们在后续大部分示例中并不被使用。\n\
  \n### 7.3 实例 (Instances)\n\n类的实例是通过将类对象作为函数调用来创建的。这会创建一个新实例，然后将其传递给 `__init__()`\
  \ 方法。`__init__()` 的参数由新创建的实例 `self` 以及调用类对象时提供的参数组成。例如：\n\n点击此处查看代码图片\n\n```python\n\
  # 创建几个账户\na = Account('Guido', 1000.0)\n\n# 调用 Account.__init__(a, 'Guido', 1000.0)\n\
  b = Account('Eva', 10.0)\n\n# 调用 Account.__init__(b, 'Eva', 10.0)\n```\n\n在 `__init__()`\
  \ 内部，属性通过赋值给 `self` 被保存到实例上。例如，`self.owner = owner` 就是在实例上保存一个属性。一旦新创建的实例返回，这些属性以及类的方法就可以通过点（`.`）运算符来访问：\n\
  \n点击此处查看代码图片\n\n```python\na.deposit(100.0)        # 调用 Account.deposit(a, 100.0)\n\
  b.withdraw(50.00)       # 调用 Account.withdraw(b, 50.0)\nowner = a.owner        \
  \ # 获取账户所有者\n```\n\n需要强调的是，每个实例都有自己的状态。你可以使用 `vars()` 函数查看实例变量。例如：\n\n点击此处查看代码图片\n\
  \n```python\n>>> a = Account('Guido', 1000.0)\n>>> b = Account('Eva', 10.0)\n>>>\
  \ vars(a)\n{'owner': 'Guido', 'balance': 1000.0}\n>>> vars(b)\n{'owner': 'Eva',\
  \ 'balance': 10.0}\n>>>\n```\n\n注意，方法并没有出现在这里。方法是在类中找到。每个实例都通过其关联类型保留与其类的链接。例如：\n\
  \n点击此处查看代码图片\n\n```python\n>>> type(a)\n<class 'Account'>\n>>> type(b)\n<class 'Account'>\n\
  >>> type(a).deposit\n<function Account.deposit at 0x10a032158>\n>>> type(a).inquiry\n\
  <function Account.inquiry at 0x10a032268>\n>>>\n```\n\n稍后的章节将讨论属性绑定的实现细节以及实例与类之间的关系。\n\
  \n### 7.4 属性访问 (Attribute Access)\n\n在实例上可以执行的基本操作只有三种：获取（getting）、设置（setting）和删除（deleting）属性。例如：\n\
  \n点击此处查看代码图片\n\n```python\na.deposit(100.0)        # 调用 Account.deposit(a, 100.0)\n\
  b.withdraw(50.00)       # 调用 Account.withdraw(b, 50.0)\nowner = a.owner        \
  \ # 获取账户所有者\n```\n\n重要的是，每个实例都有自己的状态。你可以使用 `vars()` 函数查看实例变量。例如：\n\n点击此处查看代码图片\n\
  \n```python\n>>> a = Account('Guido', 1000.0)\n>>> b = Account('Eva', 10.0)\n>>>\
  \ vars(a)\n{'owner': 'Guido', 'balance': 1000.0}\n>>> vars(b)\n{'owner': 'Eva',\
  \ 'balance': 10.0}\n>>>\n```\n\n注意，方法并没有出现在这里。方法是在类中找到。每个实例都通过其关联类型保留与其类的链接。例如：\n\
  \n点击此处查看代码图片\n\n```python\n>>> type(a)\n<class 'Account'>\n>>> type(b)\n<class 'Account'>\n\
  >>> type(a).deposit\n<function Account.deposit at 0x10a032158>\n>>> type(a).inquiry\n\
  <function Account.inquiry at 0x10a032268>\n>>>\n```\n\n稍后的章节将讨论属性绑定的实现细节以及实例与类之间的关系。\n\
  \n在实例上可以执行的基本操作只有三种：获取、设置和删除属性。例如：\n\n点击此处查看代码图片\n\n```python\na.deposit(100.0)\
  \        # 调用 Account.deposit(a, 100.0)\nb.withdraw(50.00)       # 调用 Account.withdraw(b,\
  \ 50.0)\nowner = a.owner         # 获取账户所有者\n```\n\n虽然类定义了一个孤立的方法命名空间，但该命名空间并不作为方法内部解析解析名称的作用域。因此，当你实现类时，对属性和方法的引用必须是完全限定的。例如，在方法中始终通过\
  \ `self` 引用实例的属性。因此，你使用 `self.balance` 而不是 `balance`。这也适用于你想从另一个方法调用方法的情况。例如，假设你想通过存入负数来实现\
  \ `withdraw()`：\n\n点击此处查看代码图片\n\n\n\n\n\n```python\nclass Account:\n    def __init__(self,\
  \ owner, balance):\n        self.owner = owner\n        self.balance = balance\n\
  \n    def __repr__(self):\n        return f'Account({self.owner!r}, {self.balance!r})'\n\
  \n    def deposit(self, amount):\n        self.balance += amount\n\n    def withdraw(self,\
  \ amount):\n        self.deposit(-amount)    # Must use self.deposit()\n\n    def\
  \ inquiry(self):\n        return self.balance\n```\n\n缺乏类级作用域是 Python 不同于 `C++`\
  \ 或 Java 的地方之一。如果你用过这些语言，Python 中的 `self` 参数就相当于所谓的“this”指针，区别在于在 Python 中你必须显式地使用它。\n\
  \n### 7.6 运算符重载与协议\n\n在第 4 章中，我们讨论了 Python 的数据模型。特别关注了实现 Python 运算符和协议的特殊方法。例如，`len(obj)`\
  \ 函数会调用 `obj.__len__()`，而 `obj[n]` 会调用 `obj.__getitem__(n)`。\n\n在定义新类时，定义其中一些方法是很常见的。`Account`\
  \ 类中的 `__repr__()` 方法就是为了改进调试输出的此类方法。如果你正在创建一个更复杂的对象（例如自定义容器），你可能会定义更多此类方法。例如，假设你想创建一个账户组合：\n\
  \n点击此处查看代码图片\n\n```python\nclass AccountPortfolio:\n    def __init__(self):\n  \
  \      self.accounts = []\n\n    def add_account(self, account):\n        self.accounts.append(account)\n\
  \n    def total_funds(self):\n        return sum(account.inquiry() for account in\
  \ self.accounts)\n\n    def __len__(self):\n        return len(self.accounts)\n\n\
  \    def __getitem__(self, index):\n        return self.accounts[index]\n\n    def\
  \ __iter__(self):\n        return iter(self.accounts)\n\n# Example\nport = AccountPortfolio()\n\
  port.add_account(Account('Guido', 1000.0))\nport.add_account(Account('Eva', 50.0))\n\
  print(port.total_funds())    # -> 1050.0\nlen(port)                    # -> 2\n\n\
  # Print the accounts\nfor account in port:\n    print(account)\n\n# Access an individual\
  \ account by index\nport[1].inquiry()            # -> 50.0\n```\n\n最后出现的特殊方法（如 `__len__()`、`__getitem__()`\
  \ 和 `__iter__()`）让 `AccountPortfolio` 能够支持索引和迭代等 Python 运算符。\n\n有时你会听到“Pythonic”（Python\
  \ 风格）这个词，比如“这段代码是 Pythonic 的”。这个词是非正式的，但它通常指的是一个对象是否与 Python 环境的其他部分配合得良好。这意味着在合理的范围内，支持\
  \ Python 的核心特性，如迭代、索引和其他操作。你几乎总是通过让你的类实现第 4 章中描述的预定义特殊方法来实现这一点。\n\n### 7.7 继承\n\n\
  继承是一种创建新类的机制，用于特化或修改现有类的行为。原始类被称为基类、超类或父类。新类被称为派生类、子类或子类型。当类通过继承创建时，它会继承其基类定义的属性。然而，派生类可以重新定义这些属性中的任何一个并添加自己的新属性。\n\
  \n在 `class` 语句中，通过逗号分隔的基类名列表来指定继承。如果没有指定基类，类将隐式继承自 `object`。`object` 是所有 Python\
  \ 对象的根，是一个类；它提供了某些常用方法（如 `__str__()` 和 `__repr__()`）的默认实现。\n\n继承的用途之一是用新方法来扩展现有类。例如，假设你想为\
  \ `Account` 添加一个 `panic()` 方法，用于提取所有资金。方法如下：\n\n点击此处查看代码图片\n\n```python\nclass MyAcount(Account):\n\
  \    def panic(self):\n        self.withdraw(self.balance)\n\n# Example\na = MyAcount('Guido',\
  \ 1000.0)\na.withdraw(23.0)         # a.balance = 977.0\na.panic()             \
  \   # a.balance = 0\n```\n\n继承也可以用于重新定义已存在的方法。例如，这里有一个 `Account` 的特殊版本，它重新定义了 `inquiry()`\
  \ 方法，周期性地夸大余额，希望那些不注意细节的人会透支账户，并在支付次级住房贷款时产生巨额罚款：\n\n点击此处查看代码图片\n\n```python\nimport\
  \ random\n\nclass EvilAccount(Account):\n    def inquiry(self):\n        if random.randint(0,4)\
  \ == 1:\n           return self.balance * 1.10\n        else:\n           return\
  \ self.balance\n\na = EvilAccount('Guido', 1000.0)\na.deposit(100.0)\n```\n\n添加属性时一个棘手的问题是处理\
  \ `__init__`。在这个例子中，我们定义了 `__init__`的新版本，包含了我们的实例变量。然而，当 `__init__` 被重新定义时，子类有责任使用\
  \ `super()` 来初始化父类。如果你忘记这样做，将会得到一个半初始化的对象，一切都会崩溃。\n\n```python\nclass EvilAccount(Account):\n\
  \    def __init__(self, owner, balance, factor):\n        super().__init__(owner,\
  \ balance)\n        self.factor = factor\n\n    def inquiry(self):\n        if random.randint(0,4)\
  \ == 1:\n           return self.balance * 1.10\n        else:\n           return\
  \ self.balance\n```\n\n继承可能会以微妙的方式破坏代码。考虑 `Account` 类 `__repr__()` 方法：\n\n点击此处查看代码图片\n\
  \n```python\nclass Account:\n    def __init__(self, owner, balance):\n        self.owner\
  \ = owner\n        self.balance = balance\n\n    def __repr__(self):\n        return\
