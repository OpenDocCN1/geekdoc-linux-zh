  \ | 从 `m` 中移除 `m[k]`。 |\n| `k in m` | 如果 `k` 是 `m` 中的键，则返回 `True`。 |\n| `m.clear()`\
  \ | 移除 `m` 中的所有项。 |\n| `m.copy()` | 创建 `m` 的浅拷贝。 |\n| `m.fromkeys(s [, value])`\
  \ | 创建一个新字典，其键来自序列 `s`，所有值都设置为 `value`。 |\n| `m.get(k [, v])` | 如果找到则返回 `m[k]`；否则返回\
