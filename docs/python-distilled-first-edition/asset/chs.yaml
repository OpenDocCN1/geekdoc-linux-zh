  \ `s` 中所有索引 `k` 在 `i <= k < j` 范围内的字符。如果省略了其中一个索引，则分别假设为字符串的开头或结尾：\n\n点击此处查看代码图片\n\
  \n```\nc = a[:5]               # c = 'Hello'\nd = a[6:]               # d = 'World'\n\
  e = a[3:8]              # e = 'lo Wo'\nf = a[-5:]              # f = 'World'\n```\n\
  \n字符串有多种方法来处理其内容。例如，`replace()` 方法执行简单的文本替换：\n\n点击此处查看代码图片\n\n```\ng = a.replace('Hello',\
  \ 'Hello Cruel')  # f = 'Hello Cruel World'\n```\n\n表 1.6 显示了一些常用的字符串方法。在这里和其他其他地方，方括号括起来参数都是可选的。\n\
  \n| 方法 | 说明 |\n| --- | --- |\n| `s.endswith(prefix [,start [,end]])` | 检查字符串是否以\
  \ `prefix` 结尾。 |\n| `s.find(sub [, start [,end]])` | Find 指定子字符串 `sub` 第一次出现的位置，如果未找到返回\
  \ -1。 |\n| `s.lower()` | 转换为小写。 |\n| `s.replace(old, new [,maxreplace])` | 替换子字符串。\
  \ |\n| `s.split([sep [,maxsplit]])` | 使用 `sep` 作为分隔符分割字符串。`maxsplit` 是最大分割次数。 |\n\
  | `s.startswith(prefix [,start [,end]])` | 检查字符串是否以 `prefix` 开头。 |\n| `s.strip([chrs])`\
  \ | 去除首尾空格或 `chrs` 中提供的字符。 |\n| `s.upper()` | 转换为大写。 |\n\n表 1.6 常用字符串方法\n\n使用加号\
  \ (`+`) 运算符进行字符串拼接：\n\n点击此处查看代码图片\n\n```\ng = a + 'ly'     # g = 'Hello Worldly'\n\
  ```\n\nPython 永远不会隐式地将字符串的内容解释为数值。因此，`+` 总是拼接字符串：\n\n点击此处查看代码图片\n\n```\nx = '37'\n\
  y = '42'\nz = x + y     # z = '3742' (字符串拼接)\n```\n\n要进行数学计算，必须先使用 `int()` 或 `float()`\
  \ 等函数将字符串转换为数值。例如：\n\n点击此处查看代码图片\n\n```\nz = int(x) + int(y)   # z = 79 (整数加法)\n\
  ```\n\n非字符串值可以使用 `str()`、`repr()` 或 `format()` 函数转换为字符串表示形式。这里有一个示例：\n\n点击此处查看代码图片\n\
  \n```\ns = 'The value of x is ' + str(x)\ns = 'The value of x is ' + repr(x)\ns\
  \ = 'The value of x is ' + format(x, '4d')\n```\n\n虽然 `str()` 和 `repr()` 都创建字符串，但它们的输出通常不同。`str()`\
  \ 产生你使用 `print()` 函数时得到的输出，而 `repr()` 创建的字符串是你输入到程序中以精确表示对象的字符串。例如：\n\n点击此处查看代码图片\n\
  \n```\n>>> s = 'hello\\nworld'\n>>> print(str(s))\nhello\nworld\n>>> print(repr(s))\n\
  'hello\\nworld'\n>>>\n```\n\n调试时，使用 `repr(s)` 生成输出，因为它显示了更多关于值及其类型的信息。`format()`\
  \ 函数用于将单个值转换为带有格式的字符串。例如：\n\n点击此处查看代码图片\n\n```\n>>> x = 12.3456\n>>> format(x, '0.2f')\n\
  '12.35'\n>>>\n```\n\n传递给 `format()` 的代码与你在生成格式化输出时使用的 f-string 代码相同。例如，上面的代码可以替换为：\n\
  \n点击此处查看代码图片\n\n```\n>>> f'{x:.2f}'\n'12.35'\n>>>\n```\n\n### 1.7 文件输入输出\n\n以下程序打开文件并逐行按文本字符串读取内容：\n\
  \n点击此处查看代码图片\n\n```\nwith open('data.txt') as file:\n    for line in file:\n   \
  \     print(line)\n```\n\n`open()` 函数返回一个文件对象。`with` 语句声明了一个会自动关闭文件的块。如果不使用 `with`\
  \ 语句，代码看起来如下：\n\n点击此处查看代码图片\n\n```\nfile = open('data.txt')\nfor line in file:\n\
  \    print(line)\nfile.close()\n```\n\n很容易忘记调用 `close()`，所以 `with` 语句更好。`for` 循环逐行遍历文件直到没有更多数据。例如：\n\
  \n点击此处查看代码图片\n\n```python\nwith open('data.txt') as file:\n    for line in file:\n\
  \        print(line)\n```\n\n如果你想读取整个文件，请使用 `read()` 方法：\n\n点击此处查看代码图片\n\n```python\n\
  with open('data.txt') as file:\n    data = file.read()\n```\n\n如果你想分块读取大文件，请使用 `read()`\
  \ 方法：\n\n点击此处查看代码图片\n\n```python\nwith open('data.txt') as file:\n    while chunk\
  \ := file.read(1000):\n        print(chunk)\n```\n\n此示例中的 `:=` 运算符将值赋值给变量并返回该值。\n\
  \n点击此处查看代码图片\n\n```python\nwith open('data.txt') as file:\n    while chunk := file.read(1000):\n\
  \        print(chunk)\n```\n\n此外，文件对象支持 `write()` 方法。例如，上一个示例中的 `print()` 函数可以这样写：\n\
  \n```python\nwith open('out.txt', 'w') as out:\n    out.write(f'30d\\n')\n```\n\n\
  默认情况下，文件包含 UTF-8 编码文本。如果你使用的是不同的文本编码，在打开文件时使用额外的 `encoding` 参数。例如：\n\n点击此处查看代码图片\n\
  \n```python\nwith open('data.txt', encoding='latin-1') as file:\n    data = file.read()\n\
  ```\n\n有时你可能想在控制台中交互式读取数据。要这样做，请使用 `input()` 函数。例如：\n\n点击此处查看代码图片\n\n```python\n\
  name = input('Enter your name : ')\nprint('Hello', name)\n```\n\n`input()` 函数返回直到终止换行符的所有输入文本，但不包括换行符。\n\
  \n### 1.8 列表\n\n列表是任意对象的有序集合。通过方括号括起值来创建列表：\n\n点击此处查看代码图片\n\n```python\nnames =\
  \ [ 'Dave', 'Paula', 'Thomas', 'Lewis' ]\n```\n\n列表通过整数索引，从零开始。使用索引操作符访问并修改列表的单个项：\n\
  \n点击此处查看代码图片\n\n```python\na = names[2]         # 返回列表的第三个元素，'Thomas'\nnames[2]\
  \ = 'Tom'     # 将第三个元素改为 'Tom'\nprint(names[-1])     # 打印最后一个元素 ('Lewis')\n```\n\
  \n要在列表末尾添加新项，请使用 `append()` 方法：\n\n```python\nnames.append('Alex')\n```\n\n要在列表的特定位置插入项，请使用\
  \ `insert()` 方法：\n\n```python\nnames.insert(2, 'Aya')\n```\n\n\n\n要遍历列表中的项，使用 `for`\
  \ 循环：\n\n```python\nfor name in names:\n    print(name)\n```\n\n你可以使用切片操作提取或重新赋值列表的一部分：\n\
  \n点击此处查看代码图片\n\n```python\nb = names[0:2]      # b -> ['Dave', 'Paula']\n\nc = names[2:]\
  \       # c -> ['Aya', 'Tom', 'Lewis', 'Alex']\n\nnames[1] = 'Becky'  # 将 'Paula'\
  \ 替换为 'Becky'\n\nnames[0:2] = ['Dave', 'Mark', 'Jeff'] # 用 ['Dave','Mark','Jeff']\n\
  \                                      # 前两个项\n```\n\n使用加号 (`+`) 运算符拼接列表：\n\n点击此处查看代码图片\n\
  \n```python\na = ['x','y'] + ['z','z','y']  # 结果为 ['x','y','z','z','y']\n```\n\n\
  空列表可以通过两种方式创建：\n\n点击此处查看代码图片\n\n```python\nnames = []        # 一个空列表\n\nnames =\
  \ list()    # 一个空列表\n```\n\n使用 `[]` 指定空列表更符合习惯。`list` 是与列表类型关联的类名。在将数据转换为列表时，更常见看到使用它。例如：\n\
  \n点击此处查看代码图片\n\n```python\nletters = list('Dave')    # letters = ['D', 'a', 'v',\
  \ 'e']\n```\n\n大多数情况下，列表中的所有项都是相同类型（例如，数字列表或字符串列表）。然而，列表可以包含任何混合的 Python 对象，包括其他列表，如下例所示：\n\
  \n点击此处查看代码图片\n\n```python\na = [1, 'Dave', 3.14, ['Mark', 7, 9, [100, 101]], 10]\n\
  ```\n\n嵌套列表中的项通过应用多次一次索引操作来访问：\n\n点击此处查看代码图片\n\n```python\na[1]             # 返回\
  \ 'Dave'\n\na[3][2]          # 返回 9\n\na[3][3][1]       # 返回 101\n```\n\n以下程序 `pcost.py`\
  \ 展示了如何将数据读入列表并进行简单计算。在这个示例中，假设行包含逗号分隔的值。该程序计算两列乘积之和。\n\n点击此处查看代码图片\n\n```python\n\
  # pcost.py\n# 读取格式为 'NAME,SHARES,PRICE' 的输入行。\n# 例如：\n#    SYM,123,456.78\n\nimport\
  \ sys\n\nif len(sys.argv) != 2:\n    raise SystemExit(f'Usage: {sys.argv[0]} filename')\n\
  \nrows = []\nwith open(sys.argv[1], 'rt') as file:\n    for line in file:\n    \
  \    rows.append(line.split(','))\n\n# rows 是这种形式的列表\n# [\n#   ['SYM', '123', '456.78']\n\
  #   ...\n# ]\ntotal = sum([int(row[1]) * float(row[2]) for row in rows ])\nprint(f'Total\
  \ cost: {total:0.2f}')\n```\n\n程序的第一行使用 `import` 语句从 Python 库中加载 `sys` 模块。该模块用于获取在\
  \ `sys.argv` 中的命令行参数。初始检查确保了提供了文件名。如果没有，则会抛出一个带有帮助信息的 `SystemExit` 异常。程序运行。`open()`\
  \ 函数使用了命令行指定的文件名。`for line in file` 循环逐行读取文件。每行使用逗号作为分隔符分成一个小列表。该列表被添加到 `rows` 中。最终结果\
  \ `rows` 是一个列表列表——记住列表可以包含任何内容。表达式 `[int(row[1]) * float(row[2]) for row in rows]`\
  \ 通过遍历 `rows` 中的所有列表并计算第二、三项的乘积来构建新列表。这种构建列表的实用技术被称为列表推导式。相同的计算可以用更冗长的方式表示：\n\n\
  点击此处查看代码图片\n\n```python\nvalues = []\nfor row in rows:\n    values.append(int(row[1])\
  \ * float(row[2]))\ntotal = sum(values)\n```\n\n作为一般规则，列表推导式是进行简单计算的首选方法。内置函数 `sum()`\
  \ 计算\n\n### 1.9 元组\n\n要遍历列表中的项，使用 `for` 循环：\n\n```python\nfor name in names:\n \
  \   print(name)\n```\n\n你可以使用切片操作提取或重新赋值列表的一部分：\n\n点击此处查看代码图片\n\n```python\nb =\
  \ names[0:2]      # b -> ['Dave', 'Paula']\n\nc = names[2:]       # c -> ['Aya',\
  \ 'Tom', 'Alex']\n\nnames[1] = 'Becky'  # 将 'Paula' 替换为 'Becky'\n\nnames[0:2] =\
  \ ['Dave', 'Mark', 'Jeff'] # 用 ['Dave','Mark','Jeff']\n                        \
  \              # 前两个项\n```\n\n使用加号 (`+`) 运算符拼接列表：\n\n点击此处查看代码图片\n\n```python\na\
  \ = ['x','y'] + ['z','z','y']  # 结果为 ['x','y','z','z','y']\n```\n\n空列表可以通过两种方式创建：\n\
  \n点击此处查看代码图片\n\n```python\nnames = []        # 一个空列表\n\nnames = list()    # 一个空列表\n\
  ```\n\n使用 `[]` 指定空列表更符合习惯。`list` 是与列表类型关联的类名。在将数据转换为列表时，更常见看到使用它。例如：\n\n点击此处查看代码图片\n\
  \n```python\nletters = list('Dave')    # letters = ['D', 'a', 'v', 'e']\n```\n\n\
  大多数情况下，列表中的所有项都是相同类型（例如，数字列表或字符串列表）。然而，列表可以包含任何混合的 Python 对象，包括其他列表，如下例所示：\n\n点击此处查看代码图片\n\
  \n```python\na = [1, 'Dave', 3.14, ['Mark', 7, 9, [100, 101]], 10]\n```\n\n嵌套列表中的项通过应用多次一次索引操作来访问：\n\
  \n点击此处查看代码图片\n\n```python\na[1]             # 返回 'Dave'\n\na[3][2]          # 返回\
  \ 9\n\na[3][3][1]       # 返回 101\n```\n\n以下程序 `pcost.py` 展示了如何将数据读入列表并进行简单计算。在这个示例中，假设行包含逗号分隔的值。该程序计算两列乘积之和。\n\
  \n点击此处查看代码图片\n\n```python\n# pcost.py\n# 读取格式为 'NAME,SHARES,PRICE' 的输入行。\n# 例如：\n\
  #    SYM,123,456.78\n\nimport sys\n\nif len(sys.argv) != 2:\n    raise SystemExit(f'Usage:\
  \ {sys.argv[0]} filename')\n\nrows = []\nwith open(sys.argv[1], 'rt') as file:\n\
  \    for line in file:\n        rows.append(line.split(','))\n\n# rows 是这种形式的列表\n\
  # [\n#   ['SYM', '123', '456.78']\n#   ...\n# ]\ntotal = sum([int(row[1]) * float(row[2])\
  \ for row in rows ])\nprint(f'Total cost: {total:0.2f}')\n```\n\n\n\n与列表和元组不同，集合是无序的，不能通过数字进行索引。此外，集合中的元素永远不会重复。例如，如果你检查前面代码中\
  \ `names2` 的值，将得到以下结果：\n\n点击此处查看代码图像\n\n```\n>>> names2\n\n{'CAT', 'IBM', 'MSFT',\
  \ 'HPE'}\n\n>>>\n```\n\n注意，'IBM' 只出现了一次。此外，项目的顺序是不可预测的；输出可能与显示的有所不同。在同一台计算机上运行解释器时，顺序可能会发生变化。\n\
  \n如果处理现有数据，你还可以使用集合推导式来创建一个集合。例如，该语句将前一节数据中的所有股票名称转换为一个集合：\n\n点击此处查看代码图像\n\n```\n\
  names = { s[0] for s in portfolio }\n```\n\n要创建一个空集合，请使用不带参数的 `set()`：\n\n点击此处查看代码图像\n\
  \n```\nr = set()    # 初始化空集合\n```\n\n集合支持标准的集合操作，包括并集、交集、差集和对称差集。这里有一个示例：\n\n点击此处查看代码图像\n\
  \n```\na = t | s      # 并集 {'MSFT', 'CAT', 'HPE', 'AA', 'IBM'}\n\nb = t & s    \
  \  # 交集 {'IBM', 'MSFT'}\n\nc = t - s      # 差集 { 'CAT', 'HPE' }\n\nd = s - t   \
  \   # 差集 { 'AA' }\n\ne = t ^ s      # 对称差集 {'CAT', 'HPE', 'AA' }\n```\n\n差集操作 `s\
  \ - t` 返回 `s` 中不在 `t` 中的项。对称差集 `s ^ t` 返回在 `s` 或 `t` 中但不在两者交中的项。\n\n可以使用 `add()`\
  \ 或 `update()` 向集合添加新项：\n\n点击此处查看代码图像\n\n```\nt.add('DIS')                   # 添加单个项\n\
  \ns.update({'JJ', 'GE', 'ACME'}) # 向 s 添加多个项\n```\n\n可以使用 `remove()` 或 `discard()`\
  \ 项：\n\n点击此处查看代码图像\n\n```\nt.remove('IBM')    # 移除 'IBM'，如果不存在抛出 KeyError。\n\ns.discard('SCOX')\
  \  # 如果 'SCOX' 存在则移除。\n```\n\n`remove()` 和 `discard()` 的区别在于，如果项不存在，`discard()`\
  \ 不抛出异常。\n\n### 1.11 字典\n\n字典是键和值之间的映射。你通过将键值对（每个对之间用冒号分隔）包含在大括号 (`{ }`) 中来创建字典，如下：\n\
  \n点击此处查看代码图像\n\n```\ns = {\n\n     'name' : 'GOOG',\n\n     'shares' : 100,\n\n\
  \     'price' : 490.10\n\n    }\n```\n\n要访问字典的成员，按如下方式使用索引运算符：\n\n点击此处查看代码图像\n\n\
  ```\nname = s['name']\n\ncost = s['shares'] * s['price']\n```\n\n插入或修改对象的方法如下：\n\
  \n```\ns['shares'] = 75\n\ns['date'] = '2007-06-07'\n```\n\n字典是定义包含命名字段对象的有用方法。然而，字典也常用作映射，对无序数据进行快速查找。例如，这里有一个股票价格字典：\n\
  \n```\nprices = {\n\n    'GOOG' : 490.1,\n\n    'AAPL' : 123.5,\n\n    'IBM' : 91.5,\n\
  \n    'MSFT' : 52.13\n}\n```\n\n给定这样一个字典，你可以查找价格：\n\n```\np = prices['IBM']\n```\n\
  \n使用 `in` 运算符测试字典的成员性：\n\n```python\nif 'IBM' in prices:\n    p = prices['IBM']\n\
  \nelse:\n    p = 0.0\n```\n\n这一特定的步骤序列也可以使用 `get()` 方法更紧凑地完成：\n\n点击此处查看代码图像\n\n\
  ```\np = prices.get('IBM', 0.0)    # 如果 prices['IBM'] 存在则返回，否则返回 0.0\n```\n\n使用\
  \ `del` 语句删除字典的元素：\n\n```\ndel prices['GOOG']\n```\n\n虽然字符串是最常见的键类型，但你可以使用许多其他 Python\
  \ 对象，包括数字和元组。例如，元组常被用于构建复合键或多部分键：\n\n点击此处查看代码图像\n\n```\nprices = { }\n\nprices[('IBM',\
  \ '2015-02-03')] = 91.23\n\nprices['IBM', '2015-02-04'] = 91.42     # 省略了括号\n```\n\
  \n任何类型的对象都可以放入字典中，包括其他字典。然而，可变数据结构如列表、集合和字典不能作为键。\n\n字典通常用作各种算法和数据处理问题的构建块。其中一个问题是计数（tabulation）。例如，以下是计算早期数据中每种股票名称的总股数：\n\
  \n点击此处查看代码图像\n\n```\nportfolio = [\n   ('ACME', 50, 92.34),\n   ('IBM', 75, 102.25),\n\
  \   ('PHP', 40, 74.50),\n   ('IBM', 50, 124.75)\n]\n\ntotal_shares = { s[0]: 0 for\
  \ s in portfolio }\n```\n\n\n\n\n```python\nfor sym, price in prices.items():\n\
  \    print(f'{sym} = {price}')\n```\n\n### 1.12 迭代与循环\n\n最广泛使用的循环结构是 `for` 语句，它用于对项目集合进行迭代。一种常见的迭代形式是遍历序列中的所有成员——例如字符串、`list`\
  \ 或 `tuple`。这里有一个示例：\n\n点击此处查看代码图像\n\n```python\nfor n in [1, 2, 3, 4, 5, 6, 7,\
  \ 8, 9]:\n    print(f'2 to the {n} power is {2**n}')\n```\n\n在这个示例中，变量 `n` 在每次迭代时会被赋值为列表\
  \ `[1, 2, 3, 4, ..., 9]` 中的连续项。由于遍历整数范围非常常见，因此提供了一个快捷方法：\n\n点击此处查看代码图像\n\n```python\n\
  for n in range(1, 10):\n    print(f'2 to the {n} power is {2**n}')\n```\n\n`range(i,\
  \ j [,step])` 函数创建一个对象，表示一个从 `i` 到但不包含 `j` 的整数范围。如果省略了起始值，则默认为零。还可以作为第三个参数提供可选的步长（stride）。以下是一些示例：\n\
  \n点击此处查看代码图像\n\n```python\na = range(5)         # a = 0, 1, 2, 3, 4\nb = range(1,\
  \ 8)      # b = 1, 2, 3, 4, 5, 6, 7\nc = range(0, 14, 3)  # c = 0, 3, 6, 9, 12\n\
  d = range(8, 1, -1)  # d = 8, 7, 6, 5, 4, 3, 2\n```\n\n`range()` 创建的对象在请求查找时按需计算它所代表的值。因此，即使对于大范围的数字使用它也是高效的。\n\
  \n`for` 语句不仅限于整数序列。它可以用于迭代许多类型的对象，包括字符串、`lists`、`dictionaries` 和文件。这里有一个示例：\n\n\
  点击此处查看代码图像\n\n```python\nmessage = 'Hello World'\n# 打印 message 中的每一个单独字符\nfor c\
  \ in message:\n    print(c)\n\nnames = ['Dave', 'Mark', 'Ann', 'Phil']\n# 打印列表的成员\n\
  for name in names:\n    print(name)\n\nprices = { 'GOOG' : 490.10, 'IBM' : 91.50,\
  \ 'AAPL' : 123.15 }\n# 打印字典的所有成员\nfor key in prices:\n    print(key, '=', prices[key])\n\
  \n# 打印文件中的所有行\nwith open('foo.txt') as file:\n    for line in file:\n        print(line,\
  \ end='')\n```\n\n`for` 循环是 Python 最强大的语言特性之一，因为你可以创建自定义迭代器对象和生成器函数，为它提供值的序列。关于迭代器和生成器的更多细节可以在后面的\
  \ 第 6 章 中找到。\n\n### 1.13 函数\n\n使用 `def` 语句定义函数：\n\n点击此处查看代码图像\n\n```python\ndef\
  \ remainder(a, b):\n    q = a // b       # // 是取整除法\n    r = a - q * b\n    return\
  \ r\n```\n\n要调用函数，使用其名称并后跟括号中的参数，例如 `result = remainder(37, 15)`。\n\n函数的第一条语句包含一个文档字符串（documentation\
  \ string）是一种常见做法。这个字符串为 `help()` 命令提供数据，并可能被 IDE 和其他开发工具用于以辅助程序员。例如：\n\n点击此处查看代码图像\n\
  \n```python\ndef remainder(a, b):\n    '''\n    计算 a 除以 b 的余数\n    '''\n    q =\
  \ a // b\n    r = a - q * b\n    return r\n```\n\n如果函数的输入和输出从其名称中不明确，则可以对它们进行类型注解：\n\
  \n点击此处查看代码图像\n\n```python\ndef remainder(a: int, b: int) -> int:\n    '''\n    计算\
  \ a 除以 b 的余数\n    '''\n    q = a // b\n    r = a - q * b\n    return r\n```\n\n\
  此类注解仅仅是信息性的，在运行时实际上不会被强制执行。人们仍然可以使用非整数值调用上面的函数，例如 `result = remainder(37.5, 3.2)`。\n\
  \n使用元组（tuple）从函数返回多个值：\n\n```python\ndef remainder(a, b):\n    q = a // b\n    r\
  \ = a - q * b\n    return r\n```\n\n当在元组中返回多个值时，可以将它们解包到单独变量中：\n\n```python\ndef\
  \ remainder(a, b):\n    q = a // b\n    r = a - q * b\n    return r\n\nquotient,\
  \ remainder = remainder(37, 15)\n```\n\n如果函数的输入和输出从其名称中不明确，则可以对它们进行类型注解：\n\n```python\n\
  def remainder(a: int, b: int) -> int:\n    '''\n    计算 a 除以 b 的余数\n    '''\n   \
  \ q = a // b\n    r = a - q * b\n    return r\n```\n\n### 1.14 异常\n\n如果程序中发生错误，就会引发异常（exception）并显示回溯信息（traceback）：\n\
  \n点击此处查看代码图像\n\n```\nTraceback (most recent call last):\n  File \"readport.py\"\
  , line 9, in <module>\n    shares = int(row[1])\n\nValueError: invalid literal for\
  \ int() with base 10: 'N/A'\n```\n\n回溯消息指示错误的类型及其位置。通常错误会导致程序终止。但是你可以使用 `try` 和\
  \ `except` 语句来捕获并处理异常，如下：\n\n```python\nportfolio = []\n\nwith open('portfolio.csv')\
  \ as file:\n    for line in file:\n        row = line.split(',')\n        try:\n\
  \            name = row[0]\n            shares = int(row[1])\n            price\
  \ = float(row[2])\n            holding = (name, shares, price)\n            portfolio.append(holding)\n\
  \        except ValueError as err:\n            print('Bad row:', row)\n       \
  \     print('Reason:', err)\n```\n\n在此代码中，如果发生了 `ValueError`，有关错误原因的细节将放入 `err`\
  \ 中并传递到 `except` 块。如果发生了其他类型的异常，程序将照常崩溃。如果没有发生错误，`except` 块中的代码将被忽略。当异常被处理后，程序执行将从最后一个\
  \ `except` 块之后的语句继续。程序不会返回到发生异常的地方。\n\n`raise` 语句用于信号异常。你需要给出异常的名称。例如，这里是抛出内置异常\
  \ `RuntimeError` 的方法：\n\n点击此处查看代码图像\n\n```python\nraise RuntimeError('Computer says\
  \ no')\n```\n\n\n\n\n\n当与异常处理结合用时，妥善管理系统资源（如锁、文件和网络连接）通常比较棘手。有些操作无论发生什么情况都必须执行。为了实现这一点，请使用\
  \ `try`-`finally`。这里有一个涉及必须释放锁以避免死锁的示例：\n\n点击此处查看代码图像\n\n```python\nimport threading\n\
  \nlock = threading.Lock()\n\n...\n\nlock.acquire()\n\n# 如果已获取锁，则必须释放它\n\ntry:\n\
  \    ...\n    statements\n    ...\n\nfinally:\n    lock.release()       # 始终执行\n\
  ```\n\n为了简化此类编程，大多数涉及资源管理的对象也支持 `with` 语句。这是上述代码的修改版本：\n\n```python\nwith lock:\n\
  \    ...\n    statements\n    ...\n```\n\n在这个示例中，当执行 `with` 语句时，`lock` 对象会被自动获取。当执行离开\
  \ `with` 块的上下文范围时，锁会自动释放。无论 `with` 块内部发生了什么，这都会发生。例如，如果发生异常，当控制权离开块上下文时，锁会被释放。\n\
  \n`with` 语句通常只与系统资源或执行环境相关的对象兼容——例如文件、连接和锁。然而，用户定义的对象可以有自己的自定义处理，这在第 3 章 中有详细描述。\n\
  \n## 1.15 程序终止\n\n当输入程序中没有更多可执行的语句，或者当抛出一个未捕获的 `SystemExit` 异常时，程序就会终止。如果你想强制程序退出，可以这样操作：\n\
  \n点击此处查看代码图像\n\n```python\nraise SystemExit()                      # 不带错误信息退出\n\n\
  raise SystemExit(\"Something is wrong\")  # 带有错误退出\n```\n\n在退出时，解释器会尽力对所有活动对象进行垃圾回收。然而，如果你需要执行特定的清理操作（删除文件、关闭连接），可以如下所示通过\
  \ `atexit` 模块进行注册：\n\n点击此处查看代码图像\n\n```python\nimport atexit\n\n# 示例\n\nconnection\
  \ = open_connection(\"deaddot.com\")\n\ndef cleanup():\n    print \"Going away...\"\
  \n    close_connection(connection)\n\natexit.register(cleanup)\n```\n\n## 1.16 对象与类\n\
  \n程序中使用的所有值都是对象。一个对象由内部数据和执行涉及该数据的各种操作的方法组成。在处理如字符串和列表等内置类型时，你已经用过对象和方法了。例如：\n\n\
  点击此处查看代码图像\n\n```python\nitems = [37, 42]      # 创建列表对象\n\nitems.append(73)    \
  \  # 调用 append() 方法\n```\n\n`dir()` 函数列出对象上可用的方法。在没有高级 IDE 的情况下，它是交互式实验非常有用的工具。例如：\n\
  \n点击此处查看代码图像\n\n```python\n>>> items = [37, 42]\n>>> dir(items)\n['__add__', '__class__',\
  \ '__contains__', '__delattr__', '__delitem__',\n...\n 'append', 'count', 'extend',\
  \ 'index', 'insert', 'pop',\n 'remove', 'reverse', 'sort']\n>>>\n```\n\n在检查对象时，你会看到列出的\
  \ `append()` 和 `insert()` 等熟悉的方法。然而，你也会看到名称以双下划线开头和结尾的方法（特殊方法）。这些方法实现了各种运算符。例如，`__add__()`\
  \ 方法用于实现 `+` 运算符。这些方法在后面的章节中会有更详细的解释。\n\n```python\n>>> items.__add__([73, 101])\n\
  [37, 42, 73, 101]\n>>>\n```\n\n`class` 语句用于定义新类型的对象以及面向对象编程。例如，以下类定义了一个具有 `push()`\
  \ 和 `pop()` 操作的栈：\n\n点击此处查看代码图像\n\n```python\nclass Stack:\n    def __init__(self):\
  \          # 初始化栈\n        self._items = [ ]\n\n    def push(self, item):\n    \
  \    self._items.append(item)\n\n    def pop(self):\n        return self._items.pop()\n\
  \n    def __repr__(self):\n        return f'<{type(self).__name__} at 0x{id(self):x},\
  \ size={len(self)}>'\n\n    def __len__(self):\n        return len(self._items)\n\
  ```\n\n在类定义内部，使用 `def` 语句定义方法。每个方法的第一个参数始终引用对象本身。按照约定，`self` 是该参数的名称。所有涉及对象属性的操作必须显式地引用\
  \ `self` 变量。开头和结尾都有双下划线的方法是特殊方法。例如，`__init__` 用于初始化对象。在这种情况下，`__init__` 创建了一个内部列表来存储栈数据。\n\
  \n要使用类，编写如下所示的代码：\n\n点击此处查看代码图像\n\n```python\ns = Stack()\ns.push(1)\ns.push(2)\n\
  s.pop()\n```\n\n\n\n\n\n```\n>>> # 计算 2 + 3 * 4\n\n>>> calc = Calculator()\n\n>>>\
  \ calc.push(2)\n\n>>> calc.push(3)\n\n>>> calc.push(4)\n\n>>> calc.mul()\n\n>>>\
  \ calc.add()\n\n>>> calc.pop()\n\n14\n\n>>>\n```\n\n你可能会看到这段代码，看到 `push()` 和 `pop()`\
  \ 的使用，并认为 `Calculator` 可以通过继承 `Stack` 来定义。虽然这种方法行得通，但将 `Calculator` 定义为一个完全独立的类可能更好：\n\
  \n点击此处查看代码图片\n\n```python\nclass Calculator:\n\n    def __init__(self):\n      \
  \  self._stack = Stack()\n\n    def push(self, item):\n        self._stack.push(item)\n\
  \n    def pop(self):\n        return self._stack.pop()\n\n    def add(self):\n \
  \       self.push(self.pop() + self.pop())\n\n    def mul(self):\n        self.push(self.pop()\
  \ * self.pop())\n\n    def sub(self):\n        right = self.pop()\n        self.push(self.pop()\
  \ - right)\n\n    def div(self):\n        right = self.pop()\n        self.push(self.pop()\
  \ / right)\n```\n\n在这种实现中，`Calculator` 包含一个 `Stack` 作为其内部实现细节。这是组合（composition）的一个示例。`push()`\
  \ 和 `pop()` 方法委托给了内部的 `Stack`。采用这种方法的主要原因是你并不会认为 `Calculator` 是一个 `Stack`。它是一个独立的概念——一种不同的对象类型。类比，你的手机包含一个中央处理器（CPU），但你通常不会认为你的手机是\
  \ CPU 的类型。\n\n### 1.17 模块 (Modules)\n\n随着程序规模的扩大，你将希望把它们拆分成多个文件以便维护。要做到这一点，请使用 `import`\
  \ 语句。要创建一个模块，将相关的语句和定义放入具有 `.py` 后缀的文件中，并保持与模块相同的名称。这是一个示例：\n\n点击此处查看代码图片\n\n```python\n\
  # readport.py\n\n#\n\n# 读取包含 'NAME,SHARES,PRICE' 数据的文件\n\ndef read_portfolio(filename):\n\
  \    portfolio = []\n    with open(filename) as file:\n        for line in file:\n\
  \            row = line.split(',')\n            try:\n                name = row[0]\n\
  \                shares = int(row[1])\n                price = float(row[2])\n \
  \               holding = (name, shares, price)\n                portfolio.append(holding)\n\
  \            except ValueError as err:\n                print('Bad row:', row)\n\
  \                print('Reason:', err)\n    return portfolio\n```\n\n要在其他文件中使用你的模块，请使用\
  \ `import` 语句。例如，这里有一个模块 `pcost.py`，它使用了了上面的 `read_portfolio()` 函数：\n\n点击此处查看代码图片\n\
  \n```python\n# pcost.py\n\nimport readport\n\ndef portfolio_cost(filename):\n  \
  \  '''\n    计算投资组合的总股份数*价格\n    '''\n    port = readport.read_portfolio(filename)\n\
  \    return sum(shares * price for _, shares, price in port)\n```\n\n`import` 语句会创建一个新的命名空间（或环境），并在该命名空间执行关联\
  \ `.py` 文件中的所有语句。要在导入后访问命名空间的内容，请使用模块名称作为前缀，如上一个示例中的 `readport.read_portfolio()`。\n\
  \n如果 `import` 语句因 `ImportError` 异常而失败，你需要检查你环境中的几点。首先，确保你创建了一个名为 `readport.py` 的文件。接下来，检查\
  \ `sys.path` 中列出的目录。如果你的文件没有保存在这些目录之一，Python 将无法找到它。\n\n如果你想以不同的名称导入模块，请为 `import`\
  \ 语句提供一个可选的 `as` 限定符：\n\n点击此处查看代码图片\n\n```python\nimport readport as rp\n\nport\
  \ = rp.read_portfolio('portfolio.dat')\n```\n\n要将特定的定义导入到当前命名空间，请使用 `from` 语句：\n\
  \n点击此处查看代码图片\n\n```python\nfrom readport import read_portfolio\n\nport = read_portfolio('portfolio.dat')\n\
  ```\n\n与对象一样，`dir()` 函数可以列出模块的内容。它是交互式实验的一个非常有用的工具。\n\n点击此处查看代码图片\n\n```python\n\
  >>> import readport\n\n>>> dir(readport)\n\n['__builtins__', '__cached__', '__doc__',\
  \ '__file__', '__loader__',\n  '__name__', '__package__', '__spec__', 'read_portfolio']\n\
  ...\n\n>>>\n```\n\nPython 提供了大量的标准库模块，可以简化某些编程任务。例如，`csv` 模块是处理逗号分隔值文件的标准库。你可以按照如下方式在程序中使用它：\n\
  \n点击此处查看代码图片\n\n```python\nimport csv\n\n# 读取一个包含 'NAME,SHARES,PRICE' 的数据的文件\n\n\
  def read_portfolio(filename):\n    portfolio = []\n    with open(filename) as file:\n\
  \        for line in file:\n            row = line.split(',')\n            try:\n\
