  \ why your program is using more memory than it ought to.\n\n### 4.4 References\
  \ and Copies\n\nWhen a program makes an assignment such as `b = a`, a new reference\
  \ to `a` is created. For immutable objects such as numbers and strings, this assignment\
  \ appears to create a copy of `a` (even though this is not the case). However, the\
  \ behavior appears quite different for mutable objects such as lists and dictionaries.\
  \ Here’s an example:\n\nClick here to view code image\n\n```python\n>>> a = [1,2,3,4]\n\
  \n>>> b = a                 # b is a reference to a\n\n>>> b is a\n\nTrue\n\n>>>\
  \ b[2] = -100           # Change an element in b\n\n>>> a                     #\
  \ Notice how a also changed\n\n[1, 2, -100, 4]\n\n>>>\n```\n\nSince `a` and `b`\
  \ refer to the same object in this example, a change made to one of the variables\
  \ is reflected in the other. To avoid this, you have to create a copy of an object\
  \ rather than a new reference.\n\nTwo types of copy operations are applied to container\
  \ objects such as lists and dictionaries: a shallow copy and a deep copy. A shallow\
  \ copy creates a new object, but populates it with references to the items contained\
  \ in the original object. Here’s an example:\n\nClick here to view code image\n\n\
  ```python\n>>> a = [ 1, 2, [3,4] ]\n\n>>> b = list(a)           # Create a shallow\
  \ copy of a.\n\n>>> b is a\n\nFalse\n\n>>> b.append(100)         # Append element\
  \ to b.\n\n>>> b\n\n[1, 2, [3, 4], 100]\n\n>>> a                     # Notice that\
  \ a is unchanged\n\n[1, 2, [3, 4]]\n\n>>> b[2][0] = -100        # Modify an element\
  \ inside b\n\n>>> b\n\n[1, 2, [-100, 4], 100]\n\n>>> a                     # Notice\
  \ the change inside a\n\n[1, 2, [-100, 4]]\n\n>>>\n\n\n\n在这个示例中，`items` 字典现在包含了一个函数、一个模块、一个异常以及另一个对象的方法。如果你愿意，可以使用\
  \ `items` 上的字典查找来代替原始名称，代码仍然可以运行。例如：\n\n点击此处查看代码图片\n\n```python\n>>> items'func'\
  \         # 执行 abs(-45)\n\n45\n\n>>> items['mod'].sqrt(4)       # 执行 math.sqrt(4)\n\
  \n2.0\n\n>>> try:\n...     x = int('a lot')\n... except items['error'] as e:   #\
  \ 等同于 except ValueError as e\n...     print(\"Couldn't convert\")\n...\n\nCouldn't\
  \ convert\n\n>>> items'append'       # 执行 nums.append(100)\n>>> nums\n\n[1, 2, 3,\
  \ 4, 100]\n\n>>>\n```\n\nPython 中一切皆都是一等对象这一事实，新手往往并不能充分体会。然而，它可以用来编写非常紧凑且灵活的代码。\n\
  \n例如，假设你有一行类似于“ACME,100,490.10”的文本，并且你想将其转换为一个带有适当类型转换的值列表。这里有一种巧妙的方法，通过创建一个类型列表（类型本身是一等对象）并执行一些常见的列表处理操作：\n\
  \n点击此处查看代码图片\n\n```python\n>>> line = 'ACME,100,490.10'\n>>> column_types = [str,\
  \ int, float]\n>>> parts = line.split(',')\n>>> row = [ty(val) for ty, val in zip(column_types,\
  \ parts)]\n>>> row\n\n['ACME', 100, 490.1]\n\n>>>\n```\n\n将函数或类置于字典中是消除复杂的 `if-elif-else`\
  \ 语句的常用技术。例如，如果你有如下代码：\n\n点击此处查看代码图片\n\n```python\nif format == 'text':\n    formatter\
  \ = TextFormatter()\nelif format == 'csv':\n    formatter = CSVFormatter()\nelif\
  \ format == 'html':\n    formatter = HTMLFormatter()\nelse:\n    raise RuntimeError('Bad\
  \ format')\n```\n\n你可以使用字典来重写它：\n\n点击此处查看代码图片\n\n```python\n_formats = {\n   'text':\
  \ TextFormatter,\n   'csv': CSVFormatter,\n   'html': HTMLFormatter\n}\n\nif format\
  \ in _formats:\n   formatter = _formats[format]()\nelse:\n   raise RuntimeError('Bad\
  \ format')\n```\n\n后一种形式更加灵活，因为可以通过向字典插入更多条目来添加新情况，而无需修改大型的 `if-elif-else` 块。\n\n\
  ### 4.7 使用 `None` 处理可选或缺失数据\n\n有时程序需要表示一个可选或缺失的值。`None` 是一个专门为此目的预留的特殊实例。没有显式返回值的函数会返回\
  \ `None`。`None` 也经常被用作可选参数的默认值，以便函数可以检测调用者是否真的为该参数传递了值。`None` 没有属性，且在布尔表达式中求值为 `False`。\n\
  \n在内部，`None` 被作为一个单例存储——也就是说，解释器中只有一个 `None` 值。因此，测试一个值是否为 `None` 的常用方法是像这样使用 `is`\
  \ 运算符：\n\n```python\nif value is None:\n   statements\n   ...\n```\n\n使用 `==` 运算符测试\
  \ `None` 同样有效，但不推荐这种做法，并且可能会被代码检查工具标记为样式错误。\n\n### 4.8 对象协议与数据抽象\n\n大多数 Python 语言特性都是通过*协议*定义的。考虑以下函数：\n\
  \n点击此处查看代码图片\n\n```python\ndef compute_cost(unit_price, num_units):\n    return\
  \ unit_price * num_units\n```\n\n现在，问自己一个问题：允许哪些输入？答案简单得带有骗性——一切都是允许的！乍一看，这个函数似乎适用于数字：\n\
  \n点击此处查看代码图片\n\n```python\n>>> compute_cost(1.25, 50)\n\n62.5\n\n>>>\n```\n\n事实上，它运行如预期。然而，该函数还可以处理更多类型。你可以使用特殊的数字，如分数或小数：\n\
  \n点击此处查看代码图片\n\n```python\n>>> from fractions import Fraction\n>>> compute_cost(Fraction(5,\
  \ 4), 50)\nFraction(125, 2)\n>>> from decimal import Decimal\n>>> compute_cost(Decimal('1.25'),\
  \ Decimal('50'))\nDecimal('62.50')\n\n>>>\n```\n\n不仅如此——该函数还可以处理来自 `numpy` 等包的数组和其他复杂结构。例如：\n\
  \n点击此处查看代码图片\n\n```python\n>>> import numpy as np\n>>> prices = np.array([1.25,\
  \ 50])\n>>> compute_cost(prices[0], prices[1])\n\n62.5\n\n>>>\n```\n\n该函数甚至可能以意意想不到的方式运行：\n\
  \n点击此处查看代码图片\n\n```python\n>>> from fractions import Fraction\n>>> compute_cost(Fraction(5,\
  \ 4), 50)\n\nFraction(125, 2)\n>>> from decimal import Decimal\n>>> compute_cost(Decimal('1.25'),\
  \ Decimal('50'))\nDecimal('62.50')\n\n>>>\n```\n\n然而，某些类型的组合会失败：\n\n点击此处查看代码图片\n\
  \n```python\n>>> import numpy as np\n>>> prices = np.array([1.25, 50])\n>>> compute_cost(prices[0],\
  \ prices[1])\n\nTraceback (most recent call last):\n  File \"<stdin>\", line 1,\
  \ in <module>\nTypeError: unsupported operand(s) for *: 'numpy.float64' and 'decimal.Decimal'\n\
  \n>>>\n```\n\n对象的行为完全取决于它实现的特殊方法。接下来的几节描述了与不同类别相关的特殊方法。这些类别被称为“协议”。对象（包括自定义类）可以定义这些特性的任何组合。\n\
  \n### 4.9 对象协议\n\n表 4.1 中的方法与对象的管理有关。这包含了创建、初始化和表示。\n\n| 方法 | 描述 |\n| --- | ---\
  \ |\n| `__new__(cls [,*args [,**kwargs]])` | 创建新实例的静态方法。 |\n| `__init__(self [,*args\
  \ [,**kwargs]])` | 在实例创建后调用以初始化。 |\n| `__del__(self)` | 在实例销毁时调用。 |\n| `__repr__(self)`\
  \ | 创建字符串表示。 |\n\n表 4.1 对象管理方法\n\n`__new__()` 和 `__init__()` 方法共同使用以创建和初始化实例。当通过\
  \ `SomeClass(args)` 创建对象时，它会被翻译为以下步骤：\n\n点击此处查看代码图片\n\n```python\nx = SomeClass.__new__(SomeClass,\
  \ args)\n\nif isinstance(x, SomeClass):\n    x.__init__(args)\n```\n\n通常，这些步骤在后台自动处理，你不需要担心。类中实现的常见方法是\
  \ `__init__()`。使用 `__new__()` 几乎总是意味着存在与实例创建相关的高级魔法。\n\n\n\n\n### 对象销毁与表示\n\n`__del__()`\
  \ 方法在实例即将被垃圾回收时调用。该方法仅在实例不再被使用时被调用。请注意，`del x` 语句仅减少实例的引用计数，并不一定会导致此函数的调用。除非实例在销毁时需要执行额外的资源管理步骤，否则几乎不会定义\
  \ `__del__()`。\n\n`__repr__()` 方法由内置函数 `repr()` 调用，它创建对象的字符串表示，这对于调试和打印非常有用。该方法还负责创建当你在交互式解释器中检查变量时所看到的数值输出。惯例是让\
  \ `__repr__()` 返回一个表达式字符串，该字符串可以通过 `eval()` 重新创建对象。例如：\n\n点击此处查看代码图像\n\n```\na =\
  \ [2, 3, 4, 5]   # 创建一个列表\n\ns = repr(a)        # s = '[2, 3, 4, 5]'\n\nb = eval(s)\
  \        # 将 s 转回列表\n```\n\n如果无法创建字符串表达式，惯例是让 `__repr__()` 返回形式为 `<...message...>`\
  \ 的字符串，如下：\n\n点击此处查看代码图像\n\n```\nf = open('foo.txt')\n\na = repr(f)\n\n# a = \"\
  <_io.TextIOWrapper name='foo.txt' mode='r' encoding='UTF-8'>\n```\n\n### 4.10 数字协议\n\
  \n表 4.2 列出了对象为了提供数学运算而必须实现的特殊方法。\n\n| 方法 | 操作 |\n\n| --- | --- |\n| `__add__(self,\
  \ other)` | `self + other` |\n| `__sub__(self, other)` | `self - other` |\n| `__mul__(self,\
  \ other)` | `self * other` |\n| `__truediv__(self, other)` | `self / other` |\n\
