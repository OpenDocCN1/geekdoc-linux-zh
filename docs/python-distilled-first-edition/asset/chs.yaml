  \n点击此处查看代码图像\n\n```\n'''Content-type: text/html\n<h1>Hello World</h1>\n<a href=\"\
  http://www.python.org\">here</a>\n'''\n```\n\n紧相邻的字符串字面量会合并成单个字符串。因此，上面的内容也可以写成：\n\
  \n点击此处查看代码图像\n\n```\n'Hello ' 'World'\n```\n\n如果字符串的引号前有 `f`，字符串内部的表达式会被求值。例如，在之前的示例中，使用以下语句输出计算值：\n\
  \n点击此处查看代码图像\n\n```\nprint(f'{year:>3d} {principal:0.2f}')\n```\n\n虽然只使用了简单的变量名，但任何有效表达式都可以出现。例如：\n\
  \n```\nprint(f'{year + year:>4d}')\n```\n\n作为 f-string 的替代，`format()` 方法和 `%` 运算符也用于格式化字符串。例如：\n\
  \n点击此处查看代码图像\n\n```\nprint('{0:>3d} {1:0.2f}'.format(year, principal))\n\nprint('%3d\
  \ %0.2f' % (year, principal))\n```\n\n字符串存储为由整数索引的 Unicode 序列，从零开始。负索引从末尾开始。字符串的长度使用\
  \ `len(s)` 计算。要提取单个字符，使用索引运算符 `s[i]`，其中 `i` 是索引。\n\n点击此处查看代码图像\n\n```\na = 'Hello\
