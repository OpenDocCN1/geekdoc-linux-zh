  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_25_0.png)\n\n*Documentation*, and\
    \ if you prefer information on paper, you \n\nwill find several introductory and\
    \ reference books on Kali.\n\n**Wrapping Up**\n\nDaphile, Linux From Scratch,\
    \ Recalbox, SystemRescue, and \n\nKali Linux are by no means related or comparable,\
    \ but \n\ntogether they give a glimpse into the diverse world of \n\nspecialized\
    \ Linux distros. If you want to see some further \n\nexamples, visit the DistroWatch\
    \ site \\[9\\] and look at their \n\ncollection or click the *Random Distribution*\
    \ button – there is \n\nso much more. Q Q Q\n\n**Kali Linux**\n\nThe final specialty\
    \ distro on the list is Kali Linux \\[8\\]. The Kali \n\nLive DVD cannot be called\
    \ lightweight (with a 3.9GB ISO image \n\nsize and the Gnome 44 desktop). But\
    \ like other specialty distri-\n\nbutions, Kali has a special focus, and it does\
    \ not waste space \n\nwith unnecessary stuff: There’s no LibreOffice on the DVD.\n\
    \nIf you’re training to become a security expert, you’re proba-\n\nbly already\
    \ using Kali Linux. The Debian-based distribution \n\naims to be helpful in the\
    \ fields of pentesting, forensics, and \n\nreverse engineering.\n\nIn the start\
    \ menu, all the regular things have been exiled into \n\na *Usual Applications*\
    \ folder (this is where you find *Office*, \n\n*Graphics*, *System*, and some\
    \ other menus, most of which are al-\n\nmost empty). The security-related programs\
    \ have been sorted \n\ninto 13 numbered categories: *01 – Information Gathering*,\
    \ *02 – *\n\n*Vulnerability Analysis*, *03 – Web Application Analysis*, *04 –\
    \ *\n\n*Database Assessment*, *05 – Password Attacks*, *06 – Wireless *\n\n*Attacks*,\
    \ *07 – Reverse Engineering*, *08 – Exploitation Tools*, *09 – *\n\n*Sniffing\
    \ & Spoofing*, *10 – Post Exploitation*, *11 – Forensics*, *12 – *\n\n*Reporting\
    \ Tools*, and *13 – Social Engineering Tools*. Also in-\n\ncluded is the classic\
    \ network sniffer Wireshark, formerly \n\nknown as Ethereal (Figure 6).\n\nOn\
    \ the Kali website, you will find installer ISO images, vir-\n\ntual machine images,\
    \ versions that run in the cloud or as local \n\nDocker containers, and much more.\
    \ For example, the develop-\n\ners also offer ARM images for the Raspberry Pi.\
    \ Before picking \n\nand downloading the right version, you might also want to\
    \ \n\ntake a look at the *Documentation* pages. There are two sub-cat-\n\negories,\
    \ *Kali Linux Documentation* and *Kali Tools *\n\n**\\[1\\]** Daphile: *https://\
    \ www. daphile. com/*\n\n**\\[2\\]** Linux From Scratch: *https:// www. linuxfromscratch.\
    \ org/*\n\n**\\[3\\]** EmulationStation: *https:// emulationstation. org/*\n\n\
    **\\[4\\]** RecalBox: *https:// www. recalbox. com/*\n\n**\\[5\\]** Buildroot:\
    \ *https:// buildroot. org/*\n\n**\\[6\\]** SystemRescue: *https:// www. system-rescue.\
    \ org/ Download/*\n\n**\\[7\\]** SystemRescue book: *https:// www. system-rescue.\
    \ org/ Books/*\n\n**\\[8\\]** Kali Linux: *https:// www. kali. org/*\n\n**\\[9\\\
    ]** DistroWatch: *https:// distrowatch. com/*\n\n**Info**\n\n**Figure 6:**** Kali\
    \ Linux sorts security tools into 13 categories. In the top right corner, Wireshark\
    \ analyzes network traffic.**\n\n**Hans-Georg Eßer** is professor for operating\
    \ systems at South \n\nWestphalia University of Applied Sciences. Prior to his\
    \ academic \n\ncareer, he worked in magazine publishing, most recently as \n\n\
    editor-in-chief of *EasyLinux*.\n\n**Author**\n\n26\n\nSEPTEMBER 2023 \n\nISSUE\
    \ 274 \n\nLINUX-MAGAZINE.COM\n\nCOVER STORY\n\nSpecialty Distros"
