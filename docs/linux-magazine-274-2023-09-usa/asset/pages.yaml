  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_86_0.png)\n\nmonitor with a larger\
    \ color space than sRGB, adjust \n\nthe setting for *Workspace* in the *Color\
    \ Management* \n\ngroup at the bottom (not shown in Figure 2). In my \n\nopinion,\
    \ *AdobeRGB* or *WideGamut* seem to make \n\nsense here – use *WideGamut* only\
    \ if the monitor \n\nsupports a significantly larger color space than \n\nAdobe\
    \ RGB, however.\n\nOne interesting item in the first group, *Demosa-*\n\n*icing*,\
    \ is the setting for *Quality*, where you specify \n\nhow Krita descreens the\
    \ image (i.e., adds missing \n\npixels in the individual color channels). The\
    \ de-\n\nfault setting seems less than perfect because it \n\ncreates an unnecessarily\
    \ soft image. It is only us-\n\nable if the image has too much noise or if you\
    \ \n\nwant to increase the brightness or contrast after-\n\nwards. Of course,\
    \ this will generate noise again. \n\nFor reasonably correct exposure and not\
    \ too \n\nmuch noise in your photos, you might want to use \n\n*AMaZE* instead.\
    \ You may want to try the demosa-\n\nicing algorithms to see which one works best\
    \ for \n\na specific photo. After changing a setting, click \n\n*Update* at the\
    \ bottom and check the results in the \n\npreview window on the right.\n\nIn the\
    \ *White Balance* group, you will not only find \n\nthe settings for this, but\
    \ also presets for exposure \n\ncompensation and for reconstructing highlights\
    \ \n\n(i.e., the brightest, possibly overexposed, image \n\nzones). The default\
    \ *Camera* setting is usually fine \n\nfor white balance. If not, try the *Automatic*\
    \ setting \n\nor try setting the white balance manually.\n\nHowever, the results\
    \ cannot really be judged \n\nwell in the preview window, which shows only a \n\
    \nsmall part of the image in the 100-percent view on \n\nmost screens. Be sure\
    \ to uncheck *Automatic *\n\n*Brightness*. This will be easier to adjust later\
    \ on \n\nwhen you see the whole image.\n\nProvided that there are overexposed\
    \ areas in \n\nthe photo, experiment with the settings next to *Tip *\n\n*Reconstruction*.\
    \ The *Blend* and *Rebuild* methods \n\nseem to be interesting here; *Blend* gives\
    \ you a \n\ngood default setting for normal photos, too. You \n\ncan keep the\
    \ settings in the *Corrections* group. Fi-\n\nnally, press *OK* to open the photo\
    \ in Krita.\n\n**Image Settings**\n\nIn the program window, you will see a large\
    \ pre-\n\nview window at the center. At the top, you’ll find \n\ntwo toolbars\
    \ that let you open images and change \n\nbrush settings, among other things.\
    \ On the left \n\nedge there is a dockable dialog in the form of a \n\ntoolbar\
    \ (Figure 3). It contains important tools \n\n**Figure 2:** The RAW importer \n\
    \nlets Krita load raw camera \n\ndata.\n\n**Figure 3:** Following the \n\nexample\
    \ set by Photoshop, \n\nKrita arranges the editing \n\ntools around the large\
    \ pre-\n\nview window.\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023\n\
