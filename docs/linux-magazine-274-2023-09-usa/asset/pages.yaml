  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_56_0.png)\n\nRust package manager.\
    \ On most systems, \n\nyou will first need to install Cargo and \n\nresolve some\
    \ dependencies via the pack-\n\nage manager (Listing 1, line 2 or 4) and \n\n\
    then update (line 6).\n\nThe next step is to set up Topgrade \n\n(line 8). The\
    \ last step of the build process \n\ncan take a few minutes. Then add the fol-\n\
    \nlowing line to the search path at the end \n\nof your ~/.profile file (Figure\
    \ 1):\n\nexport PATH=$PATH:$HOME/.cargo/bin\n\nTopgrade’s configuration file,\
    \ ~/.config/\n\ntopgrade.toml, supports both general and \n\nspecific settings\
    \ for individual package \n\nmanagers. This is also where you specify \n\nthe\
    \ hostnames of the remote computers \n\nyou want to update via SSH. The prereq-\n\
    \nuisite for this is that Topgrade is already \n\ninstalled on the remote computer.\n\
    \nThen, as soon as you run the topgrade \n\ncommand, the application executes\
    \ the \n\nupgrade commands in all of the pack-\n\nage managers discovered on your\
    \ sys-\n\ntem. It starts with the distribution’s na-\n\ntive package manager,\
    \ followed by \n\nFlatpak and Snap and the other candi-\n\ndates (Figure 2).\n\
    \n**Conclusions**\n\nTopgrade is not witchcraft. It simply \n\nprovides the logic\
    \ to detect and exe-\n\ncute all existing package managers one \n\nby one. Topgrade\
    \ is not suitable for \n\npeople who want to exclusively use the \n\ndistribution’s\
    \ package manager. How-\n\never, if you do use Flatpaks or snaps \n\nand run a\
    \ Raspberry Pi or a server with \n\nPi-hole or other services, then Top-\n\ngrade\
    \ will handle much of the adminis-\n\ntration work for you.\n\nIn testing, a system\
    \ update with Top-\n\ngrade worked without any problems on \n\nDebian, Ubuntu,\
    \ and Fedora (Figure 3). \n\nDistrobox was the only software that \n\nfailed to\
    \ update. Unable to figure out \n\nthe reason, I filed a bug report. Q Q Q\n\n\
    **Figure 2:**** After the native upgrade and upgrading Flatpaks or snaps, **\n\
    \n**Topgrade checks whether any firmware needs to be upgraded.**\n\n**Figure 3:****\
    \ The update sequence is the same on all systems. This is a fresh **\n\n**installation\
    \ of Fedora 38, so Topgrade doesn’t have much to do.**\n\n**\\[1\\]** Topgrade:\
    \ *https:// github. com/ *\n\n* r-darwish/ topgrade*\n\n**\\[2\\]** Topgrade-rs:\
    \ *https:// github. com/ *\n\n* topgrade-rs/ topgrade*\n\n**\\[3\\]** LVFS: *https://\
    \ fwupd. org*\n\n**\\[4\\]** Supported package managers: \n\n*https:// github.\
    \ com/ r-darwish/ *\n\n* topgrade/ wiki/ Step-list*\n\n**Info**\n\nIN-DEPTH\n\n\
    Topgrade\n\n57\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023"
