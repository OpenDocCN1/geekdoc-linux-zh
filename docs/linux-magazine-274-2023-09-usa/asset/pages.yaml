  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_40_0.png)\n\ndistribution. The most\
    \ common sce-\n\nnario involves needing a tool that Sys-\n\ntemRescue does not\
    \ include by default. \n\nBecause SystemRescue is based on \n\nArch, it has access\
    \ to Arch’s reposito-\n\nries. If you ever need a tool, you can \n\nsimply install\
    \ it in your rescue environ-\n\nment as you would on a regular operat-\n\ning\
    \ system. In practical terms, you can \n\nuse the pacman package manager from\
    \ \n\nwithin a running SystemRescue envi-\n\nronment. For example, if you prefer\
    \ \n\nEmacs over the default Vim, you can in-\n\nstall it with the following commands:\n\
    \n\\# pacman -Sy\n\n\\# pacman -S emacs\n\nPackages installed this way will be\
    \ \n\nplaced in a filesystem overlay in RAM. \n\nThe packages will be available\
    \ only to \n\nthe rescue environment and won’t \n\ntouch the computer’s hard drive\
    \ that \n\nyou are rescuing. On the downside, you \n\nwill have to manually install\
    \ these \n\npackages every single time you boot \n\nSystemRescue, because packages\
    \ you \n\ninstall with pacman are not kept across \n\nreboots. Therefore, if you\
    \ use an appli-\n\ncation often or expect to be performing \n\nmaintenance tasks\
    \ without access to \n\nArch’s repositories, you will need to in-\n\nclude the\
    \ desired packages in your cus-\n\ntom version of SystemRescue.\n\nAnother scenario\
    \ that calls for a cus-\n\ntom SystemRescue involves a recovery \n\nenvironment\
    \ that allows running custom \n\nscripts, performing tasks automatically, \n\n\
    or executing services without the inter-\n\nvention of an administrator. For exam-\n\
    \nple, a server at your office breaks down \n\nand the responsible system administra-\n\
    \ntor is out of town, requiring the sys \n\nadmin to instruct an untrained co-\n\
    \nworker to perform recovery via phone, \n\nwhich may not end well. An easier\
    \ solu-\n\ntion would be to have the sys admin fix \n\nthe problem remotely by\
    \ telling the co-\n\nworker to grab a recovery DVD from the \n\nshelf, put it\
    \ in the server’s DVD tray, re-\n\nboot, and have SystemRescue offer a \n\nshell\
    \ to the sys admin.\n\n**USB or DVD?**\n\nThe easiest way to create a custom Sys-\n\
    \ntemRescue is to install it on a USB \n\ndrive using a backing store \\[2\\],\
    \ which \n\nis an area on the USB drive where \n\nchanges to the running SystemRescue\
    \ \n\nenvironment are written. You can in-\n\nstall SystemRescue to a USB with\
    \ a \n\nbacking store, boot it, install all the \n\npackages you need, and configure\
    \ all \n\nthe desired scripts, and then shut it \n\ndown. Your changes will be\
    \ preserved \n\nacross reboots this way.\n\nWhile this approach is serviceable,\
    \ I \n\npersonally avoid using USB drives for re-\n\ncovery environments for a\
    \ number of \n\nreasons. DVDs offer a reasonable guar-\n\nantee that you will\
    \ get a pristine recov-\n\nery environment every time you boot, \n\nand there\
    \ is value in that. (Your little \n\nbrother is more likely to borrow a USB \n\
    \nand replace your valuable data with \n\nB-movies.)\n\nBecause I want my rescue\
    \ environ-\n\nment stored to read-only media, I can’t \n\nuse a backing store.\
    \ Instead, I will create \n\nan ISO image containing my custom \n\nsoftware and\
    \ configurations and then \n\nburn it to a DVD.\n\n**Adding SSH Access and **\n\
    \n**Persistent Keys**\n\nTo illustrate how to include additional \n\nfiles and\
    \ custom auto-started services on \n\na SystemRescue DVD, I’ll use the exam-\n\
    \nple of a bunch of servers in a remote of-\n\nfice. One of the servers breaks,\
    \ and the \n\nsys admin needs to make it boot System-\n\nRescue and offer an SSH\
    \ shell to connect \n\nto it from home.\n\nWhile SystemRescue includes an SSH\
    \ \n\nserver, it is not accessible by default for \n\ntwo reasons: A proper password\
    \ needs \n\nto be configured first, and the default \n\nfirewall blocks incoming\
    \ SSH connec-\n\ntions. To remedy this, you need to create \n\na custom SystemRescue\
    \ image that does \n\nthe following:\n\n• Set a password to enable login over\
    \ \n\nSSH\n\n• Remove the firewall\n\n• Use a persistent set of SSH fingerprints\
    \ \n\n(because I want to verify the SSH serv-\n\ner’s identity when connecting\
    \ to it \n\nremotely)\n\nThis custom SystemRescue image will \n\nthen allow the\
    \ senior sys admin to in-\n\nstruct a junior sys admin in the server \n\nroom\
    \ to boot SystemRescue, which will \n\nallow the sys admin to connect to the \n\
    \n**Figure 1:**** An extracted SystemRescue image: Custom configuration files\
    \ **\n\n**can be placed under the **sysrescue.d** directory, and SystemRescueMod-**\n\
    \n**ules under **sysresccd**.**\n\n**Figure 2:**** SystemRescue accepts cheat\
    \ codes at boot time that enable or **\n\n**disable features. Among other things,\
    \ cheat codes let you set a root **\n\n**password for the rescue environment and\
    \ enable or disable **\n\n**SystemRescue’s firewall.**\n\nIN-DEPTH\n\nCustomizing\
    \ SystemRescue\n\n41\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023"
