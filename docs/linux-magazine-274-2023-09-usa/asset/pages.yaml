  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_35_0.png)\n\nunusable. The VM is a\
    \ file called rootfs.\n\next4 in the current working directory.\n\nThese defaults\
    \ can be modified by op-\n\ntions. With \\--architecture=ARCHITECTURE \n\n(\\\
    -a=ARCHITECTURE), you can specify the \n\nVM’s hardware architecture from Debi-\n\
    \nan’s official ports: amd64, arm64, armel, \n\narmhf, i386, mipsel, mipsel64el,\
    \ pp64el, \n\nand s90x. If you do not want to use the \n\nunstable repository,\
    \ you can use \n\n\\--release=REPOSITORY (\\-r=REPOSITORY) to \n\nuse testing\
    \ or stable instead. Likely, too, \n\nyou can use \\--size=SIZE (\\-s=SIZE), using\
    \ \n\nthe usual abbreviations such as K for ki-\n\nlobye, M for megabyte, and\
    \ G for gigabyte. \n\nWhen creating multiple VMs, you can \n\nalso use \\--output=FILE\
    \ (\\-0=FILE) to name \n\neach one, using .ext4 as an extension. \n\nWhen experimenting\
    \ with kernels, the \n\nkernel option will create the machine \n\nwithout a kernel.\n\
    \nIn addition, options for mmdebstrap \n\ncan be added. Many of these may be of\
    \ \n\nD\n\nebian developers have a habit \n\nof writing utilities for maintain-\n\
    \ning distributions that are also \n\nuseful for ordinary users. For \n\nexample,\
    \ diffoscope \\[1\\], which compares \n\nbinary files, is useful for both version\
    \ \n\ncontrol and comparing – among others – \n\nPDF and LibreOffice files. In\
    \ the past \n\nyear or so, an equally useful utility \n\ncalled debvm has emerged.\
    \ As the name \n\nsuggests, debvm \\[2\\] is a tool for the \n\nquick and easy\
    \ creation of virtual ma-\n\nchines (VMs) running Debian releases \n\nand architectures\
    \ \\[3\\]. While debvm \n\ngives developers the ability to test re-\n\nleases\
    \ and architectures without chang-\n\ning hardware, it can be also be useful to\
    \ \n\nany user as a sandbox for testing scripts \n\nor checking the results of\
    \ mixing reposi-\n\ntories. Where traditional virtualization \n\nmethods such\
    \ as VMware, VirtualBox, or \n\nGnome Boxes create permanent VMs, \n\noften for\
    \ the purpose of running another \n\noperating system, debvm is ideal for cre-\n\
    \nating VMs for specific, limited purposes \n\nwith a small memory footprint.\n\
    \nYou will find the debvm 0.2.12 package \n\nin the repository of Debian 12 (Book-\n\
    \nworm) and the 0.2.7 package in Ubuntu \n\n23.04 repositories. Undoubtedly, other\
    \ \n\nDebian derivatives will start to carry it as \n\nit gets closer to general\
    \ release, although \n\nthe current releases are stable enough to \n\nbe worth\
    \ exploring. The packages con-\n\nsists of three command-line tools: de-\n\nbvm-create,\
    \ debvm-run, and debvm-waitssh. \n\nAll three commands include intelligent \n\n\
    defaults that make the bare command us-\n\nable, as well as a handful of options\
    \ each.\n\n**debvm-create**\n\nAs a wrapper for mmdebstrap, debvm-create \n\n\
    lets you create a chroot jail. Used without \n\nany options, debvm-create produces\
    \ a VM \n\nwith the host machine’s format, files from \n\nthe repository debvm\
    \ is taken from, and one \n\ngigabyte of memory. No password is re-\n\nquired.\
    \ Instead of user accounts, users are \n\nautomatically logged in as root. Reposito-\n\
    \nries and apt are installed, as well as basic \n\nutilities. Note that if you\
    \ use the package \n\nfrom Debian Unstable, which as its name \n\nimplies is constantly\
    \ changing, you may \n\nsometimes be unable to install everything. \n\nHowever,\
    \ such problems do not always \n\nmake the resulting VM completely \n\n**Create\
    \ disposable virtual machines for Debian releases**\n\nAt Your Disposal\n\n**Debvm\
    \ lets you quickly create a temporary virtual machine with a small memory footprint,\
    \ **\n\n**ideal for testing scripts or mixing repositories. ***By Bruce Byfield*\n\
    \n**Figure 1:**** Upon start-up, **debvm-create** presents a list of defaults.**\n\
    \n**Photo by Alfonso Navarro on Unsplash**\n\n36\n\nIN-DEPTH\n\nSEPTEMBER 2023\
    \ \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\nCommand Line – Disposable VMs"
