  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_21_0.png)\n\nTo let you hear the music\
    \ on Daphile’s hard disk from a re-\n\nmote location, the distribution launches\
    \ a Samba server to \n\nwhich you can connect from any Linux, Windows, or macOS\
    \ \n\nmachine. The Samba server gives you access to artist folders \n\nwith album\
    \ subfolders inside.\n\nSetting up Daphile is easy. The website offers three down-\n\
    \nloads (64-bit, 32-bit, and 64-bit with realtime kernel), so you \n\ncan use\
    \ a modern computer, but Daphile will also work on a \n\nvery old machine. For\
    \ our test, we picked the first option, the \n\n64-bit image (*daphile-23.01-x86\\\
    _64.iso*, 276MB). Note that \n\nDaphile is available under a restricted license\
    \ – a disclaimer \n\non the website reads: “Daphile distribution is made available\
    \ \n\nfree of charge for non-commercial private use. Any commer-\n\ncial usage\
    \ and redistribution of Daphile in any form is strictly \n\nprohibited.”\n\nWrite\
    \ the ISO image to a USB stick, boot your intended audio \n\nserver from that\
    \ stick, and check the output on the screen: It \n\nwill show its IP address.\
    \ This is also the last time you need to \n\nhave a monitor connected, because\
    \ Daphile runs in headless \n\nmode – you cannot even login directly at the computer.\n\
    \nConnect via a browser and go to the *Settings* tab. There \n\nyou can launch\
    \ an installation: Select a hard disk that will \n\nbe repartitioned (and will\
    \ lose all previous data). Daphile \n\ncreates two partitions, a small one named\
    \ *DaphileBoot* \n\n(which holds the software) and a large one named *Daphile-*\n\
    \n*Data* (where you store your music). If you don’t want to use \n\nthe computer’s\
    \ hard disk or only want to try the software \n\nout, you can also install onto\
    \ the USB stick that you’ve just \n\nbooted from. Reboot from the target disk\
    \ (or stick) and \n\nF\n\nor a special job, you need a special tool. Occupying\
    \ a spe-\n\ncial place beside the grand old generalists are a number of \n\nLinux\
    \ distributions that have a very narrow focus, such as \n\naudio, gaming, or security.\
    \ Specialized Linux distributions \n\ncome in all sizes, but even the huge ones\
    \ often fall into the \n\n“lightweight” category, because, even though they might\
    \ need \n\na lot of space for their specialist tools, they don’t have to make\
    \ \n\nroom for all the other general-purpose software you’re used to \n\nseeing\
    \ in a Linux system. Hundreds of specialty distros exist in \n\nthe wild. This\
    \ article highlights a few popular alternatives \n\n(Table 1). I’ll introduce\
    \ you to Daphile, an audio server; Linux \n\nFrom Scratch, an educational roll-your-own\
    \ Linux; Recalbox, \n\nwhich lets you run classic games on EmulationStation; System-\n\
    \nRescue, the universal repair tool; and Kali Linux, the Swiss \n\nArmy knife\
    \ for pentesters and other security experts.\n\n**Daphile Audio Server**\n\nIf\
    \ you have an unused older computer, why not turn it into \n\nyour new headless\
    \ audio server? Install the Daphile distribu-\n\ntion \\[1\\], store your music\
    \ on its hard disk, and access it in two \n\nways: via a web app and via a Samba\
    \ share (Figure 1).\n\nDaphile promises “Digital Music Convenience for Audiophiles”:\
    \ \n\nIt provides a web application that lets you manage the system from \n\n\
    any computer in the local network: Just enter its IP address in a \n\nbrowser’s\
    \ address bar, and you can start using Daphile. The inte-\n\ngrated audio player\
    \ sends music to the server’s sound card (and not \n\nto the client that you use\
    \ for controlling it!), so the intended use is \n\nto connect the Daphile PC to,\
    \ say, your living room’s hi-fi system \n\nand then control it from a notebook\
    \ or phone (Figure 2).\n\n**Lightweight specialty distributions**\n\nThe \n\n\
    Specialists\n\n**In the Linux world, form follows function. A specialty distro\
    \ is a Linux-based system **\n\n**designed to serve a specific role. We look at\
    \ some classic examples. ***By Hans-Georg Eßer*\n\n**Distribution**\n\nSystemRescue\n\
    \nKali Linux\n\nDaphile\n\nLinux From Scratch\n\nRecalbox\n\n**Website**\n\n*https://\
    \ www. *\n\n* system-rescue. org/*\n\n*https:// www. kali. org/*\n\n*https://\
    \ www. daphile. *\n\n* com/*\n\n*https:// www. *\n\n* linuxfromscratch. *\n\n\
    * org/*\n\n*https:// www. *\n\n* recalbox. com/*\n\n**Version**\n\n10.01\n\n2023.2\n\
    \n23.01\n\n11.3\n\n9.1\n\n**Released**\n\n05/ 2023\n\n05/ 2023\n\n01/ 2023\n\n\
    03/ 2023\n\n06/ 2023\n\n**Linux Kernel**\n\n6.1.30\n\n6.1.27\n\n5.15.86\n\n6.1.11\n\
    \n5.17.15\n\n**Window Manager**\n\nxfwm4 4.18.0 (Xfce)\n\nGnome 44\n\n–\n\n–\n\
    \n–\n\n**ISO Image Size**\n\n737MB\n\n3.9GB (Live)\n\n276MB\n\n–\n\n3GB\n\n**Table\
    \ 1: ****Distributions**\n\nCOVER STORY\n\n22\n\nSEPTEMBER 2023 \n\nISSUE 274\
    \ \n\nLINUX-MAGAZINE.COM\n\nSpecialty Distros"
