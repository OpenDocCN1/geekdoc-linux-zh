  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_39_0.png)\n\nmaintainer has recognized\
    \ this possibil-\n\nity and made it easy to create your own \n\nSystemRescue solutions\
    \ to suit your \n\nneeds. This article explains how to cre-\n\nate a custom SystemRescue\
    \ \n\nenvironment.\n\n**The Need for Customization**\n\nTwo real-life scenarios\
    \ call for creating \n\na custom SystemRescue-based \n\nC\n\nomputers crash. Whether\
    \ be-\n\ncause of human error, software \n\nbugs, or hardware dying from \n\n\
    old age, workstations and serv-\n\ners alike will eventually break. For this \n\
    \nreason, every system administrator \n\nshould have a digital first-aid kit to\
    \ get \n\nbroken systems back to working condi-\n\ntion as soon as possible. For\
    \ this task, I \n\nkeep SystemRescue in my toolkit.\n\nSystemRescue, formerly\
    \ known as Sys-\n\ntemRescueCd, is a Live Linux distribu-\n\ntion designed to\
    \ repair broken systems \n\nand handle a number of maintenance \n\ntasks. It includes\
    \ tools to recover deleted \n\nfiles, repair broken boot managers, fix \n\ninconsistent\
    \ filesystems, and more. The \n\ndefault set of installed programs is im-\n\n\
    pressive (see Table 1 for a sample of in-\n\ncluded tools or visit the SystemRescue\
    \ \n\nwebsite \\[1\\] for the complete list). If one \n\nof your workstations\
    \ or servers is ren-\n\ndered unbootable, you can simply boot \n\nyour SystemRescue\
    \ DVD or USB and \n\nhave a full recovery environment avail-\n\nable in a matter\
    \ of minutes. With \n\nSystemRescue, you can repair damaged \n\nboot managers,\
    \ partition tables, or file-\n\nsystems. More importantly, you can ex-\n\ntract\
    \ your files from the failing computer \n\nand safely save them to a USB-attached\
    \ \n\nhard drive or over a network.\n\nDespite SystemRescue’s impressive \n\n\
    feature set, you will eventually find \n\nyourself in a situation where the default\
    \ \n\nfeatures fall short. SystemRescue’s \n\n**Adding scripts and tools **\n\n\
    **to SystemRescue**\n\nCustom \n\nRepair Toolkit\n\n**You can do more with SystemRescue\
    \ than just repair broken systems. By adding tools and scripts, **\n\n**you can\
    \ create a custom rescue environment that meets your needs. ***By Rubén Llorente*\n\
    \n**Tool**\n\n**Description**\n\nGNU ddrescue\n\nCopies data from devices with\
    \ bad blocks (such as damaged hard drives)\n\nFSArchiver\n\nSaves and restores\
    \ filesystem images\n\nOpenSSH server Controls the recovery environment from a\
    \ remote machine and easily \n\ntransfers files in and out of the damaged computer\n\
    \nMinicom\n\nConnects to serial consoles\n\ncryptsetup\n\nAccesses Linux encrypted\
    \ disks\n\nchntpw\n\nResets Windows passwords\n\nTestDisk\n\nRecovers lost partitions\
    \ and repairs boot sectors\n\nPhotoRec\n\nRecovers files deleted accidentally\
    \ (or otherwise)\n\nwipe\n\nDeletes data securely\n\nRclone\n\nTransfers and syncs\
    \ files to a number of storage systems, including \n\nFTP and Nextcloud\n\n**Table\
    \ 1: ****SystemRescue Tools (an Incomplete List)**\n\n**Lead Image © Maksym Yemelyanov,\
    \ 123RF.com**\n\n40\n\nIN-DEPTH\n\nSEPTEMBER 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\
    \nCustomizing SystemRescue"
