  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_28_0.png)\n\ndevelopers are still\
    \ involved, they are \n\nnow middle aged, rather than adoles-\n\ncents. A large\
    \ part of the reason is likely \n\nthe rise of Ubuntu, which from its first \n\
    \nrelease in 2004 has been viewed as hav-\n\ning many of Debian’s advantages in\
    \ a \n\nmore user-friendly environment. In \n\nUbuntu’s early days, it even seemed\
    \ \n\nthat Ubuntu might replace Debian in \n\npopularity. But instead, many develop-\n\
    \ners contributed to both Debian and \n\nI\n\nnstalling Debian 12, codenamed \n\
    \nBookworm, I was struck by how \n\nmuch the distribution has changed \n\nin the\
    \ 24 years since I first installed \n\nit (Figure 1). Around the turn of the \n\
    \nmillennium, Debian already had a for-\n\nmidable reputation. It was one of the\
    \ \n\nhalf dozen leading distributions, but it \n\nwas widely viewed as an expert’s\
    \ \n\nchoice, and its developers were viewed \n\nas members of an elitist club\
    \ obsessed \n\nwith radical forms of governance. In \n\nfact, I once heard Eben\
    \ Moglen, the \n\nlawyer behind the GNU General Public \n\nLicenses, describe\
    \ the project as an ex-\n\nample of syndicalist anarchism in ac-\n\ntion. By contrast,\
    \ in 2023, Debian has \n\nmellowed, quietly becoming more \n\naccessible, with\
    \ even its once notori-\n\nously vicious mailing lists functioning \n\nmore responsibly.\n\
    \nPart of the reason for the change may \n\nbe that while many of the original\
    \ \n\n**Not your father’s Debian**\n\n Debian 12\n\n**Debian 12 features install\
    \ options, new packages, and a new **\n\n**position on non-free firmware, making\
    \ it more accessible to **\n\n**the average user. ***By Bruce Byfield*\n\n**Bruce\
    \ Byfield** is a computer journalist and \n\na freelance writer and editor specializing\
    \ \n\nin free and open source software. In \n\naddition to his writing projects,\
    \ he also \n\nteaches live and e-learning courses. In his \n\nspare time, Bruce\
    \ writes about Northwest \n\nCoast art (*http:// brucebyfield. wordpress. *\n\n\
    * com*). He is also co-founder of Prentice \n\nPieces, a blog about writing and\
    \ fantasy at \n\n*https://prenticepieces.com/*.\n\n**Author**\n\n**Figure 1:****\
    \ Recently released, Debian 12 shows how much the distro has **\n\n**changed over\
    \ the years.**\n\n**Lead Image © Galina Peshkova, 123RF.com**\n\n29\n\nLINUX-MAGAZINE.COM\
    \ \n\nISSUE 274 \n\nSEPTEMBER 2023\n\nREVIEW\n\nDistro Walk – Debian 12"
