  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_12_0.png)\n\nKernel News\n\n13\n\n\
    LINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023\n\nNEWS\n\n*anyway. Don’t\
    \ do them. Just leave it at *\n\n*zero, and maybe some day there is a sane *\n\
    \n*model that actually has a bitfield of capa-*\n\n*bilities and requirements.”*\n\
    \nAkihiro remarked, “Looks like Apple’s \n\nvmlinuz loader only requires LINUX\\\
    _\n\nEFISTUB\\_MINOR\\_VERSION to be 0x0 \n\nand does not care about \n\nLINUX\\\
    _EFISTUB\\_MAJOR\\_VERSION.”\n\nAnd the thread ended.\n\nAccommodating busted\
    \ hardware and \n\nfirmware is not new at all. It’s fascinat-\n\ning to imagine\
    \ how much thoroughly \n\nbroken hardware is accommodated in \n\nthe weirdest\
    \ possible ways by the Linux \n\nkernel code, often resulting in poorer \n\nperformance\
    \ and avoiding whole \n\nswaths of high-powered hardware fea-\n\ntures that themselves\
    \ represented big \n\nsecurity holes. Some of these hardware \n\nbugs even get\
    \ their own names, such as \n\nSpectre, Meltdown, Foreshadow, Zom-\n\nbieLoad,\
    \ MDS, LazyFP, PortSmash, TL-\n\nBleed, Plundervolt, CacheOut, and the \n\nlist\
    \ goes on.\n\n**TV Is the Thing This Year, **\n\n**This Year**\n\nDoug Berger\
    \ wanted to eke out every last \n\ndrop of RAM efficiency from the Linux \n\n\
    kernel, especially when running Broad-\n\ncom System-on-a-Chip (SoC) hardware\
    \ \n\nsuch as BCM7445 and BCM7278, built \n\nfor TVs. These systems and others\
    \ like \n\nthem, he said, “contain multiple mem-\n\nory controllers with each\
    \ mapped in a \n\ndifferent address range within a Uniform \n\nMemory Architecture.”\
    \ Uniform memory \n\naccess (UMA) is generally found in \n\ncheap systems that\
    \ aren’t expected to \n\nhandle heavy workloads. It stands in \n\ncontrast with\
    \ non-uniform memory ac-\n\ncess (NUMA), where each processor has \n\nits own\
    \ local memory, allowing the sys-\n\ntem to make the best possible use of \n\n\
    each processor’s specialized capabilities. \n\nDesktop systems doing hardcore\
    \ 3D \n\ngaming tend to be NUMA, while systems \n\nthat process nothing but TV\
    \ signals tend \n\nto be UMA.\n\nUMA is fundamentally a corner-cut-\n\nting technology.\
    \ Memory is made avail-\n\nable to all processors, at the cost of the \n\nfaster\
    \ processors having to accept the \n\nslower RAM built into the slower proces-\n\
    \nsors. But there are still ways to speed up \n\nmemory usage – for example, by\
    \ group-\n\ning the memory allocations for individ-\n\nual threads together. That\
    \ way there \n\nwould be less need to jump around be-\n\ntween disparately located\
    \ memory \n\nregions.\n\nNot all memory allocations can simply \n\nbe moved around,\
    \ however. Some low-\n\nlevel system code needs to stay in one \n\nplace. To distinguish\
    \ between memory \n\nallocations that can and can’t be moved \n\naround by the\
    \ kernel, memory can be la-\n\nbeled as ZONE\\_MOVABLE.\n\nHowever, on these Broadcom\
    \ UMA \n\nsystems, it wasn’t that easy. As Doug put \n\nit, “Unfortunately, the\
    \ historical mono-\n\ntonic layout of zones would mean that if \n\nthe lowest\
    \ addressed memory controller \n\ncontains ZONE\\_MOVABLE memory then \n\nall\
    \ of the memory available from mem-\n\nory controllers at higher addresses must\
    \ \n\nalso be in the ZONE\\_MOVABLE zone.”\n\nThis in turn, he went on, “would\
    \ force \n\nall kernel memory accesses onto the \n\nlowest addressed memory controller\
    \ and \n\nsignificantly reduce the amount of mem-\n\nory available for non-movable\
    \ alloca-\n\ntions.” In other words, the kernel itself \n\nand everything it needed\
    \ to do.\n\nDoug posted a patch to create what he \n\ncalled “Designated Movable\
    \ Blocks,” \n\nwhich the kernel would use to satisfy re-\n\nquests for movable\
    \ blocks of RAM.\n\nPart of the whole problem is that the \n\nkernel could simply\
    \ not do UMA at all \n\nand treat Broadcom TVs and all other \n\nsuch devices\
    \ as full NUMA systems. \n\nAfter all, they have multiple CPUs, so \n\nwhy not\
    \ do the standard thing? But this \n\ngets back to why UMA exists in the first\
    \ \n\nplace – to make as much RAM as possi-\n\nble available to all CPUs on a\
    \ system \n\ncontaining scarce resources. As Doug \n\nput it, “NUMA architectures\
    \ support dis-\n\ntributing movable core memory across \n\neach node, but it is\
    \ undesirable to intro-\n\nduce the overhead and complexities of \n\nNUMA on systems\
    \ that don’t have a \n\nNon-Uniform Memory Architecture.”\n\nIn response to Doug’s\
    \ patch, Mel Gor-\n\nman replied with some objections. In \n\nparticular, he wasn’t\
    \ convinced that the \n\npatch would actually improve memory \n\nusage on those\
    \ Broadcom systems.\n\nMel had actually been one of the main \n\npeople to implement\
    \ ZONE\\_MOVABLE sup-\n\nport in the kernel in the first place, and \n\nhe had\
    \ some serious regrets on that \n\nscore. He said, “Zones are about ad-\n\ndressing\
    \ limitations primarily and \n\nfrankly, ZONE\\_MOVABLE was a bad idea \n\nin\
    \ retrospect.” A better idea, he said, \n\nwould have been to treat UMA as just\
    \ a \n\nspecial case of NUMA. Specifically, “cre-\n\nate a separate NUMA node\
    \ with dis-\n\ntance-1 to the local node \\[…\\] that was \n\nZONE\\_MOVABLE with\
    \ the zonelists \n\nstructured such that GFP\\_MOVABLE al-\n\nlocations would\
    \ prefer the ‘movable’ \n\nnode first.”\n\nMel lamented, “While I don’t recall\
    \ \n\nwhy I did not take that approach, it most \n\nlikely was because CONFIG\\\
    _NUMA was \n\nnot always set, it was only intended for \n\nhugetlbfs allocations\
    \ and maybe I didn’t \n\nhave the necessary skill or foresight to \n\ntake that\
    \ approach.”\n\nMel lambasted, “A major limitation of \n\nZONE\\_MOVABLE is that\
    \ there is no way \n\nof controlling access from userspace to \n\nrestrict the\
    \ high-speed memory to a des-\n\nignated application, only to all applica-\n\n\
    tions in general. The primary interface to \n\ncontrol access to memory with different\
    \ \n\ncharacteristics is mempolicies which is \n\nNUMA orientated, not zone orientated.\
    \ \n\nSo, if there is a special application that \n\nrequires exclusive access,\
    \ it’s very diffi-\n\ncult to configure based on zones. Fur-\n\nthermore, page\
    \ table pages mapping \n\ndata located in the high-speed region are \n\nstored\
    \ in the slower memory which po-\n\ntentially impacts the performance if the \n\
    \nworking set of the application exceeds \n\nTLB reach. Finally, while there is\
    \ men-\n\ntion that Broadcom may have some spe-\n\ncial interface to determine\
    \ what applica-\n\ntions can use the high-speed region, it’s \n\nhardware-specific\
    \ as opposed to some-\n\nthing that belongs in the core mm.”\n\nHe offered more\
    \ comments, but finally \n\nMel seemed very clear on the fact that \n\n“The high\
    \ bandwidth memory should be \n\nrepresentated as a NUMA node, option-\n\nally\
    \ to create that node as ZONE\\_MOV-\n\nABLE and relying on the zonelists to se-\n\
    \nlect the movable zone as the first \n\npreference.”\n\nHowever, Doug replied,\
    \ “It remains \n\ntrue that CONFIG\\_NUMA is not always \n\nset and that is a\
    \ key motivator for this \n\npatch set. For example, Google is moving \n\nto a\
    \ common GKI kernel for their Google \n\nTV platform that they are requiring ven-\n\
    \ndors to support. Currently the arm64 GKI \n\nkernel does not set CONFIG\\_NUMA\
    \ and \n\nit seems unlikely that we will be able to \n\nget all vendors to accept\
    \ such a change.”\n\nDoug also remarked, “This patch set is \n\nfundamentally\
    \ about greater control over \n\nthe placement of movablecore memory."
