  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_18_0.png)\n\nWhen you install new\
    \ packages and pick the *OnBoot* option \n\nfrom the drop-down menu before you\
    \ click on *Go*, you can inte-\n\ngrate the package’s programs automatically,\
    \ but it will slow \n\ndown the otherwise extremely fast boot process, because\
    \ Tiny \n\nCore mounts each package separately and creates the symlinks. \n\n\
    The application list is not restricted to tiny programs; for example, \n\nyou\
    \ can also install a current LibreOffice version – of course, that \n\nwill only\
    \ be useful if your computer is fast enough (Figure 5).\n\n**antiX Linux**\n\n\
    The antiX project describes their Linux distribution \\[9\\] as a \n\n“fast, lightweight\
    \ and easy-to-install systemd-free Linux live \n\nCD distribution based on Debian\
    \ Stable for Intel-AMD x86 \n\ncompatible systems.” There’s a problem right in\
    \ the first sen-\n\ntence on the website: When you download the ISO image, \n\n\
    you’ll notice that there are several editions of the current ver-\n\nsion 22 to\
    \ choose from. You can make the following decisions:\n\n• 64-bit or 32-bit version,\n\
    \n• use System V init (sysvinit) or runit (yet another replacement \n\nfor sysvinit),\
    \ \n\n• and get the *full* system (1.4GB), a *base* system (basically *full* \n\
    \nwithout LibreOffice; 820MB), a *core* system (text-mode only; \n\n460MB), or\
    \ a *net* system (for manually download-\n\ning and building the rest of the system;\
    \ 180MB).\n\nYou can pick one of the 16 images, and each of them \n\nthat will\
    \ give you a graphical desktop is larger than \n\n700MB, so it will not fit on\
    \ a CD. You can burn the \n\nlarger images to a DVD or write them to a USB stick,\
    \ \n\nbut on older CD-only machines, it won’t work.\n\nAntiX Linux boots into\
    \ a live system. You can run \n\nthe antiX installer from the start menu. The\
    \ installer \n\nwill first check the integrity of the ISO image and \n\nthen let\
    \ you partition the hard disk; like the installers \n\nof the mainstream distributions,\
    \ the antiX installer \n\nmakes a suggestion, but you can apply changes. You \n\
    \nneed to deal with the same types of questions you \n\nsee with other Linux installers.\
    \ For example, you \n\nenter a hostname, set up the locale settings, create a\
    \ \n\nuser account, and set the user and root passwords. \n\nAntiX Linux allows\
    \ the creation of a password-less \n\naccount, and a root password is not required,\
    \ either: \n\nIf you don’t set one, you can later become root \n\nvia sudo su.\n\
    \nAfter booting the freshly installed antiX sys-\n\ntem for the first time, I\
    \ noticed that the *Applica-*\n\n*tions* submenu was completely empty – if that\
    \ \n\nhappens to you, run *Refresh Menu* from the top \n\nlayer of the start menu\
    \ to re-populate the menu \n\n(Figure 6).\n\nThis antiX version is based on Debian\
    \ GNU/ \n\nLinux 11, so you can apt update and apt \n\ninstall Debian packages,\
    \ but when you install \n\nthe *full* version, you already get a lot of useful\
    \ \n\nprograms. Instead of adding software with apt, \n\nyou can open the antiX\
    \ Control Centre, go to \n\nthe *Software* tab, and click on *Manage Packages*\
    \ \n\n(which starts Synaptic) or *Package Installer*, \n\nwhich opens an antiX\
    \ tool that shows software \n\nsorted into categories, such as *Development*,\
    \ \n\n*File Managers*, or *Games* (Figure 7).\n\n**Remastering**\n\nPuppy Linux\
    \ and antiX Linux let you remaster the distribution \n\nISO images while you’re\
    \ using the system. So, you can start with \n\na default installation, change\
    \ settings, add and remove software, \n\nmake other modifications, and then create\
    \ a new ISO image that \n\nis a snapshot of the current state. You can then write\
    \ the new \n\nimage to a USB stick and work with your own version.\n\nTechnical\
    \ details differ between Puppy Linux and antiX \n\nLinux. On Puppy Linux, you\
    \ start in a terminal window and \n\ntype remasterpup2, whereas on antiX Linux,\
    \ you open the Con-\n\ntrol Centre, go to the *Maintenance* tab, and click on\
    \ *ISO Snap-*\n\n*shot* (Figure 8). You will need a second USB stick or other\
    \ free \n\nstorage where the tool can create the new ISO image file. The \n\n\
    build process will take a moment, and when it is finished, you \n\nneed to find\
    \ yet another USB stick and write the new file onto \n\nit with dd or a graphical\
    \ tool like Balena Etcher \\[10\\].\n\n**Alpine Linux**\n\nIf you’re a Docker\
    \ user, the name Alpine will be familiar – Al-\n\npine is the standard distribution\
    \ that is used as the foundation \n\n**Figure 6:**** If your antiX Linux installation\
    \ seems to have no **\n\n**installed applications, refresh the menu.**\n\n**Figure\
    \ 7:**** The antiX Linux Package Installer sorts applications **\n\n**into categories.**\n\
    \n19\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023\n\nCOVER STORY\n\n\
    Lightweight Linux Distros"
