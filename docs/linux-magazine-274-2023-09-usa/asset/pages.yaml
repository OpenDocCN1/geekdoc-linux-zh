  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_81_0.png)\n\n**RSS hosting**\n\n**Tiny\
    \ Tiny RSS**\n\n**T**\n\nhere’s a noticeable trend \n\nthat is almost tracking\
    \ \n\nthe trajectory of com-\n\nmand-line use, albeit a decade \n\nbehind: the\
    \ move away from \n\ncloud-hosted services. This \n\nmay be because many of us\
    \ \n\nnow have enough network ca-\n\npacity at home, are willing to \n\nset up\
    \ our own servers, or per-\n\nhaps pay for a micro-service \n\nsite for running\
    \ a few web appli-\n\ncations. But there are signifi-\n\ncant advantages in going\
    \ your \n\nown way, not least of which is \n\nknowing you’re in control of \n\n\
    both your own data and your \n\nown support destiny. It frees \n\nyou of any nagging\
    \ doubts \n\nabout privacy, or a service being \n\nwithdrawn, and puts you back\
    \ \n\nin control of your personal infor-\n\nmation. It’s why wallabag is so \n\
    \npopular for caching web pages, \n\nand why Tiny Tiny RSS is still \n\ngoing\
    \ strong after 17 years.\n\nGood websites still offer their \n\nown RSS feeds,\
    \ and these will \n\ncontain their story updates along \n\nwith a synopsis of\
    \ each story \n\nand a corresponding link. You \n\nthen use a feed reader such\
    \ as \n\nTiny Tiny RSS to track those up-\n\ndates across your own organized \n\
    \nlibrary of subscribed RSS feeds. \n\nBut Tiny Tiny RSS is a self-hosted \n\n\
    RSS aggregator as well as being \n\na web-based RSS reader and it \n\nperforms\
    \ the same job as the \n\nwonderful but entirely defunct \n\nGoogle Reader, or\
    \ the still alive \n\nFeedly. Tiny Tiny RSS is a server \n\nfor collecting your\
    \ feeds and for \n\nsynchronizing their read-state \n\nacross your RSS clients,\
    \ but it’s \n\nalso a brilliant place to consume \n\ncontent. After so many years\
    \ in \n\ndevelopment, the reading web \n\ninterface is better than most desktop\
    \ clients. There are \n\nplugins and themes, a two or three-pane view for reading\
    \ \n\narticles alongside the article list, automatic filtering, a \n\nJSON API,\
    \ deduplication, great feed management, and of \n\ncourse, the ability to import\
    \ and export OPML lists of your \n\nalready curated list of RSS feeds. If you’ve\
    \ already set up \n\na server to run wallabag, for example, running this along-\n\
    \nside is the perfect augmentation.\n\n**Project Website**\n\nhttps:// tt-rss.\
    \ org\n\nTiny Tiny RSS is a brilliant RSS feed aggregator and reader you can \n\
    \neasily install and run yourself.\n\n**Storage monitor**\n\n**erdtree**\n\n**T**\n\
    \nhere are many disk usage \n\ntools, so it requires some-\n\nthing special to\
    \ pull me \n\nout of my du dependency stupor. I \n\nlooked at one called Parallel\
    \ Disk \n\nUsage recently, because it was \n\nvery quick, and erdtree is just\
    \ as \n\nquick and takes a different UI ap-\n\nproach. Where Parallel Disk \n\n\
    Usage outputs a bar graph show-\n\ning usage for every directory, \n\nerdtree’s\
    \ erd command will in-\n\nstead collate totals in the same \n\nway du does. It\
    \ also offers many \n\nof the same command-line op-\n\ntions as du, including\
    \ a human-\n\nreadable option and long output, \n\nso it’s a great drop-in replacement\
    \ \n\n– and it does all this while looking \n\nmuch better than du. The default\
    \ \n\nlayout takes inspiration from an-\n\nother perennial command, tree, \n\n\
    with ASCII lines branching off \n\nfrom directories to subdirectories. \n\nThe\
    \ number of levels is configu-\n\nrable, as is the wonderful use of \n\ncolor\
    \ and accompanying icons \n\nfor every node in the output. The \n\ntree view can\
    \ be inverted, or dis-\n\nabled entirely, and looks fantastic \n\nin 256 colors.\n\
    \nBut it’s the configurability of \n\nerdtree that makes such a differ-\n\nence,\
    \ either from the command-\n\nline arguments or from the op-\n\ntional configuration\
    \ file. It will even \n\nparse .gitignore files when decid-\n\ning which files\
    \ and folders to show, \n\na feature not seen outside of Git it-\n\nself, and\
    \ if that isn’t enough, regu-\n\nlar expressions and glob patterns \n\ncan be\
    \ used for file and directory \n\nsearching and matching. There’s \n\njust as\
    \ much control over sorting \n\ntoo, from reverse names to altera-\n\ntion dates,\
    \ and support for storage \n\nvalues with either binary or SI prefixes. All this\
    \ is done at in-\n\ncredible speed, thanks to configurable multithreading, and\
    \ \n\nyou can scale your CPU usage according to the demands of \n\nyour filesystem.\
    \ This might be useful if you’re streaming or \n\nin a video meeting at the same\
    \ time, for instance, and solves \n\nthe biggest problem with du and tree, which\
    \ was their lack \n\nof speed. Either way, creating an alias from du to erd makes\
    \ \n\na great command-line upgrade.\n\n**Project Website**\n\nhttps:// github.\
    \ com/ solidiquis/ erdtree\n\nThe erdtree executable is **erd**, which can be\
    \ typed quickly, but \n\nnot as quickly as it can generate deep-level output after\
    \ analyzing \n\nyour storage.\n\nFOSSPICKS\n\n**LINUX **VOICE\n\nSEPTEMBER 2023\
    \ \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\n82"
