    \ \n\nspecifying its name if the directory \n\ncontains multiple VMs. In order\
    \ to \n\nboot directly to the VM, create a sym-\n\nbolic link to its kernel and\
    \ initrd in \n\nyour machine’s /boot directory. Often, \n\nthough, most VMs created\
    \ by debvm \n\nwill not be used long enough to make \n\nthis effort worth your\
    \ time.\n\nAt the beginning, debvm-create shows a \n\nlist of defaults to set\
    \ up (Figure 1). Then, \n\napt installs the packages for the VM, \n\nand the VM\
    \ is created (Figure 2). As the \n\ncommand progresses, it periodically \n\nsummarizes\
    \ the next operations (Fig-\n\nure 3). How long the process takes de-\n\npends\
    \ on the Internet speed and how busy \n\n**Figure 2:**** After installing packages,\
    \ **debvm-create** makes the VM.**\n\n**Figure 3:**** As the VM is set up, **debvm-create**\
    \ summarizes its actions **\n\n**before executing them.**\n\nIN-DEPTH\n\nCommand\
    \ Line – Disposable VMs"
