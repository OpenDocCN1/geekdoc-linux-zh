  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_64_0.png)\n\nI worked with the *uasyncio*\
    \ library to \n\nallow ongoing operations and web inter-\n\nface updates to take\
    \ place in parallel. \n\nThe library provides an asynchronous \n\nscheduler that\
    \ assigns application time \n\nto both tasks, which makes it a great \n\nchoice\
    \ for this use case: to ensure \n\nsmooth operations (short response time \n\n\
    after pressing a button in the web inter-\n\nface) on the one hand and smooth\
    \ pro-\n\ncessing of the program (avoiding long \n\nwaits for requests from the\
    \ web server) \n\non the other.\n\nOf course, you also want to be able to \n\n\
    control all of the functions manually as \n\nan alternative. For this to happen,\
    \ a mul-\n\ntipole switch disconnects the actuators \n\nfrom the control system\
    \ so that each of \n\nthe two windows can then be set to the \n\ndesired position\
    \ without conflicting with \n\nthe automatic system, and the fan and \n\nheater\
    \ can be set. The LCD display back-\n\nlighting also is manually switched on to\
    \ \n\nmake it easier to read in the evenings.\n\n**Web-Based Remote Control**\n\
    \nThe control system works reliably of-\n\nfline, but in my opinion, remote \n\
    \nweb-app-based access (Figure 5) is a \n\ngreat idea because it avoids the need\
    \ to \n\ncheck everything manually onsite. \n\nAlso, it means you do not have\
    \ to \n\nmake the control panel on the green-\n\nhouse too fancy. In support,\
    \ the Pico \n\ncan run a web server, which then gives \n\nyou a user interface\
    \ (Figure 5). If so \n\ndesired, you can additionally share the \n\ninterface\
    \ on the Internet, but in this \n\ncase, it can only be accessed on the \n\nlocal\
    \ network.\n\nThe app’s functions are:\n\n• Immediate display of the current \n\
    \nvalues\n\n• Minimum/ maximum temperatures \n\nand assessment of the operating\
    \ status\n\n• Manual switching of windows, fan, \n\nand heater\n\n• Resetting\
    \ variables to automatic \n\ncontrol\n\n• Displaying and deleting messages and\
    \ \n\nerror logs\n\n• Daily and monthly charts of indoor/ \n\noutdoor temperatures\n\
    \n• Reading and writing control parame-\n\nters from and to memory\n\nBecause\
    \ the Pico is always within range \n\nof my home WiFi \n\nnetwork, I have \n\n\
    the situation in the \n\ngreenhouse con-\n\nstantly under con-\n\ntrol and can\
    \ inter-\n\nvene by smart-\n\nphone, tablet, or \n\nPC from the gar-\n\nden or\
    \ apartment.\n\n**Conclusions**\n\nThe greenhouse \n\nis in constant use \n\n\
    from April to October. Accordingly, I \n\nwant the electronic control system to\
    \ \n\nbe not only functional, but above all \n\nreliable in terms of operation.\
    \ To pro-\n\ntect the crops, it is advisable in a proj-\n\nect like this to test\
    \ everything thor-\n\noughly, module by module, up front \n\nbefore putting anything\
    \ into operation. \n\nOnce you have installed the system \n\noutside, it can be\
    \ difficult to access the \n\nindividual components.\n\nThe new controller has\
    \ been running \n\nfor some time now and has demonstrably \n\nbeen a valuable\
    \ asset in the greenhouse \n\nthus far (Figure 6). It is reassuring to \n\nknow\
    \ that everything is well taken care of \n\nin my absence. Sometimes it’s the\
    \ little \n\nthings that matter, like the LED lights that \n\nlet you know whether\
    \ everything is OK as \n\nyou walk past the greenhouse. In the next \n\nstage\
    \ of expansion, I want to add mois-\n\nture sensors so that I can also monitor\
    \ the \n\nsoil. You will find the software and full \n\ndetails of the project\
    \ online \\[1\\], as well as \n\non my GitHub site \\[2\\]. Q Q Q\n\n**Figure\
    \ 5:**** Thanks to a user interface provided by **\n\n**the web server, it’s fine\
    \ for the control panel to be **\n\n**a bit spartan.**\n\n**Figure 6:**** The\
    \ fully stocked greenhouse from the inside.**\n\n**\\[1\\]** Greenhouse project\
    \ (in English): \n\n*https:// linuxnewmedia. thegood. cloud/ *\n\n* s/ 5Rzx9tQW2FJ6N3Z*\n\
    \n**\\[2\\]** Greenhouse project (original code in \n\nGerman): *https:// github.\
    \ com/ swenae/ *\n\n* ghouse*\n\n**Info**\n\n**Swen Hopfe** works for a medium-sized\
    \ \n\ncompany with a focus on smart cards and \n\nnear-field communication (NFC).\
    \ When he \n\nis not taking photos, in the great outdoors \n\nor in his garden,\
    \ he focuses on topics such \n\nas the Raspberry Pi, Internet of Things, \n\n\
    and home automation.\n\n**Author**\n\n65\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\
    \nSEPTEMBER 2023\n\nGreenhouse Control\n\n**MAKER**SPACE"
