  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_57_0.png)\n\nforwarding for all popular\
    \ routers can \n\nbe found online \\[5\\].\n\n**Installation**\n\nInstalling the\
    \ tool is very simple. As the \n\nbasis, Meienberger recommends a re-\n\ncent\
    \ Ubuntu, starting with version 18.04 \n\nand preferably the server variant, but\
    \ \n\nother distributions should work just as \n\nwell. Beyond that, you simply\
    \ need to \n\ndownload and run an installation script. \n\nAfter a few moments,\
    \ you will see a URL \n\nfor the user interface (Figure 2). If you \n\nalready\
    \ have Docker and Docker Com-\n\npose installed, the script will use your \n\n\
    defaults. Otherwise, both applications \n\nare retrieved during the Tipi install.\
    \ Tipi \n\nruns on port 80 by default.\n\nIf you want to choose a different port,\
    \ \n\nrun the start-up script with the addi-\n\ntional \\--port argument. You\
    \ can down-\n\nload and run the script simultaneously \n\nwith a single command:\n\
    \ncurl -L https://setup.runtipi.com | bash\n\nIf you want to change the port,\
    \ the first \n\nstep is to get the script:\n\nclone https://github.com/meienberger/U\n\
    \n runtipi.git\n\nT\n\no keep your data under your \n\ncontrol, instead of outsourcing\
    \ \n\nto unknown servers, the typical \n\napproach is to simply host the \n\n\
    services yourself. It is becoming in-\n\ncreasingly easy for less technically\
    \ in-\n\nclined users to operate a small home \n\nserver. Not least, the Raspberry\
    \ Pi has \n\ncontributed significantly to this by en-\n\ncouraging many users\
    \ to experiment. \n\nThe choice of suitable hardware is nat-\n\nurally far greater:\
    \ from devices such as \n\nlaptops or PCs that have already been \n\nreplaced\
    \ by newer gear to virtual ma-\n\nchines to rented VPS servers on the \n\nInternet.\n\
    \nTo save you from having to package \n\nand configure every service as a \n\n\
    container yourself, the number of \n\nhome server managers have increased \n\n\
    recently. Examples include DietPi, \n\nYunoHost, Mistborn, or NethServer. \n\n\
    The summer of 2022 saw the release of \n\nanother alternative in the form of Tipi\
    \ \\[1\\] \n\nby Swiss developer Nicolas \n\nMeienberger \\[2\\].\n\n**Management\
    \ Interface**\n\nTipi is essentially a management inter-\n\nface for the applications\
    \ and services \n\nthat you want to run on your home \n\nserver, without requiring\
    \ in-depth exper-\n\ntise of the setup and management tasks \n\nfor the home server\
    \ operating system. \n\nTipi currently offers more than 100 apps \n\nfor installation\
    \ in a click-and-forget pro-\n\ncess \\[3\\]. You don’t have to worry about \n\
    \nsetting up the network or configuring the \n\napps initially and can instead\
    \ adjust the \n\nsettings of each app later.\n\nTipi sets up four containers (Figure\
    \ 1): \n\nThe apps all end up in their own Docker \n\ncontainers. (You can try\
    \ out a demo \\[4\\] \n\non the Tipi GitHub page.)\n\nBefore installing, you need\
    \ to decide \n\nwhether you want to limit the scope of \n\napplications and services\
    \ to your home \n\nnetwork or if you additionally want ac-\n\ncess from the outside.\
    \ If you want out-\n\nside access, you need to share both \n\nport 80 and port\
    \ 443 for the corre-\n\nsponding device using port forwarding \n\non your router.\
    \ Instructions for port \n\n**Tipi home server manager**\n\n Control Center\n\n\
    **Tipi gives you complete control of more than 100 applications **\n\n**and services.\
    \ A mouse click is all it takes to install the apps. **\n\n*By Ferdinand Thommes*\n\
    \n**Photo by LinkedIn Sales Navigator on Unsplash**\n\n58\n\nIN-DEPTH\n\nSEPTEMBER\
    \ 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\nTipi"
