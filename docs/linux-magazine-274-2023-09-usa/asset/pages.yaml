    \ (*https://getsol.us/download/*).\n\n** Ubuntu Will Show APT News in the Software\
    \ **\n\n**Updater App**\n\nIf you use Ubuntu version 18.04 LTS or newer, you’ll\
    \ soon be seeing APT News in the \n\nSoftware Updater GUI.\n\nIf you’ve not experienced\
    \ APT News, the idea behind it (according to Canonical) \n\nis to give users as\
    \ much information as possible about recent updates, so they can \n\ndecide if\
    \ those updates should be applied or not. Essentially, APT News is an un-\n\n\
    obtrusive feature that presents timely news, related to installed packages.\n\n\
    The APT News portion of the Software Updater will be presented near the top \n\
    \nof the GUI window and can be expanded to read; otherwise, it will default to\
    \ \n\nunexpanded.\n\nThe information presented will include things like significant\
    \ security updates, fea-\n\ntures, and/or services. This news section also will\
    \ inform you when regular support \n\nhas ended for a release, which should be\
    \ considered a very handy bit of information \n\nto know to help users understand\
    \ it’s time to upgrade to a supported release.\n\nFor those who would rather not\
    \ see this news, Canonical has made it possible to \n\ndisable with the command\
    \ pro config set apt-news=false. Otherwise, APT News \n\nwill be presented in\
    \ both the terminal and the Software Updater GUI.\n\nAnother thing to keep in\
    \ mind is that you’ll get more information if you sign up \n\nfor Ubuntu Pro,\
    \ which is free for personal use.\n\nAt this time, there is no definitive date\
    \ when the APT News feature will land in \n\nthe Software Updater, but I’d expect\
    \ it sooner, rather than later.\n\nThis story was originally reported on OMG!\
    \ Ubuntu! (*https://www.omgubuntu.*\n\n*co.uk/2023/07/ubuntu-now-shows-apt-news-in-software-updater*).\n\
    \n^()\n\n**Nitrux 2.9.0 Includes an Upgrade Tool **\n\n**and More**\n\nNitrux\
    \ 2.9 has officially been released, and it includes the Nitrux Update Tool Sys-\n\
    \ntem (NUTS) that makes it easier for users to either upgrade or roll back their\
    \ cur-\n\nrent release. However, NUTS isn’t the only new addition to this user-friendly\
    \ \n\nLinux distribution.\n\nThe latest iteration of Nitrux includes KDE Plasma\
    \ 5.27.6 LTS, as well as KDE \n\nFrameworks 5.107, KDE Gear 23.04.2, the 6.3.9\
    \ Liquorix version of the Linux ker-\n\nnel, a simpler means of pairing your mobile\
    \ device (thanks to some new firewall \n\nrules), a new application menu entry\
    \ for the Heroic Games Launcher, support for \n\nthe NetworkManager OpenConnect\
    \ VPN plugin, the latest NVIDIA Linux x64 \n\n(AMD64/EM64T) display driver (535.54.03),\
    \ Mesa 23.2, a new open-source driver \n\nfor AMD Vulkan, Distrobox 1.5.0, MauiKit\
    \ 3.0.0, OpenRC 0.47.1, new firmware for \n\namdgpu, aut11k, brcm, cirrus, cxgb4,\
    \ i915, iwlwifi, and more.\n\n**ADMIN HPC**\n\n*http://www.admin-magazine.com/HPC/*\n\
    \n(Re)Installing Python\n\n• Jeff Layton\n\nI went to a summer camp for people\
    \ whose \n\nPython environments went pear shaped. Here \n\nis my class report.\n\
    \n**ADMIN Online**\n\n*http://www.admin-magazine.com/*\n\nSecurity Analysis with\
    \ Security Onion\n\n• Matthias Wübbeling\n\nSecurity Onion offers a comprehensive\
    \ secu-\n\nrity suite for intrusion detection that involves \n\nsurprisingly little\
    \ work.\n\nDiscover Vulnerabilities with Google Tsunami\n\n• Martin Loschwitz\n\
    \nGoogle Tsunami security scanner detects er-\n\nrors that typically signal danger\
    \ and outputs \n\nalerts. We look into how you can get the tool \n\nup and running\
    \ and even write the required \n\nplugins yourself.\n\nBuild Your Own Cloud with\
    \ antMan\n\n• Martin Loschwitz\n\nDiscover the advantages and disadvantages \n\
    \nof turning a bare metal system into the core \n\nof an antMan cloud and whether\
    \ the free \n\nCommunity Edition and its limitations will \n\nwork in your case.\n\
    \nSystem Temperature as a Dimension of \n\nPerformance\n\n• Federico Lucifredi\n\
    \nSensor tools can provide highly variable data \n\nfrom CPUs, GPUs, and a variety\
    \ of sources. \n\nWe look at some tools to verify the tempera-\n\nture of components\
    \ on diverse hardware.\n\n**Linux Magazine**\n\n*www.linux-magazine.com*\n\nLinux\
    \ News\n\n9\n\nNEWS\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023\n\n\
    **MORE ONLINE**"
