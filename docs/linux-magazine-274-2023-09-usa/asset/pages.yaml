  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_26_0.png)\n\n**Lightweight distributions\
    \ for the Raspberry Pi**\n\nNew Cards\n\n**The Raspberry Pi is a Linux machine,\
    \ and its default distribution is **\n\n**Raspberry Pi OS. But Linux is all about\
    \ choices…. ***By Hans-Georg Eßer*\n\nT\n\nhe default operating system for the\
    \ Raspberry Pi is the \n\n32-bit version of Raspberry Pi OS \\[1\\], formerly\
    \ known \n\nas Raspbian, which was short for Rasp(berry-Pi-De)\n\nbian: The distribution\
    \ is based on Debian GNU/ Linux. \n\n2022 saw the official release of a 64-bit\
    \ version, but the 32-bit \n\nedition remains the standard.\n\nMany of the other\
    \ big Linux distributions have released ARM \n\nversions that run on the Rasp\
    \ Pi, for example Ubuntu, openSUSE, \n\nFedora, Manjaro, Gentoo, Arch Linux, Slackware,\
    \ and Pop!\\_OS – \n\nsome of which will only run on the Rasp Pi 4 and Rasp Pi\
    \ 400. \n\nKali Linux and Recalbox, which I mention elsewhere in this issue, \n\
    \nare also available for the Rasp Pi. Rather than enumerating these \n\nRasp Pi\
    \ versions of everyday Linux, this article highlights some al-\n\nternative distros\
    \ you might not know about.\n\n**Finding Distributions**\n\nIf you want to get\
    \ an overview of Linux distributions for the \n\nRaspberry Pi, you can check the\
    \ *RPi Distributions* page in the \n\nEmbedded Linux Wiki \\[2\\]. However, many\
    \ of the entries on \n\nthat page are outdated. You can also use your favorite\
    \ search \n\nengine to find distributions, or you can simply download the \n\n\
    official Raspberry Pi Imager from the same web page that hosts \n\nRaspberry Pi\
    \ OS \\[1\\]: The imager lets you download various \n\ndistro images and write\
    \ them to an SD card (Figure 1).\n\nYou can also use the tool to write other images\
    \ (that you’ve \n\nfound on the web) to an SD card, and alternatively, any other\
    \ \n\ntool that writes image files to SD cards and USB sticks will do \n\nfine,\
    \ for example balenaEtcher \\[3\\] – these tools are basically \n\npretty front\
    \ ends for the dd command.\n\nMost distributions resize the filesystem so that\
    \ it fills the \n\nwhole SD card when you run the system for the first time: That\
    \ \n\nway, the images will fit on SD cards of all sizes, and you won’t \n\nwaste\
    \ any space.\n\n**LibreELEC (KODI)**\n\n“Just enough OS for KODI” is the claim\
    \ that’s prominently dis-\n\nplayed on the LibreELEC \\[4\\] homepage. KODI turns\
    \ any com-\n\nputer into a powerful multimedia player that you can extend \n\n\
    with various add-ons so that you can access TV station media \n\nlibraries (Figure\
    \ 2), tune in to live Internet radio stations, or \n\nwatch videos on YouTube,\
    \ DailyMotion, Twitch, and similar \n\nsites. Some of these services require an\
    \ API key that you need \n\nto generate on the website and then import in the\
    \ add-on.\n\nIn Raspberry Pi Imager, you will find LibreELEC under *Media *\n\n\
    *player OS* | *LibreELEC*; the image size is 128MB. Initially there \n\nare no\
    \ video or audio sources and no add-ons; take your time \n\nto find some interesting\
    \ content.\n\nAn alternative distribution with similar features is XBian \\[5\\\
    ], \n\nwhich follows the rolling release model, so you can frequently \n\nget\
    \ software updates and don’t have to wait for the next distro \n\nversion.\n\n\
    **RetroPie**\n\nRecalbox, which I described in an earlier article, lets you \n\
    \nplay old home computer and arcade games with \n\n**Figure 1:**** The official\
    \ Raspberry Pi Imager downloads **\n\n**Raspberry Pi OS and alternative OS images.**\n\
    \n**Figure 2:**** LibreELEC lets you run the KODI **\n\n**entertainment software.**\n\
    \nCOVER STORY\n\n27\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023\n\n\
    Raspberry Pi Distros"
