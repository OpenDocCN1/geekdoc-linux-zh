  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_58_0.png)\n\nThen start it manually\
    \ by typing some-\n\nthing like\n\nsudo ./scripts/start.sh --port 8001\n\n(or\
    \ some other unused port) in the run-\n\ntipi directory. You will then also need\
    \ \n\nto share this port on your router via \n\nport forwarding. To learn how\
    \ to bind \n\nyour domain to the Tipi Dashboard \n\nbefore the install, see the\
    \ “Adding a Do-\n\nmain for the Tipi Dashboard” box.\n\nBefore you start installing,\
    \ make sure \n\nyour distribution already has the cURL \n\npackage in place. This\
    \ is not the case \n\nwith, say, Ubuntu. I used an LXC con-\n\ntainer in Proxmox\
    \ with the server ver-\n\nsion of Ubuntu 22.04 for testing. During \n\nthe installation,\
    \ which takes about two \n\nminutes, Tipi creates four containers \n\nfor the\
    \ Tipi database, Redis, the re-\n\nverse proxy for SSL encryption, and \n\nthe\
    \ Tipi Dashboard. When done, you \n\nwill see a URL and, after registering, \n\
    \nyou will be taken to the Tipi user \n\ninterface.\n\n**Web Interface**\n\n*Dashboard*\
    \ is the first tab: It tells you \n\nabout the available space on the hard \n\n\
    disk, the CPU load, and the amount of \n\nRAM used (Figure 3). The second tab\
    \ \n\n*My Apps* is still empty at this point and \n\npoints you to the third tab,\
    \ the *App *\n\n*Store*. The fourth and last tab, *Settings*, \n\nis divided into\
    \ *Actions* for updating \n\nand restarting and the actual *Settings* \n\n(Figure\
    \ 4). *Source code* on the right \n\ntakes you to the project’s GitHub page, \n\
    \nwhile *Sponsors* gives you the ability to \n\nsupport the project financially.\
    \ The \n\nhalf moon next to *Sponsors* lets you \n\ntoggle to Dark Mode, and you\
    \ can log \n\nout with the icon on the far right.\n\nThe first thing you need\
    \ to do is visit \n\nthe App Store to add some applications \n\n**Figure 1:****\
    \ At the end of a short installation process, Tipi sets up the four **\n\n**required\
    \ containers.**\n\n**Figure 2:**** Tipi reveals the URL where you can access the\
    \ user interface.**\n\n**Figure 3:**** After logging in to the interface, you\
    \ will see the Dashboard **\n\n**with indicators for the storage utilization level,\
    \ the CPU load, and the **\n\n**RAM usage.**\n\nFirst, download the installation\
    \ script:\n\ngit clone https://github.com/U\n\n meienberger/runtipi.git\n\nThen\
    \ create a configuration file\n\nsudo nano /runtipi/state/U \n\n settings.json\n\
    \nand add the following lines:\n\n{\n\n\"domain\": \"yourdomain.com\"\n\n}\n\n\
    Of course, you need your own domain \n\nin the final quotes instead of the place-\n\
    \nholder. To create a valid JSON file, the \n\ntext line must be exactly one tab\
    \ stop \n\naway from the margin. Finally, save the \n\nfile, in nano, for example,\
    \ by pressing \n\nCtrl+O, and close the configuration file \n\nby pressing Ctrl+X.\n\
    \nNext, working in the runtipi directory, \n\ntype\n\nsudo ./scripts/start.sh\n\
    \nto start the installation.\n\n**Adding a Domain for the Tipi Dashboard**\n\n\
    IN-DEPTH\n\nTipi\n\n59\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023"
