    \ **\n\n**in your inbox every **\n\n**week**\n\n**Subscribe FREE **\n\n**to Linux\
    \ Update**\n\n**bit.ly/Linux-Update**\n\nYou’ll also find dbab added, which is\
    \ a dnsmasq-based ad-blocking utility that \n\nuses Pixelserv, as well as the\
    \ Plasma Firewall, which is an easy-to-use GUI inter-\n\nface for UFW or Firewalld.\
    \ This update also includes numerous bug fixes.\n\nYou can read the entire release\
    \ here *(https://nxos.org/changelog/release-an-*\n\n*nouncement-nitrux-2-9-0/*)\
    \ and download a copy of Nitrux 2.9.0 here (*https://*\n\n*sourceforge.net/projects/nitruxos/files/Release/ISO/*).\n\
    \n** Ubuntu 22.10 EOL Coming Soon**\n\nAs of July 20, 2023, Ubuntu 22.10 (Kinetic\
    \ Kudo) will no longer be supported. Users \n\nof that release are encouraged\
    \ to either upgrade to the next non-LTS release (23.04) \n\nor do a fresh install\
    \ of the latest LTS release (22.04.2).\n\nOne thing to keep in mind is that the\
    \ latest non-LTS release (23.04) is only sup-\n\nported through January 2024.\
    \ But that’s the way of the Ubuntu non-LTS releases. \n\nBecause of that, it might\
    \ behoove you to migrate to the latest LTS release, which \n\nenjoys support through\
    \ April 2032.\n\nThat doesn’t mean, however, that you are forced to go the LTS\
    \ route. If you pre-\n\nfer your Ubuntu desktop to include newer software (and\
    \ you don’t mind upgrading \n\nmore often) simply run the upgrade process, which\
    \ will take you from 22.10 to \n\n23.04. This process should take less than 30\
    \ minutes and has proved, time and \n\nagain, to be reliable. But for those who\
    \ have grown tired of upgrading every nine \n\nmonths (as that’s how long the\
    \ non-LTS releases are supported), your best bet is \n\nto go with the LTS release.\n\
    \nFor those who are curious as to what’s included with 23.04 (Lunar Lobster),\
    \ \n\nyou get Gnome 44 (and all its bells and whistles), Linux kernel 6.2, the\
    \ newly \n\nrevamped OS installer, more controls over the mouse and touchpad,\
    \ count \n\nbadges for unread notifications, and fresh software such as Firefox\
    \ 111, \n\nThunderbird 102, and LibreOffice 7.5.\n\nIf you’d rather install a\
    \ fresh LTS release, you can download it from the official \n\nUbuntu download\
    \ page (*https://ubuntu.com/download/desktop*).\n\n** Nobara Project Releases\
    \ New Version of Its **\n\n**Modified Fedora Distribution**\n\nNobara Project\
    \ is a distribution based on Fedora with a number of user-friendly \n\nfixes applied.\
    \ Not only does Nobara Linux include a number of packages (such as \n\nWine dependencies,\
    \ OBS Studio, third-party codecs for GStreamer, and NVIDIA \n\ndrivers) not found\
    \ in Fedora, but it also includes a number of fixes that make the \n\ndistribution\
    \ a much better platform for gaming, streaming, and content creation.\n\nWith\
    \ Nobara Linux, gamers and creators won’t have to spend extra time optimiz-\n\n\
    ing and configuring Linux to do what they need. It just works out of the box.\n\
    \nSome of the bug fixes and updates found in the latest version include a kernel\
    \ \n\nwith cherry-picked zen patches as well as OpenRGB, amdgpu (for pre-polaris\
    \ \n\ncards), steam deck support, Microsoft Surface support, asus-linux patches,\
    \ and \n\nmore.\n\nBeyond the kernel tweaks, you’ll also find fixes for Wayland,\
    \ the latest Mesa re-\n\nlease, glibc patched with clone3 disabled, DNF Mac parallel\
    \ downloads increased \n\nto 6, Gnome variable refresh rate patches for Mutter,\
    \ fractional scaling support, \n\nand updates for packages like *gamescape*, *goverlay*,\
    \ *mangohud*, and *bkbasalt*.\n\nOther updates include those for video codecs,\
    \ Blender, DaVinci Resolve, OBS \n\nStudio, Proton, Discord, Flatpak, Nautilus,\
    \ SELinux, RPM Fusion, Steam, OnlyOffice, \n\nand much more.\n\nThe latest iteration\
    \ is based on Fedora 38 and offers separate editions for \n\nGnome and KDE Plasma.\n\
    \nYou can read the full release notes here (*https://nobaraproject.org/*) and\
    \ down-\n\nload an ISO from the official Nobara download page (*https://nobaraproject.org/*\n\
    \n*download-nobara/*).\n\n10\n\nSEPTEMBER 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\
    \nLinux News\n\nNEWS"
