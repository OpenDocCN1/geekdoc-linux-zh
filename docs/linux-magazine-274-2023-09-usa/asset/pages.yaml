    \ Announcement**\n\nSUSE, the company behind Rancher and SUSE Enterprise Linux,\
    \ has announced it \n\nwill invest $10 million to fork publicly available Red\
    \ Hat Enterprise Linux (RHEL) \n\nand develop a RHEL-compatible distribution.\n\
    \nDirk-Peter van Leeuwen, CEO of SUSE, says, “For decades, collaboration and \n\
    \nshared success have been the building blocks of our open source community. We\
    \ \n\nhave a responsibility to defend these values.”\n\nHe then speaks to the\
    \ investment SUSE has committed to this effort by saying, \n\n“This investment\
    \ will preserve the flow of innovation for years to come and en-\n\nsures that\
    \ customers and community alike are not subjected to vendor lock-in and \n\nhave\
    \ genuine choice tomorrow as well as today.”\n\nThis all started when Red Hat\
    \ declared that CentOS Stream would be the sole \n\nrepository for public RHEL\
    \ source code. However, with CentOS Stream being a \n\nrolling release distribution,\
    \ it’s not exactly suitable for business needs.\n\nGregory Kurtzer, the original\
    \ creator of CentOS and the man behind the RHEL \n\nclone, Rocky Linux, had this\
    \ to say, “SUSE has embodied the core principles and \n\nspirit of open source;\
    \ CIQ is thrilled to collaborate with SUSE on advancing an \n\nopen enterprise\
    \ Linux standard.”\n\nThere has been no mention of a release date for this fork,\
    \ as it will take considerable \n\ntime and effort to pull off.\n\nIt might take\
    \ a few years to see the fruits of SUSE’s labor, but with a 10 million \n\ndollar\
    \ investment, you can be sure this is happening.\n\n** Solus 4.4 Now Ready for\
    \ Prime Time**\n\nSolus 4.4, aka Harmony, is here and it has plenty to offer users.\
    \ There are four \n\ndifferent versions to choose from (Budgie, Gnome, MATE, and\
    \ KDE Plasma). \n\nEach version includes all the updates that come along with\
    \ the more recent ver-\n\nsions of the desktops (Budgie 10.7.2, Gnome 43.5, MATE\
    \ 1.27, and KDE Plasma \n\n5.27.5). Although not bleeding edge releases, each\
    \ of these desktops is stable \n\nand filled with new features to enjoy.\n\nOne\
    \ welcome change is that, with KDE Plasma, the Wayland session now \n\nworks out\
    \ of the box. However, for MATE users, let it be known that the Solus de-\n\n\
    velopment team plan on sunsetting this version (because the MATE desktop isn’t\
