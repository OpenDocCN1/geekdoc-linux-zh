  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_63_0.png)\n\nperipherals can be accessed\
    \ by I2C or \n\nthe 1-Wire bus. If this is the case, the \n\nsystem can be fired\
    \ up. In the case of \n\nless serious events, such as a missing \n\nInternet connection\
    \ or an inaccessible \n\ntime server, the system continues and \n\ntries to establish\
    \ contact at a later \n\ntime. After that, the Pico lowers the \n\nwindows to\
    \ the stop position to adjust \n\nthe zero points in case the windows \n\nwere\
    \ open. The window lifters have in-\n\nternal stop switches, so I didn’t have\
    \ to \n\nconnect anything to the Pi.\n\nThe current operating values are que-\n\
    \nried in an infinite loop and checked for \n\nthe designated upper and lower\
    \ limits \n\nfor switching the actuators, followed by \n\nappropriate actions.\
    \ The system is really \n\nsmart in this way because a variety of in-\n\ndoor\
    \ and outdoor conditions play a role. \n\nFor example, knowing whether the ac-\n\
    \ncess door is open or closed is important \n\nfor ventilation, and different\
    \ switching \n\nvalues for everything depend on the time \n\nof year because climate\
    \ parameters such \n\nas insolation will vary. The controller \n\nalso provides\
    \ different hystereses de-\n\npending on the time of day, to avoid re-\n\npeated\
    \ switching. In the evening, for \n\nexample, the windows are kept closed \n\n\
    longer to store some heat for the night.\n\nThe script is also responsible for\
    \ dis-\n\nplaying the current values on the LCD \n\ndisplay of the control panel\
    \ on the outer \n\nwall and for writing logs, which you \n\nview in the web app.\
    \ Scheduled actions \n\nare reported in the message log, as well \n\nas exceptions\
    \ into a separate error log, \n\nsuch as a sensor failure or exceeding \n\nmaximum\
    \ or minimum temperature lim-\n\nits, because errors and warnings are re-\n\n\
    tained for a longer period of time. At the \n\nend of the day, then, you can find\
    \ out \n\nwhat has been going on with a quick \n\ncheck of the app or the LCD\
    \ display.\n\nThe corresponding switching values \n\nare defined as constants\
    \ in the source \n\ncode by default. If required, the con-\n\nstants can be customized\
    \ later in the \n\nEEPROM, which you can also write to \n\nfrom the web app. For\
    \ the app to work at \n\nall, the script keeps trying to reconnect \n\nat regular\
    \ intervals after a connection \n\nloss. The exact time is also resynchro-\n\n\
    nized regularly. In general, the Rasp-\n\nberry Pi’s MicroPython interpreter \n\
    \nshould never stop, if possible; you want \n\nit to keep things under control\
    \ whatever \n\nelse happens.\n\nI then routed the wires out to the lift \n\nmotors,\
    \ fan, heater, door contact, tem-\n\nperature sensors, and network connec-\n\n\
    tion through the enclosure, making sure \n\nthat everything was watertight. All\
    \ of the \n\noutdoor wires first were routed to clamp \n\nconnectors on the inside\
    \ so the control \n\nand switch enclosure could be tested \n\nseparately from\
    \ the rest of the external \n\ninstallation and be easily assembled.\n\n**Control**\n\
    \nIf you take a look at the few alternatives \n\navailable for purchase, you’ll\
    \ quickly \n\ndiscover that various controllers are \n\noften limited to thermostats\
    \ only and are \n\ndifficult to expand. However, I wanted to \n\nuse my own accessories\
    \ and be able to \n\nprogram everything. To operate the solu-\n\ntion, I use a\
    \ central control script main.py \n\nin the usual style for the Pico and added\
    \ \n\nmethods for the LCD controller and \n\nDS1307 chip to the source code.\n\
    \nDevelopment occurred in the Python \n\nThonny IDE (Figure 4), which integrates\
    \ \n\nthe Pico seamlessly. MicroPython was \n\nthe programming language of choice.\
    \ If \n\nyou have a device without MicroPython, \n\nyou first need to take care\
    \ of loading the \n\nlatest firmware. Numerous workable \n\nhow-tos for this step\
    \ can be found on the \n\nInternet.\n\nAfter applying the operating voltage, \n\
    \nthe Raspberry Pi initially checks to see \n\nwhether all of the components are\
    \ in \n\nplace and whether all of the \n\n**Figure 4:**** The Python Thonny IDE\
    \ was used to develop the code for the **\n\n**controller.**\n\n64\n\nSEPTEMBER\
    \ 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\nGreenhouse Control\n\n**MAKER**SPACE"
