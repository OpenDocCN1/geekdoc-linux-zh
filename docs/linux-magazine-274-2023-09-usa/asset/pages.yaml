  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_80_0.png)\n\n**Secure file transfers**\n\
    \n**Rymdport**\n\n**W**\n\ne looked at the bril-\n\nliant Magic Wormhole \n\n\
    some time ago. It’s a \n\ncommand-line tool that sets up \n\nan encrypted peer-to-peer\
    \ file \n\ntransfer between your machine \n\nand any target machine out in \n\n\
    the wilds of the Internet. For this \n\nto work, a network’s NAT needed \n\nto\
    \ be negotiated, as did any fire-\n\nwalls, and the connection itself \n\nneeded\
    \ to find a way to talk to \n\nthe destination. But Magic \n\nWormhole handled\
    \ all of this \n\ntransparently, with users needing \n\nto do little more than\
    \ type send \n\nfollowed by a path to a file, or re-\n\nceive, followed by a code\
    \ the \n\nsender is shown. It was brilliant, \n\nand still is, for one off ad-hoc\
    \ \n\ntransfers. But Magic Wormhole \n\nstill requires a little command-\n\nline\
    \ knowledge. While this isn’t \n\nsomething that will likely bother \n\nLinux\
    \ users, it may trouble Win-\n\ndows and macOS users trying to \n\naccept a transfer.\n\
    \nThis is where the weirdly \n\nnamed Rymdport can help. It’s \n\nan implementation\
    \ of the same \n\nwormhole protocol wrapped in-\n\nside a graphical user-interface.\
    \ \n\nIt was even called wormhole-gui \n\nfor a while, but the project has \n\n\
    diverged to use a native Go im-\n\nplementation of the protocol. \n\nThis allows\
    \ it to compile na-\n\ntively and run without any de-\n\npendencies on many different\
    \ \n\nplatforms, so you can even link \n\nto the binaries if you have con-\n\n\
    tacts you need to send a file too \n\neasily. The application is easier \n\nto\
    \ use than the command-line \n\nversion, with tabs for sending \n\nand receiving\
    \ files and file \n\nrequesters instead of tab complete for selecting files \n\
    \nand directories to transfer. Its best feature is being able \n\nto show multiple\
    \ transfers at the same time, with prog-\n\nress bars for each transfer to show\
    \ how it’s going. The \n\nlatest version creates a QR code to encode the code\
    \ \n\nword. It’s a great solution for any time you need to \n\nsend a file to\
    \ someone, and a good upgrade over the \n\noriginal Magic Wormhole.\n\n**Project\
    \ Website**\n\nhttps:// github. com/ Jacalz/ rymdport\n\nRymdport is a 6MB self-contained\
    \ download that runs on Linux, \n\nFreeBSD, Windows, and macOS.\n\n**Audio metadata\
    \ editor**\n\n**tone**\n\n**I**\n\nmage metadata is common, \n\nespecially for\
    \ photos. Most \n\nphoto processing applica-\n\ntions will have a panel showing\
    \ \n\nexposure, focus, date, location, \n\nand dozens of other attributes, all\
    \ \n\nof which are written into the file \n\nas metadata when a photo is \n\n\
    taken. Metadata like this can even \n\nbe viewed and edited on the com-\n\nmand\
    \ line, with utilities such as \n\nexiftool. But we don’t often con-\n\nsider\
    \ that audio files include a \n\nsimilar set of data related to their \n\nproduction.\
    \ This data includes \n\nalbum names, track sequence, re-\n\ncording data, artists,\
    \ and many \n\nother optional attributes. A few of \n\nthese might be displayed\
    \ by your \n\naudio player of choice, but it most \n\nlikely won’t let you edit\
    \ this data. \n\nThe tone command-line tool \n\nhelps with this. With tone, you\
    \ can \n\nparse audio metadata in bulk and \n\nedit the tags they contain. It’s\
    \ per-\n\nfect for ensuring your favorite \n\nmusic is properly tagged, and \n\
    \nthat metadata in the audio from \n\ndifferent sources remains consis-\n\ntent.\
    \ It has no dependencies, and \n\nit is ideal for running occasionally \n\non\
    \ whatever computer is hosting \n\nyour music collection.\n\nThere are two modes\
    \ of opera-\n\ntion. The dump mode will output the \n\nmetadata for the majority\
    \ of audio \n\nfiles you throw at it, from MP3 to \n\nFLAC. It can do this formatted\
    \ for \n\nthe command line – or formatted \n\ninto something more program-\n\n\
    matically useful with JSON. Argu-\n\nments can be used to include \n\nwhole directories,\
    \ to exclude spe-\n\ncific types, or even query a specific \n\nattribute through\
    \ JSON. It’s also a \n\nquick and easy way to see what \n\nan audio file is all\
    \ about if you can’t \n\ntell from its filename. You can also \n\nuse tone as\
    \ a tool to populate your \n\nown collection spreadsheet or da-\n\ntabase. To\
    \ balance the dump mode, \n\nthere’s a tag mode, which lets you set most commonly\
    \ used \n\naudio tags, including genre, artist, series, part, and title. A \n\n\
    clever auto-import option lets you set these values with \n\nstrings taken from\
    \ the filesystem path, and you could easily \n\nsubvert this with a script to\
    \ perform far more advanced op-\n\nerations. This makes tone the ideal tool to\
    \ use when you find \n\nyourself with a complex audio metadata problem.\n\n**Project\
    \ Website**\n\nhttps:// github. com/ sandreas/ tone\n\nUse **tone** to quickly\
    \ retrieve or set audio file metadata from the com-\n\nmand line, or from within\
    \ your own scripts.\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023\n\n\
    81\n\nFOSSPICKS\n\n**LINUX **VOICE"
