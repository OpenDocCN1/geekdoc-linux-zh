  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_60_0.png)\n\nnot have a wildcard function.\
    \ During the \n\ninstallation of an app, flip the *Expose *\n\n*app* switch to\
    \ share the app, and enter \n\nyour subdomain name.\n\nMeienberger describes in\
    \ detail in the \n\ndocumentation how to share Tipi’s web \n\nserver for free\
    \ via a tunnel courtesy of \n\nthe Cloudflare CDN provider. This elimi-\n\nnates\
    \ the need for router-based sharing \n\nand for changing DNS records provider-\n\
    \nside. Another section explains how to in-\n\nclude Tipi in systemd and how to\
    \ start it \n\nat computer boot time.\n\n**Conclusions**\n\nTipi is the fastest\
    \ home server manager I \n\nhave heard of, thus far. This is true for \n\nhome\
    \ network use, where Tipi is up and \n\nrunning after just a few minutes without\
    \ \n\nrequiring further expertise to install \n\napps. When it comes to access\
    \ from out-\n\nside the home network, basic knowledge \n\nof networks and domains\
    \ is absolutely \n\nessential. After all, the security of your \n\nserver is at\
    \ stake. The preparations for \n\nthis are already in place due to the avail-\n\
    \nability of a reverse proxy. You only need \n\nto provide your own domain, and\
    \ subdo-\n\nmains if needed. A DynDNS service is \n\nfine for this, and preferably\
    \ one that has \n\na wildcard function, so that you can sim-\n\nply specify subdomains\
    \ during the app \n\ninstallation without having to create \n\nthem up front.\n\
    \nDuring testing, Tipi worked flaw-\n\nlessly. The project is under constant \n\
    \ndevelopment, with new apps being \n\nadded regularly. Besides reading the \n\
    \ndocumentation, support is available on \n\nTelegram \\[7\\] or Discord \\[8\\\
    ]. You can \n\nalso put forward new apps for inclu-\n\nsion in the package. Q\
    \ Q Q\n\n**Figure 6:**** If you install a large number of apps in Tipi, it makes\
    \ sense to **\n\n**use Portainer to manage them.**\n\n**Figure 7:**** The Tailscale\
    \ VPN service can be installed on any device with-**\n\n**out any configuration;\
    \ it uses WireGuard as a VPN and connects the **\n\n**participating devices in\
    \ a mesh.**\n\n**\\[1\\]** Tipi: *https:// www. runtipi. io/*\n\n**\\[2\\]** Nicolas\
    \ Meienberger: \n\n*https:// meienberger. dev/*\n\n**\\[3\\]** Tipi App Store:\
    \ *https:// github. com/ *\n\n* meienberger/ runtipi-appstore*\n\n**\\[4\\]**\
    \ Tipi demo on GitHub: *https://github.*\n\n*com/meienberger/runtipi*\n\n**\\\
    [5\\]** Port forwarding instructions: \n\n*https:// portforward. com/*\n\n**\\\
