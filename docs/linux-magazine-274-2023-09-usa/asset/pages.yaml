  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_10_0.png)\n\n** English Translation\
    \ of Children’s Book Ada & **\n\n**Zangemann Available**\n\n*Ada & Zangemann:\
    \ A Tale of Software, Skateboards, and Raspberry Ice Cream* is \n\nan illustrated\
    \ children’s book that centers around a famous inventor, Zangemann, \n\nwho has\
    \ created inventions loved by all. The book is written by Matthias Kirschner \n\
    \nand Sandra Brandstätter.\n\nOne day a curious young tinkerer, Ada, smacks Zangemann\
    \ in the shin with her \n\nskateboard. After this incident, the famous inventor\
    \ makes a “momentous deci-\n\nsion,” but Ada sees through the ruse. The girl begins\
    \ to experiment with hardware \n\nand software and realizes how important it is\
    \ for others to be able to control \n\ntechnology.\n\nThis book is sure to interest\
    \ readers, from 6 to 106, and inspire them to tinker \n\nand help shape the world\
    \ of technology. It also serves as a cautionary tale for \n\nstanding up to bullies,\
    \ all the while offering a backdrop of ethics and comment-\n\ning on challenging\
    \ topics such as monopolies, software freedom, e-waste, and \n\nmuch more.\n\n\
    *Ada & Zangemann* was originally written in German and published by O’Reilly \n\
    \nGerman (*https://oreilly.de/produkt/ada-und-zangemann/?ref=10022*). Recently,\
    \ the \n\nbook enjoyed its first English translation and is now available from\
    \ No Starch Press \n\n(*https://nostarch.com/ada-zangemann*).\n\nThere also are\
    \ templates for children you can download (*https://fsfe.org/activi-*\n\n*ties/ada-zangemann/ada-drawing-template.en.pdf*)\
    \ that allow children (of all ages) \n\nto do things like draw what Zangemann’s\
    \ inventions might look like, drawing com-\n\nputers that might possibly be from\
    \ Zangemann, and more.\n\n^()\n\n**Steam Client Features Hardware **\n\n**Acceleration\
    \ on Linux**\n\nSteam helped to herald in an age of gaming on Linux like no other\
    \ software. But \n\nfor the longest time, Linux users had to deal with performance\
    \ issues that made it \n\nlag behind that of Windows. Animations would often lag\
    \ and the UI (as a whole) \n\nwasn’t nearly as responsive as it should be.\n\n\
    Say goodbye to those performance issues, thanks to the latest stable update of\
    \ the \n\nplatform. With the latest iteration, users can finally take advantage\
    \ of hardware accel-\n\neration on Linux. The only caveat to this new addition\
    \ is that it’s not quite stable with \n\nNVIDIA GPUs, when running on the aging\
    \ X11 protocol. Because of that, hardware \n\nacceleration is disabled (by default)\
    \ for machines using NVIDIA GPUs. At the same \n\ntime, DPI scaling may be problematic\
    \ with acceleration switched off.\n\nOther features for the new release include\
    \ better KDE Plasma support, more \n\noptions for notifications, an overhauled\
    \ in-game overlay, new notes functionality \n\n(that includes rich text formatting,\
    \ image pasting, and offline functionality), \n\ngreatly improved visuals (including\
    \ dialogs, menus, fonts, and colors), and nu-\n\nmerous bug fixes. \n\nYou can\
    \ read the full release notes from the official Steam blog (*https://steam-*\n\
    \n*community.com/games/593110/announcements/detail/3687931965598323437*). \n\n\
    To update your Steam client, open the app and go to *Steam* | *Check for Steam\
    \ Cli-*\n\n*ent Updates*. If there’s an update available, make sure to apply it\
    \ to enjoy these ex-\n\nciting new additions to the Linux version.\n\nQ Q Q\n\n\
    Linux News\n\n11\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023\n\nNEWS"
