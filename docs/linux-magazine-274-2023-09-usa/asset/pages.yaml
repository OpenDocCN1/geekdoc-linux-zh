  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_76_0.png)\n\nincludes links to advertising\
    \ services, as well as \n\ntracking cookies that point to advertising providers.\
    \ \n\nThese deep links do not point to IP addresses, but to \n\nthe DNS names\
    \ of the operators or subdomains.\n\nThis means that the user’s browser itself\
    \ ac-\n\ntively requests these banners and trackers, after \n\nresolving the DNS\
    \ address of the embedded link. \n\nThis is where DNS filtering comes in: It uses\
    \ \n\nblacklists for unwanted URLs and refuses to de-\n\nliver the IP addresses\
    \ of these URLs to the client. \n\nInstead of an IP address, the filter DNS simply\
    \ re-\n\nturns 0.0.0.0. Therefore, the browser does not \n\neven request the integrated\
    \ URL from the Internet. \n\nThe space normally occupied by the advertising \n\
    \nbanner remains empty and the trackers do not re-\n\nceive any feedback from\
    \ the client. But be careful: \n\nFor DNS filtering to work, clients and their\
    \ brows-\n\ners must use the network’s default DNS resolution \n\nand not use\
    \ their own DNS servers and methods.\n\n**Pi-hole as a DNS Filter**\n\nAs an alternative\
    \ to the options discussed so far, \n\nPi-hole filters out DNS requests for unwanted\
    \ URLs \n\non the fly, hiding advertising content and trackers \n\n(Figure 1).\
    \ Pi-hole is one of the most popular DNS \n\nfilters. As the name suggests, the\
    \ tool started life \n\nas a piece of software for the Raspberry Pi, but Pi-\n\
    \nhole runs reliably and quickly on all other platforms, \n\neven when deployed\
    \ on a larger network.\n\nSome IT managers are reluctant to use Pi-hole be-\n\n\
    cause they do not want to replace their existing DNS \n\nserver and transfer its\
    \ configuration to Pi-hole. This \n\nis especially the case if the existing DNS\
    \ server re-\n\nsolves local addresses and services such as Kerbe-\n\nros and\
    \ is perhaps also integrated with the DHCP \n\nservice. However, because the DNS\
    \ protocol has no \n\nproblems with proxy forwarding, a Pi-hole setup \n\ndoes\
    \ not need to replace the existing service at all; \n\ninstead it can act as a\
    \ kind of overlay – even on the \n\nsame machine, like in my example.\n\nMy setup\
    \ uses an existing dnsmasq server on \n\nthe application server running RHEL 8.\
    \ The service \n\nprovides the LAN with IP addresses via DHCP, lets \n\nphysical\
    \ and virtual systems boot via PXE over the \n\nnetwork, and resolves local domain\
    \ names. The \n\ndnsmasq service prefers to use the public Quad9 \n\nservice 9.9.9.9\
    \ as its upstream DNS. Unlike \n\nGoogle’s open DNS service on 8.8.8.8, Quad9\
    \ does \n\nnot log all incoming DNS requests including \n\nsource IP addresses.\n\
    \nBesides the dnsmasq service, the application \n\nserver is now also running\
    \ Pi-hole, in a Podman \n\ncontainer. In principle, there are two options for\
    \ run-\n\nning two DNS servers on the same machine. If Pi-\n\nhole runs in a container\
    \ without its own IP address, \n\nthe existing dnsmasq service must switch to\
    \ a port \n\nother than 53. Alternatively, you can let the Pi-hole \n\ncontainer\
    \ operate on a bridge network and there-\n\nfore with its own IP address. For\
    \ this example, I \n\nchose the second approach, because my applica-\n\ntion server\
    \ uses a whole bunch of other Podman \n\ncontainers with their own IP addresses\
    \ anyway.\n\n**Creating the Network Bridge**\n\nThe first step is to set up a\
    \ network bridge on the \n\nLAN adapter of the Linux server that will run the\
    \ \n\nPi-hole container later. Usually this bridge will be \n\nbr0. It also hosts\
    \ the static IP address of the phys-\n\nical application server. If you want to\
    \ bridge the \n\nprimary LAN adapter of a server, you will usually \n\nhave to\
    \ do so while the network is running. Of \n\ncourse, this can go wrong and simply\
    \ disconnect \n\nthe server from the LAN. But a small script and \n\nthe Linux\
    \ NetworkManager make sure that this \n\ntask runs smoothly. You can even bridge\
    \ the LAN \n\nconfiguration of a remote cloud server while you \n\nare connected\
    \ to it via SSH.\n\nDuring system installation, NetworkManager \n\nusually creates\
    \ a logical network with the name of \n\nthe underlying physical adapter or a\
    \ label such as \n\nWired 1. After NetworkManager has done so, \n\ntransfer the\
    \ UUID displayed by entering the nmcli \n\nconnection show command to the Bash\
    \ \n\nbridge-lan.sh script shown in Listing 1 along with \n\nthe static IP address\
    \ of the bridge and the other \n\nLAN parameters. In my example, the IP addresses\
    \ \n\nare 192.168.2.12 for the application server and \n\n192.168.12.1 for the\
    \ router. For the DNS address, \n\nenter the server itself, because this is currently\
    \ \n\nthe only DNS still active.\n\nMake the script executable and run it. It\
    \ first de-\n\nletes the old connection, configures the bridge, and \n\nfinally,\
    \ puts it into operation. After a few seconds, \n\nyou can access the server via\
    \ the bridge. The next \n\n**Figure 1:**ǡ1PVJGHN\\[2KJQNGHKNVGTU&05TGSWGUVUHQTWPYCPVGF74.UCPFJKFGUCFXGTVKUKPI\n\
    \ncontent and trackers.\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023\n\
