  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_93_0.png)\n\nmore complicated to use\
    \ and editing usually \n\ntakes longer than with a RAW developer such as \n\n\
    RawTherapee or darktable. Krita as a photo edi-\n\ntor is especially useful for\
    \ users who are not \n\ncomfortable with darktable. In some cases, the \n\nretouching\
    \ functions of RAW developers are too \n\nrudimentary. Krita is also recommended\
    \ for ex-\n\nperienced photographers who are looking for a \n\nfree Photoshop\
    \ alternative and prefer the layer-\n\nbased old-school technique, but at the\
    \ same \n\ntime do not want to do without large color \n\nspaces and adjustment\
    \ layers. Q Q Q\n\nIn the dialog box, click *Shadow* in the drop-down \n\nlist\
    \ at the top left, and then click *Select* and *OK*.\n\nNow call the *Select from\
    \ Color Range* function \n\nagain, but create a selection for the highlights this\
    \ \n\ntime. Make sure that the *Add to Current Selection* \n\noption is selected.\
    \ Then click on the new white \n\nlayer in the Layers panel. The unselected areas\
    \ will \n\nappear in red in the preview window. This gives you \n\na better approach\
    \ to adjusting the mask’s blur.\n\nThen select the *Gaussian Blur* filter and\
    \ choose a \n\nvalue of about 50 pixels for the radius. After press-\n\ning *OK*\
    \ to confirm, click on the layer below the mask \n\nagain. Create a new filter\
    \ mask layer for it and se-\n\nlect *Sharp* from the *Improve* group as the filter.\n\
    \nLast but not least, save the final edited image in \n\ntwo file formats: Krita’s\
    \ own image format, which \n\ncontains all layers, and a common graphics for-\n\
    \nmat, such as JPEG or PNG. You can call the ex-\n\nport dialog by selecting *File*\
    \ | *Export* (Figure 14).\n\nThe Krita file gives you the ability to easily \n\
    \nchange the editing steps without having to go \n\nthrough the entire editing\
    \ process again. When \n\nsaving to other graphics formats, make sure that \n\n\
    Krita does not automatically convert the image \n\nto the sRGB color space.\n\n\
    **Conclusions**\n\nKrita and the G’MIC filter collection are excellent \n\nfor\
