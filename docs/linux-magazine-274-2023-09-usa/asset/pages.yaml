  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_19_0.png)\n\n(FossaPup64 9.5 and S15Pup64\
    \ 22.12), and Alpine \n\nLinux. You can import these appliances in Virtual-\n\n\
    Box \\[12\\]. Just install VirtualBox on a Linux, Win-\n\ndows, or macOS machine\
    \ and import the .ova file \n\nthat you want to test. All VMs are configured to\
    \ \n\nuse just one of your CPU cores – if you want to \n\nspeed them up, change\
    \ the settings. In the Virtual-\n\nBox main window, select the VM you want to\
    \ mod-\n\nify, then click on *Settings*. In the new window, \n\nclick on *System*,\
    \ then select the *Processor* tab and \n\nchange the number of CPUs (Figure 9).\
    \ The .ova \n\nfiles reside on side 2 of the cover DVD. On side 1 \n\nyou find\
    \ ISO images that you can write to a USB \n\nstick in order to boot them on real\
    \ hardware.\n\n**Going Lightweight**\n\nSmall distros are great if you’re a minimalist\
    \ – or if \n\nyou have a computer with minimal system resources. However, \n\n\
    if all you want to do is make your system a bit faster, you could \n\nalso just\
    \ minimize your current distribution. Try installing a \n\nlightweight window\
    \ manager (for example JWM, IceWM, or \n\nOpenbox) instead of your current desktop\
    \ environment. KDE \n\nand Gnome are beautiful and feature-rich, but they use\
    \ a lot of \n\nmemory and CPU time, especially when you’ve activated desk-\n\n\
    top effects. Downgrading to a simple window manager will \n\ncome with a learning\
    \ curve, and you’ll lose some features, but \n\nyou gain a huge performance boost.\n\
    \nIf that is not enough, you could also try replacing LibreOffice \n\nand your\
    \ current browser with less demanding tools, which is \n\nalso what the lightweight\
    \ distributions do. For example, try \n\nusing Light \\[13\\], AbiWord, and Gnumeric\
    \ instead of Firefox \n\nand LibreOffice. If Ubuntu is your favorite distribution,\
    \ try one \n\nof the lighter Ubuntu flavors \\[14\\], for example Lubuntu (with\
    \ \n\nLXDE), Xubuntu (with Xfce), or Ubuntu Unity.\n\nFor more on small distros,\
    \ keep reading. The next two arti-\n\ncles will look at some special-purpose Linux\
    \ distributions – for \n\nPCs and the Raspberry Pi. Q Q Q\n\nfor many Docker images\
    \ because the Alpine image is so tiny \n\n(5MB). But you’re not restricted to\
    \ using it for Docker contain-\n\ners. The project website \\[11\\] lets you download\
    \ ISO images that \n\nwill boot a live Alpine Linux system, though in text mode\
    \ only. \n\nThe current version 3.18.2 is available as *standard*, *extended*,\
    \ \n\nor *netboot* image for various platforms; the standard and ex-\n\ntended\
    \ images for the x86\\_64 platform are 189MB and 762MB. \n\nOnce you’ve booted\
    \ and logged in as *root* (no password re-\n\nquired), you start the text-mode-based\
    \ setup routine with:\n\nsetup-alpine\n\nYou can skip most questions by hitting\
    \ Enter, but eventually, \n\nyou’ll be asked what disk to use: The default answer\
    \ is *none*, \n\nand you need to enter *sda* (or what other disk you want to \n\
    \nuse). When asked how to use the disk, type *sys*. The installer \n\nasks if\
    \ you agree with losing all data on the disk, and, if so, \n\nstarts to copy the\
    \ system over. When the transfer is complete, \n\nremove the DVD (or ISO image\
    \ in VirtualBox) and reboot from \n\nthe hard disk. Now you’re ready to go: Use\
    \ this Alpine installa-\n\ntion like you would use an Alpine container in Docker.\n\
    \n**Try Them in VMs or Live**\n\nOn this month’s DVD, you’ll find Open Virtual\
    \ Appliances \n\n(OVAs) of antiX Linux 22, both Puppy Linux variants \n\n**Figure\
    \ 9:**** Try a distribution in VirtualBox with the **\n\n**pre-installed OVAs\
    \ – and change the number of **\n\n**virtual CPUs to speed it up.**\n\n**\\[1\\\
