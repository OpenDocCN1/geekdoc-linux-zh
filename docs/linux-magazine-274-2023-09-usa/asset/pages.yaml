  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_94_0.png)\n\n LINUX \n\n NEWSSTAND\n\
    \n*Linux Magazine* is your guide to the world of Linux. Monthly issues are packed\
    \ with advanced technical \n\narticles and tutorials you won't find anywhere else.\
    \ Explore our full catalog of back issues for specific \n\ntopics or to complete\
    \ your collection. \n\n**Order online:** \n\nhttps://bit.ly/Linux-Magazine-Newsstand\n\
    \n**#268/March 2023**\n\n**Data Poisoning**\n\nThink computers don’t make mistakes?\
    \ If you slip some doctored-up training samples into \n\nthe mix, you can get\
    \ a fancy machine-learning system to think a dog is a cat or a 1 is an 8 – \n\n\
    and you can trigger this bad behavior through a hidden signal no one else will\
    \ notice.\n\n**On the DVD:** MX Linux 21.3 and Puppy Linux FossaPup 9.5\n\n**#269/April\
    \ 2023**\n\n**The Fetiverse**\n\nSocial media tools connect the world, bringing\
    \ us the latest news and commentary from \n\npoliticians, movie stars, community\
    \ leaders, and remote friends. But the tracking and data mining \n\nof the commercial\
    \ social media platforms has left many users searching for a better option. This\
    \ \n\nmonth we dive down into the alternative universe for social media users:\
    \ the Fediverse.\n\n**On the DVD:** EndeavourOS Cassini 22.12 and Debian 11.6\
    \ “bullseye”\n\n**#270/May 2023**\n\n**Green Coding**\n\nA sustainable world will\
    \ need more sustainable programming. This month we tell you about \n\nsome FOSS\
    \ initiatives dedicated to energy efficiency, and we take a close look at some\
    \ green \n\ncoding techniques in Go.\n\n**On the DVD:** Fedora 37 Workstation\
    \ and TUXEDO OS 2\n\n**#272/July 2023**\n\n**Open Data**\n\nAs long as governments\
    \ have kept data, there have been people who have wanted to see it and \n\npeople\
    \ who have wanted to control it. A new generation of tools, policies, and advocates\
    \ seeks \n\nto keep the data free, available, and in accessible formats. This\
    \ month we bring you snapshots \n\nfrom the quest for open data.\n\n**On the DVD:**\
    \ xubuntu 23.04 Desktop and Fedora 38 Workstation\n\n**#273/August 2023**\n\n\
    **Open Data**\n\nOn the Internet, you don't have to wait for permission to speak\
    \ to the world. Podcasting lets you \n\nconnect with your audience no matter where\
    \ they are. Whether you're in it to build community, \n\nraise awareness about\
    \ your skills, or just have some fun, the tools of the Linux environment \n\n\
    make it easy to take your first steps.\n\n**On the DVD:** Linux Mint 21.1 Cinnamon\
    \ and openSUSE Leap 15.5\n\n**#271/June 2023**\n\n**Smart Home**\n\nSmart home\
    \ solutions will save you time and energy – and, did I mention, you can amaze\
    \ your \n\nfriends. This month we show you how to take charge of your home environment\
    \ with smart \n\ndevices and open source automation software.\n\n**On the DVD:**\
    \ SystemRescue 10.0 and Linux Lite 6.4\n\n95\n\nSERVICE\n\nLINUX-MAGAZINE.COM\
    \ \n\nISSUE 274 \n\nSEPTEMBER 2023\n\nBack Issues"
