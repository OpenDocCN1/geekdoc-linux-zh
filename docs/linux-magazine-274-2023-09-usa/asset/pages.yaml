    \ box. Now the software creates a whole \n\nnew layer that covers all previously\
    \ existing layers. \n\nAssign a name of *Distortion* and click on it in the \n\
    \nLayers panel to select it. Then get started with *Fil-*\n\n*ter* | *Start GMIC-Qt*.\n\
    \nThe program’s user interface is divided into \n\nthree sections. In a relatively\
    \ narrow column in \n\nthe middle, you can see the list of available \n\nassign\
    \ a name to the new filter mask layer (e.g., \n\n*Saturation)*.\n\nFinally, I’ll\
    \ add some contrast to the image at the \n\nend of the first editing phase. You\
