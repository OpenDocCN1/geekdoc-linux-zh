    \ \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\nKernel News\n\nNEWS\n\n*“The Designated\
    \ Movable Block mech-*\n\n*anism allows ZONE\\_MOVABLE memory *\n\n*to be located\
    \ on the low memory control-*\n\n*ler to make it easier for user space alloca-*\n\
    \n*tions to land on the low memory control-*\n\n*ler. If ZONE\\_MOVABLE is only\
    \ placed on *\n\n*the low memory controller then user *\n\n*space allocations\
    \ can land in ZONE\\_*\n\n*NORMAL on the high memory controller, *\n\n*but only\
    \ through fallback after ZONE\\_*\n\n*MOVABLE is sufficiently depleted of free\
    \ *\n\n*memory which is just the reverse of the *\n\n*existing situation. The\
    \ Designated Mov-*\n\n*able Block mechanism allows ZONE\\_*\n\n*MOVABLE memory\
    \ to be located on each *\n\n*memory controller so that user space allo-*\n\n\
    *cations have equal access to each mem-*\n\n*ory controller until the ZONE\\_MOVABLE\
    \ *\n\n*memory is depleted and fallback to other *\n\n*zones occurs.”*\n\nAt a\
    \ certain point, Mel did acknowl-\n\nedge, “Ok, I did misunderstand at the \n\n\
    time that ZONE\\_MOVABLE would be \n\nsplit between the controllers to improve\
    \ \n\ninterleaving of user accesses.”\n\nBut the discussion got a bit technical\
    \ \n\nand a bit heated – at one point David \n\nHildenbrand remarked, “Adding\
    \ feature \n\nA because people don’t want to (! who-\n\never the ‘people’ are)\
    \ enable feature B? I \n\nhope I don’t have to tell you what I think \n\nabout\
    \ statements like this :)” To which \n\nFlorian Fainelli replied:\n\n*“It is not\
    \ just that NUMA is not *\n\n*wanted, it is also not a great fit, the ARM *\n\n\
    *CPU cluster and most peripherals that *\n\n*Linux cares about do have an uniform\
    \ *\n\n*memory access to the available DRAM *\n\n*controllers/ DRAM chips.*\n\n\
    *“Only a subset of the peripherals, es-*\n\n*pecially the real-time and high band-*\n\
    \n*width ones like video decoders and *\n\n*display\\[s\\] that may not be uniformly\
    \ ac-*\n\n*cessing DRAM. This stems from the fact *\n\nThe current implementation\
    \ of mova-\n\nblecore requires all of the ZONE\\_MOV-\n\nABLE memory to be located\
    \ at the high-\n\nest physical addresses of the system \n\nwhen CONFIG\\_NUMA\
    \ is not set. Allow-\n\ning the specification of a base address al-\n\nlows greater\
    \ flexibility on systems where \n\nthere are benefits.”\n\nHe added, “I don’t\
    \ believe this is really \n\nabout trying to optimize the perfor-\n\nmance of\
    \ a specific application as much \n\nas trying to prevent overall system per-\n\
    \nformance degradation from underuti-\n\nlized memory bandwidth.” Elsewhere he\
    \ \n\nremarked, “the approach taken here is \n\nvery much a ‘poor man’s’ approach\
    \ that \n\nattempts to improve things without re-\n\nquiring the ‘heavy lifting’\
    \ required for a \n\nmore complete solution.”\n\nHe further explained:\n\n*“What\
    \ is of interest to Broadcom cus-*\n\n*tomers is to better distribute user space\
    \ *\n\n*accesses across each memory controller to *\n\n*improve the bandwidth\
    \ available to user *\n\n*space dominated work flows. With no *\n\n*ZONE\\_MOVABLE,\
    \ the BCM7278 SoC with *\n\n*1GB of memory on each memory control-*\n\n*ler will\
    \ place the 1GB on the low address *\n\n*memory controller in ZONE\\_DMA and *\n\
    \n*the 1GB on the high address memory con-*\n\n*troller in ZONE\\_NORMAL. With\
    \ this lay-*\n\n*out movable allocation requests will only *\n\n*fallback to the\
    \ ZONE\\_DMA (low memory *\n\n*controller) once the ZONE\\_NORMAL *\n\n*(high\
    \ memory controller) is sufficiently *\n\n*depleted of free memory.*\n\n*“Adding\
    \ ZONE\\_MOVABLE memory *\n\n*above ZONE\\_NORMAL with the current *\n\n*movablecore\
    \ behavior does not improve *\n\n*this situation other than forcing more *\n\n\
    *kernel allocations off of the high mem-*\n\n*ory controller. User space allocations\
    \ *\n\n*are even more likely to be on the high *\n\n*memory controller.*\n\n*that\
    \ the memory controller(s) on the *\n\n*System-on-Chip we work with have a *\n\
    \n*star topology and they schedule the ac-*\n\n*cesses of each DRAM client (CPU,\
    \ GPU, *\n\n*video decoder, display, Ethernet, PCIe, *\n\n*etc) differently in\
    \ order to guarantee a *\n\n*certain quality of service.”*\n\nThere was no resolution\
    \ during the \n\ndiscussion. It seems that the advocates \n\nof Designated Movable\
    \ Blocks feel that \n\nthis feature is simply an extension of ex-\n\nisting behaviors,\
    \ some of which were \n\ncoded by the very people criticizing \n\nthose behaviors\
    \ now. On the other hand, \n\nthe critics of Doug’s patch feel that the \n\nunderlying\
    \ thing Doug wants to enhance \n\nshould really go away entirely, or at least\
    \ \n\nshould be redesigned to use the better \n\nand more generic NUMA approach.\n\
    \nThe interesting thing for me about \n\nthis whole conversation is that it is\
    \ fun-\n\ndamentally a debate between the better \n\ndesign (NUMA) versus the\
    \ current real-\n\nity (UMA). If I think about how Linus \n\nTorvalds comes down\
    \ on these issues, \n\nit’s not clear at all that he favors one \n\nover the other.\
    \ In many cases, yes, he’ll \n\ninsist on the better design, even if it \n\nmeans\
    \ heaping a ton of work on the \n\nheads of people trying to implement \n\none\
    \ little feature. On the other hand, \n\nsometimes the “better design” is a large\
    \ \n\nand abstract thing that has no actual \n\nusers, while the current reality\
    \ is some-\n\nthing clean and easy to fix or imple-\n\nment, and Linus will choose\
    \ to go with \n\nthe current reality.\n\nIt’s unclear whether Doug’s patch \n\n\
    would ever come to Linus’s attention – it \n\nseems that Mel is the gatekeeper\
    \ in this \n\nparticular case, having written the origi-\n\nnal code. But it doesn’t\
    \ seem like a clear-\n\ncut decision, at least as far as this partic-\n\nular\
    \ email discussion went. Q Q Q\n\nQ Q Q"
