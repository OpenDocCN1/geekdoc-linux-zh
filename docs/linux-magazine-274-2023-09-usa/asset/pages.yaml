    Without the distribution-specific \\--aur ad-\n\ndition, the installer uses the\
    \ package from \n\nthe Ubuntu archives, if available (Figure \n\n5). Packages\
    \ installed in this way can be \n\nlaunched from the Gnome application list. \n\
    \nApx, unlike its relative Apt, does not re-\n\nquire root privileges thanks to\
    \ Podman.\n\nFlatpaks can be either be installed \n\nusing the Gnome Software\
    \ app manager \n\nor via the termi-\n\nnal, which is not \n\n**Figure 5:**** Apx\
    \ lets you install applications from distributions such as Arch Linux or Fedora\
    \ in Distrobox **\n\n**containers. Here, the **\\--aur** option specifies that\
    \ the **nano** package should be installed from the AUR.**\n\n**Figure 4:****\
    \ The *****Sub System***** tab in the Vanilla OS **\n\n**Control Center lets you\
    \ keep track of containers **\n\n**and the applications installed in them.**\n\
    \n**Figure 3:**** During the initial setup, you can decide **\n\n**which package\
    \ management system you want to **\n\n**use in addition to Apx.**\n\n34\n\nVanilla\
