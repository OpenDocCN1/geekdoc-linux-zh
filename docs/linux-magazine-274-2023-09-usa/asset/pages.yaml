  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_46_0.png)\n\nundergraduate thesis\
    \ about 10 years \n\nago. While the project basically stalled \n\nafter initial\
    \ development, you can still \n\nfind it (along with a demo) on GitHub \n\n\\\
    [1\\] (Figure 2).\n\nBarry developed MathLex because he \n\nfound math entry systems\
    \ like MathML \n\nand even LaTeX too slow to use, too \n\ncomplex, and sometimes\
    \ not very good \n\nat preserving semantics (the actual \n\nmeaning of each element\
    \ of a for-\n\nmula). He designed MathLex to let \n\nusers enter complex formulas\
    \ using a \n\nsyntax as close as possible to hand-\n\nwritten math, but unambiguous\
    \ in its \n\nmathematical meaning, without giving \n\nup compatibility \n\nwith\
    \ popular \n\nstandards like \n\nMathML or Math-\n\nJax (Figure 3). In \n\naddition,\
    \ Barry \n\nmade MathLex \n\ncompatible with \n\nany browser or \n\noperating\
    \ system, \n\nwithout the por-\n\ntability issues of \n\ntechnologies like \n\n\
    Flash.\n\nIn this article, I will show you how to \n\ninstall MathLex on Linux,\
    \ how to use it \n\nto write formulas, and also how to \n\nembed it into any web\
    \ page.\n\n**Installing MathLex**\n\nUnfortunately, MathLex is not packaged \n\
    \nin distribution-native formats like .deb or \n\n.rpm. The easiest way to install\
    \ it on your \n\nLinux box is to build it locally using the \n\nYarn JavaScript\
    \ package manager \\[2\\].\n\nTo get a working copy of MathLex on \n\nyour computer,\
    \ start downloading all the \n\nsource code, with git or as a single ZIP \n\n\
    archive. Once the code is in a folder on \n\nyour computer, go to the folder from\
    \ the \n\ncommand line \n\nand type the fol-\n\nlowing two com-\n\nmands at the\
    \ \n\nprompt:\n\nyarn\n\nyarn build\n\nWith any luck, installation should com-\n\
    \nplete in a minute or two. On Ubuntu, \n\nhowever, I came across the Yarn error\
    \ \n\nknown as “There are no scenarios; must \n\nhave at least one.” It turns\
    \ out that \n\nUbuntu (and possibly other Linux dis-\n\ntributions) does not install\
    \ the default \n\nversion of Yarn recommended by its de-\n\nvelopers. Instead\
    \ it installs a different \n\nversion found inside another package \n\ncalled\
    \ cmdtest|. You can remove this \n\npackage and then install the original \n\n\
    one for Yarn, as explained on Stack \n\nOverflow \\[3\\].\n\n**Using MathLex**\n\
    \nThe most difficult part of writing formu-\n\nlas with MathLex is knowing all\
    \ the \n\nmath you will need to use and all of \n\nMathLex’s functions. In regards\
    \ to learn-\n\ning the MathLex syntax, Yarn will place \n\na file called index.html\
    \ in the build/ \n\ndemo folder (index.html is the HTML \n\npage shown in Figures\
    \ 1 and 2).\n\nIn addition to the Syntax and Topic \n\nlinks at the top of Figure\
    \ 2, the bot-\n\ntom part of the HTML page contains \n\nmany sample formulas that\
    \ you can \n\nload in the entry box and modify as \n\nyou wish (Figure 4), convert\
    \ to other \n\nformats like SVG (Figure 5), or even \n\nuse to learn how the native\
    \ format of \n\nMathLex works (Figure 6). Thanks to \n\nthose tips and examples,\
    \ and to the \n\nfact that the rendering and parse \n\nboxes in Figure 2 change\
    \ as you type, \n\nattempting to write formulas in the \n\ndemo is by far the\
    \ quickest and most \n\n**Figure 3:**** MathLex also supports the MathML markup\
    \ **\n\n**language and the MathJax library.**\n\n**Figure 4:**** You can render\
    \ the formulas in several for-**\n\n**mats, depending on your needs.**\n\n**Figure\
    \ 5:**** The SVG version of the same formula **\n\n**shown in the previous figures.**\n\
    \n**Figure 6:**** For study or documentation purposes, you **\n\n**can also view\
    \ the plain source that MathLex uses to **\n\n**represent formulas.**\n\nIN-DEPTH\n\
    \nMathLex\n\n47\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023"
