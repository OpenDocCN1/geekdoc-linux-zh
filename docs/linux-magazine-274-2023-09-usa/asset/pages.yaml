  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_4_0.png)\n\n**56**** Topgrade**\n\n\
    Topgrade detects all the package \n\nmanagers installed on a system \n\nand executes\
    \ them one by one \n\nat the command line.\n\n**58**** Tipi**\n\nTipi gives you\
    \ complete control of \n\nmore than 100 applications and \n\nservices. A mouse\
    \ click is all it takes \n\nto install the apps.\n\n**62**** Greenhouse Control**\n\
    \nYou can safely assign some greenhouse tasks to a \n\nRaspberry Pi Pico W, such\
    \ as controlling ventilation, \n\nautomating a heater, and opening and closing\
    \ windows.\n\n**68**** TensorFlow-KI and Rasp Pi**\n\nYou don’t actually need\
    \ a powerful computer system to use AI. \n\nWe show what it takes to benefit from\
    \ AI on the Raspberry Pi \n\nand what tasks the small computer is suitable for.\n\
    \n**73**** Welcome**\n\nThis month in Linux Voice.\n\n**75**** Doghouse – Trademarks**\n\
    \nA trademark verifies to customers that a product \n\nreally is yours, which\
    \ also helps them trust they’ll get \n\nthe quality associated with your brand.\n\
    \n**76**** Pi-hole**\n\nSupporting browser plug-ins, network-based DNS \n\nblockers\
    \ like Pi-hole help protect you against online \n\ntracking and unwanted content.\n\
    \n**80**** FOSSPicks**\n\nThis month Graham looks at Qtractor 0.9.34, tone, \n\
    \nerdtree, Tiny Tiny RSS, codespelunker, KOReader, \n\nJumpy, and more!\n\n**86****\
    \ Tutorial – Krita**\n\nFew users are aware that Krita, the popular open source\
    \ \n\npainting program, is also great for editing photos.\n\n**The Best of Small\
    \ Distros**\n\nNowadays, all the attention is on big, enterprise \n\ndistributions\
    \ supported by professional developers \n\nat big, enterprise corporations, but\
    \ small distros \n\nare still a thing. If you’re shopping for a Linux to \n\n\
    run on old hardware, if you just want a simpler \n\nsystem that is more responsive\
    \ and less cluttered, \n\nor if you’re looking for a special Linux tailored for\
    \ \n\na special purpose, you’re sure to find inspiration in \n\nour look at small\
    \ and specialty Linux systems.\n\n**Maker**Space\n\n**@linux\\_pro**\n\n**@linuxpromagazine**\n\
    \n**SEE PAGE 6 **\n\n**FOR DETAILS**\n\nALL ON A \n\nDOUBLE-SIDED \n\nDVD!\n\n\
    IN-DEPTH\n\n**Linux Magazine**\n\n**@linuxmagazine**\n\n**95**Back Issues\n\n\
    **96** Events\n\n**97** Call for Papers\n\n**98**Coming Next Month\n\n5\n\nLINUX-MAGAZINE.COM\
    \ \n\nISSUE 274 \n\nSEPTEMBER 2023"
