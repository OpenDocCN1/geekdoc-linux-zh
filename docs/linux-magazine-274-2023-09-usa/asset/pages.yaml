  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_78_0.png)\n\nbut if users turn off\
    \ their workstations overnight, \n\nthere is a high chance of them receiving a\
    \ differ-\n\nent address the next morning. The administrator \n\ncan reliably\
    \ trace a request back to the source for \n\nthe time of an IP lease.\n\n**Finishing\
    \ Up in the Browser**\n\nThanks to DNS-based Pi-hole, you have already re-\n\n\
    moved a large part of the unwanted content from \n\nthe data stream. However,\
    \ some content remains \n\nif it can hide from the filter or it is actually included\
    \ \n\nin the original source URL. The only thing that \n\nhelps to get rid of\
    \ the last remaining trackers and \n\nads is a browser plug-in. From the mass\
    \ of avail-\n\nable add-ons, we picked two at this point: \n\nGhostery and AdNauseam.\n\
    \nGhostery is one of the most popular and reliable \n\nad filters. Besides the\
    \ plug-in for Chrome and \n\nFirefox, Ghostery is also available as a ready-to-\n\
    \nuse browser, based on the Chrome source files. \n\nThis also means that Ghostery\
    \ runs on smart-\n\nphones and tablets. It makes a big difference \n\nwhether\
    \ you watch YouTube videos on your \n\nphone in the unfiltered app or via the\
    \ regular You-\n\nTube website within the filtered Ghostery browser \n\nfor Android\
    \ or iOS.\n\nAdNauseam adds a special feature to the plain-\n\nvanilla filter\
    \ function. Although the filter does not \n\ndisplay the embedded banners in the\
    \ browser, the \n\nplug-in clicks on all advertising links in the back-\n\nground.\
    \ Advertisers seek to present personally tai-\n\nlored ads to users. This means\
    \ that advertisers \n\ncan create a profile of a user’s browsing behavior \n\n\
    by analyzing the kind of ads that users click on. \n\nAdNauseam waters down your\
    \ profile: If you \n\nseem to be interested in everything from sports \n\nbetting\
    \ to laxatives, the advertiser can’t create a \n\npersonalized profile at all.\n\
    \nThis filter is recommended if you have already \n\ncreated profiles for your\
    \ browser and you are re-\n\npeatedly confronted with the same advertising \n\n\
    topics. However, the tool is controversial, because \n\nadvertisers often have\
    \ to pay for banner clicks – \n\nwhereas you as a user then do not get to see\
    \ the \n\npaid content. Google has therefore removed Ad-\n\nNauseam from the Chrome\
    \ Store and you need to \n\nset up the plug-in manually as a Chrome user. The\
    \ \n\nautomatic installer is still available for Firefox.\n\n**Conclusions**\n\
    \nIf you are fed up with the flood of ads on the Inter-\n\nnet and do not want\
    \ to be tracked, the combina-\n\ntion of a DNS black hole and a browser plug-in\
    \ will \n\nbe a big help. As a side effect, tools such as Pi-\n\nhole can also\
    \ fend off phishing attacks, as many \n\nof the known phishing URLs are already\
    \ black-\n\nlisted. Ghostery, as an established add-on, then \n\nalso removes\
    \ the remnants of things that Pi-hole \n\ncannot block. Q Q Q\n\nthat has a hybridized\
    \ LAN adapter. With the MAC \n\nand IP address defined in the systemd unit, the\
    \ \n\ncontainer always starts up with the same network \n\nparameters, regardless\
    \ of the host system. Dur-\n\ning operation, Pi-hole makes virtually no changes\
    \ \n\nto the underlying filesystem. This is why you can \n\nuse built-in tools\
    \ to copy the two directories of the \n\nPi-hole setup to a backup drive or a\
    \ second host \n\nregularly and in a relatively simple way, with rsync, \n\nfor\
    \ example. It is also possible to store the Pi-hole \n\ndata in an NFS share so\
    \ multiple hosts can ac-\n\ncess the information.\n\n**Customize DNS and DHCP\
    \ Service**\n\nFor Pi-hole to cooperate with the existing DNS/ \n\nDHCP configuration,\
    \ some changes to the exist-\n\ning settings are required. First you need to change\
    \ \n\nDHCP option 6 (DNS server) of your DHCP service \n\nto the Pi-hole server.\
    \ With dnsmasq, the option \n\nthen looks like this:\n\ndhcp-option=6,192.168.2.2\n\
    \nSimilarly, dnsmasq can use other DNS servers \n\nthan the host it is running\
    \ on as forwarders. \n\nYou need to list all the required DNS servers in \n\n\
    an /etc/nameservers.conf file as follows:\n\nnameserver 9.9.9.9\n\nnameserver\
    \ 1.1.1.1\n\nnameserver 149.112.112.112\n\nnameserver 1.0.0.1\n\nThen specify\
    \ this list in your dnsmasq.conf file:\n\nresolv-file=/etc/nameservers.conf\n\n\
    Now the underlying host itself could also use the \n\nPi-hole server for name\
    \ resolution, but a second-\n\nary DNS is absolutely essential. When you restart\
    \ \n\nthe Pi-hole container, the host must be able to re-\n\nsolve the Docker\
    \ registry URL to do this. The host \n\nmust not rely solely on the Pi-hole server.\n\
    \n**Avoiding Legal Worries**\n\nUnlike a proxy filter, filtering using Pi-hole\
    \ does \n\nnot directly interfere with your users’ data pack-\n\nets. Despite\
    \ this, Pi-hole logs the systems’ DNS \n\ncalls. An administrator could use the\
    \ Pi-hole logs \n\nand the DHCP leases of the underlying dnsmasq \n\nto determine\
    \ exactly when a specific user issued \n\na specific DNS query. The request can\
    \ be traced \n\nback to the workstation via the MAC address. \n\nShort lease times\
    \ in the DHCP segment help to \n\nmake this more difficult. For example, if you\
    \ \n\nspecify a time of four hours as the lease time, cli-\n\nents need to request\
    \ an IP address from the \n\nDHCP server every four hours. The client usually\
    \ \n\ntries to renew and reuse the already existing IP, \n\n\\[1\\] Pi-hole: \n\
    \n*https://pi-hole. net*\n\n\\[2\\] GitHub Pi-hole filter \n\nlists: \n\n*https://github.com/*\n\
    \n*topics/pihole-ads-list*\n\n**Info**\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\n\
    SEPTEMBER 2023\n\n79\n\nPI-HOLE\n\n**LINUX **VOICE"
