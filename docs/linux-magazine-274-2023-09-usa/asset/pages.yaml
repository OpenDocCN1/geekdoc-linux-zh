    : {\"mac\": true }}\\]}\n\n{\"type\": \"tuning\", \"capabilities\": {\"mac\":\
    \ true }}\\]}\n\n\"routes\": \\[{\"dst\": \"0.0.0.0/0\"} \\]}}, {\"type\": \"\
    tuning\", \"capabilities\": {\"mac\": true }}\\]}\n\n**Listing 2: **RWDAPGVEQPHNKUV\n\
