  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_2_0.png)\n\nThings have been pretty\
    \ quiet in Free Software for a few \n\nyears now. When I started this job, Linux\
    \ and the little \n\nmystery ship we call Open Source were fighting for sur-\n\
    \nvival. Microsoft, SCO, and other large companies were \n\nbringing all their\
    \ powers to break up that delicate balance \n\nof code freedom established by\
    \ the GNU Public License \n\n(GPL). Much of the battle was fought through PR stunts\
    \ \n\nand misinformation, but some of it was fought in court-\n\nrooms – and the\
    \ GPL always won.\n\nBut things could be heating up again. Red Hat recently \n\
    \nannounced that only paying customers will have access to \n\nRed Hat Enterprise\
    \ Linux (RHEL) source code, and appar-\n\nently, if the customer tries to exercise\
    \ the rights to that \n\ncode as defined in the GPL, Red Hat will terminate the\
    \ cus-\n\ntomer agreement. This Kafkaesque bit of legal juggling \n\nseems like\
    \ a blast from the combative past. Only this time, \n\nthe lawyers have had 15\
    \ additional years to perfect their \n\nskills at surgical hair splitting.\n\n\
    Will Red Hat’s lawyers win the day? I don’t know, but I \n\ncan tell you two things.\
    \ This matter won’t get decided \n\nbased on anyone’s idea of what is moral or\
    \ affirming for \n\nthe community. And it also won’t get decided based on \n\n\
    anyone’s idea of what is essential or necessary for Red \n\nHat’s business. The\
    \ question of whether Red Hat and its \n\nparent company IBM can get away with\
    \ this power move \n\nwill hinge on one thing alone: the GPL license and the \n\
    \ncase law that surrounds it.\n\nI’m actually surprised at the number of commentators,\
    \ \n\nmany from within the FOSS community, who say, “Red \n\nHat has to do this,”\
    \ and then they launch into a lot of busi-\n\nness arguments, as if they weren’t\
    \ paying attention to \n\nthese past 20 years. You can’t really make a valid business\
    \ \n\nargument for violating a software license. Can you picture \n\nsomeone saying,\
    \ “Of course I had to pirate this Windows \n\ninstance. It doesn’t make business\
    \ sense to pay the license \n\nfee.” You can try it if you want to, but if you\
    \ get caught, \n\nyour “business” argument won’t do much for you in court.\n\n\
    On the other hand, the broad pronouncements that IBM/ \n\nRed Hat is violating\
    \ the “spirit” of open source seem a \n\nlittle weak – as if IBM cares what you\
    \ think of their spirit. \n\nTo a multinational corporation, “spirit” is a motif\
    \ for sales \n\nmeetings and television commercials – use it when it \n\nhelps,\
    \ and lose it when you see an opportunity.\n\nThe license is what matters, and\
    \ it is surprisingly difficult to \n\nfind any solid information on the licensing\
    \ issues. The rea-\n\nson for that is that people don’t really know. The GPL looks\
    \ \n\nsimple on the surface, but it is a complex and precarious \n\nthing. Did\
    \ IBM find a way around it? The best analysis I’ve \n\nseen so far is the post\
    \ by Bradley Kuhn of the Software \n\nFreedom Conservancy, who writes, “Red Hat’s\
    \ lawyers \n\nclearly take the position that this business model complies \n\n\
    with the GPL (though we aren’t so sure), on grounds that \n\nnothing in the GPL\
    \ agreements requires an entity keep a \n\nbusiness relationship with any other\
    \ entity. They have fur-\n\nther argued that such business relationships can be\
    \ termi-\n\nnated based on any behaviors – including exercising rights \n\nguaranteed\
    \ by the GPL agreements. Whether that analysis \n\nis correct is a matter of intense\
    \ debate, and likely only a \n\ncourt case that disputed this particular issue\
    \ would yield a \n\ndefinitive answer on whether that disagreeable behavior is\
    \ \n\npermitted (or not) under the GPL agreements.” \\[1\\]\n\nOf course, the\
    \ other question is, what will the competitors \n\ndo? Red Hat undertook this\
    \ step to eliminate their clone \n\ncompetitors. Did they overplay their hand?\
    \ Many eyes are \n\non recent RHEL clones Alma and Rocky. So far AlmaLinux \n\n\
    has adapted by dropping their claim of being 1:1 compati-\n\nble with RHEL and\
    \ will instead aim at “Application Binary \n\nInterface compatibility.” Conversely,\
    \ the attitude of the \n\nRocky team appears to be “See you in court, Red Hat.”\
    \ \n\nThey have announced that “Our legal advisors have reas-\n\nsured us that\
    \ we have the right to obtain the source to any \n\nbinaries we receive, ensuring\
    \ that we can continue advanc-\n\ning Rocky Linux in line with our original intentions.”\
    \ \\[2\\]\n\nI wonder if someone in one of those blue-suited IBM deci-\n\nsion\
    \ rooms mapped out the possibility that, instead of hav-\n\ning fewer competitors,\
    \ the company would end up with \n\n*more* competitors because of this decision.\
    \ Now none other \n\nthan Oracle is lecturing them on the importance of commu-\n\
    \nnity values. (When Oracle is tacking to your left, you know \n\nyou have veered\
    \ far.) And SUSE, perhaps Red Hat’s biggest \n\ncompetitor, has announced that\
    \ it is forking RHEL and will \n\ninvest $10 million on maintaining an independent\
    \ version \n\nthat will be available forever without vendor lock-in.\n\nAll of\
    \ this makes it sound like Red Hat miscalculated, at \n\nleast when you are peeking\
    \ out through our Linux lens. But \n\nthere is one more thing to remember: SUSE\
    \ might be Red \n\nHat’s biggest competitor, but it isn’t IBM’s. IBM’s biggest\
    \ \n\ncompetitor is Microsoft, and in the Microsoft space, EULAs \n\nand code\
    \ restrictions are not really controversial or even \n\nnoteworthy – they’re just\
    \ another part of the landscape.\n\nLICENSE MATTERS\n\nJoe Casad, Editor in Chief\n\
    \n**\\[1\\]** A Comprehensive Analysis of the GPL Issues with the RHEL \n\nBusiness\
    \ Model: *https:// sfconservancy. org/ blog/ 2023/ jun/ 23/ *\n\n* rhel-gpl-analysis/*\n\
    \n**\\[2\\]** Keeping Open Source Open: \n\n*https:// rockylinux. org/ news/ keeping-open-source-open/*\n\
    \n**Info**\n\nDear Reader,\n\n3\n\nEDITORIAL\n\nLINUX-MAGAZINE.COM \n\nISSUE 274\
    \ \n\nSEPTEMBER 2023\n\nWelcome"
