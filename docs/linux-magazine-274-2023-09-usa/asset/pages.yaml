  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_69_0.png)\n\nAs a final step, you\
    \ need to integrate \n\nthe graphical Code::Blocks integrated \n\ndevelopment\
    \ environment (IDE) \\[8\\] \n\ninto your system (Figure 2). With its \n\nhelp,\
    \ you can then use TensorFlow Lite \n\nand OpenCV to recognize and classify \n\
    \nobjects by drawing on various sample \n\nnetworks. These capabilities apply\
    \ not \n\nonly to photos, but also to livestreams \n\nfrom the connected camera.\
    \ \n\nCode::Blocks supports the C and C++ \n\nprogramming languages and is therefore\
    \ \n\nideally suited for AI applications. The \n\ncommand\n\nsudo apt-get install\
    \ codeblocks\n\ninstalls the package and automatically \n\ncreates a starter on\
    \ the desktop and in \n\nthe Raspberry Pi OS menu system.\n\n**Examples**\n\n\
    After completing the installation, you \n\ncan test some sample scenarios by \n\
    \ndrawing on a number of prefabricated \n\nand trained code examples from Q-en-\n\
    \ngineering; all of these achieve very \n\ngood results on the Raspberry Pi 4,\
    \ \n\neven in livestreams \\[9\\]. Code::Blocks is \n\nused here, too, and it\
    \ even provides \n\nslide shows of screenshots in the tuto-\n\nrials to help newcomers\
    \ gain some ini-\n\ntial experience with AI applications \n\n\\[10\\]. Instead\
    \ of the sample photos and \n\nmodels that can be classified. How-\n\never, you\
    \ can only create models in the \n\n“full-fledged” TensorFlow variant. Ten-\n\n\
    sorFlow Lite and a Raspberry Pi are \n\nnot suitable because you need masses \n\
    \nof compute power. The recommended \n\napproach is therefore to create new \n\
    \nmodels from reference data with GPU \n\nprocessors because they will perform\
    \ \n\nthe required computations far faster \n\nthan CPUs. Also, the models generated\
    \ \n\nin TensorFlow are not compatible with \n\nTensorFlow Lite. You will need\
    \ to con-\n\nvert them for use in the Lite variant. \n\nGoogle has already created\
    \ numerous \n\nmodels for TensorFlow Lite that you \n\ncan deploy on the Raspberry\
    \ Pi. The \n\nTensorFlow project website provides \n\ndetailed information \\\
    [5\\] on \n\nhow to convert models to the \n\nTensorFlow Lite format.\n\n**OpenCV**\n\
    \nThe Open Computer Vision Li-\n\nbrary (OpenCV) \\[6\\] has another \n\nset of\
    \ libraries that you can use \n\non your Raspberry Pi. OpenCV \n\nis used for\
    \ gesture, face, and \n\nobject recognition and classifi-\n\ncation. The OpenCV\
    \ deep neu-\n\nral network (DNN) module \n\nworks with pre-trained net-\n\nworks\
    \ for this purpose and can \n\nbe used in combination with \n\nTensorFlow Lite.\
    \ To install OpenCV on \n\nthe Raspberry Pi, though, you need to \n\nresolve a\
    \ large number of dependen-\n\ncies, and you need to specify manually \n\na large\
    \ number of flags during the \n\nbuild. This difficulty prompted Dutch \n\nAI\
    \ specialists at Q-engineering \\[7\\] to \n\npublish a freely available and BSD-li-\n\
    \ncensed script on GitHub that lets you \n\nwork around these steps. To install\
    \ and \n\nrun this OpenCV script, enter:\n\n$ wget https://github.com/U\n\n Qengineering/Install-OpenCV-U\n\
    \n Raspberry-Pi-64-bits/raw/main/U\n\n OpenCV-4-5-5.sh\n\n$ sudo chmod 755 ./OpenCV-4-5-5.sh\n\
    \n$ ./OpenCV-4-5-5.sh\n\n$ cd tensorflow/lite/tools/make/downloads\n\n$ rm -rf\
    \ flatbuffers\n\n$ g it clone -b v2.0.0 --depth=1 --recursive \n\nhttps://github.com/google/flatbuffers.git\n\
    \n$ cd flatbuffers\n\n$ mkdir build\n\n$ cd build\n\n$ cmake ..\n\n$ make -j4\n\
    \n$ sudo make install\n\n$ sudo ldconfig\n\n$ cd ~\n\n$ rm tensorflow.zip\n\n\
    **Listing 2: ****Installing FlatBuffers**\n\n**Figure 2:**** The Code::Blocks\
    \ IDE helps you use AI models.**\n\n70\n\nSEPTEMBER 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\
    \nTensorFlow AI on the Pi\n\n**MAKER**SPACE"
