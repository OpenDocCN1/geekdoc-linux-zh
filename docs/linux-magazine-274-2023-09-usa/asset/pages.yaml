  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_82_0.png)\n\n**JSON viewer**\n\n**fx**\n\
    \n**J**\n\nSON is the JavaScript Ob-\n\nject Notation format, used \n\nby JavaScript\
    \ program-\n\nmers to describe data structures \n\nwithin an easily readable text\
    \ for-\n\nmat. Of course, JavaScript pro-\n\ngrammers still use JSON, but the\
    \ \n\nformat long ago escaped the \n\nconfines of web-based client-\n\nside programming\
    \ to become a \n\n“commonly used data inter-\n\nchange format,” alongside YAML,\
    \ \n\nXML, and even CSV. As a result, \n\nmany API and command-line \n\ntools,\
    \ alongside vital infrastruc-\n\nture such as journald, can output \n\ntext-based\
    \ data as JSON so that \n\nit can more easily be interpreted \n\nby another programming\
    \ lan-\n\nguage while still making sense to \n\nhumans. This is great for ma-\n\
    \nchines, but not so brilliant for hu-\n\nmans, and it’s the life of the \n\n\
    JSON-loving human that this bril-\n\nliant little utility wants to make \n\neasier.\n\
    \nThe problem with JSON is that \n\nwhile it is readable as raw text, \n\nhumans\
    \ find it hard to navigate. \n\nLike JavaScript and many other \n\nprogramming\
    \ languages, the hi-\n\nerarchy and scope of data in a \n\nJSON file is represented\
    \ by curly \n\nbrackets, double-quotes, and a \n\nvariety of other elements. A\
    \ \n\nJSON-aware editor can make \n\nthis much easier to parse, but so \n\ntoo\
    \ can tools such as jq and fx. \n\nAnd while jq can convert JSON \n\ninto something\
    \ easier to read, fx \n\nmakes it easier to read and eas-\n\nier to navigate interactively.\
    \ It \n\ncan do this either with JSON \n\npiped into it or from a file, and \n\
    \nwhen the JSON is opened you \n\ninitially see only the global \n\nenclosing\
    \ brackets for the entire file. Press cursor-right to \n\nopen this, and cursor-down\
    \ to navigate into the next sec-\n\ntion. In this way, you can unfold and fold\
    \ the hierarchy to \n\nbetter see how everything fits together. You can search\
    \ \n\ntoo with */* and *n* and *N* keys for next and previous. It’s \n\nquick\
    \ and easy, and it also reveals how much more useful \n\nJSON is than flat text\
    \ – even to humans.\n\n**Project Website**\n\nhttps:// github. com/ antonmedv/\
    \ fx\n\nThe **fx** command uses a theme to display the JSON output, and \n\nthemes\
    \ are easily created and readily shared.\n\n**Command-line search**\n\n**codespelunker**\n\
    \n**T**\n\nhe fzf fuzzy finder has \n\nchanged the way many \n\nof us search for\
    \ things \n\nfrom the command line. In par-\n\nticular, it helps when you can’t\
    \ \n\nremember exactly what it is \n\nyou’re looking for or can only \n\nremember\
    \ a certain path. It \n\nworks well on its own like this, \n\nbut it works much\
    \ better when \n\nit’s integrated into your a shell \n\nfor file and history search,\
    \ or \n\nwithin an editor such as Vim for \n\nsearching documents. \n\nCodespelunker,\
    \ run from the \n\ncommand line as cs and easily \n\ninstalled via go install,\
    \ is an-\n\nother great alternative and is \n\nbetter suited to finding things\
    \ \n\nwithin files without resorting to \n\npiping things through grep. This \n\
    \nis because it’s more like both a \n\nGoogle search and search re-\n\nsult page\
    \ embedded into your \n\nconsole for local searching, \n\nand, as with Google,\
    \ it’s the per-\n\nfect solution when you can’t re-\n\nmember exactly what it\
    \ is \n\nyou’re looking for.\n\nCodespelunker will search \n\nthrough the contents\
    \ of any text \n\nfile located at or below your cur-\n\nrent file system location.\
    \ It’s \n\nbeen designed to work best with \n\ncode, but it’s equally happy with\
    \ \n\nany text. It does this live, rather \n\nthan caching an index, and yet \n\
    \nremains incredibly quick and re-\n\nactive. The TUI-based com-\n\nmand-line\
    \ user interface also \n\nmakes it easy to use. Typing cs \n\non its own will\
    \ open the interac-\n\ntive search, which is a little like \n\nfzf for the contents\
    \ of your doc-\n\numents. Typing a search term \n\nwill start to display results\
    \ and \n\nyou can use a rank command to \n\nadjust the order they’re listed \n\
    \nwhile you’re within the search. Rather than typing cs on \n\nits own, you can\
    \ provide a search term as an argument, \n\nand the non-interactive output will\
    \ list the results with \n\nthe search terms highlighted. There are options for\
    \ \n\nexact searches, fuzzy searches, and negating two \n\nsearches with NOT.\
    \ You can even use regular expres-\n\nsions, and there are further arguments for\
    \ including and \n\nexcluding directories. It works brilliantly, and is signifi-\n\
    \ncantly easier to type than cat | grep | fzf.\n\n**Project Website**\n\nhttps://\
    \ github. com/ boyter/ cs\n\nIf search results on the command line aren’t enough,\
    \ **cs** also offers \n\nan HTTP mode you can use locally through a web browser.\n\
    \nFOSSPICKS\n\n**LINUX **VOICE\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER\
    \ 2023\n\n83"
