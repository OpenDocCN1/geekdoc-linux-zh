  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_85_0.png)\n\nretouching with Krita\
    \ works. (The original image \n\ncan be found online \\[2\\].)\n\n**Customizing\
    \ the Settings**\n\nBefore you start working, you will want to change \n\nsome\
    \ preferences in Krita. First, make sure that \n\nthe application is using the\
    \ correct screen profile. \n\nThen enable a brighter user interface, because the\
    \ \n\ndark default setting makes it difficult to judge the \n\nimage brightness.\
    \ Last but not least, display the \n\nimage overview, which helps you move the\
    \ view \n\nmore easily when zoomed in on the preview.\n\nTo set the screen profile,\
    \ start Krita and click *Set-*\n\n*tings* in the menu. After that, select *Color\
    \ Manage-*\n\n*ment* on the left sidebar of the settings window. \n\nThen click\
    \ *Display* in the *Color Management* settings \n\noptions and uncheck *Use system\
    \ monitor profile* \n\n(Figure 1): My experience is that automatic detection \n\
    \nof the system monitor profile does not work reliably.\n\nFurther down, you will\
    \ see a list of monitors con-\n\nnected to your PC, each with a drop-down list.\
    \ Un-\n\nfold the drop-down list next to the monitor you are \n\nusing and select\
    \ the appropriate screen profile. It \n\nmay not appear in the list at first.\
    \ To import it, click \n\n*Import profile*, navigate to the profile, select it,\
    \ and \n\nthen click *Open*. Now the name of the profile should \n\nappear in\
    \ the drop-down list next to the monitor. \n\nPress *OK* to confirm the change\
    \ and restart Krita.\n\nTo change the color of the user interface, just \n\nclick\
    \ *Settings* | *Themes* | *Krita neutral*. For a dis-\n\nplay of the image overview,\
    \ navigate to *Settings* | \n\n*Dockers* and enable the *Overview* item at the\
    \ very \n\nbottom of the list. The overview then docks onto \n\nthe interface\
    \ top right under the dock for the ex-\n\ntended color picker. To view it, navigate\
    \ to the \n\n*Overview* tab.\n\n**Importing Raw Data**\n\nTo open the sample file\
    \ provided for download, \n\nclick the button with the small folder icon in the\
    \ top \n\nleft corner or use the keyboard shortcut Ctrl+O. Be-\n\ncause the sample\
    \ image is a raw file, the RAW Im-\n\nport dialog appears (Figure 2). In principle,\
    \ there is \n\nlittle you need to change in the settings. If you use a \n\n**F**\n\
    \new photographers are aware that Krita, the \n\npopular painting program \\[1\\\
    ], can also be \n\nused to edit photos. Considering that \n\nmany illustrators\
    \ and graphic designers use Pho-\n\ntoshop or Gimp for digital painting and drawing,\
    \ \n\nthis is not surprising.\n\nIn fact, Krita’s approach is identical to that\
    \ of \n\nclassic layer-based image editors in terms of the \n\nbasic functions.\
    \ However, it has several pretty sig-\n\nnificant advantages compared with Gimp.\
    \ On the \n\none hand, Krita lets you edit photos in large color \n\nspaces like\
    \ Adobe RGB. This is especially impor-\n\ntant if you want to print a high-quality\
    \ image with \n\nintense colors. On the other hand, Krita has filter \n\nmasks,\
    \ a counterpart to Photoshop’s adjustment \n\nlayers. They allow for far more\
    \ comfortable image \n\nediting, because numerous effects can be ad-\n\njusted\
    \ retroactively and masks can be edited di-\n\nrectly in the layer.\n\nKrita is\
    \ also one of only a few graphics pro-\n\ngrams that support 10-bit screen output.\
    \ In com-\n\nbination with a 10-bit capable monitor, this gives \n\nyou a far\
    \ more accurate display of fine color nu-\n\nances and gradients. In the following,\
    \ I will use a \n\nconcrete example to demonstrate how photo \n\nBY ANNA SIMON\n\
