  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_59_0.png)\n\ninfo page about the app.\
    \ In addition to \n\nthe version, you will find links to the \n\nhomepage and\
    \ the license. Click *Install* \n\nand then use the *Expose app* switch to \n\n\
    choose whether you want Tipi to be \n\naccessible outside of your own net-\n\n\
    work. For this, the domain you use \n\n(either static or DynDNS-based) must \n\
    \nhave an A record. You can make this \n\ndecision later on in the application\
    \ \n\n*Settings* (Figure 4).\n\nIn my case, I first installed the *File *\n\n\
    *Browser* app to be able to access the \n\nfiles on my home server. This was fol-\n\
    \nlowed by the *Mealie* recipe database, \n\ninto which I imported some of my\
    \ reci-\n\npes as a test (Figure 5). To see which \n\ncontainers are installed,\
    \ I also added \n\n*Portainer* (Figure 6). Depending on the \n\napp, the installation\
    \ took between a \n\nfew seconds and a few minutes and in-\n\nvolved just two\
    \ mouse clicks. The con-\n\nfiguration files of the installed apps are \n\nstored\
    \ in the runtipi folder below \n\napp-data in the app.env file in your \n\nhome\
    \ directory.\n\nTailscale is another app worthy of \n\nmention. This is a VPN\
    \ service that you \n\ncan install on any device without hav-\n\ning to configure\
    \ any settings (Figure 7). \n\nTailscale sets up WireGuard as a VPN \n\nand connects\
    \ all participating devices in \n\na mesh.\n\n**Update**\n\nIn the main menu under\
    \ *Settings*, Tipi \n\nlets you know when a new version be-\n\ncomes available.\
    \ In this case, a single \n\nclick on *Update* is all you need; the \n\ntool does\
    \ all the work. It automatically \n\nstops, updates, and restarts the con-\n\n\
    tainers in the background. Pressing *Re-*\n\n*start* triggers a restart of the\
    \ Tipi \n\nserver. The sudo ./scripts/stop.sh \n\ncommand in the runtipi folder\
    \ stops \n\nthe application. To remove Tipi com-\n\npletely, you also need to\
    \ delete the \n\nruntipi file. The file contains informa-\n\ntion about the containers\
    \ used in the \n\ndocker-compose.yml file.\n\nTipi’s documentation, while not\
    \ yet \n\ncomplete, provides support for topics \n\nsuch as customizing apps \\\
    [6\\]. A section \n\non sharing apps outside of your home \n\nnetwork was missing\
    \ at the time of pub-\n\nlication, but the process does not cause \n\nany problems.\
    \ If you want to share sev-\n\neral apps, it makes sense to create sub-\n\ndomains\
    \ in advance if your domain does \n\nand services. Tipi lists the apps with \n\
    \ntheir icons, a short description, and a \n\ncategory. Above the list there is\
    \ a \n\nsearch mask, along with a drop-down \n\nCategory list to filter the apps\
    \ shown \n\ninto one of 14 categories.\n\n**Applications**\n\nTipi offers numerous\
    \ well-known ap-\n\nplications such as DokuWiki, Home \n\nAssistant, Joplin, Jellyfin,\
    \ Nextcloud, \n\nPi-hole, Plex, Syncthing, or WireGuard. \n\nClick on one of the\
    \ icons to open an \n\n**Figure 4:**** The most important settings for Domain,\
    \ DNS, IP, and Reposi-**\n\n**tory are grouped in *****Settings*****. This is\
    \ also where you can assign a differ-**\n\n**ent storage path for apps and any\
    \ data generated by them.**\n\n**Figure 5:**** Mealie lets you import recipes\
    \ from popular blogs quite easily. You **\n\n**can also create meal plans and\
    \ generate shopping lists from the recipes.**\n\n60\n\nTipi\n\nSEPTEMBER 2023\
    \ \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\nIN-DEPTH"
