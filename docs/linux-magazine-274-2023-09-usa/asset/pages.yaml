  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_62_0.png)\n\nexternally from the special\
    \ Python \n\nThonny integrated development environ-\n\nment (IDE) to the controller,\
    \ and to fin-\n\nish the job, you need to transfer your \n\ncode to the module\
    \ permanently.\n\nOne advantage of microcontrollers \n\nover computers with filesystems\
    \ is their \n\nrobustness, with no risk of the SD card \n\nor hard drive being\
    \ damaged by a power \n\nfailure. You do not need to shut down \n\nyour controller\
    \ in a defined way before-\n\nhand when switching it off and can in-\n\nstead\
    \ simply press the power switch. In \n\nreturn, you have to make do with fewer\
    \ \n\nresources and without a battery-buffered \n\nreal-time clock in the case\
    \ of the Pico. \n\nLuckily, this restriction did not matter \n\nfor my control\
    \ system, because I de-\n\nsigned in a real-time clock (RTC) to ex-\n\nchange\
    \ information with a time server \n\non the Internet. The project also had \n\n\
    electrically erasable programmable \n\nread-only memory (EEPROM) to store \n\n\
    the latest setting values.\n\n**Setup**\n\nThe LCD display and the RTC are con-\n\
    \nnected to Pico over an I2C bus and the \n\ntemperature sensors over a 1-Wire\
    \ bus. \n\nThe transistors are connected upstream \n\nof the LEDs that occupy\
    \ three ports. To \n\nallow the Pico to control the large con-\n\nsumers such\
    \ as the window lifters and \n\nheater (230V), a relay board with six in-\n\n\
    puts was also controlled by the Rasp-\n\nberry Pi GPIOs. In this use case, the\
    \ Pico \n\nsits in a housing and on its own small \n\ncircuit board. All other\
    \ components (see \n\nthe “Parts List” box) were connected by \n\nplug connectors\
    \ and put in a DIN top-hat \n\nrail housing (Figure 2). The idea was to \n\nkeep\
    \ things manageable for any service \n\nwork and to be able to disconnect all\
    \ the \n\ncomponents easily.\n\nA 5V power supply powers the entire \n\ncircuitry,\
    \ and 12V is required for the win-\n\ndow motors. In case of activity, the cur-\n\
    \nrent there needs to be relatively high. To \n\navoid the power supply being\
    \ constantly \n\nidle, and to remove the need for DC/ DC \n\nconverters, the 12V\
    \ motor power supply \n\nis only switched on with a relay when \n\nneeded. Most\
    \ of the time, I make do with \n\na frugal 5V circuit to save money.\n\nMost of\
    \ the hardware is housed in a \n\nprefabricated enclosure – a fuse box with \n\
    \na weatherproof seal (Figure 3). I wanted \n\nto take advantage of a DIN top-hat\
    \ rail \n\nhousing to be able to arrange and ex-\n\nchange individual modules\
    \ easily side by \n\nside. Whatever didn’t fit beside the circuit \n\nbreaker\
    \ and power supply units was lo-\n\ncated in empty housings for the top-hat \n\
    \nrail (e.g., LCD display, switches, and \n\nLED). Enough space was left in their\
    \ \n\nhousings to install the Pi, the relay board, \n\nand the rest of the electronics\
    \ closer to the \n\nrear, resulting in an uncluttered front side.\n\n•^( Raspberry\
    \ Pi Pico W)\n\n•^( LCD panel with I2C controller)\n\n•^( DS1307 real-time clock\
    \ with AT24C32N )\n\nEEPROM\n\n•^( DS18B20 temperature sensor)\n\n•^( 12V electric\
    \ window lifters (2))\n\n•^( 6x relay board)\n\n•^( LED board)\n\n•^( Transistors,\
    \ resistors)\n\n•^( 5V and 12V supply (for top-hat rail))\n\n•^ ^(Automatic circuit\
    \ breaker (for top-hat rail))\n\n•^( Various empty housings (for DIN rail))\n\n\
    •^( Housing (fuse box))\n\n•^( Wiring, installation material)\n\n**Parts List**\n\
    \n**Figure 2:**** The components in this setup are connected to the Pico **\n\n\
    **board by plug connectors.**\n\n**Figure 3:**** All components are mounted on\
    \ DIN top-hat rails in a weather-**\n\n**proof housing.**\n\n63\n\nLINUX-MAGAZINE.COM\
    \ \n\nISSUE 274 \n\nSEPTEMBER 2023\n\nGreenhouse Control\n\n**MAKER**SPACE\n\n\
    **MAKER**SPACE"
