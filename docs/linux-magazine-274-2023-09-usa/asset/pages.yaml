  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_32_0.png)\n\nVanilla OS differs significantly\
    \ from \n\ntypical Ubuntu derivatives. The first vi-\n\nsual impression is colorful\
    \ and reminds \n\nyou more of Fedora than Ubuntu in \n\nterms of the layout (Figure\
    \ 1). Vanilla \n\nOS’s strategy also tends more towards \n\nFedora Silverblue,\
    \ but with different \n\ningredients. At first glance, however, \n\nthe system’s\
    \ special features are not \n\napparent.\n\nVanilla OS is designed to be mostly\
    \ im-\n\nmutable. By default, only /home, /etc, /\n\nopt, and /var can be written\
    \ to in a sepa-\n\nrate partition. The system maps them in \n\na container. This\
    \ means that you can \n\neasily access configuration files, settings, \n\nand\
    \ other important data that the in-\n\nstalled packages need. The same applies\
    \ \n\nto the files you create.\n\n**Double Root**\n\nABRoot, Vanilla OS’s core\
    \ component, \n\nmanages two partitions, each 20G in size \n\nand identified as\
    \ a and b (Figure 2). They \n\neach consist of an identical root filesys-\n\n\
    tem partitioned with Btrfs, which hosts \n\nthe core applications. The system\
    \ sets \n\nthe active partition to read-only, which is \n\nwhy Vanilla OS requires\
    \ at least 50GB of \n\nfree disk space.\n\nIf possible, you will want to give\
    \ the \n\nsystem more space, because 50GB only \n\nleaves you with 8GB for /home.\
    \ Because \n\nthe installer does not currently let you \n\ncreate partitions manually,\
    \ it’s important \n\nto be careful here. At install time, the \n\nsetup formats\
    \ the entire assigned hard \n\ndisk and deletes all the existing data. \n\nThis\
    \ is due to change in the next version, \n\nVanilla OS 2.0 Orchid \\[3\\].\n\n\
    **From Apt to Apx**\n\nAnother Vanilla OS core component is \n\nApx, an Apt-based\
    \ package manager de-\n\nveloped in-house. Apx installs software \n\nfrom the\
    \ Ubuntu archives, but it also lets \n\nyou use packages from other distribu-\n\
    \ntions such as Fedora or Arch Linux. To \n\ndo this, Apx creates containers based\
    \ on \n\nthe Distrobox tool that isolate applica-\n\ntions from the root filesystem\
    \ \\[4\\].\n\nVanilla OS distinguishes between up-\n\ndates and upgrades, the\
    \ latter being a \n\njump from, say, the current Ubuntu \n\n22.10 to the upcoming\
    \ version 23.04. \n\nUpdates take place weekly or monthly, \n\ndepending on the\
    \ settings, and (if so de-\n\nsired, automatically) introduce small im-\n\nprovements,\
    \ bug fixes, and security up-\n\ndates in the background.\n\nThese updates control\
    \ the Vanilla \n\nSystem Operator (VSO) component. If \n\nyou select the *SmartUpdate*\
    \ option, \n\nVSO determines the update time by \n\nchecking if the device is\
    \ currently rela-\n\ntively idle and, in the case of laptops, \n\nif the battery\
    \ level will let the proce-\n\ndure complete. You can configure VSO \n\nin *Vanilla\
    \ Control Center* | *Updates* or \n\nat the command line.\n\n**From A to B**\n\
    \nABRoot takes on the role of interacting \n\nbetween the two root filesystems.\
    \ Up-\n\ngrades are installed on the currently in-\n\nactive and therefore writable\
    \ root parti-\n\ntion. At the next reboot, this partition \n\nbecomes the active\
    \ system. If something \n\ngoes wrong, Vanilla OS mounts the pre-\n\nviously active\
    \ partition again. Android \n\nand Chrome OS, which have used this \n\napproach\
    \ for a long time without any \n\nproblems, were the role models for this.\n\n\
    With the image available at the time of \n\ntesting in January 2023, the first\
    \ update \n\nvia VSO did not work and aborted with \n\nan error message relating\
    \ to *SmartUp-*\n\n*date*, even if the feature was disabled. In \n\nthis case,\
    \ just use Apt instead:\n\n$ sudo abroot shell\n\n$ apt update\n\n$ apt upgrade\n\
    \n$ exit\n\nUsing Apt should be reserved for emer-\n\ngencies and special actions\
    \ such as in-\n\nstalling a kernel module or a driver. \n\nPackage installations\
    \ using this approach \n\nare not recommended, because they take \n\neffect directly\
    \ on the host and not in a \n\ncontainer. To keep the system and appli-\n\ncations\
    \ completely separate, Flatpak (an \n\nalternative package management sys-\n\n\
    tem) is used to install the individual ap-\n\nplications. Flatpak picks up the\
    \ packages \n\nfrom the Flathub repository \\[5\\]. Vanilla \n\nOS also comes\
    \ with everything it needs \n\nto use AppImages. You can choose one \n\nof the\
    \ two systems or both during the \n\ninitial setup (Figure 3).\n\n**Distro Out\
    \ of the Box**\n\nApplications that are not available via \n\nthe package management\
    \ systems \n\nmentioned can be obtained from Arch \n\nLinux, Fedora, or Ubuntu\
    \ using Distro-\n\nbox. The Vanilla OS roadmap also en-\n\nvisages extending the\
    \ strategy to Alpine \n\nLinux, Void Linux, and openSUSE. Dis-\n\ntrobox creates\
    \ distribution containers \n\n**Figure 2:**** Two root partitions and a home directory\
    \ require at least 50GB of disk space.**\n\nVanilla OS\n\n33\n\nLINUX-MAGAZINE.COM\
    \ \n\nISSUE 274 \n\nSEPTEMBER 2023\n\nREVIEW"
