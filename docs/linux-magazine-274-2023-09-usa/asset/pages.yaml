  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_77_0.png)\n\nLast but not least, let’s\
    \ create two directories, etc \n\nand dnsmasq, below /var/pods/pihole, where Pi-hole\
    \ \n\nwill immediately store the configuration files. Now \n\nuse systemd to start\
    \ the container by typing sys-\n\ntemctl start pihole. The first call initially\
    \ creates \n\nthe required configuration files and directory struc-\n\ntures before\
    \ the Pi-hole DNS starts its work. To be \n\nable to manage the Pi-hole service\
    \ via web UI, you \n\nfirst need to define an admin password. To do this, \n\n\
    log into the running container on the Podman host:\n\npodman exec -it pihole /bin/bash\n\
    \nAt the following prompt, type the admin command \n\npihole -a -p to set a new\
    \ admin password. Then \n\nstart the web interface in your client’s browser, in\
    \ \n\nmy case on http://192.168.2.2, and log in with \n\nthe previously assigned\
    \ password. Go to the *Set-*\n\n*tings* menu and then to the *DNS* tab when you\
    \ get \n\nthere. In the basic configuration, Pi-hole uses \n\nGoogle as its upstream\
    \ DNS server. Switch off the \n\nGoogle server in the upstream list and enter\
    \ the \n\ninternal DNS server in the dialog on the right, in \n\nmy example, 192.168.2.12#53.\
    \ Now Pi-hole can re-\n\nsolve both internal and external names. When ev-\n\n\
    erything is running, enable autostart for the Pi-\n\nhole service by typing systemctl\
    \ enable pihole.\n\nYou can see which domains Pi-hole filters in the \n\n*Adlist*\
    \ tab. A default list of about 160,000 domains \n\nis defined here. More filter\
    \ lists can be found on \n\nGitHub \\[2\\]; the YouTube\\_ads\\_pi-hole list is\
    \ highly \n\nrecommended. You can simply add lists via their \n\nURLs. Pi-hole\
    \ automatically updates them once a \n\nweek. If you want to initiate a manual\
    \ update, you \n\nwill find the *Update Gravity* option in the Tools \n\nmenu.\n\
    \nIn the *Domains* tab, \n\nyou can then add your \n\nown individual entries \n\
    \nor regex selections to \n\nthe white- or blacklist. \n\nFor example, the basic\
    \ \n\nfilter isolates Amazon \n\ndevices on your LAN \n\nfrom their metrics col-\n\
    \nlectors (device-met-\n\nrics-us-2.amazon.com). \n\nThis affects the func-\n\n\
    tion of Alexa and com-\n\npany and can slow \n\ndown the response of \n\nthese\
    \ devices. If you do \n\nnot want this, you need \n\nto explicitly allow the \n\
    \ndomain.\n\nAs a Podman con-\n\ntainer, Pi-hole can basi-\n\ncally run on any\
    \ ma-\n\nchine and in any VM \n\nstep is to add a container network that Podman\
    \ can \n\nuse for the Pi-hole container and others later on.\n\nPodman manages\
    \ its networks in the /etc/cni/\n\nnet.d/ directory. To create a bridge network\
    \ for the \n\nbr0 bridge, you first need to generate a suitable \n\nconflist file\
    \ – see pub\\_net.conflist in Listing 2. \n\nYou can now launch containers with\
    \ their own IP \n\naddresses on the pub\\_net network.\n\n**Configuring Filter\
    \ Lists**\n\nArmed with the appropriate bridge and a Pod-\n\nman network for it,\
    \ you now define the Pi-hole \n\ncontainer as a systemd service to let it start\
    \ up \n\nautomatically when the application server is re-\n\nstarted (see Listing\
    \ 3). In my sample setup, the \n\nPi-hole container is given an IP address of\
    \ \n\n192.168.2.2 and a matching MAC address, which \n\nis composed of the vendor\
    \ string 52:54 – typical \n\nof KVM virtual machines (VMs) – and an IP ad-\n\n\
    dress in hexadecimal format, C0:A8:02:02.\n\n#!/bin/bash\n\nnmcli conn delete\
    \ <UUID of network interface card>\n\nnmcli conn add type bridge con-name br0\
    \ ifname br0\n\nnmcli conn modify br0 ipv4.addresses '192.168.2.12/24'\n\nnmcli\
    \ conn modify br0 ipv4.gateway '192.168.2.1'\n\nnmcli conn modify br0 ipv4.dns\
    \ '192.168.2.12'\n\nnmcli conn modify br0 ipv4.method manual\n\nnmcli conn add\
    \ type ethernet slave-type bridge \\\\\n\n con-name bridge-br0 \\\\\n\n ifname\
    \ enp1s0 master br0\n\nnmcli conn up br0\n\n**Listing 1: **Bash Script bridge-lan.sh\n\
    \n{\"cni Version\": \"0.4.0\", \"name\": \"pub\\_net\", \"plugins\": type: \"\
    bridge\", \"bridge\": \"br0\", \"ipam\": { \n\n\"type\": \"host-local\", \"ranges\"\
    : \\[\\[ { \"subnet\": \"192.168.2.0/24\", \"gateway\": \"192.168.2.1 }\\]\\],\n\
