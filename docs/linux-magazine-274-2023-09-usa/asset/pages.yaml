  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_45_0.png)\n\nmathematical formula\
    \ can be much \n\nslower than writing the same formula \n\nby hand. MathLex \\\
    [1\\], a little-known \n\nJavaScript utility, helps solve this prob-\n\nlem. It\
    \ parses math input notation into \n\na syntax tree and then renders the no-\n\
    \ntation as several target outputs, which \n\nyou can then use on your web pages\
    \ \n\n(Figure 1).\n\nMathLex was developed by Matthew \n\nJ. Barry along with\
    \ Philip B. Yasskin \n\nand others as part of Barry’s \n\nM\n\nath helps us to\
    \ make sense of \n\nthe world and make it a bet-\n\nter place. The language of\
    \ \n\nmath (formulas and equa-\n\ntions) is universal, but it is also univer-\n\
    \nsally difficult to render handwritten for-\n\nmulas into digital form for the\
    \ computer.\n\nThirty years ago, math graduate stu-\n\ndents would pay programmers\
    \ to ren-\n\nder their beautifully drawn mathemati-\n\ncal formulas for the computer\
    \ because \n\nthe process took twice as long as the \n\noriginal drawing, regardless\
    \ of the \n\navailable software. Even today, enter-\n\ning a complex \n\n**A web-based\
    \ math entry system**\n\nMath Magic\n\n**MathLex lets you easily transform handwritten\
    \ math formulas to **\n\n**digital format and use them on the web. ***By Marco\
    \ Fioretti*\n\n**Figure 1:**** In addition to the formula, the MathLex demo **\n\
    \n**also shows how it parses the formula internally, as **\n\n**well as the formula’s\
    \ LaTeX and Sage versions.**\n\n**Figure 2:**** The MathLex demo is an HTML page\
    \ that **\n\n**will work in any browser.**\n\n**Lead Image © chachar, 123RF.com**\n\
    \n46\n\nIN-DEPTH\n\nSEPTEMBER 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\nMathLex"
