  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_87_0.png)\n\nThen, in the lower left\
    \ corner of the Layers win-\n\ndow, click the small upside-down triangle next\
    \ to \n\nthe button with the plus sign. From the menu, se-\n\nlect the *Add Filter\
    \ Mask* option; this will launch the \n\nfilter mask dialog. You will see the\
    \ list of available \n\nfilters divided into several groups on the left, and \n\
    \nthe setting options for the currently selected filter \n\non the right.\n\n\
    The *Color Adjustment* filter (Figure 4) belongs to \n\nthe first group *Adjust*.\
    \ This is actually the curve \n\ntool. You will see a rectangle dividing a diagonal\
    \ \n\nline rising from the bottom left to the top right. The \n\ndark pixels of\
    \ the image are assigned to the left \n\nhalf of the rectangle, and the light\
    \ pixels to the \n\nright. To lighten the whole image, set a point in the \n\n\
    middle of the diagonal or curve and drag it \n\nupwards.\n\nThis approach brightens\
    \ the pixels with me-\n\ndium brightness more than the rest. But only \n\nbrighten\
    \ the photo to the point where the bright-\n\nest areas of the image reach the\
    \ desired bright-\n\nness. Clicking *OK* applies the effect. You can see \n\n\
    such as various selection tools, the brush, or the \n\ncrop tool.\n\nYou will\
    \ find other dockable dialog windows to \n\nthe right of the preview window. The\
    \ layers, the \n\noverview, the brush settings, and the tool options \n\nare the\
    \ most important for photographers; the \n\ntool options’ content varies depending\
    \ on the se-\n\nlected tool. In the status bar below the preview \n\nwindow, Krita\
    \ displays a variety of information, in-\n\ncluding the image size and the working\
    \ color \n\nspace.\n\nWhen working with Krita, the first thing you \n\nneed to\
    \ do is duplicate the background layer. If \n\npossible, perform each individual\
    \ editing step on a \n\nseparate layer. This makes it easier to undo or ad-\n\n\
    just an editing step.\n\nIn the Layers panel, after opening an image, you \n\n\
    will see a single layer, the *Background* layer. Right-\n\nclick this layer with\
    \ the mouse and choose *Dupli-*\n\n*cate Layer or Mask* from the context menu.\
    \ Now \n\nyou will see a second layer in the Layers panel \n\nnamed *Copy of Background*.\
    \ It is located above \n\n*Background* and hides it.\n\nFirst, you will need to\
    \ lighten the image. To do \n\nthis, place a filter mask with the *Color Adjustment*\
    \ \n\nfilter on the *Copy of Background* layer. Where pos-\n\nsible, perform each\
    \ editing step as a filter mask. \n\nThis is a special type of layer that has\
    \ several ad-\n\nvantages over normal layers. It does not contain \n\npixels,\
    \ only setting parameters for effects that \n\napply to the layer below. Filter\
    \ masks make it eas-\n\nier to adjust the setting options or the intensity of\
    \ \n\nthe filter. In addition, you can paint directly on the \n\nlayer with the\
    \ brush to exclude certain areas of the \n\nimage from the effect.\n\nTo create\
    \ a filter mask for a specific layer, first \n\nselect the layer – in this case\
    \ *Copy of Background*. \n\n**Figure 4:** In the first phase of brightness correction,\
    \ you need to lighten the image slightly using the tone curves.\n\n**Figure 5:**\
    \ In the second step, use the *Color Range* tool to \n\nselect the dark areas\
    \ of the image.\n\nSEPTEMBER 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\n88\n\
    \nTUTORIAL – KRITA\n\n**LINUX **VOICE"
