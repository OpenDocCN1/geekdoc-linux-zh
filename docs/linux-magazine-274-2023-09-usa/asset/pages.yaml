  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_68_0.png)\n\ndoesn’t matter whether\
    \ you choose one \n\ndesigned specifically for the small com-\n\nputer that connects\
    \ directly or use an ar-\n\nbitrary USB camera. If you prefer an ex-\n\nternal\
    \ camera, however, make sure the \n\nRaspberry Pi OS supports your choice.\n\n\
    The first step is to download the latest \n\n64-bit release of Raspberry Pi OS\
    \ \\[3\\] and \n\ntransfer it to a microSD card with at least \n\n16GB. To do\
    \ so, either use a graphical \n\ntool such as balenaEtcher or enter the \n\nfollowing\
    \ command at the prompt:\n\ndd if=</path/to/U\n\n operating system image> U\n\n\
    \ of=/dev/mmcblk0 bs=4M\n\nMake sure the microSD card supports \n\nfast read and\
    \ write mode. It should at \n\nleast comply with the Class 10 specifica-\n\ntion.\
    \ Boot your Raspberry Pi from the \n\nmicroSD card and turn to the basic \n\n\
    graphical configuration of the system. \n\nRun the usual commands to update the\
    \ \n\noperating system:\n\nsudo apt-get update\n\nsudo apt-get upgrade\n\nIf you\
    \ want to use an external camera for \n\nobject detection, connect it to the Pi\
    \ and \n\ninstall an application that accesses the \n\ncamera on the system, such\
    \ as the \n\nCheese graphical program or the \n\nfswebcam command-line tool. Also,\
    \ if you \n\nare using an external USB camera, make \n\nsure that its resolution\
    \ is sufficient: The \n\nfewer clear-cut distinguishing features \n\nthe objects\
    \ to be detected have, the \n\nhigher the camera resolution needs to \n\nbe. If\
    \ you use the Raspberry Pi’s own \n\ncamera, it must be connected to the \n\n\
    camera port of the single-board com-\n\nputer before you boot the system for the\
    \ \n\nfirst time.\n\n**Installation**\n\nBecause of the fast pace of technical\
    \ de-\n\nvelopments in the field of deep learning \n\nand the many components\
    \ required, in-\n\nstalling TensorFlow Lite on the Rasp-\n\nberry Pi is anything\
    \ but trivial and is by \n\nno means something you can do \n\nquickly. Constantly\
    \ changing dependen-\n\ncies and new versions make it difficult \n\nto give universal\
    \ guidance. However, \n\nyou will definitely want to make sure \n\nthat you are\
    \ using the 64-bit variant of \n\nRaspberry Pi OS. To verify that you \n\nhave\
    \ the correct version of the operat-\n\ning system, enter:\n\nuname -a\n\nThe\
    \ output must include the aarch64 \n\nparameter. If it is missing, you are run-\n\
    \nning the 32-bit variant of Raspberry Pi \n\nOS, which rules out any meaningful\
    \ \n\ndeployment of TensorFlow Lite. You \n\nalso need the correct matching version\
    \ \n\nof the C++ compiler (GCC) in place. To \n\ncheck, type\n\ngcc -v\n\nat the\
    \ prompt; the output must be \n\n\\--target=aarch64-linux-gnu.\n\nIf these conditions\
    \ apply, the next step \n\nis to adjust the swap size of the system. \n\nBy default,\
    \ only 100MB are reserved as a \n\nswap partition on the Raspberry Pi 4. \n\n\
    You will want to increase this value to \n\n4GB if you are using a Raspberry Pi\
    \ 4 \n\nwith 4GB of RAM. Unfortunately, Rasp-\n\nberry Pi OS limits \n\nswap memory\
    \ to a \n\nmaximum of 2GB, \n\nand you will need \n\nto edit two files to \n\n\
    be able to \n\ncontinue. The first task is to disable the \n\nswap space\n\nsudo\
    \ dphys-swapfile swapoff\n\nand open /sbin/dphys-swapfile in an edi-\n\ntor to\
    \ look for the CONF\\_MAXSWAP parame-\n\nter (Figure 1). Set the value specified\
    \ to \n\nits right to 4096 and save your change. In \n\na second file, /etc/dphys-swapfile,\
    \ look \n\nfor the CONF\\_SWAPSIZE=100 option, and re-\n\nplace the value of 100\
    \ with 4096 for a \n\nRaspberry Pi 4 with 4GB of RAM. For a \n\ndevice with only\
    \ 2GB of RAM, the swap \n\nsize should be set to 4096MB, whereas \n\n2048MB is\
    \ fine for a model with 8GB of \n\nRAM. After saving the modified file, en-\n\n\
    able the new swap size and check it by \n\nrunning:\n\nsudo dphys-swapfile swapon\n\
    \nfree -m\n\nIf everything meets the specifications, \n\nyou can install TensorFlow\
    \ Lite. The \n\nsoftware will work with Python, but the \n\nC++ API libraries\
    \ are preferable because \n\nof the far superior processing speed. \n\nListing\
    \ 1 shows how to get TensorFlow \n\nLite v2.6.0, including all of its dependen-\n\
    \ncies, and how to compile with C++. The \n\nbuild takes about half an hour.\n\
    \nAfter compiling, you need to install \n\nmodified TensorFlow Lite FlatBuffers\
    \ \\[4\\]; \n\notherwise, numerous GCC error mes-\n\nsages will appear. Listing\
    \ 2 shows you \n\nhow to remove the old FlatBuffers and \n\nreplace them with\
    \ a bug-fixed version.\n\nThis change is essential because the \n\noriginal TensorFlow\
    \ FlatBuffers no lon-\n\nger work with current GCC versions. The \n\nbug-fixed\
    \ variant replaces the obsolete \n\nserialization libraries with adapted \n\n\
    versions.\n\n**Options**\n\nTensorFlow Lite offers the option of \n\nrecognizing\
    \ objects with pre-built \n\n**Figure 1:**** Raspberry Pi OS initially requires\
    \ some **\n\n**adjustments for use with AI applications.**\n\n$ sudo apt-get install\
    \ cmake curl\n\n$ w get -O tensorflow.zip https://github.com/tensorflow/\n\ntensorflow/archive/v2.6.0.zip\n\
    \n$ unzip tensorflow.zip\n\n$ mv tensorflow-2.6.0 tensorflow\n\n$ cd tensorflow\n\
    \n$ ./tensorflow/lite/tools/make/download\\_dependencies.sh\n\n$ ./tensorflow/lite/tools/make/build\\\
    _aarch64\\_lib.sh\n\n**Listing 1: ****Installing TensorFlow Lite**\n\n69\n\nLINUX-MAGAZINE.COM\
    \ \n\nISSUE 274 \n\nSEPTEMBER 2023\n\nTensorFlow AI on the Pi\n\n**MAKER**SPACE\n\
    \n**MAKER**SPACE"
