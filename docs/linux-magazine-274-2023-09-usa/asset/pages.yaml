  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_27_0.png)\n\nan MS-DOS PC. Combian\
    \ 64 \\[8\\] boots directly into C64 \n\nmode, and Amstrian \\[9\\] brings back\
    \ the Amstrad CPC 464. \n\nThese three emulator distros have sizes between 900MB\
    \ \n\nand 1.1GB (compressed). Maiolino has declared them as \n\n“donationware\
    \ projects”; he asks for a donation via PayPal \n\nif you enjoy using them. Also,\
    \ the software must not be \n\nused commercially, and modified versions cannot\
    \ be \n\ndistributed.\n\nPiMiga \\[10\\] \\[11\\] is a different beast. It is\
    \ a Commodore \n\nAmiga emulator, but at 43GB, the image is huge: It contains\
    \ \n\nthousands of Amiga games and applications, and it does not \n\nrun the classical\
    \ workbench from the late 1980s, but a new re-\n\nimplementation that can cope\
    \ with higher resolutions and \n\nmore colors (Figure 3). Last December Chris\
    \ Edwards released \n\nPiMiga v3.0.\n\n**DietPi**\n\nA good starting point for\
    \ assembling your own Linux distribu-\n\ntion is DietPi \\[12\\], a stripped-down\
    \ port of Debian to the \n\nRaspberry Pi. DietPi runs on current and old Rasp\
    \ Pi models \n\n(back to the RPi2), but it also supports other single-board \n\
    \ncomputers, including various ODROID and PINE64 devices \n\nand the OrangePi\
    \ 5. The setup routine lets you install soft-\n\nware packages that have been\
    \ optimized for the platform, and \n\nyou can install just what you need, whereas\
    \ most other distri-\n\nbutions give you a full set of tools.\n\n**Conclusion**\n\
    \nYou can expect the number of small and specialized Linux dis-\n\ntributions\
    \ for the Raspberry Pi to grow. If you need even more \n\nvariety, you can experiment\
    \ with completely different operat-\n\ning systems, such as FreeBSD \\[13\\] or\
    \ RISC OS \\[14\\]. Q Q Q\n\nEmulationStation. Instead of the Rasp Pi version\
    \ of Recal-\n\nbox, you can also try RetroPie \\[6\\] which – again – uses \n\n\
    EmulationStation. In Raspberry Pi Imager, you will find \n\nRetroPie under *Emulation\
    \ and game OS* | *RetroPie*; the \n\ncompressed image size is 860MB. RetroPie\
    \ lacks ROMs, so \n\nyou will need to manually install game ROMs.\n\nAfter booting\
    \ for the first time, you can connect a joystick \n\nor controller and configure\
    \ its buttons. If you don’t want to \n\nmap a function to a button (because your\
    \ controller doesn’t \n\nhave it), simply keep an already taken button pressed\
    \ until \n\nthe configurator skips this item. (You cannot skip entries with \n\
    \nthe keyboard’s cursor keys.) When you reach the line *OK* at \n\nthe end, press\
    \ whatever button you have assigned to *X*.\n\nRetroPie starts a Samba server\
    \ that you can use to copy game \n\nROMs to the system. Mount the file share,\
    \ then go to *roms* and \n\nthe correct subfolder for your machine, for example\
    \ *amstradcpc* \n\nfor the Amstrad CPC computers.\n\nNote that there is no Commodore\
    \ C64 emulator – you need \n\nto go into the RetroPie settings and run the *Update\
    \ RetroPie-*\n\n*Setup script*. Then select *Manage packages* | *Manage optional\
    \ *\n\n*packages* | *vice* | *Install from pre-compiled binary*. (It’s also \n\
    \npossible to compile the package from the sources, but that \n\nprocess can take\
    \ half an hour.) When the installation is done, \n\nexit out of the menu layers\
    \ by pressing Escape several times.\n\nAfter adding games, you need to restart\
    \ EmulationStation \n\nfrom the main menu (*Quit* | *Restart EmulationStation*),\
    \ and \n\nthen the new games should show up.\n\n**Individual Emulators**\n\nRetroPie\
    \ lets you emulate an astonishing number of old \n\ncomputer models, but the look\
    \ and feel of those old ma-\n\nchines does not match the modern optics of a mouse-con-\n\
    \ntrolled high-resolution GUI. If you prefer to turn on your \n\ncomputer and\
    \ be greeted by the start screen of an old Com-\n\nmodore breadbin, you can use\
    \ a special distribution with \n\njust one emulator.\n\nCarmelo Maiolino has developed\
    \ several such systems. \n\nDosbian \\[7\\] runs the DOSBox software to turn your\
    \ Pi into \n\n**Figure 3:**** Install PiMiga on a Raspberry Pi 400 for a **\n\n\
    **great retro experience.**\n\n**\\[1\\]** \n\n Raspberry Pi OS: *https:// www.\
    \ raspberrypi. com/ software/*\n\n**\\[2\\]** \n\n RPi Distributions (Embedded\
    \ Linux Wiki): \n\n*https:// elinux. org/ RPi\\_Distributions*\n\n**\\[3\\]**\
    \ \n\n balenaEtcher: *https:// etcher. balena. io/*\n\n**\\[4\\]** \n\n LibreELEC:\
    \ *https:// libreelec. tv/*\n\n**\\[5\\]** \n\n XBian: *https:// xbian. org/*\n\
    \n**\\[6\\]** \n\n RetroPie: *https:// retropie. org. uk/*\n\n**\\[7\\]** \n\n\
    \ Dosbian: *https:// cmaiolino. wordpress. com/ dosbian/*\n\n**\\[8\\]** \n\n\
    \ Combian 64: *https:// cmaiolino. wordpress. com/*\n\n**\\[9\\]** \n\n Amstrian:\
    \ *https:// cmaiolino. wordpress. com/ amstrian/*\n\n**\\[10\\]** PiMiga 3.0:\
    \ \n\n*https:// www. youtube. com/ watch? v=uw4GXLq2E9Q*\n\n**\\[11\\]** “An Amiga\
    \ emulator for the Raspberry Pi 400” by Hans-\n\nGeorg Eßer, *Linux Magazine*,\
    \ issue 255, February 2022, pp. \n\n62-67, *https:// www. linux-magazine. com/\
    \ Issues/ 2022/ 255/ *\n\n* PiMiga-1. 5*\n\n**\\[12\\]** DietPi: *https:// dietpi.\
    \ com/*\n\n**\\[13\\]** FreeBSD for Raspberry Pi: *https:// download. freebsd.\
    \ org/ *\n\n* releases/ arm64/ aarch64/ ISO-IMAGES/ 13. 2/*\n\n**\\[14\\]** RISC\
    \ OS: \n\n*https:// www. riscosopen. org/ content/ downloads/ raspberry-pi*\n\n\
    **Info**\n\n28\n\nSEPTEMBER 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\nCOVER\
    \ STORY\n\nRaspberry Pi Distros"
