  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_61_0.png)\n\nspring and fall, I wanted\
    \ a heater to \n\nswitch on automatically. In contrast, \n\ncrops needed protection\
    \ against exces-\n\nsive heat in summer.\n\nAn intelligent control system would\
    \ \n\nalso be nice to reference the outside tem-\n\nperature, allowing it to close\
    \ the win-\n\ndows in time for cool evenings and build \n\nup a heat reserve for\
    \ young crops during \n\nthe night. At the same time, a reliable \n\nclock was\
    \ essential to adapt to the light-\n\ning conditions of different seasons.\n\n\
    All functions should be remotely ac-\n\ncessible, with the option to intervene\
    \ \n\nover the web if thresholds were ex-\n\nceeded. Another requirement was an\
    \ ac-\n\ntivity log to collect messages from ongo-\n\ning operations for remote\
    \ viewing with-\n\nout always having to check the display \n\nin the greenhouse.\
    \ To implement all of \n\nthis, I used a Raspberry Pi Pico W. In ad-\n\ndition\
    \ to the essential peripheral devices, \n\nit now provides the entire logic and\
    \ a \n\nweb server.\n\n**Getting Started**\n\nUnlike the single-board computers\
    \ from \n\nthe Raspberry Pi family, the Pico re-\n\nquires very little preparation.\
    \ I used the \n\nWiFi version because the controller \n\ncould not be managed\
    \ remotely without \n\na connection to the home WiFi network. \n\nI also needed\
    \ a USB port for the pro-\n\ngramming. In the development phase, \n\nyou need\
    \ to feed the commands \n\n**W**\n\nhen implementing my \n\ngreenhouse control\
    \ system, \n\nI didn’t have to start com-\n\npletely from scratch. An \n\nolder\
    \ control system already existed with \n\nwhich I had a little experience. Building\
    \ \n\non this established setup, I decided to \n\nuse power windows for the hinged\
    \ sky-\n\nlights (Figure 1) and a fan to circulate \n\nthe air in the greenhouse.\
    \ Also, when \n\nnighttime temperatures dropped in the \n\n**Lead Image © Ledda\
    \ Maria Rita, 123RF.com**\n\n**Maker**Space\n\nManage your greenhouse with \n\n\
    a Raspberry Pi Pico W\n\nSheltered Growth\n\n**You can safely assign some greenhouse\
    \ tasks to a Raspberry **\n\n**Pi Pico W, such as controlling ventilation, automating\
    \ a **\n\n**heater, and opening and closing windows. ***By Swen Hopfe*\n\n**Figure\
    \ 1:**** The automatic greenhouse control system regulates when **\n\n**the skylights\
    \ open and close.**\n\n62\n\nSEPTEMBER 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\
