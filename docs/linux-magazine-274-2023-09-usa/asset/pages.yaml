  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_29_0.png)\n\nUbuntu. While remaining\
    \ popular in its \n\nown right – consistently within the top \n\n10 page hits\
    \ on DistroWatch \\[1\\] – \n\nDebian gained influence as the founda-\n\ntion\
    \ of other distributions, many of \n\nwhich, like Ubuntu, Linux Mint, and \n\n\
    MX Linux, became popular in their own \n\nright. Today, 122 of the distributions\
    \ on \n\nDistroWatch, just under two-thirds of \n\nall distros, derive from Debian\
    \ or a \n\nmajor derivative. Debian maintains a \n\npage on the DistroWatch site\
    \ \\[2\\] and \n\nalso develops the Med \\[3\\] and Astro \\[4\\] \n\nblends for\
    \ specialist users, as well as \n\nDebian Edu for the classroom \\[5\\]. With\
    \ \n\nsuch influence, a broader perspective \n\nwas inevitable. I have found no\
    \ sign \n\nthat the strategy was deliberate, but the \n\nchange could have come\
    \ from no more \n\nthan the changing interests of users.\n\nMany aspects of Debian\
    \ remain the \n\nsame, of course. Like previous releases, \n\nDebian 12 comes\
    \ approximately two \n\nyears after the previous release and yet \n\nagain increases\
    \ what was already the \n\nlargest assortment of packages. How-\n\never, today’s\
    \ Debian has become more \n\naccessible than its predecessors in at \n\nleast\
    \ three major ways: installation, \n\npackages, and its non-free firmware \n\n\
    policy.\n\n**Install Options**\n\nIn its early days, Debian had a well-de-\n\n\
    served reputation for being hard to in-\n\nstall. That reputation softened with\
    \ the \n\nrelease of the Debian Installer, but lin-\n\ngered to an extent because\
    \ the Debian \n\nInstaller requires too many choices to \n\nbe comfortable for\
    \ new users, although \n\nmany distros offer it for troubleshoot-\n\ning installs.\
    \ Debian also addresses ac-\n\ncessibility issues, including a voice \n\nsynthesizer\
    \ installer for the blind. For \n\nnew users, the Calamares installer of-\n\n\
    fers a basic, graphical or command line \n\ninstall, while those with more \n\n\
    experience can use the Debian Installer \n\nfrom the Advanced Options menu, \n\
    \nwhich reduces the amount of mainte-\n\nnance required, but helps to make \n\n\
    Debian more welcoming for as many \n\nusers as possible.\n\n**Packages Worth Noting**\n\
    \nThroughout Debian’s history, users \n\nhave chosen it for stability, security,\
    \ \n\nand its high level of testing. In fact, \n\nDebian’s testing and, sometimes,\
    \ its un-\n\nstable repository are often said to be \n\nmore reliable than other\
    \ distributions’ \n\nrepositories. A number of derivatives, \n\nincluding Ubuntu,\
    \ are based on one or \n\nboth. Historically, no one would choose \n\nDebian for\
    \ its new applications, the \n\nway they would Fedora, for the simple \n\nreason\
    \ that, by the time a new Debian \n\nrelease came out, other distributions \n\n\
    had long ago showcased what was new.\n\nThat perspective was never wholly \n\n\
    true. Debian regularly includes scripts, \n\nsuch as adequate, a checklist for\
    \ new \n\npackages that have not even reached \n\nthe major derivatives. However,\
    \ in the \n\nlast few releases, Debian has had a \n\nhandful of new applications\
    \ with a po-\n\ntentially broad appeal. Often, these ap-\n\nplications have been\
    \ developed in-proj-\n\nect for package maintenance while \n\nbeing useful to\
    \ general users as well. \n\nFor example, diffoscope, which can be \n\nuseful\
    \ when using version control tools \n\nlike Git is also handy for writers who\
    \ \n\nwant to compare texts in binary formats \n\nlike LibreOffice’s Open Document\
    \ For-\n\nmat or PDF (Figure 2). Similarly, debvm \n\n(detailed elsewhere in this\
    \ issue) allows \n\ntesting different hardware architectures \n\nwithout changing\
    \ machines, while pro-\n\nviding a sandbox for anyone to test \n\nscripts or packages\
    \ quickly and easy. \n\nMore generally, several reviews of \n\nDebian 12 have\
    \ singled out fnt, a com-\n\nmand-line tool for browsing Google \n\nfonts (Figure\
    \ 3). Such examples seem to \n\nsuggest that Debian is beginning to \n\nbroaden\
    \ its appeal.\n\n**The Changing Policy on **\n\n**Non-Free Firmware**\n\nUndoubtedly,\
    \ the biggest change has \n\nbeen the new position on non-free soft-\n\nware.\
    \ From its earliest days, Debian \n\nhad a non-free section of each reposi-\n\n\
    tory, as well as a contrib section that \n\ncontains free software that depends\
    \ on \n\nnon-free software. However, these sec-\n\ntions were never official parts\
    \ of a re-\n\nlease and were not enabled by default \n\nduring installation. Moreover,\
    \ license \n\nissues have always been argued \n\n**Figure 2:**** One of the recent\
    \ apps featured in Debian 12, diffoscope com-**\n\n**pares binary files. Here,\
    \ it compares two LibreOffice Writer files (**.odt**).**\n\n**Figure 3:**** Also\
    \ new in Debian 12 is fnt, which views Google Fonts from **\n\n**the command line.**\n\
    \n30\n\nREVIEW\n\nDistro Walk – Debian 12\n\nSEPTEMBER 2023 \n\nISSUE 274 \n\n\
