  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_22_0.png)\n\nreconnect to the server\
    \ in the browser. Now you can start \n\nadding music.\n\nDaphile includes a CD\
    \ ripper that you can use to add \n\nmusic to your library. You have to insert\
    \ CDs in a drive that \n\nis connected to the server – and not to the client that\
    \ dis-\n\nplays the web app interface. Ripping works well, and the \n\nripper\
    \ program finds album metadata (interpret and titles) \n\nand cover art automatically.\
    \ It converts the ripped tracks \n\ninto large FLAC files with excellent audio\
    \ quality. However, \n\nripping takes time, and the fact that you need physical\
    \ ac-\n\ncess to both the server and a client makes this approach a \n\nbit impractical.\
    \ If you already have a collection of MP3 or \n\nother digital audio files, copy\
    \ them to the *Music* folder, for \n\nexample, via the Samba share. Transferring\
    \ gigabytes of \n\nmusic over the local network will also take a lot of time,\
    \ but \n\nyou can let it run unattended.\n\n**Linux From Scratch**\n\nLinux From\
    \ Scratch is a very special distribution that has existed \n\nsince 1999 and is\
    \ still active: The current version 11.3 was re-\n\nleased in March 2023 \\[2\\\
    ]. When you go to the download direc-\n\ntory, you won’t find an ISO image – instead\
    \ you get a book \n\n(370 PDF pages or HTML), a collection of boot scripts, and\
    \ a \n\ndownload list that points you to 90 source code archives.\n\nWorking with\
    \ Linux From Scratch means building it *from *\n\n*scratch*. You’ll read the book\
    \ and go through all the necessary \n\nsteps that will eventually let you boot\
    \ the operating system and \n\nrun some basic programs on it. For example, you’ll\
    \ get the Vim \n\neditor, but there is no graphical desktop.\n\nThe final product\
    \ is not the true goal, it is all about the \n\njourney that leads you there.\
    \ You will learn how to build and \n\nuse a cross-compilation toolchain and how\
    \ programs and li-\n\nbraries work together. You will dig into the System V-based\
    \ \n\n**Figure 1:**** Control Daphile via a web browser, or find music on its\
    \ Samba share.**\n\n23\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023"
