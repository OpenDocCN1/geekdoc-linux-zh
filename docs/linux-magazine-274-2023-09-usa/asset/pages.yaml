    \ and specify \n\nthem as parameters in Code::Blocks \n\n(Figure 3).\n\n**Generating\
    \ Your Models**\n\nBecause custom models cannot be \n\ntrained on small computers,\
    \ Google of-\n\nfers a web-based tool \\[11\\] to help in \n\nthe creation of\
    \ models. The tool is suit-\n\nable for various model types and out-\n\nputs them\
    \ as files in the TensorFlow \n\nformat so that you can use the models \n\nin\
    \ the Lite variant after converting. \n\nPlease note, however, that generating\
    \ a \n\nmodel for object recognition (e.g., on \n\nimages and photographs) means\
    \ up-\n\nloading several hundred sample im-\n\nages. The sample images also need\
    \ to \n\nbe high resolution to achieve high ac-\n\ncuracy levels later. You need\
    \ to sched-\n\nule several hours \n\nto work with the \n\ntool (Figure 4).\n\n\
    **Conclusions**\n\nAI applications \n\nwith TensorFlow \n\nLite and OpenCV \n\n\
    have long been \n\nconsidered estab-\n\nlished tools and \n\nare suitable for\
    \ \n\nproduction use. \n\nHowever, install-\n\ning the individual \n\nlibraries\
    \ and \n\nframeworks on \n\nthe Raspberry Pi \n\ninvolves a fair \n\namount of\
    \ time \n\nand overhead – especially because the \n\ndocumentation is often either\
    \ outdated \n\nor lacking. For this reason alone, it \n\nmakes sense to check\
    \ out recent tutorials \n\nand examples to familiarize yourself \n\ngradually\
    \ with AI applications on the \n\nRaspberry Pi. Q Q Q\n\n**Figure 3:**** The object\
    \ recognition elements are **\n\n**shown in the original image along with the\
    \ percent **\n\n**likelihood of correct recognition.**\n\n**Figure 4:**** You\
    \ can create your own models with a web-based tool.**\n\n**\\[1\\]** \n\n TensorFlow:\
