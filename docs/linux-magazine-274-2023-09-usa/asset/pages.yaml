  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_47_0.png)\n\neffective way to learn\
    \ the MathLex \n\nsyntax.\n\nOne thing I found confusing in the \n\ndemo was that\
    \ some markers (delimiters \n\nin MathLex terminology) can be written \n\nwith\
    \ or without colons. In handwritten \n\nmath, for example, the absolute (i.e.,\
    \ \n\nwithout a positive or negative sign) of \n\nsome variable is written by\
    \ placing that \n\nvariable between two vertical bars. Un-\n\nsurprisingly, MathLex\
    \ lets you specify \n\nthe absolute value of a variable by wrap-\n\nping it inside\
    \ pipe characters (e.g., |X|). \n\nFor MathLex, however, even |:X:| is a \n\n\
    perfectly valid syntax. The only thing \n\nyou cannot do is mix the forms (i.e.,\
    \ you \n\ncannot write |:X|). Just remember this, \n\nand everything will be fine.\n\
    \n**Using MathLex on the Web**\n\nListing 1, the source code for the cus-\n\n\
    tom MathLex page shown in Figures 7, \n\n8, and 9, outlines what you need to \n\
    \neasily use MathLex on any web page. \n\nTo get the working MathLex interface\
    \ \n\nshown in Figure 7, I copied the rele-\n\nvant part of the demo’s index.html\
    \ file \n\ninto an empty file, saved it with an \n\n.html extension, and rewrote\
    \ the \n\nheader and some other strings.\n\nPlease note in Listing 1 that I short-\n\
    \nened the lengthy URLs for the font and \n\nJavaScript libraries loaded in lines\
    \ 6, 8, \n\nand 35 for readability. The actual URLS \n\nmay differ depending on\
    \ the MathLex \n\nversion you use.\n\nRegarding the libraries, there are two \n\
    \nthings to pay attention to in Listing 1. \n\nFirst, you must include the whole\
    \ header \n\nof the demo index.html file (lines 1 to 11), \n\nbut do not shorten\
    \ the URLS as I did for \n\nreadability.\n\nSecond, take all the files that con-\n\
    \ntain the MathLex stylesheets, as well \n\n**Figure 7:**** To create your own\
    \ MathLex-capable web **\n\n**pages, just grab the right code from the MathLex\
    \ **\n\n**demo and customize it.**\n\n**Figure 8:**** The custom page generated\
    \ by Listing 1 **\n\n**works just like the original demo. Notice how the **\n\n\
    **interactive renderer displays formulas in red until **\n\n**they are complete\
    \ and error-free.**\n\n01 <!doctype html><html lang=\"en\">\n\n02 <head>\n\n03\
    \ <meta charset=\"utf-8\">\n\n04 <title>MathLex Demo</title>\n\n05 <link rel=\"\
    stylesheet\" href=\"css/normalize.min.css\">\n\n06 <link rel=\"stylesheet\" href=\"\
    //fonts.googleapis.com...\">\n\n07 <link rel=\"stylesheet\" href=\"css/style.min.css\"\
    >\n\n08 <script src=\"https://cdnjs.cloudflare.com...\"></script>\n\n09 <link\
    \ href=\"main.css\" rel=\"stylesheet\">\n\n10 </head>\n\n11 <body>\n\n12 <h1>Let's\
    \ try MathLex for Linux Magazine!</h1>\n\n13 \n\n14 <div role=\"main\">\n\n15\
    \ \n\n16 <div class=\"inbox\"><a class=\"delete-icon\" href=\"#\" title=\"clear\"\
    >clear</a>\n\n17 <textarea class=\"expand\" id=\"math\\_input\" name=\"math\"\
    \ placeholder=\"Linux \n\nMagazine test: just enter any formula here...\"></textarea>\n\
    \n18 </div>\n\n19 \n\n20 <div id=\"math\\_output\">\\\\\\[\\\\mathrm{\\\\LaTeX\\\
    \\ Output\\\\ for\\\\ LM\\\\ readers}\\\\\\]</div>\n\n21 \n\n22 <div class=\"\
    outbox\"><label for=\"tex\\_output\">Translated LaTeX Code</label>\n\n23 \n\n\
    24 <div id=\"tex\\_output\"><code>Output LaTeX Code</code></div></div>\n\n25 \n\
    \n26 <div class=\"outbox\"><label for=\"sage\\_output\">Translated Sage Code <span\
    \ \n\nclass=\"highlight\">Incomplete</span></label>\n\n27 \n\n28 <div id=\"sage\\\
    _output\"><code>Output Sage Code</code></div></div>\n\n29 \n\n30 <div class=\"\
    outbox\"><label for=\"ast\\_output\">Interpreted Syntax Tree</label>\n\n31 \n\n\
    32 <div id=\"ast\\_output\"><code>Output Syntax Tree</code></div></div>\n\n33\
    \ \n\n34 <script src=\"../mathlex.js\"></script>\n\n35 <script src=\"http://code.jquery.com/jquery...\"\
    ></script>\n\n36 <script src=\"index.js\"></script>\n\n37 </body>\n\n38 </html>\n\
    \n**Listing 1: ****Custom MathLex Page**\n\n48\n\nMathLex\n\nSEPTEMBER 2023 \n\
