  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_3_0.png)\n\nSEPTEMBER 2023\n\n**36****\
    \ Command Line – Disposable VMs**\n\nDebvm lets you quickly create a temporary\
    \ virtual machine \n\nwith a small memory footprint, ideal for testing scripts\
    \ or \n\nmixing repositories.\n\n**40**** Customizing SystemRescue**\n\nYou can\
    \ do more with SystemRescue than just repair broken \n\nsystems. By adding tools\
    \ and scripts, you can create a \n\ncustom rescue environment.\n\n**46**** MathLex**\n\
    \nMathLex lets you easily transform handwritten math \n\nformulas to digital format\
    \ and use them on the web.\n\n**50**** Programming Snapshot – Go Racing Game**\n\
    \nThe fastest way through a curve on a racetrack is along \n\nthe racing line.\
    \ Instead of heading for Indianapolis, Mike \n\nSchilli trains his reflexes with\
    \ a desktop application written \n\nin Go, just to be on the safe side.\n\n**\
    \ 8**** News**\n\n• SUSE Goes for the Fork after Red Hat's RHEL Announcement\n\
    \n• Solus 4.4 Now Ready for Prime Time\n\n• Ubuntu Will Show APT News in the Software\
    \ Updater App\n\n• Nitrux 2.9.0 Includes an Upgrade Tool and More\n\n• Ubuntu\
    \ 22.10 EOL Coming Soon\n\n• Nobara Project Releases Modified Fedora Distribution\n\
    \n• English Translation of Children’s Book Ada & Zangemann\n\n• Steam Client Features\
    \ Hardware Acceleration on Linux\n\n**12**** Kernel News**\n\n• The Hot Mess of\
    \ Closed Source\n\n• TV Is the Thing This Year, This Year\n\n**29**** Distro Walk\
    \ – Debian 12**\n\nDebian 12 features install options, new packages, and a \n\n\
    new position on non-free firmware, making it more \n\naccessible to the average\
    \ user.\n\n**32**** Vanilla OS**\n\nVanilla OS, an immutable filesystem, seamlessly\
    \ integrates \n\napplications from other distributions with an innovative \n\n\
    container-based package manager.\n\n**16**** Lightweight Linux Distros**\n\nAre\
    \ you ready to escape the bloat of mainstream Linux? \n\nWe look at four lightweight\
    \ but general-purpose Linux \n\ndistributions: Puppy Linux, Tiny Core Linux, antiX\
    \ Linux, \n\nand Alpine Linux.\n\n**22**** Specialty Distros**\n\nIn the Linux\
    \ world, form follows function. A specialty \n\ndistro is a Linux-based system\
    \ designed to serve a specific \n\nrole. We look at some classic examples.\n\n\
    **27**** Raspberry Pi Distros**\n\nThe Raspberry Pi is a Linux machine, and its\
    \ default distribution \n\nis Raspberry Pi OS. But Linux is all about choices\
    \ ...\n\nIN-DEPTH\n\nCOVER STORIES\n\nNEWS\n\nREVIEWS\n\nON THE COVER\n\n32 Vanilla\
    \ OS\n\nProtect your system files with an immutable \n\nfilesystem.\n\n40 Customizing\
    \ SystemRescue\n\nThis cool toolbox might have exactly what you \n\nneed to fix\
    \ broken computers, but you can also \n\nadd your own tools to the mix.\n\n50\
    \ Snapshot – Car Racing Game\n\nA simple Go program illustrates an important \n\
    \nprinciple of auto racing.\n\n58 Tipi\n\nYou don’t have to be an expert to host\
    \ your \n\nown home server.\n\n68 TensorFlow Lite\n\nBring the power of machine\
    \ learning to the \n\nIoT space.\n\n76 Pi-hole\n\nThis easy-to-use DNS blocker\
    \ will help you \n\nfilter out ads and eliminate tracking.\n\n4\n\nSEPTEMBER 2023\
    \ \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM"
