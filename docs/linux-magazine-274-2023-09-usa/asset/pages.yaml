    \ it does this by \n\nremaining as close to the original \n\nCubase-era software\
    \ audio pro-\n\nduction paradigm as possible, \n\nwhich means if you’ve ever used\
    \ \n\na digital audio workstation, \n\nQtractor will already feel familiar.\n\n\
    This paradigm usually means \n\naudio and MIDI tracks run horizon-\n\ntally across\
    \ the main display, with \n\nthe recording controls for \n\neach track in a header\
    \ sec-\n\ntion on the left. Waveforms \n\nand MIDI data are shown in \n\nblocks\
    \ called “clips,” either \n\nas they’re being recorded or \n\nafter they’ve been\
    \ imported \n\ninto the project. Clips can be \n\nedited non-destructively by\
    \ \n\ndragging the start or end \n\npoints, creating fades from \n\ncorners. Double-clicking\
    \ a \n\nMIDI clip will open an excel-\n\nlent MIDI editor, and there \n\nare processing\
    \ tools for \n\ntransposing, stretching, \n\nquantizing, and rescaling \n\nthe\
    \ MIDI data. Qtractor does \n\nall this, and handles MIDI \n\ndata well. It’s\
    \ also one of the \n\nfew applications on Linux \n\nthat can process MIDI sys-\n\
    \ntem exclusive (SysEx) mes-\n\nsages, and you can even \n\nadd and configure\
    \ MIDI \n\ncontrollers to change vari-\n\nous parameters within the \n\napplication,\
    \ such as track \n\ngain, panning, recording, \n\nand monitoring.\n\nAudio files\
    \ aren’t quite so \n\nwell catered for, much like \n\nearlier versions of Cubase,\
    \ \n\nbecause you can’t double-\n\nclick an audio clip and get \n\nAudacity-level\
    \ editing. But \n\nyou can still automate \n\nfades, normalize levels, and \n\n\
    time-stretch clips to fit a \n\nspecific time or beat whilst \n\nretaining the\
    \ original pitch. \n\nAll of this is accomplished \n\nwith unlimited levels of\
    \ \n\nundo and redo, so you’re \n\nfree to experiment with your \n\nrecordings.\
    \ As with Ardour, \n\naudio is being handled by \n\nJACK in the background, \n\
    \nwhich means you’re free to \n\nroute and reroute individual \n\ntracks anywhere\
    \ you wish. \n\nUnlike Ardour, however, you \n\ndon’t need to consider JACK \n\
    \nunless you want to. The de-\n\nfaults work transparently, \n\nand adding tracks,\
    \ buses, \n\ninserts, and effects can all \n\nbe done without having any \n\n\
    specialist knowledge. If you \n\ndo need to dive into the \n\nrouting details,\
    \ QjackCtl is \n\nthe standard UI throughout \n\nQtractor, and this should be\
    \ \n\nfamiliar to anyone who has \n\nplayed with JACK before. \n\nIt’s just as\
    \ flexible as Ardour \n\nwithout all the complexity.\n\nWhile Qtractor’s \n\n\
    strengths are in this old-\n\nfashioned design, it doesn’t \n\nmean the application\
    \ is \n\nwithout cutting-edge fea-\n\ntures. Qtractor was one of \n\nthe first\
    \ projects on any \n\nplatform to adopt the new \n\nCLAP standard for virtual\
    \ \n\ninstruments and effects, \n\nand it also supports LAD-\n\nSPA, DSSI, VST3,\
    \ VST and \n\nLV2 plugins, all with delay \n\ncompensation, for broad \n\ncompatibility\
    \ with every-\n\nthing you can get to work \n\non Linux. The latest builds \n\n\
    are also using Qt 6.5+ and \n\nrun wonderfully well on \n\nARM devices in particular,\
    \ \n\nmaking Qtractor one of the \n\nbest DAWs for all users.\n\n**Audio workstation**\n\
    \n**Qtractor 0.9.34**\n\n**1.****File import:** Both MIDI and audio data can be\
    \ imported, as can SysEx.**2.****Editing **\n\n**tool:** If you’ve ever used an\
    \ audio or MIDI editor, you will find Qtractor familiar.\n\n**3.****ǡ****Overview:**\
    \ The project overview lets you slide across the tracks and duration of \n\nyour\
    \ project.**4\\. ****Clips:** Individual elements are clips, with tabs for audio\
    \ and MIDI \n\nclips.**5.****Arranger:** Freely drag and drop clips, cut them,\
    \ split them, and fade them \n\nfrom the arranger.**6.****MIDI editor:** This\
    \ is perhaps the best open source MIDI note \n\neditor on Linux.**7.****Mixer:**\
    \ JACK configuration is hidden but remains accessible \n\nthrough the mixer routing,\
    \ inserts, and plugin views.\n\n**Project Website**\n\nhttps:// www. Qtractor.\
    \ org\n\nSEPTEMBER 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\n80\n\n**LINUX\
    \ **VOICE\n\nFOSSPICKS"
