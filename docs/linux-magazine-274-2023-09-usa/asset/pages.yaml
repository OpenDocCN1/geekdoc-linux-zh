  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_11_0.png)\n\n12\n\nSEPTEMBER 2023\
    \ \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\nNEWS\n\nKernel News\n\nAkihiro said,\
    \ “Despite that, it still ex-\n\npects LINUX\\_EFISTUB\\_MINOR\\_VER-\n\nSION\
    \ (include/ linux/ pe.h) referred from \n\narch/ x86/ boot/ header.S to be 0x0.\
    \ I con-\n\nfirmed that the kernel can boot by just \n\nsetting LINUX\\_EFISTUB\\\
    _MINOR\\_VER-\n\nSION to 0x0.”\n\nAkihiro said he would ask Apple to re-\n\nmove\
    \ that particular check, as it seemed \n\npointless. But he also asked the Linux\
    \ \n\ndevelopers, “Would it be possible to re-\n\nvert the LINUX\\_EFISTUB\\_MINOR\\\
    _VER-\n\nSION value (not the actual code) to 0x0? \n\nOr will it break something\
    \ else?”\n\nArd felt that approaching Apple was \n\nprobably the best move. He\
    \ said, “If the \n\nexisting virtual machine BIOS has a \n\nhardcoded check that\
    \ the EFI stub ver-\n\nsion is 1.0 even if it does not boot via \n\nEFI to begin\
    \ with, I don’t see how we \n\ncan reasonably treat this as a regression \n\n\
    that needs fixing on the Linux side.”\n\nArd also pointed out that there could\
    \ \n\nbe a significant cost to changing the \n\nLinux EFISTUB minor version require-\n\
    \nment. He said, “the version bump to PE \n\nimage version v1.1 sets a baseline\
    \ \n\nacross all Linux architectures that can \n\nboot via EFI that initrd loading\
    \ is sup-\n\nported via the command line as well as \n\nvia the LoadFile2 protocol.\
    \ Reverting \n\nthat would substantially reduce the \n\nvalue of having this identification\
    \ em-\n\nbedded into the image.”\n\nIt was at this point that Linus Torvalds \n\
    \ncame into the conversation. He \n\nexplained:\n\n*“Well, we consider firmware\
    \ issues to *\n\n*be the same as any hardware issue. If *\n\n*firmware has a bug\
    \ that requires us to do *\n\n*things certain ways, that’s really no dif-*\n\n\
    *ferent from hardware that requires some *\n\n*insane init sequence.*\n\n*“So\
    \ why not just say that LINUX\\_EFIS-*\n\n*TUB\\_MINOR\\_VERSION should be 0,\
    \ and *\n\n*just add the comment that versioning *\n\n*doesn’t work?*\n\n*“I’m\
    \ not sure why this was tied into al-*\n\n*ways enabling the initrd command line\
    \ *\n\n*loader.*\n\n*“Numbered version checks are a funda-*\n\n*mentally broken\
    \ and stupid concept *\n\n**The Hot Mess of Closed **\n\n**Source**\n\nIn the\
    \ course of trying to track down a \n\nregression, Akihiro Suda traced the prob-\n\
    \nlem to a couple of patches that had been \n\naccepted into a recent kernel release.\
    \ A \n\nregression is when something stops \n\nworking and the developers have\
    \ to look \n\nback at the patch history to see which \n\none caused the breakage.\
    \ Identifying re-\n\ngressions is what the Git bisect com-\n\nmand is for. It\
    \ starts from a known good \n\nversion and a known bad version, tests \n\nthe\
    \ middle version, and then just keeps \n\ngoing to the next middle version until\
    \ it \n\nfinds the bad patch that started it all. Git \n\nmakes regressions fun.\n\
    \nHowever, this particular regression \n\nhad to do with running virtualized sys-\n\
    \ntems and related to both Advanced Con-\n\nfiguration and Power Interface Compo-\n\
    \nnent Architecture (ACPICA), which is for \n\ndiscovering and configuring the\
    \ hard-\n\nware on a given system, and EFISTUB, \n\nwhich lets the (Unified Extensible\
    \ Firm-\n\nware Interface) UEFI load the Linux ker-\n\nnel as an EFI application.\n\
    \nThe keyword is “firmware.” Generally \n\nthis is closed source software associated\
    \ \n\nwith a specific piece of hardware, with-\n\nout which the hardware won’t\
    \ run at all. \n\nLinux tolerates it because it has no \n\nchoice, but as with\
    \ the Basic Input/ Out-\n\nput System (BIOS), firmware is generally \n\nalways\
    \ a broken, buggy pain in the butt. \n\nSometimes developers will reverse engi-\n\
    \nneer the firmware and write their open \n\nsource version, but generally the\
    \ closed \n\nsource hot mess is what we get.\n\nFor example, when Akihiro reported\
    \ \n\nthe kernel regression, Ard Biesheuvel \n\nasked if he’d been using Open\
    \ Virtual \n\nMachine Firmware (OVMF), an open \n\nsource BIOS alternative, designed\
    \ for \n\nbooting virtual machines – specifically \n\nthe Qemu open source virtualization\
    \ \n\nsystem.\n\nHowever, Akihiro replied that he \n\nwasn’t using Qemu. He was\
    \ using Ap-\n\nple’s closed source virtualization frame-\n\nwork, which also didn’t\
    \ use UEFI to load \n\nthe kernel.\n\nThe Linux kernel mailing list comprises\
    \ \n\nthe core of Linux development activities. \n\nTraffic volumes are immense,\
    \ often \n\nreaching 10,000 messages in a week, and \n\nkeeping up to date with\
    \ the entire scope \n\nof development is a virtually impossible \n\ntask for one\
    \ person. One of the few brave \n\nsouls to take on this task is **Zack Brown.**\n\
    \n**Author**\n\nZack’s Kernel News\n\n**Chronicler Zack Brown reports **\n\n**on\
    \ the latest news, views, **\n\n**dilemmas, and developments **\n\n**within the\
    \ Linux kernel **\n\n**community. **\n\n*By Zack Brown*"
