  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_31_0.png)\n\n**Ubuntu Underpinnings**\n\
    \nVanilla OS is based on a lean Ubuntu \n\n22.10, a pure Gnome 43 without the\
    \ \n\nUbuntu customizations as the desktop \n\nand a separate installer. The distribu-\n\
    \ntion follows the Ubuntu release cycle. \n\nWhile this seems unspectacular so\
    \ far, \n\nI\n\nf pollsters asked for the Linux word \n\nof the year for 2022,\
    \ “immutable” \n\nwould definitely make the short list. \n\nThe term, referring\
    \ to an immutable \n\nfilesystem, shows up wherever the topic \n\nturns to distributions.\
    \ The technology is \n\nby no means new, but has not seen \n\nmuch use thus far.\n\
    \nFor several years, the major commer-\n\ncial Linux vendors such as Red Hat and\
    \ \n\nSUSE have been preparing for a para-\n\ndigm shift with their enterprise\
    \ soft-\n\nware, focusing on protection both \n\nagainst unwanted intruders and\
    \ against \n\noperating errors or systemic defects. A \n\nremedy against imponderables\
    \ like this \n\nis a read-only filesystem mounted at \n\nboot time. However, this\
    \ type of system \n\nalso changes the format and method of \n\ndelivering software\
    \ and the package \n\nmanager’s position as a central compo-\n\nnent of a distribution.\n\
    \nImmutable filesystems are no longer \n\nlimited to enterprise distributions\
    \ and \n\nare beginning to show up on the home \n\ndesktop. One immutable filesystem\
    \ that \n\nhas received advance praise is Vanilla OS \n\n\\[1\\], an ambitious\
    \ Linux distribution that \n\ncleverly combines existing solutions in-\n\nstead\
    \ of reinventing the wheel. Although \n\nVanilla OS has only been in development\
    \ \n\nfor a few months, the creators, headed \n\nby project founder Mirko Brombin\
    \ \\[2\\], \n\nrecently released the first stable version \n\nVanilla OS 22.10\
    \ Kinetic.\n\n**Vanilla OS focuses on new strategies**\n\n**Vanilla OS, an immutable\
    \ filesystem, seamlessly integrates applications from other distributions **\n\
    \n**with an innovative container-based package manager. ***By Ferdinand Thommes*\n\
    \n**Figure 1:**** You can’t see the Ubuntu underpinnings in Vanilla OS. Instead,\
    \ **\n\n**it is more reminiscent of Fedora, but there is far more going on under\
    \ **\n\n**the hood than its unassuming appearance suggests.**\n\n**Photo by Markus\
    \ Gempeler on Unsplash**\n\n***A Fresh Breeze***\n\n32\n\nREVIEW\n\nSEPTEMBER\
    \ 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\nVanilla OS"
