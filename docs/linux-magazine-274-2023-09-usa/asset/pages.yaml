  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_55_0.png)\n\nLinux Vendor Firmware\
    \ Service (LFVS) \\[3\\]. \n\nIn addition, the tool updates far more \n\nsoftware,\
    \ such as Pi-hole, tmux, and Vim \n\nplugins. An overview is available on \n\n\
    GitHub \\[4\\].\n\nYou can pick Topgrade up from the \n\nAUR for Arch Linux (as\
    \ well as Manjaro \n\nand other Arch offshoots). NixOS and \n\nVoid Linux also\
    \ offer the tool. The proj-\n\nect’s GitHub instance offers the source \n\ncode\
    \ and binary packages for the \n\nx86\\_64, AArch64, and ARMv7 architec-\n\ntures,\
    \ as well as for Apple Darwin and \n\nWindows.\n\nTopgrade requires at least version\
    \ \n\n1.6.2 of Rust, which is already included \n\nin many distributions. You\
    \ can check \n\nthe version number by typing rustc \n\n\\--version. For Debian,\
    \ you need at least \n\nDebian Testing to deploy version 1.6.3. \n\nOn Ubuntu,\
    \ a 22.04 release will do \n\nnicely; Fedora 37 also comes with the \n\nright\
    \ version in place. If the command \n\nfails to find rustc on your system, you\
    \ \n\nneed to install the package using your \n\ndistribution’s package manager\
    \ and \n\nthen check the version again.\n\n**Cargo Installer**\n\nThe easiest\
    \ way to install Topgrade – \n\nironically bypassing the respective na-\n\ntive\
    \ package system – is with the Cargo \n\nT\n\nhe times when the preferred \n\n\
    source for an application was a \n\ndistribution’s own archives are \n\ndefinitely\
    \ over for the majority of \n\nusers today. In addition to third-party re-\n\n\
    positories, Flatpaks, AppImages, and \n\nsnaps, the average user’s filesystem\
    \ also \n\nhosts PIP (Python), Cargo (Rust), npm \n\n(Node.js), or Homebrew (macOS)\
    \ based \n\ninstallations. All of these installations \n\nbypass the operating\
    \ system’s update \n\nmechanisms, forcing you to update them \n\nseparately.\n\
    \nOne way out of this uncomfortable \n\nsituation is the Topgrade package \n\n\
    manager. Topgrade was recently aban-\n\ndoned by the original developer after\
    \ \n\nfive years \\[1\\], but the community is \n\nnow continuing to maintain\
    \ the tool as \n\nTopgrade-rs \\[2\\]. For simplicity’s sake, I \n\nwill simply\
    \ refer to the community fork \n\nof the tool as Topgrade in this article.\n\n\
    **One for All**\n\nTopgrade promises to launch all package \n\nmanagers used on\
    \ the system one by one \n\nvia a single terminal command, as well \n\nas install\
    \ updates available for them, \n\neven on remote machines. This offer \n\ndoes\
    \ not just apply to Linux, but also to \n\nthe Windows Sub-\n\nsystem for Linux\
    \ \n\n(WSL), Choco-\n\nlatey and Scoop \n\non Windows, and \n\nFreeBSD and \n\n\
    DragonFly BSD. \n\nTopgrade relies on \n\nthe fwupd dae-\n\nmon to integrate \n\
    \nfirmware from the \n\n**Central system updates with Topgrade**\n\n In One Fell\
    \ Swoop\n\n**Topgrade detects all the package managers installed on a system and\
    \ executes **\n\n**them one by one at the command line. ***By Ferdinand Thommes*\n\
    \n**Photo by Lucian Petronel Potlog on Unsplash**\n\n01 ### Set up Cargo on Debian\n\
    \n02 $ sudo apt install cargo pkg-config libssl-dev\n\n03 ### Set up Cargo on\
    \ Fedora\n\n04 $ sudo dnf install cargo pkg-config openssl-devel\n\n05 ### Cargo\
    \ update\n\n06 $ cargo install cargo-update\n\n07 ### Set up Topgrade\n\n08 $\
    \ cargo install topgrade\n\n**Listing 1: ****Installation**\n\n**Figure 1:****\
    \ When done, the build process reminds you to add the **cargo\n\n**directory to\
    \ your path.**\n\n56\n\nIN-DEPTH\n\nSEPTEMBER 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\
    \nTopgrade"
