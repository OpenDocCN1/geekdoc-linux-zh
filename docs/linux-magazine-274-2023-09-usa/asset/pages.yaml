  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_23_0.png)\n\nThe Recalbox image contains\
    \ a lot of games, so you can start \n\nplaying immediately. Navigate through the\
    \ machines – when you \n\nselect a computer, you’ll see the list of games (roms)\
    \ that it can run. \n\nSelect a game and start playing within a few seconds (Figure\
    \ 3).\n\nIf you want to add your own game files, you can log in via \n\nSecure\
    \ Shell – the root password is *recalboxroot*. Then navigate \n\nto the */recalbox/\
    \ share/ roms/ *folder: This is where you should \n\nput your files, for example,\
    \ C64 disk images in the *c64/ * sub-\n\nfolder. You can also cd into that directory\
    \ and download games \n\nfrom the Internet Archive with wget – following are the\
    \ com-\n\nmands for the classic Q\\*Bert game:\n\ncd /recalbox/share/roms/c64\n\
    \nwget https://archive.org/download/d64\\_Q-Bert\\_1983\\_Parker\\_U\n\nBrothers/Q-Bert\\\
    _1983\\_Parker\\_Brothers.d64\n\nThen press *Start* on the game controller to\
    \ bring up the *Options* \n\nmenu. Select *Update Games Lists* in the *Options*\
    \ menu and se-\n\nlect *Yes*. EmulationStation will restart after a few seconds,\
    \ and \n\nyou should find your new games in the list.\n\n**SystemRescue 10.01**\n\
    \nA classic helper that has been around since 2003 is SystemRes-\n\ncue (formerly\
    \ known as SystemRescueCD) \\[6\\]. The latest ver-\n\nsion 10.01 was released\
    \ in May 2023. You can write the 737MB \n\nSystemRescue ISO image to a USB stick\
    \ or DVD; it does not fit \n\non a CD. You will find an ISO image for SystemRescue\
    \ on Side \n\nB of this month’s DVD (*systemrescue-10.01-amd64.iso*), and \n\n\
    Side B also boots directly into the system.\n\nSystemRescue drops you at a root\
    \ prompt, as many tasks that \n\nthe system can help you with do not require a\
    \ graphical inter-\n\nface. But the GUI is only one command away; type startx\
    \ to \n\nstart the Xfce desktop.\n\nSome of the features you can use right at\
    \ the shell prompt are:\n\n• Create, resize, mount, check, and repair Linux and\
    \ Win-\n\ndows partitions (including NTFS). You’ll also find support \n\nfor LVM\
    \ volumes.\n\n• Backup and restore hard disk partitions with fsarchiver.\n\n•\
    \ Copy as much of a defective hard disk as possible with \n\nddrescue and dd\\\
    _rescue (two similar but not identical tools).\n\ninit mechanism (though there’s\
    \ also a variant of the book that \n\nintroduces you to the modern sysvinit alternative\
    \ systemd), \n\ndeal with device files, and install all the other parts that a\
    \ \n\nminimal system will need.\n\nNote that the book is not completely self-explanatory.\
    \ It \n\nshows the commands you need for compiling and installing the \n\nvarious\
    \ software components, but it does not go into detail for \n\nevery single component.\n\
    \n**Recalbox**\n\nIf you want to play retro games on your PC, you have a lot of\
    \ op-\n\ntions: You can install emulators for your preferred platforms (for \n\
    \nexample, the Commodore C64, the Atari ST, or the Sony Playsta-\n\ntion), or\
    \ you can use a front end like EmulationStation \\[3\\] that in-\n\ntegrates various\
    \ emulators and games for those bygone machines.\n\nRecalbox \\[4\\] is a specialized\
    \ distribution that is based on the \n\nBuildroot tool \\[5\\], which lets developers\
    \ create embedded Linux \n\nsystems. You can download *recalbox-x86\\_64.img.xz*\
    \ and uncom-\n\npress it into a 3GB image file, write it to a USB stick, and boot\
    \ it. \n\nThe first boot process takes a while because an auto-installer claims\
    \ \n\nthe rest of the USB stick and creates a partition where you can later \n\
    \nstore your own game files (roms). Keeping Recalbox restricted to \n\nthe stick\
    \ means that you need not repartition the hard drive, and \n\nyou can use the\
    \ PC for other tasks when you’re not playing.\n\nAs a first step, you should set\
    \ up your game controller. Its \n\nmain buttons will work already, so press *Start*\
    \ to open Emula-\n\ntionStation’s main \n\nmenu. Then select \n\n*Controller Settings*\
    \ | \n\n*Configure a Con-*\n\n*troller* and assign \n\nfunctions to all \n\nthe\
    \ buttons that \n\nyour controller \n\nhas. At the end of \n\nthe list, you need\
    \ \n\nto assign a button \n\nto the *Hotkey* \n\nentry: You’ll use it \n\nto exit\
    \ games.\n\n**Figure 2:**** When you’re sitting on **\n\n**the couch, your phone’s\
    \ browser **\n\n**is the most comfortable way to **\n\n**access the Daphile computer.**\n\
    \n**Figure 3:**** With Recalbox, you can run all the classic home computer **\n\
    \n**emulators from EmulationStation and play their games.**\n\n24\n\nSEPTEMBER\
    \ 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\nCOVER STORY\n\nSpecialty Distros"
