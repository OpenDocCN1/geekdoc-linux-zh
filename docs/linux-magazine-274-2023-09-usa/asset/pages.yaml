  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_74_0.png)\n\n**“N**\n\no good deed\
    \ goes unpunished” is a quote of debated \n\norigin, but I am reminded of it today.\n\
    \nNo Good Deed …\n\nI met Linus Torvalds in May of 1994. I saw in the Linux™ \\\
    [1\\] kernel \n\n(and associated layered software) a unique research platform\
    \ for \n\n64-bit algorithms. I facilitated getting a $20,000 DEC Alpha system\
    \ \n\nto Linus so he could give Linux a 32/ 64-bit virtual address space \n\n\
    and make it more portable to both CISC and RISC systems.\n\nBy late 1996, I was\
    \ associated with a small group of compa-\n\nnies that believed Linux had deep\
    \ commercial capabilities, so \n\nwe formed Linux International™ and, with Torvalds,\
    \ trademarked \n\n“Linux.”\n\nIn early 1997 the companies (and Linux International)\
    \ re-\n\nceived letters from a William R. Della Croce Jr. of Boston, \n\nMassachusetts,\
    \ who had registered the mark of “Linux” and \n\ndemanded 25 percent of the revenues\
    \ of each company that \n\nused the mark “Linux” in their name.\n\nAnyone experienced\
    \ knows that asking for a license fee \n\nbased on 25 percent of a company’s revenues\
    \ is a losing propo-\n\nsition from the beginning, but the fledgling Linux industry\
    \ could \n\nnot take chances, so we hired the prestigious law firm of Davis \n\
    \n& Schroeder PC, and one of the principals, Gerry Davis, offered \n\nhis services\
    \ pro bono.\n\nFor those of you who are not followers of trademark law or the-\n\
    \nory, a trademark, per the US Patent and Trademark Office, “can be \n\nany word,\
    \ phrase, symbol, design, or a combination of these” ap-\n\nplied to an entity’s\
    \ products or services to act as a mark of identity.\n\nMany companies can make\
    \ running shoes, but only Nike™ can \n\nbrand their shoes with that name, and\
    \ with the famous Swoosh. \n\nTherefore, if you are at a store and you see the\
    \ name or the \n\nSwoosh, you know it was made by Nike and, through brand recog-\n\
    \nnition, you associate a certain quality with that brand. Therefore, if \n\n\
    Nike saw a company manufacturing shoes and putting the word \n\n“Nike” on them,\
    \ or the Swoosh, Nike would probably sue that com-\n\npany for damages as well\
    \ as to stop them from producing that \n\nfalsely marked shoe. If Nike did not\
    \ do that, then Nike might lose \n\ntheir trademark. Trademarks have to be protected.\
    \ Likewise, the \n\ntrademark has to be used to define a product or service that\
    \ is cur-\n\nrently offered (or will be offered in the near future). Trademarks\
    \ \n\nthat have been abandoned may be reused at a later date.\n\nGerry Davis determined\
    \ that the “software” that Della Croce \n\nJr. had submitted as proof of his product\
    \ was a floppy disk with \n\none text file on it that had the file name linux.txt\
    \ and had the \n\nASCII contents of “This file is Linux.” This (of course) was\
    \ not a \n\nsolid trademark example, but because Linux was new in 1995 \n\nthe\
    \ Trademark Office did not challenge it.\n\nLinux International, with the help\
    \ of Davis & Schroeder PC, \n\nhad the trademark “Linux” transferred to Linus\
    \ Torvalds.\n\nLinus wanted the trademark to go into the public domain, but \n\
    \nI convinced him this was a bad idea because the word “Linux” \n\ncould then\
    \ be used for bad things and Linus would have no way \n\nof stopping it.\n\nSo\
    \ Linux International formed the entity the Linux Mark Insti-\n\ntute™ (LMI) to\
    \ sub-license for free the mark “Linux” as long as \n\nthe sub-licensee used the\
    \ mark “Linux” in the correct way, giv-\n\ning proper attribution.\n\nBy this\
    \ time many entities were using the term “Linux” in their \n\nnames, so LMI was\
    \ busy sub-licensing all these entities, bolster-\n\ning the protection of the\
    \ word “Linux.”\n\nEventually LMI was transferred to The Linux Foundation™, who\
    \ \n\nperforms this registration today (Torvalds still owns the trademark).\n\n\
    … Goes Unpunished\n\nRecently, the Linux Professional Institute™ (LPI) lawyers\
    \ notified \n\nthe executive director of a trademark application that, in the\
    \ \n\nlawyers’ opinion, would “cause confusion” with LPI’s trademark.\n\nI am\
    \ not going to include the specific details of that applica-\n\ntion because I\
    \ do not want to cause embarrassment to the per-\n\nson who applied. I believe\
    \ they made the application in good \n\nfaith. I will simply tell you that their\
    \ application was so broad \n\nthat 90 percent of the people using the phrase\
    \ “Linux Operating \n\nSystem” for professional services would have to attribute\
    \ their \n\nservices to this trademark holder.\n\nAnd so started a conversation\
    \ back and forth between a per-\n\nson who does not understand trademark law,\
    \ and its effects, \n\nwith a person (IANAL: I am not a lawyer) who understands\
    \ \n\ntrademark law and its implications all too well.\n\nWhile Gerry Davis never\
    \ charged Linux International a penny, for \n\nthe clerking, filing, and other\
    \ services of his office, I eventually paid \n\n$30,000 of my own money. I know\
    \ that this instance will cost LPI \n\nlegal fees and filings too – hopefully\
    \ not that much.\n\nPlease be careful with branding and trademark applications.\
    \ \n\nHire a lawyer – they are worth it. Q Q Q\n\nMADDOG’S DOGHOUSE\n\nA trademark\
    \ verifies to customers that a product really is \n\nyours, which also helps them\
    \ trust they’ll get the quality \n\nassociated with your brand.  BY JON “MADDOG”\
    \ HALL\n\nJon “maddog” Hall is an author, \n\neducator, computer scientist, and\
    \ free \n\nsoftware pioneer who has been a \n\npassionate advocate for Linux since\
    \ \n\n1994 when he first met Linus Torvalds \n\nand facilitated the port of Linux\
    \ to a \n\n64-bit system. He serves as president \n\nof Linux International®.\n\
    \nIdentity Ownership\n\n\\[1\\] Linux, Linux International, Nike, the Nike Swoosh,\
    \ Linux Mark \n\nInstitute, Linux Foundation, and the Linux Professional Insti-\n\
    \ntute are all registered trademarks of their respective owners \n\nin many jurisdictions\
    \ around the world.\n\n**Info**\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER\
    \ 2023\n\n75\n\n**LINUX **VOICE\n\nDOGHOUSE – TRADEMARKS"
