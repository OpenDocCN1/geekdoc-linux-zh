  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_84_0.png)\n\n**Shoot \\`em up**\n\n\
    **Antsy Alien Attack Pico**\n\n**D**\n\nespite the scale of many \n\nmodern games,\
    \ with bud-\n\ngets in the hundreds of \n\nmillions, and hundreds of people \n\
    \nworking on them for years, there’s \n\nnothing quite like a lone coder’s \n\n\
    simple adrenaline-fueled shooter. \n\nAntsy Alien Attack Pico is a great \n\n\
    example of one of these, having \n\nbeen developed by Martin Wim-\n\npress for\
    \ the Linux Game Jam \n\n2023 using PICO-8. We’ve cov-\n\nered PICO-8 before,\
    \ a brilliant plat-\n\nform for game development that \n\nenforces strict limitations,\
    \ just as \n\na simple fictitious early 1980s \n\ngames console might. Those limi-\n\
    \ntations include a display of only \n\n128x128 pixels with 16 colors, \n\nsimple\
    \ 4 channel audio, and just \n\n32KB of storage. The hope is that \n\nit allows\
    \ game developers to put \n\ntheir focus and efforts into pure \n\ngameplay, and\
    \ – as with Antsy \n\nAlien Attack Pico – it succeeds.\n\nAntsy Alien Attack Pico\
    \ takes \n\nfull advantage of these limita-\n\ntions, with large chunky pixelated\
    \ \n\nsprites for your ship, its weap-\n\nons, the aliens, and anything else \n\
    \nthat might come along. The \n\n4-channel soundtrack is reminis-\n\ncent of Nemesis\
    \ running on an \n\nMSX, but the game itself is a ver-\n\ntical scroller rather\
    \ than a hori-\n\nzontal one, and you can move \n\nyour ship up and down across\
    \ \n\nthe star field, and left and right \n\nwith a range that extends a little\
    \ \n\npast the screen edges. Your job \n\nis to shoot the aliens or smash \n\n\
    into them, shield permitting, \n\ncatch power-ups, and get \n\nthrough each of\
    \ five successive \n\nwaves and their unique \n\nminigames. Minigames include\
    \ \n\nspeeding through an asteroid \n\nbelt, grabbing power-ups, and \n\nprotecting\
    \ a cargo ship. You can \n\ndo all of this with either a joystick \n\nor with\
    \ the keyboard, but most importantly, you can \n\nchoose to do this with a friend\
    \ for side-by-side coopera-\n\ntive shooter fun, especially from the same keyboard.\
    \ It’s \n\nbrilliantly executed, and perfectly suited to PICO-8’s form \n\nfactor,\
    \ and if you have a device handy, particularly brilliant \n\non a PICO-8 supported\
    \ handheld.\n\n**Project Website**\n\nhttps:// github. com/ wimpysworld/ antsy-alien-attack-pico\n\
    \nIn Antsy, you have a single life with a power bar you need to protect \n\nby\
    \ shooting aliens before they hit you.\n\n**Platform game**\n\n**Jumpy**\n\n**I**\n\
    \nf you prefer your games \n\nscrolling in all directions \n\nrather than just\
    \ one, Jumpy is \n\nfor you. It’s a manic multiplayer \n\nbrawler played on 2D\
    \ platforms \n\nunder the sea. The brawler part \n\nmeans it’s your job to hit\
    \ other \n\nplayers with whatever you have at \n\nhand, including your fins, or\
    \ any \n\nweapons you find within the level. \n\nThe level will zoom and scroll\
    \ \n\naround to follow you, and the ac-\n\ntion is quick and reflexive. It’s a\
    \ lit-\n\ntle like the arcade-classic Bomb-\n\nerman with sabres and pistols \n\
    \nrather than bombs. But the game \n\nalso describes itself as “tactical,” \n\n\
    which means the best strategy is \n\nto use platforms in the back-\n\nground,\
    \ rather than to simply hunt \n\nand chase your enemies. Up to \n\nfour players\
    \ can take part, with \n\nlocal play supporting two from \n\nthe same keyboard\
    \ and a third on \n\na gamepad. For more players, a \n\nnetwork option lets everyone\
    \ use \n\ntheir own machine. Without other \n\nhumans, the computer can be \n\n\
    summoned to control the other \n\ncharacters, which obviously lacks \n\ntypical\
    \ human deviousness but is \n\ngreat for learning the levels.\n\nThere are 14\
    \ different levels in \n\nthe game, ranging from blocky \n\nboats to submerged\
    \ dungeons, \n\nall with a nautical theme reminis-\n\ncent of SpongeBob SquarePants.\
    \ \n\nBut the game’s best feature is the \n\nembedded level editor, which \n\n\
    makes it easy to design and play \n\nyour own fiendish creations. The \n\nmap\
    \ editor is brilliantly imple-\n\nmented with a layered approach, \n\nmuch like\
    \ Gimp. You can open \n\nand edit built-in maps, as well as \n\nstart from scratch,\
    \ and choose \n\nfrom a selection of graphical \n\ntiles, the locations players\
    \ are \n\nspawned, and how collisions af-\n\nfect players. There’s even a \n\n\
    randomize button if you don’t have the time to handcraft \n\na level, and you\
    \ can instantly play your creation to test out \n\nwhether it works. It’s a good\
    \ way for younger players to \n\nexperiment with game design, and they can even\
    \ take \n\nthings further with new characters and weapons, if they \n\nwish, adding\
    \ to a game that’s already a lot of fun to play.\n\n**Project Website**\n\nhttps://\
    \ github. com/ fishfolk/ jumpy\n\nJumpy is currently under development as the\
    \ programmers port \n\ntheir idea to the Bevy game engine.\n\nFOSSPICKS\n\n**LINUX\
    \ **VOICE\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023\n\n85"
