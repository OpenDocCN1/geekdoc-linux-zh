    \ **\n\n**the Circle**\n\nBut how do you write a game like this \n\nin Go? First\
    \ of all, you need to draw the \n\n“world” for the game. This is best done \n\n\
    in such a way that the program can \n\nlater compute the game’s status at \n\n\
    lightning speed for each video frame \n\nthat it is running through. First and\
    \ \n\nforemost, it needs to give feedback \n\nabout whether the race car is still\
    \ driv-\n\ning on the road or has already left the \n\ncontours of the turn and\
    \ is lying some-\n\nwhere in the bushes.\n\nThe program draws the racetrack’s\
    \ \n\nright turn as an overlap of two \n\nconcentric circles (Figure 3) with the\
    \ \n\nradii r2 (outside) and r1 (inside). But \n\nonly the upper left quadrant\
    \ of this \n\nshape is of interest for the curve; this \n\nis why I used some\
    \ cleverly placed \n\nrectangles in Figure 4 to mask the irrel-\n\nevant parts\
    \ of the circles. The blue, \n\ngray, and orange areas later disappear \n\nin\
    \ the display, and two additional \n\nsalmon-colored rectangles define the \n\n\
    road at the entry to the turn and its \n\nexit. Listing 1 implements this \n\n\
    “world,” as gamers call it, using the \n\nCircle() and Rectangle() functions on\
    \ \n\na canvas object provided by the Fyne \n\nframework.\n\n**Round and Square**\n\
    \nBecause the Fyne framework’s methods \n\nfor placing circles and rectangles\
    \ are \n\npretty blunt weapons, I used the draw-\n\nCircle() and drawRectangle()\
    \ functions \n\nto define more convenient interfaces \n\nstarting in lines 32\
    \ and 41. The circle \n\nfunction takes the fill color as its first \n\nparameter,\
    \ followed by the center point \n\nin *x*/*y* format and a radius r. Fyne itself\
    \ \n\nplaces Circle objects by referencing the \n\nupper left corner of an imaginary\
    \ \n\nsquare enclosing the circle, pushes \n\nthem to the desired place with Move(),\
    \ \n\nand then inflates them to the required \n\nsize using Resize(). To obtain\
    \ a circle \n\nwith a radius of r, the enclosing square \n\nneeds a side length\
    \ of *2\\*r*. The interface \n\nfor rectangles in Fyne is more user \n\nfriendly\
    \ than the one for circles, so \n\ndrawRectangle() in Listing 1 simply \n\ncombines\
    \ the calls to the Move() and Re-\n\nsize() methods, for the calling function\
    \ \n\nto complete it all in one single action.\n\nArmed with this toolkit, the\
    \ main \n\ndrawWorld() function goes about creating \n\ntwo concentric circles\
    \ ci and co; three \n\nmasking rectangles bg (background), mb \n\n(bottom), and\
    \ mr (top right); and the two \n\nsections of road in and out that lead in \n\n\
    and out of the turn, as salmon-colored \n\nrectangles. The function creates the\
    \ race \n\ncar as a green rectangle and writes the \n\ndimensions of the avatar\
    \ to the Car struc-\n\nture, which contains other parameters \n\nsuch as speed\
    \ and starting position and \n\nis defined later on in Listing 2. Line 27 \n\n\
    dumps all the graphic objects created so \n\nfar into a container \n\nwhich drawWorld()\
    \ re-\n\nturns to the caller \n\nalong with the Car ob-\n\nject, so that the caller\
    \ \n\ncan feed them to the \n\nframework’s graphics \n\nengine for \n\nmanagement.\n\
