    \n20 car.Timer.Update()\n\n21 run(car, ctrl, tracker)\n\n22 }\n\n23 }\n\n24 }()\n\
    \n25 \n\n26 return ctrl\n\n27 }\n\n28 \n\n29 func run(car \\*Car, ctrl chan int,\
    \ tracker Tracker) {\n\n30 for {\n\n31 select {\n\n32 case <-ctrl:\n\n33 case\
