  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_34_0.png)\n\nteam of seasoned Linux\
    \ developers. \n\nWhat this team has put together as a \n\nfirst release in just\
    \ six months is ground-\n\nbreaking and gives rise to hope that Va-\n\nnilla OS\
    \ will establish itself as a genuine \n\nalternative on the distribution scene\
    \ in \n\nupcoming releases. A leaner version for \n\ndevelopers is currently in\
    \ development, \n\nand a gamer-focused edition for KDE \n\nPlasma, which is also\
    \ being considered, \n\nwould certainly contribute to this hap-\n\npening \\[7\\\
    ].\n\nIn my opinion, Vanilla OS is not yet \n\nsuitable for production use – it\
    \ was too \n\nbuggy in various places. However, dur-\n\ning testing, the building\
    \ sites were con-\n\nstantly improved by minor updates. Ex-\n\nperimenting with\
    \ Vanilla OS is definitely \n\nalready great fun. The developers and \n\nthe community\
    \ use the Discord Vanilla \n\nOS channel and are open to questions \n\nfrom users.\n\
    \nThe manual \\[8\\] and documentation \n\n\\[9\\] continue to grow with the distribu-\n\
