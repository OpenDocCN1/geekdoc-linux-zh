  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_24_0.png)\n\n• Recover deleted files;\
    \ repair boot sectors and super blocks \n\nwith TestDisk and PhotoRec.\n\n• Copy\
    \ files across the network with rsync.\n\n• Manage your files and folders with\
    \ Midnight Commander, a \n\nclassic two-column, text-mode file manager that works\
    \ like \n\nthe ancient Norton Commander.\n\nYou can type manual in the shell to\
    \ read the HTML SystemRes-\n\ncue documentation in the ELinks browser.\n\nWhen\
    \ you start X, you can also use the following graphical \n\ntools:\n\n• GParted,\
    \ a comfortable front end for filesystem creation, re-\n\nsizing, and moving (Figure\
    \ 4); many distributions use it in \n\nthe installer.\n\n• Xfburn, a tool for\
    \ creating ISO images and writing them to a \n\nCD, DVD, or Blu-ray disc.\n\n\
    • GSmartControl, a tool that reads \n\nSMART data from your hard drive and \n\n\
    lets you perform self-tests (Figure 5).\n\nFor some reason, SystemRescue also\
    \ in-\n\ncludes the Geany IDE, though no com-\n\npilers or other development tools\
    \ are \n\ninstalled.\n\nBecause SystemRescue is based on \n\nArch Linux, you can\
    \ use the pacman com-\n\nmand to install missing software; for this \n\narticle,\
    \ I added the scrot screenshot tool \n\nwith:\n\npacman -Sy scrot\n\nWhen booting,\
    \ use the copytoram option \n\n(by selecting the second entry in the \n\nmenu).\
    \ The boot process will take a bit \n\nlonger because the whole system is read\
    \ into a RAM disk, but \n\nafterwards, you can remove the boot medium. If you\
    \ start \n\nSystemRescue from a USB stick, you won’t notice much of a \n\ndifference,\
    \ but if you’re running the system from a DVD, \n\nyou’ll hear the disc spinning\
    \ every time you start a program \n\nor run a command in the terminal, and it\
    \ will take some time \n\nto read the data. With copytoram mode, this slowdown\
    \ will \n\nnot happen.\n\nOn the project website, you find lots of documentation,\
    \ in-\n\ncluding a book titled “System Rescue – A Step by Step Guide \n\nto Getting\
    \ Started.” The book is from 2022 and slightly out \n\nof sync with the latest\
    \ changes to the distribution, but it is \n\nstill a good read for getting started.\
    \ You can download PDF, \n\nEPUB, and Mobi versions of this guide \\[7\\].\n\n\
    **Figure 4:**** Many distributions use GParted in the installer.**\n\n**Figure\
    \ 5:**** SystemRescue includes GSmartControl, which lets you check **\n\n**the\
    \ health status of your hard disk.**\n\n25\n\nLINUX-MAGAZINE.COM \n\nISSUE 274\
    \ \n\nSEPTEMBER 2023\n\nCOVER STORY\n\nSpecialty Distros"
