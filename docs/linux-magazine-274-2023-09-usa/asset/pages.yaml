  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_91_0.png)\n\n*CA*, and start the *Chromatic\
    \ Aberrations* filter in \n\nG’MIC (Figure 11). It gives you the ability to re-\n\
    \nmove chromatic aberrations in two colors (the \n\npreset colors are red and\
    \ green).\n\nIn our image there are mainly red chromatic ab-\n\nerrations, so\
    \ you don’t need to change the colors. \n\nHowever, blue chromatic aberrations\
    \ are also very \n\ncommon. In that case, click on the small red box \n\nnext\
    \ to *Primary Color*; a small color selection win-\n\ndow appears. Press the *Pick\
    \ Screen Color* button \n\nthere. The cursor now turns into a small cross. \n\n\
    Click on a chromatic aberration in the preview win-\n\ndow of G’MIC and confirm\
    \ the color change by \n\npressing the *OK* button at the bottom right.\n\nNow\
    \ move the preview to the area where the \n\nchromatic aberration is most pronounced.\
    \ In the \n\nsample image, it is the zone where the waves and \n\nthe beach meet.\
    \ Now move the *X Amplitude* and *Y *\n\n*Amplitude* sliders to the left until\
    \ the chromatic ab-\n\nerrations disappear, and then click *OK*.\n\nIf you now\
    \ check all image areas in the \n\n100-percent view, you will notice that some\
    \ chro-\n\nmatic aberrations have been corrected, but new \n\nones have appeared\
    \ in other places. Let’s create \n\na layer mask (in Krita, Transparency mask)\
    \ to \n\ntackle this and fill it with the color black to make \n\nthe corrections\
    \ on the top layer invisible. Then \n\npaint over the corrected areas with white\
    \ to fade \n\nonly them back in.\n\nIn the filter setting options, adjust the\
    \ *Amplitude* \n\nand *Zoom* sliders. To remove pincushion distor-\n\ntion, drag\
    \ the *Amplitude* knob a little to the left. \n\nThe correct value for our example\
    \ image is *\\-0.09*. \n\nHowever, G’MIC automatically zooms in and crops \n\n\
    the image slightly during correction. To zoom out \n\nof the image and cut away\
    \ less, also drag the \n\n*Zoom* slider a little to the left, to the *\\-0.05*\
    \ value. \n\nConfirm the correction by clicking *OK*.\n\nNow zoom into the image\
    \ and check it for errors in \n\nthe 100-percent view. To do this, click on the\
    \ drop-\n\ndown list in the lower left corner of the overview win-\n\ndow and\
    \ select *100%*. You will then see a small rect-\n\nangle in the overview. It\
    \ shows the visible area of the \n\nimage in the large preview window. The photo\
    \ still has \n\nsome weaknesses. It has a bit of color noise, and in \n\nsome\
    \ places there are chromatic aberrations (color \n\nfringes). Overall, it turns\
    \ out to be relatively blurry.\n\nG’MIC provides a good filter to remove the noise.\
    \ \n\nCreate a new layer from the visible one and assign \n\na name of *Noise*.\
    \ Start G’MIC again and search for \n\nthe *Iain’s Fast Denoise* filter (Figure\
    \ 10). It lets you \n\nreduce the chrominance noise only; this has less \n\nimpact\
    \ on the crispness of the image. To do this, in-\n\ncrease the value of the *Chroma*\
    \ slider to *2*.\n\n**Chromatic Aberrations**\n\nTo correct chromatic aberrations,\
    \ again create a \n\nnew layer from the visible one, assign a name of \n\n**Figure\
    \ 12:** Use a transparency mask to mask the areas of the image where editing has\
    \ created new image defects.\n\nSEPTEMBER 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\
    \n92\n\nTUTORIAL – KRITA\n\n**LINUX **VOICE"
