  md: "![](img/8db7a58bef2f490a3db3c4fd35de2457_37_0.png)\n\nssh U\n\n -o NoHostAuthenticationForLocalhost=U\n\
    \n yes\n\n -p $sshport root@127.0.0.1\n\nWhen you are finished with the VM, \n\
    \nsimply close the terminal. Similarly, you \n\ncan delete the file.\n\n**debvm-waitssh**\n\
    \nThe debvm-waitssh command is the \n\nequivalent of \\--sshport=SSHPORT (\\-s\
    \ \n\nSSHPORT). It is used to connect to a VM \n\nwith an exposed SSH port and\
    \ no au-\n\nthentication. If only the basic com-\n\nmand is entered, it defaults\
    \ to a time-\n\nout of 60 seconds and a hostname of \n\n127.0.0.1 so that only\
    \ the port (a num-\n\nber between 1 and 655) needs to be en-\n\ntered. For instance:\n\
    \ndebvm-waitssh 600\n\nOtherwise, you can use the following \n\nstructure to enter\
    \ parameters:\n\ndebvm-waitssh -t SECONDS\\] HOSTNAME:PORT\n\nIf the \\-q option\
    \ is entered, no message \n\ndisplays when the timeout is reached.\n\n**Limitations**\n\
    \nBecause debvm is under rapid develop-\n\nment, its final form cannot be pre-\n\
    \ndicted. On the one hand, in its current \n\nform, debvm is only a substitute\
    \ for \n\nthe common virtualization tools in lim-\n\nited circumstances. Because\
    \ debvm \n\ncurrently works only with Debian and \n\nan ext4 filesystem, it is\
    \ restricted to \n\nprecisely those circumstances. Just as \n\nusers might want\
    \ a VM with a different \n\nhardware architecture, so they might \n\nsometimes\
    \ want a VM with a different \n\nfilesystem. Clearly, debvm’s develop-\n\nment\
    \ has a way to go, even though de-\n\nvelopers and ordinary users can al-\n\n\
    ready find it useful. Yet, just as clearly, \n\ndebvm is a project to watch. And\
    \ who \n\nknows? Ports to non-Debian distribu-\n\ntions may arrive any day now.\
    \ QQQ\n\nthe mirrors used are, but in my experience \n\nit is generally less than\
    \ three minutes.\n\n**debvm-run**\n\nThe easiest place to run a VM is from its\
    \ \n\ndirectory, specifying its file if necessary. \n\nJust as debvm-create is\
    \ a wrapper for \n\nmmdebstrap, so deb-vm-run is a wrapper for \n\nthe Qemu emulator.\n\
    \nMost of the time, the command can be \n\nrun without options. The output for\
    \ the \n\ncommand begins with a summary of its \n\noperation (Figure 4), followed\
    \ by a long \n\nlist of boot actions (Figure 5), and ends \n\nwith logging in\
    \ to the VM (Figure 6).\n\nWhen required, options can be added. \n\nWhen a directory\
    \ contains multiple VMs, \n\nthe one to boot must be specified with \n\n\\--image=IMAGE\
    \ (\\-i=IMAGE). If a graphical \n\ninterface is included in the VM, \\--graph-\n\
    \nical (\\-g) opens the VM in a separate \n\nwindow with the mouse enabled. For\
    \ \n\nspecific circumstances or hardware, \n\n\\--qemu can be used to add Qemu\
    \ options, \n\nalthough the most likely ones are avail-\n\nable in debvm-create.\
    \ The debv-run man \n\npage suggests that \\--snapshot=SNAPSHOT \n\ncan be used\
    \ to back up the VM. Ordinar-\n\nily you can log in to a VM with \n\n\\--sshport=SSHPORT\
    \ (\\-s SSHPORT) using the \n\nhostname 127.0.0.1. If this hostname is \n\nnot\
    \ already among your known hosts, \n\nyou can connect without updating the \n\n\
    list with:\n\n**\\[1\\]** diffoscope: *https:// diffoscope. org/*\n\n**\\[2\\\
    ]** debvm: \n\n*https:// tracker. debian. org/ pkg/ debvm*\n\n**\\[3\\]** Debian\
    \ ports: \n\n*https:// www. debian. org/ ports/*\n\n**Info**\n\n**Figure 4:****\
    \ A summary of **debvm-run**‘s boot process.**\n\n**Figure 5:**** Boot actions\
    \ for **debvm-run**.**\n\n**Figure 6:**** Logging in to a VM with **debvm-run**.**\n\
    \n38\n\nCommand Line – Disposable VMs\n\nSEPTEMBER 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\
    \nIN-DEPTH"
