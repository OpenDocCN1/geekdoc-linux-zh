    but if users turn off their workstations overnight, there is a high chance of
    them receiving a different address the next morning. The administrator can reliably
    trace a request back to the source for the time of an IP lease.


    ## Finishing Up in the Browser


    Thanks to DNS-based Pi-hole, you have already removed a large part of the unwanted
    content from the data stream. However, some content remains if it can hide from
    the filter or it is actually included in the original source URL. The only thing
    that helps to get rid of the last remaining trackers and ads is a browser plug-in.
    From the mass of available add-ons, we picked two at this point: Ghostery and
    AdNauseam.


    Ghostery is one of the most popular and reliable ad filters. Besides the plug-in
    for Chrome and Firefox, Ghostery is also available as a ready-to-use browser,
    based on the Chrome source files. This also means that Ghostery runs on smartphones
    and tablets. It makes a big difference whether you watch YouTube videos on your
    phone in the unfiltered app or via the regular YouTube website within the filtered
    Ghostery browser for Android or iOS.


    AdNauseam adds a special feature to the plain vanilla filter function. Although
    the filter does not display the embedded banners in the browser, the plug-in clicks
    on all advertising links in the background. Advertisers seek to present personally
    tailored ads to users. This means that advertisers can create a profile of a user’s
    browsing behavior by analyzing the kind of ads that users click on. AdNauseam
    waters down your profile: If you seem to be interested in everything from sports
    betting to laxatives, the advertiser can’t create a personalized profile at all.


    This filter is recommended if you have already created profiles for your browser
    and you are repeatedly confronted with the same advertising topics. However, the
    tool is controversial, because advertisers often have to pay for banner clicks
    – whereas you as a user then do not get to see the paid content. Google has therefore
    removed AdNauseam from the Chrome Store and you need to set up the plug-in manually
    as a Chrome user. The automatic installer is still available for Firefox.


    ## Conclusions


    If you are fed up with the flood of ads on the Internet and do not want to be
    tracked, the combination of a DNS black hole and a browser plug-in will be a big
    help. As a side effect, tools such as Pi-hole can also fend off phishing attacks,
    as many of the known phishing URLs are already blacklisted. Ghostery, as an established
    add-on, then also removes the remnants of things that Pi-hole cannot block. Q
    Q Q


    that has a hybridized LAN adapter. With the MAC and IP address defined in the
    systemd unit, the container always starts up with the same network parameters,
    regardless of the host system. During operation, Pi-hole makes virtually no changes
    to the underlying filesystem. This is why you can use built-in tools to copy the
    two directories of the Pi-hole setup to a backup drive or a second host regularly
    and in a relatively simple way, with rsync, for example. It is also possible to
    store the Pi-hole data in an NFS share so multiple hosts can access the information.


    ## Customize DNS and DHCP Service


    For Pi-hole to cooperate with the existing DNS/DHCP configuration, some changes
    to the existing settings are required. First you need to change DHCP option 6
    (DNS server) of your DHCP service to the Pi-hole server. With dnsmasq, the option
    then looks like this:


    ```

    dhcp-option=6,192.168.2.2

    ```


    Similarly, dnsmasq can use other DNS servers than the host it is running on as
    forwarders. You need to list all the required DNS servers in an /etc/nameservers.conf
    file as follows:


    ```

    nameserver 9.9.9.9

    nameserver 1.1.1.1

    nameserver 149.112.112.112

    nameserver 1.0.0.1

    ```


    Then specify this list in your dnsmasq.conf file:


    ```

    resolv-file=/etc/nameservers.conf

    ```


    Now the underlying host itself could also use the Pi-hole server for name resolution,
    but a secondary DNS is absolutely essential. When you restart the Pi-hole container,
    the host must be able to resolve the Docker registry URL to do this. The host
    must not rely solely on the Pi-hole server.


    ## Avoiding Legal Worries


    Unlike a proxy filter, filtering using Pi-hole does not directly interfere with
    your users’ data packets. Despite this, Pi-hole logs the systems’ DNS calls. An
    administrator could use the Pi-hole logs and the DHCP leases of the underlying
    dnsmasq to determine exactly when a specific user issued a specific DNS query.
    The request can be traced back to the workstation via the MAC address. Short lease
    times in the DHCP segment help to make this more difficult. For example, if you
    specify a time of four hours as the lease time, clients need to request an IP
    address from DHCP server every four hours. The client usually tries to renew and
    reuse the already existing IP.


