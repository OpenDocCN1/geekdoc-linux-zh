    partition, Ext4 filesystem). When the partition table looks good, ask GParted
    to make the changes by clicking the green tick symbol. Once you’re done, exit
    the partitioner and select the partition.


    Even when copying Puppy Linux to a fresh hard drive (for example, in a virtual
    machine), the installer will add a Windows option to the boot menu. You can remove
    that option by editing Grub’s menu.lst file when the option is offered during
    the installation process (Figure 2).


    I looked at FossaPup64 9.5 (fossapup64-9.5.iso, 409MB) [4] which is based on the
    64-bit version of Ubuntu 20.04 (Focal Fossa), and at the newer Slackware-based
    S15Pup64 22.12 (S15Pup64-22.12+4-T.iso, 402MB) [5], which is also available in
    a 32-bit-compatible version for your older Intel processors.


    Each time you boot the system, you’ll be dropped in a graphical session that runs
    Joe’s Window Manager (JWM) [6] as root. JWM is a lightweight window manager, which
    makes it a good choice for a system that is intended to run on both recent and
    older hardware. By default JWM creates three desktops that you can access via
    Ctrl+Alt+Left Arrow and Ctrl+Alt+Right Arrow.


    S15Pup64’s 402MB ISO image contains a lot of useful software. From the icon bar
    at the top of the desktop (Figure 3), you can launch a file manager (ROX-Filer),
    a web browser (Light 48.0, based on Firefox), an IRC client (HexChat) which automatically
    joins the #puppylinux channel on Freenode, LXTerminal, a task manager, office
    software (the word processor AbiWord and the spreadsheet program Gnumeric), a
    simple painting program (mtPaint), and some configuration tools. You can find
    more applications via the start menu in the lower left corner. When you’re working
    on the command line, you will find that S15Pup64 provides a current OpenSSH version
    so that you can use an older computer running Puppy Linux to log in to other machines
    in your network (Figure 3).


    It is possible to add software to a Puppy Linux system. For example, in the Slackware-based
    S15Pup64, choose *Applications* | *Setup* | *Package manager* to reach the package
    manager, which uses several repositories and can install Puppy software packages.
    Puppy packages have the .pet extension and are actually xz-compressed tar files.
    You can also install packages from UEFI to Legacy in the BIOS settings. Writing
    it to a CD also worked, but again, booting it in the Lenovo IdeaPad only worked
    after enabling legacy boot modes in the BIOS. I also successfully tested Tiny
    Core on an ancient IBM ThinkPad T30 (featuring a single-core Pentium 4 processor
    at 2GHz and 512MB of memory).


    On the IdeaPad, Tiny Core did not detect the modern 16:9 screen resolution and
    ran X with a classic 4:3 resolution (1024x768), but I was able to fix that by
    running the xsetup.sh script in a terminal window, selecting the right resolution
    (1366x768), terminating X with Ctrl+Alt+Backspace, and restarting the X server
    with the startx command.


    The FLVM window manager starts up with a single virtual desktop, but you can easily
    create extra desktops by pressing Ctrl+F2, Ctrl+F3, and so on: These shortcuts
    will create desktops #2 and #3 and switch to them; you go back to the initial
    desktop with Ctrl+F1. Getting rid of desktops is easy, too: Just click on an empty
    area on the desktop and select the *Desktop n* | *delete this desktop* menu entry.


    Tiny Core comes without any interesting pre-installed applications, but it lets
    you add software with the same method that Puppy Linux uses: by mounting a squash
    filesystem. However, Tiny Core does not create overlays with UnionFS (like Puppy),
    but mounts the filesystems in separate folders and adds symlinks. So, for example,
    when you want to install the command-line tool, you launch the *Apps* application
    (Figure 4), select *Apps* | *Cloud (Remote)* | *Browse*, find and select the file.tcz
    package in the list, change the drop-down option in the lower right corner to
    *Download + Load* and click on *Go*. Tiny Core then downloads a .tcz file (file.tcz)
    that contains a squash filesystem, it mounts the file on /tmp/tcloop/, and it
    symlinks /tmp/tcloop/usr/local/bin/ to /local/bin so that you can run the command.
    When you reboot, the freshly installed software will appear to be gone: you cannot
    use the command anymore. But the file.tcz package was not deleted; its integration
    into the running system is not permanent. You can change that by running *Apps*
    again and selecting *Apps* | *Maintenance* | *OnBoot Maintenance*. In the two-column
    view, find file.tcz in the left column, select it, and click on *Add item*. The
    entry will move to the right column. Now reboot (type sudo reboot in a terminal
    window), and file will be available from the underlying Slackware distribution.
    Installing .pet packages sometimes led to unsatisfied dependencies, both with
    the current S15Pup64 and the older FossaPup64. Puppy Linux also uses Squashfs
    (*sfs) files, which contain compressed systems; the distribution mounts them and
    adds the files to the general filesystem (using UnionFS). That way, you try the
    software without actually installing it.


    Tiny Core


    Damn Small Linux (DSL) [7] was once a popular distribution. DSL crammed as much
    software as possible into a 50MB ISO image, and the last release (version 4.4.10
    from November 2008) is still available online, but its software components are
    completely outdated. DSL uses Linux kernel 2.4.31, the X graphics driver from
    X86, and an old Dillo web browser and OpenSSH 3.6.1, which are not compatible
    with modern websites and SSH servers, so you cannot use the system to browse the
    web or login on other machines. However, there’s a DSL successor called Tiny Core
    (TCL) [8] that is still in development: Version 14.0 was released in April 2023.
    Tiny Core 14.0 uses a current Linux kernel (version 6.1.2) and the Fast Light
    Window Manager (FLWM), running on the same old-school X server as its predecessor:
    In our tests, X did not work properly in a VirtualBox VM, but VMware had no problems
    with it. Our test notebook could only boot Tiny Core from a USB stick after changing
    the boot mode


    **Figure 1:** FossaPup64 9.5 is a Puppy Linux version that uses programs and libraries
    from Ubuntu 20.04 (Focal Fossa).

    **Figure 2:** In the Puppy installer, edit the Grub menu configuration to get
    rid of a superfluous Windows entry.

    **Figure 3:** S15Pup64 (Puppy Linux) is lightweight but current: Use OpenSSH to
    connect to other machines on your network.

    **Figure 4:** Tiny Core Linux lets you install applications via a very simple
    package manager.

    **Figure 5:** You can also run LibreOffice on Tiny Core.


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_17_0.png)

    ![](img/8db7a58bef2f490a3db3c4fd35de2457_18_0.png)


    (Note: The OCR text contained repetitive/overlapping segments which were merged
    logically.)


    When you install new packages and pick the *OnBoot* option from the drop-down
    menu before you click on *Go*, you can integrate the package’s programs automatically,
    but it will slow down the otherwise fast boot process, because Tiny Core mounts
    each package separately and creates the symlinks. The application list is not
    restricted to tiny programs; for example, you can also install a current LibreOffice
    version – of course, that will only be useful if your computer is fast enough
    (Figure 5).


    antiX Linux


    The antiX project describes their Linux distribution [9] as a “fast, lightweight
    and easy-to-install systemd-free Linux CD distribution based on Debian Stable
    for Intel-AMD x86 compatible systems.” There’s a problem right in the first sentence
    on the website: When you download the ISO image, you’ll notice that there are
    several editions of the current version 22 to choose from. You can make the following
    decisions:


    - 64-bit or 32-bit version

    - use System V init (sysvinit) or runit (yet another replacement for sysvinit)

    - and get the *full* system (1.4GB), a *base* system (basically *full* without
    LibreOffice; 820MB), a *core* system (text-mode only; 460MB), or a *net* system
    (for manually downloading and building the rest of the system; 180MB).


    You can pick one of the 16 images, and each of them that will give you a graphical
    desktop is larger than 700MB, so it will not fit on a CD.

