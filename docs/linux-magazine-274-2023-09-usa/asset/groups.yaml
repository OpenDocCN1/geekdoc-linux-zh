    ## English Translation of Children’s Book Ada & Zangemann Available


    *Ada & Zangemann: A Tale of Software, Skateboards, and Raspberry Ice Cream* is
    an illustrated children’s book that centers around a famous inventor, Zangemann,
    who has created inventions loved by all. The book is written by Matthias Kirschner
    and Sandra Brandstätter.


    One day a curious young tinkerer, Ada, smacks Zangemann in the shin with her skateboard.
    After this incident, the famous inventor makes a “momentous decision,” but Ada
    sees through the ruse. The girl begins to experiment with hardware and software
    and realizes how important it is for others to be able to control technology.


    This book is sure to interest readers, from 6 to 106, and inspire them to tinker
    and help shape the world of technology. It also serves as a cautionary tale for
    standing up to bullies, all the while offering a backdrop of ethics and commenting
    on challenging topics such as monopolies, software freedom, e-waste, and much
    more.


    *Ada & Zangemann* was originally written in German and published by O’Reilly German
    (*https://oreilly.de/produkt/ada-und-zangemann/?ref=10022*). Recently, the book
    enjoyed its first English translation and is now available from No Starch Press
    (*https://nostarch.com/ada-zangemann*).


    There also are templates for children you can download (*https://fsfe.org/activities/ada-zangemann/ada-drawing-template.en.pdf*)
    that allow children (of all ages) to do things like draw what Zangemann’s inventions
    might look like, drawing computers that might possibly be from Zangemann, and
    more.


    ## Steam Client Hardware Acceleration on Linux


    Steam helped to herald in an age of gaming on Linux like no other software. But
    for the longest time, Linux users had to deal with performance issues that made
    it lag behind that of Windows. Animations would often lag and the UI (as a whole)
    wasn’t nearly as responsive as it should be.


    Say goodbye to those performance issues, thanks to the latest stable update of
    the platform. With the latest iteration, users can finally take advantage of hardware
    acceleration on Linux. The only caveat to this new addition is that it’s not quite
    stable with NVIDIA GPUs, when running on the aging X11 protocol. Because of that,
    hardware acceleration is disabled (by default) for machines using NVIDIA GPUs.
    At the same time, DPI scaling may be problematic with acceleration switched off.


    Other features for the new release include better KDE Plasma support, more options
    for notifications, an overhauled in-game overlay, new notes functionality (that
    includes rich text formatting, image pasting, and offline functionality), greatly
    improved visuals (including dialogs, menus, fonts, and colors), and numerous bug
    fixes.


    You can read the full release notes from the official Steam blog (*https://steam-community.com/games/593110/announcements/detail/3687931965598323437*).
    To update your Steam client, open the app and go to *Steam* | *Check for Steam
    Client Updates*. If there’s an update available, make sure to apply it to enjoy
    these exciting new additions to the Linux version.


    Linux News

    LINUX-MAGAZINE.COM ISSUE 274 SEPTEMBER 2023

    NEWS


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_11_0.png)


    ## Kernel News


    Akihiro said, “Despite that, it still expects LINUX_EFISTUB_MINOR_VERSION (include/linux/pe.h)
    referred from arch/x86/boot/header.S to be 0x0. I confirmed that the kernel can
    boot by just setting LINUX_EFISTUB_MINOR_VERSION to 0x0.”


    Akihiro said he would ask Apple to remove that particular check, as it seemed
    pointless. But he also asked the Linux developers, “Would it be possible to revert
    the LINUX_EFISTUB_MINOR_VERSION value (not the actual code) to 0x0? Or will it
    break something else?”


    Ard felt that approaching Apple was probably the best move. He said, “If the existing
    virtual machine BIOS has a hardcoded check that the EFI stub version is 1.0 even
    if it does not boot via EFI to begin with, I don’t see how we can reasonably treat
    this as a regression that needs fixing on the Linux side.”


    Ard also pointed out that there could be a significant cost to changing the Linux
    EFISTUB minor version requirement. He said, “the version bump to PE image v1.1
    sets a baseline across all Linux architectures that can boot via EFI that initrd
    loading is supported via the command line as well as via LoadFile protocol. Reverting
    that would substantially reduce the value of having this embedded into the image.”


    It was at this point that Linus Tordsds into the conversation. He: “Well we consider
    firmware issues to be the same as any hardware issue. If firmware has a bug that
    requires us to do things certain ways, that’s really different from hardware that
    requires insane init sequence. So why not just say that LINUX_EFISTUB_MINOR_VERSION
    should be 0, and just add the comment that versioning doesn’t work? I’m not sure
    why this was tied into enabling initrd loader. Numbered version checks are fundamentally
    broken and stupid.”


    ### The Hot Mess of Closed Source


    In the course of trying to track down regression, Akihiro traced the problem to
    a couple of patches that had been accepted into a recent kernel release. A regression
    is when something stops working and the developers have to look back at the patch
    history to see which one caused the breakage. Identifying regressions is what
    the Git bisect command is for. It starts from a known good version and a known
    bad version, tests the middle version, and then keeps going to the next middle
    version until it finds the bad patch that started it. Git makes regressions fun.


    However, this particular regression had to do with running virtualized systems
    and related to both Advanced Configuration and Power Interface (ACPI), which is
    for discovering and configuring the hardware on a given system, and EFISTUB, which
    lets the Unified Extensible Firmware Interface load the kernel as an EFI application.
    The keyword is “firmware.” Generally this is closed source associated with a specific
    piece of hardware, without which the hardware won’t run at all. Linux tolerates
    it because it has no choice, but as with Basic Input/Output System (BIOS), firmware
    is generally always a broken, buggy pain in the butt. Sometimes developers will
    reverse engineer the firmware and write their open source version, but generally
    the closed source mess is what we get.


    For example, when Akihiro reported the kernel regression, Ard Biesheuvel asked
    if he’d been using Open Virtual Machine Firmware (OVMF), an open source BIOS alternative,
    designed for booting virtual machines – specifically the Qemu open source virtualization
    system. However Akihiro replied that he wasn’t using Qemu. He was using Apple’s
    closed source framework, which also didn’t use UEFI to load the kernel.


    The Linux kernel mailing list comprises the core of Linux development. Traffic
    volumes are immense, often reaching 10,000 messages in a week, and keeping up
    to date with the entire scope of development is a virtually impossible task for
    one person. One of the few brave souls to take on this task is Zack Brown.


    Author: Zack’s Kernel News Chronicler Zack Brown reports on the latest news, views,
    dilemmas, and developments within the Linux kernel community. *By Zack Brown*


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_12_0.png)


    Kernel News

    LINUX-MAGAZINE.COM ISSUE 274 SEPTEMBER 2023

    NEWS


    Akihiro remarked, “Looks like Apple’s vmlinuz loader only requires LINUX_EFISTUB_MINOR_VERSION
    to be 0x0 and does not care about LINUX_EFISTUB_MAJOR_VERSION.”


    And the thread ended.


    Accommodating busted hardware and firmware is not new at all. It’s fascinating
    to imagine how much thoroughly broken hardware is accommodated in the weirdest
    possible ways by the Linux kernel code, often resulting in poorer performance
    and avoiding whole swaths of high-powered hardware features that themselves represented
    big security holes. Some of these hardware bugs even get their own names, such
    as Spectre, Meltdown, Foreshadow, ZombieLoad, MDS, LazyFP, PortSmash, TLBleed,
    Plundervolt, CacheOut, and the list goes on.


    ## TV Is the Thing This Year


    Doug Berger wanted to eke out every last drop of RAM efficiency from the Linux
    kernel, especially when running Broadcom System-on-a-Chip (SoC) hardware such
    as BCM7445 and BCM7278 built for TVs. These systems and others like them, he said,
    “contain multiple memory controllers with each mapped in a different address range.
    Uniform memory access (UMA) is generally found in cheap systems that aren’t expected
    to handle heavy workloads. It stands in contrast with non-uniform memory access
    (NUMA), where each processor has its own local memory, allowing the system to
    make the best possible use of each processor’s specialized capabilities. UMA is
    fundamentally a corner-cut technology. Memory is made available to all processors
    at the cost of faster processors having to accept slower RAM. But there are still
    ways to speed up memory usage – for example, by grouping the memory allocations
    for individual threads together. That way there would be less need to jump between
    disparately located memory regions.


    Not all memory allocations can simply be moved around, however. Some level system
    code needs to stay in one place. To distinguish between allocations that can and
    can’t be moved around the kernel, memory can be labeled as ZONE_MOVABLE. However,
    on these Broadcom UMA systems, it wasn’t easy. As Doug put it, “Unfortunately,
    the monolithic layout of zones would mean that if the lowest memory controller
    contains ZONE_MOVABLE memory then all of the memory available from controllers
    at higher addresses must also be in the ZONE_MOVABLE zone.” This in turn, he went
    on, “would force all kernel accesses onto the lowest memory controller and significantly
    reduce the amount of memory available for non-movable allocations.”


    Part of the whole problem is that the kernel could simply not do UMA and treat
    Broadcom TVs and all other devices as full NUMA systems. After all, they have
    multiple CPUs, so why not do the standard thing? But this gets back to why UMA
    exists in the first place – to make as much RAM possible available to all CPUs
    on a system containing scarce resources. As Doug put it, “NUMA architectures support
    distributing movable core across each node, but it is undesirable to introduce
    the overhead and complexities of NUMA on systems that don’t have Non-Uniform Memory
    Architecture.”


    In response to Doug’s patch, Mel Gorman replied with some objections. In particular,
    he wasn’t convinced that the patch would actually improve memory usage on those
    Broadcom systems. Mel had actually been one of the main people to implement ZONE_MOVABLE
    support in the kernel in the first place, and he had some serious regrets on that
    score. He said, “Zones are about addressing limitations primarily and frankly,
    ZONE_ABLE was a bad idea in retrospect.” A better idea, he said, would have been
    to treat UMA as just a special case of NUMA. Specifically, “create a separate
    NUMA node with distance-1 to the local node that was ZONE_MOVABLE with the zonelists
    structured that GFP_MOVABLE allocations would prefer the ‘movable’ node first.”


    Mel lamented, “While I don’t recall why I did not take that approach, it most
    likely was because CONFIG_NUMA was not always set, it was only intended for hugebfs
    allocations and maybe I didn’t have the necessary skill or foresight to take that
    approach.”


    However, Doug replied, “It remains true that CONFIG\_NUMA is not always set and
    that is a key motivator for this patch set. For example, Google is moving to a
    common GKI kernel for their Google TV platform that they are requiring vendors
    to support. Currently the arm64 GKI kernel does not set CONFIG\_NUMA and it seems
    unlikely that we will be able to get all vendors to accept such a change.”


    Doug also remarked, “This patch set is fundamentally about greater control over
    the placement of movablecore memory.”

