    人工智能（AI）是每个人关注的焦点，这不仅是因为聊天机器人和 ChatGPT 文本生成器。当然，AI 开发出的能力远超在无数网站上与聊天机器人对话。例如，AI
    可用于处理声学语音信号，它是自动驾驶的决条件。某些应用程序——以及生成 AI 模型——需要具有强大处理器以及充足存储空间和内存的计算机。相比之下，像树莓派这样的小型计算机更有可能从利用
    AI 实现的现成方法和应用程序中获益。


    所有这些过程都基于机器学习（ML），而机器学习本身是基于处理参考数据信息的自适应算法的。深度学习作为机器学习的一个子集，使用了包含多个分层处理层的人工神经网络。网络神经元以多种方式相互连接，每一层对接收到的参考数据进行越来越抽象的处理。然后从结果推导出解决方案或行动。


    **TensorFlow**


    TensorFlow [1] 由 Google AI 于 2015 年发布，是一个开源框架，……


    主图版权 © Charles Taylor, 123RF.com. MakerSpace。


    ……旨在简化深度学习模型的开发和训练。它支持多种编程语言，可用于各种用途，例如各种 Google 服务中的语言数据处理。它还可以用于识别和分类图像中的模式和对象。


    TensorFlow Lite [2] 是专为嵌入式和物联网（IoT）空间设计的解决方案，解决了那里存在的硬件限制。该版本不需要访问互联网，因为它不向服务器发送数据，这不仅在数据保护方面是一件好事，还能避免延迟并降低能量需求。TensorFlow
    Lite 不适合训练模型，但它可以应用预训练模型。该框架减小了模型尺寸，但模型对于各种情况仍然有用。Google 还提供了一个根据对象分类生成模型的网页；你可以使用这些来创建自己的模型，然后部署到
    TensorFlow Lite 中。


    要使用 TensorFlow Lite 在树莓派上检测对象，你需要一个连接了摄像头的第四代设备。虽然某些第三代树莓派原理上适用于 AI 应用，但由于硬件限制（特别是内存方面），它们运行非常慢。至于用于
    AI 应用的摄像头，它……


    **使用 AI 不需要强大的系统。我们展示了在树莓派上从 AI 中获益的条件，以及这种小型计算机可以处理的任务。** 作者：Erik Bärwald，2023
    年 9 月第 274 期。LINUX-MAGAZINE.COM。MAKERSPACE MAKERSPACE。树莓派上的 AI。


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_68_0.png)


    无论你选择直接连接的计算机还是使用 USB 摄像头并不重要。然而，如果你喜欢外部摄像头，请确保树莓派 OS 支持你的选择。第一步是下载最新的 64 位版本树莓派
    OS 并将其传输到至少 16GB 的 microSD 卡中。要这样做，可以使用 balenaEtcher 等图形化工具，或在提示符输入以下命令：

    `dd if=/path/to/operating system image of=/dev/mmblk0 bs=4M`


