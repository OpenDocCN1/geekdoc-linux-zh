    ## INTRODUCTION


    **The 21st century is awash in digital images.** We take pictures all the time:
    old friends, cute pets, sunsets, quirky sidewalk events. Sometimes those pictures
    are perfect and ready to send to family and comrades, but if you have a flair
    for composition, you might want to touch them up a bit. Crop the image? Fix the
    glare? The universal image editor GIMP is a leading candidate for fixing photos
    in Linux. But GIMP can be seriously intimidating for amateurs who just want to
    do something simple, and anyway, isn’t Linux all about choice? Users have lots
    of other options for editing photos, and one of those options is Krita, a raster
    graphics editing app that is part of the KDE environment. This month we show you
    how to edit your digital photos with Krita.

