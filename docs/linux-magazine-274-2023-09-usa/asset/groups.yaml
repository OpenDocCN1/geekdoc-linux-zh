    \n## Conclusions\n\nAfter experimenting for a few hours with MathLex, I think\
    \ Barry has succeeded in making it easier to enter complex formulas into digital\
    \ form. I recommend this utility to anyone who deals with math formulas.\n\nIf\
    \ you are looking to improve your JavaScript skills, you can help update MathLex.\
    \ Many web developers today prefer to use libraries other than jQuery. Barry has\
    \ mentioned that “it would be very nice to bring MathLex up to speed with modern\
    \ development (TypeScript, maybe?)” [5].\n\n**Figure 9:** The same formula shown\
    \ in Figure 8 is now in black because it is complete, and all parts follow the\
    \ intuitive MathLex syntax.\n\n- [1] MathLex: https://github.com/mathlex/mathlex\n\
