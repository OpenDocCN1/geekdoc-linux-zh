    ![](img/8db7a58bef2f490a3db3c4fd35de2457_22_0.png)

    浏览器中的服务器。现在你可以开始添加音乐。


    Daphile 包含一个 CD 刻录器，你可以用它将音乐添加到库中。你必须将 CD 插入连接到服务器的驱动器，而不是连接到显示 Web 应用界面的客户端。刻录效果良好，且刻录程序会自动查找专辑元数据（解释和标题）以及封面艺术。它将刻录的轨道转换为音频质量极佳的大
    FLAC 文件。然而，刻录需要时间，而且你需要同时对服务器和客户端进行物理访问，这使得这种方法有点不利。如果你已经有一堆 MP3 或其他数字音频文件，可以通过
    Samba 共享等方式复制到 *Music* 文件夹。在局域网上传输数 GB 的音乐也会花费大量时间，但你可以让它无人值。


    ## Linux From Scratch (从零开始构建 Linux)


    Linux From Scratch 是一个非常特殊的发行版，自 1999 年以来一直存在并且仍然活跃：当前版本 11.3 已于 2023 年 3 月发布
    [2]。当你进入下载目录时，你找不到 ISO 镜像——你得到的是一本书（370 页 PDF 或 HTML）、一组启动脚本以及一个指向 90 个源代码归档的下载列表。


    使用 Linux From Scratch 意味着*从零开始*构建它。你将阅读这本书并完成所有必要的步骤，这些步骤最终让你能够启动操作系统并在上面运行一些基础程序。例如，你将获得
    Vim 编辑器，但没有图形化桌面。


    最终产品并不是真正的目标，重要的是引导你到达那里的旅程。你将学习如何构建和使用交叉编译工具链，以及程序和库是如何协同工作的。你将深入基于 System V
    的


    **图 1：通过浏览器控制 Daphile，或在其 Samba 共享上查找音乐。**


    23

    LINUX-MAGAZINE.COM

    第 274 期

    2023 年 9 月


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_23_0.png)

    Recalbox 镜像包含了许多游戏，你可以立即开始游戏。浏览这些机器——当你选择一台电脑时，你将看到它能够运行的游戏列表 (roms)。选择一个游戏并在几秒钟内开始游戏（图
    3）。


    如果你想添加自己的游戏文件，可以通过 Secure Shell (SSH) 登录——root 密码为 *recalboxroot*。然后导航到 */recalbox/share/roms/*
    文件夹：你应该将文件放在这里，例如放在 *c64/* 子文件夹中的 C64 磁盘镜像。你也可以 `cd` 进入该目录并使用 `wget` 从 Internet
    Archive 下载游戏——以下是经典游戏 Q*Bert 的命令：


    ```bash

    cd /recalbox/share/roms/c64

    wget https://archive.org/download/d64_Q-Bert_1983_Parker_Brothers/Q-Bert_1983_Parker_Brothers.d64

    ```


    然后在游戏控制器上按 *Start* 键弹出 *Options* 菜单。在 *Options* 菜单中选择 *Update Games Lists*（更新游戏列表）并选择
    *Yes*。EmulationStation 将在几秒后重启，你应该能在列表中找到你的新游戏。


    ## SystemRescue 10.01


    SystemRescue（以前称为 SystemRescueCD）是一个自 2003 年以来一直存在的经典助手 [6]。最新版本 10.01 已于 2023
    年 5 月发布。你可以将 737MB 的 SystemRescue ISO 镜像写入 USB 盘或 DVD；它无法放进 CD。你可以在本月 DVD 的 B
    侧找到 SystemRescue 的 ISO 镜像（*systemrescue-10.01-amd64.iso*），B 侧也可以直接进入系统。


    SystemRescue 会将你带到 root 提示符，因为系统可以帮助你完成的许多任务不需要图形界面。但 GUI 仅需一个命令即可启动；输入 `startx`
    启动 Xfce 桌面。


    你可以直接在 shell 提示符使用的功能包括：


    - 创建、调整大小、挂载、检查和修复 Linux 和 Windows 分区（包括 NTFS）。你还会发现对 LVM 卷的支持。

    - 使用 fsarchiver 备份和恢复硬盘分区。

    - 使用 ddrescue 和 dd_rescue（两个相似但不完全相同的工具）尽可能地复制故障硬盘的内容。

    - init 机制（尽管书中还有一个版本向你介绍了现代 sysvinit 的替代方案 systemd）、处理设备文件，并安装最小系统所需的所有其他部分。


