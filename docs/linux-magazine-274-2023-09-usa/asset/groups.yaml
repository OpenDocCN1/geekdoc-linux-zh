    关于该应用的介绍页面。除了版本之外，你还会找到指向首页和许可的链接。点击 *Install*（安装），然后使用 *Expose app*（暴露应用）开关来选择你是否希望
    Tipi 能够在你自己的网络之外访问。为此，你使用的域名（静态域名或基于 DynDNS 的域名）必须有一个 A 记录。你稍可以在应用程序的 *Settings*（设置）（图
    4）中做出此决定。


    在我的情况下，我首先安装了 *File Browser*（文件浏览器）应用，以便访问家中服务器上的文件。紧是安装了 *Mealie* 食谱数据库，我向其中导入了一些我的食谱作为测试（图
    5）。为了查看安装了哪些容器，我还添加了 *Portainer*（图 6）。根据应用的不同，安装时间在几秒钟到几分钟不等，只需点击两次鼠标。安装应用的配置文件存储在在你主目录下
    `app-data` 文件夹下的 `runtipi` 文件夹中的 `app.env` 文件里。


    Tailscale 是另一个值得提及的应用。这是一种 VPN 服务，你可以将其安装在任何设备上，而无需配置任何设置（图 7）。Tailscale 使用 WireGuard
    作为 VPN，并将所有参与的设备连接到网格。


    **更新**


    在 *Settings*（设置）下的主菜单中，Tipi 会在新版本可用时通知你。在这种情况下，只需点击一下 *Update*（更新）即可；工具会完成所有工作。它会自动在后台停止、更新并重启容器。按下
    *Restart*（重启）将触发 Tipi 服务器的重启。`runtipi` 文件夹中的 `sudo ./scripts/stop.sh` 命令会停止应用程序。要完全删除
    Tipi，你还需要删除 `runtipi` 文件。该文件包含了关于 `docker-compose.yml` 文件中使用的容器的信息。


    Tipi 的文档虽然还不完整，但提供了对自定义应用 [6] 等主题的支持。出版时缺少一个关于在家庭网络外共享应用的的章节，但该过程并没有导致任何问题。如果你想共享多个应用，如果你的域名支持子域名和服务，那么提前创建子域名是有意义的。Tipi
    列出了应用及其图标、简短描述和类别。列表上方有一个搜索框，以及一个下拉“Category”（类别）列表，可以将显示的应用过滤到 14 个类别之一。


    **应用程序**


    Tipi 提供了许多知名应用，如 DokuWiki、Home Assistant、Joplin、Jellyfin、Nextcloud、Pi-hole、Plex、Syncthing
    或 WireGuard。点击其中一个图标即可打开。**图 4：** 域名、DNS、IP 和仓库最重要的设置都分组在 *Settings*（设置）中。这里你也可以为应用以及它们生成的任何数据分配不同的存储路径。**


    **图 5：** Mealie 让你非常方便地从热门博客导入食谱。你还可以根据食谱创建饮食计划并生成购物清单。**


