    Pi 的 MicroPython 解释器永远不应停止；你希望无论发生什么都能保持控制。然后我通过外壳将线引到电机、风扇、加热器、门触点、温度传感器和网络连接，确保一切都是防水的。所有的室外电线首先连接到内部的接线端子上，以便外壳可以从安装的其他部分进行单独测试。


