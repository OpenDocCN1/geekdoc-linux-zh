    \ difficult to access the \n\nindividual components.\n\nThe new controller has\
    \ been running \n\nfor some time now and has demonstrably \n\nbeen a valuable\
    \ asset in the greenhouse \n\nthus far (Figure 6). It is reassuring to \n\nknow\
    \ that everything is well taken care of \n\nin my absence. Sometimes it’s the\
