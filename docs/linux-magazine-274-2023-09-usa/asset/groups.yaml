    ## Authors


    WRITE FOR US


    *Linux Magazine* is looking for authors to write articles on Linux and the tools
    of the Linux environment. We like articles on useful solutions that solve practical
    problems. The topic could be a desktop tool, a command-line utility, a network
    monitoring application, a homegrown script, or anything else with the potential
    to save a Linux user trouble and time. Our goal is to tell our readers stories
    they haven’t already heard, so we’re especially interested in original fixes and
    hacks, new tools, and useful applications that our readers might not know about.
    We also love articles on advanced uses for tools our readers *do* know about –
    stories that take a traditional application and put it to work in a novel or creative
    way.


    Topics close to our hearts include:


    - Security

    - Advanced Linux tuning and configuration

    - Internet of Things

    - Networking

    - Scripting

    - Artificial intelligence

    - Open protocols and open standards


    If you have a worthy topic that isn’t on this list, try us out – we might be interested!


    Please don’t send us articles about products made by a company you work for, unless
    it is an open source tool.

