- md: "\n![](img/8db7a58bef2f490a3db3c4fd35de2457_76_0.png)\n\nincludes links to advertising\
    \ services, as well as tracking cookies that point to advertising providers. These\
    \ deep links do not point to IP addresses, but to the DNS names of the operators\
    \ or subdomains.\n\nThis means that the user’s browser itself actively requests\
    \ these banners and trackers, after resolving the DNS address of the embedded\
    \ link. This is where DNS filtering comes in: It uses blacklists for unwanted\
    \ URLs and refuses to deliver the IP addresses of these URLs to the client. Instead\
    \ of an IP address, the filter DNS simply returns 0.0.0.0. Therefore, the browser\
    \ does not even request the integrated URL from the Internet. The space normally\
    \ occupied by the advertising banner remains empty and the trackers do not receive\
    \ any feedback from the client. But be careful: For DNS filtering to work, clients\
    \ and their browsers must use the network’s default DNS resolution and not use\
    \ their own DNS servers and methods.\n\n## Pi-hole as a DNS Filter\n\nAs an alternative\
    \ to the options discussed so far, Pi-hole filters out DNS requests for unwanted\
    \ URLs on the fly, hiding advertising content and trackers (Figure 1). Pi-hole\
    \ is one of the most popular DNS filters. As the name suggests, the tool started\
    \ life as a piece of software for the Raspberry Pi, but Pi-hole runs reliably\
    \ and quickly on all other platforms, even when deployed on a larger network.\n\
    \nSome IT managers are reluctant to use Pi-hole because they do not want to replace\
    \ their existing DNS server and transfer its configuration to Pi-hole. This is\
    \ especially the case if the existing DNS server resolves local addresses and\
    \ services such as Kerberos and is perhaps also integrated with the DHCP service.\
    \ However, because the DNS protocol has no problems with proxy forwarding, a Pi-hole\
    \ setup does not need to replace the existing service at all; instead it can act\
    \ as a kind of overlay – even on the same machine, like in my example.\n\nMy setup\
    \ uses an existing dnsmasq server on the application server running RHEL 8. The\
    \ service provides the LAN with IP addresses via DHCP, lets physical and virtual\
    \ systems boot via PXE over the network, and resolves local domain names. The\
    \ dnsmasq service prefers to use the public Quad9 service 9.9.9.9 as its upstream\
    \ DNS. Unlike Google’s open DNS service on 8.8.8.8, Quad9 does not log all incoming\
    \ DNS requests including source IP addresses.\n\nBesides the dnsmasq service,\
    \ the application server is now also running Pi-hole, in a Podman container. In\
    \ principle, there are two options for running two DNS servers on the same machine.\
    \ If Pi-hole runs in a container without its own IP address, the existing dnsmasq\
    \ service must switch to a port other than 53. Alternatively, you can let the\
    \ Pi-hole container operate on a bridge network and therefore with its own IP\
    \ address. For this example, I chose the second approach, because my application\
    \ server uses a whole bunch of other Podman containers with their own IP addresses\
    \ anyway.\n\n## Creating the Network Bridge\n\nThe first step is to set up a network\
    \ bridge on the LAN adapter of the Linux server that will run the Pi-hole container\
    \ later. Usually this bridge will be br0. It also hosts the static IP address\
    \ of the physical application server. If you want to bridge the primary LAN adapter\
    \ of a server, you will usually have to do so while the network is running. Of\
    \ course, this can go wrong and simply disconnect the server from the LAN. But\
    \ a small script and the Linux NetworkManager make sure that this task runs smoothly.\
    \ You can even bridge the LAN configuration of a remote cloud server while you\
    \ are connected to it via SSH.\n\nDuring system installation, NetworkManager usually\
    \ creates a logical network with the name of the underlying physical adapter or\
    \ a label such as Wired 1. After NetworkManager has done so, transfer the UUID\
    \ displayed by entering the nmcli connection show command to the Bash bridge-lan.sh\
    \ script shown in Listing 1 along with the static IP address of the bridge and\
    \ the other LAN parameters. In my example, the IP addresses are 192.168.2.12 for\
    \ the application server and 192.168.12.1 for the router. For the DNS address,\
    \ enter the server itself, because this is currently the only DNS still active.\n\
    \nMake the script executable and run it. It first deletes the old connection,\
    \ configures the bridge, and finally, puts it into operation. After a few seconds,\
    \ you can access the server via the bridge. The next content and trackers.\n\n\
    **Figure 1:** ![](img/8db7a58bef2f490a3db3c4fd35de2457_77_0.png)\n\nLINUX-MAGAZINE.COM\
    \ ISSUE 274 SEPTEMBER 2023\n\nPI-HOLE\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_77_0.png)\n\
    \nLast but not least, let’s create two directories, dnsmasq, below /var/pods/pihole,\
    \ where Pi-hole will immediately store the configuration files. Now use systemd\
    \ to start the container by typing systemctl start pihole. The first call initially\
    \ creates the required configuration structures before Pi-hole starts its work.\
    \ To be able to manage Pi-hole service via web UI, first need to define an admin\
    \ password. To do this, log into the running container on the Podman host: `podman\
    \ exec -it pihole /bin/bash`. At the following prompt, type `pihole -a -p` to\
    \ set a new admin password. Then start the web interface in your client’s browser,\
    \ in my case on http://192.168.2.2, and log in with the previously assigned password.\
    \ Go to the *Settings* menu and then to the *DNS* tab when you get there. In the\
    \ basic configuration, Pi-hole uses Google as its upstream server. Switch off\
    \ the Google server in the upstream list and enter the internal DNS server in\
    \ the dialog on the right, my example, 192.168.2.12. Now Pi-hole can resolve both\
    \ internal and external names. Everything is running, enable autostart for Pi-hole\
    \ service by typing systemctl enable pihole. You can see which domains Pi-hole\
    \ filters in the *Adlist* tab. A default list of about 160,000 domains is defined\
    \ here. More filter lists can be found on GitHub; the youtube_ads_pihole list\
    \ is highly recommended. You can simply add lists via their URLs. Pi-hole automatically\
    \ updates them once a week. If you want to initiate a manual update, you will\
    \ find the *Update* option in Tools menu. In the *Domains* tab, you can then add\
    \ your own entries or regex selections to the blacklist. For example, the basic\
    \ filter isolates devices on your LAN from their metrics and can slow down the\
    \ response of these devices. If you do not want this, you need to explicitly allow\
    \ the domain. As a Podman container, Pi-hole can basically run on any machine\
    \ and in any VM step is to add a container network that Podman can use for the\
    \ Pi-hole container and others on. Podman manages its networks in the /etc/cni/net.d/\
    \ directory. To create a bridge network for br0 bridge, you first need to generate\
    \ a suitable conflist file – see pub_net.conflist in Listing 2. You can now launch\
    \ containers with their own IP addresses on the pub_net network.\n\n**Listing\
    \ 1: **Bash Script bridge-lan.sh**\n```bash\n#!/bin/bash\nnmcli conn delete <UUID\
    \ of network interface card>\nnmcli conn add type bridge con-name br0 ifname br0\n\
    nmcli conn modify br0 ipv4.addresses '192.168.2.12/24'\nnmcli conn modify br0\
    \ ipv4.gateway '192.168.2.1'\nnmcli conn modify br0 ipv4.dns '192.168.2.12'\n\
    nmcli conn modify br0 ipv4.method manual\nnmcli conn add type ethernet slave-type\
    \ bridge \\\ncon-name bridge-br0 \\\nifname enp1s0 master br0\nnmcli conn up br0\n\
    ```\n\n**Listing 2: **pub_net.conflist**\n```json\n{\n  \"cni Version\": \"0.4.0\"\
    ,\n  \"name\": \"pub_net\",\n  \"plugins\": [\n    {\n      \"type\": \"bridge\"\
    ,\n      \"bridge\": \"br0\",\n      \"ipam\": {\n        \"type\": \"host-local\"\
    ,\n        \"ranges\": [\n          {\n            \"subnet\": \"192.168.2.0/24\"\
    ,\n            \"gateway\": \"192.168.2.1\"\n          }\n        ],\n       \
    \ \"routes\": [\n          {\n            \"dst\": \"0.0.0.0/0\"\n          }\n\
    \        ]\n      }\n    },\n    {\n      \"type\": \"tuning\",\n      \"capabilities\"\
    : {\n        \"mac\": true\n      }\n    }\n  ]\n}\n```\n\n**Listing 3: **pihole.service**\n\
    ```ini\n[Unit]\nDescription=pihole\nAfter=network-online.target\nWants=network-online.target\n\
    \n[Service]\nExecStartPre=/bin/podman kill pihole\nExecStartPre=-/bin/podman rm\
