    但如果用户在夜间关闭了工作站，第二天早上他们很有可能会获得一个不同的地址。管理员可以根据 IP 租用时间，可靠地将请求追溯到源头。


    ## 在浏览器中完成最后工作


    得益于基于 DNS 的 Pi-hole，你已经从数据流中删除了大部分不需要的内容。然而，如果某些内容可以躲避过滤器或实际上包含在原始源 URL 中，那么仍然会残留一些内容。消除最后残留追踪器和广告的唯一方法是使用浏览器插件。在众多的可用插件中，我们目前挑选了两个：Ghostery
    和 AdNauseam。


    Ghostery 是最流行且可靠的广告过滤器之一。除了 Chrome 和 Firefox 插件外，Ghostery 作为一个基于 Chrome 源码的即用浏览器也可用。这意味着
    Ghostery 也可以运行在手机和平板电脑上。是在手机上通过未过滤的 App 查看 YouTube 视频，还是在 Android 或 iOS 上过滤过的
    Ghostery 浏览器中通过常规 YouTube 网站查看，区别是非常巨大的。


    AdNauseam 为基础过滤功能增加了一项特殊功能。虽然过滤器不在浏览器中显示嵌入的横幅，但该插件会在后台点击所有的广告链接。广告商寻求向用户提供个性化定制的广告。这意味着广告商可以通过分析用户点击的广告类型，创建出用户浏览行为的画像。AdNauseam
    会稀释你的画像：如果你看起来对从博彩到通泻药的一切内容都感兴趣，那么广告商就完全无法创建个性化画像。


    如果你已经为自己的浏览器创建了画像，并且反复遇到相同的广告主题，则推荐这种过滤器。然而，该工具具有争议性，因为广告商通常需要为横幅点击付费——而你作为用户却无法看到付费内容。因此，Google
    已经从 Chrome 商店中删除了 AdNauseam，作为 Chrome 用户，你需要手动设置该插件。Firefox 仍然提供自动安装程序。


    ## 结论


    如果你厌倦了互联网上泛滥的广告且不想被追踪，DNS 黑洞和浏览器插件的结合将会有很大帮助。作为副作用，Pi-hole 等工具还可以防御钓鱼攻击，因为许多已知的钓鱼
    URL 已经在黑名单中。Ghostery 作为一种成熟的插件，随后还会移除 Pi-hole 无法拦截的残留物。Q Q Q


    这具有混合局域网适配器。通过在 systemd unit 中定义 MAC 地址和 IP 地址，无论宿主机系统如何，容器始终以相同的网络参数启动。在运行期间，Pi-hole
    对底层文件系统几乎没有任何更改。这就是为什么你可以使用内置工具（例如 rsync）定期且简单地将 Pi-hole 设置的两个目录复制到备份驱动器或第二个主机上。这种方法也是行的。也可以将
    Pi-hole 数据存储在 NFS 共享中，以便多个主机可以访问这些信息。


    ## 定制 DNS 和 DHCP 服务


    为了让 Pi-hole 与现有的 DNS/DHCP 配置协作，需要对现有设置进行一些更改。首先，你需要将 DHCP 服务的 DHCP  6（DNS 服务器）更改为
    Pi-hole 服务器。使用 dnsmasq 时，该选项如下：


    ```

    dhcp-option=6,192.168.2.2

    ```


    同样，dnsmasq 可以使用比其运行宿主机不同的 DNS 服务器作为转发器。你需要在 /etc/nameservers.conf 文件中如下列出所有所需的
    DNS 服务器：


    ```

    nameserver 9.9.9.9

    nameserver 1.1.1.1

    nameserver 149.112.112.112

    nameserver 1.0.0.1

    ```


    然后在你的 dnsmasq.conf 文件中指定此列表：


    ```

    resolv-file=/etc/nameservers.conf

    ```


    现在，底层主机本身也可以使用 Pi-hole 服务器进行名称解析，但备用 DNS 是绝对关重要的。当你重启 Pi-hole 容器时，主机必须能够解析 Docker
    注册表 URL 以实现这一点。主机不能完全依赖 Pi-hole 服务器。


    ## 避免法律担忧


    与代理过滤器不同，使用 Pi-hole 进行过滤不会直接干扰你的用户数据包。尽管如此，Pi-hole 仍记录系统的 DNS 调用。管理员可以使用 Pi-hole
    日志和底层 dnsmasq 的 DHCP 租用情况来确定特定用户何时发起了特定的 DNS 查询。请求可以通过 MAC 地址追溯到工作站。DHCP 段中较短的租用时间有助于这变得更加困难。例如，如果你指定租用时间为四小时，客户端需要每四小时向
    DHCP 服务器请求一次 IP 地址。客户端通常会尝试刷新并重用已有的 IP。


    [1] Pi-hole: https://pi-hole.net

    [2] Pi-hole 过滤器列表: https://github.com/topics/pihole-ads/


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_79_0.png)


    **音频工作站**

    **Qtractor 0.9.34**


    这可能是锡箔病的发作初期，也可能是良心的拷责，Graham 最近开始将他的许多账户迁移到服务器，正如你无疑会在这些页面中读到那样。来自自由开源软件世界的闪烁宝石和新发布，我们在这些页面中多次提到过。Qtractor
    是一款音频软件，我们在这些页面中多次提到过。Qtractor 是一款可以用于录制和编辑的音频工作器，它可以配合插件效果和合成器来制作音乐。Qtractor
    已经可以做到这一点很久了，尽管在几年前，它的界面很困难，而且对于播客，它超过了 Rosegarden。


    但 Qtractor 坚持了惊人的开发进度，每年发布八个大版本，并取得了巨大改进。对于 MIDI，它通过尽可能接近原始 Cubase 的范式来实现，这意味着如果你用过数字工作站，Qtractor
    将会感到非常熟悉。这种范式意味着音频和 MIDI 轨道在主显示器上水平排列，头部位于左侧。波形和 MIDI 数据显示在被称为“片段（clips）”的块中。无论是录制时还是导入后，都可以通过拖动起点或终点进行非破坏性编辑。但你仍然可以自动化淡化、标准化电平并将片段拉伸到特定的时间或节拍，同时保持原始音调。双击
    MIDI 片段将打开一个出色的 MIDI 编辑器，还有用于转调、拉伸、量化和缩放 MIDI 的工具。Qtractor 可以做到所有这些，并很好地处理 MIDI
    数据。


    虽然 Qtractor 的优势在于这种老派的设计，但并不意味着该程序缺乏尖端功能。Qtractor 是任何平台上首批采用新 CLAP 标准用于虚拟仪器和效果的项目之一，它还支持
    LADSPA、DSSI、VST3、VST 和 LV2 插件，且都带有延迟补偿，以广泛兼容你在 Linux 上可以获得的所有内容。最新版本还使用了 Qt 6.5+，并且在
    ARM 设备上运行得非常出色，这使得 Qtractor 成为 Linux 上最好的 DAW 之一。


