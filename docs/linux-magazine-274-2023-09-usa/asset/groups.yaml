    ## FOSS//Security Campus


    ## Tickets available now!


    ## Security matters


    Berlin, September 26th-29th 2023


    FOSS Security Campus comprises of two days of full-day and multi-day training
    courses, followed by a two day conference. FOSS Security Campus is a new event
    source focusing on IT security in the free and open source software sector. Topics
    include Open Supply Chains, Security Processes, Vulnerability Disclosure, Bug
    Bounties, Security by Design, Risk Mitigation and much more.


    Learn more at foss-security-campus.de*


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_38_0.png)


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_39_0.png)


    maintainer has recognized this possibility and made it easy to create your own
    SystemRescue solutions to suit your needs. This article explains how to create
    a custom SystemRescue environment.


    ### The Need for Customization


    Two real-life scenarios call for creating a custom SystemRescue-based Custom Computers
    crash. Whether because of human error, software bugs, or hardware dying from old
    age, workstations and servers alike will eventually break. For this reason, every
    system administrator should have a digital first-aid kit to get broken systems
    back to working condition as soon as possible. For this task, I keep SystemRescue
    in my toolkit.


    SystemRescue, formerly known as SystemRescueCd, is a Live Linux distribution designed
    to repair broken systems and handle a number of maintenance tasks. It includes
    tools to recover deleted files, repair broken boot managers, fix inconsistent
    filesystems, and more. The default set of installed programs is impressive (see
    Table 1 for a sample of included tools or visit the SystemRescue website [1] for
    the complete list). If one of your workstations or servers is rendered unbootable,
    you can simply boot your SystemRescue DVD or USB and have a full recovery environment
    available in a matter of minutes. With SystemRescue, you can repair damaged boot
    managers, partition tables, or filesystems. More importantly, you can extract
    your files from the failing computer and safely save them to a USB-attached hard
    drive or over a network.


    Despite SystemRescue’s impressive feature set, you will eventually find yourself
    in a situation where the default features fall short.


    ### Adding scripts and tools to SystemRescue


    **You can do more with SystemRescue than just repair broken systems. By adding
    tools and scripts, you can create a custom rescue environment that meets your
    needs.**

    *By Rubén Llorente*


    | Tool | Description |

    | :--- | :--- |

    | GNU ddrescue | Copies data from devices with bad blocks (such as damaged hard
    drives) |

    | FSArchiver | Saves and restores filesystem images |

    | OpenSSH server | Controls the recovery environment from a remote machine and
    easily transfers files in and out of the damaged computer |

    | Minicom | Connects to serial consoles |

    | cryptsetup | Accesses Linux encrypted disks |

    | chntpw | Resets Windows passwords |

    | TestDisk | Recovers lost partitions and repairs boot sectors |

    | PhotoRec | Recovers files deleted accidentally (or otherwise) |

    | wipe | Deletes data securely |

    | Rclone | Transfers and syncs files to a number of storage systems, including
    FTP and Nextcloud |


    **Table 1: SystemRescue Tools (an Incomplete List)**


    Lead Image © Maksym Yemelyanov, 123RF.com


    40

    IN-DEPTH

    SEPTEMBER 2023

    ISSUE 274

    LINUX-MAGAZINE.COM


    Customizing SystemRescue


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_40_0.png)


    distribution. The most common scenario involves needing a tool that SystemRescue
    does not include by default. Because SystemRescue is based on Arch, it has access
    to Arch’s repositories. If you ever need a tool, you can simply install it in
    your rescue environment as you would on a regular operating system. In practical
    terms, you can use the pacman package manager from within a running SystemRescue
    environment. For example, if you prefer Emacs over the default Vim, you can install
    it with the following commands:


    # pacman -Sy

    # pacman -S emacs


    Packages installed this way will be placed in a filesystem overlay in RAM. The
    packages will be available only to the rescue environment and won’t touch the
    computer’s hard drive that you are rescuing. On the downside, you will have to
    manually install these packages every single time you boot SystemRescue, because
    packages you install with pacman are not kept across reboots. Therefore, if you
    use an application often or expect to be performing maintenance tasks without
    access to Arch’s repositories, you will need to include the desired packages in
    your custom version of SystemRescue.


    Another scenario that calls for custom SystemRescue involves a recovery environment
    that allows running custom scripts, performing tasks automatically without intervention
    of an administrator. For example, a server at your office breaks down and the
    system administrator is out of town, requiring the sys admin to instruct an untrained
    worker to grab a recovery DVD from the shelf, put it in the server’s tray, reboot,
    and have SystemRescue offer a shell to the sys admin. (This may not end well).


    ### USB or DVD?


    The easiest way to create a custom SystemRescue is to install it on a USB drive
    using a backing store, which is an area on the USB where changes are written.
    You can install SystemRescue to USB with backing store, boot it, install all the
    packages you need, configure the desired scripts, and then shut it down. Your
    changes will be preserved across reboots.


    While this approach is serviceable, I personally avoid using USB drives for recovery
    environments for several reasons. DVDs offer a reasonable guarantee that you will
    get a pristine environment every time you boot, and there is value in that. (Your
    little brother is more likely to borrow a USB and replace your valuable data.)


    Because I want my environment stored to read-only media, I can’t use a backing
    store. Instead, I will create an ISO image containing my custom software and configurations
    and then burn it to a DVD.


    ### Adding SSH Access and Persistent Keys


    To illustrate how to include additional files and custom auto-started services
    on a DVD, I’ll use the example of a bunch of servers in a remote office. One of
    the servers breaks, and the sys admin needs to make it boot SystemRescue and offer
    an SSH shell to connect to it from home.


    While SystemRescue includes an SSH server, it is not accessible by default for
    two reasons: A proper password needs to be configured first, and the default firewall
    blocks incoming SSH connections. To remedy this, you need to create a custom SystemRescue
    image that does the following:


    - Set a password to enable login over SSH

    - Remove the firewall

    - Use a persistent set of SSH fingerprints (because I want to verify the SSH server’s
    identity when connecting to it remotely)


    This custom SystemRescue image will then allow the senior sys admin to instruct
    a junior sys admin in the server room to boot SystemRescue, which will allow the
    sys admin to connect to it.


    **Figure 1: An extracted SystemRescue image: Custom configuration files can be
    placed under the **sysrescue.d** directory, and SystemRescueModules under **sysresccd**.**


    **Figure 2: SystemRescue accepts cheat codes at boot time that enable or disable
    features. Among other things, cheat codes let you set a root password for the
    rescue environment and enable or disable SystemRescue’s firewall.**

