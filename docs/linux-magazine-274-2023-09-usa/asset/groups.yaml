    **Puppy Linux**

    Puppy Linux 项目 [1] 创建了许多兼容 Ubuntu 的发行 镜像；最新版本有 Fossa64（基于 Ubuntu 20.04，9月）和 S1564（基于
    Slackware 15.0，12月）。但 Puppy 通过 Woof-CE [2] 产生了一个生态系统，可以在任何 Linux 发行版上运行的脚本：这些非官方
    Puppy 版本被称为 Puplets，你可以在 Puppy 页面 [3] 上找到数百个。


    你可以直接从下载的 ISO 镜像运行 Puppy Linux 而无需安装，但也有一个安装程序。如果你已经在硬盘上有另一个 Linux 系统，你不需要重新分区硬盘：Puppy
    安装可以与其他系统共存：因为安装程序将所有文件放在子目录中。在 `Applications` 菜单中点击 `Setup`，然后选择 `Internal drive
    / SSD` 以启动基于磁盘的安装。如有必要，你可以运行 GParted 来分区磁盘——创建一个分区并接受默认设置（填充整个磁盘，主分区）


    快速，列举三个 Linux 发行版：你可能想到了大玩家，如 Ubuntu、Debian、openSUSE 或 Red Hat。它们的共同点是针对当前的桌面和服务器硬件，并提供了海量的（且相似的）当前
    Linux 应用，涵盖所有类别，包括办公、多媒体、开发和游戏。通常你下载一个大的 DVD 镜像——如果你还有 DVD 驱动器则刻录 DVD——然后启动并运行安装程序。所有这些现代通用发行版都允许你重新分配磁盘空间并创建一个启动菜单，从安装在硬盘上的系统中选择操作系统。


    如果你认为 Linux 是这些巨大的、扩张的发行版之一，请准备接受一些不同的。本月，我们关注小型 Linux 替代方案。许多小型 Linux发行版是现场系统：当你需要时从
    U 盘启动它们，通常不将其安装在硬盘上；但其中某些确实有常规安装程序。本文审查了一些通用型小型发行版，它们尝试提供完整的 Linux 桌面体验（对于 Alpine
    则是服务器体验），但能够良好适应有限的硬件资源。本期的另一篇文章介绍特殊用途发行版，可以将你的电脑变成媒体播放器、复古游戏机或救援系统。在第三篇文章中，我讨论了几个适用于树莓派的
    Linux 发行版。


