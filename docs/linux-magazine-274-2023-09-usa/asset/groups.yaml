    **21 世纪充斥着数字图像。** 我们随时在拍照：老朋友、可爱的宠物、日落、奇特的街头事件。有时这些照片是完美的，可以直接发送给家人和伙伴，但如果你对构图有天赋，你可能想对它们进行修饰。裁剪图像？修复反光？通用图像编辑器
    GIMP 是 Linux 中修复照片的首选候选者。但对于只想做简单事情的业余爱好者来说，GIMP 可能会让他们非常畏畏，而且 Linux 的核心不就是选择吗？用户编辑照片有许多其他选择，其中之一就是
