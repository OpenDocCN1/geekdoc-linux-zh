    \ 命令行工具对这很有帮助。通过 tone，你可以批量解析音频元数据并编辑它们包含的标签。它对于确保你喜爱的音乐被正确标记，以及来自不同来源的音频中的元数据保持一致非常完美。它没有依赖项，非常适合在托管你音乐收藏的任何计算机上偶尔运行。\n\
