    \n**Info** Marco Fioretti (http://mfioretti.substack.com) is a freelance author,\
    \ trainer, and researcher based in Rome, Italy, who has been working with free/open\
    \ source software since 1995 and on open digital standards since 2005. Marco also\
    \ is a board member of the Free Knowledge Institute (http://freeknowledge.eu).\n"
  mdcn: "\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_47_0.png)\n\n学习 MathLex 语法的有效方法。\n\
    \n我在演示中发现的一个令人困惑点是，某些标记（MathLex 术语中的分隔符）可以带冒号也可以不带冒号。例如，在手写数学中，某些变量的绝对（即没有正负号）是通过将该变量放在两个竖线之间来表示的。不出所料，MathLex\
    \ 允许你通过将变量封装管道字符内来指定其绝对值（例如 `|X|`）。但对于 MathLex 来说，即使是 `|:X:|`也是完全有效的语法。你唯一不能做的是混合这些形式（即你不能写\
    \ `|:X|`）。记住这一点，一切都会正常。\n\n## 在网页上使用 MathLex\n\n列表 1 列出了图 7、8 和 9 所示的自定义 MathLex\
    \ 页面的源代码，它概述了在任何网页上轻松使用 MathLex 所需的内容。为了获得图 7 所示的可运行 MathLex 界面，我将演示文件 `index.html`\
    \ 的相关部分复制到一个空文件中，将其以 .html 扩展名保存，并重写了头部和其他一些字符串。\n\n请注意列表 1 中，为了可读性，我缩短了第 6、8\
    \ 和 35 行加载的字体和 JavaScript 库的长 URL。实际 URL 可能会根据你使用的 MathLex 版本而异。\n\n关于库，列表 1 有两点需要注意。首先，你必须包含演示\
    \ `index.html` 文件的完整头部（第 1 到 11 行），但不要像我为了可读性那样缩短 URL。\n\n其次，将演示文件夹中所有包含 MathLex\
    \ 样式表的文件以及其实际源代码连同你的 HTML 页面一起复制。我在本文中使用了 2021 年 4 月版本的 MathLex，因此在列表 1 中，这些文件是第第\
    \ 7 和 9 行调用的样式表，以及 JavaScript 文件 `mathlex.js` 和 `index.js`（第 34 和 36 行）。如果你使用的是较新版本，请检查\
    \ `index.html` 文件的头部和底部是否有你应该包含的其他文件。\n\n列表 1 的其余部分通过与图 7 到 9 的比较很容易理解。第 12 行生成标题“让\
    \ Linux Magazine 试试 MathLex 吧!”,第 16 到 18 行生成文本输入区域，最初填充了第 17 行所示的占位符，你可以在那里编写公式（图\
    \ 8）。相同的公式在第 20 行的 `div` 元素中渲染，其初始值也可以通过更改括号内的文本进行自定义。\n\n最后，从第 22、26 和 30 行开始的三对\
    \ `div` 元素是 HTML 标记，它们（连同头部）渲染了 MathLex 显示 LaTeX 代码、Sage 代码以及其自身的语法树的三个框（图 9）。页面的最后部分（第\
    \ 34 到 36 行）加载了 MathLex 源代码以及 jQuery 库 [4]，这使得整个页面具有交互性。\n\n**图 7：** 要创建自己的支持\
    \ MathLex 的网页，只需从 MathLex 演示中获取正确的代码并进行自定义即可。\n\n**图 8：** 列表 1 生成的自定义页面工作原理与原始演示相同。注意交互式渲染器如何在公式完成且无错误之前以红色显示它们。\n\
