    ## 树莓派的轻量级发行版


    新卡片


    **树莓派是一台 Linux 机器，它的默认发行版是 Raspberry Pi OS。但 Linux 的核心在于选择……** *作者：Hans-Georg
    Eßer*


    树莓派的默认操作系统是 Raspberry Pi OS 的 32 位版本 [1]，以前被称为 Raspbian，它是 Rasp(berry-Pi-De)bian
    的缩写：该发行版基于 Debian GNU/Linux。2022 年发布了 64 位版本，但 32 位版本仍然是标准。


    许多其他大型 Linux 发行版都发布了可在树莓派运行的 ARM 版本，例如 Ubuntu、openSUSE、Fedora、Manjaro、Gentoo、Arch
    Linux、Slackware 和 Pop_OS —— 某些只可以在树莓派 4 和 树莓派 400 上运行。我在本期其他地方提到的 Kali Linux 和
    Recalbox 也适用于树莓派。本文并没有列举这些日常 Linux 的树莓派版本，而是重点介绍了一些你可能不知道的替代发行版。


    ### 寻找发行版


    如果你想了解树莓派 Linux 发行版的概览，可以查看 Embedded Linux Wiki 中的 *RPi Distributions* 页面 [2]。然而，该页面上的许多条目已经过时了。你也可以使用你喜欢的搜索引擎来寻找发行版，或者简单地从托管
    Raspberry Pi OS 的同一页面下载官方的 Raspberry Pi Imager [1]：该工具允许你下载各种发行版镜像并将其写入 SD 卡（图
    1）。你还可以使用该工具将其他镜像（在网上找到的）写入 SD 卡，或者，任何其他可以将镜像文件写入 SD 卡和 USB 闪存的工具都可以，例如 balenaEtcher
    [3]——这些工具本质上是 `dd` 命令的前端界面。大多数发行版都会调整文件系统的大小。


    ### LibreLEC (KODI)


    “足够 Kodi 的系统”是 LibreELEC [4] 首页上的声明。LibreLEC 将任何电脑变成强大的媒体播放器（图 2）。在 Raspberry
    Pi Imager 中，你可以在媒体 OS 下找到 LibreLEC | *LibreLEC*；压缩后镜像大小为 900MB。LibreLEC 缺少 ROM，因此你需要手动安装游戏
    ROM。


    ### RetroPie


    除了树莓派版的 Recalbox，你还可以尝试 RetroPie [6]——它再次——使用了 EmulationStation。在 Raspberry Pi
    Imager 中，你可以在仿真和游戏 OS 下找到 RetroPie | *RetroPie*；压缩后镜像大小为 860MB。


    ### DietPi


    组装 way Linux 发行行的良好起点是 DietPi [12]，它是 Debian 在树莓派上的精简移植版。DietPi 运行在当前和旧的树莓派模型（回到
    RPi2），它还支持其他单板电脑，包括各种 ODROID 和 PINE64 设备以及 OrangePi 5。设置程序允许你安装平台优化的软件包，你可以只安装需要的，而大多数其他发行版提供全套工具。


    ### 结论


    你可以预计树莓派的小型和特种 Linux 发行版将会增加。如果你需要更多多样性，你可以尝试完全不同的操作系统，例如 FreeBSD [13] 或 RISC
    OS [14]。Q Q Q


