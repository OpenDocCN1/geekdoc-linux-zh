    ## Lightweight distributions for the Raspberry Pi


    New Cards


    **The Raspberry Pi is a Linux machine, and its default distribution is Raspberry
    Pi OS. But Linux is all about choices….** *By Hans-Georg Eßer*


    The default operating system for the Raspberry Pi is the 32-bit version of Raspberry
    Pi OS [1], formerly known as Raspbian, which was short for Rasp(berry-Pi-De)bian:
    The distribution is based on Debian GNU/Linux. 2022 saw the official release of
    a 64-bit version, but the 32-bit edition remains the standard.


    Many of the other big Linux distributions have released ARM versions that run
    on the Rasp Pi, for example Ubuntu, openSUSE, Fedora, Manjaro, Gentoo, Arch Linux,
    Slackware, and Pop_OS – some of which will only run on the Rasp Pi 4 and Rasp
    Pi 400. Kali Linux and Recalbox, which I mention elsewhere in this issue, are
    also available for the Rasp Pi. Rather than enumerating these Rasp Pi versions
    of everyday Linux, this article highlights some alternative distros you might
    not know about.


    ### Finding Distributions


    If you want to get an overview of Linux distributions for Raspberry Pi, you can
    check the *RPi Distributions* page in Embedded Linux Wiki [2]. However, many of
    the entries on that page are outdated. You can also use your favorite search engine
    to find distributions, or you can simply download the official Raspberry Pi Imager
    from the same page that hosts Raspberry Pi OS [1]: the imager lets you download
    various distro images and write them to an SD card (Figure 1). You can also use
    the tool to write other images (that’ve found on the web) to an SD card, and alternatively,
    any other tool that writes image files to SD cards and USB sticks will do fine,
    for example balenaEtcher [3] – these tools are basically pretty front ends for
    the dd command. Most distributions resize the filesystem so that it fills whole
    SD card when you run the system for the first time: That way, the images will
    fit on SD cards of all sizes, and you won’t waste any space.


    ### LibreELEC (KODI)


    “Just enough OS for KODI” is the claim prominently displayed on the LibreELEC
    [4] homepage. KODI turns any computer into a powerful multimedia player you can
    extend with various add-ons so that you can access TV station libraries (Figure
    2), tune in to live radio stations or watch videos on YouTube, DailyMotion, and
    similar sites. Some of these services require an API key that you need to generate
    on the website and then import the add-on. In Raspberry Pi Imager, you will find
    LibreELEC under Media OS; there are no video or audio sources and no add-ons;
    take your time to find some interesting content. An alternative distribution with
    similar features is XBian [5], which follows the rolling release model, so you
    can frequently get software updates and don’t have to wait for the next distro
    version.


    ### RetroPie


    Recalbox, which I described in an earlier article, lets you play old computer
    and arcade games with an MS-DOS PC.


    **Figure 1:** The official Raspberry Pi Imager downloads Raspberry Pi OS and alternative
    OS images.**


    **Figure 2:** LibreELEC lets you run the KODI entertainment software.**


    COVER STORY


