- md: "\n![](img/8db7a58bef2f490a3db3c4fd35de2457_41_0.png)\n\nway to accomplish this\
    \ is to create a SystemRescueModule (SRM), which is just a SquashFS filesystem\
    \ that contains a set of files to be incorporated in your custom SystemRescue,\
    \ similar to Tiny Core Linux extensions [4].\n\nGenerating a new set of keys is\
    \ easy. On a different computer, boot SystemRescue with its default options. It\
    \ will generate a set of SSH host keys under /etc/ssh at boot. You can use utilities\
    \ included in SystemRescue to create an SRM that includes the SSH keys:\n\n```bash\n\
    mksquashfs /etc/ssh sshd_keys.srm --no-strip\n```\n\nThis command will generate\
    \ a module file called sshd_keys.srm, which you can transfer to the computer where\
    \ you are doing the remaster. This file may be placed in the unpacked image’s\
    \ sysresccd directory. Keep in mind that this file’s contents are sensitive; any\
    \ evil entity that has access to these files could perform a man-in-the-middle\
    \ (MITM) attack against your SSH sessions.\n\nTo implement this setup, you need\
    \ to download a copy of SystemRescue using a standard Linux system:\n\n```bash\n\
    curl -L https://sourceforge.net/projects/systemrescuecd/files/sysresccd-x86/10.00/systemrescue-10.00-amd64.iso/download\
    \ > systemrescue-10.00-amd64.iso\n```\n\nA helpful script by the SystemRescue\
    \ creator lets you unpack the ISO image you just downloaded. You can use the script\
    \ to extract the contents of the ISO file and modify them before repackaging.\
    \ You can download the script as follows:\n\n```bash\ncurl -L https://gitlab.com/systemrescue/systemrescue-sources/-/raw/main/airootfs/usr/share/sysrescue/bin/sysrescue-customize?inline=false\
    \ > sysrescue-customize\n```\n\nOnce the script, sysrescue-customize, has been\
    \ downloaded, extract the image’s contents with the following command:\n\n```bash\n\
    ./sysrescue-customize --unpack --source=systemrescue-10.00-amd64.iso --dest=custom\n\
    ```\n\n## Including Custom Configuration Files\n\nUnpacking the ISO image will\
    \ give you the contents shown in Figure 1.\n\nCustomary of Live CDs, SystemRescue’s\
    \ behavior can be modified at boot by using *cheat codes*, which are keywords\
    \ and flags passed at the boot prompt before the system is booted (Figure 2).\
    \ See the SystemRescue website for some supported cheat codes [3].\n\nPassing\
    \ the cheat codes rootcryptpass and nofirewall enables SSH access upon boot (see\
    \ the “Root Passwords in Configuration Files” box). You also need to pass loadsrm=y\
    \ in order to load custom modules (which I will describe later). SystemRescue\
    \ supports applying these options via YAML files (see Listing 1 for an example),\
    \ which is much more elegant than hacking the boot-loaders to bake them in. Save\
    \ Listing 1 in the sysrescue.d folder of the image you just extracted. Beware,\
    \ the YAML format is inflexible regarding indentation: Don’t indent using the\
    \ tab key; use the space bar instead.\n\nModifying with cheat codes is not enough.\
    \ SystemRescue, by default, creates a set of SSH keys every time it boots, and\
    \ the keys are not preserved across reboots. If you want SystemRescue to use the\
    \ same set of SSH keys every time, which lets you verify SystemRescue’s fingerprints\
    \ when connecting remotely, you need to pre-generate these keys and preload them.\n\
    \n**Listing 1: Applying Options via YAML Files**\n```yaml\nglobal:\n  loadsrm:\
    \ y\n  nofirewall: true\n  rootcryptpass: \"$6$W9Lhg.3mr54J0mxe$4rudPwTGXLc9xgQotiE9HINide7NjO4lRzhZmsLOSwrrwXhSDr6BT2mhgfml0XvUfz6my8fULs.gm3u9THXVb0\"\
    \n```\n\n**Figure 3:** For safe storage on a DVD, you need to generate a hash\
    \ of your password. Ensure you do this in a **secure environment where nobody\
    \ else can check your shell history or your list of running processes.**\n\nSystemRescue\
    \ lets you set root passwords via the *rootpass* cheat code. I don’t recommend\
    \ setting this code when using YAML configuration files, as shown in this article,\
    \ because *rootpass* requires the password to reside in a cleartext YAML file,\
    \ making the password readable by anybody who has access to the custom DVD.\n\n\
    The *rootcryptpass* code I use in this article is safer, because the password\
    \ is stored in hashed form, just as the passwords in a regular Linux system are\
    \ stored in /etc/shadow. To generate a suitable password hash (Figure 3), use\
    \ the following command:\n\n```bash\npython3 -c 'import crypt; print(crypt.crypt(\"\
    $password\", crypt.SHA512))'\n```\n\nand replace *$password* with your chosen\
    \ string. The output of the command above may be used directly alongside the *rootpass*\
    \ cheat code as shown in the examples. Beware, the command will be saved to your\
    \ shell’s history if it is not disabled, and it will be visible in the system’s\
    \ list of running processes which may reveal your password if you share the system\
    \ with other users.\n\n## Root Passwords in Configuration Files\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_42_0.png)\n\
    \nYou can also use SRMs to include programs. Utilities for creating modules from\
    \ Arch packages exist. You can create a module including your desired programs\
    \ by booting a clean SystemRescue DVD, installing the required applications using\
    \ *pacman*, and then creating an SRM using:\n\n```bash\npacman2srm my_module.srm\n\
    ```\n\nThe resulting my_module.srm will include all the packages you installed.\n\
    \n## Putting Everything Together\n\nOnce you have placed your YAML configuration\
    \ files under sysrescue.d and loaded your desired modules under sysresccd, you\
    \ can create your custom ISO image with:\n\n```bash\nsysrescue-customize --rebuild\
    \ --source=custom --dest=custom.iso\n```\n\nYou can now burn this image to DVD\
    \ using any of the usual tools.\n\n## Beyond Simple Modifications\n\nSystemRescue\
    \ features one advanced customization capability: the ability to download and\
    \ execute scripts from the web upon boot. You can place a script on a web server,\
    \ and SystemRescue can be configured to download that script and execute it right\
    \ after boot. Scripts may be fetched over HTTPS, and SystemRescue is capable of\
    \ performing certificate validation for the TLS connection, so in theory the process\
    \ is reasonably secure. This feature allows SystemRescue to be used to provision\
    \ services. You can create a custom image configured to download a script from\
    \ a given URL and execute it. Then you can set a web server to deliver a different\
    \ script depending on the IP from which the request is made.\n\nThe end result\
    \ is that you can use a SystemRescue DVD to boot a server, which will fetch the\
    \ script and use it to download and install a set of packages and launch a set\
    \ of services. However, if you boot the same image from a server assigned a different\
    \ IP, it may be given a different script and end up downloading different set\
    \ of packages and executing a different set of services. This makes it possible\
    \ to create a simple server provisioning system without effort. The only thing\
    \ you need to take care of is configuring the network’s DHCP server to assign\
    \ the appropriate IP to each server.\n\n**Listing 2: Simple Server Provisioning\
    \ System**\n```perl\n#!/usr/bin/perl\nuse IO::Socket qw(AF_INET AF_UNIX SOCK_STREAM\
    \ SHUT_WR);\n\n# Create a listening socket on all interfaces and port 8080\nmy\
    \ $server = IO::Socket->new(\n  Domain   => AF_INET,\n  Type     => SOCK_STREAM,\n\
    \  Proto    => 'tcp',\n  LocalHost => '0.0.0.0',\n  LocalPort => 8080,\n  ReusePort\
    \ => 1,\n  Listen    => 5,\n) or die \"Can't open socket: $IO::Socket::errstr\"\
    ;\n\n# Infinite loop that listens for requests and records the\n# source IP from\
    \ clients connecting to the server.\nwhile (1) {\n  # Wait for connection\n  my\
    \ $client = $server->accept();\n\n  # Obtain IP from the client.\n  my $client_address\
    \ = $client->peerhost();\n\n  # If the IP is 192.168.3.50, read script_1.sh\n\
    \  # from the local filesystem and send it over.\n  # In any other case, return\
    \ script_2.sh.\n  my $script;\n\n  if ($client_address eq \"192.168.3.50\" ) {\n\
    \    $script = 'script_1.sh';\n  } else {\n    $script = 'script_2.sh';\n  }\n\
    \n  open (INFILE, $script) || die \"Couldn't open $script\";\n  $client->send(\"\
    HTTP/1.0 200 OK\\r\\n\\r\\n\");\n  while (<INFILE>) {\n    $client->send($_);\n\
    \  }\n  close(INFILE);\n\n  # Notify the client of connection closure\n  $client->shutdown(SHUT_WR);\n\
    }\n\n$server->close();\n```\n\n**Listing 3: FTP Server Script**\n```bash\n#!/bin/bash\n\
    \n# Mount a filesystem in the local machine\nmount UUID=7bd471e8-cb11-474b-9901-e7ab6bfe2890\
    \ /srv/ftp\n\n# Report an error and exit if the mount fails\nif [ \"$?\" -ne \"\
    0\" ]; then\n  echo \"Could not mount on /srv/ftp\"\n  exit 1\nfi\n\n# Run an\
    \ ftp server in the background\nsystemctl enable ftpd.service\nsystemctl start\
    \ ftpd.service\n```\n"
  mdcn: "\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_41_0.png)\n\n实现此点的方法是创建一个 SystemRescueModule（SystemRescue模块，简称\
    \ SRM），它只是一个 SquashFS 文件系统，包含一组要整合到你的自定义 SystemRescue 中的文件，类似于 Tiny Core Linux\
    \ 扩展 [4]。\n\n生成一组新密钥非常简单。在另一台电脑上，使用默认选项启动 SystemRescue。它将在启动时在 `/etc/ssh` 路径下生成一组\
    \ SSH 主机密钥。你可以使用 SystemRescue 包含的实用程序创建一个包含 SSH 密钥的 SRM：\n\n```bash\nmksquashfs\
    \ /etc/ssh sshd_keys.srm --no-strip\n```\n\n此命令将生成一个名为 `sshd_keys.srm` 的模块文件，你可以将其传输到正在进行重制的计算机上。该文件可以放置在解压后镜像的\
    \ `sysresccd` 目录下。请记住，该文件的内容是敏感的；任何访问这些文件的恶意实体都可以对你的 SSH 会话进行中间人攻击（MITM）。\n\n\
    要实现此设置，你需要使用标准的 Linux 系统下载 SystemRescue 的副本：\n\n```bash\ncurl -L https://sourceforge.net/projects/systemrescuecd/files/sysresccd-x86/10.00/systemrescue-10.00-amd64.iso/download\
    \ > systemrescue-10.00-amd64.iso\n```\n\nSystemRescue 创建者提供的一个实用脚本可以让你解压刚刚下载的\
    \ ISO 镜像。你可以使用该脚本提取 ISO 文件的内容并在重新打包之前对其修改。你可以按照以下方式下载脚本：\n\n```bash\ncurl -L https://gitlab.com/systemrescue/systemrescue-sources/-/raw/main/airootfs/usr/share/sysrescue/bin/sysrescue-customize?inline=false\
    \ > sysrescue-customize\n```\n\n一旦下载了 `sysrescue-customize` 脚本，使用以下命令解压镜像内容：\n\
    \n```bash\n./sysrescue-customize --unpack --source=systemrescue-10.00-amd64.iso\
    \ --dest=custom\n```\n\n## 包含自定义配置文件\n\n解压 ISO 镜像将为你获得图 1 所示的内容。\n\n与 Live CD\
    \ 类似，SystemRescue 的行为可以通过使用*作弊代码*（cheat codes）在启动时进行修改，这些代码是在系统启动前通过启动提示符传递的关键字和标志（图\
    \ 2）。请访问 SystemRescue 网站查看支持的作弊代码 [3]。\n\n传递 `rootcryptpass` 和 `nofirewall` 作弊代码可以在启动时启用\
    \ SSH 访问（请参见“配置文件中的根密码”框）。你还需要传递 `loadsrm=y` 以加载自定义模块（我稍后会描述它们）。SystemRescue 支持通过\
    \ YAML 文件应用这些选项（参见列表 1 示例），这比通过修改引导程序来将其硬编码进去要优雅得多。将列表 1 保存到你刚刚解压的镜像 `sysrescue.d`\
    \ 文件夹中。注意，YAML 格式对缩进非常不灵活：不要使用 Tab 键缩进；请改用空格键。\n\n仅通过作弊代码修改是不够的。SystemRescue 默认每次启动时都会创建一组\
