    As a final step, you need to integrate the graphical Code::Blocks integrated development
    environment (IDE) [8] into your system (Figure 2). With its help, you can then
    use TensorFlow Lite and OpenCV to recognize and classify objects by drawing on
    various sample networks. These capabilities apply not only to photos, but also
    to livestreams from the connected camera.


    Code::Blocks supports the C and C++ programming languages and is therefore ideally
    suited for AI applications. The command `sudo apt-get install codeblocks` installs
    the package and automatically creates a starter on the desktop and in the Raspberry
    Pi OS menu system.


    ## Examples


    After completing the installation, you can test some sample scenarios by drawing
    on a number of preabricated and trained code examples from Q-engineering; all
    of these achieve very good results on the Raspberry Pi 4, even in livestreams
    [9]. Code::Blocks is used here, too, and it even provides slide shows of screenshots
    in the tutorials to help newcomers gain some initial experience with AI applications
    [10]. Instead of the sample photos and models that can be classified. However,
    you can only create models in the “full-fledged” TensorFlow variant. TensorFlow
    Lite and a Raspberry Pi are not suitable because you need masses of compute power.
    The recommended approach is therefore to create new models from reference data
    with GPU processors because they will perform the required computations far faster
    than CPUs. Also, the models generated in TensorFlow are not compatible with TensorFlow
    Lite. You will need to convert them for use in the Lite variant. Google has already
    created numerous models for TensorFlow Lite that you can deploy on the Raspberry
    Pi. The TensorFlow project website provides detailed information [5] on how to
    convert models to the TensorFlow Lite format.


    ## OpenCV


    The Open Computer Vision Library (OpenCV) [6] has another set of libraries that
    you can use on your Raspberry Pi. OpenCV is used for gesture, face, and object
    recognition and classification. The OpenCV deep neural network (DNN) module works
    with pre-trained networks for this purpose and can be used in combination with
    TensorFlow Lite. To install OpenCV on the Raspberry Pi, though, you need to resolve
    a large number of dependencies, and you need to specify manually a large number
    of flags during the build. This difficulty prompted Dutch AI specialists at Q-engineering
    [7] to publish a freely available and BSD-licensed script on GitHub that lets
    you work around these steps. To install and run this OpenCV script, enter:


    ```bash

    $ wget https://github.com/Qengineering/Install-OpenCV-Raspberry-Pi-64-bits/raw/main/OpenCV-4-5-5.sh

    $ sudo chmod 755 ./OpenCV-4-5-5.sh

    $ ./OpenCV-4-5-5.sh

    $ cd tensorflow/lite/tools/make/downloads

    $ rm -rf flatbuffers

    $ git clone -b v2.0.0 --depth=1 --recursive https://github.com/google/flatbuffers.git

    $ cd flatbuffers

    $ mkdir build

    $ cd build

    $ cmake ..

    $ make -j4

    $ sudo make install

    $ sudo ldconfig

    $ cd ~

    $ rm tensorflow.zip

    ```


    **Listing 2: Installing FlatBuffers**


    **Figure 2: The Code::Blocks IDE helps you use AI models.**


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_70_0.png)


    MP4 videos included in the bundle, you can use your own pictures or video files
    from the Raspberry camera. All you need to do is copy them to the appropriate
    directories and specify them as parameters in Code::Blocks (Figure 3).


    ## Generating Your Models


    Because custom models cannot be trained on small computers, Google offers a web-based
    tool [11] to help in the creation of models. The tool is suitable for various
    model types and outputs them as files in the TensorFlow format so that you can
    use the models in the Lite variant after converting. Please note, however, that
    generating a model for object recognition (e.g., on images and photographs) means
    uploading several hundred sample images. The sample images also need to be high
    resolution to achieve high accuracy levels later. You need to schedule several
    hours to work with the tool (Figure 4).


    ## Conclusions


    AI applications with TensorFlow Lite and OpenCV have long been considered established
    tools and are suitable for production use. However, installing the individual
    libraries and frameworks on the Raspberry Pi involves a fair amount of time and
    overhead – especially because documentation is often outdated or lacking. For
    this reason alone it makes sense to check out recent tutorials and examples to
    familiarize yourself gradually AI applications on Raspberry Pi.


