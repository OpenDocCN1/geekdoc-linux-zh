    Range*（颜色范围选择）功能，但这次为高光创建一个选择。确保勾选*Add to Current Selection*（添加到当前选择）选项。然后点击图层面板中的新白色图。预览窗口中未选中的区域将以红色显示。这可以为你提供一个更好的方法来调整遮罩的模糊。


    然后选择*Gaussian Blur*（高斯模糊）滤波器，并将半径值约为 50 像素。在按下*OK*确认后，再次点击遮罩下方的图层。为它创建一个新的过滤器遮罩层，并从*Improve*（增强）组中选择*Sharp*（锐化）作为过滤器。


    最后但同样重要的是，以两种文件格式保存最终编辑后的图像：Krita 自身的格式（包含所有图层）以及常见的图形格式（如 JPEG 或 PNG）。你可以通过选择*File*（文件）|*Export*（导出）来调用导出对话框（图
