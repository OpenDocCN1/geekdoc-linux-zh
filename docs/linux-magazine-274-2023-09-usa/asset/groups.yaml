    ## 童读《Ada & Zangemann》英文版已出版


    *Ada & Zangemann: 一个关于软件、滑板和树莓冰淇淋的故事*是一本插画儿童书，故事围绕一位著名的发明家 Zangemann 展开，她发明的发明深受所有人的喜爱。该书由
    Matthias Kirschner 和 Sandra Brandstätter 编写。


    一天，一个充满好奇心的小发明家 Ada 用她的滑板撞击了 Zangemann 的小腿。在这次事件之后，这位著名的发明家做了一个“重大的决定”，但 Ada 识破了这个骗局。女孩开始尝试硬件和软件，并意识到让其他人能够控制技术是多么重要。


    这本书无疑能引起 6 到 106 岁读者的兴趣，并激励他们去动手实践，帮助塑造科技世界。它同时也作为一个关于反抗欺凌者的警示故事，同时提供了伦理背景，并对垄断、软件自由、电子垃圾等具有挑战性的话题进行了评论。


    *Ada & Zangemann* 最初用德语编写，由 O’Reilly German 出版（https://oreilly.de/produkt/ada-und-zangemann/?ref=10022*）。近期，该书有了第一个英语译本，现在由
    No Starch Press 发售（https://nostarch.com/ada-zangemann）。


    此外，还有可以下载的儿童模板（https://fsfe.org/activities/ada-zangemann/ada-drawing-template.en.pdf），允许孩子们（各年龄段）做一些事情，比如画出
    Zangemann 发明可能的样子，画可能来自 Zangemann 的电脑等。


    ## Linux 上的 Steam 客户端硬件加速


    Steam 以其他软件无法比的方式帮助开启了 Linux 游戏时代。但在很长一段时间以来，Linux 用户一直面临导致其落后于 Windows 的性能问题。动画经常会滞后，而且
    UI（整体）的响应速度远未达到预期水平。


    益于该平台的最新稳定更新，可以告别那些性能问题了。通过最新的迭代，用户终于可以利用 Linux 上的硬件加速。这一新增加的唯一遗憾是，在旧的 X11 协议上运行时，对于
    NVIDIA GPU 并不稳定。因此，对于使用 NVIDIA GPU 的机器，默认禁用了硬件加速。同时，关闭加速后，DPI 缩放可能会出现问题。


    新版本的其他特性还包括更好的 KDE Plasma 支持、更多的通知选项、改进后的游戏内覆盖层、新的备注功能（包括富文本格式、图像粘贴和离线功能）、大幅提升的视觉效果（包括对话框、菜单、字体和颜色）以及大量的
    Bug 修复。


    你可以从 Steam 官方博客阅读完整的发布日志（https://steam-community.com/games/593110/announcements/detail/3687931965598323437*）。要更新
    Steam 客户端，请打开应用并进入 *Steam* | *检查 Steam 客户端更新*。如果有可用更新，请务必应用，以享受 Linux 版本中这些令人兴奋的新功能。


    Linux 新闻

    LINUX-MAGAZINE.COM 第 274 期 2023年9 月

    新闻


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_11_0.png)


    ## 内核新闻


    Akihiro 说：“尽管如此，它仍然期望从 arch/x86/boot/header.S 引用的 LINUX_EFISTUB_MINOR_VERSION
    (include/linux/pe.h) 值为 0x0。我确认了，只需将 LINUX_EFISTUB_MINOR_VERSION 设置为 0x0，内核即可启动。”


    Akihiro 表示他将要求 Apple 移除那项特定的检查，因为这似乎毫无意义。但他也询问了 Linux 开发者：“是否可以将 LINUX_EFISTUB_MINOR_VERSION
    的值（而不是实际代码）还原为 0x0？还是说这会破坏其他其他东西？”


    Ard 认为接触 Apple 可能是最好的做法。他说：“如果现有的虚拟机 BIOS 有一个硬编码检查，认为 EFI stub 版本为 1.0，即使它起根本不是通过
    EFI 启动的，我不认为我们如何合理地将其视为一个需要在 Linux 侧修复的回归问题。”


    Ard 还指出，更改 Linux EFISTUB 次版本要求可能会产生巨大的代价。他说：“将 PE 镜像版本提升到 v1.1 为所有可以通过 EFI 启动的
    Linux 架构设定了一个基准，即 initrd 加载既可以通过命令行也可以通过 LoadFile 协议支持。还原这一点将大幅降低将其嵌入镜像的价值。”


    正是在此时，Linus Tordsds 介入了对话。他表示：“嗯，我们将固件问题视为等同于任何硬件问题。如果固件有 Bug 要求我们必须以某些方式进行操作，那与需要疯狂的初始化序列的硬件确实不同。所以，为什么不直接说
    LINUX_EFISTUB_MINOR_VERSION 应该是 0，然后只加个注释说明版本控制行不通呢？我不确定为什么这事要与启用 initrd 加载器绑定在一起。带编号的版本检查从根本上说就是错误的且愚蠢的。”


    ### 闭源的混乱局面


    在尝试追踪回归的过程中，Akihiro 将问题追溯到最近内核发布中接受的几个补丁。回归是指某些功能停止工作，开发者必须回溯补丁历史以查看是哪一个导致了损坏。识别回归是
    `git bisect` 命令的功能。它从一个已知的版本和一个已坏的版本开始，测试中间版本，直到找到导致问题的补丁。这使得回归变得有趣。


    然而，这一特定的回归与运行虚拟化系统有关，并涉及到高级配置和电源接口 (ACPI)，用于在给定系统上发现和配置硬件，以及 EFISTUB，它允许统一扩展固件接口加载内核。关键词是“固件”。通常情况下，这种闭源与特定的硬件相关，没有它硬件将完全无法运行。Linux
    忍了它，因为它别无选择，但对于基本输入输出系统 (BIOS)，固件通常是一个令人头疼的故障点。有时开发者会反向工程固件，但我们通常得到的是闭源的混乱局面。


    例如，当 Akihiro 报告内核回归时，Ard 发现由于硬件 Bug，这种固件 Bug 导致了内核无法正常工作。Biesheuvel 询问他是否使用了打开虚拟机固件
    (OVMF)，这是一种为虚拟机设计的开源 BIOS 替代方案。但Akihiro 回复说他没有使用 Qemu。他使用的是 Apple 的闭源框架，并且并没有使用
    UEFI 加载内核。


    Linux 内核邮件列表是 Linux 开发的核心。流量极其巨大，每周往往达到 10,000 条消息，对于一个人来说，跟进整个开发范围几乎是不可能的任务。承担这项任务的少数勇士之一是
    Zack Brown。内核新闻记者 Zack Brown 报告了 Linux 内核社区的最新消息、观点和进展。作者：Zack Brown![](img/8db7a58bef2f490a3db3c4fd35de2457_12_0.png)


    内核新闻

    LINUX-MAGAZINE.COM 第 274 期 2023年9 月

    新闻


    Akihiro 提到：“看来 Apple 的 vmlinuz 加载器只需要 LINUX_EFISTUB_MINOR_VERSION 为 0x0，并不关心 LINUX_EFISTUB_MAJOR_VERSION。”
    话题结束了。


    处理故障硬件和固件一点也不新鲜。想象 Linux 内核如何以最奇异的方式处理如此彻底损坏的硬件是非常奇的，这通常会导致性能下降，并避开了本身就是安全漏洞的高性能硬件功能。这些硬件
    Bug 甚至有自己的名字，如 Spectre、Meltdown、Foreshadow、ZombieLoad、MDS、LazyFP、PortSmash、TLBleed、Plundervolt、CacheOut
    等，名单还在继续。


    ## TV 是当年的重点


    Doug Berger 想要从 Linux 内核中榨出最后一滴 RAM 效率，特别是在运行 Broadcom 系统级芯片 (SoC) 硬件（如 BCM7445
    和 BCM7278）。他说这些电视系统和类似系统包含多个内存控制器，每个控制器映射在不同的地址范围内。统一内存访问 (UMA) 通常出现在不预期处理沉重负载的廉价系统中。这与非统一内存访问
    (NUMA) 形成对比，每个处理器都有自己的本地内存，允许系统充分利用每个处理器的专用能力。UMA 从根本上是一种折中技术。内存对所有处理器可用，代价是更快的处理器必须接受较慢的
    RAM。但仍有方法加速内存使用——例如通过将单个线程的内存分配在一起。这样就可以减少在不同内存区域之间跳转的需求。


    然而，并不是所有的内存分配都可以简单的移动。某些系统级代码需要留在原地。为了区分内核中可以移动和不可移动的分配，内存可以标记为 ZONE_MOVABLE。然而，在这些
    Broadcom UMA 系统上，这并不容易。正如 Doug 所说：“遗憾的是，区域的单体布局意味着，如果最低内存控制器包含 ZONE_MOVABLE 内存，那么来自高地址控制器的所有内存也必须位于
    ZONE_MOVABLE 区域。”他继续道，“这反过来强制所有内核访问最低内存控制器，并显著减少用于不可移动分配的内存量。”


    整个问题的一部分在于，内核本可以不做 UMA，将 Broadcom 电视和其他所有设备视为完整的 NUMA 系统。毕竟，它们有多个 CPU，所以为什么不采取标准做法呢？但这又回到了
    UMA 最初存在的原因——在资源稀缺的系统中为所有 CPU 提供尽可能多的 RAM。正如 Doug 所说：“NUMA 架构支持在每个节点上分配移动核心，但在没有非统一内存架构的系统上引入
    数A 的开销和复杂性是不必要的。”


    针对 Doug 的补丁，Mel Gorman 回应了一些反对意见。特别是他不认为该补丁真的能改进那些 Broadcom 系统的内存使用。Mel 实际上是最初在内核中实现
    ZONE_MOVABLE 支持的主要人员之一，他对此感到非常严肃的遗憾。他说：“区域主要是为了解决局限性，坦率地说，回想起来ZONE_ABLE 是一个坏主意。”他认为，更好的主意是将
    UMA 视为 NUMA 的一个特例。具体来说，“创建一个与本地节点距离为 1 的独立 NUMA 节点，该节点为 ZONE_MOVABLE，并结构化 zonelist，使得
    GFP_MOVABLE 分配优先选择‘移动’节点。”


    Mel 感叹道：“虽然我不记得自己为什么没有采取那种方法，最可能是因为 CONFIG_NUMA 并不总是设置，它只针对大内存页分配，也许我没有采取那种方法所需的技能或远见。”


    然而，Doug 回复道：“CONFIG_NUMA 并不总是设置这一点仍然是真的，这是该补丁集的关键动力。例如，Google 正在将其 Google TV 平台转向通用的
    GKI 内核，并要求供应商支持。目前 arm64 GKI 内核没有设置 CONFIG\_NUMA，而且我们无法让所有供应商接受这样的变化。”


    Doug 还评论道：“这个补丁集从根本上是为了对移动内存的放置获得更大的控制。”


