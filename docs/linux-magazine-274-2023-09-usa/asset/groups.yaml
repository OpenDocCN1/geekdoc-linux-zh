    ## 内核新闻


    “指定移动块（Designated Movable Block）机制允许 `ZONE_MOVABLE` 内存位于低内存控制器上，以便让用户空间分配更容易落在低内存控制器上。如果
    `ZONE_MOVABLE` 仅位于低内存控制器上，那么用户空间分配可能会落在内存控制器上的 `ZONE_NORMAL` 中，但只有在 `ZONE_MOVABLE`
    的可用内存耗尽后才会通过回退（fallback），这与现有情况恰相反。指定移动块机制允许 `ZONE_MOVABLE` 内存位于每个内存控制器上，使得用户空间分配对每个内存控制器都有等的访问权限，直到
    `ZONE_MOVABLE` 内存耗尽并发生到其他区域的回退。”


    在某个时刻，Mel 承认：“好吧，我当时误解了，认为 `ZONE_MOVABLE` 会在控制器之间划分，以提高用户访问的交织性。”


    讨论变得有些技术化且有些激烈——有一时刻 David Hildenbrand 评论道：“因为人们不想（！管这些‘人们’是谁）启用功能 B，就添加功能 A？我希望我不用告诉我对这类陈述的看法
    :)” 对 Florian Fainelli 回复道：


    “不仅仅是因为人们不想要 NUMA，而是它也不非常合适，ARM CPU 集群以及 Linux 关心的大多数外设确实对可用的 DRAM 控制器/DRAM 芯片具有统一的内存访问能力。


    “只有一部分外设，特别是实时和高带宽设备（如视频解码器和显示器）可能不是以均匀的方式访问 DRAM。这是因为目前 `movablecore` 的实现方式要求在未设置
    `CONFIG_NUMA` 的情况下，所有的 `ZONE_MOVABLE` 内存必须位于系统物理地址最高处。允许指定基地址可以为有其益的系统提供更大的灵活性。”


    他补充道：“我不认为这实际上是为了尝试优化特定应用程序的性能，不如说是防止内存带宽利用率不足而导致整体系统性能下降。”在其他处他评论道：“这里采用的方法非常像是一种‘穷人方案’，试图在不要求更完整解决方案所需要的‘重体力活’的情况下来改进问题。”


    他进一步解释道：


    “Broadcom 客户感兴趣的是将用户空间访问更好地分布在每个内存控制器上，以提高用户空间主导的工作流的可用带宽。如果没有 `ZONE_MOVABLE`，每个内存控制器上拥有
    1GB 内存的 BCM7278 SoC 将这 1GB 放在低地址内存控制器的 `ZONE_DMA` 中，将另一个 1GB 放在高地址内存控制器的 `ZONE_NORMAL`
    中。按照这种布局，移动分配请求只有在 `ZONE_NORMAL`（高内存控制器）的可用内存充分耗尽后，才会回退到 `ZONE_DMA`（低内存控制器）。


    “按照目前的 `movablecore` 行为，在 `ZONE_NORMAL` 之上添加 `ZONE_MOVABLE` 内存并没有改善这种情况，只能强迫更多内核分配离开高内存控制器。用户空间分配更有可能位于高内存控制器上。


    我们所工作的系统芯片上的内存控制器具有星型拓扑，它们以不同的方式调度每个 DRAM 客户端（CPU、GPU、视频解码器、显示器、以太网、PCIe 等）的访问，以保证某种服务质量。”


    讨论期间没有达成共识。似乎指定移动块的倡导者认为该功能仅仅是现有行为的扩展，其中某些行为正是由现在批评这些行为的人编写的。另一方面，Doug 补丁的批评者认为，Doug
    想要增强的底层事物应该完全消失，或者至少应该重新设计以使用更好、更通用的 NUMA 方法。


    对我来说，整个对话中有趣的一点是，这从根本上是更好的设计（NUMA）与现状（UMA）之间的争论。如果我考虑 Linus Torvalds 如何处理这些问题，完全不清楚他是否倾向于某一个。在很多情况下，是的，他会坚持更好的设计，即使这意味着要给尝试实现该功能的人带来大量工作。另一方面，有时“更好的设计’是一个巨大的且没有实际用户的大型方案，而现状是某些整洁且易于修复的东西，Linus
    会选择遵循现状。不清楚 Doug 的补丁是否会引起 Linus 的注意——似乎在这个特定案例中 Mel 是守门员，因为他编写了原始代码。但至少从这段邮件讨论来看，这似乎并不是一个明确的决定。


