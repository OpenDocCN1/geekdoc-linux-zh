    team of seasoned Linux developers.


    What this team has put together as a first release in just six months is groundbreaking
    and gives rise to hope that Vanilla OS will establish itself as a genuine alternative
    on the distribution scene in upcoming releases. A leaner version for developers
    is currently in development, and a gamer-focused edition for KDE Plasma, which
    is also being considered, would certainly contribute to this happening [7].


    In my opinion, Vanilla OS is not yet suitable for production use – it was too
    buggy in various places. However, during testing, the building sites were constantly
    improved by minor updates. Experimenting with Vanilla OS is definitely already
    great fun. The developers and the community use the Discord Vanilla OS channel
    and are open to questions from users.


    The manual [8] and documentation [9] continue to grow with the distribution and
    cover the setup and initial operation quite well. Development progress can be
    followed on GitHub [10]. I am very curious to see where Vanilla OS will position
    itself in two or three years and whether the Linux community will embrace this
    innovative implementation of previously little-used technologies on the desktop.
