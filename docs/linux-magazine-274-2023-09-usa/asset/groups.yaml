    ![](img/8db7a58bef2f490a3db3c4fd35de2457_84_0.png)


    ## 射击游戏 (Shoot ''em up)


    ### Antsy Alien Attack Pico


    尽管许多现代游戏预算高达数亿，由数百人花费多年开发，但没有什么能比得上独立程序员编写的充满肾上腺素的简单射击游戏了。Antsy Alien Attack Pico
    就是其中一个极佳例子，它由 Martin Wimpress 为 Linux Game Jam 2023 使用 PICO-8 开发。我们之前介绍过 PICO-8，这是一个非常出色的游戏开发平台，它执行严格的限制，就像一个简单的虚拟20
    世纪80 年代早期游戏机。这些限制包括仅 128x128 像素的16 色显示器、简单的 4 通道音频以及仅 32KB 的存储空间。这种设计的希望是让游戏开发者将精力和投入到纯粹的游戏性中，正如
    Antsy Alien Attack Pico 那样，它成功了。


    Antsy Alien Attack Pico充分利用了这些限制，为你的飞船、武器、外星人以及可能出现的任何其他物体提供了大块的像素精灵。4 通道的声带让人联起在
    MSX 上运行的《Nemesis》，但游戏本身是一个纵向卷轴游戏，而不是横向的，你可以在星场中上下移动飞船，左右移动的范围会略超出屏幕边缘。你的任务是射击外星人或在有护盾允许的情况下撞击它们，收集强化道具，并通关连续的五个波次以及它们各自独特的小游戏。小游戏包括快速穿过小行星带、抓取强化道具和保护货运船。你可以使用摇杆或键盘完成所有这些操作，但最重要的是，你可以选择和朋友一起玩，享受并肩作战的射击游戏乐趣，尤其是使用同一把键盘时。它的执行非常精妙，完美契
    PICO-8 的规格，如果你手头有设备，特别是在支持 PICO-8 的手持设备上表现尤为出色。


    **项目网站**

    https://github.com/wimpysworld/antsy-alien-attack-pico


    在 Antsy 中，你只有一条命，有一条能量条，你需要在外星人击中你之前通过射击它们来保护它。


    ### 平台跳跃游戏


    ### Jumpy


    如果你喜欢游戏向各个方向滚动而不仅仅是单方向，那么 Jumpy 非常适合你。这是一款在海底 2D 平台上进行的狂热多人玩家格斗游戏。格斗部分意味着你的任务是用手头的任何东西击中其他玩家，包括你的鱼鳍或关卡内发现的任何武器。关卡会缩放并滚动以跟随你，动作快速且需要反应。它有点像经典的街机游戏《炸弹人》，但使用的是军刀和手枪而不是炸弹。但游戏也描述自己为“战术性的”，这意味着最好的策略是利用背景平台，而不是简单地狩猎和追逐敌人。最多四名玩家参与，本地模式支持两名使用同一把键盘，第三个人使用手柄。对于更多玩家，网络选项允许每个人使用自己的机器。如果没有其他人类，可以召唤电脑来控制其他角色，这显然缺乏典型的人类狡诈，但非常适合学习关卡内容。


    游戏中共有 14 个不同的关卡，从块状的船到水下地牢，都具有让人联想到《海绵宝宝》的海军主题。但游戏最棒的功能是嵌入的关卡编辑器，它让你轻松设计并玩你自己的恶魔创作。地图编辑器通过分层方法实现得非常精妙，类似于
    Gimp。你可以打开并编辑内置地图，也可以从零开始，并从可选的图形瓦片、玩家生成位置以及碰撞如何影响玩家中选择。如果你没有时间手工制作关卡，甚至还有一个随机化按钮，你可以立即玩你的创作作品以测试它是否有效。这对于年轻玩家尝试游戏设计的一种好方法，如果他们愿意，他们甚至可以通过新角色和新武器更进一步，为这个本就非常好玩的的游戏增添更多乐趣。


    **项目网站**

    https://github.com/fishfolk/jumpy


    Jumpy 目前正在开发中，程序员们正将他们的想法移植到 Bevy 游戏引擎中。


    FOSSPICKS


    LINUX


