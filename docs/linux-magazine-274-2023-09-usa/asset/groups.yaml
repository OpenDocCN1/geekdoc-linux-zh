  mdcn: "\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_80_0.png)\n\n**安全文件传输**\n\n\
    **Rymdport**\n\n**W**\n\n我们早些时候关注过出色的 Magic Wormhole。它是一个命令行工具，可以在你的机器与互联网深处的任何目标机器之间建立加密的对等点文件传输。为了实现这一功能，需要对网络的\
    \ NAT 进行协商，防火墙也是如此，而且连接本身需要找到一种与目的地通信的方法。但 Magic Wormhole 透明地处理了所有这些，用户只需输入 `send`\
    \ 后接文件路径，或者输入 `receive` 后接发送者显示的代码即可。对于一次性的临时性传输来说，它是非常出色的，而且现在依然是如此。但 Magic Wormhole\
    \ 仍然需要一点命令行知识。虽然这可能不会困扰 Linux 用户，但可能会让尝试接收传输的 Windows 和 macOS 用户感到困扰。\n\n这正是命名奇怪的\
    \ Rymdport 可以派上用场的地方。它是相同虫洞协议的实现，但被封装在图形化用户界面内部。它曾有一段时间被称为 wormhole-gui，但该项目已转向使用该协议的原生\
    \ Go 实现。这使得它能够在许多不同的平台上进行原生编译并运行，无需任何依赖，因此如果你也需要发送文件，你甚至可以链接到二进制文件。该应用程序比命令行版本更容易使用，具有用于发送、接收文件以及文件请求的标签页，而不是使用制表补全来选择要传输的文件和目录。它最强大的功能是能够同时显示多个传输，每个传输都有进度条显示其状态。最新版本创建一个\
    \ QR 代码来编码代码。对于你任何需要向某人发送文件的时候都是绝佳的解决方案，也是原始 Magic Wormhole 的良好升级。\n\n**项目网站**\n\
    \nhttps://github.com/Jacalz/rymdport\n\nRymdport 是一个 6MB 的独立下载包，可在 Linux、FreeBSD、Windows\
    \ 和 macOS 上运行。\n\n**音频元数据编辑器**\n\n**tone**\n\n**I**\n\n图像元数据很常见，尤其是照片。大多数照片处理应用程序都会有一个面板，显示曝光、焦点、日期、位置以及数十个其他属性，所有这些属性在拍摄时都会作为元数据写入文件中。此类元数据甚至可以在命令行中使用如\
    \ exiftool 等工具进行查看和编辑。但我们并不经常考虑到音频文件也包含一组与其制作相关的类似数据。这些数据包括专辑名称、曲目顺序、录音数据、艺术家以及许多其他可选属性。其中一些可能会由你选择的音频播放器显示，但它很可能不会让你编辑这些数据。tone\
    \ 命令行工具对这很有帮助。通过 tone，你可以批量解析音频元数据并编辑它们包含的标签。它对于确保你喜爱的音乐被正确标记，以及来自不同来源的音频中的元数据保持一致非常完美。它没有依赖项，非常适合在托管你音乐收藏的任何计算机上偶尔运行。\n\
    \n它有两种操作模式。dump 模式（转储模式）将输出你提供给它的大多数音频文件（从 MP3 到 FLAC）的元数据。它可以以前格式化的命令行方式输出——或者格式化为更具程序实用性的\
    \ JSON 格式。可以使用参数来包含整个目录、排除特定类型，甚至通过 JSON 查询特定属性。如果你无法从文件名判断音频文件的详细信息，这也是一种快速易懂的方法。你还可以将\
    \ tone 作为工具来填充你自己的收藏表格或数据库。为了平衡 dump 模式，还有一个 tag 模式（标签模式），它可以让你设置最常用的音频标签，包括流派、艺术家、系列、部分和标题。一个巧妙的自动导入选项让你从文件系统路径的字符串中设置这些值，你可以轻松用脚本修改这一点以执行更高级的操作。这使得\
    \ tone 在你遇到复杂的音频元数据问题时成为最理想的工具。\n\n**项目网站**\n\nhttps://github.com/sandreas/tone\n\
    \n使用 **tone** 从命令行或你自己的脚本中快速检索或设置音频文件元数据。\n\nLINUX-MAGAZINE.COM \n\nISSUE 274\
    \ \n\nSEPTEMBER 2023\n\nFOSSPICKS\n\n**LINUX 声音**\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_81_0.png)\n\
    \n**RSS**\n\n**Tiny RSS**\n\n**T**\n\n图像元数据很常见，尤其是照片。大多数照片处理应用程序都会有一个面板，显示曝光、焦点、日期、位置以及数十个其他属性，所有这些属性在拍摄时都会作为元数据写入文件中。此类元数据甚至可以在命令行中使用如\
