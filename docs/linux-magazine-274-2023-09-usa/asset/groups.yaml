    ![](img/8db7a58bef2f490a3db3c4fd35de2457_50_0.png)


    ## 起初，是一个圆


    但是如何在 Go 中编写这样一个这样的游戏呢？首先，你需要为游戏绘制一个“世界”。最好的做法是让程序在随后运行的每个视频帧中，都能以闪电速度计算游戏状态。最重要的是，它需要提供反馈，告知赛车汽车是否仍在道路上行驶，还是已经离开了弯道的轮廓并停在了灌木丛的某处。


    程序将赛道的右转弯绘制为两个同心圆的重叠（图 3），半径分别为 $r_2$（外部）和 $r_1$（内部）。但对于弯道来说，我们只感兴趣该形状的左上象限；这就是为什么我在图
    4 中使用了一些巧妙放置的矩形来遮盖圆形无关的部分。蓝色、灰色和橙色区域稍后会在显示中消失，两个额外的三文鱼色矩形定义了弯道的入口出口。列表 1 使用 Fyne
    框架提供的画布对象上的 `Circle()` 和 `Rectangle()` 函数实现了这个游戏玩家所称的“世界”。


    ## 圆与方


    由于 Fyne 框架放置圆形和矩形的方法相当粗放，我使用了 `drawCircle()` 和 `drawRectangle()` 函数从第 32 行和第 41
    行开始定义了更方便的接口。`circle` 函数将填充颜色作为第一个参数，紧接着是 *x/y* 格式的中心点和半径 $r$。Fyne 本身通过引用包含该圆形的虚拟正方形的左上角来放置
    `Circle` 对象，通过 `Move()` 将它们推到所需位置，然后使用 `Resize()` 将它们放大到所需的尺寸。要获得一个半径为 $r$ 的圆，外接正方形的边长需要为
    *2\*r*。Fyne 中矩形的接口比圆形的更具用户友好，因此列表 1 中的 `drawRectangle()` 简单地结合了 `Move()` 和 `Resize()`
    方法的调用，以便调用函数在一个动作中完成所有操作。


    有了这个工具箱，主函数 `drawWorld()` 开始创建了两个同心圆 $ci$ 和 $co$；三个遮罩矩形 $bg$（背景）、$mb$（底部）和 $mr$（右上角）；以及进入和离开弯道的两个道路段，即三文鱼色的矩形。该函数将赛车创建一个绿色矩形，并将化身的尺寸写入
    `Car` 结构体，该结构体包含了速度和起始位置等其他参数，并在稍后的列表 2 中定义。第 27 行将目前为止创建的所有图形对象放入容器中，`drawWorld()`
    将其连同 `Car` 对象返回给调用者，以便调用者将它们交给框架的图形引擎进行管理。


    ## 作为结构的汽车


    列表 2 显示了主程序，它在调用列表 1 中的 `drawWorld()` 之前绘制了一个固定大小的应用程序窗口，以绘制赛道，包括其上的汽车。随着车轮的旋转，汽车开始沿着圆形路径移动。在游戏中，*H*
    和 *L* 键会将车辆的虚拟方向盘向左或向右拨一下（符合 vi 约定）。按键由由第 67 行开始的 Fyne 函数 `SetOnTypedKey()` 回调拦截，响应是调整方向盘角度
    `TurnAng` 和速度。


    2D 仿真的简化模型通过在每个视频帧向初始值为 1 的速度增加 0.01 个单位来不断加速车辆，这一点稍后将在列表 5 中详细介绍。为了惩罚转向错误的玩家，每当驾驶员调整方向盘时，速度就会下降
    0.1 个单位。通过这样，每次转向操作都会抵消最后 10 帧的加速度。在这方面，转动方向盘时保持冷静是一个好主意，就像在真实的赛道上一样。车辆随后在轨道上的移动取决于两个值。汽车已经移动的角度由第
    12 行 `Car` 结构体中的 `DriveAng` 指定，它以弧度为单位描述了车辆当前行驶的方向。要找出方向盘目前转动了多少，你需要检查 `TurnAng`，它是用户到目前为止发起的转向动作的总和。这两个值之和随之决定了稍后列表
    5 所示动画中车辆的新方向。若要进行绝对真实的仿真，你需要考虑车辆的前后轴，从 12 行开始的结构体使用 `Ava`（想象成“Avatar”）来定义汽车在图形世界中的表示方式（即一个绿色矩形）。该结构体还持有车辆的初始坐标以及其当前速度、行驶方向和轮子的转向角。该结构体还被赋予了一个计时器（命名为
    `Timer`），用于存储经过的赛道时间


    **图 2:** 桌面上运行的赛车游戏。

    **图 3:** 两个同心圆定义了 90 度的道路弯道……

    **图 4:** ……多亏了几个矩形遮罩，我现在有了一个赛道。


    ## 弯道


    当赛车司机通过转向系统转动前轮时（通常）只有前轮可以转向。然而，并没有使用 Ackermann 转向几何结构 [3] 来实现，简单的游戏简单地将行驶方向和方向盘设置的两个角度相加，然后使用高中数学中的正弦余弦定理计算稍后在游戏赛道上接近的坐标（图
    5）。这也是为什么游戏将汽车表示为一个小方形的原因，因为更真实的矩形看起来会很奇怪


    ## 觉的眼睛


    当赛车司机通过转向系统转动前轮时（通常）只有前轮可以转向。赛车是否仍在赛道上、已经越过了终点，还是冲出了赛道，这由从 12 行开始的结构体决定。`Ava`（想象成“Avatar”）用于定义汽车在图形世界中的表示方式（即一个绿色矩形）。该结构体还持有车辆的初始坐标以及其当前速度、行驶方向和轮子的转向角。该结构体还被赋予了一个计时器（命名为
    `Timer`），用于存储经过的赛道时间


    **图 2:** 桌面上运行的赛车游戏。

    **图 3:** 两个同心圆定义了 90 度的道路弯道……

    **图 4:** ……多亏了几个矩形遮罩，我现在有了一个赛道。


