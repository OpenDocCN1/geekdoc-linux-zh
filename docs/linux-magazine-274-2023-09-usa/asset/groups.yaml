    \ Was the Circle\n\nBut how do you write a game like this in Go? First of all,\
    \ you need to draw the “world” for the game. This is best done in such a way that\
    \ the program can later compute the game’s status at lightning speed for each\
    \ video frame that it is running through. First and foremost, it needs to give\
    \ feedback about whether the race car is still driving on the road or has already\
    \ left the contours of the turn and is lying somewhere in the bushes.\n\nThe program\
    \ draws the racetrack’s right turn as an overlap of two concentric circles (Figure\
    \ 3) with the radii r2 (outside) and r1 (inside). But only the upper left quadrant\
    \ of this shape is of interest for the curve; this is why I used some cleverly\
    \ placed rectangles in Figure 4 to mask the irrelevant parts of the circles. The\
    \ blue, gray, and orange areas later disappear in the display, and two additional\
    \ salmon-colored rectangles define the road at the entry to the turn and its exit.\
    \ Listing 1 implements this “world,” as gamers call it, using the Circle() and\
    \ Rectangle() functions on a canvas object provided by the Fyne framework.\n\n\
    ## Round and Square\n\nBecause the Fyne framework’s methods for placing circles\
    \ and rectangles are pretty blunt weapons, I used the drawCircle() and drawRectangle()\
    \ functions to define more convenient interfaces starting in lines 32 and 41.\
    \ The circle function takes the fill color as its first parameter, followed by\
    \ the center point in *x/y* format and a radius r. Fyne itself places Circle objects\
    \ by referencing the upper left corner of an imaginary square enclosing the circle,\
    \ pushes them to the desired place with Move(), and then inflates them to the\
    \ required size using Resize(). To obtain a circle with a radius of r, the enclosing\
    \ square needs a side length of *2\\*r*. The interface for rectangles in Fyne\
    \ is more user friendly than the one for circles, so drawRectangle() in Listing\
    \ 1 simply combines the calls to the Move() and Resize() methods, for the calling\
    \ function to complete it all in one single action.\n\nArmed with this toolkit,\
    \ the main drawWorld() function goes about creating two concentric circles ci\
    \ and co; three masking rectangles bg (background), mb (bottom), and mr (top right);\
    \ and the two sections of road in and out that lead in and out of the turn, as\
    \ salmon-colored rectangles. The function creates the race car as a green rectangle\
    \ and writes the dimensions of the avatar to the Car structure, which contains\
    \ other parameters such as speed and starting position and is defined later on\
    \ in Listing 2. Line 27 dumps all the graphic objects created so far into a container\
    \ which drawWorld() returns to the caller along with the Car object, so that the\
    \ caller can feed them to the framework’s graphics engine for management.\n\n\
    ## Car as a Structure\n\nListing 2 shows the main program, which draws an application\
    \ window with a fixed size before calling drawWorld() from Listing 1 to draw the\
    \ racetrack, including the car on it. The Car wheel, the car starts moving along\
    \ a circular path. In the game, the *H* and *L* keys turn the vehicle’s virtual\
    \ steering wheel a tick to the left or right (in line with vi conventions). The\
    \ keystrokes are intercepted by the callback to the Fyne function SetOnTypedKey()\
    \ starting in line 67, the response being an adjustment of the steering wheel\
    \ angle TurnAng and speed.\n\nThe simplified model of the 2D simulation accelerates\
    \ the vehicle constantly by adding 0.01 units per video frame to the initial velocity\
    \ with a value of 1, but more on this later in Listing 5. To penalize the player\
    \ for erratic steering, each time the driver adjusts the steering wheel, the speed\
    \ drops by 0.1 units. In this way, every steering operation cancels out the acceleration\
    \ from the last 10 frames. In this respect, it’s a good idea to keep calm when\
    \ turning the wheel, like on a real racetrack How the vehicle subsequently moves\
    \ on the track depends on two values. The angle at which the car is already moving\
    \ is specified by DriveAng in Car structure in line 12 describes radian units\
    \ the direction in which the vehicle is currently traveling. To find out how far\
    \ the steering wheel is currently turned, you need to check TurnAng, which is\
    \ the sum of the steering movements initiated by the user so far. The sum of the\
    \ two values subsequently determines the new direction of the vehicle in the animation\
    \ shown later in Listing 5. For an absolutely realistic simulation, you would\
    \ need to take into account the front and rear axles of the vehicle, structure\
    \ starting in line 12 uses Ava (think “Avatar”) to define how the car is represented\
    \ in the graphical world (i.e., a green rectangle). The structure also holds the\
    \ vehicle’s initial coordinates along with its current speed, the direction of\
    \ travel, and the steering angle of the wheels. The structure is also given a\
    \ timer (aptly named Timer) which stores the elapsed track time\n\n**Figure 2:**\
    \ The car racing game in action on the desktop.\n**Figure 3:** Two concentric\
    \ circles define the 90-degree road turn …\n**Figure 4:** … and thanks to a couple\
    \ of rectangles as masks, I now have a racetrack.\n\n## Cornering\n\nWhen the\
    \ race car driver turns the front wheels with the help of the steering of (normally)\
    \ only the front wheels can be turned. Instead of using the Ackermann steering\
    \ geometry [3] to accomplish this, however, the simple game simply adds the two\
    \ angles of the direction of travel and the steering wheel setting and then uses\
    \ the laws of sine and cosine from high school math to compute the next coordinate\
    \ approached on the game track later (Figure 5). That’s also why the game represents\
    \ the car as a small square, because a more realistic rectangle would look weird\
    \ coming out of the corner sideways without any additional corrections.\n\n##\
    \ Watchful Eye\n\nWhether the car is still on the racetrack, has already passed\
    \ the finish line, or has possibly crashed off the track is determined by the\
    \ structure starting in line 12 uses Ava (think “Avatar”) to define how the car\
    \ is represented in the graphical world (i.e., a green rectangle). The structure\
    \ also holds the vehicle’s initial coordinates along with its current speed, the\
    \ direction of travel, and the steering angle of the wheels. The structure is\
    \ also given a timer (aptly named Timer) which stores the elapsed track time\n\
    \n```go\npackage main\n\nimport (\n\t\"fyne.io/fyne/v2\"\n\t\"fyne.io/fyne/v2/canvas\"\
    \n\t\"fyne.io/fyne/v2/container\"\n\t\"golang.org/x/image/col\"\n\t\"image/color\"\
    \n)\n\nfunc drawWorld(r1, r2 float32) (fyne.CanvasObject, Car) {\n\tbg := drawRectangle(col.Grey,\
    \ 0, 0, 2*r2, 2*r2)\n\tco := drawCircle(col.Lime, r2, r2, r2)\n\tci := drawCircle(col.Grey,\
    \ r2, r2, r1)\n\tmb := drawRectangle(col.Grey, 0, r2, 2*r2, r2)\n\tmr := drawRectangle(col.Grey,\
    \ r2, 0, r2, r2)\n\tin := drawRectangle(col.Lime, 0, r2, r2-r1, r2)\n\tout :=\
    \ drawRectangle(col.Lime, r2, 0, r2-r1)\n\n\tcar := Car{\n\t\tAva:      canvas.NewRectangle(col.Green),\n\
    \t\tStartPos: fyne.NewPos(10, r2+r2-1),\n\t}\n\n\tcar.Ava.Resize(fyne.NewSize(10,\
    \ 10))\n\tcar.Ava.Move(car.StartPos)\n\tobjects := []fyne.CanvasObject{bg, co,\
    \ ci, mb, mr, in, out, car.Ava}\n\tplay := container.NewWithoutLayout(objects...)\n\
    \n\treturn play, car\n}\n\nfunc drawCircle(co color.RGBA, x, y, r float32) *canvas.Circle\
    \ {\n\tc := canvas.NewCircle(co)\n\tpos := fyne.NewPos(x-r, y-r)\n\tc.Move(pos)\n\
    \tsize := fyne.NewSize(2*r, 2*r)\n\tc.Resize(size)\n\treturn c\n}\n\nfunc drawRectangle(co\
    \ color.RGBA, x, y, w, h float32) *canvas.Rectangle {\n\tr := canvas.NewRectangle(co)\n\
    \tr.Move(fyne.NewPos(x, y))\n\tr.Resize(fyne.NewSize(w, h))\n\treturn r\n}\n```\n\
    \n```\n\n**Listing 1:** world.go\n**Figure 5:** New best time for the turn: 3.999\
    \ seconds.\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_51_0.png)\n![](img/8db7a58bef2f490a3db3c4fd35de2457_52_0.png)\n"
