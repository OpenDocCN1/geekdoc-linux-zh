    ## Ubuntu Will Show APT News in the Software Updater App


    If you use Ubuntu version 18.04 LTS or newer, you’ll soon be seeing APT News in
    the Software Updater GUI.


    If you’ve not experienced APT News, the idea behind it (according to Canonical)
    is to give users as much information as possible about recent updates, so they
    can decide if those updates should be applied or not. Essentially, APT News is
    an unobtrusive feature that presents timely news, related to installed packages.


    The APT News portion of the Software Updater will be presented near the top of
    the GUI window and can be expanded to read; otherwise, it will default to unexpanded.


    The information presented will include things like significant security updates,
    features, and/or services. This news section also will inform you when regular
    support has ended for a release, which should be considered a very handy bit of
    information to know to help users understand it’s time to upgrade to a supported
    release.


    For those who would rather not see this news, Canonical has made it possible to
    disable with the command `sudo pro config set apt-news=false`. Otherwise, APT
    News will be presented in both the terminal and the Software Updater GUI.


    Another thing to keep in mind is that you’ll get more information if you sign
    up for Ubuntu Pro, which is free for personal use.


    At this time, there is no definitive date when the APT News feature will land
    in the Software Updater, but I’d expect it sooner, rather than later.


    This story was originally reported on OMG! Ubuntu! (*https://www.omgubuntu.co.uk/2023/07/ubuntu-now-shows-apt-news-in-software-updater*).


    ## Nitrux 2.9.0 Includes an Upgrade Tool and More


    Nitrux 2.9 has officially been released, and it includes the Nitrux Update Tool
    System (NUTS) that makes it easier for users to either upgrade or roll back their
    current release. However, NUTS isn’t the only new addition to this user-friendly
    Linux distribution.


    The latest iteration of Nitrux includes KDE Plasma 5.27.6 LTS, as well as KDE
    Frameworks 5.107, KDE Gear 23.04.2, the 6.3.9 Liquorix version of the Linux kernel,
    a simpler means of pairing your mobile device (thanks to some new firewall rules),
    a new application menu entry for the Heroic Games Launcher, support for the NetworkManager
    OpenConnect VPN plugin, the latest NVIDIA Linux x64 (AMD64/EM64T) display driver
    (535.54.03), Mesa 23.2, a new open-source driver for AMD Vulkan, Distrobox 1.5.0,
    MauiKit 3.0.0, OpenRC 0.47.1, new firmware for amdgpu, aut11k, brcm, cirrus, cxgb4,
    i915, iwlwifi, and more.


