- md: "\n![](img/8db7a58bef2f490a3db3c4fd35de2457_19_0.png)\n\n(FossaPup64 9.5 and\
    \ S15Pup64 22.12), and Alpine Linux. You can import these appliances in VirtualBox\
    \ [12]. Just install VirtualBox on a Linux, Windows, or macOS machine and import\
    \ the .ova file that you want to test. All VMs are configured to use just one\
    \ of your CPU cores – if you want to speed them up, change the settings. In the\
    \ VirtualBox main window, select the VM you want to modify, then click on *Settings*.\
    \ In the new window, click on *System*, then select the *Processor* tab and change\
    \ the number of CPUs (Figure 9). The .ova files reside on side 2 of the cover\
    \ DVD. On side 1 you find ISO images that you can write to a USB stick in order\
    \ to boot them on real hardware.\n\n## Going Lightweight\n\nSmall distros are\
    \ great if you’re a minimalist – or if you have a computer with minimal system\
    \ resources. However, if all you want to do is make your system a bit faster,\
    \ you could also just minimize your current distribution. Try installing a lightweight\
    \ window manager (for example JWM, IceWM, or Openbox) instead of your current\
    \ desktop environment. KDE and Gnome are beautiful and feature-rich, but they\
    \ use a lot of memory and CPU time, especially when you’ve activated desktop effects.\
    \ Downgrading to a simple window manager will come with a learning curve, and\
    \ you’ll lose some features, but you gain a huge performance boost.\n\nIf that\
    \ is not enough, you could also try replacing LibreOffice and your current browser\
    \ with less demanding tools, which is also what the lightweight distributions\
    \ do. For example, try using Light [13], AbiWord, and Gnumeric instead of Firefox\
    \ and LibreOffice. If Ubuntu is your favorite distribution, try one of the lighter\
    \ Ubuntu flavors [14], for example Lubuntu (with LXDE), Xubuntu (with Xfce), or\
    \ Ubuntu Unity.\n\nFor more on small distros, keep reading. The next two articles\
    \ will look at some special-purpose Linux distributions – for PCs and the Raspberry\
    \ Pi. Q Q Q\n\nfor many Docker images because the Alpine image is so tiny (5MB).\
    \ But you’re not restricted to using it for Docker containers. The project website\
    \ [11] lets you download ISO images that will boot a live Alpine Linux system,\
    \ though in text mode only. The current version 3.18.2 is available as *standard*,\
    \ *extended*, or *netboot* image for various platforms; the standard and extended\
    \ images for the x86_64 platform are 189MB and 762MB. Once you’ve booted and logged\
    \ in as *root* (no password required), you start the text-mode-based setup routine\
    \ with:\n\nsetup-alpine\n\nYou can skip most questions by hitting Enter, but eventually,\
    \ you’ll be asked what disk to use: The default answer is *none*, and you need\
    \ to enter *sda* (or what other disk you want to use). When asked how to use the\
    \ disk, type *sys*. The installer asks if you agree with losing all data on the\
    \ disk, and, if so, starts to copy the system over. When the transfer is complete,\
    \ remove the DVD (or ISO image in VirtualBox) and reboot from the hard disk. Now\
    \ you’re ready to go: Use this Alpine installation like you would use an Alpine\
    \ container in Docker.\n\n## Try Them in VMs or Live\n\nOn this month’s DVD, you’ll\
    \ find Open Virtual Appliances (OVAs) of antiX Linux 22, both Puppy Linux variants.\n\
    \n**Figure 9: Try a distribution in VirtualBox with the pre-installed OVAs – and\
    \ change the number of virtual CPUs to speed it up.**\n\n[1] Puppy Linux project:\
    \ *https://puppylinux-woof-ce.github.io/* \n[2] Puppy Linux Woof-CE: *https://puppylinux-woof-ce.github.io/woof-ce.html*\n\
    [3] Puplets, Internet Archive: *https://archive.org/details/puppylinux* \n[4]\
    \ FossaPup64 9.5: *https://distro.ibiblio.org/puppylinux/puppy-fossa/fossapup64-9.5.iso*\n\
    [5] S15Pup64 22.12: *http://downloads.sourceforge.net/spup/S15Pup64-22.12+1-T.iso*\n\
    [6] Joe’s Window Manager: *https://joewing.net/projects/jwm/*\n[7] Damn Small\
    \ Linux: *http://www.damnsmalllinux.org/*\n[8] Tiny Core Linux: *http://tinycorelinux.net/*\n\
    [9] antiX Linux: *https://antixlinux.com/*\n[10] Balena Etcher: *https://etcher.balena.io/*\n\
    [11] Alpine Linux: *https://www.alpinelinux.org/*\n[12] VirtualBox: *https://www.virtualbox.org/*\n\
    [13] Light: *https://sourceforge.net/projects/light/*\n[14] Ubuntu flavors: *https://ubuntu.com/flavours*\n\
    \n**Figure 8: You can create a modified version of Puppy Linux or antiX Linux\
    \ using the built-in remastering tools; the screenshot shows the antiX tool.**\n\
    \nInfo\n\nFor a special job, you need a special tool. Occupying a special place\
    \ beside the grand old generalists are a number of Linux distributions that have\
    \ a very narrow focus, such as audio, gaming, or security. Specialized Linux distributions\
    \ come in all sizes, but even the huge ones often fall into the “lightweight”\
    \ category, because, even though they might need a lot of space for their specialist\
    \ tools, they don’t have to make room for all the other general-purpose software\
    \ you’re used to seeing in a Linux system. Hundreds of specialty distros exist\
    \ in the wild. This article highlights a few popular alternatives (Table 1). I’ll\
    \ introduce you to Daphile, an audio server; Linux From Scratch, an educational\
    \ roll-your-own Linux; Recalbox, which lets you run classic games on EmulationStation;\
    \ SystemRescue, the universal repair tool; and Kali Linux, the Swiss Army knife\
    \ for pentesters and other security experts.\n\n## Daphile Audio Server\n\nIf\
    \ you have an unused older computer, why not turn it into your new headless audio\
    \ server? Install the Daphile distribution [1], store your music on its hard disk,\
    \ and access it in two ways: via a web app and via a Samba share (Figure 1).\n\
    \nDaphile promises “Digital Music Convenience for Audiophiles”: It provides a\
    \ web application that lets you manage the system from any computer in the local\
    \ network: Just enter its IP address in a browser’s address bar, and you can start\
    \ using Daphile. The integrated audio player sends music to the server’s sound\
    \ card (and not to the client that you use for controlling it!), so the intended\
    \ use is to connect the Daphile PC to, say, your living room’s hi-fi system and\
    \ then control it from a notebook or phone (Figure 2).\n\n## Lightweight specialty\
    \ distributions\n\nThe Specialists In the Linux world, form follows function.\
    \ A specialty distro is a Linux-based system designed to serve a specific role.\
    \ We look at some classic examples. *By Hans-Georg Eßer*\n\n| Distribution | Website\
    \ | Version | Linux Kernel | Released | ISO Size |\n| :--- | :--- | :--- | :---\
    \ | :--- | :--- |\n| SystemRescue | https://www.system-rescue.org/ | 10.01 | 6.1.30\
    \ | 05/2023 | 737MB |\n| Kali Linux | https://www.kali.org/ | 2023.2 | 6.1.27\
    \ | 05/2023 | 3.9GB (Live) |\n| Daphile | https://www.daphile.com/ | 23.01 | 5.15.86\
    \ | 01/2023 | 276MB |\n| Linux From Scratch | https://www.linuxfromscratch.org/\
    \ | 11.3 | 5.17.15 | 03/2023 | – |\n| Recalbox | https://recalbox.com/ | 9.1 |\
    \ 6.1.11 | 06/2023 | 3GB |\n\nTo let you hear the music on Daphile’s hard disk\
    \ from another location, the distribution launches a Samba server which you can\
    \ connect from any Linux, Windows, or macOS machine. The Samba server gives you\
    \ access to artist folders inside. Setting up Daphile is easy. The website offers\
    \ three downloads (64-bit, 32-bit, and 64-bit with real-time kernel), so you can\
    \ use a modern computer, but Daphile will also work on a very old machine. For\
    \ our test, we picked the first option, 64-bit image (*daphile-23.01-x86_64.iso*).\
    \ Note that Daphile is available under a restricted license – a disclaimer on\
    \ the website reads: “Daphile distribution is made available free of charge for\
    \ non-commercial private use. Any commercial usage and redistribution of Daphile\
    \ in any form is strictly prohibited.”\n\nWrite the ISO image to a USB stick,\
    \ boot your intended audio server from that stick, and check the output on the\
    \ screen: It will show its IP address. This is also the last time you need a monitor\
    \ connected, because Daphile runs in headless mode – you cannot login directly\
    \ at the computer. Connect via a browser and go to the *Settings* tab. you can\
    \ launch an installation: Select a hard disk that will repartitioned (and will\
    \ lose all data). Daphile creates two partitions, a small one named *DaphileBoot*\
    \ (which holds the software) and a large one named *DaphileData* (where you store\
    \ your music). If don’t want to use the computer’s hard disk or only want to try\
    \ the software, you can also install onto the USB stick that you’ve just booted\
    \ from. Reboot from the target disk (or stick) and...\n"
