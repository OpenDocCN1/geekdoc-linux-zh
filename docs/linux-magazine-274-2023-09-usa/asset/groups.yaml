    \ tracker Tracker) chan int {\n10 ctrl := make(chan int)\n11 go func() {\n12 for\
    \ {\n13 select {\n14 case <-ctrl:\n15 car.TurnAng = 0\n16 car.DriveAng = 0\n17\
    \ car.Ava.Move(car.StartPos)\n18 car.Speed = 1\n19 car.Timer.Reset()\n20 car.Timer.Update()\n\
    21 run(car, ctrl, tracker)\n22 }\n23 }()\n24 \n25 return ctrl\n26 }\n27 \n28 run(car\
    \ *Car, ctrl chan int, tracker Tracker) {\n29 for {\n30 select {\n31 case <-ctrl:\n\
    32 case <-time.After(time.Duration(10) * time.Millisecond):\n33 car.Timer.Update()\n\
    34 x := car.Ava.Position().X\n35 y := car.Ava.Position().Y\n36 car.DriveAng +=\
    \ car.TurnAng\n37 car.Speed += 0.01\n38 x += car.Speed * float32(math.Sin(float64(car.DriveAng)))\n\
    39 y -= car.Speed * float32(math.Cos(float64(car.DriveAng)))\n40 \n41 if tracker.OnRoad(x,\
    \ y) {\n42 car.Ava.Move(fyne.NewPos(x, y))\n43 } else {\n44 return\n45 }\n46 }\n\
    47 }\n48 }\n```\n**Listing 5: animate.go**\n\n```bash\n$ go mod init faster\n\
    $ go mod tidy\n$ go build\n```\n**Listing 6: Creating the Binary**\n\n"
