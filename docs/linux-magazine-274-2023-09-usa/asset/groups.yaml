  - "[PAGE 30]\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_30_0.png)\n\nSo what’s\
    \ next? Perhaps a coreboot \n\noption in Debian 13 to replace the BIOS? \n\nGiven\
    \ that coreboot has to be tailored to \n\neach CPU, that might be difficult, but\
    \ \n\nwith a growing number of Linux hard-\n\nware sellers opting for coreboot,\
    \ it seems \n\nonly a matter of time before more distri-\n\nbutions offer it.\
    \ Meanwhile, Debian 12 \n\nmakes one thing clear: It’s not your fa-\n\nther’s\
    \ Debian. Q Q Q\n\npassionately in the Debian Legal \n\nforum, and, unlike most\
    \ distributions, \n\nDebian has never automatically ac-\n\ncepted the Free Software\
    \ Foundation’s \n\ndecisions on whether a license was \n\nfree. For example, in\
    \ 2006, Debian only \n\naccepted the GNU Free Documentation \n\nLicense (FDL)\
    \ as free if no invariant \n\nsection was included \\[6\\].\n\nGiven this history,\
    \ Debian’s General \n\nResolution in October 2022 came as a \n\nsurprise \\[7\\\
    ]. In the resolution, develop-\n\ners voted to amend section 5 of the \n\nDebian\
    \ Social Contract \\[8\\] by adding, \n\n“The Debian official media may include\
    \ \n\nfirmware that is otherwise not part of the \n\nDebian system to enable use\
    \ of Debian \n\nwith hardware that requires such firm-\n\nware.” As a result of\
    \ this change, Debian \n\n12 became the first release to install with \n\na new\
    \ non-free firmware section enabled \n\nby default. For convenience, other pro-\n\
    \nprietary packages remain unenabled in \n\nnon-free.\n\nThis compromise acknowledges\
    \ what \n\nthe distro’s previous policy deliberately \n\nignored: Because of the\
    \ state of free driv-\n\ners, most users were already using non-\n\nfree drivers\
    \ to get the most from their \n\nhardware. For instance, without proprie-\n\n\
    tary drivers, the highest resolution of \n\nmany monitors could not be used. And,\
    \ \n\nof course, most Debian derivatives al-\n\nready provided non-free drivers\
    \ during \n\ninstallation. The resolution simply \n\nacknowledged the existing\
    \ situation and \n\nprovided greater convenience.\n\nWhat makes the General Resolution\
    \ \n\ninteresting, though, is that it is an indi-\n\ncator of how much Debian\
    \ and free \n\nsoftware in general has changed. Ad-\n\nmittedly, one of the options\
    \ in the reso-\n\nlution was “Installer with non-free soft-\n\nware is not part\
    \ of Debian,” which, had \n\nit passed, would have left Debian policy \n\nunchanged.\
