    Raspberry Pi Distros


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_27_0.png)


    Combian 64 [8] boots directly into C64 mode, and Amstrian [9] brings back Amstrad
    CPC 464. These three emulator distros have sizes between 900MB and 1.1GB (compressed).
    Maiolino has declared them as “donationware projects”; he asks for a donation
    via PayPal if you enjoy using them. Also, the software must not be used commercially,
    and modified versions cannot be distributed.


    PiMiga [10] [11] is a different beast. It is a Commodore Amiga emulator, but at
    43GB, the image is huge: It contains thousands of Amiga games and applications,
    and it does not run the classical workbench from the late 1980s, but a new implementation
    that can cope with higher resolutions and more colors (Figure 3). Last December
    Chris Edwards released PiMiga v3.0.


    ### DietPi


    A good starting point for assembling your own Linux distribution is DietPi [12],
    a stripped-down port of Debian to the Raspberry Pi. DietPi runs on current and
    old Rasp Pi models (back to the RPi2), but it also supports other single-board
    computers, including various ODROID and PINE64 devices and the OrangePi 5. The
    setup routine lets you install software packages that have been optimized for
    the platform, and you can install just what you need, whereas most other distributions
    give you a full set of tools.


    ### Conclusion


    You can expect the number of small and specialized Linux distributions for the
    Raspberry Pi to grow. If you need even more variety, you can experiment with completely
    different operating systems, such as FreeBSD [13] or RISC OS [14]. Q Q Q


    EmulationStation. Instead of the Rasp Pi version of Recalbox, you can also try
    RetroPie [6] which – again – uses EmulationStation. In Raspberry Pi Imager, you
    will find RetroPie under Emulation and game OS | *RetroPie*; the compressed image
    size is 860MB. RetroPie lacks ROMs, so you will need to manually install game
    ROMs.


    After booting for the first time, you can connect a joystick or controller and
    configure its buttons. If you don’t want to map a function to a button (because
    your controller doesn’t have it), simply keep an already taken button pressed
    until the configurator skips this item. (You cannot skip entries with the keyboard’s
    cursor keys.)


    **Figure 3:** Install PiMiga on a Raspberry Pi 400 for a great retro experience.**

