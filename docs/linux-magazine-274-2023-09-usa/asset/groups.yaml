    ## **SUSE Goes for the Fork After Red Hat’s RHEL Announcement**


    SUSE, the company behind Rancher and SUSE Enterprise Linux, has announced it will
    invest $10 million to fork publicly available Red Enterprise Linux (RHEL) and
    develop a RHEL-compatible distribution.


    Dirk-Peter van Leeuwen, CEO of SUSE, says, “For decades, collaboration and shared
    success have been the building blocks of our open source community. We have a
    responsibility to defend these values.”


    He then speaks to the investment SUSE has committed to this effort by saying,
    “This investment will preserve the flow of innovation for years to come and ensures
    that customers and community alike are not subjected to vendor lock-in and have
    genuine choice tomorrow as well as today.”


    This all started when Red Hat declared that CentOS Stream would be the sole repository
    for public RHEL source code. However, with CentOS Stream being a rolling release
    distribution, it’s not exactly suitable for business needs.


    Gregory Kurtzer, the original creator of CentOS and the man behind the RHEL clone,
    Rocky Linux, had this to say, “SUSE has embodied the core principles and spirit
    of open source; CIQ is thrilled to collaborate with SUSE on advancing an open
    enterprise Linux standard.”


    There has been no mention of a release date for this fork, as it will take considerable
    time and effort to pull off.


    It might take a few years to see the fruits of SUSE’s labor, but with a 10 million
    dollar investment, you can be sure this is happening.


    ## **Solus 4.4 Now Ready for Prime Time**


    Solus 4.4, aka Harmony, is here and it has plenty to offer users. There are four
    different versions to choose from (Budgie, Gnome, MATE, and KDE Plasma). Each
    version includes all the updates that come along with the more recent versions
    of the desktops (Budgie 10.7.2, Gnome 43.5, MATE 1.27, and KDE Plasma 5.27.5).
    Although not bleeding edge releases, each of these desktops is stable and filled
    with new features to enjoy.


    One welcome change is that, with KDE Plasma, the Wayland session now works out
    of the box. However, for MATE users, let it be known that the Solus development
    team plan on sunsetting this version (because the MATE desktop isn’t).

