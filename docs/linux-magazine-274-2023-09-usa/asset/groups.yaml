    In what might be either the onset of tin foil disease, or nagging conscience,
    Graham has recently started to move many of his accounts to servers as you’ll
    no doubt read in these pages. Sparkling gems and new releases from the world of
    Free and Open Software, we’ve mentioned many times across these pages. Qtractor
    is an audio and MIDI editor that can be used to edit podcasts, play with plugin
    effects and synthesizers, and help to produce music. It has been able to do this
    for a while, but we’ve as yet not given the application attention it deserves.
    This may have been because, even a couple of years ago, for audio its interface
    was difficult, and for MIDI, it was surpassed by Rosegarden.


    But Qtractor has stuck to an incredible development schedule, with up to eight
    major releases a year, and has improved dramatically. It’s now a compelling alternative
    to using Ardour or Audacity for recording and editing, even for podcasts. For
    MIDI, it’s better than Ardour. And it does this by remaining as close to the original
    Cubase-era production paradigm as possible, which means if you’ve ever used a
    digital audio workstation, Qtractor will already feel familiar. This paradigm
    usually means audio and MIDI tracks run horizontally across the main display,
    with the recording controls for each track in a header section on the left. Waveforms
    and MIDI data are shown in blocks called “clips,” either as they’re being recorded
    or after they’ve been imported into the project. Clips can be edited non-destructively
    by dragging the start or end points, creating fades from corners. Double-clicking
    a MIDI clip will open an excellent MIDI editor, and there are processing tools
    for transposing, stretching, quantizing, and rescaling the MIDI data. Qtractor
    does all this, and handles MIDI data well. It’s also one of the few applications
    on Linux that can process MIDI system exclusive (SysEx) messages, and you can
    even add and configure MIDI controllers to change various parameters within the
    application, such as track gain, panning, recording, and monitoring.


    Audio files aren’t quite so well catered for, much like earlier versions of Cubase,
    because you can’t double click an audio clip and get Audacity-level editing. But
    you can still automate fades, normalize levels, and time stretch clips to fit
    a specific time or beat whilst retaining the original pitch. All of this is accomplished
    with unlimited levels of undo and redo, so you’re free to experiment with your
    recordings. As with Ardour, audio is being handled by JACK in the background,
    which means you’re free to route and reroute individual tracks anywhere you wish.
    Unlike Ardour, however, you don’t need to consider JACK unless you want to. The
    defaults work transparently, and adding tracks, buses, inserts, and effects can
    all be done without having any specialist knowledge. If you do need to dive into
    the routing details, QjackCtl is the standard UI throughout Qtractor, and this
    should be familiar to anyone who has played with JACK before. It’s just as flexible
    as Ardour without all the complexity.


    While Qtractor’s strengths are in this old-fashioned design, it doesn’t mean the
    application is without cutting-edge features. Qtractor was one of the first projects
    on any platform to adopt the new CLAP standard for virtual instruments and effects,
    and it also supports LADSPA, DSSI, VST3, VST and LV2 plugins, all with delay compensation,
    for broad compatibility with everything you can get to work on Linux. The latest
    builds are also using Qt 6.5+ and run wonderfully well on ARM devices in particular,
    making Qtractor one of the best DAWs for all users.


    **Project Website**

    https:// www. Qtractor. org


    SEPTEMBER 2023

    ISSUE 274

    LINUX-MAGAZINE.COM

    80

    **LINUX **VOICE**

    FOSSPICKS

