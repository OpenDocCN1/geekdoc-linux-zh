- md: "\nbefore sending it to the UpdateCh channel where the main program displays\
    \ it in the GUI’s label widget.\n\nWhether the car is still on the track or has\
    \ crashed is determined by Listing 3 with the Tracker object. In its constructor,\
    \ the object stores the radii R1 and R2 of the 90-degree curve in the game and\
    \ uses them to determine the coordinates of the valid game space.\n\nThe OnRoad()\
    \ function from line 18 calculates for a given *x*/y* coordinate whether the coordinate\
    \ is on the roadway or next to it. For this purpose, it divides the course into\
    \ three areas: before the turn, in the turn, and the exit section leading to the\
    \ finish line. If OnRoad() returns a true value, the car is still on the track,\
    \ while a false value signals that the car is either in the bushes or has crossed\
    \ the finish line, at which point the game ends.\n\nFinally, Listing 5 controls\
    \ the dynamics of the gameplay, from the start of the action in line 14, after\
    \ the start command has been sent to the ctrl channel. It keeps running, refreshing\
    \ the screen seconds and hundredths of a second in a Label type Fyne widget. The\
    \ GUI receives the current time to be displayed from the UpdateCh channel for\
    \ each frame the video game goes through. The concurrently running Go routine\
    \ reads the time from line 50 and – in the stopwatch widget – refreshes the time,\
    \ creating the impression of a steadily ticking stopwatch. The implementation\
    \ of the stopwatch itself can be found in Listing 4.\n\n## Timekeeper\n\nThe ctrl\
    \ channel created by the call to the animation() function in line 37 of Listing\
    \ 2 is returned to the main program and controls how the race car moves from the\
    \ start position and keeps accelerating throughout the race. The game kicks off\
    \ either in line 42, in response to clicking the *Start* button with the mouse,\
    \ or after pressing the *S* key in line 79. In both cases, the code pushes a 1\
    \ into the channel, which Listing 5 will later snap up to start moving the car.\n\
    \nListing 4 brings us the timer whose Reset() function sets the elapsed time on\
    \ the racetrack to zero by storing the current time in Start. Each time the Update()\
    \ function is called, starting in line 24, Since() determines the difference between\
    \ the current time and the start time and formats the value in seconds and hundredths\
    \ of a second.\n\n```go\n01 package main\n02 \n03 import (\n04 \"fmt\"\n05 \"\
    time\"\n06 )\n07 \n08 type Clock struct {\n09 Start time.Time\n10 UpdateCh chan\
    \ string\n11 }\n12 \n13 func NewClock() Clock {\n14 return Clock{\n15 Start: time.Now(),\n\
    16 UpdateCh: make(chan string),\n17 }\n18 }\n19 \n20 func (t *Clock) Reset() {\n\
    21 t.Start = time.Now()\n22 }\n23 \n24 func (t Clock) Update() {\n25 dur := time.Since(t.Start)\n\
    26 t.UpdateCh <- fmt.Sprintf(\"%.03f\", dur.Seconds())\n27 }\n```\n**Listing 4:\
    \ timer.go**\n\n```go\n01 package main\n02 \n03 import (\n04 \"fyne.io/fyne/v2\"\
    \n05 \"math\"\n06 )\n07 \n08 type Tracker struct {\n09 StartPos fyne.Position\n\
    10 R1, R2 float32\n11 }\n12 \n13 func NewTracker() Tracker {\n14 tracker := Tracker{}\n\
    15 return tracker\n16 }\n17 \n18 func (t Tracker) OnRoad(x, y float32) bool {\n\
    19 // before curve\n20 if y > t.R2 && x < t.R2-t.R1 && x > 0 {\n21 return true\n\
    22 }\n23 // in curve\n24 if y <= t.R2 && x <= t.R2 {\n25 h := t.R2 - y\n26 w :=\
    \ t.R2 - x\n27 r := float32(math.Sqrt(float64(h*h + w*w)))\n28 if r <= t.R2 &&\
    \ r >= t.R1 {\n29 return true\n30 }\n31 return false\n32 }\n33 // after curve\n\
    34 if y <= t.R2-t.R1 && x >= t.R2 && x < 2*t.R2 && y > 0 {\n35 return true\n36\
    \ }\n37 return false\n38 }\n```\n**Listing 3: tracker.go**\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_54_0.png)\n\
    \nDuring each individual game frame, of which there are 100 per second, the flow\
    \ of these frames is controlled by the timer in line 33 of Listing 5, which waits\
    \ exactly 10 milliseconds before code starts running in line 34. It refreshes\
    \ the stopwatch display and reads the current position of the race car as x and\
    \ y. Line 38 increases speed by 0.01 (from an initial value of 1) with each frame\
    \ processed and uses the laws of sine and cosine, according to the diagram in\
    \ Figure 6, to compute the next coordinate as an x/y value in lines 39 and 40.\
    \ For example, if the vehicle were traveling north, at an angle of 90 degrees,\
    \ or Pi/2 expressed in radiant units, and the front wheels were turned well over\
    \ the right at a 45-degree angle, the resulting angle of travel would be Pi/4\
    \ (90-45, or 45 degrees). From the current game coordinate (x, y), the vehicle\
    \ would move up and to the right in the next cycle of the game, assuming coordinates\
    \ (x+1, y-1), because the UI counts the y coordinates from the top down, meaning\
    \ that y values decrease towards the north. If the next coordinate is still within\
    \ the confines of the track, which the tracker checks by calling OnRoad() in line\
    \ 42, the car uses Move() to go to the new position in line 43. If not, the car\
    \ has either passed the finish line or landed in the ditch, and return in line\
    \ 45 terminates the for loop that would otherwise continue. That completes the\
    \ game.\n\n## Installation\n\n```go\n01 package main\n02 \n03 import (\n04 \"\
    fyne.io/fyne/v2\"\n05 \"math\"\n06 \"time\"\n07 )\n08 \n09 func animation(car\
    \ *Car, tracker Tracker) chan int {\n10 ctrl := make(chan int)\n11 go func() {\n\
    12 for {\n13 select {\n14 case <-ctrl:\n15 car.TurnAng = 0\n16 car.DriveAng =\
    \ 0\n17 car.Ava.Move(car.StartPos)\n18 car.Speed = 1\n19 car.Timer.Reset()\n20\
    \ car.Timer.Update()\n21 run(car, ctrl, tracker)\n22 }\n23 }()\n24 \n25 return\
    \ ctrl\n26 }\n27 \n28 func run(car *Car, ctrl chan int, tracker Tracker) {\n29\
    \ for {\n30 select {\n31 case <-ctrl:\n32 case <-time.After(time.Duration(10)\
    \ * time.Millisecond):\n33 car.Timer.Update()\n34 x := car.Ava.Position().X\n\
    35 y := car.Ava.Position().Y\n36 car.DriveAng += car.TurnAng\n37 car.Speed +=\
    \ 0.01\n38 x += car.Speed * float32(math.Sin(float64(car.DriveAng)))\n39 y -=\
    \ car.Speed * float32(math.Cos(float64(car.DriveAng)))\n40 \n41 if tracker.OnRoad(x,\
    \ y) {\n42 car.Ava.Move(fyne.NewPos(x, y))\n43 } else {\n44 return\n45 }\n46 }\n\
    47 }\n48 }\n```\n**Listing 5: animate.go**\n\n```bash\n$ go mod init faster\n\
    $ go mod tidy\n$ go build\n```\n**Listing 6: Creating the Binary**\n"
  mdcn: "\n将其发送到 UpdateCh 通道，主程序会在 GUI 的标签控件中显示它。\n\n赛车是否仍在赛道上或已经碰撞，由列表 3 中的 `Tracker`\
    \ 对象决定。在它的构造函数中，该对象存储了游戏中 90 度弯道的半径 $R1$ 和 $R2$，并利用它们来确定有效游戏空间的坐标。\n\n来自第 18 行的\
    \ `OnRoad()` 函数根据给定的 *x*/y* 坐标计算该坐标是在道路上还是在路旁。为此，它将赛道分为三个区域：弯道前、弯道内以及通往终点线的出口段。如果\
    \ `OnRoad()` 返回真值，则汽车仍在赛道上；返回假值则表示汽车在灌木丛中或越过了终点线，此时游戏结束。\n\n最后，列表 5 控制游戏运行的动态过程，从第\
    \ 14 行向 `ctrl` 通道发送启动命令后的动作开始。它保持运行，以秒和百分之一秒为单位在 `Label` 类型的 Fyne 组件中刷新屏幕。GUI\
    \ 每一帧视频游戏运行时都会从 `UpdateCh` 通道接收要显示的当前时间。并发运行的 Go routine 从第 50 行读取时间，并在秒表组件中刷新时间，营造出秒表稳定跳动的视觉效果。秒表本身的实现代码可以在列表\
    \ 4 中找到。\n\n## 计时器 (Timekeeper)\n\n列表 2 第 37 行调用 `animation()` 函数创建的 `ctrl` 通道被返回给主程序，并控制赛车如何从起始位置移动并在整个比赛过程中保持加速。游戏要么在第\
    \ 42 行响应鼠标点击 *Start* 按钮而启动，要么在第 79 行在按下 *S* 键后启动。在这两种情况下，代码都会向通道推入一个 1，列表 5 稍后会捕捉该值以开始移动汽车。\n\
    \n列表 4 为我们引入了计时器，其 `Reset()` 函数通过将当前时间存储在 `Start` 中将赛道上的已用时间置零。每当调用 `Update()`\
    \ 函数（从第 24 行开始），`Since()` 会确定当前时间与开始时间之间的差，并将值以秒和百分之一秒的形式格式化。\n\n```go\n01 package\
    \ main\n02 \n03 import (\n04 \"fmt\"\n05 \"time\"\n06 )\n07 \n08 type Clock struct\
    \ {\n09 Start time.Time\n10 UpdateCh chan string\n11 }\n12 \n13 func NewClock()\
    \ Clock {\n14 return Clock{\n15 Start: time.Now(),\n16 UpdateCh: make(chan string),\n\
    17 }\n18 }\n19 \n20 func (t *Clock) Reset() {\n21 t.Start = time.Now()\n22 }\n\
    23 \n24 func (t Clock) Update() {\n25 dur := time.Since(t.Start)\n26 t.UpdateCh\
    \ <- fmt.Sprintf(\"%.03f\", dur.Seconds())\n27 }\n```\n**Listing 4: timer.go**\n\
    \n```go\n01 package main\n02 \n03 import (\n04 \"fyne.io/fyne/v2\"\n05 \"math\"\
    \n06 )\n07 \n08 type Tracker struct {\n09 StartPos fyne.Position\n10 R1, R2 float32\n\
    11 }\n12 \n13 func NewTracker() Tracker {\n14 tracker := Tracker{}\n15 return\
    \ tracker\n16 }\n17 \n18 func (t Tracker) OnRoad(x, y float32) bool {\n19 // before\
    \ curve\n20 if y > t.R2 && x < t.R2-t.R1 && x > 0 {\n21 return true\n22 }\n23\
    \ // in curve\n24 if y <= t.R2 && x <= t.R2 {\n25 h := t.R2 - y\n26 w := t.R2\
    \ - x\n27 r := float32(math.Sqrt(float64(h*h + w*w)))\n28 if r <= t.R2 && r >=\
    \ t.R1 {\n29 return true\n30 }\n31 return false\n32 }\n33 // after curve\n34 if\
    \ y <= t.R2-t.R1 && x >= t.R2 && x < 2*t.R2 && y > 0 {\n35 return true\n36 }\n\
    37 return false\n38 }\n```\n**Listing 3: tracker.go**\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_54_0.png)\n\
    \n在每一帧游戏帧中（每秒 100 帧），这些帧的流由列表 5 第 33 行的计时器控制，它会在第 34 行代码开始运行之前精确等待 10 毫秒。它刷新秒表显示并读取赛车的当前位置作为\
    \ x 和 y。第 38 行每处理一帧将速度增加 0.01（从初始值1 开始），并根据图 6 中的图表利用正弦和余弦定律在第 39 行和 40 行计算下一个坐标的\
    \ x/y 值。例如，如果车辆正在向北行驶，角度为 90 度或弧度制的 Pi/2，且方向盘向右转了 45 度，那么结果角度将变为 Pi/4（Pi/2 减去\
    \ 45 度）。从当前游戏坐标 (x, y) 开始，由于 UI 从上向下计算 y 值，车辆将向上并向右移动。如果下一个坐标仍在赛道范围内（通过第 42 行调用\
    \ `OnRoad()` 检查），汽车将在第 43 行使用 `Move()` 移动新位置。否则，汽车已越过终线或掉入沟中，第 45 行的 `return`\
    \ 将终止原本会继续的循环。这完成了游戏。\n\n## 安装\n\n```go\n01 package main\n02 \n03 import (\n04\
