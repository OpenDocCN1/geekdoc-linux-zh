    ![](img/8db7a58bef2f490a3db3c4fd35de2457_28_0.png)


    开发者仍然参与其中，但他们现在已是中年人，而非青少年了。这很大程度上原因可能是 Ubuntu 的兴起，自 2004 年首次发布以来，它被认为继承了 Debian
    的许多优点，并提供了更用户友好的环境。在 Ubuntu 早期，甚至似乎 Ubuntu 在流行程度上可能会取代 Debian。但事实上，许多开发者同时为 Debian
    和 Ubuntu 做出了贡献。


    在安装代号为“Bookworm”（虫虫）的 Debian 12 时，我不禁对自第一次安装它以来 24 年间，该发行版发生了如此巨大的变化感到震惊（图 1）。在千禧交替前后，Debian
    已经拥有极高的声誉。它是六大领先发行版之一，但被广泛地视为专家的选择，其开发者被看作一个痴迷于激进治理形式的精英俱乐部成员。事实上，我曾听过 GNU 通用公许可证背后的律师
    Eben Moglen 将该项目描述为工主义无政府主义的实践实例。相比之下，2023 年的 Debian 变得温和了，悄地变得更加易用，甚至其曾经臭名昭著的刻薄邮件列表运行得也更加负责。


    这种变化的原因之一可能是，虽然原始的 Ubuntu 开发者中许多……尽管 Debian 保持着自己的人气——一直位居 DistroWatch 页面访问量 [1]
    前 10 名——但它作为其他发行版的基础获得了影响力，其中许多发行版，如 Ubuntu、Linux Mint 和 MX Linux，也拥有了自己的人气。今天，DistroWatch
    上的 122 个发行版（占所有发行版的近三分之二）源自 Debian 或其主要分支。Debian 在 DistroWatch 网站上有一个页面 [2]，并还为专业用户开发了
    Med [3] 和 Astro [4] 混合版，以及用于课堂教学的 Debian Edu [5]。凭借这样的影响力，更广泛的视角是不可避免的。我没有发现任何迹象表明这种策略是刻意的，但这种变化可能仅仅源于用户兴趣的改变。


    当然，Debian 的许多方面保持不变。与之前的版本一样，Debian 12 在上一个版本发布约两年后推出，并再次增加了其已经是最大的软件包集合。然而，如今的
    Debian 在至少三个主要方面比其前身更易用：安装、软件包以及它的非自由固件策略。


    ## 安装选项


    在早期，Debian 以难于安装而名不虚传。这种声誉随着 Debian 安装程序（Debian Installer）的发布有所缓和，但在某种程度上仍然存在，因为
    Debian 安装程序需要过多的选择，对新用户来说这并不舒适，尽管许多发行版提供它用于安装时的故障排除。Debian 还解决了可访问性问题，包括一个为盲人提供的语音合成器安装程序。对于新用户，Calamares
    安装程序提供了基础的图形化或命令行安装，而经验较丰富的用户可以使用“高级选项”菜单中的 Debian 安装程序，这减少了所需的维护工作量，但有助于让尽可能多多的用户欢迎
    Debian。


    ## 值得关注的软件包


    在整个 Debian 历史中，用户因稳定性、安全性和高水平的测试而选择它。事实上，Debian 的测试（testing）仓库以及有时的不稳定（unstable）仓库通常被认为比其他发行版的仓库更可靠。包括
    Ubuntu 和 Fedora 在内的许多衍生版都是基于其中之一或两者。从历史上看，没有人会为了新应用程序而选择 Debian，其简单的原因是，当一个新的
    Debian 版本发布时，其他发行版早已展示了它们的新特性。但这种观点并非完全正确。Debian 定期包含一些脚本，对于那些甚至尚未进入主要衍生版的新软件包来说这已经足够。然而，在最近的几个版本中，Debian
    推出了一些可能具有广泛吸引力的新应用程序。通常，这些应用程序在开发时也考虑了对普通用户的实用性。例如，diffoscope 在使用 Git 等版本控制工具时非常有用，对于想要比较二进制格式文本（如
    LibreOffice 的 OpenDocument 或 PDF）的写作者来说也很有用（图 2）。同样，debian-debootstrap（在本期杂志的其他部分有详细介绍）允许在不更换机器的情况下测试不同的架构，同时为任何人快速快捷地测试软件包提供了一个沙箱。更通俗地说，对
    Debian 12 的多次评论都特别提到了 font，这是一款用于浏览字体的命令行工具（图 3）。这些示例似乎表明 Debian 正开始扩大它的吸引力。


    ## 关于非自由固件策略的改变


    无疑，最大的变化是对非自由软件的新立场。从最早时期开始，Debian 的每个仓库都有一个非自由（non-free）部分，以及一个包含依赖非自由软件的自由软件的
    contrib 部分。然而，这些部分从未是版本的正式组成，在安装期间也不会默认启用。此外，许可证问题一直是 Debian 论坛争论的焦点，与大多数发行版不同，Debian
    从未自动接受过自由软件基金关于许可证是否为自由的决定。例如，2006 年，Debian 只有在不包含不变部分的情况下才接受自由文档许可证（FDL）为自由许可
    [6]。


    鉴于这段历史，Debian 在 2022 年 10 月的决议令人们惊讶 [7]。在决议中，开发者投票修改 Debian 社会契约 [8] 的第 5 条，添加了：“Debian
    官方媒体可能包含其他不属于 Debian 系统部分的固件，以允许在需要此类固件的硬件上使用 Debian。”由于这一变化，Debian 12 成为第一个默认启用新非自由固件部分的发布版本。为了方便起见，其他专用包在非自由部分中仍保持禁用状态。


    这种妥协承认了该发行版之前的策略刻意忽略的一点：由于自由驱动程序的状态，大多数用户已经在使用非自由驱动程序以充分发挥硬件性能。例如，没有专用驱动程序，许多显示器无法使用最高分辨率。而且，这种妥协承认了……这种立场承认了“为了允许在需要此类固件的硬件上使用
    Debian”。这一决议的结果并没有引起外界之外的关注。自由软件的纯洁性曾是主流，但现在 Debian 的倡导者也转向了更务实的立场。


    ## 接下来


    那么接下来会是什么？也许是在 Debian 13 中引入 coreboot 吗？考虑到 coreboot 需要针对每种 CPU 进行定制，这可能很困难，但随着越来越多的
    Linux 硬件商选择 coreboot，这只是时间问题。与此同时，Debian 12 明确了一点：它已不再是你父亲的那个 Debian 了。


    Debian 12

    **Debian 12 提供了安装选项、新软件包以及非自由固件的新立场，使其对普通用户更易用。**

    作者：Bruce Byfield


    **Bruce Byfield** 是一位计算机记者，也是专注于自由开源软件的自由职业作家和编辑。除了他的写作项目，他还教授直播和在线课程。在空余时间，Bruce
    写关于西北海岸艺术的文章（*http://brucebyfield.wordpress.com/*）。他还是 Prentice Pieces 的联合创始人，这是一个关于写作和幻想的博客（*https://prenticepieces.com/*）。


    **作者**


    图 1：最近发布的 Debian 12 显示了年来发行版发生的变化。

    **主图 © Galina Peshkova, 123RF.com。**


    图 2：Debian 12 特色应用程序之一，diffoscope 可以比较二进制文件。在这里它正在了两个 LibreOffice 文件。

    图 3：Debian 12 的新功能是 font，它可以从命令行查看 Google Fonts。

