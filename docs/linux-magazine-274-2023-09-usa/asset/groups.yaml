    ## Shoot ''em up


    ### Antsy Alien Attack Pico


    Despite the scale of many modern games, with budgets in the hundreds of millions,
    and hundreds of people working on them for years, there’s nothing quite like a
    lone coder’s simple adrenaline-fueled shooter. Antsy Alien Attack Pico is a great
    example of one of these, having been developed by Martin Wimpress for the Linux
    Game Jam 2023 using PICO-8. We’ve covered PICO-8 before, a brilliant platform
    for game development that enforces strict limitations, just as a simple fictitious
    early 1980s games console might. Those limitations include a display of only 128x128
    pixels with 16 colors, simple 4 channel audio, and just 32KB of storage. The hope
    is that it allows game developers to put their focus and efforts into pure gameplay,
    and – as with Antsy Alien Attack Pico – it succeeds.


    Antsy Alien Attack Pico takes full advantage of these limitations, with large
    chunky pixelated sprites for your ship, its weapons, the aliens, and anything
    else that might come along. The 4-channel soundtrack is reminiscent of Nemesis
    running on an MSX, but the game itself is a vertical scroller rather than a horizontal
    one, and you can move your ship up and down across the star field, and left and
    right with a range that extends a little past the screen edges. Your job is to
    shoot the aliens or smash into them, shield permitting, catch power-ups, and get
    through each of five successive waves and their unique minigames. Minigames include
    speeding through an asteroid belt, grabbing power-ups, and protecting a cargo
    ship. You can do all of this with either a joystick or with the keyboard, but
    most importantly, you can choose to do this with a friend for side-by-side cooperative
    shooter fun, especially from the same keyboard. It’s brilliantly executed, and
    perfectly suited to PICO-8’s form factor, and if you have a device handy, particularly
    brilliant on a PICO-8 supported handheld.


    **Project Website**

    https://github.com/wimpysworld/antsy-alien-attack-pico


    In Antsy, you have a single life with a power bar you need to protect by shooting
    aliens before they hit you.


    ### Platform game


    ### Jumpy


    If you prefer your games scrolling in all directions rather than just one, Jumpy
    is for you. It’s a manic multiplayer brawler played on 2D platforms under the
    sea. The brawler part means it’s your job to hit other players with whatever you
    have at hand, including your fins, or any weapons you find within the level. The
    level will zoom and scroll around to follow you, and the action is quick and reflexive.
    It’s a little like the arcade-classic Bomberman with sabres and pistols rather
    than bombs. But the game also describes itself as “tactical,” which means the
    best strategy is to use platforms in the background, rather than to simply hunt
    and chase your enemies. Up to four players can take part, with local play supporting
    two from the same keyboard and a third on a gamepad. For more players, a network
    option lets everyone use their own machine. Without other humans, the computer
    can be summoned to control the other characters, which obviously lacks typical
    human deviousness but is great for learning the levels.


    There are 14 different levels in the game, ranging from blocky boats to submerged
    dungeons, all with a nautical theme reminiscent of SpongeBob SquarePants. But
    the game’s best feature is the embedded level editor, which makes it easy to design
    and play your own fiendish creations. The map editor is brilliantly implemented
    with a layered approach, much like Gimp. You can open and edit built-in maps,
    as well as start from scratch, and choose from a selection of graphical tiles,
    the locations players are spawned, and how collisions affect players. There’s
    even a randomize button if you don’t have the time to handcraft a level, and you
    can instantly play your creation to test out whether it works. It’s a good way
    for younger players to experiment with game design, and they can even take things
    further with new characters and weapons, if they wish, adding to a game that’s
    already a lot of fun to play.


    **Project Website**

    https://github.com/fishfolk/jumpy


    Jumpy is currently under development as the programmers port their idea to the
    Bevy game engine.


    FOSSPICKS


    LINUX

