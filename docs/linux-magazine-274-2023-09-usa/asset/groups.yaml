    \ For a scenario such as this, the \n\nadministrator needs to modify the configurations\
    \ \n\nof all the browsers on the LAN so they accept the \n\nproxy’s certificate\
    \ for all URLs.\n\nThe biggest problem with any proxy filter is not \n\ntechnical\
    \ but legal. It is a de facto man-in-the-mid-\n\ndle attack that decrypts all\
    \ Internet communica-\n\ntion of all users. As soon as a user logs on to pri-\n\
    \nvate services such as home banking, shopping, or \n\nsocial media on his company\
    \ PC, the company \n\nproxy also decrypts and stores the private data \n\nsuch\
    \ as passwords or shopping cart content. This \n\nintrusion into the privacy of\
    \ users is not permissi-\n\nble. For a filter of this kind, the employer needs\
    \ an \n\nagreement that has been approved by the works \n\ncouncil and signed\
    \ by all employees, and that, for \n\nexample, generally excludes private use\
    \ of com-\n\npany PCs. It would also be possible to create fil-\n\nters that completely\
    \ block access to services \n\nsuch as banking, shopping, and social media.\n\n\
    As an alternative, the company could provide a \n\nseparate, unfiltered WLAN without\
    \ a connection to \n\nthe company network for the users’ private devices. \n\n\
    In addition, modern filtering proxies such as Squid \n\ncan use rule-based forwarding\
    \ (peek and slice) in \n\naddition to simply “bumping” SSL connections. A \n\n\
    ruleset decides which connections are broken and \n\nexamined by the proxy and\
    \ which are tunneled di-\n\nrectly to the client without decryption. This, in\
    \ turn, \n\nwould allow users’ private traffic to pass through \n\nuntouched.\
    \ But a setup like this renders the proxy \n\nineffective as a security measure.\
    \ We will not be \n\nlooking at a Squid setup with bump, peek, and slice \n\n\
    in this article, but instead investigating a solution \n\nthat is legally far\
    \ less problematic.\n\n**Not Ordered, Not Picked Up**\n\nAnother method for keeping\
    \ out unwanted content \n\ndoes not filter the packets returned from the Internet\
    \ \n\nbut, instead, the outgoing requests. When looking at \n\nthe HTML code of\
    \ a web page with advertising, it \n\nquickly becomes apparent that the advertising\
    \ ban-\n\nners do not originate from the addressed target \n\nserver itself. Instead,\
    \ the pages embed HTML that \n\n**O**\n\nne episode of the award-winning TV se-\n\
    \nries *Futurama* depicts the Internet as a \n\nmetaverse in which advertising\
    \ banners \n\nattack users’ avatars like birds of prey: “The Inter-\n\nnet! My\
    \ God! It’s full of ads!” Even without a meta-\n\nverse, Internet users today\
    \ are tracked by trackers \n\nand cookies and flooded with unwanted advertis-\n\
    \ning. But users can protect themselves against this \n\nflood of advertising.\
    \ There are various methods of \n\nevading tracking by advertisers, confusing\
    \ track-\n\ners, and keeping unwanted content out of web-\n\nsites. With the help\
    \ of the free Pi-hole \\[1\\], this arti-\n\ncle looks at a couple of effective\
    \ approaches that \n\nhelp protect you against unwanted content at the \n\nserver,\
    \ network, and client levels, while minimizing \n\nthe threat of phishing at the\
    \ same time.\n\n**Proxy Filter with Problems**\n\nIn the early 2000s, the proxy\
    \ filter was the best way \n\nto protect yourself against unwanted content and\
    \ \n\nthreats from viruses and Trojan Horses from the \n\nweb. Clients do not\
    \ request the content of a web-\n\nsite directly from the web, but pass the request\
    \ to a \n\ncentral proxy server such as Squid. The server then \n\nretrieves the\
    \ content, stores some of it in a local \n\ncache, and returns the information\
    \ to the browser. \n\nIn times of limited bandwidth, proxies were popular \n\n\
    mainly because of their caching function, which \n\nmeant that less information\
    \ needed to be retrieved \n\nover slow Internet connections. Plugins such as \n\
    \nsquidGuard blocked unwanted content at the proxy \n\nlevel, while other extensions\
    \ inspected the content \n\nof websites directly and checked for malware.\n\n\
    The proxies’ work was made more difficult by an \n\nimportant security feature:\
