    每次你启动系统时，都会进入一个以 root 身份运行’s Window Manager (JWM) [6] 的图形会话。JWM 是一个轻量级窗口管理器，使其成为旨在运行在较新和旧硬件上的系统的良好选择。默认情况下，JWM
    会创建三个桌面，你可以通过 Ctrl+Alt+左箭头键和 Ctrl+Alt+右箭头键访问。


    S15Pup64 的 402MB ISO 镜像包含了许多有用软件。从桌面顶部的图标栏（图 3），你可以启动文件管理器（ROX-Filer）、Web 浏览器（基于
    Firefox 的 Light 48.0）、IRC 客户端（HexChat，它会自动加入 Freenode 上的 #puppylinux 频道）、LXTerminal、任务管理器、办公软件（文字处理器
    AbiWord 和电子表格程序 Gnumeric）、一个简单的绘图程序（mtPaint）以及一些配置工具。你可以通过左下角的开始菜单找到更多应用程序。当你在命令行中工作时，你会发现
    S15Pup64 提供了当前的 OpenSSH 版本，因此你可以使用运行 Puppy Linux 的旧电脑登录到网络中的其他机器（图 3）。


    向 Puppy Linux 系统添加软件是可能的。例如，在基于 Slackware 的 S15Pup64 中，选择 *Applications* | *Setup*
    | *Package manager* 进入包管理器，该管理器使用多个仓库并可以安装 Puppy 软件包。Puppy 软件包具有 .pet 扩展名，实际上是
    xz 压缩的 tar 文件。你也可以在 BIOS 设置中从 UEFI 改为 Legacy 安装包。将其写入 CD 也可以运行，但再次强调，在 Lenovo
    IdeaPad 上只有在 BIOS 中启用了传统启动模式后才能启动。我还成功地在一台老旧的 IBM ThinkPad T30（配备单核处理器、主频为 2GHz
    的奔腾 4 处理器和 512MB 内存）上测试了 Tiny Core。


    在 IdeaPad 上，Tiny Core 没有检测到现代的 16:9 屏幕分辨率，并以经典的 4:3 分辨率（1024x768）运行 X，但我可以通过在终端窗口运行
    `xsetup.sh` 脚本来修复它：选择正确的分辨率（1366x768），用 Ctrl+Alt+退格键终止 X，并使用 `startx` 命令重新启动 X
    服务。


    FLVM 窗口管理器启动时带有一个虚拟桌面，但你可以通过按下 Ctrl+F2、Ctrl+F3 等轻松创建额外的桌面：这些快捷键将创建桌面 #2 和 #3 并切换到它们；你可以通过
    Ctrl+F1 回到初始桌面。删除桌面也很简单：只需点击桌面上的空白区域并选择 *Desktop n* | *delete this desktop* 菜单项。


    Tiny Core 没有附带任何有趣的预装应用程序，但它允许你使用 Puppy Linux 相同的方法添加软件：通过挂载 squash 文件系统。然而，Tiny
    Core 不使用 UnionFS 创建叠加层（像 Puppy 那样），而是将文件系统挂载到单独的文件夹并添加符号链接。例如，当你想安装命令行工具时，启动 *Apps*
    应用程序（图 4），选择 *Apps* | *Cloud (Remote)* | *Browse*，在列表中找到并选择 `file.tcz` 包，将右下角的下拉选项更改为
    *Download + Load* 并点击 *Go*。Tiny Core 然后下载一个包含 squash 文件系统的 .tcz 文件 (file.tcz)，它将该文件挂载到
    /tmp/tcloop/，并将 /tmp/tcloop/usr/local/bin/ 软链接到 /local/bin，以便你可以运行该命令。当你重启时，新安装的软件似乎消失了：你无法再次使用该命令。但
    file.tcz 包并没有被删除；它与运行系统的集成不是永久的。你可以通过再次运行 *Apps* 并选择 *Apps* | *Maintenance* |
    *OnBoot Maintenance* 来更改。在双列视图中，在左列找到 file.tcz，选中它并点击 *Add item*。该项将移动到右列。现在重启（在终端窗口输入
    `sudo reboot`），文件将从底层的 Slackware 发行版可用。安装 .pet 包有时会导致依赖关系未满足，对于当前的 S15Pup64 和旧的
    FossaPup64 都是如此。Puppy Linux 也使用 Squashfs (*sfs*)。


