    \ and \n\nit is ideal for running occasionally \n\non whatever computer is hosting\
    \ \n\nyour music collection.\n\nThere are two modes of opera-\n\ntion. The dump\
    \ mode will output the \n\nmetadata for the majority of audio \n\nfiles you throw\
    \ at it, from MP3 to \n\nFLAC. It can do this formatted for \n\nthe command line\
    \ – or formatted \n\ninto something more program-\n\nmatically useful with JSON.\
    \ Argu-\n\nments can be used to include \n\nwhole directories, to exclude spe-\n\
    \ncific types, or even query a specific \n\nattribute through JSON. It’s also\
    \ a \n\nquick and easy way to see what \n\nan audio file is all about if you can’t\
    \ \n\ntell from its filename. You can also \n\nuse tone as a tool to populate\
    \ your \n\nown collection spreadsheet or da-\n\ntabase. To balance the dump mode,\
    \ \n\nthere’s a tag mode, which lets you set most commonly used \n\naudio tags,\
    \ including genre, artist, series, part, and title. A \n\nclever auto-import option\
    \ lets you set these values with \n\nstrings taken from the filesystem path, and\
    \ you could easily \n\nsubvert this with a script to perform far more advanced\
    \ op-\n\nerations. This makes tone the ideal tool to use when you find \n\nyourself\
    \ with a complex audio metadata problem.\n\n**Project Website**\n\nhttps:// github.\
    \ com/ sandreas/ tone\n\nUse **tone** to quickly retrieve or set audio file metadata\
    \ from the com-\n\nmand line, or from within your own scripts.\n\nLINUX-MAGAZINE.COM\
    \ \n\nISSUE 274 \n\nSEPTEMBER 2023\n\n81\n\nFOSSPICKS\n\n**LINUX **VOICE"
  - "[PAGE 81]\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_81_0.png)\n\n**RSS hosting**\n\
    \n**Tiny Tiny RSS**\n\n**T**\n\nhere’s a noticeable trend \n\nthat is almost tracking\
    \ \n\nthe trajectory of com-\n\nmand-line use, albeit a decade \n\nbehind: the\
    \ move away from \n\ncloud-hosted services. This \n\nmay be because many of us\
    \ \n\nnow have enough network ca-\n\npacity at home, are willing to \n\nset up\
    \ our own servers, or per-\n\nhaps pay for a micro-service \n\nsite for running\
    \ a few web appli-\n\ncations. But there are signifi-\n\ncant advantages in going\
    \ your \n\nown way, not least of which is \n\nknowing you’re in control of \n\n\
    both your own data and your \n\nown support destiny. It frees \n\nyou of any nagging\
    \ doubts \n\nabout privacy, or a service being \n\nwithdrawn, and puts you back\
    \ \n\nin control of your personal infor-\n\nmation. It’s why wallabag is so \n\
    \npopular for caching web pages, \n\nand why Tiny Tiny RSS is still \n\ngoing\
    \ strong after 17 years.\n\nGood websites still offer their \n\nown RSS feeds,\
    \ and these will \n\ncontain their story updates along \n\nwith a synopsis of\
    \ each story \n\nand a corresponding link. You \n\nthen use a feed reader such\
    \ as \n\nTiny Tiny RSS to track those up-\n\ndates across your own organized \n\
    \nlibrary of subscribed RSS feeds. \n\nBut Tiny Tiny RSS is a self-hosted \n\n\
    RSS aggregator as well as being \n\na web-based RSS reader and it \n\nperforms\
    \ the same job as the \n\nwonderful but entirely defunct \n\nGoogle Reader, or\
    \ the still alive \n\nFeedly. Tiny Tiny RSS is a server \n\nfor collecting your\
    \ feeds and for \n\nsynchronizing their read-state \n\nacross your RSS clients,\
    \ but it’s \n\nalso a brilliant place to consume \n\ncontent. After so many years\
    \ in \n\ndevelopment, the reading web \n\ninterface is better than most desktop\
    \ clients. There are \n\nplugins and themes, a two or three-pane view for reading\
    \ \n\narticles alongside the article list, automatic filtering, a \n\nJSON API,\
    \ deduplication, great feed management, and of \n\ncourse, the ability to import\
    \ and export OPML lists of your \n\nalready curated list of RSS feeds. If you’ve\
    \ already set up \n\na server to run wallabag, for example, running this along-\n\
    \nside is the perfect augmentation.\n\n**Project Website**\n\nhttps:// tt-rss.\
    \ org\n\nTiny Tiny RSS is a brilliant RSS feed aggregator and reader you can \n\
    \neasily install and run yourself.\n\n**Storage monitor**\n\n**erdtree**\n\n**T**\n\
    \nhere are many disk usage \n\ntools, so it requires some-\n\nthing special to\
    \ pull me \n\nout of my du dependency stupor. I \n\nlooked at one called Parallel\
    \ Disk \n\nUsage recently, because it was \n\nvery quick, and erdtree is just\
    \ as \n\nquick and takes a different UI ap-\n\nproach. Where Parallel Disk \n\n\
    Usage outputs a bar graph show-\n\ning usage for every directory, \n\nerdtree’s\
    \ erd command will in-\n\nstead collate totals in the same \n\nway du does. It\
    \ also offers many \n\nof the same command-line op-\n\ntions as du, including\
    \ a human-\n\nreadable option and long output, \n\nso it’s a great drop-in replacement\
    \ \n\n– and it does all this while looking \n\nmuch better than du. The default\
    \ \n\nlayout takes inspiration from an-\n\nother perennial command, tree, \n\n\
    with ASCII lines branching off \n\nfrom directories to subdirectories. \n\nThe\
    \ number of levels is configu-\n\nrable, as is the wonderful use of \n\ncolor\
    \ and accompanying icons \n\nfor every node in the output. The \n\ntree view can\
    \ be inverted, or dis-\n\nabled entirely, and looks fantastic \n\nin 256 colors.\n\
    \nBut it’s the configurability of \n\nerdtree that makes such a differ-\n\nence,\
    \ either from the command-\n\nline arguments or from the op-\n\ntional configuration\
    \ file. It will even \n\nparse .gitignore files when decid-\n\ning which files\
    \ and folders to show, \n\na feature not seen outside of Git it-\n\nself, and\
    \ if that isn’t enough, regu-\n\nlar expressions and glob patterns \n\ncan be\
    \ used for file and directory \n\nsearching and matching. There’s \n\njust as\
    \ much control over sorting \n\ntoo, from reverse names to altera-\n\ntion dates,\
    \ and support for storage \n\nvalues with either binary or SI prefixes. All this\
    \ is done at in-\n\ncredible speed, thanks to configurable multithreading, and\
    \ \n\nyou can scale your CPU usage according to the demands of \n\nyour filesystem.\
    \ This might be useful if you’re streaming or \n\nin a video meeting at the same\
    \ time, for instance, and solves \n\nthe biggest problem with du and tree, which\
    \ was their lack \n\nof speed. Either way, creating an alias from du to erd makes\
    \ \n\na great command-line upgrade.\n\n**Project Website**\n\nhttps:// github.\
    \ com/ solidiquis/ erdtree\n\nThe erdtree executable is **erd**, which can be\
    \ typed quickly, but \n\nnot as quickly as it can generate deep-level output after\
    \ analyzing \n\nyour storage.\n\nFOSSPICKS\n\n**LINUX **VOICE\n\nSEPTEMBER 2023\
    \ \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\n82"
- md: "\n![](img/8db7a58bef2f490a3db3c4fd35de2457_82_0.png)\n\n**JSON viewer**\n\n\
    **fx**\n\n**J**\n\nJSON is the JavaScript Object Notation format, used by JavaScript\
    \ programmers to describe data structures within an easily readable text format.\
    \ Of course, JavaScript programmers still use JSON, but the format long ago escaped\
    \ the confines of web-based client-side programming to become a “commonly used\
    \ data interchange format,” alongside YAML, XML, and even CSV. As a result, many\
    \ API and command-line tools, alongside vital infrastructure such as journald,\
    \ can output text-based data as JSON so that it can more easily be interpreted\
    \ by another programming language while still making sense to humans. This is\
    \ great for machines, but not so brilliant for humans, and it’s the life of the\
    \ JSON-loving human that this brilliant little utility wants to make easier.\n\
    \nThe problem with JSON is that while it is readable as raw text, humans find\
    \ it hard to navigate. Like JavaScript and many other programming languages, the\
    \ hierarchy and scope of data in a JSON file is represented by curly brackets,\
    \ double-quotes, and a variety of other elements. A JSON-aware editor can make\
    \ this much easier to parse, but so too can tools such as jq and fx. And while\
    \ jq can convert JSON into something easier to read, fx makes it easier to read\
    \ and easier to navigate interactively. It can do this either with JSON piped\
    \ into it or from a file, and when the JSON is opened you initially see only the\
    \ global enclosing brackets for the entire file. Press cursor-right to open this,\
    \ and cursor-down to navigate into the next section. In this way, you can unfold\
    \ and fold the hierarchy to better see how everything fits together. You can search\
    \ too with /** and *n* and *N* keys for next and previous. It’s quick and easy,\
    \ and it also reveals how much more useful JSON is than flat text – even to humans.\n\
    \n**Project Website**\n\nhttps://github.com/antonmedv/fx\n\nThe **fx** command\
    \ uses a theme to display the JSON output, and themes are easily created and readily\
    \ shared.\n\n**Command-line search**\n\n**codespelunker**\n\n**T**\n\nThe fzf\
    \ fuzzy finder has changed the way many of us search for things from the command\
    \ line. In particular, it helps when you can’t remember exactly what it is you’re\
    \ looking for or can only remember a certain path. It works well on its own like\
    \ this, but it works much better when it’s integrated into your shell for file\
    \ and history search, or within an editor such as Vim for searching documents.\n\
    \nCodespelunker, run from the command line as cs and easily installed via go install,\
    \ is another great alternative and is better suited to finding things within files\
    \ without resorting to piping things through grep. This is because it’s more like\
    \ both a Google search and search result page embedded into your console for local\
    \ searching, and, as with Google, it’s the perfect solution when you can’t remember\
    \ exactly what it is you’re looking for.\n\nCodespelunker will search through\
    \ the contents of any text file located at or below your current file system location.\
    \ It’s been designed to work best with code, but it’s equally happy with any text.\
    \ It does this live, rather than caching an index, and yet remains incredibly\
    \ quick and reactive. The TUI-based command line user interface also makes it\
    \ easy to use. Typing cs on its own will open the interactive search, which is\
    \ a little like fzf for the contents of your documents. Typing a search term will\
    \ start to display results and you can use a rank command to adjust the order\
    \ they’re listed while you’re within the search. Rather than typing cs on its\
    \ own, you can provide a search term as an argument, and the non-interactive output\
    \ will list the results with the search terms highlighted. There are options for\
    \ exact searches, fuzzy searches, and negating two searches with NOT. You can\
    \ even use regular expressions, and there are further arguments for including\
    \ and excluding directories. It works brilliantly, and is significantly easier\
    \ to type than cat | grep | fzf.\n\n**Project Website**\n\nhttps://github.com/boyter/cs\n\
    \nIf search results on the command line aren’t enough, **cs** also offers an HTTP\
    \ mode you can use locally through a web browser.\n\nFOSSPICKS\n\n**LINUX **VOICE**\n\
    \nLINUX-MAGAZINE.COM\n\nISSUE 274\n\nSEPTEMBER 2023\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_83_0.png)\n\
