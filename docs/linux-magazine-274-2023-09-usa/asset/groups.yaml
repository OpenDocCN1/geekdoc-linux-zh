    ![](img/8db7a58bef2f490a3db3c4fd35de2457_89_0.png)


    上方的点是一个固定点；它的垂直位置不会改变。要定义第二个点，请将曲线底部/左半部分的稍微向下拖动。


    完成后，你可能需要调整单个滤镜掩罩的设置。要这样做，右键点击滤镜掩罩层，并在右键菜单中选择第一项*属性*（Properties）。滤镜的设置选项现在就会出现。


    现在我将使用 G’MIC 滤镜集合进行一些校正，该集合作为 Krita 的扩展模块可用。当前的 AppImage 版本已内置了它们。然而，在许多 Linux
    发行版中，你必须事后安装 G’MIC。


    ## 镜头校


    首先纠正损坏图像并导致地平线呈弧形的镜头畸变。要做到这一点，首先创建一个显示可见图像的新图，即你已经应用了其他校正的背景层：点击 *图层* | *新建* |
    *从可见性新建图*。确保在图层对话框中选中了顶层。现在软件创建了一个覆盖所有之前存在层的新层。将其命名为 *畸变*（Distortion），并在图层面板中点击它进行选中。然后开始
    *滤镜* | *启动 GMIC-Qt*。


    程序的用户界面分为三个部分。在中间一个较窄的列中，你可以看到可用效果列表。为新的滤镜掩罩层分配一个名称（例如，*饱和度*）。


    最后，我将在第一编辑阶段结束时为图像添加一些对比度。你也可以使用*颜色匹配*（Color Matching）滤镜作为滤镜掩罩来实现。增加对比度无非让暗像素变暗、亮像素变亮。这就是为什么曲线看起来像
    S 形。


    然而，我的示例在严格意义上不需要对比度增强，因为天空和波浪已经足够亮了。真正的 S 曲线会让天空变得太亮。其想法是在颜色匹配曲线上定义两个点，将曲线分为三个等长区域。


    **图 9：** 镜头畸变可以通过 G’MIC *畸变镜头*（Distort Lens）滤镜轻松纠正。


    **图 8：** 在第一编辑阶段结束，我们使用 HSV 滤镜掩罩增加了色彩饱和度。


    2023年9月第274期 LINUX-MAGAZINE.COM 90 教程 – KRITA LINUX **声音之声**


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_90_0.png)


    左侧是预览图像，右侧你可以看到当前选中滤镜的设置。在顶部的搜索框中输入 *distort*。包含该术语的效果将出现在出现在效果列表中，包括*畸变镜头*（Distort
    Lens）（图 9）。


    **图 10：** G’MIC *Iain 的快速去噪*（Iain’s Fast Denoise）滤镜为用户提供了仅减少色彩噪声的能力。


    **图 11：** G’MIC 还提供了一个消除色差的滤镜。


    LINUX-MAGAZINE.COM 第274期 2023年9月 91 教程 – KRITA LINUX **声音之声**


