    \n**Rymdport**\n\n**W**\n\nWe looked at the brilliant Magic Wormhole \nsome time\
    \ ago. It’s a command-line tool that sets up \nan encrypted peer-to-peer file\
    \ \ntransfer between your machine \nand any target machine out in \nthe wilds\
    \ of the Internet. For this \nto work, a network’s NAT needed \nto be negotiated,\
    \ as did any fire-\nwalls, and the connection itself \nneeded to find a way to\
    \ talk to \nthe destination. But Magic \nWormhole handled all of this \ntransparently,\
    \ with users needing \nto do little more than type send \nfollowed by a path to\
    \ a file, or \nreceive, followed by a code the \nsender is shown. It was brilliant,\
    \ \nand still is, for one-off ad-hoc \ntransfers. But Magic Wormhole \nstill requires\
    \ a little command-\nline knowledge. While this isn’t \nsomething that will likely\
    \ bother \nLinux users, it may trouble Win-\nd and macOS users trying to \naccept\
    \ a transfer.\n\nThis is where the weirdly \nnamed Rymdport can help. It’s \n\
    an implementation of the same \nwormhole protocol wrapped in-\nside a graphical\
    \ user-interface. \nIt was even called wormhole-gui \nfor a while, but the project\
    \ has \ndiverged to use a native Go im-\nplementation of the protocol. \nThis\
    \ allows it to compile na-\ntively and run without any de-\npendencies on many\
    \ different \nplatforms, so you can even link \nto the binaries if you have con-\n\
    t you need to send a file too \neasily. The application is easier \nto use than\
    \ the command-line \nversion, with tabs for sending \nand receiving files and\
    \ file \nrequesters instead of tab complete for selecting files \nand directories\
    \ to transfer. Its best feature is being able \nto show multiple transfers at\
    \ the same time, with prog-\nress bars for each transfer to show how it’s going.\
    \ The \nlatest version creates a QR code to encode the code \nword. It’s a great\
    \ solution for any time you need to \nsend a file to someone, and a good upgrade\
    \ over the \noriginal Magic Wormhole.\n\n**Project Website**\n\nhttps://github.com/Jacalz/rymdport\n\
    \nRymdport is a 6MB self-contained download that runs on Linux, \nFreeBSD, Windows,\
    \ and macOS.\n\n**Audio metadata editor**\n\n**tone**\n\n**I**\n\nImage metadata\
    \ is common, \nespecially for photos. Most \nphoto processing applica-\ntions\
    \ will have a panel showing \nexposure, focus, date, location, \nand dozens of\
    \ other attributes, all \nof which are written into the file \nas metadata when\
    \ a photo is \ntaken. Metadata like this can even \nbe viewed and edited on the\
    \ com-\nmand line, with utilities such as \nexiftool. But we don’t often con-\n\
    sider that audio files include a \nsimilar set of data related to their \nproduction.\
    \ This data includes \nalbum names, track sequence, re-\ncording data, artists,\
    \ and many \nother optional attributes. A few of \nthese might be displayed by\
    \ your \naudio player of choice, but it most \nlikely won’t let you edit this\
    \ data. \nThe tone command-line tool \nhelps with this. With tone, you can \n\
    parse audio metadata in bulk and \nedit the tags they contain. It’s per-\nfect\
    \ for ensuring your favorite \nmusic is properly tagged, and \nthat metadata in\
    \ the audio from \ndifferent sources remains consis-\ntent. It has no dependencies,\
    \ and \nit is ideal for running occasionally \non whatever computer is hosting\
    \ \nyour music collection.\n\nThere are two modes of opera-\ntion. The dump mode\
    \ will output the \nmetadata for the majority of audio \nfiles you throw at it,\
    \ from MP3 to \nFLAC. It can do this formatted for \nthe command line – or formatted\
    \ \ninto something more program-\nmatically useful with JSON. Argu-\nments can\
    \ be used to include \nwhole directories, to exclude spe-\ncific types, or even\
    \ query a specific \nattribute through JSON. It’s also a \nquick and easy way\
    \ to see what \nan audio file is all about if you can’t \ntell from its filename.\
    \ You can also \nuse tone as a tool to populate your \nown collection spreadsheet\
    \ or da-\nabase. To balance the dump mode, \nthere’s a tag mode, which lets you\
    \ set most commonly used \naudio tags, including genre, artist, series, part,\
    \ and title. A \nclever auto-import option lets you set these values with \nstrings\
    \ taken from the filesystem path, and you could easily \nsubvert this with a script\
    \ to perform far more advanced op-\nerations. This makes tone the ideal tool to\
    \ use when you find \nyourself with a complex audio metadata problem.\n\n**Project\
    \ Website**\n\nhttps://github.com/sandreas/tone\n\nUse **tone** to quickly retrieve\
    \ or set audio file metadata from the com-\nmand line, or from within your own\
    \ scripts.\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023\n\nFOSSPICKS\n\
