    \ can see the list of available \n\nassign a name to the new filter mask layer\
    \ (e.g., \n\n*Saturation)*.\n\nFinally, I’ll add some contrast to the image at\
    \ the \n\nend of the first editing phase. You can also do this \n\nwith the *Color\
    \ Matching* filter as a filter mask. In-\n\ncreasing the contrast means nothing\
    \ more than \n\ndarkening the dark pixels and brightening the light \n\npixels.\
    \ This is why the curve looks S-shaped.\n\nHowever, my example does not need contrast\
    \ \n\nenhancement in the strict sense, because the sky \n\nand the waves are bright\
