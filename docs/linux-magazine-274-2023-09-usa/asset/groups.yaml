    ## Kernel News


    “The Designated Movable Block mechanism allows ZONE_MOVABLE memory to be located
    on the low memory controller to make it easier for user space allocations to land
    on the low memory controller. If ZONE_MOVABLE is only placed on the low memory
    controller then user space allocations can land in ZONE_NORMAL on the high memory
    controller, but only through fallback after ZONE_MOVABLE is sufficiently depleted
    of free memory which is just the reverse of the existing situation. The Designated
    Movable Block mechanism allows ZONE_MOVABLE memory to be located on each memory
    controller so that user space allocations have equal access to each memory controller
    until the ZONE_MOVABLE memory is depleted and fallback to other zones occurs.”


    At a certain point, Mel did acknowledge, “Ok, I did misunderstand at the time
    that ZONE_MOVABLE would be split between the controllers to improve interleaving
    of user accesses.”


    The discussion got a bit technical and a bit heated – at one point David Hildenbrand
    remarked, “Adding feature A because people don’t want to (! whoever the ‘people’
    are) enable feature B? I hope I don’t have to tell you what I think about statements
    like this :)” To which Florian Fainelli replied:


    “It is not just that NUMA is not wanted, it is also not a great fit, the ARM CPU
    cluster and most peripherals that Linux cares about do have an uniform memory
    access to the available DRAM controllers/ DRAM chips.


    “Only a subset of the peripherals, especially the real-time and high bandwidth
    ones like video decoders and displays that may not be uniformly accessing DRAM.
    This stems from the fact that the current implementation of movablecore requires
    all of the ZONE_MOVABLE memory to be located at the highest physical addresses
    of the system when CONFIG_NUMA is not set. Allowing the specification of a base
    address allows greater flexibility on systems where there are benefits.”


    He added, “I don’t believe this is really about trying to optimize the performance
    of a specific application as much as trying to prevent overall system performance
    degradation from underutilized memory bandwidth.” Elsewhere he remarked, “the
    approach taken here is very much a ‘poor man’s’ approach that attempts to improve
    things without requiring the ‘heavy lifting’ required for a more complete solution.”


    He further explained:


    “What is of interest to Broadcom customers is to better distribute user space
    accesses across each memory controller to improve the bandwidth available to user
    space dominated workflows. With no ZONE_MOVABLE, the BCM7278 SoC with 1GB of memory
    on each memory controller will place the 1GB on the low address memory controller
    in ZONE_DMA and the 1GB on the high address memory controller in ZONE_NORMAL.
    With this layout movable allocation requests will only fallback to the ZONE_DMA
    (low memory controller) once the ZONE_NORMAL (high memory controller) is sufficiently
    depleted of free memory.


    “Adding ZONE_MOVABLE memory above ZONE_NORMAL with the current movablecore behavior
    does not improve this situation other than forcing more kernel allocations off
    of the high memory controller. User space allocations are even more likely to
    be on the high memory controller.


    that the memory controller(s) on the System-on-Chip we work with have a star topology
    and they schedule the accesses of each DRAM client (CPU, GPU, video decoder, display,
    Ethernet, PCIe, etc) differently in order to guarantee a certain quality of service.”


    There was no resolution during the discussion. It seems that the advocates of
    Designated Movable Blocks feel that this feature is simply an extension of existing
    behaviors, some of which were coded by the very people criticizing those behaviors
    now. On the other hand, the critics of Doug’s patch feel that the underlying thing
    Doug wants to enhance should really go away entirely, or at least should be redesigned
    to use the better and more generic NUMA approach.


    The interesting thing for me about this whole conversation is that it is fundamentally
    a debate between the better design (NUMA) versus the current reality (UMA). If
    I think about how Linus Torvalds comes down on these issues, it’s not clear at
    all that he favors one over the other. In many cases, yes, he’ll insist on the
    better design even if it means heaping a ton of work on people trying to implement
    one feature. On the other hand, sometimes the “better design” is a large thing
    that has no actual users while the current reality is some clean and easy to fix,
    and Linus will choose to go with the current reality. It’s unclear whether Doug’s
    patch would ever come to Linus’s attention – it seems that Mel is the gatekeeper
    in this particular case, having written the original code. But doesn’t seem like
    a clear decision, at least as far as this email discussion went.


