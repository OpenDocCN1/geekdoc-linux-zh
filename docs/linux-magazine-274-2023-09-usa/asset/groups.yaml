    它包含了指向广告服务的链接，以及指向广告提供者的跟踪 Cookie。这些深层链接并不指向 IP 地址，而是指向操作者的 DNS 名称或子域名。


    这意味着在解析了嵌入链接的 DNS 地址后，用户的浏览器本身会主动请求这些横幅和跟踪器。这正是 DNS 过滤大显用场之处：它使用一个针对不需要的 URL 的黑名单，并拒绝向客户端交付这些
    URL 的 IP 地址。过滤器 DNS 不会返回 IP 地址，而是直接返回 0.0.0.0。因此，浏览器甚至不会从互联网请求该集成的 URL。通常由广告横幅占据的空间将保持为空白，且跟踪器不会接收到来自客户端的任何反馈。但请注意：为了使
    DNS 过滤生效，客户端及其浏览器必须使用网络的默认 DNS 解析，而不能使用它们自己的 DNS 服务器和方法。


    ## 作为 DNS 过滤器的 Pi-hole


    作为目前讨论的方案的替代方案，Pi-hole 可以实时过滤掉针对不需要的 URL 的 DNS 请求，从而隐藏广告内容和跟踪器（图 1）。Pi-hole 是最流行的
    DNS 过滤器之一。正如其名，该工具最初是为树莓派（Raspberry Pi）设计的一个软件，但即使部署在大型网络中，在所有其他平台上运行得也非常稳定且快速。


    一些 IT 管理员不愿使用 Pi-hole，因为他们不想替换现有的 DNS 服务器并将其迁移到 Pi-hole。如果现有的 DNS 服务器解析本地地址和服务（如
    Kerberos），并且可能还集成了 DHCP 服务，情况就尤为如此。然而，由于 DNS 协议在代理转发方面没有问题，Pi-hole 的设置完全不需要替换现有服务；相反，它可以作为一种叠加层——即使在同一台机器上也是，如我的示例所示。


    我的设置使用了运行 RHEL 8 的应用服务器上现有的 dnsmasq 服务器。该服务通过 DHCP 为局域网提供 IP 地址，允许物理和虚拟系统通过网络进行
    PXE 启动，并解析本地域名。dnsmasq 服务优先使用公共的 Quad9 服务 `9.9.9.9` 作为其上游 DNS。与位于 8.8.8.8 上的 Google
    开放 DNS 服务不同，Quad9 不会记录所有包括源 IP 地址在内的传入 DNS 请求。


    除了 dnsmasq 服务外，应用服务器现在还通过 Podman 容器运行着 Pi-hole。原则上，在同一台机器上运行两个 DNS 服务器有两种方案。如果
    Pi-hole 运行在没有独立 IP 地址的容器中，则现有的 dnsmasq 服务必须切换到 53 以外的端口。或者，你可以让 Pi-hole 容器运行在桥接网络上，从而拥有自己的
    IP 地址。对于这个示例，我选择了第二种方法，因为我的应用服务器本身已经使用了许多带有独立 IP 地址的其它 Podman 容器。


    ## 创建网络桥接


    第一步是在以后运行 Pi-hole 容器的 Linux 服务器局域网适配器上设置网络桥接。通常这个桥接名为 `br0`。它还承载了物理应用服务器的静态 IP
    地址。如果你想桥接服务器的主局域网适配器，通常需要在网络运行时进行。当然，这可能会出错并简单导致服务器与局域网断开。但一个小小的脚本和 Linux NetworkManager
