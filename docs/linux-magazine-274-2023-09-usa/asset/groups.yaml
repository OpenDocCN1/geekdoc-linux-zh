    ## **56 Topgrade**


    Topgrade detects all the package managers installed on a system and executes them
    one by one at the command line.


    ## **58 Tipi**


    Tipi gives you complete control of more than 100 applications and services. A
    mouse click is all it takes to install the apps.


    ## **62 Greenhouse Control**


    You can safely assign some greenhouse tasks to a Raspberry Pi Pico W, such as
    controlling ventilation, automating a heater, and opening and closing windows.


    ## **68 TensorFlow-KI and Rasp Pi**


    You don’t actually need a powerful computer system to use AI. We show what it
    takes to benefit from AI on the Raspberry Pi and what tasks the small computer
    is suitable for.


    ## **73 Welcome**


    This month in Linux Voice.


    ## **75 Doghouse – Trademarks**


    A trademark verifies to customers that a product really is yours, which also helps
    them trust they’ll get the quality associated with your brand.


    ## **76 Pi-hole**


    Supporting browser plug-ins, network-based DNS blockers like Pi-hole help protect
    you against online tracking and unwanted content.


    ## **80 FOSSPicks**


    This month Graham looks at Qtractor 0.9.34, tone, erdtree, Tiny Tiny RSS, codespelunker,
    KOReader, Jumpy, and more!


    ## **86 Tutorial – Krita**


    Few users are aware that Krita, the popular open source painting program, is also
    great for editing photos.


    ## **The Best of Small Distros**


    Nowadays, all the attention is on big, enterprise distributions supported by professional
    developers at big, enterprise corporations, but small distros are still a thing.
    If you’re shopping for a Linux to run on old hardware, if you just want a simpler
    system that is more responsive and less cluttered, or if you’re looking for a
    special Linux tailored for a special purpose, you’re sure to find inspiration
    in our look at small and specialty Linux systems.


