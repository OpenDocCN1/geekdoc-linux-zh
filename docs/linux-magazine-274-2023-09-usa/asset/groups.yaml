- md: "\n![](img/8db7a58bef2f490a3db3c4fd35de2457_47_0.png)\n\neffective way to learn\
    \ the MathLex syntax.\n\nOne thing I found confusing in the demo was that some\
    \ markers (delimiters in MathLex terminology) can be written with or without colons.\
    \ In handwritten math, for example, the absolute (i.e., without a positive or\
    \ negative sign) of some variable is written by placing that variable between\
    \ two vertical bars. Unsurprisingly, MathLex lets you specify the absolute value\
    \ of a variable by wrapping it inside pipe characters (e.g., |X|). For MathLex,\
    \ however, even |:X:| is a perfectly valid syntax. The only thing you cannot do\
    \ is mix the forms (i.e., you cannot write |:X|). Just remember this, and everything\
    \ will be fine.\n\n## Using MathLex on the Web\n\nListing 1, the source code for\
    \ the custom MathLex page shown in Figures 7, 8, and 9, outlines what you need\
    \ to easily use MathLex on any web page. To get the working MathLex interface\
    \ shown in Figure 7, I copied the relevant part of the demo’s index.html file\
    \ into an empty file, saved it with an .html extension, and rewrote the header\
    \ and some other strings.\n\nPlease note in Listing 1 that I shortened the lengthy\
    \ URLs for the font and JavaScript libraries loaded in lines 6, 8, and 35 for\
    \ readability. The actual URLs may differ depending on the MathLex version you\
    \ use.\n\nRegarding the libraries, there are two things to pay attention to in\
    \ Listing 1. First, you must include the whole header of the demo index.html file\
    \ (lines 1 to 11), but do not shorten the URLs as I did for readability.\n\nSecond,\
    \ take all the files that contain the MathLex stylesheets, as well as its actual\
    \ source code from the demo folder, and copy these alongside your HTML page. I\
    \ used the April 2021 version of MathLex for this article, so in Listing 1 those\
    \ files are the stylesheets called in lines 7 and 9 and the JavaScript files,\
    \ mathlex.js and index.js (lines 34 and 36). If you use a newer version, please\
    \ check the header and bottom of the index.html file for other files you should\
    \ include.\n\nThe rest of Listing 1 is easy to understand by comparing it with\
    \ Figures 7 through 9. Line 12 produces the “Let’s try MathLex for Linux Magazine!”\
    \ header, and lines 16 to 18 produces the text entry area, initially filled with\
    \ the placeholder text shown in line 17 where you can write your formulas (Figure\
    \ 8). The same formulas are rendered in the div element of line 20, whose initial\
    \ value is also customizable by changing the text inside curly brackets.\n\nFinally,\
    \ the three pairs of div elements starting on lines 22, 26, and 30 are the HTML\
    \ markup that renders (together with their headers) the three boxes where MathLex\
