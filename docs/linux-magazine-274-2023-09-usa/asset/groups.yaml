    \ have kept data, there have been people who have wanted to see it and \n\npeople\
    \ who have wanted to control it. A new generation of tools, policies, and advocates\
    \ seeks \n\nto keep the data free, available, and in accessible formats. This\
    \ month we bring you snapshots \n\nfrom the quest for open data.\n\n**On the DVD:**\
    \ xubuntu 23.04 Desktop and Fedora 38 Workstation\n\n**#273/August 2023**\n\n\
    **Open Data**\n\nOn the Internet, you don't have to wait for permission to speak\
    \ to the world. Podcasting lets you \n\nconnect with your audience no matter where\
    \ they are. Whether you're in it to build community, \n\nraise awareness about\
    \ your skills, or just have some fun, the tools of the Linux environment \n\n\
    make it easy to take your first steps.\n\n**On the DVD:** Linux Mint 21.1 Cinnamon\
    \ and openSUSE Leap 15.5\n\n**#271/June 2023**\n\n**Smart Home**\n\nSmart home\
    \ solutions will save you time and energy – and, did I mention, you can amaze\
    \ your \n\nfriends. This month we show you how to take charge of your home environment\
    \ with smart \n\ndevices and open source automation software.\n\n**On the DVD:**\
    \ SystemRescue 10.0 and Linux Lite 6.4\n\n95\n\nSERVICE\n\nLINUX-MAGAZINE.COM\
    \ \n\nISSUE 274 \n\nSEPTEMBER 2023\n\nBack Issues"
