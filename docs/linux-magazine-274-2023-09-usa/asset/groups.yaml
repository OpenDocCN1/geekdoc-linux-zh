    ## FOSS//Security Campus


    ## 门票现已出售！


    ## 安全至上


    2023年9月26日-29日，柏林


    FOSS Security Campus 包括两天的全天及多天培训课程，随后是期两天的会议。FOSS Security Campus 是一个关注开源领域 IT
    安全的新型活动。主题包括开源供应链、安全流程、漏洞披露、漏洞赏金、设计安全、风险缓解等。


    访问 foss-security-campus.de 了解更多*


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_38_0.png)


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_39_0.png)


    维护者意识到了这种可能性，并让你能够轻松创建适用于你需求的 SystemRescue 解决方案。本文解释了如何创建一个自定义的 SystemRescue 环境。


    ### 定制化的性


    两个现实场景需要创建基于 SystemRescue 的自定义计算机崩溃恢复工具。无论是由于人为错误、软件漏洞，还是硬件老化导致，工作站和服务器最终都会故障。因此，每位系统管理员都应该拥有一个数字急救箱，以便尽快让故障的系统恢复工作状态。为了这项任务，我将
    SystemRescue 保存在我的工具箱中。


    SystemRescue（以前名为 SystemRescueCd）是一个 Live Linux 发行版，旨在修复损坏的系统并处理许多维护任务。它包含了恢复删除的文件、修复损坏的启动器、修复不一致的文件系统等工具。默认安装的程序集令人印象深刻（见表
    1 的包含工具示例，或访问 SystemRescue 网站 [1] 获取完整列表）。如果你的某台工作站或服务器无法启动，你只需启动 SystemRescue
    DVD 或 USB 盘，即可在几分钟内获得一个完整的恢复环境。通过 SystemRescue，你可以修复受损的启动器、分区表或文件系统。更重要的是，你可以从故障计算机中提取文件，并安全地将其保存到
    USB 连接的硬盘或通过网络传输。


    尽管 SystemRescue 的功能set非常强大，但你最终会发现默认功能无法满足你的需求。


    ### 在 SystemRescue 中添加脚本和工具


    **通过 SystemRescue，你可以做的远不止于修复损坏的系统。通过添加工具和脚本，你可以创建一个满足你需求的自定义恢复环境。**

    *作者：Rubén Llorente*


    | 工具 | 描述 |

    | :--- | :--- |

    | GNU ddrescue | 从带有坏块的设备（如损坏的硬盘）中复制数据 |

    | FSArchiver | 保存和恢复文件系统镜像 |

    | OpenSSH server | 从远程机器控制恢复环境，并轻松地在故障计算机之间传输文件 |

    | Minicom | 连接到串口控制台 |

    | cryptsetup | 访问 Linux 加密磁盘 |

    | chntpw | 重置 Windows 密码 |

    | TestDisk | 恢复丢失的分区并修复引导区 |

    | PhotoRec | 恢复意外（或其他原因）删除的文件 |

    | wipe | 安全删除数据 |

    | Rclone | 将文件传输并同步到多个存储系统，包括 FTP 和 Nextcloud |


    **表 1：SystemRescue 工具（不完全列表）**


    主图 © Maksym Yemelyanov, 123RF.com


    40

    深度解析

    2023年9月

    第 274 期

    LINUX-MAGAZINE.COM


    定制 SystemRescue


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_40_0.png)


    最常见的场景是需要一个 SystemRescue 默认未包含的工具。由于 SystemRescue 是基于 Arch 的，因此它可以访问 Arch 的仓库。如果你需要任何工具，可以像在普通操作系统上一样，直接在你的恢复环境中安装它。在实际操作中，你可以在运行的
    SystemRescue 环境中使用 `pacman` 包管理器。例如，如果你更倾向于使用 Emacs 而不是默认的 Vim，可以使用以下命令安装：


    # pacman -Sy

    # pacman -S emacs


    通过这种方式安装的包将放在 RAM 中的文件系统覆盖层中。这些包仅对恢复环境可用，不会触及你正在修复的计算机的硬盘。缺点是，你每次启动 SystemRescue
    都必须手动安装这些包，因为用 `pacman` 安装的包不会在重启后保留。因此，如果你经常使用某个应用程序，或者预期将在无法访问 Arch 仓库的情况下执行维护任务，你就需要将所需的包包含在你自定义的
    SystemRescue 版本中。


    另一个需要自定义 SystemRescue 的场景是允许运行自定义脚本、在没有管理员干预的情况下自动执行任务的恢复环境。例如，办公室的一台服务器故障了，而系统管理员不在城，需要系统管理员指导一名未经培训的员工从架子上取一张恢复
    DVD，将其放入服务器托盘中，重启，并让 SystemRescue 为系统管理员提供一个 shell。（这结果可能不太妙）。


    ### USB 还是 DVD？


    创建自定义 SystemRescue 最简单的方法是使用备用存储（backing store）将其安装到 USB 盘上，备用存储是 USB 盘上用于写入更改的区域。你可以将带有备用存储的
    SystemRescue 安装到 USB，启动它，安装所有需要的包，配置所需的脚本，然后关机。你的更改将在重启后保留。


    虽然这种方法可行，但我个人出于几个原因，会避免将 USB 盘用于恢复环境。DVD 提供了一个合理的保证，确保你每次启动时都能获得一个纯净的环境，这很有价值。（你弟弟更有可能借用
    USB 并替换掉你的宝贵数据。）


    由于我希望将环境存储在只读介质上，无法使用备用存储。相反，我将创建一个包含我自定义软件和配置的 ISO 镜像，然后将其刻录到 DVD。


    ### 添加 SSH 访问和持久密钥


    为了说明如何在 DVD 上包含附加文件和自动启动的服务，我将以远程办公室的一批服务器举例。其中一台服务器故障了，系统管理员需要让它启动 SystemRescue
    并提供一个 SSH shell 以便从家里连接。


    虽然 SystemRescue 包含了 SSH 服务器，但默认情况下它是无法访问的，原因有两个：首先需要配置正确的密码，并且默认防火墙阻止了入站 SSH 连接。为了解决这个问题，你需要创建一个自定义的
    SystemRescue 镜像，执行以下操作：


    - 设置密码以允许通过 SSH 登录

    - 移除防火墙

    - 使用持久的 SSH 指纹集（因为我想在远程连接时验证 SSH 服务器的身份）


    这种自定义的 SystemRescue 镜像将允许高级系统管理员指导机房的初级系统管理员启动 SystemRescue，从而允许管理员进行连接。


    图 1：解压后的 SystemRescue 镜像：自定义配置文件可以放在 **sysrescue.d** 目录下，SystemRescueModules 放在
    **sysresccd** 目录下。


    **图 2：SystemRescue 在启动时接受作弊代码（cheat codes）以启用或禁用功能。除其他功能外，作弊代码允许你为恢复环境设置 root密码并启用或禁用
    SystemRescue 的防火墙。**


    '
