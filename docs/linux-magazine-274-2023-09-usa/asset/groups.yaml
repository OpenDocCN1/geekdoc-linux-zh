  mdcn: '

    如果显示器的色域比 sRGB 更大，请调整底部*色彩管理*（Color Management）组中的*工作空间*（Workspace）设置（图2所示）。在我看来，这里使用
    *AdobeRGB* 或 *WideGamut*似乎是合理的——不过，仅当显示器支持远大于 Adobe RGB 的色域时，才使用 *WideGamut*。


    在第一组*去马赛克*（Demosaicing）中有一个有趣的项目是*质量*（Quality）设置，你可以在此处指定 Krita 如何去像素化（即在单个颜色通道中添加缺失的像素）。默认设置似乎并不完美，因为它会产生不必要的柔化图像。只有当图像噪声过多，或者你打算之后需要增加亮度或对比度时，它才可用。当然，这会再次产生噪声。为了让照片曝光合理且噪声不过大，你可能想要使用
    *AMaZE*。你可能想尝试不同的去马赛克算法，看看哪一个最适合特定的照片。更改设置后，点击底部的*更新*（Update）并在右侧预览窗口中检查结果。


    在*白平衡*（White Balance）组中，你不仅会找到此项的设置，还会找到曝光补偿和高光重建（即最亮、可能过曝的图像区域）的预设。默认的*相机*（Camera）设置通常适用于白平衡。如果不是，尝试*自动*（Automatic）设置或尝试手动设置白平衡。


    然而，结果无法在预览窗口中进行很好的判断，因为在大多数屏幕上，100% 视图仅显示图像的一小部分。确保取消勾选*自动亮度*（Automatic Brightness）。等你之后看到整个图像时，调整起来会更容易。


    只要照片中有过曝区域，就可以尝试实验*高光重建*（Tip Reconstruction）旁边的设置。*混合*（Blend）和*重建*（Rebuild）方法在这里似乎很有趣；*混合*也为普通照片提供了一个很好的默认设置。你可以保留*修正*（Corrections）组中的设置。最后，按*确定*（OK）在
    Krita 中打开照片。


    ## 图像设置


    在程序窗口中，你将在中心看到一个巨大的预览窗口。在顶部，你会发现两个工具栏，允许你打开图像和更改画笔设置等。在左边缘有一个以工具栏形式存在的停靠对话框（图3）。它包含了重要的工具。


    **图2：** RAW 导入器让 Krita 加载相机原始数据。


    **图3：** 遵循 Photoshop 的范例，Krita 将编辑工具排列在大型预览窗口周围。


    然后，在图层窗口的左下角，点击加号按钮旁的小倒三角形。从菜单中选择*添加滤镜掩码*（Add Filter Mask）选项；这将启动滤镜掩码对话框。你将在左侧看到分为若干组的可用过滤器列表，以及右侧当前选择过滤器的设置选项。


    *色彩调整*（Color Adjustment）过滤器（图4）属于第一组*调整*（Adjust）。这实际上是曲线工具。你会看到一个矩形，分割着一条从左下角到右上角的上升对角线。图像的暗像素分配给矩形的左半部分，亮像素分配给右部分。要调亮整个图像，可以在对角线或曲线中间设置一个点并向上拖动。


    这种方法对中等亮度的像素增强比其他像素更多。但只需将照片亮到图像最亮区域达到所需的亮度即可。点击*确定*（OK）应用效果。


    你会在预览窗口的右侧找到其他可停靠的对话框。图层、概述、画笔设置和工具选项对于摄影师来说最重要的；工具选项的内容取决于所选的工具。在预览窗口下方的状态栏中，Krita
    显示了各种信息，包括图像尺寸和工作色彩空间。


    在使用 Krita 时，你需要完成的第一件事是复制背景层。如果可能，请在单独的图层上执行每一个编辑步骤。这有助于撤销或调整某个编辑步骤。


    在图层面板中，打开图像后，你会看到一个图层，*背景*（Background）。右键点击该图层并选择*复制图层*（Duplicate Layer）。现在你有一个可以操作的副本。


    要应用滤镜，进入*滤*（Filter）菜单并选择所需的效果。这将打开一个对话框，可以在其中调整参数。如果你只想对特定区域应用滤镜，可以使用滤镜掩码。右键点击图层并选择*添加滤镜掩码*。然后，使用画笔工具在掩码上涂画，以定义应用滤镜的位置。


    你还可以使用各种选择工具、画笔或裁剪工具来编辑图像。这些工具可在工具栏或停靠对话框中找到。


