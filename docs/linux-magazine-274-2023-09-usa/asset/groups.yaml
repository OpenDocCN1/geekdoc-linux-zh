    ![](img/8db7a58bef2f490a3db3c4fd35de2457_62_0.png)


    从特殊的 Python Thonny 集成开发环境 (IDE) 外部到控制器，为了完成这项工作，你需要将代码永久地传输到模块中。


    微控制器相比于带有文件系统的计算机，其优势在于其稳健性，没有因断电导致 SD 卡或硬硬盘损坏的风险。关闭电源时，你不需要先以定义的方式关闭控制器，只需按下电源开关即可。作为交换，在
    Pico 的情况下，你必须忍受较少的资源，且没有电池缓冲的实时钟。幸运的是，这种限制对我的控制系统并不重要，因为我设计了实时钟 (RTC) 来与互联网上的时间服务器交换信息。该项目还带有电擦除可编程只读存储器
    (EEPROM)，用于存储最新的设置值。


    ## Setup


    LCD 显示器和 RTC 通过 I2C 总线连接到 Pico，温度传感器通过 1-Wire 总线连接。晶体管连接在占用三个端口的 LED 上游。为了让 Pico
    控制如窗升器和加热器 (230V) 等大功耗设备，一个带有六输入的继电器板也被 Raspberry Pi 的 GPIO 控制。在这种用例中，Pico 位于一个外壳内并位于自己的小电路板上。所有其他组件（参见“零件列表”框）均通过插连接器连接，并放入
    DIN 顶帽轨外壳中（图 2）。这种设计的目的是让任何维修工作都易于管理，并能够轻松断开所有组件。


    5V 电源为整个电路供电，窗户电机需要 12V。在活动时，那里的电流需要较高。为了避免电源经常空闲，并消除对 DC/DC 转换器的需求，12V 电机电源仅在需要时通过继电器开启。大多数时候，我使用节约的
    5V 电路来节省费用。


    大部分硬件都安装在一个预制的外壳内——一个带有防水密封的保险丝盒（图 3）。我想利用 DIN 顶帽轨外壳，以便能够方便地排列和交换单个模块。任何无法放在断路器和电源单元旁边的都放置在顶帽轨的空外壳中（例如
    LCD 显示器、开关和 LED）。它们的外壳中留有足够的空间来安装 Pi、继电器板和其他电子设备，使其更靠后位置，从而实现了整洁的前面板。


    - Raspberry Pi Pico W

    - 带有 I2C 控制器的 LCD 面

    - 带有 AT24C32N EEPROM 的 DS1307 实时钟

    - DS18B20 温度传感器

    - 12V 电动窗升器 (2)

    - 6 路继电器板

    - LED 板

    - 晶体管、电阻

    - 5V 和 12V 电源（用于顶帽轨）

    - 自动断路器（用于顶帽轨）

