    DNS 记录的需求。另一个章节解释了如何将 Tipi 包含在 systemd 以及如何在计算机启动时启动它。


    **结论**


    Tipi 是我迄为止听过的最快的家庭服务器管理器。这对于家庭网络使用是事实，因为 Tipi 在几分钟后就能启动运行，而不需要额外的专业知识来安装应用。当涉及到从家庭网络外部访问时，网络和域名的基础知识是绝对关重要的。毕竟，你的服务器的安全正关重要。由于反向代理的可用，这些准备工作已经就绪。你只需要提供自己的域名，如果需要，还有子域名。一个
    DynDNS 服务就可以了，而且最好是具有通配符功能的类型，这样你只需要在应用安装期间简单指定子域名，而无需提前创建它们。


