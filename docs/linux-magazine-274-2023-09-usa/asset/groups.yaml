    \ Linux 系统中的密码存储在 `/etc/shadow` 中一样。要生成合适的密码哈希（图 3），使用以下命令：\n\n```bash\npython3\
    \ -c 'import crypt; print(crypt.crypt(\"$password\", crypt.SHA512))'\n```\n\n\
    并将 *$password* 替换为你选择的字符串。上述命令的输出可以直接像示例所示与 *rootpass* 作弊代码一起使用。注意，如果没有禁用，该命令将保存到你的\
    \ shell 历史记录中，并且在系统的运行进程列表中可见，如果你与其他用户共享系统，可能会泄露你的密码。\n\n## 配置文件中的根密码\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_42_0.png)\n\
    \n你也可以使用 SRM 包含程序。存在从 Arch 软件包创建模块的实用程序。你可以通过启动干净的 SystemRescue DVD，使用 *pacman*\
    \ 安装所需的应用程序，然后使用以下命令创建一个包含你所需程序的模块：\n\n```bash\npacman2\n```\n\n### 使用 SRM 包含程序\n\
    \n你可以使用 SRM 包含程序。存在从 Arch 软件包创建模块的实用程序。你可以通过启动干净的 SystemRescue DVD，使用 *pacman*\
    \ 安装所需的应用程序，然后使用以下命令创建一个包含你所需程序的模块：\n\n```bash\nmksquashfs /etc/ssh sshd_keys.srm\
    \ --no-strip\n```\n\n此命令将生成一个名为 `sshd_keys.srm` 的模块文件，你可以将其传输到正在进行重制的计算机上。该文件可以放置在解压后镜像的\
    \ `sysresccd` 目录下。请记住，该文件的内容是敏感的；任何访问这些文件的恶意实体都可以对你的 SSH 会话进行中间人攻击（MITM）。\n\n\
    要实现此设置，你需要使用标准的 Linux 系统下载 SystemRescue 的副本：\n\n```bash\ncurl -L https://sourceforge.net/projects/systemrescuecd/files/sysresccd-x86/10.00/systemrescue-10.00-amd64.iso/download\
    \ > systemrescue-10.00-amd64.iso\n```\n\nSystemRescue 创建者提供的一个实用脚本可以让你解压刚刚下载的\
    \ ISO 镜像。你可以使用该脚本提取 ISO 文件的内容并在重新打包之前对其修改。你可以按照以下方式下载脚本：\n\n```bash\ncurl -L https://gitlab.com/systemrescue/systemrescue-sources/-/raw/main/airootfs/usr/share/sysrescue/bin/sysrescue-customize?inline=false\
    \ > sysrescue-customize\n```\n\n一旦下载了 `sysrescue-customize` 脚本，使用以下命令解压镜像内容：\n\
    \n```bash\n./sysrescue-customize --unpack --source=systemrescue-10.00-amd64.iso\
    \ --dest=custom\n```\n\n## 整合所有内容\n\n一旦你将 YAML 文件放置在 `sysrescue.d` 目录下，就可以重新打包镜像。\n\
    \n```bash\nsysrescue-customize --pack source=custom\n```\n\n**列表 2：简单服务器**\n```perl\n\
    #!/usr/bin/perl\nuse IO::Socket qw(AF_INET SOCK_STREAM SHUT_WR);\n\n# 在所有接口的8080端口创建一个监听socket\n\
    my $server = IO::Socket->new(\n  Domain   => AF_INET,\n  Type     => SOCK_STREAM,\n\
    \  Proto    => 'tcp',\n  LocalHost => '0.0.0.0',\n  LocalPort => 8080,\n  ReusePort\
    \ => 1,\n  Listen    => 5,\n) or die \"无法打开socket: $IO::Socket::errstr\";\n\n\
    # 无循环监听请求并记录源IP\nwhile (1) {\n  # 等待连接\n  my $client = $server->accept();\n\n\
    \  # 获取客户端IP\n  my $client_address = $client->peerhost();\n\n  # 如果IP是192.168.3.50，从本地文件读取script_1.sh\n\
    \  # 并发送。在任何其他情况下，返回script_2.sh。\n  my $script;\n\n  if ($client_address eq \"\
    192.168.3.50\" ) {\n    $script = 'script_1.sh';\n  } else {\n    $script = 'script_2.sh';\n\
    \  }\n\n  open (INFILE, $script) || die \"无法打开$script\";\n  $client->send(\"HTTP/1.0\
    \ 200 OK\\r\\n\\r\\n\");\n  while (<INFILE>) {\n    $client->send($_);\n  }\n\
    \  close(INFILE);\n\n  # 通知客户端连接关闭\n  $client->shutdown(SHUT_WR);\n}\n\n$server->close();\n\
    ```\n\n**列表 3：FTP 服务器脚本**\n```bash\n#!/bin/bash\n\n# 在本地机器上挂载文件系统\nmount UUID=7bd471e8-cb11-474b-9901-e7ab6bfe2890\
    \ /srv/ftp\n\n# 如果挂载失败报告错误并退出\nif [ \"$?\" -ne \"0\" ]; then\n  echo \"无法挂载到 /srv/ftp\"\
    \n  exit 1\nfi\n\n# 在后台运行FTP服务器\nsystemctl enable ftpd.service\nsystemctl start\
    \ ftpd.service\n```\n\n"
