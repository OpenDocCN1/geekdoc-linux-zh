    ## **Ubuntu 基础**


    Vanilla OS 基于一个精简的 Ubuntu 22.10，它是一个去除了 Ubuntu 定制化的纯 Gnome 43 桌面，并配备了独立的安装程序。该发行版遵循
    Ubuntu 的发布周期。虽然目前看起来并不起奇，但如果让民意调查者询问 2022 年的 Linux 年度词，“不可变（immutable）”绝对会进入短名单。这个词指的是不可变文件系统，每当话题转向发行版时就会出现。这项技术并非新事物，但到目前为止应用并不多。


    多年年来，Red Hat 和 SUSE 等主要的商业 Linux 供应商一直在为其企业软件的范式转移做准备，重点关注免受不受欢迎入侵者以及操作错误或系统性缺陷的影响。应对此类不可预见因素的办法是在启动时挂载只读文件系统。然而，这种系统也改变了软件的交付格式和方法，以及包管理器作为发行版核心组件的地位。


    不可变文件系统不再局限于企业发行版，并开始出现在家用桌面上。一种获得高度评价的不可变文件系统是 Vanilla OS [1]，这是一个野心勃勃的 Linux
    发行版，它巧妙地结合了现有解决方案而不是重新发明轮子。尽管 Vanilla OS 只开发了几个月，但由创始人 Mirko Brombin [2] 的团队最近发布了第一个稳定版本
    Vanilla OS 22.10 Kinetic。


    ## **Vanilla OS 专注于新策略**


    **Vanilla OS 作为一种不可变文件系统，通过创新的基于容器的包管理器无缝集成了其他发行版的应用程序。*作者: Ferdinand Thommes***


    **图 1：你可以在 Vanilla OS 中看到 Ubuntu 的影子。相反，它更像 Fedora，但其底层运行机制远比外表看起来复杂得多。**


    **摄影：Markus Gempeler 拍摄于 Unsplash**


    ***一股新清风***


    32


    评论

    2023年9月

    第 274 期

    LINUX-MAGAZINE.COM


    Vanilla OS


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_32_0.png)


    Vanilla OS 与典型的 Ubuntu 衍生版有显著不同。第一视觉印象是色彩丰富，在布局上让你更多地想起 Fedora 而不是 Ubuntu（图 1）。Vanilla
    OS 的策略也更倾向于 Fedora Silverblue，但使用了不同的成分。然而，乍一看，系统的特殊特性并不显而易见。


    Vanilla OS 设计大部分为不可变的。默认情况下，只有 `/home`、`/etc`、`/opt` 和 `/var` 可以在单独的分区写入。系统在容器中映射了它们。这意味着你可以轻松访问安装包所需的配置文件、设置和其他重要数据。对于你创建的文件也同样。


    ### **双根目录**


    ABRoot 是 Vanilla OS 的核心组件，它管理两个分区，每个分区大小为 20G，分别标识为 a 和 b（图 2）。它们各由一个使用 Btrfs
    分区的相同根文件系统组成，其中托管了核心应用程序。系统将活动分区设置为只读，这就是为什么 Vanilla OS 需要至少 50GB 的空闲磁盘空间。


    如果可能，你可能想给系统提供更多空间，因为 50GB 只为 `/home` 留下了 8GB。因为安装程序目前不允许你手动创建分区，所以在这里务必非常小心。在安装时，设置程序会格式化整个指定的硬盘并删除所有现有数据。这是由于在下一个版本
    Vanilla OS 2.0 Orchid [3] 中发生的变化。


    ### **从 Apt 到 Apx**


    另一个 Vanilla OS 核心组件是 Apx，这是一个内部开发的基于 Apt 的包管理器。Apx 从 Ubuntu 存档安装软件，但它也允许你使用来自
    Fedora 或 Arch Linux 等发行版的包。为了实现这一点，Apx 基于 Distrobox 工具创建容器，将应用程序与根文件系统隔离开 [4]。


    Vanilla OS 区分了更新（updates）和升级（upgrades），后者是指从例如当前的 Ubuntu 22.10 跳跃到到即将发布的版本 23.04。更新每周或每月一次（取决于设置），并在后台（如果需要，会自动）引入微小的改进、错误
    修复和安全更新。


    这些更新控制 Vanilla 系统操作系统（VSO）组件。如果你选择 *SmartUpdate* 选项，VSO 将通过检查设备是否处于空闲状态来确定更新时间。你可以在
    *Vanilla Control Center* | *Updates* 或命令行中配置 VSO。


    ### **从 A 到 B**


    ABRoot 承担了两个文件系统之间交互的角色。升级被安装在当前活动分区上。在下次重启时，该分区将变为活动。使用 Apt 应该保留用于紧急情况，例如安装内核模块或驱动程序。


    `$ sudo abroot shell`

    `$ apt update`

    `$ apt upgrade`


    **结论**


    Linux 社区将 Vanilla OS 视为桌面版 Linux 的先驱。它是基于 Docker 的对应品 Podman 构思并开发的，在那里，应用程序从系统中被抽象出来。Vanilla
    OS 控制中心（Control Center）提供了概览（图 4）。


    例如，你可以使用 Apx 从 Arch 用户仓库（AUR）安装 CopyQ 包：


    `$ apx init --aur`

    `$ apx install --aur copyq`


    如果没有特定发行版的 --aur 版本，安装程序将使用来自 Ubuntu 存档的包（如果可用）（图 5）。通过这种方式安装的包可以从 Gnome 列表中启动。Apx
    与其亲戚 Apt 不同，得益于 Podman，它不需要 root 权限。


    Flatpaks 既可以使用 Gnome 软件管理器安装，也可以通过终端安装，这与其他发行版没有太大区别。通过这种方式安装的应用程序的权限可以通过内置的 Flatseal
    [6] 工具进行。


    **开箱即用的发行**


    无法通过上述包管理系统获取的应用可以通过 Distrobox 从 Arch Linux、Fedora 或 Ubuntu 获取。Vanilla OS还将该策略扩展到了
    Alpine Linux、Void Linux 和 openSUSE。


    图 2：两个根分区和一个主目录至少需要 50GB 空间。


    33


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_33_0.png)


    **图 5：Apx 允许通过 Distrobox 容器从 Arch Linux 或 Fedora 等发行版安装应用程序。在这里，--aur 指定从 AUR
    安装 nano 包。**


    **图 4：Vanilla OS 控制中心的子系统（Sub System）选项卡让你跟踪容器及其其中安装的程序。**


    **图 3：在初始设置期间，你可以决定除 Apx 之外还想使用哪些包管理系统。**


