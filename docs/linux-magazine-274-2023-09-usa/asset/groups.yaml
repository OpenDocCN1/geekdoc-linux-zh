    此外还有经典的网络嗅探器 Wireshark，以前被称为 Ethereal（图 6）。


    在 Kali 网站上，你将找到安装程序 ISO 镜像、虚拟机镜像、在云端运行或作为本地 Docker 容器运行的版本以及更多内容。例如，开发者还为树莓派提供了
