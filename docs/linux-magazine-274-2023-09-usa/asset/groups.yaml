  - "[PAGE 41]\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_41_0.png)\n\nway to accomplish\
    \ this is to create a \n\nSystemRescueModule (SRM), which is \n\njust a SquashFS\
    \ filesystem that contains \n\na set of files to be incorporated in your \n\n\
    custom SystemRescue, similar to Tiny \n\nCore Linux extensions \\[4\\].\n\nGenerating\
    \ a new set of keys is easy. \n\nOn a different computer, boot System-\n\nRescue\
    \ with its default options. It will \n\ngenerate a set of SSH host keys under\
    \ /\n\netc/ssh at boot. You can use utilities in-\n\ncluded in SystemRescue to\
    \ create an \n\nSRM that includes the SSH keys:\n\n\\# mksquashfs /etc/ssh sshd\\\
    _keys.srm U\n\n\\-no-strip\n\nThis command will generate a module \n\nfile called\
    \ sshd\\_keys.srm, which you \n\ncan transfer to the computer where \n\nyou are\
    \ doing the remaster. This file \n\nmay be placed in the unpacked image’s \n\n\
    sysresccd directory. Keep in mind that \n\nthis file’s contents are sensitive;\
    \ any \n\nevil entity that has access to these files \n\ncould perform a man-in-the-middle\
    \ \n\n(MITM) attack against your SSH \n\nsessions.\n\nrescue environment without\
    \ the junior \n\nadmin performing any complex task.\n\nTo implement this setup,\
    \ you need to \n\ndownload a copy of SystemRescue using \n\na standard Linux system:\n\
    \n$ curl -L U\n\nhttps://sourceforge.net/projects/U\n\nsystemrescuecd/files/sysresccd-x86/U\n\
    \n10.00/systemrescue-10.00-amd64.iso/U\n\ndownload > systemrescue-10.00-amd64.iso\n\
    \nA helpful script by the SystemRescue \n\ncreator lets you unpack the ISO image\
    \ \n\nyou just downloaded. You can use the \n\nscript to extract the contents\
    \ of the ISO \n\nfile and modify them before repackag-\n\ning. You can download\
    \ the script as \n\nfollows:\n\n$ curl -L U\n\nhttps://gitlab.com/systemrescue/U\n\
    \nsystemrescue-sources/-/raw/main/U\n\nairootfs/usr/share/sysrescue/bin/U\n\n\
    sysrescue-customize?inline=falseU\n\n > sysrescue-customize\n\nOnce the script,\
    \ sysrescue-customize, has \n\nbeen downloaded, extract the image’s \n\ncontents\
    \ with the following \n\ncommand:\n\n$ ./sysrescue-customize --unpack U\n\n\\\
    --source=systemrescue-10.00-amd64.iso U\n\n\\--dest=custom\n\n**Including Custom\
    \ **\n\n**Configuration Files**\n\nUnpacking the ISO image will give you \n\n\
    the contents shown in Figure 1.\n\nCustomary of Live CDs, SystemRes-\n\ncue’s\
    \ behavior can be modified at boot \n\nby using *cheat codes*, which are key-\n\
    \nwords and flags passed at the boot \n\nprompt before the system is booted \n\
    \n(Figure 2). See the SystemRescue web-\n\nsite for some supported cheat codes\
    \ \\[3\\].\n\nPassing the cheat codes rootcryptpass \n\nand nofirewall enables\
    \ SSH access \n\nupon boot (see the “Root Passwords in \n\nConfiguration Files”\
    \ box). You also \n\nneed to pass loadsrm=y in order to load \n\ncustom modules\
    \ (which I will describe \n\nlater). SystemRescue supports applying \n\nthese\
    \ options via YAML files (see List-\n\ning 1 for an example), which is much \n\
    \nmore elegant than hacking the boot-\n\nloaders to bake them in. Save Listing\
    \ 1 \n\nin the sysrescue.d folder of the image \n\nyou just extracted. Beware,\
    \ the YAML \n\nformat is inflexible regarding indenta-\n\ntion: Don’t indent using\
    \ the tab key; \n\nuse the space bar instead.\n\nModifying with cheat codes is\
    \ not \n\nenough. SystemRescue, by default, cre-\n\nates a set of SSH keys every\
    \ time it \n\nboots, and the keys are not preserved \n\nacross reboots. If you\
    \ want SystemRes-\n\ncue to use the same set of SSH keys \n\nevery time, which\
    \ lets you verify Sys-\n\ntemRescue’s fingerprints when connect-\n\ning remotely,\
    \ you need to pre-generate \n\nthese keys and preload them. The ideal \n\nglobal:\n\
    \n loadsrm: y\n\n nofirewall: true\n\n rootcryptpass: \"$6$W9Lhg.3mr54J0mxe$4rudPwTGXLc9xgQotiE9HINide7NjO4lRzhZmsLOSwrrwXhSDr6BT2mhgfml0XvUfz6my8fULs.gm3u9THXVb0\"\
    \n\n**Listing 1: ****Applying Options via YAML Files**\n\n**Figure 3:**** For\
    \ safe storage on a DVD, you need to generate a hash of your password. Ensure\
    \ you do this in a **\n\n**secure environment where nobody else can check your\
    \ shell history or your list of running processes.**\n\nSystemRescue lets you\
    \ set root passwords via the *rootpass* cheat code. I don’t recom-\n\nmend setting\
    \ this code when using YAML configuration files, as shown in this article, \n\n\
    because *rootpass* requires the password to reside in a cleartext YAML file, making\
    \ the \n\npassword readable by anybody who has access to the custom DVD.\n\nThe\
    \ *rootcryptpass* code I use in this article is safer, because the password is\
    \ stored in \n\nhashed form, just as the passwords in a regular Linux system are\
    \ stored in /etc/\n\nshadow. To generate a suitable password hash (Figure 3),\
    \ use the following command:\n\n$ python3 -c 'import crypt; print(crypt.crypt(\"\
    $password\",U\n\ncrypt.mksalt(crypt.METHOD\\_SHA512)))'\n\nand replace *$password*\
    \ with your chosen password string. The output of the com-\n\nmand above may be\
    \ used directly alongside the *rootcryptpass* cheat code as shown \n\nin the examples.\
    \ Beware, the command will be saved to your shell’s history if it is not \n\n\
    disabled, and it will be visible in the system’s list of running processes, which\
    \ may re-\n\nveal your password if you share the system with other users.\n\n\
    **Root Passwords in Configuration Files**\n\n42\n\nCustomizing SystemRescue\n\n\
    SEPTEMBER 2023 \n\nISSUE 274 \n\nLINUX-MAGAZINE.COM\n\nIN-DEPTH"
  - "[PAGE 42]\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_42_0.png)\n\nYou can also\
    \ use SRMs to include programs. Utilities for \n\ncreating modules from Arch packages\
    \ also exist. You can \n\ncreate a module including your desired programs by booting\
    \ \n\na clean SystemRescue DVD, installing the required applica-\n\ntions using\
    \ *pacman*, and then creating the SRM using \n\ncowpacman2srm:\n\n\\# cowpacman2srm\
    \ my\\_module.srm\n\nThe resulting SRM my\\_module.srm will include all the Arch\
    \ pack-\n\nages you installed.\n\n**Putting Everything Together**\n\nOnce you\
    \ have placed your YAML configuration files under \n\nsysrescue.d and loaded your\
    \ desired modules under *sys-*\n\n*resccd*, you can create your custom ISO image\
    \ with the \n\ncommand:\n\n$ sysrescue-customize --rebuild --source=custom --dest=custom.iso\n\
    \nYou can now burn this image to DVD using any of the usual tools.\n\n**Beyond\
    \ Simple Modifications**\n\nSystemRescue features one advanced customization capability:\
    \ \n\nthe ability to download and execute scripts from the web upon \n\nboot.\
    \ You can place a script on a web server, and a customized \n\nSystemRescue can\
    \ be configured to download that script and exe-\n\ncute it right after boot.\
    \ Scripts may be fetched over HTTPS, and \n\nSystemRescue is capable of performing\
    \ certificate validation for \n\nthe TLS connection, so in theory the process\
    \ is reasonably secure.\n\nThis groundbreaking feature allows SystemRescue to\
    \ be used \n\nto provision services. You can create a custom SystemRescue \n\n\
    image configured to download a script from a given URL and \n\nexecute it. Then\
    \ you can set a web server to deliver a different \n\nscript depending on the\
    \ IP from which the request is made. \n\nThe end result is that you can use a\
    \ SystemRescue DVD to boot \n\na server, which will fetch the script and use it\
    \ to download and \n\ninstall a set of packages and launch a set of services.\
    \ However, \n\nif you boot the same image from a server assigned a different \n\
    \nIP, it may be given a different script and end up downloading a \n\ndifferent\
    \ set of packages and executing a different set of ser-\n\nvices. This makes it\
    \ possible to create a simple server provi-\n\nsioning system without effort.\
    \ The only thing you need to take \n\ncare of is configuring the network’s DHCP\
    \ server to assign the \n\nappropriate IP to each server.\n\n01 #!/usr/bin/perl\n\
    \n02 use IO::Socket qw(AF\\_INET AF\\_UNIX SOCK\\_STREAM SHUT\\_WR);\n\n03 \n\n\
    04 # Create a listening socket on all interfaces and port 8080\n\n05 my $server\
    \ = IO::Socket->new(\n\n06 Domain => AF\\_INET,\n\n07 Type => SOCK\\_STREAM,\n\
    \n08 Proto => 'tcp',\n\n09 LocalHost => '0.0.0.0',\n\n10 LocalPort => 8080,\n\n\
    11 ReusePort => 1,\n\n12 Listen => 5,\n\n13 ) or die \"Can't open socket: $IO::Socket::errstr\"\
    ;\n\n14 \n\n15 # Infinite loop that listens for requests and records the\n\n16\
    \ # source IP from clients connecting to the server.\n\n17 while (1) {\n\n18 #\
    \ Wait for connection\n\n19 my $client = $server->accept();\n\n20 \n\n21 # Obtain\
    \ IP from the client.\n\n22 my $client\\_address = $client->peerhost();\n\n23\
    \ \n\n24 # If the IP is 192.168.3.50, read script\\_1.sh\n\n25 # from the local\
    \ filesystem and send it over.\n\n26 # In any other case, return script\\_2.sh.\n\
    \n27 \n\n28 my $script;\n\n29 \n\n30 if ( $client\\_address eq \"192.168.3.50\"\
    \ ) {\n\n31 $script = 'script\\_1.sh';\n\n32 } else {\n\n33 $script = 'script\\\
    _2.sh';\n\n34 }\n\n35 \n\n36 open (INFILE, $script) || die \"Couldn't open $script\"\
    ;\n\n37 $client->send(\"HTTP/1.0 200 OK\\\\r\\\\n\\\\r\\\\n\");\n\n38 while (<INFILE>)\
    \ {\n\n39 $client->send($\\_);\n\n40 }\n\n41 close (INFILE);\n\n42 \n\n43 # Notify\
    \ the client of connection closure\n\n44 $client->shutdown(SHUT\\_WR);\n\n45 }\n\
    \n46 \n\n47 $server->close();\n\n**Listing 2: ****Simple Server Provisioning System**\n\
    \n01 #!/bin/bash\n\n02 \n\n03 # Mount a filesystem in the local machine\n\n04\
    \ mount UUID=7bd471e8-cb11-474b-9901-e7ab6bfe2890 /srv/ftp\n\n05 \n\n06 # Report\
    \ an error and exit if the mount fails\n\n07 if \\[ \"$?\" -ne \"0\" \\]; then\n\
    \n08 echo \"Could not mount on /srv/ftp\"\n\n09 exit 1\n\n10 fi\n\n11 \n\n12 #\
    \ Run an ftp server in the background\n\n13 systemctl enable ftpd.service\n\n\
    14 systemctl start ftpd.service\n\n**Listing 3: ****FTP Server Script**\n\nCustomizing\
    \ SystemRescue\n\n43\n\nLINUX-MAGAZINE.COM \n\nISSUE 274 \n\nSEPTEMBER 2023\n\n\
    IN-DEPTH"
- md: "\n![](img/8db7a58bef2f490a3db3c4fd35de2457_43_0.png)\n\nListing 2 shows a proof\
    \ of concept web server written in Perl, based on an example provided by Perl’s\
    \ documentation [5]. It will return a Bash script if it receives a request from\
    \ IP 192.168.3.50, and it will return a different one to queries made from any\
    \ other address. Listing 3 displays an example script that creates an instantaneous\
    \ FTP server which offers files stored in one of the machine’s filesystems as\
    \ anonymous downloads.\n\nListing 4 shows an example YAML configuration for SystemRescue\
    \ to fetch a script from your web server and execute it at boot. Keep in mind\
    \ that you may place as many YAML configuration files within SystemRescue’s sysrescue.d\
    \ as you like: They get loaded and read in canonical order, and all of their options\
    \ applied. In case of conflicting options, the configuration of latter YAML files\
    \ overwrites the ones from earlier files.\n\n**Conclusion**\n\nDespite SystemRescue’s\
    \ usefulness for fixing broken systems and performing maintenance tasks, you may\
    \ need to add tools. SystemRescue’s creator has ensured you can add as many programs\
    \ to your rescue environment as needed. This flexibility makes it easy to configure\
    \ SystemRescue to start services upon boot and perform complex tasks. You can\
    \ even use SystemRescue to perform server provisioning in simple environments.\n\
    \nSystemRescue advertises the ability to download YAML configuration files at\
    \ boot time and load their configuration dynamically. I found during my tests\
    \ that this feature does not work as advertised, because SystemRescue attempts\
    \ to fetch the YAML configuration file from the web before the network interfaces\
    \ are configured.\n\n**Listing 4: Fetching a Script to Execute at Boot**\n\n```yaml\n\
    autorun:\n  exec: 200:\n  url: \"http://192.168.3.100:8080/\"\n```\n\n[1] SystemRescue\
    \ tools: https://www.system-rescue.org/System-tools/\n[2] Creating a backing store:\
    \ https://www.system-rescue.org/manual/Creating_a_backing_store/\n[3] Boot options:\
    \ https://www.system-rescue.org/manual/Booting_SystemRescue/\n[4] “Developing\
    \ Tiny Core Linux Extensions” by Rubén Llorente, Linux Magazine, issue 243, February\
    \ 2021: https://www.linux-magazine.com/Issues/2021/243/Tiny-Core-Linux\n[5] Perl\
    \ IO::Socket documentation and examples: https://perldoc.perl.org/IO::Socket#EXAMPLES\n\
    \n**Info**\n\n**Rubén Llorente** is a mechanical engineer who ensures that the\
    \ IT security measures for a small clinic are both legally compliant and safe.\
    \ In addition, he is an OpenBSD enthusiast and a weapons collector.\n\n**Author**\n\
    \nCustomizing SystemRescue IN-DEPTH\n\n# THE NOV 12-17 INTERNATIONAL CONFERENCE\
    \ for HIGH PERFORMANCE COMPUTING NETWORKING, STORAGE & ANALYSIS\n# SC23.SUPERCOMPUTING.ORG\n\
    \n# iamhpc\nSC, the premier HPC conference, is a week of technical and professional\
    \ events where thousands of researchers, technologists, engineers, and students\
    \ gather to learn, share, and grow.\n\n# SC23\nDenver, CO | i am hpc.\n\n## EXPLORE\
    \ the POSSIBILITIES\nOrient yourself with the four main components of SC and discover\
    \ what the conference has to offer.\n\nProgram\nAttend the leading technical program\
    \ for HPC professionals and students, celebrated for its high-quality lectures,\
    \ presentations, tutorials, panels, and more!\n\nExhibits\nEngage the largest\
    \ HPC expo and discover the latest technological innovations from industry, research\
    \ and academic organizations, all under one roof.\n\nStudents\nFind your HPC future!\
    \ Students@SC provide special student-oriented programming to promote careers\
    \ and little help from mentors and friends.\n\nSCinet\nExperience the world's\
    \ fastest network (for the week of SC) and learn how SCinet advances the frontier\
    \ for all of the conference's networking demands.\n\nRegister on or before October\
    \ 12, 2023 and save!\n\n# REGISTER for SC23 IN-PERSON IN DENVER OR THE DIGITAL\
    \ EXPERIENCE\nLEARN MORE & REGISTER!\n\nSPONSORED BY\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_45_0.png)\n\
    \nA mathematical formula can be much slower than writing the same formula by hand.\
    \ MathLex [1], a little-known JavaScript utility, helps solve this problem. It\
    \ parses math input notation into a syntax tree and then renders the notation\
    \ as several target outputs, which you can then use on your web pages (Figure\
    \ 1).\n\nMathLex was developed by Matthew J. Barry along with Philip B. Yasskin\
    \ and others as part of Barry’s Math helps us make sense of the world and make\
    \ it a better place. The language of math (formulas and equations) is universal,\
    \ but it is also universally difficult to render handwritten formulas into digital\
    \ form for the computer. Thirty years ago, graduate students would pay programmers\
    \ to render their beautifully drawn mathematical formulas for the computer because\
    \ the process took twice as long as the original drawing, regardless of available\
    \ software. Even today, entering a complex web-based math entry system Math Magic\
    \ lets you easily transform handwritten formulas to digital format and use them\
    \ on the web. By Marco Fioretti.\n\nFigure 1: In addition to the formula, the\
    \ MathLex demo also shows how it parses the formula internally, as well as the\
    \ formula’s LaTeX and Sage versions. Figure 2: The MathLex demo is an HTML page\
    \ that will work in any browser.\n\n46 IN-DEPTH SEPTEMBER 2023 ISSUE 274 LINUX-MAGAZINE.COM\n\
    \nMathLex\n![](img/8db7a58bef2f490a3dbc4fd35de2457_46.png)\nundergraduate thesis\
    \ about 10 years ago. While the project basically stalled after initial development,\
    \ you can still find it (along with a demo) on GitHub [1] (Figure 2). Barry developed\
    \ MathLex because he found math entry systems like MathML and even LaTeX too slow\
    \ to use, too complex, and sometimes not very good at preserving semantics (the\
    \ actual meaning of each formula). He designed MathLex to let users enter complex\
    \ formulas using a syntax as close as possible to handwritten math, but unambiguous\
    \ in its mathematical meaning, without giving up compatibility with popular standards\
    \ like MathML orJax (Figure 3). In addition, Barry made MathLex compatible with\
    \ any browser or operating system, without the portability issues of technologies\
    \ like Flash.\n\nIn this article, I will show you how to install MathLex on Linux,\
    \ how to use it to write formulas, and also how to embed it into any web page.\n\
    \n**Installing MathLex**\n\nUnfortunately, MathLex is not packaged in distribution-native\
    \ formats like .deb or .rpm. The easiest way to install it on your Linux box is\
    \ to build it locally using the Yarn JavaScript package manager [2]. To get a\
    \ working copy of MathLex on your computer, start downloading all the source code,\
    \ with git or as a single ZIP archive. Once the code is in a folder on your computer,\
    \ go to the folder from the command line and type the following two commands at\
    \ the prompt:\n\n```\nyarn\nyarn build\n```\n\nWith any luck, installation should\
    \ complete in a minute or two. On Ubuntu, however, I came across the Yarn error\
    \ known as “There are no scenarios; must have at least one.” It turns out that\
    \ Ubuntu (and possibly other Linux distributions) does not install the default\
    \ version of Yarn recommended by its developers. Instead it installs a different\
    \ version found inside another package called cmdtest. You can remove this package\
    \ and then install the original one for Yarn, as explained on Stack Overflow [3].\n\
    \n**Using MathLex**\n\nThe most difficult part of writing formulas with MathLex\
    \ is knowing all the math you will need to use and all of MathLex’s functions.\
    \ In regards learning the MathLex syntax, Yarn will place a file called index.html\
    \ in the build/demo folder (index.html is the HTML page shown in Figures 1 and\
    \ 2).\n\nIn addition to the Syntax and Topic links at the top of Figure 2, the\
    \ bottom part of the HTML page contains many sample formulas that you can load\
    \ in the entry box and modify as you wish (Figure 4), convert to other formats\
    \ like SVG (Figure 5), or even use to learn how the native format of MathLex works\
    \ (Figure 6). Thanks to those tips and examples, and to the fact that the rendering\
    \ and parse boxes in Figure 2 change as you type, attempting to write formulas\
    \ in the demo is by far the quickest and most.\n\nFigure 3: MathLex also supports\
    \ the MathML markup language and the MathJax library.\nFigure 4: You can render\
    \ the formulas in several formats, depending on your needs.\nFigure 5: The SVG\
    \ version of the same formula shown in the previous figures.\nFigure 6: For study\
    \ or documentation purposes, you can also view the plain source that MathLex uses\
    \ to represent formulas.\n\n47 IN-DEPTH MathLex LINUX-MAGAZINE.COM ISSUE 274 SEPTEMBER\
    \ 2023\n"
  mdcn: "\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_43_0.png)\n\n列表 2 展示了一个用 Perl\
    \ 编写的演示性 Web 服务器，其基于 Perl 文档 [5] 提供的示例。如果它收到来自 IP 192.168.3.50 的请求，它将返回一个 Bash\
    \ 脚本；而对于来自任何其他地址的查询，它将返回另一个脚本。列表 3 显示了一个示例脚本，该脚本可以创建一个即时 FTP 服务器，将存储在机器某个文件系统中的一个文件作为匿名下载提供。\n\
    \n列表 4 显示了 SystemRescue 的示例 YAML 配置，用于从你的 Web 服务器获取脚本并在启动时执行它。请记住，你可以在 SystemRescue\
    \ 的 `sysrescue.d` 目录下放置任意数量的 YAML 配置文件：它们会按照顺序加载和读取，并应用所有选项。如果出现选项冲突，后加载的 YAML\
    \ 文件配置将覆盖先加载文件的配置。\n\n**结论**\n\n尽管 SystemRescue 在修复损坏系统和执行维护任务方面非常有用，但你可能需要添加工具。SystemRescue\
    \ 的创建者确保你可以根据需要向救援环境添加任意数量的程序。这种灵活性使其能够配置 SystemRescue 在启动时启动服务并执行复杂任务。你甚至可以使用\
    \ SystemRescue 在简单环境中进行服务器配置。\n\nSystemRescue 宣称能够在启动时下载 YAML 配置文件并动态加载其配置。我在测试中发现，此功能并没有宣传的那样有效，因为\
    \ SystemRescue 会在网络接口配置之前就尝试从网络获取 YAML 配置文件。\n\n**列表 4：获取启动时执行的脚本**\n\n```yaml\n\
    autorun:\n  exec: 200:\n  url: \"http://192.168.3.100:8080/\"\n```\n\n[1] SystemRescue\
    \ 工具：https://www.system-rescue.org/System-tools/\n[2] 创建后端存储：https://www.system-rescue.org/manual/Creating_a_backing_store/\n\
    [3] 启动选项：https://www.system-rescue.org/manual/Booting_SystemRescue/\n[4] “Developing\
    \ Tiny Core Linux Extensions”，作者 Rubén Llorente，发表于《Linux Magazine》第 243 期，2021\
    \ 年 2 月：https://www.linux-magazine.com/Issues/2021/243/Tiny-Core-Linux\n[5] Perl\
    \ IO::Socket 文档与示例：https://perldoc.perl.org/IO::Socket#EXAMPLES\n\n**信息**\n\n\
    **Rubén Llorente** 是一位机械工程师，确保小型诊所的 IT 安全措施既符合法律规定又安全。此外，他还是一个 OpenBSD 爱好者和武器收藏家。\n\
    \n**作者**\n\n深度定制 SystemRescue\n\n# 11 月 12-17 日高性能计算网络、存储与分析国际会议\n# SC23.SUPERCOMPUTING.ORG\n\
    \n# iamhpc\nSC 是顶尖的 HPC（高性能计算）会议，是一个为期一周的技术和专业活动周，成千上万的研究人员、技术专家、工程师和学生汇聚在此，学习、分享并成长。\n\
    \n# SC23\n科罗拉多州丹佛佛 | i am hpc。\n\n## 探索可能\n了解 SC 的四个主要组件，并发现会议提供的内容。\n\n日程\n参加面向\
    \ HPC 专业人士和学生的领先技术课程，这些课程以其高质量的讲座、演示、教程、小组讨论等而闻名！\n\n展出\n参与最大的 HPC 博览会，发现行业、研究和学术机构的最新技术创新，所有创新都汇聚于一堂。\n\
    \n学生\n寻找你的 HPC 未来！Students@SC 提供专门面向学生的活动计划，用以促进职业发展，并获得导师和朋友的小小帮助。\n\nSCinet\n\
    体验世界上最快的网络（在 SC 期间），并了解 SCinet 如何推进会议所有网络需求的前沿技术。\n\n在 2023 年 10 月 12 日或之前注册即可节省费用！\n\
    \n# 在丹佛亲临现场或通过数字体验注册 SC23\n了解更多并注册！\n\n赞助商\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_45_0.png)\n\
    \n数学公式的输入可能比手写同样的公式要慢得多。MathLex [1] 是一个鲜为人知的 JavaScript 工具，有助于解决这个问题。它将数学输入符号解析为语法树，然后将表示法渲染为多个目标输出，你随后可以将它们使用在网页上（图\
    \ 1）。\n\nMathLex 由 Matthew J. Barry 与 Philip B. Yasskin 等人共同开发，是 Barry 的数学帮助我们理解世界并让世界变得更好项目的一部分。数学语言（公式和方程）是通用的，但将手写公式渲染成计算机数字形式在世界范围内都是困难的。三十年前，研究生会付给程序员为计算机渲染他们绘制的美妙数学公式，因为无论使用什么可用软件，这个过程花费的时间都是原始草图的两倍。即使在今天，一个复杂的\
    \ Web 端数学输入系统 Math Magic 也能让你轻松地将手写公式转换为数字格式并在网页上使用。作者：Marco Fioretti。\n\n图 1：除了公式外，MathLex\
    \ 演示还展示了它如何在内部解析公式，以及公式的 LaTeX 和 Sage 版本。图 2：MathLex 演示是一个可以在任何浏览器中运行的 HTML 页面。\n\
    \n46 深度2023 年 9 月第 274 期 LINUX-MAGAZINE.COM\n\nMathLex\n![](img/8db7a58bef2f490a3dbc4fd35de2457_46.png)\n\
    关于十年前的本科论文。虽然该项目在初步开发后基本停滞了，但你仍可以在 GitHub 上找到它（附带一个演示）[1]。Barry 开发 MathLex 是因为他发现像\
    \ MathML 这样的数学输入系统太慢、太复杂，且有时无法很好语义（公式的实际含义）。他设计 MathLex 让用户使用尽可能接近手写数学的方式输入公式，但在数学含义上是无歧义的。此外，Barry\
    \ 让 MathLex 兼容任何浏览器或操作系统，而无需担心 Flash 等技术的兼容性问题。\n\n在本文中，我将向你如何在 Linux 上安装 MathLex，如何使用它，以及如何将其嵌入任何网页。\n\
    \n**安装 MathLex**\n\n遗憾的是，MathLex 并没有以 .deb 或 .rpm 等发行版格式打包。在 Linux 机器上安装它最简单的方法是通过\
    \ Yarn 包管理器进行本地构建 [2]。要在你的计算机上获取 MathLex 的副本，请通过 git 或单个 ZIP 压缩包下载源代码。代码进入文件夹后，从命令行进入该目录并输入以下命令：\n\
    \n```\nyarn\nyarn build\n```\n\n如果运气好，安装应该在一两分钟内完成。然而，在 Ubuntu 上，我遇到了“No scenarios;\
    \ must have at least one.”的 Yarn 错误。结果 Ubuntu（可能的其他 Linux 发行版）没有安装开发者推荐的默认 Yarn\
    \ 版本。相反，它安装了位于 cmdtest 包中的另一个版本。你可以移除该包，然后按照 Stack Overflow 的说明安装原始版本 [3]。\n\n\
    **使用 MathLex**\n\n使用 MathLex 写公式最困难的部分是了解你需要的所有数学以及 MathLex 的所有功能。关于学习 MathLex\
    \ 语法，Yarn 会在 build 目录下放置一个名为 index.html 的文件（index.html 是图 1 和图 2 所示的 HTML 页面）。\n\
    \n除了图 2 顶部 Syntax 和 Topic 链接外，HTML 页面底部包含许多示例公式，你可以将其加载到输入框并修改（图 4），转换为 SVG 等格式（图\
    \ 5），甚至使用它们来学习 MathLex 的原生格式（图 6）。得益于这些提示和示例，加上图 2 中的渲染框和解析框会随着你的输入而变化，在演示中尝试编写公式显然是最快捷、最有效的方法。\n\
    \n图 3：MathLex 还支持 MathML 标记语言和 MathJax 库。\n图 4：根据你的需求，你可以将公式渲染为多种格式。\n图 5：图中所示公式的\
    \ SVG 版本。\n图 6：出于学习或文档目的，你还可以查看 MathLex 使用的纯源码。\n\n47 深度 MathLex LINUX-MAGAZINE.COM\
    \ 第 274 期 2023 年 9 月\n\n"
