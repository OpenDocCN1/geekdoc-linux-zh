  - "[PAGE 92]\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_92_0.png)\n\nTo do this,\
    \ right-click on the *CA* layer and choose \n\n*Add* | *Add Transparency Mask*\
    \ from the context \n\nmenu. A white layer now appears below *CA* in the \n\n\
    Layers dialog box. Select it and click on the fill tool \n\n(the stylized bucket)\
    \ in the toolbox. Check that \n\nBlack is selected as the foreground color. This\
    \ is in-\n\ndicated by the icon with the two small squares in \n\nthe toolbar\
    \ above the preview window. The upper \n\nsquare appears in the foreground color,\
    \ the lower \n\none in the background color.\n\nNow click on the image. The mask\
    \ then fills with \n\nblack. All the corrections you made on the associ-\n\nated\
    \ layer become invisible. Now change the fore-\n\nground color to white and select\
    \ the brush tool in \n\nthe toolbox. In the brush settings dialog at the bot-\n\
    \ntom right, make sure that the *Basic-1* brush is se-\n\nlected. Now, with the\
    \ white brush, paint over the \n\nareas in which you removed the chromatic aberra-\n\
    \ntions with G’MIC earlier on (Figure 12).\n\nThere are still two editing steps\
    \ to complete. The \n\nfragment of ground overgrown with grass in the \n\nlower\
    \ right corner and the blades of grass in the \n\nlower left spoil the overall\
    \ impact. Time to remove \n\nthem with the Clone Brush. Then increase the \n\n\
    sharpness of the image using the *Sharpen* filter.\n\n**Removing Image Elements**\n\
    \nAgain, create a new layer from the visible image, \n\nname it *Retouch*, and\
    \ select it in the Layers dialog \n\nbox. Select the Brush tool in the toolbar,\
    \ and then \n\nfind the Clone Brush bottom right in the Brush \n\nPresets dialog\
    \ box. The easiest way to find it is to \n\ntype *clone* in the search box at\
    \ the bottom of the \n\ndialog box. The brush is labeled with a folding \n\nrule.\
    \ If you now move the mouse pointer into the \n\npreview window, you will see\
    \ two small circles \n\nnext to each other, with a cross in the left one.\n\n\
    The circle with the cross indicates the target \n\narea, and the empty one the\
    \ source area. Change \n\nthe brush size using the blue and white bar in the \n\
    \ntoolbar above the preview window. Set a size of \n\nabout 300 pixels there for\
    \ removing the ground \n\nfragment. Hold down Ctrl and move the circle with \n\
    \nthe cross to an image area above the ground frag-\n\nment (Figure 13).\n\nPress\
    \ the left mouse button briefly and then re-\n\nlease Ctrl. Now move the circle\
    \ with the cross to the \n\narea you want to retouch. Hold down the left mouse\
    \ \n\nbutton and paint over the entire area. The source \n\narea automatically\
    \ moves with the target area. Fol-\n\nlow the same approach when removing the\
    \ blades \n\nof grass, but choose a far smaller brush for this.\n\n**Sharpening\
    \ the Image**\n\nTo sharpen, first create a mask to exclude the sea \n\nfrom sharpening.\
