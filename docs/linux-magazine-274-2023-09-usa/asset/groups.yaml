    ![](img/8db7a58bef2f490a3db3c4fd35de2457_2_0.png)


    Things have been pretty quiet in Free Software for a few years now. When I started
    this job, Linux and the little mystery ship we call Open Source were fighting
    for survival. Microsoft, SCO, and other large companies were bringing all their
    powers to break up that delicate balance of code freedom established by the GNU
    Public License (GPL). Much of the battle was fought through PR stunts and misinformation,
    but some of it was fought in court – and the GPL always won.


    But things could be heating up again. Red Hat recently announced that only paying
    customers will have access to Red Hat Enterprise Linux (RHEL) source code, and
    apparently, if the customer tries to exercise the rights to that code as defined
    in the GPL, Red Hat will terminate the customer agreement. This Kafkaesque bit
    of legal juggling seems like a blast from the combative past. Only this time,
    the lawyers have had 15 additional years to perfect their skills at surgical hair
    splitting.


    Will Red Hat’s lawyers win the day? I don’t know, but I can tell you two things.
    This matter won’t get decided based on anyone’s idea of what is moral or affirming
    for the community. And it also won’t get decided based on anyone’s idea of what
    is essential or necessary for Red Hat’s business. The question of whether Red
    Hat and its parent company IBM can get away with this power move will hinge on
    one thing alone: the GPL license and the case law that surrounds it.


    I’m actually surprised at the number of commentators, many from within the FOSS
    community, who say, “Red Hat has to do this,” and then they launch into a lot
    of business arguments, as if they weren’t paying attention to these past 20 years.
    You can’t really make a valid business argument for violating a license. Can you
    picture someone saying, “Of course I had to pirate this Windows fee.” You can
    try it if you want, but if you get caught, your “business” argument won’t do much
    for you.


    On the other hand, the broad pronouncements that Red Hat is violating the “spirit”
    of open source seem little – as if IBM cares what you think of their spirit. To
    a multinational corporation, “spirit” is a motif for sales meetings and commercials
    – use it when it helps, and lose it when you see an opportunity. The license is
    what matters, and it is surprisingly difficult to find any solid information on
    the licensing issues. The reason for that is that people don’t really know. The
    GPL looks simple on the surface, but it is complex and precarious thing. The best
    analysis I’ve seen so far is the post by Bradley Kuhn of the Freedom Conservancy,
    who writes, “Red Hat’s lawyers clearly take the position that this business model
    complies with the GPL (though we aren’t sure), on grounds that nothing in GPL
    agreements requires a relationship with any other entity. They further argued
    that such business relationships can be terminated based on behaviors including
    exercising rights guaranteed by GPL agreements. Whether that analysis is correct
    is a matter of intense debate, and likely only a court case that disputed this
    particular issue would yield a definitive answer on whether that behavior is permitted
    (or not) under GPL agreements.”


    Of course, the other question is, what will the competitors do? Did Red Hat overplay
    their hand? Many eyes are on recent RHEL clones Alma and Rocky. So far AlmaLinux
    has adapted by dropping their claim of being compatible with RHEL and will instead
    aim at compatibility. Conversely, the attitude of Rocky team appears to be “See
    you in court, Red Hat. Our legal advisors assured us that we have the right to
    obtain the source binaries we receive, ensuring that we can continue advancing
    Rocky in line with our original intentions.” I wonder if someone in one of those
    rooms mapped out the possibility that, instead of having fewer competitors, the
    company would end up with more because of this decision. Now none other than Oracle
    is lecturing them on the importance of community values (When Oracle is taking
    to your left, you know you have veered far.) And SUSE, perhaps Red Hat’s biggest
    competitor, has announced that it is forking RHEL and will invest $10 million
    on maintaining an independent version that will be available forever without vendor
    lock-in.


    All of this makes it sound like Red Hat miscalculated, at least when you are peeking
    out through our Linux lens. But there is one more thing to remember: SUSE might
    be Red Hat’s biggest competitor, but it isn’t IBM’s. IBM’s biggest competitor
    is Microsoft, and in the Microsoft space, EULAs and code restrictions are not
    really controversial or even noteworthy – they’re just another part of the landscape.


    LICENSE MATTERS

    Joe Casad, Editor in Chief


    **[1]** A Comprehensive Analysis of the GPL Issues with the RHEL Business Model:
    https://sfconservancy.org/blog/2023/jun/23/rhel-gpl-analysis/


    **[2]** Keeping Open Source Open: https://rockylinux.org/news/keeping-open-source-open/


    Info

    Dear Reader,


    EDITORIAL

    LIN-MAGAZINE.COM

    ISSUE 274

    SEPTEMBER 2023

    Welcome


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_3_0.png)


    SEPTEMBER 2023


    ### Command Line – Disposable VMs

    Debvm lets you quickly create a temporary virtual machine with a small memory
    footprint, ideal for testing scripts or mixing repositories.


    ### Customizing SystemRescue

    You can do more with SystemRescue than just repair broken systems. By adding tools
    and scripts, you can create a custom rescue environment.


    ### MathLex

    MathLex lets you easily transform handwritten math formulas to digital format
    and use them on the web.


    ### Programming Snapshot – Go Racing Game

    The fastest way through a curve on a racetrack is along the racing line. Instead
    of heading for Indianapolis, Mike Schilli trains his reflexes with a desktop application
    written in Go, just to be on the safe side.


    ### News

    - SUSE Goes for the Fork after Red Hat''s RHEL Announcement

    - Solus 4.4 Now Ready for Prime Time

    - Ubuntu Will Show APT News in the Software Updater

    - Nitx 2.9 Includes an Upgrade Tool and More

    - Ubuntu 22.10 EOL Coming Soon

    - Nobara Project Releases Modified Fedora

    - English Translation of Children’s Book Ada & Zang

    - Steam Client Features Hardware Acceleration on Linux

