  - "[PAGE 49]\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_49_0.png)\n\nend of the\
    \ turn at the \n\ntop right of the game window. The \n\nstopwatch next to the\
    \ two buttons runs \n\nduring the animation and displays the \n\nelapsed lap time\
    \ in seconds with an ac-\n\ncuracy of two decimal figures.\n\nWith a little prior\
    \ knowledge of geom-\n\netry and video game technology, a sim-\n\nple 2D game\
    \ like this can be quickly \n\nput together using Go and the Fyne \n\nframework\
    \ \\[2\\]. To do this, the program \n\nruns through a number of frames per \n\n\
    second, in each of which it computes \n\nthe current position of the game fig-\n\
    \nures, which it then refreshes in the \n\ngraphics. At the same time, it fields\
    \ \n\nuser input such as keystrokes or mouse \n\nclicks and incorporates these\
    \ events \n\ninto the calculations, for example, by \n\nadjusting the steering.\n\
    \nA \n\nfew years ago, I got to test the \n\nphysical limits of my Honda Fit \n\
    \nduring a safety training session. \n\nA short time later, I discovered I \n\n\
    was interested in car racing. It’s also a \n\nmore popular hobby than you might\
    \ \n\nthink among Silicon Valley employees, \n\nwho let their tuned private cars\
    \ off the \n\nleash on racetracks like Laguna Seca in \n\nCalifornia – maybe because\
    \ of the strict \n\nspeed limit that typically applies on free-\n\nways in the\
    \ US.\n\nWhile studying the topic, I was sur-\n\nprised to learn that it’s by\
    \ no means just \n\na matter of keeping your foot on the gas. \n\nIf you want\
    \ to break track records, you \n\nhave to take the turns exactly in line \n\n\
    with physical formulas and always find \n\nthe ideal line in order to knock those\
    \ \n\nvital seconds off your time in each lap. \n\nThe physical principles of\
    \ racing are ex-\n\nplained in the reference work *Going *\n\n*Faster* by Carl\
    \ Lopez \\[1\\]. The book de-\n\nscribes exactly how quickly you can \n\nenter\
    \ a turn without the car starting to \n\nskid and tells you the angle and time\
    \ at \n\nwhich the driver needs to turn the steer-\n\ning wheel to lose as little\
    \ time as possi-\n\nble while cornering.\n\n**Learning How to Race**\n\nThe ideal\
    \ line through a turn is never \n\ngoing to be the shortest path, which \n\nruns\
    \ along the inside. Instead, the aim \n\nis to drive through the curve on a trajec-\n\
    \ntory with as large a radius as possible \n\n(Figure 1). Before the 90-degree\
    \ right-\n\nhand bend shown in Figure 1, a world-\n\nclass driver like Jos Verstappen\
    \ will ini-\n\ntially steer to the left-hand edge of the \n\nroad and then pull\
    \ sharply to the right to-\n\nwards the apex. This means that the race \n\ncar\
    \ just barely scrapes past the inside of \n\nthe curve, only to run over to the\
    \ left side \n\nof the road again shortly afterwards on \n\nthe straight that\
    \ follows the turn. This \n\nmeans that the radius followed by the car \n\nis\
    \ far larger than that of the turn, and that \n\nthe car can negotiate the turn\
    \ at a far \n\nfaster speed without the tires losing trac-\n\ntion or the vehicle\
    \ skidding.\n\n**World of Geometry**\n\nFigure 2 shows the simulation of a \n\n\
    90-degree turn as a desktop game writ-\n\nten in Go with racing animation. The\
    \ \n\nrace car, depicted as a green square, \n\nspeeds upwards towards the curve.\
    \ The \n\nplayer has to steer the vehicle to the left \n\nand right with the *H*\
    \ and *L* keys so that it \n\ndoesn’t hit the side of the road at this \n\nbreakneck\
    \ speed, but safely reaches the \n\n**Mike Schilli** works as a \n\nsoftware engineer\
    \ in the \n\nSan Francisco Bay Area, \n\nCalifornia. Each month \n\nin his column,\
    \ which has \n\nbeen running since 1997, \n\nhe researches practical applications\
    \ of \n\nvarious programming languages. If you \n\nemail him at *mschilli@perlmeister.\
    \ com* \n\nhe will gladly answer any questions.\n\n**Author**\n\n**A desktop car\
    \ **\n\n**racing game in Go**\n\n Go Faster!\n\n**The fastest way through a curve\
    \ on a racetrack is along the **\n\n**racing line. Instead of heading for Indianapolis,\
    \ Mike Schilli **\n\n**trains his reflexes with a desktop application written\
