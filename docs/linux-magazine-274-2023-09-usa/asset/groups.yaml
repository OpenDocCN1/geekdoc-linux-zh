    \ that covers all previously existing layers. \n\nAssign a name of *Distortion*\
    \ and click on it in the \n\nLayers panel to select it. Then get started with\
    \ *Fil-*\n\n*ter* | *Start GMIC-Qt*.\n\nThe program’s user interface is divided\
