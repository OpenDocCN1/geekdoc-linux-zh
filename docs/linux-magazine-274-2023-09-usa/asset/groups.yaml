    ![](img/8db7a58bef2f490a3db3c4fd35de2457_56_0.png)


    Rust package manager. On most systems, you will first need to install Cargo and
    resolve some dependencies via the package manager (Listing 1, line 2 or 4) and
    then update (line 6).


    The next step is to set up Topgrade (line 8). The last step of the build process
    can take a few minutes. Then add the following line to the search path at the
    end of your ~/.profile file (Figure 1):


    export PATH=$PATH:$HOME/.cargo/bin


    Topgrade’s configuration file, ~/.config/topgrade.toml, supports both general
    and specific settings for individual package managers. This is also where you
    specify the hostnames of the remote computers you want to update via SSH. The
    prerequisite for this is that Topgrade is already installed on the remote computer.


    Then, as soon as you run the topgrade command, the application executes the upgrade
    commands in all of the package managers discovered on your system. It starts with
    the distribution’s native package manager, followed by Flatpak and Snap and the
    other candidates (Figure 2).


    ## Conclusions


    Topgrade is not witchcraft. It simply provides the logic to detect and execute
    all existing package managers one by one. Topgrade is not suitable for people
    who want to exclusively use the distribution’s package manager. However, if you
    do use Flatpaks or snaps and run a Raspberry Pi or a server with Pi-hole or other
    services, then Topgrade will handle much of the administration work for you.


    In testing, a system update with Topgrade worked without any problems on Debian,
    Ubuntu, and Fedora (Figure 3). Distrobox was the only software that failed to
    update. Unable to figure out the reason, I filed a bug report. Q Q Q


    **Figure 2:** After the native upgrade and upgrading Flatpaks or snaps, Topgrade
    checks whether any firmware needs to be upgraded.


    **Figure 3:** The update sequence is the same on all systems. This is a fresh
    installation of Fedora 38, so Topgrade doesn’t have much to do.


    [1] Topgrade: https://github.com/r-darwish/topgrade

    [2] Topgrade-rs: https://github.com/topgrade-rs/topgrade

    [3] LVFS: https://fwupd.org

    [4] Supported package managers: https://github.com/r-darwish/topgrade/wiki/Step-list


    IN-DEPTH Topgrade LINUX-MAGAZINE.COM ISSUE 274 SEPTEMBER 2023


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_57_0.png)


    forwarding for all popular routers can be found online [5].


    ## Installation


    Installing the tool is very simple. As the basis, Meienberger recommends a recent
    Ubuntu, starting with version 18.04 and preferably the server variant, but other
    distributions should work just as well. Beyond that, you simply need to download
    and run an installation script. After a few moments, you will see a URL for the
    user interface (Figure 2). If you already have Docker and Docker Compose installed,
    the script will use your defaults. Otherwise, both applications are retrieved
    during the Tipi install. Tipi runs on port 80 by default.


    If you want to choose a different port, run the start-up script with the additional
    --port argument. You can download and run the script simultaneously with a single
    command:


    curl -L https://setup.runtipi.com | bash


    If you want to change the port, the first step is to get the script:


    clone https://github.com/meienberger/runtipi.git


    To keep your data under your control, instead of outsourcing to unknown servers,
    the typical approach is to simply host the services yourself. It is becoming increasingly
    easy for less technically inclined users to operate a small home server. Not least,
    the Raspberry Pi has contributed significantly to this by encouraging many users
    to experiment. The choice of suitable hardware is naturally far greater: from
    devices such as laptops or PCs that have already been replaced by newer gear to
    virtual machines to rented VPS servers on the Internet.


    To save you from having to package and configure every service as a container
    yourself, the number of home server managers have increased recently. Examples
    include DietPi, YunoHost, Mistborn, or NethServer. The summer of 2022 saw the
    release of another alternative in the form of Tipi [1] by Swiss developer Nicolas
    Meienberger [2].


    ## Management Interface


    Tipi is essentially a interface for the applications and services that you want
    to run on your server, without requiring in-depth expertise of the setup. Tipi
    currently offers more than 100 apps in a click-and-forget process.


    *Dashboard* is the first tab: It tells you about the available space on the hard
    disk, the CPU load, and the amount of RAM used (Figure 3). The second tab *My
    Apps* is still empty at this point and points to the third tab, the *App Store*.
    The fourth and last tab, *Settings*, is divided into *Actions* for updating and
    restarting and the actual *Settings* (Figure 4). *Source code* on the right takes
    you to the project’s GitHub page, while *Sponsors* gives you the ability to support
    the project financially. The half moon next to *Sponsors* lets you toggle to Dark
    Mode, and you can log out with the icon on the far right.


    The first thing you need to do is visit the App Store to add some applications.


    **Figure 1:** At the end of a short installation process, Tipi sets up the four
    required containers.


    **Figure 2:** Tipi reveals the URL where you can access the user interface.


    **Figure 3:** After logging in to the interface, you will see the Dashboard with
    indicators for the storage utilization, the CPU load, and the RAM usage.


    **Figure 4:** Settings is divided into Actions and the actual Settings.


    IN-DEPTH Tipi LINUX-MAGAZINE.COM ISSUE 274 SEPTEMBER 2023

