    ![](img/8db7a58bef2f490a3db3c4fd35de2457_74_0.png)


    ## 善有无报……


    “善有无报”是一句起源来源尚存争议的格言，但今天它让我想起了这句话。


    我在 1994 年 5 月见到了 Linus Torvalds。我在 Linux™ [1] 内核（以及相关的分层软件）中看到了一个用于 64 位算法的独特研究平台。我促成了
    Linus 获得一台价值 20,000 美元的 DEC Alpha 系统，以便他为 Linux 提供 32/64 位虚拟地址空间，并使其对 CISC 和 RISC
    系统都更具可移植性。


    到 1996 年底，我加入了一家认为 Linux 具有深层商业潜力的小公司，因此我们成立了 Linux International™，并与 Torvalds
    一起注册了“Linux”商标。


    1997 年初，这些公司（以及 Linux International）收到了来自来自马萨诸塞州波士顿的 William R. Della Croce Jr.
    的信，他注册了“Linux”商标，并要求每家在其名称未使用“Linux”字样的公司交其收入的 25%。


    任何有经验的人都知道，根据公司收入的 25% 要求收取许可费从一开始就是一个注定失败的买卖，但初生的 Linux 行业无法承担风险，因此我们聘请了声誉卓著的
    Davis & Schroeder PC 律师事务所，合伙人之一 Gerry Davis 提供了免费（pro bono）服务。


    对于你们不熟悉商标法或理论的人来说，根据美国专利和商标局的定义，商标“可以是任何单词、短语、符号、设计或这些者的组合”，应用于实体的产品或服务，作为身份标识。


    许多公司都可以制造跑鞋，但只有 Nike™ 可以以这个名字为鞋子命名，并配上著名的 Swoosh 标志。因此，如果你在商店里看到这个名字或 Swoosh，你就知道它是
    Nike 制造的，并且通过品牌识别，你会将特定的质量与该品牌联系起来。因此，如果 Nike 看到某公司制造鞋子并在上面印上“Nike”字样或 Swoosh，Nike
    可能会起诉该公司索赔损害，并阻止其生产这种虚假标记的鞋子。如果 Nike 不这样做，Nike 可能会失去他们的商标。商标必须受到保护。同样，商标必须用于定义当前提供（或在不久将来提供）的产品或服务。被遗弃的商标可以在以后重新使用。


    Gerry Davis 认定，Della Croce Jr. 提交作为产品证明的“软件”是一张软盘，上面有一个文本文件，名为 linux.txt，其 ASCII
    内容为“This file is Linux.”。这（当然）并不是一个坚固的商标案例，但因为 Linux 在 1995 年还是全新的，商标局并没有对此提出异议。


    在 Davis & Schroeder PC 的帮助下，Linux International 将“Linux”商标转让给了 Linus Torvalds。


    Linus 想让该商标进入公有领域，但我说服了他这是一个坏主意，因为“Linux”这个词此后可能被用于坏事，而 Linus 将无办法阻止它。


    因此，Linux International 成立了 Linux Mark Institute™ (LMI) 实体，只要被许可方以正确的方式使用“Linux”商标并给予适当归属，即可免费分许可“Linux”商标的使用。


    到那时，许多实体在其名称中使用了“Linux”一词，因此 LMI 忙于为所有这些实体进行分许可，加强了对“Linux”一词的保护。


    最终，LMI 转让给了 Linux Foundation™，他们现在仍负责这项注册（Torvalds 仍拥有该商标）。


    ## ……且无报


    最近，Linux Professional Institute™ (LPI) 的律师通知了一个商标申请的执行董事，根据律师的意见，该申请将导致与 LPI 商标产生“混淆”。


    我将不会包含该申请的具体细节，因为我不想让申请人感到尴尬。我相信他们是诚意提交申请的。我只会告诉你们，他们的申请范围太广，以至于 90% 使用“Linux
    Operating System”短语提供专业服务的人都将不得不服务归属于该商标持有者。


    于是，一个不理解商标法及其影响的人与非常了解其含义的人（注：我不是律师）之间开始了来回的对话。虽然 Gerry Davis 从未在其事务所的提交和其他服务费务上向
    Linux International 收过一分钱，但我最终还是花了 30,000 美元的自己的资金支付法律费用和申请费——我知道这个案例将付出巨大代价。如果我不这样做，Nike
    可能会失去他们的商标。这种情况下，请咨询律师。


    作者：JON “MADDOG” HALL


    Jon “maddog” Hall 是一位作家、教育工作者、计算机科学家以及软件先驱，自 1994 年认识 Linus Torvalds 以来一直是 Linux
    的坚定支持者。他担任 Linux International 的总裁。Linux International、Nike、Swoosh、Linux Mark
    Institute、Linux Foundation 以及 Linux Professional Institute 都是其在许多司法管辖区注册的商标。


    代理过滤器存在的问题


    ![](img/8db7a58bef2f490a3db3c4fd35de2457_75_0.png)


    为了这个目的。对于这种场景，管理员需要修改所有浏览器的配置以接受代理证书。任何代理过滤器最大的问题不是技术性的，而是法律上的。这是一种解密所有通信的中间人攻击。一旦用户在公司电脑上登录银行、购物或社交媒体等私人服务，公司代理就会破解密码或购物车内容。这种对隐私的侵入是不允许的。对于这种过滤器，雇主需要一份经过委员会批准并由员工签署的协议，例如排除对公司电脑的私用。也可以创建完全阻止访问购物和社交服务的过滤器。作为替代方案，公司可以为用户设备提供一个连接到公司网络的、未经过滤的局域网。此外，现代过滤代理如
    Squid 在基于规则的转发（peek 和 slice）之外，还可以直接解密 SSL 连接。这反过来允许用户的私人流量不受受损地通过。但这种设置使代理作为安全措施失效。在本文中，我们不会查看带有
    bump、peek 和 slice 的 Squid 配置，而是研究一个法律问题较少的解决方案。


    使用 Pi-hole 进行 URL 过滤


    进入漏斗


