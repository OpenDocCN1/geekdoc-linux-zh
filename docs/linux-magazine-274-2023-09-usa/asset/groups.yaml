    monitor with a larger color space than sRGB, adjust the setting for *Workspace*
    in the *Color Management* group at the bottom (not shown in Figure 2). In my opinion,
    *AdobeRGB* or *WideGamut* seem to make sense here – use *WideGamut* only if the
    monitor supports a significantly larger color space than Adobe RGB, however.


    One interesting item in the first group, *Demosaicing*, is the setting for *Quality*,
    where you specify how Krita descreens the image (i.e., adds missing pixels in
    the individual color channels). The default setting seems less than perfect because
    it creates an unnecessarily soft image. It is only usable if the image has too
    much noise or if you want to increase the brightness or contrast afterwards. Of
    course, this will generate noise again. For reasonably correct exposure and not
    too much noise in your photos, you might want to use *AMaZE* instead. You may
    want to try the demosaicing algorithms to see which one works best for a specific
    photo. After changing a setting, click *Update* at the bottom and check the results
    in the preview window on the right.


    In the *White Balance* group, you will not only find the settings for this, but
    also presets for exposure compensation and for reconstructing highlights (i.e.,
    the brightest, possibly overexposed, image zones). The default *Camera* setting
    is usually fine for white balance. If not, try the *Automatic* setting or try
    setting the white balance manually.


    However, the results cannot really be judged well in the preview window, which
    shows only a small part of the image in the 100-percent view on most screens.
    Be sure to uncheck *Automatic Brightness*. This will be easier to adjust later
    on when you see the whole image.


    Provided that there are overexposed areas in the photo, experiment with the settings
    next to *Tip Reconstruction*. The *Blend* and *Rebuild* methods seem to be interesting
    here; *Blend* gives you a good default setting for normal photos, too. You can
    keep the settings in the *Corrections* group. Finally, press *OK* to open the
    photo in Krita.


    ## Image Settings


    In the program window, you will see a large preview window at the center. At the
    top, you’ll find two toolbars that let you open images and change brush settings,
    among other things. On the left edge there is a dockable dialog in the form of
    a toolbar (Figure 3). It contains important tools.


    **Figure 2:** The RAW importer lets Krita load raw camera data.


    **Figure 3:** Following the example set by Photoshop, Krita arranges the editing
    tools around the large preview window.


    Then, in the lower left corner of the Layers window, click the small upside-down
    triangle next to the button with the plus sign. From the menu, select the *Add
    Filter Mask* option; this will launch the filter mask dialog. You will see the
    list of available filters divided into several groups on the left, and the setting
    options for the currently selected filter on the right.


    The *Color Adjustment* filter (Figure 4) belongs to the first group *Adjust*.
    This is actually the curve tool. You will see a rectangle dividing a diagonal
    line rising from the bottom left to the top right. The dark pixels of the image
    are assigned to the left half of the rectangle, and the light pixels to the right.
    To lighten the whole image, set a point in the middle of the diagonal or curve
    and drag it upwards.


    This approach brightens the pixels with medium brightness more than the rest.
    But only brighten the photo to the point where the brightest areas of the image
    reach the desired brightness. Clicking *OK* applies the effect.


    You will find other dockable dialog windows to the right of the preview window.
    The layers, the overview, the brush settings, and the tool options are the most
    important for photographers; the tool options’ content varies depending on the
    selected tool. In the status bar below the preview window, Krita displays a variety
    of information, including the image size and the working color space.


    When working with Krita, the first thing you need to do is duplicate the background
    layer. If possible, perform each individual editing step on a separate layer.
    This makes it easier to undo or adjust an editing step.


    In the Layers panel, after opening an image, you will see a single layer, the
    *Background*. Right-click the layer and select *Duplicate Layer*. Now you have
    a copy to work on.


    To apply a filter, go to the *Filter* menu and select the desired effect. This
    will open a dialog box where you can adjust parameters. If you want to apply the
    filter only to a certain area, you can use a filter mask. Right-click the layer
    and select *Add Filter Mask*. Then, use the brush tool to paint on the mask to
    define where the filter should be applied.


    You can also use various selection tools, the brush, or the crop tool to edit
    your image. These tools are available in the toolbars or dockable dialogs.

