  - "[PAGE 83]\n\n![](img/8db7a58bef2f490a3db3c4fd35de2457_83_0.png)\n\nUse plugins\
    \ and a far more comprehensive settings menu to access device func-\n\ntionality\
    \ not possible with a device e-reader.\n\n**Ebook reader for e-readers**\n\n**KOReader**\n\
    \n**W**\n\ne’ve looked at quite a \n\nfew ebook readers in \n\nthese pages. We\
    \ like \n\nthem because they always have \n\na focus on beautiful text render-\n\
    \ning, removing distractions, and \n\nsimple design. They’re a great \n\nsolution\
    \ if you ever need to read \n\na substantial ePub or MOBI doc-\n\nument on your\
    \ desktop, but the \n\ndesktop experience is always in-\n\nferior to the experience\
    \ offered \n\nby an E Ink reader. E Ink dis-\n\nplays, such as those found on\
    \ \n\nAmazon’s Kindle or Kobo’s Nia, \n\nare a lot kinder on your eyes, \n\nlook\
    \ much more like a paper \n\nbook, and remain mostly dis-\n\ntraction-free by\
    \ being terrible In-\n\nternet devices. But most E Ink \n\nreaders, especially\
    \ the Kindle, \n\nare deeply proprietary and offer \n\nlittle in the way of customiza-\n\
    \ntion. Which leads us back to the \n\nLinux desktop. Or does it?\n\nKOReader\
    \ is an ebook reading \n\nclient that runs on the Linux \n\ndesktop and even Android,\
    \ but \n\nfar more importantly, it can also \n\nrun on E Ink devices such as the\
    \ \n\nKobo Nia, the PocketBook, the \n\nreMarkable, and older Amazon \n\nKindle\
    \ devices, although you will \n\nneed to jailbreak the latter. It’s \n\nworth\
    \ the effort because it \n\ntotally transforms the reader ap-\n\nplication from\
    \ little more than a \n\nshell for words into something \n\nyou can endlessly\
    \ customize \n\nand modify.\n\nKOReader features a user in-\n\nterface designed\
    \ for the user, \n\nrather than for the financial bet-\n\nterment of the corporate\
    \ behind \n\nthe device, such as Amazon \n\nadding advertising to sleep \n\nscreens.\
    \ It’s also open source \n\nand entirely respectful of your \n\nprivacy, which\
    \ means page \n\nturns, reading speed, reading \n\npreferences, and library content\
    \ \n\nwon’t be shared with anyone ex-\n\ncept yourself, and that’s if you \n\n\
    choose to use the optional sta-\n\ntistics functionality.\n\nThe first challenge\
    \ is getting \n\nthe app on your device. Desktop \n\nLinux installation is easy,\
    \ as is \n\napp installation on Android, but \n\nthese are both missing the ad-\n\
    \nvantages of an E Ink display. \n\nFortunately, Kobo devices are \n\nsupported\
    \ from the Touch on-\n\nwards, and the BQ Cervantes is \n\nanother strong option.\
    \ The app \n\nitself replaces the default reader \n\non those devices, with many\
    \ \n\nmore options than the original. \n\nIn particular, you have more \n\ncontrol\
    \ over text kerning, text \n\nflow, the fonts and DPI being \n\nused, the line\
    \ spacing and mar-\n\ngins, plus the contrast of the \n\ndisplay. These options\
    \ are avail-\n\nable from touch-friendly tabbed \n\npanels that appear at the\
    \ bot-\n\ntom of the screen. But this is \n\njust the beginning. KOReader is \n\
    \ncapable of reflowing PDF docu-\n\nments and can sync with Ever-\n\nnote, Dropbox,\
    \ and FTP servers. \n\nThere are plugins to sync prog-\n\nress across devices,\
    \ which the \n\nKindle won’t do if you’re reading \n\nyour own ePubs, and wireless\
    \ \n\nsync with the wonderful Calibre \n\napplication. Thanks to the Lua \n\n\
