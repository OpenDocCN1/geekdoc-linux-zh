    将窗户降至停止位置，以便在窗户打开打开的情况下调整零点。窗升器具有内部停止开关，因此我不需要向 Pi 节点任何东西。


    在无限循环中查询当前运行值，并检查用于切换执行器的指定上限和下限，然后采取相应的行动。系统在这一方面非常智能，因为各种室内和室外条件都起着作用。例如，知道入门是开启还是关闭对于通风至关重要，而且所有不同的切换值取决于季节，因为光照等气候参数会变化。控制器还提供了不同的滞回以避免重复切换。例如，在晚上，窗户会保持关闭更长时间，以便为晚上储存一些热量。脚本还负责在控制面板的
    LCD 显示器上显示当前值并写入日志，你可以在 Web 应用中查看这些日志。计划的操作记录在消息日志中，异常情况也记录在单独的错误日志中，例如传感器故障或超过最大或最小限制，因为错误和警告会保留较长时间。在一天结束时，你可以通过快速检查应用来发现发生了什么。相应的切换值默认在源代码中定义为常量。如果需要，稍后可以在
    EEPROM 中自定义这些常量，你也可以从 Web 应用写入这些常量。为了让应用能够正常工作，脚本在连接丢失后会定期尝试重新连接。确切时间也会定期同步。通常，如果可能，Raspberry
    Pi 的 MicroPython 解释器永远不应停止；你希望无论发生什么都能保持控制。然后我通过外壳将线引到电机、风扇、加热器、门触点、温度传感器和网络连接，确保一切都是防水的。所有的室外电线首先连接到内部的接线端子上，以便外壳可以从安装的其他部分进行单独测试。


