- img_proc: true
  md: '# Project Description


    This project demonstrates the linking mechanisms available in VoiceXML. A client
    calls the Information Center on Mars Colony 7. The automated telephone assistant
    greets the user and offers information on a list of subjects. The user chooses
    a subject from the main menu. For ease of script maintenance, the data for each
    of the subjects is stored in a separate document and accessed by links from the
    main document. The information on the subject is gathered from the external documents
    and output to the user.


    To complete this project, you will:


    +   1. Create a Welcome template.

    2. Use <goto> to control call flow.

    3. Build conditional processing in fields.

    4. Create global links.

    5. Develop a <menu> of items.

    6. Link menus as hierarchies.

    7. Consolidate responses with <subdialog>.

    8. Handle requests dynamically with <submit>.


    # You Will Need


    +   - A connection to the Internet

    - A developer''s account with a voice portal

    - Example scripts from cafe.beocal.com/wiley/10projects

    - A Web server capable of CGI processing

    - Perl script for handling dynamic processing


    VoiceXML Elements Used in This Project


    | ELEMENT NAME | DESCRIPTION |

    |---|---|

    | <block> | A container of (noninteractive) executable code |

    | <choice> | Defines a menu item |

    | <else> | Used in <if> elements |

    | <elseif> | Used in <if> elements |

    | <enumerate> | Shorthand for enumerating the choices in the menu |'
