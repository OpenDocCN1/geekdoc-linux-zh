  md: '# Building Basic Pages with VoiceXML 41


    VoiceXML Elements Used in This Project (Continued)


    | ELEMENT NAME | DESCRIPTION |

    | <grammar> | Specifies a speech recognition or DTMF grammar |

    | <help> | Catches a help event |

    | <if> | Simple conditional logic |

    | <noinput> | Catches a noinput event |

    | <nomatch> | Catches a nomatch event |

    | <prompt> | Queues speech synthesis and audio output to the user |

    | <vxml> | Top-level element in each VoiceXML document |


    Source: VoiceXML 2.0 Working Draft, section 1.4


    # Call Flow


    Figure 1.1 shows the call flow that will be used for the final application. The
    user places a call to the application, hears a greeting, and is given some basic
    information. A yes or no response is elicited from the user; the VoiceXML output
    is based on the user’s response. Error checking verifies that the user has input
    a recognizable response before the application continues and concludes processing.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_63_0.png)


    **Figure 1.1** Call flow of a basic VoiceXML application.'
