  md: "# User Authentication 135\n\nAs an example, the second phrase, open sez me,\
    \ is mapped to the phone number 7183990000. When the speaker inputs the phrase\
    \ open sez me, the value 7183990000 is stored in the password field variable.\
    \ This value can now be accessed through a call to the variable and compared against\
    \ the caller's actual phone number.\n\n# Error Checking\n\nThere are three possibilities\
    \ for user error when inputting a password. The simple one is the <input> event\
    \ where the user fails to speak. In our application, this is handled by the platform's\
    \ default noinput handler.\n\nA <nomatch> event will be thrown if the caller speaks\
    \ a password that is not recognized as part of the default grammar. Attribute\
    \ count are set in the <nomatch> elements on lines 47 and 50. When a password\
    \ is not accepted the first time through, the user is prompted to repeat the input,\
    \ just in case there a simple mistake. If it happens a second time, it is assumed\
    \ that the caller should not be accessing the system and person is booted off\
    \ the <goto> element on line 56, which sends processing to the goodbye form.\n\
    \nA third possibility is the caller will speak a phrase that is recognized as\
    \ an acceptable password. This will send processing to the <filled> element starting\
    \ on line 59, which we will look at in the Processing section.\n\n# <log> Elements\n\
    \nA new element implemented in the VoiceXML 2.0 specification is the <log> element.\
    \ With it you can insert messages into the Log Browser to track specific events\
    \ during calls to your application. It is used in our project to track users who\
    \ have reached the <nomatch> event twice while trying to login. After a warning\
    \ to the user is output on line 51 confirming login was unsuccessful, a message\
    \ is sent to the log file specifying the Automatic Number Identification of the\
    \ user.\n\nThe label of the <log> element precedes the message output to the Log\
    \ Browser. This is useful when an application is tracking multiple <log> outputs.\
    \ The <log> element may also carry an expr attribute that outputs the content\
    \ of an ECMAScript expression. Both the label and expr attributes are optional.\n\
    \nView the messages through the Log Browser in BeVocal. A snippet from the output\
    \ of Listing 4.2 follows:\n\n```\nFIA: Process Phase\nSearching for handler for\
    \ nomatch; count = 2\nExecute Content for <nomatch> at line 50\nUNSUCCESSFUL LOGIN:\n\
    \  Unsuccessful attempt to login from:\n  0\nnGOTO : next attribute is: #goodbye\n\
    ```"
