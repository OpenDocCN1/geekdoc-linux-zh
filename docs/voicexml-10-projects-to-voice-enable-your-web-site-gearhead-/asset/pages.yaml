    # Insert Meta Data for the Project Description


    Meta data is information about the VoiceXML application that is used to identify
    the application to other programs. The information is not heard or viewed by the
    user of the application, but it is useful for storing author information, search
    engine terms, and other application-specific items. Listing 1.7 shows the basic
    meta data elements that are recommended by the W3C.


    ```

    <xml version="2.0">

    <meta name="author" content="Eliza, Counsel to the Universe/"

    <meta name="copyright" content="Mars Colony 7: 2041/"

    <meta name="description" content="Welcome to Mars Colony 7, the solar system''s
    premier

    jumping off point for the rest of the universe."/

    <meta name="keywords" content="Mars, colony, space vacancies/"

    <meta name="maintainer" content="DynamicData@colony7.mars.solarsystem/"

    <meta name="robots" content="robot-rules.txt/"

    ```


