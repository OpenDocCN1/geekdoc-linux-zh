    # # Accessing External Resources


    Not only can the <goto> element be used to transfer processing within a single
    document, but it can also transfer to external resources. The <goto> elements
    all point to items within the document in the current script. To make the application
    more robust, they can point to a URI instead, allowing content to be stored as
    external resources. Isolating content to external resources makes it possible
    to build an application that does not have to be reprogrammed every time the content
    changes.'
