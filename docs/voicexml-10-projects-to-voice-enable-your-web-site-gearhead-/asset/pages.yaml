  md: '# PROJECT 4

    User Authentication


    In the early days of the World Wide Web, the network resembled a close-knit neighborhood.
    Everyone knew everyone else, free information was available, and anyone could
    participate. With the advent of e-commerce and online business, the game has changed.
    Private networks are using the resources of the Internet, allowing access to privileged
    information such as customer records, proprietary company data, and personalized
    account information. This project looks at several solutions for validating users
    through voice authentication procedures.


    | THE PROBLEM |

    | Web sites need ways to block users from gaining access to private information
    and to log in users to refine the user’s profile. |

    | THE SOLUTION |

    | Create a user authentication system, using multiple ways to confirm the user’s
    identity. |'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Project Description


    Web developers have created login systems for their Web sites, which include requesting
    usernames and passwords before allowing users to gain access to secure or paid
    materials. VoiceXML is capable of using these existing resources plus voice authentication
    as another way of verifying the identity of the user. This project devel-ops three
    levels of security using the caller''s phone number, a username/password combination,
    and a voice print recognition system.


    To complete this project, you will:


    +   1. Test the caller''s phone number.

    2. Activate password protection.

    3. Make a voice print.

    4. Verify a user through voice recognition.

    5. Create an application using the three methods of security.


    # You Will Need


    +   - Bevocal developer account

    - voicePrintRegistration.vxml

    - login.xml

    - Download example files: cafe.bevocal.com/wiley/10projects


    VoiceXML Elements Used in This Project


    | ELEMENT NAME | DESCRIPTION |

    | <assign> | Assigns a variable value |

    | <block> | A container of (noninteractive) executable code |

    | <catch> | Catches an event |

    | <else> | Used in <if> elements |

    | <field> | Declares an input field in a form |

    | <filled> | An action executed when fields are filled |

    | <form> | A dialog for presenting information and collecting data |

    | <goto> | Go to another dialog in the same or different document |

