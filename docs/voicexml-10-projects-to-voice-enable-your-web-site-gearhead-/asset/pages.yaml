    # ## <var> Elements


    A <var> element is useful when a string value is used several times in the same
    application. In this instance, the company name will be repeated three or four
    times within various forms throughout the application. This makes it simple to
    change the output of the name where it appears in the application by changing
    the value stored in the variable.


    A <var> element can carry two attributes: name and expr. The value of the name
    attribute is used to access the content of the variable, which is stored in the
    expr attribute. Literal content and dynamically generated content can be stored
    within the variable. Literal content, such as the name of the company, must be
    single quoted'
