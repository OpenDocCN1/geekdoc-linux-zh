    # Create a VoiceXML Grammar


    Aside from starting Brainhat in a different mode, the only other thing we have
    to do is craft a grammar for the voice portal. You already know how grammars are
    made from your work in previous chapters. This grammar will be slightly different
    in that it will try to capture dynamic dialog.


    Listing 10.36 is a grammar to support the questions and statements the program
    may need to handle, plus the individual adjectives, nouns, verbs, and so forth,
    to support the dialog. The grammar is saved in the file brainhat.gram. As you
    continue to develop the application, add more terms to the grammar file to extend
    the recognition of phrases.


    As a grammar becomes more complicated, it offers opportunities for misrecognition.
    The best results come when you constrain the grammar to the dialog expected. Large
    grammars can also be precompiled as binary files for more efficient access. Check
    the documentation on your platform for techniques for precompiling grammars.


    > Create the grammar file from Listing 10.36 and store it at the root level of
    the Brainhat server. Save it as brainhat.gram.'
