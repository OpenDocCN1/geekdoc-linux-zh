  md: '# Create the Data File (XML)


    Creating a robust XML application involves separating the data from the formatting
    of the data. In the Quiz Generator application, the data for each quiz is stored
    in an XML file. It is marked up with a set of predefined tags that define what
    the data is. When examining the quiz application in Listing 8.4, a definite structure
    can be found. Each question, or quotation in our case, has the following elements:
    a quotation, a set of answers, and a hint. The answer items will be used as the
    correct responses we are looking for the user, in other words, the grammar.


    Let''s walk through the process of building an XML file from an existing source
    of data. We are trying to build a generic application that will handle any quiz
    or survey data source by isolating the data from the formatting of the data. The
    XML file will hold the data, and the XML file will hold the formatting.


    > For simplicity, the data in this project is stored in a text file. It could
    also have been generated dynamically from a database or from a combination of
    multiple data sources.


    # Analyze the Data


    The data for the Star Trek Quotation Game is embedded within the VoiceXML file
    created as the first part of our project. Listing 8.5 is an outline of the various
    elements and attributes of file and how they are related in a hierarchical structure.
    The value of looking at the hierarchy is how it helps to define the structure
    of the XML document should be without having to worry about data.


    The <xml> element contains elements at the child level: <link>, <help>, and <form>.
    Everything in the file is a child or descendant of one of three elements. <link>
    and <help> are relatively simple elements. <link> carries a single attribute and
    grammar to define what utterances activate the link. The <help> element is basically
    audio output with text in the case source file can''t be fetched in time.


    The bulk of the structure of the document is within the <form> element. <form>
    has three child elements that contain multiple levels of other elements. We will
    break down each of the main elements as we develop the XSLT stylesheet in the
    next section.


    ```

    1. <xml>

    2.

    3. <link>

    4.    src (attribute)

    5.    <grammar>

    6.

    7. <help>

    8.    <audio>

    9.    src (attribute)

    10.  fetchtimeout (attribute)

    ```


    Listing 8.5 Hierarchical structure of quiz game data.'
