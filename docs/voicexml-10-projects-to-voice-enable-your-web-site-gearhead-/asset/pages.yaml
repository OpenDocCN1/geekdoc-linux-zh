  md: '# Scope of Variables


    Listing 5.5 expands the greeting form to include the use of the companyName variable
    that was declared as a global variable at the top of the application root document.
    Variables can also be scoped to more explicit levels within the application.


    As we have seen in previous projects, variables can be declared with the <var>
    element or as a field-level item that can be accessed through the items name.
    The scope of the variable is defined by context within the VoiceXML application.
    Session variables are set by the platform and are available as read-only values
    through session.telephone.* calls.


    Application-level variables are set with the <var> element as the application
    root document, making them globally accessible to all leaves of the application.
    Leaves within the application may individually contain document-scoped variables
    that are set as children of the root element of that document. They are in scope
    for the time the document is accessible.


    Forms and methods limit the scope of their content to the document level. Variables
    are finally scoped at the anonymous variable within a <block>, <catch>, or filled=element.


    > The companyName variable has been declared at an application level. Variables
    may also be declared at document level for a single document or dialog level for
    a single dialog. Section 5.1.2 of the VoiceXML 2.0 Working Draft discusses the
    scope of grammars within variables.


    > Expand the greeting in the templates.xml file to include the companyName variable.
    Place a phone call to your application to verify that companyName has expanded
    properly.


    # The Goodbye Template


    Graceful termination of the application is handled through the goodbye template.
    At various locations within the application, processing is sent to the goodbye
    dialog to exit the script. This also gives a developer a chance to start without
    having to disconnect and place another phone call.


    **Listing 5.6** Goodbye. (continues)'
