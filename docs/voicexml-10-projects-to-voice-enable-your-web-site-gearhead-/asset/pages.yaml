  md: '# Project 3


    The bridge attribute specifies whether processing should be sent back to the calling
    application once the call has been terminated. The default of bridge is set to
    true on the BeVocal platform.


    By default, all BeVocal transfers are bridge transfers that return control to
    the calling script.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_140_0.png)


    The value of the dest attribute is the phone number to be dialed. Long distance
    phone numbers may be preceded by an optional 1. The BeVocal platform allows them
    in 5 formats:


    ```

    phone://8005551212

    800-555-1212

    phone://800-555-1212

    tel:800-555-1212:postd=123

    ```


    The last example dials an extension number after the main number has been reached.
    Check your platform''s documentation for specific formatting requirements.


    # Checking the Return Results


    Once the transfer is made, error checking is handled within the <filled> element,
    beginning on line 13. The covid attribute uses the name of the <transfer> element
    as the condition to be checked. Busy signals, called-party disconnects, and answers
    on the receiving end are all handled with descriptive messages to the user followed
    by an order return to the main menu.

    <transfer> elements are field-level elements that allow processing to fall through
    to the next item within the <form>. Once the <filled> element has completed processing
    on line 27, the returnToMenu<field> is automatically accessed. It is set to the
    type boolean, using the true/false grammar provided by the platform. On line 32,
    a <prompt> is output, offering the user to return to the main menu. A positive
    response transfers processing to the top of the menu. Otherwise, a courtesy message
    output and the connection is terminated.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_140_1.png)


    Set up a call transfer within your application. Test the application by changing
    the phone number to access your private voicemail system or long distance phone.


    # Completing the Script


    The main sections of the Contact Us script are now completed. To finish the script,
    we need to add greeting and goodbye forms, global help, and a link for restarting
    the application, and we will need to add changes to the existing forms to access
    the new sections. Listing 3.8 shows the completed script.'
