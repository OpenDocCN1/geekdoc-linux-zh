    # # Final Thoughts


    The voice authentication routine coupled with a phone number verification list
    is currently one of the most secure methods of using VoiceXML for verifying a
    user. Voice recognition solves problems for the user as as the system administrator.
    The caller will not have to remember username and combinations, and the system
    will no longer have to maintain and distribute a list of new passwords every month.


    An improvement to this project would be to generate the secure phone numbers dynamically
    from a database instead of hard-coding them into the application.


    The listings for this project can be downloaded from the BeVocal Web site at cafe.bevocal.com/wiley/10projects.
    They are saved as text files, used as templates for creating your VoiceXML scripts.


    In the first projects, we developed many of the components that will be needed
    when developing your own applications. The next project will revisit each of the
    projects and extract sections of code that can be modularized and stored as separate
    routines, accessible as modules for all of your VoiceXML applications.'
