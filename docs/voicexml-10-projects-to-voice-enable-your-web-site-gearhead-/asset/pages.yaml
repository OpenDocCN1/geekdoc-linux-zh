  md: '# Quiz Generator 237


    VoiceXML Elements Used in This Project


    | ELEMENT NAME | DESCRIPTION |

    |---|---|

    | <assign> | Assigns a variable value |

    | <audio> | Plays an audio clip within a prompt |

    | <block> | A container of (noninteractive) executable code |

    | <catch> | Catches an event |

    | <exit> | Exits a session |

    | <field> | Declares an input field in a form |

    | <filled> | An action executed when fields are filled |

    | <form> | A dialog for presenting information and collecting data |

    | <goto> | Go to another dialog in the same or different document |

    | <grammar> | Specifies a speech recognition or DTMF grammar |

    | <help> | Catches a help event |

    | <link> | Specifies a transition common to all dialogs in the link''s scope |

    | <noinput> | Catches a no-input event |

    | <nomatch> | Catches a no-match event |

    | <reprompt> | Plays a field prompt when a field is revisited after an event |

    | <xml> | Top-level element in each VoiceXML document |


    Source: VoiceXML 2.0 Working Draft, section 1.4


    # Application Call Flow


    Figure 8.1 shows the call flow for this application. A welcome message greets
    the caller and then a set of instructions for using the quiz is output. A series
    of questions is asked, each question allowing two chances for a correct response
    before giving the correct answer and moving to the next question. At the end of
    the quiz, the application terminates with a goodbye message.'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Project 8


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_260_0.png)


    Figure 8.1 Application flow.


    #  Create a Simple Quiz


    The Quiz Generator project is built in three phases. First, we''ll create a simple
    quiz to use as a template for adding the questions. Once the questions have been
    generated, voice prompts are recorded for replacing the TTS prompts. The final
    phase is to create an XML/XSLT application that will be able to access data dynamically
    to create any number of quizzes.


    # The Basic Template


    A simple quiz format is shown in Listing 8.1. It contains three forms for creating
    dialogues: *greeting, questions, and goodbye*. We have seen the *greeting* and
    *goodbye* forms in most of the previous projects. The *greeting* form holds a
    prompt that welcomes the user to your quiz, survey, or game. The prompt should
    announce the name of the application and give any other information users need
    to confirm that they are in the right place. The *goodbye* form is used as a graceful
    exit from the program, confirming verbally that processing has completed, disconnecting
    from the caller, and closing all open tags.'
