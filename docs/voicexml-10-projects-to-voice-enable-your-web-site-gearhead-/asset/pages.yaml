    DTD holds descriptions of the elements that will be part of the tag set. Each
    element is defined as a content model, specifying which other elements and attributes
    are associated with that element. The tag <ELEMENT> is used to define the content
    model for each element. The ELEMENT keyword is followed by the name of the element
    that is to be defined. Parentheses hold the content model for the element, ending
    with an optional quantifier. Let''s see how this is put into action.


    Line 1 of Listing 4 defines the top-level element, or root element, as <trains>.
    According the syntax rules for XML, there can be only one root-level element.
    This element will be the container of all other elements in the data. By looking
