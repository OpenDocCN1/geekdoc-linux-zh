  md: '# Creating Links


    > Most voice portal developer accounts do not make a complete URL address available
    for returning to the calling application. As a work-around, place a copy of your
    links.xml project script into the same directory as the Perl script on your Web
    server. Use it to verify that everything is working properly. When the call to
    the script is made, it will use the copies of the VoiceXML scripts to continue
    processing.


    Install the Perl script on your Web server. Copy your links.xml, links-changes.xml,
    and previous-visitor-info.xml scripts into the same folder. Run the project through
    multiple scenarios, preferably using batch processing.


    # Final Thoughts


    VoiceXML linking is much more powerful than HTML because of the many ways which
    links can control the process flow of an application. This project examined five
    ways to create links within a VoiceXML application: <goto>, <menu>, <link>, <dialog>,
    and <submit>.


    The use of hierarchical menus is one of the best ways to make your voice applications
    user friendly. The template developed in this project can be easily transformed
    into a help desk, office FAQ, or information kiosk. It can also be used as an
    entrance to a site of multiple voice applications: Build a menu pointing to each
    application and let the user choose which one to hear.


    The listings for this project can be downloaded from the BeVocal Web site at cafe.beocal.com/wiley/10projects.
    They are saved as text files, useful as templates for creating your own VoiceXML
    scripts.


    The next project will continue to use links as we develop a generic contact application
    that will give your clients various ways to contact your company.'
