  md: '# VoiceXML Elements Used in This Project (continued)


    | ELEMENT NAME | DESCRIPTION |

    | --- | --- |

    | <form> | A dialog for presenting information and collecting data |

    | <goto> | Go to another dialog in the same or different document |

    | <grammar> | Specifies a speech recognition or DTMF grammar |

    | <if> | Simple conditional logic |

    | <link> | Specifies a transition common to all dialogs in the link''s scope |

    | <meta> | Defines a meta data item as a name/value pair |

    | <noinput> | Catches a nomatch event |

    | <nomatch> | Catches a nomatch event |

    | <object> | Interacts with a custom extension |

    | <prompt> | Queues speech synthesis and audio output to the user |

    | <reprompt> | Plays a field prompt when a field is revisited after an event |

    | <return> | Returns from a subdialog |

    | <subdialog> | Invokes another dialog as a subdialog of the current one |

    | <value> | Inserts the value of an expression in a prompt |

    | <var> | Declares a variable |

    | <xml> | Top-level element in each VoiceXML document |


    Source: VoiceXML 2.0 Working Draft, section 1.4


    # Application Call Flow


    Figure 9.1 shows the call flow for this application. The call is answered with
    a greeting, transferring the user to the main menu. The user selects a discipline
    of dance, music, or theater and is prompted for a date. Events of the type selected
    are read back to the user. Once the output of that date is completed, the user
    may select another event and end the call. The application terminates with a polite
    goodbye message.'
