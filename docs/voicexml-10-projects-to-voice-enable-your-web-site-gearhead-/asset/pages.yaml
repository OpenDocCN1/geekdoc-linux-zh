    Because of the fields within an application document contains a unique name attribute,
    the fields can be accessed directly when making a call to the document. Notice
    the use of the number sign on line 32 to specify a certain location, a fragment
    identifier, within the called document. A fragment identifier may also be used
    without reference to a URI, transferring processing to another form within the
    current document.


    You can access a specific location within a document using a fragment identifier.


    If the condition on line 30 is false, processing falls through to the <else> condition
