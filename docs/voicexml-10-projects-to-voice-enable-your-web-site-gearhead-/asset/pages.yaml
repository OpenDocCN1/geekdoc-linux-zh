- img_proc: true
  md: '# PROJECT 6

    Telephone Dialer


    How many different places do you have phone numbers stored? If you are like most
    busy people, you have at least three: a little black book, an online address book,
    and a PDA. What these methods lack is a way to access those numbers without having
    to carry them around with you.

    This project builds a simple vocal telephone dialer that stores names and phone
    numbers and allows you to access them through one phone number. You access a phone
    number in your list by speaking the name of the person you want to call. The application
    will retrieve the phone number and dial it for you. All you have to do is remember
    the phone number that accesses your contact list.


    | THE PROBLEM

    Whenever you need to retrieve a phone number, whether at home, at work, or on
    the road, you have to find your address book, look up the phone number, and dial
    it. It is almost impossible to keep track of all telephone resources through one
    central source. |

    THE SOLUTION

    Create a comprehensive telephone directory that can be accessed by you through
    one toll-free telephone number.|'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# Project Description


    The user inserts a list of phone numbers into the VoiceXML script. Each phone
    number is associated with a unique user through a defined grammar. The caller
    dials the phone directory number and speaks the name of the person or business
    to dial. The program transfers the call to the phone number associated with the
    business or person. To complete this project, you will:


    +   1. Build a contact list.

    2. Map a name to a telephone number.

    3. Confirm user input with implied prompts.

    4. Group items in a grammar.

    5. Create multiple tokens as a single item in a grammar.

    6. Refine the contact list.

    7. Allocate multiple phone numbers for one contact.

    8. Control data type output.

    9. Transfer the call to the contact number.

    10. Place another call without disconnecting.

    11. Localize help and error messages.

    12. Put it all together.


    # You Will Need


    +   ✔ An account with BeVocal

    ✔ List of phone numbers and locations to call

    ✔ Download example files: cafe.bevocal.com/wiley/10projects


    VoiceXML Elements Used in This Project


    | ELEMENT NAME | DESCRIPTION |

    | <assign> | Assigns a variable value |

    | <block> | A container of (noninteractive) executable code |

    | <disconnect> | Disconnects a session |'
  merge: -1
