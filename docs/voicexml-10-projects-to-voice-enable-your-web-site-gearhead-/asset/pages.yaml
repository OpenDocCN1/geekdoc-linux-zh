    \ will be the one that Brainhat uses when referring to the concept. This may be\
    \ changed in a later version of Brainhat, randomizing the output to give it more\
    \ life-like qualities.\n\nCreate a synonym list for accommodations. Check the\
    \ output from the server to confirm it is returning acceptable responses.\n\n\
    # Extend the Scenario\n\nBuilding a scenario from the FAQ list is the fun part.\
    \ You get to play around with different ways of asking the same question and test\
    \ how the FAQ engine responds. \n\nThere are two levels of definitions within\
    \ a scenario file: facts and propositions. Facts are explicit statements of known\
    \ facts as “Brainhat is a Martian,” Brainhat has accommodations,” or “Colony Seven\
    \ is on Mars.” Propositions are usually if/then conditional statements that can\
    \ infer relationships based upon context. You'll see them referred to as inference\
    \ templates in A.I. jargon. It is easiest to define the facts before tackling\
    \ the propositions, so you'll start there.\n\n# Defining Facts\n\nFacts are statements\
    \ that the FAQ engine is absolute of. They are statements that give specific objects\
    \ properties that can be used to build inferences within the propositions. The\
    \ FAQ engine has basic facts about itself and Mars Colony 7. The FAQ engine knows\
    \ that it is being programmed and understands that any fact that refers to you\
    \ is talking about, and any reference to a speaker is referring to the person\
    \ who is talking the engine.\n\nDeclarations of facts in a scenario must contain\
    \ words that are defined within the Brainhat vocabulary files, the default words\
    \ file or a standalone file included within the data.ini file. If a word is not\
    \ recognized, Brainhat will try to respond but use the word in place of the requested\
    \ item. If Mars is not defined, a question like “Where is Mars?” will return an\
    \ answer of “Where is something?” If a nonsensical statement is returned in response\
    \ to a question, that means the FAQ engine does not understand what is being asked.\
    \ When “Where is Mars?” returns “the program is not sure what you are asking.\
    \ Check your vocabulary file to verify that the word has been defined and your\
    \ list of facts contains a reference to the location of Mars.\n\nSome facts about\
    \ Brainhat have already been programmed into the basic scenario that started with\
    \ Listing 10.0. Brainhat knows its name, that it's green, and that it is a Martian.\
    \ We have seen that the FAQ engine has two places to store scenarios: The Brainhat.init\
    \ file at the root of the server directory contains the initial file of facts\
    \ and propositions that will be loaded by default when the FAQ engine is started.\
    \ There is also a scenario that holds various scenarios for other types of dialog.\n\
    \nListing 10.8 adds some facts to the scenario that was started earlier. Lines\
    \ 8 and 9 are simple facts about the speaker, lines 11 through 14 are a list of\
    \ attributes Brainhat can expect to be questioned about the caller. In this project,\
    \ we will be handling the information about accommodations and put simple place-holder\
    \ responses for the three other facts."
