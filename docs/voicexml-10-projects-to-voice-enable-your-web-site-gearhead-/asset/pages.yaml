  md: '# Setting Up the Working Environment


    # Testing Your Environment


    After looking over the BeVocal developer environment, verify that your account
    is set up and working properly. Click Vocal Scripter in the left-hand column of
    any development windows. A new window will pop open. Wait a few seconds while
    the Java application loads. Click the Dial button and verify that your script
    runs by checking the output in the right-hand window. You will see that Dialing
    is progress, followed soon after with a Connection established message. The script
    will run, outputting "Hello World." At this point, the session ends because there
    are no more events to process.


    Congratulations! Your working environment with BeVocal is set up properly and
    you are ready to start coding your first project.


    +   Testing the Hello World application through the Vocal Scripter, place a call
    to your account through the BeVocal line at 877-338-6225.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_57_0.png)


    # Final Thoughts


    The easiest way to get VoiceXML application development is by using the free online
    services. We will be using the BeVocal Cafe as our development environment for
    the projects in this book. Other voice portal services are available through HeyAnita,
    TellMe, VoiceGenie, and various other online companies. They offer an assortment
    of development tools and extensions to the VoiceXML platform that are comparable
    to the BeVocal environment. Choose the environment that feels most appropriate
    to you and set up an account.


    After testing your environment, you will be ready to start coding your first VoiceXML
    application. The first five projects create templates for the components of most
    Web sites: content, links, contact information, and secure login. We’ll start
    with creating a basic VoiceXML page.'
