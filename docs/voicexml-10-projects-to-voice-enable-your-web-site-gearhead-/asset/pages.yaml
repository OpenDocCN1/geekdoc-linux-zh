    the user''s name will be used to recognize the user upon entrance to the system;
    therefore the first <register> element is used as basis of the voice print.


    +   Create a <register> element that prompts for a voice sample of the exact phrase
    they will use when logging in to the voice authentication system.


    <register> can carry four attributes:


    +   - name: A name for the item

    - type: Built-in data type supported by the platform

    - keyExpr: Unique value for identifying the voice print

    - mode: Determines how the sample should be processed


    The attribute of <register> element is a unique field that holds the recognized
    input from the user when a sample is taken. Instead of creating a specific grammar
    for the field, an optional attribute can be used to dynamically construct grammar
    for boolean, date, digits, and other built-in types, as discussed in Project 1.
    See * in the Authenticating a User Through Voice Recognition section.


    <register> element carries a mode attribute, specifying how the sample should
    be handled by the verifier. A mode can have three values: delete, skip, or adapt.


    The deleteExpr removes any existing voice print from the application platform
    that matches the keyExpr. This is used to create a new voice print for the user
    and should only be used in the first <register> element of the sequence.


    Subsequent <register> elements within the form use adapt to request more speech
    patterns for refining the voice print. A value of skip within the mode attribute
    instructs the processor to skip over the <register> element. This is useful when
    the first <register> element when users needs to refine their voice without generating
    a new key.


    > The delete value of the mode attribute in <register> should only be used in
    the first occurrence of the <register> element. If used with other <register>
    elements, it will delete the existing voice print, not refine it. The adapt mode
    when refining a voice print.'
