    # XML Syntax


    XML has a simple set of syntax rules:


    +   - Tags are case sensitive. <Area> and <a> are different elements. By convention,
    element names should be lowercase.

    - The XML document must begin with an XML declaration that states the XML version
    number. The declaration must be the first character, first position of the document.

    - There can only be one root element in XML data. The element is a container for
    all of the other elements and data in the file.

    - Each element must have an opening and closing tag. Unlike HTML, where <img>,<br>,
    and <li> do not have a closing tag, an XML parser will throw an error if the tag
    is not closed. For shorthand, use a slash to close an element that does not have
    any content or closing tag: <br/>.

    - Elements may nest within each other, the last element must be the first one
    closed. Overlapping elements will cause the XML parser to throw an error. <b><i><MTA><b></b></i></b>
    is considered an error, whereas <b><i><MTA><i></b></i></b> would display properly.

    - It is mandatory to use attribute values. Single or double quotes may be used.


    Most Web browser vendors have created what they consider "smart" browsers. If
    the HTML code is missing a closing tag or an attribute value is not quoted, the
    browser will try to display the page anyway. This will not happen with XML. A
    simple thing like improper nesting of elements will stop the application and supply
    an error message pointing, it is hoped, to the offending line.


