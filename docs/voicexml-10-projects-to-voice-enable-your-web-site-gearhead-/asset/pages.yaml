  md: '# PROJECT

    2

    Creating Links


    One of the reasons the World Wide Web continues to grow is because it gives programmers
    the ability to create links to a wide array of resources. A “mom and pop” online
    bookstore can sell any book in print by linking to Amazon, Barnes and Noble, or
    Books-A-Million. VoiceXML has several ways to create links. In this project, we
    will investigate the tricks and traps associated with vocal linking by creating
    an information resource for the Mars 7 Colony Visitor’s Bureau.


    | THE PROBLEM |

    | A VoiceXML application that has any kind of complexity will use multiple data
    sources and content resources for its output. How can the application access the
    data sources through one central document? |

    | THE SOLUTION |

    | Create complex application flow using the various linking mechanisms available
    in VoiceXML to access a variety of data sources, internally and externally. |'
