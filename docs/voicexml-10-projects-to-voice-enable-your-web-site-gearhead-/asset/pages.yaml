    # Attributes of the <transfer> element


    Attributes of the <transfer> element control processing during the transfer of
    the call. The *name* attribute of the <transfer> element is a unique identifier
    that holds the return results of the transfer. *name* can be used to check the
    return value from the bridge transfer and process the outcome accordingly. The
    conditional checks on lines 14 through 26 of Listing 3.7 have appropriate responses
    based upon whether the return value for the transfer was busy, *far_end_disconnect*,
    or *noanswer*.


    > For a comprehensive list of available return values, see section 2.3.7 of the
    VoiceXML 2.0 Working Draft.


    timeout attribute specifies a time in seconds for the transfer to try to reach
    the number called. The default value is determined by the platform. If a connection
    has not been made in the time allotted, a noanswer value is set in the attribute.
    Our application handles the *noanswer* value on line 21, informing the user that
    the number called has been reached but has not connected. *maxtime* limits the
    length of the call once it has been transferred. This attribute is useful for
    enforcing a maximum time limit on each call. Most voice portals enforce a time
    limit on transferring calls because of the potential for abuse. BeVocal has a
    60-second limit on each transfer.


    Because of the possibility of developers abusing the <transfer> function, most
    voice portals portals limit free developer accounts to a maximum of 60 seconds
    for a transferred call. The time restriction is not part of the VoiceXML specification.'
