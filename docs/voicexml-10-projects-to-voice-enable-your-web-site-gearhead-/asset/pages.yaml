    Keep a copy of Listing 1.4 so that you can compare the script to what is seen
    by the FIA.


    When a XML application is accessed, the FIA accesses the first form in the default.
    Lines 1 and 2 of Listing 1.6 confirm that the FIA has accessed a form whose id
    is greeting and whose grammar scope is set to dialog. Looking at the script in
    default 1.4, you will find that the scope for the form''s grammar is not set,
    so the default value of scope is set by the platform.


    The Initialization Phase referred to on line 3 sets the count in all applicable
    fields to 1 and initializes all field-level variables to undefined or an expr
    value supplied by the developer. When a variable is set or undefined, it makes
    that field accessible during the selection phase. The developer may set a default
    value for a field item that would make the FIA skip over the item during processing.
    We will see for this when we look at the <clear> element in another project.


    In addition to a variable, each field-level item also contains a guard condition
    that is set to true by default. The guard must be true in order for it to be accessible
    to the FIA. The developer may insert a conditional statement within the expr attribute
    to evaluate whether the item should be accessed.


    Line 11 of Listing 1.4 has a <block> element that is initialized to begin the
    FIA processing of the greeting form. The guard condition for the block is checked
    on line 6 of Listing 1.6 to proceed to the next phase of selection. The block
    item is then selected, the variable of the block is set to true on line 9, and
    the content of the block is executed. Access to the <goto> element is confirmed
    on line 12, using the transfer of processing to the maincontent form.


    Because there is no collection phase in a <block> element, the prompts are queued
    and ready to play. Line 15 of Listing 1.6 confirms that a TTS prompt is being
    output. Once the processing has been completed, the FIA begins again within the
    maincontent form, having been explicitly stated from the <goto> element on line
    12.


