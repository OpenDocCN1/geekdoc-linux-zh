    #  <nomatch> and <noinput> Elements


    If the developer has not provided an explicit notch event, the platform must handle
    the event with a message such as “I’m sorry, I didn’t understand.” Default handlers
    for <help>, <nomatch>, and <noinput>-events are mandated by the VoiceXML 2.0 specification.
    Within the specification, see section 5.2.5 for a comprehensive list of default
    handlers.


    > The VoiceXML 2.0 specification mandates specific events such as <help>, <nomatch>,
    and <noinput> have default values set by the platform. The developer may override
    the platform responses by invoking explicit handlers for the events.


    The <nomatch> and <noinput> elements on lines 27 through 55 override the platform-supplied
    error messages.

    The count attribute in each of the <nomatch> and <noinput> elements keeps track
    of the number of times the user has responded inappropriately to a prompt. There
    is no assigned limit to the number of <nomatch> or <noinput> elements that may
    be contained within a field, but a good user interface will offer some kind of
    exit after a limited number of errors. The exit could be a message stating that
