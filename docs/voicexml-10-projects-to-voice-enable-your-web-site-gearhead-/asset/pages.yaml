  md: '# 104 Project 3


    When creating values for a string variable, the value must be single quoted within
    double quotes, whereupon it will not be interpolated by the VoiceXML interpreter.
    A value within double quotes will be interpreted as a unique format, variable,
    or field name, not as a simple string.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_126_0.png)


    # Predefined Grammars


    VoiceXML provides built-in, predefined grammars for several data types. The built-in
    grammar is accessed through the <field> type attribute and is used to limit user
    input to a specific data type. The type attribute can hold various values such
    as boolean, currency, digits, phone, and other types supplied by the VoiceXML
    interpreter. The types are defined by the VoiceXML 2.0 Working Draft, section
    2.3.1.1, and are implemented consistently across platforms.


    A <form> handling a single <field>, snail starts on line 5 of Listing 3.1. The
    boolean built-in type will handle user input as a true or false response, making
    it unnecessary to create a grammar for this field.


    > Use a boolean type when responses to a prompt are a simple yes or no. The VoiceXML
    interpreter is able to handle boolean types of responses as input, making it unnecessary
    to create a grammar for the field.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_126_1.png)


    If a built-in type does not have a desired behavior, the developer must create
    an explicit grammar for that item. As an example, the developer might want the
    word sure to be considered a positive response from a user. The boolean type does
    not include sure as part of its vocabulary, so it will have to be created as a
    specific, field-level grammar by the developer.


    > Use the type attribute within a <field> element to access predefined grammars
    for fundamental data types. See section 2.3.1.1 of the VoiceXML 2.0 Working Draft
    for detailed explanations of available types. The list includes boolean, date,
    digits, currency, number, phone, and time types.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_126_2.png)


    # Pauses in Output


    Lines 8 through 17 in Listing 3.1 create a <prompt> that outputs the company name
    followed by the company''s address information. The <value> element on line 9
    carries an expr attribute that accesses the companyName variable. Note that the
    value is in double quotes so that the variable companyName can be interpolated.


    The <break> element is used to control the time span, or pauses, between spoken
    lines. This is useful when a long series of lines is being output, such as lines
    9 through 16, giving the user a chance to mentally process what is being said.'
