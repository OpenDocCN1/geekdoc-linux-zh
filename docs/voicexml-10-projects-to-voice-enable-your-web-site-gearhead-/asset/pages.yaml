- img_proc: true
  md: "# Project 8\n\n# Insert <audio> Elements\n\n <audio> element is useful for\
    \ replacing <prompt> tags with recorded input. <audio> element is more versatile\
    \ than <prompt>, allowing an src attribute to point to a sound that can be generated\
    \ by a prompt while allowing the TTS interpreter to speak the content of the element\
    \ if the source file is not available.\n\n <audio> element can carry an optional\
    \ exp attribute in the src attribute. An exp value is generated by a JavaScript\
    \ expression that evaluates to a URI or an array of URIs that will be played.\
    \ The fetchtimeout attribute is also available to force a timeout for fetching\
    \ the sound resource. By default, the timeout is 60 seconds, which will be free\
    \ for our application. The fetchtimeout attributes on lines 3, 11, and 19 of Listing\
    \ 8.3 are set to 1500 milliseconds, forcing the TTS to speak if the sound file\
    \ cannot be retrieved quickly. If the sound prompt cannot be accessed within amount\
    \ of time, the content of the <audio> element will be output by the TTS engine.\n\
    \n+   - Change the quotation prompts in your application into <audio> elements\
    \ that point to the files downloaded from the Star Trek in Sound and Vision site.\
    \ Test your application to verify the output.\n\n![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_268_0.png)\n\
    \nLast Updated on 11th July 2001. The latest update is a large collection of new\
    \ files as usual, but just one single page devoted to the Star Trek series, Enterprise.\
    \ See the News Page for details of additions.\n\nIf your browser[can] display\
    \ graphics properly, if you have a slow connection or you are downloading a lot\
