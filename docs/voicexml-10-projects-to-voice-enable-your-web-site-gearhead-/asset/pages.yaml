    # Miscellaneous Tools


    Other tools in the BeVocal arsenal are the Vocal Player, Vocal Debugger, Trace
    Tool, and Grammar Compiler. As your applications get larger and more complex,
    you will want to take advantage of the extensive capabilities of these tools.


    The Vocal Debugger and Trace Tool allow you to follow a script as it is running.
