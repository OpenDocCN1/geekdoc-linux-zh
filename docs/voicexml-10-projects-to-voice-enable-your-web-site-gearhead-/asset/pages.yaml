  md: '# Building Basic Pages with VoiceXML


    Beginning to use VoiceXML to build voice applications as an extension to your
    Web site is as simple as learning how to build your first Web page with HTML.
    VoiceXML has a predefined set of markup elements that can be applied to your online
    content for output. This first project will be used as a template for subsequent
    projects. It contains the basic building blocks that can be used as an underlying
    structure for expansion to production-level applications.


    | THE PROBLEM

    Most Web developers don''t have experience with voice applications. They need
    a step-by-step solution to get an initial project up and running.

    | THE SOLUTION

    Create a basic template that can be used for developing larger applications. Building
    the template includes creating, debugging, and deploying the template.|


    # Project Description


    This project starts with the construction of a simple Hello, World application
    to verify that the VoiceXML development system is working properly. From that
    point, the'
