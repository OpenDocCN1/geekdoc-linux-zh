  md: '# Test the Script


    We need to verify that the script is running properly by making a recording and
    then saving it. You must have a Web server that allows CGI script processing to
    run the test. If you currently have a Web hosting account that allows CGI processing,
    load the script to the server and test your application.


    For those without a hosting account, a simple way to run the test is to install
    an Apache server on your local machine and have the <subdialog> call point to
    the script within the cgi-bin. Running the VoiceXML from the Vocal Scripter at
    BeVocal will allow you to test your application without using the phone. There
    are couple works for the CGI processing if you are pointing to your local server.


    First, must change the beep attribute on the <record> element to false or the
    Vocal Scripter will throw an error. Second, the <subdialog> call must point to
    an IP address, which is currently set to localhost on line 64 of Listing 7.9.
    To find your IP address, use a DOS window and, at the prompt, enter ipconfig.
    The output will include the IP address that has been allocated for the current
    online session.


    > You can test the results of your Perl script by installing the Apache Web server
    on your local machine and pointing to a script on the server as the subdialog.
    This makes it easy to change the CGI script while your VoiceXML script is running.


    > Install the recording c script on your Web server. Change the path within the
    <subdialog> call of the VoiceXML application to point to the script. Test the
    application to confirm that it is saving the recordings to your Web server.


    # Access the Recordings


    Now that the recordings have been stored on the Web server, there needs to be
    a way to generate a list of the surf reports and make them available through a
    Web page or phone call. Listing 7.11 is a short Perl script that will dynamically
    create a listing of all the recorded files in the recordings directory.


    Line 1 specifies the path to Perl on the Web server. The use strict pragma on
    line 3 forces declaration of all variables; this is not mandatory in Perl. Line
    4 imports the File::Basename for use when extracting the filename from a long
    string. Line 8 uses the glob function in Perl to grab all the files in a specified
    directory that end with .wav and return the names as an array.'
