  md: '# Setting Up the Working Environment 21


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_43_0.png)


    **Figure 1** VoiceXML application process flow.


    Figure 1 shows the process flow of a typical voice application. The VoiceXML gateway
    answers the call, outputs a greeting, and then waits for input from the caller.
    The caller speaks a verbal command that is translated to text by the VoiceXML
    speech-to-text (STT) translator. The input is sent to the VoiceXML script for
    processing, returning a response that is reformatted into speech by the text-to-speech
    (TTS) translator. The dialog continues until the caller hangs up or the script
    is terminated.


    # VoiceXML Application Service Providers


    There are several application service providers that offer free access to environments
    that can be used to develop, test, and deploy your VoiceXML applications. The
    main providers are HeyAnita.com, BeVocal.com, TellMe.com, and VoiceGenie.com.
    Once you get beyond the pressbole and marketing hype, all four companies provide
    online tools and free space allocation for your VoiceXML projects.'
