  md: '# Project 2


    # More Conditional Processing


    Conditional processing within a VoiceXML document can be much more than just checking
    the input against a grammar. A condition can test the results of a computation,
    force multiple conditions to be true, or select one of number of possible conditions.
    Standard math operators as +, -, !=, and == are available for testing a condition.
    Listing 2.3 shows examples of conditional processing using the operators.


    +   1. if cond="visitedYes" : variable visitedYes must contain a value.

    2. if cond="planet == 3" : variable planet must contain 3 as its value.

    3. if cond="total > 1000" : variable total must be greater than 1000.

    4. if cond="total&l; 1000" : variable total must be less than 1000.

    5. if cond="number-of-visits != 0" : value of number-of-visits does not equal
    0.

    6. if cond="home==''terra'' || home==''earth'' : value of home must be terra or
    earth.

    7. if cond="planet == ''mars&amp; month == ''june'' : value of planet must be
    mars and value of month must be june.

    8. if cond="verify-indentity(name,ssn)" : verify return value from verify-indentity()
    function is true.


    Listing 2.3 Examples of conditional operators.


    Example 7 contains an example of an XML entity in place of literal ampersand symbols.
    There are three special characters in XML that must be escaped as entities when
    used within parsed text: <, <= and &. Each of these must be replaced with its
    entity equivalent in order to satisfy the VoiceXML parser.


    > Conditional syntax must adhere to the ECMAScript standard set by the ECMA at
    www.ecma.ch/ecma1/STAND/ECMA-262.htm.


    # Expanding the VoiceXML Script


    <field> elements are more versatile than <block> elements because they can be
    used to hold grammars and prompts for extracting information from the client.
    The ending <block> elements in Listing 2.2 can be changed to hold more prompts
    and conditional processing by replacing the <block> elements with <field> elements,
    as shown in Listing 2.4.'
