  md: '# Final Thoughts


    Dynamic generation of voice content from a database allows use of legacy data
    as input to your VoiceXML applications. A calendar of events that changes on a
    regular basis is just asking to be voice enabled.


    Coming in from your Web site is always a nice idea. An improvement to this would
    be the dynamic generation of sponsors that rotate on a regular basis instead of
    hard-coding a single sponsor directly into the script. Whenever a client calls,
    a sponsor splash could be output based upon the type of event that was chosen.


    Another addition to this script would be an intuitive way to handle more than
    5 events. As it works now, if 50 events are returned for a single day, the user
    would have to listen to all the events before being able to exit the program or
    choose a different date.


    It would also be relatively easy to create the list of disciplines from a database
    table. This effectively moves the grammar to an exterior source, making it unnecessary
    to make changes to the VoiceXML script when a new discipline is added.


    The listings for this project can be downloaded from the BeVocal Web site at cafe.bevocal.com/wiley/10projects.
    They are saved as text files, useful as templates for creating your own VoiceXML
    scripts. Join us in the online discussion board for your project and tell us how
    you will be using the project. If you create a form that would make this project
    work better, it might be incorporated into the project online so that others can
    use it.'
