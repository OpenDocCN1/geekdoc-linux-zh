  md: '# Final Thoughts


    This project was the most fun because responses did not have to be hard-coded
    as in previous projects. Personal assistants, kiosks, switchboards, and help desk
    applications can be built using the technology that was developed here. With a
    little more work, the Brainat FAQ engine can be extended to act as a natural computer
    interface for a robot or other program.


    I would like to see a group of developers hook up a peer-to-peer network that
    allows access to each other''s vocabularies and scenarios on the same scenario.
    Fifty people could be working on the same scenario and the information could be
    concatenated into one, gigantic knowledge base about the subject. It would be
    a great way to extend a vocabulary.


    The listings for this can be downloaded from the BeVocal Web site at cafe.bevocal.com/wiley/10projects.
    They are saved as text files, useful as templates for creating your own VoiceXML
    scripts. Join us in the online discussion board for this project and tell us how
    you will be using the project. If you create a form that would make this project
    work better, it might be incorporated into the project code online so that others
    can use it.'
