  md: '# Quiz Generator 269


    Create an XML data file by analyzing the VoiceXML file in Listing 8.4. Use Listing
    8.15 as a template.


    # Build the Stylesheet (XSLT)


    XSLT can be used to select and transform XML data. For the Quiz Generator application,
    XSLT script will be used to format the quiz-startrek.xml file into VoiceXML for
    output by your voice browser.


    Listing 8.16 shows a generic stylesheet that can process any XML file. It isn''t
    very useful in its current condition, when used to transform a file, it will confirm
    that the processing environment is set up and files are available for processing.
    By default, an XSLT stylesheet will output all text nodes within an XML file.


    ```

    1. <?xml version="1.0"?>n2.

    3. <xsl:stylesheet

    4.   xmlns:xsl="http://www.w3.org/1999/XSL/Transform"

    5.   version="1.0"

    6.

    7. <xsl:output method="xml" indent="yes" />

    8. <xsl:strip-space elements="*" />

    9.

    10. </xsl:stylesheet>

    ```


    **Listing 8.16** Basic Stylesheet.


    Styles must adhere to the rules of XML syntax by starting with an XML declaration
    and a root element. An XSLT stylesheet uses the <stylesheet> tag as the root element,
    as shown on line 3. The xsl namespace is declared within the tag on line 4. The
    URI specified as the value of the namespace is mandatory to the XML specification.
    It must be the exact string "http://www.w3.org/1999/XSL/Transform" or the application
    will not compile.


    By declaring a namespace, any tags within the stylesheet that are preceded by
    xsl will be processed by the XSLT processor as instructions. Tags that do not
    have the namespace prefix will be output as literal text. This is how the VoiceXML
    tags will be output.


    > VoiceXML elements displayed within an XSLT stylesheet will be output as literal
    elements because they are not preceded by the xsl namespace.


    The <xsl:output> element on line 7 carries a method attribute to give an indication
    to the XSLT processor of the type of data that will be output. The indent attribute
    is set to yes so that indentation automatically be incorporated into the output
    This makes the output readable by humans. The project is ready for production,
    change the indent to no, optimizing the output for more efficient reading by a
    machine.'
