  md: '# Project 1


    # Create a Hello, World Application


    A simple Hello, World application verifies that your environment is set up and
    working properly. By getting the words Hello, World as output from the system,
    you will confirm that the syntax of your application is correct, your development
    environment is working properly, and you are ready to develop a more complex application.


    > Reading through the application is instructive, but it is not enough. If you
    not set up your working environment, stop now and register for a developer account
    with one of the voice portals. The projects in this book were developed on the
    BeVocal platform.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_64_0.png)


    Follow along each step of the development process and code the application as
    it is presented. Making mistakes is part of the process. Get your application
    running properly in its simple stages, and the rest will fall into place smoothly.


    The VoiceXML template application in Listing 1.1 begins with an XML declaration
    on line 1. Line 3 establishes the root element, <xml>, for the document. The root
    element is used to encompass all elements within the application. No elements
    can reside outside of the root element.


    A version attribute is required within the <xml> element. It specifies the version
    of VoiceXML used for processing the document. The most current version of VoiceXML
    is 2.0, a major update from VoiceXML 1.0. The most significant change in the specification
    is that VoiceXML is synchronized with the Speech Synthesis Markup Language (SSML).
    The World Wide Web Consortium (W3C) has mandated that any platform processing
    to VoiceXML compliant must adhere to the SSML specification. If there is a conflict
    between the definitions in VoiceXML 2.0 and SSML, SSML definitions are to take
    precedence.


    ```

    1. <?xml version="1.0"?>

    2.

    3. <xml version="2.0">

    4.  <form>

    5.   <block>

    6.     <prompt>Hello, World!</prompt>

    7.   </block>

    8.  </form>

    9. </xml>

    ```


    **Listing 1.1** Hello World application.'
