  md: '# Creating Links


    Each <link> has a grammar attached to it. The grammar of a <link> is scoped within
    the context of its parent element. A <link> element is a child of <xvml> will
    be accessible anywhere within the application, including leaf documents in multiple
    document application. Links within <form> or <field> elements are scoped to be
    active within the context of that element.


    In our current application, we will insert a global <link> that will reload the
    application root document whenever the user says "start over," and we will override
    the default help handler with an application-specific message.


    # Reloading a Document


    The application root document is always active when an application is processing,
    global links, variables, and grammars can be defined at the top of the application
    and accessed from any document that is part of the application. This is useful
    for creating phrases that will transfer the user to a specific section of the
    application without having to go through a forced sequence of events.


    From a developer''s standpoint, a global <link> can be used to restart a program
    dynamically instead of terminating a phone call and redialing to reactivate the
    application. This is extremely useful when testing dialog scenarios in a voice
    application.


    In Listing 2.8, a global link is created on line 2 using the <link> element with
    a next attribute of links.xvml. The grammar contains the phrase start over, which
    will activate the link from anywhere within the application. When the link is
    activated, the links.xml document re, resetting all variables and fields to their
    default values.


    > Reloading a document with a global link clears all variables and sets all values
    within the application back to default.


    > Put a start over link at the top of all your applications as a child of the
    <xvml> element. It will save time when testing dialog scenarios.


    ```

    1. <xvml version="2.0">

    2. <link next="links.xvml">

    3.   <grammar>

    4.   <![CDATA[

    5.     {start over}]

    6.   ]]>

    7.   </grammar>

    8. </link>

    9. .

    10. </xvml>

    ```


    Listing 2.8 Start over link.'
