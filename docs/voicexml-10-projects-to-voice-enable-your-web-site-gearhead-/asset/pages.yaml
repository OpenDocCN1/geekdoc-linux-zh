  md: '# 244 Project 8


    grammar, the <assign> tag is used to assign a value to the question1 <field> so
    that the quiz can continue.


    The <assign> assigns a value to a variable or a <field> item. It carries mandatory
    attributes: name and expr. The name attribute is the name of the item to be filled.
    The expr attribute is the value or expression that should be used to fill the
    field. By assigning a value to question1, the FIA sees that the field is filled
    and moves to the next phase in processing.


    Be careful with the quotation marks when using an <assign> element. A literal
    word such as McCoy must be surrounded with double quotes and single quotes at
    the same time. The outside quotes are interpreted as the mandatory quotes of the
    XML specification, whereas the single quotes specify a literal string, not a variable
    or expression to be interpreted.


    When the user inputs an utterance that is recognized by the FIA as part of the
    accept grammar, the <field> is filled and proceeds to the next <form> item, which
    may be another <field>, <mask>, or <subdialog> call. If the field-level item is
    the last in the term, and there is no transition using a <goto> element, the application
    is terminated.


    # Use Blocks for Transitions and Multiple Outputs


    Sometimes it is desirable to output a verbal message without being used as a prompt.
    The messages within the Blocks elements between questions 1 and 2 in Listing 8.2
    are a case in point. When a user has completed a question, either by providing
    a correct answer or by guessing incorrectly three times, a comment is inserted
    into the output to give users an idea of where they are within the structure of
    the application and where the transition is taking them.


    Verbal clues during transitions between questions are useful when the verbal output
    of multiple events within <field> use the same results. As example, the nomatch
    event starting on line 38 could hold the “next quotation” transition comment,
    but then it would also be necessary to insert the same statement into the <filled>
    output when the user correctly guesses the answer. Using the Blocks on line 48
    creates a logical transition between fields while providing output that is appropriate
    for the nomatch and filled events.


    # Add Questions


    The second <field> starting on line 51 of Listing 8.2 outputs a quotation from
    Spock. The grammar is a simple one, using an optional mister spock. The <assign>
    element is used again to assign a value to the field so that processing can progress
    with three wrong answers or a single correct answer.'
