    # Build Vocularies in Brainhat


    The Brainhat server is controlled by text-based files that can be changed to create
    extended vocabularies and context-specific scenarios. We will look at a vocabulary
    file first and make some changes to allow the server''s recognition of greetings
    to be a little less formal. Then we will examine a scenario and add more content
    to its knowledge base.


    # Vocabulary Overview


    A Brainhat vocabulary describes the hierarchical relationships between words,
    plus some clues to help Brainhat disambiguate input phrases and sentences. The
    default vocabulary is stored in the words file in the data directory. When Brainhat
    is started from the command line using the run.bat file, it grabs the words file
    and compiles the relationship and inferences between each of the words in the
    vocabulary. Each of the rules from the required-patterns, cc-patterns, and input
    patterns are precompiled and absorbed into the Brainhat engine.


    Listing 10.4 shows the first two terms defined in the Brainhat vocabulary. A general
    concept is perceived by the word define. Everything up to the next define statement
    is considered part of the concept''s definition. Concepts may be defined in any
    order, making it possible to group concepts like meaning and alphabetize them
    for easy access. This will become helpful as the vocabularies for your projects
    start to grow.

    A concept must have a unique identifying. The name may be any string of characters,
    except spaces or new line characters, but it is most useful if it is recognizable
    as a word. Some concepts might have multiple meanings, such as the word class,
    a certain social status, a category in taxonomy, a programming language in Java.
    By convention, a definition with multiple meanings is followed by a group of people
    learning a subject, or a word that has multiple meanings is followed by a hyphen
    and a number to distinguish itself from other definitions. In Listing 10.4, goodbye-1
    is a definition for the verb goodbye, meaning the end program. In another context,
    goodbye might be a noun meaning taking of leave, as in “a tearful goodbye.” A
    second definition would use the goodbye-2 string.'
