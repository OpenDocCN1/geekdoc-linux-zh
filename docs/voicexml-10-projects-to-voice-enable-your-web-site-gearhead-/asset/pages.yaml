  md: '# Building Basic Pages with VoiceXML 61


    Users may interrupt a prompt depending upon its barge condition. If the condition
    is set to true, as it is by default, experienced users will not have to wait for
    the prompt to be completed before speaking their input. A barge condition might
    be set to false if the developer wants to force the user to listen to a complete
    prompt, for example, when an advertiser is involved.


    Lines 47 through 58 check if the user input is recognized. A nomatch error is
    thrown because the input of "what?" does not match the grammar valable. The probability
    and confidence levels are used by the FIA to determine the likelihood that the
    utterance is a part of the grammar.


    The processing phase checks if the developer has provided an error handler for
    nomatch items with a count of 1. In this case, it finds one on line 27 of the
    script. If no explicit handler is found, the platform will output a generic nomatch
    error message. The nomatch prompt is played on lines 71 and 72, allowing the user
    another chance at responding.


    The FIA will continue through the form until all field items are set to true and
    their corresponding guard conditions are true. If there is no transition to another
