    The left side of the screen is the File Management window, showing the Tools menu
    and the Account Info. The main screen shows a large text area and buttons for
    activating the VoiceXML syntax checker, saving the file to your account, clearing
    the display entry entirely, or setting the text area box back to its default value.
    The text area box can be used for opening scripts or writing new ones from scratch.


