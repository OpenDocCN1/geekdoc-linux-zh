    # Defining a New Word


    Brainhat contains definitions for basic verbs and pronouns as part of the default
    installation. To define a new word, by determining what part of speech it is.
    Table 10.2 lists all top-level concepts available in Brainhat, each related to
    its part of speech. Every word within the definitions file must eventually feed
    into one of the top-level concepts. Think of it as a tree structure. The word
    is a leaf on the tree and the root is the top-level concept.


    Continuing the tree analogy, there might be leaves on branches that connect linking
    to the trunk feeding into the root of the tree. In case of accommodations, accommodations
    could be a room, which could be a building, which is a thing. Following the logic
    from the leaf to the trunk to the root, verify that each word connects the leaf
    through the root is in the definition list and is part of a structure ending things.


