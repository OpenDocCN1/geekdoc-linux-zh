    \ is used for handling repetitive processing when several forms or items need\
    \ the same type of processing. In our application, when a user chooses to hear\
    \ about activities or restaurants, we will need to collect the same type of information\
    \ in both cases. A subdialog will be used to gather that information.\n 2.15 assumes\
