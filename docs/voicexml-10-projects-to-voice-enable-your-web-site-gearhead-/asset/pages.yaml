  md: '# 280 Project 8


    Insert a greeting template into the stylesheet and update the audio template.
    Rebuild the application and verify the correct output for each

    HANDS ON <audio> element.


    # ErrorNoInput Template


    The <errorNoInput> element is next in line in the XML file. It is only used as
    a container for a list of error messages. By enclosing the error messages in a
    container tag, the XML content provider is not limited to a specific number of
    messages.


    Listing 8.25 shows the template for the <errorNoInput> element. The <xsl:comment>
    element on line 2 builds a comment format in the output. The comment is created
    from the content of the <xsl:comment> element, outputting GLOBAL ERROR MESSAGES.
    The <apply-templates> call on line 3 gives access to all the children of the <errorNoInput
    element. The next section creates a template to format that output.


    +   1. <xsl:template match="errorNoInput">

    2. <xsl:comment>GLOBAL ERROR MESSAGES</xsl:comment>

    3. <xsl:apply-templates />

    4. </xsl:template>


    Listing 8.25 errorNoInput template.


    Create a template to handle the <errorNoInput> element and insert it into your
    quizFormatter.xs stylesheets. Run the application and confirm that the

    HANDS ON GLOBAL ERROR MESSAGES comment is outputting properly.


    # NoInput Template


    Within the <errorNoInput> element, there is a series of <noinput> tags that hold
    audio URLs and text prompts for error messages. The <noinput> elements in the
    XML data file have a consistent structure that can be used to build a template.


    Listing 8.26 shows the template for outputting the <noinput> messages to the quizstarrek.xml
    file. It outputs a linear <noinput> element whose count attribute is set by an
    XSL function. The position() function is used to dynamically generate a sequence
    of numbers, starting at 1. Each time the template is visited within the context
    of the <errorNoInput> element, the position() count is incremented. The return
    is output as the value of the count attribute.


    Line 3 places a call to all children of the current node. There is only one in
    this case, the audio template. The <xsl:if> statement on line 4 carries a condition
    to see if this is the <noinput> element in the sequence. The XSL last() function
    is compared to the current position(). If the test is true, processing moves to
    line 3, sending the user to the goodbye <form>, which will be created in a later
    section.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_302_0.png)'
