  md: '# Telephone Dialer 175


    VoiceXML Elements Used in This Project (Continued)


    | ELEMENT NAME | DESCRIPTION |

    |--- |--- |

    | <else> | Used in <if> elements |

    | <elseif> | Used in <if> elements |

    | <field> | Declares an input field in a form |

    | <filled> | An action executed when fields are filled |

    | <form> | A dialog for presenting information and collecting data |

    | <goto> | Go to another dialog in the same or different document |

    | <grammar> | Specifies a speech recognition or DTMF grammar |

    | <help> | Catches a help event |

    | <if> | Simple conditional logic |

    | <link> | Specifies a transition common to all dialogs in the link''s scope |

    | <noinput> | Catches a noinput event |

    | <nomatch> | Catches a nomatch event |

    | <prompt> | Queues speech synthesis and audio output to the user |

    | <reprompt> | Plays a field prompt when a field is revisited after an event |

    | <transfer> | Transfers the caller to another destination |

    | <vml> | Top-level element in each VoiceXML document |


    Source: VoiceXML 2.0 Working Draft, section 1.4


    # Application Call Flow


    6.1 shows the call flow for this application. The caller is greeted by a standard
    welcome message and then is prompted for the name of the person to call. The phone
    number is retrieved from the address book and the call is transferred to the new
    number. Once the call has been completed, a request for another number is output.
    The application is terminated with a goodbye message once all calls have been
    made.'
