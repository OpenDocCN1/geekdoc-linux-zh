  md: '# 350 Project 10


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_372_0.png)


    # Caching Documents and Grammars


    The voice portal will wanna cache the dynamically generated pages. If you make
    a change in the grammar, you may wish to change the grammar name and slightly
    modify the name of the initial page that you give to the voice portal. This will
    force the voice portal to pull a fresh copy of the page or grammar. You can reference
    the first page with a modified name; Brainhat doesn''t care if you ask for index.xmlmz
    or any combination of trailing characters.


    > The voice portal will try to cache dynamic pages, freezing a grammar. If changes
    to a grammar are made when updating an application, rename the grammar file, adjust
    your application to point to the new file, and rename the entrance file extension.'
