  md: '# Project Description


    This project uses components from the previous voice projects to handle most of
    the major processing. The user dials into the site and chooses from a menu of
    three items: hear the company address, leave a recorded voice message, or talk
    to a receptionist. Each of the responses within the script is stored in a separate
    document. There is a hidden-link within the main menu that allows users to access
    a secure area if they know the correct grammar.


