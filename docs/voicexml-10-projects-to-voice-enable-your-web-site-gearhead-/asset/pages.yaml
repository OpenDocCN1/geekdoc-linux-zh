    # # Retrieve Another Event


    There are no return values from the Cold Fusion test script, as processing continues
    from the end of the <subdialog> call. Listing 9.10 creates a final <field> in
    the script that will allow the caller to request another event.

    MenuAgain<field> begins with a <prompt>, asking users if they would like to check
    on other events. The type attribute of the menuAgain<field> is set to boolean,
    looking for a positive or negative response. When there is a positive response,
