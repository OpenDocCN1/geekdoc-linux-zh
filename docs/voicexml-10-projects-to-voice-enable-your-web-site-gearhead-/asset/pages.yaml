  md: "# Application Root Document\n\nA VoiceXML application can contain many documents\
    \ and resources linked together by an application root document. One document\
    \ within the application is designated by the developer to be the application\
    \ root document. It contains all global variables, links, grammars, properties,\
    \ and catch events for the application.\n\nOther documents that make up the application\
    \ are considered leaves of the application root. For a document to be considered\
    \ part of an application, the application attribute within the <vxml> element\
    \ must be set to the application root document attribute. However, the application\
    \ root document itself will not carry the application attribute. There is no limit\
    \ to the number of leaves within an application.\n\nThe application root document\
    \ is always loaded when an application is running. This creates two possible scenarios:\
    \ Either the root document is processing by itself or one of the leaf documents\
    \ is processing while the root document is still loaded.\n\nIn this project, links.vxml\
    \ will be designated as the application root document. List 2.5 shows the first\
    \ external document of the links.vxml application.\n\n```\n1. <?xml version=\"\
    1.0\"?>\n2.\n3. <!DOCTYPE vxml\n4. PUBLIC \"-//BeVXML Inc//VoiceXML 2.0//EN\"\n\
    5. \"http://cafe.beocal.com/libraries/dtd/vxml2-0-beocal.dtd\">\n6.\n7.\n8. <vxml\
    \ version=\"2.0\" application=\"links\">\n9.\n10. <form id=\"greeting\">\n11.\
    \   <block>\n12.     You are now in the Previous Visitor Info Center.\n13. </block>\n\
    14.\n15. <field name=\"timeframe\">\n16.\n17. <grammar>\n18.   <![CDATA[\n19.\
    \     week month continue \n20.   ]]\n21. </grammar>\n22.\n23. <prompt>\n24. \
    \  If you were here within the last week, say \"Week\".\n25.   If you were here\
    \ within the last month, say \"Month\".\n26.   Otherwise, say \"Continue\".\n\
    ```\n\n**Listing 2.5** First external resource. (continues)"
