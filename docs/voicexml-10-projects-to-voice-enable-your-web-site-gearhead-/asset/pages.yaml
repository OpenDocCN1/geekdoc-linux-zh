- img_proc: true
  md: '# 348 Project 10


    Table 10.3 Command Line Options for the Brainhat Server


    | SWITCH | EFFECT |

    |---|---|

    | -d | Sets text daemon mode |

    | -h | Sets http/html daemon mode |

    | -x | Sets http/voicexml daemon mode |

    | -N | Enables n-Best processing for VXML |

    | -g | Selects a grammar for voicexml mode (default is brainhat.gram) |

    | -i | Chooses an init file (default is brainhat.init) |

    | -l | Chooses an introduction for Brainhat to voice (default is brainhat.intro)
    |

    | -R | Chooses a restart file |

    | -p | Sets an apparent source address for subsequent http gets; may be necessary
    if operating through an address translating gateway or firewall |

    | -t | Outputs a pattern trace |

    | -e | Outputs inference tests |

    | -E | Turns on echo for input files |

    | -r | Runs input file and stops for testing |

    | -j | Turns on java CC graph output in dynamic HTML |

    | -S | Run as a stateful http daemon |


    The command line in Listing 10.34 instructs Brainhat to run in VoiceXML mode,
    via the -x flag. The -N option instructs Brainhat to ask the voice portal for
    its three best guesses of what the user might have said each time there is a response.
    Brainhat will choose from among them. The -i flag chooses a file that contains
    an initial greeting. For example, the greeting will be “This is the Colony Seven
    frequently asked servers. How can I help you?” it is stored in the brainhat.intro
    file, which is the default greeting file.


    The -o option chooses a scenario. The default is brainhat.init the option tells
    Brainhat what file to forward to the voice portal to use the VoiceXML grammar.
    If you are running behind an Internet firewall, you may need to use the -p flag
    as well. Again, review the options from the command line -help flag.


    The last item on the command line, data, is the path to the precompiled words
