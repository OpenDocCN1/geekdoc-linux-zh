    **Listing 8.28** seriesOfQuestions template.


    # Set Template


    Each question in the XML file is contained within its own field, with a unique
    name allocated to each field. Listing 8.29 generates a unique name through the
    XSLT generate-id() function. This function guarantees the construction of a unique
    name for the field, no matter how many questions are built into the quiz. <xsl:apply-templates>
    on line 3 gives access to the question, answers, and hint templates that are to
    follow.


    ```

    1. <xsl:template match="set">

    2. <field name="generate-id()">

    3.   <xsl:apply-templates />

    4. </field>

    5. </xsl:template>

    ```


    **Listing 8.29** Set template.


    # Question Template


    The <question> element in the XML file has a *recording* attribute that can be
    used as an *src* URL for audio output. It also contains text for content that
    can be used for the text in the VoiceXML file.

    Line 2 of Listing 8.30 outputs a literal <audio> element that contains two attributes:
    *src* and *fetchhint*. The *src* attribute is filled with an *attribute value
    template* that accesses the *recording* attribute of the <question> element within
    the XML file. *fetchhint* is hardcoded into the VoiceXML application, telling
    the processor to retrieve the sound source as soon as possible, without waiting
    for it to be called.'
