  md: '# Project 1


    template is expanded in four segments, building a basic application that will
    accept user input, make a choice based upon that input, and output the appropriate
    response. Along the way, the Form Interpretation Algorithm (FIA) will be discussed
    as the process controller before VoiceXML. The project is completely self-contained
    with no reference to outside data sources other than the DTD used for validation
    of the application.


    To complete this project you will:


    +   1. Create a *Hello, World* application.

    2. Verify that the application is working.

    3. Add multiple dialogs to the template.

    4. Accept user input with yes/no grammar.

    5. Set up error checking.

    6. Insert meta data for the project description.


    # You Will Need


    +   - A connection to the Internet

    - A developer account with a voice portal such as BeVocal, TellMe, HeyAnita, or
    VoiceGenie

    - Example scripts from cafe.beocal.com/wiley/10projects

    - VoiceXML 2.0 Working Draft from www.w3.org/TR/voice20

    - The Speech Synthesized Markup Language Specification from www.w3.org/TR/speech-synthesis


    VoiceXML Elements Used in This Project


    | ELEMENT NAME | DESCRIPTION |

    |---|---|

    | <block> | A container of (noninteractive) executable code |

    | <else> | Used in <if> elements |

    | <field> | Declares an input field in a form |

    | <filled> | An action executed when fields are filled |

    | <form> | A dialog for presenting information and collecting data |

    | <goto> | Go to another dialog in the same or different document |'
  merge: -1
