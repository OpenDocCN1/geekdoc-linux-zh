  md: '# FAQ Engine 353


    Line 33 of 10.37 takes the return value from the function catrels that is defined
    on lines 11 through 21 and sends the concatenated results as the input string
    to the Brainhat server. The server responds with output, just as it has from the
    interactive command line, forming the return as a VoiceXML file.


    ```

    1. <?xml version="1.0"?>

    2. <!DOCTYPE vxml

    3. PUBLIC "//Bevococal//VoiceXML 2.0//EN"

    4. "http://cafe.bevocal.com/libraries/dtd/vxml2-bevocal.dtd">

    5. <xml version="2.0"?>

    6. <form id="Dialog">

    7.

    8. <var name="results"/>

    9. <var name="best"/>

    10.

    11. <script>

    12. <![CDATA[

    13.     function catrels(allResults) {

    14.         var cat = "";

    15.         for (i = 0; i < allResults.length; i++) {

    16.             cat = cat + allResults[i].utterance + " ";

    17.     }

    18.     return cat;

    19. }

    20. ]>

    21. </script>

    22.

    23. <field name="Stmt" value="3"/>

    24. <property name="maxnbest" value="1"/>

    25. <property name="bevocal.maximuminterpretations" value=".2/"/>

    26. <property name="confidencelevel" value=".2/"/>

    27. <grammar src="brainhat.gram@Dialog" type="application/x-gsl"/>

    28. <field>

    29. <if condition="application.lastresult&lt; &gt;">

    30. <assign name="best" expr="application.lastresult$/>

    31. <assign name="best" expr="catrels(results)$"/>

    32. </else>

    33. <assign name="best" expr="application.lastresult$.utterance"/>

    34. </if>

    35. <submit next="http://208.25.38.98:24011/index.xml"

    36. method="get"

    37.

    38. </field>

    39. namelist="best"/>

    40. </field>

    41. </form>

    42. </vxml>

    ```


    Listing 10.37 Script to process and respond to input.'
