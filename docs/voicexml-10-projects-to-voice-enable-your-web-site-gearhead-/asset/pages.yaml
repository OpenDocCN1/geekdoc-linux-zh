  md: '# Quiz Generator 255


    Insert audio links for each of the prompts in your application. Add a start over
    link and a help prompt to the top of your script. Place a phone call to your application
    to check the output. Listen for clarity in the prompts. Check the sound volumes
    to make sure the sound levels are correct and the articulation is clear.


    At this point, you have a fully functioning script that can be used as a quiz
    template. The next section will show how to use this template to generate hundreds
    of quizzes using one central, XSLT script.


    # VoiceXML Script Generation with XML and XSLT


    The VoiceXML Quiz Generator file has the data hard-coded as part of the application.
    It would be much more usable if there were a way to isolate the data from the
    application that is processing. The implications are astounding. We could now
    have any of quizzes, even into the thousands, that could be processed by a single
    application. Point the data at the application and out pops the VoiceXML script.
    A combination of XML and XSLT technologies can be used to construct such an application.


    There are two major reasons why XML has been accepted so quickly in the processing
    community: nonproprietary exchange of data between applications and standardized
    data structure. We will use a standardized data structure to expand the capabilities
    of the quiz application.


    The application will consist of two documents: the data, which is an XML file
    holding the questions and answers to the quiz, and a processing script, which
    is the XSLT script for transforming and formatting the data into a VoiceXML file.
    Using the Star Trek Quot Game as a template, we will build both documents and
    the data to show how to create the VoiceXML output.


    # Set Up the XML/XSLT Work Environment


    There are two ways to run an XML/XSLT application: through a local processor that
    generates the VoiceXML script or by creating the VoiceXML dynamically through
    a VoiceXML browser. At this time, VoiceXML browsers do not handle dynamic XSLT
    output, so the VoiceXML file will be built locally and uploaded to your developer
    account.


    The processing environment is 100 percent. The good news is that you will not
    have to have any Java skills to make the pieces work. You will need to download
    and install a Java Development Kit from Sun Microsystems and the Xerces XML parser
    and the Xalan XSLT processor from Apache. If you do not have the environment installed
    on your machine, now is a good time to get it up. The installations are very simple
    on the Window''s platform. As your programming experience grows, you will find
    this combination of software an invaluable resource.


    Links to these resources can be found in Project 8 at the cafe.bevocal.com/wiley/10-points
    site.'
  merge: -1
  pgno: 277
