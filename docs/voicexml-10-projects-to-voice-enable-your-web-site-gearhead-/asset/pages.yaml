  md: '# 28 Chapter 2


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_50_0.png)


    Figure 4 BeVocal Browser.


    A date range in the form and then clicking the Submit button will bring up a list
    of calls that were placed to your application during the selected date range,
    as shown in Figure 5. The default table displays information about each call,
    including the time it was called, the phone number that was dialed, the duration
    of the call, an error count, and a link to view the log of the call. The output
    from the Submit button can be configured by clicking on Customize View. The dialog
    box that appears will contain a list of items that can be included in log table.


    The second screen of the Log Browser is activated by clicking View Log under the
    Details column of the Submit output or by choosing the Most Recent Log. A new
    window will open, displaying a checklist of events that have been traced and a
    complete log of the call. The event list is color coded, making it easy to scan
    the log and view only events of interest. The Apply Default button will reset
    the form to display all events.


    The Log Browser is useful when trying to determine what errors are breaking your
