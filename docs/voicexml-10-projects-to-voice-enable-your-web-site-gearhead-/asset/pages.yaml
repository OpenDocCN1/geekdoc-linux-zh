    The header method from the CGI module is used on line 8 to print the correct header
    to standard out, in this case, is the voice browser. Lines 10 through 12 use the
    param method from the CGI module to assign values to the three variables that
    have been passed from the <sum>element.


    The code in lines 15 through 27 is contained within a Perl print here statement.
    Line 14 specifies that the print statement will be the literal characters VXML
    on a single line by itself. Anything before that will be output as if each line
    had its own print statement.


    Everything from here should look familiar by now: the XML declaration and the
    <vxml> root element containing a <mask> of literal text. What might not be familiar
    is the use of variables within the output. The variables that were assigned values
    at the top of the script can be embedded directly in the print statement. When
    the script processes, those variables will be expanded, leaving them as the output.


    The <submit> element that this script does not function like the <subdialog> element;
    it is like the script button on an HTML form. Once the data is submitted, the
    script is in control of the processing, making the calling document no longer
    available. The script controls all processing from that point and does not return
    to the calling routine as a <subdialog> or subroutine. To return to the calling
    application, the URI of the application has to be explicitly stated as a next
    attribute within a <goto> element.'
