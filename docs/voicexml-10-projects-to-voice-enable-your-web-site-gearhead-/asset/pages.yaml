    # Define a Help Message


    The VoiceXML file contains a global help message that must be defined in the XML
    file. Looking back at the data structure in Listing 8.5, we can see that <audio>
    is used within the <help> message and it is also contained in several locations
    within the <form> element. We need to define element names that will be appropriate
    at all locations in the XML file so that the XSLT processor will recognize common
    structures.


    The <help> element holds two child elements: <audio> and <prompt>. The <audio>
    element in the VoiceXML file has an attribute that points to a sound file and
    an attribute that defines how long to wait before playing the text prompt by the
    sound file can be fetched. Lines 14 through 20 of Listing 8.8 define these attributes
    and insert a <textPrompt> element to hold the content of the <audio> element.


    ```

    1. <?xml version="1.0"?>

    2.

    3. <quiz fileName="quiz-startrek.vxml">

    4.

    5. <!-- START OVER -->

    6. <link>

    7. <next>quiz-startrek.vxml</next>

    8. <grammar>start over</grammar>

    9. </link>

    10.

    11. <!-- HELP ---->

    ```


