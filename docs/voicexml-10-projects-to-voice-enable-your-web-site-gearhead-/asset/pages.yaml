  md: '# Telephone Dialer 179


    input itself. This is helpful when building complex phrases that need to return
    a single value or parsing a phrase that will fill several field variables at one.


    slot is an optional attribute of a <field> element. Simple samples are used to
    fill the implied slot of a <field> element by defaulting to the field name when
    the slot attribute is absent. If the user understands recognized, it is input
    in the field variable. This is how we have constructed grammar in the previous
    projects. Slots allow the developer to explicitly force a specific value into
    a field. In the current project, we want to force a specific number as a value
    depending on the person we wish to call.


    The syntax of making the contact name to a phone number starts by enclosing each
    name in square brackets. The square brackets signify a disjunction, meaning or.
    [ rosemary means or, or,


    The syntax might look odd first viewing. In Listing 6.2, there is one of square
    brackets on 3 and 14 that surrounds another set of square brackets on lines 4
    through 13, holding a different name. All of that is contained within a CDATA
    section.


    CDATA sections are convenient when the content of the grammar contains the less
    than (<) character. This is a reserved character which must either be escaped
    by using the CDATA section or expanded into its XML equivalent:&lt; With each
    line of the grammar containing less than a character as part of the grammar syntax
    construction, it is much simpler to encode the entire grammar in a CDATA section
    than to replace each of the special characters. Table 6.1 is a list of reserved
    characters and their entity equivalents.


    The disjunction square brackets around each name are not mandatory at this point,
    but it is good preparation for the time we will want to expand the names to a
    group of people, as we will in the next section. The curly braces set up the slot
    that will hold the field variable until an utterance is recognized. In our case,
    the <contactList> will be filled with a phone number. After each of the disjunction
    square brackets hold a contact name from your phone list, the slot name is followed
    by the value to be assigned to the field variable.


    Using white space and line breaks to put each name on a separate line keeps the
    description of each name structure clear and makes it easier to maintain as we
    expand the description of name.


    # Table 6.1 Special Characters and Their Entity Equivalents


    | CHARACTER | ENTITY EQUIVALENT |

    |---|---|

    | < | &lt; |

    | > | &gt; |

    | '' | &apos; |

    | " | &quot; |

    | & | &amp; |'
