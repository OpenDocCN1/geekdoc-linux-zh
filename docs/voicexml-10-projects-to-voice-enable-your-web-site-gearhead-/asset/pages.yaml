    # Set Up the VoiceXML Entrance


    Setting up the VoiceXML gateway to the Brainhat server is relatively simple once
    the\scenario has been set up and tested. We will first set up a test script to
    confirm

    access to the Brainhat server and then create a short introduction that will be
    spoken

    when a user calls the server. Finally, a vocabulary must be created for the VoiceXML

    gateway that will be recognized by the speech-to-text translator and passed to
    the

    Brainhat environment.

    We will begin by starting the Brainhat server in VoiceXML Mode.


    # Set the Server in VoiceXML Mode


    Execution of the VoiceXML daemon mode takes place from a single directory.

    On a Linux machine, this will be /usr/local/etc/brainhat/vxml. On a Windows plat-

    form, the run-directory will be wherever you start the daemon. For security, the\daemon
    cannot access files in directories above the run-directory.

    There are a small handful of switches that apply to running Brainhat in VoiceXML

    mode. They allow choices as to what scenario will run, what grammar file should
    be

    served to the voice portal, what the initial greeting should be, plus a few other
    run-

    t parameters. A typical command line is shown in Listing 10.34. The complete-

    mand should be on one line; it is only wrapped for convenient reading. Table 10.3
    is a

    complete list of command line options. You can also get the complete list of options
    by

    invoking the server with the -help option.'
  merge: -1
