- img_proc: true
  md: '# 20 Chapter 2


    > Setting up an account with an ASP helps VoiceXML developers concentrate on learning
    the VoiceXML language and syntax without dealing with the setup or maintenance
    issues of a VoiceXML implementation.


    # VoiceXML Portals


    VoiceXML portal acts as a remote gateway to handle the processing of VoiceXML
    requests. It is comparable to an Internet Service Provider (ISP), providing space
    for people to build their voice-enabled pages. Creation of scripts, activation
    of the scripts, and management of the system are handled through a standard Web
    browser. There is no software to download and install. The ASP provides all the
    tools and storage space necessary for creating voice applications.


    Most VoiceXML ASPs offer free and for-a-fee services to companies that do not
    want to house production-level applications to run business functions. This can
    be very economical for companies that cannot afford the $20,000 to $40,000 in-house
    staff fees or maintain a 24/7 staff to oversee the voice system. We will use a
    free service to develop our applications.


    # How It Works


    VoiceXML application hosted at a VoiceXML ASP works the way as a basic Web page.
    The developer creates a voice page that is stored on a Web server. The voice portal
    is used as the connection between the data on a Web server and the end user. The
    Web server may be housed in the same location as the ASP, or it may be accessed
    remotely through the VoiceXML processing platform. By housing the application
    on your Web server, your VoiceXML scripts will have access to all of the content
    and processing mechanisms that are available on server.


    > VoiceXML scripts can be stored on your Web server and accessed through a remote
    VoiceXML portal, allowing existing content on your Web site to be available to
    the voice application.


    The voice application server is accessed by calling a phone number that is dedicated
    to processing incoming voice requests. Continuing to use a Web page as an analogy,
    the phone number is comparable to a Uniform Resource Locator (URL) for accessing
    a site. Once users connect to the server over the phone, they can surf the content
    through vocal commands or key input from their telephone.


    When surfing the Web, users must have a browser on their local machine to see
    the Web pages. The browser translates the HTML code from the Web page into viewable
    content. In contrast, the voice browser in a voice application is located within
    the VoiceXML gateway that answers the phone. This makes it possible for VoiceXML
    applications to be accessed by any telephone without installing specialized telephone
    software.'
