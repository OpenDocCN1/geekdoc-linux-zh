  md: '# Project 1


    document as its value, preceded by a number (#) sign. This sign is called a fragment
    identifier. It is used to move directly to a specific location in the document.

    If a form ends without a transition from a <goto> element, that is a signal for
    the application to terminate.


    > An application is automatically terminated when a form ends without a transition
    to another dialog.


    An absolute or relative reference to an external VoiceXML document can also be
    the value of the next attribute. The reference may include a fragment identifier
    for accessing a specific dialog within the new document. By default, the first
    form within the document will be accessed unless there is a fragment identifier
    at the end of the Universal Resource Identifier (URI).


    > Many programmers are adamantly opposed to using goto statements. However, the
    VoiceXML language uses the <goto> element extensively for transitioning between
    dialogs. We will look at possible alternatives in future projects examining the
    <submit> and <subdialog> elements.


    Two forms make the balance of Listing 1.2. Taking a high-level overview, there
    are three forms: for a greeting, one for holding content, and one for a graceful
    exit from the script. Most of the activity within the application will be developed
    within the maincontent form, using the greeting and goodbye forms as mechanisms
    for entering and exiting the script.


    > Using your existing Hello template, create a VoiceXML application that has three
    forms: a greeting, a body, and an exit or goodbye. Verify your forms are working
    before proceeding to the next section.


    > Be careful when creating ids and names for forms and fields. The name, or identifier
    as it is technically called, must begin with an ASCII letter or underscore. The
    name may contain any sequence of ASCII letters, underscores, digits, or dollar
    signs. If the id or name does not adhere to the rules that have been established
    by the ECMA specification, a syntax check will not throw an error, but the application
    will not run. An extremely vague error message pointing to a line that contains
    a name or an id is usually a naming-convention problem.'
