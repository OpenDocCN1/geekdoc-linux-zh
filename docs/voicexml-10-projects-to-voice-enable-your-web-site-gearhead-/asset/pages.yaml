  md: '# 312 Project 9


    Line 30 begins the actual VoiceXML output with the XML declaration and <xml> root
    element. The <form> beginning on line 33 checks to see if any events were returned,
    using the <CFIF> element on line 37. If there were no events for that date, a
    message is sent back to the user, processing returns to the main script with the
    </return> element on line 43, and VoiceXML form and document are closed on lines
    45 and 46. Notice the insertion of dynamic data using the #variable# mechanism
    of Cold Fusion on line 40. Line 41 uses the dateformat to verbally output the
    date that is stored in target_date.


    If events were found for the date requested, processing jumps to line 50, where
    confirmation is output as the number of dates found for the discipline. Line 54
    inserts a <break> for a more humanlike transition to the output of events.


    Lines 58 through 66 are the actual output of the events. The XMLFormat function
    is used to force the escaping of all special characters such as <, &, and ...
    within the XML data. The output of the presenter''s name is handled with the <say-as>
    element. A medium-sized <break> element, on line 65, is used between the output
    of listing to give the user a chance to comprehend what was spoken before moving
    onto the next event.


    > While creating the CF script to output the event titles from the SQL database,
    Larry and I spent a half-day tracking down an obscure error. To abbreviate listing
    of dates, the input operator had inserted three dots in a row,..., as a placeholder.
    For some reason, this was causing an error output to the VoiceXML browser as well
    as the IE5+ browser we were using for visual testing, even when the output was
    wrapped in CDATA section. The XMLFormat function handles all of the special character
    escaping as well as the problem with ellipses.


    Lines 69 and 70 confirm to the user that the event listing has been completed.
    The </return> element on line 71 transfers processing back to the calling application
    and all VoiceXML elements are closed on lines 72 through 74. Line 74 terminates
    the Cold Fusion script.


    > According to Larry Larson, the xml declaration must be the first character of
    the first line in output. The simplest strategy for ensuring that the Cold Fusion
    page renders correctly as XML is to put the declaration in the first line. If
    there is an application.cfm page included in the Cold Fusion application, there
    should be no new-line returns on it because those returns will be carried to the
    data page and move the declaration below where it should be, resulting in an XML
    error.'
