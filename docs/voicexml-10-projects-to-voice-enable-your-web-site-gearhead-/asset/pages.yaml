    **Listing 4.3** Making a voice print. (continued)


    Creating a voice print involves several steps. A unique name must be assigned
    to the user’s print, and the voice print recorder must get an initial sample of
    the caller’s voice. Other samples are then taken and used to form a composite
    print that is theoretically identifiable as a fingerprint.


    # Unique Keys


    When a voice print is created, each print must have a unique name, a *key*, attached
    to, giving access to the voice print within a VoiceXML script when a user needs
    to be authenticated. Within Listing 4.3, this *key* will also be used to access
    and refine the user’s print value. Once the print is completed, users will access
    their print by speaking the unique *key* value.


    Line 10 of Listing 4.3 declares a variable named *verificationKey* that will hold
    the user’s unique key once it is assigned.


    > NOTE Each voice print must have a unique name, a **key**. This identifies the
    voice print to a calling application. On the BeVocal platform, all keys within
    a developer’s account are available to every application in that account. Check
    your platform’s documentation for specifics on accessing voice print keys from
    multiple applications.'
