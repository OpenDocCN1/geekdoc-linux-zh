    **Listing 8.24** The greeting template and updated audio template.


    The updated template for the <audio> element uses <xsl:choose> statement to handle
    conditional processing. With <xsl:choose>, multiple conditions are tested using
    the test attribute of <xsl:when>. Line 3 tests to see if a <fetchhint> element
    is accessible from the current context within the XML file. If <fetchtimeout>
    is available in the current node being processed, an <audio> element with src
    and fetchhint attributes is output, with values inserted through attribute value
    templates. The <xsl:otherwise> element on line 9 processes any other <audio> element,
    replacing the fetchhint attribute with a fetchtimeout attribute.


    When the audio template is completed, processing returns to line 21 of Listing
    8.24. There are no more templates to process within the <greeting> element of
    the XML file, processing falls to the next line of the stylesheet, outputting
    the <goto> element.'
