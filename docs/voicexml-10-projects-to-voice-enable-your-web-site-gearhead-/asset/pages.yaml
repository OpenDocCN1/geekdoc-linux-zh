    # Final Thoughts


    The Report Recorder is well on the way to becoming a multiuse recording service.
    Instead of reporters and beach names, a caller could request a specific person
    or department and leave a message.


    Listing 7.11 can be used as a template for creating a dynamic listing of surf
    reports. The user calls the service, requests a beach name, and hears the report.
    Look at the enumerated lists from previous projects to get an idea of how to create
    a menu by using a list of items. Instead of outputting to a Web page, output to
    VoiceXML and create it on the fly.


    The listings for this project can be downloaded from the BeVocal site at cafe.beocal.com/wiley/10projects.
    They are saved as text files, as templates for creating your own VoiceXML scripts.
    Join us in the online discussion board for this project and tell us how you will
    use the project. If you create a form that would make this project better, it
    might be incorporated into the project code online that others can use.


    The next project uses XML and XSLT to generate surveys and quizzes. Keep the Report
