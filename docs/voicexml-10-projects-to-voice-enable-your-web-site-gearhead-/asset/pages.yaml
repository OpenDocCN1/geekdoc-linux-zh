    \ how the call was terminated.\n\n> Most portals have a limit on the amount of\
    \ time for a call when using the <transfer> element based of the potential for\
    \ abuse. BeVocal platform has a maxime default of 60 seconds.\n\nThe <filled>\
    \ block starting on line 19 to see how the transfer is terminated. A busy signal,\
    \ no answer on the other end, the user hanging up, and exceeding the maximum call\
    \ output verbal feedback. Giving users feedback about what is happening with the\
    \ system gives them a sense of security, assuring that everything is working properly.\n\
    \n> Insert a <transfer> block into your application. The VoiceXML 2.0 Working\
    \ Draft, section 2.3.7, for transfer attributes that might be applicable when\
    \ catching events during the transfer.\n\n# Place Another Call without Disconnecting\n\
    \nThe application would be much more user friendly if the caller could request\
