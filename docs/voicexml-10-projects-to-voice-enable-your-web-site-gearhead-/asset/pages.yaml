    you can test your application multiple times with a single call.


    # Creating Menus


    Sometimes it is convenient to give a list of choices and then transition to a
    specific dialog based upon choice. The <menu> element can be used to output a
    list of choices within a <prompt> with a vocabulary that is more flexible than
    typically contained within a <grammar> element.


    The <menu> element in Listing 2.1 is at the same level as a <form> element within
    the VoiceXML document structure.


    In place of field-level items, a <menu> contains one anonymous field that holds
    a <prompt>. Grammar is dynamically generated with the <enumerate/> element to
    access the vocabulary stored within the <choice> elements. We will look at <enumerate>
    and <choice> a little further down.


    The accept attribute of a <menu> element specifies whether the dynamically generated
    grammar must be spoken exactly or if section of the phrase will be recognized
    as valid input. If the accept attribute is set to exact, the user must speak the
    complete phrase order for the input to be recognized. When the value is set to
    approximate, the interpreter will accept a subset of a <choice> phrase. For example,
    the user could say "group activities," "group," or "activities" as recognizable
    grammar from the <choice> element on line 10. The accept attribute can be overridden
    at the <choice>-level, as we see.'
