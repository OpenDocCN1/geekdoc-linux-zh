  md: '# Project 7


    The recording <form> starts with the beachName field that requests the name of
    a beach and confirms it against the grammar stored in the beachnames.grammar file.
    The reporterid is concatenated onto the URI as a fragment identifier as described
    in a previous section, External Grammar Files. When a beach is recognized as a
    valid utterance, processing falls through to the Report field


    Processing within the Report field is controlled by the attributes of the <record>
    element. A user-friendly beep is output to confirm that the recording has begun.
    The maximum length of time for a recording is set to 30 seconds, and a silence
    of 1½ seconds signals to the processor that the recording is completed. Simple
    <nomatch> error checking is handled on lines 10 through 18.


    The content of the <record> element is output before the recording begins. Within
    the audio output is a <value> element on line 29 that repeats to the speaker what
    phrase that was recognized as input


    A <field> element named confirms is set as a boolean type on line 35. This forces
    a yes or no response when asked if they would like to save the recording after
    hearing it played back through the <value> element on line 40. The <field> block
    starting on line 48 sets up a conditional statement, checking to see if the confirm
    field recognized a positive response from the user. If so, the nameOfRecording
    variable is set to the beachName concatenated with the .wav extension, creating
    a filename that will be passed to the processing script in the <subdialog> call.


    Lines 56 handle processing if the confirmation was not positive. Simple <audio>
    prompt tells the user that the recording process is starting over. The <clear>
    element on line 60 carries no attributes, so by default all <field> values within
    the current field are cleared and the FIA visits each field, at the top of the
    form.


    Once the user has confirmed that a recording should be saved, processing falls
    through the <subdialog> call on line 65. The <subdialog> element is used to send
    processing to another location and wait for a return value. At the same time,
    it can pass variable and name values to the subdialog for processing.


    The attributes of the <subdialog> include the src for the script that runs the
    HTTP method for processing type; the encoding type, or enc, for how the data should
    be passed; and name that contains the list of the variables and field names that
    are passed to the subdialog. Reverting to the <field> element on line 70 when
    the subdialog has concluded, confirming to the user that the report has been saved.


    The field finding on line 79 offers the reporter to record a report for another
    beach. This is handy when the reporter has multiple reports to input, making it
    unnecessary to make a separate call for each individual report. Again, boolean
    type is set for the anotherReport field, asking if the reporter would like to
    make another report. A positive response clears all field variables through the
    <clear> element on line 86, and begins again at line 2 by requesting a beach.
    The reporter may make as reports as desired with a single phone call.


    When the user input a negative response, processing falls to the goodbye <field>
    for a quick goodbye message. The <audio> block on lines 8-100 can be used to access
    a global server link if it is available. The <audio> element acts as a prompt,
    waiting for user input. If anything other than “start” is spoken, the nomatch
    event triggers the exiting of the script. We will see the start over link when
    putting the finishing touches on the script in the final section.


    +   * With'
