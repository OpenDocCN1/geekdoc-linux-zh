  md: '# Creating Links 95


    The <submit> element beginning on line 7 carries four attributes that specify
    what data should be sent and how it should be submitted. We have discussed next
    (the URI where the data should be sent), expr (a dynamically generated URI), and
    namelist (names of the variables to send), the fetchtimeout how long the interpreter
    should wait before issuing the script that cannot be accessed. A fetchaudio attribute
    is also available, pointing to a URI that plays a sound file while the resource
    is being fetched.


    The method attribute can be a value of post or get. These are the same values
    used by any CGI script using the HTTP protocol on your current Web Site. In general,
    post is the most useful of its ability to send large amounts of data.


