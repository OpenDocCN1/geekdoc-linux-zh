  md: '# PROJECT

    9


    # San Francisco Arts Calendar


    There are thousands of events, give or take a couple hundred, at any one time
    in the San Francisco Bay area. Keeping up with what is going on is an overwhelming
    task if there is not a central repository that is easily accessible. The San Francisco
    Arts Organization, www.SFArts.org, has a site that coordinates listings of all
    of the events into disciplines, such as dance, music, and theater.


    This project will use the database from the SFArts project and create a voice
    interface for accessing the calendar of events. A special thanks is offered to
    Larry Larson, site manager, for providing access to the San Francisco Arts Calendar
    data and for creating and debugging the Cold Fusion template.


    THE PROBLEM

    The general public wants access to a calendar of events for all types of performances
    in the San Francisco Bay area.


    THE SOLUTION

    Create a voice interface to the database of existing events that is stored on
    the San Francisco Arts Organization site.'
  merge: -1
