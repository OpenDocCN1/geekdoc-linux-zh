  md: '# Creating Links 93


    > NOTE The <subdialog> element is not the subdialog; it is the call to the subdialog.
    The subdialog itself is pointed to the src attribute of the <subdialog> element.


    The subdialog is called from the <subdialog> element through the src attribute.
    The value of the attribute is a URI that uses a fragment identifier to access
    the subdialog. A name attribute within the <subdialog> element is used for referencing
    the return values sent back from the subdialog. Listing 2.15, line 5, shows a
    <subdialog> element named result placing a call to the personali. The subdialog
    looks like a regular <form> block except for the <return> element on line 56,
    which we will discuss a bit later.


    The call to the subdialog in this application is very simple, sending processing
    to the subdialog and accepting the return values. Calls to subdialogs can also
    pass parameters to the subdialog through <param> elements. This will be examined
    in future projects.


    The form at lines 31 through 59 of Listing 2.15 is the subdialog that will collect
    information from users and make it accessible to the calling routines. The form
    starts with a <block> prompt, explaining to users why the information is requested.
    Fields are used to prompt users for their planet, gender, and number in their
    party. The names of these fields will be used to access user input when processing
    is returned to the calling routine.


    The third <field> element, on line 53, contains a type attribute, which is used
    to force a data type of number from the user. Error checking is handled by the
    platform unless the developer handles errors explicitly.


    # <return> Elements


    The <filled> element starting on line 55 contains a <return> element that is used
    to send the user input back to the calling routine. The <return> is used to end
    a subdialog or short-circuit the rest of the subdialog if it is used before the
    subdialog is completed. This is useful for handling test conditions and returning
    the results to the calling routine.


    The namelist within a <return> element is a space-delimited list of the field
    names that have been processed. By default, if there is no namelist attribute,
    no variables are returned.


    # Using Returned Values


    Lines 7 through 9 of Listing 2.15 demonstrate how to access the named variables
    that have been returned from the subdialog. The <subdialog> element has a name
    of result and is used to store the return values from the subdialog. The results
    of individual fields by preceding the field name with the subdialog name followed
    by a dot. The code sample, to access the input for planet, you would use result.planet.
