    \ element contains a src attribute that points to a sound file. If the file is\
    \ not available, the content within the audio tag is ignored. The fetchtime attribute\
    \ specifies a time in seconds for the interpreter to fetch the sound source before\
    \ it plays the element's content.\n\nPrerecoded audio files can come from many\
    \ sources. For a simple application, recording your own prompts can be fun and\
    \ instructive. The GoldWave Player at goldwave.com is a good tool for creating\
    \ homemade prompts. A production-level application for paying clients using professional\
    \ voice recordings.\n\nThe greeting on line 35 of Listing 4.2 is contained within\
    \ an <audio> element. The source file authenticationWelcome.wav has 2 seconds\
    \ to play before the TTS mechanism overrides and updates the text content of the\
    \ <audio> element.\n\n# Mapping Grammar Slots\n\nAs we have seen in previous projects,\
    \ grammars are created to compare user input for appropriate. A grammar term or\
    \ phrase can also be mapped to a specific value. This is useful when multiple\
    \ terms are synonymous for a single term, where the single term will be used as\
    \ a comparison condition. In our case, a user's password needs to be mapped to\
    \ a designated phone number and checked against the caller's phone number.\n\n\
    The grammar of the password field in Listing 4.2 consists of a list of password\
