    # Context-Sensitive Inferences


    The FAQ engine understands what is being referred to by the context of a dialog.
    Each conversation with the FAQ engine builds new inferences dynamically within
    the conversation''s context. Inferences to objects that are being spoken about
    are carried through the dialog. When talking about accommodations, it will refer
    to accommodations, rooms, a room, or any other synonym that has been defined in
    the vocabulary for that item. These are temporary relationships that will be terminated
    when the program exits.

    Listing 10.22 checks to see if inferences regarding rooms are transferred through
    the dialog. Line 1 sets up the context of the discussion is about a room. Line
    4 refers to the room as it, with the program responding on line 5 that a sleeping
    pod is available. Line 7 moves the discussion to a new context, asking the program''s
    name. Line 10 checks to see what it refers to, confusing the program because the
    context now refers to a name, which has nothing to do with availability. Line
    13 moves the context of the dialog back to accommodations, and Brainhat once again
    understands that rooms are being discussed.


    ```

    1. >>do you have a room

    2. yes. I have sleeping pod. a sleeping pod is available.

    3.

    4. >> is it available

    5. yes. a sleeping pod is available.

    ```


