    # Log Browser


    The Log Browser (see Figure 4) is used to examine the calls that have been placed
    to your application, giving an analysis of the call flow from the program''s point
    of view. You can search for calls by date range and also include a specific caller''s
    phone number within the search.


    The Log Browser has two screens. The opening screen displays a form for choosing
    a range of dates, a specific caller''s phone number, or a basic text search. The
    four buttons beneath the form are used to control access to the log files. The
    Submit button brings a list of files that match the criteria requested in the
    form, and the Most Recent Log button opens a new window to display the log of
    the most recent call to your application. Reset returns all of the form fields
    to their default values.'
