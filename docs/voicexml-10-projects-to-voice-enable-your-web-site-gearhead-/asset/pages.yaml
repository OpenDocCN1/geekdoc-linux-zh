  md: '# 300 Project 9


    A Speech Object is a predefined module that is part of the processing platform.
    The Behavocal environment contains objects for processing many types of data.
    Table 9.1 lists some of the most useful objects in the Behavocal platform and
    what they collect from the user. When an object is called, the execution of the
    dialog is controlled by the object. The object handles all prompting, error messages,
    and return values from the user and stores them in the eventDate. The return from
    an object is a result that can be used by an ECMAScript variable to access the
    return values.


    Objects are at the field level within a form. In Listing 9.5, a call is placed
    to date the <object> through a classic attribute, pointing to the location of
    the object''s implementation.


    The <object> element promotes the user for data. The input is stored in the event-Date,
    making it possible to access specific components through dot notation.


    +   Most supply objects that can handle credit card numbers, dates, social security
    numbers, and address input. Check your platform''s documentation for a list of
    available speech objects.


    +   Add a date <object> to the VoiceXML script, inserting it as a field-level
    item below the Discipline field.


    | OBJECT | COLLECTS |

    |---|---|n| behavocal.cafe.SOAAirline | Airline name |

    | behavocal.cafe.SOPickStock | Company or index number |

    | behavocal.cafe.SOCityState | City and state name |

    | behavocal.cafe.SOStreet | Street name |

    | behavocal.cafe.SOStreetNumber | Street number |

    | nuance.so.SOCCreditCardInfo | Credit card number |

    | nuance.so.SODate | Date |

    | nuance.so.SONATeleelephoneNumber | Phone number, U.S. format |

    | nuance.so.SOQuantity | Number as quantity |

    | nuance.so.SOSocialSecurityNumber | Social security number |

    | nuance.so.SOUSCurrency | Currency amount in dollars and cents |

    | nuance.so.SOUSZipCode | Zip code, U.S. format |'
