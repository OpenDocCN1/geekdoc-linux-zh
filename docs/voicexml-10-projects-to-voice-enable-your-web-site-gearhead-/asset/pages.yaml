    # Voice Prints


    Most vocal platforms can store a user’s voice print and make it available for
    use dur-

    ication. The implementation will be platform specific, but it is worth learn-

    if your system needs triple-strength security. The BeV platform has an

    implementation of voice print sampling that can be used within the authentication

    script. In addition to requesting a user password, when the user speaks, the voice
    can

    be checked against stored voice patterns for a more secure authentication.


    > Voice recognition is not defined in the VoiceXML 2.0 specification. However,

    it is an important enough technology that most vendors have implemented

    it. Check your vendor’s documentation for specifics. The code examples in

    this chapter are BeVocal specific and may not be applicable for your

    platform.


    # Making a Voice Print


    Before using voice authentication as a login procedure, the system must be trained
    to

    identify the user’s voice as a unique item. The script in Listing 4.3 takes several
    voice

    samples from the user and combines them into a single voice print.'
