    # **Create an XML Skeleton**


    The first step in creating the XML file is to create the basic skeleton that will
    hold the data. Listing 8.6 shows a skeleton that contains the XML declaration
    as its first line. The root element is declared with a `quizFileName` attribute.
    The `quizFileName` will be used by the XSLT stylesheet to create the start link.
    Line 5 closes the XML document. All content within the XML file will be contained
    within the quiz root element.


    ```

    1. <?xml version="1.0">

    2.

    3. <quiz quizFileName="quiz-startrek.vxml">

    4.

    5. </quiz>

    ```


    **Listing 8.6** The XML skeleton.


    > Create a new Projects folder on your local hard drive. Build the XML skeleton
    shown in Listing 8.6 and save it as quiz-startrek.xml in the Projects directory.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_280_0.png)


    # **Define a Link**


    Analyzing the VoiceXML file in Listing 8.4 shows that the `<link>` element is
    the first child of the `<xml>` root element. The XML data file can define the
    structure of the `<link>` element as shown in Listing 8.7 starting on line 5.
    The `<link>` must contain a `<next>` element that holds the URI of the location
    the link will transfer to when activated. The `<grammar>` element holds the simple
    grammar that will activate the link.'
