  md: '# CHAPTER

    2

    Setting Up the Working Environment


    VoiceXML is an interface layer that acts as an interpreter between the end user
    and a Web server processing platform. A VoiceXML application accepts speech as
    input, translates speech into ASCII text understood by the processing environment,
    and then formats the results of the processing into verbal output. VoiceXML environment
    can reside locally, maintained and administered by you, or on a remote machine
    controlled by an Application Service Provider (ASP) that specializes in housing
    VoiceXML applications.


    VoiceXML applications can be static documents with hard-coded data or they can
    be dynamically generated using CGI, JS, ASP, or any other type of processing mechanism
    over the VoiceXML server or on a Web server. The VoiceXML interface can give access
    to existing data and processes on your Web server. Instead of accessing the data
    through a visual Web browser, the data is accessed through a verbal browser.


    > The VoiceXML interface gives access to existing data and processes on your server.


    Beginning developers will find it easy to use an established vendor to house their
    applications than install and deploy a full-blown environment with 24-hour, 7-day
    (24/7) monitoring. Using an ASP still allows access to data on existing Web sites,
    but it leaves implementation details of the VoiceXML platform to a service provider.
    In this chapter, we will examine online VoiceXML ASPs and then set up a developer’s
    account with one of the free services.'
