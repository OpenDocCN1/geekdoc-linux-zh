    # Handling Questions on Cost


    The next extension to the scenario handles questions on cost. We need to create
    a proposition that will respond when user asks about expense. Listing 10.27 has
    a proposition that will understand the question on cost and ask if the user has
    a credit card.


    The conditional statement on line 1 checks to see if the user is asking “How much
    is a room?” or “How much does a room cost?” The response is mars-krogens, so we
    will have to define that term in the vocabulary file before we can go much further.

    A mars-kugen can be compared to a dollar when defining the term. Looking in the
    words file, we see that dollar is defined as a child-of things that are related
    to valuables. We define the mars-kugen in the extended-vocabulary.mpm file, relating
    a singular krogen to plurals krogens, which feeds up into a top-level of things.'
