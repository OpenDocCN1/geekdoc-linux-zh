  md: "# Localization Help and Error Messages\n\nIn previous projects, help and error\
    \ messages were set at the application level, making them global in scope. These\
    \ may also be set at the form and field levels to scope them locally. Localizing\
    \ help and error messages is useful for creating context-sensitive messages, giving\
    \ each <field> or <form> block its own event handlers.\n\nAll errors are currently\
    \ handled by the platform's default responses. Listing 6.15 details a series of\
    \ context-sensitive help and error messages to replace the defaults. Because all\
    \ of the user input for this application is contained within the getElementName\
    \ form, the error checking can be localized within the contactList field, instead\
    \ of creating it at a global level as a child of the <xml> element.\n\n```\n<field\
    \ name=\"contactList\">\n<count count=\"1\">\n  I do not recognize that name.\
    \ Please try again\n  <reprompt/>\n</count>\n<count count=\"2\">\n  This is the\
    \ second time that name was not recognized.\n  Try one more time.\n  <reprompt/>\n\
    </count>\n<count count=\"3\">\n  Sorry! You have not entered name in your book\
    \ yet.\n  <goto nextitem=\"anotherCall\"/>\n</count>\n<ininput count=\"1\">\n\
    \  I did not hear you say a name.\n  <reprompt/>\n</ininput>\n<ininput count=\"\
    2\">\n  Please speak a name to access your contact list.\n  </ininput>\n<ininput\
    \ count=\"3\">\n  There must be something wrong with the connection.\n  Please\
    \ call back on a better phone line.\n  <disconnect/>\n</ininput>\n```\n\n**Listing\
    \ 6.15** Help and error messages. (continues)"
