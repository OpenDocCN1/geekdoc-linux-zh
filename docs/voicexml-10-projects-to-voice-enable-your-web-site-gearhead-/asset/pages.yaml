    # Handle Requests Dynamically with <submit>


    The final type of link in the project is generated with the <submit> element.
    <submit> is similar to a <goto> element, but in jumping to a new section for processing,
    it can pass variables to a script. This is useful when doing CGI-type processing
    to generate dynamic content from previous user. To send data to a script, the
    URI of the script must be inserted as a src attribute of the <submit> element.

