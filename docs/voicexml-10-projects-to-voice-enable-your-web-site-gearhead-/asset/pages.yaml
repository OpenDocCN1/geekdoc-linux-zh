  md: "# Building Basic Pages with VoiceXML\n\nOver 20 elements have been modified\
    \ by the VoiceXML 1.0 specification to synchronize with the SSML. Additionally,\
    \ there are dozens of clarifications miscellaneous notes within the new spec.\
    \ See Appendix J of the VoiceXML 2.0 Working Draft for a comprehensive list of\
    \ changes.\n\n> Appendix J of the VoiceXML 2.0 Working Draft has a comprehensive\
    \ summary of deprecated elements, modified elements, and clarifications of the\
    \ specification.\n\n# <form> Elements\n\n<form> elements are the building blocks\
    \ of a VoiceXML application. In a simplistic sense, VoiceXML forms are HTML forms,\
    \ collecting information from the user through input fields and sending the input\
    \ to the voice interpreter or a Web server to be processed.\n\n <form> can hold\
    \ four types of elements: <field> for collecting user input, <var> for variables\
    \ limited to the scope of the form, <catch> event handlers for processing specific\
    \ events, and processing logic within the <filled> element. We will be examining\
    \ each of these field-level items as our project expands.\n\n<form> elements can\
    \ carry two attributes. The idのである is a unique name for the form, making it possible\
    \ to access the form within the current document or from an external document.\
    \ A scope attribute within a <form> element defines the scope of the form's grammar.\
    \ Grammars, rules define what the user may speak as, it can have a scope at the\
    \ complete document level or that form's dialog only. The default is for the dialog\
    \ to be scoped.\n\nThe <form> element on line 4 of Listing 1.1 specifies the beginning\
    \ of a dialog within the application. Think of a dialog as a conversation between\
    \ the user and the application. An application may contain multiple dialogs, each\
    \ contained within its own form. The order of processing the dialogs is controlled\
    \ by the FIA, which we will be looking later in this project.\n\nThe Hello, World\
    \ application has a single <form> element that contains a <prompt> element nested\
    \ within a <block> element. Because no user input is requested, there is no grammar\
    \ defined within the form.\n\n# <block> Elements\n\nA <block> element on line\
    \ 5 holds executable content. <block> elements can hold any other elements that\
    \ need processing, such as assigning variables, playing audio files, moving to\
    \ other dialogs, and handling errors. We will make extensive use of <block> as\
    \ our projects develop.\n\n<block> elements can carry three attributes: name,\
    \ expr, and cond. The name attribute of a block is a unique identifier that is\
    \ used to access the block during the FIA. The expr and cond attributes are part\
    \ of the FIA processing and will be discussed when we take a look at the FIA."
  merge: -1
  pgno: 65
- img_proc: true
  md: "# Elements\n\n<block> contains a <prompt> element that will be output by the\
    \ Text-to-Speech (TTS) interpreter. A <prompt> acts as a controlling mechanism\
    \ for the output of computer-generated speech, precorded prompts, and audio files.\
    \ The most useful attributes of the <prompt> element are bargein, cond, count,\
    \ and timeout.\n\nWhen a TTS engine is outputting the output than for, it is sometimes\
    \ more user friendly to let callers interrupt the output for them to listen to\
    \ the complete reading or recording. Setting the bargein attribute allows true\
    \ allow the user input to be received immediately and causes the TTS engine to\
    \ stop its output, returning control to the VoiceXML interpreter for further processing.\n\
    \nA cond can be activated for a specific condition, determining whether or not\
    \ the <prompt> should be played. The default cond is true.\n\nThe VoiceXML interpreter\
    \ keeps track of the number of times a <prompt> has been repeated. The default\
    \ value of count is 1. It is activated each time the prompt is played through.\
    \ The count attribute is useful for checking how many times the <prompt> has been\
    \ activated. By setting count within a <prompt>, a different output can be activated\
    \ if the user is repeated to the prompt because of lack of input or inability\
    \ to match the recognized grammar.\n\nAs an example of using count, look at the\
    \ following code fragment:\n\n```\n<prompt count=\"1\">What is your phone number?</prompt>\n\
    <prompt count=\"3\">\n  I need your phone number in order to proceed.\n</prompt>\n\
    </block>\n```\n\nThe first prompt requests the user’s phone number. The default\
    \ error checking of the VoiceXML interpreter will wait for a specified amount\
    \ of time for user response, increment the count attribute by 1, and repeat the\
    \ prompt again if the user has not responded. If the user does not respond, count\
    \ is incremented to 3, and the section activated.\n\nThe timeout attribute holds\
    \ a value of time in seconds for activating a no-input error message. The format\
    \ is a number in seconds followed by s: 5s. The length of the default timeout\
    \ is platform specific.\n\n> Section 4, System Output, of the VoiceXML 2.0 Working\
    \ Draft is one of the most extensive sections in the document. It deals with how\
    \ prompts are handled, available attributes, prompt selection, and input collection.\n\
    \nStrictly speaking, <prompt> elements are not mandatory when outputting TTS from\
    \ within a block. Any literal text within a <block> element will be output by\
    \ the VoiceXML processor. However, not using <prompt> elements limits the ability\
    \ to supply attributes that will allow the user to give input before the end of\
    \ the prompt or for the developer to define a condition that would alter the output\
    \ from the prompt."
  merge: -1
