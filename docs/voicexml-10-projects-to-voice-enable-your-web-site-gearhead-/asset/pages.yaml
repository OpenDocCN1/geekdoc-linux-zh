    # <link> Elements


    A <link> element in VoiceXML is the counterpart to an <a> tag in HTML. The link
    can contain a next or expr attribute that holds a URI for التاليing. The next
    attribute functions just as the href attribute in the HTML anchor tag, whereas
    the expr attribute dynamically generates the URI using ECMAScript syntax. Either
    next or expr can be defined within a single <link> element, but not.'
