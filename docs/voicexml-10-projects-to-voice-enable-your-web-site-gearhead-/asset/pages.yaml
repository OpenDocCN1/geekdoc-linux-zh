  md: '# 156 Project 5


    a subdialog contains two attributes: a name attribute as a unique identifier and
    a src attribute that holds the URL location of the template to be called.


    > TIP The platform set the default attributes when making a call to a subdialog
    unless you need to specifically override a value. See your vendor''s documentation
    for applicable attributes.


    > HANDS ON Create an application root document that will be used for accessing
    multiple templates within your application. At a minimum, subdialog calls to greeting,
    menu, and goodbye templates. Include a developer link to the top of the base application
    for restarting the application.


    > NOTE The subdialog calls will not work until the templates are created.


    # Creating Templates


    The base application created in Listing 5.1 is the jumping off point for access
    to the various templates of the application. To create the templates, we will
    first place-holder templates and then add a processing script to each.


    # Templates versus Objects


    XML has elements that can be used to create reusable components: <subdialog> and
    <object>. <subdialog> was introduced in Project 2 when discussing lines. It gives
    the developer the option of creating routines within an application that function
    like subroutines or functions, accepting parameters and returning values based
    upon those parameters.


    <object> are inbuilt functions provided by the platform to handle complex input
    processing as requesting a credit card number or answering an address. The objects
    are completely self-contained and do not allow the developer to make adjustments
    for specific needs of the application. They are platform specific, limiting portability
    when changing vendors.


    As we develop Project 5, when referring to templates, we will be talking about
    calls to subdialogs. Templates are useful when objects provided by the platform
    are too restrictive for the task at hand. By creating developer-defined templates,
    components can be adjusted and tweaked for various applications without having
    to design the complete template from scratch.


    > Reusable components are repackaged complex routines that are provided by the
    platform and are accessed through the <object> element. Templates are created
    by the developer to isolate sections of the code that are easily customized for
    use within multiple applications.'
