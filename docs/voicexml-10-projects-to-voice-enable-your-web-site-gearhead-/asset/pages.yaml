    # ### Listing 5.9 Address placeholder.


    Listing 5.9 shows a basic template for the address choice. It follows the same
    format as the other placeholders. Line 3 points back to the base application,
    templates.vxml, giving access to the global variables and links that were declared
    two levels above the current template. The address gives an id of address to the
    current form, and line 8 confirms to the developer of the current processing context.

    The <return> element on line 9 returns execution to a <subdialog>. This has implications
    returning within the current context. The address template was called from the
    mainmenu, in turn was called a subdialog from the application root document. Because
    <return> relates to the context in which the subdialog was called, processing
    returns to the application root document context, not the mainmenu, when processing
    is completed within the address template.


    > The <return> element on line 9 of Listing 5.9 returns to the routine that called
    the original subdialog, not the menu item that called this template.


    > Insert the menu from Project 3 into the placeholder template in the current
    project. Change the links with the <choice> elements to point to the appropriate
    external files. Create placeholder templates for address, voice, and transfer.
    Use Listing 5.9 as a model for creating the templatesaddress.vxml, templatesransfer.vxml.
    Before proceeding to the next section, test the application to verify that processing
    can access all levels of the application.


    > The application has three levels at this point: level one is the base application
    that calls the subdialogs, level two is the main menu that points to external
