  md: '# Shadow Variables


    Field-level items may have values attached to them that are made available through
    a shadow variable. When the verifier returns information to the <verify> element
    concerning the return value of the voice authentication, it is accessed through
    the decision property of the shadow variable.


    +   A shadow variable holds additional information about a <field> item or a <verify>
    element that can be accessed through the field item''s name and the shadow variable''s
    properties.


    To access the value of a shadow variable, begin with the field item''s name followed
    by a dollar sign. A dot separates the element name from the property. Shadow variables
    are attached to field item values according to the variable''s context. Check
    your platform''s documentation to determine what shadows are available for each
    type of item.


    The verify shadow variable contains three possible values: accepted, rejected,
    or unsure. When the value is accepted, the verifier confirms the voice print and
    the spoken input is a match. rejected signifies there is no match. If the return
    value is unsure, the verifier cannot guarantee a match, but the confidence level
    is high enough that it might be a match. The developer can use the return values
    to decide how to proceed with processing.


    In our case the userNames.decision shadow variable accessed on line 64 contains
    information about the recognition confidence of the user input. It is used in
    a conditional statement to check the return value from the verifier. If the voice
    input is accepted, processing transitions to the mainmenu form. Any other response
    from the verifier forces a rejection, terminating the call through the goodbye
    form.


    For this application, the mainmenu form is a placeholder for proof of concept,
    putting a confirmation message to the developer and exiting through the goodbye
    form.


    # Final Touches to the Application


