    # Group Items in a Grammar


    The telephone contact list has numbers that are duplicates. Any group of people
    who have the same phone number can be consolidated into a single list within a
    set of square brackets. Square brackets act as the equivalent of or when setting
    up a grammar. You can insert a list of names separated by spaces, and each name
    will be a standalone token. This saves space in the coding and makes more sense
    logically when trying to maintain your mini-database. If a family moves and changes
    its phone number, only one item needs to be defined.


    Listing 6.4 consolidates the contacts who have the same phone number into a list
    and associates each member of the list to a single slot value. White space and
    line breaks are generally ignored when building grammar structure, so the phone
    numbers are lined up, making it easy for your eye to scan down the list instead
    of having to jump back and forth, trying to locate a phone number.'
