- img_proc: true
  md: 'This brings up an interesting subject relating to user responses. The original
    instructions for the quiz give three possible answers as "Kirk," "Spock," or "McCoy."
    The grammar for each of the questions does not assume that the user will stick
    with the specific choices offered. When possible, extend the grammar to include
    every possible choice user might utter that would be considered a correct response.
    This will make your application more user friendly and give the impression that
    it is relatively intelligent when it comes to understanding spoken input.


    # Inserted Prompts


    Using TTS-generated prompts is a good way to test an application, but recorded
    prompts make a vocal interface much more user friendly. The <audio> tag is used
    to point to acordcord sound file that can be used as a prompt. The src attribute
    is the name of the sound file. For the <audio> tag content should be text that
    you will use if the sound file is not available.


    There are two types of sound files recommended by the VoiceXML specification:
    Raw (headless) and WAV (RIFF header). The types of acceptable files are platform
    specific. The most widely accepted format is *.wav. Check your platform’s documentation
    to see what type of sound files can be processed.


    # Download the Star Trek Sound Files


    Star Trek resource files for this project can be found at stinsv.com, Star Trek
    in Sound and Vision; Figure 8.2 shows its home page. Dave Wythe, owner of the
    site, asks that you download the files needed for your project, not to point to
    them on his site. With over 18,000 files available, you can see why he asks. Please
    read “Terms of Use” before using any of them.


    +   Go to www.stinsv.com and download your favorite sound files to use as quotations
    in your project. You can rename the files to make them easier to remember, but
    you must keep the same file extension (.wav). When uploading files to the BeV
    environment, all names are forced into lowercase letters, you might as well name
    them in lowercase to begin with.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_267_0.png)'
