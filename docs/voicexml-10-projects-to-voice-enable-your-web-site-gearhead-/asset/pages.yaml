  md: '# Project 1


    # Form Interpretation Algorithm


    The underlying processing sequence within any VoiceXML application is controlled
    by the FIA, which determines when each form item is visited by checking the guard
    condition of the field-level items. In this section, we will examine how form
    items are selected for processing, how guard conditions are set, and the order
    in which processing occurs.


    > NOTE This section is a brief overview of the concepts of the FIA. Extensive
    explanations and examples are in sections 2.1.6 and Appendix C of the VoiceXML
    2.0 Working Draft.


    # Basic Concepts of FIA


    As we have seen developing the Basic Pages project, forms are used to create dialogs
    and interaction between the VoiceXML application and the user. The FIA defines
    the sequence for processing events once a form has been accessed. The interpretation
    is done in three stages: select, collect, and process. A field-level item is selected
    for processing, user information is collected for that item, and the input is
    processed. The FIA continues until all items within the form have been processed,
    or transitions to another dialog.


    # Selection Phase


    During the selection phase, the FIA accesses field-level items within a form order:
    first seen, first processed. See Table 1.1 for a list of field-level items. Each
    form item has a guard condition associated with it that determines whether or
    not the item should be visited during processing. By default, a field-level item''s
    guard condition is set to false, forcing the item to be visited. The FIA checks
    the guard condition of an item and moves to the collection phase for that if the
    guard condition is false. When the guard is true, the item is skipped.


    | Table 1.1 Field-Level Items |

    | FIELD-LEVEL ITEM | DEFINITION |

    |---|-|

    | <field> | Declares an input field in a form |

    | <object> | Interact with a custom extension |

    | <record> | Records an audio sample |

    | <subdialog> | Invokes another dialog as a subdialog of the current one |

    | <transfer> | Transfers the caller to another destination |'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Building Basic Pages with VoiceXML 57


    # Collection Phase


    The collection phase is used to accept input from the user and check the input
    against the grammars for that item. Upon entrance to the field item, the FIA will
    queue and play all prompts and wait for user input. The guard condition of the
    item is set to true when an utterance is recognized. The user input is stored
    in the field''s variable and can be accessed during the processing phase.


    # Processing Phase


    The processing phase takes the input from the collection phase and processes it
    according to its text. When a user utterance is recognized as the collection phase,
    the FIA will set the guard condition of item to true, making it inaccessible for
    selection. The actions within the <filled> element are executed and processing
    continues by selecting the next available item.


    Error handlers are activated if there is a problem with the user input. The FIA
    will respond with the defined condition within the handler, which could be to
    exit the application, replay the prompt, or transition to another item defined
    by the developer.


    # Ending the FIA


    The selection-collection-process sequence continues until all guard conditions
    within the form have been set to true. or a <goto> or <submit> element. If a transition
    to another dialog is not found, the processing ends and the application is terminated.


    > Processing does not automatically fall through <form> to <form>. An explicit
    <goto> or <submit> must be used to transition to another form or document once
    all the guard conditions within the form have been set to true. If there is not
    a transition from the form, the application will terminate.


    # Analyzing the FIA Sequence


    To get a clearer picture of how the FIA moves through the Vocal Log Browser at
    we will run the script from Listing 1.4 and use the output from the Vocal Scrip
    and Log BeVocal to see the behind-the-scenes processing. Listing 1.5 shows the
    output from the Vocal Scrip when the script is run.


    The first line of Listing 1.5 comes from the greeting form. Lines 2 through 5
    are generated from the first <block> within meantime.


    Line 6 is a prompt, requesting a response from the user. The user input does not
    match anything within the grammar for that field, so the output on lines 9 and
    10 from the <nomatch> element, which has a count of 1. The user responds with
    “no,” which is an acceptable response, generating an access code word. The goodbye
    form outputs a message and the application terminates.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_79_0.png)'
