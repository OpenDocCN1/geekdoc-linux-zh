  md: '# # PROJECT 8

    Quiz Generator


    Telephone game quizzes and adventure hints are natural extensions to online games.
    The Quiz Generator project came about when I discovered a site on the Internet
    that contains over 18,000 sound files from the Star Trek series. I thought it
    would be fun to insert some of the character voices into a game format and have
    people guess which character was speaking. A special thank you to Dave Wythe at
    Star Trek in Sound and Vision for providing the sound files for this project.


    | THE PROBLEM |

    | Most companies have multiple sets of data, stored in structured format, that
    need to be outputted to different formats. The data is hand-coded into a preset
    template, causing input errors and wasting valuable time. Once the data has been
    input into the template, it is no longer available for other applications |

    | THE SOLUTION |

    Isolate the data from the formatting. Store the data in a nonproprietary format,
    such as XML. Use XSLT as a generic formatting mechanism, outputting VoiceXML on
    the fly, while leaving the data source untouched.|'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# Project Description


    This project creates a game called the “Star Trek Quotation Game.\ The user calls
    the game phone, hears quotations from the original Star Trek series, and guesses
    who is speaking. The techniques in this project show how to integrate sound recordings
    into VoiceXML telephone output, create localized error messages, integrate multiple
    grammars into a single format by use copying, and dynamically generate content
    from an XML data source. The data is completely isolated from the formatting,
    so any number of quizzes, surveys, or games can be run from the same XML/XSL processing
    script.


    Although a Java work environment is needed to run the advanced part of the project,
    no Java programming experience is necessary. The same goes for the XML/XSLT programming.


    To create this project will:


    +   1. Create a simple quiz.

    2. Add questions to the quiz.

    3. Insert recorded prompts.

    4. Record the prompts.

    5. Complete the VoiceXML template.

    6. Set up the XML/XSLT work environment.

    7. Create the data file (XML).

    8. Build the stylesheet (XSL).

    9. Test the basic application.

    10. Insert XSLT templates into the stylesheet.

    11. Test the completed XSLT stylesheet.


    # You Will Need


    +   A developer account with BeVocal (cafe.bevocal.com)

    VoiceXML 1.0 Specification (www.w3.org.voice)

    TextPad or any simple text editor (www.textpad.com)

    Java Development Kit (www.sun.com)

    Xerces XML Parser (xml.apache.org)

    Xalan XSL Processor (xml.apache.org)

    GoldWave Sound Recorder (www.goldwave.com)

    Recordings of prompts

    Star Trek Sound Files (www.stinv.com)

    Source code for this project (cafe.bevocal.com/wiley/10projects)


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_258_0.png)'
