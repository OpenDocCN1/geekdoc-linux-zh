  md: '# Project 2


    # <choice> Elements


    <choice> element contains the content that will be output by the <enumerate> element
    and the attributes for controlling acceptable input from the user. There is no
    restriction on the number of <choice> elements within a menu, it is difficult
    for a user to keep track of multiple choices when there is no visual reenforcement.
    A good user interface will limit the choices to a maximum of five.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_106_0.png)


    Keep menu lists to a maximum of five items. The user has no clues other than the
    vocal prompt keep track of choices.


    <choice> element can carry multiple attributes, including dtmf, accept, next,
    event, and expr. Using the dtmf attribute is way to allocate a single digit to
    represent a choice. The user may input the digit from the telephone keypad in
    lieu of speaking a phrase from the grammar. When dtmf is within a <choice> element,
    it will override the value that is set at the menu level.


    The accept attribute of a <choice> can have a value of exact or approximate, overriding
    what has been set in the <menu> element.\ We have seen next, event, and expr in
    other contexts, and they work the same way here. next is a specific URI that will
    transfer processing to a new dialog, expr can dynamically generate the URI for
    the transition, and event will trigger an event handler instead of forcing a transition.


