    Keypad input from the telephone can be accepted as input from a menu by setting
    the dtmf (dial tone multifrequency) attribute of <menu> to true. A dtmf number
    will be allocated starting at 1 to each <choice> element, up to 9. The sequence
    will automatically be generated based upon the document order of the <choice>
    elements. In your application, activities will receive 1, restaurants 2, and changes
    3.


    A scope can be set to limit the grammar recognition to the current dial only or
    to make it available throughout the execution of the document. The default value
    of the scope attribute within a menu is dialog. Scoping the dialog to document
    level within an application root document can be useful when building a menu that
    would be accessible to a multidocument application.


