  md: '# Introduction


    Playing with a new technology is fun. I have been a teacher in one form or another
    for over 20 years, but it still gets me excited when I see something that seems
    obvious and so simple that it is shocking it hasn''t been done before. That''s
    the way I feel about VoiceXML.


    VoiceXML makes it possible for anyone who can build a basic Web page to create
    a voice Web page. The first time I heard about VoiceXML, it took me less than
    an hour to get my first application and running. It''s just that simple. Simplicity,
    however, doesn''t mean that big things can''t be done. If you have called 1-800-555-1212
    recently, you have heard a VoiceXML application written by TellMe.com handling
    the incoming calls through VoiceXML.


    # Who Should Read This Book


    VoiceXML: Projects to Voice Enable Your Website is an outgrowth of my experiments
    while playing with VoiceXML. One of the problems with many technology books I
    have seen is that they give you all of the tools, but they don''t tell you how
    to use them. Context is one of the most important parts of learning. I think that
    people beginning to learn a technology can learn much more from creating and implementing
    projects than by learning about function sets and where things are on a menu bar.


    This book is for beginning developers. It assumes no knowledge of VoiceXML or
    previous experience with the technology. If you are a Web developer or have developed
    even one Web page, this book is for you. VoiceXML terminology is similar to HTML,
    but it has a smaller element set: There are less than 50 elements to learn. The
    first five projects will bring you up to speed with everything you will need to
    know when voice enabling your current Web site.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Introduction


    Database managers will find this interesting if they want to see how to output
    a database query as a vocal response. Most of the data on the Web is stored in
    databases, whereas most of the people in the world still have access to a telephone.
    VoiceXML acts as the glue joining the two technologies.


    System administrators will be excited to know that VoiceXML can be used to call
    them on the phone when their systems need help. The application can be set up
    to call, not beep, but with a system simple message output vocally. With a little
    more, simple administration of the system can be handled through the phone call,
    making it unnecessary to use a computer to make updates.


    C programmers will have a field day with VoiceXML. Any type of output that is
    currently generated on a Web site through Perl, ASP, JS, PHP, or other dynamic
    content generator can be output as a response to be accessed over the telephone.


    However, this book is not for everyone. It is not a reference manual and does
    not cover advanced techniques of VoiceXML. If you already developed extensive
    voice applications or are a developer on one of the voice portals such as BeVocal,
    TellMe, or HeyAnita, this probably isn''t the book for you. You''d be better off
    with a detailed explanation of the VoiceXML 2.0 specification at the W3C, tearing
    apart the documentation on the Nuance site for developing complex grammars, or
    by using Bruce Balentine''s *How to Build a Speech Recognition Application style
    guide*. VoiceXML: *Professional Developer''s Guide* by Sharma and Kunins has also
    been getting good reviews as a solid reference material.


    But if you are just starting with VoiceXML, keep reading.


    # This Book Is Organized


    This book shows how to build basic VoiceXML applications from existing Web sites
    through a series of 10 step-by-step projects. Each project begins with a problem
    statement and a possible solution. The project description follows and includes
    an overview and a list of the components and steps it will take to complete the
    project. The implementation of the project goes step by step, each phase ending
    in a hands-on exercise, confirming that the application is working before proceeding
    to the next stage.


    The book is divided into two sections: chapters of introduction and projects.
    Chapter 1 is a general overview of VoiceXML and how it fits into XML technologies.
    This can be used as an introduction to the technologies or as a brief overview
    for developers who have previously XML/VoiceXML experience. Chapter 2 looks at
    the BeVocal voice portal environment that is used for developing the projects.
    The tools of the project are analyzed and basic setup procedures are.


    Next are the 10 VoiceXML projects. The first five projects take your existing
    Web site and expand it to a complete VoiceXML application. Project 1 begins with
    a basic Hello World application and Projects 2 and 3 add voice links and contact
    information. Authentication and login processes are covered in Project 4. Project
    5 reines the first four projects and breaks them into simple, reusable templates.


    After building the first five projects, you will have a solid understanding of
    how VoiceXML applications are created. The last five projects are built on the
    foundations of the previous five projects. Projects 6 through 10 can be done in
    any'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Introduction xix


    order; however, from user response, I''d suggesting Project 6, the telephone dialer,
    first because it is pretty impressive when you are trying to explain to your boss
    or in-laws how the technology can be used.


    Project 6 is a handy project that can be used as a phone book dialer, placing
    through voice requests. The Report Recorder in Project 7 allows surfers (wave
    surfers, not Web surfers) to call in reports on beaches around the world and the
    reports generate a wave file that can be heard on a Web site or the over. Project
    8 uses XML/XSLT technology to create phone quizzes that can be used for games
    or customer surveys. Project 9 uses the database calendar at the San Francisco
    Arts Organization to dynamically answer phone requests for entertainment information
    regarding dates and types of events. The final project, the FAQ engine, is an
    experimental for putting a voice interface on an inference engine that can handle
    questions through natural language processing. The projects are followed by a
    glossary of terms and acronyms.


    # Tools You Will Need


    The basic projects in this book can be run through one of the online voice portals
    as BeVocal, TellMe, or HeyAnita with no additional software. For Projects 6 through
    10, you will need the additional software, most of which is freely downloadable
    and available on the Internet.


    # What''s on the Web Site


    An accompanying Web site can be found at http://cafe.bevocal.com/wiley/10projects.
    It contains the latest code for each of the projects, a list of enhancements to
    the projects that have been suggested by other readers, and links to online resources
    for further reading.


    A newsgroup has been set up to handle questions, allowing developers to exchange
    information on how they have expanded the ideas in the book and use them in their
    own applications. Log in to the newsgroup at news://cafe.bevocal.10projects.


    My goal on the Web site is to set up a community of developers who would like
    to extend the projects and add to their usefulness. If you would like to participate,
    log in and join us.


    # Final Thoughts


    I hope I have gotten excited enough to begin your first project with VoiceXML.
    With this book and access to the Internet, you could have your first project up
    and running within an hour.


    I look forward to seeing you on the Web site and to your participation in the
    growing community of VoiceXML developers.'
  merge: -1
