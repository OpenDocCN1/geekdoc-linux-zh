    32 prompt the user for a name from the contact list. The first <input> is a simple
    case in the user did not hear the initial prompt. The second <input> is a clarification
    of what is expected from the user. If the third <input> event is reached, it is
    assumed there is a problem with the telephone system and the user is disconnected
    from the application.


    There are two <help> elements in Listing 6.15 that respond to a user''s request
