  md: "# Optional Tokens\n\nThe question mark signifies optional in VoiceXML grammar.\
    \ To make something optional, put a question mark right before the token, as shown\
    \ in Listing 6.6. The processor will now understand the user's request when a\
    \ first name is spoken alone or a first name is spoken with a last name. To handle\
    \ duplicates, leave off the question mark and force the last name.\n\n```\n<grammar>\n\
    <![CDATA[\n\n  ( rosemary 7miller ) { < contactList 718391234 > )\n  ( john ?caviglia\
    \ ) { < contactList 2072342342 > )\n  ( anthony kristi ?caviglia ) { < contactList\
    \ 2074354435 > )\n  (( cubby 7miller ) { < contactList 3343615678 > )\n  (( mary\
    \ jo) richard anton justin) ?weiss)<contactList 2014564564)>\n\n]]>\n</grammar>\n\
    ```\n\n**Listing 6.6** Optional last names.\n\n# Creating Nicknames\n\nAnother\
    \ way to handle duplicates is just as we do in real life: give one of the dupes\
    \ a nickname. Anthony's father first name is Anthony. When growing up, he got\
    \ the nickname Ants. When his mother was screaming for him wash his hands before\
    \ dinner, there was no confusion as to which Anthony was really in trouble. Use\
    \ the same technique (without screaming, of course) to develop a list that has\
    \ no ambiguity.\n\n```\n<grammar>\n<![CDATA[\n\n  ( rosemary 7miller ) { < contactList\
    \ 718391234 > )\n  ( john ?caviglia ) { < contactList 2072342342 > )\n  ( anthony\
    \ louise ) ?caviglia { < contactList 5105812384 > }\n  ({ants kristi} ?caviglia\
    \ { < contactList 2074354533 > }\n  (( cubby 7miller ) { < contactList 3343615678\
    \ > )\n  (( mary jo) richard anton justin) ?weiss)<contactList 2014564564>\n\n\
    ]]>\n</grammar>\n```\n\n**Listing 6.7** Inserting nicknames."
