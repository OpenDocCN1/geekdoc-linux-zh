  md: '# Set Up the Brainhat Server


    The core of this project is built around the natural language processing (NLP)
    Brainhat server. It is freely downloadable for development use at www.brainhat.com.


    # About Brainhat


    Brainhat is an NLP server that can dispatch tasks, handle natural language events,
    evaluate ideas, and ask and answer questions. Because Brainhat is based on knowledge
    representation, it can digress within a conversation, answer questions outside
    the script, and keep rich context. Built-in network capabilities make Brainhat
    a clearing and consolidation point for natural language events and delegated tasks.


    The Brainhat project was developed in 1996 by Kevin Dowd while he was working
    at Atlantic Computing. The name comes from an earlier attempt to fit a spaghetti
    collation with differential amplifiers and interpret brainways as a method of
    controlling appliances. The company now has full-time employees, including programmers
    with backgrounds in A.I. and linguistics.


    Programming Brainhat is done at three levels: creation of vocabulary, creation
    of grammar and associated transformation procedures, and creation of English language-based
    scenarios to motivate operation. Brainhat''s job is to discover the semantic value
    of input, run inferences, which may create new knowledge or side effects, and
    output responses as necessary.


    Brainhat can be extended to a natural computer interface for a robot or other
    program. Brainhat currently has a project using Brainhat for a robot that will
    be trained in space.


    # The Brainhat Server


    Brainhat is a platform for building language-based systems. It can understand
    language, represent and manage knowledge, run inferences, and generate output.
    Most of the application programming is done in English.


    The program comes with a basic vocabulary, which can be easily extended using
    a simple text editor. A context-free grammar tells Brainhat how to recognize parts
    of speech and how to assemble the parts into internal knowledge representations.
    Transformations take place as the input is assembled; word and phrase disambiguation,
    pronoun resolution, normalization of forms, and unlike or duplicate candidates
    are all completed by the time the input is recognized.


    The programmer motivates conversation by giving Brainhat an English language scenario
    that describes all of the common-sense knowledge needed for a conversation, plus
    inferences to pull it along. One might program a conversation that asks users
    about their meal choice; Brainhat understands the notion of things that are probable;
    if a conversation stalls, the program can push things in the right direction.


    # Install Brainhat


    Brainhat comes as a zipped download from www.brainhat.com. The installation is
    extremely friendly and does not overwrite any system configuration files or change
    a registry listing.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# FAQ Engine 319


    Navigate to the Brainhat site and choose download from the menu at the top of
    the page (Figure 10.2). Follow the links to download the binary distribution for
    Windows. Create a Brainhat directory on your hard drive and unzip the file, allowing
    the installer to create data and scenarios subdirectories. Once unzipped, the
    Brainhat directory will contain the Brainhat executable at the root level and
    two subdirectories that contain data files for scenarios setting the context of
    dialogues.


    # Test the Installation


    Test the installation by opening a DOS window, changing directories to the location
    of the Brainhat installation, and typing run at the prompt. The run command accesses
    the run.bat file, which gives configuration directives to the server for compilation.
    Confirmation of the Brainhat compilation will scroll past and end with a blinking
    prompt. This is the command line interface for Brainhat.


    Listing 10.1 shows the contents of the run.bat file. Line 1 changes directories
    to access the data files that comes as defaults. Lines 2 and 4 are confirmation
    notices to the user that processing is proceeding as planned. Line 3 calls the
    data.in and processes into the compiled data file that will be used by Brainhat
    to recognize words. Line 6 calls the Brainhat server, feeding it the compiled
    data file.


    ```

    1. cd data

    2. echo ''Pre-processing...''

    3. ..simplecpp < data.in > data

    4. echo ''Running Brainhat''

    5. cd

    6. .brainhat.exe -E data-data

    ```


    Listing 10.1 run.bat.


    The data.in file is nothing more than a list of files included in the compilation
    phase when the Brainhat server is started. Listing 10.2 lists the files that are
    included by default during initial installation. The files listed on lines 1 through
    5 are used for building the patterns of speech that Brainhat will recognize. These
    will not have to be changed to create our VoiceXL application.


    The most important for our purposes is the words file, which holds the list of
    words and hinders the compiler will use to know how the vocabulary words relate
    to one another. We will examine the words file in depth in the next section.


    ```

    1. #include "../config.h"

    2. #include "required-patterns"

    3. #include "debug-patterns"

    4. #include "cc-patterns"

    5. #include "input-patterns"

    6. #include "words"

    ```


    Listing 10.2 Default include files.'
