    # **Instructions and confirmBeginning Template**


    The <instructions> element has the exact structure as the <confirmBeginning> element
    in the XML data file. Listing 8.27 handles the two elements at once through the
    use of the union operator with the match attribute. This operator allows multiple
    elements of the same formatting template.

    The template contains a simple call to the audio template with a literal <block>
    element. Once again, use the power of XSLT templates. The <xsl:apply-templates/>
    continues to access the audio template whenever it is needed.


    ```

    1. <xsl:template match="instructions|confirmBeginning">

    2. <block>

    3.   <xsl:apply-templates/>

    4. </block>

    5. </xsl:template>

    ```


    **Listing 8.27** Instructions and confirmBeginning template.


    # **SeriesOfQuestions Template**


    The next job of the stylesheet is to output the series of questions. Each question
    is considered a set that holds tags for the question, answer (grammar), and correct
    and incorrect responses. Each will have its own template.

    The XML file contains a <seriesOfQuestions> element starting on line 1 of Listing
    8.28. A formatting template outputs a literal <block> element and places a call
    available through the <xsl:apply-templates/> call. The element inserts all the
    questions from the XML data file.

    To complete the exit, a graceful exit is created by calling the goodbye template
    within a set of literal <block> elements.'
