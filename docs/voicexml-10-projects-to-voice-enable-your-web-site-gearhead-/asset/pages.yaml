  md: '# Project 1


    A <field> element acts like the HTML <input> element for creating a field within
    a form. The field accepts user input and stores it in a variable, using the field''s
    name as the variable name. The fields are processed in order unless <goto> is
    used to move to a specific item or form. Attributes for a <field> element include
    name, type, and modal. We have previously seen name and cond attributes, but type
    and modal are new.


    # type and modal Attributes


    VoiceXML has a set of built-in grammars that can be used to retrieve user input
    for common items such as a date, phone number, and currency. By using the type
    attribute and specifying a data type as its value, the developer does not have
    to include a grammar for that field. Built-in types include:


    +   -boolean**: Tests for true or false

    - **date**: Accepts spoken input as a date or a term, such as tomorrow

    - **digits**: Integers 0 through 9

    - **currency**: Is relative to the current locale

    - **number**: Accepts spoken input

    - **phone**: Accepts spoken phone numbers

    - **time**: Accepts input phrases for time and outputs relative to the locale


    The modal attribute within a <field> element mutes all grammars from being accessed.
    The default is false, making global links and variables accessible within the
    dialog. Setting the value to true will temporarily disable all grammars except
    for the current field.


    The opening </ element in Listing 1.3, lines 3 through 6, is exactly the same
    as that in the basic application template previously developed. It presents the
    user with a short introduction to the form.


    # More on <field> Elements


    The <field> element starting on line 8 of Listing 1.3 has a name attribute with
    the value of offcode. It contains a verbal prompt for the user. A verbal prompt
    acts the way a literal label does in HTML forms, giving a clue to the user about
    what is expected as input.


    For a field to accept spoken input from the user, a grammar must be defined. The
    <grammar> element on lines 14 through 18 contains a set of utterances that the
    user may speak as acceptable input. We set up a very restricted grammar, only
    accepting yes or no as a response. Any other response will be handled by the default
    error handling of the VoiceXML application.


    The use of square brackets around the words yes and no identify the two words
    as individual items or tokens. As grammars become more complex, they will use
    other'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'types of regular expression quantifiers to build various optional or mandatory
    utterances. These will be examined in future projects.


    Placing the grammar within a CDATA section allows the developer to use special
    characters such as < >, and within the grammar. A CDATA section outputs it as
    literal text, without being parsed by the VoiceXML interpreter. As your grammars
    get more complex, it becomes mandatory to encompass them within CDATA sections.
    In the simple case of the yes/no grammar, it is not necessary to use the CDATA
    section, but it is a good habit to develop.


    The <filled> element on lines 20 through 27 is used to process any input that
    was recognized as acceptable grammar. In the application developed, if the user
    says "yes" or "no," the field accesscode will be assigned that value. The <filled>
    element can then perform some kind of action or processing based upon the user
    input.


    # if Elements


    The ifif condition on lines 21 through 26 checks the value that is stored in the
    accesscode field and processes accordingly. The cond attribute holds a test to
    see if a statement is true or false. If the accesscode field contains yes, which
    will be perceived as a true condition, go directly to the goodbye dialog. The
    </else> tag hands any other condition that fails through the initial test. Because
    there were only two possibilities in the grammar, yes or no, the condition is
    handled by giving users access code and then sends them to the goodbye dialog.


    When testing a condition, the double equal sign (=) is used as comparison. A single
    equal sign (=) is used as an assignment operator, not a comparison. Another potential
    pothole when checking is the single quotes inside a set of double quotes. The
    field name is not quoted, but the literal value that is being checked must be
    single quoted or it will be perceived as a variable or field name. A simple rule
    is if it is a field name or variable, do not use the single quotes within the
    double quotes.


