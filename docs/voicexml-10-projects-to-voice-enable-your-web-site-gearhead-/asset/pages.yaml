  md: '# Contact Us 113


    Line 3 imports the Perl CGI module for processing the form data. The CGI module
    comes standard with Perl 5 implementations. It handles all of the background dirty
    work for transforming the user input into a useful format for the script to process.


    Line 4 disables output buffering. When a Web server is processing data and responding
    to a request, it will hold the output in a buffer until it has reached a specified
    quantity of data before sending back to the browser. With output buffering disabled,
    the data is sent immediately without being in the buffer.


    Line 6 and 7 declare variables for the location on your Web server where the recording
    will be stored. $PathToRecording should be changed to hold the absolute path to
    a directory on your server. The $newRecording variable is initialized with the
    value of test.wav. The test.wav file will be used to test the application. It
    will be overwritten on the server time the script is run. Once we have confirmed
    that the application is running properly, this value will be replaced with a dynamically
    generated name, making it possible to have multiple recordings within the recording
    directory.


    XML uses HTTP protocol for exchanging information between the browser and the
    server. An HTTP header is output on line 9 using the header method from CGI.pm
    module. The header method sets the standard HTTP content-type.


    Line 11 opens a filehandle SAVE, which is set to write or overwrite the file-name
    stored after the $newRecording variable within the $PathToRecording directory.


    Line 12 uses bindmode() as a safety mechanism for passing data between a Win32
    and Unix system. Win32 file systems distinguishes between binary files and ASCII
    text files. The bindmode() function specifies that the file being saved is binary.
    It does not affect a Unix-to-Unix or Win32-to-Win32 transfer. Its main use in
    this application is for portability.


    The spoken input, passed as the voiceMessage field from the calling application,
    is read into the $data variable on line 13 and to the $newRecording file on line
    14. Line 15 closes the SAVE filehandle.


    > Though not mandatory, because Perl does automatic garbage collection, it is
    good practice to close any filehandles that have been opened.


    Lines 20 through 33 use the Perl print method to output a confirmation notice
    to the user that all went well. Line 23 is a quick check for the developer, testing
    the length of the message content. Once the script is debugged and functioning
    properly, this line will be commented.


    Install the Perl script on your Web server. Call your application on the telephone
    and leave a voice message. Confirm that the message was processed and stored on
    your server by opening a Web browser, and listening to the recording. Make several
    calls to confirm that the message is being replaced with a new recording.'
