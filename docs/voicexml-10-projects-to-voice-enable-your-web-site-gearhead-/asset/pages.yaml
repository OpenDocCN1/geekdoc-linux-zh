- img_proc: true
  md: '# Project Description


    The FAQ Engine is built in three phases: install, test, and examine the Brainhat
    engine; create a scenario and vocabulary for the engine; and build a VoiceXML
    interface to access the engine. An FAQ for the fictional Mars Colony 7 Visitor’s
    Bureau is developed for handling generic telephone inquiries about the colony.


    The user calls in and is greeted by the VoiceXML receptionist. The caller may
    ask questions about accommodations, such as pricing, availability, and amenities.
    The FAQ engine processes the dialog and at an appropriate point asks if the user
    would like to reserve a room.


    To complete this project, you will:


    +   1. Download and install the Brainhat server.

    2. Build vocabularies in Brainhat.

    3. Model scenarios to build dialog context.

    4. Develop an FAQ application.

    5. Set up the VoiceXML entrance.


    # You Will Need


    +   ✔ Brainhat engine

    ✔ FAQ scenario for Brainhat

    ✔ Customized words definition file for Brainhat

    ✔ Beocal account

    ✔ VoiceXML script for accessing Brainhat

    ✔ Project files downloadable from cafe.beocal.com/wiley/10projects


    VoiceXML Elements Used in This Project


    | ELEMENT NAME | DESCRIPTION |

    | <assign> | Assigns a variable value |

    | <else> | Used in <if> elements |

    | <field> | Declares an input field in a form |

    | <filled> | An action executed when fields are filled |

    | <form> | A dialog for presenting information and collecting data |

    | <if> | Simple conditional logic |'
