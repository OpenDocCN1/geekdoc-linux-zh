    > HANDS ON A call to a specific grammar rule in the external grammar file. The
    fragment identifier should point to a rule that has the same name as the reporter’s
    id. The next section will actually create the names for those rules in the grammar
    file.


    # Map Reporters to Beaches’ Names


    The external grammar shown in Listing 7.8 has changed the AllBeaches grammar rule
    to multiple sets of grammars that are mapped to a reporterId. Each reporterId
    is mapped to a grammar that specify which beaches are available for reporting.


    Comments within grammars are made with semicolons; not the usual comment tags.
    Lines 1 and 2 end with a comment to remind the maintainer of the script of the
    reporter’s names are associated with each of the regions.


    > TIP Grammars cannot contain the usual comment tags (<!-- comment -->). To include
    comments in grammars, use a semicolon. Anything on the line after the semicolon
    will be considered a comment.


    A reporter could cover more than one region by inserting another rule within the
    square brackets for that. For example, if there are beaches in Baja, Mexico, that
    Tim Chandler can cover, along with the beaches in Southern California, the grammar
    rule for be inserted as grammar for the B4321 rule:


    ```

    B4321 [SouthernCalifornia BajaMexico]

    ```'
