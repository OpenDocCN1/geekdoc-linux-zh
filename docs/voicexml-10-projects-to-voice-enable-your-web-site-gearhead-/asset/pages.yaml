    # Transfer the Call to the Contact Number


    Project 3 introduced the concept of call transfer. We will use the model created
    in that project to transfer the call in the current project to the selected contact
    from the contact list. Listing 6.12 incorporates the necessary changes into that
    model to access the phone number the caller has chosen.


    ```

    1. <field name="confirmContactName">

    2. <prompt timeout="1s">

    3. Calling expr="contactList$.utterance"/

    4. at <say-as type="telephone"><value expr="contactList"/></say-as>

    5. </prompt>

    6. <noinput>

    7. <assign name="confirmContactName" expr="true"/>

    8. </noinput>

    9. <nomatch>I''m sorry.<clear/></nomatch>

    10. </field>

    11.

    12. <transfer

    13. name="transferCall"

    14. connectittout="20s"

    15. maxime="60s"

    16. bridge="true"

    17. destextpr="contactList">

    18.

    19. <filled>

    20. <if cond="transferCall == ''busy">

    21. <prompt>

    22. The line is busy

    23. Please try again later.

    24. </prompt>

    25. </elseif cond="transferCall == ''far_end_disconnect">

    26. <prompt>

    27. The party you called has hung up.

    28. </prompt>

    29. <elseif cond="transferCall == ''answer">

    30. <prompt>

    31. No one is answering.

    32. Try again later.

    33. </prompt>

    34. <elseif cond="maxime_disconnect" 60">

    ```


    Listing 6.12 Transfer the call. (continues)'
