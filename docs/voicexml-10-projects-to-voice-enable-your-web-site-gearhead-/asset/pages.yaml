    # # Testing a Caller''s Phone Number


    A simple way to begin a secure login is to test the caller''s phone number through
    standard session variables. Session variables make information available to the
    application such as the caller''s phone number, the number the caller dialed,
    and the type of machine the caller originated from (pay phone, cell phone, prison
    phone, and so on). A session variable has a value of undefined if the service
    is not supported.


    Session variables can be accessed within your VoiceXML application and used for
    making decisions on how to process a call. Table 4.1 is a list of session variables
    and the type of information they contain. See section 5.1.4 of the VoiceXML 2.0
    Working Draft for an extended discussion of the values each variable can hold.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Table 4.1 Session Variables


    | SESSION VARIABLES | DEFINITION |

    |---|---|

    | session.telephone.ani | Automatic number identification |

    | session.telephone.dnis | Dialed number identification service |

    | session.telephone.iidigits | Information indicator digits |

    | session.telephone.uui | User-to-user information |

    | session.telephone.rdnis | Redirect dialed number information service |

    | session.telephone.redirect_reason | Redirect reason |


    > > TIP The environment that processes your VoiceXML script has access to standard
    session variables that can be used to decide how to process a call.


    ```

