- img_proc: true
  md: '# Contact Us


    The method attribute specifies how the data should be sent to the Web server.
    HTTP protocol handles the exchange of information between the VoiceXML browser
    and the Web server that will save the recording. The post method specifies that
    the URL named within the src attribute is a processing script and that the data
    sent with the request is to be processed by the script.


    The enctype attribute of type multipart/form-data is used to pass large amounts
    of data to the Web server as a single chunk. According to the VoiceXML 2.0 Working
    Draft, section 5.3.8, “It is wholly inappropriate to attempt to URL-encode large
    quantities of data” by using any other method.


    A list of variables can be passed to the server through the namelist attribute.
    The variables be <field> or explicitly declared variables. By default, all variables
    in the current dialog are sent unless otherwise specified. In our application,
    voiceMessage is the only variable being sent as data. This contains the encoded
    voice input of the user and makes it available for processing by the Web server
    script.


    Most demonstrations of the <record> element use the <submit> element to send processing
    to the script. However, <submit> is very restrictive because it does not return
    processing to the calling application. Using <subdialog> allows you to modular
    your generic chunks that can be used by multiple applications.


    > Section 2.3.4 of the VoiceXML Working Draft is a detailed discussion of the
    <subdialog> element and its attributes.


    Once the message has been saved on the Web server, processing returns to line
    36, giving users a verbal confirmation that their message has been saved. At this
    phase of the project, we have not created the processing script on the Web server.
    That will be handled in the next section.


    > Insert a <record> element into the voice form. Add a field that allows users
    to listen to what they have recorded. End the form with a subdialog that passes
    the recording to a script. (The script will be covered in the next section.)


    # Saving a Recording


    The VoiceXML interpreter does not handle processing of the recorded input. It
    passes the data to a script on a Web server for dynamic processing. The code in
    Listing 3.4 shows how CGI server with Perl would handle saving the data as a wave
    file and return processing to the calling application. The same type of processing
    could be done with PHP, JSP, ASP, or any other type of dynamic processing available
    on your server.'
