  md: '# Acknowledgments


    When I was first approached by Donis Marshall to write this book, I thought, “No
    problem. I''ll whip it out in a couple of months and be done with it.” Anyone
    who has attempted to write a book knows how naive and uncomprehending that thought
    was. Over the past ten months, I''ve needed the support of my friends and family
    who kept checking periodically to see if I was “still alive.” Yes, I am, and I
    sincerely thank you for worrying. Can we go to Disneyland now?


    The short list for starts with Donis Marshall. Thanks for allowing me to rewrite,
    change, be late...whatever it took it to get the book right.


    Bryan Michael at The BeVocal Cafe saw the value of this project right away and
    didn''t hesitate with any type of resources that were necessary to make my job
    a little easier. The development team at BeVocal was indispensable when I needed
    quick turnaround team for technical questions. A special thank you to Mukund Bhagavan,
    Kesava Neeli, and Vavnmet Raja for responding at all hours of the day and night.


    Kevin Dowd and Larry Larson provided invaluable technical support when generating
    the projects for the Brainat FAQ Engine and the San Francisco Arts Calendar. Thanks
    also to Richard Weiss for introducing me to VoiceXML and Tony Caviglia for contributing
    ideas for the Telephone Dialer project.


    Finally, this book would never have been completed without the unwavering support
    of my wife, Rosemary. Thank you for believing it could be done and making it happen.'
