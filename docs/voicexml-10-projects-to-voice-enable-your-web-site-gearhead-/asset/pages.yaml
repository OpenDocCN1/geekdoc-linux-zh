  md: '# Transferring a Call


    VoiceXML contains a <transfer> element that allows the application to transfer
    the phone call to another phone number or extension. In this section, we will
    add a third option to the menu that transfers the call to a receptionist. Start
    by adding a third option to the existing menu.

    Line 6 of Listing 3.6 adds a prompt line, informing the user that transferring
    to a receptionist is available as an option. Lines 18 through 24 handle the processing
    of the request by defining a grammar that will be recognized as the transfer choice.
    With the previous two grammars, an extended grammar generated for the transfer
    choice allows multiple utterances to activate the transfer.


    ```

    1. <-- MAIN MENU -->

    2. <menu id="mainmenu">

    3.   <prompt>

    4.     To hear the address of Mars Colony 7, say "Address"

    5.     To leave a voice message, say "Voice"

    6.     If you would like to speak with a receptionist,

    7.     say "Transfer"

    8.   </prompt>

    9.

    10. <choice next="#address">

    11.   <grammar>[ (address ?please) ]</grammar>

    12.   Address

    13.  </choice>

    14. <choice next="#voice">

    15.   <grammar>[ (voice ?message) voicemail ]</grammar>

    16.   Voice

    17.  </choice>

    18. <choice next="#transfer">

    19.   <grammar>

    20.     [ transfer ?me ?please) receptionist ]

    21.   </grammar>

    22.   Transfer

    23.  </choice>

    24. <nomatch>

    25.   Your choices are <enumerate/>

    26.   Try again.

    27.  </nomatch>

    28. </menu>

    ```


    **Listing 3.6** Adding a menu option.'
