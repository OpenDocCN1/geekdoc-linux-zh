  md: '# Quiz Generator 271


    The output of the application will be the quiz-strek.xml file. Open the file and
    you will see that all plain text within the XML file has been output. This is
    the result of the default template in Listing 8.16. The next section applies specific
    XSLT templates to selected elements within the XML file. When all the templates
    have been inserted, a complete VoiceXML file will be generated automatically when
    running the batch file.


    # Insert XSLT Templates into the Stylesheet


    The basic framework for the XSLT processor is now in place and verified, so we
    can begin adding templates to process each element in the XML file. Templates
    are used within an XML file to access specific elements of the data. The template
    accesses the data and applies formatting according to the developer''s specifications.

    The elements within the XML file hold data that can be output in a specific format
    to the VoiceXML file. Begin construction of the XSLT stylesheet by starting at
    the top of the XML file. We will work through each element and design a template
    for the data''s output. Keep in mind that we are building a generic output template.
    At no time will there be any reference to Star Trek data within the XSLT stylesheet.
    The stylesheet should be able to format any source of data into a VoiceXML document
    as long as that uses the XML template created above.


    > During your first application development process with XSLT, each time a template
    is added to the quizformatter.xml file, check the output to verify that it is
    expected. Errors in small amounts of code are much easier to find and fix than
    hunting through hundreds of lines, to track down multiple errors.


    # Document Root Template


    Every VoiceXML document must open and close with the <xml> tag. Lines 10 through
    14 of Listing 8.18 insert a root-level template into the basic stylesheet. The
    root-level template accesses the complete XML document.

    The formatting within the template outputs a literal <xml> element at line 11.
    As a reminder, any element that is not processed by the xsl namespace is output
    as literal. The <xml> element carries an attribute of version that is set to 2.0.
    The literal <xml> tag is handled on line 14.


    One of the most important elements in an XSLT stylesheet is the <xsl:apply-templates>
    rule. It specifies the set of nodes that will be processed by the XSLT engine.
    An <xsl:apply-templates> element with a select attribute will process all children
    of the current node. If you looked at the output after running the initial transformation
    in Listing 8.17, you would see that the output was all of the text from the XML
    file. <xsl:apply-templates> can also be used to selectively call formatting templates
    for each of the elements within the XML data file. We will use that technique
    in the next section.

    Line 12 of Listing 8.18 uses the <xsl:apply-templates> element to process all
    of the nodes within the XML file.'
