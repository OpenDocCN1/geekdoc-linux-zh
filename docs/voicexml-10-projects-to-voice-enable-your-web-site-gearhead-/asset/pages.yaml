  md: '# Project 3


    If you have installed your script on a Unix server, verify that the directory
    for saving the recordings has write permissions and that the CGI script has execute
    permissions.


    # Dynamically Creating a Filename


    In Listing 3.4, the test.wav filename is hardcoded into the $newRecording variable,
    over-writing any previous recording on the server. It is more useful to have a
    dynamically generated name so that multiple files can be stored on the server.
    We''ll create a short routine that generates a new filename each time the application
    is called.


    Line 1 of Listing 3.5 initializes the value of $newRecording with the return value
    from a subroutine createFileName. The createFileName subroutine returns the last
    time evaluated on lines 3 through 8 with a scalar variable that replaces the current
    localtime() function. localtime() is declared as a scalar value and has the format
    Weekday Month Hour:minutes:seconds year. The spaces and the colons within the
    frame can cause trouble when writing a filename, so lines 5 and 6 are regular
    expression substitutions, replacing the spaces with underscores and the colons
    with hyphens: Thu Jan 24 07:44:17 2002 becomes Thu_Jan_24_07_44-17_2002.


    Line 7 appends the .wav extension to the newly created filename. There is no need
    for an explicit return from the subroutine because the last thing evaluated in
    a Perl subroutine is automatically returned.


    > Rewrite your filename declaration to accept the return value from a subroutine
    that generates a unique filename each time your application is called. Call your
    application several times and verify that a new file is created on the server
    for each call.


    Sound files can take up disk space very quickly. Limit the user input with the
    maxtime attribute and prune the recordings directory on a regular basis.


    ```

    1. my $newRecording = createFileName();

    2.

    3. sub createFileName {

    4. my $filename = localtime();

    5. $filename =~ s/\s/_/g;

    6. $filename =~ s/:/-/g;

    7. $filename = $filename . ''.wav'';

    8. }

    ```


    Listing 3.5 Generating a new filename.'
