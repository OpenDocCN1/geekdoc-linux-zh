  md: '# 26 Chapter 2


    Click on the default.xml filename in the File Management window. This will move
    you to the VoiceXML Checker page with the default.xml script inserted into the
    text area. At the top of the page, a confirmation notice shows that default.xml
    is the file displayed. Click the Check button beneath the holding VoiceXML code.
    Look at the status line output is in green, the script is well-formed VoiceXML.


    There are two types of syntax checking in the VoiceXML Checker: well formed and
    valid. A well-formed document follows one syntax rules of XML: attribute values
    double quoted, tags closed, elements nested properly, and so forth. If a call
    to a type definition (DTD) is included in the VoiceXML application script, the
    Checker will also validate the file against the DTD.


    Listing 1 shows a call to a DTD on lines 2 through 6. We will be looking at the
    rest of the code in Project 1. The VoiceXML Checker will examine the code on lines
    8 through 16 and make sure it is valid according to the rules established within
    DTD.


    ```

    1. <?xml version="1.0"?>

    2. <!DOCTYPE

    3. vxml

    4. PUBLIC

    5. "//BeVocal/VoiceXML 2.0//EN"

    6. "http://cafe.bevocal.com/libraries/dtd/vxml2-0-bevocal.dtd">

    7.

    8. <vxml version="2.0">

    9. <form id="form">

    10. <block>

    11. <prompt>

    12. Hello World!

    13. </prompt>

    14. </block>

    15. </form>

    16. </vxml>

    ```


    Listing 1 default.xml script.


    Delete the call within the default.xml script. Click the Check button. Red messages
    indicate an error in the application or are a warning message of a possible problem.
    Note the error message and scroll down to the bottom of the page to view the specific
    errors detected.'
