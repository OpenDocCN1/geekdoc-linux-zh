    +   Listing 4.1 Authentication through standard session variables. (continued)


    Listing 4.1 is a simple authentication session that verifies the caller''s phone
    number by comparing it to a list of secure phone numbers that are stored as data
    within the application. If the caller''s number is not listed, the call will not
    be processed.

    The callersPhone variable on line 3 stores a session variable that has dynamic
    access to the caller''s phone number through the session.telephone.ani session
    variable. As a reminder, the expr attribute of a <var> element dynamically a value
    based upon the return value of the expression. The session.telephone.ani variable
    provides the phone number of the calling party if the service is supported. When
    set, callersPhone is used to compare against a list of phone numbers that have
    been approved to access the secure areas of it.

    An <id> on lines 7-9 tests the caller''s phone number against a set of approved
    numbers. The cond attribute compares the value stored in the callersPhone variable
    against the list. In the secure numbers are 10 digits (area plus seven-digit phone
    number), except for the platform-specific number in the working environment, which
    is zero.


    > When using a VoiceXML portal''s scripting environment to test your application,
    the session.telephone.ani variable to output the caller''s phone number. This
    will show you that the platform is used as a phone number; zero is used in the
    current application to accept the phone number by the BeVocal Voice Script environment.


    The double pipes, ||, on lines 7 and 8 are used as short-circuit operators to
    test the numbers in sequence. Starting with the first number in the list, the
    number is compared to the callersPhone variable. If the numbers do not match,
    processing moves to the next number.


    When a number is recognized, comparison checking stops and the user is passed
    to the main menu through the <goto> element on line 10. If processing falls to
    the end of the list without any number being recognized, the caller does not have
    approval to access the secured areas and is passed to the <else/> section starting
    on line 11.'
