    they need from your FAQ. They will ask specific questions or make declarative
    statements that jump to later parts of the dialog. Novice users need a little
    hand-holding and appreciate the verbal prompts.


    As an example, experienced users upon entering the system would not ask if there
    were accommodations; they would immediately declare that they want a room: “I
    need a room.” The FAQ engine would bypass any dialog having to do with explaining
