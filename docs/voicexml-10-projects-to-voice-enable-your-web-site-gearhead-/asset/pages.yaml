  md: '# The <transfer> Element


    After setting up the menu to recognize a request for transferring the call, a
    form must be built to process the request. The <transfer> element is the foundation
    for this routine, making it possible to create a connection to another phone without
    exiting the VoiceXML application.


    There are two types of transfers, bridge and blind. The blind transfer disconnects
    the user from the VoiceXML application while leaving the caller connected to the
    new telephone. With a bridge transfer, the application pauses, waiting for the
    new connection to terminate, and then returns to the VoiceXML application.


    The <block> on lines 2 of Listing 3.7 confirms to the user that the request for
    a transfer has been understood. The <transfer> element beginning on line 6 carries
    a series of attributes that set up the configuration for the call. It is set at
    the field level using a <filled> element to process various returns from the phone
    number being called.


    ```

    1. <form id="transfer">

    2. <block>

    3. Please wait while we wake up the android.

    4. </block>

    5.

    6. <transfer>

    7. name="reception"

    8. connecttimeout="20s"

    9. maxptime="60s"

    10. bridge="true"

    11. dest="800-555-1212"

    12.

    13. <filled>

    14. <if cond="reception == ''busy''>

    15. <prompt>

    16. Hal is busy chatting with Dave.

    17. Please try later.

    18. </prompt>

    19. <elseif cond="reception == ''far_end_disconnect''/>

    20. Hal has terminated the call.

    21. <elseif cond="reception == ''noanswer''>

    22. <prompt>

    23. Hal is not responding.

    24. Dave might have unplugged him.

    25. </prompt>

    26. </if>

    27. </filled>

    28. </transfer>

    29.

    30. <field name="returnToMenu" type="boolean">

    ```


    Listing 3.7 Transferring a call.'
