  md: '# CHAPTER

    1

    Introduction to VoiceXML


    If you have ever designed a Web page, you already have the basic skills needed
    for developing a VoiceXML application. VoiceXML is a simple, tagged language that
    is similar to HTML in structure. In fact, it consists of less than 50 elements,
    making it much smaller than the HTML element set.


    HTML gives visitors who come to your site the ability to view content, click links,
    and move through the pages. VoiceXML will let your visitors do this verbally over
    the phone. Think of VoiceXML as the HTML of the telephone. VoiceXML guides users
    through the content of your site by using a telephone instead of a computer. VoiceXML
    application will not be a replacement for your existing Web site, but it will
    offer you visitors additional access to your site through a highly accessible
    medium, the standard telephone.


    The data on your Web site is the content for dialogues between the user and your
    Web server. Instead of using HTML to access your content, VoiceXML creates a virtual
    interface to the data through a voice gateway, usually housed on a voice portal.


    A complete industry called voice portals has sprung into existence within the
    past two years. Voice portals are service providers who provide space for your
    voice applications, such as an Internet service provider (ISP) does for HTML Web.
    The voice portal provide the gateway and processing architecture for handling
    VoiceXML applications that you develop. Portals contain development tools, space
    allocation, example tutorials, and detailed documentation for the creation of
    VoiceXML applications. We will be using the services of one of the portals for
    development of the 10 projects.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Chapter 1


    A point of confusion among beginning voice developers is about the telephone itself.
    VoiceXML allows access to your data through any phone. There is no special hardware
    attached to your phone, and it is not a secret, James Bond–enhanced device.


    The second question that usually comes up is, "Well, can I talk to the computer
    to access the Web site or does it have to be over a telephone?" VoiceXML is a
    telephone technology and is not normally used for accessing data vocally on a
    local computer, but these are mainly looking at development environments that
    can run on your local computer, not accessing data and Web site content.


    To understand how VoiceXML works, we''ll first take a brief look at XML and its
    technologies; we will examine how VoiceXML fits in.


    # XML Overview


    XML (Extensible Markup Language) is a nonproprietary, vendor-neutral way to store
    and transport data. The XML standard is maintained by the World Wide Web Consortium
    (W3C), a group that develops common protocols for ensuring interoperability across
    the Web. The XML technical recommendation can be found at www.w3.org/TR/REC-.


