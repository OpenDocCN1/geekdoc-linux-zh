    > The VoiceXML server in Brainhat does not precompile the data files as it using
    interactive mode on the command line. You must run the program from the command
    line first before starting the VoiceXML server.


    # # Create Simple Access Script


    Other projects we have worked on have pointed to Web servers to retrieve dynamically
    generated data. In this project, the Brainhat will act as the Web server, processing
    a caller''s request and outputting VoiceXML documents on the fly. It will respond
    differently, however, to a few special URLs. This is the key to the program as
    an FAQ server.


    Once the daemon is running, you may access Brainhat from your BeVocal using a
    URL of the form: http://server:8080/index.xml. (See Figure 10.3) Testing your
    server should return no errors. If you wish to make a primitive test, you may
    telnet to your server on port 8008 and pull the initial page by handler: telnet-server
    80 get/index.html HTTP/1.0


    > The Colony 7 server at Brainhat, pointed to as a test environment in the next
    set of scripts, is available to developers to use for proof of concept. To download
    the latest scenario and vocabulary files on the Colony 7 test server, go to colony7.brainhat.com/faq-files.


    The first reference to the Brainhat server, /index.xml, as shown in Listing 10.35,
    returns a dynamically generated VoiceXML page with the initial entry. It also
    contains a reference to a VoiceXML.grammar that the voice portal will need to
    interpret the caller''s response. Subsequent accesses will be to pages of the
    form /dialogXXX.xml (perpendiculars served on a different port), which are generated
    dynamically by the server, where the XXX represents any random number to discourage
    caching of the voice portal.


    The element allows VoiceXML scripts to point to external sources for their data.
    Listing 10.35 is a script that points to the Brainhat test environment. Once you
    have pulled the initial page successfully, you may begin expanding and testing
    your application.'
  merge: -1
