  md: '# Scope of Grammars


    Grammars have scope, just as variables do. Scope of grammars can be set by context,
    as in Listing 5.13, or in some cases explicitly using the scope attribute to a
    value of document or dialog. The hidden link on lines 5 through 9 of Listing 5.13
    is only available when the templatesmain.xml document is active.


    Grammars set within links are scoped to the same level as the element that contains
    the link. We have seen this previously when constructing the start over link at
    the top level of the application root, creating a grammar that is accessible through
    the entire application. A link grammar can also be scoped to the document level
    within any leaf of the document, using that of grammar to the current document,
    as was done in Listing 5.12. The scope attribute is not available to a grammar
    within a link.


    Form-level grammars are active while processing is within a <form>. This is considered
    dialog scope and the default scope of <menu> elements are the same level as <form>
    elements, following the rules of grammar scope.


    A <form> may carry a scope attribute to document, overriding the default scope
    of the grammar, forcing it to the document level. If the document containing the
    <form> is the application root document, the grammar will be available throughout
    the multidocument application. When a grammar of the current <form> or <menu>
    is recognized and activated, processing of the current <form> or <menu> is terminated,
    and control is transferred to the <form> or <menu> where the grammar was recognized.


    Forms are not limited to containing a single <grammar>. Within a <form>, each
    <grammar> element may carry a scope attribute, specifying the element within dialog
    or document level. If the <form> and the <grammar> elements both carry a scope
    attribute, the <grammar> element takes precedence.


    Grammars set at field level are only active within that field and cannot carry
    a scope attribute.


    > The security access link is considered document-level scoping. It is limited
    to being accessed from within the menu document. See the W3C VoiceXML2.0 Working
    Draft, section 3.1.3, for a detailed overview of grammar scope.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_190_0.png)


    Alter the templatesmain.xml file by inserting a hidden link that will access an
    authentication procedure.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_190_1.png)


