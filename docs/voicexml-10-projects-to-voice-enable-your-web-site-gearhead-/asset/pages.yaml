  md: '# Using Return Values from an Object


    The Speech Object returns control to the calling location after it has completed
    processing of the input. The return values from the object need to be assigned
    to variables in order to be used by the VoiceXML application.


    Listing 9.6 the <assign> element to access and assign the date object''s return
    values. The names of the variables (month, day, year) are what will be passed
    from the <subdialog> call to the Cold Fusion script. Each variable uses the ECMAScript.round
    function as part of its expression to force the input to 0 as output. The <object>
    element that processes the dates using indexing start at 0 when setting the month,
    whereas the Cold Fusion starts its indexing at 1. One is added to the eventDate.Month
    to correctly map the month input from the Speech Object to the Cold Fusion database
    query.


    > Using the eventDate.Month + 1 expression with the Math.round function will cause
    incorrect input to the Cold Fusion script. ECMAScript floating-point notation
    when doing math. eventDate.Month + 1 will return 12.0 without the Math function
    to force an integer rounding.


    ```

    1. <block>

    2.   <assign name="month"

    3.     expr="Math.round(eventDate.Month + 1)"/>

    4.   <assign name="day"

    5.     expr="eventDate.DayOfMonth/"

    6.   <assign name="year"

    7.     expr="eventDate.Year/"

    8. </block>

    ```


    **Listing 9.6** Assigning variables from object return values.


    > Insert a block into the current application that will assign variables from
    the return values of a request for a date. The block should be at field level,
    following the <object> element. The variable names must be month, day, and in
    order to be processed by the Cold Fusion script.


    # Implied Error Checking


    Before user input is sent to the database to request a list of calendar items,
    it is good practice to confirm with the user the Discipline and date the program
    recognized. Verification of user input does not have to be be an explicit repeat
    of information and a request for confirmation.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# 302 Project 9


    Use the <value> element to repeat the input to the user within the context of
    the processing, wait a minimal time for a response, and then move to the next
    stage of processing if there is no input from the user. This technique makes for
    a more intuitive interface without putting a burden on the user to verify every
    input step of the way. The subtlety is that the user does not realize that the
    confirmation is even taking place.


    Listing 9.7 is a <field> that implies the user''s input without asking for a response.
    A <prompt> is output on lines 2 through 7, using the <value> element to repeat
    what was recognized as user input. The <prompt> continues by asking the user to
    wait while the data is retrieved. Line 6 makes a break of 1 second before the
    actual processing of the request begins.


    After the 1-second break, the <no> block on lines 8 through 10 fills the checkInput
    field with yes if the user does not register a verbal reaction. In this case,
    if the user gives no response, we consider this a confirmation that the date and
    event type have been output, and processing can continue.


    If the user responds with any input at all, it is considered negative and handled
    with the <nomatch> element on lines 11 through 15. When the nomatch event is thrown,
    a <prompt> is output to confirm to users that their negative input has been heard
    and they will get another chance to choose a date and event type. Line 13 clears
    all the <field> variables, and line 14 uses the <prompt/> to send processing back
    to the top of the form.


    After the event type and date of the event have been confirmed, we are ready to
    create a <subdialog> call that will access the San Francisco Archives Calendar
    database.


    ```

    1. <field name="checkInput">

    2. <prompt>

    3.   Please wait while I retrieve

    4.   <value expr="Discipline"

    5.   events for value expr="eventDate''/>

    6.   <break size="medium''/>

    7. </prompt>

    8. <noinput>

    9.   <assign name="checkInput" expr="yes''

    10. </noinput>

    11. <nomatch>

    12.  Sorry. Let''s try it again.

    13.  <clear/>

    14.  <prompt/>

    15. </nomatch>

    16.  <grammar>yes</grammar>

    17.  <|filled|>

    18. </field>

    ```


    # Listing 9.7 Implicit error checking.


    Create a field for error checking the user''s input. Repeat to the user what was
    recognized by the speech recognition engine. Process a <nomatch> event if the
    user responds, and use a <noinput> to assign a value to the checkInput variable
    if there is no response from the user.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_324_0.png)'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# Use <subdialog> to Call the Database


    We have used <subdialog> calls in previous projects to send information to a process-
    script and receive the return results. Listing 9.8 sets up a call to the SFArts
    Cal- database, passing the month, day, year, and Discipline variables as parameters.


    ```

    1. <subdialog name="getResult"

    2. src="http://www.sfarts/voicexml/voicexmltest.cfm"

    3. namelist="month day year Discipline"

    4. method="post"

    5. fetchtimeout="10s"

    6. </subdialog>

    ```


    **Listing 9.8** Calling the database.


    The <subdialog> element calls the Cold Fusion processing script that is run on
    the San Francisco Arts Calendar server. The src attribute on line 2 holds the
    URI of the pro- cess script, followed by the name list on line 3, which holds
    the month, day, year, and Discipline variables. The names of the variables are
    extremely important because the Cold Fusion script will only accept these as input.

    The post method on line 4 is the same type of method as an HTML post. The fetchtime-
    out attribute specifies how long the format should wait for a response from the
    data- base before throwing a timeout. The placeholder script, voicexmlt.cfm, is
    used to verify that a connection can be made to the CF server and the <return/>
    ele- ment within script can be processed. We will look at the Cold Fusion test
    script in the next section.


    > Set up a <subdialog> call to the Cold Fusion script after the error checking
    in the current application. Use the www.sfarts/voicexml/voicexmltest.cfm URI to
    confirm that a connection is available to the server.


    # Test Script


    Larry Larson, manager for the SFArts Calendar site, has placed a test script on
    the server. Listing 9.9 is the short script on the server that returns a simple
    confirmation that the server is accessible. The output is a simple block of text
    to verify entrance into the SFArts server and a <return/> element immediately
    sends processing back to the calling script.


    > When working with data sources that are not under your domain or control, start
    the development process with place-holding scripts to verify access to the server
    before proceeding to development of the real application.'
