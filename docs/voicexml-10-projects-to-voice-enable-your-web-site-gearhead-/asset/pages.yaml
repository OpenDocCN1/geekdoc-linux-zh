  md: '# Project 6


    | Table 6.2 Grammar Operators |

    | OPERATOR | EXAMPLE | DESCRIPTION |

    |---|---|--|

    | () | (mary jo) | Concatenates content into a single token, each word mandatory
    and in order. |

    | [] | [ john tony ] | Specifies a disjunction; each word is an individual token.
    |

    | ? | kim ?miller | The token following the operator is optional. |

    | + | (i am +very happy) | There must be at least or more instances of the token
    that follows the operator. |

    | * | (i am *very happy) | There may be zero or more instances of the token that
    follows the operator. |


    # Grammar Operators


    Grammars can be more than just words or phrases. A complex grammar can contain
    references to other grammars, tokens representing literal words, a long series
    of phrases, and conditional operators to make input optional. There are five grammar
    operators, as shown in Table 6.2. The operators are used to specify optional parts
    of a grammar and to group words as single tokens.


    Listing 6.5 uses the concatenation operator to force full names when requesting
    a name. Lines 4 and 5 are simple tokens that just have a first and last name.
    Line 6 contains a disjunction operator inside of a concatenation operator, forcing
    the user to choose between tony and kristi as a first name with a mandatory cavaglia
    name to follow.


    Line 8 is a combination of concatenation and disjunction. It starts with the concatenation
    operator, forcing the complete contents to be a single item with the last name
    of weiss. Within that, the disjunction operator holds a list of four tokens, one
    of which is a concatenation of mary jo.


    > Add names to your list. Check the syntax, save the file, and run your script.
