  md: '# PROJECT

    3


    # Contact Us


    Most Web sites have a Contact Us section, which displays various ways a user can
    contact the company or Web staff. I''ve always been intrigued with the possibility
    of using a robot like Hal from the movie 2001 for handling this type of mundane
    chore. Not only would it be able to give you basic responses to your contact requests,
    but it could also help do simple tasks like taking messages or transferring calls
    to a person. This project can be used to lay the groundwork for developing a semi-intelligent
    answering system that handles the time-consuming chores of your front office staff.


    | THE PROBLEM

    Using a live receptionist to answer basic questions about your company or to take
    phone messages is a waste of personnel time and company resources.

    THE SOLUTION

    Access to basic contact information about your company through verbal output of
    an address can be handled with an automated system. The user has the choice of
    requesting company information, leaving voicemail, or speaking with a live receptionist.
    |'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Project Description


    The Contact Us creates an automated system for answering basic telephone inquiries
    about your company. The user calls your company and is greeted upon entrance by
    the VoiceXML application. A short menu describes the type of information services
    available: company address, request to leave voicemail, or to speak to a receptionist.
    If the request is for a mailing address or business location, a prerecorded location
    message is output. The user may also choose to record a voice message that will
    be stored on the company Web server for later retrieval. As a final choice, the
    user may request to speak to a receptionist.


    To complete this project you will:


    +   1. Create a skeleton template.

    2. Use variables for global values.

    3. Repeat content and control application flow.

    4. Record and save a message.

    5. Transfer a call.


    # You Will Need


    +   ✓ Belocal developer account

    ✓ Access to a Web server with CGI capabilities

    ✓ Perl 5 installed on the Web server

    ✓ Perl script for processing recording

    ✓ Download files: cafe.beocal.com/wiley/10project


    VoiceXML Elements Used in This Project


    | ELEMENT NAME | DESCRIPTION |

    |---|---|

    | <block> | A container of (noninteractive) executable code |

    | <break> | Inserts a pause in the TTS output |

    | <choice> | Defines a menu item |

    | <else> | Used in <if> elements |

    | <elseif> | Used in <if> elements |

    | <field> | Declares an input field in a form |

    | <filled> | An action executed when fields are filled |


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_122_0.png)'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Contact Us 101


    VoiceXML Elements Used in This Project (Continued)


    | ELEMENT NAME | DESCRIPTION |

    | <form> | A dialog for presenting information and collecting data |

    | <goto> | Go to another dialog in the same or different document |

    | <grammar> | Specifies a speech recognition or DTMF grammar |

    | <if> | Simple conditional logic |

    | <link> | Specifies a transition common to all dialogs in the link''s scope |

    | <menu> | A dialog for choosing among alternative destinations |

    | <nomatch> | Catches an no event |

    | <prompt> | Queues speech synthesis and audio output to the user |

    | <record> | Records an audio sample |

    | <transfer> | Transfers the caller to another destination |

    | <var> | Declares a variable |

    | <vxml> | Top-level element in each VoiceXML document |


    Source: VoiceXML 2.0 Working Draft, section 1.4


    # Call Flow


    Figure 3.1 shows the call flow for the Contact Us application. When a call is
    received, the main menu of three choices is presented to the user. The user may
    choose to hear the company address, leave a voice message, or speak with a live
    receptionist. The company address is a verbal output, hard-coded in the application.
    The voicemail routine accepts a virtual message from the user and stores it on
    a Web server for access by the company staff. The live receptionist is reached
    through the call transfer routine. Exiting the application is through the typical
    goodbye form.


    # Repeating Content and Controlling Application Flow


    We will build the Contact Us project in sections, adding components until we have
    a complete application. The first component is the address field, as shown in
    Listing 3.1. It is a long prompt that ends with a conditional statement asking
    if the user would like to hear a repeat of the information.'
