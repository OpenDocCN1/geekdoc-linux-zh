  md: '# <record> Element Attributes


    The attributes on lines 3 through 6 specify the properties for the <record> element.
    beep specifies whether there should be a sound played when it is time for the
    user to speak. The beep sound is implementation specific.


    +   - On some VoiceXML development environments that offer script checking, setting
    the beep attribute to true will cause an error, terminating the script. Setting
    the beep value to false allows use of the platform''s dynamic checker.


    The maxtime attribute limits the user to a specific length of message in seconds.
    For demonstration purposes and to allow the developer to test the application
    without overloading the system, the value has been set to 10 seconds. This value
    should be changed to a more appropriate length, such as 30 seconds, when the application
    goes into production. finalsilence is a value that determines when the user has
    finished speaking a message. One and a half seconds is the industry default. type
    specifies what kind of binary data will be sent to the server.


    +   - For a complete list of <record> element attributes and their default values,
    see section 2.3.6 of the VoiceXML 2.0 Working Draft.


    The <prompt> on lines 8 and 9 let the user know what is expected as input.


    +   - A good user interface will let users know exactly what is expected of them.
    Let callers know how much time they have for recording a message and when they
    start speaking and give them an a indication that the recording process has begun.


    # Confirming the Recording


    Leting a user confirm or rercord a message is a courtesy that is not extended
    on most voicemail systems. We use here to make the application more user friendly,
    especially in the absence of a live receptionist. Users may rercord their message
    as many times as they like before confirming that it is to be saved. The <field>
    item on lines 14 through 28 of Listing 3.3 is used to play back a user''s message
    to confirm that it is what they wanted recorded. The field type on line 14 is
    to boolean, letting the platform handle yes/no responses to the <prompt> that
    starts on line 15. Inserted within the <prompt> is a <value> element whose expression
    is the field name that holds the message that was recorded. The output from the
    <value> element is the actual recording of the speaker''s input that is being
    held in memory. The recording will not be committed to storage until it has been
    processed by a Web server.'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'Line 18 contains a call to the `companyName` variable, outputting the company
    name that is stored in the global variable defined at the top of the script.


    The `<filled>` condition on lines 21 through 27 holds an if> statement, checking
    the user''s response. The condition attribute on line 22 checks the value stored
    in the `processMessage` field. If the condition is true, a confirmation message
    is output and processing falls to the `showMessage` subdialog. When the response
    is false, or negative, the `<clear/>` element on top of 25 clears all values in
    the current form and starts processing over from the top of the current form.
    Default error checking within the boolean variable will handle any other input,
    prompting the user for a valid response.


    # Processing with <subdialog>


    The field-items we have used so far transfer in a linear fashion. Default processing
    falls to the next field-level item when the previous field within the active dialog
    has filled. The `<subdialog>` element allows control over processing by permitting
    access to routines that are outside of the current form, dialog, or document.
    A `<sub>` acts like a call to subroutine. The subroutine has finished, returning
    to the point of the originating call. Subdialogs are convenient for creating modules
    or routines that can be used by multiple applications.


    Subdialogs can also reside within the document itself. If a routine is used multiple
    times within the lifetime of the application, creating a subdialog does away with
    redundant coding and the possibility of coding errors when replicating a process.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_132_0.png)


    The `<subdialog>` element is not the subdialog itself; it is the call to the subdialog.


    # Attributes of <subdialog>


    The `<subdialog>` block beginning on line 30 of Listing 3.3 contains a call to
    a script, recording.cgi, which will process the input source and store it as a
    wave file. The attributes of the `<subdialog>` element define how the data should
    be sent to the processing script.


    The value of the `src` attribute within the `<subdialog>` element on line 31 is
    the location of the processing script that will save the recording. The script
    may reside on any Web server that has dynamic processing capabilities and is accessible
    to the VoiceXML application. The scripting language for processing the recording
    can be Perl, Java, ASP, Python, or any other language available on the server.
    The current project shows an example of saving the recording using a Perl script,
    as documented in the text section.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_132_1.png)


    Most VoiceXML portals do not allow dynamic processing of scripts on their development
    platform. Developers must have access to their own Web server for processing and
    saving of recorded messages.'
