    # View the Log File


    Logging and tracking dialogs is useful when researching and testing what phrases
    and questions users input into your application. The brainhat.log file in the
    root directory contains a complete log of all dialog activity on your server.
    The log file is opened each time the server is started, appending activity to
    the end of the file. Listing 10.11 was taken directly from the Brainhat log.


    The log file is useful in two ways. First, it allows you as a developer to test
    various inputs and have a record of the responses to them. It shows responses
    from the program are affected when the vocabularies and scenarios are changed.


    The log file is also useful for test group analysis. Creating dialogs that anticipate
    what a user will say is the hardest part of building a language-processing application.
    By analyzing the log file, it will become apparent what the majority of users
    think are appropriate words and phrases to be used when interacting with your
    application. Using this knowledge will help build more intelligently responsive
    programs.


