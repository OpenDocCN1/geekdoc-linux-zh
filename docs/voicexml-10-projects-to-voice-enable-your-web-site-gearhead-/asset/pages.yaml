    VoiceXML is a markup language that has a predefined set of elements, attributes,
    and rules on how each element may be used in an application. Placing a call to
    a DTD at the top of the application forces validation of the structure of the
    document against the rules established by the DTD.


    # DOCTYPE


    The DOCTYPE instruction specifies what the root element will be and gives information
    about the creation of the DTD, what it maintains, and where it is located. Once
    the VoiceXML application has been debugged, there is no longer a need for a call
    to the DTD; it will only slow down the processing of your application.


    Lines 3 through 6 of Listing 1.2 force validation of the application against the
    VoiceXML DTD.


    > **Always** use a call to the DTD when building a VoiceXML application. It will
    catch syntax errors and help with debugging along the way. When the application
    is completed, remove the call to the DTD to optimize your script.


    A <form> element is used to identify lines 10 through 15 to create the opening
    dialog. The form is given the attribute id, which can be used to access this dialog
    from anywhere else in the application. The <block> element contains literal output
    for the TTS interpreter ends with a <goto> element to control the process flow
    of the application.


    # **goto** Elements


    The <goto> element is used to transition to other dialogs. It can be applied in
    three ways. It can move to another form item in the same dialog, jump to a completely
    new dialog within the current document, or transfer processing to another document
    entirely.


    The nextitem attribute is used to send processing to another item within the same
    dialog. This overrides the FIA mechanism that automatically accesses the next
    item in the dialog. The next attribute uses the name of another dialog within
    the same'
