  md: '# Chapter 1


    # Processing VoiceXML


    VoiceXML implementation can take voice commands over the phone, translating those
    spoken commands to text. The Speech-to-Text (STT) engine handles the conversion
    of spoken language to text. Once the speech has been transformed to text, it is
    sent to a processing mechanism, which can be any that is available on your Web
    site. Perl, JSP, ASP, or any other type of processing on the server side can be
    used to process the request. This gives access to all the resources on the receiving
    computer, including databases, flat files, and any other types of content that
    are needed to process the request.


    The result of the processing is sent back to the VoiceXML application. The application
    translates the results by using a Text-to-Speech (TTS) translator, outputting
    the response verbally to the caller. In addition, the VoiceXML application can
    have prerecord audio file responses using human voices that are applicable as
    a response to the request. The application may ask the user for more information
    and continue the session or terminate the call.


    ![](img/d9ce4ec0787e3fb0ec0d55aacfae3973_38_0.png)


    **Figure 4** VoiceXML process flow.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Introduction to VoiceXML 17


    One of the most important concepts of the VoiceXML language is that it isolates
    the user interaction from the processing of a request. As shown in Figure 4, the
    VoiceXML interpreter handles the interface between the telephone and the processing
    layer. It does not handle the processing of the request. The VoiceXML front end
    acts as a filter to the service layer that will actually handle the processing
    of the request. By creating an interface layer that is independent of any specific
    processing mechanism, the VoiceXML application is portable across processing platforms.


    The user interface consists of a series of dialogs that guide the caller, collecting
    information for the processing implementation. The interface may be a single document
    with a set menu or a series of documents that are linked through calls to different
    Uniform Resource Identifiers (URLs).


    # Final Thoughts


    XML makes it possible to create tag sets for specific industries. The VoiceXML
    Forum has defined a tag set for developing high-level interfaces for telephone
    applications. Because of the similarity between HTML and VoiceXML syntax, Web
    developers will find that it is fairly easy to create voice applications using
    their existing site content.


    In the next chapter, we will set up the work environment so that you can begin
    creating your own VoiceXML applications.'
