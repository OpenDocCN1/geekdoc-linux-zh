    # Confirm User Input


    Voice applications are more natural sounding if confirmation of the user input
    is

    implied rather than explicitly stated each time the user speaks. As an example,
    if the

    user says "Mary" asked for a name, instead of confirming with a question, "You

    said Mary. Is that correct?", the application can respond with a statement, "Calling

    Mary at 201456464." This confirms that the user was understood correctly and the

    phone number was retrieved.


    As a general rule, the system repeats a statement to the user that you has

    just spoken, any response from the user should be considered a negative response
    and

    caught as an error. Listing 6.3 opens a small 1 1/2-second window for accepting
