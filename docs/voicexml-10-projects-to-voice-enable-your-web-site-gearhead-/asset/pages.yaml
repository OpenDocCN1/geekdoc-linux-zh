  md: '# Displaying XML with XSLT


    XML is a storage and data transfer mechanism and needs to be processed in order
    to be displayed. Output XML data can be done through the formatting and transformation
    language called XSLT (extensible Stylesheet Language Transformations). XSLT can
    be used to transform data into outputs such as text, HTML, PDF, and even other
    XML files.


    XSLT can transform data on the fly, as within a Web browser, and it can be used
    to process the data into files for storage. Figure 2 shows the process flow for
    taking XML data, processing it with XSLT, and then outputting to various outputs.


    XSLT syntax has basic elements that are defined by the language and functions
    that transform the data. Listing 5 shows a simple stylesheet that will transform
    the data shown in Listing 2 into a VoiceXML file that can be accessed over the
    telephone.


    ```

    1. <xsl:stylesheet

    2 version="1.0"

    3 xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    5. <xsl:template match="trains">

    7 <!-- BEGIN VOICEML OUTPUT ---

    8. <ml version="2.0">

    9 <form id="greeting">

    10 <block>

    11 You have reached

    12 <xsl:value-of select="region/management" />

    13 <xsl:value-of select="region/area" />

    14 Here are the most recent updates to our train time

    15 schedules and delays due to construction:

    16 <break size="medium" />

    17 <xsl:apply-templates select="region/train" />

    18 </block>

    19 </form>

    20 </voiceml>

    21 </xsl:template>

    <!-- END VOICEML OUTPUT ---

    24 <!-- INDIVIDUAL TRAIN INFO ---

    25 <xsl:template match="train">

    26 The number <xsl:value-of select="number" /> train

    27 <xsl:value-of select="status/delay" />

    28 <xsl:if test="status/delay != ''on time">

    29 minutes late due to construction

    30 <xsl:value-of select="status/constructionUpdate" />

    31 </xsl:if><xsl:text>.</xsl:text>

    32 <break size="small" />

    33 </xsl:template>

    35. </xsl:stylesheet>

    ```


    **Listing 5** Transforming XML into VoiceXML with XSLT.'
