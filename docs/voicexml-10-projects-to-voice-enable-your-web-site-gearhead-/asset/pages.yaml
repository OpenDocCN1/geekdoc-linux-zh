  md: '# Error Check Field Input


    Input to each <field> must be checked at field level during each stage of the
    login. Lines 37 through 49 and 69 of Listing 7.2 use the <catch> element to check
    for match and noinput conditions.


    In previous projects, the catch events have had their own separate counters, letting
    the user multiple attempts for each condition. These have been consolidated into
    one event attribute of the catch field, making it possible to use the count value
    of the catch event to act upon the match and noinput conditions simultaneously.
    The new approach forces tighter security by allowing only the first time through
    a field, a simple <prompt> requests a repeat of the input.


    If an input error is the first time through a field, a simple <prompt> requests
    a repeat of the input. The second time through the field, an error message is
    output to the user, the cell is disconnected, and the user''s phone number and
    phone type are sent to the security log script for processing.


    # Develop an Eternal Grammar File


    The grammars that were created in previous projects were all relatively simple
    token grammars. Grammars can also be built as a set of rules that can be accessed
    through a rule name. It is possible to isolate the grammars in external files
    and reference them using the src or expr attribute of the <grammar> element. This
    creates the possibility of storing large sets of precompiled grammars and accessing
    them dynamically. In this project, the grammar will be stored in an external file
    and accessed through rule names.


