    # Batch File Testing


    A quick way to test for inferences is to set up a batch file and process a series
    of questions as a single dialog. Listing 10.23 shows a batch file that runs a
    list of questions against a scenario. Instead of using the command, enter "brainhat
    -r filename" at the command line, where filename is the name of the file that
    contains the scenario and list of questions.

    Batch processing is an efficient way to test changes to a scenario before applying
    the changes to production code. When the batch file runs, the scenario at the
    top of the file is integrated into Brainhat''s working environment. The dialog
    at the bottom of the batch file is processed one line at a time, just if the user
    is entering it at the keyboard. Brainhat.log will contain the complete output
    of the transaction.

    Listing 10.23 is the output from running the batch file in Listing 10.23. Lines
    1 through 41 absorb the scenario into the environment. The list of questions with
    Brainhat''s responses output on lines 43 through 59.


