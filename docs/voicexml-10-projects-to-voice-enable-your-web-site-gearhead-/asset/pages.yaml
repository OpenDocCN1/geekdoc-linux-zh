  md: '# Contact Us 105


    The <break/> element can carry one of two attributes: time or size. The size attribute
    uses a relative time description such as none, small, medium, or large, the duration
    of which depends on the platform. A time attribute specifies an exact duration
    for the output to pause. It may be expressed in seconds (1.5 s, 3 s, and so on)
    or in milliseconds for more fine-grained control (225 ms, 150 ms, and so on).
    The default of <break/> is set to the platform defined medium.


    > TIP Use the <break/> element to create pauses in output when the user may be
    taking notes.


    The user utterance is checked using the built-in boolean grammar to see if the
    utterance is recognized as a positive or negative response. If the response is
    recognized, it is stored in the snail variable for access within the <filled>
    element. The boolean type will throw an error if the user input is not understood,
    re-prompting for a second utterance.


    > NOTE Built-in grammar types contain default error checking that will handle
    unrecognized utterances, prompting the user for more input.


    The <filled> block beginning on line 19 controls processing of the user input.
    The logic is a little subtle here. Line 20 checks the condition of the snailMail
    field, which is the user input. If the condition is true, the user has uttered
    a positive response. Usually, when a positive response is received from a user,
    processing continues to the next item. In this case however a yes response, will
    be considered positive, indicates that the user desires to hear the prompt again.
    The <clear/> element on line 21 resets all field values within the current form
    to empty, sending the processing back to the top of the form to output the prompt
    and receive new input from the user. We will examine the FIA at the end of this
    project to get a better understanding of how the <clear/> element functions.


    A negative response from the user will pass processing out of the form, terminating
    the application.


    > HANDS ON Create a new VoiceXML application. Create a prompt for your application
    that outputs your company''s address. Use the <var> element to include your company''s
    name as a global variable at the top of the script. If you have several lines
    of output, use the <break/> element to include short pauses between lines.


