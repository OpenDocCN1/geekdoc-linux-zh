  md: '# User Authentication 145


    # <verify> Elements


    < <verify> element is a field-level element that accepts user input and compares
    against a stored voice print. The content of <verify> is a prompt, requesting
    spoken input from the user and for grammar for testing the input.


    > > <verify> is a proprietary element of the BeVocal platform. Check your platform
    documentation for an applicable element for authentication using a voice print.


    The <verify> element may carry name, type, and keyExpr attributes. The name attribute
    holds the results of the recognition processing, which we will examine in the
    next section. The type attribute is one we have seen in previous examples using
    built-in grammars. A keyExpr attribute contains the assigned key that will be
    used to find a copy of the voice print. In this case, it is the value the user
    has as or her assigned key.


    In Listing 4.4, the <verify> element starting on line 39 requests the user''s
    name and compares it against a list stored within the <grammar> element. The <catch>
    or <filled> blocks handle processing, depending upon whether or not a voice print
    was found using the value of the keyExpr attribute.


    > > It is not mandatory to use a phrase as part of the voice print registration
    process, but you will get a more accurate reading if you do.


    # <catch> Elements


    With VoiceXML, it is possible to trap events with a <catch> element and do processing
    based upon what is found. We have examples of the shorthand method of using catch
    by activating events with the <help> element and nomatch/input events with <nomatch>
    and <input> elements. <catch> allows explicit catching of other types of events.


    < <catch> may be set at a document or form level. It carries three attributes:
    event, count, and cond. We have seen the count attribute within the <help>, <nomatch>,
    and <input> elements keeping track of the number of times through the event. The
    count is optional, forcing a specific ECMAScript to be true before the catch element
    can be entered.


    The event attribute of <catch> element serves to be caught. The verification stage
    of voice recognition, a unique key provides access to a voice print within the
    verification engine. If there is no print associated with the key, an error.verify.keynotfound
    is thrown within the <verify> element. Line 56 of Listing 4.4 checks for error.verify.keynotfound.
    If it is found, the content of the <catch> element is executed, outputting an
    error message and transferring processing to the voicePrintRegistration.xml script.


    If the id points to a stored voice print, the voice processing is compared to
    the user''s spoken input for authentication within the <filled> element on lines
    63 through 70.'
  merge: -1
