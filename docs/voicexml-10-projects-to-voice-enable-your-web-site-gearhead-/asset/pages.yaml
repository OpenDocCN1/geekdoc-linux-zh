    # Add Multiple Dialogs to the Template


    A <form> within a VoiceXML application is a standalone dialog that can be accessed
    by using its unique name, or id. The application can have an unlimited number
    of forms, making it possible to create dialogs move back and forth in a natural-sounding
    discourse with the user. Listing 1.2 is a simple application with forms for greeting
    the user, outputting content, and exiting the application.


