  md: '# # PROJECT 5

    Templates and Multiple Documents


    The previous projects each developed specific parts of a Web page and were added
    to a single document. When building a large Web site, however, it is much more
    efficient to break up the application into separate components and access them
    from a single base document. This project will take forms built in the first four
    projects and store them in separate documents, making it possible for various
    members of your development team to work on a single component. We will examine
    techniques for building generic dialogs that can be used in multiple applications.


    | THE PROBLEM |

    | As single-document applications develop into larger applications, it is difficult
    to maintain them and there is a greater chance of code duplication. |

    | THE SOLUTION |

    | Develop a set of common components for generic forms and functions common to
    most VoiceXML applications. |'
