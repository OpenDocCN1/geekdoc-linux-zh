    # Check for User Input


    There is a 1 1/2-second window of opportunity set in the <prompt> on line 35 of
    List-6.3, giving callers a chance to respond to the prompt, even though they don''t
    know it exists. There is a hidden prompt whose response at all is considered an
    error and is handled by the <nomatch> element on line 42. If there is any response
    from the user, all fields in the form are cleared through the <clear> element
    within the <nomatch> block on line 42. The application takes verbal responsibility
    for the error with output of "I''m sorry" and the FIA returns to the first field.


    After the 1/2-second window closes, it is assumed that there was no reaction from
    the caller, implying that the call is to cancel. The <noinput> element assigns
    a value to the confirmName field, allowing the FIA to proceed to the next section
    of dialog. The getBlock beginning on line-48 is a placeholder that will be developed
    in a later section.


    > Using implied and hidden dialogs are a good way to confirm user input without
    bogging down the exchange with a series of yes-responses.


