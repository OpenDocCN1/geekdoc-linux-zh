  md: "# PROJECT\n7\n\n# Report Recorder\n\nI lived in Hawaii for two years. Waves\
    \ of nostalgia break over me every once in a while and I just have to know what\
    \ the break is like at North Shore. www.surfline.com has Web cams and reporters\
    \ set up at beaches around the world. The reporters log in and type a surf report\
    \ each day for the Web site, but that doesn't do much good when all you have is\
    \ a telephone. That's where the idea came from for this project. A special thanks\
    \ is offered to Tim Chandler and his crew at Surfline.com for making the surf\
    \ data available for this project.\n\n| THE PROBLEM\n Multiple sources of information\
    \ need to be recorded and stored on a daily basis. The people making the reports\
    \ should be able to call in their reports over any telephone. |\n| THE SOLUTION\n\
    \ A voice recorder that stores reports in .wav file format will allow the remote\
    \ reporters to log in, make their reports, and have the reports accessible to\
    \ users through a telephone call or a link on the Web site. |\n\n201"
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Project Description


    Recordings are made daily through direct telephone access. The reporters call
    in, are validated with a username and id number, choose a beach for reporting,
    and then record a report. The report is played back to the reporter for verification.
    Once the reporter has verified the recording, it is saved as a .wav file for access
    from the public site.


    To create this project, you will:


    +   1. Develop a simple grammar.

    2. Limit login attempts.

    3. Develop an external grammar file.

    4. Map reporters to beach names.

    5. Record a report.

    6. Save the recording.

    7. Access the recordings.


    # You Will Need


