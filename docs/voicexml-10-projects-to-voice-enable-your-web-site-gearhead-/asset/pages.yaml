    # Field-Level Shadow Variables


    We briefly touched on shadow variables in Project 4 when verifying the voice point
    of a caller. Field-level shadow variables are set as part of the grammar recognition
    system of the VoiceXML platform. They are read-only variables that give access
    to the platform’s analysis of spoken input that can be used to conditional processing
    based upon their value.


    The utterance shadow variable returns the raw input that was understood by the
    platform to be part of the defined grammar for that field. In the current application,
    a user speaks a name, the platform checks the input against the available list
    of names'
