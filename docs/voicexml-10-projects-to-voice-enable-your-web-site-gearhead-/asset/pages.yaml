    # 10.2 Brainhat Web site screen shot.


    Begin a dialog with Brainhat by typing hello and pressing the Enter key on the
    keyboard. The program will answer back with a simple hello. Ask the program “what
    are you?” Wait for the response and then ask “Who am I?” If you get responses
    to these three questions, your Brainhat server is installed properly and is ready
    to have scenarios and vocabularies added to its knowledge base.


    To see how Brainhat can learn from the context of a dialog, enter “you are a computer”
    at the command prompt. Brainhat will echo back that it is a computer. Now tell
    Brainhat “you are green.” For the duration of the session, Brainhat will refer
    to itself as a computer when asked what it is. When it will respond with “I am
    green.” You can continue to give attributes to the program by inserting statements
    telling the program about itself and testing it with questions. Listing 10.3 is
    the output from the test session.


    Type goodbye to exit the program.


    +   1. hello

    2. hello.

