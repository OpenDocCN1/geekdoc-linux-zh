    to the reporterId slot and assigns the value if the comparison is true. With the
    con-confirmedReporterId variable, it can now be used to generate a URI for accessing
    a speci-fic set of beaches in the external grammar file.


    The <form> on lines 124 through 148 is a placeholder for the reading and process-ing
    of the reports. It begins with a request for a beach name that is used to com-pare
    the list of beaches available in the beachnames.grammar file. An ECMAScript concatenation
    operator is used on lines 130 and 131 to provide a call to the external gram-mar
    file with a fragment identifier. The call to the grammar file is in single quotes,
    sig-nifying that it is a literal string that is concatenated with the confirmedReporterId\variable.
    When the variable name is not in quotes, it indicates to the processor that is
    not literal text being processed, but a variable that needs to be expanded to
