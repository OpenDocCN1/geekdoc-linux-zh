    \ of event that they would like information about. The program retrieves a list\
    \ of events from the database and outputs it to the user. The user may then make\
    \ a request to retrieve more event listings or exit the program.\n\nTo complete\
    \ this project, you will:\n\n+   1. Build a skeleton script.\n2. Create three\
    \ subdialog components:\n   - calendargreeting.fxml\n   - calendarmenu.fxml\n\
    \   - calendargoodbye.fxml\n3. Set up a template for Cold Fusion processing.\n\
