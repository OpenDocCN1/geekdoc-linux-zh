  md: '# # PROJECT

    # 10


    # # FAQ Engine


    When I first saw Joseph Weizenbaum''s Eliza engine, I laughed out loud. It acts
    like a Rogerian analyst, spitting back questions and statements based upon your
    responses. Simple pattern matching is used to pull out relevant words from the
    user''s input and then the engine reformates those words into a sentence or question
    that continues the dialog. The problem with Eliza, though, is that there is really
    no exchange of information taking place during the dialog. The program can infer
    anything from the discourse or interact comments that extend the discourse.


    I met Kevin Dowd in 2001 at a Speech-Tek project in New York. The display for
    his product, Brainhat, said that he had a VoiceXML-based speech engine that could
    carry on a conversation based upon context, not word recognition. After testing
    out the demo, I became a believer. The FAQ Engine project was created by me, Kevin,
    and his team at Brainhat. It demonstrates how to access a natural language processing
    engine through a VoiceXML interface.


    THE PROBLEM

    Most FAQ engines have preset definitions for a set of 10 most frequently asked
    questions. There is no dialog between the user and the information, just a question
    and a hard-coded answer.


    THE SOLUTION

    Build a voice-enabled FAQ engine that can infer relationships through context
    and handle basic natural language processing.


    315'
