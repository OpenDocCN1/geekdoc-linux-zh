  md: "# Catching Events\n\nA element can be used to catch events that are normally\
    \ handled by the VoiceXML platform, such as when the user uses “help” or a notch\
    \ error is thrown. The platform is obligated to catch help, nopoint, notch, exit,\
    \ and error events. Using the event attribute within a <link> throws an event\
    \ instead of transitioning to a new dialog or document. When the event is thrown,\
    \ it is handled at the location from which it has been called and does not automatically\
    \ proceed to a transition. This is useful for creating global messages without\
    \ interrupting the flow of the application.\n\n> When an event is thrown, it is\
    \ handled at the location from which it has been called and does not proceed to\
    \ a new document\n\nlink on line 4 of Listing 2.10 defines help as the type of\
    \ event to catch. Lines 5 through 14 define a grammar that will activate the help\
    \ event.\n\n```\n<xml version=\"2.0\">\n\n  <!-- GLOBAL HELP LINK -->\n  <link\
    \ event=\"help\">\n    <grammar root=\"helpVocab\">\n    <rule id=\"helpVocab\"\
    >\n      <one-of>\n        <item>help</item>\n        <item>help me</item>\n \
    \       <item>i'm lost</item>\n        <item>where am i</item>\n      </one-of>\n\
    \    </rule>\n    </grammar>\n  </link>\n\n  <!-- GLOBAL HELP OUTPUT -->\n  <help>\n\
    \    <prompt>\n      You reached the Mars Colony 7\n      tourist info center.\
    \ I can help you\n      find your way around the Mars 7 Colony.\n    </prompt>\n\
    \    <reprompt/>\n  </help>\n  ...\n</xml>\n```\n\n**Listing 2.10** Handling events\
    \ with a link."
