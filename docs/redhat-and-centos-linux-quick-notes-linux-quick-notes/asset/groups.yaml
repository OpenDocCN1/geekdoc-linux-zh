    # 创建新的逻辑卷(LV)\n\n```\n**lvcreate -n LV_name -L size VG_name**\n```\n\n[root@redhat1\
    \ ~]# lvcreate -n lv01 -L 1G vg01\nLogical volume \"lv01\" created\n\n"
