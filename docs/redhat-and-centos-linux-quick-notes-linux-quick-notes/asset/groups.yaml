    \   # service service_name start\n\n# 示例\n```\n# yum install vsftpd\n# chkconfig\
    \ vsftpd on\n# service vsftpd start\n```\n\n# 第 15 章\n\n# SSH\n\nSSH 在客户端/服务器架构中通过不安全的网络提供安全通道。SSH\
    \ 是 telnet 的替代品，telnet 是不安全的协议。它允许安全地登录并执行命令，因为客户端和服务器之间的所有通信都是加密的。\n\n```\nssh\
    \ -x user@hostname\n```\n\n当首次对系统建立 ssh 连接时，远程系统的公钥将存储在本地，以便下次验证其身份。\n\n**Ctrl\
