    # 第19 章


    ## 防火墙


    根据字典定义，防火墙是一种旨在抑制或防止火蔓延的墙或隔断。在计算机中，防火墙是一种网络安全系统，用于保护入站和出站连接。它可以防止未经授权的系统访问。它将限制用户只能访问指定的服务。


    Redhat Linux 内核内置了防火墙，用于允许或拒绝入站和出站的网络流量。


    配置防火墙我们有三种方法：第一是 GUI 模式，第二是 TUI 模式，第三是手动配置:-


    ### 在 GUI 模式下


    ```bash

    # system-config-firewall

    ```


    在这里你可以启用或禁用防火墙。你也可以允许或拒绝入站和出站的网络。配置的主要区域分为两个部分：左侧是类别，右侧是服务和端口号。


    ![](img/387d28290ba77003b955874e67d1b946_243_0.png)


    ### 在文本模式下


    ```bash

    #system-config-firewall-tui

    ```


    ![](img/387d28290ba77003b955874e67d1b946_244_0.png)


    选择 **Enable** 以启用防火墙，然后按 customize


    ![](img/387d28290ba77003b955874e67d1b946_245_0.png)


    ### 在这里你可以配置哪些服务和端口是被信任的


    ### 手动配置


    防火墙配置工具仅配置基础防火墙，如果你需要更细粒度的配置，iptables 和 ip6table 服务提供了配置防火墙的能力。


    ### 配置文件


    /etc/sysconfig/iptables


    # 显示当前规则


    ```bash

    # iptables -L

    ```


    # 开启防火墙


    ```bash

    # service iptables start

    ```


    # 关闭防火墙


    ```bash

    # service iptables stop

    ```


    # 保存配置


    ```bash

    # service iptables save

    ```


    # 开放端口


    ```bash

    iptables -A INPUT -p tcp --dport 22 -j ACCEPT

    ```


    或者


    ```bash

    iptables -A INPUT -p tcp --dport 22 -m conntrack --ctstate NEW,ESTABLISHED -j
    ACCEPT

    ```


    ```bash

    iptables -A OUTPUT -p tcp --sport 22 -m conntrack --ctstate ESTABLISHED -j ACCEPT

    ```


    - - dport 定义了打开的端口，因为 ssh 使用 22 端口

    - - p tcp 定义了使用的协议


    同样，如果你想打开 http 连接，你必须打开 80 端口


    ```bash

    iptables -A INPUT -p tcp --dport 80 -m conntrack --ctstate NEW,ESTABLISHED -j
    ACCEPT

    iptables -A OUTPUT -p tcp --sport 80 -m conntrack --ctstate ESTABLISHED -j ACCEPT

    ```


    使用 iptables 命令创建的规则存储在内存中，系统重启后不会持久化。要保存规则：


    ```bash

    # service iptables save

    ```


    或者你可以手动添加到


    ### /etc/sysconfig/iptables 文件中


    ### 防火墙使用的术语


    1. iptables

    2. tables（表）

    3. chains（链）

    4. rules（规则）


    结构是 iptables > Tables > chains > Rules


    # 第20 章


    ## Selinux


    Selinux 是 **Security Enhanced Linux**（增强型 Linux）。Selinux 是一个改进 Linux 服务器安全性的内核模块。这是在
    Linux 中实现访问控制的解决方案之一。


    Selinux 实现了所谓的 **MAC** 强制性访问控制。Selinux 是一组安全规则，决定了哪个进程可以访问哪个文件、目录或端口等。Selinux
    访问进程、目录、文件的策略被称为上下文（context）。Selinux 的目标之一是保护数据和系统。


    Selin 有三种访问控制形式：


    1. Enforcing（强制）

    2. Permissive（宽容）

    3. Disabled（禁用）


    ### Enforcing


    Selinux 根据 selinux 策略规则拒绝访问。


    ### Permissive


    Selinux 不拒绝访问，但会记录如果在 enforcing 模式下运行会被拒绝的操作。


    ### Disabled


    Selinux 完全禁用


    # 检查安装情况

    ```bash

    # rpm -q | grep selinux

    ```


    # 检查当前模式

    ```bash

    # getenforce

    ```


    # 检查状态

    ```bash

    # sestatus

    ```


    # 主配置文件


    /etc/selinux/config


    # 更改模式


    编辑 `/etc/selinux/config` 文件并将 **selinux=enforcing** 更改为所需的模式，如 **selinux=permissive**。保存文件后重启服务器。如果你将模式设置为
    **permissive**，你可以检查 Selinux 正在做什么：


    ```bash

    # cat /var/log/messages | grep selinux

    ```


    或者


    ```bash

    tail -f /var/log/audit/audit.log

    ```


    # 显示上下文的命令


    | 描述 | 命令 |

    | :--- | :--- |

    | 列出进程上下文 | ps aux |

    | 显示用户上下文 | ls |

    | 显示带上下文的文件 | cp |

    | 带有上下文的复制 | mkdir |


    # 安装 selinux

    ```bash

    # yum install policycoreutils

    ```


    # 更改上下文的工具

    ```bash

    # semanage

    ```


    # 显示上下文

    ```bash

    # semanage fcontext -l

    ```


    类型 SELinux targeted 策略中用于提供进程隔离的主要权限控制方法是类型强制（Type Enforcement）。所有文件和进程都被标记为一种类型。Selinux
    访问进程、目录、文件的策略被称为上下文。Selinux 的目标之一是保护数据和系统。


    Selinux 有三种访问控制形式：


    1. Enforcing

    2. Permissive

    3. Disabled


    ### Enforcing


    Selinux 根据 selinux 策略规则拒绝访问。


    ### Permissive


    Selinux 不拒绝访问，但会记录如果在 enforcing 模式下运行会被拒绝的操作。


    ### Disabled


    Selinux 完全禁用


