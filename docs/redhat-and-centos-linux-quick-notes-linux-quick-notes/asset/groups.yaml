    \n```\n[root@redhat1 /]# umount /snapfs\n```\n\nRemove the snap logical\n\n```\n\
    [root@redhat1 /]# lvremove /dev/vgname/snaplv\n[root@redhat1 /]# lvremove /dev/mapper/vg01-snaplv1\n\
    ```\n\n# Boot process\n\nBoot process of Linux\n\n1. BIOS\n2. Master Boot Record\n\
    3. GRUB\nUses /boot/grub/grub.conf to select the kernel image.\n\n4. Kernel\n\
    1. Mounts the root file system as specified in the “root=” in grub.conf\n2. Kernel\
    \ executes the /sbin/init program which is the first program executed by the kernel\n\
    \n3. initrd stands for Initial RAM Disk. initrd is used by kernel as temporary\
    \ root file system until kernel is booted and the real root file system is mounted.\
    \ It also contains drivers which are required to access hard disk and other necessary\
    \ hardware.\n\n5. Init\nIt reads /etc/inittab file to decide the Linux run level.\n\
    \nFollowing are the available run levels\n\n- 0 – halt\n- 1 – Single user mode\n\
    - 2 – Multi user mode without network\n- 3 – Full multiuser mode\n- 4 – unused\n\
    - 5 – GUI\n- 6 – reboot\n\nTypically you would set the default run level to either\
    \ 3 or 5.\n\n# 6. Runlevel\n\nDepending on Runlevel selected by inittab some services\
    \ will start other will stop, the system will execute the programs from one of\
    \ the following directories.\n\n| Run level 0 | /etc/rc.d/rc0.d/ |\n| :--- | :---\
    \ |\n| Run level 1 | /etc/rc.d/rc1.d/ |\n| Run level 2 | /etc/rc.d/rc2.d/ |\n\
    | Run level 3 | /etc/rc.d/rc3.d/ |\n| Run level 4 | /etc/rc.d/rc4.d/ |\n| Run\
    \ level 5 | /etc/rc.d/rc5.d/ |\n| Run level 6 | /etc/rc.d/rc6.d/ |\n\nUnder the\
    \ /etc/rc.d/rc*.d directories, you would see programs that start with S and K\
    \ which are symbolic link to actual scripts in /etc/rc.d/init.d/ directory. There\
    \ are numbers right next to S and K in the program names. Those are the sequence\
    \ number in which programs should be started or killed.\n\n# Chapter 26\n\n# #\
    \ Reset root password\n\n1. At menu press any key any key to enter GRUB menu\n\
    \n![](img/387d28290ba77003b955874e67d1b946_322_0.png)\n\n2. At GRUB menu press\
    \ **a**\n\n3. Add single at the end of line\n\n```\nGRUB version 0.97 (16384 lower\
    \ / 2684376 upper memory)\n\nRed Hat Enterprise Linux 6.2.32-431.x86_64\n\nUse\
