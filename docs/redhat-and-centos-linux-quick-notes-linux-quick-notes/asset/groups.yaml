    ```\n\n![](img/387d28290ba7703b955874e67d1b946227_0.png)\n\n# 第 17 章\n\n# FTP\n\
    \nFTP 是文件传输协议。用于在网络上的计算机之间传输文件。它基于客户端/服务器模型。客户端有三种：\n\n- 1. GUI\n- 2. 浏览器\n- 3.\
    \ 命令行\n\n在 Redhat 衍生版中使用 vsftp（非常安全的 FTP）守护进程作为 FTP 服务器。\n\n# 部署 vsftp\n\n###\
