    # Chapter 19


    ## Firewall


    According to dictionary, a firewall is a wall or partition designed to inhibit
    or prevent the spread of fire. In computers, firewall is a network security system
    that is used to secure the incoming and outgoing connections. It prevents unauthorized
    access to the system. It restricts user to access only designated services.


    Redhat Linux kernel has built-in firewall which can be used to allow or deny incoming
    and outgoing network traffic.


    To configure firewall we have three ways to do that: first is GUI mode, second
    is TUI mode and third manually:-


    ### In GUI mode


    ```bash

    # system-config-firewall

    ```


    Here you can enable or disable firewall. You can also allow or deny incoming and
    outgoing network. The main area of configuration is divided into two pans: left
    pan is category and right pan is services and port numbers.


    ![](img/387d28290ba77003b955874e67d1b946_243_0.png)


    ### In text mode


    ```bash

    #system-config-firewall-tui

    ```


    ![](img/387d28290ba77003b955874e67d1b946_244_0.png)


    Select **Enable** to enable firewall then press customize


    ![](img/387d28290ba77003b955874e67d1b946_245_0.png)


    ### Here you can configure which services and ports are trusted


    ### Manual Configuration


    Firewall configuration tool only configure basic firewall, if you need more granular
    configuration of firewall iptables and ip6table service provide the ability to
    configure firewall.


    ### Configuration file


    /etc/sysconfig/iptables


    # To display current rules


    ```bash

    # iptables -L

    ```


    # Turn the firewall on


    ```bash

    # service iptables start

    ```


    # Turn the firewall off


    ```bash

    # service iptables stop

    ```


    # Save the configuration


    ```bash

    # service iptables save

    ```


    # To open ports


    ```bash

    iptables -A INPUT -p tcp --dport 22 -j ACCEPT

    ```


    or


    ```bash

    iptables -A INPUT -p tcp --dport 22 -m conntrack --ctstate NEW,ESTABLISHED -j
    ACCEPT

    ```


    ```bash

    iptables -A OUTPUT -p tcp --sport 22 -m conntrack --ctstate ESTABLISHED -j ACCEPT

    ```


    - - dport defines the port has been opened as ssh uses port 22 for

    - - p tcp defines the protocol being used


    Similarly if you want to open http connection you have to open port 80


    ```bash

    iptables -A INPUT -p tcp --dport 80 -m conntrack --ctstate NEW,ESTABLISHED -j
    ACCEPT

    iptables -A OUTPUT -p tcp --sport 80 -m conntrack --ctstate ESTABLISHED -j ACCEPT

    ```


    Rules created with iptables command as stored in memory it will not persist after
    system restart. To save the rules:


    ```bash

    # service iptables save

    ```


    Or you can add manually in the


    ### /etc/sysconfig/iptables file


    ### Terms used in firewall


    1. iptables

    2. tables

    3. chains

    4. rules


    The structure is iptables > Tables > chains > Rules


    # Chapter 20


    ## Selinux


    Selinux is **Security Enhanced Linux**. Selinux is kernel module that improves
    the Linux server security. This is one of the solution for implementation of Access
    Control in Linux.


    Selinux implements what is known as **MAC** Mandatory Access Control. Selinux
    is set of security rules which determine which process can access which file,
    directory or port etc. Selinux policy to access process, directory, files is called
    as context. One goal of Selinux is to protect data and system.


    Selinux has three forms of access control:


    1. Enforcing

    2. Permissive

    3. Disabled


    ### Enforcing


    Selinux denies access based on selinux policy rules.


    ### Permissive


    Selinux does not deny access but actions are logged that would have been denied
    if running in enforcing mode.


    ### Disabled


    Selinux is completely disabled


    # Check the installation

    ```bash

    # rpm -q | grep selinux

    ```


    # Check current mode

    ```bash

    # getenforce

    ```


    # Check the status

    ```bash

    # sestatus

    ```


    # Main configuration file


    /etc/selinux/config


    # To Change the mode


    Edit `/etc/selinux/config` file and change **selinux=enforcing** to desired mode
    like **selinux=permissive**. After saving the file and reboot the server. If you
    set the mode to **permissive** you can check what Selinux is doing:


    ```bash

    # cat /var/log/messages | grep selinux

    ```


    Or


    ```bash

    tail -f /var/log/audit/audit.log

    ```


    # Commands to display context


    | Description | Command |

    | :--- | :--- |

    | List process context | ps aux |

    | Display user context | ls |

    | Display files with context | cp |

    | copy with context | mkdir |


    # Install selinux

    ```bash

    # yum install policycoreutils

    ```


    # Tool to change context

    ```bash

    # semanage

    ```


    # Show context

    ```bash

    # semanage fcontext -l

    ```


    Types The main permission control method used in SELinux targeted policy to provide
    process isolation is Type Enforcement. All files and processes are labeled as
    a type. Types define selinux domain for processes and selinux type for files.


    Example of Types are: httpd_sys_content_t, tmp_t


    # Add context

    ```bash

    # semanage fcontext -a -t httpd_sys_content_t /abc/zzz.txt

    ls -Z

    -rw-r--. root unconfined_u:object_r:samba_share_t:0 zzz.txt

    ```


    # Set the context to default

    ```bash

    # restorecon -v -t /abc/zzz.txt

    ```


    Booleans allow a part of Selinux policy to change at runtime without any knowledge
    of selinux writing.


    # List Booleans

    ```bash

    # semanage boolean -l

    ```


    # Configure Booleans

    ```bash

    # semanage boolean -l

    ```


    # list all whether they are on/off

    ```bash

    # getsebool -a

    ```


    # Allow ftp read and write files in the users directory

    ```bash

    # setsebool -P ftp_home_dir on

    ```


    # Check

    ```bash

    # getsebool ftp_home_dir

    ftp_home_dir -> on

    ```


    # Chapter 21


    ## Partition and file system


    ### Partitions


    Partition is to divide the storage, mostly hard disk into segments in which you
    can have more than one type of file systems. Partitioning of storage helps in
    managing storage properly. **fdisk** is used to partition the disk.


    ### List the partition table


    ```bash

    fdisk -l

    ```


    ### List the partition table for specific


    Syntax

    fdisk -l <device name>


    # Example

    ```bash

    fdisk -l /dev/hda1

    ```


    # Create new partition on device


    In this example /dev/sda2 is added to system. First check the new device added:


    | fdisk -l |

    | Disk /dev/sdb: 21.5 GB, 21474836480 bytes |

    | 255 heads, 63 sectors/track, 2610 cylinders |

    | Units = cylinders of 16065 * 512 = 8225280 bytes |

    | Sector size (logical/physical): 512 bytes / 512 bytes |


    it will show all the storage device


    # Run fdisk on required device

    ```bash

    fdisk -c /dev/sdb

    ```


    Check if partition is there on device selected with disk

    Press p and enter key


    | Command (m for help): p |

    Disk /dev/sdb: 21.5 GB, 21474836480 bytes 255 heads, 63 sectors/track, 2610 cylinders,
    total 41943040 sectors |

    | Units = sectors of 1 * 512 = 512 bytes |

    | Sector size (logical/physical): 512 bytes / 512 bytes |

    | I/O size (minimum/optimal): 512 bytes / 512 bytes |

    | Disk identifier: 0xdec2ee90 |


    | Device Boot Start End Blocks |

    | Id System | | |


    Press **n** for new partition

    Press **p** for primary

    Give partition number like **1, 2, 3, 4**

    Press **Enter** for starting section

    For last sector, give size like +1G to create 1 GB partition


    ```bash

    Command (m for help): n

    Command action

    e extended

    p primary partition (1-4)

    p

    Partition number (1-4): 1

    First sector (2048-41943039, default 2048):

    Using default value 2048

    Last sector, +sectors or +size {K,M,G}

    (2048-41943039, default 41943039): +1G

