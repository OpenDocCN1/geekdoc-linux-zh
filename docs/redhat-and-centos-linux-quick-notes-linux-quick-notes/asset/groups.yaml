    # Repository


    To install additional package or update existing package you require repository.
    It is warehouse all Linux software. Yum repository can hold RPM packages located
    locally like CDROM , directory on local disk or remotely like FTP, HTTP or HTTPS.
    The configuration files for name, location, status etc of repository is there
    in /etc/yum.repos.d/ directory.


    The configuration file present in the /etc/yum.repos.d/ directory have'
  - '[PAGE 158]


    following fields


    **Repository ID** - Single word unique repository ID


    **Name** - Name of the repository

    (example: name=CD_media)


    **Baseurl** - URL to the repodata directory.

    You can use ftp://link, http://link, https://link if repository is located remotely
    and file://path if repository is located locally (example file:///mnt/ for mnt
    directory locally)


    **Enabled** - Enable/Disable repository

    (example: enabled=1 to enable or enable=0 to disable)'
