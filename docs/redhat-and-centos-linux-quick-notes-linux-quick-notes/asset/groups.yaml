    \ rpcbind start\n# service nfs start\n```\n\n# 设置服务开机启动\n\n```bash\n# chconfig\
    \ nfs on\n# chconfig rpcbind on\n```\n\n编辑 /etc/exports 文件以添加你想共享给客户端的文件系统，格式如下：\n\
    \n| 挂载点 (mountpoint) | 主机 (host) | 权限选项 |\n| :--- | :--- | :--- |\n| **mountpoint**\
