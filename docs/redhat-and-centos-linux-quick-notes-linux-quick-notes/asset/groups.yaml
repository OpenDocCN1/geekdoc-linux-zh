- md: "\n# RedHat / Centos\nVersion 6.5\n\n# *Quick Notes*\n\nShiv Kumar Goyal\n\n\
    ![](img/387d28290ba77003b955874e67d1b946_1_0.png)\n\n# RedHat and Centos\nQuick\
    \ Notes\n\nShiv Kumar Goyal\n\n# Preface\n\nThis book is written keeping in mind\
    \ Linux system administrators, who want to learn Redhat/Centos but do not have\
    \ time to read a lot of books. This book is an excellent choice for preparing\
    \ for interviews. \n\nI tried my level best to keep the text as precise as possible.\
    \ \nThis book is specially prepared for practical implementation of Redhat. I\
    \ hope it will help the administrators in deploying Redhat in the production environment.\n\
    \nThanks,\n\nShiv Kumar Goyal\n\n# Contents\n\n- Introduction\n- Fedora and Redhat\n\
    - Installation\n- Steps to do Interactive installation\n- Network\n- Seven layer\
    \ of OSI and TCP Mapping\n- Check IP address and routing table\n- Check and change\
    \ hostname\n- Setting Up the DNS Name Resolution\n- Using Domain Name Server for\
    \ name\n- Changing order for hostname resolution\n- Modifying network configuration\
    \ with GUI\n- Modifying network configuration manually\n- Adding static route\n\
    - Changing DNS server\n- Managing network interface\n- Important Network Commands\n\
    - Managing local users and groups\n- User management\n- UID\n- Groups\n- /etc/passwd\n\
    - /etc/shadow\n- NFS Network File System\n- Mounting DVD automatically\n- Graphics\
    \ User Interface\n- Graphical Login\n- Virtual Console Login\n- GNOME terminal\n\
    - Disk Utility\n- Process and threads\n- Process scheduling\n- Automating tasks\n\
    - Cron\n- To schedule a recurring task\n- at and batch\n- Log management\n- Log\
    \ filtering\n- Rotating logs\n- logwatch\n- Software management\n- Redhat network\
    \ Repository\n- yum Commands\n- Package\n- Remove package\n- Package group\n-\
    \ Installing packages with RPM command\n- RPM\n- Display detailed information\
    \ about package\n- Find the file belongs to which package\n- Find out all dependences\n\
    - Repository\n- Defining repository\n- Using Red Hat DVD or local directory\n\
    - as repository\n- Utilities:\n  - Tar\n  - untar\n  - List the archived tar file\n\
    \  - cp\n  - scp\n  - CPIO\n- Dump and Restore:\n  - dump\n  - restore\n  - ls\n\
    \  - cat\n  - rm\n  - More\n  - less\n  - mv\n  - grep\n  - head\n  - tail\n \
    \ - Diff\n  - File\n  - Echo\n  - Date\n- Piping and Redirection: Sending output\
    \ to file (\">\")\n- Sending input from file (<)\n- Piping (|)\n- Compression\
    \ utilities: Compress, Uncompress\n- Managing services and daemons:\n  - Daemons\n\
    \  - Services\n  - Run level\n- Managing services startup\n- Managing the services\
    \ status \n- Install new service\n- SSH\n- VNC\n- FTP\n- Deploying vsftp\n- Web\
    \ server\n- Deploying http server\n- Firewall\n  - In GUI mode\n  - In text mode\n\
    \  - Manual Configuration\n- Terms used in firewall\n- Selinux\n- To Change the\
    \ mode\n- Commands to display context\n- Partition and file system\n- Partitions\n\
    - File system\n- EXT File System\n- Swap space\n- Logical Volume Manager\n- Terms\
    \ used in LVM\n- Steps to create File system with newly disk added to system\n\
    - PV Commands\n- Volume Group Commands\n- Moving Volume group from one system\
    \ to other\n- Extending FileSystem\n- Reduce the File System\n- LVM snapshot\n\
    - Create snapshot LV\n- Remove snapshot LV\n- Boot process\n- Reset unknown root\
    \ password\n- Identify your system\n- sosreport\n\n# Chapter 1\n\n# Introduction\n\
    \nLinux is a UNIX-like operating system. Linux is an open source project started\
    \ by Linus Torvalds in 1991. There are thousands of Linux distributions in the\
    \ market, but broadly can be classified on their root distribution for example\
    \ Centos, Oracle and Scientific Linux based on Redhat, Debian-based distributions\
    \ like Ubuntu, Mint etc. The prominent players in free Linux are Ubuntu, Debian,\
    \ Fedora, Opensuse etc. Redhat and SUSE are major players in non-free enterprise\
    \ Linux distribution. Redhat and SUSE are RPM package-based distributions whereas\
    \ Debian-based distributions are of DEB packaging.\n\n# Fedora and Redhat\n\n\
    Fedora is a free distribution and community project sponsored by Redhat. Fedora\
    \ is upstream for Redhat Enterprise Linux. Fedora is a test bed for new features,\
    \ which may get incorporated in upcoming Redhat Linux versions. The main difference\
    \ between the Fedora Linux and Redhat Enterprise Linux is support and life cycle\
    \ of the product. Redhat is a commercially supported product whereas Fedora is\
    \ community supported. Redhat Enterprise Linux has a life cycle of a few years\
    \ and is supported up to 10 years, but in case of Fedora new releases come out\
    \ every 6 months and get updated for 13 months only. Redhat provides service level\
    \ agreements, certification of hardware and software, which is important for enterprise\
    \ organizations.\n\nOracle Linux, Centos Linux and Scientific Linux distributions\
    \ are derived from the sources of Red Hat Enterprise Linux. They provide the same\
    \ software as Redhat but without support from Redhat.\n\n# Chapter 2\n\n# Installation\n\
    \nThe common ways to install Redhat are:\n1. Interactive\n2. Kickstart\n\nInteractive\
    \ method can be either Text or GUI. For Kickstart, you need to create a Kickstart\
    \ file containing all the answers to the questions. During installation, no intervention\
    \ is required.\n\nTo start installation, download the ISO image from redhat.com.\
    \ Boot the system with DVD. Once the installation menu comes, select the existing\
    \ media.\n\n![](img/387d28290ba77003b955874e67d1b946_25.png)\n\nSelect storage.\
    \ \n\n![](img/387d28290ba77003b955874e67d1b946_26.png)\n\nSelect language.\n\n\
    ![](img/387d28290ba77003b955874e67d1b946_27.png)\n\nSelect hostname.\n\n![](img/387d28290ba77003b955874e67d1b946_28.png)\n\
    \nConfigure network.\n\n![](img/387d28290ba77003b955874e67d1b946_29.png)\n\nIn\
    \ case of static IP, select manual and provide IP address, Netmask, gateway and\
    \ DNS server. Do not forget to click Apply. Then click next. \n\nOn the next screen,\
    \ select time zone. Since time zone is country specific, select the time zone\
    \ accordingly.\n\n![](img/387d28290ba77003b955874e67d1b946_31.png)\n\nProvide\
    \ root password.\n\n![](img/387d28290ba77003b955874e67d1b946_32.png)\n\nSelect\
    \ partitioning. Use \"use all\", tick Review and modify layout before pressing\
    \ next.\n\n![](img/387d28290ba77003b955874e67d1b946_33.png)\n\nHere you can edit\
    \ the layout.\n\n![](img/387d28290ba77003b955874e67d1b946_34.png)\n\nConfirm to\
    \ write to disk. In the next screen it will ask you to confirm the boot loader,\
    \ click next.\n\nNext is the Software package selection menu. Press next with\
    \ default selected if you want command line interface after installation. If you\
    \ want graphical desktop, customize now.\n\n![](img/387d28290ba77003b955874e67d1b946_36.png)\n\
    \nOn the next screen, in left pan select Desktops and on right pan select Desktop\
    \ and Fonts.\n\n![](img/387d28290ba77003b955874e67d1b946_37.png)\n\n1. It will\
    \ start installing the packages.\n\n![](img/387d28290ba77003b955874e67d1b946_38.png)\n\
    \nOnce installation is finished, press Reboot.\n"
  mdcn: "\n\n# RedHat / Centos\n版本 6.5\n\n# *快速入门笔记*\n\nShiv Kumar Goyal\n\n![](img/387d28290ba77003b955874e67d1b946_1_0.png)\n\
    \n# RedHat 与 Centos\n快速入门笔记\n\nShiv Kumar Goyal\n\n# 前言\n\n本书的编写初衷是考虑到了 Linux\
    \ 系统管理员，他们想要学习 Redhat/Centos 但没有时间阅读大量的书籍。这本书是准备面试的极佳选择。\n\n我尽力保持文字尽可能精确。\n本书专门为\
    \ Redhat 的实际实施而准备。我希望它能帮助管理员们在生产环境中部署 Redhat。\n\n此致，\n\nShiv Kumar Goyal\n\n#\
    \ 目录\n\n- 绪言\n- Fedora 与 Redhat\n- 安装\n- 交互式安装的步骤\n- 网络\n- OSI 七层模型与 TCP 映射\n\
    - 检查 IP 地址和路由表\n- 检查并修改主机名\n- 设置 DNS 名称解析\n- 使用域名服务器进行解析\n- 更改主机名解析顺序\n- 使用 GUI\
    \ 修改网络配置\n- 手动修改网络配置\n- 添加静态路由\n- 更改 DNS 服务器\n- 管理网络接口\n- 重要网络命令\n- 管理本地用户和组\n\
    - 用户管理\n- UID\n- 组\n- /etc/passwd\n- /etc/shadow\n- NFS 网络文件系统\n- 自动挂载 DVD\n-\
    \ 图形用户界面\n- 图形登录\n- 虚拟控制登录\n- GNOME 终端\n- 磁盘工具\n- 进程与线程\n- 进程调度\n- 任务自动化\n- Cron\n\
    - 调度周期性任务\n- at 和 batch\n- 日志管理\n- 日志过滤\n- 日志轮转 (Rotating logs)\n- logwatch\n\
    - 软件管理\n- Redhat 网络仓库 (Repository)\n- yum 命令\n- 软件包 (Package)\n- 移除软件包\n- 软件包组\
    \ (Package group)\n- 使用 RPM 命令安装\n- RPM\n- 显示软件包的详细信息\n- 查找属于哪个软件包的文件\n- 查找所有依赖项\n\
    - 仓库 (Repository)\n- 定义仓库\n- 使用 Red Hat DVD 或本地目录\n- 作为仓库\n- 工具：\n  - Tar\n  -\
    \ untar\n  - 列出归档 tar 文件\n  - cp\n  - scp\n  - CPIO\n- 倾储与恢复：\n  - dump\n  - restore\n\
    \  - ls\n  - cat\n  - rm\n  - More\n  - less\n  - mv\n  - grep\n  - head\n  -\
    \ tail\n  - Diff\n  - File\n  - Echo\n  - Date\n- 管道与重定向：输出输出到文件 (\">\")\n- 从文件输入\
    \ (<)\n- 管道 (|)\n- 压缩工具：压缩、解压缩\n- 管理服务与守护进程：\n  - 守护进程 (Daemons)\n  - 服务 (Services)\n\
    \  - 级别 (Run level)\n- 管理服务启动\n- 管理服务状态\n- 安装新服务\n- SSH\n- VNC\n- FTP\n- 部署 vsftp\n\
    - Web 服务器\n- 部署 http 服务器\n- 防火墙\n  - GUI 模式\n  - 文本模式\n  - 手动配置\n- 防火墙使用的术语\n\
    - Selinux\n- 更改模式\n- 显示上下文的命令\n- 分区与文件系统\n- 分区\n- 文件系统\n- EXT 文件系统\n- 交换空间 (Swap\
    \ space)\n- 逻辑卷管理器 (LVM)\n- LVM 中使用的术语\n- 为系统中新添加的磁盘创建文件系统的步骤\n- PV 命令\n- 卷组 (Volume\
    \ Group) 命令\n- 将卷组从一个系统移动到另一个系统\n- 扩展文件系统\n- 缩小文件系统\n- LVM 快照\n- 创建快照 LV\n- 删除快照\
    \ LV\n- 启动过程\n- 重置未知 root 密码\n- 识别你的系统\n- sosreport\n\n# 第一章\n\n# \n\nLinux 是一种类\
    \ Unix 操作系统。Linux 是由 Linus Torvalds 在 1991 年启动的开源项目。市场上有成千上万种 Linux 发行版，但大致可以根据其根发行版进行分类，例如：基于\
    \ Redhat 的 Centos、Oracle 和 Scientific Linux，以及基于 Debian 的发行版如 Ubuntu、Mint 等。免费\
    \ Linux 领域的主要参与者有 Ubuntu、Debian、Fedora、Opensuse 等。Redhat 和 SUSE 是非免费企业 Linux 发行版的主要参与者。Redhat\
    \ 和 SUSE 是基于 RPM 包的发行版，而基于 Debian 的发行版采用 DEB 包格式。\n\n# Fedora 与 Redhat\n\nFedora\
    \ 是一个由 Redhat 赞助的免费发行版社区项目。Fedora 是 Redhat Enterprise Linux 的上游。Fedora 是新功能的测试场，这些功能可能会被整合到未来的\
    \ Redhat Linux 版本中。Fedora Linux 和 Redhat Enterprise Linux 之间的主要区别在于支持生命周期。Redhat\
    \ 是商业支持的产品，而 Fedora 是社区支持。Redhat Enterprise Linux 的生命周期为几年，并支持最多 10 年，但 Fedora\
    \ 每 6 个月发布新版本，且仅更新 13 个月。Redhat 提供服务水平协议、硬件和软件认证，这对于企业组织非常重要。\n\nOracle Linux、Centos\
    \ Linux 和 Scientific Linux 发行版源自 Red Hat Enterprise Linux 源码。\n\n# 第二章\n\n# 安装\n\
    \n安装 Redhat 的常见方法：\n1. 交互式 (Interactive)\n2. Kickstart\n\n交互方法可以是文本模式或 GUI。对于\
    \ Kickstart，你需要一个包含答案的 Kickstart 文件。安装期间不需要干预。\n\n从 redhat 下载镜像。使用 DVD 启动。出现安装菜单后，选择现有媒体。\n\
    \n![](img/387d28290ba77003b955874e67d1b946_25.png)\n\n选择存储器。\n\n![](img/387d28290ba77003b955874e67d1b946_26.png)\n\
    \n选择语言。\n\n![](img/387d28290ba77003b955874e67d1b946_27.png)\n\n选择主机名。\n\n![](img/387d28290ba77003b955874e67d1b946_28.png)\n\
    \n配置网络。\n\n![](img/387d28290ba77003b955874e67d1b946_29.png) 对于静态 IP，选择手动并提供 IP\
    \ 地址、子网掩码、网关和 DNS 服务器。点击应用。然后下一步。\n\n在下一个屏幕上选择时区。由于时区具有地区性，请根据情况选择时区。\n\n![](img/387d28290ba77003b955874e67d1b946_31.png)\
    \ 提供 root 密码。\n\n![](img/387d28290ba77003b955874e67d1b946_32.png) 选择分区。使用“使用全部”，在点击下一步之前勾选“修改布局”。\n\
    \n![](img/387d28290ba77003b955874e67d1b946_33.png) 在这里编辑布局。\n\n![](img/387d28290ba77003b955874e67d1b946_34.png)\
    \ 确认写入磁盘。在下一个屏幕上将要求你确认启动加载程序，点击下一步。\n\n接下来是软件包选择菜单。如果你希望安装后使用命令行界面，请带默认设置点击下一步。如果你想要图形桌面，请点击“现在自定义”。\n\
    \n![](img/387d28290ba77003b955874e67d1b946_36.png) 在下一个屏幕上，在左侧面板选择桌面，在右侧面板选择桌面环境和字体。\n\
    \n![](img/387d28290ba77003b955874e67d1b946_37.png) 1. 它将开始安装软件包。\n\n![](img/387d28290ba77003b955874e67d1b946_38.png)\
    \ 安装完成后，按下重启。\n\n"
