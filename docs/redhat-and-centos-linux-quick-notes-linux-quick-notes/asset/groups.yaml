    # Sending output to file (>)


    Normally, we will get our output on the screen, but if we wish to save it into
    a file the greater than operator ( > ) is used to send the standard out to file.


    # Example


    ```

    # ls > abc.txt

    ```


    # Sending input from file (<)


    If we use the less than operator ( < ) then we can read data from file and feed
    it into the program via it''s STDIN stream.


    # Example


    ```

    # wc -l < abc.txt

    ```


