    # Dump and Restore


    # dump


    Dump utility backup whole file system or files that has changed since last dump
    ideally dump should be taken on the quiescent file system, so that files are not
    changing while backup.


    # Syntax


    ```

    dump <options> target_device filesystem_to_be backed_up

    ```


    # Example :


    To take backup of whole root filesystem to device st0


    ```

    # dump -0uf /dev/st0 /

    ```


    Where


    0 is dump level. There are ten dump levels from 0 to 9


    - -0 complete

    - -1 increment from last backup

    - -2 increment from last 1 backup

    - -3-9 like that

    - u updates /etc/dumpdates file with dump information

    - f for device name


    # restore


    restore command is used to restore the backup taken with dump command


    # syntax


    restore <options> backupdevice


    # Example:


    To restore backup stored on /dev/st0 device


    ```

    # restore -if/dev/st0

    ```


    where option i invokes interactive mode that allows to choose which file and directory


    # Restore specific file


    To restore specific file from backup in example to restore /etc/hosts


    ```

    # restore -xf /dev/st0 /etc/hosts

    ```


