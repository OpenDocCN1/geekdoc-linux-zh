    \ -U user1\n```\n\n# UID\n\nUnique User ID called as UID is every user exist on\
    \ system user it fixed for root and regular users.\n\n| User | UID |\n| :--- |\
    \ :--- |\n| root | 0 |\n| System user | 1 – 499 |\n| Regular users | 500 + |\n\
    \n# Groups\n\nEvery user we create belongs to group and all groups have group\
    \ ID. List all available groups can be found in /etc/groups and entry of all users\
    \ member of these groups there are two type of groups:\n\n- primary group\n- secondary\
    \ group\n\n# Primary group\n\nThis is the group applied to you when you login\
    \ and used by default when you create new files and directories. It is normally\
    \ same name as username. Users primary group ID is written in /etc/passwd file\
    \ for respective users in the third field.\n\n# Secondary Group\n\nThese are the\
    \ groups users are member other than primary group.\n\n# /etc/group\n\n```\ngroupname:shadow\
    \ password:GID:list of users in group\n```\n\n# Example\n\n```\nscience:x:1003:class1,class2\n\
    ```\n\n# Changing primary group\n\n```bash\nusermod -g data1 user1\n```\n\n# Changing\
    \ secondary group\n\n```bash\nusermod -G data2 user1\n```\n\n# Add new group\n\
    \n```bash\ngroupadd groupname\n```\n\n# Delete group\n\n```bash\ngroupdel groupname\n\
    ```\n\n# /etc/passwd\n\nStores user information\n\n# Format\n\n```\nusername:x:UID:GID:Full_user_name:home_\n\
    ```\n\n**Username** up to 8 characters. Case-sensitive.\n\n**x** Passwords are\
    \ stored in the `/etc/shadow` file.\n\n**UID** User ID.\n\n**GID** Group ID.\n\
    \n**shell account** Often set to `/bin/bash` to provide access to the bash shell\
    \ but can be other shell like c shell korn shell.\n\n# Example\n\n```\nroot:x:0:0:root:/root:/bin/bash\n\
    ```\n\nPassword 13 character encrypted. A blank entry (eg. ::) indicates a password\
    \ is not required to log in (usually a bad idea), and a `*` entry (eg. :*:) indicates\
    \ the account has been disabled.\n\n**last_password_change** The number of days\
    \ (since January 1, 1970) since the password was last changed.\n\n**Minimum:**\
    \ The number of days before password may be changed (0 indicates it may be changed\
    \ at any time).\n\n**Maximum:** The number of days after which password must be\
    \ changed (99999 indicates user can keep his or her password unchanged for many,\
    \ many years).\n\n**Warn :**The number of days to warn user of an expiring password\
    \ (7 for a full week).\n\n**Inactive:** The number of days after password expires\
    \ that account is disabled.\n\n**Expire:** The number of days since January 1,\
    \ 1970 that an account has been disabled.\n\n# Example\n\n```\nroot:$6$YtTXd..cW9GYuWT9sNwX07B3i..11\n\
    ```\n\n# Chapter 5\n\n# NFS Network File System\n\nNFS is file sharing file system\
    \ which works on server client basis. Server’s shared file systems are mounted\
    \ on client. Four version of NFS are there:-\n\n- 1. NFS V1\n- 2. NFS V2\n- 3.\
    \ NFS V3\n- 4. NFS V4\n\nWhere NFS V3 and NFS V4 are more recent version of NFS,\
    \ V3 is safer and asynchronous works on UDP protocol while V4 has added advantage\
    \ of working through firewall and works on TCP.\n\n# /etc/exports\n\nConfiguration\
    \ file used to export file system on server to clients.\n\n# To export file system\
    \ without /etc/exports manually.\n\n```bash\n# exportfs -i /user1\n```\n\n# To\
    \ export all exported file\n\n```bash\n# exportfs -ua\n```\n\n# Configure NFS\
    \ on the server without firewall\n\nDisable firewall System-config-firewall uiselect\
    \ the firewall ok ![](img/387d8290ba77003b955874e67d1b94687_0.png)\n\n```bash\n\
    # service iptables stop\n```\n\n# Install packages\n\n```bash\n# yum install nfs-utils\n\
    # yum install rpcbind\n# yum groupinstall 'NFS server'\n```\n\n# Start the services\n\
    \n```bash\n# service rpcbind start\n# service nfs start\n```\n\n# Make service\
    \ start on reboot\n\n```bash\n# chconfig nfs on\n# chconfig rpcbind on\n```\n\n\
    Edit /etc/exports file to add filesystem you want to share to clients format that\
    \ is :-\n\n| mountpoint | host | permissions options |\n| :--- | :--- | :--- |\n\
    | **mountpoint** is file systems you want to export | **host** is optional the\
    \ client you want to give access | **permissions** is optional it can be **ro**\
    \ read only, **rw** read write **sync** written before command finished. |\n\n\
    # Export system\n\n```bash\n# exportfs -a\n```\n\n# See the file exported\n\n\
    ```bash\n# showmount -e\n```\n\n# On client\n\n```bash\n# mount -t nfs 192.168.0.1:/userfs\
