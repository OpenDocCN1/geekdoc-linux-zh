- md: "\n# Managing services and daemons\n\n## Daemons\n\nDaemons are processes, which\
    \ run in the background and not interactively. Daemons perform some predefined\
    \ actions at predefined time. Generally daemons start at bootup and remain till\
    \ shutdown. Mostly daemons name ends with **d.**\n\n# Services\n\nServices are\
    \ init scripts (initialization scripts) resides in /etc/rc.d/init.d directory.\
    \ These scripts are to manage daemons. Service scripts can be called with start,\
    \ stop, restart, status and reload argument to manage daemons.\nService can be\
    \ start at boot time using **chkconfig service_name on** command.\n\n# Run level\n\
    \nRun level is state or mode of OS in which it will run. Each run level has certain\
    \ number of services stopped or started providing control over behavior of machine.\
    \ There are seven Runlevels:\n\n- 0 halt the machine\n- 1 single user mode\n-\
    \ 2 not used, can be used by user\n- 3 multiuser with command line no GUI\n- 4\
    \ not used, can be used by user\n- 5 multiuser with GUI\n\n# Commands\n\n### Check\
    \ current runlevel\n\n```\n# runlevel\n```\n\n### Change default run level\n\n\
    Edit /etc/inittab file in this example whe change to command line runlevel 3\n\
    \n```\nId:3:default:\n```\n\n# Managing services startup\n\n### To list all services\
    \ and there status at each runlevel\n\n```\n# chkconfig --list\n```\n\n### To\
    \ list current setting of specific service\n\n#### Syntax\n\n```\n# chkconfig\
    \ --list service_name\n```\n\n#### Example\n\n```\n# chkconfig --list vsftpd\n\
    ```\n\n### Enabling service in runlevel 2, 3, 4 , 5\n\n#### Syntax\n```\n# chkconfig\
    \ Service_name on\n```\n\n#### Example\n```\n# chkconfig httpd on\n```\n\n###\
    \ To enable at specific run level\n\n```\n# chkconfig service_name --level 35\n\
    ```\n\n### To disable service for 2, 3, 4, 5 runlevel\n\n#### Syntax\n```\n# chkconfig\
    \ service_name off\n```\n\n#### Example\n```\nchkconfig httpd off\n```\n\n###\
    \ To disable for specific run level\n\n#### Syntax\n```\n# chkconfig service_name\
    \ off --level 3\n```\n\n#### Example\n```\n# chkconfig service_name off --level\
    \ levelno\n```\n\n# Managing the services status\n\n### Determine status of service\
    \ whether it is running or not\n\n#### Syntax\n```\n# service service_name status\n\
    ```\n\n#### Example\n```\n# service vsftpd status\n```\n\n### Display status of\
    \ all services\n\n```\n# service --status-all\n```\n\n# Starting service\n\n####\
    \ Syntax\n```\n# service service_name start\n```\n\n#### Example\n```\n# service\
    \ httpd start\n```\n\n# Stopping service\n\n#### Syntax\n```\n# service service_name\
    \ stop\n```\n\n#### Example\n```\n# service httpd stop\n```\n\n# Restarting service\n\
    \n#### Syntax\n```\n# service service_name restart\n```\n\n#### Example\n```\n\
    # service httpd restart\n```\n\n# Install new service\n\nProcedure to install\
    \ new service:\n\n- 1. Install new service package\n   # yum install service_name\n\
    - 2. Configure the service to start automatically at startup\n   # chkconfig service_name\
    \ on\n- 3. Start the service\n   # service service_name start\n\n# Example\n```\n\
    # yum install vsftpd\n# chkconfig vsftpd on\n# service vsftpd start\n```\n\n#\
    \ Chapter 15\n\n# SSH\n\nSSH provides a secure channel over unsecure network in\
    \ client server architecture. SSH is a replacement of telnet, which is insecure\
    \ protocol. It allows secure channel to login and execute command securely because\
    \ all communication between client and server is encrypted.\n\n```\nssh -x user@hostname\n\
    ```\n\nwhenever ssh connection is made to system first time the public key of\
    \ remote system is stored locally so it is identity can be verified next time.\n\
    \n**Ctrl + d** or exit command will terminate ssh session.\n\nIf you are connecting\
    \ form MS windows client to Linux server you require third party software like\
    \ **putty**.\n\n# ssh key\n\nssh keys helps in identifying yourself to server\
    \ using public key cryptography and authentication. ssh keys are generated in\
    \ pair public and private key. The public is for sharing and private key is for\
    \ you must be kept safely. Server having public key can send challenge which can\
    \ only be answered by server holding private key. This allows password less login\
    \ to one server in this example redhat1 to redhat2.\n\n# Create keys on redhat1\n\
    ```\nroot@redhat1 ~]# ssh-keygen\n```\n\n# Copy public key from redhat1 to second\
    \ server redhat2\n```\nroot@redhat1 ~]# scp ~/.ssh/id_rsa.pub\n```\n\nOn second\
    \ server redhat2 create .ssh directory in home directory our case the user is\
    \ root its home directory is /root and change permissions.\n```\nroot@redhat2\
    \ ~]# mkdir .ssh\nroot@redhat2 ~]# chmod 700 .ssh\n```\n\nAppend the public key\
    \ file to authorized_keys file and change permissions.\n```\nroot@redhat2 ~]#\
    \ cat id_rsa.pub >> .ssh/authorized_keys\nroot@redhat2 ~]# chmod 644 .ssh/authorized_keys\n\
    ```\n\nNow try login form server i.e. redhat1 to second server i.e. redhat2 it\
    \ will not ask for password.\n```\nroot@redhat1 ~]# ssh root@redhat2\n```\n\n\
    # Chapter 16\n\n# VNC\n\nVNC Virtual Network Computing is graphical desktop sharing.\
    \ Used to get GUI desktop of Linux server remotely. In this VNC client is installed\
    \ on local machine, which is used to connect to VNC server installed on remote\
    \ server. To configure VNC on server whose desktop you want to share\n\n```\n\
    # yum install tigervnc-server\n```\n\n# Add user\n\nEdit /etc/sysconfig/vncserver\
    \ first change root to any other user you want to configure. Secondly remove -localhost\
    \ option to prevent VNC to connect remotely through ssh.\n```\nVNCSERVERS=\":1\"\
    \nVNCARGS=\"-geometry 800x600\"\n```\n\n# Set VNC password\n```\nvncpasswd\n```\n\
    \nStart and enable VNC service\n```\n# service vncserver start\n# chkconfig vncserver\
    \ on\n```\n\n# Install vncviewer on the remote machine\n```\nyum install tigervnc\n\
    ```\n\n# Connect on remote machine\n\nGo to Desktop of linux box open terminal\n\
    ```\nvncviewer username@servername:1\n```\n\n![](img/387d28290ba7703b955874e67d1b946227_0.png)\n\
    \n# Chapter 17\n\n# FTP\n\nFTP is file transfer protocol. It used to transfer\
    \ files between the computers on the network. It’s based on client server model.\
    \ There can be three type of client:\n\n- 1. GUI\n- 2. Web browser\n- 3. Command\
    \ line\n\nIn Redhat and derivatives distros vsftp (very secure FTP) Daemon is\
    \ used as FTP server.\n\n# Deploying vsftp\n\n### Install the package\n```\n#\
    \ yum install vsftpd\n```\n\n### Start the server\n```\n# service vsftpd start\n\
    ```\n\n### Enable the service to start at startup\n```\n# chkconfig vsftpd on\n\
    ```\n\n### Open the firewall\n```\n# system-config-firewall-tui\n```\n\nSelect\
    \ customize enable ftp > ok\n\n# Test from remote machine\n\n#### Syntax\n```\n\
    # sftp IP address or hostname\n```\n\nIt will ask for username and password use\
    \ linux username and password for server\n\n# To upload file on ftp prompt\n```\n\
    sftp>put file_name\n```\n\n```\nroot@redhat2 ~]# sftp redhat1\nConnecting to redhat1...\n\
    root@redhat1's password:\nsftp> pwd\nRemote working directory: /root\nsftp> cd\
    \ /etc/\nsftp> pwd\nRemote working directory: /etc\nsftp> get hosts\n```\n\n```\n\
    Fetching /etc/hosts to hosts\n/etc/hosts\n100% 84 0.1KB/s 00:00\nsftp> bye\n```\n\
    \n**Note** You can connect to ftp server anonymously. You can download and upload\
    \ files to /var/ftp directory.\nTo configure server to allow anonymous user edit\
    \ /etc/vsftpd/vsftpd.conf\n\n# Chapter 18\n\n# Web server\n\nA webserver is program,\
    \ which allows web browser clients to access web pages. it uses HTTP (Hypertext\
    \ Transfer Protocol). In RedHat and derivatives Apache HTTP server is used.\n\n\
    # Deploying http server\n\n### Install http server\n```\n# yum install httpd\n\
    ```\n\n### Start service\n```\n# service httpd start\n```\n\n### Enable the service\
    \ to start on boot\n```\n# chkconfig httpd on\n```\n\n# Default directory where\
    \ http keeps contents\n/var/www/html\n\n# Configuration file\n/etc/httpd/conf/http.conf\n\
    \n# Test\n\nCreate file in directory /var/www/html/index.html and Write\n\n# Hello\n\
    \nSave the file and exit\n\nOpen the firefox on the address bar write http://localhost\n\
    \nYou should see hello\n"
  mdcn: "\n\n# 管理服务和守护进程\n\n## 守护进程 (Daemons)\n\n守护进程是在后台运行且不进行交互的进程。守护进程会在预定的时间执行预定义的操作。通常守护进程在启动时运行并持续到关机。大多数守护进程的名字以\
    \ **d.** 结尾。\n\n# 服务 (Services)\n\n服务是位于 /etc/rc.d/init.d 目录下的初始化脚本。这些脚本用于管理守护进程。可以使用\
    \ start、stop、restart、status 和 reload（重载）等参数调用服务脚本来管理守护进程。\n可以使用 **chkconfig service_name\
    \ on** 命令在系统启动时启动服务。\n\n# 运行级别 (Run level)\n\n运行级别是操作系统运行的运行或模式。每个运行级别都有一定数量的停止或启动的服务，从而控制机器的行为。共有七种种运行级别：\n\
    \n- 0 关机\n- 1 单用户模式\n- 2 未使用，用户可以使用\n- 3 无 GUI 的命令行多用户模式\n- 4 未使用，用户可以使用\n- 5\
    \ 带 GUI 的多用户模式\n\n# 命令\n\n### 检查当前运行级别\n\n```\n# runlevel\n```\n\n### 更改默认运行级别\n\
    \n在此示例中编辑 /etc/inittab 文件以更改命令行运行级别 3\n\n```\nId:3:default:\n```\n\n# 管理服务启动\n\
    \n### 列出所有服务及其在每个运行级别下的状态\n\n```\n# chkconfig --list\n```\n\n### 列出特定服务的当前设置\n\
    \n#### 语法\n\n```\n# chkconfig --list service_name\n```\n\n#### 示例\n\n```\n# chkconfig\
    \ --list vsftpd\n```\n\n### 在运行级别 2, 3, 4, 5 中启用服务\n\n#### 语法\n```\n# chkconfig\
    \ Service_name on\n```\n\n#### 示例\n```\n# chkconfig httpd on\n```\n\n### 在特定运行级别启用\n\
    \n```\n# chkconfig service_name --level 35\n```\n\n### 在 2, 3, 4, 5 运行级别中禁用服务\n\
    \n#### 语法\n```\n# chkconfig service_name off\n```\n\n#### 示例\n```\nchkconfig httpd\
    \ off\n```\n\n### 在特定运行级别禁用\n\n#### 语法\n```\n# chkconfig service_name off --level\
    \ 3\n```\n\n#### 示例\n```\n# chkconfig service_name off --level levelno\n```\n\n\
    # 管理服务状态\n\n### 确定服务是否正在运行\n\n#### 语法\n```\n# service service_name status\n```\n\
    \n#### 示例\n```\n# service vsftpd status\n```\n\n### 显示所有服务的状态\n\n```\n# service\
    \ --status-all\n```\n\n# 启动服务\n\n#### 语法\n```\n# service service_name start\n\
    ```\n\n#### 示例\n```\n# service httpd start\n```\n\n# 停止服务\n\n#### 语法\n```\n# service\
    \ service_name stop\n```\n\n#### 示例\n```\n# service httpd stop\n```\n\n# 重启服务\n\
    \n#### 语法\n```\n# service service_name restart\n```\n\n#### 示例\n```\n# service\
    \ httpd restart\n```\n\n# 安装新服务\n\n安装新服务的步骤：\n\n- 1. 安装新服务包\n   # yum install\
