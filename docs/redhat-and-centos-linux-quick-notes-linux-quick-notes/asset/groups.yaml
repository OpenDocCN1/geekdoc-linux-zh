    # usermod -U user1\n```\n\n# UID\n\n唯一用户标识（称为 UID）是系统中存在的每个用户的固定标识，对于 root 用户和普通用户，它都是固定的。\n\
    \n| 用户 | UID |\n| :--- | :--- |\n| root | 0 |\n| 系统用户 | 1 – 499 |\n| 普通用户 | 500\
    \ + |\n\n# 组 (Groups)\n\n我们创建的每个用户都属于一个组，所有组都有组 ID（GID）。可以在 `/etc/groups` 中找到所有可用组的列表，那里记录了这些组的所有用户成员。组共有两种类型：\n\
    \n- 主组 (primary group)\n- 辅助组 (secondary group)\n\n# 主组 (Primary group)\n\n这是你登录时应用的组，并且在你创建新文件和目录时默认使用的组。它的名称通常与用户名相同。用户的主组\
    \ ID 写入在 `/etc/passwd` 文件中对应用户的第三字段中。\n\n# 辅助组 (Secondary Group)\n\n这些是用户除主组之外所属的组。\n\
    \n# /etc/group\n\n```\n组名:shadow密码:GID:组内用户列表\n```\n\n# 示例\n\n```\nscience:x:1003:class1,class2\n\
    ```\n\n# 更改主组\n\n```bash\nusermod -g data1 user1\n```\n\n# 更改辅助组\n\n```bash\n\
    usermod -G data2 user1\n```\n\n# 添加新组\n\n```bash\ngroupadd groupname\n```\n\n\
    # 删除组\n\n```bash\ngroupdel groupname\n```\n\n# /etc/passwd\n\n存储用户信息\n\n# 格式\n\
    \n```\nusername:x:UID:GID:用户全名:home_\n```\n\n**用户名 (Username)** 最多 8 个字符。区分大小写。\n\
    \n**x** 密码存储在 `/etc/shadow` 文件中。\n\n**UID** 用户 ID。\n\n**GID** 组 ID。\n\n**shell\
    \ 账户** 通常设置为 `/bin/bash` 以提供对 bash shell 的访问，也可以是其他 shell，如 c shell 或 korn shell。\n\
    \n# 示例\n\n```\nroot:x:0:0:root:/root:/bin/bash\n```\n\n密码为 13 位加密。空条目（例如 ::）表示登录时不需要密码（这通常不是个好主意），`*`\
    \ 条目（例如 :*:`）表示该账户已禁用。\n\n**last_password_change** 自上次更改密码以来（自 1970 年 1 月 1 日起）经过的天数。\n\
    \n**Minimum (最小):** 更改密码前所需的天数（0 表示可以随时更改）。\n\n**Maximum (最大):** 密码过期后必须更改的天数（99999\
    \ 表示用户可以多年多年都保持密码不变）。\n\n**Warn (警告):** 密码即将过期前提醒用户的天数（7 天为一周）。\n\n**Inactive\
    \ (活动):** 密码过期后账户被禁用的天数。\n\n**Expire (过期):** 自 1970 年 1 月 1 日起账户被禁用的天数。\n\n# 示例\n\
    \n```\nroot:$6$YtTXd..cW9GYuWT9sNwX07B3i..11\n```\n\n# 第 5 章\n\n# NFS 网络文件系统\n\
    \nNFS 是一种基于服务器/客户端模式的文件共享文件系统。服务器共享的文件系统被挂载在客户端上。NFS 有四个版本：\n\n- 1. NFS V1\n-\
    \ 2. NFS V2\n- 3. NFS V3\n- 4. NFS V4\n\n其中 NFS V3 和 NFS V4 是较新的版本，V3 更安全且基于 UDP\
    \ 协议工作，而 V4 增加了通过防火墙工作的优势，并基于 TCP 协议工作。\n\n# /etc/exports\n\n用于将服务器上的文件系统导出到客户端的配置文件。\n\
    \n# 手动通过 /etc/exports 导出文件系统\n\n```bash\n# exportfs -i /user1\n```\n\n# 导出所有已导出的文件\n\
    \n```bash\n# exportfs -ua\n```\n\n# 在没有防火墙的服务器上配置 NFS\n\n禁用防火墙 System-config-firewall\
    \ 选择防火墙 ok ![](img/387d8290ba77003b955874e67d1b94687_0.png)\n\n```bash\n# service\
    \ iptables stop\n```\n\n# 安装包\n\n```bash\n# yum install nfs-utils\n# yum install\
