    # Chapter 7


    # Process and threads


    Every task done by Linux OS has process associated with it. Process has priority
    based on the context switches on them.


    Each process provide resources needed to execute the program.


    Each process starts with single thread known as primary thread. Process can have
    multiple threads.


    Process runs in foreground and background.


    # Commands


    | Command | Description |

    | --- | --- |

    | bg | Sends job to Background |

    | fg | Bring job to foreground |

    | jobs | Show current jobs |

    | kill | Stops the process |

    | ps | Show the process information |

    | & | if command ends with the & the shell execute the command in background and
    shell |


    # Bring command to foreground


    ```

    # fg

    ctrl + c

    ```


    # Check the running jobs


    ```

    # jobs

    ```


    # List the current running process


    ```

    # ps -ef|grep gcalctool

    ```


    ```

    # ps aux

    ```


    # Kill the process forcefully


    First check the process ID with ps -ef command then


    ```

    # kill -9 <process -id>

    ```


    # Monitoring the process with ps command


    ps command show the percentage of CPU & memory utilization of the process it is
    very useful if your machine is under performing. **ps** command gives you indication
    which process is hogging memory/CPU.


    # Process scheduling


    Scheduler is part of kernel, which select process to run next. The purpose is
    to run the processes according to priorities. To set the priority of running process
    nice and renice command is used which decide how longer or smaller CPU time is
    given to process.


    **nice** set the priority or niceness of new process.


    **renice** adjust nice value of running process niceness of -20 is highest priority
    and 19 is lowest priority. The default priority is 0.


    # Example


    ```

    # nice –n 19 cp–r /as /map

    ```


    # Commands show priorities of running processes


    ```

    # ps –al

    ```


    or


    ```

    # top

    ```


    # To change the priority


    ```

    # renice –n 10 <pid>

    ```


    **Note:** You need root privilege to change to higher priority.


    # Chapter 8


    # Automating tasks


    Redhat has utilities to automate the task which system administrator do regularly
    or at specified time. Following are the main utilities


    - cron

    - at

    - batch


    # Cron


    cron is daemon that can be used to schedule the execution of recurring tasks according
    to time, day of month, day of week.


    # Configuration file


    /etc/crontab


    # Command


    | Command | Description |

    | --- | --- |

    | crontab -l | List crontab entries |

    | crontab -e | Edit crontab |

    | crontab -r | Remove crontab |


    # Format


    | minutes | hours | Day_of_month | Month | Day_of_week | Command |


    # Where


    **Minutes** (from 0 to 59)


    **hours** (from 0 to 23)


    **day of month** (from 1 to 31)


    **month** (from 1 to 12)


    **day of week** (from 0 to 6) (0=Sunday)


    # To schedule a recurring task


    Edit crontab by giving command


    ```

    crontab -e

    ```


    Add entries at bottom of file press **i**


    Suppose you want to run backup script every night at 11:30


    ```

    30 23 * * * /myscripts/backup.sh

    ```


    Press [escape] and press : write **x** after that press [enter] to save the entry


    # at and batch


    crontab is used for recurring task but for one time tasks at specified time at
    and batch commands are used.


    To run at command rpm must be installed and atd service must be running.


    # Check Installation


    ```

    # rpm -q at

    ```


    # Install at package


    ```

    # yum install at

    ```


    # Start service


    ```

    # service start atd

    ```


    # Start command


    ```

    # at 4:00

    at > ls

    ctrl + d

    ```


    **Batch** command executes one time task when system average load decreases below
    0.8


    ```

    # at

    at > ls

    ctrl + d

    ```


    # Display list of pending jobs


    ```

    atq

    ```


    # Chapter 9


    # Log management


    Log files are very useful in troubleshooting and auditing system for authorized
    system access. In Redhat 6 some logs are controlled by rsyslog daemon. It is enhanced
    replacement of syslogd. It offers high-performance, great security features, modular
    design and support for transportation via the TCP or UDP protocols.


    rsyslog reads the file /etc/rsyslog.conf. rsyslogd can be configured via rsyslog.conf
    file. List of log files maintained by rsyslog can be found in the rsyslog.conf
    configuration file. Log files are usually located in the /var/log/ directory.


    # Configuration file


    /etc/rsyslog.conf


    # Sample rsyslog


    ```

    [root@redhat]# cat /etc/rsyslog

    ```


    # For more information


    /etc/rsyslog.conf


    # Sample rsyslog


    ```

    [root@redhat]# cat /etc/rsyslog

    ```


    # Sample rsyslog


    ```

    */log-level

    etc/rsyslog

    ```


    # #### MODULES


    ```

    $ModLoad imuxsock # provides local system logging

    ```


    ```

    $ModLoad imudp # provides UDP reception

    ```


    ```

    $ModLoad imtcp # provides TCP reception

    ```


    # #### GLOBAL DIRECTIVES


    $ActionFileDefaultTemplate

    $ActionFileFormat


    # Include all config in /etc/rsyslog.d.

    $IncludeConfig /etc/rsyslog.d/


    # #### RULES


    # Log all kernel messages to the console.

    * /dev/console


    # Log anything except mail of level info or higher.

    *.info;mail.none;cron.none;authpriv.none;daemon.none;user.none /var/log/messages


    # Log all mail messages in one place.

    mail* /var/log/secure

    authpriv.* /var/log/secure


    # Log cron stuff

    cron* /var/log/cron


    # Save news errors of level crit and higher in a special file.

    news.crit /var/log/spooler


    # Save boot messages also to boot.log

    local7.* /var/log/boot


    # Log filtering


    There is too much logging in the system if it is not filtered it becomes impossible
    to use logs. To filter the logs we use /etc/rsyslog.conf. It has two parameter
    facility and priority separated with dot.). Facility is name of process for you
    want to log and priority specify level of log like debug, info, notice, warning,
    err, alert, emerg you want to keep.


    # Example


    ```

    # The authpriv file has restricted access.

    authpriv.* /var/log/secure

    ```


    In the example where **authpriv** and **mail** is facility and * is priority mean
    all logs.


    # Rotating logs


    Logs needs rotation to avoid filling of file systems and make log more manageable.
    Once log file is rotated, it will be renamed with new file name. After certain
    time of rotation older log files will get deleted to save space.


    **logrotate** package manages automatically rotating of log files according to
    configuration in /etc/logrotate.conf


    # logwatch


    **logwatch** is program to analyze and reporting short digest via mail. Can be
    configured via /usr/share/logwatch/default.conf/logwa configuration file.


    # Install


    ```

    # yum install -y logwatch

    ```


    # Configure


    Setting configuration file /usr/share/logwatch/default.conf/logwa The email address
    to which daily digest(report) are sent


    # mailto =root


    # Example


    ```

    # Default person to mail reports to. Can be a local account or a

    # complete email address. Variable Print

    # should be set to No to

    # enable mail feature.

    MailTo = root

    ```


