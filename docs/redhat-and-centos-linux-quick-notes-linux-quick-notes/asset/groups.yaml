    \ -L 1G /dev/mapper/vg01-lv01\n```\n\nMount File system\n\n```\n[root@redhat1\
    \ ~]# mount /newfs\n```\n\n# LVM snapshot\n\nLVM snapshot is a point in time copy\
    \ of Logical Volume. The snapshot provides static view of original volume. Once\
    \ snapshot has been taken we can use this snapshot to backup as snapshot is static\
    \ and will not change unlike the original volume which is dynamic. The snapshot\
    \ volume should be enough to store the data that will change after snapshot has\
    \ been taken.\n\n# Create snapshot LV\n\nCheck the LV name and size of File System\
    \ for which you want to create snapshot\n\n```\n[root@redhat1 /]# df -hT /newfs\n\
    Filesystem      Type Size Avail Use% Mounted on\n/dev/mapper/vg01-lv1 ext4 1008M\
