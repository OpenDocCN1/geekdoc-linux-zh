  - '[PAGE 315]


    # Boot process


    Boot process of Linux


    +   1. BIOS

    2. Master Boot Record

    3. GRUB


    Uses /boot/grub/grub.conf to select the kernel image.


    +   4. Kernel

    1. Mounts the root file system as specified in the “root=” in grub.conf

    2. Kernel executes the /sbin/init program which is the first'
  - '[PAGE 316]


    program executed by the kernel


    +   3. initrd stands for Initial RAM Disk. initrd is used by kernel as temporary
    root file system until kernel is booted and the real root file system is mounted.
    It also contains drivers which are required to access hard disk and other necessary
    hardware.


    +   5. Init


    It reads /etc/inittab file to decide the Linux run level.'
  - '[PAGE 317]


    Following are the available run levels


    +   - 0 – halt

    - 1 – Single user mode

    - 2 – Multi user mode without network

    - 3 – Full multiuser mode

    - 4 – unused

    - 5 – GUI

    - 6 – reboot


    Typically you would set the default run level to either 3 or 5.


    # 6. Runlevel'
  - '[PAGE 318]


    Depending on Runlevel selected by inittab some services will start other will
    stop, the system will execute the programs from one of the following directories.


    | Run level 0 | /etc/rc.d/rc0.d/ |

    | Run level 1 | /etc/rc.d/rc1.d/ |

    | Run level 2 | /etc/rc.d/rc2.d/ |

    | Run level 3 | /etc/rc.d/rc3.d/ |'
  - '[PAGE 319]


    | Run level 4 | /etc/rc.d/rc4.d/ |

    | Run level 5 | /etc/rc.d/rc5.d/ |

    | Run level 6 | /etc/rc.d/rc6.d/ |


    Under the /etc/rc.d/rc*.d directories, you would see programs that start with
    S and K which are symbolic link to actual scripts in /etc/rc.d/init.d/ directory.
    There are numbers right next to S and K in the program names. Those are the sequence
    number in which the'
  - '[PAGE 320]


    programs should be started or killed. For example, S82sendmail is to start the
    sendmail daemon at sequence number of 82.'
