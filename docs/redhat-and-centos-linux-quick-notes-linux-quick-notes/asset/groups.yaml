    \ 0 |\n| Allocated PE | 0 |\n| PV UUID | EQ7ElZ-WiGK-Z0m5-5gSN-gP95-MFSk-pKyTvS\
    \ |\n\n# 创建卷组 (VG)\n\n```\n**vgcreate VG_name PV_name**\n```\n\n[root@redhat1\
