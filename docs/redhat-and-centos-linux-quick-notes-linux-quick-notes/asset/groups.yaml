    [root@redhat1 ~]# mkdir /test1\n```\n\n# 在 /etc/fstab 中添加目\n\n```\n[root@redhat1\
    \ ~]# vi /etc/fstab\n/dev/mapper/vg_redhat1-lv_swap swap\nswap defaults 0 0\n\
    tmpfs /dev/shm tmpfs\ndefaults 0 0\ndevpts /dev/pts devpts\ngid=5,mode=620 0 0\n\
    sysfs /sys sysfs\ndefaults 0 0\nproc /proc proc\ndefaults 0 0\n/dev/cdrom /cdrom\
    \ iso9660\nro 0 0\n/dev/sdb1 /test1 ext4\ndefault 0 2\n```\n\n其中 /dev/sdb1 是设备，/test1\
    \ 是挂载点，ext4 是分区类型，0 为 dump，2 为 fsck 顺序。\n\n# 第 22 章\n\n## 交换空间 (Swap space)\n\n\
    交换空间在 Linux 和 UNIX 中用于释放物理内存。不活动的数据会被写入较慢的存储（即硬盘）。写入不活动数据的区域称为交换空间。\n\n## 添加交换空间\n\
    \n创建分区\n\n```\n[root@redhat1 ~]# fdisk /dev/sdb\n\nWARNING: DOS 兼容模式已弃用。强烈建议\n\
    关闭该模式（命令 'c'）并将显示单位更改为扇区（命令 'u'）。\n\nCommand (m for help): n\nCommand action\n\
    \  e extended\n  p primary partition (1-4)\np\nPartition number (1-4): 2\nFirst\
    \ cylinder (307-6132, default 307):\nUsing default value 307\nLast cylinder, +cylinders\
    \ or +size{K,M,G}\n(307-6132, default 6132): +1G\n```\n\n通过对选定的分区按下 t 将类型更改为 82，即\
    \ linux swap\n\n```\nCommand (m for help): t\nPartition number (1-4): 2\nHex code\
    \ (type L to list codes): 82\nChanged system type of partition 2 to 82\n(Linux\
    \ swap / Solaris)\n```\n\n# 检查分区\n\n```\nCommand (m for help): p\nDisk/dev/sdb:\
    \ 21.5 GB, 21474836480 bytes\n171 heads, 40 sectors/track, 6132 cylinders\nUnits\
    \ = cylinders of 6840 * 512 = 3502080 bytes\nSector size (logical/physical): 512\
    \ bytes / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisk identifier:\
    \ 0xdec2ee90\n```\n\n| Device Id | Boot System | Start | End | Blocks |\n|---|---|---|---|---|\n\
    | /dev/sdb1 | 83 Linux | 1 | 307 | 1048576 |\n| /dev/sdb2 | 82 Linux swap / Solaris\
    \ | 307 | 614 | 1050280 |\n\n按下 w 将分区表写入磁盘\n\nCommand (m for help): w\nThe partition\
    \ table has been altered!\n\nCalling ioctl() to re-read partition table.\nSyncing\
    \ disks.\n\n```\n\n**mkswap /sdb2** 其中 sdb2 是将作为交换的分区的名称。\n\n```\n[root@redhat1\
    \ ~]# mkswap /sdb2\nSetting up swap version 1, size = 1050276 KiB\nno label, UUID=c1f98067-843-5f09dba6\n\
    ```\n\n在 /etc/fstab 中添加条目\n\n```\n[root@redhat1 ~]# cat /etc/fstab\nsysfs /sys\
    \ sysfs\ndefaults 0 0\nproc /proc proc\ndefaults 0 0\n/dev/cdrom /cdrom iso9660\n\
    ro 0 0\n/dev/sdb1 /test1 ext4\ndefault 0 2\n```\n\n使用 swapon -a 激活交换\n\n```\n\
    [root@redhat1 ~]# swapon -s\n```\n\n| Filename | Type | Size | Priority |\n|---|---|---|---|\n\
    | /dm-1 | partition | 2097144 | |\n| /sdb-2 | partition | 1050272 | |\n\n# 禁用交换空间\n\
    \n```\n[root@redhat1 ~]# swapoff sdb2\n```\n\n# 第 23 章\n\n## 逻辑卷 (Logical Volume)\n\
    \n在前面的节中我们学习了如何创建分区，但也可以创建 LVM（逻辑卷管理器）。LVM 管理分配的空间比普通分区更高级。LVM 具有以下优点：\n- 动态扩展文件系统\n\
    - 动态缩小文件系统\n- 动态磁盘\n- 镜像\n- 快照\n\n## LVM 中的术语\n\n## 物理卷 (Physical Volume)\n\n\
    物理卷 (PV) 是块设备或整个硬盘。使用 fdisk 创建 LVM 类型分区。\n\n## 卷组 (Volume Groups)\n\n将一个或多个物理卷组合成卷组\
    \ (VG)。\n\n## 物理区 (Physical Extent)\n\n物理卷空间被划分为固定大小的单位称为物理区（PE），它是同一 VG 中所有物理卷的单位。\n\
    \n## 逻辑区 (Logical extent)\n\nPE 的映射形成逻辑区（LE）。默认情况下一个 PE 映射到一个 LE。在镜像情况下，可以将多个\
    \ PE 映射到一个 LE。\n\n## 逻辑卷 (Logical Volume)\n\n逻辑卷是逻辑区的组。逻辑卷不受限于磁盘大小。此外，硬件存储层是隔离。\n\
    \n# 使用新磁盘创建文件系统\n\n创建物理卷 (PV)\n\n使用命令 **pvcreate device_name** 其中 *device_name*\
    \ 是用 fdisk 创建的设备\n\n```\n[root@redhat1 ~]# fdisk /dev/sdb\nWARNING: DOS 兼容模式已弃用。强烈建议\n\
    关闭该模式（command 'c'）并将显示单位更改为扇区（command 'u'）。\n\nCommand (m for help): n\nCommand\
    \ action\n  e extended\n  p primary partition (1-4)\np\nPartition number (1-4):\
    \ 3\nFirst cylinder (615-6132, default 615):\nUsing default value 615\nLast cylinder,\
    \ +cylinders or +size{K,M,G}\n(615-6132, default 6132): +5G\n\nCommand (m for\
    \ help): t\nPartition number (1-4): 3\nHex code (type L to list codes): 8e\nChanged\
    \ system type of partition 3 to 8e\n(Linux LVM)\n```\n\n```\nCommand (m for help):\
    \ p\nDisk /dev/sdb: 21.5 GB, 21474836480 bytes\n171 heads, 40 sectors/track, 6132\
    \ cylinders\nUnits = cylinders of 6840 * 512 = 3502080 bytes\nSector size (logical/physical):\
    \ 512 bytes / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisk\
    \ identifier: 0xdec2ee90\n```\n\n| Device | Boot System | Start | End | Blocks\
    \ Id |\n|---|---|---|---|---|\n| /dev/sdb1 | Linux | 1 | 307 | 1048576 83 |\n\
    | /dev/sdb2 | | 307 | 614 | 1050280 82 |\n| /dev/sdb3 | | 615 | 2148 | 5246280\
    \ |\n\nCommand (m for help): w\nThe partition table has been altered!\n\nCalling\
