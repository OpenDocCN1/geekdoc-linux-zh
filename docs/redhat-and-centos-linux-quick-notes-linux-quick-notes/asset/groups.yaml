  mdcn: '


    重启后你将看到登录提示


    # 将Windows电脑连接到Linux机器


    - 1. 从 http://www.chiark.greenend.org.uk/~/ 下载 putty

    2. 在Windows电脑上安装 putty


    # 3. 安装后启动 putty


    ![](img/387d28290ba77003b955874e67d1b946_40_0.png)


    4. 输入Linux机器的IP地址和会话名称并


    - 5. 双击会话名称连接到Linux机器。


    # 第 3 章


    # 网络


    网络允许不同的机器互连。你需要在电脑上网卡才能连接。每个网卡都有一个物理地址，称为媒体访问控制地址（MAC地址）。MAC地址工作在 OSI 模型的第二层。网络接口卡的制造商分配
    MAC 地址。为了访问网卡，我们为网卡分配 IP 地址，它工作在 OSI 模型的第三层。不同网络上的主机可以通过第三层进行连接。由于 IP 地址仍然是数值，因此很难记忆，而且存在
    IP 地址可能会发生。为了方便起见，我们使用**主机名 (hostname)**。


    # OSI 七层与 TCP 映射


    | OSI 模型 | TCP 模型 | 应用程序 | 地址 |

    |---|---|---|--|

    | 7:应用层 | 应用层 | HTTP / Telnet / SSH | 应用程序 DNS, DHCP, ntp, H |

    | 6:表示层 | | SSL / MIME | |

    | 5:会话层 | | Sockets 和远程过程调用 (RPC) | |

    | 4:传输层 | 传输层 | 传输控制协议 | TCP/UDP* |

    | | | (TCP) | |

    | 3:网络层 | 互联网层 | 际协议 (IP) | IP4, IP6, ICMP |

    | 2:数据链路层 | 网络访问层 | 以太网 / 帧继 | MAC地址, ARP |

    | 1:物理层 | | IEEE 802.x | 以太网 |


    # 检查 IP 地址和路由表


    # 显示 IP 地址


    ```

    # ip addr show

    ```


    或者


    ```

    # ifconfig -a

    ```


    # 显示链路状态


    ```

    # ip link show

    ```


    # 显示路由表


    ```

    # ip route

    ```


    或者


    ```

    # netstat -rn

    ```


    ```

    # hostname

    ```


    首先修改 /etc/sysconfig/network 文件，并将 hostname更改为你的新主机名，在本例中为 redhat1。


    ```

    # vi /etc/sysconfig/network

    ```


    ```

    NETWORKING=yes

    HOSTNAME=redhat1

    ```


    下一步是修改 /etc/hosts 文件


    | 127.0.0.1 redhat1 localhost.localdomain |

    | localhost |


    # 设置 DNS 名称解析


    每当你使用主机名而不是 IP 地址来 ping 或连接 Linux 主机时，你有多种选项将主机名解析为 IP 地址。


    - 本地文件，即 /etc/hosts

    - DNS 服务器

    - NIS


    # /etc/hosts


    使用本地文件 /etc/hosts 进行主机名到 IP 地址的映射，可以存储主机名及其对应 IP 地址的列表，你不需要查找 DNS 服务器。如果你因为范围或安全原因连接到有限的服务器，不依赖
    DNS 服务器也非常有用。


    # 格式


    | IP_地址 | 主机名别名 |

    |---|---|


    # 示例


    | 127.0.0.1 | redhat1 |

    | localhost | |

    | ::1 | redhat1 localhost |

    | 192.168.228.129 | redhat2 |


    # 使用域名服务器进行名称解析


    # /etc/resolv.conf


    为了将主机名解析为 IP 地址，系统会读取名为 resolv.conf 的文件。你需要将 DNS 服务器的 IP 地址放入此文件中。通常情况下，你需要一个名称服务器，但如果你想要冗余，可以包含最多三个。


    如果列表中的第一个没有响应，系统将尝试使用列表中的下一个进行解析，依此类推。


    编辑 /etc/resolv.conf 以添加名称服务器列表，如下：


    ```

    nameserver 8.8.8.8

    nameserver 8.8.8.9

    nameserver 1.2.3.6

    ```


    # 修改主机名解析顺序


    /etc/nsswitch.conf


    如果你的服务器中有 hosts 文件且 resolv.conf 中有 DNS 配置，每当你进行主机名解析时，系统都会查找本地文件 (/etc/hosts)
    寻找主机名及其相应的 IP 地址条目。如果没有条目，它将查找 /etc/resolv.conf 文件中的 DNS 配置。如果没有 DNS 配置，它将检查 NIS
    配置。然而，你可以通过更改 /etc/nsswitch.conf 来改变这种行为。


    ```

    vi /etc/nsswitch.conf

    #hosts: db files nisplus nis dns

    hosts:      files dns

    ```


    在本例中，搜索顺序是 files（即 /etc/hosts），然后是 DNS 服务器。


    # 使用 GUI 修改网络


    ![](img/387d28290ba77003b955874e67d1b946_40_0.png)


    右键点击网络 > 编辑 > 选择有线选项卡 > 编辑 IPv4 设置![](img/387d28290ba77003b955874e67d1b946_40_0.png)
    改为手动添加地址、子掩码、网关、DNS 服务器。


    | DEVICE=eth0 |

    BOOTPROTO=static |

    IPADDR=192.168.1.1 |

    NETMASK=255.255.255.0 |

    GATEWAY=192.168.1.254 |

    DNS=8.8.8.8,8.8.4.4 |

    ONBOOT=yes |


    '
