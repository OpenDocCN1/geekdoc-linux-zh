    \ **pvcreate device_name** 创建 PV 其中 *device_name* 是用 fdisk 创建的设备\n\n```\n[root@redhat1\
    \ ~]# pvcreate /dev/sdb3\nPhysical volume \"/dev/sdb3\" successfully created\n\
    [root@redhat1 ~]# pvsdisplay /dev/sdb3\n\"/dev/sdb3\" 是一个大小为 \"5.00 GiB\" 的新物理卷\n\
    --- NEW Physical volume ---\nPV Name       /sdb3\nVG Name\nPV Size       5.00\
