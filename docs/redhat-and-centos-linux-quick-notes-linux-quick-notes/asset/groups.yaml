    \ 这样的第三方软件。\n\n# ssh 密钥\n\nSSH 密钥有助于使用公钥加密和身份验证向服务器识别您的身份。SSH 密钥成公钥和私钥对生成。公钥用于共享，私钥必须妥善保存。持有公钥的服务器可以发送挑战，只有持有私钥的服务器才能回答。这允许在本示例中从\
    \ redhat1 到 redhat2 的无密码登录。\n\n# 在 redhat1 上创建密钥\n```\nroot@redhat1 ~]# ssh-keygen\n\
    ```\n\n# 将公钥从 redhat1 复制到第二个服务器 redhat2\n```\nroot@redhat1 ~]# scp ~/.ssh/id_rsa.pub\n\
    ```\n\n在第二个服务器 redhat2 的家目录下创建 .ssh 目录（在本例中用户是 root，其家目录是 /root）并更改权限。\n```\n\
    root@redhat2 ~]# mkdir .ssh\nroot@redhat2 ~]# chmod 700 .ssh\n```\n\n将公钥文件追加到\
    \ authorized_keys 文件并更改权限。\n```\nroot@redhat2 ~]# cat id_rsa.pub >> .ssh/authorized_keys\n\
    root@redhat2 ~]# chmod 644 .ssh/authorized_keys\n```\n\n现在尝试从服务器（即 redhat1）登录到第二个服务器（即\
    \ redhat2），它不会提示密码。\n```\nroot@redhat1 ~]# ssh root@redhat2\n```\n\n# 第 16 章\n\
    \n# VNC\n\nVNC（虚拟网络计算）是图形化桌面共享。用于远程获取 Linux 服务器的 GUI 桌面。在 VNC 中，VNC 客户端安装在本地机器，用于连接到安装在远程服务器上的\
    \ VNC 服务器。要在想要共享桌面的服务器上配置 VNC：\n\n```\n# yum install tigervnc-server\n```\n\n\
    # 添加用户\n\n编辑 /etc/sysconfig/vncserver，首先将 root 更改为您想要配置的其他用户。其次，移除 -localhost\
    \ 选项以防止 VNC 通过 ssh 远程连接。\n```\nVNCSERVERS=\":1\"\nVNCARGS=\"-geometry 800x600\"\
    \n```\n\n# 设置 VNC 密码\n```\nvncpasswd\n```\n\n# 启动并启用 VNC 服务\n```\n# service vncserver\
