    \ to boot the selected OS, 'e' to edit the\ncommands before booting, 'a' to modify\
    \ the kernel arguments\nbefore booting, or 'c' for a command-line.\n\n< crashkernel=auto\
    \ KEYBOARDTYPE=pc us=rd_NO_UM high quiet single\n```\n\n4. press enter\n"
