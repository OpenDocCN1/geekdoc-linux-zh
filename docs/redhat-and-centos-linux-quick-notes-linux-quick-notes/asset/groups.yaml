    # # Installing packages with RPM command


    ## RPM


    RPM stands for Red Hat Package Manager. RPM packages have .rpm extension. rpm
    command is used to manage software which include list, install, update and remove.
    RPM is usually used to install packages which has been downloaded locally.


    ## Commands


    ### Install


    # Syntax


    ```bash

    rpm -ihv package_name

    ```


    # Example


    ```bash

    [root@redhat1]# rpm -ihv zip-3.0-el6.x86_64.rpm

    Preparing...

    ######################################

    [100%]zip

    ######################################

    [100%]

    ```


    # Update


    # Syntax


    ```bash

    rpm -Uhv package_name

    ```


    # Example


    ```bash

    [root@redhat1]# rpm -Uhv zip-3.0-el6.x86_64.rpm

    ```


    # Remove


    # Syntax


    ```bash

    rpm -ev package_name

    ```


    # Example


    ```bash

    [root@redhat1]# rpm -ev zip

    ```


    # Query all installed packages


    # Syntax


    ```bash

    rpm -qa

    ```


    # Display detailed information about package


    # Syntax


    ```bash

    rpm -qi package_name

    ```


    # Example


    ```

    [root@redhat1]# rpm -qi zip

    Name : zip | Release: (not relocatable)

    Version : 3.0 | Vendor : Red Hat, Inc.

    Release : el6 | Build Date : Mon 24 May 2010 Host : redhat.com

    Group : Applications/Archiving | Source : zip-3.0-el6.rpm

    Size : 82312 | License : BSD

    Signature : RSA/Tue 17 Aug 2010

    ```


    # Repository


    To install additional package or update existing package you require repository.
    It is warehouse all Linux software. Yum repository can hold RPM packages locally
    like CDROM , directory on local disk or remotely like FTP, HTTP or HTTPS. The
    configuration files for name, location, status etc of repository is there in /etc/yum.repos.d/
    directory.


    The configuration file present in the /etc/yum.repos.d/ directory have following
    fields


    **Repository ID** - Single word unique repository ID


    **Name** - Name of the repository (example: name=CD_media)


    **Baseurl** - URL to the repodata directory.

    You can use ftp://link, http://link, https://link if repository is located remotely
    and file://path if repository is located locally (example file:///mnt/ for mnt
    locally)


    **Enabled** - Enable/Disable repository (example: enabled=1 to enable or enable=0
    to disable)


    **Gpgcheck** - Enable/disable GPG signature checking (example: gpgcheck=1)


    **Gpgkey** - location of GPG key


    # Defining repository


    1. Create file /etc/yum.repos.d/<name>.repo

    2. Add following contents


    ```

    [Repository_ID]

    name=name_of_repository

    baseurl=http://location

    enabled=1

    gpgcheck=0

    ```


    # Using Red Hat DVD or local directory as repository


    Mount the RHEL 6 installation ISO to a directory like /mnt, e.g.:


    ```bash

    # mount -o loop RHEL6.1.iso /cdrom

    ```


    If you use DVD media, you can mount like below.


    ```bash

    # mount -o ro /dev/cdrom1 /cdrom

    ```


    Where /dev/cdrom1 is DVDROM device you may have different one.


    Create file name cdrom.repo in /etc/yum.repos.d/ that should look like the following
    where /cdrom is directory where cdrom is mounted


    ```

    [installmedia]

    name=Red Hat Enterprise Linux 6.5

    baseurl=file:///cdrom/

    gpgcheck=0

    enabled=1

    ```


    Clear the related caches by yum clean all and subscription-manager clean


    ```bash

    # yum clean all

    # subscription-manager clean

    ```


    Now check the repository


    # # yum repolist all

