  md: '# sosreport


    The“sosreport” is a tool to collect troubleshooting data on RHEL/CentOS systems.
    It generates report of configuration of Linux system and most important logs in
    tarball compressed format which can be sent to Redhat for support related to any
    problem or performance issues.


    # Install package


    ```

    # yum install sos

    # yum install abrt-cli

    ```


    # Generate report


    ```

    # sosreport

    ```'
