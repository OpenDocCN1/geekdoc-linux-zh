  md: '# # Selinux


    Selinux is **Security Enhanced Linux**. Selinux is kernel module that improves
    the Linux server security. This is one of the solution for implementation of Access
    Control in Linux.


    Selinux implements what is known as **MAC** Mandatory Access Control. Selinux
    is set of security rules which determine which process can access which file,
    directory or port etc. Selinux policy to access process, directoy , files is called
    as context. One goal of Selinux'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'is to protect data and system. Selinux has three forms of access control:


    +   1. Enforcing

    2. Permissive

    3. Disabled


    # Enforcing


    Selinux denes access based on selinux policy rules.


    # Permissive


    Selinux does not deny access but deniels are logged for the action that wouldldd'
  merge: -1
  pgno: 253
