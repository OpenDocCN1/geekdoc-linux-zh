- img_proc: true
  md: '# Introduction


    Linux is UNIX like Operating system. Linux is an open source project started by
    Linus Torvalds in 1991. There are thousands of Linux distributions in the market,
    but broadly can be classified on their root distribution for example Centos, Oracle
    and Scientific Linux based on Redhat, Debian based distributions like Ubuntu,
    Mint etc. The prominent player in free Linux are Ubuntu, Debian, Fedora, Opensuse
    etc. Redhat and SUSE is major player in'
  merge: -1
  pgno: 17
- img_proc: true
  md: non- free enterprise Linux distribution. Redhat and SUSE is RPM package based
    distribution where as Debian based distribution are of DEB packaging.
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Fedora and Redhat


    Fedora is free distribution and community project sponsored by Redhat. Fedora
    is upstream for Redhat enterprise Linux. Fedora is test bed for new features,
    which may get incorporate in upcoming Redhat Linux version. Main difference between
    the Fedora Linux and Redhat Enterprise Linux is support and life cycle of the
    product. Redhat is commercially supported product whereas Fedora is community
    supported. Redhat Enterprise Linux has'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'life cycle of few years and supported up to 10 years but in case of Fedora
    new release come out after every 6 months and gets update for 13 months only.
    Redhat provides service level agreements, certification of hardware and software,
    which is important for enterprise organization.


    Oracle Linux, Centos Linux and Scientific Linux distributions are derived from
    the sources of Red Hat Enterprise Linux. Provides same software as Redhat but
    without support from Redhat.'
  merge: -1
  pgno: 20
