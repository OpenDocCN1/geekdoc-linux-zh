  md: '# Network


    Network allows to inter connect different machine. You require network card on
    computer to connect. Every network card has physical address called as media access
    control address (MAC address). MAC address works on layer 2 of OSI model. Manufacturer
    of network interface card assigns MAC addresses. To access the network card we
    assign IP address to network card, which works on layer 3 of OSI model. Hosts
    on different network can connect'
  merge: -1
  pgno: 43
- img_proc: true
  md: using layer3. As IP address are still numeric value it is difficult to remember
    more over there is possibility of IP address may change. To make life easy we
    use **hostname**.
  merge: -1
  pgno: 44
- img_proc: true
  md: '# # Seven layer of OSI and TCP Mapping


    | OSI Model | TCP Model | Application | Address |

    |---|---|---|--|

    | 7:Application layer | Application Layer | HTTP / Telnet / SSH | Applications
    DNS, DHCP,ntp,H |

    | 6:Presentation layer | | SSL / MIME | |

    | 5: Session layer | | Sockets and Remote Procedure Call (RPC) | |

    | 4: Transport layer | Transport layer | Transmission Control Protocol | TCP/UDP*
    |'
  merge: -1
  pgno: 45
- img_proc: true
  md: '| | | (TCP) | |

    |---|---|---|--|

    | 3: Network layer | Internet layer | Internet Protocol (IP) | IP4, IP6, ICMP
    |

    | 2: Data link layer | Network Access Layer | Ethernet / Frame Relay | MAC address,
    ARP |

    | 1: Physical layer | | IEEE 802.x | Ethernet |'
  merge: -1
