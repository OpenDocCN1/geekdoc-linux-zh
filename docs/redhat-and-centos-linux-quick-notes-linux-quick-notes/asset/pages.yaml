- img_proc: true
  md: '# # Setting Up the DNS Name Resolution


    Whenever you write hostname instead of IP address to ping or to connect Linux
    host. You have multiple option to resolve hostname to IP address.


    +   - Local file i.e. /etc/hosts

    - DNS server

    - NIS


    # ## /etc/hosts


    Using local file /etc/hosts for hostname to IP address mapping provides ability'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'to store list of hostname to their respective IP address you don’t require
    to look for DNS server. It is also useful if you are connecting to limited servers
    due scope or security reason you do not have to depend on DNS server.


    # Format


    | IP_address | hostname aliases |


    # Example


    | 127.0.0.1 | redhat1 |

    | localhost | |

    | ::1 | redhat1 localhost |

    | 192.168.228.129 | redhat2 |'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Using Domain Name Server for name resolution


    # /etc/resolv.conf


    To resolve hostnames to IP addresses system reads a file called resolv.conf. You
    need to put your DNS server IP addresses in this file. Generally, you need one
    name server, but you can include up to three if you want redundancy.


    If the first one on the list is not responding, system tries to resolve'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'against the next one on the list, and so on.


    Edit /etc/resolv.conf to add list of name servers, like this:


    ```

    nameserver 8.8.8.8

    nameserver 8.8.8.9

    nameserver 1.2.3.6

    ```'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Changing order for hostname resolution


    /etc/nsswitch.conf


    If hosts file and DNS configuration is there in resolv.conf in your server, Whenever
    you do hostname resolution the system looks for local file (/etc/hosts) for entry
    of hostname and respective IP address. If there is no entry, it looks for /etc/resolv.conf
    file for DNS configuration. If there is no DNS configuration also then it will
    check for NIS configuration. However,'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'you can change this behavior by changing /etc/nsswitch.conf


    ```

    vi /etc/nsswitch.conf

    #hosts: db files nisplus nis dns

    hosts:      files dns

    ```


    In this example search sequence is first files means /etc/hosts then DNS server.'
  merge: -1
  pgno: 55
