- img_proc: true
  md: '# LVM snapshot


    LVM snapshot is a point in time copy of Logical Volume. The snapshot provides
    static view of original volume. Once snapshot has been taken we can use this snapshot
    to take backup volume as snapshot is static copy and it will not change while
    backup is happening unlike the original volume which is dynamic.


    The snapshot volume size should be enough to store the data that will change after
    snapshot has been taken. the volume will store only changes after the snapshot
    has been taken.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Create snapshot LV


    Check the LV name and size of File System for which you want to create snapshot


    ```

    [root@redhat1 /]# df -hT /newwfs

    Filesystem      Type Size Used Avail Use%

    Mounted on

    /dev/mapper/vg01-lv1 ext4 1008M 34M 924M 4% /newwfs

    ```


    Check you have space at least equivalent to 10% of file system you want to take
    snapshot available on the VG where original LV is located


    ```

    # vgdisplay vg01

    ```'
