    ### Linux


    ```

    # cd /usr/src/linux

    # make mrproper         # 清理所有内容，包括配置文件

    # make oldconfig        # 如果存在，则复用旧的 .config

    # make menuconfig       # 或 xconfig（Qt）或 gconfig（GTK）

    # make                  # 创建压缩的内核镜像

    # make modules          # 编译模块

    # make modules_install  # 安装模块

    # make install          # 安装内核

    # reboot

    ```


    ### FreeBSD


    可选地，使用 `csup`（自 FreeBSD 6.2 起）更新源代码树（位于 /usr/src）：


    ```

    # csup <supfile>

    ```


    我使用以下 supfile：


    ```

    *default host=cvsup5.FreeBSD.org  # www.freebsd.org/handbook/cvsup.html#CVSUP-MIRRORS

    *default prefix=/usr

    *default base=/var/db

    *default release=cvs delete tag=RELENG_7

    src-all

    ```


    要修改并重新构建内核，请将通用配置文件复制为一个新名称，并根据需要编辑（你也可以直接编辑 `GENERIC` 文件）。如果构建因中断而需要重新开始，请在 `make`
    命令中添加 `NO_CLEAN=YES` 选项，以避免清理已构建的对象。


    ```

    # cd /usr/src/sys/i386/conf/

    # cp GENERIC MYKERNEL

    # cd /usr/src

    # make buildkernel KERNCONF=MYKERNEL

    # make installkernel KERNCONF=MYKERNEL

    ```


