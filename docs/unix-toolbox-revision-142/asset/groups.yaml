    \ 或 FreeBSD 的 /etc/login.conf 中为所有用户更改。默认 umask 通常为 022。umask 从 777 中减去，因此 umask\
    \ 022 得到权限 755。\n\n```\n1 --x execute          # Mode 764 = exec/read/write |\
    \ read/write | read\n2 -w- write            # For:      |-- Owner --|  |- Group\
    \ -|  |Oth|\n4 r-- read             \nugo=a                  u=user, g=group,\
    \ o=others, a=*everyone\n```\n\n```\n# chmod [OPTION] MODE[,MODE] FILE      #\
    \ MODE is of the form [ugoa]*([+-=])[(rwxXst])\n# chmod 640 /var/log/maillog \
    \          # Restrict the log -rw-r-----\n# chmod u=rw,g=r,o= /var/log/maillog\
    \   # Same as above\n# chmod -R o-r /home/*                 # Recursive remove\
