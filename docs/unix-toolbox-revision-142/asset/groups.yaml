    ### 1.9 Repair grub


    So you broke grub? Boot from a live cd, [find your linux partition under /dev
    and use fdisk to find the linux partition] mount the linux partition, add /proc
    and /dev and use grub-install /dev/xyz. Suppose linux lies on /dev/sda6:


    ```

    # mount /dev/sda6 /mnt          # mount the linux partition on /mnt

    # mount --bind /proc /mnt/proc   # mount the proc subsystem into /mnt

    # mount --bind /dev /mnt/dev     # mount the devices into /mnt

    # chroot /mnt                    # change root to the linux partition

    # grub-install /dev/sda          # reinstall grub with your old settings

    ```


    ## 2 PROCESSES


    | Listing | Priority | Background/Foreground | Top | Kill |

    |---------|----------|----------------------|-----|------|

    | (p7) | (p7) | (p8) | (p8) | (p8) |


    ### 2.1 Listing and PIDs


    Each process has a unique number, the PID. A list of all running process is retrieved
    with ps.


    ```

    # ps -auxefw                 # Extensive list of all running process

    ```


    However more typical usage is with a pipe or with pgrep:


    ```

    # ps axww | grep cron

    586  ??  Is   0:01.48 /usr/sbin/cron -s

    # ps axjf                   # All processes in a tree format (Linux)

    # ps aux | grep ''ss[h]''     # Find all ssh pids without the grep pid

    # pgrep -l sshd             # Find the PIDs of processes by (part of) name

    # echo $$                   # The PID of your shell

    # fuser -va 22/tcp          # List processes using port 22 (Linux)

    # pmap PID                  # Memory map of process (hunt memory leaks) (Linux)

    # fuser -va /home           # List processes accessing the /home partition

    # strace df                 # Trace system calls and signals

    # truss df                  # same as above on FreeBSD/Solaris/Unixware

    ```


    ### 2.2 Priority


    Change the priority of a running process with renice. Negative numbers have a
    higher priority, the lowest is -20 and "nice" have a positive value.


    ```

    # renice -5 586        # Stronger priority

    586: old priority 0, new priority -5

    ```


    Start the process with a defined priority with nice. Positive is "nice" or weak,
    negative is strong scheduling priority. Make sure you know if /usr/bin/nice or
    the shell built-in is used (check with # which nice).


    ```

    # nice -n -5 top       # Stronger priority (/usr/bin/nice)

    # nice -n 5 top         # Weaker priority (/usr/bin/nice)

    # nice +5 top           # tcsh builtin nice (same as above!)

    ```


    While nice changes the CPU scheduler, another useful command ionice will schedule
    the disk IO. This is very useful for intensive IO application (e.g. compiling).
    You can select a class (idle - best effort - real time), the man page is short
    and well explained.


    ```

    # ionice c3 -p123          # set idle class for pid 123 (Linux only)

    # ionice -c2 -n0 firefox   # Run firefox with best effort and high priority

    # ionice -c3 -p$$          # Set the actual shell to idle priority

    ```


    The last command is very useful to compile (or debug) a large project. Every command
    launched from this shell will have a lower priority. $$ is your shell pid (try
    echo $$).


