    # dvd+rw-tools


    The dvd+rw-tools package (FreeBSD: ports/sysutils/dvd+rw-tools) can do it all
    and includes growisofs to burn CDs or DVDs. The examples refer to the dvd device
    as /dev/dvd which could be a symlink to /dev/scd0 (typical scsi on Linux) or /dev/cd0
    (typical FreeBSD) or /dev/rcd0c (typical NetBSD/OpenBSD character SCSI) or /dev/rdsk/c0t1d0s2
    (Solaris example of a character SCSI/ATAPI CD-ROM device). There is a nice documentation
    with examples on the FreeBSD handbook chapter 18.7.


    ```

    # -dvd-compat closes the disk

    # growisofs -dvd-compat -Z /dev/dvd=imagefile.iso   # Burn existing iso image

    # growisofs -dvd-compat -Z /dev/dvd -J -R /p/to/data   # Burn directly

    ```


    # Convert a Nero .nrg file to .iso


    Nero simply adds a 300Kb header to a normal iso image. This can be trimmed with
    dd.


    ```

    # dd bs=1k if=imagefile.nrg of=imagefile.iso skip=300

    ```


    # Convert a bin/cue image to .iso


    The little bchunk program can do this. It is in the FreeBSD ports in sysutils/bchunk.


    ```

    # bchunk imagefile.bin imagefile.cue imagefile.iso

    ```


    # 3.11 Create a file based image


    For example a partition of 1GB using the file /usr/vdisk.img. Here we use the
    vnode 0, but it could also be 1.


    # FreeBSD


    ```

    # dd if=/dev/random of=/usr/vdisk.img bs=1K count=1M

    # mdconfig -a -t vnode -f /usr/vdisk.img -u 0          # Creates device /dev/md0

    # bsdlabel -w /dev/md0

    # newfs /dev/md0c

    # mount /dev/md0c /mnt

    # umount /mnt; mdconfig -d -u 0; rm /usr/vdisk.img      # Cleanup the md device

    ```


    The file based image can be automatically mounted during boot with an entry in
    /etc/rc.conf and /etc/fstab. Test your setup with # /etc/rc.d/mdconfig start (first
    delete the md0 device with # mdconfig -d -u 0).


    Note however that this automatic setup will only work if the file image is NOT
    on the root partition. The reason is that the /etc/rc.d/mdconfig script is executed
    very early during boot and the root partition is still read-only. Images located
    outside the root partition will be mounted later with the script /etc/rc.d/mdconfig2.


    /boot/loader.conf:


    ```

    md_load="YES"

    ```


    /etc/rc.conf:


    ```

    # mdconfig_md0="-t vnode -f /usr/vdisk.img"      # /usr is not on the root partition

    ```


    /etc/fstab: (The 0 0 at the end is important, it tell fsck to ignore this device,
    as is does not exist yet)


    ```

    /dev/md0c          /usr/vdisk    ufs     rw              0       0

    ```


    It is also possible to increase the size of the image afterward, say for example
    300 MB larger.


    ```

    # umount /mnt; mdconfig -d -u 0

    # dd if=/dev/zero bs=1m count=300 >> /usr/vdisk.img

    # mdconfig -a -t vnode -f /usr/vdisk.img -u 0

    # growfs /dev/md0

    # mount /dev/md0c /mnt                                 # File partition is now
    300 MB larger

    ```'
