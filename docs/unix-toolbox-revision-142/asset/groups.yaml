    # 13 SVN


    Server setup (p38) | SVN+SSH (p38) | SVN over http (p38) | SVN usage (p39)


    Subversion (SVN)¹⁸ is a version control system designed to be the successor of
    CVS (Concurrent Versions System). The concept is similar to CVS, but many shortcomings
    where improved. See also the SVN book¹⁹.


    # 13.1 Server setup


    The initiation of the repository is fairly simple (here for example /home/svn/
    must exist):


    ```

    # svnadmin create --fs-type fsfs /home/svn/project1

    ```


    Now the access to the repository is made possible with:


    +   - file:// Direct file system access with the svn client with. This requires
    local permissions on the file system.

    +   - svn:// or svn+ssh:// Remote access with the svnserve server (also over SSH).
    This requires local permissions on the file system (default port: 2690/tcp).

    +   - http:// Remote access with webdav using apache. No local users are necessary
    for this method.


    Using the local file system, it is now possible to import and then check out an
    existing project. Unlike with CVS it is not necessary to cd into the project directory,
    simply give the full path:


    ```

    # svn import /project1 file:///home/svn/project1/trunk -m ''Initial import''

    # svn checkout file:///home/svn/project1

    ```


    The new directory "trunk" is only a convention, this is not required.


    # Remote access with ssh


    No special setup is required to access the repository via ssh, simply replace
    file:// with svn+ssh/hostname. For example:


    ```

    # svn checkout svn+ssh://hostname/home/svn/project1

    ```


    As with the local file access, every user needs an ssh access to the server (with
    a local account) and also read/write access. This method might be suitable for
    a small group. All users could belong to a subversion group which owns the repository,
    for example:


    ```

    # groupadd subversion

    # groupmod -A user1 subversion

    # chown -R root:subversion /home/svn

    # chmod -R 770 /home/svn

    ```


    # Remote access with http (apache)


    Remote access over http (https) is the only good solution for a larger user group.
    This method uses the apache authentication, not the local accounts. This is a
    typical but small apache configuration:


    ```

    LoadModule dav_module modules/mod_dav.so

    LoadModule dav_svn_module modules/mod_dav_svn.so

    LoadModule authz_svn_module modules/mod_authz_svn.so    # Only for access control

    ```


    ```

    <Location /svn>

    # any "/svn/foo" URL will map to a repository /home/svn/foo

    SVNParentPath /home/svn

    AuthType Basic

    AuthName "Subversion repository"

    AuthzSVNAccessFile /etc/apache2/svn.acl

    AuthUserFile /etc/apache2/svn-passwd

    Require valid-user

    </Location>

    ```'
