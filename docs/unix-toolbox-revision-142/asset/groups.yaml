  md: "\n## 22.4 C++ example\n\nAs a slightly more realistic program in C++: a class\
    \ in its own header (IPv4.h) and implementation (IPv4.cpp) and a program which\
    \ uses the class functionality. The class converts an IP address in integer format\
    \ to the known quad format.\n\n### IPv4 class\n\n### IPv4.h:\n\n```\n#ifndef IPV4_H\n\
    #define IPV4_H\n#include <string>\n\nnamespace GenericUtils {    // create a namespace\n\
    class IPv4 {                // class definition\npublic:\n    IPv4(); ~IPv4();\n\
    \    std::string IPint_to_IPquad(unsigned long ip);// member interface\n};\n}\
    \ //namespace GenericUtils\n#endif // IPV4_H\n```\n\n### IPv4.cpp:\n\n```\n#include\
    \ \"IPv4.h\"\n#include <string>\n#include <sstream>\nusing namespace std;    \
    \            // use the namespaces\nusing namespace GenericUtils;\n\nIPv4::IPv4()\
    \ {}                     // default constructor/destructor\nIPv4::~IPv4() {}\n\
    string IPv4::IPint_to_IPquad(unsigned long ip) {    // member implementation\n\
    \    ostringstream ipstr;            // use a stringstream\n    ipstr << ((ip\
    \ &0xFF000000) >> 24)    // Bitwise right shift\n          << \".\" << ((ip &0x00FF0000)\
    \ >> 16)\n          << \".\" << ((ip &0x0000FF00) >> 8)\n          << \".\" <<\
    \ ((ip &0x000000FF));\n    return ipstr.str();\n}\n```\n\n### The program simplecpp.cpp\n\
    \n```\n#include \"IPv4.h\"\n#include <iostream>\n#include <string>\nusing namespace\
    \ std;\nint main (int argc, char* argv[]) {\n    string ipstr;               \
    \    // define variables\n    unsigned long ipint = 1347861486;   // The IP in\
    \ integer form\n    GenericUtils::IPv4 iputils;     // create an object of the\
    \ class\n    ipstr = iputils.IPint_to_IPquad(ipint);    // call the class member\n\
    \    cout << ipint << \" = \" << ipstr << endl;   // print the result\n\n    return\
    \ 0;\n}\n```\n\n### Compile and execute with:\n\n```\n# g++ -c IPv4.cpp simplecpp.cpp\
    \      # Compile in objects\n# g++ IPv4.o simplecpp.o -o simplecpp.exe    # Link\
    \ the objects to final executable\n# ./simplecpp.exe\n1347861486 = 80.86.187.238\n\
    ```\n\nUse ldd to check which libraries are used by the executable and where they\
    \ are located. Also used to check if a shared library is missing or if the executable\
    \ is static.\n\n## 22.5 Simple Makefile\n\nThe minimal Makefile for the multi-source\
    \ program is shown below. The lines with instructions *must begin with a tab!*\
    \ The back slash \"\\\" can be used to cut long lines.\n\n```\nCC = g++\nCFLAGS\
    \ = -O\nOBJS = IPv4.o simplecpp.o\n\nsimplecpp: ${OBJS}\n\t${CC} -o simplecpp\
    \ ${CFLAGS} ${OBJS}\nclean:\n\trm -f ${TARGET} ${OBJS}\n```\n\n```\n# ldd /sbin/ifconfig\
    \          # list dynamic object dependencies\n# ar rcs staticlib.a *.o      #\
    \ create static archive\n# ar t staticlib.a            # print the objects list\
