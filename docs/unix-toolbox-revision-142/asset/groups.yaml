    # Linux


    ```

    # mount -t auto /dev/cdrom /mnt/cdrom    # typical cdrom mount command

    # mount /dev/hdc -t iso9660 -r /cdrom    # typical IDE

    # mount /dev/scd0 -t iso9660 -r /cdrom    # typical SCSI cdrom

    # mount /dev/sdC0 -t ntfs-3g /windows    # typical SCSI

    ```


    # Entry in /etc/fstab:


    ```

    /dev/cdrom  /media/cdrom  subfs noauto,fs=cdfs,ro,procuid,nosuid,nodev,exec 0
    0

    ```


    # Mount a FreeBSD partition with Linux


    Find the partition number containing with fdisk, this is usually the root partition,
    but it could be an other BSD slice too. If the FreeBSD has many slices, they are
    the one not listed in the fdisk table, but visible in /dev/sda* or /dev/hda*.


    ```

    # fdisk /dev/sda                # Find the FreeBSD partition

    # /dev/sda3   *    5357        7905    20474842+  a5  FreeBSD

    # mount -t ufs -o ufstype=ufs2,ro /dev/sda3 /mnt

    /dev/sda1o = /tmp; /dev/sda11 /usr   # The other slices

    ```


    # Remount


    Remount a device without unmounting it. Necessary for fsck for example


    ```

    # mount -o remount,ro /          # Linux

    # mount -o ro /                  # FreeBSD

    ```


    Copy the raw data from a cdrom into an iso image:


    ```

    # dd if=/dev/cd0c of=file.iso

    ```


    # 3.7 Add swap on-the-fly


    Suppose you need more swap (right now), say a 2GB file /swap2gb (Linux only).


    ```

    # dd if=/dev/zero of=/swap2gb bs=1024k count=2000

    # mkswap /swap2gb                # create the swap area

    # swapon /swap2gb                # activate the swap. It now in use

    # swapoff /swap2gb               # when done deactivate the swap

    # rm /swap2gb

    ```


    # 3.8 Mount an SMB share


    Suppose we want to access the SMB share myshare on the computer smbserver, the
    address as typed on a Windows PC is \\smbserver\myshare\. We mount on /mnt/smbshare.
    Warning> cifs wants an IP or DNS name, not a Windows name.


    # Linux


    ```

    # smbclient -U user -I 192.168.16.229 -L //smbshare/   # List the shares

    # mount -t smbfs -o username=winuser //smbserver/myshare /mnt/smbshare

    # mount -t cifs -o username=winuser,password=winpwd //192.168.16.229/myshare /mnt/share

    ```


    Additionally with the package mount.cifs it is possible to store the credentials
    in a file, for example /home/user/.smb:


    ```

    username=winuser

    password=winpwd

    ```


    And mount as follow:


    ```

    # mount -t cifs -o credentials=/home/user/.smb //192.168.16.229/myshare /mnt/smbshare

    ```


    # FreeBSD


    Use -I to give the IP (or DNS name); smbserver is the Windows name.


    ```

    # smbutil view -I 192.168.16.229 //winuser@smbserver   # List the shares

    # mount_smbfs -I 192.168.16.229 //winuser@smbserver/myshare /mnt/smbshare

    ```'
  - '[PAGE 11]


    # 3.9 Mount an image


    # Linux loop-back


    ```

    # mount -t iso9660 -o loop file.iso /mnt          # Mount a CD image

    # mount -t ext3 -o loop file.img /mnt             # Mount an image with ext3 fs

    ```


    # FreeBSD


    With memory device (do # kldload md.ko if necessary):


    ```

    # mdconfig -a -t vnode -f file.iso -u 0

    # mount -t cd9660 /dev/md0 /mnt

    # umount /mnt; mdconfig -d -u 0                     # Cleanup the md device

    ```


    Or with virtual node:


    ```

    # vnconfig /dev/vn0c file.iso; mount -t cd9660 /dev/vn0c /mnt

    # umount /mnt; vnconfig -u /dev/vn0c               # Cleanup the vn device

    ```


    # Solaris and FreeBSD


    with loop-back file interface or lofi:


    ```

    # lofiadm -a file.iso

    # mount -F hsfs -o ro /dev/lofi/1 /mnt

    # umount /mnt; lofiadm -d /dev/lofi/1               # Cleanup the lofi device

    ```


    # 3.10 Create and burn an ISO image


    This will copy the cd or DVD sector for sector. Without conv=notrunc, the image
    will be smaller if there is less content on the cd. See below and the dd examples
    (page 41).


    ```

    # dd if=/dev/hdc of=/tmp/mycd.iso bs=2048 conv=notrunc

    ```


    Use mkisofs to create a CD/DVD image from files in a directory. To overcome the
    file names restrictions: -r enables the Rock Ridge extensions common to UNIX systems,
    -J enables Joliet extensions used by Microsoft systems. -L allows ISO9660 filenames
    to begin with a period.


    ```

    # mkisofs -J -L -r -V TITLE -o imagefile.iso /path/to/dir

    ```


    On FreeBSD, mkisofs is found in the ports in sysutils/cdtools.


    # Burn a CD/DVD ISO image


    # FreeBSD


    FreeBSD does not enable DMA on ATAPI drives by default. DMA is enabled with the
    sysctl command and the arguments below, or with /boot/loader.conf with the following
    entries:


    ```

    hw.ata.ata_dma="1"

    hw.ata.atapi_dma="1"

    ```


    Use burncd with an ATAPI device (burncd is part of the base system) and cdrecord
    (in sysutils/cdtools) with a SCSI drive.


    ```

    # burncd -f /dev/acd0 data imagefile.iso fixate      # For ATAPI drive

    # cdrecord -scanbus                                   # To find the burner device
    (like 1,0,0)

    # cdrecord dev=1,0,0 imagefile.iso

    ```


    # Linux


    Also use cdrecord with Linux as described above. Additionally it is possible to
    use the native ATAPI interface which is found with:


    ```

    # cdrecord dev=ATAPI -scanbus

    ```


    And burn the CD/DVD as above.'
