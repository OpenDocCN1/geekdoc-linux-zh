    # 9.1 OpenSSL


    # A single file


    Encrypt and decrypt:


    ```

    # openssl aes-128-cbc -salt -in file -out file.aes

    # openssl aes-128-cbc -d -salt -in file.aes -out file

    ```


    Note that the file can of course be a tar archive.'
