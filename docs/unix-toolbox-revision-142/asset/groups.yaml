    # /etc/fstab


    The encrypted partition can be configured to be mounted with /etc/fstab. The password
    will be prompted when booting. The following settings are required for this example:


    ```

    # grep geli /etc/rc.conf

    geli_devices="ad1"

    geli_ad1_flags="-k /root/ad1.key"

    # grep geli /etc/fstab

    /dev/ad1.eli    /home/private    ufs    rw    0    0

    ```


    # Use password only


    It is more convenient to encrypt a USB stick or file based image with a passphrase
    only and no key. In this case it is not necessary to carry the additional key
    file around. The procedure is very much the same as above, simply without the
    key file. Let''s encrypt a file based image /cryptfile of 1 GB.


    ```

    # dd if=/dev/zero of=/cryptfile bs=1M count=1000  # 1 GB file

    # mdconfig -at vnode -f /cryptfile

    # geli init /dev/md0      # encrypts with password only

    # geli attach /dev/md0

    # newfs -U -m 0 /dev/md0.eli

    # mount /dev/md0.eli /mnt

    # umount /dev/md0.eli

    # geli detach md0.eli

    ```


    It is now possible to mount this image on an other system with the password only.


    ```

    # mdconfig -at vnode -f /cryptfile

    # geli attach /dev/md0

    # mount /dev/md0.eli /mnt

    ```


    # 11 SSL CERTIFICATES


    So called SSL/TLS certificates are cryptographic public key certificates and are
    composed of a public and a private key. The certificates are used to authenticate
    the endpoints and encrypt the data. They are used for example on a web server
    (https) or mail server (imaps).


    # 11.1 Procedure


    +   - We need a certificate authority to sign our certificate. This step is usually
    provided by a vendor like Thawte, Verisign, etc., however we can also create our
    own.

    +   - Create a certificate signing request. This request is like an unsigned certificate
    (the public part) and already contains all necessary information. The certificate
    request is normally sent to the authority vendor for signing. This step also creates
    the private key on the local machine.

    +   - Sign the certificate with the certificate authority.

    +   - If necessary join the certificate and the key in a single file to be used
    by the application (web server, mail server etc.).


    # 11.2 Configure OpenSSL


    We use /usr/local/certs as directory for this example check or edit /etc/ssl/openssl.cnf
    accordingly to your settings so you know where the files will be created. Here
    are the relevant part of openssl.cnf:


    ```

    [ CA_default ]

    dir        = /usr/local/certs/CA      # Where everything is kept

    certs      = $dir/certs              # Where the issued certs are kept

    ```'
  - '[PAGE 33]


    ```

    crl_dir      = $dir/crl          # Where the issued crl are kept

    database     = $dir/index.txt     # database index file.

    ```


    Make sure the directories exist or create them


    ```

    # mkdir -p /usr/local/certs/CA

    # cd /usr/local/certs/CA

    # mkdir certs crl newcerts private

    # echo "01" > serial          # Only if serial does not exist

    # touch index.txt

    ```


    If you intend to get a signed certificate from a vendor, you only need a certificate
    signing request (CSR). This CSR will then be signed by the vendor for a limited
    time (e.g. 1 year).


    # 11.3 Create a certificate authority


    If you do not have a certificate authority from a vendor, you''ll have to create
    your own. This step is not necessary if one intend to use a vendor to sign the
    request. To make a certificate authority (CA):


    ```

    # openssl req -new -x509 -days 730 -config /etc/ssl/openssl.cnf \

    -keyout CA/private/cakey.pem -out CA/cacert.pem

    ```


    # 11.4 Create a certificate signing request


    To make a new certificate (for mail server or web server for example), first create
    a request certificate with its private key. If your application do not support
    encrypted private key (for example UW-IMAP does not), then disable encryption
    with -nodes.


    ```

    # openssl req -new -keyout newkey.pem -new newreq.pem \

    -config /etc/ssl/openssl.cnf

    # openssl req -nodes -new -keyout newkey.pem -out newreq.pem \

    -config /etc/ssl/openssl.cnf      # No encryption for the key

    ```


    Keep this created CSR (newreq.pem) as it can be signed again at the next renewal,
    the signature onlt will limit the validity of the certificate. This process also
    created the private key newkey.pem.


    # 11.5 Sign the certificate


    The certificate request has to be signed by the CA to be valid, this step is usually
    done by the vendor. Note: replace "servername" with the name of your server in
    the next commands.


    ```

    # cat newreq.pem newkey.pem > new.pem

    # openssl ca -policy policy_anything -out servernamecert.pem \

    -config /etc/ssl/openssl.cnf -infiles new.pem

    # mv newkey.pem servernamekey.pem

