    # 5.4 Tunneling


    SSH tunneling allows to forward or reverse forward a port over the SSH connection,
    thus securing the traffic and accessing ports which would otherwise be blocked.
    This only works with TCP. The general nomenclature for forward and reverse is
    (see also ssh and NAT example):


    ```

    # ssh -L localport:desthost:destport user@gate  # desthost as seen from the gate

    # ssh -R destport:desthost:localport user@gate  # forwards your localport to destination

    #   desthost:localport as seen from the client initiating the tunnel

    # ssh -X user@gate   # To force X forwarding

    ```


    This will connect to gate and forward the local port to the host desthost:destport.
    Note desthost is the destination host as seen by the gate, so if the connection
    is to the gate, then desthost is localhost. More than one port forward is possible.


    # Direct forward on the gate


    Let say we want to access the CVS (port 2401) and http (port 80) which are running
    on the gate. This is the simplest example, desthost is thus localhost, and we
    use the port 8080 locally instead of 80 so we don''t need to be root. Once the
    ssh session is open, both services are accessible on the local ports.


    ```

    # ssh -L 2401:localhost:2401 -L 8080:localhost:80 user@gate

    ```


