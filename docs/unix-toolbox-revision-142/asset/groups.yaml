    # 7 RSYNC


    Rsync can almost completely replace cp and scp, furthermore interrupted transfers
    are efficiently restarted. A trailing slash (and the absence thereof) has different
    meanings, the man page is good... Here some examples:

    Copy the directories with full content:


    ```

    # rsync -a /home/colin/ /backup/colin/      # "archive" mode. e.g keep the same

    # rsync -a /var/ /var_bak

    # rsync -aR --delete --during /home/user/ /backup/   # use relative (see below)

    ```


    Same as before but over the network and with compression. Rsync uses SSH for the
    transport per default and will use the ssh key if they are set. Use "..." as with
    SCP. A typical remote copy:


    ```

    # rsync -axSzrv /home/user/ user@server:/backup/user/   # Copy to remote

    # rsync -a ''user@server:My\ Documents'' ''My\ Documents''   # Quote AND escape
    spaces for the remote sh

    ```


    Exclude any directory tmp within /home/user/ and keep the relative folders hierarchy,
    that is the remote directory will have the structure /backup/home/user/. This
    is typically used for backups.


    ```

    # rsync -aZR --exclude=tmp/ /home/user/ user@server:/backup/

    ```


    # Use port 20022 for the ssh connection:


    ```

    # rsync -az -e ''ssh -p 20022'' /home/colin/ user@server:/backup/colin/

    ```


    Using the rsync daemon (used with ":") is much faster, but not encrypted over
    ssh. The location of /backup is defined by the configuration in /etc/rsyncd.conf.
    The variable RSYNC_PASSWORD can be set to avoid the need to enter the password
    manually.'
