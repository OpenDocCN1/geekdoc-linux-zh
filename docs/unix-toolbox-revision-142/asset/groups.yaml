    # — Encrypt Partitions —


    ```

    # cryptsetup luksOpen /dev/sdc1 sdcl

    # mkfs.ext3 /dev/mapper/sdcl      # create ext3 file system

    # mount -t ext3 /dev/mapper/sdcl /mnt

    # umount /mnt

    # cryptsetup luksClose sdcl        # Detach the encrypted partition

    ```


    # Attach


    ```

    # cryptsetup luksOpen /dev/sdc1 sdcl

    # mount -t ext3 /dev/mapper/sdcl /mnt

    ```


    # Detach


    ```

    # umount /mnt

    # cryptsetup luksClose sdcl

    ```


    # dm-crypt without LUKS


    ```

    # cryptsetup -y create sdcl /dev/sdc1      # or any other partition like /dev/loop0

    # dmsetup ls                               # check it, will display: sdcl (254,
    0)

    # mkfs.ext3 /dev/mapper/sdcl               # This is done only the first time!

    # mount -t ext3 /dev/mapper/sdcl /mnt

    # umount /mnt/

    # cryptsetup remove sdcl                   # Detach the encrypted partition

    ```


    Do exactly the same (without the mkfs part!) to re-attach the partition. If the
    password is not correct, the mount command will fail. In this case simply remove
    the map sdcl (cryptsetup remove sdcl) and create it again.


    # 10.2 FreeBSD


    The two popular FreeBSD disk encryption modules are gbde and geli. I now use geli
    because it is faster and also uses the crypto device for hardware acceleration.
    See The FreeBSD handbook Chapter 18.6 for all the details. The geli module must
    be loaded or compiled into the kernel:


    ```

    options GEOM_ELI

    device crypto                         # or as module:

    # echo ''geom_eli_load="YES"'' >> /boot/loader.conf   # or do: kldload geom_eli

    ```


    # Use password and key


    I use those settings for a typical disk encryption, it uses a passphrase AND a
    key to encrypt the master key. That is you need both the password and the generated
    key /root/adl.key to attach the partition. The master key is stored inside the
    partition and is not visible. See below for typical USB or file based image.


    # Create encrypted partition


    ```

    # dd if=/dev/random of=/root/adl.key bs=64 count=1   # this key encrypts the mater
    key

    # geli init -s 4096 -K /root/adl.key /dev/adl        # -s 8192 is also OK for
    disks

    # geli attach -k /root/adl.key /dev/adl              # DO make a backup of /root/adl.key

    # dd if=/dev/random of=/dev/adl.eli bs=1m             # Optional and takes a long
    time

    # newfs /dev/adl.eli                                  # Create file system

    # mount /dev/adl.eli /mnt

    ```


    # Attach


    ```

    # geli attach -k /root/adl.key /dev/adl

    # fsck -ny -t ffs /dev/adl.eli        # In doubt check the file system

    # mount /dev/adl.eli /mnt

    ```


    # Detach


    The detach procedure is done automatically on shutdown.'
