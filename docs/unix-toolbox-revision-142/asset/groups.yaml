    # ethtool -s eth0 speed 100 duplex full # Force 100Mbit Full duplex

    # ethtool -s eth0 autoneg off          # Disable auto negotiation

    # ethtool -p eth1                       # Blink the ethernet led - very useful
    when supported

    # ip link show                          # Display all interfaces on Linux (similar
    to ifconfig)

    # ip link set eth0 up                   # Bring device up (or down). Same as "ifconfig
    eth0 up"

    # ip addr show                          # Display all IP addresses on Linux (similar
    to ifconfig)

    # ip neigh show                         # Similar to arp -a

    ```


