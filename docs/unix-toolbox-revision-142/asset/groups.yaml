    ```


    ## 建立多跳 SSH 隧道


    假设你无法直接通过 ssh 访问服务器，只能经由多个中间主机（例如由于路由问题）。有时仍然需要建立直接的客户端 - 服务器连接，例如使用 scp 复制文件，或转发
    smb、vnc 等其他端口。一种方法是将多个隧道串联起来，沿着各跳将端口转发到服务器。这个“承载”端口只有在最后一次连接到服务器时才会到达最终目的地。


    假设我们要通过两跳将 ssh 端口从客户端转发到服务器。隧道建立后，就可以从客户端直接连接到服务器（还可以再添加一个端口转发）。


    在一个 shell 中创建隧道


    client -> host1 -> host2 -> server，并打通 5678 隧道


    ```

    client$ ssh -L5678:localhost:5678 host1      # 5678 is an arbitrary port for the
    tunnel

    host1$ ssh -L5678:localhost:5678 host2      # chain 5678 from host1 to host2

    host2$ ssh -L5678:localhost:22 server      # end the tunnel on port 22 on the
    server

    ```


    在另一个 shell 中使用隧道


    client -> server，通过隧道 5678


    ```

    # ssh -p 5678 localhost      # connect directly from client to server

    # scp -P 5678 myfile localhost:/tmp/      # or copy a file directly using the
    tunnel

    # rsync -e ''ssh -p 5678'' myfile localhost:/tmp/ # or rsync a file directly to
    the server

    ```


    ## 自动连接与保活脚本


    我使用以下脚本的变体来保持机器通过反向 ssh 隧道可达。如果连接被关闭，它会被自动重建。你可以在同一行中添加多个 -L 或 -R 隧道。


    ```

    #!/bin/sh

    COMMAND="ssh -N -f -g -R 2022:localhost:22 colin@cb.vu"

    pgrep -f -x "$COMMAND" > /dev/null 2>&1 || $COMMAND

    exit 0

    ```


    ```

    1 * * * * colin /home/colin/port_forward.sh      # crontab entry (here hourly)

    ```


    ## 6 使用 SSH 的 VPN


    从 4.3 版本开始，OpenSSH 可以使用 tun/tap 设备加密隧道。这与其他基于 TLS 的 VPN 解决方案（如 OpenVPN）非常相似。SSH
    的一个优势是不需要安装和配置额外软件。此外，隧道使用 SSH 认证，例如预共享密钥。缺点是封装通过 TCP 完成，这可能导致慢速链路上的性能不佳。而且，隧道依赖单一（易断的）TCP
    连接。这种技术对于快速搭建基于 IP 的 VPN 非常有用。与单一 TCP 端口转发不同，这里没有限制，所有第三/四层协议（如 ICMP、TCP/UDP 等）都可以通过
    VPN 转发。无论如何，sshd_config 文件中需要以下选项：


    ```

    PermitRootLogin yes

    PermitTunnel yes

    ```


    ### 6.1 单个点对点连接


    这里，我们使用点对点隧道连接两台主机 hclient 和 hserver。连接从 hclient 发起至 hserver，并以 root 身份执行。隧道端点为
    10.0.1.1（服务器）和 10.0.1.2（客户端），我们创建一个 tun5 设备（也可以是其他编号）。过程非常简单：


    - 使用 SSH 的 -w 隧道选项进行连接

    - 配置隧道的 IP 地址。分别在服务器和客户端上各配置一次。


    ### 连接到服务器


    连接在客户端发起，命令在服务器上执行。


    ### 服务器为 Linux


    ```

    cli># ssh -w5:5 root@hserver

    srv># ifconfig tun5 10.0.1.1 netmask 255.255.255.252    # Executed on the server
    shell

    ```


    ### 服务器为 FreeBSD


    ```

    cli># ssh -w5:5 root@hserver

    srv># ifconfig tun5 10.0.1.1 10.0.1.2                # Executed on the server
    shell

    ```


    ### 配置客户端


    在客户端上执行的命令：


    ```

    cli># ifconfig tun5 10.0.1.2 netmask 255.255.255.252    # Client is on Linux

    cli># ifconfig tun5 10.0.1.2 10.0.1.1                  # Client is on FreeBSD

    ```


    现在两台主机已连接，并且可以使用隧道 IP 地址透明地通过任何第三/四层协议通信。


    ### 6.2 连接两个网络


    除了上述 p2p 设置外，使用两台网关通过 SSH VPN 连接两个私有网络更为实用。例如，假设 netA 是 192.168.51.0/24，netB 是
    192.168.16.0/24。过程与上述类似，我们只需要添加路由。仅当网关不是其网络的默认网关时，才需要在私有接口上激活 NAT。192.168.51.0/24
    (netA)|gateA <-> gateB|192.168.16.0/24 (netB)


    - 使用 SSH 的 -w 隧道选项进行连接。

    - 配置隧道的 IP 地址。分别在服务器和客户端上各配置一次。

    - 为两个网络添加路由。

    - 如有必要，在网关的私有接口上激活 NAT。


    该设置从 netA 中的 gateA 发起。


    ### 从 gateA 连接到 gateB


    连接从 gateA 发起，命令在 gateB 上执行。


