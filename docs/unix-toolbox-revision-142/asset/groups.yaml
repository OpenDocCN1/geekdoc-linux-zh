    \ edquota -p is used to duplicate a quota to other users. For example to duplicate\
    \ a reference quota to all users:\n\n```\n# edquota -p refuser `awk -F: '$3 >\
    \ 499 {print $1}' /etc/passwd`\n# edquota -p refuser user1 user2   # Duplicate\
    \ to 2 users\n```\n\n# Checks\n\nUsers can check their quota by simply typing\
    \ quota (the file quota.user must be readable). Root can check all quotas.\n\n\
    ```\n# quota -u colin                # Check quota for a user\n# repquota /home\
    \                # Full report for the partition for all users\n```\n\n## 20 SHELLS\n\
    \nMost Linux distributions use the bash shell while the BSDs use tcsh, the bourne\
    \ shell is only used for scripts. Filters are very useful and can be piped:\n\n\
    - grep Pattern matching\n- sed Search and Replace strings or characters\n- cut\
    \ Print specific columns from a marker\n- sort Sort alphabetically or numerically\n\
    - uniq Remove duplicate lines from a file\n\nFor example used all at once:\n\n\
    ```\n# ifconfig | sed 's/ / /g' | cut -d\" \" -f1 | uniq | grep -E \"[a-z0-9]+\"\
    \ | sort -r\n# ifconfig | sed '/inet addr:/!d;s/.*//.*/'|sort -t. -k1,1n -k2,2n\
    \ -k3,3n -k4,4n\n```\n\nThe first character in the sed pattern is a tab. To write\
    \ a tab on the console, use ctrl-v ctrl-tab.\n\n### 20.1 bash\n\nRedirects and\
    \ pipes for bash and sh:\n\n```\n# cmd1 > file                 # Redirect stdout\
    \ to file.\n# cmd2 > file                 # Redirect stderr to file.\n# cmd1 >>\
    \ file                # Redirect and append stdout to file.\n# cmd1 <> file  \
    \              # Redirect both stdout and stderr to file.\n# cmd1 >file 2>&1 \
    \            # Redirects stderr to stdout and then to file.\n# cmd1 | cmd2   \
    \              # pipe stdout to cmd2\n# cmd1 2>&1 | cmd2            # pipe stdout\
    \ and stderr to cmd2\n```\n\nModify your configuration in ~/.bashrc (it can also\
    \ be ~/.bash_profile). The following entries are useful, reload with \". ~/.bashrc\"\
    . With cygwin use ~/.bash_profile; with rxvt past with shift + left-click.\n\n\
    ```\n# in .bashrc\nbind \"\\e[A\":history-search-backward  # Use up and down arrow\
    \ to search\nbind \"\\e[B\":history-search-forward    # the history. Invaluable!\n\
    set -o emacs                         # Set emacs mode in bash (see below)\nset\
    \ bell-style visible               # Do not beep, inverse colors\n# Set a nice\
    \ prompt like [user@host]/path/todir>\nPS1=\"\\[\\033[1;30m\\]\\[\\033[1;34m\\\
    ]u@\\[\\033[1;30m\\]\"\nPS1=\"$PS1\\[\\033[0;33m\\]\\w\\[\\033[1;33m\\]1\\[\\\
    033[0;37m\\]\"\nPS1=\"$PS1\\w\\[\\033[1;30m\\]>\\[\\033[0m\\]\"\n# To check the\
    \ currently active aliases, simply type alias\nalias ls='ls -af'             \
    \       # Append indicator (one of */=>@l)\n```\n"
  mdcn: "\n\n## 19 磁盘配额\n\n磁盘配额允许限制用户或（或组成员）可使用的磁盘空间量和/或文件数量。配额按文件系统分配，由内核强制执行。\n\n\
    ### 19.1 Linux 设置\n\n通常需要安装配额工具包，它包含命令行工具。在 fstab 中激活用户配额并重新挂载分区。如果分区繁忙，则必须关闭所有被锁定的文件，或必须重新启动系统。将\
    \ usrquota 添加到 fstab 挂载选项中，例如：\n\n```\n/dev/sda2   /home   reiserfs   rw,acl,user_xattr,usrquota\
    \ 1 1\n# mount -o remount /home\n# mount                 # 检查 usrquota 是否激活，否则重启\n\
    ```\n\n使用 quotacheck 初始化 quota.user 文件。\n\n```\n# quotacheck -vum /home\n# chmod\
    \ 644 /home/aquota.user   # 让用户自行检查其配额\n```\n\n使用提供的脚本（例如 SuSE 上的 /etc/init.d/quotad）或使用\
    \ quotaon 激活配额：\n\n```\nquotaon -vu /home\n```\n\n使用以下命令检查配额是否激活：\n\n```\nquota\
    \ -v\n```\n\n### 19.2 FreeBSD 设置\n\n配额工具是基本系统的一部分，然而内核需要选项 quota。如果没有，则添加它并重新编译内核。\n\
    \n```\noptions QUOTA\n```\n\n与 Linux 相同，将配额添加到 fstab 选项中（userquota，而不是 usrquota）：\n\
    \n```\n/dev/ad0s1d   /home   ufs   rw,noatime,userquota   2   2\n# mount /home\
    \              # 重新挂载分区\n```\n\n在 /etc/rc.conf 中启用磁盘配额并启动配额。\n\n```\n# grep quotas\
    \ /etc/rc.conf\nenable_quotas=\"YES\"        # 启动时打开配额（或 NO）。\ncheck_quotas=\"\
    YES\"         # 启动时检查配额（或 NO）。\n# /etc/rc.d/quota start\n```\n\n### 19.3 分配配额限制\n\
    \n默认情况下配额不受限制（设为 0）。限制使用 edquota 为单个用户设置。配额也可以复制给多个用户。不同配额实现的文件结构不同，但原理相同：块和 inode\
    \ 的值可以受限。只更改 soft 和 hard 的值。如果未指定，块为 1k。宽限期使用 edquota -t 设置。例如：\n\n```\n# edquota\
    \ -u colin\n```\n\n# Linux\n\n用户 colin（uid 1007）的磁盘配额：\nFilesystem   blocks  \
    \ soft   hard   inodes   soft   hard\n/dev/sda8    108      1000   2000   1  \
    \      0      0\n\n# FreeBSD\n\n```\nQuotas for user colin:\n/home: kbytes in\
    \ use: 504184, limits (soft = 700000, hard = 800000)\n    inodes in use: 1792,\
    \ limits (soft = 0, hard = 0)\n```\n\n# 多用户\n\n命令 edquota -p 用于将配额复制给其他用户。例如将参考配额复制给所有用户：\n\
    \n```\n# edquota -p refuser `awk -F: '$3 > 499 {print $1}' /etc/passwd`\n# edquota\
    \ -p refuser user1 user2   # 复制给 2 个用户\n```\n\n# 检查\n\n用户只需输入 quota 即可检查其配额（quota.user\
    \ 文件必须可读）。root 可以检查所有配额。\n\n```\n# quota -u colin                # 检查用户的配额\n#\
    \ repquota /home                # 分区的完整报告，针对所有用户\n```\n\n## 20 Shell\n\n大多数 Linux\
    \ 发行版使用 bash shell，而 BSD 使用 tcsh，bourne shell 仅用于脚本。过滤器非常有用，可以通过管道连接：\n\n- grep\
    \ 模式匹配\n- sed 搜索并替换字符串或字符\n- cut 从标记打印特定列\n- sort 按字母或数字排序\n- uniq 从文件中删除重复行\n\
    \n例如一次性全部使用：\n\n```\n# ifconfig | sed 's/ / /g' | cut -d\" \" -f1 | uniq | grep\
    \ -E \"[a-z0-9]+\" | sort -r\n# ifconfig | sed '/inet addr:/!d;s/.*//.*/'|sort\
    \ -t. -k1,1n -k2,2n -k3,3n -k4,4n\n```\n\nsed 模式中的第一个字符是一个制表符。要在控制台上写入制表符，请使用\
    \ ctrl-v ctrl-tab。\n\n### 20.1 bash\n\nbash 和 sh 的重定向和管道：\n\n```\n# cmd1 > file\
    \                 # 将 stdout 重定向到文件。\n# cmd2 > file                 # 将 stderr\
    \ 重定向到文件。\n# cmd1 >> file                # 将 stdout 重定向并追加到文件。\n# cmd1 <> file\
    \                # 将 stdout 和 stderr 都重定向到文件。\n# cmd1 >file 2>&1             #\
    \ 将 stderr 重定向到 stdout，然后重定向到文件。\n# cmd1 | cmd2                 # 将 stdout 管道传输到\
    \ cmd2\n# cmd1 2>&1 | cmd2            # 将 stdout 和 stderr 管道传输到 cmd2\n```\n\n\
    在 ~/.bashrc 中修改你的配置（也可以是 ~/.bash_profile）。以下条目很有用，使用 \". ~/.bashrc\" 重新加载。使用 cygwin\
    \ 时使用 ~/.bash_profile；使用 rxvt 时使用 shift + 左键粘贴。\n\n```\n# in .bashrc\nbind \"\\\
    e[A\":history-search-backward  # 使用上下箭头搜索\nbind \"\\e[B\":history-search-forward\
    \    # 历史记录。非常有用！\nset -o emacs                         # 在 bash 中设置 emacs 模式（见下文）\n\
    set bell-style visible               # 不要蜂鸣，颜色反转\n# 设置一个漂亮的提示符，如 [user@host]/path/todir>\n\
    PS1=\"\\[\\033[1;30m\\]\\[\\033[1;34m\\]u@\\[\\033[1;30m\\]\"\nPS1=\"$PS1\\[\\\
    033[0;33m\\]\\w\\[\\033[1;33m\\]1\\[\\033[0;37m\\]\"\nPS1=\"$PS1\\w\\[\\033[1;30m\\\
    ]>\\[\\033[0m\\]\"\n# 要检查当前活动的别名，只需输入 alias\nalias ls='ls -af'               \
    \     # 追加指示符（其中之一 */=>@l）\n```\n"
