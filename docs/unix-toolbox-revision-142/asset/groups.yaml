    ```


    # 2.4 Top


    The program top displays running information of processes. See also the program
    htop from htop.sourceforge.net (a more powerful version of top) which runs on
    Linux and FreeBSD (ports/sysutils/htop/). While top is running press the key h
    for a help overview. Useful keys are:


