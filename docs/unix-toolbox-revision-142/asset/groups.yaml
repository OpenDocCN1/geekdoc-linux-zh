    # Network setup with inetd


    The CVS can be run locally only if a network access is not needed. For a remote
    access, the daemon inetd can start the pserver with the following line in /etc/inetd.conf
    (/etc/xinetd.d/cvs on SuSE):


    ```

    cvspsserver    stream tcp nowait cvs /usr/bin/cvs    cvs \

    --allow-root=/usr/local/cvs pserver

    ```


    It is a good idea to block the cvs port from the Internet with the firewall and
    use an ssh tunnel to access the repository remotely.


    # Separate authentication


    It is possible to have cvs users which are not part of the OS (no local users).
    This is actually probably wanted too from the security point of view. Simply add
    a file named passwd (in the CVSROOT directory) containing the users login and
    password in the crypt format. This is can be done with the apache htpasswd tool.


    Note: This passwd file is the only file which has to be edited directly in the
    CVSROOT directory. Also it won''t be checked out. More info with htpasswd --help


    ```

    # htpasswd -c passwd user1 password1   # -c creates the file

    # htpasswd -b passwd user2 password2

    ```


    Now add :cvs at the end of each line to tell the cvs server to change the user
    to cvs (or whatever your cvs server is running under). It looks like this:


    ```

    # cat passwd

    user1:xsfFjhU2Zu8Fuo:cvs

    user2:vnefJ0SnnvToM:cvs

    ```


    # 12.2 Test it


    Test the login as normal user (for example here me)


    ```

    # cvs -d :pserver:colin@192.168.50.254:/usr/local/cvs login

    Logging in to :pserver:colin@192.168.50.254:2401/usr/local/cvs

    CVS password:

    ```


    # CVSROOT variable


    This is an environment variable used to specify the location of the repository
    we''re doing operations on. For local use, it can be just set to the directory
    of the repository. For use over the network, the transport protocol must be specified.
    Set the CVSROOT variable with setenv CVSROOT string on a csh, tcsh shell, or with
    export CVSROOT=string on a sh, bash shell.


    ```

    # setenv CVSROOT :pserver:<username>@<host>:/cvsdirectory

    For example:

    # setenv CVSROOT /usr/local/cvs                # Used locally only

    # setenv CVSROOT :local:/usr/local/cvs         # Same as above

    # setenv CVSROOT :ext:user@cvsserver:/usr/local/cvs  # Direct access with SSH

    # setenv CVS_RSH ssh                            # For the ext access

    # setenv CVSROOT :pserver:user@cvsserver.254:/usr/local/cvs  # network with pserver

    ```


    When the login succeeded one can import a new project into the repository: cd
    into your project root directory


    ```

    cvs import <module name> <vendor tag> <initial tag>

    cvs -d :pserver:colin@192.168.50.254:/usr/local/cvs import MyProject MyCompany
    START

    ```


    Where MyProject is the name of the new project in the repository (used later to
    checkout). Cvs will import the current directory content into the new project.


    To checkout:


    ```

    # cvs -d :pserver:colin@192.168.50.254:/usr/local/cvs checkout MyProject

    or

    # setenv CVSROOT :pserver:colin@192.168.50.254:/usr/local/cvs

    # cvs checkout MyProject

    ```'
