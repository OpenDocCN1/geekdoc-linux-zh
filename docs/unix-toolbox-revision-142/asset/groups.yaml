    # 1.6 Reset root password


    # Linux method 1


    At the boot loader (lilo or grub), enter the following boot option:


    ```

    init=/bin/sh

    ```


    The kernel will mount the root partition and init will start the bourne shell
    instead of rc and then a runlevel. Use the command passwd at the prompt to change
    the password and then reboot. Forget the single user mode as you need the password
    for that.

    If, after booting, the root partition is mounted read only, remount it rw:


    ```

    # mount -o remount,rw /

    # passwd                            # or delete the root password (/etc/shadow)

    # sync; mount -o remount,ro /       # sync before to remount read only

    # reboot

    ```


    # FreeBSD method 1


    On FreeBSD, boot in single user mode, remount / rw and use passwd. You can select
    the single user mode on the boot menu (option 4) which is displayed for 10 seconds
    at startup. The single user mode will give you a root shell on the / partition.'
