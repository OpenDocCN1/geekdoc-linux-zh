    \          # for a mount point\n# fstat -p PID            # for an application\
    \ with PID\n# fstat -u user           # for a user name\n```\n\n### Find opened\
    \ log file (or other opened files), say for Xorg:\n\n```\n# ps ax | grep Xorg\
    \ | awk '{print $1}'\n1252\n# fstat -p 1252\nUSER     CMD        PID FD MOUNT\
    \      INUM MODE       SZ|DV R/W\nroot     Xorg      1252 root /        2 drwxr-xr-x\
    \ 512 r\nroot     Xorg      1252 text /usr    216016 -rws--x--x 1679848 r\nroot\
    \     Xorg      1252 0 /var       212042 -rw-r--r-- 56987 w\n```\n\nThe file with\
    \ inum 212042 is the only file in /var:\n\n```\n# find -x /var -inum 212042\n\
    /var/log/Xorg.0.log\n```\n\n### Linux\n\nFind opened files on a mount point with\
    \ fuser or lsof:\n\n```\n# fuser -m /home          # List processes accessing\
    \ /home\n# lsof /home\nCOMMAND  PID USER   FD   TYPE DEVICE    SIZE    NODE NAME\n\
    tcsh    29029 eedcoba cwd  DIR 0,18    12288   1048587 /home/eedcoba (guam:/home)\n\
    lsof    29140 eedcoba cwd  DIR 0,18    12288   1048587 /home/eedcoba (guam:/home)\n\
    ```\n\n### About an application:\n\n```\nps ax | grep Xorg | awk '{print $1}'\n\
    3324\n# lsof -p 3324\nCOMMAND  PID USER   FD   TYPE DEVICE    SIZE    NODE NAME\n\
    Xorg    3324 root   0w   REG 8,6     56296    12492 /var/log/Xorg.0.log\n```\n\
    \n### About a single file:\n\n```\n# lsof /var/log/Xorg.0.log\nCOMMAND  PID USER\
    \   FD   TYPE DEVICE    SIZE    NODE NAME\nXorg    3324 root   0w   REG 8,6  \
    \   56296    12492 /var/log/Xorg.0.log\n```\n\n## 3.6 Mount/remount a file system\n\
    \nFor example the cdrom. If listed in /etc/fstab:\n\n```\n# mount /cdrom\n```\n\
    \nOr find the device in /dev/ or with dmesg\n\n### FreeBSD\n\n```\n# mount -v\
