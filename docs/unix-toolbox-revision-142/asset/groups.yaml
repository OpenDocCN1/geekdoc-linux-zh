    使用 mpeg4 编解码器压缩佳能数码相机视频并修复糟糕的声音。


    ```

    # mencoder -o videout.avi -oac mp3lame -ovc lavc -srate 11025 \ -channels 1 -af
    adv_force1 -lameopts preset=medium -lavcopts \ vcodec=mspmpe4v2:vbitrate=600 -mc
    0 videoin.AVI

    ```


    有关声音处理，请参阅 sox。


