    client# nc 192.168.1.1 4444 | tar xpf - -C VIDEO_TS   # 在端口 4444 上拉取文件

    server# cat largefile | nc -l 5678                   # 提供单个文件

    client# nc 192.168.1.1 5678 > largefile              # 拉取单个文件

