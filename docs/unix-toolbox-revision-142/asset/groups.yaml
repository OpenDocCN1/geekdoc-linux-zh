    # — System —


    Debian and Debian based distributions like Ubuntu or Knoppix use the command update-rc.d
    to manage the runlevels scripts. Default is to start in 2,3,4 and 5 and shutdown
    in 0,1 and 6.


    ```

    # update-rc.d sshd defaults          # Activate sshd with the default runlevels

    # update-rc.d sshd start 20 2 3 4 5 . stop 20 0 1 6 . # With explicit arguments

    # update-rc.d -f sshd remove          # Disable sshd for all runlevels

    # shutdown -h now (or # poweroff)      # Shutdown and halt the system

    ```


    # FreeBSD


    The BSD boot approach is different from the SysV, there are no runlevels. The
    final boot state (single user, with or without X) is configured in /etc/ttys.
    All OS scripts are located in /etc/rc.d/ and in /usr/local/etc/rc.d/ for third-party
    applications. The activation of the service is configured in /etc/rc.conf and
    /etc/rc.conf.local. The default behavior is configured in /etc/defaults/rc.conf.
    The scripts responds at least to start|stop|status.


    ```

    # /etc/rc.d/sshd status

    sshd is running as pid 552.

    # shutdown now                      # Go into single-user mode

    # exit                              # Go back to multi-user mode

    # shutdown -p now                   # Shutdown and halt the system

    # shutdown -r now                   # Reboot

    ```


    The process init can also be used to reach one of the following states level.
    For example # init 6 for reboot.


    +   0   Halt and turn the power off (signal USR2)

    +   1   Go to single-user mode (signal TERM)

    +   6   Reboot the machine (signal INT)

    +   c   Block further logins (signal TSTP)

    +   q   Rescan the ttys(5) file (signal HUP)


