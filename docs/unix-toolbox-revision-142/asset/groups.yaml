    access.


    There are three popular ways to access the CVS at this point. The first two don''t
    need any further configuration. See the examples on CVSROOT below for how to use
    them:


    +   - Direct local access to the file system. The user(s) need sufficient file
    permission to access the CS directly and there is no further authentication in
    addition to the OS login. However this is only useful if the repository is local.

    +   - Remote access with ssh with the ext protocol. Any use with an ssh shell
    account and read/write permissions on the CVS server can access the CVS directly
    with ext over ssh without any additional tunnel. There is no server process running
    on the CVS for this to work. The ssh login does the authentication.

    +   - Remote access with pserver (default port: 2401/tcp). This is the preferred
