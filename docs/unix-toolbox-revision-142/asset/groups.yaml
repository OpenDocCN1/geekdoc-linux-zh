    # 5.2 Check fingerprint


    At the first login, ssh will ask if the unknown host with the fingerprint has
    to be stored in the known hosts. To avoid a man-in-the-middle attack the administrator
    of the server can send you the server fingerprint which is then compared on the
    first login. Use ssh-keygen -l to get the fingerprint (on the server):


    ```

    # ssh-keygen -l -f /etc/ssh/ssh_host_rsa_key.pub    # For RSA key

    2048 61:33:be:9b:ae:6c:36:31:fd:83:98:b7:99:2d:9f:cd  /etc/ssh/ssh_host_rsa_key.pub

    # ssh-keygen -l -f /etc/ssh/ssh_host_dsa_key.pub    # For DSA key (default)

    2048 14:4a:aa:d9:73:25:46:6d:0a:48:35:c7:f4:16:d4:ee  /etc/ssh/ssh_host_dsa_key.pub

    ```


    Now the client connecting to this server can verify that he is connecting to the
    right server:


    ```

    # ssh linda

    The authenticity of host ''linda (192.168.16.54)'' can''t be established.

    DSA key fingerprint is 14:4a:aa:d9:73:25:46:6d:0a:48:35:c7:f4:16:d4:ee.

    Are you sure you want to continue connecting (yes/no)? yes

    ```


