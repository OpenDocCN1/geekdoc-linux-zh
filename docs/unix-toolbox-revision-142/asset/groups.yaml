  - '[PAGE 24]


    # Connect two clients behind NAT


    Suppose two clients are behind a NAT gateway and client cliadmin has to connect
    to client clius er (the destination), both can login to the gate with ssh and
    are running Linux with sshd. You don''t need root access anywhere as long as the
    ports on gate are above 1024. We use 2022 on gate. Also since the gate is used
    locally, the option GatewayPorts is not necessary.


    On client clius er (from destination to gate):


    ```

    # ssh -R 2022:localhost:22 user@gate      # forwards client 22 to gate:2022

    ```


    On client cliadmin (from host to gate):


    ```

    # ssh -L 3022:localhost:2022 admin@gate      # forwards client 3022 to gate:2022

    ```


    Now the admin can connect directly to the client clius er with:


    ```

    # ssh -p 3022 admin@localhost      # local:3022 -> gate:2022 -> client:22

    ```


    # Connect to VNC behind NAT


    Suppose a Windows client with VNC listening on port 5900 has to be accessed from
    behind NAT.


    On client cliw in to gate:


    ```

    # ssh -R 15900:localhost:5900 user@gate

    ```


    On client cliadmin (from host to gate):


    ```

    # ssh -L 5900:localhost:15900 admin@gate

    ```


    Now the admin can connect directly to the client VNC with:


    ```

    # vncconnect -display :0 localhost

    ```


    # Dig a multi-hop ssh tunnel


    Suppose you can not reach a server directly with ssh, but only via multiple intermediate
    hosts (for example because of routing issues). Sometimes it is still necessary
    to get a direct client - server connection, for example to copy files with scp,
    or forward other ports like smb or vnc. One way to do this is to chain tunnels
    together to forward a port to the server along the hops. This "carrier" port only
    reaches its final destination on the last connection to the server.


    Suppose we want to forward the ssh port from a client to a server over two hops.
    Once the tunnel is build, it is possible to connect to the server directly from
    the client (and also add an other port forward).


    Create tunnel in one shell


    client -> host1 -> host2 -> server and dig tunnel 5678


    ```

    client$ ssh -L5678:localhost:5678 host1      # 5678 is an arbitrary port for the
    tunnel

    host1$ ssh -L5678:localhost:5678 host2      # chain 5678 from host1 to host2

    host_2$ ssh -L5678:localhost:22 server      # end the tunnel on port 22 on the
    server

    ```


    Use tunnel with an other shell


    client -> server using tunnel 5678


    ```

    # ssh -p 5678 localhost      # connect directly from client to server

    # scp -P 5678 myfile localhost:/tmp/      # or copy a file directly using the
    tunnel

    # rsync -e ''ssh -p 5678'' myfile localhost:/tmp/ # or rsync a file directly to
    the server

    ```


    # Autoconnect and keep alive script


    I use variations of the following script to keep a machine reachable over a reverse
    ssh tunnel. The connection is automatically rebuilt if closed. You can add multiple
    -L or -R tunnels on one line.


    ```

    #!/bin/sh

    COMMAND="ssh -N -f -g -R 2022:localhost:22 colin@cb.vu"

    pgrep -f -x "$COMMAND" > /dev/null 2>&1 || $COMMAND

    exit 0

    ```


    ```

    1 * * * * colin /home/colin/port_forward.sh      # crontab entry (here hourly)

    ```'
  - '[PAGE 25]


    # 6 VPN WITH SSH


    As of version 4.3, OpenSSH can use the tun/tap device to encrypt a tunnel. This
    is very similar to other TLS based VPN solutions like OpenVPN. One advantage with
    SSH is that there is no need to install and configure additional software. Additionally
    the tunnel uses the SSH authentication like pre shared keys. The drawback is that
    the encapsulation is done over TCP which might result in poor performance on a
    slow link. Also the tunnel is relying on a single (fragile) TCP connection. This
    technique is very useful for a quick IP based VPN setup. There is no limitation
    as with the single TCP port forward, all layer 3/4 protocols like ICMP, TCP/UDP,
    etc. are forwarded over the VPN. In any case, the following options are needed
    in the sshd_conf file:


    ```

    PermitRootLogin yes

    PermitTunnel yes

    ```


    # 6.1 Single P2P connection


    Here we are connecting two hosts, hclient and hserver with a peer to peer tunnel.
    The connection is started from hclient to hserver and is done as root. The tunnel
    end points are 10.0.1.1 (server) and 10.0.1.2 (client) and we create a device
    tun5 (this could also be an other number). The procedure is very simple:


    +   - Connect with SSH using the tunnel option -w

    +   - Configure the IP addresses of the tunnel. Once on the server and once on
    the client.


    # Connect to the server


    Connection started on the client and commands are executed on the server.


    # Server is on Linux


    ```

    cli># ssh -w5:5 root@hserver

    srv># ifconfig tun5 10.0.1.1 netmask 255.255.255.252    # Executed on the server
    shell

    ```


    # Server is on FreeBSD


    ```

    cli># ssh -w5:5 root@hserver

    srv># ifconfig tun5 10.0.1.1 10.0.1.2                # Executed on the server
    shell

    ```


    # Configure the client


    Commands executed on the client:


    ```

    cli># ifconfig tun5 10.0.1.2 netmask 255.255.255.252    # Client is on Linux

    cli># ifconfig tun5 10.0.1.2 10.0.1.1                  # Client is on FreeBSD

    ```


    The two hosts are now connected and can transparently communicate with any layer
    3/4 protocol using the tunnel IP addresses.


    # 6.2 Connect two networks


    In addition to the p2p setup above, it is more useful to connect two private networks
    with an SSH VPN using two gates. Suppose for the example, netA is 192.168.51.0/24
    and netB 192.168.16.0/24. The procedure is similar as above, we only need to add
    the routing. NAT must be activated on the private interface only if the gates
    are not the same as the default gateway of their network. 192.168.51.0/24 (netA)|gateA
    <-> gateB|192.168.16.0/24 (netB)


    +   - Connect with SSH using the tunnel option -w.

    +   - Configure the IP addresses of the tunnel. Once on the server and once on
    the client.

    +   - Add the routing for the two networks.

    +   - If necessary, activate NAT on the private interface of the gate.


    The setup is started from gateA in netA.


    # Connect from gateA to gateB


    Connection is started from gateA and commands are executed on gateB.'
