    # 16.3 PDF to Jpeg and concatenate PDF files


    Convert a PDF document with gs (GhostScript) to jpeg (or png) images for each
    page. Also much shorter with convert and mogrify (from ImageMagick or GraphicsMagick).


    ```

    # gs -dBATCH -dNOPAUSE -sDEVICE=jpeg -r150 -dTextAlphaBits=4 -dGraphicsAlphaBits=4
    \ -dMaxStripSize=8192 -sOutputFile=unixxtoolbox.%d.jpg unixxtoolbox.pdf

    # convert unixxtoolbox.pdf unixxtoolbox-#03d.png

    # convert *.jpeg images.pdf      # Create a simple PDF with all pictures

    # convert image000* -resize 120x120 -compress JPEG -quality 80 images.pdf

    # mogrify -format png *.ppm      # convert all ppm images to png format

    ```


    Ghostscript can also concatenate multiple pdf files into a single one. This only
    works well if the PDF files are "well behaved".


    ```

    # gs -q -sPAPERSIZE=a4 -dNOPAUSE -dBATCH -sDEVICE=pdfwrite -sOutputFile=all.pdf
    \ file1.pdf file2.pdf ...      # On Windows use ''#'' instead of ''=''

    ```


    # 16.4 Convert video


    Compress the Canon digicam video with an mpeg4 codec and repair the crappy sound.


    ```

    # mencoder -o videout.avi -oac mp3lame -ovc lavc -srate 11025 \ -channels 1 -af
    adv_force1 -lameopts preset=medium -lavcopts \ vcodec=mspmpe4v2:vbitrate=600 -mc
    0 videoin.AVI

    ```


