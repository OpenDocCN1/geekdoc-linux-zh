    # 14.4 tar


    The command tar (tape archive) creates and extracts archives of file and directories.
    The archive .tar is uncompressed, a compressed archive has the extension .tgz
    or .tar.gz (zip) or .tbz (bzip2). Do not use absolute path when creating an archive,
    you probably want to unpack it somewhere else. Some typical commands are:


    # Create


    ```

    # cd /

    # tar -cf home.tar home/      # archive the whole /home directory (c for create)

    # tar -czf home.tgz home/      # same with zip compression

    # tar -cjf home.tbz home/      # same with bzip2 compression

    ```


    Only include one (or two) directories from a tree, but keep the relative structure.
    For example archive /usr/local/etc and /usr/local/www and the first directory
    in the archive should be local/.


    ```

    # tar -C /usr -czf local.tgz local/etc local/www

    # tar -C /usr -xzf local.tgz   # To untar the local dir into /usr

    # cd /usr; tar -xzf local.tgz  # Is the same as above

    ```


    # Extract


    ```

    # tar -tzf home.tgz            # look inside the archive without extracting (list)

    # tar -xf home.tar              # extract the archive here (x for extract)

    # tar -xzf home.tgz             # same with zip compression (-xjf for bzip2 compression)

    # tar --strip-components 1 -zxvf gallery2.tgz -C gallery/   # remove leading path
    gallery2 and extract into gallery

    # tar -xjf home.tbz home/colin/file.txt   # Restore a single file

    ```


    # More advanced


    ```

    # tar c dir/ | gzip | ssh user@remote ''dd of=dir.tgz'' # arch dir/ and store
    remotely.

    # tar cvf - '' .print '' | backup.tar                 # arch the current directory.

    # tar -cf - -C /etc . | tar xpf - -C /backup/etc     # Copy directories

    # tar -cf - -C /etc . | ssh user@remote tar xpf - -C /backup/etc   # Remote copy.

    # tar -czf home.tgz --exclude ''*.o'' --exclude ''tmp/'' home/

    ```


    # 14.5 dd


    The program dd (disk dump or destroy disk or see the meaning of dd) is used to
    copy partitions and disks and for other copy tricks. Typical usage:


    ```

    # dd if=<source> of=<target> bs=<byte size> conv=<conversion>

    ```


    # Important conv options:


    +   notrunc    do not truncate the output file, all zeros will be written as zeros.

    +   noerror    continue after read errors (e.g. bad blocks)

    +   sync       pad every input block with Nulls to ibs-size


    The default byte size is 512 (one block). The MBR, where the partition table is
    located, is on the first block, the first 63 blocks of a disk are empty. Larger
    byte sizes are faster to copy but require also more memory.


    # Backup and restore


    ```

    # dd if=/dev/hda of=/dev/hdc bs=16065b          # Copy disk to disk (same size)

    # dd if=/dev/sda7 of=/home/root.img bs=4096 conv=notrunc,noerror # Backup /

    # dd if=/home/root.img of=/dev/sda7 bs=4096 conv=notrunc,noerror # Restore /

    # dd bs=1M if=/dev/ad0s3e | gzip -c > ad0s3e.gz   # Zip the backup

    # gunzip -dc ad0s3e.gz | dd of=/dev/ad0s3e bs=1M   # Restore the zip

    # dd bs=1M if=/dev/ad0s3e | gzip | ssh eedcoba@fry ''dd of=ad0s3e.gz'' # also
    remote

    # gunzip -dc ad0s3e.gz | ssh eedcoba@host ''dd of=/dev/ad0s3e bs=1M''

    # dd if=/dev/ad0 of=/dev/ad2 skip=1 seek=1 bs=4k conv=noerror   # Skip MBR

    # This is necessary if the destination (ad2) is smaller.

    ```'
  - '[PAGE 41]


    # Recover


    The command dd will read every single block of the partition. In case of problems
    it is better to use the option conv=sync,noerror so dd will skip the bad block
    and write zeros at the destination. Accordingly it is important to set the block
    size equal or smaller than the disk block size. A 1k size seems safe, set it with
    bs=1k. If a disk has bad sectors and the data should be recovered from a partition,
    create an image file with dd, mount the image and copy the content to a new disk.
    With the option noerror, dd will skip the bad sectors and write zeros instead,
    thus only the data contained in the bad sectors will be lost.


    ```

    # dd if=/dev/hda of=/dev/null bs=1m          # Check for bad blocks

    # dd bs=1k if=/dev/hdal conv=sync,noerror,notrunc | gzip | ssh \ # Send to remote

    # root@fry ''dd of=/dev/hdal.gz bs=1k''

    # dd bs=1k if=/dev/hdal conv=sync,noerror,notrunc of=hda1.img   # Store into an
    image

    # mount -o loop /hda1.img /mnt                 # Mount the image (page 13)

    # rsync -aX /mnt/ /newdisk/                    # Copy on a new disk

    # dd if=/dev/hda of=/dev/hda                   # Refresh the magnetic state

    # The above is useful to refresh a disk. It is perfectly safe, but must be unmounted.

    ```


    # Delete


    ```

    # dd if=/dev/zero of=/dev/hdc             # Delete full disk

    # dd if=/dev/urandom of=/dev/hdc           # Delete full disk better

    # kill -USR1 PID                            # View dd progress (Linux)

    # kill -INFO PID                            # View dd progress (FreeBSD)

    ```


    # MBR tricks


    The MBR contains the boot loader and the partition table and is 512 bytes small.
    The first 446 are for the boot loader, the bytes 446 to 512 are for the partition
    table.


    ```

    # dd if=/dev/sda of=/mbr_sda.bak bs=512 count=1   # Backup the full MBR

    # dd if=/dev/zero of=/dev/sda bs=512 count=1      # Delete MBR and partition table

    # dd if=/mbr_sda.bak of=/dev/sda bs=512 count=1    # Restore the full MBR

    # dd if=/mbr_sda.bak of=/dev/sda bs=446 count=1    # Restore only the boot loader

    # dd if=/mbr_sda.bak of=/dev/sda bs=1 count=64 skip=446 seek=446 # Restore partition
    table

    ```


    # 14.6 screen


    Screen (a must have) has two main functionalities:


    +   - Run multiple terminal session within a single terminal.

    +   - A started program is decoupled from the real terminal and can thus run in
    the background. The real terminal can be closed and reattached later.


    # Short start example


    start screen with:


    ```

    # screen

    ```


    Within the screen session we can start a long lasting program (like top).


    ```

    # top

    ```


    Now detach with Ctrl-a Ctrl-d. Reattach the terminal with:


    ```

    # screen -R -D

    ```


    In detail this means: If a session is running, then reattach. If necessary detach
    and logout remotely first. If it was not running create it and notify the user.
    Or:


    ```

    # screen -x

    ```


    Attach to a running screen in a multi display mode. The console is thus shared
    among multiple users. Very useful for team work/debug!


    # Screen commands (within screen)


    All screen commands start with Ctrl-a.


    +   - Ctrl-a ? help and summary of functions'
