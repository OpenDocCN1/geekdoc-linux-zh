    \n在 Windows 上使用来自 www.winpcap.org 的 windump。使用 windump -D 列出接口。\n\n### 使用 nmap\
    \ 扫描\n\nNmap⁷ 是一款具有操作系统检测功能的端口扫描器，通常已安装在大多数发行版上，也可用于 Windows。如果你不扫描你的服务器，黑客会替你扫描...\n\
    \n```\n# nmap cb.vu          # scans all reserved TCP ports on the host\n# nmap\
    \ -sP 192.168.16.0/24  # Find out which IP are used and by which host on 0/24\n\
    # nmap -sS -sV -O cb.vu   # Do a stealth SYN scan with version and OS detection\n\
    PORT     STATE SERVICE            VERSION\n22/tcp   open  ssh                OpenSSH\
    \ 3.8.1p1 FreeBSD-20060930 (protocol 2.0)\n25/tcp   open  smtp               Sendmail\
    \ smtpd 8.13.6/8.13.6\n80/tcp   open  http               Apache httpd 2.0.59 ((FreeBSD)\
    \ DAV/2 PHP/4.\n[...]\nRunning: FreeBSD 5.X\nUptime 33.120 days (since Fri Aug\
    \ 31 11:41:04 2007)\n```\n\n其他非标准但有用的工具是 hping（www.hping.org）一个 IP 数据包组装/分析器和\
    \ fping（fping.sourceforge.net）。fping 可以以轮询方式检查多个主机。\n\n## 4.12 流量控制（QoS）\n\n流量控制管理网络的排队、策略、调度和其他流量参数。以下示例是\
    \ Linux 和 FreeBSD 能力的简单实用用法，以更好地利用可用带宽。\n\n### 限制上传\n\nDSL 或电缆调制解调器具有较长的队列以提高上传吞吐量。然而用快速设备（例如以太网）填满队列会显著降低交互性。因此将设备上传速率限制以匹配调制解调器的物理容量是有用的，这应大大提高交互性。设置为调制解调器最大（电缆）速度的约\
    \ 90%。\n\n### Linux\n\n对于 512 Kbit 上传调制解调器。\n\n```\n# tc qdisc add dev eth0 root\
    \ tbf rate 480kbit latency 50ms burst 1540\n# tc -s qdisc ls dev eth0        \
    \         # Status\n# tc qdisc del dev eth0 root              # Delete the queue\n\
