    # 15.3 Library path


    Due to complex dependencies and runtime linking, programs are difficult to copy
    to an other system or distribution. However for small programs with little dependencies,
    the missing libraries can be copied over. The runtime libraries (and the missing
    one) are checked with ldd and managed with ldconfig.


    ```

    # ldd /usr/bin/rsync          # List all needed runtime libraries

    # ldconfig -n /path/to/libs/   # Add a path to the shared libraries directories

    # ldconfig -m /path/to/libs/   # FreeBSD

    # LD_LIBRARY_PATH              # The variable set the link library path

    ```


    # 16 CONVERT MEDIA


    Sometimes one simply need to convert a video, audio file or document to another
    format.


    # 16.1 Text encoding


    Text encoding can get totally wrong, specially when the language requires special
    characters like àç. The command iconv can convert from one encoding to an other.


    ```

    # iconv -f <from_encoding> -t <to_encoding> <input_file>

    # iconv -f ISO8859-1 -t UTF-8 -o file.input > file_utf8

    # iconv -l                 # List known coded character sets

    ```


    Without the -f option, iconv will use the local char-set, which is usually fine
    if the document displays well.


    # 16.2 Unix - DOS newlines


    Convert DOS (CR/LF) to Unix (LF) newlines and back within a Unix shell. See also
    dos2unix and unix2dos if you have them.


    ```

    # sed ''s/.$//'' dosfile.txt > unixfile.txt          # DOS to UNIX

    # awk ''{sub(/\r$/,"" );print}'' dosfile.txt > unixfile.txt  # DOS to UNIX

    # awk ''{sub(/$/,"\r");print}'' unixfile.txt > dosfile.txt   # UNIX to DOS

    ```'
