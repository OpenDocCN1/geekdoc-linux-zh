    certificate.


    # 11.6 Create united certificate


    The IMAP server wants to have both private key and server certificate in the same
    file. And in general, this is also easier to handle, but the file has to be kept
    securely!. Apache also can deal with it well. Create a file servername.pem containing
    both the certificate and key:


    +   - Open the private key (servernamekey.pem) with a text editor and copy the
    private key into the "servername.pem" file.

    +   - Do the same with the server certificate (servernamecert.pem).


    The final servername.pem file should look like this:


    ```

    -----BEGIN RSA PRIVATE KEY-----

    MIICKXQIBAAK...qK5LqGqT3c9dU6fCr+WuSs6aejdEDDqBRQ

    -----END RSA PRIVATE KEY-----

    -----BEGIN CERTIFICATE-----

    MIERzCCATC...iG9w0BAQQPADCBxTELMAKGA1UEBhMCREUx

    -----END CERTIFICATE-----

    ```'
