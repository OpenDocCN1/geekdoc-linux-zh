- pgno: 141
  md: '+   • Do not replace config files -- Packages which contain configuration files
    that are modified on your system will not be selected for updating. Let’s say,
    for example, that you’ve modified the /etc/syslog.conf configuration file. If
    there is an update available for syslogd, which would create a new /etc/syslog.conf
    file, this package will not be downloaded and installed. If you haven’t modified
    the configuration file on your system, it will be available for downloading and
    installation -- and the previous file will be backed up (in this case, as /etc/syslog.conf.rpmsave).


    +   • Display all available packages -- Select this box if you want Update Agent
    to show you all the available packages, not just the packages specific to your
    installed system.


    +   • Retrieve packages, but do not install -- By default, this option is selected.
    When this option is selected, Update Agent only downloads packages into a temporary
    directory. Once downloaded, you will be able to install the packages yourself.
    If this option is unchecked, Update Agent will download and automatically install
    your selections. Uncheck this option, then, to both download and install updated
    packages; to install the packages yourself, refer to the location specified in
    the Package storage directory at the bottom of the location.


    +   • Keep packages after installation -- Retains the package files after they’ve
    been installed. This could be useful if you want to keep copies of packages, however
    selecting this could potentially eat up quite a bit of disk space.


    +   • Attempts to resolve dependencies -- The value associated with this option
    instructs Update Agent on the number of times to check for possible dependency
    problems with selected packages. The value ranges from 1 to 10, and can be adjusted
    by using the scroll buttons on the side of the box. The higher the value, the
    greater the number of dependency checks before your updated packages are installed.


    Beneath the package options, two additional boxes allow you to specify the version
    of Red Hat Linux files you want to update, and the location where those upgrade
    files will be kept.


    The drop-down menu for Override version will show you a current or previous versions
    of Red Hat Linux. Most users will probably retain the default entry, which is
    Red Hat Linux 6.2. If no value is specified here, the proper value will automatically
    be determined.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'The default entry for **Package storage directory** is set to `/var/spool/update`
    as the default, although you can specify a more preferable location. For example,
    if you''ve chosen to download packages without automatically installing them,
    you may find that these downloads take up quite a bit of space over time. Specifying
    a directory on your filesystem allows you to send these packages to a directory
    which you know can accommodate their size.


    The **Exceptions** tab allows you to specify packages or individual files which
    you don''t want retrieved from `priority.redhat.com` and offered as an update.
    (See Figure 5-5, *Update Exceptions Tab* for an example of this tab.)


    # Figure 5-5  Update Exceptions Tab


    ![](img/eda1471ab4ce718c791c97a85559a478_142_0.png)


    In this tab, you have the opportunity to specify which files and packages you
    would prefer not to be updated or modified. Both entries -- **Skip Packages**
    and **Skip Files** -- allow you to use **wildcards**, such as an asterisk (`*`)
    and a question mark (`?`).


    The default entry in the **Skip Packages** section lists `kernel*`, meaning that
    any packages which begin with `kernel` are excluded from download and installation.
    Most users will likely want to keep this exclusion.'
  merge: -1
