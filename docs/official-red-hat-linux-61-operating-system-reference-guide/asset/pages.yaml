- pgno: 196
  md: "# 9  Preparing for a Text Mode Installation\n\n# 9.1  Things You Should Know\n\
    \nBefore attempting to install Red Hat Linux, you should collect some system information\
    \ in order to prevent any surprises during the installation. You can find most\
    \ of this information in the documentation that came with your system, or from\
    \ the system’s vendor or manufacturer.\n\nThe most recent list of hardware supported\
    \ by Red Hat Linux can be found at http://www.redhat.com/hardware. It’s a good\
    \ idea to check your hardware against this list before proceeding.\n\n> ## Please\
    \ Note\n> \n> You can perform a text mode installation of Red Hat Linux 6.2 by\
    \ following instructions in this chapter and in Chapter 10, *Installing Red Hat\
    \ Linux via Text Mode*. However, if you’re installing from a CD-ROM, you might\
    \ prefer to use the graphical installation mode, which offers both ease of use\
    \ and a flexible, custom-class installation mode. For more information on graphical\
    \ installations, turn to the *Official Red Hat Linux Installation Guide*.\n\n\
    > ## Tip\n> \n> At the end of the *Before You Begin* chapter in the *Official\
    \ Red Hat Linux Installation Guide* is a table for you to fill out with your specific\
    \ system requirements, which will help you keep up with any information you will\
    \ need during your installation."
