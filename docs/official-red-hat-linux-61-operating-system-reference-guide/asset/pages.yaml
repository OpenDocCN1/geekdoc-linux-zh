    # 2.13.3 System V Init


    This section is a brief description of the internals of the boot process. It discusses
    how the machine boots using SysV init, as well as the differences between the
    init used in older Linux releases, and SysV init.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'The init program is run by the kernel at boot time. It is in charge of starting
    all the normal processes that need to run at boot time. These include the getty
    processes that allow you to log in, NFS daemons, FTP daemons, and anything else
    you want to run when your machine boots.


    SysV init is quickly becoming the standard in the Linux world to control the startup
    of software at boot time, because it is easier to use and more powerful and flexible
    than the traditional BSD init.


    SysV init also differs from BSD init in that the configuration files are in a
    subdirectory of /etc instead of residing directly in /etc. In /etc/rc.d, you will
    find rc.sysinit and the following directories:


    +   - init.d

    +   - rc0.d

    +   - rc1.d

    +   - rc2.d

    +   - rc3.d

    +   - rc4.d

    +   - rc5.d

    +   - rc6.d


    The init.d directory contains a variety of scripts. Basically, you must have one
    script for each service you may need to start at boot time or when entering another
    runlevel. Services include things like networking, nfs, sendmail, httpd, and so
    on. Services do not include things like setserial that must only be run once and
    then exited. Things like that should go in rc.local or rc.serial.


    If you want rc.local, it should be in /etc/rc.d. Most systems include one even
    though it doesn''t do much. You can also include an rc.serial file in /etc/rc.d
    if you need to perform serial port specific tasks at boot time.


    The chain of events is as follows:


    +   - The kernel looks in several places for init and runs the first one it finds

    +   - init runs /etc/rc.d/rc.sysinit

    +   - rc.sysinit handles most of the boot loader''s processes and then runs rc.serial
    (if it exists)'
  merge: -1
  img_proc: true
- pgno: 67
  md: '+   - init runs all the scripts for the default runlevel.

    +   - init runs rc.local


    The default runlevel is decided in /etc/inittab. You should have a line close
    to the top like:


    ```

    id:3:3:initdefault:

    ```


    From this, you’d look in the second column and see that the default runlevel is
    3. If you want to change it, you can edit /etc/inittab by hand. Be very careful
    when you are editing the inittab file. If you do mess up, you can fix it by rebooting
    and typing:


    ```

    LILO boot: linux single

    ```


    This should allow you to boot into single user mode so you can re-edit inittab
    to its previous value.


    Now, how does it run all the right scripts? If you enter ls -1 on rc3.d, you might
    see something like:


    ```

    lrwxrwxrwx  1 root root  17 3 1:11 S10network -> ../init.d/network

    lrwxrwxrwx  1 root root  16 3 1:11 S30syslog -> ../init.d/syslog

    lrwxrwxrwx  1 root root  14 3 3:32 S40cron -> ../init.d/cron

    lrwxrwxrwx  1 root root  14 3 1:11 S50inet -> ../init.d/inet

    lrwxrwxrwx  1 root root  13 3 1:11 S60nfs -> ../init.d/nfs

    lrwxrwxrwx  1 root root  15 3 1:11 S70nfsfs -> ../init.d/nfsfs

    lrwxrwxrwx  1 root root  18 3 1:11 S90lpd -> ../init.d/lpd.init

    lrwxrwxrwx  1 root root  11 3 1:11 S99local -> ../rc.local

    ```


    What you’ll notice is that there are no "real" files in the directory. Everything
    there is a link to one of the scripts in the init.d directory. The links also
    have an "S" and a number at the beginning. The "S" means to start this particular
    script and a "K" would mean to stop it. The number in the file name is for ordering
    purposes. init will start all the services based on the order in which they appear.
    You can duplicate numbers, but it will only confuse you somewhat. You only need
    to use a two digit number, along with an upper case "S" or "K" to start or stop
    the services you require.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'How does init start and stop services? Simple. Each of the scripts is written
    to accept an argument which can be "*start*" and "*stop*". You can execute those
    scripts by hand, in fact, with a command like:


    ```

    */etc/rc.d/init.d/httpd stop*

    ```


    This will stop the *httpd* server. init reads the name and if it has a "K" it
    calls the script with the "*stop*" argument. If it has an "S" it calls the script
    with a "*start*" argument. Why all these runlevels? Some people want an easy way
    to set up machines to be multi-purpose. You could have a "server" runlevel that
    just runs *httpd*, *sendmail*, networking, etc. Then you could have a "user" runlevel
    that runs *gdm*, networking, and so on.


    # 2.13.4 Init Runlevels


    Generally, Red Hat Linux operates in runlevel 3 -- full multi-user mode. The following
    runlevels are defined in Red Hat Linux:


    +   - 0 -- Halt

    +   - 1 -- Single user mode

    +   - 2 -- Multi-user mode, without NFS

    +   - 3 -- Full multi-user mode

    +   - 4 -- Not used

    +   - 5 -- Full multi-user mode (with an X-based login screen)

    +   - 6 -- Reboot


    If your machine gets into a state where it will not boot due to a bad */etc/inittab*,
    or will not let you log in because you have a corrupted */etc/passwd* or have
    simply forgotten your password, boot into single user mode by typing *linux single*
    at the LILO boot prompt. A very bare system will boot and you will have a shell
    from which you can fix things.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# 2.13.5 Initscript Utilities


    The `chkconfig` utility provides a simple command-line tool for maintaining the
    `/etc/rc.d` directory hierarchy. It relieves system administrators from having
    to directly manipulate the numerous symlinks in `/etc/rc.d`.


    In addition, there is the `ntsysv` utility, that provides a screen-oriented interface,
    versus `chkconfig`''s command-line interface.


    Please see the `chkconfig` and `ntsysv` man pages for more information.


    # 2.13.6 Running Programs at Boot Time


    The file `/etc/rc.d/rc.local` is executed at boot time, after all other initialization
    is complete, and whenever you change runlevels. You can add additional initialization
    commands here. For instance, you may want to start up additional daemons, or initialize
    a printer. In addition, if you require serial port setup, you can edit `/etc/rc.d/rc.serial`,
    and it will be executed automatically at boot time.


    The default `/etc/rc.d/rc.local` simply creates a nice login banner with your
    kernel version and machine type.


    # 2.13.7 Shutting Down


    To shut down Red Hat Linux, issue the `shutdown` command. You can read the `shutdown`
    man page for complete details, but the two most common usages are:


    ```

    ```

    shutdown -h now

    shutdown -r now

    ```

    ```


    Each will cleanly shutdown the system. After shutting everything down, the `-h`
    option will halt the machine, and the `-r` option will reboot.


    Although the `reboot` and `halt` commands are now "smart" enough to invoke `shutdown`
    if run while the system is in runlevels 1-5, it is a bad habit to get into, as
    not all Linux-like operating systems have this feature.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# 2.14 Rescure Mode


    When things go wrong, there are several ways to work on fixing them. However,
    they require that you understand the system well. We will present the ways that
    you can boot into rescue modes where you can use your own knowledge to rescue
    the system.


    # 2.14.1 What is Rescue Mode?


    Rescue mode is a term used to describe a method of booting a small Linux environment
    completely from a diskette, CD or other method.


    What follows in this section may help you recover from a problem at some point.


    As the name implies, Rescue mode is there to rescue you from something. In normal
    operation, your Red Hat Linux system uses files located on your system''s hard
    drive to do everything -- run programs, store your files, and more.


    However, there may be times when you are unable to get Linux running completely
    enough to access its files on your system''s hard drive. By using rescue mode,
    it''s possible to access the files stored on your system''s hard drive, even if
    you can''t actually run Linux from that hard drive.


    Normally, you''ll need to get into rescue mode for one of two reasons:


    +   * You are unable to boot Linux, and you''d like to fix it.

    +   * You are having hardware or software problems, and you want to get a few
    important files off your system''s hard drive.


    Let''s take a closer look at each of these scenari os.


    # Unable to boot Linux


    Many times this is caused by the installation of another operating system after
    you''ve installed Red Hat Linux. Some other operating systems assume that you
    have no other operating systems on your computer, and overwrite the Master Boot
    Record (or MBR) that originally contained the LILO bootloader. If LILO is overwritten
    in this manner, you''re out of luck -- unless you can get into rescue mode.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# **Hardware/software problems**


    There can be as many different situations under this category as there are systems
    running Linux. Things like failing hard drives and forgetting to run LILO after
    building a new kernel are just two instances that can keep you from booting Red
    Hat Linux. If you can get into rescue mode, you might be able to resolve the problem
    -- or at least get copies of your most important files.


    To boot your system in rescue mode, enter the following parameter at the installation
    boot prompt:


    ```

    `boot: linux rescue`

    ```


    You can get to the installation boot prompt in one of these ways:


    +   • By booting your system from the diskette or CD-ROM that came with your Red
    Hat Linux boxed set.


    +   • By booting from a network or PCMCIA boot diskette. These methods assume
    your network connection is working and require you to identify the network host
    and transfer type. For an explanation of how to specify this information, see
    "Installing over the Network" in Chapter 10, *Installing Red Hat Linux via Text
    Mode*.


    Once you have your system in rescue mode, a prompt appears:

    `bash#`


    From this prompt, you can run the commands listed below:


    anaconda | gzip | mkfs.ext2 | ps

    babblocks | head | mknod | python

    bash | hwclock | mkraid | python1.5

    cat | ifconfig | mkswap | raidstart

    chatter | init | mlabel | raidstop

    chmod | insmod | mnd | rcp

    chroot | less | mmount | rlogin

    clock | ln | mmove | rm

    collage | loader | mdprobe | rmdown

    cp | ls | mount | route

    cpio | lsattr | mpartition | rpm'
  merge: -1
  img_proc: true
