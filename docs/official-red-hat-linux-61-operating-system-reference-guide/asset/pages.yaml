- pgno: 49
  md: '# ## 2.10 Controlling Access to Services


    As a security measure, most network services are managed by a protective program
    called a **TCP wrapper**. The protected services are those listed in `/etc/inetd.conf`
    that specify `/usr/sbin/tcpd`. tcpd can allow or deny access to a service based
    on the origin of the request, and the configuration in `/etc/hosts.allow` and
    `/etc/hosts.deny`.


    By default Red Hat Linux allows all service requests. To disable or limit services
    you can edit `/etc/hosts.allow`. Here is an example `/etc/hosts.allow` file:


    ```

    ```

    ALL: redhat.com .redhat.com

    in.talkd: ALL

    in.ntalkd: ALL

    in.fingerd: ALL

    in.ftpd: ALL

    ```

    ```


    This configuration allows all connections from `redhat.com` and `*.redhat.com`
    machines. It also allows talk, finger, and FTP requests from all machines.


    tcpd allows much more sophisticated access control, using a combination of `/etc/hosts.allow`
    and `/etc/hosts.deny`. Read the `tcpd(8)` and `hosts_access(5)` man pages for
    complete details.


    # ## 2.11 Anonymous FTP


    Setting up anonymous FTP is simple. All you need to do is install the `anon-ftp`
    RPM package (which you may have already done at install time). Once it is installed,
    anonymous FTP will be up and running.


    There are a few files you might wish to edit to configure your FTP server.


    # */etc/ftpaccess*


    This file defines most of the access control for your FTP server. Some of the
    things that you can do are: set up local “groups” to control access from different
    sites, limit the number of simultaneous FTP connections, configure transfer logging,
    and much more. Read the `ftpaccess` man page for complete details.


    # */etc/ftphosts*'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The `ftp.hosts` file is used to allow or deny access to certain accounts from
    various hosts. Read the `ftp.hosts` man page for details.


    # /etc/ftpusers


    This file lists all the users that are *not* allowed to FTP into your machine.
    For example, `root` is listed in `/etc/ftpusers` by default. That means that you
    cannot FTP to your machine and log in as `root`. This is a good security measure,
