- pgno: 206
  md: '**Figure 10–2 Installation Program Widgets as seen in Disk Druid**


    ![](img/eda1471ab4ce718c791c97a85559a478_206_0.png)


    Here’s a list of the most important widgets shown in Figure 10–1, *Installation
    Program Widgets as seen in Configure TCP/IP* and Figure 10–2, *Installation Program
    Widgets as seen in Disk Druid* :


    +   * Window -- Windows (usually referred to as **dialogs** in this manual) will
    appear on your screen throughout the installation process. At times, one window
    may overlay another; in these cases, you can only interact with the window on
    top. When you are finished in that window, it will disappear, allowing you to
    continue working in the window underneath.


    +   * Text Input -- Text input lines are regions where you can enter information
    required by the installation program. When the cursor rests on a text input line,
    you may enter and/or edit information on that line.


    +   * Check Box -- Check boxes allow you to select or deselect a feature. The
    box displays either an asterisk (selected) or a space (unselected). When the cursor
    is'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'within a check box, press [Space] to select an unselected feature or to deselect
    a selected feature.


    +   * Text Widget -- Text widgets are regions of the screen for the display of
    text. At times, text widgets may also contain other widgets, such as check boxes.
    If a text widget contains more information than can be displayed in the space
    reserved for it, a scroll bar appears; if you position the cursor within the text
    widget, you can then use the [Up] and [Down] arrow keys to scroll through all
    the information available. Your current position is shown on the scroll bar by
    a # character, which moves up and down as you scroll.

    +   * Button Widget -- Button widgets are the primary method of interacting with
    the installation program. You progress through the windows of the installation
    program by navigating these buttons, using the [Tab] and [Enter] keys. Buttons
    can be selected when they are highlighted.

    +   * Cursor -- Although not a widget, the cursor is used to select (and interact)
    with a particular widget. As the cursor is moved from widget to widget, it may
    cause the widget to change color, or you may only see the cursor itself positioned
    in or next to the widget. In Figure 10–1, *Installation Program Widgets as seen
    in Con-figure TCP/IP*, the cursor is positioned on the **OK** button. Figure 10–2,
    *Installation Program Widgets as seen in Disk Druid* shows the cursor on the *Edit*
    button.


    # 10.1.1 Using the Keyboard to Navigate


    Navigation through the installation dialogs is performed through a simple set
    of key-strokes. To move the cursor, use [Left], [Right], [Up], and [Down] arrow
    keys. Use [Tab], and [Alt]-[Tab] to cycle forward or backward through each widget
    on the screen. Most screens display along the bottom a summary of available cursor
    positioning keys.


    To "press" a button, position the cursor over the button (using [Tab], for instance)
    and press [Space] or [Enter]. To select an item from a list of items, move the
    cursor to the item you wish to select and press [Enter]. To select an item with
    a **check box**, move the cursor to the check box and press [Space] to select
    an item. To deselect, press [Space] a second time.


    Pressing [F12] accepts the current values and proceeds to the next dialog; it
    is equivalent to pressing the **OK** button.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '![](img/eda1471ab4ce718c791c97a85559a478_208_0.png)


    Unless a dialog box is waiting for your input, do not press any keys during the
    installation process (doing so may result in unpredictable behavior).


    # 10.2 Starting the Installation Program


    There are several ways to start the installation. You can:


    +   • insert the diskette included in your boxed set (or a PCMCIA boot or network
    boot disk that you’ve created) into the primary diskette drive and reboot your
    computer


    +   • insert the Red Hat Linux CD into the drive and reboot, if your computer
    can boot from the CD-ROM drive


    +   • boot MS-DOS, and start a program in the dosutils directory of the Red Hat
    Linux CD-ROM named autoboot.bat (this will work from DOS only; it will not work
    from a DOS window started from Windows)


    While the installation program loads, messages will scroll on your screen. When
    the installation program has loaded, this prompt appears:


    ```

    boot:

    ```


    # 10.2.1 Displaying Online Help


    Once the installation program is loaded into memory, you can obtain information
    about the installation process and options by pressing [F1] through [F6]. For
    example, press [F2] to see general information about the online help screens.


    # 10.2.2 Text Mode Boot Options


    If you press [Enter] at the boot prompt, or if you take no action within the first
    minute after the boot prompt appears, the graphical installation program, as explained
    in the Official Red Hat Linux Installation Guide, starts. Pressing one of the
    help screen function keys as described above disables this autostart feature.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'To start the text mode installation program explained here, before pressing
    [Enter], type:


    ```

    boot: text

    ```


    If the installation program does not properly detect your hardware, you may need
    to restart the installation in "expert" mode. To start an expert mode installation,
    type:


    ```

    boot: text expert

    ```


    Expert mode disables most hardware probing, and gives you the option of entering
    options for the drivers loaded during the installation.


    > **Please Note**

    > The initial boot messages will not contain any references to SCSI or network
    cards. This is normal; these devices are supported by modules that are loaded
    during the installation process.


    Note that the command to start a serial installation has changed. If you must
    perform the installation in serial mode, type:


    ```

    boot: linux console=<device>

    ```


    Where <device> should be the device you are using (such as ttyS0 or ttyS1).


    Other options that may be entered with the boot command include passing options
    to the kernel. For example, to instruct the kernel to use all the RAM in a 128
    MB system, enter:


    ```

    boot: linux mem=128M

    ```'
  merge: -1
  img_proc: true
