    \ privileges on this screen. You may instead choose to grant or to silently grant\
    \ them specific privileges.\n\nThe difference between **Granted** and **Granted/silent**\
    \ is that if the privilege is granted, *linuxconf* will ask for the user's password\
    \ before allowing them the privilege. If the privilege is granted silently, *linuxconf*\
    \ will not prompt for your password.\n\nGenerally, careful system administrators\
    \ won't grant users any system configuration privileges unless it is absolutely\
    \ necessary. If you do grant privileges, be careful when granting them silently.\
    \ If a user with silently granted privileges logs in to his/her"
