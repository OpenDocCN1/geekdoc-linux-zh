- pgno: 220
  md: "> **WARNING**\n> \n> Do not choose this method if you're sharing a disk with\
    \ Windows NT; if you do, you will be unable to boot Windows NT. LILO will write\
    \ over NT's boot loader and you will be unable to boot NT. You must perform a\
    \ custom-class installation and configure LILO so that it is not installed on\
    \ the Master Boot Record (MBR).\n> \n> To create a dual-boot environment on a\
    \ system that currently has NT, you must install LILO on the first sector of the\
    \ root partition, not the MBR. Please be sure to create a boot disk. In a case\
    \ such as this, you will either need to use the boot disk, or configure the NT\
    \ system loader to boot LILO from the first sector of the root partition. Be sure\
    \ to check out http://www.linux-doc.org/HOWTO/mini/Linux+NT-Loader.html for more\
    \ information on setting up LILO and NT.\n\n+   Install KDE Workstation -- Install\
    \ on a system that will be used primarily as a work-station. Load the KDE GUI\
    \ and configure the system to start KDE when the system boots. The installation\
    \ program deletes all data in any existing Linux partitions, decides how to partition\
    \ the disk for the new version, and chooses which software packages to load."
  merge: -1
