    # 10.11 Installing LILO


    The LI[nuX L]oader (LILO) lets you specify at boot time whether to start Linux
    or another operating system. (If you are performing a workstation- or server-class
    installation, LILO is configured automatically in the Master Boot Record [MBR].)
    If you are performing a custom-class installation, the **LILO Installation** dialogs
    let you indicate how or whether to install LILO.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'The **Choosing LILO in LILO Configuration Dialog** dialog (Figure 10–23, *Choosing
    LILO in LILO Configuration Dialog*) lets you add default options to the LILO boot
    command or choose to not install LILO at all. Any options you enter will be passed
    to the Linux kernel at boot time.


    # Figure 10–23  Choosing LILO in LILO Configuration Dialog


    ![](img/eda1471ab4ce718c791c97a85559a478_239_0.png)


    In Section 9.1.1, *Basic Hardware Configuration*, you were asked to review your
    computer’s BIOS settings. In reviewing the BIOS settings, if you determined your
    system does not access a hard drive in linear mode, deselect this option. **Use
    linear mode** is selected by default. Select **OK** and press [Space] to continue.


    If you do not wish to install LILO, press **Skip**.'
  merge: -1
