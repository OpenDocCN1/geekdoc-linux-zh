  md: 'The `<mntpoint>` is where the partition will be mounted, and must be of one
    of the following forms:


    ```

    ```/\<mntpoint\> ```

    ```


    (i.e. `/`, `/usr`, `/home`)


    **swap**


    The partition will be used as swap space.


    ```

    ```raid.\<id\> ```

    ```


    The partition will be used for software RAID (see the `raid` command later).


    ```

    ```--size\ \<size\> ```

    ```


    Sets the minimum size for the partition


    ```

    ```--grow ```

    ```


    Tells the partition to grow to fill available space (if any).


    ```

    ```--onpart\ \<part\> ```

    ```


    Tells the installation program to put the partition on the *already existing*
    device `<part>`. For example, `partition /home --onpart hda1` will put `/home`
    on `/dev/hda1`, which must already exist.


    ```

    ```--ondisk\ \<disk\> ```

    ```


    Forces the partition to be created on a particular disk. For example, `--ondisk
    sdb` will put the partition on the second disk on the system.


    All partitions created will be formatted as part of the installation process.


    # F.5.14 raid


    ```

    ```raid\ \(optional\) ```

    ```


    Assembles a software RAID device. This command is of the form:'
  merge: -1
