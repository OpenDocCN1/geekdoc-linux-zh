    an HTTP Web server. If you select this method, you’ll next see the **HTTP Setup**
    dialogs; turn to Section 10.7, *Installing over a Network*.


    # Hard Drive


    If you booted from the diskette in your boxed set and are installing from the
    Red Hat Linux files that you have previously copied to a local hard drive. If
    you select this method, you’ll next see the **Select Partition** dialog; turn
    to Section 10.6, *Identify Disk Partition to Install From*.


