    # ### 10.11.3 SMP Motherboards and LILO


    If the installer detects a symmetric multi-processor motherboard on your system,
    it will automatically create two `lilo.conf` entries: `linux`, the default, boots
    the system in SMP mode and `linux-up` boots the system in uni-processor mode.


    # ## 10.12 Naming Your Computer


    The **Hostname Configuration** dialog prompts you to enter a name for your computer
    (called a **hostname**).'
