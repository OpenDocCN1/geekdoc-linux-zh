- pgno: 109
  md: '# # Name Server Specification


    A name server and default domain are also needed to establish a network connection.
    The name server is used to translate host names such as private.network.com to
    their corresponding IP address such as 192.168.7.3.


    The default domain tells the computer where to look if a fully qualified hostname
    isn''t specified. Fully qualified means that the full address is given, so foo.redhat.com
    is the fully qualified hostname, while the hostname is simply foo. If you specified
    your default domain as redhat.com, then you could use just the hostname to connect
    successfully. For example ftp foo would be sufficient if your search domain is
    redhat.com, while ftp foo.redhat.com would be required if it wasn''t.


    To specify the nameserver, open Config => Networking => Client tasks => Name server
    specification (DNS).


    # ### Figure 3-18 Resover Configuration Screen


    ![](img/eda1471ab4ce718c791c97a85559a478_109_0.png)


    Nameservers are ranked according to the order in which they are accessed, so it''s
    not unusual to see nameservers referred to as primary, secondary, tertiary and
    so on'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'down the list if more than one is specified. Each of these must be an IP address
    and not a name, since the computer has no way to resolve the name until it connects
    to a nameserver.


    In addition to a default domain, you can also specify search domains. Search domains
    work differently; they progress from one to six in a similar manner to the nameserver.
    However, they all take precedence over the default domain! Keep this in mind when
    specifying search domains. Search domains are not commonly used.


    The one item not yet covered is the check box for DNS usage. If you are running
    a small private network with no Internet connection, then using /etc/hosts files
    and keeping them all synchronized will work. As you add more and more machines,
    the complexity increases until it is easier to have a single machine run a DNS
    than to continue to sync /etc/hosts files.


    Another reason for not using DNS is if your network is going to use NIS instead.
    Note that NIS can be used in conjunction with DNS. So to sum it all up, unless
    you know why using /etc/hosts or NIS would be best for your situation, DNS is
    probably going to be your best choice.


    You can add, modify, or delete entries from the /etc/hosts file using linuxconf.
    Open **Config => Networking => Misc => Information about other hosts**.'
  merge: -1
  img_proc: true
