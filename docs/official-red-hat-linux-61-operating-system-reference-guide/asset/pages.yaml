- pgno: 303
  md: '# B.1.3 Partitions within Partitions — An Overview of Extended Partitions


    Of course, in time it became obvious that four partitions would not be enough.
    As disk drives continued to grow, it became more and more likely that a person
    could configure four reasonably-sized partitions and still have disk space left
    over. There needed to be some way of creating more partitions.


    Enter the extended partition. As you may have noticed in Table B-1, Partition
    Types, there is an “Extended” partition type; it is this partition type that is
    at the heart of extended partitions. Here’s how it works.


    When a partition is created and its type is set to “Extended,” an extended partition
    table is created. In essence, the extended partition is like a disk drive in its
    own right -- it has a partition table that points to one or more partitions (now
    called logical partitions, as opposed to the four primary partitions) contained
    entirely within the extended partition itself. Figure B-7, Disk Drive With Extended
    Partition shows a disk drive with one primary partition, and one extended partition
    containing two logical partitions (along with some unpartitioned free space).'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Figure B–7 Disk Drive With Extended Partition


    ![](img/eda1471ab4ce718c791c97a85559a478_304_0.png)


    As this figure implies, there is a difference between primary and logical partitions
    -- there can only be four primary partitions, but there is no fixed limit to the
    number of logical partitions that can exist. (However, in reality it is probably
    not a good idea to try to define and use more than 12 logical partitions on a
    single disk drive.)


    Now that we’ve discussed partitions in general, let’s see how to use this knowledge
    to get Red Hat Linux installed.


    # **B.1.4 Making Room For Red Hat Linux**


    There are three possible scenarios you may face when attempting to repartition
    your hard disk:


    +   - Unpartitioned free space is available.

    +   - An unused partition is available.

    +   - Free space in an actively used partition is available.'
  merge: -1
  img_proc: true
- pgno: 305
  md: "Let’s look at each scenario in order.\n\n> **Please Note**\n> \n> Please keep\
    \ in mind that the following illustrations are sim-\n> plified in the interest\
    \ of clarity, and do not reflect the exact\n> partition layout that you will encounter\
    \ when actually in-\n> stalling Red Hat Linux.\n\n# ## Using Unpartitioned Free\
    \ Space\n\nIn this situation, the partitions already defined do not span the entire\
    \ hard disk, leaving\nunallocated space that is not part of any defined partition.\
    \ Figure B–8, *Disk Drive\nwith Unpartitioned Free Space* shows what this might\
    \ look like.\n\n![](img/eda1471ab4ce718c791c97a85559a478_305_0.png)\n\nIf you\
    \ think about it, an unused hard disk also falls into this category; the only\
    \ differ-\\ence is that *all* the space is not part of any defined partition."
  merge: -1
