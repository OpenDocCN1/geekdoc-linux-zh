- pgno: 107
  md: 'The first item on this screen is a check box to indicate whether this adaptor
    is enabled or not. It should be checked if this is the one you intend to use.
    Below that is a choice of **Config modes**. **Manual** means that you will be
    providing all the information and entering it yourself. **Dhcp** and **Bootp**
    mean that your machine will be getting its network configuration information from
    a remote DHCP or BOOTP server. If you''re not sure what option to choose, talk
    to your network administrator.


    Required fields for DHCP or BOOTP:


    +   * **Net device** -- The type of network card you are using; for example, eth0
    would be the appropriate entry to use the first Ethernet card.

    +   * **Kernel module** -- The correct module based on your network card; for
    further information see the list below.


    For DHCP and bootp configurations you only need to specify the **Net device**
    and the **Kernel module**. For the **Net device**, you will choose from a list
    where the **eth** prefix represents Ethernet cards, **arc** specifies an ARNet
    card and **tr** specifies Token Ring cards. A complete list of network cards and
    their respective modules can be found in Appendix A, *General Parameters and Modules*.
    For the most up-to-date list, please see our website at:


    <http://www.redhat.com/support/hardware>


    The netmask information may be set by default, although depending on what kind
    of network you are setting up, or becoming a part of, you may need to specify
    this. If you are connecting to an ISP, ask them for the information. Most likely
    it will be 255.255.255.0.


    Required fields for manual configuration:


    +   * **Primary name + domain** -- The primary name is the name of your computer,
    while the domain is how your network is specified. For example, `foo.bar.com;
    foo` is the primary name and `bar.com` is the domain.

    +   * **IP address** -- The address of the machine and will follow the pattern
    of x.x.x.x. For example, 192.168.0.13.

    +   * **Net device** -- The type of network card you are using; eth0 would be
    the appropriate entry to use the first Ethernet card.'
