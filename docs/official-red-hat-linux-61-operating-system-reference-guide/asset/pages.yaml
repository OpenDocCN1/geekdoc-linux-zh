- pgno: 352
  md: 'Specifies how the boot loader should be installed on the system. By default,
    LILO installs on the MBR of the first disk, and installs a dual-boot system if
    a DOS partition is found (the DOS/Windows system will boot if the user types **dos**
    at the **LILO:** prompt).


    **--append** *<params>*


    Specifies kernel parameters.


    **--linear**


    Use the `linear` LILO option; this is only for backwards compatibility (and `linear`
    is now used by default).


    **--location**


    Specifies where the LILO boot record is written. Valid values are **mbr** (default),
    **partition** (installs the boot loader on the first sector of the partition containing
    the kernel), or **none**, which prevents any bootloader from being installed.


    # F.5.10 lilockcheck


    **lilockcheck** (optional)


    If this is present, the installation program checks for LILO on the MBR of the
    first hard drive, and reboots the system if it is found -- No installation is
    done in this case. This can prevent the kickstart from reinstalling an already
    installed system.


