- pgno: 357
  md: "```\nraid <mntpoint> --level <level> --device\n      <mdddevice><partitions*>\n\
    ```\n\nThe <mntpoint> is the location to mount the RAID filesystem. If it is /,\
    \ the RAID level must be 1 unless a boot partition (/boot) is present in which\
    \ the /boot partition has to be level 1 and the root (/) partition can be any\
    \ of the available types. The <partitions*> (which denotes that multiple partitions\
    \ can be listed) lists the RAID identifiers to add to the RAID array.\n\n--level\
    \ <level>\n     RAID level to use (0, 1, or 5).\n\n--device <mdddevice>\n    \
    \ Name of the RAID device to use (such as md0 or m1). RAID devices range from\
    \ md0 to md7, and each may only be used once.\n\nHere’s an example of how to create\
    \ a RAID level 1 partition for /, and a RAID level 5 for /usr, assuming there\
    \ are three SCSI disks on the system. It also creates three swap partitions, one\
    \ on each drive.\n\n```\npart raid.01 --size 60 --ondisk sda\npart raid.02 --size\
    \ 60 --ondisk sdb\npart raid.03 --size 60 --ondisk sdc\n\npart swap --size 128\
    \ --ondisk sda part swap --size 128 --ondisk\nsdb part swap --size 128 --ondisk\
    \ sdc\n\npart raid.11 --size 1 --grow --ondisk sda part raid.12 --size 1\n--grow\
    \ --ondisk sdb part raid.13 --size 1 --grow --ondisk sdc\n\nraid / --level 1 --device\
    \ md0 raid.01 raid.02 raid.03 raid /usr\n--level 5 --device md1 raid.11 raid.12\
    \ raid.13\n```\n\n# F.5.15 reboot\nreboot (optional)"
