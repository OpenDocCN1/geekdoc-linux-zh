- pgno: 200
  md: '# **Please Note**


    In some cases, there may be no CD-ROM icon, yet your computer has a functioning
    CD-ROM drive. This is normal, depending on how Windows was originally installed.
    In this case, you may be able to learn additional information by looking at the
    CD-ROM driver loaded in your computer''s `config.sys` file.


    +      - **Mouse** -- The type of mouse present on your computer can be found
    here.

    +      - **Display adapters** -- If you''re interested in running the X Window
    System, you should write down the information you find here.

    +      - **Sound, video and game controllers** -- If your computer has sound capabilities,
    you''ll find more information about that here.

    +      - **Network adapters** -- Here you''ll find additional information on your
    computer''s network card (if you have one).

    +      - **SCSI controllers** -- If your computer uses SCSI peripherals, you''ll
    find additional info on the SCSI controller here.


    While this method is not a complete substitute for opening your computer''s case
    and physically examining each component, in many cases it can provide sufficient
    information to continue with the installation.


    # **Please Note**


    This information can also be printed by clicking on the **Print** button. A second
    window will appear, allowing you to choose the printer, as well as the type of
    report (the **All Devices** and **System Summary** report type is the most complete).'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# 9.1.2 Video Configuration


    If you will be installing the X Window System, you should also be familiar with
    the following:


    +   • your video card -- The card’s make and model number (or the video chipset
    it uses), and the amount of video RAM it has. (Most PCI-based cards are auto-detected
    by the installation program.)


    +   • your monitor -- The unit’s make and model number, along with allowable ranges
    for horizontal and vertical refresh rates. (Newer models may be auto-detected
    by the installation program.)


    # 9.1.3 Network-related Information


    If you’re connected to a network, be sure you know the following:


    +   • IP address -- Usually represented as a set of four numbers separated by
    dots, such as 10.0.2.15.


    +   • netmask -- Another set of four numbers separated by dots. An example netmask
    would be 255.255.248.0.


    +   • gateway IP address -- Yet another set of four dot-separated numbers. For
    instance, 10.0.2.254.


    +   • one or more name server IP addresses -- One or more sets of dot-separated
    numbers. For example, 10.0.2.1 might be the address of a name server.


    +   • domain name -- The name your organization uses. For instance, Red Hat has
    a domain name of redhat.com.


    +   • hostname -- The name assigned to your individual system. A computer might
    be named pooh, for instance.'
  merge: -1
  img_proc: true
