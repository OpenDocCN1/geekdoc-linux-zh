    \ not (if there is a difference) the program used to provide the service.\n\n\
    # 2.6.3 The Configuration Files\n\nThe directory `/etc/pam.d` is used to configure\
    \ all PAM applications. (This used to be `/etc/pam.conf` in earlier PAM versions;\
    \ while the `pam.conf` file is still"
