- pgno: 22
  md: '# ## 2 System Administration


    This chapter provides an overview of the Red Hat Linux system. Here, you will
    learn aspects that you may not know about the system and things that are somewhat
    different from other UNIX systems.


    # ### 2.1 Filesystem Structure


    Red Hat is committed to the **Filesystem Hierarchy Standard (FHS)**, a collaborative
    document that defines the names and locations of many files and directories. We
    will continue to track the standard to keep Red Hat Linux compliant.


    The current FHS document is the authoritative reference to any FHS compliant filesystem,
    but the standard leaves many areas undefined or extensible. In this section we
    provide an overview of the standard and a description of the parts of the filesystem
    not covered by the standard.


    The complete standard can be viewed at:


    http://www.pathname.com/fhs/


    While compliance with the standard means many things, the two most important are
    compatibility with other compliant systems, and the ability to mount the `/usr`
    partition as read-only because it contains common executables and is not meant
    to be changed by users. Because of this, `/usr` can be mounted from the CD-ROM
    or from another machine via read-only NFS.


    # #### 2.1.1 Overview of the FHS


    The directories and files noted here are a small subset of those specified by
    the FHS document. Check the latest FHS document for the most complete information.


    # **The** `/dev` **Directory**


    The `/dev` directory contains filesystem entries which represent devices that
    are attached to the system. These files are essential for the system to function
    properly.'
  merge: -1
  img_proc: true
- pgno: 23
  md: "# The /etc Directory\n\nThe /etc directory is reserved for configuration files\
    \ that are local to your machine. No binaries are to be put in /etc. Binaries\
    \ that were in the past put in /etc should now go into /sbin or possibly /bin.\n\
    \nThe X11 and skel directories should be subdirectories of /etc:\n\n```\n/etc\n\
