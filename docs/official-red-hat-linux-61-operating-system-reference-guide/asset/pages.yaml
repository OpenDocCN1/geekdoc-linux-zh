    # ## 2.3 Users, Groups and User-Private Groups


    Managing users and groups has traditionally been tedious, but Red Hat Linux has
    a few tools and conventions that make users and groups easier to manage.


    While you can use `useradd` to create a new user from the shell prompt, the easiest
    way to manage users and groups is through `Linuxconf` (see Chapter 3, *System
    Configuration* ).


    Next, we’ll discuss the basic structure behind managing users and groups.


