- pgno: 197
  md: '# ### 9.1.1 Basic Hardware Configuration


    You should have a basic understanding of the hardware installed in your computer,
    including:


    +   * hard drive(s) -- Specifically, the number, size, and type. If you have more
    than one, it’s helpful to know which one is first, second, and so on. It is also
    good to know if your drives are IDE or SCSI. If you have IDE drives, you should
    check your computer’s BIOS to see if you are accessing them in **linear mode**.
    Please refer to your computer’s documentation for the proper key sequence to access
    the BIOS. Note that your computer’s BIOS may refer to linear mode by other names,
    such as "large disk mode." Again, your computer’s documentation should be consulted
    for clarification.

    +   * memory -- The amount of RAM installed in your computer.

    +   * CD-ROM -- Most importantly, the unit’s interface type (IDE, SCSI, or other
    interface) and, for non-IDE, non-SCSI CD-ROMs, the make and model number. IDE
    CD-ROMs (also known as ATAPI) are the most common type in recently manufactured,
    PC-compatible computers.

    +   * SCSI adapter (if one is present) -- The adapter’s make and model number.

    +   * network card (if one is present) -- The card’s make and model number.

    +   * mouse -- The mouse’s type (serial, PS/2, or bus mouse), protocol (Microsoft,
    Logitech, MouseMan, etc.), and number of buttons; also, for serial mice, the serial
    port it is connected to.


    On many newer systems, the installation program is able to automatically identify
    most hardware. However, it’s a good idea to collect this information anyway, just
    to be sure.


    # **Learning About Your Hardware with Windows**


    If your computer is already running Windows 9x, you can use the following procedure
    to get additional configuration information:'
  merge: -1
  img_proc: true
- pgno: 198
  md: '![](img/eda1471ab4ce718c791c97a85559a478_198_0.png)


    +   * In **Windows**, click on the **My Computer** icon using the secondary (normally
    the right) mouse button. A pop-up menu should appear.

    +   * Select **Properties**. The **System Properties** window should appear. Note
    the information listed under **Computer** -- in particular the amount of RAM listed.

    +   * Click on the **Device Manager** tab. You will then see a graphical representation
    of your computer’s hardware configuration. Make sure the **View devices by type**
    button is selected.


    At this point, you can either double-click on the icons (or single-click on the
    plus sign +) to look at each entry in more detail. Look under the following icons
    for more information:'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Figure 9–2 Device Manager Under Windows 95


    ![](img/eda1471ab4ce718c791c97a85559a478_199_0.png)


    +   • **Disk drives** -- You will find the type (IDE or SCSI) of hard drive here.
    (IDE drives will normally include the word "IDE," while SCSI drives won’t.)

    +   • **Hard disk controllers** -- You can get more information about your hard
    drive controller here.

    +   • **CDROM** -- Here is where you’ll find out about any CD-ROM drives connected
    to your computer.'
  merge: -1
