- pgno: 100
  md: '# 3.1.14 Getting Connected with **Linuxconf** (Network Configuration)


    The first thing to determine when getting hooked up is whether you’re connecting
    to a local area network, such as a group of computers in an office, or a wide
    area network, such as the Internet. Before continuing, it’s important to know
    what hardware you have and how you intend to connect. If you’re going to dial
    into another computer, then make sure your modem is installed and that the cables
    are arranged properly. If you’re using a network card, make sure it is installed
    properly and that the cables are correctly connected. Regardless of what network
    configuration you specify, if every phone line or cable is not in place, you’ll
    never get connected. We’ll start with modem connections and then move on to using
    network cards.


    # Adding Modem/PPP/SLIP connections


    Red Hat Linux 6.2 uses the utility called `RPP3`, or the `RH PPP Dialer`, a graphical
    tool which helps users configure and monitor network accounts -- particularly
    PPP accounts. (To read more about `RPP3`, see the related chapter in the *Official
    Red Hat Linux Getting Started Guide*.) However, you can still depend on `linuxconf`
    to set up network configuration.


    There are several pieces of information you will need to get from your ISP (Internet
    Service Provider) or systems administrator before getting your PPP or SLIP account
    working. In the case of some providers, you may have to sort through directions
    on how to set up a PPP connection on a Linux system. Some ISPs are ill-equipped
    to handle individuals using Linux. Don’t worry, you can still get connected; you
    just need some additional information from your ISP.


    The following is what you need for a connection with Red Hat Linux. The ISP representatives
    may respond that you don’t need this information, or may suggest that you need
    more than this. Red Hat has streamlined the information needed using intelligent
    defaults and tools such as `linuxconf` to simplify this process for you. Unless
    they have a document specifically for Red Hat Linux, just request the information
    below and go from there. Specifically, you’ll need:


    +   - The IP address for the ISP’s domain name server

    +   - The telephone number to dial'
  merge: -1
  img_proc: true
- pgno: 101
  md: '+   • Your login and password

    +   • An IP address for your machine if the network you are connecting to isn’t
    going to provide you with a dynamic one

    +   • Information about whether your ISP uses an authentication method such as
    PAP, CHAP or MS-CHAP. If so, you will need a “secret” to enable authentication.
    The secret will be a word or sequence of characters. CHAP and MS-CHAP are not
    currently supported using linxonconf, and are rarely used.


    Additional information which may be helpful, but isn’t necessary includes a secondary
    name server address, and a search domain. Once you have all this information,
    you’re ready to get connected.


    +   • Open Config ⇒ Networking ⇒ Client tasks ⇒ PPP/SLIP/PLIP.

    +   • Select Add.


    ![](img/eda1471ab4ce718c791c97a85559a478_101_0.png)


    Initially there won’t be any configurations specified. When you select Add you
    will be given a choice between PPP, SLIP and PLIP.'
  merge: -1
  img_proc: true
