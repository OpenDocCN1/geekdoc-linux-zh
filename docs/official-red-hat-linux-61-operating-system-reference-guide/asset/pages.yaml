    # **2.8.1 Building a modularized kernel**


    These instructions enable you to take advantage of the power and flexibility available
    through kernel modularization. If you do not wish to take advantage of modularization,
    please see Section 2.8.3, Building a monolithic kernel for an explanation of the
    different aspects of building and installing a monolithic kernel. It''s assumed
    that you''ve already installed the `kernel-headers` and `kernel-source` packages
    and that you issue all commands from the `/usr/src/linux` directory.


    The most important step is to make sure that you have a working emergency boot
    disk in case you make a mistake below. If you didn''t make a boot disk during
    the installation, use the `mkbootdisk` command to make one. The standard command
    is similar to `mkbootdisk --device /dev/fd0 2.2.x`. Once done, test the boot disk
    to make sure that it will boot the system.


    It is important to begin a kernel build with the source tree in a known condition.
    Therefore, it is recommended that you begin with the command `make mrproper`.
    This will remove any configuration files along with the remains of any previous
    builds that may be scattered around the source tree. Now you must create a configuration
    file that will determine which components to include in your new kernel. Available
    methods for kernel configuration are listed below:


    +   * make config -- An interactive text program. Components are presented and
    you answer with **Y** (yes), **N** (no), or **M** (module).


    +   * make menuconfig -- A graphical, menu driven program. Components are presented
    in a menu of categories, you select the desired components in the same manner
    used in the Red Hat Linux installation program. Toggle the tag corresponding to
    the item you want included; **Y** (yes), **N** (no), or **M** (module).


    +   * make xconfig -- An X Window System program. Components are listed in different
    levels of menus, and are selected using a mouse. Again, select **Y** (yes), **N**
    (no), or **M** (module).'
