  md: '![](img/eda1471ab4ce718c791c97a85559a478_225_0.png)


    Installing Red Hat Linux over another installation of Linux (including Red Hat
    Linux) does *not* preserve any information (files or data) from the prior installation.
    Make sure you save any important files! If you are worried about saving the current
    data on your existing Red Hat Linux system (without making a backup on your own),
