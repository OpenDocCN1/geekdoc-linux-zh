- pgno: 292
  md: '# ### A.4.1 Using Multiple Ethernet Cards


    You can use multiple Ethernet cards in one machine. If each card uses a different
    driver (e.g., a 3c509 and a DE425), you simply need to add `alias` (and possibly
    `options`) lines for each card to `/etc/conf.modules`. See Section 3.2.2, *Loading
    Kernel Modules* for more information.


    If any two Ethernet cards use the same driver (e.g., two 3c509''s or a 3c595 and
    a 3c905), you will need to either give the two card addresses on the driver''s
    `options` line (in the case of ISA cards), or (for PCI cards) simply add one `alias`
    line for each card.


    http://metalab.unc.edu/LDP/HOWTO/Ethernet-HOWTO.html For more information about
    using more than one Ethernet card, see the *Linux Ethernet-HOWTO* at http://metalab.unc.edu/LDP/HOWTO/Ethernet-HOWTO.html.
    If you installed the `howto` package when you installed Red Hat Linux, you can
    find it in the file `/usr/doc/HOWTO/Ethernet-HOWTO`.'
  merge: -1
  img_proc: true
