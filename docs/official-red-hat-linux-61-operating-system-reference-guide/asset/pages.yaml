  md: 'read if no `/etc/pam.d/` entry is found, its use is deprecated.) Each application
    (really, each *service*) has its own file. A file looks like this:


    ```

    #$PAM-1.0

    auth       required     /lib/security/pam_securtty.so

    auth       required     /lib/security/pam_pwdb.so shadow nullok

    auth       required     /lib/security/pam_nologin.so

    account    required     /lib/security/pam_pwdb.so

    password   required     /lib/security/pam_cracklib.so

    password   required     /lib/security/pam_pwdb.so shadow nullok use_authtok

    session    required     /lib/security/pam_pwdb.so

    ```


    The first line is a comment. (Any line that starts with a # character is a comment.)
    Lines two through four stack up three modules to use for login authorization.
    Line two makes sure that *if* the user is trying to log in as root, the tty on
    which they are logging in is listed in the `/etc/securtty` file *if* that file
    exists. Line three causes the user to be asked for a password and the password
    checked. Line four checks to see if the file `/etc/nologin` exists, and *if* it
    does, displays the contents of the file, and *if* the user is not root, does not
    let him or her log in.


    Note that all three modules are checked, *even if the first module fails*. This
    is a security decision -- it is designed to prevent the user from knowing why
    their authentication was disallowed, because knowing why it was disallowed might
    allow them to break the authentication more easily. You can change this behavior
    by changing *required* to *requisite*; if any requisite module returns failure,
    PAM fails immediately without calling any other modules.


    The fifth line causes any necessary accounting to be done. For example, if shadow
    passwords have been enabled, the `pam_pwdb.so` module will check to see if the
    account has expired, or *if* the user has not changed his or her password and
    the grace period for changing the password has expired.


    The sixth line subjects a newly changed password to a series of tests to ensure
    that it cannot, for example, be easily determined by a dictionary-based password
    craking program.


    The seventh line (which may be wrapped) specifies that *if* the `login` program
    changes the user''s password, it should use the `pam_pwdb.so` module to do so.
