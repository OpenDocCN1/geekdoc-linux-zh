    */etc/sysconfig/network-scripts/ifup-post*


    This file is called when any network device (except a SLIP device) comes up. Calls
    */etc/sysconfig/network-scripts/ifup-routes* to bring up static routes that depend
    on that device. Brings up aliases for that device. Sets the hostname if it is
    not already set and a hostname can be found for the IP for that device. Sends
