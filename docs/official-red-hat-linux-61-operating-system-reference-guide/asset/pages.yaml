- pgno: 204
  md: "# 10 Installing Red Hat Linux via Text Mode\n\nThis release of Red Hat Linux\
    \ features a graphical, mouse-based installation program, documented in the *Official\
    \ Red Hat Linux Installation Guide*. But you can also install Red Hat Linux with\
    \ a text mode, keyboard-based installation program. This chapter explains how\
    \ to use it. Here are some recommendations:\n\n+   * If you're new to Linux installations,\
    \ read the *Official Red Hat Linux Installation Guide* first. Although it focuses\
    \ on the graphical installation process, most of the concepts apply to the text\
    \ mode installation as well. After that, you'll find that Chapter 9, *Preparing\
    \ for a Text Mode Installation, Preparing for a Text Mode Installation*, will\
    \ give you more in-depth information regarding those aspects of installing Red\
    \ Hat Linux that do not apply to the graphical installation process.\n+   \n+\
    \   Additionally, you'll find Appendix B, *An Introduction to Disk Partitions,\
    \ An Introduction to Disk Partitions*, helpful, as it discusses disk partition\
    \ resizing (crucial if you plan to install Linux on a disk where another operating\
    \ system is currently installed).\n\n+   * If you'll need PCMCIA support to perform\
    \ the installation (for example, you're installing on a laptop equipped with a\
    \ PCMCIA card), you must make a PCMCIA boot disk. The *Official Red Hat Linux\
    \ Installation Guide* explains how to do this.\n\n+   * If you plan to install\
    \ over a network (via NFS, FTP, or HTTP), you must make a network boot disk. The\
    \ *Official Red Hat Linux Installation Guide* explains how to do this.\n\n+  \
    \ * If you've never used the text mode installation program, or need a refresher\
    \ on its user interface, read the next section.\n\n+   * To begin installation\
    \ without further delay, turn to Section 10.2, *Starting the Installation Program*.\n\
    \n# 10.1 The Installation Program User Interface\n\nThe Red Hat Linux text mode\
    \ installation program uses a screen-based interface that includes most of the\
    \ on-screen \"widgets\" commonly found on graphical user interfaces. Figure 10–1,\
    \ *Installation Program Widgets as seen in Configure TCP/IP*"
  merge: -1
  img_proc: true
- pgno: 205
  md: 'Figure 10–2, Installation Program Widgets as seen in Disk Druid illustrate
    the screens you''ll see.


    # Figure 10–1 Installation Program Widgets as seen in Configure TCP/IP


