- pgno: 324
  md: '# Please Note


    In order to install Red Hat Linux and keep another OS on your system, there must
    be sufficient space for Red Hat Linux to be installed on. Otherwise, Red Hat Linux
    will replace the current OS and files on your system. If you have not partitioned
    your hard drive to make room for Red Hat Linux or made sure that there is sufficient
    unpartitioned space available for your installation, Red Hat Linux will install
    over the existing information by default. It will also happen if you select a
    server-class installation (note that a server-class installation does not install
    the X Window System so no GUI environment will be present 1). So a dual-boot environment
    is in-compatible with this choice.


    If this is your preferred choice, first back-up any information on your computer
    that you want to save or perform a full backup if you think you may want to restore
    your system to its original configuration), then proceed with installation as
    explained in the Official Red Hat Linux Installation Guide.


    # D.2 Setting Up a Dual-Boot Environment


    Sharing a computer between two operating systems requires dual booting. You can
    use either operating system on the computer but not both at once. Each operating
    system boots from and uses its own hard drives or disk partitions (a partition
    is a physical division on a hard drive).


    For clarity, we will assume that the other operating system is Windows. But the
    general procedures are similar for other operating systems.


    1 A server-class installation is most appropriate for you if you ''d like your
    system to function as a Linux-based server, and you don''t want to heavily customize
    your system configuration.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# ## D.2.1 Add a New Hard Drive


    The simplest way to make room for Red Hat Linux is to add a new hard drive to
    the computer and then install Red Hat Linux on that drive. For example, if you
    add a second IDE hard drive to the computer, the Red Hat Linux installation program
    will recognize it as hdb and the existing drive (the one used by Windows) as hda.
    (With SCSI hard drives, the newly installed hard drive would be recognized as
    sdb and the other hard drive as sda.)


    If you choose to install a new hard drive for Linux, you don''t need to read any
    further. After starting the Red Hat Linux installation program, just make sure
    you tell it to install Linux on the newly installed hard drive (hdb, sdb) rather
    than the one Windows uses.


    # ## D.2.2 Use an Existing Hard Drive or Partition


    The next simplest way to make room for Linux is to use a hard drive or disk partition
    that is currently being used by Windows. For example, suppose that Windows Explorer
    shows two hard drives, C: and D:. This could indicate either that the computer
    has'
  merge: -1
  img_proc: true
- pgno: 326
  md: "two hard drives, or a single hard drive with two partitions. In either case\
    \ (assuming it is large enough), you can install Red Hat Linux on the hard drive\
    \ or disk partition that Windows recognizes as D:. \nThis choice is available\
    \ to you only if the computer has two or more hard drives or disk partitions.\n\
    \n# **Please Note**\n\nWindows uses letters to refer to removable drives (for\
    \ example, a ZIP drive) and network storage (virtual drives) as well as for local\
    \ hard drive space: you cannot install Linux on a removable or network drive.\n\
    \nIf a local Windows partition is available that you want to install Linux in,\
    \ you don't need to read any further. Just do the following:\n\n+   1. Copy all\
    \ data you want to save from the selected hard drive or partition (D: in this\
    \ example) to another location.\n+   2. Start the Red Hat Linux installation program\
    \ and tell it to install Linux in the designated drive or partition -- in this\
    \ example, in the hard drive or partition that Windows designates as D: . Note\
    \ that Linux distinguishes between hard drives and disk partitions. Thus:\n\n\
    +   * If C: and D: on this computer refer to two separate hard drives, the installation\
    \ program will recognize them as hda and hdb (IDE) or sda and sdb (SCSI). Tell\
    \ the installation program to use hdb or sdb.\n+   * If C: and D: refer to partitions\
