- pgno: 160
  md: 'One of the most convenient package manipulation tools available is Gnome-RPM,
    a graphical tool which runs under the X Window System. Gnome-RPM was written by
    James Henstridge (<james@daa.com.au>); RPM 3.0 support was written by Red Hat
    and additional rpmfind code was written by Daniel Veillard.


    Gnome-RPM (which is also referred to as gnorp) allows the end-user to easily work
    with RPM technology; it is fast, powerful and features a friendly interface.


    To learn more about RPM technology, turn to Chapter 6, Package Management with
    RPM.


    Gnome-RPM is "GNOME-compliant," meaning that it seamlessly integrates into GNOME,
    the X Window System desktop environment.


    With Gnome-RPM, you can easily


    +   - install RPM packages

    +   - uninstall RPM packages

    +   - upgrade RPM packages

    +   - find new RPM packages

    +   - querry RPM packages

    +   - verify RPM packages


    The interface features a menu, a toolbar, a tree and a display window of currently
    installed packages.


    Operations are often performed in Gnome-RPM by finding and selecting packages,
    then choosing the type of operation to perform via push-button on the toolbar,
    through the menu or by right-clicking with the mouse.


    +   - Installing a package places all of the components of that package on your
    system in the correct locations.

    +   - Uninstalling a package removes all traces of the package except for configuration
    files you have modified.'
  merge: -1
  img_proc: true
- pgno: 161
  md: "+   * Upgrading a package installs the newly available version and uninstalls\
    \ all other versions that were previously installed. This allows quick upgrading\
    \ to the latest releases of packages. Refer to Section 7.4, *Configuration* for\
    \ information about how to alter the default settings for installing and uninstalling\
    \ packages.\n\nYou can also use the **Web find** option to search the Internet\
    \ for newly released packages. You can direct Gnome-RPM to search for particular\
    \ distributions when you want to look for new packages. (If you have a slow connection,\
    \ this option can take some time to fully execute.) See Section 7.4, *Configuration*\
    \ for more information about this feature.\n\n> Please Note\n> \n> Exercice caution\
    \ if you choose to use the **Web find** option, since there is no way to verify\
    \ the integrity of the many packages which are available at numerous repositories.\
    \ Before installing packages, you should perform a query on that package to help\
    \ you determine whether it can be trusted. Packages not produced by Red Hat are\
    \ not supported in any way by Red Hat.\n\nUsing Gnome-RPM to perform all of these\
    \ and many other operations is the same as using rpm from the shell prompt. However,\
    \ the graphical nature of Gnome-RPM often makes these operations easier to perform.\n\
    \nThe usual way to work with Gnome-RPM is to display the available packages, select\
    \ the package(s) you want to operate on, and then select an option from the toolbar\
    \ or menu which performs the operation. However, Gnome-RPM is flexible enough\
    \ to display packages in a variety of views, thanks to the use of filters. Refer\
    \ to Section 7.3, *Installing New Packages* for more information on using filters\
    \ to identify packages.\n\nYou can install, upgrade or uninstall several packages\
    \ with a few button clicks. Similarly, you can query and verify more than one\
    \ package at a time. Because of Gnome-RPM’s integration with GNOME, you can also\
    \ perform installation, query and verification on packages from within the GNOME\
    \ File Manager."
  merge: -1
  img_proc: true
- pgno: 162
  md: '# ## 7.1 Starting Gnome-RPM


    You can start Gnome-RPM from either an Xterm window or from the GNOME desktop
    Panel (Main Menu Button => System => GnoRPM).


    ```

    To start Gnome-RPM from an Xterm window, at the shell prompt, simply type


    ```

    gnorpm &

    ```

    ```


    That will bring up the main Gnome-RPM window (as shown in Figure 7-1, *Main Gnome-RPM
    Window*).


    > > **Please Note**

    > > If you would like to install, upgrade or uninstall packages, you must be in
    root. The easiest way to do this is to type `su` to become root, and then type
    the root password at a shell prompt. However, it isn’t necessary to be root in
    order to query and verify packages.


    There are several parts to the Gnome-RPM interface.


    +   - Package Panel - On the left; allows you to browse and select packages on
    your system.

    +   - Display window - To the right of the package panel; shows you contents from
    folders in the panel.

    +   - Toolbar - Above the display and panel; a graphical display of package tools.

    +   - Menu - Above the toolbar; contains text-based commands, as well as help
    info, preferences and other settings.

    +   - Status bar - Beneath the panel and display windows; shows the total number
    of selected packages.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '![](img/eda1471ab4ce718c791c97a85559a478_163_0.png)


    # 7.2 The Package Display


    Each folder icon in the tree view at left represents a group of packages. Each
    group can contain subgroups. Groups are used to place packages that perform similar
    functions in similar locations. For example, the folder **Editors** contains text
    editors such as ed, vim and GxEdit. From the tree view on the left, you might
    find another folder beneath **Editors** called Emacs, which would contain both
    emacs and emacs-X11.


    The tree view is also arranged in an expandable and collapsible manner, which
    helps you to easily navigate through the packages. A folder which appears with
    a + next to it indicates that there are subfolders within that category.


    To view the packages and subgroups within a group, click once on a folder or a
    + with your left mouse button. The display window will then show you the contents
    of that folder. By default, you will be presented with icons to represent the
    packages. You can change that view to a list view by selecting **View as list**
    from the **interface** tab.'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'you’ll find under **Operations => Preferences**. Refer to Section 7.4, *Configuration*
    for more information about customizing the settings.


    In this manner, you can move about the tree view, opening and expanding folders
    containing applications, games, tools and more. The contents of each folder will
    be displayed at the right.


    # ### 7.2.1 Selecting Packages


    To select a single package, click on it with the left mouse button. You’ll notice
    that highlighting will appear around the package title (as shown in Figure 7–2,
    *Selecting Packages in Gnome-RPM*) which reflects the selection. To unselect it,
    either click on an empty space in the display panel with the left mouse button,
    or click on the **Unselect** button on the toolbar. When you unselect a package,
    the highlighting will disappear.


    ![](img/eda1471ab4ce718c791c97a85559a478_164_0.png)


    You can select and unselect multiple packages, in more than one folder in the
    tree panel. To select more than one package incrementally, left-click with your
    mouse'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'button, while holding down the [Ctrl] key; you''ll see highlighting around
    each additional selection.


    To select more than one package globally, that is, make larger selections within
    a folder, left-click one package, then, while holding down the [Shift] key, left-click
    on the final package you wish to select. By doing so, you''ll notice that individual
    packages between your starting and ending selections will also be highlighted
    for selection. Using this option makes selecting groups of packages quicker than
    selecting each package individually.


    The status bar at the bottom of Gnome-RPM will display the total number of packages
    you have selected.


    # ## 7.3 Installing New Packages


    To install new packages, choose **Install** from the toolbar. The **Install**
    window will open, revealing packages which are either already installed, newer
    packages or other options, which can be selected from the **Filter** drop-down
    bar at the top of the window. See Figure 7-4, The Add Packages Window for an example
    of the **Install** window, using the filter for "All but installed packages."


    Using the **Filter** feature allows you to winnow your choices for viewing packages.
    Available filters for viewing include:


    +   * All packages

    +   * All but installed packages

    +   * Only uninstalled packages

    +   * Only newer packages

    +   * Uninstalled or newer packages


    You can switch the display of packages by using the drop-down bar at the top of
    the window.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Figure 7–3 The Install Window


    ![](img/eda1471ab4ce718c791c97a85559a478_166_0.png)


    Choose the **Add** button. By default, if your CD-ROM is mounted with a Red Hat
    Linux CD-ROM, Gnome-RPM will search in `/mnt/cdrom/RedHat/RPMS` for new packages.
