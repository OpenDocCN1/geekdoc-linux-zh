    # F.5.12 network


    # network (optional)


    Configures network information for the system. If it is not given, and the kick-start
    installation does not require networking (in other words, it’s not installed over
    NFS), networking is not configured for the system. If the installation does require
    networking, Anaconda assumes that the install should be done over eth0 via a dynamic
    IP address (BOOTP/DHCP), and configures the final, installed system to dynamically
    determine its IP address. The network command configures the networking information
    for the installation for network kickstarts as well as for the final, installed
    system.


    **--bootproto**


    One of **dhcp**, **bootp**, or **static** (defaults to DHCP, and **dhcp** and
    **bootp** are treated the same). Must be **static** for static IP information
    to be used.


    **--ip**


    IP address for machine to be installed.'
