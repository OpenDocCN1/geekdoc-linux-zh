    # ## 2.8 Building a Custom Kernel


    Many people new to Linux often ask, "why should I build my own kernel?" Given
    the advances that have been made in the use of kernel modules, the most accurate
    response to that question is, "unless you know why you need to build your own
    kernel, you probably don’t." So unless you have a specific reason to build a customized
    kernel (or you’re just the curious sort), you may skip ahead to Section 2.9, *Sendmail*.


    In the past, you would need to recompile the kernel if you added new hardware
    on your system. The kernel was, in other words, **static**. Improvements in the
    Linux 2.0.x kernels allowed for much of the drivers for hardware to be **modularized**
    into components that could only be inserted on demand. However, there were *major
    problems* with having multiple kernels on your system that had been compiled for
    different advancements (a good case being SMP versus UP kernels). Further advancements
    with the modularization of the Linux 2.2.x kernel have allowed for multiple kernels
    to more easily co-exist (though *not* share modules).'
  merge: -1
  img_proc: true
