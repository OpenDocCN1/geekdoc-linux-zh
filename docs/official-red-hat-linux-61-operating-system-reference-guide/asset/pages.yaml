- pgno: 136
  md: "# 5 Working with Update Agent\n\nOne of the more convenient ways to keep your\
    \ Red Hat Linux system up to date is through Update Agent. This utility allows\
    \ you to automatically locate, download and install updated packages from Red\
    \ Hat for your system.\n\nThrough a secure connection to priority.redhat.com,\
    \ Red Hat’s own fast access FTP server, you’re assured that new packages are specific\
    \ to your Red Hat Linux system, rather than might be the case with upgrades you\
    \ could find through another source. Upgrades and bug fixes are presented to you\
    \ on a single \"page\" in your Web browser. You can select individual packages\
    \ or all of the packages for download. You can also configure Update Agent to\
    \ automatically install the new packages once they’ve been downloaded.\n\nBy using\
    \ priority.redhat.com, you can save yourself the time and trouble of searching\
    \ for and downloading individual packages from numerous FTP servers.\n\n> **Please\
    \ note**\n> \n> To use Update Agent, you must first register your copy of Red\
    \ Hat Linux 6.2. To register, go to http://www.redhat.com/now. Once you register,\
    \ you can select a **user name** and **password** which you should use to configure\
    \ Update Agent. Please refer to Section 5.2, *Configuring* Update Agent for more\
    \ details.\n\nUpdate Agent can also automatically download specific packages,\
    \ based on your preferences.\n\nIt isn’t necessary to have a dedicated line in\
    \ order to work with Update Agent; if you have dialup access to an ISP you can\
    \ also benefit from the application’s features.\n\n# 5.1 Starting Update Agent\n\
    \nIn most cases, Update Agent will be installed as a matter of course during a\
    \ new installation or an upgrade."
  merge: -1
  img_proc: true
- pgno: 137
  md: 'To start the application in GNOME, select the **Main Menu Button** on the *Panel*,
    then go to *System* => **Update Agent**. If you''re using KDE as your graphical
    environment, you can start Update Agent by going to the *Panel* => *Red Hat* =>
    *System* => **Update Agent**.


    ![](img/eda1471ab4ce718c791c97a85559a478_137_0.png)


    # **Please Note**


    Only root can use *Update Agent*. Each time you start the application from your
    user account, you will be asked to supply your root password, as Figure 5-1, *Box
    Requesting Root Password* shows. You can also start the *Update Agent* as root
    at a shell prompt by typing `/usr/bin/update`.


    After supplying the password, the application will start. Once the application
    starts, you''ll see a screen like Figure 5-2, *Main Update Agent Window*. From
    within this main dialog, you have the option of connecting to the priority update
    server, configuring or quitting the application.


    Before continuing, however, you''ll have to configure the application with information
    that''s specific to your machine and software.


    # ## 5.2 Configuring Update Agent


    As shipped, *Update Agent* will not automatically connect, download and install
    updated packages. Before proceeding, you''ll have to supply information about
    yourself, such as the user name and password which you selected when you registered
    Red Hat Linux 6.2. (To learn more about registration benefits, go to http://www.red-hat.com/now.)'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'Section 5.2:Configuring Update Agent


    # Figure 5-2 Main Update Agent Window


    ![](img/eda1471ab4ce718c791c97a85559a478_138_0.png)


    To configure the application, select **Configure** on the main dialog. (The button
    labeled **Abort** is only active during a download or installation process; selecting
    this button causes Update Agent to cease its current work.)


    The **Configuration** dialog presents you with three tabbed windows in which you
    must enter information:


    +   *   **User** -- Here, you’ll enter the user name and password which you had
    selected when you registered Red Hat Linux 6.2 at http://www.redhat.com/now. You
    should also enter an e-mail address to which correspondence regarding update transactions
    should be sent.

    +   *   **Retrieval** -- Specify the name of the server and certain installation
    instructions, such as which version of Red Hat Linux to update and whether to
    install as well as download packages.

    +   *   **Exceptions** -- Specify files and/or packages which you want to exclude
    from your update search, such as kernel-related files.


    139'
