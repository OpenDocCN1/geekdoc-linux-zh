    # **10.10  Partitioning Your Disk for Red Hat Linux**


    If you have not yet planned how you will set up your partitions, turn to Appendix
    B, *An Introduction to Disk Partitions*. There you’ll find an introduction to
    basic disk partitioning concepts. As a bare minimum, you’ll need an appropriately-sized
    root partition, and a swap partition of at least 16 MB.


    Figure 10–14, *Disk Setup Dialog* shows the two disk partitioning applications
    that are available for you to use.


    If you are using *fdisk* to partition your drive, please see Section 10.10.11,
    *Using fdisk* for those instructions. If you select Disk Druid, continue reading
    below.'
  merge: -1
