    # 2.8.2 Making an initrd image


    An `initrd` image is needed for loading your SCSI module at boot time. If you
    do not need an `initrd` image, do not make one and do not edit `lilo.conf` to
    include this image.


    The shell script `/sbin/mkinitrd` can build a proper `initrd` image for your machine
    if the following conditions are met:


