    +   - `PROMPT=an answer`, where `an answer` is one of the following:

    +     - `yes` -- Enables the key check for interactive mode.

    +     - `no` -- Disables the key check for interactive mode.


    # `/etc/sysconfig/keyboard`


    The `/etc/sysconfig/keyboard` file controls the behavior of the keyboard. The
    following values may be used:


    +   - `KEYTABLE=file`, where `file` is the name of a keytable file. For example:
    `KEYTABLE="/usr/lib/kbd/keytables/us.map"`


    +   - `KEYBOARD=sun|pc`, which is used on SPARCs only. `sun` means a Sun keyboard
    is attached on `/dev/kbd`, `pc` means a PS/2 keyboard is on a PS/2 port.


    # `/etc/sysconfig/network`


    The `/etc/sysconfig/network` file is used to specify information about the desired
    network configuration. The following values may be used:


    +   - `NETWORKING=answer`, where `answer` is one of the following:

    +     - `yes` -- Networking should be configured.'
  merge: -1
