- pgno: 168
  md: 'To choose an item, double-click on it with your left mouse button, or click
    on the **Add** button. The selected package(s) will be added to the **Install**
    window. You can also install more than one package in the same manner; each selection
    will be added to the **Install** window.


    In addition to choosing to install the packages from within the **Install** window,
    you can install after performing a query on the selected package. Click on **Query**,
    which will open the **Package Info** window. Here, you can find a variety of details
    about the file(s) you’ve selected to install. Information will include the origination
    of the package, the date it was built, its size and more.


    Within this **Package Info** window, you have the option of installing or upgrading
    packages.


    If the package already exists on your system and you’re querying a newer release,
    the **Package Info** window provides an **Upgrade** button, which will perform
    an upgrade to newer releases.


    You can also "drag and drop" packages from GNOME File Manager. Within the File
    Manager, left-click on your selected RPM file then, while still holding down the
    mouse button, "drag" the file to the **Install** window and place it within the
    **Name** panel.


    When dragging files to the **Install** window from the File Manager, you’ll notice
    that the file appears as an icon while it’s being dragged toward Gnome-RPM. Once
    inside the **Name** panel, you’ll see that the package is checked for installation
    by default, and its information appears in the **Package Info** panel to the right.


    To install the package now, just select the **Install** button.


    You’ll see a progress indicator when your package is being installed.


    # # 7.4 Configuration


    Gnome-RPM offers a wide selection of choices for installing and uninstalling packages,
    documentation and other features. You can customize Gnome-RPM through the **Preferences**
    dialog, which you can access from *Operations => Preferences* on the menu. To
    make selections in the many of the **Preferences** dialogs, select the check boxes
    next to the options.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Under the **Behavior** tab, you''ll find a number of options for configuring
    the way Gnome-RPM installs, uninstalls and upgrades packages. The Behavior tab
    is split into five sections: Install, Upgrade, Other, Database and Architecture.
    Note that by default these boxes are not checked (see Figure 7–5, *Behavior Tab
    in Preferences*).


    # **Figure 7–5 Behavior Tab in Preferences**


    ![](img/eda1471ab4ce718c791c97a85559a478_169_0.png)


    Under **Install Options**, you have the following choices:


    +   - **No dependency checks** – When selected, this will install or upgrade a
    package without checking for other types of files on which the program may be
    dependent in order to work. However, unless you know what you''re doing we strongly
    suggest you not use this option as some packages may depend on other packages
    for files, libraries or programs to function correctly.

    +   - **No reordering** – This option is useful if RPM is unable to change the
    installation order of some packages to satisfy dependencies.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'In Other Options, you can select:


    +   * **Don’t install documentation** - Like `--excludedocs`, this option can
    save on disk space by excluding documentation such as man pages or other information
    related to the package.

    +   * **Install all files** - Installs all files in the package.


    The choices available in **Database Options** and **Architecture Options** allow
    you to decide, among other things, whether you want to perform a "test" installation
    (which will check for file conflicts without actually performing an install),
    or whether you want to exclude packages for other operating systems or system
    architectures.


    In the **Package Listing** tab, you’ll find a choice of displays for your packages:
    either **View as icons**, which will be graphical-based, or **View as list**,
    which is not graphical but can provide more information about the packages.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'In **Install Window**, you can specify the path through which Gnome-RPM can
