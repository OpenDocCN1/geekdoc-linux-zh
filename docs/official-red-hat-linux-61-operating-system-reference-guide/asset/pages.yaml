    filesystem across a network. These sections may be as small as a single directory,
    or include thousands of files in a vast hierarchy of directories. For example,
    many companies will have a single mail server with individuals'' mail files served
    as an NFS mount to each users'' local systems.


    To add an NFS mount:'
