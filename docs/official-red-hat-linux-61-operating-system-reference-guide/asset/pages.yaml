    */etc/sysconfig/network-scripts/chat-<interface-name>*


    This file is a chat script for PPP or SLIP connections, and is intended to establish
    the connection. For SLIP devices, a DIP script is written from the chat script;
    for PPP devices, the chat script is used directly.


    */etc/sysconfig/network-scripts/dip-<interface-name>*


    This write-only script is created from the chat script by netcfg. Do not modify
    this file. In the future, this file may disappear and instead will be created
