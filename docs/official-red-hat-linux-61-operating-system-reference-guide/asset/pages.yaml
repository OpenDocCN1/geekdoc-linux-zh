- pgno: 182
  md: '# # 8 Lightweight Directory Access Protocol (LDAP)


    # ## 8.1 What is LDAP?


    LDAP (Lightweight Directory Access Protocol) is a proposed open standard for global
    or local directory services over a network and/or the Internet. A directory, in
    this sense, is very much like a phone book. LDAP can handle other information,
    but at present it is typically used to associate names with phone numbers and
    e-mail addresses. Directories are designed to support a high volume of queries,
    but the data in the directory doesn''t change all that often.


    LDAP is much more useful than a paper phone book, because LDAP''s design is intended
    to support propagation over LDAP servers throughout the Internet, much like the
    Domain Name Service (DNS). The DNS system acts as the address book of the Internet
    by keeping track of domain name/IP address pairs. DNS servers tell networked machines
    where packets need to go. In the future, LDAP could provide the same type of global
    access to many types of directory information; at present, LDAP is more commonly
    used within a single large organization, like a college or a company, for directory
    services.


    LDAP is a client-server system. An LDAP client connects to an LDAP server and
    either queries for information or provides information that needs to be entered
    into the directory. The server either answers the query, refers the query to another
    LDAP server, or accepts the information for incorporation into the directory.


    LDAP is sometimes known as X.500 Lite. X.500 is an international standard for
    directories. X.500 is full-featured, but it is complex and requires lots of computing
    resources and the full OSI stack. LDAP, in contrast, can run easily on a PC and
    over TCP/IP. LDAP can access X.500 directories, but it does not support every
    capability of X.500.


    This chapter will refer to the configuration and use of OpenLDAP, an open source
    implementation of LDAP. OpenLDAP includes slapd, a stand-alone LDAP server;'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'slurpd, a stand-alone LDAP replication server; libraries implementing the LDAP
    protocol; utilities; tools; and sample clients.


    # 8.2 Pros and Cons of LDAP


    The main benefit of using LDAP is the consolidation of certain types of information
    within your organization. For example, all of the different lists of users within
    your organization can be merged into one LDAP directory. This directory can be
    queried by any LDAP-enabled applications that need this information. The directory
    can also be used by users who need directory information.


    Other LDAP benefits include its ease of implementation (compared to X.500), and
    its well-defined Application Programming Interface (API), which means that the
    number of LDAP-enabled applications and LDAP gateways should increase in the future.


    On the negative side, if you want to use LDAP, you’ll need LDAP-enabled applications
    or you’ll need to use LDAP gateways. As mentioned previously, LDAP will only increase
    in usage, but at present, there aren’t a plethora of LDAP-enabled applications
    available for Linux. Also, while LDAP does support some access control, it does
    not support as many security features as X.500.


    # 8.3 Uses for LDAP


    Several Netscape applications, including Netscape Roaming Access are LDAP-enabled.
    Sendmail 8.[89].x can use LDAP to look up addresses. Your organization can use
    LDAP as an organization-wide directory and/or name service (in place of NIS or
    flat files). You can even use a personal LDAP server to keep track of your own
    e-mail address book (see Section 8.10, *LDAP Resources on the Web*).


    LDAP can be used as an authentication service via the pam_ldap module. LDAP is
    commonly used as a central authentication server so that users have a unified
    login that covers console logins, POP servers, IMAP servers, machines connected
    to the network using Samba, and even Windows NT machines. All of these login situations
    can rely on the same user ID and password combination, using LDAP.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# 8.4 LDAP Terminology


    An **entry** is one unit in an LDAP directory. An entry is identified or referenced
    by its unique **Distinguished Name** (DN).


    An entry has attributes; attributes are pieces of information which are directly
    associated with the entry. For example, an organization could be an LDAP entry.
    Attributes associated with the organization might be its fax number, its address,
    and so on. People can also be entries in the LDAP directory. Common attributes
    for people include their telephone numbers and their e-mail addresses.


    Certain attributes are required, while other attributes are optional. An **objectclass**
    sets which attributes are required and which are optional. Objectclass definitions
    are found in the `slapd.oc.conf` file.


    The **LDAP Data Interchange Format** (LDIF) is an ASCII text format for LDAP entries.
    Files that import or export data to and from LDAP servers must be in LDIF format.
    An LDIF entry looks like this:


    ```

    [<id>]

    dn: <distinguished name>

    <attrtype>: <attrvalue>

    <attrtype>: <attrvalue>

    <attrtype>: <attrvalue>

    ```


    An entry can contain as many `<attrtype>: <attrvalue>` pairs as needed. A blank
    line indicates that the entry is finished and that another entry is about to begin.


    Everything enclosed within `< >` is variable, and can be set by you when you add
    an LDAP entry, with the exception of the `<id>`. The `<id>` is a number normally
    set by the LDAP tools when you add an entry, and you''ll probably never need to
    manually set one.


    # 8.5 OpenLDAP Files


    OpenLDAP configuration files are installed into the `/etc/openldap` directory.
    If you do an `ls` on `/etc/openldap`, you''ll see something like:


    ```

    $ ls

    ldap.conf              ldapsearchprefs.conf    slapd.at.conf      slapd.oc.conf

    ldappfilter.conf       ldaptemplates.conf      slapd.conf

    ```'
  merge: -1
  img_proc: true
- pgno: 185
  md: "The files you should know about are **slapd.conf**, **slapd.at.conf** and **slapd.oc.conf**.\
    \ The **slapd.conf** file contains configuration information for the **slapd**\
    \ daemon and for all of the database back-ends. You will need to make some changes\
    \ to **slapd.conf** before you start the **slapd** daemon.\n\nThe **slapd.at.conf**\
    \ file holds **attribute syntax definitions** for the LDAP directory. Attribute\
    \ syntax definitions describe the type of information that the attribute provides.\
    \ You have five choices:\n\n+   * bin -- binary information\n+   * ces -- case\
    \ exact string (a string whose case matters)\n+   * cis -- case ignore string\
    \ (a string whose case doesn't matter)\n+   * tel -- a telephone number (blank\
    \ spaces and hyphens are ignored)\n+   * dn -- the distinguished name\n\nFor example,\
    \ here are attribute syntax definitions from a typical **slapd.at.conf**:\n\n\
    ```\nattribute      photo                 bin\nattribute      personalsignature\
    \     bin\nattribute      jpegphoto             bin\nattribute      audio    \
    \             bin\nattribute       labeledurl           ces\nattribute       ref\
    \                 ces\nattribute       userpassword         ces\nattribute   \
    \    telephonenumber      tel\n```\n\nCertain LDAP-enabled applications may require\
    \ that you edit the **slapd.at.conf** file, usually to add particular attribute\
    \ syntax definitions.\n\nThe **slapd.oc.conf** file includes the **objectclass\
    \ definitions** for an LDAP directory. The objectclass definitions state which\
    \ attributes are required and which attributes are optional for particular objectclasses.\n\
    \nThe following excerpt from a typical **slapd.oc.conf** file contains the objectclass\
    \ definitions for the top, alias, and referral objectclasses:\n\n```\nobjectclass\
    \ top\n    requires     top\n```"
  merge: -1
  img_proc: true
- pgno: 186
  md: "```\n```text\n              objectClass\n            \n  objectClass alias\n\
    \              requires\n                aliasedObjectName,\n                objectClass\n\
    \      \n  objectClass referral\n              requires\n                ref,\n\
    \                objectClass\n```\n```\n\nYou may need to edit the objectclass\
    \ definitions in your slapd.oc.conf, depend-ing upon how you're going to use your\
    \ LDAP directory. For example, if you're creating an LDAP directory of employees\
    \ for use in your organization, you'll prob-ably have specific required attributes\
    \ for certain objectclasses that might not be used outside the organization (e.g.,\
    \ an employee ID number internal to your organization might be a required attribute\
    \ for an objectclass of \"person\").\n\n# ## 8.6 OpenLDAP Daemons and Utilities\n\
    \nThe OpenLDAP package includes two daemons: slapd and slurpd. The slapd daemon\
    \ is the stand-alone LDAP daemon, which you'll need to run to support LDAP.\n\n\
    The slurpd daemon controls the replication of LDAP directories over a network.\
    \ Slurpd sends changes from the master LDAP directory to slave LDAP directories.\
    \ You won't need to run slurpd unless you have more than one LDAP server on your\
    \ network. If you have two or more LDAP servers, you'll need to run slurpd to\
    \ keep the LDAP directories in sync.\n\nOpenLDAP also includes some utilities\
    \ for adding, modifying and deleting entries in an LDAP directory. The ldapmodify\
    \ tool is used to modify entries in an LDAP database. The ldapadd utility is used\
    \ to add entries to your directory (ldapadd is actually a hard link to ldapmodify\
    \ -a). Ldapsearch is used to search for entries and ldapdelete is used to delete\
    \ entries. The ldif2ldbm tool converts an LDIF file into an LDBM back-end database.\n\
    \nSee their man pages for more information on all of these utilities."
  merge: -1
  img_proc: true
- pgno: 187
  md: '# ## 8.7 Modules for Adding Extra Functionality to LDAP


    Red Hat Linux includes the following packages which add functionality to LDAP:


    The `nss_ldap` module is an LDAP module for the **Solaris Nameservice Switch (NSS)**.
    NSS is a set of C library extensions necessary for accessing LDAP directory information,
    instead of or in addition to the **Network Information Service** (NIS name service
    and/or flat files. The `nss_ldap` module is needed to use LDAP as a native name
    service.


    The `pam_ldap` module is needed to integrate LDAP authentication into the Plu-gable
    Authentication Modules (PAM) API. If you use `pam_ldap`, users can au-thenticate
    and change their password using LDAP directories. The `nss_ldap` and `pam_ldap`
    modules are provided in the `nss_ldap` package.


    Red Hat Linux also includes LDAP modules for the Apache Web server. The `auth_ldap`
    module is for authenticating HTTP clients against the user entries in an LDAP
    directory. The `php-1dap` module adds LDAP support to the PHP3 HTML-embedded scripting
    language. The `auth_ldap` and `php-1dap` modules will need to be compiled into
    Apache as **Dynamic Shared Objects** (DSOs).


    # ## 8.8 LDAP How To: A Quick Overview


    This section provides a quick overview of the steps you ’ll need to take to get
    an LDAP directory working.


    +   1. Make sure the `openldap` RPM, and any other LDAP-related RPMs that you
    need, are installed.

    +   2. See either the Quick Start Guide at the OpenLDAP site (http://www.opendap.org/faq/data/cache/172.html;
    start at “Create configuration file for slapd, ” since the LDAP files are already
    installed), or see the Linux-LDAP HOWTO (http://www.linuxdoc.org/HOWTO/LDAP-HOWTO-HOWTO.html)
    for instructions on using LDAP on your system. Both cover the rest of these steps.

    +   3. Edit the `slapd.conf` file to get it right for your system.

    +   4. Start `slapd`.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '+   5.  Create your LDAP directory (examples of LDAP entries are provided at
    the PADL Software website at http://www.padl.com/ldap_examples.html).


    +   6.  Add entries to your LDAP directory with ldapadd or with a script.


    +   7.  Use ldapsearch to see if slapd is working.


    +   8.  At this point, your LDAP directory should exist.  The next step is to
    configure your LDAP-enabled applications so that they can use the LDAP directory.


    # ## 8.9 Configuring Your System to Authenticate Using OpenLDAP


    This section provides a brief overview of how to configure your Red Hat Linux
    system to authenticate using OpenLDAP. Unless you’re an OpenLDAP expert, you will
    probably need more documentation than is provided here. Please refer to the references
    pro- vided in Section 8.10, LDAP Resources on the Web for more information.


    # ### 8.9.1 Install the Necessary LDAP Packages


    First, you’ll need to make sure that the appropriate packages are installed on
    both the LDAP server and the LDAP client machines. The LDAP server needs the openldap
    package.


    The LDAP client machines need the following packages installed: openldap, auth\_ldap,
    nss\_ldap and pam\_ldap.


    # ### 8.9.2 Edit Configuration Files


    #### Edit /etc/openldap/slapd.conf


    The slapd.conf file, located in /etc/openldap, contains the configuration information
    needed by your slapd LDAP server. You’ll need to edit this file to make it specific
    to your domain and your server.


    The suffix line names the domain for which the LDAP server will provide informa-
    tion. The suffix line should be changed from:'
  merge: -1
  img_proc: true
- pgno: 189
  md: '```

    suffix "dc=acmewidgets, dc=com"

    ```

    or

    ```

    suffix "dc=acmeuniversity, dc=org"

    ```


    The rootdn entry is the DN for a user who is unrestricted by the access control
    or administrative limit parameters set for operations on the LDAP directory. The
    rootdn user can be thought of as the root user for the LDAP directory. The rootdn
    line needs to be changed from:

    ```

    rootdn "cn=root, dc=your-domain, dc=com"

    ```

    to something like:

    ```

    rootdn "cn=root, dc=redhat, dc=com"

    ```

    or

    ```

    rootdn "cn=ldapmanager, dc=my_organization, dc=org"

    ```


    Change the rootpw line from:

    ```

    rootpw secret

    ```

    to something like

    ```

    rootpw {crypt}$4l9sOIJo4kBM

    ```


    In the above example, you’re using an encrypted root password, which is a much
    better idea than leaving a plain text root password in the `slapd.conf` file.
    To make this crypt string, you should either copy it out of a `passwd` file, or
    use Perl:

    ```

    perl -e "print crypt(''passwd'',''a_salt_string'');"

    ```

    In the previous Perl line, `salt_string` is a two character salt, and `passwd`
    is the plain text version of the password.

    You could also copy a `passwd` entry out of `/etc/passwd`, but this won’t work
    if the `passwd` entry is an MD5 password (the default in Red Hat Linux 6.2).


    # Edit `ldap.conf`


    Edit the `ldap.conf` files in `/etc` and in `/etc/openldap` on the LDAP server
    and clients.'
  merge: -1
  img_proc: true
