    # 10.11.2 LILO Configuration


    Choose where you want to install LILO (Figure 10–24, *Installing LILO in LILO
    Configuration Dialog* ).


    ![](img/eda1471ab4ce718c791c97a85559a478_241_0.png)


    You may install LILO in one of two places:'
