  md: 'machine and walks away, their privileges are wide open for the next person
    who sits down at their desk. Silently granted privileges are less risky if used
    on machines in a physically restricted area.


    **May use linuxconf:** the user is allowed to access all of *linuxconf*''s capabilities,
    and they can set up or change **linuxconf** parameters. Note that use of **linuxconf**
    is separate from the privilege of activating configuration changes. System administrators
    might want to grant the use of *linuxconf*, but deny the activation privilege,
    so that the sysadmin has a final "yes/no" on whether to activate any configuration
    changes.


    **May activate config changes:** After you change a parameter in *linuxconf*,
    at some point you’ll have to indicate to *linuxconf* that the changes you made
    should be applied. Depending upon the flavor of *linuxconf* that you’re using,
    you might do this by clicking on an **Activate the changes** button in GUI *linuxconf*,
    or clicking on an **Accept** button in Web-based *linuxconf*, or selecting an
    **Accept** button in text-mode *linuxconf*, etc.


    You can grant the privilege of activating changes to a user. In that case, the
    user will be able to activate any changed system configuration parameters in *linuxconf*.


    **May shutdown:** A user can be granted the right to shutdown the system. Note
    that Red Hat Linux is set in `/etc/inittab` to cleanly shutdown following the
    [Ctrl]-[Alt]-[Del] keystroke combination.


    Once you have entered the login name and any other desired information select
