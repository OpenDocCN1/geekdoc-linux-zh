  md: "+   – `no` -- Networking should not be configured.\n\n+   • `HOSTNAME=hostname`,\
    \ where *hostname* should be the FQDN (Fully Qualified Domain Name), but can be\
    \ whatever hostname you want.\n\n> **Please Note**\n> \n> For compatibility with\
