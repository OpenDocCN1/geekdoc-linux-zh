    # 3.2.2 Loading Kernel Modules


    The Linux kernel has a modular design. At boot time, only a minimal **resident**
    kernel is loaded into memory. Thereafter, whenever a user requests a feature that
    is not present in the resident kernel, a kernel **module** is dynamically loaded
    into memory. After a specified period of inactivity, the module may be removed
    from memory. This design promotes leanness and efficiency.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'The mechanism that supports dynamic loading of modules is a kernel thread called
    kmod. When the kernel requests a module, kmod wakes up and calls modprobe(8) to
    get it.


    When you install Red Hat Linux, the hardware on your system is probed and you
    provide information about how the system will be typically used and which programs
    should be loaded.  Based on this probing and the provided usage information, the
    installation program decides which features to compile into the resident kernel
    and which to put in loadable modules, and sets up the dynamic loading mechanism
    to work transparently.  But this is a highly configurable procedure.  If you build
    your own custom kernel, you can make all of these decisions for yourself.


    If you add new hardware after installation requiring support provided in a kernel
    mod- ule, you need to set up the dynamic loading mechanism.  You do this by editing
    the module configuration file, /etc/conf.modules.


    For example, if at the time you installed Red Hat Linux your system included a
    model SMC EtherPower 10 PCI network adapter, the module configuration file will
    contain this line: alias eth0 tulip. If, after installation, you install a second
    identical network adapter to your system, add this line to /etc/conf.modules:
    alias eth1 tulip.


    See Appendix A, General Parameters and Modules for an alphabetical list of kernel
    modules and the hardware the modules support.


