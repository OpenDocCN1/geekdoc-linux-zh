- pgno: 236
  md: 'Once you’ve selected fdisk, you’ll be presented with the **Partition Disks**
    dialog box (Figure 10–21, Disk Setup Dialog). In this box is a list of every disk
    on your computer. Using [Tab], and the [Up] and [Down] arrow keys, highlight the
    disk you’d like to partition, select **Edit**, and press [Space].


    You will then enter fdisk and can partition the disk you selected. Repeat this
    process for each disk you want to partition. When you’re finished, select **Done**.


    # Figure 10–21 Disk Setup Dialog


    ![](img/eda1471ab4ce718c791c97a85559a478_236_0.png)


    # An Overview of fdisk


    fdisk includes online help which is terse but useful. Here are a few tips:


    +   - The command for help is m.

    +   - To list the current partition table, use the p command (see Figure 10–22,
    *Sample Output from fdisk*).

    +   - To add a new partition, use n.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '+   Linux fdisk creates partitions of type Linux native by default. When you
    create a swap partition, don''t forget to change it to type Linux swap using the
    t command. The value for the Linux swap type is 82. For other partition types,
    use the I command to see a list of partition types and values.


    +   Linux allows up to four (4) partitions on one disk. If you wish to create
    more than that, one (and only one) of the four may be an extended partition, which
    acts as a container for one or more logical partitions. Since it acts as a container,
    the extended partition must be at least as large as the total size of all the
    logical partitions it is to contain.


    +   It’s a good idea to write down which partitions (e.g., /dev/hda2) are meant
    for which file systems (e.g., /usr) as you create each one.


    # Please Note


    None of the changes you make take effect until you save them and exit fdisk using
    the w command. You can quit fdisk at any time without saving changes by using
    the q command.'
  merge: -1
  img_proc: true
