    auth    sufficient   /lib/security/pam_rhosts_auth.so

    auth    required     /lib/security/pam_pwdb.so shadow nullok

    auth    required     /lib/security/pam_nologin.so

    ```


    That looks *almost* like the *login* entry, but there’s an extra line specifying
    an extra module, and the modules are specified in a different order.


    First, *pam_security.so* keeps root logins from happening on insecure terminals.
    This effectively disallows all root *rlogin* attempts. If you wish to allow them
    (in which case we recommend that you not be Internet-connected or be behind a
    good firewall), you can simply remove that line.


    Second, if *pam_rhosts_auth.so* authenticates the user, PAM immediately returns
    success to *rlogin* without any password checking. If *pam_rhosts_auth.so* fails
    to authenticate the user, that failed authentication is ignored.


    Third, if *pam_rhosts_auth.so* has failed to authenticate the user, the *pam_pwdb.so*
    module performs normal password authentication.


    Finally *pam_nologin.so* checks */etc/nologin*, as specified above.


    Note that if you do not want to prompt for a password if the security check fails,
    you can change the *pam_security.so* module from *required* to *requisite*.'
  merge: -1
  img_proc: true
