    the group to which its function belongs.


    In the right column, you’ll find the date of the package’s installation on your
    machine, the date the package was built, the name of the vendor and the name of
    the group who packaged the software. If the package has not been installed on
    your machine, that space will simply read, "not installed." Clicking on the name
    following **Packager** will cause your browser’s e-mail application to open in
    compose, so that you can write to the packager.


    Centered at the bottom of the information list is the URL of the application’s
    developer (see Figure 7-11, *URL in the Query Window*). Similar to the e-mail
    function of'
