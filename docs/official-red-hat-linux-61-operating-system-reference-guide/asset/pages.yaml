- pgno: 242
  md: '**WARNING**


    To create a dual-boot environment on a system that currently has NT, you must
    install LILO on the first sector of the root partition, not the MBR. Please be
    sure to create a boot disk. In a case such as this, you will either need to use
    the boot disk, or configure the NT system loader to boot LILO from the first sector
    of the root partition. Be sure to check out http://www.lin-uxdoc.org/HOWTO/mini/Linux+NT-Loader.html
    for more information on setting up LILO and NT.


    # The Master Boot Record (MBR)


    The recommended place to install LILO, unless the MBR already starts another OS
    loader, such System Commander or OS/2''s Boot Manager. The MBR is a special area
    on your hard drive that is automatically loaded by your computer''s BIOS, and
    is the earliest point at which LILO can take control of the boot process. If you
    install LILO in the MBR, when your machine boots, LILO will present a `boot:`
    prompt. You can then boot Red Hat Linux or any other operating system you configure
    LILO to boot.


    # The first sector of your boot partition


    Recommended if you are already using another boot loader on your system (such
    as OS/2''s Boot Manager). In this case, your other boot loader will take control
    first. You can then configure that boot loader to start LILO (which will then
    boot Red Hat Linux).


    Select the location where you wish to install LILO and press **OK**.


    Finally the installation program lets you set the default operating system and
    specify boot labels, as in Figure 10–25, *Selecting Bootable Partitions in LILO
    Configuration Dialog*.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Figure 10-25 Selecting Bootable Partitions in LILO Configuration Dialog


    ![](img/eda1471ab4ce718c791c97a85559a478_243_0.png)


    Every partition that is bootable is listed, including partitions used by other
    operating systems. The **Boot label** column will be filled in with the word `linux`
    on the partition holding your Red Hat Linux system''s root filesystem. Other partitions
    may also have boot labels (such as a dos boot label for Windows 95/98 partitions).


    To add a boot label for a partition (or change an existing boot label), use the
    arrow keys to highlight the desired partition. Then use the [Tab] key to select
    the **Edit** button, and press [Space]. You''ll then see a small dialog box permitting
    you to enter/modify the partition''s boot label. Press OK when done.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '> Tip

    > The contents of the **Boot label** column show what you will need to enter at
    LILO''s `boot:` prompt in order to boot the desired operating system. Should you
    forget the boot labels defined on your system, press [Tab] at LILO''s `Boot:`
    prompt to display a list of defined boot labels.


    There is also a column labeled **Default**. Only one partition will contain an
    asterisk under that column. The partition marked as the default will be the partition
