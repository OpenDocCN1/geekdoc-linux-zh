    # 2.3.3 User Private Groups


    Red Hat Linux uses a **user private group** (UPG) scheme, which makes UNIX groups
    much easier to use. The UPG scheme does not add or change anything in the standard
    UNIX way of handling groups. It simply offers a new convention for handling groups.
    Whenever you create a new user, by default, he or she has a unique group. The
    scheme works as follows:


    *User Private Group*

    Each user has their own primary group, of which only they are a member.

    *umask = 002*'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'The traditional UNIX umask is 022, which prevents other users and *other members
    of a user’s primary group* from modifying a user’s files. Since every user has
    their own private group in the UPG scheme, this “group protection” is not needed.
    A umask of 002 will prevent users from modifying other users’ private files. The
    umask is set in /etc/profile.


    # setgid bit on Directories


    If you set the setgid bit on a directory (with chmod g+s directory), files created
    in that directory will have their group set to the directory’s group.


    Most IT organizations like to create a group for each major project and assign
    people to the groups they should be in. Managing files traditionally has been
    difficult, though, because when someone creates a file it is owned by the primary
    group he or she belongs to. When a single person works on multiple projects, it
    becomes hard to associate the right files to the right ownership group. In the
    UPG scheme, groups are automatically assigned to files on a project-by-project
    basis, which makes managing group projects very simple.


    Let’s say you have a big project called *devel*, with many people editing the
    *devel* files in a *devel* directory. Make a group called *devel*, chgrp the *devel*
    directory to *devel*, and add the all the *devel* users to the *devel* group.
    Now, all *devel* users will be able to edit the *devel* files and create new files
    in the *devel* directory, and these files will always retain their *devel* group.
    Thus, they will always be edit-able by other *devel* users.


    If you have multiple projects like *devel*, and users who are working on multiple
    projects, these users will never have to change their umask or group when they
    move from project to project. The setgid bit on each project’s main directory
    “selects” the proper group.


    Since each user’s home directory is owned by the user and their private group,
    it is safe to set the setgid bit on the home directory. However, by default, files
    are created with the primary group of the user, so the setgid bit would be redundant.


    # User Private Group Rationale


    Although UPG is not new to Red Hat Linux 6.2, many people still have questions
    about it, such as why UPG is necessary. The following is the rationale for the
    scheme.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   * You’d like to have a group of people work on a set of files in say, the
    `/usr/lib/emacs/site-lisp` directory. You trust a few people to mess around in
    there, but certainly not everyone.


    +   * So you enter:

    +       `chown -R root.emacs /usr/lib/emacs/site-lisp`

    +       and you add the proper users to the group.


    +   * To allow the users to actually create files in the directory you enter:

    +       `chmod 775 /usr/lib/emacs/site-lisp`


    +   * But when a user creates a new file it is assigned the group of the user’s
    default group (usually `users`). To prevent this you enter:

    +       `chmod 2775 /usr/lib/emacs/site-lisp`

    +       which causes everything in the directory to be created with the "emacs"
    group.


    +   * But the new file needs to be mode 664 for another user in the emacs group
    to be able to edit it. To do this you make the default umask 002.


    +   * Well, this all works fine, except that if your default group is "users,"
    every file you create in your home directory will be writable by everybody in
    "users" (usually everyone).


    +   * To fix this, you make each user have a "private group" as their default
    group.


    At this point, by making the default umask 002 and giving everyone a private default
    group, you can easily set up groups that users can take advantage of without doing
    any magic. Just create the group, add the users, and do the above `chown` and
    `chmod` on the group’s directories.


    # **2.4 Configuring Console Access**


    When normal (non-root) users log in to a computer locally, they are given two
    types of special permission: they can run certain programs that they would not
    otherwise'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'be able to run, and they can access certain files (normally special device
    files used to access diskettes, CD-ROMS, and so on) that they would not otherwise
    be able to access.


    Since there are multiple consoles on a single computer, and multiple users can
    be logged into the computer locally at the same time, one of the users has to
    "win" the fight to access the files. The first user to log in at the console owns
    those files. Once the first user logs out, the next user who logs in will own
    the files.


    In contrast, *every* user who logs in at the console will be allowed to run programs
    normally restricted to the root user. By default, those programs will ask for
    the user’s password. This will be done graphically if X is running which makes
    it possible to include these actions as menu items in a graphical user interface.
    As shipped, the console-accessible programs are `shutdown`, `halt`, and `reboot`.


    # ## 2.4.1 Disabling Console Program Access


    In environments where the console is otherwise secured (BIOS and LILO passwords
    are set, [Ctrl]-[Alt]-[Delete] is disabled, the power and reset switches are disabled,
    etc.), it may not be desirable to allow arbitrary users at the console to run
    `shutdown`, `halt`, and `reboot`.


    In order to disable all access by console users to console programs, you should
    run the command:


    ```

    ```

    rm -f /etc/security/console.apps/*

    ```

    ```


    # ## 2.4.2 Disabling All Console Access


    In order to disable all console access, including program and file access, in
    the `/etc/pam.d/` directory, comment out all lines that refer to `pam_console.so`.
    The following script will do the trick:


    ```

    ```

    cd /etc/pam.d

    for i in * ; do

    sed ''s/^\#\s*pam_console.so/s/^\#\s*< $1 > foo && \# foo $1/'' $i > $i.new &&
    mv $i.new $i

    done

    ```

    ```'
  merge: -1
