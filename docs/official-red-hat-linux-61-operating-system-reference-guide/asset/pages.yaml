- pgno: 248
  md: '![](img/eda1471ab4ce718c791c97a85559a478_248_0.png)


    If no mouse is detected, you’ll have to select one manually.


    To determine your mouse’s interface, follow the mouse cable back to where it plugs
    into your system. If the connector at the end of the mouse cable plugs into a
    rectangular connector, you have a serial mouse. On the other hand, if the connector
    is round, you have a PS/2 mouse. If you are installing Red Hat Linux on a laptop
    computer, in most cases the pointing device will be PS/2 compatible.


    If you cannot find an exact match, select one of the **Generic** entries, based
    on your mouse’s number of buttons, and its interface.


    The **Emulate 3 Buttons** check box allows you to emulate a three-button mouse
    if your mouse only has two buttons. If you select this check box, you can simulate
    the third, "middle" button by pressing both mouse buttons simultaneously. If you
    have a two-button mouse, checking this box is a good idea, since the X Window
    System is easiest to use with a three-button mouse.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'If you’ve selected a mouse with a serial interface, highlight the appropriate
    serial port, select **OK**, and press [Space].


    # Tip


    To change your mouse configuration after you have booted your Red Hat Linux system,
    become root and use the /usr/sbin/mouseconfig command.


    To configure your mouse as a left-handed mouse after you have booted your Red
    Hat Linux system, open a terminal and type gpm -B 321.


    # 10.15 Configuring the Time Zone


    Next, enter your system’s time zone (see Figure 10–29, Time Zone Selection Dialog).


    ![](img/eda1471ab4ce718c791c97a85559a478_249_0.png)'
  merge: -1
  img_proc: true
- pgno: 250
  md: "Notice that the screen shows the current time for your system. When you select\
    \ different time zones, the current time also changes. Make sure that when you\
    \ select your proper time zone, that the current time seen is also correct.\n\n\
    If you wish to set the hardware (CMOS) clock to GMT (Greenwich Mean Time, also\
    \ known as UTC, or Universal Coordinated Time), select **Hardware clock set to\
    \ GMT**. Setting it to GMT means your system will properly handle daylight-saving\
    \ time, if your time zone uses it.\n\n> > **WARNING**\n> \n> If your computer\
    \ uses another operating system, setting the clock to GMT may cause the other\
    \ operating system to display the incorrect time. Also keep in mind that if more\
    \ than one operating system is allowed to automatically change the time to compensate\
    \ for daylight saving time, it is likely that the time will be improperly set.\n\
    \nSelect your time zone from the list and press [Enter].\n\n> > **Tip**\n> \n\
    > To change your time zone configuration after you have booted your Red Hat Linux\
    \ system, use the `/usr/sbin/timeconfig` command.\n\n# ## 10.16 Setting a Root\
    \ Password\n\nThe **Root Password** dialog prompts you to set a **root password**\
    \ for your system. You’ll use the root password to log into your Red Hat Linux\
    \ system to perform system administration functions."
  merge: -1
  img_proc: true
- pgno: 251
  md: '# **Figure 10–30** Root Password Dialog


    ![](img/eda1471ab4ce718c791c97a85559a478_251_0.png)


    The root password must be at least six characters long; the password you type
    is not echoed to the screen. You must enter the password twice; if the two passwords
    do not match, the installation program will ask you to enter them again.


    > You should make the root password something you can remember, but not something
    that is easy for someone else to guess. Your name, your phone number, **qwerty**,
    **password**, **root**, **123456**, and **anteater** are all examples of poor
    passwords. Good passwords mix numerals with upper and lower case letters and do
    not contain dictionary words: **Aard387vark** or **420BMttNT**, for example. Remember
    that the password is case-sensitive. Write down this password and keep it in a
    secure place.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# 10.17 Creating a User Account


    Next, you can create a user account for yourself which is for your everyday use
    (as in Figure 10–31, *Add User Dialog*). If you do not create a user account,
    after installation you''ll have to log in as the **root user** (also known as
    the **superuser**). Root has complete access to the entire system. Logging in
    as the root user is best done *only* to perform system maintenance or administration.
    For instructions on how to create or modify user accounts after installation,
    refer to Chapter 3, *System Configuration* or the *Getting Started* chapter in
    the *Official Red Hat Linux Getting Started Guide*.


    ![](img/eda1471ab4ce718c791c97a85559a478_252_0.png)


    ![](img/eda1471ab4ce718c791c97a85559a478_252_1.png)


    If you choose to create a user account, the account directory will be created
    under the path `/home` (for example, `/home/cla ire`). Passwords are case-sensitive
    and must contain at least six characters.


    After you add a user account for yourself, the **User Account Setup** dialog (Figure
    10–32, *User Account Setup Dialog*) appears, giving you the opportunity to create
    additional accounts. Select **Add** to do so or **OK** to continue.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Figure 10–32 User Account Setup Dialog


    ![](img/eda1471ab4ce718c791c97a85559a478_253_0.png)


    If you are performing a workstation- or server-class installation, your next task
    is to confirm your video hardware: turn to Section 10.20, *Configuring Your Video
    Adapter*. Otherwise, continue reading.


    # 10.18 Authentication Configuration


    If you are performing a custom installation, your next step is to configure the
    type of password authentication your Red Hat Linux system will use (see Figure
    10–33, *Authentication Configuration Dialog*). You will also have the opportunity
    to configure NIS support; if you are unsure as to whether or not you should do
    this, ask your network administrator.'
  merge: -1
  img_proc: true
- pgno: 254
  md: "![](img/eda1471ab4ce718c791c97a85559a478_254_0.png)\n\nHere’s a brief explanation\
    \ of the authentication password prompts:\n\n+   * **Use Shadow Passwords** --\
    \ provides a very secure method of retaining passwords for you. The password filed\
    \ in the `/etc/passwd` file is replaced by `/etc/shadow` which is readable only\
    \ by *root*.\n+   * **Enable MD5 Passwords** -- allows a long password to be used\
    \ (up to 256 characters) instead of the standard eight letters or less.\n+   *\
    \ **Enable NIS** -- allows you to run a group of computers in the same Network\
    \ Information Service domain with a common password and group file. There are\
    \ two options here to choose from:\n+   \t* **NIS Domain** -- this option allows\
    \ you to specify which domain or group of computers your system will belong to."
  merge: -1
  img_proc: true
- pgno: 255
  md: '+   NIS Server -- this option causes your computer to use a specific NIS server,
    rather than "broadcasting" a message to the local area network asking for any
    available server to host your system.


    **Please Note**


    to configure the NIS option, you must be connected to an NIS network. If you are
    unsure whether you are connected to an NIS network, please ask your network administrator.


    Unless you are setting up NIS, you will notice that both shadow passwords and
    MD5 passwords are selected. We recommend you use both to make your machine as
    secure as possible.


    # 10.19 Select Packages to Install


    Figure 10-34. *Package Group Selection Dialog* appears only if you’re performing
    a custom-class installation. Use this dialog to select the types of software packages
    you wish to install.'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'Figure 10-34 Package Group Selection Dialog


    ![](img/eda1471ab4ce718c791c97a85559a478_256_0.png)


    Selecting **Everything** (which can be found at the end of the component list)
    installs all packages included with Red Hat Linux. Selecting every package will
    require close to 1.7GB of free disk space.


    # 10.19.1 Selecting Individual Packages


    You can also select or deselect individual packages in an application category.
    To do this, check the **Select individual packages** check box. When you select
    **OK**, a screen like Figure 10-35, *Selecting Individual Packages in Package
    Group Selection Dialog* appears.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '**Figure 10-35  Selecting Individual Packages in Package Group Selection Dialog**


    ![](img/eda1471ab4ce718c791c97a85559a478_257_0.png)


    To see the list of packages in the **Applications/Editors** category, for example,
    use the arrow keys to select this group and press [Enter] or [Space]. When you
    do, the + sign (closed) changes to a - sign (open) and a list of packages in this
    category appears. An * appears beside currently selected packages. Press the [Enter]
    or [Space] keys to select or deselect packages.


    To see a description of a particular package, make sure that package is highlighted
    and press [F1].


    Note that some packages that are required for every Red Hat Linux system (such
    as the kernel and certain libraries) do not appear in the package selection dialogs.


    # 10.19.2 Unresolved Package Dependencies


    Many software packages, in order to work correctly, require that other software
    packages are also installed on your system. For example, many of the graphical
    system administration tools require the `python` and `pythonlib` packages. To
    make sure'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'your system has all the packages it needs in order to be fully functional,
    Red Hat Linux checks these package **dependencies** each time you install or remove
    software packages.


    # Figure 10-36 Package Dependencies Dialog


    ![](img/eda1471ab4ce718c791c97a85559a478_258_0.png)


    After you have finished selecting packages to install, the installation program
    checks the list of selected packages for dependencies. If any package requires
    another package which you have not selected to install, the program presents a
    list of these **unresolved dependencies** and gives you the opportunity to resolve
    them (see Figure 10-36, *Package Dependencies Dialog*). If you simply press **OK**,
    the program will resolve them automatically by adding all required packages to
    the list of selected packages.


    # 10.20 Configuring Your Video Adapter


    The installation program then probes for your video card. If your card is detected,
    click **OK** to continue.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '![](img/eda1471ab4ce718c791c97a85559a478_259_0.png)


    If the installation program cannot detect your video adapter, you’ll see Figure
    10–38, *Video Card Selection Dialog*. In this case, select your video card from
    the list using the arrow keys and [Space].'
  merge: -1
  img_proc: true
- pgno: 260
  md: '![](img/eda1471ab4ce718c791c97a85559a478_260_0.png)


    # 10.21 Package Installation


    Figure 10–39, Installation to Begin Dialog appears when the installation program
    is ready to format partitions and load software packages. The installation program
    names the log file (/tmp/install.log) for this Red Hat Linux installation. Select
    OK and press [Space] to continue.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Figure 10-39 Installation to Begin Dialog


    ![](img/eda1471ab4ce718c791c97a85559a478_261_0.png)


    While software packages are being installed, a screen like Figure 10-40, *Package
    Installation Status Dialog* appears.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Figure 10–40 Package Installation Status Dialog


    ![](img/eda1471ab4ce718c791c97a85559a478_262_0.png)


    As each software package is installed, the top part of the **Package Installation**
    screen displays its name, size, and a summary description of its function.


    In the bottom part of the **Package Installation** screen, the **Total** row shows
    the total number of packages to be installed, the total size of all packages,
    and the amount of time required to install all packages. As each package begins
    and completes installation, the completed and remaining rows are updated.


    If you are performing a server-class installation, you are almost finished; turn
    to Section 10.24, *Finishing Up*.


    # 10.22 Configuring the X Window System


    If you are performing a workstation- or a custom-class installation and you have
    chosen to install the X Window System, the X *onfigurator* utility starts and
    gives you the opportunity to configure the X server for your system. If you are
    performing'
  merge: -1
  img_proc: true
- pgno: 263
  md: "a server-class installation or you did not choose to install the X Window System,\
    \ skip ahead to Section 10.24, *Finishing Up*.\n\nFirst, `Xconfigurator` presents\
    \ a list of monitors (see Figure 10–41, *Monitor Setup Dialog*). If your monitor\
    \ is listed, select it and press [Enter]. Otherwise, select **Custom**.\n\n# **Figure\
    \ 10–41   Monitor Setup Dialog**\n\n![](img/eda1471ab4ce718c791c97a85559a478_263_0.png)\n\
    \nIf you select **Custom**, `Xconfigurator` prompts you to select the horizontal\
    \ sync range and vertical sync range of your monitor (these values are usually\
    \ available in the documentation which accompanies your monitor, or from your\
    \ monitor’s vendor or manufacturer).\n\n> **CAUTION**\n> \n> Do not select any\
    \ range that exceeds the capacity of your monitor. If you do this, it is possible\
    \ you may overclock your monitor and damage or destroy it."
  merge: -1
  img_proc: true
- pgno: 264
  md: 'After you''ve selected your monitor, the program starts to probe your video
    card. To bypass the probe and enter scan ranges and display modes manually, select
    **Do Not Probe**. This option is provided because an unsuccessful probe of your
    video card could cause your system not to boot properly or a program to hang.
    While the probe is in progress, it is normal for your display to blink. When the
    probe is finished, Figure 10–42, *Probing Finished* appears, displaying the results
    of the probe.


    # Figure 10–42  Probing Finished


    ![](img/eda1471ab4ce718c791c97a85559a478_264_0.png)


    Select **Use Default** to accept the displayed color depth and resolution. If
    you select **Let Me Choose**, the **Select Video Modes** dialog (Figure 10–43,
    *Select Video Modes Dialog*) displays the video modes supported by your monitor.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# **Figure 10–43  Select Video Modes Dialog**


    ![](img/eda1471ab4ce718c791c97a85559a478_265_0.png)


    Do not select a mode that exceeds the capacity of your monitor.


    Once you’ve either selected the default video mode or specified a different mode,
    the **Starting X** dialog lets you test your X configuration.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '![](img/eda1471ab4ce718c791c97a85559a478_266_0.png)


    If you select **OK**, you’ll have the opportunity to go back enter different configuration
    values should there be an error. If there is no error, X will start, and a small
    display window will ask you if you can read its contents clearly: using the mouse,
    click **Yes** within ten seconds. Then you are asked whether you want X to start
    when the system boots.


    In most cases, X configuration is complete at this point, and you’ll see the completion
    screen.


    To modify your X configuration after installation, as root issue the `Xconfigurator`
    command.


    # 10.22.1 If Your Video Card Was Not Detected...


    Earlier, in Section 10.20, *Configuring Your Video Adapter*, your system was probed
    for a video card. If none was detected, you were asked to select your card. If
    your card was not listed and you selected **Custom**, you are now asked for the
    following information about your video card:'
  merge: -1
  img_proc: true
- pgno: 267
  md: '• The amount of video memory installed on your video card. If you are not sure,
    consult the documentation accompanying your video card. Choosing more memory than
    is present in your card will not damage it, but may cause the XFree86 server to
    start incorrectly.


    # **Figure 10–45  Select Video Memory Dialog**


    ![](img/eda1471ab4ce718c791c97a85559a478_267_0.png)


    • If your video card supports a video clockchip (if it has one). The recommended
    choice is No Clockchip Setting, since XFree86 can automatically detect the proper
    clockchip in most cases.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Figure 10–46 Clockchip Configuration Dialog


    ![](img/eda1471ab4ce718c791c97a85559a478_268_0.png)


    +   - The preferred display mode (see Figure 10–43, *Select Video Modes Dialog*).
    Select one or more modes by pressing [Space].


    Xconfigurator then saves all of your choices to the configuration file `/etc/X11/XF86Config`.
    To modify your X configuration after installation, as root issue the `Xconfigurator`
    command.


    # 10.23 Creating a Boot Disk


    If you’re performing a custom-class installation, the **Bootdisk** dialog (see
    Figure 10–47, *Creating a Boot Disk*) gives you the opportunity to create a customized
    boot disk for your Red Hat Linux system.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Figure 10−47 Creating a Boot Disk


    ![](img/eda1471ab4ce718c791c97a85559a478_269_0.png)


    A boot disk can be handy in these situations:


    +   - Use It Instead of LILO -- You can use a boot disk instead of LILO. This
    is handy if you''re trying Red Hat Linux for the first time, and you’d feel more
    comfortable if the boot process for your other operating system is left unchanged.
    With a boot disk, going back to your other operating system is as easy as removing
    the boot disk and rebooting.

    +   - Use It When Another Operating System Overwrites LILO -- Other operating
    systems may not be as flexible as Red Hat Linux when it comes to supported boot
    methods. Quite often, installing or updating another operating system can cause
    the master boot record (originally containing LILO) to be overwritten, making
    it impossible to boot your Red Hat Linux installation. The boot disk can then
    be used to boot Red Hat Linux so you can reinstall LILO.


    Select **Yes** and press [Space] to create a boot disk. Next, you’ll be prompted
    to insert a blank, formatted diskette.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '![](img/eda1471ab4ce718c791c97a85559a478_270_0.png)


    For instructions on how to create a boot disk after the installation, read the
    `mkboot-disk` man page. Be sure you create a new boot disk if you make any changes
    to your kernel.


    # ### 10.24 Finishing Up


    When finished, the installation program displays the **Complete** dialog (as in
    Figure 10­49, *Compete Dialog*), telling you to reboot your computer. Remove any
    diskette from the diskette drive (unless you skipped the LILO installation, in
    which case you must use the boot disk created during the installation), or the
    Red Hat Linux CD if your system booted from the CD-ROM.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Figure 10–49 Complete Dialog


    ![](img/eda1471ab4ce718c791c97a85559a478_271_0.png)


    Select OK to reboot your newly installed system. After your computer’s normal
    power-up sequence has completed, you should see LILO’s standard boot: prompt,
    at which you can do any of the following:


    +   • Press [Enter] -- Causes LILO’s default boot entry (as seen in Figure 10-25,
    Selecting Bootable Partitions in LILO Configuration Dialog) to be booted.

    +   • Enter a Boot Label, followed by [Enter] -- Causes LILO to boot the operating
    system corresponding to the boot label.

    +   • Wait -- After LILO’s timeout period, (which, by default, is five seconds)
    LILO will automatically boot the default boot entry.


    Do whatever is appropriate to boot Red Hat Linux. You should see one or more screens
    of messages scroll by. Eventually, you should see either a graphical login screen,
    or a login: prompt.


    Congratulations! Your Red Hat Linux installation is complete!'
  merge: -1
  img_proc: true
