- pgno: 52
  md: 'The BIOS tests the system, looks for and checks peripherals and then looks
    for a drive to boot from. Usually, it checks the floppy drive (or CD-ROM drive
    on many newer systems), if present, and then it looks on the hard drive. On the
    hard drive, the BIOS looks for a **Master Boot Record** (MBR) starting at the
    first sector on the first hard drive and starts the MBR running.


    The MBR looks for the first active partition and reads the partition’s boot record.
    The boot record contains instructions on how to load the boot loader, LILO (*Linux
    LOADER*). The MBR then loads LILO and LILO takes over the process.


    LILO reads the file `/etc/lilo.conf`, which spells out which operating system(s)
    to configure or which kernel to start and where to install itself (for example,
    `/dev/hda` for your hard drive). LILO displays a `LILO:` prompt on the screen
    and waits for a preset period of time (also set in the `lilo.conf` file) for input
    from the user. If your `lilo.conf` is set to give LILO a choice of operating systems,
    at this time you could type in the label for whichever OS you wanted to boot.


    After waiting for a set period of time (five seconds is common), LILO proceeds
    to boot whichever operating system appears first in the `lilo.conf` file.


    If LILO is booting Linux, it first boots the kernel, which is a `vmlinux` file
    (plus a version number, for example, `vmlinuz-2.2.15-xx`) located in the `/boot`
    directory. Then the kernel takes over.


    The kernel looks in several different places for `init` (`/sbin` is a common location)
    and runs the first one it finds. `init` takes over.


    `init` starts (and becomes the parent or grandparent of) all of the processes
    which make up your Linux system. First, it runs `/etc/rc.d/rc.sysinit`, which
    sets your path, sets up networking if necessary, starts swapping, checks the filesystems,
    and so on. Basically, `rc.sysinit` is taking care of everything that your system
    needs to have done at system initialization. For example, on a networked system
    `rc.sysinit` uses the information in the `/etc/sysconfig/network` and `/etc/sysconfig/clock`
    files to initialize network processes and the clock. It may also run `rc.serial`,
    if you have serial port processes that need to be initialized.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'init looks at and implements the /etc/inittab file. The /etc/inittab file describes
    how the system should be set up in each runlevel and sets the default runlevel.
    This file states that /etc/rc.d/rc and /sbin/update should be run whenever a runlevel
    starts.


    The /sbin/update file flushes dirty buffers back to disk.


    Whenever the runlevel changes, /etc/rc.d/rc starts and stops services. First,
    rc sets the source function library for the system (commonly /etc/rc.d/init.d/functions),
    which spells out how to start/kill a program and how to find out the PID of a
    program. The rc file then finds out the current and the previous runlevel and
    tells linucconf the appropriate runlevel.


    The rc file starts all of the background processes necessary for the system to
    run, and looks for an rc directory for that runlevel (/etc/rc.d/rc<x>.d, where
    the <x> is numbered 0-6). rc kills all of the kill scripts (their file name starts
    with a K) in /rc.d/. Then it initializes all of the start scripts (their file
    names start with an S) in the appropriate runlevel directory (so that all services
    and applications are started correctly).


    For example, for runlevel 5, rc looks into the /etc/rc.d/rc5.d directory and finds
    that it needs to kill ruserd, rwalld, rwhod, mcserv, mars-nwe, apmd, and pcmcia.
    In the bloody aftermath, rc looks into the same directory and finds start scripts
    for kmod, netwroek, nfsfs, rndr.com, syslog, afd, crond, portmap, snmpd, inet,
    xntpd, nfs, rpmsave, dhcdp, ypbind, autofs, keytab, sendmail, gpm, sound, and
    smb/rpmsave. And life begins anew.


    The /etc/inittab file forks a getty process for each virtual console (login prompts)
    for each runlevel (runlevels 2-5 gets all six; runlevel 1, which is single user
    mode, only gets one console; runlevels 0 and 6 get no virtual consoles). /etc/inittab
    also states that gdm, the X logon manager, should start in runlevel 5.


    Also, /etc/inittab describes how the system should handle translating [Ctrl]-[Alt]-[Delete]
    into something like the command /sbin/shutdown -t3 -r now. And finally, /etc/inittab
    states what the system should do in case of power failures.


    At this point, you should be looking at a login prompt. All that, and it only
    took a few seconds.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Next, we’ll discuss information on the files in /etc/sysconfig.


    # 2.13.2 Sysconfig Information


    The following information outlines the various files in /etc/sysconfig, their
    function, and their contents.


    # Files in /etc/sysconfig


    The following files are normally found in /etc/sysconfig:


    +   • /etc/sysconfig/clock

    +   • /etc/sysconfig/hwconf (this should be ignored for editing)

    +   • /etc/sysconfig/mouse

    +   • /etc/sysconfig/sendmail

    +   • /etc/sysconfig/apmd

    +   • /etc/sysconfig/init

    +   • /etc/sysconfig/keyboard

    +   • /etc/sysconfig/network

    +   • /etc/sysconfig/pcmcia

    +   • /etc/sysconfig/soundcard (which is written by sndconfig)


    Let’s take a look at each one.


    # /etc/sysconfig/clock


    The /etc/sysconfig/clock file controls the interpretation of values read from
    the system clock. Earlier releases of Red Hat Linux used the following values
    (which are deprecated):


    +   • CLOCKMODE=mode, where mode is one of the following:

    +   – GMT -- indicates that the clock is set to UTC.

    +   – ARC -- on Alpha only indicates the ARC console’s 42-year time offset is
    in effect.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Currently, the correct values are:


    +   - UTC=boolean, where boolean is the following:

    +     - true -- indicates that the clock is set to UTC. Any other value indicates
    that it is set to local time.

    +   - ARC=boolean, where boolean is the following:

    +     - true -- (for Alpha-based systems only) Indicates the ARC console''s 42-year
    time offset is in effect. Any other value indicates that the normal UNIX epoch
    is assumed.


    +   - ZONE="filename" -- indicates the zonefile under /usr/share/zone-info that
    /etc/localtime is a copy of, for example:

    +     ZONE="US/Eastern"


    # /etc/sysconfig/hwconf


    The /etc/sysconfig/hwconf file lists all the hardware that kudzu detected on your
    system, as well as the drivers used, vendor ID and device ID information. It is
    not meant to be edited. If you do edit it, devices could suddenly show up as being
    added or removed.


    # /etc/sysconfig/mouse


    The /etc/sysconfig/mouse file is used to specify information about the available
    mouse. The following values may be used:


    +   - MOUSETYPE=type, where type is one of the following:

    +     - microsoft -- A Microsoft mouse.

    +     - mouseman -- A MouseMan mouse.

    +     - mousesystems -- A Mouse Systems mouse.

    +     - ps/2 -- A PS/2 mouse.

    +     - msbm -- A Microsoft bus mouse.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   - `logibm` -- A Logitech bus mouse.

    +   - `atibm` -- An ATI bus mouse.

    +   - `logitech` -- A Logitech mouse.

    +   - `mmseris` -- An older MouseMan mouse.

    +   - `mmhittab` -- An mmhittab mouse.


    +   - `XEMU3`=*emulation*, where *emulation* is one of the following:

    +     - `yes` -- Three mouse buttons should be emulated.

    +     - `no` -- The mouse already has three buttons.


    In addition, `/dev/mouse` is a symlink that points to the actual mouse device.


    # **/etc/sysconfig/sendmail**


    The `/etc/sysconfig/sendmail` allows messages to be sent to one or more recipients,
    routing the message over whatever networks are necessary. The file sets the default
    values for the *sendmail* program to run. Its default values are to run as a background
    daemon, and to check its queue once an hour in case something has backed up.


    The following values may be used:


    +   - `DAEMON`=*answer*, where *answer* is one of the following:

    +     - `yes` -- Sendmail should be configured. `yes` implies `-bd`.

    +     - `no` -- Sendmail should not be configured.


    +   - `QUEUE`=1h which is given to sendmail as `-q$QUEUE`. The `-q` option is
    not given to sendmail if `/etc/sysconfig/sendmail` exists and `QUEUE` is empty
    or undefined.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# **/etc/sysconfig/apmd**


    The `/etc/sysconfig/apmd` is used by apmd, as a configuration for what things
    to start/stop/change on suspend or resume. It is set up to turn on or off apmd
    during startup, depending on whether your hardware supports Advanced Power Management
    (apm), or if you choose not to use it.


    # **/etc/sysconfig/init**


    The `/etc/sysconfig/init` file controls how the system will look during bootup.


    The following values may be used:


    +   - `BOOTUP=<some bootup mode>`, where `<some bootup mode>` is one of the following:

    +     - `BOOTUP=color` means new (as of Red Hat Linux 6.0) boot display.

    +     - `BOOTUP=verbose` means old style display.

    +     - Anything else means new display, but without ANSI-formatting.


    +   - `LOGLEVEL=<a number>`, where `<a number>` sets the initial console logging
    level for the kernel. The default is 7: 8 means everything (including debugging);
    1 means nothing except kernel panics. syslogd will override this once it starts.


    +   - `RES_COL=<a number>`, where `<a number>` is a column of the screen to start
    status labels at. Defaults to 60.


    +   - `MOVE_TO_COL=<a command>`, where `<a command>` moves the cursor to $RES_COL.
    Defaults to ANSI sequences output by echo −e.


    +   - `SETCOLOR_SUCCESS=<a command>`, where `<a command>` sets the color to a
    color indicating success. Defaults to ANSI sequences output by echo −e, setting
    the color to green.


    +   - `SETCOLOR_FAILURE=<a command>`, where `<a command>` sets the color to a
    color indicating failure. Defaults to ANSI sequences output by echo −e, setting
    the color to red.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '+   - `SETCOLOR_WARNING=<a command>`, where `<a command>` sets the color to
    a color indicating warning. Defaults to ANSI sequences output by `echo -e`, setting
    the color to yellow.


    +   - `SETCOLOR_NORMAL=<a command>`, where `<a command>` sets the color to `normal''.
    Defaults to ANSI sequences output by `echo -e`.


    +   - `MAGIC_SYSRQ=an answer`, where `an answer` is one of the following:

    +     - `yes` -- Enables the magic sysrq key.

    +     - `no` -- Disables the magic sysrq key, and [Stop]-[A] (break on serial
