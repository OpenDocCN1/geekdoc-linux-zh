    \ two authentication methods: if `rhosts` authentication succeeds, it is sufficient\
    \ to allow the connection; if it fails, then standard password authentication\
    \ is done.\n\nNew modules can be added at any time, and PAM-aware applications\
    \ can then be made to use them. For instance, if you have a one-time-password\
    \ calculator system, and you can write a module to support it (documentation on\
    \ writing modules is included with the system in `/usr/doc/pam*`), PAM-aware programs\
    \ can use the new module and work with the new one-time-password calculators without\
    \ being recompiled or otherwise modified in any way.\n\n# 2.6.2 Services\n\nEach\
    \ program using PAM defines its own \\\"service\\\" name. The login program defines\
