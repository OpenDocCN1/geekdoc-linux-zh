    # 3.1.13 Filesystems


    A filesystem is composed of files and directories, all starting from a single
    root directory. The root directory may contain any number of files and other directories,
    with each directory in turn following suit. The average filesystem often looks
    like an inverted tree with the directories as branches and the files as leaves.
    Filesystems reside on mass storage devices such as diskette drives, hard drives,
    and CD-ROMs.


    For example, a diskette drive on DOS and Windows machines is typically referenced
    by \texttt{A:\}. This describes both the device (\texttt{A:}), and the root directory
    on that device (\texttt{\}). The primary hard drive on the same systems is typically
    referred to as the ``C'''' drive because the device specification for the first
    hard drive is \texttt{C:}. To specify the root directory on the C drive, you would
    use \texttt{C:\}. Under this arrangement, there are two filesystems -- the one
    on \texttt{A:}, and the one on \texttt{C:}. In order to specify any file on a
    DOS/Windows filesystem, you must either explicitly'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'specify the device on which the file resides, or it must be on the system''s
    default drive (which is where DOS'' C prompt comes from -- that''s the default
    drive in a system with a single hard drive).


    Under Linux, it is possible to link the filesystems on several mass storage devices
    together into a single, larger filesystem. This is done by placing one device''s
    filesystem "under" a directory on another device''s filesystem. So while the root
    directory of a diskette drive on a DOS machine may be referred to as A:\, the
    same drive on a Linux system may be accessible as /mnt/floppy.


    The process of merging filesystems in this way is known as mounting. When a device
    is mounted, it is then accessible to the system''s users. The directory "under"
    which a mounted device''s filesystem becomes accessible is known as the mount
    point. In the previous paragraph''s example, /mnt/floppy was the diskette drive''s
    mount point. Note that there are no restrictions (other than common conventions)
    as to the naming of mount points. We could have just as easily mounted the floppy
    to /long/path/to/the/floppy/drive.


    One thing to keep in mind is that all of a device''s files and directories are
    relative to its mount point. Consider the following example:


    +   - A Linux System:

    +       - `/` -- system root directory

    +       - `/foo` -- mount point for the CD-ROM


    +   - A CD-ROM:

    +       - `/` -- CD-ROM''s root directory

    +       - `/images` -- A directory of images on the CD-ROM

    +       - `/images/old` -- A directory of old images


    So, if the above describes the individual filesystems, and you mount the CD-ROM
    at /foo, the new operating system directory structure would be:'
  merge: -1
  img_proc: true
- pgno: 95
  md: '+   • A Linux System (with the CD-ROM mounted):

    +     • / -- System root directory

    +     • /foo -- CD-ROM root directory

    +     • /foo/images -- A directory of images on the CD-ROM

    +     • /foo/images/old -- A directory of old images


    To mount a filesystem make sure to be logged in as root, or become root using
    the `su` command. For the latter, type `su` at the shell prompt and then enter
    the root password. Once you are root, type `mount` followed by the device and
    then the mount point. For example, to mount the first diskette drive on `/mnt/floppy`,
    you would type the command `mount /dev/fd0 /mnt/floppy`.


    At installation, Red Hat Linux will create `/etc/fstab`. This file contains information
    on devices and associated mount points. The advantage to this file is that it
    allows you to shorten your mount commands and it controls which filesystems are
    automatically mounted when the system is booted.


    Using the information in `/etc/fstab`, you can type `mount` and then either the
    mount point or the device. The `mount` command will look for the rest of the information
    in `/etc/fstab`. It’s possible to modify this file by hand, or by using linuxconf.


    # ## Reviewing Your Current Filesystem


    We’ll start by looking at your current directory structure.


    +   • Open `Config => File systems => Access local drive`.'
  merge: -1
  img_proc: true
