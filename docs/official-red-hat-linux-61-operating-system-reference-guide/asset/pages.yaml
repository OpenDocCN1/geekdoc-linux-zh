    Let''s take a look at each one.

    /etc/sysconfig/network-scripts/ifup,

    /etc/sysconfig/network-scripts/ifdown

    These are symbolic links to /sbin/ifup and /sbin/ifdown, respectively. They are
    the only two scripts in this directory that should be called directly; these two
    scripts call all the other scripts as needed. These symlinks are here for legacy
    purposes only -- they will probably be removed in future versions, so only /sbin/ifup
    and /sbin/ifdown should currently be used.

    These scripts take one argument normally: the name of the device (e.g. "eth0").
    They are called with a second argument of "boot" during the boot sequence so that
    devices that are not meant to be brought up on boot (ONBOOT=no, [see below]) can
    be ignored at that time.


    /etc/sysconfig/network-scripts/network-functions

    Not really a public file. Contains functions which the scripts use for bringing
    interfaces up and down. In particular, it contains most of the code for handling
    alternative interface configurations and interface change notification through
    netreport.


    /etc/sysconfig/network-scripts/ifcfg-<interface-name>,

    /etc/sysconfig/network-scripts/ifcfg-<interface-name>-<clone-name>

    The first file defines an interface, while the second file contains only the parts
    of the definition that are different in a "clone" (or alternative) interface.
    For example,'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'the network numbers might be different, but everything else might be the same,
    so only the network numbers would be in the clone file, while all the device information
    would be in the base `ifcfg` file.


    The items that can be defined in an `ifcfg` file depend on the interface type.

    The following values are common to all base files:


    +   - `DEVICE=name`, where `name` is the name of the physical device (except dynamically-allocated
    PPP devices where it is the "logical name").

    +   - `IPADDR=addr`, where `addr` is the IP address.

    +   - `NETMASK=mask`, where `mask` is the netmask value.

    +   - `NETWORK=addr`, where `addr` is the network address.

    +   - `BROADCAST=addr`, where `addr` is the broadcast address.

    +   - `GATEWAY=addr`, where `addr` is the gateway address.

    +   - `ONBOOT=answer`, where `answer` is one of the following:

    +       - `yes` -- This device should be activated at boot-time.

    +       - `no` -- This device should not be activated at boot-time.

    +   - `USERCTL=answer`, where `answer` is one of the following:

    +       - `yes` -- Non-root users are allowed to control this device.

    +       - `no` -- Non-root users are not allowed to control this device.


    +   - `BOOTPROTO=proto`, where `proto` is one of the following:

    +       - `none` -- No boot-time protocol should be used.

    +       - `bootp` -- The BOOTP protocol should be used.

    +       - `dhcp` -- The DHCP protocol should be used.'
