    \ system uses the UID to identify an account.\n\n# Mail settings for User Accounts\n\
    \nThe **Redirect messages to** field sets the system to forward e-mail messages\
    \ sent to the user to this address instead.\n\nAn **E-mail alias** is a supplemental\
    \ e-mail address that will be accepted by the system and forwarded on to the user.\
    \ For example, you could add the alias jane_smith@yourdomain.com to user *smith*'s\
    \ account. Then, e-mail sent to jane_smith@yourdomain.com would automatically\
    \ be forwarded to smitj@yourdomain.com.\n\n# Privileges for User Accounts\n\n\
    In the **Privileges** section, you can grant access and/or control over various\
