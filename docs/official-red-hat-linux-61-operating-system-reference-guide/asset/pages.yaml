- pgno: 155
  md: "For those options that display file lists, you can add `-v` to your command\
    \ line to get the lists in a familiar `ls -l` format.\n\n# ### 6.2.6 Verifying\n\
    \nVerifying a package compares information about files installed from a package\
    \ with the same information from the original package. Among other things, verifying\
    \ compares the size, MD5 sum, permissions, type, owner and group of each file.\n\
    \nThe command `rpm -V` verifies a package. You can use any of the *Package Selection\
    \ Options* listed for querying to specify the packages you wish to verify. A simple\
    \ use is `rpm -V foo` which verifies that all the files in the foo package are\
    \ as they were when they were originally installed. For example:\n\n+   - To verify\
    \ a package containing particular file:\n+       \n+       ```\n+       rpm -Vf\
    \ /bin/vi\n+       ```\n+   \n+   - To verify ALL installed packages:\n+     \
    \  \n+       ```\n+       rpm -Va\n+       ```\n+   \n+   - To verify an installed\
    \ package against an RPM package file:\n+       \n+       ```\n+       rpm -Vp\
    \ foo-1.0-1.i386.rpm\n+       ```\n\nThis can be useful if you suspect that your\
    \ RPM databases are corrupt.\n\nIf everything verified properly there will be\
    \ no output. If there are any discrepancies they will be displayed. The format\
    \ of the output is a string of 8 characters, a possible \"c\" denoting a configuration\
    \ file, and then the file name. Each of the 8 characters denotes the result of\
    \ a comparison of one attribute of the file to the value of that attribute recorded\
    \ in the RPM database. A single \".\" (period) means the test passed. The following\
    \ characters denote failure of certain tests:\n\n+   - `5` -- MD5 checksum"
  merge: -1
  img_proc: true
- pgno: 156
  md: '+   * S -- File size

    +   * L -- Symbolic link

    +   * T -- File modification time

    +   * D -- Device

    +   * U -- User

    +   * G -- Group

    +   * M -- Mode (includes permissions and file type)


    If you see any output, use your best judgment to determine if you should remove
    or reinstall the package, or otherwise fix the problem.


    # 6.3 Impressing Your Friends with RPM


    RPM is a very useful tool for both managing your system and diagnosing and fixing
    problems. The best way to make sense of all the options is to look at some examples.


    +   * Let''s say you delete some files by accident, but you aren''t sure what
    you deleted. If you want to verify your entire system and see what might be missing,
    you would enter:


    ```

    ```bash

    rpm -Va

    ```

    ```


    If some files are missing, or appear to have been corrupted, you should probably
    either re-install the package or uninstall, then re-install the package.


    +   * Let''s say you run across a file that you don''t recognize. To find out
    which package owns it, you would enter:


    ```

    ```bash

    rpm -qf /usr/X11R6/bin/xjewel

    ```

    ```


    The output would look like:


    ```

    ```

    xjewel-1.6-1

    ```

    ```'
  merge: -1
  img_proc: true
