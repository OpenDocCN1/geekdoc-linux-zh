- pgno: 294
  md: '# B **An Introduction to Disk Partitions**


    Disk partitions are a standard part of the personal computer landscape, and have
    been for quite some time. However, with so many people purchasing computers featuring
    preinstalled operating systems, relatively few people understand how partitions
    work. This chapter attempts to explain how disk partitions work so you’ll find
    your Red Hat Linux installation is as simple as possible.


    If you’re reasonably comfortable with disk partitions, you could skip ahead to
    Section B.1.4, *Making Room For Red Hat Linux* for more information on the process
    of freeing up disk space to prepare for a Red Hat Linux installation. This section
    also discusses the partition naming scheme used by Linux systems, sharing disk
    space with other operating systems, and related topics.


    # B.1 **Hard Disk Basic Concepts**


    Hard disks perform a very simple function -- they store data and reliably retrieve
    it on command.


    When discussing issues such as disk partitioning, it’s important to know a bit
    about the underlying hardware; unfortunately, it’s easy to become bogged down
    in details. Therefore, let’s use a simplified diagram of a disk drive to help
    us explain what goes on “under the hood.” Figure B–1, *An Unused Disk Drive* shows
    a brand-new, unused disk drive.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# Figure B-1 An Unused Disk Drive


    ![](img/eda1471ab4ce718c791c97a85559a478_295_0.png)


    Not much to look at, is it? But if we’re talking about disk drives on a basic
    level, it will do. Let’s say that we’d like to store some data on this drive.
    As things stand now, it won’t work. There’s something we need to do first...


    # B.1.1 It’s Not What You Write, it’s How You Write It


    The old-timers in the audience probably got this one on the first try. We need
    to **format** the drive. Formatting (usually known as "making a **filesystem**"
    in Linux parlance) writes information to the drive, creating order out of the
    empty space in an unformatted drive.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Figure B-2 Disk Drive with a Filesystem


    ![](img/eda1471ab4ce718c791c97a85559a478_296_0.png)


    As Figure B-2, Disk Drive with a Filesystem implies, the order imposed by a file-sys-tem
    involves some tradeoffs:


    +   * A small percentage of the drive’s available space is used to store filesystem-related
    data, and can be considered as overhead.

    +   * A filesystem splits the remaining space into small, consistently-sized segments.
    In the Linux world, these segments are known as blocks.¹


    Given that filesystems make things like directories and files possible, these
    tradeoffs are usually seen as a small price to pay.


    It’s also worth noting that there is no single, universal filesystem; as Figure
    B-3, Disk Drive with a Different Filesystem shows, a disk drive may have one of
    many different filesystems written on it. As you might guess, different filesystems
    tend


    > Blocks really are consistently sized, unlike our illustrations. Keep in mind,
    also, that an average disk drive contains thousands of blocks. But for the purposes
    of this discussion, please ignore these minor discrepancies.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'to be incompatible; that is, an operating system that supports one filesystem
    (or a handful of related filesystem types) may not support another. This last
    statement is not a hard-and-fast rule, however. For example, Red Hat Linux supports
    a wide variety of filesystems (including many commonly used by other operating
    systems), making data interchange easy.


    ![](img/eda1471ab4ce718c791c97a85559a478_297_0.png)


    Of course, writing a filesystem to disk is only the beginning. The goal of this
    process is to actually *store* and *retrieve* data. Let''s take a look at our
    drive after some files have been written to it.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'Figure B-4 Disk Drive with Data Written to It


    ![](img/eda1471ab4ce718c791c97a85559a478_298_0.png)


    As Figure B-4, Disk Drive with Data Written to It shows, 14 of the previously-empty
    blocks are now holding data. We cannot determine how many files reside on this
    drive; it may be as few as one or as many as 14, as all files use at least one
    block. Another important point to note is that the used blocks do not have to
    form a contiguous region; used and unused blocks may be interspersed. This is
    known as fragmentation. Fragmentation can play a part when attempting to resize
    an existing partition.


    As with most computer-related technologies, disk drives continued to change over
    time. In particular, they changed in one specific way -- they got bigger. Not
    bigger in size, but bigger in capacity. And it was this additional capacity that
    drove a change in the way disk drives were used.


    # B.1.2 Partitions – Turning One Drive Into Many


    As disk drive capacities soared, some people started wondering if having all that
    space in one big chunk wasn’t such a great idea. This line of thinking was driven
    by several'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'issues, some philosophical, some technical. On the philosophical side, above
    a certain size, it seemed that the additional space provided by a larger drive
    created more clutter. On the technical side, some file systems were never designed
    to support larger drives. Or the file systems *could* support larger drives, but
    the overhead imposed by the file system became excessive.


    The solution to this problem was to divide disks into **partitions**. Each partition
    can be accessed as if it were a separate disk. This is done through the addition
    of a **partition table**.


    # Please Note


    While the diagrams in this chapter show the partition table as being separate
    from the actual disk drive, this is not entirely accurate. In reality, the partition
    table is stored at the very start of the disk, before any file system or user
    data. But for clarity, we''ll keep it separate in our diagrams.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Figure B-5 Disk Drive with Partition Table


    ![](img/eda1471ab4ce718c791c97a85559a478_300_0.png)


    As Figure B-5, Disk Drive with Partition Table shows, the partition table is divided
    into four sections. Each section can hold the information necessary to define
    a single partition, meaning that the partition table can define no more than four
    partitions.

    Each partition table entry contains several important characteristics of the partition:


    +   - The points on the disk where the partition starts and ends;

    +   - Whether the partition is "active";

    +   - The partition''s type.


    Let''s take a closer look at each of these characteristics. The starting and ending
    points actually define the partition''s size and location on the disk. The "active"
    flag is used by some operating systems'' boot loaders. In other words, the operating
    system in the partition that is marked "active" will be booted.

    The partition''s type can be a bit confusing. The type is a number that identifies
    the partition''s anticipated usage. If that statement sounds a bit vague, that''s
    because the'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'meaning of the partition type is a bit vague. Some operating systems use the
    partition type to denote a specific filesystem type, to flag the partition as
    being associated with a particular operating system, to indicate that the partition
    contains a bootable operating system, or some combination of the three.


    Table B–1, Partition Types contains a listing of some popular (and obscure) partition
    types, along with their numeric values.


