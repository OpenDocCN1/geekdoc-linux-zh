    (see Figure 3–13, *PPP/SLIP/PLIP Configurations Screen*). Select the configuration
    you would like to modify or delete.


    This will open the appropriate interface screen for your configuration. If you
    wish to delete the configuration, select Del at the bottom of the screen. The
    Modem port is on the Hardware tab and is a drop down menu. If you want to change
    the'
