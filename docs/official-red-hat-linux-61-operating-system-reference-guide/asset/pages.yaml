- pgno: 306
  md: 'In any case, you can simply create the necessary partitions from the unused
    space. Unfortunately, this scenario, although very simple, is not very likely
    (unless you''ve just purchased a new disk just for Red Hat Linux). Let''s move
    on to a slightly more common situation.


    # Using Space From An Unused Partition


    In this case, maybe you have one or more partitions that you just don''t use any
    longer. Perhaps you''ve dabbled with another operating system in the past, and
    the partition(s) you''ve dedicated to it never seem to be used anymore. Figure
    B-9, Disk Drive With an Unused Partition illustrates such a situation.


    # Figure B-9  Disk Drive With an Unused Partition


    ![](img/eda1471ab4ce718c791c97a85559a478_306_0.png)


    If you find yourself in this situation, you can use the space allocated to the
    unused partition. You''ll first need to delete the partition, and then create
    the appropriate Linux partition(s) in its place. You can either delete the partition
    using DOS fdisk, or you''ll be given the opportunity to do so during a custom-class
    installation.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# **Using Free Space From An Active Partition**


    This is the most common situation. It is also, unfortunately, the hardest to work
    with. The main problem is that, even if you have enough free space, it''s presently
    allocated to a partition that is in use. If you purchased a computer with pre-installed
    software, the hard disk most likely has one massive partition holding the operating
    system and data.


    Aside from adding a new hard drive to your system, you have two choices:


    # **Destructive Repartitioning**


    Basically, you delete the single large partition, and create several smaller ones.
    As you might imagine, any data you had in the original partition is destroyed.
    This means that making a complete backup is necessary. For your own sake, make
    two backups, use verification (if available in your backup software), and try
    to read data from your backup before you delete the partition. Note also that
    if there was an operating system of some type installed on that partition, it
    will need to be reinstalled as well.


    After creating a smaller partition for your existing software, you can reinstall
    any software, restore your data, and continue with your Red Hat Linux installation.
    Figure B–10, *Disk Drive Being Destructively Repartitioned* shows this being done.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Figure B-10  Disk Drive Being Destructively Repartitioned


    ![](img/eda1471ab4ce718c791c97a85559a478_308_0.png)


    ![](img/eda1471ab4ce718c791c97a85559a478_308_1.png)


    **CAUTION**


    > As Figure B-10, *Disk Drive Being Destructively Repartitioned* shows, any data
    present in the original partition will be lost without proper backup!


    # Non-Destructive Repartitioning


    Here, you run a program that does the seemingly impossible: it makes a big partition
    smaller without losing any of the files stored in that partition. Many people
    have found this method to be reliable and trouble-free. What software should you
    use to perform this feat? There are several disk management soft-ware products
    on the market; you''ll have to do some research to find the one that is best for
    your situation.


    While the process of non-destructive repartitioning is rather straightforward,
    there are a number of steps involved:'
  merge: -1
  img_proc: true
- pgno: 309
  md: '+   Compress existing data

    +   Resize partition

    +   Create new partition(s)


    Let’s take a look at each step in a bit more detail.


    # Compress existing data


    As Figure B–11, *Disk Drive Being Compressed* shows, the first step is to compress
    the data in your existing partition. The reason for doing this is to rearrange
    the data such that it maximizes the available free space at the “end” of the partition.


    # Figure B–11 Disk Drive Being Compressed


    ![](img/eda1471ab4ce718c791c97a85559a478_309_0.png)


    This step is crucial; without it, it is possible that the location of your data
    could prevent the partition from being resized to the extent desired. Note also
    that, for one reason or another, some data cannot be moved. If this is the case
    (and it restricts the size of your new partition(s)), you may be forced to destructively
    repartition your disk.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Resize partition


    Figure B–12, Disk Drive with Partition Resized shows the actual resizing process.
    While the actual end-product of the resizing operation varies depending on the
    software used, in most cases the newly freed space is used to create an unformatted
    partition of the same type as the original partition.


    ![](img/eda1471ab4ce718c791c97a85559a478_310_0.png)


    It’s important to understand what the resizing software you use does with the
    newly freed space, so that you can take the appropriate steps. In the case we’ve
    illustrated, it would be best to simply delete the new DOS partition, and create
    the appropriate Linux partition(s).


    # Create new partition(s)


    As the previous step implied, it may or may not be necessary to create new partitions.
    However, unless your resizing software is Linux-aware, it is likely you’ll need
    to delete the partition that was created during the resizing process. Figure B–13,
    Disk Drive with Final Partition Configuration shows this being done.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '![](img/eda1471ab4ce718c791c97a85559a478_311_0.png)


    # Intel


    The following information is specific to Intel-based computers only.


    As a convenience to our customers, we provide the *fips* utility. This is a freely
    available program that can resize FAT (File Allocation Table) partitions. It''s
    included on the Red Hat Linux/Intel CD-ROM in the *dosutils* directory.'
  merge: -1
