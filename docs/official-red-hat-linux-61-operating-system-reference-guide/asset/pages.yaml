    # 2.12 NFS Configuration


    NFS stands for Network File System; it is a way to share files between machines
    as if they were on your local hard drive. Linux can be both an NFS server and
    an NFS client, which means that it can **export** filesystems to other systems,
    and **mount** filesystems exported from other machines.


    # 2.12.1 Mounting NFS Filesystems


    Use the `mount` command to mount an NFS filesystem from another machine:


    ```

    ```bash

    mkdir /mnt/local # Only required if /mnt/local doesn''t exist

    mount bigdog:/mnt/export /mnt/local

    ```

    ```


    In this command, `bigdog` is the hostname of the NFS fileservver, `/mnt/export`
    is the filesystem that `bigdog` is exporting, and `/mnt/local` is a directory
    on the local machine where we want to mount the filesystem. After the `mount`
    command runs (and if we have the proper permissions from `bigdog`) we can enter
    `ls /mnt/local` and get a listing of the files in `/mnt/export` on `bigdog`.


    # 2.12.2 Exporting NFS Filesystems


    The file that controls what filesystems you wish to export is `/etc/exports`.
    Its format is:


    ```

    ```text

    directory          hostname (options)

    ```

    ```


    the `(options)` are discreretional. For example:


    ```

    ```text

    /mnt/export       speedy.redhat.com

    ```

    ```'
