  md: '![](img/eda1471ab4ce718c791c97a85559a478_226_0.png)


    The following sections describe the layout of Figure 10-15, Disk Druid Main Screen
    and how to use its buttons to set up partitions. If you''re already familiar with
    Disk Druid, you can partition your disk and skip to Section 10.10.10, Choose Partitions
