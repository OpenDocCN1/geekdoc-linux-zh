  img_proc: true
- pgno: 36
  md: "+   • `auth` modules provide the actual authentication, perhaps asking for\
    \ and checking a password, and they set \\\"credentials\\\" such as group membership\
    \ or kerberos \\\"tickets.\\\"  \n+   • `account` modules check to make sure that\
    \ the authentication is allowed (the account has not expired, the user is allowed\
    \ to log in at this time of day, and so on).  \n+   • `password` modules are used\
    \ to set passwords.  \n+   • `session` modules are used once a user has been authenticated\
    \ to allow them to use their account, perhaps mounting the user’s home directory\
    \ or making their mailbox available.\n\nThese modules may be stacked, so that\
