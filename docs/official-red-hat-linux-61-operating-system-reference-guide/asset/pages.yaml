    \ good reference is *Managing NFS and NIS Services*, by Hal Stern, published by\
    \ O'Reilly & Associates.\n\n# ## 2.13 The Boot Process, Init, and Shutdown\n\n\
    This section contains information on what happens when you boot or shut down your\
    \ Red Hat Linux system.\n\n# ### 2.13.1 Behind the Scenes of the Boot Process\n\
    \nWhen a computer is booted, the processor looks at the end of the system memory\
    \ for the **BIOS** (Basic Input/Output System) and runs it. The BIOS program is\
    \ written into read-only permanent memory, and is always ready to go. The BIOS\
    \ provides the lowest level interface to peripheral devices and controls the first\
    \ step of the boot process."
