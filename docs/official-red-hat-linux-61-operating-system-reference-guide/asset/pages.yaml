- pgno: 104
  md: 'Enter the complete phone number for the remote machine, and make sure to include
    any numbers required to access outside lines.


    For example, if you need to dial 9 and then the number, and the computer you’re
    connecting to has a telephone number of 555-0111, then you’d enter 95550111.


    The next information you’re asked for is the modem port. This is a drop down box
    of available ports. If you’re using a dual-boot Linux/Windows system and you know
