- pgno: 327
  md: "# ### D.2.3 Create a New Partition\n\nThe third way to make room for Linux\
    \ is to create a new partition for Red Hat Linux on the hard drive being used\
    \ by the other operating system. If Windows Explorer shows only one hard drive\
    \ (*C:*), and you don’t want to add a new hard drive, you must partition the drive.\
    \ After partitioning, Windows Explorer will reveal a smaller *C:* drive; and,\
    \ when you run the Red Hat Linux installation program, it will partition the remainder\
    \ of the drive for Linux.\n\nYou can use a destructive partitioning program, such\
    \ as *fdisk*, to divide the hard drive, but doing so will require you to re-install\
    \ Windows. (This is probably not your best option.)\n\nA number of non-destructive\
    \ third-party partitioning programs are available for the Windows operating system.\
    \ If you choose to use one of these, consult their documentation.\n\nFor instructions\
    \ on how to partition with `FIPS`, a program that is on the Red Hat Linux CD-ROM,\
    \ turn to Section D.3, *Partitioning with FIPS*.\n\n# ## D.3 Partitioning with\
    \ `FIPS`\n\nAs a convenience to our customers, we provide the `FIPS` utility.\
    \ This is a freely available program that can resize FAT (File Allocation Table)\
    \ partitions. It’s included on the Red Hat Linux CD-ROM in the `dosutils` directory.\n\
    \n> **Please Note**\n> \n> Many people have successfully used `FIPS` to repartition\
    \ their hard drives. However, because of the nature of the operations carried\
    \ out by `FIPS`, and the wide variety of hardware and software configurations\
    \ under which it must run, Red Hat cannot guarantee that `FIPS` will work properly\
    \ on your system. Therefore, no installation support whatsoever is available for\
    \ `FIPS`; use it at your own risk."
