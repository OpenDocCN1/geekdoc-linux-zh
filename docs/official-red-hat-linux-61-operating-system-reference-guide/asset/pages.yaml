- pgno: 245
  md: '# Figure 10-26 Hostname Configuration Dialog


    ![](img/eda1471ab4ce718c791c97a85559a478_245_0.png)


    If you have a network card in your computer, enter a **fully-qualified domain
    name** in this format:


    ```

    hostname.domain.name

    ```


    In this example, *hostname* is the name you’ve chosen for your computer and *domain.name*
    is the TCP/IP domain. (A domain name may contain more nodes: for example, *eastcoast.mainserver.redhat.com*
    and *westcoast.mainserver.redhat.com*.)


    Even if your computer is not part of a network, you can enter a hostname for your
    system. Take this opportunity to enter in a name; if you do not, your system will
    be known as *localhost*.'
  merge: -1
  img_proc: true
