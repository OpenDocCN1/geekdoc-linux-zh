  md: '# Using ExpressDocs


    Every document you create is based upon a template. The template sets the formatting
    and layout of the document. You can use a template as many times as you wish to
    create documents that look the same and have similar content. This can be particularly
    useful if you constantly use a particular kind of document, such as a letterhead,
    or need to generate reports. You can create your own templates or use the ones
    that ship with WordPerfect, called ExpressDocs.


    There are more than 70 ExpressDocs included with WordPerfect that let you quickly
    create professional documents. Many of them are part of document suites that include
    such items as a letter, memo, and brochure that use the same layout and design
    for a consistent look. There are several suites, including Contemporary, Cosmopolitan,
    Elegant, and Traditional.


    # To start a new document using ExpressDocs:


    +   1. Choose ExpressDocs from the File menu (Figure 22). The first time you use
    ExpressDocs a Personal Info dialog box will appear (Figure 23) along with the
    ExpressDocs dialog box (Figure 24). The information that you enter in this dialog
    box can be used in future documents created with ExpressDocs.

    +   2. Enter your personal information, if you wish, into the appropriate text
    boxes in the Personal Info dialog box.

    +   3. When you are finished entering your information, click OK to close the
    dialog box and return to the ExpressDocs dialog box.

    +   4. Scroll down the Document Template list box until you find the type of document
    you want to create.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_50_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_50_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_50_2.png)'
  merge: -1
  img_proc: true
