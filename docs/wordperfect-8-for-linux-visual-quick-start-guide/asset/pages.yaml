    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_223_1.png)


    Figure 26. Select your new custom keyboard in the Keyboards list box, then click
    Select.


    # Summary


    In this chapter you learned how to:


    +   - Record a macro

    +   - Play a macro

    +   - Display a toolbar

    +   - Assign a macro to a toolbar button

    +   - Assign a macro to a keyboard shortcut'
