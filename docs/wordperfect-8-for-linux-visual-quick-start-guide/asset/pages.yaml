- pgno: 76
  md: '# Saving Your You-know-what


    Undo is a favorite command of many users. If you delete something by accident,
    don’t panic! You can undo it!


    But, if you decide you really did want to delete that text after restoring it
    with undo, you can use redo to reverse the undo.


    WordPerfect 8 for Linux comes with an amazing feature, you can undo or redo more
    than one action at a time up to 300 actions using the Undo/Redo History dialog
    box!


    # To undo an action:


    Choose Undo from the Edit menu (Figure 41), or click the Undo button on the WordPerfect
    8 Toolbar.


    # To redo an action:


    Choose Redo from the Edit menu (Figure 42), or click the Redo button on the WordPerfect
    8 Toolbar.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_76_0.png)


    Figure 40. When the mouse button is released, the copied text appears selected,
    pasted in the new position.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_76_1.png)


    Figure 41. Choose Undo from the Edit menu to reverse an action.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_76_2.png)


    Figure 42. Choose Redo from the Edit menu to reverse an Undo command.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_76_3.png)


    Figure 43. Choose Undo/Redo History to undo and/or redo more than one action at
    a time.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# To undo or redo more than one action at a time:


    +   1. Choose Undo/Redo History from the Edit menu (Figure 43). The Undo/Redo
    History dialog box will open (Figure 44). This dialog box displays up to 300 Undo
    and Redo actions you have performed on the document.


    +   2. To undo several actions at once:

    +   A. Use the Undo list box to select the actions you want to undo by holding
    down the Ctrl key, then clicking on the various undo actions (Figure 45).

    +   B. Click the Undo button. The actions you selected will undo.


    +   or

    +   A. Use the Redo list box to select the actions you want to redo by holding
    down the Ctrl key, then clicking on the various redo actions (Figure 46).

    +   B. Click the Redo button. The actions you selected will redo.


    +   3. When you are finished selecting undo and redo actions, click Close to close
    the dialog box and return to your document.


    # Tip


    You can save undo and redo actions with a document. To do so, click the Options
    button in the Undo/Redo History dialog box. The Undo/Redo Options dialog box will
    open (Figure 47). Use the Number of Undo/Redo Items text box to set how many actions
    will be saved with the document, make sure the check box next to Save Undo/Redo
    Items With Document is selected, and then click OK.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_77_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_77_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_77_2.png)'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Using Find and Replace


    WordPerfect makes it easy to find and/or replace any kind of word or phrase in
    a document.


    # To find a word or phrase:


    +   1. Position the insertion point where you would like the search to begin.

    +   2. Choose Find and Replace from the Edit menu (Figure 48) or press Ctrl+F2
    on the keyboard. The Find and Replace Text dialog box will appear (Figure 49).

    +   3. Type the word or phrase you want to locate in the Find text box.

    +   4. Click Find Next. WordPerfect will search the document for the next occurrence
    of the word or phrase.

    +   5. Click Find Next again to find the next occurrence of the word or phrase.

    +   6. Continue clicking Find Next until you have finished your search.

    +   7. Click Close to close the dialog box.


    # Tips


    +   ▪ If you select text before you open the Find and Replace Text dialog box,
    the selected text will appear in the Find text box when the dialog box opens.

    +   ▪ You can work on the document while the Find and Replace Text dialog box
    is open. This can be handy if you want to move through a document, checking various
    items.

    +   ▪ If you try to find text that is not present in the document, a Warning dialog
    box will open, telling you the text is not found (Figure 50). Click OK to close
    the dialog box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_78_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_78_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_78_2.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_78_3.png)'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# To replace a word or phrase:


    +   1. Position the insertion point where you would like the search to begin.

    +   2. Choose Find and Replace from the Edit menu (Figure 48) or press Ctrl+F2
    on the keyboard. The Find and Replace Text dialog box will appear (Figure 51).

    +   3. Type the word or phrase you want to locate in the Find text box.

    +   4. Type the replacement text in the Replace With text box.

    +   5. Click Replace. WordPerfect will search through the document for the next
    occurrence of the word or phrase and replace it with the new text.

    +   6. Click Replace again to move to the next occurrence and replace the text.

    +   7. Continue clicking Replace until you have finished searching the document.
    When WordPerfect has finished searching a Replace dialog box will appear, telling
    you how many occurrences have been replaced (Figure 52).

    +   8. Click OK to close the Replace dialog box.

    +   9. Click Close to close the Find and Replace Text dialog box and return to
    the document window.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_79_0.png)


    Figure 51. Type the text you want to find and replace in the text boxes, then
    click Replace to change the next occurrence or Replace All to change all occurrences.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_79_1.png)


    Figure 52. When the entire document has been searched, a Replace dialog box opens
    to tell you how many times the word or phrase was replaced.


    # Tips


    +   If you want to delete the text you are searching for and not replace it with
    new text, type <Nothing> in the Replace With text box.

    +   If you want to replace all occurrences of a word or phrase in a document,
    click Replace All in the Find and Replace Text dialog box.

    +   If you try to find text that is not present in the document, a Warning dialog
    box will open, telling you the text is not found (Figure 53). Click OK to close
    this dialog box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_79_2.png)


    Figure 53. If the word or phrase is not found a Warning dialog box opens. "Warning"
    sounds a bit drastic, but it''s nothing to worry about. just click OK to close
    the dialog box.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Setting Find and Replace Options


    You can how WordPerfect performs a search using the Match and Options menus in
    the Find and Replace Text dialog box.


    # To set find and replace options:


    +   1. Choose Find and Replace from the Edit menu (Figure 48) or press Ctrl+F2
    on the keyboard. The Find and Replace Text dialog box will appear (Figure 54).

    +   2. Enter the text you want to find and/or replace in the appropriate text
    boxes.

    +   3. To set WordPerfect to search for specific matches, choose the Match menu
    item. The Match menu will open (Figure 55). You can set WordPerfect to match:

    +      - Whole Word finds whole words only.

    +      - Case Sensitive exactly matches the word or phrase.

    +      - Font finds the word or phrase in a specific formatting, including the
    font type, size, or attribute, such as bold, italics, or underline.

    +   4. To set WordPerfect to search for specific options, choose the Options menu
    item. The Options menu will open (Figure 56). You can set the search to:

    +      - Begin Find at Top of Document

    +      - Wrap at Beg./End of Document—the search moves from the insertion point
    to the end of the document, then continues from the beginning of the document.

    +      - Limit Find Within Selection—the search will only look through selected
    text.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_80_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_80_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_80_2.png)


    (continued)'
  merge: -1
  img_proc: true
- pgno: 81
  md: '+   Include Headers, Footers, etc. in Find—the search will check all text in
    a document, including text in headers, etc. If this option is not selected, the
    search will only occur within the body of the document.


    +   Limit Number of Changes—the search will limit the number of replacements when
    Replace All is clicked in the Find and Replace Text dialog box.


    5. When you are finished selecting options, perform the search using the Find
    and Replace Text dialog box.


    # The Hidden World of Formatting Symbols and Codes


    Everything you type—including, for instance, the spaces, tabs, and paragraph breaks—is
    entered into a WordPerfect document. Normally, you can''t see the symbols and
    codes that represent these keystrokes because they''re hidden, but you can display
    them, making it easy for you to see everything in your document.


    Formatting symbols are displayed in the body of a document, right along with the
    text. Formatting codes are displayed at the bottom of the document window. A movable
    divider line splits the window into two.


    # To display formatting symbols:


    Choose Show ¶ from the View menu (Figure 57). The hidden symbols will appear in
    your document (Figure 58).


    # Tip


    +   To hide the symbols, just choose Show ¶ from the View menu again.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_81_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_81_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_81_2.png)'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# To specify which symbols display:


    +   1. In the program window, choose Preferences (Figure 8). The Preferences dialog
    box will open (Figure 9).

    +   2. Click Display. The Display Preferences dialog box will appear (Figure 59),
    showing document options (notice that the Document radio button at the top of
    the dialog box is selected).

    +   3. Click the radio button next to Show ¶ near the top of the dialog box. The
    dialog box will change to display symbols options (Figure 60).

    +   4. In the Symbols to Display area, select the options you want to display
    by clicking the box next to the feature. In Figure 60 Space, Hard Return, and
