  md: '# Installing WordPerfect 8


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_36_0.png)


    Figure 15. Click the button next to Update the magic file, then click OK.


    14. If you wish to mimic another WordPerfect installation, enter the full pathname
    where the existing WordPerfect software is installed in the Pattern Directory
    text box. Otherwise, leave the text box blank.


    15. Click OK. The next panel will appear (Figure 14). This panel is used to enter
    the registration number that came with your copy of WordPerfect.


    16. Type the registration number in the text box.


    17. Click OK. The next panel will display (Figure 15). This dialog box is used
    to edit the magic file. Unlike Windows where the operating system "knows" the
    type of file by the file suffix—for instance, .wpd for a WordPerfect document—Linux
    has no built in way to distinguish file types. In Linux, the magic file is used
    to store information about file types to let the operating system distinguish
    file types.


    18. If you wish to update the magic file, and you most likely will wish to do
    so, select the radio button next to Update the magic file to select it. The Linux
    magic file will automatically be updated when WordPerfect is installed. WordPerfect
    will work with Linux and the magic file to distinguish the types of files you
    create.


    19. Click OK. The next panel will open (Figure 16). This panel lets you select
    the languages you would like to install.


    20. Click the check box(es) next to the languages you want to install (you can
    select more than one).


