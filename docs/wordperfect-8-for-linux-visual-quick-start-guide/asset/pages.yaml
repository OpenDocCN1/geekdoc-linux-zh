  md: '# Borders and Fills


    With WordPerfect 8 you can quickly and easily add a border around a page, column,
    or paragraph. (For details on creating columns, turn to page 131.)


    # To add a page border and fill:


    +   1. Position the insertion point on the page where you want the border to appear.

    +   2. Choose Border/Fill from the Page fly-out on the Format menu (Figure 31).
    The Page Border dialog box will open (Figure 32).

    +   3. Click the button next to Border Style and select a border from the drop-down
    list (Figure 33).

    +   4. If you wish to add a fill, click the button next to Fill Options and select
    a fill from the drop-down list (Figure 34).

    +   5. Make sure the check box next to Apply border to current page only is selected.
    Otherwise, a border will appear around every subsequent page.

    +   6. Click OK. The border will appear around the page (Figure 35).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_139_0.png)


    Figure 31. Choose Border/Fill from the Page fly-out on the Format menu.


