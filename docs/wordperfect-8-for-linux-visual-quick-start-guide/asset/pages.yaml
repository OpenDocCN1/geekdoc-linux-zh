- pgno: 259
  md: '# WordPerfect 8 FOR LINUX


    Need to learn WordPerfect for Linux fast?

    Try a Visual QuickStart!


    +   Takes an easy, visual approach to teaching WordPerfect, using pictures to
    guide you through the software and show you what to do.


    +   Works like a reference book—you look up what you need and then get straight
    to work.


    +   No long-winded passages—concise, straightforward commentary explains what
    you need to know.


    +   Companion Web site at www.peachpit.com/vqs/linuxwp8/ offers Linux links, a
    readers'' discussion forum, and more.


    Phyllis Davis is a writer, graphics and Web designer, teacher, and software developer.
    Some of her writing credits include CorelDRAW: Visual QuickStart Guide, FrontPage:
    Visual QuickStart Guide, and Peter Norton''s Guide to Visual Basic. When she''s
    not writing and designing books and fine arts posters, or creating Web sites,
    Phyllis can be found developing and teaching computer courses, digging in her
    garden, tap dancing, and playing with her wonderful little boy, Julian.'
