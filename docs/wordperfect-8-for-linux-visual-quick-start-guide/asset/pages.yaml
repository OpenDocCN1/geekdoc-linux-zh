    # Tip


    +   To quickly open the Define Columns dialog box, right click on the Ruler Bar,
    and then choose Columns from the QuickMenu that appears (Figure 52).


    # To enter text in a column:


    Position the insertion point in a column and type your text. To move to the next
    column, press Ctrl+Enter on the keyboard.


    # To move the insertion point from column to column:


    Click the mouse in the column to which you want to move.


    # To turn columns off:


    +   1. Position the insertion point where you want to turn the columns off.

    +   2. Choose Columns from the Format menu (Figure 39). The Define Columns dialog
