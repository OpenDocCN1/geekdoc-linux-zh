- pgno: 67
  md: '# Moving the Insertion Point


    You can also move the insertion point through text using the arrow keys on the
    keyboard. (You can''t move the insertion point around in white space with the
    keyboard, only with the shadow cursor.)


    # To move the insertion point using the keyboard:


    Use the appropriate arrow key to move in the direction you want to go. For instance,
    if you press the up arrow key, ↑, the insertion point will move up one line; if
    you press the right arrow key, →, the insertion point will move one character
    to the right. There are many keystrokes and combinations. Some of them are listed
    in the sidebar on the next page.


    # Inserting and Deleting Text


    With WordPerfect you can add or delete text from your document at any time.


    # To insert text:


    +   1. Use the shadow cursor or keyboard strokes to move the insertion point to
    the place where you want to add text (Figure 15).

    +   2. Type the text that you want to add (Figure 16).


    # Tip


    When you add characters to existing text, any text to the right of the insertion
    point automatically moves to the right to make room for the new characters and
    word wrapping automatically readjusts the lines of text.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_67_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_67_1.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: '![](img/02dde5e0b11c4f9add393f2d6c89d9a5_68_0.png)


    Figure 17. Position the insertion point where you want to delete text. If you
    press the Backspace key, the text to the right of the insertion point is deleted.
    If you press the Delete key, the text on the left of the insertion point is deleted.


    # To delete text:


    +   1. Use the shadow cursor or keyboard strokes to move the insertion point to
    the place where you want to delete text (Figure 17).

    +   2. Press the Backspace key on the keyboard to delete characters to the right
    of the insertion point.

    +      or

    +      Press the Delete key on the keyboard to delete characters to the left of
    the insertion point.


    Tip


    When text is deleted, any text to the right of the insertion point automatically
    moves to the left to close the space left by the deleted characters. Word wrapping
    automatically readjusts the lines of text.


    # Useful Keystrokes


    Below is a list of a few of the keystrokes you can use to quickly move around
    a document. If a key combination is listed, such as Ctrl+↑, press the Ctrl key
    before you press the ↑ key.


    | PRESS | TO MOVE | PRESS | TO MOVE |

    |---|---|---|---|

    | ↑ | Up one line | Home | Beginning of the line |

    | ↓ | Down one line | End | End of the line |

    | ← | Left one character | Page Up | Up one page or to the top of the document
    window |

    | → | Right one character | Page Down | Down one page or to the bottom of the
    document window |

    | Ctrl+↑ | Up one paragraph | Ctrl+Home | Beginning of the document |

    | Ctrl+↓ | Down one paragraph | Ctrl+End | End of the document |

    | Ctrl+← | Left one word |  |  |

    | Ctrl+→ | Right one word |  |  |'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Inserting Symbols


    In addition to the regular characters found on your keyboard, you can also insert
    special symbols into your documents. These symbols include characters from other
    languages, math, science, and typography.


    # To insert symbols:


    +   1. Position the insertion point in the document where you would like the symbol
    to appear.

    +   2. Choose Symbol from the Insert menu (Figure 18) or press Ctrl+W on the keyboard.
    The Symbols dialog box will appear (Figure 19).

    +   3. Use the Set drop-down list to select the type of characters you want to
    select (Figure 20).

    +   4. In the Symbols grid, click the character you want to use.

    +   5. Click Insert to add the character into the document (Figure 21) and leave
    the Symbols dialog box open.

    +      or

    +      Click OK to insert the character into the document (Figure 21) and close
    the Symbols dialog box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_69_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_69_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_69_2.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_69_3.png)'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Creating Custom Symbols using Overstrike


    Using the keyboard, you can create characters not included in the symbols sets
    accessed on the previous page. If you want to create custom characters, you should
    know that some printers don''t have the capabilities to print them.


    # To create custom symbols:


    +   1. Position the insertion point in the document where you would like the custom
    symbol to appear.

    +   2. Choose Overstrike from the Typesetting fly-out on the Format menu (Figure
    22). The Overstrike dialog box will open (Figure 23).

    +   3. In the Characters text box, type the characters you would like printed
    as an overstrike. Do not add spaces between the characters. Also, character order
    doesn''t matter.

    +   4. To add a formatting attribute to the custom symbol:

    +      A. Click the button with the left pointing arrow on it, to the right of
    the Characters text box (Figure 24).

    +      B. Choose a formatting attribute from the drop-down list.

    +   5. Click OK. The characters you entered in the text box will appear printed
    as an overstrike in your document (Figure 21).


    # Tip


    To insert a symbol into the Characters text box in the Overstrike dialog box,
    press Ctrl+W on the keyboard while the Overstrike dialog box is open. The Symbols
    dialog box will appear and you can select and insert the symbol you want.


    Figure 22. Choose Overstrike from the Typesetting fly-out on the Format menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_70_0.png)


    Figure 23. In the Overstrike Characters area, enter the characters you want printed
    as an overstrike in the text box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_70_1.png)


    Figure 24. Click the button with the left pointing arrow on it, then choose a
    formatting attribute from the drop-down list.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_70_2.png)'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Selecting Text


    You can select characters, words, paragraphs, even entire documents to move, copy,
    cut, delete, or format them. There are three ways to select text: by dragging
    the mouse, clicking the mouse, or positioning the insertion point, then using
    the Select fly-out on the Edit menu (Figure 25). You will know the text has been
    selected when it is highlighted.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_71_0.png)


    # To select a character:


    Position the insertion point to the left of the character, hold down the Shift
    key on the keyboard, then press the right arrow key.


    or


    Position the shadow cursor to the left of the character, press the left mouse
    button, and drag to select the character.


    # To select a word:


    Position the mouse over the word, and then double-click.


    or


    +   1. Position the shadow cursor to the left of the text you want to select.

    +   2. Press the left mouse button and drag until the text is selected (Figure
    26).

    +   3. Release the mouse button.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_71_1.png)


    # To select a sentence:


    Position the insertion point within the sentence, then choose Sentence from the
    Select fly-out on the Edit menu (Figure 27).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_71_2.png)'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# To select a paragraph:


    Position the mouse over the paragraph you want to select, and then triple-click.


    or


    Position the insertion point within the paragraph, then choose Paragraph from
    the Select fly-out on the Edit menu (Figure 28).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_72_0.png)


    Figure 28. Choose Paragraph from the Select fly-out on the Edit menu.


    # To select the contents of a page:


    +   1. Position the insertion point on the page you want to select.

    +   2. Choose Page from the Select menu on the Edit fly-out (Figure 29).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_72_1.png)


    Figure 29. Choose Page from the Select fly-out on the Edit menu.


    # To select the contents of a document:


    Choose All from the Select fly-out on the Edit menu (Figure 30).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_72_2.png)


    Figure 30. Choose All from the Select fly-out on the Edit menu.


    # Use the QuickMenu to Select


    You can also use the QuickMenu to select portions of your text. To do so, position
    the insertion point within a sentence, paragraph or page. Next, move the mouse
    pointer over to the left margin, and then right click. The QuickMenu will appear
    (see below). Choose the desired selection from the QuickMenu.


    This sentence needs to be selected!


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_72_3.png)'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Working with Selected Text


    Once you’ve selected the text that you want to change, you can copy it, cut it
    out of the document, move it, paste it in the document as many times as you wish,
    replace it, or delete it.


    # To copy text:


    +   1. Select the text you want to copy.

    +   2. Choose Copy from the Edit menu (Figure 31).

    +      or

    +      Press Ctrl+C on the keyboard.

    +      or

    +      Click the Copy button on the WordPerfect 8 Toolbar.

    +      or

    +      Right click and choose Copy from the QuickMenu that appears (Figure 32).

    +   The selected text is copied to the X Clipboard, ready for pasting.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_73_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_73_1.png)


    # To cut text:


    +   1. Select the text you want to cut.

    +   2. Choose Cut from the Edit menu (Figure 33)

    +      or

    +      Press Ctrl+X on the keyboard.

    +      or

    +      Click the Cut button on the WordPerfect 8 Toolbar.

    +      or

    +      Right click and choose Cut from the QuickMenu that appears (Figure 34).

    +   The selected text disappears from the document and is saved on the clipboard,
    ready for pasting.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_73_2.png)


    # The X Clipboard


    The X Clipboard is used by all X Windows programs. (See page 20 for more about
    X Windows programs.) The X Clipboard is an area of memory where cut or copied
    text or graphics are held for later use.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# To paste text:


    +   1. Copy or cut the text you want to paste.

    +   2. Move the insertion point to the position where you want to paste the text.

    +   3. Choose Paste from the Edit menu (Figure 35).


    or

    Press Ctrl+V on the keyboard.


    or

    Click the Paste button on the WordPerfect 8 Toolbar.


    or

    Right click and choose Paste from the QuickMenu that appears (Figure 36).

    The text appears to the right of the insertion point.


    # Tips


    +   - You can paste the copied text as many times as you wish anywhere in your
    document.

    +   - The X Clipboard can only hold one thing at a time. So, if you copy or cut
    something new, the old contents of the clipboard are replaced.

    +   - The clipboard is a very handy tool. Since you can open up to 100 documents
    in WordPerfect at one time, you can use the clipboard to copy and paste from one
    document to another.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_74_0.png)


    Figure 34. Choose Cut from the QuickMenu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_74_1.png)


    Figure 35. Choose Paste from the Edit menu or press Ctrl+V on the keyboard.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_74_2.png)


    Figure 36. Choose Paste from the QuickMenu.'
  merge: -1
  img_proc: true
- pgno: 75
  md: "# To move text using drag-and-drop:\n\n+   1. Select the text you want to cut\
    \ and paste.\n+   \n+   2. Position the mouse pointer over the selected text.\n\
    +   \n+   3. Press the left mouse button and drag until the insertion point appears\
    \ where you want to paste the text (Figure 37). A tiny rectangle appears attached\
    \ to the mouse pointer.\n+   \n+   4. Release the mouse button. The text “hops”\
    \ from its old position to the new position (Figure 38).\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_75_0.png)\n\
    \n**Figure 37.** Drag the insertion point to the position where you want to move\
    \ the text.\n\n# ✓ Tip\n\n+   ▪ Moving text is the same as cutting and pasting\
    \ text.\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_75_1.png)\n\n**Figure 38.**\
    \ When you release the mouse button, the text appears selected in its new position.\n\
    \n# To copy and paste text using drag-and-drop:\n\n+   1. Select the text you\
    \ want to copy and paste.\n+   \n+   2. Position the mouse pointer over the selected\
    \ text.\n+   \n+   3. Hold down the Ctrl key on the keyboard, press the left mouse\
    \ button, and then drag until the insertion point appears where you want to paste\
    \ the text (Figure 39).\n+   \n+   4. Release the mouse button, then the Ctrl\
    \ key. The text is copied and pasted into the new position (Figure 40).\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_75_2.png)\n\
    \n**Figure 39.** Select the text you want to copy and paste.\n\n# To replace text:\n\
    \nSelect the text you want to replace, then start typing. The selected text is\
