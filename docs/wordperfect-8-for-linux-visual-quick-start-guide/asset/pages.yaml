- pgno: 166
  md: '# Go Where You Want to Go


    You can quickly move through a document using the up and down arrows on the scroll
    bar at the bottom right of the document window or the Go To command.


    # To move from page to page using the scroll bar arrows:


    At the bottom right of the document window, click the up arrow to move up one
    page or click the down arrow to move down one page (Figure 41).


    # To go to a specific page:


    +   1. Choose Go To from the Edit menu (Figure 42) or press Ctrl+G on the keyboard.
    The Go To dialog box will appear (Figure 43).

    +   2. Make sure the check box next to Page Number is selected, then enter the
    number of the page in the corresponding text box.

    +   3. Click OK. The insertion point will be moved to the top of the page you
    specified.


    # Tip


    If text is selected or if the insertion point is in a column or table, the Go
    To dialog box options will automatically change to let you move around those areas.


    Figure 41. Click the up or down arrows found at the bottom of the scroll bar in
    the document window to move up or down one page.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_166_0.png)


    Figure 42. Choose Go To from the Edit menu or press Ctrl+G on the keyboard.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_166_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_166_2.png)


    Figure 43. Enter the number of the page you would like to go to in the Page Number
    text box, then click OK.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Master Documents and Subdocuments


    As you probably know, it is easier to edit a small document than it is to edit
    a very big one (imagine editing the single document that would make up a 900-page
    book!)


    Master documents are used to manage large documents. Instead of creating one monster-sized
    document, a large project can be split up into smaller, more manageable subdocuments
    that are linked to a master document (Figure 44).


    When a subdocument is linked to a master document, that link is displayed in the
    master document. Master documents can be expanded in order to print or display
    the entire document. Once you''ve printed or displayed the entire document, the
    master document can then be condensed back to its previous form.


    # To create a master document and insert a subdocument:


    +   1. Open the document you want to use as the master document.

    +   2. Position the insertion point where you want to insert a subdocument.

    +   3. Choose Subdocument form the Document fly-out on the File menu (Figure 45).
    The Include Subdocument dialog box will open (Figure 46).

    +   4. Click the list button to the right of the Subdocument Name text box. The
    Select File dialog box will appear (Figure 47).

    +   5. Use the Directory List box to move to the directory where the document
    you want to include is stored.

    +   6. Highlight the document in the File List box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_167_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_167_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_167_2.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_167_3.png)'
  merge: -1
  img_proc: true
