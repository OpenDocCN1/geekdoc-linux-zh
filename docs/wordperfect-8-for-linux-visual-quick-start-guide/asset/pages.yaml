- pgno: 102
  md: '# Tabs and Indents


    Tabs and indents are two different critters, though the two terms are commonly
    used interchangeably, making it all rather confusing.


    A tab moves a single line of text over to the next tab setting. An indent moves
    the left or right side (or both) of an entire paragraph over to the next tab setting.
    As you can see, tabs and indents both use tab settings to determine where the
    line of text or paragraph will move to.


    # To insert a tab into a line of text:


    +   1. Position the insertion point where you want to insert the tab (at the beginning
    of a paragraph is a typical place).

    +   2. Press the Tab key on the keyboard.


    # To indent a paragraph:


    +   1. Select the paragraph(s) you want to indent.

    +   2. Choose the type of indent you want to use from the Paragraph fly-out on
    the Format menu (Figure 48). You can choose from Indent, Hanging Indent, or Double
    Indent (Figure 49).


    or


    +   1. Position the insertion point where you want the indented paragraph to start.

    +   2. Choose the type of indent you want to use from the Paragraph fly-out on
    the Format menu (Figure 48). You can choose from Indent, Hanging Indent, or Double
    Indent (Figure 49).

    +   3. Type your paragraph, then press Enter to end the indentation.


