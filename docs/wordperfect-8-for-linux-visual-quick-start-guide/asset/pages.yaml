- pgno: 62
  md: '# WORKING WITH TEXT


    The power of Word processing programs has forever changed the way people work.
    Back in the days of the dinosaur, folks used typewriters to create documents.
    (Yes, I''m a dinosaur. I learned to type on an IBM Selectric!) Unfortunately,
    when a mistake was made, whiteout or an eraser were necessary tools. Copies of
    a document had to be photocopied or created using carbon paper. Newsletters with
    artwork had to be cut and pasted with scissors and glue.


    Computers and word processing programs have changed all that. Today, you can create,
    format, and edit your documents while you work, and save them for the future.
    Printing multiple copies is a breeze. Adding pictures and tables is easy—with
    a few clicks of the mouse, the sky''s the limit!


    This chapter helps you take the first steps toward creating professional documents
    using WordPerfect. In this chapter, you''ll enter, delete, select, and move text,
    use the shadow cursor to move the insertion point, undo and redo your actions,
    and copy, cut, and paste (without scissors or glue, of course!)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_62_0.png)'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Entering Text


    Let''s get going! Entering text in a WordPerfect document is as easy as typing
    on your keyboard.


    # To enter text:


    +   1. Launch WordPerfect and start a new document (Figure 1). (Turn to Chapter
    3, Startup, for details on how to do this.) A vertical bar, the insertion point,
    will be blinking on the page in the document window.

    +   2. Type your text. As you type, corresponding characters will appear on the
    screen (Figure 2).


    # Tip


    If you see red or blue diagonal lines below any words, this means that there might
    be a spelling or grammar error. To find out more about Spell-As-You-Go and Grammar-As-You-Go,
    turn to Chapter 9, Checking Your Work.


    # To start a new paragraph:


    When you have finished typing a paragraph, press the Enter key on the keyboard.
    The insertion point will move down to the next line where you can start typing
    the next paragraph (Figure 3).


    # Tip


    Starting a new paragraph inserts an invisible hard return code into your document.
    You can view this code by turning on formatting symbols as described on page 70.


    # To start a new page:


    Position the insertion point where you want the new page to start, then press
    Ctrl+Enter on the keyboard.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_63_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_63_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_63_2.png)'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# The Shadow Cursor


    You may have already noticed a small blue line and arrow that appear when you
    move the mouse pointer over text or white space on the page in the document window.
    This is the shadow cursor. The shadow cursor shows you where the insertion point
    will appear when you click the mouse. You don’t need to press the Enter key on
    the keyboard to insert blank lines between text or pictures. All you need to do
    is click where you want the text to go, and then start typing.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_64_0.png)


    Figure 4. The shadow cursor lets you position text anywhere in a document.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_64_1.png)


    Figure 5. The shadow cursor points in the direction the text will flow.


    If you move the shadow cursor around the page in the document window, you will
    notice that it changes the way it looks depending upon where it is on the page.
    If you move it to the left margin, the cursor’s arrow points to the right, indicating
    the direction the text will move when you type (Figure 4). If you move the cursor
    to the right margin, the little arrow points to the left, showing which way the
    text will move (Figure 5). And, if you move the cursor to the very center of the
    page, it will display tiny arrows on both sides of the line, indicating the text
    will be centered when you type.


    You can view or hide the shadow cursor at any time, and also set its color, appearance,
    and what items it snaps to.


    # A Few Things You Should Know


    If you’re new to word processing programs, there are a few things you should know:


    +   - As you type a document, you don’t need to press the Enter key at the end
    of every line. WordPerfect will automatically take care of moving you down to
    the next line when you run out of space. This is called word wrapping. You’ll
    only need to press Enter when you want to start a new paragraph.

    +   - If you make a mistake, you can fix it by deleting the error. You can add
    or delete text anywhere in the document at any time.

    +   - If you want to indent text, use the Tab key, don’t press the space bar.
    You can set tabs using the ruler. This is discussed in Chapter 5, Formatting Your
    Text.

    +   - The unused area of a document is referred to as white space.'
  merge: -1
  img_proc: true
