- pgno: 60
  md: '# Saving your Workspace


    You can set the workspace options to always open a new document, ask you whether
    you want to save the workspace, or automatically save the workspace without asking
    you.


    # To save your workspace:


    +   1. With a document open, choose Preferences in the program window (Figure
    58). The Preferences dialog box will open (Figure 59).


    +   2. Click the Environment button. The Environment Preferences dialog box will
    open (Figure 60).


    +   3. In the Save Workspace area, select the radio button for the item you would
    like to choose:


    +   - Always automatically saves your workspace without asking;

    +   - Never always opens a new document window (the default);

    +   - Prompt on Exit asks whether you want to save the workspace.


    +   4. Click OK to close the Environment Preferences dialog box.


    +   5. Click Close to close the Preferences dialog box.


    # Tip


    Saving your workspace is very handy if you want to work on the same documents
    the next time you launch WordPerfect.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_60_0.png)


    Figure 58. Choose Preferences in the program window.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_60_1.png)


    Figure 59. Click the Environment button.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_60_2.png)


    Figure 60. In the Environment Preferences dialog box, click the radio button next
    to the item you want to select in the Save Workspace area.'
