- pgno: 108
  md: '# Tab Setting Types


    There are several different types of tab settings: left, right, center, decimal,
    and versions of these four types with dot leaders. Here’s a brief description
    of each tab setting, including what it does and how it is displayed on the Ruler
    Bar.


    Left—On the Ruler Bar, this tab setting is displayed as a tiny triangle that points
    down and to the left. When a left tab setting is applied, text appears to the
    right of the tab setting position. The text is left aligned to the tab setting.


    Center—On the Ruler Bar, this tab setting is displayed as a tiny triangle that
    points up. When a center tab setting is applied, text appears centered on the
    tab setting position.


    Right—On the Ruler Bar, this tab setting is displayed as a tiny triangle that
    points down and to the right. When a right tab setting is applied, text appears
    to the left of the tab setting position. The text is right aligned to the tab
    setting.


    Decimal—On the Ruler Bar, this tab setting is displayed as a tiny triangle that
    points up with a small dot in the middle. This type of tab setting is used for
    numbers that contain decimal points such as currency amounts. When a decimal tab
    setting is applied, text is positioned with the decimal point at the tab setting
    position.


    Dot leaders—Along with the 4 tab setting types listed above, these types can also
    be displayed with a line of dots, a dot leader, that precedes the text. This type
    of tab setting is commonly used for tables of contents.


    Below is an example of each type of tab setting:


    | LEFT | CENTER | RIGHT | DECIMAL | LEFT WITH DOTS |

    |---|---|---|---|---|

    | Manicotti | Cheese | Red sauce | $13.95 | Page 29 |

    | Pizza | Mushrooms | Garlic | 125.69 | Page 35 |

    | Ravioli | Spinach | Olive oil | £3.80 | Page 75 |

    | Spaghetti | Artichoke | White sauce | 12.50 | Page 123 |

    | Tortellini | Red pepper | Pesto | ¥890 | Page 125 |'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Hyphenation


    WordPerfect will automatically divide words that are too long to fit on a line
    instead of wrapping the entire word to the next line. This is known as hyphenation.
    Hyphenation looks especially good when the paragraph text is full justified.


    # To turn hyphenation on:


    +   1. Position the insertion point where you want the hyphenation to begin.

    +   2. Choose Hyphenation from the Language fly-out on the Tools menu (Figure
    63). The Line Hyphenation dialog box will open (Figure 64).

    +   3. Select the check box next to Hyphenation On.

    +   4. Click OK. The dialog box will close and hyphenation will be turned on.


    # Tip


    +   To turn hyphenation off, follow the steps above, but make sure the box next
    to Hyphenation On is unselected.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_109_0.png)


    Figure 63. Choose Hyphenation from the Language fly-out on the Tools menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_109_1.png)


    Figure 64. In the Line Hyphenation dialog box, select the check box next to Hyphenation
    On.


    # Summary


    In this chapter you learned how to:


    +   - Make text bold, italic, or underlined

    +   - Add special formatting such as double-underlining

    +   - Make text sub- or superscript

    +   - Automatically change capitalization

    +   - Change fonts and font sizes

    +   - Set a relative font size

    +   - Set a new default font

    +   - Install the fonts that ship with the WordPerfect Personal Edition

    +   - Set paragraph justification

    +   - Change line spacing and height

    +   - Use tabs and indents

    +   - Turn on hyphenation'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# CLIPART, LINES, & CHARTS


    Clipart, shapes, and charts quickly add distinction, organization, and interest
    to your professional documents. The WordPerfect 8 Personal Edition ships with
    hundreds of clipart images on the CD-ROM. What a library of images to have at
    one’s fingertips! Inserting images into documents is easy, so let’s dive right
    in!


    # To insert clipart:


    +   1. Position the insertion point where you would like the graphic to appear.
    (The shadow cursor is really handy for this if you want to place a graphic in
    an area of a document that does not have any text.)

    +   2. Choose From File from the Graphics fly-out on the Insert menu (Figure 1).
    The Insert Image dialog box will open with the default WordPerfect graphics directory
    selected (Figure 2).

    +   3. Highlight a clipart file in the File List box.

    +      or

    +      Use the Directory List box to move to another directory where clipart images
    are stored.

    +   4. Click Insert in the Insert Image dialog box. The clipart image will appear,
    selected in the document (Figure 3).


    Figure 1. Choose From File from the Graphics fly-out on the Insert menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_110_0.png)


    Figure 2. Select an image using the Insert Image dialog box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_110_1.png)


    Figure 3. The clipart image appears in the document window.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_110_2.png)'
  merge: -1
  img_proc: true
