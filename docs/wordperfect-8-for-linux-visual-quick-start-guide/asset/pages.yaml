- pgno: 29
  md: '# Moving Around Dialog Boxes


    It’s easy to move around dialog boxes using the keyboard or the mouse. With the
    mouse, it’s obvious: click what you would like to select or to move to a different
    area of the dialog box. If you don’t want to take your hands from the keyboard,
    there are various keystrokes you can use to move around:


    +   - Tab moves you to the next option

    +   - Shift+Tab moves you to the previous option

    +   - Arrow keys are used to move within a list box or group of options

    +   - Esc works just like the Cancel button, closing the dialog box with no changes

    +   - Enter works just like the OK button, starting a selected action


    # Hardware Considerations


    While Linux will run on virtually any type of Intel compatible computer, running
    a 486 processor with a minimum of 4 MB of RAM is suggested. For WordPerfect 8
    for Linux, Corel Corporation recommends a minimum of 9 MB memory and 87 MB hard
    disk space for a full installation. Please bear in mind that these are minimum
    suggestions and you will no doubt enjoy working with WordPerfect more if you are
    using current hardware.


    # Summary


    In this chapter you learned about:


    +   - Why you might use Linux

    +   - Linux on the Web

    +   - Peachpit companion Web sites

    +   - How WordPerfect works

    +   - The WordPerfect screen

    +   - WordPerfect controls

    +   - The Application Bar

    +   - QuickMenus vs. pop-up menus


    You also learned how to:


    +   - Use a menu

    +   - Use keyboard shortcuts

    +   - Access toolbars

    +   - Change keyboard and toolbar settings to previous WordPerfect versions

    +   - Change view quality

    +   - Zoom in and out

    +   - Get help'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Installing WordPerfect 8


    The term Linux means two things. First, it means the kernel or heart of the Linux
    operating system. Second, it means a distribution of software programs that is
    built around the Linux kernel.


    The latest Linux distributions all incorporate version 2 of the Linux kernel.
    In this sense, at the heart, the distributions are the same. However, the programs
    that make up the distributions can vary considerably. For instance, the Red Hat
    distribution is different from the Caldera distribution, although both are based
    upon the same Linux kernel.


    One way in which distributions vary is the look and feel of the Desktop Environment
    they include. A Linux Desktop Environment is loaded on top of Linux just as Microsoft
    Windows is loaded on top of DOS. In other words, the look and feel of your Linux
    windows depends upon the desktop environment you use.


    You may be interested to know that some Linux distributions—such as Red Hat 6—ship
    with more than one desktop environment. It is up to you to decide which one you
    want to work with.


    The most common Desktop Environments in use today are Gnome and KDE. Red Hat—the
    best-selling distribution of Linux—installs the Gnome Desktop as its default.
    Caldera—the next best-selling distribution—defaults to KDE. From the viewpoint
    of a WordPerfect for Linux user, it doesn''t matter which one you use, because
    WordPerfect works the same in either desktop environment.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_30_0.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'When writing the WordPerfect 8 for Linux: Visual QuickStart Guide, I used the
    Red Hat Linux 6 distribution with the Gnome Desktop. This is what you will see
    when a figure in this book shows the desktop.


    If you want to learn more about Red Hat Linux 6 and the Gnome desktop, take a
    look at the Red Hat Linux 6: Visual QuickPro Guide (Peachpit Press).


    # What is the Linux X11 Windows Server?


    Technically, WordPerfect 8 for Linux will run on any Linux system that is capable
    of displaying X11 Windows. X11 Windows is the mechanism that works behind the
    scenes in Unix systems, such as Linux, to display windowing environments such
    as Gnome. It is an enhanced version of what used to be called X Windows. So the
    real bottom line of whether your system can run WordPerfect 8 for Linux is whether
    it has an X11 Windows server.


    # The Difference Between the WordPerfect Versions


    WordPerfect 8 for Linux is available in three versions: the downloadable version
    which is available at no charge, the Personal Edition, which this book is based
    on, and the Server Edition.


    The downloadable version is a fully functional word processor that will let you
    import and export Microsoft Office 97 document file formats. It includes an online
    help system, over 90 built-in spreadsheet functions, and lets you export Web-ready
    documents in HTML format.


    The Personal Edition includes all of the features in the downloadable version
    plus the ability to draw pictures and create charts, create document suites using
    the ExpressDocs feature, and install any of the 130 fonts that ship with the program.
    In addition, the CD-ROM contains over 5000 clipart images, 200 photographs, and
    180 textures that can be used to create dynamic reports and documents.


    The Server Edition includes all the features in the Personal Edition plus support
    for the Oracle Database engine, advanced application customization programs, and
    the ability to access WordPerfect 8 for those folks using non-GUI terminal distributions
    of Linux.


    # WordPerfect and Linux Licensing


    Unlike the Linux operating system, WordPerfect is a commercial product; it is
    neither freeware nor open source software. You are legally obliged to comply with
    Corel Corporation''s terms of license. For the free, downloadable version, this
    means that each user must register with Corel within 90 days, otherwise the free
    version will expire and not work anymore. Also, the free version is intended for
    personal, not business use.


    The Personal Edition comes with a single-user license. For information about licensing
    the Server Edition, contact Corel Corporation.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Installing the Personal Edition


    This section describes how to install the WordPerfect 8 Personal Edition which
    ships on a CD-ROM. If you want to find out how to download and install the free
    version, turn to page 29.


    To install the WordPerfect 8 Personal Edition on your computer you will need to
    mount the CD-ROM drive, then go to the command line using a Terminal Window. To
    do both of these you will have to log on as root or su to root. If you don''t
    have access to root, see your system administrator.


    # To mount the CD-ROM drive:


    +   1. Insert the WordPerfect CD-ROM into your computer''s CD-ROM drive.

    +   2. Choose Disk Management from the System fly-out on the Gnome main menu (Figure
    1). The User Mount Tool dialog box will open (Figure 2).

    +   3. Click the Mount button found to the right of your computer''s CD-ROM location.
    In Figure 2 this location is /mnt/cdrom. The CD-ROM drive will mount and the button
    you just clicked will read "Unmount."

    +   4. Click Exit to close the User Mount Tool dialog box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_32_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_32_1.png)'
  merge: -1
  img_proc: true
