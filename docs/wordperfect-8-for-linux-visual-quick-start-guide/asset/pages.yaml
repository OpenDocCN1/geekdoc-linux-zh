- pgno: 104
  md: '# The WordPerfect Ruler Bar


    To get started with changing tab settings, you will need to use the Ruler Bar.


    The Ruler Bar shows you a lot of information in one little space. The Ruler Bar
    is made up of two horizontal strips, one above the numbered measurements and one
    below.


    The margin strip is displayed above the numbered measurements (Figure 53). The
    small, black, sideways triangles display the positions of the left and right margins.
    You will use these triangles in Chapter 8, Page and Document Setup, when you find
    out how to set the page margins.


    The tab strip is displayed below the numbered measurements (Figure 53). The tiny
    triangles indicate where the tabs are set. By default, WordPerfect places these
    tab settings every .5" (1.3 cm).


    When you change the tab settings, the changes take effect from the paragraph where
    the insertion point is located on. To change tab settings for a specific paragraph,
    select that paragraph. To change tab settings for an entire document, press Ctrl+Home
    to move to the top of the document, then change the settings. Remember that tab
    settings effect both tabs and indents.


    A complete list of the different types of tab settings can be found in the sidebar
    on page 97.


    # To view/hide the Ruler Bar:


    Choose Ruler from the View menu (Figure 54). The Ruler Bar will appear right under
    the toolbars if it''s not already displayed (Figure 53) or vanish if it is.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_104_0.png)


    Figure 53. The Ruler Bar appears right below the toolbars.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_104_1.png)


    Figure 54. Choose Ruler from the View menu. A tiny square appears next to the
    menu item when it is displayed.'
  merge: -1
  img_proc: true
