- pgno: 152
  md: '# PAGE AND DOCUMENT SETUP


    WordPerfect isn’t your grandfather’s word processor! (But wait! Did your grandfather
    have a word processor?) Besides being able to handle text and images in many ways,
    WordPerfect 8 includes desktop publishing capabilities. This means that besides
    creating just letters and reports, you can create many types of multi-page page
    publications such as brochures, flyers, and catalogs. In addition, you can create
    documents for any paper size that is used anywhere in the world. In the past,
    all this would have required separate desktop publishing software.


    In this chapter you will learn how to set page size and orientation. Then you
    will set margins, view and hide margin guidelines, and set the text’s vertical
    alignment on the page. From there you will add pages and page numbers to a document,
    move between pages, and insert a subdocument into a master document.


    # Which Way is My Page Oriented?


    The term page orientation refers to the way a page is situated. If the page is
    taller than it is wide, it is in portrait orientation. If the page is wider than
    it is tall, it is in landscape orientation.


    This is a portrait page.


    This is a landscape page.'
  merge: -1
  img_proc: true
- pgno: 153
