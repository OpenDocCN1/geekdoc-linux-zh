- pgno: 170
  md: '# CHECK YOUR WORK


    Good grammar and spelling are as important in the creation of a professional document
    as good layout. WordPerfect comes with five tools that help you quickly find and
    fix the mistakes in your documents.


    In this chapter you will learn how to use several tools:


    +   - **QuickCorrect** automatically replaces common spelling errors and mistyped
    words. It can also be used to expand abbreviations. For instance, when writing
    this book, I needed to type "dialog box" several hundred times. Instead of typing
    both words out every time, I would type "db" and QuickCorrect would automatically
    change it to "dialog box".


    +   - **Spell-As-You-Go** gives immediate access to WordPerfect''s dictionary.
    If it finds a word that is possibly misspelled, diagonal red stripes appear beneath
    the word.


    +   - **Spell Check** is used to search documents for misspelled words, words
    that have been duplicated, and capitalization errors.


    +   - **Grammar-As-You-Go** lets you check your grammar as you type. If it finds
    a word or phrase that may have a grammatical error, diagonal blue stripes appear
    beneath the word or phrase.


    +   - **Grammatik** is used to check documents for spelling, punctuation, grammar,
    and stylistic mistakes. With Grammatik, you can set up custom writing styles,
    depending upon the types of writing you do. A few of the predefined styles are
    advertising, fiction, memo, and technical.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# QuickCorrect


    Besides automatically replacing spelling mistakes, mistyped words, and abbreviations,
    QuickCorrect can also be used to insert SmartQuotes—typographer’s quotation marks—in
    place of straight single and double quotes, and fix such problems as two spaces
    between words and two uppercase letters at the beginning of a sentence.


    Another QuickCorrect option is called Format-As-You-Go. Format-As-You-Go helps
    you insert formatting elements, such as bulleted and numbered lists, ordinal numbers,
    and lines, as you type.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_171_0.png)


    # To turn QuickCorrect on or off:


    +   1. Choose QuickCorrect from the Tools menu (Figure 1). The QuickCorrect dialog
    box will appear with the QuickCorrect radio button selected at the top (Figure
    2).

    +   2. To turn QuickCorrect on, make sure the check boxes next to Replace words
    as you type and Correct other mis-typed words when possible are selected. To turn
    QuickCorrect off, deselect the check boxes.

    +   3. Click OK. The QuickCorrect dialog box will close and will be on or off
    depending upon whether you selected the check boxes or not.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_171_1.png)


    Tip


    +   By default, QuickCorrect is turned on when you launch WordPerfect for the
    first time.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# To add a new entry to QuickCorrect:


