    # To resize a text box using the handles:


    +   1. Click the text box that you want to change to select it. You''ll know it''s
    selected when dashed lines appear around it.

    +   2. Position the mouse pointer over one of the eight handles.

    +   3. Press the left mouse button and drag the handle to resize the box (Figure
    58).

    +   4. Release the mouse button when you are finished dragging the handle.


    # Tip


