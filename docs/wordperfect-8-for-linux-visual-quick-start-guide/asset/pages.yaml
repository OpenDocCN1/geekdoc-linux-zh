- pgno: 136
  md: "# Drop Caps\n\nA drop cap is an enlarged letter or word at the beginning of\
    \ a paragraph that draws a reader's attention in a visually inviting way. Drop\
    \ caps can be created as you type or added to text that has already been entered.\n\
    \n# To create a drop cap:\n\n+   1. Position the insertion point at the beginning\
    \ of the new paragraph where you would like the drop cap to appear.\n+   \n+ \
    \  or\n+   \n+   Position the insertion point in an existing paragraph to which\
    \ you would like to add a drop cap.\n\n+   2. Choose Drop Cap from the Paragraph\
    \ fly-out on the Format menu (Figure 21). The insertion point will enlarge, ready\
    \ for you to type the drop cap. The Property Bar will change to display special\
    \ drop-cap commands (Figure 22).\n\n+   3. Click the Drop Cap Style button on\
    \ the Property Bar and select a predefined drop cap style (Figure 23).\n\n+  \
    \ 4. Click the Drop Cap Height button on the Property Bar and set how many lines\
    \ high the drop cap will be (Figure 24).\n\n(continued)\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_136_0.png)\n\
    \nFigure 21. Choose Drop Cap from the Paragraph fly-out on the Format menu.\n\n\
    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_136_1.png)\n\nFigure 22. Special drop\
    \ cap command buttons appear on the Property Bar.\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_136_2.png)\n\
    \nFigure 23. Click the Drop Cap Style button on the Property Bar and choose a\
    \ drop cap type from the drop-down list.\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_136_3.png)\n\
    \nFigure 24. Set how tall the drop cap will be by clicking the Drop Cap Height\
    \ button on the Property Bar and selecting a height."
  merge: -1
  img_proc: true
- pgno: 137
  md: '5. Click the Drop Cap Position button on the Property Bar and set where the
    drop cap will appear, next to the text, to the right of the margin, or in the
    margin (Figure 25).


    6. To select a font for the drop cap:


    +   A. Click the Drop Cap Font button on the Property Bar. The Drop Cap Font dialog
    box will open (Figure 26).

    +   B. Select a typeface from the Font Face list box and set the other font attributes
    you would like.

    +   C. Click OK to close the Drop Cap Font dialog box and return to the document.


    7. To set a border around and add a fill behind the drop cap:


    +   A. Click the Drop Cap Border/Fill button on the Property Bar. The Drop Cap
    Border dialog box will open (Figure 27).

    +   B. Click the Border Style button and select a border from the drop-down list.

