    sections, except the form file is an envelope instead of a form letter, contract,
    or label.


    # To create an envelope form file:


    +   1. Start a new document.


    +   2. Choose Merge from the Tools menu (Figure 1). The Merge dialog box will
    open (Figure 2).


    +   3. In the Form File area (Figure 29), click Form. The Create Form File dialog
    box will open (Figure 30).


    +   4. Make sure the radio button next to Associate a Data File is selected, then
    click the list button next to the text box. The Select Data File dialog box will
    open (Figure 31).


    +   5. Use the Directory List box to move to the location where the data file
    is stored, then use the File List box to select the file.


    +   6. Click OK. The Select Data File dialog box will close and you will return
    to the Create Form File dialog box. The full path of the data file will be in
    the text box (Figure 30).


    +   7. Click OK. The Create Form File dialog box will close and the Merge Toolbar
    will appear below the Property Bar in the document window.


    (continued)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_208_0.png)


    Figure 29. Click Form in the Form File area of the Merge dialog box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_208_1.png)


