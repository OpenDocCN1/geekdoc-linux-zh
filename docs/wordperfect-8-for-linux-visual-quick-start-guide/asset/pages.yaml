  md: "# Formatting your Table\n\nWordPerfect lets you quickly set how text is positioned\
    \ and formatted in the cells, using cell, row, and column attributes. Then, with\
    \ the special table command buttons on the Property Bar and SpeedFormatting you\
    \ can set how the table and its elements—cells, rows, and columns—look.\n\n# To\
    \ set cell attributes:\n\n+   1. Position the insertion point in the cell whose\
    \ attributes you want to change.\n+   \n+   or\n+   \n+   Select the cells whose\
    \ attributes you want to change.\n\n+   2. Click the Table menu on the Property\
    \ Bar and choose Format (Figure 34) or press Ctrl+F12 on the keyboard. The Format\
    \ dialog box will open with the Cell radio button selected (Figure 35).\n\n+ \
    \  3. In the Alignment area (Figure 36), use the drop-down lists to set the text’s\
    \ vertical alignment in the cell—top, center, or bottom—and horizontal alignment\
    \ or justification, in the cell—left, right, center, full, all, or decimal aligned\
    \ justification.\n\n+   4. In the Cell Attributes area (Figure 37) you can set\
    \ whether a cell is locked and if it is to be ignored when performing calculations.\
    \ Information in locked cells cannot be changed.\n\n+   5. Use the Appearance\
    \ and Text Size areas to set the text’s appearance, if you want to use special\
    \ formatting.\n\n+   6. Click OK. The Format dialog box will close and the text\
    \ in the cell(s) you selected will assume the new formatting you set.\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_191_0.png)\n\
    \n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_191_1.png)\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_191_2.png)"
