- pgno: 142
  md: '# Columns


    Columns vertically divide text in a page, letting you create documents such as
    newsletters, lists, and inventories. You can define up to 24 columns on a page.


    There are four types of columns:


    +   Newspaper—the text in a newspaper column flows down to the bottom of the page
    (or to a column break), then starts at the top again in the next column (Figure
    43).


    +   Balanced Newspaper—this type of column is similar to normal newspaper columns,
    but WordPerfect automatically adjusts the bottom of the columns so they line up
    (Figure 44).


    +   Parallel—the text in parallel columns is grouped in rows across the page.
    The next row starts after the longest column in the previous row (Figure 45).
    This kind of column is handy for resumes.


    +   Parallel with Block Protect—this column type is similar to normal parallel
    columns, but rows are kept together on a page. If one row becomes too long to
    fit on that page, WordPerfect automatically moves the entire row to the next page
    (Figure 46).


    Figure 43. The text in newspaper columns flows down the page then up to the top
    of the next column.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_142_0.png)


    Figure 44. The text in balanced newspaper columns flows down the page then up
    to the top of the next column just like regular newspaper columns but the bottom
    of each column is automatically lined up.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_142_1.png)


    Figure 45. The text in parallel columns is grouped in rows.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_142_2.png)


    Figure 46. The text in parallel with block protect columns works like regular
    parallel columns, but rows are kept together on one page. If some of the text
    becomes too long for one page, then the entire row is moved to the next page.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_142_3.png)


    # Removing Borders and Fills


    To remove page, paragraph, or column borders, just open the appropriate Border/Fill
    dialog box (they are shown in Figures 32, 37, and 41) and click the Off button
    found at the upper right.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# To turn columns on:


    +   1. Position the insertion point in the paragraph where you want the columns
    to start.

    +   2. Choose Columns from the Format menu (Figure 39). The Define Columns dialog
    box will open (Figure 47).

    +   3. In the Number of Columns area, type a number in the Columns text box.

    +   4. Select a column type using the radio buttons in the Type area.

    +   5. In the Column Spacing area, enter a measurement in the Spacing Between
    Columns text box. If you have selected Parallel or Parallel with Block Protect
    columns, also enter a measurement in the Line Spacing Between Rows in Parallel
    Columns text box.

    +   6. In the Column Widths area, use the text boxes to set how wide the columns
    will be. WordPerfect automatically creates equal columns that span the page width,
    so if you don’t want a custom column width or spacing, there’s no need to set
    anything in this area.

    +   7. Click OK. The column style you selected will appear in your document (Figure
    48). Light gray guidelines will appear on the page, indicating where the columns
    are (these lines don’t print).


    # Tip


    +   The column guidelines can be hidden. Turn to page 146 for details on how to
    do this.


