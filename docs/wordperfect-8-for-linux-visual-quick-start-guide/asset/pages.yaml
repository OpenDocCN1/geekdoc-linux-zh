- pgno: 23
  md: '# Viewing a Document


    The View menu gives you two commands for changing the view quality. View quality
    is the way a document is displayed in the document window.


    The two view qualities, draft view and page view both display a document in the
    WYSIWYG (What You See Is What You Get) environment, imitating how it will look
    when printed. This imitation includes using the fonts in the document window that
    the printer will use to print. Font attributes, including bold, italics, and underlines
    are displayed in the document window as they will appear on the printed page.


    However, there are some differences between the two views. Here’s a brief description
    of each view:


    +   - Draft view (Figure 15) is handy when working with a large or complex document.
    It redraws faster on the screen and uses less screen space because items such
    as headers, footers, and footnotes are not displayed. Also, page breaks are displayed
    using a double line.


    +   - Page view (Figure 16) shows everything in a document, including the headers,
    footers, footnotes, and watermarks. Each time a new page appears, the entire page
    is graphically displayed, meaning that any unused part of the page is displayed.


    # To change view quality:


    +   1. Open the View menu by clicking the menu title (Figure 17).

    +   2. Select either Draft or Page from the View menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_23_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_23_1.png)'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Zooming In and Out to See a Document


    The Zoom command is used to magnify or reduce the view of a document. You can
    zoom in to see detail or zoom out to view an entire document. Zooming in or out
    has no effect on the document or the size of the text, only your view of it.


    # To zoom to a different magnification:


    Click the Zoom button on the WordPerfect 8 Toolbar, then choose the magnification
    you want from the drop-down list (Figure 18).


    or


    +   1. Choose Zoom from the View menu (Figure 19). The Set Zoom dialog box will
    open (Figure 20).

    +   2. Select a radio button next to the magnification you would like to use,
    then click OK. The document will zoom in or out in the document window.


    Figure 17. Choose either Draft or Page from the View menu or press Ctrl+F5 or
    Shift+Ctrl+F5, respectively.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_24_0.png)


    Figure 18. Click the Zoom button on the WordPerfect 8 Toolbar, then choose the
    magnification you would like to use.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_24_1.png)


    Figure 19. Choose Zoom from the View menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_24_2.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_24_3.png)


    Figure 20. Select a magnification from the Zoom area, then click OK.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# The Property Bar


    The Property Bar (Figure 21), located by default near the top of the document
    window below the WordPerfect 8 Toolbar, is a context-sensitive command bar. It
    displays different buttons and options depending on which tool or item (such as
    a graphic or table) is selected. For instance, when a graphic is selected, the
    Property Bar contains only graphic-related commands.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_25_0.png)


    Figure 21. The Property Bar is context-sensitive. In this example, the insertion
    point was blinking in the document, waiting for text to be typed, thus text related
    commands and options are displayed.


    # It''s a Pop-up Menu! No, Wait! It''s a QuickMenu!


    When you right click on the Gnome or KDE Desktop, a pop-up menu appears that you
    can use to choose a command or open a dialog box (Figure 22). (Some folks just
    call these pop-ups.) Gnome and KDE both use the term "pop-up menu" for this item.


    WordPerfect also uses pop-up menus, but calls them QuickMenus. They are referred
    to as QuickMenus in both the WordPerfect online Help file and the WordPerfect
    User''s Guide that ships with the Personal Edition. To try to avoid any confusion,
    here''s how these useful menus are named in this book:


    +   - When working with the Gnome and KDE Desktops in Chapters 2 and 3, I use
    the term pop-up menu.

    +   - When working in WordPerfect, I use the term QuickMenu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_25_1.png)


    Figure 22. This pop-up menu with open fly-out is accessed by right clicking on
    the Gnome Desktop. Pop-up menus are called QuickMenus in WordPerfect 8.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# The Application Bar


    The Application Bar (Figure 23) is your guide to what''s happening in the document
    window. It gives information about the position of the insertion point and on
    which page you''re working.


    You can customize the Application Bar to display other information including the
    date and time, font in use, keyboard selection, and zoom magnification. Any of
    these items added to the Application Bar also perform another purpose: you can
    click them to change the setting. For instance, if you click the Zoom button on
    the Application Bar, the Set Zoom dialog box will open (Figure 20), letting you
    select another zoom setting.


    You can customize the Application Bar by right clicking on the Application Bar,
    then choosing Settings from the QuickMenu (Figure 24). The Application Bar Preferences
    dialog box will open (Figure 25), ready to help you customize the Application
    Bar. For a complete discussion about customizing the Application Bar, turn to
    pages 153-154.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_26_0.png)


    Application Bar


    Figure 23. The Application Bar displays important information as you work on a
    document. For instance, the selected printer will be displayed in a balloon window
    when the mouse is positioned over the printer icon.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_26_1.png)


    Figure 24. Right click on the Application Bar and choose Settings from the QuickMenu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_26_2.png)


    Figure 25. You can set what is available on the Application Bar using the Application
    Bar Preferences dialog box.'
  merge: -1
