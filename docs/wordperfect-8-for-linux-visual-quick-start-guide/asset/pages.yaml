  md: '# Toolbars


    There are sixteen toolbars available in WordPerfect 8. They give access to commands
    and dialog boxes with just the click of a button. Two toolbars are available,
    by default, when you launch WordPerfect for the first time. They are the WordPerfect
    8 Toolbar and the Property Bar.


    # To access the toolbars:


    +   1. Choose Toolbars from the View menu (Figure 7). The Toolbars dialog box
    will open (Figure 8).

    +   2. In the Available toolbars list box, select the check boxes next to the
    toolbars you want to display.

    +   3. Click OK. The Toolbars dialog box will close and the toolbars you selected
    will appear.


    or


    Right click on a toolbar at the top of the document window and choose the toolbar
    you want to display from the QuickMenu that appears (Figure 9).


    Figure 7. Choose Toolbars from the View menu.


