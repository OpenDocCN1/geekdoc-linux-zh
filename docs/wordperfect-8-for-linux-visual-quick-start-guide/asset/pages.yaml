- pgno: 84
  md: '# FORMATTING YOUR TEXT


    In the last chapter you discovered how to enter and manipulate text. The next
    step on the road to WordPerfect proficiency is learning how to format text. WordPerfect
    lets you control exactly how characters look, by letting you change the size and
    shape of text, as well as setting how paragraphs look as a whole, by letting you
    set justification, line spacing, and indentation.


    This chapter is split into two parts. The first deals with character formatting
    and the second with paragraph formatting.


    Character formatting changes the way characters look. These changes can include
    the font or typeface the text is set in, and items that emphasize text such as
    bold, italics, and underlines.


    Paragraph formatting sets how an entire paragraph looks. Some things you can do
    to change the way a paragraph appears are setting justification and adding indents.


    Remember the golden rule of layout and design, though, when changing the way things
    look: less is more. There are so many options that you will discover in this chapter
    and Chapter 7, Fun with Text, that you may be tempted to excess. Try to limit
    the amount of formatting you use. TOO much may be rather DISTRACTING and make
    a document hard to read.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Character Formatting


    Font formatting comes in all shapes and sizes (literally!). You can change fonts,
    add emphasis, make text bigger or smaller, and change text position, moving it
    up for superscript or down for subscript.


    When formatting text, you can select the text you want to format or format as
    you type by turning a format command on, typing the text, then turning the format
    command off.


    # To make text bold:


    +   1. Select the text you want to format.

    +   2. Click the Bold button on the Property Bar or press Ctrl+B on the keyboard.

    +   or

    +   A. Choose Font from the Format menu (Figure 1) or press F9 on the keyboard.
    The Font dialog box will open (Figure 2).

    +   B. In the Appearance area, click the check box next to Bold (Figure 3).

    +   C. Click OK to close the dialog box.

    +   The text will be bold (Figure 4).


    or


    +   1. As you type, click the Bold button on the Property Bar or press Ctrl+B
    on the keyboard.

    +   2. Type the bold text.

    +   3. Turn off the bold formatting by clicking the Bold button on the Property
    Bar or pressing Ctrl+B on the keyboard again.

    +   The text will be bold (Figure 4).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_85_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_85_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_85_2.png)'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# To add italics:


    +   1. Select the text you want to format.

    +   2. Click the Italic button on the Property Bar or press Ctrl+I on the keyboard.


    or


    +   A. Choose Font from the Format menu (Figure 1) or press F9 on the keyboard.
    The Font dialog box will open (Figure 2).

    +   B. In the Appearance area, click the check box next to Italic (Figure 5).

    +   C. Click OK to close the dialog box.


    The text will be italicized (Figure 6).


    or


    +   1. As you type, click the Italic button on the Property Bar or press Ctrl+I
    on the keyboard.

    +   2. Type the italic text.

    +   3. Turn off the italic formatting by clicking the Italic button on the Property
    Bar or pressing Ctrl+I on the keyboard again.


    The text will be italicized (Figure 6).


    # Tip


    To remove italic or bold formatting, select the text that is italicized or bold,
    then click the Italic or Bold button on the Property Bar.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_86_0.png)


    Figure 4. The text you selected or type is bold.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_86_1.png)


    Figure 5. Click the check box next to Italic, then click OK.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_86_2.png)


    Figure 6. The text you selected or type is italicized.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# To underline text:


    +   1. Select the text you want to format.

    +   2. Click the Underline button on the Property Bar or press Ctrl+U on the keyboard.

    +   or

    +   A. Choose Font from the Format menu (Figure 1) or press F9 on the keyboard.
    The Font dialog box will open (Figure 2).

    +   B. In the Appearance area, click the check box next to Underline (Figure 7).

    +   C. Click OK to close the dialog box.

    +   The text will be underlined (Figure 8).

    +   or

    +   1. As you type, click the Underline button on the Property Bar or press Ctrl+U
    on the keyboard.

    +   2. Type the underlined text.

    +   3. Turn off the underline formatting by clicking the Underline button on the
    Property Bar or pressing Ctrl+U on the keyboard again.

    +   The text will be underlined (Figure 8).


    # Tip


    +   - To remove underlining, select the text that is underlined, then click the
    Underline button on the Property Bar.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_87_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_87_1.png)


    # A Quick Way to Add the Date


    With WordPerfect it''s easy to add the date even if you can''t remember what day
    it is! This feature can be handy when writing memos, faxes, and letters.


    # To insert the date:


    +   1. Position the insertion point where you want the date to appear.

    +   2. Press Ctrl+D on the keyboard.


    # Tip


    +   - If you want the date to appear right justified on a line by itself, press
    Shift+Ctrl+F7 on the keyboard.'
