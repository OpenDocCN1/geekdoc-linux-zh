- pgno: 12
  md: '# THE BASICS


    # 1


    Welcome to the world of WordPerfect 8 for Linux! I am a long time WordPerfect
    devotee and am very pleased to see it up and running on the Linux platform.


    My purpose in writing this book is to show just how easy it is to create professional
    documents using the tools that WordPerfect 8 offers. In keeping with the Visual
    QuickStart Guide format, my aim is to present easy, step-by-step directions with
    illustrations to take the mystery out of even the most complicated word processing
    procedure.


    WordPerfect 8 for Linux offers a complete, professional set of tools for creating
    many kinds of documents, from birthday cards, brochures, and newsletters, to reports,
    memos, and information-intensive documents that include charts and tables. This
    program has incredible power and loads of features, all incorporated into a user
    interface that will be familiar to those who''ve used other word processing programs.
    As sophisticated as WordPerfect 8 is, it''s also easy to use. You can run with
    it as far as you please.


    WordPerfect is feature-rich. If you take it one step at a time, you''ll be creating
    professional documents in no time. For those of you who are acquainted with previous
    WordPerfect DOS and Windows versions, use this book as a guide to new features
    and techniques, and as a handy reference.


    Let''s get started!


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_12_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_12_1.png)'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Why Linux?


    Why should you run WordPerfect on Linux? There are many good answers to this question
    as witnessed by the fact that Linux is the fastest growing operating system today.
    Perhaps you have chosen Linux because:


    +   - It is the predominant operating system of Web servers.

    +   - It is more stable than any version of Microsoft Windows. (I''ve been running
    it for months and haven''t had one crash yet!)

    +   - It is extremely affordable.

    +   - You believe in the tenants of the open-source movement.


    On the other hand, maybe you''ve heard a lot about Linux and are just starting
    to experiment with it.


    Whatever reason you have for choosing Linux, WordPerfect 8 for Linux is an excellent
    tool for your professional word processing needs.


    You''ll be glad to know that WordPerfect 8 for Linux is as easy to use as any
    word processor running on Microsoft Windows. In other words, you don''t have to
    be a technical genius to get WordPerfect up and running. And the best news yet:
    you can save and open files in WordPerfect 8 for Linux that are compatible with
    many Microsoft Windows file formats, including Microsoft Word for Windows. (Turn
    to page 44 for details on how to do this.)


    # Learning More About Linux


    If you''d like to learn more about Linux, my husband''s wonderful book will help
    speed you on your way (no, I''m not biased!). His book: Red Hat Linux 6: Visual
    QuickPro Guide by Harold Davis (Peachpit Press). This book comes with a full working
    copy of Linux on the CD-ROM.


    Some Web sites you can visit for more information about Linux and the Linux community:

    Very useful Linux links: http://www.bearhome.com/linux/links.html

    Red Hat home site: http://www.redhat.com/

    Linux Links, a portal for Linux information: http://www.linuxlinks.com/


    # Companion Web Sites


    Peachpit Press has created companion Web sites for its Linux titles. These companion
    Web sites include text excerpts from the books, links to other resources, discussion
    threads, and chat areas.


    The companion site for WordPerfect 8 for Linux: Visual QuickStart Guide can be
    found at: http://www.peachpit.com/vqs/1inuxwp8/


    The companion site for Red Hat Linux 6: Visual Quick Pro Guide can be found at:
    http://www.peachpit.com/vqp/linux'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# The Way WordPerfect Works


    WordPerfect 8 is a full-featured word processing program that you can use to create
    many kinds of text-based documents—letters, reports, memos, envelopes, and Web
    pages.


    WordPerfect 8 documents are created in the document window. The program window
    appears when WordPerfect is launched. Anything changed using the program window
    affects all documents created in WordPerfect.


    Documents are saved in the WordPerfect 8 .wpd file format. They can be imported
    from or exported to other file formats.


    The insertion point is used to position text, graphics, tables, and charts on
    the page. The insertion point also shows you where you are in a document. The
    shadow cursor lets you position text anywhere in a document, even if nothing has
    been typed there before.


    Formatting in WordPerfect is handled on character and paragraph levels. Character
    formatting involves changing and individual paragraphs. Paragraph formatting deals
    with paragraphs as a whole.


    WordPerfect lets you be creative with character formatting. You can change fonts,
    font sizes, and other font attributes, such as bold, italic, underline, and color.
    You can set the spacing between lines of text.


    With paragraph formatting, you can indent the first line of a paragraph, using
    a tab setting. Or you can indent the entire left side of a paragraph using an
    indent. A double indent moves both the left and right sides of a paragraph in
    towards the center of the page. You can also set the spacing between paragraphs.


    Text can be placed into columns that vertically or horizontally divide the page.
    There are two main types of columns—newspaper and parallel.


    Page setup involves how the page looks as a whole. You can adjust top, bottom,
    left, and right margins, and set header and footer size and appearance. Pages
    can be added and deleted. Subdocuments can be inserted into a master document.


    Graphics that ship with WordPerfect and those you have stored in other clipart
    libraries can be inserted into documents to add distinction and interest. Images
    can be resized horizontally, vertically, or proportionately. Borders and fills
    can be added to graphics. Text can be set to flow around, behind, or in front
    of a graphic.


    Charts and tables can be created to organize and display information in useful,
    graphical ways. Using the chart mode of WPD, you can create pie, bar, line, hi-lo,
    area, and scatter charts. Tables of virtually any dimension can be inserted into
    a document. Using Speed Format, you can quickly make a table with a custom look.


    Merges help you quickly amalgamate an address list with a form letter or other
    document to create personalized copies. Envelopes can also be created using merge
    field codes.


    With WordPerfect, you can create macros using the macro recorder. Macros are mini-programs
    that automatically perform keystrokes and commands.


    You can change the view of a document to make editing easier. You can zoom in
    to get a close up look and work with small details or zoom out to see the document
    as a whole.


    You can use precision tools such as guidelines, tab settings, margin settings,
    and rulers to align text, tables, charts, and images, making your documents precise.


    When you finish a document, the file can be printed. If you''ve created a Web
    document, it can be saved in HTML format for the Internet.'
  merge: -1
  img_proc: true
