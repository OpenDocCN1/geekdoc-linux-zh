- pgno: 21
  md: '# For Users of Previous WordPerfect Versions


    For those of you out there who are users of previous WordPerfect versions and
    are moving to WordPerfect 8 for Linux, welcome!


    You might like to know that you don''t have to leave your favorite keyboard strokes
    and shortcuts, and toolbars behind.


    With WordPerfect 8 for Linux, you can set your keyboard to work as it does in
    WordPerfect 6 for DOS, or WordPerfect 5.1, 6, 7, or 8 for Windows. Instead of
    the WordPerfect 8 Toolbar, you can set the WordPerfect 6 or 7 Toolbar.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_21_0.png)


    # To change keyboard settings to previous WordPerfect versions:


    +   1. Choose Preferences in the program window (Figure 10). The Preferences dialog
    box will open (Figure 11).

    +   2. Click Keyboard. The Keyboard Preferences dialog box will appear (Figure
    12).

    +   3. Select the keyboard you want to use from the Keyboards list box.

    +   4. Click Select. The Keyboard Preferences dialog box will close.

    +   5. Click Close to close the Preferences dialog box and return to the document
    window.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_21_1.png)


