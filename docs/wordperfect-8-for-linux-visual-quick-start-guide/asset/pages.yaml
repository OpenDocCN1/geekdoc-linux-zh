    site. While this program is offered at no charge, it is about 24 megabytes. It
    can be downloaded in one zipped file or seven zipped file segments. If you are
    using a dial-up connection to access the Internet, downloading this version will
    take hours. If you purchased and are running the Red Hat Linux 6 distribution,
    this "free" WordPerfect version is available on the second CD-ROM in the three
    disk set.


