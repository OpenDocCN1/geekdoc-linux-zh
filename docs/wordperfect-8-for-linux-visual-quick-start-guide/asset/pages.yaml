- pgno: 223
  md: '14. Click OK. The Keyboard Editor dialog box will close, returning you to the
    Keyboard Preferences dialog box. The name of the new keyboard you created will
    appear in the Keyboards list box (Figure 26).


    15. Make sure the new keyboard is selected in the Keyboards list box, then click
    Select. The Keyboards Preferences dialog box will close, returning you to the
    Preferences dialog box.


    16. Click Close to close the Preferences dialog box and return to the WordPerfect
    document window. Try out your new macro keyboard shortcut. Position the insertion
    point, if you need to, then press the keyboard combination and watch the macro
    play!


    # Tips


    +   - If you make a mistake and assign the macro to a keyboard combination you
    didn’t intend to, just select the keyboard combination from the Choose a Key to
    Assign or Unassign area, then click the Unassign button.

    +   - If you play a macro and don’t get the results you wanted, just click the
    Undo button on the WordPerfect 8 Toolbar, or choose Undo from the Edit menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_223_0.png)


