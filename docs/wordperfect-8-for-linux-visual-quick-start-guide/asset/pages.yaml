  img_proc: true
- pgno: 217
  md: '# To play a macro:


    +   1. Choose Play from the Macro fly-out on the Tools menu (Figure 5) or press
    Shift+Ctrl+F10 on the keyboard. The Play Macro dialog box will appear (Figure
    6).


    +   2. Click the list button next to the right of the Macro Name text box. The
    Select File dialog box will open with the WordPerfect default macro directory
    open (Figure 7).


    +   3. Use the Directory List box to move to the directory where the macro is
    stored, then use the File List box to select the macro.


    +   4. Click OK. The Select File dialog box will close, returning you to the Play
    Macro dialog box. The full path of the macro file you selected will be entered
    in the text box.


    +   5. Click Play. The Play Macro dialog box will close and the macro will execute
    its recorded keystrokes and commands.


    # Tips


    +   If you are using a macro that will make changes to a selected word, line,
    or paragraph, make sure you use the mouse to select the text before playing the
    macro.


    +   If you play a macro and don''t get the results you expected, you can undo
    the macro''s actions by clicking the Undo button on the WordPerfect 8 Toolbar
    or selecting Undo from the Edit menu.


    +   The WordPerfect Personal Edition ships with 17 macros, ready for you to use.
    You will find them in the /wp/wp macros directory. To find out what each of these
    macros does, open the online Macro manual by choosing Macros from the Help menu,
    and then click the Shipping Macros link on the help page that opens.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_217_0.png)


    Figure 5. Choose Play from the Macro fly-out on the Tools menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_217_1.png)


    Figure 6. Click the list button in the Play Macro dialog box to locate the macro
    in the directory where it is stored.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_217_2.png)


    Figure 7. Use the Directory List and File List boxes to locate and select the
    macro you want to play.'
  merge: -1
  img_proc: true
- pgno: 218
  md: "# Making Your Macros\nEasy to Play\n\nThere are two places you can put a macro\
    \ to make it easy to find and play. You can add a macro to a toolbar or assign\
    \ a keyboard shortcut. This means that every time you want to play the macro,\
    \ all you have to do is click a toolbar button or press the appropriate keys on\
    \ the keyboard.\n\nTo add a macro to a toolbar, you will first need to display\
    \ the toolbar you want to add the macro button to, then edit that toolbar.\n\n\
    # To display a toolbar:\n\n+   1. Choose Toolbars from the View menu (Figure 8).\
    \ The Toolbars dialog box will open (Figure 9).\n+   \n+   2. From the Available\
    \ toolbars list box, select the toolbar you want to view.\n+   \n+   3. Click\
    \ OK. The toolbar will appear at the top of the document window.\n\n*or*\n\nRight\
    \ click on a toolbar and choose the toolbar you want to open from the QuickMenu\
    \ that appears (Figure 10). The toolbar will appear at the top of the document\
    \ window.\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_218_0.png)\n\n**Figure 8.**\
    \ Choose Toolbars from the View menu.\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_218_1.png)\n\
    \n**Figure 9.** From the Available toolbars list box, select the check box next\
    \ to the toolbar you want to view.\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_218_2.png)\n\
    \n**Figure 10.** Right click on a toolbar and, from the QuickMenu, choose the\
    \ one you want to view."
  merge: -1
  img_proc: true
- pgno: 219
  md: '# To add a macro button to a toolbar:


    +   1. Right click on the toolbar to which you want to add a macro button.

    +   2. Choose Edit from the QuickMenu (Figure 11). The Toolbar Editor dialog box
    for that toolbar will open with the Activate a Feature option button selected
    (Figure 12).

    +   3. Select the radio button next to Play a Macro. The dialog box will change
    to show an Add Macro button (Figure 13).

    +   4. Click Add Macro. The Select Macro dialog box will appear (Figure 14).

    +   5. Click the list button next to the Macro Name text box. The Select File
    dialog box will open with the WordPerfect default macro directory open (Figure
    7).

    +   6. Use the Directory List box to move to the directory where the macro is
    stored, then use the File List box to select the macro.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_219_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_219_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_219_2.png)


    Figure 11. Right click on the toolbar that you want to add the button to, then
    choose Edit from the QuickMenu.


    Figure 13. When you click the Play a Macro radio button, an Add Macro button appears
    in the dialog box.


    Figure 12. The Toolbar Editor dialog box opens with the Activate a Feature radio
    button selected.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '![](img/02dde5e0b11c4f9add393f2d6c89d9a5_220_0.png)


    Figure 14. Click the list button next to the Macro Name text box to select the
    macro that you want to assign to the toolbar.


    7. Click OK. The Select File dialog box will close, returning you to the Select
    Macro dialog box. The full path of the macro file you selected will be entered
    in the text box.


    8. Click Select. A Toolbar dialog box will open, asking whether you want to save
    the macro with its full pathname (Figure 15).


    9. Click Yes. The Toolbar and Select Macro dialog boxes will close, returning
    you to the Toolbar Editor dialog box. A button with a cassette tape icon on it
    will appear on the toolbar (Figure 16).


    10. Click OK to close the Toolbar Editor dialog box and return to the document
    window. Your custom macro button is ready to go!


    # Tips


    +   In step 5, if you select a macro that is saved in the WordPerfect default
    directory (/wp/wp macros), the Toolbar dialog box (Figure 15) will not appear.


    +   You can also use the Toolbar Editor to add buttons for virtually every WordPerfect
    command to any toolbar that you want to customize. This can be a big help if you
    use a particular command many times.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_220_1.png)


    Figure 15. Click Yes to save the macro with its full path. This is necessary if
    the macro is located in a directory other than the WordPerfect default directory,
    /wp/wp macros.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_220_2.png)


    Figure 16. The new macro button appears on the toolbar, ready for you to click.
    Try it out! Position the insertion point, if you need to, then click the macro
    button and watch the macro play!'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# To assign a macro to a keyboard shortcut:


    +   1. Choose Preferences in the program window (Figure 17). The Preferences dialog
    box will open (Figure 18).

    +   2. Click Keyboard. The Keyboard Preferences dialog box will open (Figure 19).
    The keyboard you are using will be selected in the Keyboards list box.

    +   3. Click Create. The Create Keyboard dialog box will appear (Figure 20).

    +   4. Type a name for your custom keyboard into the New Keyboard Name dialog
    box. You could use your name, for instance, or a name that describes the personalized
    nature of the keyboard.

    +   5. Click OK. The Create Keyboard dialog box will close and the Keyboard Editor
    dialog box will open (Figure 21).

    +   6. In the Choose a Key to Assign or Unassign area, use the drop-down list
    to select a keystroke combination that will play the macro. This list box is divided
    into two columns (Figure 22). The left column shows the keystroke and the right
    column shows what is assigned to that keystroke. If there is nothing in the column
    to the right of a keystroke, that keystroke is unassigned. Make sure you select
    an unassigned keystroke. For this example, F12+Ctrl has been selected because
    it is an unassigned keystroke.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_221_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_221_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_221_2.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_221_3.png)'
  merge: -1
  img_proc: true
