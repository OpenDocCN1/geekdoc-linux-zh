- pgno: 99
  md: '# Paragraph Formatting


    Paragraph formatting (as the words imply) is applied to entire paragraphs of text.
    WordPerfect lets you change virtually every paragraph attribute you can think
    of, from justification, tabs, and indents to line and interparagraph spacing.


    # To set paragraph justification:


    +   1. Position the insertion point where you want the justification to begin.
    (This will effect the paragraph the insertion point is in and any subsequent paragraphs.)

    +      or

    +      Select the paragraph(s) you want to justify.


    +   2. Click the justification button on the Property Bar to choose a justification
    from the drop-down list (Figure 40).

    +      or

    +      Choose a justification type from the Justification fly-out found on the
    Format menu (Figure 41).


    Figure 40. Choose a justification from the drop-down list on the Property Bar.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_99_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_99_1.png)


    Figure 41. Choose a justification type from the justification fly-out on the Format
    menu.


    # What Kind of Justification Do You Want?


    There are five ways you can justify a paragraph in WordPerfect 8. Below is a sample
    of each type.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_99_2.png)'
