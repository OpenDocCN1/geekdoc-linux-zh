    # Key to the WordPerfect 8 Screen


    1A–B Title Bar

    Displays the program name and current document name.


    2 Menu Bar

    Click any menu title to access commands fly-outs, and dialog boxes, as well as
    the various toolbars, views, and Ruler Bar.


    3 WordPerfect 8 Toolbar

    One of the sixteen toolbars, the WordPerfect 8 Toolbar buttons and drop-down lists
    give you quick access to standard word processing commands such as New, Open,
    Save, Print, Cut, Copy, Paste, Undo, and Redo. It also includes several WordPerfect
    8 commands such as Create Columns and Create Table.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 4 Property Bar


    The Property Bar is a context sensitive toolbar. Buttons and drop-down lists change
    dynamically, depending upon what is selected. This gives you easy access to the
    most important commands associated with the selected tool or item.


    # 5A–D Ruler Bar


    The Ruler Bar displays current tab and left/right margin settings, indents, and
    column boundaries. It can be used to set all these things. You can quickly access
    commands associated with the Ruler Bar by right clicking on the Ruler Bar and
    using the QuickMenu that appears.


    # 6 Insertion Point


    This blinking vertical bar shows you where you are in a document. You can use
    it to position text, graphics, or tables.


    # 7 Shadow Cursor


    One of the wonderful features of WordPerfect, the shadow cursor lets you position
    text, graphics, tables, or charts anywhere in a document, even in white space.
    There''s no need to insert blank lines manually by pressing the Enter key on the
    keyboard to move to where you want to position an item.


    # 8 Margin Guidelines


    These non-printing horizontal and vertical gray lines display the top, bottom,
    left, and right margin boundaries. Guidelines are also displayed when tables and
    columns are used.


    # 9 Program Window


    This smaller window appears when WordPerfect is launched. Any changes made using
    the program window effect all documents.


    # 10 Document Window


    This is the place where most of the action happens. The document you create appears
    in the document window. All text, graphics, tables, charts, etc. are displayed
    here. Any changes you make in the document window effect only the document currently
    open and active. You can open as many as 100 document windows at one time.


    # 11A–B Application Bar


    This tiny horizontal panel at the bottom of the document window displays important
    information about a document, including the current page and position, date, time,
    and currently selected text alignment. It can also be used to quickly insert the
    date and time into a document.


    # 12A–B Scroll Bars


    The horizontal and vertical bars that appear at the bottom and right side of the
    document window as needed. (Since the width of the entire page is shown in Figure
    1, no horizontal scroll bar is needed; therefore, it''s not present.) Scroll bars
    are used to move through a document by either clicking the scroll arrows or dragging
    the scroll box.


    # Terms Used in This Book


    +   - Click means to quickly press and release the left mouse button.

    +   - Double-click means to quickly press and release the left mouse button twice.


    +   - Right click means to quickly press and release the right mouse button.

    +   - Choose means to use the mouse pointer to highlight a menu item and click.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# WordPerfect 8 Controls


    Figures 2a–g show the controls you will use when working with WordPerfect 8 dialog
    boxes.


    Figure 2a. Text boxes and spin buttons. You can enter text or numbers in text
    boxes. Spin buttons are used to increase or decrease a number. To increase a number,
    click the up arrow. To decrease a number, click the down arrow.


    Figure 2b. Push buttons. Push buttons usually start a user specified action and/or
    close dialog boxes, cancel an action, or answer no to an action to keep it from
    starting. A selected push button has a black border around it. A push button with
    text that is followed by an ellipsis (...) will open another dialog box when clicked.


    Figure 2c. Drop-down lists. Drop-down lists present a selection of items from
    which to choose. To open the list, click the list box button or the little arrow
    to the right of the list box. Some drop-down lists allow you to enter text.


    Figure 2d. List buttons. List buttons appear in dialog boxes with two possible
    looks: the first is a tiny folder on the button, the second is a left pointing
    triangle. When a list button is clicked, a file manager dialog box opens to let
    you select a file or move to another directory.


    Figure 2e. Check boxes. Click a check box to turn an option on or off. Depending
    upon your WordPerfect settings, a check may or may not appear in the box when
    it is selected (if there is no check mark, the entire box will be a darker gray).
    The default WordPerfect setting is for no check mark to appear, so that''s the
    way it''s shown throughout this book. In the example shown here, Blinking Cursor
    and Graphics are selected.


    Figure 2f. Radio buttons. Radio buttons are usually contained in an area, and
    you can select only one item from two or more options. Click the diamond to select
    an option. The diamond that is darker gray (Document, in this example) is selected.
    Some folks call these option buttons.


    Figure 2g. Preview areas. Some dialog boxes include a preview area that lets you
    see how changes look before you click OK and apply them to a document. As you
    add and delete characters or options, these items appear or disappear from the
    preview.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Menus


    There are 8 menus available on the Menu Bar. These menus give access to commands,
    fly-outs (submenus that open off of main menus), and dialog boxes.


    # To open a menu and select an item:


    +   1. Position the mouse pointer over a menu title and click. The menu will open
    (Figure 3). If you see a tiny arrow to the right of a menu item, it means that
    there is an available fly-out. To open the fly-out, click the tiny arrow (Figure
    4).

    +   2. Move the mouse down to highlight the item you want to select.

    +   3. Click to select the item.


    # Tip


    +   - A menu item with an ellipsis (...) after it means that this item will open
    a dialog box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_18_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_18_1.png)


    This arrow indicates a fly-out.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_18_2.png)


    Figure 4. Click the tiny arrow to open the fly-out. As you can see in this figure,
    some fly-outs also have fly-outs. For instance, there is a tiny arrow to the right
    of the Page Numbering fly-out menu item.


    # Keyboard Shortcuts


    Many menu commands have keyboard equivalents. Keyboard shortcuts (also called
    hot keys) always use the Ctrl, Shift, or Alt keys (or a combination of them) plus
    a letter or number key. Many times the letter is a mnemonic. For instance, the
    Copy command uses the letter C.


    As an example, the keyboard shortcut for the Copy command is Ctrl+C.


    For details on how to create custom keyboard shortcuts, turn to pages 210–212.'
