- pgno: 89
  md: '# Center and Flush Right


    WordPerfect also lets you quickly center a single line of text, or align it to
    the right margin with a command called flush right.


    # To center a line of text:


    +   1. Position the insertion point where you want to center the line of text.

    +   2. Choose Center from the Line fly-out on the Format menu (Figure 12) or press
    Shift+F7 on the keyboard.

    +   3. Type the centered line of text, then press Enter on the keyboard (Figure
    13).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_89_0.png)


    # To move text flush right:


    +   1. Position the insertion point where you want to add the flush right text.

    +   2. Choose Flush Right from the Line fly-out on the Format menu or press Shift+Ctrl+F7
    on the keyboard.

    +   3. Type the line of flush right text, then press Enter on the keyboard (Figure
    13).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_89_1.png)


    # To move text flush right with dot leaders:


    +   1. Position the insertion point where you want to add the flush right text.

    +   2. Choose Flush Right with Dot Leaders from the Line fly-out on the Format
    menu (Figure 14). A horizontal line of dots (the dot leader) will appear in the
    document window next to the insertion point.

    +   3. Type the line of flush right text next to the dot leader, then press Enter
    on the keyboard (Figure 13).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_89_2.png)'
  merge: -1
  img_proc: true
- pgno: 90
  md: '![](img/02dde5e0b11c4f9add393f2d6c89d9a5_90_0.png)


    Figure 15. To change the capitalization of selected text, choose one of the options—lowercase,
    UPPERCASE, or Initial Capitals—on the Convert Case fly-out on the Edit menu.


    # Capitalization and Your Text


    hAVE yOU eVER pRESSED THE cAPS lOCK KEY BY mISTAKE? I have! WordPerfect makes
    it very easy to correct such a situation. There''s no need to retype the text.


    # To change text capitalization:


    +   1. Select the text you want to change.

    +   2. Choose Convert Case from the Edit menu to open the fly-out (Figure 15).

    +   3. Choose the capitalization you would like from the fly-out, lowercase, uppercase,
    or initial capitals, where the first letter of each word is capitalized. The selected
    text will change to the capitalization you selected.


    # A WordPerfect Font Primer


    Fonts come in several types and work in different ways in WordPerfect:


    +   - **Printer fonts** are built-in to your printer. Every printer has the capability
    to print at least one font.

    +   - **Type 1 fonts**, also called soft fonts, are sold like software on disks
    or are downloadable from the Web. Over 130 Type 1 fonts ship on the WordPerfect
    8 Personal Edition CD-ROM.

    +   - **Font cartridges** let you add printer fonts by inserting a font cartridge
    directly into a printer.

    +   - **Print wheels** are used with daisy wheel printers. You can purchase print
    wheels to add to your font collection, changing them as you need to change fonts
    while printing. Type 1 fonts do not work with daisy wheel printers.


    Fonts can be either scalable or non-scalable. Scalable fonts can be printed in
    almost any point size. Type 1 fonts are scalable. Non-scalable fonts use only
    a fixed set of point sizes. Printer fonts and cartridge fonts are non-scalable.


    You can tell whether a font is a printer or Type 1 font by checking the little
    icon that appears next to a font name in the Font Face list box in the Font dialog
    box (Figure 2). A P or printer icon will be displayed next to a printer font,
    and a T or T₁ will be displayed next to a Type 1 font.


    To install the Type 1 fonts that come with the Personal Edition, you will have
    to launch WordPerfect as an administrator. For detailed instructions on installing
    these Type 1 fonts, turn to page 84.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Choosing a New Font and Font Size


    There are several ways you can add or change fonts and font sizes in a document.
    You can select a new font and/or size, then type text, select text that you want
    to change to another font and/or size, or insert a font code in existing text,
    changing the typeface and/or size from that spot on until the end of the document
    (or until another font code is encountered).


    Font sizes are set in points, an old system that predates computers and even typewriters.
    Just to give you an idea of relative sizes, 72 point type is 1" high (2.5 cm)
    and 18 point type is ¼" high (6 mm).


    # To change fonts:


    +   1. Select the text you want to change.

    +      or

    +      Position the insertion point where you want to change the font.

    +   2. Use the Font drop-down list on the Property Bar to select a new font (Figure
    16).

    +      or

    +      A. Choose Font from the Format menu (Figure 1) or press F9 on the keyboard.
    The Font dialog box will open (Figure 2).

    +      B. Use the Font Face list box to select a new font (Figure 17). You can
    see the font you’ve selected in the preview pane near the bottom left of the dialog
    box.

    +      C. Click OK.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_91_0.png)


    Figure 16. The Font drop-down list lets you choose a new font and shows a preview
    of the selected font.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_91_1.png)


    Preview pane


    Figure 17. Use the Font Face list box to select a new font. The font you choose
    is displayed in the preview pane.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# To change font size:


    +   1. Select the text you want to change or position the insertion point where
    you want to change the font.

    +   2. Use the Font Size drop-down list on the Property Bar to select a new font
    size (Figure 18).

    +   or

    +   A. Choose Font from the Format menu (Figure 1) or press F9 on the keyboard.
    The Font dialog box will open (Figure 2).

    +   B. Use the Font Size list box to select a new font size (Figure 19). You can
    see the size you’ve selected in the preview pane near the bottom left of the dialog
    box.

    +   C. Click OK to close the dialog box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_92_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_92_1.png)


    # Setting Relative Font Sizes


    Instead of setting absolute font sizes in points, you can also change font size
    by setting sizes relatively smaller or larger than the currently selected font
    size. For instance, a setting of Extra Large is 200% bigger than the current font
    size and a setting of Fine is 60% smaller than the current font size.


    # To set a relative font size:


    +   1. Select the text you want to make smaller or bigger or position the insertion
    point where you want to change the font.

    +   2. Choose Font from the Format menu (Figure 1) or press F9 on the keyboard.
    The Font dialog box will open (Figure 2).

    +   3. Use the Relative Size drop-down list to select a new size (Figure 20).

    +   4. Click OK to close the dialog box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_92_2.png)'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Setting a New Default Font


    Every document you create has a document default font. This is the font that WordPerfect
    uses for every document, unless you select another font. WordPerfect uses this
    font for the text in the body of the document as well as the text found in headers
    and footers. (For details on headers and footers, turn to Chapter 8, Page and
    Document Setup.)


    # To set a new default font for the current document:


    +   1. With a document open, choose Font from the Format menu (Figure 21) or press
    F9 on the keyboard. The Font dialog box will open (Figure 22).

    +   2. Click Initial Font. The Document Default Font dialog box will open (Figure
    23).

    +   3. Use the Font Face list box to select a font.

    +   4. Use the Font Size list box to select a size.

    +   5. When you have finished selecting the new default font, click OK to return
    to the Font dialog box.

    +   6. Click OK to return to the document.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_93_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_93_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_93_2.png)'
  merge: -1
  img_proc: true
