- pgno: 214
  md: '# MACROS

    MADE EASY


    Macros are mini-programs that perform keystrokes and commands automatically. They
    can save a lot of time and mouse clicking if a task needs to be performed over
    and over. For instance, suppose you want to end your business letters with the
    closing "Sincerely," then your name a few spaces point that. You could create
    a macro that would move the insertion point to the bottom of the document, automatically
    insert "Sincerely" and then move down the allotted space and insert your name.


    WordPerfect macros do not use a specialized macro editor. To edit a macro, you
    simply need to open it in WordPerfect, just as you would any other document.


    There are two ways to record macros. You can:


    +   - Create the macro by performing the actions that you want the macro to execute.
    Think of it as a cassette recorder being used to record keystrokes and commands
    instead of sounds. WordPerfect records the commands for you.

    +   - Type in the actual commands themselves. For this, you will need a knowledge
    of the WordPerfect macro language and its syntax.


    This chapter deals with the first of these recording methods. The second is well
    beyond the scope of this book. If you are interested in learning about macro commands
    and syntax, take a look at the online Macro manual that comes with the Personal
    Edition. To access it, choose Macros from the Help menu.


    There are 17 macros that ship with the WordPerfect Personal Edition. Their functionality
    ranges from capitalizing the first letter in a selected word to using graphics
    to create decorative borders.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Recording Macros


    Recording macros is very simple. All you need to do is turn on the macro recorder
    (much like pressing the record button on a tape player or VCR) and perform the
    keystrokes you want repeated. You might want to practice the keystrokes first
    for your little "performance." If you make a mistake, don''t worry, you can just
    start recording the macro from the beginning again.


    As you type the commands and keystrokes, WordPerfect automatically records what
    you type. You should know, however, that while the macro recorder is recording,
    you won''t be able to use the mouse to position the insertion point in the document.
    If you want to move the insertion point, you will have to use the keyboard. Some
    of the most frequently used keystrokes are listed on page 57.


    # To record a macro:


    +   1. Choose Record from the Macro fly-out on the Tools menu (Figure 1) or press
    Ctrl+F10 on the keyboard. The Record Macro dialog box will open (Figure 2).


    +   2. Click the list button next to the Macro Name text box. The Select File
    dialog box will appear (Figure 3).


    +   3. Use the Select File dialog box to move to the directory where you want
    to save the macro.


    +   4. Type the name of your macro with a .wcm file extension in the Filename/Current
    Selection dialog box. Make sure to type the .wcm extension. This tells WordPerfect
    that the file is a macro. (The directory where the macros that ship with WordPerfect
    are stored is /wp/wp macros. You might want to put the macro there or create your
    own macro directory.)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_215_0.png)


    Figure 1. Choose Record from the Macro fly-out on the Tools menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_215_1.png)


    Figure 2. Click the list button in the Record Macro dialog box to set the location
    where the macro will be saved and what it will be named.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '![](img/02dde5e0b11c4f9add393f2d6c89d9a5_216_0.png)


    Figure 3. Use the Select File dialog box to set where the macro is stored. Enter
    the name of your new macro in the Filename/Current Selection text box, then click
    OK to return to the Record Macro dialog box.


    5. Click OK. The Select File dialog box will close, returning you to the Record
    Macro dialog box. The text box will be filled with the full path of the macro
    you are about to record (Figure 4).


    6. Click Record. The Record Macro dialog box will close, returning you to the
    document window, and the macro recorder will be turned on.


    7. Enter the keystrokes and commands that you want executed by the macro.


    8. When you are finished recording your macro, turn the macro recorder off by
    choosing Record from the Macro fly-out on the Tools menu (Figure 1).


    # Tips


    +   It does seem confusing to use a Select File dialog box to set the name and
    location of a macro that hasn’t been recorded yet. But, don’t let the dialog box
    title throw you, it still works the way it should.


    +   Make sure a filename is entered in the text box in the Record Macro dialog
    box before you click Record. Otherwise, WordPerfect will create a temporary macro
    that will be deleted when you exit WordPerfect.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_216_1.png)


    Figure 4. When the location of the macro to be recorded and its name are set in
    the Macro Name text box, click Record.'
