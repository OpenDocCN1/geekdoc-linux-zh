- pgno: 175
  md: '5. In the QuickCorrect Format-As-You-Go Options area (Figure 11), select the
    check boxes next to the options to use:


    +   - QuickBullets—automatically adds bullets or numbers to lists as you type.
    To start a bulleted list, type a lowercase o, then press the Tab key. To start
    a numbered list, type a number followed by a period, then press the Tab key. To
    end the list, press Enter after the last list item, then press the Backspace key.


    +   - QuickIndent—adds an indent to a paragraph if the tab key is pressed at the
    beginning of any line except the first one in a paragraph.


    +   - QuickLines—inserts a single or double horizontal line from the left to right
    margins by typing four hyphens (-) or equal signs (=) at the beginning of a line,
    and then pressing Enter.


    +   - QuickOrdinals—automatically converts an ordinal number to superscript. For
    example 2nd, becomes 2nd.


    +   - QuickSymbols—replaces 2 hyphens (--) with an en-dash (–) and 3 hyphens (---)
    with an em-dash (—).


    6. When you have finished selecting Format-As-You-Go options, click OK. The QuickCorrect
    dialog box will close. The next time type a Format-As-You-Go item, such as an
    ordinal number, WordPerfect will automatically format it for you.


    # To turn Format-As-You-Go off:


    Open the QuickCorrect dialog box, select the Format-As-You-Go radio button, then
    deselect all check boxes in the dialog box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_175_0.png)


