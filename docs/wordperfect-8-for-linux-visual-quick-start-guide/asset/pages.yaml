- pgno: 211
  md: "# Sorting Things Out\n\nThe Sort command is used to arrange text in a document\
    \ alphabetically or numerically. Sorts are performed on five types of document\
    \ elements: lines, paragraphs, merge data files, parallel columns, and table rows.\
    \ An example of a simple sort is alphabetizing a list of name and phone numbers.\n\
    \n# To sort a document:\n\n+   1. Open the document you want to sort (Figure 39).\
    \ (Or if the document is already open, make sure it has been saved.)\n\n+   2.\
    \ To sort an entire document, press Ctrl+Home on the keyboard to position the\
    \ insertion point at the top of the document.\n+   \n+   or\n+   \n+   To sort\
    \ part of a document, select that portion.\n+   \n+   or\n+   \n+   To sort a\
    \ table or parallel column, position the insertion point within the table or parallel\
    \ column.\n\n+   3. Choose Sort from the Tools menu (Figure 40) or press Shift+Ctrl+F9\
    \ on the keyboard. The Sort dialog box will open (Figure 41).\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_211_0.png)\n\
    \n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_211_1.png)\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_211_2.png)"
