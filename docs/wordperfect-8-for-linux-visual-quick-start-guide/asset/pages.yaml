- pgno: 196
  md: '# Two “Quick” Calculations


    WordPerfect includes two features that help you quickly add numbers in a row or
    column, or create a numerical series.


    The QuickFill feature will continue a pattern of increasing values down a column
    or across a row for you. For instance, if two cells in a column contain the numbers
    1 and 3, QuickFill will continue the pattern with 5, 7, 9, etc., filling the remaining
    selected cells.


    The QuickSum feature lets you add up a column of numbers in a table.


    # To use QuickFill:


    +   1. Select the row or column that contains the number pattern you want to increase
    in specified increments (Figure 51).


    +   2. Click the Table menu on the Property Bar and choose QuickFill (Figure 52).
    The pattern will appear in the remaining cells (Figure 53).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_196_0.png)


    Figure 51. Select the row or column that contains the numbers you wish to turn
    into a series.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_196_1.png)


    Figure 52. Choose QuickFill from the Table menu found on the Property Bar.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_196_2.png)


    Figure 53. WordPerfect automatically completes the selected row or column, using
    the incremental number pattern.


    # Tables and Formulas


    WordPerfect 8 for Linux comes equipped with very powerful spreadsheet capabilities.
    Unfortunately, there''s not enough room in this book to get into the many functions
    and formulas that you can use in a table. In fact, there''s so much available
    that it could become a book in itself!


    If you want to learn more about formulas and how they work in tables, take a look
    at the WordPerfect 8 User''s Guide that comes with the Personal Edition. Pages
    555–569 and 660–686 will give you a pretty good idea of what is available and
    get you started.'
  merge: -1
  img_proc: true
