  md: '# STARTUP


    When WordPerfect is launched, a small rectangular window, called the program window,
    appears on the screen (Figure 1). Any changes you make using the program window,
    effect all documents created in WordPerfect.


    The document window is the area on the screen where documents are created (Figure
    1). Any changes you make using the document window effect only the current document
    you are working on. The part of the document window where you actually work with
    the text of the document is called the workspace.


    You can have as many as 100 document windows open at one time (depending upon
    how much memory your computer has). When more than one document window is displayed,
    the window whose title bar is highlighted is active. If you type or change anything
    in the document window, it''s the active document that changes. The first time
    you launch WordPerfect, a new document window appears, ready for typing.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_44_0.png)'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Menu Items and Desktop Shortcuts


    Launching WordPerfect is quick and easy once you add an item to the Gnome or K
    Main Menu or add a shortcut on the Desktop.


    # To put a menu item on the Gnome Main Menu:


    +   1. Choose Menu editor from the Settings fly-out on the Gnome Main Menu (Figure
    2). The GNOME menu editor dialog box will open with User Menus selected in the
    tree view window (Figure 3).


    +   2. On the Menu Bar, click New Item to add a new menu item under User Menus.


    +   3. On the Basic tab page, type WordPerfect in the Name text box (Figure 4).


    +   4. Type the full pathname of the location where WordPerfect is installed plus
    the command to launch WordPerfect in the Command text box. In Figure 4, /usr/wp/wpbin/
    ./wp has been typed.


    +   5. Click the Icon button to choose an appropriate icon.


    +   6. Click Save.


    +   7. Close the GNOME menu editor dialog box by clicking the Close button. The
    WordPerfect menu item will appear on the Gnome Main Menu (Figure 5).


    # Tip


    If you are logged on as root, you can add the WordPerfect menu item to the Systems
    menu on the Gnome Main Menu. (You could add it under Applications.) Once an icon
    is added to the System menu, it is available to all users; whereas, an item added
    to the User menu is only available for that user.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_45_0.png)


    Figure 2. Choose Menu editor from the Settings fly-out on the Gnome Main Menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_45_1.png)


    Figure 3. The GNOME menu editor dialog box opens with User Menu selected in the
    tree view window.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_45_2.png)


    Figure 4. Use the Basic tab page to enter the program name, command line information,
    and select an icon.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_45_3.png)


    Figure 5. The WordPerfect menu item appears as a user menu on the Gnome Main Menu.'
  merge: -1
  img_proc: true
