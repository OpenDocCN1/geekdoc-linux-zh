- pgno: 205
  md: '# Performing the Merge


    Now that you have created both the data file and the form file, it''s time to
    perform the merge and create a third file that contains all the personalized copies
    of the form file.


    # To perform the merge:


    +   1. Choose Merge from the Tools menu (Figure 1). The Merge dialog box will
    open (Figure 2).

    +   2. In the Perform Merge area (Figure 18), click Merge. The Perform Merge dialog
    box will appear (Figure 19).

    +   3. To select the form file:

    +      A. Click the list button next to the Form File text box and choose Select
    File from the drop-down list (Figure 20). The Select Form File dialog box will
    appear (Figure 21).

    +      B. Use the Directory List and File List boxes to select the form file that
    you created.

    +      C. Click OK. The Select Form File dialog box will close, returning you
    to the Perform Merge dialog box.


    Figure 18. Click Merge in the Perform Merge area of the Merge dialog box.


    Figure 19. The Perform Merge dialog box is used to set the form and data files
    that will be merged and where the resulting document will go.


    Figure 20. Click the list button, then choose either Select File or <Current Document>
    from the drop-down list.


    Figure 21. In the Select Form File dialog box, select the form file you want to
    use for the merge.


    Figure 22. Click the list button, then choose Select File from the drop-down list.'
