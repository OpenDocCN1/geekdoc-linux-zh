- pgno: 203
  md: '# Creating the Form File


    The next step in performing a merge is to create the document that the data file
    will be merged into. The fields that you created when you made the data file will
    be inserted into the document you want personalized, such as a form letter, contract,
    or mailing label. Each field is inserted into the appropriate position in the
    form file as a field code.


    # To create the form file:


    +   1. Start a new document.

    +   2. Choose Merge from the Tools menu (Figure 1). The Merge dialog box will
    appear (Figure 2).

    +   3. In the Form File area, click Form (Figure 12). The Create Form File dialog
    box will open (Figure 13).

    +   4. Make sure the radio button next to Associate a Data File is selected, then
    click the list button next to the text box. The Select Data File dialog box will
    open (Figure 14).

    +   5. Use the Directory List box to move to the location where the data file
    is stored, then use the File List box to select the file.

    +   6. Click OK. The Select Data File dialog box will close and you will return
    to the Create Form File dialog box. The full path of the data file will be in
    the text box (Figure 13).

    +   7. Click OK. The Create Form File dialog box will close and the Merge Toolbar
    will appear below the Property Bar in the document window. Now, it’s time to create
    the document that the data file will be merged into.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_203_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_203_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_203_2.png)'
  merge: -1
  img_proc: true
- pgno: 204
  md: '8. Start typing your form file, for instance a form letter or contract.


    9. When you come to a place where you want to insert a field code—for instance,
    a person''s first name after the greeting in a letter—click Insert Field on the
    Merge Toolbar. The Insert Field Name or Number dialog box will appear (Figure
    15).


    10. In the Field Name list box, select the field that you want to insert.


    11. Click Insert. The field code will be inserted into your document (Figure 16).
    The Insert Field Name or Number dialog box will remain open, ready for you to
    insert another field code.


    12. Continue typing your document and inserting field codes as described in steps
    9–11 above until the document is finished.


    13. When you have finished inserting field codes, click the Close button to close
    the Insert Field Name or Number dialog box.


    14. Save the form file. (For details on how to save a file, turn to page 43.)
    Your form file is now ready to be merged with the data file (Figure 17).


    # Tips


    +   - When inserting field codes into the form file document using the Insert
    Field Name or Number dialog box, be a little careful about which window is active.
    Otherwise, you may end up inserting a few extra field codes that you did not intend
    to. If this happens, just select the errant field code and press Delete on the
    keyboard.


    +   - To insert a date field in your document (this will automatically insert
    today''s date when you use the document) click the Date button on the Merge Toolbar.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_204_0.png)


    Figure 15. Select the field that you want to insert in the form file document,
    then click Insert.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_204_1.png)


    Figure 16. Insert the field codes into the document where you would like the personalized
    information. For instance, in this figure the field code for First Name has been
    inserted after the letter''s salutation.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_204_2.png)


    Figure 17. Continue inserting field codes and typing the document until it''s
    completed.'
