    the background for a page.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_139_2.png)


    Figure 34. Click the Fill Style button and select a fill from the drop-down list.
    The fill you select appears on the Fill Style button.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_139_3.png)


    Figure 33. Click the Border Style button and select a border from the drop-down
    list. The border you select appears on the Border Style button.'
