- pgno: 161
  md: '# To quickly move between headers and footers:


    Position the insertion point in a header or footer, then click the Previous Header/Footer
    button.


    or


    The Next Header/Footer button on the Property Bar.


    # To edit a header or footer:


    +   1. Click anywhere inside the header or footer you want to edit.

    +   2. Edit the header or footer text as you would normally edit text (Figure
    27).

    +   3. Click the Close Header/Footer button on the Property Bar or click in the
    document window outside of the header or footer area. The insertion point will
    return to the main body of the document.


    # To turn off a header or footer:


    +   1. Position the insertion point on the page where you want to turn off the
    header or footer (Don''t place the insertion point in the header or footer)

    +   2. Open the Headers/Footers dialog box (Figure 28) by choosing Header/Footer
    from the Insert menu (Figure 21).

    +   3. Use the Select area to choose which header or footer to turn off.

    +   4. Click Discontinue.

    +   5. Click OK. The dialog box will close and the header or footer will no longer
    appear on any page beyond the current one.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_161_0.png)


