  md: '# Converting Text into a Table


    WordPerfect makes it easy to convert text that has been set in columns using tabs
    or parallel columns into a table. (For a discussion about tabs and tab settings,
    turn to pages 93–97; to find out more about parallel columns, turn to page 131.)


    # To convert text into a table:


    +   1. Select the tabbed text or parallel columns you want to convert (Figure
    31).

    +   2. Choose Table from the Insert menu (Figure 4). The Convert Table dialog
    box will appear (Figure 32).

    +   3. Select either the Tabular Column or Parallel Column radio button depending
    upon the type of text you selected.

    +   4. Click OK. The Convert Table dialog box will close and the text will be
    converted into a table (Figure 33).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_190_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_190_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_190_2.png)


    # Changing Column Width


    As you can see in Figure 33, the table in which the text is placed is not necessarily
    well balanced. In Figure 33, the third column is much wider than the other two—a
    little tweaking is in order.


    WordPerfect makes it easy to change a column''s width. All you have to do is drag
    the column''s border to a new position.


    +   1. Position the mouse pointer over a column border until it changes to a double-headed
    arrow.

    +   2. Press the left mouse button and drag the column border to its new position.'
  merge: -1
  img_proc: true
