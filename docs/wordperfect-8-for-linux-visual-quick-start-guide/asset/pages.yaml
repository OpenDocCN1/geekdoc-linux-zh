- pgno: 147
  md: '# To resize a text box to exact measurements:


    +   1. Click on white space to make sure nothing is selected in your document.

    +   2. Right click on the text box you want to size and choose Size from the QuickMenu
    that appears (Figure 59). The Box Size dialog box will open (Figure 60).

    +   3. In the Width and Height areas, you have the following options:


    +   - Set makes the width or height of the text box exactly the measurement you
    type into the text box

    +   - Full stretches the text box the entire width (from left to right margins)
    or height (from top to bottom margins) of the page. If you select Full in both
    the Width and Height areas, the text box will cover the entire page.

    +   - Maintain proportions—when this option is selected in one of the areas and
    an exact measurement is set in the other area, the text box will resize to keep
    its original width-to-height proportions.


    +   4. When you have finished setting the width and height of the text box, click
    OK. The Box Size dialog box will close and the text box will change to its new
    size.


    # To move a text box:


    +   1. Click the text box that you want to change to select it. You’ll know it’s
    selected when dashed lines appear around it.

    +   2. Position the mouse pointer on the border of the text box.

    +   3. Press the left mouse button and drag the text box to its new position (Figure
    61).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_147_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_147_1.png)


