- pgno: 154
  md: '# To create a new paper definition:


    +   1. Choose Page Size from the Page Setup fly-out on the Page fly-out on the
    Format menu (Figure 1). The Paper Size dialog box will open (Figure 2).


    +   2. Click Create. The Create Paper Size dialog box will open (Figure 4).


    +   3. Type a descriptive name for your paper in the Paper Name text box.


    +   4. In the Paper Type area, use the Type drop-down list to select the kind
    of paper you will be using, such as letterhead, envelope, or cardstock (Figure
    5).


    +   5. In the Paper Size area, use the Size drop-down list to select the paper
    dimensions that match what you need (Figure 6). If you don’t see exactly what
    you want, scroll to the bottom of the list and select Other.


    +   6. If you selected Other, use the text boxes below the Size drop-down list
    to enter the exact measurements you need (Figure 7). The left text box sets the
    width and the right text box sets the height of the paper.


    +   7. In the Paper Location area, use the Location drop-down list to select which
    printer paper feed location you want to use (Figure 8).


    +   8. If you want WordPerfect to ask you to load the paper in the printer, make
    sure the box next to Prompt to Load Paper is selected in the Paper Location area.


    +   9. To set where the text prints on your custom page, use the Top and Side
    drop-down lists and text boxes in the Text Adjustments area to set what you need.
    This can be very handy to make sure that text is printed within a specific area
    since all printers have an unprintable zone.


    (continued)


    Figure 5. Select the type of paper you will be using from the Paper Type drop-down
    list.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_154_0.png)


