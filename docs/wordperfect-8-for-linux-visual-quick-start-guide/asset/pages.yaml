  md: '# To add a border and fill to a text box:


    +   1. Click the text box that you want to change to select it. You''ll know it''s
    selected when dashed lines appear around it.

    +   2. Click the Border button on the Property Bar and select a border style from
    the drop-down list (Figure 56).

    +   3. Click the Fill button on the Property Bar and select a fill from the drop-down
