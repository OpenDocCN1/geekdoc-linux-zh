    +   5. Click OK to close the dialog box and return to the Preferences dialog box.

    +   6. Click Close to close the Preferences dialog box and return to the document
    window. Your document will display the symbols you selected (Figure 61).


    # Tip


    If you don''t see the symbols displayed in your document, you need to turn them
    on. Choose Show ¶ from the View menu (Figure 57).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_82_0.png)


    Figure 60. When the Show ¶ radio button is selected, the lower part of the Display
    Preferences dialog box changes to show symbols options.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_82_1.png)


    Figure 61. The symbols selected to display (using the Display Preferences dialog
    box) appear in the document.'
  merge: -1
