- pgno: 27
  md: '# Getting Help


    WordPerfect 8 for Linux comes with a comprehensive online help system that has
    been developed with users'' requests in mind. There are five parts in the help
    system:


    +   - The User''s Guide—this is the paper manual that ships with the Personal
    Edition of WordPerfect 8. You can read it at your leisure, even away from the
    computer.


    +   - Online Help—this opens a window where you can look for your topic using
    a table of contents or search engine (Figure 26).


    +   - PerfectExpert—the PerfectExpert is a tutor that gives you step-by-step instructions
    on how to complete specific tasks (Figure 27).


    +   - QuickTips—these are the balloons that appear when the mouse passes over
    a button or drop-down list on a toolbar (Figure 28).


    +   - Technical Support—folks who purchase the Personal Edition of WordPerfect
    8 for Linux are entitled to 30 days free support from the date of purchase. For
    technical assistance in the U.S., call 1-613-728-6852, and have your license number
    handy.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_27_0.png)


    Figure 26. With Online Help, you can use the Contents to look for a topic or perform
    a search.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_27_1.png)


    Figure 28. When you pass the mouse over a button or menu item, a QuickTip appears,
    telling you what the item does.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_27_2.png)


    Figure 27. The PerfectExpert takes you step-by-step through tasks you need to
    perform to create a document.'
  merge: -1
  img_proc: true
