  md: '![](img/02dde5e0b11c4f9add393f2d6c89d9a5_202_0.png)


    Figure 10. Click Yes to save the data file.


    10. Click Close. The Quick Data Entry dialog box will close and a Merge dialog
    box will appear (Figure 10), asking whether you want to save the data file document
    (you do).


    11. Click Yes. The Save Data File As dialog box will appear.


    12. Use the Directory List box to move to the directory where you want to keep
    the data file, then type the file''s name in the Filename/Current Selection text
    box.


    13. Click OK. The Save Data File As dialog box will close. Congratulations! You''ve
    just created a data file (Figures 11a–b).


    # Tips


    +   - If you don''t name a field, WordPerfect will automatically assign a number
    for you.

    +   - If you need to insert a new record into a data text file, position the insertion
    point in the document where you would like the record to appear, then click Quick
    Entry on the Merge Toolbar. Use the Quick Entry dialog box as described in steps
    7–8 above.

    +   - If you need to insert a new record into a data table file, insert a row
    into the table where you would like the record to appear, then type the information
    in the fields in the table. (For details on how to insert rows into a table, turn
    to pages 175–176, in Chapter 10, Adding Tables.)

    +   - Data table files are inherently easier to look through and use than data
    text files because the table format organizes the data into columns.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_202_1.png)


