- pgno: 35
  md: '12. Click OK. The next panel will open (Figure 12). This panel is used to select
    the type of installation you would like—Full, Medium, or Minimum.


    13. Select the installation type you would like, then click OK. The next panel
    will open (Figure 13). If you have another version of WordPerfect installed on
    your computer, you can set this installation to mimic that previous installation.
    This means that any printer or terminal drivers that you are already using will
    appear as defaults for this new WordPerfect 8 installation.


    # What are the different installation types?


    +   - Minimum Installation includes all the programs and data files needed to
    run WordPerfect; though, it does not include the features listed in the medium
    or full installation. It requires up to 44 MB free hard disk space.


    +   - Medium Installation includes everything installed in the Minimum Installation
    plus GrammAtik and a thesaurus. It requires up to 54 MB free hard disk space.


    +   - Full Installation includes everything installed in the Medium Installation
    plus online help, sample macros and online macro help, WordPerfect Draw and sample
