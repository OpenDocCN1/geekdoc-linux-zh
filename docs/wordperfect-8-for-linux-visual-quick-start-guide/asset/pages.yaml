- pgno: 66
  md: '# Figure 10. Use the Shadow Cursor area to set options.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_66_0.png)


    # Figure 11. Choose a new color from the color palette.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_66_1.png)


    # Figure 12. Choose a different shape using the shape selector.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_66_2.png)


    # Figure 13. Click the radio button next to the item you want the cursor to snap
    to.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_66_3.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_66_4.png)


    # Figure 14. Click the radio button next to the area where you want the cursor
    active.


    +   Margins—the shadow cursor will snap to the left or right margins or to the
    center of the page between the margins. If you click in white space, the insertion
    point will snap to one of these positions.


    +   Tabs—the shadow cursor will snap to the current tab settings. If you click
    in white space, the insertion point will snap to the closest tab. When you enter
    your text, it will continue from that position until the end of the line then
    wrap to the beginning of the next line.


    +   Indent—the shadow cursor will snap to the current tab settings. If you click
    in white space, the insertion point will snap to the closest tab. When you enter
    text, it will continue from that position until the end of the line, then wrap
    to the indented position.


    +   Spaces—the shadow cursor will snap to the closest space. If you click in white
    space, that''s where the insertion point will appear.


    6. To set where you want the shadow cursor active, select an radio button next
    to one of the items in the Active in list (Figure 14). You can set the cursor
    to appear only in text or white space, or set it to appear in both areas.


    7. When you are finished selecting options, click OK to close the Display Preferences
    dialog box.


    8. Click OK to close the Preferences dialog box and return to the document window.'
