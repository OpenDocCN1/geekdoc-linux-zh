- pgno: 156
  md: "# Page Margins and Margin Guidelines\n\nMargins are the white spaces between\
    \ the edges of the page and the text. The width of the margins is shown on the\
    \ page as gray, non-printing guidelines. The WordPerfect margin default is 1\"\
    \ on all sides—top, bottom, left, and right. You can use the Margins dialog box\
    \ to set any of the page margins or the Ruler Bar to set the left and right margins.\n\
    \n# To set all page margins:\n\n+   1. For side margins, select the paragraphs\
    \ you want to change.\n+   \n+   or\n+   \n+   Position the insertion point anywhere\
    \ on the page whose top and/or bottom margins you want to change.\n\n+   2. Choose\
    \ Margins from the Format menu (Figure 12) or press Ctrl+F8 on the keyboard or\
    \ right click on the margin strip on the Ruler Bar and choose Margins from the\
    \ QuickMenu (Figure 13). The Margins dialog box will appear (Figure 14).\n\n+\
    \   3. Type a measurement into the text box(es) next to the margin(s) you want\
    \ to change. The tiny page in the preview area will display the settings you have\
    \ entered.\n\n+   4. Click OK. The Margins dialog box will close and the margins\
    \ in the document will change.\n\n# Tip\n\nIf you want to use the Ruler Bar and\
    \ it's not displayed, choose Ruler from the View menu.\n\nFigure 12. Choose Margins\
    \ from the Format menu.\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_156_0.png)\n\
    \nMargin strip\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_156_1.png)\n\nFigure\
    \ 13. Right click on the margin strip at the top of the Ruler Bar and choose Margins\
    \ from the QuickMenu.\n\nPreview area\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_156_2.png)\n\
    \nFigure 14. Enter a measurement in the appropriate text box in the Margins dialog\
    \ box. The setting you enter is displayed in the preview area."
  merge: -1
  img_proc: true
- pgno: 157
  md: '# To set the left and right margins using the Ruler Bar:


    +   1. Select the paragraphs whose left and/or right margins you want to change.

    +   2. On the margin strip at the top of the Ruler Bar, drag the left or right
    margin marker to a new position (Figure 15). The left or right margin in the document
    will move to the new position.


    # To display or hide margin guidelines:


    +   1. Choose Guidelines from the View menu (Figure 16). The Guidelines dialog
    box will appear (Figure 17).

    +   2. To display margin guidelines, select the check box next to Margins. To
    hide margin guidelines, deselect the check box next to Margins.

    +   3. Click OK. The margin guidelines will display or hide depending upon whether
    you selected the check box or not.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_157_0.png)


    Figure 15. Drag the left or right margin marker to a new position.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_157_1.png)


    Figure 16. Choose Guidelines from the View menu.


    # Displaying Guidelines


    The Guidelines dialog box (Figure 17) can be used to set whether table, margin,
    column, or header/footer guidelines are visible as you work on a document. If
    there are guidelines you always want to view, select them in the Turn Guidelines
    On area, then select the check box next to Use as Default. Every time you use
    WordPerfect, the guidelines you selected will be visible.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_157_2.png)


    Figure 17. Use the Guidelines dialog box to set whether the margin guidelines
    are visible or not.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Vertical Text Alignment


    After setting the top and bottom margins, you can also tell WordPerfect to vertically
    center the text on a page.


    # To center text between the top and bottom margins:


    +   1. Position the insertion point on the page that contains the text you want
    to center.

    +   2. Choose Center from the Page fly-out on the Format menu (Figure 18). The
    Center Page(s) dialog box will appear (Figure 19).

    +   3. In the Center area, you can select a radio button to set WordPerfect to:

    +      - Center the text on the current page

    +      - Center the text on the current page and any pages after the current page

    +      - Not center the text on the page

    +   4. When you have selected an option, click OK. The dialog box will close and
    the text will move to the vertical center of the page (Figure 20).


    # Tip


    To turn vertical text centering off on a page, position the insertion point on
    that page, open the Center Page(s) dialog box, and then select the No Centering
    option in the Center area.


    Figure 18. Choose Center from the Page fly-out on the Format menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_158_0.png)


    Figure 19. Use the Center area to set whether the text is centered on the current
    page, subsequent pages, or not centered.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_158_1.png)


    Figure 20. The text is centered vertically on the page.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_158_2.png)'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Headers and Footers


    Headers and footers are commonly used to place dates, page numbers, titles, or
    a company name at the top or bottom of each page, or on alternating pages, in
    a document.


    WordPerfect lets you use two different headers—Header A and Header B—and two different
    footers—Footer A and Footer B—at any place in a document. Only two headers and
    two footers can be active at one time on a page.


    # To create a header or footer:


    +   1. Position the insertion point in the first paragraph on the page where you
    want the header or footer to first appear.

    +   2. Choose Header/Footer from the Insert menu (Figure 21). The Headers/Footers
    dialog box will open (Figure 22).

    +   3. In the Select area, click the radio button next to the header or footer
    you want to create.

    +   4. Click Create. The dialog box will close and header or footer guidelines
    will appear at the top or bottom of the document (Figure 23). The insertion point
    will be positioned within the header or footer, ready for typing. Special header/footer
    command buttons will appear on the Property Bar (Figure 24).

    +   5. Type your header or footer text as you normally would, using any formatting
    or editing features that you would like.

    +   6. Click the Header/Footer Distance button on the Property Bar. The Distance
    dialog box will open (Figure 25). Use the Distance Between Text and Header (or
    Footer) text box to set the exact distance.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_159_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_159_1.png)'
  merge: -1
  img_proc: true
- pgno: 160
