- pgno: 112
  md: "# Using Image Boxes\n\nEvery image inserted into a WordPerfect document is\
    \ contained in an image box. By default, an image box does not have a border,\
    \ so text can be contoured around the box. However, if you want to add a border,\
    \ you can use image boxes to move and resize the graphic contained in the box\
    \ and you can horizontally or vertically flip an image. When an image box is selected,\
    \ the Property Bar automatically changes to display graphics command buttons (Figure\
    \ 7) and eight black squares, handles, appear around the box.\n\n# Handles\n\n\
    Handles appear in a rectangular formation around an image when it is selected.\
    \ These handles have various functions:\n\n+   - The handles that appear to the\
    \ right center and left center of the image effect the graphic’s *horizontal scale*—they\
    \ make the image narrower or wider (Figure 8).\n+   - The handles that appear\
    \ at the top center and bottom center of an image effect the graphic’s *vertical\
    \ scale*—they make the image shorter or taller (Figure 9).\n+   - The handles\
    \ that appear at the corners effect the graphic’s *proportional scale*. These\
    \ handles let you change the horizontal and vertical size of an object equally\
    \ (Figure 10).\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_112_0.png)\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_112_1.png)\n\
    \n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_112_2.png)\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_112_3.png)\n\
    \n> **I Can’t Access My Menus!**\n> \n> If you’ve been working with images and\
    \ image boxes and you discover that most of the items on your menus are grayed\
    \ out, don’t worry! This just means that an image is still selected. Click in\
    \ white space on the document, then check the menus again. The menu items will\
    \ now be available."
  merge: -1
  img_proc: true
- pgno: 113
  md: '# To move an image:


    Position the mouse pointer over the image, press the left mouse button, and drag
    the graphic to its new position.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_113_0.png)


    Figure 11. Drag either the left or right handle to make an image wider or narrower.


    # To change an image''s width:


    +   1. Select the image. Eight handles will appear around it.

    +   2. Position the mouse pointer over either the left center or right center
    handle (Figure 11).

    +   3. Press the left mouse button and horizontally drag the handle. The handles
    disappear and a dashed rectangle, indicating the image box''s edge, appears as
    you drag. In addition, the mouse pointer will change to a right or left pointing
    arrow next to a small vertical line. If you drag the handle toward the image,
    it will become narrower (Figure 12). If you drag the handle away from the image,
    it will become wider (Figure 13).

    +   4. Release the mouse button when you are happy with the width.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_113_1.png)


    Figure 12. As you drag inward, the handles disappear and a rectangle appears on
    the screen, indicating the edge of the graphic as it gets narrower.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_113_2.png)


    Figure 13. As you drag outward, the handles disappear and a rectangle appears
    on the screen indicating the edge of the graphic as it gets wider.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# To change an image''s height:


    +   1. Select the image. Eight handles will appear around it.

    +   2. Position the mouse pointer over either the top center or bottom center
    handle (Figure 14).

    +   3. Press the left mouse button and vertically drag the handle. A dashed rectangle
    indicating the image box''s edge appears as you drag. In addition, the mouse pointer
    will change to an up or down pointing arrow next to a small horizontal line. If
    you drag the handle toward the image, it will become shorter (Figure 15). If you
    drag the handle away from the image, it will become taller (Figure 16).

    +   4. Release the mouse button when the image is the desired height.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_114_0.png)


    Figure 14. To change an image''s height use either the top center or bottom center
    handle.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_114_1.png)


    Figure 15. As you drag toward the graphic, the handles disappear and a rectangle
    appears on the screen, indicating the edge of the graphic as it gets shorter.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_114_2.png)


    Figure 16. As you drag away from the image, the handles disappear and a rectangle
    appears on the screen, indicating the edge of the graphic as it gets taller.


    # There''s Always a Way Out!


    If you end up in a dialog box you didn''t mean to open, don''t panic! Just click
    the Cancel button in the dialog box or press the Esc key on the keyboard to close
    the dialog box and return to your document.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# To proportionally change an image''s width and height:


    +   1. Select the image. Eight handles will appear around it.

    +   2. Position the mouse pointer over any one of the corner handles (Figure 17).

    +   3. Press the left mouse button and diagonally drag the handle. A dashed rectangle
    indicating the image box''s edge appears as you drag. In addition, the mouse pointer
    will change to a diagonal pointed arrow. If you drag toward the image, it will
    become smaller (Figure 18). If you drag away from the image, it will become larger
    (Figure 19).

    +   4. Release the mouse button when you are happy with the image''s new size.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_115_0.png)


    Figure 17. The handles at the corners of an image are used to proportionally resize
    the image''s height and width.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_115_1.png)


    Figure 18. As you drag toward the image, the handles disappear and a rectangle
    appears on the screen, indicating the edge of the graphic as it gets proportionally
    smaller.


    # Making it Easier to See Images when You Move and Size Them


    When you''re moving and sizing images, it''s easier to see where you are if you
    zoom out to a full page view.


    # To zoom out to a full page view:


    +   1. Click on white space to deselect the image.

    +   2. Click the Zoom button on the WordPerfect 8 Toolbar and select 100% from
    the drop-down list.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_115_2.png)


    Figure 19. As you drag away from the image, the handles disappear and a rectangle
    appears on the screen, indicating the edge of the image as it gets proportionally
    larger.'
