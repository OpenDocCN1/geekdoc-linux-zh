  img_proc: true
- pgno: 19
  md: '# Large Menus and Dialog Boxes


    WordPerfect 8 menus and dialog boxes contain many commands and items to select.
    Consequently, some of them are quite large. Several of the figures in this Visual
    QuickStart Guide are too big to display in their entirety or become very small
    when sized to fit the page. In order to fit these large items, some menus and
    dialog boxes have been shortened using a jagged edge (Figures 5a–b). The menu
    or dialog box item being selected is shown, but lower or middle items are removed
    to conserve space. When a large dialog box is shown and its contents are very
    tiny, a circle is drawn around the area under discussion (Figure 6).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_19_0.png)


    Figure 5a. Menus in some figures have been cropped using a jagged edge.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_19_1.png)


    Figure 5b. Dialog boxes in some figures have been cropped using a jagged edge
    to conserve space.


    # This Book is Based on the WordPerfect 8 Personal Edition


    WordPerfect 8 for Linux is available in three versions, the downloadable Free
    Version, the Personal Edition, and the Server Edition. (For details on the differences
    between these versions, turn to page 20.)


    This book is based upon the Personal Edition. If you are using the Server Edition
    of WordPerfect, every feature I discuss here will be available in your copy of
    WordPerfect. If you are using the downloadable Free Version, there will be some
    features which will be grayed out and unavailable to you. For instance, you won’t
    be able to create macros or charts.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_19_2.png)


