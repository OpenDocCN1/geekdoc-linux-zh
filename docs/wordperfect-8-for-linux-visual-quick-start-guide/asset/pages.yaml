- pgno: 95
  md: '# Where are All the Fonts?


    The WordPerfect Personal Edition CD-ROM ships with 130 different fonts that you
    can use to create professional documents. In order to install any of the fonts,
    you need to start WordPerfect as an administrator (this is different than logging
    on to Linux as root). If you don’t have the permissions to do this, you’ll need
    to talk to your system administrator.


    # To install fonts:


    +   1. Log on as root or su to root.

    +   2. Insert the WordPerfect CD-ROM in your computer’s CD-ROM drive.

    +   3. Mount the CD-ROM drive (for directions on how to do this turn to page 21).

    +   4. To launch WordPerfect as an administrator, open a terminal window (Figure
    26). (Turn to page 22 for details on how to do this.

    +   5. Move to the directory where WordPerfect is installed. In Figure 27 the
    directory is /usr/wp.

    +   6. Change to the wpbin directory.

    +   7. Type ./xwp -adm (Figure 27), then press Enter on the keyboard. WordPerfect
    will launch.

    +   8. Choose Font from the Format menu (Figure 21) or press F9 on the keyboard.
    The Font dialog box will open (Figure 22).

    +   9. Click the Install Fonts button (Figure 28) (when you run WordPerfect normally,
    this button is not available and is grayed out). The Select Font Type dialog box
    will appear (Figure 29).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_95_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_95_1.png)


