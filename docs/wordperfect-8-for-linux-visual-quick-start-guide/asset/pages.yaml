- pgno: 123
  md: '# Drawing Shapes


    WordPerfect almost feels like a drawing program! As well as inserting lines, you
    can also draw shapes—rectangles, circles, and ellipses right into your document.


    # To insert a shape:


    +   1. Choose Rectangle, Rounded Rectangle, Circle, or Ellipse from the Shape
    fly-out on the Insert menu (Figure 48). The mouse pointer will change to a crosshair.

    +   2. Position the crosshair at the upper left-hand corner of the area where
    you want to draw the shape.

    +   3. Press the left mouse button and drag diagonally down to the right to create
    the shape (Figure 49). When you release the mouse button, the shape appears in
    the document, selected.

    +   4. To change the fill color of a shape, click the Fill Color button on the
    Property Bar and select a new color from the palette (Figure 50).

    +   5. To add a shadow to the shape, click the Shadow button on the Property Bar
    and choose a shadow from the drop-down list (Figure 51).

    +   6. When you are finished creating the shape, click in white space to deselect
    the shape.


    # Tip


    +   Shapes are contained in Image boxes, so they can be moved, resized, and flipped
    just like a graphic. You can also set the way text flows around shapes.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_123_0.png)


