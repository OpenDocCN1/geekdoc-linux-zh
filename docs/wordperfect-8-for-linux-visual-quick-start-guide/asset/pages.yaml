    +   2. Display the Ruler Bar if it isn''t already available by choosing Ruler
    from the View menu (Figure 49).

    +   3. Drag the column width markers to change how wide a column is (Figure 50).
    (You can also drag the tab settings to change their position in a column.)

    +   4. Drag the margin markers to change where the left and right margins in a
    column are (Figure 51).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_144_0.png)


