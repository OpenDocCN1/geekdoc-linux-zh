  img_proc: true
- pgno: 100
  md: '# Line Spacing


    With WordPerfect, you can set the amount of space between lines in two ways: absolutely,
    using an exact measurement (this is known as leading), or automatically, where
    WordPerfect determines the line spacing by multiplying the line height by the
    line spacing value you set.


    # To set an exact line height:


    +   1. Position the insertion point where you want the line height change to begin
    or select the paragraph(s) you want to change.

    +   2. Choose Height from the Line fly-out on the Format menu (Figure 42). The
    Line Height dialog box will appear (Figure 43).

    +   3. Click the radio button next to Fixed.

    +   4. Enter an exact measurement in the Fixed text box.

    +   5. Click OK to return to the document.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_100_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_100_1.png)


    # To set line spacing:


    +   1. Position the insertion point where you want the line spacing change to
    begin or select the paragraph(s) you want to change.

    +   2. Choose Spacing from the Line fly-out on the Format menu (Figure 44). The
    Line Spacing dialog box will appear (Figure 45).

    +   3. Type the line spacing you would like in the Spacing text box.

    +   4. Click OK.


    # Tip


    +   To change the line spacing for an entire document, press Ctrl+Home to move
    to the top of the document, then follow the steps listed above.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_100_2.png)'
  merge: -1
  img_proc: true
