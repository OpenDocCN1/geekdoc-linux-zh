- pgno: 118
  md: '# Setting Text Flow


    You can set exactly how text will flow around, above, below, behind, or in front
    of an image.


    # To set text flow around an image:


    +   1. Select the image that you want to change.

    +   2. Right click on the image and choose Wrap from the QuickMenu (Figure 30).
    The Wrap Text dialog box will appear (Figure 31).

    +   3. Choose the way you would like the text to flow by selecting a radio button
    in the Wrapping Type area and a radio button in the Wrap Text Around area. Your
    choices include:

    +      - Square—the text flows around the borders of the Image box.

    +      - Contour—the text follows the shape of the object as it flows.

    +      - Neither Side—the text flows above and below an image, but not on either
    side.

    +      - Behind Text—the text flows over the image, obscuring it.

    +      - In Front of Text—the text flows under the image and is obscured by the
    image.

    +   4. Click OK. The text will flow around the image using the options you have
    selected (Figure 32).


    or


    +   1. Select the image you want to change.

    +   2. Choose a text flow option from the Wrap drop-down list on the Property
    Bar (Figure 33). The text will wrap around the object in the manner you selected.


    Figure 30. Right click on the image, then choose Wrap from the QuickMenu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_118_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_118_1.png)


    Figure 31. Select a radio button in both the Wrapping Type and Wrap Text Around
    areas, then click OK.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_118_2.png)


    Figure 32. Depending on the text wrap style you chose, the text flows around the
    object. In this figure, the options selected in Figure 31 were used.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Drawing Lines


    In order to make your document more organized, you can insert horizontal and vertical
    lines to define areas or add emphasis. You can also draw polylines, lines that
    consist of a series of straight, connected segments.


    # To draw a horizontal line:


    +   1. Position the insertion point where you would like the horizontal line to
    appear. If you are at the end of a paragraph, you can press Enter on the keyboard
    to move down to a blank line.

    +   2. Choose Horizontal Line from the Shape fly-out on the Insert menu (Figure
    34) or press Ctrl+F11 on the keyboard. The horizontal line will appear in the
    document, stretching from left margin to right margin (Figure 35).


    # Tip


    A horizontal line between a header and the body of a newsletter or report can
    add structure and organization.


    # To draw a vertical line:


    +   1. Position the insertion point where you would like the vertical line to
    appear. (Remember this line will go from the top of the page to the bottom.)

    +   2. Choose Vertical Line from the Shape fly-out on the Insert menu (Figure
    36). The vertical line will appear in the document, stretching from top margin
    to bottom margin (Figure 37).


    # Tip


    Vertical lines look great between columns of text. (For details on creating columns,
    turn to Chapter 7, Fun with Text.)


    Figure 33. Click the Wrap button on the Property Bar, and then select a text wrapping
    option from the drop-down list.


