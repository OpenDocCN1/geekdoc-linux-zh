- pgno: 130
  md: '# FUN WITH TEXT


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_130_0.png)


    Chapter 5, Formatting Your Text, showed you how to add text to documents. This
    chapter takes text one step further, adding advanced formatting techniques that
    bring organization, a professional look, and creative flair to your documents.
    Topics covered here range from changing text color and adding bullets and drop
    caps to setting columns and styles.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_130_1.png)


    # To change text color:


    +   1. Select the text you want to change.

    +   2. Click the Font Color button on the Property Bar and choose a color from
    the palette (Figure 1). The text will change to the color you selected.


    or


    +   1. Select the text you want to change.

    +   2. Choose Font from the Format menu (Figure 2). The Font dialog box will open
    (Figure 3).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_130_2.png)


    (continued)'
  merge: -1
  img_proc: true
- pgno: 131
  md: '3. In the Color Options area, click the button next to Color and choose a new
    color from the palette (Figure 4).


    4. Use the Shading text box to set how intense or saturated the color will be
    (Figure 5). The higher the number the more saturated a color is. For instance,
    blue set to 100 shading will be a rich, bright blue. Blue set to 10 shading will
    be a very light blue.


    5. Click OK to close the dialog box. The text will change to the color you selected.


    # Tip


    +   You can also change text color before you type the text by positioning the
    insertion point where you would like the colored text to start, choosing a new
    color using one of the methods outlined above, and then typing the colored text.


    # Highlighting


    Just as if you were using a highlighting pen, WordPerfect lets you highlight the
    text in your documents.


    # To highlight text:


    +   1. Choose On from the Highlight fly-out on the Tools menu (Figure 6). The
    mouse pointer will change to a tiny highlighting pen.

    +   2. Position the mouse where you would like to start highlighting.

    +   3. Press the left mouse button and drag until you are finished highlighting
    the text.

    +   4. Release the mouse button.


    # Tip


    +   To turn highlighting off, just choose On from the Highlight fly-out on the
    Tools menu again.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_131_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_131_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_131_2.png)'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Line Numbering


    Line numbering automatically numbers every line in a document. (This is different
    than inserting a numbered list which inserts a number for each paragraph.) You
    can set where the numbers appear on the page, and whether they continue through
    the entire document or stop and restart. (For details on creating a numbered list,
    turn to the section titled, Bullets and Numbering, on page 123.)


    # To add line numbering:


    +   1. Position the insertion point where you want the line numbering to start.

    +   2. Choose Numbering from the Line fly-out on the Format menu (Figure 7). The
    Line Numbering dialog box will appear (Figure 8).

    +   3. Select the check box next to Turn Line Numbering On.

    +   4. In the Numbering Options area, you can set (Figure 9):


    +   - Numbering Method—using this drop-down list, you can set whether the line
    numbers will appear as numbers, letters, or Roman numerals.

    +   - Starting Line Number—sets the number assigned to the first line of the paragraph
    if you want to use something other than 1.

    +   - First Printing Line Number—sets the first line number that will print in
    a document. For instance, if you don''t want line numbers before 9 to print, specify
    9.

    +   - Numbering Interval—this item sets the interval between printed line numbers.
    For instance, if you want a line number to print every fourth line, set this option
    to 4.


    (continued)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_132_0.png)


    Figure 7. Choose Numbering from the Line fly-out on the Format menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_132_1.png)


    Figure 8. Select the check box next to Turn Line Numbering On, then select the
    options you need.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_132_2.png)


    Figure 9. Use the Numbering Method drop-down list to select numbers, letters,
    or Roman numerals, then set the starting line number, which line will print first,
    and the interval between printed line numbers.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '5. In the Position of Numbers area, you can choose one of two options (Figure
    10):


    +   - From Left Edge of Page prints the numbers an exact distance from the left
    edge the of the page. Enter an exact measurement in the text box.

    +   - Left of Margin prints the numbers an exact distance from the left margin.
    Enter an exact measurement in the text box.


    6. Using the three check boxes near the bottom of the Line Numbering dialog box
    (Figure 11), you can also set whether numbering is restarted on each page, blank
    lines are counted, and, if you are using columns, newspaper columns are counted.


    7. If you want to select a font for the line numbering different from the one
    used for the document text, click the Font button near the upper-right corner
    of the Line Numbering dialog box. When the Line Numbering Font dialog box opens
    (Figure 12), select a new font, and then click OK to close the Line Numbering
    Font dialog box.


    8. When you have finished making selections, click OK to close the Line Numbering
    dialog box. As you type your document, the line numbers will appear next to each
    line (Figure 13).


    # Tips


    +   - Headers, footers, footnotes, and endnotes are not included in line numbering.

    +   - Line numbering is often used in legal documents, such as citations.

    +   - To turn line numbering off, open the Line Numbering dialog box, then deselect
    the box next to Turn Line Numbering On.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_133_0.png)


