- pgno: 162
  md: '# To add the date to a header or footer:


    Create a new header or footer or edit an existing one, position the insertion
    point where you want to place the date, and then press Ctrl+D on the keyboard.


    # To add page numbers:


    +   1. Position the insertion point on the page where you want the numbering to
    begin.

    +   2. Choose Numbering from the Page Numbering fly-out on the Page fly-out on
    the Format menu (Figure 29). The Page Numbering dialog box will appear (Figure
    30).

    +   3. Use the Position drop-down list to set where the page number will appear
    on the page. A preview of the positioning will appear in the preview area below
    the drop-down list.

    +   4. To set a font for the page numbering that is different than the default
    document font, click the Font button and use the Page Numbering Font dialog box
    (Figure 31).

    +   5. Click OK. The page numbers will appear in your document.


    # Figure 29. Choose Numbering from the Page Numbering fly-out on the Page fly-out
