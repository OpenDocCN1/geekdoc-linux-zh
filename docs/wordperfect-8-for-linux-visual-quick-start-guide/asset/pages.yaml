    +   1. Choose Polyline from the Shape fly-out on the Insert menu (Figure 44).
    The mouse pointer will change to a crosshair.

    +   2. Position the crosshair where you would like the polyline to start.

    +   3. Click. (Don''t press and drag.)

    +   4. Move the mouse to the place where you want the first segment to end. As
    you move the mouse, a line will appear from the starting position, attached to
    the mouse crosshair.

    +   5. Click again. The first segment will appear in the document (Figure 45).

