- pgno: 149
  md: '# Styles


    Styles let you quickly create consistently formatted documents by automatically
    setting text attributes. Styles also add a level of flexibility that you do not
    have if you format all your text "by hand." Changing a style definition, the text
    formatting that makes up a style, automatically changes all text in a document
    formatted with that style. For instance, instead of individually formatting each
    heading in a report, you could create a style for that report heading and apply
    it to all the headings. If you need to change the formatting of the headings,
    you merely revise the style.


    There are two types of styles:


    +   - Character—this type effects text formatting, such as font, font size, etc.

    +   - Paragraph—this type effects paragraph formatting, such as justification,
    indentation, etc.


    # To create a style:


    +   1. Format the text that you want to base your style on. (For instance, format
    one report heading the way you want all the report headings to look.)

    +   2. Position the insertion point within that formatted text.

    +   3. Choose Styles from the Format menu (Figure 66) or press Shift+Ctrl+F8 on
    the keyboard. The Style List dialog box will appear (Figure 67).

    +   4. Click QuickStyle. The Styles QuickCreate dialog box will open (Figure 68).

    +   5. Enter the name of your style in the Style Name text box.

    +   6. Type a description of the style, if you wish, in the Description text box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_149_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_149_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_149_2.png)'
  merge: -1
  img_proc: true
- pgno: 150
  md: '7. In the Style Type area, select whether the style you are creating is a Paragraph
    or Character Style.


    8. Click OK to close the Styles QuickCreate dialog box.


    9. Click Close to close the Style List dialog box.


    # To use a style:


    +   1. For a paragraph style, position the insertion point in the paragraph you
    want to format or for a character style, select the text you want to format.

    +   2. Select your style from the Style drop-down list on the Property Bar (Figure
    69).


    # Making Text Fit on the Page


    The Make It Fit Expert is a wonderful, time-saving WordPerfect feature that will
    expand text to make it fit on the number of pages you specify or squash text to
    make it fit on just one page.


    # To use the Make It Fit Expert:


    +   1. Open the document whose text you want to make fit.

    +   2. Choose Make It Fit from the Format menu (Figure 70). The Make It Fit dialog
    box will appear (Figure 71).

    +   3. In the Pages area, use the Desired Number of Filled Pages text box to set
    how many pages you would like to fill up with the document text.

    +   4. In the Items to Adjust area, select the check boxes next to the formatting
    options you would like WordPerfect to use to make the text fit.


    Figure 69. Open the Style drop-down list on the Property Bar and select the style
    you created.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_150_0.png)


    Figure 70. Choose Make It Fit from the Format menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_150_1.png)


    Figure 71. Set how many pages need to be filled and what formatting items should
    be adjusted.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_150_2.png)


    (continued)'
  merge: -1
  img_proc: true
