  md: '# Exiting WordPerfect


    Shutting down WordPerfect is very easy. There are three ways to do it.


    # To exit WordPerfect 8 for Linux:


    With the document window active, press Ctrl+Shift+F4 on the keyboard.


    or


    Choose Exit from the Program menu in the program window (Figure 61)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_61_0.png)


    or


    Click the Close button in the upper right-hand corner of the program window (Figure
    62).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_61_1.png)


    # Summary


    In this chapter you learned how to:


    +   - Put a menu item on the Gnome and K Main Menus

    +   - Launch WordPerfect

    +   - Start a new document

    +   - Start a new document using ExpressDocs

    +   - Create your own ExpressDocs

    +   - Open a document

    +   - Save your work

    +   - Save a copy of a file

    +   - Import and export a file

