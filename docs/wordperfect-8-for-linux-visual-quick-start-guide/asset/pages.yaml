- pgno: 173
  md: '# To turn on SmartQuotes:


    +   1. Choose QuickCorrect from the Tools menu (Figure 1). The QuickCorrect dialog
    box will appear with the QuickCorrect radio button selected at the top (Figure
    2).


    +   2. Select the SmartQuotes radio button. The QuickCorrect dialog box will change
    to display SmartQuote options (Figure 6).


    +   3. In the Select quotation marks area, select the check boxes next to the
    options you would like to turn on:


    +   Use double quotation marks as you type replaces straight double quotation
    marks with typographer’s double quotes.


    +   Use single quotation marks as you type replaces straight single quotation
    marks with typographer’s single quotes.


    +   Use straight quotation marks after numbers. This is handy if you are typing
    measurements and don’t want to have to turn SmartQuotes off every time you need
    a straight quote to indicate inches or feet.


    +   4. Click OK. The QuickCorrect dialog box will close. The next time you type
    a single or double quote, it will automatically be replaced with a typographer’s
    quote.


    # Tip


    +   You can set the type of typographer’s quotes that are used by clicking the
    drop-down list button next to the Open and Close text boxes in the Select quotation
    marks area (Figure 7).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_173_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_173_1.png)


    # WordPerfect’s Proofreading Tools are Good, but...


    ...there’s no substitute for reading a document carefully to manually check for
    mistakes. While WordPerfect’s Spell Check and Grammar tools are a great way to
    help you quickly find and fix errors, they aren’t perfect. Computers help us do
    many things, but they are still tools and no substitute for humans!'
  merge: -1
  img_proc: true
