- pgno: 225
  md: '# The Internet Publisher


    The Internet Publisher will help you create new documents using the appropriate
    HTML codes. It will also convert an existing document into Web-ready HTML format.
    You should know, however, that if you do convert an existing document, there are
    several features not supported in HTML. Some of these include columns, drop caps,
    footnotes, page numbering, tabs and indents, and macros. For a complete list of
    unsupported features, turn to page 281 in the WordPerfect User’s Guide that ships
    with the Personal Edition.


    # To create a new Web document:


    +   1. Choose Internet Publisher from the File menu (Figure 1). The Internet Publisher
    window will open (Figure 2).

    +   2. Click New Web Document. The Web Editor will appear with a blank document
    open in the editor window, ready for you to create your Web pages (Figure 3).


    # Tip


    The Web Editor is actually a special version of the normal document window setup
    to create Web pages.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_225_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_225_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_225_2.png)'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# To convert an existing document to a Web document:


    +   1. Open the document you want to convert (Figure 4).


    +   2. Choose Internet Publisher from the File menu (Figure 1). The Internet Publisher
    window will open (Figure 2).


    +   3. Click Format as Web Document. The Web View dialog box will open, telling
    you that some of the formatting will be lost (Figure 5).


    +   4. Click Yes to continue with the conversion. The document is converted to
    a Web document and appears in the Web Editor window (Figure 6).


    # Tips


    +   WordPerfect tries to save as much of the formatting of your document as possible
    when it performs the conversion. However, since a regular document and a Web document
    are two entirely different critters, they will look a bit different.


    +   If you decide that you didn’t want to convert a document to Web format after
    all, you can revert it back to its previous form. Immediately after the conversion,
    click the Close button at the upper-right corner of the Web Editor window to close
    the document. When you open it again, you will see that it is in its original
    form.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_226_0.png)


    Figure 4. Open the document you want to convert.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_226_1.png)


    Figure 5. Before the actual conversion, WordPerfect warns you that some formatting
    may be lost.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_226_2.png)


    Figure 6. After the document is converted, it appears in the Web Editor window.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# # Chapter 13


    # ## Adding a Title


    Now that you’ve created a new Web document and converted a regular document to
    Web format, it’s time to add the text, graphics, and formatting that will make
    your Web pages distinctive.


    The first thing you should do is add a title to your Web page. The title is displayed
    in the title bar of the Web browser. If you do not specify a title, WordPerfect
    automatically uses the first heading.


    # To add a title:


    +   1. Choose Title from the Format menu (Figure 7). The Title dialog box will
    appear (Figure 8).


    +   2. Select the Custom Title radio button, then type your title in the text
    box. The title shouldn’t be too long, just something descriptive about the page
    or your Web site.


    +   3. Click OK. The Title dialog box will close. You will see the title when
    you view the Web page with a browser (Figure 9).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_227_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_227_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_227_2.png)'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Headings


    Web pages use special heading styles. There are six levels—Heading 1 is the largest
    and Heading 6 the smallest. Figure 10 shows the relative heading sizes.


    # To add a heading:


    +   1. Click the Heading and Paragraph Style button on the Property Bar (Figure
    11).

    +   2. Choose the heading size you would like to use from the drop-down list.

    +   3. Type the heading.

    +   4. Press Enter on the keyboard to end the heading. Headings can really get
    folks’ attention (Figure 12).


    Tip


    +   You can also select text that you would like to format as a heading, then
    follow steps 2–3.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_228_0.png)


    Figure 10. The six different heading sizes shown in a browser.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_228_1.png)


    Figure 11. Click the Heading and Paragraph Style button, then choose the heading
    size you would like to use from the drop-down list.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_228_2.png)


    Figure 12. Headings can help organize your Web documents and draw attention where
    it’s needed.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Entering and Formatting Text


    Entering and formatting text in a Web document is the same as a normal WordPerfect
    document. All the skills you have learned previously in this book can be applied
    here. Text formatting can be divided into two categories, character level formatting
    and paragraph level formatting.


    # To add text:


    Position the insertion point where you want to add the text, then type your text
    (Figure 13).


    # Tips


    +   - When you press Enter to start a new paragraph, a double-spaced line will
    be inserted between the paragraphs.

    +   - If you want to start a new line without starting a new paragraph, choose
    Line Break from the Insert menu (Figure 14).


    # To edit text:


    Select the text you would like to change, then type the replacement text (Figure
    15). The selected text is deleted and the replacement text takes its place.


    # To delete text:


    Select the text you want to delete, then press the Backspace or Delete keys on
    the keyboard.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_229_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_229_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_229_2.png)'
  merge: -1
  img_proc: true
- pgno: 230
  md: "# To change fonts:\n\n+   1. Select the text you want to change.\n+   \n+ \
    \  or\n+   \n+   Position the insertion point where you would like the new font\
    \ to start.\n+   \n+   2. Click the Font button on the Property Bar and choose\
    \ a new font from the drop-down list (Figure 16).\n\n# Tip\n\nIf you use a special\
    \ font, the folks browsing your Web pages must have that font loaded on their\
    \ computers. Otherwise, the text will appear in the browser's default font which,\
    \ most likely, would be some form of Times (also called Roman or Times Roman).\n\
    \n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_230_0.png)\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_230_1.png)\n\
    \n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_230_2.png)\n\n# To make text larger\
    \ or smaller:\n\n+   1. Select the text you want to change.\n+   \n+   2. Click\
    \ the Font Size button on the Property Bar and choose a new font point size from\
    \ the drop-down list (Figure 17).\n+   \n+   or\n+   \n+   Click the Font Attributes\
    \ button on the Property Bar and choose a relative font size from the drop-down\
    \ list (Figure 18). These sizes include Fine, Small, Large, Very Large, and Extra\
    \ Large.\n\n# Tip\n\nFor a discussion of font point sizing, turn to page 80. For\
    \ details about relative font sizing, take a look at page 81."
  merge: -1
  img_proc: true
- pgno: 231
  md: '# To make text bold or italic:


    +   1. Select the text you want to change.

    +   2. Click the Bold or Italic button on the Property Bar.

    +   or

    +   Click the Font Attributes button on the Property Bar and choose Bold or Italic
    from the drop-down list (Figure 19).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_231_0.png)


    # To make text underlined:


    +   1. Select the text you want to change.

    +   2. Click the Font Attributes button on the Property Bar and choose Underline
    from the drop-down list (Figure 20).


    # Tip


    +   You can activate more than one font attribute at a time, for instance, bold
    and italic.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_231_1.png)


    # To make text blink:


    +   1. Select the text you want to make blink.

    +   2. Click the Font Attributes button on the Property Bar and choose Blink from
    the drop-down list (Figure 21).


    # Tip


    +   Use blinking text sparingly. It can get quite annoying if everything on a
    Web page is blinking!


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_231_2.png)


    # To change the text''s color:


    +   1. Select the text you want to change.

    +   2. Click the Font Color button on the Property Bar and choose a new color
    from the palette that appears (Figure 22).'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Paragraph Formatting


    Just like a regular WordPerfect document, paragraph formatting in a Web document
    affects an entire paragraph of text. Some paragraph formatting includes justification,
    bulleted and numbered lists, and double indentation.


    # To justify paragraph text:


    +   1. Select the text you want to justify.

    +   2. Click the Align button on the Property Bar and choose a justification from
    the drop-down list (Figure 23).


    # To create a bulleted or numbered list:


    +   1. Position the insertion point where you would like the list to start.

    +   2. There are two ways to select a list style:

    +      A. Choose Bullets & Numbering from the Insert menu (Figure 24). The Bullets
    & Numbers dialog box will open (Figure 25).

    +      B. Select either the Bullet List or Numbered List radio button.

    +      C. Click OK. The Bullets & Numbers dialog box will close, returning you
    to the editor window.

    +      or

    +      Click the Heading and Paragraph Style button on the Property Bar and choose
    Bullet List or Numbered List from the drop-down list (Figure 26).


    Figure 22. Click the Font Color button on the Property Bar and choose a new color
    from the palette.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_232_0.png)


    Figure 23. Click the Align button on the Property Bar and choose a justification
    from the drop-down list.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_232_1.png)


    Figure 24. Choose Bullets & Numbering from the Insert menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_232_2.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_232_3.png)


    Figure 25. Select the radio button next to Bullet List or Numbered List, then
    click OK.


    (continued)'
  merge: -1
  img_proc: true
- pgno: 233
  md: '+   3. Type the list, pressing the Enter key each time you want to add another
    list item.

    +   4. To turn off the list style:

    +      A. Press Enter on the keyboard after your last list entry.

    +      B. Click the Heading and Paragraph Style button on the Property Bar and
    choose Normal from the drop-down list. (Figure 27)


    # Tip


    +   - To move to a second or third level under a list item, press the Tab key
    on the keyboard.


    # To double indent a paragraph:


    +   1. Select the text that you would like to indent on both the left and right
    sides.

    +   2. Click the Heading and Paragraph Style button on the Property Bar and choose
    Indented Quotation from the drop-down list (Figure 28). The text will indent on
    both sides.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_233_0.png)


    Figure 26. Click the Heading and Paragraph Style button on the Property Bar and
    choose Bullet List or Numbered List from the drop-down list.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_233_1.png)


    Figure 27. When you are finished with the list, press Enter on the keyboard, then
    choose Normal from the Heading and Paragraph Style drop-down list.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_233_2.png)


    Figure 28. Click the Heading and Paragraph Style button on the Property Bar, then
    choose Indented Quotation from the drop-down list.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_233_3.png)


    Figure 29. Choose Text/Background Colors from the Format menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_233_4.png)


    Figure 30. Use the Background Color/Wallpaper area to set your Web page''s background.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Background Colors and Images


    Gray is the default background color in the Web Editor, but it doesn''t have to
    be your choice. It''s easy to set a new background color or choose an image that
    is tiled on the Web page. A tiled image is repeated, across and down the Web page
    to create a complete background.


    # To set a background color or image:


    +   1. Choose Text/Background Colors from the Format menu (Figure 29). The Text/Background
    Colors dialog box will open (Figure 30).


    +   2. To set a background color:


    +   A. Click the tiny button to the right of Background Color in the Background
    Color/Wallpaper area. A color palette will appear (Figure 31).


    +   B. Click the color you want to use. The color palette will close.


    # To set an image as the background:


    +   A. Click the list button next to the Background Wallpaper text box. The Select
    File dialog box will appear (Figure 32).


    +   B. Use the Directory List and File List boxes to move to the directory where
    the image file is stored and then select it.


    +   C. Click OK. The full path of the image fill will appear in the Background
    Wallpaper text box.


    +   3. Click OK. The Text/Background Colors dialog box will close. If you chose
    a color it will appear as the background of your Web document. If you chose an
    image, you will only be able to see it when you view your Web page with a browser
    (Figure 33).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_234_0.png)


    Figure 31. Click the tiny button to the right of Background Color, then choose
    a new color from the palette.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_234_1.png)


    Figure 32. Use the Select File dialog box to find the image file. The dialog box
    will only let you select .gif files.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_234_2.png)


    Figure 33. If you choose an image for your background, you will only be able to
    see it when the Web page is viewed in a browser. In this example, an image has
    been tiled across and down the Web page.'
  merge: -1
  img_proc: true
- pgno: 235
  md: "# # Creating Links\n\nHyperlinks are one thing that makes the Web great. The\
    \ cross-referencing power of links—the ability to jump from one Web page or site\
    \ to another—is immense. Creating hypertext links is easy. All you need to do\
    \ is associate selected text with the Web page or site you want to jump to.\n\n\
    # To create a hypertext link:\n\n+   1. Select the text that you want the user\
    \ to click to jump to another Web page or site.\n+   \n+   2. Choose Hyperlink\
    \ from the Tools menu (Figure 34). The Create Hypertext Link dialog box will open\
    \ (Figure 35).\n+   \n+   3. Select the radio button next to Go To Other Document\
    \ (Figure 36).\n+   \n+   4. In the Go To Other Document text box, type the full\
    \ URL of the Web page or site. For instance, http://www.bearhome.com.\n+   \n\
    +   5. Click OK. The Create Hypertext Link dialog box will close and the selected\
    \ text will be underlined and change color, indicating that it is now a hypertext\
    \ link.\n\nThe default color of a hypertext link is blue. If you want to change\
    \ it, take a look at the next page.\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_235_0.png)\n\
    \n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_235_1.png)\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_235_2.png)\n\
    \n# CREATE A HYPERTEXT LINK"
  merge: -1
  img_proc: true
- pgno: 236
  md: '# To change hypertext link color:


    +   1. Choose Text/Background Colors from the Format menu (Figure 37). The Text/Background
    Colors dialog box will open (Figure 38).

    +   2. In the Hypertext Color area, click the tiny button to the right of Hypertext
    Link and select a new color from the palette that appears (Figure 39).

    +   3. Click OK. The Text/Background Colors dialog box will close and your hyperlink
    text will change to the new color.


    # Tip


    If you wish to change the colors for Visited Hypertext Link and Active Hypertext
    Link, click the appropriate buttons in the Hypertext Color area and choose new
    colors from the palettes that appear.


    Figure 37. Choose Text/Background Colors from the Format menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_236_0.png)


    Figure 38. Use the Hypertext Color area to set your Web page''s hypertext link
    colors.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_236_1.png)


    Figure 39. Click the tiny button to the right of Hypertext Link, then select a
    new color from the palette.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_236_2.png)'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Inserting Images


    Pictures are worth a thousand words and Web images are no different! You can insert
    any of the clipart images that come with the Personal Edition of WordPerfect.
    The Web Editor will automatically convert them to the proper Web format.


    Along with images go two things that need to be set:


    +   - Alternate text—this is text that appears on the Web page while the image
    loads in the browser

    +   - Spacing around the graphic to set text flow.


    Also, just like the graphics discussed in Chapter 6, Clipart, Lines, & Charts,
    you can add borders, fills, and captions. For details on how to add these items,
    turn to pages 101–106.


    # To insert an image:


    +   1. Position the insertion point where you would like the image to appear.

    +   2. Choose From File from the Graphics fly-out on the Insert menu (Figure 40).
    The Insert Image dialog box will appear (Figure 41).

    +   3. Use the Directory List and File List boxes to move to where the image is
    stored and select it.

    +   4. Click Insert. The image will appear on your Web page (Figure 42).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_237_0.png)


    Figure 40. Choose From File from the Graphics fly-out on the Insert menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_237_1.png)


    Figure 41. Use the Insert Image dialog box to locate the Image file and select
    it.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_237_2.png)


    Figure 42. The image appears where the insertion point is located. Any text near
    the image moves over to make room for the picture.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# To set alternate text:


    +   1. Right click on the image for which you want to set alternate text.

    +   2. Choose HTML Properties from the QuickMenu (Figure 43). The HTML Properties
    dialog box will open (Figure 44).

    +   3. Enter the text that you would like to appear while the image is loading
    into the Alternate Text box (Figure 45).

    +   4. Click OK. The HTML Properties dialog box will close and the alternate text
    will appear when the Web page is loading into a browser.


    # To set spacing around an image:


    +   1. Right click on the image for which you want to set spacing.

    +   2. Choose HTML Properties from the QuickMenu (Figure 43). The HTML Properties
    dialog box will open (Figure 44).

    +   3. In the Display Options area, use the Horizontal Spacing, Vertical Spacing,
    and Border Width text boxes to set the space between the graphic and text. The
    number you enter is in pixels. (This is the unit of measure for Web pages.)

    +   4. Click OK. The image will adjust its spacing and the text will appear the
    specified distance from the image (Figure 46).


    Figure 43. Right click on the image and choose HTML Properties from the QuickMenu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_238_0.png)


    Figure 44. The HTML Properties dialog box is used to set alternate text and image
    links.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_238_1.png)


    Figure 45. Type the text in the Alternate text box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_238_2.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_238_3.png)


    Figure 46. The spacing around the image changes and the text moves to accommodate
    the new spacing.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# # Chapter 13


    To create an image link:


    +   1. Right click on the image you want to set as a link.

    +   2. Choose HTML Properties from the QuickMenu (Figure 43). The HTML Properties
    dialog box will open (Figure 44).

    +   3. In the Define Mouse Click Action area, select the radio button next to
    Link (Figure 47).

    +   4. Click the Link Properties button. The Edit Hypertext dialog box will open
    (Figure 48).

    +   5. Select the radio button next to Go To Other Document, then type the full
    URL of the Web page or site. For instance, http://www.bearhome.com.

    +   6. Click OK. The Edit Hypertext dialog box will close, returning you to the
    HTML Properties dialog box.

    +   7. Click OK. The HTML Properties dialog box will close, returning you to the
    Web Editor. When you view your Web page in a browser, click the image, and the
    link will jump you to the specified Web page or site.


    Figure 47, in the Define Mouse Click Action area, select the radio button next
    to Link, then click the Link Properties button.


    Figure 48. Click the Go To Other Document radio button, then type the Web page
    or site URL in the text box.


    # ## Help with Web Design


    The best source for advice on the Web is the Web itself. There are many sites
    on the Web that offer advice on Web page design and style. Page design isn''t
    just about pretty pictures, it includes creating user-friendly sites that make
    it easy for visitors to find the information they need. A few sites that offer
    interesting advice and tools for Web design are:


    +   • Sun Microsystems Inc''s Guide to Web Style: http://www.sun.com/styleguide

    +   • Web Designer''s Paradise: http://desktoppublishing.webparadise.html

    +   • Web design links available at Yahoo: http://www.yahoo.com/Computers_and_Internet/Internet/World_Wide_Web/Page_Creation'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Saving and Viewing Your Web Pages


    After all the work is done the fun begins! It''s easy to save your Web document
    in HTML format and view it in a browser. When a Web document is saved, WordPerfect
    considers that it has been published, meaning that it is ready for upload to a
    Web server.


    # To save your Web pages in HTML format:


    +   1. Choose Internet Publisher from the File menu (Figure 1). The Internet Publisher
    window will appear (Figure 2).

    +   2. Click Publish to HTML. The Publish to HTML dialog box will open (Figure
    49).

    +   3. In the Publish to text box type in the location where you would like the
    Web document saved.

    +      or

    +      A. Click the list button. The Select File dialog box will appear (Figure
    50).

    +      B. Use the Directory List box to move to the location where you would like
    to store the Web document.

    +      C. Type the name that you would like to save the Web document as in the
    Filename/Current Selection text box.

    +      D. Click OK. The full pathname that the Web document will be saved as will
    appear in the Publish to text box.

    +   4. Click OK. The Web document will be saved in HTML format. You can open the
    document and edit it like any other WordPerfect document.


    Figure 49. Type the location and name for the Web document in the Publish to text
    box, or click the list button and use the Select File dialog box to set the location
    and file name.


    Figure 50. Use the Directory List box to move to the location where you want to
    store your Web document, then type the name in the Filename/Current Selection
    text box. It may seem confusing to use a "Select File" dialog box to name a Web
    document that has yet to be published, but it works fine all the same.


    Figure 51. Choose View in Web Browser from the View menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_240_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_240_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_240_2.png)'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# To view your Web pages:


    Choose View in Web Browser from the View menu (Figure 51). The Web page will load
    in your browser (Figure 52).


    # Tips


    +   - If WordPerfect can''t find your browser, choose Internet Publisher from
    the File menu to open the Internet Publisher dialog box (Figure 2). Click the
    Browser Preferences button to open the Browser Preferences dialog box (Figure
    53). Click the File button next to the Full path to your Web Browser text box
    and use the Select File dialog box to locate the browser.

    +   - Viewing Web pages in a browser is handy. You can check out hypertext and
    image links to make sure they work, and see exactly how the Web page appears in
    the browser.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_241_0.png)


    Figure 52. Your Web page appears in the browser.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_241_1.png)


    Figure 53. In the Web Browser area, enter the full path of your browser in the
    text box.


    # Summary


    In this chapter you learned how to:


    +   - Create a new Web document

    +   - Convert an existing document to a Web document

    +   - Add a title to your Web page

    +   - Add headings

    +   - Add, edit, and delete text

    +   - Change font and font size

    +   - Make text bold, italic, or underlined

    +   - Make text blink

    +   - Change text color

    +   - Create bulleted and numbered lists

    +   - Double indent paragraphs

    +   - Create hypertext links

    +   - Set background colors and images

    +   - Create an image link

    +   - Save your Web document

    +   - View your Web document in a browser'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# PRINTING


    Figure 1. Choose Print from the File menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_242_0.png)


    Printing can be used in many ways. Besides printing a document when it is completed,
    you can print draft documents to see how they look on paper. You can try a special
    effect and then print it to see how it looks (many times the printed page appears
    quite different from what you see on the monitor). Or you can even print a document
    for good old red pencil editing.


    # To print a document:


    +   1. Choose Print from the File menu (Figure 1) or click the Print button on
    the WordPerfect 8 Toolbar. The Print dialog box will open with Full Document selected
    in the Print Selection area (Figure 2).

    +   2. Click OK. The document will print.


    Tip


    +   It''s a good idea to always save your document before you print.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_242_1.png)


    Figure 2. Click OK to print the document.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# To print more than one copy of a document:


    +   1. Choose Print from the File menu (Figure 1) or click the Print button on
    the WordPerfect 8 Toolbar. The Print dialog box will open (Figure 2).

    +   2. In the Copies area on the right side of the dialog box, type a number in
    the Number of Copies text box or click the little up arrow to increase the number
    (Figure 3).

    +   3. Click OK.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_243_0.png)


    Figure 3. Use the Number of Copies text box to set how many copies of a document
    will print.


    # To print the current page:


    +   1. Position the insertion point on the page you would like to print.

    +   2. Choose Print from the File menu (Figure 1) or click the Print button on
    the WordPerfect 8 Toolbar. The Print dialog box will open (Figure 2).

    +   3. Select the radio button next to Current Page in the Print Selection area
    (Figure 4).

    +   4. Click OK. The page will print.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_243_1.png)


    Figure 4. In the Print Selection area, select the radio button next to Current
    Page.


    # To print specific text:


    +   1. Select the text you would like to print.

    +   2. Choose Print from the File menu (Figure 1) or click the Print button on
    the WordPerfect 8 Toolbar. The Print dialog box will open (Figure 2).

    +   3. Select the radio button next to Selected Text in the Print Selection area
    (Figure 5).

    +   4. Click OK. The text will print.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_243_2.png)


    Figure 5. In the Print Selection area, select the radio button next to Selected
    Text.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# To print specific pages:


    +   1. Choose Print from the File menu (Figure 1) or click the Print button on
    the WordPerfect 8 Toolbar. The Print dialog box will open (Figure 2).

    +   2. Select the Multiple Pages radio button in the Print Selection area (Figure
    6).

    +   3. Click OK. The Multiple Pages dialog box will open (Figure 7).

    +   4. In the Page(s) text box, enter the page numbers you want to print.

    +   5. Click OK. Both the Multiple Pages and Print dialog boxes will close and
    the pages you specified will print.


    # Tip


    If you are printing specific pages, you can specify page numbers, such as 2, 6,
    or 9, or a page range. For instance, if you enter 2-9, pages 2 through 9 would
    print. If you enter -4, pages 1 through 4 would print. If you enter 6-, page 6
    through the end of the document would print.


    # To print a draft of a document without graphics:


    +   1. Choose Print from the File menu (Figure 1) or click the Print button on
    the WordPerfect 8 Toolbar. The Print dialog box will open (Figure 2).

    +   2. In the Document Settings area, use the Print Quality drop-down list to
    select Draft (Figure 8).

    +   3. Select the box next to Do Not Print Graphics.

    +   4. Click OK to print the document.


    Figure 6. In the Print Selection area, select the radio button next to Multiple
    Pages.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_244_0.png)


    Figure 7. Use the Page(s) text box to set the pages you want printed, then click
    OK. In this example, pages 2, 5, 8, 9, and 10 will print.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_244_1.png)


    Figure 8. Use the Print Quality drop-down list to select Draft, then select the
    box next to Do Not Print Graphics.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_244_2.png)'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# To print a document back to front:


    +   1. Choose Print from the File menu (Figure 1) or click the Print button on
    the WordPerfect 8 Toolbar. The Print dialog box will open (Figure 2).

    +   2. Click the Output Options button. The Output Options dialog box will open
    (Figure 9).

    +   3. In the Formatting Options area, select the check box next to Print in Reverse
    Order (Back to Front) (Figure 10).

    +   4. Click OK. The Formatting Options dialog box will close, returning you to
    the Print dialog box.

    +   5. In the Print Selection area, select how much of the document you want to
    print, either the Full Document or Multiple Pages.

    +   6. Click OK. If you selected Full Document in step 5, the document will print.
    If you selected Multiple Pages in step 5, the Multiple Pages dialog box will open
    (Figure 11). Type the page numbers you would like to print in the Pages text box,
    then click OK. Both the Multiple Pages and Print dialog boxes will close and the
    pages will print.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_245_0.png)


    Figure 9. Use the Output Options dialog box to set whether a document will print
    from back to front, print odd or even pages (or both), or print a banner.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# To print odd or even pages:


    +   1. Choose Print from the File menu (Figure 1) or click the Print button on
    the WordPerfect 8 Toolbar. The Print dialog box will open (Figure 2).

    +   2. Click the Output Options button. The Output Options dialog box will open
    (Figure 9).

    +   3. Use the Print Odd/Even Pages drop-down list to select either odd or even
    (Figure 12).

    +   4. Click OK. The Formatting Options dialog box will close, returning you to
    the Print dialog box.

    +   5. In the Print Selection area, select how much of the document you want to
    print, either the Full Document or Multiple Pages.

    +   6. Click OK. If you selected Full Document in step 5, the document will print.
    If you selected Multiple Pages in step 5, the Multiple Pages dialog box will open
    (Figure 11). Type the page numbers you would like to print in the Pages text box,
    then click OK. Both the Multiple Pages and Print dialog boxes will close and the
    pages will print.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_246_0.png)


    Figure 10. In the Formatting Options area, select the check box next to Print
    in Reverse Order (Back to Front).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_246_1.png)


    Figure 11. Use the Page(s) text box to set the pages you want printed, then click
    OK. In this example, pages 2, 5, 8, 9, and 10 will print.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_246_2.png)


    Figure 12. Use the Print Odd/Even Pages drop-down list to set whether odd or even
    pages (or both) are printed.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Banners


    Banners are used to separate print jobs. If you are printing many documents or
    work in an office where one printer is used by many people, it can be handy to
    print a banner that separates one document from another. A banner consists of
    2 pages, one printed before the document and one printed after. The page that
    is printed before a document usually includes the name of the person who printed
    the document, as well as the document’s filename, and the date and time it was
    sent.


    # To print banners:


    +   1. Choose Print from the File menu (Figure 1) or click the Print button on
    the WordPerfect 8 Toolbar. The Print dialog box will open (Figure 2).

    +   2. Click the Output Options button. The Output Options dialog box will open
    (Figure 13).

    +   3. In the WPApp Destination Options area, select the check box next to Print
    WPApp Banners (Figure 14).

    +   4. Click OK. The Output Options dialog box will close, returning you to the
    Print dialog box.

    +   5. In the Print Selection area, select how much of the document you want to
    print.

    +   6. Click OK to print the document.


    # Tip


    +   If you are not using a shared printer, the WPApp Destination Options area
    will be grayed out and unavailable.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_247_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_247_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_247_2.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Printing Envelopes


    Printing envelopes is easy. WordPerfect sets up the spacing automatically for
    you, so all you have to do is enter a return address and the addressee''s information.


    # To print an envelope:


    +   1. Choose an Envelope from the Format menu (Figure 15). The Envelope dialog
    box will appear (Figure 16).

    +   2. If you want to print a return address:

    +      A. In the Return Addresses area, type the return address in the text box.

    +      B. Select the box next to Print Return Address in the Return Addresses
    area.

    +   3. In the Mailing Addresses area, type the name and address of the person
    to whom you are sending the envelope.

    +   4. In the Envelopes area, use the Envelope Definitions drop-down list to select
    the envelope size you are using.

    +   5. Load the envelope in your printer.

    +   6. Click Print. The Envelope dialog box will close and the envelope will be
    printed.


    # Tips


    +   - As you enter the information for your envelope, a preview of the envelope
    appears in the preview area (Figure 17).

    +   - For details on how to set up an envelope mail merge to quickly print a list
    full of addresses, turn to pages 197–199.

    +   - If there are no envelope sizes available in the Envelope Definitions drop-down
    list, take a look at page 238 for directions on how to add envelopes.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_248_0.png)


    Figure 16. Use the Envelope dialog box to enter the return address, mailing address,
    and envelope size.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_248_1.png)


    Figure 17. As you create the envelope a preview appears in the preview area.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_248_2.png)


    Figure 18. Use the Create Paper Size dialog box to set the paper name, type of
    paper, and its size.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# To create an envelope definition:


    +   1. Choose Envelope from the Format menu (Figure 15). The Envelope dialog box
    will open (Figure 16).

    +   2. Click Create New Definition. The Create Paper Size dialog box will appear
    (Figure 18).

    +   3. Type a name for your new envelope in the Paper Name text box.

    +   4. In the Paper Type area, use the Type drop-down list to select Envelope
    (Figure 19).

    +   5. In the Paper Size area, use the Size drop-down list to select the size
    of envelope you are using (Figure 20).

    +   6. In the Paper Location area use the Location drop-down list to select the
    location where your envelopes will be loaded on your printer. By default, this
    is Manual Feed.

    +   7. Click OK. The Create New Definition dialog box will close, returning you
    to the Envelope dialog box. The envelope definition you created will now be selected
    and available in the Envelope Definitions drop-down list (Figure 21).

    +   8. Click OK to close the Envelope dialog box without printing an envelope
    or fill in the Return Addresses and Mailing Addresses text boxes and click Print
    to print an envelope.


    Figure 19. Select Envelope from the Type drop-down list.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_249_0.png)


    Figure 20. Select an envelope size from the Size drop-down list.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_249_1.png)


    Figure 21. The envelope you created appears in the Envelope Definitions drop-down
    list.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_249_2.png)


    Figure 23. In the Printer Create/Edit dialog box, click Add.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_249_3.png)


    Figure 22. In the Select Printer dialog box, click Printer Create/Edit.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_249_4.png)'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Adding More Printers


    Some folks have access to more than one printer. You can add and delete printers,
    and set printer properties using the Select Printer dialog box.


    # To add a printer:


    +   1. Choose Print from the File menu (Figure 1) or click the Print button on
    the WordPerfect 8 Toolbar. The Print dialog box will open (Figure 2).

    +   2. In the Current Printer area, click Select. The Select Printer dialog box
    will appear (Figure 22).

    +   3. Click the Printer Create/Edit button. The Printer Create/Edit dialog box
    will open (Figure 23).

    +   4. Click Add. The Add Printer Driver dialog box will appear (Figure 24).

    +   5. Use the Available Printer Drivers list box to select the printer you want
    to use.

    +   6. Click OK. The Create Printer dialog box will open with a suggested name
    for that printer in the text box (Figure 25).

    +   7. Click OK. The Create Printer and Add Printer Driver dialog boxes will close,
    returning you to the Printer Create/Edit dialog box. The new printer you selected
    will appear in the Printer Driver list box (Figure 26).

    +   8. If "None" is displayed in the Destination Column of your new printer:

    +      A. Click Setup. The Printer Setup dialog box will open (Figure 27).

    +      B. Click Destination. The Select Destination dialog box will appear (Figure
    28).

    +      C. Click Ip to select the local printer.


    Figure 24. Use the Available Printer Drivers list box to select the printer you
    want to add.


    Figure 25. Click OK to close the Create Printer dialog box.


    Figure 26. The printer you added appears in the list box.


    Figure 27. In the Printer Setup dialog box, click the Destination button.


    (continued)'
  merge: -1
  img_proc: true
