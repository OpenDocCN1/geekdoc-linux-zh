- pgno: 164
  md: '# The Application Bar


    Figure 35. Choose Toolbars from the View menu to open the Toolbars dialog box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_164_0.png)


    The Application Bar is displayed at the bottom of the document window (Figure
    34). It lets you quickly see information related to the document on which you
    are working. By default, the Application Bar shows the font you are using, the
    position of the insertion point, information about columns, mergers, or tables,
    if you are using any of these features, and whether you are in insert or typeover
    mode.


    You can show or hide the Application Bar as you please and customize the information
    it displays, as well.


    # To show/hide the Application Bar:


    +   1. Choose Toolbars from the View menu (Figure 35). The Toolbars dialog box
    will appear (Figure 36).


    +   2. To show the Application Bar, select the check box next to Application Bar
    in the Available toolbars list box. To hide the Application Bar, deselect the
    Application Bar item.


    +   3. Click OK. The Application Bar will appear or disappear.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_164_1.png)


    Figure 36. Select or deselect Application Bar depending upon whether you want
    to show or hide it.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_164_2.png)


    Figure 37. Choose Preferences in the program window.'
