- pgno: 56
  md: '# To export a document:


    +   1. Create the document you want to export.

    +   2. Choose Save As from the File menu (Figure 43). The Save As dialog box will
    open (Figure 44).

    +   3. Use the Directory List to move to the directory where you want to save
    the file.

    +   4. Type a name for the file in the Filename/Current Selection text box.

    +   5. Use the File Format drop-down list in the Save Options area to select the
    file type that you would like to save the file as (Figure 45).

    +   6. Click OK to close the dialog box and save the document in the new file
    format.


    # Tip


    If you save a file that is password protected to another file format, the password
    is removed.


    # Some File Extensions You May See


    File extensions are the three letters that come after the period in a file name.
    These file extensions, which work with the Linux magic file, tell the computer
    what kind of file it is and how to interpret it.


    WordPerfect uses several file extensions:


    +   • .wpd—this is the native WordPerfect file extension that will automatically
    be attached to your documents when you save them.

    +   • .ltr—you can save a document with this file extension to indicate a letter.

    +   • .wpt—an ExpressDocs template.


    Figure 43. Choose Save As from the File menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_56_0.png)


    Figure 44. Move to the directory where you want to export the document and enter
    a name for the file in the Filename/Current Selection text box.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_56_1.png)


    Figure 45. Scroll down the File Format drop-down list to find the file format
    you want to use to export the document.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_56_2.png)'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Chapter 3


