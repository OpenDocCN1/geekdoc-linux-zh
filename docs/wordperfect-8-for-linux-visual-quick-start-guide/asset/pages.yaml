- pgno: 124
  md: '# Creating Charts


    The WP Draw program that is connected to WordPerfect 8 lets you quickly and easily
    create a variety of 2D and 3D charts, including pie, bar, line, area, scatter,
    and hi-lo.


    When creating a chart, WP Draw operates in a special chart mode, splitting its
    drawing window in two (Figure 52). At the upper part of the window is a datasheet,
    a spreadsheet where you can enter the data that you want to display on the chart.
    The lower part of the drawing window displays a preview of the chart being created.
    You can''t enter data in the preview area, only in the datasheet. To the left
    of the WP Draw window is a Graph Toolbox that gives quick access to chart types.
    If you pass the mouse over a button on the Graph Toolbar, a description of what
    the button does appears in the WP Draw title bar.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_124_0.png)


    Figure 52. The WP Draw program works in a special chart mode to help you quickly
    create professional charts.'
  merge: -1
  img_proc: true
