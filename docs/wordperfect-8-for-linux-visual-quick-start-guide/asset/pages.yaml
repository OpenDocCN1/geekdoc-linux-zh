- pgno: 176
  md: "# Spell-As-You-Go\n\nAs you type, Spell-As-You-Go automatically checks your\
    \ words, looking for any misspellings. If Spell-As-You-Go finds a word that it\
    \ thinks is incorrect or is not included in the WordPerfect dictionary, diagonal\
    \ red stripes appear beneath the word.\n\n# To turn on Spell-As-You-Go:\n\nChoose\
    \ Spell-As-You-Go from the Proofread fly-out on the Tools menu (Figure 12). When\
    \ Spell-As-You-Go is on, a tiny diamond appears to the left of the menu item.\n\
    \n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_176_0.png)\n\n**Figure 13.** Choose\
    \ Off from the Proofread fly-out on the Tools menu to turn Spell-As-You-Go off.\n\
    \n# ✓ Tips\n\n+   - Spell-As-You-Go and Grammar-As-You-Go cannot be turned on\
    \ at the same time.\n+   - To turn Spell-As-You-Go off, choose Off from the Proofread\
    \ fly-out on the Tools menu (Figure 13).\n\n# To correct possible misspellings:\n\
    \n+   1. Position the mouse pointer over the word underscored with red diagonal\
    \ stripes and click the right mouse button. The Spell-As-You-Go menu will open,\
    \ showing a list of possible alternative words (Figure 14).\n+   \n+   2. Choose\
    \ the correct spelling from the list.\n+   \n+   *or*\n+   \n+   If you know the\
    \ word is spelled correctly, this means that it is not in the WordPerfect dictionary.\
    \ Choose Add to enter the word into the dictionary or Skip in Document to have\
    \ the speller ignore the word for the rest of the document.\n\nThe Spell-As-You-Go\
    \ menu will disappear and the word’s spelling will be corrected.\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_176_1.png)\n\
    \n**Figure 14.** Choose the correctly spelled word from the Spell-As-You-Go menu,\
    \ or if you know the word is spelled correctly but isn't in the WordPerfect dictionary,\
    \ click Add to enter the word to the dictionary, or click Skip in Document to\
    \ pass over future occurrences of the word."
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Spell Check


    You can spell check an entire document at once using WordPerfect''s Spell Check
    feature.


    # To spell check a document:


    +   1. Open the document you want to spell check.


    +   2. Choose Spell Check from the Tools menu (Figure 15) or press Ctrl+F1 on
    the keyboard. The Spell Checker dialog box will open (Figure 16) and several things
    will happen:


    +   The first word the Spell Checker finds wrong will be underlined.


    +   The misspelled word will appear next to Not found in the Spell Checker dialog
    box.


    +   The Spell Checker''s first suggested replacement will appear in the Replace
    With text box.


    +   A list of other possible spellings or words will appear in the Suggestions
    list box.


    +   3. You can:


    +   Click Replace to substitute the misspelled word with the word in the Replace
    With text box.


    +   Highlight one of the words in the Suggestions list box, then click Replace.


    +   Click Skip Once or Skip Always to pass over the word this one time or for
    the entire document.


    +   Click Add to add the word next to Not found to the WordPerfect dictionary.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_177_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_177_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_177_2.png)'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Figure 18. Open the Check menu, then choose the part of your document you would
    like spell checked—all the way from the entire document down to one word.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_178_0.png)


    +   - Click Suggest to see additional words or phrases in the Suggestions list
    box.

    +   - Click Close to stop checking spelling before the Spell Checker has run through
    the entire document.


    4. When the Spell Checker has gone through the entire document, a Spell Checker
    dialog box will appear telling you that the spell check is finished (Figure 17).


    5. Click Yes to close the Spell Checker.


    # Tips


    +   - To spell check a part of your document, position the insertion marker in
    the text you want to spell check (for instance, inside the word, sentence, or
    paragraph), then choose the part that you want to check from the Check menu in
    the Spell Checker dialog box (Figure 18).


    +   - You can turn off spell checking for various options such as words with numbers,
    duplicate words, and irregular capitalization. To do so, choose the Options menu
    in the Spell Checker dialog box and deselect the items you don’t want spell checked
    (Figure 19).


    +   - If you write in several languages, you can spell check those languages by
    choosing Settings from the Language fly-out on the Tools menu (Figure 20). The
    Language dialog box will open (Figure 21). From the list box, choose the language
    you want to spell check, then click OK. Spell check your document following the
    steps outlined on these two pages.


    Figure 19. Open the Options menu, then choose which items you don’t want spell
    checked.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_178_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_178_2.png)


    Figure 20. Choose Settings from the Tools menu.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Grammar-As-You-Go


    Grammar-As-You-Go checks your sentences for grammar mistakes as you type. A word
    or phrase that is possibly incorrect is underlined with diagonal blue stripes.


    # To turn Grammar-As-You-Go on or off:


    Choose Grammar-As-You-Go from the Proofread fly-out on the Tools menu (Figure
    22). When Grammar-As-You-Go is on, a tiny diamond appears to the left of the menu
    item.


    # Tips


    +   - Grammar-As-You-Go and Spell-As-You-Go cannot be turned on at the same time.

    +   - To turn Grammar-As-You-Go off, choose Off from the Proofread fly-out on
    the Tools menu (Figure 13).


    # To correct possible grammar mistakes:


    +   1. Position the mouse pointer over the word or phrase underscored with blue
    diagonal stripes and click the right mouse button. The Grammar-As-You-Go menu
    will open, showing a list of possible alternatives (Figure 23).

    +   2. Choose the correct word or phrase from the list.

    +      or

    +      Choose Ignore to pass over the possible grammar error.

    +      The Grammar-As-You-Go menu will disappear and the word or phrase will change
    depending upon what you selected.


    Figure 21. Select the language you would like to spell check, then click OK.


    Figure 22. Choose Grammar-As-You-Go from the Proofread fly-out on the Tools menu.


    Figure 23. Choose the suggestion from the Grammar-As-You-Go menu or choose Ignore
    to skip over the possible grammar error.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_179_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_179_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_179_2.png)'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Grammatik


    You can proofread an entire document at one time using WordPerfect''s Grammatik
    feature.


    # To proofread a document:


    +   1. Open the document you want to proofread.


    +   2. Choose Grammatik from the Tools menu (Figure 24). The Grammatik dialog
    box will appear (Figure 25) and the first error Grammatik finds will be underlined
    in your document.


    +   3. Choose Writing Style from the Options menu (Figure 26). The Writing Style
    dialog box will open (Figure 27).


    +   4. Select a style from the Writing Style list box.


    +   5. In the Formality Level area, select the radio button that best describes
    how formal your document is—standard, formal, or informal.


    +   6. Click OK. The Writing Style dialog box will close, returning you to the
    Grammatik dialog box (Figure 25). With the first possible grammar or spelling
    error that Grammatik has found, the dialog box will display several things:


    +   Rule Class, near the top of the dialog box, displays what type of error is
    underlined, such as spelling, capitalization, correct use of speech, passive voice,
    or clichés.


    +   Advice Box explains the possible writing error and how it can be fixed.


    +   Replacement Box shows a list of possible corrections.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_180_0.png)


    Figure 24. Choose Grammatik from the Tools menu.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_180_1.png)


    Figure 25. The Grammatik dialog box offers advice on how to fix possible grammar
    errors.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_180_2.png)


    Figure 26. Choose Writing Style from the Options menu to open the Writing Style
    dialog box.


    (continued)'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# 7.


    You can click:


    +   - Replace or substitute the incorrect word or phrase with the one that is
    highlighted in the Replacement box.

    +   - Skip to pass over the possible error and move to the next one.

    +   - Next Sentence to ignore any other errors in the current sentence and move
    to the next sentence.

    +   - Ignore Word/Phrase to pass over that specific word or phrase for the rest
    of the document.

    +   - Add to enter the word or phrase in Grammatik.

    +   - Close to stop grammar checking before Grammatik has run through the entire
    document.


    # 8.


    When the grammar check is finished Grammatik will open a dialog box asking if
    you want to close Grammatik (Figure 28).


    # 9.


    Click Yes to close Grammatik and return to your document.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_181_0.png)


    Figure 27. Select the writing style you are using from the list box, then select
    one of the formality level radio buttons.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_181_1.png)


    Figure 28. When Grammatik has finished checking your document, it will tell you
    so. Click Yes to close the grammar checker.


    # Summary


    In this chapter you learned how to:


    +   - Automatically replace misspelled words or abbreviations as you type using
    QuickCorrect

    +   - Insert SmartQuotes in place of straight quotation marks

    +   - Set up automatic formatting using the Format-As-You-Go feature


    +   - Correct misspelled words on-the-fly using Spell-As-You-Go

    +   - Spell check a document

    +   - Check your grammar as you type using Grammar-As-You-Go

    +   - Proofread an entire document using Grammatik'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# ADDING TABLES


    Tables are used to present information in an organized way. They are made up of
    rows and columns of cells which let you position information accurately (Figure
    1). Cells can contain text and images. If you create a table and discover that
    you need to add or delete cells or change cell size, WordPerfect makes it easy
    to customize an existing table.


    You can format text inside cells just like any other text. Using the Property
    Bar, you can set the font, font size, font style, and alignment—left, right, center,
    or full justification. In fact, if you’ve created a special text style for the
    table, you can use that, too.


    WordPerfect’s table feature even lets you insert functions that you would normally
    see in a spreadsheet program, such as automatically adding up the sums of selected
    columns or incrementing a numerical pattern.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_182_0.png)


    | Cells | Caption | Column |

    |---|---|---|

    | Today''s Desserts |  |  |

    | Cakes | German Chocolate |  |

    |  | Gingerbread | $3.50 |  |

    |  | Lemon |  |  |

    |  | Chocolate Chip |  |  |

    | Cookies | Lemon Snappers | 25¢ each |  |

    |  | Oatmeal Raisin |  |  |

    |  | Chocolate |  |  |

    | Ice Cream | Strawberry | $1.00 |  |

    |  | Vanilla |  |  |'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# To create a table:


    +   1. Position the insertion point where you would like the table to appear.

    +   2. On the WordPerfect 8 Toolbar, position the mouse pointer over the Table
    button and press the left mouse button. A tiny grid will appear (Figure 2).

    +   3. Drag the mouse pointer down and to the right to highlight the number of
    rows and columns on the grid.

    +   4. Release the left mouse button. The table will appear in your document with
    the insertion point blinking in the first cell (Figure 3).


    or


    +   1. Position the insertion point where you would like the table to appear.

    +   2. Choose Table from the Insert menu (Figure 4) or press F12 on the keyboard.
    The Create Table dialog box will open (Figure 5).

    +   3. In the Create area, select the Table radio button.

    +   4. In the Table Size area, use the Columns and Rows text boxes to set how
    many columns and rows your table will contain.

    +   5. Click OK. The Create Table dialog box will close and the table will appear
    in your document with the insertion point blinking in the first cell (Figure 3).


    Figure 2. Drag the mouse down and to the right to highlight the number of rows
    and columns you need.


    Figure 3. The table appears in the document with the insertion point positioned
    in the first cell.


    Figure 4. Choose Table from the Insert menu.


    Figure 5. Select the Table option in the Create area, then enter the number of
    rows and columns in the text boxes in the Table Size area.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# To add text to a table:


    Position the insertion point within a cell and type your text. The cell will automatically
    expand to accommodate the text.


    # Tips


    +   - You can quickly move from one cell to the next in a table by pressing the
    Tab key or using the arrow keys on the keyboard.

    +   - To quickly add another row to a table, position the insertion marker in
    the lower-right cell and press the Tab key.

    +   - To insert a tab in a cell to indent text, hold down the Ctrl key, then press
    the Tab key.


    # To insert an image into a table:


    +   1. Position the insertion point in the cell where you want to add the image.

    +   2. Choose From File from the Graphics fly-out on the Insert menu (Figure 6).
    The Insert Image dialog box will open (Figure 7).

    +   3. Use the Directory List and File List boxes to select an image file.

    +   4. Click Insert. The image will appear in the table (Figure 8).


    # Tip


    +   - For more information about inserting images in your documents, turn to pages
    99–100.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_184_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_184_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_184_2.png)'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Selecting Table Elements


    Being able to select a cell, row, column, or table can be a little tricky until
    you discover just how to do it.


    # To select a cell:


    +   1. Move the mouse pointer towards the top of the cell you want to select.
    The mouse pointer will change to an upwards facing arrow (Figure 9).

    +   2. Click. The cell will be selected (Figure 10).


    # To select a column:


    +   1. Move the mouse pointer towards the top of the upper cell you want to select.
    The mouse pointer will change to an upwards facing arrow (Figure 9).

    +   2. Press the left mouse button and drag down to select the column (Figure
    11).


    # To select a row:


    +   1. Move the mouse pointer towards the top of the leftmost cell you want to
    select. The mouse pointer will change to an upwards facing arrow (Figure 9).

    +   2. Press the left mouse button and drag right to select the row (Figure 12).


    # To select a table:


    +   1. Move the mouse pointer towards the top of the first cell in the table.
    The mouse pointer will change to an upwards facing arrow (Figure 9).

    +   2. Press the mouse button and drag diagonally down to the right to select
    the entire table (Figure 13).


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_185_0.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_185_1.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_185_2.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_185_3.png)


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_185_4.png)'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Changing the Table''s Shape


    Many times the information displayed in a table expands as the table is created.
    New columns or rows could be needed or the information is difficult to fit in
    the standard table setup and cells need to be split or joined. In fact, if you
    need to, you can even split an entire table.


    # To add rows or columns to a table:


    +   1. Position the insertion point in the column or row next to the place where
    you want to add the columns or rows.

    +   2. Click the Table menu on the Property Bar and choose Insert (Figure 14).

    +      or

    +      Right click on the table and choose Insert from the QuickMenu (Figure 15).

    +      The Insert Columns/Rows dialog box will open (Figure 16).

    +   3. In the Insert area, select either the Columns or Rows radio button, then
    in the appropriate text box enter the number of columns or rows you would like
    to insert.

    +   4. In the Placement area, select a radio button to set whether the rows or
    columns will appear before or after the row or column where the insertion point
    is located.

    +   5. Click OK. The Insert Columns/Rows dialog box will close and the new columns
    or rows will be added to the table (Figure 17).


    # Tip


    When you''re working in the Insert Columns/Rows dialog box, the current size of
    your table is displayed in the Table Size area.


    Figure 14. Choose Insert from the Table menu on the Property Bar.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_186_0.png)


    Figure 15. Right click on the table and choose Insert from the QuickMenu.


