  md: '# To install WordPerfect:


    +   1. Create a directory where you want to install WordPerfect (Figure 3). Often
    this directory is created under the /usr directory.


    +   2. Click the Terminal emulation program button on the Gnome Panel (Figure
    4). A Terminal window will open (Figure 5).


    +   3. Change to the directory where the CD-ROM is mounted (Figure 6). This is
    the same pathname shown in the User Mount Tool dialog box (Figure 2). In Figure
    5 the command cd /mnt/cdrom has been typed to change directories.


    +   4. Press Enter on the keyboard.


