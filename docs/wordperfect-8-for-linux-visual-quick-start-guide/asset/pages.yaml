- pgno: 198
  md: '# MERGING AND SORTING


    Can you imagine typing 500 personalized form letters and envelopes? That would
    be a most onerous task indeed! Thankfully, WordPerfect’s Merge command takes the
    burden out of such a task. All you need to do is type out one form letter and
    then use the Merge command to create personalized letters for everyone on your
    list.


    In order to perform a merge, two types of files need to be created:


    +   - A data file—all the names and addresses of the people you are sending the
    letter to; and

    +   - A form file—this is the actual form letter.


    After the data file and form file are completed, the merge is performed, generating
    a third document containing the 500 merged, personalized form letters. You can
    then print the form letters.


    But, merging is not limited to form letters! Any type of document that uses repeated
    information—such as reports, contracts, mailing labels, telephone lists, and envelopes—can
    be merged.


    This chapter will take you through the merge process, from creating the data file
    to creating the form file, then on to performing the actual merge. From there,
    you’ll discover how to create an envelope merge (you’ve got to send those letters
    out somehow!). Then, you’ll learn how to perform a simple alphabetical or numerical
    sort on a document. Finally, you’ll find out how to perform a simple sort. This
    can be handy if you have a large data file that you want to sort in a particular
    way—perhaps by zip code or telephone number.'
  merge: -1
  img_proc: true
- pgno: 199
  md: "# Creating the Data File\n\nA data file contains the information—such as names,\
    \ addresses, and telephone numbers—that is merged into a form file.\n\nData files\
    \ can be created in either text or table format. Information in a data text file\
    \ is arranged into fields and records. The fields and records in a data table\
    \ file are arranged into columns (fields) and rows (records).\n\nA field is the\
    \ individual piece of information such as a person's name. Another field could\
    \ be that same person's address. A third field could be that person's telephone\
    \ number. If you are missing the information that would go into a field for a\
    \ particular person, you can leave the field blank. Fields can be as small as\
    \ one character or several lines long.\n\nA record is a group of related fields,\
    \ such as the information about a person, including her name, address, and telephone\
    \ number.\n\n# To create the data file:\n\n+   1. Choose Merge from the Tools\
    \ menu (Figure 1) or press Shift+F9 on the keyboard. The Merge dialog box will\
    \ open (Figure 2).\n+   2. In the Data File area:\n+      Click Data to create\
    \ a data text file.\n+      or\n+      Select the box next to Place Records in\
    \ a Table, then click Data to create a data table file.\n+   \n+   The Create\
    \ Merge File dialog box will open (Figure 3). (The Create Merge File dialog box\
    \ will not appear if you have a new document open in the document window. If this\
    \ is the case, the Create Data File dialog box (Figure 4) and the Merge Toolbar\
    \ (Figure 5) will appear. Skip to step 5.)\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_199_0.png)\n\
    \n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_199_1.png)\n\n![](img/02dde5e0b11c4f9add393f2d6c89d9a5_199_2.png)"
  merge: -1
  img_proc: true
