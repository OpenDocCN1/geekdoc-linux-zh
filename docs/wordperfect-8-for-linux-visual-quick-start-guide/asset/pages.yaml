  md: '# To add a caption to a text box:


    +   1. Click on white space to make sure nothing is selected in your document.

    +   2. Right click on the text box and choose Caption from the QuickMenu that
    appears (Figure 62). The Box Caption dialog box will open (Figure 63).

    +   3. In the Caption Position area (Figure 64), use the:

    +      - Side of Box drop-down list to set where the caption will appear—top,
    bottom, left, or right.

    +      - Border drop-down list to set whether the caption will appear outside,
    on, or in the border.

    +      - Position drop-down list to left, center, or right justify the caption.

    +   4. In the Caption Width area (Figure 65), select one of the following options:

    +      - Auto Width sets the caption to the width of the text box.

    +      - Fixed lets you set exactly how wide the caption is.

    +      - Percent lets you set how wide the caption is in relation to the text
    box. A 50% setting means that the caption will be half the width of the text box.

    +   5. In the Rotate Caption area you can select whether the text is not rotated,
    or is rotated 90, 180, or 270 degrees.

    +   6. When you are finished selecting options, click Edit. The Box Caption dialog
    box will close, and the insertion point will be positioned in the new caption
    area.

    +   7. To enter a caption, type your text.

    +   8. When you are finished, click outside the caption to return to the document.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_148_0.png)


    Figure 63. The Box Caption text box is used to set the caption''s position, width,
    and text rotation.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_148_1.png)


    Figure 64. In the Caption Position area, set on which side of the text box the
    caption appears, whether it''s inside, outside, or on the text box border, and
    whether it is left, center, or right justified.


    ![](img/02dde5e0b11c4f9add393f2d6c89d9a5_148_2.png)


    Figure 65. In the Caption Width area, you can set whether the caption is as wide
    as the text box, an exact measurement, or a percentage of the text box width.'
