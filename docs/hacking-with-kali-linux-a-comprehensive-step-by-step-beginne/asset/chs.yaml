- "# Kali Linux 黑客：学习计算机黑客、无线网络、网络安全和渗透测试的全面分步式道德黑客初学者指南\n\n\n\n\n\n\n\n\n\n\n\n\n\
  # 引言\n\n感谢你花时间阅读我的关于使用 Kali Linux 进行道德黑客攻击的指南。无疑，它是渗透测试和其他形式的道德黑客攻击最强大、最受欢迎的平台，它是多年持续演变和完善的结果。\n\
  \n它从初就不是像某些人认为的那样，仅仅是黑客工具的集合。相反，它是为安全爱好者、专业渗透测试人员以及像你这样的道德黑客初学者提供的最灵活的框架之一。它是可定制的，而且是的，它确实包含许多非常有用的工具，其中一些我们将在本书中使用。\n\
  \n我本书的目标是让你在道德黑客方面建立坚实的基础，为此，我不仅将向你概述道德黑客攻击以及不同类型的黑客，还将向你展示如何在 `VMWare` 上安装 Kali\
  \ Linux，并逐步引导你完成一些你可以做的道德黑客实践。\n\n我想帮助你理解关于道德黑客所需的所有知识，以及如何通过这种方式来保护自己的系统；发现计算机系统和网络中漏洞的最佳方法就是进入它，然后修复你发现的问题。这可以让你免受那些利用你系统中任何漏洞的非道德黑客的侵害。\n\
  \n本书专为初学者编写，包含了实践示例来帮助你进步；理论永远不足以学习如何以道德的方式进行黑客攻击，有时你必须亲身实践，而这正是我们要做的。\n\n所以，如果你准备好开始你的新旅程，让我们进入\
  \ Kali Linux 的世界吧。\n\n如果你喜欢这本书，请访问[我在亚马逊的作者主页](https://www.amazon.com/Peter-Bradley/e/B07L8M5F2Z/ref=sr_ntt_srch_lnk_1?qid=1550135738&sr=1-1)\
  \ 并考虑留留评论。我非常感谢你为我的作品写评论所投入的时间精力。\n\n# 第一部分：黑客攻击基础与 Kali Linux 的使用\n\n## 道德黑客攻击的简史\n\
  \n我们第一次听到“道德黑客”这个短语是在 1995 年，当时 IBM 的副总裁 John Patrick 使用了它，但这个概念比那要老老得多。有人声称绝大多数黑客的目标都是成为道德黑客，但目前看起来似乎并非如此，因为新闻中充斥着重大黑客丑闻的故事，这完全难怪所有黑客都被一律染成了仅仅是罪犯分子。为了更好地了解真相，我们需要回到过去。\n\
  \n### 黑客的起源\n\n当我们从历史角度讨论道德黑客攻击时，我们实际上是在讨论广义的黑客行为。黑客并不总是被认为是坏事，这个词的现代背景实际上源于 `MIT`（马省理工学院）。\n\
  \n在 20 世纪 60 年代，工程学生常用该术来描述几种系统优化和机器优化方法，以提高它们的效率。黑客行为仅仅是一种爱好，由一些极其聪明的人所做，而道德黑客的概念比犯罪黑客的概念要早得多。\n\
  \n### 虎队队（Tiger Teams）与电话侠（Phreakers）\n\n直到 70 年代，情况才开始变得有些阴暗。随着计算机计算机的普及，理解计算机编程和系统语言的人数也之增加，他们开始发现测试系统看看它们能做什么具有潜在益处。\n\
  \n就在这段时间，我们开始听到“电话侠”（phreakers），这些人是能够操纵电信系统并真正理解电话网络本质的人。他们利用可以模拟拨号音的设备来路由电话——这让他们有机会免费拨打电话，特别是非常昂贵的长途电话。可以说，电话侠被认为是第一批非法黑客。\n\
  \n然而，与此同时，公司和政府部门开始看到，拥有专家来发现系统中的漏洞是多有益的，从而防止诸如电话破解之类的活动发生。这些团队被称为“虎队”（tiger teams），美国政府充分利用了他们来加固自己的防御系统。\n\
  \n### 黑帽黑客的崛起\n\n在 20 世纪 80 年代和 90 年代，我们开始听到“黑客”一词，几乎仅用于犯罪活动。个人电脑现在已是一项非常受欢迎的工具，不仅是对个人，也对企业如此，这意味着计算机程序中存储了大量的个人和敏感数据。黑客可以看到偷取这些数据并将其用于欺诈行为或将其卖给其他不道德的人的潜力。\n\
  \n我们开始在媒体中看到一个建立起来的形象，一个关于黑客行为的负面形象，即黑客仅仅是偷取数据并利用他们所学到的技能勒索公司交出大量资金的罪犯。我们称这些人为黑帽黑客，即只想利用自己的技能进行恶意活动的人。黑帽是我们在媒体上听得最多的，最近发生了一些针对全球最大公司（如\
  \ `Sony` 和 `Amazon`）的极高知名攻击。\n\n### 现代网络犯罪分子更加老练\n\n每天估计有 30,000 网站被入侵，这足以向你展示现代黑客攻击是多么广泛。其中一些黑客非常缺乏经验，使用其他黑客编写的工具，而对自己的所做没有真正的理解；而另一些人在攻击中极其老练，不断寻找获取他们想要的东西。\n\
  \n我们还倾向于认为黑客是那种整天待在黑暗房间里敲击电脑的人。对某些人可能是这样，但还有其他方法，从密码破解到社会工程，即一个人被欺骗提供敏感信息或个人细节。\n\
  \n### 道德黑客的再生\n\n\n\n\n随着时间的推移，黑客无疑变得越来越聪明，而且他们也更加执着，这意味着企业和政府部门不得不建立起自己的防御来试图阻止他们。这就是为什么道德黑客（Ethical\
  \ hacking）概念正被越来越多地用于应对这些企业所面临的问题。\n\n道德黑客现在已是最常见的黑客形式之一，你可以成为一名认证的道德黑客，也被称为白帽黑客（whit\
  \ hat hacker）。白帽使用的技术与黑帽完全相同，但他们行此是为了发现系统中的漏洞并修复它们，或者告诉相关公司以便他们进行修复。\n\n世界上许多顶尖的白帽黑客都是从黑帽起家的。以凯文·波尔尔森（Kevin\
  \ Poulson）为例，他为了参加电台的一项比赛入侵了电话线路，最终赢得了保时捷 944 S2 的大奖。他因犯罪入过监狱，但现在已转变为白帽黑客，并且是一名备受尊敬的记者。\n\
  \n## 道德黑客技术\n\n为了妥善工作，道德黑客需要在高度保密的状态下工作。这意味着他们通常由管理层直接雇佣，其他员工和 IT 安全团队对他们的雇佣情况一无所知。这使他们能够像黑帽黑客一样工作，并将使用几种不同的技术尝试入侵系统。第一个是渗透测试，随后是社会工程学和密码破解。在本指南中，我们将介绍其中的许多内容。\n\
  \n## 黑、白还是灰？\n\n正如你在上一章中所学到的，我们不能把所有黑客都一律打上黑帽的标签。黑客可以是任何人，而不仅仅是罪犯，他们利用对硬件和软件的知识来突破计算机、网络或设备上的安全措施。黑客行为本身并不违法，除非黑客在没有所有者明确许可的情况下访问系统，而且许多企业会雇佣黑客来帮助维护安全。\n\
  \n通常，我们通过比喻的帽子颜色来分类黑客——白、灰或黑——这个术实际上可以追溯到老西部片片——好人戴白帽，而坏人戴黑帽。让我们每种颜色代表什么：\n\n###\
  \ 黑帽\n\n黑帽黑客和所有黑客一样，在破坏计算机系统和网络以及绕过安全措施方面拥有大量知识。黑帽也是编写恶意软件和病毒的黑客类型。\n\n他们的动机通常是为了财务或个人利益，范围从只是尝试传播病毒或恶意软件的完全初学者，到可以进入、窃取数据并在不被察觉的情况下离开的专业黑客。黑帽黑客不仅偷取数据；他们还可能破坏或更改数据以达到其他目的。\n\
  \n### 白帽\n\n白帽黑客拥有相同水平的经验和知识，但他们选择将这些用于善良而非邪恶的目的。这些人就是我们说的道德黑客，他们通常被公司雇佣或聘请来寻找其系统中的漏洞。\n\
  \n他们使用与黑帽黑客完全相同的方法，但在他们那里，这是在系统所有者许可的情况下进行的。这使得这种行为变得合法。他们将执行渗透测试、漏洞评估，并测试已有的安全系统。你可以参加培训课程并获得认证来成为认证的道德黑客。\n\
  \n### 灰帽\n\n生活中没有什么是绝对非黑即白的；总是存在灰色地带，黑客也是如此。灰帽黑客是黑白帽黑客的混合体；他们会在没有所有者许可的情况下进入系统，试图寻找漏洞，并可能会向所有者报告这些问题，通常会要求修复费用。如果没有得到回应，他们甚至可能采取将发现的内容发布到互联网上让所有人看到的步骤。\n\
  \n灰帽黑客并没有真正的恶意；他们只是想为自己的发现获得报酬。大多数人不会宣传他们发现的任何漏洞，也不会为了自己的利益而利用它们。然而，由于他们没有访问系统的许可，这仍然被认为是一种非法的黑客行为。\n\
  \n“黑客”一词在大多数人心中仍引起负面想法，但理解不同类型黑客之间的区别非常重要。如果没有白帽黑客发现并修复漏洞和威胁，黑帽就会肆无忌忌。事实上，尽管我们听了很多报道，但黑帽黑客只是少数。\n\
  \n## 你应该学习的黑客术语\n\n在你的旅途中，你会遇到许多黑客术语，以下是最需要学习的。稍我会为你提供一份完整的黑客术语表：\n\n- **网络钓鱼 (Phishing)**：钓鱼是一种入侵在线账户（如电子邮件、社交媒体等）的方法。创建一个看起来像官方登录页面的虚假页面，当你打开它时，看起来和应该的一样。检查\
  \ URL——大多数真实网站都有 SSL 加密并以 HTTPS（而不是 `http`）开头。\n- **标签劫持 (Tabnapping)**：如果你在浏览器中打开了多个标签页，你的账户可能会被破解。在此类攻击中，受害者会点击来自另一个网站的链接，例如，假设我通过信息发送了一个\
  \ Twitter 链接给你。你点击该链接，同时你的浏览器中还打开了其他几个标签页，黑客将 Twitter 页面替换为虚假页面。你会认为账户已注销；当你重新登录时，你的账户详情会被转发给黑客。\n\
  - **桌面钓鱼 (Desktop Phishing)**：这是一种更高级的钓鱼形式，与第一方法类似，但不是将 URL 替换为虚假，而是你的电脑会受到影响。当你尝试打开发送给你的链接时，会打开一个虚假页面，但\
  \ URL 保持原样，这使得通过肉眼很难检测。如果你使用的是正浏览器，它应该能检测到这种钓鱼方法并警告你。\n- **软件键盘记录器 (Software Keylogger)**：这是一种软件，会记录你键盘上的每一次按键并将其发送回黑客。他们可以确定你的在线账户详情并将其用于自己的目的。\n\
  - **硬件键盘记录器 (Hardware Keylogger)**：这是一种硬件设备，必须连接到计算机才能记录按键。最常用的是记录信用卡详情。\n- **暴力破解攻击\
  \ (Brute Force Attack)**：暴力破解攻击用于破解密码，尽管这是一种非常耗时的方法，而且对于那些使用常用密码的人效果更好。黑客必须猜测密码并不断输入他们的猜测。\n\
  - **字典列表攻击 (Wordlist Attack)**：与暴力破解类似，但黑客必须先生成一个单词列表并将其保存到用于黑客的软件中。然后应用这些单词，直到找到正确的组合。\n\
  - **加密 (Encryption)**：这描述了数据和密码如何存储，即以加密格式存储，以便黑客无法轻易读取。\n- **勒索软件 (Ransomware)**：勒索软件是黑客使用的代码程序，用于加密整个硬盘并进行勒索，即向你要钱以释放数据。\n\
  - **IP 地址 (IP Address)**：IP 是 Internet Protocol（网协议）的缩写，IP 地址是与你的设备相关的地址。它可以是私有\
  \ IP 或公共 IP。\n- **VPN**：VPN 或虚拟专用网络是一种我们在网上隐藏身份并更改计算机访问互联网时使用的 IP 地址的方法。\n- **Web\
  \ 服务器 (Web Server)**：Web 服务器基本上是一台计算机，当访问网站时，网站文件存储其中并从中检索。\n\n\n\n\n-   DoS 攻击\
  \ - 这意味着拒绝服务（Denial of Service），这种攻击通常用于关闭网站并使其无法访问。它是通过向网站发送伪造流量使其远超过带宽限制导致服务器崩溃的。防火墙是防御\
  \ `DoS` 攻击的最佳形式。\n-   DDoS 攻击 - 这意味着分布式拒绝服务攻击。在 `DoS` 攻击中只有一个设备，而在 `DDoS` 攻击中有多个虚假设备。防火墙可以生效，但必须是特定类型的防火墙，例如\
  \ `Cloudflare CDN`。\n-   SQL 注入 - SQL 注入攻击用于将查询语句注入网站数据库，从而破解存储在其中的的细节和数据。\n-  \
  \ 社会工程学 - 这种攻击是指欺骗人员提供其账户详情或其他敏感信息。\n\n# 如何安装 Kali Linux\n\n有多种方法可以在你的电脑上安装 Kali\
  \ Linux；我将向你展示的方法是将其在一个名为 `VMWare` 的虚拟机管理器中安装。它支持所有主流操作系统，并用于将物理服务器划分为若干个虚拟机。\n\n\
  ### 第一步\n访问 [`kali.org/downloads/`](http://kali.org/downloads/) 并将 Kali 下载到你的电脑上。\n\
  \n## 第二步\n访问 [`www.vmware.com/`](https://www.vmware.com/) 并将 `VMWare` 下载到你的电脑上。\n\
  \n### 第三步\n所有下载完成后，打开 `VMWare` 并点击 `Create`（创建）创建一个新的虚拟机。弹出一个窗口，点击 `Installer Disc\
  \ Image File (ISO)`（安装盘映像文件），找到你下载 `Kali ISO` 文件的位置；点击该文件然后点击 `Next`（下一步）。\n\n###\
  \ 第四步\n命名你的虚拟机 - 为了方便演示，将其命名为 `Tutorial Kali` - 然后选择你想保存的位置。最佳选项是在“我的文档”中创建一个名为\
  \ `Virtual Machines` 的新文件夹。执行此操作然后点击 `Next`。\n\n### 第五步\n选择你为 `Kali` 设置的最小大小，至少设置为\
  \ `30 GB`，因为 `Kali` 会随着时间的推移而增大。输入数值并在 `Store Virtual Disk`（存储虚拟磁盘）处选择 `Single File`（单个文件）并点击\
  \ `Next`。\n\n### 第六步\n现在我们需要对硬件设置进行一些更改；点击 `Customize Hardware`（自定义硬件）按钮，将打开硬件窗口。转到左侧面板并选择\
  \ `Memory`（内存）；将滑块滑动到 `512 MB`（始终为虚拟机分配机器上安装内存的 `50%` 作为最大。例如，如果你有 `4 GB RAM`，滑块不应超过\
  \ `2 GB`）。\n\n接下来，点击 `Processors`（处理器）。你的回答取决于你的系统设置。如果你有多个处理器，请选择两个或更多；但如果你只有一个或两个处理器，请保持不变。\n\
  \n现在点击 `Network Adaptor`（网络适配器）并将点移动到顶部的选项，即 `Bridged`（桥接）。然后点击 `Configure Adaptors`（配置适配器）。取消勾选窗口中你网络适配器旁的所有复选框；点击\
  \ `OK`。\n\n最后，点击窗口底部的 `Close`（关闭），并在安装向导中点击 `Finish`（完成）。\n\n### 第七步\n你新创建的虚拟机文件现在将位于虚拟机库，你现在需要的是打开\
  \ `Kali` 并进行安装。转到新虚拟机文件的位置并点击它；在右侧面板中，点击 `Play Virtual Machine`（播放虚拟机）。`Kali` 将启动。\n\
  \n###八步\n使用键盘方向键在启动菜单中导航到 `Graphical Install`（图形化安装），然后按 `Enter` 键。\n\n在下一个屏幕上，选择你的语言并点击\
  \ `Continue`（继续）。\n\n选择你的位置并点击 `Continue`。\n\n现在你需要选择你的标准键盘；如果你使用的是美式英语键盘，只需点击 `Continue`。\n\
  \n等待片刻，因为 `kali` 需要检测你所有的电脑硬件；如果在此过程中出现屏幕，只需点击 `Continue` 然后勾选 `Do Not Configure\
  \ This Network`（不配置此网络）框。\n\n当 `Kali` 完成后，你会被要求输入一个 `hostname`（主机名），只需一个计算机名。输入任何你想要的内容或保留为\
  \ `Kali`，随你决定。然后点击 `Continue`。\n\n接下来，为 `root` 账户输入密码，并确保你记得它。如果你忘记了，你必须从头开始，重新安装\
  \ `Kali`。确认密码并点击 `Continue`。\n\n选择你的时区并点击 `Continue`。\n\n现在你需要再次等待，因为 `Kali` 需要检测磁盘上的分区。在下一步中，点击\
  \ `Guided - Use Entire Disk`（引导 - 使用整个磁盘）然后点击 `Continue`。\n\n当安装程序要求你确认分区选择时，点击\
  \ `Continue`。\n\n你现在会收到最后一个关于分区的问题；点击 `All Files In One Partition`（所有文件在一个分区中）然后点击\
  \ `Continue`。\n\n点击 `Finish Partitioning`（完成分区）以确认所有内容并将更改写入磁盘。然后你可以点击 `Continue`。\n\
  \n点击 `Yes` 确认这些更改是正确的，最后一次点击 `Continue` `Kali` 将开始安装。你现在需要耐心，因为 `Kali` 的安装可能需要 `30\
  \ minutes` 或更长时间。在安装期间请勿触碰电脑。\n\n### 第九步\n当 `Kali` 安装完成后将弹出一个窗口询问 `Network Mirrors`（网络镜像）；点击\
  \ `No` 然后点击 `Continue`。\n\n等待几分钟后，系统会询问你是否安装 `GRUB` 启动加载程序；点击 `Yes` 然后点击 `Continue`。\n\
  \n`Kali` 将完成安装，你会看到一条通知消息；点击 `Continue` `Kali` 将重启。\n\n使用你之前在此过程中创建的凭据登录。\n\n你好！如果你觉得这个主题或信息有用，如果能在\
  \ [Amazon.](https://www.amazon.com/dp/B07NSRW9FZ) 上留一个快速评论，将非常有帮助。非常感谢！\n\n# Kali\
  \ 工具\n\n`Kali` 成为安全专业人员和黑客热门选择的主要原因之一是它提供了巨大的免费工具集。目前有超过 `300 个工具`，包括漏洞评估、被动信息收集、网络分析、密码破解、破解无线网络以及一套非常强大的漏洞利用工具。这些是最流行的工具，也是你最可能开始使用的工具：\n\
  \n### Metasploit Framework\n这是目前最流行的利用平台之一，它有许多用于分析和渗透测试的有用工具。它有多种用户界面选项，用户可以使用这些工具攻击任何操作系统。\n\
  \n### Armitage\n`Kali` 中还包含了 `Armitage`，这是一个图形化管理平台，用于帮助用户在攻击期间组织多个 `Metasploit`\
  \ 工具之间的交互和操作。\n\n### Wireshark\n`Wireshark` 是一个非常流行的网络流量分析工具。它可以在多个平台上运行，并且实时工作。特定网络节点上的所有流量将被捕获，然后拆分为数据包元数据。这包括标头、负载和路由信息。`Wireshark`\
  \ 用于检测和分析网络安全事件，并找出网络为何以及何时故障的原因。\n\n### John the Ripper\n这是所有密码破解工具中最传奇的之一，充满了攻击密码的算法。它最初仅为\
  \ `Unix` 编写，但现在可以在多个主要平台上运行。大家使用它的核心功能是让它能够自动检测 `hash` 类型的密码加密。该工具还有一个商业版本，功能强大得多，但\
  \ `Kali` 上的免费版对大多数人来说足够了。\n\n### Nmap\n`Nmap` 是 `Network Mapper` 的缩写，是用于渗透测试的最常见黑客工具之一。该工具允许用户扫描网络并查找连接到网络的所有网络服务和主机。它随后提供一个关于网络结构及其所有成员的高度详细的地图。同时，它还会告诉你每个主机安装的操作系统以及开放的端口，允许用户快速发现已知漏洞。\n\
  \n### Aircrack-ng\n\n\n\n\n\n`Aircrack-ng` 是渗透测试和无线分析的首选包。它专注于三个主要的 Wi-Fi 协议 - WEP（有线等效隐私）、WPA（无线网络保护访问）以及\
  \ WPA2-PSK。该工具提供了数据包注入、无线数据包嗅探、加密密码破解和无线网络分析功能，并且支持监听模式（monitor mode）功能的网络接口硬件。\n\
  \n# BurpSuite\n\nBurpSuite 是一套专注于 Web 应用攻击的完整工具包。这些程序将相互协作，测试应用程序是否存在任何漏洞并启动攻击。\n\
  \n这并不是 Kali 中包含工具的完整列表，但这些是最重要的工具，代表了 Kali 在计算机安全（特别是渗透测试）方面的强大力量和灵活性。\n\n我们对黑客基础知识和\
  \ Kali 的介绍到此结束；在下一节中，我们将深入研究道德黑客，并提供一些示例供您亲自尝试。\n\n# 第二部分：道德黑客流程\n\n和每一个良好的流程一样，道德黑客也有一系列阶段，这些阶段对于黑客遵循至关重要，以确保他们的道德攻击结构合理。\n\
  \n主要有六个阶段：\n\n* **侦察 (Reconnaissance)** - 这是初始信息收集阶段。攻击者将通过主动或被动方法寻找有关目标的信息。在此阶段最常用的工具是\
  \ `Nmap`、`Google Dorks`、`Maltego` 和 `Hping`。\n* **扫描 (Scanning)** - 下一阶段涉及攻击者开始探测目标（网络或计算机），寻找他们可以利用的漏洞。通常使用的工具有\
  \ `Nmap`、`Nexpose` 和 `Nessus`。\n* **获取访问 (Gaining Access)** - 在这一步中，发现漏洞后攻击者尝试利用它来获取系统的访问。`Metasploit`\
  \ 是主要的工具。\n* **维持访问 (Maintaining Access)** - 攻击者已进入系统并安装了几个后门，以便他们可以随时、随地地进出系统。同样，`Metasploit`\
  \ 是首选工具。\n* **清除痕迹 (Clearing the Tracks)** - 这部分是不道德的，因为它涉及删除黑客过程中发生的所有活动日志。\n*\
  \ **报告 (Reporting)** - 在道德黑客中，这是最后阶段。攻击者将编写一份报告，详细说明他们发现了什么以及做了什么，包括使用的所有工具、是否成功、发现了哪些漏洞以及利用它们的过程。\n\
  \n第一阶段侦察，是一套完整的用于发现和收集特定目标信息的技巧和流程。该阶段分为七个步骤，黑客将遵循所有步骤以尽可能地学习信息：\n\n1. 收集信息\n2.\
  \ 确定网络范围\n3. 识别活动机器\n4. 发现接入点和开放端口\n5. 操作系统指纹识别\n6. 发现端口上的服务\n7. 映射网络\n\n侦察分为两个部分——主动和被动。\n\
  \n### 主动\n主动侦察涉及与目标系统直接交互，以获取尽可能的信息。然而，如果你没有访问该系统的权限，就会面临被发现的风险；如果发生这种情况，系统管理员可以采取严肃行动并跟踪你的活动，追踪你所的一切。\n\
  \n### 被动\n被动侦察不涉及与系统直接连接，用于在不与目标交互的情况下收集信息。\n\n### 足迹 (Footprinting)\n\n这可以是主动的也可以是被动的。被动足迹的一个示例是查看公司网站。如果你尝试使用社会工程学获取敏感数据，那就是主动足迹。\n\
  \n这是收集最多信息的最开始部分。攻击者正在寻找进入系统的方法，或者至少确定什么样的攻击最合适。在此部分收集的信息通常是：\n\n* 域名\n* IP 地址\n\
  * 命名空间\n* 关于员工的信息\n* 电话号码\n* 电子邮件地址\n* 关于不同工作的信息\n\n接下来，我们将查看如何提取这些信息。对于任何连接到网的网络或系统，这些都是基础信息且易于找到的。\n\
  \n#### 域名信息\n\n使用 [`http://www.whois.com/whois](http://www.whois.com/whois)` 来查找域名相关信息。你可以查询所有者是谁、注册商、注册日期、过期时间、名称服务器、所有者的联系信息等。\n\
  \n提示 - 为了保护你的域名信息免受潜在黑客的侵害，请将你的域名资料设置为私有而非公开。\n\n#### 查找 IP 地址\n\n要查找 IP 地址信息，打开命令提示符并使用\
  \ `ping` 命令：\n\n```\n$ping (网站/公司名称)\n```\n\n你应该能看到类似下面的内容：\n\n```\nPING website\
  \ address (55.123.45.678) 68 (96).\n72 bytes from 55.123.45.678: icmp_seq = 1 ttl\
  \ = 72 time = 0.028 ms\n72 bytes from 55.123.45.678: icmp_seq = 2 ttl = 72 time\
  \ = 0.021 ms\n72 bytes from 55.123.45.678: icmp_seq = 3 ttl = 72 time = 0.021 ms\n\
  72 bytes from 55.123.45.678: icmp_seq = 4 ttl = 72 time = 0.021 ms\n```\n\n####\
  \ 查找托管公司\n\n当你获得网站地址后，可以进一步使用一个名为 `ip2location.com` 的网站来查找托管公司是谁。\n\n提示 - 如果你的网络或系统直接连接到互联网，没有办法隐藏你的\
  \ IP。如果你在服务器上存储了敏感信息，该服务器应该锁定在安全的代理之后。这将防止黑客获取有关你服务器的精确细节。覆盖你的 IP 及其随之信息的另一个好方法是使用\
  \ `VPN` 或虚拟专用网络。如果配置得当，你所有的流量将通过它传输。\n\n#### IP 地址范围\n\n较小的网站通常只有一个 IP 地址，而较大的网站可能有多个，每个服务不同的域名和子域名。如果你访问美国互联网注册局（简称\
  \ `ARIN`），你可以获取与特定公司相关的 IP 地址范围。\n\n#### 网站历史\n\n通过 [`www.archive.org/](http://www.archive.org/)，你可以获取任何网站的历史。只需在搜索框中输入域名即可获取特定时间的网站信息。\n\
  \n提示 - 将网站存储在存档数据库中确实有一些好处，但如果你不希望任何人看到信息或网站如何各个阶段，你可以要求 `archive.org` 删除你的网站历史。\n\
  \n#### 指纹识别 (Fingerprinting)\n\n操作系统指纹是指用于确定远程计算机安装了什么操作系统的方法。可以是主动或被动指纹：\n\n* **主动指纹**\
  \ - 通过向目标机器发送特制数据包并记录返回的内容来实现。对返回的信息进行分析以判断操作系统。\n* **被动指纹** - 使用来自远程计算机系统的嗅探追踪（traces）。`Wireshark`\
  \ 是此类用途的工具之一，返回的追踪可以告诉你远程主机使用的操作系统。\n\n要确定操作系统，需要查看四个元素：\n\n* `TTL` - 生存时间 - 操作系统在输出数据包上设置的值\n\
  * `Window Size` - 窗口大小 - 操作系统设置的窗口大小\n* `DF` - 不分片 - 操作系统设置的 DF 位\n* `TOS` - 服务类型\
  \ - 操作系统是否设置了此项以及设置为何。\n\n\n\n\n你可以分析这些数据包特征来判断是否能推出操作系统，但这不是一个完全准确的系统，它在某些系统上的效果会比其他系统更好。\n\
  \n觉得这个标题有趣或有用吗？那么在 [Amazon](https://www.amazon.com/dp/B07NSRW9FZ) 上留个评价我们将不胜感激！\n\
