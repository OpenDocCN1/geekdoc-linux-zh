    # 威胁

    - 威胁（Threat）是指系统内部（特别是信息系统）存在潜在危险的。威胁的一个典型例子是黑客代理，甚至是对公司怀有恨意的员工。恶意软件可能包含间谍软件和病毒，这些程序会让计算机网络陷入瘫痪。


    你可能认为你的无线网络是完全安全的，没有任何异常发生，但机会总会存在，也总会有黑客来利用这些机会。无线网络中最大的风险包括：


    *   被盗的密码

    *   某些对从服务器传输的所有文件具有完全访问权限的人

    *   允许黑客进入网络的后门

    *   被截获的电子邮件

    *   服务攻击拒绝，导致严重的停机和生产力损失

    *   违反有关企业隐私和财务报告的国际、联邦和/或州法律

    *   垃圾邮件

    *   僵尸（Zombies）——这些是进入你的系统并利用该网络来攻击另一个网络的黑客


    最大的问题是无线网络具有便携性，它们可以在任何地方运行工作，这意味着你完全不知道攻击可能来自哪里；它可能是咖啡馆里坐在你旁边的人，也可能是你的邻居。在没有合适工具的情况下，阻止攻击几乎是不可能的。


    ## 了解敌人

    无线网络漏洞并不一定是致命缺陷。最大的问题是那些愿意花时间和投入精力来利用这些弱点的不道德黑客。他们的目标是让你的生活变得困难，并从中从中获取利益。这就是古话所说“要抓小偷，你必须像小偷一样思考”的道理——如果你想保护自己的系统，你就需要像不道德的黑客那样思考。


    如果你的系统不需要多少努力就能进入，那么对于黑客来说，它比锁得紧的系统更好的目标。他们倾向于寻找访问点较少的组织，这有几个充分的理由：


    *   访问点不多的系统极有可能保留了默认设置，这使得黑客攻击变得容易得多

    *   小型组织可能没有时间或管理员来监控操作运行

    *   较小的网络不太可能具备高水平的控制或检查，例如 `WPA`、`WPA2` 或 `WID`（无线入侵检测系统）。这些是任何黑客的要要访问点。


    然而，并非只有小型网络是脆弱的。所有规模的网络都可能受到攻击，而且黑客还可以利用其他漏洞，例如：


    *   并非所有组织都有足够的时间或网络管理员来监控网络的恶意行为

    *   无线网络是有线网络的延伸；无论访问点在何处，后面都可能有一个有线网络

    *   进出流量是最大的弱点之一；在较大的网络中，黑客破解 `WEP` 加密密钥要容易得多——流量越大意味着发送到服务器的数据包越多，这意味着黑客可以捕获并分析更多数据包。反之，这加快了破解
    `WEP` 加密所需的时间。

    *   `SSIDs`（服务集标识符）通常被设置为易识别的，如公司名称、特定部门或某人的名字。这为黑客提供了确定先从哪里攻击所需的信息。


    ## 理解无线网络的复杂性

    安装并启用防火墙、创建非常强的密码、甚至为访问控制设置复杂的配置，都不足以保持始终受到保护。除了我们已经讨论的标准和漏洞外，你还需要理解实现完全安全的最大障碍是网络的复杂性。


    `IEEE 802.11` 协议从未被开发为完美的系统，将来永远不会，因为它们本身还有一些非常大的问题需要解决。与有线以太网系统不同，无线网络不仅仅允许你点击按钮来发送或接收信息；它们比使用简单的射频发送和接收数据包要复杂得多：


    *   它们加密数据以确保其私密性

    *   负责认证的客户端必须确保只有授权的人员才能访问

    *   它们必须设置定时消息数据包，以确保一切正确同步，且数据传输没有冲突

    *   它们必须检查所有数据的完整性，以确保没有数据被污染


    在所有这些之上，`802.11` 协议的网络设计意味着更多的复杂性：


    *   确保无线设备保持更新，这意味着移动设备、笔记本电脑、台式电脑、智能电视以及任何通过无线网络连接的设备

    *   确定需要哪些天线以及它们需要放置在何处

    *   了解哪些设备允许在网络上，哪些不应该在那里

    *   调整信号功率设置以防止频率泄漏到授权区域之外


    所有这些不同的复杂性提供的弱点比传统有线网络见过的要多。


    ## 保护分析

    我们将很快进入实践阶段，但在你保护系统之前，你必须能够对其进行检查。在黑入这些漏洞之前，你需要了解漏洞在哪里，你检查的结果将告诉你需要的所有信息，特别是这些漏洞有多大以及是否可以被修复。你可以采取以下应对措施来处理发现的任何漏洞：


    *   非技术攻击——用于利用人类的弱点，如疏忽、缺乏意识、过度信任等。

    *   网络攻击——可能包括安装伪造无线访问点以及试图说服网络客户端连接到恶意接入点的技巧。

    *   软件攻击——安全问题是无休止的，这包括安装在无线网络系统上的所有应用程序、软件以及操作系统。


    最后一种是非常常见的攻击方法，软件攻击可能包括：


    *   破解 `WEP` 加密密钥

    *   利用薄弱的认证进入无线网络

    *   使用默认密码进入网络（其中默认密码未被更改），并获取用于访问的 `SSIDs`


    ## 破解 Wi-Fi 网络 - 实践指南

    `Kali Linux` 是一个多功能工具，可以用于许多不同的事情，但它最因破解 Wi-Fi 网络或进行渗透测试而闻名。世界上有成百上千种不同的工具声称能做到——不要被骗了。如果你想正规地这样做，请使用
    `Kali`。你看到大多数广告工具很可能是诈骗；它们由黑客发布，目的是让你进入他们可以入侵你系统的局面。破解 Wi-Fi 网络的唯一真实方法是使用 `Kali
    Linux`、配备了监听模式（Monitor Mode）的网卡以及名为 `aircrack-ng` 的工具或类似的工具——我们将使用 `aircrack-ng`。


    你还需要意识到，即使使用正确的工具，这不是一个游戏，黑客（即使是伦理黑客）也不是可以戏弄的事情。你至少需要对 `WPA` 认证的工作原理有一个基本的了解，对
    `Kali` 及其工具的工作有一定的了解。


    你需要：


    *   `Kali Linux`

    *   一个可以注入和监控代码的 Wi-Fi 适配器。某些系统标准配备了此功能，但如果没有，你需要购买另一个

    *   一个用于密码破解的字典文件——`Kali` 中内置了一些

