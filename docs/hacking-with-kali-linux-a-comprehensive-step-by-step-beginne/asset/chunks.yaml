    # Introduction


    Thank you for taking the time to read my guide on ethical hacking with Kali Linux.
    It is, without a doubt, the most powerful platform and the most popular for penetration
    testing and other forms of ethical hacking and is the result of many years of
    continuous evolution and refinement.


    It was never built to be just a collection of hacking tools, as some believe it
    to have been. Instead, it is one of the most flexible frameworks available for
    the security enthusiast, the professional penetration tester, and for the beginner
    in ethical hacking, like you. It is customizable and, yes, it does contain a great
    many useful tools, some of which we will be using throughout this book.


    The objective of my book is to give you a thorough grounding in ethical hacking
    and, to that end, not only will I be giving you an overview of ethical hacking
    and the different types of hackers, I’ll be showing you how to install Kali Linux
    on `VMWare` and walking you through, step by step, some of the ethical hacking
    practices that you can do.


    I want help you understand all you need to know about ethical hacking and how
    to protect your own system by doing it; the best way to find the vulnerabilities
    in your computer system and network is to hack into it and then fix what you find.
    That keeps you safe from the not-so-ethical hackers that will take advantage of
    any vulnerability in your system.


    This book has been written for beginners and contains practical examples to help
    you on your way; theory is never enough to learn how to hack in an ethical way,
    sometimes you have to get down and dirty too and that’s what we’re going to be
    doing.


    So, if you are ready to start your new journey, let’s dive into Kali Linux.


    If you enjoyed this title, please visit [my author profile in Amazon](https://www.amazon.com/Peter-Bradley/e/B07L8M5F2Z/ref=sr_ntt_srch_lnk_1?qid=1550135738&sr=1-1)
    and consider leaving a review. I truly appreciate the time and effort that you
    will be putting in leaving a review for my title.


    # Part One: The Basics of Hacking and Using Kali Linux


    ## A Brief History of Ethical Hacking


    We first heard the phrase, “ethical hacking”, back in 1995 when it was used by
    John Patrick, the Vice President of IBM but the concept is much older than that.
    There are those that claim the vast majority of hackers aim to be ethical hackers
    but, right now, that doesn’t seem to be the case with the news full of stories
    of major hacking scandals and it really isn’t any wonder that all hackers are
    tarred with the same brush of being nothing more than criminals. To gain a better
    understanding of the truth, we need to go back in time.


    ### The Hacker’s Origins


    When we talk about ethical hacking in terms of history, what we are really taking
    about is general hacking. It wasn’t always considered bad to be a hacker and the
    modern context of the word actually came from `MIT`, the Massachusetts Institute
    of Technology.


    During the 1960s, the term was commonly used by students of engineering to describe
    several methods of system optimization and machine optimization to make them more
    efficient. Hacking was nothing more than a kind of hobby, done by some incredibly
    bright people and the idea of an ethical hacker comes way before the idea of the
    criminal hacker.


    ### Tiger Teams and Phreakers


    It wasn’t until the 1970s that things began to get a bit darker. As computers
    grew in popularity, so did the number of people of understood computer programming
    and systems languages and they were starting to see that there were potential
    benefits to testing systems to see what they could do.


    It was about this time that we started to hear of ‘phreakers’, people who could
    manipulate the telecommunication systems, and who could truly understand the nature
    of the telephone networks. They would make use of devices that could mimic a dialing
    tone for the purpose of routing phone calls - this gave them the opportunity to
    make their own phone calls free of charge, particularly the long distance calls
    that were very expensive. It could be argued that phreakers were considered to
    be the first illegal hackers.


    However, at the same time, companies and government departments were starting
    to see how beneficial it could be to have experts in place who could find weaknesses
    in their systems, thus stopping activities like phreaking from happening. These
    were called thetiger teams teams and the US government made good use of them for
    the purpose of shoring up their defense systems.


    ### The Black Hat Hacker Rises Up


    During the 1980s and the 1990s, we began to hear the term, “hacker”, used pretty
    much only with criminal activity. The personal computer was now a very popular
    tool, not just for individuals but for businesses too and that meant there were
    large amounts of personal and sensitive data being stored within computer programs.
    The hackers could see the potentials in stealing that data and using it for fraudulent
    behavior or selling it one to other unscrupulous persons.


    We began to see a profile building up in the media, a negative profile of hacking
    where hackers were nothing more than criminals who were stealing data and blackmailing
    companies into parting with a lot of money, just by using skills they had learned.
    We call these black hat hackers, people who only want to use their skills for
    malicious activities. Black hats are the ones we hear about the most in the media
    and recent years have seen some very high-profile attacks on the biggest companies
    in the world, like `Sony` and `Amazon`.


    ### The Modern Cybercriminal is More Sophisticated


    Every day, an estimated 30,000 + websites are hacked into, which just shows you
    how widespread modern hacking is. Some of those hackers are very inexperienced,
    using tools that other hackers write and not having any real understanding of
    what they are doing while others are incredibly sophisticated in their attacks,
    constantly looking for ways to get what they want.


    We also tend to think of a hacker as someone who spends all day in a darkened
    room tapping away at their computer. That may be the case for some but there are
    other methods in use, form password cracking to social engineering, where a person
    is duped into passing on sensitive information or personal details.


    ### The Regeneration of the Ethical Hacker

