    # 引言


    感谢你花时间阅读我的关于使用 Kali Linux 进行道德黑客攻击的指南。无疑，它是渗透测试和其他形式的道德黑客攻击最强大、最受欢迎的平台，它是多年持续演变和完善的结果。


    它从初就不是像某些人认为的那样，仅仅是黑客工具的集合。相反，它是为安全爱好者、专业渗透测试人员以及像你这样的道德黑客初学者提供的最灵活的框架之一。它是可定制的，而且是的，它确实包含许多非常有用的工具，其中一些我们将在本书中使用。


    我本书的目标是让你在道德黑客方面建立坚实的基础，为此，我不仅将向你概述道德黑客攻击以及不同类型的黑客，还将向你展示如何在 `VMWare` 上安装 Kali
    Linux，并逐步引导你完成一些你可以做的道德黑客实践。


    我想帮助你理解关于道德黑客所需的所有知识，以及如何通过这种方式来保护自己的系统；发现计算机系统和网络中漏洞的最佳方法就是进入它，然后修复你发现的问题。这可以让你免受那些利用你系统中任何漏洞的非道德黑客的侵害。


    本书专为初学者编写，包含了实践示例来帮助你进步；理论永远不足以学习如何以道德的方式进行黑客攻击，有时你必须亲身实践，而这正是我们要做的。


    所以，如果你准备好开始你的新旅程，让我们进入 Kali Linux 的世界吧。


    如果你喜欢这本书，请访问[我在亚马逊的作者主页](https://www.amazon.com/Peter-Bradley/e/B07L8M5F2Z/ref=sr_ntt_srch_lnk_1?qid=1550135738&sr=1-1)
    并考虑留留评论。我非常感谢你为我的作品写评论所投入的时间精力。


    # 第一部分：黑客攻击基础与 Kali Linux 的使用


    ## 道德黑客攻击的简史


    我们第一次听到“道德黑客”这个短语是在 1995 年，当时 IBM 的副总裁 John Patrick 使用了它，但这个概念比那要老老得多。有人声称绝大多数黑客的目标都是成为道德黑客，但目前看起来似乎并非如此，因为新闻中充斥着重大黑客丑闻的故事，这完全难怪所有黑客都被一律染成了仅仅是罪犯分子。为了更好地了解真相，我们需要回到过去。


    ### 黑客的起源


    当我们从历史角度讨论道德黑客攻击时，我们实际上是在讨论广义的黑客行为。黑客并不总是被认为是坏事，这个词的现代背景实际上源于 `MIT`（马省理工学院）。


    在 20 世纪 60 年代，工程学生常用该术来描述几种系统优化和机器优化方法，以提高它们的效率。黑客行为仅仅是一种爱好，由一些极其聪明的人所做，而道德黑客的概念比犯罪黑客的概念要早得多。


    ### 虎队队（Tiger Teams）与电话侠（Phreakers）


    直到 70 年代，情况才开始变得有些阴暗。随着计算机计算机的普及，理解计算机编程和系统语言的人数也之增加，他们开始发现测试系统看看它们能做什么具有潜在益处。


    就在这段时间，我们开始听到“电话侠”（phreakers），这些人是能够操纵电信系统并真正理解电话网络本质的人。他们利用可以模拟拨号音的设备来路由电话——这让他们有机会免费拨打电话，特别是非常昂贵的长途电话。可以说，电话侠被认为是第一批非法黑客。


    然而，与此同时，公司和政府部门开始看到，拥有专家来发现系统中的漏洞是多有益的，从而防止诸如电话破解之类的活动发生。这些团队被称为“虎队”（tiger teams），美国政府充分利用了他们来加固自己的防御系统。


    ### 黑帽黑客的崛起


    在 20 世纪 80 年代和 90 年代，我们开始听到“黑客”一词，几乎仅用于犯罪活动。个人电脑现在已是一项非常受欢迎的工具，不仅是对个人，也对企业如此，这意味着计算机程序中存储了大量的个人和敏感数据。黑客可以看到偷取这些数据并将其用于欺诈行为或将其卖给其他不道德的人的潜力。


    我们开始在媒体中看到一个建立起来的形象，一个关于黑客行为的负面形象，即黑客仅仅是偷取数据并利用他们所学到的技能勒索公司交出大量资金的罪犯。我们称这些人为黑帽黑客，即只想利用自己的技能进行恶意活动的人。黑帽是我们在媒体上听得最多的，最近发生了一些针对全球最大公司（如
    `Sony` 和 `Amazon`）的极高知名攻击。


    ### 现代网络犯罪分子更加老练


    每天估计有 30,000 网站被入侵，这足以向你展示现代黑客攻击是多么广泛。其中一些黑客非常缺乏经验，使用其他黑客编写的工具，而对自己的所做没有真正的理解；而另一些人在攻击中极其老练，不断寻找获取他们想要的东西。


    我们还倾向于认为黑客是那种整天待在黑暗房间里敲击电脑的人。对某些人可能是这样，但还有其他方法，从密码破解到社会工程，即一个人被欺骗提供敏感信息或个人细节。


    ### 道德黑客的再生


