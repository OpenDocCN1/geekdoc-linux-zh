    The built-in wordlists can be found in the directory called `/usr/share/wordlists`
    and they are all compressed using Gzip. The most popular one is “rockyou” and
    here’s how you extract it:


    1. Open the terminal window and change the directory to the one `rockyou` is located
    in. Do this by typing `cd /usr/share/wordlists` at the prompt.

    2. To see the `rockyou` file, type `ls` at the prompt.

    3. Next type `gunzip rockyou.txt.gz` to extract the file

    4. Type `ls` again and the extraction will be done.


    If you have all of this and you have time and not a small amount of patience on
    your side, then let’s see just how secure your Wi-Fi network is.


    ### Important

    If you hack into a wireless network without the express permission of the owner,
    it is an illegal and criminal act. This tutorial is purely to test your own network
    and router to see how secure it really is.


    ### Step One - open Kali Linux and log in as the root user

    ### Step Two - connect your wireless injection/monitor-capable adaptor if your
    native card has no support. If you are using VMware to run Kali you may have to
    use the icon in the device menu to connect the adaptor.

    ### Step Three - Disconnect your system from all wireless networks it is connected
    to and open a terminal window. At the prompt, type `airmon-ng`.


    This will show you a list of all the wireless adaptors that have support for Monitor
    mode only, not injection. If you don’t see any cards listed, disconnect the adapter
    and reconnect it. If you are using a built-in adaptor and nothing is listed, your
    card does NOT have support for Monitor mode and you will need to purchase one.
    If your card does appear, it should be listed as something like `wlan0`


    ### Step Four - At the prompt, type in `airmon-ng` and then name of your wireless
    card, i.e. `wlan0`. If you see a message that says Monitor Mode Enabled, it means
    the card has been placed into monitor mode successfully. Note that the new monitor
    interface has a name, something like `mon0`.


    **Note** - a recent bug in Kali caused `airmon-ng` to set a fixed `-1` value for
    the channel when `mon0` is first enabled. If this happens to you or you would
    rather not risk it happening, after `mon0` is enabled, follow these steps:


    * At the prompt type in `ipconfig` followed by the card interface and then type
    “down”; hit the enter key. The card interface name will be the one that `mon0`
    was enabled on. The card will be disconnected from the internet so it can focus
    solely on monitor mode. Later, you will need to re-enable your wireless interface
    name, `wlan0` or whatever it was called. You do this by typing `ipconfig (name
    of the card) Up` and then press enter. You will need to do this after the wireless
    part of the guide is finished.


    ### Step Five - at the prompt type in `airodump-ng` and the name of the monitor
    interface (`mon0` or whatever yours is called). If you get the fixed channel `-1`
    error, see above.


    ### Step Six - you will now see a list of the current wireless networks in the
    area, along with some good information about each of them. Find your network among
    them - the list will be constantly populating so look carefully and, when you
    see it press `CTRL+C` on the keyboard and the list will stop. Note down the channel
    associated with the network.


    ### Step Seven - Write down or copy the BSSID for the target and then type in
    `airodump-ng -c (channel number) -bssid (bssid number) - /root/Desktop/(monitor
    interface)`. Ensure everything in brackets is completed with the information that
    you have and, where it says “desktop”, input the location you will be saving it
    to. “-w” and the file path command are specifying the location that `airodump`
    will save any 4-way handshakes it intercepts - you need these for cracking passwords.
    Save it where you will find it again. Afterward, press the enter key. An example
    of a proper command would look like this:


    ```

    airodump-ng -c 11 -bssid 01:21:BF:E0:E8:D5 -w /root/Desktop/mon0

    ```


    `airodump` is now going to monitor the network target that you selected, and ONLY
    that network, so that we can get some more specific and useful information. What
    is happening is that we’re waiting for another device to connect to that network
    so that the router is forced into sending the 4-way handshake that we require
    to crack the password. You should also see four separate files appear on your
    desktop - do NOT delete this; the handshake is saved to them when it is captured!


    ### Step Eight - We’re not going to wait because we are impatient hackers (like
    many) so we’ll use another tool that comes from the aircrack suite. The tool is
    called `aireplay-ng` and it will speed things up for us. Hackers use `aireplay-ng`
    to force devices to connect and they do that by sending `deauth` (deauthentication)
    packets to a network device and this makes it believe it has to reconnect.


    For this to work, you would need another device already connected to the network
    so keep an eye on `airodump-ng`; you are looking for a client to appear and it
    could be in seconds or hours. If you don’t see any after a long wait, either the
    network is empty or you are not close enough to the network.


    ### Step Nine - As soon as a client appears, open another terminal - leave `airodump`
    to run. In the second terminal, type in this command - `aireplay-ng -0 2 -a(router
    bssid) -c (client bssid) mon0`.


    - `-o` is a short way to enable deauth mode and `2` is how many packets are going
    to be sent. The `-a` is indicating the access point bssid, router bssid needs
    to be the target network BSSID and client bssid needs to be that of the connected
    client and you will find this under `STATION`. `Mon0` is the monitor interface
    so, if yours is different, type the correct name in.


    ### Step Ten - Hit the Enter key and `aireplay-ng` will send those two packets.
    If you are near enough to the target and the process works, you would see a message
    on the `airodump-ng` screen saying “WPA Handshake” followed by the BSSID of the
    target.


    This tells you the handshake has been successfully captured and, in one form or
    another, the password is now with the hacker. The `aireplay-ng` terminal can be
    closed and you press `CTRL+C` on the `airodump` terminal to cease monitoring -
    do NOT close it yet, you may need information off it later.


    If you don’t see the handshake message, something didn’t go as planned when the
    packets were sent. Lots of things can go awry - you might not be close enough,
    in which case, move nearer. The device the deauth packets are sent to might not
    have been set up to reconnect automatically; you would need to try a different
    device or you could just leave `airodump` running until a connection is made.


    You do need to be aware that, in spite of all your efforts, not every WPA network
    can be cracked like this.


    ### Step Eleven - That’s the wireless part done. From here on in, everything will
    happen between your computer and the four files. The most important of those files
    is called `.cap` so open a terminal and type in `aircrack-ng -a2 -b (router bssid)
    -w(path to the wordlist) /root/Desktop/*.cap`.


    Here, `-a` is the aircack method used for cracking the handshake, `-2` indicates
    the WPA method, `-b` is for bssid, router bssid should be replaced with the target,
    `-w` indicates wordlist and path to wordlist should be the path to the wordlist
    you downloaded. The last part is the file path to that `.cap` file with the password
    in it. Press the enter key.


    ### Step Twelve - Now `aircrack-ng` will begin the password cracking process.
    However, it can only crack a password if it is contained in your wordlist. If
    not you will need to download another one - there are plenty on the internet -
    and keep trying until its found. If you can’t crack that password at all then
    the test fails and your network is safe from any basic brute-force attempt.

