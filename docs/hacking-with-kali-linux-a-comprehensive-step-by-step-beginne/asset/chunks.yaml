    随着时间的推移，黑客无疑变得越来越聪明，而且他们也更加执着，这意味着企业和政府部门不得不建立起自己的防御来试图阻止他们。这就是为什么道德黑客（Ethical
    hacking）概念正被越来越多地用于应对这些企业所面临的问题。


    道德黑客现在已是最常见的黑客形式之一，你可以成为一名认证的道德黑客，也被称为白帽黑客（whit hat hacker）。白帽使用的技术与黑帽完全相同，但他们行此是为了发现系统中的漏洞并修复它们，或者告诉相关公司以便他们进行修复。


    世界上许多顶尖的白帽黑客都是从黑帽起家的。以凯文·波尔尔森（Kevin Poulson）为例，他为了参加电台的一项比赛入侵了电话线路，最终赢得了保时捷 944
    S2 的大奖。他因犯罪入过监狱，但现在已转变为白帽黑客，并且是一名备受尊敬的记者。


    ## 道德黑客技术


    为了妥善工作，道德黑客需要在高度保密的状态下工作。这意味着他们通常由管理层直接雇佣，其他员工和 IT 安全团队对他们的雇佣情况一无所知。这使他们能够像黑帽黑客一样工作，并将使用几种不同的技术尝试入侵系统。第一个是渗透测试，随后是社会工程学和密码破解。在本指南中，我们将介绍其中的许多内容。


    ## 黑、白还是灰？


    正如你在上一章中所学到的，我们不能把所有黑客都一律打上黑帽的标签。黑客可以是任何人，而不仅仅是罪犯，他们利用对硬件和软件的知识来突破计算机、网络或设备上的安全措施。黑客行为本身并不违法，除非黑客在没有所有者明确许可的情况下访问系统，而且许多企业会雇佣黑客来帮助维护安全。


    通常，我们通过比喻的帽子颜色来分类黑客——白、灰或黑——这个术实际上可以追溯到老西部片片——好人戴白帽，而坏人戴黑帽。让我们每种颜色代表什么：


    ### 黑帽


    黑帽黑客和所有黑客一样，在破坏计算机系统和网络以及绕过安全措施方面拥有大量知识。黑帽也是编写恶意软件和病毒的黑客类型。


    他们的动机通常是为了财务或个人利益，范围从只是尝试传播病毒或恶意软件的完全初学者，到可以进入、窃取数据并在不被察觉的情况下离开的专业黑客。黑帽黑客不仅偷取数据；他们还可能破坏或更改数据以达到其他目的。


    ### 白帽


    白帽黑客拥有相同水平的经验和知识，但他们选择将这些用于善良而非邪恶的目的。这些人就是我们说的道德黑客，他们通常被公司雇佣或聘请来寻找其系统中的漏洞。


    他们使用与黑帽黑客完全相同的方法，但在他们那里，这是在系统所有者许可的情况下进行的。这使得这种行为变得合法。他们将执行渗透测试、漏洞评估，并测试已有的安全系统。你可以参加培训课程并获得认证来成为认证的道德黑客。


    ### 灰帽


    生活中没有什么是绝对非黑即白的；总是存在灰色地带，黑客也是如此。灰帽黑客是黑白帽黑客的混合体；他们会在没有所有者许可的情况下进入系统，试图寻找漏洞，并可能会向所有者报告这些问题，通常会要求修复费用。如果没有得到回应，他们甚至可能采取将发现的内容发布到互联网上让所有人看到的步骤。


    灰帽黑客并没有真正的恶意；他们只是想为自己的发现获得报酬。大多数人不会宣传他们发现的任何漏洞，也不会为了自己的利益而利用它们。然而，由于他们没有访问系统的许可，这仍然被认为是一种非法的黑客行为。


    “黑客”一词在大多数人心中仍引起负面想法，但理解不同类型黑客之间的区别非常重要。如果没有白帽黑客发现并修复漏洞和威胁，黑帽就会肆无忌忌。事实上，尽管我们听了很多报道，但黑帽黑客只是少数。


    ## 你应该学习的黑客术语


    在你的旅途中，你会遇到许多黑客术语，以下是最需要学习的。稍我会为你提供一份完整的黑客术语表：


    - **网络钓鱼 (Phishing)**：钓鱼是一种入侵在线账户（如电子邮件、社交媒体等）的方法。创建一个看起来像官方登录页面的虚假页面，当你打开它时，看起来和应该的一样。检查
    URL——大多数真实网站都有 SSL 加密并以 HTTPS（而不是 `http`）开头。

    - **标签劫持 (Tabnapping)**：如果你在浏览器中打开了多个标签页，你的账户可能会被破解。在此类攻击中，受害者会点击来自另一个网站的链接，例如，假设我通过信息发送了一个
    Twitter 链接给你。你点击该链接，同时你的浏览器中还打开了其他几个标签页，黑客将 Twitter 页面替换为虚假页面。你会认为账户已注销；当你重新登录时，你的账户详情会被转发给黑客。

    - **桌面钓鱼 (Desktop Phishing)**：这是一种更高级的钓鱼形式，与第一方法类似，但不是将 URL 替换为虚假，而是你的电脑会受到影响。当你尝试打开发送给你的链接时，会打开一个虚假页面，但
    URL 保持原样，这使得通过肉眼很难检测。如果你使用的是正浏览器，它应该能检测到这种钓鱼方法并警告你。

    - **软件键盘记录器 (Software Keylogger)**：这是一种软件，会记录你键盘上的每一次按键并将其发送回黑客。他们可以确定你的在线账户详情并将其用于自己的目的。

    - **硬件键盘记录器 (Hardware Keylogger)**：这是一种硬件设备，必须连接到计算机才能记录按键。最常用的是记录信用卡详情。

    - **暴力破解攻击 (Brute Force Attack)**：暴力破解攻击用于破解密码，尽管这是一种非常耗时的方法，而且对于那些使用常用密码的人效果更好。黑客必须猜测密码并不断输入他们的猜测。

    - **字典列表攻击 (Wordlist Attack)**：与暴力破解类似，但黑客必须先生成一个单词列表并将其保存到用于黑客的软件中。然后应用这些单词，直到找到正确的组合。

    - **加密 (Encryption)**：这描述了数据和密码如何存储，即以加密格式存储，以便黑客无法轻易读取。

    - **勒索软件 (Ransomware)**：勒索软件是黑客使用的代码程序，用于加密整个硬盘并进行勒索，即向你要钱以释放数据。

    - **IP 地址 (IP Address)**：IP 是 Internet Protocol（网协议）的缩写，IP 地址是与你的设备相关的地址。它可以是私有
    IP 或公共 IP。

    - **VPN**：VPN 或虚拟专用网络是一种我们在网上隐藏身份并更改计算机访问互联网时使用的 IP 地址的方法。

    - **Web 服务器 (Web Server)**：Web 服务器基本上是一台计算机，当访问网站时，网站文件存储其中并从中检索。

