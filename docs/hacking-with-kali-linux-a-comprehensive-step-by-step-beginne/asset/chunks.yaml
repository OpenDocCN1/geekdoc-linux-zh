    Sometimes known as pen-testing, this is a process of testing a system to see if
    there are any security flaws. Basically, a pen-tester will use the same methods
    as a black hat hacker to get into a system and see where the weak points. They
    will either fix them or report them to the owner of the system.


    ### PGP


    `PGP` stands for “pretty good privacy” and it is one method used for the encryption
    of data. It is usually used on emails and anyone who intercepts the data will
    see nothing more than garbled text. `PGP` makes use of asymmetric crypto;; this
    means that the sender scrambles the message using a public key and the recipient
    unscrambles it using a private key. Now more than 20 years old, this is still
    one of the strongest encryption methods, albeit a very difficult one to use.


    ### Phishing


    This is a kind of social engineering, not really hacking. The attacker will try
    to get certain information from a target, information they may use at a later
    date. They do this by pretending to be a customer support person from Facebook,
    Google or even the cell phone carrier the victim uses. They might ask that the
    target clicks a link in a message or an email (a malicious link) or that they
    send information like a password by email. Normally, the attacker will send thousands
    of emails out in the hopes of getting one or two responses but, on occasion, they
    are more targets, using an attack called spear phishing.


    ### Plaintext


    This is exactly what it says - plain text that has not been encrypted, much like
    what you are reading here, and is sometimes known as cleartext. Some companies
    who don’t have good security will store passwords and other sensitive data as
    plaintext, making it dead easy for a hacker to get in and steal it.


    ### Pwned


    This is jargon used by computer geeks in place of the verb “own”. For example,
    if a player beats another player in a video game, he would say that he “pwned”
    the other player. This means something quite similar in hacking terms but, rather
    than a video game, the hacker is gaining access to another person’s network or
    computer.


    ## R


    ### RAT


    This is an acronym for Remote Access Tool or sometimes Remote Access Trojan. These
    can be quite a scary prospect when they are used as malware; any attacker who
    can get a `RAT` onto your computer has the potential to take over your machine.
    The very worst part is that these can be bought or gained for free in the underground
    of the internet a that means even a totally unskilled hacker can use one.


    ### Ransomware


    This is a kind of malware that, once installed, will lock up the computer and
    leave you unable to gain access to your files. A message will appear telling you
    that you need to send a certain amount of money to the hacker, along with an address
    for payment; this is usually asked for in Bitcoin. This has turned into something
    of an epidemic as more and more hackers do it; many people are quite happy to
    pay the ransom to get their computer back.


    ### Rainbow table


    This is one of the more complex techniques that hackers use to guess a password
    that is hidden in a hash.


    ### Red team


    Some organizations hire a number of hackers who will then form a ‘red team’. This
    is done to find vulnerabilities in their system and the team will run a series
    of attacks on the system in an attempt to take over it completely. This is ethical
    hacking at its best because the organizations can fix the vulnerability before
    unauthorized persons can get in.


    ### Root


    In just about all computer systems, ‘root’ is the account with the highest level
    of privileges.


    ### Rootkit


    Rootkits are specific malware that reside deep inside a system. They are difficult
    to detect and can be performed externally or internally.


    ## S


    ### Salting


    Salting is when hackers add extra data to a password to make it harder to crack.


    ### Script kiddies


    This is a term used to describe a hacker who has little savvy and uses existing
    tools.


    ### Shodan


    `Shodan` is a search engine that searches for devices. It is often used for unethical
    reasons.


    ### Signature


    This is a digital signature used to verify the authenticity of a message.


    ### Side channel attack


    Your computer and all the hardware it comprises emits a steady stream of signals.
    Side-channels are used to find patterns what the computer is doing.


    ### Sniffing


    Sniffing is a method that uses special software to intercept network data. Once
    the data has been collected, the sniffer will sift it.


    ### Social engineering


    Not all hackers spend their days staring at screens full of green text! Sometimes,
    the simplest way to access a system is to make a phone call or send an email and
    pretend to be another person.

