    想象你正在下一场国际象棋。现在轮到你走了，你正在努力地思考对手可能采取的行动，尽可能地往后看。你的皇后得到完全保护了吗？你是否让你的国王暴露在受攻击的风险？这就是安全研究人员在设计威胁模型时的工作。威胁模型是一个术语，用于描述黑客拥有什么能力、你需要防范什么，以及系统的漏洞。例如，如果你是一个想要保护系统免受国家级攻击小组的活动人士，你需要确保它足够强大；而如果你只是在保护你位于偏远林间小木小屋的网络，虽然它也需要安全，但工作不会那么艰难。


    ## Token

    `token`（令牌）是一种物理设备，赋予所有者对某些服务进行验证或登录的能力。例如，`token`可以提供密码之外的安全性。其背后的原理是，如果密码或加密密钥被盗，没有物理
    `token`，黑客就无法进入。


    ## Tor

    Tor 代表 `The Onion Router`（洋葱路由）。它由美国海军研究实验室开发，现在被黑客、一些记者和活动人士用来隐藏他们的在线活动，从而实现匿名化。其核心思想是网络上有一系列计算机，它们会将你的流量带入奇特的之旅，以隐藏你的真实位置。Tor
    网络由志愿者运行，是一个非盈利项目的一部分。


    ## Tails

    这是 `The Amnesic Incognito Live System`（遗忘匿名现场系统）的缩写，爱德华·斯诺登支持的操作系统。作为一个遗忘系统，你的计算机不会记住任何信息，每当你启动时，它就像在使用一个完全全新的系统一样。它是免费且开源的，但它也有一些安全缺陷。


    ## V

    ### Verification (dump)

    验证（导出）是安全研究人员和记者用于对被黑数据进行软处理的过程，以确保它是合法数据。这一过程对于确保数据确实是真实的，以及匿名黑客所提出的声明是真实而非仅仅是暗网欺骗用户的手段至关重要。


    ### VPN

    `VPN` 是 `Virtual Private Network`（虚拟专用网络），它们利用加密方法将你安全、私地连接到互联网，而不泄露你的身份和真实位置。它们不仅被想要保护连接的人使用；有时员工会使用它们远程连接到雇主使用的网络，并通过位于世界其他地方的服务器进行连接转发。


    ### Virus

    `virus`（病毒）是一种隐藏在文件或程序中的计算机恶意软件。虽然 `worm`（蠕虫）可以自我传播，但 `virus` 需要人工干预，*即*转发一封被感染的邮件*。`virus`
    可以嵌入到计算机中，并以你能想象的任何方式窃取、删除、加密或以其他弄乱数据。


    ### Vuln

    `vulnerability`（漏洞）的缩写，这只是对黑客可以利用的缺陷或错误的的一种称呼。


    ## W

    ### Warez

    读作“where is”，指的是被盗版的软件，并通常通过 `Usenet`、`BitTorrent` 以及其他类似技术分发。`warez` 往往充满了恶意软件，利用了一些人想要免费获取软件的固有欲望。


    ### White hat

    白帽黑客，一种道德黑客，他们发现系统中的漏洞，目标是修复漏洞并保护系统免受黑帽黑客的攻击。


    ### Worm

    蠕虫（Worm），一种可以自我复制并在计算机之间传播的恶意软件。与 `virus` 不同，它不需要人类之手的帮助。


    ## Z

    ### Zero-day

    有时被称为 `0day`（零日漏洞），这是软件供应商未察觉或尚未修复的漏洞。该名称源于从发现漏洞到首次利用该漏洞之间有 0 天的间隔。这些是最珍贵的漏洞，因为还没有部署修复程序，而且它们几乎可以保证处于可用工作状态。


    # 结论

    感谢阅读我的指南，希望你发现它对你有帮助，并且你现在对道德黑客及其本质有了更多的了解。书中的实际示例并不复杂；它们是为像你这样的初学者设计的，作为一种向你介绍该主题并让你习惯操作的方法。


    你的下一步是进一步学习。有很多在线课程和教程，更不用说满是有用书籍的图书馆，你可以利用它们来加深理解并提高知识。


    我必须说，你**不要**以不道德或非法的方式使用你学到的任何内容。道德黑客背后的理念是：1) 帮助你学习如何保持自己的系统安全；2) 当你决定将道德黑客作为职业时，让你对预期有所了解。


