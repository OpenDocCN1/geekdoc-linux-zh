    内置字典列表可以在名为 `/usr/share/wordlists` 的目录中找到，它们都使用 Gzip 压缩。最流行的是“rockyou”，以下是解压它的方法：


    1.  打开终端窗口并切换到 `rockyou` 所在的目录。在提示符处输入 `cd /usr/share/wordlists` 即可。

    2.  要查看 `rockyou` 文件，在提示符处输入 `ls`。

    3.  接着输入 `gunzip rockyou.txt.gz` 来提取该文件。

    4.  再次输入 `ls`，解压即可完成。


    如果你已经准备好了这一切，并且有时间且具备足够的耐心，那么让我们来看看你的 Wi-Fi 网络到底有多安全。


    ### 重要提示

    如果你在没有所有者明确许可的情况下入侵无线网络，这属于违法和犯罪行为。本教程仅用于测试你自己的网络和路由器，以查看其真实安全性。如何。


    ### 第一步 - 打开 Kali Linux 并以 root 用户身份登录

    ### 第二步 - 如果你的原生网卡不支持，请连接支持无线注入/监听模式的适配器。如果你正在使用 VMware 运行 Kali，可能需要使用设备菜单中的图标来连接适配器。

    ### 第三步 - 断开系统已连接的所有无线网络，并打开终端窗口。在提示符处输入 `airmon-ng`。


    这将显示所有支持监听模式（而非注入模式）的无线适配器列表。如果你没有看到列出任何网卡，请断开适配器并重新连接。如果你使用的是内置适配器且没有任何显示，说明你的网卡并不支持监听模式，你需要购买一个。如果你的网卡出现了，它应该显示为类似
    `wlan0` 的名称。


    ### 第四步 - 在提示符处输入 `airmon-ng` 然后是无线网卡的名称，例如 `wlan0`。如果你看到“Monitor Mode Enabled”的消息，意味着网卡已成功进入监听模式。注意，新的监听接口有一个名称，类似于
    `mon0`。


    **注意** - Kali 最近的一个 Bug 导致 `airmon-ng` 在首次启用 `mon0` 时为通道设置了固定的 `-1` 值。如果你遇到了这种情况，或者你不想冒这个风险，在
    `mon0` 启用后，按照以下步骤操作：


    *   在提示符处输入 `ipconfig` 后跟网卡接口，然后输入“down”并按回车。网卡接口名称将是启用 `mon0` 的那个接口。网卡将断开网络连接，以便完全专注于监听模式。稍后，你需要重新启用你的无线接口名称（`wlan0`
    或它原来的任何名称）。你通过输入 `ipconfig (网卡名称) Up` 并按回车来实现。你需要在指南的无线部分完成后执行此操作。


    ### 第五步 - 在提示符处输入 `airodump-ng` 和监听接口的名称（`mon0` 或你的接口名称）。如果你遇到固定通道 `-1` 错误，请参考上文。


    ### 第六步 - 现在你将看到区域内当前无线网络的列表，以及关于每个网络的一些有用信息。在列表中找到你的网络 - 列表会不断刷新，请仔细观察，当你看到它时，按下键盘上的
    `CTRL+C` 列表将停止。记录下与网络相关的通道。


    ### 第七步 - 写下或复制目标的 BSSID，然后输入 `airodump-ng -c (通道号) -bssid (bssid 号) - /root/Desktop/(监听接口)`。确保括号中的所有内容都已根据已知信息填写，并在显示“desktop”的地方输入你将保存的位置。“-w”和文件路径命令指定了
    `airodump` 保存截获到的任何四次握手（4-way handshakes）的位置 - 你破解密码需要这些。将其保存在你能再次找到的地方。之后，按回车。一个正确的命令示例如下：


    ```

    airodump-ng -c 11 -bssid 01:21:BF:E0:E8:D5 -w /root/Desktop/mon0

    ```


    `airodump` 现在将监控你选择的目标网络，且仅监控该网络，以便我们获取更具体、更有用的信息。正在发生的情况是我们在等待另一个设备连接到该网络，从而强制路由器发送我们破解密码所需的四次握手。你还应该会在桌面上看到四个独立的文件
    - 不要删除它们；当握手被捕获时会保存到这些文件中！


    ### 第八步 - 我们不会一直等，因为我们是缺乏耐心的黑客（像很多人一样），我们将使用来自 aircrack 套件的另一个工具。该工具名为 `aireplay-ng`，它可以加快我们的速度。黑客使用
    `aireplay-ng` 强制设备连接，他们通过向网络设备发送 `deauth`（去认证）包来实现，这会让设备认为它必须重新连接。


    要使此方法生效，你需要另一个已经连接到网络的设备，因此请关注 `airodump-ng`；你正在寻找客户端的出现，可能几几秒钟也可能需要几小时。如果你长时间等待后没有看到任何，要么网络是空的，要么你离网络太远。


    ### 第九步 - 一旦客户端出现，打开另一个终端 - 让 `airodump` 继续运行。在第二个终端中，输入此命令 - `aireplay-ng -0
    2 -a(router bssid) -c (client bssid) mon0`。


    -   `-o` 是启用去认证模式的简写，`2` 是将发送的包数。`-a` 表示接入点 bssid，路由器 bssid 需要替换为目标网络的 BSSID，客户端
    bssid 需要是已连接客户端的 bssid，你可以在 `STATION` 下找到它。`Mon0` 是监听接口，所以如果你的名称不同，请输入正确的名称。


    ### 第十步 - 按回车键，`aireplay-ng` 将发送这两个包。如果你离目标足够且进程成功，你会在 `airodump-ng` 屏幕上看到“WPA
    Handshake”的消息，随后是目标的 BSSID。


    这告诉你握手已成功捕获，并且通过某种方式，密码现在落到了黑客手中。可以关闭 `aireplay-ng` 终端，并在 `airodump` 终端上按 `CTRL+C`
    停止监控 - 先不要关闭它，你以后可能还需要它上面的信息。


    如果你没有看到握手消息，说明发送包时没有按计划进行。有很多因素可能出现问题 - 你可能离得不够近，这时请靠近一点。发送去认证包的设备可能没有设置为自动重连；你需要尝试不同的设备，或者只需让
    `airodump` 运行直到建立连接。


    你需要意识到，尽管付出了所有努力，并不是每个 WPA 网络都能这样破解。


    ### 第十一步 - 无线部分已完成。从现在开始，一切都发生在你的电脑和那四个文件之间。这些文件中最重要的名为 `.cap` 的文件，所以打开终端并输入 `aircrack-ng
    -a2 -b (router bssid) -w(path to wordlist) /root/Desktop/*.cap`。


    在这里，`-a` 是用于破解握手的 aircack 方法，`-2` 表示 WPA 方法，`-b` 用于 bssid，路由器 bssid 应该替换为目标，`-w`
    表示字典列表且字典列表路径应是你下载的字典列表路径。最后部分是包含密码的 `.cap` 文件的路径。按回车键。


    ### 第十二步 - 现在 `aircrack-ng` 将开始密码破解过程。然而，只有当密码包含在你的字典列表中时，它才能破解密码。如果不在，你需要下载另一个
    - 互联网上有许多 - 并不断尝试直到找到它为止。如果你完全无法破解该密码，则测试失败，你的网络对于任何基础暴力破解尝试都是安全的。


