    network but this is wrong. The original hackers did it to learn and while there
    are a lot of unethical hackers about now, there are also a lot of good guys who
    want to fix things so the bad ones can’t get in.


    Hacktivist


    Hacktivists are those who use their skills in hacking for political uses. They
    may not do anything large; it could just be the defacement of a public government
    website or they could go big and steal sensitive data from the government and
    send it out to the citizens. Anonymous is the most well-known example of a hacktivist
    group.


    Hashing


    Let’s assume that you have a password or another bit of text that you want to
    keep secret. You could save it in a file and hide it on your computer but should
    a hacker get access to it, they have your data; that means big trouble for you.
    Hashing is a way of keeping information secret; it is done by a program that will
    execute a specific function and the result is the original information hidden
    in a string of garbled text. This is often used by organizations to store facial
    recognition data and passwords to keep them safer.


    HTTPS/SSL/TLS


    HTTPS is short for Hypertext Transfer Protocol Secure and this is the framework
    used for controlling the transfer of data across the internet. HTTP is the normal
    one while HTTPS adds an extra encryption layer to tell you that the website is
    secure. HTTPS uses the TLS and SSL protocols to keep your connection safe and
    prove that the website is a genuine one.


    ## I


    Infosec


    This is a short version of “information security” and is more commonly called
    cybersecurity.


    ## J


    Jailbreak


    Jailbreaking is when the security on a device like a games console or mobile phone
    is circumvented to get around the restrictions placed there by the manufacturer.
    The goal of this is usually to run unofficial software.


    ## K


    Keys


    In modern-day cryptography, digital keys are used. With PGP encryption, public
    keys are used for the encryption of a message and decryption is done using a secret
    key. Other systems may have a single key that is used by all relevant parties.
    Either way, if a hacker can get access to the key that unlocks or decrypts that
    data, they can access it.


    ## L


    Lulz


    An online version of LOL and it tends to be used among the unethical or black
    hat hacker set. They use it as a way of justifying a hack that has been one at
    the expense of a company or individual.


    ## M


    Malware


    Malware is commonly used as a way of saying “malicious software” and it refers
    to any program or piece of software that may be malicious and is designed purely
    to attack a target and damage it. Popular examples are Trojan horses, viruses,
    ransomware, worms, spyware, adware and more.


    Man-in-the-middle


    Generally referred to a MiTM, these attacks are very common and involve a hacker
    placing themselves in the mile of two users and impersonating them. Sometimes
    a hacker will just listen to the communication but on occasion, they will get
    involved and change the data flow to suit their purposes.


    Metadata


    This is nothing more than data about data, For example, if you sent an email,
    the text would be the email content while the sender an receiver addresses and
    the date and time sent would be the metadata. If a hacker can gain enough of this
    metadata they can easily find out an identity and location of a person.


    ## N


    NIST


    NIST stands for the National Institute of Standards and Technology and they are
    a US Department of Commerce section responsible for the development of the InfoSec
    standards that the federal government use. That means they tend to be the authority
    on the best encryption to use to fight modern-day threats.


    Nonce


    A combination of “number” and “once”, this means, quite literally, a number that
    is used just once. A nonce is a number string a system generates to identify a
    specific user for one single session or task. Once that is finished the number
    will not be used again.


    ## O


    OpSec


    A shortened version of Operational Security, this is about ensuring that information
    is secret, both online and offline. It used to be a military term and it is all
    about identifying the information that is required to be kept secret and who it
    needs to be hidden from.


    OTR


    If a person needed to have a conversation that had to be encrypted but it needed
    to happen fast, they would use a protocol called OTR. Meaning “off the record”
    this will provide end-to-end encryption for instant messages. Where PGP is used
    mainly for email, with each person having their own keys, OTR will provide a temporary
    key for each relevant conversation, making it secure from hackers.


    ## P


    Password managers


    The biggest mistake made is when people use the same password for everything and
    generally it isn’t a very good password either. A hacker only has to gain access
    to one of your accounts and they can get into all of them. However, trying to
    remember dozens of different passwords is not easy and that’s where the password
    manager comes in. This is a piece of software that tracks all your passwords and,
    if needed, can even generate passwords that are complicated and very long. The
    only password you need to remember is the master to get into the password manager.


