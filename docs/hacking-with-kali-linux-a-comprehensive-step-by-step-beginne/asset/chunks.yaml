    `Aircrack-ng` is the package of choice for penetration testing, and for wireless
    analysis. It focuses on three main Wi-Fi protocols - WEP (Wired Equivalent Privacy),
    WPA (Wi-Fi Protected Access, and WPA2-PSK. The tool provides packet injection,
    wireless packet sniffing, encrypted password cracking and wireless network analysis
    features and it needs network interface hardware with support for the monitor
    mode function.


    ## BurpSuite


    BurpSuite is a full suite of tools focusing on web application exploitation. The
    programs will interact to test applications for any vulnerabilities and for launching
    attacks.


    This is not a comprehensive list of the tools included in Kali but these are the
    most important ones, representing the sheer power and the flexibility that Kali
    has for computer security, in particular penetration testing.


    That concludes our look at the basics of hacking and Kali; in the next section
    we will delve deeper into ethical hacking with a few examples for you to try yourself.


    # Part Two: The Process of Ethical Hacking


    Like every good process, there are sets of phases to ethical hacking and these
    are important for hackers to follow to ensure their ethical attack is structured
    properly.


    There are six main phases:


    * **Reconnaissance** - this is the initial information gathering phase. The attacker
    will find information regarding their attacker using either active or passive
    methods. The tools that tend to be most used in this are `Nmap`, `Google Dorks`,
    `Maltego`, and `Hping`.

    * **Scanning** - the next stage involves the attacker beginning to probe a target,
    either a network or a computer, looking for the vulnerabilities that they can
    exploit. The tools normally used are `Nmap`, `Nexpose`, and `Nessus`.

    * **Gaining Access** - in this step, the vulnerability is found and the attacker
    tries to exploit it to get access to the system. `Metasploit` is the main tool.

    * **Maintaining Access** - the attacker is in the system and they have installed
    a couple of backdoors so that they can get in and out of the system when they
    want, whenever they want. Again, `Metasploit` is the tool of choice.

    * **Clearing the Tracks** - this part is unethical because it involves deleting
    all logs of the activities that happen while the hack is in process.

    * **Reporting** - in an ethical hack this is the final phase. The attacker will
    draw up a report detailing what they found and what was done, including all tools
    that were used, whether or not they were successful, what vulnerabilities were
    found and the process of exploiting them.


    The first phase, reconnaissance, is a complete set of techniques and processes
    for the discovery and collection of information about a specified target. There
    are seven steps to this phase and a hacker will follow them all to learn as much
    as they can:


    1. Gathering the information

    2. Determining the range of the network

    3. Identifying active machines

    4. Discovering access points and open ports

    5. Fingerprinting the OS

    6. Uncovering the services on the ports

    7. Mapping the network


    Reconnaissance happens in two parts - active and passive.


    ### Active

    Active reconnaissance involves direct interaction with eh target system to gain
    as much information as possible. However, if you do not have permission to access
    the system you are running the risk of detection and if that happens, the system
    administrator can take serious action and can follow your activities, tracking
    everything you do.


    ### Passive

    Passive reconnaissance does not involve direct connection to a system and is used
    for gathering the information with no interaction with the target.


    ### Footprinting


    This may be either active or passive. One example of passive footprinting is to
    review the website of a company. If you were to try to get sensitive data using
    social engineering, it would active footprinting.


    This is the very first part where the most information is gathered. The attacker
    is looking for a way to get into a system or, at the very least, determine what
    attacks will be the most suitable. The information gathered during this part is
    usually:


    * A domain name

    * An IP address

    * Namespaces

    * Information about employees

    * Telephone numbers

    * Email addresses

    * Information about different jobs


    Next, we’ll look at how this information can be extracted. It is also basic information
    and easy to find about any network or system connected to the net.


    #### Domain Name Information


    Use [`http://www.whois.com/whois](http://www.whois.com/whois)` to find out information
    about a domain name. You can find out who the owner is, the registrar, the date
    it was registered, when it expires, the name server, the contact information for
    the owner and so on.


    Tip - to keep your domain name information private from potential hackers, keep
    your domain profile private and not public.


    #### Finding the IP Address


    To find IP address information, open a command prompt and use a `ping` command:


    ```

    $ping (name of website/company)

    ```


    You should see something like this:


    ```

    PING website address (55.123.45.678) 68 (96).

    72 bytes from 55.123.45.678: icmp_seq = 1 ttl = 72 time = 0.028 ms

    72 bytes from 55.123.45.678: icmp_seq = 2 ttl = 72 time = 0.021 ms

    72 bytes from 55.123.45.678: icmp_seq = 3 ttl = 72 time = 0.021 ms

    72 bytes from 55.123.45.678: icmp_seq = 4 ttl = 72 time = 0.021 ms

    ```


    #### Finding the Hosting Company


    When you have got the website address, you can go further and use a website called
    `ip2location.com` to find out who the hosting company is.


    Tip - if your network or system is linked directly to the internet, there is no
    way to hide your IP. If you have sensitive information stored on a server, that
    server should be locked behind a secure proxy. This will stop hackers from gaining
    the exact details about your server. Another good way of covering your IP and
    any information that goes with it is to use a `VPN` or Virtual Private Network.
    If it is configured right, all your traffic will go through it and your IP address
    will be hidden.


    #### Ranges of IP Addresses


    While smaller websites generally have one IP address, larger ones may have several,
    each serving a different domain and subdomain. If you go to the American Registry
    for Internet Numbers, `ARIN` for short, you can get hold of the IP address range
    that is associated with any specific company.


    #### Website History


    By using [`www.archive.org/](http://www.archive.org/), you can get an entire history
    for any website. Just input a domain name into the search box and you can get
    the information for the website at any specific point of time.


    Tip - Having your website stored in an archive database does offer some benefits
    but if you don’t want anyone seeing the information or seeing how your website
    moved through different phases, you can ask `archive.org` to remove your website
    history.


    #### Fingerprinting


    OS fingerprinting refers to methods that are used to find out what operating system
    a remote computer has installed on it. It could be active or passive fingerprinting:


    * **Active Fingerprint** - this is done by sending packets that have been specially
    made to the target machine and then noting what response comes back. The information
    that comes back is then analyzed to see what the operating system is.

    * **Passive Fingerprinting** - this uses snuffer traces that come back from a
    remote computer system. `Wireshark` is one tool used for this and the traces that
    come back can tell you what OS the remote host is using.


    To work out what the operating system is, there are four elements to look at:


    * `TTL` - Time-To-Live - what the operating system sets on the outbound packet

    * `Window Size` - what the operating system sets the window size as

    * `DF` - Don’t Fragment - what the operating system sets the DF bit as

    * `TOS` - Type of Service - whether the operating system sets this or not and
    at what.

