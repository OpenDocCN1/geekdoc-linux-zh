    ## Penetration Testing


    Penetration testing is the best way to discover weaknesses in your system. A pen
    test, as it is generally known, is an attack on a system to find security loopholes
    and vulnerabilities, with the potential to gain access to the system via those
    loopholes and, in turn, gain access to data and even complete functionality of
    the system. The pen test process requires identification of the target followed
    by reviewing what information is gained and carrying out what is needed. Ethical
    hackers use pen testing to determine how an unethical hacker might access and
    compromise the system and the potential for the damage they can cause.


    Rather than just telling you about penetration testing, I’m going to show you
    how to do it because that is a far easier way to learn. You will need a genuine
    copy of Windows XP (you will probably need a disk for this) because that is what
    we are going to hack into using VMware. Doing this on an actual machine, especially
    one belonging to someone else, is not a good idea!


    What You Need


    * Kali Linux


    * VMware tools - without these you can’t set up the attack and target machines
    running on one computer.


    * Windows XP - you will need SP1 and an unpatched version of XP. The exploits
    do not work on patched versions.


    * Virtual machines


    Using the Metasploit Framework


    Metasploit requires a couple of services that don’t come with the standard Kalu
    system startup so you need to input some commands on your terminal first:


    service postgresql start - PostgreSQL is the database that Metasploit uses so
    it must be started first.


    Once this is running, we can go ahead and open the Metasploit service. When it
    gets launched for the first time, an msf3 database and database users are created
    and the Metasploit RPC and the web servers it needs are also launched. Type in
    service Metasploit start.


    If you get any errors in either of these commands, skip them and just type in
    msfconsole.


    You should have Kali running in VMware and you now need to load Windows XP into
    a virtual machine to run alongside it. Once that is done, we are going to use
    the Metasploit framework to try and detect both machines and to do that, we need
    to do a port scan.


    Metasploit has a great port scanning function called auxiliary scanner. To execute
    the scan, type in this at the command prompt - use auxiliary/scanner/portscan/tcp


    To see all of the options that are available, type in show options.


    We need to make some changes to the settings. First, we need fewer ports to scan
    so type in set ports 1-500.


    Next, we need to specify the IP that is to be scanned. This isn’t so easy because
    the IP is going to be different for some cases. So, go to the virtual machine
    running XP and open a command prompt. Type in ipconfig and you should see the
    IP in the results - this is the IP that needs to be specified in RHOSTS.


    Back to your Kali virtual machine and type in the following, using the IP address
    you gained:


    Set RHOST xxx.xxx.xx.xxx


    Type in show options again so the changes you made and then type run.


    The port scan will begin and after a while you will see a list of the open tcp
    ports; those are the ones that are vulnerable to being hacked. If you had used
    a later, patched version of Windows XP, you would not have seen any ports.


    If you don’t see any open ports, disable your firewall and try again. Make a note
    of the numbers of each open port.


    Finding the Exploits


    This is an important step because we need to work out which exploits will work
    on the target operating system. At the command prompt, type back and then go to
    msfconsole. Type in search dcom.


    This is a well-known Windows exploit. Copy the number of the exploit and on the
    next line type in use exploit/windows/dcerpc/mso3_026_dcom.


    Type in show options and type set RHOST as xxx.xxx.xx.xxx (input the target IP).


    Next, we need to set a payload so type set PAYLOAD windows/shell_bind_tcp.


    Type in exploit and you are now in the target computer system. On the target system
    you will see an open shell and you will have full admin privileges; that system
    is now yours.


    ## Hacking A Website Using Nikto and SQL


    Assistance courtesy of https://null-byte/wonderhowto.com


    Before you should even consider looking at hacking into a website, as a white
    hat hacker, it is your job to do your reconnaissance first. It is foolish and
    a complete waste of time to hurl attacks at a site without seeing where the vulnerabilities
    lay. It only takes a few minutes to do proper recon and it can make life a whole
    lot easier.


    One of the easiest tools to use, and the one we’re going to start with, is Nikto.
    This is an open-source scanner that looks at a website and then documents the
    vulnerabilities it finds. However, while this is an effective tool, it isn’t particularly
    stealthy and if a website has an intrusion-detection system, it will detect the
    tool. But, as it was originally designed as a security testing tool, it doesn’t
    need to be stealthy.


    Step One - Open Kali and follow this path - Kali Linux>Vulnerability Analysis>Misc
    Scanners>nikto.


    Step Two - scan the web server for vulnerabilities by typing nikto -h at the command
    prompt followed by the IP address. You should see some information load about
    the web server such as what the server is, for example, Apache, along with information
    on potential vulnerabilities. You may see some vulnerabilities with a prefix of
    OSVDB - this stands for Open Source Vulnerability Database and is a database that
    contains a list of known vulnerabilities.


    Step Three - have a look at another site; we’ll use a web server called webscantest.com
    so, at the command prompt, type in nikto -h webscantest.com. Again, the server
    should be identified, along with a number of potential vulnerabilities with the
    OSVDB prefix. If you go to [http://osvdb.org](http://osvdb.org/), you can identify
    what these vulnerabilities are. Find the information on a vulnerability that nikto
    identified as OSVDB-877 - just put the number into the search bar and the information
    will come up in the form of a page.


    Look at the bottom half of the page and you should see various references to the
    vulnerability info sources along with tools and other filters.


    Try another one; nikto -h wonderhowto.com.


    Again, the server information will appear and a list of vulnerabilities but, because
    this website has not been built on asp or php, attempting to exploit any of those
    vulnerabilities would just get you a 404 error page. These are false-positive
    vulnerabilities that appear because they are not executed by the scan; the scan
    is just looking to see whether the server will respond to any of the known URLs
    that can be exploited, without any errors.


    Last one, let’s try Facebook. At the command prompt, type in nikto -h facebook.com.
    You won’t get much from this; Facebook is locked down pretty tight with very few
    vulnerabilities. Let’s face it, if it wasn’t, all hell would break loose!


    Using SQL


    For this part, we’ll use Kali and sqlmap, which is already installed in Kali.
    Sqlmap is a useful tool that makes it easier to perform SQL injection on a website.
    It is open source and used for the detection and exploitation of SQL injection
    flaws and for taking database servers over. It has a built-in detection engine,
    a very powerful one, and a good many features for pen testers and several switches.
    Let’s get started:


    Step One - Open Kali and start a new terminal. At the prompt, type sqlmap -h.
    This will show you a list of the commands the SQLMap supports so, to begin with,
    we are just going to go with a very simple command.'
