    can be quite a scary prospect when they are used as malware; any attacker who
    can get a RAT onto your computer has the potential to take over your machine.
    The very worst part is that these can be bought or gained for free in the underground
    of the internet a that means even a totally unskilled hacker can use one.


    Ransomware


    This is a kind of malware that, once installed, will lock up the computer and
    leave you unable to gain access to your files. A message will appear telling you
    that you need to send a certain amount of money to the hacker, along with an address
    for payment; this is usually asked for in Bitcoin. This has turned into something
    of an epidemic as more and more hackers do it; many people are quite happy to
    pay the ransom to get their computer back.


    Rainbow table


    This is one of the more complex techniques that hackers use to guess a password
    that is hidden in a hash.


    Red team


    Some organizations hire a number of hackers who will then form a ‘red team’. This
    is done to find vulnerabilities in their system and the team will run a series
    of attacks on the system in an attempt to take over it completely. This is ethical
    hacking at its best because the organizations can fix the vulnerability before
    unauthorized persons can get in.


    Root


    In just about all computer systems, ‘root’ is the name given to the most basic
    yet most powerful access level or it may be the account name with those kinds
    of privileges. “root” users area blew to install software, applications, delete
    files, create them, and so on. When a hacker manages to gain “root” access, they
    can do pretty much anything they want on that system, which is why it is considered
    to be the “holy grail” in the hacking world.


    Rootkit


    Rootkits are specific malware types that reside deep inside a system. It is activated
    each time the computer is booted up and gets to work before the operating system
    loads. This makes them very difficult to find; they are persistent and they can
    capture just about the data on your system.


    ## S


    Salting


    When plaintext passwords or text are protected by turning them into unreadable
    or garbled text, the process is called hashing. To make this work even better,
    some companies or individuals will add extra bytes in a random manner to the hash
    in a process called salting. This provides even more protection.


    Script kiddies


    This is a term used in a derisive manner to describe a hacker who has very little
    savvy in terms of computers and can only make use of common software to sniff
    a password or take a website offline. The term tends to be used to try to discredit
    a person who claims they are skilled in hacking.


    Shodan


    Sometimes termed the “hacker’s Google” Shodan is a search engine that searches
    not for websites but for connected devices. Shodan is often used to fund webcams
    that are not protected, printers, gas pumps, medical devices, wind turbines, even
    baby monitors. Although it is used for unethical reasons Shodan can also be used
    ethically to let the owners of such devices know that their devices are unprotected
    and are potential entry points for hackers.


    Signature


    This is another part of PGP; as well as being able to encrypt a message, PGP can
    also be used to sign a message using an encryption key. The key is secret and
    known only to the person who owns it, and will be stored only on their computer.
    This means that the signature is meant to identify the owner as being genuine.


    Side channel attack


    Your computer and all the hardware that it comprises of constantly emits a steady
    stream of electrical signals that are difficult to detect. Side-channels are used
    to find patterns in the signals to find out what the computer is doing in terms
    of computation. For example, a hacker might listen to your hard drive while it
    generates an encryption key; they can then steal that key without you knowing.


    Sniffing


    Sniffing is a method that uses special software to intercept network data in secret
    and once the data has been collected, the sniffer will sift it to see if there
    is anything useful, such as passwords. This is not easy to detect and can be performed
    externally or internally to a network making them very dangerous attacks.


    Social engineering


    Not all hackers spend their days staring at screens full of green text! Sometimes,
    the simplest way to access a system is to make a phone call or send an email and
    pretend to be another person. This would normally be a person who would have access
    to the system but has “forgotten” their password, and is requesting that information
    to be sent back. Phishing is a form of social engineering.


    Spear phishing


    This name tends to be used with phishing to mean the same thing but there is a
    difference. Spear phishing is a more targeted attack where the hacker attempts
    to get their target to click on an attachment or link. They do this by pretending
    to be someone the target would know, like a large social network. If it is successful,
    spear phishing can be very effective because it has the potential to provide the
    hacker with long-term access to a system or part of a system.


    Spoofing


    Spoofing is when a hacker tricks a target into believing a phishing attack is
    genuine; this is done by forging the email address they use to look like the address
    of a contact the target would know. It is also used to create fake versions of
    genuine websites.


    Spyware


    This is a certain type of malware that is designed to monitor a system. In effect,
    it is spying on the system with the potential to steal and use data.


    State actor


    A state actor is a hacker that has the backing of a government, usually based
    in the US, China or Russia. These are not the type of hacker anyone wants to meet
    because they have all the financial and legal resources they need from a nation-state.


