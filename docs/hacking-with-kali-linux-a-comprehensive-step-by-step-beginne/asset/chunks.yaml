    # 如何安装 Kali Linux


    有多种方法可以在你的电脑上安装 Kali Linux；我将向你展示的方法是将其在一个名为 `VMWare` 的虚拟机管理器中安装。它支持所有主流操作系统，并用于将物理服务器划分为若干个虚拟机。


    ### 第一步

    访问 [`kali.org/downloads/`](http://kali.org/downloads/) 并将 Kali 下载到你的电脑上。


    ### 第二步

    访问 [`www.vmware.com/`](https://www.vmware.com/) 并将 `VMWare` 下载到你的电脑上。


    ### 第三步

    所有下载完成后，打开 `VMWare` 并点击 `Create`（创建）创建一个新的虚拟机。弹出一个窗口，点击 `Installer Disc Image
    File (ISO)`（安装盘映像文件），找到你下载 `Kali ISO` 文件的位置；点击该文件然后点击 `Next`（下一步）。


    ### 第四步

    命名你的虚拟机 - 为了方便演示，将其命名为 `Tutorial Kali` - 然后选择你想保存的位置。最佳选项是在“我的文档”中创建一个名为 `Virtual
    Machines` 的新文件夹。执行此操作然后点击 `Next`。


    ### 第五步

    选择你为 `Kali` 设置的最小大小，至少设置为 `30 GB`，因为 `Kali` 会随着时间的推移而增大。输入数值并在 `Store Virtual
    Disk`（存储虚拟磁盘）处选择 `Single File`（单个文件）并点击 `Next`。


    ### 第六步

    现在我们需要对硬件设置进行一些更改；点击 `Customize Hardware`（自定义硬件）按钮，将打开硬件窗口。转到左侧面板并选择 `Memory`（内存）；将滑块滑动到
    `512 MB`（始终为虚拟机分配机器上安装内存的 `50%` 作为最大。例如，如果你有 `4 GB RAM`，滑块不应超过 `2 GB`）。


    接下来，点击 `Processors`（处理器）。你的回答取决于你的系统设置。如果你有多个处理器，请选择两个或更多；但如果你只有一个或两个处理器，请保持不变。


    现在点击 `Network Adaptor`（网络适配器）并将点移动到顶部的选项，即 `Bridged`（桥接）。然后点击 `Configure Adaptors`（配置适配器）。取消勾选窗口中你网络适配器旁的所有复选框；点击
    `OK`。


    最后，点击窗口底部的 `Close`（关闭），并在安装向导中点击 `Finish`（完成）。


    ### 第七步

    你新创建的虚拟机文件现在将位于虚拟机库，你现在需要的是打开 `Kali` 并进行安装。转到新虚拟机文件的位置并点击它；在右侧面板中，点击 `Play Virtual
    Machine`（播放虚拟机）。`Kali` 将启动。


    ###八步

    使用键盘方向键在启动菜单中导航到 `Graphical Install`（图形化安装），然后按 `Enter` 键。


    在下一个屏幕上，选择你的语言并点击 `Continue`（继续）。


    选择你的位置并点击 `Continue`。


    现在你需要选择你的标准键盘；如果你使用的是美式英语键盘，只需点击 `Continue`。


    等待片刻，因为 `kali` 需要检测你所有的电脑硬件；如果在此过程中出现屏幕，只需点击 `Continue` 然后勾选 `Do Not Configure
    This Network`（不配置此网络）框。


    当 `Kali` 完成后，你会被要求输入一个 `hostname`（主机名），只需一个计算机名。输入任何你想要的内容或保留为 `Kali`，随你决定。然后点击
    `Continue`。


    接下来，为 `root` 账户输入密码，并确保你记得它。如果你忘记了，你必须从头开始，重新安装 `Kali`。确认密码并点击 `Continue`。


    选择你的时区并点击 `Continue`。


    现在你需要再次等待，因为 `Kali` 需要检测磁盘上的分区。在下一步中，点击 `Guided - Use Entire Disk`（引导 - 使用整个磁盘）然后点击
    `Continue`。


    当安装程序要求你确认分区选择时，点击 `Continue`。


    你现在会收到最后一个关于分区的问题；点击 `All Files In One Partition`（所有文件在一个分区中）然后点击 `Continue`。


    点击 `Finish Partitioning`（完成分区）以确认所有内容并将更改写入磁盘。然后你可以点击 `Continue`。


    点击 `Yes` 确认这些更改是正确的，最后一次点击 `Continue` `Kali` 将开始安装。你现在需要耐心，因为 `Kali` 的安装可能需要 `30
    minutes` 或更长时间。在安装期间请勿触碰电脑。


    ### 第九步

    当 `Kali` 安装完成后将弹出一个窗口询问 `Network Mirrors`（网络镜像）；点击 `No` 然后点击 `Continue`。


    等待几分钟后，系统会询问你是否安装 `GRUB` 启动加载程序；点击 `Yes` 然后点击 `Continue`。


    `Kali` 将完成安装，你会看到一条通知消息；点击 `Continue` `Kali` 将重启。


    使用你之前在此过程中创建的凭据登录。


    你好！如果你觉得这个主题或信息有用，如果能在 [Amazon.](https://www.amazon.com/dp/B07NSRW9FZ) 上留一个快速评论，将非常有帮助。非常感谢！


    # Kali 工具


    `Kali` 成为安全专业人员和黑客热门选择的主要原因之一是它提供了巨大的免费工具集。目前有超过 `300 个工具`，包括漏洞评估、被动信息收集、网络分析、密码破解、破解无线网络以及一套非常强大的漏洞利用工具。这些是最流行的工具，也是你最可能开始使用的工具：


    ### Metasploit Framework

    这是目前最流行的利用平台之一，它有许多用于分析和渗透测试的有用工具。它有多种用户界面选项，用户可以使用这些工具攻击任何操作系统。


    ### Armitage

    `Kali` 中还包含了 `Armitage`，这是一个图形化管理平台，用于帮助用户在攻击期间组织多个 `Metasploit` 工具之间的交互和操作。


    ### Wireshark

    `Wireshark` 是一个非常流行的网络流量分析工具。它可以在多个平台上运行，并且实时工作。特定网络节点上的所有流量将被捕获，然后拆分为数据包元数据。这包括标头、负载和路由信息。`Wireshark`
    用于检测和分析网络安全事件，并找出网络为何以及何时故障的原因。


    ### John the Ripper

    这是所有密码破解工具中最传奇的之一，充满了攻击密码的算法。它最初仅为 `Unix` 编写，但现在可以在多个主要平台上运行。大家使用它的核心功能是让它能够自动检测
    `hash` 类型的密码加密。该工具还有一个商业版本，功能强大得多，但 `Kali` 上的免费版对大多数人来说足够了。


    ### Nmap

    `Nmap` 是 `Network Mapper` 的缩写，是用于渗透测试的最常见黑客工具之一。该工具允许用户扫描网络并查找连接到网络的所有网络服务和主机。它随后提供一个关于网络结构及其所有成员的高度详细的地图。同时，它还会告诉你每个主机安装的操作系统以及开放的端口，允许用户快速发现已知漏洞。


    ### Aircrack-ng


