    我们将再次使用 `Ettercap` 来执行 DNS 投毒。它与 ARP 欺骗类似，事实上，你需要从 ARP 欺骗开始来初始化 DNS 投毒。我们将使用 `Ettercap`
    中的 `dns spoof` 插件。


    1. 打开你的终端，在命令提示符输入 `nano etter.dns`。这包含了 `Ettercap` 用于解析域名地址的 DNS 地址记录。我们将添加一个名为“Facebook”的假条目，这样当用户打开它时，他们会被重定向到一个虚假的
    Facebook 页面。


    2. 在显示 `Redirect it to `www.linux.org`` 的地方插入条目。


    3. 保存文件并退出。


    4. 现在的过程与启动 ARP 欺骗完全相同，一旦启动了它，点击 `Plugins`（插件）并选择 `dns spoof` 插件。


    5. 一旦激活了此插件，结果将显示每当有人尝试打开 `Facebook.com` 时，它都会开始被伪造到 Google 的 IP 地址。这意味着，当用户尝试访问
    `Facebook` 时，他们打开的是 Google 页面。


    ## 防御 DNS 投毒


    道德黑客经常被聘用通过保护网络来防止攻击，而你作为黑客所学到的知识将有助于你防止黑客所用的小这些技术。


    从渗透测试员的角度来看，这些是你用来防御此类攻击的一些防御措施：


    *   为了保护网络的敏感部分，请使用硬件交换网络。这将帮助你将网络流量隔离到网络的一个部分。

    *   通过在网络交换机上实施 `IP DHCP Snooping` 来防止 ARP 欺骗和投毒攻击。

    *   制定策略防止网络适配器被切换到混杂模式。

    *   当你深入部署无线接入点时，要非常小心，并意识到无线网络上的所有流量都容易受到嗅探。

    *   任何敏感流量都应该使用 `SSH`、`IPsec` 或其他加密协议进行加密。

    * 确保可以编程允许指定的 `MAC` 地址在每个端口发送和接收数据的交换机已通过 `port security`（端口安全）进行保护。

    *   使用 `IPV6` 代替 `IPV4`，因为它更安全且选项更多。

    * 用 `SSH` 替换 `Telnet`、`FTP` 和其他类似协议，以提供对网络嗅探的更好的防御。如果你无法使用 `SSH`，请考虑使用 `IPsec`
    来保护你的遗留协议。

    *   使用 `VPN` 提供一个阻止嗅探的屏障。

    *   在可能的地方使用 `SSL`。


    我们已经查看了黑客如何使用网络上的数据包嗅探器捕获并分析流量。通过一个现实示例，我们可以看到在指定的网络上获取指定受害者的凭据是非常容易的。`MAC` 地址、`DNS`
    和 `ARP poisoning` 是黑客用于嗅探流量和获取敏感数据的攻击类型。


    在下部分，我们将深入实战，开始进行我们自己的道德黑客，从无线网络攻击开始。


    如果你不介意，请为我的 [Amazon 上的书籍](https://www.amazon.com/dp/B07NSRW9FZ) 写简短的评论，并随时告诉我你的想法！非常感谢！


    # 第三部分：实战攻击


    ### 无线网络攻击


    技术领域每天都有新的改进。几乎所有的办公室、酒店、咖啡馆、餐厅和家庭都安装了 Wi-Fi 网络，也称为 `WLAN` 或无线局域网。这些网络极其多功能且适应性强，仅仅是因为它们让人们的生活变得更容易、更舒适。它们具有移动性，价格更便宜，而且大多数人都能负担得起并使用。`WLAN`
    也比有线网络更容易安装和实施，但尽管它的覆盖范围非常广，一个问题仍然存在——它有多安全？


    Wi-Fi 网络基于一组特定的 `WLAN` 标准——`IEEE 802.11`。`IEEE`（电气与电子工程师学会）成立于于 1980 年 2 月，而“11”指的是
    `WLAN` 的工作组，它是“802”的一个子小组。


    多年来，对 Wi-Fi 网络的需求急剧增长，几乎每个人在使用任何操作系统（包括移动设备）时都会使用 `WLAN`。每个人都应该放在脑海中处于首位的一点是，没有任何计算机网络是完全安全的。虽然这项技术如此广泛是一个好消息，但也意味着现在的危险比以往任何时候都多得多。无论
    `IEEE` 组织的规模如何，无线网络现在是世界上最大的目标之一。


    曾几何时，无线网络方面最常见的问题是间谍软件和弱密码。虽然这些问题确实存在并且仍在呈上升趋势，但 `WLAN` 打开了一整套全新的漏洞，这就是白帽或道德黑客出现的地方，用以防御黑帽。


    道德黑客不仅仅是一个简单的名称；它是渗透测试，是漏洞测试，也是安全。一个道德黑客需要能够看到未来，提前计划，并使用与黑帽黑客相同的工具，但他们将利用这些工具来对抗他们，阻止他们攻击系统。


    在这一部分，我们将关注影响无线网络的漏洞，以及你如何进入这些网络（当然是合道德地），以加固并保护它们免受不道德攻击的侵害。


    ### 测试你的系统


    无线网络从未完全安全过，从第一天起如此，而且可能永远不会。这里有太多的潜在弱点，包括加密方面的缺陷、身份验证问题、物理安全问题等。你还有许多工具可以测试你的系统并在需要的地方关闭漏洞，并且出现了两个安全标准来帮助保护无线网络并对抗黑客——`Wi-Fi
    Protected Access` 和 `IEEE 802.11`。


    Wi-Fi Protected Access 或所知的 `WPA`，由 `Wi-Fi Alliance` 开发，旨在修复 `WEP` 的漏洞，并一直使用到
    `IEEE 802.11` 开发为止。该标准也被称为 `WPA2`，开发目的是将 `WPA` 的修复与其他涵盖加密和身份验证的机制相结合，反过来这有助于提高网络的安全性。


    这两个标准共同成功解决了许多围绕无线网络的安全问题，但有一点是他们无法修复的——人类。安全标准可能运行得很好，但只有在它们被正确实施时才会起作用。在某些情况下，IT
    管理员并没有这样做，特别是在他们的网络已经配置过的情况下——他们不想再次更改所有的 Wi-Fi 设置。他们不想重新设计安全机制，也不想实施新机制，以防让他们的管理系统变得太复杂。是的，这些是非常合理的问题，但正是这些导致了网络暴露在攻击之下。


    尽管如此，即使充分实施了标准和其他策略，也不能保证完全安全；它只是降低了风险。计算机网络永远不可能 100% 安全，但通过道德黑客，你可以学会如何多保护自己。


    ## 理解无线网络面临的风险


    在我们深入研究之前，有两个定义是你应该 same：


    *   漏洞 - 网络中易受攻击的脆弱点。一个例子是未完全加密或在接入点上使用弱密码的系统网络。接入点或 `AP` 是无线系统的中心。


