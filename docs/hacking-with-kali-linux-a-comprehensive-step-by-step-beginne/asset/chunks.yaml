    # MAC 泛洪


    ## 欺骗攻击


    ### 受影响的协议

    `TCP/IP` 以及其他类似协议的设计并未考虑安全性，这可能是黑客攻入最容易的入口之一。许多规则使得嗅探变得更加容易：


    * `HTTP` - 用于发送未加密的明文信息——高风险目标

    * `SMTP` - 简单邮件传输协议的缩写，用于发送电子邮件。它是一种高效的协议，但没有防止嗅探的保护措施

    * `NNTP` - 网络新闻传输协议的缩写，用于所有类型的通信，但所有数据和密码都以明文形式在网络上传输，且未经过加密

    * `POP` - 邮局协议的缩写，用于从服务器接收电子邮件。它没有内置的嗅探保护机制

    * `FTP` - 文件传输协议的缩写，用于发送和接收文件，但没有安全性。所有内容均以明文形式发送

    * `IMAP` - 互联网消息访问协议的缩写，它与 `SMTP` 非常相似，但更容易被嗅探

    * `Telnet` - `Telnet` 是最糟糕的协议之一，它将用户名、密码甚至按键等所有敏感数据以明文形式在网络上传输。


    ### 嗅探工具

    有很多网络嗅探工具，每种工具都有自己的功能，可以帮助你分析流量并从信息中获取你需要的内容。它们是最常用的道德黑客工具，以下是一些较好的工具：


    * `BetterCAP` - 一个非常强大且灵活易携的工具。它的创建初衷是对网络进行 `MITM`（中间人）攻击，对 `TCP`、`HTTP` 和 `HTTPS`
    流量进行实时操控，嗅探凭据等信息。

    * `Ettercap` - 这是一个完整的 `MITM` 攻击套件。包含的工具允许你嗅探实时网络连接、在此过程中过滤内容等许多功能。它支持主动和被动协议分析，并有许多用于主机和网络分析的工具。

    * `Wireshark` - 最流行的嗅嗅探之一，为流量分析和解析提供了大量功能。

    * `Tcpdump` - 一种流行的分析数据包的命令行工具，提供了在网络传输期间拦截和观察 `TCP/IP` 包和其他数据的工具。

    * `WinDump` - 适用于 Windows 的 `tcpdump` 版本，一种用于分析头部信息的命令行工具。

    * `Dsniff` - 一个用于嗅探多种协议的完整套件，用于拦截并泄露密码。

    * `EtherApe` - 设计用于生成入站系统连接的图形化显示。

    * `MSN Sniffer` - 如其名，设计用于嗅探由 MSN Messenger 生成的所有流量。

    * `NetWitness NextGen` - FBI 等执法机构使用的工具，它具有基于硬件的嗅探器和其他许多功能，可以监控并分析所有网络流量。


    ## ARP 投毒

    `ARP` 或地址解析协议是一种“无状态”协议，通常用于将 `IP` 地址解析为机器的 `MAC` 地址。任何需要在网络上通信的设备设备都会广播 `ARP`
    查询以定位其他 `MAC` 地址。`ARP 投毒`也称为 `ARP 欺骗`，其工作原理如下：


    * 当网络上的某台机器与另一台机器通信时，它会查找 `ARP` 表

    * 如果 `MAC` 地址不在表中，则会在整个网络中广播 `ARP` 请求

    * 该网络上的所有机器都会比较 `IP` 地址和 `MAC` 地址

    * 如果任何机器可以识别出自己，它就会响应请求并提供其 `IP` 和 `MAC` 地址

    * 发起请求的计算机将地址存储在 `ARP` 表中，然后两端即可通信。


    ### 什么是 ARP 欺骗？

    黑客可以伪造 `ARP` 数据包，使得请求的信息发送到黑客的计算机。大量的此类伪造请求/响应数据包被用来过载网络交换机，导致交换机被设置为转发数据。一旦 `ARP`
    表被伪造响应淹没，黑客就可以嗅探每一个网络包。黑客会将伪造条目填充到目标计算机的 `ARP` 缓存中；这被称为“投毒”，并利用 `MITM` 访问将毒素扩散到网络。


    ### 什么是 MITM？

    `MITM` 代表中间人攻击（Man in the Middle）。这是一种主动攻击，黑客将假成用户；在受害者之间建立连接，并在他们之间发送消息。受害者认为他们正在相互通话，但实际上黑客控制着一切。


    游戏中存在第三个玩家，他负责控制和监控受害者之间的通信流量。存在一些协议（如 `SSL`），可以防止此类攻击的发生。


    ### 练习

    我们将使用 `BetterCAP` 执行 `ARP 投毒`。环境是局域网（LAN），我们将使用安装了 `Kali Linux` 和 `Ettercap` 的
    `VMWare workstation` 进行流量嗅探。


    你需要：

    * `VMware Workstation`

    * `Kali Linux`

    * `LAN 连接`

    * `Ettercap`


    这可以在有线和无线网络中进行，可以在本地局域网中进行。


    1. 如果你还没有安装，请安装 `VMware` 和 `Kali Linux`

    2. 使用用户名密码“root,root”登录 `Kali`

    3. 连接到本地局域网并打开终端；在提示符处输入 `ipconfig` 检查 `IP` 地址

    4. 在命令行提示符输入 `Ettercap -G`，将启动图形版本的 `Ettercap`

    5. 进入菜单栏并点击“sniff”标签。接着选择“unified sniffing”并点击 `O`。我们将使用 `eth0` —— 以太网连接。

    6. 在菜单栏点击“hosts”，然后点击“scan for hosts”——网络将扫描可用的主机。

    7. 在菜单栏点击“hosts”，然后点击“hosts list”——这将显示网络上有多少个可用主机。这还将显示默认网关地址。

    8. 下一步是选择你的目标。在 `MITM` 中，主机是目标，经经路径将是转发流量的路由器地址。黑客将拦截并嗅探网络上的所有数据包。我们将受害者称为“target
    1”，路由器地址称为“target 2”。

    9. 在我们的练习中，目标 `IP` 是 `192.168.121.129`，路由器将是 `192.168.121.2`。将 target 1 添加为受害者
    `IP`，target 2 添加为路由器 `IP`。

    10. 点击 `MITM`，然后点击 `ARP Poisoning`。确保“Sniff Remote Connections”选项已启用并点击 OK。

    11. 点击 Start，然后点击 Start Sniffing……`ARP 投毒` 现在将开始，显示 `NIC` 已切换到混杂模式，从而能够对所有本地流量进行嗅探。


    你可以在 `Ettercap` 的工具栏中看到结果。


    `ARP 投毒` 可能导致公司遭受巨大损失，大多数道德黑客受公司雇佣，通过保持网络安全来防止这种情况的发生。


