    Think of a chess game you are playing. It’s your move and you are thinking very
    hard about the moves your opponent could potentially make, as far ahead as you
    possibly can. Is your queen fully protected? Have you left your king open to attack?
    This is what a security researcher does when he is designing threat models. A
    threat model is a term used to describe what capabilities a hacker has and what
    you need to guard against, together with the vulnerabilities of the system. For
    example, if you were an activist who wanted to protect your system against a state
    attack team, you would need to ensure that it was pretty strong whereas, if you
    were just securing the network at your woodland cottage, out in the middle of
    nowhere, although it would need to be secure, it wouldn’t be such a tough job.


    ## Token

    A `token` is a physical device that gives the owner the ability to authenticate
    or log in to some service. For example, a `token` could provide security additional
    to a password. The idea behind it is that, should the password or the crypto key
    be stolen, the hacker couldn’t get in without the physical `token`.


    ## Tor

    Tor stands for `The Onion Router`. Developed in the US Naval Research Lab, Tor
    is now used by hackers and some journalists and activists, to hide their online
    activities, making them anonymous. The idea is that there are a series of computers
    on a network that will take your traffic on a strange journey to hide your real
    location. The Tor network is run by volunteers and is part of a nonprofit project.


    ## Tails

    This is short for `The Amnesic Incognito Live System` and it is the operating
    system that Edward Snowden endorsed. Being an amnesic system, your computer will
    not remember anything and, whenever you boot up, it will be as if you were using
    a completely new system. It is free and it is open source but it does have a few
    security flaws of its own.


    ## V

    ### Verification (dump)

    Verification is a process used by security researchers and reporters to soft data
    that has been hacked to ensure it is legitimate data. This process is vital to
    making sure that the data is, in fact, authentic and that the claims made by anonymous
    hackers are real and not just a way of scamming users on the dark web.


    ### VPN

    A `VPN` is a `Virtual Private Network` and these make use of encryption methods
    to connect you securely and privately to the intent without revealing your identity
    and true location. They are not just used by people who want their connection
    protected; sometimes employees will use them to connect remotely to the network
    their employer uses and they bounce a connection off a server that is located
    elsewhere in the world.


    ### Virus

    A `virus` is a kind of computer malware that is hidden in a file or a program.
    Whereas a `worm` can spread by itself, a `virus` requires human intervention,
    `i.e.* forwarding an email that is infected. A `virus` can embed itself in a computer
    and steal, delete, encrypt, or otherwise mess with data in just about any way
    you can think of.


    ### Vuln

    Short for `vulnerability`, this is just a way of talking about flaws or bugs that
    a hacker can exploit.


    ## W

    ### Warez

    Pronounced “where is” this is referencing software that has been pirated and is
    generally distributed through `Usenet`, `BitTorrent` and other similar technologies.
    Often `warez` will be full of malware, preying on the inherent desire that some
    people have for getting their software for free.


    ### White hat

    An ethical hacker, one who finds flaws in a system with the goal of fixing the
    flaw and providing protection to the system from a black hat hacker.


    ### Worm

    A type of malware that can replicate itself and spread between computers. Unlike
    the `virus`, it doesn’t need help from a human hand.


    ## Z

    ### Zero-day

    Sometimes called `0day`, this is a bug that the vendor of software is unaware
    of or has not patched yet. The name is derived from the thought that there are
    0 days between the discovery of and the first exploit of the bug. These are the
    most prized of bugs because no fix has been deployed and they are pretty much
    guaranteed to be up and working.


    # Conclusion

    Thank you for reading my guide, I hope that you found it helpful and that you
    now understand a bit more about ethical hacking and what it’s all about. The practical
    examples in this book are not complex; they were designed for beginners like you,
    as a way of introducing you to the subject and getting you used to doing it.


    Your next step is to take your learning further. There are plenty of online courses
    and tutorials, not to mention libraries full of useful books that you can utilize
    to deepen your understanding and improve your knowledge.


    I must just say that you should NOT use any of of what you learn in an unethical
    or illegal manner. The idea behind ethical hacking is 1) to help you learn how
    to keep your own system safe and 2) give you an idea of what to expect if you
    decide to go down the path of ethical hacking for a living.


    If you enjoyed this guide, please leave a review for me at [Amazon](https://www.amazon.com/dp/B07NSRW9FZ)
    and good luck in your journey to becoming a top ethical hacker.


