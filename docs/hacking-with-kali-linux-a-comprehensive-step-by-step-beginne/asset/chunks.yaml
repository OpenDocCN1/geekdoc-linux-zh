    DDoS 攻击在过去几年中变得非常流行，因为它们非常容易实施且效果立竿见影。它是分布式拒绝服务（Distributed Denial of Service），指的是黑客利用几台计算机向目标发送数据或数据请求，导致目标被淹没，从而使其变慢或完全崩溃。


    ## 深网

    有时，“深网”（deep web）和“暗网”（dark webs）被指代同一个东西，但它们是两个不同的概念。深网是另一部分，包含了未被 Google 或其他搜索引擎索引的网站，包括付费网站、数据库、受密码保护的页面等。


    ## 数字证书

    数字证书用于证明网站、个人或在线服务的身份。从更具技术性的角度来说，它们证明了某人、`etc.` 拥有无法伪造的加密密钥。网站通常使用它们来确保你的访问是加密的，并且通常会在浏览器地址栏中以锁的形式显示。


    ## E


    ### 加密

    这是一个将消息或数据乱码以使其不可读的过程。它被公司、个人以及数字安全领域广泛使用。


    ### 端端加密

    一种特定的加密类型，数据或消息在的一端加密并在另一端解密。理论上，只有发送者和接收者可以读取它。


    ### 恶毒女仆攻击 (Evil maid attack)

    这是一种需要物理接触计算机的攻击，以便安装软件来跟踪用户并获取加密的敏感信息。


    ### 漏洞利用 (Exploit)

    漏洞利用是指利用应用程序或计算机中发现任何漏洞或缺陷的方法。并不是每个漏洞都能被利用，但在可以被利用的漏洞中，黑客会决定多种方法中的哪种是最好的。


    ## F


    ### 取证

    在刑事取证中，通过一系列步骤来确定犯罪发生时发生了什么。在黑客领域，取证人员寻找的是数字指纹而非物理指纹。他们使用某些过程，尝试从计算机、手机、服务器 `etc.`
    等设备中获取信息，这些设备被怀疑被黑客使用或滥用。


    ## G


    ### GCHQ

    美国国家安全局（NSA）的英国版本。GCHQ 代表政府通信总部，他们关注外国情报，特别是网络安全和恐怖主义威胁。他们还调查儿童色情交易。


    ## H


    ### 黑客

    “黑客”一词已成为非法入侵系统或网络的同义词，但这是错误的。最初的黑客是为了学习而这么做，虽然现在有很多不择道德的黑客，但也有很多好人想要修复问题，让坏人无法进入。


    ### 黑客行动主义者 (Hacktivist)

    黑客行动主义者是指黑客技术进行政治用途的人。他们可能不会做大事；可能只是篡改政府公共网站，或者他们会大动作，从政府窃取敏感数据并发送给公民。匿名者（Anonymous）是最著名的黑客行动主义团体例子。


    ### 哈希处理 (Hashing)

    假设你有一个想要保密的密码或其他另一段文本。你可以将其保存在文件中并隐藏在计算机中，但如果黑客获取了它，他们就有了你的数据；这意味着对你来说是大麻烦。哈希是一种保持信息秘密的方法；它通过程序执行特定函数完成，结果是将原始信息隐藏在一串乱码中。组织经常用它来存储脸识别数据和密码，以使其更安全。


    ### HTTPS/SSL/TLS

    HTTPS 是超文本传输安全协议（Hypertext Transfer Protocol Secure）的缩写，这是用于控制跨互联网数据传输的框架。HTTP
    是普通版本，而 HTTPS 增加了一个额外的加密层，告诉你是该网站是安全的。HTTPS 使用 TLS 和 SSL 协议来保持连接安全，并证明该网站是真实的。


    ## I


    ### 信息安全

    这是“information security”（信息安全）的缩写，通常被称为网络安全。


    ## J


    ### 越狱 (Jailbreak)

    越狱是指绕过游戏主机或手机等设备的安全性，以突破制造商设置的限制。其目标通常是运行非官方软件。


    ## K


    ### 密钥

    在现代密码学中使用了数字密钥。在 PGP 加密中，使用公密钥对消息加密，使用私密钥进行解密。其他系统可能有一个由所有相关方使用的单一密钥。无论哪种，如果黑客可以获取解锁或解密数据的密钥，他们就可以访问它。


    ## L


    ### Lulz

    LOL 的在线版本，倾向于在不择道德或黑帽黑客群体之间使用。他们将其作为对公司或个人进行进行的攻击行为的合理化理由。


    ## M


    ### 恶意软件 (Malware)

    Malware 通常是“恶意软件”的统称，指的是任何可能具有恶意、且纯粹为了攻击和破坏目标的程序或部分软件。流行的例子包括特木马、病毒、勒索软件、蠕虫、间谍软件、广告软件等。


    ### 中间攻击 (Man-in-the-middle)

    通常称为 MiTM，这类攻击非常常见，涉及黑客将自己置于两个用户之间并冒充他们的身份。有时黑客只会监听通信，但某些情况下，他们会参与并更改数据流以符合其目的。


    ### 元数据 (Metadata)

    这仅仅是“关于数据的数据”。例如，如果你发送了一封电子邮件，文本就是邮件内容，而发送者和接收者地址以及发送日期就是元数据。如果黑客能够获取足够的元数据，他们就能很容易发现一个人的身份和位置。


    ## N


    ### NIST

    NIST 代表美国国家标准与技术研究院（National Institute of Standards and Technology），是美国商务部的一个部门，负责开发联邦政府使用的信息安全（InfoSec）标准。这意味着他们是应对现代威胁的最佳加密方法的权威机构。


    ### 随机数 (Nonce)

    “number”（数字）和“once”（一次性）的结合，字面意思是只使用一次的数字。Nonce 是系统生成的数字字符串，用于识别单次会话或任务的特定用户。一旦完成，该数字将不再再次使用。


    ## O


    ### 运作安全 (OpSec)

    运作安全（Operational Security）的缩写，关于确保信息在在线和离线状态下秘密。它曾是一个军事术语，关乎识别需要保密的信息以及这些信息需要对谁隐藏。


    ### OTR

    如果一个人需要进行必须加密的对话，但需要快速完成，他们会使用一种名为 OTR 的协议。意思是“不记录”（off the record），它将为即时消息提供端到端加密。由于
    PGP 主要用于电子邮件（每个人都有自己的密钥），而 OTR 会为每次相关的对话提供一个临时的密钥，使其免受黑客攻击。


    ## P


    ### 密码管理器 (Password managers)

    人们犯的最严重的错误是对所有账户都使用同一个密码，而且通常这密码本身也不是一个非常好的密码。黑客只需要获取你其中一个账户的访问权限，就可以进入所有账户。然而，尝试记住几十个不同的密码并不容易，这正是密码管理器的用场。这是一种跟踪你所有密码的软件，在需要时甚至可以生成复杂且很长的密码。你唯一需要记住密码的是进入密码管理器的主密码。


    ### 渗透测试 (Penetration testing)


