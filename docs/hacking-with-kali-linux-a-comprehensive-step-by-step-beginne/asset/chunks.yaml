    # Threat

    - Threat - an indication that there is the potential for danger inside a system,
    particularly information systems. A good example of a threat is an agent hacker
    or even an employee who has a grudge against the company. Malicious software may
    contain spyware and viruses that can bring a computer network to its knees.


    You might think that your wireless network is completely safe and that there isn’t
    anything going on but there are always opportunities and there are always hackers
    to exploit those opportunities. Some of the biggest risks on a wireless network
    include:


    * Stolen passwords

    * Someone who has total access to all files transmitted from a server

    * Backdoors that let a hacker into the network

    * Emails that get intercepted

    * Service attack rejections, leaving to serious downtime and loss of productivity

    * Breaking the international, federal and/or state laws regarding privacy and
    financial reporting for businesses

    * Spamming

    * Zombies - these are hackers who get into your system to use the network to exploit
    another network


    The biggest problem is that wireless networks are portable and they can work anywhere
    and that means you have no idea where an attack may come from; it could be the
    person sat next to you in the coffee shop, it could be your next door neighbor.
    Without the right tools at your disposal, stopping an attack is virtually impossible.


    ## Know the Enemy

    Wireless network vulnerabilities are not necessarily major disadvantages. The
    biggest problem is the unethical hacker who take the time and puts in the effort
    to exploit those weaknesses. Their goal is to make life difficult for you and
    to gain something out of it for themselves. That’s where the old saying, “to track
    a thief, you must think like one” comes in - if you are going to protect your
    own system then you need to think as an unethical hacker does.


    If your system requires little in the way of work to get into it, it is a better
    target for a hacker than a system that is locked up tight. They tend to go for
    organizations with few access points and there are several good reasons for this:


    * Systems that don’t have many access points are highly likely to have left the
    default settings as they are and that makes hacking in a great deal easier

    * A smaller organization is not likely to have the time or the admin available
    to keep a watch on operations

    * The smaller networks are unlikely to have a high level of controls or checks
    in place, like `WPA`, `WPA2`, or `WID` (Wireless Intrusion-Detection System).
    These are the first point of access for any hacker.


    However, it isn’t only the small networks that are vulnerable. Networks of all
    sizes can be attacked and there are other vulnerabilities that a hacker can play
    about with, such as:


    * Not all organizations have sufficient time or network admin to monitor the network
    for malicious behavior

    * Wireless networks are extensions of a wired network; wherever an access point
    is, there is likely to be a wired network behind it

    * Traffic in and out of a network is one of the biggest weaknesses; in the larger
    networks, it is far easier for a hacker to crack the `WEP` encryption keys - more
    traffic means more packets are being sent to the server and that means more packets
    to be captured and analyzed by the hacker. In turn this speeds up the time taken
    to crack the `WEP` encryption.

    * `SSIDs`, or Service-Set-Identifiers are usually set as a recognizable name,
    either that of the company or a specific department or person’s name. This provides
    a hacker with the information needed to determine where to attack first.


    ## Understanding the Complexities of Wireless Networks

    Installing and enabling a firewall, creating really strong passwords, even having
    complex settings for access control are not sufficient to remain protected at
    all times. As well as the standards and the vulnerabilities that we already talked
    about, you need to understand that the biggest obstacles to full security are
    the complexities of the network.


    The `IEEE 802.11` protocols were never developed as the perfect system and they
    never will because they themselves have some quite big problems to overcome. Unlike
    the wired Ethernet system, wireless networks don’t just allow you to press a button
    and send or receive information; they are far more complex than using simple radio
    frequency to send and receive data packets:


    * They encrypt the data to ensure it stays private

    * Clients responsible for authentication have to be sure that only authorized
    persons have access

    * They have to set timing message packets to make sure that everything is synchronized
    correctly and there are no conflicts in data transmission

    * They must check the integrity of all data to ensure none of it is contaminated


    On top of all that, the network design for the `802.11` protocol means even more
    complexities:


    * Ensuring that wireless devices are kept up to date and this means mobiles, laptops,
    desktops, smart TVs, anything that connects via a wireless network

    * Determining which antennae are needed and where they need to be placed

    * Knowing which devices are allowed on the network and which shouldn’t be there

    * Adjusting the settings for signal power to prevent frequencies from leaking
    outside the authorized area


    All of these different complexities provide more weaknesses than the traditional
    wired network ever saw.


    ## Analysis of Protection

    We will get to the practical side very shortly but first, before you can protect
    your system, you need to be able to inspect it. You need to understand where the
    vulnerabilities are before you can hack into them and the results that you will
    get from your inspection will tell you everything you need to know not least how
    big those vulnerabilities are and whether they can be fixed or not. You can take
    the following countermeasures to tackle whatever vulnerabilities you do find:


    * Non-Technical Attack - used for the exploitation of human weakness, such as
    carelessness, not being aware, being too trusting, etc.

    * Network Attacks - could include installing false wireless access points, and
    other tricks that try to convince a network client to connect with the rogue

    * Software Attacks - security concerns are never-ending and that includes all
    applications and software installed on a wireless network system and the operating
    system.


    This last is a very common method of attack and software attacks may include:


    * Cracking `WEP` encryption keys

    * Exploiting weak authentication to get into a wireless network

    * Using default passwords to get into a network, where the default sha have been
    left unchanged and obtaining `SSIDs` to use for access


    ## Hacking a Wi-Fi Network - Practical Guide

    `Kali Linux` is a versatile tool and can be used for a lot of different things
    but it is best known for hacking into Wi-Fi networks or penetration testing. There
    are quite literally hundreds of different tools that claim to be able to do this
    - don’t fall for it. If you want to do it properly, use `Kali`. Most of the tools
    you see advertised are likely to be scams; they are released by hackers who want
    to draw you into a situation where they can hack your system. The only real way
    to hack into a Wi-Fi network is to use `Kali Linux`, a wireless card that is equipped
    with Monitor Mode and a tool called `aircrack-ng`, or a similar one - we’ll be
    using `aircrack-ng`.


    You also need to be aware that, even using the correct tools, this is not a game
    and hacking, even ethical hacking, is not something to be messed around with.
    You need to have, at the very least, a basic idea of the way that `WPA` authentication
    works and some idea of how `Kali` works along with its tools.


    What You Will Need:


    * `Kali Linux`

    * A Wi-Fi adaptor that can inject and monitor code. Some systems already have
    this as standard but, if not you will need to purchase another one

    * A wordlist for password cracking - there are some built into `Kali`

