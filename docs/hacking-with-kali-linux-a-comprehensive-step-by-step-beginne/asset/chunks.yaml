    and feel free to tell me what you think! Thanks a lot!


    # Part Three: Practical Hacking


    ### Wireless Network Hacking


    Every day, new improvements happen in the world of technology. Virtually all offices,
    hotels, cafes, restaurants and homes have got a Wi-Fi network installed, also
    known as `WLAN`, or `Wireless Local Area Network`. These networks are incredibly
    versatile and adaptable simply because they make life easier and more comfortable
    for people. They are mobile, they are cheaper and most people can afford to have
    and use them. `WLAN` is also far easier to install and implement than a wired
    network but, despite the fact that reaches far and wide, one question remains
    - how safe is it?


    Wi-Fi networks are based on a specific set of `WLAN` standards - `IEEE 802.11`.
    The `IEEE`, or `Institute of Electrical and Electronics Engineers`, was formed
    in February of 1980 and the “11” is referencing the working group for `WLAN`,
    a subgroup of “802”.


    The demand for Wi-Fi networks has grown considerably over the years and virtually
    everyone uses a `WLAN`, whenever they use any operating software including mobile.
    One thing that should be at the forefront of everyone’s minds is that no computer
    network is ever going to be completely safe. While the fact that this technology
    is so widespread is good news, it also means that there are far more dangers now
    than there ever were. Regardless of the size of the `IEEE` group, wireless networks
    are now one of the biggest targets in the world.


    At one time, the most common problems in terms of a wireless network were spyware
    and weak passwords. While these definitely do still exist and are still on the
    rise, `WLAN` has opened up a whole new set of vulnerabilities and that’s where
    the white hat or ethical hackers come in, to defend against the black hats.


    Ethical hacking is more than a simple name; it is penetration testing, it is vulnerability
    testing and it is security. An ethical hacker needs to be able to see into the
    future, to plan ahead and use the same tools that a black hat hacker uses but
    they will use those tools against them, to stop them from attacking a system.


    We’re going to concentrate in this section on vulnerabilities that affect the
    wireless networks and how you can hack into them, ethically of course, to secure
    and protect them from an unethical attack.


    ### Testing Your System


    Wireless networks have never been fully secure, not from day one, and likely never
    will be. There are far too many potential weak spots, including flaws in encryption,
    problems with authentication, physical security issues and so on. There are also
    a whole host of tool that you can use to test your system and close up the holes
    where needed and two security standards have emerged to help protect wireless
    networks and fight against hackers - `Wi-Fi Protected Access` and `IEEE 802.11`.


    Wi-Fi Protected Access or `WPA` as it is known, was developed by the `Wi-Fi Alliance`
    and was meant as a way of fixing vulnerabilities in `WEP` and it was used until
    `IEEE 802.11` was developed. This standard is also called `WPA2` and was developed
    to incorporate the fixes from `WPA` with other mechanisms covering encryption
    and authentication, which, in turn, helps promote the security of the network.


    Between them, the two standards managed to fix a good many of the security issues
    surround wireless networks but there is one thing they can’t fix - human beings.
    While the security standards may work perfectly well, they will only work if they
    are correctly implemented. In some cases, IT administrators don’t do this, especially
    in cases where their network has already been configured - they don’t want to
    change all their Wi-Fi settings again. They don’t want to have to redesign their
    security mechanisms and they don’t want to implement new ones in case they make
    their management system too complicated. Yes these are very legitimate issues
    but it is this that leads to the networks being left exposed to attack.


    That said, even fully implementing the standards together with other strategies
    does not guarantee complete safety; it just reduces the risk. A computer network
    can never be 100% safe but with ethical hacking, you can learn how to protect
    yourself just that little bit more.


    ## Understanding the Risks Wireless Networks Face


    Before we go deeper into this, there are two definitions that you should be aware
    of:


    * Vulnerability - a susceptible point in the network that is open to attack. An
    example would be a system network that hasn’t been fully encrypted or where weak
    passwords are in use on the access points. An access point or `AP` is the center
    of the wireless system.

