    - DoS Attack - This means Denial of Service and this kind of attack is usually
    used to bring a website down and make it unavailable. It is done by flooding the
    website with fake traffic so it goes well over the bandwidth limit and crashing
    the server. A firewall is the best form of defense against a `DoS` attack.

    - DDoS Attack - This means a Distributed Denial of Service attack. With a `DoS`
    attack, there is a single device but with a `DDoS` attack, there are multiple
    fake devices. A firewall will work but it has to be a specific type of firewall
    such as `Cloudflare CDN`.

    - SQL Injection - SQL injection attacks are used to inject queries into website-
    databases, thus hacking the details and data stored on it.

    - Social Engineering - This kind of attack is where a person is duped into providing
    their account details or other sensitive information.


    # How to Install Kali Linux


    There are a number of ways to install Kali Linux on your computer; the way I am
    going to show you involves installing it in a virtual machine manager called `VMWare`.
    It works with all major operating systems and it’s used to partition a physical
    server into several virtual ones.


    ### Step One

    Go to [http://kali.org/downloads/](http://kali.org/downloads/) and download Kalie
    onto your computer.


    ### Step Two

    Go to [https://www.vmware.com/](https://www.vmware.com/) and download `VMWare`
    onto your computer.


    ### Step Three

    When all the downloads are done, open `VMWare` and click on `Create` so a new
    virtual machine is created. A window will open, click on `Installer Disc Image
    File (ISO)` and find where you downloaded the `Kali ISO` file; click on the file
    and then click on `Next`.


    ### Step Four

    Name your virtual machine - for the sake of this, call it `Tutorial Kali` - and
    then choose where you want to save it. The best option is to create a new folder
    in My Documents called `Virtual Machines`. Do that and then click on `Next`.


    ### Step Five

    Choose the minimum size you want for `Kali`, make it at least `30 GB` because
    `Kali` will grow over time. Enter your value and where it says `Store Virtual
    Disk`, choose `Single File` and click on `Next`.


    ### Step Six

    Now we need to make some changes to the hardware settings; click the button for
    `Customize Hardware` and a Hardware window will open. Go to the left-hand pane
    and choose `Memory`; slide the slider to `512 MB` (always give a virtual machine
    `50%` of the RAM installed on your machine as a maximum. For, example, if you
    have `4 GB RAM`, the slider should go to no more than `2 GB`).


    Next, click `Processors`. How you answer this will depend on your system setup.
    If you have more than processor, choose two or more but if you only have a one
    or two processors, leave it as one.


    Now click `Network Adaptor` and move the dot to the top option, which is `Bridged`.
    Then click `Configure Adaptors`. Uncheck every box in the window except the one
    beside your network adaptor; click on `OK`.


    Lastly, click `Close` (bottom of the window) and click on `Finish` in the setup
    wizard.


    ### Step Seven

    Your newly created virtual machine file will now be placed in the VM library and
    all you have to do now is open `Kali` and get it installed. Go to the location
    of the new VM file and click it; in the right pane, click on `Play Virtual Machine`.
    `Kali` will start up.


    ### Step Eight

    Use your keyboard arrow keys to navigate to `Graphical Install` in the boot menu
    and then press the `Enter` key.


    On the next screen, choose your language and click on `Continue`.


    Choose your location and click on `Continue`.


    Now you need to choose your standard keyboard; if you are using the US English
    one, just click on `Continue`.


    Wait for a bit because `kali` needs to detect all of your computer hardware; if
    you see a screen appear during the process, just click on `Continue` and then
    check the box for `Do Not Configure This Network`.


    When `Kali` is done, you will be asked for a `hostname`, just a computer name.
    Type in anything you want or leave it as `Kali`, it’s up to you. Then click on
    `Continue`.


    Next, input a password for the `root` account and make sure you remember what
    it is. If you ever forget it, you have to start over from scratch, reinstalling
    `Kali` again. Confirm your password and then click on `Continue`.


    Choose your time zone and click on `Continue`.


    Now you need to wait again because `Kali` needs to detect the partitions on the
    disk. On the next step, click on `Guided - Use Entire Disk` and then click on
    `Continue`.


    When the installer asks you to confirm your partition choice, click on `Continue`.


    You will now be asked one more question about the partition; click on `All Files
    In One Partition` and then click on `Continue`.


    Click on `Finish Partitioning` to confirm everything and get the changes written
    to disk. Then you can click on `Continue`.


    Confirm that these changes are correct by clicking on `Yes` and then `Continue`
    for the final time and `Kali` will begin to install. You now need to be patient
    because `Kali` can take `30 minutes` or more to install. Do NOT touch your computer
    while the installation is ongoing.


    ### Step Nine

    When `Kali` has installed a window will pop up asking about `Network Mirrors`;
    click on `No` and then `Continue`.


    Wait and after a couple of minutes, you will be asked if you want the `GRUB` boot
    loader installed; click on `Yes` and then on `Continue`.


    `Kali` will finish installing and you will see a notification message; click on
    `Continue` and `Kali` will restart.


    Log in using the credentials you created earlier in the process.


