    这通常被称为渗透测试（pen-testing），是一个测试系统以检查是否存在安全漏洞的过程。基本上，渗透测试人员会使用与黑客客相同的方法来进入系统并寻找弱点。他们要么会修复这些漏洞，要么将它们报告给系统所有者。


    ### PGP


    `PGP` 代表“良好的隐私保护”（pretty good privacy），它是用于数据加密的方法之一。它通常用于电子邮件，任何拦截这些数据的人看到的都只有乱码。`PGP`
    利用了非对称加密；这意味着发送者使用公钥对信息进行乱码，而接收者则使用私钥进行解密。这项技术已有 20 多年的历史，它仍然是最强大的加密方法之一，尽管使用起来非常困难。


    ### 钓鱼（Phishing）


    这是一种社会工程学，并不是真正的黑客攻击。攻击者会试图从目标那里获取某些信息，这些信息他们可能在日后使用。他们通过假装成 Facebook、Google 甚至受害者使用的手机运营商的客服人员来实现这一点。他们可能会要求目标点击消息或电子邮件中的链接（恶意链接），或通过电子邮件发送密码等信息。通常，攻击者会发送数千封邮件，希望能获得一两个回信；但有时他们会有更特定的目标，使用一种名为“鱼叉式钓鱼攻击”（spear
    phishing）的手段。


    ### 明文（Plaintext）


    顾名思，这就是未经加密的纯文本，就像你在这里阅读的内容一样，有时被称为明文（cleartext）。一些安全措施不良的公司会以明文存储密码和其他敏感数据，这使得黑客极易入侵并窃取它们。


    ### Pwned


    这是电脑极客用来代替动词“own”（拥有/击败）的术语。例如，如果一个玩家在视频游戏中击败了另一个玩家，他会说他“pwned”了对方。这在黑客术语中的意思非常相似，但黑客不是在玩游戏，而是获取他人网络或计算机的访问权限。


    ## R


    ### RAT


    这是远程访问工具（Remote Access Tool）或有时称为远程访问木马（Remote Access Trojan）的缩写。当它们被用作恶意软件时，是一个非常可怕的前景；任何能在你的电脑上植入
    `RAT` 的攻击者都有潜力接管你的机器。最糟糕的是，这些工具可以在互联网地下世界购买或免费获得，这意味着即使是完全没有技术的黑客也可以使用。


    ### 勒索软件（Ransomware）


    这类恶意软件一旦被安装，就会锁定计算机并让你无法访问自己的文件。屏幕会显示一条消息，告诉你需要向黑客发送特定金额的资金，并提供支付地址；这通常要求用比特币支付。随着越来越多的黑客这么做，这已经变成了一种流行病现象；许多人乐意支付赎金以换回自己的电脑。


    ### 彩虹彩表（Rainbow table）


    这是黑客使用的较复杂的技术之一，用于猜测隐藏在哈希中的密码。


    ### 红队（Red team）


    一些组织会聘佣若干黑客组成一个“红队”。这样做是为了发现他们系统中的漏洞，团队会对系统进行一系列攻击，试图完全接管它。这是伦理黑客攻击的最佳体现，因为组织可以在未经授权的人进入之前修复漏洞。


    ### Root（根）


    在几乎所有的计算机系统中，“root”都是具有最高权限的账户。


    ### Rootkit（根内核）


    Rootkits 是深留在系统内部的特定恶意软件。它们很难被检测，并且可以从外部或内部执行。


    ## S


    ### 加盐（Salting）


    加盐是指黑客向密码中添加额外数据，使其更难破解。


    ### 脚本小子（Script kiddies）


    这是一个用来描述缺乏技术专长并使用现有工具的黑客的术语。


    ### Shodan


    `Shodan` 是一个搜索设备的搜索引擎。它经常被用于不道德的目的。


    ### 签名（Signature）


    这是一种用于验证信息真实性的数字签名。


    ### 侧信道攻击（Side channel attack）


    你的计算机及其组成的所有硬件都会发出持续的信号流。侧信道被发现计算机正在执行的操作模式。


    ### 嗅探（Sniffing）


    嗅探是一种使用特殊软件拦截网络数据的方法。一旦收集到数据，嗅探器就会对其筛选。


    ### 社会工程学（Social engineering）


    并不是所有的黑客都整天盯着满绿色文字的屏幕！有时，访问系统最简单的方法是拨电话或发送电子邮件，假装成另一个人。


