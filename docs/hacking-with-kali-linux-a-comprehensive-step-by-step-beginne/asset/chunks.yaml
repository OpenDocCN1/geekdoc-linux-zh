    Tip - Use a VPN or a secure proxy to hide your system so that you can keep your
    identity and system safe.


    ## Port Scanning


    We’ve seen what information the Nmap command can provide us. The command will
    list all of the ports that are open on a specified server:


    Port State Service


    22/tcp open ssh


    80/tcp open http


    443/tcp open https


    3306/tcp open mysql


    You can also use another command to see if a specific port has been opened or
    not:


    $nmap -sT -p 443 the name of the website


    You will get a result similar to this:


    Starting Nmap 10.52 (http://nmap.org) at 2018-10-04 12:19 CDT


    Nmap scan report for the name of the website (55.123.45.678)


    Host is up (0.000067s latency).


    Port State Service


    443/tcp open https


    Nmap done: 1 IP address (1 host up) scanned in 0.04 seconds


    As soon as a hacker learns of the open ports, they can the determine the different
    techniques for attacking through each port.4


    Tip - Make sure you regularly check on all ports and close any that you don’t
    want open. This will minimize the risk of a malicious attack on your own system.


    Ping Sweep


    A ping sweep is a technique for scanning networks. You can use it to find out
    which IP address from a whole range of them maps to a live hosts. You will also
    see this called an ICMP sweep.


    The command to use for a ping sweep is fping and it is similar to a ping program
    which uses ICMP, or Internet Control Message Protocol, echo requests to see if
    a host is up or not.


    The fping command is not the same as ping; the former allows you to specify however
    many hosts you want on the command line or a file that has list of the hosts you
    want to ping. If a host fails to respond inside a set time limit or a retry limit,
    it is considered to be down or unreachable.


    Tip - you can disable ping sweeps on your network by blocking all ICMP ECHO requests
    that come from external sources. You do this by typing the following command at
    your command prompt - this results in a new firewall rule being created in iptable:


    $iptables -A OUTPUT -p icmp —icmp-type echo-request -j DROP


    DNS Enumeration


    Your DNS or Domain Name Server is much like an address book. It is used for translating
    IP addresses, such as 123.456.7.890 into a website address name and for translating
    names into IP addresses.


    We use DNS enumeration when we want to find DNS servers and the records that correspond
    to them for a specified organization. The idea behind it is to find as much information
    as you can on a target before you start your attack.


    The command to use is dnslookup to find the servers and their information.


    ## Sniffing


    Sniffing is when we monitor packets that pass through a specified network and
    capture then using a set of sniffing tools. You can think of it as being much
    like wiretapping to listen in on a conversation.


    There is a lot of potential with sniffing; for example, if there is an entire
    set of open enterprises switch ports, an employee could sniff all traffic that
    goes through that network. Anyone who is in the same location (physical) can use
    an Ethernet cable or Wi-Fi to connect to the network and sniff the traffic.


    With sniffing you can see all kinds of unprotected and protected traffic. If the
    conditions are right and the correct protocols are there, a hacker may be able
    to gain information that can be used in later attacks or to cause a lot of problems
    for the owner of the network or system.


    It is possible to sniff the following information:


    * Chat sessions


    * DNS traffic


    * Email traffic


    * FTP passwords


    * router configuration


    * telnet passwords


    * Web traffic


    How Sniffing Works


    Sniffers usually turn a system NIC or network interface card onto “promiscuous
    mode” so that it can listen to any of the data that gets transmitted. “Promiscuous
    mode” is referring to the unique method by which NICs and other Ethernet hardware
    receive traffic, even traffic that isn’t meant for the NIC. By default, an NIC
    will ignore all traffic that isn’t specifically addressed to it - it does this
    by looking at the packet destination address and the MAC or hardware address of
    a device and comparing them.


    Sniffers can monitor traffic on a continuous basis by decoding all the information
    contained in the data packets.


    Different Types of Sniffing


    There are two main types of sniffing - active and passive.


    * Passive


    With passive sniffing the network traffic is locked but it does not get changed
    in any way as only listening is allowed. Passive sniffing works with Hub devices;
    on these the traffic gets sent to every port and, in a network where a Hub is
    used for connecting systems, every network host will be able to see any traffic.
    That makes it easy for a hacker to capture the traffic. As most of today’s networks
    use switches and not Hubs, passive sniffing is rarely effective.


    * Active


    With active sniffing, the traffic is locked, monitored and can be changed as the
    nature of the attack dictates. This method tends to be used for sniffing switched
    networks and it injects ARP (address resolution packets) into the target network;
    the idea is to flood the switch CAM (content addressable memory) table. This table
    tracks the hosts and the ports they are connected to.


    These are the active techniques in use today:


    ARP Poisoning


    DHCP Attacks


    DNS Poisoning'
