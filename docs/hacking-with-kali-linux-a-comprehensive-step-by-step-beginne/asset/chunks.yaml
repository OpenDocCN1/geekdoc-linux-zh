    # Kali Tools


    One of the main reasons why `Kali` is such a popular choice for security professionals
    and for hackers is the huge suite of free tools it offers. Right now, there are
    more than `300 tools`, including those for vulnerability assessment, passive information
    gathering, network analysis, cracking passwords, hacking wireless networks and
    a very powerful suite of tools for exploitation. These are some of the most popular
    tools and the ones that you are most likely to start out using:


    ### Metasploit Framework

    This is one of the most popular exploitation platforms in use today and it has
    a number of useful tools for analysis and for penetration testing. There are several
    user interface options and users can attack just about any operating system using
    these tools.


    ### Armitage

    Also included in `Kali` is `Armitage`, which is a graphical management platform
    used for helping users to organize interactions and operations between several
    `Metasploit` tools while an attack is ongoing.


    ### Wireshark

    `Wireshark` is a very popular analysis tool for network traffic. It works on multiple
    platforms and it works in real-time. All the traffic on a specific network node
    will be captured and then split down into packet metadata. This will include the
    header, the payload and the routing information. `Wireshark` is used for the detection
    and analysis of network security events and for finding out why a network has
    failed and where.


    ### John the Ripper

    This is one of the most legendary of all the password cracking tools and it is
    full of algorithms for attacking passwords. It was written for `Unix` only but
    now works on several major platforms. The feature that everyone uses it for is
    the feature that lets it automatically detects the ‘hash` type password encryption.
    There is also a commercial version of the tool, which does much more, but the
    free one on `Kali` is more than sufficient for most people.


    ### Nmap

    Short for `Network Mapper`, `Nmap` is one of the most common of the hacking tools
    used for penetration testing. The tool allows users to scan networks and look
    for all the network services and hosts connected to it. It then provides a highly
    detailed map of the structure of the networks and all its members. Along with
    that, it will tell you the operating system installed for each host along with
    the open ports, allowing users to find the known vulnerabilities very quickly.


