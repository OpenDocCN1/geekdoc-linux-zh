    `Aircrack-ng` 是渗透测试和无线分析的首选包。它专注于三个主要的 Wi-Fi 协议 - WEP（有线等效隐私）、WPA（无线网络保护访问）以及
    WPA2-PSK。该工具提供了数据包注入、无线数据包嗅探、加密密码破解和无线网络分析功能，并且支持监听模式（monitor mode）功能的网络接口硬件。


    ## BurpSuite


    BurpSuite 是一套专注于 Web 应用攻击的完整工具包。这些程序将相互协作，测试应用程序是否存在任何漏洞并启动攻击。


    这并不是 Kali 中包含工具的完整列表，但这些是最重要的工具，代表了 Kali 在计算机安全（特别是渗透测试）方面的强大力量和灵活性。


    我们对黑客基础知识和 Kali 的介绍到此结束；在下一节中，我们将深入研究道德黑客，并提供一些示例供您亲自尝试。


    # 第二部分：道德黑客流程


    和每一个良好的流程一样，道德黑客也有一系列阶段，这些阶段对于黑客遵循至关重要，以确保他们的道德攻击结构合理。


    主要有六个阶段：


    * **侦察 (Reconnaissance)** - 这是初始信息收集阶段。攻击者将通过主动或被动方法寻找有关目标的信息。在此阶段最常用的工具是 `Nmap`、`Google
    Dorks`、`Maltego` 和 `Hping`。

    * **扫描 (Scanning)** - 下一阶段涉及攻击者开始探测目标（网络或计算机），寻找他们可以利用的漏洞。通常使用的工具有 `Nmap`、`Nexpose`
    和 `Nessus`。

    * **获取访问 (Gaining Access)** - 在这一步中，发现漏洞后攻击者尝试利用它来获取系统的访问。`Metasploit` 是主要的工具。

    * **维持访问 (Maintaining Access)** - 攻击者已进入系统并安装了几个后门，以便他们可以随时、随地地进出系统。同样，`Metasploit`
    是首选工具。

    * **清除痕迹 (Clearing the Tracks)** - 这部分是不道德的，因为它涉及删除黑客过程中发生的所有活动日志。

    * **报告 (Reporting)** - 在道德黑客中，这是最后阶段。攻击者将编写一份报告，详细说明他们发现了什么以及做了什么，包括使用的所有工具、是否成功、发现了哪些漏洞以及利用它们的过程。


    第一阶段侦察，是一套完整的用于发现和收集特定目标信息的技巧和流程。该阶段分为七个步骤，黑客将遵循所有步骤以尽可能地学习信息：


    1. 收集信息

    2. 确定网络范围

    3. 识别活动机器

    4. 发现接入点和开放端口

    5. 操作系统指纹识别

    6. 发现端口上的服务

    7. 映射网络


    侦察分为两个部分——主动和被动。


    ### 主动

    主动侦察涉及与目标系统直接交互，以获取尽可能的信息。然而，如果你没有访问该系统的权限，就会面临被发现的风险；如果发生这种情况，系统管理员可以采取严肃行动并跟踪你的活动，追踪你所的一切。


    ### 被动

    被动侦察不涉及与系统直接连接，用于在不与目标交互的情况下收集信息。


    ### 足迹 (Footprinting)


    这可以是主动的也可以是被动的。被动足迹的一个示例是查看公司网站。如果你尝试使用社会工程学获取敏感数据，那就是主动足迹。


    这是收集最多信息的最开始部分。攻击者正在寻找进入系统的方法，或者至少确定什么样的攻击最合适。在此部分收集的信息通常是：


    * 域名

    * IP 地址

    * 命名空间

    * 关于员工的信息

    * 电话号码

    * 电子邮件地址

    * 关于不同工作的信息


    接下来，我们将查看如何提取这些信息。对于任何连接到网的网络或系统，这些都是基础信息且易于找到的。


    #### 域名信息


    使用 [`http://www.whois.com/whois](http://www.whois.com/whois)` 来查找域名相关信息。你可以查询所有者是谁、注册商、注册日期、过期时间、名称服务器、所有者的联系信息等。


    提示 - 为了保护你的域名信息免受潜在黑客的侵害，请将你的域名资料设置为私有而非公开。


    #### 查找 IP 地址


    要查找 IP 地址信息，打开命令提示符并使用 `ping` 命令：


    ```

    $ping (网站/公司名称)

    ```


    你应该能看到类似下面的内容：


    ```

    PING website address (55.123.45.678) 68 (96).

    72 bytes from 55.123.45.678: icmp_seq = 1 ttl = 72 time = 0.028 ms

    72 bytes from 55.123.45.678: icmp_seq = 2 ttl = 72 time = 0.021 ms

    72 bytes from 55.123.45.678: icmp_seq = 3 ttl = 72 time = 0.021 ms

    72 bytes from 55.123.45.678: icmp_seq = 4 ttl = 72 time = 0.021 ms

    ```


    #### 查找托管公司


    当你获得网站地址后，可以进一步使用一个名为 `ip2location.com` 的网站来查找托管公司是谁。


    提示 - 如果你的网络或系统直接连接到互联网，没有办法隐藏你的 IP。如果你在服务器上存储了敏感信息，该服务器应该锁定在安全的代理之后。这将防止黑客获取有关你服务器的精确细节。覆盖你的
    IP 及其随之信息的另一个好方法是使用 `VPN` 或虚拟专用网络。如果配置得当，你所有的流量将通过它传输。


    #### IP 地址范围


    较小的网站通常只有一个 IP 地址，而较大的网站可能有多个，每个服务不同的域名和子域名。如果你访问美国互联网注册局（简称 `ARIN`），你可以获取与特定公司相关的
    IP 地址范围。


    #### 网站历史


    通过 [`www.archive.org/](http://www.archive.org/)，你可以获取任何网站的历史。只需在搜索框中输入域名即可获取特定时间的网站信息。


    提示 - 将网站存储在存档数据库中确实有一些好处，但如果你不希望任何人看到信息或网站如何各个阶段，你可以要求 `archive.org` 删除你的网站历史。


    #### 指纹识别 (Fingerprinting)


    操作系统指纹是指用于确定远程计算机安装了什么操作系统的方法。可以是主动或被动指纹：


    * **主动指纹** - 通过向目标机器发送特制数据包并记录返回的内容来实现。对返回的信息进行分析以判断操作系统。

    * **被动指纹** - 使用来自远程计算机系统的嗅探追踪（traces）。`Wireshark` 是此类用途的工具之一，返回的追踪可以告诉你远程主机使用的操作系统。


    要确定操作系统，需要查看四个元素：


    * `TTL` - 生存时间 - 操作系统在输出数据包上设置的值

    * `Window Size` - 窗口大小 - 操作系统设置的窗口大小

    * `DF` - 不分片 - 操作系统设置的 DF 位

    * `TOS` - 服务类型 - 操作系统是否设置了此项以及设置为何。


