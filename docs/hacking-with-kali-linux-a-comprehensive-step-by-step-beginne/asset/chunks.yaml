    We’ll use `Ettercap` again to carry out DNS poisoning. It is similar to ARP poisoning
    and, in fact, you need to begin with ARP poisoning to initial the DNS Poisoning.
    We are going to use the `dns spoof` plugin, which is in `Ettercap`.


    1. Open your terminal and input `nano etter.dns` at the command prompt. This contains
    the DNS address entries that `Ettercap` will use to resolve the domain addresses.
    We are going to add a false entry called “Facebook” so that, when a user opens
    it they are redirected to a fake Facebook page.


    2. Where it says `Redirect it to `www.linux.org``, insert the entries.


    3. Save the file and exit.


    4. Now it’s the exact same process as it is to start the ARP poisoning so once
    you get that started, click on `Plugins` and choose `dns spoof` plugin.


    5. Once this has been activated, the results will show you that `Facebook.com`
    starts up spoofed to the Google IP address whenever someone tries to open it.
    What this means is that, when a user tries to go to `Facebook`, they will open
    the Google page instead.


    ## Defending Against DNS Poisoning


    Ethical hackers are often employed to prevent attacks by securing the network
    and what you can learn as a hacker stands you in good stead to prevent the techniques
    that hackers use.


    From the perspective of a penetration tester, these are some of the defenses you
    can use against attacks like these:


    * To protect the sensitive parts of your network, use a hardware-switched network.
    This will help you to isolate network traffic to a single part of your network.

    * Prevent ARP spoofing and poisoning attacks by implementing `IP DHCP Snooping`
    on the network switches.

    * Have policies in place to stop network adaptors being switched to promiscuous
    mode.

    * When you deeply your wireless access points be very careful and aware that all
    the traffic on a wireless network is vulnerable to being sniffed.

    * Any sensitive traffic should be encrypted with `SSH`, `IPsec` or another kind
    of encryption protocol.

    * Ensure that switches that can be programmed to allow specified `MAC` addresses
    to send data and receive it on each of the ports are secured with `port security`.

    * Use `IPV` over `IPV4` as it is more secure and have more options.

    * Replace `Telnet`, `FTP` and other similar protocols with `SSH` to provide better
    defenses against network sniffing. If you can’t use `SSH`, think about using `IPsec`
    to protect your legacy protocols.

    * Use a `VPN` to provide a barrier that stops sniffers.

    * Use `SSL` where you can.


    We’ve looked at how hackers capture traffic and analyze it by using packet sniffers
    on networks. Using a real-world example, we could see that it is incredibly easy
    to gain the credentials of a specified victim on a specified network. `MAC` addresses,
    `DNS` and `ARP poisoning` are types of attack used by a hacker to sniff traffic
    and obtain sensitive data.


    In the next part, we’ll get down and dirty and start doing some ethical hacking
    of our own, starting with wireless network hacking.


