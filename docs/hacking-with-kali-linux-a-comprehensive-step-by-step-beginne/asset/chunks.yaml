    # MAC Flooding


    ## Spoofing Attacks


    ### Affected Protocols

    `TCP/IP` and other similar protocols were not designed to be secure and are perhaps
    one of the easiest doors for a hacker to get through. There are a number of rules
    that make sniffing easier:


    * `HTTP` - used for sending cleartext information with no encryption - a high-risk
    target

    * `SMTP` - short for Simple Mail Transfer Protocol, this is used for sending email.
    It is an efficient protocol but there is no protection against sniffing

    * `NNTP` - short for Network News Transfer Protocol, this is used for all communication
    types but all data and password are sent in cleartext over the network and are
    not encrypted

    * `POP` - short for Post Office Protocol, this is used for the receipt of emails
    from a server. There is no sniffing protection built-in

    * `FTP` - short for File Transfer Protocol, it is used for sending and receiving
    files but has no security. Everything is sent as cleartext

    * `IMAP` - short for Internet Message Access Protocol, this is much the same as
    `SMTP` but even more vulnerable to being sniffed

    * `Telnet` - `Telnet` is one of the worst, sending all sensitive data such as
    usernames and passwords, even keystrokes, as cleartext over the network.


    ### Sniffing Tools

    There are many tools for network sniffing and each has its own set of features
    to help you to analyze the traffic and get what you want out of the information.
    They are among the most common of the ethical hacking tools available and these
    are some of the better ones:


    * `BetterCAP` - a very powerful tool that is both flexible and portable. It was
    created with the intention of performing `MITM` (Man in the Middle) attacks on
    networks, to carry out real-time manipulation of `TCP`, `HTTP` and `HTTPS` traffic,
    to sniff out credentials and a lot more.

    * `Ettercap` - this is a complete suite for `MITM` attacks. The tools included
    allow you to sniff live network connections, filter the content as you go, and
    lots more. It has support for both active and passive protocol dissection and
    there are plenty of tools for host and network analysis.

    * `Wireshark` - one of the most popular packet sniffers offering a whole host
    of features for traffic analysis and dissection.

    * `Tcpdump` - a popular command-line tool for analyzing packets, to provide tools
    for intercepting and observing `TCP/IP` packets and others during network transmission.

    * `WinDump` - a Windows version of `tcpdump` for Linux, a command-line tool for
    analyzing header information

    * `Dsniff` - a complete suite for sniffing multiple protocols, to intercept passwords
    and reveal them.

    * `EtherApe` - designed for producing a graphic display of incoming and outgoing
    system connections

    * `MSN Sniffer` - as the name suggests, it is designed to sniff all traffic generated
    by MSN Messenger

    * `NetWitness NextGen` - a tool used by law enforcement agencies such as the FBI,
    it has a hardware-based sniffer and many other features that can monitor all network
    traffic and analyze it.


    ## ARP Poisoning

    `ARP` or Address Resolution Protocol is a “stateless” protocol is is generally
    used for the resolution of an `IP` address to a machine `MAC` address. Any network
    device that has a need to communicate on a network will broadcast an `ARP` query
    to locate other `MAC` addresses. `ARP Poisoning` is also called `ARP Spoofing`
    and here’s how it works:


    * When a machine on a network wants to communicate with another, it will look
    up the `ARP` table

    * If the `MAC` address is not in the table, an `ARP` request gets broadcast across
    the network

    * All of the machines on that network will compare the `IP` address to the `MAC`
    address

    * If any machine can identify it, it responds to the request supplying its `IP`
    and `MAC` addresses

    * The computer that made the request stores the addresses in the `ARP` table and
    the two can then communicate.


    ### What is ARP Spoofing?

    A hacker can forge `ARP` packets so that the information requested is sent to
    the hacker’s computer. A large number of these forged request/reply packets are
    constructed as a way of overloading the network switch, which is then set to forward
    data. Once the `ARP` table has been flooded out with the spoof responses, the
    hacker can then sniff every network package. The hackers will flood the `ARP`
    cache on a target computer with forged entries; this is called “poisoning” and
    it uses `MITM` access to spread the poison to the network.


    ### What is MITM?

    `MITM` stands for Man in the Middle attack. This is an active attack where the
    hacker will pretend to be the user; a connection is created between victims and
    messages are sent between them. The victims believe that they are talking to one
    another but the hacker is controlling everything.


    There is a third player in the game who controls and monitors the communication
    traffic between the victims. There are protocols in place, like `SSL`, that can
    prevent this kind of hack from happening.


    ### Exercise

    We are going to perform `ARP Poisoning` using `BetterCAP`. The environment is
    LAN and we will use `VMWare workstation` with `Kali Linux` and `Ettercap` installed
    for traffic sniffing.


    You will need:

    * `VMware Workstation`

    * `Kali Linux`

    * `LAN connection`

    * `Ettercap`


    This can be done in both wired and wireless networks and can be done in local
    LAN.


    1. If you haven’t already, install `VMware` and `Kali Linux`

    2. Login to `Kali` using “root,toor” as the username password

    3. Connect to local LAN and open a terminal; type `ipconfig` at the prompt to
    check the `IP` address

    4. Input `Ettercap -G` at the command prompt and the graphical `Ettercap` version
    will begin

    5. Go to the menu bar and click on the tab that says, “sniff”. Next choose “unified
    sniffing” and `O`. We will use `eth0` - an ethernet connection

    6. In the menu bar click on “hosts” and then “scan for hosts” - the network will
    be scanned for available hosts

    7. In the menu bar, click on “hosts” and then “hosts list” - this will show you
    how many available hosts are on the network. This will also show you the default
    gateway address.

    8. The next step is to choose your targets. With `MITM`, the host machine is the
    target and the route taken will be the router address that forwards the traffic.
    The hacker will intercept and sniff all packets on the network. We’ll call the
    victim “target 1” and we’ll call the router address “target 2”.

    9. For our exercise, the target `IP` is `192.168.121.129` and the router will
    be `192.168.121.2`. Add the target 1 as the victim `IP` and target 2 as the router
    `IP`.

    10. Click `MITM` and then on `ARP Poisoning`. Make sure the option that says “Sniff
    Remote Connections” is enabled and click on OK

    11. Click on Start and then on Start Sniffing… The `ARP Poisoning` will now begin,
    showing that the `NIC` has been switched to Promiscuous mode, enabling sniffing
    of all local traffic


    You can see the results of this in `Ettercap`’s toolbar.


    `ARP Poisoning` can cause huge losses to a company and most ethical hackers are
    employed by the company to stop this happening by keeping the network secure.


    ## DNS Poisoning

    `DNS` poisoning is another form of attack that tricks `DNS` servers into believing
    that they have been sent genuine information when they have been sent quite the
    opposite. The result is that false `IP` levels are inserted `DNS` level where
    the website addresses are translated into `IP` addresses. The idea is that hacker
    can replace the `IP` addresses for the target websites on a specified `DNS` server
    with a false address. Hackers can create false `DNS` entries for the specified
    server, which may contain malicious content bearing an identical name.


    For example, let’s say that a user inputs `www.google.com` but is instead forwarded
    to a fraudulent site instead of the genuine one… `DNS`` is used to redirect a
    user to a false page that looks identical to the real thing but is controlled
    by the hacker.


    ### Exercise

