  - '[PAGE 231]


    Understanding where commands live and ensuring you can run them is key to mastering
    your Linux system.


    # What are Executable Commands?


    +   - **Programs**: Think of them as tiny (or sometimes huge) tools that perform
    specific jobs.

    - **Stand-alone**: They reside as files on your filesystem, as opposed to being
    built into your shell itself.

    - **Need Permissions**: To run, they need the ‘execute'' file permission.


    # The Search Path


    +   - **Your Shell''s PATH**: This is an environment variable – a list of directories
    your shell looks in automatically when you type a command

    - **Finding Your Path**: echo $PATH (Typical output looks like /usr/local/bin:/usr/bin:/bin
    – a colon-separated list)

    - **Why This Matters**: Commands NOT in a PATH directory need their full location
    specified to run (e.g., /home/yourname/scripts/my_cool_script).


    # Scenario 1: Custom Script Woes


    You made a script, organize_photos.sh . It works if you''re *in* the directory
    with it, but not from anywhere else. Solution:


    +   **Find a PATH directory**: echo $PATH tells you where to put it'
  - '[PAGE 232]


    2. Move it: Use mv organize_photos.sh /usr/local/bin (may need ''sudo'' if you
    don''t own that directory). Now just organize_photos.sh should work!


    # Scenario 2: “Command Not Found”, But It Exists!


    You check, the file''s there, but it won''t run:


    +   1. **Permissions**: ls -l command_name Check if it has the ''x'' (execute)
    permission for your user or group. If not, fix with chmod u+x command_name (‘u+x’
    adds execute for the user that owns the file).

    2. **Filetype**: file command_name Could be a script needing an interpreter (if
    it''s a Python script, python command_name might be the way to run it).


    # Exploring Executable Locations


    +   * /bin and /usr/bin : Standard commands on almost every Linux system (think
    ''ls'', ''cp'', etc.).

    * /sbin and /usr/sbin : System administration tools, often needing ''sudo'' to
    run.

    * /usr/local/bin : Often where software you install manually puts its commands.

    * ~/bin : Some users make a ''bin'' directory in their home for personal scripts.


    # Important Notes


    +   **Distribution Differences**: Where some executables live can vary slightly
    between different flavors of Linux.'
