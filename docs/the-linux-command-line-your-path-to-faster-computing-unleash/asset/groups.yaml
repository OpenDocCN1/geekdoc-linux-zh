    # What About Wildcards?


    It''s tempting to use wildcards like cp \*.jpg new_folder to copy multiple files.
    **Proceed with caution!** If ''new_folder'' doesn''t exist, you might end up with
    all your JPGs clumped together with the same name, overwriting each other.


