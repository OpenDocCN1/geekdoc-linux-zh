    \n# 接下来预告（未来章节）\n\n- ‘less’ 命令：用于在简单滚动不足时浏览大文件和你的历史记录。\n- 使用历史记录自动化：将频繁使用的命令序列转换为脚本或别名（alias）的基础。\n\
