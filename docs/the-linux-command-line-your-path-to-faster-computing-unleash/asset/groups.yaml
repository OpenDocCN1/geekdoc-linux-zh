    \ 练习“感叹号” (!)：\n   - 运行 `ls -l /usr/bin`\n   - 现在，运行 `mkdir dir!*` 做了什么？（小心！）\n\
    \n# 注意事项\n\n- 操作历史记录非常强大。在重新运行修改过的命令之前，请务必双重检查，尤其是使用 `!` 技巧时。预防胜于处理意外的后果！\n\n\
    # 分享你的历史记录技巧\n\n你是否有喜欢的搜索历史记录的方法，或者某些用于自动化的巧妙用法？\n\n## 为什么 ‘less’ 更好\n\n- 处理大文件：‘cat’\
    \ 会一次性将所有内容倒在屏幕上，对于大文件来说会过载。‘less’ 则逐页显示。\n- 控制导航：使用箭头、上上/下翻页……按照你自己的节奏移动文本，而不是由文件决定。\n\
