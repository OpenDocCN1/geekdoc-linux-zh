    - 语法高亮：如果支持，Nano 可以尝试根据文件类型对代码着色。这需要在你的 .nanorc 文件中进行配置。\n- 鼠标支持：对于硬核鼠标爱好者，如果你的\
    \ Nano 版本支持，可以考虑添加 `set mouse`。\n\n## 重要提示：\n\n- Nano 版本很重要：并不是所有版本的 Nano 都具有相同的功能。\n\
    - 配置文件：自定义通常通过编辑家目录下的名为 .nanorc 的文件完成。可以在网上搜索专门针对你的 Linux 发行版的说明。\n\n## 额外资源\n\
    \n- Nano 内置帮助：始终记住按 Ctrl+G 访问官方帮助界面进行复习。\n- 定制 Nano：https://www.nano-editor.org/dist/latest/nanorc.5.html\n\
    \n## 下期预告（未来章节）\n\n- 命令行历史：如何召回、编辑和重复使用过去的命令以节省大量的打字时间。\n- ‘less’ 命令：一种强大的文本文件导航方式，功能比\
    \ Nano 内置的查看器更丰富。\n\n## 练习\n\n- 1. 大文本编辑：找到一个文本文件（代码、配置、任何内容）。刻意引入小错误（拼写错误、额外的行）。现在**仅**使用\
    \ Nano 的搜索、替换和代码块编辑来修复。\n- 2. （进阶）：Nano 配置搜寻：你的 Nano 版本支持定制吗？在网上探索，尝试编辑 .nanorc\
    \ 文件，看看你是否可以更改某个设置。\n\n## 替换时要小心！\n\n替换模式非常强大，但如果你不小心，可能会很危险。在执行全局“全部替换”之前，手动搜索几个匹配项通常是明智的。预防胜于收拾一团乱！\n\
    \n## 你的 Nano 工作流\n\n你是如何使用 Nano 的？你是一个极简主义者，为了快速编辑而进进出？还是利用它的功能进行更长时间的文本工作？\n\n\
    ## 追踪你的足迹：揭示命令行历史，第一部分\n\nLinux 命令行记得你过去的操作！这不仅仅是为了怀旧——你的命令历史是一个节省时间、发现模式甚至自动执行任务的强大工具。\n\
    \n## 为什么命令历史很重要\n\n- 1. **减少重复输入**：是否曾经需要重新运行之前的命令？历史记录让召回变得闪电般快速，节省了宝贵的击键次数。\n\
    - 2. **修复并重试**：复杂的命令有拼写错误吗？轻松找到它，修复错误并重试。\n- 3. **模式识别**：命令历史揭示了你的习惯。你最常用哪些命令？这可以优化你的工作流。\n\
    - 4. **自动化频繁任务**：你经常手动运行的任务可能转换为脚本或别名（未来章节！）。\n\n## 行业基础工具\n\n- 1. **上/下方向键**：你的第一道防线。在最近的命令之间来回循环。\n\
    - 2. **Ctrl+R (反向搜索)**：开始输入过去命令的一部分，shell 将尝试在历史记录中查找匹配项。如果有多个匹配项，继续按 Ctrl+R 循环。\n\
    - 3. **history 命令**：单独使用时，它会将你过去的命令以带编号的形式输出到屏幕上。在经常使用的系统上，这可能会很长！\n\n## 场景 1：失散已久的命令\n\
    \n你几天前运行了一个命令来配置网络设置。它很复杂，你不完全记得当时使用的具体选项。\n\n- 解决方案：\n    - 按 Ctrl+R 并输入你记得的片段（如“network”、一个\
    \ IP 地址等）。\n    - 或者使用 `history | grep network`（稍后会介绍 'grep'，但它可以搜索你的历史记录）。\n\n\
    ## 场景 2：修复错误\n\n你误输入了一个带有 `rm`（删除）的长命令。坦率地说，你还没有执行它！\n\n- 解决方案：\n    - 使用向上键找到它，仔细编辑，然后重新运行。\n\
    \n## 基础之外\n\n- 历史记录可定制：大多数 shell 允许你控制存储多少命令。搜索“[你的 shell 名称]| history settings”来了解如何调整。\n\
    - 选择性执行：\n    - `!245`：重新运行历史列表中编号为 245 的命令。\n    - `!-3`：重新运行三个命令之前的命令。\n\n##\
    \ 注意事项\n\n- 隐私：你的历史记录通常存储在一个文件中。如果其他人共享你的电脑，敏感命令可能会被看到。\n- Shell 类型很重要：不同的 shell（Bash、Zsh\
    \ 等）其历史功能可能略有不同。\n\n## 额外资源\n\n- 'history' 命令手册：https://www.gnu.org/software/bash/manual/html_node/Bash-History-Builtins.html\n\
    \n## 下期：第二部分\n\n- 过滤历史记录以进行强大的搜索\n- 重用旧命令的部分，而不仅仅是整个命令\n- 历史记录的安全方面\n\n## 练习\n\
    \n- 1. **刻意的拼写错误**：输入几个较长的命令（尝试 `ls -alR /` 等）。现在有意地添加拼写错误，然后使用历史记录工具快速修复它们。\n\
    - 2. **历史记录搜寻**：使用 history 命令来回答以下问题：\n    - 你上一次修改密码是什么时候？（搜索 'passwd'）。\n  \
    \  - 这周你使用了哪些图像命令？\n\n## 专业提示\n\n这种方式，命令总是可见的！如果你在执行敏感操作，在命令前加一个空格。大多数 shell 不会将其保存到历史记录中。\n\
    \n## 分享你的历史技巧\n\n你是否有聪明的方法来搜索历史记录或重用旧命令？\n\n"
