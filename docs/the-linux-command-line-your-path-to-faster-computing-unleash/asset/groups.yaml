  mdcn: "\n\n# 揭秘选项数组：探索 ls 命令的增强功能，第一部分\n\n准备好通过“揭秘选项数组：探索 ls 命令的增强功能，第一部分”来转变你对文件列表的认知。请将此看作是从查看基础目录列表，进化到拥有一台可以揭示文件系统中隐藏细节的\
