    # Nesting Quotes


    Sometimes you need to use single quotes *inside* double quotes. Why?


    +   - Variables Inside Quoted Text:


    ```

    echo "Today''s date is: $(date)"

    ```


    The `$(date)` part is executed *within* the overall quoted string


    +   - Precise Control: Single quotes within double quotes are treated literally
    even if they contain characters like $ .


    # Best Practices


    +   - **Avoid the Problem:** Name files thoughtfully! Underscores (_ ) or hyphens
    (- ) instead of spaces make life easier.


    +   - **Quote When Unsure:** If a filename *might* cause issues, a quick quote
    is safer than troubleshooting errors afterwards.


    +   - **Autocomplete Is Your Friend!** (Next chapter) Tab completion in the terminal
    often fills in filenames *and* adds necessary quoting for you.'
