    \n# 揭秘选项数组：探索 ls 命令的增强功能，第二部分\n\n让我们通过“揭秘选项数组：探索 ls 命令的增强功能，第二部分”继续深入探讨 `ls` 命令的威力。这次，我们将重点关注过滤、精调时间戳以及掌握高级的排序技术。\n\
    \n### 过滤以聚焦列表\n\n通常情况下，你不想看到目录中的所有内容。让我们学会缩小 `ls` 输出范围：\n\n1. 按文件类型：\n    - `ls\
