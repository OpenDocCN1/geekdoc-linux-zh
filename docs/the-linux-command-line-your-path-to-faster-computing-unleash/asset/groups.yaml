    \n### 场景 1：枯燥的重复输入\n\n你输入 `cd Documents/2023_Project/Reports`。噢，拼写错了！如果没有快捷键，你可能需要重新输入整个命令。\n\
    \n### 场景 2：迷失在历史中\n\n你需要之前的某个命令。如果没有快捷键，就得浪费时间滚动或重新输入。\n\n## 核心快捷键 – 第一部分\n\n\
    ### 1. 行内移动\n\n- **Ctrl+A**：跳转到行首。\n- **Ctrl+E**：跳转到行尾。\n- **左/右方向键**：一次移动一个字符（你可能知道这个，但它至关重要！）。\n\
    \n### 2. 即时编辑\n\n- **Ctrl+U**：删除当前行光标处*之前*的所有内容。\n- **Ctrl+K**：删除光标之后的所有内容。\n\
    - **Ctrl+W**：删除光标前的一个单词。\n\n### 3. 找回过去的命令\n\n- **上/下方向键**：循环遍历命令历史。按回车键执行历史中的命令。\n\
    \n## 强化记忆：实战练习\n\n1. **重复输入挑战**：输入一个中等长度的命令路径并在中间故意写一个错误。现在，使用移动和编辑快捷键来修复它，*无需*重新输入整个内容。\n\
    2. **历史寻踪**：\n   - 输入几个不同的命令。\n   - 现在，*仅使用*上方向键回溯这些命令，并按回车重新运行它们。\n3. **混合搭配**：从一个长命令开始。现在：\n\
    \   - 使用 Ctrl+A 和 Ctrl+E 跳到开头/结尾。\n   - 使用 Ctrl+U 或 Ctrl+K 删除部分内容。\n   - 使用方向键和\
    \ Ctrl+W 进行单词级的编辑。\n\n## 注意事项\n\n- **Shell 的差异**：某些 shell 拥有*更多*快捷键，或者允许你自定义。\n\
    - **终端内的应用程序**：像 Nano 这样的文本编辑器有自己的快捷键集。\n\n## 额外资源\n\n- **Bash 快捷键速查**：https://linuxize.com/post/bash-keyboard-shortcuts/\n\
    \n## 下一节：第二部分\n\n- **更高级的命令编辑（字母换换等）**\n- **利用历史技巧最大化命令行回溯**：驯服文本编辑（如果适用）。\n\n\
    ## 专业提示\n\n从一次掌握几个快捷键开始。将它们整合到你的日常习惯中，并逐渐增加更多。\n\n## 分享你的发现\n\n你是否有最喜爱的、也许不为人知的快捷键曾节省过时间？\n\
    \n## 命令行便利工具：解锁核心键盘快捷键，第二部分\n\n准备好通过专注于编辑、历史和整体效率的快捷键来为你的命令行工作流助力。\n\n### 精通编辑\n\
    \n1. **在单词间跳转**：\n   - Ctrl + 左/右方向键：跳转到上一个/下一个单词的开头/结尾。修复拼写错误非常有帮助。\n2. **字符易换**：\n\
    \   - Alt+T：交换光标*之前*的字符与光标*下方*的字符。对于单个字母的拼写错误，异常有用。\n3. **剪切（Yank）与粘贴（某些 shell）**：\n\
    \   - Ctrl+Y：“剪切”（复制）之前删除的文本（通过 Ctrl+K 等等删除的内容）。\n   - Ctrl+P：“粘贴”你剪切（Yank）的内容。\n\
    \n**注意**：这些剪切/粘贴功能可能在所有终端中都不可用，但在可用时超级方便。\n\n### 利用命令历史\n\n1. **不仅仅是上/下方向键**：基础功能很棒，但还有更多……\n\
    2. **搜索历史**：\n   - Ctrl+R：开始输入，它会在历史中反向搜索匹配。如果有多个匹配项，再次按 Ctrl+R 循环匹配。\n3. **无需搜索直接执行**：\n\
    \   - !：执行上一个命令。\n"
