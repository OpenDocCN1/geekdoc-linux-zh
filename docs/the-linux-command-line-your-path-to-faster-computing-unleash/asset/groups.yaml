  mdcn: "\n\n在指定的 Vacation（休假）和 Work（工作）子目录中中查找 JPEG 图像。\n\n## 控制大括号扩展的行为\n\n让我们发现一些技巧，来自定义大括号扩展的工作方式。\n\
    \n- **嵌套大括号**：创建更复杂的变体\n  `touch file{1,2}_{old,new}.txt`\n  这将产生像 file1_old.txt,\
    \ file1_new.txt, file2_old.txt, file2_new.txt 等文件。\n\n- **禁用大括号扩展**：有时候，你想要字面上的大括号。使用反斜杠\
    \ (\\) 对其进行转义\n  `echo \\{option1,option2\\} # 这将打印 {option1,option2}`\n\n## 高级文件操作策略\n\
    \n让我们把技能应用到一些以通配符和大括号扩展为核心的真实世界场景中。\n\n1. **选择性批量编辑**：假设你有一些名为“img_001.jpg”、“img_002.jpg”的图像文件，PNG\
    \ 文件也是如此，并且想对它们进行调整大小。尝试这样做：\n  `mkdir resized\n  `mogrify -resize 50% *.jpg,png\
    \ -path resized/`\n\nmogrify 命令使用通配符进行调整大小，大括号扩展处理不同的扩展名。\n\n2. **精准清理**：你下载了几个版本的大文件“project_data_v1.zip”、“project_data_v2.zip”等。进行选择性清理：\n\
    \n```\nrm project_data_v{1,2,3}.zip # 保留最新版本完好\n```\n\n## 注意事项\n\n大括号扩展是在 shell\
    \ 执行通配符扩展*之前*发生的。如果你有许多可能的扩展，这可能会导致命令行由于参数过多而过载。先进行测试！\n\n## 额外资源\n\n- 深入了解 Bash\
    \ 大括号扩展：https://www.gnu.org/software/bash/manual/html_node/Brace-Expansion.html\n\
    \n## 第 2 部分：更多扩展和循环\n\n在下一章中，我们将介绍大括号内的范围扩展，以及如何将通配符与循环结合，为自动化复杂的命令行任务开辟全新的领域。\n\
    \n## 实验与精炼\n\n掌握通配符和大括号扩展的最佳方法是练习。从小的示例开始，逐渐增加复杂度，并参考资源寻求指导。\n\n## 深入探索通配符的魔力，第\
    \ 2 部分\n\n范围扩展：数字序列及更多\n\n我们之前的大括号扩展技术可以简化不仅仅是逗号分隔的值。让我们引入范围扩展：\n\n- **数字**：echo\
    \ {1..10} 将打印从 1 到 10 的数字。你可以指定增量，如 echo {1..10..2} (1, 3, 5, 7, 9)。\n- **字母**：echo\
    \ {A..E} 打印大字母 A 到 E。对于数字和字母，范围必须按顺序排列。\n\n## 范围扩展的实践示例\n\n1. **快速创建文件**：想一次创建多个空文件？\n\
    `touch report_{01..05}.txt`\n\n2. **下载序列**：需要从具有顺序编号的 Web 服务器抓取图像？\n`wget https://images.com/image_{001..100}.jpg`\n\
    \n## 组合扩展：嵌套的力量\n\n记住，你可以嵌套不同类型的扩展以实现灵活的组合：\n\n`echo section_{A..C}_{1..3}.pdf`\n\
    \n这将生成文件名 section_A_1.pdf, section_A_2.pdf... section_C_3.pdf 等。发挥创意吧！\n\n## 通配符与循环：黄金搭档\n\
    \nShell 脚本中的循环是迭代命令的强大方式。通配符让它们在文件操作中更加灵活。这里是“for 循环”的基本结构：\n\n```\nfor item in\
    \ some_list;\ndo\n  commands_to_run_on_item\ndone\n```\n\n让我们看看实际效果：\n\n- **使用数字重命名**：假设你有一组想要添加序列的图像文件：\n\
    \n```\ncounter=1\nfor image in *.jpg; do\n    mv \"$image\" \"landscape_$counter.jpg\"\
    \n    counter=$((counter + 1))\ndone\n```\n\n- **在特定文件中搜索**：需要在一个目录下所有的 Python\
    \ 脚本中搜索某个短语吗？\n\n```\nfor script in *.py; do\n    grep 'search_term' \"$script\"\
    \ndone\n```\n\n## 使用循环时需要考虑的事\n\n- **处理文件名中的空格**：在遍历文件时，始终为变量加上引号（例如 `\"$item\"\
    `），以防止空格引起的问题。\n\n- **在批量操作前测试**：如果执行重命名或删除等破坏性操作，请先用 echo 进行测试运行，看看循环在执行实际命令前会做什么。\n\
    \n额外资源：\n\n- Shell 脚本教程 - for Loop https://www.shellscript.sh/loops.html\n-  Wikipedia\
    \ - Glob (programming) https://en.wikipedia.org/wiki/Glob_(programming)\n\n##\
    \ 高级循环技术（预告）\n\n在更复杂的场景中，你可能会将 find 与 -exec 选项结合，并在你的循环命令中使用通配符。我们将在未来的章节中深入探讨这些强大的技术！\n\
    \n## 掌握扩展和循环的技巧\n\n1. **从小开始，逐步扩大**：从简单的大括号扩展和循环开始，掌握基本流程。然后逐渐增加复杂度。\n2. **大量使用引号**：在变量和扩展周围使用引号，特别是涉及空格时，避免意外行为。\n\
    3. **测试、测试、再测试！**在带有破坏性选项执行命令之前，始终要测试。\n\n## 让我们自动化吧！\n\n想想你在命令行上经常重复的任务，特别是涉及文件组的任务。是否有任何任务可以通过巧妙结合通配符、扩展和循环来自动化的？\n\
    \n## 命令自定义：使用 alias 特性创建个性化的 Linux 命令，第 1 部分\n\n终端是你 Linux 中的命令控制中心。个性化这种体验的一种极佳方法是利用‘alias’功能。将\
    \ alias 视为你最常用命令的自定义快捷方式或强大的缩写。通过它们，你可以简化复杂命令，优化工作流，并克服那些讨厌的拼写错误！\n\n## Alias（别名）的结构\n\
    \n这是一个简单别名声明的基本结构：\n\n```\nalias short_name='longer_command_commands'\n```\n\n\
    让我们分解一下：\n\n- **alias**：告诉 shell 你正在创建一个别名的关键字。\n- **short_name**：你选择的快捷方式。\n\
    - **'longer_command_commands'**：你想表示的命令（或命令序列）。该部分包含引号以确保 shell 正确解析。\n\n## Alias\
    \ 的实战示例\n\n1. **缩写长命令**：\n\n```\nalias update='apt update && apt upgrade'\n```\n\
    \n现在不需要输入整个命令，只需输入 update。\n\n2. **修复常见拼写错误**：\n\n```\nalias gerp='grep'\n```\n\
    \n再也不会写错最常用的搜索命令了！\n\n3. **添加默认选项**：\n\n```\nalias ls='ls --color=auto'\n```\n\
    \n现在每个 ls 命令都有颜色以便区分。\n\n## 使别名可用：Shell 和会话\n\n- **当前会话**：当你直接在终端定义 alias 时，它只存在于当前会话。关闭终端它就会消失。\n\
    \n- **持久化**：要让 alias 持久，你需要将它们保存在 shell 的配置文件中。\n通常包括：\n* ~/.bashrc（针对 Bash）\n\
    * ~/.zshrc（针对 Zsh）\n\n## 编辑配置文件\n\n1. 使用你喜欢的文本编辑器（例如 ~/.bashrc）\n2. 在文件末尾添加别名定义，每行一个。\n\
    3. 保存更改。\n4. 使修改的文件应用于当前会话：bashrc 或 ~/.zshrc\n\n## 查看你的 Alias\n\n要查看会话中激活的别名列表，只需输入：\n\
    \n```\nalias\n```\n\n## 编写有效 Alias 的技巧\n\n1. **保持简洁**：其要点是为了减少击键次数。\n2. **具有描述性**：别名名称应提示其功能。\n\
    3. **避免覆盖现有命令**：检查你的别名是否与现有命令冲突，以防止意外行为。\n4. **保存前测试**：先在终端中定义别名以确保它符合预期，然后再持久化。\n\
    \n## 额外资源\n\n- Linux Handbook - Aliases https://linuxhandbook.com/aliases/\n-\
    \ HowToGeek: Create Aliases on Linux https://www.howtogeek.com/73768/how-to-use-aliases-to-customize-ubuntu-commands/\n\
    \n## 第 2 部分预告\n\n在下一部分，我们将深入更复杂的 alias - 传递参数、在其他命令中组合 alias，以及使用 shell 函数进行更复杂的自定义。\n\
    \n## 你的自定义工作流\n\n想想你在命令行上经常执行的任务，特别是涉及文件组的任务。是否有任何任务可以通过巧妙结合通配符、扩展和循环来自动化的？\n\n"
