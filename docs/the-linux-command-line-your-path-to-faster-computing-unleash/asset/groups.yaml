    # 复制数据领域：解锁 cp 文件复制命令，第 2 部分


    在“复制数据领域：解锁 cp 文件复制命令，第 2 部分”中，我们将超越基础复制，探索 `cp` 在跨设备、远程系统和复杂同步任务中展现出的多功能性。


    # 跨边界：设备间的复制


    # 准备工作


    在下一部分，我们将涵盖：


    - 跨设备和远程系统之间的复制。

    - 基于模式选择复制文件的高级技巧。

    - 大规模复制操作的策略。


    # 跨网络复制


    `scp`（安全复制）命令构建在 SSH 协议之上，允许在远程 Linux 系统之间传输文件。


    # 语法：


    ```

    scp source_file username@remote_host:/path/on/remote

    ```


    # 场景：将网站备份到远程服务器


    ```bash

    scp -r website_templates adminuser@backup_server.com:/home/adminuser/backups

    ```


    # 目录


    Linux 将这些表示为文件系统中的挂载目录。


    # 目录


    1. **设备：它连接并被识别了吗？** 像 `lsblk` 这样的工具可以帮助列出块设备，图形化文件管理器通常提供易于使用的设备名称。

    2. **挂载点：它在哪里？** USB 驱动器可能会出现在 `/media/your_username/` 或 `/mnt` 下。


    # 场景：存档到 USB


    假设你的驱动器挂载在 /media/your_username/backup_drive


    ```bash

    cp -r project_files /media/your_username/backup_drive/project_backup

    ```


    # 核心选项控制


    - **-i (交互式)**：在覆盖现有文件时提示确认。

    - **-v (详细模式)**：显示正在复制的内容。

    - **-u (更新)**：仅当源文件比目标文件新时才进行复制。

    - **-p (保留)**：尽可能保留权限、时间戳和所有者。


    # 场景 3：谨慎更新


    只有当源文件有变化时才更新目标：


    ```bash

    cp -u source target

    ```


    # 关于通配符？


    尝试使用通配符如 `cp *.jpg new_folder` 来复制多个文件。**请谨慎！** 如果 `new_folder` 不存在，所有的 JPG 将挤在同一个文件名并互相覆盖。


    # 额外资源


    - **man cp**：`cp` 命令的权威文档页。https://www.gnu.org/software/coreutils/manual/html_node/cp.invocation

    - **复制文件和目录 ExplainShell**：https://explainshell.com/


