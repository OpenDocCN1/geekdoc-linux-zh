    shares. Linux represents these as mounted directories within the file system.


    # Prerequisites


    +   1. **The Device: Is it connected and recognized?** Some tools like lsblk can
    help you list block devices, graphical file managers often provide user-friendly
    device names.

    2. **Mount Point: Where is it?** USB drives might appear under /media/your_username/
    or /mnt.


    # Scenario: Archiving to USB


    Let''s assume your drive is mounted at /media/your_username/backup_drive


    ```

    cp -r project_files /media/your_username/backup_drive/project_backup

    ```


    # Copying Over Networks with scp


    The scp (secure copy) command is built on the SSH protocol, enabling file transfers
    to and from remote Linux systems.


    # Syntax:


    ```

    scp source_file username@remote_host:/path/on/remote

    ```


    # Scenario: Website Backup to a Remote Server


