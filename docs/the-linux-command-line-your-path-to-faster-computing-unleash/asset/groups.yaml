    \n- **[:digit:]**：等同于 [0-9]，匹配数字。\n- **[:alpha:]**：等同于 [a-zA-Z]，匹配字母。\n- **[:alnum:]**：结合上述两者，匹配字母和数字。\n\
    - **[:space:]**：匹配空白字符（空格、制表符等）。\n\n# 字符类的实战示例\n\n1. **过滤特定的文件扩展名**：假设你想寻找代码文件，但代码文件在不同的文件夹中。\n\
