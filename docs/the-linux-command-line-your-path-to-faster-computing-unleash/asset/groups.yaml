    ## ## 在 Linux 中规划你的航程，第 4 部分：释放的导航大师之路


    在本章中，我们将巩固你的技能，并添加一些专家级技巧，将你从一个熟练的导航员转变为命令行大师！


    ## ## 自定义你的提示符 (Prompt)


    终端中的提示符（通常类似于 `username@hostname:~$` ）是可以自定义的！修改它可以添加有价值的信息并让导航更顺畅。


    - **环境变量：** 你的 Linux 系统在环境变量中存储配置值。以下是针对提示符的一些有趣的变量：

    - PS1：控制你主提示符的外观

    - USER：你的当前用户名

    - HOSTNAME：你所处机器的名称

    - PWD：你当前的工作目录


    **提示：** 在更改提示符之前，将当前的 PS1 值存储在临时变量中（例如 `p_prompt=$PS1`），这样如果需要，你可以轻松恢复。


    ## ## 示例提示符自定义


    让我们创建一个显示为 [用户名 @ 主机名: 短目录路径] $ 的提示符。方法如下：


    1. **理解转义序列：** 为了格式化提示符内的文本，使用了特殊的转义序列。你需要：

    - \u：插入你的用户名

    - \h：插入你的主机名

    - \W：显示当前目录的最后一段

    - \$：为非 root 用户添加一个普通的 ''$'' 符号（如果你是 root 用户，则为 ''#''）


    2. **设置提示符：**

    - export PS1="\u@\h: \W"


    **专业贴士：** 将此行 `export PS1...` 放在你家目录下一个名为 `.bashrc` 的特殊文件中，以使更改在终端会话中永久生效。


    ## ## 威力快捷键


    掌握这些键盘快捷键，可以在终端内无缝工作：


    - **Ctrl + A**：将光标跳转到命令行的开头

    - **Ctrl + E**：将光标跳转到命令行的末尾

    - **Ctrl + U**：清除从光标位置到开头的行

    - **Ctrl + K**：清除从光标位置到末尾的行

    - **Ctrl + L**：清除屏幕（效果等同 `clear` 命令）


    ## ## 回忆和修改之前的命令


    不再需要重复输入长命令了！让我们探索与命令历史交互的方法：


    - **向上/向下箭头**：循环切换最近命令

    - **Ctrl + R**：启动反向搜索。开始输入之前命令的任何部分，它将搜索你的历史

    - history：列出你最近的命令历史


    ## ## 高级历史魔法


    - !!number：通过编号执行历史记录中的命令（如使用 `history` 命令所示）

    - !!：执行你运行的最后一条命令

    - !$：用上一个命令的最后一个参数替换自身。这在在新文件上重复操作时非常有用！


    场景：


    1. 你使用 `ls -l /var/log/` 列出文件

    2. 你想使用 `less` 命令查看该列表中的最后一个文件：`less /var/log/!$`


    ## ## 关于 Shell 的说明


    自定义提示符和某些命令行行为的具体方式可能会根据你使用的 Linux 发行版和 Shell（常见的有 Bash, Zsh）而略有不同。


    ## ## 下一步


    当使用递归选项 -R 时，你可能想限制它的深度。方法如下：


    - --max-depth=N：其中 ''N'' 是一个数字。这将列表限制在从当前位置向下 N 层。


