    # Troubleshooting Tips


    +   - Start Simple: Use ping first to test basic reachability


    +   - Check Your Interfaces: ip addr show ensures your network interfaces are
    up and have correct IP addresses.


    +   - Examine the Route: traceroute to a problematic destination might reveal
    where packets get stuck.


    +   - Firewalls: Both your local firewall ( iptables or ufw ) and firewalls on
    remote systems can block connections.


    # Security Considerations


    +   - Open Ports: Use netstat or ss to check what services are listening on your
    system. Close unnecessary ones.


    +   - SSH Best Practices: Disable password logins in favor of key-based authentication
    to greatly enhance security.


    +   - Firewall: Consider a tool like iptables or ufw to control incoming and outgoing
    traffic.'
