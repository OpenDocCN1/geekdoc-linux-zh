    Get ready to power up your command-line workflow with shortcuts focused on editing,
    history, and overall efficiency.


    # Mastering Command Editing


    1. Jumping Between Words


    +   - Ctrl + Left/Right Arrows: Hop to the beginning/end of the previous/next
    word. Great for fixing a typo within a word, without affecting the rest of your
    command.


    2. Transposing Characters


    +   - Alt+T: Swaps the character *before* your cursor with the one *under* your
    cursor. Amazingly useful for those pesky, one-letter typos.


    3. Yank and Paste (Some Shells)


    +   - Ctrl+Y: “Yank” (copy) previously deleted text (deleted with Ctrl+K, etc.)

    - Ctrl+P: “Paste” what you yanked.


    **Note:** These yank/paste features may not work in all terminals, but are super
    handy when available.


    # Harnessing Command History


    +   1. Beyond Up/Down Arrow: The basics are great, but there''s more...'
