    \n# 揭秘选项数组：探索 ls 命令的增强功能，第三部分\n\n这一次，让我们超越标准的 `ls` 列表，学习让 `ls` 输出精确符合我们的需求。\n\n\
    ### 自定义输出格式\n\n`--format` 选项让你对 `ls` 显示的信息及其排列方式拥有惊人的控制力：\n\n- 预设：\n    - `--format=long`\
    \ 或 `-l`：我们熟悉的！\n    - `--format=commas` 或 `-m`：逗号分隔名称——非常适合复制到其他命令中。\n    - `--format=horizontal`\
    \ 或 `-x`：跨屏显示名称。\n    - `--format=vertical` 或 `-1`：单列列表（仅文件名）\n\n### 自定义占位符\n\n\
