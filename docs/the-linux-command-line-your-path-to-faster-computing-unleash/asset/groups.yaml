    \ -l *backup*`：列出名称中任何地方包含“backup”的内容。\n\n# 场景：图像管理\n\n你有一个 `~/Pictures/` 文件夹，里面满了照片，但也混入了一些随机文档：\n\
    \n- `ls -l ~/Pictures/*.jpg` 给出你的 JPEG 图片的整洁列表。\n- `ls -l ~/Pictures/*`（列出所有项）\n\
    \    - 接着执行 `mv *.pdf ~/Documents` 来移动任何散乱的 PDF。\n\n## 时间戳控制\n\n`-l` 选项给了我们修改时间，但还有更多待发现：\n\
    \n- -c：显示文件 `inode` 最后一次更改的时间（这包括权限等元数据的更改，而不仅仅是内容编辑）\n- -u：显示文件的最后访问时间。\n- --full-time：提供完整的时间信息。\n\
    \n## 场景：跟踪更改\n\n你怀疑某个配置文件被意外编辑了。\n\n1. `ls -l` 关键的配置文件（获取基准）\n2. 等等...\n3. `ls\
    \ -lc` 查看时间戳可能被篡改了！\n\n## 高级排序\n\n让我们超越按大小 (-S) 或修改时间 (-t) 的基础排序\n\n- -v（版本排序）：智能排序包含数字的名称，将\
    \ `document-10` 放在 `document-2` 之后（这是正确的）。\n- -X（按扩展名排序）：分组。\n\n## 场景：清理\n\n你的\
