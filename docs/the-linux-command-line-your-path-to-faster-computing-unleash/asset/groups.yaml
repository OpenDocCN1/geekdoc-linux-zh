  mdcn: "\n现在，只有文件名包含空格的文件会被删除。\n\n## 引用方法\n\n1. **包裹整个文件名**：如上所示，\"Filename With\
    \ Spaces.ext\"\n2. **转义字符**：在空格前*直接*放置反斜杠 ( \\ )。\n   示例：`my\\vacation\\ photos`\
    \ 被视为 \"my vacation photos\"。\n\n## 如何选择哪种方法\n\n- **简单空格**：使用引号或反斜杠转义均可。\n- **特殊字符**：（第\
    \ 2 部分！）像像 '$' 或 '\"' 这样的字符需要更仔细的引用，因为 shell 会单独解释它们。\n\n## 注意事项：图形化工具 vs 终端\n\
    \n- 文件管理器即使在文件名包含空格时通常也会视觉上显示单个文件，并允许你进行重命名等操作。它们在为你隐藏引用符号！\n- 某些命令内置了处理空格的方法，不需要你手动引用。\n\
    \n## 熟能生巧\n\n创建一个 ‘test’ 目录，并刻意创建名称带有空格的文件和子目录。然后练习以下操作：\n\n- **ls -ing 它们**：分别在带引号和不带引号的情况下进行，查看区别。\n\
    - **cd -ing 进入它们**：熟悉在这些目录中导航。\n- **使用 cp 复制和使用 mv 移动**：确保保留空格。\n\n## 额外：在脚本中引用\n\
    \n如果你编写 shell 脚本（bash 等），引用的规则会变得更加重要，因为现在解释内容的是脚本而不仅仅是交互式会话。\n\n## 附加资源\n\n-\
    \ **ExplainShell 引用说明**：https://explainshell.com/（包含空格的示例）\n- **安全文件删除实践**：https://www.linuxjournal.com/article/1178\n\
    \n## 下一步：第 2 部分\n\n- 处理空格*以及*其他异常字符，如 ‘$$’、『(’ 等。\n- 双引号行为不同于单引号的情况。\n- 自动补全的功能极大地减少了我们直接输入空格的需求！\n\
    \n## 野外驯服空格：处理带空格的文件名，第 2 部分\n\n现在我们已经掌握了引用转义空格的基础知识，让我们面对文件名包含*同时*空格和 shell 喜欢解释的其他诡异字符的情况。\n\
    \n## 当空格不够时：其他特殊字符\n\n这些字符在命令行中具有特定含义：\n\n- 美元符号 ( $)：变量（我们稍后会介绍）\n- 星号 (*)：匹配模式的通配符\n\
    - 感叹号 (!)：命令历史\n- 括号、中括号、安培符号等：每个都有潜在的特殊用途\n\n## 场景 1：“$10 Discount.txt”问题\n\n\
    假设你想查看这个文本文件：\n\n```\ncat $10 Discount.txt\n```\n\n哎！shell 可能会尝试将 ‘$10’解释为变量名。解决方案？使用引用？\n\
    \n- \" $10 Discount.txt\" 在大多数情况下有效。\n\n## 场景 2：失控的通配符\n\n你有几个文件：Project(final).doc\
    \ , Project(v2).doc\n\n`rm Project*.doc` 可能是想删除旧版本，但 * 会被展开，可能会连同你宝贵的 Project(final).doc\
    \ 一起捕捉！\n\n- \"Project*.doc\" 通常更安全\n\n## 嵌套引号\n\n有时你需要在双引号内使用单引号。为什么？\n\n- **引用文本中的变量**：\n\
    ```\necho \"Today's date is: $(date)\"\n```\n`$(date)` 部分在整个字符串*内部*执行\n\n- **精确控制**：如果双引号内的单引号包含像\
    \ $这样的字符，它们会被视为字面量。\n\n## 最佳实践\n\n- **避免问题**：仔细地命名文件。使用下划线 (_ ) 或连字符 (- ) 代替空格会让生活更轻松。\n\
    - **不确定时引用**：如果文件名*可能*导致问题，快速引用比事后排故障更安全。\n- **自动补全是你的朋友！**终端中的 Tab 补全会填充文件名并为你添加必要的引用。\n\
    \n## 当情况变得复杂时（超出基础）\n\n- **正则表达式**：对于复杂的模式匹配，有一个整个特殊字符和引用规则的世界。\n- **脚本编写**：在\
    \ shell 脚本中，引用游戏是一门确保可靠性的艺术。\n\n## 附加资源\n\n- Linux 快速查表：https://mywiki.org/\n\
    - 正则表达式教程：https://regexone.com/\n\n## 实践挑战\n\n1. 创建一个“混乱命名”目录：在其中填充带有空格、美元符号、括号等的文件。\n\
    2. 练习：使用 ls , cd , mv ，在该目录内成功工作而不引起错误。\n\n## 拥抱特殊字符：攻克文件名挑战，第 1 部分\n\n我们处理了空格，现在让我们面对一系列可以使文件名变成乐趣或命令行噩梦的字符。\n\
    \n## 为什么特殊字符很棘手\n\n除了空格之外的许多字符对解释你命令的程序有特定含义：\n\n- 通配符：\n  * *（匹配 0 或多个字符）\n \
    \ * ?（匹配任何单个字符）\n- 重定向：\n  * >（将命令输出发送到文件）\n  * <（将文件作为输入）\n- 管道：|（将一个命令的输出连接到另一个命令的输入）\n\
    - 逻辑运算符：\n  * &&（仅在前一个命令执行成功时运行命令）\n  * ||（仅在前一个命令执行失败时运行命令）\n- 后台作业：&（在后台运行命令）\n\
    \n...以及更多！\n\n## 场景 1：括号的危险\n\n你手头有命名为 'Project Notes (1).txt' 和 'Project Notes\
    \ (2).txt' 的文件。让我们尝试删除第一个：\n\n```\nrm Project Notes (1).txt\n```\n\n哎！shell 可能会尝试解释括号，导致错误。\n\
    \n## 场景 2：失控的通配符\n\n你有像 ‘Report_v1.pdf’、『Report_v2.pdf’ 这样的文件。\n\n```\nls Report_*.pdf\n\
    ```\n\n如果你有一个名为 ‘Report_notes.pdf’ 的文件，它会被包含在内！\n\n## 核心技巧\n\n熟悉处理特殊字符的方法：\n\n\
    1. **引用（双引号优先）**：\"Project Notes (1).txt\" 保留了大多数字符的特殊含义。\n2. **使用反斜杠转义 (\\)**：在特殊字符前直接放置\
    \ \\，这会告诉 shell 忽略其特殊含义。\n3. **单引号（字面量）**：单引号内的几乎一切都被 shell 视为纯文本。\n\n## 双引号不够时\n\
    \n- **$ (变量)**：双引号内 shell *会*尝试展开变量。单引号或转义可以防止这种情况。\n- **嵌套**：有时需要引用和转义来处理复杂的文件名。\n\
    \n## 示例：金钱问题\n\n命名为“$50 budget.txt”的文件让我们 cat 它：\n\n- **失败**：cat $50 budget.txt（寻找变量50）\n\
