    ## Important


    - **SSH**: The remote system must have an SSH server running.

    - **Permissions**: Your user needs permissions to write to the target location
    on the remote machine.


    ## Selective Copies


    Let''s get more sophisticated by using patterns and file attributes for our copies.


    ## Scenario 1: Images from Multiple Sources


    You have photos scattered in different folders. Consolidate them:


    ```bash

    cp /home/username/holiday_photos/*.jpg /home/username/pictures/organized

    cp /home/username/documents/2022_pics/*.png /home/username/pictures/organized

    ```


    ## Scenario 2: Modified in the Last Week


    Use the find command from ''rm'' chapters to target files, then copy:


    ```bash

    find /path/to/work -type f -mtime -7 -exec cp {} /path/to/backup

    ```


    ## Synchronization with rsync


    The rsync command is the king of efficient file mirroring and syncing. Features
    include:


    - **Delta Transfers**: Copies only the changed portions of files. Great for large
    backups over slow links.

    - **Deletion Synchronization**: (--delete option) Can make the target an exact
    mirror, removing files not present in the source.

    - **Compression**: Built-in compression to reduce network traffic.


    ## Scenario: Offsite Website Mirroring


    ```bash

    rsync -avz /var/www/website_files adminuser@backup_server.com:/backups/website
    (a: archive mode, v: verbose, z: compression)

    ```


    ## Additional Resources


    - Linux mount command Explained: https://linuxize.com/post/how-to-use-the-mount-command-in-linux/

    - scp examples: https://linuxize.com/post/how-to-use-scp-command-to-securely-transfer-files/

    - rsync Power User Guide: https://linux.die.net/man/1/rsync


    ## Beyond Copying: The World of Data Management


    While cp is a foundation, let''s think strategically:


    - **Versioning**: For critical projects, use version control systems (like Git)
    for more structured history tracking than simple copies provide.

    - **Large-Scale Data**: Tools specifically designed for vast dataset management
    may be more efficient than raw cp.

    - **Scheduling**: cron (we''ll discuss this later) lets you automate backups and
    copies on a schedule.


    ## Practice


    1. Design a command or short script using cp or rsync to back up your home directory
    to an external drive, excluding temporary files and large video files.

    2. (Advanced): Research a remote backup service compatible with rsync. Set up
    a test where you synchronize a directory with your remote backup.


    ## Up Next


    Coming up, the mv command! We''ll shift from duplication to relocation and renaming,
    adding another dimension to file organization mastery.


    ## Shifting and Shaping: Mastering File Movement and Renaming with the mv Command,
    Part 1


    The mv command is a powerhouse of file organization, allowing us to relocate files
    and change their names. Let''s get moving!


    ## Fundamentals of mv


    1. Moving a File:


    ```bash

    mv source_file target_directory

    ```


    - Moves ''source_file'' into the ''target_directory''.

    - If the ''target_directory'' doesn''t exist, it''s treated as a filename (renaming,
    see below).


    ## 2. Renaming a File:


    ```bash

    mv old_filename new_filename

    ```


    - Renames ''old_filename'' to ''new_filename'' within the *same* directory.


    ## Key Points


    - **Overwriting**: mv will overwrite an existing file in the destination if the
    names match!

    - **Directories Too**: mv can also move entire directories, including their contents.


    ## Scenario 1: Organizing Downloads


    You have a messy ‘Downloads’ folder:


    ```bash

    mv presentation.pdf Documents/

    mv holiday_photos.jpg Pictures/

    mv project_backup.zip /tmp/backups

    ```


    ## Scenario 2: Fixing a Typo


    You misspelled a filename, “inut.txt” instead of “input.txt”:


    ```bash

    mv inut.txt input.txt

    ```


    ## Essential Options


    Let''s enhance our control over moves and renames:


    - **i (Interactive)**: Prompts before overwriting, a safeguard against errors.

    - **v (Verbose)**: Explains what mv is doing.

    - **n (No Overwrite)**: Prevents overwriting existing files. Useful for testing
    your commands.

    - **u (Update)**: Only moves the file if it''s newer than the destination file,
    or the destination doesn''t exist. Avoids unnecessary copying.


    ## Scenario 3: Careful Renaming


    You want to change several ''.jpg'' to ''.jpeg'' files but avoid accidentally
    overwriting existing files:


    ```bash

    mv -vn *.jpg *.jpeg

    ```


    ## Moving Across Devices


    Recall from our cp chapters that mounted USB drives or network shares appear as
    part of your file system. mv works seamlessly to shift files between these locations
    just as if they were on the same drive.


    Tip: Always Double-Check


    Before executing any complex mv command, especially when using wildcards, use
    ls to visualize what files would be affected. Prevention is better than a cure!


    ## Small Command, Big Possibilities


    We''ve just scratched the surface of mv''s capabilities:


    - **Bulk Renaming**: Using wildcards or clever scripting, mv can rename groups
    of files systematically.

    - **Implicit Backup**: mv file.txt file.txt.bak creates a quick backup before
    modifying the original.


    ## Additional Resources:


    - **The mv man page**: https://www.gnu.org/software/coreutils/manual/html_node/mv-invocation.html

    - **Interactive mv Practice**: https://explainshell.com/


    ## Up Next: Part 2


    In the next part, we''ll combine mv with other commands for streamlined workflows,
    learn advanced multi-file moves, and explore strategies to use mv without leaving
    our comfort zone of text editors.


    ## Tasks for Practice


    1. Your home directory is littered with ‘log’ files. Create a directory ‘old_logs’
    and move all the log files into it.

    2. You have several files named ‘draft_1.txt’, ‘draft_2.txt’ etc. Explore renaming
    them systematically to ‘project_draft_1.txt’, ‘project_draft_2.txt’, and so on.
    (Hint: There are ways to do this with mv and a little scripting!)


    ## Shifting and Shaping: Mastering File Movement and Renaming with the mv Command,
    Part 2


    In the next part, we''ll combine mv with other commands for streamlined workflows,
    learn advanced multi-file moves, and explore strategies to use mv without leaving
    our comfort zone of text editors.


    ## mv + find : Targeted File Operations


    Recall our discussion of find from the de-facto chapters. Let’s combine it with
    mv for precise relocation:


    ### Scenario 1: Gathering MP3s


    You have music scattered everywhere:


    ```bash

    find /home/username -name "*.mp3" -exec mv {} /home/username/Music

    ```


    - find locates all MP3s within your directory.

    - exec executes the mv command, ''{}’ representing each file.


    ### Scenario 2: Archiving Old Logs


    Find log files older than 30 days and move them:


    ```bash

    find /var/log -name "*.log" -mtime +30 -exec mv {} /var/log/archive

    ```


    ## Cautions


    - **Test with echo**: Before running complex find... replace mv with echo to preview
    what would happen.

    - **Permissions**: Make sure you have write permission to target.


    ## Bulk Renaming


    While mv can handle simple renames, sometimes we need more transformations. Here
    are some approaches:


    ### 1. The rename Utility


    - Not to be confused with the rename built into some shells own- Install with
    manager (sudo apt install rename on Debian-based systems)

    - Syntax using regular expressions for complex renaming


    Example:


    ```bash

    rename ''/\.TXT$/.txt/'' *.TXT (Changes all uppercase ‘TXT’ extensions to lowercase)

    ```


    ### 2. Text Editors as Renaming


    - Many text editors have “Find and Replace” features that operate on filenames
    within directory

    - **Nano**: Ctrl+R can batch-rename files you''ve opened

    - **Graphical Editors**: Often have “Rename” on files in project


    ### 3. The Power of the Shell (Advanced)


    Using a combination of ls , wildcards, text manipulation tools (sed , awk ) and
    loops within a shell script, you could perform any renaming task imaginable!


    ## Additional Resources


    - rename utility explained: https://linuxize.com/post/rename-files-in-linux/


    ## mv Isn''t Always Essential


    Many commands have the ability to create new files as an output of their operation:


    - cp source modified_copy : Effectively renaming during a copy.

    - Text Editors: “Save As” gives you a new filename.

    - Redirection: some_command > new_output_file creates a file named ''new_output_file''.


    ## Strategic Thinking


    The best solution might combine mv for bulk moves based on existing filenames,
    and other tools for cases where filenames are generated as part of the process
    you''re doing.


    ## Up Next (Future Chapters)


    - The file Command: Identifying file types, crucial before operations, especially
    when mixing scripts and mv.

