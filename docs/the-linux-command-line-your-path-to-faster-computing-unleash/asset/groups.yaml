    # 持续监控


    对于持续监控，可以考虑以下工具：


    - glances: 类似于增强版的‘top’，界面美观。

    - nmon: 可视化系统监控器。交互模式允许在在 CPU、磁盘、网络等资源之间切换。

    - 系统日志：如 rsyslog 或 journalctl 等服务是你的长期记录。通过过滤日志可以调查特定事件。


    # 解读数据


    监控不仅关乎工具本身，更关乎解读：


    - 峰值 vs 持续负载：CPU 峰值是暂时的，还是你的系统一直处于挣扎状态？

    - 内存泄漏：进程是否随着时间推移缓慢消耗更多 RAM，从而表明存在 Bug？

    - 异常磁盘活动：某个程序在不该运行时是否在剧烈读写磁盘？

    - 基线：了解你系统的“正常”状态对于检测异常至关重要。


    # 额外资源


    - **Linux 监控工具：全面指南** https://www.tecmint.com/top-best-linux-monitoring-tools/

    - **Linux 系统监控工具终极指南** https://linuxhandbook.com/linux-system-monitoring-tools/


    # 何时深入研究


    对于复杂问题或专用服务器，请探索：


    - **专用监控工具**：数据库、Web 服务器等可能有专门的监控命令或协议。

    - 监控系统：Nagios、Zabbix 等是用于大规模监控、告警和历史数据的健壮解决方案。

    - perf 等性能分析工具可以深入代码层级进行性能分析（非常高级）。


    # 主动监控：最佳实践


    不要等故障发生！


    - **设置告警**：某些工具可以配置基础告警（例如在磁盘空间不足时发送电子邮件）。

    - 日志分析：安排时间查看日志，发现新趋势并预判问题。


    # 监控挑战！


    让我们模拟一些场景：


    1. **高 CPU 使用率**：运行 `yes > /dev/null &`（产生一个无所事的进程，消耗 CPU）。在 top 中观察。你如何终止它？([如果你想听听这个隐藏命令的解释，请告诉我])

    2. **RAM 耗尽**：stress 等工具可以分配内存进行测试。使用 `free -m` 观察对“可用”内存的影响。


    # 网络精通：使用命令行工具增强连接与通信


    让我们利用 Linux 命令行的力量进入网络精通领域。网络是现代计算的命脉，通过正确的工具，你的命令行将成为诊断问题、监控流量和保护连接的强大枢纽。


    # 基础：核心网络实用程序


    1. **ip (iproute2)**：现代网络配置和信息的瑞士军刀。


    示例：

    - ip addr show（列出网络接口及其地址）

    - ip route show（显示路由表）


    2. **ping**：经典的连通性测试。向主机发送 ICMP 回显包。


    示例：ping 8.8.8.8（检查到 Google DNS 服务器的连通性）


    3. **traceroute**：追踪你的系统与目标主机之间的网络路径（跳数）。对于确定位路由问题极具价值。


    示例：traceroute www.google.com


    4. **hostname -I**：快速显示你机器的 IP 地址。


    5. **ifconfig**：旧版工具（部分被 ''ip'' 取代）。在某些发行版中仍然有用。


    # 深度解析网络数据


    1. **netstat**：多功能网络状态查看器。提供信息：


    - 开放端口及其状态（netstat -lt - 显示正在监听的 TCP 端口）

    - 活跃连接（netstat -at - 所有 TCP 连接）

    - 路由表（netstat -r）

    - 网络接口统计（netstat -i）


    2. **ss**：netstat 的“继任者”。输出通常更快且更详细。


    - **示例**：ss -tulpen（显示监听和已建立的 TCP 和 UDP 套接字以及进程名称和 ID）


    - **tcpdump**：底层数据包嗅探器。以极其详细的捕获并显示网络流量。用于高级分析和调试。


    - **nmap**：（之前介绍过，再次回顾）：主要是一个端口扫描器，但也执行主机发现、操作系统指纹识别。在高手手中极其强大。


    # 远程连接与文件传输


    - **ssh**：安全 Shell。加密远程登录和终端会话的基石。


    - **示例**：ssh user@remote_server_ip


    - **scp**：安全拷贝。通过 SSH 传输文件。


    - **示例**：scp local_file.txt user@remote_server_ip:/path/on/server


    - **rsync**：高级同步工具。高效仅传输文件或目录的*差异*，是备份和镜像的理想选择。


    # Web 调试


    - **curl**：获取数据或向 Web 服务器 (HTTP) 发起请求

    - **wget**：获取数据或向 Web 服务器 (HTTP) 发起请求


    # DNS：互联网


    - **dig**：强大的 DNS 查询工具。

    - **nslookup**：更简单的 DNS 查询工具。


    # 额外资源


    - **ExplainShell**：https://explainshell.com/

    - **Linux Cookbook**：https://linuxcookbook.com/


    # 故障排除技巧


    - **从简单开始**：使用 ping 检查可用性。

    - **检查接口**：ip addr show

    - **检查路由**：traceroute 发现问题跳数。

    - **防火墙**：iptables 控制入流量。


    # 安全考虑


    - **开放端口**：netstat 检查监听的服务。

    - **SSH 最佳实践**：禁用密码登录，改用密钥登录。

    - **防火墙**：ufw 阻塞不必要的。


    # 实际分析：场景模拟


    你遇到了上网速度缓慢的问题。


    1. **基础**：ping 8.8.8.8 检查丢包情况。

    2. **网关**：traceroute 8.8.8.8 是否在网络内的跳数缓慢？

    3. **DNS**：dig google.com @1.1.1.1 测试不同的 DNS 服务器（如 Cloudflare）。


    '
