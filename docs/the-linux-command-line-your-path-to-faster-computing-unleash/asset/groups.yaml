- md: "\nNow, only the file with the spaces in its name is deleted.\n\n## Methods\
    \ of Quoting\n\n1. **Enclosing the Whole Filename**: As seen above, \"Filename\
    \ With Spaces.ext\"\n2. **Escape Characters**: The backslash ( \\ ) placed *directly*\
    \ before a space.\n   Example: my\\vacation\\ photos is treated as \"my vacation\
    \ photos\".\n\n## When to Choose Which\n\n- **Simple Spaces**: Either quoting\
    \ or the backslash escape works fine.\n- **Special Characters**: (Part 2!) Things\
    \ like '$', or '\"' need more careful quoting, as the shell interprets them separately.\n\
    \n## Caveats: Graphical Tools vs. Terminal\n\n- File managers often visually show\
    \ a single file even if it has spaces, and let you rename, etc. They're hiding\
    \ the quoting from you!\n- Some commands have built-in ways to handle spaces without\
    \ you needing to quote.\n\n## Practice Makes Perfect\n\nCreate a ‘test’ directory\
    \ and deliberately make files and subdirectories with spaces in their names. Then\
    \ practice the following:\n\n- **ls -ing Them**: Do it with and without quotes\
    \ to see the difference.\n- **cd -ing Into Them**: Get comfortable navigating\
    \ into these directories.\n- **Copying with cp and Moving with mv**: Ensure you\
    \ preserve the spaces.\n\n## Extra: Quoting Within Scripts\n\nIf you write shell\
    \ scripts ( bash , etc.) the rules of quoting become even more important, as now\
    \ it’s the script interpreting things, not just your interactive session.\n\n\
