    \    - 关注输出的最开始部分，看起来像 `-rw-r--r--`。这告诉我们：\n        - 文件类型：开头的 `-` 表示普通文件。\n \
    \       - 所有者权限：接下来的 `rw-` 表示所有者具有读取和写入权限，但没有执行权限。\n        - 组权限：`r-` 表示用户组只有读取权限。\n\
    \        - 其他权限：`r-` 表示其他人（任何其他人）只有读取权限。\n\n注意：要更改权限，你需要 `chmod` 命令，这值得专门开启一个章节！\n\
    \n## 场景 2：发现大文件\n\n你的磁盘快满了。你需要一种快速方法来识别家目录中最大的文件：\n\n1. 列出所有项：`ls -lah ~`\n2.\
    \ 按大小排序：`ls -lah ~ | sort -rh -k5`\n    - 我们在这里引入了“管道”（piping），将 `ls` 的输出传递给 `sort`\
    \ 命令。\n    关于管道的细节稍后介绍！关键部分是 `-rh -k5`，它告诉 `sort` 根据第 5 列（文件大小）进行反向（从大到小）人类可读排序。\n\
    \n## 深入探索\n\n让我们介绍更多强大的选项，并带来实际示例：\n\n- -S（按大小排序）：名副其实——直接按文件大小对 `ls` 输出进行排序。\n\
