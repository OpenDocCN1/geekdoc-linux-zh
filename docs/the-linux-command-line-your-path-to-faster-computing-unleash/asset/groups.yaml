    # The Essential Shortcuts – Part 1


    # 1. Movement Within a Line


    +   * **Ctrl+A**: Jump to the beginning of the line.

    * **Ctrl+E**: Jump to the end of the line.

    * **Left/Right Arrows**: Move one character at a time (you knew this one, but
    it''s vital!).


    # 2. Editing on the Fly


    +   * **Ctrl+U**: Delete everything *before* your cursor on the current line.

    * **Ctrl+K**: Delete everything *after* your cursor.

    * **Ctrl+W**: Delete the word before your cursor.


    # 3. Recalling Past Commands


    +   * **Up/Down Arrows**: Cycle through your command history. Hit Enter to execute
    a command from your history.


