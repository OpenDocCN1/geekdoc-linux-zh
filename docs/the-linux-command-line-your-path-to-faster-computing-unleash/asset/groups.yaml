    \ completely custom timestamp using the format [[CC]YY]MMDDhh-mm[.ss]].\n  - Example:\
    \ touch -t 2022122201530.45 old_report.txt (Sets the timestamp to Dec 20th, 2022\
    \ at 3:30 PM and 45 seconds)\n\n# Scenario 2: “As-Of” Backups\n\nYou need a snapshot\
    \ of your source code folder as it existed last week.\n\n+   1. **Create a Destination:**\
    \ mkdir project_backup_20231115\n2. **Selective Copying:** cp project_source/*.java\
