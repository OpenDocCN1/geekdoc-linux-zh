    **管道：命令链的威力**


    在 Linux 中，一个命令的输出可以成为另一个命令的输入。这是通过“管道”实现的，用符号 `|` 表示。让我们看看它是如何增强 `ls` 的：


    **场景 1：关注文件类型**


    你只关心当前目录下的图像文件：


    1. ls -l（信息太多了！）

    2. ls -l | grep ".jpg"（`ls` 的输出被传递给 `grep`，它搜索包含“.jpg”的行）


    # 场景 2：统计结果


    你的 Documents 文件夹中有多少文本文件？


    `ls -l ~/Documents/*.txt | wc -l`（`wc -l` 命令统计行数）


    # **超越 grep：更有用的管道伙伴**


