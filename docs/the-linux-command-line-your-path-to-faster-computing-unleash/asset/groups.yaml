    +   2. **free -m**: Displays available and used memory (RAM) in megabytes.


    +   3. **df -h**: Shows disk space usage for mounted filesystems in human-readable
    format.


    +   4. **vmstat**: Provides information about processes, memory, I/O, CPU activity,
    and more. Look for high numbers in the ‘block’ I/O columns (bi, bo) as these suggest
    a slow disk.


    +   5. **ostat**: Specifically monitors storage device (disks) input/output statistics.


    # Optimization Tactics


    Let''s explore strategies targeting the common bottlenecks:


    # Strategy 1: Freeing Up Resources


    +   **Kill Unnecessary Processes**: Identify greedy processes with top or htop.
    Use kill process_ID or killall process_name (use these cautiously).


    +   ** **Manage Startup Applications**: Many GUI distros have built-in tools.
    Command-line way: investigate ~/.config/autostart or system-level startup scripts
    (varies by distribution).


    +   **Change Desktop Environment**: Lighter-weight desktops (XFCE, LXDE) use less
    RAM, ideal for older machines.


