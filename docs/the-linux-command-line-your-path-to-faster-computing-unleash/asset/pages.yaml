- img_proc: true
  md: 'Let’s introduce the two most important wildcards:


    +   **The Asterisk (* )** This powerful symbol represents zero or more characters.
    Let’s see some examples:

    - report*.txt : Matches "report.txt", "report_final.txt", "report2023_Jan.txt",
    etc.

    - data*.csv : Matches "data.csv", "data_backup.csv", "data_old_1203.csv", etc.

    - temp* : Matches any file or directory starting with "temp"\n-n**The Question
    Mark (? )** This wildcard represents a single character.

    - data_??.log : Matches "data_01.log", "data_AB.log", but not "data_123.log".

    - backup_2023??15.zip : Matches "backup_20230315.zip", "backup_20231215.zip",


    # Wildcards in Action


    Let’s see how wildcards bring efficiency to common command-line tasks:


    +   1. **Selective File Removal**: You want to delete all PDF files from a directory
    filled with other important files. Here''s the command:


    ```

    rm *.pdf

    ```


    +   2. **File Renaming in Bulk**: Imagine renaming a series of files like "image1.jpg",
    "image2.jpg" to "trip1.jpg", "trip2.jpg", etc. Wildcards to the rescue:


    ```

    mv image?.jpg trip?.jpg

    ```'
  merge: -1
  pgno: 254
- img_proc: true
  md: '3. Copying Specific File Types: Want to copy all the markdown files starting
    with “chapter” from multiple sub-directories into your current directory?


    ```

    cp *//chapter*.md

    ```


    # Combining Wildcards for Extra Power


    You can strategically combine wildcards to craft sophisticated matching patterns.


    +   **Matching Text within Filenames**: Let''s say you want to list all files
    containing the word “draft” anywhere in the filename:


    ```

    ls *draft*

    ```


    +   **Targeting File Extensions**: Need to find all backup files, which could
    have .bak , .backup , or related extensions?


    ```

    find . -name "*.bak*"

    ```


    # Tips and Cautions


    +   **Hidden Files**: Remember, wildcards like * by default don''t match hidden
    files (filenames starting with a dot). To include them, you might need to modify
    patterns (e.g., .* for any file, including hidden) or use specific options with
    your commands.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '+   - **Unexpected Expansion**: Use the ls command to test the effects of your
    wildcards before using them with destructive commands like rm .


    +   - **Quoting**: In scenarios with complex filenames, it may be necessary to
    quote your pattern (e.g., rm ''Invoices*.pdf'' ) to prevent the shell from misinterpreting
    them before the command executes.


