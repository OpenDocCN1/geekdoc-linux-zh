- img_proc: true
  md: 'Sometimes, you need to execute the same command with minor variations. Brace
    expansion provides an elegant way to streamline this process:


    +   - **Syntax**: {option1,option2,option3...}

    - **Example 1**: Want to create multiple directories quickly?


    ```

    mkdir project_{{backup,data,docs}}

    ```


    This is equivalent to running mkdir project_backup mkdir project_data , mkdir
    project_docs .


    +   - **Example 2**: Compressing files with different extensions:


    ```

