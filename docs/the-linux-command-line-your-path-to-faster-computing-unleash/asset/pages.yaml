  md: '+   - --format=commas or -m : Comma-separated names – great for copying into
    other commands.


    +   - --format=horizontal or -x : Displays names across the screen.


    +   - --format=vertical or -1 : Single column listing (filenames only)


    # Custom Specifiers


    Let''s build a custom format. Imagine we need: File Size, Owner, Modification
    Month-Day, Filename. Here''s the command:


    ```

    ls --format=single-column -l --time-style="+%b %d" %s %u %n

    ```


    +   - This looks complex, but let''s break it down:


    +   - --format=single-column : Ensures one file per line


    +   - -1 : We still want the detail of a long listing


    +   - --time-style="+%b %d" : Modifies the date to show Month and Day only


    +   - %s %u %n : Specifiers for File Size, Owner Username, Filename


