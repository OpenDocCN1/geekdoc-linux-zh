- img_proc: true
  md: "# Link Creation Techniques\n\nLet’s dive into the practical side of links with\
    \ “Crafting Linux Links, Part 1: Initiating Link Creation Techniques.” In this\
    \ chapter, we’ll turn the concepts of hard and soft links into tools you can wield\
    \ with power and precision.\n\n# Harnessing the ‘ln’ Command\n\nThe ln command\
    \ is your gateway to forging links:\n\n+   - **Basic Syntax**: ln [options] target\
    \ link_name\n- **options**: Modifiers to control the type of link created (we’ll\
    \ get to this soon)\n- **target**: The existing file or directory you want to\
    \ link to.\n- **link_name**: The name of the new link you’re creating.\n\nLet’s\
    \ break it down:\n\n# The Art of the Hard Link\n\n+   1. **Command**: ln target_file\
    \ hard_link_file\n   - **Important**: You cannot hard link directories!\n2. **Verification**:\n\
    \   - ls -li target_file hard_link_file Observe the identical inode numbers\n\
    \   - Modify one of the files, and use ls or a text editor to confirm both have\
    \ changed."
  merge: -1
  pgno: 51
- img_proc: true
  md: "Example Scenario: You’re working on an important presentation, ‘report.odp’,\
    \ and want another access point within your ‘Documents’ directory:\n\n+   1. cd\
    \ ~/Documents\n2. ln ../report.odp presentation_report.odp (Assuming the original\
    \ is one level outside Documents)\n\n# Mastering the Symbolic (Soft) Link\n\n\
    +   1. Command: ln -s target_file_or_directory soft_link_name\n   - The crucial\
    \ option here is -s\n2. Verification:\n   - ls -l soft_link_name You’ll see the\
    \ ‘->’ indicator in the output\n\nExample Scenario: Your music collection is on\
    \ an external drive, and you want to easily access it from within your ‘~/Music’\
    \ directory:\n\n+   1. ln -s /media/usdisk/Music_Collection ~/Music/External_Music\
    \ (Adjust the paths according to your system)\n\n# Caution: Broken Links\n\n+\
    \   - Soft links are susceptible to breakage. If the original target is deleted\
    \ or moved, the soft link is left pointing to a non-existent location.\n- Commands\
    \ and scripts that rely on the soft link may then fail."
