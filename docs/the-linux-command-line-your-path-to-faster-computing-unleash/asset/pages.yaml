  md: '# Practical Network Analysis: A Scenario


    You’re experiencing slow internet speeds. Let''s use command-line tools to investigate!


    +   1. **Basics**: ping 8.8.8.8 checks for packet loss or high latency.

    2. **Gateway**: traceroute 8.8.8.8 - are there slow hops within your local network?

    3. **DNS**: dig google.com @1.1.1.1 - test a different DNS server (like Cloudflare''s)
    to rule out DNS resolution issues.


