  md: '+   - Bottleneck Identification: See what''s slowing down your system.

    - Proactive Problem Solving: Catch issues early, preventing downtime.

    - Trend Analysis (Longitudinal): Tools that log data over time help spot gradual
    degradation in performance.


    # Core Areas to Monitor


    +   1. CPU Utilization: The heart of your system. Is it overworked, or are there
    unused cores?

    2. Memory (RAM) Usage: Does your system have enough breathing room, or is it constantly
    scrambling for memory (swapping)?

    3. Disk I/O: How quickly data is read from and written to disks. Bottlenecks here
    cripple system responsiveness.

    4. Network Activity: Monitoring bandwidth usage, traffic types, and connection
    issues are crucial for networked systems

    5. Process Health: Keeping an eye on what programs are running, their resource
    consumption, and spotting any potential troublemakers.


    # Our Toolkit: Essential Commands


    Let''s revisit some familiar tools with a monitoring focus, and introduce some
    new ones:


    +   - top (or htop): The classic, real-time overview of processes, CPU, and memory.
    Focus on the %CPU column, ''Mem'' section, and individual process sorting.

    - free: Memory snapshot. Look at ''free'' and ''available'' under the Mem row.
    Swap usage is a red flag.

    - df: Disk usage per partition. Look for nearly full filesystems.'
  merge: -1
  pgno: 292
- img_proc: true
  md: '+   - iostat: Detailed disk input/output statistics. High wait times (await)
    suggest an overworked disk.

    - vmstat: Provides a broader view of system state (memory, I/O, CPU, even context
    switching – advanced)

    - netstat: Network status. Useful variations include netstat -s (summary by protocol),
    netstat -i (interface stats), netstat -r (routing table).

    - sar (sysstat): Versatile collector. Can be configured to record historical performance
    data.


    # Continuous Monitoring


    For ongoing monitoring, consider these tools:


    +   - glances: Like an enhanced ‘top’, presented beautifully.

    - nmon: Visual system monitor. Interactive mode allows switching between resources
    like CPU, disk, network, etc.

    - System Logging: Services like rsyslog or journalctl are your long-term record.
    Filtering logs investigate specific events.


    # Interpreting the Data


    Monitoring is as much about interpretation as it is about the tools themselves:


    +   - Spikes vs. Sustained Load: Is a CPU spike temporary, or is your system consistently
    struggling?

    - Memory Leaks: Does a process slowly consume more RAM over time, suggesting a
    bug?

    - Unexpected Disk Activity: Is a program heavily churning on the disk when it
    shouldn''t be?

    - Baselines: Understanding what’s “normal” for your system is crucial to detect
    anomalies.'
