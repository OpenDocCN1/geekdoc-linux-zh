    2. **Targeting Date-based Backups**: Imagine you have backups named “backup_20230314.tar.gz”,
    “backup_20230315.tar.gz” and so on:


    ```

    ls backup_2023[0-9][0-9][0-1][0-9].tar.gz

    ```


    This ensures you match two-digit months and two-digit days.


    # Wildcards in Advanced Command Combinations


    Let''s see how wildcards empower even more complex actions:


    +   **Finding and Executing**: Ever needed to find files of a specific type and
    perform an operation on them? The find command paired with -exec is your friend:


    ```

    find .-name "*.bak" -exec rm -i {};

    ```


    This finds backup files (ending with .bak), and executes rm -i for each one (the
    -i prompts before deletion). Remember, the {} \ is the magic part!


    +   **Complex Files Copy**: Need to copy all text (.txt) and markdown (.md) files,
    excluding drafts, from various directories into a central “archive” folder'
