  md: "+   1. List Everything: ls -lah ~\n2. Sort by Size: ls -lah ~ | sort -rh -k5\n\
    \   - We’re introducing ‘piping’ here, where the output of ls is fed into the\
    \ sort command.\nDetail on piping will come later! The key part is -rh -k5 , which\
    \ tells sort to do a reverse (largest to smallest), human-readable sort based\
    \ on the 5th column (file size).\n\n# Going Deeper\n\nLet's introduce a few more\
