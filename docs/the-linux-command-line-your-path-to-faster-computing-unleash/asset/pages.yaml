  md: 'The mv command is a powerhouse of file organization, allowing us to relocate
    files and change their names. Let''s get moving!


    # Fundamentals of mv


    1. Moving a File:


    ```

    bash

    mv source_file target_directory

    ```


    +   * Moves ''source_file'' into the ''target_directory''.

    * If the ''target_directory'' doesn''t exist, it''s treated as a filename (renaming,
    see below).


    # 2. Renaming a File:


    ```

    bash

    mv old_filename new_filename

    ```


    +   * Renames ''old_filename'' to ''new_filename'' within the *same* directory.


    # Key Points


    +   * **Overwriting:** mv will overwrite an existing file in the destination if
    the names match!

    * **Directories Too:** mv can also move entire directories, including their contents.'
