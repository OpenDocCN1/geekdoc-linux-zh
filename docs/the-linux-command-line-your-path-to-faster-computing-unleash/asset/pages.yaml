  md: "+   - -a (all files): Includes hidden files (those starting with a .)\n- -h\
    \ (human-readable sizes): Displays file sizes in KB, MB, GB for easier interpretation.\n\
    \n# Combining Options\n\nThe real power comes when you combine these. ls -lah\
    \ is a very common starting point for getting a detailed, human-friendly directory\
    \ listing.\n\n# Scenario 1: Permission Troubleshooting\n\nYou're trying to run\
    \ a script, but it fails with a ‘permission denied’ error.\n\n+   - Start with\
    \ the Basics: cd to the directory containing the script.\n- Get the Details: ls\
    \ -l script_name.sh\n  - Focus on the very first part of the output, which looks\
    \ like -rw-r--r-- . This tells you:\n    - File Type: The leading - means regular\
    \ file.\n    - Owner Permissions: The next ‘rw-’ means Read, Write, but no eXute\
    \ for the owner.\n    - Group Permissions: ‘r-’ means the group has Read only.\n\
    \    - Other Permissions: ‘r-’ means others (anyone else) have Read only.\n\n\
    Note: To change permissions, you would need the chmod command, which warrants\
    \ its own chapter!\n\n# Scenario 2: Spotting Large Files\n\nYour disk is getting\
    \ full. You need a quick way to identify the largest files in your home directory:"
