  md: '# # Command for File Replication, Part 1


    Let''s dive into the art of copying files in Linux, mastering the cp command''s
    options and the scenarios where it shines.


    # ## The Basics of cp


    At its core, cp is used to create a duplicate of a file:


    +   - cp source_file target_file Creates a copy named ''target_file''. If ''target_file''
    exists, it is OVERWRITEN!


    # ## Key Points


    +   - File Content: cp duplicates the contents of the file, not just the filename.

    - Permissions & Timestamps: By default, the copy may have slightly different permissions
    and timestamps than the original. We''ll learn how to preserve those later.


    # ## Scenario 1: Safety Backup


    You''re working on ''critical_report.odt''. Let''s make a backup:


    cp critical_report.odt critical_report_backup.odt


    # ## Scenario 2: Distributing a File


    You have a setup script. Let''s copy it into several user directories:'
  merge: -1
  pgno: 108
