    > 很多情况一样，当林斯·托瓦尔斯（Linux Torvalds）完成内核后，他的朋友们寻找自由软件，结果发现无缘无故地，构建类 UNIX 系统所需的一切都已经就绪了。


    > 我们发现的 GNU 系统并非偶然。可用的自由软件[6] 之所以能构成一个完整的系统，是因为 GNU 项目自 1984 年以来一直致力于开发这样一个系统。《GNU
    宣言》设定了开发一个名为 GNU 的自由类 Unix 系统的目标。《GNU 项目的最初公告》也概述了 GNU 系统的的一些原始计划。当 Linux 出现时，[GNU]
    系统已几乎完成。[7]


    * [3] www.gnu.org/software/hurd/hurd.html

    * [4] www.gnu.org/software/hurd/gnumach.html

    * [5] www.gnu.org/software/hurd-and-linux-gnu.html

    * [6]  own录 D 或 www.gnu.org/philosophy/free-sw.html。

