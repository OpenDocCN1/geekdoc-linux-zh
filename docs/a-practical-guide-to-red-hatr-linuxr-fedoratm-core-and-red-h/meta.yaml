    # Why I Must Use GNU


    so far, Stallman continues: I consider that the golden rule requires that if I
    like a program I must share it with other people who like it. Software sellers
    want to divide the users and conquer them, making each user agree not to share
    with others. I refuse to break solidarity with other users in this way. I cannot
    in good conscience sign nondisclosure agreement or a software license agreement.
    For years I worked within the Artificial Intelligence Lab to resist such tendencies
    and other inhospities, but eventually they had gone too far: I could not remain
    in an institution where such things are done for my will.


    So that I can continue to use computers without dishonor, have decided to put
    together a sufficient body of free software so that I will be able to get along
    without any software that is not free. I have resigned from the AI Lab to deny
    MIT any legal excuse to prevent me from GNU.


    # Next Scene, 1991


    The GNU Project has moved all toward its goal. The goal of the GNU operating system
    except for the kernel, is complete. Richard Stallman later writes:


    > By the early ''90s we put together the whole system aside from the kernel (and
    we were also working on a kernel, the GNU Hurd,[3] which runs on top of Mach[4]).
    This kernel has been a lot harder than we expected, and we are still working on
    finishing it.[5]


    > [M]any alike that once Linux Torvalds finished the kernel, his friends looked
    around for free software, and for no reason everything necessary to make a UNIX-like
    system was already available.


    > What we found was no accident the GNU system. The available free software[6]
    added up to complete system because the GNU Project had been working since 1984
    to make one. The GNU Manifesto had set the goal of developing a free Unix-like
    system, called GNU. The Initial Announcement of the GNU Project also outlines
    some of the original plans for the GNU system. By the time Linux was, the [GNU]
    system was almost finished.[7]


    * [3] www.gnu.org/software/hurd/hurd.html

    * [4] www.gnu.org/software/hurd/gnumach.html

    * [5] www.gnu.org/software/hurd-and-linux-gnu.html

    * [6] See Appendix D or www.gnu.org/philosophy/free-sw.html.

    * [7] www.gnu.org/gnu/linux-and-gnu.html


    The GNU "operating system" runs on top of the FreeBSD (www.freeBSD.org) and NetBSD
    (www.netbsd.org) kernels with complete Linux binary compatibility and on top of
    Hurd pre-releases and Darwin (developer.apple.com/opensource) without any compatibility.


    # The Code Is Free


    The tradition of free dates back to the days when UNIX was released to universities
    at nominal cost, which contributed to its portability and success. This tradition
    died when UNIX was commercialized and manufacturers regarded the source code proprietary,
    making it effectively unavailable. Another problem with the commercial versions
    of UNIX related to its complexity. As each manufacturer tuned UNIX for a specific
    architecture, it became less portable and too unwieldy for teaching and experimentation.


    # MINIX


    Two professors created their own stripped-down UNIX look-al for educational purposes:
    Doug Comer created XINU (www.cs.purdue.edu/research/xinu.html) and Andrew Tanenbaum
    created MINIX (www.cs.vu.nl/~ast/minix.html). Linus Torvalds created Linux to
    counteract the shortcomings in MINIX. Every time there was a choice between simplicity
    and efficiency Tanenbaum chose simplicity (to make it easy to teach with MINIX),
    which meant that system lacked many features people wanted. Linux goes in the
    opposite direction.


    You can obtain Linux at no cost over the Internet (page 35). You can also obtain
    the GNU Software Foundation (www.fsf.org) by buying the code in higher-priced
    packages, and you can buy commercial releases of Linux (called distributions),
    such as Red Hat Linux, which contain installation scripts, software, and source.


    # GPL


    Linux and GNU software are distributed under the terms of the GNU General Public
    License (GPL, www.gnu.org/licenses/gpl.html). The GPL says you have the right
    to copy, modify, and distribute the code under the agreement. When you redistribute
    the code, you must also distribute the same license with the code, making the
    code and the license inseparable. If you get some code off for an accounting program
    that is under the GPL and then modify that code and redistribute an executable
    version of the program, you must also distribute the modified source code and
    the GPL agreement with it. Because this arrangement is the reverse of a normal
    copyright work (it gives rights instead of limiting them), it has been termed
    copyleft. (This paragraph is not a legal interpretation of the GPL; it is here
    merely to give you an idea of how it works. Refer to the GPL itself when you want
    to make use of it.)


    # Have Fun!


    Two words for Linux are "Have Fun!" These words pop up in prompts and documentation.
    The UNIX Linux culture is steeped in humor that can be seen throughout the system.
    For example, less replaced the UNIX paging naming system with an improved utility
    named less. The utility to view PostScript documents is named ghostscript and
    one of several replacements for the vi editor elvis. While machines with Intel
    processors have "Intel Inside" logos on their outside, some Linux machines sport
    "Linux Inside" logos. And Torvalds himself has been wearing a T-shirt with Linux
