    # The GNULinux Connection


    An operating system is the low-level software that schedules tasks, allocates
    storage, and handles the interfaces to peripheral hardware, such as printers,
    disk drives, the screen, keyboard, and mouse. An operating system has two main
    parts: the kernel and the system programs. The kernel allocates machine resources,
    including memory, disk space, and CPU (page 1026) cycles, to all other programs
    that run on the computer. The system programs perform higher-level housekeeping
    tasks, often acting as servers in a client/server relationship. Linux is the name
    of the kernel that Lin Torvalds presented to the world in 1991 and that many others
    have worked on since to enhance, stabilize, expand, and make more secure.


    # The History of GNULinux


    This section presents some background on the relationship between GNU and Linux.


    # Fade to 1983


    Richard Stallman (www.stallman.org) announced[1] the GNU Project for creating
    an operating system, both kernel and system programs, and presented the GNU Manifesto,[2]
    which begins as follows:


    +   [1] www.gnu.org/gnu/initial-announcement.html


    +   [2] www.gnu.org/gnu/manifesto.html


    GNU, which stands for GNU''s Not UNIX, is the name for the complete UNIX-compatible
    software that I am writing so that I can give away free to everyone who can use.


    Some years later, Stallman added a footnote to the preceding sentence when he
    realized it was creating confusion:


    > The wording was careless. The intention was that nobody would have to pay for
    "permission" to use the GNU system. But the words don''t make this clear, and
    people often interpret, as saying that companies of GNU should always be distributed
    at little or no charge. That was never the intent; later, on the manifesto the
    possibility of companies providing the service of distribution for a profit. Subsequently
    I have learned to distinguish carefully between "free" in the sense of freedom
    and "free" in the sense of price. Free software is software that users have the
    freedom to distribute and change. Some users obtain copies at no charge, others
    pays to obtain copies if the funds support improving the software, so much better.
    The important thing is that everyone who has a copy has the freedom to cooperate
    with others in using it.


    In the manifesto, after explaining a little about the project and what has been
    accomplished'
