    # Proprietary operating systems


    Second, with the cost of hardware continually dropping, hardware manufacturers
    could no longer afford to develop and support proprietary operating systems. A
    proprietary operating system is written and owned by the manufacturer of the hardware
    (for example, DEC/Compa owns VMS). Today''s manufacturers need a generic operating
    system that they can easily adapt to their machines.


    # Generic operating systems


    A generic operating system is written outside of the company manufacturing the
    hardware and is sold (UNIX, Windows) or given (Linux) to the manufacturer. Linux
    is a generic operating system because it runs on different types of hardware produced
    by different manufacturers. Of course, if manufacturers can pay for development
    and avoid unit costs (they have to pay to Microsoft for each copy of Windows they
    sell), manufacturers are much better off. In turn, software developers need to
    keep the prices of their products down; they cannot afford to convert their products
    to run under many different proprietary operating systems. Like hardware manufacturers,
    software developers need a generic operating system.


    Although the UNIX system once met the needs of hardware companies and researchers
    as a generic operating system, over time it has become more proprietary as each
    manufacturer added support for specialized features and introduced new software
    libraries and utilities.


    Linux emerged to serve both needs. It is a generic operating system that takes
    advantage of available hardware power.


    # Linux Is Portable


    A portable operating system is one that can run on many different machines. More
    than 95 percent of the Linux operating system is written in the C programming
    language, and C is portable because it is written in a higher-level, machine-independent
    language. (The C compiler is written in C)


    Because is, it can be adapted (ported) to different machines and can make special
    requirements. For example, Linux is used in embedded computers, such as the ones
    found in celulares, PDAs, and the cable boxes on top of many TVs. The file structure
    takes full advantage of large, hard disks. Equally important, Linux was originally
    designed as a multiuser operating system not modified to serve several users as
    an afterthought. Sharing the computer''s power among many users and giving them
    the ability to share data and programs are central features of the system.


    Because it is adaptable and takes advantage of available hardware, Linux runs
    on many different microprocessor-based systems as well as mainframes. The popularity
    of the microprocessor-based hardware drives Linux; these computers are getting
    faster all the time, at the same price point. Linux on a fast microcomputer has
    become good enough to displace workstations on many desktops. Linux benefits both
    users, who do not like learning a new operating system for each vendor''s hardware,
    and system administrators, who like having a consistent software environment.'
  - '[PAGE 33]


    Generated by Unregistered Batch CHM TO PDF Converter 2010.2.913.1026, please register!


    The advent of a standard operating system has aided the development of the software
    industry. Now software manufacturers can afford to make one version of a product
    available on machines from different manufacturers.


    # Standards


    Individuals from companies throughout the computer industry have joined together
    to develop the POSIX (Portable Operating System Interface for Computer Environments)
    standard, which is based largely on the UNIX V Interface Definition (SVID) and
    earlier standardization efforts. These efforts have been spurred by the U.S. government,
    which needs a standard computing environment to minimize its training and procurement
    costs. Now that these standards are gaining acceptance, software developers are
    able to develop applications that run on all conforming versions of UNIX, Linux,
    and other operating systems.


    # The C Programming Language


    Ken Thompson wrote the UNIX operating system in 1969 in PDP-7 assembly language.
    Assembly language is manage dependent: Programs one family of written in assembly
    language on only one machine, or at best, one family of machines. The original
    UNIX operating system could not be easily transported to other machines (it was
    portable).


    To make UNIX portable, Thompson developed the B programming language, a machine-independent
    language, from the BCPL language. Dennis Ritchie developed the C by modifying
    B, and with Thompson, rewrote UNIX in C in 1973. The revised operating system
    could be transported more easily to run on other machines.


    That development marked the start of C. Its roots reveal many of the reasons why
    it is such a powerful tool. C can be used to write machine-independent programs.
    A programmer who designs a program to be portable easily to any computer that
    has a C. C is also designed to compile into very efficient code. With the advent
    of C, a programmer no longer had to resort to assembly language to get code that
    would run well (that is, although an assembler will generate more efficient code
    than a high-level language).


    C is a good systems language. You can write a compiler or an operating system
    in C. It is highly structured but not a high-level language. C allows a programmer
    to manipulate bits and bytes, as necessary when writing an operating system. It
    also has high-level constructs that allow efficient, modular programming.


    In the 1980s the American National Standards Institute (ANSI) defined a standard
    version of the C language, commonly referred to as ANSI C or C89 (for the year
    the standard was published). Ten years later the C99 standard was published; it
    is mostly supported by the GNU Project''s C (named *gcc*). The original version
    of the language is often referred to as Kernighan & Ritchie (or K&R) C, named
    for the authors of the book that first described the C.


    Another researcher at Bell Labs'
