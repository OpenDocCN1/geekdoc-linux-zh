  md: '# What Is New in This Edition?


    The third edition of A Practical Guide to Red Hat® Linux covers Fedora Core 5
    and Red Hat Linux version 4. All the changes, large and small, that have been
    made to these products since the second edition of this book have been incorporated
    into the explanations and examples. The following list lists the details of this
    book that have undergone the most major changes.


    +   * Access Control Lists (ACLs); a security feature that provides finer-grained
    control over which users can access directories and files than traditional Linux
    permissions.

    * SELinux (Security Enhanced Linux); a security feature that enforces security
    policies that limit what a user or program can do.

    * bash (Again Chapters 7, 9, and 28) These chapters have been reorganized and
    rewritten with clear explanations and better-examples of how bash works from the
    command line to day-to-day and as a programming language to write scripts.

    * yum (46) A program that keeps Fedora Core systems up-to-date. The utility downloads
    software from repositories on the Internet. It can upgrade existing software and
    install new software. You can run manually or have it automatically every night.

    * pint (48) A graphical package management utility. The pint is similar to yum
    except that it works with groups of software packages. For example, you can use
    pint to download and install the entire KDE desktop environment with one command.

    * parted (65) A command line utility that reports on and manipulates hard disk
    partitions.


    # Features of This Book


    This book is designed and organized so you can get the most out of it in the shortest
    amount of time. You do not have to read this book straight in page order. Once
    you are comfortable using Linux, you can use this book as a reference: Look up
    a topic of interest in the table of contents or index. Think of this book as a
    catalog of Linux topics: Flip the pages until a topic catches your eye. The book
    includes many ways to see where you can find additional information: Consider
    the Internet extension of this book.


    A Practical Guide to Red Hat® Linux®, Third Edition, is structured with the following
    features:


    +   * In this book, the term Red Hat refers to both Fedora Core and Red Hat Linux.
    Features that apply to only one operating system or the other are marked as using
    indicators: FEDORA or RHEL.

    * Optional sections enable you to read the book at different levels, returning
    to more difficult material when you are ready to delve into it.

    * Caution boxes highlight procedures that can easily go wrong, giving guidance
    before you run into trouble.

    * Tips boxes highlight ways that you can save time by...

    * Security boxes point out places where you can make a system more secure. The
    security appendix presents a quick background in system security issues.

    * Concepts are illustrated by practical examples throughout the book.

    * Chapter summaries review the important points covered in each chapter.

    * Review exercises are included at the end of each chapter for readers who want
    to further hone their skills. Answers to even-numbered exercises are at


    www.sobell.com.'
