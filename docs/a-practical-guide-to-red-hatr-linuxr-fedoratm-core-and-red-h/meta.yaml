    (SMP) 上运行。它包含一个 O(1) 调度器，这极大地提高了 SMP 系统的可扩展性。


    ## 模拟器


    Linux 支持名为模拟器的程序，这些程序运行为其他操作系统设计的代码。通过使用模拟器，你可以在 Linux 下运行某些 DOS、Windows 和 Macintosh
    程序。Wine ([www.winehg.com](http://www.winehg.com)) 是基于 X Window 系统和 UNIX/Linux
    的 Windows API 开源实现；QEMU ([fabrice.bellard.free.fr/qemu](http://fabrice.bellard.free.fr/qemu))
    是一个仅限 CPU 的模拟器，可以在非 x86 Linux 系统上执行 x86 Linux 二进制文件。


    ## Xen


    Xen 创建于剑桥大学，现在由开源社区开发，是一种开源虚拟机监控器 (VMM)。VMM 允许多个虚拟机 (VM，每个运行一个操作系统实例）运行在单台机器上。Xen
    引入了虚拟机，使得其中一个崩溃不会影响其他任何一个。此外，与原生运行每个操作系统相比，Xen 引入了极微的性能开销。


    通过虚拟机，你可以在单台机器上尝试操作系统和应用程序的最新版本，而无需担心基础（稳定）系统。你可以在单台机器上设置并测试系统网络。Xen 提供了一个沙箱区域（系统区域），你可以在其中工作，而不必担心工作的结果或需要清理的需求。


    Fedora Core 5 包含了 Xen。本书不包含 Xen 的安装或使用。请参阅 [fedoraproject.org/wiki/FedoraXenQuickstartFC5](http://fedoraproject.org/wiki/FedoraXenQuickstartFC5)
    获取安装说明。


    有关 Xen 的更多信息，请参考 [wiki.xensource.com/xenwiki](http://wiki.xensource.com/xenwiki)
    和位于 [www.cl.cam.ac.uk/Research/SRG/nets/xen](http://www.cl.cam.ac.uk/Research/SRG/nets/xen)
    的 Xen 主页。


    ## 为什么 Linux 受硬件公司和开发者欢迎


    计算机行业的两个趋势为 UNIX 和 Linux 的流行奠定了基础。首先，硬件技术的进步对一种能够利用可用硬件能力的操作系统产生了需求。在 20 世纪 70
    年代中期，微机开始在许多应用中挑战大型主机，微机可以以更廉的价格执行相同的功能。最近，64 位处理器芯片、充足且廉价的内存以及价格更低的磁盘存储，使得硬件公司能够在台式电脑上安装多用户操作系统。


    ## 专有操作系统


    其次，随着硬件成本的不断下降，硬件制造商已无法负担开发和支持专有操作系统的费用。专有操作系统由硬件制造商编写并拥有（例如，DEC/Compa 拥有 VMS）。今天的制造商需要一种可以轻松适配到其机器的通用操作系统。


    ## 通用操作系统


    通用操作系统是在制造硬件的公司之外编写的，并出售（UNIX、Windows）或赠送（Linux）给制造商。Linux 是一种通用操作系统，因为它运行在不同制造商生产的不同类型的硬件上。当然，如果制造商可以支付开发费用并避免单位成本（他们每卖出一份
    Windows 拷贝都要向微软付费），制造商的处境会好得多。反过来，软件开发者需要保持其产品价格；他们无法负担将产品转换为在许多不同的专有操作系统运行。与硬件制造商一样，软件开发者也需要通用操作系统。


    尽管 UNIX 系统曾作为通用操作系统满足了硬件公司和研究人员的需求，但随着时间的推移，由于每个制造商增加对特殊功能的支持并引入新的软件库和实用程序，它变得越来越专有。


    Linux 的出现是为了同时满足这两种需求。它是一种利用可用硬件能力的通用操作系统。


    ## Linux 是可移植的


    可移植操作系统是指可以在许多机器上运行的操作系统。Linux 操作系统的 95% 以上是用 C 语言编写的，而 C 是可移植的，因为它是用高级的、与机器无关的语言编写的。（C
    编译器是用 C 语言编写的）


    由于具有可移植性，它可以适配（移植）到不同的机器并满足特殊需求。例如，Linux 被用于嵌入式计算机，如手机、PDA 以及许多电视顶部的机盒中的计算机。文件结构充分利用了大型硬盘。同样重要的是，Linux
    最初被设计为一种多用户操作系统，而不是在事后才修改为服务多个用户。在许多用户之间共享计算机能力并赋予他们共享数据和程序的能力是该系统的核心特性。


    由于具有适应性并利用了可用硬件，Linux 运行在许多不同的基于微处理器的系统以及主机上。微处理器硬件的普及驱动了 Linux 的发展；这些计算机正变得越来越快。随着
    C 语言的出现，程序员不再需要求助于汇编语言来获得运行良好的代码（尽管汇编器生成的代码比高级语言更高效）。这让喜欢拥有一致环境的系统管理员受益。


    ## 标准


    来自整个行业公司的个人共同开发了 POSIX（可环境可移植操作系统接口）标准，该标准很大程度上基于 UNIX V 定义 (SVID)。这些努力是由美国政府推动的，它需要一个标准的计算环境。现在这些标准获得了认可，软件开发者能够在所有标准的
    UNIX 版本上开发应用程序。


    ## C 语言语言


    Ken Thompson 在 1969 年用 PDP-7 汇编语言编写了 UNIX 系统。汇编语言是依赖机器的：用汇编语言编写的程序只能在一个机器上，或者最多在一个机器族上。原始的
    UNIX 系统无法轻松移植到其他机器。


    为了让 UNIX 可移植，Thompson 从 BCPL 语言开发了 B 语言，这是一种机器无关的语言。Dennis Ritchie 通过 B 开发了 C，并与
    Thompson 在 1973 年用 C 重写了 UNIX。修订后的操作系统可以更容易移植到其他机器上运行。


    该开发标志着 C 语言的开始。它的起源揭示了它成为如此强大工具的许多原因。C 可用于编写机器无关的程序。设计程序可移植的程序员可以轻松迁移到任何带有 C 的计算机。C
    也被设计为编译成高效的代码。


    C 是一种很好的系统语言。你可以用 C 编写编译器或操作系统。它是高度结构化的，但不是一种高级语言。C 允许程序员操作位和字节，这在编写操作系统时是必要的。它还具有高级结构，允许高效的模块化编程。


    贝尔实验室的另一位研究员


    '
