    # Red Hat® Linux® 实用指南，第三版：Fedora™ Core 和 Red Hat Enterprise Linux


    作者：Mark G. Sobell


    出版社：Prentice Hall


    出版日期：2006年6月27日


    印刷 ISBN-10: 0-13-228027-2


    印刷 ISBN-13: 978-0-13-228027-3


    页数：1168页


    + 目录 | 索引


    # 概述


    由于我身处教育环境，我发现 Sobell 这本书的内容非常切题，对于任何在企业中管理 Linux 的人员都非常有帮助。他的写作风格非常清晰。他编写了章节练习，我认为这些练习与用户或管理员会遇到的现实世界场景密切相关。IT/美国学生会发现这本书是他们教育的宝贵补充。书中的信息量平衡得极好，Sobell
    成功地在没有杂话和冗长叙述的情况下呈现了内容。对于任何在网络环境中管理 Linux 系统或运行 Linux 服务器的人来说，这都是本“必读之作”。我还会向向一位正转向
    Linux 平台的经验电脑用户极力推荐这本书。Mary Northrop，Barbara Davis Center/丹佛科拉多大学 IT 总监，发布于 slashdot.org
    的评论。


    在加州州立大学圣山分校（Cal Poly San Obispo）上大学期间，我有机会用过你们的 UNIX 书。我不得不说，你们的书是最好的之一！它们是教导操作系统理论方面和应用的优质书籍。Benton
    Chan，信息系统工程师


    尽管这本书针对的是 FC2，但它并没有达到我读过的许多评论中的预期。我在你们的书中发现了一些非常罕见的东西：它读起来不像技术文本，而像是一个故事。读起来是一种享受，让人读欲不能手。我说过吗？:)
    David Hopkins，业务流程架构师


    感谢你的工作以及你写的这本书。真的很少有书能帮助人们成为更高效的各种工作站管理员。我们（在俄罗斯）希望你能够继续对 Linux/UNIX 系统获得新的理解水平。Anton
    Petukov


    Mark Sobell 写了一本既平易近人又具权威性的书籍。Jeffrey Bianchi，倡导者、作者、记者


    “卓越的参考书，非常适合 Linux 集群的系统管理员，或考虑安装稳定版 Linux 的 PC 用户。不要被书中令人生畏的序言吓到。Sobell 努力尽可能全面，试图预测你的系统管理需求。”Wes
    Boudville，发明家


    “《Red Hat® 实用指南》是一本精彩的书。感谢 Mark Sobell。”C. Pozrikidis，加州大学圣地亚哥分校


    “这本书呈现我发现的 Linux 操作系统的最佳概述……无论读者的背景如何，它应该非常有帮助且易懂：传统的 UNIX 用户、新 Linux 爱好者或 Windows
    用户。每个主题都以清晰、完整的方式呈现，对读者的已知知识较少做假设……这本书作为参考非常有用，因为它包含了一份 70 页的术语表，并且索引非常详。它的组织方式让读者专注于简单任务，而无需在准备好之前处理更高级的话。”Cam
    Marshall，Marshall Information Service LLC，Range UNIX Users Group FRUG 成员，科罗拉多州博尔德


    “结论是，如果你是一个新的 Linux 用户并进入了 RH 世界，这就是你该买的书。没有其他其他书能涵盖这么多不同的主题并达到这种深度。”Eugenia Loli-Queri，OSNews
    Linux 编辑


    # 再次变得更加完美！完全修订以满足你对 Fedora Core 和 Red Hat Enterprise Linux 的所有需求！


    Fedora Core 和 Red Hat Enterprise Linux 是先进的操作系统。你需要一本同样先进的书。这本书清晰且有效地解释了你关注的特性，从系统安全和互联网服务器设置到
    Windows 文件/打印机共享。顶级作者 Mark Sobell 从头开始，带你了解所有重要内容，从使用附带的 DVD 安装 Linux，到使用 GNOME、KDE、Samba、sendmail、Apache、DNS、NIS
    和 iptables。


    本版包含了广泛的涵盖，包括关于命令行和图形界面（GUI）的 Linux 完整章节；更丰富的系统管理和安全指导；以及关于设置网络和每种主要类型互联网服务器的最新、循序渐进的说明。在此过程中，学习“如何做”和“为什么”。Mark
    Sobell 非常熟悉 Linux，并教过数千名读者，他从不会忘记初学 Linux 的感觉。无论你是用户、管理员还是程序员，这本书都能提供你所需的一切。


    不要满足于昨天的 Linux 书……获取唯一一本能满足今天挑战和明天需求的书


    与市面上的其他 Linux 书相比，《Red Hat® Linux® 实用指南，第三版》提供了如下……


    - 对 Fedora Core 和 Red Hat Enterprise Linux 的全面涵盖

    - 对命令行以及 GNOME 和 KDE GUI 的更深层次的涵盖，包括 GUI 自定义

    - 使用 Samba、NFS 和 FTP 进行文件共享更具实用性的涵盖

    - 使用 Apache、sendmail、NFS 和 DNS/BIND 进行互联网服务器配置更详细、更实用的涵盖

    - 更多更先进的安全技术，包括 SELinux（安全增强型 Linux）、ACLs（访问控制列表）、使用 Red Hat GUI 和 iptables 进行的防火墙设置，以及一章关于
    OpenSSH 的完整章节

    - 更多、更好的“基础性”系统/网络管理任务的涵盖'
