    # 本书包含一张 Fedora Core 5 DVD


    《Red Hat Linux 实战指南，第三版》包含了一个你可以使用它来安装或升级 Fedora Core 5 的 DVD。第 2 章帮助你准备安装 Fedora
    Core。第 3 章提供了从此 DVD 安装 Fedora Core 的逐步说明。


