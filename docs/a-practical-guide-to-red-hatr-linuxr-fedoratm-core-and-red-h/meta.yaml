    描述了如何使用以下工具下载软件并保持系统更新：

    - yum 从互联网下载并安装软件包，在处理包时解决依赖关系。你可以手动运行，也可以让它每晚自动运行。

    - BitTorrent 易于分发大量数据，如 Fedora 安装 DVD 和 CD。使用 BitTorrent 下载文件的人越多，速度就越快。

    - yum Red Enterprise Linux 保持系统更新工具。

    涵盖了图形化系统管理工具，包括主菜单、GNOME 和 KDE 系统、KDE 控制中心和 KDE 控制面板。

    解释了系统运行，包括启动过程、初始化脚本、紧急模式、救援模式、单用户模式和多用户模式，以及系统更改步骤。

    描述了文件、目录和文件系统，包括文件和文件系统类型、fstab（文件系统）、自动挂载的文件系统、文件完整性检查、文件系统工具以及恢复的微调。

