    and experimentation.


    # MINIX


    Two professors created their own stripped-down UNIX look-al for educational purposes:
    Doug Comer created XINU (www.cs.purdue.edu/research/xinu.html) and Andrew Tanenbaum
    created MINIX (www.cs.vu.nl/~ast/minix.html). Linus Torvalds created Linux to
    counteract the shortcomings in MIN. Every time there was a choice between simplicity
    and efficiency Tanenbaum chose simplicity (to make it easy to teach with MINIX),
    which meant that system lacked many features people wanted. Linux goes in the
    opposite direction.


    You can obtain Linux at no cost over the Internet (page 35). You can also obtain
    the GNU Software Foundation (www.fsf.org) by buying the code in higher-priced
    packages, and you can buy commercial releases of Linux (called distributions),
    such as Red Hat Linux, which contain installation scripts, software, and source.


    # GPL


    Linux and GNU software are distributed under the terms of the GNU General Public
    License (GPL, www.gnu.org/licenses/gpl.html). The GPL says you have the right
    to copy, modify, and distribute the code under the agreement. When you redistribute
    the code, you must also distribute the same license with the code, making the
    code and the license inseparable. If you get some code off for an accounting program
    that is under the GPL and then modify that code and redistribute an executable
    version of the program, you must also distribute the modified source code and
    the GPL agreement with it. Because this arrangement is the reverse of a normal
    copyright work (it gives rights instead of limiting them), it has been termed
    copyleft. (This paragraph is not a legal interpretation of the GPL; it is here
    merely to give you an idea of how it works. Refer to the GPL itself when you want
    to make use of it.)


