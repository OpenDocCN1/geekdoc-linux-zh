    - 解释了主机、IP 地址和子网，并探索了如何使用 host 在互联网上查找域名和 IP 地址。

    - 涵盖了分布式计算和客户端/服务器模型。


    ## 系统管理


    解释了如何使用 Red Hat 的 `system-config*` 工具来配置显示、DNS、Apache、网络接口等。你还可以使用这些工具来添加和管理本地及远程会话。（工具列表请参见第
