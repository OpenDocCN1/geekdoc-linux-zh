- md: '

    # A Practical Guide to Red Hat® Linux®, Third Edition: Fedora™ Core and Red Hat
    Enterprise Linux


    By Mark G. Sobell


    Publisher: Prentice Hall


    Pub Date: June 27, 2006


    Print ISBN-10: 0-13-228027-2


    Print ISBN-13: 978-0-13-228027-3


    Pages: 1168


    + Table of Contents | Index


    # Overview


    Since I am in an educational environment, I found the content of Sobell''s book
    to be right on target and very helpful for anyone managing Linux in the enterprise.
    His style of writing is very clear. He builds up the chapter exercises, which
    I find to be relevant to real-world scenarios a user or admin would encounter.
    IT/US student would find this book a valuable complement to their education. The
    amount of information is extremely well balanced and Sobell manages to present
    the content without asides and meandering prose. This is a ''must have'' for anyone
    managing Linux systems in a networked environment or anyone running a Linux server.
    I would also highly recommend it to an experienced computer user who is moving
    to the Linux platform. Mary Northrop, IT Director Barbara Davis Center/University
    of Colorado at Denver, for a review posted on slashdot.org.


    I had the chance to use your UNIX books when I was in college years at Cal Poly
    San Obispo, CA. I have to say that your books are among the best! They''re quality
    books that teach the theoretical aspects and applications of the operating system.
    Benton Chan, IS Engineer


    The book has not lived up to my expectations from the many reviews I read, even
    though it targets FC2. I have found something very rare with your book: It doesn''t
    read like the technical text, it reads more like a story. It''s a pleasure to
    read and hard to put down. Did I say that? :) David Hopkins, Business Process
    Architect


    Thanks for your work and for the book you wrote. There are really few books that
    can help people to become more efficient administrators of different workstations.
    We hope (in Russia) that you will continue gaining a new level of understanding
    of Linux/UNIX systems. Anton Petukov


    Mark Sobell has written a book as approachable as it is authoritative. Jeffrey
    Bianchi, Advocate, Author, Journalist


    "Excellent reference book, well suited for the sysadmin of a Linux cluster, or
    the owner of a PC contemplating installing a stable Linux. Don''t put off by the
    daunting hereof of the book. Sobell has striven to be as inclusive as possible,
    trying to anticipate your system administration needs." Wes Boudville, Inventor


    "A Practical Guide to Red Hat® is a brilliant book. That thank you Mark Sobell."
    C. Pozrikidis, University of California at San Diego


    "This book presents the best overview of the Linux operating system that I found.
    . . . It should be very helpful and understandable no matter what the reader''s
    background is: traditional UNIX user, new Linux devote, or Windows user. Each
    topic is presented in a clear, complete finish and few assumptions are made about
    what the reader knows... . The book is useful as a reference, as it contains a
    70-page glossary of terms and is very well indexed. It is organized in a way that
    the reader can focus on simple tasks without having to go through more advanced
    topics until they are ready." Cam Marshall, Marshall Information Service LLC,
    Member of Range UNIX Users Group FRUG, Boulder, Colorado


    "Conclusively, this IS THE book to get if you are a new Linux user and you got
    into RH/world. There is no other book that covers so many different topics and
    in this depth." Eugenia Loli-Queri, Editor of Linux, OSNews


    # The Just Came Better Again! Completely Revised to Meet All Your Fedora Core
    and Red Hat Enterprise Linux Needs!


    Fedora Core and Red Hat Enterprise Linux are advanced operating systems. You need
    a book that''s just advanced. This book explains clearly and effectively with
    a focus on features you care about, from system security and Internet server setup
    to Windows file/printer sharing. Best-author Mark Sobell starts at the beginning
    and walks you through everything that matters, from installing Linux using the
    included DVD to working with GNOME, KDE, Samba, sendmail, Apache, DNS, NIS, and
    iptables.


    This edition contains extensive coverage, including full chapters on Linux from
    the command line and GUI; even more system administration and security guidance;
    and up-to-the-minute, step-by-step instructions for setting up networks and every
    major type of Internet server. Along the way, learn the "hows" and the "whys."
    Mark Sobell knows Linux well and has taught thousands of readers, and never forgets
    what it''s like to be new to Linux. Whether you are a user, an administrator,
    or a programmer, this book gives you all you need need.


    Don''t settle for yesterday''s Linux book...get the ONLY book that meets today''s
    challenges and tomorrow''s


    Compared with the other Linux books out there, A Practical Guide to Red Hat® Linux®,
    Third Edition, delivers...


    - Complete coverage of Fedora Core and Red Hat Enterprise Linux

    - Deeper coverage of the command line and the GNOME and KDE GUIs, including GUI
    customization

    - More practical of file sharing with Samba, NFS, and FTP

    - More detailed, usable coverage of Internet server configuration using Apache,
    sendmail, NFS, and DNS/BIND

    - More state-of-the-art security techniques, including SELinux (Security Enhanced
    Linux), ACLs (Access Control Lists), firewall setup using the Red Hat GUI and
    using iptables, and a full chapter on OpenSSH

    - More and better coverage of "meat-and-potatoes" system/network administration
    tasks

    '
