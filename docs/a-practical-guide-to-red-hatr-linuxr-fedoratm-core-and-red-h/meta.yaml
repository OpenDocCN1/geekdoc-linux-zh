    # Preface


    Whether you are an end user, a system administrator, or a little of each, this
    book explains with step-by-step examples how to get the most out of Fedora Core
    or Red Hat Enterprise Linux. In 28 chapters, this book takes you from installing
    Linux through understanding its inner workings to setting up secure servers.


    # The audience


    This book is designed for a wide range of readers. It does not require you to
    have programming experience, but having some experience using a general-purpose
    computer is helpful. This book is appropriate for:


    - Students who are taking a class in which they use Linux

    - Home users who want to set up and run Linux

    - Professionals who use Linux at work

    - System administrators who need understanding of Linux and the tools that are
    available to them

    - Computer science students who are studying the Linux system

    - Programmers who need to understand the Linux programming environment

    - Technical executives who want to get a grounding in Linux


    # Benefits


    A Practical Guide to Red Hat Linux Fedora Core and Red Hat Enterprise Linux, Third
    Edition, gives you a broad understanding of many facets of Linux, from installing
    Red Hat Linux using and customizing it. No matter what your background, this book
    gives you the knowledge to get on with your work. You will come away from this
    book understanding how to use Linux, and this book will remain a valuable reference
    for years to come.


    # Overlap


    If you read A Practical Guide to Linux Commands, Editors, and Shell Programming,
    you will notice some overlap between that book and the one you are reading now.
    The first chapter, and the chapters on the utilities, filesystem, programming
    tools, and the appendix on regular expressions are very similar in the two books,
    as are the three chapters on the Bourne Again (bash). Chapters that appear in
    this book but not in A Practical Guide to Linux Commands, Editors, and Shell Programming
    including Chapters 2 and 3 (installation), Chapters 4 and 8 (Red Hat Linux and
    the GUI), Chapter 10 (networking), all of the chapters in Part IV (system administration)
    and Part V (servers), and Appendix C (security).


    # This Book Includes Fedora Core 5 on a DVD


    A Practical Guide to Red Hat Linux, Third Edition, includes a DVD that you can
    use to install or upgrade Fedora Core 5. Chapter 2 helps you get ready to install
    Fedora Core. Chapter 3 provides step-by-step instructions for installing Fedora
    Core from this DVD.

