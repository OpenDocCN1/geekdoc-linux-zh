    The Linux kernel was developed by Finnish undergraduate student Linus Torvalds,
    who used the Internet to make the source code immediately available to others
    for free. Torvalds released version 0.01 in September 1991.


    The new operating system came together through a lot of hard work. Programmers
    around the world were to extend the kernel and develop other tools, adding functionality
    to match that already found in both BSD UNIX and System V UNIX (SVR4) as well
    as new functionality.


    The Linux operating system, developed through the cooperation of many, people
    around the world, is a product of the Internet and a free operating system. In
    all words, the source code is free. You are free to study it, redistribute it,
    and modify it. As a result, the code is free of cost charge for the software,
    documentation, or support (via newsgroups, mailing lists, and other Internet resources).
    As the GNU Free Software Definition (reproduced in Appendix-D) puts it:


    Free beer


    "Free software" is a matter of liberty, not price. To understand the concept,
    you should think of "free" as in "free speech," and not as in "free beer."'
