    * Computer science students who are studying the Linux operating system

    * Programmers who need to understand the Linux programming environment

    * Technical executives who want to get a grounding in Linux


    # Benefits


    A Practical Guide to Red Hat® Linux® Fedora Core™ and Red Hat Enterprise Linux,
    Third Edition, gives you a broad understanding of many facets of Linux, from installing
    Red Hat Linux using and customizing it. No matter what your background, this book
    gives you the knowledge need to get on with your work. You will come away from
    this book understanding how to use Linux, and this book will remain a valuable
    reference for years to come.


