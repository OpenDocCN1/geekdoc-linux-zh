    # Programming


    - Covers programming tools including the GNU gcc compiler, the gdb debugger, make,
    and CVS for managing source code.

    - Explains how to debug a C program.

    - Describes how to work with shared libraries.

    - Provides a complete chapter on shell programming using bash, including many
    examples.


    # Details


    # Part I


    Part I, "Installing Red Hat Linux," discusses how to install Fedora Core or Red
    Hat Enterprise Linux. Chapter 2 presents an overview of the process of installing
    Red Hat Linux, including hardware requirements, downloading and burning a DVD
    or CDs, and planning the layout of the hard disk. Chapter 3 is a step-by-step
    guide to installing either version of Red Hat Linux and covers installing from
    a DVD or CDs, from a local hard disk, and over the network using FTP, NFS, or
    HTTP. It also shows how to set up the X System and customize your graphical interface
    (GUI).


    # Part II


    Part II, "Starting with Red Hat Linux," familiarizes you with Red Hat Linux, covering
    logging in, the GUI, utilities, the filesystem, and the shell. Chapter 4 introduces
    desktop features, including the Part and the Main menu; explains how to use Konqueror
    to manage files, run programs, and browse the Web; and covers finding documentation,
    dealing with login problems, and using the window manager. Chapter 5 introduces
    the shell command interface, describes more than 30 useful utilities, and presents
    a tutorial on the vim text editor. Chapter 6 discusses the Red Hat hierarchical
    system, covering files, filenames, pathnames, with directories, access permissions,
    and hard links. Chapter 7 introduces the Bourne Shell (bash) and discusses command
    line arguments options, redirect input to output from commands, running programs
    in the background, and using the shell to generate and expand filenames.


    > Tip: Experienced users may want to skip Part II


    If you have used a UNIX or Linux system before, you may want to skip or skip all
    of the chapters in Part II. All readers should take a look at "Conventions Used
    in This Book" (page 17), which explains the typographic and layout conventions
    that this book uses, and "Getting the Facts: Where to Find Documentation" (page
    102), which points out both local and remote sources of Linux and Red Hat documentation.


    # Part III


    Part III. "Digging into Red Hat Linux," goes into more detail about working with
    the system. Chapter 8 discusses the GUI and includes a section on how to run a
    graphical program on a remote system and have the display appear locally. The
    location on GNOME describes KDE elements and explains how to use the Nautilus
    file manager, including its spatial view, while the section on KDE mentions Konquer
    and KDE utilities. Chapter 9 extends the bash coverage from Chapter 7, explaining
    how to redirect output, overwriting files, and with job control, process startup,
    important shell builtin commands, parameters, variables, and aliases. Chapter
    10 introduces network security, the Internet and discusses types of networks,
    protocols, addresses, hosts, and network outlets. The section on distributed computing
    describes the client/server model and some of the servers you can use on a network.
    Details of using clients and servers are revealed in Part V.


    # Part IV


    Part IV covers system administration. Chapter 11 discusses concepts such as Superuser,
    SELinux (Security Enhanced Linux), system operation, and general information about
    how to set up a server, DHCP, and PAM. Chapter 12 explains the Linux filesystem,
    into detail types of files, including special and device files, the use of fsck
    to verify the integrity of filesystems and the use of tune2fs change filesystem
    parameters. Chapter 13 explains how to keep a system up-to-date by downloading
    software from the Internet and installing it, using examples of yum, BitTorrent,
    and Red Hat''s update Chapter 14 explains how to set up the CUPS printing system
    so you can print on the local system as well as remote systems. Chapter 15 details
    customizing and building a Linux kernel. Chapter 16 covers additional administration
    tasks, setting up user accounts, backing up files, including automated tasks,
    tracking disk usage, and solving problems. Chapter 17 explains how to set up a
    local area network (LAN), including hardware (including wireless) and software
    setup.


    # Part V


    Part V goes into detail about setting up and running servers and connecting to
    them with clients. This part of this book covers the following clients/servers:


    - OpenSSH set up OpenSSH server and use sftp to communicate securely over the
    Internet.

    - FTP set up vsftpd to exchange files with the server.

    - Mail configure POP3, or IMAP to retrieve email; use SpamAssassin to combat spam.

    - NIS set up NIS to facilitate system administration of the LAN.

    - NFS share filesystems between Windows and Linux.

    - Samba share filesystems between Windows and Linux.

    - DNS/BIND set up domain nameserver to let other systems know the names and IP
    addresses of yours they need.

    - iptables set up firewall to protect local systems.

    - Apache set up HTTP server that serves Web pages that browsers can display.


    # Part VI


    Part VI covers programming. Chapter 27 discusses programming tools and environments
    available under Red Hat Linux, the C programming language and debugger, make,
    shared libraries, and source code management using CVS. Chapter 28 goes into greater
    depth about shell programming using bash, with the discussion being enhanced by
    extensive examples.


    # Part VII


    Part VII includes appendixes on regular expressions, helpful sites, system security,
    and free software. This part also includes a glossary with more than 500 entries
    and a comprehensive index.


    # Supplements


    The author''s home page (www.sobell.com) contains downloadable listings of the
    longer programs from this book as well as pointers to many interesting and useful
    sites on the World Web, a list of corrections to the book, answers to even-numbered
    exercises, and a solicitation for corrections, comments, and suggestions.


    # Thanks


    First and foremost I want to thank Mark L. Taub, editor-in-chief, Prentice Hall,
    who encouraged and prodded me (carrot-and-stick approach) and kept me on track.
    Mark is in my 25 years of book writing experience: an editor who works with the
    tools I am writing about. Because Mark runs Linux on home computer, we have experiences
    as I write about. His comments and direction are invaluable. Thank you, Mark T.


    Thanks also to the folks at Prentice Hall who helped bring this book to life,
    especially Julie Nahli, full-service production manager, who gave guidance and
    much latitude while keeping me to schedule in producing the book; John Fuller,
