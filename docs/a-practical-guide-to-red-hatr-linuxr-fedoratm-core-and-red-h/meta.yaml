  pgno: 29
- img_proc: true
  md: '# What Is So Good About Linux?


    In recent years Linux has emerged as a powerful and innovative UNIX work-like.
    Its popularity is surpassing that of its UNIX predecessors. Although it mimics
    UNIX in many ways, the Linux operating system differs from UNIX in several ways:
    The Linux kernel is implemented independently of both BSD and System V, the continuing
    development of Linux is taking place through the combined efforts of many capable
    individuals throughout the world, and Linux puts the power of UNIX within easy
    reach of business and personal computer users. Using the Internet, today''s skilled
    programmers submit additions and improvements to the operating system to Linux
    Torvalds, GNU, or one of the others of Linux.


    Applications


    A rich selection of applications is available for Linuxboth free and commercialas
    well as a wide variety of tools: graphical, word processing, networking, security,
    administration, Web server, and many others. Large companies have recently seen
    the benefit in supporting Linux and now have on-staff programmers whose job it
    to design and code the Linux kernel, GNU, KDE, or other software that runs on
    Linux. For example, IBM (www.ibm.com/linux) is a major Linux supporter. Linux
    conforms increasingly closely to POSIX standards, and some distributions of parts
    meets this standard. (See Standards page for more information.) These developments
    mean that Linux is becoming more mainstream and is respected as an attractive
    alternative to other popular operating systems.


    Peripherals


    Another aspect of Linux that appeals to users is the amazing range of peripherals
    that is supported and the speed with which support for new peripherals emerges.
    Linux often supports a peripheral interface card particularly proprietary graphics
    cardslag in their support because the manufacturers do not release specifications
    or source code for drivers in a timely manner, at all.


    Software


    Important to users is the amount of software that isavailablenot just source code
    (which needs to be compiled) but also prebuilt binaries that are easy to install
    and ready to run. These include more than free software. Netscape, for example,
    has been available for Linux from the start and included Java support before it
    was available from many commercial vendors. Now its sibling Mozilla/Thunder-bird/Firefox
    is also a viable browser, mail client, and newsreader, performing many other functions
    as well.'
