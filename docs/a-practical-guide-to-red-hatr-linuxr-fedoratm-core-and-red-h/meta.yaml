    # 编程


    - 涵盖了编程工具，包括 GNU gcc 编译器、gdb 调试器、make 以及用于管理源代码的 CVS。

    - 解释了如何调试 C 程序。

    - 描述了如何与共享库一起。

    - 提供了一个关于使用 bash 进行 shell 编程的完整章节，包含许多示例。


    # 详情


    # 第一部分


    第一部分“安装 Red Hat Linux”讨论了如何安装 Fedora Core 或 Red Hat Enterprise Linux。第 2 节概述了安装
    Red Hat Linux 的过程，包括硬件要求、下载并刻录 DVD 或 CD，以及磁盘布局的规划。第 3 节是安装这两个版本 Red Hat Linux
    的分步指南，涵盖了从 DVD 或 CD、本地硬盘以及通过 FTP、NFS 或 HTTP 跨网络安装的方法。它还展示了如何设置 X 系统并自定义你的图形用户界面（GUI）。


    # 第二部分


    第二部分“从 Red Hat Linux 开始”让你熟悉 Red Hat Linux，涵盖了登录、GUI、实用程序、文件系统和 shell。第 4 节介绍了桌面功能，包括分部分菜单和主菜单；解释了如何使用
    Konqueror 管理文件、运行程序和浏览网页；并涵盖了查找文档、处理登录问题以及使用窗口管理器。第 5 节介绍了 shell 命令行界面，描述了 30
    多种实用的实用程序，并提供了 vim 文本编辑器的教程。第 6 节讨论了 Red Hat 分级系统，涵盖了文件、文件名、路径、目录、访问权限和硬链接。第 7
    节介绍了 Bourne Shell (bash)，并讨论了命令行参数选项、将输入重定向到输出、在后台运行程序以及使用 shell 生成和扩展文件名。


    > 提示：经验用户可能想跳过第二部分


    如果你以前使用过 UNIX 或 Linux 系统，可能想跳过或跳过第二部分的所有章节。所有读者都应该查看“本书使用的约定”（第 17 页），该部分解释了本书使用的排版和布局规范；以及“获取事实：在哪里找到文档”（第
    102 页），该部分指出了 Linux 和 Red Hat 文档的本地和远程来源。


    # 第三部分


    第三部分“深入 Red Hat Linux”更详细地讨论了系统操作。第 8 节讨论了 GUI，并包含一个关于如何在远程系统上运行图形程序并让显示出现在本地的章节。GNOME
    上的位置描述了 KDE 元素并解释了如何使用 Nautilus 文件管理器（包括其空间视图），而关于 KDE 的部分提到了 Konquer 和 KDE 实用程序。第
    9 节扩展了第 7 节的 bash 内容，解释了如何重定向输出、覆盖文件，以及作业控制、进程启动、重要的 shell 内置命令、参数、变量和别名。分布式计算部分描述了客户端/服务器模型以及你可以在网络上的一些服务器。使用客户端和服务器的细节将在第五部分揭示。


    # 第四部分


    第四部分涵盖了系统管理。第 11 节讨论了超级用户（Superuser）、SELinux（安全增强型 Linux）、系统操作以及关于设置服务器、DHCP 和
    PAM 的通用信息。第 12 节解释了 Linux 文件系统，详细介绍了文件类型，包括特殊文件和设备文件、使用 fsck 验证文件系统的完整性，以及使用 tune2fs
    修改文件系统参数。第 13 节解释了如何从互联网下载并安装软件来保持系统更新，并使用了 yum、BitTorrent 和 Red Hat 更新的示例。第 14
    节解释了如何设置 CUPS 打印系统，以便你可以在本地系统以及远程系统上打印。第 15 节详细说明了自定义和构建 Linux 内核。第 16 节涵盖了额外的管理任务，设置用户账户、备份文件（包括自动化任务）、跟踪磁盘使用以及解决问题。第
    17 节解释了如何设置局域网（LAN），包括硬件（无线）和软件设置。


    # 第五部分


    第五部分详细介绍了如何设置和运行服务器，并涵盖了以下客户端：


    - OpenSSH 设置 OpenSSH 服务器并使用 sftp 安全通信。

    - FTP 设置 vsftpd 与互联网交换文件。

    - Mail 配置 POP3 或 IMAP 获取电子邮件；使用 SpamAssassin 应对垃圾邮件。

    - NIS 设置以方便局域网管理。

    - NFS 在 Windows 和 Linux 之间共享文件系统。

    - Samba 在 Windows 和 Linux 之间共享文件系统。

    - DNS/BIND 设置域名服务器以便系统识别名称和 IP 地址。

    - iptables 设置防火墙以保护本地系统。

    - Apache 设置用于网页的 Web 服务器。


    # 第六部分


    第六部分涵盖编程。第 27 节讨论了 Red Hat Linux 环境下的编程工具、C 语言、调试器、make、共享库以及使用 CVS 进行源码管理。第 28
    节深入讨论了使用 bash 进行编程，并通过大量示例增强了讨论。


    # 第七部分


    第七部分包含了正则表达式、有用网站、系统安全和免费软件的附录。该部分还包含一个拥有 500 多条目的词汇表和索引。


    # 补充


    作者主页（www.sobell.com）包含了书中程序的下载列表，以及指向许多有用网站的链接、书籍错误列表、偶数题解答以及建议的征集。


    # 谢谢


    首先我要感谢 Prentice Hall 的总编辑 Mark L. Taub，他鼓励并促使我（胡萝卜加大棒法），并让我保持正轨。Mark 在家里电脑上运行
    Linux，因此我们在写作内容方面有共同经验。他的评论和指导非常宝贵。感谢你，Mark。


    还要感谢 Prentice Hall 帮助这本书成生的同事，特别是全流程制作经理 Julie Nahli，她在保证进度的同时提供了指导并给予了很大的自由；执行编辑
    John Fuller，他控制了新内容；编辑助理 Reina，负责了出版本书的细节；出版经理 Heather Fox；媒体开发 Jim Sherf；设计经理
    Sandra Schroeder；营销经理 Kim Spitzer；以及所有在幕后为这本书付出努力的人。


    我还要感谢《自由计算字典》(FOLDOC) 的编辑 Denis Howe，他慷地允许我使用他编译的条目。请务必查看该字典（www.foldoc.org）。


    非常感谢读过书籍草稿并提供意见的人，这些意见使我重新关注了书中不清晰或遗漏的部分：David Chisnill；Chris Karl（西北大学）、Jesse
    Keating（Fedora 项目）、Scott Mann（IBM 管理与集成专家）、Matthew Miller（波士顿大学）以及 George Vish（HP
    US Linux 高级顾问）。


