    ## Platforms


    Linux is not just for Intel-based platforms: It has been ported to and runs on
    the Power PC including Apple computers (ppclinux), Compaq''s (née Digital Equipment
    Corporation) Alpha-based machines, MIPS-based machines, Motorola''s 68K-based
    machines, various 64-bit systems, IBM''s S/390. Nor is Linux for single-processor
    machines: As of version 2.0, it runs on multiple-processor machines (SMPs). It
    also includes an O(1) scheduler, which dramatically increases scalability on SMP
    systems.


    ## Emulators


    Linux supports programs, called emulators, run code intended for other operating
    systems. By using emulators you can run some DOS, Windows, and Macintosh programs
    under Linux. Wine ([www.winehg.com](http://www.winehg.com)) is an open-source
    implementation of the Windows API on top of the X Window System and UNIX/Linux;
    QEMU ([fabrice.bellard.free.fr/qemu](http://fabrice.bellard.free.fr/qemu)) is
    a CPU-only emulator that executes x86 Linux binaries on non-x86 Linux systems.


    ## Xen


    Xen was created at the University of Cambridge and is now being developed in the
    open-source community, is an open-source virtual machine monitor (VMM). A VMM
    enables several virtual machines (VMs), each running an instance of a operating
    system, to run on a single machine. Xen introduces the VMs so that if one crashes
    does not affect any of the others. In addition, Xen introduces minimal performance
    overhead when compared with running; each of the operating systems natively.


    Using VMs, you can experiment with cutting-edge releases of operating systems
    and applications without concern for the base (stable) system, all on a single
    machine. You can set up and test networks of systems on a single machine. Xen
    presents a sandbox, area (system) that you can work in regard for the results
    of your work or for the need to clean up.


    Fedora Core 5 includes Xen. This book does not contain the installation or use
    of Xen. See [fedoraproject.org/wiki/FedoraXenQuickstartFC5](http://fedoraproject.org/wiki/FedoraXenQuickstartFC5)
    for installation instructions.


    For more information on Xen, refer to the [wiki.xensource.com/xenwiki](http://wiki.xensource.com/xenwiki)
    and the Xen home page at [www.cl.cam.ac.uk/Research/SRG/nets/xen](http://www.cl.cam.ac.uk/Research/SRG/nets/xen).


    ## Why Linux is Popular with Hardware Companies and Developers


    Two trends in the computer industry set the stage for the popularity of UNIX and
    Linux. First, advances in hardware technology created the need for an operating
    system that could take advantage of available hardware power. In the mid-1970s,
    minicomputers began challenging the large mainframe computers in many applications,
    minicomputers could perform the same functions less expensively. More recently,
    64-bit processor chips, plentiful and inexpensive memory, lower-priced disk storage
    allowed hardware companies to install multiuser operating systems on desktop computers.


    ## Proprietary operating systems


    Second, with the cost of hardware continually dropping, hardware manufacturers
    could no longer afford to develop and support proprietary operating systems. A
    proprietary operating system is written and owned by the manufacturer of the hardware
    (for example, DEC/Compa owns VMS). Today''s manufacturers need a generic operating
    system that they can easily adapt to their machines.


    ## Generic operating systems


    A generic operating system is written outside of the company manufacturing the
    hardware and is sold (UNIX, Windows) or given (Linux) to the manufacturer. Linux
    is a generic operating system because it runs on different types of hardware produced
    by different manufacturers. Of course, if manufacturers can pay for development
    and avoid unit costs (they have to pay to Microsoft for each copy of Windows they
    sell), manufacturers are much better off. In turn, software developers need to
    keep the prices of their products down; they cannot afford to convert their products
    to run under many different proprietary operating systems. Like hardware manufacturers,
    software developers need a generic operating system.


    Although the UNIX system once met the needs of hardware companies and researchers
    as a generic operating system, over time it has become more proprietary as each
    manufacturer added support for specialized features and introduced new software
    libraries and utilities.


    Linux emerged to serve both needs. It is a generic operating system that takes
    advantage of available hardware power.


    ## Linux Is Portable


    A portable operating system is one that can run on many different machines. More
    than 95 percent of the Linux operating system is written in the C programming
    language, and C is portable because it is written in a higher-level, machine-independent
    language. (The C compiler is written in C)


    Because it is portable, it can be adapted (ported) to different machines and can
    make special requirements. For example, Linux is used in embedded computers, such
    as the ones found in celulares, PDAs, and the cable boxes on top of many TVs.
    The file structure takes full advantage of large, hard disks. Equally important,
    Linux was originally designed as a multiuser operating system not modified to
    serve several users as an afterthought. Sharing the computer''s power among many
    users and giving them the ability to share data and programs are central features
    of the system.


    Because it is adaptable and takes advantage of available hardware, Linux runs
    on many different microprocessor-based systems as well as mainframes. The popularity
    of the microprocessor-based hardware drives Linux; these computers are getting
    faster all the time. With the advent of C, a programmer no longer had to resort
    to assembly language to get code that would run well (that is, although an assembler
    will generate more efficient code than a high-level language). This benefits system
    administrators who like having a consistent environment.


    ## Standards


    Individuals from companies throughout the industry have joined together to develop
    the POSIX (Portable Operating System Interface for Computer Environments) standard,
    which is based largely on UNIX V Definition (SVID). These efforts have been spurred
    by the U.S. government, which needs a standard computing environment. Now that
    these standards are gaining acceptance, software developers are able to develop
    applications that run on all conforming versions of UNIX.


    ## The C Programming Language


    Ken Thompson wrote the UNIX operating system in 1969 in PDP-7 assembly language.
    Assembly language is machine dependent: Programs written in assembly language
    on only one machine, or at best, one family of machines. The original UNIX operating
    system could not be easily transported to other machines.


    To make UNIX portable, Thompson developed the B programming language, a machine-independent
    language, from BCPL language. Dennis Ritchie developed the C by modifying B, and
    with Thompson, rewrote UNIX in C in 1973. The revised operating system could be
    transported more easily to run on other machines.


    That development marked the start of C. Its roots reveal many of the reasons why
    it is such a powerful tool. C can be used to write machine-independent programs.
    A programmer who designs a program to be portable easily to any computer that
    has C. C is also designed to compile into very efficient code.


    C is a good systems language. You can write a compiler or an operating system
    in C. It is highly structured but not a high-level language. C allows a programmer
    to manipulate bits and bytes, as necessary when writing an operating system. It
    also has high-level constructs that allow efficient, modular programming.


    In the 1980s the American National Standards Institute (ANSI) defined a standard
    version of the C language, commonly referred to as ANSI C or C89 (for the year
    the standard was published). Ten years later the C99 standard was published; it
    is mostly supported by the GNU Project''s C (named *gcc*). The original version
    of the language is often referred to as Kernighan & Ritchie (or K&R) C, named
    for the authors of the book that first described the C.


    Another researcher at Bell Labs

