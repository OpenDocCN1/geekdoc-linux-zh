    # The GNU-Linux Connection


    An operating system is the low-level software that schedules tasks, allocates
    storage, and handles the interfaces to peripheral hardware, such as printers,
    disk drives, the screen, and mouse. An operating system has two main parts: the
    kernel and the system programs. The kernel allocates machine resources, including
    memory, disk space, and CPU cycles, to all other programs that run on the computer.
    The system programs perform higher-level housekeeping tasks, often acting as servers
    in a client/server relationship. Linux is the name of the kernel that Torvalds
    presented to the world in 1991 and many others have worked since to enhance, stabilize,
    and make more secure.


    # The History of Linux


    This section presents some background on the relationship between GNU and Linux.


    # Fade to 1983


    Richard Stallman (www.stallman.org) announced the GNU Project for creating an
    operating system, both kernel and system programs, and presented the GNU Manifesto,
    which begins as follows:


    > The wording was careless. The intention was that nobody would have to pay for
    "permission" to use the GNU system. But the words don''t make this clear, and
    people often interpret, as saying that companies of GNU should always be distributed
    at little or no charge. That was never the intent; later, on the manifesto the
    possibility of companies providing the service of distribution for a profit. Subsequently
    I have learned to distinguish carefully between "free" in the sense of freedom
    and "free" in the sense of price.


