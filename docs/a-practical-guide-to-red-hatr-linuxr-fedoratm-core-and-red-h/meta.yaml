    # Platforms


    Linux is not just for Intel-based platforms: It has been ported to and runs on
    the Power PCcluding Apple computers (ppclinux), Compaq''s (née Digital Equipment
    Corporation) Alpha-based machines, MIPS-based machines, Motorola''s 68K-based
    machines, various 64-bit systems, IBM''s S/390. Nor is Linux for single-processor
    machines: As of version 2.0, it runs on multiple-processor machines (SMPs). It
    also includes an O(1) scheduler, which dramatically increases scalability on SMP
    systems.


    # Emulators


    Linux supports programs, called emulators, run code intended for other operating
    systems. By using emulators you can run some DOS, Windows, and Macintosh programs
    under Linux. Wine ([www.winehg.com](http://www.winehg.com)) is an open-source
    implementation of the Windows API on top of the X Window System and UNIX/Linux;
    QEMU ([fabrice.bellard.free.fr/qemu](http://fabrice.bellard.free.fr/qemu)) is
    a CPU-only emulator that executes x86 Linux binaries on non-x86 Linux systems.


    # Xen


    Xen was created at the University of Cambridge and is now being developed in the
    open-source community, is an open-source virtual machine monitor (VMM). A VMM
    enables several virtual machines (VMs), each running an instance of a operating
    system, to run on a single machine. Xen introduces the VMs so that if one crashes
    does not affect any of the others. In addition, Xen introduces minimal performance
    overhead when compared with running; each of the operating systems natively.


    Using VMs, you can experiment with cutting-edge releases of operating systems
    and applications without concern for the base (stable) system, all on a single
    machine. You can set up and test networks of systems on a single machine. Xen
    presents a sandbox, area (system) that you can work in regard for the results
    of your work or for the need to clean up.


    Fedora Core 5 includes Xen. This book does not contain the installation or use
    of Xen. See [fedoraproject.org/wiki/FedoraXenQuickstartFC5](http://fedoraproject.org/wiki/FedoraXenQuickstartFC5)
    for installation instructions.


    For more information on Xen, refer to the [wiki.xensource.com/xenwiki](http://wiki.xensource.com/xenwiki)
    and the Xen home page at [www.cl.cam.ac.uk/Research/SRG/nets/xen](http://www.cl.cam.ac.uk/Research/SRG/nets/xen).


    # Why Linux is Popular with Hardware Companies and Developers


    Two trends in the computer industry set the stage for the popularity of UNIX and
    Linux. First, advances in hardware technology created the need for an operating
    system that could take advantage of available hardware power. In the mid-1970s,
    minicomputers began challenging the large mainframe computers in many applications,
    minicomputers could perform the same functions less expensively. More recently,
    64-bit processor chips, plentiful and inexpensive memory, lower-priced disk storage
    allowed hardware companies to install multiuser operating systems on desktop computers.'
  - '[PAGE 32]


