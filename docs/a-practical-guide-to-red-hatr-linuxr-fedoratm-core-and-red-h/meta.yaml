    The Linux kernel was developed by Finnish undergraduate student Linus Torvalds,
    who used the Internet to make the source code immediately available to others
    for free. Torvalds released version 0.01 in September 1991. The operating system,
    developed through cooperation of many, is the name of the kernel that Torvalds
