  \ 文件包含了系统上所有用户的列表，包括系统用户和普通用户。该文件的格式为每行代表一个用户。每行的字段由 `:`（冒号）分隔。这些字段包含以下信息：\n\n1.\
  \ 用户名\n2. 加密密码（显示为 `x`，加密密码的实际位置位于 `/etc/shadow` 文件）\n3. 用户 ID 数 (`UID`)\n4. 用户组\
  \ ID (`GID`)\n5. 用户全名\n6. 家目录\n7. !![](img/image00410.jpeg)登录 shell\n\n### 系统上所有用户列表\n\
  ```bash\nawk -F':' '{ print $1}' /etc/passwd\n```\n\n### 组 ID (GID)\nLinux 中的组通过组\
  \ 组 ID (`GIDs`) 定义。`GIDs` 存储在 `/etc/groups` 文件中。前 1000 个 GID 通常保留给系统使用。所有的应用程序组从\
  \ 1001 开始。\n\n### `/etc/group` 文件\n`/etc/group` 是一个定义了每个用户所属组的文件。多个用户可以属于同一个组。同一组中的每个用户名用逗号分隔。这些字段包含以下信息：\n\
  \n1. 组名。\n2. 密码：通常不使用密码，因此为空/空白。如果不为空，则存储加密密码。这在实现特权组时非常有用。\n3. 组 ID (`GID`)\n4.\
  \ 用逗号分隔的用户列表。\n\n![](img/image00411.jpeg)\n\n# 第 18 章：## 探索 SU 和 SUDO\n\n要提升分配给当前用户的权限，你可以使用\
  \ `su` 或 `sudo`。\n\n### SU\n`su` 命令用于切换到另一个用户。如果执行时不指定用户名，它将默认以 root 用户身份登录。`su`\
  \ 需要目标账户的密码。\n\n**以特定用户登录**\n语法：\n```bash\nsu username\n```\n示例：\n```bash\nsu oracle\n\
  ```\n当配合连字符（`su -`）使用时，将假设目标用户的环境。\n\n示例：\n对于 root 用户：\n```bash\nsu -\n```\n对于其他用户：\n\
  ```bash\nsu - oracle\n```\n\n### SUDO\n`sudo` 允许用户以另一个用户的安全权限运行程序，默认情况下，它使用管理员权限运行命令。通过这种机制，你可以将某些管理员任务分配给权限较低的用户，而无需共享管理员密码。与需要目标账户密码的\
  \ `su` 不同，`sudo` 需要当前用户的密码。在命令前加 `sudo` 即可执行任何管理命令。\n\n**运行更改系统配置的特权命令的示例**\n```bash\n\
  sudo yum install gzip\n```\n或更改主机名：\n```bash\nsudo hostnamectl set-hostname host2021\n\
  ```\n\n**作为不同用户运行命令。**\n语法：\n```bash\nsudo -u user command\n```\n示例：\n```bash\n\
  sudo -u user2 hostnamectl\n```\n\n**在交互模式下使用 sudo**\n```bash\nsudo -i\n```\n\n#####\
  \ 修改 sudo 配置\n`sudo` 将其配置存储在 `/etc/sudoers` 文件中。要修改 sudo 配置，请使用 `visudo` 命令。它会有效地启动\
  \ `vi` 编辑器并以 `/etc/sudoers` 文件的身份进行编辑。`visudo` 命令应由管理员执行。\n\n`/etc/sudoers` 文件包含一个用户列表，以及这些用户可以运行的命令。\n\
  \n`user host=(users) [NOPASSWORD:]commands`\n\n示例：\n```text\n%operators localhost\
  \ = (apache) /usr/sbin/\n```\n\n###### wheel 组\n![](img/image00412.jpeg)Oracle Linux\
  \ 自带一个默认的管理员组，称为 wheel 组。如果你想将所有管理员权限分配给一个用户而不共享 root 密码，可以将该用户添加到 wheel 组。但在此之前，请确保\
  \ `/etc/sudoer` 文件中的该行没有被注释。\n\n**将用户添加到 wheel 组**\n```bash\nusermod --append -G\
  \ wheel user_name\n```\n示例：\n```bash\nusermod --append -G wheel user1\n```\n\n**注意：**\
  \ `SU` 和 `SUDO` 的主要区别在于，在 `SU` 的情况下，你通过切换到超级用户或 root 用户来获取 root 权限，而在 `SUDO` 的情况下，你通过单个命令获取\
  \ root 权限。\n\n# 第 19 章：## 探索文件和目录权限\n\nLinux 是一个多用户操作系统，可以被许多用户同时访问。因此，用户不触碰彼此的数据是绝对必要的。为了数据和系统文件的安全和正常，操作系统部署了不同类型的安全系统。Linux\
  \ 将授权分为 2 级：\n\n1. 所有权\n2. 权限\n\n### 所有权\n所有权定义了谁可以访问文件或目录。为了表示所有权，Linux 使用以下符号：\n\
  \n| 符号 | 描述 |\n| :--- | :--- |\n| u | 用户 (所有者) - 默认情况下，创建文件或目录的用户成为该文件或目录的所有者。 |\n\
  | g | 组 |\n| o | 其他 - 给其他用户授予权限。实际上，这意味着其他人。 |\n\n### 权限\n权限定义了允许在文件或目录上执行的操作。这些操作是读、写和执行。...（注：原文后续存在大量重复内容，已按要求翻译）\n\
  \n\n\n\nNTP 是网络时间协议，用于同步计算机的时间。全球的计算机使用网络时间协议（`NTP`）通过分级的 NTP 服务器来同步时间。主服务器位于第 1\
  \ 层，通过卫星、无线电或调制调器连接到第 0 层。\n\n在 Oracle Linux 8 上，`Chrony` 提供了 `NTP` 的实现。`Chrony`\
  \ 为经常关机或断开网络的系统（如笔记本电脑）设计。`chronyd` 是运行在用户空间的守护进程，使用 `chrony.conf` 文件。NTP 有两个部分：\n\
  \n字体 服务器\n- 客户端\n\n客户端连接服务器进行时间同步。NTP 为网络上的计算机提供高精度的时间同步。时间同步对于日志管理、登录信息非常重要；在某些情况下，如果两台机器的时间不同，会导致事务失败。\n\
  \n## 在服务器上配置 chrony\n\n### 安装 chrony 包\n```bash\nyum install chrony\n```\n\n主配置文件为\
  \ `/etc/chrony.conf`。编辑此文件并添加以下参数。\n\n`server Ip_of_the_stratum`\n\n**示例**\n```bash\n\
  server 192.20.3.1\n```\n\n如果此服务器位于孤立网络中\n```bash\nlocal stratum 10\n```\n\n你可以针对主机或网络限制\
  \ NTP 服务器的使用。\n\n**语法**\n`allow network/hostIP`\n\n**示例**\n```bash\nallow 192.116.1.0/24\n\
  ```\n\n### 保存文件\n现在启用并启动 chronyd 守护进程\n```bash\nsystemctl enable chronyd\nsystemctl\
  \ start chronyd\n```\n\n`chronyc` 是一个用于验证配置的命令行程序。它有很多选项。两个主要选项是：\n\n| 命令 | 描述 |\n\
  | :--- | :--- |\n| tracking | 显示系统时间信息 |\n| sources | 显示当前源的信息以及关于源的其他信息。 |\n\n\
  ### 验证\n验证 chrony 是否正在运行\n```bash\nchronyc tracking\n```\n你也可以使用\n```bash\nchronyc\
  \ sources\n```\n\n### 在客户端上\n\n### 安装 chrony 包\n```bash\nyum install chrony\n```\n\
  \n编辑 `/etc/chrony.conf` 并添加 NTP 服务器的 IP 地址\n`server IP_address_NTP`\n\n**示例**\n\
  ```bash\nserver 192.116.1.123\n```\n\n保存并关闭文件\n现在启用并启动 chronyd 守护进程\n```bash\nsystemctl\
  \ enable chronyd\nsystemctl start chronyd\n```\n\n### 配置 ntpdate\n`ntpdate` 服务的目的是在系统启动期间设置时。\n\
  \n编辑 `/etc/ntp/step-tickers`\n添加服务器 IP 的条目\n**示例**\n```bash\n192.116.1.123\n```\n\
  \n启用并启动 ntpdate\n```bash\nsystemctl enable ntpdate\nsystemctl start ntpdate\n```\n\
  \n### 验证\n```bash\nchronyc sources\n```\n\n## 第 21 章：探索 Secure Shell - SSH\n\nSSH\
  \ 是用于登录远程网络的安全协议。SSH 基于服务器-客户端模式工作：服务器上运行着 `sshd` 守护进程，客户端则使用 `ssh` 客户端进行连接。`Openssh`\
  \ 是大多数 Linux 发行版中 `ssh` 的实现。Oracle Linux 8 也支持将 `openssh` 作为 ssh 服务器。\n\n### 安装\
  \ openssh 服务器\n```bash\nyum install sshd\n```\n\n启用并启动 sshd 守护进程\n```bash\nsystemctl\
  \ start sshd\nsystemctl enable sshd\n```\n\n全系统范围内 `openssh` 服务器使用的主配置文件为 `/etc/ssh/sshd_config`。默认情况下，它是以限制的方式配置的。高级用户和开发者可以在\
  \ `sshd_config` 文件中更改的常用设置设置如下：\n\n- `X11Forwarding yes`\n- `AllowAgentForwarding\
  \ yes`\n- `PermitRootLogin yes`\n\n在修改配置文件后，停止并重启 sshd 服务。\n```bash\nsystemctl stop\
  \ sshd\nsystemctl start sshd\n```\n\n### 在客户端上\n```bash\nssh login@server_ip\n```\n\
  **示例**\n```bash\nssh root@192.168.3.1\n```\n在 Windows 机器上使用 `putty` 软件作为 ssh 客户端连接服务器。\n\
  \n## 第 22 章：使用防火墙保护系统\n\n`Firewalld` 是 Oracle Linux 8 提供的防火墙管理解决方案。`Firewalld` 是\
  \ Oracle Linux 内核提供的 `iptables` 数据包过滤系统的前端。在本章中，我们将介绍如何为 Oracle Linux 服务器设置防火墙以及防火墙管理的基础。`firewall-cmd`\
  \ 是管理防火墙的命令行管理工具。\n\n### 防火墙的基本概念\n\n### 区域 (Zones)\n区域是根据计算机连接的位置应用到计算机的设置组。区域可能包含连接设置和连接安全设置。区域定义了你计算机的保护级别。区域连接到网络接口或分配了一系列地址。预定义的区域有：\n\
  \n| 区域 | 描述 |\n| :--- | :--- |\n| drop | 最不可信的区域，仅允许出站连接。所有入站连接被拒绝且不回复。 |\n| block\
  \ | 仅允许出站连接，入站连接会被用 icmp-host-prohibited 消息拒绝。 |\n| public | 当系统连接到安全性较低的网络（如直接连接到公共互联网）时应用此设置。仅允许选定的入站连接。\
  \ |\n| external | 使用 NAT 伪装，使你的内部网络保持私密性。 |\n| internal | 受信任区域，允许双向连接。 |\n| dmz\
  \ | 应用于 DMZ（解密化区）。 |\n| work | 允许双向连接。 |\n| home | 允许双向连接。 |\n\n### 规则 (Rule)\n\
  在 firewalld 中，规则可以指定为：\n- 永久 (Permanent)\n- 运行 (Runtime)\n\n`永久`规则在重启后依然有效。`运行`规则仅在当前有效。\n\
  \n### 规则类型\n你可以配置规则以：\n- 程序 (Program)\n- 端口 (Port)\n- 预定义服务 (Predefined services)\n\
  \n### 安装防火墙\n```bash\nyum install firewalld\n```\n\n### 启动\n```bash\nsystemctl start\
  \ firewalld\n```\n\n### 启用\n```bash\nsystemctl enable firewalld\n```\n\n### 显示\n\
  显示所有区域\n```bash\nfirewall-cmd --get-zones\n```\n\n显示所有区域详细信息\n```bash\nfirewall-cmd\
  \ --list-all\n```\n\n显示特定区域的信息\n**语法**\n`firewall-cmd --zone=zone_name --list-all`\n\
  **示例**\n```bash\nfirewall-cmd --zone=public --list-all\n```\n\n### 显示选定的区域\n显示防火墙默认的区域\n\
  ```bash\nfirewall-cmd --get-default-zone\n```\n\n显示活动区域\n```bash\nfirewall-cmd --get-active-zones\n\
  ```\n\n### 修改防火墙规则\n更改接口的区域\n**语法**\n`firewall-cmd --zone=zone_name --change-interface=interface_name`\n\
  **示例**\n```bash\nfirewall-cmd --zone=internal --change-interface=eth1\n```\n\n更改默认区域\n\
  **语法**\n`firewall-cmd --set-default-zone=zone_name`\n**示例**\n```bash\nfirewall-cmd\
  \ --set-default-zone=internal\n```\n\n将运行规则变为永久规则\n```bash\nfirewall-cmd --runtime-to-permanent\n\
  ```\n\n在运行环境中永久规则\n```bash\nfirewall-cmd --reload\n```\n此命令将重新加载防火墙设置并使用永久设置。\n\n\
  ### 允许服务\n首先检查此服务是否预定义列表中\n```bash\nfirewall-cmd --get-services\n```\n\n列出当前配置并允许的服务列表\n\
  ```bash\nfirewall-cmd --list-services\n```\n添加\n**语法**\n`firewall-cmd --add-service=service_name`\n\
  **示例**\n```bash\nfirewall-cmd --add-service=ssh\n```\n将当前配置设为永久\n```bash\nfirewall-cmd\
  \ --runtime-to-permanent\n```\n向不同区域添加服务\n**语法**\n`firewall-cmd --add-service=service\
  \ --zone=zone_name`\n**示例**\n```bash\nfirewall-cmd --add-service=ssh --zone=public\n\
  ```\n从允许列表中移除服务\n**语法**\n`firewall-cmd --remove-service=service_name --zone=zone_name`\n\
  **示例**\n```bash\nfirewall-cmd --remove-service=ssh --zone=public\n```\n在此命令后将当前配置保存为永久\n\
  ```bash\nfirewall-cmd --runtime-to-permanent\n```\n\n### 添加端口\n列出所有允许的端口\n```bash\n\
  firewall-cmd --list-ports\n```\n添加端口\n**语法**\n`firewall-cmd --add-port=port_no/port_type`\n\
  **示例**\n```bash\nfirewall-cmd --add-port=1191/tcp\n```\n\n\n\n\n\n```bash\nfirewall-cmd\
  \ --check-config\n```\n\n## 重载配置\n\n```bash\nfirewall-cmd --reload\n```\n\n## GUI\
  \ 防火墙管理\n\n你可以使用图形界面管理防火墙\n\n### 安装 firewall-config\n\n```bash\nyum install -y firewall-config\n\
  ```\n\n### 使用\n\n![](img/image00414.jpeg)![](img/image00415.jpeg)\n点击“活动”（Activities），然后在搜索栏中输入\
  \ `firewall` 并点击 `firewall` 图标。\n\n该界面自直。\n\n## 修改防火墙设置\n\n### 修改配置\n\n![](img/image00416.jpeg)\n\
  启动界面时，默认情况下从下拉菜单中选择了 `Runtime` 配置，以便立即更改当前的防火墙设置；或者，若想在下次系统启动或防火墙配置重载时应用设置，请从下拉列表中选择\
  \ `Permanent`。\n\n#### 更改连接的区域\n\n![](img/image00417.jpeg)\n要向某个区域配置或添加连接，请启动 `firewall-config`，从\
  \ `Options`（选项）菜单中选择 `Change zone of connections`（更改连接区域）。它将显示带有可用连接列表子菜单，从下拉菜单中选择所需的连接。在下一个下拉菜单中选择\
  \ `Zone`（区域）。\n\n#### 设置默认区域\n\n![](img/image00418.jpeg)\n要为新接口设置默认区域或更改现有接口的默认区域。首先选择所需的连接，然后从菜单栏选择\
  \ `Options`，并从下拉菜单中选择 `Change Default Zone`（更改默认区域）。现在从菜单列表中选择所需的区域。\n\n#### 配置服务\n\
  \n`Firewall-config` 工具提供了用于启用和禁用预定义或自定义服务的界面。首先，选择你想要配置服务的区域。接下来勾选或取消勾选服务的复选框。选中的复选框表示已启用的服务，未选中（取消）的复选框表示被拦截的服务。\n\
  \n![](img/image00419.jpeg)\n\n## 第 23 章：探索 Cockpit\n\n`Cockpit` 是一个适用于 Oracle Linux\
  \ 8 的基于 Web 的服务器管理工具。它是默认的服务器管理工具。Cockpit 是一个非常有用的 Web GUI 工具，通过你可以监控和管理多个 Linux\
  \ 服务器。Cockpit 还允许你管理服务器上的网络、存储、容器和虚拟机。使用 Cockpit 管理日志变得非常简单。\n\n### 安装\n\n如果系统中尚未安装\
  \ Cockpit，你可以使用以下命令进行安装。\n\n```bash\nyum install -y cockpit\n```\n\n### 启动并启用服务\n\
  \n运行以下命令以启用并启动 cockpit 服务。\n\n```bash\nsystemctl start cockpit.socket\nsystemctl\
  \ enable cockpit.socket\n```\n\n### 检查服务状态\n\n```bash\nsystemctl status cockpit.socket\n\
  ```\n\n### 访问 Cockpit\n\n在 PC 或服务器上打开 浏览器并输入 URL：\n\n`https://<Your_serever_IP>:9090`\n\
  \n示例\n`https://192.168.1.128:9090`\n\n如果你在同一台服务器上打开，可以使用 `localhost` 代替 IP 地址。\n\
  \n![](img/image00420.jpeg)\n\n## 第 24 章：日志管理\n\n日志是任何操作系统的重要部分。日志对于系统的故障排除和审计非常有帮助。Oracle\
  \ Linux 将大部分日志保留在中心位置 `/var/log` 目录。重要文件之一是 `/var/log/messages`，Oracle Linux 在此记录内核/核心系统日志。\n\
  \n## Journalctl\n\n`Journald` 是 Oracle Linux 中用于收集和存储日志数据的服务。该服务用于管理系统日志，包括启动消息、内核日志、syslog\
  \ 信息、服务消息和系统错误消息等。默认情况下，它将所有日志保留在内存中，并将日志存储在 `/run/log/journal` 目录下的小型环形缓冲区。如果启用了持久化日志配置，它将开始在\
  \ `/var/log/journal` 目录下存储日志。\n\n### 配置文件\n\n`journald` 的主配置文件为 `/etc/systemd/journald.conf`。\n\
  \n### 将日志改为持久化\n\n如果你要在系统上永久保存日志，可以将配置文件中的 `Storage` 变量设置为 `auto` 或 `persistent`。\n\
  \n```ini\n[Journal]\n#Storage=auto\n#Compress=yes\n#Seal=yes\n#SplitMode=uid\n#SyncIntervalSec=5m\n\
  #RateLimitIntervalSec=30s\n#RateLimitBurst=10000\n```\n\n### 从旧条目开始列出日志\n\n```bash\n\
  journalctl\n```\n\n### 列出当前启动的日志\n\n```bash\njournalctl -b\n```\n\n### 列出昨天的日志\n\
  \n```bash\njournalctl --since yesterday\n```\n\n### 按特定进程 ID 列出日志\n\n语法\n```bash\n\
  journalctl -F _PID=PID\n```\n\n示例\n```bash\njournalctl -F _PID=2451\n```\n\n###\
  \ 查看运行日志\n\n```bash\njournalctl -f\n```\n按 `Ctrl + C` 停止查看\n\n### 查看特定数量的近期条目\n\n\
  ```bash\njournalctl -n10\n```\n此命令将显示最后 10 条条目。\n\n特定优先级的日志条目（如所有错误）\n\n```bash\n\
  journalctl -p err\n```\n\n### 查看所有带有警告的条目\n\n```bash\njournalctl -p warning\n```\n\
  \n## Rsyslog\n\n快速 Syslog 服务器或 `rsyslog` 是大多数 Linux 发行版使用的非常流行且传统的处理系统。日志文件包含有关系统、内核、服务和应用程序的消息。Oracle\
  \ Linux 8 使用 `Rsyslog` 作为默认日志服务。`Journald` 将所有日志转发到 `rsyslog`。`Rsyslog` 将 `journald`\
  \ 转发的所有日志以纯文本格式存储在 `/var/log/` 目录下的文件中。`Rsyslog` 的主配置文件是 `/etc/rsyslog.conf`。配置文件包含存储日志消息的规则行。它具有以下参数：\n\
  \n- Facility\n- Priority\n- Actions\n\n| Facility | Facility 是生成消息的进程或应用程序，使用 `*`\
  \ 表示所有设施。 |\n| :--- | :--- |\n| Priority | Priority 是日志消息的类型，代码 `emerg` 表示紧急、`alert`、`crit`\
  \ 表示关键、`err` 表示错误、`warn` 表示警告、`info`、`debug`。使用 `*` 表示所有优先级级别。 |\n| Action | Action\
  \ 决定对匹配规则必须采取什么操作。 |\n\n在下例示例中，Facility 是 mail，Priority 是所有错误，Action 是 mail.err\
  \ 文件。\n\n![](img/image00421.jpeg)\n\n`Rsyslog` 也可以用于转发到中央日志服务器。\n\n# 第 25 章：理解进程\n\
  \n用户或系统执行的任何程序都会启动进程或进程来完成任务。每个进程都有自己的进程 ID。在进程的生命周期内，该进程 ID 是唯一的。进程有两种类型：\n\n|\
  \ Foreground | 前台进程是在终端上直接运行的任何命令或任务并等待其完成。某些前台进程还需要用户交互。 |\n| Background | 与前台进程不同，shell\
  \ 不等待进程完成。后台进程本质上是非交互的。 |\n\n## 守护进程\n\n是在后台运行的特殊进程，通常不受用户登录和注销的影响。守护进程有两种：一种随系统启动，另一种由进程或命令触发。\n\
  \n## 子进程和父进程\n\n当一个进程启动任何新进程时，新进程被称为子进程，启动该进程的进程被称为父进程。一个父进程可以有多个子进程。\n\n## Init\
  \ 进程\n\n`Init` 进程是所有进程的母亲。它是 Linux 系统启动时执行的第一个程序。因此，`Init` 进程是所有其他进程的父进程。\n\n为 1\n\
  \n当进程死亡而其子进程仍然运行时，这些子进程被称为孤儿进程。`init` 进程采用系统中任何孤儿运行进程。\n\n## 查找进程 ID\n\n如提到的每个进程都有自己的进程\
  \ ID。该进程 ID 对系统非常重要，因为 Linux 内部通过其 ID 识别进程。要查找任何运行程序的进程 ID\n\n语法\n```bash\npidof\
  \ program_name\n```\n\n示例\n```bash\npidof systemd\n```\n\n### 列出所有进程。\n\n打印当前 shell\
  \ 的进程\n\n```bash\nps\n```\n\n列出系统上所有活动进程\n```bash\nps -e\n```\n\n按用户名列出所有进程\n\n\
  ```bash\nps -eu\n```\n\n显示详细进程列表\n\n```bash\nps -aux\n```\n或\n```bash\nps -ef\n\
  ```\n上述两个命令显示有关进程的详细信息，包括进程 ID 和父进程 ID。\n\n\n\n\n\n`top` 是另一个列出进程、进程 ID 和资源利用摘要的命令。\n\
  \n```\ntop\n```\n\n![](img/image00422.jpeg)\n在顶端屏幕按 `q` 退出\n\n## 控制进程\n\n### 停止运行的进程\n\
  要停止进程，请首先检查它的 ID\n\n#### 语法\n```bash\nps -ef | grep process name\n```\n\n#### 示例\n\
  ```bash\nps -ef |grep http\n```\n\n#### 停止\n#### 语法\n```bash\nkill PID\n```\n####\
  \ 示例\n```bash\nkill 234\n```\n\n#### 立即强制杀死进程而不进行清理\n#### 语法\n```bash\nkill -9 PID\n\
  ```\n#### 示例\n```bash\nkill -9 234\n```\n\n### 在后台启动进程\n若要在后台启动任何命令，请添加安培符号 (`&`)\n\
  \n#### 语法\n```bash\nprogram &\n```\n\n#### 示例\n```bash\ntar -xvf mytest.tar . &\n\
  ```\n\n将运行中的进程移动到后台，按 `Ctrl+Z`\n```\ntar -xvf mytest.tar . \n```\n^Z\n\n### 检查后台进程\n\
  ```\nbg\n```\n或者\n```\njobs\n```\n\n### 将后台进程移到前台\n#### 语法\n```bash\nfg %jobid\n\
  ```\n#### 示例\n```bash\nfg %2\n```\n\n## 更改进程优先级\n在系统上执行的每个进程都有调度优先级。优先级决定了当 CPU\
  \ 执行进程时哪个进程先运行。高优先级的进程将在低优先级进程之前执行。相同优先级的进程一个接一个执行。\n\n#### Nice 和 renice\n你可以使用\
  \ `nice` 和 `renice` 命令更改作业调度优先级。默认情况下，当你启动任何进程时，它以 0 优先级启动，你可以使用 `nice` 命令将优先级从\
  \ `-20` 修改到 `+19`。其中 `-20` 是最低优先级，`+19` 是最高优先级。\n\n#### 在启动进程时使用 `nice` 命令修改进程优先级\n\
  #### 语法\n```bash\nnice -n priority command\n```\n#### 示例\n```bash\nnice -n 5 tar\
  \ -xvf testdox.tar .\n```\n\n#### 更改运行进程的 nice 值\n#### 语法\n```bash\nrenice -n priority\
  \ -p process_id\n```\n#### 示例\n```bash\nrenice -n 5 -p 1235\n```\n\n#### 检查所有进程的\
  \ nice 值\n#### 语法\n```bash\nps -eo pid,ni,comm\n```\n\n#### 检查特定进程的 nice 值\n####\
  \ 语法\n```bash\nps -eo pid,ni,comm | grep command\n```\n#### 示例\n```bash\nps -eo\
  \ pid,ni,comm |grep cron\n```\n只有 root 用户可以更改其他用户和系统进程的 nice 值。\n\n## 第 26 章\n\n\
  # 监控你的系统\n\n系统监控是系统管理的一项任务。系统监控可以避免系统突然故障和拒绝服务\n\n## 查看系统进程\n\n### 列出进程\n```bash\n\
  ps\n```\n\n`top` 命令是一个多功能监控工具，也可用于进程监控\n```\ntop\n```\n\n### 查看内存使用\n`free` 命令显示内存快照，包括总内存、可用和空闲内存\n\
  ```\nfree\n```\n\n#### 以 GB 显示内存\n```bash\nfree -g\n```\n\n### 查看块设备\nLinux 中的块设备是支持以固定大小块读写数据的设备。它通常是暴露给\
  \ Linux 用户供进一步使用的硬件设备。\n\n#### 列出可用块设备\n```bash\nlsblk\n```\n\n#### 列出块设备的 UUID\n\
  ```bash\nblkid\n```\n\n#### 显示选择设备的磁盘分区列表\n#### 语法\n```bash\npartx -s device_name\n\
  ```\n#### 示例\n```bash\npartx -s /dev/sda\n```\n\n#### 以树格式列出当前挂载的文件系统\n```bash\n\
  findmnt\n```\n\n#### 有序列出当前挂载的文件系统\n```bash\nfindmnt -l\n```\n\n#### 显示带有使用信息的当前挂载文件系统列表\n\
  ```bash\ndf\n```\n默认情况下，`df` 命令以 1 千字节为块显示分区大小，为了\n\n#### 以人类可读的格式（即 MB 和 GB）显示列表\n\
  ```bash\ndf -h\n```\n\n#### 显示目录中文件占用的空间\n```bash\ndu\n```\n默认情况下，`du` 以千字节显示磁盘使用情况，要以人类可读的格式（即\
  \ KB、MB 和 GB）查看\n```bash\ndu -h\n```\n\n#### 查看目录的总使用量\n```bash\ndu -sh\n```\n\n\
  ### 查看硬件信息\n#### 列出系统中当前安装的所有 PCI 设备\n```bash\nlspci\n```\n\n#### 显示所有 PCI 设备的详细信息\n\
  ```bash\nlspci -v\n```\n\n#### 显示关于所有 PCI 设备的详细信息\n```bash\nlspci -vv\n```\n\n####\
  \ 列出系统中所有的 USB 设备\n```bash\nlsusb\n```\n\n#### 列出系统中所有 USB 设备的详细信息\n```bash\nlsusb\
  \ -v\n```\n\n#### 列出所有 pcmcia 设备\n```bash\nlspcmcia\n```\n\n#### 显示更多 PCMCIA 设备的信息\n\
  ```bash\nlspcmcia -v\n```\n\n#### 显示 CPU 信息\n要查看 CPU、核心、线程、供应商、系列、型号等\n```\nlscpu\n\
  ```\n或者\n```\ncat /proc/cpuinfo\n```\n此输出中的主要信息可以是：\n\n| CPU | 逻辑 CPU 编号 |\n| CORE\
  \ | CPU 的逻辑核心。 |\n| SOCKET | 逻辑插槽。 |\n\n#### 显示硬件信息\n```bash\nlshw\n```\n\n####\
  \ 显示硬件信息摘要\n```bash\nlshw -short\n```\n\n#### 显示内核信息\n```bash\nuname -rv\n```\n\n\
  ### 显示主机名\n```bash\nhostname\n```\n\n#### 显示 Oracle Linux 版本\n```bash\ncat /etc/oracle-release\n\
  ```\n\n### 硬件监控\n在一个屏幕上监控 CPU、内存和网络等硬件资源\n`top` 命令是最常用的命令，带有所有硬件资源信息的摘要\n```\ntop\n\
  ```\n\n### CPU 监控\n要监控 CPU 过度提交，你可以使用 `SAR`\n`sar` 命令是系统活动报告工具。\n\n#### 安装 sar 命令\n\
  ```bash\nyum install sysstat\n```\n\n#### 使用 sar 命令监控系统\n#### 语法\n```bash\nsar time\
  \ number_of_sample\n```\n#### 示例\n![](img/image00423.jpeg)\n```\nsar 2 3\n```\n\n\
  ### 监控内存\n`vmstat` 命令可以查看内存和交换空间的使用情况。\n#### 语法\n```\nvmstat delay count\n```\n\
  #### 示例\n```\nvmstat 2 3\n```\n此命令每 2 秒执行一次。\n\n#### 显示内存摘要\n```\nvmstat -s\n```\n\
  \n### 监控 IO 设备\n```\niostat\n```\n\n### 列出打开的文件\n此命令将显示相应进程打开的文件\n```\nlsof\n```\n\
  你可以配合 `grep` 命令使用此命令来过滤进程。\n\n### 网络\n监控网络有多个命令\n#### 显示所有监听端口\n```\nnetstat -a\n\
  ```\n\n#### 显示仅 tcp\n```\nnetstat -at\n```\n\n#### 显示所有监听端口\n```\nnetstat -tunlp\n\
  ```\n\n#### 显示路由表和默认网关\n```\nnetstat -r\n```\n\n### tcpdump\n`tcpdump` 命令主要作为网络分析器或数据包嗅探通过你的计算机。要使用此命令，你需要熟悉\
  \ tcp/ip 协议。\n#### 语法\n```\ntcpdump -i interface_name\n```\n#### 示例\n```\ntcpdump\
  \ -i eth0\n```\n\n### ss\n`ss` 工具显示网络信息\n#### 显示所有监听端口\n```\nss -l\n```\n\n####\
  \ 显示 uptime（Oracle Linux 系统运行了多久）\n```\nuptime\n```\n\n### NFS 统计\n`nfsstat`\n####\
  \ 仅查看服务器统计\n```\nnfsstat -s\n```\n#### 仅查看客户端统计\n```\nnfsstat -c\n```\n#### 显示关于挂载文件系统的信息\n\
  ```\nnfsstat -m\n```\n\n### Gnome 系统监控\nGnome 系统监控应用程序允许你在任何时刻监控系统状况。此外，你可以收集有关应用程序的重要信息。它提供了：\n\
  * 监控 CPU、内存、交换空间和网络\n* 监控进程及其属性\n* 控制进程行为\n* 搜索打开的文件\n* 显示磁盘和挂载信息\n\n#### 进程卡\n\
  显示系统所有运行的进程及其 CPU 使用、内存使用、磁盘使用情况等。右键点击进程可以操作所选进程。\n![](img/image00424.jpeg)\n![](img/image00425.jpeg)\n\
  \n#### 资源卡\n以图形格式显示所有硬件资源的使用情况和历史。\n![](img/image00426.jpeg)\n\n#### 文件系统卡\n显示挂载的文件系统及其使用百分比。\n\
  \n## 第 27 章\n\n# 自动化你的系统\n\n系统自动化可以简化管理员的工作，并减少重复任务中的错误次数。Linux 提供了调度器来处理定期作业。\n\
  \n`Cron` 是 Oracle Linux 中基于时间的作业调度器，用于在指定的时间运行命令。除了系统级 cron 表，每个用户都可以拥有独立的 cron\
  \ 表来执行调度作业。\n\n系统级 cron 表文件为 `/etc/crontab`。`/var/spool/cron/` 目录包含每个用户的 `cron 表`。\n\
  \n### 添加或编辑 cron 作业\n```bash\ncrontab -e\n```\n此命令用 vi 编辑器打开用户的 crontab 文件。你可以添加或更改\
  \ crontab。\n\n#### cron 文件的格式为\n`分钟 小时 日 份 星期几 [用户名] 命令`\n\n#### 示例\n```bash\n0\
  \ 1 * * * /opt/backup.sh\n```\n在此示例中，备份脚本将在每天晚上 1 点执行。\n\n\n\n\n其中 `*` 代表所有值，例如日期字段中的\
  \ `*` 代表每月的每一天，月份字段中的 `*` 代表每个月，星期字段中的 `*` 则代表每周的每一天。\n\n## 用户访问控制\n\n由于 crontabs\
  \ 可能会对系统产生危害，你可以通过 `/etc/cron.allow` 和 `/etc/cron.deny` 文件来控制用户使用 crontab 文件进行任务调度的权限。在这两个文件中的任意一个文件中添加用户名，即可允许或拒绝对\
  \ crontab 的访问。为了避免混淆，如果 `/etc` 目录下存在 `cron.allow` 文件，则不会使用 `cron.deny` 文件。如果两个文件都不存在，则只有\
  \ root 用户可以使用 crontab 文件。\n\n### 列出 crontab \n```\ncrontab -l\n```\n\n### 删除用户的\
  \ crontab\n```\ncrontab -r\n```\n\n`root` 用户可以使用 `-u` 参数更改其他用户的 crontab。\n\n####\
  \ 示例\n```\ncrontab -u user2 -l\n```\n\n## At\n\n与 cron（允许你在指定的日期和时间定期运行任务）不同，`at`\
  \ 命令主要用于调度临时任务。`at` 命令由 `atd` 守护进程控制。要使用 `at` 命令，`atd` 守护进程必须处于运行状态。\n\n### 安装\n\
  ```\nyum install at\n```\n\n### 启动并启用\n```\nsystemctl start atd\nsystemctl enable\
  \ atd\n```\n\n### 检查 atd 守护进程状态\n```\nsystemctl status atd\n```\n\n### 添加任务\n使用指定时间和从现在起计算的天数执行\
  \ `at` 命令。\n```\nat 4pm + 3 days\n```\n该命令将打开交互式 `at` 提示符，用于编写你想要在 3 天后下午 4 点调度的命令或脚本名称。按下\
  \ `Ctrl + d` 键退出 `at` 提示符。\n\n### 不通过交互提示符添加任务\n```\nat time -f scriptname\n```\n\
  \n#### 示例\n```\nat 4pm + 3 days -f /etc/opt/backup1.sh\n```\n\n### 列出已调度的任务\n```\n\
  atq\n```\n\n### 删除已调度的任务\n```\natrm job_number\n```\n\n#### 示例\n```\natrm 3\n```\n\
  \n## 第 28 章：重置忘记的 root 密码\n\n要重置未知的 root 密码，请按照以下步骤：\n\n1. 重启机器并在 GRUB 菜单按下 `e`\
  \ 键。\n2. ![](img/image00427.jpeg)找到以 `Linux` 开头的行，使用 `Ctrl+e` 将光标移动到行尾并输入 `rd.break`。\n\
  3. 按下 `Ctrl + x` 键。\n4. 系统将给出只读根文件系统的提示符。\n5. 将文件系统重新挂载为读写模式\n```\nmount -o remount,rw\
  \ /sysroot\n```\n6. 切换根目录\n```\nchroot /sysroot\n```\n7. 修改密码\n```\npasswd\n```\n\
  8. 创建 `autorelabel` 文件以便在下次启动时启用 SELinux 重新标记过程。\n```\ntouch /.autorelabel\n```\n\
  9. 输入 `exit` 并按回车。\n10. ![](img/image00428.jpeg)再次输入 `exit` 并按回车键以正常模式启动系统。\n\n"
