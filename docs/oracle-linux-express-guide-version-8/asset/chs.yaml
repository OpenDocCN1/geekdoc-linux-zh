- "# Oracle Linux 8 版本快速启动指南\n\n\n\n![](img/cover00429.jpeg)\n\n\n## 前言\n\n让我们开启 Oracle\
  \ Linux 之之旅。本书涵盖了 Oracle Linux 的安装、文件系统结构、网络、LVM、仓库结构、NTP、日志管理等许多其他方面。本书的结构非常简单，易于遵循。\n\
  \n感谢\nShiv Kumar Goyal\n\n\n## 第 1 章\n## 引言\n\nLinux 是由 Linus Torvalds 于 1991 年启动的开源项目。它是一个类\
  \ Unix 操作系统。市场上上有数千个 Linux 发行版，大致根据其根发行版进行分类，例如 CentOS、Oracle 和 Scientific Linux\
  \ 都是基于 Red hat 的，而 Red hat 又基于 Fedora Linux。Fedora Linux 是由 Red Hat 赞助的社区项目。\n\n\
  ### 免费与 付费\n\nLinux 尽管是一个开源项目，但市场上存在两种类型的 Linux 发行版：一种是免费的，另一种是付费的。免费是不言自明的，你不需要支付任何费用。在遇到任何问题时，你可以向为\
  \ Linux 社区工作的志愿者寻求帮助。然而，这种支持不是限时的。因此，使用关键任务型 Linux 服务器和桌面电脑的公司更倾向于选择付费的 Linux 发行版，他们支付固定金额作为订阅和支持费用。这些付费\
  \ Linux 发行版公司拥有 Linux 专家团队来提供支持和修复。\n\nOracle Linux 遵循中庸，它可以免费使用和更新，但支持是付费的。Oracle\
  \ Linux 发行版源自 RedHat 的源代码。Oracle Linux 在功能和二进制上与 Red hat enterprise Linux 兼容。Oracle\
  \ Linux 通常移除 Red hat 的品牌和标识。在 Redhat 与 IBM 合并后，曾作为 Redhat 免费替代方案的 CentOS Linux 已不再可用。Centos\
  \ 提供的可用产品只有 CentOS stream，它是一个滚动发布版本。以前倾向于将 CentOS 作为 Redhat Linux 免费替代方案的客户现在不愿在生产环境中使用\
  \ CentOS。Oracle 提供了简单的脚本将你当前的 CentOS 环境迁移到 Oracle Linux。\n\n### 支持的平台。\n\nOracle\
  \ Linux 版本 8 安装镜像适用于以下平台：\n\n| 镜像 | 支持的平台 |\n| :--- | :--- |\n| x86_64 | Intel 和\
  \ AMD 64 位 |\n| aarch64 | ARM 64 位 |\n\n### 镜像类型\n\n标准安装镜像仅以 ISO 镜像的形式存在，但你也可以获得云镜像、容器镜像和\
  \ Vagrant 镜像。\n\n## 第 2 章\n# oracle Linux 支持生命周期\n\n正如前面提到的，如果你在关键任务系统中使用 Linux，Oracle\
  \ Linux 的生命周期如下：\n\n| 版本 | 通用 | 支持结束 | 持续支持结束 |\n| :--- | :--- | :--- |\n| 3 | 2003\
  \ | 2011 |\n| 4 | 2005 | 2013 |\n| 5 | 2007 | 2017 |\n| 6 | 2011 | 2020 |\n| 7 |\
  \ 2014 | 2021 |\n| 8 | 2019 | 2024 |\n\n### 支持类型\n\nOracle 为 Linux 提供两种类型的付费支持。两种支持类型的区别如下：\n\
  \n| 特性 | 基础支持 | 高级支持 |\n| :--- | :--- | :--- |\n| 24x7 电话和在线支持 | 是 | 是 |\n| 获取增强、更新和修复\
  \ | 否 | 是 |\n| 终身持续支持 | 否 | 否 |\n\n## 第 3 章\n## 安装媒体准备\n\nOracle Linux 下载有多种形式：\n\
  \n| 格式 | 说明 |\n| :--- | :--- |\n| ISO 镜像 | 适用于 x86_64 和 ARM |\n| Vagrant | 用于 Vagrant\
  \ Boxes |\n| 容器镜像 | 适用于 x86_64 和 ARM |\n| GitHub Container Registry | |\n| Docker\
  \ Hub | 适用于 Docker 镜像 |\n| 虚拟机模板 | .ova 格式 |\n| Raspberry Pi 4 和 Raspberry Pi 3\
  \ | 适用于 ARM |\n\n本书中我们将仅涵盖 Intel 安装。下载 Oracle Linux 镜像遵循以下步骤：\n\n1 访问网站 `https://yum.oracle.com/oracle-isos.html`\n\
  \n2 ![](img/0331.jpeg)选择版本和平台，如果是完整 ISO 请选择 Full\n\n### 验证下载\n\n从下方站点下载校验文件：\n\n\
  ![](img/0332.jpeg)[`linux.oracle.com/gpg/`](https://linux.oracle.com/gpg/)\n\n如果你将镜像下载到了\
  \ Microsoft Windows 机器上。打开 PowerShell 提示符并输入以下命令：\n\n语法\n`get-filehash 文件路径`\n\n\
  示例\n```\n![](img/0334.jpeg)[`getfedora.org/fmw/FedoraMediaWriter-win32-latest.exe`](https://getfedora.org/fmw/FedoraMediaWriter-win32-latest.exe)\n\
  \n2 双击下载的文件并按照安装步骤操作。\n\n3 ![](img/0335.jpeg)选择自定义镜像\n\n4 选择下载的 Oracle Linux ISO\
  \ 文件并点击打开。\n\n5 ![](img/0336.jpeg)![](img/0337.jpeg)选择 USB 设备并写入磁盘。\n\n6 等待完成并关闭。\n\
  \n7 从 Windows 系统上拔掉 USB。\n\n![](img/0338.jpeg) 现在安装媒体已准备就绪。\n\n## 第 4 章\n## 安装步骤\n\
  \n\n\n\n\n在本章中，我们将介绍安装步骤。然而，在进行安装之前，建议在 Oracle Linux 网上检查您的服务器/PC 的硬件兼容性。\n\nOracle\
  \ Linux 在发行说明中指定了安装的最低配置，但建议至少具备以下配置以获得系统的最佳性能：\n\n* 4 GB 或更多内存（RAM）。\n* Intel Core\
  \ I3 或更高级的处理器。\n* 60GB 硬盘。\n* 16GB USB 磁盘作为安装介质。\n\n注意：根据您的需求和环境，可以使用较少的资源完成安装。\n\
  \n## 安装基础\n\nOracle Linux 使用 `Anaconda` 安装程序进行安装。Oracle Linux 的安装可以通过以下方式完成：\n\n\
  * 快速安装\n* 自定义 GUI 安装\n* Kickstart 自动化安装\n\n### 分区\n\nOracle Linux 支持三种类型的分区设备\n\n\
  * 标准分区\n* LVM\n* LVM thin（精卷 LVM）\n\n### 标准分区\n\n对于引导、BIOS boot 和 EFI 系统分区，只能使用标准分区。\n\
  \n### LVM\n\n`LVM` 分区方案提供了灵活性和性能优势。在安装过程中选择 `LVM` 分区时，如果系统当前不存在卷组，安装程序会自动创建一个。\n\
  \n### LVM thin\n\n`LVM thin` 使用存储池，允许对存储进行精简置备（thin provisioning）。\n\n### 支持的文件系统\n\
  \n* XFS\n* ext4, ext3, ext2\n* swap\n* BIOS boot\n* EFI 系统分区\n\n### XFS\n\nXFS 是一种高性能文件系统，支持单个文件系统多达\
  \ 500 TB。它是 Oracle Linux 8 的默认文件系统。\n\n### Ext3 和 Ext4\n\nExt3 和 Ext4 被称为日志文件系统。日志会跟踪尚未提交到文件系统的更改，以便在系统意外断电时轻松恢复文件系统。\n\
  \nEXT2 是旧版本 Linux 中使用的标准文件系统。\n\n### Swap\n\n它是位于硬盘上的虚拟内存。当系统没有足够的 RAM 运行程序时，它会将部分内存数据传输到\
  \ swap 空间。\n\n### BIOS boot\n\n用于 GPT 的必需分区。\n\n### EFI\n\nUEFI 系统上 GPT 的启动设备。\n\
  \n### 推荐的分区方案\n\n| 分区 | 详情 |\n| :--- | :--- |\n| `/boot` | 1 GB 且不使用 LVM。 |\n| `/`\
  \ | 根分区建议大小为 10GB。 |\n| `/home` | 22GB（可选） |\n| `/swap` | 在某些情况下等于或大于 RAM，有时应为系统内存的两倍。\
  \ |\n\n## 启动您的机器\n\n要启动 Oracle Linux 的安装过程，您必须使用安装介质启动系统。\n\n对于如 VMware 基础设施中的 `VM`\
  \ 等虚拟机，您可以直接使用 `ISO` 镜像。只需挂载 `ISO` 镜像并启动机器。\n\n对于物理服务器，插入之前创建的 Oracle Linux USB\
  \ 安装介质。\n\n开启服务器并按键更改启动顺序，使用 USB 作为启动设备（参考机器硬件手册获取启动管理器键，例如某些戴尔服务器为 `F11`）。\n\n\
  ## 安装步骤\n\n1. ![](img/image00339.jpeg)从启动菜单中，选择 Install Oracle Linux 8 并按下 `ENTER`\
  \ 键。\n2. ![](img/image00340.jpeg)选择您的语言和位置。点击 Continue（继续）。\n3. 下一个屏幕是安装摘要，显示了带有默认值的所有安装选项。\n\
  4. ![](img/image00341.jpeg)![](img/image00342.jpeg)从安装摘要屏幕选择 Time & Date（日期与时间）。在地图上点击您当前的位置。系统将相应更改日期、时间和时区。根据需要，将日期格式从\
  \ 24 小时更改为 AM/PM。按 Done（完成）。\n5. ![](img/image00343.jpeg)选择 Installation Destination（安装位置）。从\
  \ Local Standard Disks（本地标准磁盘）面板中选择目标磁盘。点击 Done 使用自动分区的默认设置。注意：如果您有特定的文件系统要求，可以选择\
  \ Custom（自定义）选项。\n6. 在网络配置屏幕上。将 Host Name（主机名）更改为完全主机名并按 Apply（应用）。\n7. 点击 Configure（配置）。\n\
  8. ![](img/image00344.jpeg)![](img/image00345.jpeg)确保选择了 Connect automatically with\
  \ priority（自动连接并优先）。\n9. 选择 `IPV4` 设置标签页以配置静态 IP 地址。\n10. 在 `IPV4` 标签页上更改以下内容：\n\
  \    1. 从下拉菜单中将 Method（方法）更改为 Manual（手动）。\n    2. 按下 `Add`（添加）按钮。\n    3. 提供 IP\
  \ 地址。\n    4. 提供掩码。\n    5. 提供网关。\n    6. 添加 DNS。\n    7. ![](img/image00346.jpeg)按\
  \ Save（保存）。\n11. 点击 Done 接受更改。\n12. ![](img/image00347.jpeg)在安装摘要屏幕上按 Root Password（根密码）。\n\
  13. 设置根密码并按 Done。\n14. 在安装摘要窗口上选择 User Creation（创建用户）。\n15. ![](img/image00348.jpeg)在\
  \ Create User 屏幕上为新用户提供全名、用户名和密码。如果让此用户成为管理员，请选择 Make user administrator（设用户管理员）。![](img/image00349.jpeg)\n\
  16. 在安装摘要窗口上按 Begin Installation（开始安装）。它将启动安装过程。\n17. ![](img/image00350.jpeg)在安装过程完成后按\
  \ Reboot System（重启系统）。\n18. ![](img/image00351.jpeg)重启后，在 Initial Setup 屏幕上按 Licence\
  \ Information（许可信息）。\n19. ![](img/image00352.jpeg)在许可信息屏幕上，选择 I accept licence agreement（我接受许可协议）。按\
  \ Done。\n20. ![](img/image00353.jpeg)按 Finish installation（完成安装）。\n21. 在登录屏幕上选择\
  \ Not listed（未列出）。\n22. ![](img/image00354.jpeg)![](img/image00355.jpeg)输入 root\
  \ 并按 Next（下一步）。\n23. 为 root 用户提供密码。与您安装时选择的密码相同。按 Sign In（登录）。![](img/image00356.jpeg)\n\
  24. 在 Welcome 屏幕上按 Next![](img/image00357.jpeg)\n25. 在 Typing（输入）屏幕上，按 Next。\n26.\
  \ 在 Privacy（隐私）屏幕上，按 Next。\n27. ![](img/image00359.jpeg)探索桌面组件\n\n在带有 GUI 的服务器上，`GNOME`\
  \ 是默认桌面。`GNOME` 提供了易用的 GUI 体验。在本章中，我们将探索桌面界面。\n\n### 顶部栏 (TOP BAR)\n\n顶部栏有四个主要部分![](img/image00360.jpeg)\n\
  \n* Activities（活动）\n* Application menu（应用程序菜单）\n* Clock（时钟）\n* System Menu（系统菜单）\n\
  \n![](img/image00361.jpeg)系统菜单\n\n栏右角有电源、扬声器、网络、电池和蓝牙图标。点击这些任何图标都会打开系统菜单。系统菜单允许您调整扬声器和麦克风量。此菜单还提供了调整网络和蓝牙设置的选项。您将找到系统设置、锁定屏幕和关机菜单的快速链接。\n\
  \n### 时钟\n\n在栏的中心位置有一个时钟，默认情况下显示星期和 24 小时制的当前时间。如果您需要，可以在系统设置中更改时间格式。点击时钟打开对话框，右侧显示日历，左侧显示任何任务通知。![](img/image00362.jpeg)\n\
  \n### Activities\n\n顶部栏左侧是 Activities 按钮。点击此按钮打开概览屏幕。您可以使用键盘上的 `Super` 键（也称为 `Windows`\
  \ 键）打开活动概览。活动屏幕提供以下项目\n\n* Search Bar（搜索栏）。\n* ![](img/image00363.jpeg)Windows Peak\
  \ View（窗口预览）。\n* Workspaces（工作空间）\n\n### Search Bar\n\n活动概览屏幕的主要项目之一是搜索栏。通过搜索栏，可以在计算机上搜索应用程序、文档、设置、日历事件等。例如，如果在搜索栏中输入\
  \ calculator，它将显示计算器应用程序。![](img/image00364.jpeg)点击图标打开计算器应用程序。\n\n### Windows Peak\
  \ View\n\n![](img/image00365.jpeg)活动概览的第二个项目是所有运行应用程序的预览。点击所需的应用程序窗口以切换应用程序。要关闭任何正在运行的应用程序窗口，悬停在窗口上并点击\
  \ `X` 按钮。![](img/image00366.jpeg)工作空间\n\n\n\n\n“活动”（Activities）概述屏幕的左侧显示工作空间列表。工作空间是用于更好地管理窗口的虚拟桌面。你可以创建多个工作空间。工作空间旨在减少单个桌面上的混乱，并使桌面更易导航。\n\
  \n点击工作空间可切换工作空间。要将应用程序移动到不同的工作空间，只需将运行中的应用程序拖到新工作空间即可。\n\n### Dash（启动器）\n\n![](img/image00367.jpeg)![](img/image00368.jpeg)\n\
  桌面的左侧你会发现 Dash 栏。Dash 提供了访问收藏和运行中应用程序的途径。点击 Dash 栏上的应用程序图标可打开该程序。图标底部的小点表示该程序正在运行。点击任何运行中的应用程序图标将带出该程序最近的窗口。\n\
  \n右键点击图标打开打开菜单。从此菜单中，你可以打开新窗口或选择运行中应用程序的任何窗口。你还可以从此菜单将任何应用程序添加到收藏或从收藏移除。\n\n## Grid（网格）\n\
  \n![](img/image00369.jpeg)\n在 Dash 栏底部有一个网格图标。点击此图标将显示所有应用程序和常用应用程序的列表。图标以网格格式排列，从网格底部，你可以在所有应用程序和常用应用程序之间切换。应用程序列表可以跨多个页，要导航到下一页，请使用鼠标（中间）滚轮或点击网格右侧的点。\n\
  \n网格中的某些应用程序包含在应用程序文件夹中。点击应用程序文件夹将列出包含所有应用程序的网格。\n\n![](img/image00370.jpeg)\n\n\
  ![](img/image00371.jpeg)\n\n## 应用程序菜单\n\n位于“活动”按钮旁边，应用程序菜单显示活动应用程序的名称。还提供了特定于活动应用程序的其他选项。\n\
  \n## 系统设置\n\n![](img/image00372.jpeg)![](img/image00373.jpeg)\n点击系统菜单中的系统设置图标将打开系统和硬件的设置窗口。设置界面有两个窗格，左窗格显示设置列表，右窗格提供所选设置的说明。你可以使用鼠标滚轮滚动设置列表。假设你想更改桌面背景。点击左窗格中的“背景”，并在右窗格的可用壁列表中选择壁纸。\n\
  \n系统设置工具的顶部栏还设有搜索按钮。搜索按钮允许你搜索与设置相关的任何内容。假设你想查找日期时间设置，只需按下搜索按钮并输入“日期”。系统将在左窗格中显示与日期相关的项目列表。\n\
  \n![](img/image00374.jpeg)\n\n## 注销\n\n完成任务后，注销系统是一个好习惯。注销选项会关闭用户在当前会话启动的所有运行应用程序。要作为当前用户注销，从系统菜单点击用户名。在子菜单中按`Log\
  \ Out`注销）。在确认弹出窗口中再次按注销。\n\n## 锁屏\n\n![](img/image00375.jpeg)\n当你离开电脑一段时间时，建议锁定屏幕，以免在你不在时无人可以使用你的电脑。当系统屏幕处于锁定状态时，所有运行的应用程序将继续运行。要重新登录，提供你的登录密码解锁屏幕。如果你离开电脑一段时间，系统也会锁定屏幕。\n\
  \n要手动锁定屏幕，点击顶部栏右侧的系统菜单，点击`Lock`锁定）图标。\n\n要解锁，在锁定屏幕上按`ENTER` 键并提供密码。\n\n![](img/image00376.jpeg)\n\
  \n 关机或重启\n\n要通过 GUI 关机或重启服务器，点击顶部栏右侧的系统菜单，点击`Power Off`关机按钮。在对话框中，按你想要的按钮。\n\n![](img/image00377.jpeg)\n\
  \n## 窗口\n\nGnome 使用窗口显示你运行的应用程序。这是实现多任务的方法之一。每当你启动任何应用程序时，它都会在新窗口中打开。在这一部分，我们将探索窗口操作。\n\
  \n### 列出窗口\n\n要显示所有运行的窗口，只需点击“活动”按钮。从窗口列表中按鼠标左键选择任何窗口。\n\n### 切换窗口\n\n你可以使用键盘切换窗口，按`Super`\
  \ + `TAB` 打开窗口切换器。按住`Super` 键，释放并按`TAB` 键在打开的窗口之间循环。\n\n![](img/image00378.jpeg)\n\
  请注意：在使用 Linux 时，`Super` 键是 Windows 键的名称。\n\n### 最大化和取消最大化窗口\n\n你可以最大化窗口以在整个桌面查看其内容，并取消最大化或还原窗口以恢复到正常大小。\n\
  \n#### 最大化窗口\n\n要最大化窗口，按并按住窗口标题栏上的鼠标左键以获取窗口标题栏，现在将其拖到顶部栏。最大化的另一种方法是在窗口标题栏上双击鼠标左键。使用键盘最大化窗口请按`Alt`\
  \ + `F10`。\n\n#### 取消最大化窗口\n\n要将窗口恢复到正常大小，获取窗口标题栏并将其拖离顶部栏，或直接双击窗口标题栏。在键盘上按`Alt`\
  \ + `F10` 使用键盘取消窗口的最大化。\n\n### 平分窗口（贴靠窗口）\n\n![](img/image00379.jpeg)\n为了复制文件或比较两个窗口的内容，你可以将两个窗口并排。在\
  \ Microsoft windows 中，此功能被称为窗口贴靠（Snap）。要将窗口贴靠左侧，按`Super` + `left Arrow`；要将窗口贴靠屏幕右侧，选择窗口并按`Super`\
  \ + `right Arrow`。使用鼠标贴靠窗口，获取窗口标题栏并拖到左侧或右侧。\n\n### 切换工作空间\n\n![](img/image00380.jpeg)\n\
  工作空间是虚拟桌面。它就像在同一个桌面上有多个显示器。如果你同时处理多个应用程序，工作空间是组织它们的好选择。要将一个应用程序从当前工作空间移动到另一个工作空间，按“活动”查看窗口和工作空间列表。获取标题栏从右侧的工作空间列表中移动到新工作空间。\n\
  \n要切换到工作空间，点击“活动”并选择工作空间，或按`Super` + `Page Down` 和`Super` + `Page Up`。\n\n\n\n\n\
  终端（Terminal）是输入命令的设备。Bash 使用终端与用户进行交互。终端（Terminal）一词来自 Unix 显示设备。Oracle Linux 默认安装提供\
  \ 6 个虚拟控制台。这些终端在操作服务器时提供了几乎相互独立的 shell 环境。虚拟控制台提供了另一种访问 shell 的方式。你可以通过按下键盘上的 `Alt`\
  \ + `Ctrl` + `功能键` 来切换虚拟终端。第一个终端从键盘上的 `F1` 键到 `F6` 键开始。假设你想切换到终端 3，请按 `Ctrl` + `Alt`\
  \ + `F3` 键。如果你安装了带有 GUI 的服务器，那么前两个虚拟控制台是可用的图形用户界面，可以通过 `Ctrl` + `Alt` + `F1` 和 `Ctrl`+`Alt`\
  \ + `F2` 键访问，其余四个虚拟控制台可以使用 `Ctrl` + `Alt` 键一直到 `f6`![](img/image00381.jpeg)\n\n\
  ## Gnome Terminal\n\nGnome terminal 是一个 GNOME 桌面环境的终端模拟器。它在 GUI 环境中提供终端环境。\n\n###\
  \ 打开 Gnome 终端\n\n点击“活动”（Activities），在搜索栏中输入 `terminal` 并点击终端图标![](img/image00382.jpeg)\n\
  \n### 快捷键\n\n以下是一些可以在 bash shell 中使用的基本快捷键。\n\n| 键盘快捷键 | 任务 |\n| :--- | :--- |\n\
  | `Ctrl +a` | 将光标移动到命令提示符的开头 |\n| `Ctrl + e` | 将光标移动到命令提示符的末尾 |\n| `Ctrl + u` |\
  \ 清空当前行 |\n| `鼠标中键点击` | 粘贴选中的文本 |\n| `Tab` | 补全命令 |\n| `上 / 下方向键` | 显示命令历史 |\n|\
  \ `Ctrl +c` | 终止当前进程 |\n| `Ctrl + z` | 挂前台进程 |\n| `Ctrl + d` | 关闭终端™ |\n\n## 命令\n\
  \n让我们探索一些基础且重要的命令。\n\n### Tab 补全\n\nbash shell 的主要亮点之一是 Tab 补全。当你部分写完命令后按下 `tab`\
  \ 时，系统会自动完成该命令。如果有多个具有相同字符串的命令，它将显示命令列表。不仅是命令，它还能补全文件名。\n\n示例：\n`hostna<tab>`\n\
  `cat /etc/grou<tab>`\n\n`history`\n列出之前使用过的命令。\n示例：\n`history`\n\n统计行数\n`wc -l`\n\
  \n`date`\n打印或更改系统日期和时间。\n语法：\n`date`\n用于检查日期。\n设置日期：\n`date -s \"24 feb 2017 19:00\"\
  `\n\n`echo`\n在终端上打印文本。\n语法：\n`echo text`\n示例：\n`echo hello`\n\n## 远程访问终端\n\n到目前为止，我们是在本地访问服务器上的终端，但情况下服务器位于数据中心，你对服务器的访问权限可能是有限的。因此，我们通常远程访问\
  \ Linux 服务器。在本节中，将学习如何在你的 Linux 或 Windows PC 上远程访问 Linux 终端。\n\n要远程访问服务器，我们需要两个软件：一个在服务器上，另一个在客户端上。远程访问\
  \ Linux 服务器最常用的工具是：\n\n* `telnet`\n* `ssh`\n\n### Telnet\n\nTelnet 是一种旧的软件，以明文格式传输数据，因此使用不安全。由于安全考虑，服务器默认不提供\
  \ telnet。如果你有特殊需求，仍然安装并使用它。\n\n#### 安装 telnet 服务器\n```bash\nyum install telnet-server\n\
  ```\n\n#### 启动 telnet 服务器\n```bash\nsystemctl start telnet.socket\n```\n\n#### 启用\
  \ telnet 服务器\n```bash\nsystemctl enable telnet.socket\n```\n\n#### 在远程机器上\n####\
  \ 安装 telnet 客户端\n```bash\nyum install telnet\n```\n#### 运行客户端进行连接\n语法：\n`telnet\
  \ IP 地址 端口`\n示例：\n`telnet 192.168.0.1 8080`\n\n### ssh\n\n`ssh` 是远程访问终端的现代软件。它以加密格式传输数据，即使在安全性不低的网络上也是安全的。SSH\
  \ 有两部分：`sshd` 是运行在服务器上的服务器守护进程，`ssh client` 是运行在客户端 PC 上的。\n\n#### 检查 ssh 服务器状态\n\
  ```bash\nsystemctl status sshd\n```\n\n#### 在 Linux 客户端上访问终端\n如果你使用 Ubuntu 或 oracle\
  \ 作为 Linux 客户端 PC，可以按照以下步骤访问终端：\n\n1. 在 Linux 客户端上打开终端。\n2. 在命令窗口中。\n3. `ssh 用户@服务器的\
  \ IP 地址`\n示例：\n`ssh root@192.168.100.47`\n4. 输入用户的密码。\n\n#### 在 MS Windows 上访问终端\n\
  要在 Windows 机器上访问终端，你需要名为 `putty` 的第三方软件。putty 是免费软件。你可以从 putty 网站下载软件：\n\n1. 打开网站：`https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html`](Images/image00383.jpeg)\n\
  2. 在此站点选择 64 位 msi windows 安装程序下载。\n3. 安装下载的软件![](img/image00384.jpeg)\n安装后![](img/image00385.jpeg)\
  \ 在你的主机系统上打开 `PuTTY`，在 Host Name（主机名）字段中输入。\n\n\n\n\n将文件的前 10 行打印到标准输出。你也可以指定要显示的行数。\n\
  \n#### 语法\n`head option file`\n\n#### 示例\n```bash\nhead -20 /etc/passwd\n```\n显示\
  \ `passwd` 文件的前 20 行。\n\n### tail\n将文件的最后 10 行打印到标准输出。你也可以指定要显示的行数。\n\n#### 语法\n\
  `tail option file`\n\n#### 示例\n```bash\ntail -20 /var/log/logfile\n```\n它将显示最后 20\
  \ 行\n\n### 使用 tail 持续监控文件\n```bash\ntail -f /var/log/logfile\n```\n它将显示增长文件的末尾。按\
  \ `Ctrl +c` \n\n## 复制文件和目录\n\n### 复制文件\n#### 语法\n`cp filename target_dir`\n\n####\
  \ 示例\n```bash\ncp abc.txt /home/user1/.\n```\n\n### 复制多个文件\n#### 语法\n```bash\ncp\
  \ * /target-location/.\n```\n#### 示例\n```bash\ncp *.txt /home/user/.\n```\n这将所有以\
  \ `txt` 扩展的文件复制到 `/home/user1` 目录\n\n### 在任何覆盖前提示\n```bash\ncp –i /home /home1\n\
  ```\n\n### 强制复制文件\n```bash\ncp –f /tmp/abc.txt /backup/.\n```\n\n### 不覆盖现有文件，而是静默地不操作\n\
  ```bash\ncp -n * /backup/.\n```\n\n### 复制目录\n#### 语法\n`cp -R source_dir target_dir`\n\
  \n#### 示例\n```bash\ncp -R user1 user2\n```\n将 `user1` 目录复制到 `user2`\n\n## 删除文件和目录\n\
  \n### 删除文件\n要删除文件或目录，你可以使用 `rm` 命令。\n\n#### 语法\n`rm file_name`\n\n#### 示例\n```bash\n\
  rm abc.txt\n```\n要删除目录及其所有内容，包括任何子目录和文件：\n```bash\nrm -r /example\n```\n请非常小心地使用此命令，可能会导致数据丢失\n\
  \n### 删除目录\n#### 语法\n`rmdir directory`\n\n#### 示例\n```bash\nrmdir /example\n```\n\
  \n## 列出文件和目录\n\n### ls\n列出文件和目录名。\n\n#### 语法\n`ls -<options>`\n\n### 列表\n```bash\n\
  ls -l\n```\n显示文件或目录列表，包含大小、修改日期、修改时间和权限。\n\n### 同时显示隐藏文件和目录\n```bash\nls -la\n```\n\
  \n### 显示人类可读格式\n```bash\nls -lh\n```\n\n### mv\n`mv` 命令用于将文件从一个位置移动到另一个位置。你也可以使用\
  \ `mv` 命令在不移动文件的情况下重命名。\n\n### 移动文件\n#### 语法\n`mv filename destination_directory`\n\
  \n#### 示例\n```bash\nmv a.txt /tmp/.\n```\n它将 `a.txt` 文件从当前目录移动到 `/tmp` 目录\n\n###\
  \ 重命名\n#### 语法\n`mv filename newfilename`\n\n#### 示例\n```bash\nmv a.txt b.txt\n\
  ```\n\n### grep\n在一个或多个文件中搜索字符串。显示包含该字符串的每一行。\n\n#### 语法\n`grep string file`\n\n\
  #### 示例\n```bash\ngrep '127.0.0.1' /etc/hosts\n```\n\n### diff\n比较两个文件。\n\n####\
  \ 语法\n`diff First_file Second_file`\n\n#### 示例\n```bash\ndiff abc.txt bbc.txt\n\
  ```\n\n### file\n确定文件类型\n\n#### 语法\n`file file_name`\n\n#### 示例\n```bash\nfile bbc.txt\n\
  ```\n\n## 链接文件和目录\n链接类似于 Windows 中的快捷方式，指向原始文件。链接有两种类型：\n\n* 硬链接 (Hard link)\n*\
  \ 软链接 (Soft link)\n\n硬链接软链接都是文件的快捷方式。软链接可以于不同的文件系统中，而硬链接只能存在于同一个文件系统中。当你删除原始文件时，软链接将停止工作，而硬链接不受影响。这是因为在硬链接的情况下，原始文件和硬链接都指向同一个\
  \ inode。\n\n### 创建软链接\n#### 语法\n`ln -s /source/file_name /target/file_name`\n\n\
  #### 示例\n```bash\nln -s /home/admin/abc.txt /abc1.txt\n```\n\n### 创建硬链接\n#### 语法\n\
  `ln file_name /target/file_name`\n\n#### 示例\n```bash\nln /home/admin/abc.txt /home/admin/abc1.txt\n\
  ```\n\n## 第 8 章 网络\n\n在本章中，我们将讨论网络部分。主要有两种类型的网络： \n\n### 非 IP 网络\n非 IP 网络利用传输层进行通信。非\
  \ IP 网络的一个示例是 InfiniBand。\n\n### IP 网络\nIP 网络是使用 IP 地址进行通信的网络。作为 IP 网络部分的每个设备都应该有一个\
  \ IP 地址。IP 网络是最常见的网络类型。家庭、办公室和互联网大部分使用 IP 网络。\n\n对于 IP 网络，你有选项选择地址分配机制。有两种 IP 地址分配机制可用。\n\
  \n#### 静态\n静态 IP 地址是手动为设备分配 IP 地址的模式。在静态 IP 地址分配的情况下，除非你更改，否则 IP 地址将保持不变。这种 IP 地址分配主要用于小型网络或共享设备（如服务器、打印机等），你希望每次都使用相同的\
  \ IP 地址。\n\n#### 动态 IP 地址：\n动态 IP 地址配置是地址的自动配置。它使用 `DHCP` 服务器为你的设备获取 IP 地址。当你配置\
  \ `DHCP` 服务器时，你分配一个 IP 地址范围给客户端。当你启动设备时，它会连接到 `DHCP` 服务器获取 IP 地址。每次启动设备时，你可能会获得不同的\
  \ IP 地址，除非你根据设备的 `MAC` 地址预留 IP 地址。动态 IP 配置对于大型组织是理想的，因为无法记住分配给每个设备的地址。但对于希望每次使用相同\
  \ IP 地址的服务器和打印机，DHCP 并不是理想解决方案。\n\n### 配置网络\n默认情况下，Oracle Linux 8 使用 `NetworkManager`\
  \ 来配置和管理网络连接。要使用 `NetworkManager` 配置网络接口，请使用以下工具之一：\n\n| 工具 | 说明 |\n| :--- | :---\
  \ |\n| `nmtui` | 基于文本的用户界面用于管理网络。此工具在非 GUI 环境下非常有用。 |\n| `GNOME Networkmanager`\
  \ | 用于网络管理的图形工具。 |\n| `nmcli` | 命令行工具。 |\n\n### 设备命名规范\n接口名称以基于接口类型的双字符前缀开头：\n\n\
  | 设备类型 | 前缀 |\n| :--- | :--- |\n| 以太网 | `en` |\n| 无线 | `wl` |\n| 广域网 | `ww` |\n\n\
  为了保持设备名称持久性，Oracle Linux 对以太网使用了以下命名规范：\n\n| 设备类型 | 设备名称 |\n| :--- | :--- |\n| 板载设备\
  \ | `enoX`，X 是设备编号 |\n| PCIe 设备 | `ensX`，X 是设备编号 |\n| 多端口设备 | `enpZsX`，Z 是物理端口，X\
  \ 是设备编号 |\n| 传统命名 | `ethX`，X 是设备编号 |\n\n传统命名 `ethX` 用于旧版本中的网络设备。新的命名规范提供了以下几点：\n\
  1. 跨重启保持接口名称的稳定。\n2. 在硬件添加和删除后保持接口名称的稳定。\n\n### 使用 NetworkManager 的优势\n1. 为所有应用程序同步并更新网络状态。\n\
  2. 更容易的网络管理。\n3. 各种用于网络管理的工具。\n4. 简单且灵活的 Wi-Fi 管理。\n\n### 网络管理器脚本\n默认情况下，`NetworkManager`\
  \ 按字母顺序执行 `/etc/NetworkManager/dispatcher.d` 目录中的脚本以响应网络事件。每个脚本都应该是 root 拥的可执行文件。\n\
  \n### 使用传统脚本\n默认情况下，Oracle Linux 8 使用 `NetworkManager` 管理网络，但如果需要，你仍然可以使用过时的网络脚本来代替\
  \ `NetworkManager`。\n\n安装脚本：\n```bash\nyum install network-scripts\n```\n\n### nmtui\n\
  `nmtui` 是用于配置网络的文本用户界面 (TUI) 工具。此工具对于没有 GUI 的系统上的网络管理非常有帮助。\n\n启动 nmtui：\n```bash\n\
  nmtui\n```\n\n### 使用 nmtui 设置静态 IP 地址\n在此示例中我们将设置静态 IP 地址。\n1. 启动 `nmtui`\n2. 选择编辑连接。\n\
  3. 从列表中选择连接配置文件并按编辑。\n4. 在编辑连接屏幕上，在 IPv4 配置处按空格键键。\n5. 选择手动。\n6. 按 `TAB` 键并显示。\n\
  7. 在相应字段提供 IP 地址、子网掩码、网关和 DNS。\n8. 滚动到底并确保“自动连接”单选按钮被选中。\n9. 按“确定”。\n10. 选择返回。\n\
  11. 选择激活连接，并按回车。\n12. 从列表中选择连接并按回车激活连接。如果连接已激活，则取消激活并重新激活使更改生效。\n13. 选择返回。\n14.\
  \ 选择退出。\n\n### nmtui 命令\n使用 nmtui 设置主机名\n语法\n\n\n\n\n\n`nmtui hostname new_hostname`\n\
  \n## Example\n```bash\nnmtui hostname Server2\n```\n\n## nmcli\n\n`nmcli` 是一个用于管理网络的命令行工具。`nmcli`\
  \ 可创建、显示、编辑、删除、激活和停用网络连接。`nmcli` 是控制和显示网络设备状态非常有用的工具。\n\n### 列出网络设备及其状态\n#### 语法\n\
  ```bash\nnmcli device\n```\n![](img/image00394.jpeg)\n\n#### 示例\n#### 设备详细信息\n```bash\n\
  nmcli device show\n```\n\n#### 列出连接\n```bash\nnmcli connection show\n```\n\n###\
  \ 激活连接\n#### 语法\n```bash\nnmcli connection up connection_name\n```\n#### 示例\n```bash\n\
  nmcli connection up ens35\n```\n\n### 停用连接\n#### 语法\n```bash\nnmcli connection down\
  \ connection_name\n```\n\n#### 示例\n```bash\nnmcli connection down ens35\n```\n\n\
  ### 更改网络状态\n#### 语法\n```bash\nnmcli networking on/off\n```\n#### 示例\n```bash\nnmcli\
  \ networking off \n```\n\n### 显示主机名\n```bash\nnmcli general hostname\n```\n\n##\
  \ Wifi 网络管理\n### 列出可用 WiFi AP\n```bash\nnmcli device wifi list\n```\n\n### 连接到密码保护的\
  \ Wifi 网络\n#### 语法\n```bash\nnmcli device wifi connect \"SSID\" password \"password\"\
  \n```\n#### 示例\n```bash\nnmcli device wifi connect \"mynetwork\" password \"pa$$w0rd\"\
  \n```\n\n## GNOME GUI 网络管理器\n可以通过顶部栏系统菜单或设置中的两个 GUI 模式控制网络。\n\n### 连接无线连接\n如果系统已连接到无线网络，你将在桌面顶部栏看到\
  \ Wi-Fi 图标，否则请按照以下步骤连接到家庭或办公室无线网络：\n\n1. 点击系统菜单。\n2. 点击“未连接无线网络”以展开折叠菜单。\n3. ![](img/image00395.jpeg)点击“选择网络”。\n\
  4. 将打开新窗口并显示所有可用网络。选择您的 Wi-Fi 网络名称。点击“连接”。\n5. ![](img/image00396.jpeg)![](img/image00397.jpeg)如果网络受密码保护，在密码提示处提供密码并点击“连接”。\n\
  6. 现在您的网络已连接，顶部栏将显示 Wi-Fi 图标。\n\n### 更改 Wi-Fi 密码\n由于某些原因更改了路由器上的 Wi-Fi 网络密码，你必须在系统中也设置相同的密码，否则下次将无法连接。\n\
  \n1. 点击系统菜单。\n2. 点击“已连接无线”打开子菜单。\n3. 点击“更改设置”。\n4. 从可用网络列表中选择您的网络，并点击旁边的齿轮图标。\n\
  5. 在安全设置中更改密码并点击“确定”。\n\n## 有线网络\n连接有线网络非常简单，只需将网线插入电脑。系统将自动为可用网络进行配置。一旦系统连接到有线网络，顶部栏将显示系统指示器。\n\
  \n### 手动配置有线网络\n大多数情况下，有线网络设置是自动的，但在某些情况下你必须手动设置 IP 地址。这种配置被称为静态 IP 地址配置。\n\n####\
  \ 配置静态 IP 地址：\n1. 打开系统菜单。\n2. ![](img/image00398.jpeg)点击“已连接有线”并选择“有线设置”。\n3. 将打开网络设置窗口。\n\
  4. 点击齿轮图标。\n![](img/image00399.jpeg)\n5. 打开有线配置对话框。\n6. 在 `Details` 标签页中，确保勾选了 `Connect\
  \ automatically`。\n7. ![](img/image00400.jpeg)点击 `IPv4` 标签卡。\n1. 点击 `Manual` 单选按钮。\n\
  2. 提供 IP 地址。\n3. 输入 `Netmask` 子网掩码。\n4. 输入 `Gateway` 网关。\n5. DNS\n8. 点击 `Apply`。\n\
  \n## 名称解析\n当你使用主机名而不是 IP 地址连接 Linux 主机时，你有以下选项将主机名解析为 IP 地址。\n\n* 本地文件，即 `/etc/hosts`\n\
  * DNS 服务器\n* NIS\n\n### 本地文件 (/etc/hosts)\n`/etc/hosts` 是存储主机名到 IP 地址映射的文件。它提供了在不使用\
  \ DNS 服务器的情况下解析主机名的能力。如果出于范围或安全原因连接到有限数量的主机，我们通常使用此文件。使用此文件的缺点是，一旦 IP 地址发生变化，管理员必须在所有服务器或\
  \ PC 上更改此文件。\n\n#### 格式\n`IP_address hostname aliases`\n\n#### 示例\n```bash\n127.0.0.1\
  \ server1 localhost\n31::1 server1 localhost\n192.168.228.129 server1server1.example.com\n\
  ```\n\n### DNS\nDNS 服务器是一个中央存储库，包含 IP 地址及其关联主机名的数据库。每当任何客户端想要将主机名解析为 IP 地址而不是使用其本地文件时，它会向\
  \ DNS 服务器发送请求。如果某些客户端的 IP 地址发生变化，你只需要更新 DNS 条目。一个组织内可以有多个 DNS 服务器。为了重定向主机名解析请求，Oracle\
  \ Linux 使用 `/etc/resolve.conf` 文件。默认情况下，Oracle Linux 8 上的 `NetworkManager` 会动态更新\
  \ `/etc/resolv.conf` 文件。但是根据你的需求，你可以通过 `NetworkManager` 禁用 DNS 处理。\n\n## 成组 (Teaming)\n\
  成组允许将多个物理以太网适配器组合到一个逻辑适配器中。该逻辑网络适配器提供更高的吞吐量或冗余。\n\n### 成组模式\n| 模式 | 说明 |\n| :---\
  \ | :--- |\n| 轮询 (Round-robin) | 在此模式下，数据在所有端口之间传输。 |\n| 广播 (Broadcast) | 数据在所有端口传输。\
  \ |\n| 负载均衡 (Load-balance) | 流量在所有网卡之间分配。 |\n| 主备 (Active-backup) | 其中一个链路激活，其余的备用以提供冗余。\
  \ |\n| LACP | 使用 802.3ad 协议进行链路聚合。 |\n\n#### 安装 teaming 包\n```bash\nyum install\
  \ team\n```\n\n#### 创建主备组\n```bash\nnmcli connection add type team con-name bond0\
  \ ifname bond0 mode \"activebackup\"\n```\n\n## 重要网络命令\n### 显示 IP 地址\n```bash\n\
  ip addr\n```\n\n### 显示链路状态\n![](img/0401.jpeg)ip show\n\n### 检查并更改主机名\nLinux 计算机的称为主机名。要更改主机名，可以使用\
  \ `hostnamectl`。\n\n#### 显示当前主机名\n```bash\nhostnamectl\n```\n\n#### 更改主机名\n####\
  \ 语法\n```bash\nhostnamectl set-hostname newname\n```\n#### 示例\n```bash\nhostnamectl\
  \ set-hostname myhost1\n```\n\n### 显示路由表\n```bash\nip route\n```\n\n### 检查网络连通性\n\
  #### 语法\n```bash\nping ipaddress/hostname\n```\n#### 示例\n```bash\nping 192.110.22.121\n\
  ```\n\n如果你感兴趣使用命令行更改 IP 地址，请尝试 `nmcli` 命令。查看更多信息请参考示例命令。\n\n## 网络工具\n（注意：以下工具用于网络诊断）\n\
  \n### dig\nDNS 查询并显示结果\n#### 语法\n```bash\ndig hostname\n```\n#### 示例\n```bash\n\
  dig microsoft.com\n```\n\n### telnet\n连接目标主机:端口。你也可以使用 `telnet` 测试主机和端口的连通性。\n####\
  \ 语法\n```bash\ntelnet hostname port\n```\n#### 示例\n```bash\ntelnet myserver1 8080\n\
  ```\n\n### nslookup\n查询互联网域名服务器\n#### 语法\n```bash\nnslookup hostname\n```\n####\
  \ 示例\n```bash\nnslookup microsoft.com\n```\n\n### scp\n通过网络以安全方式从一个主机复制文件到另一个主机。\n\
  #### 语法\n```bash\nscp filename user@targetserver:/path\n```\n#### 示例\n```bash\n\
  scp ast.txt user1@server2:/home/user1\n```\n\n### ssh\n安全登录目标服务器。\n#### 语法\n```bash\n\
  ssh user@targethost\n```\n#### 示例\n```bash\nssh user1@server2\n```\n\n### nmap\n\
  检查服务器上开启的端口\n#### 语法\n```bash\nnmap hostname\n```\n#### 示例\n```bash\nnmap cloudflare.com\n\
  ```\n\n\n\n\nEXT 文件系统拥有悠久的历史`ext4` 是 `ext` 文件系统家族的第四代。它也是一种日志文件系统。`Ext4` 驱动程序可以读写\
  \ `ext3` 和 `ext2` 文件系统。它支持高达 50 TiB 的文件系统大小。作为一种遗留文件系统`ext4` 文件系统被几乎所有 Linux 应用程序支持。\n\
  \n## XFS 文件系统管理命令\n\n#### 创建 XFS 文件系统\n#### 语法\n```bash\nmkfs.xfs devicename\n```\n\
  #### 示例\n```bash\nmkfs.xfs /dev/sda01\n```\n\n### 调整 XFS 文件系统大小\n你只能扩展文件系统而不能缩小。要增大\
  \ XFS 文件系统请使用:-\n\n#### 语法\n```bash\nxfs_growfs device_name\n```\n## 命令\n此命令将 xfs\
  \ 文件系统扩展到设备的最大限制。\n```bash\nxfs_growfs /dev/sda01\n```\n`-D` 接受文件系统块数作为参数。\n```bash\n\
  xfs_growfs /dev/sda01 -D 200\n```\n\n### 修复 XFS 文件系统\n#### 语法\n```bash\nxfs_repair\
  \ -n device_name\n```\n#### 示例\n```bash\nxfs_repair -n /dev/sda01\n```\n\n## Ext4\
  \ 文件系统管理命令\n\n### 创建 ext4 文件系统\n#### 语法\n```bash\nmkfs.ext4 /dev/device_name\n```\n\
  #### 示例\n```bash\nmkfs.ext4 /dev/sd01\n```\n\n### 为分区标记\n#### 语法\n```bash\ne4label\
  \ device_name new_label\n```\n#### 示例\n```bash\ne2label /dev/sda01 data01\n```\n\
  \n### 调整大小\n你可以在 ext4 文件系统挂载 own 时扩展它。缩小则需要卸载 ext4 文件系统。\n\n#### 语法\n```bash\nResize2fs\
  \ device_name new_size\n```\n#### 示例\n```bash\nResize2fs /dev/sda01\n```\n如果你不指定大小，此命令将文件系统扩展到设备的最大限制。\n\
  要将文件系统更改为特定大小\n```bash\nresize2fs /dev/sda01 5G\n```\n\n## 第 10 章：探索网络文件系统\n\n在上一节中，我们讨论了本地文件系统，然而为了在网络上共享数据，远程文件系统出现了。网络文件系统需要在本地文件系统之上一个额外的层，以便在网络上共享和挂载。网络文件系统可以被多个用户同时使用。一旦挂载，它的行为就像远程机器上的本地文件系统一样。在本章中，我们将介绍\
  \ Oracle Linux 8 上常用的远程文件系统。\n\n### NFS\n`NFS` 是一种文件共享文件系统，基于服务器/客户端模式工作。在服务器上共享的文件系统可以通过网络挂载到客户端上。`NFS`\
  \ 文件系统是 Unix 和 Linux 系统之间非常流行的的文件共享协议。Oracle Linux 服务器同时支持 `NFS` 服务器和客户端。`NFS` 在\
  \ Linux 上对于跨平台文件和文件夹共享非常有用。`NFS` 也是网络附属存储 `NAS` 系统上广泛使用的协议。目前有四个版本的 `NFS`，每个版本都有进一步的发布，例如版本\
  \ 4 有 4.2 版本:-\n\n- `NFS V1`\n- `NFS V2`\n- `NFS V3`\n- `NFS V4`\n\n其中 `NFS V3`\
  \ 和 `NFS V4` 是较新的 `NFS` 版本。在 Oracle Linux 8 中，不再支持基于 UDP 的 NFS。NFSV4 增加了通过防火墙工作的优势并运行在\
  \ TCP 上。在 Oracle Linux 8 中，默认的 `NFS` 版本是 4.2，它具有支持访问控制列表 (`ACLs`)、服务器端复制和稀疏文件的特性。Oracle\
  \ Linux 8 仅支持版本 3 和版本 4 的 `NFS`，Oracle Linux 8 不再支持版本 1 和版本 2\n\n### 安装 NFS\n####\
  \ 安装包\n```bash\nyum install nfs-utils\n```\n安装后，启用服务以便在重启后自动启动。\n```bash\nsystemctl\
  \ enable nfs-server.service\n```\n\n### 启动服务\n```bash\nsystemctl start nfs-server.service\n\
  ```\n此命令将启动 `NFS` 需要的其他服务，如 `nfsd`、`nfs-idmapd`、`rpcbind`、`rpc.mountd`、`lockd`、`rpc.rquotad`、`rpc.statd`\
  \ 和 `rpc.idmapd`。\n\n现在检查服务的状态\n```bash\nsystemctl status nfs-server.service\n```\n\
  \n`NFS` 服务器的重要文件有：\n\n| 文件名 | 用途 |\n| :--- | :--- |\n| `/etc/nfs.conf` | NFS 进程和工具的主配置文件。\
  \ |\n| `/etc/nfsmount.conf` | NFS 挂载的全局配置文件。 |\n| `/etc/exports` | NFS 服务器导出表。 |\n\
  \n#### `/etc/exports` 文件选项\n| 选项 | 描述 |\n| :--- | :--- |\n| `rw` | 允许对文件系统进行读取和写入访问。\
  \ |\n| `sync` | 此选项默认告诉 NFS 服务器仅在最后更改提交后才回复请求。 |\n| `all_squash` | 将所有 `UIDs` 和\
  \ `GIDs` 映射到匿名用户。适用于公共 FTP 目录。 |\n| `root_squash` | 将来自客户端的 `UID/GID` 0 映射到匿名 `UID/GID`。\
  \ |\n| `no_subtree_check` | 此选项禁用子树检查 |\n\n#### 导出目录\n在本示例中，我们将创建两个目录并导出这些目录供客户端挂载。\n\
  ```bash\nmkdir /accounts\nmkdir /hrms\n```\n\n#### 编辑 `/etc/exports` 文件\n```bash\n\
  vi /etc/exports\n```\n添加以下内容：\n```text\n/account 10.101.11.0/24(rw,sync)\n/hrms*(rw.sync)\n\
  ```\n在本示例中，第一行将 NFS 共享到特定的网络 IP 范围。第二行向所有人共享 `hrms` 目录。\n\n#### 导出目录\n```bash\n\
  exportfs -a\n```\n#### 列出导出的目录\n```bash\nexport -s\n```\n#### 添加防火墙规则\n```bash\n\
  firewall-cmd --permanent --add-service=rpc-bind\nfirewall-cmd --permanent --add-service=nfs\n\
  ```\n重载防火墙\n```bash\nfirewall-cmd --reload\n```\n检查服务的状态\n```bash\nfirewall-cmd\
  \ --list-services\n```\n\n\n\n\n\n尽管 GPT 带来了许多优势，但 MBR 仍然是兼容性最好且最广泛使用的分区方案。\n\n\
  在本章中，我们将学习创建、删除和修改各种类型的磁盘分区。\n\n有几个用于分区管理的工具：\n* `parted`\n* `fdisk`\n\n## Parted\n\
  \n`parted` 是一个可以管理分区表的命令行工具。\n\n### 显示分区布局\n语法\n```bash\nparted -l\n```\n此命令将显示所有块设备的分区布局。\n\
  \n### 显示特定块设备的分区表\n语法\n```bash\nparted device print\n```\n示例\n```bash\nparted /dev/sda\
  \ print\n```\n\n### 使用交互模式运行 parted\n输入带设备名称的 `parted` 命令。假设新磁盘为 `sdb`。\n```bash\n\
  parted /dev/sdb\n```\n它将启动交互会话。\n\n### 在磁盘上创建分区表\n启动 `parted`\n语法\n```bash\nparted\
  \ device_name\n```\n其中 `device_name` 是磁盘名称。\n示例\n```bash\nparted /dev/sda\n```\n\
  \n### 创建分区\n语法\n```bash\nmkpart part-type name fs-type start end\n```\n其中：\n| 列\
  \ | 描述 |\n| :--- | :--- |\n| `part-type` | 对于 MBR 分区表，可以是主、逻辑或扩展分区。 |\n| `name`\
  \ | GPT 分区表所需的分区名称。 |\n| `fs-type` | 可以是 `xfs`, `ext2`, `ext3`, `ext4`, `fat16`,\
  \ `fat32`, `hfs`, `hfs+`, `linux-swap`, `ntfs` 或 `reiserfs`。`fs-type` 参数是可选的，因为\
  \ `parted` 不会在分区上创建文件系统。 |\n| `start and end` | 是决定分区起始和结束点的大小。可以使用大小单位后缀，如 `MiB`、`GiB`\
  \ 或 `TiB`。默认大小为兆字节。 |\n\n示例\n```bash\n(parted) mkpart primary xfs 1 5GiB\n```\n\n\
  ### 使用 print 命令列出分区\n```bash\n(parted) print\n```\nModel: VMware, VMware Virtual\
  \ S (scsi)\nDisk `/dev/sdb`: 10.7GB\nSector size (logical/physical): 512B/512B\n\
  Partition Table: msdos\nDisk Flags:\nNumber Start End Size Type File system Flags\n\
  1 1049kB 5369MB 5368MB primary xfs lba\n\n使用 `quit` 命令退出 `parted`。\n```bash\n(parted)\
  \ quit\n```\n信息：你可能需要更新 `/etc/fstab`。\n\n### 使用 parted 删除分区\n在 `parted` 交互会话中选择\
  \ `parted` 设备。\n示例\n```bash\nparted /dev/sdb\n```\n\n### 显示当前分区表\n```bash\n(parted)\
  \ print\n```\nModel: VMware, VMware Virtual S (scsi)\nDisk `/dev/sdb`: 10.7GB\n\
  Sector size (logical/physical): 512B/512B\nPartition Table: msdos\nDisk Flags:\n\
  Number Start End Size Type File system Flags\n1 1049kB 5370MB 5369MB primary lvm\n\
  2 5370MB 7000MB 1631MB primary ext2 lba\n\n使用 `rm` 命令删除分区并选择分区号。\n```bash\n(parted)\
  \ rm\nPartition number? 2\n```\n\n## 使用 fdisk 创建分区\n\n语法\n```bash\nfdisk device\n\
  ```\n在此示例中，我们将在设备 `sdb` 上创建一个 5GB 的分区。\n```bash\nfdisk /dev/sdb\n```\n1. 交互式提示符输入\
  \ `n` 命令创建新分区。\n2. 输入分区类型：`p` 代表主分区，`e` 代表扩展分区。\n3. 选择分区号。按回车使用默认值。\n4. 按回车使用默认起始位置。\n\
  5. 以 `MB`、`GB` 和 `KB` 输入大小，例如 `5G`。\n6. 使用 `p` 命令打印分区。\n7. 可选地，如果你需要更改文件系统，使用 `t`\
  \ 命令并按 `L` 列出文件系统类型。输入 ID，如 Linux 的 `83` 和 LVM 的 `8e`。\n8. 使用 `w` 命令写入更改。\n```bash\n\
  (fdisk) w\n```\n分区表已更改。调用 `ioctl()` 重新读取分区表。正在同步磁盘。\n\n---\n\n#### 本地文件系统管理\n\n\
  在本章中我们将涵盖本地文件系统的管理：\n* 创建文件系统\n* 删除文件系统\n* 挂载文件系统\n* 卸载文件系统\n* 创建 LVM 卷组\n* 删除 LVM\
  \ 卷组\n* 创建逻辑卷\n* 删除逻辑卷\n\n### 创建文件系统\n在创建文件系统之前，你应该决定想要创建哪类型的文件系统。\n\n#### 创建 XFS\
  \ 文件系统\n语法\n```bash\nmksfs.xfs /dev/sdb1\n```\n示例\n```bash\nmksfs.xfs /dev/sdb1\n\
  ```\n\n#### 创建 ext4\n语法\n```bash\nmkfs.ext4 /dev/sdb1\n```\n示例\n```bash\nmkfs.ext4\
  \ /dev/sdb1\n```\n\n### 挂载文件系统\n在 Linux 系统中要使用文件系统，你必须先挂载它。挂载至少需要两个要素：挂载设备和挂载点。\n\
  \n#### 挂载设备\n挂载设备是你想要用于数据的块设备或远程文件系统。\n\n列出所有块设备\n```bash\nlsblk\n```\n可以通过以下标识符识别挂载文件系统：\n\
  * `UUID`：设备的通用唯一标识符。这是挂载设备的最佳方式，因为 UUID 保持不变。你可以使用 `blkid` 命令获取设备的 UUID。\n* `Device\
  \ name`：设备的路径名称，例如 `/dev/sdb1`。\n* `Label`：标签，例如 `LABEL=data1`。你可以使用 `e2label` 查看或更改\
  \ ext 文件系统的标签。使用 `xfs_admin` 命令设置或列出 XFS 文件系统的标签。\n\n#### 挂载点\n挂载点是访问该挂载设备的链接。挂载点是一个普通目录。一旦挂载，设备成为该目录的一部分，你可以在此目录下访问文件系统的内容。\n\
  \n#### mount 命令\n`mount` 命令用于挂载文件系统。\n\n语法\n```bash\nmount -t type -o options dir\n\
  ```\n挂载文件系统需要以下参数：\n* `type`：文件系统类型，可以是 `xfs`, `ext4`, `nfs` 等。\n* `options`：选项，如\
  \ `rw`（读写）、`ro`（只读）、`loop`（ISO 质）。\n* `device`：设备名称。\n* `dir`：挂载点。\n\n示例\n```bash\n\
  mount -t ext4 /dev/sdb1 /mnt\n```\n\n### 自动挂载\n如果你希望文件系统在每次启动时自动挂载，可以使用 `/etc/fstab`\
  \ 文件。\n\n`fstab` 文件的格式如下：\n`firstsecond third fourth fifth sixth`\n\n| 字段 | 描述 |\n\
  | :--- | :--- |\n| 第一 | 块设备或远程文件系统 |\n| 第二 | 挂载点 |\n| 第三 | 文件系统类型 |\n\n\n\n\n\n\
  | 级别 | 描述 |\n| :--- | :--- |\n| 第四 | 选项，至少包含 `ro` 或 `rw`。其他选项为默认值：`rw`,`suid`,`dev`,`exec`,`auto`,`nouser`\
  \ 和 `async`。`noauto`：不要自动挂载或通过 `mount -a` 命令挂载。`user`：允许用户挂载文件系统。`owner`：允许所有者挂载。\
  \ |\n| 第五 | 备份选项，默认 `0` 表示不备份。 |\n| 第六 | `fsck` 的文件系统检查优先级。 |\n\n#### 示例\n\n```\n\
  /dev/mapper/cl-root/ xfs defaults 0 0\nUUID=095af347-cb2c-4d50-99b6-xxx/boot ext4\
  \ defaults 1 2\n/dev/mapper/cl-swap swap swap defaults 0 0\nLABEL=data1/data1 ext4\
  \ defaults 0 0\n/dev/sdb2/data2 xfs defaults 0 0\n```\n\n## 使用 auto 选项手动挂载 fstab\
  \ 中的所有设备\n```bash\nmount -a\n```\n\n## 手动挂载 fstab 中的单个设备。\n#### 语法\n```bash\nmount\
  \ mount_point\n```\n无需指定设备名称。\n\n#### 示例\n```bash\nmount /data2\n```\n\n## 列出所有已挂载的文件系统\n\
  ```bash\nmount\nor\nfindmnt\n```\n\n## 列出特定文件系统类型\n```bash\nfindmnt -t xfs\n```\n\
  \n## 卸载文件系统\n#### 语法\n```bash\numount mount_point\n```\n#### 示例\n```bash\numount\
  \ /data1\n```\n如果在卸载文件系统时遇到“target is busy”错误，请使用 `fuser` 命令列出所有使用该文件系统的进程。\n\n\
  #### 语法\n```bash\nfuser --mount mountpoint\n```\n#### 示例\n```bash\nfuser --mount\
  \ /data1\n```\n\n## 删除文件系统\n要删除文件系统，我们必须先卸载它。\n#### 示例\n```bash\numount /dev/sda2\n\
  ```\n然后我们可以使用 `fdisk` 或 `parted` 从分区表中删除分区。\n\n#### 示例\n```bash\nfdisk /dev/sda2\n\
  ```\n选择选项 `d` 来删除分区。\n通过选择 `w` 将更改写入分区表。\n\n## 第 13 章：逻辑卷管理\n\nLVM 或 `Logical Volume\
  \ Manager`（逻辑卷管理器）允许创建磁盘和分区组，并将其作为一个磁盘使用。它在物理设备和逻辑设备之间创建了一个抽象层。LVM 的优势如下：\n\n- **灵活性**：允许调整大小。\n\
  - **快照**：对逻辑卷进行时间点快照。\n\n传统的磁盘设置如下：\n\n| 文件系统 | / | /opt | /home |\n| :--- | :---\
  \ | :--- | :--- |\n| 分区 | `/dev/sda1` | `/dev/sda2` | `/dev/sda3` |\n| 物理设备 | `/dev/sda`\
  \ | `/dev/sdb` | |\n\n这种设置是磁盘，然后是分区，在分区之上是文件系统。\n\n## LVM 设置\n\n| 文件系统 | / | /home\
  \ | /var |\n| :--- | :--- | :--- | :--- |\n| 逻辑卷 | `/dev/sda1` | `/dev/sda2` | `/dev/sda3`\
  \ |\n| 卷组 | `Vg01` | | |\n| 物理卷 | `/dev/sda` | `/dev/sdb` | |\n\n### 物理卷\n物理卷（`PV`）是底层的物理存储单元。物理存储是块设备，如分区或整个磁盘。使用\
  \ `pvcreate` 命令将物理设备作为物理卷。如果块设备是分区，在使用 `pvcreate` 命令之前，请使用 `fdisk` 将分区类型更改为 `8e\
  \ (Linux LVM)`。\n\n### 创建 PV\n#### 语法\n```bash\npvcreate device\n```\n#### 示例\n\
  ```bash\npvcreate /dev/sdb\n```\n### 如果设备是分区\n#### 将分区类型更改为 LVM\n```bash\nfdisk\
  \ /dev/sda (参考分区章节来更改分区类型)\n```\n#### 现在创建 PV\n```bash\npvcreate /dev/sda3\n```\n\
  \n## 卷组\n一个或多个物理卷组合成一个卷组（`VG`）。卷组是一个抽象，它将底层设备呈现为一个统一的逻辑设备，具有物理卷组合后的存储容量。\n\n###\
  \ 创建物理卷\n注意：文本中写的是“创建物理卷”，但提供的是 `vgcreate` 的语法。\n#### 语法\n```bash\nvgcreate vgname\
  \ PV1 PV2 ..\n```\n#### 示例\n```bash\nvgcreate vg01 /dev/sdb /dev/sdc\n```\n\n##\
  \ 逻辑卷\n逻辑卷是卷组的逻辑分区。逻辑卷可用于创建文件系统。在某些情况下，你也可以将 `LV` 作为块设备使用。\n\n### 创建 LV\n#### 语法\n\
  ```bash\nlvcreate -n name -L size VG_name\n```\n#### 示例\n```bash\nlvcreate -n data_lv\
  \ -L 5G vg01\n```\n\n## 文件系统\n### 在 LV 上创建 XFS 文件系统\n#### 语法\n```bash\nmkfs.xfs\
  \ lv_name\n```\n#### 示例\n```bash\nmkfs.xfs /dev/vg01/data_lv\n```\n### 在 LV 上创建\
  \ ext4 文件系统\n#### 语法\n```bash\nmkfs.ext4 lv_name\n```\n#### 示例\n```bash\nmkfs.ext4\
  \ /dev/vg01/data_lv\n```\n\n## LVM 中两个值得注意的术语\n- **物理区 (Physical Extent)**\n- **逻辑区\
  \ (Logical Extent)**\n\n### 物理区\n物理卷空间被划分为固定大小的单元，称为物理区，它是可以分配的最小单元。`P.E.` 大小对于同一\
  \ `VG` 中的所有物理卷都是相同的。\n\n### 逻辑区\n`PE` 的映射形成了 LVM 的前端。默认情况下，一个 `PE` 映射到一个 `LE`。但在镜像的情况下，你可以将多个\
  \ `PE` 映射到一个 `LE`。\n\n\n\n\n使用此命令扩展 LV 以使用 VG 的 100% 空闲空间，并扩展文件系统。\n\n```bash\n\
  lvextend -l +100%FREE -r vg01/lv-root\n```\n\nLVM 章节结束。\n\n第 14 章\n\n## 软件管理\n\n\
  Oracle Linux 发行版基于 RPM 包。Oracle Linux 使用 `rpm` 命令通过 `.rpm` 包安装软件。RPM 包仅仅是一个包含某些文件和关于这些文件信息的文件。从技术上说，RPM\
  \ 是一个包含 `cpio` 归包及其自身元数据的文件。RPM 头部包含元数据，这些元数据用于确定有关软件包的以下信息：\n\n- 软件包描述。\n- 软件包中的文件列表。\n\
  - 软件包的版本和发布版本。\n- 制作时间和及制作者。\n- 支持的架构。\n- 软件包中包含的文件的校验和。\n- 依赖关系。\n等……\n\n## 软件包管理系统\n\
  \n如果你尝试手动安装单个软件包，必须首先安装它所有的依赖项，并跟踪版本。为了方便软件管理，Linux 公司开发了一套名为软件包管理系统或包管理器的系统。软件包管理系统安装预编译的包，这些包以包含软件二进制文件、配置文件和依赖关系信息的归档形式存在。软件包管理系统是一系列用于自动化软件包安装、升级和删除过程的软件工具。软件管理器维护自己的软件依赖关系版本信息数据库。软件包管理系统有助于防止软件不匹配和缺少前提。Oracle\
  \ Linux 使用 `YUM` 工具进行软件包管理。\n\n### YUM\n\n与其他 Linux 发行版一样，Oracle Linux 使用了名为 `YUM`\
  \ 的非常全面的软件包管理系统。Yellow dog Updater Modifier 是一个用于软件包管理的命令行工具。`Yum` 使用仓库来获取与你的系统兼容的特定软件包正确版本。`yum`\
  \ 允许软件包的自动更新和依赖管理。当你使用 `yum` 命令安装软件时，它会自动从定义的仓库下载软件包及其所有依赖项。Oracle Linux 版本 8 使用\
  \ `YUM v4` 代替了早期版本使用的 `YUM v3`。基于 `DNF` 技术的 `YUM v4` 工具具有以下优势：\n\n- 更好的性能\n- 支持模块化内容（我们稍后将讨论模块）\n\
  - 用于与工具集集成的稳定 API\n\nOracle Linux 8 有三个应用流，每个流都有自己的生命周期：\n\n- `BaseOS` 提供基础操作系统，\n\
  - `AppStream` 提供用户应用，\n- `CodeReady Linux Builder` 提供开发者工具和语言。\n\n## 软件包管理\n\n###\
  \ 搜索软件包\n#### 语法\n```bash\nyum search package_name\n```\n#### 示例\n```bash\nyum search\
  \ httpd\n```\n\n### 显示软件包信息\n#### 语法\n```bash\nyum info package_name\n```\n####\
  \ 示例\n```bash\nyum info httpd\n```\n\n### 列出可用软件包\n```bash\nyum list available\n\
  ```\n\n### 从默认流安装软件包\n#### 语法\n```bash\nyum install package_name\n```\n#### 示例\n\
  ```bash\nyum install httpd\n```\n\n### 安装本地下载的软件包\n#### 语法\n```bash\nyum localinstall\
  \ package.rpm\n```\n#### 示例\n```bash\nyum localinstall abc.rpm\n```\n\n### 移除软件包\n\
  #### 语法\n```bash\nyum remove package_name\n```\n#### 示例\n```bash\nyum remove httpd\n\
  ```\n\n### 更新\n\n### 更新特定软件包\n#### 语法\n```bash\nyum update package_name\n```\n####\
  \ 示例\n```bash\nyum update vsftpd\n```\n\n### 更新整个系统\n将系统更新到最新级别\n```bash\nyum -y\
  \ update\n```\n\n#### 仅更新安全补丁\n```bash\nyum -y update --security\n```\n此命令可能会增加系统的次版本号，在某些情况下并非必须，此时你可以使用更保守的方法进行安全更新。\n\
  ```bash\nyum update-minimal --security -y\n```\n\n### CVE\n常见漏洞与暴露（Common Vulnerabilities\
  \ and Exposures）是一个常见标识符列表。\n\n### 查看 CVE 信息\n#### 语法\n```bash\nyum infoinfo CVE-ID\n\
  ```\n#### 示例\n```bash\nyum infoinfo CVE-2021-12345\n```\n（示例 ID）\n\n### 列出包含 CVE\
  \ 的软件包\n#### 语法\n```bash\nyum list list CVE-ID\n```\n#### 示例\n```bash\nyum list\
  \ list CVE-2021-XXXX\n```\n\n### 更新 CVE 软件包\n#### 语法\n```bash\nyum update CVE-ID\n\
  ```\n#### 示例\n```bash\nyum update CVE-2021-XXXX\n```\n\n#### 仅更新 CVE 安全更新\n####\
  \ 语法\n```bash\nyum update --security CVE-ID\n```\n#### 示例\n```bash\nyum update --security\
  \ CVE-2021-XXXX\n```\n\n### 搜索 CVE\n#### 语法\n```bash\nyum search CVE-ID\n```\n####\
  \ 示例\n```bash\nyum search CVE-2021-XXXX\n```\n\n### 安装特定 CVE 软件包\n#### 语法\n```bash\n\
  yum install CVE-ID\n```\n#### 示例\n```bash\nyum install CVE-2021-XXXX\n```\n\n####\
  \ 移除 CVE 软件包\n#### 语法\n```bash\nyum remove CVE-ID\n```\n#### 示例\n```bash\nyum remove\
  \ CVE-ID\n```\n\n### 列出已安装的 CVE\n#### 语法\n```bash\nyum list installed CVE-ID\n```\n\
  #### 示例\n```bash\nyum list installed CVE-2021-XXXX\n```\n\n#### 查看 CVE 历史\n####\
  \ 语法\n```bash\nyum history CVE-ID\n```\n#### 示例\n```bash\nyum history CVE-2021-XXXX\n\
  ```\n\n#### 撤滚 CVE\n#### 语法\n```bash\nyum history undo CVE-ID\n```\n#### 示例\n```bash\n\
  yum history undo CVE-2021-XXXX\n```\n\n#### 查看 CVE 详情\n#### 语法\n```bash\nyum history\
  \ info CVE-ID\n```\n#### 示例\n```bash\nyum history info CVE-2021-XXXX\n```\n\n###\
  \ 模块（Modules）\n\n### 搜索模块\n#### 语法\n```bash\nyum module list module_name\n```\n\
  #### 示例\n```bash\nyum module list nodejs\n```\n\n### 列出可用模块\n#### 语法\n```bash\n\
  yum module list\n```\n\n## 模块\n\n如果你尝试手动安装单个软件包，必须首先安装它所有的依赖项，并跟踪版本。为了方便软件管理，Linux\
