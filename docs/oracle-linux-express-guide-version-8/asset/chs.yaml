  \ history undo CVE-2021-XXXX\n```\n\n#### 查看 CVE 详情\n#### 语法\n```bash\nyum history\
  \ info CVE-ID\n```\n#### 示例\n```bash\nyum history info CVE-2021-XXXX\n```\n\n###\
