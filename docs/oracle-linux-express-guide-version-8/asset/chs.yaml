  #### 示例\n```bash\nyum module list nodejs\n```\n\n### 列出可用模块\n#### 语法\n```bash\n\
  yum module list\n```\n\n## 模块\n\n如果你尝试手动安装单个软件包，必须首先安装它所有的依赖项，并跟踪版本。为了方便软件管理，Linux\
  \ 公司开发了一套名为软件包管理系统或包管理器的系统。软件包管理系统安装预编译的包，这些包以包含软件二进制文件、配置文件和依赖关系信息的归档形式存在。软件包管理系统是一系列用于自动化软件包安装、升级和删除软件包过程的软件工具。软件管理器维护自己的软件依赖关系版本信息数据库。软件包管理系统有助于防止软件不匹配和缺少前提。Oracle\
  \ Linux 使用 `YUM` 工具进行软件包管理。\n\n#### 显示模块信息\n#### 语法\n```bash\nyum module info module_name\n\
  ```\n#### 示例\n```bash\nyum module info nodejs\n```\n\n#### 提供特定软件包的模块\n#### 语法\n\
  ```bash\nyum module provides package_name\n```\n#### 示例\n```bash\nyum module provides\
  \ php\n```\n\n#### 安装模块\n#### 语法\n```bash\nyum module install module_name\n```\n\
  #### 示例\n```bash\nyum module install nodejs\n```\n\n#### 启用模块流\n#### 语法\n```bash\n\
  yum module enable module_name:stream\n```\n#### 示例\n```bash\nyum module enable nodejs:12\n\
  ```\n\n#### 禁用模块流\n#### 语法\n```bash\nyum module disable module_name:stream\n```\n\
  #### 示例\n```bash\nyum module disable nodejs:12\n```\n\n#### 重置模块\n#### 语法\n```bash\n\
  yum module reset module_name\n```\n#### 示例\n```bash\nyum module reset nodejs\n```\n\
  \n#### 查看模块状态\n#### 语法\n```bash\nyum module status module_name\n```\n#### 示例\n```bash\n\
  yum module status nodejs\n```\n\n#### 模块历史\n#### 语法\n```bash\nyum module history\
  \ module_name\n```\n#### 示例\n```bash\nyum module history nodejs\n```\n\n#### 撤滚模块操作\n\
  #### 语法\n```bash\nyum module history undo module_name ID\n```\n#### 示例\n```bash\n\
  yum module history undo nodejs 1\n```\n\n\n\n\n# Yum\n\n#### 语法\n```bash\nyum module\
  \ remove module_name:stream/profile\n```\n#### 示例\n```bash\nyum module remove --profile\
  \ nodejs:12/minimal\n```\n\n### 将模块重置为初始状态\n#### 语法\n```bash\nyum module reset module_name\n\
  ```\n#### 示例\n```bash\nyum module reset node\n```\n\n### 禁用模块及其所有流\n#### 语法\n```bash\n\
  yum module disable module_name\n```\n#### 示例\n```bash\nyum module disable nodejs\n\
  ```\n\n# RPM\n使用 `rpm` 进行包管理。\n\n虽然 `yum` 是一个功能强大的软件包管理器，但在某些情况下你必须手动管理 `rpm` 软件包。\n\
  \n### 列出所有已安装包\n```bash\nrpm -qa\n```\n\n### 列出特定的已安装包\n#### 语法\n```bash\nrpm -qa\
  \ |grep package_name\n```\n#### 示例\n```bash\nrpm -qa |grep gzip\n```\n\n### 安装 rpm\
  \ 包\n#### 语法\n```bash\nrpm -ihv package_name\n```\n其中 `-i` 表示安装\n- `-v` 表示详细模式\n\
  - `-h` 显示进度\n#### 示例\n```bash\nrpm -ihv zsh-html-5.5.1-6.el8_1.2.noarch.rpm\n```\n\
  \n### 更新已安装的包\n#### 语法\n```bash\nrpm -Uhv package_name\n```\n#### 示例\n```bash\n\
  rpm -Uhv zsh-html-5.5.1-6.el8_1.2.noarch.rpm\n```\n\n### 检查包的依赖\n#### 语法\n```bash\n\
  rpm -qpR package_name\n```\n#### 示例\n```bash\nrpm -qpR zsh-html-5.5.1-6.el8_1.2.noarch.rpm\n\
  ```\n\n### 列出特定包安装的所有文件\n#### 语法\n```bash\nrpm -ql package_name\n```\n#### 示例\n\
  ```bash\nrpm -ql zsh-html-5.5.1-6.el8_1.2.noarch.rpm\n```\n\n### 移除包\n#### 语法\n\
  ```bash\nrpm -ev package_name\n```\n#### 示例\n```bash\nrpm -ev zsh-html\n```\n\n\
  ### 安装前打印包信息\n#### 语法\n```bash\nrpm -qip package.rpm\n```\n#### 示例\n```bash\nrpm\
  \ -qip zsh-html-5.5.1-6.el8_1.2.noarch.rpm\n```\n\n### 重建 rpm 数据库\n```bash\ncd /var/lib/rpm\n\
  rm __db*\nrpm --rebuilddb\n/usr/lib/rpm/rpmdb_verify /var/lib/rpm/Packages\n```\n\
  \n# 包组\n包组包含执行相关任务的软件包，例如系统工具、工作站和最小化安装等。\n\n### 列出组列表\n#### 语法\n```bash\nyum grouplist\n\
  ```\n\n### 安装包组\n#### 语法\n```bash\nyum group install “Group Name”\n```\n#### 示例\n\
  ```bash\nyum group install “System Tools”\n```\n\n### 更新组\n#### 语法\n```bash\nyum\
  \ group install “Group Name”\n```\n#### 示例\n```bash\nyum group update “System Tools”\n\
  ```\n\n### 移除包组\n#### 语法\n```bash\nyum group remove “Group Name”\n```\n#### 示例\n\
  ```bash\nyum group remove “System Tools”\n```\n\n## 第 15 章\n## 软件仓库\n\nLinux 仓库（Repository）是\
  \ Linux 操作系统更新的存储位置。仓库也用于安装新应用程序和更新已安装的应用程序。每个仓库都是托管在远程服务器或本地的软件集合。仓库可以分为多个分支，如二进制文件、源码、可选包等。\n\
  \n要添加新仓库，请在 `/etc/yum.conf` 文件中添加条目，但建议在 `/etc/yum.repos.d` 目录下为每个仓库创建一个单独的文件。仓库文件的扩展名应该是\
  \ `.repo`。\n\n仓库文件的主要组件有：\n\n| `[repository]` | 每个仓库都应该有一个以仓库部分开头的仓库 ID |\n| `name=repository_name`\
  \ | 仓库的名称 |\n| `baseurl=repository_url` | 仓库的位置，位置可以是 http、ftp 或本地 http `[`path/repo`](http://path/repo)`FTP\
  \ `ftp://path/repo` 本地 `file:///path/repo` |\n| `enabled = 1` | 定义仓库的状态，1 表示启用，0\
  \ 表示禁用 |\n| `gpgcheck = 1` | 在安装前验证 GPG 签名 |\n\n![](img/image00407.jpeg) 示例\n\n\
  ## Oracle Linux 仓库\n与之前的版本不同，Oracle Linux 8 带有两个主要仓库。\n1. BaseOS\n2. Appstream\n\
  \n### BaseOS\nBaseOS 旨在为所有类型的安装提供核心功能集和核心组件。这意味着即使是无无头安装（headless installation），也需要\
  \ BaseOS 仓库。\n\n### Appstream\nAppstream 包含了额外的用户空间应用程序、语言、数据库等。Appstream 适用于不同的工作负载，如\
  \ http、数据库或文件服务器。Appstream 的更新频率比 BaseOS 高。Appstream 由 `rpm` 软件包和模块组成。\n\n## 仓库管理命令\n\
  ### 列出所有启用的仓库\n```bash\nyum repolist\n```\n\n### 列出所有仓库的状态\n```bash\nyum repolist\
  \ all\n```\n\n### 使用网络上的 repo 文件添加仓库\n#### 示例\n```bash\nyum config-manager --add-repo\
  \ http://www.example.com/example.rep\n```\n\n### 使用 repo 文件启用/禁用仓库\n你可以通过编辑 `/etc/yum.repo.d`\
  \ 中的目录 repo 文件或使用 `yum config-manager` 命令来启用或禁用仓库。\n\n使用 repo 文件启用任何仓库：\n![](img/image00408.jpeg)\
  \ 打开 repo 文件并将 `enabled=0` 更改为 `enabled=1`。要禁用任何仓库，将 `enabled=1` 更改为 `enabled=0`。\n\
  \n使用命令：\n### 启用任何仓库\n#### 语法\n```bash\nyum config-manager --set-enabled repo_name\n\
  ```\n#### 示例\n```bash\nyum config-manager --set-enabled PowerTools\n```\n\n### 禁用仓库\n\
  #### 语法\n```bash\nyum config-manager --set-disabled reponame\n```\n#### 示例\n```bash\n\
  yum config-manager --set-disabled PowerTools\n```\n\n### 每次修改后清除缓存\n```bash\nyum\
  \ clean all\n```\n\n## 设置本地仓库\n在某些无法上网的情况下，你必须创建本地仓库进行软件管理。创建本地仓库的步骤如下：\n1. 创建目录\n\
  2. `mkdir /local_repo`\n3. 挂载 DVD 到 `/mnt`\n```bash\nmount /dev/cdrom /mnt\n```\n\
  注意：`cdrom` 设备名称可能不同\n4. 将文件复制到 `/local_repo`\n```bash\ncp -r /mnt/* /local_repo\n\
  ```\n5. 将 repo 文件复制到 `/etc/yum.repos.d`\n```bash\ncp /local_repo /etc/yum.repos.d\n\
  ```\n6. 修改文件权限\n```bash\nchmod 644 /etc/yum.repos.d/local_repo\n```\n7. 编辑配置\n```bash\n\
  vi /etc/yum.repos.d/local_repo\n```\n8. 修改后的文件应该像这样：\n```ini\n[InstallMedia-BaseOS]\n\
  name=Oracle Linux 8 BaseOS\nmetadata_expire=-1\ngpgcheck=1\nenabled=1\nbaseurl=file:///local_repo/BaseOS/\n\
  gpgkey=file:///etc/pki/rpm-gpg/RPM-Oracle\n\n[InstallMedia-AppStream]\nname=Oracle\
  \ Linux 8 AppStream\nmetadata_expire=-1\ngpgcheck=1\nenabled=1\nbaseurl=file:///local_repo/AppStream/\n\
  gpgkey=file:///etc/pki/rpm-gpg/RPM-Oracle\n```\n9. 清理缓存\n```bash\nyum clean all\n\
  ```\n10. 列出仓库\n```bash\nyum repolist\n```\n![](img/image00409.jpeg)\n\n## 开发者仓库\n\
  ### PowerTools\nPowerTools 仓库主要用于软件开发者。该仓库包含了从源码编译应用程序所需的软件包。\n### 启用\n```bash\n\
  yum config-manager --set-enabled PowerTools\n```\n\n## 第三方仓库\n为了安装由于许可问题在上述三个仓库中无法提供的软件，你可以添加第三方仓库。常见的第三方仓库有：\n\
  - EPEL\n- REMI\n- RPM Fusion\n\n### EPEL 仓库\nEPEL 或企业 Linux 仓库来自 Fedora 社区，包含了 Oracle\
  \ 官方由于许可限制无法提供的软件包。常见的包有 chromium、音频和视频解码器。\n### 添加仓库\n```bash\nyum install https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm\n\
  ```\n### 启用\n```bash\nyum config-manager --set-enabled epel\n```\n\n### REMI\nREMI\
  \ 是由 Remi Collect 创建并维护的免费使用仓库。REMI 提供了最新的 PHP 栈和其他某些软件。\n### 安装\n```bash\nyum -y\
  \ install https://rpms.remirepo.net/enterprise/remi-release-8.rpm\n```\n### 启用\n\
  ```bash\nyum config-manager --set-enabled remi\n```\n\n### RPM Fusion\nRPM Fusion\
  \  Oracle Linux 不愿提供的专有多媒体软件。\n### 安装\n```bash\nyum install --nogpgcheck https://download1.rpmfusion.org/free/el/rpmfusion-free-release-8.noarch.rpm\
  \ https://download1.rpmfusion.org/nonfree/el/rpmfusion-nonfree-release-8.noarch.rpm\n\
  ```\n注意：这是一条命令行命令，将同时添加免费和非免费的 RPM Fusion 仓库。\n\n\n\n\n\n服务是一个在后台运行等待被使用或执行基本任务的程序。当系统启动时，它会启动许多服务以达到系统所需的状态。假设您想以\
  \ GUI 模式启动系统，系统必须启动所有与桌面环境相关的服务。同样，如果您将服务器配置为 Web 服务器，则必须在启动过程中启动 Web 服务。即使是执行基本任务，它也需要许多服务正在运行，如网络、日期和时间等。与由用户启动并在用户注销时自动关闭的普通软件程序不同，服务可以在没有用户参与的情况下启动，并且在用户注销后可能继续运行。大多数服务在用户不知情的情况下后台运行。软件开发者可以编写自己的软件作为服务运行。\n\
  \n## SYSTEMD 简介\n\n`systemd` 是大多数 Linux 发行版的系统和服务服务管理器。Oracle Linux 也使用 `systemd`\
  \ 进行服务管理。`systemd` 与旧的 `SysV init` 脚本兼容。使用 `systemd` 管理服务的主要优势包括：\n\n-   更易的服务管理\n\
  -   启动时的任务并行执行\n-   通过 `cgroups` 实现更好的资源管理。\n-   守护进程的按需激活\n\n## systemd 的重要目录和文件\n\
  \n| 目录 | 说明 |\n| :--- | :--- |\n| `/usr/lib/systemd/system/` | 安装程序的 `systemd` 单元文件。\
  \ |\n| `/run/systemd/system/` | 运行时创建的 `systemd` 单元文件。 |\n| `/etc/systemd/system/`\
  \ | 为自动启动服务创建的 `systemd` 单元文件。 |\n\n## 系统单元类型\n\n| 单元 | 说明 |\n| :--- | :--- |\n\
  | `.service` | 服务 |\n| `.device` | 设备 |\n| `.target` | 相当于 sysv 中的运行级别 (run level)\
  \ |\n| `.snapshot` | 存储状态 |\n| `.swap` | 封装内存交换分区或交换文件。 |\n\n## 命令\n\n`systemctl`\
  \ 是 Oracle Linux 8 中管理服务的命令。我们将使用此命令来查看、启动、停止、启用和禁用服务。\n\n### 列出所有服务\n```\nsystemctl\
  \ list-units --type service --all\n```\n\n### 显示服务的状态\n#### 语法\n```\nsystemctl status\
  \ service_name\n```\n#### 示例\n```\nsystemctl status sshd\n```\n\n### 检查服务是否激活（运行）\n\
  #### 语法\n```\nsystemctl is-active service_name\n```\n#### 示例\n```\nsystemctl is-active\
  \ sshd\n```\n\n## 启动和停止服务\n\n### 启动服务\n#### 语法\n```\nsystemctl start service_name\n\
  ```\n#### 示例\n```\nsystemctl start httpd\n```\n\n### 停止服务\n#### 语法\n```\nsystemctl\
  \ stop service_name\n```\n#### 示例\n```\nsystemctl stop httpd\n```\n\n### 重启服务\n\
  #### 语法\n```\nsystemctl restart service_name\n```\n#### 示例\n```\nsystemctl restart\
  \ httpd\n```\n\n### 如果服务正在运行则重启\n#### 语法\n```\nsystemctl try-restart service_name\n\
  ```\n#### 示例\n```\nsystemctl try-restart httpd\n```\n\n## 重新加载服务配置\n#### 语法\n```\n\
  systemctl reload service_name\n```\n#### 示例\n```\nsystemctl reload httpd\n```\n\n\
  ### 屏蔽服务 (Mask Service)\n当你屏蔽一个服务时，该服务无法启动。这在禁用危险和未知服务时非常有用。\n#### 语法\n```\nsystemctl\
  \ mask service_name\n```\n#### 示例\n```\nsystemctl mask httpd\n```\n\n### 解除屏蔽\n\
  #### 语法\n```\nsystemctl unmask service_name\n```\n#### 示例\n```\nsystemctl unmask\
  \ httpd\n```\n\n## 使用 Target（运行级别）\n\nTarget 基本上是为了让服务器进入特定状态。许多服务和其他单元的启动和停止是为了使服务器达到所需状态。多个\
  \ Target 可以同时处于激活。\n\n### 查看系统中所有可用的 target\n```\nsystemctl list-unit-files --type=target\n\
  ```\n\n### 查看默认 target\n在 `/lib/systemd/system/default.target` 中描述了 `systemd` 在启动时尝试达到的默认\
  \ target。\n```\nsystemctl get-default\n```\n\n### 修改启动时将使用的默认 target\n#### 语法\n\
  ```\nsystemctl set-default target_name\n```\n#### 示例\n```\nsystemctl set-default\
  \ multi-user.target\n```\n\n### 列出与 target 绑定的单元\n#### 语法\n```\nsystemctl list-dependencies\
  \ target_name\n```\n#### 示例\n```\nsystemctl list-dependencies multi-user.target\n\
  ```\n\n### 定义的 target\n| Target | 说明 |\n| :--- | :--- |\n| `rescue.target` | 单用户模式。\
  \ |\n| `multi-user.target` | 非 GUI 多用户控制台访问 |\n| `graphical.target` | 一个 GUI 会话。\
  \ |\n| `custom.target` | 自定义 target。 |\n| `emergency.target` | 用于系统修复的最精简环境。 |\n\
  \n## 关机或重启\n\n### 使用 systemctl 关机\n```\nsystemctl poweroff\n```\n\n### 重启\n```\n\
  systemctl reboot\n```\n\n### 以救援模式启动服务器\n```\nsystemctl rescue\n```\n\n## 启用和禁用服务\n\
  \n要配置任何服务在启动时自动运行，我们使用 `systemctl enable` 命令。该命令在 `/etc/systemd/system/` 目录下创建链接文件。当禁用任何服务时，`systemctl`\
  \ 会删除该目录下的链接文件。\n\n### 配置服务在启动时运行\n```bash\nsystemctl enable service_name\n```\n\
  #### 示例\n```bash\nsystemctl enable httpd\n```\n\n### 禁用服务\n```bash\nsystemctl disable\
  \ service_name\n```\n#### 示例\n```bash\nsystemctl disable httpd\n```\n\n### 检查服务是否启用\n\
  ```bash\nsystemctl is-enabled service_name\n```\n#### 示例\n```bash\nsystemctl is-enabled\
  \ sshd\n```\n\n### 列出启用的服务\n```bash\nsystemctl list-unit-files --type=service --enabled\n\
  ```\n\n### 查看服务的详细信息\n```bash\nsystemctl show service_name\n```\n\n\n\n\n现在你有了普通用户的最小和最大范围，可以列出所有普通用户：\n\
  \n```bash\nawk -F'[/:]' '{if ($3 >= 1000 && $3 != 65534) print $1}' /etc/passwd\n\
  ```\n\n### `/etc/passwd` 文件\n`/etc/passwd` 文件包含了系统上所有用户的列表，包括系统用户和普通用户。该文件的格式为每行代表一个用户。每行的字段由\
  \ `:`（冒号）分隔。这些字段包含以下信息：\n\n1. 用户名\n2. 加密密码（显示为 `x`，加密密码的实际位置位于 `/etc/shadow` 文件）\n\
  3. 用户 ID 数 (`UID`)\n4. 用户组 ID (`GID`)\n5. 用户全名\n6. 家目录\n7. !![](img/image00410.jpeg)登录\
  \ shell\n\n### 系统上所有用户列表\n```bash\nawk -F':' '{ print $1}' /etc/passwd\n```\n\n\
  ### 组 ID (GID)\nLinux 中的组通过组 组 ID (`GIDs`) 定义。`GIDs` 存储在 `/etc/groups` 文件中。前 1000\
  \ 个 GID 通常保留给系统使用。所有的应用程序组从 1001 开始。\n\n### `/etc/group` 文件\n`/etc/group` 是一个定义了每个用户所属组的文件。多个用户可以属于同一个组。同一组中的每个用户名用逗号分隔。这些字段包含以下信息：\n\
  \n1. 组名。\n2. 密码：通常不使用密码，因此为空为空/空白。如果不为空，则存储加密密码。这在实现特权组时非常有用。\n3. 组 ID (`GID`)\n\
  4. 用逗号分隔的用户列表。\n\n![](img/image00411.jpeg)\n\n# 第 18 章：## 探索 SU 和 SUDO\n\n要提升分配给当前用户的权限，你可以使用\
  \ `su` 或 `sudo`。\n\n### SU\n`su` 命令用于切换到另一个用户。如果执行时不指定用户名，它将默认以 root 用户身份登录。`su`\
  \ 需要目标账户的密码。\n\n**以特定用户登录**\n语法：\n```bash\nsu username\n```\n示例：\n```bash\nsu oracle\n\
  ```\n当配合连字符（`su -`）使用时，将假设目标用户的环境。\n\n示例：\n对于 root 用户：\n```bash\nsu -\n```\n对于其他用户：\n\
  ```bash\nsu - oracle\n```\n\n### SUDO\n`sudo` 允许用户以另一个用户的安全权限运行程序，默认情况下，它使用管理员权限运行命令。通过这种机制，你可以将某些管理员任务分配给权限较低的用户，而无需共享管理员密码。与需要目标账户密码的\
  \ `su` 不同，`sudo` 需要当前用户的密码。在命令前加 `sudo` 即可执行任何管理命令。\n\n**运行更改系统配置的特权命令的示例**\n```bash\n\
  sudo yum install gzip\n```\n或更改主机名：\n```bash\nsudo hostnamectl set-hostname host2021\n\
  ```\n\n**作为不同用户运行命令。**\n语法：\n```bash\nsudo -u user command\n```\n示例：\n```bash\n\
  sudo -u user2 hostnamectl\n```\n\n**在交互模式下使用 sudo**\n```bash\nsudo -i\n```\n\n#####\
  \ 修改 sudo 配置\n`sudo` 将其配置存储在 `/etc/sudoers` 文件中。要修改 sudo 配置，请使用 `visudo` 命令。它会有效地启动\
  \ `vi` 编辑器并编辑 `/etc/sudoers` 文件。`visudo` 命令应由管理员执行。\n\n`/etc/sudoers` 文件包含一个用户列表，以及这些用户可以运行的命令。\n\
  \n`user host=(users) [NOPASSWORD:]commands`\n\n示例：\n```text\n%operators localhost\
  \ = (apache) /usr/sbin/\n```\n\n###### Wheel 组\n![](img/image00412.jpeg)Oracle Linux\
  \ 自带一个默认的管理员组，称为 wheel 组。如果你想将所有管理员权限分配给一个用户而不共享 root 密码，可以将该用户添加到 wheel 组。在此之前，请确保\
  \ `/etc/sudoer` 文件中的该行没有被注释。\n\n**将用户添加到 wheel 组**\n```bash\nusermod --append -G\
  \ wheel user_name\n```\n示例：\n```bash\nusermod --append -G wheel user1\n```\n\n**注意：**\
  \ `SU` 和 `SUDO` 的主要区别在于，在 `SU` 的情况下，你通过切换到超级用户或 root 用户来获取 root 权限，而在 `SUDO` 的情况下，你通过单个命令获取\
  \ root 权限。\n\n# 第 19 章：## 探索文件和目录权限\n\nLinux 是一个多用户操作系统，可以被许多用户同时访问。因此，用户不触碰彼此的数据是绝对必要的。为了数据和系统文件的安全和正常，操作系统部署了不同类型的安全系统。Linux\
