    ### Gnome 系统监控\nGnome 系统监控应用程序允许你在任何时刻监控系统状况。此外，你可以收集有关应用程序的重要信息。它提供了：\n* 监控 CPU、内存、交换空间和网络\n\
    * 监控进程及其属性\n* 控制进程行为\n* 搜索打开的文件\n* 显示磁盘和挂载信息\n\n#### 进程卡\n显示系统所有运行的进程及其 CPU 使用、内存使用、磁盘使用情况等。右键点击进程可以操作所选进程。\n\
    ![](img/image00424.jpeg)\n![](img/image00425.jpeg)\n\n#### 资源卡\n以图形格式显示所有硬件资源的使用情况和历史。\n\
    ![](img/image00426.jpeg)\n\n#### 文件系统卡\n显示挂载的文件系统及其使用百分比。\n\n## 第 27 章\n\n# 自动化你的系统\n\
    \n系统自动化可以简化管理员的工作，并减少重复任务中的错误次数。Linux 提供了调度器来处理定期作业。\n\n`Cron` 是 Oracle Linux\
    \ 中基于时间的作业调度器，用于在指定的时间运行命令。除了系统级 cron 表，每个用户都可以拥有独立的 cron 表来执行调度作业。\n\n系统级 cron\
    \ 表文件为 `/etc/crontab`。`/var/spool/cron/` 目录包含每个用户的 `cron 表`。\n\n### 添加或编辑 cron\
