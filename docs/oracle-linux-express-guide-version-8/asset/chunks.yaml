  trans: "\n将文件的前 10 行打印到标准输出。你也可以指定要显示的行数。\n\n### 语法\n`head option file`\n\n### 示例\n\
    ```bash\nhead -20 /etc/passwd\n```\n显示 `passwd` 文件的前 20 行。\n\n### tail\n将文件的最后\
    \ 10 行打印到标准输出。你也可以指定要显示的行数。\n\n### 语法\n`tail option file`\n\n### 示例\n```bash\n\
    tail -20 /var/log/logfile\n```\n它将显示最后 20 行\n\n### 使用 tail 持续监控文件\n```bash\ntail\
    \ -f /var/log/logfile\n```\n它将显示增长文件的末尾。按 `Ctrl +c` \n\n## 复制文件和目录\n\n### 复制文件\n\
    ### 语法\n`cp filename target_dir`\n\n### 示例\n```bash\ncp abc.txt /home/user1/.\n\
    ```\n\n### 复制多个文件\n### 语法\n```bash\ncp * /target-location/.\n```\n### 示例\n```bash\n\
    cp *.txt /home/user/.\n```\n这将所有以 `txt` 扩展的文件复制到 `/home/user1` 目录\n\n### 在任何覆盖前提示\n\
    ```bash\ncp –i /home /home1\n```\n\n### 强制复制文件\n```bash\ncp –f /tmp/abc.txt /backup/.\n\
    ```\n\n### 不覆盖现有文件，而是静默地不操作\n```bash\ncp -n * /backup/.\n```\n\n### 复制目录\n###\
    \ 语法\n`cp -R source_dir target_dir`\n\n### 示例\n```bash\ncp -R user1 user2\n```\n\
    将 `user1` 目录复制到 `user2`\n\n## 删除文件和目录\n\n### 删除文件\n要删除文件或目录，你可以使用 `rm` 命令。\n\n\
    ### 语法\n`rm file_name`\n\n### 示例\n```bash\nrm abc.txt\n```\n要删除目录及其所有内容，包括任何子目录和文件：\n\
    ```bash\nrm -r /example\n```\n请非常小心地使用此命令，可能会导致数据丢失\n\n### 删除目录\n### 语法\n`rmdir\
    \ directory`\n\n### 示例\n```bash\nrmdir /example\n```\n\n## 列出文件和目录\n\n### ls\n\
    列出文件和目录名。\n\n### 语法\n`ls -<options>`\n\n### 列表\n```bash\nls -l\n```\n显示文件或目录列表，包含大小、修改日期、修改时间和权限。\n\
    \n### 同时显示隐藏文件和目录\n```bash\nls -la\n```\n\n### 显示人类可读格式\n```bash\nls -lh\n```\n\
    \n### mv\n`mv` 命令用于将文件从一个位置移动到另一个位置。你也可以使用 `mv` 命令在不移动文件的情况下重命名。\n\n### 移动文件\n\
    ### 语法\n`mv filename destination_directory`\n\n### 示例\n```bash\nmv a.txt /tmp/.\n\
    ```\n它将 `a.txt` 文件从当前目录移动到 `/tmp` 目录\n\n### 重命名\n### 语法\n`mv filename newfilename`\n\
    \n### 示例\n```bash\nmv a.txt b.txt\n```\n\n### grep\n在一个或多个文件中搜索字符串。显示包含该字符串的每一行。\n\
    \n### 语法\n`grep string file`\n\n### 示例\n```bash\ngrep '127.0.0.1' /etc/hosts\n\
    ```\n\n### diff\n比较两个文件。\n\n### 语法\n`diff First_file Second_file`\n\n### 示例\n\
    ```bash\ndiff abc.txt bbc.txt\n```\n\n### file\n确定文件类型\n\n### 语法\n`file file_name`\n\
    \n### 示例\n```bash\nfile bbc.txt\n```\n\n## 链接文件和目录\n链接类似于 Windows 中的快捷方式，指向原始文件。链接有两种类型：\n\
    \n* 硬链接 (Hard link)\n* 软链接 (Soft link)\n\n硬链接软链接都是文件的快捷方式。软链接可以于不同的文件系统中，而硬链接只能存在于同一个文件系统中。当你删除原始文件时，软链接将停止工作，而硬链接不受影响。这是因为在硬链接的情况下，原始文件和硬链接都指向同一个\
    \ inode。\n\n### 创建软链接\n### 语法\n`ln -s /source/file_name /target/file_name`\n\n\
    ### 示例\n```bash\nln -s /home/admin/abc.txt /abc1.txt\n```\n\n### 创建硬链接\n### 语法\n\
    `ln file_name /target/file_name`\n\n### 示例\n```bash\nln /home/admin/abc.txt /home/admin/abc1.txt\n\
    ```\n\n# 第 8 章 网络\n\n在本章中，我们将讨论网络部分。主要有两种类型的网络： \n\n### 非 IP 网络\n非 IP 网络利用传输层进行通信。非\
    \ IP 网络的一个示例是 InfiniBand。\n\n### IP 网络\nIP 网络是使用 IP 地址进行通信的网络。作为 IP 网络部分的每个设备都应该有一个\
    \ IP 地址。IP 网络是最常见的网络类型。家庭、办公室和互联网大部分使用 IP 网络。\n\n对于 IP 网络，你有选项选择地址分配机制。有两种 IP\
    \ 地址分配机制可用。\n\n#### 静态\n静态 IP 地址是手动为设备分配 IP 地址的模式。在静态 IP 地址分配的情况下，除非你更改，否则 IP\
    \ 地址将保持不变。这种 IP 地址分配主要用于小型网络或共享设备（如服务器、打印机等），你希望每次都使用相同的 IP 地址。\n\n#### 动态 IP\
    \ 地址：\n动态 IP 地址配置是地址的自动配置。它使用 `DHCP` 服务器为你的设备获取 IP 地址。当你配置 `DHCP` 服务器时，你分配一个 IP\
    \ 地址范围给客户端。当你启动设备时，它会连接到 `DHCP` 服务器获取 IP 地址。每次启动设备时，你可能会获得不同的 IP 地址，除非你根据设备的 `MAC`\
    \ 地址预留 IP 地址。动态 IP 配置对于大型组织是理想的，因为无法记住分配给每个设备的地址。但对于希望每次使用相同 IP 地址的服务器和打印机，DHCP\
    \ 并不是理想解决方案。\n\n### 配置网络\n默认情况下，Oracle Linux 8 使用 `NetworkManager` 来配置和管理网络连接。要使用\
    \ `NetworkManager` 配置网络接口，请使用以下工具之一：\n\n| 工具 | 说明 |\n| :--- | :--- |\n| `nmtui`\
    \ | 基于文本的用户界面用于管理网络。此工具在非 GUI 环境下非常有用。 |\n| `GNOME Networkmanager` | 用于网络管理的图形工具。\
    \ |\n| `nmcli` | 命令行工具。 |\n\n### 设备命名规范\n接口名称以基于接口类型的双字符前缀开头：\n\n| 设备类型 | 前缀 |\n\
    | :--- | :--- |\n| 以太网 | `en` |\n| 无线 | `wl` |\n| 广域网 | `ww` |\n\n为了保持设备名称持久性，Oracle\
    \ Linux 对以太网使用了以下命名规范：\n\n| 设备类型 | 设备名称 |\n| :--- | :--- |\n| 板载设备 | `enoX`，X\
    \ 是设备编号 |\n| PCIe 设备 | `ensX`，X 是设备编号 |\n| 多端口设备 | `enpZsX`，Z 是物理端口，X 是设备编号 |\n\
    | 传统命名 | `ethX`，X 是设备编号 |\n\n传统命名 `ethX` 用于旧版本中的网络设备。新的命名规范提供了以下几点：\n1. 跨重启保持接口名称的稳定。\n\
    2. 在硬件添加和删除后保持接口名称的稳定。\n\n### 使用 NetworkManager 的优势\n1. 为所有应用程序同步并更新网络状态。\n2.\
    \ 更容易的网络管理。\n3. 各种用于网络管理的工具。\n4. 简单且灵活的 Wi-Fi 管理。\n\n### 网络管理器脚本\n默认情况下，`NetworkManager`\
    \ 按字母顺序执行 `/etc/NetworkManager/dispatcher.d` 目录中的脚本以响应网络事件。每个脚本都应该是 root 拥的可执行文件。\n\
    \n### 使用传统脚本\n默认情况下，Oracle Linux 8 使用 `NetworkManager` 管理网络，但如果需要，你仍然可以使用过时的网络脚本来代替\
    \ `NetworkManager`。\n\n安装脚本：\n```bash\nyum install network-scripts\n```\n\n###\
    \ nmtui\n`nmtui` 是用于配置网络的文本用户界面 (TUI) 工具。此工具对于没有 GUI 的系统上的网络管理非常有帮助。\n\n启动 nmtui：\n\
    ```bash\nnmtui\n```\n\n### 使用 nmtui 设置静态 IP 地址\n在此示例中我们将设置静态 IP 地址。\n1. 启动 `nmtui`\n\
    2. 选择编辑连接。\n3. 从列表中选择连接配置文件并按编辑。\n4. 在编辑连接屏幕上，在 IPv4 配置处按空格键键。\n5. 选择手动。\n6. 按\
    \ `TAB` 键并显示。\n7. 在相应字段提供 IP 地址、子网掩码、网关和 DNS。\n8. 滚动到底并确保“自动连接”单选按钮被选中。\n9. 按“确定”。\n\
    10. 选择返回。\n11. 选择激活连接，并按回车。\n12. 从列表中选择连接并按回车激活连接。如果连接已激活，则取消激活并重新激活使更改生效。\n13.\
    \ 选择返回。\n14. 选择退出。\n\n### nmtui 命令\n使用 nmtui 设置主机名\n语法\n\n"
- fmt: "\n`nmtui hostname new_hostname`\n\n## Example\n```bash\nnmtui hostname Server2\n\
    ```\n\n## nmcli\n\n`nmcli` is a command-line tool for managing network. `nmcli`\
    \ can be used to create, display, edit, delete, activate, and deactivate network\
    \ connections. `nmcli` is a very useful tool to control and display network device\
    \ status.\n\n### Listing network devices and their status\n#### Syntax\n```bash\n\
    nmcli device\n```\n![](Images/image00394.jpeg)\n\n#### Example\n#### Device detailed\
    \ information\n```bash\nnmcli device show\n```\n\n#### List connections\n```bash\n\
    nmcli connection show\n```\n\n### Activate Connection\n#### Syntax\n```bash\n\
    nmcli connection up connection_name\n```\n#### Example\n```bash\nnmcli connection\
    \ up ens35\n```\n\n### Deactivate Connection\n#### Syntax\n```bash\nnmcli connection\
    \ down connection_name\n```\n\n#### Example\n```bash\nnmcli connection down ens35\n\
    ```\n\n### Change networking status\n#### Syntax\n```bash\nnmcli networking on/off\n\
    ```\n#### Example\n```bash\nnmcli networking off \n```\n\n### Show hostname\n\
    ```bash\nnmcli general hostname\n```\n\n## Wifi network management\n### Listing\
    \ available WiFi APs\n```bash\nnmcli device wifi list\n```\n\n### Connecting to\
    \ password protected Wifi network\n#### Syntax\n```bash\nnmcli device wifi connect\
    \ \"SSID\" password \"password\"\n```\n#### Example\n```bash\nnmcli device wifi\
    \ connect \"mynetwork\" password \"pa$$w0rd\"\n```\n\n## GNOME GUI network manager\n\
    Network can be controlled in GUI mode in two places either from top bar system\
    \ menu or under settings.\n\n### Connecting Wireless connection\nYou will see\
    \ Wi-Fi icon at the top bar of your desktop if system is connected to wireless\
    \ network, otherwise follow the bellow procedure to connect to your home or office\
    \ wireless network:-\n\n1. Click System Menu.\n2. Click Wireless not connected\
    \ to expand collapsed menu.\n3. ![](Images/image00395.jpeg)Click Select Network.\n\
    4. New screen will open with all available networks. Select your Wi-Fi network\
    \ name. Press Connect.\n5. ![](Images/image00396.jpeg)![](Images/image00397.jpeg)If\
    \ network is password protected, at password prompt, provide password and press\
    \ Connect.\n6. Now your network is connected and top bar will show Wi-Fi icon.\n\
    \n### Change Wi-Fi Password\nIf for some reasons you had changed the Wi-Fi network\
    \ password on your Wi-Fi router, you have to set the same password in your system\
    \ also otherwise, it will not connect next time.\n\n1. Click System menu.\n2.\
    \ Click wireless Connected to open sub menu.\n3. Click Change settings.\n4. From\
    \ the list of available networks select your network and press gear icon next\
    \ to it.\n5. In security setting change password and press ok.\n\n## Wired network\n\
    Connecting wired network is easy, just plug the network cable to your computer.\
    \ The system will automatically configure the system for available network. As\
    \ soon as the system is connected to the wired network, system indicator shows\
    \ at the top bar.\n\n### Manual Wired network configuration\nMost of the time\
    \ wired network settings are automatic, but in some cases you have to set IP address\
    \ manually. This type of configuration is known as static IP address configuration.\n\
    \n#### To configure static IP address:-\n1. Open System Menu.\n2. ![](Images/image00398.jpeg)Click\
    \ Wired Connected and select Wire Settings.\n3. It will bring Network settings\
    \ windows.\n4. Click gear icon.\n![](Images/image00399.jpeg)\n5. Wired profile\
    \ dialog box will open.\n6. In the `Details` tab make sure `Connect automatically`\
    \ is ticked.\n7. ![](Images/image00400.jpeg)Click `IPv4` tab.\n1. Click `Manual`\
    \ radio button.\n2. Provide IP address.\n3. Enter `Netmask`,\n4. Enter `Gateway`.\n\
    5. DNS\n8. Press `Apply`.\n\n## Name Resolution\nWhenever you write hostname instead\
    \ of IP address to connect Linux host, you have followingoptions to resolve hostname\
    \ to IP address.\n\n* Local file i.e. `/etc/hosts`\n* DNS server\n* NIS\n\n###\
    \ Local file (/etc/hosts)\n`/etc/hosts` is file which stores hostname to IP address\
    \ mapping. It provides ability to resolve hostname without using DNS server. We\
    \ generally use this file if we are connecting to limited number of hosts due\
    \ to scope or security reason. Downside of using this file is that in case of\
    \ IP address change, administrator has to change this file on all servers or PCs.\n\
    \n#### Format\n`IP_address hostname aliases`\n\n#### Example\n```bash\n127.0.0.1\
    \ server1 localhost\n31::1 server1 localhost\n192.168.228.129 server1server1.example.com\n\
    ```\n\n### DNS\nA DNS server is a central repository that contains a database\
    \ of IP addresses and their associated hostnames. Whenever any client wants to\
    \ resolve hostname to IP address instead of using its local file it sends request\
    \ to DNS server. If IP Address of some client changes you just have to update\
    \ the DNS entry. You can have multiple DNS server in one organization. To redirect\
    \ your request for hostname resolution Oracle Linux uses `/etc/resolve.conf` file.\
    \ By default, `NetworkManager` on Oracle Linux 8 dynamically updates the `/etc/resolv.conf`\
    \ file. However, depending on your requirement you can disable DNS processing\
    \ by `NetworkManager`.\n\n## Teaming\nTeaming allows you to group multiple physical\
    \ Ethernet network adapters into one logical adapter. This logical network adapter\
    \ provides higher throughput or redundancy.\n\n### Modes for Teaming\n| Mode |\
    \ Description |\n| :--- | :--- |\n| Round-robin | In this mode, data is transmitted\
    \ across all ports in turn. |\n| Broadcast | Here data is transmitted across all\
    \ ports. |\n| Load-balance | Traffic is distributed across all NICs. |\n| Active-backup\
    \ | Where one link or port is activated as the rest are reserved as a backup.\
    \ This is used for failover to provide redundancy. |\n| LACP | Uses 802.3ad protocol\
    \ for link aggregation |\n\n#### Install teaming packages\n```bash\nyum install\
    \ teamd\n```\n\n#### Create active backup team\n```bash\nnmcli connection add\
    \ type team con-name bond0 ifname bond0 config '{\"name\": \"activebackup\"}'\n\
    ```\n\n## Important Network Commands\n### Show IP address\n```bash\nip addr show\n\
    ```\n\n### Show Link status\n![](Images/00401.jpeg)ip link show\n\n### Check and\
    \ change hostname\nThe name of the computer in Linux is known as hostname. To\
    \ change the hostname, you can use `hostnamectl`.\n\n#### Display current hostname\n\
    ```bash\nhostnamectl\n```\n\n#### Change hostname\n#### Syntax\n```bash\nhostnamectl\
    \ set-hostname newname\n```\n#### Example\n```bash\nhostnamectl set-hostname myhost1\n\
    ```\n\n### Show routing table\n```bash\nip route\n```\n\n### Check network reachability\n\
    #### Syntax\n```bash\nping ipaddress/hostname\n```\n#### Example\n```bash\nping\
    \ 192.110.22.121\n```\n\nIf you are interested in changing IP address manually\
    \ using command line, try `nmcli` command. Check `nmcli-examples` command for\
    \ more information.\n\n## Network Tools\n(Note: The following are used for network\
    \ diagnostics)\n\n### dig\nDNS lookups and displays result\n#### Syntax\n```bash\n\
    dig hostname\n```\n#### Example\n```bash\ndig microsoft.com\n```\n\n### telnet\n\
    To connect destination host:port. You can also use `telnet` to test host and port\
    \ reachability.\n#### Syntax\n```bash\ntelnet hostname port\n```\n#### Example\n\
    ```bash\ntelnet myserver1 8080\n```\n\n### nslookup\nQuery Internet domain name\
    \ servers\n#### Syntax\n```bash\nnslookup hostname\n```\n#### Example\n```bash\n\
    nslookup microsoft.com\n```\n\n### scp\nCopy files from one host to other host\
    \ over the network in secure manner.\n#### Syntax\n```bash\nscp filename user@targetserver:/path\n\
    ```\n#### Example\n```bash\nscp ast.txt user1@server2:/home/user1\n```\n\n###\
    \ ssh\nFor secure login to target server.\n#### Syntax\n```bash\nssh user@targethost\n\
    ```\n#### Example\n```bash\nssh user1@server2\n```\n\n### nmap\nChecks the opened\
    \ port on the server.\n#### Syntax\n```bash\nnmap hostname\n```\n#### Example\n\
    ```bash\nnmap cloudflare.com\n```\n"
