    EXT 文件系统拥有悠久的历史`ext4` 是 `ext` 文件系统家族的第四代。它也是一种日志文件系统。`Ext4` 驱动程序可以读写 `ext3` 和
    `ext2` 文件系统。它支持高达 50 TiB 的文件系统大小。作为一种遗留文件系统`ext4` 文件系统被几乎所有 Linux 应用程序支持。


    # XFS 文件系统管理命令


    ### 创建 XFS 文件系统

    #### 语法

    ```bash

    mkfs.xfs devicename

    ```

    #### 示例

    ```bash

    mkfs.xfs /dev/sda01

    ```


    ### 调整 XFS 文件系统大小

    你只能扩展文件系统而不能缩小。要增大 XFS 文件系统请使用:-


    #### 语法

    ```bash

    xfs_growfs device_name

    ```

    #### 命令

    此命令将 xfs 文件系统扩展到设备的最大限制。

    ```bash

    xfs_growfs /dev/sda01

    ```

    `-D` 接受文件系统块数作为参数。

    ```bash

    xfs_growfs /dev/sda01 -D 200

    ```


    ### 修复 XFS 文件系统

    #### 语法

    ```bash

    xfs_repair -n device_name

    ```

    #### 示例

    ```bash

    xfs_repair -n /dev/sda01

    ```


    # Ext4 文件系统管理命令


    ### 创建 ext4 文件系统

    #### 语法

    ```bash

    mkfs.ext4 /dev/device_name

    ```

    #### 示例

    ```bash

    mkfs.ext4 /dev/sd01

    ```


    ### 为分区标记

    #### 语法

    ```bash

    e4label device_name new_label

    ```

    #### 示例

    ```bash

    e2label /dev/sda01 data01

    ```


    ### 调整大小

    你可以在 ext4 文件系统挂载 own 时扩展它。缩小则需要卸载 ext4 文件系统。


    #### 语法

    ```bash

    Resize2fs device_name new_size

    ```

    #### 示例

    ```bash

    Resize2fs /dev/sda01

    ```

    如果你不指定大小，此命令将文件系统扩展到设备的最大限制。

    要将文件系统更改为特定大小

    ```bash

    resize2fs /dev/sda01 5G

    ```


    # 第 10 章：探索网络文件系统


    在上一节中，我们讨论了本地文件系统，然而为了在网络上共享数据，远程文件系统出现了。网络文件系统需要在本地文件系统之上一个额外的层，以便在网络上共享和挂载。网络文件系统可以被多个用户同时使用。一旦挂载，它的行为就像远程机器上的本地文件系统一样。在本章中，我们将介绍
    Oracle Linux 8 上常用的远程文件系统。


    ### NFS

    `NFS` 是一种文件共享文件系统，基于服务器/客户端模式工作。在服务器上共享的文件系统可以通过网络挂载到客户端上。`NFS` 文件系统是 Unix 和 Linux
    系统之间非常流行的的文件共享协议。Oracle Linux 服务器同时支持 `NFS` 服务器和客户端。`NFS` 在 Linux 上对于跨平台文件和文件夹共享非常有用。`NFS`
    也是网络附属存储 `NAS` 系统上广泛使用的协议。目前有四个版本的 `NFS`，每个版本都有进一步的发布，例如版本 4 有 4.2 版本:-


    - `NFS V1`

    - `NFS V2`

    - `NFS V3`

    - `NFS V4`


    其中 `NFS V3` 和 `NFS V4` 是较新的 `NFS` 版本。在 Oracle Linux 8 中，不再支持基于 UDP 的 NFS。NFSV4
    增加了通过防火墙工作的优势并运行在 TCP 上。在 Oracle Linux 8 中，默认的 `NFS` 版本是 4.2，它具有支持访问控制列表 (`ACLs`)、服务器端复制和稀疏文件的特性。Oracle
    Linux 8 仅支持版本 3 和版本 4 的 `NFS`，Oracle Linux 8 不再支持版本 1 和版本 2


    ### 安装 NFS

    #### 安装包

    ```bash

    yum install nfs-utils

    ```

    安装后，启用服务以便在重启后自动启动。

    ```bash

    systemctl enable nfs-server.service

    ```


    #### 启动服务

    ```bash

    systemctl start nfs-server.service

    ```

    此命令将启动 `NFS` 需要的其他服务，如 `nfsd`、`nfs-idmapd`、`rpcbind`、`rpc.mountd`、`lockd`、`rpc.rquotad`、`rpc.statd`
    和 `rpc.idmapd`。


    现在检查服务的状态

    ```bash

    systemctl status nfs-server.service

    ```


    `NFS` 服务器的重要文件有：


    | 文件名 | 用途 |

    | :--- | :--- |

    | `/etc/nfs.conf` | NFS 进程和工具的主配置文件。 |

    | `/etc/nfsmount.conf` | NFS 挂载的全局配置文件。 |

    | `/etc/exports` | NFS 服务器导出表。 |


    #### `/etc/exports` 文件选项

    | 选项 | 描述 |

    | :--- | :--- |

    | `rw` | 允许对文件系统进行读取和写入访问。 |

    | `sync` | 此选项默认告诉 NFS 服务器仅在最后更改提交后才回复请求。 |

    | `all_squash` | 将所有 `UIDs` 和 `GIDs` 映射到匿名用户。适用于公共 FTP 目录。 |

    | `root_squash` | 将来自客户端的 `UID/GID` 0 映射到匿名 `UID/GID`。 |

    | `no_subtree_check` | 此选项禁用子树检查 |


    #### 导出目录

    在本示例中，我们将创建两个目录并导出这些目录供客户端挂载。

    ```bash

    mkdir /accounts

    mkdir /hrms

    ```


    #### 编辑 `/etc/exports` 文件

    ```bash

    vi /etc/exports

    ```

    添加以下内容：

    ```text

    /account 10.101.11.0/24(rw,sync)

    /hrms*(rw.sync)

    ```

    在本示例中，第一行将 NFS 共享到特定的网络 IP 范围。第二行向所有人共享 `hrms` 目录。


    #### 导出目录

    ```bash

    exportfs -a

    ```

    #### 列出导出的目录

    ```bash

    export -s

    ```

    #### 添加防火墙规则

    ```bash

    firewall-cmd --permanent --add-service=rpc-bind

    firewall-cmd --permanent --add-service=nfs

    ```

    重载防火墙

    ```bash

    firewall-cmd --reload

    ```

    检查服务的状态

    ```bash

    firewall-cmd --list-services

    ```


