    # 软件管理


    Oracle Linux 发行版基于 RPM 包。Oracle Linux 使用 `rpm` 命令通过 `.rpm` 包安装软件。RPM 包仅仅是一个包含某些文件和关于这些文件信息的文件。从技术上说，RPM
    是一个包含 `cpio` 归包及其自身元数据的文件。RPM 头部包含元数据，这些元数据用于确定有关软件包的以下信息：


    - 软件包描述。

    - 软件包中的文件列表。

    - 软件包的版本和发布版本。

    - 制作时间和及制作者。

    - 支持的架构。

    - 软件包中包含的文件的校验和。

    - 依赖关系。

    等……


    ## 软件包管理系统


    如果你尝试手动安装单个软件包，必须首先安装它所有的依赖项，并跟踪版本。为了方便软件管理，Linux 公司开发了一套名为软件包管理系统或包管理器的系统。软件包管理系统安装预编译的包，这些包以包含软件二进制文件、配置文件和依赖关系信息的归档形式存在。软件包管理系统是一系列用于自动化软件包安装、升级和删除过程的软件工具。软件管理器维护自己的软件依赖关系版本信息数据库。软件包管理系统有助于防止软件不匹配和缺少前提。Oracle
    Linux 使用 `YUM` 工具进行软件包管理。


    ### YUM


    与其他 Linux 发行版一样，Oracle Linux 使用了名为 `YUM` 的非常全面的软件包管理系统。Yellow dog Updater Modifier
    是一个用于软件包管理的命令行工具。`Yum` 使用仓库来获取与你的系统兼容的特定软件包正确版本。`yum` 允许软件包的自动更新和依赖管理。当你使用 `yum`
    命令安装软件时，它会自动从定义的仓库下载软件包及其所有依赖项。Oracle Linux 版本 8 使用 `YUM v4` 代替了早期版本使用的 `YUM v3`。基于
    `DNF` 技术的 `YUM v4` 工具具有以下优势：


    - 更好的性能

    - 支持模块化内容（我们稍后将讨论模块）

    - 用于与工具集集成的稳定 API


    Oracle Linux 8 有三个应用流，每个流都有自己的生命周期：


    - `BaseOS` 提供基础操作系统，

    - `AppStream` 提供用户应用，

    - `CodeReady Linux Builder` 提供开发者工具和语言。


