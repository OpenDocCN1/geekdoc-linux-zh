    file system family. It is also a journaling file system.  Ext4 drivers can read
    and write both ext3 and ext2 file system. It can support file system size up to
    50 TiB. Being a legacy file system ext4 file system is supported by almost all
    applications on Linux.  


    Commands for XFS file system management


    Create XFS file system


    Syntax


    mkfs.xfs devicename


    Example


    mkfs.xfs /dev/sda01


    Resize XFS file system


    You can only extend the file system and can not reduce it. To grow XFS file system
    use:-


    Syntax


    xfs_growfs device_name 


    Command


    This command will extend xfs file system to maximum limit of the device.


    xfs_growfs /dev/sda01 


    -D takes argument number as file system blocks.


    xfs_growfs /dev/sda01 -D 200


    Repair XFS file system


    Syntax


    xfs_repair -n device_name


    Example


    xfs_repair -n /dev/sda01


    Ext4 file system management Commands


    Create ext4 filesystem


    Syntax


    mkfs.ext4 /dev/device_name


    Example


    mkfs.ext4 /dev/sd01


    Label the partition


    Syntax


    e4label device_name new_label


    Example


    e2label /dev/sda01 data01


    Resize


    you can expand ext4 file system while it is mounted.  Shrink require ext4 file
    system has to be unmounted.


    Syntax


    Resize2fs device_name new_size


    Example


    Resize2fs /dev/sda01


    if you do not specify size this command will extend the file system to maximum
    limit of the device.


    To change the file system to specific size


    resize2fs /dev/sda01 5G


    Chapter 10  


    # Exploring Network File Systems 


    In the previous chapter we had discussed local file systems, however to share
    data over the network remote file system comes in to the picture. Network file
    system requires extra layer above local file system in order to share and mount
    over the network. Network file system can be used by multiple users at same time.
    Once mounted it behaves like local file system on remote machine. In this chapter,
    we will walk through commonly used remote file system on Oracle Linux 8. 


    NFS


    NFS is a file sharing file system, which works on server client basis. The file
    systems which are shared on server can be mounted on client over the network.
    NFS File system is very popular file system sharing protocol among Unix and Linux
    systems. Oracle Linux server support both NFS Server and client. NFS on Linux
    is very useful for cross platform files and folders sharing. NFS is also widely
    used protocol on Network Attached Storage NAS systems also. Currently there are
    four versions of NFS and each versions has further releases, like version 4 has
    4.2:-


    NFS V1


    NFS V2


    NFS V3


    NFS V4


    Where NFS V3 and NFS V4 are more recent version of NFS. In Oracle Linux 8, NFS
    over UDP is no longer supported. NFSV4 has added advantage of working through
    firewall and works on TCP. In Oracle Linux 8, the default NFS version is 4.2 which
    features support for Access Control Lists (ACLs), server-side copy and sparse
    files. Oracle Linux 8 support only version 3 and version 4 of NFS, version1 and
    version 2 is no more supported by Oracle Linux version 8.


    Installing NFS


    Install packages


    yum install nfs-utils


    After installation, enable the service to start automatically after reboot.


    systemctl enable nfs-server.service


    Start the service


    systemctl start nfs-server.service


    this command will start other services required by the NFS such as nfsd, nfs-idmapd,
    rpcbind, rpc.mountd, lockd, rpc.rquotad, rpc.statd and rpc.idmapd.


    Now check the status of service


    systemctl status nfs-server.service


    The important files for NFS server are


    | File Name | Purpose |


    | /etc/nfs.conf | main configuration file for the NFS daemons and tools. |


    | /etc/nfsmount.conf | Global configuration file for NFS mounts.  |


    | /etc/exports | File for NFS server export table |


    /etc/exports files options


    | rw | allows both read and write access on the file system. |


    | sync | this option by default tell NFS server to reply to requests only after
    the last changes have been committed.  |


    | all_squash | Map all UIDs and GIDs to the anonymous user. Useful for public
    FTP directory |


    | root_squash | Map  requests  from  client UID/GID  0  to  the  anonymous UID/GID.
    |


    | no_subtree_check | This option disables subtree checking |


    Export directory


    In this example we will create two directories and export these directory for
    clients to mount .


    mkdir /accounts


    mkdir /hrms


    Edit the /etc/exports file


    vi /etc/exports


    Add following entries


    /account 10.101.11.0/24(rw,sync)


    /hrms*(rw.sync)


    in this example first line exports the NFS share to specific network IP range.
    Second line shares hrms directory to everybody.


    Export the directory


    exportfs -a


    List the exported directories


    export -s


    Add the firewall rule


    firewall-cmd --permanent --add-service=rpc-bind


    firewall-cmd --permanent --add-service=mountd


    firewall-cmd --permanent --add-service=nfs


    Reload the filewall configuration


    firewall-cmd --reload


    Check the firewall configuration


    firewall-cmd --list-all|grep nfs


    Configure NFS on client


    Install the package if it is not already there.


    yum install nfs-utils nfs4-acl-tools


    Create directory for mount


    mkdir /myhrms


    Mount the file system


    mount -t nfs 192.168.115.128:/hrms /myhrms 


    Configure file system to mount automatic on boot using  /etc/fstab file


    echo "192.168.115.128:/hrms  /myhrms  nfs  defaults 0 0" >>/etc/fstab


    Samba or CIF


    Samba is a free and open source protocol that allows files to be sharing across
    Linux and windows machine.


    In this chapter we will see how use to Oracle Linux 8 server as smb client. We
    will use the shared folder from Window machine on Oracle Linux Linux machine.


    Install required packages


    yum install cifs-utils


    Mount the shared folder


    Syntax


    mount -t cifs -o username=user //servername/sharename /Local_mount_point/


    Example


    mount -t cifs – username=user1 //192.168.115.129/shared /mnt


    This command will prompt for windows password


    Chapter 11  


    # Disk Partitions


    Disk partitioning is a way to create separate region on the storage which can
    be managed independently. Partitions have following benefits: -


    1 Running more than one OS on your system.


    2 Data and application space segregation.


    3 Minimize corruption risk.


    4 Improve performance.   


    Partition Table


    A partition has partition table where it stores partition’s beginning and end.
    It also stores the code that is used during start-up, if a partition is bootable.
    You have option to setup disk as MBR (Master Boot Record) or GPT (GUID Partition
    Table). In this section, we will explain what difference between two is.


    Master Boot Record (MBR)


    The MBR partition was introduced in 1983 with DOS 2.0 also Known as Master Boot
    Record. As it very old partition scheme it provides the maximum compatibility.
    It not only support x64 but also conventional x86-based computers. Due to old
    architecture of MBR, it has many limitations. First one, it limits the maximum
    addressable storage space of a partitioned disk up to 2 TB, which is a big barrier
    for new disks which can store more than 2TB and specially with RAID where partition
    can be pooled capacity of several disks. Another limitation is, MBR disks support
    only four primary partitions. If you want more than four partitions then you have
    to make one of your primary partitions as extended partition and create logical
    partitions inside it. 


    GUID Partition Table (GPT)


    To overcome limitations of MBR and bring new features like security of partitions,
    GPT was introduced in late 1990s. Unlike MBR, GPT does not support x86 systems.
    GPT uses UEFI instead of BIOS. Each GPT Partition has Globally Unique Identifier
    or GUID which is unique random number. GPT has no limitation in the case of maximum
    number of partitions as it allows nearly unlimited number of partitions, only
    limited by OS limitations, like Oracle Linux 8 allows up to 128 partitions. For
    redundancy GPT disks uses primary and backup partition tables. For integrity,
    it uses CRC32 field.'
