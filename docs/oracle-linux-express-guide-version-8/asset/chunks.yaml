    尽管 GPT 带来了许多优势，但 MBR 仍然是兼容性最好且最广泛使用的分区方案。


    在本章中，我们将学习创建、删除和修改各种类型的磁盘分区。


    有几个用于分区管理的工具：

    * `parted`

    * `fdisk`


    ## Parted


    `parted` 是一个可以管理分区表的命令行工具。


    ### 显示分区布局

    语法

    ```bash

    parted -l

    ```

    此命令将显示所有块设备的分区布局。


    ### 显示特定块设备的分区表

    语法

    ```bash

    parted device print

    ```

    示例

    ```bash

    parted /dev/sda print

    ```


    ### 使用交互模式运行 parted

    输入带设备名称的 `parted` 命令。假设新磁盘为 `sdb`。

    ```bash

    parted /dev/sdb

    ```

    它将启动交互会话。


    ### 在磁盘上创建分区表

    启动 `parted`

    语法

    ```bash

    parted device_name

    ```

    其中 `device_name` 是磁盘名称。

    示例

    ```bash

    parted /dev/sda

    ```


    ### 创建分区

    语法

    ```bash

    mkpart part-type name fs-type start end

    ```

    其中：

    | 列 | 描述 |

    | :--- | :--- |

    | `part-type` | 对于 MBR 分区表，可以是主、逻辑或扩展分区。 |

    | `name` | GPT 分区表所需的分区名称。 |

    | `fs-type` | 可以是 `xfs`, `ext2`, `ext3`, `ext4`, `fat16`, `fat32`, `hfs`, `hfs+`,
    `linux-swap`, `ntfs` 或 `reiserfs`。`fs-type` 参数是可选的，因为 `parted` 不会在分区上创建文件系统。 |

    | `start and end` | 是决定分区起始和结束点的大小。可以使用大小单位后缀，如 `MiB`、`GiB` 或 `TiB`。默认大小为兆字节。
    |


    示例

    ```bash

    (parted) mkpart primary xfs 1 5GiB

    ```


    ### 使用 print 命令列出分区

    ```bash

    (parted) print

    ```

    Model: VMware, VMware Virtual S (scsi)

    Disk `/dev/sdb`: 10.7GB

    Sector size (logical/physical): 512B/512B

    Partition Table: msdos

    Disk Flags:

    Number Start End Size Type File system Flags

    1 1049kB 5369MB 5368MB primary xfs lba


    使用 `quit` 命令退出 `parted`。

    ```bash

    (parted) quit

    ```

    信息：你可能需要更新 `/etc/fstab`。


    ### 使用 parted 删除分区

    在 `parted` 交互会话中选择 `parted` 设备。

    示例

    ```bash

    parted /dev/sdb

    ```


    ### 显示当前分区表

    ```bash

    (parted) print

    ```

    Model: VMware, VMware Virtual S (scsi)

    Disk `/dev/sdb`: 10.7GB

    Sector size (logical/physical): 512B/512B

    Partition Table: msdos

    Disk Flags:

    Number Start End Size Type File system Flags

    1 1049kB 5370MB 5369MB primary lvm

    2 5370MB 7000MB 1631MB primary ext2 lba


    使用 `rm` 命令删除分区并选择分区号。

    ```bash

    (parted) rm

    Partition number? 2

    ```


    ## 使用 fdisk 创建分区


    语法

    ```bash

    fdisk device

    ```

    在此示例中，我们将在设备 `sdb` 上创建一个 5GB 的分区。

    ```bash

    fdisk /dev/sdb

    ```

    1. 交互式提示符输入 `n` 命令创建新分区。

    2. 输入分区类型：`p` 代表主分区，`e` 代表扩展分区。

    3. 选择分区号。按回车使用默认值。

    4. 按回车使用默认起始位置。

    5. 以 `MB`、`GB` 和 `KB` 输入大小，例如 `5G`。

    6. 使用 `p` 命令打印分区。

    7. 可选地，如果你需要更改文件系统，使用 `t` 命令并按 `L` 列出文件系统类型。输入 ID，如 Linux 的 `83` 和 LVM 的 `8e`。

    8. 使用 `w` 命令写入更改。

    ```bash

    (fdisk) w

    ```

    分区表已更改。调用 `ioctl()` 重新读取分区表。正在同步磁盘。


    ---


    #### 本地文件系统管理


    在本章中我们将涵盖本地文件系统的管理：

    * 创建文件系统

    * 删除文件系统

    * 挂载文件系统

    * 卸载文件系统

    * 创建 LVM 卷组

    * 删除 LVM 卷组

    * 创建逻辑卷

    * 删除逻辑卷


    ### 创建文件系统

    在创建文件系统之前，你应该决定想要创建哪类型的文件系统。


    #### 创建 XFS 文件系统

    语法

    ```bash

    mksfs.xfs /dev/sdb1

    ```

    示例

    ```bash

    mksfs.xfs /dev/sdb1

    ```


    #### 创建 ext4

    语法

    ```bash

    mkfs.ext4 /dev/sdb1

    ```

    示例

    ```bash

    mkfs.ext4 /dev/sdb1

    ```


    ### 挂载文件系统

    在 Linux 系统中要使用文件系统，你必须先挂载它。挂载至少需要两个要素：挂载设备和挂载点。


    #### 挂载设备

    挂载设备是你想要用于数据的块设备或远程文件系统。


    列出所有块设备

    ```bash

    lsblk

    ```

    可以通过以下标识符识别挂载文件系统：

    * `UUID`：设备的通用唯一标识符。这是挂载设备的最佳方式，因为 UUID 保持不变。你可以使用 `blkid` 命令获取设备的 UUID。

    * `Device name`：设备的路径名称，例如 `/dev/sdb1`。

    * `Label`：标签，例如 `LABEL=data1`。你可以使用 `e2label` 查看或更改 ext 文件系统的标签。使用 `xfs_admin`
    命令设置或列出 XFS 文件系统的标签。


    #### 挂载点

    挂载点是访问该挂载设备的链接。挂载点是一个普通目录。一旦挂载，设备成为该目录的一部分，你可以在此目录下访问文件系统的内容。


    #### mount 命令

    `mount` 命令用于挂载文件系统。


    语法

    ```bash

    mount -t type -o options dir

    ```

    挂载文件系统需要以下参数：

    * `type`：文件系统类型，可以是 `xfs`, `ext4`, `nfs` 等。

    * `options`：选项，如 `rw`（读写）、`ro`（只读）、`loop`（ISO 质）。

    * `device`：设备名称。

    * `dir`：挂载点。


    示例

    ```bash

    mount -t ext4 /dev/sdb1 /mnt

    ```


    ### 自动挂载

    如果你希望文件系统在每次启动时自动挂载，可以使用 `/etc/fstab` 文件。


    `fstab` 文件的格式如下：

    `firstsecond third fourth fifth sixth`


    | 字段 | 描述 |

    | :--- | :--- |

    | 第一 | 块设备或远程文件系统 |

    | 第二 | 挂载点 |

    | 第三 | 文件系统类型 |


    '
- fmt: '

    | Level | Description |

    | :--- | :--- |

    | Fourth | Options, atleast one ro or rw. Other options are defaults: `rw`, `suid`,
    `dev`, `exec`, `auto`, `nouser`, and `async`. `noauto`: do not mount automatically
    or with `mount -a` command. `user`: allow a user to mount the file system. `owner`:
    allow device owner to mount. |

    | Fifth | Dump option, default is `0` for no dump. |

    | Sixth | File system check priority for `fsck`. |


    ## Example


    ```

    /dev/mapper/cl-root/ xfs defaults 0 0

    UUID=095af347-cb2c-4d50-99b6-xxx/boot ext4 defaults 1 2

    /dev/mapper/cl-swap swap swap defaults 0 0

    LABEL=data1/data1 ext4 defaults 0 0

    /dev/sdb2/data2 xfs defaults 0 0

    ```


    ## Manually mount all devices in the fstab with auto option

    ```bash

    mount -a

    ```


    ## Manually mount single device in the fstab.

    ### Syntax

    ```bash

    mount mount_point

    ```

    No need to specify the device name.


    ### Example

    ```bash

    mount /data2

    ```


    ## List all mounted file systems

    ```bash

    mount

    or

    findmnt

    ```


    ## List specific fileystems type

    ```bash

    findmnt -t xfs

    ```


    ## Unmounting a file system

    ### Syntax

    ```bash

    umount mount_point

    ```

    ### Example

    ```bash

    umount /data1

    ```

    If you get “target is busy” error when you unmount a file system, use `fuser`
    command to list all processes using filesystem.


    ### Syntax

    ```bash

    fuser --mount mountpoint

    ```

    ### Example

    ```bash

    fuser --mount /data1

    ```


    ## Remove file system

    To delete a file system, we must first unmount it.

    ### Example

    ```bash

    umount /dev/sda2

    ```

    Then we can delete the partition from the partition table using `fdisk` or `parted`.


    ### Example

    ```bash

    fdisk /dev/sda2

    ```

    Select the option `d` to delete the partition.

    Write the changes to the partition table by selecting `w`.


    # Chapter 13: Logical Volume Management


    LVM or `Logical Volume Manager` allows creation of group of disk and partitions
    that can be used as one disk. Creates an abstraction layer between physical devices
    and logical devices. The benefits of LVM are below:


    - **Flexibility**: allows resize.

    - **Snapshot**: take point in time copy of Logical Volume.


    Conventional setup of disk is below:


    | File systems | / | /opt | /home |

    | :--- | :--- | :--- | :--- |

    | Partitions | `/dev/sda1` | `/dev/sda2` | `/dev/sda3` |

    | Physical devices | `/dev/sda` | `/dev/sdb` | |


    This setup has disks then partitions and above partitions there are file systems.


    ## LVM setup


    | File systems | / | /home | /var |

    | :--- | :--- | :--- | :--- |

    | Logical Volume | `/dev/sda1` | `/dev/sda2` | `/dev/sda3` |

    | Volume Group | `Vg01` | | |

    | Physical Volume | `/dev/sda` | `/dev/sdb` | |


    ### Physical volume

    Physical Volume (`PV`) is underlying physical storage unit. Physical storage is
    a block device such as a partition or whole disk. Use `pvcreate` command to use
    the physical device as Physical Volume. If block device is a partition, then use
    `fdisk` to change the partition type to `8e (Linux LVM)` before using `pvcreate`
    command.


    ### Create PV

    ### Syntax

    ```bash

    pvcreate device

    ```

    ### Example

    ```bash

    pvcreate /dev/sdb

    ```

    ### If device is a partition

    #### Change partition type as LVM

    ```bash

    fdisk /dev/sda (Refer the partition chapter to change partition type)

    ```

    #### now create PV

    ```bash

    pvcreate /dev/sda3

    ```


    ## Volume Groups

    One or more physical volumes combined together to make a Volume Group (`VG`).
    Volume group is an abstract that presents underlying devices as a unified logical
    device with combined storage capacity of the physical volumes.


    ### To create Physical Volume

    Note: The text says "To create Physical Volume" but provides syntax for `vgcreate`.

    ### Syntax

    ```bash

    vgcreate vgname PV1 PV2 ..

    ```

    ### Example

    ```bash

    vgcreate vg01 /dev/sdb /dev/sdc

    ```


    ## Logical Volume

    Logical Volume is logical partitioning of the volume group. Logical volume can
    be used for file system creation. In some cases, you can also use `LV` as block
    device.


    ### To create LV

    ### Syntax

    ```bash

    lvcreate -n name -L size VG_name

    ```

    ### Example

    ```bash

    lvcreate -n data_lv -L 5G vg01

    ```


    ## File system

    ### To create XFS filesystem on the LV

    ### Syntax

    ```bash

    mkfs.xfs lv_name

    ```

    ### Example

    ```bash

    mkfs.xfs /dev/vg01/data_lv

    ```

    ### To create ext filename on LV

    ### Syntax

    ```bash

    mkfs.ext4 lv_name

    ```

    ### Example

    ```bash

    mkfs.ext4 /dev/vg01/data_lv

    ```


    ## Two more terms in LVM is worth mentioning

    - **Physical Extent**

    - **Logical Extent**


    ### Physical Extent

    Storage space from Physical Volume is divided in to small unit of fixed size known
    as physical extent, which is smallest unit that can be allocated. `P.E.` size
    is always same for all physical volume in the same `VG`.


    ### Logical extent

    Mapping of `PE` to make up frontend of `LVM`. By default, one `PE` is generally
    mapped to one `LE`. However, you can map more than one `PE` to one `LE` in case
    of mirroring.


    ## LVM management commands


    ### PV management commands

    #### List all PVs

    ```bash

    pvs

    ```

    #### Display attributes

    Shows the attributes of `PVs`, like size, physical extent size, space etc.

    ```bash

    pvdisplay

    ```

    #### PV Resize

    If `PV` is... (Note: source text becomes fragmented here, following core commands)

    ```bash

    fuser --mount mountpoint

    fuser --mount /data1

    ```


    ### Remove file system

    To delete a file system, we must first unmount it.

    ### Example

    ```bash

    umount /dev/sda2

    ```

    Then we can delete the partition from the partition table using `fdisk` or `parted`.

    ### Example

    ```bash

    fdisk /dev/sda2

    ```

    Select the option `d` to delete the partition.

    Write the changes to the partition table by selecting `w`.


