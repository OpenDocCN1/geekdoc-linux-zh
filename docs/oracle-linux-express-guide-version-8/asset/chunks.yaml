    ### Example

    ```bash

    yum group remove “System Tools”

    ```


    # Chapter 15

    # Software Repositories


    A Linux repository is a storage location from where Linux updates operating system.
    Repositories are also used for installing new application and updating installed
    applications. Each repository is a collection of software hosted on a remote server
    or locally. Repository can be classified in to multiple branches like binaries,
    source codes, optional etc.


    To add new repository add entries in the `/etc/yum.conf` file, however it is recommended
    to create separate file for each repository in the `/etc/yum.repos.d` directory.
    The file extension for repository files should be `.repo`.


    The main components of repository files are:


    | `[repository]` | Each repository should have repository ID with starts the repository
    section |

    | `name=repository_name` | Name of the repository |

    | `baseurl=repository_url` | Location of the repository the location can be http
    , ftp or localHttp `[http://path/repo](http://path/repo)`FTP `[ftp://path/repo](ftp://path/repo)`Local
    `file:///path/repo` |

    | `enabled = 1` | Defines state of repository 1 for enabled and 0 for disabled
    |

    | `gpgcheck = 1` | Verify the GPG signature before installation |


    ![](Images/image00407.jpeg) Example


    ## Oracle Linux Repositories

    Unlike previous versions, Oracle Linux 8 comes with two main repositories.

    1. BaseOS

    2. Appstream


    ### BaseOS

    BaseOS is intended to provide core set of functionality and core components to
    OS independent to all types of installations. Which mean BaseOS repository is
    required for all set of installation even for headless installation.


    ### Appstream

    Appstream contains additional userspace applications, languages, databases etc.
    Appstream is intended for different set of workloads like http, database or file
    server. Appstream gets updates more frequently than BaseOS. Appstream is made
    up of `rpm` packages and modules.


    ## Repository management commands

    ### List all enabled repositories

    ```bash

    yum repolist

    ```


    ### List status of all repositories

    ```bash

    yum repolist all

    ```


    ### Add repository using repofile from internet

    ### Example

    ```bash

    yum config-manager --add-repo http://www.example.com/example.rep

    ```


    ### Enable/Disable repository using repofile

    You can enable or disable a repository by either editing repo file in the `/etc/yum.repo.d`
    or using `yum config-manager` command.


    To enable any repository using repo file:

    ![](Images/image00408.jpeg) open the repo file and change from `enabled=0` to
    `enabled=1`. To disable any repository, change from `enabled=1` to `enabled=0`.


    Using command:

    ### Enable any repository

    ### Syntax

    ```bash

    yum config-manager --set-enabled repo_name

    ```

    ### Example

    ```bash

    yum config-manager --set-enabled PowerTools

    ```


    ### Disable repository

    ### Syntax

    ```bash

    yum config-manager --set-disabled reponame

    ```

    ### Example

    ```bash

    yum config-manager --set-disabled PowerTools

    ```


    ### Clear cache after each modification

    ```bash

    yum clean all

    ```


    ## Set Up a Local repository

    In some cases, where internet is not available you have to create local repositories
    for software management. The steps for creating local repository are following:

    1. Create directory

    2. `mkdir /local_repo`

    3. Mount the DVD on `/mnt`

    ```bash

    mount /dev/cdrom /mnt

    ```

    Note: `cdrom` device name can be different

    4. Copy installation files to the server’s `/local_repo`

    ```bash

    cp -r /mnt/* /local_repo

    ```

    5. Copy the repo file to `/etc/yum.repos.d/`

    ```bash

    cp /local_repo/media.repo /etc/yum.repos.d/local_repo

    ```

    6. Change the permission of file

    ```bash

    chmod 644 /etc/yum.repos.d/local_repo

    ```

    7. Edit the configuration

    ```bash

    vi /etc/yum.repos.d/local_repo

    ```

    8. Changed file should look like

    ```ini

    [InstallMedia-BaseOS]

    name=Oracle Linux 8 BaseOS

    metadata_expire=-1

    gpgcheck=1

    enabled=1

    baseurl=file:///local_repo/BaseOS/

    gpgkey=file:///etc/pki/rpm-gpg/RPM-KEY-oracle


    [InstallMedia-AppStream]

    name=Oracle Linux 8 AppStream

    metadata_expire=-1

    gpgcheck=1

    enabled=1

    baseurl=file:///local_repo/AppStream/

    gpgkey=file:///etc/pki/rpm-gpg/RPM-KEY-oracle

    ```

    9. Clean the Cache

    ```bash

    yum clean all

    ```

    10. List repositories

    ```bash

    yum repolist

    ```

    ![](Images/image00409.jpeg)


    ## Repository for developers

    ### PowerTools

    Powertools repository is mainly for software developers. This repository contains
    number of packages required for building applications from source code.

    ### Enable

    ```bash

    yum config-manager --set-enabled PowerTools

    ```


    ## Third Party repositories

    To install software which are not available on these three repositories due license
    issues or scope, you can add third-party repositories. The most common third party
    repositories are:

    - EPEL

    - REMI

    - RPM Fusion


    ### EPEL repository

    EPEL or enterprise Linux repository is from fedora community containing packages
    which are not available from Oracle official repository due license limitation.
    Most common packages are chromium, codec for audio and videos.

    ### To add repository

    ```bash

    yum install https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm

    ```

    ### Enable

    ```bash

    yum config-manager --set-enabled epel

    ```


    ### REMI

    REMI is a free to use repository created and maintained by a Remi Collect. The
    REMI provides the latest versions of the PHP stack and some other software.

    ### Install

    ```bash

    yum -y install https://rpms.remirepo.net/enterprise/remi-release-8.rpm

    ```

    ### Enable

    ```bash

    yum config-manager --set-enabled remi

    ```


    ### RPM Fusion

    RPM Fusion provides proprietary multimedia software that the Oracle Linux doesn’t
    want to ship.

    ### Install

    ```bash

    yum install --nogpgcheck https://download1.rpmfusion.org/free/el/rpmfusion-free-release-8.noarch.rpm
    https://download1.rpmfusion.org/nonfree/el/rpmfusion-nonfree-release-8.noarch.rpm

    ```

    Note: This is single line command which will add both free and non-free RPM Fusion
    repositories.

