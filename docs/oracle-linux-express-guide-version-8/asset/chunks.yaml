    |  |  |  |  |


    This setup has disks then partitions and above partitions there are file systems.


    LVM setup


    | File systems | / | /home | /var |


    | Logical Volume | /dev/sda1 | /dev/sda2 | /dev/sda3 |


    | Volume Group | Vg01 |


    | Physical Volume | /dev/sda | /dev/sdb |


    |  |  |  |  |  |


    Physical volume


    Physical Volume (PV) is underlying physical storage unit. Physical storage is
    a block device such as a partition or whole disk. Use  pvcreate command to use
    the physical device as Physical Volume. If block device is a partition, then use
    fdisk to change the partition type to 8e (Linux LVM) before using  pvcreate command.


    Create PV


    Syntax


    pvcreate device


    Example


    pvcreate /dev/sdb


    If device is a partition


    Change partition type as LVM


    fdisk /dev/sda (Refer the partition chapter to change partition type)


    now create PV


    pvcreate /dev/sda3


    Volume Groups


    One or more physical volumes combined together to make a Volume Group (VG). Volume
    group is an abstract that presents underlying devices as a unified logical device
    with combined storage capacity of the physical volumes.


    To create Physical Volume


    Syntax


    vgcreate vgname PV1 PV2 .. 


    Example


    vgcreate vg01 /dev/sdb /dev/sdc


    Logical Volume


    Logical Volume is logical partitioning of the volume group. Logical volume can
    be used for file system creation. In some cases, you can also use LV as block
    device.


    To create LV


    Syntax


    lvcreate -n name -L size  VG_name


    Example


    lvcreate -n data_lv -L 5G vg01


    File system


    To create XFS filesystem on the LV


    Syntax


    mkfs.xfs lv_name


    Example


    mkfs.xfs /dev/vg01/data_lv


    To create ext filename on LV


    Syntax


    mkfs.ext4 lv_name


    Example


    mkfs.ext4 /dev/vg01/data_lv


    Two more terms in LVM is worth mentioning


    *   Physical Extent


    *   Logical Extent


    Physical Extent


    Storage space from Physical Volume is divided in to small unit of fixed size known
    as physical extent, which is smallest unit that can be allocated. P.E. size is
    always same for all physical volume in the same VG.


    Logical extent


    Mapping of PE to make up frontend of LVM. By default, one PE is generally mapped
    to one LE. However, you can map more than one PE to one LE in case of mirroring.


    LVM management commands


    PV management commands


    List all PVs


    pvs


    Display attributes


    Shows the attributes of PVs, like size, physical extent size, space etc.


    pvdisplay


    PV Resize


    If PV is coming from storage or vitrtual storage you have option to change size
    of virtual device or LUN. To update LVM with the new size of physical storage.


    Syntax


    pvresize device


    Example


    ![](Images/image00402.jpeg)![](Images/image00403.jpeg)![](Images/image00404.jpeg)pvresize
    /dev/sda


    Remove PV


    If for some reason the PV is no more used by LVM you can remove the PV using pvremove
    command


    Syntax


    pvremove device


    Example


    pvremove /dev/sda


    Rescan system for PVs


    pvscan scans all block devices in the system for PVs.


    Syntax


    pvscan --cache


    VG management commands


    Display summary all VGs.


    Syntax


    vgs


    Example


    [root@Server1 ~]# vgs


      VG #PV #LV #SN Attr   VSize   VFree


      cl   1   2   0 wz--n- <19.00g    0 


    Display VG properties


    vgdisplay displays properties of VG such as size, extents, number of physical
    volumes etc)


    Syntax


    vgdisplay


    To view specific VG


    Syntax


    vgdisplay vgname


    Example


    vgdisplay vg01


    Scans all the disks for VG


    To scans all the disks for volume groups and rebuilds the LVM cache file use  vgscan
    command.


    Syntax


    vgscan


    Adding Physical Volumes to a Volume Group


    To increase the space of VG you can add additional physical volumes to an existing
    volume group. To extend the VG use the  vgextend command.


    Syntax


    vgextend vgname new_PV


    Example


    vgextend vg01 /dev/sdc


    Use  vgscan command to rescan for VGs on the system.


    Example 


    [root@Server1 ~]# vgscan


    Found volume group "cl" using metadata type lvm2


    Remove PV from VG


    To remove the physical volume from VG you can use  vgreduce command. Before reducing
    VG make sure there is no data on the PV.


    Syntax


    vgreduce vgname pv_name


    Example


    vgreduce vg01 /dev/sdc


    Change VG


    You can deactivate an active VG and vice versa using  vgchange command. VG in
    deactivated state can be used.


    Syntax


    vgchange -a n vgname


    Example


    vgchange -a n vg01


    same way you can activate VG also.


    Example


    vgchange -a y vg01


    Remove VG


    When vg is no more required and there is no LV on the VG you can remove it.


    Syntax


    vgremove vgname


    example


    vgremove vg01


    Rename VG


    For some reason if you have to rename a VG


    Syntax


    vgrename vgname new_vgname 


    Example


    vgrename vg01 vg02


    Moving a Volume Group to Another System


    To move volume group from one system to another first you have to export the volume
    group from the original system and then import into the target system. The export
    VG command insure the removal of VG information from the system so that next time
    it will not complain about missing VG.


    Syntax


    vgexport vgname


    Example


    vgexport vg01


    On the target machine


    Syntax


    vgimport vgname


    Example


    vgimport vg01


    Logical volume


    list logical volume on the system


    lvs


    Show the properties of the Logical volume or volumes.


    lvdisplay


    Remove a LV


    To remove a logical volume, make sure it is not in use anymore.


    Syntax


    lvremove vgname/lvname


    Example


    lvremove vg01/lv01


    Extend the file system size


    in this section we will go through the practical scenario in which one the filesystem
    with LVM configuration is full. To extend the file system we will use following
    procedure:-


    Check the filesystem and its LV


    df -hT


    Add the new disk to the system


    Check if new disk is visible


    lsblk


    or


    fdisk -l


    Create PV for new disk


    pvcreate /dev/sdb


    Check the new PV


    pvs


    Extend the VG with filesystem to be extended


    vgextend vg01 /dev/sdb


    Extend the LV and filesystem


    Use this command to increase the size of LV and filesystem over it. This command
    will increase the size of LV by 20 GB and also extend the respective filesystem.  


    lvextend -L 20G -r vg01/lv-root'
