    \ move to a workspace, Click Activities and select the workspace or press `Super`\
    \ + `Page Down` and `Super` + `Page Up` on your keyboard.\n\n# Chapter 6 Exploring\
    \ Command line\n\nIn the last chapter we have discussed Graphical user interface\
    \ but Linux is known for command line. As command line provides more power and\
    \ flexibility. A command line interface (`CLI`) is a text-based user interface\
