    \n## 用户访问控制\n\n由于 crontabs 可能会对系统产生危害，你可以通过 `/etc/cron.allow` 和 `/etc/cron.deny`\
    \ 文件来控制用户使用 crontab 文件进行任务调度的权限。在这两个文件中的任意一个文件中添加用户名，即可允许或拒绝对 crontab 的访问。为了避免混淆，如果\
    \ `/etc` 目录下存在 `cron.allow` 文件，则不会使用 `cron.deny` 文件。如果两个文件都不存在，则只有 root 用户可以使用\
    \ crontab 文件。\n\n### 列出 crontab \n```\ncrontab -l\n```\n\n### 删除用户的 crontab\n\
    ```\ncrontab -r\n```\n\n`root` 用户可以使用 `-u` 参数更改其他用户的 crontab。\n\n### 示例\n```\n\
    crontab -u user2 -l\n```\n\n## At\n\n与 cron（允许你在指定的日期和时间定期运行任务）不同，`at` 命令主要用于调度临时任务。`at`\
    \ 命令由 `atd` 守护进程控制。要使用 `at` 命令，`atd` 守护进程必须处于运行状态。\n\n### 安装\n```\nyum install\
    \ at\n```\n\n### 启动并启用\n```\nsystemctl start atd\nsystemctl enable atd\n```\n\n\
    ### 检查 atd 守护进程状态\n```\nsystemctl status atd\n```\n\n### 添加任务\n使用指定时间和从现在起计算的天数执行\
    \ `at` 命令。\n```\nat 4pm + 3 days\n```\n该命令将打开交互式 `at` 提示符，用于编写你想要在 3 天后下午 4 点调度的命令或脚本名称。按下\
    \ `Ctrl + d` 键退出 `at` 提示符。\n\n### 不通过交互提示符添加任务\n```\nat time -f scriptname\n```\n\
    \n### 示例\n```\nat 4pm + 3 days -f /etc/opt/backup1.sh\n```\n\n### 列出已调度的任务\n```\n\
    atq\n```\n\n### 删除已调度的任务\n```\natrm job_number\n```\n\n### 示例\n```\natrm 3\n```\n\
    \n## 第 28 章：重置忘记的 root 密码\n\n要重置未知的 root 密码，请按照以下步骤：\n\n1. 重启机器并在 GRUB 菜单按下 `e`\
    \ 键。\n2. ![](img/image00427.jpeg)找到以 `Linux` 开头的行，使用 `Ctrl+e` 将光标移动到行尾并输入 `rd.break`。\n\
    3. 按下 `Ctrl + x` 键。\n4. 系统将给出只读根文件系统的提示符。\n5. 将文件系统重新挂载为读写模式\n```\nmount -o remount,rw\
    \ /sysroot\n```\n6. 切换根目录\n```\nchroot /sysroot\n```\n7. 修改密码\n```\npasswd\n```\n\
    8. 创建 `autorelabel` 文件以便在下次启动时启用 SELinux 重新标记过程。\n```\ntouch /.autorelabel\n```\n\
    9. 输入 `exit` 并按回车。\n10. ![](img/image00428.jpeg)再次输入 `exit` 并按回车键以正常模式启动系统。\n\n"
