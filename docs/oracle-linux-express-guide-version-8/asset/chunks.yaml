    Although GPT brings many advantages, but MBR is still the most compatible and
    widely used partition schema.


    In this chapter we will learn to create, delete, and modify various types of disk
    partitions.


    There are a couple of utilities for partition management:

    * `parted`

    * `fdisk`


    ## Parted


    `parted` is a command line tool that can manage partition tables.


    ### Display partition layout

    Syntax

    ```bash

    parted -l

    ```

    This command will display partition layout of all block devices.


    ### To display partition table of specific block device

    Syntax

    ```bash

    parted device print

    ```

    Example

    ```bash

    parted /dev/sda print

    ```


    ### Use parted interactively

    Enter `parted` command with device name. Suppose new disk is `sdb`.

    ```bash

    parted /dev/sdb

    ```

    it will start the interactive session.


    ### Create partition table on a disk

    Start `parted`

    Syntax

    ```bash

    parted device_name

    ```

    Where `device_name` is disk name.

    Example

    ```bash

    parted /dev/sda

    ```


    ### Create partition

    Syntax

    ```bash

    mkpart part-type name fs-type start end

    ```

    Where:

    | column | description |

    | :--- | :--- |

    | `part-type` | can be primary, logical, or extended for MBR partition table.
    |

    | `name` | partition name required for GPT partition tables. |

    | `fs-type` | can be `xfs`, `ext2`, `ext3`, `ext4`, `fat16`, `fat32`, `hfs`, `hfs+`,
    `linux-swap`, `ntfs`, or `reiserfs`. The `fs-type` parameter is optional because
    `parted` does not create the file system on the partition. |

    | `start and end` | are sizes that determine the starting and ending points of
    the partition. Size suffixes, such as `MiB`, `GiB`, or `TiB`. The default size
    is megabytes. |


    Example

    ```bash

    (parted) mkpart primary xfs 1 5GiB

    ```


    ### List the partition using print command

    ```bash

    (parted) print

    ```

    Model: VMware, VMware Virtual S (scsi)

    Disk `/dev/sdb`: 10.7GB

    Sector size (logical/physical): 512B/512B

    Partition Table: msdos

    Disk Flags:

    Number Start End Size Type File system Flags

    1 1049kB 5369MB 5368MB primary xfs lba


    use `quit` command to exit `parted`.

    ```bash

    (parted) quit

    ```

    Information: You may need to update `/etc/fstab`.


    ### Remove partition using parted

    In the `parted` interactive session select the `parted` device.

    Example

    ```bash

    parted /dev/sdb

    ```


    ### Display the current partition table

    ```bash

    (parted) print

    ```

    Model: VMware, VMware Virtual S (scsi)

    Disk `/dev/sdb`: 10.7GB

    Sector size (logical/physical): 512B/512B

    Partition Table: msdos

    Disk Flags:

    Number Start End Size Type File system Flags

    1 1049kB 5370MB 5369MB primary lvm

    2 5370MB 7000MB 1631MB primary ext2 lba


    Remove the partition with `rm` command and select the partition number.

    ```bash

    (parted) rm

    Partition number? 2

    ```


    ## Create partition using fdisk


    Syntax

    ```bash

    fdisk device

    ```

    In this example we will create a 5GB partition on device `sdb`.

    ```bash

    fdisk /dev/sdb

    ```

    1. Interactive prompt give `n` command to create new partition.

    2. Enter partition type `p` for primary and `e` for extended.

    3. Select the partition number. Press enter for default.

    4. Press enter to use default start.

    5. Enter size in `MB`, `GB` and `KB` like `5G`.

    6. Use `p` command to print the partitions.

    7. Optionally if you required to change filesystem using `t` command and press
    `L` to list the filesystem type. Enter the id like `83` for Linux and `8e` for
    LVM.

    8. Use `w` command to write the changes.

    ```bash

    (fdisk) w

    ```

    The partition table has been altered. Calling `ioctl()` to re-read partition table.
    Syncing disks.


    ---


    #### Management of local file system


    In this chapter we will cover management of local file system:

    * Create a file system

    * Remove a file system

    * Mount a file system

    * Unmount a file system

    * Create LVM volume groups

    * Remove LVM volume groups

    * Create logical volumes

    * Remove logical volumes


    ### Create file system

    Before creating file system you should decide which type of file system you want
    to create.


    #### Create XFS filesystem

    Syntax

    ```bash

    mksfs.xfs /dev/sdb1

    ```

    Example

    ```bash

    mksfs.xfs /dev/sdb1

    ```


    #### Create ext4

    Syntax

    ```bash

    mkfs.ext4 /dev/sdb1

    ```

    Example

    ```bash

    mkfs.ext4 /dev/sdb1

    ```


    ### Mount file system

    In Linux based systems to use file system you have to first mount it. Mounting
    require minimum two things: mount device and mount point.


    #### Mount device

    Mount device is the block device or remote filesystem you want to use for data.


    List all block devices

    ```bash

    lsblk

    ```

    To mount file system you can identify the mount device by following identifiers:

    * `UUID`: UUID is the Universal Unique ID of the device. This is the best way
    to mount the device as UUID remain same. You can use `blkid` command to get UUID
    of device.

    * `Device name`: Device name is hierarchical name of the device it can be like
    `/dev/sdb1`.

    * `Label`: Volume label for example `LABEL=data1`. You can use `e2label` to check
    or change the label of ext file system. To set or list label of XFS file system
    use `xfs_admin` command.


    #### Mount point

    Mount point is the link for accessing this mount device. Mount point is the normal
    directory. Once mounted device becomes part of the directory and you can access
    the contents of file system under this directory.


    #### Mount command

    `mount` command can be used for mounting file system.


    Syntax

    ```bash

    mount -t type -o options device dir

    ```

    `mount` command require following parameter to mount the file system:

    * `type`: Type of file system it can be `xfs`, `ext4`, `nfs` etc.

    * `options`: Options like `rw` for read and write, `ro` for read only, `loop`
    for ISO media.

    * `device`: Device name.

    * `dir`: Mount Point.


    Example

    ```bash

    mount -t ext4 /dev/sdb1 /mnt

    ```


    ### Automatic mounting

    If you want to mount the filesystem to be mounted automatically on every boot
    you can use `/etc/fstab` file.


    `fstab` file has following format:

    `firstsecond third fourth fifth sixth`


    | Field | Description |

    | :--- | :--- |

    | First | Block device or remote file system |

    | Second | Mount point |

    | Third | File system type |

