    # Chapter 24: Logs management


    Logs are very important part of any operating system. logs are very helpful in
    troubleshooting and auditing of system. Oracle Linux keeps it most of the logs
    in central location `/var/log` directory. One of the important file is `/var/log/messages`
    where Oracle Linux logs the kernel / core system logs.


    ## Journalctl


    `Journald` is the service used for collecting and storing the logs data in the
    Oracle Linux. This service is used to manage the system log which includes boot
    messages, kernel logs, syslog messages, service messages and system error messages
    etc. By default, it keeps all logs in the memory and store logs only in a small
    ring-buffer in `/run/log/journal` directory. if persistent log configuration is
    enabled then it start storing logs under `/var/log/journal` directory.


    ### Configuration file


    The main configuration file for `journald` is `/etc/systemd/journald.conf`.


    ### Change the logs to persistent


    if you want save the logs permanently on your system you can configure storage
    variable in the configuration file to `auto` or `persistent`.


    ```ini

    [Journal]

    #Storage=auto

    #Compress=yes

    #Seal=yes

    #SplitMode=uid

    #SyncIntervalSec=5m

    #RateLimitIntervalSec=30s

    #RateLimitBurst=10000

    ```


    ### List the logs from the oldest entry


    ```bash

    journalctl

    ```


    ### List the logs from current boot


    ```bash

    journalctl -b

    ```


    ### List logs from yesterday


    ```bash

    journalctl --since yesterday

    ```


    ### List logs by specific Process ID


    Syntax

    ```bash

    journalctl -F _PID=PID

    ```


    Example

    ```bash

    journalctl -F _PID=2451

    ```


    ### View running logs


    ```bash

    journalctl -f

    ```

    To stop the view press `Ctrl + C`


    ### View specific number of recent entries


    ```bash

    journalctl -n10

    ```

    This command will show last 10 entries.


    ### The log entries of specific priority like all errors


    ```bash

    journalctl -p err

    ```


    ### To view all entries with warnings


    ```bash

    journalctl -p warning

    ```


    ## Rsyslog


    Rocket-fast Syslog Server or `rsyslog` is the very popular and old processing
    system used by most the Linux distributions. The log files contain messages about
    the system, kernel, services, and applications. Oracle Linux 8 uses `Rsyslog`
    as default logging service. `Journald` forwards all logs to `rsyslog`. `Rsyslog`
    stores all logs forwarded by `journald` in plain text format files under `/var/log/`
    directory. The main configuration file of `Rsyslog` is `/etc/rsyslog.conf`. Configuration
    file contains rule lines to store log messages. It has following parameters:


    - Facility

    - Priority

    - Actions


    | Facility | Facility is process or application generating message, Using `*`
    means all facilities. |

    | :--- | :--- |

    | Priority | Priority is type of log message, codes are `emerg` for emergency,
    `alert`, `crit` for critical, `err` for errors, `warn` for warnings, `info`, `debug`.
    Using `*` means all priority levels. |

    | Action | Action decides what action must be taken for the matched rule. |


    In the bellow example Facility is mail, Priority is all errors and Action is mail.err
    file


    ![](Images/image00421.jpeg)


    `Rsyslog` can also be used for forwarding to central log server.


    # Chapter 25: Understanding Processes


    Any program executed by the user or system starts process or processes to accomplish
    the task. Each process has its own process ID. This process ID is always unique
    during the lifetime of the process. There are two type of processes:


    | Foreground | A foreground process is any command or task you run directly on
    the terminal and wait for it to complete. Some foreground processes also require
    user interaction. |

    | Background | Unlike foreground process shell does not wait for process to complete.
    The background processes are non-interactive in the nature. |


    ## Daemons


    These are the special processes which runs in the background and generally not
    effected by user login and logout. There are two types of daemons: one which starts
    with system start others which gets triggered by process or command.


    ## Child and parent process


    When a process starts any new process, the new process is known as child process
    and the process which starts the process is known as parent processes. One parent
    process can have multiple child processes.


    ## The Init process


    The `Init` process is mother of all processes. It is the first program that executes
    when Linux system start. Therefore, the `Init` process is parent process of all
    other processes.


    The process id of the init process is always `1`.


    When processes die and its child processes are still active. then these child
    processes are known as orphan process. The `init` process adapts any orphan running
    process in the system.


    ## Find the process ID


    As mentioned each process has its own process ID. This process ID is very important
    for the system, as Linux internally recognise the process with its ID. To find
    out the processes ID of any running program


    Syntax

    ```bash

    pidof program_name

    ```


    Example

    ```bash

    pidof systemd

    ```


    ### Listing all processes.


    Prints the processes of the current shell


    ```bash

    ps

    ```


    List all active processes on the system

    ```bash

    ps -e

    ```


    List all process with Username


    ```bash

    ps -eu

    ```


    Show detailed process list


    ```bash

    ps -aux

    ```

    or

    ```bash

    ps -ef

    ```

    These above two commands show detailed information about the processes which includes
    process id and parent process ID.

