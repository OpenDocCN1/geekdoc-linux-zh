    # Software Management


    Oracle Linux distribution is based on RPM packages. Oracle Linux uses `.rpm` packages
    for installing software with `rpm` command. RPM package is simply a file that
    contains some files and information about those files. Technically speaking RPM
    is a file containing `cpio` archive and metadata about itself. RPM Header contains
    the metadata and this metadata is used to determine following things about the
    package:-


    - Description of package.

    - List of files in the package.

    - Version and release of package.

    - When and who made it.

    - Architecture supported.

    - Checksums of the files contained in the package.

    - Dependences.

    Etc…


    ## Package Management System


    If you try to install single package manually you have to first install all its
    dependencies and keep track of versions also. To make software management easy
    Linux companies have developed a system known as package management system or
    package manager. Package management system install precompiled packages, which
    are in form of archives containing binaries of software, configuration files,
    and information about dependencies. Package management system is a collection
    of software tools to automate the process of installation, upgradation and removal
    of software packages. Software manager maintains its own database of software
    dependencies and version information. Package management system helps in preventing
    software mismatches and missing prerequisites. Oracle Linux uses `YUM` tool for
    package management.


    ### YUM


    Like other Linux distributions, Oracle Linux uses very comprehensive package management
    system known as `YUM`. Yellow dog Updater Modifier is command line tool for package
    management. `Yum` uses repositories to fetch the correct version of a particular
    package compatible for your system. `yum` allows automatic updating of packages
    and dependency management. When you use `yum` command for installation of software,
    it automatically downloads package and all its dependencies from defined repositories.
    Oracle Linux version 8 uses `YUM v4` instead to `YUM v3` used in the earlier version.
    `YUM v4` tool, which is based on the `DNF` technology has the following advantages
    :


    - Better performance

    - Support for modular content (We will discuss later about modules)

    - Stable API for integration with tooling


    In Oracle Linux 8 has three application streams, each one with its own lifecycle:


    - `BaseOS` provides the basic operating system,

    - `AppStream` provides user applications,

    - `CodeReady Linux Builder` provides developer tools and languages.


    ## Package management


    ### Search package

    #### Syntax

    ```bash

    yum search package_name

    ```

    #### Example

    ```bash

    yum search httpd

    ```


    ### Display information about package

    #### Syntax

    ```bash

    yum info package_name

    ```

    #### Example

    ```bash

    yum info httpd

    ```


    ### List available packages

    ```bash

    yum list available

    ```


    ### Install packages from the default stream

    #### Syntax

    ```bash

    yum install package_name

    ```

    #### Example

    ```bash

    yum install httpd

    ```


    ### Install locally downloaded package

    #### Syntax

    ```bash

    yum localinstall package.rpm

    ```

    #### Example

    ```bash

    yum localinstall abc.rpm

    ```


    ### Removing package

    #### Syntax

    ```bash

    yum remove package_name

    ```

    #### Example

    ```bash

    yum remove httpd

    ```


    ### Update


    #### Update specific package

    #### Syntax

    ```bash

    yum update package_name

    ```

    #### Example

    ```bash

    yum update vsftpd

    ```


    #### Update whole system

    To update the system to latest level

    ```bash

    yum -y update

    ```


    #### Update only security patches

    ```bash

    yum -y update --security

    ```

    This command can increase the minor release of the system., in some cases it is
    not required then you can use more conservative approach to security update.

    ```bash

    yum update-minimal --security -y

    ```


    ### CVE

    Common Vulnerabilities and Exposures is a list of common identifiers for publicly
    known Cybersecurity vulnerabilities. Each `CVE` has unique ID assigned by central
    body.


    #### To install specific CVE.

    #### Syntax

    ```bash

    yum update --cve cve-id

    ```

    #### Example

    ```bash

    yum update --cve CVE-2017-1000392

    ```


    #### List all CVE

    ```bash

    yum updateinfo list cves

    ```


    ### Update advisory

    Update advisory is the list of packages with bug fixes.


    #### View update advisory

    ```bash

    yum updateinfo list

    ```


    #### Install specific advisory

    #### Syntax

    ```bash

    yum update --advisory=advisory_id

    ```

    #### Example

    ```bash

    yum update --advisory=RHBA-2020:0618

    ```


    #### Remove unwanted dependencies

    ```bash

    yum autoremove

    ```


    #### Display package which provide specific file

    #### Syntax

    ```bash

    yum whatprovides filename

    ```

    #### Example

    ```bash

    yum whatprovides /etc/hosts

    ```


    #### Clean yum cache

    ```bash

    yum clean all

    ```


    ### View History of Yum

    To view all the past transactions of `yum` command, just use the following command.

    ```bash

    yum history

    ```


    ## Modules


    In Oracle Linux 8 a new concept of modules has been introduced. Modules is the
    extension to `RPM`. A module is set of `RPM` packages that represent a component.
    A module typically contains application packages, its libraries, dependent packages
    and documentation including help files. Oracle Linux 8 can contain multiple versions
    of same package for example you can have two versions of `python` or `perl`. These
    packages have its own life cycle rather than Oracle Linux life cycle. When you
    install one version of module its dependencies and libraries will be automatically
    installed from the module. You can consider module as a virtual repository. For
    handling module `yum module` command has been introduced. The modules has extension
    module after `rpm` like example`example.rpm.module`.


    ### Streams and profiles


    #### Module Streams

    Modules are available in single or multiple streams which usually represent a
    version of a software, providing an option to choose what versions of packages
    you want to install. Module stream is like virtual repository. Each module may
    have a default stream which usually provides the latest or recommended version
    of the component. Default streams make it easy to install packages without the
    need to learn about modules. Modules make it possible to have multiple versions
    of software available to your system for installation.


    #### Module Profiles

    To simplify installation further, modules usually classified with set of specific
    set of packages for specific workload or user case. This list of packages is known
    as profile. A profile name can be anything like server, client, development, minimal
    install etc.


    ### Package management using modules


    #### List all available modules

    ```bash

    yum module list

    ```

    ![](Images/image0405.jpeg)


    It will show output in four columns:

    - Name of the module

    - Stream

    - Profile

    - Summary


    The output shows Steams and profiles with `[d]`, `[e]`, `[x]` and `[i]` in the
    stream and profile column which show the status of module’s stream and profile.
    Where `[d]` if for default, `[e]` for enabled, `[x]` for disabled, `[i]` installed.


    #### Display information about module

    #### Syntax

    ```bash

    yum module info module_name

    ```

    #### Example

    ![](Images/image0406.jpeg)

    ```bash

    yum module info nodejs

    ```


    #### Search which module provides specific package

    #### Syntax

    ```bash

    yum module provides package_name

    ```

    #### Example

    ```bash

    yum module provides php

    ```


    #### Display information about module’s profiles

    #### Syntax

    ```bash

    yum module info --profile module_name

    ```

    #### Example

    ```bash

    yum module info --profile nodejs

    ```


    #### Display information about specific profiles

    #### Syntax

    ```bash

    yum module info --profile module_name:stream

    ```

    #### Example

    ```bash

    yum module info --profile nodejs:12

    ```


    #### Install package from specific stream

    To install package for other stream first you have to enable that stream and then
    install the package

    #### Syntax

    ```bash

    yum module enable module_name:stream

    ```

    #### Example

    ```bash

    yum module enable nodejs:12

    ```


    #### Install module

    #### Syntax

    ```bash

    yum module install module_name

    ```

    #### Example

    ```bash

    yum module install nodejs

    ```

    This will install the module from default stream


    To install module of specific stream without enabling

    #### Syntax

    ```bash

    yum module install module_name:stream

    ```

    #### Example

    ```bash

    yum module install nodejs:10

    ```


    #### Install a selected profile of the module stream

    #### Syntax

    ```bash

    yum module install module_name:stream/profile

    ```

    #### Example

    ```bash

    yum module enable --profile httpd:2.4/devel

    ```


    #### Remove all packages from a selected stream

    #### Syntax

    ```bash

    yum module remove --all module_name:stream

    ```

    #### Example

    ```bash

    yum module remove --all nodejs:12

    ```


    #### Remove packages of particular profile

