  trans: "\n\n`nmtui hostname new_hostname`\n\n## Example\n```bash\nnmtui hostname\
    \ Server2\n```\n\n## nmcli\n\n`nmcli` 是一个用于管理网络的命令行工具。`nmcli` 可创建、显示、编辑、删除、激活和停用网络连接。`nmcli`\
    \ 是控制和显示网络设备状态非常有用的工具。\n\n### 列出网络设备及其状态\n#### 语法\n```bash\nnmcli device\n```\n\
    ![](img/image00394.jpeg)\n\n#### 示例\n#### 设备详细信息\n```bash\nnmcli device show\n\
    ```\n\n#### 列出连接\n```bash\nnmcli connection show\n```\n\n### 激活连接\n#### 语法\n```bash\n\
    nmcli connection up connection_name\n```\n#### 示例\n```bash\nnmcli connection up\
    \ ens35\n```\n\n### 停用连接\n#### 语法\n```bash\nnmcli connection down connection_name\n\
    ```\n\n#### 示例\n```bash\nnmcli connection down ens35\n```\n\n### 更改网络状态\n####\
    \ 语法\n```bash\nnmcli networking on/off\n```\n#### 示例\n```bash\nnmcli networking\
    \ off \n```\n\n### 显示主机名\n```bash\nnmcli general hostname\n```\n\n## Wifi 网络管理\n\
    ### 列出可用 WiFi AP\n```bash\nnmcli device wifi list\n```\n\n### 连接到密码保护的 Wifi 网络\n\
    #### 语法\n```bash\nnmcli device wifi connect \"SSID\" password \"password\"\n```\n\
    #### 示例\n```bash\nnmcli device wifi connect \"mynetwork\" password \"pa$$w0rd\"\
    \n```\n\n## GNOME GUI 网络管理器\n可以通过顶部栏系统菜单或设置中的两个 GUI 模式控制网络。\n\n### 连接无线连接\n如果系统已连接到无线网络，你将在桌面顶部栏看到\
    \ Wi-Fi 图标，否则请按照以下步骤连接到家庭或办公室无线网络：\n\n1. 点击系统菜单。\n2. 点击“未连接无线网络”以展开折叠菜单。\n3. ![](img/image00395.jpeg)点击“选择网络”。\n\
    4. 将打开新窗口并显示所有可用网络。选择您的 Wi-Fi 网络名称。点击“连接”。\n5. ![](img/image00396.jpeg)![](img/image00397.jpeg)如果网络受密码保护，在密码提示处提供密码并点击“连接”。\n\
    6. 现在您的网络已连接，顶部栏将显示 Wi-Fi 图标。\n\n### 更改 Wi-Fi 密码\n由于某些原因更改了路由器上的 Wi-Fi 网络密码，你必须在系统中也设置相同的密码，否则下次将无法连接。\n\
    \n1. 点击系统菜单。\n2. 点击“已连接无线”打开子菜单。\n3. 点击“更改设置”。\n4. 从可用网络列表中选择您的网络，并点击旁边的齿轮图标。\n\
    5. 在安全设置中更改密码并点击“确定”。\n\n## 有线网络\n连接有线网络非常简单，只需将网线插入电脑。系统将自动为可用网络进行配置。一旦系统连接到有线网络，顶部栏将显示系统指示器。\n\
    \n### 手动配置有线网络\n大多数情况下，有线网络设置是自动的，但在某些情况下你必须手动设置 IP 地址。这种配置被称为静态 IP 地址配置。\n\n\
    #### 配置静态 IP 地址：\n1. 打开系统菜单。\n2. ![](img/image00398.jpeg)点击“已连接有线”并选择“有线设置”。\n\
    3. 将打开网络设置窗口。\n4. 点击齿轮图标。\n![](img/image00399.jpeg)\n5. 打开有线配置对话框。\n6. 在 `Details`\
    \ 标签页中，确保勾选了 `Connect automatically`。\n7. ![](img/image00400.jpeg)点击 `IPv4` 标签卡。\n\
    1. 点击 `Manual` 单选按钮。\n2. 提供 IP 地址。\n3. 输入 `Netmask` 子网掩码。\n4. 输入 `Gateway` 网关。\n\
    5. DNS\n8. 点击 `Apply`。\n\n## 名称解析\n当你使用主机名而不是 IP 地址连接 Linux 主机时，你有以下选项将主机名解析为\
    \ IP 地址。\n\n* 本地文件，即 `/etc/hosts`\n* DNS 服务器\n* NIS\n\n### 本地文件 (/etc/hosts)\n\
    `/etc/hosts` 是存储主机名到 IP 地址映射的文件。它提供了在不使用 DNS 服务器的情况下解析主机名的能力。如果出于范围或安全原因连接到有限数量的主机，我们通常使用此文件。使用此文件的缺点是，一旦\
    \ IP 地址发生变化，管理员必须在所有服务器或 PC 上更改此文件。\n\n#### 格式\n`IP_address hostname aliases`\n\
    \n#### 示例\n```bash\n127.0.0.1 server1 localhost\n31::1 server1 localhost\n192.168.228.129\
    \ server1server1.example.com\n```\n\n### DNS\nDNS 服务器是一个中央存储库，包含 IP 地址及其关联主机名的数据库。每当任何客户端想要将主机名解析为\
    \ IP 地址而不是使用其本地文件时，它会向 DNS 服务器发送请求。如果某些客户端的 IP 地址发生变化，你只需要更新 DNS 条目。一个组织内可以有多个\
    \ DNS 服务器。为了重定向主机名解析请求，Oracle Linux 使用 `/etc/resolve.conf` 文件。默认情况下，Oracle Linux\
    \ 8 上的 `NetworkManager` 会动态更新 `/etc/resolv.conf` 文件。但是根据你的需求，你可以通过 `NetworkManager`\
    \ 禁用 DNS 处理。\n\n## 成组 (Teaming)\n成组允许将多个物理以太网适配器组合到一个逻辑适配器中。该逻辑网络适配器提供更高的吞吐量或冗余。\n\
    \n### 成组模式\n| 模式 | 说明 |\n| :--- | :--- |\n| 轮询 (Round-robin) | 在此模式下，数据在所有端口之间传输。\
    \ |\n| 广播 (Broadcast) | 数据在所有端口传输。 |\n| 负载均衡 (Load-balance) | 流量在所有网卡之间分配。 |\n\
    | 主备 (Active-backup) | 其中一个链路激活，其余的备用以提供冗余。 |\n| LACP | 使用 802.3ad 协议进行链路聚合。 |\n\
    \n#### 安装 teaming 包\n```bash\nyum install team\n```\n\n#### 创建主备组\n```bash\nnmcli\
    \ connection add type team con-name bond0 ifname bond0 mode \"activebackup\"\n\
    ```\n\n## 重要网络命令\n### 显示 IP 地址\n```bash\nip addr\n```\n\n### 显示链路状态\n![](img/0401.jpeg)ip\
    \ show\n\n### 检查并更改主机名\nLinux 计算机的称为主机名。要更改主机名，可以使用 `hostnamectl`。\n\n#### 显示当前主机名\n\
    ```bash\nhostnamectl\n```\n\n#### 更改主机名\n#### 语法\n```bash\nhostnamectl set-hostname\
    \ newname\n```\n#### 示例\n```bash\nhostnamectl set-hostname myhost1\n```\n\n###\
    \ 显示路由表\n```bash\nip route\n```\n\n### 检查网络连通性\n#### 语法\n```bash\nping ipaddress/hostname\n\
    ```\n#### 示例\n```bash\nping 192.110.22.121\n```\n\n如果你感兴趣使用命令行更改 IP 地址，请尝试 `nmcli`\
    \ 命令。查看更多信息请参考示例命令。\n\n## 网络工具\n（注意：以下工具用于网络诊断）\n\n### dig\nDNS 查询并显示结果\n####\
    \ 语法\n```bash\ndig hostname\n```\n#### 示例\n```bash\ndig microsoft.com\n```\n\n\
    ### telnet\n连接目标主机:端口。你也可以使用 `telnet` 测试主机和端口的连通性。\n#### 语法\n```bash\ntelnet hostname\
    \ port\n```\n#### 示例\n```bash\ntelnet myserver1 8080\n```\n\n### nslookup\n查询互联网域名服务器\n\
    #### 语法\n```bash\nnslookup hostname\n```\n#### 示例\n```bash\nnslookup microsoft.com\n\
    ```\n\n### scp\n通过网络以安全方式从一个主机复制文件到另一个主机。\n#### 语法\n```bash\nscp filename user@targetserver:/path\n\
    ```\n#### 示例\n```bash\nscp ast.txt user1@server2:/home/user1\n```\n\n### ssh\n\
    安全登录目标服务器。\n#### 语法\n```bash\nssh user@targethost\n```\n#### 示例\n```bash\nssh\
    \ user1@server2\n```\n\n### nmap\n检查服务器上开启的端口\n#### 语法\n```bash\nnmap hostname\n\
    ```\n#### 示例\n```bash\nnmap cloudflare.com\n```\n"
