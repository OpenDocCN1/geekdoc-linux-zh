    \ |\n| g | 组 |\n| o | 其他 - 给其他用户授予权限。实际上，这意味着其他人。 |\n\n#### 权限\n权限定义了允许在文件或目录上执行的操作。这些操作是读、写和执行。...（后续以此类推）\n\
