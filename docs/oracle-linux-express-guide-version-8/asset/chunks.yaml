    \ access the command line interface. But before going ahead with command line\
    \ we should know some basics of command line.\n\n## Bash\n\nBourne-Again Shell,\
    \ `bash` is Linux shell that provides interface to the user to input commands\
    \ and present output as its result. You have choice of multiple shells on the\
    \ Linux like `Korn`, `C shell` and `Z shell` etc, but `bash` is the default shell\
    \ available in the Oracle Linux. However, you can use other shells also if required.\
    \  Bash shell can be used in two ways, interactive and in the script also known\
