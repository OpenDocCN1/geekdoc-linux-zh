    \ /home/f1/\n```\n\nHere `cp` is command. `-R` is option, there can be multiple\
    \ options in the same command. Rest is the argument. there can be multiple arguments\
    \ depending on the command.\n\n## Virtual Consoles\n"
  raw: 'Left side of the Activities overview screen shows the list of workspaces.
    Workspaces are virtual desktops for better windows management. You can create
    multiple workspaces. Workspaces are meant to reduce mess on the single desktop
    and make the desktop easier to navigate.


    Click on the workspace to switch workspace. To move the application to different
    workspace just drag the running application to new workspace.


    Dash


    ![](Images/image00367.jpeg)![](Images/image00368.jpeg)On the left side of the
    desktop you will find the Dash bar. The Dash provides access to your favourite
    and running applications. Click the application icon on the dash bar to open the
    application. The small dot at the bottom of icon indicates running application.
    Click on any running application icon brings most recent window of the application.


    Right click on the icon to open context menu. From this menu you can open new
    window or pick any window of a running application. You can also add or remove
    any application to favourites from this menu.


    Grid


    ![](Images/image00369.jpeg)At the bottom of the dash bar there is grid icon. Click
    on this icon shows the list of all and frequently used applications. The icons
    are in grid format, from the bottom of the grid you can switch between all applications
    and frequently used applications. The list of applications can span multiple pages,
    to navigate to next page use scroll (centre) wheel of mouse or click the dots
    on the right side of the grid.


    Some applications in the grid are contained in the application folder. Click application
    folder to list the grid of all containing applications.


    ![](Images/image00370.jpeg)


    ![](Images/image00371.jpeg)Application menu


    Located beside the Activities button, application menu shows the name of the active
    application. Also provides other options specific to the active application. 


    System settings


    ![](Images/image00372.jpeg)![](Images/image00373.jpeg)Click on system setting
    icon in the system menu will open settings windows for system and hardware. Setting
    screen has two panes, left pane shows the list of settings and right pane provides
    the description of the selected setting. You can scroll the list of settings with
    mouse’s scroll wheel. Suppose you want to change the background of your desktop.
    Click background in the left pane and select the wallpaper from the list of available
    wallpapers in the right pane.


    Top bar of the system setting tool also houses search button. Search button offers
    you to search anything related to settings. Suppose you want to look for date
    and time settings, just press search button and write date. The system will show
    you list of items related to date in the left pane.


     ![](Images/image00374.jpeg)Log out


    After finishing your task, it is good practice to logout from the system. The
    logout option closes all running application started by the user in the current
    session. To logout as current user press user name from the system menu. From
    the sub menu press Log Out. On the confirmation popup press logout again.


    Lock screen


    ![](Images/image00375.jpeg)When you are away from your machine for short period
    of time it is recommended to lock your screen so that nobody can use your computer
    in your absence. When system screen is in lock state, all the running application
    will continue to run. To log back, provide your login password to unlock the screen.
    System also locks the screen automatically, if you leave your computer for a specific
    time period.


    To lock the screen manually, click the system menu on the right side of the top
    bar, click Lock icon.


    To unlock, press ENTER key on the locked screen and provide your password.


    ![](Images/image00376.jpeg)Power off or Restart


    To shutdown or reboot the server through GUI, click the system menu on the right
    side of the top bar, click Power Off button. At the dialog box, press the button
    you want.


    ![](Images/image00377.jpeg)


    Windows


    Gnome uses windows to display your running applications. This is one of the ways
    to do multitasking. Whenever you launch any application, it opens in a new window.
    In this section, we will explore windows operations.


    List windows


    To show all the running windows just click Activities button. From the list of
    windows press left button of mouse to select any window.


    Switch window


    You can switch the window using keyboard, press Super key + TAB to open windows
    switcher. Hold Super key, release and press TAB key to cycle between open windows.  


    ![](Images/image00378.jpeg)Please note: Super key is an alternative name for the
    Windows key when using Linux.


    Maximize and unmaximize a window


    You can maximize a window to view its content on whole desktop and unmaximize
    or restore down a window to restore it to its normal size.


    Maximize the Window


    To maximize a window, press and hold left button of mouse at title bar of the
    window to grab the window title bar, now drag it to the top bar. Other way to
    maximize, is to double click left button of mouse on the title bar of window.
    To maximize a window using the keyboard press Alt + F10.


    Unmaximize window


    To restore a window to its normal size grab the window title bar and drag away
    from the top bar or just double click title bar of window.  Press Alt + F10 on
    the key board to unmaximize the windows using keyboard.


    Tile Windows (Snap Windows)


    ![](Images/image00379.jpeg)To copy files or to compare content of two windows
    you can place two windows side-by-side. In Microsoft windows, this feature is
    known as windows Snap. To snap window to left side press Super + left Arrow and
    to snap window right side of screen select the window, press Super + right arrow
    key on the keyboard. To snap window using mouse, grab the title of window and
    drag it to the left or right side until half of the screen is highlighted.


    Switch workspaces


    ![](Images/image00380.jpeg)Workspaces are virtual desktops. It is like having
    more than one monitors virtually on same desktop. If you are working on several
    applications at same time, workspace is good option to organize them. To move
    one application from current workspace to another workspace, press Activities
    to view the list of windows and workspaces. Grab the title of widow and move to
    new workspace from the list of workspaces on right side of screen.


    To move to a workspace, Click Activities and select the workspace or press Super
    + Page Down and Super + Page Up on your keyboard.


    Chapter 6  


    # Exploring Command line


    In the last chapter we have discussed Graphical user interface but Linux is known
    for command line. As command line provides more power and flexibility. A command
    line interface (CLI) is a text-based user interface (UI) used to manage Linux.
    In this chapter we will discuss various ways to access the command line interface.
    But before going ahead with command line we should know some basics of command
    line.


    Bash


    Bourne-Again Shell, bash is Linux shell that provides interface to the user to
    input commands and present output as its result. You have choice of multiple shells
    on the Linux like Korn, C shell and Z shell etc, but bash is the default shell
    available in the Oracle Linux. However, you can use other shells also if required. 
    Bash shell can be used in two ways, interactive and in the script also known as
    shell script.


    Shell basics


    When you enter any command on the terminal it has three parts


    Command option argument


    Example


    cp -R /test/1anty.text /home/f1/.


    Here cp is command


    -R is option, there can be multiple options in the same command.


    Rest is the argument. there can be multiple arguments depending on the command.


    Virtual Consoles'
