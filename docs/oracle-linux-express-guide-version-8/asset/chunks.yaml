    \ and activate to make changes effective.\n13. Select Back.\n14. Select Quit.\n\
    \n### Commands nmtui\nSet hostname using nmtui\nSyntax\n"
  raw: 'Print the first 10 lines of a file to the standard output. You can also specify
    number of line to show.


    Syntax


    head option file


    Example


    head -20 /etc/passwd


    Show first 20 lines of passwd file  


    tail


    Print the last 10 lines of a file to standard output. You can also specify number
    of lines to show.


    Syntax


    tail option file


    Example


    tail -20 /var/log/logfile


    it will show last 20 lines


    Use tail to monitor file continuously


    tail -f /var/log/logfile 


    It will show end of growing file. Ctrl +c to interrupt


    Copy files and directory


    Copy file


    Syntax


    cp filename target_dir


    Example


    cp abc.txt /home/user1/.


    Copy multiple files


    Syntax


    cp * /target-location/.


    Example


    cp *.txt /home/user/.


    This will copy all files with txt extension to /home/user1 directory


    Prompt before any overwrite


    cp –i /home /home1


    Forcefully copy files


    cp –f /tmp/abc.txt /backup/.


    Do not overwrite an existing file, silently do nothing instead.


    cp -n * /backup/.


    Copy directory


    Syntax


    cp -R source_dir target_dir


    Example


    cp -R user1 user2


    copy user1 directory to user2


    Removing file and directory


    Remove file


    To remove file or directory you can use rm command


    Syntax


    rm file_name


    Example


    rm abc.txt


    To remove a directory and all its contents, including any subdirectories and files


    rm -r /example


    use this command very carefully, can cause data lose


    Remove directory


    Syntax


    rmdir directory


    Example


    rmdir /example


    List file and directories


    ls


    Lists the names of files and directories


    Syntax


    ls -<options>


    Long listing


    ls -l


    shows list of files or directories with size, modified date, modified time and
    its permission.


    Show also hidden files and directories


    ls -la


    Show human readable format


    ls -lh


    mv


    mv command is used to move file from one location to other location. You can also
    use mv command to rename the file without moving it.


    To move file


    Syntax


    mv filename destination_directory


    Example


    mv a.txt /tmp/. 


    It will move a.txt file from current directory to /tmp directory


    To rename


    Syntax


    mv filename newfilename


    Example


    mv a.txt b.txt


    grep


    Searches for a String from one or more files. Display each line which has string.


    Syntax


    grep string file


    Example


    grep ''127.0.0.1'' /etc/hosts


    diff


    Compares two files.


    Syntax


    diff First_file  Second_file


    Example


    diff abc.txt bbc.txt


    file


    Determine file type


    Syntax


    file file_name


    Example


    file bbc.txt


    Linking files and directories


    Link is the like short cut in Windows which point to the original file. There
    are two types of links


    *   Hard link


    *   Soft link


    Both hard and soft link are short cut to file. Soft link can exit in different
    file system where as hard link can exist only in the same file system. When you
    remove original file soft link will stop working whereas there will be no effect
    on hard link. The reason is that, in case of hard link both original file and
    hard link is pointing to same inode.


    Create Soft link


    Syntax


    ln -s /source/file_name /target/file_name


    Example


    ln -s /home/admin/abc.txt /abc1.txt


    Create hard link


    Syntax


    ln file_name /target/file_name


    Example


    ln /home/admin/abc.txt /home/admin/abc1.txt


    Chapter 8  


    # Networking  


    In this chapter we will discuss networking part. There mainly two types of networks
    :


    Non-IP network


    Non-IP network make use of transport layers for communication. One of the example
    of Non-IP network is InfiniBand.


    IP Network


    IP network is the network which uses IP address to communicate. Each device which
    is part of IP network should have IP address. IP Network is most common type of
    the network type. Home, offices and internet mostly use IP network. 


    For IP Network you have option to select address assignment mechanism. Two types
    of IP address mechanisms are available.


    Static


    Static IP address is manual mode of IP address assignment to devices. In case
    of static IP addressing, IP address remain same over the time, unless you change
    it. This type of IP addressing is mainly used on small networks or shared devices
    like Servers, printer etc where you want same IP address every time.


    Dynamic IP Address:


    Dynamic IP address configuration is an automatic configuration of addresses. It
    uses DHCP server to get the IP address for your device. When you configure DHCP
    server you allocate range of IP addresses to be assigned to the clients. When
    you start the device it connects to the DHCP server to get the IP address. Every
    time you start your device you may get different IP address, unless you reserve
    an IP address based on MAC address of the device. Dynamic IP configuration is
    ideal for large organizations where it is not possible to remember the address
    assigned to each device. But DHCP is not ideal solution for servers and printers
    where you want same IP address every time.


    Configuring Network


    By default, Oracle Linux 8 uses NetworkManager to configure and manage network
    connections. To use NetworkManager for configuring network interfaces, use one
    of the following tools:


    | nmtui | Text based User Interface to manage network. This tool is very useful
    in non GUI environment. |


    | GNOME Networkmanager | Graphical Tool for network management . |


    | nmcli | Command line tool.  |


    Device naming convention


    The interface name starts with a two-character prefix based on the type of interface:


    | Type of device | Prefix |


    | Ethernet | en |


    | wireless | wl |


    | wireless wide area network | ww |


    To keep the deice name persistent the Oracle Linux uses following convention for
    Ethernet devices:-


    | Type of device | Device Name |


    | For Onboard devices | enoX where X is the device number |


    | For PCIe devices | ensX where X is the device number |


    | For Multi-port devices | enpZsX where Z is the physical port number and X is
    the device number |


    | Traditional Naming | ethX  where X is the device number |


    Traditional naming convention ethX was used for network devices in the older versions
    of Linux. The new naming convention provides following benefits:-


    1 Stable interface names across reboots.


    2 Stable interface names even after hardware addition and removal.


    Benefits of using NetworkManager


    1 Synchronized and updated network status for all applications.


    2 Easier network management.


    3 Variety of tools for network management.


    4 Easy and flexible Wi-Fi network management.


    Network manager scripts


    By default, NetworkManager executes scripts in the /etc/NetworkManager/dispatcher.d
    directory or subdirectories in alphabetical order in response to network events.
    Each script should be an executable file owned by root.


    Using traditional scripts


    By default Oracle Linux 8 use NetworkManger for network management, however, if
    required you can still use the deprecated network scripts to manage network configuration
    instead NetworkManager.


    To install the scripts:  


    yum install network-scripts


    nmtui


    nmtui is Text Based Interface (TUI) tool for configuring networking. This tool
    is very helpful in network management on the system without GUI.


    To start nmtui


    nmtui


    Set Static IP address using nmtui


    In this example we will set static IP address. 


    1.  Start nmtui


    2.  ![](Images/image00389.jpeg)Select Edit a connection.


    3.  ![](Images/image00390.jpeg)Select the connection profile from the list and
    press Edit.


    4.  On the Edit Connection screen, press SPACE BAR key at IPv4 configuration.


    5.  Select Manual.


    6.  Press TAB and select Show.


    7.  Provide IP Address, Netmask, gateway and DNS in respective fields.


    8.  ![](Images/image00391.jpeg)![](Images/image00392.jpeg)Scroll down and make
    sure Automatically connect radio button is selected.


    9.  Press OK.


    10.  Select Back .


    11.  ![](Images/image00393.jpeg)Select Activate the connection, and press Enter.


    12.  Select the connection from the list, and press Enter to activate the connection.
    If connection is already activated, then deactivate and activate to make changes
    effective.


    13.  Select Back.


    14.  Select Quit.


