    ## 第 1 章

    # 引言


    Linux 是由 Linus Torvalds 于 1991 年启动的开源项目。它是一个类 Unix 操作系统。市场上上有数千个 Linux 发行版，大致根据其根发行版进行分类，例如
    CentOS、Oracle 和 Scientific Linux 都是基于 Red hat 的，而 Red hat 又基于 Fedora Linux。Fedora
    Linux 是由 Red Hat 赞助的社区项目。


    ### 免费与 付费


    Linux 尽管是一个开源项目，但市场上存在两种类型的 Linux 发行版：一种是免费的，另一种是付费的。免费是不言自明的，你不需要支付任何费用。在遇到任何问题时，你可以向为
    Linux 社区工作的志愿者寻求帮助。然而，这种支持不是限时的。因此，使用关键任务型 Linux 服务器和桌面电脑的公司更倾向于选择付费的 Linux 发行版，他们支付固定金额作为订阅和支持费用。这些付费
    Linux 发行版公司拥有 Linux 专家团队来提供支持和修复。


    Oracle Linux 遵循中庸，它可以免费使用和更新，但支持是付费的。Oracle Linux 发行版源自 RedHat 的源代码。Oracle Linux
    在功能和二进制上与 Red hat enterprise Linux 兼容。Oracle Linux 通常移除 Red hat 的品牌和标识。在 Redhat
    与 IBM 合并后，曾作为 Redhat 免费替代方案的 CentOS Linux 已不再可用。Centos 提供的可用产品只有 CentOS stream，它是一个滚动发布版本。以前倾向于将
    CentOS 作为 Redhat Linux 免费替代方案的客户现在不愿在生产环境中使用 CentOS。Oracle 提供了简单的脚本将你当前的 CentOS
    环境迁移到 Oracle Linux。


    ### 支持的平台。


    Oracle Linux 版本 8 安装镜像适用于以下平台：


    | 镜像 | 支持的平台 |

    | :--- | :--- |

    | x86_64 | Intel 和 AMD 64 位 |

    | aarch64 | ARM 64 位 |


    ### 镜像类型


    标准安装镜像仅以 ISO 镜像的形式存在，但你也可以获得云镜像、容器镜像和 Vagrant 镜像。


    ## 第 2 章

    # oracle Linux 支持生命周期


    正如前面提到的，如果你在关键任务系统中使用 Linux，Oracle Linux 的生命周期如下：


    | 版本 | 通用 | 支持结束 | 持续支持结束 |

    | :--- | :--- | :--- |

    | 3 | 2003 | 2011 |

    | 4 | 2005 | 2013 |

    | 5 | 2007 | 2017 |

    | 6 | 2011 | 2020 |

    | 7 | 2014 | 2021 |

    | 8 | 2019 | 2024 |


    ### 支持类型


    Oracle 为 Linux 提供两种类型的付费支持。两种支持类型的区别如下：


    | 特性 | 基础支持 | 高级支持 |

    | :--- | :--- | :--- |

    | 24x7 电话和在线支持 | 是 | 是 |

    | 获取增强、更新和修复 | 否 | 是 |

    | 终身持续支持 | 否 | 否 |


    ## 第 3 章

    # 安装媒体准备


    Oracle Linux 下载有多种形式：


    | 格式 | 说明 |

    | :--- | :--- |

    | ISO 镜像 | 适用于 x86_64 和 ARM |

    | Vagrant | 用于 Vagrant Boxes |

    | 容器镜像 | 适用于 x86_64 和 ARM |

    | GitHub Container Registry | |

    | Docker Hub | 适用于 Docker 镜像 |

    | 虚拟机模板 | .ova 格式 |

    | Raspberry Pi 4 和 Raspberry Pi 3 | 适用于 ARM |


    本书中我们将仅涵盖 Intel 安装。下载 Oracle Linux 镜像遵循以下步骤：


    1 访问网站 `https://yum.oracle.com/oracle-isos.html`


    2 ![](img/0331.jpeg)选择版本和平台，如果是完整 ISO 请选择 Full


    ### 验证下载


    从下方站点下载校验文件：


    ![](img/0332.jpeg)[`linux.oracle.com/gpg/`](https://linux.oracle.com/gpg/)


    如果你将镜像下载到了 Microsoft Windows 机器上。打开 PowerShell 提示符并输入以下命令：


    语法

    `get-filehash 文件路径`


    示例

    ```

    ![](img/0334.jpeg)[`getfedora.org/fmw/FedoraMediaWriter-win32-latest.exe`](https://getfedora.org/fmw/FedoraMediaWriter-win32-latest.exe)


    2 双击下载的文件并按照安装步骤操作。


    3 ![](img/0335.jpeg)选择自定义镜像


    4 选择下载的 Oracle Linux ISO 文件并点击打开。


    5 ![](img/0336.jpeg)![](img/0337.jpeg)选择 USB 设备并写入磁盘。


    6 等待完成并关闭。


    7 从 Windows 系统上拔掉 USB。


    ![](img/0338.jpeg) 现在安装媒体已准备就绪。


    ## 第 4 章

    # 安装步骤


    '
- fmt: "\nIn this chapter, we will cover installation procedure. However, before proceeding\
    \ for installation it is advisable to check the hardware compatibility of your\
    \ server/ PC at Oracle Linux internet sites.\n\nOracle Linux in its release notes\
    \ specify the minimum configuration for its installation but it recommended to\
    \ have at least following configuration for optimal performance of the system\n\
    \n* 4 GB or more RAM.\n* Intel Core I3 or better processor.\n* 60GB of Hard disk\n\
    * 16GB of USB disk for installation media\n\nNote: it is possible to complete\
    \ the installation with less resources depending upon your requirement and environment.\n\
    \n# Installation Basics\n\nOracle Linux uses `Anaconda` installer for installation.\
    \ Installation of Oracle Linux can be done in following ways:-\n\n* Quick install\n\
    * Customized GUI install\n* Kickstart automated install\n\n## Partitioning\n\n\
    Oracle Linux supports three type of partitioned devices\n\n* Standard partition\n\
    * LVM\n* LVM thin\n\n### Standard Partition\n\nFor boot, BIOS boot and EFI system\
    \ partition only standard partition can be used.\n\n### LVM\n\n`LVM` partition\
    \ scheme allows flexibility and performance benefit. When you choose `LVM` partition\
    \ during the installation, if no volume group currently exists on the system,\
    \ the installation creates one automatically.\n\n### LVM thin\n\n`LVM thin` uses\
    \ storage pool which allows thin provisioning of the storage.\n\n## File system\
    \ Supported\n\n* XFS\n* ext4, ext3, ext2\n* swap\n* BIOS boot\n* EFI system partition\n\
    \n### XFS\n\nXFS is a high performance file system that supports up to 500 TB\
    \ of single file system. It is the default file system for Oracle Linux 8.\n\n\
    ### Ext3 and Ext4\n\nExt3 and Ext4 are known as Journal file systems. Journaling\
    \ keep track of changes not yet committed to the file system which allows easy\
    \ file system recovery in case of abrupt system power off.\n\nEXT2 is the standard\
    \ file system used in the older versions of Linux.\n\n### Swap\n\nIt is a virtual\
    \ memory present on hard disk. When system does not have enough RAM to operate,\
    \ then it transfers some portion of the memory data in to swap space.\n\n### BIOS\
    \ boot\n\nPartition required for GPT.\n\n### EFI\n\nBoot device for GPT on UEFI\
    \ system.\n\n## Recommended partition scheme\n\n| Partition | Details |\n| :---\
    \ | :--- |\n| `/boot` | 1 GB and no LVM. |\n| `/` | root partition recommended\
    \ size 10GB. |\n| `/home` | 2GB minimum (optional) |\n| `/swap` | Equal to more\
    \ than RAM in some cases it should be double of system memory. |\n\n## Booting\
    \ your machine\n\nTo start installation process of Oracle Linux you have to boot\
    \ your system with installation media.\n\nFor virtual machine like `VM` in VMware\
    \ infrastructure, you can use `ISO` image directly. Just attach the `ISO` image\
    \ and boot the machine.\n\nFor physical server, plug in the Oracle Linux USB installation\
    \ media created earlier.\n\nSwitch on the server and press key to change boot\
    \ order to use USB as boot device (refer the hardware manual of the machine for\
    \ boot manger key like `F11` for some dell servers).\n\n# Installation Procedure\n\
    \n1. ![](Images/image00339.jpeg)From the boot menu, select Install Oracle Linux\
    \ 8 and press the `ENTER` key.\n2. ![](Images/image00340.jpeg)Select your language\
    \ and location. Click Continue.\n3. Next screen is installation summary, which\
    \ shows all installation options with default values.\n4. ![](Images/image00341.jpeg)![](Images/image00342.jpeg)From\
    \ the installation summary screen select Time & Date. Click your current location\
    \ on the map. The system will change the date, time and time zone accordingly.\
    \ Change date, time format from 24 hours to AM/PM, if required. Press Done.\n\
    5. ![](Images/image00343.jpeg)Select Installation Destination. From the Local\
    \ Standard Disks pane, select the target disk. Click Done to use the default setting\
    \ for Automatic partitioning. Note: if you have specific file system requirement\
    \ you can select Custom option.\n6. On network configuration screen. Change the\
    \ Host Name to fully qualified host name and press Apply.\n7. Press Configure.\n\
    8. ![](Images/image00344.jpeg)![](Images/image00345.jpeg)Make sure that the Connect\
    \ automatically with priority is selected.\n9. Select `IPV4` Settings tab to configure\
    \ static IP address.\n10. On the `IPV4` Tab change following: -\n    1. Change\
    \ Method to Manual from drop down menu.\n    2. Press `Add` button.\n    3. Provide\
    \ IP address\n    4. Provide Net mask\n    5. Provide gateway.\n    6. Add DNS\n\
    \    7. ![](Images/image00346.jpeg)Press Save.\n11. Click Done to accept the changes.\n\
    12. ![](Images/image00347.jpeg)On the Installation Summary screen press Root Password.\n\
    13. Set root password and press Done.\n14. Select User Creation on Installation\
    \ Summary window.\n15. ![](Images/image00348.jpeg)On the Create User screen, provide\
    \ Full name, user name and password for new user. Select Make user administrator\
    \ if you want this user to be administrator. ![](Images/image00349.jpeg)\n16.\
    \ Press Begin Installation on installation summary window. It will start installation\
    \ process.\n17. ![](Images/image00350.jpeg)On Completion of installation process\
    \ press Reboot System.\n18. ![](Images/image00351.jpeg)After reboot, on Initial\
    \ Setup Screen press Licence Information.\n19. ![](Images/image00352.jpeg)On the\
    \ Licence information screen, select I accept licence agreement. Press Done.\n\
    20. ![](Images/image00353.jpeg)Press Finish installation.\n21. On the Login screen,\
    \ select Not listed.\n22. ![](Images/image00354.jpeg)![](Images/image00355.jpeg)Write\
    \ root and press Next.\n23. Provide password for root user. The same password\
    \ you selected at the time of installation. Press Sign In. ![](Images/image00356.jpeg)\n\
    24. On the Welcome screen press Next.![](Images/image00357.jpeg)\n25. On the Typing\
    \ Screen, press Next.\n26. On Privacy Screen, press Next.\n27. ![](Images/image00358.jpeg)Press\
    \ Skip on Online Account screen\n28. Press Start using Oracle Linux server\n29.\
    \ Press `X` Button to close the help screen.\n\nThis concludes our Oracle Linux\
    \ 8 installation.\n\n# Chapter 5: ![](Images/image00359.jpeg)Exploring the Desktop\
    \ Components\n\nOn Server with GUI, `GNOME` is the default desktop. `GNOME` provide\
    \ easy to use GUI experience. In this chapter we will explore desktop interfaces.\n\
    \n## TOP BAR\n\nThe top bar has four main sections.![](Images/image00360.jpeg)\n\
    \n* Activities\n* Application menu\n* Clock\n* System Menu\n\n![](Images/image00361.jpeg)System\
    \ Menu\n\nRight corner of the bar has power, speaker network, battery and Bluetooth\
    \ icons. Click any of these icons to open System menu. System menu allows you\
    \ to adjust speaker and microphone volume. This menu also give you option to adjust\
    \ network and Bluetooth settings. You will find quick links for system settings,\
    \ Lock screen and Shutdown Menu.\n\n### Clock\n\nIn the center of the bar, there\
    \ is clock and by default, it shows day of the week and current time in 24-hour\
    \ format. If you want, you can change the time format in the system settings.\
    \ Click clock to open dialog box with calendar on the right side and any task\
    \ notification on the left side.![](Images/image00362.jpeg)\n\n### Activities\n\
    \nOn the left side of the top bar is the Activities button. Click on this button\
    \ to open overview screen. You can use `Super` key (also known as `Windows` key)\
    \ on your keyboard to open Activities overview. Activities Screen provides following\
    \ items\n\n* Search Bar.\n* ![](Images/image00363.jpeg)Windows Peak View.\n* Workspaces\n\
    \n### Search Bar\n\nOne of the main item of Activities overview screen is search\
    \ bar. With search bar you can search applications, documents, settings, calendar\
    \ events etc. on your computer. For example, if you write calculator in the search\
    \ bar it will show calculator application.![](Images/image00364.jpeg)Click the\
    \ icon to open the calculator application.\n\n### Windows Peak View\n\n![](Images/image00365.jpeg)Second\
    \ item of Activity overview is peek view of all running applications. Click the\
    \ desired application window to switch application. To close any running application\
    \ window, hover over the window and click `X` button. ![](Images/image00366.jpeg)Workspaces\n"
  raw: 'In this chapter, we will cover installation procedure. However, before proceeding
    for installation it is advisable to check the hardware compatibility of your server/
    PC at Oracle Linux internet sites.


    Oracle Linux in its release notes specify the minimum configuration for its installation
    but it recommended to have at least following configuration for optimal performance
    of the system


    *   4 GB or more RAM.


    *   Intel Core I3 or better processor.


    *   60GB of Hard disk


    *   16GB of USB disk for installation media


    Note: it is possible to complete the installation with less resources depending
    upon your requirement and environment.


    Installation Basics


    Oracle Linux uses Anaconda installer for installation. Installation of Oracle
    Linux can be done in following ways:-


    *   Quick install


    *   Customized GUI install


    *   Kickstart automated install


    Partitioning


    Oracle Linux supports three type of partitioned devices


    *   Standard partition


    *   LVM


    *   LVM thin


    Standard Partition


    For boot, BIOS boot and EFI system partition only standard partition can be used.


    LVM


    LVM partition scheme allows flexibility and performance benefit. When you choose
    LVM partition during the installation, if no volume group currently exists on
    the system, the installation creates one automatically.


    LVM thin


    LVM thin uses storage pool which allows thin provisioning of the storage.


    File system Supported


    *   XFS


    *   ext4, ext3, ext2


    *   swap


    *   BIOS boot


    *   EFI system partition


    XFS


    XFS is a high performance file system that supports up to 500 TB of single file
    system. It is the default file system for Oracle Linux 8.


    Ext3 and Ext4


    Ext3 and Ext4 are known as Journal file systems. Journaling keep track of changes
    not yet committed to the file system which allows easy file system recovery in
    case of abrupt system power off. 


    EXT2 is the standard file system used in the older versions of Linux.


    Swap


    It is a virtual memory present on hard disk. When system does not have enough
    RAM to operate, then it transfers some portion of the memory data in to swap space.


    BIOS boot


    Partition required for GPT.


    EFI


    Boot device for GPT on UEFI system.


    Recommended partition scheme


    | Partition | Details |


    | /boot | 1 GB and no LVM. |


    | / | root partition recommended size 10GB. |


    | /home | 2GB minimum (optional) |


    | /swap | Equal to more than RAM in some cases it should be double of system memory.
    |


    Booting your machine


    To start installation process of Oracle Linux you have to boot your system with
    installation media.


    For virtual machine like VM in VMware infrastructure, you can use ISO image directly.
    Just attach the ISO image and boot the machine.


    For physical server, plug in the Oracle Linux USB installation media created earlier.


    Switch on the server and press key to change boot order to use USB as boot device
    (refer the hardware manual of the machine for boot manger key like F11 for some
    dell servers).


    Installation Procedure


    1.  ![](Images/image00339.jpeg)From the boot menu, select Install Oracle Linux
    8 and press the ENTER key.


    2.  ![](Images/image00340.jpeg)Select your language and location. Click Continue.


    3.  Next screen is installation summary, which shows all installation options
    with default values. 


    4.  ![](Images/image00341.jpeg)![](Images/image00342.jpeg)From the installation
    summary screen select Time & Date. Click your current location on the map.


    The system will change the date, time and time zone accordingly. Change date,
    time format from 24 hours to AM/PM, if required. Press Done.


    5.  ![](Images/image00343.jpeg)Select Installation Destination. From the Local
    Standard Disks pane, select the target disk. Click Done to use the default setting
    for Automatic partitioning.


    Note: if you have specific file system requirement you can select Custom option.


    6.  On network configuration screen. Change the Host Name to fully qualified host
    name and press Apply.


    7.  Press Configure.


    8.  ![](Images/image00344.jpeg)![](Images/image00345.jpeg)Make sure that the Connect
    automatically with priority is selected.


    9.  Select IPV4 Settings tab to configure static IP address.


    10.  On the IPV4 Tab change following: -


    1 Change Method to Manual from drop down menu.


    2 Press Add button.


    3 Provide IP address


    4 Provide Net mask


    5 Provide gateway.


    6 Add DNS


    7 ![](Images/image00346.jpeg)Press Save.


    11.  Click Done to accept the changes.


    12.  ![](Images/image00347.jpeg)On the Installation Summary screen press Root
    Password.


    13.  Set root password and press Done.


    14.  Select User Creation on Installation Summary window.


    15.  ![](Images/image00348.jpeg)On the Create User screen, provide Full name,
    user name and password for new user. Select Make user administrator if you want
    this user to be administrator.    


    ![](Images/image00349.jpeg)


    16.  Press Begin Installation on Installation summary window. It will start installation
    process.


    17.  ![](Images/image00350.jpeg)On Completion of installation process press Reboot
    System.


    18.  ![](Images/image00351.jpeg)After reboot, on Initial Setup Screen press Licence
    Information.


    19.  ![](Images/image00352.jpeg)On the Licence information screen, select I accept
    licence agreement. Press Done. 


    20.  ![](Images/image00353.jpeg)Press Finish installation.


    21.  On the Login screen, select Not listed.


    22.  ![](Images/image00354.jpeg)![](Images/image00355.jpeg)Write root and press
    Next.


    23.  Provide password for root user. The same password you selected at the time
    of installation. Press Sign In. ![](Images/image00356.jpeg)


    24.  On the Welcome screen press Next.


    ![](Images/image00357.jpeg)


    25.  On the Typing Screen, press Next.


    26.  On Privacy Screen, press Next.


    27.  ![](Images/image00358.jpeg)Press Skip on Online Account screen


    28.  Press Start using Oracle Linux server


    29.  Press X Button to close the help screen.


    This concludes our Oracle Linux 8 installation.


    Chapter 5  


    # ![](Images/image00359.jpeg)Exploring the Desktop Components


    On Server with GUI, GNOME is the default desktop. GNOME provide easy to use GUI
    experience. In this chapter we will explore desktop interfaces.


    TOP BAR


    The top bar has four main sections.


    ![](Images/image00360.jpeg) 


    *   Activities


    *   Application menu


    *   Clock


    *   System Menu


    ![](Images/image00361.jpeg)System Menu


    Right corner of the bar has power, speaker network, battery and Bluetooth icons.
    Click any of these icons to open System menu. System menu allows you to adjust
    speaker and microphone volume. This menu also give you option to adjust network
    and Bluetooth settings. You will find quick links for system settings, Lock screen
    and Shutdown Menu.


    Clock


    In the center of the bar, there is clock and by default, it shows day of the week
    and current time in 24-hour format. If you want, you can change the time format
    in the system settings. Click clock to open dialog box with calendar on the right
    side and any task notification on the left side.


    ![](Images/image00362.jpeg)


    Activities


    On the left side of the top bar is the Activities button. Click on this button
    to open overview screen. You can use Super key (also known as Windows key) on
    your keyboard to open Activities overview. Activities Screen provides following
    items


    *   Search Bar.


    *   ![](Images/image00363.jpeg)Windows Peak View.


    *   Workspaces


    Search Bar


    One of the main item of Activities overview screen is search bar. With search
    bar you can search applications, documents, settings, calendar events etc. on
    your computer. For example, if you write calculator in the search bar it will
    show calculator application.


    ![](Images/image00364.jpeg)Click the icon to open the calculator application.


    Windows Peak View


    ![](Images/image00365.jpeg)Second item of Activity overview is peek view of all
    running applications. Click the desired application window to switch application.
    To close any running application window, hover over the window and click X button.  


    ![](Images/image00366.jpeg)Workspaces'
