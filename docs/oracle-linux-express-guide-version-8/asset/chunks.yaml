    \ root 权限。\n\n# 第 19 章：## 探索文件和目录权限\n\nLinux 是一个多用户操作系统，可以被许多用户同时访问。因此，用户不触碰彼此的数据是绝对必要的。为了数据和系统文件的安全和正常，操作系统部署了不同类型的安全系统。Linux\
    \ 将授权分为 2 级：\n\n1. 所有权\n2. 权限\n\n#### 所有权\n所有权定义了谁可以访问文件或目录。为了表示所有权，Linux 使用以下符号：\n\
