    NTP 是网络时间协议，用于同步计算机的时间。全球的计算机使用网络时间协议（`NTP`）通过分级的 NTP 服务器来同步时间。主服务器位于第 1 层，通过卫星、无线电或调制调器连接到第
    0 层。


    在 Oracle Linux 8 上，`Chrony` 提供了 `NTP` 的实现。`Chrony` 为经常关机或断开网络的系统（如笔记本电脑）设计。`chronyd`
    是运行在用户空间的守护进程，使用 `chrony.conf` 文件。NTP 有两个部分：


    字体 服务器

    - 客户端


    客户端连接服务器进行时间同步。NTP 为网络上的计算机提供高精度的时间同步。时间同步对于日志管理、登录信息非常重要；在某些情况下，如果两台机器的时间不同，会导致事务失败。


    ## 在服务器上配置 chrony


    ### 安装 chrony 包

    ```bash

    yum install chrony

    ```


    主配置文件为 `/etc/chrony.conf`。编辑此文件并添加以下参数。


    `server Ip_of_the_stratum`


    **示例**

    ```bash

    server 192.20.3.1

    ```


    如果此服务器位于孤立网络中

    ```bash

    local stratum 10

    ```


    你可以针对主机或网络限制 NTP 服务器的使用。


    **语法**

    `allow network/hostIP`


    **示例**

    ```bash

    allow 192.116.1.0/24

    ```


    ### 保存文件

    现在启用并启动 chronyd 守护进程

