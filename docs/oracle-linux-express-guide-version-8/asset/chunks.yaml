  trans: "\n\n在本章中，我们将介绍安装步骤。然而，在进行安装之前，建议在 Oracle Linux 网上检查您的服务器/PC 的硬件兼容性。\n\n\
    Oracle Linux 在发行说明中指定了安装的最低配置，但建议至少具备以下配置以获得系统的最佳性能：\n\n* 4 GB 或更多内存（RAM）。\n*\
    \ Intel Core I3 或更高级的处理器。\n* 60GB 硬盘。\n* 16GB USB 磁盘作为安装介质。\n\n注意：根据您的需求和环境，可以使用较少的资源完成安装。\n\
    \n# 安装基础\n\nOracle Linux 使用 `Anaconda` 安装程序进行安装。Oracle Linux 的安装可以通过以下方式完成：\n\n\
    * 快速安装\n* 自定义 GUI 安装\n* Kickstart 自动化安装\n\n## 分区\n\nOracle Linux 支持三种类型的分区设备\n\
    \n* 标准分区\n* LVM\n* LVM thin（精卷 LVM）\n\n### 标准分区\n\n对于引导、BIOS boot 和 EFI 系统分区，只能使用标准分区。\n\
    \n### LVM\n\n`LVM` 分区方案提供了灵活性和性能优势。在安装过程中选择 `LVM` 分区时，如果系统当前不存在卷组，安装程序会自动创建一个。\n\
    \n### LVM thin\n\n`LVM thin` 使用存储池，允许对存储进行精简置备（thin provisioning）。\n\n## 支持的文件系统\n\
    \n* XFS\n* ext4, ext3, ext2\n* swap\n* BIOS boot\n* EFI 系统分区\n\n### XFS\n\nXFS\
    \ 是一种高性能文件系统，支持单个文件系统多达 500 TB。它是 Oracle Linux 8 的默认文件系统。\n\n### Ext3 和 Ext4\n\
    \nExt3 和 Ext4 被称为日志文件系统。日志会跟踪尚未提交到文件系统的更改，以便在系统意外断电时轻松恢复文件系统。\n\nEXT2 是旧版本 Linux\
    \ 中使用的标准文件系统。\n\n### Swap\n\n它是位于硬盘上的虚拟内存。当系统没有足够的 RAM 运行程序时，它会将部分内存数据传输到 swap\
    \ 空间。\n\n### BIOS boot\n\n用于 GPT 的必需分区。\n\n### EFI\n\nUEFI 系统上 GPT 的启动设备。\n\n\
    ## 推荐的分区方案\n\n| 分区 | 详情 |\n| :--- | :--- |\n| `/boot` | 1 GB 且不使用 LVM。 |\n| `/`\
    \ | 根分区建议大小为 10GB。 |\n| `/home` | 22GB（可选） |\n| `/swap` | 在某些情况下等于或大于 RAM，有时应为系统内存的两倍。\
    \ |\n\n## 启动您的机器\n\n要启动 Oracle Linux 的安装过程，您必须使用安装介质启动系统。\n\n对于如 VMware 基础设施中的\
    \ `VM` 等虚拟机，您可以直接使用 `ISO` 镜像。只需挂载 `ISO` 镜像并启动机器。\n\n对于物理服务器，插入之前创建的 Oracle Linux\
    \ USB 安装介质。\n\n开启服务器并按键更改启动顺序，使用 USB 作为启动设备（参考机器硬件手册获取启动管理器键，例如某些戴尔服务器为 `F11`）。\n\
    \n# 安装步骤\n\n1. ![](img/image00339.jpeg)从启动菜单中，选择 Install Oracle Linux 8 并按下 `ENTER`\
    \ 键。\n2. ![](img/image00340.jpeg)选择您的语言和位置。点击 Continue（继续）。\n3. 下一个屏幕是安装摘要，显示了带有默认值的所有安装选项。\n\
    4. ![](img/image00341.jpeg)![](img/image00342.jpeg)从安装摘要屏幕选择 Time & Date（日期与时间）。在地图上点击您当前的位置。系统将相应更改日期、时间和时区。根据需要，将日期格式从\
    \ 24 小时更改为 AM/PM。按 Done（完成）。\n5. ![](img/image00343.jpeg)选择 Installation Destination（安装位置）。从\
    \ Local Standard Disks（本地标准磁盘）面板中选择目标磁盘。点击 Done 使用自动分区的默认设置。注意：如果您有特定的文件系统要求，可以选择\
    \ Custom（自定义）选项。\n6. 在网络配置屏幕上。将 Host Name（主机名）更改为完全主机名并按 Apply（应用）。\n7. 点击 Configure（配置）。\n\
    8. ![](img/image00344.jpeg)![](img/image00345.jpeg)确保选择了 Connect automatically\
    \ with priority（自动连接并优先）。\n9. 选择 `IPV4` 设置标签页以配置静态 IP 地址。\n10. 在 `IPV4` 标签页上更改以下内容：\n\
    \    1. 从下拉菜单中将 Method（方法）更改为 Manual（手动）。\n    2. 按下 `Add`（添加）按钮。\n    3. 提供 IP\
    \ 地址。\n    4. 提供掩码。\n    5. 提供网关。\n    6. 添加 DNS。\n    7. ![](img/image00346.jpeg)按\
    \ Save（保存）。\n11. 点击 Done 接受更改。\n12. ![](img/image00347.jpeg)在安装摘要屏幕上按 Root Password（根密码）。\n\
    13. 设置根密码并按 Done。\n14. 在安装摘要窗口上选择 User Creation（创建用户）。\n15. ![](img/image00348.jpeg)在\
    \ Create User 屏幕上为新用户提供全名、用户名和密码。如果让此用户成为管理员，请选择 Make user administrator（设用户管理员）。![](img/image00349.jpeg)\n\
    16. 在安装摘要窗口上按 Begin Installation（开始安装）。它将启动安装过程。\n17. ![](img/image00350.jpeg)在安装过程完成后按\
    \ Reboot System（重启系统）。\n18. ![](img/image00351.jpeg)重启后，在 Initial Setup 屏幕上按 Licence\
    \ Information（许可信息）。\n19. ![](img/image00352.jpeg)在许可信息屏幕上，选择 I accept licence\
    \ agreement（我接受许可协议）。按 Done。\n20. ![](img/image00353.jpeg)按 Finish installation（完成安装）。\n\
    21. 在登录屏幕上选择 Not listed（未列出）。\n22. ![](img/image00354.jpeg)![](img/image00355.jpeg)输入\
    \ root 并按 Next（下一步）。\n23. 为 root 用户提供密码。与您安装时选择的密码相同。按 Sign In（登录）。![](img/image00356.jpeg)\n\
    24. 在 Welcome 屏幕上按 Next![](img/image00357.jpeg)\n25. 在 Typing（输入）屏幕上，按 Next。\n\
    26. 在 Privacy（隐私）屏幕上，按 Next。\n27. ![](img/image00359.jpeg)探索桌面组件\n\n在带有 GUI 的服务器上，`GNOME`\
    \ 是默认桌面。`GNOME` 提供了易用的 GUI 体验。在本章中，我们将探索桌面界面。\n\n## 顶部栏 (TOP BAR)\n\n顶部栏有四个主要部分![](img/image00360.jpeg)\n\
    \n* Activities（活动）\n* Application menu（应用程序菜单）\n* Clock（时钟）\n* System Menu（系统菜单）\n\
    \n![](img/image00361.jpeg)系统菜单\n\n栏右角有电源、扬声器、网络、电池和蓝牙图标。点击这些任何图标都会打开系统菜单。系统菜单允许您调整扬声器和麦克风量。此菜单还提供了调整网络和蓝牙设置的选项。您将找到系统设置、锁定屏幕和关机菜单的快速链接。\n\
    \n### 时钟\n\n在栏的中心位置有一个时钟，默认情况下显示星期和 24 小时制的当前时间。如果您需要，可以在系统设置中更改时间格式。点击时钟打开对话框，右侧显示日历，左侧显示任何任务通知。![](img/image00362.jpeg)\n\
    \n### Activities\n\n顶部栏左侧是 Activities 按钮。点击此按钮打开概览屏幕。您可以使用键盘上的 `Super` 键（也称为 `Windows`\
    \ 键）打开活动概览。活动屏幕提供以下项目\n\n* Search Bar（搜索栏）。\n* ![](img/image00363.jpeg)Windows\
    \ Peak View（窗口预览）。\n* Workspaces（工作空间）\n\n### Search Bar\n\n活动概览屏幕的主要项目之一是搜索栏。通过搜索栏，可以在计算机上搜索应用程序、文档、设置、日历事件等。例如，如果在搜索栏中输入\
    \ calculator，它将显示计算器应用程序。![](img/image00364.jpeg)点击图标打开计算器应用程序。\n\n### Windows\
    \ Peak View\n\n![](img/image00365.jpeg)活动概览的第二个项目是所有运行应用程序的预览。点击所需的应用程序窗口以切换应用程序。要关闭任何正在运行的应用程序窗口，悬停在窗口上并点击\
    \ `X` 按钮。![](img/image00366.jpeg)工作空间\n\n"
- fmt: "\nLeft side of the Activities overview screen shows the list of workspaces.\
    \ Workspaces are virtual desktops for better windows management. You can create\
    \ multiple workspaces. Workspaces are meant to reduce mess on the single desktop\
    \ and make the desktop easier to navigate.\n\nClick on the workspace to switch\
    \ workspace. To move the application to different workspace just drag the running\
    \ application to new workspace.\n\n## Dash\n\n![](Images/image00367.jpeg)![](Images/image00368.jpeg)\n\
    On the left side of the desktop you will find the Dash bar. The Dash provides\
    \ access to your favourite and running applications. Click the application icon\
    \ on the dash bar to open the application. The small dot at the bottom of icon\
    \ indicates running application. Click on any running application icon brings\
    \ most recent window of the application.\n\nRight click on the icon to open context\
    \ menu. From this menu you can open new window or pick any window of a running\
    \ application. You can also add or remove any application to favourites from this\
    \ menu.\n\n## Grid\n\n![](Images/image00369.jpeg)\nAt the bottom of the dash bar\
    \ there is grid icon. Click on this icon shows the list of all and frequently\
    \ used applications. The icons are in grid format, from the bottom of the grid\
    \ you can switch between all applications and frequently used applications. The\
    \ list of applications can span multiple pages, to navigate to next page use scroll\
    \ (centre) wheel of mouse or click the dots on the right side of the grid.\n\n\
    Some applications in the grid are contained in the application folder. Click application\
    \ folder to list the grid of all containing applications.\n\n![](Images/image00370.jpeg)\n\
    \n![](Images/image00371.jpeg)\n\n## Application menu\n\nLocated beside the Activities\
    \ button, application menu shows the name of the active application. Also provides\
    \ other options specific to the active application.\n\n## System settings\n\n\
    ![](Images/image00372.jpeg)![](Images/image00373.jpeg)\nClick on system setting\
    \ icon in the system menu will open settings windows for system and hardware.\
    \ Setting screen has two panes, left pane shows the list of settings and right\
    \ pane provides the description of the selected setting. You can scroll the list\
    \ of settings with mouse’s scroll wheel. Suppose you want to change the background\
    \ of your desktop. Click background in the left pane and select the wallpaper\
    \ from the list of available wallpapers in the right pane.\n\nTop bar of the system\
    \ setting tool also houses search button. Search button offers you to search anything\
    \ related to settings. Suppose you want to look for date and time settings, just\
    \ press search button and write date. The system will show you list of items related\
    \ to date in the left pane.\n\n![](Images/image00374.jpeg)\n\n## Log out\n\nAfter\
    \ finishing your task, it is good practice to logout from the system. The logout\
    \ option closes all running application started by the user in the current session.\
    \ To logout as current user press user name from the system menu. From the sub\
    \ menu press `Log Out`. On the confirmation popup press logout again.\n\n## Lock\
    \ screen\n\n![](Images/image00375.jpeg)\nWhen you are away from your machine for\
    \ short period of time it is recommended to lock your screen so that nobody can\
    \ use your computer in your absence. When system screen is in lock state, all\
    \ the running application will continue to run. To log back, provide your login\
    \ password to unlock the screen. System also locks the screen automatically, if\
    \ you leave your computer for a specific time period.\n\nTo lock the screen manually,\
    \ click the system menu on the right side of the top bar, click `Lock` icon.\n\
    \nTo unlock, press `ENTER` key on the locked screen and provide your password.\n\
    \n![](Images/image00376.jpeg)\n\n Power off or Restart\n\nTo shutdown or reboot\
    \ the server through GUI, click the system menu on the right side of the top bar,\
    \ click `Power Off` button. At the dialog box, press the button you want.\n\n\
    ![](Images/image00377.jpeg)\n\n## Windows\n\nGnome uses windows to display your\
    \ running applications. This is one of the ways to do multitasking. Whenever you\
    \ launch any application, it opens in a new window. In this section, we will explore\
    \ windows operations.\n\n### List windows\n\nTo show all the running windows just\
    \ click Activities button. From the list of windows press left button of mouse\
