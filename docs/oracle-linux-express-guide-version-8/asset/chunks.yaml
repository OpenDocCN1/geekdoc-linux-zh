  trans: '


    服务是一个在后台运行等待被使用或执行基本任务的程序。当系统启动时，它会启动许多服务以达到系统所需的状态。假设您想以 GUI 模式启动系统，系统必须启动所有与桌面环境相关的服务。同样，如果您将服务器配置为
    Web 服务器，则必须在启动过程中启动 Web 服务。即使是执行基本任务，它也需要许多服务正在运行，如网络、日期和时间等。与由用户启动并在用户注销时自动关闭的普通软件程序不同，服务可以在没有用户参与的情况下启动，并且在用户注销后可能继续运行。大多数服务在用户不知情的情况下后台运行。软件开发者可以编写自己的软件作为服务运行。


    # SYSTEMD 简介


    `systemd` 是大多数 Linux 发行版的系统和服务服务管理器。Oracle Linux 也使用 `systemd` 进行服务管理。`systemd`
    与旧的 `SysV init` 脚本兼容。使用 `systemd` 管理服务的主要优势包括：


    -   更易的服务管理

    -   启动时的任务并行执行

    -   通过 `cgroups` 实现更好的资源管理。

    -   守护进程的按需激活


    ## systemd 的重要目录和文件


    | 目录 | 说明 |

    | :--- | :--- |

    | `/usr/lib/systemd/system/` | 安装程序的 `systemd` 单元文件。 |

    | `/run/systemd/system/` | 运行时创建的 `systemd` 单元文件。 |

    | `/etc/systemd/system/` | 为自动启动服务创建的 `systemd` 单元文件。 |


    ## 系统单元类型


    | 单元 | 说明 |

    | :--- | :--- |

    | `.service` | 服务 |

    | `.device` | 设备 |

    | `.target` | 相当于 sysv 中的运行级别 (run level) |

    | `.snapshot` | 存储状态 |

    | `.swap` | 封装内存交换分区或交换文件。 |


    ## 命令


    `systemctl` 是 Oracle Linux 8 中管理服务的命令。我们将使用此命令来查看、启动、停止、启用和禁用服务。


    ### 列出所有服务

    ```

    systemctl list-units --type service --all

    ```


    ### 显示服务的状态

    #### 语法

    ```

    systemctl status service_name

    ```

    #### 示例

    ```

    systemctl status sshd

    ```


    ### 检查服务是否激活（运行）

    #### 语法

    ```

    systemctl is-active service_name

    ```

    #### 示例

    ```

    systemctl is-active sshd

    ```


    ## 启动和停止服务


    ### 启动服务

    #### 语法

    ```

    systemctl start service_name

    ```

    #### 示例

    ```

    systemctl start httpd

    ```


    ### 停止服务

    #### 语法

    ```

    systemctl stop service_name

    ```

    #### 示例

    ```

    systemctl stop httpd

    ```


    ### 重启服务

    #### 语法

    ```

    systemctl restart service_name

    ```

    #### 示例

    ```

    systemctl restart httpd

    ```


    ### 如果服务正在运行则重启

    #### 语法

    ```

    systemctl try-restart service_name

    ```

    #### 示例

    ```

    systemctl try-restart httpd

    ```


    ### 重新加载服务配置

    #### 语法

    ```

    systemctl reload service_name

    ```

    #### 示例

    ```

    systemctl reload httpd

    ```


    ### 屏蔽服务 (Mask Service)

    当你屏蔽一个服务时，该服务无法启动。这在禁用危险和未知服务时非常有用。

    #### 语法

    ```

    systemctl mask service_name

    ```

    #### 示例

    ```

    systemctl mask httpd

    ```


    ### 解除屏蔽

    #### 语法

    ```

    systemctl unmask service_name

    ```

    #### 示例

    ```

    systemctl unmask httpd

    ```


    ## 使用 Target（运行级别）


    Target 基本上是为了让服务器进入特定状态。许多服务和其他单元的启动和停止是为了使服务器达到所需状态。多个 Target 可以同时处于激活。


    ### 查看系统中所有可用的 target

    ```

    systemctl list-unit-files --type=target

    ```


    ### 查看默认 target

    在 `/lib/systemd/system/default.target` 中描述了 `systemd` 在启动时尝试达到的默认 target。

    ```

    systemctl get-default

    ```


    ### 修改启动时将使用的默认 target

    #### 语法

    ```

    systemctl set-default target_name

    ```

    #### 示例

    ```

    systemctl set-default multi-user.target

    ```


    ### 列出与 target 绑定的单元

    #### 语法

    ```

    systemctl list-dependencies target_name

    ```

    #### 示例

    ```

    systemctl list-dependencies multi-user.target

    ```


    #### 定义的 target

    | Target | 说明 |

    | :--- | :--- |

    | `rescue.target` | 单用户模式。 |

    | `multi-user.target` | 非 GUI 多用户控制台访问 |

    | `graphical.target` | 一个 GUI 会话。 |

    | `custom.target` | 自定义 target。 |

    | `emergency.target` | 用于系统修复的最精简环境。 |


    ## 关机或重启


    ### 使用 systemctl 关机

    ```

    systemctl poweroff

    ```


    ### 重启

    ```

    systemctl reboot

    ```


    ### 以救援模式启动服务器

    ```

    systemctl rescue

    ```


    ## 启用和禁用服务


    要配置任何服务在启动时自动运行，我们使用 `systemctl enable` 命令。该命令在 `/etc/systemd/system/` 目录下创建链接文件。当禁用任何服务时，`systemctl`
    会删除该目录下的链接文件。


    ### 配置服务在启动时运行

    ```bash

    systemctl enable service_name

    ```

    #### 示例

    ```bash

    systemctl enable httpd

    ```


    ### 禁用服务

    ```bash

    systemctl disable service_name

    ```

    #### 示例

    ```bash

    systemctl disable httpd

    ```


    ### 检查服务是否启用

    ```bash

    systemctl is-enabled service_name

    ```

    #### 示例

    ```bash

    systemctl is-enabled sshd

    ```


    ### 列出启用的服务

    ```bash

    systemctl list-unit-files --type=service --enabled

    ```


    ### 查看服务的详细信息

    ```bash

    systemctl show service_name

    ```


