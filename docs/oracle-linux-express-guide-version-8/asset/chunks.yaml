    ```bash\ndf\n```\n默认情况下，`df` 命令以 1 千字节为块显示分区大小，为了\n\n#### 以人类可读的格式（即 MB 和 GB）显示列表\n\
    ```bash\ndf -h\n```\n\n#### 显示目录中文件占用的空间\n```bash\ndu\n```\n默认情况下，`du` 以千字节显示磁盘使用情况，要以人类可读的格式（即\
    \ KB、MB 和 GB）查看\n```bash\ndu -h\n```\n\n#### 查看目录的总使用量\n```bash\ndu -sh\n```\n\
    \n### 查看硬件信息\n#### 列出系统中当前安装的所有 PCI 设备\n```bash\nlspci\n```\n\n#### 显示所有 PCI 设备的详细信息\n\
    ```bash\nlspci -v\n```\n\n#### 显示关于所有 PCI 设备的详细信息\n```bash\nlspci -vv\n```\n\n\
    #### 列出系统中所有的 USB 设备\n```bash\nlsusb\n```\n\n#### 列出系统中所有 USB 设备的详细信息\n```bash\n\
    lsusb -v\n```\n\n#### 列出所有 pcmcia 设备\n```bash\nlspcmcia\n```\n\n#### 显示更多 PCMCIA\
    \ 设备的信息\n```bash\nlspcmcia -v\n```\n\n#### 显示 CPU 信息\n要查看 CPU、核心、线程、供应商、系列、型号等\n\
    ```\nlscpu\n```\n或者\n```\ncat /proc/cpuinfo\n```\n此输出中的主要信息可以是：\n\n| CPU | 逻辑\
    \ CPU 编号 |\n| CORE | CPU 的逻辑核心。 |\n| SOCKET | 逻辑插槽。 |\n\n#### 显示硬件信息\n```bash\n\
