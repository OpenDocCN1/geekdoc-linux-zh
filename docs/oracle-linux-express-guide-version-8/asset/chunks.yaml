  trans: "\n“活动”（Activities）概述屏幕的左侧显示工作空间列表。工作空间是用于更好地管理窗口的虚拟桌面。你可以创建多个工作空间。工作空间旨在减少单个桌面上的混乱，并使桌面更易导航。\n\
    \n点击工作空间可切换工作空间。要将应用程序移动到不同的工作空间，只需将运行中的应用程序拖到新工作空间即可。\n\n## Dash（启动器）\n\n![](img/image00367.jpeg)![](img/image00368.jpeg)\n\
    桌面的左侧你会发现 Dash 栏。Dash 提供了访问收藏和运行中应用程序的途径。点击 Dash 栏上的应用程序图标可打开该程序。图标底部的小点表示该程序正在运行。点击任何运行中的应用程序图标将带出该程序最近的窗口。\n\
    \n右键点击图标打开打开菜单。从此菜单中，你可以打开新窗口或选择运行中应用程序的任何窗口。你还可以从此菜单将任何应用程序添加到收藏或从收藏移除。\n\n##\
    \ Grid（网格）\n\n![](img/image00369.jpeg)\n在 Dash 栏底部有一个网格图标。点击此图标将显示所有应用程序和常用应用程序的列表。图标以网格格式排列，从网格底部，你可以在所有应用程序和常用应用程序之间切换。应用程序列表可以跨多个页，要导航到下一页，请使用鼠标（中间）滚轮或点击网格右侧的点。\n\
    \n网格中的某些应用程序包含在应用程序文件夹中。点击应用程序文件夹将列出包含所有应用程序的网格。\n\n![](img/image00370.jpeg)\n\
    \n![](img/image00371.jpeg)\n\n## 应用程序菜单\n\n位于“活动”按钮旁边，应用程序菜单显示活动应用程序的名称。还提供了特定于活动应用程序的其他选项。\n\
    \n## 系统设置\n\n![](img/image00372.jpeg)![](img/image00373.jpeg)\n点击系统菜单中的系统设置图标将打开系统和硬件的设置窗口。设置界面有两个窗格，左窗格显示设置列表，右窗格提供所选设置的说明。你可以使用鼠标滚轮滚动设置列表。假设你想更改桌面背景。点击左窗格中的“背景”，并在右窗格的可用壁列表中选择壁纸。\n\
    \n系统设置工具的顶部栏还设有搜索按钮。搜索按钮允许你搜索与设置相关的任何内容。假设你想查找日期时间设置，只需按下搜索按钮并输入“日期”。系统将在左窗格中显示与日期相关的项目列表。\n\
    \n![](img/image00374.jpeg)\n\n## 注销\n\n完成任务后，注销系统是一个好习惯。注销选项会关闭用户在当前会话启动的所有运行应用程序。要作为当前用户注销，从系统菜单点击用户名。在子菜单中按`Log\
    \ Out`注销）。在确认弹出窗口中再次按注销。\n\n## 锁屏\n\n![](img/image00375.jpeg)\n当你离开电脑一段时间时，建议锁定屏幕，以免在你不在时无人可以使用你的电脑。当系统屏幕处于锁定状态时，所有运行的应用程序将继续运行。要重新登录，提供你的登录密码解锁屏幕。如果你离开电脑一段时间，系统也会锁定屏幕。\n\
    \n要手动锁定屏幕，点击顶部栏右侧的系统菜单，点击`Lock`锁定）图标。\n\n要解锁，在锁定屏幕上按`ENTER` 键并提供密码。\n\n![](img/image00376.jpeg)\n\
    \n 关机或重启\n\n要通过 GUI 关机或重启服务器，点击顶部栏右侧的系统菜单，点击`Power Off`关机按钮。在对话框中，按你想要的按钮。\n\n\
    ![](img/image00377.jpeg)\n\n## 窗口\n\nGnome 使用窗口显示你运行的应用程序。这是实现多任务的方法之一。每当你启动任何应用程序时，它都会在新窗口中打开。在这一部分，我们将探索窗口操作。\n\
    \n### 列出窗口\n\n要显示所有运行的窗口，只需点击“活动”按钮。从窗口列表中按鼠标左键选择任何窗口。\n\n### 切换窗口\n\n你可以使用键盘切换窗口，按`Super`\
    \ + `TAB` 打开窗口切换器。按住`Super` 键，释放并按`TAB` 键在打开的窗口之间循环。\n\n![](img/image00378.jpeg)\n\
    请注意：在使用 Linux 时，`Super` 键是 Windows 键的名称。\n\n### 最大化和取消最大化窗口\n\n你可以最大化窗口以在整个桌面查看其内容，并取消最大化或还原窗口以恢复到正常大小。\n\
    \n#### 最大化窗口\n\n要最大化窗口，按并按住窗口标题栏上的鼠标左键以获取窗口标题栏，现在将其拖到顶部栏。最大化的另一种方法是在窗口标题栏上双击鼠标左键。使用键盘最大化窗口请按`Alt`\
    \ + `F10`。\n\n#### 取消最大化窗口\n\n要将窗口恢复到正常大小，获取窗口标题栏并将其拖离顶部栏，或直接双击窗口标题栏。在键盘上按`Alt`\
    \ + `F10` 使用键盘取消窗口的最大化。\n\n### 平分窗口（贴靠窗口）\n\n![](img/image00379.jpeg)\n为了复制文件或比较两个窗口的内容，你可以将两个窗口并排。在\
    \ Microsoft windows 中，此功能被称为窗口贴靠（Snap）。要将窗口贴靠左侧，按`Super` + `left Arrow`；要将窗口贴靠屏幕右侧，选择窗口并按`Super`\
    \ + `right Arrow`。使用鼠标贴靠窗口，获取窗口标题栏并拖到左侧或右侧。\n\n### 切换工作空间\n\n![](img/image00380.jpeg)\n\
    工作空间是虚拟桌面。它就像在同一个桌面上有多个显示器。如果你同时处理多个应用程序，工作空间是组织它们的好选择。要将一个应用程序从当前工作空间移动到另一个工作空间，按“活动”查看窗口和工作空间列表。获取标题栏从右侧的工作空间列表中移动到新工作空间。\n\
    \n要切换到工作空间，点击“活动”并选择工作空间，或按`Super` + `Page Down` 和`Super` + `Page Up`。\n"
- fmt: '

    Terminal is the device to input commands. Bash uses terminal to interact with
    user. Terminal term came from Unix display devices. Oracle Linux provides 6 virtual
    consoles with default installation. These terminals provide virtually independent
    shell environment while working on the server. Virtual console provides another
    way to access shell. You can change virtual terminal by pressing `Alt` + `Ctrl`
    + `function keys` on your keyboard. First terminal start at ` `F1` key through
    `F6` key on your keyboard. Suppose you want change to terminal 3 press `Ctrl`
    + `Alt` + `F3` key. If you have installed Server with GUI, then first two Virtual
    consoles will be graphical user interface available with `Ctrl` + `Alt` + `F1`
    and `Ctrl`+`Alt` + `F2` key rest of the four virtual consoles can be assessed
    using `Ctrl` + `Alt` keys up to `f6`. ![](Images/image00381.jpeg)


    # Gnome Terminal


    Gnome terminal is a terminal emulator for GNOME Desktop environment. It provides
    terminal environment in the GUI environment.


    ## Open GNOME terminal


    Press Activities, write `terminal` in search bar and click on terminal icon. ![](Images/image00382.jpeg)


    ## Shortcuts


    Following are some basic shortcuts which can be used on the bash shell.


    | Keyboard Shortcut | Task |

    | :--- | :--- |

    | `Ctrl +a` | Moves the cursor to the beginning of the command prompt |

    | `Ctrl + e` | Moves the cursor to the end of the command prompt |

    | `Ctrl + u` | Clear the current line |

    | `Middle mouse button click` | Paste the highlighted text |

    | `Tab` | Completes the command |

    | `Up / Down Keys` | Show history of commands |

    | `Ctrl +c` | Terminate the current process |

    | `Ctrl + z` | Suspends the foreground process |

    | `Ctrl + d` | Close terminal™ |


    ## Commands


    Let’s explore some basic and important command.


    ### Tab Completion


    One of the main high light of the bash shell is the tab completion. When you press
    `tab` after partially written command system automatically completes the command.
    if more than one command is available with same string then it will show the list
    of commands. Not only commands it also completes the name of files.


    Example:

    `hostna<tab>`

    `cat /etc/grou<tab>`


    `history`

    To list the previously used command.

    Example:

    `history`


    Count number of lines of line

    `wc -l`


    `date`

    Print or change the system data and time.

    Syntax:

    `date`

    To check date.

    To set date:

    `date -s "24 feb 2017 19:00"`


    `echo`

    Print text on the terminal.

    Syntax:

    `echo text`

    Example:

    `echo hello`


    ## Accessing Terminal remotely


    So far we accessed the terminal on the server locally normally servers are in
    the datacentres and you may have limited access to the server. Therefore, we usually
    access the Linux servers remotely. In this section will learn how to access the
    Linux terminal remotely on your Linux or Window PC.


    To access the server remotely we require two pieces of software one on the server
    other on the client. The most common tools to access the Linux server remotely
    are :-


    * `telnet`

    * `ssh`


    ### Telnet


    Telnet is old software that transfers data in plain format, hence it is not safe
    to use. Due to safety concerns, telnet is not available by default on the server.
    If you have specific requirement you can still install it and use it.


    #### Install telnet Server

    ```bash

    yum install telnet-server

    ```


    #### Start telnet server

    ```bash

    systemctl start telnet.socket

    ```


    #### Enable telnet server

    ```bash

    systemctl enable telnet.socket

    ```


    #### On the remote machine

    #### Install telnet client

    ```bash

    yum install telnet

    ```

    #### Run client to connect

    Syntax:

    `telnet IP_address port`

    Example:

    `telnet 192.168.0.1 8080`


    ### ssh


    `ssh` is the modern software for accessing terminal remotely. It transfers data
    in the encrypted format therefore safe to use even on the less secure network.
    Ssh has two parts, `sshd` which is the server daemon that runs on the server and
    `ssh client` which runs on the client PC.


    #### Check status of ssh server

    ```bash

    systemctl status sshd

    ```


    #### Access terminal on Linux client

    If you are using Ubuntu or oracle as Linux client PC you can access terminal with
    following procedure:-


    1. Open Terminal on the Linux client.

    2. On the command window.

    3. `ssh user@ip_address_of_the_server`

    Example:

    `ssh root@192.168.100.47`

    4. Enter password for the user.


    #### Access terminal on MS Windows

    To access the terminal on windows machine you require a third party software known
    as `putty`. the putty is the free software. You can download the software from
    the putty site:-


    1. Open site: `https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html`
    ![](Images/image00383.jpeg)

    2. On this site select 64 bit msi windows installer to download.

    3. Install the downloaded software. ![](Images/image00384.jpeg)

    After installation ![](Images/image00385.jpeg) Open up `PuTTY` on your host system,
    and in the field for Host Name (or IP address) type the IP address of your server
    and press open. ![](Images/image00386.jpeg)

    First time you will get Security Alert , press Yes.

    On the terminal screen write username and press Enter key.

    Provide password and press Enter key.


    #### Save session

    To save the session:-.

    1. Write the IP address in the IP address input box.

    2. Make sure `ssh` is selected.

    3. Write the name of session in the saved sessions input box.

    4. ![](Images/image00387.jpeg) Press Save button.


    #### Open the saved session

    To connect the server using putty session.

    1. Open `Putty`

    2. Select the session.

    3. Press Open


    # Chapter 7: Exploring File System


    In this chapter will look briefly into filesystem. Like all Linux distributions
    have following. ![](Images/image00388.jpeg)


    | Directory | Description |

    | :--- | :--- |

    | `/` | Top directory, all other directories are sub directories of root. |

    | `/bin` | This directory is link to `/usr/bin` containing executable files. |

    | `/boot` | Files for system boot. |

    | `/drv` | Device driver. |

    | `/etc` | Configuration files. |

    | `/home` | Users home directory other than root. |

    | `/lib` | Libraries. |

    | `/lib64` | 64 bit libraries |

    | `/media` | Mount point for external storage. |

    | `/mnt` | Mount point for user mounts. |

    | `/opt` | Third party software. |

    | `/proc` | Temp directory for all running process. |

    | `/root` | Home directory of root. |

    | `/run` | Temp file system used by running process. |

    | `/sbin` | Symbolic link to `/usr/sbin` directory for system executable. |

    | `/srv` | Services related data. |

    | `/sys` | Symbolic link to the kernel source tree. |

    | `/tmp` | Temporary files. |

    | `/usr` | Binary files of the users. |

    | `/var` | Variable files like logs. |


    ## What is path


    Path is the location of the file or directory. Path can be relative or absolute.


    ## Relative v/ absolute path


    There are two type of directory representation, relative and absolute path.


    ### Relative path


    Relative path is defined as path related to the current directory. Suppose you
    are in `/home` directory and want to change directory to `/home/user1`. You can
    use relative path and give command `cd user1`.


    ### Absolute path


    An absolute path is defined as the specifying the location of a file or directory
    starting from the root (`/`). Suppose you are in `/var` directory and want to
    change directory to `/home/user1`. You can use absolute path and give command
    `cd /home/user1`.


    ## File and directory operations


    In this section we will discuss few file and directory operation.


    ### Create empty file

    Syntax:

    `touch filename`

    Example:

    `touch abc.txt`


    ### Add text to end of the file

    Syntax:

    `echo “text” >> filename`

    Example:

    `echo “this is test” >> abc.txt`


    ### Create directory

    `mkdir directoryname`

    Example:

    `mkdir /example`

    it will create example directory in the root directory.


    ### Change directory

    Syntax:

    `cd directory_name`

    Example:

    `cd /example`


    ### Display file content

    `cat`

    Syntax:

    `cat file_name`

    Example:

    `cat abc.txt`


    ### To view the content of file page wise

    `more`

    Paging through text one screen full at a time.

    Syntax:

    `more filename`

    Example:

    `more /etc/hosts`


    ### less


    Less is a program similar to more, but it allows backward and forward movement
    in the file.

    Syntax:

    `less filename`

    Example:

    `less /etc/hosts`


