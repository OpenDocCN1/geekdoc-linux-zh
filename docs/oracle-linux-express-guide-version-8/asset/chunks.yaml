    ```bash\ncat /etc/oracle-release\n```\n\n### 硬件监控\n在一个屏幕上监控 CPU、内存和网络等硬件资源\n`top`\
    \ 命令是最常用的命令，带有所有硬件资源信息的摘要\n```\ntop\n```\n\n### CPU 监控\n要监控 CPU 过度提交，你可以使用 `SAR`\n\
    `sar` 命令是系统活动报告工具。\n\n#### 安装 sar 命令\n```bash\nyum install sysstat\n```\n\n####\
    \ 使用 sar 命令监控系统\n#### 语法\n```bash\nsar time number_of_sample\n```\n#### 示例\n![](img/image00423.jpeg)\n\
    ```\nsar 2 3\n```\n\n### 监控内存\n`vmstat` 命令可以查看内存和交换空间的使用情况。\n#### 语法\n```\nvmstat\
    \ delay count\n```\n#### 示例\n```\nvmstat 2 3\n```\n此命令每 2 秒执行一次。\n\n#### 显示内存摘要\n\
    ```\nvmstat -s\n```\n\n### 监控 IO 设备\n```\niostat\n```\n\n### 列出打开的文件\n此命令将显示相应进程打开的文件\n\
