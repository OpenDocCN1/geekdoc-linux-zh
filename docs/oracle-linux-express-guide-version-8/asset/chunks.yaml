    # Oracle LINUX 8 快速上手指南

    Shiv Kumar Goyal


    ## 前言


    让我们开启 Oracle Linux 之之旅。本书涵盖了 Oracle Linux 的安装、文件系统结构、网络、LVM、仓库结构、NTP、日志管理等许多其他方面。本书的结构非常简单，易于遵循。


    感谢

    Shiv Kumar Goyal


