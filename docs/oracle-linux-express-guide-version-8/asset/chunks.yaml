    ## 第 21 章：探索 Secure Shell - SSH


    SSH 是用于登录远程网络的安全协议。SSH 基于服务器-客户端模式工作：服务器上运行着 `sshd` 守护进程，客户端则使用 `ssh` 客户端进行连接。`Openssh`
    是大多数 Linux 发行版中 `ssh` 的实现。Oracle Linux 8 也支持将 `openssh` 作为 ssh 服务器。


    ### 安装 openssh 服务器

    ```bash

    yum install sshd

    ```


    启用并启动 sshd 守护进程

    ```bash

    systemctl start sshd

    systemctl enable sshd

    ```


    全系统范围内 `openssh` 服务器使用的主配置文件为 `/etc/ssh/sshd_config`。默认情况下，它是以限制的方式配置的。高级用户和开发者可以在
    `sshd_config` 文件中更改的常用设置设置如下：


    - `X11Forwarding yes`

    - `AllowAgentForwarding yes`

    - `PermitRootLogin yes`


    在修改配置文件后，停止并重启 sshd 服务。

    ```bash

    systemctl stop sshd

    systemctl start sshd

    ```


    ### 在客户端上

    ```bash

    ssh login@server_ip

    ```

    **示例**

    ```bash

    ssh root@192.168.3.1

    ```

    在 Windows 机器上使用 `putty` 软件作为 ssh 客户端连接服务器。


    ## 第 22 章：使用防火墙保护系统


    `Firewalld` 是 Oracle Linux 8 提供的防火墙管理解决方案。`Firewalld` 是 Oracle Linux 内核提供的 `iptables`
    数据包过滤系统的前端。在本章中，我们将介绍如何为 Oracle Linux 服务器设置防火墙以及防火墙管理的基础。`firewall-cmd` 是管理防火墙的命令行管理工具。


    ### 防火墙的基本概念


    #### 区域 (Zones)

    区域是根据计算机连接的位置应用到计算机的设置组。区域可能包含连接设置和连接安全设置。区域定义了你计算机的保护级别。区域连接到网络接口或分配了一系列地址。预定义的区域有：


    | 区域 | 描述 |

    | :--- | :--- |

    | drop | 最不可信的区域，仅允许出站连接。所有入站连接被拒绝且不回复。 |

    | block | 仅允许出站连接，入站连接会被用 icmp-host-prohibited 消息拒绝。 |

    | public | 当系统连接到安全性较低的网络（如直接连接到公共互联网）时应用此设置。仅允许选定的入站连接。 |

    | external | 使用 NAT 伪装，使你的内部网络保持私密性。 |

    | internal | 受信任区域，允许双向连接。 |

    | dmz | 应用于 DMZ（解密化区）。 |

    | work | 允许双向连接。 |

    | home | 允许双向连接。 |


    #### 规则 (Rule)

    在 firewalld 中，规则可以指定为：

    - 永久 (Permanent)

    - 运行 (Runtime)


    `永久`规则在重启后依然有效。`运行`规则仅在当前有效。


    #### 规则类型

    你可以配置规则以：

    - 程序 (Program)

    - 端口 (Port)

    - 预定义服务 (Predefined services)


    ### 安装防火墙

    ```bash

    yum install firewalld

    ```


    ### 启动

    ```bash

    systemctl start firewalld

    ```


    ### 启用

    ```bash

    systemctl enable firewalld

    ```


    ### 显示

    显示所有区域

    ```bash

    firewall-cmd --get-zones

    ```


    显示所有区域详细信息

    ```bash

    firewall-cmd --list-all

    ```


    显示特定区域的信息

    **语法**

    `firewall-cmd --zone=zone_name --list-all`

    **示例**

    ```bash

    firewall-cmd --zone=public --list-all

    ```


    ### 显示选定的区域

    显示防火墙默认的区域

    ```bash

    firewall-cmd --get-default-zone

    ```


    显示活动区域

    ```bash

    firewall-cmd --get-active-zones

    ```


    ### 修改防火墙规则

    更改接口的区域

    **语法**

    `firewall-cmd --zone=zone_name --change-interface=interface_name`

    **示例**

    ```bash

    firewall-cmd --zone=internal --change-interface=eth1

    ```


    更改默认区域

    **语法**

    `firewall-cmd --set-default-zone=zone_name`

    **示例**

    ```bash

    firewall-cmd --set-default-zone=internal

    ```


    将运行规则变为永久规则

    ```bash

    firewall-cmd --runtime-to-permanent

    ```


    在运行环境中永久规则

    ```bash

    firewall-cmd --reload

    ```

    此命令将重新加载防火墙设置并使用永久设置。


    ### 允许服务

    首先检查此服务是否预定义列表中

    ```bash

    firewall-cmd --get-services

    ```


    列出当前配置并允许的服务列表

    ```bash

    firewall-cmd --list-services

    ```

    添加

    **语法**

    `firewall-cmd --add-service=service_name`

    **示例**

    ```bash

    firewall-cmd --add-service=ssh

    ```

    将当前配置设为永久

    ```bash

    firewall-cmd --runtime-to-permanent

    ```

    向不同区域添加服务

    **语法**

    `firewall-cmd --add-service=service --zone=zone_name`

    **示例**

    ```bash

    firewall-cmd --add-service=ssh --zone=public

    ```

    从允许列表中移除服务

    **语法**

    `firewall-cmd --remove-service=service_name --zone=zone_name`

    **示例**

    ```bash

    firewall-cmd --remove-service=ssh --zone=public

    ```

    在此命令后将当前配置保存为永久

    ```bash

    firewall-cmd --runtime-to-permanent

    ```


    ### 添加端口

    列出所有允许的端口

    ```bash

    firewall-cmd --list-ports

    ```

    添加端口

    **语法**

    `firewall-cmd --add-port=port_no/port_type`

    **示例**

    ```bash

    firewall-cmd --add-port=1191/tcp

    ```


