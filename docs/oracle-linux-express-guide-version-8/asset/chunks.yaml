    # 第 13 章：逻辑卷管理


    LVM 或 `Logical Volume Manager`（逻辑卷管理器）允许创建磁盘和分区组，并将其作为一个磁盘使用。它在物理设备和逻辑设备之间创建了一个抽象层。LVM
    的优势如下：


    - **灵活性**：允许调整大小。

    - **快照**：对逻辑卷进行时间点快照。


    传统的磁盘设置如下：


    | 文件系统 | / | /opt | /home |

    | :--- | :--- | :--- | :--- |

    | 分区 | `/dev/sda1` | `/dev/sda2` | `/dev/sda3` |

    | 物理设备 | `/dev/sda` | `/dev/sdb` | |


    这种设置是磁盘，然后是分区，在分区之上是文件系统。


    ## LVM 设置


    | 文件系统 | / | /home | /var |

    | :--- | :--- | :--- | :--- |

    | 逻辑卷 | `/dev/sda1` | `/dev/sda2` | `/dev/sda3` |

    | 卷组 | `Vg01` | | |

    | 物理卷 | `/dev/sda` | `/dev/sdb` | |


    ### 物理卷

    物理卷（`PV`）是底层的物理存储单元。物理存储是块设备，如分区或整个磁盘。使用 `pvcreate` 命令将物理设备作为物理卷。如果块设备是分区，在使用
    `pvcreate` 命令之前，请使用 `fdisk` 将分区类型更改为 `8e (Linux LVM)`。


    ### 创建 PV

    ### 语法

    ```bash

    pvcreate device

    ```

    ### 示例

    ```bash

    pvcreate /dev/sdb

    ```

    ### 如果设备是分区

    #### 将分区类型更改为 LVM

    ```bash

    fdisk /dev/sda (参考分区章节来更改分区类型)

    ```

    #### 现在创建 PV

    ```bash

    pvcreate /dev/sda3

    ```


    ## 卷组

    一个或多个物理卷组合成一个卷组（`VG`）。卷组是一个抽象，它将底层设备呈现为一个统一的逻辑设备，具有物理卷组合后的存储容量。


    ### 创建物理卷

    注意：文本中写的是“创建物理卷”，但提供的是 `vgcreate` 的语法。

    ### 语法

    ```bash

    vgcreate vgname PV1 PV2 ..

    ```

    ### 示例

    ```bash

    vgcreate vg01 /dev/sdb /dev/sdc

    ```


    ## 逻辑卷

    逻辑卷是卷组的逻辑分区。逻辑卷可用于创建文件系统。在某些情况下，你也可以将 `LV` 作为块设备使用。


    ### 创建 LV

    ### 语法

    ```bash

    lvcreate -n name -L size VG_name

    ```

    ### 示例

    ```bash

    lvcreate -n data_lv -L 5G vg01

    ```


    ## 文件系统

    ### 在 LV 上创建 XFS 文件系统

    ### 语法

    ```bash

    mkfs.xfs lv_name

    ```

    ### 示例

    ```bash

    mkfs.xfs /dev/vg01/data_lv

    ```

    ### 在 LV 上创建 ext4 文件系统

    ### 语法

    ```bash

    mkfs.ext4 lv_name

    ```

    ### 示例

    ```bash

    mkfs.ext4 /dev/vg01/data_lv

    ```


    ## LVM 中两个值得注意的术语

    - **物理区 (Physical Extent)**

    - **逻辑区 (Logical Extent)**


    ### 物理区

    物理卷空间被划分为固定大小的单元，称为物理区，它是可以分配的最小单元。`P.E.` 大小对于同一 `VG` 中的所有物理卷都是相同的。


    ### 逻辑区

    `PE` 的映射形成了 LVM 的前端。默认情况下，一个 `PE` 映射到一个 `LE`。但在镜像的情况下，你可以将多个 `PE` 映射到一个 `LE`。


