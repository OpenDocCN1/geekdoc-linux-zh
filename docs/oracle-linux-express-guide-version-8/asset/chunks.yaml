    \n[content]\n现在你已经有了普通用户的最小和最大范围，可以列出所有普通用户：\n\n```bash\nawk -F'[/:]' '{if ($3\
    \ >= 1000 && $3 != 65534) print $1}' /etc/passwd\n```\n\n### `/etc/passwd` 文件\n\
    `/etc/passwd` 文件包含了系统上所有用户的列表，包括系统用户和普通用户。该文件的格式为每行代表一个用户。每行的字段由 `:`（冒号）分隔。这些字段包含以下信息：\n\
    \n1. 用户名\n2. 加密密码（显示为 `x`，加密密码的实际位置位于 `/etc/shadow` 文件）\n3. 用户 ID 数 (`UID`)\n\
    4. 用户组 ID (`GID`)\n5. 用户全名\n6. 家目录\n7. !![](img/image00410.jpeg)登录 shell\n\n###\
    \ 系统上所有用户列表\n```bash\nawk -F':' '{ print $1}' /etc/passwd\n```\n\n### 组 ID (GID)\n\
    Linux 中的组通过组 组 ID (`GIDs`) 定义。`GIDs` 存储在 `/etc/groups` 文件中。前 1000 个 GID 通常保留给系统使用。所有的应用程序组从\
    \ 1001 开始。\n\n### `/etc/group` 文件\n`/etc/group` 是一个定义了每个用户所属组的文件。多个用户可以属于同一个组。同一组中的每个用户名用逗号分隔。这些字段包含以下信息：\n\
    \n1. 组名。\n2. 密码：通常不使用密码，因此为空/空白。如果不为空，则存储加密密码。这在实现特权组时非常有用。\n3. 组 ID (`GID`)\n\
    4. 用逗号分隔的用户列表。\n\n![](img/image00411.jpeg)\n\n# 第 18 章：## 探索 SU 和 SUDO\n\n要提升分配给当前用户的权限，你可以使用\
    \ `su` 或 `sudo`。\n\n#### SU\n`su` 命令用于切换到另一个用户。如果执行时不指定用户名，它将默认以 root 用户身份登录。`su`\
    \ 需要目标账户的密码。\n\n**以特定用户登录**\n语法：\n```bash\nsu username\n```\n示例：\n```bash\nsu\
    \ oracle\n```\n当配合连字符（`su -`）使用时，将假设目标用户的环境。\n\n示例：\n对于 root 用户：\n```bash\nsu\
    \ -\n```\n对于其他用户：\n```bash\nsu - oracle\n```\n\n#### SUDO\n`sudo` 允许用户以另一个用户的安全权限运行程序，默认情况下，它使用管理员权限运行命令。通过这种机制，你可以将某些管理员任务分配给权限较低的用户，而无需共享管理员密码。与需要目标账户密码的\
    \ `su` 不同，`sudo` 需要当前用户的密码。在命令前加 `sudo` 即可执行任何管理命令。\n\n**运行更改系统配置的特权命令的示例**\n\
    ```bash\nsudo yum install gzip\n```\n或更改主机名：\n```bash\nsudo hostnamectl set-hostname\
    \ host2021\n```\n\n**作为不同用户运行命令。**\n语法：\n```bash\nsudo -u user command\n```\n\
    示例：\n```bash\nsudo -u user2 hostnamectl\n```\n\n**在交互模式下使用 sudo**\n```bash\nsudo\
    \ -i\n```\n\n##### 修改 sudo 配置\n`sudo` 将其配置存储在 `/etc/sudoers` 文件中。要修改 sudo 配置，请使用\
    \ `visudo` 命令。它会有效地启动 `vi` 编辑器并以 `/etc/sudoers` 文件的身份进行编辑。`visudo` 命令应由管理员执行。\n\
    \n`/etc/sudoers` 文件包含一个用户列表，以及这些用户可以运行的命令。\n\n`user host=(users) [NOPASSWORD:]commands`\n\
    \n示例：\n```text\n%operators localhost = (apache) /usr/sbin/\n```\n\n###### wheel\
    \ 组\n![](img/image00412.jpeg)Oracle Linux 自带一个默认的管理员组，称为 wheel 组。如果你想将所有管理员权限分配给一个用户而不共享\
    \ root 密码，可以将该用户添加到 wheel 组。但在此之前，请确保 `/etc/sudoer` 文件中的该行没有被注释。\n\n**将用户添加到 wheel\
    \ 组**\n```bash\nusermod --append -G wheel user_name\n```\n示例：\n```bash\nusermod\
    \ --append -G wheel user1\n```\n\n**注意：** `SU` 和 `SUDO` 的主要区别在于，在 `SU` 的情况下，你通过切换到超级用户或\
    \ root 用户来获取 root 权限，而在 `SUDO` 的情况下，你通过单个命令获取 root 权限。\n\n# 第 19 章：## 探索文件和目录权限\n\
    \nLinux 是一个多用户操作系统，可以被许多用户同时访问。因此，用户不触碰彼此的数据是绝对必要的。为了数据和系统文件的安全和正常，操作系统部署了不同类型的安全系统。Linux\
    \ 将授权分为 2 级：\n\n1. 所有权\n2. 权限\n\n#### 所有权\n所有权定义了谁可以访问文件或目录。为了表示所有权，Linux 使用以下符号：\n\
    \n| 符号 | 描述 |\n| :--- | :--- |\n| u | 用户 (所有者) - 默认情况下，创建文件或目录的用户成为该文件或目录的所有者。\
    \ |\n| g | 组 |\n| o | 其他 - 给其他用户授予权限。实际上，这意味着其他人。 |\n\n#### 权限\n权限定义了允许在文件或目录上执行的操作。这些操作是读、写和执行。...（注：原文后续存在大量重复内容，已按要求翻译）\n"
