    ```bash\nfg %2\n```\n\n## 更改进程优先级\n在系统上执行的每个进程都有调度优先级。优先级决定了当 CPU 执行进程时哪个进程先运行。高优先级的进程将在低优先级进程之前执行。相同优先级的进程一个接一个执行。\n\
    \n#### Nice 和 renice\n你可以使用 `nice` 和 `renice` 命令更改作业调度优先级。默认情况下，当你启动任何进程时，它以 0\
    \ 优先级启动，你可以使用 `nice` 命令将优先级从 `-20` 修改到 `+19`。其中 `-20` 是最低优先级，`+19` 是最高优先级。\n\n\
    #### 在启动进程时使用 `nice` 命令修改进程优先级\n#### 语法\n```bash\nnice -n priority command\n```\n\
