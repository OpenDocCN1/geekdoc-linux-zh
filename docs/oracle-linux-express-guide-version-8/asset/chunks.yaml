    终端（Terminal）是输入命令的设备。Bash 使用终端与用户进行交互。终端（Terminal）一词来自 Unix 显示设备。Oracle Linux
    默认安装提供 6 个虚拟控制台。这些终端在操作服务器时提供了几乎相互独立的 shell 环境。虚拟控制台提供了另一种访问 shell 的方式。你可以通过按下键盘上的
    `Alt` + `Ctrl` + `功能键` 来切换虚拟终端。第一个终端从键盘上的 `F1` 键到 `F6` 键开始。假设你想切换到终端 3，请按 `Ctrl`
    + `Alt` + `F3` 键。如果你安装了带有 GUI 的服务器，那么前两个虚拟控制台是可用的图形用户界面，可以通过 `Ctrl` + `Alt` +
    `F1` 和 `Ctrl`+`Alt` + `F2` 键访问，其余四个虚拟控制台可以使用 `Ctrl` + `Alt` 键一直到 `f6`![](img/image00381.jpeg)


    # Gnome Terminal


    Gnome terminal 是一个 GNOME 桌面环境的终端模拟器。它在 GUI 环境中提供终端环境。


    ## 打开 Gnome 终端


    点击“活动”（Activities），在搜索栏中输入 `terminal` 并点击终端图标![](img/image00382.jpeg)


    ## 快捷键


    以下是一些可以在 bash shell 中使用的基本快捷键。


    | 键盘快捷键 | 任务 |

    | :--- | :--- |

    | `Ctrl +a` | 将光标移动到命令提示符的开头 |

    | `Ctrl + e` | 将光标移动到命令提示符的末尾 |

    | `Ctrl + u` | 清空当前行 |

    | `鼠标中键点击` | 粘贴选中的文本 |

    | `Tab` | 补全命令 |

    | `上 / 下方向键` | 显示命令历史 |

    | `Ctrl +c` | 终止当前进程 |

    | `Ctrl + z` | 挂前台进程 |

    | `Ctrl + d` | 关闭终端™ |


    ## 命令


    让我们探索一些基础且重要的命令。


    ### Tab 补全


    bash shell 的主要亮点之一是 Tab 补全。当你部分写完命令后按下 `tab` 时，系统会自动完成该命令。如果有多个具有相同字符串的命令，它将显示命令列表。不仅是命令，它还能补全文件名。


    示例：

    `hostna<tab>`

    `cat /etc/grou<tab>`


    `history`

    列出之前使用过的命令。

    示例：

    `history`


    统计行数

    `wc -l`


    `date`

    打印或更改系统日期和时间。

    语法：

    `date`

    用于检查日期。

    设置日期：

    `date -s "24 feb 2017 19:00"`


    `echo`

    在终端上打印文本。

    语法：

    `echo text`

    示例：

    `echo hello`


    ## 远程访问终端


    到目前为止，我们是在本地访问服务器上的终端，但情况下服务器位于数据中心，你对服务器的访问权限可能是有限的。因此，我们通常远程访问 Linux 服务器。在本节中，将学习如何在你的
    Linux 或 Windows PC 上远程访问 Linux 终端。


    要远程访问服务器，我们需要两个软件：一个在服务器上，另一个在客户端上。远程访问 Linux 服务器最常用的工具是：


    * `telnet`

    * `ssh`


    ### Telnet


    Telnet 是一种旧的软件，以明文格式传输数据，因此使用不安全。由于安全考虑，服务器默认不提供 telnet。如果你有特殊需求，仍然安装并使用它。


    #### 安装 telnet 服务器

    ```bash

    yum install telnet-server

    ```


    #### 启动 telnet 服务器

    ```bash

    systemctl start telnet.socket

    ```


    #### 启用 telnet 服务器

    ```bash

    systemctl enable telnet.socket

    ```


    #### 在远程机器上

    #### 安装 telnet 客户端

    ```bash

    yum install telnet

    ```

    #### 运行客户端进行连接

    语法：

    `telnet IP 地址 端口`

    示例：

    `telnet 192.168.0.1 8080`


    ### ssh


    `ssh` 是远程访问终端的现代软件。它以加密格式传输数据，即使在安全性不低的网络上也是安全的。SSH 有两部分：`sshd` 是运行在服务器上的服务器守护进程，`ssh
    client` 是运行在客户端 PC 上的。


    #### 检查 ssh 服务器状态

    ```bash

    systemctl status sshd

    ```


    #### 在 Linux 客户端上访问终端

    如果你使用 Ubuntu 或 oracle 作为 Linux 客户端 PC，可以按照以下步骤访问终端：


    1. 在 Linux 客户端上打开终端。

    2. 在命令窗口中。

    3. `ssh 用户@服务器的 IP 地址`

    示例：

    `ssh root@192.168.100.47`

    4. 输入用户的密码。


    #### 在 MS Windows 上访问终端

    要在 Windows 机器上访问终端，你需要名为 `putty` 的第三方软件。putty 是免费软件。你可以从 putty 网站下载软件：


    1. 打开网站：`https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html`](Images/image00383.jpeg)

    2. 在此站点选择 64 位 msi windows 安装程序下载。

    3. 安装下载的软件![](img/image00384.jpeg)

    安装后![](img/image00385.jpeg) 在你的主机系统上打开 `PuTTY`，在 Host Name（主机名）字段中输入。


