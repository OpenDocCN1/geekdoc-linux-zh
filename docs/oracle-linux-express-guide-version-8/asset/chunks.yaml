    ## Chapter 1

    # Introduction


    Linux is an open source project started by Linus Torvalds in 1991. It is Unix
    like operating system. There are thousands of Linux distributions in the market,
    broadly classified on their root distribution for example CentOS, Oracle and Scientific
    Linux are based on Red hat which in further based on Fedora Linux. Fedora Linux
    is community project sponsored by Red Hat.


    ### Free V/s Paid


    Linux although is open source project but there are two types of Linux distribution
    available in the market, one is free and other one is paid. Free is self-explanatory
    you do not have to pay anything. In case of any problem, you can take help from
    volunteers working for Linux community. However, this type of support is not time
    bond. So companies who uses mission critical Linux servers and desktop computers
    prefers paid type of Linux distributions where they pay fixed amount as subscription
    and support fee. These paid Linux distribution companies keeps teams of Linux
    experts to provide support and fixes.


    Oracle Linux follow middle path, it is free to use and update but support is paid.
    Oracle Linux distribution is derived from source code of RedHat. Oracle Linux
    is functionally and binary compatible with Red hat enterprise Linux. Oracle Linux
    generally removes Red hat’s branding and artwork. After merger of Redhat with
    IBM, Centos linux which was free alternative of Redhat is no more available. Only
    product available from Centos is Centos stream which is rolling release. The customers
    that use to prefer Centos as free alternative of Redhat Linux now reluctant to
    use Centos in production environment. Oracle provides simple script to migrate
    your current Centos environment to Oracle Linux.


    ### Platform supported.


    Oracle Linux Version 8 installation images are available for following platforms:


    | Image | Platform Supported |

    | :--- | :--- |

    | x86_64 | Intel and AMD 64 Bit |

    | aarch64 | ARM 64 Bit |


    ### Types of images


    Standard installation image is in the form of ISO image only, however, you can
    also get Cloud image, Container image and Vagrant image.


    ## Chapter 2

    # Support Life Cycle of oracle Linux


    As mentioned earlier you can opt for support of Oracle Linux if you are using
    the Linux in mission critical system, the life cycle of Oracle Linux is following:


    | Releases | General Availability | Support Ends | Sustaining Ends |

    | :--- | :--- | :--- | :--- |

    | 3 | Oct 2003 | Oct 2011 | Not Available |

    | 4 | Feb 2005 | Feb 2013 | Not Available |

    | 5 | Jun 2007 | Jun 2017 | Not Available |

    | 6 | Feb 2011 | Mar 2020 | Not Available |

    | 7 | Jul 2014 | Nov 2021 | Not Available |

    | 8 | Jul 2019 | Jul 2024 | Not Available |


    ### Type of support


    Oracle provides two types of paid support for Linux. The difference between the
    two type of support is:


    | Feature | Basic Support | Premier Support |

    | :--- | :--- | :--- |

    | 24x7 telephone and online support | Yes | Yes |

    | Access to enhancements, updates, and errata | No | Yes |

    | Lifetime sustaining support | No | No |


    ## Chapter 3

    # Installation Media Preparation


    Oracle Linux downloads are available in several forms:


    | Format | Description |

    | :--- | :--- |

    | ISO images | Installation Media for x86_64 and Arm |

    | Vagrant | For Vagrant Boxes |

    | Container images | for x86_64 and Arm |

    | GitHub Container Registry | |

    | Docker Hub | Docker images |

    | Virtual machine templates | .ova format |

    | Raspberry Pi 4 and Raspberry Pi 3 | for Arm |


    In this book, we will cover only Intel installation. To download image of Oracle
    Linux follow these steps:


    1 Go to site `https://yum.oracle.com/oracle-isos.html`


    2 ![](Images/image0331.jpeg)Select the version and platform in case it is x86_64
    under Full ISO


    ### Verifying the download


    Download the checksum file from bellow site:


    ![](Images/image0332.jpeg)[https://linux.oracle.com/security/gpg/](https://linux.oracle.com/security/gpg/)


    if you have downloaded the image on Microsoft windows machine. Open the powershell
    prompt and give following command:


    Syntax

    `get-filehash path for isofile`


    Example

    ```

    ![](Images/image0333.jpegPS C:\> get-filehash D:\Download\OracleLinux-R8-U4-x86_64-dvd.iso

    ```

    Now open the checksum file and compare the output of the `get-filehash` command.


    ### Media preparation


    To prepare USB media for installation on physical machine use following steps:


    1. Download Fedora live USB creator from the Fedora Linux site.


    ![](Images/image0334.jpeg)[https://getfedora.org/fmw/FedoraMediaWriter-win32-latest.exe](https://getfedora.org/fmw/FedoraMediaWriter-win32-latest.exe)


    2. Double click the downloaded file and follow the installation steps.


    3.![](Images/image0335.jpeg)Select Custom Image


    4. Select the downloaded ISO file of Oracle Linux and press Open.


    5.![](Images/image0336.jpeg)![](Images/image0337.jpeg)Select the USB device and
    press Write to Disk.


    6. Wait to finish and press Close.


    7. Unplug the USB from the windows system.


    ![](Images/image0338.jpeg) Now installation media is ready to use.


