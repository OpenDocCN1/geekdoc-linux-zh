  raw: 'Terminal is the device to input commands. Bash uses terminal to interact with
    user. Terminal term came from Unix display devices. Oracle Linux provides 6 virtual
    consoles with default installation. These terminals provide virtually independent
    shell environment while working on the server. Virtual console provides another
    way to access shell. You can change virtual terminal by pressing Alt + Ctrl +
    function keys on your keyboard. First terminal start at F1 key through F6 key
    on your keyboard. Suppose you want change to terminal 3 press Ctrl + Alt + F3
    key.  If you have installed Server with GUI, then first two Virtual consoles will
    be graphical user interface available with Ctrl + Alt + F1 and Ctrl +Alt + F2
    key rest of the four virtual consoles can be assessed using Ctrl + Alt keys up
    to f6. ![](Images/image00381.jpeg)


    Gnome Terminal


    Gnome terminal is a terminal emulator for GNOME Desktop environment. It provides
    terminal environment in the GUI environment.


    Open GNOME terminal


    Press Activities, write terminal in search bar and click on terminal icon


    ![](Images/image00382.jpeg)


    Shortcuts


    Following are some basic shortcuts which can be used on the bash shell.


    | Keyboard Shortcut | Task |


    | Ctrl +a | Moves the cursor to the beginning of the command prompt |


    | Ctrl + e | Moves the  cursor to the end of the command prompt |


    | Ctrl + u | Clear the current line |


    | Middle mouse button click | Paste the highlighted text |


    | Tab | Completes the command |


    | Up / Down Keys | Show history of commands |


    | Ctrl +c | Terminate the current process |


    | Ctrl + z | Suspends the foreground process |


    | Ctrl + d | Close terminal™ |


    Commands


    Let’s explore some basic and important command


    Tab Completion


    One of the main high light of the bash shell is the tab completion. When you press
    tab after partially written command system automatically completes the command.
    if more than one command is available with same string then it will show the list
    of commands. Not only commands it also completes the name of files.


    Example


    hostna<tab>


    cat /etc/grou<tab>


    history


    To list the previously used command


    Example


    history


    Count number of lines of line


    wc -l


    date


    Print or change the system data and time.


    Syntax


    date


    To check date


    To set date


    date -s "24 feb 2017 19:00"


    echo


    Print text on the terminal


    Syntax


    echo text


    Example


    echo hello


    Accessing Terminal remotely


    So far we accessed the terminal on the server locally normally servers are in
    the datacentres and you may have limited access to the server. Therefore, we usually
    access the Linux servers remotely. In this section will learn how to access the
    Linux terminal remotely on your Linux or Window PC.


    To access the server remotely we require two pieces of software one on the server
    other on the client. The most common tools to access the Linux server remotely
    are :-


    *   telnet


    *   ssh


    Telnet


    Telnet is old software that transfers data in plain format, hence it is not safe
    to use. Due to safety concerns, telnet is not available by default on the server.
    If you have specific requirement you can still install it and use it.


    Install telnet Server


    yum install telnet-server


    Start telnet server


    systemctl start telnet.socket


    Enable telnet server


    systemctl enable telnet.socket


    On the remote machine


    Install telnet client


    yum install telnet


    Run client to connect


    Syntax


    telnet IP_address port


    Example


    telnet 192.168.0.1 8080


    ssh


    ssh is the modern software for accessing terminal remotely. It transfers data
    in the encrypted format therefore safe to use even on the less secure network.
    Ssh has two parts, sshd which is the server daemon that runs on the server and
    ssh client which runs on the client PC.


    Check status of ssh server


    systemctl status sshd  


    Access terminal on Linux client


    If you are using Ubuntu or oracle as Linux client PC you can access terminal with
    following procedure:-


    Open Terminal on the Linux client.


    On the command window.


    ssh user@ip_address_of_the_server


    Example


    ssh root@192.168.100.47


    Enter password for the user.


    Access terminal on MS Windows


    To access the terminal on windows machine you require a third party software known
    as putty. The putty is the free software. You can download the software from the
    putty site:-


    1 Open site


    https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html


    ![](Images/image00383.jpeg)


    2 On this site select 64 bit msi windows installer to download. 


    3 Install the downloaded software.


    ![](Images/image00384.jpeg)After installation


    ![](Images/image00385.jpeg)Open up PuTTY on your host system, and in the field
    for Host Name (or IP address) type the IP address of your server and press open.


    ![](Images/image00386.jpeg)First time you will get Security Alert , press Yes.


    On the terminal screen write username and press Enter key


    Provide password and press Enter key.


    Save session


    To save the session:-.


    1 Write the IP address in the IP address input box.


    2 Make sure ssh is selected 


    3 Write the name of session in the saved sessions input box.


    4 ![](Images/image00387.jpeg)Press Save button.


    Open the saved session


    To connect the server using putty session.


    1 Open Putty


    2 Select the session.


    3 Press Load


    4 Press Open.


