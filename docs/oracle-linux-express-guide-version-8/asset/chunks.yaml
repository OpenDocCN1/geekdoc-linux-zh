    # RPM

    Package management using `rpm`.


    Although `yum` is very versatile package manager but in some situations you have
    to manage `rpm` packages manually.


    ### List all installed packages

    ```bash

    rpm -qa

    ```


    ### List specific installed package

    ### Syntax

    ```bash

    rpm -qa |grep package_name

    ```

    ### Example

    ```bash

    rpm -qa |grep gzip

    ```


    ### Install rpm package

    ### Syntax

    ```bash

    rpm -ihv package_name

    ```

    where `-i` for install

    - `-v` for verbose mode

    - `-h` show progress

    ### Example

    ```bash

    rpm -ihv zsh-html-5.5.1-6.el8_1.2.noarch.rpm

    ```


    ### Update already installed package

    ### Syntax

    ```bash

    rpm -Uhv package_name

    ```

    ### Example

    ```bash

    rpm -Uhv zsh-html-5.5.1-6.el8_1.2.noarch.rpm

    ```


    ### Check the dependency of package

    ### Syntax

    ```bash

    rpm -qpR package_name

    ```

    ### Example

    ```bash

    rpm -qpR zsh-html-5.5.1-6.el8_1.2.noarch.rpm

    ```


    ### To list all files installed by specific package

    ### Syntax

    ```bash

    rpm -ql package_name

    ```

    ### Example

    ```bash

    rpm -ql zsh-html-5.5.1-6.el8_1.2.noarch.rpm

    ```


    ### Remove package

    ### Syntax

    ```bash

    rpm -ev package_name

    ```

    ### Example

    ```bash

    rpm -ev zsh-html

    ```


    ### Print information about the package before installation

    ### Syntax

    ```bash

    rpm -qip package.rpm

    ```

    ### Example

    ```bash

    rpm -qip zsh-html-5.5.1-6.el8_1.2.noarch.rpm

    ```


    ### To rebuild the rpm database

    ```bash

    cd /var/lib/rpm

    rm __db*

    rpm --rebuilddb

    /usr/lib/rpm/rpmdb_verify /var/lib/rpm/Packages

    ```


    # Package Group

    Package group contain packages that perform related tasks such as System Tools,
    Workstation and Minimal Install etc.


    ### List group list

