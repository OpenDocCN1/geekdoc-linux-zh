    Where `*` stands for every value, like `*` in the day of month field is for every
    day of month, `*` for the month field stands for every month and `*` for the day
    of week is for every day.


    ## User Access Control


    As crontabs can be very harmful for the system you can control the access of users
    to use crontab file for scheduling jobs using `/etc/cron.allow` and `/etc/cron.deny`
    files. Add the username in either of the two files to allow or deny the access
    to the crontab. To avoid the confusion, if the `cron.allow` file is present in
    the `/etc` directory then `cron.deny` file will not be used. If both files are
    not present than only root user can use crontab file.


    ### List the crontab entries

    ```

    crontab -l

    ```


    ### To delete user''s crontab

    ```

    crontab -r

    ```


    `root` user can change the crontab of other users, using `-u` parameter.


    ### Example

    ```

    crontab -u user2 -l

    ```


    ## At


    Unlike cron, which let you run a task on a regular basis at specified date and
    time, `at` command is mostly used for scheduling adhoc jobs. The `at` command
    is controlled by `atd` daemon. To use `at` command scheduling `atd` daemon should
    be in running state.


    ### Install

    ```

    yum install at

    ```


    ### To start and enable

    ```

    systemctl start atd

    systemctl enable atd

    ```


    ### Check the atd daemon state

    ```

    systemctl status atd

    ```


    ### To add the job

    `at` command with time and number of days from now.

    ```

    at 4pm + 3 days

    ```

    This command will open the interactive `at` prompt to write the command or script
    name you want to schedule at the 4 PM 3 days later. Press `Ctrl + d` key to exit
    `at` prompt.


    ### To add the job without interactive prompt

    ```

    at time -f scriptname

    ```


    ### Example

    ```

    at 4pm + 3 days -f /etc/opt/backup1.sh

    ```


    ### To list the scheduled jobs

    ```

    atq

    ```


    ### To delete a scheduled job

    ```

    atrm job_number

    ```


    ### Example

    ```

    atrm 3

    ```


    ## Chapter 28: Resetting forgotten root password


    To reset the unknown root password use following procedure:


    1. Reboot the machine and at GRUB menu press `e` key.

    2. ![](Images/image00427.jpeg)Look for line starting with `Linux` and move the
    cursor to end of the line using `Ctrl+e` and write `rd.break`.

    3. Press `Ctrl + x` key.

    4. It will give prompt with read only root file system.

    5. Remount the file system to Read into write mode

    ```

    mount -o remount,rw /sysroot

    ```

    6. Change the root directory

    ```

    chroot /sysroot

    ```

    7. Change password

    ```

    passwd

    ```

    8. Create file `autorelabel` to enable the SELinux relabeling process on the next
    boot.

    ```

    touch /.autorelabel

    ```

    9. Write `exit` and press enter.

    10. ![](Images/image00428.jpeg)Write `exit` and press ENTER again to start the
    system in normal mode.

