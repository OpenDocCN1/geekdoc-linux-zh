    Create partition table on a disk


    Start parted


    Syntax


    parted device_name


    Where device name is disk name


    Example 


    parted /dev/sda


    Create partition


    Syntax


    mkpart part-type name fs-type start end


    Where


    | part-type | can be primary, logical, or extended for MBR partition table. |


    | name | partition name required for GPT partition tables. |


    | fs-type | can be xfs, ext2, ext3, ext4, fat16, fat32, hfs, hfs+, linux-swap,
    ntfs, or reiserfs. The fs-type parameter is optional because parted does not create
    the file system on the partition. |


    | start and end | are sizes that determine the starting and ending points of the
    partition. Size suffixes, such as MiB, GiB, or TiB. The default size megabytes.
    |


    Example


    (parted) mkpart primary xfs 1 5GiB 


