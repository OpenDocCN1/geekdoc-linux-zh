- fmt: "\nPrint the first 10 lines of a file to the standard output. You can also\
    \ specify number of line to show.\n\n### Syntax\n`head option file`\n\n### Example\n\
    ```bash\nhead -20 /etc/passwd\n```\nShow first 20 lines of `passwd` file.\n\n\
    ### tail\nPrint the last 10 lines of a file to standard output. You can also specify\
    \ number of lines to show.\n\n### Syntax\n`tail option file`\n\n### Example\n\
    ```bash\ntail -20 /var/log/logfile\n```\nit will show last 20 lines\n\n### Use\
    \ tail to monitor file continuously\n```bash\ntail -f /var/log/logfile\n```\n\
    It will show end of growing file. `Ctrl +c` to interrupt\n\n## Copy files and\
    \ directory\n\n### Copy file\n### Syntax\n`cp filename target_dir`\n\n### Example\n\
    ```bash\ncp abc.txt /home/user1/.\n```\n\n### Copy multiple files\n### Syntax\n\
    ```bash\ncp * /target-location/.\n```\n### Example\n```bash\ncp *.txt /home/user/.\n\
    ```\nThis will copy all files with `txt` extension to `/home/user1` directory\n\
    \n### Prompt before any overwrite\n```bash\ncp –i /home /home1\n```\n\n### Forcefully\
    \ copy files\n```bash\ncp –f /tmp/abc.txt /backup/.\n```\n\n### Do not overwrite\
    \ an existing file, silently do nothing instead.\n```bash\ncp -n * /backup/.\n\
    ```\n\n### Copy directory\n### Syntax\n`cp -R source_dir target_dir`\n\n### Example\n\
    ```bash\ncp -R user1 user2\n```\ncopy `user1` directory to `user2`\n\n## Removing\
    \ file and directory\n\n### Remove file\nTo remove file or directory you can use\
    \ `rm` command.\n\n### Syntax\n`rm file_name`\n\n### Example\n```bash\nrm abc.txt\n\
    ```\nTo remove a directory and all its contents, including any subdirectories\
    \ and files:\n```bash\nrm -r /example\n```\nuse this command very carefully, can\
    \ cause data lose\n\n### Remove directory\n### Syntax\n`rmdir directory`\n\n###\
    \ Example\n```bash\nrmdir /example\n```\n\n## List file and directories\n\n###\
    \ ls\nLists the names of files and directories.\n\n### Syntax\n`ls -<options>`\n\
    \n### Long listing\n```bash\nls -l\n```\nshows list of files or directories with\
    \ size, modified date, modified time and its permission.\n\n### Show also hidden\
    \ files and directories\n```bash\nls -la\n```\n\n### Show human readable format\n\
    ```bash\nls -lh\n```\n\n### mv\n`mv` command is used to move file from one location\
    \ to other location. You can also use `mv` command to rename the file without\
    \ moving it.\n\n### To move file\n### Syntax\n`mv filename destination_directory`\n\
    \n### Example\n```bash\nmv a.txt /tmp/.\n```\nIt will move `a.txt` file from current\
    \ directory to `/tmp` directory\n\n### To rename\n### Syntax\n`mv filename newfilename`\n\
    \n### Example\n```bash\nmv a.txt b.txt\n```\n\n### grep\nSearches for a String\
    \ from one or more files. Display each line which has string.\n\n### Syntax\n\
    `grep string file`\n\n### Example\n```bash\ngrep '127.0.0.1' /etc/hosts\n```\n\
    \n### diff\nCompares two files.\n\n### Syntax\n`diff First_file Second_file`\n\
    \n### Example\n```bash\ndiff abc.txt bbc.txt\n```\n\n### file\nDetermine file\
    \ type\n\n### Syntax\n`file file_name`\n\n### Example\n```bash\nfile bbc.txt\n\
    ```\n\n## Linking files and directories\nLink is the like short cut in Windows\
    \ which point to the original file. There are two types of links:\n\n* Hard link\n\
    * Soft link\n\nBoth hard and soft link are short cut to file. Soft link can exit\
    \ in different file system where as hard link can exist only in the same file\
    \ system. When you remove original file soft link will stop working whereas there\
    \ will be no effect on hard link. The reason is that, in case of hard link both\
    \ original file and hard link is pointing to same inode.\n\n### Create Soft link\n\
    ### Syntax\n`ln -s /source/file_name /target/file_name`\n\n### Example\n```bash\n\
    ln -s /home/admin/abc.txt /abc1.txt\n```\n\n### Create hard link\n### Syntax\n\
    `ln file_name /target/file_name`\n\n### Example\n```bash\nln /home/admin/abc.txt\
    \ /home/admin/abc1.txt\n```\n\n# Chapter 8 Networking\n\nIn this chapter we will\
    \ discuss networking part. There mainly two types of networks: \n\n### Non-IP\
    \ network\nNon-IP network make use of transport layers for communication. One\
    \ of the example of Non-IP network is InfiniBand.\n\n### IP Network\nIP network\
    \ is the network which uses IP address to communicate. Each device which is part\
    \ of IP network should have IP address. IP Network is most common type of the\
    \ network type. Home, offices and internet mostly use IP network. \n\nFor IP Network\
    \ you have option to select address assignment mechanism. Two types of IP address\
    \ mechanisms are available.\n\n#### Static\nStatic IP address is manual mode of\
    \ IP address assignment to devices. In case of static IP addressing, IP address\
    \ remain same over the time, unless you change it. This type of IP addressing\
    \ is mainly used on small networks or shared devices like Servers, printer etc\
    \ where you want same IP address every time.\n\n#### Dynamic IP Address:\nDynamic\
    \ IP address configuration is an automatic configuration of addresses. It uses\
    \ `DHCP` server to get the IP address for your device. When you configure `DHCP`\
    \ server you allocate range of IP addresses to be assigned to the clients. When\
    \ you start the device it connects to the `DHCP` server to get the IP address.\
    \ Every time you start your device you may get different IP address, unless you\
    \ reserve an IP address based on `MAC` address of the device. Dynamic IP configuration\
    \ is ideal for large organizations where it is not possible to remember the address\
    \ assigned to each device. But `DHCP` is not ideal solution for servers and printers\
    \ where you want same IP address every time.\n\n### Configuring Network\nBy default,\
    \ Oracle Linux 8 uses `NetworkManager` to configure and manage network connections.\
    \ To use `NetworkManager` for configuring network interfaces, use one of the following\
    \ tools:\n\n| Tool | Description |\n| :--- | :--- |\n| `nmtui` | Text based User\
    \ Interface to manage network. This tool is very useful in non GUI environment.\
    \ |\n| `GNOME Networkmanager` | Graphical Tool for network management. |\n| `nmcli`\
    \ | Command line tool. |\n\n### Device naming convention\nThe interface name starts\
    \ with two-character prefix based on the type of interface:\n\n| Type of device\
    \ | Prefix |\n| :--- | :--- |\n| Ethernet | `en` |\n| wireless | `wl` |\n| wide\
    \ area network | `ww` |\n\nTo keep the device name persistent Oracle Linux uses\
    \ following convention for Ethernet:\n\n| Type of device | Device Name |\n| :---\
    \ | :--- |\n| Onboard devices | `enoX` where X is the device number |\n| PCIe\
    \ devices | `ensX` where X is the device number |\n| Multi-port devices | `enpZsX`\
    \ where Z is the physical port and X is the device number |\n| Traditional Naming\
    \ | `ethX` where X is the device number |\n\nTraditional naming `ethX` was used\
    \ for network devices in older versions. The new naming convention provides following:\n\
    1. Stable interface names across reboots.\n2. Stable interface names after hardware\
    \ addition and removal.\n\n### Benefits of using NetworkManager\n1. Synchronized\
    \ and updated network status for all applications.\n2. Easier network management.\n\
    3. Variety of tools for network management.\n4. Easy and flexible Wi-Fi management.\n\
    \n### Network manager scripts\nBy default, `NetworkManager` executes scripts in\
    \ the `/etc/NetworkManager/dispatcher.d` directory in alphabetical order in response\
    \ to network events. Each script should be an executable file owned by root.\n\
    \n### Using traditional scripts\nBy default Oracle Linux 8 use `NetworkManager`\
    \ for network management, however, if required you can still use the deprecated\
    \ network scripts to manage network instead `NetworkManager`.\n\nTo install the\
    \ scripts:\n```bash\nyum install network-scripts\n```\n\n### nmtui\n`nmtui` is\
    \ Text Based Interface (TUI) tool for configuring networking. This tool is very\
    \ helpful in network management on the system without GUI.\n\nTo start nmtui:\n\
    ```bash\nnmtui\n```\n\n### Set Static IP address using nmtui\nIn this example\
    \ we will set static IP address.\n1. Start `nmtui`\n2. Select Edit a connection.\n\
    3. Select the connection profile from the list and press Edit\n4. On the Edit\
    \ Connection screen, press `SPACE BAR` key at IPv4 configuration.\n5. Select Manual.\n\
    6. Press `TAB` and select Show.\n7. Provide IP Address, Netmask, gateway and DNS\
    \ in respective fields.\n8. Scroll down and make sure Automatically connect radio\
