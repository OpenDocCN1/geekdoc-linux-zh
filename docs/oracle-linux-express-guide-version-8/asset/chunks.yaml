    NTP is Network Time Protocol used to sync the time of computers. Computers worldwide
    use the Network Time Protocol (`NTP`) to synchronize their times via a hierarchy
    of NTP servers. The primary servers are at stratum 1 connects to stratum 0 via
    satellite, radio or modems.


    On Oracle Linux 8 `Chrony` provides implementation of `NTP`. `Chrony` is designed
    for systems that are often powered down or disconnected from the network like
    laptops. `chronyd` is the daemon that runs in user space and uses `chrony.conf`
    file. The NTP has two components.


    - Server

    - Client


    Clients connects to server for time synchronization. NTP provides high degree
    of time synchronization of computers on a network. Time synchronization is very
    important for logs management, login information and in some cases transaction
    fails if the time is not same on the two machines.


    ## Configuring chrony on server


    ### Install chrony package

    ```bash

    yum install chrony

    ```


    The main configuration file is `/etc/chrony.conf`. Edit this file and add bellow
    parameters.


    `server Ip_of_the_stratum`


    **Example**

    ```bash

    server 192.20.3.1

    ```


    If this server is in isolated network

    ```bash

    local stratum 10

    ```


    You can restrict the usage of NTP server for a host or network


    **Syntax**

    `allow network/hostIP`


    **Example**

    ```bash

    allow 192.116.1.0/24

    ```


    ### Save the file

    Now enable and start chronyd daemon

    ```bash

    systemctl enable chronyd

    systemctl start chronyd

    ```


    `chronyc` is a command-line program to verify the configuration. It has many options.
    The two main options are :-


    | command | Description |

    | :--- | :--- |

    | tracking | Displays system time information |

    | sources | Displays information about current sources and other information about
    source. |


    ### Verify

    To verify if chrony is working

    ```bash

    chronyc tracking

    ```

    also you can use

    ```bash

    chronyc sources

    ```


    ## On the client


    ### Install chrony package

    ```bash

    yum install chrony

    ```


    Edit `/etc/chrony.conf` and add the IP address of the NTP server

    `server IP_address_NTP`


    **Example**

    ```bash

    server 192.116.1.123

    ```


    Save and close the file

    Now enable and start chronyd daemon

    ```bash

    systemctl enable chronyd

    systemctl start chronyd

    ```


    ### Configure ntpdate

    The purpose of the `ntpdate` service is to set the clock during system boot.


    Edit `/etc/ntp/step-tickers`

    Add entries of server IP

    **Example**

    ```bash

    192.116.1.123

    ```


    Enable ntpdate and start

    ```bash

    systemctl enable ntpdate

    systemctl start ntpdate

    ```


    ### Verify

    ```bash

    chronyc sources

    ```


    ## Chapter 21: Exploring Secure Shell - SSH


    SSH is secure protocol for login to remote network. SSH works on server client
    basis on the server `sshd` daemon is running and on client it connects using `ssh`
    client. `Openssh` is an implementation of `ssh` on most of the Linux distribution.
    Oracle Linux 8 also supports `openssh` as ssh server.


    ### Install openssh server

    ```bash

    yum install sshd

    ```


    Enable and start sshd daemon

    ```bash

    systemctl start sshd

    systemctl enable sshd

    ```


    The main configuration file used by `openssh` server system-wide is `/etc/ssh/sshd_config`.
    By default, it is configured in restrictive manner. The common settings which
    can be changed in `sshd_config` file for power users and developers are following
    :-


    - `X11Forwarding yes`

    - `AllowAgentForwarding yes`

    - `PermitRootLogin yes`


    After the modification in the configuration file stop and start the sshd service.

    ```bash

    systemctl stop sshd

    systemctl start sshd

    ```


    ### On the client

    ```bash

    ssh login@server_ip

    ```

    **Example**

    ```bash

    ssh root@192.168.3.1

    ```

    On windows machine use `putty` software as ssh client to connect server.


    ## Chapter 22: Secure System with Firewall


    `Firewalld` is a firewall management solution available in the Oracle Linux 8.
    `Firewalld` is frontend for the `iptables` packet filtering system provided by
    the Oracle Linux kernel. In this Chapter, we will cover how to set up a firewall
    for Oracle Linux server and basics of managing firewall. `firewall-cmd` is the
    command line administrative tool for managing firewall.


    ### Basic concepts of firewall


    #### Zones

    Zones are groups of settings that are applied to the computer depending on where
    the computer is connected. Zones may contain connection settings and connection
    security settings. Zones defines level of protection for your computer. The zones
    are connected to networking interfaces or assigned a range of addresses. Predefined
    zones are:


    | Zone | Description |

    | :--- | :--- |

    | drop | least trusted zone in which only outgoing connections are possible. All
    inbound connections are rejected without reply. |

    | block | Only outgoing connections are allowed and incoming connections are rejected
    with an icmp-host-prohibited message. |

    | public | This setting is applied when system is connected to less secured network
    like direct connections to public internet. Only selected incoming connections
    are allowed. |

    | external | Uses NAT masquerading so that your internal network remains private.
    |

    | internal | Trusted zone both way connections are allowed. |

    | dmz | Applied in DMZ or isolated computers where only confident incoming connections
    are allowed. |

    | work | Trusted zone with more services allowed. |

    | home | Trusted zone with many services are allowed. |

    | trusted | Trust all of the machines in the network. |


    #### Rule Duration

    In firewalld, rules can be designated as:

    - Permanent

    - Runtime


    `Permanent` rules will be available even after reboot.

    `Runtime` rules which are available only now not after reboot.


    #### Rule types

    You can configure rules for specific:

    - Program

    - Port

    - Predefined services: those service which are in the database of firewall for
    allowing and blocking rules.

    - Custom


    ### Install and Enable Your Firewall service

    ```bash

    yum install firewalld

    ```


    ### Start

    ```bash

    systemctl start firewalld

    ```


    ### Enable

    ```bash

    systemctl enable firewalld

    ```


    ### Displaying firewall configuration

    Display all zones

    ```bash

    firewall-cmd --get-zones

    ```

    Display detailed information about all zones

    ```bash

    firewall-cmd --list-all

    ```

    Display information about specific zone

    **Syntax**

    `firewall-cmd --zone=zone_name --list-all`

    **Example**

    ```bash

    firewall-cmd --zone=public --list-all

    ```

    Display selected zones

    ```bash

    firewall-cmd --get-default-zone

    ```

    Display Active zone

    ```bash

    firewall-cmd --get-active-zones

    ```


    ### Change firewall rules

    Change zone of interface

    **Syntax**

    `firewall-cmd --zone=zone_name --change-interface=interface_name`

    **Example**

    ```bash

    firewall-cmd --zone=internal --change-interface=eth1

    ```

    Change default zone

    **Syntax**

    `firewall-cmd --set-default-zone=zone_name`

    **Example**

    ```bash

    firewall-cmd --set-default-zone=internal

    ```

    Change runtime rules to permanent

    ```bash

    firewall-cmd --runtime-to-permanent

    ```

    Implement permanent rules in runtime

    ```bash

    firewall-cmd --reload

    ```

    This command will reload the setting of firewall and use the permanent settings.


    ### Allow service

    First check if this service is in the list of predefined services

    ```bash

    firewall-cmd --get-services

    ```

    List the current configuration and see list of allowed services

    ```bash

    firewall-cmd --list-services

    ```

    Add

    **Syntax**

    `firewall-cmd --add-service=service_name`

    **Example**

    ```bash

    firewall-cmd --add-service=ssh

    ```

    Make current configuration as permanent

    ```bash

    firewall-cmd --runtime-to-permanent

    ```

    Add service to different Zone

    **Syntax**

    `firewall-cmd --add-service=service --zone=zone_name`

    **Example**

    ```bash

    firewall-cmd --add-service=ssh --zone=public

    ```

    Remove service from allowed list

    **Syntax**

    `firewall-cmd --remove-service=service_name --zone=zone_name`

    **Example**

    ```bash

    firewall-cmd --remove-service=ssh --zone=public

    ```

    After this command save current configuration as permanent

    ```bash

    firewall-cmd --runtime-to-permanent

    ```


    ### Add port

    List all allowed ports

    ```bash

    firewall-cmd --list-ports

    ```

    Add port

    **Syntax**

    `firewall-cmd --add-port=port_no/port_type`

    **Example**

    ```bash

    firewall-cmd --add-port=1191/tcp

    ```

    '
