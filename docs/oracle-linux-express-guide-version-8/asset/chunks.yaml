    \ | | | | | | | | | | | | | 译文：<channel|>[content]\nNow you have the minimum and\
    \ maximum range of normal, to list all normal users\n\n```bash\nawk -F'[/:]' '{if\
    \ ($3 >= 1000 && $3 != 65534) print $1}' /etc/passwd\n```\n\n### `/etc/passwd`\
    \ file\n`/etc/passwd` file hold the list of all users on the system both system\
    \ users and normal users. The format of the file is that each line represents\
    \ a user. The fields in each line are separated by `:` (colons). The fields have\
    \ following information:\n\n1. User Name\n2. The encrypted password (show `x`,\
    \ actual location of encrypted password is `/etc/shadow` file)\n3. User ID number\
    \ (`UID`)\n4. Group ID of user (`GID`)\n5. User full name\n6. Home directory\n\
    7. !![](img/image00410.jpeg)Login shell\n\n### List of all users on the system\n\
    ```bash\nawk -F':' '{ print $1}' /etc/passwd\n```\n\n### Group ID (GID)\nGroups\
    \ in Linux are defined by group IDs (`GIDs`). `GIDs` are stored in the `/etc/groups`\
    \ file. The first 1000 GIDs are usually reserved for system use. All application\
    \ groups start from 1001 onward.\n\n### `/etc/group` file\n`/etc/group` is a file\
    \ that defines the groups of each user. Multiple users can belong to same group.\
    \ Each user name in the same group is separated with commas. The fields have following\
    \ information:\n\n1. Name of the group.\n2. Password: Generally, password is not\
    \ used, hence it is empty/blank. If it is not blank, then stores encrypted password.\
    \ This is useful in implementing privileged groups.\n3. Group ID (`GID`)\n4. Users\
    \ list separated by commas.\n\n![](img/image00411.jpeg)\n\n# Chapter 18:## Exploring\
    \ SU and SUDO\n\nTo elevate the privilege assigned to the current user you can\
    \ either use `su` or `sudo`.\n\n#### SU\nThe `su` command is used to switch to\
    \ another user. If executed without a username, it will login as root user by\
    \ default. `su` requires the password of the target account.\n\n**To login as\
    \ specific**\nSyntax:\n```bash\nsu username\n```\nExample:\n```bash\nsu oracle\n\
    ```\nWhen used with a hyphen (`su -`) assume the user environment of the target\
    \ user.\n\nExample:\nFor root user:\n```bash\nsu -\n```\nFor other user:\n```bash\n\
    su - oracle\n```\n\n#### SUDO\n`sudo` allows users to run programs with the security\
    \ privileges of another user, by default, it uses administrator’s privileges to\
    \ run commands. It is mechanism by which you can assign some administrator task\
    \ to less privileged users without sharing administrator password. Unlike `su`\
    \ which requires the password of the target account, `sudo` requires the password\
    \ of the current user. Precede command with `sudo` to execute any administrative\
    \ command.\n\n**Example to run privilege command which changes system configuration**\n\
    ```bash\nsudo yum install gzip\n```\nor change hostname:\n```bash\nsudo hostnamectl\
    \ set-hostname host2021\n```\n\n**Run command as different user.**\nSyntax:\n\
    ```bash\nsudo -u user command\n```\nExample:\n```bash\nsudo -u user2 hostnamectl\n\
    ```\n\n**Use sudo in interactive mode**\n```bash\nsudo -i\n```\n\n##### Changing\
    \ the sudo Configuration\n`sudo` stores its configuration in `/etc/sudoers` file.\
    \ To modify the sudo configuration, use the command `visudo` command. It effectively\
    \ starts the `vi` editor and edits as the `/etc/sudoers` file. The `visudo` command\
    \ should to be executed by administrator.\n\nThe `/etc/sudoers` file contains\
    \ a list of users, and what commands those users can run.\n\n`user host=(users)\
    \ [NOPASSWORD:]commands`\n\nExample:\n```text\n%operators localhost = (apache)\
    \ /usr/sbin/\n```\n\n###### Wheel group\n![](img/image00412.jpeg)Oracle Linux\
    \ comes with default administrator group known as wheel group if you want to assign\
    \ all administrator rights to a user without sharing root password you can add\
    \ that user in wheel group. But before that make sure the line in `/etc/sudoer`\
    \ file it is not commented out.\n\n**To add user in wheel group**\n```bash\nusermod\
    \ --append -G wheel user_name\n```\nExample:\n```bash\nusermod --append -G wheel\
    \ user1\n```\n\n**Note:** The main difference between `SU` and `SUDO` is that\
    \ in case of `SU` you seek root permission through switching to superuser or root\
    \ user, whereas in case of `SUDO` you seek root permission through a single command.\n\
    \n# Chapter 19:## Exploring File and Directory Permissions\n\nLinux is a multi-user\
    \ operating system which can be accessed by many users simultaneously. Therefore,\
    \ it becomes utter necessary that users do not touch each other’s data. For security\
    \ and sanity of the data and system files, the operating systems deploys different\
    \ type of security system. Linux divides authorization into 2 levels:\n\n1. Ownership\n\
    2. Permission\n\n#### Ownership\nOwnership defines who can access the file or\
    \ directory. To represent the ownership Linux uses following symbols:\n\n| Symbol\
    \ | Description |\n| :--- | :--- |\n| u | User (owner) - By default user who creates\
    \ the file or directory becomes the owner of the file or directory. |\n| g | Group\
    \ |\n| o | Other - Grants permissions to other users. Practically, it means everybody\
    \ else. |\n\n#### Permission\nPermission defines action allowed on the file or\
    \ directory. These actions are read write and execute. There are actions... (Wait,\
