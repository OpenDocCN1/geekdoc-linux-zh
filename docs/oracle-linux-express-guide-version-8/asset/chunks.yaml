    要为新接口设置默认区域或更改现有接口的默认区域。首先选择所需的连接，然后从菜单栏选择 `Options`，并从下拉菜单中选择 `Change Default
    Zone`（更改默认区域）。现在从菜单列表中选择所需的区域。


    #### 配置服务


    `Firewall-config` 工具提供了用于启用和禁用预定义或自定义服务的界面。首先，选择你想要配置服务的区域。接下来勾选或取消勾选服务的复选框。选中的复选框表示已启用的服务，未选中（取消）的复选框表示被拦截的服务。


    ![](img/image00419.jpeg)


    # 第 23 章：探索 Cockpit


    `Cockpit` 是一个适用于 Oracle Linux 8 的基于 Web 的服务器管理工具。它是默认的服务器管理工具。Cockpit 是一个非常有用的
    Web GUI 工具，通过你可以监控和管理多个 Linux 服务器。Cockpit 还允许你管理服务器上的网络、存储、容器和虚拟机。使用 Cockpit 管理日志变得非常简单。


    ### 安装


    如果系统中尚未安装 Cockpit，你可以使用以下命令进行安装。


    ```bash

    yum install -y cockpit

    ```


    ### 启动并启用服务


    运行以下命令以启用并启动 cockpit 服务。


    ```bash

    systemctl start cockpit.socket

    systemctl enable cockpit.socket

    ```


    ### 检查服务状态


    ```bash

    systemctl status cockpit.socket

    ```


    ### 访问 Cockpit


    在 PC 或服务器上打开 浏览器并输入 URL：


    `https://<Your_serever_IP>:9090`


    示例

    `https://192.168.1.128:9090`


    如果你在同一台服务器上打开，可以使用 `localhost` 代替 IP 地址。


    ![](img/image00420.jpeg)


    # 第 24 章：日志管理


    日志是任何操作系统的重要部分。日志对于系统的故障排除和审计非常有帮助。Oracle Linux 将大部分日志保留在中心位置 `/var/log` 目录。重要文件之一是
    `/var/log/messages`，Oracle Linux 在此记录内核/核心系统日志。


    ## Journalctl


    `Journald` 是 Oracle Linux 中用于收集和存储日志数据的服务。该服务用于管理系统日志，包括启动消息、内核日志、syslog 信息、服务消息和系统错误消息等。默认情况下，它将所有日志保留在内存中，并将日志存储在
    `/run/log/journal` 目录下的小型环形缓冲区。如果启用了持久化日志配置，它将开始在 `/var/log/journal` 目录下存储日志。


    ### 配置文件


    `journald` 的主配置文件为 `/etc/systemd/journald.conf`。


    ### 将日志改为持久化


    如果你要在系统上永久保存日志，可以将配置文件中的 `Storage` 变量设置为 `auto` 或 `persistent`。


    ```ini

    [Journal]

    #Storage=auto

    #Compress=yes

    #Seal=yes

    #SplitMode=uid

    #SyncIntervalSec=5m

    #RateLimitIntervalSec=30s

    #RateLimitBurst=10000

    ```


    ### 从旧条目开始列出日志


    ```bash

    journalctl

    ```


    ### 列出当前启动的日志


    ```bash

    journalctl -b

    ```


    ### 列出昨天的日志


    ```bash

    journalctl --since yesterday

    ```


    ### 按特定进程 ID 列出日志


    语法

    ```bash

    journalctl -F _PID=PID

    ```


    示例

    ```bash

    journalctl -F _PID=2451

    ```


    ### 查看运行日志


    ```bash

    journalctl -f

    ```

    按 `Ctrl + C` 停止查看


    ### 查看特定数量的近期条目


    ```bash

    journalctl -n10

    ```

    此命令将显示最后 10 条条目。


    特定优先级的日志条目（如所有错误）


    ```bash

    journalctl -p err

    ```


    ### 查看所有带有警告的条目


    ```bash

    journalctl -p warning

    ```


    ## Rsyslog


    快速 Syslog 服务器或 `rsyslog` 是大多数 Linux 发行版使用的非常流行且传统的处理系统。日志文件包含有关系统、内核、服务和应用程序的消息。Oracle
    Linux 8 使用 `Rsyslog` 作为默认日志服务。`Journald` 将所有日志转发到 `rsyslog`。`Rsyslog` 将 `journald`
    转发的所有日志以纯文本格式存储在 `/var/log/` 目录下的文件中。`Rsyslog` 的主配置文件是 `/etc/rsyslog.conf`。配置文件包含存储日志消息的规则行。它具有以下参数：


    - Facility

    - Priority

    - Actions


    | Facility | Facility 是生成消息的进程或应用程序，使用 `*` 表示所有设施。 |

    | :--- | :--- |

    | Priority | Priority 是日志消息的类型，代码 `emerg` 表示紧急、`alert`、`crit` 表示关键、`err` 表示错误、`warn`
    表示警告、`info`、`debug`。使用 `*` 表示所有优先级级别。 |

    | Action | Action 决定对匹配规则必须采取什么操作。 |


    在下例示例中，Facility 是 mail，Priority 是所有错误，Action 是 mail.err 文件。


    ![](img/image00421.jpeg)


    `Rsyslog` 也可以用于转发到中央日志服务器。


    # 第 25 章：理解进程


    用户或系统执行的任何程序都会启动进程或进程来完成任务。每个进程都有自己的进程 ID。在进程的生命周期内，该进程 ID 是唯一的。进程有两种类型：


    | Foreground | 前台进程是在终端上直接运行的任何命令或任务并等待其完成。某些前台进程还需要用户交互。 |

    | Background | 与前台进程不同，shell 不等待进程完成。后台进程本质上是非交互的。 |


    ## 守护进程


    是在后台运行的特殊进程，通常不受用户登录和注销的影响。守护进程有两种：一种随系统启动，另一种由进程或命令触发。


    ## 子进程和父进程


    当一个进程启动任何新进程时，新进程被称为子进程，启动该进程的进程被称为父进程。一个父进程可以有多个子进程。


    ## Init 进程


    `Init` 进程是所有进程的母亲。它是 Linux 系统启动时执行的第一个程序。因此，`Init` 进程是所有其他进程的父进程。


    为 1


    当进程死亡而其子进程仍然运行时，这些子进程被称为孤儿进程。`init` 进程采用系统中任何孤儿运行进程。


    ## 查找进程 ID


    如提到的每个进程都有自己的进程 ID。该进程 ID 对系统非常重要，因为 Linux 内部通过其 ID 识别进程。要查找任何运行程序的进程 ID


    语法

    ```bash

    pidof program_name

    ```


    示例

    ```bash

    pidof systemd

    ```


    ### 列出所有进程。


    打印当前 shell 的进程


    ```bash

    ps

    ```


    列出系统上所有活动进程

    ```bash

    ps -e

    ```


    按用户名列出所有进程


    ```bash

    ps -eu

    ```


    显示详细进程列表


    ```bash

    ps -aux

    ```

    或

    ```bash

    ps -ef

    ```

    上述两个命令显示有关进程的详细信息，包括进程 ID 和父进程 ID。


