    Now you have the minimum and maximum range of normal, to list all normal users


    ```bash

    awk -F''[/:]'' ''{if ($3 >= 1000 && $3 != 65534) print $1}'' /etc/passwd

    ```


    ### `/etc/passwd` file

    `/etc/passwd` file hold the list of all users on the system both system users
    and normal users. The format of the file is that each line represents a user.
    The fields in each line are separated by `:` (colons). The fields have following
    information:


    1. User Name

    2. The encrypted password (show `x`, actual location of encrypted password is
    `/etc/shadow` file)

    3. User ID number (`UID`)

    4. Group ID of user (`GID`)

    5. User full name

    6. Home directory

    7. !![](Images/image00410.jpeg)Login shell


    ### List of all users on the system

    ```bash

    awk -F'':'' ''{ print $1}'' /etc/passwd

    ```


    ### Group ID (GID)

    Groups in Linux are defined by group IDs (`GIDs`). `GIDs` are stored in the `/etc/groups`
    file. The first 1000 GIDs are usually reserved for system use. All application
    groups start from 1001 onward.


    ### `/etc/group` file

    `/etc/group` is a file that defines the groups of each user. Multiple users can
    belong to same group. Each user name in the same group is separated with commas.
    The fields have following information:


    1. Name of the group.

    2. Password: Generally, password is not used, hence it is empty/blank. If it is
    not blank, then stores encrypted password. This is useful in implementing privileged
    groups.

    3. Group ID (`GID`)

    4. Users list separated by commas.


    ![](Images/image00411.jpeg)


    # Chapter 18:## Exploring SU and SUDO


    To elevate the privilege assigned to the current user you can either use `su`
    or `sudo`.


    #### SU

    The `su` command is used to switch to another user. If executed without a username,
    it will login as root user by default. `su` requires the password of the target
    account.


    **To login as specific**

    Syntax:

    ```bash

    su username

    ```

    Example:

    ```bash

    su oracle

    ```

    When used with a hyphen (`su -`) assume the user environment of the target user.


    Example:

    For root user:

    ```bash

    su -

    ```

    For other user:

    ```bash

    su - oracle

    ```


    #### SUDO

    `sudo` allows users to run programs with the security privileges of another user,
    by default, it uses administrator’s privileges to run commands. It is mechanism
    by which you can assign some administrator task to less privileged users without
    sharing administrator password. Unlike `su` which requires the password of the
    target account, `sudo` requires the password of the current user. Precede command
    with `sudo` to execute any administrative command.


    **Example to run privilege command which changes system configuration**

    ```bash

    sudo yum install gzip

    ```

    or change hostname:

    ```bash

    sudo hostnamectl set-hostname host2021

    ```


    **Run command as different user.**

    Syntax:

    ```bash

    sudo -u user command

    ```

    Example:

    ```bash

    sudo -u user2 hostnamectl

    ```


    **Use sudo in interactive mode**

    ```bash

    sudo -i

    ```


    ##### Changing the sudo Configuration

    `sudo` stores its configuration in `/etc/sudoers` file. To modify the sudo configuration,
    use the command `visudo` command. It effectively starts the `vi` editor and edits
    as the `/etc/sudoers` file. The `visudo` command should to be executed by administrator.


    The `/etc/sudoers` file contains a list of users, and what commands those users
    can run.


    `user host=(users) [NOPASSWORD:]commands`


    Example:

    ```text

    %operators localhost = (apache) /usr/sbin/

    ```


    ###### Wheel group

    ![](Images/image00412.jpeg)Oracle Linux comes with default administrator group
    known as wheel group if you want to assign all administrator rights to a user
    without sharing root password you can add that user in wheel group. But before
    that make sure the line in `/etc/sudoer` file it is not commented out.


    **To add user in wheel group**

    ```bash

    usermod --append -G wheel user_name

    ```

    Example:

    ```bash

    usermod --append -G wheel user1

    ```


    **Note:** The main difference between `SU` and `SUDO` is that in case of `SU`
    you seek root permission through switching to superuser or root user, whereas
    in case of `SUDO` you seek root permission through a single command.


    # Chapter 19:## Exploring File and Directory Permissions


    Linux is a multi-user operating system which can be accessed by many users simultaneously.
    Therefore, it becomes utter necessary that users do not touch each other’s data.
    For security and sanity of the data and system files, the operating systems deploys
    different type of security system. Linux divides authorization into 2 levels:


    1. Ownership

    2. Permission


    #### Ownership

    Ownership defines who can access the file or directory. To represent the ownership
    Linux uses following symbols:


    | Symbol | Description |

    | :--- | :--- |

    | u | User (owner) - By default user who creates the file or directory becomes
    the owner of the file or directory. |

    | g | Group |

    | o | Other - Grants permissions to other users. Practically, it means everybody
    else. |


    #### Permission

    Permission defines action allowed on the file or directory. These actions are
    read write and execute. There are two ways to represent the permissions: 1. Symbol

    2. Numbers


    **Symbols**

    To represent the file permissions following symbols are used:


    | Symbol | Permission |

    | :--- | :--- |

    | r | Read |

    | w | Write |

    | x | Execute |


    Execute permission for directory allows user to access the content of the directory.


    **Numeric representation of permissions**

    To view the permissions in numerical format each permission has a numeric value:


    | Number | Permission |

    | :--- | :--- |

    | 1 | Execute |

    | 2 | Write |

    | 4 | Read |


    We use sum to represent the net permissions.


    | Sum | Symbol | Permission |

    | :--- | :--- | :--- |

    | 0 | - | No permission |

    | 1 | --x | Execute |

    | 2 | -w- | Write |

    | 3 | -wx | Write and Execute |

    | 4 | r-- | Read |

    | 5 | r-x | Read and Execute |

    | 6 | rw- | Read and Write |

    | 7 | rwx | Read, Write and Execute |


    ![](Images/image00413.jpeg)Now let’s see how we use practically. This is the output
    of `ls -l` command:


    | Code | Object type |

    | :--- | :--- |

    | – | Regular file |

    | d | Directory |

    | l | Symbolic link |

    | c | Character device |

    | b | Block device |


    **Mask**

    Umask or user mask is the assigned default permissions when we create new file
    or directory.


    Check umask value:

    ```bash

    umask

    ```

    To change the current session umask value:

    ```bash

    umask 0044

    ```

    To calculate the umask value just subtract the desired permissions from the default:
    `777-755=22`. To set permanently use `/etc/profile` file for all users. For individual
    user change `~/.profile` or `~/.bashrc`.


    ##### Permissions command

    `chmod` is the command to manage permissions.


    **Add permission**

    Syntax:

    ```bash

    chmod +permssions filename

    ```

    Example:

    ```bash

    chmod +x para.sh

    ```

    This command will add execute permission to the file.


    **Remove permissions**

    Syntax:

    ```bash

    chmod -permssions filename

    ```

    Example:

    ```bash

    chmod -x para.sh

    ```

    you can add or remove multiple permissions at same time:

    ```bash

    chmod +xw para.sh

    ```


    **Removing permissions for group**

    Syntax:

    ```bash

    chmod g-permission filename

    ```

    Example:

    ```bash

    chmod g-xw para.sh

    ```


    **Remove permission for others**

    Syntax:

    ```bash

    chmod o-permission filename

    ```

    Example:

    ```bash

    chmod o-xw para.sh

    ```

    Like you can add and remove permissions for group and others at same time:

    ```bash

    chmod go-xw para.sh

    ```


    **Changing permissions using numeric value**

    This the most popular way for changing permissions:

    Syntax:

    ```bash

    chmod permissions filename

    ```

    Example:

    ```bash

    chmod 700 hello.txt

    ```

    this will give all permissions to the user and remove all permissions from others
    and group.


    ##### Change ownership

    `chown` command can be used to change the ownership of the file or directory.


    **Change the Owner of a File**

    Syntax:

    ```bash

    chown username  filename

    ```

    Example:

    ```bash

    chown user2 para2.sh

    ```


    **Change the Owner and Group of a File**

    Syntax:

    ```bash

    chown username:group  filename

    ```

    Example:

    ```bash

    chown user2:group2 para2.sh

    ```


    **Change only the group**

    Syntax:

    ```bash

    chown :group  filename

    ```

    Example:

    ```bash

    chown :user2 notes.txt

    ```


    **Recursively Change the file ownership**

    To recursively change ownership of the directory and its files:

    Syntax:

    ```bash

    chown -R user:group directory

    ```

    Example:

    ```bash

    chown -R user2: /home/timetable

    ```

