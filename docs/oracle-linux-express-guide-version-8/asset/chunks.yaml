    ```\nnetstat -a\n```\n\n#### 显示仅 tcp\n```\nnetstat -at\n```\n\n#### 显示所有监听端口\n\
    ```\nnetstat -tunlp\n```\n\n#### 显示路由表和默认网关\n```\nnetstat -r\n```\n\n### tcpdump\n\
    `tcpdump` 命令主要作为网络分析器或数据包嗅探通过你的计算机。要使用此命令，你需要熟悉 tcp/ip 协议。\n#### 语法\n```\ntcpdump\
    \ -i interface_name\n```\n#### 示例\n```\ntcpdump -i eth0\n```\n\n### ss\n`ss` 工具显示网络信息\n\
    #### 显示所有监听端口\n```\nss -l\n```\n\n#### 显示 uptime（Oracle Linux 系统运行了多久）\n```\n\
    uptime\n```\n\n### NFS 统计\n`nfsstat`\n#### 仅查看服务器统计\n```\nnfsstat -s\n```\n####\
