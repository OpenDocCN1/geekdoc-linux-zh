    \ to view its content on whole desktop and unmaximize or restore down a window\
    \ to restore it to its normal size.\n\n#### Maximize the Window\n\nTo maximize\
    \ a window, press and hold left button of mouse at title bar of the window to\
    \ grab the window title bar, now drag it to the top bar. Other way to maximize,\
    \ is to double click left button of mouse on the title bar of window. To maximize\
    \ a window using the keyboard press `Alt` + `F10`.\n\n#### Unmaximize window\n\
    \nTo restore a window to its normal size grab the window title bar and drag away\
    \ from the top bar or just double click title bar of window. Press `Alt` + `F10`\
    \ on the key board to unmaximize the windows using keyboard.\n\n### Tile Windows\
    \ (Snap Windows)\n\n![](Images/image00379.jpeg)\nTo copy files or to compare content\
    \ of two windows you can place two windows side-by-side. In Microsoft windows,\
    \ this feature is known as windows Snap. To snap window to left side press `Super`\
    \ + `left Arrow` and to snap window right side of screen select the window, press\
    \ `Super` + `right arrow` key on the keyboard. To snap window using mouse, grab\
