    Display information about mounted NFS file systems.


    nfsstat -m


    Graphical Gnome system monitor


    The System Monitor application allow you to monitor the condition of the system
    at any instance. Moreover, you can collect valuable information about applications.
    It provides following information:-


    *   Monitor CPU, memory, swap space and network.


    *   Monitor processes and their properties


    *   Control process behaviours


    *   Search for open files


    *   Shows disks and mounts information


    Process Tab


    Shows all running processes of the system with their CPU usage, memory usage,
    disk usage etc. Right click the process to manipulate the selected process.


    ![](Images/image00424.jpeg)


    ![](Images/image00425.jpeg)Resource Tab 


    Shows all the hardware resource usage and history in graphical format.


    ![](Images/image00426.jpeg)Filesystem Tab


    Shows mounted file system and their percentage of usage.


    Chapter 27  


    # Automating your System


    Automation of system makes job of administrator easy and reduces the number of
    mistakes during repeated tasks. Linux offers scheduler for handling regular jobs.


    Cron is a time-based job scheduler available in Oracle Linux to run commands at
    given times of intervals. Other than system wide cron table, each user can have
    separate cron table to execute schedules jobs.


    The system wide cron table file is  /etc/crontab. /var/spool/cron/ directory contains  cron
    table  files for each user.


    To Add or edit the cron job


    crontab -e


    This command will open crontab file for the user in the vi editor. you can add
    or change the crontab.


    The format of cron file is


    Minute Hour DayOfMonth Month DayOfWeek [user-name] command


    Example


    0 1 *  *  *     /opt/backup.sh


    In this example the backup script will execute at 1 am every night.'
