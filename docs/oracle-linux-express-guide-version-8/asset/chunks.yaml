- fmt: '

    A service is a program that runs in the background waiting to be used, or carrying
    out essential tasks. When system boots, it starts many services to achieve required
    state of the system. Suppose you want to start the system in GUI mode, system
    has to start all the services related to Desktop environment. Same way if you
    have configured the server as web server you have to start the web services during
    boot process. Even to do its basic tasks it requires many services to be running
    like network, date and time etc. Unlike regular software program that is launched
    by the user and closes automatically when the user log off, services can start
    without user intervention and may continue to run even after the user logs off.
    Most of the services runs in the background without the knowledge of users. Software
    developer can develop its own software to run as service.


    # Introduction to SYSTEMD


    `systemd` is a system and service manager for most of the Linux distributions.
    Oracle Linux also uses `systemd` for service management. `systemd` is backward
    compatible with legacy `SysV init` scripts. The major benefits of using `systemd`
    for service management are:-


    - Easier service management

    - Parallelized job execution at boot time

    - `cgroups` for better resource management.

    - On-demand activation of daemons


    ## Important directories and files for systemd


    | Directory | Description |

    | :--- | :--- |

    | `/usr/lib/systemd/system/` | `systemd` unit files installed programs . |

    | `/run/systemd/system/` | `systemd` unit files created at run time. |

    | `/etc/systemd/system/` | `systemd` unit files created for automatic start of
    the services. |


    ## System units type


    | Unit | Description |

    | :--- | :--- |

    | `.service` | For services |

    | `.device` | For devices |

    | `.target` | Equivalent to run level in sysv |

    | `.snapshot` | Stores state of services |

    | `.swap` | Encapsulate memory swap partitions or swap files. |


    ## Commands


    `systemctl` is the command to manage the services in Oracle Linux 8. we will use
    this command to view, start, stop, enable and disable the service.


    ### List all services

    ```

    systemctl list-units --type service --all

    ```


    ### Display status of the services

    #### Syntax

    ```

    systemctl status service_name

    ```

    #### Example

    ```

    systemctl status sshd

    ```


    ### To check whether a service is active (running)

    #### Syntax

    ```

    systemctl is-active service_name

    ```

    #### Example

    ```

    systemctl is-active sshd

    ```


    ## Starting and Stopping Services


    ### Starts a service

    #### Syntax

    ```

    systemctl start service_name

    ```

    #### Example

    ```

    systemctl start httpd

    ```


    ### Stops a service

    #### Syntax

    ```

    systemctl stop service_name

    ```

    #### Example

    ```

    systemctl stop httpd

    ```


    ### Restart a service

    #### Syntax

    ```

    systemctl restart service_name

    ```

    #### Example

    ```

    systemctl restart httpd

    ```


    ### Restart a service if it is running

    #### Syntax

    ```

    systemctl try-restart service_name

    ```

    #### Example

    ```

    systemctl try-restart httpd

    ```


    ### Reloads configuration of service

    #### Syntax

    ```

    systemctl reload service_name

    ```

    #### Example

    ```

    systemctl reload httpd

    ```


    ### Mask Service

    When you mask the service it is impossible to start the service. This is very
    useful in disabling dangerous and unknown services.

    #### Syntax

    ```

    systemctl mask service_name

    ```

    #### Example

    ```

    systemctl mask httpd

    ```


    ### Unmask the service

    #### Syntax

    ```

    systemctl unmask service_name

    ```

    #### Example

    ```

    systemctl unmask httpd

    ```


    ## Using Targets (Runlevels)


    Targets are basically intended to bring the server into a specific state. Many
    services and other units start and stop to bring the server to desired state.
    Multiple targets can be active at the same time.


    ### To see all of the targets available on your system

    ```

    systemctl list-unit-files --type=target

    ```


    ### View the default target

    Described in `/lib/systemd/system/default.target` that `systemd` tries to reach
    at boot.

    ```

    systemctl get-default

    ```


    ### To change the default target that will be used at boot

    #### Syntax

    ```

    systemctl set-default target_name

    ```

    #### Example

    ```

    systemctl set-default multi-user.target

    ```


    ### List units tied to a target

    #### Syntax

    ```

    systemctl list-dependencies target_name

    ```

    #### Example

    ```

    systemctl list-dependencies multi-user.target

    ```


    ### Predefined target

    | Target | Discerption |

    | :--- | :--- |

    | `rescue.target` | Single user mode. |

    | `multi-user.target` | Non GUI multi-user console access |

    | `graphical.target` | A GUI session. |

    | `custom.target` | custom defined targets. |

    | `emergency.target` | The most minimal environment for system repair. |


    ## Shutdown or Reboot


    ### Shutdown using systemctl

    ```

    systemctl poweroff

    ```


    ### To reboot

    ```

    systemctl reboot

    ```


    ### To boot the server in rescue mode

    ```

    systemctl rescue

    ```


    ## Enabling and disabling services


    To configure any service to start at boot time we use `systemctl enable` command.
    This command creates link file in the `/etc/systemd/system/` directory. When you
    disable any service `systemctl` removes the link file for this directory.


    ### Configure service to start automatically

    #### Syntax

    ```

    systemctl enable service_name

    ```

    #### Example

    ```

    systemctl enable httpd

    ```


    ### Disable service automatic start

    #### Syntax

    ```

    systemctl disable service_name

    ```

    #### Example

    ```

    systemctl disable httpd

    ```


    ### Checks whether a service is enabled

    #### Syntax

    ```

    systemctl is-enabled service_name

    ```

    #### Example

    ```

    systemctl is-enabled httpd

    ```


    ### List enabled services (automatic start at boot)

    ```

    systemctl list-unit-files --type service

    ```


    ### Know more about services

    #### Syntax

    ```

    systemctl cat service_name

    ```

    #### Example

    ```

    systemctl cat httpd

    ```

    or

    #### Syntax

    ```

    systemctl help service_name

    ```

    #### Example

    ```

    systemctl help httpd

    ```


    # Chapter 17: Users and Groups


    ## User and group


    A user is anyone who uses a computer or network service. A user can be ether human
    or an account. For better management, the users are grouped together in groups.
    Group is logical entity to organize users together based on their different properties,
    it can be either based on same department, same place, same work. Sometimes groups
    are just made to provide certain facilities or right to different users. When
    you create a user in Oracle Linux, by default each user is given a corresponding
    group with the same name known as User Private Group (UPG). For user and group
    management you can use both command line and GUI mode.


    Group provides following benefits:

    - Easy user management

    - To share same resource with a number of users

    - Easy permission and right assignment.


    ## User Management Commands


    ### Create a new user

    #### Syntax

    ```

    useradd options username

    ```

    #### Example

    ```

    useradd user3

    ```

    The bellow command will create user `acct1` and `-c` option adds description (comment)
    for the user:

    ```

    useradd -c accounts acct1

    ```

    Now when you check `/etc/passwd` it will show like that

    `acct1:x:1002:1002:accounts:/home/acct1:/bin/bash`


    ### Modify user

    #### Syntax

    ```

    usermod

    ```

    #### Example

    ```

    usermod -c finance acct1

    ```


    ### Delete user

    #### Syntax

    ```

    userdel

    ```

    #### Example

    ```

    userdel acct1

    ```


    ### Change or display user password expiry

    #### Syntax

    ```

    chage options username

    ```

    #### Example

    ```

    chage -l user3

    ```

    Change the maximum numbers to 90 for password change:

    ```

    chage -M 90 user3

    ```


    ### Change user password

    #### Syntax

    ```

    passwd username

    ```

    #### Example

    To change own password:

    ```

    passwd

    ```

    To change other user password if you have administrator rights:

    ```

    passwd user3

    ```


    ## Group commands


    ### Add group

    #### Syntax

    ```

    groupadd option groupname

    ```

    #### Example

    ```

    groupadd finance

    ```


    ### Delete group

    #### Syntax

    ```

    groupdel option groupname

    ```

    #### Example

    ```

    groupdel finance

    ```


    ### Modify group

    #### Syntax

    ```

    groupmod options groupname

    ```

    #### Example

    ```

    groupmod -n finance1 finance

    ```

    in this example change the group name of `finance` to `finance1`.


    ### Print the groups of the user

    ```

    groups

    ```


    ### Change the group membership

    #### Syntax

    ```

    groupmems option groupname

    ```

    #### Example

    ```

    groupmems -g finance -a apache

    ```


    ### List all groups on the system

    ```

    less /etc/groups

    ```


    ## User ID


    UID stands for user identifier. A UID is a number assigned to each user. Linux
    kernel identifies each user internally through its ID. UIDs are stored in the
    `/etc/passwd` file. User ID for root user is 0 and all system users id is less
    than 1000\. All user normal users id start from 1000 onward.


    You can check this in the `/etc/login.defs` file:

    ```

    grep -E ''^UID_MIN|^UID_MAX'' /etc/login.defs

    ```


    ### To view a user''s list of groups, UID and GIDs

    #### Syntax

    ```

    id user_name

    ```

    #### Example

    ```

    id user2

    ```


    ### Check own groupid and userid

    ```

    id

    ```


    ### List all normal users on the system

