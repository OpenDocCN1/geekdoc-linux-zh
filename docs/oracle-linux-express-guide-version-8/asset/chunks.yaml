    Example


    nmtui hostname Server2


    nmcli


    nmcli is a command-line tool for managing network. nmcli can be used to create,
    display, edit, delete, activate, and deactivate network connections. nmcli is
    a very useful tool to control and display network device status.


    Listing network devices and their status


    Syntax


    nmcli device


    ![](Images/image00394.jpeg)Example


    Device detailed information


    nmcli device show


    List connections


    nmcli connection show


    Activate Connection


    Syntax


    nmcli connection up connection_name


    Example


    nmcli connection up ens35


    Deactivate Connection


    Syntax


    nmcli connection down connection_name


    Example


    nmcli connection down ens35


    Change networking status


    Syntax


    nmcli networking on/off


    Example


    nmcli networking off 


    Show hostname


    nmcli general hostname


    Wifi network management


    Listing available WiFi APs


    nmcli device wifi list


    Connecting to password protected Wifi network


    Syntax


    nmcli device wifi connect "SSID" password "password"


    Example


    nmcli device wifi connect "mynetwork" password "pa$$w0rd"


    GNOME GUI network manager


    Network can be controlled in GUI mode in two places either from top bar system
    menu or under settings.


    Connecting Wireless connection.


    You will see Wi-Fi icon at the top bar of your desktop if system is connected
    to wireless network, otherwise follow the bellow procedure to connect to your
    home or office wireless network:-


    1.  Click System Menu.


    2.  Click Wireless not connected to expand collapsed menu.


    3.  ![](Images/image00395.jpeg)Click Select  Network.


    4.  New screen will open with all available networks. Select your Wi-Fi network
    name. Press Connect.


    5.  ![](Images/image00396.jpeg)![](Images/image00397.jpeg)If network is password
    protected, at password prompt, provide password and press Connect.


    6.  Now your network is connected and top bar will show Wi-Fi icon.


    Change Wi-Fi Password


    If for some reasons you had changed the Wi-Fi network password on your Wi-Fi router,
    you have to set the same password in your system also otherwise, it will not connect
    next time.


    1.  Click System menu.


    2.  Click wireless Connected to open sub menu.


    3.  Click Change settings.


    4.  From the list of available networks select your network and press gear icon
    next to it.


    5.  In security setting change password and press ok.


    Wired network


    Connecting wired network is easy, just plug the network cable to your computer.
    The system will automatically configure the system for available network. As soon
    as the system is connected to the wired network, system indicator shows at the
    top bar.


    Manual Wired network configuration.


    Most of the time wired network settings are automatic, but in some cases you have
    to set IP address manually. This type of configuration is known as static IP address
    configuration.


    To configure static IP address:-


    1.  Open System Menu.


    2.  ![](Images/image00398.jpeg)Click Wired Connected and select Wire Settings.


    3.  It will bring Network settings windows.


    4.  Click gear icon.


    ![](Images/image00399.jpeg)


    5.  Wired profile dialog box will open.


    6.  In the Details tab make sure Connect automatically is ticked.


    7.  ![](Images/image00400.jpeg)Click IPv4 tab.


    1 Click Manual radio button.


    2 Provide IP address.


    3 Enter Netmask,


    4 Enter Gateway.


    5 DNS


    8.  Press Apply.


    Name Resolution


    Whenever you write hostname instead of IP address to connect Linux host, you have
    followingoptions to resolve hostname to IP address.


    *   Local file i.e. /etc/hosts


    *   DNS server


    *   NIS


    Local file (/etc/hosts)


    /etc/hosts is file which stores hostname to IP address mapping. It provides ability
    to resolve hostname without using DNS server. We generally use this file if we
    are connecting to limited number of hosts due scope or security reason. Downside
    of using this file is that in case of IP address change, administrator has to
    change this file on all servers or PCs .


    Format


    IP_address hostname aliases


    Example


    127.0.0.1 server1 localhost


    31::1 server1 localhost


    192.168.228.129 server1server1.example.com


    DNS


    A DNS server is a central repository that contains a database of IP addresses
    and their associated hostnames. Whenever any client wants to resolve hostname
    to IP address instead of using its local file it sends request to DNS server.
    If IP Address of some client changes you just have to update the DNS entry. You
    can have multiple DNS server in one organization. To redirect your request for
    hostname resolution Oracle Linux uses  /etc/resolve.conf file. By default, NetworkManager
    on Oracle Linux 8 dynamically updates the  /etc/resolv.conf file. However, depending
    on your requirement you can disable DNS processing by NetworkManager.


    Teaming


    Teaming allows you to group multiple physical Ethernet network adapters into one
    logical adapter. This logical network adapter provides higher throughput or redundancy.


    Modes for Teaming


    | Round-robin | In this mode, data is transmitted across all ports in turn. |


    | Broadcast | Here data is transmitted across all ports. |


    | Load-balance | Traffic is distributed across all NICs. |


    | Active-backup | Where one link or port is activated as the rest are reserved
    as a backup. This is used for failover to provide redundancy. |


    | LACP | Uses 802.3ad protocol for link aggregation |


    Install teaming packages


    yum install teamd NetworkManager-team


    Create active backup team adapter


    Example


    nmcli connection add type team con-name bond0 ifname bond0 config ''{"runner":
    {"name": "activebackup"}}''


    Important Network Commands


    Show IP address


    ip addr show


    Show Link status


    ![](Images/image00401.jpeg)ip link show


    The highlighted text shows the link state.


    Show routing table


    ip route


    Check network reachability


    Syntax


    ping ipaddress/hostname


    Example


    ping 192.110.22.121


    Check and change host name


    The name of the computer in Linux is known as hostname. To change the hostname,
    you can use  hostnamectl command.


    Display current hostname


    hostnamectl


    Change hostname


    Syntax


    hostnamectl set-hostname newname


    Example


    hostnamectl set-hostname myhost1 


    If you are interested in changing IP address manually using command line, try  nmcli
    command. Check  nmcli-examples command for more information.


    dig


    DNS lookups and displays result


    Syntax


    dig hostname


    Example


    dig microsoft.com


    telnet


    To connect destination host:port. You can also use telnet command to test host
    and port reachability.


    Syntax


    telnet hostname port


    Example


    telnet myserver1 8080


    nslookup


    Query Internet domain name servers.


    Syntax


    nslookup hostname


    Example


    nslookup microsoft.com


    scp


    Copy files from one host to other host over the network in secure manner.


    Syntax


    scp filename user@targetserver:/path


    Example


    scp ast.txt user1@server2:/home/user1


    ssh


    For secure login to target server.


    Syntax


    ssh user@targethost


    Example


    ssh user1@server2


    nmap


    Checks the opened port on the server.


    Syntax


    nmap hostname


    Example


    nmap cloudflare.com


    Chapter 9  


    # Local file systems


    File system controls how data is stored and retrieved in the Operating system.
    File system is way to organize data on the storage. Oracle Linux 8 supports different
    type file system for local data storage. We will discuss two major file systems.


    *   XFS


    *   EXT4


    XFS


    XFS is high performance file system developed by Silicon Graphics, Inc (SGI) in
    1993\. XFS is the default file system for Oracle Linux 8\. it is journaling file
    system which means recovery of the file system is seamless in case of abrupt system
    failure. XFS is also capable of storing large files and big file systems. XFS
    can be extended and defragmented in mounted state.


    EXT4'
