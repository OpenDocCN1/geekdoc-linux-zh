    \ .\n\n# 10.1.3 SQLAlchemy and ibm_db_sa adapter\n\nSQLAlchemy is an open source\
    \ Python SQL toolkit and **Object Relational Mapper** that gives application developers\
    \ the full power and flexibility of SQL. The core of SQLAlchemy is called *\"\
    SQL expression language\"* which allows users to access a database via Python\
    \ functions and expressions using function-based query construction, instead of\
    \ using normal SQL statements. The **ibm_db_sa** adapter is a Python coded DB2\
    \ adapter built upon the ibm_db_dbi driver and provides the support for **SQLAlchemy**\
    \ APIs.\n\nAt the time of writing, SQLAlchemy 0.4 specification APIs are supported\
    \ by the ibm_db_sa adapter.\n\n> **Note:**\n> \n> You can find more information\
    \ about SQLAlchemy, including the API reference at http://www.sqlalchemy.org/\
    \ .\n\n# 10.1.4 Django framework and ibm_db_django adapter\n\nDjango is a popular\
    \ open source Python web framework for rapid application development. Similar\
    \ to SQLAlchemy, Django framework APIs enables you to access database via Python\
    \ functions and expressions rather than using normal SQL statements. The **ibm_db_django**\
    \ adapter is a Python coded DB2 adapter built upon the ibm_db_dbi driver and provides\
    \ the support for the **Django** framework APIs.\n\nAt the time of this writing,\
    \ Django 1.2 specification APIs are supported.\n\n> **Note:**\n> \n> You can find\
    \ more information about Django framework, including API reference at http://www.djangoproject.com/\
    \ .\n\n# 10.2 Setting up the environment\n\nTo set up the Python environment to\
    \ work with DB2, follow these steps:\n\n+   1. Install Python 2.5 or greater.\n\
    \nYou can install Python using one of the following options:\n\n+   -   Install\
    \ it using ActivePython binary distribution.\n\nActivePython is a free Python\
    \ binary distribution provided by ActiveState Software and is available on most\
    \ operating systems. You can download it from the website http://www.activestate.com/activepython/downloads/\
