  md: 'If you are new to the Java programming language and the concepts of JVM, JRE,
    or JDK; review the free e-book *Getting Started with Java* that is part of this
    book series.


    # 4.3 JDBC Programming


    Developing a JDBC program consists of the following steps:


    +   1. Connect to the database using either JDBC type 2 or type 4

    +   2. Execute SQL statements

    +   3. Receive results

    +   4. Handle SQL errors and warnings

    +   5. Close the connection


    We discuss each of these steps in more detail in the next sections. *Figure 4.4*
    provides a summary about the steps, interfaces, classes and methods that are used
    in a JDBC program. These are also discussed in more detail in the next sections.


    ![](img/5f6ba170efa3a607142589708531bef8_128_0.png)


    Figure 4.4 - The JDBC Programming steps, objects and methods'
