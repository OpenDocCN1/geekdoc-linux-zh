    # 4.3.2.3 The PreparedStatement interface


    A class implementing the **PreparedStatement** interface can be used to run queries
    which can contain **parameter markers**. A parameter marker is a question mark
    (?) that appears in a dynamic statement string and can appear where a variable
    could appear. **PreparedStatement** extends the **Statement** interface.


    As indicated earlier, the **prepareStatement** method of the **Connection** object
    is used to create a **PreparedStatement** object.


    If the SQL statement contains parameter markers, the values for these parameter
    markers need to be set using setter methods before executing the statement. Setter
    methods of a **PreparedStatement** object look like "**setXXX**", where **XXX**
    denotes the data type of the parameter marker. For example, **setInt**, **setString**,
    **setDouble**, **setBytes**, **setClob**, **setBlob**


    After setting the parameter values, use the **executeQuery**, **executeUpdate**,
    or **execute** methods based on the SQL type.


