    # Chapter 6 — Application Development with .NET


    Microsoft introduced the .NET Framework as a platform for building and executing
    applications on the Windows platform. It includes a large library that provides
    many features for Web development, database connectivity, user interface, and
    so on. With .NET you can write code in over forty different programming languages
    with C# and Visual Basic being the most popular ones. Regardless of the programming
    language, .NET applications compile into a type of bytecode that Microsoft calls
    Intermediate Language (IL), and executes in the Common Language Runtime (CLR).
    CLR is the heart of the .NET Framework and provides a runtime environment for
    .NET applications.


    In this chapter you will learn about:


    +   - Setting up the .NET environment to work with DB2

    +   - Understanding DataSet and providers for ADO.NET

    +   - Working with the IBM Database Add-ins for Visual Studio

    +   - Developing .NET with DB2 applications


    # 6.1 .NET with DB2 applications: The big picture


    In .NET, support to access databases is provided through ActiveX Data Objects
    (ADO) for .NET. ADO.NET supports both, connected and disconnected database access.
    .NET applications accessing a database need a .NET data provider which is normally
    supplied by the database vendor.


    For disconnected data access, instances of the DataSet class act as a database
    cache that resides in your application''s memory.


    Figure 6.1 provides an overview of .NET and DB2 applications.'
