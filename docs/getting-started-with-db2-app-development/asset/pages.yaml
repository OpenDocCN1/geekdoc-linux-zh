  md: "Listing 2.22 shows the second method to perform the JOIN.\n\n```\nSELECT u.unitID\n\
    FROM dept d, unit u\n    WHERE u.manager = XMLCAST(\n            XMLQUERY('$e//employee/name\
    \ `passing d.deptdoc as \"e\")'\n                AS char(20))\n```\n\n# **Listing\
    \ 2.22 - Second method to perform a JOIN with SQL/XML**\n\nIn this second method,\
    \ the relational column is on the left side of the JOIN. If the relational column\
    \ is on the left side of the equation, a relational index may be used instead\
    \ of an XML index.\n\n# ### 2.3.7 Joins with XQuery\n\nAssume the following tables\
    \ have been created:\n\n```\nCREATE TABLE dept(unitID CHAR(8), deptdoc XML)\n\
    CREATE TABLE project(projectDoc XML)\n```\n\nIf we use SQL/XML, a JOIN would look\
    \ as shown in Listing 2.23.\n\n```\nSELECT XMLQUERY (\n    '$d/dept/employee/\
    \ passing d.deptdoc as \"d\"')\n    FROM dept d, project p\n    WHERE XMLEXISTS\
    \ (\n        '$e/dept[@deptID=$p/project/deptID]'\n        passing d.deptdoc as\
    \ \"e\", p.projectDoc as \"p\")\n```\n\n# **Listing 2.23 - A JOIN with SQL/XML**\n\
    \nThe equivalent JOIN using XQuery is shown in Listing 2.24.\n\n```\nxquery\n\
    \    for $dept in db2-fn:xmlcolumn(\"DEPT.DEPTDOC\")/dept\n    for $proj in db2-fn:xmlcolumn(\"\
    PROJECT.PROJECTDOC\")]project\n    where $dept/@deptID = $proj/deptID\n    return\
    \ $dept/employee\n```\n\n# **Listing 2.24 - A JOIN with XQuery**\n\nThis second\
    \ method is easier to interpret -- variable $dept holds the XML document of the\
    \ XML column deptdoc in table dept. The variable $proj holds the XML document\
    \ of the XML column projectdoc in table project. Then line 4 performs the JOIN\
    \ operation between an attribute of the first XML document and an element of the\
    \ second XML document."
