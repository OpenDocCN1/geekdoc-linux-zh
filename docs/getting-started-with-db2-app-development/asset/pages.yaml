  md: '# 4.7 Summary


    In this chapter you learned the basics of developing Java applications working
    with DB2. JDBC, a standard API to access databases using dynamic SQL, was discussed
    first. The chapter showed you how to connect to a DB2 database and issue different
    kinds of JDBC statements. Then you were introduced to SQLJ. Though not that popular,
    SQLJ programming is more compact and better for performance as it uses static
    SQL embedded in Java programs. Finally, we briefly introduced you to IBM''s pureQuery.
    pureQuery is IBM''s answer to tedious JDBC programming and lack of flexibility
    of ORM frameworks.


