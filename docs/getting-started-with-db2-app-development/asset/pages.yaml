    ?>\n```\n\n**Listing 8.24 – Calling stored procedure in PHP with PDO\\_IBM/PDO\\\
    _ODBC**\n\n# 8.3.3.3.6 Handling transactions\n\nPDO, by default, runs in **autocommit**\
    \ mode. That is, all queries are either committed (if successful) or rolled back\
    \ (if unsuccessful). You can use methods like **PDO::beginTransaction** to make\
    \ multiple SQL queries be a part of a single transaction. This function turns\
    \ off the autocommit mode of the PDO application. Once the transaction completes,\
    \ it can be committed using the **PDO::commit** function or rolled back using\
    \ **PDO::rollback**.\n\n*Listing 8.25* shows PHP handling a transaction with DB2\
    \ PDO\\_IBM or PDO\\_ODBC. You can see that when an error happens, the exception\
    \ is thrown as the error handling mode is set to **PDO::ERRMODE\\_EXCEPTION**.\
    \ In the catch block, the transaction is rolled back and the error is printed.\
    \ If no error occurs, the transaction is committed and completed.\n\n```\n<?php\n\
    /* Use one of the following connection string */\n/* The connection below is for\
    \ pdo_ibm */\n$constring = 'ibm:sample';\n/* The connection below is for pdo_odbc\
    \ */\n$constring = 'odbc:sample';\n$dbh = new PDO($constring, 'db2inst1', '123');\n\
    $dbh->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\ntry (\n    $dbh->beginTransaction();\n\
    \n    $dbh->exec(\"\n        INSERT INTO customer (c_name, c_email) VALUES ('ABC',\
    \ 'a123@123.com')\n    \");\n    \n    $dbh->exec(\"\n        INSERT INTO customer\
    \ (c_name, c_email) VALUES ('DEF', '1a23@123.com')\n    \");\n    \n    $dbh->exec(\"\
    \n        INSERT INTO customer (c_name, c_email) VALUES ('GHI', '1n23@123.com')\n\
    \    \");\n\n    $dbh->commit();\n) catch (PDOException $exp) {\n    print 'Rolling\
    \ back transaction';\n    $dbh->rollback();\n}\nprint_r($dbh->errorInfo());\n\
    ```"
