    \n# **Listing 4.23 - An example of a position iterator**\n\nIn the above listing:\n\
    \n+   1.  A position iterator is declared with two columns. Note that the column\
    \ does not have names, just the data type. This is why this is a position iterator\n\
    +   2.  A variable `status` is declared. This is like a host variable that are\
    \ used to receive the values from the iterator\n+   3.  Similar to (2) for variable\
    \ `poid`.\n+   4.  A positioned iterator `iterator1` is created.\n+   5.  In connection\
    \ context `ctx1`, the `iterator1` is defined with a ```“select poid, status from\
    \ purchaseorder” ```\n+   6.  Before starting the loop, we fetch the first record\
    \ into the host variables `poid` and `status`. This is because in (7) we are not\
    \ using `next()`, but `endFetch()` so the while loop condition would end differently\
    \ if you use `next()` vs. `endFetch()`.\n+   7.  Looping through the iterator\n\
    +   8.  Printing the `poid` and `status` of each row retrieved.\n+   9.  Fetching\
    \ the next record in the iterator.\n\nNamed or position iterators can be updatable\
    \ and scrollable. By default, iterators in SQLJ are read-only and can only move\
    \ forward. To define a scrollable iterator, you need to implement `sqlj.runtime.Scrollable`\
    \ while defining the iterator.\n\nTo define an updatable cursor, you need to implement\
    \ `sqlj.runtime.ForUpdate` while defining the iterator. When defining an updatable\
    \ iterator, you also need to specify the columns you would like to update.\n\n\
    This is similar as in JDBC. Listing 4.24 provides an example of an updatable iterator.\n\
    \n```\n\n(1)\n    #sql public iterator namediterator implements sqlj.runtime.ForUpdate\n\
    \    with (updateColumns=\"STATUS\") (int poid, String status);\n(2)\n    namediterator\
    \ iterator1;\n(3)\n    #sql {ctx1 { iterator1 = { select poid, status from purchaseorder\
    \ };\n(4)\n    while (iterator1.next()) {\n(5)\n    System.out.println(\"before\
    \ update poid: \" + iterator1.poid() +\n    \" Status: \" + iterator1.status());\n\
    (6)\n    if (iterator1.status().toUpperCase().compareTo(\"UNSHIPPED\") == 0) {\n\
    \    #sql {ctx1 { update purchaseorder set status =\n    'shipped' where current\
    \ of : iterator1 };\n    }\n(7)\n    #sql {ctx1 { commit; }\n```"
