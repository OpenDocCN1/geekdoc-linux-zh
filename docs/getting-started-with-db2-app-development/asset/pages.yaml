    \ consists of component classes.\n\n+   You can run 32-bit .NET applications on\
    \ a 64-bit Windows instance, using a 32-bit edition of the IBM Data Server Provider\
    \ for .NET. To get a 32-bit IBM Data Server Provider for .NET on your 64-bit computer,\
    \ you can install the 32-bit version of IBM Data Server Driver Package.\n\n+ \
    \  To use the IBM Database Add-Ins for Visual Studio, download it from [http://www.ibm.com/db2/express/download.html](http://www.ibm.com/db2/express/download.html).\
    \ After you install a DB2 product, install the IBM Database Add-Ins for Visual\
    \ Studio by double clicking on the executable `db2exc_vsai_xxx_WIN_x86.exe`, where\
    \ xxx represents a version number that matches the version number of the DB2 server.\n\
