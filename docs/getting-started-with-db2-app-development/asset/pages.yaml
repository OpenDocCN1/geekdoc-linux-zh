- pgno: 159
  md: "performance issues and tuning become more complex because the developers no\
    \ longer control what SQL is sent to the database.\n\nIn answer to these challenges,\
    \ IBM developed *pureQuery*. You can think of pureQuery as a thin layer of APIs\
    \ that sits on top of JDBC. It facilitates the mapping of object-oriented code\
    \ with the relational model as ORM frameworks do; but it also gives you the flexibility\
    \ to work with your SQL. Therefore, pureQuery programming model and tools, help\
    \ with Java data access, improves performance by generating code that uses best\
    \ practice approaches such as using JDBC-like batch updates, and helps with problem\
    \ determination.\n\nIn addition to APIs, pureQuery also provides the following:\n\
    \n+   A runtime, which provides optimized and secure database access\n+   An Eclipse-based\
    \ integrated database development environment for enhancing development productivity\n\
    +   Monitoring services, to provide developers and DBAs with previously unknown\
    \ insights about performance of Java database applications.\n\npureQuery also\
    \ allows you to generate static SQL without changing any code. This unlocks the\
    \ advantages of static SQL without any effort.\n\nThe tools for pureQuery are\
    \ included in the product *Optim Development Studio*. The APIs and runtime are\
    \ available with the product Optim™ pureQuery Runtime and is also packaged at\
    \ no extra charge for development use on the developer’s machine with Optim Development\
    \ Studio. Monitoring services are delivered in Optim Development Studio and to\
    \ a greater degree with the IBM DB2 Performance Expert and Extended Insight Feature.\n\
    \nIBM Optim™ portfolio of products, provide an integrated, modular environment\
    \ to design, develop, deploy, operate, optimize and govern enterprise data throughout\
    \ its lifecycle. This is known as *Optim Integrated Data Management*.\n\n> **Note:**\n\
    > More information about pureQuery and Optim Integrated Data Management can be\
    \ found in the free e-books *Getting Started with pureQuery*, and *Getting Started\
    \ with IBM Data Studio for DB2* respectively. Both eBooks are part of this book\
    \ series.\n\n# ## 4.6 Exercises\n\nIn this exercise you will practice writing\
