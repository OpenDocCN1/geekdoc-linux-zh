- pgno: 295
  md: "+   1. The `db2_bind_param` binds a PHP variable to an SQL statement parameter\n\
    +   2. The `db2_fetch_object` returns an object with properties representing columns\
    \ in the fetched row so we have a variable object to hold it.\n+   3. The `db2_rollback()`\
    \ rolls back an in-progress transaction on the specified connection resource and\
    \ begins a new transaction. PHP applications normally default to `AUTOCOMMIT`\
    \ mode, so `db2_rollback()` normally has no effect unless `AUTOCOMMIT` has been\
    \ turned off for the connection resource.\n\n> **Note:**  \n> If the specified\
    \ connection resource is a persistent connection, all transactions in progress\
    \ for all applications using that persistent connection will be rolled back. For\
    \ this reason, persistent connections are not recommended for use in applications\
    \ that require transactions.\n\nIn addition, note the following before you bind\
    \ the variables:\n\n+   - The PHP variable name needs to enclosed in double quotes\
    \ (\"`) and without the dollar sign ($) \"variable\".\n+   - Check for the position\
    \ variable of the bound parameters. The indexing should start at 1.\n+   - For\
    \ variables other than `INTEGER` and `VARCHAR`, we recommend you use the data\
    \ type specified: `DB2_BINARY`, `DB2_CHAR`, `DB2_DOUBLE`, or `DB2_LONG`.\n\nAnother\
    \ example using the `DECIMAL` data type, requires you to use the parameter `DB2_LONG`\
    \ in `db2_bind_param`. In the statement below, *amount* is a `DECIMAL` type variable.\n\
    \n```\n```sql\n// Here we bind a decimal (10,2) type variable amount\ndb2_bind_param($stmt,\
    \ 1, \"amount\", DB2_PARAM_IN,DB2_LONG);\n```\n```\n\n# **3. Executing the query**\n\
    \nOnce you prepare the query, bind the parameter in `db2_bind_param`. The statement\
    \ resource is obtained after the query is prepared and binding is passed as the\
    \ input to `db2_execute`, which executes the statement. You can find a sample\
    \ program for this method in *Listing 8.6*.\n\nAlternatively, pass the parameter\
    \ as an array directly to `db2_execute`. In this case, the array variable also\
    \ needs to be provided as the second parameter in addition to the ones from `db2_bind_param`.\n\
    \nOnce the query is executed, you can use the statement resource to get the result\
    \ set using one of the following functions:"
