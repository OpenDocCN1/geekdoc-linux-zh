  md: "> **Note:**\n> \n> For Windows, it is always recommended to download the `*.msi`\
    \ installers instead of the zip archives for installation of both the Web server\
    \ (Apache in our case) and PHP.\n\n# 8.3 PHP - DB2 application development\n\n\
    In this section, we describe how to access a DB2 database from a PHP application.\
    \ We first describe the different extensions that can be used for this purpose.\n\
    \n# 8.3.1 PHP extensions to use with DB2\n\nThere are three PHP extensions you\
    \ can use with DB2 software (\"DB2\"), though only the first two are recommended\
    \ ones:\n\n+   - **ibm_db2**\n+   A PHP extension written, maintained, and supported\
    \ by IBM for access to DB2 databases.\n+   \n+   - **pdo_ibm** / **pdo_odbc**\n\
    +   A driver for the PHP Data Objects (PDO) extension that offers access to DB2\
    \ databases through the standard object-oriented database interface introduced\
    \ in PHP 5.1. It uses CLI as the underlying interface to DB2. Alternatively, you\
    \ can use pdo_odbc which uses ODBC drivers or DB2 CLI.\n+   \n+   - **Unified\
    \ ODBC**\n+   An extension that historically provided access to DB2 database systems.\
    \ It is not recommended that you write new applications with this extension because\
    \ ibm_db2 and pdo_ibm both offer significant performance and stability benefits\
    \ over Unified ODBC. We will not cover this extension in this book.\n\n> **Note:**\n\
    > \n> The **ibm_db2** extension API makes porting an application that was previously\
    \ written for Unified ODBC almost as easy as globally changing \"odbc_\" to \"\
    db2_\" throughout the source code of your application since all function names\
    \ start with \"odbc_\" in Unified ODBC and \"db2_\" in **ibm_db2** with the rest\
    \ of the name being identical in both.\n\n# 8.3.2 PHP development with the ibm_db2\
    \ extension\n\nIf you are working in Linux/UNIX, before using ibm_db2, make sure\
    \ that the php.ini configuration has been set to the DB2 instance you want PHP\
    \ to connect to, so that PHP will refer to the libraries of the respective instance\
    \ for connecting and querying the"
  merge: -1
  img_proc: true
- pgno: 289
  md: "database. In Linux/UNIX, this overrides the environment variable DB2INSTANCE,\
    \ while in Windows this option is simply ignored.\n\nIf not already present, you\
    \ can make an entry in the `php.ini` file as follows assuming you are using the\
    \ default instance name of **db2inst1**:\n\n```\n[ibm_db2]\nibm_db2.instance_name=db2inst1\n\
    ```\n\nAnother global variable that we can change in the `php.ini` file is the\
    \ **ibm_db2.binmode** which can be used to modify the binary data handling by\
    \ the PHP driver. The syntax is:\n\n```\nibm_db2.binmode = \"n\"\n```\n\nWhere\
    \ n = {1,2,3}.\n\nWhen set to \"1\", the **DB2_BINARY** constant gets set and\
    \ all binary data is handled as it is.\n\nWhen set to \"2\", the **DB2_CONVERT**\
    \ constant gets set and all the binary data is converted into ASCII by the ibm_db2\
    \ driver.\n\nWhen set to \"3\", the **DB2_PASSTHRU** constant gets set and all\
    \ the binary data gets converted into a null value.\n\n# 8.3.2.1 Program flow\n\
    \nThe typical steps followed by a PHP program are:\n\n+   1. Connect to the database.\n\
    +   2. Prepare and execute the statement.\n+   3. Process the results.\n+   4.\
    \ Free the resources.\n\nPHP uses handlers for connections and statements. Handlers\
    \ are variables that are set after a connection or a statement execution, and\
    \ are useful to establish a relationship between a connection and the statements\
    \ being executed.\n\n# 8.3.2.2 Connecting to a Database\n\nThere are two methods\
    \ to connect to a DB2 database:\n\n+   - Non persistent connection (**db2_connect**)\
    \ \n+   - Persistent database connection (**db2_pconnect**)\n\nAs the name suggests,\
    \ the non persistent connection disconnects and frees up the connection resources\
    \ after each **db2_close**, or when the connection resource is set to NULL, or\
    \ the script ends. Performance can be impacted if database sessions are made"
  merge: -1
  img_proc: true
- pgno: 290
  md: "and freed too often. However, it is advisable to use a non persistent connection\
    \ when you are doing INSERT, UPDATE, or DELETE like operations.\n\nIn the case\
    \ of persistent connections, the connection resources are not freed up after a\
    \ `db2_close` or the script is exited. Whenever a new connection is requested,\
    \ PHP tries to reuse the connection with the same credentials.\n\nThe syntax of\
    \ the connection varies depending on whether the database has been cataloged in\
    \ DB2 or not.\n\n# 8.3.2.2.1 Making a connection to a cataloged database\n\nTo\
    \ make a connection to a cataloged database, the database alias name, user ID,\
    \ and password of the database server are the required parameters in `db2_connect`.\
    \ Listing 8.1 shows an example for connecting to the SAMPLE database.\n\n```\n\
    <?php\n$db2_name = 'Sample';\n$usr_name = 'db2inst1';\n$password = '123456';\n\
    // For persistent connection, change db2_connect to db2_pconnect\n(1) $conn_resource\
    \ = db2_connect($db2_name, $usr_name, $password);\nif ($conn_resource) {\n   \
    \ echo 'Connection to database succeeded.';\n    db2_close($conn_resource);\n\
    } else {\n    echo 'Connection to database failed.';\n    echo 'SQLSTATE value:\
    \ ' . db2_conn_error();\n    echo 'with Message: ' . db2_conn_errormsg();\n}\n\
    ?>\n```\n\n# Listing 8.1 – Connecting to a cataloged database\n\nIn the above\
    \ listing:\n\n+   1. conn_resource is the connection handler after the `db2_connect()`\
    \ method obtains a connection\n+   2. The `db2_close()` method is used to close/relinquish\
    \ the connection resources we had acquired before.\n\n# 8.3.2.2.2 Making a connection\
    \ to a non-cataloged database\n\nTo create a connection to a non-cataloged remote\
    \ database we need to pass the details about the database server into a connection\
    \ string and pass it as a parameter in the connection function. The connection\
    \ string should be in the following format:\n\n```\nDRIVER={IBM DB2 ODBC DRIVER};DATABASE=database\
    \ name;HOSTNAME=host\n```"
  merge: -1
  img_proc: true
- pgno: 291
  md: "```\nname;PORT=port;PROTOCOL=TCPIP;UID=user name;PWD=password;\n```\n\n# ###\
    \ 8.3.2.3 Preparing and executing a statement\n\nBefore you prepare and execute\
    \ SQL statements, you need to decide the following characteristics about the transaction:\n\
    \n+   - Type of cursor used\n+   - How to catch the error\n+   - Isolation level\
    \ to use\n\n# #### 8.3.2.3.1 Type of cursor to be used\n\nPHP with **ibm\\_db2**\
    \ supports two kinds of cursors:\n\n+   - **Forward only cursors**\n+     This\
    \ is the default cursor of a PHP application with **ibm\\_db2**. The cursor fetches\
    \ the result set row by row in a unidirectional way. It is an ideal cursor when\
    \ we want to perform read-only operations against the database.\n\n+   - **Scrollable\
    \ cursors**\n+     The **ibm\\_db2** extension implements scrollable cursors using\
    \ the keyset-driven scrollable cursor. This cursor can detect and make changes\
    \ to the underlying data. When the cursor is opened, DB2 makes a keyset where\
    \ it stores the keys, which are used to determine the order and the set of rows\
    \ in the cursor. As the fetch operation proceeds, the cursor scrolls through the\
    \ keys in the keyset to retrieve the most recent values in the database.\n\n#\
    \ #### 8.3.2.3.2 How to catch an error\n\nThe application you write should be\
    \ good enough to catch and explain all exceptions to the user, including the SQL\
    \ and database errors. For that, the program should check the return values of\
    \ the database functions and print the **SQLSTATE** and the error message if an\
    \ error has occurred. Use `db2_stmt_error` and `db2_stmt_errormsg` to display\
    \ the error details when an error occurs. *Listing 8.2* provides an example.\n\
    \n```\n```php\n$stmt = db2_exec($conn_resource, $sql);\nif (!$stmt) {\n    echo\
    \ 'SQLSTATE value: ' . db2_stmt_error();\n    echo 'with Message: ' . db2_stmt_errormsg();\n\
    }\n```\n```\n\n**Listing 8.2 – Displaying error details**"
  merge: -1
