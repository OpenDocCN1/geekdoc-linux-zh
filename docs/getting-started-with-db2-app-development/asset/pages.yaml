- pgno: 336
  md: "# Chapter 10 – Application development with Python\n\n*Python* is a platform\
    \ independent interpreted programming language which is free and available on\
    \ many operating systems including Windows, Linux, UNIX and Mac OS X.\n\nPython\
    \ is an open source language environment managed by the **Python Software Foundation**\
    \ ([http://www.python.org](http://www.python.org/)). Python’s object-oriented\
    \ features, and flexible data typing, together with its extensive standard libraries,\
    \ makes it a popular language for rapid application development, including database\
    \ applications.\n\nIn this chapter you will learn about:\n\n+   - Setting up the\
    \ Python environment to work with DB2\n+   - Connecting to a DB2 database from\
    \ a Python application\n+   - Developing Python applications to access DB2 data\n\
    \n> **Note:**\n> \n> If you are new to the Python programming language, review\
    \ the free eBook *Getting Started with Python* which is part of this book series.\n\
    > \n> This chapter assumes you have created the SAMPLE database included with\
    \ DB2. If you haven’t, create it using the command `db2samp1`.\n\n# 10.1 Python\
    \ - DB2 applications: The big picture\n\nPython applications access DB2 data servers\
    \ through Python DB2 APIs and their drivers/adapters. Depending on the database\
    \ API you want to work with, there are different types of drivers/adapters you\
    \ can choose from. The high level view of these APIs and their drivers/adapters\
    \ is illustrated in the *Figure 10.1*."
