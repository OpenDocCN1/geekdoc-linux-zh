    # Listing 5.2 – Include required header files


    # 5.3.4.2 Declare Host variables


    As discussed in *Chapter 1 - Introduction to DB2 Application Development*, an
    embedded SQL application communicates to the C/C++ host language with the help
    of host variables. In this second step you must declare the host variables at
    the top of the program in the DECLARE section. The host variable DECLARE SECTION
    starts with the EXEC SQL BEGIN keyword and ends with EXEC SQL END keyword as illustrated
    in *Listing 5.3*.


    ```

    EXEC SQL BEGIN DECLARE SECTION;

    sqlint32 hempno;              /* to store employee id */

    char hfirstrname[20];        /* to store employee first name */

    char hlastname[20];          /* to store employee last name */

    char hedlevel[4];            /* to store employee education level */

    double hsalary ;             /* to store employee salary */

    double hnewsalary;           /* to store employee new salary */

    char hdynstmt[16384];        /* to store SQL statements*/

    EXEC SQL END DECLARE SECTION;

    ```


    # Listing 5.3 – Declare host variables


    # 5.3.4.3 Connect to the database


    Before you can perform operations on the database, you need to establish a connection.
    Database connections can be established implicitly or explicitly. An implicit
    connection is a connection where the user ID is assumed to be the current user
    ID. Explicit connection is a connection, which requires a user ID and password
    to be specified in the connect statement. In C/C++ applications, an implict database
    connection can be established by executing the following statement:


    ```

    EXEC SQL CONNECT TO sample;

    ```


    If you want to establish an explicit connection use the following statement:


    ```

    EXEC SQL CONNECT TO sample USER administrator USING admin123;

    ```


