    +   4. Execute the SQL statement by calling **ibm_db.execute()** function.

    +   The syntax of function **ibm_db.execute** is as follows:


    ```

    Py_True/Py_False ibm_db.execute(IBM_DBStatement stmt [, tuple parameters])

    ```


    # Table 10.6 describes the parameters of ibm_db.execute()


    | Name | Description |

    |---|---|

    | stmt | A prepared statement returned from **ibm_db.prepare()** |

    | parameters | Optional: A tuple of input parameters matching any parameter markers
    contained in the prepared statement. It’s optional if you have called the function
    **bind_param** to bind the parameters. |


    # Table 10.6 - Parameters for function ibm_db.execute


    The function returns **True** if the SQL is executed successfully, otherwise it
    raises an exception. If the SQL to run is a **SELECT** statement or a **CALL**
    to a stored procedure (calling stored procedures will be discussed more in later
    sections) that returns one or more result sets, the result sets will be associated
    with the statement object. You can then use various fetch functions, such as **ibm_db.fetch_tuple**,
    to retrieve rows from the result set as discussed in the previous **section 10.3.4**.


    For example, you can execute the **SELECT** statement prepared in previous steps
    as follows:


    ```

    ibm_db.execute(stmt)

    ```


    After successful execution of the SQL statement, a result set is associated with
    the statement. You can then begin fetching rows from the result set.'
