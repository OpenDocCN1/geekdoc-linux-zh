- pgno: 124
  md: '# # Chapter 4 – Application development with Java


    This chapter discusses the basics of application development with Java and DB2.
    Most Java applications use *Java Database Connectivity (JDBC)* to access databases
    using dynamic SQL; or SQLJ to access databases using static SQL. These are a set
    of classes and interfaces written in Java that are vendor-neutral.


    In this chapter you will learn about:


    +   - Programming using JDBC

    +   - Programming using SQLJ

    +   - Programming using pureQuery


    # ## 4.1 Java - DB2 applications: The big picture


    Developing Java applications that access a database uses the JDBC or SQLJ standard.
    Support for this standard is provided through a JDBC or SQLJ driver provided by
    the database vendor as illustrated in *Figure 4.1* where a DB2 data server is
    used.


    ![](img/5f6ba170efa3a607142589708531bef8_124_0.png)


    **Figure 4.1 - Java applications accessing a DB2 database**


    In the figure, a Java application connects to a DB2 data server through the JDBC/SQLJ
    driver. After a successful connection, SQL or XQuery statements issued from the
    Java application are passed to the DB2 data server for processing, and then result
    is returned to the Java application.


    JDBC and SQLJ applications can work with minimal modification on data servers
    that are compliant to the JDBC/SQLJ specifications such as DB2, Informix®, Oracle®,
    SQL Server®, and so on. DB2 9.7 has support for the JDBC 4.0 specification and
    earlier.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'In the case of DB2, its JDBC and SQLJ driver is included in either of the following:


    +   * Any DB2 data server edition


    +   * IBM Data Server Client


    +   * IBM Data Server Runtime Client


    +   * IBM Data Server Driver for JDBC and SQLJ


    Data server editions, clients and drivers were described in *Chapter 1 - What
    is DB2 Express-C?* Clients and drivers are free of charge. Depending on the type
    of JDBC driver you use in your application, you may require a client to be installed
    or not. The different types of JDBC drivers are explained in the next section.


    # ## 4.2 Setting up the environment


    Before you can run or develop JDBC or SQLJ applications ensure your environment
    is correctly set up.


    If you would like to develop Java stored procedures and Java user-defined functions
    which reside on the DB2 server, ensure a JDK is installed in the DB2 server. Fortunately,
    when you install DB2 Version 9.7, the IBM SDK for Java 6 (also known as JDK 6)
    is installed by default on all platforms. The location where it is installed is
    indicated in the database manager configuration (**dbm cfg**) parameter **JDK_PATH**.
    For example, on Windows the default location is `C:\Program Files\IBM\SQLLIB\java\jdk`.
    The Java compiler (**javac**) at this location will be used to compile Java stored
    procedures and Java user-defined functions. The **JVM** that is part of this JDK
    is used to start the DB2 GUI tools such as the Control Center.


    If you would like to develop JDBC/SQLJ applications from the DB2 server; in addition
    to the JDK, ensure the JDBC/SQLJ driver is setup correctly by adding the correct
    jar files to the **CLASSPATH**. Similarly, if you would like to develop JDBC/SQLJ
    application from a client machine, ensure you have installed and setup the JDBC/SQLJ
    driver correctly. If you are using the JDBC type 2 driver, you also need to install
    a DB2 client (either the IBM Data Server Client or the IBM Data Server Runtime
    Client). More details are provided in the next section.


    # ### 4.2.1 DB2 JDBC and SQLJ drivers


    *Table 4.1* describes the different types of JDBC drivers available in the industry
    today.


    | Type | Driver name | Description | Provided with DB2? |

    | :--- | :--- | :--- | :--- |

    | Type 1 | The JDBC-ODBC bridge driver | Through this driver, JDBC access is performed
    via an ODBC driver. | No |'
  merge: -1
  img_proc: true
- pgno: 126
  md: '|  |  |  |  |

    |---|---|---|---|

    | Type 2 | The Native-API driver | This driver requires a DB2 client to be installed
    in the same machine were the JDBC application is running. DB2 provides two type
    2 drivers as we will describe later. | Yes |

    | Type 3 | The JDBC net pure-java driver | This driver uses a pure Java client
    and communicates with a net server using a database- independet protcol. The net
    server then communicates the client''s requests to the database. This driver is
    no longer supported in DB2 in favor of Type 4 drivers. | No |

    | Type 4 | The native-protoco1 pure-java driver. | This is the most flexible JDBC
    API. This driver converts JDBC calls into the network protocol used by DB2 directly.
    This allows a direct call from the client machine to the DB2 server without having
    to install a DB2 client. | Yes |


    Table 4.1 - JDBC driver types


    Though there are several types of JDBC drivers, type 2 and type 4 drivers are
    the most popular and best for performance; therefore, in DB2 9.7, support for
    other types has been dropped in favor of these two types. Type 2 drivers need
    to have a DB2 client installed on the machine where the Java application is running.
    The type 2 driver uses the DB2 client to establish communication to the database
    as depicted in Figure 4.2.


    ![](img/5f6ba170efa3a607142589708531bef8_126_0.png)


    Figure 4.2 - A Java application using the JDBC type 2 driver


    Type 4 is a pure Java client, so there is no need for a DB2 client, but the driver
    must be installed on the machine where the JDBC application is running. Figure
    4.3 illustrates a JDBC application using the type 4 driver.'
