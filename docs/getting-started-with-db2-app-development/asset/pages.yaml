  md: "DB2 software also supports XML Schema evolution. This means that if your XML\
    \ Schema changes, you can update the XML Schema easily with the UPDATE XMLSCHEMA\
    \ command. If the changes to the XML Schema are too drastic, you are likely to\
    \ get some errors.\n\nIn DB2 XML decomposition or “shredding” is also supported.\
    \ This is the “old” method to store XML in databases, and is what other vendors\
    \ use to store XML. DB2 still supports this method if you wish to use it; but\
    \ we recommend pureXML. DB2 also supports the XML Extender, also using the old\
    \ method to store XML, but this extender will no longer be enhanced.\n\nWith DB2\
    \ 9.7 all the benefits of pureXML has been extended to database partitions commonly\
    \ used for data warehouses. Database Partitioning Feature (DPF) is offered with\
    \ DB2 Enterprise Edition.\n\n# ## 2.5 Exercises\n\nThroughout this chapter, you\
