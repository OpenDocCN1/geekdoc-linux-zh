    # 9.3.5 Calling a stored procedure


    In order to call a DB2 stored procedure from a Perl application, you need to perform
    the following steps:


    +   1.  Connect to the database by calling the DBI->connect method.

    +   2.  Prepare the CALL stored procedure statement by calling the prepare method
    on the database handle, which returns a statement handle if prepare is successful.'
  merge: -1
  img_proc: true
- pgno: 331
  md: "For example, let's say you want to call the SQL procedure **sp_get_employees**\
    \ shown in *Listing 9.9*.\n\n```\nCREATE PROCEDURE sp_get_employees (IN dept_no\
    \ CHAR(3), OUT dept_name \nVARCHAR(36)) \nDYNAMIC RESULT SETS 1 \nBEGIN\n    DECLARE\
    \ emp_cursor CURSOR WITH RETURN TO CLIENT FOR \n    SELECT firstname, lastname\
    \ FROM employee workdept=dept_no; \n    OPEN emp_cursor; \n    SELECT deptname\
    \ INTO dept_name FROM department WHERE deptno=dept_no; \nEND @\n```\n\n# Listing\
    \ 9.9 – sp_get_employees.db2\n\n**sp_get_employees** has two parameters, the input\
    \ parameter **dept_no** and the output parameter **dept_name**. It also returns\
    \ one result set to the client which is defined in the cursor *emp_cursor*.\n\n\
    You can prepare the CALL statement as follows:\n\n```\n$shandle = $dbhandle->prepare(\
    \ \"CALL sp_get_employees(?,?)\" );\n```\n\nThe two parameters are represented\
    \ as the parameter markers \"?\" in the CALL statement. After a successful prepare,\
    \ the statement handle is returned in the variable *$shandle*.\n\n+   3. Call\
    \ **bind_param** or **bind_param_inout** method on the statement handle to bind\
    \ parameters to local Perl variables or values. **bind_param** can be used for\
    \ binding **IN** parameters only, while **bind_param_inout** is used for binding\
    \ **IN/INOUT/OUT** parameters.\n\nRefer to the previous section for the syntax\
    \ of **bind_param**. The syntax of **bind_param_inout** method is:\n\n```\n$rv\
    \ = $sth->bind_param_inout($p_num, \\$bind_value, $max_len, \\$attr)\n```\n\n\
    *Table 9.4* provides details about the parameters of **bind_param_inout**\n\n\
    | Name | Description |\n| :--- | :--- |\n| **$p_num** | Specifies the 1-indexed\
    \ position of the parameter in the CALL statement. |\n| **$bind_value** | A Perl\
    \ variable or value to be bound to the parameter specified by **$p_num**. If it's\
    \ OUT/INOUT parameter, a variable is used, otherwise it can be a variable or a\
    \ value. |\n| **$max_len** | Specifies the minimum amount of memory to allocate\
    \ to **$bind_value**. |"
