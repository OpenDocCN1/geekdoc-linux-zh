- pgno: 219
  md: 'IBM Data Server Provider for .NET is a high performance, managed type ADO.NET
    data provider, which is provided by IBM and has a much better performance than
    the OLE DB and ODBC .NET data providers.


    OLE DB .NET Data Provider is a bridge provider from Microsoft that passes the
    ADO.NET request to the native IBM OLE DB provider (IBMDADB2).


    ODBC.NET Data Provider is a bridge provider from Microsoft that passes ADO.NET
    requests to the IBM ODBC Driver.


    IBM Data Server Provider for .NET is recommended for any new ADO.NET application
    development. It provides the best performance since it doesn''t require an extra
    layer or bridge as shown in *Figure 6.3*.


    ![](img/5f6ba170efa3a607142589708531bef8_219_0.png)


