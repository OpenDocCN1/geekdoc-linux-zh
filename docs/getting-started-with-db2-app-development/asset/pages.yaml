    # **3.5 User-defined functions: The big picture**


    A user-defined function (UDF) is a database application object that maps a set
    of input data values into a set of output values. For example, a function may
    take a measurement in inches as input, and return the result in centimeters.


    DB2 supports creating functions using SQL PL, PL/SQL, C/C++, Java, CLR (Common
    Language Runtime), and OLE (Object Linking and Embedding). In this book, we focus
    on SQL PL functions because of their simplicity, popularity, and performance.


    > Note:

    > Prior to DB2 9.7, UDFs only supported a subset of SQL PL statements known as
    inline SQL PL. With DB2 9.7, All SQL PL statements are fully supported.




    > Note:

    > For more information about UDFs watch this video:

    > http://www.channeldb2.com/video/video/show?id=807741/Video:4362'
  merge: -1
  img_proc: true
- pgno: 105
  md: "There are four types of functions: scalar, table, row, and column functions.\
    \ In this book, we focus only on scalar and table functions.\n\n# 3.5.1 Scalar\
    \ functions\n\nScalar functions return a single value. Scalar functions cannot\
    \ include SQL statements that will change the database state; that is, INSERT,\
    \ UPDATE, and DELETE statements are not allowed. Some built-in scalar functions\
    \ are SUM(), AVG(), DIGITS(), COALESCE(), and SUBSTR().\n\nDB2 allows you to build\
    \ customized user-defined functions where you can encapsulate frequently used\
    \ logic. Listing 3.9 provides an example of a scalar function.\n\n```\n```sql\n\
    CREATE FUNCTION deptname (p_empid VARCHAR(6))\nRETURNS VARCHAR(30)\nSPECIFIC deptname\n\
    BEGIN ATOMIC\nDECLARE v_department_name VARCHAR(30);\nDECLARE v_err VARCHAR(70);\n\
    SET v_department_name = (\nSELECT d.deptname FROM department d, employee e\nWHERE\
    \ e.workdept=d.deptno AND e.empno= p_empid);\nSET v_err = 'Error: employee ' ||\
    \ p_empid || ' was not found';\nIF v_department_name IS NULL THEN\nSIGNAL SQLSTATE\
    \ '80000' SET MESSAGE_TEXT=v_err;\nEND IF;\nRETURN v_department_name;\nEND\n```\n\
    ```\n\n# Listing 3.9 - An example of a scalar function\n\nIn the above listing,\
    \ the function name is *deptname* and it returns the department number of an employee\
    \ based on the employee id. A scalar UDF can be invoked using the VALUES statement.\
    \ It can also be invoked from a SQL statement wherever a scalar value is expected.\
    \ For example, try the following from the DB2 Command Window or from a Linux or\
    \ UNIX terminal:\n\n```\n```\ndb2 \"values (deptname ('000300'))\" \n```\nor\n\
    ```\ndb2 \"select (deptname ('000300')) from sysibm.sysdummy1\"\n```\n```\n\n\
    Note in the second example that the SYSIBM.SYSDUMMY1 is used. This is a special\
    \ dummy table with one row and one column. It is used to ensure that only one\
    \ value is returned. If you try the same SELECT statement with any other table\
    \ that had more rows, the function would be invoked as many times as the table\
    \ has."
