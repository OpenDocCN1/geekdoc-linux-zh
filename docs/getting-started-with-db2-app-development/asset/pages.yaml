- pgno: 199
  md: '# **5.5.3.4 Processing SQL statements**


    In CLI to issue a SQL statement, your first need to allocate a statement handle.
    A statement handle is associated with a connection handle and tracks the execution
    of a SQL statement. Processing SQL statements requires four steps:


    +   1.  Allocation of the statement handle

    +   2.  Preparing and executing SQL statements

    +   3.  Processing the results

    +   4.  Freeing the allocated statement handle.


    *Figure 5.29* illustrates the steps required for the processing of a SQL statement.


    ![](img/5f6ba170efa3a607142589708531bef8_199_0.png)


    # **Figure 5.29 – Processing of a SQL statement**


    SQL statements are passed as SQLCHAR string variable to DB2 CLI functions. The
    variable contains a SQL statement with or without parameter markers. *Listing
    5.19*provides an example.


    ```

    "/* SQL INSERT statement to be executed */\nSQLCHAR \*stmt = (SQLCHAR \*)\"INSERT
    INTO employee (empno, firstname,\nlastname, edlevel, salary) VALUES (50006, ''SANJAY'',
    ''KUMAR'', 21, 50000),\n(50007, ''RAJIT'', ''PILLAI'', 19, 47860), (50008, ''PRIYANKA'',
    ''JOSHI'', 20,\n45600)\";"

    ```'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Listing 5.19 – Storing a SQL statement in a string variable


    In the above example, the stmt variable is assigned the INSERT statement. You
    can also pass a SQL string argument cast to an SQLCHAR * to the function that
    will use the SQL directly, without the need of a variable. This is shown in Listing
    5.20 where the function SQLExecDirect directly uses the SQL statement.


    ```

    "/* SQL INSERT statement to be executed */

    SQLExecDirect (hstmt, (SQLCHAR *) " INSERT INTO employee(empno, firstname,

    lastname, edlevel, salary) "

    "VALUES (50006, ''SANJAY'', ''KUMAR'', 21, 50000), "

    "(50007, ''RAJIT'', ''PILLAI'', 19, 47860), "

    "(50008, ''PRIYANKA'', ''JOSHI'', 20, 45600)", SQL_NTS);

    ```


    # Listing 5.20 – Directly using a SQL statement in a function


    Table 5.5 provides the list of supported CLI APIs for processing SQL statements.


    | CLI APIs | Use Of API |

    | :---------------- | :--------------------------------------- |

    | SQLPrepare | Prepare a statement |

    | SQLBindParameter | Bind a parameter marker to a buffer |

    | SQLSetParam | Bind a parameter marker to a buffer |

    | SQLDescribeParam | Return description of a parameter marker |

    | SQLExecute | Execute a statement |

    | SQLExecDirect | Execute a statement directly |

    | SQLNumParams | Get number of parameters in a SQL statement |

    | SQLNumResultCols | Get number of result columns |

    | SQLBindCol | Bind a column to an application variable |

    | SQLFetch | Fetch next row |

    | SQLGetDiagField | Get a field of diagnostic data |

    | SQLEndTran | End transactions of a connection or an Environment |



    Table 5.5 – List of supported CLI APIs for processing SQL statements'
