    # 7.2.4 Working with a DB2 database: The ibm_db gem


    Rails support for DB2 is provided directly from IBM itself through an open source
    gem called ibm_db. This gem contains a driver (written in C) that allows Ruby
    to communicate with DB2, and an adapter written in Ruby that enables Active Record
    to work with DB2.


    The ibm_db adapter has a direct dependency on the ibm_db driver, which utilizes
    the IBM Driver for ODBC and CLI to connect to IBM data servers. As mentioned earlier,
    Active Record is the object-relational mapping (ORM) layer supplied with Rails.
    It closely follows the standard ORM model but differs from most other ORM libraries
    in the way it is configured. By using a sensible set of defaults, Active Record
    minimizes the amount of configuration that developers need to perform. Figure
    7.12 illustrates how Active Record communicates with IBM_DB and DB2 Server.'
  merge: -1
  img_proc: true
