    # Chapter 8 – Application development with PHP


    **PHP** (*PHP Hypertext Preprocessor*) is an interpreted, general-purpose, open
    source, scripting programming language primarily intended for the development
    of Web applications. The first version of PHP was created by Rasmus Lerdorf and
    contributed under an open source license in 1995.


    PHP generally runs on a Web server; its code is executed by the PHP runtime to
    create dynamic Web page content. It can also be used for command-line scripting
    and client-side GUI applications. PHP can be deployed on most Web servers, many
    operating systems and platforms, and can be used with many relational database
    management systems. It is available free of charge, and the PHP Group provides
    the complete source code for users to build, customize and extend for their own
    use.


    In this chapter you will learn about:


    +   • Setting up the PHP environment to work with DB2

    +   * Developing PHP applications with DB2


    # 8.1 PHP - DB2 Applications: The big picture


    *Figure 8.1* provides an overview of a PHP-DB2 application. In the figure, a user
    opens a Web browser and points to a page that invokes a PHP script. The request
    is received by the Web server where PHP code also resides, and the PHP code is
    executed. If the request needs to access data from DB2, PHP will connect to the
    DB2 database and retrieve, update or delete the necessary data. After that, if
    output needs to be returned, it is sent as HTML to the Web browser.'
