    # 8.3.3.1 Program flow


    PDO programming uses object-oriented concepts. When a connection is made to a
    DB2 database, an instance of the PDO base class is created. This instance acts
    as a database handle, which is later used when further activities are carried
    on against the database. Different objects are created when operating with a database,
    and can be classified as:


    +   - Connection object (instance of PDO)

    +   - Statement object (instance of PDOStatement)

    +   - Exception (instance of PDOException)


    The typical program flow of a PDO program during transaction processing is:


    +   1. Connect to the database.

    +   2. Prepare and execute the statement.

    +   3. Process the results.

    +   4. Free the resources.


    # 8.3.3.2 Connecting to a database


    A connection to a database is obtained when the constructor of the PDO class is
    invoked using new PDO(). There are four sets of parameters for the constructor:


    +   - Data Source Name (DSN)

    +   - User name

    +   - Password

    +   - Driver options


    DSN contains the information required to connect to a database, which includes
    the type of driver used (CLI/ODBC in the case of DB2), the name of the data source,
    and the connection credentials (the user name and password). The DSN parameters
    required depend on whether you are connecting to a cataloged database, or a non-cataloged
    one. If'
