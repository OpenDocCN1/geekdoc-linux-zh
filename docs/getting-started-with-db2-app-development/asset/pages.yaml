  md: "# 5.3.3 Steps to develop an embedded SQL C/C++ application\n\nDeveloping a\
    \ C/C++ application with embedded SQL involves the following steps:\n\n+   1.\
    \ Include required header files\n+   2. Declare host variables\n+   3. Connect\
    \ to a database\n+   4. Execute SQL statements\n+   5. Handle SQL errors\n+  \
    \ 6. Commit the transactions\n+   7. Disconnect from the database\n\nWe will explore\
    \ each step one by one. *Listing 5.1* illustrates a basic template you can use\
    \ with the structure required for an embedded SQL application written in C.\n\n\
    ```\n(1) /* Include required header files\n(2) /* Declaration of host variables\
    \ */\n    EXEC SQL BEGIN DECLARE SECTION;\n    ......\n    EXEC SQL END DECLARE\
    \ SECTION;\n\n    /* Declaration of SQLCA structure */\n    EXEC SQL DECLARE SQLCA;\n\
    \n    /* Declaration of main function */\n    void main()\n    {\n        /* Connect\
