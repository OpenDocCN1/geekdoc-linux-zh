    # ### 3.3.7 Assignment statements


    To assign a value to a variable, use the SET statement. For example:


    ```

    SET total = 100;

    ```


    The above statement is equivalent to


    ```

    VALUES(100) INTO total;

    ```


    Additionally, any variable can be set to NULL. For example:


    ```

    SET total = NULL;

    ```


    You can assign a value to a variable based on the output of a SELECT statement.
    For example:


    ```

    SET total = (select sum(c1) from T1);

    SET first_val = (select c1 from T1 fetch first 1 row only)

    ```


    An error condition is raised if more than one value is fetched from a table and
    you are trying to assign it to a single variable. If you need to store more information
    than a single value, use arrays, or cursors.


    You can also set variables according to external database properties or special
    DB2 register variables. For example:


    ```

    SET sch = CURRENT SCHEMA;

    ```'
