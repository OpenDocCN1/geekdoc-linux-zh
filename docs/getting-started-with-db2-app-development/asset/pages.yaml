    # 5.6 Working with XML in C/C++ applications with DB2


    As discussed in *Chapter 2, DB2 pureXML*, DB2 provides the XML data type to store
    XML data natively. To exchange XML data between the database server and an embedded
    SQL C/C++ application, you need to declare host variables in your application
    source code. Columns with the XML data type are described as an SQL_TYP_XML column
    SQLTYPE. XML columns can be accessed directly using SQL, XQuery or SQL/XML.


