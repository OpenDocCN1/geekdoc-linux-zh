- pgno: 22
  md: '# # Chapter 1 — Introduction to DB2 application development


    IBM® DB2® is powerful data server software for managing both relational and XML
    data. It offers flexibility not only to database administrators, but also to database
    developers. No matter which language you use to develop your programs, DB2 software
    ("DB2") provides the drivers, adapters, and extensions you need to work with databases
    as part of your application. Moreover with DB2 Express-C, you can develop your
    applications at no cost, with no database size limits, and with the same level
    of programming language support as the other versions of DB2. Develop once using
    DB2 Express-C, and you can run on any DB2 edition without any modification required
    to your application.


    In this chapter you will learn about:


    +   * Server-side programming using stored procedures, and user-defined functions

    +   * Client-side programming using different programming languages


    # ## 1.1 DB2 application development: The big picture


    DB2 offers database developers the flexibility to take advantage of server-side
    development features such as stored procedures and user-defined functions, while,
    application developers can develop client applications using the programming language
    of their choice. This flexibility is illustrated in Figure 1.1.'
  merge: -1
  img_proc: true
