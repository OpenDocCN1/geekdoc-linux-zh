    \ After triggers\n\nAfter triggers are activated after the triggering SQL statement\
    \ has executed to successful completion. The operations performed by this trigger\
    \ may activate other triggers (cascading is permitted up to 16 levels). After\
    \ triggers support INSERT, UPDATE and DELETE operations. Listing 3.13 is an example\
    \ of an after trigger.\n\n```\nCREATE TRIGGER audit_emp_sal\n   AFTER UPDATE OF\
    \ salary ON employee\n   REFERENCING OLD AS o NEW AS n\n   FOR EACH ROW\n   MODE\
    \ DB2SQL\n   INSERT INTO audit VALUES (\n      CURRENT TIMESTAMP, ' Employee '\
    \ || o.empno || ' salary changed from '\n   || CHAR(o.salary) || ' to ' || CHAR(n.salary)\
    \ || ' by ' || USER)\n```\n\n# Listing 3.13 - An example of an after trigger\n\
    \nIn the above listing, the trigger audit_emp_sal is used to perform auditing\
    \ on the column SALARY of the EMPLOYEE table. When someone makes a change to this\
    \ column, the trigger will be activated to write the information about the changed\
    \ made to the salary into another table called AUDIT. The OLD as o NEW as n line\
    \ indicates that the prefix o will be used to represent the old or existing value\
    \ in the table, and the prefix n will be used to represent the new value coming\
    \ from the UPDATE statement. Thus, o.salary represents the old or existing value\
    \ of the salary, and n.salary represents the updated value for the column salary\
    \ data.\n\n# 3.6.1.3 “Instead of” triggers\n\nInstead of triggers are defined\
    \ on views. Since views are defined dynamically using a SELECT statement that\
    \ accesses one or more tables, views cannot be updated. However, using this type\
    \ of trigger, you can give users the illusion that a view can be updated because\
