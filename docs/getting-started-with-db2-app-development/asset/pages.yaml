- pgno: 94
  md: '+   - **LANGUAGE SQL**

    +   This attribute indicates the language the stored procedure will use. LANGUAGE
    SQL is the default value. For other languages, such as Java or C use LANGUAGE
    JAVA or LANGUAGE C, respectively.


    +   - **RESULT SETS <n>**

    +   This is required if your stored procedure will be returning n result sets.


    +   - **SPECIFIC my_unique_name**

    +   This is a unique name that can be given to a procedure. A stored procedure
    can be overloaded, that is, several stored procedures can have the same name,
    but with different number of parameters. By using the **SPECIFIC** keyword you
    can provide one unique name for each of these stored procedures, and this can
    ease stored procedure management. For example, to drop a stored procedure using
    the **SPECIFIC** keyword, you can issue this statement: **DROP SPECIFIC PROCEDURE**.
    If the **SPECIFIC** keyword had not been used you would have had to use a **DROP
    PROCEDURE** statement and put the name of the procedure with all the parameters
    so DB2 would know which of the overloaded procedures you wanted to drop.


    # ### 3.3.3 Parameters


    There are three types of parameters in an SQL PL stored procedure:


    +   - **IN** - Input parameter


    +   - **OUT** - Output parameter


    +   - **INOUT** - Input and Output parameter


    For example:


    ```

    CREATE PROCEDURE proc(IN p1 INT, OUT p2 INT, INOUT p3 INT)

    ```


    To call the procedure use the **CALL** statement. For example, to call the above
    stored procedure you could specify:


    ```

    CALL proc (10,?,4)

    ```


    The question mark (?) is used for **OUT** parameters in the **CALL** statement.
    **Listing 3.1** provides another example of a stored procedure with parameters
    that you can try.


    ```

    CREATE PROCEDURE P2 (

    IN v_p1 INT,

    INOUT v_p2 INT,

    OUT v_p3 INT)


    LANGUAGE SQL

    SPECIFIC myP2

    BEGIN

    -- my second SQL procedure

    SET v_p2 = v_p2 + v_p1;

    SET v_p3 = v_p1;

    END

    ```'
