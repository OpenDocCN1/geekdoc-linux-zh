    \ Chapter 8\n\n+   1. As the name suggests, the non persistent connection disconnects\
    \ and frees up the connection resources after each db2_close, or connection resource\
    \ is set to NULL, or the script ends.\n+   \n+   In the case of persistent connections,\
    \ the connection resources are not freed up after a db2_close or the script is\
    \ exited. Whenever a new connection is requested, PHP tries to reuse the connection\
    \ with the same credentials\n\n2. Connection pooling helps database application\
    \ performance due to the reduction of new connections by reusing the old connections\
    \ established before. It can be beneficial when the connections made have a short\
    \ duration.\n\n3. Enable PHP support in Apache HTTP Server 2.x by adding the following\
    \ lines to the `httpd.conf` file, where `phplibdir` refers to the PHP install\
    \ directory:\n\n```\n```\n    LoadModule php5_module 'phplibdir/php5apache2.dll'\n\
    \    AddType application/x-httpd-php .php\n    PHPIniDir 'phplibdir'\n```\n```\n\
