    # ## 7.3 Developing RoR applications


    This section describes how to build simple Web applications using Rails **scaffolding**.
    Using the **scaffold** utility, you can quickly generate some of the major pieces
    of an application. The scaffold utility will easily create the models, views,
    and controllers for a new resource in a single operation.


    The next sections describe the steps to create a simple Web application using
    scaffolding. The application will access a DB2 database; therefore, you first
    need to create a DB2 database, and configure the database.yml file.


    # ### 7.3.1 Developing a sample application: A book catalog


    The book catalog application, which for simplicity is named **bookapp**, allows
    users to obtain information about books. There will be two types of users: Regular
    users, and authors. The requirements of the **bookapp** application are simple:


    +   1. Regular users can browse information about books.

    +   2. Authors are regular users who can add new books to the catalog and update
    book information.

    +   3. There will be one page to display books, and one page to manage books.

    +   4. XML will be used to store book''s information.


    This application only needs one table, the *books* table. Its columns are described
    below, in Table 7.3.


    | Column Name | Data Type | Description |

    | --- | --- | --- |

    | TITLE | Varchar | Book''s name |

    | DESCRIPTION | XML | Book''s information, including authors and a short description.
    |

    | STATUS | Varchar | Indicates whether a book is available, completed, not ready,
    etc. |


    Table 7.3 – books table columns and description


    The table will be created automatically in DB2 through RoR using the **scaffold**
    and **rake** commands as we will describe soon. RoR will also add extra columns,
    one of them being the ID column which would be used as the primary key.'
  merge: -1
  img_proc: true
