- pgno: 320
  md: '# ## Chapter 9 – Application development with Perl


    *Perl* (*Practical Extraction and Reporting Language*) is a platform independent,
    interpreted scripting language free and available with many operating systems,
    such as Windows, Linux, UNIX and Mac OS X. As an open source language, the Perl
    interpreter can be freely downloaded in source code or binary form.


    Because of its powerful text processing features, for example its strong support
    of regular expressions, Perl has been widely used not only for report generating
    applications, but also for standalone or Web-based database applications. You
    can easily generate dynamic SQL queries, and fetch and process the returned data
    using Perl scripts.


    In this chapter you will learn about:


    +   - Setting up the Perl environment to work with DB2

    +   - Connecting to a DB2 database from a Perl application

    +   - Developing Perl applications to access DB2 data


    > **Note:**

    > If you are new to the Perl programming language, review the free ebook *Getting
    Started with Perl* which is part of this book series.


    # ### 9.1 Perl - DB2 applications: The big picture


    A Perl application uses the *Perl Database Interface* (*DBI*) to access most of
    relational databases, including DB2. The Perl DBI is an open standard application
    programming interface (API) that enables a Perl application to access different
    databases using the same syntax without knowing details of each specific database.
    These details are handled by the underlying *DataBase Drivers* (*DBD*), which
    are provided by the database vendors supporting the Perl DBI.


    *Figure 9.1* illustrates how a Perl script accesses different databases via the
    DBI module and the DBD drivers.


    ![](img/5f6ba170efa3a607142589708531bef8_320_0.png)'
  merge: -1
  img_proc: true
- pgno: 321
  md: '![](img/5f6ba170efa3a607142589708531bef8_321_0.png)


    **Figure 9.1 - A Perl script uses DBI and DBD drivers to access databases**


    As shown in *Figure 9.1*, the DBI module provides a database independent interface
    standing between a Perl application and one or more database driver modules. An
    application only needs to know about the interface, while the underlying DBD drivers
    provided by databases will do the actual work. For a Perl - DB2 application, the
    driver is the *DBD::DB2* driver, which provides the details for accessing a DB2
    database.


    Since the Perl DBI Module defines the standard database access interface, you
    can easily port an application written in DBI for accessing one DBMS, such as
    Oracle, to accessing another DBMS, such as IBM DB2. Moreover, the Perl DBI Module
    uses an interface that is quite similar to the ODBC and JDBC interfaces, which
    makes it easy to port Perl applications written in DBI to ODBC and JDBC interface,
    or vice versa.


    > Note:

    > For more information about Perl DBI, refer to http://dbi.perl.org/

    > For the latest DBD::DB2 driver and related information, visit http://www.ibm.com/software/data/db2/perl/
    and http://search.cpan.org/~ibmtordb2/


    # ### 9.2 Setting up the environment


    In order to access a DB2 database from a Perl application, you need to set up
    a Perl environment to work with DB2. The following 3 steps are required:


    +   1.  Install the Perl language environment'
