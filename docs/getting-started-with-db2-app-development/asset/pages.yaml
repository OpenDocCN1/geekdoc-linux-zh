  md: "*Table 2.6* describes some of the SQL/XML functions available with the SQL\
    \ 2006 standard\n\n| Function name | Description |\n| --- | --- |\n| XMLPARSE\
    \ | Parses character or large object binary data, produces XML value |\n| XMLSERIALIZE\
    \ | Converts an XML value into character or large object binary data |\n| XMLVALIDATE\
    \ | Validates XML value against an XML schema and type-annotates the XML value\
    \ |\n| XMLEXISTS | Determines if an XQuery returns a results (i.e. a sequence\
    \ of one or more items) |\n| XMLQUERY | Executes an XQuery and returns the result\
    \ sequence |\n| XMLTABLE | Executes an XQuery, returns the result sequence as\
    \ a relational table (if possible) |\n| XMLCAST | Cast to or from an XML type\
    \ |\n\n# Table 2.6 – SQL/XML Functions\n\nThe following examples can be tested\
    \ using the **mydb** database created earlier.\n\n# **Example 1**\n\nImagine that\
    \ you need to locate the names of all clients who live in a specific zip code.\
    \ The **clients** table stores customer addresses, including zip codes, in an\
    \ XML column. Using XMLEXISTS, you can search the XML column for the target zip\
    \ code and then restrict the return result set accordingly. *Listing 2.7* below\
    \ illustrates the query required.\n\n```\nSELECT name FROM clients\nWHERE xmlexists(\n\
    \        '$c/Client/Address[zip=\"95116\"]'\n        passing clients.contact as\
    \ \"c\")\n\n```\n\n# **Listing 2.7 - An example using XMLEXISTS**\n\nIn *Listing\
    \ 2.7*, the first line is an SQL clause specifying that you want to retrieve information\
    \ in the **name** column of the **clients** table.\n\nThe WHERE clause invokes\
    \ the XMLEXISTS function, specifying the XPath expression that prompts DB2 to\
    \ navigate to the **zip** element and check for a value of 95116\n\nThe $c/Client/Address\
    \ clause indicates the path inside the XML document hierarchy where DB2 can locate\
    \ the **zip** element. A dollar sign ($) is used to specify a variable;"
