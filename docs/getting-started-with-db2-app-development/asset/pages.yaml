    +   - NOT FOUND


    # 3.3.10.1 Condition handling


    To handle a condition, you can create a condition handler which must specify:


    +   - Which conditions it handles

    +   - Where to resume execution (based on the type of the handler: CONTINUE, EXIT
    or UNDO)

    +   - Which actions to perform to handle the condition. These actions can be any
    statement, including control structures.


    If an `SQLEXCEPTION` condition is raised, and there is no handler, the procedure
    terminates and returns to the client with an error.


    # 3.3.10.2 Types of handlers


    There are three types of handlers:


    +   - **CONTINUE** – This handler is used to indicate that after an exception
    is raised, and the handler handles the condition, the flow will CONTINUE to the
    next statement after the statement that raised the condition.

    +   - **EXIT** – This handler is used to indicate that, after an exception is
    raised, and the handler handles the condition, the flow will go to the end of
    the procedure.

    +   - **UNDO** – This handler is used to indicate that after an exception is raised,
    and the handler handles the condition, the flow will go to the end of the procedure,
    and will undo or roll back any statements performed.


    *Figure 3.10 illustrates the different condition handlers and their behavior.*


    ![](img/5f6ba170efa3a607142589708531bef8_99_0.png)'
