    # 4.4.3 Execution contexts\n\nAn execution context monitors and controls a SQL\
    \ statement while executing; it is equivalent to the Statement interface in JDBC\
    \ and is created within a connection context object.\n\nTo create an ExecutionContext\
    \ object use the getExecutionContext method of the connection context. Some ExecutionContext\
    \ methods work before an SQL statement is executed while others apply only after\
    \ execution.\n\nListing 4.21 provides an example.\n\n```\n#sql context ctx; //\
    \ this should be outside the class\nString url = \"jdbc:db2:sample\";\nClass.forName(\"\
    com.ibm.db2.jcc.DB2Driver\").newInstance();\nConnection con=DriverManager.getConnection(url);\n\
    ctx ctx1=new ctx(con);\n(1) ExecutionContext execTx1 = ctx1.getExecutionContext();\n\
    (2) #sql[ctx1,execTx1] = { DELETE FROM purchaseorder WHERE\n                 \
    \          status='UnShipped' }\n(3) int i = execTx1.getUpdateCount();\n```\n\n\
    # Listing 4.21 - An example using an execution context\n\nIn the above listing:\n\
    \n+   1.  (1) An execution context is created with the getExecutionContext method\
    \ of the connection context object.\n+   2.  (2) Specifying the SQL to run associated\
    \ to connection context ctx1, and execution context execTx1.\n+   3.  (3) Invoking\
    \ the getUpdateCount method of the execution context object to obtain the number\
    \ of records deleted or updated."
