- pgno: 296
  md: "+   1.  `db2_fetch_array`\n+   2.  `db2_fetch_assoc`\n+   3.  `db2_fetch_both`\n\
    +   4.  `db2_fetch_object`\n+   5.  `db2_fetch_row`\n\nSome of these functions\
    \ are discussed in more detail in the next section.\n\n# 8.3.2.4 Processing the\
    \ results\n\nWhen an SQL statement returns a result set, there are different ways\
    \ to retrieve the rows. You can fetch the result set row by row into a data structure\
    \ or use scrollable cursors to scroll through the result set and then fetch the\
    \ required rows.\n\n# 8.3.2.4.1 Using db2_fetch_array\n\nThis function is used\
    \ to fetch the rows of the result set data into an array indexed by the column\
    \ number. It takes the statement resource as input and returns false when there\
    \ are zero rows returned. *Listing 8.7* provides an example.\n\n```\n```php\n\
    while ($row = db2_fetch_array($stmt)) {\n    printf(\"%d %s %s\", $row[0], $row[1],\
    \ $row[2]);\n}\n```\n```\n\n**Listing 8.7 – Using db2_fetch_array function**\n\
    \n# 8.3.2.4.2 Using db2_fetch_assoc\n\nThis function is used to fetch the result\
    \ set data into an array indexed by the column name. It returns a false if there\
    \ are zero rows returned. *Listing 8.8* provides an example.\n\n```\n```php\n\
