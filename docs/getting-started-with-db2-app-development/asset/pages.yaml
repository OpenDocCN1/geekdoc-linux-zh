  md: '# 9.3.4 Executing a SQL statement with parameter markers


    In this section, you will learn how to issue an SQL statement that includes parameter
    markers or variable inputs. A parameter marker in an SQL statement, is represented
    by the question mark (?) character or a colon followed by a name (:*name*).


    To run a SQL statement with parameter markers, you can follow these steps:


    +   1. Connect to the database by calling the **DBI->connect** method


    +   2. Prepare the statement by calling the **prepare** method on the database
    handle, which returns a statement handle if prepare is successful. For example,
    you can prepare a **SELECT** statement containing a parameter marker as follows:


    ```

    $sth = $dbh->prepare( ''SELECT empno, lastname, job, salary

    FROM employee WHERE workdept = ?'' );

    ```


    The **SELECT** statement above contains a parameter marker "?" in the predicate
    "*workdept = ?*", where the parameter marker "?" represents a variable input for
    a department number that is not known until the SQL is run. If the SQL statement
    is successfully prepared, the **prepare** method returns a statement handle and
    assigns it to the variable **$sth**.


    +   3. Call **bind_param** method on the statement handle to bind parameters to
    local Perl variables.


    The syntax of **bind_param** method is:


    ```

    $sth->bind_param( $p_num, $bind_value, \$attr )

    ```


    *Table 9.3* provides a description of the parameters of bind_param.


    | Name | Description |

    | :--- | :--- |

    | `$p_num` | Specifies the 1-indexed position of the parameter in the SQL containing
    the parameter markers. |

    | `$bind_value` | A Perl variable or value to be bound to the parameter specified
    by parameter-number |

    | `\$attr` | Optional: it can be used to indicate the parameter''s type, precision,
    scale. |


    *Table 9.3 - Parameters for the bind_param method of the statement handle*


    For example, you can call **bind_param** to bind the value "A00" to the parameter
    in the prepared **SELECT** statement shown earlier as follows:


    ```

    $sth->bind_param(1, "A00");

    ```


    After a successful execution, the value "A00" will be bound to the parameter marker
    (?) in the SQL''s predicate "*workdept = ?*".'
  merge: -1
  img_proc: true
