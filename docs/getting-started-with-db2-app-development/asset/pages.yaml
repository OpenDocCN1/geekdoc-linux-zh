  md: '# **6.2.2 DataSet for ADO.NET**


    The **DataSet** object represents an in-memory cache of data, which was retrieved
    from the database. The **DataSet** object is a disconnected dataset, which provides
    a consistent relational model independent of the data source. Since it is disconnected
    from the database, it reduces the communication overhead to the database server.
    The **DataSet** object has the public property **DataSetName**, which gets or
    sets **DataSet** name, for example:


    ```

    DataSet ds = new DataSet();

    ds.DataSetName = "DB2";

    ```


    The DataSet object has the following public methods:


    +   - **AcceptChanges**: This commits changes to the **DataSet**, for example:


    ```

    ds.AcceptChanges();

    ```


    +   - **Clear**: This clears the **DataSet** contents, for example:


    ```

    ds.Clear();

    ```


    +   - **GetXML**: This gets the XML representation of data in the **DataSet**,
    for example:


    ```

    Console.WriteLine(ds.GetXml())

    ```


    +   - **ReadXML**: This reads the XML schema and XML into **DataSet**, for example:


    ```

    ds.ReadXML(reader);

    ```


    +   - **WriteXML**: This writes XML schema and XML into **DataSet**, for example:


    ```

    ds.WriteXML( " \\\\test.xml" );

    ```


