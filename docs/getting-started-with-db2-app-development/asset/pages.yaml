  md: "# 7.2.1.1 **RubyGems: Locating, installing and upgrading Ruby packages**\n\n\
    RubyGems is the standard packaging and installation framework for Ruby libraries\
    \ and applications. RubyGems makes it easy to locate, install, upgrade, and uninstall\
    \ Ruby packages.\n\nA gem, in the RubyGems world, is a packaged Ruby application\
    \ or library. These files follow a standard format and are stored in a central\
    \ repository on the Internet. Gems have a name and a version; for example *rake\
    \ 0.4.16*.\n\nA command line tool also called gem can be used to manipulate these\
    \ gem files. If you want a gem, you can simply ask RubyGems to install it (and\
    \ all its dependencies) online. Everything is done for you. *Figure 7.6* shows\
    \ you how to install the “rake” gem through the internet.\n\n![](img/5f6ba170efa3a607142589708531bef8_254_0.png)\n\
    \n**Figure 7.6 – Installing the *rake* gem**\n\nAs shown in the figure, from the\
    \ machine where you installed Ruby, you can issue the command *gem install rake*.\
    \ This will connect to *http://rubygems.org/*, and locate the *rake* libraries\
    \ and the *rake* command-line program. We discuss the *rake* command later; for\
    \ now, it’s good to know that *rake* is a tool you can use to build other gems.\
    \ Once the libraries and command-line program are downloaded, they are automatically\
    \ installed.\n\n# 7.2.2 **Installing Rails**\n\nWith RubyGems you can install\
    \ *Rails* and its dependencies easily just as other gems. Install Rails by following\
