- pgno: 285
  md: "![](img/5f6ba170efa3a607142589708531bef8_285_0.png)\n\nFigure 8.1 - *Interaction\
    \ between PHP, a Web server and DB2*\n\nPHP primarily acts as a filter, taking\
    \ input from a file or stream containing text and/or PHP instructions and outputs\
    \ another stream of data; most commonly the output will be HTML. PHP scripts are\
    \ often compiled at runtime by the PHP engine, which increases their execution\
    \ speed. PHP scripts can also be compiled before runtime using PHP compilers.\n\
    \n# 8.2 Setting up the environment\n\nTo start working with PHP you need to install\
    \ a Web server, PHP, and a DB2 database server. If your Web server and database\
    \ server are on different machines, you also need to install a DB2 client on the\
    \ Web server.\n\nIn this section we explain how to configure your environment\
    \ manually by downloading and installing each component separately.\n\n# 8.2.1\
    \ Setting up the PHP environment manually\n\nIf you would like to set up your\
