- pgno: 184
  md: '# 5.3.5 Building embedded SQL C/C++ applications


    You can build an embedded SQL C/C++ application either manually from the command
    line or by using DB2 provided scripts. This section discusses both ways.


    # 5.3.5.1 Building embedded SQL C/C++ applications from the command line


    Building embedded SQL C/C++ applications from the command line involves the following
    steps:


    +   1. Precompile the application by issuing the PRECOMPILE command

    +   2. If you created a bind file (by using the BINDFILE option in the PRECOMPILE
    command in step 1), bind this file to a database to create an application package
    by issuing the BIND command.

    +   3. Compile the modified application source and the source files that do not
    contain embedded SQL to create an application object file (a .obj file).

    +   4. Link the application object files with the DB2 and host language libraries
    to create an executable program using the link command.


    These steps are illustrated in Figure 5.14 below taken from the *developerWorks*
    Article *DB2 packages: Concepts, examples, and common problems*. \[4\]'
  merge: -1
  img_proc: true
- pgno: 185
  md: '![](img/5f6ba170efa3a607142589708531bef8_185_0.png)


    Figure 5.14 – Building an embedded C/C++ SQL program


    Let''s take a look at each of the steps illustrated in Figure 5.14 in more detail:


    # 5.3.5.1.1 Step 1 : Precompile the source file


    Once you have created the embedded SQL application''s source files, you must precompile
    each host language file containing SQL statements with the PREP command. The precompiler
    comments out all SQL statements contained in the source file, generates the DB2
    run-time API calls for those statements and creates a BIND file when the BINDFILE
    option is used as shown below:


    ```

    db2 prep embeddedC.sqc bindfile

    ```


    Figure 5.15 shows the output of above command'
  merge: -1
  img_proc: true
- pgno: 186
  md: '![](img/5f6ba170efa3a607142589708531bef8_186_0.png)


    Figure 5.15 - Precompiling a C source file using the PREP command


    # 5.3.5.1.2 Step 2: Binding the bind file


    Binding is the process of creating a package on the database server out of a bind
    (.bnd) file that was created by the PREP command. The bind file contains the information
    required by DB2 such as the collection id, package name, timestamp, host variables,
    SQL statements, and so on, to create the package on the server. For example:


    ```

    db2 bind embeddeC.bnd

    ```


    Figure 5.16 provides the output of the above command.


    ![](img/5f6ba170efa3a607142589708531bef8_186_1.png)


    Figure 5.16 - Binding a package using the BIND command


    DB2 also provides a tool called db2bfd that can dump the contents of a bind file.
    This tool can be helpful if you want to get information about the package that
    it would create, without actually creating the package first.


    db2bfd -b will dump header information, containing the package name, consistency
    token, etc. This is shown in Figure 5.17.'
