    using the IBM Database Add-Ins for Visual Studio in section 6.3.1.


    # 6.3.1 IBM Database Add-Ins for Visual Studio


    The IBM Database Add-Ins for Visual Studio are a collection of features that integrate
    seamlessly into your Visual Studio development environment so that you can work
    with DB2 servers and develop DB2 procedures, functions, and objects.


    IBM Database Add-Ins for Visual Studio are designed to present a simple interface
    to DB2 databases. For example, instead of using SQL, the creation of database
    objects can be done using designers and wizards. And for situations where you
    do need to write SQL code, the integrated DB2 SQL editor has the following features:


    +   - Colored SQL text for increased readability

    +   - Integration with the Microsoft® Visual Studio IntelliSense feature, which
    provides for intelligent auto-completion while you are typing DB2 scripts


    With IBM Database Add-Ins for Visual Studio, you can:


    +   - Open various DB2 development and administration tools

    +   - Create and manage DB2 projects in the Solution Explorer

    +   - Access and manage DB2 data connections (in Visual Studio 2005 or later you
    can do this from the Server Explorer)'
