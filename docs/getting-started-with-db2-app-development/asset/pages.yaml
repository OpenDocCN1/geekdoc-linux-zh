  md: "# 4.4.4 Iterators\n\n*Iterators* are equivalent to a JDBC result set. There\
    \ are two types of iterators:\n\n+   *   **Named iterators**: Identify a row by\
    \ the name of the column in the result set. While defining the named iterator,\
    \ specify the name of the columns and their data types\n+   *   **Position iterators**:\
    \ Identify a row by its position in the result set. While defining the position\
    \ iterator, specify only the data types of the columns.\n\n*Listing 4.22* provides\
    \ an example of a named iterator.\n\n```\n(1)  #sql iterator namediterator (int\
    \ *poid*, String *status*)\n(2)  namediterator *iterator1*;\n(3)  #sql [*ctx1*]\
    \ *iterator1* = { select *poid*, *status* from *purchaseorder* };\n(4)  while\
    \ (*iterator1*.next()) {\n(5)      System.out.println(\"poid: \" + *iterator1*.poid()\
    \ + \"Status: \"+\n        *iterator1*.status());\n       }\n(6)  *iterator1*.close();\n\
    ```\n\n**Listing 4.22 - An example of a named iterator**\n\nIn the above listing:\n\
    \n+   (1) A named iterator is declared with two columns. Note that the column\
    \ names *poid* and *status* are explicitly mentioned. This is why this is a named\
    \ iterator.\n+   (2) A named iterator *iterator1* is declared\n+   (3) In connection\
    \ context *ctx1*, the *iterator1* is defined with a \"select *poid*, *status*\
    \ from *purchaseorder*\"\n+   (4) Looping through the iterator\n+   (5) Printing\
    \ the *poid* and *status* of each row retrieved. Note the syntax: \"*iterator1*.poid()\"\
    , and \"*iterator1*.status()\".\n+   (6) Closing *iterator1*.\n\n*Listing 4.23*\
    \ provides an example of a position iterator.\n\n```\n(1)  #sql iterator *positionedIterator*\
    \ (int, String);\n(2)  String *status* = null;\n(3)  int *poid* = 0;\n(4)  *positionedIterator*\
    \ *iterator1*;\n(5)  #sql [*ctx1*] *iterator1* = ( select *poid*, *status* from\
    \ *purchaseorder* );\n(6)  #sql { fetch : *iterator1* into : *poid*, : *status*\
    \ };\n(7)  while (*iterator1*.endFetch()) {\n(8)      System.out.println(\"poid:\
    \ \" + *poid* + \"Status: \" + *status*);\n```"
