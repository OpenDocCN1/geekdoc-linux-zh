    # **Figure 5.28 – Connection handle allocation and connect to the database**


    There are other APIs available that can be used to connect to a database. The
    SQLDriverConnect() API extends the functionality of SQLConnect() by adding extra
    connection parameters and the ability to get connection information from the user.
    Table 5.4 lists the available connection related APIs.


    | CLI Connection API | Use of API |

    | :--- | :--- |

    | SQLConnect | Establishes the connection to the target database |

    | SQLBrowseConnect | Get required attributes to connect to data source |

    | SQLSetConnectAttr | Set the connection attributes |

    | SQLGetConnectAttr | Get the current attribute setting |

    | SQLDisconnect | Disconnect from the data source |



    # **Table 5.4 – Connection related CLI APIs**


    Performing the above steps every time on a large application would be very time
    consuming. To make things easier, you can use utility functions provided by DB2
    in the samples directory. You need to include utilcli.h header file in the header
    section of your application. Let''s take a look an example where you can use the
    utility function CLIAppInit() to allocate the environment handle, connection handle,
    set AUTOCOMMIT, and connect to the database. Listing 5.18 illustrates this.


    ```

    /* initialize the CLI application by calling a helper utility function defined
    in utilcli.c */

    rc = CLIAppInit(dbAlias, user, pswd, &henv, &hdbc, (SQLPOINTER)SQL_AUTOCOMMIT_ON);

    if (rc != 0)

    {

    return rc;

    }

    ```


    # **Listing 5.18 – Initialize CLI application using utility function**


    The above code will perform the initialization of a CLI application taking as
    arguments the database name (alias), userid, password, environment handle variable
    and connection handle variable as parameters.'
