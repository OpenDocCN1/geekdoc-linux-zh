  md: '| Name | Description |

    |---|---|

    | **connection** | A valid database connection object as returned from `ibm_db.connect()`
    |

    | **Statement** | An SQL statement in string format. The statement cannot contain
    any parameter markers, i.e the statement should be known at the time it is written.
    |

    | **options** | Optional: A dictionary containing statement options. You can use
    this parameter to request a scrollable cursor for database servers that support
    this type of cursor. By default, a forward-only cursor is returned. |


    # Table 10.2 - Parameters for function ibm_db.exec_immediate


    For example, you can call ibm_db.exec_immediate function to run a SELECT statement
    passed in as a string argument as shown below:


    ```

    stmt = ibm_db.exec_immediate(conn, ''SELECT firstname, lastname FROM

    employee fetch first 2 rows only'')

    ```


    Where the function takes the connection object conn returned in step 1 as the
    first function argument, and returns a statement object stmt which is associated
    with the query''s result set if the execution is successful.


    3. Fetch rows from the result set by calling ibm_db.fetch_tuple(), which returns
    a tuple representing the next or requested row in the result set. Each column
    value is indexed by the 0-indexed column position in the tuple.


    The syntax of function ibm_db.fetch_tuple is shown as follows:


    ```

    array ibm_db.fetch_tuple(IBM_DBStatement stmt, [, int row_number])

    ```


    Table 10.3 explains the different parameters of ibm_db.fetch_tuple


    | Name | Description |

    |---|---|

    | **Stmt** | A valid statement object containing a result set. |

    | **row_number** | Optional: 1-indexed row number for a specific row that you
    want to fetch from the result set. Passing this parameter results in a warning
    if the result set uses a forward-only cursor |


    # Table 10.3 - Parameters for function ibm_db.fetch_tuple


    The function returns False if there are no more rows left in the result set, or
    if the row requested by row_number does not exist in the result set.


    For example, you can fetch and print all the rows from the result set as shown
    in Listing 10.6.


    ```

    (1) mytuple = ibm_db.fetch_tuple(stmt)

    (2) while mytuple != False:

