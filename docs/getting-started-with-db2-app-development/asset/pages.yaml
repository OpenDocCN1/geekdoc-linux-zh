  md: '# # 2


    # ## Chapter 2 – DB2 pureXML


    In this chapter we discuss pureXML, the new technology introduced in DB2 9 to
    support XML native storage. Many of the examples and concepts discussed in this
    chapter have been taken from the IBM Redbook®: DB2 9: pureXML overview and fast
    start. See the Resources section for more information on this title. Figure 2.1
    outlines which section of the DB2 “Big Picture” we discuss in this chapter.


    ![](img/5f6ba170efa3a607142589708531bef8_50_0.png)


    **Figure 2.1 – The DB2 big picture: DB2 commands, SQL/XML and XQuery**'
  merge: -1
  img_proc: true
- pgno: 51
  md: "> **Note:**\n> \n> For more information about pureXML, watch this video:\n\
    > [http://www.channeldb2.com/video/video/show?id=607741:Video:4382](http://www.channeldb2.com/video/video/show?id=607741:Video:4382)\n\
    \n# 2.1 Using XML with databases\n\nXML documents can be stored in text files,\
    \ XML repositories, or databases. There are two main reasons why many companies\
    \ opt to store them in databases:\n\n+   Managing large volumes of XML data is\
    \ a database problem. XML is data like other data, just in a different overall\
    \ format. The same reasons to store relational data on databases apply to XML\
    \ data: Databases provide efficient search and retrieval, robust support for persistence\
    \ of data, backup and recovery, transaction support, performance and scalability.\n\
    \n+   Integration: By storing relational and XML documents together, you can integrate\
    \ new XML data with existing relational data, and combine SQL with XPath or XQuery\
    \ in one query. Moreover, relational data can be published as XML, and vice versa.\
    \ Through integration, databases can better support Web applications, SOA, and\
    \ Web services.\n\n# 2.2 XML databases\n\nThere are two types of databases for\
    \ storing XML data:\n\n+   XML-enabled databases\n\n+   Native XML databases\n\
    \n# 2.2.1 XML-enabled databases\n\nAn XML-enabled database uses the relational\
    \ model as its core data storage model to store XML. This requires either a mapping\
    \ between the XML (hierarchical) data model and the relational data model, or\
    \ else storing the XML data as a character large object. While this can be considered\
    \ as \"old\" technology, it is still being used by many database vendors. Figure\
    \ 2.2 explains in more detail the two options for XML-enabled databases."
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/5f6ba170efa3a607142589708531bef8_52_0.png)


    **Figure 2.2 – Two options to store XML in XML-enabled databases**


    The left side of Figure 2.2 shows the CLOB and varchar method of storing XML documents
    in a database. Using this method, an XML document is stored as an unparsed string
    in either a CLOB or a varchar column in the database. If the XML document is stored
    as a string, when you want to retrieve part of the XML document, your program
    will have to retrieve the entire string, and parse it to find what you want. Think
    of parsing as building the XML document tree in memory so you can navigate through
    this tree. This method is memory-intensive and not very flexible.


    The other option for XML-enabled databases is called shredding or decomposition
    and is illustrated on the right hand side of Figure 2.2. Using this method, an
    entire XML document is shredded into smaller parts which are stored in tables.
    Using this method, you are literally forcing an XML document, which is based on
    the hierarchical model, into the relational model. This method is not flexible
    because if the XML document is changed, this change is not easily propagated into
    the corresponding tables and many other tables may need to be created. This method
    is also not good for performance: if you need to get the original XML document
    back, you need to perform an expensive SQL join operation, which can become even
    more expensive when more tables are involved.


    # 2.2.2 Native XML databases


    Native XML databases use the hierarchical XML data model to store and process
    XML internally. The storage format is the same as the processing format; there
    is no mapping to the relational model, and XML documents are not stored as unparsed
    strings (CLOBs or varchars). When XPath or XQuery statements are used, they are
    processed natively by the engine, and not converted to SQL. This is why these
    databases are known as "native" XML databases. DB2 is currently the only commercial
    data server providing this support.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# 2.3 XML in DB2


    Figure 2.3 below outlines how relational data and hierarchical data (XML documents)
    are both stored in a DB2 hybrid database. The figure also shows the CREATE TABLE
    statement that was used to create the table dept.


    ```

    CREATE TABLE dept (deptID CHAR(8), ..., deptdoc XML);

    ```


    ![](img/5f6ba170efa3a607142589708531bef8_53_0.png)


    Note that the table definition uses a new data type, XML, for the deptdoc column.
    The left arrow in the figure indicates the relational column deptID stored in
    relational format (tables), while the XML column deptdoc is stored in parsed hierarchical
    format.


    Figure 2.4 illustrates that in DB2 9, there are now four ways to access data:


    +   - Use SQL to access relational data

    +   - Use SQL with XML extensions (SQL/XML) to access XML data

    +   - Use XQuery to access XML data

    +   - Use XQuery to access relational data


    ![](img/5f6ba170efa3a607142589708531bef8_53_1.png)'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Thus, depending on your background, if you are an SQL person you may see DB2
    as a world class RDBMS that also supports XML. If you are an XML person, you would
    see DB2 as a world class XML repository that also supports SQL.


    Note that IBM uses the term *pureXML* instead of *native XML* to describe this
    technology. While other vendors still use the old technologies of CLOB/varchar
    or shredding to store XML documents, they call those old technologies “native
    XML”. To avoid confusion, IBM decided to use the new term pureXML, and to trademark
    this name so that no other database or XML vendor could use this same term to
    denote some differing technology. pureXML support is provided for databases created
    as Unicode or non-Unicode.


    # ## 2.3.1 pureXML technology advantages


    Many advantages are provided by pureXML technology.


    +   1.  You can seamlessly leverage your relational investment, given that XML
    documents are stored in columns of tables using the new XML data type.

