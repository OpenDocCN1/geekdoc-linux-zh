- pgno: 164
  md: '# Chapter 5 – Application development with C/C++


    This chapter discusses the different aspects of application development using
    C/C++ with DB2, from setting up the development environment to building and running
    the application. Though embedded SQL was discussed earlier in *Chapter 14, Introduction
    to DB2 Application Development*, we will provide a closer look at how embedded
    SQL programming works with a C/C++ program. The chapter also discusses how to
    develop an ODBC or CLI application. In this chapter you will learn about:


    +   - Programming a C/C++ application with embedded SQL

    +   - Building a C/C++ application with embedded SQL

    +   - Programming a C/C++ application with CLI/ODBC

    +   - Building a C/C++ application with CLI/ODBC


    # 5.1 C/C++ DB2 applications: The big picture


    When we talk about database applications, the first thing that comes to our mind
    is SQL. SQL is the language which is used to perform Data Definition Language
    (DDL), Data Control Language (DCL), and Data Manipulation Language (DML) operations
    on a relational database. SQL is not a general purpose programming language; you
    cannot perform user defined operations as SQL is a non-procedural language where
    the SQL statements are executed by the database manager. That’s why database applications
    are mostly developed by combining the capabilities of SQL with a high level programming
    language such as C or C++. Developing an application in a high level programming
    language -- also known as the host language, and embedding SQL statements in that
    application is known as embedded SQL programming. *Figure 5.1* illustrates this
    concept. Embedded SQL applications are commonly developed using C or C++.


    ![](img/5f6ba170efa3a607142589708531bef8_164_0.png)'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'A C/C++ application works in a client-server architecture where the C/C++ application
    works as the client and DB2 as the server. The client sends the request to the
    server and the server performs the operation. A C/C++ application can be an embedded
    SQL application or a CLI/ODBC application. *Figure 5.2* illustrates the client-server
    architecture where a C/C++ application interacts with a DB2 server.


    ![](img/5f6ba170efa3a607142589708531bef8_165_0.png)


    # **Figure 5.2 – C/C++ application accessing a DB2 server**


    *Figure 5.2* shows how C/C++ applications are built and can access a DB2 database.
    Embedded SQL applications containing SQL statements must be precompiled by a DB2
    precompiler. To facilitate this preprocessing, each SQL statement embedded in
    an application must be prefixed with the keywords EXEC SQL and terminated with
    a semicolon (;).


    On the other hand CLI or ODBC is an alternative to embedded dynamic SQL, but unlike
    embedded SQL, it does not require host variables or a precompiler. Applications
    can be run against a variety of databases from different vendors which would provide
    their own ODBC drivers. There is no need for the application to be compiled against
    each of these databases. Processing of ODBC/CLI applications is handled by the
    ODBC/CLI driver. Applications use procedure calls at run time to connect to databases,
    issue SQL statements, and retrieve data and status information.


    We will discuss each of the above methods in more detail in the coming sections.


    # 5.2 Setting up the environment


    Before you start building an embedded SQL C/C++ application or an ODBC/CLI application,
    you need to install a supported C/C++ compiler. For embedded SQL C/C++ programs,
    you also need a precompiler; fortunately, this is included with DB2.


    # 5.2.1 Supported compilers


    *Table 5.1* lists C/C++ compilers that are supported for DB2 database application
    development on both, 32-bit and 64-bit platforms.'
