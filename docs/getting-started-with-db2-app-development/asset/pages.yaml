  md: '# 6.2.1.4 **DataReader**


    **DataReader** is used for fast forward-only, read-only access to connected record
    sets that are returned from executing SQL statements or stored procedure calls.
    The **DataReader** object cannot be directly instantiated and needs to be returned
    as the result of the Command object''s **ExecuteReader** method.


    The **DataReader** object can be used as shown in *Table 6.6*.


    | Provider | Example |

    | :--- | :--- |

    | IBM Data Server Provider for .NET | Db2DataReader reader = cmd.ExecuteReader();
    |

    | OLE DB .NET Data Provider | OleDbDataReader reader = cmd.ExecuteReader(); |

    | ODBC.NET Data Provider | OdbcDataReader reader = cmd.ExecuteReader(); |


    **Table 6.6 – Using DataReader depending on the data provider used**


    The **DataReader** object has **FieldCount** and **HasRows** public properties.
    The **FieldCount** property returns the total number of columns in the current
    row while **HasRows** property indicates whether **DataReader** has one or more
    rows by returning true or false. For example:


    ```

    int cols=reader.FieldCount;

    bool rows=reader.HasRows;

    ```


    The **DataReader** object has the following public methods:


    +   *   **Read**: Reads records one row at a time and advances the cursor to the
    next row. It returns true or false to indicate whether there are any rows to read,
    for example:


    ```

    bool done=reader.read();

    ```


    +   *   **Close** : This closes the **DataReader**, for example:


    ```

    reader.Close();

    ```


    +   *   **Getxxxx** : This is used to get data of type xxxx, for example:


    ```

    Console.WriteLine (reader.GetString(1));

    ```'
  merge: -1
  img_proc: true
