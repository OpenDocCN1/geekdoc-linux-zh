    # Listing 7.4 - Contents of the file style - a CSS file


    We will use this *style* CSS file when we change the *layout*. A layout in Rails
    is a template into which we can flow additional content. In our case, we can define
    a single layout for all the book pages and insert the catalog pages into that
    layout. There are many ways of specifying and using layouts in Rails. We only
    show you how to use the simplest method:


    Create a template file in the `app\home\bookapp\app\views\layouts` directory with
    the same name as the controller *catalog*. Because layout is part of *views*,
    a suffix of *html.erb* must be added to *catalog* as in *catalog.html.erb*. All
    views rendered by the *catalog* controller will use this layout by default. Open
    a text editor and copy the code shown in *Listing 7.5* below and paste it into
    the *catalog.html.erb* file. This will create a new layout for all the pages under
    views of *catalog*.


    ```

    <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">


    <html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

    <head>

    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />

    <title>DB Books Series</title>

    (1) <%= stylesheet_link_tag "style" %>

    </head>


    <body id="catalog">

    <div id="banner">

    <%= @page_title | "DB2 on Campus Books Series" %>

    </div>


    <div id="side">

    (2) <a href="http://localhost:3000/catalog" >Home</a><br />

    <a href="http://localhost:3000/books" >Books</a><br />

    <br /><br /><br /><br /><br /><br /><br /><br /><br />

    <br /><br /><br /><br />

    </div>

    <div id="main">

    <%= yield :layout %>

    </div>

    </body>

    ```'
