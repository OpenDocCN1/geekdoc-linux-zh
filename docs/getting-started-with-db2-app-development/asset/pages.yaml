  md: '# Getting started with DB2 application development couldn''t be easier.


    Read this book to:


    +   - Discover DB2® application development using DB2 Express-C

    +   - Write SQL, XQuery, and understand pureXML® technology

    +   - Learn how to develop DB2 stored procedures, functions and data Web services

    +   - Learn how to work with DB2 and Java™, C/C++, .NET, PHP, Ruby on Rails, Perl,
    and Python

    +   - Troubleshoot DB2 database-related problems

    +   - Practice with hands-on exercises


    DB2 Express-C from IBM is the no-charge edition of DB2 data server for managing
    relational and XML data with ease. No-charge means DB2 Express-C is free to download,
    free to develop your applications, free to deploy into production, and even free
    to embed and distribute with your solution. And, DB2 does not place any artificial
    limits on the size of databases, number of databases, or number of users.


    DB2 Express-C runs on Windows®, Linux®, Solaris, and Mac OS X systems, and provides
    application drivers for a variety of programming languages and frameworks including
    C/C++, Java, .NET, Ruby on Rails, PHP, Perl, and Python. If you require even greater
    scalability or more advanced functionality, you can seamlessly deploy applications
    built using DB2 Express-C to other DB2 editions such as DB2 Workgroup and DB2
    Enterprise.


    This free edition of DB2 is ideal for developers, consultants, ISVs, DBAs, students,
    or anyone who intends to develop, test, deploy, or distribute database applications.
    Join the growing DB2 Express-C user community today and take DB2 Express-C for
    a test drive. Start discovering how you can create next generation applications
    and deliver innovative solutions.


    To learn more or download DB2 Express-C, visit ibm.com/db2/express


    To socialize and watch related videos, visit channelDB2.com


    This book is part of the DB2 on Campus book series, free eBooks for the community.
    Learn more at db2university.com


