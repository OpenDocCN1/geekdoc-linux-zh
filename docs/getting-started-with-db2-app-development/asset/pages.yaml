  md: '# ### 9.5 Summary


    In this chapter, you have learned how to set up a Perl environment to work with
    DB2, and how to execute SQL statements and call stored procedures from Perl applications
    by calling the standard Perl DBI interface.


    # ### 9.6 Review questions


