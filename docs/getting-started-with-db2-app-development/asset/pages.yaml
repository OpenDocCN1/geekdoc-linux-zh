    # 1.2 Server-side development


    Server-side development in DB2 software implies that application objects are developed
    and stored on the DB2 database. The following application objects will be discussed
    briefly in this section:


    +   - Stored Procedures

    +   - User-defined Functions (UDFs)

    +   - Triggers


    # 1.2.1 Stored procedures


    A stored procedure is a database application object that can encapsulate SQL statements
    and business logic. Keeping part of the application logic in the database provides
    performance improvements as the amount of network traffic between the application
    and the database is reduced. In addition, stored procedures provide a centralized
    location to'
  merge: -1
  img_proc: true
- pgno: 25
  md: "store your code, so other applications can reuse the same stored procedures.\
    \ To call a stored procedure, use the CALL statement. In DB2 you can develop stored\
    \ procedures in several languages including SQL PL, PL/SQL, Java, C/C++, CLR,\
    \ OLE, and COBOL. A simple example of how to create and call a SQL PL stored procedure\
    \ from the DB2 Command Window or Linux® shell is shown below:\n\n```\n```\ndb2\
    \ create procedure P1 begin end\ndb2 call P1\n```\n```\n\nIn the example, procedure\
    \ P1 is an empty stored procedure which is not doing anything. The example illustrates\
    \ how easy you can create a stored procedure. To develop stored procedures with\
    \ more complex logic, we recommend you use IBM Data Studio which includes a debugger.\n\
    \n# 1.2.2 User-defined functions\n\nA user-defined function (UDF) is a database\
    \ application object that allows users to extend the SQL language with their own\
    \ logic. A function always returns a value or values normally as a result of the\
    \ business logic included in the function. To invoke a function, use it within\
    \ a SQL statement, or with the values function. In DB2 you can develop UDFs in\
    \ several languages including SQL PL, PL/SQL, Java, C/C++, OLE DB, CLR.\n\nThis\
    \ simple example shows how to create and call a SQL PL UDF from the DB2 Command\
    \ Window or Linux shell:\n\n```\n```\ndb2 create function F1() returns integer\
    \ begin return 1000; end\ndb2 values F1\n```\n```\n\nIn the example, function\
    \ F1 is a function returning an integer value of 1000. The VALUES statement can\
    \ be used to invoke the function. Like in the case of stored procedures, we recommend\
    \ you create functions using IBM Data Studio.\n\n# 1.2.3 Triggers\n\nA trigger\
    \ is an object that automatically performs an operation on a table or view. A\
    \ triggering action on the object where the trigger is defined causes the trigger\
    \ to be fired. A trigger is normally not considered an application object; therefore,\
    \ database developers normally don't code triggers, but database administrators\
    \ do. Because some code coding is required, we have included triggers in this\
    \ section. Below is an example of a trigger:\n\n```\n```\ncreate trigger myvalidate\
    \ no cascade before insert on T1\n  referencing NEW as N\n  for each row\n   \
    \ begin atomic\n      set (N.myxmlcol) = XMLVALIDATE(N.myxmlcol\n    according\
    \ to xmlschema id myxmlschema);\n    end\n```\n```"
