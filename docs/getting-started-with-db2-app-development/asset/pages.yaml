  md: "![](img/5f6ba170efa3a607142589708531bef8_193_0.png)\n\nFigure 5.25 – Add ODBC\
    \ data source\n\n+   An alternative to using the ODBC Data Source Administrator\
    \ is to register the database using the command below:\n\n```\ndb2 catalog system\
    \ odbc data source sample\n```\n\n# 5.5.2  Handles\n\nAn ODBC/CLI handle is a\
    \ variable that refers to a data object allocated and managed by ODBC/CLI. In\
    \ simpler terms, a handle is a pointer to a variable which is used for passing\
    \ references to the variable between parts of the program. There are four types\
    \ of handles in ODBC/CLI:\n\n+   **Environment handle (SQL_HANDLE_ENV)**\n+  \
    \ \n+   An environment handle refers to an object that holds information about\
    \ the global state of the application, attributes or connections. An environment\
    \ handle must be allocated before a connection handle can be allocated.\n\n+ \
    \  **Connection handle (SQL_HANDLE_DBC)**\n+   \n+   A connection handle refers\
    \ to an object that holds information about the connection to a particular database.\
    \ For each database, a separate connection handle must be allocated. A connection\
    \ handle must be allocated before a statement handle can be allocated.\n\n+  \
    \ **Statement handle (SQL_HANDLE_STMT)**\n+   \n+   A statement handle refers\
    \ to an object that holds information about the execution of a single SQL statement.\
    \ Before the execution of a SQL statement, a statement handle must be allocated\
    \ and associated with a connection handle.\n\n+   **Descriptor handle (SQL_HANDLE_DESC)**\n\
    +   \n+   A descriptor handle refers to an object that contains information about\
    \ the columns in a result set and dynamic parameters in an SQL statement.\n\n\
    *Figure 5.26 taken from the IBM redbook DB2 Express-C: The Developer Handbook\
    \ for XML, PHP, C/C++, Java, and .NET [5] illustrates the relationship between\
    \ the different handles.*"
