    # 3.3.10 Errors and condition handlers


    In DB2, the SQLCODE and SQLSTATE keywords are used to determine the successful
    or unsuccessful execution of an SQL statement. These keywords need to be explicitly
    declared in the outermost scope of the procedure as follows:


    ```

    DECLARE SQLSTATE CHAR(5);

    DECLARE SQLCODE INT;

    ```


    DB2 will set the values of the above keywords automatically after each SQL operation.
    For the SQLCODE, the values are set as follows:


    +   - = 0, successful.

    +   - > 0, successful with warning

    +   - < 0, unsuccessful

    +   - = 100, no data was found. (i.e.: FETCH statement returned no data)


    For the SQLSTATE, the values are set as follows:


    +   - success: SQLSTATE ''00000''

    +   - not found: SQLSTATE ''02000''

    +   - warning: SQLSTATE ''01XXX''

    +   - exception: all other values


    The SQLCODE is RDBMS specific, and more detailed than the SQLSTATE. The SQLSTATE
    is standard among RDBMSs but is very general in nature. Several SQLCODEs may match
    one SQLSTATE.


    A condition can be raised by any SQL statement and would match an SQLSTATE. For
    example, a specific condition like SQLSTATE ''01004'' is raised when a value is
    truncated during an SQL operation. Rather than using SQLSTATE ''01004'' to test
    for this condition, names can be assigned. In this particular example, the name
    trunc can be assigned to condition SQLSTATE ''01004'' as shown below.


    ```

    DECLARE trunc CONDITION FOR SQLSTATE ''01004''

    ```


    Other predefined general conditions are:


    +   - SQLWARNING'
  merge: -1
  img_proc: true
