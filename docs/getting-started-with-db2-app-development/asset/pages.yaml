    # ### 1.3 Client-side development


    As the name suggests, in client-side development, the application developers code
    their programs on a client and then connect and access the DB2 database using
    the application program interfaces (APIs) that are provided with DB2. In this
    section we discuss:


    +   - Embedded SQL

    +   - Static SQL vs Dynamic SQL

    +   - CLI and ODBC

    +   - JDBC, SQLJ and pureQuery

    +   - OLE DB

    +   - ADO.NET

    +   - PHP

    +   - Ruby on Rails

    +   - Perl

    +   - Python


    # #### 1.3.1 Embedded SQL


    **_Embedded SQL applications_** are applications where SQL is embedded into a
    host language such as _C_, _C++_, or COBOL. The embedded SQL application can include
    static or dynamic SQL as described in the next section. _Figure 1.2_ shows how
    an embedded SQL application is built.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/5f6ba170efa3a607142589708531bef8_27_0.png)


    In the figure, the C program `hello.sqc` contains embedded SQL. The embedded SQL
    API for the C language uses **EXEC SQL** (highlighted in *Figure 1.2*) to allow
    a precompilation process to distinguish between the embedded SQL statements and
    the actual C code. You may also note in the `hello.sqc` listing that some variables
    are prefixed with a colon, as in `:dbname`, `:userID`, and `:psw`. These are called
    host variables. Host variables are variables from the host language that are referenced
    in the embedded SQL statements.


    Issuing the **precompile** command (also known as the **prep** command) with the
    **bindfile** option generates two files, the `hello.bnd` bind file containing
    only SQL statements and the `hello.c` file containing only C code. The bind file
    will be compiled using the **bind** command to obtain a **package** that is stored
    in the database. A package includes the compiled/executable SQL and the access
    path DB2 will follow to retrieve the data. To issue the **bind** command, a connection
    to the database must exist. At the bottom of the figure, the `hello.c` file is
    compiled and linked like any regular C program. The resulting executable file
    `hello.exe` has to match the package stored in the database to successfully execute.


    # 1.3.2 Static SQL vs. Dynamic SQL


    Static SQL statements are the ones where the SQL structure is fully known at precompile
    time. For example:


    ```

    SELECT lastname, salary FROM employee

    ```'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'In this example, the names for the columns (\*lastname*, \*salary*) and table
    (\*employee*) referenced in a statement are fully known at precompile time. The
    following example is also a static SQL statement:


    ```

    SELECT \*lastname*, \*salary\* FROM \*employee\* WHERE \*firstnm\* = :fname

    ```


    In this second example, a host variable \*:fname* is used as part of an embedded
    SQL statement. Though the value of the host variable is unknown until runtime,
    its data type is known from the program, and all the other objects (column names,
    table names) are fully known ahead of time. DB2 software uses estimates for these
    host variables to calculate the access plan ahead of time; therefore, this case
    is still considered static SQL.


    You precompile, bind, and compile statically executed SQL statements before you
    run your application. Static SQL is best used on databases whose statistics do
    not change a great deal. Now let’s take a look at one more example:


    ```

    SELECT \*?, \*?\* FROM \*?\*

    ```


    In this example, the names for the columns and table referenced by the statement
    are not known until runtime. Therefore the access plan is calculated only at runtime
    and using the statistics available at the time. These types of statements are
    considered \*Dynamic\* SQL statements.


    Some programming APIs, like JDBC and ODBC, always use dynamic SQL regardless of
    whether the SQL statement includes known objects or not. For example, the statement
    \*SELECT\* \*lastname*, \*salary\* FROM \*employee\* has all the columns and table
    names known ahead of time, but through JDBC or ODBC, you do not precompile the
    statements. All the access plans for the statements are calculated at runtime.


    In general, two statements are used to treat a SQL statement as dynamic:


    +   • **\*PREPARE\***: This statement prepares or compiles the SQL statement calculating
    the access plan to use to retrieve the data

    +   • **\*EXECUTE\***: This statement executes the SQL


    Alternatively you can execute a **\*PREPARE\*** and **\*EXECUTE\*** in one single
    statement: **\*EXECUTE IMMEDIATELY\***


    \*Listing 1.1\* shows an example on an embedded C dynamic SQL statement that is
    prepared and executed.


    ```

    strcpy (hvStmtDyn, "SELECT \*name\* FROM emp WHERE dept = \*?\*" );

    PREPARE Stm tDyn FROM :hvStmtDyn;

    EXECUTE StmtDyn USING 1;

    EXECUTE StmtDyn USING 2;

    ```


    \*Listing 1.1\* - An embedded C dynamic SQL statement using **\*PREPARE\*** and
    **\*EXECUTE\***


    \*Listing 1.2\* shows the same example as \*Listing 1.1\*, but using the **\*EXECUTE
    IMMEDIATELY\*** statement'
  merge: -1
  img_proc: true
