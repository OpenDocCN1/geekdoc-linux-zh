    # # 9.3 Developing Perl DB2 applications


    In this section you will learn how to develop a Perl application that will access
    DB2 data by calling the Perl DBI API.


    # ## 9.3.1 Connecting to a DB2 database


    First, enable Perl to load the Perl DBI module that provides the standard DBI
    APIs used to access a database. This can be done using this line in your application:


    ```

    use DBI;

    ```


    Then, connect to the DB2 database by calling the **DBI->connect** method of the
    DBI package using this syntax:


    ```

    $dbhndle = DBI->connect($data_source, $userID, $password, \%attr);

    ```


    *Table 9.1* explains some of the parameters of the **DBI->connect** method.


    | Name | Description |

    | --- | --- |

    | $data_source | A database connection string with the format of `\`''dbi:DB2:dbalias''`,
    where *dbalias* represents one of the following:<br>1) A DB2 Database alias cataloged
    in your DB2 client, or<br>2) A connection string that includes the database name,
    host name, port number, protocol, user ID, and password in the format of `''DATABASE=database;
    HOSTNAME=hostname; PORT=port; PROTOCOL=TCPIP; UID=username; PWD=password''`. This
    format |'
  merge: -1
  img_proc: true
- pgno: 325
  md: '| | | |

    | --- | --- | --- |

    | | | can be used for connecting to a remote database via TCP/IP directly without
    first cataloging it on the client |

    | $userID | | The user ID used to connect to the database, it’s optional if **username**
    is specified in **$data_source** connection string |

    | $password | | The password for the user ID to connect to the database, it’s
    optional if **password** is specified in **$data_source** connection string |

    | \%attr | | Optional, a reference to the list of database connection attributes
    |


    **Table 9.1 - Parameters for the DBI->connect method**


    The **DBI->connect** method will automatically load the DBD::DB2 module if it
    was not loaded earlier, and return a database handle if the connection succeeds.
    The database handle will be used for all future function calls made on the DB
    connection.


    For example, to connect to the **SAMPLE** database, make the connection as shown
    in *Listing 9.5*:


    ```

    ```sql

    Use DBI;

    my $dbhandle = DBI->connect("dbi:DB2:sample", "db2admin", "password", {AutoCommit=>0});

    ```

    ```


    **Listing 9.5 - Connect to SAMPLE database cataloged on the client**


    In the above listing, the database user ID is **db2admin**, the **password** is
    **password** and the **AutoCommit** connection attribute is set off, which means
    it is turned off. This means you can explicitly issue a commit or rollback for
    a transaction for this connection. By default **AutoCommit** is on. After successful
    execution, the **DBI->connect** returns a database handle in the variable **$dbhandle**.


    If the **SAMPLE** database is a remote database on a machine **host2** where the
    instance is listening to port 50000 and it has not been cataloged in your client,
    you can make a connection to it via TCP/IP directly as shown in *Listing 9.6*:


    ```

    ```sql

    use DBI;

    my $dbhandle = DBI->connect("dbi:DB2:DATABASE=sample; HOSTNAME=host2;

    PORT=50000; PROTOCOL=TCP/IP;UID=db2admin;PWD=password", {AutoCommit=>0});

    ```

    ```


    **Listing 9.6 - Connect to the remote SAMPLE database via TCP/IP directly**


