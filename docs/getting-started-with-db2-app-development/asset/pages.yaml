- pgno: 292
  md: "# 8.3.2.3.3 Isolation level to use\n\nYou can use two methods to change the\
    \ isolation level in a PHP program:\n\n+   1.  Append the **WITH** clause in the\
    \ SQL statement so that a particular SQL runs in the specified isolation level.\
    \ *Listing 8.3* provides an example.\n\n```\n```text\n// With connection being\
    \ made and connection resource\n// is in $conn_resource\n$sql = 'SELECT c_id FROM\
    \ customer WITH UR';\n$stmt = db2_exec($conn_resource, $sql);\n```\n**Listing\
    \ 8.3** – Set isolation level in PHP with ibm_db2\n```\n\nIn the above example,\
    \ the query is run using the **UR** isolation level.\n\n+   2.  Changing the **CURRENT\
    \ ISOLATION** special register\n+   \n+       To use a particular isolation level\
    \ for the whole session, set the **CURRENT ISOLATION** special register to **UR**,\
    \ **CS**, **RS**, or **RR**. The DB2 special register value overrides the default\
    \ isolation level. It is a good practice to reset the isolation level to the default\
    \ (**CS**) toward the end of the script. See *Listing 8.4* for an example.\n\n\
    ```\n```text\n// With connection being made and connection resource\n// is in\
    \ $conn_resource\n(1) $currentiso = 'SET CURRENT ISOLATION LEVEL TO RR';\n(2)\
    \ $sql = 'SELECT c_id FROM customer';\n(3) $stmt = db2_exec($conn_resource, $currentiso);\n\
    (4) $stmt = db2_exec($conn_resource, $sql);\n// Execute other SQL statements\n\
    $currentiso = 'SET CURRENT ISOLATION LEVEL TO CS';\n$stmt = db2_exec($conn_resource,\
    \ $currentiso);\n```\n**Listing 8.4** – Set isolation level in **CURRENT ISOLATION**\
    \ special register\n```\n\nIn the above listing:\n\n+       (1) **currentiso**\
    \ is assigned the current isolation level to RR.\n+       (2) **sql** is assigned\
    \ the SQL query to be executed.\n+       (3) **stmt** is assigned the return values\
    \ from the **db2_exec()** method. The connection resource variable, and the isolation\
    \ level need to be passed while executing the command.\n+       (4) **stmt** is\
    \ assigned the return values from the **db2_exec()** method. The connection resource\
    \ variable and the query to be executed need to be passed while executing the\
    \ command.\n\n# 8.3.2.3.4 Preparing and executing SQL statements"
