    \ on the other hand, is case sensitive. The above functions are XQuery interface\
    \ functions so all the table names and column names should be passed to these\
    \ functions in uppercase. Passing the object names in lowercase may result in\
    \ an undefined object name error.\n\n# ### 2.3.6 Joins with SQL/XML\n\nThis section\
    \ describes how to perform JOIN operations between two XML columns of different\
    \ tables, or between one XML column and one relational column. Assume you have\
    \ created two tables with the statements shown in *Listing 2.20*\n\n```\nCREATE\
    \ TABLE dept (unitID CHAR(8), deptdoc XML)\nCREATE TABLE unit (unitID CHAR(8)\
    \ primary key not null,\n                     name CHAR(20),\n               \
    \      manager VARCHAR(20),\n                     ...)\n\n```\n\n# **Listing 2.20\
    \ - DDL of tables to use in the JOIN examples**\n\nYou can perform a JOIN operation\
    \ in either of two ways. The first method is shown in *Listing 2.21*.\n\n```\n\
    SELECT u.unitID\n   FROM dept d, unit u\n  WHERE XMLLEISTS (\n         '$e//employee[name\
    \ = $m]'\n   passing d.deptdoc as \"e\", u.manager as \"m\")\n\n```\n\n# **Listing\
    \ 2.21 - First method to perform a JOIN with SQL/XML**\n\nLine 4 of the statement\
    \ in the above listing shows that the JOIN operation occurs between the element\
    \ **name**, which is a sub-element of the **deptdoc** XML column in table **dept**,\
    \ and the **manager** relational column in the table **unit**."
