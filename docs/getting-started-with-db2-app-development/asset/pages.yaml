    # 1.3.6 ADO.NET


    The .NET Framework is the Microsoft replacement for Component Object Model (COM)
    technology. Using the .NET Framework, you can code .NET applications in over forty
    different programming languages; the most popular ones being C# and Visual Basic
    .NET.


    The .NET Framework class library provides the building blocks with which you build
    .NET applications. This class library is language agnostic and provides interfaces
    to operating system and application services. Your .NET application (regardless
    of language) compiles into Intermediate Language (IL), a type of bytecode.


    The Common Language Runtime (CLR) is the heart of the .NET Framework, compiling
    the IL code on the fly, and then running it. In running the compiled IL code,
    the CLR activates objects, verifies their security clearance, allocates their
    memory, executes them, and cleans up their memory once execution is finished.


    As an analogy to how Java works, in Java, a program can run in multiple platforms
    with minimal or no modification: one language, but multiple platforms. In .NET,
    a program written in any of the forty supported languages can run in one platform,
    Windows, with minimal or no modification: multiple languages, but one platform.


    ADO.NET is how data access support is provided in the .NET Framework. ADO.NET
    supports both connected and disconnected access. The key component of disconnected
    data access in ADO.NET is the DataSet class, instances of which act as a database
    cache that resides in your application’s memory.


    For both connected and disconnected access, your applications use databases through
    what is known as a data provider. Various database products include their own
    .NET data providers, including DB2 for Windows.


    A .NET data provider features implementations of the following basic classes:


    +   Connection: establishes and manages a database connection.

    +   - Command: executes an SQL statement against a database.

    +   - DataReader: reads and returns result set data from a database.

    +   - DataAdapter: links a DataSet instance to a database. Through a DataAdapter
    instance, the DataSet can read and write database table data.


    Three data providers that can work with DB2 software are shown in *Table 1.3*


    | Data Provider | Characteristics |

    |---|---|'
