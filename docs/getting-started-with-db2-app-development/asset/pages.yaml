  md: '![](img/5f6ba170efa3a607142589708531bef8_127_0.png)


    *Table 4.2* provides more details about the DB2 JDBC and SQLJ drivers.


    | Driver Type | Driver Name | Packaged as | JDBC specification supported | Minimum
    level of SDK for Java required |

    | :--- | :--- | :--- | :--- | :--- |

    | Type 2 | DB2 JDBC Type 2 Driver for Linux, UNIX and Windows (*Deprecated*) |
    `db2java.zip` | JDBC 1.2 and JDBC 2.0 | 1.4.2 |

    | Type 2 and Type 4 | IBM Data Server Driver for JDBC and SQLJ | `db2jcc.jar`
    and `sqlj.zip` | JDBC 3.0 compliant | 1.4.2 |

    | | | `db2jcc4.jar` and `sqlj4.zip` | JDBC 4.0 and earlier | 6 |


    Table 4.2 - DB2 JDBC and SQLJ drivers


    * *Deprecated means it is still supported, but no longer enhanced*


    As you can see from *Table 4.2*, Type 2 is provided with two different drivers;
    however the DB2 JDBC Type 2 Driver for Linux, UNIX and Windows, packaged as `db2java.zip`,
    is deprecated.


    The IBM Data Server Driver for JDBC and SQLJ packaged as `db2jcc.jar` (`com.ibm.db2.jcc`)
    includes support for both, the type 2 and type 4 drivers. The choice of driver
    is determined based on the syntax used to connect to the database in your Java
    program: if a hostname or IP address, and a port are included in the connection
    string, then type 4 is used, otherwise, type 2 is used. This is discussed in more
    detail in a later section of this chapter. The IBM Data Server Driver for JDBC
    and SQLJ has been optimized to access all DB2 servers in all platforms including
    the mainframe.


    When you install a DB2 server, a DB2 client or the IBM Data Server Driver for
    JDBC and SQLJ, the `db2jcc.jar` and `sqlj.zip` files compliant with JDBC 3.0 are
    automatically added to your **CLASSPATH**. If you would like to use the JDBC 4.0
    Specification, make sure to replace `db2jcc.jar` and `sqlj.zip` with `db2jcc4.jar`
    and `sqlj4.zip` respectively in the **CLASSPATH**.


    **Note:**'
