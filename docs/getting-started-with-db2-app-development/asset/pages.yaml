  md: 'This time, XQuery will be the primary query method, and in some cases, we will
    use SQL embedded inside XQuery (using the **db2-fn:sq1query** function). When
    using XQuery, we will invoke a few functions, and will also use the FLWOR expression.


    # **Example 1**


    This is a simple XQuery to return customer contact data. In the example, **CONTACT**
    is the name of the XML column, and **CLIENTS** is the name of the table.


    ```

    xquery db2-fn:xmlcolumn(''CLIENTS.CONTACT'')

    ```


    Always prefix any XQuery expression with the **xquery** command so that DB2 knows
    it has to use the XQuery parser, otherwise DB2 will assume you are trying to run
    an SQL expression. The **db2-fn:xmlcolumn** function is a function that retrieves
    the XML documents from the column specified as the parameter. It is equivalent
    to the following SQL statement, as it is retrieving the entire column contents:


    ```

    SELECT contact FROM clients

    ```


    # **Example 2**


    In this example shown in *Listing 2.15*, we use the FLWOR expression to retrieve
    client fax data


    ```

    xquery

    for $y in db2-fn:xmlcolumn(''CLIENTS.CONTACT'')/Client/fax

    return $y

    ```


    # **Listing 2.15 - XQuery and the FLWOR expression**


    The first line invokes the XQuery parser. The second line instructs DB2 to iterate
    through the fax sub-elements contained in the **CLIENTS.CONTACT** column. Each
    fax element is bound to the variable `$y`. The third line indicates that for each
    iteration, the value "$y" is returned.


    The output of this query is illustrated in *Listing 2.16* (We omitted the namespace
    in the output, otherwise it would be harder to read as it may span several lines):


    ```

    <fax>4081112222</fax>

    <fax>5559998888</fax>

    ```


    # **Listing 2.16 - Output of the query show in Listing 2.15**


