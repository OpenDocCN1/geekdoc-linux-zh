    ![](img/5f6ba170efa3a607142589708531bef8_218_0.png)


    **Figure 6.2 - ADO.NET core objects and their relationship**


    Data access with ADO.NET can be summarized as follows:


    A **Connection** object establishes a connection to the database. A **Command**
    object executes a query to the database. If the query returns more than a single
    value, the command object returns a **DataReader**, which is like a cursor. Alternatively,
    the **DataAdapter** can be used to populate a DataSet object. The database can
    be updated using the **Command** object or the **DataAdapter**.


    # ### 6.2.1 Data providers for ADO.NET


    In the ADO.NET architecture, applications -- also known as Data Consumers -- connect
    to a database -- also referred to as Resource -- using a data provider. The data
    provider encapsulates data and provides a means to interact with the database
    including connection, execution of SQL statements, and retrieval of results.


    There are 3 types of .NET data providers for DB2 applications to access a DB2
    database:


    +   - IBM Data Server Provider for .NET

    +   - OLE DB .NET Data Provider

    +   - ODBC .NET Data Provider'
