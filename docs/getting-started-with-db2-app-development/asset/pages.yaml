    As illustrated in the above *Figure 6.3* each provider delivers the same core
    functionalities or classes described earlier: Connection, Command, DataAdapter,
    DataReader.


    In the Microsoft .NET Framework, classes are organized into a hierarchical structure
    of related groups called *namespaces*. System.Data namespace contains classes
    associated with the use of ADO.NET.


    The IBM.Data.DB2 namespace is the .NET Framework Data Provider for IBM data servers.
    The IBM Data Server Provider for .NET extends support for the ADO.NET interface
    and delivers high-performing, secure access to data.'
