- pgno: 18
  md: '# # About the authors


    **Raul F. Chong** is the DB2 on Campus program manager and a DB2 technical evangelist
    based at the IBM Toronto Laboratory. His main responsibility is to grow the DB2
    community around the world. Raul joined IBM in 1997 and has held numerous positions
    in the company. As a DB2 consultant, Raul helped IBM business partners with migrations
    from other relational database management systems to DB2, as well as with database
    performance and application design issues. As a DB2 technical support specialist,
    Raul helped resolve DB2 problems on the OS/390®, z/OS®, Linux®, UNIX® and Windows®
    platforms. Raul has taught many DB2 workshops, has published numerous articles,
    and has contributed to the DB2 Certification exam tutorials. Raul has summarized
    many of his DB2 experiences through the years in his book *Understanding DB2 -
    Learning Visually with Examples 2nd Edition (ISBN-10: 0131580183)* for which he
    is the lead author. He has also co-authored the book *DB2 SQL PL Essential Guide
    for DB2 UDB on Linux, UNIX, Windows, i/OS, and z/OS (ISBN 0131477005)*, and is
    the project lead and co-author of many of the books in the DB2 on Campus book
    series.


    **Xiqiang Ji** is a DB2 Advanced Support Engineer in IBM AP DB2 Level 2 support
    team in Sydney. His main responsibility is to provide technical support for IBM
    Asia Pacific and worldwide customers for solving various DB2 problems. During
    the past 5 years, He has helped many DB2 customers across various industries solve
    many critical technical issues. Before this, He had worked for 5 years as a technical
    consultant in IBM Software Group supporting IBM Business Partners and Independent
    Software Vendors in developing DB2 applications and DB2 Business Intelligence
    solutions.


    **Priyanka Joshi** is a software engineer with IBM India software labs working
    as a DB2 advanced technical support specialist. Her primary responsibility is
    to provide advanced technical support on DB2 Linux®, UNIX® and Windows (LUW) platforms
    to IBM worldwide customers. Priyanka joined IBM in 2006 and has since worked for
    numerous pre-sales and post-sales support engagements for DB2 LUW. She specializes
    in DB2 - Common Client Technologies and is a certified DB2 professional. Priyanka
    has been identified as the Knowledge Champion for Asia-Pacific division as part
    of the Knowledge Centered support initiative in IBM and also is a part of the
    prestigious Technical Leaders group in IBM, responsible for providing smart solutions
    to IBM customers in collaboration with other IBM product teams.


    **Vineet Mishra** is a software engineer with the DB2 LUW team at the India Software
    Lab. Vineet Joined IBM in 2007 and specializes in C and C++. His areas of interest
    are High Availability and Disaster Recovery (HADR), stored procedures & UDFs,
    Embedded SQL and Operating System Kernel. Vineet is a member of IBM Academic Initiative
    and IBM University Relationship and actively works towards spreading DB2 (LUW)
    knowledge in colleges. He frequently responds to queries in the DB2 forum.


    **Min Wei Yao** is an application developer focusing on Business Intelligence.
    Min Wei joined IBM in 2008 and has been working in the IBM Global Business Services
    area since then. Besides working as a developer, Min Wei also likes to experiment
    with Linux, and DB2. Min'
  merge: -1
  img_proc: true
