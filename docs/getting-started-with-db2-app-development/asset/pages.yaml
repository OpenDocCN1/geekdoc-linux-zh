    interface introduced in PHP 5.1. It can be compiled directly against DB2 libraries.


    The PHP extensions and drivers are available for free from the PECL repository
    at [http://pecl.php.net/](http://pecl.php.net/). Windows builds of the extensions
    and drivers are available at [http://sourceforge.net/projects/db2mc/files/](http://sourceforge.net/projects/db2mc/files/)


    You will need the IBM Data Server Driver for ODBC and CLI to install the PHP extensions
    on Linux and UNIX. Both, ibm_db2 and pdo_ibm are based on the IBM DB2 CLI Layer.


    # 1.3.8 Ruby on Rails


    Ruby is an open source object oriented language. Rails is a Web framework created
    using Ruby. Ruby on Rails (RoR) is an ideal means to develop database backed web-based
    applications. This hot new technology is based on the Model, View, Controller
    (MVC) architecture and follows the principles of agile software development.


    Rails requires no special file formats or integrated development environments
    (IDEs); you can get started with a text editor. However, various IDEs are available
    with Rails support, such as RadRails, which is a Rails environment for Eclipse.
    For more information about RadRails, visit [http://www.radrails.org/](http://www.radrails.org/).


    DB2 supports Ruby 1.8.5 and later and Ruby on Rails 1.2.1 and later. The IBM_DB
    gem includes the IBM_DB Ruby driver and Rails adapter which allows you to work
    with DB2 and is based on the CLI layer. This gem must be installed along with
    an IBM Data Server Client. To install the IBM_DB driver and adapter you can use
    Ruby gem or as a Rails plug-in.


    # 1.3.9 Perl


    Perl is a popular interpreted programming language that is freely available for
    many operating systems. It uses dynamic SQL, and it is ideal for prototyping applications.


    Perl provides a standard module called the Database Interface (DBI) module for
    accessing different databases. It is available from [http://www.perl.com](http://www.perl.com).
    This module “talks” to drivers from different database vendors. In the case of
    DB2, this is the DBD::DB2 driver which is available from [http://www.ibm.com/software/data/db2/perl](http://www.ibm.com/software/data/db2/perl).


    # 1.3.10 Python


    Python is a dynamic language often used for scripting. It emphasizes code readability
    and supports a variety of programming paradigms, including procedural, object-oriented,
    aspect-oriented, meta, and functional programming. Python is ideal for rapid application
    development.'
