    # 3.6.1 Types of triggers


    There are three types of triggers: "before" triggers, "after" triggers, and "instead
    of" triggers.


    # 3.6.1.1 Before triggers


    Before triggers are activated before a row is inserted, updated or deleted. The
    operations performed by this trigger cannot activate other triggers; therefore
    an INSERT, UPDATE, or DELETE operations are not permitted. An example of a simple
    before trigger with explanation of some of its syntax is shown in Figure 3.14.


    ![](img/5f6ba170efa3a607142589708531bef8_107_1.png)


    Figure 3.14 – Example of a before trigger


    In the above figure the trigger default_class_end will be triggered before an
    INSERT SQL statement is performed on the table CL_SCHED. This table is part of
    the SAMPLE database, so you can create and test this trigger yourself while connected
    to this database.'
