- pgno: 293
  md: 'The concept of preparing and executing SQL statements in one or two different
    steps have been discussed in Chapter 1. In PHP with the **ibm\_db2** extension,
    this is done as follows:


    # ### Prepare and execute together


    Doing a prepare and execute in one step involves only one function, but it does
    not give you optimized performance if the same query is executed more than once.
    Passing the SQL statement along with the connection resource to the function **db2\_exec**
    will prepare and then execute the statement in one step. The one step process
    can be used with different cursor types:


    +   - To execute and prepare with default cursors :


    ```

    ```

    $sql1 = ''SELECT c_id FROM customer'';

    $stmt = db2_exec($conn_resource, $sql1);

    ```

    ```


    +   - To execute and prepare with a different type of cursor parameter, you can
    use an optional parameter for changing the default forward-only cursor to the
    scrollable cursor. You need to pass **DB2\_SCROLLABLE** as an associative array
    as the third parameter as shown below:


    ```

    ```

    $stmt    =    db2_exec($conn_resource,    $sql1,    array(''cursor''    =>

    DB2_SCROLLABLE)) ;

    ```

    ```


    # ### Prepare and then execute


    This is the best way to execute SQL statements in terms of security and performance.
    The steps involved in the procedure are:


    +   1. **Preparing the SQL statement**


    You can prepare an SQL statement with or without parameter markers by using the
    **db2\_prepare** function. You can also specify which type of cursor to use while
    fetching the rows. For example, this SQL statement uses parameter markers:


    ```

    ```sql

    SELECT c_name FROM CUSTOMERS WHERE c_id = ? and c_phone = ?

    ```

    ```


    The values for the parameter markers ("?") can be supplied to the database engine
    to retrieve the results using the **db2\_prepare** function.


    +   2. **Bind the parameters**


    Use the **db2\_bind\_param** function to bind a PHP variable into the prepared
    SQL statement dynamically. It is more powerful than binding an array of variables
    in the **db2\_execute** statement, because we can specify the parameter type,
    data type, precision, and scale of the variable that we bind with the prepared
    SQL statement. The parameter **DB2\_PARAM\_IN** is used for all statements, except
    when inserting large objects and using the **CALL** statement. Once the parameter
    is'
