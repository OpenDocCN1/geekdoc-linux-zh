  md: '# ## 1.5 Web services


    As a simple definition, think of a Web service as a function you can invoke through
    the network, where you don’t need to know the programming language used to develop
    it, you don’t need to know the operating system where the function will run, and
    you don’t need to know the location where it will run. Web services allow one
    application to exchange data with another application using extensible industry
    standard protocols based on XML. This is illustrated in *Figure 1.8*.


    ![](img/5f6ba170efa3a607142589708531bef8_39_0.png)


    Figure 1.8 – How an example Web service works


    In the figure, let’s say the left side represents the system of a fictitious airline,
    Air Atlantis which is using DB2 on Linux, and stores its flight information in
    XML format in the DB2 database. On the right side we have a system from another
    fictitious airline, Air Discovery which is using SQL Server running on Windows.
    Now let’s say that Air Atlantis and Air Discovery sign a partnership agreement
    where the two companies want to share scheduling and pricing information in order
    to coordinate their flights. Sharing information between the two may be a challenge
    given that the two companies are using different operating systems (Linux, Windows),
    and different data servers (DB2, SQL Server). When Air Atlantis changes its flight
    schedule for a trip going from Toronto to Beijing, how can Air Discovery automatically
    adjust its own flight schedule for a connecting flight from Beijing to Shanghai?
    The answer lies on Web services. Air Atlantis can expose some of its flight information
    by creating a *Data Web service* that returns the output of a stored procedure'
  merge: -1
  img_proc: true
- pgno: 40
  md: '(the **getFlightInfo** stored procedure) with flight information from the DB2
    database. A *Data* Web service is a Web service based on database information.
    When this Data Web service is deployed to an application server such as WebSphere
    Application Server, then a client or partner like Air Discovery can use a browser
    to access Air Atlantis'' flight information very easily. In this example, Air
    Atlantis behaves as the Web service provider as it developed and made available
    the Web service, while Air Discovery behaves as the Web service consumer since
    it consumes or uses the Web service.


    Air Discovery can also invoke the Web service from its own JDBC application so
    that it can perform calculations that use data from its SQL Server database. For
    example, if a flight from Toronto to Beijing takes an average of 12 hours, Air
    Discovery can compute the connecting flight from Beijing to Shanghai by adding
    the departure time the Air Atlantis flight left Toronto, and adding the flight
    duration plus a few buffer hours. The amount of hours to use as buffer may be
    stored in the SQL Server database at Air Discovery''s system, and the simple equation
    to use in the JDBC application would look like this:


    ![](img/5f6ba170efa3a607142589708531bef8_40_0.png)


    If Air Atlantis changes its flight departure time, this information is automatically
    communicated to the Air Discovery system when it invokes the Web service.


    # ## 1.6 Administrative APIs


    DB2 software ("DB2") provides a large amount of administrative APIs that developers
    can use to build their own utilities or tools. For example, to create a database
    you can invoke the *sqlcrea API*; to start an instance, use the *db2lInstanceStart
    API*; or to import data into a table, use the *db2lImport API*. The complete list
    is available from the DB2 Information Center. See the *Resources* section for
    the DB2 Information Center URL.


    # ## 1.7 Development tools


    Microsoft Visual Studio and Eclipse are two of the most popular Integrated Development
    Environments (IDEs) used by developers today. Both IDEs work well with DB2 software
    ("DB2").


    Some users of DB2 also interact with third party products such as MS Excel and
    MS Access to create simple forms that connect to DB2. In this section we describe
    how to work with these products and DB2 Express-C.


    DB2 Express-C is available also on Mac OS X, so you can use DB2 natively to develop
    database applications on a Mac. This may be especially appealing to the RoR community
    who has embraced the Mac platform.'
