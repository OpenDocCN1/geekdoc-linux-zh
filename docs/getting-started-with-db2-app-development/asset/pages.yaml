  md: '# 3


    # Chapter 3 – Stored procedures, UDFs, triggers, and data Web services


    This chapter focuses on data server-side development using stored procedures,
    user-defined functions (UDFs) and triggers.


    A stored procedure is a database application object that can encapsulate SQL statements
    and business logic. Keeping part of the application logic in the database provides
    performance improvements as the amount of network traffic between the application
    and the database is considerably reduced. In addition, stored procedures provide
    a centralized location to store your code, so other applications can reuse the
    same stored procedures.


    A UDF allows you to extend the SQL language and encapsulate your business logic.


    Triggers are database objects that allow database administrators to have the data
    server automatically verify the validity of data before insertion, or to audit
    data after it has been modified.


    Data Web services externalize information from a DB2 database by converting SQL
    scripts or stored procedures into a Web service. This provides a flexible, inexpensive,
    and convenient solution to companies that need to share information stored in
    their databases.


    In this chapter you will learn about:


    +   - The basics of SQL PL and Java stored procedures

    +   - Developing User-defined functions

    +   - Creating Data Web Services

    +   - Working with IBM Data Studio

    +   - Creating BEFORE, AFTER and INSTEAD OF triggers.


    # 3.1 Stored procedures: The big picture


    DB2 stored procedures can be written using SQL PL (SQL Procedural Language), C/C++,
    Java, COBOL, CLR (Common Language Runtime) supported languages, and OLE. In this
    chapter, we focus on SQL PL procedures because of their popularity, good performance'
  merge: -1
  img_proc: true
