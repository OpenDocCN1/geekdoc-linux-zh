- pgno: 337
  md: '![](img/5f6ba170efa3a607142589708531bef8_337_0.png)


    Figure 10.1- High level view of Python DB2 APIs and drivers/adapters to access
    DB2


    As shown in Figure 10.1, there are four different types of database APIs and their
    drivers/adapters you can choose in a Python application to access a DB2 data server.
    The APIs and their drivers/adapters are explained in the next sections.


    # 10.1.1 IBM defined API and ibm_db driver


    This is a set of proprietary Python database APIs defined by IBM. The ibm_db driver
    is an implementation of the API. Through this API, you can not only issue SQL
    statements, call stored procedures, and use pureXML, but also access DB2 metadata
    information in a Python application.


    The ibm_db driver is implemented as a Python module C extension to DB2’s native
    CLI/ODBC interface; therefore, it can provide maximum performance and most advanced
    features. In later sections, we discuss about this driver in more detail.


    **Note:**


    The ibm_db API specification can be found at [http://code.google.com/p/ibm-db/wiki/APIs](http://code.google.com/p/ibm-db/wiki/APIs).


    # 10.1.2 Python Database API and ibm_db_dbi driver


    Python Database API is a set of open standard database APIs defined for a Python
    application. The ibm_db_dbi driver is simply a Python coded wrapper built upon
    the ibm_db driver to provide database APIs conforming to the standard Python Database
    API Specification, and similarly to ibm_db driver it enables you to issue SQL
    statements and call stored procedures through these standard APIs. Because this
    API conforms to the standard specification, it does not offer some of the advanced
    features that the ibm_db API supports. However, if you have an application written
    with a driver that supports Python Database API Specification, you can easily
    switch to ibm_db_dbi.


    At the time of this writing, Python Database API Specification v2.0 is supported
    by ibm_db_dbi driver.


    **Note:**'
  merge: -1
  img_proc: true
