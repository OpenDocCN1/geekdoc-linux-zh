  md: "bound, it is assigned to memory, and the prepared statement is now populated\
    \ with those values, which were not given during the **db2\\_prepare**. You can\
    \ assign the value of the parameter in PHP after the binding also. *Listing 8.6*\
    \ shows an example of preparing, binding with two parameter markers (one of which\
    \ is an integer, and the other is a character), and executing a statement.\n\n\
    ```\n```php\n<?php\n$database = 'sample';\n$user = '';\n$password = '';\n$conn\
    \ = db2_connect($database, $user, $password);\nif ($conn) {\n  $statement = 'SELECT\
    \ c_id, c_name, c_email FROM db2inst1.customer\n                WHERE c_id > ?\
    \ OR c_name NOT LIKE ?';\n  // prepare the SQL statement\n  $stmt = db2_prepare($conn,\
    \ $statement);\n  $id = 100;\n  (1) db2_bind_param($stmt, 1, \"id\", DB2_PARAM_IN);\n\
    \      db2_bind_param($stmt, 2, \"name\", DB2_PARAM_IN, DB2_CHAR);\n  $name =\
    \ 'MyName';\n  $result = db2_execute($stmt);\n  (2) while ($object = db2_fetch_object($stmt))\
    \ {\n       // Iterate through results\n       echo 'ID: ' . $object->C_ID;\n\
    \       echo 'Name: ' . $object->C_NAME;\n       echo 'Email: ' . $object->C_EMAIL;\n\
    \  }\n  if (!$result) {\n     (3) db2_rollback($conn);\n       echo 'Execution\
    \ failed. ';\n       echo 'SQLSTATE value: ' . db2_stmt_error();\n       echo\
    \ 'with Message: ' . db2_stmt_errormsg();\n  }\n  db2_free_stmt($stmt);\n  db2_close($conn);\n\
    } else {\n  echo 'Connection to database failed.';\n  echo 'SQLSTATE value: '\
    \ . db2_conn_error();\n  echo 'with Message: ' . db2_conn_errormsg();\n}\n?>\n\
    ```\n```\n\n# **Listing 8.6** – Preparing, binding, and executing SQL statements\n\
    \nIn the above listing:"
