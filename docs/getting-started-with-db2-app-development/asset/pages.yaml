    # 10.3.4 Execute a SQL statement with parameter markers


    In previous two sections, you have learned how to use function ibm_db.exec_immedate
    to execute SQL statements which is known at application written time. Now let''s
    examine how to run a SQL statement which might contain variable inputs whose values
    are not known until at the run time.


    The question mark (?) character will be used as the parameter marker for each
    variable input in the SQL statement string. The procedure to prepare and execute
    such SQL statements is explained below:


    +   1.  Connect to the database with the ibm_db.connect function, which returns
    a database connection object if connection is successful.

    +   2.  Prepare the SQL string with the parameter markers using the ibm_db.prepare
    function, which returns a IBM_DBStatement statement object if the prepare attempt
    is successful.


    The syntax of function ibm_db.prepare is:


    ```

    IBM_DBStatement ibm_db.prepare( IBM_DBConnection connection, string statement
    [, array options])

    ```


    Table 10.4 describes the parameters of the function ibm_db.prepare


    | Name | Description |

    | :--- | :--- |

    | connection | A valid database connection object returned from ibm_db.connect()
    |

    | Statement | An SQL statement in string format, which may optionally contain
    input/output parameter markers, whose values are not known until the SQL is run.
    |

    | options | Optional: A dictionary containing statement options. You can use this
    parameter to request a scrollable cursor for database servers that support this
    type of cursor. By default, a forward-only cursor is returned. |


    Table 10.4 - Parameters of the function ibm_db.prepare'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'The function returns a statement object if the SQL is successfully prepared,
    otherwise it raises an exception.


    For example, you can prepare a **SELECT** statement containing a parameter marker
    as follows:


    ```

    stmt = ibm_db.prepare(conn, "SELECT empno, lastname, job, salary FROM employee
    WHERE workdept = ?")

    ```


    As shown above, the connection object **conn** is passed in as the first function
    argument, while the second argument is a **SELECT** string which contains a parameter
    marker in the predicate "workdept = ?", where the parameter marker "?" represents
    a variable input for a department number that is not known until the SQL is run.
    If the function **ibm_db.prepare** successfully prepares the SQL statement, it
    returns a statement object and assigns it to the variable *stmt*.


    +   3. Bind input values to parameter markers in the SQL by calling the **ibm_db.bind_param**
    function for each parameter marker.


    The syntax of function **ibm_db.bind_param** is:


    ```

    Py_True/Py_None ibm_db.bind_param(IBM_DBStatement stmt, int

    parameter-number, string variable [, int parameter-type [, int data-

    type [, int precision [, int scale [, int size()]]]]]])

    ```


    *Table 10.5* describes the parameters of function **ibm_db.bind_param**


    | Name | Description |

    | --- | --- |

    | stmt | A prepared statement returned from **ibm_db.prepare()** |

    | Parameter-number | Specifies the 1-indexed position of the parameter in the
    prepared statement. |

    | variable | A Python variable to be bound to the parameter specified by parameter-number
    |

    | Parameter-type | Optional: The type of the parameter marker. It can be an input
    parameter (SQL_PARAM_INPUT), an output parameter (SQL_PARAM_OUTPUT), or as a parameter
    that accepts input and returns output (SQL_PARAM_INPUT_OUTPUT). To avoid memory
    overhead, you can also specify PARAM_FILE to bind the Python variable to the name
    of a file that contains large object (BLOB, CLOB, or DB2_DBCLOB) data. By default,
    it’s SQL_PARAM_INPUT. |

    | data-type | Optional: A constant specifying the SQL data type that the Python
    variable should be bound as: one of SQL_BINARY, DB2_CHAR, DB2_DOUBLE, or DB2_LONG
    |

    | precision | Optional: Specifies the precision that the variable should be bound
    to the database. |'
