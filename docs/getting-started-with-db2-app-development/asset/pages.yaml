- pgno: 73
  md: "# **2.3.8 Update and delete operations**\n\nUpdate and delete operations on\
    \ XML data can be performed in one of two ways:\n\n+   * Using SQL UPDATE and\
    \ DELETE statements\n+   * Using the TRANSFORM expression\n\nFor the first way\
    \ using SQL UPDATE and DELETE statements, the update or delete occurs at the document\
    \ level: that is, the entire XML document is replaced with the updated one. For\
    \ example, in the UPDATE statement in Listing 2.25 below, if you’d only like to\
    \ change the `<state>` element, the entire XML document is actually replaced.\n\
    \n```\nUPDATE clients SET contact=(\n        xmlparse(document\n        '<Client>'\n\
    \            '<address>'\n            '<street>5401 Julio ave.</street>'\n   \
    \         '<city>San Jose</city>'\n            '<state>CA</state>'\n         \
    \   '<zip>95116</zip>'\n            '</address>'\n            '<phone>'\n    \
    \        '<work>4084633000</work>'\n            '<home>4081111111</home>'\n  \
    \          '<cell>4082222222</cell>'\n            '</phone>'\n            '<fax>4087776666</fax>'\n\
    \            '<email>newemail@someplace.com</email>'\n        '</Client>')\n \
    \   )\n    WHERE id = 3227\n```\n\n# **Listing 2.25 - An example of an SQL UPDATE**\n\
    \nFor the second way, you can perform sub-document updates using the TRANSFORM\
    \ expression, which is a lot more efficient. This allows you to replace, insert,\
    \ delete or rename nodes in an XML document. You can also change the value of\
    \ a node without replacing the node itself, typically to change an element or\
    \ attribute value–which is a very common type of update. This support was added\
    \ in DB2 9.5.\n\nThe TRANSFORM expression is part of the XQuery language, you\
    \ can use it anywhere you normally use XQuery, for example in a FLWOR expression\
    \ or in the XMLQUERY function in an SQL/XML statement. The most typical use is\
    \ in an SQL UPDATE statement to modify an XML document in an XML column.\n\nListing\
    \ 2.26 shows the syntax of the TRANSFORM expression.\n\n```\n>>-transform--| copy\
    \ clause |--| modify clause |--| return clause -->\n```"
  merge: -1
  img_proc: true
- pgno: 74
  md: "```\n```\ncopy clause\n\n.\n-----------------------------\n       V\n|--copy---$VariableName-:=--CopySourceExpression--|\n\
    \nmodify clause\n\n|--modify--ModifyExpression--------------------|\n\nreturn\
    \ clause\n\n|--return--ReturnExpression--------------------|\n```\n```\n\n# Listing\
    \ 2.26 - The syntax of the TRANSFORM expression\n\nThe copy clause is used to\
    \ assign to a variable the XML documents you want to process.\n\nIn the modify\
    \ clause, you can invoke an insert, delete, rename, or replace expression. These\
    \ expressions allow you to perform updates to your XML document.\n\nFor example:\n\
    \n+   - If you want to add new nodes to the document, you would use the insert\
    \ expression\n+   - To delete nodes from an XML document, use the delete expression\n\
    +   - To rename an element or attribute in the XML document, use the rename expression\n\
    +   - To replace an existing node with a new node or sequence of nodes, use the\
    \ replace expression. The replace value of the expression can only be used to\
    \ change the value of an element or attribute.\n\nThe return clause returns the\
    \ result of the transform expression.\n\n*Listing 2.27* shows an example of an\
    \ UPDATE statement using the TRANSFORM expression.\n\n```\n```\n(1)-- UPDATE customers\n\
    (2)-- SET contactinfo = xmlquery( 'declare default element namespace\n(3)--  \
    \                        \"http://posample.org\";\n(4)--                     transform\n\
    (5)--          copy $newinfo := $c\n(6)--                 modify do insert <email2>my2email.gm.com</email2>\n\
    (7)--                      as last into $newinfo/customerinfo\n(8)--         \
    \ return $newinfo' passing contactinfo as \"c\")\n```\n```"
  merge: -1
