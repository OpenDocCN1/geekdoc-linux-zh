    **Figure 6.1 - .NET with DB2 applications**


    The figure depicts a .NET application accessing a DB2 database through a .NET
    data provider supplied with DB2. For disconnected access, it needs to go through
    a DataSet object.


    # ## 6.2 The ADO.NET data architecture


    Data Access in ADO.NET relies on two components: DataSet and Data Provider.


    +   - DataSet


    The dataset is a disconnected, in-memory representation of data. It can be considered
    as a local copy of the relevant portions of the database. The DataSet is persisted
    in memory and the data in it can be manipulated and updated independently of the
    database. When the use of a DataSet is finished, changes can be made back to the
    central database for updating. The data in DataSet can be loaded from any valid
    data source like DB2.


    +   - Data Provider


    The Data Provider is responsible for providing and maintaining the connection
    to the database. A Data Provider is a set of related components that work together
    to provide data in an efficient and performance driven manner. Each Data Provider
    consists of the following component classes:


    +   - The `Connection` object which provides a connection to the database


    +   - The `Command` object which is used to execute a command


    +   - The `DataReader` object which provides a forward-only, read only, connected
    recordset


    +   - The `DataAdapter` object which populates a disconnected DataSet with data
    and performs update'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Figure 6.2 below shows the relationship between the different ADO.NET objects.
