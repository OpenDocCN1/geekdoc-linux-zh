    # 5.5 Developing a C/C++ application with ODBC/CLI


    In section 1.3.3 you were introduced to ODBC/CLI development. In this chapter
    we discuss this subject again, but in more detail. DB2 Call Level Interface (DB2
    CLI) is IBM''s callable SQL interface to the DB2 family of database servers. It
    is a C and C++ application programming interface for relational database access
    that uses function calls to pass dynamic SQL statements as function arguments.
    DB2 CLI is based on the Microsoft Open Database Connectivity (ODBC) specification
    and the International Standard for SQL/CLI. The DB2 CLI driver is included with
    all DB2 servers and several clients as discussed in section 1.3.3. It behaves
    as the ODBC driver for ODBC applications connecting to DB2.


    ODBC is an alternative to embedded dynamic SQL, but unlike embedded SQL, it does
    not require host variables or a precompiler. The main advantage of an ODBC application
    over'
