    } catch (PDOException $exp) {\n    print_r($sth->errorInfo());\n    echo 'Exception:\
    \ ' . $exp->getMessage();\n}\n```\n\n# Listing 8.30 – Using scrollable cursors\n\
    \n# Using fetch into objects\n\nYou can fetch the data directly into objects by\
    \ providing the constants `PDO::FETCH_LAZY`, and `PDO::FETCH_OBJ`. In `PDO::FETCH_LAZY`,\
    \ the object variable name that is used to access the columns is made as they\
    \ are accessed. We can refer to the columns both by column names or the respective\
    \ positions. Listing 8.31 provides an example.\n\n```\nwhile ($row = $sth->fetch(PDO::FETCH_LAZY))\
