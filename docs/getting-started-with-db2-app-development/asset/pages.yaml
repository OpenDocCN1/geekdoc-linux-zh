    # **5.3.5.2 Building embedded SQL C/C++ applications using the sample build script**


    To build an embedded C application, the easiest way is to use `bl2app` script
    provided by DB2. The `bl2app` script compiles and links the embedded application.
    The script is located in the `sql1lib/samples/c` directory if the application
    is written in C. If the application is written in C++ the location of the script
    is `sql1lib/samples/cpp`, along with sample utility programs that can be built
    with these files.


    `bl2app` scripts takes up to four parameters, represented inside the script file
    by the variables `$1`, `$2`, `$3`, and `$4`. The parameter, `$1`, specifies the
    name of your source file. Building embedded SQL programs requires a connection
    to the database so three optional parameters are also provided: the second parameter,
    `$2`, specifies the name of the database to which you want to connect; the third
    parameter, `$3`, specifies the user ID for the database, and `$4` specifies the
    password.


    If the program contains embedded SQL, indicated by the `.sqc` extension, then
    the `embprep` script is called to precompile the program, producing a program
    file with a `.c` extension.


    The following example shows how to build and run embedded C applications. To build
    the above sample program `embeddedC.sqc` enter:


    ```

    ```

    bl2app embeddedC

    ```

    ```'
