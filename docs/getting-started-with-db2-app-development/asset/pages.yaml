- pgno: 14
  md: '# Preface


    Keeping your skills current in today’s world is becoming increasingly challenging.
    There are too many new technologies being developed, and little time to learn
    them all. The DB2® on Campus Book Series has been developed to minimize the time
    and effort required to learn many of these new technologies.


    # Who should read this book?


    This book is intended for anyone who works with or intends to develop database
    applications such as application developers, consultants, software architects,
    instructors, and students. It is a good reference as well for database administrators
    (DBAs) and product managers.


    # How is this book structured?


    This book is closely related to the eBook Getting Started with DB2 Express-C;
    it expands the application development chapters covered in that book. In fact,
    Chapter 1 and 2 are taken directly from the application development chapters in
    that book as they provide a good overview of DB2 application development. Chapter
    3 discusses server-side programming such as stored procedures, and functions.
    In this chapter IBM® Data Studio software is used extensively, therefore this
    eBook is also closely related to eBook Getting Started with IBM Data Studio for
    DB2. Starting with Chapter 4 the book describes in detail client-side programming
    for different programming languages such as Java™, C/C++, .NET, Ruby on Rail,
    PHP, Perl, and Python.


    Exercises are provided with most chapters; any input files required are provided
    in the zip file Exercise_Files_DB2_Application_Development.zip accompanying this
    book.


    # A book for the community


    This book was created by the community: a community consisting of university professors,
    students, and professionals (including IBM employees). The online version of this
    book is released to the community at no-charge. Numerous members of the community
    from around the world have participated in developing this book, which will also
    be translated to several languages by the community. If you would like to provide
    feedback, contribute new material, improve existing material, or help with translating
    this book to another language, please send an email of your planned contribution
    to db2univ@ca.ibm.com with the subject “Getting Started with DB2 Application Development
    book feedback.”'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Conventions


    Many examples of commands, SQL statements, and code are included throughout the
    book. Specific keywords are written in uppercase bold. For example: A NULL value
    represents an unknown state. Commands are shown in lowercase bold. For example:
    The dir command lists all files and subdirectories on Windows®. SQL statements
    are shown in upper case bold. For example: Use the SELECT statement to retrieve
    information from a table.


    Object names used in our examples are shown in bold italics. For example: The
    flights table has five columns.


    Italics are also used for variable names in the syntax of a command or statement.
    If the variable name has more than one word, it is joined with an underscore.
    For example: CREATE TABLE table_name


    # What’s next?


    We recommend you to review the following books in this book series for more details
    about related topics:


    +   - Getting started with DB2 Express-C

    +   - Getting started with IBM Data Studio for DB2

    +   - Getting started with Java

    +   - Getting started with C/C++

    +   - Getting started with .NET

    +   - Getting started with Ruby on Rails

    +   - Getting started with PHP

    +   - Getting started with Perl

    +   - Getting started with Python

    +   - Getting started with Open source development

    +   - Getting started with Eclipse


    The following figure shows all the different eBooks in the DB2 on Campus book
    series available for free at ibm.com/db2/books'
  merge: -1
  img_proc: true
