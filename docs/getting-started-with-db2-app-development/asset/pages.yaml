    # 2.6 Summary


    This chapter introduced you to XML and pureXML technology. XML document usage
    is growing exponentially due to Web 2.0 tools and techniques as well as SOA. By
    storing XML documents in a DB2 database you can take advantage of security, performance,
    and coding flexibility using pureXML. pureXML is a technology that allows you
    to store the XML documents in parsed-hierarchical format, as a tree, and this
    is done at database insertion time. At query time, there is no need to parse the
    XML document in order to build a tree before processing. The tree for the XML
    document was already built and stored in the database. In addition, pureXML technology
    uses a native XML engine that understands XQuery; therefore, there is no need
    to map XQuery to SQL which is what is done in other RDBMS products.


    The chapter also talked about how to insert, delete, update and query XML documents
    using SQL/XML and XQuery. It also discussed XML indexes, XML Schema, and other
    features such as compression and XML Schema evolution.


