    +       \n+       You can give a name to the parameter marker with \"\":\" prefixed\
    \ to the name of the parameter. This parameter marker value is bound to the SQL\
    \ to complete and then execute it.\n+   *   Nameless parameter markers\n+    \
    \   \n+       The ? symbol is used in the SQL so that DB2 understands that the\
    \ values for this parameter marker will be bound later.\n\nYou cannot use both\
    \ named and nameless parameter markers in the same statement.\n\nThere are three\
    \ steps involved in preparing and executing an SQL statement:\n\n# ### 1. Preparing\
    \ the SQL statement\n\nThe PDO function PDO::\\*\\*prepare\\*\\* is used to prepare\
    \ an SQL statement with or without parameter markers. In this function, the option\
    \ of selecting which cursor to use is done using the driver option. You can also\
    \ set this option later using the \\*\\*setAttribute\\*\\* method. For example,\
    \ to set the cursor to scrollable while preparing the statement, you can use:\n\
    \n```\n    $sth = $dbh->prepare($sql, array(PDO::ATTR_CURSOR,\n        PDO::CURSOR_SCROLL));\n\
    ```\n\nThe default cursor in PDO\\_IBM/PDO\\_ODBC is forward only. If you have\
    \ set the cursor to scrollable, you change the cursor back to forward only by\
    \ setting the attribute PDO::ATTR\\_CURSOR to PDO::CURSOR\\_FWDONLY.\n\n# ###\
    \ 2. Binding the parameters\n\nThere are two ways to bind parameters of an SQL\
    \ statement:\n\n# **Using the bind function**\n\nYou can use either PDOStatement::\\\
    *\\*bindParam\\*\\* or PDOStatement::\\*\\*bindValue\\*\\*  for this task. These\
    \ two methods can be called for the instance of \\*\\*PDOStatement\\*\\*, which\
    \ we get after preparing the SQL statement using PDO::\\*\\*prepare\\*\\*. We\
    \ need to specify the type of data which is bound using the function. The types\
    \ are:\n\n+   *   •PDO::PARAM\\_INT for integer data type\n+   *   •PDO::PARAM\\\
    _STR for string data type\n+   *   •PDO::PARAM\\_LOB for large objects\n+   *\
    \   •PDO::PARAM\\_NULL for binding a null value"
