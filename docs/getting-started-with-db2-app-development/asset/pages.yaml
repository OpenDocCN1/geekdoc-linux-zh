    # ### 3.7 Data Web services


    Data Web services are web services based on database information. Using IBM Data
    Studio it is very easy to create Data Web services. A web service is like a JEE
    application (formerly known as J2EE); therefore the Web service needs to be deployed
    to an application server. In this book we use **WebSphere Application Server Community
    Edition (WAS CE)** version 2.1 which is a free application server built on top
    of Apache Geronimo. WAS CE can be downloaded from this site:


    http://www.ibm.com/developerworks/downloads/ws/wasce/


    WAS CE has a small footprint, and is very easy to install. Ensure WAS CE is installed
    prior to working with data web services.


    > Note:

    > For more information about WAS CE, refer to the eBook Getting started with WAS
    CE that is part of this DB2 on Campus free book series.


    To create a Data Web Service from Data Studio, open or create a new project, and
    select the **Web Services** folder. Right-click on this folder and choose *New
    Web Service*. Give a name to the Web service, and click on *Finish*. Figure 3.15
    shows the **MyWeb Service** created using the steps just explained.'
