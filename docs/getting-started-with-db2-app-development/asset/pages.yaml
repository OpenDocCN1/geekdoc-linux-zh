  md: '# 7


    # Chapter 7 - Application development with Ruby on Rails


    Ruby is an open source, free, dynamic programming language. Ruby on Rails (RoR),
    or Rails for short is a framework built using Ruby. RoR is based on the Model,
    View and Controller (MVC) architecture. By supporting agile development techniques
    it has enabled many developers to radically reduce the time and pain involved
    in creating Web applications.


    In this chapter you will learn about:


    +   - Ruby on Rails and the MVC architecture

    +       - How to setup Ruby on Rails to work with DB2

    +       - A basic understanding of ways to program RoR applications with DB2

    +       - How to build a simple Ruby on Rails application with DB2


    # ## 7.1 Ruby on Rails applications with DB2: The big picture


    Ruby on Rails is organized around the Model, View, and Controller architecture,
    usually just called MVC. MVC benefits include:


    +   - Isolation of business logic from the user interface

    +   - Making it clear where different types of code belong for easier maintenance


    A Model represents the information (data) of the application and the rules to
    manipulate that data. In the case of Rails, models are primarily used for managing
    the rules of interaction with a corresponding database table. In most cases, one
    table in your database will correspond to one model in your application. The bulk
    of your application’s business logic will be concentrated in the model. Under
    this architecture, DB2 provides data persistence.


    Controllers provide the “glue” between models and views. In Rails, controllers
    are responsible for processing the incoming requests from the Web browser, interrogating
    the models for data, and passing that data on to the views for presentation.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '*Views* represent the user interface of your application. In Rails, views are
    often HTML files with embedded Ruby code that performs tasks related solely to
    the presentation of the data. Views handle the job of providing data to the Web
    browser or other tool that is used to make requests from your application.


    *Figure 7.1* illustrates this architecture.


    ![](img/5f6ba170efa3a607142589708531bef8_249_0.png)


    # Figure 7.1 RoR - DB2 applications: The MVC architecture


    In the above figure, a user invokes the application by starting a Web browser
    and entering the application’s URL as shown in (1). In this particular example,
    we are using RoR’s Web server called WEBrick which is installed on the same server
    (localhost) and listens to port 3000 by default. The URL to invoke the application
    would look like [http://localhost:3000/myapp1](http://localhost:3000/myapp1),
    where *myapp1* represents the name of the controller.


    The incoming request is serviced by the routing module which redirects it to controllers
    and actions as shown in (2). Then the *Controller* interacts with the *Model*
    which processes the request as shown in (3). The *Model* may interact with the
    DB2 database if access to persistent data is required as shown in (4). The *Model*
    reports back to the *Controller* and the *Controller* interacts with the *View*
    (5). Finally, the *View* passes to the browser information to display (6).


    Since RoR applications are object-oriented applications while most commercial
    databases, including DB2, use the relational database model, it is common to use
    *object-relational mapping* (ORM) libraries for these two models to interact.
    *Active Record* is the ORM'
  merge: -1
  img_proc: true
- pgno: 250
  md: "layer supplied with Rails. It closely follows the standard ORM model: tables\
    \ map to classes, rows to objects, and columns to object attributes.\n\nORM makes\
    \ it easier to manage database schema changes. For example, say you built an application\
    \ which among other things displays information of a table. Your customer asks\
    \ you to add a couple of columns, and display them. Though this may seem like\
    \ a simple request, for a large application, this can be quite time consuming,\
    \ and a source of errors. You would need to look for all applicable SQL statements\
    \ that were accessing this table and modify them so they include the new columns.\
    \ This change request could be handled much more easily with \\textbf{ORM}, because\
    \ the mapping between entities in the database and entities in the program is\
    \ included in XML configuration files. Programmers can now conveniently change\
    \ the XML document to add the columns, and the ORM takes care of generating the\
    \ correct SQL for you. This may also be useful to avoid code duplication of using\
    \ the same SQL in different locations in your application. In Active Record (Rails'\
    \ ORM); however, there are no XML configuration files to change.\n\nRails philosophy\
    \ is founded on two main principals:\n\n+   a) \"Do not repeat yourself\" (DRY)\n\
    +   b) \"Convention Over Configuration\" (CoC)\n\nThe DRY principle is based on\
    \ the idea that every piece of knowledge in a system should be expressed in one\
    \ place only. This helps programmers avoid changes in many different parts of\
    \ the application.\n\nThe CoC principle allows programmers to be consistent and\
    \ reduce the amount of code simply by following some conventions. \\textbf{Table\
    \ 7.1} lists some of these conventions and provide examples.\n\n| Convention |\
    \ Example |\n| :--- | :--- |\n| Table names have all lowercase letters and need\
    \ to be plural | books |\n| The model name uses the class naming convention of\
    \ unbroken MixedCase and is always the singular of the table name. In the Ruby\
    \ language the first letter of a class starts in upper case | Book | \n| | Rails\
    \ looks for the class definition in a file called book.rb in the /app/models directory.\
    \ |\n| Controller class names are pluralized | BooksController | \n| | Rails looks\
    \ for the class definition in a file called books\\_controller.rb in the /app/controllers\
    \ directory |\n\nTable 7.1 - Examples of the CoC principle"
  merge: -1
  img_proc: true
