    +   - `pdo_odbc.connection_pooling`


    *Connection pooling* helps database application performance by reusing old connections
    established before. It is especially beneficial when the connections made have
    a short duration. The value of `pdo_odbc.connection_pooling` can be configured
    so as to decide the level of the connection pooling. The different levels are
    listed in *Table 8.1*.


    | Connection pooling level | Description |

    |---|---|

    | Strict | A connection is reused when the connection credentials exactly match
    the connection options of an existing closed connection. We recommend to use this
    option when connection pooling is enabled. |

    | Relaxed | Connections with a matching connection string are reused and not all
    connection attributes are checked. |

    | Off | Connection pooling is not used |


    The following example shows an entry in `php.ini` when the connection pooling
    is set to relaxed:


    ```text

    [PDO connection pooling]

    pdo_ibm.connection_pooling = relaxed

    or

    [PDO connection pooling]

    pdo_odbc.connection_pooling = relaxed

    ```


