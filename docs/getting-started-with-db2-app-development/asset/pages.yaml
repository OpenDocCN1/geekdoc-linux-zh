    # 10.3 Developing Python DB2 applications


    For simplicity purposes, this section focuses only on the **ibm_db** driver, which
    provides the maximum performance and most advanced features support for accessing
    DB2 data servers. For all other drivers or adapters, refer to their API specifications.


    # 10.3.1 Connecting to a DB2 database


    You must first include the following line in your Python script to import the
    **ibm_db** driver module:


    `import ibm_db`


    Then, connect to a DB2 database by calling the function **ibm_db.connect** with
    the following syntax:


    `IBM_DBConnection ibm_db.connect (string dsn, string user, string password[, array
    options])`


    *Table 10.1* explains the parameters of **ibm_db.connect**.


    | Name | Description |

    | :--- | :--- |

    | **dsn** | Database connection string in the format of "**DATABASE=database;
    HOSTNAME=hostname; PORT=port; PROTOCOL=TCPIP; UID=username; PWD=password;**" |

    | **user** | The username used to connect to the database; specify an empty string
    "" if username is specified in the **dsn** string |

    | **password** | The password for the username connecting to the database; specify
    an empty string "" if password is specified in the **dsn** string |

    | **options** | Optional: A dictionary of connection options that affect the behavior
    of the connection. |


    *Table 10.1* - Parameters for function **ibm_db.connect**'
