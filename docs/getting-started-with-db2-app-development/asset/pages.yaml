  md: '![](img/5f6ba170efa3a607142589708531bef8_267_0.png)


    # Figure 7.18 – Contents of the migration file 20100611202808_create_books.rb


    The up method is used when applying the migration to DB2. This defines how the
    table will be created. The down method undoes what up has done. It is executed
    when you want to revert the database to a previous version.


    Earlier we ran the rake db:migrate command to test if the database.yml file was
    configured correctly to connect to the database. What this command actually does
    is not only connect to the database, but also review the contents of migration
    files (if they exist), and apply the required changes. Now that we created a migration
    file 20100611202808_create_books.rb with the scaffold utility, the rake command
    will apply all the migration instructions that have not been applied to the database
    before from this file. In this case, since the books table was not created before,
    it will create it in DB2.


    The db:migrate parameter specified in the command indicates that the required
    commands and SQL statements should be generated and passed to DB2. Figure 7.19
    shows the output of this command.


    ![](img/5f6ba170efa3a607142589708531bef8_267_1.png)


