    ```\n\n# 5.5.3.2 Allocate environment handle\n\nAllocation of different handles\
    \ can be done using `SQLAllocHandle` API. `SQLAllocHandle()` is a generic function\
    \ that allocates environment, connection, statement, or descriptor handles.\n\n\
    > **Note:**\n> \n> This function replaces the deprecated functions `SQLAllocConnect()`,\
    \ `SQLAllocEnv()`, and `SQLAllocStmt()`. For a complete list of CLI and ODBC functions,\
    \ review this link http://public.boulder.ibm.com/infocenter/db2luw/v9r7/topic/com.ibm.db2.luw.apdv.cli.doc/doc/r0000553.html\n\
    \nListing 5.14 shows the syntax of `SQLAllocHandle` API\n\n```\nSQLRETURN  SQLAllocHandle(\n\
    \             SQLSMALLINT    HandleType,\n             SQLHANDLE      InputHandle,\n\
    \             SQLHANDLE      *OutputHandlePtr);\n\nListing 5.14 - Syntax of `SQLAllocHandle`\
    \ function\n```\n\nFunction `SQLAllocHandle` takes as arguments the type of handle\
    \ (environment, connection, statement, or descriptor), the input handle and the\
    \ output handle. To allocate an environment handle the value of `HandleType` must\
    \ be `SQL_HANDLE_ENV`. If the handle type is `SQL_HANDLE_ENV` the value of `InputHandle`\
    \ will be `SQL_NULL_HANDLE`. `OutputHandlePtr` will be a pointer to a buffer in\
    \ which to return the handle to the newly"
