    # 1.3.4 JDBC, SQLJ and pureQuery


    Java Database Connectivity (JDBC) is a Java programming API that standardizes
    the means to work and access databases. In JDBC the code is easily portable between
    several RDBMS vendors. The only changes required to the code are normally which
    JDBC driver to load and the connection string. JDBC uses only dynamic SQL and
    it is very popular.


    SQLJ is the standard for embedding SQL in Java programs. It is mainly used with
    static SQL, though it can inter-operate with JDBC as shown in Figure 1.7. Though
    it is normally more compact than JDBC programs and provides better performance,
    it has not been'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'widely accepted. SQLJ programs must be run through a preprocessor (the SQLJ
    translator) before they can be compiled.


    ![](img/5f6ba170efa3a607142589708531bef8_33_0.png)


    Figure 1.7 - Relationship between SQLJ and JDBC applications


    In Figure 1.7, a DB2 client may or may not be required depending on the type of
    JDBC driver used as discussed later on this section.


    pureQuery is an IBM Eclipse-based plug-in to manage relational data as objects.
    Available since 2007, pureQuery can automatically generate the code to establish
    an object-relational mapping (ORM) between your object oriented code and the relational
    database objects. You start by creating a Java project with Optim™ Development
    Studio (ODS), connect to a DB2 database, and then have ODS discover all the database
    objects. Through the ODS GUI you can pick a table and then choose to generate
    the pureQuery code which would transform any of the underlying relational table
    entities into a Java object. Code is generated to create the relevant SQL statements
    and parent Java objects that encapsulate those statements. The generated Java
    objects and the contained SQL statements can be further customized. With pureQuery,
    you can decide at runtime whether you want to run your SQL in static or dynamic
    mode. pureQuery supports both Java and .NET.


    # 1.3.4.1 JDBC and SQLJ drivers


    Though there are several types of JDBC drivers such as type 1, 2, 3 and 4; type
    1 and 3 are not commonly used, and DB2’s support of these types has been deprecated.
    For type 2, there are two drivers as we will describe shortly, but one of them
    is also deprecated.


    Type 2 and type 4 are supported with DB2 software, as shown in Table 1.2. Type
    2 drivers need to have a DB2 client installed, as the driver uses it to establish
    communication to the database. Type 4 is a pure Java client, so there is no need
    for a DB2 client, but the driver must be installed on the machine where the JDBC
