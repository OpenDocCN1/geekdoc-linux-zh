    # 5.3.4.4.2 Retrieving data from a table


    Retrieval of data is done by using a SELECT statement. If the SELECT statement
    will return a single row, use the INTO clause (SELECT INTO) so the results are
    stored directly into host variables specified.


    If the SELECT returns more than one row, you must use a *cursor* to fetch them
    one at a time. A cursor is a named control structure used by an application program
    to point to a specific row within an ordered set of rows. The steps involved to
    work with a cursor are:


    +   1. Declare the cursor using a DECLARE CURSOR statement.

    +   2. Open the cursor using the OPEN statement.

    +   3. Retrieve rows one at a time using the FETCH statement.

    +   4. Terminate the cursor using the CLOSE statement.


