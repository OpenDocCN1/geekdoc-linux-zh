    \  OPTS=\"\"\n  MOUNTPT=\"mem1\"\nesac\n```\n\n## 4.72 使用闪存卡\n\n以下信息仅适用于所谓的“线性闪存”内存卡。许多闪存卡（包括\
    \ SmartMedia 和 CompactFlash）实际上包含了模拟 IDE 设备的电路。这些卡片被作为 IDE 设备处理，而不是内存卡。\n\n闪存卡有两种主要格式：FTL（闪存转换层）风格和微软闪文件系统（FFS）。FTL\
    \ 通常更灵活，因为它允许在闪存卡上像使用普通磁盘设备一样使用任何高级文件系统（ext2, ms-dos 等）。FFS 是一种完全不同的文件系统。Linux\
    \ 原生无法处理格式化为 FFS 的卡片。要将内存卡作为普通磁盘设备使用，首先使用 ftl_format 命令在设备上创建 FTL。此层隐藏了闪存内存编程的设备细节，并使卡片看起来像简单的块设备。例如：\n\
