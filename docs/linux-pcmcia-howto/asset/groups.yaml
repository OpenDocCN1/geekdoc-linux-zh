  - '[PAGE 3]


    # 1. General information and hardware requirements


    # 1 General information and hardware requirements


    # 1.1 Introduction


    Card Services for Linux is a complete PCMCIA or "PC Card" support package. It
    includes a set of loadable kernel modules that implement a version of the Card
    Services applications program interface, a set of client drivers for service cards,
    and a card manager daemon that can respond to insert and removal events, loading
    and unloading drivers. It supports "hot swapping" of most card types, so cards
    can be safely inserted and ejected at any time.


    This software is a work in progress. It contains bugs, and should be used with
    caution. I''ll do my best to fix problems that are reported to me, but if you
    don''t tell me, I may never know. If you use this code, I hope you will see my
    experiences, good or bad!


    If you have any suggestions for how this document could be improved, please let
    me know (dahinds@users.sourceforge.net).


    # 1.2 Copyright notice and disclaimer


    Copyright (c) 1998-2002 David A. Minds


    This document may be reproduced or distributed in any form without your prior
    permission. Modified versions of this document, including translations into other
    languages, may be freely distributed, provided that they are clearly identified
    as such, and this copyright is included intact.


    This document may be included in commercial distributions without my prior consent.
    While it is not required, I would like to be informed of such use. If you intend
    to incorporate this document in a published work, please contact me to make sure
    you have the latest version.


    This document is provided "AS IS", with no express or implied warranties. The
    information in this document at your own risk.


    # 1.3 What is the latest version, and where can I get it?


    The current major release of Card Services is version 3.2, and minor updates or
    bug fixes are numbered 3.2.1, 3.2.2, and so on.


    Source code for the latest version is available on the web at http://pcmia-cs.sourceforge.net,
    pcmia-cs-3.2.tar.gg. You may find more than one release number. Here. It is up
    to you to decide which version is more appropriate, but the CHANGES file will
    summarize the most important differences.


    Pre-compiled drivers are included with releases of essentially all major Linux
    distributions, including Slackware, Debian, Red Hat, Caldera, and SuSE, among
    others. Generally there is no need to compile the drivers from scratch


    # 1.4 What systems are supported?


    This package should run on some Intel-based Linux-capable laptop. It also runs
    on some Alpha, PowerPC, ARM, and MIPS platforms. Most common socket controllers
    are supported. Card docks for desktop systems should work as long as they use
    a supported controller, and are plugged directly into the ISA or PCI bus,'
  - '[PAGE 4]


    # General information and hardware requirements


    as opposed to SCSI-to-PCIA or IDE-to-PCIA adapters. The following controllers
    are recognized by the supplied socket drivers:


    +   * Cirrus Logic (now Basis Communications) PD6710, PD6270, PD6272, PD6729,
    PD6730, PD6832

    * ENE Technology CB1211, CB1225, CB1410, CB1420

    * Intel 182365s B, C, and DF steps, 82092AA

    * O2Micro O6729, O6730, O6812, O6832, O6833, O6836, O6860, O6922, O6933, O6912

    * Omega Micro 82C365G, 82C092G

    * Ricoh RF5296, RF3596, RL5C65, RL546, RL5C45, RL5C46, RL5C47, RL5C48

    * SMC 34C90

    * Texas Instruments PCI1031, PCI1130, PCI1131, PCI1210, PCI1211, PCI1220, PCI1221,
    PCI1225, PCI1250A, PCI1251A, PCI1251B, PCI1410, PCI1410A, PCI1420, PCI1450, PCI1451A,
    PCI1510, PCI1520, PCI1620, PCI1410, PCI1410A, PCI4451, PCI4451, PCI4510, PCI4520,
    PCI7410, PCI7510, PCI7610

    * Tohiba ToPIC95, ToPIC97, ToPIC100 (experimental, incomplete)

    * Vadem VG465, VG468, VG469

    * VLSI Technologies 82C146, VCF94365

    * VIA VT83C469

    * Database DB86082, DB86082A, DB86084, DB86084A, DB86072, DB86082B


    Other controllers that register compatible with the Intel i82365s will generally
    work well, as

    Due the rapid pace of technological change for laptop hardware, new controllers
    appear frequently, and there may be delays when a new model appears on the market,
    and when driver becomes available.


    Support for Toshiba''s ToPIC chips was hindered for a long time by a lack of sufficiently
    detailed documentation. While some datas have been available, few idiosyncrasies
    of the ToPIC chips were not explained. Toshiba has given some technical help on
    some of these issues, and I think the major ones have been resolved. However,
    with the introduction of kernel PCMC support in 2.4* and later kernels, some bugs
    may have cropped up in the new socket driver code.


    The Motorola 6AHC05GA controller used in Hyundai laptops is not supported. The
    custom host controller in the HP Omnibook 600 is also unsupported.


    # What cards are supported?


    The current release includes drivers for a variety of ethernet cards, a driver
    for modern and serial port cards, SCSI adapter drivers, a driver for ATA/IDE drive
    and memory card drivers that should support SRAM cards and some flash cards. The
    SUPPORTED.CARDS file with each release of Card Services lists all cards that are
    known to work in at least one actual system.'
