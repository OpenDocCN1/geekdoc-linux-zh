- raw:
  - "[PAGE 54]\n\n# 7. Debugging tips and programming information\n\n# 7.5 Writing\
    \ Card Services for new cards\n\nThe Linux PCMCIA Programmer's Guide is the best\
    \ documentation for the client driver interface. The latest version is always\
    \ available from projects.sourceforge.net in /pub/pcmia-cs/doc, or on the web\
    \ at <http://pcmia-cs.sourceforge.net>.\n\nFor devices that are close to relatives\
    \ of normal ISA devices, you will probably be able to use parts of existing Linux\
    \ drivers. In some cases, the biggest struggle will be modifying an existing driver\
    \ so that it can handle adding and removing devices after boot time. Of the current\
    \ drivers, the memory card driver is the \"self-contained\" driver that does not\
    \ depend on other parts of the Linux kernel to do most of the dirty work.\n\n\
    In many cases, the largest barrier to supporting a new card is obtaining technical\
    \ information from the manufacturer. It may be difficult to figure out who to\
    \ ask, or to explain what information is needed. However, with a few exceptions,\
    \ it is very difficult if not impossible to implement a driver for a card without\
    \ technical information from the manufacturer.\n\nI have written a dummy driver\
    \ with lots of comments that explains of how a driver communicates with Card Services;\
    \ you will find this in the PCMCIA source distribution in clients/dummy_cs.cs.\n\
    \n# 7.6 Guidelines for PCMCIA client driver authors\n\nI have decided that it\
    \ is not really feasible for me to distribute all PCMCIA client drivers as part\
    \ of the PCMCIA package. Each new driver makes the main package incrementally\
    \ harder to maintain, and including a driver inevitably shifts some of the maintenance\
    \ work from the author to me. Instead, I will decide on case by case whether or\
    \ not to include contributed drivers, based on user demand as well as maintainability.\
    \ For drivers not included in the core package, I suggest that authors adopt the\
    \ following scheme for packaging their drivers for distribution.\n\nDriver files\
    \ should be arranged in the same directory scheme used in the PCMCIA source distribution,\
    \ so that the driver can be unpacked on top of a complete PCMCIA source tree.\
    \ A driver should include source files (in /modules/), a main page (in /main/),\
    \ and files (in /etc/). The top level directory should also include a README file.\n\
    \nThe top-level directory should include a Makefile, set up so that \"make -f\
    \ all\" and \"make -f install\" compile the driver and install all appropriate\
    \ files. If this Makefile is given an extension of .mk, then it will be invoked\
    \ by the top-level Makefile for all and install targets. Here is an example of\
    \ how such a Makefile could be constructed:\n\n```\n# Sample Makefile for contributed\
    \ client driver\nFILES = sample_cs.mk README.sample_cs \\\nmodules/sample_cs.c\
    \ modules/sample_cs.h \\\netc/sample_cs.conf etc/sample_cs.opts \\\nman/sample_cs.4\n\
    \nall:\ninstall:\n\t$(MAKE) -C modules MODULES=sample_cs.o\n\t$(MAKE) -C install-modules\
    \ MODULES=sample_cs.o\n\t$(MAKE) -C etc install-clients CLIENTS=sample\n\t$(MAKE)\
    \ -C man install-man-4 MAN4=sample_cs.4\n```\n\ndist:"
  - '[PAGE 55]


    # 7. Debugging tips and programming information


    ```

    tar czvf sample_cs.tar.gz $(FILES)

    ```


    This makefile uses install targets in 2.9.10 and later versions of the PCMCIA
    package. This makefile also includes a "dist" target for the convenience of the
    author. You would probably want to add a version number to the final package filename
    (for example, sample_cs-1.5.tar.gz). A complete distribution could like:


    ```

    sample_cs.nk

    README.sample_cs

    modules/sample_cs.c

    modules/sample_cs.h

    etc/sample.conf

    etc/sample

    etc/sample.opts

    man/sample_cs.4

    ```


    With this arrangement, when the contributed driver is unpacked, it becomes part
    of the PCMCIA source tree. It can make use of the PCMCIA header files, as well
    as the machinery for checking the user''s system configuration, and automatic
    dependency checking, just like a "normal" client driver.


    In this example, /etc/sample and /etc/sample.opts would be the new driver''s configuration
    scripts (if needed), and /etc/sample.conf would contain any additions to the PCMCIA
    card configuration file. Starting with the 3.1.6 release, cmdrgr will automatically
    process *.conf files installed in /etc/pcmcia, so installation of contributed
    drivers should no longer require hand editing configuration files.


    I will accept client drivers prepared according to this specification and place
    them in the /pub/pcmcia-cs directory on projects.sourceforge.net. The README in
    this directory will describe how to unpack a uncontributed driver.


    The client driver interface has not changed much over time, and has always preserved
    backwards compatibility. A client driver will not need to be updated for minor
    revisions in the main package. I will try to notify authors of contributed drivers
    of changes that require updates to their drivers.


    # 7.7 Guidelines for Linux distribution maintainers


    If you have system configuration tools that you would like to be PCMCIA-aware,
    please use the *.opts files in /etc/pcmcia which will not be modified if a user
    compiles and installs a new release of the PCMCIA package. If you modify the configuration
    scripts, a fresh install will silently overwrite your custom scripts and break
    the connection with your configuration tools. Contact me if you are not sure how
    to write an appropriate option script, or if you need additional capabilities.


    It is helpful for you (and for me) if you can document your distribution deviates
    from the PCMCIA package as described in this document. In particular, document
    changes to the startup script and configuration scripts. If you send me the appropriate
    information, I will include it in 2.6 (Notes about specific distributions).


    When building PCMCIA for distribution, consider including contributed drivers
    that are not part of the PCMCIA package. For reasons of maintainability, I am
    trying to limit the core package size, by only adding new drivers if I think they
    are of particularly broad interest. Other drivers will be distributed separately,
    as described in the previous section. The split between integral and separate
    drivers is somewhat arbitrary and partly historical, and should not imply a difference
    in quality.'
