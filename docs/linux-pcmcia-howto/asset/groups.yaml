    "cardctl suspend" 和 "cardctl resume" 命令用于在不加载驱动程序的情况下关闭卡设备。"cardctl reset" 命令尝试重置并配置卡设备。"cardctl
    insert" 和 "cardctl eject" 模拟物理插入或拔出卡片时执行的操作，包括加载或卸载驱动程序，以及配置或关闭设备。


    如果你正在运行 X，`cardinfo` 工具除了 "cardctl config" 外，还提供了显示 PCMCIA 插槽当前状态的图形化显示。它还提供了一个监控
    cardctl 功能的图形界面。


    ## 4.1. 插入和拔出卡片


    理论上讲，你可以随时插入和移除 PCMCIA 卡。然而，不拔出当前正被应用程序使用的卡片是一个好习惯。比 1.1.77 旧的内核在串口串口/现代卡片时会死锁，但这个问题现在应该已经修复了。


    某些类型的卡片无法安全地进行热拔出。具体而言，ATA/IDE 和 SCSI 接口卡不是热插拔安全的。这不太可能实现，因为完整的解决方案需要对 Linux 内核驱动模型进行重大更改。此外，通常不建议热拔出任何类型的
    CardBus 驱动程序。这正在针对各种卡类型（IDE, SCSI, CardBus）逐步改进，建议在物理拔出之前使用 "cardctl eject"。


    ### 4.1.5 卡片服务与高级电源管理


    如果你在配置内核时启用了 APM 支持，则可以在编译 Card Services 时带有 APM（高级电源管理）。APM 内核驱动由 Stephen Rothwell
    (Stephen.Rothwell@ann.aug.org.au) 维护。apmd 守护进程由 Avery Pennurun (apennarr@worldvisions.ca)
    维护，更多信息请参阅 http://www.worldvisions.ca/apennarr/apmd/。如果在系统上检测到兼容版本，PCMCIA 模块将自动配置
    APM。


    无论是否配置了 APM，你可以在笔记本电脑睡眠前使用 "cardctl suspend"，并在恢复后使用 "cardctl resume"，从而干净地关闭和恢复你的
    PCMCIA 卡。这对于正在使用的调制调器无效，因为串口驱动程序无法保存和恢复现代操作参数。


    APM 在某些系统上似乎不稳定。如果你在系统上遇到 APM 和 PCMCIA 的问题，请尝试缩小范围，确定是哪一个包报告了错误。


    某些驱动程序（PCMCIA SCSI 驱动程序）无法从挂起/恢复周期恢复。使用 PCMCIA SCSI 卡时，请务必在系统睡眠之前使用 "cardctl eject"。


    ### 4.1.6 关闭 PCMCIA 系统


    要卸载整个 PCMCIA 包，请调用 rc.pcmcia：


    ```

    /etc/rc/rc.pcmcia stop

    ```


    此脚本将运行几秒钟，为所有卡驱动程序留出优雅关闭的时间。如果设备当前正在使用，关闭将不完整，某些内核模块可能不会加载。


    为了避免这种情况，请在调用 rc.pcmcia 之前使用 "cardctl eject" 关闭所有插槽。cardctl 命令的退出状态将指示是否有任何插槽已成功关闭。


    ## 4.2 PCMCIA 配置脚本概述


    以下信息适用于由 `cardmgr` 管理的卡片。在 2.4 及更高内核中，内核 PCMCIA 子系统是激活的，此时 CardBus 由热插拔子系统管理，不再使用
    PCMCIA 脚本。


    每个 PCMCIA 设备都有一个关联的“类”（class），描述如何对其进行配置和管理。类与 /etc/pcmcia/config 中的驱动程序关联。目前有五种
    IO 设备（网络、SCSI、光驱、固定磁盘和两个内存设备（内存和 FTL））。对于每个类，etc/pcmcia/ 下有两个脚本（例如 `/etc/pcmcia/scsi`
    用于 SCSI 设备）和一个选项脚本（例如 `/etc/pcmcia/scsi.opts`）。在设备插入时调用主脚本进行配置，在移除时关闭设备。对于具有多个关联设备的卡，将为每个设备调用脚本。


    所有地址的第一部分是当前的 PCMCIA “方案”（scheme）。该参数用于根据用户指定的变量支持多组设备配置。一种用法是设置“家庭”方案和“工作”方案，它们包含不同的网络配置参数。使用
    "cardctl scheme" 选择当前方案。如果没有指定方案，默认为 "default"。


    除了 ADDRESS 之外，*.opts 文件中还可以使用几个附加变量：


    SOCKET, CLASS, DRIVER, DEVICE, MAJOR, MINOR


    这些对应于 stab 文件中的行中的字段。详情请参见相关页面。


    PROID_1, PROID_2, PROID_3, PROID_4, MANID, FUNCID


    这些等同于 "cardctl info" 的输出，并提供更详细的识别信息。


    由于 *.opts 文件只是 shell 脚本，并不要求它们遵循基于 ADDRESS 返回设置的示例。


    作为通用规则，为笔记本电脑配置 Linux 时，PCMCIA 设备应仅通过 PCMCIA 设备脚本进行配置。不要尝试以配置固定设备的方式配置 PCMCIA
    设备。然而，某些发行版提供了集成到其自带设备配置工具中的 PCMCIA 包。在某些情况下，以下章节可能不适用。


    ## 4.3 使用与特性


    PCMCIA 设备可以通过多种方法配置，最常见的方法是通过 .opts 文件。


    PCMCIA 设备可以通过多种方法配置，最常见的方法是通过 .opts 文件。


