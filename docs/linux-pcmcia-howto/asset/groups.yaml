    \ There are a few configuration options that affect the PCMCIA systems. The configuration\
    \ script can deduce these from the running kernel (the default and most common\
    \ case). Alternatively, if you are compiling for installation on another machine,\
    \ you can read the configuration from a kernel source tree, or each option can\
    \ be set. The Configure script can also be executed non-actively, for automatic\
    \ builds or to quickly reconfigure after a kernel update. Some additional less-frequently-used\
    \ options can only be set from the command line. Running `Configure --help` lists\
    \ all available options. Running `make install` followed by build and install\
    \ the kernel modules and programs. Kernel modules are installed under `/lib/modules/<version>/pcmcia`.\
    \ The cardmgr and cardctl1 programs are installed in `/sbin/pcmcia`. If Cardbus\
    \ is enabled, it is installed in `/usr/bin/X11`. Configuration files will be installed\
    \ in the `/etc/pcmcia`. If you are installing over an older version, your config\
    \ scripts will be backed up before being replaced. The saved scripts will be given\
    \ a ~.old extension. If you do not know which controller you use, use the pcmcia\
    \ probe within the cardmgr/ subdirectory to determine this. There are several\
    \ major types: the Databook TCIC-2 type and the Intel I2365SL-compatible type.\
    \ With the kernel PCMCIA subsystem, intel controllers are further subdivided into\
    \ ISA-bus 16-bit busses, and PCI-based CardBus devices. In a few cases, the pcmcia_probe\
    \ will be unable to determine your controller automatically. If you have a Halikan\
    \ NBD 186 system, it has a TCIC-2 controller at an unknown location: you will\
    \ need to edit rc.pcmcia to load the tcic module, and also set the PCIC_OPTS parameter\
    \ to `tcic_base=0x02c0`. On old pre-PCI systems using Cirrus Controllers, including\
    \ the NEC Vers M, the BIOS puts the controller in a suspended state at system\
    \ startup. Then the pcmcia_probe will fail to find any known host controller.\
    \ If this happens, edit rc.pcmcia and set PCIC to i28365, and PCIC_OPTS to `wakeup=1`.\
    \ ## 2.4 Startup options The PCMCIA startup script recognizes groups of startup\
    \ options, via environment variables. Multiple options should be separated by\
    \ spaces and enclosed in quotes. Placement of startup options depends on the Linux\
    \ distribution used. They may be placed directly in the startup script, or they\
    \ may be kept in a separate option file. The 2.6 (Notes about specific Linux distributions)\
    \ for specifics. The following variables can be set: PCMCIA This variable specifies\
    \ whether PCMCIA support should be started up, or not. If it is set to anything\
    \ other than “yes”, then the startup script will be disabled. PCIC This identifies\
    \ the PC Card Interface Controller driver module. There are several options: “tcic”,\
    \ “i82365”, and (for the kernel PCMCIA subsystem) “yenta_socket”. Virtually all\
    \ current controllers are in the “i82365” group for the standalone drivers, and\
    \ “yenta_socket” for the kernel drivers. This is the only mandatory option. PCIC_OPS\
    \ This specifies options for the PCIC module. Some host controllers have optional\
    \ features that may or not be implemented in a particular system. In some cases,\
    \ it is impossible for the driver to detect if these features are implemented.\
    \ See the corresponding man page for a complete description of the available options.\
    \ CORE_OPS This specifies options for the pcmcia_core module, which implements\
    \ the core PC Card driver services. See “man pcmcia_core” for more information.\
    \ CARDMGR_OPS This specifies options to be passed to the cardmgr daemon. See “man\
    \ cardmgr” for more information. SCHEME If set, then the PC Card configuration\
    \ scheme will be initialized to this driver startup time. See the 4.2 (Overview\
    \ of the PCMCIA configuration scripts) for a discussion of schemes. The low level\
    \ drivers, tic and i82365, have various timing parameters that may need to be\
    \ adjusted for systems with unusual blocking. Symptoms of timing problems can\
    \ include recognition problems, lock-ups under heavy loads, high error rates,\
    \ or poor device performance. Only certain host bridges have adjustable timing\
    \ parameters: check the corresponding man page to see what options are available\
    \ for your controller. Here is a summary: - ISA-Bus controllers have numerous\
    \ timing parameters. The most important ones seems to be the cmd_time flag, which\
    \ determines the length of PCMCIA bus cycles. Fast 486 systems (i.e., DX-100)\
    \ seem to benefit from increasing the. - For the PCI-to-PCMCIA bridge, fast_pci=1.\
    \ - For the PCI-to-PCMCIA bridge, the i12365 driver requires a \"p2cclk=1\" parameter.\
    \ ## 2.4.1 Card readers for desktop systems While all PCMCIA card and and docks\
    \ work fine under Linux, some require startup options because they do not behave\
    \ exactly like laptop PCMCIA. PCI card readers, in particular, may handle interrupts\
    \ differently; some of the following parameter settings are only available for\
    \ the i12365 module in the standalone driver; the kernel_socket driver is not\
    \ configurable. - The Linksys ProConnect PCMRDW and Antec Dataute ISA card readers\
    \ are \"ISA Plug and Play\". To use them, you must first activate them with the\
    \ Linux is. See the pages for pnpdump and isapp for information. - For CardPort\
    \ and Altec ISA card readers using the Circus PD672 ISA-to-PCMCIA bridge, the\
    \ i12365 driver requires a \"has_ring=0\" parameter to prevent irq5 conflicts.\
    \ - For Elan P-series card readers on the Circus PD6729 PCI-to-PCMCIA bridge chip,\
    \ the i12365 driver requires a \"irq_mode=1\" parameter. - For the Sycard PCHost120\
    \ hot adapter, the i12365 driver requires a \"p2cclk=1\" parameter. - For the\
    \ Alex Electronics PCIBC host adapter based on the TI 1221 bridge, the i12365\
    \ driver requires \"p2cclk=1 irq_mode=0\" as well as the PCMCIA driver release\
    \ 3.1.3 or later. - With SCM Microystems SBP PCI card readers (which are also\
    \ being distributed with Lucent WaveLAN IEEE cards), and for the Synrotech PCM-CR-PC2IF\
    \ and PCM-CR-PC2IR it is necessary to specify \"irq_mode=0\" for the i12365 module,\
    \ to force use of PCI interrupts. - For the ActionTec 750 card reader and the\
    \ Antec Datachi card reader, the i12365 driver requires a \"irq_list=0\" parameter,\
    \ to indicate that ISA interrupts are unavailable."
