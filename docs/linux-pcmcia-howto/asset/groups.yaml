    ## 5. 高级主题


    目前，没有 Linux 安装工具支持配置适当的“initrd”以通过 PCIA 根文件启动 Linux。因此，设置一个带有 PCIA 根系统的系统需要你使用另一个
    Linux 系统来创建“initrd”镜像。如果没有可用的 Linux 系统，另一种选择是临时在非 PCIA 驱动器上安装 Linux 安装程序，创建 initrd
    镜像，然后重新安装到 PCMCIA 目标设备。


    Linux Bootdisk-HOWTO 提供了关于设置启动盘的通用信息，但针对 initrd 有特定的说明。主要的 initrd 文档包含在最近内核源码发行版中，位于
    `linux/Documentation/initrd.txt`。在开始之前，你应该阅读它。熟悉 lilo 也有帮助。initrd 还需要你的内核在编译时开启了
    `CONFIG_BLK_DEV_RAM` 和 `CONFIG_BLK_DEV_INITRD`。


    这是一项高级配置技术，要求对 Linux 和 PCIA 系统有高水平的熟悉。在开始之前，请务必阅读所有相关文档。以下食指南指令应该是有效的，但偏离示例将迅速使你进入未知且“不支持”的领域，届时你将自自力。


