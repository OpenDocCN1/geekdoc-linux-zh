    # 2. Compilation and installation


    categories; thus, PCMCIA network drivers are in a submenu of network drivers,
    and PCMCIA serial drivers

    are in a submenu of character drivers.


    In the standalone pcmia-cs drivers, the i82365 module supports ISA-to-PCMCIA,
    PCI-to-PCMCIA,

    PCI-to-CardBus bridges. The PCMCIA socket driver in the 2.4 tree is the yenta_socket
    driver. It is

    selected by the CONFIG_CARDBUS option. In your PCMCIA startup option, this driver
    should be selected

    in place of the i82365 driver. The kernel version of the i82365, selected by CONFIG_i82365,
    only

    supports ISA-to-PCMCIA bridges that are not PCMCIA capable, like the Cirrus

    PD6729, are not supported at all by the kernel PCMCIA drivers.


    When compiling the standalone PCMCIA package, the Configure script decides whether
    or not to build any kernel modules by looking at the value of the CONFIG_PCMCIA
    option in your kernel configuration.

    CONFIG_PCMCIA is enabled, then by default, no driver components are built. If
    CONFIG_PCMCIA is disabled,

    then all modules will be built and installed. It is safe to use the user tools
    (cardring, cardlet, etc)

    in a PCMCIA package whose version number differs from the PCMCIA version number
    in the kernel source

    tree. The kernel PCMCIA header files take precedence over the others in the PCMCIA
    package, and

    CONFIG_PCMCIA is enabled.


    # 2.3 Installation


    Here is a synopsis of the installation process:


    +   - Unpack pcmia-cs-3.2.tar.gz in /usr/src.

    - Run `make config` in the new pcmia-cs-3.2? directory.

    - Run `make all`, then `make install`.

    - Customize the startup script and the option files in /etc/pcmcia for your site,
    if needed.


    If you plan to install contributed client drivers not included in the core PCMCIA
    distribution, unpack

    e of them in the top-level directory of the PCMCIA source tree. Follow the normal
    build instructions.

    The extra drivers will be compiled and installed automatically.


    Running `make config` prompts for a few configuration options, and checks your
    system to verify that

    it satisfies all prerequisites for PCMCIA support. In most cases, you''ll be able
    to accept all

    default configuration options. Be sure to carefully check the output of this command
    in case there are

    problems.


    # Linux kernel source directory?


    This is the location of the source tree for the kernel you want to use with PCMCIA.
    Often this is

    /usr/src


    # Build ''trusting'' versions of card utility


    Some of the support utilities (cardctl and cardinfo) can be compiled either in
    “safe” or “trusting"

    forms. The “safe” forms prevent non-root users from modifying card configurations.
    The “trusting"

    forms permit ordinary users to issue commands to suspend and resume cards, reset
    cards, and change

    the current configuration scheme. The default is to build the safe forms.'
