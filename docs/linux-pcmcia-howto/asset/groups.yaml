    # 4.9 Multifunction cards


    A single interrupt can be shared by several drivers, such as the serial driver
    and an ethernet driver: in fact, the PCMIA specification requires all card functions
    to share the same interrupt. Normally, all card functions are available without
    having to share drivers.


    Simultaneous use of two card functions is “tricky” and various hardware vendors
    have implemented interrupt sharing in their own incompatible (and sometimes proprietary)
    ways. The drivers for some cards (Ositech Jack of Diamonds, 3Com 3c362 and related
    cards, Linksys cards) properly support simultaneous access, but others (older
    Megahertz cards) do not. If you have trouble using a card with both functions
    active, try using each function in isolation. That may require explicitly doing
    an “ifconfig down” to shut down a network interface and a modem on the same card.'
