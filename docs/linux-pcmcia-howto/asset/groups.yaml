    ## 2. 编译与安装


    ### 包含 32 位 (CardBus) 卡支持吗？


    如果你希望使用 32 位 CardBus 卡，则必须选择此选项。如果你仅计划使用 16 位 PC 卡，则不需要 CardBus 桥接支持。


    ### 包含 PnP BIOS 资源检查吗？


    这会将额外的代码构建到 PCMCIA 核心模块中，用于与系统的 BIOS 通信，以获取板载“主板”设备（串口和并行口、声卡等）的资源信息，从而帮助避免资源冲突。如果启用，将在
    `/proc/bus/pcard` 处创建一些资源文件，并可以使用 lmsp 和 setp 池来管理 PnP BIOS 设备。然而，此设置在某些笔记本电脑上会导致问题，因此默认未开启。


    ### 模块安装目录？


    新内核模块将安装的目录。通常，这应该是与你的内核版本匹配的 `/lib/modules` 的子目录。


    ### 如何设置内核特定选项？


    有几个配置选项会影响 PCMCIA 系统。配置脚本可以从运行的内核中推导出这些选项（默认且最常见的情况）。或者，如果你是为了在另一台机器上安装而进行编译，可以从内核源码树读取配置，也可以设置每个选项。


    `Configure` 脚本也可以以非活动模式执行，用于自动构建或在内核更新后快速重新配置。某些其他不常使用的选项只能从命令行设置。运行 `Configure
    --help` 会列出所有可用选项。


    运行 `make install` 然后将构建并安装内核模块和程序。内核模块安装在 `/lib/modules/<version>/pcmcia` 下。`cardmgr`
    和 `cardctl1` 程序安装在 `/sbin/pcmcia`。如果启用了 Cardbus，它将安装在 `/usr/bin/X11`。


    配置文件将安装在 `/etc/pcmcia` 中。如果你在旧版本上安装，你的配置脚本将在替换之前进行备份。保存的脚本将赋予 `~.old` 后缀。


    如果你不知道使用的是哪种控制器，请使用 `cardmgr/` 子目录下的 `pcmcia probe` 来确定。这里有几种主要类型：Databook TCIC-2
    类型和 Intel I2365SL 兼容类型。在内核 PCMCIA 子系统中，Intel 控制器进一步细分为 ISA-总线 16 位总线和基于 PCI 的
    CardBus 设备。


    在某些情况下，`pcmcia_probe` 将无法自动确定你的控制器。如果你有一台 Halikan NBD 186 系统，它在未知位置具有一个 TCIC-2
    控制器：你需要编辑 `rc.pcmcia` 来加载 `tcic` 模块，并将 `PCIC_OPTS` 参数设置为 `tcic_base=0x02c0`。


    在使用 Cirrus 控制器的旧版非 PCI 系统上（包括 NEC Vers M），BIOS 在系统启动时会将控制器置挂起状态。此时 `pcmcia_probe`
    将无法找到任何已知的主机控制器。如果发生这种情况，请编辑 `rc.pcmcia` 并将 `PCIC` 设置为 `i28365`，将 `PCIC_OPTS`
    设置为 `wakeup=1`。


    ## 2.4 启动选项


    PCMCIA 启动脚本通过环境变量识别一组启动选项。多个选项之间应用空格分隔并用引号括起来。启动选项的位置取决于所使用的 Linux 发行版。它们可能直接放置在启动脚本中，也可能保留在单独的选项文件中。具体细节请参见
    2.6（关于特定 Linux 发行版的说明）。可以设置以下变量：


    **PCMCIA**

    此变量指定是否启动 PCMCIA 支持。如果设置为“yes”以外的任何值，则启动脚本将被禁用。


    **PCIC:**

    这用于标识 PC 卡接口控制器驱动程序模块。有几个选项：“tcic”、“i82365”以及（对于内核 PCMCIA 子系统）“yenta_socket”。几乎所有当前控制器在独立驱动程序中属于“i82365”组，在内核驱动程序中属于“yenta_socket”。这是唯一的强制性选项。


    **PCIC_OPS:**

    此指定用于 PCIC 模块的选项。某些主机控制器具有可选功能，这些功能在特定系统中可能实现也可能不实现。在某些情况下，驱动程序无法检测这些功能是否已实现。请查看相应的
    man 页以获取可用选项的完整说明。


    **CORE_OPS:**

    此指定用于 `pcmcia_core` 模块的选项，该模块实现了核心 PC 卡驱动服务。更多信息请参见“man pcmcia_core”。


    **CARDMGR_OPS:**

    此指定要传递给 `cardmgr` 守护进程的选项。更多信息请参见“man cardmgr”。


    **SCHEME:**

    如果设置，则 PC 卡配置方案将在驱动程序启动时初始化为此方案。请参阅 4.2（PCMCIA 配置脚本概述）关于方案的讨论。


    底层驱动程序 `tic` 和 `i82365` 具有各种定时参数，可能需要针对系统进行调整。定时问题包括识别问题、高负载下的死机、高错误率或性能不良。只有某些主机桥具有可调定时参数：请检查相应的
    man 页查看控制器的可用选项。以下是总结：


    - ISA-总线控制器具有许多定时参数。最重要的似乎是 `cmd_time` 标志，它决定了 PCMCIA 总线周期。486 系统（例如 DX-100）似乎从增加该值中受益。

    - 对于 PCI-to-PCMCIA 桥，`fast_pci=1`。

    - 对于 PCI-to-PCMCIA 桥，`i12365` 驱动需要参数 `p2cclk=1`。

    '
