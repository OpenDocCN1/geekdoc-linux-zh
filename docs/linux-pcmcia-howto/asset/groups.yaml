    \ 具有高于标准的时钟。卡的实际波特率比串口驱动程序快四倍。为了解决这个问题，请在 `/etc/pcmia/serial.opts` 中指定 `SERIAL_OPTS=\"\
    baud_base 460800\"`。\n\n## 4.4.3 诊断串口设备问题\n\n- 在 3.1.5 及更高版本的 PCMCIA 中，PCMIA 源码树\
    \ `debug-tools` 子目录下的 `test_modem` 脚本将显示一些常见问题。\n- 你的设备被识别为调制解调器了吗？检查系统日志并查找 `cardpcmia`\
    \ 识别该卡并正确启动 `serial_cs` 驱动的消息。如果没有，你可能需要向 `/etc/pcmia/config` 文件添加新条目，以便能够正确识别。详情请见第\
    \ 6.1（配置未识别的卡）节。\n- `serial_cs` 是否成功配置了调制解调器？再次检查系统日志并查找来自 `serial_cs` 驱动的消息。如果\
    \ `register_serial()` 失败，你可能与其他设备存在 I/O 端口冲突。该卡的另一个提示是设备被报告为 8250；大多数现代调制解调器应被识别为\
    \ 16550 UART。如果你认为看到了端口冲突，请编辑 `/etc/pcmia/config.opts` 并排除分配给调制解调器的端口。\n- 是否存在中断冲突？如果系统正常但调制解调器似乎无法工作，尝试使用\
    \ `setserial` 将 irq 改为 0，看调制解调器是否工作。这会导致串口驱动使用较慢模式而不是中断。如果系统看起来正常但调制解调器似乎无法工作，这通常是中断冲突的指示。你应该在\
    \ `/etc/pcmia/config` 中排除分配给调制解调器的中断。\n- 调制解调器运行非常慢，这几乎是中断冲突的。\n- 你的问题很可能是 SLIP\
    \ 的，而不是 PCMIA 的。\n 如果 如果你将串口驱动编译为模块，这意味着你的内核不支持串口设备。你必须修改 `/etc/pcmia/config`\
    \ 以指示在加载串口模块之前加载串口模块。\n\n## 4.5 PCMIA 并口设备\n\nLinux 并口驱动是分层的，使得多个高层设备类型可以共享同一个端口驱动。打印设备通过\
    \ `/dev/lp*` 特殊设备访问。打印机的配置可以通过 `junto` 命令检查和修改。\n\n`purport_cs` 模块依赖于 `purport`\
    \ 和 `purport_re` 驱动，这些可以编译进内核。这种结构意味着任何高层并行设备（如 `plip` 驱动、打印机驱动等）必须编译为模块。这些驱动在启动时识别并行口设备，因此它们需要在配置\
    \ PC并行设备后加载。\n\n传递给 `purport.opts` 的设备地址具有三个逗号分隔的字段：第一个是方案，第二个是插槽号，第三个是设备实例。对于支持并行口的卡，设备实例可能有多个值，但对于单端口卡，它总是\
    \ 0。如果你经常使用多个卡，可能需要根据插槽位置指定设置：\n\n```\ncase \"ADDRESS\" in\n  ,*)\n    # 插槽 0\
    \ 的选项\n    LINK=/dev/printer0\n    ;;\n  *1,*)\n    # 插槽 1 的选项\n    LINK=/dev/printer1\n\
    \    ;;\nesac\n```\n\n## 4.5.1 并口设备参数\n\n在 `parport.opts` 中可以定义以下参数。\n\n### LINK\n\
    指定用于为“呼出”设备创建符号链接的路径。\n\n### SERIAL_OPTS\n指定传递给 `setserial` 命令的选项。\n\n### NO_CHECK,\
    \ NO_FUSER\n卡弹出策略的布尔（y/n）设置。如果 `NO_CHECK` 为真，`cardctl eject` 即使设备正在忙也会关闭该设备。如果\
    \ `NO_FUSER` 为真，脚本将不会尝试杀死使用已弹出设备的进程。\n\n例如：\n\n```\ncase \"$ADDRESS\" in\n  *,*)\n\
    LINK=\"/dev/modem\"\nSERIAL_OPTS=\"\"\n```\n\n## 4.5.2 诊断串口设备问题\n\n## 4.6 PCMIA\
    \ 适配器\n\n"
