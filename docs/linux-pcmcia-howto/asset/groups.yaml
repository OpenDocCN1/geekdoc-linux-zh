    ```


    ### 2.6.2 Red Hat


    Card Services 理想情况下应避免锁定其他标准设备正在使用的 端口和中断。它还会尝试检测与未知设备的冲突，但这种方法并不完全可靠。在某些情况下，你可能需要在
    `/etc/pcmsia/config.opts` 中显式地排除某个设备的资源。


    以下是针对特定笔记本电脑类型的资源设置。查看此列表时请保持谨慎：它可能为解决问题提供有用提示，但不可避免地已经过时并包含错误。欢迎修正。


    Debian 使用启动脚本安排。


    ### 2.6.3 Slackware


    Slackware 使用 BSD 启动安排。


    ### 2.6.4 SuSE


    SuSE 使用 System V init 脚本安排，脚本存储在 `/etc/init.d`。


