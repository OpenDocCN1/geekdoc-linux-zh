    # 3. Resolving installation and configuration problems


    In most cases, the socket driver (i82365 and tcic) will automatically probe and
    select an appropriate inter-rupt to signal card status changes. The automatic
    interrupt probe will not work on Intel-compatible controllers, including Cirrus
    chips and the chips used in some IBM ThinkPads. If a device is inactive probe
    time, its interrupt may also appear to be available. In these cases, the socket
    driver may pick an interrupt that is used by another device.


    With the i82365 and tcic, the irq_list option can be used to limit the interrupts
    that will be tested. This list limits the set of interrupts that can be used by
    PCMCIA cards as well as for monitoring status changes. The cs_irq option can also
    be used to explicitly set the interrupt to be used for monitoring status changes.


    If you can''t find an interrupt that works, there is also a polled status mode:
    both i82365 and tcic will accept a poll_interval=100 option, to poll for card
    status once per second. This option should also be used if your system has a shortage
    of interrupts available for use by PCMCIA. Especially for systems with more than
    one controller, there is little point in dedicating interrupts for monitoring
    card status changes.


    All these options should be set in the PCIC_OPTS line in either /etc/rc.d/pcmia
    or /etc/sysconfig/pcmia, depending on your site setup.


    # 3.7 Interrupt delivery problems


    Symptoms:


    +   * Cards appear to be configured successfully, but don''t work.

    * Serial and modem cards may respond very sluggishly.

    * Network cards may report ''interrupt(s) dropped'', and or transmit timeouts.


    The most simple interrupt delivery problems are due to conflicts with other system
    devices. These can generally be resolved by excluding problem interrupts in /etc/pcmia/config.opts.
    To test, exclude interrupts one by one until either the problem is fixed or you
    run out of interrupts. If no interrupts work, then device conflicts are probably
    not the problem.


    For CardBus bridges, a variety of other interrupt delivery issues may come into
    play. For a complete discussion, 5.2.3 (PCI interrupt delivery problems).


    # 3.8 System resource starvation


    Symptoms:


    +   * When a card is inserted, it is identified correctly but cannot be configured
    (high/low beep pattern).

    * One of the following messages will appear in the system log:


    ```

    RequestIO: Resource in use

    RequestIRQ: Resource in use

    RequestWindow: Resource in use

    GetNextTuple: No more items

    could not allocate mn IO ports for CardBus socket n

    ```'
