    # 7. Debugging tips and programming information


    its output. This can be adjusted when the module is loaded, so output on a per-module
    basis without recompiling.


    Your default configuration for syslog may be controlled by discard debugging messages.
    To ensure that they are recorded, edit /syslog.conf to ensure that *kern. debug*
    messages are recorded somewhere. See *man syslog.conf* for details.


    There are few register-level debugging tools in the *debug_tools/** subdirectory
    of the PCMIA distribution. The *dump_dtic* and *dump_1365* utilize generic register
    jumpers for ISA-to-PCMIA controllers. In 3.1.15 and later releases, *dump_1365*
    is replaced by *dump_exa*, which is similar but also works for PCI-to-CardBus
    bridges. Also in 3.11 for CardBus bridges the *dump_cardbus* interprets the CardBus-specific
    registers. They are most useful if you have a datasheet for the corresponding
    controller chip. The *dump_ci* utility in proc-3.02 distributions lists the contents
    of a card''s CIS (Card Information Structure), and decodes most of the important
    bits. And the *dump_cisreg* displays a card''s local configuration registers.


    The *memory_cb* memory card driver is also useful for 16-bit PC Cards. It can
    be bound to any card, and does not interfere with other drivers. It can be used
    to directly access any card''s attribute or common memory. Similarly for CardBus
    cards, the *memory_cb* driver can be bound to any 32-bit card, to give direct
    access to that card''s address spaces. See the man pages for more information.


    # 7.4 /proc/bus/pccard


    On 2 and later kernels, the PCMIA package will create a tree of status information
    under /proc/bus/pccard. Much of the information can only be interpreted using
    the data sheets for the PCMIA host controller. Its contents may depend on how
    the drivers were configured, but may include all or some of the following:


    /proc/bus/pccard/{irq,ioport,memory}


    If present these files contain resource allocation information to supplement the
    normal kernel resource tables. Recent versions of the PCMIA system may obtain
    additional resource information from the Plug and Play BIOS if configured to do
    so.


    /proc/bus/pccard/drivers


    In recent releases, this lists all loaded PCMIA client drivers. Unlike /proc/modules,
    it also lists drivers that may be statically linked to the kernel.


    /proc/bus/pccard/*info


    For each socket, this describes the host controller and its capabilities.


    /proc/bus/pccard/*/exca


    This contains a dump of the controller''s “ExCA” Intel i82365sl-compatible register
    set.


    /proc/bus/pccard/*/{pci,cardbus}


    For CardBus bridges, a dump of the bridge''s PCI configuration space, and a dump
    of the bridge''s CardBus configuration registers.'
