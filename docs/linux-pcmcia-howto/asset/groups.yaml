    # 3. Resolving installation and configuration problems


    could not allocate nnK memory for CardBus socket n could not allocate interrupt
    for CardBus socket n


    Interrupt starvation often indicates a problem with the interrupt probe (see 3.3
    Interrupt scan failures)). In some cases, the probe will seem to work, but only
    report one or two available interrupts. Check your system log to see if the scans
    look sensible. Disabling the probe and selecting interrupts manually should help.


    If the interrupt probe is not working properly, the socket driver may allocate
    an interrupt for monitoring insertions, even when interrupts are too scarce for
    this to be a good idea. You can switch the controller to polled mode by setting
    PCI_OPTS to “poll_interval=100”. Or, if you have a CardBus controller and an older
    version of the PCMCIA drivers, “pci_cse=1”, which selects a PCI interrupt (if
    available) for card status changes.


    In some cases, kernel misconfiguration can also produce an apparent interrupt
    shortage. On 2.4 and later kernels, if CONFIG_ISA is not enabled, then the PCMCIA
    bus interrupts are available.


    IO port sharing is fairly uncommon, but sometimes happens with cards that require
    large, aligned regions of IO port space, or may only recognize few specific IO
    port positions. The default IO port ranges in /etc/pcmia/config.opts are normally
    sufficient, but may be extended. If this is the problem, using the “include” port
    0x1000-0x1fff line in config.opts. In rare cases, starvation may indicate that
    the IO probe failed (see 3.4 IO port failures).


    Memory starvation is also uncommon with the default memory windows in config.opts.
    CardBus cards may require larger memory regions than typical 16-bit cards. Since
    CardBus memory windows can be mapped anywhere in the host’s PCI address space
    (rather than just in the 640K-1MB “hole” in PC systems), it is helpful to specify
    large memory windows in high memory, such as 0xa0000000-0xa0fffff.


    # 3.9 Resource conflict only with two cards inserted


    Symptoms:


    +   * Two cards each work fine when used separately.

    * When both cards are inserted, only one works.


    This usually indicates a resource conflict with a system device that Linux does
    not know about. PCMCIA devices are dynamically configured, for example, interrupts
    are allocated as needed, rather than specifically assigned to particular cards
    or sockets. Given a list of resources that to be available, cards are assigned
    resources in the order they are configured. In this case, the card last being
    assigned a resource that in fact is not free.


    Check the system log to see what resources are used by the non-working card. Exclude
    these from /etc/pcmia/config.opts, and restart the configmgr daemon to reload
    the resource database.


