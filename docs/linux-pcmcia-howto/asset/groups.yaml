    # 7.3 Low level PCMIA debugging aids


    The PCMIA modules contain a list of conditionally-compiled debugging code. Most
    of this is under control of the PCMIA_DEBUG preprocessor define. If this is undefined,
    debugging code will not be compiled. If set to 0, the code is compiled but inactive.
    Larger numbers increasing levels of verbosity. Each module built with PCMIA_DEBUG
    defined will have an integer parameter, pc_debug, that controls the verbosity
    of its output. This can be adjusted when the module is loaded, so output on a
    per-module basis without recompiling.


    Your default configuration for syslog may be controlled by discard messages. To
    ensure that they are recorded, edit /syslog.conf to ensure that kern.debug messages
    are recorded somewhere. See *man syslog.conf* for details.


    There are few register-level debugging tools in the *debug_tools/** subdirectory
    of the PCMIA distribution. The dump_dtic and dump_1365 utilize generic register
    jumpers for ISA-to-PCMIA controllers. In 3.1.15 and later releases, dump_1365
    is replaced by dump_exa, which is similar but also works for PCI-to-CardBus bridges.
    Also in 3.11 for CardBus bridges the dump_cardbus interprets the CardBus-specific
    registers. They are most useful if you have a datasheet for the corresponding
    controller chip. The dump_ci utility in proc-3.02 distributions lists the contents
    of a card''s CIS (Card Information Structure), and decodes most of the important
    bits. And the dump_cisreg displays a card''s local configuration registers.


    The memory_cb memory card driver is also useful for 16-bit PC Cards. It can be
    bound to any card, and does not interfere with other drivers. It can be used to
    directly access any card''s attribute or common memory. Similarly for CardBus
    cards, the memory_cb driver can be bound to any 32-bit card, to give direct access
    to that card''s address spaces. See the man pages for more information.


    # 7.4 /proc/bus/pccard


    On 2 and later kernels, the PCMIA package will create a tree of status information
    under /proc/bus/pccard. Much of the information can only be interpreted using
    the data sheets for the host controller. Its contents may depend on how the drivers
    were configured, but may include all or some of the following:


    /proc/bus/pccard/{irq,ioport,memory}


    If present these files contain resource information to supplement the normal kernel
    resource tables. Recent versions of the PCMIA system may obtain additional resource
    information from the Plug and Play BIOS if configured to do so.


    /proc/bus/pccard/drivers


    In recent releases, this lists all loaded PCMIA client drivers. Unlike /proc/modules,
    it also lists drivers that may be statically linked to the kernel.


    /proc/bus/pccard/*info


    For each socket, this describes the host controller and its capabilities.


    /proc/bus/pccard/*/exca


    This contains a dump of the controller''s “ExCA” Intel i82365sl-compatible register
    set.


    /proc/bus/pccard/*/{pci,cardbus}


    For CardBus bridges, a dump of the bridge''s PCI configuration space, and a dump
    of the bridge''s CardBus configuration registers.

    '
  mdcn: '


    # 调试技巧与编程信息


    编辑 `pcnet_cs` 后，编译并安装新模块。再次编辑 `/etc/pcmcia/config`，将卡绑定从 `memory_cs` 更改为 `pcnet_cs`。按照指令重新加载配置文件，然后就大功告成了。请向我发送你的
    `hw_info` 和 `config` 条目的的副本。


    如果你在十六进制转储（hex dump）中找不到显卡的地址，作为最后的手段，可以在 `pcnet_cs` 模块初始化时“硬接线”地址。编辑 `/etc/pcmcia/config.opts`
    并添加一个 `hw_add=` 选项，如下所示：


    ```

    module "pcnet_cs" opts "hw_add=0x00,0x80,0x8c,0x01,0x02,0x03"

    ```


    当然，请在适当的位置将其替换为你显卡的硬件地址。请注意，如果你已经到了这一步，那么你的卡极可能不是真正兼容 NE200。事实上，我不确定是否还有哪些卡是无法前两种方法处理的。


    # 6.3 PCMCIA 接口卡


    Compaq Aero 以及其他笔记本电脑使用的 PCMCIA 软驱接口尚未被此软件包支持。支持 Aero 软驱的障碍在于，Aero 似乎使用了自定义的 PCMCIA
    控制器来支持到软驱的 DMA。在不知道具体实现方式的情况下，无法在 Linux 下实现相关支持。


    如果 Aero 启动时存在软驱卡，Aero BIOS 将配置该卡，Linux 将其识别为普通软驱。当加载 Linux PCMCIA 驱动程序时，它们会注意到该卡已经配置并附加到了
    Linux 驱动程序，因此该插槽将被忽略。所以，如果驱动器在启动时存在，则可以使用它，但该卡不支持热插拔。


    # 调试技巧与编程信息


    # 7.1 提交有效的问题报告


    提交报告的最佳方法是使用在线 pcmia-forums 或 SourceForge 上的错误跟踪器（bug tracker）。这样，其他人就可以看到当前的问题（如果有修复方案或变通方法）。所有错误报告都应该包含以下内容：


    - 你的系统品牌和型号。

    - 你使用的所有 PCMCIA 卡。

    - 你的 Linux 内核版本（例如 `"uname -rv"`）以及 PCMCIA 驱动版本（例如 `"cardctl -V"`）。

    - "lspci -v" 的输出。

    - 你对 `/etc/pcmcia/config` 或 PCMCIA 启动脚本所做的任何更改。

    - 你的系统日志文件中与 PCMCIA 相关的消息。


    # 7. 调试技巧与编程信息


    所有的 PCMCIA 模块都会将状态发送到系统日志。这些通常位于 `/var/log/messages` 或 `/var/log/syslog`。当你遇到问题时，这些文件应该是首选查找位置。在提交错误报告之前，请确保你使用的是最新的驱动程序版本。如果找不到你的系统消息，请检查
    `/etc/syslog.conf`。阅读错误报告是非常有益的，如果你无法访问网络，可以将错误报告发送给我 `dahinds@sourceforge.net`。然而，我更倾向于让错误报告发布在
    pcmia-cs 上以便他人看到。


    # 7.2 解释错误报告


    如果错误涉及内核故障（kernel fault），只有当将故障地址转换为有意义的符号时，寄存器转储（register dump）才有用。最近版本的 `klog`
    可以翻译故障地址，但如果故障发生在模块中，或者问题严重到 `klog` 无法完成向系统日志的写入，这种方法可能无效。如果故障发生在内核中，可以在 `System.map`
    中查找故障地址。这位于 `/System.map` 或 `/boot/System.map`。如果故障发生在模块中，`nm` 命令提供了相同的信息，故障地址已根据模块加载地址进行了调整。假设你有内核：


    ```

    Unable to handle NULL pointer dereference

    current->tss.cr3 = 014c9000, cr3 = 014c9000

    pde = 00000000

    ops: 0

    CPU: 0

    EIP: [0026081]

    EFLAGS: 0010282

    ```


    故障地址是 `0xc26081`。查看 `System.map` 我们可以看到这在内核末尾，即内核模块中。要确定是哪个模块，检查 `"nm -m | sort"`
    的输出：


    | Address | Symbol | Defined by |

    | :--- | :--- | :--- |

    | c200d00 (35k) | | [pcmia_core] |

    | c200d10 | register_ss_entry | [pcmia_core] |

    | c200d230 | register_ss_entry | [pcmia_core] |

    | c202600 (9k) | | [3c574_cs] |

    | c202a00 (4k) | | [serial_cs] |


    所以，`0xc26081` 在 `3c574_cs` 模块中，它是模块开始处的偏移 `0x0081`。我们无法在 `ksym` 中查找此偏移：当内核加载模块时，它会在模块加载地址插入一个头部。头部的大小随内核版本变化：要找到你内核的大小，检查导出符号的模块（如
    `pcmia_core`），并与 `nm` 输出进行比较。在本示例中，`register_ss_entry` 加载在 `0xc200d1c - 0xc200d00
    = 0x01c` 偏移处，而 `nm pcmia_core.o` 显示偏移为 `0x00c`，因此头部大小为 `0x01c - 0x00c = 0xb4`。回到
    `3c574_cs`，我们的故障偏移是 `0x0081`，头部 `0x04ac`。现在查看 `"nm 3c574_cs.o | sort"`，我们看到：


    ```

    0000002 d if_names

    0000002 t 3574_attach

    0000040 d preamble_preamble

    0000041 d dev_info

    ```


    所以，故障位于 `3c574(attach)`。在本示例中，故障没有导致系统死机，因为故障发生后 `ksym` 还可以建立。在其他情况下，你可能需要以相同的顺序和相同的地址加载多个模块。如果在插入卡时发生故障，请在插入卡之前运行
    `ksym`，或者在插入卡的情况下运行。你可以使用 `insmod` 手动加载卡驱动，并在插入卡之前运行 `kms`。更多背景信息请参见 `man inserted`、`man
    kms` 和 `man klog`。在内核源码树中，`Documentation/ops-tracing.txt`也有帮助。以下是一些内核调试提示：


    - 根据故障，翻译“调用栈（Call Trace）”中的地址可能有用，使用与主故障地址相同的步骤。

    - 要诊断静默死机，需要在禁用的情况下触发问题，因为发送到控制台的内核消息将可见。

    - 如果你杀死 `klog`，大多数内核消息将直接回显在控制台上，如果问题阻止了 `klog` 写入系统，这可能会有用。

    - 为了允许内核消息发送到控制台，对于 2.2 及更高内核，如果 `/proc/sys/kernel/printk` 存在：


    ```

    echo 8 > /proc/sys/kernel/printk 会在控制台上打印寄存器转储。即使系统完全没有响应，这可能仍然有效，且 EIP 地址可以解释为内核故障。

    ```

    - 对于启用了 `CONFIG_STTY` 的 2.2 及更高内核，可以通过特殊的 `<Alt><SysRq>` 组合键可以使用应急函数，文档见内核源码树中的
    `Documentation/sysrq.txt`。


    # 7.3 低级 PCMCIA 调试辅助


    PCMIA 模块包含一个条件编译的调试代码列表。这大部分由 `PCMIA_DEBUG` 预处理器定义控制。如果未定义此项，则不会编译调试代码。如果设置为 0，则代码被编译但未激活。数字越大，详细程度越高。每个使用
    `PCMIA_DEBUG` 构建的模块都将有一个整数参数 `pc_debug`，用于控制输出的详细程度。这可以在模块加载时进行调整，无需重新编译。你的默认
    `syslog` 可能会记录这些消息。为了确保它们被记录，请编辑 `syslog.conf`。PCMIA 分布的 `debug_tools` 子目录下有一些寄存器调试工具。用于
    ISA 到 PCMCIA 控制器。


    # 7.4 /proc/bus/pccard


    在 2 及更高内核上，PCMIA 软件包会在 `/proc/bus/pccard` 下创建一个状态信息树。大部分信息只能使用主控制器的数据表来解释。其内容取决于驱动的配置方式，但可能包含全部或部分内容：


    /proc/bus/pccard/{irq,ioport,memory}


    如果存在，这些文件包含了补充内核资源表的资源信息。最近版本的 PCMIA 系统可能会根据配置从即插即用 BIOS 获取额外的资源信息。


    /proc/bus/pccard/drivers


    在最近的中，这列出了所有加载的 PCMCIA 客户端驱动。与 `/proc/modules` 不同，它还列出了可能静态链接到内核的驱动。


    /proc/bus/pccard/*info


    对于每个插槽，这描述了主机及其功能。


    /proc/bus/pccard/*/exca


    这包含了控制器的“ExCA”Intel i82365sl兼容寄存器集。


    /proc/bus/pccard/*/{pci,cardbus}


    对于 CardBus 桥器，这是桥器 PCI 配置空间的转储，以及桥器 CardBus 配置寄存器的转储。


    '
