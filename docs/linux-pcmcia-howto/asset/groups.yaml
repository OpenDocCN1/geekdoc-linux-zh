  - '[PAGE 33]


    # 4. Usage features


    A list of SCSI devices connected to this host adapter will be shown in stab, and
    the SCSI configuration script, /etc/pcmci/scsi, will be called for each attached
    device, to configure or shut down the device. The default script does not take
    any actions to configure SCSI devices, but will properly unmount filesystems when
    a device is removed.


    The device addresses passed to scsi.opts are complicated, of the variety of things
    that can be attached to a SCSI adapter. Addresses consist of eight or seven comma-separated
    fields: the current scheme, the device type, the socket number, the SCSI channel,
    ID, logical unit, and the partition number. The device type will be "sd" for disks,
    "st" for tapes, "sr" for CD-ROM devices, and "sg" for generic SCSI. For most setups,
    the SCSI channel and logical unit number will be 0. For devices with several partitions,
    scsi.opts will be called for the whole device, with a five-field address. The
    script should use the PARTS variable to list of partitions. Then, scsi.opts will
    be called for each partition, with the longer-six addresses.


    If your kernel does not have a top-level driver (disk, tape, etc) for a particular
    SCSI device, the device will not be configured by the PCMIA drivers. As a side
    effect, the device name in stab will be like "sd#nnnn" where "nnnn" is a four-digit
    hex number. This happens when cardmgr is unable to translate a SCSI device ID
    into a corresponding Linux device.


    It is possible to modular the top-level SCSI drivers so they are loaded on demand.
    To do so, you need to use /etc/pcmci/config to tell cardmgr which modules need
    to be loaded when your adapter is configured. For example:


    ```

    device "aha152x_cs"

    class "scsi" module "scsi/scsi_mod","scsi/sd_mod","aha152x_cs"

    ```


    would so say to load the core SCSI module and the top-level disk driver module
    before loading the regular PCMCIA driver module.


    Always turn on SCSI devices before plugging your laptop, or before inserting the
    adapter card, so that the SCSI bus is properly terminated when the adapter is
    configured. Also be very careful about ejecting the SCSI adapter. Be sure that
    all SCSI devices are unmounted and closed before ejecting the card. The best way
    to ensure this is to use either cardctl or cardinfo to request card removal before
    physically ejecting the card. For now, all SCSI devices should be powered before
    plugging in a SCSI adapter, and stay connected until you are using the adapter
    and/or power your laptop.


    There is a potential complication when using these cards that do not arise with
    truly bus adapters. The SCSI bus carries a "termination" signal that is necessary
    for proper operation of ordinary passive SCSI terminators. PCMIA adapters do not
    supply termination power, so if it is required, an external device must supply
    it. Some external SCSI devices may be configured to supply termination power.
    such as the Zip Drive and the Syquest EZ-Drive, use active terminators that do
    not depend on it. In some cases, it may be necessary to use a special terminator
    block as the APS Sentry 2, which has an external power supply. When configuring
    your SCSI device chain, be aware of whether or not any of your devices require
    or provide power.


    # 4.6.1 SCSI device parameters


    The following parameters be defined in scsi.opts:


    LINK'
