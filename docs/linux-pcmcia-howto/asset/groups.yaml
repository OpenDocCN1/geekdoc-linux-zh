    ### 5.4.1 pcinitrd 辅助脚本


    `pcinitrd` 脚本创建一个用于带 PCMCIA 根分区启动的基本 initrd 镜像。该镜像包含最小的目录层次结构、一些设备文件、几个二进制文件、共享库以及一组
    PCMCIA 驱动模块。在调用 `pcinitrd` 时，你指定要包含在镜像中的驱动模块。核心 PCMCIA 组件 `pcinitrd_core` 和 `ds`
    会自动包含。


    例如，如果你的笔记本电脑使用兼容 182365 的主机控制器以及 Adaptec SlimSCSI 适配器。你可以使用连接到其上的硬盘上的根文件来创建一个镜像：


    ```

    pcinitrd -v initrd pcmcia/182365.o pcmcia/aha152x.cs.o

    ```


    要自定义你的 initrd 序列，你必须使用类似下面的命令通过“回环”设备启动镜像：


    ```

    mount -o loop -t ext2 initrd /mnt

    ```


    然后编辑 `linuxrc` 脚本。配置文件将安装在镜像的 `/etc` 中，并且也可以进行自定义。查看 `pcinitrd` 的 man 页获取更多信息。


