    ## 2. 编译与安装


    卡是否能工作取决于网卡的类型。基本上所有的调制解调器都应该可以使用随附的驱动程序工作。某些网卡如果是受支持网卡的 OEM 版本，也可以正常工作。其他类型的
    IO（帧缓冲区、声卡等）在有人编写相应的驱动程序之前将无法工作。


    ### 1.6 我最喜欢的（不支持的）卡何时何时能被支持？


    遗憾的是，他们通常不会付钱让我写驱动程序，所以如果你想为你你最喜欢的卡获取一个驱动程序，你可能需要自己完成其中的至少一项工作。理想情况下，我希望建立类似于
    Linux 内核的模式，由我负责“核心”驱动代码，而其他作者则贡献并维护针对特定卡的客户端驱动程序。这目前正在进行中。我会尽力提供帮助，但单人独立调试内核设备驱动程序的效率并不高。


    ### 1.7 邮件列表和其他信息源


    Linux PCIA 信息页位于 <http://pcmia-cs.sourceforge.net>，其中包含错误跟踪、支持和功能请求，以及各种与 PCIA
    相关的消息论坛。用户可以请求对特定问题的新回复进行通知，或对某个类别下的所有新消息进行通知。我希望这将成为一个非常有用的信息库，用于超出 HOWTO 范围的问题。


    位于 <http://www.linux-on-laptops.com> 的 Linux 笔记本电脑页面链接了大量网站，这些网站提供了关于为 Linux 配置特定类型笔记本的信息。这里还有一个可查询的系统配置信息数据库，以及指向各种笔记本相关邮件列表的指针。


    ## 2. 编译与安装


    ### 2.1 前提条件和内核设置


    在开始之前，你应该考虑一下是否真的需要自己编译 PCMCIA 软件包。所有的 Linux 发行版都带有预编译的驱动程序包。通常情况下，只有当你需要当前驱动程序的新功能，或者你更新和/或重新配置了内核且与
    Linux 发行版自带的驱动不兼容时，才需要从头安装驱动程序。虽然编译软件包在技术上并不困难，但它需要一些通用的 Linux 知识。


    在你开始之前，你的系统中已安装以下内容：


    - 一个 2.0、2.2、2.4 或 2.6 内核源码树。

    - （可选）“XForms” X11 用户界面。


    你需要一个完整的内核 Linux 源码树，而不仅仅是一个过更新的内核镜像。驱动模块包含对内核源文件的引用。虽然你可能想构建一个新内核以移除不必要的驱动程序，但安装
    PCMCIA 并不要求你这样做。


    “stable”内核源码和补丁可以从 <ftp://ftp.kernel.org/pub/linux/kernel/v2.4> 获取。当前的模块工具可以在相同的位置找到。


    在 Linux 源码树中，`Documentation/Changes` 文件描述了该内核发布版本所需的各种系统组件的版本。你可能需要检查此文件并验证你的系统是最新的，特别是如果你更新了内核。如果你正在使用开发版内核，请确保你使用的是正确的共享库和模块工具的组合。


    在 x86 系统上，如果你正在使用 16 位的 PC 设备，对于较新的内核，还应该开启 CONFIG_ISA。这些卡的行为既像 ISA 设备，PCMCIA
    驱动程序也会用来判断平台是否支持 ISA 中断。


    在配置内核时，如果你正在使用 PCMCIA 以太网卡，你应该开启网络支持，但关闭 Linux 网卡驱动程序，包括“口袋和便携式适配器”。PCMCIA 网卡驱动程序都实现为可加载模块。编译进内核的驱动程序只会浪费空间。


    如果你想使用 SLIP、PPP 或 PLIP，你需要在配置内核时启用它们，或者使用这些驱动程序的可加载模块版本。


    为了使用 PCMCIA 令牌适配器（token adapter），你的内核应该配置启用 TRB。


    如果你使用的是 PCMCIA IDE 适配器，你的内核应该配置启用 BLK_DEV。


    如果你使用的是 PCMCIA SCSI 适配器，那么在配置内核时启用 CONFIG_SCSI。对于你预期使用的顶级驱动（SCSI、磁带、光驱），应禁用其他驱动程序。


    该软件包包含一个基于 XForms 的状态工具 cardinfo。该工具作为独立包在大多数 Linux 发行版中提供。该库在大多数 Linux 发行版中提供。如果你想使用
    cardinfo，你应该在配置 PCMCIA 软件包之前安装 XForms 库。此工具是完全可选的。


    ### 2.2 PCMCIA 支持


    PCMCIA 驱动支持包含在 2.4 及之后的内核中。虽然它与独立的 PCMCIA 程序包共享大部分代码，但存在一些差异。内核 PCMCIA 支持也在演进。


    内核 PCMCIA 的功能与 pcmcia-cs 程序包相同。它并不需要安装 pcmcia-cs 程序包，因为它需要一些用户工具（cardsmgr, cardctl1,
    /etc/pcmia/*）。


    要使用 PCMCIA，配置内核时启用 CONFIG_HOTPLUG，并在 x86 系统上也应启用 ISA。内核 PCMCIA 支持也在演进。


    内核 PCMCIA 的功能与 pcmcia-cs 程序包相同。它并不需要安装 pcmcia-cs 程序包，因为它需要一些用户工具（cardsmgr, cardctl1,
    /etc/pcmia/*）。


    ### 2.3 安装


    以下是安装过程的概述：


    - 在 /usr/src 中解压 pcmia-cs-3.2.tar.gz。

    - 在 pcmia-cs-3.2 目录下运行 `make config`。

    - 运行 `make all`，然后运行 `make install`。

    - 根据需要自定义 /etc/pcmia 中的启动脚本和选项文件。


    运行 `make config` 会提示一些配置选项，并检查你的系统以验证其是否满足 PC 的所有先决条件。在大多数情况下，你可以接受所有默认配置选项。务必仔细检查此命令的输出以防是否存在问题。


    如果你计划安装未包含在核心 PCMCIA发行版中的贡献驱动，请将每一个解压到 PCMCIA 源码树的根目录下。按照标准的构建说明操作。这些额外的驱动程序将自动编译并安装。


    构建卡工具的“信任”版本


    某些支持工具（cardctl 和 cardinfo）可以以“安全”或“信任”形式编译。“安全”形式防止非 root 用户修改卡配置。“信任”形式允许普通用户颁发命令来挂起和恢复卡、重置卡以及更改当前配置方案。默认构建安全形式。


    '
