    ### 4.3.1 网络设备


    以下参数可以在 network.opts 中定义：


    IF_PORT


    - 为某些设备指定以以太网类型。更多信息请参阅“man ifport”。


    BOOTP


    - 布尔值（y/n）：指示是否应使用 BOOTP 协议获取主机 IP 地址和路由信息。


