    \ distribution, consider including contributed drivers that are not part of the\
    \ PCMCIA package. For reasons of maintainability, I am trying to limit the core\
    \ package size, by only adding new drivers if I think they are of particularly\
    \ broad interest. Other drivers will be distributed separately, as described in\
    \ the previous section. The split between integral and separate drivers is somewhat\
    \ arbitrary and partly historical, and should not imply a difference in quality.\n"
  mdcn: "\n\n# 7. 调试技巧与编程信息\n\n## 7.5 为新卡编写 Card Services\n\n《Linux PCMCIA 程序员指南》是客户端驱动接口的最佳文档。最新版本可以在\
    \ projects.sourceforge.net 的 /pub/pcmia-cs/doc 中获取，或者在网页 <http://pcmia-cs.sourceforge.net>\
    \ 上查看。\n\n对于与普通 ISA 设备较相似的设备，你可能可以使用现有 Linux 驱动程序的部分。在某些情况下，最大的挑战将是修改现有的驱动程序，使其能够处理启动后的设备添加和删除。在当前的驱动中，内存卡驱动程序是“自包含”的驱动，它不依赖\
    \ Linux 内核的其他部分即可完成大部分的脏活工作。\n\n在很多情况下，支持新卡最大的障碍是从制造商处获取技术信息。弄清楚应该问谁或解释需要哪些信息可能很困难。然而，除少数例外外，如果没有制造商提供的技术信息，为卡实现驱动程序是非常困难甚至是不可能的。\n\
    \n我写了一个带有大量注释的虚拟驱动，解释了驱动程序如何与 Card Services 通信；你可以在 PCMCIA 源码分发的 clients/dummy_cs.cs\
    \ 中找到它。\n\n## 7.6 PCMCIA 客户端驱动作者指南\n\n我决定，将所有 PCMCIA 客户端驱动作为 PCMCIA 软件包的一部分进行分发并不可行。每个新驱动都会让主包的维护变得越来越困难，而且包含驱动程序不可避免地会将部分维护工作从作者转移给我。相反，我将根据用户需求和可维护性，具体决定是否包含贡献的驱动程序。对于未包含在核心包中的驱动，我建议作者采用以下方案对其驱动进行打包分发。\n\
    \n驱动程序文件应该按照 PCMCIA 源码分发相同的目录结构安排，这样驱动程序就可以解压到完整的 PCMCIA 源码树上。驱动程序应该包含源文件（位于 /modules/）、一个主页（位于\
    \ /main/）和文件（位于 /etc/）。顶目录还应该包含一个 README 文件。\n\n顶目录应包含一个 Makefile，其设置应使得 \"make\
    \ -f all\" 和 \"make -f install\" 编译驱动程序并安装所有适当的文件。如果此 Makefile 被赋予 .mk 扩展名，那么它将被顶层\
    \ Makefile 为所有的 all 和 install 目标调用。以下是此类 Makefile 的构建示例：\n\n```\n# Sample Makefile\
    \ for contributed client driver\nFILES = sample_cs.mk README.sample_cs \\\nmodules/sample_cs.c\
    \ modules/sample_cs.h \\\netc/sample_cs.conf etc/sample_cs.opts \\\nman/sample_cs.4\n\
    \nall:\ninstall:\n\t$(MAKE) -C modules MODULES=sample_cs.o\n\t$(MAKE) -C install-modules\
    \ MODULES=sample_cs.o\n\t$(MAKE) -C etc install-clients CLIENTS=sample\n\t$(MAKE)\
    \ -C man install-man-4 MAN4=sample_cs.4\n```\n\ndist:\n\n```\ntar czvf sample_cs.tar.gz\
    \ $(FILES)\n```\n\n此 Makefile 使用 PCMCIA 软件包 2.9.10 及更高版本中的 install 目标。为了方便作者，此\
    \ Makefile 还包含了一个 \"dist\" 目标。你可能想为最终的包文件名添加版本号（例如 sample_cs-1.5.tar.gz）。一个完整的分发如下：\n\
    \n```\nsample_cs.nk\nREADME.sample_cs\nmodules/sample_cs.c\nmodules/sample_cs.h\n\
    etc/sample.conf\netc/sample\netc/sample.opts\nman/sample_cs.4\n```\n\n通过这种安排，当贡献的驱动被解压时，它会成为\
    \ PCMCIA 源码树的一部分。它可以利用 PCMCIA 头文件以及检查用户系统配置的机制和自动依赖检查，就像“正常”的客户端驱动一样。\n\n在这个示例中，/etc/sample\
    \ 和 /etc/sample.opts 将是新驱动程序的配置脚本（如果需要），而 /etc/sample.conf 将包含对 PCMCIA 卡配置文件的任何添加。从\
    \ 3.1.6 版本开始，cmmgr 将自动处理安装在 /etc/pcmcia 中的 *.conf 文件，因此安装贡献的驱动程序不再需要手动编辑配置文件。\n\
    \n我将接受按照此规范准备的客户端驱动，并将它们放置在 projects.sourceforge.net 的 /pub/pcmia-cs 目录下。该目录下的\
    \ README 将描述如何解压非贡献的驱动。\n\n客户端驱动接口随时间推移变化不大，并且始终保持向后兼容。对于主包的微小修订，客户端驱动不需要更新。我将尝试通知贡献驱动的作者关于需要更新其驱动的更改。\n\
    \n## 7.7 Linux 发行版维护者指南\n\n如果你有希望系统配置工具具备 PCMCIA 感知，请使用 /etc/pcmcia 中的 *.opts\
    \ 文件，如果用户编译并安装 PCMCIA 软件包的新版本，这些文件不会被修改。如果你修改了配置脚本，全新的安装将静默地覆盖你的自定义脚本并破坏与你的配置工具的连接。如果你不确定如何编写适当的脚本，或者你需要额外的功能，请联系我。\n\
    \n如果你能记录你的发行版与本文描述的 PCMCIA 软件包之间的差异，对你（对我）来说是有帮助的。特别是记录对启动脚本和配置脚本的更改。如果你向我发送适当的信息，我将将其包含在\
    \ 2.6（关于特定发行版的说明）中。\n\n在为发行版构建 PCMCIA 时，考虑包含不是 PCMCIA 软件包一部分的贡献驱动。出于可维护性的考虑，我正尝试限制核心包的大小，只有当我认为某些驱动具有特别广泛的兴趣时才添加新驱动。其他驱动程序将按照上一节所述单独分发。集成驱动和独立驱动之间的划分在某种程度上是任意的，且部分出于历史原因，不应意味着质量上的差异。\n\
    \n"
