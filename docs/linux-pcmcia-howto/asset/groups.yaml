    host opts: [ring] [serial peri & irq] [pci irq 11] ...

    host opts: [ring] [serial peri & irq] [pci irq 11] ...

    ISA irqs (scanned) = 3,4 PCI status changes

    ```


    “routing table”（路由表）消息表示找到了有效的路由表。“host opts”（主机选项）行指示了中断交付模式，以及是否能为每个插槽确定 PCI
    中断。最后几行显示了可用中断的扫描结果。


    ## 5.2.2 PCI BIOS 未检测到 CardBus 桥器


    症状：


    - Intel PCI probe：未找到。

    - 桥器未在 `lpci` 或 `/proc/pci` 中显示。


    Lucent/SCM PCI 转 CardBus 适配器似乎在某些其他系统上让 PCI BIOS 产生了困惑。Lucent 表示，这仅支持支持 PCI 2.2
    规范或符合 PC99 标准的系统。某些系统完全无法检测到 Lucent 卡，如果系统没有检测到它，Linux 驱动程序就无法使用它。唯一的可能解决方法是升级
    BIOS，或者使用不同的主板或 CardBus 适配器。


    ## 5.2.3 PCI 中断交付问题


    症状：


    - 卡片配置正确，但无法工作。

    - `/proc/interrupts` 显示 PCMCIA 驱动程序的中断计数为 0。


    CardBus 桥器通常支持两种类型的中断：PCI 和 ISA。部分由于历史原因，习惯上是使用 PCI 中断来信号卡插入和拔出事件以及 CardBus 中断；而将
    ISA 中断用于 16 位卡。从 3.1.9 版本开始，这是 Linux PCMCIA 系统默认使用的方案。大多数 CardBus 桥器支持多种向主机 CPU
    交付中断的方法。方法包括：“并行”中断（每个支持的 irq 在桥器上都有专用引脚）；各种串行中断协议（使用一个或两个引脚与中断控制器通信）；以及混合模式（PCI
    中断可能使用专用引脚信号，而 ISA 中断通过串行控制器交付）。


    通常情况下，BIOS 负责为桥器编写适当的中断交付方法。然而，某些系统执行得不正确，在某些情况下，软件无法安全地检测到正确的方法。i82365 模块在启动时报告桥器，并有一个参数
    `irq_mode` 可用于识别。并不是所有的桥器都支持此参数，且 `irq_mode` 的意义取决于桥器类型。请参阅 i82365 手页以获取支持的值描述。在某些情况下，桥器可能在多种中断模式下正常工作。


    大多数适合 PCI 总线插槽的 PCI 读卡器提供 PCI 中断路由。Linux 驱动程序假设所有桥都有中断能力，这在笔记本电脑上通常是正确的。对于卡读卡器，通常需要使用
    `irq_mode` 参数来指定“仅 PCI”的中断交付模式；该值取决于桥器类型，请检查 i82365 手页。少数 PCI 读卡器需要允许 ISA 中断的
    `irq_mode`，但这些中断并未连接；在这种情况下，请使用 `irq_list=0`。


    检查系统日志并验证 CardBus 是否有 PCI 中断分配。如果没有，请解决该问题，如果中断仍然存在，请返回此处。接下来，尝试对 `irq_mode` 参数的不同值进行实验。


    ## 5.2.4 无 PCI 中断分配；有效的路由表


    症状：


    - Intel PCI probe 对每个插槽报告“no pci irq”。

    - 存在路由表，且路由器类型受支持。


