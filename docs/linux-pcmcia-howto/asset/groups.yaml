    # 2. Compilation and installation


    +   - The PLX Technologies PCI9052 (also sold as the Linksys WDT11) is not a general
    purpose PCMCIA reader all; it is a PCI interface card for use with wireless adapters,
    that makes them look like ordinary PCI devices. These devices are not supported.


    # 2.5 System resource settings


    Card Services should ideally avoid locking IO ports and interrupts in use by other
