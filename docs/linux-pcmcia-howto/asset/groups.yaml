    # 5.4.3 Installing an initrd image on a non-Linux drive


    One consequence of using the initrd facility would be on systems where the internal
    hard drive is dedicated to another operating system. The Linux kernel and initrd
    image can be placed in a non-Linux partition, and lilo or LOADLIN can be set up
    to boot Linux from these images.


    Assuming that you have a kernel has been configured for the appropriate root device,
    and an initrd image created on another system, the easiest way to get started
    is boot Linux using LOADLIN, as:


    ```

    LOADLIN <kernel> initrd-<image>

    ```


    Once you boot Linux on your target machine, you could install lilo to allow booting
    Linux directly. For example, that /dev/hd1 is the non-Linux target partition and
    /mnt can be used as a mount point. Create a subdirectory for the target on the
    Linux files:


    ```

    mount /dev/hd1 /mnt

    mkdir /mnt/linux

    cp [kernel-image] /mnt/linux/vmlinuz

    cp [initrd-image] /mnt/linux/initrd

    ```


    In this example, that /dev/sda1 is the desired Linux root partition, a SCSI hard
    drive mounted via a PCMCIA SCSI adapter. To install lilo, create a lilo.conf file
    with the contents:'
  - '[PAGE 48]


    # 6. Dealing with unsupported cards


    ```

    boot=/dev/hda

    map=/mnt/linux/map

    compact

    image=/mnt/linux/vmlinuz

    label=linux

    root=/dev/sda1

    initrd=/mnt/linux/initrd

    read-only


    other=/dev/hda1


    table=/dev/hda

    label=windows

    ```


    The boot= line says to install the boot loader in the master boot record of the
    specified device. The root= line identifies the desired root filesystem to be
    used after loading the initrd image, and may be unnecessary if the kernel is already
    configured this way. The other= section is used to describe the other operating
    system installed at /dev/sda1.


    To install lilo in this case,


    ```

    lilo -C lilo.conf

    ```


    Note that in this case, the lilo.conf file uses absolute paths that include /mnt.
    I did in this example because the target filesystem may not support the creation
    of Linux device files for the boot= and root=.


    # 6 Dealing with unsupported cards


    # 6.1 Configuring unrecognized cards


    Assuming your card is supported by an existing driver, all that needs to be done
    is to add an entry to /etc/pcmia/config to tell cardidgr how to identify the card,
    and which driver(s) need to be linked up to this card. Check the page for pcmia
    for more information about the config format. If you insert an unknown card, cardidgr
    will normally report some identification information in the system log that can
    be used to construct the config entry. This information can also be displayed
    with the "cardctl ident",


    Here is an example of how cardidgr will report an unsupported card in the system
    log:


    ```

    cardidgr[460]: unsupported card in socket 1

    cardidgr[460]: product info: "MEGAHERZ,XJ2288","V.34 PCIA MODEM"

    cardidgr[460]: manid: 0x001,0x1234 function: 2 (serial)

    ```


    The corresponding entry in /etc/pcmia/config would be:


    or using the more compact product IDs:'
  - '[PAGE 49]


    # 6. Dealing with unsupported cards


    ```

    card "Megahertz XJ2288 V.34 Fax Modem"

    mif 0x0101, 0x1234

    bind "serial_cs"

    ```


    You can use "*" to match strings that don''t need to match exactly, like version
    numbers. When making new config entries, be careful to pick the strings exactly,
    preserving care and blank spaces. Also be sure that the config entry has the same
    number of strings as are reported in the log file.


    Beware that you can specify just any driver for a card, but if you''re shooting
    in the dark, there is not much reason to expect this to be productive. You may
    get lucky and find that your card is supported by an existing driver. However,
    the most likely outcome is that the driver won''t work, and you may have unfortunate
    side effects like locking up your system. Most ordinary device drivers, which
    probe for an appropriate card, the probe for a PCMCIA device is by cardmgr, and
    the driver itself may not do much validation before attempting to communicate
    with the device.


    After editing /pcmia/config, you can signal cardmgr to reload the file with:


    ```

    kill -HUP ''cat /var/run/cardmgr.pid''

    ```


    If you set up an entry for a new card, please send me a copy so that I can include
    it in the standard config file.


    # 6.2 Adding support for the NE2000-compatible ethernet card


    Before you begin: this procedure will work for simple 16-bit ethernet cards. Multifunction
    cards (i.e., ethernet, modem combo cards) have an extra layer of complexity regarding
    how the two functions are integrated, and generally cannot be supported without
    some configuration information from the card vendor. Using the following procedure
    for a multifunction card will not be productive.


    First, see if the card is already recognized by cardmgr. Some cards are not listed
    in SUPPORTED.CARDS are actually OEM versions of cards that are supported. If you
    find a card like this, let me know so I can add it to the list.


    If your card is not recognized, follow the instructions in the 6.1 (Configuring
    unrecognized cards) to create a config entry for your card, and bind the card
    to the pnet_cs driver. Start cardmgr to use the updated config file.


    If the pnet_cs driver shows that it is unable to determine your card''s hardware
    address, then indent your new config entry to bind the card to the memory card
    driver, memory_cs. Start cardmgr to use the new config file. You will need to
    know your card''s hardware address. This address is a series of six-digit hex
    numbers, often printed on the card itself. If it is not printed on the card, you
    may be to use a DOS driver to display the address. In any case, once you know
    it, run:


    ```

    dd if=dev/mem count=20 | od -x t i

    ```


    and search the output for your address. Even the bytes are defined, ignore the
    odd bytes in the dump. Record the hex offset of the first byte of the address.
    Now, edit clients/pcnet_cs.c and find the hw_info structure. You''ll need to create
    a new entry for your card. The first field is the memory offset. The next three
    fields are the first three bytes of the hardware address. The final field contains
    some flags for card features: to start, try setting it to 0.'
