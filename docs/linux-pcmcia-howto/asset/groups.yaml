    # 3. Resolving installation and configuration problems


    startup script is somewhat limited and did not allow PCMCIA startup variables
    to be overridden by the lilo boot.

    SuSE 8.0 includes the standalone PCMCIA modules, and the 2.4 kernel PCMCIA subsystem
    modules.

    A new variable, PCMCIA_SYSTEM, is available in /etc/sysconfig/pcmia to choose
    between these. It can be set to either ''kernel'' or ''external''.


    To look up PCMCIA issues in SuSE''s support database, go to <http://sdb.suse.de/cgi-bin/sdbsearch.cgi?stichtwort=PCMCIA>.


    # 3 Resolving installation and configuration problems


    This section describes some of the most common failure modes for the PCMCIA subsystem.
    Try to match your symptoms against the examples. This section only describes general
    failures that are not specific to a particular client driver or type of card.


    Before trying to diagnose a problem, you need to know your system log is kept
    (see 2.6 (Notes about Linux distributions)). You should also be familiar with
    basic diagnostic tools like dmesg and lsmod. Also, be aware that many driver components
    (including all kernel modules) have their own man pages.


    In 3.1.5 and later releases, the debug-tools subdirectory of the PCMCIA source
    tree has a few scripts to help diagnose some of the most common problems. The
    test-setup script checks your PCMCIA installation for completeness. The test-network
    and test-mod scripts will try to diagnose problems with PCMCIA network and modem
    cards. These scripts can be particularly helpful if you are unfamiliar with Linux
    and are not sure how to approach a problem.


    Try to define your problem as normally as possible. If you have several cards,
    try each card in isolation, and in different combinations. Try cold boots, versus
    boots from Windows. Compare booting with cards inserted, versus inserting cards
    after boot. If you normally use your laptop docked, try it undocked. And sometimes,
    two sockets behave differently.


    For debugging in the device configuration scripts, it may be useful to use cardmgr
    with the “-v” option. With a 3.1.23 or later PCMCIA package, this will cause most
    important script actions to be recorded in the system log.


    It is nearly impossible to debug driver problems when attempting to install Linux
    via a PCMCIA device. Even if you can identify the problem based on its symptoms,
    installation disks are difficult to modify, especially without access to a running
    Linux system. Customization of installation disks is completely dependent on the
    choice of Linux distribution, and is beyond the scope of this document. In general,
    the best course of action is to install Linux using some other means, obtain the
    latest drivers, and then debug the problem if it persists.


    # 3.1 Base PCMCIA kernel modules do not load


    Symptoms:


    +   - Kernel version mismatch errors are reported when the PCMCIA startup script
    runs.

    - After startup, lsmod does not show any PCMCIA modules.'
