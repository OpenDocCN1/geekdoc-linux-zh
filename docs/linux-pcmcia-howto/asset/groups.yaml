  mdcn: '


    ## 4. 使用与特性


    ```

    DOMAIN="domain.org"

    DNS_1="dns1.domain.org"

    nesac

    ```


    为了自动挂载和卸载 NFS 文件系统，首先将所有文件系统添加到 `/etc/fstab`，包含 `network.opts`，并在 `MOUNTS` 变量中列出文件系统的挂载点。当
    NFS 挂载激活时，使用 `cardctl` 或 `cardinfo` 关闭网络尤为重要。在不弹出（eject）的情况下插入新网卡，是无法干净地卸载 NFS
    文件系统的。


    除了常规的网络配置参数外，`network.opts` 脚本还可以指定在接口配置后或接口关闭前采取的额外操作。如果 `network.opts` 定义了一个名为
    `start_fn` 的 shell 函数，网络脚本将在接口配置后调用它，并将接口名称作为其第一个（也是唯一的）参数传递给该函数。如果定义了 `stop_fn`，则会在关闭之前调用它。


    某些（大多数旧型号）卡的收发器类型必须使用 `IF_PORT` 设置手动选择。这可以是一个数值，也可以是识别收发器类型的关键字。所有网络驱动程序默认会尽可能自动检测接口，否则默认为
    10base。可以使用 `ifport` 命令来检查或设置当前的收发器类型。例如：


    ```

    # ifport eth0 10base2

    #

    ifport eth0

    eth0 2 (10base2)

    ```


    大多数现代 10/10baseT 卡使用“介质独立接口”（MII）收发器，该收发器可自动选择速度和双工设置。可以使用 `mii-tool` 命令监控和控制
    MII 接口的行为。


    ### 4.3.2 关于特定网卡的注释


    - 对于 IBM CCAE 和 Socket E 卡，在配置网络设备时需要设置收发器（10base2、10baseT、AUI）。确保系统日志中报告的收发器与你的连接相匹配。

    - Farallon EtherWave 实际上基于 3Com 3c589，并带有特殊的收发器。尽管 EtherWave 使用 10baseT 风格的连接，但它要求将
    3c589 配置为 10base 模式。

