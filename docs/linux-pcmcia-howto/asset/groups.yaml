    # 2. Compilation and installation


    # Include 32-bit (CardBus) card support?


    This option must be selected if you wish to use 32-bit CardBus cards. It is not
    required for CardBus bridge support, if you only plan to use 16-bit PC Cards.


    # Include PnP BIOS resource checking?


    This builds additional code into the PCMCIA core module to communicate with a
    system''s BIOS to obtain resource information for built-in "motherboard" devices
    (serial and parallel ports, sound, etc), to help avoid resource conflicts. If
    enabled, some resource files will be created at `/proc/bus/pcard`, and the lmsp
    and setp pools can be used to manage PnP BIOS devices. However, this setting causes
    problems on some laptops and is not turned on default.


    # Module install directory?


    The directory where new kernel modules will be installed into. Normally this should
    be the subdirectory of /lib/modules that matches your kernel version.


    # How to set kernel-specific options?


    There are a few configuration options that affect the PCMCIA systems. The configuration
    script can deduce these from the running kernel (the default and most common case).
    Alternatively, if you are compiling for installation on another machine, you can
    read the configuration from a kernel source tree, or each option can be set.


    The Configure script can also be executed non-actively, for automatic builds or
    to quickly reconfigure after a kernel update. Some additional less-frequently-used
    options can only be set from the command line. Running `Configure --help` lists
    all available options.


    Running `make install` followed by build and install the kernel modules and programs.
    Kernel modules are installed under `/lib/modules/<version>/pcmcia`. The cardmgr
    and cardctl1 programs are installed in `/sbin/pcmcia`. If Cardbus is enabled,
    it is installed in `/usr/bin/X11`.


    Configuration files will be installed in the `/etc/pcmcia`. If you are installing
    over an older version, your config scripts will be backed up before being replaced.
    The saved scripts will be given a ~.old extension.


    If you do not know which controller you use, use the pcmcia probe within the cardmgr/
    subdirectory to determine this. There are several major types: the Databook TCIC-2
    type and the Intel I2365SL-compatible type. With the kernel PCMCIA subsystem,
    intel controllers are further subdivided into ISA-bus 16-bit busses, and PCI-based
    CardBus devices.


    In a few cases, the pcmcia_probe will be unable to determine your controller automatically.
    If you have a Halikan NBD 186 system, it has a TCIC-2 controller at an unknown
    location: you will need to edit rc.pcmcia to load the tcic module, and also set
    the PCIC_OPTS parameter to `tcic_base=0x02c0`.


    On old pre-PCI systems using Cirrus Controllers, including the NEC Vers M, the
    BIOS puts the controller in a suspended state at system startup. Then the pcmcia_probe
    will fail to find any known host controller. If this happens, edit rc.pcmcia and
    set PCIC to i28365, and PCIC_OPTS to `wakeup=1`.


    # 2.4 Startup options


    The PCMCIA startup script recognizes groups of startup options, via environment
    variables. Multiple options should be separated by spaces and enclosed in quotes.
    Placement of startup options depends'
  - '[PAGE 9]


    # 2. Compilation and installation


    on the Linux distribution used. They may be placed directly in the startup script,
    or they may be kept in a separate option file. The 2.6 (Notes about specific Linux
    distributions) for specifics. The following variables can be set:


    PCMCIA


    This variable specifies whether PCMCIA support should be started up, or not. If
    it is set to anything other than “yes”, then the startup script will be disabled.


    PCIC


    This identifies the PC Card Interface Controller driver module. There are several
    options: “tcic”, “i82365”, and (for the kernel PCMCIA subsystem) “yenta_socket”.
    Virtually all current controllers are in the “i82365” group for the standalone
    drivers, and “yenta_socket” for the kernel drivers. This is the only mandatory
    option.


    PCIC_OPS


    This specifies options for the PCIC module. Some host controllers have optional
    features that may or not be implemented in a particular system. In some cases,
    it is impossible for the driver to detect if these features are implemented. See
    the corresponding man page for a complete description of the available options.


    CORE_OPS


    This specifies options for the pcmcia_core module, which implements the core PC
    Card driver services. See “man pcmcia_core” for more information.


    CARDMGR_OPS


    This specifies options to be passed to the cardmgr daemon. See “man cardmgr” for
    more information.


    SCHEME


    If set, then the PC Card configuration scheme will be initialized to this driver
    startup time. See the 4.2 (Overview of the PCMCIA configuration scripts) for a
    discussion of schemes.


    The low level drivers, tic and i82365, have various timing parameters that may
    need to be adjusted for systems with unusual blocking. Symptoms of timing problems
    can include recognition problems, lock-ups under heavy loads, high error rates,
    or poor device performance. Only certain host bridges have adjustable timing parameters:
    check the corresponding man page to see what options are available for your controller.
    Here is a summary:


    +   - ISA-Bus controllers have numerous timing parameters. The most important
    ones seems to be the cmd_time flag, which determines the length of PCMCIA bus
    cycles. Fast 486 systems (i.e., DX-100) seem to benefit from increasing this from
    6 (the default) to 12 or 16.


    +   - The Osiris GD672 PCI controller has the fast_pci flag, which should be set
    if the PCI bus speed is greater than 25 MHz.


    +   - For Vadem VG-468 controllers, the async_clock flag changes the relative
    clock of PCMCIA bus and host bus cycles. Setting this flag adds extra wait states
    to some operations. However, I have yet to hear of a laptop that needs this.'
  - '[PAGE 10]


    # 2. Compilation and installation


    +   - The Pcmcia_core module has the cis_speed parameter for changing the memory
    used for accessing a card''s Information Structure (CIS). On some systems, increasing
    this parameter (i.e., slowing down card accesses) may fix card recognition problems.


    +   - Another pcmcia_core_parameter, io_speed, can be used to slow down accesses
    to IO cards. It may help in certain cases with systems that have out-of-spec PCMCIA
    bus.


    +   - This is not a timing issue, if you have more than one ISA-to-PCMCIA controller
    in your system or extra sockets in a laptop docking station, the i12365 module
    should be loaded with the extra_sockets parameter set to 1. This should not be
    necessary for detection of PCI-to-PCMCIA or PCI-to-CardBus bridges.


    Here are some settings for few old systems:


    +   - On the ARM Pentium-90 or Midwest Micro Soundbook Plus, use "freq_bypass=1
    cmd_time=8"


    +   - On a Compaq Presario 1220, try "setup_time=1"


    +   - On a Midwest Micro Soundbook Elite, use "cmd_time=12"


    +   - On a Gateway Liberty, try "cmd_time=16"


    +   - On a Samsung S810, try "fast_pci=1"


    # 2.4.1 Card readers for desktop systems


    While all PCMCIA card readers and card docks work fine under Linux, some require
    startup options because they do not behave exactly like laptop PCMCIA bridges.
    PCI card readers, in particular, may handle interrupts differently; some of the
    following parameter settings are only available for the i12365 module in the standalone
    driver; the kernelenta_socket driver is not configurable.


    +   - The Linksys ProConnect PCMRDRW and Antec DataChute ISA card readers are
    "ISA Plug and Play". To use them, you must first activate them with the Linux
    is tools. See the pages for pnpdump and isapp for information.


    +   - For CardPort and Altec ISA card readers using the Circus PD6722 ISA-to-PCMCIA
    bridge, the i12365 driver requires a "has_ring=0" parameter to prevent irq5 conflicts.


    +   - For Elan P-series card readers on the Circus PD6729 PCI-to-PCMCIA bridge
    chip, the i12365 driver requires a "irq_mode=1" parameter.


    +   - For the Sycard PCHost120 hot adapter, the i12365 driver requires a "p2cclk=1"
    parameter.


    +   - For the Alex Electronics PCIBC host adapter based on the TI 1221 bridge,
    the i12365 driver requires "p2cclk=1 irq_mode=0" as well as the PCMCIA driver
    release 3.1.3 or later.


    +   - With SCM Microystems SBP PCI card readers (which are also being distributed
    with Lucent WaveLAN IEEE cards), and for the Synrotech PCM-CR-PC2IF and PCM-CR-PC2IR,
    it is necessary to specify "irq_mode=0" for the i12365 module, to force use of
    PCI interrupts.


    +   - For the ActionTec 750 card reader and the Antec Datachi card reader, the
    i12365 driver requires a "irq_list=0" parameter, to indicate that ISA interrupts
    are unavailable.'
