    ## 3. 解决安装和配置问题


    在大多数情况下，插槽驱动程序（i82365 和 tcic）会自动探测并选择合适的中断来信号显卡状态的变化。自动中断探测在 Intel 兼容控制器上将无法工作，包括
    Cirrus 芯片以及在某些 IBM ThinkPads 中使用的芯片。如果设备在探测期间处于非活动状态，其中断可能可能显示为可用。在这些情况下，插槽驱动程序可能会选取一个正被另一个设备使用的中断。


    对于 i82365 和 tcic，可以使用 `irq_list` 选项来限制测试的中断。此列表限制了 PCMCIA 卡可以使用以及用于监控状态变化的中断集。`cs_irq`
    选项也可以用于显式设置用于监控状态变化的中断。


    如果你无法找到可用的中断，还有一种轮询模式：i82365 和 tcic 均接受 `poll_interval=100` 选项，每秒轮询一次卡状态。如果你的系统可用供
    PCMCIA 使用的中断短缺，也应该使用此选项。特别是对于具有多个控制器的系统，专门分配中断用于监控卡状态变化的意义不大。


    所有这些选项都应该在 `/etc/rc.d/pcmia` 或 `/etc/sysconfig/pcmia` 的 PCIC_OPTS 行中设置，取决于你的站点设置。


    ### 3.7 中断交付问题


    症状：


    - 卡显示配置成功，但无法工作。

    - 串口卡和调制解器卡响应非常缓慢。

    - 网卡可能报告“中断丢失 (interrupt(s) dropped)”或传输超时。


    最简单的中断交付问题是由于与其他系统设备的冲突引起的。这些通常可以通过在 `/etc/pcmia/config.opts` 中排除故障中断来解决。测试时，逐个排除中断，直到问题解决或用完所有中断。如果没有中断可以工作，那么设备冲突可能不是问题所在。


    对于 CardBus 桥器，可能会出现各种其他中断交付问题。欲详细讨论，请参见 5.2.3（PCI 中断交付问题）。


    ### 3.8 系统资源饥饿


    症状：


    - 当插入卡时，它被正确识别但无法配置（高/低蜂鸣声模式）。

    - 系统日志中将出现以下消息之一：


    ```

    RequestIO: Resource in use

    RequestIRQ: Resource in use

    RequestWindow: Resource in use

    GetNextTuple: No more items

    could not allocate mn IO ports for CardBus socket n

    could not allocate nn memory for CardBus socket n

    could not allocate interrupt for CardBus socket n

    ```


    中断饥饿通常表明中断探测存在问题（参见 3.3 中断扫描失败）。在某些情况下，探测似乎有效，但只报告了一个或两个可用中断。检查你的系统日志以查看扫描是否合理。禁用探测并手动选择中断应该有所帮助。


    如果中断探测工作不正常，插槽驱动程序可能会为插入操作分配中断，即使中断极其稀缺以至于这样做并不理想。你可以通过将 `PCI_OPTS` 设置为 `"poll_interval=100"`
    将控制器切换到轮询模式。或者，如果你有一个 CardBus 控制器和旧版本的 PCMCIA 驱动程序，使用 `"pci_cse=1"` 选择一个 PCI 中断（如果可用）用于卡状态变化。


    在某些情况下，内核配置错误也会导致表面的中断短缺。在 2.4 及更新后的内核中，如果没有启用 `CONFIG_ISA`，那么 PCMCIA 总线中断是可用的。


    IO 端口共享并不常见见，但有时发生在需要大对齐 IO 端口空间区域的卡上，或者可能只能识别少数特定的 IO 端口位置。`/etc/pcmia/config.opts`
    中的默认 IO 端口范围通常是足够的，但可以扩展。如果这是问题所在，可以在 config.opts 中使用 `include 0x1000-0x1fff`
    行。在少数情况下，饥饿可能表示 IO 探测失败（参见 3.4 IO 端口失败）。


    在 config.opts 的默认内存窗口中，内存饥饿也不常见见。CardBus 卡可能比典型的 16 位卡需要更大的内存区域。由于 CardBus 内存窗口可以映射到主机的
    PCI 地址空间的任何位置（而不仅仅是 PC 系统中 640K-1MB 的“空洞”），在高内存中指定大型内存窗口（例如 0xa0000000-0xa0fffff）是有帮助的。


    ### 3.9 仅在插入两个卡时发生资源冲突


    症状：


    - 两张卡在单独使用时均工作正常。

    - 当两张卡都插入时，只有一张工作。


    这通常表示与 Linux 不知道的系统设备存在资源冲突。PCMCIA 设备是动态配置的，例如，中断是按需分配的而不是而不是分配给特定的卡或插槽。给定一个可用资源列表，卡按照它们配置的顺序分配资源。在这种情况下，最后被分配到资源的卡的资源实际上并不是空闲的。


    检查系统日志以查看未工作的卡使用了哪些资源。从 `/etc/pcmia/config.opts` 中排除这些资源，并重启 configmgr 守护进程以重新加载资源数据库。


    ### 3.10 设备配置未完成




    症状：


    - 当插入卡时，恰好听到一声高音蜂鸣声。

    - 后续的卡插入可能会被忽略。


    这表明卡已被识别，但 `cardmgr` 无法完成配置。最可能的原因是设置脚本阻塞了。要确定问题，你可以手动运行设置脚本以查看阻塞在何处。`cardmgr`
    守护进程还显示网络状态。例如，网络命令的输出可能如下：


    ```

    poll_interval=100

    ```


    ## 4. 使用与功能


    ### 4.1 配置工具


    当插入卡时，恰好听到一声高音蜂鸣声。后续的卡插入可能会被忽略。这表明卡已被识别，但 `cardmgr` 无法完成配置。最可能的原因是设置脚本阻塞了。要确定问题，你可以手动运行设置脚本以查看阻塞在何处。`cardmgr`
    守护进程还显示网络状态。例如，网络命令的输出可能如下：


    ```

    poll_interval=100

    ```


    | 模块 | 大小 | 使用者 |

    | :--- | :--- | :--- |

    | i82365 | 2 | |

    | linksYS | 2 | |

    | pcmia_core | 3 | |


    ### 4.1.1 卡状态守护进程


    `cardmgr` 守护进程负责监控 PCMCIA 插槽、加载驱动程序以及响应卡变化的运行脚本。它还显示系统日志中的状态。高蜂鸣表示成功，低蜂鸣表示卡未识别。更多信息请参见手册页。


    ### 4.1.2 stab 文件


    `cardmgr` 在 `/var/lib/pcmia/stab` 中记录每个插槽的设备信息。这是一个示例列表：


    | 插槽 | 类 | 驱动程序 | 名称 | 主/次号 |

    | :--- | :--- | :--- | :--- | :--- |

    | 0 | scsi | Adapatec-1460 | sda | 8 |

    | 0 | scsi | aha152 | scd0 | 11 |

    | 1 | serial | ttyS1 | |


    对于描述设备的行，第一行是插槽，第二行是设备类，第三行是设备驱动程序，第四行是具有相同驱动程序的多个设备，第五行是设备名称，最后两个是设备的主次号（如果适用）。


    CardBus 卡的热插拔 PCI 驱动程序不由 `cardmgr` 管理；它们由热插拔内核管理。有关此信息请参见 http://linux-hotplug.sourceforge.net。当
    `cardmgr` 看到由 PCI 驱动的卡时，它将忽略该卡。插入或弹出卡时会报警，但在系统日志和 stab 文件中仅会被识别为“CardBus 热插拔设备”。


    ### 4.1.3 cardctl 和 cardinfo 工具


    `cardctl` 命令可检查插槽状态或查看其如何配置。它也用于更改卡的配置状态。以下是 `cardctl config` 命令输出的示例：


    ```

    Socket 0:

    not configured

    Socket 1:

    Vcc = 5.0, Vpp1 = 0.0, Vpp2 = 0.0

    Card type is memory and I/O

    IRQ 3 is dynamic shared, level mode, enabled

    Speaker output is enabled

    Function 0:

    Config register base = 0x0800

    Option = 0x063, status = 0x008

    I/O window 1: 0x0280 to 0x2bf, auto sized

    I/O window 2: 0x02f8 to 0x2ff, 8 bit

    ```


    或者使用 `cardctl ident` 获取识别信息：


    ```

    Socket 0:

    no product info available

    Socket 1:

    product info: "LINKSYS", "PCMLM336", "A", "0040052d6400"

    manif: 0x0143, 0x0cab

    function: 0 (multifunction)

    ```


    '
