    \n# 4.5.2 Diagnosing problems with parallel port devices\n\n# 4.6 PCMCIA SCSI\
    \ adapters\n\nAll the supported SCSI cards are work-alikes of one of the following\
    \ ISA bus cards: the QLogic, the Adaptec-AHA-152X, or the Future Domain TMC-160.\
    \ The PCMCIA drivers are built by linking PCMCIA-specific code (in qlogic_cs.cs,\
    \ aha152x_cs.cs, and fdomain_cs.cs) with the Linux SCSI driver, from the Linux\
    \ kernel source. The Adaptec APA1480 CardBus driver is based on the kernel aextxxx\
    \ PCI driver. Due to limitations in the Linux driver model, only one removable\
    \ card per device is supported.\n\nWhen a new SCSI adapter is detected, the SCSI\
    \ drivers will probe for devices. Check the system log to make sure your devices\
