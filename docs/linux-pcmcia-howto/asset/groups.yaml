    Services 应用程序接口（API）、一组用于服务卡的客户端驱动程序，以及一个可以响应插入和移除事件、加载和卸载驱动程序的管理器守护进程（daemon）。它支持大多数卡类型的“热插拔”，因此可以随时安全地插入和拔出卡。


