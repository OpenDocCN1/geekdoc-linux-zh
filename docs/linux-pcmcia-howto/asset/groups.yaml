    大多数适合 PCI 总线插槽的 PCI 读卡器提供 PCI 中断路由。Linux 驱动程序假设所有桥器都有中断能力，这在笔记本电脑上通常是正确的。对于卡读卡器，通常需要使用
    `irq_mode` 参数来指定“仅 PCI”的中断交付模式；该值取决于桥器类型，请检查 i82365 手页。少数 PCI 读卡器需要允许 ISA 中断的
