  - '[PAGE 42]


    # 5. Advanced topics


    know the PCI interrupts are set up a certain way, even if you do not know how
    the router works.


    If you are problems that you think might be related to PCI interrupt configuration,
    you should first verify that you have a reasonably current PCMCIA driver package.
    Carefully look at the startup messages when the PCMCIA kernel modules loaded.
    You should see something like:


    ```

    Linux PCMCIA Card Services 3.1.18

    kernel build: [2.2.14-5] #1 May 9 10:44:42 PDT 2000

    options: [pci] [cardbus] [apm] [pnp]

    pci routing table version 1.0 at 0xfdf30

    Intel PCI probe

    TI 1126 rev 02 PCI-CardBus at slot 00:07, mem 0x20000000

    host opts: [ring] [serial peri & irq] [pci irq 11] ...

    host opts: [ring] [serial peri & irq] [pci irq 11] ...

    ISA irqs (scanned) = 3,4 PCI status changes

    ```


    The "routing table" message indicates that a valid routing table was found. The
    "host opts" lines indicate the interrupt delivery mode and whether or not a PCI
    interrupt could be determined for each socket. And the final lines indicate the
    results of the scan for available interrupts.


    # 5.2.2 CardBus bridge is not detected by the PCI BIOS


    Symptoms:


    +   * Intel PCI probe: not found.

    * The bridge does not show up in lpcci or in /proc/pci.


    The Lucent/SCM PCI-to-CardBus adapters seem to confuse the PCI BIOS on some other
    systems. Lucent says that this is only supported on systems that have a BIOS that
