    # 3. Resolving installation and configuration problems


    There are two ways to proceed:


    +   - The ISA interrupt probe can be restricted to a list of interrupts using
    the irq_list parameter for the socket driver. For example, "irq_list=5,9,10" would
    limit the scan to three interrupts. All 16-bit PCMCIA devices will be restricted
    to these interrupts (assuming they pass the probe). You may need to use trial
    and error to find out which interrupts can be safely probed.

    - The interrupt probe can be disabled entirely by loading the socket driver with
    the "do_scan=0" option. In this case, a default interrupt list will be used, which
    avoids interrupts already allocated for other devices.


    In either case, the probe options can be specified using the PCIC_OPTS definition
    in the PCMCIA startup script, for example:


    ```

    PCIC_OPTS=irq_list=5,9,10

    ```


    It should be noted that /proc/interrupts is completely useless unless you come
    to diagnosing interrupt probe problems. The probe is sensible to never attempt
    to use an interrupt that is already in use by any Linux driver. So, the PCMCIA
    drivers are already using all the information in /proc/interrupts. Depending on
    system design, an inactive device can still occupy an interrupt and cause trouble
    if it is probed for PCMCIA.


    # 3.4 IO port scan failures


    Symptoms:


    +   - The system locks up when cardmgr is first started. For 3.1.24, the lockup
    happens even with no cards present; for 3.1.25, a card must be inserted.

    - The system log shows a successful host controller probe, including interrupt
    probe results, but does not show IO results.

    - In some cases, the IO probe will succeed, but report large numbers of random
    exclusions.


    cardmgr processes IO ranges listed in /etc/pcmia/config.opts, the kernel probes
    these ranges to detect devices that occupy IO space but are not associated with
    a Linux driver. The probe is read-only, but in rare cases, reading from a device
    may interfere with an important system function, resulting in a lock-up.


    Your user''s guide may include a map of system devices, showing their IO and memory
    ranges. These can be explicitly excluded using config.opts.


    Alternatively, if the probe is unreliable on your system, it can be disabled by
    setting CORE_OPTS="probe_io=0". In this case, you should be very careful to specify
    only genuinely available ranges of ports in config.opts, instead of using the
    default settings.


    # 3.5 Memory probe failures


    Symptoms:'
  - '[PAGE 18]


    # 3. Resolving installation and configuration problems


    +   - The core drivers load correctly when no cards are present, with no errors
    in the system log.

    - The system freezes and/or reboots as soon as any card is inserted, before any
    beeps are heard.


    Or alternatively:


    +   - All card insertions generate a high beep followed by a low beep.

    - All cards are identified as “anonymous memory cards”.

    - The system log reports that various memory ranges have been excluded.


    The core modules perform a memory scan at the time of 16-bit card insertion. This
    scan can potentially interfere with other memory mapped devices. Also, pre-pc3.0
    driver packages perform a more aggressive scan than recent drivers. The memory
    window is defined in /etc/pcmia/config.opts. The default window is large, so it
    may help restrict the scan to a narrower range. Reasonable ranges to include 0xd0000-0xdffff,
    0x0000-0xcfff, 0x8000-0xffff, or 0xd8000-0xffff.


    If you have DOS or Windows PCMCIA drivers, you may be able to reduce memory region
    those drivers use. Note that DOS memory addresses in “segment form”, which leaves
    off the final hex digit (an absolute address of 0xd0000 might be as 0xd000). Be
    sure to add the extra digit when making changes to config.opts.


    Changing BIOS settings affecting how devices are mapped can sometimes be useful.
    Try changing settings for BIOS shadowing, or “Plug and Play OS”.


    In unusual cases, a memory probe failure can indicate a timing setup problem with
    the host controller. See the 2.4 (Startup options) section for information about
    dealing with common timing problems. This really only applies to ISA-to-PCMCIA
    bus bridges.


    +   - cs: no high memory space available!


    CardBus bridges allocate memory windows outside of the 64KB-1MB “memory hole”
    in the ISA architecture. It is generally a good idea to configure CardBus bridges
    to use high memory, because these are unlikely to conflict with other devices.
    Also, CardBus cards may require large memory windows, which might be difficult
    or impossible to fit into low memory. Card Services will preferentially allocate
    windows in high memory for CardBus bridges, if both low and high memory windows
    are defined in config.opts. The default config.opts includes several candidate
    high memory windows, of which will work in most cases.


    # 3.6 Failure to detect card insertions and removals


    Symptoms:


    +   - Cards are detected and configured properly at boot time.

    - The drivers do not respond to insertion and removal events, either by recording
    events in the system log, or by beeping.'
