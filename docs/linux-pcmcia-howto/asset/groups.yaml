    ftl0c0\" 设备是卡 0、通用内存区域 0 的整个区域。\"ftl0c0p1\" 到 \"ftl0c0p4\" 设备是如果区域已分区，主分区 1 到\
    \ 4。\n\nFTL 分区的配置选项可以在 ftl.opts 中给出，其结构与 memory.opts 相似。传递给 ftl.opts 的设备地址由三个或四个字段组成：方案，\n\
    \n"
