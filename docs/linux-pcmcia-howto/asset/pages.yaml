    \ you must modify /etc/pcmia/config to indicate that the serial module should\
    \ be loaded before serial_cs.\n\n# 4.5 PCMIA parallel port devices\n\nThe Linux\
    \ parallel port driver is layered so that several high-level device types can\
    \ share use of the same low level port driver. Printer devices are accessed via\
    \ the /dev/lp* special device. The configuration of a printer device can be examined\
    \ and modified with the junto command.\nThe purport_cs module depends on the purport\
    \ and purport_re drivers, which may be either compiled into the kernel as modules.\
    \ The layered driver structure means that any top-level parallel devices (such\
    \ as the plip driver, the printer driver, etc) must be compiled as modules. These\
