    \ multiport serial cards or multifunction cards that include serial or modem devices\
    \ requires CONFIG_SERIAL_SHARE_IRQ to be enabled.\n\n+   - The SCSI client drivers\
    \ require that CONFIG_SCSI be enabled, along with the appropriate top level driver\
