- pgno: 21
  md: '# 4. Usage and features


    +   - When a card is inserted, exactly one high beep is heard.


    +   - Subsequent card insertions and removals may be ignored.


    This indicates that the card was identified successfully, however, cardmgr has
    been unable to complete the configuration process for some reason. The most likely
    reason is that a step in the card setup script has blocked. A good example would
    be the network script blocking if a network card is inserted with no actual network
    hoax present.


    To pinpoint the problem, you can manually run a setup script to see where it is
    blocking. The scripts in the /etc/pcmcia directory. They take two parameters:
    a device name, and an action. The cardmgr daemon records the configuration commands
    in the system log. For example, if the system log shows /network start eth0 was
    the last command executed by cardmgr, the following command would trace the script:


    ```

    sh -x /etc/pcmcia/network start eth0

    ```


    # 4 Usage and features


    # 4.1 Tools for configuring and monitoring PCMCIA


    If the modules are all loaded correctly, the output of the lsmod command should
    look like the following, when no cards are inserted:


    | Module | Size | Used by |

    | --- | --- | --- |

    | ds | 5640 | 2 |

    | i82365 | 15542 | 2 |

    | pcmcia_core | 30012 | 3 [ds i82365] |


    The system log should also include output from the socket driver describing the
    host controller(s) and found the number of sockets detected.


    # 4.1.1 The cardmgr configuration daemon


    The cardmgr daemon is responsible for monitoring PCMCIA sockets, loading client
    drivers when needed, and running user-level scripts in response to card insertions
    and removals. It records its actions in the system log, but also uses beep to
    signal card status changes. The tones of the beeps indicate success or failure
    of particular configuration steps. Two high beeps indicate that a card was identified
    and configured successfully. A high beep followed by a low beep indicates that
    a card was identified, but could not be configured for some reason. One low beep
    indicates that a card could not be identified.


    The cardmgr daemon configures cards based on a database of known card types kept
    in /etc/pcmcia/config. This file describes the various client drivers, describes
    how to identify various cards, and which driver(s) belongs with which cards. The
    format of this is described in the pcmcia(S) man page.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 4. Usage and features


    # 4.1.2 The socket status file, stab


    Cardmgr records device information for each socket in /var/lib/pcmia/stab. Here
    is a sample stab listing:


    ```

    Socket 0: Adapatec APA-1460 SlimSCSi

    0       scsi      aha152s_cs  sda      8       0

    0       scsi      aha152s_cs  scd0     11      0

    Socket 1: Serial or Modem Card

    1       serial_cs  0         ttyS1    5       65

    ```


    For the lines describing devices, the first is the socket, the second is the device
    class, the third is the device driver, the fourth is used to number multiple devices
    with the same driver, the fifth is the device name, and the final two are major
    and minor device numbers for this device (if applicable).

    See the man page for more info.


    In 2.4 and later kernels, hot PCI drivers for CardBus cards are not managed by
    cardmgr; they are managed by the hotplug subsystem. See <http://linux-hotplug.sourceforge.net>
    for information about this. When cardmgr sees a card that is owned by a hot PCI
    driver, it will ignore that card. There will be one beep when cards are inserted
    or ejected, but they will be identified only as a "CardBus hotplug device" in
    the system log and stab file.


    # 4.1.3 The cardctl and cardinfo utilities


    The cardctl command can be used to check the status of a socket, or to see how
    it is configured. It also be used to alter the configuration status of a card.
    Here is an example of the output of the "cardctl config" command:


    ```

    Socket 0:

    not configured

    Socket 1:

    Vcc = 5.0, Vpp1 = 0.0, Vpp2 = 0.0

    Card type is memory and I/O

    IRQ 3 is dynamic shared, level mode, enabled

    Speaker output is enabled

    Function 0:

    Config register base = 0x0800

    Option = 0x063, status = 0x008

    I/O window 1: 0x0280 to 0x02bf, auto sized

    I/O window 2: 0x02f8 to 0x02ff, 8 bit

    ```


    Or "cardctl ident", to get identification information:


    ```

    Socket 0:

    no product info available

    Socket 1:

    product info: "LINKSYS", "PCMLM336", "A", "0040052d6400"

    manif: 0x0143, 0x0cab

    function: 0 (multifunction)

    ```'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 4. Usage features


    The "cardctl suspend" and "cardctl resume" commands can be used to shut down a
    card without loading its drivers. The "cardctl reset" command attempts to reset
    and configure a card. "cardctl insert" and "cardctl eject" mimic the actions performed
    when a card is physically inserted or ejected, including loading or unloading
    drivers, and configuring or shutting down devices.


    If you are running X, the cardinfo utility provides a graphical display showing
    the current status of PCMCIA sockets, in content to "cardctl config". It also
    provides a graphical interface to monitor cardctl functions.


    # 4.1. Inserting and ejecting cards


    In theory, you can insert and remove PCMCIA cards at any time. However, it is
    a good idea not to eject a card that is currently being used by an application
    program. Kernels older than 1.1.77 would lock up when serial/modern cards were
    used, but this should be fixed now.


    Some card types cannot be safely hot ejected. Specifically, ATA/IDE and SCSI interface
    cards are not hot-swap-safe. This is unlikely to be, because a complete solution
    would require significant changes to the Linux book driver model. Also, it is
    generally not to hot eject CardBus drivers of any type. This is to improve gradually
    for card types (IDE, SCSI, CardBus), it is recommended that you use "cardctl eject"
    before ejecting.


    # 4.1.5 Card Services and Advanced Power Management


    Card Services can be compiled with APM (Advanced Power Management) if you''ve
    configured your kernel with APM support. The APM kernel driver is maintained by
    Stephen Rothwell (Stephen.Rothwell@ann.aug.org.au). The apmd daemon is maintained
    by Avery Pennurun (apennarr@worldvisions.ca), with more information available
    at http://www.worldvisions.ca/apennarr/apmd/. The PCMCIA modules will automatically
    be configured for APM if a compatible version is detected on your system.


    Whether or not APM is configured, you can use "cardctl suspend" before suspending
    your laptop, and "cardctl resume" after resuming, cleanly shut down and restore
    your PCMCIA cards. This will not work with a modem that is in use, the serial
    driver isn''t able to save and restore the modern operating parameters.


    APM seems to be unstable on some systems. If you experience trouble with APM and
    PCMCIA on your system, try to narrow down the problem to one package or the other
    reporting a bug.


    Some drivers, the PCMCIA SCSI drivers, cannot recover from a suspend/resume cycle.
    When using a PCMCIA SCSI card, always use "cardctl eject" prior to suspending
    the system.


    # 4.1.6 Shutting down the PCMCIA system


    To unload the entire PCMCIA package, invoke rc.pcmcia


    ```

    /etc/rc/rc.pcmcia stop

    ```


    This script will take several seconds to run, giving all card drivers time to
    shut down gracefully. If a device is currently in use, the shutdown will be incomplete,
    and some kernel modules may not be loaded.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 4. Usage features


    avoid this, use "cardctl eject" to shut down all sockets before invoking rc.pcmcia.
    The exit status of the cardctl command will indicate if any sockets could be shut
    down.


    # 4.2 Overview of the PCMCIA configuration scripts


    The following information applies to cards that are managed by cardmgr. In 2.4
    and later kernels, the kernel PCMCIA subsystem is active, then CardBus are managed
    by the hotplug subsystem and the PCMCIA scripts are not used.


    Each PCMCIA device has an associated "class" that describes how it should be configured
    and managed. Classes are associated with drivers in /etc/pcmcia/config. There
    are currently five IO devices (network, SCSI, cdrom, fixed disk, and two memory
    devices (memory and FTL)). For each class, there are two scripts in /etc/pcmcia/
    (i.e., /etc/pcmcia/scsi for SCSI devices), and an option script (i.e., /etc/pcmcia/scsi.opts).
    The main script for a device will be invoked to configure when a device is /inserted,
    and to shut down the device when it is removed. Cards with several associated
    devices, the script will be invoked for each device.


    The first part of all addresses is the current PCMCIA "scheme". This parameter
    is used to support multiple sets of device configurations based on a single external
    user-specified variable. One of uses would be to have a "home" scheme and a "work"
    scheme, which would include different sets of network configuration parameters.
    The current scheme is selected using the "cardctl scheme" command. The default
    if no scheme is "default".


    There are a few additional variables that can be used in *.opts files in addition
    to ADDRESS:


    SOCKET, CLASS, DRIVER, DEVICE, MAJOR, MINOR


    These correspond to individual fields from one line in the stab file. It is its
    page for details.


    PROID_1, PROID_2, PROID_3, PROID_4, MANID, FUNCID


    These are equivalent to the output of "cardctl info" and give more detailed card
    identification information.


    As *.opts files are just shell scripts, it is not required that they follow the
    form of the examples, which just return settings based on ADDRESS.


    As a general rule, when configuring Linux for a laptop, PCMCIA devices should
    only be configured from the PCMCIA device scripts. Do not try to configure a PCMCIA
    device the same way you would configure a permanently attached device. However,
    some distributions provide PCMCIA packages that are hooked into those distributions''
    own device configuration tools. In some case, some of the following sections may
    not apply; ideally, this will be documented by the distribution maintainers.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "# 4. Usage and features\n\n# 4.3 PCMCIA network adapters\n\nLinux ethernet-network\
    \ interfaces normally have names like eth0, eth1, and so on. Token-ring adapters\
    \ are handled similarly; however they are named tr0, tr1, and so on. The ifconfig\
    \ command is used to view or modify the state of a network interface. A peculiarity\
    \ of Linux is that network interfaces do not have corresponding device files under\
    \ /dev, so do not be surprised when you do not find them.\n\nWhen an ethernet\
    \ card is detected, it will be assigned the first free interface name, which will\
    \ normally be eth0. Cardmgr uses the /etc/pcmcia/network script to configure the\
    \ interface, which normally reads network settings from /etc/pcmcia/network.opts.\
    \ The network and network.opts scripts will be executed only when your ethernet\
    \ card is actually present. If your system has an automatic network configuration\
    \ free, it may not be PCMCIA-aware. Consult the documentation of your Linux distribution\
    \ and the 2.6 (Notes about Linux distributions) to determine if PCMCIA network\
    \ devices should be configured with the automatic tools, or by editing network.opts.\n\
    \nThe device address in network.opts consists of four comma-separated fields:\
    \ the scheme, the socket number, the device instance, and the card's hardware\
    \ ethernet address. The device instance is used to number devices for cards that\
    \ have several network interfaces, it is usually be 0. If you have several network\
    \ cards used for different purposes, one option would be to configure the cards\
    \ based on socket position, as in:\n\n```\ncase \"ADDRESS\" in\n  *,*\n    # definitions\
    \ for network card in socket 0\n    ;\n  *,1,\\*\n    # definitions for network\
    \ card in socket 1\n    ;\n  esac\n```\n\nAlternatively, they could be configured\
    \ using their hardware addresses, as in:\n\n```\ncase \"$ADDRESS\" in\n  *,*,00:B0:C8:76:00:B1\n\
    \    # definitions for a D-Link card\n    ;\n  *,*,:08:00:5A:44:80:01\n    # definitions\
    \ for an IBM card\nesac\n```\n\n# 4.3.1 Network device parameters\n\nThe following\
    \ parameters can be defined in network.opts:\n\nIF_PORT\n\n+   - Specifies the\
    \ ethernet transceiver type, for certain 16-bit cards that do not autodetect.\
    \ See “man ifport” and “man mii-tool” for more information.\n\nBOOTP\n\n+   -\
    \ A boolean (y/n) value: indicates if the host's IP address and routing information\
    \ should be obtained using the BOOTP protocol, with bootpc or pump."
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 4. Usage and features


    DHCP


    A boolean (y/n) value: indicates if the host''s IP address and routing information
    should be from a DHCP server. The network script first looks for dhcpcd, then
    dhclient, then pump.


    DHCP_HOSTNAME


    Specifies a hostname to be passed to dhcpcd or pump, for inclusion in DHCP messages.


    IPADDR


    The IP address for this interface.


    NETMASK, BROADCAST, NETWORK


    Basic network parameters: see the networking HOWTO for more information.


    GATEWAY


    The IP address of a gateway for this host''s subnet. Packets with destinations
    outside this subnet will be routed to this gateway.


    DOMAIN


    The local network domain name for this host, to be used in creating /etc/resolv.conf.


    SEARCH


    A search list for host lookup, to be added to /etc/resolv.conf. DOMAIN and SEARCH
    are mutually exclusive: see "man resolver" for more information.


    DNS_1, DNS_2, DNS_3


    Host names or IP addresses for nameservers for this interface, to be added to
    /etc/resolv.conf


    MOUNTS


    A space-separated list of NFS mount points to be mounted for this interface.


    IPX_FRAME, IPX_NETNUM


    For IPX networks: the frame type and network number, passed to the ipx_interface
    command.


    NO_CHECK, NO_FUSER


    Boolean (y/n) setting for card edit policy. If NO_CHECK is set, "cardctl eject"
    will shut down a device if there are open connections. If NO_FUSER is set, then
    the script will not check for busy NFS mounts or processes using those mounts.


    For example:


    ```

    case "ADDRESS" in

    *|*,*)

    IF_PORT="10base2"

    BOOT="n"

    IPADDR="10.0.0.1"

    NETMASK="255.255.255.250"

    NETWORK="10.0.0.0"

    BROADCAST="10.0.0.255"

    GATEWAY="10.0.0.1"

    ```'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 4. Usage and features


    ```

    DOMAIN="domain.org"

    DNS_1="dns1.domain.org"

    nesac

    ```


    To automatically mount and unmount NFS filesystems, first add all the filesystems
    to /etc/fstab, include network.opts, list the filesystem mount points in the MOUNTS
    variable. It is especially important to use either cardctl or cardinfo to shut
    down a network when NFS mounts are active. It is not possible to cleanly un NFS
    filesystems when a new card is inserted without ejecting.


    In addition to the usual network configuration parameters, the network.opts script
    can specify extra actions to be taken after an interface is configured, or before
    an interface is shut down. If network.opts defines a shell function called start_fn
    it will be invoked by the network script after the interface is configured, and
    the interface name will be passed to the function as its first (and only) argument.
    If it is defined, stop_fn will be invoked before shutting down.


    The transceiver type for some (most old) cards must be manually selected using
    the IF_PORT setting. This can be either a numeric value, or a keyword identifying
    the transceiver type. All the network drivers default to either autodetect the
    interface if possible, or 10base otherwise. The ifport command can be used to
    check or set the current transceiver type. For example:


    ```

    # ifport eth0 10base2

    #

    ifport eth0

    eth0 2 (10base2)

    ```


    Most modern 10/10baseT cards use a "media independent interface" (MII) transceiver
    that automatically selects speed and duplex setting. The mii-tool command can
    be used to monitor and control the behavior of the MII interface.


    # 4.3.2 Comments about specific cards


    +   - With IBM CCAE and Socket E cards, the transceiver (10base2, 10baseT, AUI)
    needs to be set when the network device is configured. Make sure that the transceiver
    is reported in the system log matches your connection.

    - The Farallon EtherWave is actually based on the 3Com 3c589, with a special transceiver.
    Though the EtherWave uses 10baseT-style connections, it requires that the 3c589
    be configured in 10base mode.

    - If you have trouble with IBM CCAE, NE4100, Thomas Conrad, or Kingston adapter,
    increasing the memory access with the mem_speed=# option to the pcnet_cs module.
    An example of how to do this is in the standard config.opts file. Try speeds up
    to 1000 (in nanoseconds).

    - For the New Media Ethernet adapter, on some systems, it may be necessary to
    increase the IO access time with the io_speed=# option when the pcmcia_core module
    is loaded. Edit CORE_OPTS in the startup script to set this option.

    - The multicast support in the New Media Ethernet driver is incomplete. The latest
    driver will function with multicast kernels, but will ignore multicast packets.
    Promiscuous mode should work properly.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 4. Usage features


    +   The driver used by the IBM and 3Com ring adapters seems to behave very badly
    when the cards are not connected to a ring when they connect the cards before
    they are powered up. If ifconfig reports the hardware address as all 0''s, this
    is likely to be due to a memory configuration problem.


    +   Some Linksys, D-Link, and IC-Card 10baseT/10base2 cards have a unique way
    of selecting the transceiver that is handled by the Linux drivers. One workaround
    is to boot DOS and the vendor-supplied utility to select the transceiver, then
    boot Linux. Alternatively, to perform this function is available at <http://pcmia-source.sourceforge.net/ftp/extras/dlport.c>.


    +   16-bit PCMC cards have a maximum performance of 1.5-2 MB/sec. That means that
    any 16-bit bitbaseT card (i.e., any card that uses the pcnet_cs, 3c574_cs, sm9c12_cs,
    or xirp2_cs) will never achieve full 100baseT throughput. Only CardBus network
    adapters can fully exploit 100baseT rates.


    +   For WaveLAN wireless network adapters, Jean Tourrilles (jet6pl.com) has put
    a together wireless HOWTO at <http://www.hpl.com/personal/Jean_Tourrilles/Linux/>.


    # 4.3.3 Designing with network adapters


    +   In 3.1.15 and later PCMCIA releases, the test_network script in the debug-tools
    subdirectory of the PCMCIA source will spot some common problems.


    +   Is your card recognized as an ethernet card? Check the system log and make
    sure that cardmgr identifies the card correctly and starts up one of the network
    drivers. If it doesn''t, your card might still be usable if it is compatible with
    a supported card. This will be most easily done if the card claims to be "NE2200
    compatible".


    +   Is the card configured properly? If you are using a supported card, and is
    recognized by cardmgr, but still doesn''t work, there may be an interrupt or port
    conflict with another device. Find out what resources the card is using (from
    the system log), and excluding these in /etc/pcmia/config.opts to force the card
    to use something different.


    +   If your card needs to be configured properly, sometimes loops up, particularly
    under high load, you may need to change your socket driver tuning parameters.
    The 2.4 (Startup options) section for more information.


    +   If you get "Network is unreachable" messages when you try to access the network,
    then the routing information in /etc/pcmia/network.opts is incorrect. This message
    is an absolute foolproof of a routing error. On the other hand, mis-configured
    cards will fail silently.


    +   If you are trying to use DHCP to configure your network interface, try testing
    with a static IP address route, to rule out a DHCP configuration problem.


    +   To diagnose problems in /etc/pcmia/network.opts, start by pinging to other
    systems on the same subnet using your IP addresses. Then to ping your gateway,
    and machines on other subnets. Ping machines by name only after trying these simpler
    tests


    +   Make sure your problem is really a PCMCIA one. One may help to see if the
    card works under DOS with the vendor''s drivers. Double check your modifications
    to the /etc/pcmia/network.opts script. Make sure your drop cable, "T" jack, terminator,
    etc are working.'
  merge: -1
  img_proc: true
- pgno: 29
  md: "# 4. Usage and features\n\n+   - Use real network cables. Don't even think\
    \ about using that old phone cord you found in your basement. This means Category\
    \ 5 cable for 100baseT. It really matters.\n\n# 4.4 PCMCIA serial and modem devices\n\
    \nLinux serial devices are accessed via the /dev/tty* and /dev/cua* special files.\
    \ In pre-2.2 kernels, the tty* devices were for incoming connections, such as\
    \ directly connected terminals, and the cua* devices were for outgoing connections,\
    \ such as modem. Use of cua* is deprecated in current kernels, and tty* can be\
    \ used for all applications. The configuration of a serial device can be examined\
    \ and modified with the serial command.\n\nWhen a serial device is detected, it\
    \ will be assigned to the first available serial device slot. This will usually\
    \ be /dev/tty1 or /dev/tty2, depending on the number of built-in serial ports.\
    \ The tty* is the one reported in stab. The default serial device option, /etc/pcmcia/serial.opts,\
    \ will link the device to /dev/modem as convenience. For pre-2.2 kernels, the\
    \ link is made to the cua* device.\n\nDo not try to use /etc/rd.rc to configure\
    \ a PCMCIA modem. This script should only be used to configure non-removable devices.\
    \ Modify /etc/pcmcia/serial.opts if you want to do anything to set up your modem.\
    \ Also, do not try to change the IO port and interrupt settings of a serial device\
    \ using setserial This would tell the serial driver to lock the device in a different\
    \ place, but would not change how the card's hardware is acquired. The configured\
    \ script allows you to specify other serial options, as well as have line be added\
    \ to /etc/initab for this port.\n\nThe device address passed to serial.opts has\
    \ three comma-separated fields: the first is the scheme, the second is the socket\
    \ number, and the third is the device instance. The device instance may take several\
    \ values for cards that support multiple serial ports, but for single-port cards,\
    \ it will always be 0. If you commonly use more than one modem, you may want to\
    \ specify different settings based on socket position, as in:\n\n```\ncase \"\
    ADDRESS\" in\n0,)\n# Options for modem in socket 0\nLINK=/dev/modem0\n  ;\n1,)\n\
    # Options for modem in socket 1\nLINK=/dev/modem1\n  ;\nesac\n```\n\nIf a PCMCIA\
    \ modem is properly configured when Linux boots, it may be incorrectly identified\
    \ as an ordinary built-in serial port. This is harmless, however, when the PCMCIA\
    \ devices take control of the modem, or it is assigned a different device slot.\
    \ It is better to either stab or use /dev/modem, rather than expecting a PCMCIA\
    \ modem to always have the same device assignment.\n\nIf you configure your kernel\
    \ to load the basic serial port driver as a module, you must edit /etc/pcmcia/config\
    \ to indicate that this modem must be loaded. Edit the serial device entry to:\n\
    \n```\ndevice \"serial_cs\"\nclass \"serial\" module \"misc/serial\", \"serial_cs\"\
    \n```"
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 4. Usage and features


    # 4.4.1 Serial device parameters


    The following parameters can be defined in serial.opts.


    LINK


    Specifies a path for a symbolic link to be created to the "callout" device (e.g.,
    /dev/cua* for pre-2.2, or /dev/ttyS* for 2.2 kernels).


    SERIAL_OPTS


    Specifies options to be passed to the setserial command.


    INITTAB


    If specified, this will be used to construct an inittab entry for the device.


    NO_CHECK, NO_FUSER


    Boolean (y/n) settings for card eject policy. If NO_CHECK is true, "cardctl eject"
    will shut down a device even if it is busy. If NO_FUSER is true, the script will
    not try to kill processes with an ejected device.


    For example:


    ```

    case "$ADDRESS" in

    *,*)

    LINK="/dev/modem"

    SERIAL_OPTS=""

    INITTAB="sbin/getty

    ```


    # 4.4.2 Comments about specific cards


    +   - The Uniden Data 2000 Wireless CDPD card has some special dialing strings
    for initiating SLIP and PPP mode. For SLIP, use "ATDTD2"; for PPP, "ATDTD0"

    - Socket II serial port cards have a faster-than-normal clock rate for the UART.
    The card''s actual baud rate is four times faster than serial driver it is. To
    work around the problem, specify SERIAL_OPTS="baud_base 460800" in /etc/pcmia/serial.opts.


    # 4.4.3 Diagnosing problems with serial devices


    +   - In 3.1.5 and later PCMCIA, the test_modem script in the debug-tools subdirectory
    of the PCMIA source tree will show some common problems.

    - Is your recognized as a modem? Check the system log and look for message that
