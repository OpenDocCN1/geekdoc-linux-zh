  md: "# 4. Usage features\n\nHere is an example of a script that will automatically\
    \ mount memory cards based on which socket they inserted into:\n\n```\ncase \"\
    ADDRESS\" in\n*0,0)\n  # Mount filesystem, but don't update /etc/fstab\n  DO_FSTAB=\"\
