    # 6.2 Adding support for the NE2000-compatible ethernet card


    Before you begin: this procedure will work for simple 16-bit ethernet cards. Multifunction
    cards (i.e., ethernet, modem combo cards) have an extra layer of complexity regarding
    how the two functions are integrated, and generally cannot be supported without
    some configuration information from the card vendor. Using the following procedure
    for a multifunction card will not be productive.


    First, see if the card is already recognized by cardmgr. Some cards are not listed
    in SUPPORTED.CARDS are actually OEM versions of cards that are supported. If you
    find a card like this, let me know so I can add it to the list.


    If your card is not recognized, follow the instructions in the 6.1 (Configuring
    unrecognized cards) to create a config entry for your card, and bind the card
    to the pnet_cs driver. Start cardmgr to use the updated config file.


    If the pnet_cs driver shows that it is unable to determine your card''s hardware
    address, then indent your new config entry to bind the card to the memory card
    driver, memory_cs. Start cardmgr to use the new config file. You will need to
    know your card''s hardware address. This address is a series of six-digit hex
    numbers, often printed on the card itself. If it is not printed on the card, you
    may be to use a DOS driver to display the address. In any case, once you know
    it, run:


    ```

    dd if=dev/mem count=20 | od -x t i

    ```


    and search the output for your address. Even the bytes are defined, ignore the
    odd bytes in the dump. Record the hex offset of the first byte of the address.
    Now, edit clients/pcnet_cs.c and find the hw_info structure. You''ll need to create
    a new entry for your card. The first field is the memory offset. The next three
    fields are the first three bytes of the hardware address. The final field contains
    some flags for card features: to start, try setting it to 0.'
