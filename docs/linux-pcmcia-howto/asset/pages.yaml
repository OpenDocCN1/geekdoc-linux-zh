    may be signalled using dedicated pins, ISA interrupts are delivered via a serial
    controller.


    In general, it is the responsibility of the BIOS to program a bridge for the appropriate
    interrupt delivery method. However, there are systems that do this incorrectly,
    and in some cases, there is no way for software to safely detect the correct method.
    The 182365 module reports the bridge at startup, and has a parameter, irq_mode,
    that can be used to recognize.. Not all bridges support this parameter, and the
    meaning of irq_mode depends on the bridge type. See the 182365 man for a description
    of what values are supported by it. In some cases, a bridge may function correctly
    in more than one interrupt mode.


    Most PCI card readers that fit in a PCI bus slot provide PCI interrupt routing.
    The Linux drivers assume that all bridges have interrupt capability, which is
    generally correct on laptops. With a card reader, it will generally be necessary
    to use the irq_mode parameter to specify a "PCI only" interrupt delivery mode;
    the value depends on the bridge type, check the 182365 man. Few PCI card readers
    require irq_mode that permits ISA interrupts, but those interrupts are not actually
    connected; in that case, use `irq_list=0`.


    Check the system log and verify that the CardBus has a PCI interrupt assignment.
    If it does not, resolve that problem, then return here if the interrupts persist.
    Next, experiment with different values for the irq_mode parameter.


