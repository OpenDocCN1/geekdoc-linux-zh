    # 5.2.2 CardBus bridge is not detected by the PCI BIOS


    Symptoms:


    +   * Intel PCI probe: not found.

    * The bridge does not show up in lpcci or in /proc/pci.


    The Lucent/SCM PCI-to-CardBus adapters seem to confuse the PCI BIOS on some other
    systems. Lucent says that this is only supported on systems that have a BIOS that
    supports the PCI 2.2 specification, or are PC99 compliant. Some systems will not
    detect the Lucent card at all, and if the system''t detect it, the Linux drivers
    cannot use it. The only possible resolutions are a BIOS upgrade, or using a different
    motherboard or CardBus adapter.


    # 5.2.3 PCI interrupt delivery problems


    Symptoms:


    +   * Cards to be configured correctly, but do not work.

    * /proc/interrupts shows a count of 0 for interrupts to PCMCIA drivers.


    CardBus bridges generally support two types of interrupts, PCI and ISA. Partly
    for historical reasons, it has become conventional to use PCI interrupts for signaling
    card insertion and removal events, and for CardBus interrupts; and ISA interrupts
    for 16-bit cards. Since version 3.1.9, this is the scheme that the Linux PCMCIA
    system will use by default. Most CardBus bridges support multiple methods for
    delivering interrupts to the host CPU. Methods include “parallel” interrupts,
    where each supported irq has a dedicated'
