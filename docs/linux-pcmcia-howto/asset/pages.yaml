    \ be loaded after any PC parallel devices are configured.\nThe device address\
    \ passed to purport.opts has three comma-separated fields: the first is the scheme,\
    \ the second is the socket number, and the third is the device instance. The device\
    \ instance may take several values for cards that support parallel ports, but\
    \ for single-port cards, it will always be 0. If you commonly use more than one\
    \ card, you may want to specify different settings based on socket position,\n\
    \n```\ncase \"ADDRESS\" in\n  ,*)\n    # Options for card in socket 0\n    LINK=/dev/printer0\n\
