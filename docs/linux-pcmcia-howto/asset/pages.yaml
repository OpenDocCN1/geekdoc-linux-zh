- pgno: 40
  md: '# 5. Advanced topics


    # # 5 Advanced topics


    # ## 5.1 Resource allocation for PCMCIA devices


    In theory, it should not really matter which interrupt is allocated to device,
    as long as two devices are not configured to use the same interrupt. In /etc/pcmia/config.opts
    you''ll find a place for excluding interrupts that are used by non-PCMCIA devices.


    Similarly, there is no way to directly specify the I/O addresses for a card to
    use. The /etc/pcmia/config.opts file allows you to specify ranges of ports available
    for any card, or to exclude ranges that conflict with other devices.


    After modifying /etc/pcmia/config.opts, you can re cardmgr with "kill -HUP".

    The interrupt used to monitor card status is chosen by the low-level socket driver
    module (i82365 or tcicb) by cardmgr parses /etc/pcmia/config, so it is not affected
    by changes to this file. To set this interrupt, use the cs_irq_opts when the socket
    driver is the PCIC_OPTS variable in /etc/rc.d/rc.


    All the client driver has have a parameter named irq_list for specifying which
    interrupts they may try to allocate. These driver options should be set in your
    /etc/pcmia/config file:


    ```

    device "serial_cs"

    module "serial_cs" opts "irq_list,8,12"

    ```


    would specify that the server driver should only use irq 8 or irq 12. Regardless
    of irq_list settings, Card Services will never allocate an interrupt that is already
    in by another device, or an interrupt that is excluded in the config file.


    # ## 5.2 PCI interrupt configuration problems and solutions


    Most of the following discussion applies to 2.2 and earlier kernels. With 2.4
    and later kernels, the PCI subsystem has most responsibility for PCI interrupt
    management. The following tips may help diagnose a problem, though some workloads
    described here may not be available.


    # ### 5.2.1 An overview of PCI interrupt routing issues


    Each slot has four PCI interrupt pins, INTA THROUGH INTD. Single functions will
    only use the INTA pin; multifunction devices may use multiple INT. On the processor
    side, on x86 processor systems, incoming hardware is routed to interrupt requests
    (irq''s) 0...15. The PCI interrupt router, usually part of the PCI-to-ISA host
    bridge, determines how incoming PCI interrupts are mapped to CPU irq numbers.
    Most modern bridge chips have several PCI interrupt inputs, known as PIR1, PIR2,
    etc, each of which can be routed to any CPU irq like:


    ```

    PCI slot 1 INTA --> router PIR1 --> CPU irq 9

    PCI slot 1 INTB --> router PIR2 --> CPU irq 10


    PCI slot 2 INTA --> router PIR2 --> CPU irq 10

    PCI slot 2 INTB --> router PIR1 --> CPU irq 9

    ```'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# 5. Advanced topics


    Multiple INTs are often connected to the same PIRQ pin. Usually, the connections
    from INT pins to PIRQ pins are spread installed devices out much as possible,
    to give the OS the most flexibility for choosing interrupts are shared. The mapping
    from bridge PIRQ pins to CPU irq numbers can be obtained by reading registers
    in the interrupt router. The mapping from INT pins to the router''s PIRQ pins,
    however, depends on how the board designer decided to connect things, and cannot
    be directly determined by driver software.


    For most PCI devices, the OS does not need to understand the interrupt router
    details. Each PCI device has a configuration register, the PCI Interrupt Line
    Register, the BIOS initializes with the appropriate CPU irq number for that device.
    Unfortunately, the BIOS will not configure interrupts for CardBus device devices.


    The BIOS''s Interrupt Routing Table is a structure that contains information about
    the mapping from PCI INT pins to the PIRQ pins on the interrupt router. The routing
    information in the table is stored in a somewhat unhelpful form. For each device''s
    INT pins, the table specifies a "link value". All interrupts with the same link
    value are wired to the same PIRQ pin; however, the meaning of the link values
    is defined by the chipset vendor.


    Several tools are available for examining PCI interrupt routing information:


    ```

    lspci, /proc/interrupts

    ```


    We will show you resource information (including interrupt assignments, where
    they are known) for all your PCI devices.


    dump_pirq is in the debug-tools directory of the PCMCIA source distribution. It
    dumps the contents of your PCI interrupt routing table, if available. It also
    scans for known interrupt routers and dumps their current interrupt settings.


    Several PCMCIA module parameters affect PCI interrupt:


    ```

    pcmcia_core module: cb_pci_irq=n

    ```


    This option specifies one interrupt number to be used to program the PCI interrupt
    router for CardBus sockets that do not already have an interrupt assignment. It
    only has any effect on systems that have a PCI irq routing table, and a known
    interrupt router.


    ```

    i82365 module: irq_mode=n

    ```


    CardBus devices offer several methods for delivering interrupts to the host. The
    i82365 module by default allows a bridge to deliver both PCI and ISA interrupts,
    which is normal for a laptop. Setting of "irq_mode=0" can be used to force a bridge
    to use only PCI interrupts. See the man page for i82365 module for a description
    of what other values mean for different bridge types.


    ```

    i82365 module: irq_list=n,n,...

    ```


    This parameter lists which ISA interrupt can be used for PCMCIA. If ISA interrupts
    are available, specify "irq_list=0" implies "irq_list=0".


    ```

    i82365 module: pci_irq_list=n,n,...

    ```


    This option specifies a list of PCI interrupt numbers to use for CardBus sockets.
    It differs from cb_pci_irq, because it does not actually program the PCI interrupt
    router; it can be used when you'
