- pgno: 18
  md: '# 3. Resolving installation and configuration problems


    +   - The core drivers load correctly when no cards are present, with no errors
    in the system log.

    - The system freezes and/or reboots as soon as any card is inserted, before any
    beeps are heard.


    Or alternatively:


    +   - All card insertions generate a high beep followed by a low beep.

    - All cards are identified as “anonymous memory cards”.

    - The system log reports that various memory ranges have been excluded.


    The core modules perform a memory scan at the time of 16-bit card insertion. This
    scan can potentially interfere with other memory mapped devices. Also, pre-pc3.0
    driver packages perform a more aggressive scan than recent drivers. The memory
    window is defined in /etc/pcmia/config.opts. The default window is large, so it
    may help restrict the scan to a narrower range. Reasonable ranges to include 0xd0000-0xdffff,
    0x0000-0xcfff, 0x8000-0xffff, or 0xd8000-0xffff.


    If you have DOS or Windows PCMCIA drivers, you may be able to reduce memory region
    those drivers use. Note that DOS memory addresses in “segment form”, which leaves
    off the final hex digit (an absolute address of 0xd0000 might be as 0xd000). Be
    sure to add the extra digit when making changes to config.opts.


    Changing BIOS settings affecting how devices are mapped can sometimes be useful.
    Try changing settings for BIOS shadowing, or “Plug and Play OS”.


    In unusual cases, a memory probe failure can indicate a timing setup problem with
    the host controller. See the 2.4 (Startup options) section for information about
    dealing with common timing problems. This really only applies to ISA-to-PCMCIA
    bus bridges.


    +   - cs: no high memory space available!


    CardBus bridges allocate memory windows outside of the 64KB-1MB “memory hole”
    in the ISA architecture. It is generally a good idea to configure CardBus bridges
    to use high memory, because these are unlikely to conflict with other devices.
    Also, CardBus cards may require large memory windows, which might be difficult
    or impossible to fit into low memory. Card Services will preferentially allocate
    windows in high memory for CardBus bridges, if both low and high memory windows
    are defined in config.opts. The default config.opts includes several candidate
    high memory windows, of which will work in most cases.


    # 3.6 Failure to detect card insertions and removals


    Symptoms:


    +   - Cards are detected and configured properly at boot time.

    - The drivers do not respond to insertion and removal events, either by recording
    events in the system log, or by beeping.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 3. Resolving installation and configuration problems


    In most cases, the socket driver (i82365 and tcic) will automatically probe and
    select an appropriate inter-rupt to signal card status changes. The automatic
    interrupt probe will not work on Intel-compatible controllers, including Cirrus
    chips and the chips used in some IBM ThinkPads. If a device is inactive probe
    time, its interrupt may also appear to be available. In these cases, the socket
    driver may pick an interrupt that is used by another device.


    With the i82365 and tcic, the irq_list option can be used to limit the interrupts
    that will be tested. This list limits the set of interrupts that can be used by
    PCMCIA cards as well as for monitoring status changes. The cs_irq option can also
    be used to explicitly set the interrupt to be used for monitoring status changes.


    If you can''t find an interrupt that works, there is also a polled status mode:
    both i82365 and tcic will accept a poll_interval=100 option, to poll for card
    status once per second. This option should also be used if your system has a shortage
    of interrupts available for use by PCMCIA. Especially for systems with more than
    one controller, there is little point in dedicating interrupts for monitoring
    card status changes.


    All these options should be set in the PCIC_OPTS line in either /etc/rc.d/pcmia
    or /etc/sysconfig/pcmia, depending on your site setup.


    # 3.7 Interrupt delivery problems


    Symptoms:


    +   * Cards appear to be configured successfully, but don''t work.

    * Serial and modem cards may respond very sluggishly.

    * Network cards may report ''interrupt(s) dropped'', and or transmit timeouts.


    The most simple interrupt delivery problems are due to conflicts with other system
    devices. These can generally be resolved by excluding problem interrupts in /etc/pcmia/config.opts.
    To test, exclude interrupts one by one until either the problem is fixed or you
    run out of interrupts. If no interrupts work, then device conflicts are probably
    not the problem.


    For CardBus bridges, a variety of other interrupt delivery issues may come into
    play. For a complete discussion, 5.2.3 (PCI interrupt delivery problems).


    # 3.8 System resource starvation


    Symptoms:


    +   * When a card is inserted, it is identified correctly but cannot be configured
    (high/low beep pattern).

    * One of the following messages will appear in the system log:


    ```

    RequestIO: Resource in use

    RequestIRQ: Resource in use

    RequestWindow: Resource in use

    GetNextTuple: No more items

    could not allocate mn IO ports for CardBus socket n

    ```'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 3. Resolving installation and configuration problems


    could not allocate nnK memory for CardBus socket n could not allocate interrupt
    for CardBus socket n


    Interrupt starvation often indicates a problem with the interrupt probe (see 3.3
    Interrupt scan failures)). In some cases, the probe will seem to work, but only
    report one or two available interrupts. Check your system log to see if the scans
    look sensible. Disabling the probe and selecting interrupts manually should help.


    If the interrupt probe is not working properly, the socket driver may allocate
    an interrupt for monitoring insertions, even when interrupts are too scarce for
    this to be a good idea. You can switch the controller to polled mode by setting
    PCI_OPTS to “poll_interval=100”. Or, if you have a CardBus controller and an older
    version of the PCMCIA drivers, “pci_cse=1”, which selects a PCI interrupt (if
    available) for card status changes.


    In some cases, kernel misconfiguration can also produce an apparent interrupt
    shortage. On 2.4 and later kernels, if CONFIG_ISA is not enabled, then the PCMCIA
    bus interrupts are available.


    IO port sharing is fairly uncommon, but sometimes happens with cards that require
    large, aligned regions of IO port space, or may only recognize few specific IO
    port positions. The default IO port ranges in /etc/pcmia/config.opts are normally
    sufficient, but may be extended. If this is the problem, using the “include” port
    0x1000-0x1fff line in config.opts. In rare cases, starvation may indicate that
    the IO probe failed (see 3.4 IO port failures).


    Memory starvation is also uncommon with the default memory windows in config.opts.
    CardBus cards may require larger memory regions than typical 16-bit cards. Since
    CardBus memory windows can be mapped anywhere in the host’s PCI address space
    (rather than just in the 640K-1MB “hole” in PC systems), it is helpful to specify
    large memory windows in high memory, such as 0xa0000000-0xa0fffff.


    # 3.9 Resource conflict only with two cards inserted


    Symptoms:


    +   * Two cards each work fine when used separately.

    * When both cards are inserted, only one works.


    This usually indicates a resource conflict with a system device that Linux does
    not know about. PCMCIA devices are dynamically configured, for example, interrupts
    are allocated as needed, rather than specifically assigned to particular cards
    or sockets. Given a list of resources that to be available, cards are assigned
    resources in the order they are configured. In this case, the card last being
    assigned a resource that in fact is not free.


    Check the system log to see what resources are used by the non-working card. Exclude
    these from /etc/pcmia/config.opts, and restart the configmgr daemon to reload
    the resource database.


    # 3.10 Device configuration does not complete


    Symptoms:'
