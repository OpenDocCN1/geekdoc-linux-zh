    # 4.8.2 Diagnosing problems with ATA/IDE adapters


    +   - An IO port fault may cause the IDE driver to misdetect the drive geometry
    and report “INVALID GEOMETRY: 0 PHYSICAL HEADS?”. To fix, try excluding the selected
    IDE port range in /etc/pcmia/config.opts.

    - Some IDE drives violate the PCMIA specification by requiring more time to spin
    up the maximum allowed setup time. This may result in “timed out during reset”
    messages at detect time. Adjust the unset_delay and/or unset_limit parameters
    for the pcmia_core module to give a drive more time to spin up; see the pcmia_core
    main page for details.

    - To use an ATA/IDE CD-ROM device, your kernel must be compiled with CONFIG_BLK_IDEDEC
    enabled. This will normally be the case for standard kernels, however it is something
    to be aware of if you compile a custom kernel.

    - A common error when trying to mount the wrong file. Generally, you want to mount
    a partition of the drive, not the entire device (i.e., /dev/hde1, /dev/hde).

    - The Linux IDE driver may have troubling certain removable-media drives if no
    media is present at insertion time. The IBM Portable DriveBay has this problem.

    - Some kernels will report a pair of “drive_cnd” errors at insertion time. These
    errors can be ignored; they pop up when you mount a removable IDE device does
    not accept the IDE “door lock” command.


    ```

    CORE_OPTS="unset_delay=40"

    ```


    # 4.9 Multifunction cards


    A single interrupt can be shared by several drivers, such as the serial driver
    and an ethernet driver: in fact, the PCMIA specification requires all card functions
    to share the same interrupt. Normally, all card functions are available without
    having to share drivers.


    Simultaneous use of two card functions is “tricky” and various hardware vendors
    have implemented interrupt sharing in their own incompatible (and sometimes proprietary)
    ways. The drivers for some cards (Ositech Jack of Diamonds, 3Com 3c362 and related
    cards, Linksys cards) properly support simultaneous access, but others (older
    Megahertz cards) do not. If you have trouble using a card with both functions
    active, try using each function in isolation. That may require explicitly doing
    an “ifconfig down” to shut down a network interface and a modem on the same card.'
