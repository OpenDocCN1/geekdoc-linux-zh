    # 6 Dealing with unsupported cards


    # 6.1 Configuring unrecognized cards


    Assuming your card is supported by an existing driver, all that needs to be done
    is to add an entry to /etc/pcmia/config to tell cardidgr how to identify the card,
    and which driver(s) need to be linked up to this card. Check the page for pcmia
    for more information about the config format. If you insert an unknown card, cardidgr
    will normally report some identification information in the system log that can
    be used to construct the config entry. This information can also be displayed
    with the "cardctl ident",


    Here is an example of how cardidgr will report an unsupported card in the system
    log:


