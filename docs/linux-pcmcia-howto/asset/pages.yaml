- pgno: 51
  md: '# 7. Debugging tips and programming information


    All the PCMCIA modules and the cardmgr daemon send status messages to the system
    log. These will usually end up somewhere like /var/log/messages or /var/log/daemon.log.
    These files should be the first place to look when down a problem. When submitting
    a bug report, also include the relevant contents of these files. If you are having
    trouble finding your system messages, check /etc/syslog.conf if


    Before submitting a bug report, please make sure that you are using an up-to-date
    copy of the driver package. While it is somewhat gratifying to read bug reports
    for things I''ve already fixed, it isn''t a particularly constructive use of time.


    If you do not web access, bug reports can be sent to me at dahinds@users.sourceforge.net.
    However, I prefer that bug reports be posted to the pcmia-cs SourceForge so they
    can be seen by others.


    # 7.2 Interpreting kernel trap reports


    If you involve a kernel fault, the register dump from the fault is only useful
    if you can translate the fault address, EIP, to something meaningful. Recent versions
    of klog can translate fault addresses by the current kernel symbol map, this may
    not work if the fault is in a module, or if the problem is severe enough that
    klog cannot finish writing the fault to the system log.


    If a fault is in the kernel, the fault address can be looked up in the System.map.
    This may be installed in /System.map or /boot/System.map. If a fault is in a module,
    the nm command gives the same information, the fault address has been adjusted
    based on the module''s load address. Let''s say that you have the kernel:


    ```

    Unable to handle kernel NULL pointer dereference

    current->tss.cr3 = 014c9000, xcr3 = 014c9000

    *pde = 00000000

    Dops: 0

    CPU: 0

    EIP: 0010:[c2026081]

    EFLAGS: 00010282

    ```


    The fault address is 0xc2026081. Looking at System.map, we see that this is past
    the end of the kernel, i.e., is in a kernel module. To determine which module,
    check the output of "ksym -m | sort":


    | Address Symbol Defined by |

    | c200d00 (35k) [pcmcia_core] |

    | c200d10 register_ss_entry [pcmcia_core] |

    | c200d230 register_ss_entry [pcmcia_core] |


    | c202600 (9k) [3c574_cs] |

    | c202a00 (4k) [serial_cs] |


