    One consequence of using the initrd facility would be on systems where the internal
    hard drive is dedicated to another operating system. The Linux kernel and initrd
    image can be placed in a non-Linux partition, and lilo or LOADLIN can be set up
    to boot Linux from these images.


    Assuming that you have a kernel has been configured for the appropriate root device,
    and an initrd image created on another system, the easiest way to get started
    is boot Linux using LOADLIN, as:


    ```

    LOADLIN <kernel> initrd-<image>

    ```


