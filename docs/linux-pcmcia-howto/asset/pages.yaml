  md: '# 4. Usage and features


    # 4.7 PCMCIA memory cards


    The memory_cs driver handles all types of memory cards, as well as providing direct
    access to the PCMCIA memory address space for cards that have other functions.
    When loaded, it creates a combination of character and block devices. See the
    main page for the module for a complete description of the device naming scheme.
    Block devices are for disk-like access (creating and mounting filesystems, etc.).
    The character devices are for "raw" unbuffered reads at arbitrary locations.


    The device address passed to memory.opts consists of two fields: the scheme, and
    the socket number. The options are applied to the first common partition on the
    corresponding memory card.


    Some flash cards, and most static RAM cards, load a "Card Information Structure"
    (CIS). Normally, cardmgr will assume that any card that has a CIS is a simple
    module and load the memory_cs driver. Thus, a common side effect of a general
    card identification problem is that other types of cards may be misdetected as
    memory cards.


    There is another issue to consider when handling memory cards that do not have
    CIS information. At startup, the PCMCIA package uses the first detected device
    to determine which memory regions are usable for PCMCIA. The memory scan can be
    fooled if that is a simple memory card. If you plan to use memory cards often,
    it is best to limit the memory windows in /etc/pcmcia/config.opts to known-good
    regions.


    The memory_cs driver uses a heuristic to guess the capacity of the cards. The
    heuristic does not work for written cards, and may make mistakes in other cases
    as well. If a card is misdetected, its size should then be explicitly specified
    using commands such as dd or mkfs. The memory_cs module also has a parameter for
    overriding the size detection. See the man page


    # 4.7.1 Memory device parameters


    The following parameters can be specified in memory.opts:


    DO_FSTAB


    A boolean (y/n) setting: specifies if an entry should be added to /etc/fstab for
    this device.


    DO_FSCK


    A boolean (y/n) setting: specifies if the filesystem should be checked before
    being mounted, with "fsck -Ta".


    DO_MOUNT


    A boolean (y/n) setting: specifies if this device should be automatically mounted
    at card insertion time.


    FSTYPE, OPTS, MOUNTP


    The filesystem type, mount options, and mount point to be used for the fstab entry
    and/or mounting device.


    NO_CHECK, NO_FUSER


    Boolean (y/n) settings for card eject policy. If NO_CHECK is true, "cardctl eject"
    will shut down a device even if it is busy. If NO_FUSER is true, the script will
    not try to kill processes using an ejected device.'
