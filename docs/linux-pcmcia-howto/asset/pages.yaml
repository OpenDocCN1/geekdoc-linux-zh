    # 3 Resolving installation and configuration problems


    This section describes some of the most common failure modes for the PCMCIA subsystem.
    Try to match your symptoms against the examples. This section only describes general
    failures that are not specific to a particular client driver or type of card.


    Before trying to diagnose a problem, you need to know your system log is kept
    (see 2.6 (Notes about Linux distributions)). You should also be familiar with
    basic diagnostic tools like dmesg and lsmod. Also, be aware that many driver components
    (including all kernel modules) have their own man pages.


    In 3.1.5 and later releases, the debug-tools subdirectory of the PCMCIA source
    tree has a few scripts to help diagnose some of the most common problems. The
    test-setup script checks your PCMCIA installation for completeness. The test-network
    and test-mod scripts will try to diagnose problems with PCMCIA network and modem
    cards. These scripts can be particularly helpful if you are unfamiliar with Linux
    and are not sure how to approach a problem.


    Try to define your problem as normally as possible. If you have several cards,
    try each card in isolation, and in different combinations. Try cold boots, versus
    boots from Windows. Compare booting with cards inserted, versus inserting cards
    after boot. If you normally use your laptop docked, try it undocked. And sometimes,
    two sockets behave differently.


    For debugging in the device configuration scripts, it may be useful to use cardmgr
    with the “-v” option. With a 3.1.23 or later PCMCIA package, this will cause most
    important script actions to be recorded in the system log.


    It is nearly impossible to debug driver problems when attempting to install Linux
    via a PCMCIA device. Even if you can identify the problem based on its symptoms,
    installation disks are difficult to modify, especially without access to a running
    Linux system. Customization of installation disks is completely dependent on the
    choice of Linux distribution, and is beyond the scope of this document. In general,
    the best course of action is to install Linux using some other means, obtain the
    latest drivers, and then debug the problem if it persists.


    # 3.1 Base PCMCIA kernel modules do not load


    Symptoms:


    +   - Kernel version mismatch errors are reported when the PCMCIA startup script
    runs.

    - After startup, lsmod does not show any PCMCIA modules.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Resolving installation and configuration problems


    +   - cardmgr reports "no pcmia driver in /proc/devices" in the system log.


    Kernel modules contain version information that is checked against the current
    kernel when a module is loaded. The type of checking depends on the setting of
    the CONFIG_MODVERSIONS kernel option. If this is false, the kernel version number
    is compiled into each module, and insmod checks for a match with the running kernel.
    If CONFIG_MODVERSIONS is true, each symbol exported by the kernel is given a sort
    of checksum. These codes are all compared against the corresponding codes compiled
    into each module. The intent was for this to make modules version-dependent, the
    checksums would only change if an interface changed, and generally stay the same
    across minor kernel updates. In practice, the checksums have turned out to be
    less restrictive, because many kernel interfaces depend on compile-time kernel
    options settings. The checksums turned out to be an excessively pessimistic judge
    of compatibility.


    The practical uplift is that kernel modules are closely tied to both the kernel
    version, and the setting of many kernel configuration options. Generally, a set
    of modules compiled for one 2.2.19 kernel will not load against other unless special
    care is taken to ensure the two were built with similar configurations. This distribution
    of precompiled kernel modules makes a tricky business.


    You have several options:


    +   - If you use precompiled modules as part of a Linux distribution, verify that
    you are using an unmodified kernel as supplied with that distribution. If you
    intend to use precompiled modules, you generally must stick with the corresponding
    kernel.

    - If you have reconfigured or upgraded your kernel, you will probably need to
    compile and install the PCMIA package from scratch. This is easily done if you
    already have the kernel source tree installed. See (Compilation and installation)
    for detailed instructions.

    - In some cases, incompatibilities in other system components can prevent correct
    loading of kernel modules. If you have upgraded your own kernel, pay attention
    to the "minimal requirements" for module utilities and binutils listed in the
    Documentation/Changes file in the kernel source tree.


    # 3.2 Some client driver modules do not load


    Symptoms:


    +   - The base modules (pcmia_core, ds, 182365) load correctly.

    - Inserting a card gives a high beep + low beep pattern.

    - cardmgr reports version mismatch errors in the system.


    Some of the driver modules require kernel services that may or not be present,
    depending on kernel configuration. For instance, the SCSI card drivers require
    that the kernel be compiled with SCSI support, and the network drivers require
    a networking kernel. If a kernel lacks a necessary feature, insmod may report
    undefined symbols and refuse to load a particular module. Note that insmod error
    messages do not distinguish between version mismatch errors and missing symbol
    errors.


    Specifically:


    +   - The serial client driver serial_cs requires the kernel driver to be enabled
    with CONFIG_SERIAL. This driver may be built as a module.'
  merge: -1
  img_proc: true
