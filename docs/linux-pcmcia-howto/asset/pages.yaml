    \n+   - The token-ring client requires that the kernel be compiled with CONFIG_TR\
    \ enabled.\n\nThere are two ways to proceed:\n\n+   - Rebuild your kernel with\
    \ the necessary features enabled.\n\n+   - If the features have been compiled\
    \ as modules, modify /etc/pcmia/config to preload them\n\n /etc/pcmia/config file\
    \ can specify that additional modules need to be loaded for a particular client.\
    \ For example, for the serial driver, one would use:\n\n```\ndevice \"serial_cs\"\
    \nclass \"serial\" module \"misc/serial\", \"serial_cs\"\n```\n\nModule paths\
    \ are specified relative to the top-level module directory for the current kernel\
    \ version; if no relative path is given, the path defaults to the pcmia subdirectory.\n\
    \n# 3.3 ISA interrupt scan failures\n\nSymptoms:\n\n+   - The system locks up\
    \ when the PCMIA drivers are loaded, even with no cards present.\n\n+   - The\
    \ system log shows a successful host controller probe before the lock-up, but\
    \ does not show interrupt probe results.\n\nAfter identifying the host controller,\
    \ the socket driver probes for free ISA interrupts. The probe involves programming\
    \ the controller for each apparently free interrupt, generating a \"soft\" interrupt,\
    \ to see if the interrupt can be detected correctly. In some cases, probing a\
    \ particular interrupt can interfere with another device.\n\nThe reason for the\
    \ probe is to identify interrupts which appear to be free (i.e., are not reserved\
    \ by any other Linux driver), yet either are not physically wired to the host\
    \ controller, or are connected to another device that does not have a driver.\n\
    \nIn the system log, a successful probe might look like:\n\n```\nIntel PCI probe:\n\
    TI 1130 CardBus at mem 0x10211000, 2 sockets\\...\nISA irqs (scanned) = 5,7,9,10\
    \ status change on irq 10\n```"
