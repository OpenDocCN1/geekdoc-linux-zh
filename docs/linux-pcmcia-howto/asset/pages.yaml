    cardctl command does the equivalent of shutting down all your cards and restarting
    them. The command can be safely executed whether or not the PCMIA system is loaded,
    but the command may fail if you are using other PCMIA devices at the time (even
    if their configurations are not explicitly dependant on the scheme setting).


    To find out the current scheme setting, run:


    ```

    cardctl scheme

    ```


    By default, the scheme setting is persistent across boots. This can have undesirable
    effects if networking is initialized for the wrong environment. Optionally, you
    can set the initial scheme value with the SCHEME startup option (see 2.4 (Startup
    options) for details). It is also possible to set the scheme from the lilo boot
    prompt. Lilo passes unrecognized options to init as environment variables, a value
    for SCHEME (or any other PCMIA device) at the boot prompt be propagated to the
    PCMIA startup script.


    To save even keystrokes, schemes can be specified in lilo''s configuration file.
    For instance, you could have:


    ```

    root = /dev/sda1

    read-only

    image = /boot/vmlinux

    label = "SCHEME-home"

    append = /boot/vmlinux

    label = work

    append = "SCHEME-work"

    ```


    Typing "home" or "work" at the boot prompt would then boot you into the appropriate
    scheme.


    # 5.4 Booting from a PCMIA device


    Having the root filesystem on a PCMIA device is tricky because the Linux PCMIA
    system is not designed to be linked into the kernel. The core components, the
    loadable kernel modules and the user mode cardmgr daemon depend on an already
    running system. The kernel''s "initrd" facility works around this requirement
    by allowing Linux to boot using a ram disk as a minimal root image, load drivers,
    and re-mount The temporary root filesystem can configure PCMIA devices and re-mount
    a PCMIA device as root.


    The initrd image must reside on a bootable device: this cannot be put on a PCMIA
    device. This is a BIOS limitation, not a kernel limit. It is useful here to distinguish
    between "boot-able" devices (i.e., devices that can be booted), and "root-able"
    devices (i.e., devices that can be mounted). "Root-able" devices are determined
    by the BIOS, and are generally limited to internal floppy and hard disk drives.
    The initrd facility makes more devices "root-able", not "boot-able".


    Some Linux distributions will allow installation to a device connected to a PCMIA
    SCSI adapter, an unintended side-effect of their support for installs from PCMIA
    SCSI CD-ROM drives. However,'
