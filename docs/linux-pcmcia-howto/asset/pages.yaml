    # 6.3 PCMCIA interface cards


    The PCMCIA floppy interface used in the Compaq Aero and a few other laptops is
    not yet supported by this package. The snag in supporting the Aero floppy is that
    the Aero seems to use a customized PCMCIA controller to support DMA to the floppy.
    Without knowing exactly how this is done, there isn''t any way to implement support
    under Linux.


    If the floppy card is present when an Aero is booted, the Aero BIOS will configure
    the card, and Linux will identify it as a normal floppy drive. When the Linux
    PCMCIA drivers are loaded, they will notice that the card is already configured
    and attached to a Linux driver, and this socket will be left alone. So, the drive
    can be used if it is present at boot time, but the card is not hotswappable.


    #  Debugging tips and programming information


    # 7.1 Submitting useful problem reports


    The best way to submit reports is to use the online pcmia-forums or the bug tracker
    at SourceForge. That way, other people can see current problems (and fixes or
    workarounds, if available). Here are some things that should be included in all
    bug reports:


    +   * Your system brand and model.

    * All PCMCIA card(s) you are using.

    * Your Linux kernel version (i.e., "uname -rv"), and PCMCIA driver version (i.e.,
    "cardctl -V").

    * Output of "lspci -v''\n* Any changes you have made to the startup files in /etc/pcmcia,
    or to the PCMCIA startup script.

    * All PCMCIA-related messages in your system log file. That includes startup messages,
    and messages generated when your cards are configured.'
