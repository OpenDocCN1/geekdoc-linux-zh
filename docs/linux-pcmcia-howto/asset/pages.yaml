- pgno: 54
  md: "# 7. Debugging tips and programming information\n\n# 7.5 Writing Card Services\
    \ for new cards\n\nThe Linux PCMCIA Programmer's Guide is the best documentation\
    \ for the client driver interface. The latest version is always available from\
    \ projects.sourceforge.net in /pub/pcmia-cs/doc, or on the web at <http://pcmia-cs.sourceforge.net>.\n\
    \nFor devices that are close to relatives of normal ISA devices, you will probably\
    \ be able to use parts of existing Linux drivers. In some cases, the biggest struggle\
    \ will be modifying an existing driver so that it can handle adding and removing\
    \ devices after boot time. Of the current drivers, the memory card driver is the\
    \ \"self-contained\" driver that does not depend on other parts of the Linux kernel\
    \ to do most of the dirty work.\n\nIn many cases, the largest barrier to supporting\
    \ a new card is obtaining technical information from the manufacturer. It may\
    \ be difficult to figure out who to ask, or to explain what information is needed.\
    \ However, with a few exceptions, it is very difficult if not impossible to implement\
    \ a driver for a card without technical information from the manufacturer.\n\n\
    I have written a dummy driver with lots of comments that explains of how a driver\
    \ communicates with Card Services; you will find this in the PCMCIA source distribution\
    \ in clients/dummy_cs.cs.\n\n# 7.6 Guidelines for PCMCIA client driver authors\n\
    \nI have decided that it is not really feasible for me to distribute all PCMCIA\
    \ client drivers as part of the PCMCIA package. Each new driver makes the main\
    \ package incrementally harder to maintain, and including a driver inevitably\
    \ shifts some of the maintenance work from the author to me. Instead, I will decide\
    \ on case by case whether or not to include contributed drivers, based on user\
    \ demand as well as maintainability. For drivers not included in the core package,\
    \ I suggest that authors adopt the following scheme for packaging their drivers\
    \ for distribution.\n\nDriver files should be arranged in the same directory scheme\
    \ used in the PCMCIA source distribution, so that the driver can be unpacked on\
    \ top of a complete PCMCIA source tree. A driver should include source files (in\
    \ /modules/), a main page (in /main/), and files (in /etc/). The top level directory\
    \ should also include a README file.\n\nThe top-level directory should include\
    \ a Makefile, set up so that \"make -f all\" and \"make -f install\" compile the\
    \ driver and install all appropriate files. If this Makefile is given an extension\
    \ of .mk, then it will be invoked by the top-level Makefile for all and install\
    \ targets. Here is an example of how such a Makefile could be constructed:\n\n\
    ```\n# Sample Makefile for contributed client driver\nFILES = sample_cs.mk README.sample_cs\
    \ \\\nmodules/sample_cs.c modules/sample_cs.h \\\netc/sample_cs.conf etc/sample_cs.opts\
    \ \\\nman/sample_cs.4\n\nall:\ninstall:\n\t$(MAKE) -C modules MODULES=sample_cs.o\n\
    \t$(MAKE) -C install-modules MODULES=sample_cs.o\n\t$(MAKE) -C etc install-clients\
    \ CLIENTS=sample\n\t$(MAKE) -C man install-man-4 MAN4=sample_cs.4\n```\n\ndist:"
  merge: -1
