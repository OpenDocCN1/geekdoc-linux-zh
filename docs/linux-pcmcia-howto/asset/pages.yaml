- pgno: 5
  md: '# 2. Compilation and installation


    The likelihood that a card will work depends on the type of card. Essentially
    all modems should work with the supplied driver. Some network cards work if they
    are OEM versions of supported cards. Other types of IO (frame buffers, sound cards,
    etc.) will not work until someone writes the appropriate driver.


    # 1.6 When my favorite (unsupported) card become supported?


    Unfortunately, they usually don''t pay me to write drivers, so if you would like
    to have a driver for your favorite card, you are probably going to have to do
    at least one of them. Ideally, I''d like to work towards a model like the Linux
    kernel, where I would be responsible for the “core” driver code and other authors
    would contribute and maintain client drivers for specific cards. This is currently
    in progress. I will try to help where I can, but when debugging kernel device
    drivers by myself is not particularly effective.


    # 1.7 Mailing lists and other information sources


    The Linux PCIA information page is at <http://pcmia-cs.sourceforge.net>, and has
    bug tracking, support and feature requests, and a variety of PCIA related message
    forums. Users can request notification of new responses to particular questions,
    or notification for all new messages in a category. I hope that this will become
    a useful repository of information, for questions that go beyond the scope of
    the HOWTO.


    The Linux Laptop Page at <http://www.linux-on-laptops.com> has links to a vast
    number of sites have information about configuring specific types of laptops for
    Linux. There is also a searchable database of system configuration information,
    and pointers to a variety of laptop-related mailing lists.


    # 2. Compilation and installation


    # 2.1 Prerequisites and kernel setup


    Before starting, you should think about whether you really need to compile the
    PCMCIA package yourself. All Linux distributions come with pre-compiled driver
    packages. Generally, you only need to install the drivers from scratch if you
    need a new feature of the current drivers, or if you''ve updated and/or reconfigured
    your kernel in a way that is incompatible with the drivers included with your
    Linux distribution. While compiling the package is not technically difficult,
    it does require some general Linux familiarity.


    The following things are installed on your system before you begin:


    +   - A 2.0, 2.2, 2.4, or 2.6 kernel source tree.


    +   - (Optional) the “XForms” X11 user interface.


    You need to have a complete Linux source tree for your kernel, not just an up-to-date
    kernel image. The driver modules contain some references to kernel source files.
    While you may want to build a new kernel to remove unnecessary drivers, installing
    PCMCIA does not require you to do so.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# 2. Compilation and installation


    "stable" kernel sources and patches are available from <ftp://ftp.kernel.org/pub/linux/kernel/v2.4>.
    Current module utilities can be found in the same locations.


    In the Linux source tree, the Documentation/Changes file describes the versions
    of all sorts of system components that are required for that kernel release. You
    may want to check this and verify that your system is up to date, especially if
    you have updated your kernel. If you are using a development kernel, be sure that
    you are using the right combination of shared libraries and module tools.


    On x86 systems, if you are using 16-bit PC devices, you should also enable CONFIG_ISA,
    for recent kernels. These cards behave both like ISA devices, and the PCMCIA drivers
    use judge whether a platform supports ISA interrupts.


    When configuring your kernel, if you are using a PCMCIA ethernet card, you should
    turn on networking support but turn off the Linux network card drivers, including
    the "pocket and portable adapters". The PCMCIA network card drivers are all implemented
    as loadable modules. Drivers compiled into kernel will only waste space.


    If you want to use SLIP, PPP, or PLIP, you need to configure your kernel with
    these enabled, or use the loadable module versions of these drivers.


    In order to use a PCMCIA token adapter, your kernel should be configured with
    "Token driver support" (CONFIG_TRB), though you should enable CONFIG_IBMMTR.


    If you want a PCMCIA IDE adapter, your kernel should be configured with CONFIG_BLK_DEV_PCMCIA,
    for 2.0.* Kernels do not require a special configuration setting.


    If you are using a PCMCIA SCSI adapter, then enable CONFIG_SCSI when configuring
    your kernel. Also, enable any top-level drivers (SCSI disk, tape, cdrom, generic)
    that you expect to use. Also, low-level drivers for particular adapters should
    be disabled, as they will just take up space.


    This package includes an X-based card status utility cardinfo. This utility is
    on a freely distributed user interface toolkit the XForms Library. This library
    is available as a separate package with most Linux distributions. If you would
    like to use cardinfo, you should install XForms and the normal X header files
    and libraries before configuring the PCMCIA package. This tool is completely optional.


    # 2.2 PCMCIA support


    PCMCIA driver support is included in the 2.4 and later linux kernels. While it
    shares most of the same code with the standalone PCMCIA driver package, there
    are some differences. The kernel PCMCIA support is also evolving.


    The kernel PCMCIA has the same functionality as the driver of the pcmcia-cs package.
    It does not eliminate the need to install the pcmcia-cs package, since it requires
    some user tools (cardsmgr, cardctl1, /etc/pcmcia/* files). The drivers in pcmcia-cs
    can be built for 2.4 kernels, so you have a choice of using either the in-kernel
    PCMCIA drivers, or the drivers included in pcmcia-cs. With 2.5 and later kernels,
    the standalone drivers cannot be used.


    To use the kernel PCMCIA drivers, configure your kernel with CONFIG_HOTPLUG, CONFIG_PCMCIA,
    and usually CONFIG_CARDBUS enabled. On x86 systems, CONFIG_ISA should also be
    enabled. The drivers can either be built into the kernel or as modules. PCMCIA
    client options are listed in their regular driver'
  merge: -1
  img_proc: true
