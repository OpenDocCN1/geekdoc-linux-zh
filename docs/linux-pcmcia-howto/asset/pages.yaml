    at present, no Linux installation tools support configuring an appropriate “initrd”
    to boot Linux with a PCIA root filesystem. Setting up a system with a PCIA root
    thus requires that you use another Linux system to create the “initrd” image.
    If another Linux system is not available, another option would be to temporarily
    install a Linux setup on a non-PCIA drive, create an initrd image, and reinstall
    to the PCMC target.


    The Linux Bootdisk-HOWTO has general information about setting up boot disks but
    specific to initrd. The main initrd document is included with recent kernel source
    distributions, in linux/Documentation/initrd.txt. Before beginning, you should
    read this. A familiarity with lilo is also helpful. Initrd also requires that
    you have a kernel compiled with CONFIG_BLK_DEV_RAM and CONFIG_BLK_DEV_INITRD.


    This is an advanced configuration technique, and requires a high level of familiarity
    with Linux and the PCIA system. Be sure to read all the relevant documentation
    before starting. The following cookbook instructions should work, but deviations
    from the examples will quickly put you in uncharted and “unsupported” territory,
    and you will be on your own.


    This method absolutely requires that you use a PCMCIA driver release of 2.9.5
    or later. Older PCMCIA packages or individual components will not be in the initrd
    context. Do not mix components from different releases.


    # 5.4.1 The pcinitrd helper script


    The pcinitrd script creates a basic initrd image for booting with a PCMCIA root
    partition. The image includes a minimal directory hierarchy, a handful of device
    files, a few binaries, shared libraries, and a set of PCMCIA driver modules. When
    invoking pcinitrd, you specify the driver modules that you want to be included
    in the image. The core PCMCIA components, pcinitrd_core and ds, are automatically
    included.


    As example, if your laptop uses an 182365-compatible host controller, and an Adaptec
    SlimSCSI adapter. You could create one with the root files on a hard drive attached
    to it


    ```

    pcinitrd -v initrd pcmcia/182365.o pcmcia/aha152x.cs.o

    ```


    To customize your initrd sequence, you must boot the image using the “loopback”
    device with a command like:


    ```

    mount -o loop -t ext2 initrd /mnt

    ```


    and then edit the linuxrc script. The configuration files will be installed /etc
    in the image, and can also be customized. See the man page pcinitrd for more information.


    # 5.4.2 Creating an initrd boot floppy


    After creating an image with pcinitrd, you can create a boot floppy by copying
    the kernel, the compressed initrd image, and a few support files for lilo to a
    clean floppy. In the following example, we assume that the desired PCIA root device
    is /dev/sda1'
