    # 4.6.2 Comments about specific cards


    +   - The Adaptec APA-1480 CardBus card needs a large IO port window (256 contiguous
    ports aligned on a 256-port body). It may be necessary to expand the IO port regions
    in /etc/pcmcia/config.opts to guarantee that such large window can be found.

    - The Adaptec APA-460 SlimSSI adapter is not supported. This card was originally
    sold under the Tranter name, and when Adaptec merged with Tranter, they continued
    to sell the Tranter card with an Adaptec label. The APA-460 is not compatible
    with any existing Linux driver.

    - I have one report of a bad interaction between the New Media Bus Toaster and
    a UMAX Astra 1200 scanner. Due to the complexity of the SCSI protocol, diagnosing
    problems with SCSI devices, it is worth considering that incompatible combinations
    like this may exist and may not be documented.


    # 4.6.3 Diagn problems with SCSI adapters


    +   - With the aha152x_cs driver (used by Adaptec, New Media, and few others),
    it seems SCSI disconnect/reset is a frequent source of trouble with tape drives.
    To disable this “feature,” add the following to /etc/pcmcia/config.opts:

    - Also with the aha152x_cs driver, certain devices seem to require a longer startup
    delay, controlled via the reset_delay module parameter. The Yamaha 4416S CDR drive
    is one such device. The result is device identified successfully, then hangs the
    system. In such cases, try:

    - Another potential source of SCSI device probe is probing of multiple LUNs. If
    you see successful detection of a device, followed by SCSI timeouts when LUN 1
    for that device is probed, disable the kernel''s CONFIG_SCSI_MULTI_LUN option.

    - If you have configured SCSI as modules (CONFIG_SCSI="m”), you may need to modify
    /etc/pcmcia/config to load the SCSI modules into the appropriate _*scsi driver.

    - If you get an abort command due to “timeout” messages when the SCSI bus is probed,
    you almost certainly have an interrupt conflict.

    - If the host drivers report “no SCSI devices found”, verify that your kernel
    was compiled with the appropriate top-level SCSI drivers for your devices (i.e.,
    disk, tape, CD-ROM, and/or generic). If a top-level driver is missing, devices
    of that type will be ignored.'
