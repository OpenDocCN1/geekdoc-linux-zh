    # 2.6.1 Debian


    Debian uses a System boot script arrangement. The PCMCIA startup script is installed
    as /etc/init.d/pcmia. New packages use /etc/default/pcmia for startup options;
    older versions used /etc/pcmia.conf for this purpose. Debian''s syslog will place
    kernel messages in /var/log/messages and cardmgr messages in /var/log/daemon.log.


    Debian distributes the PCMCIA system in two packages: the "pcmia-cs" package contains
    cardmgr and other tools, man pages and configuration scripts; the "pcmia-modules"
    package contains the kernel driver modules.


    Starting with 3.1.25, a clean PCMIA install will identify Debian systems and create
    a special network.opts file, in the absence of other network configuration settings,
    uses Debian''s ifup and ifdown commands to configure a network card based on settings
    in /etc/network/interfaces.


