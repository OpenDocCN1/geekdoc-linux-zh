    In this example, the fault did not cause a system lockup, as kmsym could be erected
    after the fault happened. In other cases, you may have to load multiple modules
    in the same order and at the same addresses. If a fault happens when a card is
    inserted, insert the kmsym before inserting the card, or with a card inserted.
    You can manually load the card drivers with insmod and run kms before inserting
    the card.


    For more background, see "man inserted", "man kms", and "man klogd". In the kernel
    source tree, Documentation/ops-tracing.txt is also relevant. Here are a few kernel
    debugging hints:


    +   - Depending a fault, it may be useful to translate addresses in the “Call
    Trace”, using the same procedure as the main fault address.


    +   - To diagnose a silent lock-up, to provoke the problem with X disabled, since
    kernel messages sent to the console will not be visible under X.


    +   - If you kill klogd, most kernel messages will be echoed directly on the console,
    which may be helpful if the problem prevents klogd from writing to the system
    log.


    +   - To allow kernel messages to be sent to the console, for 2.2 and later kernels,
    if /proc/sys/kernel/printk exists,


    ```

    echo 8 > /proc/sys/kernel/printk prints a register dump on the console. This may
    work even if the system is otherwise completely unresponsive, and the EIP address
    can be interpreted as a kernel fault.

    ```


    +   - For 2.2 and later kernels configured with CONFIG_SYSRQ enabled, early emergency
    functions are available via special <Alt><SysRq> key combinations, documented
    in Documentation/sysrq.txt in the kernel source tree.


    # 7.3 Low level PCMIA debugging aids


    The PCMIA modules contain a list of conditionally-compiled debugging code. Most
    of this is under control of the PCMIA_DEBUG preprocessor define. If this is undefined,
    debugging code will not be compiled. If set to 0, the code is compiled but inactive.
    Larger numbers increasing levels of verbosity. Each module built with PCMIA_DEBUG
    defined will have an integer parameter, pc_debug, that controls the verbosity
    of'
