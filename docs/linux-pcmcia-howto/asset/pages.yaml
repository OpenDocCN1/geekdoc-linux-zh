    n\"; DO_FSCK=\"y\"; DO_MOUNT=\"y\"\n  FSTYPE=\"ext2\"; OPTS=\"\"\n  MOUNTPT=\"\
    mem1\"\nesac\n```\n\n# 4.72 Using flash memory cards\n\nThe following information\
    \ applies only to so-called \"linear flash\" memory cards. Many flash cards, including\
    \ allSmartMedia and CompactFlash, actually include circuitry to emulate an IDE\
    \ device. Those cards are then handled as IDE devices, not memory cards.\n\nThere\
    \ are two major formats for flash memory cards: the FTL or \"flash translation\
    \ layer\" style, and the Microsoft Flash File System. The FTL is generally more\
    \ flexible because it allows any high-level filesystem (ext2, ms-dos, etc) to\
    \ be used on a flash card as if it were an ordinary disk device. The FFS is a\
    \ completely different filesystem type. Linux cannot natively handle cards formatted\
    \ with FFS.\n\nTo use a memory card as an ordinary disk-like device, first create\
    \ an FTL on the device with the ftl_format command. This layer hides the device-specific\
    \ details of flash memory programming and makes the card look like a simple block\
    \ device. For example:\n\n```\nftl_format -i /dev/mem0c0\n```\n\nNote that this\
    \ accesses the card through the \"raw\" memory card interface. Once formatted,\
    \ the card can be accessed as an ordinary block device via the ftl_cs driver.\
    \ For example:\n\n```\nmake2fs /dev/ftl0c0\nmount -t ext2 /dev/ftl0c0 /mnt\n```\n\
    \nDevice naming for FTL devices is tricky. Minor device numbers have three parts:\
    \ the card number, the region number on that card, and optionally, the partition\
    \ within that region. A region can be treated as a single block device with no\
    \ partition table (like a floppy), or it can be partitioned like a hard device.\
    \ The \"ftl0c0\" device is card 0, common memory region 0, the entire region.\
    \ The \"ftl0c0p1\" \"ftl0c0p4\" devices are primary partitions 1 through 4 if\
    \ the region has been partitioned.\n\nConfiguration options for FTL partitions\
    \ can be given in ftl.opts, which is similar in structure to memory.opts. The\
    \ device address passed to ftl.opts consists of three or four fields: the scheme,"
