    ARTICLES


    # OUT OF THE PAST: AN INTERVIEW WITH CINENOVA


    By Mira Mattar, 28 June 2011


    The feminist film archive housed and animated by the collective Cinenova poses
    many perplexing questions about how the gender politics and aesthetics of the
    recent past relate to our present moment. Mira Mattar went to meet two of the
    collective''s members – Emma Hedditch and Marina Vismidt – Cinenova''s show Reproductive
    Labour at The Showroom gallery


    She speaks (as a woman) about everything, although they wish her to speak only
    about women''s things. They like her to speak about everything only if she does
    not speak ''as a woman'', only if she will agree to play the artist''s role as
    neutral (neuter) observer. She does not want to speak (as a woman) about anything,
    although they want her to there. There is nothing she can speak of ''as a woman''.
    As a woman she cannot speak.


    +   - Susan Hiller, Ten Months (Six), 1977-1979


    Cinenova, a not-of-profit, volunteer run organisation which distributes and preserves
    feminist films and movies made by women, set up camp at The Showroom gallery for
    a six week stint earlier this year. During the show - which included screenings
    by guest curators, talks and reading groups - Cinenova''s rich and rare library
    of films was available for viewing by the public. I talked to Emma Hedditch and
    Marina Vismidt during the exhibition about Cinenova''s history, its future, and
    its current incarnation as Reproductive Labour.


    Mira Mattar: Cinenova was formed in the early ''90s through a merger between Circles
    and Cinema of Women; can you tell me how that happened?


    Emma Hedditch: Well, the BFI (who store many of our 16mm and 35mm films) used
    to fund both organisations, but in the late ''80s/early ''90s the funding was
    cut by 50 percent and they were forced to merge, and formalised as Cinenova which
    emerged in the early ''90s. It depends on who you talk to, there''s evidence that
    there was a campaign against the merger from both organisations.


    ![](img/4a34cc47f4d16e0c331ad344d9df31a1_0_0.png)


    Image: A selection of paper materials on Cinenova''s show Reproductive Labour
    at The Showroom, photography courtesy by K Lassauro


    MM: Why is that? Can you say more about the differences between the two organisations
    and why Cinenova stands in relation to those histories?


