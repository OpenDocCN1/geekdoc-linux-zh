  md: 'MM: How does the working group work and are there any people who have been
    part of either Cinema of Circles that are not part of Cinenova? If so, what''s
    their perspective on the changing nature of the project?


    EH: We came together at different times. At the moment we are working on this
    four or five days a week, usually it''s one person per day we, it should be more
    if we want to make it a more functioning organisation. The more work you do, the
    more you generate. Of our board members, Elaine Burrows, was involved in Circles,
    she''s the thread. Li Rhodes, Jo Davis, Felicity Sparrow and Annabel Nicholasrows
    are responsible for starting Circles and we met with Felicity early on to discuss
    this exhibition. Felicity has been very supportive of the exhibition as have many
    other film- and video-makers in the collection.


    ![](img/4a34cc47f4d16e0c331ad344d9df31a1_2_0.png)


    Image: Installation shot of Reproductive Labour, The Showroom Gallery 2011


    # MM: What was the thinking behind this exhibition aside from the making available
    of the collection?


    EH: Emily [Pethick], as the director of The Showroom and a member of Cinenova''s
    working group, suggested the collaboration and we started to talk about what that
    would mean for us. In terms of the distribution we also have things to maintain
    and the exhibition has activated more work. So we are asking ourselves how we
    going to deal with this? How can we cope with the actual labour?


    MV: In making it a public level and creating other dynamics of communication,
    and of course calling the exhibition Reproductive Labour, we''re gesturing towards
    some of the themes and politics within the film and some of the histories that
    are accessible through those films and documentaries. Also, as Emma said, it''s
    about the activity of how to proceed as an organisation and thinking about this
    in public. So, in this sense any kind of mediation is our work and also the work
    of the working group.


    MM: Do you think you''re going to do more projects like this (public projects)?


    EH: I think this has been quite a big scale, it''s shown us lots of things, like
    what it means to do this kind of work and try to be as open as possible. It has
    been really surprising in terms of how it''s generated in the way of discussions,
    and how many people have been coming ours and interactions with them. It''s interesting
    that, to try and harness some of that energy or interest we need to figure out
    how that translates into we and the audience with this material and not consume
    it?


    MM: Do you think we will have that energy in terms of potential ideas for future
    projects?


    MV: There are different levels to that kind of. For instance how will Cinenova
    continue into the future? On what basis will it operate? And we need to consider,
    practical and structural questions. Also having this opening into people''s research
    and creating has generated lots of things - interviews, presentations to students,
    and many people wanting to find out. That takes lots of formats and temporalities.


    The last ten years of Cinenova''s as an organisation and its various activities
    have not been funded until the idea of entering into collaborations with others
    wasn''t something we were ever conceived of, it may help in some practical senses
    but might also have potential impacts on Cinenova''s autonomy. We''ll see all
    things. An advantage to having here The Showroom [which is a possibility] is that
    people have been coming here since Cinenova as based here, and we''ve started
    a lot of projects with women''s groups in the area. But there are number of practical
    and institutional issues against that option.


