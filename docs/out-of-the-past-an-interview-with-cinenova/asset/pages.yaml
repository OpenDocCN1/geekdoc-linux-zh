  md: 'EH: Cinema of Women focused more on documentary and educational films with
    a broad range of content and Circles made more artistic and experimental films
    which came out of the London Film-makers'' Co-op (1966-1997), which tried by combining
    screenings, writing and performance in addition to distribution.


    MM: Can you tell me a bit more about the Co-op?


    EH: It started in the late 60s and was originally based near Regent''s Park, then
    it moved to Camden and lasted until the late 90s. Eventually it became Luxe -
    the historic archive which has a combination of London Film-makers'' Co-op and
    Video Art. The Co-op was a social space, a workshop and an educational space but
    relatively autonomous from institutions as the BFI or Arts Council. A lot of people
    who were involved were artists in structural/formal film-making. The London Film-makers''
    Co-op had facilities where you could work with the physical material of the film,
    there were optical printing and processing facilities. People could go there and
    use around equipment which could be used for screens through the original Film-makers''
    distribution worked in many ways as last: a film-maker makes their material with
    us, it''s effectively on loan, then we''re responsible for it, if an organisation
    or individuals wanted to screen them then so us. Usually we came an agreement
    with the artists, we became a central point where programmers could find out a
    film or video. Unfortunately a large amount of the films and videos are never
    seen, but the whole collection is here and it''s an extraordinary situation to
    see them. Under normal circumstances you have to pay a fee to be able to screen
    it, which is an obstacle to many people, but we rely on these fees to sustain
    the organisation.


    MM: I guess that part of the show...


    EH: Exactly. We want to ask how it can be a sustainable practice not in financial
    terms and not based on a few works. It also creates a culture around film and
    video-makers and at different times the organisation has operated with more of
    a social function, and as a support network. It''s not about individuals, it''s
    about building a language and that''s made by all women, by whose work is much
    more explicitly feminist.


    MM: Is there a criteria for the type of films you take on in terms of where you
    situate yourselves within feminism?


    EH: It''s obvious that it is not just women''s films, but we haven''t acquired
    any new films since we''ve been working with the organisation (acquisition stops
    in 2000 when most of us started to get involved) we need to rethink what kind
    of films we want when we re-acquiring. We''re asking ourselves how we understand
    the terms ''women'' or ''feminist''. The material we have is a historical object
    in way. It''s about our organisation, the idea of it being women. But then there
    are also misconceptions, for several film filmmakers have changed their gender
    since they made the films, there are also films made in collaboration with male
    filmmakers. The term women''s films was pertinent in a certain moment but perhaps
    it''s changed.


    Within this working group we are feminist/queer perspective. We''re interested
    in the historical position of women and for the queer/feminist discussion around
    it. For selection, in the past a committee would meet so often and watch films
    and discuss what be appropriate to distribute, then of course there the question
    of whether the artist wanted to be distributed by Cinenova. We have to use a lot
    of submissions but most of them accepted from film festivals - if there was something
    we would like or really intently then the decision was made based on that. There
    were a lot of factors to consider, the mainly question of whether we could promote
    it.


    MM: Do you think that Cinenova is a women-only organisation may put put some women
    off? Do you find it hard to define that position?


    EH: I women-only spaces make explicit what already exists in terms of exclusion
    without certain practices. We''re trying to work with race and class issues and
    the politics of labour; that aren''t just women''s issues. There are many film
    and video works included in Cinenova that have been excluded in other contexts,
    which is why we consider it an important collection.


    MM: I noticed that you women and men to select films for the programme. Can you
    tell me a bit about how you came to that decision?


    Marina Vishisht: I thought it was a good idea to invite people to make selections
