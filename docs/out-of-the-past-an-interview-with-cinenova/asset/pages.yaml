  md: 'MM: Can you tell me more about some of the work that has been produced as a
    result of your being here? Was it always on the cards?


    EH: We''ve worked with a local organisation, the Marylebone Women''s Refuge; they
    worked with Louise Shelley (from The Show) to select some relevant materials to
    screen for their art and culture night. The exhibition acted as a meeting and
    social space, we''ve met a lot of people and the films as a starting point for
    discussion.


    MV: Yesterday we were discussing the idea of a project Cinenova with a group of
    female academics. Not only to redress the gap in the UK''s history of experimental
    cinema and the moving image - which is mostly dedicated to white women and is
    perhaps unintentionally patriarchally infiltrated (which is a huge omission) -
    but to talk about strategies of history they''re not just ''piece of piece in
    history, but rather trying to articulate the history of film making work. They''ve
    also been mentioning and discussing the ideas stemming from the initial provocation.


    MM: The idea of Cinenova functioning in part as a social space seems really potent.
    What would you want it to do?


    MV: I guess it would depend on how we function as a collaborative organisation,
    what our borders are, how this ''we'' is constituted on every day and basis and
    kind of time and our relationship to Cinenova can be.


    EH: It would be of a place where people could work, organise events - with enough
    of a structure for people to connect and communicate.


    MM: What was your experience of the Sulamith Firestone day? [On 12 March Cinenova
    held a group reading of The Dialectic of Sex. What was read also simultaneously
    transcribed. Intersections and discussions were also transcribed to create a live
    record of the attempted reading of the text (we went to the end of one chapter...).
    Simultaneously, another member of the group was copying the text from the book
    itself (if she didn''t get much further). This was followed by a screening of
    Shulie - a short shot by re-make of a little student film by Firestone from 1967.
    Maria read, transcribed and copied at various points]


    MV: It felt very different when copying from the book than when transcribing while
    people read. Either way it wasn''t so much paying attention to the text, but we
    were writing mechanically and listening to it. It became a debate. I had a lot
    of thoughts which were much triggered by the film Shulie. The fact that the actress
    was wearing a very obvious wig stuck me. Sulamith Firestone came from a very Orthodox
    Jewish background so there''s an interesting connection between the assumption
    of gender - the assumption as ''costume'' of gender - then she deconstructed it.
    The acted acted as character in a way.


    MM: It seems like identity is a potent thing in Cinenova''s history. Do you see
    any other prevalent questions? And so what is their relation to global feminism?


    MV: We have a lot of films about Jewish and Middle Eastern identities. We are
    documenting struggles, thinking about generations of feminism in relation to labour.
    There''s a strong thread of problematising the researcher. The more of documentary,
    or doc-fictional films in the collection, the more reflexivity and performance
    to problematise the relationship of researcher and object of research, and relate
    to the production of subjectivity in feminism, also the splits occasioned by the
    multiple roles women have to occupy in everyday life. Bred and Born is one example
    of this kind of work.


    EH: The screening on Saturday was interesting, we were presenting things with
    a strong emphasis on technology and the body, and the production of subjectivity
    through the use of a camera, a lot of the work functions as a document of a particular
    moment of ambition - like multiculturalism, or the Decade of Women (1976-1985)
    - there are a lot of films around that that use an internationalist approach to
    women''s issues.


    MM: How do you try to trace the line between personal and political? Do you difference?
    Do you have personal films in the collection and are they necessary?


    MV: Films were probably placed with us because they are both personal and political.
    A lot of the films deals with issues of identity and self-representation. They
    would probably submitted to Cinenova because there was a political intention behind
    them, even if they seem very personal.


