  [content]\n这对扩展没有影响，但如果变量与其他文本相邻，它是必须的，否则可能会让 shell 产生混淆。在示例中，我们尝试通过在变量 `a` 的内容后附加字符串\
  \ `_file` 来创建一个文件名：\n\n```\n[me@linuxbox ~]$ a=\"foo\"\n[me@linuxbox ~]$ echo \"\
  $a_file\"\n```\n\n如果我们执行这这一系列命令，结果将是空，因为 shell 会尝试扩展名为 `a_file` 的变量，而不是 `a`。这个问题可以通过在“真实”变量名周围加上大括号来解决。\n\
  \n```\n[me@linuxbox ~]$ echo \"${a}_file\"\nfoo_file\n```\n\n我们还看到，大于 9 的位置参数可以通过在数字周围加上大括号来访问。例如，要访问第\
  \ 11 个位置参数，我们可以这样做：\n\n```\n${11}\n```\n\n### 管理空变量的扩展\n\n某些参数扩展旨在处理不存在和空变量。这些扩展对于处理缺失的位置参数以及为参数分配默认值非常有用。这里是其中一种扩展：\n\
  \n`${parameter:-word}`\n\n如果 `parameter` 未设置（即不存在）或为空，此扩展的结果为 `word` 的值。如果 `parameter`\
  \ 不为空，则扩展的结果为 `parameter` 的值。\n\n```\n[me@linuxbox ~]$ foo=\n[me@linuxbox ~]$ echo\
  \ ${foo:-\"substitute value if unset\"}\nsubstitute value if unset\n[me@linuxbox\
  \ ~]$ echo $foo\n[me@linuxbox ~]$ foo=bar\n[me@linuxbox ~]$ echo ${foo:-\"substitute\
  \ value if unset\"}\nbar\n[me@linuxbox ~]$ echo $foo\nbar\n```\n\n这是另一种扩展，我们使用等号代替横杠：\n\
  \n`${parameter:=word}`\n\n如果 `parameter` 未设置或为空，此扩展的结果为 `word` 的值。此外，`word` 的值会被赋值给\
  \ `parameter`。如果 `parameter` 不为空，则扩展的结果为 `parameter` 的值。\n\n```\n[me@linuxbox ~]$\
  \ foo=\n[me@linuxbox ~]$ echo ${foo:=\"default value if unset\"}\ndefault value\
  \ if unset\n[me@linuxbox ~]$ echo $foo\ndefault value if unset\n[me@linuxbox ~]$\
  \ foo=bar\n[me@linuxbox ~]$ echo ${foo:=\"default value if unset\"}\nbar\n[me@linuxbox\
  \ ~]$ echo $foo\nbar\n```\n\n**注意**\n\n*位置参数和其他特殊参数不能用这样赋值。*\n\n这里我们使用一个问号：\n\n\
  `${parameter:?word}`\n\n如果 `parameter` 未设置或为空，此扩展会导致脚本带错误退出，并将 `word` 的内容发送到标准错误输出。如果\
  \ `parameter` 不为空，则扩展的结果为 `parameter` 的值。\n\n```\n[me@linuxbox ~]$ foo=\n[me@linuxbox\
  \ ~]$ echo ${foo:?\"parameter is empty\"}\nbash: foo: parameter is empty\n[me@linuxbox\
  \ ~]$ echo $?\n1\n[me@linuxbox ~]$ foo=bar\n[me@linuxbox ~]$ echo ${foo:?\"parameter\
  \ is empty\"}\nbar\n[me@linuxbox ~]$ echo $?\n0\n```\n\n这里我们使用一个加号：\n\n`${parameter:+word}`\n\
  \n如果 `parameter` 未设置或为空，扩展的结果为空。如果 `parameter` 不为空，则用 `word` 的值替换 `parameter`；但是，`parameter`\
  \ 的值不会改变。\n\n```\n[me@linuxbox ~]$ foo=\n[me@linuxbox ~]$ echo ${foo:+\"substitute\
  \ value if set\"}\n[me@linuxbox ~]$ foo=bar\n[me@linuxbox ~]$ echo ${foo:+\"substitute\
  \ value if set\"}\nsubstitute value if set\n```\n\n### 返回变量名的扩展\n\nshell 具有返回变量名的能力。这被用于某些相当奇异的情况。\n\
  \n`${!prefix*}`\n\n`${!prefix@}`\n\n此扩展返回以 `prefix` 开头的现有变量名。根据 bash 文档，这两种形式的扩展执行效果完全相同。在这里，我们列出了环境中所有以\
  \ `BASH` 开头的变量：\n\n```\n[me@linuxbox ~]$ echo ${!BASH*}\nBASH BASH_ARGC BASH_ARGV\
  \ BASH_COMMAND BASH_COMPLETION BASH_COMPLETION_DIR BASH_LINENO BASH_SOURCE BASH_SUBSHELL\
  \ BASH_VERSINFO BASH_VERSION\n```\n\n### 字符串操作\n\n有一组大量的扩展可以用于字符串操作。其中许多扩展特别适用于对路径名的操作。以下扩展：\n\
  \n`${#parameter}`\n\n扩展为 `parameter` 所包含字符串的长度。通常，`parameter` 是一个字符串；然而，如果 `parameter`\
  \ 是 `@` 或 `*`，则扩展的结果为位置参数的数量。\n\n```\n[me@linuxbox ~]$ foo=\"This string is long.\"\
  \n[me@linuxbox ~]$ echo \"'$foo' is ${#foo} characters long.\"\n'This string is\
  \ long.' is 20 characters long.\n```\n\n以下扩展用于提取 `parameter` 中包含的字符串部分：\n\n`${parameter:offset}`\n\
  \n`${parameter:offset:length}`\n\n提取从字符串开始第 `offset` 个字符处并持续到字符串结束，除非指定了 `length`。\n\
  \n```\n[me@linuxbox ~]$ foo=\"This string is long.\"\n[me@linuxbox ~]$ echo \"'$foo'\
  \ is ${#foo} characters long.\"\n'This string is long.' is 20 characters long.\n\
  ```\n*(注：由于原文文本中存在大量重复的示例块，我已在翻译中进行了去重处理，以符合“不要重复输出原文”的要求。)*\n\n*(由于用户提供的文本中包含大量重复的示例块，我将提供一份干净、不重复的翻译翻译。)*\n\
