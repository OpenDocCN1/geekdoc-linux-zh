  \n### 从标准输入读取值\n\n`read` 内置命令用于用于读取单行标准输入。该命令可以用于读取键盘输入，或者在采用重定向时，从文件中读取一行数据。该命令具有以下语法：`read\
  \ [-options] [variable...]`\n\n其中 `options` 是表 28-1 后面列出的可用选项之一或多个，而 `variable`\
  \ 是用于存储输入的一个或多个变量的名称。如果没有提供变量名，shell 变量 `REPLY` 将包含该行数据。基本上，`read` 将标准输入中的字段赋值给指定的变量。如果我们修改整数脚本来使用\
  \ `read`，它看起来像这样：\n\n```bash\n#!/bin/bash\n### read-integer: 评估整数的值。\necho -n \"\
  Please enter an integer -> \"\nread int\nif [[ \"$int\" =~ ^-?[0-9]+$ ]]; then\n\
  \    if [ \"$int\" -eq 0 ]; then\n        echo \"$int is zero.\"\n    else\n   \
  \     if [ \"$int\" -lt 0 ]; then\n            echo \"$int is negative.\"\n    \
  \    else\n            echo \"$int is positive.\"\n        fi\n        if [ $((int\
  \ % 2)) -eq 0 ]; then\n            echo \"$int is even.\"\n        else\n      \
  \      echo \"$int is odd.\"\n        fi\n    fi\nelse\n    echo \"Input is not\
  \ an integer.\" >&2\n    exit 1\nfi\n```\n\n我们使用带有 `-n` 选项的 `echo`（抑制输出末尾的换行符）来显示提示符，然后使用\
  \ `read` 为变量 `int` 输入值。运行此脚本的结果如下：\n\n```\n[me@linuxbox ~]$ read-integer\nPlease\
  \ enter an integer -> 5\n5 is positive.\n5 is odd.\n```\n\n`read` 可以将输入赋值给多个变量，此脚本所示：\n\
