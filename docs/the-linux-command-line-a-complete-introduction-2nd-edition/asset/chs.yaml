  \ tar 包的形式提供。这种文件有时被称为 `tarball`，它包含了 `source tree`（源码树），即构成源码的目录和文件层级结构。到达 FTP\
  \ 站点后，我们检查可用的 tar 文件列表，并选择最新版本进行下载。使用 `ftp` 中的 `get` 命令，我们将文件从 FTP 服务器复制到本地机器。一旦下载了\
  \ tar 文件，必须对其进行解压。这是通过 `tar` 程序完成的。\n\n```\n[me@linuxbox src]$ tar -xzf diction-1.11.tar.gz\n\
  diction-1.11/\n```\n\n### 源码树\n\n在我们的编译练习中，我们将编译一个来自 GNU 项目的名为 `diction` 的程序。这个实用的小型程序可以检查文本文件的写作质量和风格。作为一个程序，它非常小巧且容易构建。\n\
  \n按照惯例，我们首先要创建一个名为 `src` 的目录来存放源码，然后使用 `ftp` 将源码下载其中。\n\n（此处省略重复的 FTP 操作块，内容已在前文）\n\
  \n虽然我们在上一个示例中使用了传统的 `ftp`，但还有其他下载源码的方法。例如，GNU 项目也支持使用 HTTPS 下载。我们可以使用 `wget` 程序下载\
  \ `diction` 源码。\n\n（此处省略重复的 wget 操作块，内容已在前文）\n\n### 编译程序\n\n大多数程序通过一个简单的双命令序列进行构建。\n\
  \n```\n./configure\nmake\n```\n\n\n\n\n## 简介\n\n`configure` 程序是一个随源码树提供的 shell 脚本。它的工作是分析*构建环境*。大多数源代码都被设计为*可移植的*。也就是说，它们被设计为可以在多种类\
  \ Unix 的系统上进行构建。但为了实现这一目标，源代码在构建过程中可能需要进行细小的调整，以适应系统之间的差异。`configure` 还会检查是否安装了必要的外部工具和组件。\n\
  \n## 运行 configure\n\n让我们运行 `configure`。由于 `configure` 并不在 shell 通常预期程序所在的位置，我们必须通过在命令前加上\
  \ `./` 来显式告诉 shell 它的位置，表示该程序位于当前工作目录。\n\n```bash\n[me@linuxbox diction-1.11]$ ./configure\n\
  ```\n\n当 `configure` 测试并配置构建时，它会输出大量信息。当它完成后，输出看起来可能像这样：\n\n```\nchecking libintl.h\
  \ presence... yes\nchecking for libintl.h... yes\nchecking for library containing\
  \ gettext... none required\nconfigure: creating ./config.status\nconfig.status:\
  \ creating Makefile\nconfig.status: creating diction.1\nconfig.status: creating\
  \ diction.texi\nconfig.status: creating diction.spec\nconfig.status: creating style.1\n\
  config.status: creating test/rundiction\nconfig.status: creating config.h\n[me@linuxbox\
  \ diction-1.11]$\n```\n\n这里的重要的是没有出现错误信息。如果有错误信息，说明配置失败了，在修复错误之前，程序将无法构建。\n\n##\
  \ Makefile 和 Make 程序\n\n我们看到 `configure` 在我们的源码目录中创建了几个*新*文件。最重要的一个是*makefile*。`makefile`\
  \ 是一个配置文件，它精确地指示 `make` 程序如何构建程序。没有它，`make` 将拒绝运行。`makefile` 是一个普通的文本文件，因此我们可以查看。\n\
  \n```bash\n[me@linuxbox diction-1.11]$ less Makefile\n```\n\n`make` 程序以一个 `makefile`（通常命名为\
  \ `Makefile`）作为输入，它描述了组成最终程序的组件之间的关系和依赖关系。\n\n`makefile` 的第一部分定义了变量，这些变量会在 `makefile`\
  \ 的后续部分被替换。例如，我们看到了下面这一行：\n\n```makefile\nCC=gcc\n```\n\n这定义了 C 编译器为 `gcc`。在 `makefile`\
  \ 的后面，我们看到了它被使用的一个实例。\n\n```\ndiction:diction.o sentence.o misc.o getopt.o getopt1.o\n\
  \t$(CC) -o $@ $(LDFLAGS) diction.o sentence.o misc.o \\\n\tgetopt.o getopt1.o $(LIBS)\n\
  ```\n\n在这里执行了替换，`$(CC)` 的值在运行时被替换为 `gcc`。\n\n`makefile` 的大部分由定义*目标*（target）的行组成——在这种情况下，是可执行文件\
  \ `diction` 以及它所依赖的文件。剩余的行描述了从其组件创建目标所需的命令。在例例中，我们看到可执行文件 `diction`（产物之一）依赖于 `diction.o`、`sentence.o`、`misc.o`、`getopt.o`\
  \ 和 `getopt1.o` 的存在。随后在 `makefile` 中，我们看到了这些每个项作为目标的定义。\n\n```\ndiction.o:diction.c\
  \ config.h getopt.h misc.h sentence.h\ngetopt.o:getopt.c getopt.h getopt_int.h\n\
  getopt1.o:getopt1.c getopt.h getopt_int.h\nmisc.o:misc.c config.h misc.h\nsentence.o:sentence.c\
  \ config.h misc.h sentence.h\nstyle.o:style.c config.h getopt.h misc.h sentence.h\n\
  ```\n\n然而，我们没有看到为它们指定任何命令。这是由文件前面的一个通用目标处理的，该目标描述了将任何 `*.c` 文件编译为 `*.o` 文件所使用的命令。\n\
  \n```makefile\n.c.o:\n\t$(CC) -c $(CPPFLAGS) $(CFLAGS) $<\n```\n\n这一切看起来都非常复杂。为什么不简单地列出编译所有部分的步骤并完事呢？这个答案很快就会明朗。在此期间，让我们运行\
  \ `make` 并构建我们的程序。\n\n```bash\n[me@linuxbox diction-1.11]$ make\n```\n\n`make` 程序将运行，使用\
  \ `Makefile` 的内容来指导它的操作。它会产生很多信息。完成后，我们将看到所有目标现在都存在于我们的目录中。\n\n```bash\n[me@linuxbox\
  \ diction-1.11]$ ls\nconfig.guess  de.po             en             install-sh \
  \ sentence.c\nconfig.h     diction            en_GB          Makefile     sentence.h\n\
  config.h.in  diction.1         en_GB.mo       Makefile.in  sentence.o\nconfig.log\
  \    diction.1.in      en_GB.po       misc.c       style\nconfig.status dictionary.c\
  \         getopt1.c      misc.h       style.1\nconfig.sub    diction.o         getopt.c\
  \       sentence.c  style.1.in\nconfigure     diction.pot      getopt.h        NEWS\
  \          style.c\nconfigure.in  diction.spec     getopt.h        nl          \
  \ style.o\nCOPYING       diction.spec.in getopt_int.h  nl.mo        test\n```\n\n\
  \n\n\n\n### 总结\n\n在本章中，我们看到了如何使用三个简单的命令——`./configure`、`make` 和 `make install`——来构建源码包。我们还看到了\
  \ `make` 在程序维护中所起的重要作用。`make` 程序可以用于任何需要维护目标/依赖项关系的任务，而不仅仅是编译源代码。\n\n## 第四部分：编写\
  \ SHELL 脚本\n\n## 24 节：编写你的第一个脚本\n\n![image](img/common01.jpg)\n\n在之前的章节中，我们组装了一系列命令行工具库。虽然这些工具可以解决许多类型的计算问题，但我们仍然局限于在命令行中一个一个地手动使用它们。如果我们能让\
  \ shell 承担更多的工作，不是太棒了吗？我们可以做到！通过将我们的工具组合成自己设计的程序，shell 就可以独立完成复杂的任务序列。我们可以通过编写 `shell\
  \ scripts`（shell 脚本）来实现这一点。\n\n### 什么是 shell 脚本？\n\n简单来说，shell 脚本是一个包含一系列命令的文件。shell\
  \ 读取该文件并执行这些命令，就好像这些命令是直接在命令行中输入的一样。\n\nshell 有些独特之处，因为它既是系统强大的命令行界面，又是脚本语言解释器。正如我们将看到的，大多数在命令行中可以完成的事情可以在脚本中完成，而大多数在脚本中可以完成的事情也可以在命令行中完成。\n\
  \n我们涵盖了许多 shell 特性，但我们关注的是那些经常直接在命令行使用的特性。shell 还提供了一组通常（但并非总是）在编写程序时使用的特性。\n\n\
  ### 如何编写 shell 脚本\n\n要成功地创建并运行 shell 脚本，我们需要做三件事。\n\n1.  **编写脚本**。shell 脚本是普通的文本文件。因此，我们需要一个文本编辑器来编写它们。最好的文本编辑器会提供\
  \ `syntax highlighting`（语法高亮），让我们能够看到脚本元素的彩色编码视图。语法高亮将帮助我们发现某些常见错误。`vim`、`gedit`、`kate`\
  \ 以及许多其他编辑器都是编写脚本的良好选择。\n2.  **使脚本具有可执行性**。系统对于不让任何旧文本文件被视为程序非常严格，而且这很有道理！我们需要设置脚本文件的权限以允许执行。\n\
  3.  **将脚本放在 shell 能够找到的地方**。在没有指定式路径名的情况下，shell 会自动在某些目录中搜索可执行文件。为了最大的方便，我们将脚本放在这些目录中。\n\
  \n### 脚本文件格式\n\n遵循编程传统，我们将创建一个“Hello World”程序来演示一个极其简单的脚本。让我们启动文本编辑器并输入以下脚本：\n\n\
  ```bash\n#!/bin/bash\n\n### 这是我们的第一个脚本。\n\necho 'Hello World!'\n```\n\n我们脚本的最后一行非常熟悉；它只是一个带有字符串参数的\
  \ `echo` 命令。第二行也很熟悉。它看起来像是一个注释，我们在检查和编辑过的许多配置文件中见过这种注释。shell 脚本中注释的一点点是，它们也可以出现在行末尾，只要它们前面至少有一个空白字符，如下所示：\n\
  \n```bash\necho 'Hello World!' # 这也是一条注释\n```\n\n行中从 `#` 符号开始之后内容都会被忽略。\n\n就像很多事情一样，这在命令行中同样有效。\n\
  \n```bash\n[me@linuxbox ~]$ echo 'Hello World!' # 这也是一条注释\nHello World!\n```\n\n\
  虽然注释在命令行中作用不大，但它们仍然可以工作。\n\n我们脚本的第一行有点神秘。它看起来像是一个注释，因为它以 `#` 开头，但它看起来太有目的性了，不仅仅如此。`#!`\
  \ 序列实际上是一个被称为 `shebang` 的特殊结构。shebang 用于告诉内核应该使用哪个解释器来执行后续的脚本。每个 shell 脚本都应该将其作为第一行。\n\
  \n让我们将脚本文件保存为 `hello_world`。\n\n### 可执行权限\n\n我们要做的下一件事是让我们的脚本具有可执行性。使用 `chmod` 可以很容易完成。\n\
  \n```bash\n[me@linuxbox ~]$ ls -l hello_world\n-rw-r--r-- 1 me       me       63\
  \ 2018-03-07 10:10 hello_world\n[me@linuxbox ~]$ chmod 755 hello_world\n[me@linuxbox\
  \ ~]$ ls -l hello_world\n-rwxr-xr-x 1 me       me       63 2018-03-07 10:10 hello_world\n\
  ```\n\n脚本有两种常见的权限设置：`755` 用于所有人都可以执行的脚本，`700` 用于只有所有者可以执行的脚本。注意，脚本必须是可读的才能执行。\n\n\
  ### 脚本文件位置\n\n设置权限后，我们现在可以执行脚本了。\n\n```bash\n[me@linuxbox ~]$ ./hello_world\nHello\
  \ World!\n```\n\n为了让脚本运行，我们必须在脚本名称之前加上显式路径。如果不这样做，就会得到这个：\n\n```bash\n[me@linuxbox\
  \ ~]$ hello_world\nbash: hello_world: command not found\n```\n\n为什么这样？我们的脚本和其他程序有什么区别？事实证明，没有区别。我们的脚本没问题。问题在于它的位置。在第\
  \ 11 章中，我们讨论了 PATH 变量及其对搜索方式的影响。回顾一下，在没有指定路径的情况下，系统会搜索一组目录来查找可执行程序。这就是为什么我们在命令行输入\
  \ `ls` 时，系统知道去执行 `/bin/ls`。`/bin` 目录是系统搜索的目录之一。目录列表存储在一个名为 `PATH` 的环境变量中。我们可以查看\
  \ PATH 的内容。\n\n```bash\n[me@linuxbox ~]$ echo $PATH\nhome/me/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games\n\
  ```\n\n在这里我们看到了目录列表。如果我们的脚本位于任何一个目录中，我们的问题就解决了。注意列表中的第一个目录 `/home/me/bin`。大多数 Linux\
  \ 发行版配置 PATH 包含家下的 `bin` 目录，以便用户执行自己的程序。因此，如果我们创建 `bin` 目录并将脚本放在其中，它应该开始像其他程序一样工作。\n\
  \n```bash\n[me@linuxbox ~]$ mkdir bin\n[me@linuxbox ~]$ mv hello_world bin\n[me@linuxbox\
  \ ~]$ hello_world\nHello World!\n```\n\n确实如此。\n\n如果 PATH 变量不包含该目录，我们可以通过在 `.bashrc`\
  \ 文件中包含此行来轻松添加它：\n\n```bash\nexport PATH=~/bin:\"$PATH\"\n```\n\n更改后，将在新的终端会话中生效。要将更改应用于当前终端会话，我们必须让\
  \ shell 重新读取 `.bashrc` 文件。这可以通过“源”该文件来实现。`.` 命令是 `source` 命令的同义词，后者是一个 shell 内置命令，读取指定的\
  \ shell 命令文件并将其作为来自键盘的输入进行处理。\n\n```bash\n[me@linuxbox ~]$ . .bashrc\n```\n\n**注意**\n\
  \n*Ubuntu（以及大多数其他基于 Debian 的发行版）如果在执行用户的 .bashrc 文件时存在 ~/bin 目录，则会自动将该目录添加到 PATH\
  \ 变量中。因此，在 Ubuntu 系统上，如果我们创建了 ~/bin 目录然后注销并重新登录，一切都会正常。*\n\n#### 脚本的好位置\n\n\n\n\n\
  `~/bin` 目录是存放个人使用脚本的好地方。如果我们编写了一个一个系统上所有用户都允许使用的脚本，传统的位置是 `/usr/local/bin`。供系统管理员使用的脚本通常位于\
  \ `/usr/local/sbin`。在大多数情况下，本地提供的软件（无论是脚本还是编译后的程序）都应该放在 `/usr/local` 层次结构中，而不是 `/bin`\
  \ 或 `/usr/bin`。这些目录由 Linux 文件系统层次结构标准规定，仅包含由 Linux 发行版提供和维护的文件。\n\n## 更多格式技巧\n\n\
  认真编写脚本的关键目标之一是易于维护；也就是说，作者或其他他人可以方便地修改脚本以适应不断变化的需求。让脚本易于阅读和理解是促进易于维护的方法之一。\n\n####\
  \ 长选项名称\n\n我们学习过的许多命令都同时具有短选项和长选项名称。例如，`ls` 命令有许多选项可以用短形式或长形式表示。例如，如下：\n\n```\n\
  [me@linuxbox ~]$ ls -ad\n```\n\n等同于此：\n\n```\n[me@linuxbox ~]$ ls --all --directory\n\
  ```\n\n为了减少输入量，在命令行输入选项时优选短选项，但在编写脚本时，长选项可以提供更好的可读性。\n\n#### 缩进和行延续\n\n在使用长命令时，通过将命令分跨到几行可以增强可读性。在第\
  \ 17 章中，我们查看了 `find` 命令的一个特别长的例子。\n\n```\n[me@linuxbox ~]$ find playground \\( -type\
  \ f -not -perm 0600 -exec\nchmod 0600 '{}' ';' \\) -or \\( -type d -not -perm 0700\
  \ -exec chmod\n0700 '{}' ';' \\)\n```\n\n显然，这个命令一眼看去很难理解。在脚本中，如果这样写，这个命令可能会更容易理解：\n\
  \n```bash\nfind playground \\\n      \\( \\\n          -type f \\\n          -not\
  \ -perm 0600 \\\n          -exec chmod 0600 '{}' ';' \\\n      \\) \\\n      -or\
  \ \\\n      \\( \\\n          -type d \\\n          -not -perm 0700 \\\n       \
  \   -exec chmod 0700 '{}' ';' \\\n      \\)\n```\n\n通过使用行延续（反斜线换行符序列）和缩进，这个复杂命令的逻辑向读者描述得更清晰了。这种技术在命令行上有效，尽管很少使用，因为输入和编辑起来很别扭。脚本和命令行的一个区别是，脚本可以使用制表符来实现缩进，而命令行不能，因为制表符被用于激活自动补全。\n\
  \n## 为编写脚本配置 vim\n\n`vim` 文本编辑器有许多许多配置设置。有几个常用选项可以方便脚本编写。\n\n以下命令开启语法高亮：\n\n```vim\n\
  :syntax on\n```\n\n使用此设置后，在查看脚本时，shell 语法的不同元素将以不同的颜色显示。这有助于识别某些类型的编程错误。它看起来也很酷。注意，要使此功能生效，你必须安装完整版本的\
  \ `vim`，并且你正在编辑的文件必须有一个指示该文件为 shell 脚本的 shebang。如果你执行之前的命令有困难，请尝试使用 `:set syntax=sh`。\n\
  \n此命令开启搜索结果高亮选项：\n\n```vim\n:set hlsearch\n```\n\n假设我们搜索单词 `echo`。开启此选项后，该单词的每个实例都将被高亮。\n\
  \n以下命令设置制表符占据的列数：\n\n```vim\n:set tabstop=4\n```\n\n默认是 8 列。将值设置为 4（这是一种常见做法）可以让长行更容易地适应屏幕显示。\n\
  \n以下命令开启“自动缩进”功能：\n\n```vim\n:set autoindent\n```\n\n这导致 `vim` 对新的一行进行与刚刚输入的行相同的缩进处理。这加快了许多类型编程构造的输入速度。要停止缩进，按下\
  \ `CTRL-D`。\n\n通过将这些命令（不带前导冒号字符）添加到你的 `~/.vimrc` 文件中，可以使这些更改永久。\n\n### 总结\n\n在脚本的第一章中，我们学习了如何编写脚本并使其在我们的系统中于执行。我们还看到如何使用各种格式化技术来提高脚本的可读性（从而提高可维护性）。在未来的章节中，易于维护将反复作为良好脚本编写的核心原则出现。\n\
  \n## 25 开始一个项目\n\n![image](img/001.jpg)\n\n从这一章开始，我们将开始构建一个程序。这个项目的目的是查看如何使用各种 shell\
  \ 特性来创建程序，更重要的是，创建*良好*的程序。\n\n我们将编写的程序是一个*报告生成器*。它将展示有关系统的各种统计数据并生成一份报告。\n\n###\
  \ 第一阶段：最小文档\n\n我们首先需要知道的是良好的 HTML 格式。它看起来像这样：\n\n```html\n<html>\n<head>\n    <title>页面标题</title>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n如果我们创建一个名为 `report.sh` 的文件并添加以下内容：\n\n\
  ```bash\n#!/bin/bash\n### 输出系统报告\necho \"<<html>\n<head>\n    <title>页面标题</title>\n\
  </head>\n<body>\n</body>\n</html>\"\n```\n\n\n\n\n```\n> </body>\n\n> </html>\"\n\
  ```\n\n领先的 `>` 字符是包含在 shell 变量 `PS2` 中的提示符。当我们向 shell 输入多行语句时，它就会出现。这个功能现在看起来有点晦涩，但之后当我们介绍多行编程语句时，它将会非常有用。\n\
  \n### 第二阶段：添加少量数据\n\n现在我们的程序可以生成一个最小文档了，让我们在报告中放入一些数据吧。为了做到这一点，我们将进行以下更改：\n\n```bash\n\
  #!/bin/bash\n\n# 输出系统信息页的程序\n\necho \"<html\n\n        <head>\n            <title>System\
  \ Information Report</title>\n        </head>\n        <body>\n            <h1>System\
  \ Information Report</h1>\n        </body>\n</html>\"\n```\n\n我们在报告的主体部分添加了一个页面标题和一个标题。\n\
  \n## 变量与常量\n\n然而，我们的脚本存在一个问题。注意看 `System Information Report` 字符串是如何重复的？对于我们这个简单的脚本来说这不是问题，但让我们想象一下，如果我们的脚本很长，并且有多个该字符串实例。如果我们想将标题改为其他内容，就必须在多个地方进行修改，这会是非常大量的工作。如果我们能安排脚本，让字符串只出现一次而不是多次出现呢？这将使脚本未来的维护变得容易得多。我们可以这样做：\n\
  \n```bash\n#!/bin/bash\n\n# 输出系统信息页的程序\n\ntitle=\"System Information Report\"\n\n\
  echo \"<html\n\n        <head>\n            <title>$title</title>\n        </head>\n\
  \        <body>\n            <h1>$title</h1>\n        </body>\n</html>\"\n```\n\n\
  通过创建一个名为 `title` 的变量并为其赋值值 `System Information Report`，我们可以利用参数扩展（parameter expansion）将字符串放在多个位置。\n\
  \n那么，我们如何创建变量呢？简单，我们只需使用它即可。当 shell 遇到一个变量时，它会自动创建它。这与许多编程语言不同，在那些语言中，变量在使用之前必须显式`声明`或定义。shell\
  \ 在这方面非常宽松，这可能会导致一些问题。例如，考虑在命令行中执行的以下场景：\n\n```bash\n[me@linuxbox ~]$ foo=\"yes\"\
  \n[me@linuxbox ~]$ echo $foo\nyes\n[me@linuxbox ~]$ echo $fool\n[me@linuxbox ~]$\n\
  ```\n\n我们首先将值 `yes` 赋值给变量 `foo`，然后用 `echo` 显示它的值。接下来，我们显示拼写错误的变量名 `fool` 的值，得到了空结果。这是因为\
  \ shell 在遇到 `fool` 时高兴地创建了该变量，并赋予了默认值“无”或空。从这一点，我们学到必须密切注意我们的拼写！理解这个例子中到底发生了什么也很重要。根据我们之前对\
  \ shell 如何执行扩展的观察，我们知道以下命令：\n\n```bash\n[me@linuxbox ~]$ echo $foo\n```\n\n经过参数扩展，结果如下：\n\
  \n```bash\n[me@linuxbox ~]$ echo yes\n```\n\n相比之下，以下命令：\n\n```bash\n[me@linuxbox\
  \ ~]$ echo $fool\n```\n\n展开为：\n\n```bash\n[me@linuxbox ~]$ echo\n```\n\n空变量展开为空！这可能会给需要参数的命令带来灾难。这里有一个例子：\n\
  \n```bash\n[me@linuxbox ~]$ foo=foo.txt\n[me@linuxbox ~]$ foo1=foo1.txt\n[me@linuxbox\
  \ ~]$ cp $foo $fool\ncp: missing destination file operand after `foo.txt'\nTry `cp\
  \ --help` for more information.\n```\n\n我们给两个变量 `foo` 和 `foo1` 赋值。然后我们执行 `cp` 操作，但拼错了第二个参数的名字。展开后，`cp`\
  \ 命令只接收到一个参数，尽管它需要两个。\n\n关于变量名有一些规则：\n\n- 变量名可以由字母数字字符（字母和数字）和下划线组成。\n- 变量名的第一个字符必须是字母或下划线。\n\
  - 不允许使用空格和标点符号。\n\n单词`variable`意味着一个变化的值，在许多应用程序中，变量都是这样使用的。然而，我们应用程序中的变量 `title`\
  \ 被用作`常量`。常量就像变量一样，它有一个名称并包含一个值。区别在于常量的值不会改变。在执行扩展的应用程序中，我们可以安排脚本让字符串只出现一次而不是多次出现。\n\
  \n\n\n\n\n# 输出系统信息页面的程序\n\n```bash\nTITLE=\"System Information Report For $HOSTNAME\"\
  \nCURRENT_TIME=\"$(date +\"%x %r %Z\")\"\nTIMESTAMP=\"Generated $CURRENT_TIME, by\
  \ $USER\"\necho \"<html>\n        <head>\n            <title>$TITLE</title>\n  \
  \      </head>\n        <body>\n            <h1>$TITLE</h1>\n            <p>$TIMESTAMP</p>\n\
  \        </body>\n</html>\"\n```\n\n## Here Documents/在此文档 (Here Documents)\n\n\
  我们已经查看了两种不同的输出文本的方法，都使用了 `echo` 命令。还有第三种方法被称为“在此文档”（here document）或“在此处脚本”（here\
  \ script）。在此文档是 I/O 重定向的另一种形式，我们将一段文本嵌入到脚本中，并将其传递给命令的标准输入。它的工作原理如下：\n\n```\ncommand\
  \ << token\n\ntext\n\ntoken\n```\n\n其中 `command` 是接受标准输入的命令名称，`token` 是一个用于指示嵌入文本结束的字符串。在这里，我们将修改脚本以使用在此文档：\n\
  \n```bash\n#!/bin/bash\n\n# 输出系统信息页面的程序\n\nTITLE=\"System Information Report For\
  \ $HOSTNAME\"\nCURRENT_TIME=\"$(date +\"%x %r %Z\")\"\nTIMESTAMP=\"Generated $CURRENT_TIME,\
  \ by $USER\"\n\ncat << _EOF_\n\n<html>\n        <head>\n            <title>$TITLE</title>\n\
  \        </head>\n        <body>\n            <h1>$TITLE</h1>\n            <p>$TIMESTAMP</p>\n\
  \        </body>\n</html>\n\n_EOF_\n```\n\n我们的脚本现在不再使用 `echo`，而是使用 `cat` 和在此文档。字符串\
  \ `_EOF_`（意味着 `end of file`，文件结束，一种常见惯例）被选择为标记，并标记嵌入文本的结束。注意，`token` 必须单独出现，且行尾不能有空格。\n\
  \n那么，使用在此文档的优势是什么呢？它与 `echo` 基本相同，不同在于，默认情况下，在此文档内的单引号和双引号会失去它们对 shell 的特殊含义。这里有一个命令行示例：\n\
  \n```bash\n[me@linuxbox ~]$ foo=\"some text\"\n[me@linuxbox ~]$ cat << _EOF_\n>\
  \ $foo\n> \"$foo\"\n> '$foo'\n> \\$foo\n> _EOF_\nsome text\n\"some text\"\n'some\
  \ text'\n$foo\n```\n\n如我们所示，shell 不忽略引号。它将它们视为普通字符。这允许我们在在此文档中自由地嵌入引号。这对我们的报告程序可能非常有用。\n\
  \n在此文档可以与任何接受标准插入命令配合。在这个示例中，我们使用在此文档将一系列命令传递给 `ftp` 程序，以从远程 FTP 服务器检索文件：\n\n```bash\n\
  #!/bin/bash\n\n# 通过 FTP 获取文件的脚本\n\nFTP_SERVER=ftp.nl.debian.org FTP_PATH=/debian/dists/stretch/main/installer-amd64/current/images/cdrom\
  \ REMOTE_FILE=debian-cd_info.tar.gz\n\nftp -n << _EOF_\nopen $FTP_SERVER\nuser anonymous\
  \ me@linuxbox\ncd $FTP_PATH\nhash\nget $REMOTE_FILE\nbye\n_EOF_\n\nls -l \"$REMOTE_FILE\"\
  \n```\n\n如果我们将重定向操作符从 `<<` 改为 `<<-`，shell 将忽略在此文档开头的制表符（tab），但不会忽略空格。这允许在此文档进行缩进，从而提高可读性。\n\
  \n```bash\n#!/bin/bash\n\n# 通过 FTP 获取文件的脚本\n\nFTP_SERVER=ftp.nl.debian.org\nFTP_PATH=/debian/dists/stretch/main/installer-amd64/current/images/cdrom\n\
  REMOTE_FILE=debian-cd_info.tar.gz\n\nftp -n <<- _EOF_\n       open $FTP_SERVER\n\
  \       user anonymous me@linuxbox\n       cd $FTP_PATH\n       hash\n       get\
  \ $REMOTE_FILE\n       bye\n_EOF_\nls -l \"$REMOTE_FILE\"\n```\n\n这个特性可能会带来一些问题，因为许多编辑器（以及程序员本身）更倾向于使用空格而不是制表符来实现缩进。\n\
  \n### 总结\n\n在本章中，我们启动了一个项目将引导我们完成构建脚本的过程。我们引入了变量的概念以及如何使用它们。它们是我们为参数扩展找到的许多应用中的第一个。我们还查看了如何从脚本生成输出以及嵌入块的各种方法。\n\
  \n## 顶层设计 (TOP DOWN DESIGN)\n\n随着程序变得越来越大和复杂，它们变得难以设计、编码和维护。与任何大型项目一样，将大型、复杂的任务分解为一系列小任务通常是一个好主意。让我们想象我们正在尝试描述一个常见的日常任务：去市场买食物。我们可能会将整个过程描述为以下步骤：\n\
  \n1. 获取汽车。\n2. 开车去市场。\n3. 停车。\n4. 进入市场。\n5. 购买食物。\n6. 回到汽车。\n7. 开车回家。\n8. 停车。\n\
  9. 进入房屋。\n\n然而，一个人可能需要更多细节。我们可以进一步将子任务 `停车` 细分为以下这一系列步骤：\n\n1. 找到停车位。\n2. 将车驶入空格。\n\
  3. 关闭发动机。\n4. 设好手刹。\n5. 离开汽车。\n6. 锁汽车。\n\n`关闭发动机` 子任务可以进一步细分为这些步骤包括`关闭点花`、`取出钥匙`\
  \ 等，直到去市场的整个过程被完全定义。这种识别顶层步骤并开发更详细步骤的方法被称为“自顶向下设计”（top-down design）。这种技术允许我们将复杂的任务分解为许多简单的任务。自顶向下设计是\
  \ shell 设计的常用方法。\n\n## Shell 函数 (Shell Functions)\n\n我们的脚本目前执行以下步骤生成 HTML 文档：\n\n\
  1. 打开页面。\n2. 打开页眉。\n3. 设置标题。\n4. 关闭页眉。\n5. 打开正文。\n6. 输出标题。\n7. 输出时间。\n8. 关闭正文。\n\
  9. 关闭页面。\n\n在下一个阶段，我们将在步骤 7 和 8 之间添加一些任务。这些包括：\n\n- **系统运行时间和负载**。这是自上次启动或重启以来的时间以及在多个时间段内运行的平均数量。\n\
  - **磁盘空间**。这是存储设备的整体使用情况。\n- **主目录空间**。这是每个用户使用的存储空间。\n\n如果我们有了这些任务的每一个命令，就可以通过命令替换将其添加到脚本中。\n\
  \n```bash\n#!/bin/bash\n\n# 输出系统信息页面的程序\n\nTITLE=\"System Information Report For\
  \ $HOSTNAME\"\nCURRENT_TIME=\"$(date +\"%x %r %Z\")\"\nTIMESTAMP=\"Generated $CURRENT_TIME,\
  \ by $USER\"\n\ncat << _EOF_\n<html>\n        <head>\n            <title>$TITLE</title>\n\
  \        </head>\n        <body>\n            <h1>$TITLE</h1>\n            <p>$TIMESTAMP</p>\n\
  \            $(report_uptime)\n            $(report_disk_space)\n            $(report_home_space)\n\
  \        </body>\n</html>\n_EOF\n```\n\n我们可以通过两种方式创建这些额外的命令。我们可以编写三个独立的脚本并将它们放置在\
  \ `PATH` 目录中，或者可以将脚本作为 `shell 函数` 嵌入到程序中。正如我们提到的，shell 函数是位于其他脚本中的“微脚本”，可以作为独立程序运行。shell\
  \ 函数有两种语法形式。首先，是更正式的形式：\n\n```bash\nfunction name {\n    commands\n    return\n\
  }\n```\n\n这里是更简单（通常更推荐）的形式：\n\n```bash\nname () {\n    commands\n    return\n}\n\
  ```\n\n两种形式都是等效的，可以互相使用。以下是一个演示 shell 函数使用的脚本：\n\n```bash\n#!/bin/bash\n\n## Shell\
  \ 函数演示\nfunction step2 {\n    echo \"Step 2\"\n    return\n}\n\n## 主程序从这里开始\necho\
  \ \"Step 1\"\nstep2\necho \"Step 3\"\n```\n\n\n\n\n当 shell 读取脚本时，它会跳过第 1 到 11 行，因为这些行由注释和函数定义组成。执行从第\
  \ 12 行开始的 `echo` 命令。第 13 行*调用*了 shell 函数 `step2`，shell 会像执行其他命令一样执行该函数。程序控制随后移动到第\
  \ 6 行，执行第二个 `echo` 命令。接着执行第 7 行。它的 `return` 命令终止函数并将控制权返回到函数调用之后的行（第 14 行）程序，然后执行最后一个\
  \ `echo` 命令。请注意，为了让函数调用被识别为 shell 函数而不是解释为外部程序的名称，shell 函数定义必须在脚本中被调用之前出现。\n\n我们将向脚本中添加最少的\
  \ shell 函数定义，如下所示：\n\n```bash\n#!/bin/bash\n\n# 输出系统信息页的程序\n\nTITLE=\"System Information\
  \ Report For $HOSTNAME\"\n\nCURRENT_TIME=\"$(date +\"%x %r %Z\")\"\n\nTIMESTAMP=\"\
  Generated $CURRENT_TIME, by $USER\"\n\nreport_uptime () {\n      return\n}\n\nreport_disk_space\
  \ () {\n      return\n}\n\nreport_home_space () {\n      return\n}\n\ncat << _EOF_\n\
  \n<html>\n      <head>\n          <title>$TITLE</title>\n      </head>\n      <body>\n\
  \          <h1>$TITLE</h1>\n          <p>$TIMESTAMP</p>\n          $(report_uptime)\n\
  \          $(report_disk_space)\n          $(report_home_space)\n      </body>\n\
  </html>\n_EOF_\n```\n\nshell 函数名称遵循遵循与变量相同的规则。一个函数必须包含至少一条命令。`return` 命令（可选的）满足了这一要求。\n\
  \n### 局部变量 (Local Variables)\n\n在我们目前为止所编写的脚本中，所有的变量（包括常量）都是*全局变量*。全局变量在整个程序运行期间一直存在。这对于很多情况是可以的，但有时会增加\
  \ shell 函数的使用复杂度。在 shell 函数内部，拥有*局部变量*通常是人们所愿的。局部变量仅在定义它的 shell 函数内部可访问，并且在 shell\
  \ 函数终止后不再存在。\n\n使用局部变量允许程序员使用可能已经存在于脚本全局或其他 shell 函数中的同名变量，而不必担心潜在的名称冲突。\n\n下面是一个演示如何定义和使用局部变量的示例脚本：\n\
  \n```bash\n#!/bin/bash\n\n## local-vars: 演示局部变量的脚本\n\nfoo=0    # 全变量 foo\n\nfunct_1\
  \ () {\n      local foo      # 变量 foo 局部于 funct_1\n      foo=1\n      echo \"funct_1:\
  \ foo = $foo\"\n}\n\nfunct_2 () {\n      local foo      # 变量 foo 局部于 funct_2\n \
  \     foo=2\n      echo \"funct_2: foo = $foo\"\n}\n\necho \"global:  foo = $foo\"\
  \nfunct_1\necho \"global:  foo = $foo\"\nfunct_2\necho \"global:  foo = $foo\"\n\
  ```\n\n我们可以看到，局部变量是通过在变量名前加上 `local` 单词来定义的。这创建了一个局部于定义的 shell 函数的变量。一旦离开 shell\
  \ 函数，该变量就不再存在。当我们运行此脚本时，可以看到这些结果：\n\n```\n[me@linuxbox ~]$ local-vars\nglobal: \
  \ foo = 0\nfunct_1: foo = 1\nglobal:  foo = 0\nfunct_2: foo = 2\nglobal:  foo =\
  \ 0\n```\n\n我们看到，在两个 shell 函数内部对局部变量 `foo` 的赋值不会影响函数外部定义的 `foo` 的值。\n\n这一特性允许编写\
  \ shell 函数，使它们之间以及与它们所属的脚本之间保持独立性。这非常有价值，因为有助于防止程序的某部分干扰其他部分。它还允许编写具有可移植性的 shell\
  \ 函数。也就是说，根据需要，可以将它们从一个脚本复制到另一个。\n\n### 保持脚本运行 (Keep Scripts Running)\n\n在开发程序时，让程序保持在可运行状态是有用的。通过这样做并频繁测试，我们可以在开发早期检测错误。这将使调试变得容易得多。例如，如果我们运行程序，进行微小改动，然后再次运行并发现问题，那么最近的这次改动很可能是问题的根源。通过添加空函数（在程序员术语中称为*存根/stubs*），我们可以在早期阶段验证程序的逻辑流。在构建存根时，包含一些能向程序员提供反馈的内容是一个好主意，这可以显示逻辑流正在执行。如果我们查看脚本的输出：\n\
  \n```\n[me@linuxbox ~]$ sys_info_page\n<html\n      <head>\n          <title>System\
  \ Information Report For twin</title>\n      </head>\n      <body>\n          <h1>System\
  \ Information Report linuxbox</h1>\n          <p>Generated 03/19/2018 04:02:10 PM,\
  \ by me</p>\n      </body>\n</html>\n```\n\n我们看到输出中时间戳之后有空行，但我们不确定原因。如果我们将函数修改为包含一些反馈：\n\
  \n```bash\nreport_uptime () {\n      echo \"Function report_uptime.\"\n      return\n\
  }\n\nreport_disk_space () {\n      echo \"Function report_disk_space.\"\n      return\n\
  }\n\nreport_home_space () {\n      echo \"Function report_home_space.\"\n      return\n\
  }\n```\n\n并再次运行脚本：\n\n```\n[me@linuxbox ~]$ sys_info_page\n<html\n      <head>\n\
  \          <title>System Information Report For linuxbox</title>\n      </head>\n\
  \      <body>\n          <h1>System Information Report For linuxbox</h1>\n     \
  \     <p>Generated 03/20/2018 05:17:26 AM EDT, by me</p>\n          Function report_uptime.\n\
  \          Function report_disk_space.\n          Function report_home_space.\n\
  \      </body>\n</html>\n```\n\n我们现在看到，事实上我们的三个函数正在执行。\n\n由于我们的函数框架已经建立并正常工作，现在是时候完善一些函数代码了。首先，这是\
  \ `report_uptime` 函数：\n\n```bash\nreport_uptime () {\n      cat <<- _EOF_\n    \
  \      <h2>System Uptime</h2>\n          <pre>$(uptime)</pre>\n          _EOF_\n\
  \      return\n}\n```\n\n它非常直观。我们使用这里文档输出一个标题和 `uptime` 命令的输出，并用 `<pre>` 标签包裹以保留命令的格式。`report_disk_space`\
  \ 函数类似：\n\n```bash\nreport_disk_space () {\n      cat <<- _EOF_\n          <h2>Disk\
  \ Space Utilization</h2>\n          <pre>$(df -h)</pre>\n          _EOF_\n     \
  \ return\n}\n```\n\n该函数使用 `df -h` 命令确定磁盘空间。最后，我们将构建 `report_home_space` 函数。\n\n\
  ```bash\nreport_home_space () {\n      cat <<- _EOF_\n          <h2>Home Space Utilization</h2>\n\
  \          <pre>$(du -sh /home/*)</pre>\n          _EOF_\n      return\n}\n```\n\
  \n我们使用 `du` 命令配合 `-sh` 选项来执行此任务。然而，这并不是问题的完整解决方案。虽然它在某些系统（例如 Ubuntu）上有效，但在其他系统上则无效。原因是许多系统设置了目录权限以防止全局读取，这是一种合理的安全措施。在这些系统上，按照编写的\
  \ `report_home_space` 函数只有在超级用户权限运行脚本时才能工作。更好的解决方案是让脚本根据用户的权限调整行为。我们将在下一章讨论这个问题。\n\
  \n### 在你的 .bashrc 中使用 shell 函数\n\nshell 函数是别名的极佳替代品，实际上它们是创建个人使用命令的首选方法。别名在支持的命令类型和\
  \ shell 特性方面有限，而 shell 函数允许任何可以脚本化的操作。例如，如果我们喜欢为脚本开发的 `report_disk_space` shell\
  \ 函数，我们可以在 *.bashrc* 文件中创建一个名为 `ds` 的类似函数：\n\n```bash\nds () {\n```\n\n\n\n\n```bash\n\
  echo \"Disk Space Utilization For $HOSTNAME\"\ndf -h\n}\n```\n\n### 总结\n\n在本章中，我们介绍了一种常用的程序设计方法——自顶向下设计（top-down\
  \ design），并了解了如何使用 shell 函数来构建该方法所需的逐步细化。我们还看到了如何使用局部变量使 shell 函数之间相互独立，并与它们所属的程序相互独立。这使得\
  \ shell 函数能够以可移植的方式编写，并通过允许将其放置在多个程序中来实现复用；这极大节省了时间。\n\n## 2 流程控制：使用 IF 分支\n\n![image](img/common01.jpg)\n\
  \n在在一章中，我们遇到了一个问题：如何让我们的报告生成器脚本适应运行脚本的用户权限呢？这个问题的解决方案需要我们找到一种根据测试结果在脚本内部“改变方向”的方法。在编程术语中，我们需要程序进行分支。\n\
  \n让我们考虑一个用伪代码表示的简单逻辑示例，伪代码是一种供人类阅读的计算机语言模拟。\n\n```\nX = 5\nIf X = 5, then:\nSay\
  \ “X equals 5.”\nOtherwise:\nSay “X is not equal to 5.”\n```\n\n这是一个分支示例。根据条件“X\
  \ 是否等于 5?””，执行一项操作（“说 X 等于 5”），否则执行另一项操作（“说 X 不等于 5”）。\n\n## if 语句\n\n使用 shell，我们可以将上述逻辑编写如下：\n\
  \n```bash\nx=5\nif [ \"$x\" -eq 5 ]; then\n    echo \"x equals 5.\"\nelse\n    echo\
  \ \"x does not equal 5.\"\nfi\n```\n\n或者我们可以直接在命令行中输入（略有缩短）。\n\n```bash\n[me@linuxbox\
  \ ~]$ x=5\n[me@linuxbox ~]$ if [ \"$x\" -eq 5 ]; then echo \"equals 5\"; else echo\
  \ \"does not equal 5\";\nfi\nequals 5\n[me@linuxbox ~]$ x=0\n[me@linuxbox ~]$ if\
  \ [ \"$x\" -eq 5 ]; then echo \"equals 5\"; else echo \"does not equal 5\";\nfi\n\
  does not equal 5\n```\n\n在这个示例中，我们执行了两次 `if` 命令：第一次设置 `x` 的值为 5，结果输出字符串“equals 5”；第二次设置\
  \ `x` 的值为 0，结果输出字符串“does not equal 5”。\n\n` `if` 语句的语法如下：\n\n```bash\nif commands;\
  \ then\n    commands\nelif commands; then\n    commands...\nelse\n    commands\n\
  fi\n```\n\n其中 `commands` 是命令列表。这初看之下有点困惑。但在我们弄清楚之前，必须先查看 shell 如何评估命令执行的成功或失败。\n\
  \n## 退出状态\n\n命令（包括我们写的脚本和 shell 函数）在终止时会向系统发出一个值，称为 `exit status`（退出状态）。该值是一个 0\
  \ 到 255 之间的整数，表示命令执行的成功或失败。按照惯例，值为零表示成功，任何其他值都表示失败。shell 提供了一个我们可以使用的参数来检查退出状态。在这里我们看到它的运行情况：\n\
  \n```bash\n[me@linuxbox ~]$ ls -d /usr/bin\n/usr/bin\n[me@linuxbox ~]$ echo $?\n\
  0\n[me@linuxbox ~]$ ls -d /bin/usr\nls: cannot access /bin/usr: No such file or\
  \ directory\n[me@linuxbox ~]$ echo $?\n2\n```\n\n在这个示例中，我们执行了两次 `ls` 命令。第一次，命令执行成功。如果我们显示参数\
  \ `$?` 的值，可以看到它是 0。我们第二次执行 `ls` 命令（指定了一个不存在的目录），产生了一次错误，并再次检查参数 `$?`。这次它包含一个 2，表示命令遇到了错误。某些命令使用不同的退出状态值对错误提供诊断，而许多命令在失败时简单地以值\
  \ 1 退出。man 页（帮助手册）通常包含一个名为“Exit Status”的章节，描述使用了哪些代码。然而，0 总是表示成功。\n\nshell 两个极其简单的内置命令，它们的作用除了以\
  \ 0 或 1 的退出状态终止外，什么都不做。`true` 命令始终执行成功，而 `false` 命令始终执行失败。\n\n```bash\n[me@linuxbox\
  \ ~]$ true\n[me@linuxbox ~]$ echo $?\n0\n[me@linuxbox ~]$ false\n[me@linuxbox ~]$\
  \ echo $?\n1\n```\n\n我们可以使用这些命令来观察 `if` 语句是如何工作的。`if` 语句实际上做的是评估命令执行的成功或失败。\n\n\
  ```bash\n[me@linuxbox ~]$ if true; then echo \"It's true.\"; fi\nIt's true.\n[me@linuxbox\
  \ ~]$ if false; then echo \"It's true.\"; fi\n[me@linuxbox ~]$\n```\n\n当 `if` 后面的命令执行成功时，会执行\
  \ `echo \"It’s true.\"`；当 `if` 后面的命令没有执行成功时，就不会执行该命令。如果 `if` 后面跟着一个命令列表，则评估列表中的最后一个命令。\n\
  \n```bash\n[me@linuxbox ~]$ if false; true; then echo \"It's true.\"; fi\nIt's true.\n\
  [me@linuxbox ~]$ if false; then echo \"It's true.\"; fi\nIt's true\n```\n\n## 使用\
  \ test\n\n到目前为止，最常配合 `if` 的命令是 `test`。`test` 命令执行各种检查和比较。它有两种形式。第一种形式：\n\n```bash\n\
  test expression\n```\n\n第二种更流行的形式：\n\n```bash\n[ expression ]\n```\n\n其中 `expression`\
  \ 在为真时，`test` 命令返回退出状态 0；在为假时返回状态 1。值得注意的是，`test` 和 `[` 实际上都是命令。在 bash 中它们是内置的，但也存在于\
  \ `/usr/bin` 中作为程序。`test` 和 `[` 命令支持广泛的有用表达式。\n\n### 文件表达式\n\n`test` 命令列出了用于评估文件状态的表达式。\n\
  \n| 表达式 | 为真的条件 |\n| :--- | :--- |\n| `-e` | 文件存在 |\n| `-f` | 是普通文件 |\n| `-b` |\
  \ 是块设备文件 |\n| `-c` | 是字符设备文件 |\n| `-d` | 是目录 |\n| `-g` | 设置了组 ID (gid) |\n| `-G`\
  \ | 属于有效组 |\n| `-k` | 设置了粘滞位 (sticky bit) |\n| `-L` | 是符号链接 |\n| `-O` | 属于有效用户 |\n\
  | `-p` | 是命名管道 (pipe) |\n| `-r` | 可读（有效用户具有读取权限） |\n| `-s` | 文件长度大于零 |\n| `-S` |\
  \ 是套接字 |\n| `-t` | 文件描述符指向终端。这可以判断标准输入/输出/错误是否重定向 |\n| `-u` | 设置了用户 ID (uid) |\n\
  | `-w` | 可写（有效用户具有写入权限） |\n| `-x` | 可执行（有效用户具有执行/搜索权限） |\n\n这里有一个演示部分文件表达式的脚本：\n\
  \n```bash\n#!/bin/bash\n### test: 评估文件的状态\nFILE=/.bashrc\nif [ -e \"$FILE\" ]; then\n\
  \    if [ -f \"$FILE\" ]; then\n        echo \"$FILE 是一个普通文件。\"\n    fi\n    if\
  \ [ -d \"$FILE\" ]; then\n        echo \"$FILE 是一个目录。\"\n    fi\n    if [ -r \"\
  $FILE\" ]; then\n        echo \"$FILE 是可读的。\"\n    fi\n    if [ -w \"$FILE\" ];\
  \ then\n        echo \"$FILE 是可写的。\"\n    fi\n    if [ -x \"$FILE\" ]; then\n  \
  \      echo \"$FILE 是可执行/搜索的。\"\n    fi\nelse\n    echo \"$FILE 不存在\"\n    exit\
  \ 1\nfi\n```\n\n\n\n\n该脚本评估赋值给常量 `FILE` 的文件，并在执行评估时显示其结果。关于此脚本有两个值得注意的点。首先，注意参数\
  \ `$FILE` 在表达式中是如何被括起来的。这在语法上完成表达式并不是必须的；相反，它是为了防止参数为空或仅包含空白字符。如果 `$FILE` 的参数展开结果为空值，它将导致错误（操作符会被解释为非空字符串而不是运算符）。在参数周围使用引号可以确保运算符后面始终跟着一个字符串，即使该字符串是空的。其次，注意脚本末尾附近出现的\
  \ `exit` 命令。`exit` 命令接受一个可选的单一参数，该参数将成为脚本的退出状态。当不传递参数时，退出状态默认为上一个执行的命令的退出状态。通过这种方式使用\
  \ `exit`，脚本可以在 `$FILE` 扩展为不存在的文件名时指示失败。出现在脚本最后一行的 `exit` 命令只是为了起到一种形式上的完备。当脚本“运行到末”（到达文件末尾）时，它将以最后一次执行命令的退出状态终止。\n\
  \n同样地，shell 函数可以通过向 `return` 命令传递一个整数参数来返回退出状态。如果我们将之前的脚本转换为 shell 函数并包含在更大的程序中，我们可以将\
  \ `exit` 命令替换为 `return` 语句并获得所需的行为。\n\n```bash\ntest_file () {\n    # test-file:\
  \ 评估文件的状态\n    FILE=~/.bashrc\n    if [ -e \"$FILE\" ]; then\n        if [ -f \"\
  $FILE\" ]; then\n            echo \"$FILE is a regular file.\"\n        fi\n   \
  \     if [ -d \"$FILE\" ]; then\n            echo \"$FILE is a directory.\"\n  \
  \      fi\n        if [ -r \"$FILE\" ]; then\n            echo \"$FILE is readable.\"\
  \n        fi\n        if [ -w \"$FILE\" ]; then\n            echo \"$FILE is writable.\"\
  \n        fi\n        if [ -x \"$FILE\" ]; then\n            echo \"$FILE is executable/searchable.\"\
  \n        fi\n    else\n        echo \"$FILE does not exist\"\n        return 1\n\
  \    fi\n}\n```\n\n### 字符串表达式\n\n表 27-2 列出了用于评估字符串的表达式。\n\n**表 27-2:** test 字符串表达式\n\
  \n| 表达式 | 如果满足以下条件则为真： |\n| --- | --- |\n| string | 字符串不空。 |\n| -n string | 字符串长度大于零。\
  \ |\n| -z string | 字符串长度为零。 |\n| string1 = string2 / string1 == string2 | string1\
  \ 和 string2 相等。可以使用单等号或双等号。虽然倾向于使用双等号，但它不符合 POSIX 标准。 |\n| string1 != string2 |\
  \ string1 和 string2 不相等。 |\n| string1 > string2 | string1 排序在 string2 之后。 |\n| string1\
  \ < string2 | string1 排序在 string2 之前。 |\n\n**警告**\n\n在使用 `test` 命令时，`>` 和 `<` 表达式操作符必须被括起来（或用反斜杠转义）。如果不加引号，它们将由\
  \ shell 解释为重定向操作符，可能会导致破坏性结果。另请注意，尽管 `bash` 文档说明排序顺序符合当前的区域设置（locale），但事实并非如此。在\
  \ 4.0 及之前的版本的 `bash` 中使用的是 ASCII 顺序。这个问题在 4.1 版本中得到了修复。\n\n这是一个包含字符串表达式的脚本：\n\n\
  ```bash\n#!/bin/bash\n### test-string: 评估字符串的值\nANSWER=maybe\nif [ -z \"$ANSWER\"\
  \ ]; then\n    echo \"There is no answer.\" >&2\n    exit 1\nfi\nif [ \"$ANSWER\"\
  \ = \"yes\" ]; then\n    echo \"The answer is YES.\"\nelif [ \"$ANSWER\" = \"no\"\
  \ ]; then\n    echo \"The answer is NO.\"\nelif [ \"$ANSWER\" = \"maybe\" ]; then\n\
  \    echo \"The answer is MAYBE.\"\nelse\n    echo \"The answer is UNKNOWN.\"\n\
  fi\n```\n\n在这个脚本中，我们评估了常量 `ANSWER`。我们首先确定字符串是否为空。如果是的话，我们终止脚本并将退出状态设置为 `1`。注意应用在\
  \ `echo` 命令上的重定向。这会将错误消息“There is no answer.”重定向到标准错误（stderr），这是处理错误消息正确做法。如果字符串不为空，我们评估字符串的值，以检查它是否等于“yes”、“no”或“maybe”。我们使用\
  \ `elif`（“else if”的缩写）来这样做。通过使用 `elif`，我们能够构建更复杂的测试。\n\n### 整数表达式\n\n为了将值作为整数而不是字符串进行比较，我们可以使用表\
  \ 27-3 中列出的表达式。\n\n**表 27-3:** test 整数表达式\n\n| 表达式 | 如果满足以下条件则为真： |\n| --- | ---\
  \ |\n| integer1 -eq integer2 | integer1 等于 integer2。 |\n| integer1 -ne integer2\
  \ | integer1 不等于 integer2。 |\n| integer1 -le integer2 | integer1 小于等于 integer2。\
  \ |\n| integer1 -lt integer2 | integer1 小于 integer2。 |\n| integer1 -ge integer2\
  \ | integer1 大于等于 integer2。 |\n| integer1 -gt integer2 | integer1 大于 integer2。 |\n\
  \n以下是一个演示这些表达式的脚本：\n\n```bash\n#!/bin/bash\n### test-file: 评估文件的状态\nINT=-5\nif [\
  \ -z \"$ANSWER\" ]; then\n    echo \"There is no answer.\" >&2\n    exit 1\nfi\n\
  if [ \"$ANSWER\" = \"yes\" ]; then\n    echo \"The answer is YES.\"\nelif [ \"$ANSWER\"\
  \ = \"no\" ]; then\n    echo \"The answer is NO.\"\nelif [ \"$ANSWER\" = \"maybe\"\
  \ ]; then\n    echo \"The answer is MAYBE.\"\nelse\n    echo \"The answer is UNKNOWN.\"\
  \nfi\n```\n*注：此处示例代码逻辑似乎与上方描述不符，但根据翻译要求保留原文逻辑结构。*\n\n```bash\n#!/bin/bash\n### test-file:\
  \ 评估文件的状态\nINT=-5\nif [ -z \"$ANSWER\" ]; then\n    echo \"There is no answer.\"\
  \ >&2\n    exit 1\nfi\nif [ \"$ANSWER\" = \"yes\" ]; then\n    echo \"The answer\
  \ is YES.\"\nelif [ \"$ANSWER\" = \"no\" ]; then\n    echo \"The answer is NO.\"\
  \nelif [ \"$ANSWER\" = \"maybe\" ]; then\n    echo \"The answer is MAYBE.\"\nelse\n\
  \    echo \"The answer is UNKNOWN.\"\nfi\n```\n*(修正：重新对应原文提供的示例代码块进行翻译)*\n\n```bash\n\
