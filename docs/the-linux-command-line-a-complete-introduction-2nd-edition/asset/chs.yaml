  \n### (( ))—为整数设计\n\n除了 `[[ ]]` 复合命令外，bash 还提供了 `(( ))` 复合命令，它对于处理整数操作非常有用。它支持全套算术评估，我们将在第\
  \ 34 章中详细介绍这一主题。\n\n`(( ))` 用于执行算术真值测试。*算术真值测试*如果算术评估的结果为非零，则结果为真。\n\n```bash\n\
  [me@linuxbox ~]$ if ((1)); then echo \"It is true.\"; fi\nIt is true.\n\n[me@linuxbox\
  \ ~]$ if ((0)); then echo \"It is true.\"; fi\n[me@linuxbox ~]$\n```\n\n使用 `(( ))`，我们可以像这样稍微简化\
  \ `test-integer2` 脚本：\n\n```bash\n#!/bin/bash\n### test-integer2a: 评估整数的值。\nINT=-5\n\
  \nif [[ \"$INT\" =~ ^-?[0-9]+$ ]]; then\n    if ((INT == 0)); then\n        echo\
  \ \"INT is zero.\"\n    else\n        if ((INT < 0)); then\n            echo \"\
  INT is negative.\"\n        else\n            echo \"INT is positive.\"\n      \
  \  fi\n        if (( ((INT % 2)) == 0)); then\n            echo \"INT is even.\"\
  \n        else\n            echo \"INT is odd.\"\n        fi\n    fi\nelse\n   \
  \ echo \"INT is not an integer.\" >&2\n    exit 1\nfi\n```\n\n注意，我们使用了小于号和大于号，并使用\
  \ `==` 来测试等价性。对于处理整数来说，这是一种更自然的语法。同样注意，因为复合命令 `(( ))` 是 shell 语法的一部分而不是普通命令，而且它只处理整数，因此能够通过名称识别变量，而不需要进行扩展。我们将在第\
  \ 34 章中进一步讨论 `(( ))` 和相关的算术扩展。\n\n### 组合表达式\n\n还可以组合表达式来创建更复杂的评估。表达式通过使用逻辑运算符进行组合。我们在第\
  \ 17 章学习 `find` 命令时见过它们。对于 `test` 和 `[[ ]]` 有三种逻辑操作：AND（与）、OR（或）和 NOT（非）。`test`\
  \ 和 `[[ ]]` 使用不同的运算符来表示这些操作，如表 27-4 所示。\n\n**表 27-4：** 逻辑运算符\n\n| 操作 | test | [[\
  \ ]] 和 (( )) |\n| --- | --- | --- |\n| AND | -a | && |\n| OR | -o | &#124;&#124;\
  \ |\n| NOT | ! | ! |\n\n这是一个 AND 操作的示例。以下脚本确定整数是否在一个值范围内：\n\n```bash\n#!/bin/bash\n\
  # test-integer3: 确定整数是否在指定的\n# 值范围内。\nMIN_VAL=1\nMAX_VAL=100\nINT=50\n\nif [[ \"\
  $INT\" =~ ^-?[0-9]+$ ]]; then\n    if [[ \"$INT\" -ge \"$MIN_VAL\" && \"$INT\" -le\
  \ \"$MAX_VAL\" ]]; then\n        echo \"$INT is within $MIN_VAL to $MAX_VAL.\"\n\
  \    else\n        echo \"$INT is out of range.\"\n    fi\nelse\n    echo \"INT\
  \ is not an integer.\" >&2\n    exit 1\nfi\n```\n\n在这个脚本中，我们确定 `INT` 的值是否位于 `MIN_VAL`\
  \ 和 `MAX_VAL` 的值之间。这是通过使用一次 `[[ ]]` 实现的，它包含了两个由 `&&` 运算符分隔的表达式。我们也可以使用 `test` 来编写代码：\n\
  \n```bash\nif [ \"$INT\" -ge \"$MIN_VAL\" -a \"$INT\" -le \"$MAX_VAL\" ]; then\n\
  \    echo \"$INT is within $MIN_VAL to $MAX_VAL.\"\nelse\n    echo \"$INT is out\
  \ of range.\"\nfi\n```\n\n`!` 取反运算符会反转表达式的结果。如果表达式为假，则它返回真；如果表达式为真，则它返回假。在以下脚本中，我们修改了逻辑来寻找指定范围外的\
  \ `INT` 值：\n\n```bash\n#!/bin/bash\n# test-integer4: 确定整数是否在指定的\n# 值范围之外。\nMIN_VAL=1\n\
  MAX_VAL=100\nINT=50\n\nif [[ \"$INT\" =~ ^-?[0-9]+$ ]]; then\n    if [[ ! (\"INT\"\
  \ -ge \"$MIN_VAL\" && \"$INT\" -le \"$MAX_VAL\") ]]; then\n        echo \"$INT is\
  \ outside $MIN_VAL to $MAX_VAL.\"\n    else\n        echo \"$INT is in range.\"\n\
  \    fi\nelse\n    echo \"INT is not an integer.\" >&2\n    exit 1\nfi\n```\n\n\
  我们还在表达式周围包含了括号以便分组。如果不包含这些括号，取反将只作用于第一个表达式，而不是两个表达式的组合。使用 `test` 编写代码将是这种方式：\n\n\
  ```bash\nif [ ! \"$INT\" -ge \"$MIN_VAL\" -a \"$INT\" -le \"$MAX_VAL\" ]; then\n\
  \    echo \"$INT is outside $MIN_VAL to $MAX_VAL.\"\nelse\n    echo \"$INT is in\
  \ range.\"\nfi\n```\n\n\n\n\n\n我们从一个问题开始了这一章：我们如何让自己的 `sys_info_page` 脚本检测用户是否具有读取所有主目录的权限？根据我们对\
  \ `if` 的了解，可以通过将此代码添加到 `report_home_space` 函数中解决这个问题：\n\n```bash\nreport_home_space\
  \ () {\n    if [[ \"$(id -u)\" -eq 0 ]]; then\n        cat <<- _EOF_\n         \
  \   <h2>主空间占用 (所有用户)</h2>\n            <pre>$(du -sh /home/*)</pre>\n        _EOF_\n\
  \    else\n        cat <<- _EOF_\n            <h2>主空间占用 ($USER)</h2>\n         \
  \   <pre>$(du -sh $HOME)</pre>\n        _EOF_\n    fi\n    return\n}\n```\n\n我们评估了\
  \ `id` 命令的输出。使用 `-u` 选项，`id` 会输出有效用户的数字 ID。超级用户始终为 ID 零，其他所有用户都是大于零的数字。知道这一点，我们可以构造两个不同的在此在此文档（here\
  \ documents），一个利用超级用户权限，另一个则限制在用户自己的主目录内。\n\n我们将暂时停止 `sys_info_page` 程序，但别担心，它会回来的。在此期间，我们将涵盖在恢复工作时需要的一些主题。\n\
  \n## 28 读取键盘输入\n\n![image](img/common01.jpg)\n\n我们到为止编写的脚本缺乏大多数计算机程序中常见的一个功能：交互性，或者程序与用户交互的能力。虽然许多程序不需要交互性，但某些程序从能够直接从用户那里接受输入中受益。例如，上一章中的这个脚本：\n\
  \n```bash\n#!/bin/bash\n\n### test-integer2: 评估整数的值。\nINT=-5\n\nif [[ \"$INT\" =~\
  \ ^-?[0-9]+$ ]]; then\n    if [ \"$INT\" -eq 0 ]; then\n        echo \"INT is zero.\"\
  \n    else\n        if [ \"$INT\" -lt 0 ]; then\n            echo \"INT is negative.\"\
  \n        else\n            echo \"INT is positive.\"\n        fi\n        if [\
  \ $((INT % 2)) -eq 0 ]; then\n            echo \"INT is even.\"\n        else\n\
  \            echo \"INT is odd.\"\n        fi\n    fi\nelse\n    echo \"INT is not\
