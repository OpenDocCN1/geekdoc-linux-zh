  \ root 55214 May 12 10:00 xz\n-rwxr-xr-x 1 root root 78914 May 12 10:00 zip\n-rwxr-xr-x\
  \ 1 root root 33146 May 12 10:00 zcat\n```\n\n这里是脚本的内容（带行号）：\n\n```bash\n#!/bin/bash\n\
  \n# array-2: Use arrays to tally file owners\n\ndeclare -A files file_group file_owner\
  \ groups owners\n\nif [ ! -d \"$1\" ]; then\n    echo \"Usage: array-2 dir\" >&2\n\
  \    exit 1\nfi\n\nfor i in \"$1\"/*; do\n    owner=$(stat -c %U)\n    group=$(stat\
  \ -c %G)\n    files[\"$i\"]=\"$i\"\n    file_owner[\"$i\"]=\"$owner\"\n    file_group[\"\
  $i\"]=\"$group\"\n    ((++owners[$owner]))\n    ((++groups[$group]))\ndone\n\n#\
  \ List collected files\nfor i in \"${files[@]}\"; do\n    printf \"%-40s %-10s %-10s\\\
  n\" \\\n          \"$i\" \"${file_owner[\"$i\"]}\" \"${file_group[\"$i\"]}\"\ndone\
  \ | sort\n\necho\n\n# List owners\necho \"File owners:\"\nfor i in \"${!owners[@]}\"\
  ; do\n    printf \"%-10s: %5d file(s)\\n\" \"$i\" \"${owners[\"$i\"]}\"\ndone |\
  \ sort\n\necho\n\n# List groups\necho \"File group owners:\"\nfor i in \"${!groups[@]}\"\
  ; do\n    printf \"%-10s: %5d file(s)\\n\" \"$i\" \"${groups[\"$i\"]}\"\ndone |\
  \ sort\n```\n\n\n\n\n让我们来看这个脚本的运行机制。\n\n**第 5 行**：关联数组必须使用 `declare` 命令配合 `-A` 选项来创建。在脚本中，我们创建了五个数组：\n\
  \n*   `files` 包含目录下的文件名，以文件名作为索引。\n*   `file_group` 包含每个文件的组所有者，以文件名作为索引。\n*   `file_owner`\
  \ 包含每个文件的所有者，以文件名作为索引。\n*   `groups` 包含属于索引组的文件数。\n*   `owners` 包含属于索引所有者的文件数。\n\
  \n**第 7–10 行**：这些行检查了是否作为位置参数传递了有效的目录名。如果没有，则会显示用法信息，脚本将以状态码 `1` 退出。\n\n**第 12–20\
  \ 行**：这些行遍历目录中的文件。使用 `stat` 命令，第 13 行和第 14 行提取文件所有者和组所有者的名称，并将文件名作为数组索引将值赋值给相应的数组（第\
  \ 16 行和第 17 行）。同样，文件名本身被赋值给 `files` 数组（第 15 行）。\n\n**第 18–19 行**：属于文件所有者和组所有者的文件总数加\
  \ 1。\n\n**第 22–27 行**：输出文件列表。这是通过 `${array[@]}` 参数扩展实现的，它会展开为整个数组元素列表，每个元素被视为独立的单词。这允许文件名可能包含嵌入空格。另外注意，整个循环被包裹在大括号中，从而形成了一个组命令。这允许将循环的所有输出管道到\
  \ `sort` 命令中。这是必要的，因为数组元素的展开并不是经过排序的。\n\n**第 29–40 行**：这两个循环与文件列表循环相似，不同在于它们使用了\
  \ `${!array[@]}` 扩展，它展开为数组索引列表而不是数组元素列表。\n\n### 进程替换 (Process Substitution)\n\n\
  虽然它们看起来相似，并且都可以用于合并流以重定向，但组命令（group commands）和子壳（subshells）之间存在重要区别。组命令在当前 shell\
  \ 中执行其所有命令，而子壳（如名所示）在当前 shell 的子副本中执行其命令。这意味着环境被复制并提供给 shell 的新实例。当子壳退出时，环境的副本就会丢失，因此对子壳环境进行的任何更改（包括变量赋值）也会丢失。因此，在大多数情况下，除非脚本需要子壳，否则组命令优于子壳。组命令速度更快且所需内存更少。\n\
  \n我们在第 28 章看到了子壳环境问题的示例，当时我们发现管道中的 `read` 命令并不像我们直觉预期的那样工作。回顾一下，如果我们构建如下流水线：\n\n\
  ```\necho \"foo\" | read\necho $REPLY\n```\n\n`REPLY` 变量的内容始终为空，因为 `read` 命令在子壳中执行，它的\
  \ `REPLY` 副本在子壳终止时被销毁。\n\n由于管道中的命令始终在子壳中执行，任何分配变量的命令都会遇到这个问题。幸运的是，shell 提供了一种名为“进程替换”的奇特扩展形式，可以用来绕过这个问题。\n\
  \n进程替换有两种表示方式。\n\n对于产生标准输出的进程，如下所示：\n\n```\n<(list)\n```\n\n对于读取标准输入的进程，如下所示：\n\n\
  ```\n>(list)\n```\n\n其中 `list` 是命令列表。\n\n为了解决我们的 `read` 问题，我们可以像这样使用进程替换：\n\n```\n\
  read < <(echo \"foo\")\necho $REPLY\n```\n\n进程替换允许我们认为子壳的输出是一个普通文件以进行重定向。事实上，由于它是扩展的一种形式，我们可以检查它的真实值。\n\
  \n```bash\n[me@linuxbox ~]$ echo <(echo \"foo\")\n/dev/fd/63\n```\n\n通过使用 `echo`\
  \ 查看扩展结果，我们看到子壳的输出是由一个名为 `/dev/fd/63` 的文件提供的。\n\n进程替换通常与包含 `read` 的循环一起使用。这里有一个处理子壳创建的目录列表内容的\
  \ `read` 循环示例：\n\n```bash\n#!/bin/bash\n\n# pro-sub: 进程替换演示\n\nwhile read attr links\
  \ owner group size date time filename; do\n    cat << EOF\n        Filename:   \
  \ $filename\n        Size:       $size\n        Owner:      $owner\n        Group:\
  \      $group\n        Modified:    $date $time\n        Links:      $links\nEOF\n\
  done < <(ls -l)\n```\n\n\n\n\n```bash\nexit_on_signal_SIGINT () {\n      echo \"\
  Script interrupted.\" 2>&1\n      exit 0\n}\n\nexit_on_signal_SIGTERM () {\n   \
  \   echo \"Script terminated.\" 2>&1\n      exit 0\n}\n\ntrap exit_on_signal_SIGINT\
  \ SIGINT\ntrap exit_on_signal_SIGTERM SIGTERM\n\nfor i in {1..5}; do\n      echo\
  \ \"Iteration $i of 5\"\n      sleep 5\ndone\n```\n\n此脚本包含两个 `trap` 命令，每个命令对应一个信号。每个\
  \ `trap` 分别指定了在接收到特定信号时执行的 Shell 函数。请注意，在每个信号处理函数中都包含一个 `exit` 命令。如果没有 `exit`，脚本在完成函数后将继续执行。\n\
  \n当用户在脚本执行期间按下 `CTRL-C` 时，结果如下：\n\n```\n[me@linuxbox ~]$ trap-demo2\nIteration 1\
  \ of 5\nIteration 2 of 5\n^CScript interrupted.\n```\n\n### 临时文件\n\n在脚本中包含信号处理程序的一个原因是删除脚本在执行过程中可能创建的用于存储中间结果的临时文件。命名临时文件很有艺术。传统上，Unix\
  \ 类系统上的程序在 `/tmp` 目录下创建临时文件，这是一个为此类文件设计的共享目录。然而，由于该目录是共享的，这带来了某些安全担忧，特别是对于以超级用户权限运行的程序。除了对系统中所有用户可见的文件设置适当权限这一明显的步骤外，为临时文件提供不可预测的文件名也是重要的。这可以避免一种被称为\
  \ `temp race attack`（临时竞争攻击）的。创建不可预测（但仍具描述性）名称的一种方法是：\n\n```\ntempfile=/tmp/$(basename\
  \ $0).$.$RANDOM\n```\n\n这将创建一个由程序名称、其进程 ID (PID) 以及一个随机整数组成的文件名。但请注意，Shell 变量 `$RANDOM`\
  \ 返回的值范围仅在 1–32767 之间，这在计算机术语中并不是一个很大的范围，因此单个变量实例不足以克服有心之意的攻击者。\n\n更好的方法是使用 `mktemp`\
  \ 程序（不要与标准库函数 `mktemp` 混淆）来同时命名并创建临时文件。`mktemp` 程序接受一个模板作为参数，用于构建文件名。模板应包含一系列 `X`\
  \ 字符，这些字符将被替换为相应数量的随机字母和数字。`X` 序列越长，随机字符序列就越长。这里有一个示例：\n\n```\ntempfile=$(mktemp\
  \ /tmp/foobar.$$.XXXXXXXXXX)\n```\n\n这会创建一个临时文件并将将其赋值给变量 `tempfile`。模板中的 `X` 字符被替换为随机字母和数字，因此最终文件名（在本例中，还包含了特殊参数\
  \ `$$` 扩展后的值以获取 PID）可能如下所示：\n\n```\n/tmp/foobar.6593.UOZuvM6654\n```\n\n对于由普通用户执行的脚本，避免使用\
  \ `/tmp` 目录并在用户主目录下创建临时文件目录可能是明智的，可以使用如下代码：\n\n```bash\n[[ -d $HOME/tmp ]] || mkdir\
  \ $HOME/tmp\n```\n\n## 使用 wait 进行异步执行\n\n有时需要同时执行多个任务。我们已经看到所有现代操作系统至少是支持多任务的，也可以是多用户的。脚本可以构造成以多任务的方式运行。\n\
  \n通常这涉及启动一个脚本，该脚本随后启动一个或多个子脚本来执行额外任务，而父脚本继续运行。然而，当一组脚本以此方式运行时，保持父子之间的协调可能会出现问题。也就是说，如果父脚本或子脚本依赖另一个，且一个脚本必须等待另一个脚本完成任务才能完成自己的任务，该怎么办？\n\
  \n`bash` 有内置命令来帮助管理此类 `asynchronous execution`（异步执行）。`wait` 命令导致父脚本暂停，直到指定的进程（即子脚本）完成。为了演示这一点，我们需要两个脚本。第一个是父脚本。\n\
  \n```bash\n#!/bin/bash\n# async-parent: Asynchronous execution demo (parent)\n\n\
  echo \"Parent: starting...\"\necho \"Parent: launching child script...\"\nasync-child\
  \ &\npid=$!\necho \"Parent: child (PID= $pid) launched.\"\necho \"Parent: continuing...\"\
  \nsleep 2\necho \"Parent: pausing to wait for child to finish...\"\nwait \"$pid\"\
  \necho \"Parent: child is finished. Continuing...\"\necho \"Parent: parent is done.\
  \ Exiting.\"\n```\n\n第二个是子脚本。\n\n```bash\n#!/bin/bash\n# async-child: Asynchronous\
  \ execution demo (child)\n\necho \"Child: child is running...\"\nsleep 5\necho \"\
  Child: child is done. Exiting.\"\n```\n\n在这个示例中，我们看到子脚本非常简单。实际操作是由父脚本执行的。在父脚本中，启动子脚本并将其放入后台。子脚本的进程\
  \ ID 通过将 `pid` 变量赋值为 `$!` Shell 参数的值来记录，该参数始终包含最后一个放入后台的任务的进程 ID。\n\n父脚本继续执行并执行\
  \ `wait` 命令。执行时，父脚本和子脚本产生以下输出：\n\n```\n[me@linuxbox ~]$ async-parent\nParent: starting...\n\
  Parent: launching child script...\nParent: child (PID= 6741) launched.\nParent:\
  \ continuing...\nParent: pausing to wait for child to finish...\nChild: child is\
  \ done. Exiting.\nParent: child is finished. Continuing...\nParent: parent is done.\
  \ Exiting.\n```\n\n## 命名管道\n\n在大多数 Unix 类系统中，可以创建一个名为命名管道的特殊文件。命名管道用于创建两个进程之间的连接，并可以像其他文件一样使用。它们并不那么流行，但了解它们是有用的。\n\
  \n有一种编程架构叫做 `client-server`（客户端-服务器），它可以使用命名管道，以及其他类型的进程间通信。最常用的客户端服务器系统当然是网络浏览器。网络浏览器作为客户端向服务器发送请求，服务器向浏览器返回网页。\n\
  \n命名管道的行为类似于文件，但实际上形成了先进先出（FIFO）缓冲区。与普通的（无名）管道一样，数据从一端进入从另一端出来。通过命名管道，可以这样设置：\n\n\
  ```\nprocess1 > named_pipe\n```\n\n以及：\n\n```\nprocess2 < named_pipe\n```\n\n它们的行为类似于：`process1\
  \ | process2`\n\n### 设置命名管道\n\n首先，我们必须创建一个命名管道。这是通过 `mkfifo` 命令完成的。\n\n```\n[me@linuxbox\
  \ ~]$ mkfifo pipe1\n[me@linuxbox ~]$ ls -l pipe1\nprw-r--r-- 1 me  me  0 2018-07-17\
  \ 06:41 pipe1\n```\n\n在这里我们使用 `mkfifo` 创建了一个名为 `pipe1` 的命名管道。使用 `ls` 检查该文件，可以看到属性字段的第一个字母是\
  \ `p`，表示它是一个命名管道。\n\n### 使用命名管道\n\n为了演示命名管道如何工作，我们需要两个终端窗口（或者是两个虚拟控制台）。在第一个终端中，我们输入一个简单的命令并将其输出重定向到命名管道。\n\
  \n```\n[me@linuxbox ~]$ ls -l > pipe1\n```\n\n当我们按下回车键后，该命令似乎挂起了。这是因为还没有东西从管道的另一端接收数据。当这种情况发生时，说是管道被\
  \ `blocked`（阻塞）。一旦我们将进程附加到另一端并它开始从管道读取输入，这种状态就会消失。在第二个终端窗口中，我们输入以下命令：\n\n```\n[me@linuxbox\
  \ ~]$ cat < pipe1\n```\n\n\n\n\n\n从第一个终端窗口产生的目录列表将出现在第二个终端中，显示为 `cat` 命令的输出。第一个终端中的\
  \ `ls` 命令在不再被阻塞后将成功完成。\n\n### 总结\n\n好了，我们已经完成了这段旅程。现在唯一需要做的就是练习、练习、再练习。尽管我们在这次旅行中涵盖了大量内容，但在命令行方面，我们仅仅触及皮毛。仍有数以千计命令行程序等待我们发现和享受。开始在\
