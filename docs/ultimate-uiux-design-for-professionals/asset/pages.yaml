    # Iterate and Improve


    Integrate the methodology of UX research into your design philosophy. UX research
    is a continuous process that should not be abandoned once designing and development
    are underway. Keep in mind that UX research is an ongoing endeavor. After you
    go back home, organize another trip and continue to get feedback and develop your
    product. Great user experiences are mostly a result of this cycle of learning,
    making improvements, and then learning some more. Setting high priority for excellent
    UX research will enhance your design culture, increase conversions, and maintain
    happy, involved users.


    Here you have it: a basic overview of the UX research methodology!


    # UX Research Methods


    Now that your goals and research framework have been established, it’s time for
    the exciting part: selecting the research methodology that will best advance your
    project’s aims and yield the necessary insights. This section will walk you through
    the most often used research methodologies and assist you in selecting the most
    appropriate one for your purposes.


    Every research technique falls into one of these groups, each with specific aims
    and objectives:


    +   - Qualitative versus Quantitative


    +   - Behavioral versus Attitudinal


    +   - Generative versus Evaluative


    | Qualitative versus Quantitative | Behavioral versus Attitudinal | Generative
    versus Evaluative |

    |---|---|---|

    | Information that can be measured quantitatively and provides statistical and
    numerical insights is referred to as quantitative data. On the other hand, non-numerical
    insights and descriptive data make up qualitative data, which provides a deeper
    comprehension of underlying patterns, behaviors, | The activities consumers take
    when interacting with products, finishing tasks, or solving problems are tracked
    by behavioral data. On the other hand, attitudinal data records users’ ideas,
    viewpoints, and convictions and offers a window into their motives and beliefs.
    | The goal of generative research is to generate fresh concepts and remedies that
    benefit users. Evaluative research, on the other hand, aims to determine how consumers
    react to and perceive an existing solution in order to evaluate its effectiveness
    and pinpoint areas in need of development. |'
