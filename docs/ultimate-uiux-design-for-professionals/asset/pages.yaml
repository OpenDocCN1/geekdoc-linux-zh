    # Effective Technique to Conduct Focus Groups


    To conduct user experience research using focus groups, follow these steps:


    +   1. Plan a schedule that allows time for recruiting, testing, analyzing, and
    incorporating results.

    +   2. Gather your team and assign roles: moderator, note-taker, and discussion
    leader.

    +   3. Determine the scope of your research: What questions will you ask? How
