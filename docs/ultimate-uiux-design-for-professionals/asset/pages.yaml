  md: 'real-world environments with digital elements (AR), offering new possibilities
    for design and user experience.


    +   - **Brainstorming:** A creative technique for generating a large number of
    ideas or solutions through open and spontaneous discussion within a group.

    +   - **User Mapping:** The process of creating visual representations of users’
    interactions with a product or service, often used to identify opportunities for
    improvement and innovation.

    +   - **Persona:** A fictional representation of a target user group, based on
    demographic, psychographic, and behavioral characteristics, used to guide design
    decisions and strategies.'
