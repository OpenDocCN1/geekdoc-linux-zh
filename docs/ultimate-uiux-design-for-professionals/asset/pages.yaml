    # Usability Testing


    Usability testing is a key part of UX research, involving real users from the
    target audience to assess a website or app’s readiness for launch. It measures
    how easily users can complete common tasks, providing a clear picture of the overall
    user experience. This approach helps identify usability issues and areas for improvement
    before the product’s formal release.


    Usability tests typically involve three components: the facilitator (a UX researcher
    who conducts the test and records data), participants (who perform tasks designed
    to mimic real-life use), and the tasks themselves.


    The benefits of usability testing include reducing assumptions by gathering real
    user data, which reveals whether the product will be effective.


    There are several forms of usability testing, including:


    +   1. **Moderated Usability Testing:** Conducted by a researcher who guides and
    observes participants in real-time, either in person or via video conference.

    +   2. **Unmoderated Usability Testing:** Participants complete tasks independently
    while interactions are recorded by software, usually done remotely.

    +   3. **Remote Usability Testing:** Participants test the product in their own
    environment, with options for moderated or unmoderated sessions.

    +   4. **In-Person Usability Testing:** Conducted in a lab setting with the researcher
    present to observe and record.

    +   5. **Explorative Usability Testing:** Early-stage testing to gather feedback
    on user needs and behaviors.

    +   6. **Assessment Usability Testing:** Evaluates the product’s effectiveness
    and efficiency later in the development process.

    +   7. **Comparative Usability Testing:** Compares multiple designs to determine
    which design offers a better user experience.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'These methods provide valuable insights into user interactions, helping to
