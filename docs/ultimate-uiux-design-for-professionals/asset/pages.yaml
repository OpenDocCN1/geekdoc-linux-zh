    You should undertake usability testing early and regularly in the process to help
    guide your design selections. You can use the following guidelines to determine
    when usability testing is appropriate:


    +   - Prior to beginning any design work

    +   - As soon as you have a prototype or wireframe ready

    +   - Before the product’s release

    +   - After launch, at frequent periods'
