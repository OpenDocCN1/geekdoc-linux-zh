- pgno: 339
  md: '# F-Pattern Layout


    Based on how people normally read and scan text-heavy content, designers created
    the F-pattern layout. This design mimics the letter “F,” which is representative
    of people’ innate tendency to scan from top to bottom and left to right. There
    are two horizontal and one vertical stroke in the F-pattern.


    ![](img/5fa48c4cd6454bfb24b9d1359df45cda_339_0.png)


    ![](img/5fa48c4cd6454bfb24b9d1359df45cda_339_1.png)


