    # Pain Points and Challenges


    The term “Pain Points and Challenges” describes the particular issues and barriers
    that a persona faces on a regular basis or when utilizing a product.


    # Finding Pain Points:


    +   - **Present Dissatisfactions:** Issues that cause frustration, such as complicated
    tools that slow down Sharan, a project manager.

    +   - **Unmet Needs:** Problems not fully addressed by current solutions, like
    Sharan needing better tool integration.

    +   - **Inefficiencies:** Time-consuming procedures, such as the lack of a central
    dashboard making it hard for Sharan to track team progress.


    # Understanding Challenges:


    +   - **External Obstacles:** Factors beyond the persona’s control, like budget
    constraints limiting Sharan’s access to necessary software.

    +   - **Internal Barriers:** Personal limitations or skill gaps, such as Sharan
    feeling overwhelmed by new technologies.

    +   - **Contextual Issues:** Situational challenges, like communication barriers
    for Sharan when working remotely.


