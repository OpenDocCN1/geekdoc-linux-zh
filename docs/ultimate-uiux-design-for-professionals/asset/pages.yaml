    # [Leaderboard: See Who is on Top](#)


    Picture yourself at a sporting event with a large scoreboard displaying the best
    athletes or teams. For apps and games, a leaderboard accomplishes the same thing
    by displaying a list of top players based on particular scores or achievements.


    For **instance**, you can come across a leaderboard in a mobile game where the
    players with the greatest scores are featured first. You can view who’s in the
    lead and how your score compares. This configuration encourages you to raise your
    score by showing you how you compare to others.


    Another **example** is on a social media platform where users earn badges or points.
    A leaderboard may display the usernames and profile images of the top contributors
    or most popular posts. Users are encouraged to participate more in the community
    and to be more active as a result.


    Leaderboards can be as basic as names and scores, or they can be more'
  merge: -1
