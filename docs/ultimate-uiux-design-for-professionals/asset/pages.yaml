    # Key Terms


    +   - UX Mapping: A visual representation of the user’s experience and interaction
    with a product or service, used to identify pain points and opportunities for
    improvement.

    +   - Point of View: The perspective from which a user or a designer approaches
    a problem, considering their needs, goals, and challenges.

    +   - Scope: The extent and boundaries of a project, defining what will be included
    and what will be excluded in the user experience design.

    +   - Chronological Structure: An organizational method that arranges information
    or events in the order they occur over time.

    +   - Hierarchical Structure: An organizational method that arranges information
    in a ranked or leveled manner, from most to least important.

    +   - User Research: The process of understanding user behaviors, needs, and motivations
    through observation techniques, task analysis, and other feedback methodologies.

    +   - Customer Interactions: The various ways in which customers engage with a
    brand, product, or service, including in-person, online, and through customer
