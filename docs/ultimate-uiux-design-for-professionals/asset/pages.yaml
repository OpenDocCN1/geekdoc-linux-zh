  md: '# Usable


    To put it simply, usability is the gauge of how simple a thing is to use. Usability
    is a fundamental UX design principle because without it, you cannot build a product
    that offers a satisfying user experience. Good usability products are efficient,
    easy to use, and don’t put users through needless obstacles or complications.


    ![](img/5fa48c4cd6454bfb24b9d1359df45cda_113_0.png)


    Figure 2.11: UX Honeycomb Factor 2. Usable


    # Example:


    Smartphone : A smartphone is a portable device that integrates multiple functions,
    including messaging, calling, web surfing, taking pictures, and installing programs.
    With features like touchscreens, streamlined menus, and app interfaces that let
    users explore and get information fast, it’s made to be intuitive and simple to
    use. Furthermore, to ensure that they continue to be functional and relevant over
    time, cellphones frequently receive upgrades that'
