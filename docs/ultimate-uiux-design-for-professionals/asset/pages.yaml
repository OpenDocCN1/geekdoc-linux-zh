    # Different Methods for Making Prototypes


    Prototyping is a way to turn your ideas into something real that you can see,
    touch, and test. There are different methods for making prototypes, and each one
    has its own benefits. Let us dive into some fun and easy-to-understand prototype
    methods:


    +   - **Paper Prototypes:** Picture this – you draw your app or website screens
    on paper, then shuffle through them like a flipbook. It’s like a storyboard for
    your project. Want to test if your idea works? Just flip through and see!

    +   - **Wizard of Oz:** No, we’re not talking about the movie. In this method,
    you create a pretend version of your product. It’s like putting on a play! You
    act out how the product would work behind the scenes while the user interacts
    with it, giving you valuable insights.

    +   - **Role Playing:** Time to get into character! With role-playing, team members
    pretend to be users and interact with the prototype. It’s like playing make-believe,
    but it helps you see how users might really use your product.

    +   - **Digital Prototypes:** Think of this as a sneak peek of your final product.
    Using software, you create a digital version of your idea. It’s like building
    a mini version of your app or website that people can click'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'through and explore.


    +   - **Prototype Apps:** Ever heard of prototyping tools like Figma or InVision?
    They’re like virtual playrooms where you can build interactive models of your
    product. Just drag and drop elements to design your prototype – no coding required!


    +   - **3D Printing:** Imagine bringing your idea to life with a magic printer!
    With 3D printing, you can create physical models of your product. It’s like sculpting,
    but in the digital age.


    Each of these methods is like a different tool in your creative toolbox. Whether
    you’re sketching on paper or clicking around in a digital app, prototyping helps
    you turn your ideas into reality, one step at a time!


    # 5. Test


    This phase is like putting your design under a microscope. It helps designers
    spot any problems in the design and discover any areas where users might still
    be struggling. Sometimes, even if a design seems perfect to designers or clients,
    it can still have big issues for the people who will actually use it.


    Now, you’re reaching the last step of the design thinking process. It’s time to
    put your prototype to the test with real users, gather feedback, and see how well
    it works. This step is similar to Step 1, where you focused on understanding your
    users’ needs and feelings.


    During testing, you’ll watch your target users, or people who represent them,
    as they try out your prototype. You’ll also ask for their thoughts and feelings
    about the experience. This helps you understand how users really feel about your
    design and where it might need improvements.


    # User Testing Methods


    In the fifth stage of the Design Thinking process, which is all about testing
    your ideas with real users, there are several common methods used to gather feedback.
    Here are a few of them, explained in simple terms:


    +   - **Observational Testing** : This method involves watching users as they
    interact with your prototype. You might observe their facial expressions, body
    language, and actions to understand how they are feeling and what'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'they are thinking as they use your product.


    +   - **Interviews** : Interviews allow you to have direct conversations with
    users about their experiences with your prototype. You can ask them questions
    to get more detailed insights into what they liked, what they didn’t like, and
    any problems they encountered.


    +   - **Surveys** : Surveys are a way to gather feedback from a larger group of
    users. You can create a questionnaire with multiple-choice or open-ended questions
    to collect data about users’ experiences and preferences.


    +   - **Usability Testing** : Usability testing focuses on how easy or difficult
    it is for users to accomplish specific tasks with your prototype. You might ask
    users to complete certain actions and observe how they navigate through the product.


    +   - **Prototype Walkthroughs** : In a prototype walkthrough, you guide users
    through your prototype, explaining how it works and what each feature does. This
    method allows you to see how users interact with different parts of the prototype
    and where they might get stuck.


    +   - **A/B Testing** : A/B testing involves creating two versions of your prototype
    with slight variations and testing them with different groups of users. This allows
    you to compare which version performs better and make informed decisions about
    which design elements to keep or change.


    These are just a few examples of user testing methods used in the Design Thinking
    process. Each method offers unique insights into how users interact with your
    prototype, helping you refine and improve your design based on real user feedback.


    # Iterative and Non-Linear Process


    Design Thinking is indeed a non-linear process, meaning that it doesn’t follow
    a strict step-by-step progression from start to finish. Instead, it’s a flexible
    approach that allows for iteration, exploration, and refinement at various stages
    (refer to *Figure 1.3* for a visual representation of this dynamic process).


    **Let us dive into Design Thinking using a simple analogy: baking a cake.**'
