- pgno: 186
  md: '+   - **Attitudinal Research**: Research methods that explore users’ feelings,
    thoughts, and perceptions about a product or service, often involving surveys
    and interviews.

    +   - **Behavioral Research**: Research methods that observe and analyze users’
    actions and interactions with a product, often using tools like heat maps and
    user recordings.

    +   - **Competitor Analysis**: Evaluating the strengths and weaknesses of competitors’
    products to gain insights for improving one’s own product.

    +   - **Lean UX Design**: A design methodology focusing on user feedback, testing,
    and iterative improvement to create user-centered products efficiently.

    +   - **Quantitative Data**: Numerical data that can be measured and analyzed
    statistically, often used to identify patterns and trends in user behavior.

    +   - **Qualitative Data**: Descriptive data that provides insights into users’
    experiences, feelings, and motivations, often gathered through interviews and
    observations.

    +   - **Screening Survey**: A preliminary survey used to filter and select suitable
    participants for a research study based on specific criteria.

    +   - **Stakeholder Interviews**: Conversations with individuals who have a vested
    interest in the research outcomes to gather insights and align project goals.

    +   - **User Research Plan**: A document outlining the objectives, methods, and
    logistics of a user research project, ensuring a structured and efficient approach.

    +   - **UX Research**: The process of understanding user behaviors, needs, and
    motivations through various research methods to inform the design of user-centered
    products.

    +   - **UX Research Methodologies**: Different approaches and techniques used
    in UX research to gather and analyze user data, including both qualitative and
    quantitative methods.

    +   - **Key Performance Indicators (KPIs)**: Metrics used to evaluate the success
    of a product or project in achieving specific business objectives.

    +   - **Moderated Research**: Research conducted with the active involvement'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'of a facilitator or moderator to guide participants and ensure data collection
    aligns with research goals.


    +   - **Unmoderated Research**: Research conducted without a facilitator, allowing
    participants to complete tasks independently, often used for gathering large-scale
    data.

    +   - **Attitudinal Data**: Data that records users’ ideas, viewpoints, and beliefs,
    offering insights into their motivations and attitudes.

    +   - **Behavioral Data**: Data that tracks the actions users take when interacting
    with products, completing tasks, or solving problems, providing insights into
    actual user behavior.

    +   - **Card Sorting**: A UX research technique used to understand how users categorize
    information, helping to design intuitive navigation structures.

    +   - **Hybrid Card Sorting**: A type of card sorting where participants can develop
    new categories in addition to using pre-established ones.

    +   - **Open Card Sorting**: A type of card sorting where participants group topics
    into logical categories and name these groups themselves, revealing unique perspectives
    on information architecture.

    +   - **Focus Groups**: A qualitative research technique where a small group discusses
    their attitudes, views, and experiences, providing rapid and detailed insights
    into user preferences and potential uses for a product.

    +   - **Surveys**: Structured questionnaires to collect both qualitative and quantitative
    data, adaptable to various stages of the product development process.

    +   - **Diary Studies**: A research method where participants consistently document
    their thoughts, feelings, and behaviors over time, providing insights into long-term
    user experiences and behaviors.

    +   - **A/B Testing**: A method to compare two versions of a design to determine
    which performs better in terms of user interaction or achieving specific goals.
    It involves showing different versions to different user groups and analyzing
    their interactions to make data-driven decisions.

    +   - **Eye Tracking**: A qualitative research technique that uses cameras and
    sensors to track and record where users look on a page, producing data'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'in the form of heat maps and saccade pathways to understand user attention
    and navigation.


    +   - **Field Studies** : Research method involving observing users in their natural
    environments to understand genuine behaviors and demands, revealing real-world
    usage scenarios and contextual challenges.

    +   - **Five-Second Testing** : A quick usability testing technique where users
    view a design for five seconds and then answer questions to evaluate their initial
    impressions, helping assess the effectiveness of key messages and visual appeal.

    +   - **Usability Testing** : An essential component of UX research that involves
    testing a website or app with actual users to measure the ease of completing common
    tasks, identifying usability issues and areas for improvement.

    +   - **In-Person Usability Testing** : A usability testing method where a researcher
    observes and records participants completing tasks in a controlled, lab-like environment,
    allowing for direct interaction and observation.

    +   - **Moderated Usability Testing** : A usability testing method where a researcher
    guides the participant through tasks, observes their actions, and asks questions
    in real-time, conducted either in-person or via remote video conferencing.

    +   - **Remote Usability Testing** : A usability testing method where participants
    perform tasks in their normal environment, which can be moderated (with a facilitator)
    or unmoderated (without a facilitator), using software to capture interactions
    and feedback.

    +   - **Tree Testing** : A method to evaluate the findability of website menu
    items by having participants navigate a simplified text version of the site’s
    hierarchy to complete tasks, identifying navigation issues such as unclear labeling
    or dead ends.

    +   - **Heat Maps** : Visual representations used in eye tracking that show areas
    of a webpage where users focus their attention, with colors indicating the duration
    of focus (red for longer times, blue for shorter times).

    +   - **Saccade Pathways** : Visual representations used in eye tracking to show'
