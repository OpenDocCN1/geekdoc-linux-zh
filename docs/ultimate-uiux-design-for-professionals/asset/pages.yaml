    # Importance of Empathy Maps


    In order to better understand users, empathy maps can be utilized both at the
    beginning of the design process and throughout the prototype-validation phase,
    when users are seen utilizing the proposed service.


    Empathy maps has its own benefits, including:


    +   - It lets you pay attention to specific details while watching people

    +   - Information from practical insights that can be obtained is rapidly visualized.

    +   - It can be applied at various stages of the design process, such as the outset
    or prototyping.


    # Creating Empathy Maps


    Now you have a template or you can use a whiteboard to draw these 7 sections.
    It is easy and convenient to add sticky notes for your points. But how do we fill
    in all the sections? What data is relevant to each section?


    Here is a simple approach: When exploring our audience, asking some thought-provoking
    questions really helps.


    When thinking about what people hear, we might ask:


    +   - What do leaders want to tell this person?

    +   - Who is trying to influence this person? (Maybe publications, forums, and
    so on.)

    +   - What messages is this person hearing from said influences?'
  merge: -1
  img_proc: true
- pgno: 236
  md: '+   - What is the biggest priority on this person’s agenda?

    +   - What do they spend most of their time doing?

    +   - What do they WANT to spend their time doing?


    When considering what others see , we might ask:


    +   - How is their world changing?

    +   - What market trends affect this person’s role?

    +   - What do the optics within the company tell them?


    When considering what others say , we may ask:


    +   - What types of things do they tell people?

    +   - What is the essential message they convey to their peers/teams?

    +   - What do they convey as aspirations or optimism?


    When we think about what our audience is thinking and feeling , we aim to understand
    how they make decisions and what their pains or gains might be. We want to know
    their fears and hopes. What concerns them? What makes them feel optimistic? At
    this stage, we review what we’ve noted in other sections of the map. Do any insights
    help us understand their pains or gains better?


    At this point, we might inquire about the following:


    +   - Why do they not sleep at night?

    +   - What are they looking forward to?

    +   - What would be the one thing they could change about their work if they could?

    +   - What would they be doing most of the time in an ideal world?


    By following this structure, empathy maps allow you to gain an understanding of
    your people. They also share this understanding with your team and stakeholders,
    ensuring that everyone understands what users want and need. This allows you to
    focus on the proper things. They encourage open-mindedness and avoid judgement,
    which makes it simpler to develop empathy and make user-centered decisions.'
