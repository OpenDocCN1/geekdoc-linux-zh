- pgno: 252
  md: 'Still, the origins of IA go back even farther. Humans have always arranged
    facts and information logically, ensuring that interactions and communication
    serve a purpose. Messaging gets lost and opportunities get missed when information
    is disorganized. This inherent need for structure was the seed that would grow
    into modern IA.


    Let us go back to the 1960s. “Architecture of the IBM System/360,” a seminal research
    paper published by IBM in 1964, defined “architecture” in computing as the conceptual
    organization and functional behavior of data flows and controls. This was among
    the first official acknowledgements of the necessity of a consistent information
    structure. The Xerox Palo Alto Research Centre scientists laid the conceptual
    groundwork for what is now known as information architecture (IA) just a few years
    later, in 1970, by developing technology to support the “architecture of information.”


    Let us start with architect and graphic designer Richard Saul Wurman, who originally
    used the phrase “Information Architecture” in the 1970s. Wurman observed parallels
    between the architecture of buildings and the requirement for digital space organization.
    His initial discussion of “information design” and the competencies required of
    designers later gave rise to the notion of “information architecture,” which became
    the title of one of his major works.


    IA became crucial with the 1990s internet explosion. The “Polar Bear Book,” or
    “Information Architecture for the World Wide Web,” was published in 1998 by Lou
    Rosenfeld and Peter Morville, who are frequently referred to as the godfathers
    of IA. This seminal work gave IA a framework and defined values and procedures
    that shaped the industry for many years to come.


    Information Architecture (IA) has grown significantly since the mid-1980s. It
    was quite unstructured and open at first, but it has since developed into a field
    with distinct procedures. These days, IA plays a major role in user experience
    (UX) design, organizing everything from mobile app interfaces to website navigation.
    It is constantly changing to stay up with new developments in technology and information
    usage patterns. When you use an app, navigate a digital library, or browse a website,
    IA is at work in the background to make sure you can find what you need quickly
    and effortlessly.


    Placing Information Architecture at the center of design will benefit both the
    modern and future worlds. IA will always remain a part of our lives as long as'
