    # Key Terms


    +   - **User Experience (UX) Design:** The process of creating products that are
    easy and enjoyable for people to use, considering their needs and emotions throughout
    the design process.

    +   - **User Interface (UI) Design:** The visual and interactive aspects of a
    product, focusing on how it looks, how users interact with it, and how it responds
    to their actions.

    +   - **Graphical User Interface (GUI):** A visual way of interacting with computers,
    introduced in the 1970s, featuring elements like windows, icons, menus, and pointers
    (WIMP).

    +   - **Usability:** The ease with which users can interact with a product to
    achieve their goals effectively and efficiently.

    +   - **Accessibility:** The extent to which a product can be used by individuals
    with diverse abilities and characteristics, including those with disabilities.

    +   - **Design Thinking:** A problem-solving approach that prioritizes human needs
    and involves iterative ideation, prototyping, and testing to create innovative
    solutions.

    +   - **Empathy:** The ability to understand and share the feelings and experiences
    of others, crucial for designing solutions that truly meet user needs.

    +   - **Prototype:** A preliminary version of a product or solution used for testing
    and validation purposes, ranging from low-fidelity sketches to interactive digital
    models.

    +   - **User Testing:** A method of gathering feedback from real users to evaluate
    the usability, effectiveness, and satisfaction of a prototype or product.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '+   - **Problem Statement:** A concise description of the challenge or opportunity
    that a design team aims to solve or leverage through the design process, providing
    focus and direction for ideation and solution development.

    +   - **Iterative:** A process characterized by repetition and refinement, where
    ideas, designs, or solutions are continuously improved through cycles of testing
    and feedback.

    +   - **Creative Problem-Solving:** A method of addressing challenges or opportunities
    by generating innovative ideas and exploring unconventional solutions, often associated
    with design to changing circumstances or feedback, a critical skill in non-linear
    processes like design thinking.

    +   - **Digital Transformation:** The integration of digital technologies into
    all aspects of business operations, leading to fundamental changes in how organizations
    operate and deliver value to customers.

    +   - **Agility:** The ability to respond quickly and effectively to changing
    circumstances or opportunities, often associated with iterative and adaptive approaches
    to problem-solving.

    +   - **Virtual Reality (VR) and Augmented Reality (AR):** Technologies that create
    immersive, computer-generated environments (VR) or enhance'
  merge: -1
  img_proc: true
