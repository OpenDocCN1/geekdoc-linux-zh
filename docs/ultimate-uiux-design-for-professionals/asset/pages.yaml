    # Confirmshaming


    Confirmshaming is a strategy that makes users feel bad for saying no in order
    to force them into making a decision.


    When prompted to sign up for a newsletter, for instance, a pop-up window may present
    you with a “Yes” button for signing up and a “No” button that reads, “No, I’d
    rather stay uninformed.” This language gives you the impression that not subscribing
    is a sign of irresponsibility or that you are missing out.


    Another example might be an option to join a loyalty program with the decline
    button labeled “No, I do not want to save money.” This type of wording is used
    by the design to convince users into accepting something by instilling feelings
    of guilt or shame in them for choosing to opt-out.


    # Sneak into Basket


    A sneaky way to add more things to your shopping cart without telling you is called
    “sneak into basket.”


    For instance, the website may automatically add an additional fee for an extended
    warranty or a small donation to a charity, when you select a product to purchase
    online, all without notifying you. We have added these extra goods to your cart
    in the hopes that you won’t notice them while checking out. By subtly including
    these extras, it is hoped that sales or donations will increase and that customers
    will be more willing to pay for items they had not planned to purchase.


