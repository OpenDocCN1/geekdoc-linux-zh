    # **Sketches**


    A sketch or other low-fidelity prototype is a simple and preliminary depiction
    of a product design. Usually hand-drawn, it emphasizes the general idea and structure
    rather than specific design details. Consider it as a rough draft that facilitates
    fast and affordable concept visualization.


    Consider the scenario where you are creating a new website. You may include an
    outline for the bottom, main text area, header, and navigation menu. These quick
    sketches save a lot of time on details while effectively communicating your ideas
    to stakeholders and team members. They are ready to offer suggestions for improvement
    and criticism.


    Sketches and other low-fidelity prototypes are useful because they facilitate
    quick iterations. Before going on to more involved and time-consuming stages,
    you can quickly revise and improve your ideas in response to feedback.


    # **Paper prototypes**


    Low-fidelity paper prototypes are simple, early versions of product designs created
    with basic materials like paper and pens. Despite the high-tech world of digital
    UX design, pen and paper remain a preferred option for quick, low-fidelity prototyping.
    This method is the simplest and fastest, involving hand-drawn “screens” on paper
    or a whiteboard to represent digital products. Paper prototyping involves sketching
    out concepts and user flows to visualize the design.'
