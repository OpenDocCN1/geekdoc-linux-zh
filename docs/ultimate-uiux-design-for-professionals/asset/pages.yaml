  md: '7. **What do they think and feel?** This section mostly covers what feelings
    could the user experience? And what do they think? What are their beliefs? What
    are they worried or happy about?


    In order to make a clear separation between observable and inferred phenomena,
    “thoughts” and “feelings” were combined into the core portion of Empathy Maps
    after they were updated from four to seven sections. Add a list of “gains” and
