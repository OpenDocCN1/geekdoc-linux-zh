- pgno: 376
  md: 'The term “Privacy Zuckering,” coined in honor of Mark Zuckerberg, refers to
    the tactic of misleading users into sharing more personal information than they
    planned.


    For example, the default settings on some social networking platforms may make
    your posts and profile publicly visible to everyone when you first create an account.
    Users often have to dig through complex menus or hidden privacy settings to adjust
    their visibility preferences. This design makes it easy for users to inadvertently
    expose their personal data by default, while obscuring the process of changing
    these settings. Users consequently disclose more information than they had planned
    to because the system is configured to give priority to visibility and wide access
    over personal privacy.


    # Misdirection


    By directing users’ attention to less significant aspects, misdirection involves
    diverting their attention from critical information.


    An e-commerce site might, for instance, prominently display a bright, eye-catching
    button that reads, “Claim Your Discount Now!” while the option to decline the
    offer is hidden away in small, muted writing and is labeled, “No, thanks.” By
    directing users’ attention to the more appealing option, this tactic increases
    the likelihood that they will click on it without giving other options a careful
    thought. By highlighting the enticing offer and downplaying the alternative, the
    design manipulates user behavior and increases the chances of converting them
    to take the desired action.


    Dark patterns often result in irritation, regret, or financial loss by taking
    advantage of psychological concepts and users’ innate behaviors. Although these
    patterns may help a corporation attain short-term objectives like boosting sales
    or subscriptions, over time they can harm a brand’s reputation and consumer confidence.


