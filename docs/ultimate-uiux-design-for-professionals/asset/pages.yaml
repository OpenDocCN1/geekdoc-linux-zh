  md: 'feel of a new website design without being distracted by interactive elements.


    # Interactive Mockups


    Some functionality is included in interactive mockups, enabling users to press
    buttons, switch between displays, and observe simple transitions. These provide
    a more accurate representation of the real user experience than static mockups,
    providing a clearer idea of how the finished product will operate.


    # Use Case


    Interactive mockups are useful for collecting in-depth client input and usability
    testing. An interactive mockup, for instance, lets users test out the fundamental
    navigation and transitions of an app before it is fully developed, which can help
    find any usability problems.


    # Low-Fidelity Mockups


    Low-fidelity mockups are straightforward, rough drawings of a concept that prioritize
    hierarchy and structure above finely detailed imagery. Frequently, they employ
    simple shapes, placeholder text, and muted colors to illustrate the overall arrangement
    of components on the screen.


