    # Downsides of Focus Groups


    Though they have advantages, focus groups can have disadvantages. More peaceful
    voices may be overshadowed by strong-willed people, which can distort debates
    and produce biased conclusions. People may feel under pressure from the group
    dynamic to voice their true ideas rather than to comply to common opinions. Additionally,
    setting up focus groups can be expensive and time-consuming. The moderator’s presence
    may unintentionally affect replies, and the controlled environment could not exactly
    reflect real-world behaviors. Finally, because focus groups are qualitative in
    nature, results may not be statistically represented, which would restrict how
    broadly applicable they can be.


