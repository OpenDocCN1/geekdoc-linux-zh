  md: 'complex and include pictures, badges, and more statistics. By offering consumers
    a target to shoot at and a competitive advantage, they increase the excitement
    of the encounter.


    Leaderboards are essentially similar to a trophy case where you can see who is
    winning and become motivated to move up the ladder.


    # Infinite Scroll: Keep Scrolling


    As you read a book, picture yourself not needing to turn pages; instead, the story
    is revealed to you as you go. The same concept applies to websites with infinite
    scroll: additional content loads automatically as you scroll down, saving you
    from having to click to view more.


    For instance, new postings on social media feeds show automatically as you get
    to the bottom of your existing posts, allowing you to browse uninterrupted. This
    improves the ease and interest of browsing.


    # Modal Windows: Focused Pop-Ups


    Modal windows might be compared to attention-grabbing pop-ups or surprise gift
    boxes that must be opened in order to proceed with other tasks. These are tiny
    windows that focus on a particular job or message and display on top of the main
    screen.


    For instance, when you click “Sign Up” on a website, a modal window may appear
    requesting your information so you may complete the sign-up process without ever
    leaving the page you are on. It reduces distractions and helps maintain task focus.


    # Card Layouts: Organized Blocks


    Think of using sticky notes to arrange your notes on a bulletin board. Every note
    is comparable to a short informational block. Similar blocks are used in Card
    layouts to convey content in a tidy and orderly manner.


    For example, an online store might use cards to show different products, each
    with a picture, a price, and a short description. This makes it easy to browse
    through items and find what you are looking for quickly.'
