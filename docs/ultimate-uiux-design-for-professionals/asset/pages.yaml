    When using the F-pattern in real life, users typically start by reading the top
    horizontal line, which frequently contains headlines or important information.
    They scan another horizontal line that is a little bit below the top as they proceed
    down the page; this line may contain subheadings or crucial information. Lastly,
    visitors usually search for further information or navigation choices by scanning
    vertically down the left side of the article.


    The F-pattern could be used, for instance, in the following way on a news'
