    # Introduction to Prototypes


    Designers kick off new products with prototypes, which are essential for testing
    and refining ideas. A prototype is an early version of a product that shows how
    it will look and work. Think of prototypes as early drafts or mock-ups of your
    product. If you are creating a new device or app, you start with a simple version
    that shows how it will function and look, instead of jumping straight to the final
    product. This could be as simple as a sketch or as complex as an interactive digital
    model.


    A prototype helps you see how the design will work and how users will experience
    it. It lets you test features, find out what works, and fix what doesn’t before
    the final version is made. By displaying these prototypes to people and receiving
    their feedback, you may improve your understanding of their requirements and preferences.
    In this manner, you can guarantee that the finished product is efficient and easy
    to use.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '![](img/5fa48c4cd6454bfb24b9d1359df45cda_310_0.png)


    Figure 6.8: Linking Mobile App Screens for a Smooth Prototype Experience; Designed
    by Freepik


    The Design Thinking approach relies heavily on prototyping, particularly in the
    last stages of testing. You develop a nearly functioning model, or prototype,
    and test it with important stakeholders and potential consumers to see if it satisfies
    their needs.


    Prototypes are necessary because they identify issues early and save costs and
    time. They also ensure that everyone is aware of the project and enhance communication
    both among team members and with stakeholders. Prototypes, in brief, are an essential
    tool that helps turn concepts into tested realities during the design process.


    Simple storyboards and sketches, straightforward paper models, and even role-playing
    situations that simulate services can all be considered prototypes. Despite their
    varying forms, all prototypes shared four main qualities:'
  merge: -1
  img_proc: true
- pgno: 311
  md: '+   - **Representation:** This refers to the form your prototype takes, such
    as on paper, a mobile device, or a computer screen.

    +   - **Precision:** This indicates the level of detail in your prototype, ranging
    from rough and simple (low fidelity) to very detailed and polished (high fidelity).

