    # The History of IA


    The story of Information Architecture (IA) begins in the 1970s, long before the
    internet became a household staple. Librarians and archivists, who were experts
    in arranging enormous volumes of material in libraries and archives, ruled the
    day. Their efforts established the foundation for what is today known as IA.'
