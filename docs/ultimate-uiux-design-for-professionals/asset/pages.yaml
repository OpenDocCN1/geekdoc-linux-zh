  img_proc: true
- pgno: 53
  md: 'Imagine you are baking a cake for a friend’s birthday. Now, Design Thinking
    is like baking that cake in a really fun and creative way!


    +   1. **Understanding Your Friend’s Taste** : Before you even start baking, you
    want to know what flavors your friend likes. Maybe they love chocolate or prefer
    something fruity. So, you chat with them to get a sense of what they’d enjoy.

    +   2. **Planning Your Cake** : Armed with this information, you start planning
    your cake. You think about the layers, the frosting, and any decorations. But
    here is where it gets interesting: instead of sticking to one plan, you jot down
    a few ideas. Maybe a layered chocolate cake or a fruity sponge cake.

    +   3. **Mixing and Tasting:** Now, it’s time to mix up the batter. As you are
    mixing, you taste it along the way. Maybe you realize it needs a bit more sweetness
    or a pinch of salt to balance the flavors. So, you adjust as you go, just like
    Design Thinking allows you to tweak and refine your ideas.

    +   4. **Decorating and Testing:** Once your cake is baked and cooled, it is time
    to decorate. You try out different frosting designs and maybe add some sprinkles
    or fruit on top. Then, you ask your friend to taste it. They might love it as
    it is, or they might suggest a change, like adding more frosting or less sugar.

    +   5. **Final Touches and Presentation:** Based on their feedback, you make some
    final touches. Maybe you add a birthday candle on top or write a sweet message
    in frosting. Then, you present the cake to your friend, who’s thrilled with how
    delicious and beautiful it looks.


    See, Design Thinking is like baking that cake. It’s not a rigid step-by-step process
    where you follow a recipe from start to finish. Instead, it’s flexible and creative,
    allowing you to experiment, iterate, and make adjustments along the way until
    you come up with something truly special and tailored to your friend’s tastes.


