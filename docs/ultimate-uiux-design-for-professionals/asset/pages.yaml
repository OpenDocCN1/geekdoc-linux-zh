- pgno: 32
  md: '# C HAPTER 1


    # The Design Thinking Process


    # Introduction


    Welcome to the world of User Experience (UX) and User Interface (UI) design! This
    chapter will take you on a journey through the history of UX and UI, helping you
    understand how design has evolved over the years. We will dive into what UX and
    UI really mean and why they are crucial for creating products that people love
    to use. We will explore the fascinating Design Thinking process — a powerful method
    that helps designers create innovative solutions. You will learn about its importance
    and how it can transform the way you approach problems.


    Next, we will look at how big brands have used Design Thinking to achieve success.
    These real-world examples will show you the impact of thoughtful design and inspire
    you to apply these principles in your own work. To make things hands-on, we will
    discuss workshops and how they can help you practice Design Thinking in a collaborative
    environment.


    At the end of chapter, we will provide a quick guide to essential Design Thinking
    tools. These tools will equip you with practical techniques to enhance your design
    projects.


    # Structure


    In this chapter, we will discuss the following topics:


    +   - History of UI and UX

    +   - Understanding UX and UI Design

    +   - The Design Thinking Process

    +   - Significance of Design Thinking

    +   - The Five Stages of the Design Thinking Process

    +     - Empathize'
  merge: -1
  img_proc: true
- pgno: 33
  md: '+   - Define

    +   - Ideate/Design

    +   - Prototype

    +   - Test


    +   - Iterative and Non-linear Process

    +   - Big Brands’ Design Thinking Success Stories

    +   - Workshop

    +   - Future of Design Thinking

    +   - Design Thinking Tools: A Quick Guide

    +   - Cost-Free Design Thinking Resources


    # History of UI and UX


    **User Experience (UX)** and **User Interface (UI)** design have traveled an interesting
    journey, shaping how we use technology over many years. When computers were first
    introduced, interacting with them was somewhat difficult. To make them function,
    a great deal of technical knowledge was required. However, in the 1970s, Graphical
    User Interfaces (GUIs) were introduced. These greatly simplified matters. They
    made computers easier to use by introducing features like windows, icons, menus,
    and pointers (WIMP).


    GUIs spread in popularity along with computers over time. When the internet began
    to gain popularity in the 1990s, designers had to consider how to create user-friendly
    websites. Websites used to be rather simple, largely consisting of text. However,
    they quickly improved, adding more images and ways for users to engage with them.


    Then, in the 2000s, smartphones came. All of a sudden, people were touching little
    displays to make things happen. This meant that designers had to consider how
    to make things finger-friendly and function well on small screens. The 2007 release
    of Apple’s iPhone, with its user-friendly touchscreen and plethora of entertaining
    apps, completely transformed the entire experience.


    Apps and social media gained popularity in the latter part of the 2000s.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Designers began experimenting with appearances. While some aimed for a simple,
    clean style, others made things look like actual items. Both looks survived and
    changed throughout time.


    These days, the main focus of UX and UI design is making things visually appealing
    and simple to use. Designers ensure that websites and apps function properly for
    all users by considering their needs and wants. Additionally, designers are constantly
    coming up with new methods to make things entertaining and simple for us to use
    as new technologies like voice interfaces and augmented reality (AR) emerge.


    # Understanding UX and UI Design


    User Experience Design (UX Design) is all about making products that people find
    easy and fun to use and making sure their feelings are considered while doing
    it. It is not just about making the software easy to use; it is also about creating
    good experiences with other parts of the product, like how it is advertised, how
    it is packaged, and how help is given after you buy it. The most important thing
    is solving problems and meeting needs because nobody wants to use something that
    does not help them in some way.


    In simple words, UX design involves far more than just creating content for screens.


    User Interface Design (UI design) is what you see and interact with when you use
    an app or website. It is all about how things look, how you can use them, and
    how they respond when you do.


    If you are looking to rent a place, consider using an app on your phone. The information
    you enter, the buttons you press, and the content displayed on the screen are
    all components of the user interface.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# KNOWING THE DIFFERENCE BETWEEN

    UX & UI


    ![](img/5fa48c4cd6454bfb24b9d1359df45cda_35_0.png)


    Figure 1.1: Difference between UX and UI


    # Understanding the Difference Between UX and UI


    UX and UI design are often mixed up, but they have different roles. UI design
    makes things look good and work well, while UX design looks at how people use
    things.


    So, what’s the difference?


    UX design involves understanding how we use something, while UI design is about
    making it visually appealing and functional.


    In simple terms, UX makes sure a product is helpful, while UI makes sure it is
    easy to use. UX professionals detect problems and provide answers, as well as
    create blueprints and models of how users will use the product. The final appearance
    and feel of the product are subsequently created by UI designers using those blueprints.
    UI concentrates on small elements while UX considers the big picture.


    But sometimes it is difficult to tell them apart. Work in UI design may be done
    by a UX designer, and vice versa. In the end, UI and UX are mutually dependent.
    The quality of the products would not be as good without their collaboration!'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'While UI and UX designers share some duties, they are not interchangeable.
    Their skills complement each other, collaborating to create products. UI designers
    focus on appearance and functionality, while UX designers study user interaction.
    Together, they contribute to the overall success of a product by integrating their
    expertise. The main duties of each position are as follows:


    # The duties of a UX designer


    +   - Enhance user satisfaction

    +   - Improve usability, accessibility, and pleasure in interaction

    +   - Understand users’ needs and behaviors


    # The duties of a UI designer


    +   - Focus on the visual aspect of the product

    +   - Ensure it is visually appealing

    +   - Ensure it is intuitive to use


    Now that you know about UI and UX and what designers do, let us see how they fit
    into the design thinking process. We will look at how they work together to create
    things like websites or apps, from the first idea to the finished product. By
    understanding their teamwork, problem-solving, and how they keep trying different
    things until it works, you will see how UI and UX ensure the final product is
    easy to use and helpful for people.


    # The Design Thinking Process


    All the product designers, service designers, entrepreneurs, educators, healthcare
    professionals, social innovators, and business leaders use design thinking process
    to solve problems in a creative, human-centered, and collaborative way. Design
    thinking is a way to solve problems that puts people first and involves trying
    out ideas over and over again. It is about understanding what people need, coming
    up with lots of ideas, and testing them to see what works best.


    # Here is How it Works


    First, we really listen to people to understand what they are going through and'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'what they need. This helps us figure out exactly what the problem is. Once
    we know the problem, we brainstorm lots of different ideas, even if they seem
    a little crazy. We don’t judge any idea at this stage.


    Next, we make simple versions of our ideas called prototypes. These prototypes
    help us see what might work and what might not.


    We show our prototypes to the people we are trying to help and ask them what they
    think. Their feedback helps us improve our ideas.


    Then, we use the feedback to make our ideas even better. This might mean changing
    things or trying out new ideas altogether. Finally, we turn our best idea into
    something real that people can use.


    Throughout this process, we stay curious, try new things, and understand that
    it is okay if some ideas do not work out. We see problems as chances to come up
    with new and better ideas.


    ![](img/5fa48c4cd6454bfb24b9d1359df45cda_37_0.png)


    *Figure 1.2: Image showing how Design Thinking work*'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Okay, let us imagine something easy to grasp this concept:


    Picture your favorite coffee place or busy café in your town where there is always
    a line. Now your task is to improve the experience of people waiting in line at
    a busy coffee shop.


    Here is how you can use design thinking to do it:


    Begin by observing customers as they wait in line. Talk to them to understand
    their feelings, frustrations, and needs while waiting. Maybe they feel bored,
    impatient, stressed, or confused because there are too many options to choose
    from.


    Once you have everything you need, brainstorm ideas to make their waiting time
    enjoyable and effective. May be try an option to offer them a digital puzzle on
    screen or providing information about coffee ingredients to educate and engage
    customers.


    Next, start the main task by creating a simple prototype of these ideas. You may
    use a tablet with puzzle games or stick some informative and creative posters
    about coffee on walls or pillars. Now test it on customers. Just observe how customers
    react. Collect feedback from them about what they like and what could be improved.


    After completing the main task, improve your ideas based on the feedback. Perhaps
    customers prefer learning about coffee ingredients and how their favorite flavors
    are made, but find puzzle games too challenging because they need to concentrate.


    Finally, once everything is completed, introduce the improved prototype, making
    the changes customers suggested. Fantastic! You have turned the waiting experience
    at the coffee shop into something more interesting and enjoyable for customers,
    all thanks to design thinking.


    # Importance of Design Thinking


    User testing is a critical part of the design thinking process because it helps
    designers understand how real users interact with their products or solutions.
    Here is why conducting user testing is so important:


    +   - **Validating Assumptions** : User testing allows designers to verify whether
    their assumptions about user needs, preferences, and behaviors'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'are accurate. By observing users interact with prototypes, designers can confirm
    or challenge their initial ideas, ensuring that the final product meets the users’
    actual needs.


    +   - **Identifying Pain Points** : User testing helps uncover any usability issues
    or pain points that users may encounter when using the product. By observing user
    behavior and gathering feedback, designers can identify areas for improvement
    and refine the user experience accordingly.

    +   - **Gaining Insights** : User testing provides valuable insights into how
    users think, feel, and behave when interacting with the product. These insights
    can inform design decisions, helping designers create more intuitive and user-friendly
    solutions.

    +   - **Iterative Improvement** : Through iterative testing and refinement, designers
    can continuously improve the product based on user feedback. By incorporating
    user insights into the design process, designers can create solutions that are
    more effective, efficient, and satisfying for users.

    +   - **Building Empathy** : User testing fosters empathy by putting designers
    in direct contact with users and their experiences. By understanding users’ perspectives,
    challenges and motivations, designers can develop a deeper appreciation for their
    needs and design solutions that truly resonate with them.


    To summarize, design thinking is important because it helps organizations make
    creative solutions that really help people, promote teamwork and creativity, make
    failure less likely, and establish a culture of ongoing learning and development.
    By using design thinking, organizations can drive significant change, add value
    for their consumers, make them happy, and stay ahead in a fast-changing market.


    # The Five Stages of the Design Thinking Process


    **Let us first explore the origins of the design thinking process before delving
    into its five stages.**


    The fields of design and innovation are where the design thinking approach'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'got its start. Although its precise beginnings are unknown, it rose to popularity
    in the twentieth century, thanks in large part to the efforts of Stanford University’s
    D-school and design companies like IDEO. But its ideas are based on a variety
    of disciplines, such as business, psychology, engineering, and architecture. The
    demand for more innovative and human-centered methods of problem-solving, especially
    in complex and uncertain situations, gave rise to design thinking.


    There are many versions of the Design Thinking process, but they all share fundamental
    principles: begin by understanding your users, concentrate on solving their issues,
    and continually refine solutions.


    In this chapter, we guide you through the five most prevalent stages of the Design
    Thinking process, providing actionable steps for implementing your own design
    thinking approach.


    ![](img/5fa48c4cd6454bfb24b9d1359df45cda_40_0.png)


    Figure 1.3: Stages of Design Thinking process


    The five main components of the Design Thinking process are:


    +   1. Empathize'
  merge: -1
  img_proc: true
- pgno: 41
  md: '+   2. Define

    +   3. Ideate

    +   4. Prototype

    +   5. Test


    When discussing the five steps of Design Thinking, it is crucial to understand
    that it is not a straight path. While we describe it in terms of sequential steps,
    it is actually a highly iterative cycle. Throughout each phase, you will uncover
    new insights that might prompt you to revisit earlier stages.


    # 1. Empathize


    Empathy is the first step in the Design Thinking process. Understanding your users
    and their needs is crucial to creating goods and services that people genuinely
    want. This includes learning about their expectations for the product you’re designing
    as well as the difficulties they face in this situation.


    ![](img/5fa48c4cd6454bfb24b9d1359df45cda_41_0.png)'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Figure 1.4: Understanding users


    You will fully immerse yourself in the reality of actual users (or representatives
    of your target audience) throughout the empathize phase. This could entail speaking
    with them in interviews, watching how they use current items, and closely monitoring
    their facial expressions and body language.


    During this phase, designers initiate different research methods, the creation
    of user personas and empathy maps, analyze user journeys, and undertake similar
    tasks. You will learn about all these methods in the following chapters. These
    endeavors focus on pinpointing and illustrating the requirements of broader user
    groups, particularly those sharing common characteristics or challenges.


    The empathize phase, which is the first step in the Design Thinking process, recommends
    you to let go of preconceptions. Through firsthand experience, you may create
    solutions that truly address consumer needs. This is what Design Thinking is all
    about!


    # 2. Define


    In the second step of Design Thinking, you start figuring out the specific problem
    that users are facing. First, you gather all the information you learned about
    users’ needs and challenges in the first step.


    Even if you found many issues in the first step, they are not clearly defined
    until now. Without a clear problem statement, it is hard to focus on finding solutions.
    So, in this step, you focus on making clear statements about the problems based
    on what you learned from users.


    In technical terms, a problem statement is a clear and specific articulation of
    the challenge or opportunity that the design team aims to solve or leverage.


    A problem statement is a concise description of the issue or challenge that needs
    to be addressed through the design process. In technical terms, it is the difference
    between how things are now (the problem) and how we want them to be (the goal)
    in a process.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'you simply describe the most common issues that need solving.


    Following the idea of Design Thinking, the problem statement keeps the user in
    focus. The problem statement should be based on what users need, not just what
    the business wants.


    # For example, consider a problem statement:


    As a business goal :

    Improve online sales by making it easier for users to find and buy products.


    From the user’s perspective :

    How can we make it simpler for customers to find and buy what they want online?


    By the end of this step, you will have a clear problem statement to guide the
    rest of the design process. This statement helps you come up with creative ideas
    and find solutions that truly help users.


    # The question then becomes: how can we accomplish this effectively?


    When you’re working on a project, you might need to explain the issue or what
    you’re thinking about in different ways. So, the problem statement can be in any
    format, but no matter how you say it, the main idea is to help the design team
    figure out a solution that will work.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Who?


    Who has the problem?


    # Developing a problem statement based on user-centric perspective


    # What?


    What is the problem?


    # Where?


    Where is the problem?


    # Why?


    Why important to solve it?


    Figure 1.5: Problem statement template


    Let us continue with the same example of your favorite coffee shop. Picture your
    favorite coffee place or busy cafe in your town where there’s always a line.


    Here are some examples of how you could explain the problem or point of view:


    # User’s Perspective Problem Statement:


    Waiting in line at the busy coffee shop is often frustrating and time-consuming
    for customers, leading to decreased satisfaction with their overall experience.


    # User Research Perspective Problem Statement:


    Through user research, it’s evident that customers waiting in line at the busy'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'coffee shop express dissatisfaction due to long wait times, lack of clear communication
    about wait times, discomfort in the waiting area, and limited access to information
    about menu items or specials.


    # *Four Ws Problem Statement:*


    +   Who: Customers at the busy coffee shop.

    +   What: Waiting in line.

    +   Where: At the coffee shop.

    +   Why: To enhance the waiting experience and overall satisfaction for customers.


    These statements all tackle the same problem but approach it from slightly different
    angles. The common thread among them is the emphasis on understanding the user,
    their needs, and the underlying reasons behind those needs. How you articulate
    and structure the problem statement ultimately depends on how you want to convey
    the issue and frame it within the context of the user experience.


    # 3. Ideate


    This step involves coming up with a ton of different ideas for tackling the difficulties
    you have identified after getting to know your people well and learning about
    their main concerns. There are no hard and fast rules when it comes to brainstorming
    ideas. The goal is to generate as many creative and outrageous ideas as you can,
    without considering their viability. But don’t forget to remain focused on your
    problem statement.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/5fa48c4cd6454bfb24b9d1359df45cda_46_0.png)


    *Figure 1.6: Brainstorming ideas*


    It is crucial to remember that at this stage, the focus is on generating a large
    number of ideas, prioritizing quantity over quality. It is important not to rush
    into judgment, allowing everyone to feel at ease sharing their ideas. If someone
    questions the viability of an idea, they should be ready to provide a solid explanation
    for their viewpoint. This approach fosters an open and collaborative environment
    where diverse perspectives can contribute to the ideation process.


    During ideation sessions, it is important to set a time slot of 30-40 minutes
    and involve the entire design team. If possible, choose a suitable environment;
    although it may seem insignificant, the location where you conduct your ideation
    session can greatly influence the outcome. Moreover, it’s beneficial to consider
    and involve other stakeholders. Having stakeholders present can'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'help eliminate completely impractical ideas before moving to the prototyping
    stage.


    During this part of the Design Thinking process, your problem statement will be
    like your map, showing you where to go. You will keep working on it until you
    have a few main ideas to move forward with. These ideas will be transformed into
    prototypes, which you’ll try out with real users to see how well they work.


    # Popular Ideation Methods


    Now that you have set up everything for your ideation session, there is one final
    step: deciding which ideation techniques to employ.


    Here are a few popular ideation methods frequently utilized by designers:


    +   - **Brainstorming:** A group activity where participants freely generate ideas
    without criticism, aiming for quantity over quality.

    +   - **Mind Mapping:** A visual technique where ideas are organized hierarchically
    around a central concept, allowing for exploration of connections and associations.
    In other words, drawing a diagram to show how different ideas are connected.

    +   - **SCAMPER:** An acronym that stands for Substitute, Combine, Adapt, Modify,
    Put to another use, Eliminate, and Reverse, which prompts participants to explore
    different ways to innovate existing ideas or products. In simple terms, asking
    questions to think about how you can change or improve something.

    +   - **Worst Possible Idea:** Encourages participants to deliberately generate
    the worst possible solutions to a problem, which can sometimes lead to unexpected
    and innovative ideas.

    +   - **Six Thinking Hats:** Developed by Edward de Bono, this method involves
    assigning different “hats” to participants, each representing a different perspective
    (for example, logical thinking, creativity, emotions) to explore a problem from
    multiple angles.

    +   - **Rapid Prototyping:** Quickly creating rough, low-fidelity prototypes of
    ideas to test and iterate upon, allowing for rapid experimentation and refinement
    to see what works.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'These are just a few examples of ideation methods used in the Design Thinking
    process, each offering its own unique approach to stimulating creativity and generating
    innovative solutions.


    # 4. Prototype


    In the fourth step of the process, your main focus is on deciding what’s most
    important and then creating prototypes. Prototyping means taking some of the best
    ideas you came up with during brainstorming and making them into something real
    that you can touch and see. This is important because it allows design teams to
    show clients and others what the product might be like in a more tangible way,
    which helps gather detailed and useful feedback.


    Imagine you had a really productive brainstorming session in Step 3 and came up
    with many different ways to solve the main problem. But you can’t make prototypes
    for every single idea, so you have to choose which ones are the most important
    to test out.


    To help you decide, you can use a prioritization grid. This involves manually
    evaluating each idea by writing them down on sticky notes and then placing them
    on a grid based on their user value and feasibility. The best ideas will be those
    that are most valuable to users and also easy to put into action. This process
    helps you focus on the ideas that have the highest potential for success.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/5fa48c4cd6454bfb24b9d1359df45cda_49_0.png)


    Figure 1.7: Priority matrix


    Now it is time to decide which ways are most important for solving the problem.
    You will start working on these and create a prototype. Making a prototype is
    a really important step in the Design Thinking process. It’s all about testing
    your ideas with real users, and prototypes help you do this without spending a
    lot of time or money.


    # Prototypes can help you in a few different ways:


    +   - They let you see how users will use and react to your product. Watching
