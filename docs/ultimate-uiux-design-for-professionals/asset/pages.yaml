    # Background


    A user persona’s “Background” section offers a thorough overview of the persona’s
    background and situations. It contains important information like:


    +   - **Personal History:** A summary of educational background and professional
    progress.

    +   - **Current Situation:** Details about their living arrangements, family situation,
    and employment role.

    +   - **Daily Routine:** Regular daily tasks that illustrate when and how they
    might use your product.


    # Goals and Needs


    A user persona’s “Goals and Needs” section focuses on the persona’s objectives
    and the resources they need to reach these objectives. The primary and secondary
    goals in this section help to clearly comprehend the user’s priorities and motivations.


    +   - **Primary Goals:** These are the main objectives driving their interactions
    with your product. For example, Sharan, a project manager, might aim to effectively
    monitor and oversee projects.

    +   - **Secondary Goals:** These are additional objectives that support the primary
    goals. For Sharan, improving teamwork and communication can be secondary goals.

    +   - **Needs:** These are the specific features, functions, or resources required
    to achieve their goals. Sharan may need dashboard customization or a user-friendly
    interface.


    Knowing these objectives and requirements guarantees that the product is made
    to satisfy the user’s wants and provide a worthwhile, user-centered experience.
    Through concentrating on the goals and necessities of users, designers are able
    to order features and produce solutions that successfully tackle actual user issues.'
