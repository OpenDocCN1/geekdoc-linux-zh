  img_proc: true
- pgno: 237
  md: '# Empathy Maps Versus Personas


    Despite their apparent similarity at first appearance, the two are very different
    from one another. Following are few points to consider:


    +   - Personas provide a more comprehensive, in-depth view of user segments, whereas
    Empathy Maps concentrate on the user’s current thoughts and feelings.

    +   - Personas are used to represent different user groups and provide guidance
    for particular design decisions; Empathy Maps are more concerned with understanding
    emotions and viewpoints.

    +   - Personas necessitate more thorough investigation and data collecting, whereas
    Empathy Maps can be created more quickly and with greater flexibility.


    In summary, personas and empathy maps cannot take the place of one another when
    it comes to understanding consumers’ requirements and developing an empathy for
    them.


    # Experience Maps


    An effective technique for visualizing the whole path a normal person takes to
    accomplish a certain objective is experience mapping. While a customer journey
    map is customized for a single company and its clients, experience mapping is
    more broadly focused, attempting to comprehend human behavior in general rather
    than concentrating on any one target market or product. In situations where the
    audience is not well defined, this method is especially helpful.


    Experience mapping, in short, is a process flow chart that shows the actions a
    typical user takes from beginning to end. What is important to note is that this
    user does not belong to any particular category or have a preference for any specific
    good or service. Rather, the map depicts a common path that a multitude of individuals
    could travel in similar situations.


    **Example:**


    Consider the process of booking a vacation. An experience map would show the general
    processes that need to be taken, like looking for destinations,'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'comparing costs, booking flight and hotel reservations, organizing activities,
    and ultimately departing on the trip. This map emphasizes the typical decisions
    and experiences that anyone may have when organizing a vacation rather than focusing
    on a certain airline or travel agency.


    Experience mapping is very useful when attempting to comprehend a process from
    a broad viewpoint. It aids in locating common problems and areas for development
    that work in a variety of settings. This means that it can be used to learn about
    human behavior in a variety of contexts, independent of particular company or
    industrial needs.


    | Phases | Research | Compare | Book | Plan | Travel |

    | Actions | Search online | Read reviews | Make reservations | Create itineraries
    | Pack |

    | Thoughts | Where I can find best deals? | Is this destination safe? | What does
    work best? | What activities are available? | Did I pack everything? |

    | Feelings | Excitement | Concerns | Relief | Anticipating | Excitement |


    Figure 4.9: Experience Map example of booking a vacation


    An experience map, much like a customer journey map, is divided into four essential
    components:


    +   - Phases

    +   - Actions'
  merge: -1
  img_proc: true
- pgno: 239
  md: '+   - Thoughts

    +   - Feelings/Mindset


    However, the key difference is that an experience map is not limited to any specific
    type of user, service, or product. It is a tool for capturing the broad strokes
    of general user behavior, making it extremely useful when there is not a defined
    target audience.


    # Benefits of Experience Mapping


    +   - **Understanding General Human Behavior**

    +     Regardless of any specific service or product, experience mapping helps
    in the identification of common patterns and behaviors that apply to an extensive
    range of users.

    +   - **Baseline Understanding**

    +     It is adaptable for a range of applications since it offers a fundamental
    knowledge of an event that is not bound to any particular setting.


    # Example of an Experience Map


    Imagine you are looking to understand the general process of booking a vacation.
    An experience map would outline the broad phases such as:


    +   - **Phase:** Researching destinations, comparing prices, booking, planning
    activities, and going on the trip.

    +   - **Actions:** Searching online, reading reviews, making reservations, creating
    itineraries, and packing.

    +   - **Thoughts:** “Where can I find the best deals?” “Is this destination safe?”
    “What activities are available?”

    +   - **Feelings and Mindset:** Excitement about potential destinations, stress
    about budgeting, anticipation of the trip.


    An experience map, which captures the typical journey of holiday planning and
    divides the process into four categories, helps in identifying common roadblocks
    and opportunities for improvement. As a result, it is a helpful tool for assessing
    user behavior generally and enhancing user experiences.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Service Blueprints


    There are situations when a single kind of UX map cannot adequately depict every
    interaction customers experience with a service. Different kinds of UX maps can
    be combined to achieve a complete view. A customer journey map, for example, is
    excellent in illustrating the user’s viewpoint but is limited in its ability to
    disclose business-related information. A service blueprint map becomes useful
    in this situation.


    A service blueprint map offers a comprehensive view of a company’s behind-the-scenes
    activities. These diagrams visualize and analyze interactions between customers
    and service providers, along with the internal processes that support these interactions.
    They illustrate how different departments, employees, and processes contribute
    to the overall user experience. This type of map is particularly useful for large
    organizations with complex service offerings.


    ![](img/5fa48c4cd6454bfb24b9d1359df45cda_240_0.png)'
  merge: -1
  img_proc: true
- pgno: 241
  md: '*Figure 4.10: Service blueprint example of Appliance Retailer by nngroup.com*


    # Example:


    A customer journey map outlines how a shopper finds and buys a product online
    or in-store, focusing on their experience. It doesn’t cover internal operations
    like inventory management or customer service handling.


    For these internal processes, a service blueprint map is used. It details how
    orders are processed, inventory is updated, and staff are informed. This dual
    approach helps identify inefficiencies and areas for improvement, ensuring a smoother
    experience for both customers and staff.


    In short, using UX maps like customer journey maps and service blueprint maps
    gives a complete picture of internal processes and user experiences, enabling
    better service delivery improvements.


    # ## Key Components of Service Blueprints


    Service blueprints are essential tools for highlighting the customer experience,
    detailing service processes, and identifying areas for improvement. They provide
    a comprehensive overview of both customer-facing and behind-the-scenes operations
    in service delivery.


    Key components include:


    +   - **Customer Actions:** Steps customers take when using a service, like booking
    a table or placing an order.

    +   - **Frontstage (Visible) Interactions:** Direct interactions between customers
    and staff, such as servers taking orders in a restaurant.

    +   - **Backstage (Invisible) Interactions:** Operations unseen by customers,
    like chefs preparing meals.

    +   - **Support Processes:** Internal procedures necessary for service delivery,
    such as employee scheduling and inventory management.

    +   - **Physical Evidence:** Tangible elements customers interact with, such as
    restaurant layout, menus, and receipts.


    # ## Benefits of Service Blueprints


    Here are some benefits of service blueprints:'
  merge: -1
  img_proc: true
- pgno: 242
  md: '+   - **Comprehensive View:** Offers a complete overview of the entire service
    process, highlighting both internal operations and customer interactions.

    +   - **Improvement Opportunities:** Identifies areas for process enhancement
    to boost service quality and operational efficiency.

    +   - **Staff Training:** Essential for educating employees and ensuring clarity
    on their roles in delivering services effectively.

    +   - **Customer Insights:** Provides valuable information on customer interactions,
    aiding in better understanding and meeting customer needs.


    # Example


    Consider a hotel check-in process as an example of a service blueprint:


    +   1. **Customer Actions:** Arriving at the hotel, providing identification,
    receiving the room key.

    +   2. **Frontstage Interactions:** The receptionist greeting the guest, checking
    the reservation, and handing over the room key.

    +   3. **Backstage Interactions:** The receptionist accessing the reservation
    system, communicating with housekeeping to ensure the room is ready.

    +   4. **Support Processes:** The housekeeping staff prepares the room, and the
    maintenance team ensures the room’s facilities are functioning properly.

    +   5. **Physical Evidence:** The reservation confirmation email, the hotel lobby,
    the room key card, the welcome booklet in the room.


    In conclusion, service blueprints are effective instruments for assessing and
    improving the provision of services. They assist firms in increasing productivity,
    improving client experiences, and making sure all internal processes are in line
    with service objectives by outlining each step and interaction.


