    # The Seven-Step Method


    While creativity has been a problem-solving technique for decades, it was formalized
    as creative problem-solving (CPS) by Sidney Parnes and Alex Osborn. Developed
    by Osborn, the man who popularized brainstorming, and Parnes, the Creative Problem-Solving
    Process (CPSP) has been taught at Buffalo College’s International Centre for Studies
    in Creativity in Buffalo, New York, since 1950s.


    Notwithstanding its origins, CPS has evolved into a variety of approaches, each
    with its own set of techniques and tactics. However, the core of CPS often consists
    of seven simple yet effective processes. These steps are as follows:


    +   1. Identify the problem

    +   2. Research the problem

    +   3. Formulate creative challenges

    +   4. Explore ideas

    +   5. Evaluate the ideas

    +   6. Draw up an action plan

    +   7. Take action


    # 1. Identify the Problem


    Finding the source of an issue is similar to being a detective looking for hints
    to unravel a mystery. It is critical to identify the true nature of the issue
    before attempting to resolve it. Consider yourself attempting to repair your kitchen’s
    leaking tap. You could initially assume that the issue is just that the tap is
    spilling water. However, upon closer inspection, you find that the leak can be
    the result of a number of underlying problems, such as a loose pipe or an old
    washer.'
