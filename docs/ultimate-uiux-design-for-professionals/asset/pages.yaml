    of question types. In essence, surveys are made up of a set of questions that
    fall into one of two categories:


    +   - **Closed-ended Questions:** These questions either offer a list of predetermined
    multiple-choice options or conclude with simply answering “yes” or “no.” They
    work well for gathering pertinent'
