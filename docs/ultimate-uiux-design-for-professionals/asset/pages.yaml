- pgno: 6
  md: '# About the Author


    With more than 14 years of experience in creating user-friendly, intuitive digital
    experiences, Sharanpreet Kaur is an accomplished UI/UX designer. She began her
    career with a strong foundation in technology, earning a Bachelor of Science in
    Information Technology (BSc IT) from GNDU University, which she later complemented
    with an MBA and a specialization in User Experience Design from London University.
    This unique blend of technical expertise and strategic understanding has equipped
    her with the skills to navigate and innovate in the complex world of user experience
    design.


    Throughout her career, Sharanpreet has had the chance to work for both product-focused
    and service-based IT firms, gaining a broad range of expertise and insights into
    various design issues and methods. Her diverse portfolio, which includes admin
    panels, Android and iOS apps, websites, and more, demonstrates her versatility
    across different digital platforms. Her expertise, however, lies in UX design,
    where she excels at understanding user behavior and transforming insights into
    streamlined, meaningful experiences.


    Sharanpreet combines logic and empathy in her design approach, focusing on users''
    needs and their interaction with technology. She believes that great design can
    make digital products easy and enjoyable to use. By blending technical skills
    with human-centered design, she aims to create solutions that are both practical
    and visually appealing.


    Beyond her professional life, Sharanpreet is also an artist who brings her love
    for creativity into her work as a UI/UX designer. Passionate about staying updated
    with latest design trends and tools, she constantly pushes herself to learn more.
    Her talent for sketching gives her a unique edge, allowing her to bring ideas
    to life and visualize concepts from the very start. This blend of art and design
    helps her to create solutions that are both visually appealing and user-friendly.


    This book brings together Sharanpreet''s experience and passion to guide designers
    through the challenges of the field, covering basic concepts to'
  merge: -1
  img_proc: true
- pgno: 7
  md: advanced techniques. She hopes her insights will inspire a new generation of
    designers to not only create, but innovate and make a lasting impact in the digital
    world.
  merge: -1
  img_proc: true
