- pgno: 141
  md: '# Table 3.3: Categories of UX research methods


    # Qualitative versus Quantitative


    **Qualitative** approaches delve further into comprehending user demands and behaviors,
    highlighting the reasons behind their actions. Teams can learn why users act in
    certain ways by using this method. Qualitative research provides answers to queries
    such as:


    +   - Why?

    +   - How?

    +   - How can this be fixed?


    Conversely, **quantitative** approaches concentrate on gathering and examining
    numerical data in order to identify trends and patterns. They provide statistical
    insights and conclusions by quantifying user behaviors, preferences, and attitudes.


    Quantitative research provides solutions to queries like:


    +   - How much?

    +   - In what number?

    +   - How frequently?


    Combining these techniques gives teams a thorough understanding of their users,
    resulting in more efficient and user-focused solutions.


    # Behavioral versus Attitudinal


    Instead of focusing on what people say, they would or do **behavioral** research
    to examine what users really do. In order to better understand user behavior,
    this type of research frequently relies on observational techniques like heat
    maps, eye tracking, and usability testing.


    Behavioral research can assist you in addressing inquiries such as:


    +   - What is the user interface for this new feature?

    +   - What is the average time taken by users to finish a workflow?'
  merge: -1
  img_proc: true
- pgno: 142
  md: '+   - What is the greater conversion rate CTA?

    +   - Is the user interface navigable?


    The goal of **attitude** research is to comprehend the attitudes, perceptions,
    and beliefs of users. It explores the ‘why’ of user choices and behavior. It frequently
    entails asking consumers questions about their opinions, preferences, and sentiments
    regarding a good or service through surveys or interviews. It is subjective in
    nature and seeks to convey the feelings and viewpoints of the viewer.


    You can get answers to queries like:


    +   - What do people think of this feature? What is the use of attitude research?

    +   - What do individuals claim to desire?

    +   - What kind of difficulty do people currently have?

    +   - What mental models do they have?


    # Generative versus Evaluative


    The main goal of **generative** research is to produce fresh thoughts, ideas,
    and insights to support the design process. To stimulate creativity and direct
    the creation of user-centered solutions, you can conduct co-design workshops,
    card sorting, and brainstorming sessions with user groups.


    With the use of discovery methods, you can get the answers to queries like:


    +   - Who are our users?

    +   - What issues do they have?

    +   - How do they reason?

    +   - Is this solution truly necessary?

    +   - What should we construct?


    Assessing the usability, efficacy, and general quality of current designs or prototypes
    is the main goal of **evaluative** research. After you have created a prototype
    for your idea, it is time to assess its advantages and disadvantages. Through
    A/B testing, you may compare many iterations of a feature or product design to
    make sure your UX design fulfils customer expectations.'
  merge: -1
  img_proc: true
