- pgno: 168
  md: '# Eye Tracking


    A qualitative research technique called eye tracking tracks a user’s gaze to determine
    and log where they glance on a page. It makes use of cameras and sensors. These
    devices track the location and motion of the eyes. The eyes are exposed to infrared
    light via the device. The pupil and cornea both reflect this light.


    These reflections are recorded using eye tracking sensors. Algorithms then examine
    this information. They determine the person’s point of view. Where a person focuses
    on a screen or in their surroundings is indicated by their point of sight. This
    technology aids in our understanding of how individuals perceive and interpret
    data.


    It produces data in the form of heat maps and saccade pathways.


    +   - **Heat Maps:** Heat maps are graphical tools that display the areas of a
    webpage where users are more attentive. Red areas represent longer times of focus,
    whereas blue regions reflect the duration of viewing. To improve the user experience,
    this helps identify which parts of the site are frequently visited and which are
    ignored, guiding layout and design changes.

    +   - **Saccade pathways:** Saccade pathways visually show how the eyes move between
    points of interest on a webpage. Red circles mark focus areas, and lines trace
    the eye’s journey. This data helps designers understand how users navigate content,
    revealing focus patterns and guiding design changes to improve user experience
    and content layout.


    # Effective Timing to Conduct Eye Tracking


    Since eye tracking is a specialized research instrument, not all projects are
    a good fit for it. Nonetheless, it’s helpful to recognize three essential elements
    when optimizing vital pages, listed as follows:


    +   - **Blind spots:** It provides information about the areas of the website
    that people ignore and can be used to improve the visual hierarchy.

    +   - **Stumbling points:** It indicates confusing spots when people keep reading
    the same passages.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '+   - **Reading patterns:** This helps with readability optimization by showing
    how users interact with various items. Eye tracking, for example, reveals that
    users frequently go back to the top of tables to read the heads again, indicating
    that tables have to be sufficiently tiny for convenient viewing.


    ![](img/5fa48c4cd6454bfb24b9d1359df45cda_169_0.png)


    *Figure 3.11: Eye-tracking test in progress, revealing user focus areas*


    # ## Effective Technique to Conduct Eye Tracking


    The following quick steps are involved in conducting an eye tracking test:


    +   1. **Define objectives:** Determine what you hope to discover from the eye
    tracking test (for example, navigational problems and user attentiveness).

    +   2. **Select participants:** To guarantee pertinent outcomes, pick a sample
    that is representative of your intended audience.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '+   3. **Set up equipment:** Make sure the eye tracking software and hardware
    are accurately configured.

    +   4. **Build the test:** Assign activities that replicate common user interactions
    with your product or page to participants.

    +   5. **Perform the test:** As participants finish the tasks, the eye tracking
    system collects their gaze patterns and eye movements.

    +   6. **Analyze data:** Examine gaze plots, saccade paths, and heat maps to find
    reading patterns, blind spots, and stumbling locations.

    +   7. **Report findings:** Summarize the insights and recommend changes to improve
    the user experience based on the collected data.


    # Downsides of Eye Tracking


    Though insightful, eye tracking is not without its limitations. To begin with,
    it isn’t always able to tell if users are actually noticing everything they look
    at. It is possible for users to quickly scan a section of the screen without realizing
    its significance. This implies that user awareness of particular features cannot
    be ensured by eye tracking alone.


    Furthermore, eye tracking does not reveal the motivations underlying users’ gaze
    habits. It doesn’t explain why users glance at particular elements, even though
    it displays where and how long they do so. Surveys and other supplemental tools
    are required to comprehend user motives and thinking.


    Not every user finds eye tracking to be beneficial. Accurate tracking can be hampered
    by things like small pupils, contact lenses, glasses, and fast eye movements.
    As such, it could not be appropriate for some people, which restrict its use to
    a variety of user groups.


    # A/B Testing


    Selecting between two design aspects that could impact user interaction or the
    overall experience presents challenges for UX designers frequently. This is where
    A/B testing is useful. This method allows UX designers to test user reactions
    to various design aspects without depending just on theoretical knowledge or intuition.
    The idea behind A/B testing, sometimes referred to as split testing, is rather
    simple: you make two or more versions of something,'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'allow users to interact with them, and track how they are used in real-world
    situations. In order to allow you to compare the performance of A and B, each
    version is shown to a different segment of the intended audience.


    # Here is an example of A/B testing:


    A company that runs an online news platform wants to increase the number of newsletter
    sign-ups. They create two different sign-up forms to test which one attracts more
    subscribers. Version A, the current form, has a simple layout with a single field
    for the user’s email address. Version B, the new form, has a more visually appealing
    design with a headline that highlights the benefits of subscribing and includes
    fields for the user’s name and email address.


    The platform’s visitors are randomly divided into two groups: half see Version
    A and the other half see Version B. The test runs for a month, during which the
    company tracks the number of sign-ups each version generates.


    At the end of the month, the results show that Version B has a 20% higher sign-up
    rate than Version A. The enhanced design and added fields seem to have convinced
    more users of the newsletter’s value. Based on these findings, the company decides
    to adopt Version B as their standard sign-up form, successfully increasing their
    newsletter subscriptions through this A/B testing process.


    # Effective Timing to Conduct A/B Testing


    When you need to make data-driven judgments about modifications to your website,
    app, or marketing efforts, A/B testing works best. It is employed when comparing
    two iterations of an element to ascertain which one works better at reaching a
    particular objective, such as raising user engagement, conversions, or click-through
    rates. This approach is especially useful when the modifications you are thinking
    about have the potential to have a big influence on user behavior or business
    results. To test variants in call-to-action buttons, headlines, page layouts,
    or email subject lines, for instance, A/B testing is perfect. You may reduce risks,
    find the best design or content options, and improve the user experience based
    on actual user interactions by conducting controlled experiments and evaluating
