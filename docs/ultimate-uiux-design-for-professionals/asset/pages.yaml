    # Detailed Overview of Website Features


    Assume you are working with a customer on a website project and they have no idea
    what “pop-up,” “product filtering,” or “Google Maps integration” mean. You begin
    developing the project’s wireframes in order to close this gap. Your visual storytelling
    tool will be these wireframes, which make it evident where each feature will go
    on the page and how it will function.


    ![](img/5fa48c4cd6454bfb24b9d1359df45cda_301_0.png)


