    # ## Low-Fidelity Prototyping


    The purpose of low-fidelity prototypes is to show user flows and the general structure
    of a product through simplified, basic representations. These prototypes usually
    make use of wireframes, which are straightforward diagrams that show how an application
    or website should be laid out and navigated. They support UX research teams in
    comprehending the information architecture of the product and in visualizing how
    information should be presented to users.


    These prototypes are quite helpful when a project is just getting started. Teams
    can rapidly sketch concepts, thanks to their simplicity without becoming caught
    down in specifics. This facilitates the exploration of many ideas and quick iterations
    based on feedback. Low-fidelity prototypes can be produced quickly, easily, and
    affordably, which makes them useful for teams working under pressure or with limited
    resources.


    Low-fidelity prototypes can have some disadvantages, though. Users are unable
    to properly experience how the finished product will work because they lack interactivity.
    Furthermore, they fail to convey the final product’s aesthetic appeal due to its
    simplistic visual style. Stakeholders may find it more difficult to understand
    the final look and feel as a result.


    Low-fidelity prototypes are a crucial tool in the early stages of design because
    of their benefits, even with these drawbacks. They let teams concentrate on the
    essential organization and flow of a product, provide the groundwork for future
    development, and react quickly to user feedback.


