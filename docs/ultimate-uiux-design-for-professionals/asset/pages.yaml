    # Static Mockups


    Detailed, static mockups are static graphic depictions of a user interface. They
    display every visual component—fonts, colors, photos, and arrangement—but they
    omit any functional features like buttons or links.


    # Use Case


    Before developing an interactive prototype or going on to development, static
    mockups are a great way to get feedback on a design’s visual elements. For example,
    a static mockup helps a client concentrate on the appearance and'
