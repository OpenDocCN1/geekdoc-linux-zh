- pgno: 359
  md: 'finish each step when you are signing up for a new service. Alternatively,
    you might notice numbered stages, such as “Step 2 of 5,” which indicates that
    you are almost done.


    It is important to feel in control and to know what comes next, not just to finish
    a procedure. Consider yourself checking out from an internet shopping marathon.
    It feels manageable when you realize there are only two steps left to complete
    your order, which motivates you to complete it.


    There are other methods to apply this pattern: you can use progress bars that
    fill up as you go, checkmarks that show up when each step is finished, or even
