    # User-Centered Design


    The core idea behind User-Centered Design, or UCD, is creating digital goods with
    actual users in mind. It places people at the center of the process rather than
    attempting to infer what they want. To ensure the product fulfils their needs,
    this entails having direct conversations with users at important junctures. Every
    customer interaction with a website is like a tiny, meaningful moment. According
    to UCD, we should carefully examine each of these situations to make sure the
    user has a seamless and pleasurable experience.


    There are four important things to keep in mind with UCD:


    +   - **Visibility:** When users first arrive on your website, can they quickly
    figure out what it’s all about and how to use it?

    +   - **Accessibility:** Is your website easy for users to access? Can they find
    what they’re looking for without any trouble? Important action buttons, navigation
    menus, and search options should be easy to find.

    +   - **Legibility:** Can users read the text on your site easily? It is important
    that the words are clear and easy to understand.

    +   - **Language:** Is the language on your site easy for users to understand?
    It is best to avoid using complicated words or phrases that might confuse them.
    Keep it simple and straightforward.


