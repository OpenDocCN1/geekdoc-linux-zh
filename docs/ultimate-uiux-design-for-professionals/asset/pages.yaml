    # Principle of Choices


    In order to prevent overwhelming consumers, the Principle of Choices places a
    strong emphasis on giving them a concise, manageable list of options. These choices
    have to be appropriate for the particular job at hand. A user may become frustrated
    and indecisive if there are too many options. Instead of providing dozens of filters,
    an e-commerce site might restrict its product filter options to just the most
    important ones, including size, color, and price range. This targeted strategy
    improves the entire purchasing experience by assisting people in finding what
    they need fast and without being overly overwhelmed by options.


    The options should be related to a specific task. As illustrated in the following
