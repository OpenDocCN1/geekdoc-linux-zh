    # User Experience (UX)


    User Experience — how people interact with a product or service. In other words,
    every little tap, click, or swipe as you use an app or a website. But it is not
    just how it looks; it is also about how it feels and how easy it is to use.


    UX Design — the behind-the-scenes magic that makes using something smooth and
    enjoyable. Designers plan everything to the smallest details so that the use of
    a product is as seamless as can be. What is the goal for them? To give users an
    experience that feels natural, efficient, and relevant.


    This sounds awesome, but how does one become a UX designer, and what exactly do
    they do? They do this by utterly effectively understanding the individuals who
    will use their product. They think about what the user requires, desires, and
    becomes irritated with. It’s not only the user; they consider what the company
    desires to achieve as well.'
  merge: -1
  img_proc: true
