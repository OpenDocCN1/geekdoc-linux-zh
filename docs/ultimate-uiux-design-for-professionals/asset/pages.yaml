    # Accessible


    Making something easily usable for everyone, regardless of impairment, is the
    definition of accessibility. Some businesses assume that only a small percentage
    of people have disabilities, thus, they don’t think it’s worth the effort. The
    World Health Organization estimates that 15% of people on the planet suffer from
    a disability. This implies that more than a million people are impacted. Therefore,
    it makes sense to consider accessibility while designing things. When a product
    is accessible, it indicates that anyone can use it without any issues, no matter
    what their constraints are. Not only does accessibility benefit individuals with
    impairments, but it also improves and simplifies life for all users.'
