- pgno: 114
  md: 'enhance performance, increase security, and introduce new features


    Products that are not useful are ones that, for some reason — such as inadequate
    functionality, unclear user interfaces, or frequent errors — are unable to accomplish
    their goals or offer a positive user experience.


    # Example:


    An example of an unusable product could be a virtual assistant that regularly
    misinterprets user instructions and finds it difficult to carry out simple duties.
    Its inadequate recognition and execution make it frustrating and impracticable
    to utilize successfully, even when its intended aim of aid and convenience is
    acknowledged.


    # Findable


    The findability principle necessitates a search system, information structure,
    and user-friendly navigation. A findable product is one that is simple to discover
    online and off. It should be easy for users to locate the product itself or the
    material they are looking for. Users may become frustrated and give up on a product
    due to poor findability.'
