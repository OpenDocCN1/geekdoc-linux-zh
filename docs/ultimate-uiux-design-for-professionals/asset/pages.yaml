    # Key Components of a User Persona


    The process of creating a user persona is compiling and arranging specific data
    about your intended audience. Here is a summary of the fundamental components
    that any user persona ought to have:


    # Personal Information


    +   - **Name**

    +     Instead of using terms such as “apprentice,” “builder,” or “single mom,”
    give your persona a genuine name such as Emily, James, Jessica, or Daniel, which
    helps your staff relate to the persona more easily and discuss them in conversations.
    Avoid using celebrity names to keep focus on the persona’s traits.

    +   - **Profile Photo**

    +     The photo is the heart of every persona. Avoid using generic stock images
    like “woman typing on a laptop” or “man shaking hands” — these don’t evoke any
    real connection. The photo should feel authentic and relatable. Choose a portrait
    that offers insight into the persona’s character, possibly from your research
    trips.

    +   - **Demographics**

    +     Include details such as age, gender, occupation, education, income, and
