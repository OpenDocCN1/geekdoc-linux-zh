    # Forgiving Format: Flexibility in Data Entry


    Imagine yourself completing an internet form, such as providing your phone number
    or date of birth. You may occasionally omit or add dashes to your phone number
    when typing it. Or maybe you write dates in the format “MM/DD/YY” while someone
    else writes “DD/MM/YYYY.” One design pattern that recognizes and celebrates these
    variations is the Forgiving Format.


    With the help of this pattern, you can enter data in different formats without
    the system being picky about it. It resembles a helpful form that assures you,
    it understands what you mean. By accepting a variety of inputs, forgiving formats
    simplify tasks like inputting a credit card number or providing an address for
    a delivery.


    For example, an online store’s checkout form may be able to differentiate between
    your address, “123 Main St.” and “123 Main Street.” It is possible that it will
    accept your phone number even if you type it as “123-456-7890” or “1234567890.”
    This flexibility helps prevent annoying errors that could stop you in your tracks.


    Designers ensure that users can enter information in a way that feels natural
    to them by using a forgiving format, which makes the user experience more seamless
    and pleasurable. It seems as though you are adjusting to the form, not the other
    way around!


    # Steps Left: Guiding You Through the Process


    Have you ever started something online and wondered how much work remains? In
    order to help you understand precisely where you are in a multi-step process and
    how much work remains, the Steps Left pattern is useful.


    This pattern represents your progress, much like a roadmap. For example, you may
    notice a progress bar at the top of the page steadily filling up as you'
