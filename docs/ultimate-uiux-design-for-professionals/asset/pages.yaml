    +   - **Blueprint:** A detailed plan or outline of a design project.

    +   - **Sketches:** Rough, hand-drawn representations of design concepts.

    +   - **User-Focused:** Design approach prioritizing the needs and preferences
    of the end user.

    +   - **Placeholder:** Temporary content or elements indicating where final content
    will go.

    +   - **Visual Hierarchy:** Arrangement of design elements to guide viewer’s attention
    and understanding.

    +   - **Usability Testing:** Process where real users test a product to identify
    issues and provide feedback.

    +   - **Interaction:** The ways users engage with a product, such as clicking,
    tapping, or swiping.

    +   - **Interaction Flow:** Sequence of steps a user takes to complete a task
    within a product.

    +   - **Scalability:** Scalability of a product to handle increased usage or growth
    without losing performance.

    +   - **Prototype:** An early version of a product that provides insight into
    the design structure, user experience, and general concept, allowing for testing
    and improvement of various features.

    +   - **Mock-up:** A prototype or early model of a product used to test and refine
    design concepts.

    +   - **Design Thinking:** A design methodology that relies heavily on prototyping,
    particularly in the later stages of testing, to ensure the final product meets
    user needs.

    +   - **Representation:** The form a prototype takes, such as on paper, a mobile
    device, or a computer screen.

    +   - **Precision:** The level of detail in a prototype, ranging from rough and
    simple (low fidelity) to very detailed and polished (high fidelity).'
