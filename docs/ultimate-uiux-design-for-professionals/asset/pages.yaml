- pgno: 194
  md: '# **Think on these important queries:**


    +   - What is the organization’s mission and direction?

    +   - Which markets and subsets are we focusing on?

    +   - What are the strategic and business goals?

    +   - What knowledge gaps need filling?


    # ## [Scope](#)


    The parameters of the UX mapping procedure are specified in the scope. It describes
    the elements of the user experience that will be present and those that won’t.
    This makes the mapping exercise more doable and focused. The beginning and ending
    points of the trip, the amount of detail needed, and the channels involved must
    all be identified in order to establish the scope. For example, if the objective
    is to enhance the online buying experience, the scope may encompass the entire
    process from website visitation to successful purchase completion, with a concentration
    on desktop interactions and an exclusion of mobile app experiences.


    # ## [Focus](#)


    UX mapping centers on pinpointing the crucial elements of the user journey that
    require attention. It entails identifying particular tasks, interactions, or pain
    spots that are essential to the user’s experience as a whole. Designers may dig
    deeper into the most crucial areas and create tailored solutions by focusing their
    attention. For instance, if customer feedback suggests that there are issues with
    the checkout process, the emphasis should be on outlining and refining the procedures
    for choosing products, providing payment details, and completing the transaction.
    The most important issues are taken care of first thanks to this focused strategy.


    # ## [Structure](#)


    Once you have chosen your perspective and focus, selecting the right structure
    for your experience map is crucial. Two common structures are chronological and
    hierarchical, each effective in different real-world scenarios.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '+   - **Chronological** : This structure highlights each step of the user journey
    in a time-based sequence, from start to finish. It works best when the user experience
    involves a clear progression, such as an an online shopping process from homepage
    to purchase. By visualizing key interactions, emotional highs, and pain points
    at every stage, designers can identify areas for improvement. This method is especially
    useful when tracking time-sensitive or step-by-step processes.

    +   - **Hierarchical** : This structure organizes tasks and interactions by importance
    and dependency levels, breaking down complex processes into manageable parts.
    It is ideal for scenarios where multiple tasks contribute to a larger objective,
    such as categorizing tasks like “View Product Details,” “Browse Categories,” and
    “Checkout” under the main goal of “Purchase Product.” Hierarchical structures
    help clarify task priority and workflow, making them effective for multi-step
    processes where understanding task dependencies is essential for improving the
    user experience.


