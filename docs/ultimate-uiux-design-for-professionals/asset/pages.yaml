    # Key Terms


    +   - **UX Design:** The process of designing digital products or services with
    a focus on enhancing the user experience by ensuring ease of use, efficiency,
    and relevance.

    +   - **Consistency:** A fundamental principle in UX design that involves maintaining
    uniformity in the appearance, behavior, and functionality of elements throughout
    a digital product or service.

    +   - **Continuity:** The seamless flow of user interactions across different
    sections or platforms within a digital product or service, ensuring a consistent
    and uninterrupted user experience.

    +   - **Context:** Consideration of the surrounding circumstances, environment,
    and user preferences to tailor the design of a digital product or service for
    a more personalized and relevant experience.

    +   - **Complementary Design:** The harmonious integration of various design elements
    within a digital product or service to create a cohesive and visually appealing
    experience that enhances user engagement and satisfaction.

    +   - **Creative Problem Solving (CPS):** A structured process for approaching
    problems creatively, involving defining the problem, generating ideas, evaluating
    solutions, and implementing the best ones.

    +   - **Seven-Step Method:** A problem-solving approach that includes seven key
    stages: problem identification, research, formulating creative challenges, exploring
    ideas, evaluating ideas, drawing up an action plan, and taking action.

    +   - **Research the Problem:** The stage of problem-solving involving gathering
    information and analyzing data to gain insights into the problem’s underlying
    causes.

    +   - **Formulate Creative Challenges:** Defining the problem as a question'
  merge: -1
  img_proc: true
