  md: 'You need to ask yourself, or perhaps a friend or family member, a number of
    questions to get to the bottom of the issue and determine its fundamental cause.
    Simple inquiries such as “What seems to be the problem?” or “What am I trying
    to achieve?” are a good place to start. Next, delve further by posing questions
    such as “What’s causing this issue?” or “Why is this happening?” Ask “Why else?”
    or “What else?” repeatedly to investigate many viewpoints and aspects.


    Other things to think about are, “What do I really want to accomplish?” and “What
    obstacles am I facing?” Consider your long-term objectives and how resolving this
    issue will contribute to achieving them. You might also consider the approaches
    and methods that other people, such as your friends or coworkers are employing
