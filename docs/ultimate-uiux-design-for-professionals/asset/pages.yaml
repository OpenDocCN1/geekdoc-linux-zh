    # Empathy Maps


    It is not enough to individualize the design process via empathy mapping. Rather,
    it seeks to reflect a larger group of consumers with similar needs and interests.
    Putting oneself in the position of someone you don’t often interact with can be
    challenging at times. You can learn more about these people’s true thoughts and
    feelings regarding your issue, service, or product by using empathy mapping.


    Consider that you are going to work with a corporation or brand to create an app
    called a “veterinary locator” or “pet clinic finder.” The first step is to determine
    who your target market is. Consider working-class individuals, recent immigrants,
    or recent arrivals to cities of various ages. Imagine 56-year-old Olivia looking
    for local and internet pet services while living alone'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'with her cat, Milli. Your team imagines Olivia’s everyday activities, the technological
    obstacles she encounters to create an app for her. Although Olivia is a persona,
    many others can relate to her needs. Your team can grasp the common wants and
    preferences of Olivia and many other users by putting themselves in her position
    through empathy mapping.


    To create an empathy map, you will need some drawing tools like sticky notes and
    pens, or you can use software with empathy map templates. Choose the persona you
    will be mapping before you start, and make sure everyone in your team is aware
    of it. Choose a persona based on real data from your research and give them a
    name.


    # Structure of Empathy Maps


    The empathy map was originally created by **Dave Gray** (XPLANE’s founder) and
    has gained much popularity within the agile community. The original Empathy Map
    is divided into four quadrants: Thoughts, Feelings, Actions, and Observations.
    Each quadrant captures a different aspect of the customer experience:


    +   - **Thoughts:** What the customer says

    +   - **Feelings:** What the customer thinks

    +   - **Actions:** What the customer does

    +   - **Observations:** What the customer feels


    This structure helps you gain a comprehensive understanding of your customer’s
    experience.


    **The revised version includes seven sections — the user is positioned in the
    middle.**'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Empathy Map Canvas


    ![](img/5fa48c4cd6454bfb24b9d1359df45cda_234_0.png)


