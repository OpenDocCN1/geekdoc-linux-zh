  md: '|  | Mobile-First Design | Responsive Web Design |

    |---|---|---|

    | Design Philosophy | Emphasizes creating for small screens first, then expanding
    it to larger ones. The plan is to gradually improve the design for tablets and
    desktops while giving priority to the features and information that are most important
