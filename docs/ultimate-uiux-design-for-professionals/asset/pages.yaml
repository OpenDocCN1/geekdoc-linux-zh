    # HTML


    Any webpage is structured by HTML, which effectively organizes its content. Semantic
    HTML elements such as <header>, <nav>, <main>, and <footer> are used to designate
    distinct sections in responsive design. These components support flexible layout
    as well as accessibility. Well-structured HTML makes it easier to apply responsive
    CSS, which guarantees that information displays correctly on various devices.'
