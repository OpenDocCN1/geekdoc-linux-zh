    +     It lets users swipe left or right on an item to carry out activities. For
    example, swiping left on an email in the iOS Mail app exposes options to archive
    or delete it, which streamlines user interaction.

    +   - **Pull-to-Refresh**

    +     It is a gesture where users swipe down from the top of a list to refresh
    the content. This pattern is frequently seen in apps like Twitter, where users
    may swipe down to swiftly refresh their feeds and always view the most recent
    developments.


    # Onboarding Patterns


    Step-by-step instructions that expose new users to the functionalities of an app
    are called **walkthroughs and tutorials**. To facilitate learning, they frequently
    incorporate tooltips, animations, and interactive demonstrations. For instance,
    a tutorial helps users become quickly and efficiently acquainted with the Duolingo
    app by guiding them through the fundamentals of choosing a language and beginning
    a lesson when you first launch the program.


