    # X marks the spot


    Most PC users know the X Window system of Unix (1996, a story that we look at
    next). Starting in the 1980s, X serves computers. X was designed for workstation
    display. It is designed to work in any environment — whether local hardware or
    remote servers. X’s development went hand-in-hand with many of the early Unix
    windowing environments. X has had a very long history with Unix, and as such its
    window manager has always been part of the OS. For a long time, there was no X
    server for the Microsoft Operating System (3.01, an early release of DOS), as
    the X project was a part of Unix development.


    As the X server gained more support, the X development team looked at making an
    X server for the PC. This was a daunting task. It was eventually XFree86 that
    made X available to the PC platform in 1996. XFree86 was a fork of X11, which
    was the latest X release in 1994. The fork was done in 1995, and XFree86 was released
    in 1996. It was a huge amount of work to make X available on the PC platform.
    The first version of XFree86 only supported SVGA displays. SVGA was a standard
    for high resolution displays that was created by several manufacturers. SVGA displays
    could be connected to the PC using a VGA cable. SVGA displays were expensive,
    but they offered high resolution displays.


    As the XFree86 project matured, support for more displays was added. SVGA was
    the first display standard supported by XFree86. VGA was the next display standard
    supported. VGA displays are much lower resolution than SVGA displays. As XFree86
    matured, it also supported Xv and Xv-GLX. These were extensions to the X server
    that allowed for hardware accelerated 2D and 3D graphics.


