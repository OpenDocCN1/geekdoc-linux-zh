    the Gimp since 2006. He loves to explore the program’s features and writes about
    it on his blog.


    The BMP comes in two flavours: as a standalone *GUI* program and as a set of functions
    for **Gimp**’s Script-Fu. Both of these flavours can do a lot of the same jobs,
    but the standalone version is far more versatile and powerful. The BMP can be
    found in the Gimp’s repository, but the standalone version needs to be installed
    separately. The standalone version also needs a Java runtime environment installed.
