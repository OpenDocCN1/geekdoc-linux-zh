  md: "# Hack your graphics cards\n\n# In the beginning... \nLinux still talks to\
    \ LCD monitors via a CRT controller interface. \nFind out why and what that meant\
    \ for the Linux graphics stack.\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_32_0.png)\n\
    \n+   - **Linux using KMS** (Kernel Mode-Setting) requires the display driver\
    \ to be loaded in order to change the display mode.\n+   - **Linux using the X\
    \ Server** is a very powerful tool for manipulating the framebuffer.\n+   - The\
    \ Linux kernel provides a way to write raw pixels to the framebuffer.\n+   - The\
    \ Linux kernel provides a way to read raw pixels from the framebuffer.\n\nStarting\
    \ a few X Windows Desktop from scratch in March 2022, I felt like it was an opportunity\
    \ to have a closer look at what it actually takes to start a graphical session\
    \ on a Linux system. I've tried running a few of the big X11 and Wayland compositors\
    \ in sequence and it was an enlightening experience. What I learned surprised\
    \ me: Linux and X11 are not as close as I thought. Even though the X server and\
    \ Wayland compositors are both talking to the GPU, the way they talk is not the\
    \ same. In fact, it is quite different. What I found out was that the X server\
    \ and the Wayland compositor are not even talking to the same interface. In fact,\
    \ they are talking to two different interfaces. And the two interfaces are not\
    \ even in the same direction.\n\nIn the late 1980s, the VESA (Video Electronics\
    \ Standards Association) group defined a set of guidelines for how to do that.\
    \ These guidelines were called VBE (VESA BIOS Extensions). The VESA BIOS standard\
    \ was a way to write to the VGA framebuffer using the CPU and was the de facto\
    \ standard for years. However, the VESA standard was not enough. The CPU was too\
