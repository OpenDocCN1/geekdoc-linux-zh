  md: "# **TUTORIALS OnlyOffice plugins**\n\n**ONLYOFFICE**\n\nIssue 212 / January–February\
    \ 2023\n\n# ## Using WordPress with OnlyOffice\n\nWith OnlyOffice Docs connected\
    \ to WordPress, authors are able to insert documents into online posts. **Kesnija\
    \ Fedoruk** explains how it works.\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_69_0.png)\n\
    \nIf one CMS stands out on my shortlist of the most popular content management\
    \ systems today, WordPress tops my list. It is the world's most popular CMS. It\
    \ accounts for more than 40% of all websites, and it has around 57,000 plugins\
    \ that make it even more useful. It is built on PHP and MySQL. It has all the\
    \ features and capabilities needed to manage and maintain a blog or a simple website,\
    \ and it can even be used to make an online store. In this article I will talk\
    \ about one of the popular WordPress plugins I recommend to my clients: OnlyOffice.\
    \ It allows users to use OnlyOffice Docs with WordPress and insert documents directly\
    \ into their posts.\n\n+   * **ONLYOFFICE DOC**\n+   * **BLOGGERS AND EXPERTS**\n\
    +   * **WORDPRESS PLUGIN**\n+   * **ONLYOFFICE**\n+   * **CMS**\n+   * **ONLINE\
    \ POSTS**\n+   * **INTEGRATION**\n\nFor example, you can use it to create a blog\
    \ post or web page with a rich and unique look. There is also a convenient option\
    \ that allows you to share your work as a PDF by simply copying the document link.\
    \ For those who need to make a document into a public or private site, the plugin\
    \ has its own file storage and allows you to manage and store your files. It can\
    \ be used to share documents with your team, clients, and other users. It also\
    \ has a unique feature that enables you to edit documents online.\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_69_1.png)\n\
    \n![](img/f20a68d91e56325c44e9a1405ca1923f_69_2.png)\n\n### Install the plugin\n\
    \nTo install this plugin, visit the site [wordpress.org/plugins/onlyoffice-document-editor](https://wordpress.org/plugins/onlyoffice-document-editor)\
    \ and click the *Install Now* button. After installation, you will need to activate\
    \ the plugin and go to its settings. You can also download the plugin from GitHub,\
    \ install it manually, or use a one-click installer in cPanel.\n\n# ### Install\
    \ OnlyOffice Docs\n\nAs a next step, you can connect Docs to the site and set\
    \ up the connection, either using your own server or a cloud service such as OnlyOffice\
    \ Private Cloud. To do that, you need to install the OnlyOffice Document Server\
    \ on a server. In order to use OnlyOffice, we need to connect to a server that\
    \ has the Document Server installed. You can use your own server or connect to\
    \ a cloud service. There are two options: using the only-cloud option or installing\
    \ the document server on your own host.\n\n+   **QUICK TIP**\n+   \n+   * **ONLYOFFICE\
    \ DOC**\n+   * **WORDPRESS PLUGIN**\n+   * **ONLYOFFICE**\n+   * **CMS**\n+  \
    \ * **ONLINE POSTS**\n+   * **INTEGRATION**\n\n### Adding files\n\nTo use files\
    \ that are already on a server, go to *Settings > Media*. After you open the Media\
    \ Library, click on the *Upload Files* button. It is possible to add files from\
    \ your own server, from a cloud service, or from a remote URL. The plugin also\
    \ allows you to add files using drag and drop.\n\nI recommend using the cloud\
    \ service if you want to share documents with others. You can share documents\
    \ with others by using the *Share* button. The link will be automatically generated.\
    \ You can also share documents using the *PDF* option. It is possible to use the\
    \ document in the same way as a PDF file.\n\n© 2022 ILYOZINE SOFTWARE OÜ. All\
    \ rights reserved. Published by ILYOZINE SOFTWARE OÜ\n\nonlyoffice.com/plugins\
    \   illyozine.eu   73"
