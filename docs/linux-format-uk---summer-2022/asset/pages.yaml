  md: "# CODING ACADEMY Controlling Tetris\n\n|  | other | |  | self.color |\n|---|---|---|---|---|\n\
    |  | **other** | **color** | **new** | **self.color** |\n|  | red | blue | green\
    \ | red |\n\nThe PyCharm editor is a brilliant tool, and its interface and settings\
    \ give some nice tips to grid-based problems. Another useful feature built in\
    \ to PyCharm, and available in other editors, is debugger.\n\nGrid and Data structures\
    \ Whether looking at matrix data, a 3-D array (three co-ordinates, three numbers),\
    \ a 3-D world or an array of arrays, it’s all about grids in data structures!\
    \ The examples in this magazine focus on 2-D (arrays, lists, nested lists), but\
    \ these same fundamental ideas can be applied to a 3-D array. See examples in\
    \ this issue.\n\nIf you’re using PyCharm, a useful feature to try is the built-in\
    \ debugger. In the menu, choose\n*Debug* > *Debug*. It will ask you to pick a\
    \ configuration – select *Script* and type in the name of the main Python file.\
    \ Then set some breakpoints in the code as usual. To set a breakpoint, place your\
    \ mouse on the line you want to investigate, then click the left button – a dotted\
    \ line will be drawn across the text. The debugger runs until a breakpoint is\
    \ met. You can then use the controls below the code window to step through the\
    \ debugger to work out what’s happening in the code.\n\n# Focus on classes\n\n\
    Now that we can control the individual blocks, it would be nice to create a block\
    \ at a time, as a single object. So we want to have separate objects for a block\
    \ at a time to represent a block. In this example, a tetromino is actually a collection\
    \ of four blocks. But it seems to be more efficient to have blocks as one object\
    \ and then we don’t have to think about the different types of blocks. That is\
    \ the object we’ll focus on.\n\nThe class below has a constructor, init method\
    \ which takes colour and a list of blocks that make up the Tetromino. Each block\
    \ has x, y position (the block is a square with side=1). Each block stores its\
    \ own x and y.\n\n```\n```\nclass Piece:\n  def __init__(self,color,blocks):\n\
    \    self.blocks=[]\n    for b in blocks:\n      x,y=b\n      self.blocks.append([x,y,color])\n\
    ```\n```\n\n+   - 5-Range\n+   - Some other methods that the Piece object can\
    \ have: move, rotate, check collisions\n\nA move method allows the Piece to be\
    \ moved in 2-D. A rotate method allows the Piece to be rotated around a point.\
    \ Collisions are checked by looking at the current block and checking if it will\
    \ collide with the wall or the ground.\n\nIn the constructor (the special method,\
    \ init), a colour, a list of four blocks that make up the object are taken. In\
    \ the constructor, we set self.color to color and self.blocks to the list of four\
    \ x/y values.\n\n+   - 1-Drop\n+   - 2-Account for movement of the piece in 2-D\n\
    \nIn this article, we are not concerned with rotation, but if you want to implement\
    \ this, you will need to look at the four blocks and change the x/y values.\n\n\
    As you can see, we can use a class to create a single piece of data, and then\
    \ use that to make multiple pieces. That gives a more modular and readable structure\
    \ to the code.\n\nIn this issue, we take a look at making a simple Tetris game\
    \ in Python. By the end of this, you will have a working game that you can play.\
    \ There will be plenty of opportunities for you to improve the game – you can\
    \ add music, high scores, different levels, etc. The challenge is up to you!\n\
    \n![](img/f20a68d91e56325c44e9a1405ca1923f_95_0.png)\n\nSo, in this issue, we’ve\
    \ managed to control each element of the Tetris game by using a data structure\
    \ (a 2-D array) and some object oriented programming."
  merge: -1
