    **1 (B1)** is an application that lets you set up a VPN for your own private network
    by connecting to a public VPN server. If you want to connect to the public IP
    address of the LXP VPN, you will need to use your username and password from the
    LXP VPN site (www.lxpsystems.com) in order to get connected. For this reason,
    if you use a public IP address, it will be the same as if you were not using a
    VPN at all. However, you can set up multiple VPNs that have different access levels.
    You can set up a VPN for each of your customers or even for each of your personal
    accounts.


    The system that is capable of responding over the Internet and the public IP address
    of your VPN server is called a **Virtual Private Network (VPN)**. It is the process
    of connecting to a public IP address that is connected to a private IP address
    (such as your home IP address).


    The **Virtual Private Network (VPN)** works by using a public IP address to access
    a private IP address. It allows a user to connect to a network that is normally
    only accessible by the computer that is hosting the network.


    This is very useful for people who travel or who work from different locations.


    ## Installing your VPN


    First, connect to the VPN using a DNS client account for private networks and
    set your DNS servers to your ISP''s DNS servers. You will then be able to install
    your VPN.


    # ## COMMERCIAL VPNs


    Before all of the word with open access to the public VPN, we have to be aware
