  md: "Now you're ready to connect up your sensors and put your project to work. Let's\
    \ go!\n\n# Software setup\n\nWe need to install a number of software packages\
    \ for the ultrasonic sensors on our Pi, so let's get them all in one go. We'll\
    \ use the RPI.GPIO library for controlling GPIO, and the Python interpreter that\
    \ we installed earlier for the main code. As with most projects, we will use the\
    \ Python 3.5+ interpreter with the pip3 utility to install third-party Python\
    \ packages.\n\nSensors in C/C++ - if you're more of a C or C++ coder, there's\
    \ an excellent C++ driver available [1] that supports up to three HC-SR04 sensors.\
    \ This driver also contains an example program that displays the sensor distances\
    \ using ASCII bars, so there's no need to use any of the graphical libraries we'll\
    \ cover later for this project.\n\n# The project code\n\nThe next stage is to\
    \ write some Python code to bring all the components together and control them.\
    \ We'll start with the GPIO setup code, which is the same as we saw in issue 88.\
    \ If you'd like to look at how we've implemented this in more detail, the RPi.GPIO\
    \ reference manual has a full description of all the functions and classes we\
    \ use.\n\n```\nimport RPi.GPIO as GPIO\n\nclass Ultrasonic:\n  def __init__(self,\
    \ trig, echo, debug=False):\n    self.trig = trig\n    self.echo = echo\n    self.debug\
    \ = debug\n    GPIO.setup(self.trig, GPIO.OUT, initial=GPIO.LOW)\n    GPIO.setup(self.echo,\
    \ GPIO.IN, initial=GPIO.LOW)\n```\n\nThe main part of the code deals with the\
    \ two main states we need to deal with: waiting for a result and waiting to send\
    \ the pulse to the sensor. The waiting state uses the `time.time()` function to\
    \ get the current time in seconds and stores this in the `self.t0` variable. When\
    \ the pulse is sent, the `self.t1` variable is set to the current time. The difference\
    \ between these two values is the time it took for the pulse to travel to the\
    \ object and back. As we know, we can calculate the distance by dividing the total\
    \ time by the speed of sound (343m/s).\n\n```\ndef wait_for_result(self):\n  start\
    \ = time.time()\n  self.t0 = time.time()\n  while GPIO.input(self.echo) == False:\n\
    \    self.t0 = time.time()\n    if (time.time() - self.t0) > 0.03:\n      print('ERROR\
    \ - no echo detected')\n      return None\n  self.t1 = time.time()\n  return self.t1\
    \ - self.t0\n```\n\nFinally, we have the main loop of the program, which continuously\
    \ reads the distance from the sensor and displays it on the LEDs. The LED display\
    \ consists of 10 LEDs, where each LED represents a range of 10cm (so a full range\
    \ of 100cm). The LEDs are controlled by turning them on and off depending on the\
    \ distance returned by the sensor. We've set up a loop that waits 0.2s between\
    \ each reading, to give us a nice smooth update rate on the LEDs. If you want\
    \ to display the distance to the object, you can add the following line inside\
    \ the `while True:` loop.\n\n```\nprint 'Distance:', distance, 'cm'\n```\n\n#\
    \ Sensory setup and display\n\nIf you want to display the distance to the object,\
    \ you can add the following line inside the `while True:` loop.\n\n# SENSORS WORKING\
    \ OVERVIEW\n\nBefore we look at a few different types of sensors, let's think\
    \ for a moment about what we actually mean by 'sensor'. The word 'sensor' comes\
    \ from the Latin *sensus*, which means 'perception' or 'experience'. So basically,\
    \ a sensor is any device that can be used to detect or measure changes in some\
    \ physical property of the surrounding environment, such as temperature, pressure,\
    \ light, humidity, or distance.\n\nAs a basic rule, sensors are designed to detect\
    \ a change in a physical property of the surrounding environment and convert this\
    \ into a change in some measurable electrical quantity. Sensors are usually passive\
    \ devices (they don't generate their own power) and are often quite simple in\
    \ construction. The simplest sensor might just be a wire that gets heated up when\
    \ an object passes over it, for example. A more complex sensor might be a combination\
    \ of several different components working together.\n\nFor example, an infra-red\
    \ motion sensor (PIR) usually consists of a pyro-electric sensor, which detects\
    \ changes in infra-red radiation, and an amplifier circuit that converts the sensor's\
    \ output into a digital signal that can be used to trigger an alarm or switch\
    \ on a light. Pyro-electric sensors are based on the fact that many crystals generate\
    \ an electrical charge when their temperature changes. These crystals are known\
    \ as pyro-electric materials, and a common example is lithium tantalate. When\
    \ a source of infra-red radiation (like a person or warm object) moves across\
    \ the field of view of the pyro-electric sensor, it causes a change in temperature,\
    \ which in turn generates a small electrical charge in the sensor. This charge\
    \ is then amplified and used to trigger the circuit's output.\n\n| Property |\
    \ Value |\n| :--- | :--- |\n| Max range | 5m |\n| FOV | 90° |\n| Response time\
    \ | 150ms |\n| Frequency | 40kHz |\n| Sensor | HC-SR04 |\n\n# SENSORS WORKING\
    \ OVERVIEW\n\nWe have many sensor built in, and this includes a distance sensor\
    \ as well. As we know, our sensors are designed to detect changes in temperature,\
    \ pressure, humidity, and distance. So the distance sensor works by measuring\
    \ the time it takes for an ultrasonic pulse to travel to an object and back. This\
    \ time is then used to calculate the distance to the object. The formula is:\n\
    \n*Distance = (Speed of Sound × Time) / 2*\n\nwhere the speed of sound is 343m/s\
    \ in air at 20°C. The reason we divide by 2 is because the pulse travels to the\
    \ object and back, so the total time includes the time for the pulse to travel\
    \ both ways.\n\nAs mentioned earlier, we have included a table of some common\
    \ ultrasonic sensors and their properties. This should help you choose the right\
    \ sensor for your project. For example, the HC-SR04 is a popular, inexpensive,\
    \ and easy-to-use sensor that has a range of up to 4m. It's a good choice for\
    \ basic projects, but if you need more range or higher accuracy, you might want\
    \ to look at a more advanced sensor."
