  md: '# ## NEWSDESK


    # ### OPINION


    #### CRITICAL THINKING


    Katie Gompels


    For the first five months this year, I didn’t read a single news article. It was
    my decision to break away from my daily news consumption and learn to think for
    myself.


    ### We lack all of the context in our daily lives


    I know many people who are highly involved in their fields of study and/or work
    but haven’t ever heard of the ‘S’ in STEM. Equally, I know a lot of people in
    the social sciences who can’t tell a transistor from a diode or have no idea what,
    say, a ‘quantum computer’ is. This is a shame because the more we know, the more
    we can contribute and the better we can make informed decisions in our lives.


    We lack critical-thinking skills too, and that saddles us with the danger of our
    own biases. For example, if your views on the environment are not backed up by
    hard data, that could lead to bad policy decisions. Likewise, if you are not aware
    of the implications of some particular medical decision, that could also lead
    to a poor outcome.


    We lack empathy too. It’s a pity that we can’t feel the plight of those in other
    parts of the world. How can we help if we don’t understand their needs? Empathy
    is a key ingredient in critical thinking. We need to learn how to see the world
    from others’ perspectives.


