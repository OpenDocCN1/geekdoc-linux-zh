  md: '# **Into a third dimension**


    We add some depth to the story and learn about the first, bona fide, GPU.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_33_0.png)


    The first ‘computer GPU’, appearing in 1975, was aimed at vector ‘graphics’ in
    large mainframes like the CDC 6600. It could do a lot of work in parallel but
    it had no display capability.


    The first ‘graphics card’ was in 1984 (above), a replacement part of the Apple
    Lisa. It used to accelerate the CPU''s screen output to connect the card’s VGA
    or DVI output to a monitor or TV. This had no impact on the CPU, so no speed-ups
    were expected.


    Now look at the GPU (top right). It has an embedded video processor, a RAMDAC,
    and its own video memory. This is a ‘full’ graphics card, but it’s not a modern
    GPU. In fact, it’s not even a GPU in the sense of a ‘GPU chip’ (see below), which
    can offload processing from the CPU.


    A GPU is a ‘processing unit’, not a ‘display unit’.


    It is a parallel processor, able to do many operations at once. This makes it
    very useful for certain types of computations, like image processing and machine
    learning, but not so well suited for sequential tasks like word processing.


    A GPU’s strength lies in its ability to process large amounts of data in parallel.
    This makes it well-suited for tasks that can be broken down into many smaller,
    independent operations.


    A GPU’s weakness is that it is not well-suited for tasks that require complex,
    sequential logic. This is because the GPU is designed to do many things at once,
    not one thing at a time.


    A GPU’s other weakness is that it is not as good at controlling the flow of data
    as a CPU is. This is because the GPU is designed to process large amounts of data
    in parallel, not to control the flow of data.


    In the end, a GPU is a great tool for certain types of computations, but not so
    well suited for others. It is up to the programmer to decide which tool to use
    for which task.


