    # Did You Know...O''Kelly''s Files


    In 1996, the National Academy of Sciences reported that nearly one in ten U.S.
    workers suffer from a repetitive strain injury, such as carpal tunnel syndrome,
    from repetitive computer work. The National Institute of Occupational Safety and
    Health (NIOSH) recommends taking a 5-minute break for every hour of computer work.


    The Occupational Safety and Health Administration (OSHA) has issued guidelines
    for preventing repetitive strain injuries. These guidelines include taking frequent
    breaks, using ergonomic equipment, and maintaining proper posture.


    I''ve heard that many people who work with computers all day long suffer from
    repetitive strain injuries. Is there any truth to this? And if so, what can I
    do to prevent them?


    There are several ways to reduce the risk of repetitive strain injuries. First,
    take frequent breaks. Stand up and walk around for a few minutes every hour. Second,
    use ergonomic equipment. Make sure your keyboard and mouse are at a comfortable
    height and angle. Third, maintain proper posture. Sit up straight and keep your
    feet flat on the floor.


