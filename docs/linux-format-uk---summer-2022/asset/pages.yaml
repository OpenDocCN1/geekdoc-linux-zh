  md: "# GITPOD\n\n# Online reproducible dev environments\n\nStuart Burns is your\
    \ guide to Gitpod, a new ‘work from anywhere’ development platform that could\
    \ revolutionise tech test environments.\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_71_0.png)\n\
    \n+   **[ME] EXPERT**\n+   Gitpod is a cloud development environment in the browser,\
    \ where you can use any code, including a project’s IDE, terminal, Git tools and\
    \ other services. It is a new tool that helps you to:\n+   \n+   * create a workspace\
    \ in seconds\n+   * collaborate in real time\n+   * run code in a fully cloud-based\
    \ environment\n+   * automate the setup process for new projects\n+   \n+   *gitpod.io*\n\
    \nC omplex and test environments that require installation into the host. This\
    \ is a great opportunity to set up a development environment that uses configuration\
    \ files in order to keep the environment reproducible, but it can take time to\
    \ set up, and it’s easy to make mistakes. Gitpod solves this problem by providing\
    \ a cloud-based development environment where you can work on your code in your\
    \ browser.\n\nGitpod’s Gitpod IDE has its own Git repository, in which each workspace\
    \ can be linked to a project. This means that you can work on a project in your\
    \ browser. The Gitpod IDE is a web app that uses a standard browser. It’s also\
    \ a full IDE, complete with a terminal, Git tools and more. It uses VS Code extensions,\
    \ so you can use the same extensions you use in VS Code. The IDE is available\
    \ in the browser, so you can work on your project from anywhere.\n\n# Set up a\
    \ running environment with Gitpod\n\nTo use Gitpod, you’ll need a GitHub account.\
    \ Go to the Gitpod website and sign in with your GitHub account. Then, you can\
    \ create a new workspace by clicking on the ‘+’ button in the top right corner.\
    \ You can also create a workspace from a GitHub repository. Just paste the URL\
    \ of the repository into the ‘Open in Gitpod’ button. Gitpod will create a new\
    \ workspace based on the repository. You can then start working on the code in\
    \ the Gitpod IDE."
