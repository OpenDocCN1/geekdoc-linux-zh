    # # Backblaze B2


    A simple pricing model makes it easy to migrate to, says **Jonas DeMuero**


    ### IN BRIEF

    Backblaze’s cloud product in Germany is the Simple Storage Service. But I think
    you need to know a lot of the storage market. You need it to be very simple for
    many companies. The good impression is that, as a service provider, it supports
    you very well so you don’t have to worry about what you do with the product. In
    the future, maybe they will get you to offer something in the product.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_18_0.png)


    Backblaze, which gained fame in 2008 with the B2 backup service, now has to stand
    steady. It used to be a very simple product and only a competitor for some in
    2015. It’s now looking like a back-to-basics offering similar to Amazon’s S3 (object
    storage). It seems to be very easy to migrate to. The other thing is pricing and
    software. For the hardware, I’m not sure if it’s the most modern. For the hardware,
    I think it’s okay, but for the cloud, it’s not the most important.


    One thing that I do like is that a new storage provider that has an up-to-date
    100 Gb/s connection can be a very nice opportunity for companies that use very
    much space and need to process or do other things for their data. It’s a great
    opportunity for them to have a very cheap solution to store their data. It makes
    sense for companies that use a lot of data, but it’s not easy to use for a small
    team. I’ve used it in projects. It makes sense for me and in the future. It’s
    very flexible and the new features that we saw in our demo (for example the new
    storage class, which will help you save up to 90% on costs and can be used for
    archiving or infrequently accessed data) can be very useful.


    ### Choice of migration paths

    Maybe one of the main benefits of moving data to B2 is their flexibility. You
    can access it locally with a low cost and without the need to spend too much money
    on a license. If you want to get more out of your data, B2 offers you the option
    to use a third-party application. There are some applications from Backblaze that
    you can use to get more out of your data. For example, B2’s Cloud Storage Service
    can be used to store data on Backblaze B2 or on your own cloud. There are also
    some other applications that you can use to get more out of your data, for example,
    a backup application. You can also use the B2 Cloud Storage Service to store data
    on Backblaze B2 or on your own cloud. I think the flexibility is one of the biggest
    benefits of using B2.


    ### Customer or consultant

    Backblaze’s new feature set is very good, but the support system is not very good.
    I’m not sure if it’s the support team that’s not good or the system that’s not
    good. I’m not sure. I think the support team is not very good.


    +   Backblaze has been working on a very simple and effective way of backing up
    data for a long time. It’s been around for a while and has been used by many companies.
    It’s a very good product and a very good company. It’s a very good product and
    a very good company.


    +   - **Verdict**

