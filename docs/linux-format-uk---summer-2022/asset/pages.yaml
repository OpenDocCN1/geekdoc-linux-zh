  md: '# TUTORIALS Edit photos


    # QUICK TIP


    You’re about to create lots of new Photoshop actions, so here’s a handy guide
    that will help you navigate the action palette.


    +   - **Start**: Click the folder icon to start recording an action.

    +   - **Stop**: The square icon stops recording.

    +   - **Play**: Click the right-pointing triangle to play back an action.

    +   - **Breakpoints**: Use this button to pause and record.

    +   - **Cycle**: Use this button to loop actions.

    +   - **Set**: Click the folder icon to create a new action set.


    For a free brush set and more Photoshop tips and tricks, visit tinyurl.com/Photofun.


    capturing a classic, retro look from any picture in your library using the 15
    Photoshop tricks in this tutorial.


    First it’s easy to fall into the trap of assuming each step of the tutorial has
    to be done in Photoshop. But just because we’re here doesn’t mean you have to
    be. Some steps in this tutorial, such as scanning an image, can be accomplished
    with almost any tool you have at hand.


    Once you’ve got a shot you’re happy with and have scanned it as a TIFF or JPEG
    file, it’s time to open Photoshop and start experimenting. Our tutorial assumes
    you’ll be using Photoshop CS6 or later (you can buy it for $640.62).


    The following 15 tricks are the tools you need to create your own unique retro
    feel as a whole or perhaps only for select areas, or even to make the image a
    print that you’d like to stick up. If you’d like to create your own retro filters,
    use the first 15 tricks as inspiration for what’s going on in a photo, then tweak
    to your own preference by following our advice on creating custom presets and
    the tips to make your own Photoshop filter.


    For the 15th and final trick, we’ve shown you how to export your edited photo
    as a PNG file, so that when you upload it to one of your social networks or share
    it, people will always get the full effect you intended.


    In addition, we’re confident to say a new image, chosen from your photo library
    can have a classic retro aesthetic. It will depend on you whether we’ve picked
    the correct image that’s best suited to be a new image. Ensure that your image
    will have a good size, with enough pixels to work with. Ideally we’re looking
    for an image over 1000 pixels in height and width; if the image is smaller than
    this, don’t worry. You can enlarge it if you like, just bear in mind that this
    may not result in a sharp image. Also, bear in mind that some, such as flowers
    or a night sky, can look great in black and white. The only limitation here is
    your imagination.


    When you’re a beginner, the easiest thing to do is make a copy of your image and
    create another layer on top. This way you can make edits without affecting the
    original and you can go back to it whenever you like. To make a copy of the layer,
    select the **Layer** menu from the drop-down list at the top of the screen, and
    click on **New** from the drop-down list that appears.


    You can also just drag the layer to the **New Layer** icon at the bottom of the
    layer palette.


    As you progress, you will start to make edits to the various layers that make
    up your image.


    # Make an image transparent


    Photoshop makes it so much easier to create a transparent image (useful for stickers
    and all sorts of other things) when you use Photoshop. It allows you to have total
    control over what parts of your image are transparent, without having to make
    multiple versions of the same image. A solid layer on top is a great way to create
