    QR codes are the 2D barcodes you''re likely to be well familiar with, but you
    may not realize they can be used for a lot more than just linking to websites.
    When these tiny black-and-white codes are created, a specific amount of data is
    encoded into it. This data can be used in a variety of ways, and it''s up to the
    device or app to determine what to do with it. Qrncode is a simple web app that
    lets you generate custom QR codes in your browser without sending any of the data
    to a server. It''s fast, easy, and the codes it generates are just as functional
    as any other. The only drawback is that the generated QR codes are limited to
    a certain number of characters, but for most uses, this is more than enough.


