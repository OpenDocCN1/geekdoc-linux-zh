- pgno: 96
  md: "# Controlling: Lettres CODING ACADEMY\n\nTo get a game computer up and running\
    \ we’re making modifications to this Linux kernel that has suffered from all the\
    \ bugs that we’ve ever dreamed up. The only way to get it working properly is\
    \ through the magic of a **kernel module**. A kernel module is a piece of code\
    \ you can load onto the system. It gets compiled as a small object file that you\
    \ then load onto the running system. It’s like a puzzle piece that slots into\
    \ your running kernel.\n\nSo what makes a game computer great? For me it’s how\
    \ responsive it feels. There’s two main ways you can tweak a kernel to get it\
    \ working the way you want: changing the scheduler, or changing the timing.\n\n\
    The first is the **scheduler**, which manages how the processor hands out CPU\
    \ cycles. The default Linux scheduler isn’t bad, but for a game we want it to\
    \ know which processes are important and which can wait. The second is the **timing**,\
    \ which controls how the system keeps time.\n\n# 5 OPP IN A NUTSHELL\n\nEvery\
    \ branch, main, paragraph that’s been built with us on the **control** is a **kernel\
    \ module**. This is a self-contained piece of code. If you look at our GitHub\
    \ repo, you’ll see it all. There are six main components that make up the game:\n\
    \n+   - The piece\n+   - The board\n+   - The AI\n+   - The user interface\n+\
    \   - The game loop\n+   - The input\n\nEach of these is a separate kernel module.\
    \ They work together to make the game. They are also all **re-entrant**, meaning\
    \ they can be loaded and unloaded at any time. This is important for development\
    \ because you can test each piece individually. For example, you can test the\
    \ AI against the user, or you can test the board without the AI.\n\n```\nsudo\
    \ modprobe -r kernel_module\nsudo modprobe kernel_module\n```\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_96_0.png)\n\
    \n> WAS IT QUICK?\n> \n> If you are a bit of a puzzle, this will be a fun way\
    \ to keep your wits about you. It’s a real test of your knowledge of the coding\
    \ language.\n> \n> Do it for free!"
  merge: -1
  img_proc: true
