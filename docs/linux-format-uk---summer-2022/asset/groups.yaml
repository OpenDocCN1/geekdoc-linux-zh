    单片机。它是为了配合 Arduino 使用而设计的，旨在向你展示，即使同时有许多组件在运行，制作一个酷酷的小项目也并非难事。


    ![](img/f20a68d91e56325c44e9a1405ca1923f_47_0.png)


    ## 快速提示


    121544-444 是一种共阳极、4 位、7 段 LED 显示屏。它有 12 个引脚：1-7 用于段码，8-11 用于共阳端，12 用于小数点。（参见 www.allaboutcircuits.com。）


    该行其余数字的 LED 数量。看到了使管子工作的接线。请记住，Nixieplex 有 12 个数字位，且每个数字位的侧面有 7 个数字。LED 也具备使用这
    40 个 LED 的能力，但它们不在同一根线上工作。要改变亮度，请尝试使用按钮并观察灯管。灯管是一个内部带有线圈导线的玻璃管。


    ## 使用预设节省时间


    Nixieplex 还有 12 种预设模式，你可以保存和调用它们，因此无需不断重置灯管。这是一种节省时间并让你的项目顺利运行的绝佳方式。你还可以保存自己的预设，从而打造独特的视觉效果。这是一种节省时间并让你的项目顺利运行的绝佳方式。


    ## 扩展比例


    在实验方面，我（也建议大多数人）忘掉使用一组小型氖气管作为项目输出端这个想法。当使用 8 位 7 段 LCD 时，你或许能用一个 74HC574 IC 驱动所有段码。但在
    Nixieplex 中，我们可以使用 12 位氖气管和 40 个 LED。这些 LED 经过测试，非常可靠。它们还非常容易使用。它们可以连接到 Nixieplex
    上的任何引脚，且使用非常简单。


