    该游戏已经开发了一段时间，社区一直急切地等待其发布。新游戏预计将于 2023 年底发布，社区正急切地等待其发布。


    ## 新闻台


    ### 观点


    #### 批判性思维


    Katie Gompels


    今年头五个月，我没有读过一篇新闻文章。这是我做出的决定，以脱离每日的新闻消费，并学会独立思考。


    ### 我们的日常生活中缺乏所有的背景知识


    我认识许多人在其学习或工作领域非常投入，却从未听说过 STEM 中的“S”（科学）。同样，我也认识很多社会科学领域的人，他们分不清晶体管和二极管，或者完全不知道什么是“量子计算机”。这令人遗憾，因为我们知道得越多，能贡献的就越多，我们在生活中做出的知情决定也就越好。


    我们也缺乏批判性思维技能，这使我们背负着自身偏见的危险。例如，如果你对环境的看法没有坚实数据支持，这可能导致糟糕的政策决定。同样，如果你没有意识到某些医疗决定的影响，这也可能导致不良结果。


    我们也缺乏同理心。可惜我们无法感同身受其他世界人民的困境。如果我们不了解他们的需求，我们如何帮助他们？同理心是批判性思维的关键组成部分。我们需要学会从他人的视角看待世界。


    ### 资金


    #### 微软为 GNOME 注入动力


    感谢微软工艺及其 PoSS 基金。


    GNOME 项目几年来一直通过微软合作伙伴计划的 PoSS（共享开源订阅）计划从微软那里获得资金。该计划允许 GNOME 申领 GNOME 项目 PoSS
    基金的 100%，这是一个专为开源开发设立的基金。


    为了全面了解情况，我们需要看更广泛的背景。监督 GNOME 项目的 GNOME 基金会几年来一直通过微软合作伙伴计划的 PoSS（共享开源订阅）计划从微软那里获得资金。该计划允许
    GNOME 申领 GNOME 项目 PoSS 基金的 100%，这是一个专为开源开发设立的基金。


    ![](img/f20a68d91e56325c44e9a1405ca1923f_7_0.png)


    ### 移动


    #### Ubuntu Touch OTA-23 发布


    受支持的设备获取了最新的移动端版本。


    ### 软件


    #### Thunderbird 102 现已可用


    开源邮件客户端的重大更新。


    # 发行版观察


    自由软件沙发旁边有什么？


    ## 便携版 5.0


    新版本 Gcompris 可供下载下载。它提供多种变体，‘便携版’构建现在包含完整的 Gcompris 1.35 套件，以及‘新’ Gcompris 屏幕作家/翻译器程序的更新。最新版本也是一个
    Debian 3.2 Sarge 更新，这是安装一系列附加软件的机会。最新的 Gcompris 便携版可在 [gcompris.tuxfamily.org](gcompris.tuxfamily.org)
    找到。


    ## 秃鹰 OS 1.0


    Ccondors Linux 的最新版本是一个新变体，Condor 0.2。基于 Debian Lenny，它在该项目官方网站 [condors.co.uk](condors.co.uk)
    上宣布。公告指出，这个 Ccondors 发行版是第一个以 Xfce 4.4 作为标准桌面环境的 Ccondors 发行版，它现在可用，并且将于 2009
    年 9 月底/10 月初以测试版和新版本的形式提供给那些个人用户。


    ![](img/f20a68d91e56325c44e9a1405ca1923f_8_0.png)


    ![](img/f20a68d91e56325c44e9a1405ca1923f_8_1.png)


    ##  Endeavour 桌面 22.6


    EndeavourOS 的最新版本是最新的‘滚动’版本，还有一个更新的版本，称为‘滚动’（稳定版）。最新的发行版中引入了 Gnome 桌面环境。此版本也可以在
    Endeavour 发行版的 KVM 虚拟化中看到。该发行版的新版本还提供了更多桌面环境的选择，例如 Xfce 桌面版，它也可以在虚拟服务器上使用。


    ![](img/f20a68d91e56325c44e9a1405ca1923f_8_2.png)


    ## TrueNAS 22.02.2


    我们最新的 Truenas 11.2-RELEASE 22.02.2 是这个流行存储堆栈的最新更新。它基于 FreeNAS 11.2-RELEASE，也可作为虚拟机器在
    Oracle 的云托管服务上使用，同时也提供裸机安装形式。欲了解更多信息，请参阅 Truenas 云托管服务上的 Truenas 云托管，你可以使用它设置裸机安装，或在云端或本地进行
    VM 安装。


    ![](img/f20a68d91e56325c44e9a1405ca1923f_8_3.png)


    ## 观点


    ### 谢谢管理员！


    大家好，Tux 的同胞们！作为最早访问 Tux 网站的人之一，在仔细看了看第一页后，我对它的平淡无奇感到惊讶。在浏览了 Aggregator.com 和新闻源后，这一点对我更加清晰了。在查看了他们的网站和评论后，很明显该网站更像是一个论坛和一个博客，而不是我在寻找的东西。我不在寻找一个给我提供新闻的网站，我在寻找一个能让我快乐的地方。我会回来的。祝你们大家都有美好的一天。谢谢，Tux。我会回来的。我相信我很快就会再回来。祝你们大家都有美好的一天。


