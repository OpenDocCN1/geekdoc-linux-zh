    \ when you plug it in. You should see a line like `input: 2axis 4button gamepad\
    \ as /devices/...` or similar. You can also check if it's showing up in `jstest-gtk`\
    \ (a graphical joystick tester). If you don't see it there, you likely have a\
    \ problem.\n\nFinally, once we've got `pygame` installed, we need to modify the\
    \ `tetris` source code to actually use it. We need to add some import statements\
    \ at the top of our `tetris.py` file:\n\n```python\nimport pygame\nfrom pygame.locals\
    \ import *\n```\n\nWe also need to modify the `__init__` function to initialise\
    \ the joystick module:\n\n```python\ndef __init__(self, display):\n    pygame.init()\n\
    \    self.display = display\n    pygame.joystick.init()\n    self.joystick = pygame.joystick.Joystick(0)\n\
    ```\n\nThis code initialises the first available joystick. If you have multiple\
    \ gamepads, you can use `pygame.joystick.get_count()` to find out how many there\
    \ are, and use the appropriate index in the `Joystick` constructor.\n\n## Controlling\
    \ Tetris\n\nNow that we have downloaded and cloned the project in our workspace,\
    \ we can go to the project and we can find that we have a fairly new file. In\
    \ our main.html file, we are already using the JavaScript Library called Pexel.\n\
    \nAs described before, there are two Python files, READY or SKELETON. The main\
    \ difference between them is that the READY file has been pre-coded with two functions.\
    \ We can **initialize** our game and control it to move the board on the keyboard.\
    \ In addition, we will see how to control the player piece to make it move in\
    \ our game. This is a more advanced file to code as it will contain support for\
    \ extra key controls to initialize the game and for a complete working version\
    \ of the game. You should probably start with the SKELETON file and work your\
    \ way up to the READY file if you want to learn more about how the game is working.\n\
    \n### Project overview\n\n- This project uses an unbeatable concept of a map and\
    \ several different types of objects. Let's take a look at the different types\
    \ and how we use them to control the movement of the game.\n- To control the main\
    \ board, we have to first understand two main objects:\n  - TetrisBoard() class\
    \ - This is the object that holds the state of the board and handles the rendering\
    \ of the board. It is responsible for moving and rotating the blocks.\n  - TetrisPiece()\
    \ class - This is the object that represents a single tetromino (piece) and handles\
    \ its movement and rotation.\n- To control the pieces, we have three different\
    \ types of objects:\n  - Board - This is the object that holds the state of the\
    \ board and handles the rendering of the board. It is responsible for moving and\
    \ rotating the blocks.\n  - PlayerPiece - This is the object that represents a\
    \ single tetromino (piece) and handles its movement and rotation.\n  - GamePiece\
    \ - This is the object that represents a single tetromino (piece) and handles\
    \ its movement and rotation.\n\nNow we are ready to create our game.\nAs you can\
    \ see from the code in the `tetris.js` file, the main `tetris()` function takes\
    \ four arguments. Let's look at the arguments and how they work.\n\nThe first\
    \ argument is the `canvas` element. This is the HTML canvas element that we will\
    \ use to render the game. We can pass in the `canvas` element by using the `getElementById`\
    \ method. For example, if we have a `canvas` element with the ID `tetris-canvas`,\
    \ we can pass it in using `document.getElementById('tetris-canvas')`.\n\nAs our\
    \ second argument, we can define the **number of columns** that we want to have\
    \ in our game. This can be anything from 1 to 100, but a typical value is 10.\
    \ The third argument is the **number of rows** that we want to have in our game.\
    \ This can also be anything from 1 to 100, but a typical value is 20. The fourth\
    \ argument is the **scale** of the game. This is the size of the blocks in the\
    \ game. A typical value is 20, but you can make it as large or small as you like.\n\
    \n```html\n<html>\n<body>\n<canvas id=\"tetris-canvas\"></canvas>\n<script src=\"\
    tetris.js\"></script>\n<script>\n// Create a new game\nconst game = new Tetris(document.getElementById('tetris-canvas'),\
    \ 10, 20, 20);\n</script>\n</body>\n</html>\n```\n\nIn the main.html file, we\
    \ will see the canvas element that we have created. We will also see the script\
    \ tags that are used to load the `tetris.js` file. In addition, we will see a\
    \ script block that is used to create a new game. This is where we will pass in\
    \ the arguments for the game.\n\nWe can create a new game by using the `Tetris`\
    \ constructor. This constructor takes four arguments. The first argument is the\
    \ `canvas` element. This is the HTML canvas element that we will use to render\
    \ the game. We can pass in the `canvas` element by using the `getElementById`\
    \ method. For example, if we have a `canvas` element with the ID `tetris-canvas`,\
    \ we can pass it in using `document.getElementById('tetris-canvas')`.\n\nThe second\
    \ argument is the **number of columns** that we want to have in our game. This\
    \ can be anything from 1 to 100, but a typical value is 10. The third argument\
    \ is the **number of rows** that we want to have in our game. This can also be\
    \ anything from 1 to 100, but a typical value is 20. The fourth argument is the\
    \ **scale** of the game. This is the size of the blocks in the game. A typical\
    \ value is 20, but you can make it as large or small as you like.\n\n> **QUICK\
    \ TIP**\n> The main object that we use in this project is the `TetrisBoard` class.\
    \ It is responsible for creating the game board and rendering it to the screen.\
    \ It also handles the user input and updates the game state accordingly.\n\n###\
    \ Project Files\n\nIn our next section, we will start by looking at the project\
    \ files. We have a number of files in this project, so let's take a look at them.\n\
    \n#### main.html\nThe main HTML file is the main entry point for our project.\
    \ It contains the canvas element and the script tags that are used to load the\
    \ `tetris.js` file.\n\n#### tetris.js\nThe main JavaScript file that contains\
    \ the game logic. It defines the `Tetris` class and the `TetrisBoard` class.\n\
    \n#### style.css\nThe main CSS file that contains the styles for the game.\n\n\
    #### index.html\nAn alternative entry point for the project. It is similar to\
    \ the `main.html` file but uses a different layout.\n\n#### README.md\nA markdown\
    \ file that contains information about the project.\n\n### Coding Practice\n\n\
    In this section, we will be coding the main game loop. This is where we will update\
    \ the game state and render the game to the screen.\n\nThe game loop is a very\
    \ important part of any game. It is responsible for updating the game state and\
    \ rendering the game to the screen. It is typically run using `requestAnimationFrame`.\n\
    \nIn our project, the game loop is run using the `TetrisBoard` class. This class\
    \ is responsible for creating the game board and rendering it to the screen. It\
    \ also handles the user input and updates the game state accordingly.\n\nIn the\
    \ next section, we will be coding the main game loop. This is where we will update\
    \ the game state and render the game to the screen.\n"
