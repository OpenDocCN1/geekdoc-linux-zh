    \ editing options with a wonderfully friendly user interface. This means that\
    \ you can get started quickly, but you can also dip into the advanced options\
    \ when you want more control over your images. It's a great balance, and one that\
    \ we think is ideal for most users. Whether you're a complete beginner or a seasoned\
    \ pro, PhotoFlare is worth a look.\n\nAreas they can cut, and so we're sticking\
    \ with the 18.5-inch version.\n\n**Getting PhotoFlare**\n\nPhotoFlare is a Windows\
    \ program, and it can be downloaded from the developer site at www.thefluffybunny.com.\
    \ Once you've downloaded the installer, run it and follow the prompts to install\
    \ the program. Once installed, you'll find PhotoFlare in your start menu. When\
    \ you launch the program, you'll be presented with a blank canvas and a toolbar\
    \ of tools.\n\n### NAVIGATING PHOTOFLARE\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_57_1.png)\n\
    \n1.  **Main toolbar:** This is the main toolbar, which contains all the tools\
    \ you need to edit your images. It's a bit of a beast, so we recommend taking\
    \ some time to explore it.\n2.  **File menu:** You can access the File menu from\
    \ here, which allows you to open and save images, as well as access the print\
    \ and export options.\n3.  **Photos:** Use this area to manage the images you\
    \ have open. You can drag and drop images into this area, or use the File menu\
    \ to open them.\n4.  **Display:** You can use the display options to change the\
    \ size of the image, or to fit it to the window.\n5.  **Framed image:** This is\
    \ where the image you are working on will appear. You can use the tools on the\
