  - "[PAGE 73]\n\n# Host your own secure VPS-based WireGuard\n\nDavid Rutland takes\
    \ the LXF VPS server for a final spin. This month, he’s protecting his privacy\
    \ and watchinging Mexican TV with a self-hosted VPS.\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_73_0.png)\n\
    \nI don’t think Proxmox was anywhere near my original design when I bought OVH’s\
    \ server when we first took the LXF server on. And so far this month we’re using\
    \ it more and more to do its one job. This article talks about Proxmox and WireGuard,\
    \ which will form an integral part of our security setup in all future server\
    \ articles.\n\nWireGuard is a modern, fast, highly secure, and easy to use tool,\
    \ and in this way, it’s similar to OpenVPN, but it’s built into the Linux kernel,\
    \ so the configuration is much easier. WireGuard is also more secure, which is\
    \ why we’ve decided to use it going forward. It’s available in kernel releases\
    \ 5.6 and higher. For now, we’re using the kernel shipped with Debian bullseye,\
    \ which is already 5.10.\n\nWireGuard is a project by Jason A. Donenfeld, and\
    \ its development is overseen by the Netfilter project. WireGuard is a very secure\
    \ VPN, and the only other thing I’d really change about the LXF server right now\
    \ is to add a real firewall. WireGuard is a very secure, lightweight, and fast\
    \ VPN, and it’s a very good tool for protecting your privacy on the internet.\n\
    \nThe problem\nWe set up LXF’s VPS on OVH’s datacentre. LXF’s VPS is a virtual\
    \ private server that can be accessed via SSH. However, if we want to access the\
    \ VPS from outside our network, we need to set up a VPN. WireGuard is a great\
    \ choice for this, as it’s a very secure, lightweight, and fast VPN.\n\nThe solution\n\
    We can set up a WireGuard VPN on our LXF VPS, and then we can access it from anywhere\
    \ in the world. This is a great way to secure our VPS, and it’s a very secure,\
    \ lightweight, and fast VPN.\n\nIs self-hosted better?\n\nThe answer is both yes\
    \ and no. Self-hosting a VPN gives you complete control over your data and privacy,\
    \ but it also means you have to manage the server yourself. If you don’t have\
    \ the time or the expertise to manage a server, you might be better off using\
    \ a hosted VPN service.\n\n+   - **Our Expert Says**:  \n+     WireGuard is a\
    \ very secure VPN, and the only other thing I’d really change about the LXF server\
    \ right now is to add a real firewall. WireGuard is a very secure, lightweight,\
    \ and fast VPN, and it’s a very good tool for protecting your privacy on the internet.\n\
    \n+   - **NEWS**:  \n+     OVH is a French hosting company that offers a wide\
    \ range of services, including dedicated servers, virtual private servers, and\
    \ cloud computing. OVH is a great choice for hosting a WireGuard VPN, as it offers\
    \ a wide range of services, including dedicated servers, virtual private servers,\
    \ and cloud computing."
