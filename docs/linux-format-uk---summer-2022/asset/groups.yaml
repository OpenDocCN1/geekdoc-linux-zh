  mdcn: "\n# 教程：OnlyOffice 插件\n\n**ONLYOFFICE**\n\n第 212 期 / 2023 年 1 月–2 月\n\n##\
    \ 将 WordPress 与 OnlyOffice 结合使用\n\n当 OnlyOffice 文档与 WordPress 连接时，作者可以将文档插入到在线文章中。**Kesnija\
    \ Fedoruk** 将解释其工作原理。\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_69_0.png)\n\n\
    在我所列的最受欢迎的即时内容管理系统短名单中，如果有一个 CMS 脱颖而出，那 WordPress 绝对是榜首。它是世界上最受欢迎的内容管理系统。它占所有网站的\
    \ 40% 以上，并且拥有大约 57,000 个插件，使其更加实用。它基于 PHP 和 MySQL 构建。它具备管理和维护博客或简单网站所需的所有功能和能力，甚至可用于创建在线商店。在本文中，我将谈论我推荐给客户的一个流行\
    \ WordPress 插件：OnlyOffice。它允许用户将 OnlyOffice 文档与 WordPress 结合使用，并将文档直接插入其文章中。\n\
    \n-   **ONLYOFFICE DOC**\n-   **博主与专家**\n-   **WORDPRESS 插件**\n-   **ONLYOFFICE**\n\
    -   **CMS**\n-   **在线文章**\n-   **集成**\n\n例如，你可以使用它来创建具有丰富且独特外观的博客文章或网页。还有一个方便的选项，允许你只需复制文档链接即可将你的作品作为\
    \ PDF 分享。对于需要将文档制作成公共或私人网站的人来说，该插件拥有自己的文件存储，并允许你管理和存储你的文件。它可用于与你的团队、客户和其他用户共享文档。它还具有一项独特功能，允许你在线编辑文档。\n\
    \n![](img/f20a68d91e56325c44e9a1405ca1923f_69_1.png)\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_69_2.png)\n\
    \n### 安装插件\n\n要安装此插件，请访问网站 [wordpress.org/plugins/onlyoffice-document-editor](https://wordpress.org/plugins/onlyoffice-document-editor)\
    \ 并点击 *立即安装* 按钮。安装后，你需要激活该插件并进入其设置。你也可以从 GitHub 下载插件，手动安装，或使用 cPanel 中的一键安装程序。\n\
    \n### 安装 OnlyOffice 文档\n\n作为下一步，你可以将文档连接到网站并设置连接，可以使用你自己的服务器，也可以使用 OnlyOffice\
    \ 私有云等云服务。为此，你需要在服务器上安装 OnlyOffice 文档服务器。为了使用 OnlyOffice，我们需要连接到安装了文档服务器的服务器。你可以使用自己的服务器或连接到云服务。有两种选择：使用\
    \ only-cloud 选项或在你的主机上安装文档服务器。\n\n**快速提示**\n\n-   **ONLYOFFICE DOC**\n-   **WORDPRESS\
    \ 插件**\n-   **ONLYOFFICE**\n-   **CMS**\n-   **在线文章**\n-   **集成**\n\n### 添加文件\n\
    \n要使用服务器上已有的文件，请前往 *设置 > 媒体*。打开媒体库后，点击 *上传文件* 按钮。你可以从自己的服务器、云服务或远程 URL 添加文件。该插件还允许你通过拖放添加文件。\n\
    \n如果你想与他人共享文档，我建议使用云服务。你可以通过使用 *共享* 按钮与他人共享文档。链接将自动生成。你也可以使用 *PDF* 选项共享文档。可以像\
    \ PDF 文件一样使用该文档。\n\n© 2022 ILYOZINE SOFTWARE OÜ. 保留所有权利。由 ILYOZINE SOFTWARE OÜ\
    \ 出版。\n\nonlyoffice.com/plugins   illyozine.eu   73\n\n## OnlyOffice 插件：安装 .oxt\
    \ 文件\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_70_0.png)\n\n-   前往**自定义**栏。在左侧的\
    \ 4 个**自定义**屏幕中：\n    -   `org.*.org/office/document/Basic/Help*/help*/*/*/*/*/index.html`\n\
    \    -   `http://wiki.openoffice.org/Confluence/Space/Basic*/Help/*/*/*/*/*/index.html`\n\
    \    -   `https://openoffice.org/docs/Release/6.1/Help/en/help\\index.html`\n\
    \    -   `https://api.openoffice.org/Confluence/Space/Basic*/Help/*/*/*/*/*/index.html`\n\
    \n如果你不想构建，最佳选择是从 [Gentoo Bugzilla](https://bugs.gentoo.org/show_bug.cgi?id=962548)\
    \ 的项目页面下载 .oxt 文件。\n\n### .oxt 文件助手\n\n**OfficeOxt** 是一个 Python 程序，有助于将 .oxt 文件安装到\
    \ OpenOffice 中。它支持 OpenOffice 的所有主要版本，并且适用于 Windows 和 Linux。你可以从 [OfficeOxt](http://www.librewriter.com)\
    \ 获取（版本 2.1 或更高版本）。\n\n### 手动安装\n\n手动安装过程如下：\n\n1.  将 .oxt 文件（其实只是一个 zip 文件）**解压**到一个文件夹中\n\
    2.  在你的 OpenOffice 用户配置文件中创建一个新的**扩展文件夹**：在 Linux 上为 `~/.openoffice/share/extension`，在\
    \ Windows 上为 `%APPDATA%\\OpenOffice\\share\\extension`\n3.  将解压后的内容复制到新文件夹中\n\
    4.  运行命令 `soffice --install --user-install --norestore` 以安装扩展\n\n注意：如果使用 `--norestore`\
    \ 标志，你可以安全地从脚本中运行该命令。如果没有该标志，你必须从命令行运行。\n\n## 增强数据安全\n\n`security` 扩展允许你通过以下方式保护你的文档：\n\
    \n-   使用密码对其进行**加密**\n-   **添加**数字签名以验证真实性\n-   使用日志文件**跟踪**更改\n-   **禁用**打印或复制\n\
    \n![](img/f20a68d91e56325c44e9a1405ca1923f_70_1.png)\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_70_2.png)\n\
    \n# GITPOD\n\n## 在线可复现开发环境\n\nStuart Burns 将带你了解 Gitpod，这是一个新的“随处工作”开发平台，可能会彻底改变技术测试环境。\n\
    \n![](img/f20a68d91e56325c44e9a1405ca1923f_71_0.png)\n\n**专家**\n\nGitpod 是浏览器中的云开发环境，你可以在其中使用任何代码，包括项目的\
    \ IDE、终端、Git 工具和其他服务。它是一个新工具，有助于你：\n\n-   在几秒钟内创建工作区\n-   实时协作\n-   在完全基于云的环境中运行代码\n\
    -   为新项目自动化设置过程\n\n*gitpod.io*\n\n复杂的和测试环境需要安装到主机中。这是一个很好的机会，设置一个使用配置文件以保持环境可复现性的开发环境，但这可能需要时间设置，并且很容易犯错。Gitpod\
    \ 通过提供基于云的开发环境解决了这个问题，你可以在浏览器中处理代码。\n\nGitpod 的 Gitpod IDE 拥有自己的 Git 仓库，其中每个工作区都可以与一个项目链接。这意味着你可以在浏览器中处理项目。Gitpod\
    \ IDE 是一个使用标准浏览器的 Web 应用程序。它也是一个完整的 IDE，配备终端、Git 工具等。它使用 VS Code 扩展，因此你可以使用你在\
    \ VS Code 中使用的相同扩展。IDE 在浏览器中可用，因此你可以从任何地方处理项目。\n\n## 使用 Gitpod 设置运行环境\n\n要使用 Gitpod，你需要一个\
    \ GitHub 账户。访问 Gitpod 网站并使用你的 GitHub 账户登录。然后，你可以点击右上角的“+”按钮创建新的工作区。你也可以从 GitHub\
    \ 仓库创建工作区。只需将仓库的 URL 粘贴到“在 Gitpod 中打开”按钮中。Gitpod 将基于该仓库创建新的工作区。然后你就可以开始在 Gitpod\
    \ IDE 中处理代码。\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_72_0.png)\n\n显然，前桥是连续的，连接到后车架。后车架的底线可以与镜头接触。\n\
