  - "[PAGE 95]\n\n# CODING ACADEMY Controlling Tetris\n\n|  | other | |  | self.color\
    \ |\n|---|---|---|---|---|\n|  | **other** | **color** | **new** | **self.color**\
    \ |\n|  | red | blue | green | red |\n\nThe PyCharm editor is a brilliant tool,\
    \ and its interface and settings give some nice tips to grid-based problems. Another\
    \ useful feature built in to PyCharm, and available in other editors, is debugger.\n\
    \nGrid and Data structures Whether looking at matrix data, a 3-D array (three\
    \ co-ordinates, three numbers), a 3-D world or an array of arrays, it’s all about\
    \ grids in data structures! The examples in this magazine focus on 2-D (arrays,\
    \ lists, nested lists), but these same fundamental ideas can be applied to a 3-D\
    \ array. See examples in this issue.\n\nIf you’re using PyCharm, a useful feature\
    \ to try is the built-in debugger. In the menu, choose\n*Debug* > *Debug*. It\
    \ will ask you to pick a configuration – select *Script* and type in the name\
    \ of the main Python file. Then set some breakpoints in the code as usual. To\
    \ set a breakpoint, place your mouse on the line you want to investigate, then\
    \ click the left button – a dotted line will be drawn across the text. The debugger\
    \ runs until a breakpoint is met. You can then use the controls below the code\
    \ window to step through the debugger to work out what’s happening in the code.\n\
    \n# Focus on classes\n\nNow that we can control the individual blocks, it would\
