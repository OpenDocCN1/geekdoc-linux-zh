    In **normal mode**, you can select the number of clues to be given, or even select
    the difficulty of the puzzle. For example:


    ```bash

    nudoku -n 9

    ```


    `nudoku -n 9` will set the difficulty to 9, which is the hardest. You can also
    use `nudoku -n 1` to set the difficulty to 1, which is the easiest.


