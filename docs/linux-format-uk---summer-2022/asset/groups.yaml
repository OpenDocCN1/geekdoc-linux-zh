    # GeckooLinux Static 153


    Michael Reed takes a close look at GeckooLinux, a distro with a wide variety of
    editions that puts a friendly face on openSUSE.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_20_0.png)


    # IN BRIEF


    GeckooLinux also has the "good stuff"—a selection of packages that you need to
    run an office suite or to do some programming. The software is from the standard
    openSUSE repositories.


    # IN BRIEF


    The variety of editions is what makes GeckooLinux so special. If you don''t want
    a huge-to-total install, you could install a minimal system using the command
    line (though there is no option to install via the command line). You could also
    install a full system with the GUI using a USB stick.


    # Specs


    +   - CPU: AMD 12-core, 2.1GHz

    +   - Memory: 512MB

    +   - Disk: 20GB

    +   - Build: openSUSE 15.3

    +   - Source: https://geckolinux.org

    +   - Rating: 4/5


    GeckooLinux is based on openSUSE 15.2 and is built for x86 and AMD64 platforms,
    and runs without any special dependencies. GeckooLinux is an open source distro
    that comes with a number of packages pre-installed, and is designed to be easy
    to install and use. It comes with a standard openSUSE-based installer, and can
    be installed from a USB stick or DVD. It also comes with a number of useful tools
    for managing the system, such as YaST and Zenwalk. The distro is well-maintained
    and supported, and has a large community of users and developers.


    # Well-balanced structure


    First-time impressions matter. The first time I booted into the new version of
    GeckooLinux, it had a new openSUSE installer. A minimal install is quite slow,
    but a full install is much faster. The installer is quite minimalistic, and the
    installation process is straightforward. Once installed, the desktop environment
    is very familiar to anyone who has used openSUSE before. The default desktop environment
    is KDE, and it works well. The system is stable and fast, and I had no issues
    at all. The only thing I didn''t like was the default font, but that''s an easy
    fix. Overall, I was impressed with the new version of GeckooLinux, and I think
    it''s a great choice for anyone looking for a stable and fast Linux distro.


    The new version of GeckooLinux is a great update. The installer is much faster
    and more stable, and the desktop environment is very familiar. The system is fast
    and stable, and I had no issues at all. The only thing I didn''t like was the
    default font, but that''s an easy fix. Overall, I was impressed with the new version
    of GeckooLinux, and I think it''s a great choice for anyone looking for a stable
    and fast Linux distro.


    # Verdict


    Whether you want a minimal install or a full desktop experience, GeckooLinux has
    you covered. The distro is well-maintained and supported, and has a large community
    of users and developers. If you''re looking for a stable and fast Linux distro,
    I highly recommend GeckooLinux.'
