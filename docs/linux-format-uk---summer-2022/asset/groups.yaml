  mdcn: "\n## 观点\n\n### 拥抱 Rust！\n\nJon Masters\n\n高级编辑\n\njon.masters@linux.com\n\
    \n@JonLMasters\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_9_0.png)\n\n去年，Ubuntu\
    \ 20.04 在 Linus Torvalds 看来是一个值得关注的新闻，对于 Scott Hanson 在本期《*Linux Journal*》专栏中的内容也是如此，更广泛地说，自\
    \ 2005 年以来更是如此，如果你想要更多观点，可以在这里找到 (https://lwn.net/Articles/813509/)。另一个值得注意的*开源安全*事件（LISA）是在今年，自\
    \ 2019 年以来一直采用线下形式。\n\n在今年 LISA 会议上备受关注的主题之一是加固 Linux 内核，这是自 2016 年 Meltdown 和\
    \ Spectre 攻击以来许多安全专业人士采取的方法。LWN 2020 年对加固 Linux 内核的努力进行了大量报道，我将在有机会时就此写更多内容。内核黑客和其他人中的一个重要主题是现在被称为\
    \ Rust 内核项目，这是一群正在为 Linux 内核构建 Rust 语言的人。你可能听说过 Rust，它已经受到许多注重安全人士的高度重视。这也是 LWN\
    \ 即将报道的主题。\n\n## 内核观察\n\n**Jon Masters** 总结了 Linux 内核的最新动态，以免你错过它们。\n\n我们简要介绍了最近发布的内核\
    \ 5.16，我相信我不需要在此重申细节——请查阅我*Linux 5.16: Pimp My Desktop* 和 *Cassandra* [本出版物 5\
    \ 月 5/15 日刊中的专栏] 获取完整详情。但简而言之，在 1.5 个月的时间内，我们看到了一些主要新功能出现，包括新的 `mount()` API 和新的辅助函数\
    \ `move_mount()`，以及对 `fsopen()` 函数的更新。我们没有看到 `io_uring` 的 40% 性能大幅提升，但我们确实看到了一些改进，甚至有了新功能，包括允许固定缓冲区的\
    \ `IO_FIXED_FBUF` 特性，以及允许异步执行 I/O 操作的 `IOSQE_ASYNC` 特性。我们还看到了 `io_uring` 子系统的改进，包括允许链接\
    \ I/O 操作的新 `IO_LINK` 特性，以及允许取消 I/O 操作的新 `IO_ASYNC_CANCEL` 特性。我们还看到了 `io_uring`\
    \ 子系统的改进，包括允许重新排队 I/O 事件的新 `IO_REEVENT` 特性，以及允许取消 I/O 操作的新 `IO_ASYNC_CANCEL` 特性。我们还看到了\
    \ `io_uring` 子系统的改进，包括允许链接 I/O 操作的新 `IO_LINK` 特性，以及允许取消 I/O 操作的新 `IO_ASYNC_CANCEL`\
    \ 特性。\n\n不幸的内核 Bug\n\n我们在 5.16 中确实发现并修复了一些不幸的内核 Bug，包括 `io_uring` 子系统中可能导致内核恐慌的\
    \ Bug，以及 `io_uring` 子系统中可能导致内核恐慌的 Bug。我们还看到了 `io_uring` 子系统的改进，包括允许链接 I/O 操作的新\
    \ `IO_LINK` 特性，以及允许取消 I/O 操作的新 `IO_ASYNC_CANCEL` 特性。\n\n内核的整体性能有所提升，我们在 `io_uring`\
    \ 子系统中也看到了一些改进，包括允许链接 I/O 操作的新 `IO_LINK` 特性，以及允许取消 I/O 操作的新 `IO_ASYNC_CANCEL`\
    \ 特性。我们还看到了 `io_uring` 子系统的改进，包括允许链接 I/O 操作的新 `IO_LINK` 特性，以及允许取消 I/O 操作的新 `IO_ASYNC_CANCEL`\
    \ 特性。\n\n我们还看到了 `io_uring` 子系统的改进，包括允许链接 I/O 操作的新 `IO_LINK` 特性，以及允许取消 I/O 操作的新\
    \ `IO_ASYNC_CANCEL` 特性。我们还看到了 `io_uring` 子系统的改进，包括允许链接 I/O 操作的新 `IO_LINK` 特性，以及允许取消\
    \ I/O 操作的新 `IO_ASYNC_CANCEL` 特性。\n\n### 持续开发\n\n内核 5.16 版本是一个不错的版本，我们期待下一个版本，即内核\
    \ 5.17。我们预计将在 `io_uring` 子系统中看到更多改进，包括允许链接 I/O 操作的新 `IO_LINK` 特性，以及允许取消 I/O 操作的新\
    \ `IO_ASYNC_CANCEL` 特性。我们还看到了 `io_uring` 子系统的改进，包括允许链接 I/O 操作的新 `IO_LINK` 特性，以及允许取消\
    \ I/O 操作的新 `IO_ASYNC_CANCEL` 特性。\n\n## 答案\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_10_0.png)\n\
    \n你对开源或内核有什么紧迫的问题？无论你想问什么，请发邮件至 bd@answers.futurelinux.com\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_10_1.png)\n\
    \n> **Neil**\n> 沃尔，34 岁\n> **Neil Wall 的问题**\n> 来自我们本季度的调查\n\n- **问题 8：你多大了？**\n\
    \  我最近更新了我的年龄，35 岁！\n\n- **问题 9：你在哪里工作？**\n  我是美国一家大型软件公司的程序员。我的公司专门从事金融行业的软件开发。\n\
    \n- **问题 10：你在工作中使用哪些语言？**\n  我使用 C++ 和 C。我完全不使用 Linux C++ 编译器。我使用 g++。自 95 年以来我都在使用\
    \ g++。自 95 年以来我都在使用 g++。自 95 年以来我都在使用 g++。自 95 年以来我都在使用 g++。\n\n- **答：** 最后四个问题涉及本专栏的主题。这些问题的答案如下：\n\
