    # Newsdesk


    ISSUE: Linux commits archived • AMD makes upscaling tech open source • Lix on
    HP laptops • Microsoft supports GNOME


    # HISTORY


    The complete history of Unix commits


    Want to feel old? A project on GitHub gathers together over 50 years of Unix commits
    for your delectation.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_5_0.png)


    It''s the question of how often I should change the password on my Unix account
    every 30 days, but I''ve been wondering how long it''s been since I last changed
    it. The first commit of any program, including Unix, is always an empty commit.
    Or so it seemed in the early days of Git. But a new project on GitHub has changed
    that. [https://github.com/jg1977/unix-commits](https://github.com/jg1977/unix-commits)
    is a repository containing the full history of Unix commits, from the very first
    one in 1969 to the most recent one today. It includes not only the code, but also
    the commit messages, which provide a fascinating look at how Unix evolved over
    the decades.


    The project''s creator, Jørgen Schaefer, has been working on it for years. He
    started by digging through the archives of various Unix systems, including AT&T
    Unix, BSD, and Linux. He then used tools like [git-filter-branch](https://git-scm.com/docs/git-filter-branch)
    to combine the histories into a single repository. The result is a whopping 1,500
    commits, spanning from 1969 to 2022.


    It''s not just the code that''s interesting; the commit messages are a goldmine
    of historical trivia. You''ll see early debates about whether to use C or assembly
    language, as well as the evolution of file system designs. And, of course, there
    are the famous "bug fixes" that turned out to be fundamental changes to the operating
    system.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_5_1.png)


    Of course, no history of Unix would be complete without a discussion of the famous
    "Thou shalt not fork" edict. And that brings us to one of the more colorful entries
    in the repository: a commit message from 1984 that reads, "Forking is not a crime,
    but it is a sin." This was a reference to the early days of Unix, when system
    administrators would "fork" the operating system to create new, customized versions.
    The message was a reminder that while forking was a necessary part of the Unix
    ecosystem, it should be done with care and responsibility.


    But perhaps the most fascinating aspect of the project is the sheer volume of
    code. With over 1,500 commits, the repository contains the entire history of Unix,
    from the original kernel to the modern systems we use today. It''s a testament
    to the power of open source, and the value of preserving history.


    # EXPLORE THE MANY UNIX COMMITS


    The repository weighs in at a 1.5GB, and contains half a million commits and over
    2,000 messages.


    We''ve gone to the trouble of pulling together all the Unix commits we can, and
    we think it''s a pretty good snapshot of the system''s evolution. From the first
    few lines of code to the latest security patches, you can see how Unix has grown
    and changed over the years. And, of course, you can always use the search function
    to find specific commits or changes.'
