    # 教程 霓虹像素LED灯


    ## WLED


    (code.arduino.cc/WLED)


    ### 使用多色LED创建灯光秀


    使用WLED固件和一条LED灯带，你可以创建引人注目的灯光秀，在家中展示，由Matthew Holder指导。


    ![](img/f20a68d91e56325c44e9a1405ca1923f_45_0.png)


    这里是WLED固件故事的开端。第一个版本发布于2016年。控制原始硬件LED套装的库是Adafruit库和Neopixel软件库。随着ESP8266和ESP32等微控制器板的发展，Arduino社区开始开发更好的框架。这种类型的LED通常被称为RGB
    LED。2017年，这种小型微控制器与ESP32模块一起开始用于多色LED的两个软件库（图1）。这些元件可以在所有不同的电子商务平台买到，它们的控制方式相同。我在一个大房间里安装了1735个LED。那个房间的LED尺寸和数量是1735个，对于ESP32板来说这是一个不错的数量。ESP32有27个GPIO引脚。总共，使用WLED固件，它可以控制最多27个独立的LED灯带。我想向你展示的WS2812B
    LED灯带，可以通过WS2812B驱动器来控制，该驱动器原本用于控制Adafruit Neopixel LED。这些是小型圆形LED，通常有红、绿、蓝三种颜色。ESP8266
    NodeMCU也可以控制LED灯带。


    ESP8266 NodeMCU是一款支持WiFi的板子。它可以通过一小段代码进行控制。我将向你展示如何使用NodeMCU配合WLED固件。NodeMCU有一个GPIO
    5引脚。这个引脚可以用于控制LED灯带上的WLED驱动器。NodeMCU有3.3V输出。这是NodeMCU可以提供的最大电压，用于LED灯带。LED灯带需要5V电源。你可以使用5V电源为LED灯带供电。NodeMCU也可以从5V电源获取电力。NodeMCU有一个GND引脚。这个引脚用于将LED灯带的GND引脚连接到NodeMCU的GND引脚。NodeMCU有一个TX引脚。这个引脚用于将LED灯带的TX引脚连接到NodeMCU的TX引脚。NodeMCU有一个RX引脚。这个引脚用于将LED灯带的RX引脚连接到NodeMCU的RX引脚。


