    # About Linux Format


    Linux Format is a monthly publication dedicated to helping new and experienced
    Linux users get the most out of their operating system. The latest issue, *Linux
    Format* issue 92, is available now from the Magazines and More app. You can find
    it on the [Magazines.com](https://www.magazines.com) website or the Magazines.com
    mobile app.


    The issue features a full-length tutorial on how to install Ubuntu 12.04, as well
    as a guide to the new Unity interface. There’s also a look at the latest version
    of the open-source desktop environment, KDE, and a guide to the new Plasma 5 desktop.
    The issue also features a tutorial on how to set up a secure online store, and
    a guide to the new version of the open-source web browser, Firefox.


    # WEB BROWSING DIFFICULTIES


    Unfortunately, webbrowsing is an area in which most versions of Linux are less
    than 100% compatible with the latest browser software. You’ll also need to have
    some sort of a browser installed, and it’s quite possible you’ll need to install
    a couple of additional plugins or libraries to get the most out of your browser.
    The most common browser is Firefox, which is available for all the major Linux
    distributions. It’s a good browser that works well on most systems, and it’s a
    good choice for most users. If you’re looking for a more lightweight browser,
