    \ 内存支持\n\n-   并非最强大的 Core i3\n\n**评分** 9/10\n\n**结论**：这是 Core i3 系列中性价比最高的产品。它支持\
    \ 8GB DDR4 和 64GB DDR4 内存，是那些需要一颗虽低调但能带来巨大性能提升的核心处理器的绝佳选择。\n\n## GeckooLinux Static\
    \ 153\n\nMichael Reed 深入审视了 GeckooLinux，这是一个拥有多种版本、为 openSUSE 增添亲和力的发行版。\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_20_0.png)\n\
    \n### 简介\n\nGeckooLinux 还拥有“好东西”——一套运行办公套件或进行编程所需的软件包。这些软件来自标准的 openSUSE 仓库。\n\
    \n### 简介\n\n版本的多样性使 GeckooLinux 显得如此特别。如果你不想进行从最小化到全功能的完整安装，你可以使用命令行安装一个最小系统（尽管没有通过命令行安装的选项）。你也可以使用\
    \ U 盘安装带有图形界面（GUI）的完整系统。\n\n### 规格\n\n-   CPU: AMD 12 核, 2.1GHz\n-   内存: 512MB\n\
    -   磁盘: 20GB\n-   构建基础: openSUSE 15.3\n-   来源: https://geckolinux.org\n-   评分:\
    \ 4/5\n\nGeckooLinux 基于 openSUSE 15.2 构建，适用于 x86 和 AMD64 平台，且运行无需任何特殊依赖。GeckooLinux\
    \ 是一个开源发行版，预装了许多软件包，旨在易于安装和使用。它附带标准的基于 openSUSE 的安装程序，可以从 U 盘或 DVD 安装。它还附带许多用于管理系统的有用工具，例如\
    \ YaST 和 Zenwalk。该发行版维护良好且得到支持，拥有庞大的用户和开发者社区。\n\n### 均衡的结构\n\n第一印象很重要。第一次启动新版\
    \ GeckooLinux 时，它使用了新的 openSUSE 安装程序。最小化安装速度较慢，但完整安装速度快得多。安装程序非常简洁，安装过程也很简单明了。安装完成后，桌面环境对于任何使用过\
    \ openSUSE 的人来说都非常熟悉。默认桌面环境是 KDE，运行良好。系统稳定且快速，我没有任何问题。唯一让我不太喜欢的是默认字体，但这很容易解决。总体而言，我对新版\
    \ GeckooLinux 印象深刻，我认为它是寻找稳定且快速的 Linux 发行版的人的绝佳选择。\n\n新版 GeckooLinux 是一次很棒的更新。安装程序更快更稳定，桌面环境非常熟悉。系统快速且稳定，我没有任何问题。唯一让我不太喜欢的是默认字体，但这很容易解决。总体而言，我对新版\
    \ GeckooLinux 印象深刻，我认为它是寻找稳定且快速的 Linux 发行版的人的绝佳选择。\n\n### 结论\n\n无论你需要最小化安装还是完整的桌面体验，GeckooLinux\
    \ 都能满足你。该发行版维护良好且得到支持，拥有庞大的用户和开发者社区。如果你在寻找一个稳定且快速的 Linux 发行版，我强烈推荐 GeckooLinux。\n\
    \n## 评测：Linux 发行版\n\n### MakuluLinux Shift\n\nMichael Reed 对 MakuluLinux 的视觉效果印象深刻，这是一个声称凭借众多预装组件实现了\
    \ `make ready` 的发行版。\n\n-   **简介**：MakuluLinux 是一个操作系统，也是一种思维方式。它是一个 Linux 操作系统，鼓励我们不要急于点击更新按钮，而是退后一步思考。这是一个不错的方法，但如果你不习惯，可能会带来有些笨重的体验。旁边有很多有用的软件下载，例如\
    \ Makulu Apps。\n\n-   **规格**：\n    -   处理器: AMD\n    -   架构: x86 64位\n    -  \
    \ 价格: 0 美元\n    -   操作系统: 基于 Debian\n    -   发行版: Makulu Linux 4.4.0\n    -  \
    \ 开发者: AMD\n\n虽然大多数知名发行版，如 Debian、Fedora、Ubuntu 或 OpenSUSE 乍看之下似乎有些相似，但如果你仔细观察，就会发现它们之间存在巨大分歧。例如，Debian\
    \ 不仅仅是 Debian。还有其他的基于 Debian 的发行版，包括那些附带其独特软件和自己独特外观的发行版。事实上，市面上有很多这样的基于 Debian\
    \ 的发行版，包括 Mint、Xubuntu、Kubuntu 等等。然而，其中脱颖而出的是 MakuluLinux，它基于 Debian，并带有其独特的外观和感觉。\n\
    \n但这不仅仅关乎外观。MakuluLinux 还带有其独特的软件，包括一个名为 `mak` 的软件包管理器和一个名为 `mshell` 的独特终端。这些只是\
    \ MakuluLinux 所提供诸多独特功能中的一小部分。\n\n因此，如果你在寻找一个拥有自己独特外观和感觉的基于 Debian 的发行版，MakuluLinux\
    \ 绝对值得一试。如果你在寻找一个附带独特软件的发行版，MakuluLinux 是最佳选择。\n\n如果你熟悉典型的 GUI 桌面，你会在 MakuluLinux\
    \ 上感到宾至如归，因为它的菜单系统的外观和工作方式与其他流行的桌面环境（如 Gnome 或 KDE）一样。它使用了轻量级的 Openbox 窗口管理器，这与流行的\
    \ Linux Mint Xfce 版本所使用的窗口管理器相同。\n\nMakulu 拥有超过 350 个软件包，而最新版本拥有 860,000 个软件包。这是一个巨大的数字，意味着该发行版附带最新版本的软件，包括\
    \ Firefox、LibreOffice 和 GIMP，均已安装并随时可用。\n\n该发行版本身非常容易使用，是 Linux 新手的不错选择。它附带图形化安装程序，安装非常容易。你需要做的只是选择一种语言和键盘布局，然后按照屏幕上的说明操作即可。\n\
