    # HOTPICKS


    # 09 CODE GENERATOR


    # Qrncode


    Version: 4.1.1

    Web: [https://makrshark.org/works/qrncode](https://makrshark.org/works/qrncode)


    Qrncode is a QR code generator that works even offline.


    QR codes are the 2D barcodes you''re likely to be well familiar with, but you
    may not realize they can be used for a lot more than just linking to websites.
    When these tiny black-and-white codes are created, a specific amount of data is
    encoded into it. This data can be used in a variety of ways, and it''s up to the
    device or app to determine what to do with it. Qrncode is a simple web app that
    lets you generate custom QR codes in your browser without sending any of the data
    to a server. It''s fast, easy, and the codes it generates are just as functional
    as any other. The only drawback is that the generated QR codes are limited to
    a certain number of characters, but for most uses, this is more than enough.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_85_0.png)


    One of the coolest things about Qrncode is its ability to generate QR codes without
    the need for a stable internet connection, as all the code that generates the
    codes is right there on the webpage. However, you can also use the QR code to
    share your location or a specific URL. If you''re looking for a simple, fast,
    and open-source tool to generate QR codes on the go, Qrncode is a perfect choice.
    It''s also worth noting that the app is a single HTML file that runs in your browser,
    making it easy to download and use offline.


    # TEXT EXPANDER


    # Espanso


    Version: 2.1.5-beta

    Web: [https://expanso.app](https://expanso.app)


    If you''re a heavy typist who finds themselves constantly typing out the same
    phrases, Espanso might just be the tool that saves you a lot of time and effort.
    It''s a text expander that works across all applications on your system, allowing
    you to create custom snippets that you can trigger with a simple keyword. The
    best part is that it''s open-source and actively maintained, so you can expect
    regular updates and improvements. Plus, the fact that it works on all major platforms
    (Windows, macOS, and Linux) makes it a great choice for developers who switch
    between operating systems.


    If you''re a developer who spends a lot of time in text editors or writing code,
    you''ll likely be familiar with the concept of code snippets. These are pre-defined
    blocks of code that you can insert with a single command. Well, Espanso is basically
    that, but for text and for everything. You can define any kind of snippet, from
    simple text to complex code, and even insert dynamic values like the current date
    and time. It''s a powerful tool that can save you a lot of time and effort, especially
    if you''re working on a project that requires a lot of repetitive text input.
    Plus, the fact that it''s open-source and actively maintained means that it''s
    constantly being improved and updated with new features.'
