    Rust has built-in support for concurrency and multi-threading. It uses the concept
    of threads. Each thread can run its own program. These threads can share memory,
    or they can be independent of each other. Rust''s memory model is strict, which
    means that the compiler will prevent you from making mistakes that could lead
    to data corruption.


    The standard library has a module called std::thread, which provides functions
    for creating and managing threads. The spawn function creates a new thread. You
