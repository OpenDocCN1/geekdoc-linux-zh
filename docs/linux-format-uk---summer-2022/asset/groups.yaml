    # X 标志着位置


    大多数 PC 用户都知道 Unix 的 X Window 系统（1996 年，这是我们接下来要讲的故事）。从 20 世纪 80 年代开始，X 服务于计算机。X
    是为工作站显示设计的。它被设计用于在任何环境中工作——无论是本地硬件还是远程服务器。X 的开发与许多早期的 Unix 窗口环境并行发展。X 与 Unix 有着非常长的历史，因此其窗口管理器一直是操作系统的一部分。很长一段时间内，没有为
    Microsoft Operating System（3.01，DOS 的早期版本）提供 X 服务器，因为 X 项目是 Unix 开发的一部分。


    随着 X 服务器获得更多支持，X 开发团队着手为 PC 制作 X 服务器。这是一项艰巨的任务。最终是 XFree86 在 1996 年使 X 在 PC 平台上可用。XFree86
    是 X11 的一个分支，X11 是 1994 年最新的 X 发行版。分支是在 1995 年进行的，XFree86 于 1996 年发布。要使 X 在 PC
    平台上可用，需要大量的工作。第一个版本的 XFree86 仅支持 SVGA 显示器。SVGA 是由多家制造商创建的高分辨率显示器标准。SVGA 显示器可以通过
