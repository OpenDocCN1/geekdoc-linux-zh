    - **LC_NUMERIC**: Defines the decimal separator and thousands separator used in
    number formatting. This locale also determines the grouping of digits into thousands.

    - **LC_TIME**: Defines the date and time formats used in date and time formatting.
    This locale also determines the names of the days of the week and months of the
    year.

    - **LC_MESSAGES**: Defines the language used in messages. This locale also determines
    the collation order used to sort strings.

    - **LC_COLLATE**: Defines the collation order used to sort strings. This locale
    also determines the class of characters that are used to sort strings.


    For localization, all applications should be compiled with gettext and the language
    should be determined by the LC_MESSAGES locale. This will allow the application
    to use the correct messages based on the language set in the locale.


    - **LC_PAPER**: Defines the paper size used for printing. This locale also determines
    the orientation of the printed page.

    - **LC_MONETARY**: Defines the currency used in monetary formatting. This locale
    also determines the symbol used for the currency.

    - **LC_NAME**: Defines the format used for names. This locale also determines
    the order of the first and last names.

    - **LC_ADDRESS**: Defines the format used for addresses. This locale also determines
