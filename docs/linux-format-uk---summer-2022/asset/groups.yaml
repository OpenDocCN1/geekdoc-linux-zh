    ## 教程 开源操作系统


    ## RISC OS


    作者：Richard Birt


    ### 重温经典的基于 ARM 的 RISC OS


    RISC OS 是一个具有迷人历史的操作系统，其历史可追溯至几十年前。Michael Reed 对其进行了审视


    ![](img/f20a68d91e56325c44e9a1405ca1923f_61_0.png)


    ![](img/f20a68d91e56325c44e9a1405ca1923f_61_1.png)


    早在 1987 年，RISC Computer Systems 制造了运行其称为 RISC 操作系统（ROS）的 40 位工作站。几年后，开发该系统的团队进行了重组，成立了
    Acorn，随后其继任者 Acorn RISC OS 成立。其中一些设计——例如，允许 255 个程序并行运行并可以单独保存或删除它们的内存管理单元——保留在当前的操作系统中。如果你不熟悉
    RISC OS 并希望了解更多关于其背景及相关人员的信息，请参阅“资源”部分中链接的在线文章 *From ARM to modern RISC: the history
    of RISC OS*（从 ARM 到现代 RISC：RISC OS 的历史）。这是一段迷人的历史，其中包含原始 40 位 RISC OS 机器的精美照片。原始操作系统是开源的，并运行在
    ARM 和 x86 处理器上。甚至可以使用 PiOS 模拟器在树莓派上运行它。


    ## 探索 RISC OS 界面


    ![](img/f20a68d91e56325c44e9a1405ca1923f_61_2.png)


    - 1. **工作区域** – RISC OS 的工作区域分为两组。工作区域是任务运行的区域，任务区域也是任务运行的区域。任务使用工作区域，程序使用任务区域。工作区域可以移动位置。

    - 2. **工具栏** – 主工具栏具有各种功能的按钮，其中一些按钮（如“关于”按钮）默认是隐藏的。

    - 3. **图标** – 图标用于表示文件、目录和应用程序。

    - 4. **任务菜单** – 这从任务栏打开。它允许你在正在运行的任务之间切换。主任务是拥有焦点的那个任务。

    - 5. **桌面背景** – 你可以使用“外观”设置更改桌面背景。

    - 6. **系统设置** – 这些设置从菜单访问，允许你配置系统的各个方面。

    - 7. **应用程序菜单** – 这从任务栏打开。它允许你启动应用程序。

    - 8. **用户界面** – 这允许你在桌面模式和窗口模式之间切换。

    - 9. **字体** – RISC OS 使用一系列字体，从标准字体到自定义字体。

    - 10. **颜色设置** – 这些允许你更改系统的颜色方案。

    - 11. **图标栏** – 这允许你添加图标到任务栏以便快速访问。

    - 12. **系统菜单** – 这允许你访问系统设置和实用工具。

    - 13. **帮助** – 这提供有关 RISC OS 及其功能的信息。

    - 14. **系统信息** – 这显示有关系统的信息，例如 RISC OS 的版本和内存量。


    它还包括 Recache 和 BRO，这是 RISC OS 的完整版本。RISC OS 5 正在树莓派和基于 ARM 的 PC（使用双启动镜像）上运行。因此，它可以在各种系统中运行。你甚至可以使用
    PiOS 模拟器在树莓派上运行它。


    ## 制作过程中


    RISC OS 运行在多种设备上，从基于 ARM 的板卡，到 Apple 设备，再到 x86 PC。它也适用于树莓派，这是世界上最受欢迎的单板计算机。RISC
    OS 是一个完整的操作系统，所以它不仅仅是一组应用程序，而是一个完整的环境。这是探索 RISC OS 世界的绝佳方式，也是探索整体计算世界的绝佳方式。


