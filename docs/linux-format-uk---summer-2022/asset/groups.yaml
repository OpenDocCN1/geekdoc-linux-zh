    我想当初我们接手 LXF 服务器购买 OVH 服务器时，Proxmox 离我最初的设计还相差甚远。而这个月到目前为止，我们越来越频繁地使用它来完成它的单一任务。本文讨论了\
    \ Proxmox 和 WireGuard，它们将构成我们未来所有服务器文章安全设置的重要组成部分。\n\nWireGuard 是一款现代、快速、高度安全且易于使用的工具，在这方面它与\
    \ OpenVPN 类似，但它内置于 Linux 内核中，因此配置简单得多。WireGuard 也更安全，这就是我们决定今后使用它的原因。它可用于 5.6\
    \ 及更高版本的内核发布。目前，我们使用的是 Debian bullseye 随附的内核，该内核已经是 5.10 版本。\n\nWireGuard 是 Jason\
    \ A. Donenfeld 的一个项目，其开发由 Netfilter 项目监督。WireGuard 是一种 very secure（非常安全）的 VPN，而我目前真正想要对\
    \ LXF 服务器做的唯一改变就是添加一个真正的防火墙。WireGuard 是一种非常安全、轻量且快速的 VPN，它是保护你互联网隐私的极佳工具。\n\n\
