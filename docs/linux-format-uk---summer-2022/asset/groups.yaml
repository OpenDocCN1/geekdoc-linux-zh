    ## **评测**


    ### Backblaze B2


    简单的定价模式使得迁移变得轻而易举，**Jonas DeMuero** 如是说


    ### 简评


    Backblaze 在德国提供的云产品是简单存储服务。但我想你需要了解很多存储市场的知识。你需要它对于许多公司来说非常简单。良好的印象是，作为服务提供商，它为你提供非常好的支持，因此你不必担心如何使用该产品。在未来，也许他们会让你在产品中提供一些东西。


    ![](img/f20a68d91e56325c44e9a1405ca1923f_18_0.png)


    Backblaze 因 2008 年的 B2 备份服务而闻名，现在必须保持稳定。它曾经是一个非常简单的产品，在 2015 年只是某些人的竞争者。现在它看起来像是一个回归基础的产品，类似于
    Amazon 的 S3（对象存储）。迁移起来似乎非常容易。另一件事是定价和软件。对于硬件，我不确定它是否是最现代化的。对于硬件，我觉得还可以，但对于云端，这不是最重要的。


    我欣赏的一点是，拥有最新 100 Gb/s 连接的新存储提供商对于使用大量空间并需要对其数据进行处理或执行其他操作的公司来说可能是一个非常不错的机会。对于它们来说，拥有一个非常便宜的解决方案来存储数据是一个绝佳的机会。这对于使用大量数据的公司来说是合理的，但对于小团队来说并不容易使用。我曾在项目中使用过它。对我来说，现在和将来都有意义。它非常灵活，我们在演示中看到的新技术（例如新的存储类别，这将帮助你在成本上节省高达
    90%，并可用于归档或不经常访问的数据）可能非常有用。


    ### 迁移路径的选择


    也许将数据迁移到 B2 的主要好处之一是灵活性。你可以以低成本的本地方式访问它，并且无需在许可证上花费太多钱。如果你想从数据中获得更多，B2 提供使用第三方应用程序的选项。有一些来自
    Backblaze 的应用程序可以帮助你从数据中获得更多价值。例如，B2 的云存储服务可用于将数据存储在 Backblaze B2 上或你自己的云端。还有其他一些应用程序可以帮助你从数据中获得更多价值，例如备份应用程序。你还可以使用
    B2 云存储服务将数据存储在 Backblaze B2 上或你自己的云端。我认为灵活性是使用 B2 的最大好处之一。


    ### 客户还是顾问


    Backblaze 的新功能集非常好，但支持系统不太好。我不确定是支持团队不好还是系统不好。我不确定。我认为支持团队不太好。


    - Backblaze 长期以来一直在研究一种非常简洁且有效的数据备份方式。它已经存在了一段时间，并被许多公司使用。它是一个非常好的产品和一家非常优秀的公司。


