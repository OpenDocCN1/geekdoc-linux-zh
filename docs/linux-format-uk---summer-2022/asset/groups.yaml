    \ 和 nvi。\n\n- **问题 13：你最喜欢的 Shell 是什么？**\n  bash。自我在大学学会使用以来，我一直都在使用 bash。我也使用过\
    \ tcsh 和 ksh。\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_10_2.png)\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_10_3.png)\n\
    \n- **答：** 我一直在努力弄清楚这个问题的根源。问题似乎在于内核没有正确处理应用程序分配的内存。这导致了内存泄漏，因此应用程序随时间推移使用的内存越来越多。我试图通过修改应用程序中的内存分配代码来解决这个问题，但尚未成功。我仍在处理中。\n\
