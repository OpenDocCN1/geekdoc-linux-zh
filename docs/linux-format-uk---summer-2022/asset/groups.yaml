    things using one or two of the Pi’s 40 GPIO pins, but what is it that we can do
    with them all? Well, there are many micro:bit and similar USB-based kits that
    have an expansion port for use with various accessories, and add-ons that are
    fairly accurate, including a temperature sensor, but we thought that adding a
    distance sensor to projects would be great. The result is a device that does just
    that, giving us an accurate, reliable and accurate distance measuring tool for
    the Pi. It also serves as a useful learning project for building an electronic
