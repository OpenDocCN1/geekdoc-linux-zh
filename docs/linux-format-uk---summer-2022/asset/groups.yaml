    > $voice.Speak($line)\n> ```\"\n\nWith this intro, I urge you to first establish\
    \ a new workflow, one that feels more like a conversation with the terminal, not\
    \ just a command line. This is where the shift from 'tool' to 'colleague' begins.\
    \ You can get started with the default keybindings, but I recommend building a\
    \ custom workflow that fits your brain. For example, instead of a default <kbd>⌘</kbd>+<kbd>Enter</kbd>,\
    \ you might want to map a command like **create_new_split** to <kbd>⌘</kbd>+<kbd>Alt</kbd>+<kbd>Shift</kbd>\
    \ + a specific key, or better yet, use a command palette (like <kbd>⌘</kbd>+<kbd>Space</kbd>)\
    \ to find and run any command without memorizing key combinations.\n\n# Build\
    \ up your muscle memory\n\nThe terminal is a tool, and like any tool, it takes\
    \ time, focus, and reps to master. Right now, you're just using it. Later, you'll\
    \ be *thinking with it*. The goal is to reach a state of flow where your hands\
    \ are ahead of your thoughts. You'll start a command with `git st` and before\
    \ you even think 'status', you've hit <kbd>Enter</kbd>. You'll type `./s` and\
    \ before you can say 'source', the dotfiles are loaded. This isn't about memorizing\
    \ keys; it's about building habits.\n\nSo, how do we build these habits? We break\
    \ them down into small, repeatable actions and drill them until they become automatic.\
    \ This is where **Tmux** comes in, but not just as a window manager. It's a *workflow\
    \ machine*. By creating and saving 'sessions', you can have a specific layout\
    \ for a project with all the right panes, logs, and servers ready to go. No more\
    \ copy-pasting the same commands or manually restoring your workspace after a\
    \ reboot. Your muscle memory isn't just in your hands; it's in your **setup**.\n\
    \nI've started a Tmux script that sets up my entire dev environment: two file\
    \ explorers (one for frontend, one for backend), a split pane for Git, a pane\
    \ for logs, and a pane for my primary code editor. When I open my terminal, I\
    \ just type `tmux new -s dev` and I'm in my world. It takes 2 seconds. It used\
    \ to take 10 minutes of setup. This is the difference between a *tool* and a *system*.\
    \ And it's just the start.\n\n# Let's play\n\nI find that I look for the winning\
    \ solution from the start. The trick is to not try to do everything at once. Pick\
    \ *one* of the tools above and master it completely. That's a whole month of work,\
    \ and it will change how you work forever.\n\n```\n```bash\n#!/bin/bash\n# A simple\
