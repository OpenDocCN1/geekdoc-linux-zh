    # # EasyOS 4.2


    **Michael Reed** *likes a Linux distribution that’s suitable for extremely limited
    hardware, and finds that it breaks with conventions in some areas.*


    ![](img/f20a68d91e56325c44e9a1405ca1923f_22_0.png)


    +   * IN BRIEF

    +     * EasyOS is a fully featured but tiny distro, running on an ISO in memory.

    +     * Based on a fork of Slackware 14.2.

    +     * Intended for older PCs.

    +     * No root or admin user, no sudo.

    +     * No automatic upgrades.

    +     * No systemd, but sysvinit.


    +   * SPECS

    +     * PROCESS

    +       * 32-bit

    +     * CPU

    +       * Pentium-class or higher

    +     * MEMORY

    +       * 128 MB (512 MB)

    +     * DISK

    +       * None


    *The EasyOS download includes a 350 MB ISO image and a 35 MB SFS (slax file system)
    file containing a 40 MB application called EasyGUI, which you''ll need to build
    the ISO. There''s also a 3 MB text file called EasyOS.4.2.txt and a 3 MB file
    containing two more optional SFS releases, EasyOS-4.2-extra.sfs and EasyOS-4.2-32.sfs.*


    EasyOS is a lightweight Linux distribution. In keeping with its small size (40
    MB), this distro can be used on a PC with as little as 128 MB of RAM (512 MB is
    better), and is ideal for laptops, older thin clients and desktops of any age.
    The loading of common legacy apps with the main program included is a plus. It''s
    also easy to use; the 4.2 format has changed slightly from 4.1, but it''s still
    pretty much the same as before, so I''ve only included a brief overview of the
    boot options and new tools in this review. The boot menu will appear quickly,
    with a list of the options, and you can change the default by using arrow keys.
    EasyOS runs fast, and there are few options, which makes it a good choice for
    a beginner or for a machine with limited resources.


    EasyOS is based on a fork of Slackware 14.2, but the main changes are in the installer
    and the boot process. There''s a new installer that allows you to install the
    system to a partition or USB stick, and a new boot loader that allows you to boot
    from a partition or USB stick. There''s also a new package manager that allows
    you to install packages from a repository. The new installer is easier to use
    than the old one, and the new boot loader is more reliable.


    The EasyOS 4.2 release includes a new desktop environment, called LXDE, which
    is based on the LXDE 1.0 release. The new desktop environment is more stable and
    reliable than the old one, and it includes a new taskbar and a new menu system.
    The new taskbar is easier to use than the old one, and the new menu system is
    more intuitive.


    The EasyOS 4.2 release also includes a new package manager, called Slackpkg, which
    is based on the Slackpkg 1.0 release. The new package manager is more stable and
    reliable than the old one, and it includes a new search function and a new update
    function. The new search function is easier to use than the old one, and the new
    update function is more efficient.


    The EasyOS 4.2 release also includes a new web browser, called Chromium, which
    is based on the Chromium 1.0 release. The new web browser is more stable and reliable
    than the old one, and it includes a new download manager and a new history manager.
    The new download manager is easier to use than the old one, and the new history
    manager is more efficient.


    Overall, the EasyOS 4.2 release is a significant improvement over the previous
    release. The new installer, boot loader, desktop environment, package manager,
    and web browser are all more stable and reliable than the old ones, and they are
    easier to use and more efficient. I recommend that you try out the EasyOS 4.2
    release if you are looking for a lightweight and easy-to-use Linux distribution.


    | VERDICT | 8 | 7 | 6 | 5 | 4 |

    |---|---|---|---|---|---|

    | DESIGN | 8 | | | | | |

    | STABILITY | 7 | | | | | |

    | APPLICATIONS | 6 | | | | | |

    | FEATURES | 7 | | | | | |


    *EasyOS is free to use and is available at as a 350 MB file, about 25 MB compressed.
    You can install it as a bootable USB stick or live CD. (Rating: 4 out of 5)*'
