    # 新闻台


    **本期焦点：** Linux 提交记录归档 • AMD 将超分辨率技术开源 • Lix 登陆 HP 笔记本 • 微软支持 GNOME


    ## 历史


    ### Unix 提交的完整历史


    想感受岁月的沧桑吗？GitHub 上的一个项目汇集了超过 50 年的 Unix 提交记录，供您细细品味。


    ![](img/f20a68d91e56325c44e9a1405ca1923f_5_0.png)


    关于每隔 30 天是否应该更改 Unix 账户密码的问题一直悬而未决，但我一直在想知道我上次改密码是在多久以前。任何程序的第一个提交，包括 Unix，通常都是空提交。至少在
    Git 发展的早期是这样。但 GitHub 上一个新项目改变了这一点。[https://github.com/jg1977/unix-commits](https://github.com/jg1977/unix-commits)
    是一个包含 Unix 完整提交历史的代码仓库，从 1969 年的第一个提交到今天最新的一个。它不仅包含代码，还包含提交信息，这些提交信息提供了一个引人入胜的视角，让我们得以窥见
    Unix 在这几十年间的演变。


    该项目的创建者 Jørgen Schaefer 已经为此工作了好几年。他首先深入挖掘了各种 Unix 系统的档案，包括 AT&T Unix、BSD 和 Linux。然后他使用了诸如
    [git-filter-branch](https://git-scm.com/docs/git-filter-branch) 等工具将这些历史记录合并到一个代码仓库中。结果是一个包含
    1,500 个提交的庞大仓库，时间跨度从 1969 年到 2022 年。


    有趣的不仅仅是代码；提交信息更是历史趣闻的宝库。你会看到早期关于是使用 C 语言还是汇编语言的辩论，以及文件系统设计的演变。当然，还有许多著名的“Bug 修复”，结果证明它们其实是对操作系统进行的根本性变更。


    ![](img/f20a68d91e56325c44e9a1405ca1923f_5_1.png)


    当然，如果不讨论那句著名的“汝不得 Fork”（Thou shalt not fork）戒律，Unix 的历史就不完整。这让我们联想到代码仓库中一个更富色彩的条目：一条来自
    1984 年的提交信息，写着：“Fork 不是罪，但它是过犯。”这是对 Unix 早期历史的引用，当时系统管理员会“Fork”操作系统以创建新的、定制化的版本。这条信息提醒我们，虽然
    Fork 是 Unix 生态系统必要的一部分，但它应该谨慎且负责任地进行。


    但也许该项目最迷人的方面是其庞大的代码量。包含超过 1,500 个提交的代码仓库涵盖了 Unix 的完整历史，从最初的内核到我们今天使用的现代系统。这是开源力量的一种证明，也是保存历史的价值所在。


    ### 探索众多的 Unix 提交


    该代码仓库大小为 1.5GB，包含 50 万个提交和超过 2,000 条消息。


    我们费了一番功夫，收集了所有能找到的 Unix 提交，我们认为这是系统演变的一个相当不错的快照。从最初几行代码到最新的安全补丁，你可以看到 Unix 是如何随时间增长和变化的。当然，你随时可以使用搜索功能来查找特定的提交或更改。


    ## 游戏


    ### AMD FidelityFX 超级分辨率开源


    AMD 的性能增强型超分辨率技术现以 2.0 版本开源。


    AMD 的 FidelityFX Super Resolution (FSR) 已成为其开源 AMD VLIW GPU 架构的重要组成部分，允许开发者将其与该公司的其他软件和开源驱动程序一起使用。现在到了
    2.0 版本，FidelityFX 超级分辨率 (FSR) 已完全开源，允许开发者将其与该公司的其他软件和开源驱动程序结合使用。尽管之前的版本是专有的，但新的
    FSR 2.0 发布是使这项技术对社区更具可及性的重大一步，鼓励创新，并可能带来更广泛的 GPU 范围内性能和兼容性的提升。


    - FSR 1.0 在超分辨率和锐化方面有限。

    - FSR 2.0 增加了一个帧生成器。

    - FSR 2.0 现在开源。

    - 超分辨率不同于超分辨率算法。

    - AMD 正在开发 FSR 3.0。


    ![](img/f20a68d91e56325c44e9a1405ca1923f_6_0.png)


    ## 笔记本电脑


    ### HP 推出 Linux 笔记本


    HP Dev One 预装了 Linux Pop!_OS。


    HP Dev One 是 HP 最新预装 Linux 的笔记本电脑，运行基于 Ubuntu 的发行版 Pop!_OS。该笔记本电脑配备 Intel Core
    i5 处理器、8GB 内存和 256GB SSD，使其成为偏好 Linux 环境的开发者的坚实机器。这是 HP 迎合开发者社区的一项重大举措。


    ## 观点


    ### 在瓦尔哈拉见！


    Kiyoshi Kawasaki


    Valhalla 的游戏版本发布了。这是一件大事，社区因新特性而激动不已，这些特性旨在将玩家重新带回游戏。新游戏预计将于 2023 年底发布，社区正急切地等待其发布。


