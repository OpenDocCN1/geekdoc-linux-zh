  mdcn: "\n## 教程\n\n**计算机音乐教程**\n\n### 极简主义者的功能丰富音乐播放器\n\n简单、优雅、实用和纯粹的乐趣，这些特质都可以用来描述\
    \ Shashank Sharma。这些也是他在应用程序中最看重的特性。\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_55_0.png)\n\
    \n**我们的专家**\nShashank Sharma\nShashank 是孟买大学的计算机科学毕业生，喜欢在空闲时间编程和折腾。他擅长在空闲时间制作音乐。\n\
    \n无论是新晋还是资深乐迷，在面对软件时都会感到困惑。对于刚刚发现音乐作为一种艺术形式的人来说，播放器的数量之多可能会让人望而却步。市面上的播放器种类繁多，功能各异，能力也参差不齐。本教程中的播放器大多功能丰富，这是一把双刃剑。它可能赋予你以从未知晓的方式创作和播放音乐的自由，但同时也可能需要花费大量时间去学习。本教程中的播放器大多轻量且易用。它们也是免费且开源的，这是一个加分项。让我们开始吧。\n\
    \n**安装**\n\n最简单的安装方法是通过包管理器。打开终端并输入 `sudo apt-get install cmus`。它将安装 CMUS 的最新版本。若要安装特定版本，请在命令中添加版本号。`sudo\
    \ apt-get install cmus=0.8.9-1` 将安装 0.8.9 版本。若要安装最新版本，可以使用 `sudo apt-get install\
    \ cmus`。更多选项请访问 [CMUS 官网](http://www.cmus.dev)。\n\n### ▶ 入门\n\n在下一部分，我们将熟悉以下几个音乐应用。\n\
    \n### » 增强 CMUS\n\n大多数 Linux 用户会发现 CMUS 是一个出色的播放器。它是一个轻量级且功能强大的 MP3 播放器，还支持通过互联网流媒体播放。它也可用于网络版，并可用作桌面端\
    \ CMUS 的遥控器。如果你正在寻找一个能在智能手机上运行的轻量级音乐播放器，请查看 CMUS。它是一个支持 MP3、OGG、FLAC 和其他格式的轻量级音乐播放器。它还支持遥控功能，允许你从智能手机控制音乐播放器。该应用支持\
    \ Android 和 iOS 设备。\n\n对于 Flux 播放器，我们将使用 MP3、OGG、WAV、FLAC 等格式。Flux 是一个轻量级且功能强大的音乐播放器，支持\
    \ MP3、OGG、WAV、FLAC 和其他格式。它还支持遥控功能，允许你从智能手机控制音乐播放器。该应用支持 Android 和 iOS 设备。我们将使用该播放器演示遥控功能。要使用遥控功能，你需要一部安装了\
    \ Flux 应用的智能手机。你可以从 Play Store 或 App Store 下载该应用。安装好应用后，你就可以通过该应用连接到桌面的 CMUS。然后，你可以从智能手机控制你的音乐播放器。\n\
    \n你也可以使用内置的合成器创作自己的音乐。为此，你需要一个 MIDI 设备。你可以使用 MIDI 键盘或 MIDI 控制器。你也可以将智能手机作为 MIDI\
    \ 设备使用。为此，你需要在智能手机上安装一个 MIDI 应用。你可以从 Play Store 或 App Store 下载该应用。安装好应用后，你就可以通过该应用连接到桌面的\
    \ CMUS。然后，你可以使用内置合成器创作自己的音乐。\n\n## 整理终端，使其感觉像第二块屏幕\n\n| 键盘快捷键 | 功能 |\n| :--- |\
    \ :--- |\n| <kbd>⌘</kbd> + <kbd>Space</kbd> | 打开/关闭命令面板 |\n| <kbd>⌘</kbd> + <kbd>K</kbd>\
    \ | 清除历史（在窗格中） |\n| <kbd>⌘</kbd> + <kbd>W</kbd> | 关闭窗格 |\n| <kbd>⌘</kbd> + <kbd>Enter</kbd>\
    \ | 在当前终端创建新标签页 |\n| <kbd>⌘</kbd> + <kbd>Shift</kbd> | 聚焦新窗口 |\n| <kbd>⌘</kbd>\
    \ + <kbd>N</kbd> | 复制当前标签页 |\n| <kbd>⌘</kbd> + <kbd>Shift</kbd> | 切换禅模式（隐藏所有元素）\
    \ |\n\n> “快速提示\n> \n> 为了获得真正无缝的跨平台文本转语音体验，请使用以下命令：\n> \n> 在 macOS 上：\n> \n> ```bash\n\
    > say -o myvoice.aiff -v Samantha \"Hello World\"\n> ```\n> \n> 在 Windows 上 (Powershell)：\n\
    > \n> ```powershell\n> $line = \"Hello World\" | ConvertTo-TextToSpeech\n> Add-Type\
    \ -AssemblyName System.Speech\n> $voice = [System.Speech.Synthesis.SpeechSynthesizer]::new()\n\
    > $voice.Speak($line)\n> ```”\n\n通过这段引言，我敦促你首先建立一种新的工作流，一种更像与终端对话而非仅仅使用命令行的感觉。这是从“工具”转变为“同事”的起点。你可以从默认键绑定开始，但我建议你构建一个适合你大脑习惯的自定义工作流。例如，与其使用默认的\
    \ <kbd>⌘</kbd>+<kbd>Enter</kbd>，你可能想要将 **create_new_split** 这样的命令映射到 <kbd>⌘</kbd>+<kbd>Alt</kbd>+<kbd>Shift</kbd>\
    \ + 一个特定按键，或者更好的是，使用命令面板（如 <kbd>⌘</kbd>+<kbd>Space</kbd>）来查找并运行任何命令，而无需记忆按键组合。\n\
    \n### 培养肌肉记忆\n\n终端是一个工具，和任何工具一样，掌握它需要时间、专注和反复练习。目前，你只是在使用它。后来，你将*用它思考*。目标是达到一种心流状态，让你的手先于你的思想行动。你会以\
    \ `git st` 开始一条命令，在你甚至还没想到 \"status\" 之前，你就按下了 <kbd>Enter</kbd>。你会输入 `./s`，在你还没说完\
    \ \"source\" 之前，点文件已经加载完毕。这不是关于记忆按键；这是关于建立习惯。\n\n那么，我们如何建立这些习惯？我们将它们分解为小的、可重复的动作，并反复练习直到它们变成自动反应。这就是\
    \ **Tmux** 的用武之地，但不仅仅是作为一个窗口管理器。它是一台*工作流机器*。通过创建和保存“会话”，你可以为某个项目拥有一个特定的布局，包含所有正确的窗格、日志和服务器，随时待命。再也不用粘贴相同的命令或在重启后手动恢复工作区了。你的肌肉记忆不仅存在于你的手中；它存在于你的**设置**中。\n\
    \n我启动了一个 Tmux 脚本来设置我的整个开发环境：两个文件浏览器（一个用于前端，一个用于后端），一个用于 Git 的分屏窗格，一个用于日志的窗格，以及一个用于主要代码编辑器的窗格。当我打开终端时，我只需输入\
    \ `tmux new -s dev`，我就进入了我的世界。这只需要 2 秒钟。过去这需要 10 分钟的设置。这就是*工具*与*系统*之间的区别。而这仅仅是个开始。\n\
    \n### 让我们玩起来\n\n我发现我一开始就在寻找制胜方案。诀窍在于不要试图一次性做完所有事情。挑选*上面提到的一个*工具并完全掌握它。这是一个月的工程量，它将永远改变你的工作方式。\n\
    \n```bash\n#!/bin/bash\n# A simple script to start my dev environment\necho \"\
    Starting dev environment...\"\n\ntmux new-session -d -s dev -c ~/projects/frontend\n\
