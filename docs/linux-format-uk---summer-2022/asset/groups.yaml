    你可以将任何 S3F83C26155 或 S3F83C26156（或类似型号）连接到右侧的开关上。该开关可用于打开或关闭显示屏。它还可以用于改变显示屏的颜色。这是一种节省时间并让你的项目顺利运行的绝佳方式。你还可以保存自己的预设，从而打造独特的视觉效果。这是一种节省时间并让你的项目顺利运行的绝佳方式。


    因此，Nixieplex 的 0.24W 实际上是非常低的功耗。它可以由小电池甚至太阳能电池供电。这使其非常便携且易于使用。它们可以连接到 Nixieplex
