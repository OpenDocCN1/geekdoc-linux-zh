    如果你的系统不需要 3D 加速，你仍然可以使用显卡进行 2D 加速。这对于没有专用 GPU 但仍希望拥有快速 2D 图形性能的系统很有用。


    - **amdgpu** – AMD GPU

    - **nvidia** – Nvidia GPU

    - **intel** – Intel GPU

    - **vmware** – VMware GPU

    - **virtualbox** – VirtualBox GPU

    - **vfio** – VFIO GPU

    - **qemu** – QEMU GPU

    - **gen** – 通用 GPU


    这些 GPU 的驱动程序在内核主线中可用。唯一的例外是 Nvidia 驱动程序，它未包含在内核主线中。你可以使用外部的 nvidia 模块或 nouveau
    驱动程序用于 Nvidia GPU。


    ```console

    echo ''nvidia'' >> /etc/modprobe.d/blacklist.conf

    echo ''nouveau'' >> /etc/modprobe.d/blacklist.conf

    reboot

    ```


    你可以通过运行 `lspci -v | grep -i ''Kernel driver in use:''` 来检查正在使用哪个驱动程序。这将显示每张 GPU
    正在使用的驱动程序。如果驱动程序不是你想要的，你可以使用 `modprobe` 命令加载正确的驱动程序。


    ## 英伟达的改变


    近年来，驱动程序的情况发生了巨大变化。Nvidia 已开始为其 GPU 发布开源驱动程序。这与过去 Nvidia 以发布专有驱动程序著称的情况截然不同。新的开源驱动程序称为“NVIDIA
    Open Driver”，可从 Nvidia 网站下载。


    ```console

    # Nvidia GPU''s

    modprobe nvidia

    modprobe nvidia-modeset

    modprobe nvidia-drm

    modprobe nvidia-peermem


    # AMD GPU''s

    modprobe amdgpu

    modprobe amdkcl

    modprobe amd_overdrive

    ```


