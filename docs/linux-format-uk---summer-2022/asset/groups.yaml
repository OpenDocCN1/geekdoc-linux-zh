  md: "\n## OPINION\n\n### GO RUST!\n\nJon Masters\n\nSenior Editor\n\njon.masters@linux.com\n\
    \n@JonLMasters\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_9_0.png)\n\nLast year,\
    \ Ubuntu 20.04 was a head-up for news in Linus Torvalds’ view, for Scott Hanson’s\
    \ *Linux Journal* column in this issue, and more generally since the 2005, and\
    \ if you want more thoughts that can be found here (https://lwn.net/Articles/813509/).\
    \ The other notable *Open Source Security* event (LISA) was this year, and it\
    \ has been in-person since 2019.\n\nAmong the topics that got lots of attention\
    \ at this year’s LISA was the topic of harden the Linux kernel, an approach many\
    \ security professionals are taking since the 2016 Meltdown and Spectre attacks.\
    \ There was a lot of coverage of the efforts to harden the Linux kernel from the\
    \ LWN 2020, and I’m going to write more on that when I have the opportunity. A\
    \ big topic among the kernel hackers and others is what is now called the Rust\
    \ kernel project, which is a group of people working on building a Rust language\
    \ for the Linux kernel. You may have heard of Rust, which has become quite popular\
    \ among security-minded folks. This is also a topic LWN will be covering soon.\n\
    \n## Kernel Watch\n\n**Jon Masters** summarises the latest happenings in the Linux\
    \ kernel, so that you can’t miss them.\n\nWe briefly introduced the recently released\
    \ kernel 5.16, and I’m sure I don’t need to rehash the details here—see my *Linux\
    \ 5.16: Pimp My Desktop* and *Cassandra* [columns in the May 5/15 issue of this\
    \ publication] for the full details. But in brief, in a 1.5-month period we saw\
    \ the arrival of some major new features, including the new `mount()` API and\
    \ new helper `move_mount()` functions, as well as updates to the `fsopen()` function.\
    \ And we didn’t see the big 40% performance improvement with `io_uring`, we did\
    \ see some improvements, and we even had new features, including the `IO_FIXED_FBUF`\
    \ feature that allows for the pinning of buffers, and we had the `IOSQE_ASYNC`\
    \ feature which allows for asynchronous execution of I/O operations. We also saw\
    \ improvements to the `io_uring` subsystem, including the new `IO_LINK` feature\
    \ that allows for the linking of I/O operations, and the new `IO_ASYNC_CANCEL`\
    \ feature that allows for the cancellation of I/O operations. And we saw improvements\
    \ to the `io_uring` subsystem, including the new `IO_REEVENT` feature that allows\
    \ for the re-queuing of I/O events, and the new `IO_ASYNC_CANCEL` feature that\
    \ allows for the cancellation of I/O operations. And we saw improvements to the\
    \ `io_uring` subsystem, including the new `IO_LINK` feature that allows for the\
    \ linking of I/O operations, and the new `IO_ASYNC_CANCEL` feature that allows\
    \ for the cancellation of I/O operations.\n\nAn unfortunate kernel bug\n\nWe did\
    \ have some unfortunate kernel bugs that were found and fixed in 5.16, including\
    \ a bug in the `io_uring` subsystem that could cause a kernel panic, and a bug\
    \ in the `io_uring` subsystem that could cause a kernel panic. And we saw improvements\
