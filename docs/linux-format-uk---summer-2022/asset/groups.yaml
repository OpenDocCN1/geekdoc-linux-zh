    ![](img/f20a68d91e56325c44e9a1405ca1923f_2_2.png)


    # » MEET THE TEAM


    This issue we’re diving into the kernel’s graphic stack. We asked our curriers
    if there’s an array of games (and open source) technology that they’ve fallen
    down a rabbit hole while investigating?


    ![](img/f20a68d91e56325c44e9a1405ca1923f_2_3.png)


    **John Norris**


    It’s nice to finally meet a few of my Linux friends here in 2024, with both the
    new and old. And I’ve been working on a project, it is the Linux desktop project
    which I hope will be a success. I want to help build a better world with the tools
    we have. See you next time!


    ![](img/f20a68d91e56325c44e9a1405ca1923f_2_4.png)


    **Martyn Hurrell**


    My hobby is the realm of nostalgia; whether it’s a retro PC, 8-bit homebrew or
    vintage tech. I can’t wait to share the world of PVE/PC gaming (and its legacy)
    with you. I hope my column inspires a few to start their own journey into the
    past.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_2_5.png)


    **Lisa Pearson**


    I’m from the North West of England, I enjoy a lot of time outdoors, exploring
    local caves or just taking a walk by a river. I’m also a keen home baker. When
    I’m not cooking I’m making cakes.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_2_6.png)


    **Mikel Ward**


    Mikel Ward is our new Linux expert. With over 15 years of experience, Mikel is
    excited to bring his passion for Linux to the page and share it with you. He’s
    a huge fan of the terminal and all things CLI.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_2_7.png)


    **Miqyael Czarova**


    Miqyael Czarova is our community and news editor. She’s excited to bring you the
    latest from the Linux world. From kernel updates to new distros, Miqyael will
    keep you in the know.


    # New world order!


    It can be said today that Linux users are making quite a comeback. For the first
    time since its inception in 1991, it seems the world is finally warming up to
    it. The reason is simple: Linux is more secure and stable than its competitors.
    And the system that powers most of the web is finally getting the respect it deserves.
    While the Microsoft ecosystem still holds the lion’s share of the desktop market,
    Linux is gaining ground in data centres, mobile, and the cloud. The rise of ARM-based
    devices, such as the Raspberry Pi and various smartphones, is also playing a major
    role in the Linux renaissance.


    And it’s not just about the server or mobile markets. There’s a growing movement
    of Linux users in the desktop space, with distros like Ubuntu, Fedora, and Arch
    gaining popularity among developers and enthusiasts. The open-source community
    is thriving, with new projects and innovations emerging all the time. From AI
    to the metaverse, Linux is at the heart of many of the most exciting technological
    advancements.


    Meanwhile, on the enterprise front, Linux has become the go-to operating system
    for cloud computing and big data analytics. Companies like Google, Amazon, and
    Facebook all rely on Linux to power their infrastructure. And with the rise of
    containerisation and microservices, Linux is becoming more important than ever.
    Whether you’re a developer, sysadmin, or just a tech enthusiast, now is a good
    time to be a Linux user.


    Speaking of the future, we can expect to see even more innovation in the Linux
    world. From quantum computing to the Internet of Things (IoT), Linux will play
    a key role in shaping the next generation of technology. So whether you’re a seasoned
    Linux user or just starting out, there’s never been a better time to dive into
    the world of open-source computing.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_2_8.png)


    Neil Smith

    NEWS MANAGER, LINUXFORMAT.COM


    ![](img/f20a68d91e56325c44e9a1405ca1923f_2_9.png)


