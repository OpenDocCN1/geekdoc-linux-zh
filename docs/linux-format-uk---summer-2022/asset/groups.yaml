  md: "\n## TUTORIALS\n\n**Computer Music Tutorials**\n\n### Feature-rich music players\
    \ for minimalists\n\nSimplicity, elegance, usefulness and sheer fun are all qualities\
    \ that describe Shashank Sharma. These are also the features he values most in\
    \ applications.\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_55_0.png)\n\n**OUR\
    \ EXPERT**\nShashank Sharma\nShashank is a computer science graduate from University\
    \ of Mumbai who enjoys programming and tinkering in his free time. He has a knack\
    \ for making music in his free time.\n\nMusic lovers, both new and old, are in\
    \ a quandary when it comes to software. For those who have just discovered music\
    \ as an art form, the sheer volume of players can be quite overwhelming. The ones\
    \ on the market are so many and diverse, and so is their capability. The players\
    \ in this tutorial are mostly feature-rich, which is a double-edged sword. It\
    \ may give you the freedom to create and play music in ways you didn't know were\
    \ possible, but it may also take a lot of time to learn. The players in this tutorial\
    \ are mostly lightweight and easy to use. They are also free and open-source,\
    \ which is a plus. Let's get started.\n\n**Installation**\n\nThe easiest method\
    \ to install is via the package manager. Open a terminal and enter `sudo apt-get\
    \ install cmus`. It will install the latest version of CMUS. To install a specific\
    \ version, add the version number to the command. `sudo apt-get install cmus=0.8.9-1`\
    \ will install version 0.8.9. To install the latest version, you can use `sudo\
    \ apt-get install cmus`. For more options, visit the [CMUS Website](http://www.cmus.dev).\n\
    \n### ▶ GETTING STARTED\n\nIn the next section, we shall be familiarising ourselves\
    \ with the following music apps.\n\n### » ENHANCING CMUS\n\nThe majority of Linux\
    \ users will find CMUS a great player. It is a lightweight and powerful MP3 player\
    \ that can also support streaming over the internet. It is also available for\
    \ the web, and can be used as a remote control for your desktop CMUS. If you are\
    \ looking for a lightweight music player that works on your smartphone, check\
    \ out CMUS. It is a lightweight music player that supports MP3, OGG, FLAC, and\
    \ other formats. It also supports remote control, which allows you to control\
    \ your music player from your smartphone. It is available for both Android and\
    \ iOS devices.\n\nFor the Flux player we will use MP3, OGG, WAV, FLAC, and others.\
    \ Flux is a lightweight and powerful music player that supports MP3, OGG, WAV,\
    \ FLAC, and other formats. It also supports remote control, which allows you to\
    \ control your music player from your smartphone. It is available for both Android\
    \ and iOS devices. We will use this player to demo the remote control feature.\
    \ To use the remote control feature, you will need to have a smartphone with the\
    \ Flux app installed. You can download the app from the Play Store or the App\
    \ Store. Once you have the app installed, you can connect to your desktop CMUS\
    \ using the app. You can then control your music player from your smartphone.\n\
    \nYou can also create your own music by using the built-in synthesizer. To do\
    \ this, you need to have a MIDI device. You can use a MIDI keyboard or a MIDI\
    \ controller. You can also use your smartphone as a MIDI device. To do this, you\
    \ need to have a MIDI app installed on your smartphone. You can download the app\
    \ from the Play Store or the App Store. Once you have the app installed, you can\
    \ connect to your desktop CMUS using the app. You can then create your own music\
    \ using the built-in synthesizer.\n\n## Rationalize the terminal and make it feel\
    \ like a second screen\n\n| Keyboard shortcut | Function |\n| :--- | :--- |\n\
    | <kbd>⌘</kbd> + <kbd>Space</kbd> | Open / close command palette |\n| <kbd>⌘</kbd>\
    \ + <kbd>K</kbd> | Clear history (in a pane) |\n| <kbd>⌘</kbd> + <kbd>W</kbd>\
    \ | Close a pane |\n| <kbd>⌘</kbd> + <kbd>Enter</kbd> | Create new tab in current\
    \ terminal |\n| <kbd>⌘</kbd> + <kbd>Shift</kbd> | Focus new window |\n| <kbd>⌘</kbd>\
    \ + <kbd>N</kbd> | Duplicate current tab |\n| <kbd>⌘</kbd> + <kbd>Shift</kbd>\
    \ | Toggle zen mode (hide everything) |\n\n> \"QUICK TIP\n> \n> For a truly seamless\
    \ text-to-speech experience across platforms, use the following commands:\n> \n\
    > On macOS:\n> \n> ```bash\n> say -o myvoice.aiff -v Samantha \"Hello World\"\n\
    > ```\n> \n> On Windows (Powershell):\n> \n> ```powershell\n> $line = \"Hello\
    \ World\" | ConvertTo-TextToSpeech\n> Add-Type -AssemblyName System.Speech\n>\
    \ $voice = [System.Speech.Synthesis.SpeechSynthesizer]::new()\n> $voice.Speak($line)\n\
    > ```\"\n\nWith this intro, I urge you to first establish a new workflow, one\
    \ that feels more like a conversation with the terminal, not just a command line.\
    \ This is where the shift from 'tool' to 'colleague' begins. You can get started\
    \ with the default keybindings, but I recommend building a custom workflow that\
    \ fits your brain. For example, instead of a default <kbd>⌘</kbd>+<kbd>Enter</kbd>,\
    \ you might want to map a command like **create_new_split** to <kbd>⌘</kbd>+<kbd>Alt</kbd>+<kbd>Shift</kbd>\
    \ + a specific key, or better yet, use a command palette (like <kbd>⌘</kbd>+<kbd>Space</kbd>)\
    \ to find and run any command without memorizing key combinations.\n\n### Build\
    \ up your muscle memory\n\nThe terminal is a tool, and like any tool, it takes\
    \ time, focus, and reps to master. Right now, you're just using it. Later, you'll\
    \ be *thinking with it*. The goal is to reach a state of flow where your hands\
    \ are ahead of your thoughts. You'll start a command with `git st` and before\
    \ you even think 'status', you've hit <kbd>Enter</kbd>. You'll type `./s` and\
    \ before you can say 'source', the dotfiles are loaded. This isn't about memorizing\
    \ keys; it's about building habits.\n\nSo, how do we build these habits? We break\
    \ them down into small, repeatable actions and drill them until they become automatic.\
    \ This is where **Tmux** comes in, but not just as a window manager. It's a *workflow\
    \ machine*. By creating and saving 'sessions', you can have a specific layout\
    \ for a project with all the right panes, logs, and servers ready to go. No more\
    \ copy-pasting the same commands or manually restoring your workspace after a\
    \ reboot. Your muscle memory isn't just in your hands; it's in your **setup**.\n\
    \nI've started a Tmux script that sets up my entire dev environment: two file\
    \ explorers (one for frontend, one for backend), a split pane for Git, a pane\
    \ for logs, and a pane for my primary code editor. When I open my terminal, I\
    \ just type `tmux new -s dev` and I'm in my world. It takes 2 seconds. It used\
    \ to take 10 minutes of setup. This is the difference between a *tool* and a *system*.\
    \ And it's just the start.\n\n### Let's play\n\nI find that I look for the winning\
    \ solution from the start. The trick is to not try to do everything at once. Pick\
    \ *one* of the tools above and master it completely. That's a whole month of work,\
    \ and it will change how you work forever.\n\n```bash\n#!/bin/bash\n# A simple\
    \ script to start my dev environment\necho \"Starting dev environment...\"\n\n\
    tmux new-session -d -s dev -c ~/projects/frontend\n# Add a pane for backend logs\n\
    tmux split-window -h -c ~/projects/backend\n# Add a pane for git commands\ntmux\
    \ split-window -v -c ~/projects/frontend\n# Add a pane for my code editor (e.g.,\
    \ Neovim)\ntmux split-window -h -c ~/projects/frontend\necho \"Dev environment\
    \ ready!\"\ntmux attach-session -t dev\n```\n\n**To ENHANCE YOUR TERMINAL-FU Subscribe\
    \ now! `btk.io/LinuxForumHut`**\n\n## TUTORIALS Edit photos\n\n### PHOTOFLARE\n\
    *An in-depth review by Nick Peers*\n\n#### Enhance your photos quickly and easily\n\
    *Nick Peers tracks down an image editor that strikes the right balance of features\
    \ and user-friendliness for making quick fixes to an edit.*\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_57_0.png)\n\
    \n-   **Our verdict:** \"There's no better free photo editing software on Windows\
    \ than PhotoFlare, with it combining powerful editing options with a wonderfully\
    \ friendly user interface.\"\n-   **What we liked:** Great ease of use.\n-   **What\
    \ we disliked:** Some of the advanced functions can take a while to get to grips\
    \ with.\n-   **Price:** Free\n\n**We're all tinkerers when it comes to** the software\
    \ we use, so it's a little ironic that we're also tinkerers at the photo editing\
    \ end too. Of course there are a great many photo editing apps to choose from,\
    \ and some are quite a big task to learn how to use. The same can be said of the\
    \ platforms you'll need to install them on. We've looked at a few different options\
