    ## 指南


    ### 更改位置


    `/dev/hda2` 分区是我们 `/dev/hdb` 的根分区。启动后，它会被挂载，并且根设备为 `/dev/hdb`。挂载表（也称为文件表）将显示所有已挂载的文件系统。对于
    `/dev/hdb` 根文件系统，你可以在 `/etc/fstab` 中看到它。要手动挂载或卸载文件系统，请使用 `mount` 和 `umount` 命令。为了在新的根设备上创建一个新的文件系统，你需要运行
    `mkfs` 命令（对于创建 ext3 文件系统，你运行的是 `mkfs.ext3` 命令）。要卸载文件系统，只需使用 `umount` 命令即可。请记住，区分挂载点和设备名称很重要。


    > **快速提示**

    > `df` 命令会告诉你系统中挂载了哪些内容。


    ### 挂载文件系统之后


    文件系统准备就绪后，你可以添加一个新用户（就像你使用 `useradd` 添加用户一样，然后你可以使用 `passwd` 为该用户设置密码）。现在你可以安装程序了。安装软件包有两种方式：

    - 使用 `apt-get`（或其他发行版中等效的软件安装程序）

    - 手动下载二进制文件并安装


    ### 准备就绪


    现在是重要部分。拥有 Linux 的整个原因，是为了能够随心所欲地使用电脑，而不仅仅是按出厂设置那样使用。Linux 可以做这么多事情，我无法在此一一列举。你可以通过安装显示管理器和窗口管理器来创建一个完整的桌面环境。你可以安装音频、视频和图形驱动程序。你甚至可以刻录
    CD 和 DVD。可能性是无限的。只需开始安装软件，你就会惊讶于自己能做什么。


    ### 建立连接


    为确保你的网络准备就绪，你可以在系统上运行 `ifconfig` 命令。如果你已安装网络软件，你会看到你的网卡被列出（例如，`eth0`）。你也可以使用 `ip`
    命令检查你的 IP 地址。要测试你的连接，你可以使用 `ping` 命令检查网络上的主机。要检查你的连接状态，可以使用 `netstat` 命令。`netstat`
    命令显示关于你的网络接口、路由表和其他网络统计信息的信息。


