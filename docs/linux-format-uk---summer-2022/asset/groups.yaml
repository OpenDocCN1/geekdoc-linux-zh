    ## SAVE TIME BY BATCH PROCESSING IMAGES


    ### 1 Select Files and export format

    Choose from Adobe Photoshop and the native Tiff. To select a file you want to
    batch process, use a file selection dialog. If the default settings are fine,
    click Next to skip a step.


    For advanced settings, click Options (1) to open the File Handling and Naming
    dialog. In the Source panel, click Save Copies to a Folder (2) and then select
    an output folder. The selected files can be saved in a variety of formats. In
    the File Naming box, type the base name to be used for the renamed files (3) and
    check Use Photoshop Settings (4) to save any color space settings. Click OK.


    ### 2 Choose your resize options

    Click on the second step in the dialog box shown at the top. When batch-processing,
    you can only select one size for the images in a folder.


    Under Image Size select Resample images using (1). Use Resampling to determine
    your image size (2) and to add or remove pixels to achieve the desired size. Then
    select the output file format (3) and where to place the images after the batch.


    ### 3 Adjust levels and transform

    You can also add a level adjustment before saving an image. Use Levels to create
    contrast.


    To open Levels, click on the Levels icon (2). In the Levels dialog box, make the
    changes to your image and save to apply the changes to your batch images.


    To add a Transform effect to your batch images, click on the Edit icon (3) and
    choose the rotation or scaling you require. The changes will be applied to the
    image in the batch.


    ### 4 Pick files and process

    Once the settings have been saved, it’s time to pick the files you want to batch
    process. When you’ve selected the folder containing your files, click Start (1).
    This will process the batch and create your new files.


    Once your images have been batch-processed, you can use them for your web or print
    projects. Use the output files in the folder you specified and you’re ready to
    go.


    Photoshop has a batch processing function that lets you automate tasks such as
    resizing, adjusting levels, and saving files in different formats. This is particularly
    useful when you have a large number of images to process. To use this feature,
    you can use the Actions panel to record a series of steps, and then apply them
    to a batch of files.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_60_1.png)


    Photoshop has a feature called Actions that allows you to automate repetitive
    tasks. You can record a sequence of steps, such as resizing, adjusting levels,
    and saving files in a specific format, and then apply that action to a batch of
    files. This is particularly useful when you have a large number of images to process.
    To use this feature, open the Actions panel (Window > Actions) and click the record
    button. Perform the steps you want to automate, and then stop recording. You can
    then apply the action to a batch of files by using File > Automate > Batch.


