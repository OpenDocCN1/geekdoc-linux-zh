  mdcn: "\n## 编码学院：控制俄罗斯方块\n\n|  | 其他 | |  | self.color |\n|---|---|---|---|---|\n\
    |  | **other** | **color** | **new** | **self.color** |\n|  | 红色 | 蓝色 | 绿色 | 红色\
    \ |\n\nPyCharm 编辑器是一款出色的工具，其界面和设置能为基于网格的问题提供一些有用的提示。PyCharm 内置的另一个实用功能，也是其他编辑器中常见的，就是调试器。\n\
    \n### 网格与数据结构\n无论是查看矩阵数据、三维数组（三个坐标，三个数字）、三维世界还是数组的数组，在数据结构中它们的核心都是网格！本杂志中的示例侧重于二维（数组、列表、嵌套列表），但同样的基本概念也可以应用于三维数组。参见本期的示例。\n\
    \n如果你正在使用 PyCharm，可以尝试一个有用的功能：内置的调试器。在菜单中，选择 *调试* > *调试*。它会提示你选择一个配置 – 选择 *脚本*\
    \ 并输入主 Python 文件的名称。然后像往常一样在代码中设置一些断点。要设置断点，将鼠标放在你要调查的行上，然后点击左键 – 文本上会画出一条虚线。调试器会运行直到遇到断点。然后你可以使用代码窗口下方的控件逐步通过调试器，以了解代码中发生的事情。\n\
    \n### 聚焦于类\n既然我们可以控制单个方块，那么每次创建一个方块，作为一个单独的对象，将会更好。因此，我们希望有独立的对象来表示每次的一个方块。在这个例子中，四格骨牌实际上是一个由四个方块组成的集合。但是，将方块作为一个对象似乎更有效，这样我们就不必考虑不同类型的方块。这就是我们要关注的对象。\n\
    \n下面的类有一个构造函数，`__init__` 方法，它接受颜色和一个组成四格骨牌的方块列表。每个方块都有 x、y 位置（方块是一个边长=1 的正方形）。每个方块存储自己的\
    \ x 和 y。\n\n```python\nclass Piece:\n  def __init__(self, color, blocks):\n  \
    \  self.blocks = []\n    for b in blocks:\n      x, y = b\n      self.blocks.append([x,\
    \ y, color])\n```\n\n- 图块对象可以拥有的其他一些方法：移动、旋转、检查碰撞\n\n移动方法允许图块在二维空间中移动。旋转方法允许图块围绕某点旋转。通过检查当前方块是否将与墙壁或地面碰撞来检测碰撞。\n\
    \n在构造函数（特殊方法 `__init__`）中，接受颜色和一个由组成该对象的四个方块组成的列表。在构造函数中，我们将 self.color 设置为 color，将\
    \ self.blocks 设置为四个 x/y 值的列表。\n\n- 下落\n- 考虑图块在二维空间中的移动\n\n在本文中，我们不关注旋转，但如果你想实现这一点，你需要查看这四个方块并更改\
    \ x/y 值。\n\n如你所见，我们可以使用类来创建单一的数据片段，然后使用它来制作多个图块。这使代码具有更模块化和易读的结构。\n\n在本期中，我们将学习如何用\
    \ Python 制作一个简单的俄罗斯方块游戏。到这里结束时，你将拥有一个可以玩的游戏。你将有很多机会改进游戏 – 你可以添加音乐、最高分、不同关卡等。挑战由你来决定！\n\
    \n![](img/f20a68d91e56325c44e9a1405ca1923f_95_0.png)\n\n所以，在这一期中，我们通过使用数据结构（二维数组）和一些面向对象编程，成功地控制了俄罗斯方块游戏的每个元素。\n\
    \n## 控制：字母 编码 学院\n\n为了让游戏电脑运行起来，我们正在修改这个 Linux 内核，它饱受我们曾梦想过的所有 bug 的困扰。让它正常工作的唯一方法就是通过**内核模块**的魔法。内核模块是可以加载到系统上的一段代码。它被编译成一个小的目标文件，然后你将其加载到运行中的系统上。它就像一块拼图的碎片，可以嵌入到你正在运行的内核中。\n\
    \n那么，是什么让游戏电脑变得出色？对我来说，是它的响应感觉。有两种主要方法可以调整内核以使其按你期望的方式工作：更改调度器，或更改计时。\n\n第一个是**调度器**，它管理处理器如何分配\
    \ CPU 周期。默认的 Linux 调度器还不错，但对于游戏，我们希望它知道哪些进程是重要的，哪些可以等待。第二个是**计时**，它控制系统如何保持时间。\n\
    \n## 一句话概括的 5 OPP\n\n与我们一起构建的每一个分支、主句、段落都是一个**内核模块**。这是一个独立的代码片段。如果你查看我们的 GitHub\
    \ 仓库，你会看到所有东西。组成游戏的有六个主要组件：\n\n- 图块\n- 棋盘\n- AI\n- 用户界面\n- 游戏循环\n- 输入\n\n这些每一个都是单独的内核模块。它们协同工作以制作游戏。它们也都是**可重入的**，意味着它们可以在任何时候加载和卸载。这对开发很重要，因为你可以单独测试每个部分。例如，你可以测试\
    \ AI 与用户的对战，或者在没有 AI 的情况下测试棋盘。\n\n```bash\nsudo modprobe -r kernel_module\nsudo\
    \ modprobe kernel_module\n```\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_96_0.png)\n\
    \n> 它快吗？\n> \n> 如果你是一个谜题爱好者，这将是一种让你保持敏捷思维的乐趣方式。这是对编码语言知识的真正考验。\n> \n> 免费做吧！\n\n\
