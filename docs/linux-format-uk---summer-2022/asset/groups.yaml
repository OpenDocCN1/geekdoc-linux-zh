    \n# 编程学院 多线程代码\n\n![](img/f20a68d91e56325c44e9a1405ca1923f_91_0.png)\n\n**快速提示**\n\
    \n**通过提供自己的锁来鼓励新组件或模块线程安全。** 例如，如果你正在构建一个与全局对象交互的新控件，你应该始终使用该全局对象的锁来确保线程安全。\n\n\
    **全局对象的一部分可能是易失的（volatile）。** 如果对象是易失的，线程在访问该特定部分时必须使用锁。左栏底部的示例展示了如何使用 `pthread_mutex_lock`\
    \ 和 `pthread_mutex_unlock` 函数来创建锁。\n\n```c\nvoid myFunction()\n{\n    pthread_mutex_lock(&myLock);\n\
    \    // Access global variable\n    globalVariable = 100;\n    pthread_mutex_unlock(&myLock);\n\
    }\n```\n\n**pthread_join()** 在线程的启动信号通过 `pthread_create()` 的第二个参数发出后，你使用此函数等待线程结束。**请注意，如果线程已经结束，`pthread_join()`\
    \ 将立即返回。**\n\n- **pthread_t** 是线程 ID 的类型定义\n- **pthread_create()** 是创建新线程的函数，其参数为：\n\
    \    - `pthread_t` 用于新创建线程的线程 ID\n    - 属性，通常设置为 `NULL`\n    - 函数指针，即在新线程中执行的函数\n\
    \    - 参数，传递给该函数\n- **pthread_join()** 是阻塞线程直到另一个线程终止的函数\n\n**互斥锁（Mutexes）**\n\
    \n一旦有两个线程访问同一个全局资源，就存在发生竞态条件的危险，即它们同时尝试访问该资源。这时，`pthread_mutex_lock()` 的第二个参数和\
    \ `pthread_mutex_unlock()` 的第三个参数变得非常重要。这些用于防止竞态条件，并确保一次只有一个线程访问资源。\n\n**消息通道（Message\
    \ channels）**\n\n线程可用于通过消息通道发送异步通信消息。这可用于进程间通信，例如服务器和客户端之间，或进程内的线程间通信。消息通道实现为队列，消息添加到末尾并从开头移除。\n\
    \n```c\nvoid messageChannel(int* queue, int* readIndex, int* writeIndex, int*\
    \ size)\n{\n    // Implementation details\n}\n```\n\n**此代码没有使用任何互斥锁** – 很有可能全局资源会被多个线程同时访问。这是一种竞态条件，很有可能导致你的程序出现\
    \ bug。在编写多线程代码时，务必牢记这一点。\n\n**信号量（Semaphores）**\n\n信号量是比互斥锁更通用的线程同步机制。它们可用于限制能够同时访问共享资源的线程数量。当你拥有有限数量的资源时（例如数据库连接），这非常有用。\n\
    \n**条件变量（Condition variables）**\n\n条件变量用于等待特定条件变为真。它们通常与互斥锁一起使用，以同步对共享资源的访问。线程可以等待条件变量，并在条件变为真时唤醒。\n\
    \n**死锁（Deadlocks）**\n\n死锁是一种情况，两个或更多线程在等待由其他线程持有的资源时无限期阻塞。如果线程以不同顺序获取锁，就可能发生这种情况。通过仔细设计代码来避免死锁至关重要。\n\
    \n"
