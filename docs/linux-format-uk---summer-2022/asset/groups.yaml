    \ 2-Account for movement of the piece in 2-D\n\nIn this article, we are not concerned\
    \ with rotation, but if you want to implement this, you will need to look at the\
    \ four blocks and change the x/y values.\n\nAs you can see, we can use a class\
    \ to create a single piece of data, and then use that to make multiple pieces.\
    \ That gives a more modular and readable structure to the code.\n\nIn this issue,\
    \ we take a look at making a simple Tetris game in Python. By the end of this,\
    \ you will have a working game that you can play. There will be plenty of opportunities\
