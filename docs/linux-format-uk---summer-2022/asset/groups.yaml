    # **Development maturity**


    To evaluate these packages we need to know how far along each project is.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_29_0.png)


    If you''re not in the know about where these packages stand, some software is
    coming to the head of development. This includes our new package in this issue
    of RunBumpD. In a wider, game-development context we can still be somewhat confident.
    What''s an early-stage product, in terms of its development status? Well, I suppose
    an early-stage product could be any product which has barely left the stage of
    the concept design phase. For instance, you can tell which software is in the
    early stage of development, even if its documentation and API are not up to scratch.
    It''s still early enough not to have a proper name, and it''s still very early
    into the development cycle.


    In contrast, we can consider open-source projects like Blender, or even the Unity
    engine. While Unity is also not yet a complete product, it''s been in development
    for a long time now and is close to being feature-complete. There are also packages
    that are still in development, but the developers know exactly what the product
    will be and where it is headed, and are just working toward their goal. This is
    where RunBumpD comes in: it''s like a news feed, but it''s more of a magazine-style
    overview of the most promising software packages that you can use to build interactive
    experiences. These projects are not necessarily in the early stages of development,
    but they are in the process of being created. So, for example, they may not have
    a proper name, or the documentation may not be up to scratch, but the concept
    is clear and the development is active.


    # **Making live presentations**


