    ## 关键帧版本


    为了了解如何创建关键帧电影，你需要从查找一些示例开始。我见过很多似乎使用 Kdenlive 和 Krita 来完成任务的情况，但这对我来说并不是真的可行。如果你想制作自己的，Kdenlive
    视频编辑器是一个不错的起点，因为它可以完成所有必需的步骤，包括关键帧动画。只是它在使用 Blender 2.8 及其新界面时效果不佳。


