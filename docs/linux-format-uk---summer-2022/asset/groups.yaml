    \ 40 针排针，也可以将其连接到第 15 针（GPIO 22）和第 17 针（GPIO 27）。\n\nHC-SR04 使用与 HC-SR04 相同的布线，因此布线完全相同。\n\
    \n现在你准备好连接传感器并让你的项目开始工作了。让我们开始吧！\n\n## 软件设置\n\n我们需要为树莓派上的超声波传感器安装一些软件包，因此让我们一次性安装它们。我们将使用\
    \ RPI.GPIO 库来控制 GPIO，并使用之前安装好的 Python 解释器运行主代码。与大多数项目一样，我们将使用 Python 3.5+ 解释器和\
    \ pip3 实用工具来安装第三方 Python 包。\n\nC/C++ 传感器 - 如果你更擅长 C 或 C++ 编程，有一个出色的 C++ 驱动可用 [1]，它最多支持三个\
    \ HC-SR04 传感器。该驱动还包含一个示例程序，使用 ASCII 条显示传感器距离，因此对于本项目来说，无需使用我们稍后将介绍的图形库。\n\n##\
    \ 项目代码\n\n下一步是编写一些 Python 代码来整合所有组件并控制它们。我们从 GPIO 设置代码开始，这与我们在第 88 期中看到的一样。如果你想更详细地了解我们的实现方式，RPi.GPIO\
    \ 参考手册对我们使用的所有函数和类都有完整描述。\n\n```python\nimport RPi.GPIO as GPIO\n\nclass Ultrasonic:\n\
    \  def __init__(self, trig, echo, debug=False):\n    self.trig = trig\n    self.echo\
    \ = echo\n    self.debug = debug\n    GPIO.setup(self.trig, GPIO.OUT, initial=GPIO.LOW)\n\
    \    GPIO.setup(self.echo, GPIO.IN, initial=GPIO.LOW)\n```\n\n代码的主要部分处理我们需要应对的两个主要状态：等待结果和等待向传感器发送脉冲。等待状态使用\
    \ `time.time()` 函数获取当前时间（以秒为单位），并将其存储在 `self.t0` 变量中。当脉冲发送时，`self.t1` 变量被设置为当前时间。这两个值之间的差值就是脉冲传播到物体并返回所需的时间。众所周知，我们可以通过将总时间除以声速（343\
    \ 米/秒）来计算距离。\n\n```python\ndef wait_for_result(self):\n  start = time.time()\n\
    \  self.t0 = time.time()\n  while GPIO.input(self.echo) == False:\n    self.t0\
    \ = time.time()\n    if (time.time() - self.t0) > 0.03:\n      print('ERROR -\
    \ no echo detected')\n      return None\n  self.t1 = time.time()\n  return self.t1\
    \ - self.t0\n```\n\n最后，我们有程序的主循环，它连续读取传感器的距离并将其显示在 LED 上。LED 显示由 10 个 LED 组成，每个\
    \ LED 代表 10 厘米的范围（因此总范围为 100 厘米）。LED 根据传感器返回的距离进行控制，通过开启和关闭来控制。我们设置了一个循环，每次读数之间等待\
    \ 0.2 秒，以便在 LED 上获得平滑的更新速率。如果你想显示到物体的距离，可以在 `while True:` 循环内添加以下行。\n\n```python\n\
    print('Distance:', distance, 'cm')\n```\n\n## 传感设置与显示\n\n如果你想显示到物体的距离，可以在 `while\
    \ True:` 循环内添加以下行。\n\n## 传感器工作原理概述\n\n在我们查看几种不同类型的传感器之前，让我们先思考一下我们所说的“传感器”到底意味着什么。“传感器”一词来自拉丁语\
    \ *sensus*，意为“感知”或“体验”。因此，基本上，传感器是任何可用于检测或测量周围环境中某些物理属性变化的设备，例如温度、压力、光、湿度或距离。\n\
    \n作为基本规则，传感器被设计用于检测周围环境中物理属性的变化，并将这种变化转换为某种可测量电量的变化。传感器通常是无源器件（它们不产生自己的电力），并且结构通常相当简单。最简单的传感器可能只是一根线，当物体经过时它会加热，例如。更复杂的传感器可能是几个不同组件协同工作的组合。\n\
    \n例如，红外运动传感器（PIR）通常由一个热释电传感器（检测红外辐射变化）和一个放大电路组成，该电路将传感器的输出转换为可用于触发警报或开启灯光的数字信号。热释电传感器基于这样一个事实：许多晶体在温度变化时会产生电荷。这些晶体被称为热释电材料，一个常见的例子是铌酸锂。当红外辐射源（如人或温物体）移动通过热释电传感器的视野时，会导致温度变化，从而在传感器中产生小电荷。然后该电荷被放大并用于触发电路的输出。\n\
    \n| 属性 | 数值 |\n| :--- | :--- |\n| 最大范围 | 5米 |\n| 视场角 | 90° |\n| 响应时间 | 150毫秒 |\n\
    | 频率 | 40kHz |\n| 传感器 | HC-SR04 |\n\n## 传感器工作原理概述\n\n我们内置了许多传感器，其中包括距离传感器。众所周知，我们的传感器被设计用于检测温度、压力、湿度和距离的变化。因此，距离传感器通过测量超声波脉冲传播到物体并返回所需的时间来工作。然后使用该时间计算到物体的距离。公式为：\n\
    \n*距离 = (声速 × 时间) / 2*\n\n其中空气中的声速在 20°C 时为 343 米/秒。我们除以 2 的原因是脉冲传播到物体并返回，因此总时间包括脉冲往返的时间。\n\
    \n如前所述，我们提供了一个常见超声波传感器及其特性的表格。这应帮助你为项目选择合适的传感器。例如，HC-SR04 是一款流行、便宜且易于使用的传感器，其范围可达\
    \ 4 米。它是基础项目的好选择，但如果你需要更长的范围或更高的精度，你可能需要考虑更先进的传感器。\n"
