    按下微控制器时，将通过按钮直接充电（适用于 70V / 3.0 LED 灯带）；或者使用电位器分压器（适用于 5V LED 灯带；尽管我们尚不确定是否需要一个额外的电阻（即串联两个电阻而不是一个），以便我们在电位器分压器上进行测试。我们尝试过
    12V 电位器分压器；但我们的 5V LED 烧毁了，因此 LED 需要额定电压为 12V（即对于 LED 需额定为 12V：对于 5V LED，你需要一个
