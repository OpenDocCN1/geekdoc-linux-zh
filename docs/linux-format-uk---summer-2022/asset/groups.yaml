    - 1 个 5V 稳压器 IC\n- 1 根跳线\n- 1 个 5V DC-DC 适配器\n- 1 个 JST 插头连接器\n- 1 个 4 针公头排针\n\
    \nJST 插头对于连接到 40 针排针非常方便，但你也可以使用 40 针排针的第 23 针（GPIO 13）或第 19 针（GPIO 15）。HC-SR04\
