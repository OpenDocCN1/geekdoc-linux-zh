    +   1. **Main toolbar:** This is the main toolbar, which contains all the tools
    you need to edit your images. It''s a bit of a beast, so we recommend taking some
    time to explore it.

    +   2. **File menu:** You can access the File menu from here, which allows you
    to open and save images, as well as access the print and export options.

    +   3. **Photos:** Use this area to manage the images you have open. You can drag
    and drop images into this area, or use the File menu to open them.

    +   4. **Display:** You can use the display options to change the size of the
    image, or to fit it to the window.

