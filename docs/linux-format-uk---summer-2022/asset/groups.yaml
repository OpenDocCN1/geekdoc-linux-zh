    - **AMD CrossFireX**：这是一种多 GPU 技术，允许两张或多张 AMD 显卡协同工作以提高性能。

    - **Intel HD 图形**：这是内置于 Intel 处理器中的集成显卡。


    # 缩写的积累


    现代显卡是拥有数千个晶体管的小型时钟，它们并行工作，使显卡能够执行远超其原始意图（驱动显示器）的复杂计算任务。卡上的晶体管越多，它能执行的任务就越复杂，而任务越复杂，它就越需要利用
    CPU 来卸载。CPU 时间很昂贵，因此显卡在使用 CPU 时必须非常高效。这就是为什么单个卡可以拥有多个核心，以及为什么单个核心可以拥有多个线程。卡能使用的线程越多，它就能并行执行更多的任务。这就是为什么单个卡可以拥有多个核心，以及为什么单个核心可以拥有多个线程。卡能使用的线程越多，它就能并行执行更多的任务。


