  - "[PAGE 93]\n\n# CODING ACADEMY Controlling Tetris\n\n# PYTHON\n\nCode gamepad\
    \ support with Python\n\n# ## Adding gamepad support to Tetris\n\n**Andrew Smith**\
    \ likes nothing better than fitting oddly shaped blocks into oddly shaped holes,\
    \ and a gamepad makes that much easier. He's on hand to show you why\n\nTHE month\
    \ is young but as a bit of a get-rid-of-oddly-shaped-blocks game, Tetris will\
    \ do the job nicely. We'll see you next month at your usual time on the other\
    \ side of the world, but as the holiday rush is on the horizon we had to move\
    \ our news round-up earlier in the week. But before you get to our 104th issue\
    \ of Tetris, we'll add a bit more gamepad support to Tetris.\n\nBefore getting\
    \ started, we should briefly explain to those unfamiliar with Linux that you can\
    \ plug your gamepad into a USB port, run `sudo dmesg | grep -i gamepad` (or just\
    \ run `ls /dev/input` to list input devices) and you should see `/dev/input/js0`\
    \ (or similar) in the output. That's your gamepad! If you don't see it, your gamepad\
    \ might be using a non-standard protocol (like X-Input), or your device isn't\
    \ supported. In the latter case you might need a proprietary driver, or to use\
    \ a different gamepad. (The game's not supported on most Linux distros, but the\
    \ generic X-Input support is built into the kernel. You can find more info at\
    \ http://www.kernel.org/doc/Documentation/input/gamepad.txt. Note that X-Input\
    \ gamepads aren't always detected as such - the generic X-Input protocol works\
    \ for most things). Anyway, let's move on.\n\n+   OUR EXPERT\n+   **Andrew Smith**\
    \ is a developer with a keen interest in Linux games. He has written a book, *Beginning\
    \ 2D and 3D Gaming in Python* (Packt Publishing, 2007), and is working on a follow-up.\
    \ He is the author of several books on Linux and Python, including *Learning Game\
    \ Development in Python* (No Starch Press, 2014).\n\nAs a first step we can install\
    \ a small Python library called `pygame` which provides a handy wrapper for SDL.\
    \ You can install it using your package manager (on Ubuntu: `sudo apt-get install\
    \ python-pygame`), or pip (`sudo pip install pygame`), or by downloading it from\
    \ the official site (http://pygame.org). Once installed, you can access gamepads\
    \ via the `pygame.joystick` module (a handy shortcut for this is `pygame.joystick`).\n\
    \nAs a second step, we need to modify the `setup.py` file in the `tetris` package\
    \ we created last month. We need to add the `pygame` module to the `install_requires`\
    \ list. This will make pip install `pygame` automatically for us when we install\
    \ `tetris`.\n\n### Installation and setup\n\nFor the moment, we're going to be\
    \ installing `pygame` globally - this is a great way to get started, but we can\
    \ look at how to set up a Python virtual environment to keep things more organised\
    \ later. If you're not familiar with Python packaging, now is a great time to\
    \ dip your toes into the waters - check out http://packages.python.org and the\
    \ following guide on pip (http://httpizza.com). Let's get started.\n\n```\n```\n\
    $ pip install pygame\n```\n\nIf you're on a 32-bit machine, try installing it\
    \ like this:\n\n```\n$ pip install pygame==1.9.2a6\n```\n\nThis specific version\
    \ is compatible with the 32-bit machine. You can verify this by running:\n\n```\n\
    $ python -c \"import pygame; print(pygame.ver)\"\n```\n\nIf it prints a version\
    \ number, you're good. If not, you may need to install the 32-bit libraries manually.\n\
    ```\n\n> **TIP**\n> *Tip: to test if your gamepad works, run `sudo dmesg | grep\
    \ -i gamepad` when you plug it in. You should see a line like `input: 2axis 4button\
    \ gamepad as /devices/...` or similar. You can also check if it's showing up in\
    \ `jstest-gtk` (a graphical joystick tester). If you don't see it there, you likely\
    \ have a problem.*\n\n```\nFinally, once we've got `pygame` installed, we need\
    \ to modify the `tetris` source code to actually use it. We need to add some import\
    \ statements at the top of our `tetris.py` file:\n\n```python\nimport pygame\n\
    from pygame.locals import *\n```\n\nWe also need to modify the `__init__` function\
    \ to initialise the joystick module:\n\n```python\ndef __init__(self, display):\n\
    \    pygame.init()\n    self.display = display\n    pygame.joystick.init()\n \
    \   self.joystick = pygame.joystick.Joystick(0)\n```\n\nThis code initialises\
    \ the first available joystick. If you have multiple gamepads, you can use `pygame.joystick.get_count()`\
    \ to find out how many there are, and use the appropriate index in the `Joystick`\
    \ constructor.\n```"
