    # X marks the spot


    Most PC users know the X Window system of Unix (1996, a story that we look at
    next). Starting in the 1980s, X serves computers. X was designed for workstation
    display. It is designed to work in any environment — whether local hardware or
    remote servers. X’s development went hand-in-hand with many of the early Unix
