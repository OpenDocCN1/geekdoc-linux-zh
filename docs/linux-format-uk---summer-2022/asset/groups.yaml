    \n对于端口，许多包为一个主机或打印机，这可能更合理。但要小心！一些包有依赖关系。例如，apache2 包需要安装 ssl 包。因此，如果你想要运行 apache\
    \ 的 SSL 版本，你需要在安装 apache2 之前安装 ssl 包。在下面的示例中，我们配置虚拟主机以接受端口 80 上的 HTTP 和端口 443\
    \ 上的 HTTPS。\n\n```\n$ echo \"www.example.com\"\n$ echo \"www.example.com\"\n$\
    \ echo \"www.example.com\"\n$ echo \"www.example.com\"\n```\n\n**（可选）**\n如果端口\
    \ 8080 上的主站点可以呈现为虚拟主机的形式，你可以通过创建一个新的 /etc/apache2/conf-enabled/ 虚拟主机来创建虚拟主机。当你想在不同的端口上运行与主站点不同的站点时，这很有用。\n\
    \n```\nPort 8080\nVirtualHost/:8080\n    DocumentRoot /var/www/example.com\n \
    \   ServerName www.example.com\n    ServerAlias example.com\n```\n\n以下指令用于告诉虚拟主机在哪里放置其错误日志文件，以及在哪里放置其访问日志文件。这些指令是\
    \ `ErrorLog` 和 `CustomLog`。\n\n```\nErrorLog ${APACHE_LOGS}/error.log\nCustomLog\
    \ ${APACHE_LOGS}/access.log combined\n```\n\n你需要使用两条命令来允许你启动、停止和重启 apache2 服务。第一个命令是\
    \ `service apache2 start`。第二个命令是 `service apache2 stop`。第三个命令是 `service apache2\
