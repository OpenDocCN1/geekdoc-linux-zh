    # REVIEWS


    Backpack B2 21


    A smart bag that turns a data into an easy-to-read map and can even predict your
    arrival time. A new smart briefcase or backpack is the latest bag with smart technology.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_3_1.png)


    Intel Core i5-12600 26


    A 40GB DDR5 memory over the 80GB DDR4 memory, and a 24MB L3 cache over the 32MB
    L3 cache.


    A faster CPU for faster PC builds.


    Dell XPS 17 (XPS 1770) 27


    A big screen, a high-performance CPU and a dedicated GPU all combine to make one
    of the most powerful laptops on the market.


    Malfunction Mall 29


    Manual Red is a creative new take on the genre of 2D platformers. A new release
    from an indie developer.


    Esor G42 32


    Manual Red is a smart switchboard that will let you control the smart lights,
    cameras and switches with your voice. A new control panel for your home.


    Interruption 25


    A new app from a team in Paris that helps manage your time. A new time management
    tool.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_3_2.png)


    # ROUNDUP


    ![](img/f20a68d91e56325c44e9a1405ca1923f_3_3.png)


    Software publishers 26


    All open, and what''s in store for your software purchases, plus a new look at
    open source.


    # IN DEPTH


    ![](img/f20a68d91e56325c44e9a1405ca1923f_3_4.png)


    Local Linux for local world 32


    Why you might not need to worry about Linux. And a look at the local Linux projects.


    ![](img/f20a68d91e56325c44e9a1405ca1923f_3_5.png)


    Afrifox 32


    A new look at the world of African software.'
