    ### 1. 最新证据——奥卡姆剃刀：在模型推断背景下对奥卡姆剃刀的新方法


    ![](img/f20a68d91e56325c44e9a1405ca1923f_12_0.png)


    为了扩展关于奥卡姆剃刀主要讨论的笔记，我们简要总结了我们方法及其与传统用法之间的区别。这不是一本权威指南，而是解释为何我们认为有必要重新审视这一概念。我们做出了几个简化假设：(1)
    模型是树结构；(2) 每个节点对其子节点有一个概率分布；(3) 根节点是已知的。在这些条件下，我们可以推导出给定模型下数据边缘似然性的闭合形式表达式。该表达式类似于
    Rissanen 在其随机复杂性工作中推导的表达式，但它更简单且更直观。我们的方法可以视为传统贝叶斯模型选择准则的推广，其中对模型的先验分布由树的结构决定。这使我们能够避免传统贝叶斯模型选择中通常所需的任意先验选择。我们认为，我们的方法提供了在模型推断背景下应用奥卡姆剃刀的更具原则性的方式。我们希望本笔记对有兴趣深入了解此主题读者有用。一如既往，如果你们有任何问题或意见，请随时联系我们。我们很乐意提供帮助。享受阅读吧！–
