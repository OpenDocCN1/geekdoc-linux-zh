  md: 'install Ubuntu, go to www.gnu.org/licenses/gpl.html to find a copy of the GNU
    GPL. You will see that the GPL unrestricted freedom to use, duplicate, share,
    modify, improve, and even sell the software.


    You can put your copy of Ubuntu to work right away in your home or at your place
    of business without worrying about software licensing, per-seat workstation or
    client licenses, software auditing, royalty payments, or any other type of payments
    to third parties. However, be aware that although much of the software included
    with Ubuntu is licensed under the GPL, some packages on this book''s disc are
    licensed under other terms. There is a variety of software licenses, and many
    packages fall under a broad definition known as open source. Some of these include
    the Artistic License, the BSD License, the Mozilla Public License, and the Q Public
    License.


    For additional information about the GNU software licenses, browse to www.gnu.org/.
    For a definition of open source and licensing guidelines, along with links to
    the terms of nearly dozen open-source licenses, browse to www.opensource.org/.


    # # This Book Is For


    This book varies its coverage from shallow to its wide range of topics. This is
    intentional. There are some topics that are Ubuntu-specific and are not covered
    by any other book, and so deserve deep coverage. There are some topics that every
    power user must master. There are other topics that power users know about, that
    they understand some history, some other options, or simply what they need to
    listen to and participate in discussions with other technical people without being
    completely confused


    Some topics, like the Linux command line, receive deep and extensive coverage
    because I believe that information to vital to anyone who wants to be a power
    user or become a skilled DevOps guru. That topic gets two full chapters.


    Other topics, like the chapter that mentions ADA and Fortran, with more than 15
    other programming languages, only brief coverage that so people who are interested
    get a few guideposts to help them continue if they are interested. In this case,
    around 20 programming languages are covered in about dozen pages. These are useful
    topics to some, but not topics 1 I consider vital.


    Additionally, some topics are too broad to be covered in great depth in this book,
    but again, an intermediate to advanced user should have at least a foundational
    knowledge of these. They are covered and that information is provided to help
    you find more resources and expand your understanding, as needed.


    # # Those Wanting to Become Intermediate or Advanced Users


    Ubuntu Unleashed is intended for intermediate and advanced users or those who
    want to become one. Our goal is to give you a nudge in the right direction, to
    help you enter the higher stages by exposing you to as many different tools and
    ideas as possible; we want to give you some thoughts and methods to consider and
    spur you to seek out more.'
  merge: -1
