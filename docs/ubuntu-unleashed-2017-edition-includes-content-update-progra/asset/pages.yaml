  md: '# Introduction


    development of the distribution. A full copy of Ubuntu is included on the enclosed
    disc, and it is possible to install Ubuntu from that disc in less than an hour!


    # A QUICK WORD ABOUT MARKETING


    Almost all of the content in this book allows regardless of what Ubuntu version
    you are using, so long as it is reasonably clear. The book has been written to
    try focus on information that is useful for the longest amount of time possible.
    Some chapters, those covering installation or the bases of the default Ubuntu
    graphical user interface, will have their information change frequently. Those
    chapters are the exception. The blurb on the cover of the book about which editions
    this book was added to account for these chapters and to denote clearly when the
    book was most recently revised.


    Do not let the highly technical nature of Linux discourage you, however. Many
    people who have heard of Linux that is found only on servers, looking after websites
    and email. Nothing could be further from the truth. Distributions like Ubuntu
    are making huge inroads to the market. Corporations are realizing the benefits
    of running a stable and powerful operating system that is easy to maintain and
    easy to secure. The best part is that Linux distributions make improvements, the
    majority of those improvements are shared freely, allowing you to benefit from
    the additions and refinements made by one distribution, such as Red Hat, while
    continuing to use a different distribution, such as Ubuntu, which in turn shares
    its improvements. You can put Ubuntu to work today and be assured of a great user
    experience. Feel free to make copies of the software as you want; Ubuntu is freely
    and legally distributable over all world—no copyright lawyers are going to pound
    your door.


    # Licensing


    Software licensing is an important issue for all computer users and can entail
    moral, legal, and financial considerations. Many consumers think that purchasing
    a copy of a commercial or proprietary operating system, productivity application,
    utility, or game conveys ownership, but this is not true. In the majority of cases,
    the end user license agreement (EULA) included with a commercial software package
    states that you have paid only for the right to use the software using specific
    terms. This generally means you may not examine, make copies, share, or transfer
    ownership of the software package. More onerous software licenses enforce terms
    that preclude you from distributing or publishing performance reviews of the software.
    Even more insidious licensing schemes (and supporting legislation, especially
    in the United States) contain provisions allowing onsite auditing of the software’s!


    This is not the case with the software included in this book. You are entirely
    free to make copies, share copies, and install the software on as many computers
    as you want—we encourage you to purchase additional copies of this book as gifts,
    however. Be sure to read the README file on the disc included with this book for
    important information regarding the included software and disk contents. After
    you'
  merge: -1
