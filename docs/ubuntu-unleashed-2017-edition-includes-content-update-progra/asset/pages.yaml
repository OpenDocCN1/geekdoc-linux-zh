  md: '# Working on the Command Line


    With much software available for installation, it is no surprise that Debian-based
    distros have many ways to manage software installation. At their root, however,
    they use Debian''s well-renowned Advanced Package Tool (APT). A person on Slashdot.com
    once said, "Welcome to Slashdot. If you can''t find anything original, just say
    how much APT rocks and you''ll fit right in." You see, even though many other
    distros have tried the power of APT, nothing ever comes close.


    Why is APT so cool? Well, it was the first system to properly handle dependencies
    in software. Other distros, as Red Hat, used RPM files that had dependencies.
    For example, an RPM for Gimp would have a dependency on Gtk, the graphical toolkit
    on which Gimp is based. So, if you tried to install your Gimp without having the
    Gtk RPM, your install would fail. So, you grab the Gtk RPM and try again. Again:
    Gtk has dependency on three things you need to download. And three other things
    have dependencies on 20 other things. And so, and so, and so on, until you can''t
    find a working RPM for one of the dependencies, and you give up.


    APT, on the other hand, was designed to automatically find and download dependencies
    for your packages. So, if you want to install Gimp, it downloads Gimp''s package
    and any other software it needs to work. No more hunting around by hand, no more
    worrying about finding the right, and certainly no more need to compile things
    by hand. APT also handles installation resuming, which means that if you lose
    your Internet connection-way through an upgrade (or your battery runs out, or
    you have to quit, or whatever), APT picks up where it left off when you run it.


    # Day-to-Day Usage


    To enable you to search for packages both quickly and thoroughly, APT uses a local
    cache of the available packages. Try running this command:


    ```

    mathew@seymour:-$ sudo apt-get update

    ```


    The apt-get update command instructs APT to contact all the servers it is configured
    to use and download the latest list of updates. If your updates are outdated,
    it takes a minute or two for APT to download the updates. Otherwise, this command
    executes in a couple of seconds.


    After the latest package information has been downloaded, you are returned to
    the command line. You can now ask APT to automatically download any software that
    has been updated, using this command:


    ```

    mathew@seymour:-$ sudo apt-get upgrade

    ```


    If you have a lot of software installed on your machine, there is a greater chance
    of things being updated. APT scans your software and compares it to the latest
    package information from the servers and produces a report like this:


    ```

    mathew@seymour:-$ sudo apt-get upgrade

    Reading package lists... Done

    ```'
