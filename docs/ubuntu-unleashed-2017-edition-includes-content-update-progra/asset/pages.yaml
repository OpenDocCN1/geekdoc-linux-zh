    Do you want to continue [Y/n]?


    Each part of report tells you something important. Starting at the top, the line
    "the following packages will be upgraded" gives you the exact list of packages
    for which updates are available. If you are installing new software or removing
    software, the lines listed "The following packages will be installed" and "The
    packages will be removed." At the end shows a total of 21 packages that APT will
    upgrade, with 0 new packages, 0 to remove, and 0 not upgraded. Because this is
    an upgrade rather than an installation of new software, all new packages take
    up only 623KB of additional space. Although you have 84.8MB download, the packages
    are overwriting files.


    It''s important to understand that a basic apt-upgrade never removes software
    or adds new software. As a result, it is safe to keep your system fully patched
    because it should never break things. However, occasionally you will see the "0
    not upgraded" status, which means some things cannot be upgraded. This happens
    when some software must be installed or removed to satisfy the dependencies of
    the updated package, as previously mentioned, apt-upgrade will never do.


    In this situation, you need to use apt-get dist-upgrade, named because it''s designed
    to allow users to upgrade from one version of Debian/Ubuntu to a new version—an
    upgrade that involves changing everything about the system, removing obsolete
    software, and installing the latest features. This is one of the most-loved features
    of Debian because it enables you to move from version to version without having
    to download and install new DEBs. Keeping regular upgrades and dist upgrades separate
    is very useful for making sure that security updates and simple bug fixes don''t
    change software configurations, especially on a machine that needs to be consistently
    available and working, such as a server.


    Whereas apt-upgrade and apt-get dist-upgrade are there for upgrading packages,
    apt-get install is responsible for adding new software. For example, if you want
    to install the MySQL database server, you run:


    ```

    $ matthew@seymour:$ sudo apt-get install mysql-server

    ```


