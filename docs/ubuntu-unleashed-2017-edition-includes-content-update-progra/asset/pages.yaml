  md: 'After you have made your changes, click the Apply button to have Synaptic download,
    upgrade, install, and uninstall as necessary. If you close the program without
    clicking Apply, your changes are lost.


    Beyond the categories on the left side of the screen, you see six buttons: Sections,
    Status, Origin, Custom Filters, Search Results, and Architecture. These customize
    the left list: Sections the Categories view; Status enables you to view packages
    that are installed or upgradable; Origin lists the different repositories available
    to download packages; Custom Filters has some esoteric queries that are useful
    for advanced users, Search Results stores results of your searches; and Architecture
    shows the packages specific to each architecture of Ubuntu.


    You can press Ctrl+F at any time to search for a particular package. By default,
    it is set to search by package description and name. You may change the Look In
    box setting to search for Name. As mentioned already, your search terms are saved
    under the Search view (the button on the bottom left), and you can click from
    that list to re-search on that term.


    As well as providing the method of installing and removing software, Synaptic
    provides the means to configure the servers you want to use for finding packages.
    In fact, this is where you can make one of the most important changes to your
    Ubuntu system: You can open it up to the Ubuntu Universe and Multiverse.


    Ubuntu is based on the Debian distribution, which has thousands of software packages
    available for installation. Ubuntu uses only a subset of number but makes it easy
    to install the others, along with many packages that are not available in Debian.
    When you use Synaptic, you see small Ubuntu logos next to many packages; this
    identifies them as being officially supported by the Canonical-supported Ubuntu
    developers. The packages that do not have this logo are supported by the wider
    Ubuntu community of developers.


    To enable the Universe and Multiverse repositories, go to Settings, Repositories.
    This list shows all the servers you have configured for software installation
    and updates and includes the Universe and Multiverse repositories. When you find
    them, check them, and then click Close.


    Synaptic shows a message box warning that the repository listings have changed
    and that you need to click the Reload button (near the top of the Synaptic window)
    to have it refresh the package lists. Go ahead and do that, and you should see
    a lot more software appear for your selection. However, notice that only a small
    number have the official Ubuntu “seal” attached, which means you want to be a
    more careful when installing software.


    > NOTE

    Much of the software discussed in this book is available only through the Universe
    repository. Therefore, we highly recommend enabling it to get full out of this
    book and your Ubuntu installation.'
