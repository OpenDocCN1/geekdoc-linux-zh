- img_proc: true
  md: 'When you configure script succeeds, run the following to compile the software:


    ```

    matthew@seym:~/source/originalname$ make

    ```


    And finally, run the following:


    ```

    matthew@seym:~/source/originalname$ sudo make install

    ```


    If the compile fails, check the error messages for the reason and run the following
    you start again:


    ```

    matthew@seym:~/source/originalname$ make clean

    ```


    You can also run the following to remove the software if you do not like it:


    ```

    matthew@seym:~/source/originalname$ sudo make uninstall

    ```


    # Compiling from Source from the Ubuntu Repositories


    You sometimes want tocompile a package, even though a binary package is available
    in the Ubuntu repositories. For example, a program might have been compiled into
    a binary with a specific feature enabled that you would like to use. Here is how
    you can do this. We will call the software package we want to compile `foo`.


    First, get the source from the Ubuntu repositories:


    ```

    matthew@seym:-$ apt-get source foo

    ```


    Install the build dependencies for the package:


    ```

    matthew@seym:-$ sudo apt-get build-dep foo

    ```


    Change the directory to the source code (may include the version number):


    ```

    matthew@seym:-$ cd foo-4.5.2

    ```


    Whatever you want to make to the package or to the compilation flags. You can
    do this using `./configure` and `make`, or sometimes by making manual changes
    to a configuration file. Each package has the potential to do this differently,
    so you need to see that program''s documentation. Try looking for README in the
    source code to get started.


    Next, create a new `debian/changelog` entry. After you enter this, you need to
    enter a message that tells why a new version was made, perhaps something like
    *Matthew''s flight of fancy* with extra sauce.


    NOTE


    Ubuntu numbering follows a specific pattern. To help yourself later, you should
    stick to this pattern. Using the foo numbers shown here, a typical Ubuntu package
    that was inherited from Debian with no changes would then be 4.5.2-1. A package
    inherited'
