    # Compiling Software from Source


    Compiling applications from source is not difficult. There are two ways to do
    this: You can use the source code in the Ubuntu repositories, or you can use source
    code provided by upstream developers (most useful for projects that are not available
    in the Ubuntu repositories). For either method, you need to install the build-essential
    package to ensure that you have the tools you need for compilation. You may also
    need to install automate and checkinstall, which are build tools.


    # Compiling from a Tarball


    Most code that is not in the Ubuntu repositories is from the original writer or
    from a company''s website as compressed source tarballs—that is, tar files that
    have been compressed using gzip or bzip. The compressed files typically uncompress
    into a directory containing several files. It is always a good idea to compile
    source code as a regular user to limit any damage that broken or malicious code
    might inflict, create a directory named source in your home directory.


    From wherever you downloaded the tarball, uncompress it to the /source directory
    using the -C option to tar:


    ```

    matthew@semour:-$ tar xzf packageName.tgz -C /source

    matthew@semour:-$ tar xvf packageName.tar.gz -C /source

    matthew@semour:-$ tar jxv packageName.bz2 -C /source

    matthew@semour:-$ tar xjvf packageName.tar.bz2 -C /source

    ```


    If you are not sure which file compression method was used, use the file command
    to figure it out:


    ```

    matthew@semour:-$ file packageName

    ```


    Now, change directories to ~/source/pathname and look for a file README, INSTALL,
    or a similar name. Print out the file if it contains specific instructions on
    how to compile and install the software. Typically, the procedure to compile source
    code is as follows:


    ```

    matthew@semour:-$ /source/pathname$ ./configure

    ```


    This runs a script to check whether all dependencies are met and the environment
    is correct. If there are missing dependencies, the configuration script tells
    you exactly which ones it needs. If you have the Universe and Multiverse repositories
    enabled in Synaptic, chances you will find the missing software (usually libraries)
    in there.'
  merge: -1
