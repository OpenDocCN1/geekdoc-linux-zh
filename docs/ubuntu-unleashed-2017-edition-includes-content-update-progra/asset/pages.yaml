  md: 'from Debian, but changed for 4.5.2-ubuntu1 (and ubuntu2 for a second version,
    and so on). A package that did not have a version in Debian but which was created
    for Ubuntu would be 4.5.2-ubuntu1 (and ubuntu2 and so on).


    ```

    matthew@seymour:~$ dch -i

    ```


    Build the source package. This creates all the files necessary for uploading a
    package:


    ```

    matthew@seymour:~$ debuild -s

    ```


    Finally


    ```

    matthew@seymour:~$ sudo dpkg -O1 foo-4.5.2-lubuntucustom.deb

    ```


    # Configuration Management


    This section provides a quick introduction to the couple tools that might be useful
    for those who want control over system configuration management. For larger needs,
    see Chapter 36, "Managing Sets of Servers."


    # dotdee


    If you run Linux-based systems, you will find a series of directories that end
    with a .d and that store configuration files called .d or "dot dee" directories.
    If you look in /etc/, you find many such as apparmor.d and pam.d. Opening these
    directories reveals a large number of configuration files. In Ubuntu or other
    Debian-based systems, it is a violation of etiquette (and Debian policy) for any
    software package to directly change the configuration files of another package.
    This can be problematic if you want to use system configuration management.


    dotdee solves this problem by allowing you to take any flat file in your filesystem
    and replace it with a symlinking pointing to a file that is generated from a d-style
    directory. This saves the original file and updates the generated file automatically
    and dynamically any time any in the original is added, deleted, or modified. This
    way, the Debian policy and general etiquette standards are met, but configurations
    can be modified by an external program.


    dotdee works its magic using notify to dynamically and instantly update the master
    file. The master file can be built three ways: using flat files, which are concatenated;
    using diff/patch files, which are applied in a quiltlike manner; and using executables,
    which process stdin and dump to stdout. This flexibility could make any system
    administrator or developer guru happy.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Snappy Ubuntu Core


    Snappy Ubuntu Core takes the absolute minimum of files and code necessary for
    a usable Ubuntu server image and adds to it a new means of managing software packages.
    The idea is similar to how smart phones like Android-based provide software. In
    this method, the software packages include everything they need to run on the
    operating system, effectively making it that a package is isolated from the operating
    system completely. This is designed to protect from the possibility of a package
    breaking out an entire operating system. It is also intended to make updates easier
    and cleaner. With the idea of convergence, Ubuntu is aiming to use the same set
    of software for traditional desktops, laptops, tablets, and phones, all these
    devices will share the core operating system and Unity interface, and packages
    that work on any one should also work on the others. This feature first appeared
    in Ubuntu 16.04 LTS.


    # Using Snaps


    Software bundles packaged this way are called snaps. Snaps can be installed using
    Ubuntu Software or from the command line. On the command line, snaps have a new
    command. Use the following to interact with snaps.


    To show a list of snap packages that are available to be installed:


    ```

    mathew@semour::$$ snap find

    ```


    Because snaps are new, packages are available today. However, this list is growing
    and is likely to become unwieldy at some point. You can use grep to search through
    the output to find a specific package in the list, but you can also use:


    ```

    mathew@semour::$$ snap find searchterm

    ```


    To install a snap package:


    ```

    mathew@semour::$$ snap install packagename

    ```


    To show a list of snap packages that are currently installed:


    ```

    mathew@semour::$$ snap list

    ```


    To update a snap package:


    ```

    mathew@semour::$$ snap refresh packagename

    ```


    To remove a snap package:


    ```

    mathew@semour::$$ snap remove packagename

    ```


    To display a list of changes, such as when snaps were installed, updated, or removed:


    ```

    mathew@semour::$$ snap changes

    ```'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'It is possible for you to create a snap package. See Chapter 39, “Opportunistic
    Development,” to learn how. Learn more and keep up to date as Ubuntu Snappy Code
    continues develop by checking out https://developer.ubuntu.com/en/snappy/.


