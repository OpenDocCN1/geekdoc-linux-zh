    # 引言


    我们很高兴向您介绍 2017 版的《Ubuntu Unleashed》。Ubuntu 是一种基于 Linux 的计算机操作系统，它席卷全球。从 2004 年
    humble起步开始，Ubuntu 已经成为 Linux 的前沿，并成为服务器的热门选择。


    Ubuntu 源自最古老且最受推崇的发行版之一 Debian。Debian 由才华横溢的志愿者团队构建；它是最稳定、可定制的 Linux 发行版之一，其质量和技术实力备受赞誉。然而，它是一个为极客准备的操作系统；进入
    Debian 世界的门槛较高，其易用性倾向于高度专业化，并要求新用户在加入之前先掌握门道。这既是合理的，也是可以接受的。


    Ubuntu 所做的是利用 Debian 的优质品质，创建一个普通人也能使用的操作系统。这并不意味着 Ubuntu 用户在技术上不精通，只是说他们不必如此。事实上，许多才华横溢的志愿者软件开发者热爱
    Ubuntu，因为让他们让他们专注于特定的兴趣，而不是操作系统的细节。这本书就是为这些人人准备的，也是为那些渴望加入他们行列的人准备的。


    如果你是 Linux 新手，选择这本书是一个非常明智的决定。Sams 出版公司的《Unleashed》系列书籍对其主题进行了深入探讨，涵盖了初学者和高级用户，并将他们推向知识和专业能力的新水平。Ubuntu
    是一个变化快速的发行版，每年发布两次版本。我们从 Ubuntu 的早期就开始追踪其发展，以确保书中的信息与发展情况紧密对应。


    ## 本引言包含


    - 许可协议

    - 本书目标读者

    - 本书包含的内容

    - 本书使用的约定


    # 引言


    发行版的开发。附带的光盘中包含一份 Ubuntu 的完整副本，你可以在不到一小时内从该光盘安装 Ubuntu！


    ## 关于营销的简短说明


    书中的几乎所有内容无论你使用哪个版本的 Ubuntu（只要其足够清晰）都适用。这本书的编写初衷是试图关注尽可能长时间有用的信息。某些章节（即涵盖图形用户界面基础的章节）信息会频繁变化。这些章节是例外。书封上的简介说明了本书被添加到了哪些版本中，以及书籍最后修订的时间。


    然而，请不要让 Linux 的高度技术性令你气馁。许多人听说 Linux 仅存在于服务器上用于维护网站，事实完全如此。像 Ubuntu 这样的发行版正在大量进军市场。企业正在意识到运行一个稳定、强大且易于维护和安全的操作系统的益处。最棒的一点是，大多数改进都是免费共享的，让你从像
    Red Hat 等发行版增加的功能中获益，而 Red Hat 反过来也会分享它的改进。你今天就可以投入使用 Ubuntu，并确保获得佳的用户体验。


    ## 许可协议


    软件许可对所有用户来说都是一个重要问题，可能涉及道德、法律和财务考量。许多消费者认为购买商业或专有操作系统、应用程序或工具的副本意味着拥有所有权，但事实并非如此。在大多数情况下，商业软件附带的最终用户许可协议（EULA）规定你支付的只是使用权。这通常意味着你不能复制、共享或转让软件的所有权。更严苛的软件许可协议会执行禁止你分发或发布软件评论的条款。甚至更阴险的许可方案（尤其是在美国）包含了允许审计软件的条款。书中包含的软件并非如此。你可以完全自由地复制、共享并在任意数量的计算机上安装该软件——不过，我们鼓励你购买本书的额外副本。请务必阅读
    Ubuntu 附带的 README 文件获取有关软件的重要信息，并在安装 Ubuntu 后，访问 www.gnu.org/licenses/gpl.html
    查找 GPL 副本。你会发现 GPL 赋予了使用、共享、修改甚至出售软件的自由。你可以立即在家里或工作场所开始使用你的 Ubuntu 副本，而不必担心软件许可或版税问题。然而，请注意，虽然
    Ubuntu 包含的大许多软件是根据 GPL 许可的，但某些软件包是根据其他条款许可的。软件许可有多种，许多软件包属于被称为“开源”的宽泛定义。其中包括 Artistic
    许可、BSD 许可、Mozilla 公共许可。有关 GNU 许可的更多额外信息，请访问 www.gnu.org/。关于开源的定义和许可指南，以及指向几乎所有开源许可条款的链接，请访问
    www.opensource.org/。


    ## 本书目标读者


    本书的涵盖范围从浅入广泛的主题不等。这是刻意为之。有些主题是 Ubuntu 特有的，其他书籍均未涵盖，值得深度介绍。有些主题是每个高级用户都必须掌握的。还有一些主题是高级用户了解的——他们了解一些历史、其他选项，或者仅仅是为了让自己在与技术人员讨论时不至于完全困惑。


    某些主题（如 Linux 命令行）接受了深入且广泛的涵盖，因为我相信信息对于任何想成为高级用户或熟练大师的人来说都是至关重要的。该主题占据了两个完整的章节。其他主题，如
    ADA、Fortran 以及其他 15 多种编程语言，则进行了简要介绍，为感兴趣的人提供一些指导方向以便继续。在这种情况下，大约 12 页的内容涵盖了约 20
    种编程语言。这些主题对某些人有用，但我认为它们并非至关重要。


    此外，某些主题太宽泛，无法在书中进行深度涵盖，但再次，中高级用户至少应该具备这些方面的基础知识。这些内容已被涵盖，并提供了信息帮助你根据需要扩展理解。


    ## 想要成为中级或高级用户的人


    《Ubuntu Unleashed》面向中级和高级用户，以及想要成为这类用户的人。我们的目标是通过让你接触尽可能多的工具和想法，引导你进入更高阶段；我们希望为你提供一些思考和方法，并促你去探索更多。


    '
