    # Introduction


    Although the contents are aimed at intermediate to advanced users, new users who
    pay attention will benefit from the advice, tips, tricks, traps, and techniques
    presented in each chapter. Pointers to more detailed or related information are
    also provided at the end of each chapter.


    If you are new to Linux, you might need to learn some new computer skills, as
    how to research your computer''s hardware, how to partition a hard drive, and
    (occasionally) how to use a command line. This book helps you learn these skills
    and shows you how to learn more about your computer, Linux, and the software with
    Ubuntu. Most important, it helps you overcome your fear of the system by telling
    you about what it is and how it works.


    We would like to take a moment to introduce a concept called “The Three Levels
    of Listening” from Alistair Cockburn’s Agile Software Development, published by
    Addison Wesley. These describe how a person learns and masters a technique. We
    all start at the first stage and progress from there. Few reach the last stage,
    but those who do are incredibly effective and efficient. People aiming for this
    stage are the very ones for whom we intend this book.


    +   **Following**—The stage where the learner learns for one very detailed process
    that works and sticks to it accomplish a task.

    **Detaching**—The stage where the learner feels comfortable with one method and
    begins to learn other ways to accomplish the same task.

    **Fluent**—The stage where the learner has experience with or understanding of
    many methods and don’t think of any of them in particular while doing a task.


    My books focus on the first set of users. This is not one of them. Our goal in
    Ubuntu Unleashed to write just enough to get you from where you are to where you
    want or to be. This is not a book for newcomers who want or need every step outlined
    in detail, although we do occasionally. This is a book for people who want learning
    what can be done and how to get started with. The Internet is an amazing reference
    tool, so this is not a comprehensive reference book. This book is a tool to help
    you see what you seek to get started in the right direction with a quality foundational
    understanding.


    # Sysadmins, Programmers, and DevOps


    Systems administrators, or Sysadmins, are the people who keep servers and networks
    up and running. Their role is sometimes called operations. They deal with software
    installation and configuration, security, and all the amazing things that behind
    the scenes that lets others use their systems for their work. They are often given
    less than they deserve, the pay is good and it is a ton of fun to wield the ultimate
    power over a computer system. It is these amazing and gals work hard to make sure
    they do their jobs well, striving for incredible system uptime and availability.
    Ubuntu is an excellent operating system for servers and networks, and in this
    book you can find much of the knowledge needed to get started in this role.'
