    Software licensing is an important issue for all computer users and can entail
    moral, legal, and financial considerations. Many consumers think that purchasing
    a copy of a commercial or proprietary operating system, productivity application,
    utility, or game conveys ownership, but this is not true. In the majority of cases,
    the end user license agreement (EULA) included with a commercial software package
    states that you have paid only for the right to use the software using specific
    terms. This generally means you may not examine, make copies, share, or transfer
    ownership of the software package. More onerous software licenses enforce terms
    that preclude you from distributing or publishing performance reviews of the software.
    Even more insidious licensing schemes (and supporting legislation, especially
    in the United States) contain provisions allowing onsite auditing of the software’s!


    This is not the case with the software included in this book. You are entirely
    free to make copies, share copies, and install the software on as many computers
    as you want—we encourage you to purchase additional copies of this book as gifts,
    however. Be sure to read the README file on the disc included with this book for
    important information regarding the included software and disk contents. After
    you'
