    Ubuntu 提供了多种系统资源管理工具。接下来的章节介绍了你将用于大多数软件管理的图形化软件管理工具。本章还涵盖了系统的监控和磁盘存储。


    ## Ubuntu 软件 (Ubuntu Software)


    Ubuntu Software 是 Ubuntu 中用于软件包管理的图形化工具。你可以在应用程序菜单中找到“Ubuntu Software”；软件包和可执行程序名为
    `ubuntu-software`。Ubuntu Software 允许你通过直观的内置和简单的一键安装功能轻松选择和安装大量应用程序。当你打开程序时，你会看到主界面，如图
    9.1 所示。


    在屏幕顶部有三个菜单选项：全部 (All)、已安装 (Installed) 和更新 (Updates)。在其下方是一个搜索栏，可以用它搜索软件包。向下滚动按类别列出软件。


    ![](img/11c8218e4caaaf9479163b6284851c_40_png)


    图 9.1 界面让你按分组浏览软件包。


    通过 Ubuntu Software 安装新软件非常简单：在列表中找到它，双击并点击“安装”按钮。当你这样做时，可能会被要求输入密码；然后应用程序将被下载并安装。你可以通过
    Ubuntu Software 中找到应用程序并点击“移除”按钮来删除它。


    ## 使用 Synaptic 管理软件


    Ubuntu Software 在添加和删除应用程序方面非常好，但如果你需要安装特定内容（例如库），你需要使用 Synaptic（图 9.2）。可以使用上述的
    Ubuntu Software 安装 Synaptic；它默认不安装。


    ![](img/11c8218e4caaaf9479163b6284851c_41_png)


    图 9.2 对于更高级的软件管理，Synaptic 是首选工具。左侧是软件类别（尽管还有更多），右上是该类别的软件包选择，右下方是当前选中的软件包。要安装或删除软件，点击名称左侧的复选框，你将看到提供以下选项的菜单：


    - *取消标记 (Unmark)*——如果你标记了该软件包进行安装、升级或其他选项，此选项将移除该标记。

    - *标记安装 (Mark for Installation)*——将此软件包添加到待安装列表中。

    - *标记重新安装 (Mark for Reinstallation)*——如果你已安装某些软件，但由于某些原因它无法工作，此选项将从头重新安装它。现有的配置文件将被保留，你所做的任何修改都是安全的。

    - *标记升级 (Mark for Upgrade)*——如果软件有更新，此选项将下载并安装更新。

    - *标记移除 (Mark for Removal)*——此选项将从系统中删除选定的软件包，但会保留其配置文件，以便在以后重新安装它时无需重新配置。

    - *标记彻底移除 (Mark for Complete Removal)*——此选项将从系统中删除选定的软件包，还将删除任何配置文件，从系统中清除所有内容。


