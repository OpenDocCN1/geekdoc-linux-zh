    # Finding Software


    With many packages available, it can be hard to find the exact thing you need
    using command-line APT. The general search tool is called apt-cache and is used
    like this:


    ```

    mathew@semour:-$ apt-cache search kde

    ```


    Depending on which repositories you have enabled, it returns about a thousand
    packages. Many of those results will not have KDE in the package name but will
    be matched by the description contains the word KDE.


    You can filter this information in several ways. First, you can instruct apt-cache
    to search only in the package names, not in their descriptions. You can do this
    with the -n parameter, like this:


    ```

    mathew@semour:-$ apt-cache -n search kde

    ```


    # CHAPTER 9 Managing Software


    The search has gone down from more than 1,000 packages to a few hundred.


    Another way to limit search results is to use some basic regular expressions,
    such as ^,meaning "start," and $ meaning "end". For example, you might want to
    search for programs that are part of the main KDE suite and not libraries (usually
    named like libkde), additional bits (such as xms-kde), and things that are actually
    nothing to do with KDE yet still match our search (like tkdesk). By this searching
    for packages that have a name starting with kde, as follows:


    ```

    matthew@semour:-$ apt-cache -n search ^kde

    ```


    The easiest way if you want to find packages is to combine apt-cache with grep,
    to search within results. For example, if you want to find all games-related packages
    for KDE, You could run search:


    ```

    matthew@semour:-$ apt-cache search games | grep kde

    ```


