    t Debian packages for MySQL 4.1 have "mysql-server-4" in the

    list, meaning that they offer the functionality provided by MySQL 4.1. Therefore,

    You can install either version to satisfy the MySQL-based application.


    # Using apt Instead of apt-get


    There is a new, simplified interface to APT that removes the hyphen and the second
