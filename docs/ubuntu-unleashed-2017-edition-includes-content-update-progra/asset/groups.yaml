    # Working on the Command Line


    If you try running apt-get install with packages you already have installed, APT
    considers your command to be apt-get update and looks to see whether new versions
    are available for download.


    The last day-to-day package operation is removing things you no longer want, which
    you do through the apt-get remove command, as follows:


    ```

    mathew@semour:-$ apt-get remove firefox

    ```


    Removing packages can be dangerous because APT also removes any software that
    relies on the packages you selected. For example, if you were to run apt-get remove
    libgtk2.0-0 (the main toolkit for Ubuntu), you would probably find that APT insists
    on removing a than a hundred others. The moral of the story is: When you remove
    software, read the APT report carefully before proceeding to continue with the
    uninstall.


    A straight apt-get remove leaves behind the configuration files of your program
    so that if you reinstall it do not also need to reconfigure. If you want to remove
    the configuration files as well as the program files, run this command instead:


    ```

    mathew@semour:-$ apt-get remove -purge firefox

    ```


    Or:


    ```

    mathew@semour:-$ sudo apt-get-purge firefox

    ```


    Either will perform a full uninstall.


