    ## 配置管理


    本节为那些想要控制系统配置管理的用户简要介绍可能实用的工具。对于更大的需求，请参阅第 36 章“管理服务器组”。


    ## dotdee


    如果你运行基于 Linux 的系统，你会发现一系列以 .d 结尾的目录，它们存储了名为 .d 或 "dot dee" 目录的配置文件。如果你查看 `/etc/`
    目录，你会发现许多如 `apparmor.d` 和 `pam.d` 这样的目录。打开这些目录会发现大量的配置文件。在 Ubuntu 或其他基于 Debian
    的系统中，任何软件包直接更改另一个包的配置文件都是违反礼节（以及 Debian 策略的）。如果你想使用系统配置管理，这可能会产生问题。


    dotdee 通过允许你将文件系统中的任何扁平文件替换为指向从 d 样式目录生成的文件的符号链接，从而解决了这个问题。这保留了原始文件，并在原始文件发生任何添加、删除或修改时，自动动态地更新生成的文件。通过这种方式，既符合
    Debian 策略和通用礼节标准，又可以修改配置。


    ## Snappy Core


    Snappy Core 采用了运行所需的极少文件和代码，为 Ubuntu 服务器增加了管理软件包的新方法。这种方法类似于智能手机中的 Android。这种设计旨在防止包破坏整个操作系统。它的初衷是让更新变得更容易且整洁。


    ## 使用 Snaps


    以这种方式打包的软件包被称为 snaps。snaps 可以 Ubuntu Software 或命令行安装。在命令行中，snaps 有一个新命令。使用以下命令与
    snaps 交互。


    显示可安装的 snap 包列表：


    ```

    matthew@seymour:~$ snap find

    ```


    由于 snaps 是新的，现在有很多包可用。然而，这个列表不断增长，将来可能会变得难以管理。你可以使用 `grep` 搜索输出内容来查找特定包，也可以使用：


    ```

    matthew@seymour:~$ snap find searchterm

    ```


    安装 snap 包：


    ```

    matthew@seymour:~$ snap install packagename

    ```


    显示当前安装的 snap 包列表：


    ```

    matthew@seymour:~$ snap list

    ```


    更新 snap 包：


    ```

    matthew@seymour:~$ snap refresh packagename

    ```


    移除 snap 包：


    ```

    matthew@seymour:~$ snap remove packagename

    ```


    显示 snap 更改列表（例如安装、更新或删除时）：


    ```

    matthew@seymour:~$ snap list

    ```


    可以创建 snap 包。请参阅第 39 章“机会性开发”。


