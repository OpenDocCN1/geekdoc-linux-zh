    What This Book Contains xxxvii


    Programmers are the people who write software. They are sometimes called developers.
    Programmers work with others to create the applications that run on top of these
    systems. Ubuntu is a great platform for writing and testing software. This is
    true whether you are doing web application development or writing software for
    desktop or server systems. It also makes a great platform for learning new programming
    languages and trying out new ideas. This book can help you get started.


    DevOps is a portmanteau of developer and operations. It signifies a blending of
    the two roles already described. The information technology (IT) world is changing,
    and roles are becoming less clear and isolated from one another. In the past,
    it was common to witness battles between programmers excited by new technology
    and sysadmins in love with stability. DevOps realizes that neither goal is healthy
    in isolation, but seeking a balance between the two can yield results by removing
    the barriers to communication and understanding that sometimes cause conflict
    within a team. Because of the rise of cloud computing and virtualization, also
    covered in this book, and more agile forms of development, DevOps is a useful
    perspective that enables people working in IT to do an even better job of serving
    their ultimate clients: end users. This book is a great foundation for those wanting
    to learn knowledge that will help with both roles, hopefully presented in a way
    that balances them nicely.


    ## What This Book Contains


    Ubuntu Unleashed is organized into six parts, described here. A disc containing
    the entire distribution is included so that you have everything you need to get
    started.


    - Part I, "Installation and Configuration" takes you through installing Ubuntu
    on your computer in the place of any other operating system you might be running,
    such as Windows.


    - Part II, "Desktop Ubuntu" is aimed at users who want to use Ubuntu on desktop
    systems.


    - Part III, "System Administration," covers both elementary and sophisticated
    details of setting up a system for specific tasks and maintaining that system.


    - Part IV, "Ubuntu as a Server," gives you the information you need to start building
    your own file, web, and other servers for your home or office.


    - Part V, "Programming Linux," provides a great introduction to how you can extend
    Ubuntu capabilities further using the development tools supplied.


    In addition to what has already been mentioned, after the spring release of Ubuntu,
    bonus chapters will be available online at www.informit.com/title/9780134511884-


    In addition, this book is part of InformIt''s exciting Content Update Program,
    which provides content updates for major technology improvements! As significant
    updates are made to Ubuntu, sections of this book will be updated or new sections
    will be added to match the updates to the technologies. As updates become available,
    they will be delivered to you a free Web Edition of this book, which can be accessed
    with any Internet connection. To learn more, visit informit.com/cup.


    How to access the Web Edition: Follow the instructions inside to learn how to
    register your book to access the FREE Web Edition.


    ## Conventions Used in This Book


    It is impossible to cover every option of every command included in Ubuntu. Besides,
    with the rise of the Internet and high-speed connections, reference materials
    are far less valuable than they used to be because of these details are only a
    quick Google search away. Instead, we focus on how to find information you need
    while giving a quality overview worthy of the intermediate or advanced user. Sometimes
    this book offers tables of various options, commands, and keystrokes to help condense,
    organize, and present information about a variety of subjects.


    To help you understand code listing examples and sample command lines, several
    formatting techniques are used to show input and ownership. For example, if the
    command or code listing example shows typed input, the input is formatted in boldface
    after the sample command prompt, as:


    ```

    mathew@semour:- ls

    ```


    If typed input is required, as in response to a prompt, the sample typed input
    is also in boldface, like so:


    ```

    Delete files? [Y/n] y

    ```


    All statements, variables, and text that should appear on your display use the
    same boldface formatting. command lines that require root or super-user access
    are prefixed with the sudo command, as:


    ```

    mathew@semour:- sudo printinfo &

    ```


    Other formatting techniques include the use of italic for placeholders in computer
    command syntax. Computer terms or concepts are also italicized upon first introduction
    in text.


    Finally, you should know that all text, sample code, and screenshots in Ubuntu
    Unleashed were developed using Ubuntu and open-source tools.


    Read on to start learning about using the latest version of Ubuntu.


    # CHAPTER 9


    ## IN THIS CHAPTER


    ### Managing Software


    - Ubuntu Software

    - Using Synaptic for Software Management

    - Staying Up-to-Date

    - Working on the Command Line

    - Compiling Software from Source

    - Configuration Management

    - Snappy Ubuntu Core

    - Using Snaps

    - References


    In this chapter, we look at the options you have to manage your software in Ubuntu.
    If you are used to an environment where you are reliant on visiting different
    vendor websites to download updates, you are in for a pleasant surprise. Updating
    a full Ubuntu installation, including all the application software, is as simple
    as running the Update Manager program. You will discover how easy it is to install
    and even remove software packages.


    Ubuntu provides a variety of tools for system resource management. The following
    sections introduce the graphical software management tools that you will use for
    most of your software management. This chapter also covers monitoring and disk
    storage on your system.


    ## Ubuntu Software


    Ubuntu Software is a graphical utility for package management in Ubuntu. You can
    find it in the Applications menu as Ubuntu Software; the package and executable
    program is named ubuntu-software. Ubuntu Software enables you to easily select
    and install a large array of applications by using the intuitive built-in and
    easy one-click installation. When you open the program, you see the main screen,
    as shown in Figure 9.1.


    Along the top side of the screen, you have three menu options: All, Installed,
    and Updates. Just below that is a search bar you can use to search for packages.
    Scroll down to find software listed by categories.


    ![](img/11c82181e4caaaf9479163b62848851c_40_0.png)


    FIGURE 9.1 The initial Ubuntu Software screen enables you to browse through packages
    sorted by groups.


    Installing new software via Ubuntu Software is as simple as finding it in the
    package list, double-clicking, and clicking the Install button. When you do so,
    you may be asked for your password; then the application is downloaded and installed.
    You can remove an application by finding it in Ubuntu Software and clicking the
    Remove button.


    ## Using Synaptic for Software Management


    Ubuntu Software works just fine for adding and removing applications, but if you
    need to install something specific—such as a library—you need to use Synaptic
    (Figure 9.2). You can install Synaptic using Ubuntu Software described earlier;
    it is not installed by default.


    ![](img/11c82181e4caaaf9479163b62848851c_41_0.png)


    FIGURE 9.2 For more advanced software management in a GUI, Synaptic is the preferred
    tool.


    Along the left are software categories (although this there are more of them),
    along the top right are package selections for that category, and on the bottom
    right is the currently selected package. To install or remove software, click
    the check box to the left of its name, and you''ll see a menu that offers the
    following options:


    - *Unmark—If you have marked this package for installation, upgrade, or one of
    the other options, this option removes that mark.

    - *Mark for Installation—Add this package to the list that will be installed.

    - *Mark for Reinstallation—If you have some software already installed, but for
    some reason it''s not working, this option reinstalls it from scratch. Existing
    configuration files are retained, any edits you make are safe.

    - *Mark for Upgrade—If the software has updates available, this option downloads
    and installs them.

    - *Mark for Removal—This option deletes the selected package from your system
    but leaves its configuration files intact so if you ever reinstall it you do not
    have to reconfigure it.

    - *Mark for Complete Removal—This option deletes the selected package from your
    system but also removes any configuration files, purging everything from the system.

