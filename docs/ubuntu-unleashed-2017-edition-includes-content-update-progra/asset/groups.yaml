    在本章中，我们将查看你在 Ubuntu 中管理软件的各种选项。如果你习惯于访问不同的供应商网站下载更新，那么你将获得一个惊喜。更新整个 Ubuntu 安装（包括所有应用程序软件）只需运行“更新管理器”（Update
