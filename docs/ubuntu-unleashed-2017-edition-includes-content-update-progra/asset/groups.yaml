    to be simple to use: When you run it, Software Updater automatically downloads
    the list of updates available and checks all in the list it shows. If the update
    list was downloaded not too long ago, for Ubuntu to refresh the list of available
    updates by clicking the Check button. Otherwise, you need to click Install Updates
    to bring your system up to date. If you want a little more information about the
    updates, click Show Details at the bottom to see what has changed in the update.


    ![](img/11c82181e4caaaf9479163b62848851c_43_0.png)


    > FIGURE 9.3 If you need to update your software to apply bug fixes and security
    upgrades, use Software Updater.


    Ubuntu automatically checks for updates periodically and notifies you when critical
    updates are available. However, there’s no harm running Software Updater yourself
    so often, just to make sure; it’s better to be safe than sorry.


    # Working on the Command Line


    With much software available for installation, it is no surprise that Debian-based
    distros have many ways to manage software installation. At their root, however,
    they use Debian''s well-renowned Advanced Package Tool (APT). A person on Slashdot.com
    once said, "Welcome to Slashdot. If you can''t find anything original, just say
    how much APT rocks and you''ll fit right in." You see, even though many other
    distros have tried the power of APT, nothing ever comes close.


    Why is APT so cool? Well, it was the first system to properly handle dependencies
    in software. Other distros, as Red Hat, used RPM files that had dependencies.
    For example, an RPM for Gimp would have a dependency on Gtk, the graphical toolkit
    on which Gimp is based. So, if you tried to install your Gimp without having the
    Gtk RPM, your install would fail. So, you grab the Gtk RPM and try again. Again:
    Gtk has dependency on three things you need to download. And three other things
    have dependencies on 20 other things. And so, and so, and so on, until you can''t
    find a working RPM for one of the dependencies, and you give up.


    APT, on the other hand, was designed to automatically find and download dependencies
    for your packages. So, if you want to install Gimp, it downloads Gimp''s package
    and any other software it needs to work. No more hunting around by hand, no more
    worrying about finding the right, and certainly no more need to compile things
    by hand. APT also handles installation resuming, which means that if you lose
    your Internet connection-way through an upgrade (or your battery runs out, or
    you have to quit, or whatever), APT picks up where it left off when you run it.


    # Day-to-Day Usage


    To enable you to search for packages both quickly and thoroughly, APT uses a local
    cache of the available packages. Try running this command:


    ```

    mathew@seymour:-$ sudo apt-get update

    ```


    The apt-get update command instructs APT to contact all the servers it is configured
    to use and download the latest list of updates. If your updates are outdated,
    it takes a minute or two for APT to download the updates. Otherwise, this command
    executes in a couple of seconds.


    After the latest package information has been downloaded, you are returned to
    the command line. You can now ask APT to automatically download any software that
    has been updated, using this command:


    ```

    mathew@seymour:-$ sudo apt-get upgrade

    ```


    If you have a lot of software installed on your machine, there is a greater chance
    of things being updated. APT scans your software and compares it to the latest
    package information from the servers and produces a report like this:


    ```

    mathew@seymour:-$ sudo apt-get upgrade

    Reading package lists...

    Building dependency tree...

    Reading state...

    The following packages will be upgraded:

    ```


    # Working on the Command Line


    Reading package lists...

    Building dependency tree...

    Reading state...

    The following packages will be upgraded:


    Each part of report tells you something important. Starting at the top, the "the
    following packages will be upgraded" gives you the exact list of packages for
    which updates are available. If you are installing new software or removing software,
    the lines "The following packages will be installed" and "The packages will be
    removed." At the end shows a total of 21 packages that APT will upgrade, with
    0 new packages, 0 to remove, and 0 not upgraded. Because this is an upgrade rather
    than an installation of new software, all new packages take up only 623KB of additional
    space. Although you have 84.8MB download, the packages are overwriting files.

    Do you want to continue?


    It''s important to understand that a basic apt-upgrade never removes software
    or adds new software. As a result, it is safe to keep your system fully patched
    because it should never break things. However, occasionally you will see the "0
    not upgraded" status, which means some things cannot be upgraded. This happens
    when some software must be installed or removed to satisfy the dependencies of
    the updated package, as previously mentioned, apt-upgrade will never do.


    In this situation, you need to use apt-get dist-upgrade, named because it''s designed
    to allow users to upgrade from one version of Debian/Ubuntu to a new version—an
    upgrade that involves changing everything about the system, removing obsolete
    software, and installing the latest features. This is one of the most-loved features
    of Debian because it enables you to move from version to version without having
    to download and install new DEBs.


    Keeping regular upgrades and dist upgrades separate is very useful for making
    sure that security updates and simple bug fixes don''t change software configurations,
    especially on a machine that needs to be consistently available and working.


    Whereas apt-upgrade and apt-get dist-upgrade are there for upgrading packages,
    apt-get install is responsible for adding new software. For example, if you want
    to install the MySQL database server, you run:


    ```

    $ matthew@seymour:$ sudo apt-get install mysql-server

    ```'
