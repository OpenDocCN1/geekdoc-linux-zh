    # Introduction


    We are pleased to present the 2017 edition of Ubuntu Unleashed. Ubuntu is a Linux-based
    computer operating system that has taken the world by storm. From its humble beginning
    in 2004, Ubuntu has risen to the vanguard of Linux, as well as a popular choice
    for servers.


    Ubuntu descends from one of the oldest and most revered distributions, Debian.
    Debian is assembled by a team of talented volunteers; it is one of the most stable
    and customizable distributions of Linux, and is well respected for its quality
    and technological prowess. It is, however, an operating system for geeks; the
    bar for entry into the Debian realm is high, and its usability tends to be highly
    proficient and expects new users to learn the ropes before joining in. That is
    both appropriate and okay.


    What Ubuntu has done is to leverage the quality of Debian to create an operating
    system that ordinary people can use. That doesn''t mean Ubuntu users are not technologically
    proficient, just that they do not have to be. In fact, many talented volunteer
    software developers love Ubuntu because it enables them to concentrate on their
    specific interests instead of the details of the operating system. This book is
    for these people and for those who aspire to join their ranks.


    If you are new to Linux, you have made a great decision by choosing this book.
    Sams Publishing''s Unleashed books offer an in-depth look at their subjects, taking
    in both beginner and advanced users and moving them to a new level of knowledge
    and expertise. Ubuntu is a fast-changing distribution that has an updated release
    twice a year. We have tracked the development of Ubuntu from early on to make
    sure that the information in this book mirrors closely the development.


    ## IN THIS INTRODUCTION


    - Licensing

    - Who This Book Is For

    - What This Book Contains

    - Conventions Used in This Book


    # Introduction


    The development of the distribution. A full copy of Ubuntu is included on the
    enclosed disc, and it is possible to install Ubuntu from that disc in less than
    an hour!


    ## A QUICK WORD ABOUT MARKETING


    Almost all the content in this book allows regardless of what Ubuntu version you
    are using, so long as it is reasonably clear. The book has been written to try
    to focus on information that is useful for the longest time possible. Some chapters,
    those covering the basics of the graphical user interface, will have their information
    change frequently. Those chapters are the exception. The blurb on the cover of
    the book denotes which editions this book was added to and when the book was most
    revised.


    Do not let the highly technical nature of Linux discourage you, however. Many
    people who have heard of Linux that is found only on servers, looking after websites,
    nothing could be further from the truth. Distributions like Ubuntu are making
    huge inroads to the market. Corporations are realizing the benefits of running
    a stable and powerful operating system that is easy to maintain and secure. The
    best part is that majority of those improvements are shared freely, allowing you
    to benefit from the additions made by one distribution, such as Red Hat, which
    in turn shares its improvements. You can put Ubuntu to work today and be assured
    of a great user experience.


    ## Licensing


    Software licensing is an important issue for all users and can entail moral, legal,
    and financial considerations. Many consumers think that purchasing a copy of commercial
    or proprietary operating system, application, or utility conveys ownership, but
    this is not true. In majority of cases, the end user agreement (EULA) included
    with commercial software states that you have paid only for the right to use.
    This generally means you may not copy, share, or transfer ownership of the software.
    More onerous software licenses enforce terms that preclude you from distributing
    or publishing reviews of the software. Even more insidious licensing schemes (and
    especially in the US) contain provisions allowing auditing of the software. This
    is not the case with the software included in this book. You are entirely free
    to copy, share, and install the software on as many computers as you want—we encourage
    you to purchase additional copies of this book, however. Be sure to read the README
    file included with Ubuntu for important information regarding the software and
    after you install Ubuntu, go to www.gnu.org/licenses/gpl.html to find a copy of
    the GPL. You will see that the GPL grants freedom to use, share, modify, and even
    sell the software. You can put your copy of Ubuntu to work right away in your
    home or at your workplace without worrying about software licensing or royalty
    payments. However, be aware that although much of the software included with Ubuntu
    is licensed under the GPL, some packages are licensed under other terms. There
    is a variety of software licenses, and many packages fall under a broad definition
    known as open source. Some of these include the Artistic License, the BSD License,
    the Mozilla Public License. For additional information about GNU licenses, browse
    to www.gnu.org/. For a definition of open source and licensing guidelines, along
    with links to the terms of nearly all open-source licenses, browse to www.opensource.org/.


    ## This Book Is For


    This book varies its coverage from shallow to its wide range of topics. This is
    intentional. There are some topics that are Ubuntu-specific and are not covered
    by any other book, and deserve deep coverage. There are some topics that every
    power user must master. There are other topics that power users know about—they
    understand some history, other options, or simply what they need to participate
    in discussions with technical people without being completely confused.


    Some topics, like the Linux command line, receive deep and extensive coverage
    because I believe information is vital to anyone who wants to be a power user
    or become a skilled guru. That topic gets two full chapters. Other topics, like
    ADA, Fortran, and more than 15 other programming languages, get brief coverage
    to help people who are interested a few guideposts to continue. In this case,
    around 20 programming languages are covered in about dozen pages. These are useful
    topics to some, but not I consider vital.


    Additionally, some topics are too broad to be covered in great depth in this book,
    but again, an intermediate to advanced user should have at least a foundational
    knowledge of these. They are covered and information is provided to help you find
    more resources and expand your understanding as needed.


    ## Those Wanting to Become Intermediate or Advanced Users


    Ubuntu Unleashed is intended for intermediate and advanced users or those who
    want to become one. Our goal is to give you a nudge in the right direction to
    help you enter the higher stages by exposing you to as many different tools and
    ideas as possible; we want to give you some thoughts and methods to consider and
    spur you to seek out more.


    # Introduction


    Although the contents are aimed at intermediate to advanced users, new users who
    pay attention will benefit from the advice, tips, tricks, and techniques presented
    in each chapter. Pointers to more detailed or related information are also provided
    at the end of each chapter.


    If you are new to Linux, you might need to learn some new computer skills, as
    how to research your computer''s hardware, how to partition a hard drive, and
    (occasionally) how to use a command line. This book helps you learn these skills
    and shows you how to learn more about your computer, Linux, and the software with
    Ubuntu. Most important, it helps you overcome your fear of the system by telling
    you what it is and how it works.


    We would like to take a moment to introduce a concept called “The Three Levels
    of Listening” from Alistair Cockburn’s Agile Software Development, published by
    Addison Wesley. These describe how a person learns and masters a technique. We
    all start at the first stage and progress from there. Few reach the last stage,
    but those who do are incredibly effective and efficient. People aiming for this
    stage are the very ones for whom we intend this book.


    - **Following**—The stage where the learner follows one very detailed process
    that works and sticks to it to accomplish a task.

    - **Detaching**—The stage where the learner feels comfortable with one method
    and begins to learn other ways to accomplish the same task.

    - **Fluent**—The stage where the learner has experience with or understanding
    of many methods and doesn’t think of any of them in particular while doing a task.


    My books focus on the first set of users. This is not one of them.

    '
