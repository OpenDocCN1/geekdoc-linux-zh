  \ char *pathname, uid_t owner, gid_t group);\n```\n\n所有权更改后，原所有者将失去对文件的访问权限。模式是\
  \ stat 结构体中 `st_mode` 成员常量的按位或结果。\n\n# 挂载与卸载文件系统\n\n`mount` 系统调用将磁盘指定分区上的文件系统连接到现有的文件系统层次结构。因此，`mount`\
  \ 系统调用允许用户将磁盘区域视为文件系统而不是一系列磁盘块。\n\n### 原型\n\n```c\nint mount (const char * source\
  \ , const char * target , const char * filesystemtype , unsigned long mountflags\
  \ , const void * data );\n```\n\n`mount()` 将`source`指定的文件系统（通常是设备名，也可以是目录或占位符）挂载到`target`指定的目录上。\n\
  \n`umount` 系统调用断开文件系统并释放层次结构。\n\n### 原型\n\n```c\nint umount(const char *target);\n\
  ```\n\n`umount2()` 移除挂载在 `target` 上的（顶层）文件系统的连接。\n\n# 目录相关系统调用\n\n与文件相关的系统调用一样，UNIX\
  \ 内核还定义了一组用于执行 UNIX 中目录相关操作的系统调用；在 UNIX 中，一切都被视为文件。这些系统调用用于用于创建、删除和操作目录内容。\n\n##\
  \ mkdir 系统调用\n\n`mkdir()` 函数用于创建一个由路径指向的名称的新目录。\n\n### 原型\n\n```c\nint mkdir(const\
  \  char *path, mode_t mode);\n```\n\n新目录的模式由 `mode` 初始化。`mode` 参数的保护部分会根据进程的文件创建掩码进行修改。\n\
  \n目录的所有者 ID 设置为进程的有效用户 ID。目录的组 ID 设置为进程的有效组 ID；或者如果父目录中设置了 `S_ISGID` 位，则目录的组 ID\
  \ 继承自父目录。新目录的 `S_ISGID` 位也继承自父目录。\n\n如果 `path` 指向一个符号链接，`mkdir()` 将失败并将 `errno`\
  \ 设置为 `EEXIST`。\n\n新创建的目录是空的，除了自身 (.) 和其父目录 (..) 的条目外。\n\n 成功完成后，系统调用返回 `0`。否则，返回\
  \ `-1`，不创建目录，且 `errno` 设置以指示错误。\n\n## rmdir 系统调用\n\n`rmdir()` 系统调用用于删除名为 `path`\
  \ 的目录文件。该目录不能包含“.”和“..” 之外的任何条目。\n\n### 原型\n\n```c\nint rmdir(const char *path);\n\
  ```\n\n`rmdir()` 函数成功时返回值 `0`；否则返回值 `-1`，并设置全局变量 `errno` 以指示错误。\n\n如果通过此调用目录的链接计数变为\
  \ 0 且没有其他进程打开该目录，则该目录占据的空间将被释放。\n\n# chdir() 系统调用\n\n`chdir()` 系统调用用于更改参数 `path`\
  \ 所的当前目录。执行 `chdir()` 系统调用的进程必须对目录具有执行权限。\n\n### 原型\n\n```c\nint chdir(const char\
  \ *path);\n```\n\n成功完成后，`chdir()` 返回值 `0`。否则，返回 `-1`，并设置 `errno` 以指示错误。\n\n# UNIX\
  \ 标准 I/O 库\n\nUNIX 标准 I/O 库用于为程序提供流式 I/O 接口。流式 I/O 接口为程序提供输入和写入产生的输出的一种简单且高效的方法。\n\
  \n标准输入、标准输出和标准错误三个流在程序开始执行时默认会被打开并提供给程序。\n\n# 流和 FILE 对象\n\n流是读写数据的移植方式。\n\n流可以是一个文件，也可以是物理设备（例如打印机或显示器）。所有流都由内部\
  \ C 数据结构 `FILE` 定义。`FILE` 数据结构在 `stdio.h` 中声明，通过指向流的指针进行操作。要在 C 程序中对流进行 I/O 操作，仅需引用\
  \ `FILE` 结构即可。\n\n在进行任何访问它的 I/O 操作之前必须打开流，并在使用后关闭它。\n\n# I/O 缓冲\n\n缓冲用于最少化读写调用的次数。I/O\
  \ 缓冲基本上有三种类型，将在后续章节中讨论。\n\n## 全缓冲/块缓冲 (Fully/blocked buffered)\n\n当流被设置为块缓冲时，许多字符会被保存并作为一个块写入。通常，所有文件都是块缓冲的。只有当缓冲区满时才会发生实际的\
  \ I/O 操作。当对文件发生第一次 I/O 操作时，会调用 `malloc(3)` 并获取一个大小的缓冲区。\n\n`flush` 术语描述标准 I/O 缓冲区的写入。缓冲区可以通过标准\
  \ I/O 例程自动刷新，也可以显式使用 `fflush` 刷新。\n\n标准输入和输出是全缓冲的，除非它们被称为交互式设备。\n\n## 行缓冲 (Line\
  \ buffered)\n\n当流是行缓冲时，字符会被保存直到输出换行符 (`\\n`) 或读取输入。行缓冲通常用于指向终端的流。\n\n# 无缓冲 I/O\n\
  \n标准 I/O 库不对字符进行缓冲。当输出流是非缓冲的时，信息一旦写入就会显示在目标文件中。例如，通过使用 `write(2)` 调用，标准错误流通常是非缓冲的。任何错误消息都会尽快显示（无论它们是否包含换行符）。\n\
  \n# 流缓冲操作\n\nUNIX 提供了缓冲操作来避免频繁访问外部存储。缓冲使得数据读写不再耗时。\n\n# setbuf(3), setvbuf(3)\n\n\
  函数必须在流打开之后、执行其他操作之前调用。`setbuf(3)` 用于开启或关闭缓冲。\n\n### 原型\n\n```c\nvoid setbuf ( FILE\
  \ * stream , char * buf );\n```\n\n要启用缓冲，`buf` 必须指向长度为 `BUFSIZ` 的缓冲区。要禁用缓冲，将 `buf`\
  \ 设置为 NULL。\n\n`setvbuf()` 可更改流的缓冲行为。\n\n### 原型\n\n```c\nint setvbuf ( FILE * stream\
  \ , char *buf , int mode , size_t size );\n```\n\n`mode` 参数必须是以下三个宏之一。`size` 参数可以给零以获取延迟执行：\n\
  \n```c\n#define _IOFBF 0 /* setvbuf 应设置为全缓冲 */\n#define _IOLBF 1 /* setvbuf 应设置为行缓冲\
  \ */\n#define _IONBF 2 /* setvbuf 应设置为无缓冲 */\n```\n\n# 刷新流\n\n当调用 `fflush()` 函数时，所有缓冲给指定输出的数据都会强制写入由流参数指向的\
  \ `FILE` 对象。该流保持打开状态。流参数被设置为 NULL，然后所有打开的输出流都将被刷新。第二个函数 `fpurge()` 删除给定流中的所有输入或输出缓冲。\n\
  \n\n\n\n\n```\nint fflush ( FILE * stream );\n```\n\n```\nint fpurge ( FILE * stream\
  \ );\n```\n\n# 打开流 (Opening a stream)\n\n`fopen()` 函数用于打开由 `pathname` 指向的字符串指定名称的文件，并与其关联一个全缓冲流。它还会清除流的错误标志位和文件结束标志位。\n\
  \n### 原型 (Prototype)\n```c\nFILE * fopen ( const char *path , const char * mode\
  \ );\n```\n\n`freopen()` 函数首先尝试刷新（flush）流并关闭与流关联的任何文件描述符，但刷新或关闭文件描述符的成功与否会被忽略。它清除流的错误标志位和文件结束标志位。\n\
  \n`freopen()` 函数打开由 `pathname` 指向的字符串指定名称的文件，并将 `stream` 指向的流与其关联。`mode` 参数的使用方式与\
  \ `fopen` 相同。\n\n### 原型 (Prototype)\n```c\nFILE * freopen ( const char *path , const\
  \ char *mode , FILE * stream );\n```\n\n`fdopen()` 函数将流与文件描述符关联。\n\n### 原型 (Prototype)\n\
  ```c\nFILE * fdopen ( int fildes , const char * mode );\n```\n\n以下是打开流的不同模式：\n\n\
  | 模式 | 说明 (Description) |\n| :--- | :--- |\n| R | 以读打开文件 |\n| r+ | 以读写打开 |\n| W\
  \ | 将文件截断为零长度或创建一个用于写入的文本文件 |\n| w+ | 以读写打开。如果文件不存在则创建它；否则，将其截断。 |\n| a | 以写打开。如果文件不存在则创建它。\
  \ |\n| a+ | 以读写打开。如果文件不存在则创建它。 |\n\n**表 2.1:** 流打开模式\n\n以下是打开流的限制条件：\n\n| 限制 (Restriction)\
  \ | r | w | a | r+ | w+ | a+ |\n| :--- | :--- | :--- | :--- | :--- | :--- | :---\
  \ |\n| 文件必须已存在 | x | | | x | | |\n| 文件的原有内容被丢弃 | | x | | | x | |\n| 流可以读取 | x |\
  \ | | x | x | x |\n| 流可以写入 | | x | x | x | x | x |\n| 流只能在末尾写入 | | | x | | | x |\n\
  \n**表 2.2:** 流的打开限制\n\n# 关闭流 (Closing a stream)\n\n`fclose()` 函数关闭文件并将命名的流与文件解除关联。如果该流正用于输出，则会先使用\
  \ `fflush(3)` 写入任何缓冲数据。如果标准库自动分配了缓冲区，该缓冲区将被释放。\n\n```c\nint fclose (FILE * stream);\n\
  ```\n\n# 读写写流 (Reading and writing a stream)\n\n一旦流被打开，就可以执行三种不同类型的非格式化 I/O：\n\n\
  *   逐字符处理 (Character-at-a-time)：每次读写一个字符，由标准 I/O 函数处理所有的缓冲（如果流是缓冲的）。\n*   逐行处理 (Line-at-a-time)：使用\
  \ `fgets(3)` 和 `fputs(3)` 函数每次读取或写入一行。每行都以换行符结束。\n*   直接操作 (Direct)：`fread(3)` 和\
  \ `fwrite(3)` 函数分别读取或写入若干对象，其中每个对象的大小是指定的。\n\n# 逐字符读取 (Reading one character at\
  \ a time)\n\n以下是读取字符的原型：\n\n```c\nint fgetc ( FILE * stream );\nint getc ( FILE\
  \ * stream );\nint getchar ( void );\nint getw ( FILE * stream );\n```\n\n在这里，`fgetc()`\
  \ 函数从 `stream` 参数指向的流中获取下一个输入字符（如果存在），或者获取通过 `ungetc(3)` 推回流的下一个字符。`getw()` 从 `stream`\
  \ 指向的流中获取下一个 int（如果存在）。\n\n# 逐字符写入 (Writing one character at a time)\n\n以下是写入字符的原型：\n\
  \n```c\nint fputc ( int c, FILE * stream );\nint putc ( int c, FILE * stream );\n\
  int putchar ( int c);\nint putw ( int w, FILE * stream );\n```\n\n`fputc()` 将一个字符（转换为无符号\
  \ `char`）写入由 `stream` 指向的输出流（例如显示器）。它可能会多次评估流，因此传递 `putc()` 的参数不应该是具有潜在副作用的表达式。`putw()`\
  \ 将指定的整数写入命名的输出流。\n\n# 逐行读取 (Reading one line-at-a-time)\n\n以下是读取一行的原型：\n\n```c\n\
  char * fgets ( char *str , int size , FILE * stream );\nchar * gets ( char * str\
  \ );\n```\n\n`fgets()` 和 `gets()` 函数分别用于从 `stdin` 或指定的流读取行到缓冲区中。\n\n# 逐行写入 (Writing\
  \ one line at-a-time)\n\n以下是写入一行的原型：\n\n```c\nint fputs ( const char *str , FILE\
  \ * stream );\nint puts ( const char * str );\n```\n\n`fputs()` 和 `puts()` 分别用于将\
  \ `str` 指向的字符串写入流和 `stdout`。\n\n# 直接 I/O (Direct I/O)\n\n直接 I/O 函数用于从/在 `FILE *stem`\
  \ 对象读写对象。对象的大小由 `size` 参数给出。\n\n### 原型 (Prototypes)\n```c\nsize_t fread ( void *ptr\
  \ , size_t size , size_t nm , FILE * stream );\nsize_t fwrite ( const void *ptr\
  \ , size_t size , size_t nm , FILE * stream );\n```\n\n在这里，`fread()` 从 `stream`\
  \ 指向的流中读取若干个对象并存储在 `ptr` 中。每个对象的大小由 `size` 参数给出。`fwrite()` 将存储在 `ptr` 位置的对象写入 `stream`。\n\
  \n# 标准数据文件 (Standard data files)\n\nUNIX 维护了一些标准数据文件来管理用户文件访问权限。这些文件只有 root 权限可以访问。这些文件包含用户、组和密码有效期的信息。这些文件存储在\
  \ `/etc` 目录下。\n\n# /etc/passwd 文件\n\n`/etc/passwd` 文件是一个 ASCII 文件，包含每个用户的条目。每个条目定义了应用于用户的基本属性。当向系统添加新用户时，`/etc/passwd`\
  \ 文件会被更新。\n\n`/etc/passwd` 中的条目格式如下：条目中的属性用冒号分隔。\n\n`Name:Password:UserID:PrincipleGroup:Gecos:HomeDirectory:Shell`\n\
  \n属性定义如下：\n\n| 属性 |string (Description) |\n| :--- | :--- |\n| Name | 指定用户的登录名。登录名必须是\
  \ 8 个字节以内包含数字和特殊字符的字符串。 |\n| Password | 字符 `x` 表示加密密码存储在 `/etc/shadow` 文件中。 |\n\
  | UserID | 指定用户的唯一 ID。UserID 为整数。 |\n| PrincipleGroup | 指定用户的主组 ID。这必须是用户数据库中的组\
  \ ID 或由网络服务定义的组。该值为唯一的整数。 | |\n| Gecos | 指定系统不需要的用户通用信息。 |\n| HomeDirectory | 指定用户主目录的完整路径。如果用户没有定义主目录，则使用访客的主目录。该值为字符字符串。\
  \ |\n| Shell | 指定用户调用 `login` 命令或 `su` 命令后执行的初始程序或 shell。如果用户没有定义 shell，则使用系统 shell\
  \ `/usr/bin/sh`。该值为字符字符串，可以包含传递给初始程序的参数。 |\n\n**表 2.3:** 文件属性及其说明\n\n# /etc/group\
  \ 文件\n\n`/etc/group` 文件是一个 ASCII 文件，包含系统组的记录。每个条目包含组的基本属性。每个条目具有以下格式：\n\n`Name:Password:ID\
  \ :User-List`\n\n属性用冒号分隔。记录用换行符分隔。\n\n| 属性 | 说明 (Description) |\n| :--- | :--- |\n\
  | Name | 指定一个在系统中是唯一的组名。组名是 8 个字节以内的字符串。 |\n| Password | 不使用。 |\n\n\n\n\n\n| `ID`\
  \ | 指定组 ID。该值是一个唯一的十进制字符串。 |\n| `User-List` | 标识一个或多个用户的列表。每个用户之间用逗号分隔。每个用户必须已在本地数据库配置文件中定义。\
  \ |\n\n**表 2.4:** 组属性及描述\n\n# /etc/shadow 文件\n\n`/etc/shadow` 文件以加密格式存储用户账户的实际密码，并包含与用户密码相关的其他属性。通常，该文件每行对应\
  \ `/etc/passwd` 文件中列出的每个用户包含一个条目。每个条目具有如下格式：\n\n```\nsmithj:Ep6mckrOLChF.:10063:0:99999:7::::\n\
  ```\n\n每个字段由冒号 (:) 分隔：\n\n| 用户名 | 指定用户的登录名。 |\n| :--- | :--- |\n| 密码 | 指定加密密码。密码长度至少为\
  \ 6–8 位，包括特殊字符/数字。 |\n| 上次修改密码时间 (`lastchanged`): | 自 1970 年 1 月 1 日以来最后一次修改密码的天数。\
  \ |\n| 最小间隔 | 两次密码更改所需的最少日数，即用户允许更改密码前剩余的天数。 |\n| 最大有效 | 密码有效的最大天数（超过后用户将被强制更改密码）。\
  \ |\n| 警告期 | 在密码过期前多少天，用户会被警告必须更改密码。 |\n| 停用 | 密码过期后该账户被禁用的天数。 |\n| 过期 | 自 1970\
  \ 年 1 月 1 日以来该账户被禁用的天数，即指定登录不再再次可用的绝对日期。 |\n\n**表 2.5:** shadow 记录中的字段及描述\n\n最后六个字段提供了密码有效期和账户锁定功能（你需要使用\
  \ `change` 命令来设置密码有效期）。根据 `shadow` 的 man 手页——密码字段必须填充。加密密码由 13–24 个字符组成，字符取自 64\
  \ 位字母表，包括 a 到 z、A 到 Z、0 到 9、`.` 和 `/`。可选情况下，它可以以 `$` 字符开头。这意味着加密密码是使用另一种（非 DES）算法生成的。例如，如果以\
  \ `$1$` 开头，则意味着使用了基于 MD5 的算法。\n\n## 结论\n\nUNIX 提供了多种执行输入输出操作的方法。两种最主要的方法是 I/O 系统调用和库函数。库函数在内核层级执行时，也会转换为相应的系统调用。UNIX\
  \ 内核维护了各种数据结构来管理所有打开的文件。用户进程如何访问文件由管理员向用户提供的文件访问权限控制。为了管理文件访问，用户被分为三类，即所有者、组员和其他。所有者可以向所有其他类型的用户提供访问。所有组员共享相同的访问权限。UNIX\
  \ 还提供了库函数来对读写数据进行缓冲。维护 I/O 缓冲区是为了避免频繁访问外部设备并加快输入输出操作。在第 1 和第 2 章分别完成了进程和文件管理这两个主要部分后，后续章节将讨论\
  \ UNIX Shell 环境，并为处理进程和文件提供用户界面。\n\n# 复习练习\n\n1. 使用 `setvbuf` 实现 `setbuf`。\n2. 如果文件创建掩码设置为\
  \ 777 会发生什么？\n3. 你如何只设置两个时间中的一个？\n4. UNIX 对目录树的深度是否有根本性限制？为了找出答案，请编写一个程序。\n5. UNIX\
  \ 文件系统的数据块中究竟存储了什么？\n6. 两个进程可以同时打开一个文件吗？说明你的理由。\n7. 什么是密码有效期？\n8. 编写一个程序，让用户有机会删除当前工作目录中的任何或所有文件。应显示文件名，随后提示是否要删除该文件。\n\
  \n# 第 3 章\n\n## 进程管理\n\n### 引言\n\n内核代表用户进程执行各种原始操作。这些操作包括通过允许进程的创建、终止或挂起以及通信来控制进程的执行。公平地调度进程以便在\
  \ CPU 上执行。为执行进程分配内存和辅助内存。保护进程的地址空间。内核还控制对终端等外设备的访问。UNIX 在系统中执行的不同进程之间维持父子关系。UNIX\
  \ 内核通过不同的进程 ID（PID）维护这一进程树，以保持对进程创建、执行和终止的控制。本章将讨论所有这些执行有效进程管理的原始操作。\n\n## 结构\n\n\
  我们本章将涵盖以下主题：\n\n* 进程及其关系\n* 进程相关操作\n* 进程控制与执行\n* 为执行的进程分配内存\n* 进程通信\n\n## 目标\n\n\
  学习本章后，你将能够：\n\n* 理解进程管理的基本概念\n* 学习如何在 UNIX 系统中识别进程\n* 熟悉创建、执行、终止和挂起等进程相关操作\n* 理解进程之间如何通信\n\
  * 理解 UNIX 如何控制进程的执行和切换\n\n### UNIX 进程\n\n正在执行的程序是一个进程。在 UNIX 中，进程是一个工作单元。系统由一组进程组成：执行系统代码的操作系统进程和执行用户代码的用户进程。所有进程通过\
  \ CPU 在进程之间切换来并发执行。\n\n进程通过遵循严格的指令序列执行，这些指令是自包含的且不会跳转到另一个进程的指令。\n\n### 进程 ID\n\n\
  每个进程都有一个称为进程 ID 的数字，用于唯一标识它。`getpid()` 函数用于获取进程的 ID。UNIX 中的进程具有父子关系。每个进程有一个父进程和多个进程。\n\
  \n进程 ID 0 是调度进程，称为交换进程（swapper）。交换进程是内核的一部分，被称为系统进程。\n\n`init` 进程（进程 ID 1）是进程分发器，它产生\
  \ shell，而我们启动的所有进程都是 shell 的子进程，因此 init 进程的后代。Init 是一个普通用户进程且永远不会。\n\nUNIX 在名为进程表的内部数据结构中跟踪所有进程。父进程的进程\
  \ ID 可以通过 `getppid()` 函数获取：\n\n```c\nmain()\n{\n  printf(\"In child process pid\
  \ is %d \\n\",getpid());\n  printf(\"In child process parents pid is %d \\n\",getppid());\n\
  }\n```\n\n### UNIX 环境下的进程执行\n\nUNIX 中的进程是一个 C 程序。每当 C 程序执行时都会调用 main 函数。\n\n**原型：**\n\
  \n```c\nint main(int argc, char * argv);\n```\n\n在这里，`argc` 是命令行参数的数量，`argv` 是命令行参数的指针。\n\
  \n内核通过 `exec` 函数开始执行 C 程序，该函数调用可执行程序文件指定的起始地址处的启动例程。启动例程从内核获取命令行参数并调用 main 函数。\n\
  \n### 进程的执行模式\n\n从硬件角度看，系统有以下两种执行模式：\n\n\n\n\n\n1. 用户模式：当用户进程执行时，它是在用户模式下运行。在用户模式下，进程可以访问自己的指令和数据，但无法访问内核指令、数据或其他进程的数据。\n\
  \n2. 内核模式：当用户进程执行系统调用时，进程的执行模式从用户模式切换到内核模式；由内核执行用户的请求。内核模式下的进程可以访问内核地址和用户地址。\n\n\
  # 进程终止\n\n当进程终止时，操作系统会释放所有分配给该进程的资源，更新与进程相关的统计信息，并通知所有进程该进程已终止。UNIX 进程以正常或异常的方式终止。当进程终止时，它会进入僵尸状态（zombie\
  \ state），即它不会释放进程 ID（PID）；而是等待父进程确认进程已终止并释放 PID。\n\n## 正常终止\n\n进程的正常终止是通过从主函数返回或调用\
  \ `exit()` 或 `_exit()` 函数实现的。\n\n`exit()` 函数在退出进程之前会执行一个清理函数。它会关闭所有打开的文件并刷新所有缓冲区。\n\
  \n**原型：**\n\n```\nvoid exit(int status);\n```\n\n`_exit()` 函数在退出之前不执行任何清理操作。\n\n\
  ## 异常进程终止\n\n当发生以下一个或多个条件时，进程将异常终止：\n\n* 进程的资源使用超过\n* 任务不再需要\n* 父进程正在退出\n\n导致异常终止的另一个原因是在某些其他进程（尤其是父进程）中调用\
  \ `abort()` 函数。该函数会向调用者发送 SIGABRT 信号。\n\n对于异常终止，内核会生成终止状态。父进程通过使用 `wait()` 系统调用来获取该终止状态。\n\
  \n# 命令行参数和环境变量\n\nC 语言中的 `main()` 函数有两个标准参数 `argc` 和 `argv`，称为命令行参数。`argc` 指定参数的数量，其中命令名本身也算一个参数。\n\
  \n`argv` 是一个指向字符串的指针数组。`argv` 的第一个成员即 `argv[0]` 指向命令名，第二个成员 `argv[1]` 指向命令的第一个参数。\n\
  \n由于 `argv` 的存在，程序可以相当容易地响应用户输入的命令行参数。例如，你可以让程序检测程序名后的第一个参数是否为 `help` 单词，并将帮助文件输出到标准输出（stdout）。文件名也可以传递进来并在你的\
  \ `open` 语句中使用。任何输入都可以作为命令行参数传递，从而避免使用 I/O 语句读取输入。\n\n`envp` 提供了程序的环境变量，以字符串数组的形式表示为\
  \ `VAR=value`。例如 `PATH=/bin;/usr/bin`。数组的最后一个元素是空指针。这使得 C 程序员可以访问 shell 的全局环境。\n\
  \n除了 `envp` 向量，还可以通过调用 `getenv()` 来访问环境变量。使用方法如下；假设我们要访问 shell 环境变量 `$HOME`。\n\n\
  ```\nchar *string;\nstring = getenv(\"HOME\");\n```\n\n`getenv()` 获取 `$HOME` 变量的值并将其存储在字符串中。\n\
  \n**示例：**\n\n```c\n/* myprog.c*/\n#include <stdio.h>\nint main(int argc, char *argv[],\
  \ char* envp[])\n{\n    int I;\n    printf(\"The program %s has %d arguments\\n\"\
  , argv[0], argc);\n    printf(\"The first two arguments are %s and %s \\n\", argv[1],\
  \ argv[2]);\n    for (I=0; envp[I]; I++)\n        printf(\"%s\\n\",envp[I]);\n}\n\
  ```\n\n在给定的示例中，程序的执行方式如下：\n\n```bash\n$myprog this is good\n```\n\n输出为：\n\nThe program\
  \ myprog has 4 arguments\nThe first two arguments are this and is\n\n`argc = 4`，而\
  \ `argv[0]` 指向 `myprog`，`argv[1]` 指向 `this`，`argv[2]` 指向 `is`，`argv[3]` 指向 `good`。之后，它显示环境变量。\n\
  \n# UNIX 进程的内存布局\n\n分配给程序的内存区域通常被分为几个子区域，例如：\n\n* **代码区：** 这在 UNIX 中被称为文本区（text\
  \ area），仅包含程序的可执行代码。如果有多个进程运行同一个程序，仍然只有一个代码区，因为它对所有进程来说都是相同的。文本区通常是只读的，以防止程序修改其指令。\n\
  * **数据区：** 存放程序正在处理的数据。该部分包含已初始化和未初始化的数据变量。\n* **栈区：** 它是自动创建的，其大小在运行时进行调整。它由逻辑栈帧组成，调用函数时压入，返回时弹出。它包含了函数的参数、局部变量和数据。进程有一个用于用户的栈，另一个用于内核的栈。\n\
  * **堆（Heap）：** 虚拟空间的这部分包含了供使用的动态分配变量。\n\n# 设置跳转到另一个函数\n\nC 语言允许跳转到另一个函数 `setjmp`\
  \ 和 `longjmp`。这类跳转应该被视为良好的实践。\n\n**原型：**\n\n```\nint setjmp(jmp_buf env);\nvoid\
  \ longjmp(jmp_buf env, int val);\n```\n\n`setjmp()` 宏将当前环境保存在 `env` 中。该宏会返回多次。第一次返回总是返回\
  \ `0`；第二次（当从 `longjmp()` 返回时，它返回设置的值。让我们看一个例子：\n\n```c\n#include <setjmp.h>\n#include\
  \ <stdio.h>\njmp_buf ebuf;\nvoid f(void);\nint main(void)\n{\n    int i;\n    printf(\"\
  1 \");\n    i = setjmp(ebuf);\n    if(i == 0) {\n        f();\n    }\n    printf(\"\
  %d\", i);\n    return 0;\n}\nvoid f(void)\n{\n    printf(\"2 \");\n    longjmp(ebuf,\
  \ 3);\n}\n```\n\n在给定的示例中，输出为：\n\n1 23\n\n第一次调用 `setjmp()` 时，它向变量 `i` 返回 `0`，控制流跳转到函数\
  \ `f()`。在函数 `f()` 中将打印 `2`，并且 `setjmp` 的返回值设置为 `3`，因为它是作为第二个参数传递的。\n\n# 进程状态\n\n\
  进程的生命周期可以通过一组状态来建模，每个进程在任何一点都可以处于任何一个状态。这些状态可以通过图 3.1 所示的状态转换图表示，这是一个有向图，节点表示进程可以进入的状态，边表示导致进程从一个状态移动到另一个状态的事件。\n\
  \n![](img/Figure-3.1.jpg)\n\n**图 3.1:** 进程转换图\n\nUNIX 进程在其生命周期内经历以下不同的状态：\n\n* **执行（Executing）：**\
  \ 进程在用户和内核两种模式下执行。\n* **就绪（Ready）：** 只要内核调度，进程就准备好执行，或者进程处于辅助内存中的就绪状态。\n* **睡眠（Sleeping）：**\
  \ 进程在主内存中处于睡眠状态，或者交换器已将进程交换到辅助内存，以在主内存中交换其他进程。\n* **创建（Created）：** 进程刚刚创建。它既不在就绪状态，也不在睡眠状态。\n\
  * **僵尸（Zombie）：** 进程刚刚执行了 `exit()` 系统调用。进程不存在了，但留下了退出码。\n\n\n\n\n\n*   **返回内核模式：**\
  \ 进程被内核抢占，直到内核调度另一个进程。\n\n# 进程控制块\n\n操作系统通过一个进程控制块（PCB）来表示每个进程。它包含了与进程相关的信息，例如：\n\
  \n* **进程状态：** 新态、运行态、等待态等。\n* **程序计数器：** 指向该进程将执行的下一条指令的地址。\n* **CPU 寄存器：** 包括累加器、索引寄存器、栈指针和通用寄存器。\n\
  * **CPU 调度信息：** 如进程优先级、指向进程调度队列的指针以及调度调度。\n* **内存管理信息：** 如基寄存器和限界寄存器的值、页表。\n* **统计信息：**\
  \ 如 CPU 使用的时间量。\n* **I/O 状态信息：** 如分配给该进程的 I/O 设备列表、打开的文件列表。\n\n进程的上下文包括 CPU 寄存器的值、进程状态和内存管理信息。进程的上下文包含\
  \ (1) 用户级上下文，(2) CPU 寄存器和 (3) 内核级上下文。\n\n用户级上下文包含了进程虚拟地址空间的内存布局，如文本段、数据段、用户栈和共享内存。\n\
  \nCPU 寄存器由以下信息组成：\n\n* **程序计数器** 包含将执行的下一条指令的地址。\n* **程序状态寄存器** 包含各种指示最近计算结果的标志位、显示当前执行模式的子字段（用于判断进程是否可以运行特权指令），以及显示当前处理器执行级别的子字段。\n\
  * **栈指针** 指向内核栈或用户栈中下一个空条目或最后使用的条目。\n* **通用寄存器** 包含进程执行过程中产生的中间数据。\n\n进程的内核级上下文包含一个静态部分和在整个生命周期内数量变化的动态部分。系统级上下文的组件如下：\n\
  \n* **进程表** 条目包含进程的状态和控制信息。\n* **u area** 包含只需要访问一次的进程控制信息。\n* **Pregion** 条目、区域表和页表提供了进程的文本、数据、栈和其他区域。\n\
  * **内核栈** 当进程在内核模式下执行时，包含一个内核函数调用栈。当进程在用户模式下执行时，内核栈为空。\n* **动态部分** 包含几层系统级上下文，每一层都包含关于上一层的信息。\n\
  \n# 进程控制\n\n进程控制处理所有与进程相关的操作，包括创建子进程、在执行协作或独立进程时从一个进程切换到另一个进程，以及以正常方式终止进程。\n\n#\
  \ 进程创建\n\n进程在 UNIX 中通过 `fork()` 函数启动。`fork()` 函数创建一个与父进程完全相同的子进程，父子进程都在运行。父子进程共享相同的真实和有效用户\
  \ ID 及组 ID、当前工作目录、根目录、文件创建掩码等。\n\n`fork()` 将子进程的 `PID` 返回给父进程，子进程中的返回值为 `0`。内核增加与进程相关的文件和节点表计数器。如果由于以下原因无法创建子进程：(A)\
  \ 系统中进程过多。(B) 超过了父进程真实用户 ID 的进程数量限制，则父进程返回值为 `-1`。\n\n让我们来看一个例子：\n\n```\nmain()\n\
  {\n  int pid;\n  pid = fork();\n  if (pid < 0)\n    printf(\"Fork failed \\n\");\n\
  \  else\n  {\n    if (pid == 0)\n    {\n      printf(\"In child process pid is %d\
  \ \\n\",getpid());\n      printf(\"In child process parents pid is %d \\n\",getppid());\n\
  \    }\n    else\n    {\n      printf(\"In parent process pid is %d \\n\",getpid());\n\
  \      printf(\"In parent process parents parent pid is %d \\n\",getppid());\n \
  \   }\n  }\n}\n```\n\n在父进程中设置的文件锁不会被子进程继承。在给定的示例中，如果 `fork()` 成功，它会向新创建的子进程返回 `0`，或者向调用\
  \ `fork()` 的父进程返回新创建子进程的进程 ID。两个进程按照 CPU 的调度逐一执行。如果 `fork()` 失败，它将返回一个负数。\n\n# 等待进程终止\n\
  \n进程确认子进程死亡的简单方法是使用 `wait()` 系统调用。当调用 `wait()` 时，进程会被挂起，直到其中一个子进程退出，然后调用带有子进程的退出状态返回。如果它有一个僵尸子进程，调用将立即返回并带有该进程的退出状态。\n\
  \n调用 `wait()` 函数会执行几件事。首先会检查父进程是否有任何子进程。如果没有，`wait()` 将返回 -1。如果父进程有一个已终止（僵尸）的子进程，则返回子进程的\
  \ `PID` 并将其从进程表中移除。\n\n然而，如果父进程有一个尚未终止的子进程，父进程将被挂起，直到它接收到信号。一旦子进程死亡，信号就会被接收。\n\n\
  `wait()` 还可以告诉我们子进程是以什么方式终止的。为此，我们需要向 `wait()` 传递一个整数变量。如果进程是正常终止的，传递给 `wait()`\
  \ 的整数变量的高 8 位将进行更新；如果进程是非正常终止的，则低 8 位将初始化为 `0`。\n\n在发生核心转储（core dump）错误的情况下，wait\
  \ 返回一个第 7 位被设置的整数。\n\n让我们来看一个例子：\n\n```\n/* example of wait() */\nmain()\n{\n  int\
  \ i, pid, exitstat, status;\n  pid = fork();\n  if (pid == 0)\n  {\n    printf(\"\
  Enter exit stat:\");\n    scanf(\"%d\", &i);\n    exit(i);\n  }\n  else\n  {\n \
  \   wait(&status);\n    if ((status & 0xff) != 0) /* abnormal exit */\n    {\n \
  \     printf(\"Signal interrupted\\n\");\n    }\n    else /* normal exit */\n  \
  \  {\n      exitstat = (int) status/256 ;\n      printf(\"Exit status from %d was\
  \ %d\\n\", pid, exitstat);\n    }\n  }\n}\n```\n\n在这里，子进程用户输入一个退出代码，进程以该代码退出。父进程通过\
  \ `status` 变量接收此退出代码。我们可以检查 `status` 变量来确定退出类型。\n\n`fork()` 创建子进程所有变量的副本，因此全局变量也会复制。如果在一个进程中修改值，它不会反映在另一个进程中。即使指针变量所指位置的值在不同进程之间也是不同的。\n\
  \n# 执行另一个程序\n\n现有进程可以通过执行 exec 系统调用调用另一个进程。运行进程的进程 ID 不会改变，因为 `exec()` 函数并没有创建新进程，而是调用一个现有进程。`exec()`\
  \ 函数的各种原型如下：\n\n* `int execl(const char *path, const char *arg, …);`\n* `int execlp(const\
  \ char *file, const char *arg, …);`\n* `int execle(const char *path, const char\
  \ *arg,…, char * const envp[]);`\n* `int execv(const char *path, char *const argv[]);`\n\
  * `int execvp(const char *file, char *const argv[]);`\n\n\n\n\n\n`path` 或 `file`\
  \ 包含被调用的文件名，`arg` 是指向作为参数传递给被调用文件的字符串的指针。按照惯例，第一个参数应该指向与正在执行的文件关联的文件名。参数列表必须以 NULL\
  \ 指针结束。\n\n函数 `execlp()` 和 `execvp()` 如果发现指定的文件名不包含斜杠（`/`）字符，则在搜索时复制 shell 搜索可执行文件的操作。搜索路径是环境变量中通过\
  \ `PATH` 变量指定的路径。如果未指定此变量，则使用默认路径 `:/bin:/usr/bin`。此外，某些错误会被特殊处理。\n\n新进程会从旧进程继承以下属性，如进程\
  \ ID 和父进程 ID、真实用户 ID 和真实组 ID、会话 ID、当前工作目录、根目录、文件模式创建标记等。\n\n被调用进程的有效 ID 可能会根据 set-user-ID\
  \ 和 set-group-Id 位标志的状态而改变。如果新程序的 set-user-ID 位被设置，则有效用户-ID 将变为程序的所有者 ID。\n\n# 访问用户信息\n\
  \n有很多函数和系统调用可以让我们访问有关 UNIX 用户的信息。\n\n## 用户详情\n\n`pwd.h` 头文件中的 `passwd` 结构包含了类似于\
  \ `/etc/passwd` 目录的用户信息：\n\n```c\n#include <pwd.h>\nstruct passwd {\n  char *pw_name;\
  \  /* 用户名 */\n  char *pw_passwd;  /* 密码 */\n  uid_t pw_uid;  /* 用户 id*/\n  gid_t\
  \ pw_gid;  /* 组 id */\n  time_t pw_change; /* 有效性和\n  char *pw_class;  password\
  \ 类 */\n  char *pw_gecos;  /* 用户全名 */\n  char *pw_dir;  /* 登录目录 */\n  char *pw_shell;\
  \  /* 用户登录 shell */\n  time_t pw_expire; /* 密码过期日期*/\n};\n```\n\n`passwd` 结构由 `getpwnam()`\
  \ 和 `getpwuid()` 函数返回。它提供了有关用户账户的信息。`getpwnam()` 和 `getpwuid()` 函数在用户数据库中查找匹配名称或\
  \ UID 的条目。\n\n`getuid()` 获取登录用户的用户 ID。\n\n打印用户详细信息的程序示例如下：\n\n```c\n#include <pwd.h>\n\
  main()\n{\n  struct passwd *pass;\n  int uid;\n  uid = getuid();\n  pass = getpwuid(uid);\n\
  \  printf(\"Login name: %s\\n\", pass->pw_name);\n  printf(\"Encrypted Password:\
  \ %s\\n\", pass->pw_password);\n  printf(\"User ID: %d\\n\", pass->pw_uid);\n  printf(\"\
  Group ID: %d\\n\", pass->pw_gid);\n  printf(\" Password Age: %s\\n\", pass->pw_age);\n\
  \  printf(\"Comment: %s\\n\", pass->pw_comment);\n  printf(\"Login Dir  %s\\n\"\
  , pass->pw_pw_dir);\n  printf(\"Shell: %s\\n\", pass->pw_shell);\n}\n```\n\n## 组详情\n\
  \n`grp.h` 头文件中的组结构包含了如下的组信息：\n\n`/etc/grpup`:\n\n```c\n#include <grp.h>\nstruct\
  \ group {\n  char *gr_name;  /* 组名 */\n  char *gr_passwd; /* 组密码 */\n  gid_t gr_gid;\
  \  /* 组 id*/\n  char **gr_mem; /* 指向组成员名的指针 */\n};\n```\n\n`getgid()` 获取用户的组 ID，而\
  \ `getgrgid()` 填充组结构。\n\n以下是打印组信息的示例：\n\n```c\n#include <grp.h>\nmain()\n{\n  int\
  \ I;\n  struct group *grp;\n  grp = getgrgid(getgid());\n  printf(\"Group Name %s\\\
  n\", grp->gr_name);\n  printf(\"Group Password %s\\n\", grp->gr_passwd);\n  printf(\"\
  Group ID %s\\n\", grp->gr_gid);\n  printf(\"Group Members :\");\n  for (I = 0; grp->gr_mem[I];I++)\n\
  \    printf(\"\\n: %s\", grp->gr_mem[I]);\n}\n```\n\n## 显示所有登录用户的信息\n\n`utmp.h`\
  \ 头文件中的 `utmp` 结构包含了如 `/etc/utmp` 所示登录用户信息。我们可以通过从 `/etc/utmp` 读取登录用户信息来填充此结构：\n\
  \n```c\nstruct utmp {\n  char ut_user[8]; /* 用户登录名 */\n  char ut_id[4]; /* 进程 id\
  \ */\n  char ut_line[12]; /* 设备名称 (console, lnxx) */\n  short ut_pid; /* 兼容性进程 id\
  \ 的缩写 */\n  short ut_type; /* 条目类型 */\n  struct exit_status ut_exit; /* 进程退出状态 */\n\
  \  time_t ut_time; /* 条目创建时间 */\n};\n```\n\n以下是一个显示登录用户信息的程序：\n\n```c\n#include\
  \ <sys/types.h>\n#include <stdio.h>\n#include <utmp.h>\n#include <pwd.h>\n#include\
  \ <sys/types.h>\n#include <stdio.h>\n#include <utmp.h>\n#include <pwd.h>\n#define\
  \ UTMP \"/etc/utmp\"\n#define NAMELEN 8\nmain() {\n  FILE *fp;\n  struct utmp u;\n\
  \  struct passwd *p;\n  char temp[NAMELEN];\n  fp = fopen(UTMP, \"r\");\n  if (fp)\
  \ {\n    while (fread(&u, sizeof(struct utmp), 1, fp)) {\n      strncpy(temp, u.ut_user,\
  \ NAMELEN);\n      temp[NAMELEN-1] = '\\0';\n      p = getpwnam(temp);\n      if\
  \ (p) {\n        printf(\"User: %s, Line: %s, ID: %s, Type: %d\\n\", u.ut_user,\
  \ u.ut_line, u.ut_id, u.ut_type);\n      }\n    }\n    fclose(fp);\n  }\n  exit(0);\n\
  }\n```\n*(注：由于原文提供的该部分代码块存在逻辑混乱和重复错误，翻译时根据上下文意图进行了结构对齐，以符合文档工程师的逻辑)*\n\n# 进程组\n\n\
  进程组由一个或多个进程组成，进程组 ID 是进程组 ID。进程可以使用 `setpgid()` 函数设置进程组。\n\n```c\n\n\nint setpgid(pid_t\
  \ pid, pid_t pgid);\n```\n\n# 会话\n\n会话是一个或多个进程组的集合。进程可以使用 `setsid()` 函数建立新会话。\n\n\
  ```c\npid_t setsid(void);\n```\n\n如果进程已经是会话组组，则返回错误。如果不是，它将成为会话组组，会话 ID 被设置为进程 ID。让我们来看一个示例：\n\
  \n```c\n#include <sys/types.h>\n#include <unistd.h>\n#include <stdio.h>\nvoid main()\
  \ {\n  printf(\"进程组 ID 为 %d\\n\", (int) getgrp());\n  setsid();\n  printf(\"新的进程组\
  \ ID 为 %d\\n\", (int) getgrp());\n}\n```\n\n# 信号\n\n信号是异步软件中断，表示发生了事件。信号通过其名称识别并在\
  \ `<signal.h>` 中指定。信号由以下发送：\n\n* 一个进程到另一个进程（或自身）\n* 内核发送给进程\n\n表 3.1 显示了 BSD 系统可用的信号：\n\
  \n| 信号名称 | 信号值 | 信号描述 |\n| :--- | :--- | :--- |\n| SIGHUP | 1 | 终端挂起 |\n| SIGINT\
  \ | 2 | 中断程序 |\n| SIGQUIT | 3 | 退出程序 |\n| SIGILL | 4 | 非法指令 |\n| SIGTRAP | 5 | 跟踪异常\
  \ |\n| SIGABRT | 6 | 中止 |\n| SIGEMT | 7 | 执行模拟指令 |\n| SIGFPE | 8 | 浮点异常 |\n| SIGKILL\
  \ | 9 | 杀死程序 |\n| SIGBUS | 10 | 总线错误 |\n| SIGSEGV | 11 | 段错误 |\n| SIGSYS | 12 |\
  \ 系统调用参数无效 |\n| SIGPIPE | 13 | 向无读者的管道中写入 |\n| SIGALRM | 14 | 实时定时器超时 |\n| SIGTERM\
  \ | 15 | 软件终止信号 |\n| SIGURG | 16 | I/O 通道紧急状态 |\n\n\n\n\n\n| SIGSTOP | 17 | 停止信号，并非来自终端\
  \ |\n| SIGTSTP | 18 | 来自终端的停止信号 |\n| SIGCONT | 19 | 停止的进程正在继续 |\n| SIGCHLD | 20\
  \ | 子进程停止或退出时对父进程的通知 |\n| SIGTTIN | 21 | 后台进程在终端上读取 |\n| SIGTTOU | 22 | 后台进程向终端写入\
  \ |\n| SIGIO | 23 | 描述符上可以进行 I/O |\n| SIGXCPU | 24 | 超过 CPU 时间限制 |\n| SIGXFSZ |\
  \ 25 | 超过文件大小限制 |\n| SIGVTALRM | 26 | 虚拟定时器过期 |\n| SIGPROF | 27 | 性能计时器过期 |\n| SIGWINCH\
  \ | 28 | 窗口大小变化 |\n| SIGINFO | 29 | 信息请求 |\n| SIGUSR1 | 30 | 用户定义信号 1 |\n| SIGUSR2\
  \ | 31 | 用户定义信号 2 |\n| SIGTHR | 32 | 线程中断 |\n\n**表 3.1:** BSD 信号\n\n# 向进程发送信号\n\n\
  `kill` 系统调用用于将信号从一个进程发送到另一个进程或其本身。要发送信号，发送进程和接收进程必须具有相同的有效用户 ID，或者发送进程必须是超级用户。\n\
  \n### 原型\n\n```c\nint kill(int pid, int sig);\n```\n\n如果 `pid` 参数为 `0`，信号将发送给进程组中的所有进程。如果\
  \ `pid` 参数为 `–1` 且用户不是超级用户，则信号将发送给所有真实用户 ID 与发送进程有效用户 ID 相同的进程。如果 `pid` 参数为 `–1`\
  \ 且用户是超级用户，信号将发送给除系统进程外的进程。如果 `pid` 参数为负数但不是 `1`，则信号将发送给所有进程组 ID 等于 `pid` 绝对值的进程。如果\
  \ `pid` 参数为 `0`，则会进行错误检查，但不会发送信号。\n\n向进程发送信号的另一种方法是使用特定的按键，该按键被解释为向运行中的进程发送信号的请求。以下是一些示例：\n\
  \n* **Ctrl + C:** 在键盘上配合 `Ctrl` 键按下 `C`会导致系统向运行的进程发送 `INT` 信号 (`SIGINT`)。默认情况下，此信号会导致进程立即终止。\n\
  * **Ctrl + Z:** 配合 `Ctrl` 键按下 `Z`会导致系统向运行的进程发送 `TSTP` 信号 (`SIGTSTP`)。默认情况下，此信号会导致进程暂停执行。\n\
  * **Ctrl + \\:** 配合 `Ctrl` 键按下 `*`会导致系统向运行的进程发送 `ABRT` 信号 (`SIGABRT`)。默认情况下，此信号会导致进程立即终止。注意，这种冗余（即\
  \ `Ctrl +` 与 `Ctrl + C` 相同）为我们提供了更好的灵活性。我们稍后会解释。\n\n`kill` 命令也用于向进程发送信号。`kill` 命令接受两个参数：信号名称（或数字）和进程\
  \ ID。\n\n```bash\nkill -<signal> <PID>\n```\n\n例如，为了向 PID 为 5342 的进程发送 `INT` 信号，输入：\n\
  \n```bash\nkill -INT 5342\n```\n\n这与在运行该进程的 shell 中按下 `Ctrl-C` 的效果相同。如果没有指定信号名称或数字，默认将向进程发送\
  \ `TERM` 信号，这通常会导致其终止。\n\n某些硬件条件也会导致信号。例如，浮点错误、引用进程外部的地址、特定的硬件条件以及它们生成的相应信号在不同的\
  \ UNIX 实现中是不同的。\n\n# 信号处理\n\n内核对每个信号都有相应的默认操作。进程可以通过在程序中编写代码以自定义的方式处理大多数信号。这段自定义代码被称为信号处理程序（signal\
  \ handlers）。\n\n有两个信号无法被信号处理器重新定义。`SIGKILL` 总是停止进程，而 `SIGSTOP` 总是将进程从前台移动到后台。这两个信号无法被信号处理器捕获。\n\
  \n`signal()` 系统调用用于为信号类型设置信号处理器。`signal()` 接受一个信号数字和一个信号处理函数指针，并设置该处理器以接受指定的信号。\n\
  \n### 原型\n\n```c\nvoid (*signal(int sig, void (*func)(int)))(int);\n```\n\n第一个参数\
  \ `sig` 是信号的名称。第二个参数的值是 `SIG_DFL`、`SIG_ING` 或信号处理器的地址。`SIG_DFL` 用于指定信号的默认处理，`SIG_ING`\
  \ 用于忽略信号。\n\n**示例：** 在给出的示例中，打印消息 `press del key` 之后，将执行一个无限的 循环，但一旦按下 `del` 键，一个中断信号\
  \ `SIGINT` 将发送到处理函数 `sig_handle`。该函数将打印消息 `DEL key is pressed`，程序将终止。\n\n```c\n\
  #include <signal.h>\n\nvoid sig_handle();\n\nvoid main()\n{\n    printf(\"press\
  \ del key\\n\");\n    signal(SIGINT, sig_handle);\n    for(;;);\n}\n\nvoid sig_handle()\n\
  {\n    printf(\" DEL key is pressed\");\n}\n```\n（注：此处原文代码块结束处缺少右括号，翻译已保持逻辑结构）\n\
  \n*表 3.2* 显示了 `signal()` 系统调用的所有可能值\n\n| 信号 | 描述 |\n| :--- | :--- |\n| SIGALRM |\
  \ 进程通过 alarm 设置定时器。`unsigned int alarm (unsigned int sec)`。参数 `sec` 指定了在内核向进程发送\
  \ `SIGALRM` 信号之前的秒数。如果参数为零，任何之前的定时器将被取消。 |\n| SIGINT | 通常在终端上按下中断键时产生此信号。 |\n| SIGILL\
  \ | 由硬件实现产生的信号。 |\n| SIGUSR1 | 有两个用于进程间通信的用户定义信号。 |\n| SIGUSR2 | 同 `SIGUSR1`。 |\n\
  | SIGXFS | 如果进程超过文件限制，将产生此信号。 |\n| SIGXCPU | 如果进程超过软 CPU 限制，将产生此信号。 |\n| SIGTERM\
  \ | `kill` 命令发送的终止信号。 |\n| SIGPWR | 在电源故障时产生此信号。如果有电池电，系统将继续运行。 |\n| SIGPIPE | 如果写入进程继续写入管道而读取进程已终止，则产生此信号。\
  \ |\n| SIGQUIT | 终端驱动程序在按下 `Ctrl \\` 键时产生此信号。此信号发送给所有前台进程。 |\n| SIGTSTP | 终端驱动程序在按下\
  \ `Ctrl+Z` 时产生交互停止信号。此信号发送给所有前台进程。 |\n| SIGSTOP | 终端驱动程序产生此信号以停止所有前台进程。此信号无法被捕获和忽略。\
  \ |\n| SIGORG | 此信号指定发生了紧急情况。 |\n| SIGCHLD | 当进程停止时发送给父进程的信号。通常此信号是被忽略的，因此如果父进程希望在孩子状态变化时收到通知，必须捕获该信号。\
  \ |\n| SIGIO | 此信号发生在异步 I/O 时。 |\n| SIGSYS | 此信号表示无效系统调用。 |\n\n# 线程\n\n线程是轻量级进程。线程具有不同的执行状态，多个线程共享状态。多个线程可以读取和写入同一内存区域，而不同的进程无法访问同一内存区域。每个线程仍有自己的寄存器栈，但其他线程可以读取和写入栈内存。\n\
  \n通常一个进程可以看作：\n\n进程 = 线程 + 代码、数据和内核上下文\n\n![](img/Figure-3.2.jpg)\n\n\n\n\n\n##\
  \ 图 3.2：单线程进程\n\n进程可以为不同的活动拥有独立的线程。为每个活动设置一个独立的线程允许程序员将与该活动相关的操作定义为单一的动作和事件序列。\n\
  \n与进程关联的每个线程都有自己的逻辑控制流；每个线程共享代码、数据和内核上下文（Kernel context），且每个线程都有自己的线程标识（ID）。\n\n\
  ![](img/Figure-3.3.jpg)\n\n## 图 3.3：多线程进程\n\n为什么允许线程访问相同的内存？因为在操作系统内部，线程必须紧密协调它们的活动。以下是线程需要共享内存和分离内存的情况：\n\
  \n*   如果两个进程在几乎相同的时间发出读取文件系统的调用，必须确保操作系统能够恰当地序列化磁盘请求。\n*   当一个进程分配内存时，其线程必须找到一些空闲内存并交给该进程。它必须确保多个线程分配的是不重叠的内存。\n\
  \n让线程共享相同的地址空间使得协调活动变得简单得多——可以构建表示系统状态的数据结构，并让线程读写这些数据结构以确定在需要处理请求时该做什么。\n\n线程必须处理的一个复杂问题是异步性。异步事件在线程执行时随机发生，除非程序员采取措施来限制异步性，否则它们可能会干扰线程的活动。例如下：\n\
  \n*   发生中断，将控制权从一个线程转移到中断处理程序。\n*   发生时间片切换，将控制权从一个线程转移到另一个线程。\n*   两个运行在不同处理器上的线程读写同一块内存。\n\
  \n异步事件如果没有得到适当控制，可能会导致错误行为。例如：\n\n*   两个线程需要发出磁盘请求。第一个线程开始编写磁盘控制器（假设它是内存映射的，并且必须发出多次写入以指定磁盘操作）。在此期间，第二个线程在不同的处理器上运行，并也发出了内存映射的写入以编写磁盘控制器。磁盘控制器会变得极度混乱并读取了错误的磁盘块。\n\
  *   两个线程需要写入显示器。第一个线程开始构建它的请求，但在其完成之前，发生了时间片切换，第二个线程开始了它的请求。两个线程的组合触发了一个被禁止的请求序列，显示器开始冒烟。\n\
  *   出于计费原因，操作系统记录在每个用户程序上花费的时间。它还维护了所有用户程序花费总时间的运行和。两个线程增加它们各自进程的计数器，然后并发增加全局计数器。它们的增加操作相互干扰，记录的所有用户进程花费的总时间少于本地时间之和。\n\
  \n因此，程序员需要协调多个线程的活动，以防止这些糟糕情况发生。可以采用关键机制和同步来协调多个线程的活动。这些操作允许线程控制其事件相对于其他线程事件的发生时机。适当的使用允许程序员避免上述列出的问题。\n\
  \n## 结论\n\n本章描述了 UNIX 操作系统的进程子系统。进程子系统在各种进程需要时管理内存，调度进程进行执行，并控制与进程相关的其他方面。本章描述了进程的内存布局和管理内存的功能。本章还描述了\
  \ UNIX 进程的上下文以及当进程被中断或 CPU 切换到另一个进程时如何执行上下文切换。本章还描述了进程如何通过`signal()`系统调用发送信号来相互告知异步事件。下一章将更详细讨论进程间通信的所有方法。\n\
  \n## 复习题\n\n1.  编写一个程序，要求用户输入想要分配的字节总数。然后，用从 1 开始的连续整数初始化分配的内存。将内存块中包含的所有整数相加，并在屏幕上打印最终结果。\n\
  2.  编写一个程序，通过调用`calloc()`函数分配一块内存空间来存放 100 个`float` 类型的数据。然后，重新分配该内存块以多容 50 个`float`\
  \ 类型的数据。\n3.  编写一个程序，要求用户输入`float` 类型数据的总数。然后使用`calloc()`和`malloc()`函数分配两个大小由该数量指定的相同内存块，并打印这两个内存块的初始值。\n\
  4.  编写一个程序，显示当前系统中登录的所有用户信息。\n\n# 第 4 章\n\n## 进程间通信\n\n### 引言\n\n大多数现代操作系统允许计算机系统中的多个进程并发执行。进程可以是独立的，也可以是协作的，即相互共享数据，或者有时需要相互共享事件信息。操作系统提供了进程间通信（IPC）机制，以便在单系统或网络环境中执行协作进程。IPC\
  \ 可以是同步的，也可以是异步的。本章描述了 IPC 以及在不同进程之间执行 IPC 的相应技术。\n\n## 结构\n\n我们将在本章涵盖以下主题：\n\n\
  *   进程间通信及其不同的方法\n*   作为 IPC 手段的管道（Pipes）\n*   作为 IPC 手段的 FIFO\n*   共享内存及其用法\n*\
  \   使用消息队列发送和接收消息\n*   使用信号量（Semaphores）进行进程同步\n\n## 目标\n\n完成本章后，你将能够：\n\n*   理解进程间通信的概念。\n\
  *   理解命名管道和无命名管道如何在两个协作进程之间共享数据。\n*   理解如何在协作进程之间直接共享数据。\n*   理解信号量用于进程同步的功能机制。\n\
  \n### IPC 简介\n\n两个进程可以使用操作系统提供的进程间通信技术进行相互通信。进程可能需要通信以共享数据或告知某些事件。在传统的单处理器环境中，单个进程内的模块可以使用全局变量和函数调用进行相互通信。在进程在不同地址空间中运行的多处理器环境中，操作系统必须提供某种进程间通信机制。\n\
  \nIPC 的使用不仅限于运行单系统上的多个进程。图 4.1 显示了位于单个系统的三个进程可以使用不同的 IPC 模式进行通信。\n\n![](img/Figure-4.1.jpg)\n\
  \n**图 4.1：单系统上的进程通信**\n\n图 4.2 显示了一个网络环境，其中进程运行在不同的系统中，它们可以使用进程间通信手段进行相互通信。\n\n\
  ![](img/Figure-4.2.jpg)\n\n**图 4.2：多系统上的进程通信**\n\n### 进程间通信手段\n\n共享数据或进程间通信的主要方法使用以下：\n\
  \n*   文件\n*   消息队列\n*   管道（Pipes）\n*   共享内存\n*   套接字（Sockets）\n\n\n\n\n进程之间的通信通过信号和信号量进行同步。C\
  \ 库函数和系统调用可用于进程间通信。\n\n在 UNIX 环境中，共享信息可以存在于不同的层次。用于共享信息的 IPC（进程间通信）方法取决于信息所在的位置。根据信息的可用性，对应的\
  \ IPC 方法列举如下：\n\n* 如果要共享的信息存在于文件系统中的文件中，则使用如 `read()`、`write()` 等内核系统调用在进程之间共享信息。在更新文件时，需要进行某些同步操作。\n\
  * 如果信息存在于管道（pipes）、消息队列和信号量中，则使用对应于这些数据结构的内核系统调用在协作进程之间共享信息。\n* 如果信息存在于共享内存中，则两个进程可以直接访问该信息。一旦进程设置了共享内存，通信时就不需要内核的参与。\n\
  * 两个进程可以通过文件系统中的文件来共享信息。使用文件的内核系统调用来访问文件中的信息。在更新文件时，需要进行某些同步操作。\n* 两个进程可以共享存在内核中的信息。使用管道、消息队列和信号量来共享信息。\n\
  * 两个进程可以引用共享内存区域。一旦进程设置了共享内存，两个进程就可以在完全不涉及内核的情况下信息。\n\n![](img/Figure-4.3.jpg)\n\
  \n**图 4.3:** 进程间的信息共享\n\n# 管道与 FIFO\n\n通过管道，一个进程的输出成为另一个进程的输入，如图 4.4 所示。一个进程向管道写入数据，同时，另一个进程从管道读取数据。管道在使用之前必须先打开。\n\
  \n`pipe()` 系统调用创建一个管道并返回两个文件描述符，`fd[0]` 和 `fd[1]`。`fd[0]` 用于读取，`fd[1]` 用于写入。`pipe()`\
  \ 成功时返回 `0`，失败返回 `-1` 并相应设置 `errno`。\n\n在标准编程模型中，一旦建立了管道，将通过 `fork` 创建两个（或多个）协作进程，并使用\
  \ `read()` 和 `write()` 传递数据。\n\n![](img/Figure-4.4.jpg)\n\n**图 4.4:** 管道的读写\n\n\
  使用后，应用 `close(int fd)` 关闭管道。\n\n**示例：**\n\n在给定的示例中，使用 `pipe()` 系统调用创建一个管道。父进程在执行时向管道的一端写入消息，子进程从管道的另一端读取相同的消息：\n\
  \n```\nvoid main()\n{\n  int fd[2];\n  pipe(fd);\n  if ( fork() == 0 )\n  { /* 子进程*/\n\
  \    close(fd[1]);   /* fd[1] 在此进程中未使用*/\n    printf(\"\\n read data from parent\
  \ );\n    read( fd[0]); /* 从父进程读取 */\n  }\n  else\n  {  close(fd[0]);   /* 在此进程中未使用\
  \ */\n    printf(\"\\n Write data to child process\\n\");\n    write( fd[1]);\n\
  \  }\n  exit(0)\n}\n```\n\n## 一端关闭的管道\n\n如果对写端已关闭的管道执行读操作，读取将返回 0 表示文件结束。\n\n如果对读端已关闭的管道执行写操作，则会产生\
  \ SIGPIPE 信号。如果我们忽略它或捕获它并从信号处理程序返回，写操作将返回一个错误，并将 `errno` 设置为 EPIPE。\n\n## popen()\
  \ I/O 库函数\n\n`popen()` 是标准的 I/O 库函数，它创建一个管道并 fork 出另一个进程以从管道中读取或写入数据。\n\n**原型：**\n\
  \n```\nFILE *popen(char *cmd, char *type);\n```\n\n`cmd` 是 shell 命令。函数 `popen` fork\
  \ 并执行 `cmd` 命令，并返回一个 FILE 指针，该指针根据字符串类型类型用于输入或输出。\n\n如果 `type` 的值为 `r`，则调用进程读取命令的标准输出。如果\
  \ `type` 的值为 `w`，则调用进程写入命令的标准输入。在失败情况下，`popen()` 返回 NULL。\n\n## pclose() I/O 函数\n\
  \n`pclose()` 函数关闭由 `popen()` 函数创建的 I/O 流。它返回执行命令的退出状态，或者如果流未创建则返回 -1。\n\n**原型：**\n\
  \n```\nint pclose(FILE *stream);\n```\n\n**示例：**\n\n在给定的示例中，`popen()` 函数执行 `who`\
  \ 命令，并将输出写入由 `fp` 指针指向的文件。`fgets()` 函数读取文件并将数据存储在字符字符串 `user` 中。使用 `printf()` 打印\
  \ `user` 内容。\n\n```\n#include <stdio.h>\nmain()\n{\n  FILE *fp;\n  char user[130];\n\
  \  fp = popen(\"who\", \"r\");\n  while ( fgets(user, sizeof(user), fp))\n  {\n\
  \    printf(\"%s\", user);\n  }\n  pclose(fp);\n}\n```\n\n## FIFOs\n\nFIFO 即先进先出（First\
  \ In Out）命名管道。FIFO 允许进程之间进行单向数据流；然而，FIFO 允许无关进程访问。FIFO 是存在于文件系统的文件。\n\n## 创建 FIFO\n\
  \nFIFO 使用 `mknode()` 系统调用创建，该调用通常留给超级用户创建目录项。\n\n**原型：**\n\n```\nint mkfifo(const\
  \ char *pathname, mode_t node);\n```\n\n其中 `pathname` 是 fifo 的 UNIX 名称。`mode` 包含文件的打开权限。如果\
  \ FIFO 已存在，`mkfifo()` 将返回错误 EEXIST。\n\n**示例：**\n\n在给定的示例中，创建一个具有所有者读写权限的名为 fifo\
  \ 的 FIFO。如果 FIFO 已存在，则发生异常终止；否则，程序正常终止。\n\n```\n#include <stdlib.h>\nmain()\n{\n\
  \  int rc;\n  int fifo_fds;\n  char data[100];\n  rc = mkfifo(\"fifo\", S_IRUSR\
  \ | S_IWUSR);\n  if (rc != 0) {\n    perror(\"mkfifo failure\");\n    exit(1);\n\
  \  }\n  exit(0);\n}\n```\n\n## 使用 FIFO 进行进程间通信\n\nFIFO 是命名管道，与用于父子通信的管道相比，它用于两个协作进程之间的进程间通信。两个相互通信的进程被视为服务器和客户端进程，如图\
  \ 4.5 所示。\n\n![](img/Figure-4.5.jpg)\n\n**图 4.5:** 使用 FIFO 进行数据传输\n\n## 服务器进程\n\n\
  在服务器进程中创建并打开 FIFO 以接受客户端请求。使用 `read` 函数读取客户端请求。\n\n在服务器进程中，FIFO 应以读写模式打开，因为如果客户端终止，服务器的读取将返回\
  \ 0 表示文件结束，服务器必须关闭 FIFO 并再次以 O_RDONLY 模式打开，服务器将阻塞直到下一个客户端请求到达。对于始终以读写模式打开的 FIFO，服务器的读取永远不会返回\
  \ 0。\n\n相反，服务器将阻塞在 `read` 调用中，等待下一个客户端请求。\n\n\n\n\n在给出的示例中，创建了一个名为 `fifo` 的 FIFO，分别用于读取和写入。如果\
  \ `fifo` 已经存在，它将返回错误，并打印错误消息 `FIFO already exists`。服务器进程等待从客户端读取请求。如果客户端在在此期间终止，将打印错误消息\
  \ `read failed`；否则，屏幕上将打印来自 `fifo` 的消息。\n\n```c\n#include <fcntl.h>\n#include <stdio.h>\n\
  #include <errno.h>\n#define MSGSIZ  100\nchar *fifo = “fifo”;\nint main(int argc,\
  \ char **argv){\n  int fd;\n  char msg_buf[MSGSIZ+1];\n  if (mkfifo(fifo, 0666)\
  \ == -1){\n    if (errno != EEXIST)\n    printf(“\\n FIFO already exists \\n”);\n\
  \    }\n    if ((fd = open(fifo, O_RDWR)) < 0)\n    printf (“\\nfifo open failed\\\
  n”);\n    for(;;)\n    {\n    if (read(fd, msg_buf, MSGSIZ+1) <0)\n    printf (“\\\
  n message read failed \\n”);\n    printf (“message received:%s\\n”, msgbuf);\n \
  \   }\n  }\n  exit(0);\n}\n```\n\n## 客户端进程\n\n在服务器进程中创建的 FIFO 在客户端进程中以 `O_WRONLY`\
  \ 模式打开。服务器的回复从 FIFO 中读取并写入标准输出。随后关闭并删除客户端的 FIFO。\n\n**示例：**\n\n在给出的示例中，客户端进程以只写模式打开\
  \ FIFO。如果 FIFO 打开操作成功，它将检查传递给 FIFO 打印的消息的消息长度是否大于用于临时存储消息的缓冲区，如果是，所有消息将被复制到缓冲区 `msg_buf`\
  \ 中，并逐个写入 fifo。\n\n```c\ninclude <fcntl.h>\n#include <stdio.h>\n#include <errno.h>\n\
  #define MSGSIZE 100\nchar *fifo = “fifo”;\nint main (int argc, char **argv){\n \
  \ int fd, j, nwrite;\n  char msg_buf[MSGSIZ+1];\n  if (argc < 2){\n    printf (\
  \ “No message passed. \\n”);\n    exit(1);\n  }\n  if ((fd = open(fifo, O_WRONLY\
  \ | O_NONBLOCK)) < 0)\n  printf(“\\n fifo open failed\\n”);\n  for ( j = 1; j <\
  \ argc; j++)\n  {\n  if (strlen(argv[j]) > MSGSIZ)\n  {\n    printf (“message is\
  \ long er than buffer %s\\n”, argv[j]);\n    continue;\n    }\n    strcpy (msg_buf,\
  \ argv[j]);\n    if ((nwrite = write(fd, msg_buf, MSGSIZ+1)) == -1)\n    printf(“\\\
  n message write failed \\n”);\n  }\n  exit (0);\n  }\n```\n\n# 消息队列\n\n消息队列是内核驻留的进程间通信（IPC）。消息队列以链表的形式存储在内核中。一个标识符标识每个消息队列。进程可以对任意队列进行读写操作。进程可以在队列上写入一些消息并退出，并在稍后由另一个进程读取这些消息。\n\
  \n队列上的每条消息具有以下属性：\n\n* 长整型类型消息队列标识符。\n* 消息数据部分的长度。\n* 数据。\n\n内核为每个消息队列维护一个 `msqid_ds`\
  \ 数据结构，如下：\n\n```c\n/* 系统中每个队列对应一个 msqid 结构 */\nstruct msqid_ds {\n  struct ipc_perm\
  \ msg_perm;\n  struct msg *msg_first;  /* 队列上的第一个消息 */\n  struct msg *msg_last;\
  \   /* 队列中的最后一个消息 */\n  time_t msg_stime;      /* 上次 msgsnd 时间 */\n  time_t msg_rtime;\
  \      /* 上次 msgrcv 时间 */\n  time_t msg_ctime;      /* 上次修改时间 */\n  struct wait_queue\
  \ *wwait;\n  struct wait_queue *rwait;\n  ushort msg_cbytes;\n  ushort msg_qnum;\n\
  \  ushort msg_qbytes;      /* 队列最大字节数 */\n  ushort msg_lspid;      /* 上次 msgsnd\
  \ 的 pid */\n  ushort msg_lrpid;      /* 上次接收的 pid */\n}\n```\n\n让我们来讨论其中一些：\n\n\
  * `msg_perm`: 在 `linux/ipc.h` 中定义的 `ipc_perm` 结构对象。它持有消息队列的权限信息，包括访问权限以及创建消息队列的用户信息\
  \ (`uid`)。\n* `msg_first`: 包含指向消息队列中第一条消息的指针（列表头）。\n* `msg_last`: 包含指向消息队列中最后一条消息的指针（列表尾）。\n\
  * `msg_stime`: 上次发送到队列的消息的时间戳 (`time_t`)。\n* `msg_rtime`: 上次从队列中取回的消息的时间戳。\n* `msg_ctime`:\
  \ 上次对队列进行修改的时间戳。\n* `wwait` 和 `rwait`: 当队列满或为空时指向内核等待队列的指针。\n* `msg_cbytes`: 留在队列上的总字节数（所有消息之和）。\n\
  * `msg_qnum`: 消息队列中的当前消息总数。\n* `msg_qbytes`: 消息队列可以容纳的最大字节数。\n* `msg_lspid`: 发送最后一条消息的进程\
  \ ID。\n* `msg_lrpid`: 取回最后一条消息的进程 ID。\n\n## 创建和打开消息队列\n\n进程可以创建一个新的消息队列，也可以连接到已存在的消息队列。`msgget()`\
  \ 函数用于创建和连接。\n\n**原型：**\n```c\nint msgget(key_t key, int msgflg);\n```\n\n`key`\
  \ 是描述队列的系统级唯一标识符。创建消息队列的进程生成一个键标识符，其他进程使用此键连接到队列。`msgflg` 参数包含读写权限，它可以与 `IPC_CREAT`\
  \ 或 `IPC_EXCL` 进行按位或操作，以创建新的消息队列或连接到已存在的消息队列。\n\n当创建新的消息队列时，`msgid_ds` 结构体的以下成员将被初始化：\n\
  \n* `msg_qbytes`: 设置为系统限制值。\n* `msg_ctime`: 设置为当前时间。\n* `msg_perm.mode`: 包含来自 `msgflg`\
  \ 参数的读写权限。\n* `msg_qnum`: 设置为 `0`。\n* `msg_lspid`: 设置为 `0`。\n* `msg_lrpid`: 设置为\
  \ `0`。\n* `msg_stime`: 设置为 `0`。\n* `msg_rtime`: 设置为 `0`。\n* `msg_perm.uid` 和 `msg_perm.cuid`:\
  \ 设置为进程的有效用户 ID。\n* `msg_perm.gid` 和 `msg_perm.cgid`: 设置为进程的有效组 ID。\n\n`msgget()`\
  \ 成功时返回消息队列 ID，失败返回 -1。\n\n## 向队列发送消息\n\n`msgsnd()` 函数用于向消息队列发送消息。\n\n**原型：**\n\
  ```c\nint msgsnd(int msqid, const void *msgp, size_t msgsz, int msgflg);\n```\n\n\
  `msqid` 是由 `msgget()` 返回的消息队列标识符。`msgp` 是要放入队列的消息指针。消息在 `sys/msg.h` 中以 `msgbuf`\
  \ 结构的形式定义如下：\n\n```c\nstruct msgbuf {\n  long mtype;\n  char mtext[1];\n}\n```\n\
  \n编译时对 `mtext` 的长度没有限制；相反，限制由系统管理员设置。`msgsz` 是消息的字节大小。`msgflg` 设置为 `0` 或 `IPC_NOWAIT`。\n\
  \n函数的返回值如下：\n\n* 如果可用消息过多。\n* 如果队列上的字节数超过了 `msg_qbyte` 限制。\n\n如果 `msgflg` 设置为 `IPC_NOWAIT`，则函数返回错误\
  \ `EAGAIN`；如果 `msgflg` 未设置为 `IPC_NOWAIT`，则线程进入睡眠。\n\n**示例：**\n\n在给出的示例中，进程创建一个用于写入消息的消息队列。如果消息队列未创建，将打印错误消息且程序异常退出。一旦消息队列创建成功，从键盘读取消息并发送到队列。如果发生错误，消息队列将被销：\n\
  \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <errno.h>\n#include <sys/types.h>\n\
  #include <sys/ipc.h>\n#include <sys/msg.h>\n\nstruct msgbuf {\n  long mtype;\n \
  \ char mtext[200];\n};\n\nint main(void)\n{\n  struct msgbuf buf;\n  int msqid;\n\
  \  key_t key= 100;\n```\n\n\n\n\n```\nif ((msqid = msgget(key, 0644 | IPC_CREAT))\
  \ == -1) {\nperror(“msgget”);\n  exit(1);\n}\nprintf(“Get message from keyboard\\\
  \\n”);\nbuf.mtype = 1; /* we don’t really care in this case */\nwhile(gets(buf.msg_text),\
  \ !feof(stdin)) {\n  if (msgsnd(msqid, (struct msgbuf *)&buf, sizeof(buf), 0) ==\
  \ -1)\n    perror(“message not sent properly”);\n}\nif (msgctl(msqid, IPC_RMID,\
  \ NULL) == -1) {\n  perror(“message queue destroyed”);\n  exit(1);\n}\nreturn 0;\n\
  }\n```\n\n## 从队列接收消息\n\n`msgrcv()` 函数用于从消息队列中读取消息。\n\n## Prototype 型\n\n```c\nint\
  \ msgrcv(int msqid, void *msgp, size_t msgsz, long msgtyp, int msgflg);\n```\n\n\
  `msqid` 是消息标识符，`msgp` 是指向存储读取消息的缓冲区指针，`msgsz` 是存储消息的缓冲区数据部分的长度，根据 `msgtyp` 参数从队列中接收消息。下表显示了根据\
  \ `msgtyp` 参数的值将读取哪些消息：\n\n| msgtyp | 对 msgrcv() 的影响 |\n| :--- | :--- |\n| 零 | 获取队列上的下一条消息，无论其\
  \ `mtype` 是什么。 |\n| 正数 | 获取 `mtype` 等于指定的 `msgtyp` 的下一条消息。 |\n| 负数 | 获取队列上 `mtype`\
  \ 字段小于或等于参数 `msgtyp` 绝对值的第一条消息。 |\n\n**表 4.1:** msgrcv() 的工作原理\n\n如果消息队列中没有指定类型的消息，则将根据\
  \ `msgflg` 参数的值决定操作。\n\n如果将 `msgflg` 设置为 `IPC_NOWAIT`，函数将立即返回错误 `ENOMSG`，调用者进程将被阻塞，直到：\n\
  \n* 消息队列被销毁。\n* 指定类型标识的消息到达消息队列。\n* 调用线程被中断；在这种情况下，函数返回错误 `EINTR`。\n\n如果为 `msgflg`\
  \ 设置了额外的位 `MSG_NOERROR`，如果实际消息的长度大于 `msgsz` 参数，函数不会返回错误；而是截断消息的额外部分。\n\n## 示例\n\n\
  在给定的示例中，接收器进程连接到消息队列；如果消息队列不存在，将产生错误并异常终止进程。否则，将读取所有消息并打印到屏幕，直到消息队列结束。\n\n```c\n\
  #include <stdlib.h>\n#include <errno.h>\n#include <sys/types.h>\n#include <sys/ipc.h>\n\
  #include <sys/msg.h>\n\nstruct msgbuf {\n  long mtype;\n  char mtext[200];\n};\n\
  \nint main(void)\n{\n  struct msgbuf buf;\n  int msqid;\n  key_t key = 41;\n  if\
  \ ((msqid = msgget(key, 0644)) == -1) { /* connect to the queue */\n    perror(“message\
  \ queue does not exist “);\n    exit(1);\n  }\n  printf(“Receiving messages from\
  \ message queue \\n”);\n  for(;;)\n  {            \n    if (msgrcv(msqid, (struct\
  \ msgbuf *)&buf, sizeof(buf), 0, 0) == -1) {\n      perror(“msgrcv”);\n      exit(1);\n\
  \    }\n    printf(“%s”\\n”, buf.mtext);\n  }\n  return 0;\n}\n```\n\n# 销毁消息队列\n\
  \n使用 `msgctl()` 函数销毁消息队列。\n\n## Prototype\n\n```c\nint msgctl(int cmd, struct msqid,\
  \ int msqid_ds *buf);\n```\n\n这里，`msqid` 是从 `msgget()` 获取的队列标识符。`cmd` 参数设置为 `IPC_RMID`\
  \ 以销毁队列。\n\n此 `cmd` 只能由有效用户 ID 等于超级用户或等于 `msqid` 关联数据结构中的 `msg_perm.uid` 或 `msg_perm.cuid`\
  \ 值的进程执行。\n\n# 控制消息队列\n\n`msgctl()` 系统调用用于对消息队列执行控制操作。\n\n## Prototype\n\n```c\n\
  int msgctl ( int msgqid, int cmd, struct msqid_ds *buf );\n```\n\n其中 `msqid` 是消息标识符。`cmd`\
  \ 参数设置为 `IPC_RMID` 以销毁队列。\n\n此 `cmd` 只能由有效用户 ID 等于超级用户或等于 `msqid` 关联数据结构中的 `msg_perm.uid`\
  \ 或 `msg_perm.cuid` 值的进程执行。\n\n等待，文本说：`msgctl()` 系统调用用于对消息队列执行控制操作。\n\n## Prototype\n\
