  UNIX 是一种强大的操作系统，最早开发于贝尔实验室（Bell Labs），从那时起持续发展。由于其对于服务器、桌面电脑和笔记本电脑具有稳定性、多用户和多任务环境，它在科学、工程和学术界非常受欢迎。该系统分为两个部分，由程序和服务组成，这些元素使得\
  \ UNIX 系统环境如此流行。第二部分是操作系统，它支持这些程序和服务。`files` 和 `processes` 这两个实体是 UNIX 系统模型中主要的控制概念。本章将讨论操作系统中这些控制实体的架构和概述。\n\
  \n## 结构\n\n我们将在本章中涵盖以下主题：\n\n*   UNIX 历史\n*   UNIX 的显著特性\n*   UNIX 操作系统的架构\n*  \
  \ Unix 编程环境\n*   Unix 进程\n*   处理文件和进程控制实体\n*   Unix 文件系统\n\n## 目标\n\n学习完本章后，你将能够：\n\
  \n*   理解 UNIX 操作系统的显著特性，这使其成为一种流行的操作系统。\n*   了解每一层的架构和工作原理。\n*   学习 UNIX 编程环境。\n\
  *   理解文件和进程的基本概念。\n\n# UNIX 历史\n\n贝尔实验室（Bell Laboratories）与 MIT 和通用电气（General Electric）合作，于\
  \ 1965 年开发了一种新型操作系统 Multics（多路复用计算服务）。该操作系统包含的主要特性包括多用户、多处理器和多级（层次结构）文件系统，这些是许多前瞻性特征之一。\n\
  \n1969 年，几位在 Multics 工作的程序员 Ken Thompson、Dennis Ritchie 等人在 `PDP-7` 上设计并实现了第一版本的\
  \ UNIX 文件系统。在加入了几个实用程序后，Brian Kernighan（柯莱尼根）将其命名为 UNIX。UNIX 主要用汇编语言编写。\n\n1971\
  \ 年，该系统在具有 16K 字节内存的 `PDP-11` 上实现，包括 8K 字节的用户程序和 512K 字节磁盘。它的设计具有以下特征，从而引起了研究者的兴趣：\n\
  \n*   程序员环境。\n*   简单的用户界面。\n*   可以组合以执行强大功能的简单实用程序。\n*   层次结构文件系统。\n*   与文件格式一致的设备简单接口。\n\
  *   多用户和多进程系统。\n*   架构独立且对用户透明。\n\n1973 年，决定用 Dennis Ritchie 开发的 C 语言重写 UNIX。这一决定使得将\
  \ UNIX 移植到新机器变得容易。\n\n1974 年，当 Thompson 和 Ritchie 在《ACM 通信》上发表一篇描述新 UNIX 操作系统的论文时，它终于获得了学术界的认可。\n\
  \n1980 年，Berkeley 发布了 UNIX 的 `BSD 4.1`（伯克利软件开发）版本。\n\n1988 年，AT&T 和 Sun Microsystems（太阳系统）联合开发了\
  \ System V Release 4 (`SVR4`)。\n\n1993 年，Novell 从 AT&T 手购买了 UNIX。\n\n# UNIX 的显著特性\n\
  \nUNIX 是一种非常流行的操作系统，因为它具有特殊且实用的特性，这些特性如下。\n\n## 可移植性\n\nUNIX 被认为是一种可移植的操作系统，因为它大部分是用\
  \ C 语言编写的，只有极小部分是用汇编语言编写的。只要有标准的编译器，C 程序就可以很容易从一个硬件环境移动到另一个硬件环境，这使得 UNIX 代码可以在不同的硬件上运行。所有这些只需要标准的\
  \ C 编译器。\n\n应用程序接口允许在 UNIX 下轻松实现许多不同类型的应用程序，无需编写汇编语言。这些应用程序在多个供应商的硬件平台上具有相对的可移植性。\n\
  \n## 多任务\n\n这是通过在所有作业之间智能地分配 CPU 时间来管理的。每个作业根据其优先级获得一个时间片。用户可以在打印文件的同时执行一个 C 程序。用户不需要等待一个应用程序结束再启动另一个。在处理一个前台作业时，可以对一个大文件作为后台作业进行排序。\n\
  \n## 多用户\n\nUNIX 环境设计允许多个用户并发工作，因此他们可以通过操作独立的终端来共享硬硬盘、CPU、内存、打印机和文件的硬件及软件资源。终端是键盘和显示器，连接到被称为主机、服务器或控制台的主电脑。在\
  \ UNIX 中，每个用户都有平等的机会共享资源，同时防止用户锁定他人的资源。\n\n## 设备独立性\n\n在 UNIX 中，输入/输出设备被视为普通文件。文件和设备的输入和输出使用一种称为“间接性”（`<`,\
  \ `>`, `<<`, `>>`）的设计特性来处理，而无需设备的详细规格。程序的输入可以来自任何文件或设备，程序的输出可以发送到任何文件或设备。\n\n##\
  \ 模块化\n\nUNIX 内核由模块组成，系统管理员可以对其进行自定义，仅包含通常需要的模块。如果以后需要新功能，可以将相应的模块添加到内核中，并对其进行重新配置或重建。\n\
  \n## 网络\n\n最初网络并没有包含在 UNIX 系统中。网络在 UNIX 在 BSD 和 At&T 分离后被添加。\n\n网络允许用户登录远程系统。一旦获得远程系统的访问，用户可以使用授予其权限的系统资源。使用名为\
  \ `TCP/IP` 的标准通信协议访问其他系统资源。UNIX 还支持网络文件系统，允许用户访问另一个网络上的文件。\n\n# 工具和实用程序\n\n可用软件和工具提高了系统的生产力。UNIX\
  \ 拥有丰富的工具，并附带了数百个程序。这些工具要么是计算机运行必需的积分实用程序（如命令解释器），要么是运行 UNIX 非必需但为用户提供额外功能的工具（如电子邮件、排版功能\
  \ `troff`、`nroff`、`awk`、`sed` 等）。\n\n# 安全\n\nUNIX 有几个安全级别：\n\n*   为个人用户分配登录名称和密码提供了第一级安全保护。\n\
  *   第二级是文件级，每个文件都有与所有者、组成员和其他人相关的读、写和执行权限，决定了谁可以读取、写入或执行文件。\n*   第三种安全类型是文件可以加密，使得文件处于不可读格式，只有你才能解密并读取。\n\
  \n# UNIX 系统架构\n\nUNIX 系统自 1969 年诞生以来已相当流行，运行在从微处理器到大型机的各种处理能力的机器上，并为它们提供通用的执行环境。操作系统直接与硬件交互，为程序提供通用服务并将它们与硬件隔离。\n\
  \nUNIX 操作系统由硬件层周围的层组成，如图 1.1 所示：\n\n![](img/Figure-1.1.jpg)\n\n**图 1.1:** UNIX 系统架构\n\
  \n它包含：\n\n*   硬件层。\n*   内核层。\n*   Shell 层。\n*   窗口层如 X——与 shell 交互，也可以与应用程序和命令交互。\n\
  \n\n\n\n## 工具程序与应用程序或工具层。\n\n将系统视为一组分层，操作系统通常被称为系统内核或简称 `Kernel`（内核）。它强调了内核与用户程序的隔离性，因为程序不依赖于底层硬件，并且易于在运行于不同硬件的\
  \ UNIX 系统之间进行迁移。如果程序不对底层硬件做任何假设，那么下一层中显示的 `shell` 和编辑器等程序将通过一组定义良好的系统调用与 `Kernel`\
  \ 交互。与 `Kernel` 交互以执行各种操作的系统调用用于调用程序以及在 `Kernel` 与程序之间交换数据。若干被称为 `commands` 的程序位于此层之上。其他应用程序构建在低级程序之上。让我们详细讨论它们：\n\
  \n*   **硬件层**：最内层的层，为操作系统提供服务，称为硬件层。这包括终端、终端控制器、磁盘、磁带、内存以及各种设备控制器。\n*   **内核 (Kernel)**：这是操作系统的核心部分，直接与硬件交互并为用户程序提供服务。`Kernel`\
  \ 存储在一个名为“UNIX”的文件中。系统中只运行一个 `Kernel`。用户程序通过一组作为 `Kernel` 部分的标准系统调用与 `Kernel` 交互，提供\
  \ `Kernel` 的以下基本功能：\n    *   **文件系统管理**：包括对由文件和目录组成的 UNIX 文件系统的管理。这包括创建、打开、读取、写入、关闭文件，以及文件系统与硬件之间的其他操作和数据传输。\n\
  \    *   **内存管理**：包括为程序分配内存、共享内存空间或释放内存。如果系统可用内存不足，`Kernel` 会通过将程序临时写入名为 `swap device`（交换设备）的次级内存来释放内存。\n\
  \    *   **进程管理**：在 UNIX 中，进程是执行中的程序。进程管理包括将各种进程调度到 CPU 以及执行进程，包括创建、终止或挂起进程。它还包括进程间通信。\n\
  \    *   **存储管理**：为用户数据分配辅助存储磁盘并管理空空间。\n    *   **设备管理**：包括允许对外围设备（如终端、磁带机、磁盘驱动器和网络设备）进行控制访问。\n\
  *   **Shell**：这是 UNIX 中用户可见的部分。它是命令解释器，负责解释用户输入的命令并将其传递给 `Kernel`，由 `Kernel` 执行。`shell`\
  \ 是为每个使用 UNIX 的用户独立运行的程序。系统中运行的 `shell` 数量等于同时在系统中工作的用户数量。有不同类型的 shell，常用的有有 `Bourne\
  \ shell`、`C Shell`、`Korn Shell` 等：\n    *   由 Steve Bourne 创建的 `Bourne shell` 最流行，并包含在每个\
  \ UNIX 系统中。\n    *   `C shell` 在 UNIX 程序员中非常流行，由 Bill Joy 在伯克利创建。`C shell` 优于 `Bourne`\
  \ 的优点如下：\n        *   它允许对命令设置别名；即我们可以用别名重命名命令，这样就可以用短别名代替长命令。\n        *   `C shell`\
  \ 具有命令历史功能，可以回溯之前输入的命令。\n    *   `Korn Shell` 是 `Bourne shell` 的超集，更加强大。由 AT&T 实验室的\
  \ David Korn 设计。\n    *   `Bourne Again Shell (Bash)` 来自自由软件基金会的 GNU 项目，基于 `shell`。\n\
  *   **工具程序与应用程序**：UNIX 中有数百种工具程序。工具程序是标准的 UNIX 程序，用于为用户提供支持。大多数 UNIX 工具程序以应用程序的形式存在：\n\
  \    *   文件管理：`rm`、`cat`、`ls`、`rmdir`、`mkdir`。\n    *   用户管理：`passwd`、`chmod`、`chgrp`。\n\
  \    *   进程管理：`kill`、`ps`。\n    *   打印：`lp`、`troff`、`pr`。\n    *   程序开发工具，如 `sccs`、`make`、编辑器（`vi`\
  \ 和 `ed`）以及编译器。\n    *   UNIX 电子邮件工具。\n*   **窗口层**：UNIX  GUI 是位于核心操作系统之上的独立层。`X\
  \ window system` 是所有现代 UNIX 操作系统的底层图形层。它负责接受键盘和鼠标等输入并在显示器上绘制图形对象。绘制图形和从设备获取输入是名为\
  \ `Window manager`（窗口管理器）软件的工作。`X` 有许多窗口管理器可用。通常，窗口管理器是专有软件，只运行在特定类型的 UNIX 上。其中一些是开源的，可以在任何安装了\
  \ `X` 的系统上运行。\n\n`X Window system` 有一些非常独特且实用的功能。这些功能由 `X` 直接提供，因此所有 X 窗口管理器和所有\
  \ UNIX/X11 系统共有。\n\n# UNIX 编程环境\n\nUNIX 是一种基本上为多用户和多任务环境设计的的可移植操作系统。它包含数百个简单的单用途功能，这些功能几乎可以组合以完成想象的所有处理任务。UNIX\
  \ 系统用于三种不同的编程环境。\n\n## 个人环境\n\n尽管 UNIX 最初是为多用户环境设计的，但某些用户将其安装在个人电脑上。随着免费 UNIX 系统\
  \ `LINUX` 的发明，这一趋势得到了加速。2001 年，Apple 系统将 UNIX 整合为其内核。\n\n## 分时环境\n\nUNIX 是一种多用户、多任务系统，运行在分时环境中，通过单处理单元处理多个任务。`Kernel`\
  \ 维护一个任务列表，并为每个任务分配时间片，然后是下一个任务，依此类推。通常，内核在进程之间的切换非常快，使得每个用户都能获得单独关注。\n\n图 1.2：多用户环境\n\
  \n## 客户端/服务器环境\n\n客户端/服务器计算环境在服务器计算机和客户端计算机之间划分处理功能。在客户端/服务器模型中，数据处理负载在客户端计算机和强大的服务器计算机之间共享。服务器计算机专门存储和管理数据并满足请求。服务器接收客户端的结构化请求，处理请求的数据并将数据传回客户端。客户端从接口接收用户输入，使用其\
  \ CPU 处理信息，并将结果展示给用户。\n\n**注意：在单用户环境中，程序可能有多个实例，因为进程默认可能会拆分为两个进程**\n\n### UNIX 进程\n\
  \n执行中的程序就是进程。在 UNIX 中，进程是一个工作单元。如果 n 个用户正在执行同一个程序，系统中就有 n 个进程在执行。进程通过遵循严格的指令序列执行，该序列自包含且不会跳转到另一个进程。\n\
  \n所有的 UNIX 命令都是程序化的，因此在执行时会对系统进程做出贡献。\n\n## 进程属性\n\nUNIX 中的每个进程都具有某些属性（如表 1.1 所示），这些属性影响进程的执行。\n\
  \n| **属性** | **含义** |\n\n\n\n\n\n| PID | 进程标识是一个唯一数字 |\n| :--- | :--- |\n| PPID\
  \ | 父进程的进程 ID |\n| UID | 进程所有者的用户 ID |\n| GID | 所有者所属组的 ID |\n| EUID | 有效用户 ID |\n\
  | EGID | 有效组 ID |\n| Priority | 进程运行的优先级 |\n\n**表 1.1:** 进程属性\n\n# 进程状态\n\n进程的生命周期可以用一组状态来建模，每个进程在任何时刻都可以处于这些状态中的任何一个。在\
  \ UNIX 中，进程在生命周期内可能会经历共九阶段，如图`图 1.3`所示：\n\n![](img/Figure-1.3.jpg)\n\n**图 1.3:**\
  \ UNIX 进程状态\n\n每个进程状态的描述所示`表 1.2`：\n\n| 进程状态 | 描述 |\n| :--- | :--- |\n| 执行中（用户态）\
  \ | 在用户态下运行。 |\n| 执行中（内核态） | 在内核态下运行。 |\n| 内存中就绪 | 只要内核调度它，即可立即运行。 |\n| 交换设备中就绪\
  \ | 进程已就绪运行，但必须调入内存以便内核可以对其进行调度。 |\n| 内存中睡眠 | 无法执行，等待某个事件发生。 |\n| 交换设备中睡眠 | 进程被阻塞，正在等待交换设备中的某个事件。\
  \ |\n| 被抢占 | 进程正在从内核态返回用户态，但内核进行抢占以调度另一个进程。 |\n| 已创建 | 新创建的进程尚未就绪执行。 |\n| 僵尸 | 进程刚刚完成但尚未释放其资源。\
  \ |\n\n**表 1.2:** 进程状态\n\n在 UNIX 中，进程以两种不同的模式执行：用户态和内核态（在下一节中解释）。\n\n- 用户态：当用户进程执行时，它是在用户态下执行的。在用户态下，进程可以访问自己的指令和数据，但不能访问内核指令、数据或其他进程的资源。\n\
  - 内核态：当用户进程执行系统调用时，进程的执行模式从用户态变为内核态；由内核执行用户的请求。内核态下的进程可以同时访问内核地址和用户地址。\n\n一个典型的\
  \ UNIX 系统由一组进程组成：执行系统代码的操作系统进程和执行用户代码的用户进程。系统进程在内核态运行，以执行管理和维护活动，如内存分配、系统统计和进程调度。用户进程在用户态运行，以执行程序和工具。当用户进程调用系统调用或发生中断或异常时，用户进程会进入内核态。\n\
  \n注意：UNIX 不适用于实时处理，因为抢占只能在进程准备从内核态移动到用户态时发生。当进程处于内核态时，它是无法被抢占的。\n\n# 进程上下文\n\n进程的上下文表示进程的当前运行状态。进程上下文包括其地址空间、栈空间、虚拟地址空间、寄存器组镜像、统计信息、关联的内核数据结构以及状态信息。通常，进程上下文包含以下三个部分：\n\
  \n1. 用户级上下文：用户级上下文包含编译源文件后生成的 Basic 用户程序。程序的基本元素分为文本段（text）和数据段（data）。文本段持有程序的只读指令。数据区域是多个进程可访问的共享内存区域。虽然只有一个共享内存区域，但在虚拟内存的概念下，每个共享进程在自己的地址空间中可能有一个共享内存区域。用户栈区域用于存储返回值参数和函数调用的指针。\n\
  2. 寄存器上下文：寄存器级上下文在进程未执行时，将进程状态信息存储在处理器的寄存器中。\n3. 系统级上下文：系统级上下文由操作系统管理进程所需的信息组成。系统级上下文分为静态和动态部分。静态部分包含进程表中每个进程的条目，用于存储进程控制信息，以便内核随时可以使用。用户（U）区域是静态上下文的另一部分，包含了内核在进程上下文中执行时所需的额外控制信息。静态上下文的第三部分是每个进程区域表，用于内存管理系统在主内存与进程之间交换换出进程。最后，系统级上下文的动态部分是内核栈。\n\
  \n内核栈用于在内核态下执行的进程。内核栈存储发生中断或过程调用时所需的信息。\n\n执行在内核态态的进程使用内核栈。内核栈存储发生中断或过程调用时所需的信息。`表\
  \ 1.3`显示了当前系统中执行的进程在不同上下文下的可用信息集。\n\n| 用户级上下文 | |\n| :--- | :--- |\n| 进程文本 | 与程序相关的机器指令。\
  \ |\n| 进程数据 | 程序可访问的数据。 |\n| 用户栈 | 包含局部变量、参数以及指向用户代码函数的指针。 |\n| 寄存器上下文 | |\n| 程序计数器\
  \ | 下一条执行指令的地址。 |\n| 栈指针 | 指向内核栈或用户栈的顶部。 |\n| 通用寄存器 | 这些寄存器的值取决于硬件。 |\n| 处理器状态寄存器\
  \ | 抢占时的处理器状态。 |\n| 系统级上下文 | |\n| 进程表条目 | 包含进程的状态。 |\n| 进程区域表 | 虚拟到物理地址的映射以及对进程的访问权限。\
  \ |\n| 用户 (U) 区域 | 上下切换所需的进程控制信息。 |\n| 内核栈 | 内核过程的栈帧。 |\n\n**表 1.3:** 进程上下文\n\n\n\
  \n\n在系统 V 中，系统启动时会读取 `/etc/initab` 文件，根据运行级别（run level）的值将系统置于不同的模式（单用户或多用户模式）。对于正常的多用户操作，会执行\
  \ `/etc.rc` 文件，该文件会启动各种守护进程。\n\n无论何种 UNIX 系统，init 进程都会通过 `fork` 复制自身的副本来激活终端。每个子进程都会执行\
  \ `/etc/getty` 进程来设置终端速度、显示问候信息，并等待用户输入用户名。Getty 进程执行 `/bin/login` 程序来检查 `/etc/passwd`\
  \ 文件中是否存在该登录用户。如果从 `./etc/passwd` 文件中找到登录名，它会提示用户输入密码。如果被拒绝，Getty 会提供三次输入用户名和密码的机会。\n\
  \ninit、Getty 和 login 进程以超级用户的用户 ID 和有效用户 ID 执行。所有这些进程都以相同的进程 ID 运行，因为进程 ID 在 `exec`\
  \ 系统调用期间不会改变。\n\n![](img/Figure-1.4.jpg)\n\n**图 1.4：** 进程关系\n\n# 登录程序\n\n在登录时，系统登录程序会设置以下内容：\n\
  \n*   使用 `chdir` 系统调用将当前工作目录设置为登录目录。\n*   使用 `setgid` 和 `setuid` 系统调用，按照密码文件条目中指定的顺序设置登录进程的有效组\
  \ ID 和有效用户 ID。\n*   执行 `/etc/passwd` 文件中指定的 shell 程序；如果密码文件中未指定 shell，则执行 `/bin/sh`。\n\
  \n由登录程序调用的 shell 被称为 login-shell，并被视为所有进程的父进程。\n\n# Shell 进程\n\nshell 进程通常等待用户输入命令。当用户在命令行上输入命令时，shell\
  \ 通过 `fork` 复制一个副本，并等待子进程终止。子 shell 进程检查 `PATH` 环境变量以搜索命令文件。UNIX 中的命令通常位于 `/bin`\
  \ 目录。\n\n当命令执行完成后，它会调用 `exit` 系统调用并带其退出状态退出，这会终止子进程并允许 `wait` 返回父进程。\n\n# 网络登录\n\
  \n在 4.3 BSD 中，为了启动系统，init 会执行 shell 脚本 `/etc/rc`。该文件执行一些簿记工作，然后调用守护进程。由 shell 脚本启动的守护进程之一是\
  \ `netd`。一旦 shell 脚本终止，`inetd` 的父进程将变为 `init`。该守护进程可以用于使用 TCP 或 UDP 服务器。该守护进程代表许多服务创建\
  \ sockets 并同时监听所有这些。\n\n# 文件和目录\n\nUNIX 文件的组织如图所示：\n\n![](img/Figure-1.5.jpg)\n\n\
  **图 1.5：** UNIX 目录结构\n\nUNIX 文件系统是目录和文件的分级树结构。该树动态地增长或收缩。\n\n文件系统树从根节点 `/` 开始；每个非叶子节点都是文件目录，叶子节点是目录、普通文件或特殊设备文件。\n\
  \n# 文件\n\n对于 UNIX 来说，一切皆为文件；这意味着在 UNIX 数据中，程序文件、目录、设备和链接都被视为文件。每个文件都有一个名称、一个所有者访问权限。每个文件都被分配了一个唯一的\
  \ inode 编号（索引）。文件的所有属性都存储在文件系统的 inode 条目中。inode 条目存储了除文件名以外的所有内容。名称存储在目录中，并通过指针与\
  \ inode 关联。\n\n每个 inode 通常包含以下内容：\n\n*   文件内容在磁盘上的位置。\n*   文件类型。\n*   文件的大小（字节）。\n\
  *   文件 inode 最后一次修改的时间。\n*   文件内容最后一次修改的时间。\n*   文件最后一次被读取、写入及进行其他操作的时间。\n*   引用计数，文件拥有的不同名称数量。\n\
  *   文件的所有者 ID。\n*   文件的组 ID。\n*   文件的访问权限位。\n\n在 UNIX 中，每个文件都有一个关联的非负数字，称为文件描述符。当任何程序访问文件时，内核使用文件描述符来标识文件。每个文件或目录在目录条目中都有一个关联的文件名。文件名中不能出现斜杠和空字符。某些\
  \ UNIX 系统将文件名限制为 14 个字符，而大多数其他系统允许文件名为 256 个字符。\n\n每个目录和文件在它的父目录中都有一个对应的条目。目录条目指定了文件的属性，例如文件类型、文件大小、文件所有者以及对文件的权限。根目录是目录树的第一个目录，它包含自己的信息。每个目录还包含两个特殊目录条目的信息：当前目录和当前目录的父目录。\n\
  \n`Note: [Reserved Inode Number]:`\n\n`0: 已删除的文件 / 目录`\n\n`1: 文件系统相关（文件系统创建时间 /\
  \ 坏块计数等）`\n\n`2: 指向文件系统的根目录。`\n\n# 路径名\n\n每个文件或目录都通过其路径名标识；文件或目录的路径名可以是绝对路径或相对路径。\n\
  \n绝对路径以根目录 `/` 开始，遵循目录树分支，每个分支之间用 `/` 分隔，直到找到所需的文件，例如 `/bin`。\n\n相对路径指定相对于另一个（通常是当前目录）的路径。因此，如果当前目录是\
  \ `/bin`，则该目录下的文件路径指定为 `../`（这表示控制进入上一级目录再回来）。\n\n# 文件类型\n\nUNIX 将一切视为文件。UNIX 中有七种类型的文件，如图所示：\n\
  \n![](img/Figure-1.6.jpg)\n\n**图 1.6：** UNIX 文件类型\n\nUNIX 文件描述如下：\n\n*   **普通文件：**\
  \ 它们是无格式字节的序列。普通文件可以包含 ASCII 字符、二进制字符或两者混合。文本文件也被视为普通文件。所有的 shell 脚本和程序都是高级语言编写的，甚至对象代码也被视为普通文件。文件内部不包含头部、尾部、标签信息或\
  \ EOF 字符。\n*   **目录文件：** 它们是格式化字节的序列，包含其他文件和子目录的信息。目录包含其中文件或目录的名称及其 inode（索引节点）编号。对于目录文件，ls\
  \ -l 命令输出的第一个字符为 d。进入目录或列出目录中的文件需要该目录的读取权限。在目录中创建文件或子目录需要该目录的写权限。\n*   **特殊文件：**\
  \ 代表物理设备，如键盘、磁带、磁盘和打印机。它们是字符设备、块设备、socket 等。操作系统使用这些文件与硬件通信。我们可以使用处理普通文件的相同命令处理这些特殊文件，但操作系统负责处理设备。物理设备由\
  \ /dev 目录表示。\n*   **管道 (PIPE)：** 一种用于进程间通信的文件类型。它们的实现允许进程即使不知道管道另一端是什么进程也能进行通信。管道基本上有两种类型：命名管道和无名管道。\n\
  \n\n\n\n\n- **Sockets (套接字)**：UNIX sockets 用于相同或不同机器的两个进程之间建立通信。与其他类型的文件一样，sockets\
  \ 也与文件描述符相关。\n- **Symbolic link (符号链接)**：符号链接是一种指向现有文件的特殊类型文件。它也称为软链接。可以通过文件名或链接名访问文件内容。\n\
  - **FIFO (先进先出)**：`FIFO`即 First In First Out（先进先出）是一种文件，它有一个目录项并可以通过路径访问。它作为两个进程之间的管道起作用。\n\
  \n# UNIX 文件命名规范\n\n每个文件或目录在目录项中都有一个关联的文件。某些 UNIX 系统将文件名限制为 14 个字符，而大多数其他系统允许文件名包含\
  \ 256 个字符。通常，UNIX 对文件遵循以下命名规范：\n\n- 文件名是区分大小写的。\n- 键盘上几乎所有的字符都允许出现在文件名中，除了：\n  -\
  \ `|| ; , ! @ # $ () <> / \\ “ ‘ `{} [] + = & ^ <space> <tab>`\n- 使用字符分隔符使文件名易于阅读。\n\
  - 在 UNIX 中文件名不指定其功能。\n\n# 文件名与元字符\n\n如果文件名中包含 `*`、`?` 和 `[` 字符，shell 会扩展该文件名。文件名中的\
  \ `*` 可以替换为 0 或多个允许的字符，`?` 可以替换为文件名中的任何单个字符，而方括号则指定特定字符组合的范围。字符范围使用—在方括号中指定。如果方括号内的第一个字符是\
  \ `!` 符号，则使用该范围其他字符的补集。*表 1.4*\n\n| 模式 | 扩展 |\n| :--- | :--- |\n| `*` | 当前目录下的所有文件。\
  \ |\n| `?` | 文件名包含单个字符的文件。 |\n| `[a-h]` | 由 a 到 d 组成的单字符文件名。 |\n| `[abcdefgh]` |\
  \ 与上相同。 |\n| `[a-ef-h]` | 与上相同。 |\n| `*[0-9]` | 结尾为数字的文件。 |\n| `?[0-9]` | 结尾为数字的两个字符文件名。\
  \ |\n| `[a-zA-Z0-9]` | 包含单个字母或数字的文件名。 |\n\n**表 1.4：** 用于文件命名的模式\n\n**注意：在 UNIX 中，`.`\
  \ 并不是特殊字符。文件名可能包含点也可能不包含。通常情况下，以点开头的文件名不会使用 `ls` 命令列出。**\n\n# UNIX 文件系统\n\n每个磁盘驱动器被划分为多个分区。每个分区可以包含一个文件系统。文件系统由一系列逻辑块组成，每个块由\
  \ 512、1024 或任何 512 字节的倍数组成。文件系统中逻辑块的大小相同，但在不同文件系统之间可能会变化。\n\n文件系统具有以下结构，描述如下：\n\n\
  启动块 超级块 Inode 列表 数据块\n\n启动块（Boot block）是第一个块，包含了启动系统所需的引导代码。虽然启动系统只需要一个启动块，但每个文件系统都有一个空的启动块。\n\
  \n超级块（superblock）描述系统状态并包含以下信息：\n\n- 文件系统大小\n- 空闲块数量\n- 可用空闲块列表\n- 下一个空闲块的索引\n-\
  \ inode 列表大小\n- 空闲 inode 数量\n- 空闲 inode 列表\n- 检查超级块是否被修改的标志\n\ninode 列表是 inode 的列表。它包含了每个文件的索引节点（index\
  \ node）条目。inode 包含：\n\n- 文件类型\n- 权限\n- 硬链接数量\n- 所有者用户-id\n- 组 id\n- 文件大小\n- 最后访问时间\n\
  - 最后修改时间以及\n- 数据块的位置\n\n最后，数据块从 inode 列表的末尾开始，包含文件数据和管理数据。分配的数据块只属于一个文件系统。\n\n#\
  \ 重要的 UNIX 目录\n\n*表 1.5* 显示了与系统资源（包括用户、文件、进程和设备）管理相关的 UNIX 目录。\n\n| 目录 | 描述 |\n\
  | :--- | :--- |\n| `/` | 根目录-内核。 |\n| `/etc` | 启动系统、通信所需的文件，以及控制启动过程的脚本。 |\n| `/etc/config`\
  \ | 系统配置文件。 |\n| `/etc/cron.d` | Cron 访问文件和 FIFO。 |\n| `/etc/rc#.d` | 进入运行级别 # (S,0,1,2,3)\
  \ 时执行的操作。 |\n| `/usr` | 系统文件目录。 |\n| `/usr/bin` | 系统二进制文件。 |\n| `/usr/etc` | 进一步的系统通信和管理程序。\
  \ |\n| `/usr/lib` | 对象文件库，发送邮件。 |\n| `/var` | 管理程序的目录。 |\n| `/var/adm` | 管理程序和日志。\
  \ |\n| `/var/log` | 系统日志。 |\n| `/var/spool/mail` | 邮件队列目录。 |\n| `/var/mail` | 邮件队列目录。\
  \ |\n| `/var/spool` | cron、日志等的目录。 |\n| `/dev` | 设备目录。 |\n| `/home` `/usr/users`\
  \ | 用户目录。 |\n| `/usr/local` | 本地安装的文件。 |\n| `/tmp` | 包含在系统中创建的临时文件。 |\n\n**表 1.5：**\
  \ 重要的目录\n\n## 结论\n\n操作系统是一种特殊的系统软件，用于管理所有资源以方便用户完成工作。UNIX 是一种多用户、多任务的可移植操作系统，用于文本处理、通信和许多其他任务。UNIX\
  \ 运行在不同的环境中。\n\n- **内核 (Kernel)**：始终驻留在内存中执行最核心任务的操作系统部分。\n- **多处理 (Multiprocessing)**：允许单个处理器处理内存中多个程序的技术。\n\
  - **父进程 (Parent process)**：创建并控制多个子进程的作业。\n- **子进程 (Child process)**：由父进程创建并控制的进程。\n\
  - **文件 (File)**：数据的集合。UNIX 文件包括普通文件、目录和设备文件。\n- **文件属性 (File attributes)**：描述文件的特性。\n\
  - **init**：第一个非内核进程，因此是所有进程的父进程。\n- **进程 (Process)**：执行中的程序。\n- **进程 ID (Process\
  \ ID)**：进程的数字标识符。\n- **目录 (Directory)**：作为其他文件和目录容器的文件类型。\n\n# 测试技能\n\n1. 哪些信息存储在\
