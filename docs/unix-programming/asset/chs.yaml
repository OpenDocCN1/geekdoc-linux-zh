  \ queue destroyed”);\n  exit(1);\n}\nreturn 0;\n}\n```\n\n\n\n\n在给定的示例中，创建了一个用于读写的共享内存段。创建的内存段被挂载到当前程序，并将字符串\
  \ `str` 写入其中。写入后，该进程进入睡眠状态，直到另一个进程读取该字符串并在内存段中放入 `*`。\n\n# 服务端程序\n\n```c\n#include\
  \ <sys/types.h>\n#include <sys/ipc.h>\n#include <sys/shm.h>\n#include <stdio.h>\n\
  \n#define SHMSIZE     100\n#define SHM_KEY  1267\n\nmain()\n{\n    char *str;\n\
  \    int shmid;\n    key_t key;\n    char *shm, *s;\n    key = SHM_KEY;\n    /*\
  \    创建内存段。*/\n    if ((shmid = shmget(key, SHMSZ, IPC_CREAT | 0666)) < 0) {\n \
  \       printf(\"Segment not created successfully\");\n        exit(1);\n    }\n\
  \    /* 现在我们将该内存段挂载到我们的数据空间     */\n    if ((shm = shmat(shmid, NULL, 0)) == (char\
  \ *) -1) {\n        perror(\"shmat\");\n        exit(1);\n    }\n    s = shm;\n\
  \    scanf(\"%s\",&str);\n    strcpy(s,str);\n    *s = NULL;\n    /* 进程进入睡眠状态，直到其他进程读取共享段并放入\
  \ *  */\n    while (*shm != '*')\n        sleep(1);\n    exit(0);\n}\n```\n\n在客户端程序中，内存段被访问并挂载到客户端进程。如果挂载成功，则从内存段中读取字符串并打印到屏幕上，直到找到\
  \ NULL 字符。一旦内存段为空，客户端进程会将 `*` 放入段中。服务端进程一旦发现 `*` 就会终止。\n\n```c\n#include <sys/types.h>\n\
  #include <sys/ipc.h>\n#include <sys/shm.h>\n#include <stdio.h>\n\n#define SHMSIZE\
  \     100\n#define SHM_KEY  1267\n\nmain()\n{\n    int shmid;\n    key_t key;\n\
  \    char *shm, *s;\n    if ((shmid = shmget(SHM_KEY, SHMSIZE, 0666)) < 0) {\n \
  \       printf('\\n Memory segment not created successfully \\n');\n        exit(1);\n\
  \    }\n    if ((shm = shmat(shmid, NULL, 0)) == (char *) -1) {\n        perror(\"\
  shmat\");\n        exit(1);\n    }\n    /* 现在读取服务端放入内存的内容  */\n    for (s = shm;\
  \ *s != NULL; s++)\n        putchar(*s);\n    putchar('\\n');\n    /* 从共享内存中读取字符后，在对应位置放入\
  \ *  */\n    *shm = '*';\n    exit(0);\n}\n```\n\n# 进程同步\n两个并发进程在共享资源时必须进行同步，以避免死锁。UNIX\
  \ 使用信号量来控制两个进程之间共享资源的访问。\n\n## 信号量\n信号量并不完全是一种 IPC（进程间通信）形式；它是一个用于控制多个进程共享资源访问的变量。信号量是一个包含整数值的资源，允许进程通过在原子操作中测试和设置该值来实现同步。这意味着，测试信号量值并根据测试结果将其设置为不同值的进程，可以保证在操作过程中没有其他进程会干扰。\n\
  \n进程在获取共享资源之前需要执行测试。对共享资源的访问由信号量控制。在使用资源之前，执行以下步骤来检查信号量的值：\n\n1. 进程测试控制资源访问的信号量。\n\
  2. 如果信号量值为正，则进程可以使用该资源。进程一旦获取资源访问权限，会将信号量的值减 1，表示它已使用了一个资源单元。\n3. 如果信号量值为 0，进程进入睡眠状态；当进程唤醒时，会再次检查信号量的值。\n\
  4. 在完成资源的使用后，信号量的值加 1，以便任何其他处于睡眠状态的进程可以访问。\n\n图 4.6：信号量\n\n## 信号量操作\n信号量上执行两种类型的操作：`wait`（等待）和\
  \ `signal`（信号）。`wait` 操作首先检查信号量的值是否等于某个数。如果是，则减少其值并返回。如果不是，该操作将阻塞调用进程，直到信号量的值达到期望值。`signal`\
  \ 操作增加信号量的值，唤醒一个或多个等待信号量的进程。\n\n## 信号量集\n信号量集是一个将一组信号量存储在一起的结构，可能允许进程对部分或全部信号量共同提交一个事务。事务意味着我们保证要么所有操作都成功完成，要么一个都不执行。\n\
  \n内核为每个信号量集维护一个结构：\n\n```c\nstruct semid_ds {\n    struct ipc_perm sem_perm;   /*\
  \ 权限 ..ipc.h */\n    time_t sem_otime;           /* 上次 semop 时间 */\n    time_t sem_ctime;\
  \           /* 上次修改时间 */\n    struct sem *sem_base;      /* 指向数组中第一个信号量的指针 */\n\
  \    struct wait_queue *eventn;\n    struct wait_queue *eventz;\n    struct sem_undo\
  \ *undo;     /* undo 请求 */\n    ushort sem_nsems;           /* 数组数量 */\n};\n```\n\
  \n让我们详细讨论它们：\n\n* `sem_perm`: `ipc_perm` 结构包含访问权限。\n* `sem_otime`: 上次 `semop` 操作的时间。\n\
  * `sem_ctime`: 上次修改此结构的时间。\n* `sem`: 内核用于维护信号量值的内部结构。\n* `undo`: 关于此数组的 undo 请求。\n\
  * `sem_nsems`: 信号量的数量。\n* `wait_queue`: 指向任务结构的循环列表。\n\n## 创建信号量\n通过 `semget` 系统调用创建信号量或访问现有信号量，该调用返回信号量\
  \ ID。\n\n原型：\n\n```c\nint semget(key_t key, int nsems, int semflg);\n```\n\n`key`\
  \ 是用于标识此信号量集的唯一标识。下一个参数 `nsems` 是在新信号量集中创建的信号量数量；`semflg` 参数指定新信号量集的权限。如果 `semflg`\
  \ 的值仅为 `IPC_CREAT`，则将返回新创建的信号量集的标识，或与 key 参数匹配的现有信号量集的标识。如果 `IPC_CREAT` 配合 `IPC_EXCL`\
  \ 使用，则创建新集，如果信号量集已存在则返回 -1。\n\n# 控制信号量\n信号量集创建后，使用 `semctl` 系统调用控制整个集或特定的信号量。\n\n\
  原型：\n\n```c\nint semctl ( int semid, int semnum, int cmd, union semun arg );\n```\n\
  \n`semid` 是信号量集的键标识，`semnum` 参数是信号量集中目标操作的信号量索引。`cmd` 参数控制信号量操作，它具有以下值：\n\n* `IPC_STAT`:\
  \ 获取集的 `semid_ds` 结构并将其存储在 `semun` 联合体 `buf` 参数的地址中。\n* `IPC_SET`: 设置集的 `semid_ds`\
  \ 结构中的 `ipc_perm` 成员。从 `semun` 联合体的 `buf` 参数获取值。\n* `IPC_RMID`: 从内核中删除该集。\n* `GETALL`:\
  \ 给集中所有信号量的值。这些整数值存储在联合体数组成员指向的无符号短整数数组中。\n* `GETNCNT`: 返回当前等待资源的进程数量。\n* `GETPID`:\
  \ 返回执行上次 `semop` 调用的进程 PID。\n\n\n\n\n\n*   `GETVAL`: 返回集合中单个信号量的值。\n\n## 信号量操作 semop()\n\
  \n`semop()` 系统调用用于对信号量集原子地执行一组用户定义的信号量操作。\n\n### 原型\n\n```\nint semop(int semid,\
  \ struct sembuf *sops, unsigned int nsops);\n```\n\n参数 `semid` 是通过调用 `semget()`\
  \ 获取的标识信号量集的数字，下一个参数 `sops` 是指向用户定义的 `sembuf` 结构数组的指针，该数组填充了信号量命令；第三个参数 `nsops`\
  \ 指定信号量操作结构的数量。\n\n```c\nstruct sembuf {\n    ushort sem_num;\n    short sem_op;\n\
  \    short sem_flg;\n};\n```\n\n`sem_num` 是集合中要操作的信号量的编号，`sem_op` 定义了对信号量进行的操作。其含义取决于\
  \ `sem_op` 是正数、负数还是零。让我们来看一下：\n\n| sem_op | 发生了什么 |\n| :--- | :--- |\n| 正数 | `sem_op`\
  \ 的值加到信号量的值上。这是程序使用信号量标记资源已分配的方式。 |\n| 负数 | 如果 `sem_op` 的绝对值大于信号量的值，调用进程将阻塞，直到信号量的值达到\
  \ `sem_op` 的绝对值。最后，从信号量的值中减去 `sem_op` 的绝对值。这是进程释放受信号量保护资源的方式。 |\n| 零 | 此进程将等待相关的信号量达到\
  \ 0。 |\n\n**表 4.2：** `sem_op` 变量的值\n\n`sem_flg` 设置为 `IPC_NOWAIT` 和 `SEM_UNDO`。如果操作断言了\
  \ `SEM_UNDO`，它将在进程退出时被撤销。\n\n# 销毁信号量](#toc.xhtml_s118a)\n\n使用 `semctl()` 系统调用删除信号量集。`cmd`\
  \ 参数设置为 `IPC_RMID`，这告诉 `semctl()` 移除该信号量集。参数 `semnum` 和 `arg` 在 `IPC_RMID` 语境下没有意义，可以设置为任何值。\n\
  \n### 示例：\n\n假设我们集合中 ID 为 `semset_id` 的信号量初始值为 `1`：\n\n```c\n/* 此函数根据给定路径更新文件内容。\
  \ */\nvoid update_file(char* file_path, int number)\n{\n    /* 信号量操作结构。 */\n   \
  \ struct sembuf sem_op;\n    FILE* file;\n    /* 等待信号量，除非它的值非负。 */\n    sem_op.sem_num\
  \ = 0;\n    sem_op.sem_op = -1;   /* <-- 注释 1 */\n    sem_op.sem_flg = 0;\n    semop(sem_set_id,\
  \ &sem_op, 1);\n    /* 注释 2 */\n    /* 我们“锁定”了信号量，确保对文件的排他访问。  \n\n/* 以某种方式操作文件。例如，向其中写入数字。\
  \ */\n    file = fopen(file_path, “w”);\n    if (file) {\n        fprintf(file,\
  \ “%d\\n”, number);\n        fclose(file);\n    }\n    /* 最后，信号信号量 - 将其值加一。 */\n\
  \    sem_op.sem_num = 0;\n    sem_op.sem_op = 1;   /* <-- 注释 3 */\n    sem_op.sem_flg\
  \ = 0;\n    semop(sem_set_id, &sem_op, 1);\n}\n```\n\n这段代码需要一些解释，特别是关于 `semop()`调用的语义，如下：\n\
  \n* **注释 1：** 在访问文件之前，我们使用 `semop()` 等待信号量。在 `sem_op.sem_op` 中提供 `-1` 意味着：如果信号量的值大于或等于\
  \ `1`，则将该值减 1 并返回给调用者。否则（值小于 1），阻塞调用进程，直到信号量的值变为 `1`，此时我们返回给调用者。\n\n* **注释 2：**\
  \ `semop()` 的语义确保当我们从此函数返回时，信号量的值为 0。为什么？它不可能更小，否则 `semop()` 将不会返回。由于我们之后信号信号量的方式，它也不更大。\n\
  \n* **注释 3：** 在我们完成文件操作后，我们将信号量的值加 1，可能会唤醒正在等待信号量的进程。如果有多个进程在等待信号量，则第一个被阻塞在上面的进程会被唤醒。\n\
  \n# 结论](#toc.xhtml_s119a)\n\n进程间通信是允许两个进程进行通信的重要机制。IPC 可用于在协作进程之间共享数据，或者通过这一个进程控制其他进程的活动；IPC\
  \ 用于单个进程内线程之间、同一系统中的两个进程之间，或分布式环境中的进程之间的通信。我们讨论了 IPC 的概念，还讨论了用于进程同步的信号量概念，以避免共享资源时出现死锁情况。下一章将讨论基于套接字的客户端服务器另一种进程间通信方法。\n\
  \n# 习题](#toc.xhtml_s120a)\n\n1. 信号量如何为多个进程访问共享对象？\n2. 定义用于实现信号量的函数调用。\n3. 编写一个程序创建一个消息队列并向其发送一些数据。\n\
  4. 编写一个程序在接收可用数据后销毁消息队列。\n5. 共享内存段是一个可以附加到多个进程的内存区域。编写一个来回传递数据的客户端和服务器。\n6. 编写一个程序显示客户端和服务器程序之间的竞态条件。\n\
  7. 如果 open 的参数是一个不存在的命令会发生什么？\n8. 编写一个程序通过管道在父子进程之间发送和接收数据。\n\n\n\n\n\n## 目标\n\n\
  阅读本章后，你将能够：\n\n* 理解服务器与客户端通信的套字（socket）概念和类型。\n* 理解涉及 socket 通的各种系统调用执行。\n* 理解有助于\
  \ socket 通的 I/O 模型。\n* 理解用于名称到地址计算的系统调用。\n\n# Socket（套字）\n\nsocket 是应用程序进程与传输层之间的接口。socket\
  \ 是应用程序进程向另一个本地或远程应用程序进程发送/接收消息的媒介。这种通信通常用于服务器进程和客户端进程之间。\n\n在 UNIX 中，socket 被称为\
  \ UNIX 域套字（UNIX domain sockets），因为 socket 只能用于单个主机上进程之间的通信。在 UNIX 中，socket 由文件描述符定义——这是一个与打开的文件关联的整数。相比之下，Internet\
  \ 域套字（Internet domain sockets）支持多种通信协议。socket 可以由内核支持，也可以作为将调用转换为原生网络 API 的库支持。下图展示了\
  \ socket 结构图：\n\n![](img/Figure-5.1.jpg)\n\n**图 5.1:** Socket\n\n## Socket 的类型\n\
  \n在创建 socket 时，程序需要指定地址域和要创建的 socket 类型，且只有当两个进程通信的 socket 处于同一域且具有相同的 socket 类型时，这两个进程才允许相互通信。\n\
  \n两种广泛使用的 socket 地址域是 UNIX 域和 Internet 域。在 UNIX 域中，共享公共文件系统的进程可以相互通信；而在 Internet\
  \ 域中，进程并不一定在同一个文件系统中；它们可以位于 Internet 上的任何主机并相互通信。这两种域类型都有自己的地址格式。在 UNIX 域中，地址在文件系统中有一个条目，并用字符串表示。在\
  \ Internet 域中，socket 地址由 Internet 上主机的 32 位 IP 地址表示。在 Internet 域中 socket 还需要一个端口号来表示\
  \ 16 位无符号整数。\n\n## Socket 数据结构\n\n关于 socket 的信息存储在名为 `sockaddr` 的数据结构中。`sockaddr`\
  \ 结构包含两个元素 `sa_family` 和 `sa_data`。`sa_family` 元素存储协议地址。\n\n```c\nstruct sockaddr\
  \ {\nunsigned short sa_family; //地址族 AF_xxx\nunsigned short sa_data[14]; //14 字节的协议地址\n\
  }\n```\n\n## Socket 通信的系统调用\n\nsocket 通信在客户端侧通过以下方式建立：\n\n* 使用 `socket()` 系统调用创建\
  \ socket。\n* 使用 `connect()` 系统调用将新创建的 socket 连接到服务器地址。\n* 使用 `read()` 和 `write()`\
  \ 系统调用发送接收数据。\n\nsocket 通信在服务器端通过以下方式建立：\n\n* 使用 `socket()` 系统调用创建 socket。\n* 使用\
  \ `bind()` 系统调用将新创建的 socket 绑定到地址。对于 Internet 上的服务器 socket，地址由主机上的端口号组成。\n* 使用 `listen()`\
  \ 系统调用监听连接。\n* 使用 `accept()` 系统调用接受客户端的连接请求。此调用通常会阻塞，直到客户端连接服务器。\n* 使用 `read()`\
  \ 和 `write()` 调用发送接收数据。\n\n[表 5.1] 显示了在 TCP 和 UDP 协议通过 socket 进行服务器与客户端通信的函数 set。\n\
  \n| 协议类型 | 客户端 | 服务端 |\n| :--- | :--- | :--- |\n| 面向连接 TCP | `socket()` | `socket()`\
  \ |\n| | `connect()` | `bind()` |\n| | | `listen()` |\n| | | `accept()` |\n| | `send()`\
  \ | `recv()` |\n| | `recv()` | `send()` |\n| 无连接 UDP | `socket()` | `socket()` |\n\
  | | | `bind()` |\n| | `sendto()` | `recvfrom()` |\n| | `recvfrom()` | `sendto()`\
  \ |\n\n**表 5.1:** 不同 socket 相关的系统调用\n\n## 创建 socket（服务端和客户端）\n\n`socket()` 系统调用创建\
  \ socket 并返回一个用于 socket 的唯一文件描述符。根据输入参数，socket 可以是流式（TCP）socket 或数据报文（UDP）socket。\n\
  \n**原型：**\n\n```c\nint socket(int domain, int type, int protocol);\n```\n\n域参数 `domain`\
  \ 设置为 `AF_INET` 或 `PF_INET`；`type` 参数指定 socket 的类型，并设置为 `SOCK_STREAM` 用于 TCP 流（如\
  \ telnet、HTTP 等）或设置为 `SOCK_DGRAM` 用于 UDP 数据报文；`protocol` 参数取值 0 可根据类型自动选择正确协议，或取\
  \ `IPPROTO_TCP` 选择 TCP 协议，或取 `IPPROTO_UDP` 选择 UDP 协议。\n\n## 将 socket 绑定到地址（服务端）\n\
  \n`bind()` 系统调用用于将 `sockfd` 绑定到本地机器上的端口。服务器需要调用此函数。如果发生错误，返回 -1。\n\n**原型：**\n\n\
  ```c\nint bind(int sockfd, struct sockaddr *addr, int addrlen);\n```\n\n第一个参数 `sockfd`\
  \ 是 `socket()` 系统调用的返回值，`addr` 是包含 IP 地址的数据结构中的 `sockaddr`，`addrlen` 是 `sockaddr`\
  \ 的大小。\n\n# 监听传入连接\n\n`listen()` 系统调用监听传入的连接。对于面向连接（TCP）socket，只需要服务器调用。该函数在发生错误时返回\
  \ -1。\n\n**原型：**\n\n```c\nint listen(int sockfd, int backlog);\n```\n\n`sockfd`\
  \ 是 `socket()` 函数的返回值，`backlog` 是传入队列允许的最大连接数。传入连接在被服务器接受之前保留在队列中。\n\n## 发起连接\n\n\
  客户端调用 `connect()` 系统调用发起到服务器的连接。用于面向连接（TCP）socket。系统调用在发生错误时返回 -1。\n\n**原型：**\n\n\
  ```c\nint connect(int sockfd, struct sockaddr *addr, int addrlen);\n```\n\n`sockfd`\
  \ 是 `socket()` 函数的返回值，`addr` 是包含服务器 IP 地址和端口号的 `sockaddr`，`addrlen` 是 `sockaddr`\
  \ 的大小。\n\n# 从传入队列接受连接\n\n服务器使用 `accept()` 系统调用接受与 socket `sockfd` 关联的传入队列中的连接。用于面向连接（TCP）socket。系统调用返回一个新的\
  \ socket 文件描述符，用于在该连接上发送接收信息。系统调用发生错误时返回 -1。\n\n**原型：**\n\n```c\nint accept(int\
  \ sockfd, void *addr, int *addrlen);\n```\n\n`sockfd` 是监听连接的 socket 描述符。`addr` 是指向本地\
  \ `sockaddr` 的指针，包含接入客户端的 IP 地址和端口号。该数据结构与包含服务器 IP 地址和端口号的不同；`addrlen` 是数据结构中前一个\
  \ `sockaddr` 的大小。\n\n## 通过 socket 发送数据（面向连接）\n\n\n\n\n一旦建立连接，客户端和服务器将使用 `send()`\
  \ 系统调用从客户端发送信息到服务器，或从服务器发送到客户端。如果客户端在使用 `send()`，则服务器应该使用 `recv()`，反之亦然。该函数要么返回发送的字节数，要么在出错时返回\
  \ `-1`。\n\n**原型：**\n\n```\nint send(int sockfd, const void *msg, int len, int flags);\n\
  ```\n\n`sockfd` 是用于发送数据的套字文件描述符。在客户端侧，`sockfd` 是调用 `connect()` 时使用的同一个套字。在服务器侧，`sockfd`\
  \ 是 `accept()` 返回的套字，`msg` 是指向要发送数据的指针，`len` 是以字节字节的数据长度，`flags` 设置为 `0`。\n\n# 通过套字接收消息（面向连接型）\n\
  \n`recv()` 系统调用用于接收通过套字发送的数据。该函数返回实际接收的字节数；如果发生错误，返回 `-1`；如果对方已关闭连接，则返回 `0`。\n\n\
  **原型**\n\n```\nint recv(int sockfd, void *buf, int len, unsigned int flags);\n```\n\
  \n`sockfd` 是用于读取数据的套字描述符。在客户端侧，`sockfd` 是调用 `connect()` 时使用的同一个套字。在服务器侧，`sockfd`\
  \ 是 `accept()` 返回的套字，`buf` 是指向读取后存放数据的缓冲区指针，`len` 是缓冲区的最大字节长度，`flags` 设置为 `0`。\n\
  \n# 通过套字接收消息（无连接型）\n\n此函数与 `send()` 类似；但它用于无连接的数据报文，而不是面向连接的通信。\n\n**原型**\n\n```\n\
  int sendto(int sockfd, const void *msg, int len, unsigned int flags, const struct\
  \ sockaddr *toaddr, int addrlen);\n```\n\n`sockfd` 是用于发送数据的套字描述符，`msg` 是指向要发送数据的指针，`len`\
  \ 是以字节字节的数据长度，`flags` 设置为 `0`，`toaddr` 是包含数据目标 IP 地址和端口号的 `sockaddr`，`addrlen` 是数据结构中上述\
  \ `sockaddr` 的大小。\n\n# 关闭套字\n\n`close()` 系统调用用于关闭套字。\n\n**原型**\n\n```\nvoid close(sockfd);\n\
  ```\n\n让我们来看一个客户端和服务器程序的示例。\n\n## 客户端程序\n\n以下是客户端侧的代码：\n\n```c\n#include <stdio.h>\n\
  #include <sys/types.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n#include\
  \ <netdb.h>\n#include <string.h>\n\n#define PORT 5000\n#define HOST \"u.ac.in\"\n\
  #define DIRSIZE 8000\n\nmain(int argc, char **argv) {\n    char hostname[100];\n\
  \    char dir[DIRSIZE];\n    int sd;\n    struct sockaddr_in sin;\n    struct sockaddr_in\
  \ pin;\n    struct hostent *hp;\n\n    strcpy(hostname, HOST);\n    if (argc > 2)\
  \ {\n        strcpy(hostname, argv[2]);\n    }\n    if ((hp = gethostbyname(hostname))\
  \ == 0) {\n        perror(\"gethostbyname\");\n        exit(1);\n    }\n\n    memset(&pin,\
  \ 0, sizeof(pin));\n    pin.sin_family = AF_INET;\n    pin.sin_addr.s_addr = ((struct\
  \ in_addr *)hp->h_addr)->s_addr;\n    pin.sin_port = htons(PORT);\n\n    if ((sd\
  \ = socket(AF_INET, SOCK_STREAM, 0)) == -1) {\n        perror(\"socket\");\n   \
  \     exit(1);\n    }\n\n    if (connect(sd, (struct sockaddr *)&pin, sizeof(pin))\
  \ == -1) {\n        perror(\"connect\");\n        exit(1);\n    }\n\n    if (send(sd,\
  \ argv[1], strlen(argv[1]), 0) == -1) {\n        perror(\"send\");\n        exit(1);\n\
  \    }\n\n    if (recv(sd, dir, DIRSIZE, 0) == -1) {\n        perror(\"recv\");\n\
  \        exit(1);\n    }\n\n    printf(\"%s\\n\", dir);\n    close(sd);\n}\n```\n\
  \n## 服务器程序\n\n以下是服务器侧的代码：\n\n```c\n#include <stdio.h>\n#include <sys/types.h>\n\
  #include <sys/socket.h>\n#include <netinet/in.h>\n#include <netdb.h>\n#include <string.h>\n\
  \n#define PORT 5000\n#define DIRSIZE 8000\n\nmain() {\n    char dir[DIRSIZE];\n\
  \    int sd, sd_current, cc, fromlen, tolen;\n    int addrlen;\n    struct sockaddr_in\
  \ sin;\n    struct sockaddr_in pin;\n\n    if ((sd = socket(AF_INET, SOCK_STREAM,\
  \ 0)) == -1) {\n        perror(\"socket\");\n        exit(1);\n    }\n\n    memset(&sin,\
  \ 0, sizeof(sin));\n    sin.sin_family = AF_INET;\n    sin.sin_addr.s_addr = INADDR_ANY;\n\
  \    sin.sin_port = htons(PORT);\n\n    if (bind(sd, (struct sockaddr *)&sin, sizeof(sin))\
  \ == -1) {\n        perror(\"bind\");\n        exit(1);\n    }\n\n    if (listen(sd,\
  \ 5) == -1) {\n        perror(\"listen\");\n        exit(1);\n    }\n\n    addrlen\
  \ = sizeof(pin);\n    if ((sd_current = accept(sd, (struct sockaddr *)&pin, &addrlen))\
  \ == -1) {\n        perror(\"accept\");\n        exit(1);\n    }\n\n    /*\n   \
  \ printf(\"Hi there, from %s\\n\", inet_ntoa(pin.sin_addr));\n    printf(\"Coming\
  \ from port %d\\n\", ntohs(pin.sin_port));\n    */\n\n    if (recv(sd_current, dir,\
  \ sizeof(dir), 0) == -1) {\n        perror(\"recv\");\n        exit(1);\n    }\n\
  \n    read_dir(dir);\n    /* strcat(dir,\" DUDE\"); */\n\n    if (send(sd_current,\
  \ dir, strlen(dir), 0) == -1) {\n        perror(\"send\");\n        exit(1);\n \
  \   }\n\n    close(sd_current);\n    close(sd);\n}\n```\n\n\n\n如果这些系统调用在 `select()`\
  \ 或 `poll()` 中阻塞，而不是在实际 I/O 本身上阻塞，进程就会被阻塞。返回时，套接字是可读；也就是说，任何描述符上的数据已准备就绪，进程调用 `recvfrom()`\
  \ 获取实际数据。\n\n这种模式的优点是进程可以等待多个文件描述符准备就绪。如 *图 5.4* 所示，应用程序执行 `select()` 系统调用；如果服务器端数据未就绪，应用程序将阻塞该系统调用，但应用程序本身将处于运行模式。一旦数据可用，应用程序执行\
  \ `recefrom()` 函数从内核接收数据并立即返回。\n\n![](img/Figure-5.4.jpg)\n\n**图 5.4：** 多路复用 I/O\
  \ 模型的框图\n\n这种模型的缺点是它需要两个系统调用而不是一个。\n\n## 信号驱动的 I/O 模型\n\n在该模型中，内核通过发送 SIGIO 信号通知进程数据可用。如\
  \ *图 5.5* 所示，应用程序使用 `sigaction()` 函数启用信号处理器。启用后，应用程序继续执行。一旦内核端数据可用，内核向应用程序发送一个 SIGIO\
  \ 信号。SIGIO 信号由应用程序端的信号处理器处理。现在，应用程序调用 `receivfrom()` 函数从内核接收数据，当数据完全写完成后，它开始执行。\n\
  \n![](img/Figure-5.5.jpg)\n\n**图 5.5：** 信号驱动 I/O 模型的框图\n\n最初，套接字被设置为信号驱动 I/O。执行\
  \ `sigaction()` 系统调用以安装一个处理 I/O 的信号处理器。一旦安装了处理器，系统调用就会返回不再阻塞进程。一旦数据报准备就绪，内核向进程发送\
  \ SIGIO 信号。进程随后可以通过调用 `recvfrom()` 系统调用从信号处理器读取数据报，或者进程的主函数也可以读取数据报。\n\n在此模式下，进程在等待数据报到达时不会被阻塞；而是继续执行。一旦数据报准备到达，进程就会收到信号处理器的通知。\n\
  \n## 异步 I/O 模型\n\n在这种 I/O 模式下，调用 `io_read()` 函数向内核定义描述符、缓冲区指针、缓冲区大小（与 `read()` 函数相同）、文件偏移量以及数据到达的通知方法。当整个操作完成后，系统调用立即返回。这不需要在等待\
  \ I/O 完成时阻塞进程。系统模型如图 *图 5.6* 所示。\n\n![](img/Figure-5.6.jpg)\n\n**图 5.6：** 异步 I/O\
  \ 模型的框图\n\n这种模型与信号驱动 I/O 非常不同，因为只有在数据复制到应用程序缓冲区之后才会生成信号。\n\n# 名称和地址转换\n\nDNS 用于在主机名和\
  \ IP 地址之间进行映射。主机可以是简单的名称（solaris），也可以是完全限定域名（FQDN）（如[solaris.kohala.com](http://solaris.kohala.com)）。\n\
  \n## 资源记录\n\nDNS 条目被称为资源记录（RRs）。它定义了关于域名的所有信息，包括资源类型、协议族、服务器可以缓存 RR 的秒数、数据字段长度以及资源数据。下表描述了不同类型的资源记录。\n\
  \n| **资源记录类型** | 映射 |\n| :--- | :--- |\n| A | 将主机名映射到 32 位 IPv4 地址 |\n| AAAA | 将主机名映射到\
  \ 128 位 IPv6 地址 |\n| PTR | 将 IP 地址映射为主机名。对于 IPv4，反转 4 个字节，并将每个字节转换为十进制 ASCII 值（0-255）。然后追加\
  \ `.addr.arpa`。对于 IPv6 地址，反转 128 位地址的 32 个 4 位半字节（nibbles）。每个半字节转换为其相应的十六进制 ASCII\
  \ 值（0-9-a-f），并追加 `ip6.int`。 |\n| MX | 指定主机的邮件交换记录。 |\n| CNAME | 规范名称，例如为 FTP、WWW\
  \ 等常用服务分配 CNAME。 |\n\n**表 5.2：** 资源类型及其映射\n\n# gethostbyname() 函数\n\n`gethostbyname()`\
  \ 函数获取当前主机机名，并返回对应的 IP 地址作为参数传递给 `connect()` 函数。它对 A 和 AAAA 记录进行查询并返回 IPv4 和 IPv6\
  \ 地址。\n\n**原型**\n\n```c\n#include <netdb.h> /* Berkeley */\nstruct hostent *gethostbyname\
  \ (const char *hostname);\n```\n\n`gethostbyname()` 的参数是一个类似于 `[www.yahoo.com](http://www.yahoo.com)`\
  \ 的字符串，它返回一个 `struct hostent` 结构体，其中包含大量信息，包括 IP 地址。其他信息是官方主机名、别名列表、地址。\n\n# hostent\
  \ 结构\n\n`hostent` 结构包含了主机信息。`hostent` 结构元素是：名称、别名、地址类型、地址。\n\n```c\n/* <netdb.h>\
  \ */\nstruct hostent {\n  char *h_name;     /* 官方名称 */\n  char **h_aliases; /* 别名列表\
  \ */\n  int h_addrtype;   /* 地址类型 */\n  int h_length;     /* 长度 */\n  struct in_addr\
  \ **h_addr; /* 地址列表 */\n};\n```\n\n`gethostbyname()` 执行查询 A 和 AAAA 记录并返回 IPv4 和\
  \ IPv6 地址。\n\n# gethostbyaddress() 函数\n\n`gethostbyname()` 函数获取当前主机名，并返回对应的 IP 地址以作为\
  \ `connect()` 函数的参数。\n\n**原型**\n\n```c\n#include <netdb.h>\nstruct hostent *gethostbyaddr(const\
  \ char *addr, int len, int type);\n```\n\n`gethostbyaddr()` 返回一个 `hostent` 结构，包含主机名和其他等信息。对于\
  \ TCP/IP，第一个参数 `addr` 应该指向 `struct in_addr` 或网络字节序的无符号整数，`len` 通常为 `sizeof(struct\
  \ in_addr)`，`type` 应该是 `AF_INET`。\n\n主机信息可以通过解析器或在系统的 `/etc/hosts` 文件找到。\n\n```c\n\
  main()\n{\n  const char *ipstr = \"66.94.230.32\";\n  struct in_addr addr;\n  struct\
  \ hostent *hp;\n  if (!inet_aton(\"66.94.230.32\", &addr)) {\n    errx(1, \"无法解析\
  \ IP 地址 %s\", ipstr);\n  }\n  if ((hp = gethostbyaddr(&addr, sizeof addr, AF_INET))\
  \ == NULL) {\n    errx(1, \"与 %s 无关联名称\", ipstr);\n  }\n  printf(\"主机名: %s\\n\"\
  , hp->h_name);\n  exit(0);\n}\n```\n\n输出是请求 URL 的官方名称和 IP 地址。\n\n# [Resolver]\n\n\
  `gethostbyname()` 和 `gethostbyaddress()` 函数使用 `resolver()` 库函数获取主机信息。`resolver()`\
  \ 函数读取 `/etc/resolv.conf` 以获取 DNS 服务器的 IP 地址。\n\n# getservbyname() 和 getservbyport()\
  \ 函数\n\n`getservent()` 函数读取服务数据库以识别服务器。\n\n`getservbyname()` 搜索服务数据库，以识别与指定名称和服务协议匹配的服务，并在必要时打开连接。\n\
  \n\n\n\n`getservbyport()` 搜索服务数据库以识别具有给定端口和指定协议的服务，并在必要时打开连接。\n\n这三个函数都会按顺序搜索数据库，直到找到匹配项或发生文件结束符（EOF）。\n\
  \n### 原型\n\n```c\n#include <netdb.h>\n\nstruct servent *getservbyname (const char\
  \ *servname, const char *protname);\n\nstruct servent *getservbyport (int port,\
  \ const char *protname);\n```\n\n`servent` 结构如下：\n\n```c\nstruct servent {\n   \
  \ char    *s_name;\n    char    **s_aliases;\n    int     s_port;\n    char    *s_proto;\n\
  };\n```\n\n该结构的成员为：\n\n*   `s_name`: 服务的正式名称。\n*   `s_aliases`: 服务的备用名称列表，以零终止。\n\
  *   `s_port`: 服务所在的端口号。 端口号以网络字节序返回。\n*   `s_proto`: 访问服务时使用的协议名称。\n\n这些函数使用静态数据存储；如果以后需要使用这些数据。\n\
  \n## 结论\n\n套接字是客户端和服务器之间的接口，可以位于单个系统、网络或跨不同的网络，用于发送和接收信息。客户端程序通过面向连接或无连接的接口向服务器发送数据请求。在本章中，讨论了所有与套接字编程相关的概念，包括不同类型的套接字、建立连接的函数以及客户端与服务器之间的消息收发。在本章中，我们讨论了\
  \ UNIX 环境下的套接字编程。 UNIX 平台还有许多其他环境，用户可以自定义这些环境。我们将在下一章中讨论这些环境。\n\n### 复习习题\n\n1.\
  \ 从命令行读取 (1) 可以从该 URL 提取远程 WWW 服务器名称和要检索的文件名，以及 (2) 服务器端口号。创建一个连接到指定端口（例如 HTTP 端口\
  \ 80）的服务器机器的套接字 [getservbyname, gethostbyname, socket, connect]。\n2. 运行在一台主机上的进程为了识别运行在另一台主机上的进程，使用哪些信息？\n\
  3. 服务器程序是否会向客户端程序请求并接收服务？\n4. 使用 `socket()` 创建套接字，使用 `gethostbyname()` 将主机名转换为 IP\
  \ 地址，然后发出 `connect()` 调用，传递包含要连接的 IP 地址和端口的相关结构体。\n\n# 第 6 章：内存管理\n\n内存被认为是计算机中重要的资源，内存管理是管理计算机内存的过程，由主内存和辅内存组成。内存管理的目的是在运行或存在于系统的进程之间高效地分配不同类型的可用内存。它跟踪哪些内存部分正在使用，哪些部分未在使用，以便在进程需要时为其分配内存。一旦进程终止，分配给运行进程的内存将被释放，以便分配给另一个请求内存资源的进程。UNIX\
  \ 操作系统实现了交换和请求分页技术来管理系统内存。本章将讨论用于正确管理内存资源的所有概念和技术。\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n\
  \n*   内存管理\n    *   操作系统内存的使用\n    *   UNIX 中运行进程的内存内容\n    *   交换\n    *   内存管理函数的实现\n\
  *   内存管理函数\n*   跳转另一个函数\n\n## 目标\n\n阅读本章后，读者将能够 UNIX 如何用 C 语言编写，以及 UNIX 操作系统如何广泛用于\
  \ C 语言编程。在本节中，我们将学习一些 UNIX 和 C 接口概念，例如：\n\n*   理解 UNIX 操作系统中不同类型内存资源的使用。\n*   理解不同的内存管理技术，如交换和请求分页。\n\
  *   理解系统调用和内存管理函数。\n*   理解函数调用期间的上下文切换。\n\n系统调用和库函数：\n\n*   命令行参数和环境变量。\n*   在 UNIX\
  \ 中使用 `fork()`、`exec()` 在 C 语言中实现多任务。\n*   使用 `wait()` 进行进程同步。\n*   使用系统调用访问用户信息。\n\
  *   数据共享和进程间通信机制。\n*   套接字编程基础。\n\n### 内存管理\n\nUNIX 内核的内存管理组件管理处理器内存的内容。类 UNIX 操作系统使用复杂的内存管理算法来高效利用内存资源。在\
  \ UNIX 中，有三种不同的内存资源，包括主内存和辅内存：\n\n*   **主内存 (Main):** CPU 主板上的可用物理内存称为主内存。这不包括处理器缓存、显存或其他外围内存。\n\
  *   **文件系统 (File system):** 本地磁盘或网络可用且可通过路径访问的物理内存。这不包括原始设备、磁带驱动器、交换空间或其他无法通过普通路径访问的存储器。\n\
  *   **交换设备 (Swap device):** 交换设备是磁盘上的可用物理内存，用于存储不在 RAM 或文件系统中的数据。当交换设备位于单独的磁盘或分区时，可以高效使用。\n\
  \n### 操作系统内存的使用\n\n为了高效管理内存资源，内存保留给操作系统自身的功能和正在执行的进程。内存的某些部分始终保留，不能用于用户进程。\n\n*\
  \   **内核内存 (Kernel memory):** 操作系统系统的私有内存，主内存中始终可用。\n*   **缓存 (Cache memory):**\
  \ 主内存的一部分，用于存放文件系统元素和 I/O 操作。缓存不包括 CPU 缓存磁盘。\n*   **虚拟内存 (Virtual memory):** 虚拟内存包括机器上运行的所有进程的可寻内存。进程的总地址空间可以分布在所有类型的内存中。\n\
  \n\n\n\n当一个运行中的进程需要物理内存中的虚拟页，而物理内存中没有可用空间时，就会发生交换。在这种情况下，操作系统会将主内存中的某些页面调出，并从交换设备引入所需的页面。关于哪些页面被换入或换出的决策由调度器（`swapper`）做出。调度器至少每\
  \ 4 秒唤醒一次，以检查哪些进程可以被换出。在主内存中空置很久的最有可能被换出。如果主内存中没有这样的进程，则会选择一个大进程进行换出。被换出长时间且体积较小的进程最有可能被换入。为了防止抖动（thrashing），在主内存中停留一段时间的进程不会被选择换出。被选择换出的进程页面根据其类型移动到不同的位置。数据段的页面被移动到交换空间，栈段的页面被移动到交换空间，映射文件的页面如果已修改且共享，则移动回原始文件。如果映射文件的页面已修改且是私有的，则移动到交换空间。如果映射文件的页面未更改，则将其丢弃。\n\
  \n# 需存分页\n\n需存分页是一种分页策略，在页请求之前，不会将其读取到内存中。需存分页仅将所需的内存页而非整个进程在次级设备之间传输。\n\n内核通过实现页表来实现需存分页。页表将逻辑页地址转换为物理页地址。页表使用二进制标记来检查页的有效性。如果页位于主内存中，则为有效；如果当前位于辅助内存中，则为无效。当进程需要某个页而该页不存在时，会发生页异常中断内核。内核检查辅助内存中的页引用是否有效，并调度磁盘读取操作以换入请求的页。一旦页进入主内存，就会重启被中断的指令。\n\
  \n**注意：Berkeley 通过 BSD（Berkeley System）向 UNIX 引入了需存分页。**\n\n需存分页策略的优点是允许将进程虚拟地址映射到机器物理内存时具有更大的灵活性，通常允许进程的大小大于物理内存容量，并允许更多进程同时放入主内存中。\n\
  \n需存分页策略的缺点是进程在第一次需要某个页时可能会面临额外的延迟。更多的页异常可能会导致抖动，且进程可能面临定时攻击的安全风险。\n\n## mkdir 系统调用\n\
  \n`mkdir()` 函数创建一个由 `path` 指向的路径命名的新目录。\n\n**原型：**\n\n```c\nint mkdir(const char\
  \ *path, mode_t mode);\n```\n\n新目录的模式由 `mode` 初始化。`mode` 参数的保护部分会由进程的文件创建掩码修改。\n\
  \n目录的所有者 ID 设置为进程的有效用户 ID。目录的组 ID 设置为进程的有效组 ID；或者如果父目录设置了 `S_ISGID` 位，则目录的组 ID 继承自父目录。新目录的\
  \ `S_ISGID` 位也从父目录继承。\n\n如果 path 指向一个符号链接，`mkdir()` 将失败并将 `errno` 设置为 `EEXIST`。\n\
  \n新创建的目录是空的，除了自身（`.`）和其父目录（`..`）的条目外。\n\n在成功完成后，返回 `0`。否则，返回 `-1`，不创建目录，并设置 `errno`\
  \ 以指示错误。\n\n## rmdir 系统调用\n\n`rmdir()` 系统调用删除名称由 `path` 指定目录文件。该目录不能包含除 “.” 和 “..”\
  \ 之外的任何条目。\n\n**原型：**\n\n```c\nint rmdir(const char *path);\n```\n\n`rmdir()` 函数成功时返回值\
  \ `0`；否则返回值 `-1`，并设置全局变量 `errno` 以指示错误。\n\n在删除目录条目之前，系统会检查链接计数项（`ls -l` 命令），以识别要删除的目录是否被其他进程打开。只有当在该调用时目录的链接数为\
  \ 0 且没有其他进程打开该目录时，目录才会被删除，然后释放该目录占据的空间。\n\n## 内存管理函数\n\n变量的内存可以动态分配和释放。\n\n## malloc()\
  \ 函数\n\n`malloc` 需要一个参数 - 你想要动态分配的字节数。\n\n如果内存分配成功，`malloc` 将返回一个空指针。你可以将其赋值给一个指针变量，该变量将存储分配内存的地址。\n\
  \n如果内存分配失败（例如，内存溢出），`malloc` 将返回一个 NULL 指针。\n\n## free() 函数\n\n将指针传递给 `free` 将释放已分配的内存。在完成使用后释放内存是一个良好的习惯。\n\
  \n```c\nvoid free(void *ptr);\n```\n\n其中 `ptr` 是指针。\n\n考虑以下示例：\n\n```c\n#include\
  \ <stdio.h>\n#include <stdlib.h>\n\nint main() {\n    int number;\n    int *ptr;\n\
  \    ptr = (int*)malloc(sizeof(int));\n    if (ptr != NULL) {\n        *ptr = 10;\n\
  \        printf(\"Value: %d\\n\", *ptr);\n        free(ptr);\n    } else {\n   \
  \     printf(\"Memory failed\\n\");\n    }\n    return 0;\n}\n```\n\n## calloc()\
  \ 函数\n\n`calloc` 与 `malloc` 类似，主要区别在于分配内存中的值默认会被零。\n\n`ptr = (cast_type *) calloc\
  \ (n, size);` `calloc` 需要两个参数。第一个是需要分配的变量数量 n。第二个是每个变量的大小。\n\n考虑以下：\n\n```c\n#include\
  \ <stdio.h>\n#include <stdlib.h>\n\nint main() {\n    float *ptr1;\n    int i;\n\
  \    ptr1 = calloc(3, sizeof(float));\n    if (ptr1 != NULL) {\n        for(i=0\
  \ ; i<3 ; i++) {\n            printf(\"ptr1[%d] holds %0.5f\\n\", i, ptr1[i]);\n\
  \        }\n        free(ptr1);\n    } else {\n        printf(\"memory not allocated\\\
  n\");\n    }\n    return 0;\n}\n```\n\n## realloc() 函数\n\n`realloc()` 用于更改已分配内存块的大小而不丢失该位置的数据。\n\
  \n`ptr = realloc (ptr,newsize);` `realloc` 取两个参数。第一个是引用内存的指针，即要更改大小的 `ptr`。第二个是需要重新分配的总字节数，即\
  \ `newsize`。\n\n将零作为第二个参数等同于调用 `free`，`realloc` 成功时返回空指针，否则返回 NULL 指针。\n\n```c\n\
  #include <stdio.h>\n#include <stdlib.h>\n\nint main() {\n    int *ptr;\n    int\
  \ i;\n    int number;\n    printf(\"How many ints would you like store? \");\n \
  \   scanf(\"%d\", &number);\n    ptr = malloc(number*sizeof(int));\n    if (ptr\
  \ != NULL) {\n        for (int I =0; I<number ;I++) {\n            *(ptr + I) =\
  \ i;\n        }\n        ptr = realloc(ptr, (number 2 )*sizeof(int));\n        if(ptr!=NULL)\
  \ {\n            printf(\"Now allocating more memory… \\n\");\n        }\n     \
  \   free(ptr);\n    }\n    return 0;\n}\n```\n\n\n\n\n```c\nptr[number] = 32; /*\
  \ now it’s legal! */\n\nptr[number ++1] = 64;\n\nfor(i=0 ; i<(number +2 ); i++)\
  \ {\n    printf(\"ptr[%d] holds %d\\n\", i, ptr[i]);\n}\n\nrealloc(ptr,0); /* same\
  \ as free(ptr); - just fancier! */\n\nreturn 0;\n\n}\n\nelse {\n    printf(\"Not\
  \ enough memory - realloc failed.\\n\");\n    return 1;\n}\n}\nelse {\n    printf(\"\
  Not enough memory - calloc failed.\\n\");\n    return 1;\n}\n```\n\n# alloca() 函数\
  \ (#toc.xhtml_s163a)\n\n`alloca()` 函数在调用函数的栈帧中分配空间。当被调用的 `alloca()` 函数返回到调用者时，这部分临时空间会自动释放。`alloca()`\
  \ 函数返回一个指向分配空间起始位置指针。如果分配导致栈溢出，程序行为是未定义的。\n\n`alloca()` 函数依赖于机器和编译器。在许多系统中，它的实现存在\
  \ Bug。\n\n**原型：**\n\n```c\n#include <alloca.h >\nvoid *alloca(size_t size);\n```\n\
  \n# 将分支跳转到另一个函数 (#toc.xhtml_s164a)\n\nC 语言程序允许跳转到另一个函数中设置的标签。为了将控制分支到另一个函数，使用了 `setjump`\
  \ 和 `longjump` 函数。通常情况下，应该避免此类跳转，因为这不认为是一种良好的编程实践。\n\n**原型：**\n\n```c\nint setjmp(jmp_buf\
  \ env); void longjmp(jmp_buf env, int val);\n```\n\n考虑以下示例：\n\n```c\n#include <setjmp.h>\n\
  #include <stdio.h>\n\njmp_buf ebuf;\nvoid f(void);\nint main(void)\n{\n    int i;\n\
  \    printf(\"1 \");\n    i = setjmp(ebuf);\n    if(i == 0) {\n        f();\n  \
  \      printf(\"This will not be printed.\");\n    }\n    printf(\"%d\", i);\n \
  \   return 0;\n}\nvoid f(void)\n{\n    printf(\"2 \");\n    longjmp( ebuf, 3);\n\
  }\n```\n\n# 结论 (#toc.xhtml_s165a)\n\n内存被认为是计算机系统的重要资源。如果内存管理得不当，可能会降低操作系统的整体性能。内存管理函数用于跟踪内存的哪些部分被使用、使用了多少，以及哪些部分内存空闲可以分配给需要内存空间的进程。内存管理函数控制系统中可用的主内存和辅助内存。UNIX\
  \ 操作系统实现了交换和请求分页技术，以高效利用系统内存。内存可以根据需要动态地分配和释放。\n\n# 多选题 (#toc.xhtml_s166a)\n\n1.\
  \ **哪种技术允许执行可能不完全在于内存中的进程？**\n    1. 虚拟内存\n    2. 内存管理\n    3. 物理内存\n    4. 以上都不是\n\
  \n2. **以下哪些项都是 UNIX 系统调用？**\n    1. `time()`, `chdir()`, `createdir()`, `execve()`\n\
  \    2. `chmod()`, `main()`, `waitpid()`, `exit()`\n    3. (c ) `open()`, `fork()`,\
  \ `delete()`, `read()`\n    4. `lseek()`, `stat()`, `link()`, `kill()`\n\n3. **当发生页异常时将页面调入内存的机制。**\n\
  \    1. 请求分页\n    2. 分段\n    3. 碎片\n    4. 页面替换\n\n4. **虚拟内存管理进程的逻辑地址空间。**\n   \
  \ 1. 正\n    2. 错\n\n5. **访问动态内存分配函数需要包含哪个头文件？**\n    1. `stdlib.h`\n    2. `stdio.h`\n\
  \    3. `memory.h`\n    4. `alloc.h`\n\n6. **以下哪个函数用于修改动态分配内存的大小？**\n    1. `realloc()`\n\
  \    2. `malloc()`\n    3. `free()`\n    4. `alloca()`\n\n7. **指出以下关于虚拟内存的陈述哪些正确的。**\n\
  \    1. 它允许多个用户使用系统\n    2. 它增强了多道编程的范围\n    3. 它扩展了地址空间\n    4. 它减少了外部碎片以及内部碎片。\n\
  \n# 答案 (#toc.xhtml_s167a)\n\n1. **(a)**\n2. **(c )**\n3. **(b)**\n4. **(b)**\n5.\
  \ **(a)**\n6. **(a)**\n7. **(b)**\n\n# 问题 (#toc.xhtml_s168a)\n\n1. 内存管理的主要目标是什么？\n\
  2. 交换和分页之间的区别是什么？\n3. 哪些进程不受交换程序的打扰？给出原因。\n4. 为什么 UNIX 不允许内核内存分页出？\n\n# 第 7 章 (#toc.xhtml_c07)\n\
  \n# UNIX Shell 和自定义环境 (#toc.xhtml_c07)\n\n正如我们所知，UNIX 操作系统的最可见部分是 shell，这使得它是用户需要了解的最重要的组件。要执行任何任务，都需要向\
  \ shell 执行命令。如果需要执行工具或程序，shell 请求内核执行它。shell 有两个部分；第一个是解释器，第二个部分是 shell 的编程能力，允许我们编写脚本。shell\
  \ 的另一个重要功能是自定义环境。我们将密切查看作为解释器和自定义器的 shell。\n\n# 结构 (#toc.xhtml_s169a)\n\n在本章中涵盖以下主题：\n\
  \n* shell 的功能和执行模式\n* shell 执行周期\n* 提供的标准 shell\n* shell 元字符的使用\n* 使用转义和引号避免解释\n\
  * 使用重定向使用输入输出\n* 使用 noclobber 选项 `/dev/null`\n* 命令分组\n* 不同命令的管道\n* 使用 shell 变量自定义环境\n\
  * 理解配置文件\n\n# 目标 (#toc.xhtml_s170a)\n\n学习本章后，你将能够：\n\n* 理解 shell 的基础\n* 理解不同的功能模式\n\
  * 理解执行 shell 的概念\n* 理解命令分组和管道\n* 理解配置文件\n\n# Shell 简介 (#toc.xhtml_s171a)\n\nshell\
  \ 是一个作为 UNIX 界面的程序。shell 通常被称为命令解释器，因为它允许系统理解用户的命令。系统提供了多种 shell，每个都有不同的特性，但它们都会影响命令的解释。shell\
  \ 提供了创建环境的工具。\n\nshell 是 UNIX 中的工具。它在用户登录系统时加载到内存中。登录过程中执行的 shell 列在 `/etc/passwd`\
  \ 文件的相应条目中。如果 `/etc/passwd` 文件中没有指定 shell，则默认执行标准 shell `/usr/bin/sh`。\n\n# UNIX\
  \ Shell 执行模式 (#toc.xhtml_s172a)\n\nUNIX shell 基本上以三种模式执行：\n\n1. 交互模式\n2. shell 编程模式\n\
  3. UNIX 会话自定义模式\n\n# 交互模式 (#toc.xhtml_s173a)\n\n在交互模式下，shell 等待用户输入命令，由 shell 进行解释。命令在消除所有错误后执行。命令可能包含特殊符号来缩写文件名并重定向输入输出。\n\
  \n# 编程模式 (#toc.xhtml_s174a)\n\n在编程模式下，系统以 shell 脚本的形式一起执行一组 UNIX 命令。许多内置命令以 shell\
  \ 脚本的形式组合在一起。与交互模式相比，脚本可以保存并分层执行。\n\n# UNIX 会话自定义模式 (#toc.xhtml_s175a)\n\n\n\n\n\
  \nUNIX shell 通过预定义的 shell 变量控制会话行为。Shell 变量用于设置用户主目录、提示符符号、邮件等。某些 shell 变量由系统自动设置，而用户可以在启动文件中设置其他\
  \ 变量。\n\n## Shell 解释周期\n\nShell 命令处理通常分五个步骤完成：\n\n1. Shell 一启动，就会立即在终端上显示提示符符号。\n\
  2. Shell 简单地等待用户输入要执行的命令。\n3. Shell 分析用户输入的命令。\n4. Shell 继续执行用户的请求。如果需要执行特定的程序，shell\
  \ 将搜索磁盘以找到指定的程序。\n5. 一旦找到程序，shell 请求内核（Kernel）启动程序执行，并进入睡眠状态直到程序执行完成。如果程序从标准输入读取输入，它将在执行期间等待用户在命令行提示符处输入输入。\n\
  \n程序执行完成后，控制权再次返回 shell 以执行下一个程序/命令。\n\n## UNIX shell 的功能\n\n*图 7.1* 显示了 shell 执行的基本功能。功能的更多细节将在随后的章节中给出。\n\
  \n![](img/Figure-7.1.jpg)\n\n**图 7.1:** shell 的用途\n\n## 程序执行\n\nShell 启动从用户终端请求的所有程序的执行。要执行的程序以命令行的形式在终端上给出，如下：\n\
  \n```\nProgram-name list-of-arguments\n```\n\nShell 扫描命令行并识别要执行的程序名称以及传递给执行程序的程序的参数值。\n\
  \n在第一个空白符之前，shell 将所有内容视为程序名；每个参数也通过空格分隔。如果从程序名和参数之间给出多个空格，shell 将忽略额外的空格。\n\n**示例：**\n\
  \n`prog.sh  first_arg second_arg`\n\n* `prog.sh`: 程序名\n* `first_arg second_arg`:\
  \ 参数列表\n\n## 输入/输出重定向\n\nShell 处理命令行上的输入/输出重定向。在程序执行期间，shell 会扫描输入命令中的特殊重定向运算符 `<`,\
  \ `>` 和 `>>`。\n\nShell 具有从文件或向文件重定向输入和输出的能力。\n\n在程序执行期间，shell 使用特殊重定向运算符 `<`, `>`,\
  \ 和 `>>` 处理命令的输入/输出重定向。`<` 运算符从右侧给的文件获取命令输入。`>` 将命令的输出重定向到文件。`>>` 将命令的输出追加到现有文件的末尾。\n\
  \n`ls -l > file1`\n\n在前面的示例中，`ls -l` 命令的输出重定向到 `file1`。如果 `file1` 已存在，则其内容会被当前输出替换。正在执行的命令并不关心输出被重定向到了哪里。\n\
  \n让我们考虑两个完全相同的命令：\n\n`wc -l file1`\n\n`output : 10`\n\n`wc -l < file1`\n\n`output\
  \ : 10 file1`\n\n在第一的情况下，shell 确定执行命令 `wc` 来统计文件 `file1` 的行数；它打开文件 `file1` 并计算行数。\n\
  \n在第二的情况下，`wc` 的执行方式略有不同。shell 在扫描命令行时确定输入重定向运算符 `<`，`<` 符号后的单词是用于重定向输入的文件名。shell\
  \ 执行 `wc` 命令，将其标准输入从文件 `file1` 重定向过来。\n\n## 命令管道\n\n与重定向运算符一样，shell 在扫描命令行时确定 `|`\
  \ 符号。对于每一个此类符号，shell 将 `|` 之前命令的标准输出传输到 `|` 符号之后的命令。\n\n让我们考虑以下命令：\n\n`ls -l | wc\
  \ -l`\n\n前面的命令输出当前目录下的文件总数。命令 `ls -l` 列出当前目录下的文件和目录并将结果写入标准输出，而感知不到 `|` 符号；命令的输出随后作为标准输入传输给命令\
  \ `wc -l`，`wc -l` 执行时确定了有数量提供作为输入的文件数量，并计算标准输入上的总行数。\n\n## 环境自定义\n\nShell 环境包含一组预定义的变量。这些变量被称为环境变量。Shell\
  \ 保留这些变量以控制和配置实用程序的行为。shell 变量的值通常在程序外部由操作系统或通过微服务设置。在 UNIX 中，有一组大量的环境变量，包括：\n\n\
  * 用户主目录的路径：`HOME`\n* shell 命令搜索路径：`PATH`\n* 默认提示符：`PS1`\n* 终端类型：`TERM`\n* UNIX 主机名：`HOSTNAME`\n\
  \nShell 提供了自定义环境的命令。\n\n## Shell 语言\n\nShell 有自己的编程语言来编写 shell 脚本。与 C 等其他功能性编程语言（整个程序被编译并转换为执行代码）不同，shell\
  \ 编程是解释型的。Shell 编程涉及使用 shell 命令和编程语言来编写 shell 脚本。shell 脚本是用纯文本编写的一系列命令。Shell 编程构造包括\
  \ if-then-else 结构、循环、case 结构、变量、表达式。\n\n## Shell 的类型\n\n与大多数操作系统一样，UNIX shell 并不是内置的，而是\
  \ 只是另一个程序。UNIX shell 保护内核以及用户免受相互干扰。系统提供了几种 shell，每种都有不同的特性。不同的 shell 可以分为两个 shell\
  \ 家族——Bourne shell 家族和 C shell 家族。\n\n## Bourne shell 家族\n\nBourne shell 家族由三个 shell\
  \ 组成：Bourne shell `/bin/sh` 以及 Bourne shell 的两个衍生版本——Korn shell `/bin/ksh` 和 Bourne\
  \ again shell `/bin/bash`。\n\n## Bourne shell\n\nBourne shell 由 AT&T labs 开发，是最古老的\
  \ UNIX shell。它包含在几乎所有的 UNIX 版本中。未增强的 Bourne shell 版本是 BASH，用于 LINUX。Bourne shell\
  \ 命令是算法风格编程语言（ALOGOL）风格。\n\n## Korn shell\n\nKorn shell 由 David G Korn 在 AT&T labs\
  \ 开发。它是 Bourne shell 的超集，并具有更多功能。Korn shell 将 C shell 的交互功能整合到 Bourne shell 的语法中。Korn\
  \ shell 为 Bourne shell 增加了以下新功能：\n\n* 数组\n* 文件名补全\n* 命令别名\n* 函数\n* 命令历史和替换\n\n另一种变体\
  \ shell 是 POSIX，适用于 HP-UX 11.0。在 HP-UX 中 POSIX 安装在 `/bin/sh`，而 Bourne shell 安装在\
  \ `/usr/old/bin/sh`。\n\n## BASH (Bourne again) shell\n\nbash 由自由软件基金会的 Brian Fox\
  \ 开发。目前由 Chester Ramey 维护。未增强的 Bourne shell 版本是 BASH，用于 LINUX。Bash 为 Korn shell\
  \ 增加了以下几个额外功能：\n\n* 无限制大小的数组。\n* `cd` 命令中的路径修正。\n* 2 到 64 之间任何进制的整数算术。\n\n\n\n\n\
  \n* 文件名、主机名和变量名的完成\n\n## C shell 家族\n\nC shell 家族由 C shell (`/bin/csh`) 和其衍生版本 `tcsh`\
  \ (`/bin/tcsh`) 组成。\n\nC shell 由 BILL joy 在伯克利开发，它包含了类似于 C 语言语句的命令。C shell 的兼容版本是\
  \ `tcsh`，用于 LINUX 系统。C shell 中类 C 命令的设计是为了提高编程效率，因为伯克利的程序员对 C 语言非常熟悉。TENEX/TOP 是\
  \ C shell 的新版本，它允许滚动查看命令历史，并通过箭头键进行命令列出。\n\n由于其改进的特性，C shell 在交互式使用中变得非常流行：\n\n\
  *   **命令历史：** 可以调回之前执行过的命令以便再次执行。这些命令在执行前可以重新编辑。\n*   **命令别名：** 可以为命令赋予简短的助记名。\n\
  *   **文件名补全：** C shell 只需输入文件名的几个字符即可自动补全文件名。\n*   **作业控制：** C shell 执行多个进程。使用作业命令控制并发进程。\n\
  \n由于以下原因，C shell 常用于编写脚本：\n\n*   懒惰的解释器\n*   缺乏函数\n*   输入输出能力弱\n\n## 特性总结\n\n下表显示了不同\
  \ shell 提供的特性总结：\n\n| | 命令历史 | 命令别名 | Shell 脚本 | 文件名补全 | 命令行编辑 | 作业控制 |\n| :---\
  \ | :--- | :--- | :--- | :--- | :--- | :--- |\n| Bourne | N | N | Y | N | N | N\
  \ |\n| C | Y | Y | Y | Y* | N | Y |\n| TC | Y | Y | Y | Y | Y | Y |\n| Korn | Y\
  \ | Y | Y | Y* | Y* | Y |\n| BASH | Y | Y | Y | Y | Y | Y |\n\n**表 7.1：** 各 shell\
  \ 特性对比\n\n## 元字符与通配符\n\nShell 元字符（metacharacters）是 shell 解释的特殊符号，而不是直接传递给命令。\n\n\
  元字符列表如下：\n\n| 元字符符号 | 含义 |\n| :--- | :--- |\n| ? | 文件名替换通配符，单字符 |\n| * | 文件名替换通配符，多字符\
  \ |\n| [] | 文件名替换通配符，括号内的任意字符 |\n| < | 输入重定向 |\n| << | 输入重定向（此处，文档） |\n| > | 输出重定向\
  \ |\n| >> | 输出重定向（追加） |\n| # | 注释 |\n| () | 命令分组 |\n| “cmd” | 命令替换 |\n| $(Cmd) |\
  \ 命令替换 |\n| \\| | 管道 |\n| ; | 命令序列 |\n| & | 在后台运行命令 |\n| \\| | OR 逻辑运算符 |\n| &&\
  \ | AND 逻辑运算符 |\n| $ | 扩展变量的值 |\n| \\ | 避免对下一个字符进行解释 |\n\n**表 7.2：** 用于文件名替换的元字符\n\
  \n有时要求 shell 不要解释这些符号。shell 提供了三种不同的选项来防止对这些元字符的解释（将在下一节中讨论）。\n\n## 命令标准输入/输出\n\n\
  在 UNIX 系统中，包含许多 UNIX 命令的程序逻辑上连接到终端。终端由通用文件（generic files）表示。当没有指定文件名/路径名时，命令从通用文件获取输入，当没有指定文件名/路径名时，将输出发送到通用文件。默认情况下，提供输入的通用文件（终端）称为标准输入（stdin）；显示命令输出的通用文件（终端）称为标准输出（stdout），并将任何错误信息发送到标准错误（stderr）。当命令从标准输入读取输入并向标准输出写入输出时，意味着它从键盘读取并写入屏幕，如图\
  \ 7.2 所示。\n\n![](img/Figure-7.2.jpg)\n\n**图 7.2：** 标准输入输出\n\n在 UNIX 中，标准输入通过名为 `stdin`\
  \ 的通用文件访问，标准输出通过名为 `stdout` 的通用文件访问，标准错误通过名为 `stderr` 的通用文件访问。在 UNIX 中，每个文件都有一个关联数字。对文件执行的所有操作实际上都是在关联的文件描述符（file\
  \ descriptor）上执行的。标准输出、标准输入标准错误的通用文件始终打开，并供运行的命令或程序访问。这些通用文件也有关联的文件描述符用于访问和修改。为标准\
  \ I/O 留的文件描述符如下：\n\n| 文件名 | 文件描述符 |\n| :--- | :--- |\n| `stdin` | 0 (键盘) |\n| `stdout`\
  \ | 1 (屏幕) |\n| `stderr` | 2 (屏幕) |\n\n**表 7.3：** 标准文件的文件描述符\n\n**注意：某些命令不从标准输入获取输入。**\n\
  \n**示例：cat file1**\n\n## 重定向\n\n默认情况下，每个命令或程序都连接到一个用于输入输出的标准文件。这种默认分配可以使用重定向临时更改。重定向是指定使用哪个文件代替任何标准通用文件来提供输入或获取命令输出的过程。\n\
  \n## 输出重定向\n\n程序的执行始终会在 shell 提示符产生某些输出；但在某些情况下，需要将输出重定向到其他地方，例如：\n\n*   如果程序的输出需要直接传输到打印机。\n\
  *   如果以后使用输出。\n*   如果程序产生大量输出，由于屏幕滚动非常快，很难看到所有输出。\n\n在所有这些情况下，输出都可以重定向到其他地方，例如文件或打印机。\n\
  \n有两种基本的输出重定向运算符：`>` 和 `>>`。将 `>` 符号理解为指向接收输出的箭头。\n\n运算符的选择取决于用户如何处理输出。如果用户希望文件仅包含当前命令的输出，将使用\
  \ `>` 运算符。在这种情况下，如果文件已经包含内容，将被当前命令的输出替换。\n\n**示例：**\n\n```bash\n$ls -l > file1\n\
  ```\n\n符号 `>` 被识别为特殊的输出重定向，符号后面的单词被视为文件名。\n\n在前面的示例中，`ls -l` 命令的输出被重定向到文件 `file1`。如果\
  \ `file1` 已存在，其内容将被替换。执行的命令并不关心输出被重定向到哪里。\n\n**注意：如果 file1 不存在，UNIX 将创建文件并输出。**\n\
  \n如果用户想要将当前命令的输出追加到文件中，重定向令牌是两个 `>>` 符号。如果文件不存在，UNIX 将创建文件。考虑一个连接两个文件的示例：\n\n```bash\n\
  $cat file1 >> file2\n```\n\n在前面的示例中，`file1` 的内容将被复制到 `file2`。\n\n## 使用 noclobber\
  \ 进行安全的 I/O 重定向\n\nc shell 中的 noclobber 变量或 bash 和 ksh 中的 noclobber 选项可以防止破坏文件内容。重新考虑重定向示例：\n\
  \n```bash\n$ls –l > file1\n```\n\n在这个示例中，如果 `file1` 已存在，其内容将被 `ls –l` 命令的输出替换。如果开启了\
  \ noclobber 选项，它可以防止破坏内容；相反，它会生成错误消息。\n\n设置 noclobber 的命令如下：\n\n```bash\n% set noclobber\
  \ ( C shell)\n$ set –o noclobber\n\n\n**注意：如果用户希望在重定向期间显式地替换现有文件，需要在输出重定向运算符后放置感叹号\
  \ (!)。**\n\n**示例：**\n\n```bash\n%  ls - l > ! file1\n```\n\n\n\n\n下表显示了常见的标准输入输出重定向：\n\
  \n| **功能** | **Csh** | **sh** |\n| :--- | :--- | :--- |\n| 将标准输出重到文件 | `prog > file`\
  \ | `prog > file` |\n| 将标准错误重到文件 | | `prog 2> file` |\n| 将标准输出和错误重到文件 | `prog >&\
  \ file` | `prog > file 2>&1` |\n| 从文件读取标准输入 | `prog < file` | `prog < file` |\n\
  | 将标准输出重到文件尾 | `prog >> file` | `prog >> file` |\n| 将标准错误重到文件尾 | | `prog 2>> file`\
  \ |\n| 将标准输出和错误重到文件尾 | `prog >>& file` | `prog >> file 2>&1` |\n| 从键盘读取标准输入直到遇到\
  \ c | `prog << c` | `prog << c` |\n| 将标准输出管道到 prog2 | `prog | prog2` | `prog | prog2`\
  \ |\n| 将标准输出和错误管道到 prog2 | `prog |& prog2` | `prog 2>&1 | prog2` |\n\n**表 7.4:**\
  \ 常见的标准输入输出重定向\n\n## 输入重定向\n\n与输出重定向类似，默认情况下，程序的输入是通过键盘终端提供的。然而，有时执行程序需要大量的输入。在这种情况下，输入可以存储在文件中，稍后可以作为被执行程序的输入输入。输入重定向运算符是小于符号\
  \ `<`。可以将其想象为一个指向命令的箭头。\n\n### 示例：\n\n```\n$ mail George < mail_file\n```\n\n前述命令将\
  \ `mail_file` 文件的内容通过邮件发送给 George。\n\n让我们考虑两个完全相同的命令：\n\n**情况 1：wc –l file1**\n\
  **输出: 10**\n\n**情况 2：wc –l < file1**\n**输出: 10 file1**\n\n在情况 1 中，shell 确定执行 `wc`\
  \ 命令来统计文件 `file1` 的行数；它打开文件 `file1` 并计算行数。\n\n在情况 2 中，`wc` 的执行方式略有不同。shell 在扫描命令行时确定了输入重定向运算符\
  \ `<`，`<` 符号后面的单词是用于重定向输入的文件名。shell 执行 `wc` 命令，将其标准输入从文件 `file1` 重定向。\n\n**注意：单个命令中不能同时使用输入和输出重定向。**\n\
  \n## 重定向错误\n\n显示程序或命令生成的错误的标准流默认与标准输出流合并。考虑以下一个示例：\n\n```\n$ls -l file1 file2\n\
  ```\n\n**输出：**\n```\nCannot access file2. No such file or directory\n-rwxr-xr-x\
  \ 1 workshop acs 532 May 2015:31 . file1\n```\n\n输出和错误信息都显示在同一个屏幕上。用户可以将标准错误重定向到文件并将输出留在屏幕上，反之也是可能的。要做到这一点，用户需要在使用重定向运算符的同时指定文件描述符。让我们重新考虑之前的示例：\n\
  \n```\n$ls –l file file2 1> out_file\n```\n\n**输出：**\n```\nCannot access file2.\
  \ No such file or directory\n$ cat out_file\n-rwxr-xr-x 1 workshop acs 532 May 2015:31\
  \ . file1\n```\n\n错误信息显示在屏幕上，告知我们执行命令时出现问题，而输出被重到了文件 `out_file`。\n\n错误信息和输出都可以如下所示重定向到文件：\n\
  \n```\n$ls –l file file2 1> out_file 2> err_file\n$more err_file\nCannot access\
  \ file2. No such file or directory\n$more out_file\n-rwxr-xr-x 1 workshop acs 532\
  \ May 2015:31 . file1\n```\n\n## 重定向到同一个文件\n\n`STDOUT` 和 `STDERR` 都可以重定向到同一个文件。考虑一个示例：\n\
  \n```\n$ls –l 1> out_file 2> &1\n```\n\n## 丢弃 STDOUT 或 STDERR\n\n可以通过重定向到由特殊只写文件\
  \ `/dev/null` 访问空设备来丢弃 `STDOUT` 或 `STDERR` 或两者。\n\n**示例：**\n\n```\n$ls –l > /dev/null\
  \ 2>&1\n```\n\n最左侧的重定向将 `SDTOUT` 发送到 `/dev/null` 文件，而 `2>$1` 表示通道 2 应该重定向到与通道 1\
  \ 相同的文件。\n\n## 命令分组\n\n命令可以通过以下两种方式分组：\n\n* `{ command-list ; }`\n* `( command-list\
  \ )`\n\n在第一个命令中，列表被简单执行。第二种形式将命令列表作为独立的进程执行。例如，(`cd x;`) (`cd x`)。（注：原文此处存在大量重复，翻译已处理以保持逻辑完整性）。\n\
  \n## 命令管道\n\n\n\n\n## HOME 变量\n\n`HOME` 环境变量由登录过程设置。它指定了登录用户的家目录。当执行不带任何参数的 `cd`\
  \ 命令时，它会自动进入家目录。\n\n## 提示符字符串 1 (PS1) 变量\n\n`PS1` 变量是一组指定为提示符符号的字符。通常，它是一个“$` 符号。但是，它可以更改为用户想要的任何。\n\
  \n## 提示符字符串 2 (PS2) 变量\n\n当系统认为新行开始但未完成完成时，会显示 `PS2`。通常，它是 `>` 符号。\n\n## MAIL 变量\n\
  \n`MAIL` 变量包含邮箱的地址。`MAIL` 变量在登录过程中的用户配置文件中设置。\n\n## CDPATH 变量\n\n当执行 `cd` 命令更改目录时，shell\
  \ 会搜索当前目录内部的目录。变量 `CDPATH` 包含了用于更改目录时要搜索的附加目录列表。\n\n`$CDPATH=$HOME`\n\n**示例：**\n\
  \n`$cd ch_dir`\n\nShell 在当前目录下查找目录 `ch_dir`；如果在当前目录下未找到 `ch_dir`，shell 将在 `CDPATH`\
  \ 变量定义的目录列表中进行搜索。\n\n## MAILCHECK 变量\n\n`MAILCHECK` 变量指定了 shell 检查邮件的时间和频率。对于 Bourne\
  \ shell，此变量的默认值为 10 分钟。如果未设置此变量，shell 将禁用邮件检查。\n\n**注意：有时将当前目录作为搜索路径可能是危险的；考虑一种情况：如果有人在当前目录创建了程序，那么这个木马将代替实际的\
  \ who 命令被执行**\n\n**注意：如果 `MAILCHECK` 设置为 0，shell 在每次打印主“提示符”符号时都会检查邮件。**\n\n## MAILPATH\
  \ 变量\n\nBourne shell 通过检查 `MAIL` 变量设置的单个目录来提供邮件通知。如果用户想监控多个邮箱，则需要设置 `MAILPATH` 变量。`MAILPATH`\
  \ 变量由冒号分隔的独立文件或目录列表组成，用于检查提供邮件通知。\n\n`$MAILPATH=/usr/spool/mail/George:/usr/spool/mail/cust_query`\n\
  \n**注意：如果设置了 `MAILPATH` 变量，shell 会忽略 `MAIL` 变量。两者不能一起使用。**\n\n此外，登录过程定义了其他环境变量。`TERM`\
  \ 定义终端类型，`USER` 或 `LOGNAME` 定义 `userID`，`SHELL` 定义默认 shell，`TZ` 定义时区。\n\n## 用户配置文件\n\
  \n当用户登录到 UNIX 系统时，shell 显示提示符符号并等待用户输入命令。然而，在显示提示符符号之前，shell 执行两个文件。\n\n第一个文件是 `/etc/profile`，由系统管理员设置。该文件包含所有使用\
  \ Bourne shell (`/bin/sh`) 登录的用户的系统级默认设置。此文件通常执行此类操作，如检查 `MAIL` 是否设置、默认文件创建掩码 (`umask`)\
  \ 以及设置标准的导出变量。此文件中的命令是简单的变量赋值。\n\n一个典型的 `/etc/profile` 文件如下：\n\n```bash\n#设置文件创建掩码\n\
  unmask 022\n#告诉我新邮件到达的位置\nMAIL=/usr/mail/$LOGNAME\n#将我的 /bin 目录添加到 shell 搜索序列\n\
  PATH=/usr/bin:/usr/sbin:/etc::\n#设置终端类型\nTERM=lft\n#将某些环境变量全局化\nexport MAIL PATH\
  \ TERM\n```\n\n第二个文件是 `.profile`，由系统管理员设置，并在登录过程将 `LOGNAME` 和 `HOME` 变量添加到环境变量后，在用户目录下目录下执行。包含了该\
  \ shell 的定义并将其导出以自定义用户自己的环境。由于`.profile` 存储在用户的家目录下，用户可以更改 `.profile` 以包含用户登录时执行的任何命令。`.profile`\
  \ 中的命令可以覆盖 `/etc/profile` 文件中的设置。\n\n一个典型的 `.profile` 如下：\n\n```bash\nPATH=/usr/bin:/etc:/home/bin1:/home/lpp/tps4.0/user::\n\
  epath=/home/gsc/e3:\nexport PATH epath\ncsh\n```\n\n`.profile` 仅仅是在用户登录时执行的 shell\
  \ 脚本。普通的 UNIX 命令也可以包含在 `.profile` 中。修改 `.profile` 可以为用户创建一个自定义的 UNIX 环境。\n\n**注意：`.profile`\
  \ 不显示在家目录的文件和目录列表中，因为它是一个隐藏文件。要列出它，使用 `ls -a` 命令。**\n\n## 结论\n\nshell 是 UNIX 操作系统的重要组成部分。用户可以通过\
  \ shell 与内核（Kernel）交互。它作为 UNIX 操作系统的命令解释器。大多数系统管理任务都是使用 shell 脚本完成的。本章讨论了 shell\
  \ 所有可能的功能和特性。下一章将逻辑、控制和脚本编写。\n\n## 测试你的技能\n\n1.  哪个变量指定了提示符符号？\n    a) `PS1`\n \
