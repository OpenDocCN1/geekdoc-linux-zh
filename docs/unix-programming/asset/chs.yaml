  set ONE TWO THREE\necho $1\necho $2\necho $3\n```\n\n保存并执行该脚本：\n\n```bash\n$ set.sh\n\
  Output   ONE     TWO      THREE:\nl\nEDITOR= /users/bin\nHOME=/users/George\nLOGNAME=Geore\n\
  PATH= /users/bin\n```\n\n`set` 命令也用于重新分配位置参数的值。位置参数的值来自 shell 脚本执行时通过命令行传递的字符串。更改这些值的唯一方法是在执行执行期间使用\
  \ `set` 命令。\n\n## 交互式输入\n\nShell 脚本将接受交互式输入来设置脚本中的参数。\n\nShell 使用内置命令 `read` 从标准输入读取一行，并将由空格分隔的单词赋值给变量。如果单词数量超过变量数量，则多出的单词将存储在最后一个变量中。\n\
  \n`read` 命令的退出状态为零，除非遇到文件结束（EOF）条件。如果从终端读取，则在按下 `Ctrl` + `D` 时遇到文件结束。如果是从文件读取，则当文件中没有更多数据时会遇到行结束。\n\
  \n考虑以下示例：\n\n```bash\n$ vi add.sh\nwhile read v1 v2\ndo\necho $((v1 –v2))\ndone\n\
  ```\n\n执行执行时：\n\n```bash\n$ add.sh\n23 13\n10\n25 5\n20\nCtrl = d\n$\n```\n\n让我们来看另一个示例：\n\
  \n```bash\n$ read age name\n39 Bill George\n$ echo '$age\\n $name'\n39\nBill George\n\
  ```\n\n我们可以通过这个简单的脚本来说明这一点：\n\n```bash\n#!/bin/sh\necho -n “Input a phrase \\c”\
  \ # 这是 /bin/echo，需要“\\c”来防止换行\nread param\necho param=$param\n```\n\n当我们运行此脚本时，它会提示输入并回显结果：\n\
  \n```bash\n$ ./read.sh\nInput a phrase hello mca01 # 我输入了 hello mca01 <回车>\nparam=hello\
  \ mca01\n```\n\n## 子 shell\n\n如前所述，系统中有多个 shell 对应每个终端。此外，每当执行 shell 脚本时，shell 都会创建一个子\
  \ shell（sub shell）。子 shell 是执行程序的一个完全全新的 shell。新 shell 带有其自身的 shell 环境和局部变量运行。子\
  \ shell 不知道父 shell 中分配的局部变量。子 shell 无法更改父 shell 中变量的值。子 shell 也无法更改父 shell 中内置环境变量的值。\n\
  \n以下是子 shell 中局部变量的示例：\n\n```bash\nvi loc_var.sh\necho initialize local variable\
  \ x in sub shell\nx=50\necho $x\n$ loc_var.sh     execute loc_var.sh\n$50     Sub\
  \ shell terminated\n$ echo $x\n$\n```\n\n这将会显示为空，因为变量 `x` 在父 shell 中没有被赋值任何值。\n\n\
  以下是带有环境变量的子 shell 示例：\n\n```bash\nvi shell_vars.sh\necho $PS1\nPS1=’=>’\n```\n\n\
  保存并执行文件 `shell_var.sh`：\n\n```bash\n$ shell_var.sh\n$ $\n=>\n```\n\n现在再次从父 shell\
  \ 中显示 `PS1`：\n\n```bash\n$ echo $PS1\n$ $\n```\n\n这意味着在子 shell 环境变量中所做的更改不会反映在父\
  \ shell 中。\n\n## 导出变量\n\n如前所述，子 shell 不知道父 shell 中分配的局部变量。如果需要在子 shell 中访问父 shell\
  \ 中的局部变量，必须先将其导出（export）。导出变量意味着将变量传递给子 shell。\n\n以下是子 shell 中局部变量的示例：\n\n```bash\n\
  $ x=200\n$ echo 4x\n$ 200\nvi exp_var.sh\necho x = $x\n```\n\n保存并执行脚本 `exp_var`；输出为\
  \ `x`。\n\n由于变量 `x` 在子 shell 中不可用，因此子 shell 的输出是 `x` 而不是 `200`。要将 `x` 导出到子 shell：\n\
  \n```bash\n$ x=200\n$ echo 4x\n$ 200\nvi exp_var.sh\necho x = $x\n```\n\n以下是子 shell\
  \ 中局部变量的示例：\n\n```bash\n$ x=200\n$ echo 4x\n$ 200\n```\n\n以下是 `export` 的示例：\n\n\
  ```bash\n$ x=200\n```\n\n以下是 `export` 的示例：\n\n```bash\n$ x=200\n```\n\n## 测试操作符\n\
  \n`test` 命令用于检查各种条件。它在本质上是一元操作。它接受单个参数作为文件名。\n\n文件测试：\n\n*   `-r`: 如果存在且可读，则为真。\n\
  *   `-w`: 如果存在且可写，则为真。\n*   `-x`: 如果存在且可执行，则为真。\n*   `-f`: 如果是普通文件，则为真。\n*   `-d`:\
  \ 如果是目录，则为真。\n*   `-c`: 如果是字符设备，则为真。\n*   `-b`: 如果是块设备，则为真。\n*   `-p`: 如果是命名管道 (fifo)，则为真。\n\
  *   `-u`: 如果设置了用户 ID，则为真。\n*   `-g`: 如果设置了组 ID，则为真。\n*   `-k`: 如果设置了粘位，则为真。\n* \
  \  `-L`: 如果是符号链接，则为真。\n*   `-s`: 如果大小大于零，则为真。\n\n文件描述符测试：\n\n*   `-t`: 如果文件描述符关联终端，则为真。\n\
  \n以下是文件用法示例：\n\n```bash\n#检查文件\necho “Enter filename”\nread fname\nif test -d $fname\n\
  then\n  echo “$fname 是一个目录”\nelse\n  echo “$fname 是一个文件”\nfi\n```\n\n字符串测试：\n\n\
  *   `-z`: 如果字符串长度为零，则为真。\n*   `-n`: 如果字符串长度非零，则为真。\n*   `string1 = string2`: 如果\
  \ string1 与 string2 相同，则为真。\n*   `string1 != string2`: 如果 string1 与 string2 不同，则为真。\n\
  \n以下是使用字符串检查的示例：\n\n```bash\n#检查字符串是否为空\necho “Enter a file name”\nread fname\n\
  if test -z $fname\nthen\n  echo “Enter 一个非空文件名”\nfi\n```\n\n数值比较测试：\n\n*   `n1 -eq\
  \ n2`: 如果整数 n1 和 n2 相等，则为真。\n*   `n1 -ne n2`: 如果整数 n1 和 n2 不等，则为真。\n*   `n1 -gt\
  \ n2`: 如果整数 n1 大于整数 n2，则为真。\n\n\n\n\n\n*   `n1 -ge n2`: 如果整数 `n1` 大于或等于整数 `n2` 则为真。\n\
  *   `n1 -lt n2`: 如果整数 `n1` 小于整数 `n2` 则为真。\n*   `n1 -le n2`: 如果整数 `n1` 小于或等于整数 `n2`\
  \ 则为真。\n\n以下是一个数值比较程序示例：\n\n```bash\n#compare.sh\necho “Enter two numbers”\nread\
  \ n1 n2\nif test $n1 –eq $n2\nthen\necho “The numbers are equal”\nelif test $n1\
  \ –gt $n2\nthen\necho $n1 is greater than $n2\nelse\necho $n2 is less than $n1\n\
  fi\n```\n\n它将要求输入两个数字。如果两个数字相等，它将打印 `The numbers are equal`；否则，它将测试哪个数字较大并打印相应的消息。\n\
  \n`test` 命令也可以用 `[` 和 `]` 来表示，而无需使用 `test` 操作符。\n\n例如：\n\n```bash\nif [ -d $fname\
  \ ]\nthen\nEcho “$fname is a directory”\nelse\nEcho “$fname is a file”\nfi\n```\n\
  \n## test 命令中的逻辑运算符\n\n以下是可用的逻辑运算符：\n\n### 否定操作符 (!)\n\n`!` 一元操作符可以与 `test` 命令配合使用，对任何表达式求值的结果取否定。\n\
  \n```bash\n[ ! –r /users/home/data]\n```\n\n如果目录 `/user/home/data` 不可，条件将为真。\n\n\
  ### 逻辑与运算符\n\n`-a` 和（二进制）操作符使用 `test` 命令对两个表达式执行逻辑与操作。\n\n```bash\n[ -f $file1 –a\
  \ –r $file1 ]\n```\n\n如果变量 `file1` 包含一个普通文件且可读，则前面的条件将为真。\n\n### 逻辑或运算符\n\n`-o`\
  \ 或（二进制）操作符使用 `test` 命令对两个表达式执行逻辑或操作。\n\n```bash\n[ -f $file1 –o -r $file1 ]\n```\n\
  \n如果变量 `file1` 包含普通文件或者它是可读的，则前面的条件将为真。\n\n## 控制命令\n\nBourne shell 拥有控制命令，如 `if-then-else`\
  \ 结构、`case` 结构、循环和表达式求值。\n\n### 条件 if\n\n这是基本的控制流机制。它使用 `if`、`elif` 和 `else` 命令/关键字来控制过程的流。\n\
  \n```bash\nif condition1\nthen\ncommand list if condition1 is true\n[elif condition2\n\
  then\ncommand list if condition2 is true]\n[else\ncommand list if condition1 is\
  \ false]\nfi\n```\n\n要测试的条件通常用 `test` 命令完成。`if` 和 `then` 必须分开，可以使用换行符 `<newline>`\
  \ 或分号（`;`）。\n\n以下是一个检查命令行参数数量的示例：\n\n```bash\n#!/bin/sh\nif [ $# -ge 2 ]\nthen\n\
  echo $2\nelif [ $# -eq 1 ]; then\necho $1\nelse\necho No input\nfi\n```\n\n条件测试的格式中要求留有空格，`[`\
  \ 之后有一个，`]` 之前有一个。该脚本将根据命令行上是否有零、一个或多个参数来做出不同的响应。首先在没有参数的情况下：\n\n`$ ./if.sh`\n`No\
  \ input`\n\n现在有一个参数时：\n\n`$ ./if.sh one`\n`one`\n\n现在有两个参数时：\n\n`$ ./if.sh one two`\n\
  `two`\n\n### 条件 case\n\n要在参数的一组字符串值之间选择，请在 Bourne shell 中使用 `case`：\n\n```bash\n\
  case parameter in\npattern1[|pattern1a]) command list1;;\npattern2) command list2\n\
  command list2a;;\npattern3) command list3;;\n*) ;;\nesac\n```\n\n你可以在匹配模式中使用任何有效的文件名元字符进行匹配。`;;`\
  \ 结束每个选择，可以位于同一行，也可以在换行符 `<newline>` 之后作为该选择的最后一个命令。\n\n为特定情况选择的其他备选模式用竖线 `|` 分隔，如上例中的第一个模式行所示。通配符符号\
  \ `?` 表示任意一个字符，`*` 表示匹配任意数量字符字符可以单独使用，也可以与固定字符串相邻。\n\n这个简单的示例说明了如何使用条件 case 语句：\n\
  \n```bash\n#menu.sh\nclear\necho “Press 1 to see directory listing “\necho “Press\
  \ 2 to see users logged in”\necho “Press 3 to quit”\ncase choice in\n1)ls;;\n2)who;;\n\
  3)exit;;\n*)echo “Unknown option”\nesac\n```\n\n### while 命令\n\n`while` 命令允许只要条件为真时执行一个代码块。\n\
  \n```bash\nwhile condition\ndo\ncommand list\ndone\n```\n\n要测试的条件通常用 `test` 命令完成。`if`\
  \ 和 `then` 必须分开，可以使用换行符 `<newline>` 或分号（`;`）。\n\n以下是一个检查命令行参数数量的示例：\n\n```bash\n\
  #!/bin/sh\nif [ $# -ge 2 ]\nthen\necho $2\nelif [ $# -eq 1 ]; then\necho $1\nelse\n\
  echo No input\nfi\n```\n\n条件测试的格式中要求留有空格，`[` 之后有一个，`]` 之前有一个。该脚本将根据命令行上是否有零、一个或多个参数来做出不同的响应。首先在没有参数的情况下：\n\
  \n`$ ./if.sh`\n`No input`\n\n现在有一个参数时：\n\n`$ ./if.sh one`\n`one`\n\n现在有两个参数时：\n\n\
  `$ ./if.sh one two`\n`two`\n\n### break 命令\n\n`break` 命令用于立即退出循环。\n\n当执行 `break`\
  \ 命令时，控制将立即切换到写在循环之后的语句，然后程序正常继续。\n\n循环结构中的条件状态没有意义，但根据使用 `break` 命令的循环返回零或非零。\n\
  \n以下是一个使用 `break` 命令的示例：\n\n```bash\nwhile :\ndo\nread -p “Enter integer number\
  \ ; ” a\nif [ $a -eq -1 ]\nthen\nbreak\nfi\ndone\necho $a\n```\n\n### continue 命令\n\
  \n`continue` 命令将控制传递给循环的下一次迭代，跳过循环体中的剩余命令。\n\n以下是一个显示偶数的  示例：\n\n```bash\nfor number\
  \ in 1 2 3 4 5 6 7 8\ndo\ncase $number in (1| 3|5 |7) continue\nesac\necho $number\n\
  done\n```\n\n它将输出 `2 4 6 8`。\n\n\n\n\n\n# 特殊字符串操作\n\n我们还可以使用 `expr` 运算符查找字符串的长度、提取子字符串或在字符串中定位字符。\n\
  \n计算字符串长度：使用 `expr` 配合“.*”\n\n```bash\n$expr “abcdefghijk”  :  ‘.*’\n```\n```\n\
  12\n```\n\n打印字符串的长度。\n\n使用以下命令提取子字符串：\n\n```bash\n$expr “abcd” :  ‘..\\(..\\)’\n\
  ```\n```\ncd\n```\n\n点的数对应于字符的数量。这意味着要从字符串 `abcd` 中提取字符 `cd`，我们需要跳过前两个字符，然后提取两个字符。\n\
  \n接下来，让我们在字符串中定位一个字符：\n\n```bash\n$expr “abcdefg” :  ‘[^d]*d’\n```\n```\n4\n```\n\
  \n该命令用于定位字符 `d` 在字符串 `abcdefg` 中的位置。`expr` 命令表示跳过所有不是 `d` 的字符，直到遇到字符 `d`。\n\n# 参数替换\n\
  \n你可以通过下面定义的运算符抽象地引用参数，并根据条件设置对其进行值替换。我们再次使用大括号 ({})）来隔离变量及其运算符。\n\n*   `$parameter`:\
  \ 在字符串中替换该参数的值。\n*   `${parameter}`：与上述相同。如果该参数与相邻字符串之间没有分隔符，括号会很有帮助。\n*   `$parameter=`：将参数为空。\n\
  *   `${parameter-default}`：如果参数未设置，则在此处使用默认值。该参数不会被重置。\n*   `${parameter=default}`：如果参数未设置，则将其设置为默认值并使用新值。\n\
  *   `${parameter+newval}`：如果参数已设置，则使用 `newval`；否则此处留空。参数不会被重置。\n*   `${parameter?message}`：如果参数未设置，则显示消息。如果参数已设置，则使用其当前值。\n\
  \n上述运算符中没有空格。如果在 `-`、`=`、`+` 或 `?` 之前插入冒号 (:)，则会先进行测试，检查参数是否具有非空设置。\n\n为了说明其中一些功能，我们将使用以下测试脚本：\n\
  \n```bash\n#!/bin/sh\nparam0=$0\ntest -n “$1” && param1=$1\ntest -n “$2” && param2=$2\n\
  test -n “$3” && param3=$3\necho 0: $param0\necho “1: ${param1-1}: \\c” ;echo $param1\n\
  echo “2: ${param2=2}: \\c” ;echo $param2\necho “3: ${param3+3}: \\c” ;echo $param3\n\
  ```\n\n在脚本中，我们首先测试变量是否存在；如果是，我们将参数设为它的值。如下，我们报告这些值并允许替换。\n\n第一次运行脚本时，我们不提供任何参数：\n\
  \n```bash\n$ ./parameter.sh\n0: ./parameter.sh # 总是找到 $0\n1: 1: # 替换 1，但不分配此值\n\
  2: 2: 2 # 替换 2 并分配此值\n3: : # 不替换\n```\n\n第二次运行脚本时，我们将提供参数：\n\n```bash\n$ ./parameter\
  \ one two three\n0: ./parameter.sh # 总是找到 $0\n1: one: one # 不替换，它已经有值\n2: two: two\
  \ # 不替换，它已经有值\n3: 3: three # 替换 3，但不分配此值\n```\n\n# 函数\n\nBourne shell 也有函数功能。这些与\
  \ C shell 中的别名（aliases）类似，但允许更大的活性。函数是可以以后从 UNIX 代码调用的复用代码。\n\n函数的格式如下：\n\n```bash\n\
  fcn () { command; }\n```\n\n`{ 之后的空格和分号 (`;`) 都是必须；如果在 `}` 之前有一个 `<newline>`，可以省略分号。允许额外的空格和\
  \ `<newline>`。\n\n```bash\nls() { /bin/ls -sbF “$@”;}\nll() { ls -al “$@”;}\n```\n\
  \n第一个重定义了 `ls`，使得选项 `-sbF` 始终提供给标准的 `/bin/ls` 命令，并作用于提供的输入 `$@`。第二个获取 `ls` 的当前值（上一个函数）并加上\
  \ `-al` 选项。函数在 shell 脚本中非常有用。\n\n# 向函数传递参数\n\n位置参数 `$1`、`$2`、…… `$*n` 用于函数的参数。在函数调用期间，使用空格分隔的字符串将值赋值给位置参数。例如：\n\
  \n```bash\nShell__fun ()\n{\necho $1\necho $2\n}\n```\n\n# 从函数返回\n\nBourne shell\
  \ 拥有函数功能。函数是可以以后从 UNIX 代码调用的复用代码。\n\n函数的格式如下：\n\n```bash\nfcn () { command; }\n\
  ```\n\n`{ 之后的空格和分号 (`;`) 都是必须；如果在 `}` 之前有一个 `<newline>`，可以省略分号。允许额外的空格和 `<newline>`。\n\
  \n# 捕获信号\n\nBourne shell 也有函数功能。这些与 C shell 中的别名类似，但允许更大的活性。函数是可以以后从 UNIX 代码调用的复用代码。\n\
  \n# 数组\n\nBourne 和 C shell 不支持数组，但 bash 和 Korn shell 支持数组。该功能仅限于一维，且最多有 1024 个元素。\n\
  \n\n\n\nUNIX 是一个巨大的命令集合。用户可以通过组合这些简单的命令集来构建自己的复杂命令。在 UNIX 中，软件开发的概念始于程序最顶层的 shell（外壳）。UNIX\
  \ shell 是一种功能完备的语言，具有 shell 环境、shell 变量、命令行参数、条件和控制结构。除了基础编程工具外，shell 还提供了容量有限的数组、函数和信号捕获功能。Bourn\
  \ shell（布恩外壳）被认为是 UNIX 操作系统的主要 shell。\n\n# 复习练习题\n\n1. 编写一个 shell 脚本，重复显示指定次数的某个单词。[命令行参数：`word`,\
  \ `number` ]\n2. 编写一个 shell 脚本，检查是否为闰年。[命令行参数：`four digit year` ]\n3. 编写一个 shell\
  \ 脚本，删除文件中所有包含单词 `UNIX` 单词的行。[命令行参数：`filename` ]\n4. 编写一个 shell 脚本，比较两个文件，如果发现相等则删除第二个文件。[命令行参数：`file1`,\
  \ `file2` ]\n5. 编写一个 shell 脚本，计算一个数字各位位数字之和。[命令行参数：`number` ]\n6. 编写一个 shell 脚本，计算一个数字的阶乘。\n\
  7. 编写一个 shell 脚本，在文件的每行前加上行号。[命令行参数：`filename` ]\n8. 编写一个 shell 脚本，将文件中所有的小写字母转换为大写字母。[命令行参数：`filename`\
  \ ]\n9. 编写一个 shell 脚本，将不带时间的日期复制文件中。\n10. 编写一个 shell 脚本，检查给定文件是普通文件还是目录。\n11. 编写一个\
  \ shell 脚本，每隔 15 秒显示一次已登录的用户。\n12. 编写一个 shell 脚本，从一个数字倒减到 0。如果没有提供参数，则起始数字应为 10。[命令行参数：`number`\
  \ ]\n13. 编写一个 shell 脚本，将当前目录下所有大写字母文件名更改为小写。\n14. 编写一个 shell 脚本，将当前目录下所有文本文件的扩展名从\
  \ `.txt` 改为 `.doc`。\n15. 编写一个 shell 脚本，在当前目录下所有文本文件的末尾添加消息 (c) MCA 2006-2007。\n\
  16. 编写一个 shell 脚本，反复询问印度的首都。当用户输入 Delhi 时，程序应终止。\n17. 编写一个 shell 脚本，检查用户是否已登录。\n\
  18. 编写一个 shell 脚本，根据一天的时间显示 Good Morning 或 Good Afternoon 或 Good Evening。\n19. 编写一个\
  \ shell 脚本，删除作为命令行参数传递的文件。\n20. 编写一个 shell 脚本，统计文件中包含给定单词的行数。[命令行参数：`word`, `filename`\
  \ ]\n21. 什么是系统变量和用户变量？讨论任意五个系统变量。\n22. 编写一个 shell 脚本，反转输入数字 `n` 的数字。\n23. 用合适的示例解释不同的\
  \ shell 编程结构。\n24. 解释以下变量的：\n    1. `$#`\n    2. `$*`\n    3. `$$`\n    4. `$(d)?`\
  \ \n    5. `PS1`\n26. 编写一个 shell 脚本，识别传递的参数个数是奇数还是偶数。\n\n这里提供了部分 shell 脚本的解决方案：\n\
  \n## 重复显示单词的 Shell 脚本\n\n```bash\nif [ $# -ne 2 ]\nthen\n  echo “Usage: a1 word\
  \ number”\n  exit\nelse\n  i=1\n  while [ $i -le $2 ]\n  do\n    echo $1\n    i=`expr\
  \ $i + 1`\n  done\nfi\n```\n\n## 检查闰年的 Shell 脚本\n\n```bash\nif [ $# -ne 1 ]\nthen\n\
  \  echo “Usage: $0 year”\n  exit\nfi\nif [ `expr $1 % 4` -eq 0 -a \\(`expr $1 %\
  \ 100` -ne 0 -o `expr $1 % 400` -eq 0 \\)]\nthen\n  echo $1 is a Leap Year\nelse\n\
  \  echo $1 is not a Leap Year\nfi\n```\n\n## 删除所有包含 UNIX 单词行的 Shell 脚本\n\n```bash\n\
  if [ $# -ne 1 ]\nthen\n  echo “Usage: $0 filename”\n  exit\nelse\n  grep -v “UNIX”\
  \ $1 > tmp\n  mv tmp $1\nfi\n```\n\n## 比较 2 个文件并在相等时删除第二个文件的 Shell 脚本\n\n```bash\n\
  if [ $# -ne 2 ]\nthen\n  echo “Usage: $0 file1 file2”\n  exit\nelse\n  cmp -s $1\
