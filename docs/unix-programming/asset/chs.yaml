  3. **b-c-e**\n4. **c**\n5. **b**\n6. **a**\n\n## 复习题\n\n1. 如果文件创建掩码设置为 777 会发生什么？\n\
  2. UNIX 对目录树的深度是否有基本限制？\n3. 结合解释绝对路径和相对路径。\n4. 多程序、多用户和多任务意味着什么？\n5. 请用整洁的图解释 Unix\
  \ 内核与 shell 之间的关系。\n6. 解释通配符 `*` 和 `?`。\n7. 密码存储在何处？\n8. 解释标准的 UNIX 文件层次结构。\n9.\
  \ UID 和 GID 代表什么？\n\n# 第 2 章\n\n## 文件管理\n\n文件是记录在次级存储上的相关信息的集合。或者说文件是逻辑相关实体的集合。从用户的角度来看，文件是次级存储的最小单元，用于向计算机程序提供输入和接收输出。在存储中，媒体文件只是位、字节或记录的序列，其逻辑含义由文件所有者定义。\n\
  \n在数据存储中管理文件的结构和逻辑规则被称为文件系统。为了理解文件系统的内部操作，需要了解文件和目录如何外部呈现给用户，以及它们在系统内部如何表示。存储介质可能在不同的分区上存在许多文件系统。本章将讨论\
  \ UNIX 文件系统的结构以及用于操作文件的文件系统相关系统调用。\n\n## 结构\n\n本章将涵盖以下主题：\n\n* 用于 I/O 的系统调用和库函数\n\
  * 用于处理所有已打开文件的内核数据结构\n* 文件访问权限\n* 用于用户密码和老化信息的标准文件\n* UNIX 文件系统的结构和操作\n\n## 目标\n\
  \n学习完本章后，你将能够：\n\n* 了解 UNIX 操作系统如何在次级存储中组织文件\n* 理解文件相关的活动，如命名、检索和共享\n* 学习 UNIX 操作系统如何实现文件保护策略\n\
  \n## 文件输入/输出\n\n文件输入/输出 (I/O) 是任何操作系统的重要功能，文件输入是为了向执行的进程提供信息以处理现有信息。文件输出是为了通过 UNIX\
  \ 进程永久存储首次创建的信息或更新后的信息。UNIX 维护了一些内核数据结构来管理文件 I/O。这些数据结构存储了访问和更新系统中所有已打开文件所需的元数据。UNIX\
  \ FILE I/O 使用 C 标准库函数或 UNIX 系统调用执行。在本节中，我们将讨论执行 UNIX FILE I/O 的各种系统调用。\n\n## 用于文件输入/输出的内核数据结构\n\
  \n以下三个数据结构用于管理 UNIX 文件系统中的已打开文件：\n\n* **内核文件表 (Kernel file table)：** 文件表包含任何进程打开的每个文件的条目。它是一个全局数据结构，用于跟踪读写期间的字节偏移量；该文件中的每个条目都包含指示读/写访问、阻塞/非阻塞等标志位，且每个条目包含一个指向该文件\
  \ v-node 表条目的指针。内核文件表包含一个引用计数，显示文件被打开的次数。\n* **进程级文件描述符表 (Per-process file descriptor\
  \ table)：** 它监控一个进程的所有已打开文件。每个条目都包含一个指向内核文件表的指针。在读、写和其他系统调用中使用的文件描述符是该表中的索引。文件描述符是一个无符号正整数，负值预留用于表示“无值”或错误情况。值\
  \ 0、1 和 2 分别预留给“标准输入”、“标准输出”和“标准错误”。\n* **内存表 (The in-core table)：** 内存表持有每个打开文件\
  \ i-node 的内存中副本。\n\n![](img/Figure-2.1.jpg)\n\n**图 2.1:** 文件的内核数据结构\n\n每当在任何进程中打开一个文件时，文件表中就会创建一个相应的条目，文件的\
  \ i-node 表条目被复制到 v-node 表，并在进程级文件描述符表中创建一个条目。当进程关闭文件时，内核会删除该条目（该条目从进程级文件表中引用该文件），并减少内核文件表中的引用计数。如果引用计数变为零，内核文件表条目将被删除，文件被关闭。\n\
  \n当进程被 fork 时，会创建其父进程进程级文件表的副本。父进程和子进程共享同一个文件指针。\n\n另一方面，同一个文件可以被同一个进程或不同进程多次打开。在这种情况下，每次打开都会在全局文件表中产生不同的条目。这些条目中的每一个都有自己的当前指针。关闭其中一个对其他的没有影响。\n\
  \n## UNIX 文件 I/O 的系统调用\n\nUNIX 提供了基本文件 I/O 的系统调用，例如打开、创建、关闭以及读/写操作。\n\n内核通过文件描述符引用所有已打开的文件。文件描述符是分配给操作系统所有已打开文件的唯一整数。当打开一个现有文件时，或创建一个新文件时，内核会向进程返回一个文件描述符。该文件描述符进一步用于读、写等文件操作。\n\
  \n### open 函数\n\n`open()` 用于读写方式打开现有文件。如果文件不存在，它还会创建一个新文件用于后续的文件操作。\n\n**原型：**\n\
  \n`open` 函数的语法如下：\n\n`int open (char*pathname, int oflag, int mode);`\n\n如果文件打开成功，`open`\
  \ 函数返回该文件的文件描述符。（如果失败，返回值为 1。）所有其他系统调用使用文件描述符（而不是名称）来引用文件。\n\n第一个参数是要打开的文件名。`oflag`\
  \ 包含以下位标志，用于指示打开文件的方式：\n\n* `O_RDONLY`:仅读打开。\n* `O_WRONLY`:仅写打开。\n* `O_RDWR`:读写打开。\n\
  * `O_APPEND`:追加模式打开（将指针初始化到文件末尾而不是开头）。\n* `O_CREAT`:如果文件不存在则创建它。\n* `O_TRUNC`:如果文件存在且以写或读写方式打开，则将其长度截断为\
  \ 0。\n\n第三个参数仅在创建文件时使用。它用于设置新文件的权限位。\n\n**示例**\n\n```c\n#include <stdio.h>\n#include\
  \ <sys/types.h>\n#include <sys/stat.h>\nStatic char msg = \"greeting message\";\n\
  int main()\n{\n    int fd;\n    char buffer[80];\n    fd = open(\"dfile.dat\", O_RDWR\
  \ | O_CREAT | O_EXCL | S_IREAD S_IWRITE);\n    if (fd != -1)\n    {\n    printf(\"\
  datafile opened\\n\");\n    write(fd,msg,sizeof(msg))\n    close(fd);\n    }\n \
  \   else\n    printf(\"data file already exists\");\n    exit(0);\n}\n```\n\n\n\n\
  \n在给出的示例中，创建了一个文件来写入问候消息。如果文件已经存在，则将打印已存在的消息或数据文件。\n\n### `close` 函数\n\n当文件不再需要时，进程会关闭文件。关闭文件会释放进程可能对该文件持的所有锁。内核会减少文件表中该文件的引用计数。如果引用计数达到\
  \ 0，则内核将释放文件表项，并释放在打开文件时分配的内核内存。\n\n当进程终止时，内核会自动关闭该进程中所有打开的文件。\n\n### 原型\n\n`close`\
  \ 函数的语法如下：\n\n```\nint close(int fd);\n```\n\n其中 `fd` 是文件的描述符。成功时返回 `0`，错误时返回 `-1`。\n\
  \n### `creat` 函数\n\n`creat()` 系统调用在文件系统中创建一个新的空文件。它会创建一个文件表项。如果已存在同名文件，内核将根据适当的访问权限释放所有数据块并将文件大小设置为\
  \ 0。内核会为新创建的文件分配一个新的 I-node，并在其父目录中创建一个条目。\n\n### 原型\n\n```\nint creat(char*pathname,\
  \ int mode);\n```\n\n### 等同于：\n\n```\nopen(pathname, O_RDWR | O_CREAT | O_TRUNC,\
  \ mode);\n```\n\n`creat` 函数以仅写模式打开新创建的文件。它设置并返回第一个未使用的文件描述符。如果失败，返回 -1。\n\n## 示例\n\
  \n```\n#include <stdio.h>\n#include <sys/types.h>\n#include <sys/stat.h>\n\nint\
  \ main()\n{\n    int fd;\n    fd = creat(“datafile.dat”, S_IREAD | S_IWRITE);\n\
  \    if(fd != -1)\n    {\n        printf(“datafile.dat opened for read/write access\\\
  n”);\n    }\n    else\n    printf(“Error in opening datafile.dat\\n”);\n    close(fd);\n\
  \    exit(0);\n}\n```\n\n在给出的示例中，同时创建了一个可读可写的文件。如果文件已以同名存在，它会打印消息 `File already\
  \ exists`。一旦文件创建，就会将消息 `File programming in C` 写入其中。在下一步中，文件指针被设置为文件的开头，并执行读取操作。它检查读取的内容是否与消息一致；如果是，则打印该消息；否则打印错误消息。\n\
  \n### `read` 函数\n\n`read` 系统调用用于从已打开的文件读取数据。如果读取成功，则写入读取的字节数。如果遇到文件末尾，则写入 0。要从文件开始读取，内核会设置各种\
  \ I/O 参数，如 I/O 模式、指示 I/O 将进入用户地址空间的标志、指示要读取字节数的计数字段、用户数据缓冲区的目标地址，以及指示 I/O 应从文件中开始的字节偏移量字段。\n\
  \n### 原型\n\n```\nssize_t read(int fd, void *buff, size_t nbytes);\n```\n\n## 示例\n\
  \n```\n#include <cntl.h>             /* 定义选项标志 */\n#include <sys/types.h>      \
  \   /* 定义 sys/stat.h 使用的类型 */\n#include <sys/stat.h>           /* 定义 S_IREAD & S_IWRITE\
  \ */\nstatic char message[] = “File programming in C”;\nint main()\n{\n    int fd;\n\
  \    char buffer[80];\n    fd = open(“datafile.dat”,O_RDWR | O_CREAT | O_EXCL, S_IREAD\
