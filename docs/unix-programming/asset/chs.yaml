  \n```bash\necho {$var}man\n{bat}man\n```\n\n## 反斜杠 (xhtml_s221)\n\n反斜杠用于引用单个字符。当单个字符紧跟在反斜后面后面，分配给该字符的任何特殊含义都被忽略。\n\
