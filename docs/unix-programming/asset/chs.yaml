  \ AKTU 的 CS、IT 和 MCA 课程学习委员会成员。她在国际会议和 TEQIP 项目期间进行过多次演讲。她作为分会顾问和管理委员会成员，为 IEEE\
  \ 和印度计算机学会等国家和国际专业机构做出了贡献。她连续四年担任 AICTE 和人力资源开发部（印度政府）发起的“智慧印度黑客松”（SMART INDIA HACKTHON）评审。她过去几年的研究工作集中在信息安全和算法的不同方面。简要研究领域包括密码学、数字水印、视觉密码学、隐写术、多维数据结构和电子治理项目。\n\
