  \ –l | tee`\n    1. `tee` 命令的输入来自哪里？\n    2. 将创建多少个输出文件？\n\n环境变量由你的 shell 管理。环境变量与普通\
  \ shell 变量（`6.8`）的区别在于，shell 变量是局限于特定的 shell 实例（例如 shell 脚本）的，而环境变量会被你启动的任何程序（包括另一个\
  \ shell）“继承”（`38.4`）。这意味着，新进程将获得这些变量的副本，它可以读取、修改并反过来将其传递给自己的子进程。事实上，每个 UNIX 进程（而不是仅仅\
  \ shell）都会将其环境变量传递给它的子进程。\n\n# 第 8 章\n\n## 使用 Bourne Shell 进行 Shell 编程\n\nUNIX 操作系统已成为应用开发的标准操作系统。UNIX\
  \ 操作系统的本质在于其高效的应用开发环境。UNIX 的强大之处在于它拥有包含 200 多个命令的长长而复杂的列表，以及这些命令可以组合以 shell 脚本的形式执行更有用功能的方法。\n\
  \nshell 仅接受用户命令并将其转换为系统可理解的形式。shell 还提供了基础编程概念，用于通过决策控制脚本和函数的执行。\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n\
  \n* shell 简介\n* UNIX shell 的用途\n* 编写 shell 脚本\n* 理解 shell 编程中使用的基本命令\n* 如何在 shell\
  \ 编程中使用控制命令控制逻辑流\n\n## 目标\n\n读完本章后，你将能够学习：\n\n* shell 作为编程语言的高级概念\n* shell 的特性和执行模式\n\
  * shell 编程约定\n* shell 编程中的控制命令\n\n## shell 编程简介\n\nshell 仅仅是一个作为 UNIX 接口的程序。shell\
  \ 通常被称为命令解释器，因为它允许系统理解用户的命令。系统提供了几种 shell，每种都有不同的特性，但它们都会影响命令的解释方式。shell 提供了创建 UNIX\
  \ 环境的工具。shell 功能包括控制流原语、变量和字符串替换以及参数传递。\n\nshell 处理通常分五个步骤执行，正如上一章讨论的。这些步骤的细节将在接下来的章节中讨论。\n\
  \n## 编写 shell 脚本\n\nshell 脚本用于自动化需要定期执行的任务。系统管理员广泛使用 shell 脚本。shell 脚本节省了时间，因为你不需要每次输入命令，只需将其存储在文件中作为\
  \ shell 脚本并运行即可。\n\n可以直接在终端上编写 shell 脚本，如下所示：\n\n```bash\n$ ls –l |wc –l\n```\n\n\
  我们可以通过如 `vi` 等编辑器创建一个包含一系列 shell 命令的脚本并写入文件，从而编写 shell 程序。稍后可以用 shell 执行该文件。\n\n\
  ```bash\n$vi my.sh\n```\n\n我们还需要通过使用 `chmod` 在文件上设置正确的位来指定该脚本是可执行的：\n\n例如：\n\n```bash\n\
  $ chmod +x my.sh\n```\n\n然后我们可以在 shell 提示符上如下执行它：\n\n```bash\n$ my.sh\n```\n\n或者\n\
  \n```bash\n$./my.sh\n```\n\n以下是一个简单 shell 脚本的示例：\n\n```bash\n$vi my.sh\n#my.sh\n\
  echo “My first shell script”\necho “Hello $LOGNAME”\necho “Date is `date`”\n$chmod\
  \ +x my.sh\n$my.sh\n```\n\n我的第一个 shell 脚本：\n```\nHello usha\nDate is Wed Feb 22\
  \ 10:11:37 IST 2006\n```\n\n从第一个 shell 脚本中我们我们：\n\n* 在脚本中，`#` 表示从该处到行尾的注释。\n* `LOGNAME`\
  \ 是一个环境变量，`$LOGNAME` 是访问它的值。\n* 我们可以使用反引号（如 `date`）通过命令替换来替换命令的输出。这里执行了 date 命令，其值被替换在\
  \ echo 输出中。\n\n## 变量\n\n与所有的编程语言一样，shell 也允许将值存储在变量中。我们可以在 shell 中创建自己的变量并赋值。按照惯例，shell\
  \ 变量名以字母或下划线（`_`）开头，后跟零或多个字母数字值或下划线字符。\n\n```bash\n$param=value\n```\n\n其中 `value`\
  \ 是任何有效字符串并可以包含在引号内。存储在 shell 变量中的值可以使用 `echo` 命令显示。shell 使用 `$` 符号跟随变量名来替换其值，例如：\n\
  \n```bash\n$ echo $param\n```\n\n多个变量的值可以同时被替换：\n\n```bash\n$ echo $param $count\n\
  ```\n\n在这种情况下， shell 替换 param 的值然后执行 echo 命令。\n\nshell 变量一旦声明，就可以在命令行的任何地方使用：\n\n\
  ```bash\n$ my_dir=/users/home\n$ ls $my_dir\n```\n\n在前面的示例中，`ls` 命令通过变量 `my_dir`\
  \ 显示 `/users/home` 的内容。\n\nshell 变量也可以存储命令名作为值：\n\n```bash\n$ my_command=cp\n$ $my_command\
  \ file1 file2\n```\n\n在前面的示例中，shell 首先用 `cp` 替换 `my_command`，然后执行 `cp` 命令将 `file1`\
  \ 复制到 `file2`。\n\n如果我们尝试在没有赋值的情况下显示变量， shell 不会给出错误消息；相反，它会显示为空：\n\n```bash\n$ $var\n\
  ```\n\n以下是显示不同 shell 变量值的示例：\n\n```\nCommand: $day=”Monday”\n$echo $day\nOutput:\
  \ Monday\n\nCommand: $ day=‘date +%a‘\n$ echo $day\nOutput: Wed\n```\n\n参数赋值后，使用\
  \ `$param` 或 `${param}` 写法访问参数的当前值。\n\n赋值时需要注意以下点：\n\n* 等号前后不允许有空格。\n* 在 shell 中，编程值不像其他编程语言那样绑定数据类型。无论赋值什么类型的值，shell\
  \ 变量的值始终被视为字符串。如果给变量赋值为 12，它被视为字符串 12，而不是整数 12。\n* 与其他编程语言一样，shell 变量在使用之前不需要声明，因为它的值没有绑定数据类型。\n\
  \n## 注释\n\n\n\n\n关于注释的细节在上一章中已经讨论过，作为传统的编程语言，shell 提供在程序内部编写备注的方法。提供了一个特殊符号 `#`\
  \ 来编写注释。每当在程序中遇到 `#` 时，## 之后到行尾的单词都被视为注释。如果 `#` 开头，则整行被视为注释。\n\n```bash\n## this\
  \ line is to write remarks\n```\n\n```bash\ncp $file1 $file2\n```\n\n```bash\n##\
  \ Test for the correct argument\n```\n\n# 引号 (xhtml_s21a)\n\n字符串通过引号来控制 shell 解析字符串内任何参数或变量的方式。单引号（'\
  \ '）和双引号（\" ）可用于引用字符串。\n\n## 单引号\n\n单引号用于将原本被空格分隔的单词保持在一起。单引号也用于保留空格。如果特殊字符被包含在单引号内部，shell\
  \ 将忽略所有它们。\n\n例如，让我们考虑一个文件 `per_data`：\n\n```bash\ncat per_data\nJohn miller 34\
  \ graduate\nBill Geirge 45 graduate\nJohn Gates 50 graduate\n```\n\n在文件 `per-data`\
  \ 中搜索模式 Bill。\n\n```bash\ngrep Bill per_data\nOutput : Bill Geirge 45 graduate\n\
  ```\n\n如果搜索字符串是 John，那么：\n\n```bash\ngrep John per_data\n```\n\n上一个命令的输出将是：\n\n\
  ```bash\nJohn miller 34 graduate\nJohn Gates 50 graduate\n```\n\n但如果需要专门查找 Bill\
  \ Gates，那么：\n\n命令是：\n\n```bash\ngrep Bill Gates per_data\n```\n\n输出是一个错误。\n\n```\n\
  grep can’t open Gates\n```\n\n`grep` 命令将第二个单词视为文件名。要搜索包含两个或多个单词的模式，搜索模式必须包含在单引号中。\n\
