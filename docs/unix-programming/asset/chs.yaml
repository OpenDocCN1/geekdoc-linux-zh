  \n双引号的作用与单引号类似，但它不会忽略美元符号、反引号和反斜杠字符。\n\n例如，让我们使用赋值为值 `bat` 的变量 var，以及常量字符串 man。如果我想将这些组合以得到结果\
  \ batman，可能会尝试：\n\n```bash\n$varman\n```\n\n但这行不通，因为 shell 将尝试评估一个名为 `varman` 的变量，而该变量并不。为了得到想要的结果，我们需要通过引用或使用花括号\
  \ ({}) 隔离变量来实现，例如：\n\n```bash\n“$var”man - 引用变量\n$var””man - 分隔参数\n$var”man” - 引用常量\n\
