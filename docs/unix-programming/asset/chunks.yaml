    # [Sending a signal to processes](#toc.xhtml_s87a)


    The kill system call is used to send a signal from one process to another process
    or to itself. To send a signal, the sending process and receiving process must
    have the same effective user ID, or sending process must be a superuser.


    **Prototype:**


    `int kill(int pid, int sig);`


    If **`pid`** argument is **`0`**, signal is sent to all processes in the group.
    If **`pid`** argument is **`–1`** and the user is not a superuser, the signal
    is sent to all processes whose real user ID is the same as the effective user
    ID of the sending process. If **`pid`** argument is **`–1`** and the user is superuser,
    the signal is sent to all processes except system processes. If **`pid`** argument
    is negative but not **`–1`**, then the signal is sent to all processes whose process
    group ID equals the absolute value of **`pid`**. If **`pid`** argument is **`0`**,
    error checking is done, but no signal is sent.


    Another way of sending signals to processes is to use a certain keypress that
    is interpreted as a request to send a signal to the running process. A few examples
    are as follows:


    *   **Ctrl + C:** Pressing *C* on the keyboard with the *Ctrl* key causes the
    system to send an INT signal (SIGINT) to the running process. By default, this
    signal causes the process to terminate immediately.


    *   **Ctrl + Z:** Pressing *Z* with *Ctrl* key causes the system to send a TSTP
    signal (SIGTSTP) to the running process. By default, this signal causes the process
    to suspend execution.


    *   **Ctrl + \:** Pressing *\* with *Ctrl* key causes the system to send an ABRT
    signal (SIGABRT) to the running process. By default, this signal causes the process
    to terminate immediately. Note that this redundancy (that is, *Ctrl + \* doing
    the same as *Ctrl + C*) gives us some better flexibility. We will explain that
    later on.


    The **`kill`** command is also used for sending signals to processes. The **`kill`**
    command accepts two parameters: a signal name (or number) and a process ID.


    `kill -<signal> <PID>`


    For example, in order to send the **`INT`** signal to process with PID 5342, type:


    `kill -INT 5342`


    This has the same effect as pressing *Ctrl-C* in the shell that runs that process.
    If no signal name or number is specified, the default is to send a TERM signal
    to the process, which normally causes its termination.


    Some hardware conditions also cause signals. For example, floating-point error,
    referencing an address outside a process, the specific hardware condition, and
    corresponding signals that they generate are different in different UNIX implementations.


    # [Signal handling](#toc.xhtml_s88a)


    The Kernel has a default action corresponding to each signal. The process can
    handle most of the signals in a customized way by writing code in the program.
    This custom piece of code is called signal handlers.


    Two signals are unable to be redefined by a signal handler. SIGKILL always stops
    a process, and SIGSTOP always moves a process from the foreground to the background.
    These two signals cannot be caught by a signal handler.


    The **`signal()`** system call is used to set a signal handler for a single signal
    type. **`signal()`** accepts a signal number and a pointer to a signal handler
    function and sets that handler to accept the given signal.


    **Prototype:**


    `void (*signal(int sig, void (*func)(int)))(int);`


    The first argument sig is the name of the signal. The value of the second argument
    is either **`SIG_DFL`** or **`SIG_ING`** or the address of the signal handler.
    SIG_DFL is used to specify the default handling of the signal, and **`SIG_ING`**
    is used to ignore the signal.


    **Example:** In the given example, after printing the message `press del key`,
    an endless for loop will be executed, but as soon as *del* key is pressed, an
    interrupt signal SIGINT will be sent to the handler function **`sig_handle`**.
    The function will print the message `DEL key is pressed`, and the program will
    be terminated.


    `#include <signal.h>`


    `void sig_handle();`


    `void main()`


    `{`


    `printf(“press del key\n”);`


    `signal(SIGINTSIDINT, sig_handle);`


    `for(;;);`


    `}`


    `void sig_handle()`


    `{`


    `printf(“ DEL key is pressed\n”);`


    `}`


    *[Table 3.2](#c03.xhtml_tab3_2)* shows all possible values of signals for the
    first parameter of the **`signal()`** system call. These signals are handled either
    by the signal handler mentioned as the second parameter of the **`signal()`**
    system call or by the system if the handler is not mentioned.


    | **Signal** | **Description** |


    | SIGALRM | A process can set an alarm clock by calling the alarm call.Unsigned
    int alarm (unsigned int sec).The sec argument specifies the number of seconds
    to elapse before the Kernel is to send the process a SIGALRM signal. If the argument
    is zero, any previous alarm clock for the process is canceled. The sleep function
    usually sets a SIGALRM signal, which it catches. |


    | SIGINT | This interrupt signal is usually generated when the interrupt key is
    pressed on the terminal. |


    | SIGILL | This signal is generated by an implementation-dependent hardware condition.
    |


    | SIGUSR1 | There are two user-defined signals that can be used to communicate
    between processes. |


    | SIGUSR2 | Same as SIGUSR1. |


    | SIGXFSI | This signal is generated if the process exceeds its file size limit.
    |


    | SIGXCPU | If the process exceeds its soft CPU time limit, this signal is generated.
    |


    | SIGTERM | This is the termination signal sent by the kill command. |


    | SIGPWR | This signal is generated at the time of power failure. The system continues
    running if battery power is available. |


    | SIGPIPE | This signal is generated if the writer process continues writing on
    the pipeline and the reader process is terminated. |


    | SIGQUIT | This signal is generated by the terminal driver when `Ctrl \` key
    is pressed. This signal is sent to all foreground processes. |


    | SIGTSTP | The terminal driver generates this interactive stop signal when `Ctrl+D`
    is pressed. This signal is sent to all foreground processes. |


    | SIGSTOP | The terminal driver generates this signal to stop all foreground processes.
    This signal cannot be caught and ignored. |


    | SIGORG | This signal specifies the process that an urgent condition has occurred.
    |


    | SIGCHLD | This signal is sent to the parent process when the process stops.
    Usually, this signal is ignored, so the parent must catch the signal if it wants
    to be notified whenever a child’s status changes. |


    | SIGIO | This signal occurred at the time of asynchronous IO. |


    | SIGSYS | This signal indicates an invalid system call. |


    **Table 3.2:** Signal and their descriptions


    # [Thread](#toc.xhtml_s89a)


    A thread is a lightweight process. The threads have different execution states,
    and multiple threads share their states. Multiple threads can write and write
    the same memory area, whereas different processes cannot access the same memory
    area. Each thread still has its own registers and has its own stack, but other
    threads can read and write the stack memory.


    Typically a process can be viewed as follows:


    Process = Thread + Code, Data and Kernel Context


