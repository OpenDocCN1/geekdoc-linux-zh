    # Opening a stream


    The `fopen()` function is used to open the file whose name is given in the string
    pointed to by `pathname` and associates a fully buffered stream with it. It also
    clears the error and end-of-file indicators for the stream.


    ### Prototype

    ```c

    FILE * fopen ( const char *path , const char * mode );

    ```


    The `freopen()` function first attempts to flush the stream and close any file
    descriptor associated with a stream, but the success or failure to flush or close
    the file descriptor is ignored. It clears the error and end-of-file indicators
    for the stream.


    The `freopen()` function opens the file whose name is in the string pointed to
    by `pathname` and associates the stream pointed to by `stream` with it. The `mode`
    argument shall be used just as in `fopen`.


    ### Prototype

    ```c

    FILE * freopen ( const char *path , const char *mode , FILE * stream );

    ```


    The `fdopen()` function associates a stream with a file descriptor.


    ### Prototype

    ```c

    FILE * fdopen ( int fildes , const char * mode );

    ```


    Following are the different modes to open a stream:


    | Mode | Description |

    | :--- | :--- |

    | R | Opens file for reading |

    | r+ | Opens for reading and writing |

    | W | Truncates file to zero length or creates text file for writing |

    | w+ | Opens for reading and writing. The file is created if it does not exist;
    otherwise, it is truncated. |

    | a | Opens for writing. The file is created if it does not exist. |

    | a+ | Opens for reading and writing. The file is created if it does not exist.
    |


    **Table 2.1:** Stream opening modes


    Following are the restrictions on opening a stream:


    | Restriction | r | w | a | r+ | w+ | a+ |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | File must already exist | x | | | x | | |

    | Previous contents of file are discarded | | x | | | x | |

    | Stream can be read | x | | | x | x | x |

    | Stream can be written | | x | x | x | x | x |

    | Stream can be written only at end | | | x | | | x |


    **Table 2.2:** Opening restrictions on a stream


    # Closing a stream


    The `fclose()` function closes a file and disassociates the named stream from
    it. If the stream was being used for output, any buffered data is written first,
    using `fflush(3)`. If the standard library had automatically allocated a buffer,
    that buffer is released.


    ```c

    int fclose (FILE * stream);

    ```


    # Reading and writing a stream


    Once a stream is opened, three different types of unformatted I/O can be performed:


    *   Character-at-a-time: Read and write one character at a time, with the standard
    I/O functions handling all the buffering (if the stream is buffered).

    *   Line-at-a-time: To read or write a line at a time using `fgets(3)` and `fputs(3)`
    functions. Each line is terminated with a newline character.

    *   Direct: The `fread(3)` and `fwrite(3)` functions read or write some number
    of objects, respectively, where each object is of specified size.


    # Reading one character at a time


    The following are the prototypes for reading a character:


    ```c

    int fgetc ( FILE * stream );

    int getc ( FILE * stream );

    int getchar ( void );

    int getw ( FILE * stream );

    ```


    Here, `fgetc()` function takes the next input character (if present) from the
    stream pointed at by the `stream` argument or the next character pushed back on
    the stream via `ungetc(3)`. `getw()` takes the next int (if present) from the
    stream pointed at by `stream`.


    # Writing one character at a time


    The following are the prototypes for writing a character:


    ```c

    int fputc ( int c, FILE * stream );

    int putc ( int c, FILE * stream );

    int putchar ( int c);

    int putw ( int w, FILE * stream );

    ```


    `fputc()` writes one character (converted to an unsigned char) to the output stream
    pointed to by a `stream` such as a monitor. It may evaluate the stream more than
    once, so arguments given to `putc()` should not be expressions with potential
    side effects. `putw()` writes the specified integer to the named output stream.


    # Reading one line-at-a-time


    The following are the prototypes for reading a line:


    ```c

    char * fgets ( char *str , int size , FILE * stream );

    char * gets ( char * str );

    ```


    The `fgets()` and `gets()` functions are used to read line from the `stdin` or
    specified stream, respectively, into the buffer.


    # Writing one line at a time


    The following are the prototypes for writing a line:


    ```c

    int fputs ( const char *str , FILE * stream );

    int puts ( const char * str );

    ```


    The `fputs()` and `puts()` are used to write the string pointed to by `str` to
    the stream and `stdout`, respectively.


    # Direct I/O


    Direct I/O functions are used to read and write objects from/on the `FILE *stem`
    object. The size of the object is given by the `size` parameter.


    ### Prototypes

    ```c

    size_t fread ( void *ptr , size_t size , size_t objs , FILE * stream );

    size_t fwrite ( const void *ptr , size_t size , size_t objs , FILE * stream );

    ```


    Here, `fread()` reads a number of objects from the stream pointed to by `stream`
    and stores them at the location given by `ptr`. The size of each object read is
    given by `size_t` in bytes.


    `fwrite()` writes the objects stored at the location pointed to by `ptr` to the
    stream pointed to by `stream` argument.


    # Standard data files


    UNIX maintains some standard data files to store data to manage users’ file access
    permissions. These files can only be accessed with root privileges. These files
    contain information corresponding to each user, group, and life span of the password.
    All these files are stored `in/etc` directory.


    # /etc/passwd file


    The `/etc/passwd` file is an ASCII file that contains an entry for each user.
    Each entry defines the basic attributes applied to a user. The `/etc/passwd` file
    is updated when a new user is added to the system using `mkuser` command.


    An entry in the `/etc/passwd` file has the following form: Attributes in an entry
    are separated by a colon.


    `Name:Password:UserID:PrincipleGroup:Gecos:HomeDirectory:Shell`


    The attributes are defined as follows:


    | Attribute | Description |

    | :--- | :--- |

    | Name | Specifies the user’s login name. The login name must be a unique string
    of 8 bytes or less containing numerals and special characters. |

    | Password | An `x` character indicates that the encrypted password is stored
    in `/etc/shadow` file. |

    | UserID | Specifies the user’s unique numeric ID. The User ID is a decimal integer.
    |

    | PrincipleGroup | Specifies the user’s principal group ID. This must be the numeric
    ID of a group in the user database or a group defined by a network information
    service. The value is a unique decimal integer. |

    | Gecos | Specifies general information about the user that is not needed by the
    system. |

    | HomeDirectory | Specifies the full pathname of the user’s home directory. If
    the user does not have a defined home directory, the home directory of the guest
    user is used. The value is a character string. |

    | Shell | Specifies the initial program or shell that is executed after a user
    invokes the `login` command or `su` command. If a user does not have a defined
    shell, `/usr/bin/sh`, the system shell, is used. The value is a character string
    that may contain arguments to pass to the initial program. |


    **Table 2.3:** File attributes with description


    # /etc/group file


    The `/etc/group` file is an ASCII file that contains records for system groups.
    Each entry contains basic group attributes. Each entry has the following format:


    `Name:Password:ID :User-List`


    Attributes are separated by a colon. Records are separated by newline characters.


    | Attribute | Description |

    | :--- | :--- |

    | Name | Specifies a group name that is unique on the system. The name is a string
    of 8 bytes or less. |

    | Password | Not used. |

