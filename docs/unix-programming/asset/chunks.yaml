    \ that gets executed when the user logs in. Regular UNIX commands can also be\
    \ included in the .profile. Modifying .profile makes a customized UNIX environment\
    \ for the user.\n\n**Note: .profile is not shown in the listing of files and directories\
    \ in the home directory because it is a hidden file. To list it, ls –a command\
    \ is used.**\n\n# [Conclusion](#toc.xhtml_s207a)\n\nThe shell is an important\
    \ component of the UNIX operating system. Users can interact with Kernel through\
    \ the shell. It acts as a command interpreter for the UNIX Kernel. In addition\
    \ to command interpretation, the UNIX shell also provides programming capabilities\
    \ in the form of shell scripts. Most of the system administration tasks are performed\
    \ using shell scripts. The shell also controls environment variables. This chapter\
    \ discusses all possible features and functions of the UNIX shell. The next chapter\
    \ includes the details about shell programming constructs and writing shell script\
    \ in detail. The details contains the logics, control and other commands used\
    \ to develop programs to solve problems using shell script writing.\n\n# [Test\
    \ your skills](#toc.xhtml_s208a)\n\n1.  **Which of the following command displays\
    \ the login shell?**\n\n    1.  $SHELL\n\n    2.  $0\n\n    3.  Echo $SHELL\n\n\
    \    4.  Echo $0\n\n2.  **Which of the following command displays the current\
    \ shell?**\n\n    1.  $SHELL\n\n    2.  $0\n\n    3.  Echo $SHELL\n\n    4.  Echo\
    \ $0\n\n3.  **What is the descriptor of standard output stream?**\n\n    1.  0\n\
    \n    2.  1\n\n    3.  2\n\n    4.  3\n\n4.  **What is the descriptor of standard\
    \ input stream?**\n\n    1.  0\n\n    2.  1\n\n    3.  2\n\n    4.  3\n\n5.  **What\
    \ is the descriptor of standard error stream.**\n\n    1.  0\n\n    2.  1\n\n\
    \    3.  2\n\n    4.  3\n\n6.  **Which of the following command creates the Bash\
    \ subshell?**\n\n    1.  Bash\n\n    2.  bsh\n\n    3.  Csh\n\n    4.  None of\
    \ the above\n\n7.  **Assuming that dat_file is a text file, what is the error\
    \ (if any) in each of the following commands?**\n\n    1.  Date | dat_file\n\n\
    \    2.  Dat_file | date\n\n# [Answers](#toc.xhtml_s209a)\n\n1.  **e**\n\n2. \
    \ **a**\n\n3.  **b**\n\n4.  **a**\n\n5.  **c**\n\n6.  **a**\n\n7.  **b**\n\n#\
    \ [Review Exercises](#toc.xhtml_s210a)\n\n1.  Put a listing of the files in your\
    \ directory into a file called filelist. (Then delete it!)\n\n2.  Create a text\
    \ file containing a short story, then use the spell program to check the spelling\
    \ of the words in the file.\n\n3.  Redirect the output of the spell program to\
    \ a file called errors.\n\n4.  Type the command ls -l and examine the format of\
    \ the output. Pipe the output of the command ls -l to the word count program wc\
    \ to obtain a count of the number of files in your directory. Create your own\
    \ bin subdirectory in your home directory and make it part of the search PATH.\n\
    \n5.  Explain why we cannot use input indirection with cal, date, man, and which\
    \ commands.\n\n6.  Explain why we cannot use output indirection with the echo\
    \ command?\n\n7.  If we use the following commands in sequence: Command 1 | Command2\n\
    \n    1.  What is the necessary requirement for Command1?\n\n    2.  What is the\
    \ necessary requirement for Command2?\n\n8.  One of the following commands works,\
    \ and the other does not. Which one works, and what is the problem with other\
    \ commands?\n\n    1.  date | more\n\n    2.  more | date\n\n9.  Can we use input\
    \ indirection with vi command?\n\n10.  Briefly explain the concept of pipelining\
    \ here or give reference to the earlier chapter (if it has already been explained)\
    \ before proceeding with the commands.\n\n# [Lab practice](#toc.xhtml_s211a)"
