    and small is most likely to be swapped in. To prevent thrashing, processes that
    have not been in the main memory for a certain amount of time are not selected
    for swapping out. Process pages selected for swapping out to the location depending
    on their type. Pages from the data segment are moved to swap space, pages from
    the stack segment are moved to swap space, and pages from the mapped file are
    moved to the originating file if changed and shared. The pages from the mapped
    file are moved to swap space if changed and private. If pages from mapped files
    are unchanged, they are discarded.


    # [Demand paging](#toc.xhtml_s157a)


    Demand paging is a paging policy in which a page is not read into the memory until
    it is requested. Demand paging transfers only required memory pages instead of
    a process to and from a secondary device.


    The Kernel implements a page table to achieve demand paging. Page table converts
    logical page address to physical page address. The page table uses a binary flag
    to check the page’s validity. A page is valid if it resides in the main memory
    and invalid if it currently resides in secondary memory. When a process needs
    a page, and the page is not there, a page fault interrupts to the Kernel occurs.
    Kernel checks if page reference is valid in the secondary memory, it schedules
    disk read operation to swap in the demanded page. Once the page is in the main
    memory, it restarts the interrupted instructions.


    **Note: Berkeley introduced demand paging to UNIX with BSD (Berkeley System).**


    Advantages of the demand paging policy are that it permits greater flexibility
    in mapping the virtual address of a process into the physical memory of a machine,
    usually allowing the size of a process to be greater than the amount of availability
    of physical memory and allowing a greater number of processes to fit in the main
    memory simultaneously.


    Disadvantages of the demand paging policy are that a single process may face extra
    latency when a process requires a page first time. More page faults may cause
    thrashing, and the process may face the security risk of a timing attack.


    The mkdir system call


    The **`mkdir()`** function creates a new directory named by the pathname pointed
    to by path.


    **Prototype:**


    `int mkdir(const char *path, mode_t mode);`


    The mode of the new directory is initialized from mode. The protection part of
    the mode argument is modified by the process’s file creation mask.


    The directory’s owner ID is set to the process’s effective user ID. The directory’s
    group ID is set to the process’s effective group ID, or if the **`S_ISGID`** bit
    is set in the parent directory, then the group ID of the directory is inherited
    from the parent. The **`S_ISGID`** bit of the new directory is inherited from
    the parent directory.


    If path names a symbolic link, **`mkdir()`** fails and sets **`errno`** to **`EEXIST`**.


    The newly created directory is empty with the exception of entries for itself
    (.) and its parent directory (..).


    Upon successful completion, **`0`** is returned. Otherwise, **`-1`** is returned,
    no directory is created, and **`errno`** is set to indicate the error.


    The rmdir system call


    The **`rmdir()`** system call removes a directory file whose name is given by
    path. The directory must not have any entries other than “.” and “..”.


    **Prototype:**


    `int rmdir(const char *path);`


    The **`rmdir()`** function returns the value **`0`** if successful; otherwise,
    the value **`-1`** is returned, and the global variable **`errno`** is set to
    indicate the error.


    Before deleting a directory entry, the system checks the link count entry (**`ls
    -l`** command) to identify whether the directory to be deleted is opened by some
    other process or not. The directory is deleted only if the link count of the directory
    is 0 with this call and no other process has the directory open, then the space
    occupied by this directory is freed.


    # [Memory management functions](#toc.xhtml_s158a)


    Memory to the variables can be allocated and freed dynamically.


    # [The malloc() function](#toc.xhtml_s159a)


    **`malloc`** requires one argument - the number of bytes you want to allocate
    dynamically.


    If the memory allocation is successful, **`malloc`** will return a void pointer.
    You can assign this to a pointer variable, which will store the address of the
    allocated memory.


    If memory allocation fails (for example, if you are out of memory), malloc will
    return a NULL pointer.


    # [The free() function](#toc.xhtml_s160a)


    Passing the pointer into **`free`** will releases the allocated memory. It is
    good practice to free memory when you have finished with it.


    `void free(void *ptr);`


    Where **`ptr`** is the pointer.


    Consider the following Example:


    `#include <stdio.h>`


    `#include <stdlib.h>`


    `int main() {`


    `int number;`


    `int *ptr;`


    `int i;`


    `printf(“How many ints would you like store? “);`


    `scanf(“%d”, &number);`


    `ptr = malloc(number*sizeof(int)); /* allocate memory */`


    `if(ptr!=NULL) {`


    `for(i=0 ; i<number ; i++) {`


    `*(ptr+i) = i;`


    `}`


    `for(i=number ; i>0 ; i--) {`


    `printf(“%d\n”, *(ptr+(i-1))); /* print out in reverse order */`


    `}`


    `free(ptr); /* free allocated memory */`


    `return 0;`


    `}`


    `else {`


    `printf(“\nMemory allocation failed - not enough memory.\n”);`


    `return 1;`


    `}`


    `}`


    # [The calloc() function](#toc.xhtml_s161a)


    **`calloc`** is similar to **`malloc`**, but the main difference is that the values
    stored in the allocated memory space are zero by default. With malloc, the allocated
    memory could have any value.


    **`ptr = (cast_type *) calloc (n, size); calloc`** requires two arguments. The
    first is the number of n variables you had like to allocate memory for. The second
    is the size of each variable represented as size. Like **`malloc`**, **`calloc`**
    returns a void pointer **`ptr`** if the memory allocation was successful; else,
    it returns a NULL pointer.


    Consider the following example:


    `#include <stdio.h>`


    `#include <stdlib.h>`


    `int main() {`


    `float *ptr1;`


    `int i;`


    `ptr1 = calloc(3, sizeof(float));`


    `if(ptr!=NULL ) {`


    `for(i=0 ; i<3 ; i++) {`


    `printf(“ptr1[%d] holds %05.5f, “, i, ptr1[i]);`


    `}`


    `free(ptr1);`


    `return 0;`


    `}`


    `else {`


    `printf(“memory not successfully allocated\n”);`


    `return 1;`


    `}`


    `}`


    # [The realloc() function](#toc.xhtml_s162a)


    The **`realloc()`** function is used to change the size of the already allocated
    block of memory without losing data in that memory location.


    `ptr = realloc (ptr,newsize);`


    **`realloc`** takes two arguments. The first is the pointer referencing the memory,
    that is, **`ptr`** whose size is needs to be changed. The second is the total
    number of bytes that needs to be reallocated, that is, **`newsize`**.


    Passing zero as the second argument is the equivalent of calling free, **`realloc`**
    returns a void pointer if successful, else a NULL pointer is returned.


