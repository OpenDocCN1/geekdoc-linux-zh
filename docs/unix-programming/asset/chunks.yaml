  trans: "\n\n1. 用户模式：当用户进程执行时，它是在用户模式下运行。在用户模式下，进程可以访问自己的指令和数据，但无法访问内核指令、数据或其他进程的数据。\n\
    \n2. 内核模式：当用户进程执行系统调用时，进程的执行模式从用户模式切换到内核模式；由内核执行用户的请求。内核模式下的进程可以访问内核地址和用户地址。\n\
    \n# 进程终止\n\n当进程终止时，操作系统会释放所有分配给该进程的资源，更新与进程相关的统计信息，并通知所有进程该进程已终止。UNIX 进程以正常或异常的方式终止。当进程终止时，它会进入僵尸状态（zombie\
    \ state），即它不会释放进程 ID（PID）；而是等待父进程确认进程已终止并释放 PID。\n\n# 正常终止\n\n进程的正常终止是通过从主函数返回或调用\
    \ `exit()` 或 `_exit()` 函数实现的。\n\n`exit()` 函数在退出进程之前会执行一个清理函数。它会关闭所有打开的文件并刷新所有缓冲区。\n\
    \n**原型：**\n\n```\nvoid exit(int status);\n```\n\n`_exit()` 函数在退出之前不执行任何清理操作。\n\
    \n# 异常进程终止\n\n当发生以下一个或多个条件时，进程将异常终止：\n\n* 进程的资源使用超过\n* 任务不再需要\n* 父进程正在退出\n\n导致异常终止的另一个原因是在某些其他进程（尤其是父进程）中调用\
    \ `abort()` 函数。该函数会向调用者发送 SIGABRT 信号。\n\n对于异常终止，内核会生成终止状态。父进程通过使用 `wait()` 系统调用来获取该终止状态。\n\
    \n# 命令行参数和环境变量\n\nC 语言中的 `main()` 函数有两个标准参数 `argc` 和 `argv`，称为命令行参数。`argc` 指定参数的数量，其中命令名本身也算一个参数。\n\
    \n`argv` 是一个指向字符串的指针数组。`argv` 的第一个成员即 `argv[0]` 指向命令名，第二个成员 `argv[1]` 指向命令的第一个参数。\n\
    \n由于 `argv` 的存在，程序可以相当容易地响应用户输入的命令行参数。例如，你可以让程序检测程序名后的第一个参数是否为 `help` 单词，并将帮助文件输出到标准输出（stdout）。文件名也可以传递进来并在你的\
    \ `open` 语句中使用。任何输入都可以作为命令行参数传递，从而避免使用 I/O 语句读取输入。\n\n`envp` 提供了程序的环境变量，以字符串数组的形式表示为\
    \ `VAR=value`。例如 `PATH=/bin;/usr/bin`。数组的最后一个元素是空指针。这使得 C 程序员可以访问 shell 的全局环境。\n\
    \n除了 `envp` 向量，还可以通过调用 `getenv()` 来访问环境变量。使用方法如下；假设我们要访问 shell 环境变量 `$HOME`。\n\
    \n```\nchar *string;\nstring = getenv(\"HOME\");\n```\n\n`getenv()` 获取 `$HOME`\
    \ 变量的值并将其存储在字符串中。\n\n**示例：**\n\n```c\n/* myprog.c*/\n#include <stdio.h>\nint main(int\
    \ argc, char *argv[], char* envp[])\n{\n    int I;\n    printf(\"The program %s\
    \ has %d arguments\\n\", argv[0], argc);\n    printf(\"The first two arguments\
    \ are %s and %s \\n\", argv[1], argv[2]);\n    for (I=0; envp[I]; I++)\n     \
    \   printf(\"%s\\n\",envp[I]);\n}\n```\n\n在给定的示例中，程序的执行方式如下：\n\n```bash\n$myprog\
    \ this is good\n```\n\n输出为：\n\nThe program myprog has 4 arguments\nThe first two\
    \ arguments are this and is\n\n`argc = 4`，而 `argv[0]` 指向 `myprog`，`argv[1]` 指向\
    \ `this`，`argv[2]` 指向 `is`，`argv[3]` 指向 `good`。之后，它显示环境变量。\n\n# UNIX 进程的内存布局\n\
    \n分配给程序的内存区域通常被分为几个子区域，例如：\n\n* **代码区：** 这在 UNIX 中被称为文本区（text area），仅包含程序的可执行代码。如果有多个进程运行同一个程序，仍然只有一个代码区，因为它对所有进程来说都是相同的。文本区通常是只读的，以防止程序修改其指令。\n\
    * **数据区：** 存放程序正在处理的数据。该部分包含已初始化和未初始化的数据变量。\n* **栈区：** 它是自动创建的，其大小在运行时进行调整。它由逻辑栈帧组成，调用函数时压入，返回时弹出。它包含了函数的参数、局部变量和数据。进程有一个用于用户的栈，另一个用于内核的栈。\n\
    * **堆（Heap）：** 虚拟空间的这部分包含了供使用的动态分配变量。\n\n# 设置跳转到另一个函数\n\nC 语言允许跳转到另一个函数 `setjmp`\
    \ 和 `longjmp`。这类跳转应该被视为良好的实践。\n\n**原型：**\n\n```\nint setjmp(jmp_buf env);\nvoid\
    \ longjmp(jmp_buf env, int val);\n```\n\n`setjmp()` 宏将当前环境保存在 `env` 中。该宏会返回多次。第一次返回总是返回\
    \ `0`；第二次（当从 `longjmp()` 返回时，它返回设置的值。让我们看一个例子：\n\n```c\n#include <setjmp.h>\n\
    #include <stdio.h>\njmp_buf ebuf;\nvoid f(void);\nint main(void)\n{\n    int i;\n\
    \    printf(\"1 \");\n    i = setjmp(ebuf);\n    if(i == 0) {\n        f();\n\
    \    }\n    printf(\"%d\", i);\n    return 0;\n}\nvoid f(void)\n{\n    printf(\"\
    2 \");\n    longjmp(ebuf, 3);\n}\n```\n\n在给定的示例中，输出为：\n\n1 23\n\n第一次调用 `setjmp()`\
    \ 时，它向变量 `i` 返回 `0`，控制流跳转到函数 `f()`。在函数 `f()` 中将打印 `2`，并且 `setjmp` 的返回值设置为 `3`，因为它是作为第二个参数传递的。\n\
    \n# 进程状态\n\n进程的生命周期可以通过一组状态来建模，每个进程在任何一点都可以处于任何一个状态。这些状态可以通过图 3.1 所示的状态转换图表示，这是一个有向图，节点表示进程可以进入的状态，边表示导致进程从一个状态移动到另一个状态的事件。\n\
    \n![](img/Figure-3.1.jpg)\n\n**图 3.1:** 进程转换图\n\nUNIX 进程在其生命周期内经历以下不同的状态：\n\n\
    * **执行（Executing）：** 进程在用户和内核两种模式下执行。\n* **就绪（Ready）：** 只要内核调度，进程就准备好执行，或者进程处于辅助内存中的就绪状态。\n\
    * **睡眠（Sleeping）：** 进程在主内存中处于睡眠状态，或者交换器已将进程交换到辅助内存，以在主内存中交换其他进程。\n* **创建（Created）：**\
    \ 进程刚刚创建。它既不在就绪状态，也不在睡眠状态。\n* **僵尸（Zombie）：** 进程刚刚执行了 `exit()` 系统调用。进程不存在了，但留下了退出码。\n\
    \n"
- fmt: "\n* **Returning to Kernel mode:** Process is preempted by Kernel until it\
    \ is scheduling another process.\n\n# Process control block\n\nEach process is\
    \ represented in the operating system by a Process Control Block (PCB). This contains\
    \ information associated with a process such as:\n\n* **Process state:** New,\
    \ running, waiting, and so on.\n* **Program counter:** Indicates the address of\
    \ the next instruction to be executed for this process.\n* **CPU registers:**\
    \ Includes accumulators, index registers, stack pointers, and general-purpose\
    \ registers.\n* **CPU scheduling information:** Like process priority, pointers\
    \ to process scheduling queues, and other scheduling parameters.\n* **Memory management\
    \ information:** Like the value of base and limit registers, page tables.\n* **Accounting\
    \ information:** Like the amount of time for which the CPU is used.\n* **I/O status\
    \ information:** Like a list of I/O devices allocated to this process, a list\
    \ of open files.\n\nThe context of a process includes the value of CPU registers,\
    \ process state, and memory management information. The context of the process\
    \ contains (1) User-Level context, (2) CPU registers, and (3) Kernel level context.\n\
    \nThe user-level context contains the memory layout of the virtual address space\
    \ of the process, such as text, data, user stack, and shared memory.\n\nThe CPU\
    \ registers consist of the following information:\n\n* The **Program Counter**\
    \ contains the address of the next instruction to be executed.\n* The **Program\
    \ Status Register** contains various flags to indicate the result of the recent\
    \ computation, the subfield that shows the current execution mode to determine\
    \ whether the process can run in privileged instructions, and the subfields that\
    \ show the current processor execution level.\n* The **Stack Pointer** points\
    \ to the next free entry or last used in the Kernel or user stack.\n* The **General-Purpose\
    \ Registers** contain intermediate data generated during the execution of the\
    \ process.\n\nThe Kernel-level context of a process contains one static part and\
    \ a variable number of dynamic parts throughout its lifetime. The components of\
    \ system-level context are as follows:\n\n* The **Process Table** entry contains\
    \ state of process and control information.\n* The **u area** contains process\
    \ control information that needs to be accessed only once.\n* **Pregion** entries,\
    \ region table, and page table provide text, data, stack, and other regions of\
    \ the process.\n* **Kernel Stack** contains a stack of Kernel functions when the\
    \ process executes in the Kernel mode. The Kernel stack is empty when the process\
    \ executes in user mode.\n* The **Dynamic part** contains several system-level\
    \ context layers where each layer contains information about the previous layer.\n\
    \n# Process control\n\nProcess control handles all operations related to the process,\
    \ including the creation of the child process, changing context from one process\
    \ to another while executing cooperating or independent processes, and terminating\
    \ the process in a normal and normal manner.\n\n# Process creation\n\nProcesses\
    \ are initiated in UNIX using the `fork()` function. The `fork()` function creates\
    \ one child process identical to the parent, and both parent and child processes\
    \ are running. Both parent and child share the same real and effective user and\
    \ group ID, current working directory, root directory, file creation mask, and\
    \ so on.\n\nThe `fork()` returns the value of the `PID` of the child to the parent,\
    \ and the return value in a child is `0`. Kernel increments file and inode table\
    \ counters for files associated with the process. If the child process cannot\
    \ be created due to (`A`) there are too many processes in the system.\n\n(B) limit\
    \ on the number of processes for real-user ID of the parent process exceeds, then\
    \ return value of parent process is `-1`.\n\nLet us see an example:\n\n```\nmain()\n\
    {\n  int pid;\n  pid = fork();\n  if (pid < 0)\n    printf(\"Fork failed \\n\"\
    );\n  else\n  {\n    if (pid == 0)\n    {\n      printf(\"In child process pid\
    \ is %d \\n\",getpid());\n      printf(\"In child process parents pid is %d \\\
    n\",getppid());\n    }\n    else\n    {\n      printf(\"In parent process pid\
    \ is %d \\n\",getpid());\n      printf(\"In parent process parents parent pid\
    \ is %d \\n\",getppid());\n    }\n  }\n}\n```\n\nFile locks set in the parent\
    \ process are not inherited in the child process. In the given example, if `fork()`\
    \ is successful, it returns either `0` to the newly created child or the process\
    \ ID of the newly created child to the parent process in which `fork()` is called.\
    \ Both the processes execute one after another as scheduled by the CPU. If `fork()`\
    \ is unsuccessful, it returns a negative number.\n\n# Awaiting process termination\n\
    \nThe simple way of a process to acknowledge the death of a child process is by\
    \ using the `wait()` system call. When `wait()` is called, the process is suspended\
    \ until one of its child processes exits, and then the call returns with the exit\
    \ status of the child process. If it has a zombie child process, the call returns\
    \ immediately, with the exit status of that process.\n\nA call to `wait()` function\
    \ does a number of things. A check is made to verify if the parent process has\
    \ any children. If it does not, a -1 is returned by `wait()`. If a parent process\
    \ has a child that is terminated (zombie), the child’s `PID` is returned, and\
    \ it is removed from the process table.\n\nHowever, if a parent process has a\
    \ child or children that have not terminated, the parent process is suspended\
    \ till it receives a signal. The signal is received as soon as the child dies.\n\
    \nThe `wait()` can also tell us in what manner the child process was terminated.\
    \ For this, we need to pass an integer variable to `wait()`. If the process was\
    \ terminated normally, the high order 8 bits of the integer variable passed to\
    \ the `wait()` will be updated, whereas the lower order 8 bits will be initialized\
    \ to `0`.\n\nOn the other hand, if it has been terminated abnormally, the lower-order\
    \ 8 bits are updated, and higher-order 8 bits are initialized to `0`.\n\nIn case\
    \ of a core dump error, the wait returns an integer whose 7th bit is put on.\n\
    \nLet us see an example:\n\n```\n/* example of wait() */\nmain()\n{\n  int i,\
    \ pid, exitstat, status;\n  pid = fork();\n  if (pid == 0)\n  {\n    printf(\"\
    Enter exit stat:\");\n    scanf(\"%d\", &i);\n    exit(i);\n  }\n  else\n  {\n\
    \    wait(&status);\n    if ((status & 0xff) != 0) /* abnormal exit */\n    {\n\
    \      printf(\"Signal interrupted\\n\");\n    }\n    else /* normal exit */\n\
    \    {\n      exitstat = (int) status/256 ;\n      printf(\"Exit status from %d\
    \ was %d\\n\", pid, exitstat);\n    }\n  }\n}\n```\n\nHere in the child process,\
    \ the user enters an exit code, and the process exits with this exit code. The\
    \ parent process receives this exit code in the `status` variable. We can check\
    \ the `status` variable to know the type of exit.\n\n`fork()` creates a duplicate\
    \ of all variables in the child process, so even global variables are duplicated.\
    \ If we change the value in one process, it is not reflected in the other. Even\
    \ the value of location pointed to by pointer variable is different for different\
    \ processes.\n\n# Executing another program\n\nAn existing process can call another\
    \ process by executing exec system call. The process ID of the running process\
    \ does not change because `exec()` function does not create new process rather\
    \ it calls an existing process. The various function prototypes of `exec()` function\
    \ are as follows:\n\n* `int execl(const char *path, const char *arg, …);`\n* `int\
    \ execlp(const char *file, const char *arg, …);`\n* `int execle(const char *path,\
    \ const char *arg,…, char * const envp[]);`\n* `int execv(const char *path, char\
    \ *const argv[]);`\n* `int execvp(const char *file, char *const argv[]);`\n"
