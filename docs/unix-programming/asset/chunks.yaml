  trans: "\n进程之间的通信通过信号和信号量进行同步。C 库函数和系统调用可用于进程间通信。\n\n在 UNIX 环境中，共享信息可以存在于不同的层次。用于共享信息的\
    \ IPC（进程间通信）方法取决于信息所在的位置。根据信息的可用性，对应的 IPC 方法列举如下：\n\n* 如果要共享的信息存在于文件系统中的文件中，则使用如\
    \ `read()`、`write()` 等内核系统调用在进程之间共享信息。在更新文件时，需要进行某些同步操作。\n* 如果信息存在于管道（pipes）、消息队列和信号量中，则使用对应于这些数据结构的内核系统调用在协作进程之间共享信息。\n\
    * 如果信息存在于共享内存中，则两个进程可以直接访问该信息。一旦进程设置了共享内存，通信时就不需要内核的参与。\n* 两个进程可以通过文件系统中的文件来共享信息。使用文件的内核系统调用来访问文件中的信息。在更新文件时，需要进行某些同步操作。\n\
    * 两个进程可以共享存在内核中的信息。使用管道、消息队列和信号量来共享信息。\n* 两个进程可以引用共享内存区域。一旦进程设置了共享内存，两个进程就可以在完全不涉及内核的情况下信息。\n\
    \n![](img/Figure-4.3.jpg)\n\n**图 4.3:** 进程间的信息共享\n\n# 管道与 FIFO\n\n通过管道，一个进程的输出成为另一个进程的输入，如图\
    \ 4.4 所示。一个进程向管道写入数据，同时，另一个进程从管道读取数据。管道在使用之前必须先打开。\n\n`pipe()` 系统调用创建一个管道并返回两个文件描述符，`fd[0]`\
    \ 和 `fd[1]`。`fd[0]` 用于读取，`fd[1]` 用于写入。`pipe()` 成功时返回 `0`，失败返回 `-1` 并相应设置 `errno`。\n\
    \n在标准编程模型中，一旦建立了管道，将通过 `fork` 创建两个（或多个）协作进程，并使用 `read()` 和 `write()` 传递数据。\n\n\
    ![](img/Figure-4.4.jpg)\n\n**图 4.4:** 管道的读写\n\n使用后，应用 `close(int fd)` 关闭管道。\n\n\
    **示例：**\n\n在给定的示例中，使用 `pipe()` 系统调用创建一个管道。父进程在执行时向管道的一端写入消息，子进程从管道的另一端读取相同的消息：\n\
    \n```\nvoid main()\n{\n  int fd[2];\n  pipe(fd);\n  if ( fork() == 0 )\n  { /*\
    \ 子进程*/\n    close(fd[1]);   /* fd[1] 在此进程中未使用*/\n    printf(\"\\n read data from\
    \ parent );\n    read( fd[0]); /* 从父进程读取 */\n  }\n  else\n  {  close(fd[0]); \
    \  /* 在此进程中未使用 */\n    printf(\"\\n Write data to child process\\n\");\n    write(\
    \ fd[1]);\n  }\n  exit(0)\n}\n```\n\n# 一端关闭的管道\n\n如果对写端已关闭的管道执行读操作，读取将返回 0 表示文件结束。\n\
    \n如果对读端已关闭的管道执行写操作，则会产生 SIGPIPE 信号。如果我们忽略它或捕获它并从信号处理程序返回，写操作将返回一个错误，并将 `errno`\
    \ 设置为 EPIPE。\n\n# popen() I/O 库函数\n\n`popen()` 是标准的 I/O 库函数，它创建一个管道并 fork 出另一个进程以从管道中读取或写入数据。\n\
    \n**原型：**\n\n```\nFILE *popen(char *cmd, char *type);\n```\n\n`cmd` 是 shell 命令。函数\
    \ `popen` fork 并执行 `cmd` 命令，并返回一个 FILE 指针，该指针根据字符串类型类型用于输入或输出。\n\n如果 `type` 的值为\
    \ `r`，则调用进程读取命令的标准输出。如果 `type` 的值为 `w`，则调用进程写入命令的标准输入。在失败情况下，`popen()` 返回 NULL。\n\
    \n# pclose() I/O 函数\n\n`pclose()` 函数关闭由 `popen()` 函数创建的 I/O 流。它返回执行命令的退出状态，或者如果流未创建则返回\
    \ -1。\n\n**原型：**\n\n```\nint pclose(FILE *stream);\n```\n\n**示例：**\n\n在给定的示例中，`popen()`\
    \ 函数执行 `who` 命令，并将输出写入由 `fp` 指针指向的文件。`fgets()` 函数读取文件并将数据存储在字符字符串 `user` 中。使用\
    \ `printf()` 打印 `user` 内容。\n\n```\n#include <stdio.h>\nmain()\n{\n  FILE *fp;\n\
    \  char user[130];\n  fp = popen(\"who\", \"r\");\n  while ( fgets(user, sizeof(user),\
    \ fp))\n  {\n    printf(\"%s\", user);\n  }\n  pclose(fp);\n}\n```\n\n# FIFOs\n\
    \nFIFO 即先进先出（First In Out）命名管道。FIFO 允许进程之间进行单向数据流；然而，FIFO 允许无关进程访问。FIFO 是存在于文件系统的文件。\n\
    \n# 创建 FIFO\n\nFIFO 使用 `mknode()` 系统调用创建，该调用通常留给超级用户创建目录项。\n\n**原型：**\n\n```\n\
    int mkfifo(const char *pathname, mode_t node);\n```\n\n其中 `pathname` 是 fifo 的\
    \ UNIX 名称。`mode` 包含文件的打开权限。如果 FIFO 已存在，`mkfifo()` 将返回错误 EEXIST。\n\n**示例：**\n\n\
    在给定的示例中，创建一个具有所有者读写权限的名为 fifo 的 FIFO。如果 FIFO 已存在，则发生异常终止；否则，程序正常终止。\n\n```\n#include\
    \ <stdlib.h>\nmain()\n{\n  int rc;\n  int fifo_fds;\n  char data[100];\n  rc =\
    \ mkfifo(\"fifo\", S_IRUSR | S_IWUSR);\n  if (rc != 0) {\n    perror(\"mkfifo\
    \ failure\");\n    exit(1);\n  }\n  exit(0);\n}\n```\n\n# 使用 FIFO 进行进程间通信\n\n\
    FIFO 是命名管道，与用于父子通信的管道相比，它用于两个协作进程之间的进程间通信。两个相互通信的进程被视为服务器和客户端进程，如图 4.5 所示。\n\n\
    ![](img/Figure-4.5.jpg)\n\n**图 4.5:** 使用 FIFO 进行数据传输\n\n# 服务器进程\n\n在服务器进程中创建并打开\
    \ FIFO 以接受客户端请求。使用 `read` 函数读取客户端请求。\n\n在服务器进程中，FIFO 应以读写模式打开，因为如果客户端终止，服务器的读取将返回\
    \ 0 表示文件结束，服务器必须关闭 FIFO 并再次以 O_RDONLY 模式打开，服务器将阻塞直到下一个客户端请求到达。对于始终以读写模式打开的 FIFO，服务器的读取永远不会返回\
    \ 0。\n\n相反，服务器将阻塞在 `read` 调用中，等待下一个客户端请求。\n"
- fmt: "\nIn the given example, a FIFO with the name `fifo` is created both for reading\
    \ and writing. If `fifo` already exists, it returns an error, and an error message\
    \ `FIFO already exists` will be printed. The server process waits to read a request\
    \ from the client. If the client terminates in between, an error message `read\
    \ failed` will be printed; otherwise, a message from `fifo` will be printed on\
    \ the screen.\n\n```c\n#include <fcntl.h>\n#include <stdio.h>\n#include <errno.h>\n\
    #define MSGSIZ  100\nchar *fifo = “fifo”;\nint main(int argc, char **argv){\n\
    \  int fd;\n  char msg_buf[MSGSIZ+1];\n  if (mkfifo(fifo, 0666) == -1){\n    if\
    \ (errno != EEXIST)\n    printf(“\\n FIFO already exists \\n”);\n    }\n    if\
    \ ((fd = open(fifo, O_RDWR)) < 0)\n    printf (“\\nfifo open failed\\n”);\n  \
    \  for(;;)\n    {\n    if (read(fd, msg_buf, MSGSIZ+1) <0)\n    printf (“\\n message\
    \ read failed \\n”);\n    printf (“message received:%s\\n”, msgbuf);\n    }\n\
    \  }\n  exit(0);\n}\n```\n\n# Client process\n\nFIFO created in server process\
    \ is opened in client process in `O_WRONLY` mode. The server’s reply is read from\
    \ the FIFO and written to standard output. The client’s FIFO is then closed and\
    \ deleted.\n\n**Example:**\n\nIn the given example, the client process opens the\
    \ FIFO in write-only mode. If FIFO open operation is successful, it checks if\
    \ messages passed for printing on FIFO are having length than the buffer created\
    \ to temporally hold the messages, then all the messages are copied to the buffer\
    \ `msg_buf`, and one by one, they are written to the fifo.\n\n```c\ninclude <fcntl.h>\n\
    #include <stdio.h>\n#include <errno.h>\n#define MSGSIZE 100\nchar *fifo = “fifo”;\n\
    int main (int argc, char **argv){\n  int fd, j, nwrite;\n  char msg_buf[MSGSIZ+1];\n\
    \  if (argc < 2){\n    printf ( “No message passed. \\n”);\n    exit(1);\n  }\n\
    \  if ((fd = open(fifo, O_WRONLY | O_NONBLOCK)) < 0)\n  printf(“\\n fifo open\
    \ failed\\n”);\n  for ( j = 1; j < argc; j++)\n  {\n  if (strlen(argv[j]) > MSGSIZ)\n\
    \  {\n    printf (“message is long er than buffer %s\\n”, argv[j]);\n    continue;\n\
    \    }\n    strcpy (msg_buf, argv[j]);\n    if ((nwrite = write(fd, msg_buf, MSGSIZ+1))\
    \ == -1)\n    printf(“\\n message write failed \\n”);\n  }\n  exit (0);\n  }\n\
    ```\n\n# Message queues\n\nThe message queue is the Kernel resident means of the\
    \ IPC. Message queues are stored within the Kernel in the form of a linked list.\
    \ An identifier identifies each message queue. Processes read and write messages\
    \ to arbitrary queues. It is possible for a process to write some messages on\
    \ the queue and exit and have the messages read by another process at a later\
    \ time.\n\nEach message on a queue has the following attributes:\n\n* Long integer\
    \ type message queue identifier.\n* Length of the data portion of the message.\n\
    * Data.\n\nKernel maintains a data structure `msqid_ds` for every message queue,\
    \ as follows:\n\n```c\n/* one msqid structure for each queue on the system */\n\
    struct msqid_ds {\n  struct ipc_perm msg_perm;\n  struct msg *msg_first;  /* first\
    \ message on queue */\n  struct msg *msg_last;   /* last message in queue */\n\
    \  time_t msg_stime;      /* last msgsnd time */\n  time_t msg_rtime;      /*\
    \ last msgrcv time */\n  time_t msg_ctime;      /* last change time */\n  struct\
    \ wait_queue *wwait;\n  struct wait_queue *rwait;\n  ushort msg_cbytes;\n  ushort\
    \ msg_qnum;\n  ushort msg_qbytes;      /* max number of bytes on queue */\n  ushort\
    \ msg_lspid;      /* pid of last msgsnd */\n  ushort msg_lrpid;      /* last receive\
    \ pid */\n}\n```\n\nLet us discuss some of them as follows:\n\n* `msg_perm`: Object\
    \ of the `ipc_perm` structure defined in `linux/ipc.h`. This holds the permission\
    \ information for the message queue, including access permissions and information\
    \ about the user who created the message queue (`uid`).\n* `msg_first`: Contains\
    \ a pointer to the first message in the message queue (the head of the list).\n\
    * `msg_last`: Contains a pointer to the last message in the message queue (the\
    \ tail of the list).\n* `msg_stime`: Timestamp (`time_t`) of the last message\
    \ sent to the queue.\n* `msg_rtime`: Timestamp of the last message retrieved from\
    \ the queue.\n* `msg_ctime`: Timestamp of last change made to the queue.\n* `wwait`\
    \ and `rwait`: Pointers into the Kernel’s wait queue when the queue is full or\
    \ empty.\n* `msg_cbytes`: Total number of bytes residing on the queue (sum of\
    \ all messages).\n* `msg_qnum`: Total number of messages currently in the message\
    \ queue.\n* `msg_qbytes`: Maximum number of bytes that can reside on the message\
    \ queue.\n* `msg_lspid`: ID of the process that sent the last message.\n* `msg_lrpid`:\
    \ PID of the process that retrieved the last message.\n\n# Creating and opening\
    \ a message queue\n\nA process can create a new message queue, or it can connect\
    \ to an existing one. The `msgget()` function is used for both creation and connection.\n\
    \n**Prototype**\n```c\nint msgget(key_t key, int msgflg);\n```\n\nThe `key` is\
    \ a system-wide unique identifier describing the queue. The process creating the\
    \ message queue generates a key identifier, and other processes use this key to\
    \ connect to the queue. The `msgflg` argument contains read-write permission,\
    \ which can be bitwise OR with `IPC_CREAT` or `IPC_EXCL` to create a new message\
    \ queue or connect to an existing one.\n\nFollowing members of `msgid_ds` structure\
    \ are initialized when a new message queue is created:\n\n* `msg_qbytes`: Set\
    \ to the system limit.\n* `msg_ctime`: Set to the current time.\n* `msg_perm.mode`:\
    \ Contain read-write permission from the `msgflg` argument.\n* `msg_qnum`: Set\
    \ to `0`.\n* `msg_lspid`: Set to `0`.\n* `msg_lrpid`: Set to `0`.\n* `msg_stime`:\
    \ Set to `0`.\n* `msg_rtime`: Set to `0`.\n* `msg_perm.uid` and `msg_perm.cuid`:\
    \ Set to the effective user ID of the process.\n* `msg_perm.gid` and `msg_perm.cgid`:\
    \ Set to the effective group ID of the process.\n\n`msgget()` returns the message\
    \ queue ID on success or -1 on failure.\n\n# Sending a message to the queue\n\n\
    The `msgsnd()` function is used to send a message to the message queue.\n\n**Prototype:**\n\
    ```c\nint msgsnd(int msqid, const void *msgp, size_t msgsz, int msgflg);\n```\n\
    \n`msqid` is the message queue identifier returned by `msgget()`. The pointer\
    \ `msgp` is a pointer to the message to put on the queue. Message is defined in\
    \ `sys/msg.h` file in the form of structure `msgbuf`, as follows:\n\n```c\nstruct\
    \ msgbuf {\n  long mtype;\n  char mtext[1];\n}\n```\n\nThere is no limit on the\
    \ length of `mtext` at compile time; rather, the limit is set by the system administrator.\
    \ `msgsz` is the size in bytes of the message. `msgflg` is set to either `0` or\
    \ `IPC_NOWAIT`.\n\nThe function returns as follows:\n\n* If too many messages\
    \ are available.\n* If the number of bytes on the message queue exceeds the `msg_qbyte`\
    \ limit.\n\nIf `msgflg` is set to `IPC_NOWAIT`, then the function returns the\
    \ error `EAGAIN`, and if `msgflg` is not set to `IPC_NOWAIT`, then the thread\
    \ is put to sleep.\n\n**Example:**\n\nIn this given example, the process creates\
    \ a message queue for writing a message. If the message queue is not created,\
    \ an error message will be printed and the program exits abnormally. Once the\
    \ message queue is created successfully, a message is read from keyboard and sent\
    \ to the queue. In case of error, the message queue will be destroyed:\n\n```c\n\
    #include <stdio.h>\n#include <stdlib.h>\n#include <errno.h>\n#include <sys/types.h>\n\
    #include <sys/ipc.h>\n#include <sys/msg.h>\n\nstruct msgbuf {\n  long mtype;\n\
    \  char mtext[200];\n};\n\nint main(void)\n{\n  struct msgbuf buf;\n  int msqid;\n\
    \  key_t key= 100;\n```\n"
