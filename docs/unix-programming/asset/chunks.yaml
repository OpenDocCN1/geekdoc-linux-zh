    5. UNIX 文件系统的数据块中究竟存储了什么？\n6. 两个进程可以同时打开一个文件吗？说明你的理由。\n7. 什么是密码有效期？\n8. 编写一个程序，让用户有机会删除当前工作目录中的任何或所有文件。应显示文件名，随后提示是否要删除该文件。\n\
    \n# 第 3 章\n\n## 进程管理\n\n### 引言\n\n内核代表用户进程执行各种原始操作。这些操作包括通过允许进程的创建、终止或挂起以及通信来控制进程的执行。公平地调度进程以便在\
    \ CPU 上执行。为执行进程分配内存和辅助内存。保护进程的地址空间。内核还控制对终端等外设备的访问。UNIX 在系统中执行的不同进程之间维持父子关系。UNIX\
    \ 内核通过不同的进程 ID（PID）维护这一进程树，以保持对进程创建、执行和终止的控制。本章将讨论所有这些执行有效进程管理的原始操作。\n\n### 结构\n\
    \n我们本章将涵盖以下主题：\n\n* 进程及其关系\n* 进程相关操作\n* 进程控制与执行\n* 为执行的进程分配内存\n* 进程通信\n\n### 目标\n\
    \n学习本章后，你将能够：\n\n* 理解进程管理的基本概念\n* 学习如何在 UNIX 系统中识别进程\n* 熟悉创建、执行、终止和挂起等进程相关操作\n\
    * 理解进程之间如何通信\n* 理解 UNIX 如何控制进程的执行和切换\n\n### UNIX 进程\n\n正在执行的程序是一个进程。在 UNIX 中，进程是一个工作单元。系统由一组进程组成：执行系统代码的操作系统进程和执行用户代码的用户进程。所有进程通过\
    \ CPU 在进程之间切换来并发执行。\n\n进程通过遵循严格的指令序列执行，这些指令是自包含的且不会跳转到另一个进程的指令。\n\n### 进程 ID\n\
    \n每个进程都有一个称为进程 ID 的数字，用于唯一标识它。`getpid()` 函数用于获取进程的 ID。UNIX 中的进程具有父子关系。每个进程有一个父进程和多个进程。\n\
    \n进程 ID 0 是调度进程，称为交换进程（swapper）。交换进程是内核的一部分，被称为系统进程。\n\n`init` 进程（进程 ID 1）是进程分发器，它产生\
    \ shell，而我们启动的所有进程都是 shell 的子进程，因此 init 进程的后代。Init 是一个普通用户进程且永远不会。\n\nUNIX 在名为进程表的内部数据结构中跟踪所有进程。父进程的进程\
    \ ID 可以通过 `getppid()` 函数获取：\n\n```c\nmain()\n{\n  printf(\"In child process pid\
    \ is %d \\n\",getpid());\n  printf(\"In child process parents pid is %d \\n\"\
    ,getppid());\n}\n```\n\n### UNIX 环境下的进程执行\n\nUNIX 中的进程是一个 C 程序。每当 C 程序执行时都会调用\
    \ main 函数。\n\n**原型：**\n\n```c\nint main(int argc, char * argv);\n```\n\n在这里，`argc`\
    \ 是命令行参数的数量，`argv` 是命令行参数的指针。\n\n内核通过 `exec` 函数开始执行 C 程序，该函数调用可执行程序文件指定的起始地址处的启动例程。启动例程从内核获取命令行参数并调用\
    \ main 函数。\n\n### 进程的执行模式\n\n从硬件角度看，系统有以下两种执行模式：\n\n"
- fmt: "\n1. User mode: When the user process executes, it does so in the user mode.\
    \ In the user mode, processes can access their own instructions and data but not\
    \ Kernel instructions and data or those of other processes.\n\n2. Kernel mode:\
    \ When a user process executes a system, call, the execution mode of the process\
    \ changes from user mode to Kernel mode; the Kernel executes the users’ request.\
    \ Processes in Kernel mode can access Kernel and user addresses.\n\n# Process\
    \ termination\n\nWhen a process terminates, the operating system deallocates all\
    \ resources allocated to the process, updates statistics related to the process,\
    \ and intimate all processes about the process termination. UNIX process terminates\
    \ either normally or abnormally. When a process terminates, it goes into a zombie\
    \ state, that is, it does not release the process ID; rather, it waits for the\
    \ parent process to acknowledge that child is terminated and PID is released.\n\
    \n# Normal termination\n\nNormal termination of the process is done by returning\
    \ from the main function or calling `exit()` or `_exit()` functions.\n\nThe `exit()`\
    \ function performs a cleanup function before exiting from the process. It closes\
    \ all open files and flushes all buffers.\n\n**Prototype:**\n\n```\nvoid exit(int\
    \ status);\n```\n\nThe `_exit()` function does not perform any cleanup operation\
    \ before exiting.\n\n# Abnormal process termination\n\nA process terminates abnormally\
    \ if any or more of the following conditions occur:\n\n* Resource usage of the\
    \ process exceeds\n* The task no longer needed\n* If the parent process is exiting\n\
    \nAnother reason for abnormal process termination is calling `abort()` function\
    \ in some other process, especially by the parent. This function sends the SIGABRT\
    \ signal to the caller.\n\nFor abnormal termination, the Kernel generates the\
    \ termination status. The termination status is obtained by the parent process\
    \ using the `wait()` system call.\n\n# Command-line arguments and environment\
    \ variables\n\nThe `main()` function in C has two standard arguments `argc` and\
    \ `argv` called command-line arguments. `argc` specifies the number of arguments\
    \ counting the command name as an argument itself.\n\n`argv` is an array of pointers\
    \ to strings. The first member of `argv`, that is, `argv[0]`, points to the command\
    \ name, and the second one `argv[1]`, points to the first argument of the command.\n\
    \nBecause `argv` exists, the program can react to command line parameters entered\
    \ by the user fairly easily. For example, you might have your program to detect\
    \ the word help as the first parameter following the program name and dump a help\
    \ file to stdout. File names can also be passed in and used in your `open` statements.\
    \ Any input too can be passed as command-line arguments, and avoid using I/O statements\
    \ to read input.\n\nThe `envp` gives the program’s environment variables represented\
    \ as an array of strings as `VAR=value`. For example, `PATH=/bin;/usr/bin`. The\
    \ last element of the array is a null pointer. This gives C programmers access\
    \ to the shell’s global environment.\n\nIn addition to the `envp` vector, it is\
    \ possible to access the environment variables through the call `getenv()`. This\
    \ is used as follows; suppose we want to access the shell environment variable\
    \ `$HOME`.\n\n```\nchar *string;\nstring = getenv(\"HOME\");\n```\n\nThe `getenv()`\
    \ gets the value of `$HOME` variable and stores it to the string.\n\n**Example:**\n\
    \n```c\n/* myprog.c*/\n#include <stdio.h>\nint main(int argc, char *argv[], char*\
    \ envp[])\n{\n    int I;\n    printf(\"The program %s has %d arguments\\n\", argv[0],\
    \ argc);\n    printf(\"The first two arguments are %s and %s \\n\", argv[1], argv[2]);\n\
    \    for (I=0; envp[I]; I++)\n        printf(\"%s\\n\",envp[I]);\n}\n```\n\nIn\
    \ the given example, the program is executed as follows:\n\n```bash\n$myprog this\
    \ is good\n```\n\nThe output is:\n\nThe program myprog has 4 arguments\nThe first\
    \ two arguments are this and is\n\n`argc = 4` while `argv[0]` points to `myprog`,\
    \ `argv[1]` points to `this`, `argv[2]` to `is` and `argv[3]` to `good`. After\
    \ this, it displays the environment variables.\n\n# Memory layout of a UNIX process\n\
    \nThe memory area allocated to a program will usually be split into several sub-areas\
    \ for particular:\n\n* **The code area:** This is known as the text area in UNIX\
    \ and simply contains the executable code of the program. If there are several\
    \ processes running the same program, there will still only be one code area as\
    \ it is identical for all processes. The text area is usually read-only to prevent\
    \ a program from modifying its instructions.\n* **The data area:** This holds\
    \ the data being processed by the program. This section contains both initialized\
    \ and non-initialized data variables.\n* **The stack area:** This is automatically\
    \ created, and its size is adjusted at run time. It consists of logical stack\
    \ frames that are pushed when calling a function and popped when returning. It\
    \ contains parameters to a function, local variables, and data. A process has\
    \ one stack for user and another for Kernel.\n* **Heap:** This part of virtual\
    \ space contains the dynamically allocated variables to be used.\n\n# Setting\
    \ branch into another function\n\nC program allows to jump to another function\
    \ `setjmp` and `longjmp`. These kinds of jumps should be considered as good practice.\n\
    \n**Prototype:**\n\n```\nint setjmp(jmp_buf env);\nvoid longjmp(jmp_buf env, int\
    \ val);\n```\n\nThe `setjmp()` macro saves the current environment in `env`. This\
    \ macro returns more once. The first time it always returns `0`; the second time,\
    \ when it returns from `longjmp()`, it returns the value set as the argument.\
    \ Let us see an example:\n\n```c\n#include <setjmp.h>\n#include <stdio.h>\njmp_buf\
    \ ebuf;\nvoid f(void);\nint main(void)\n{\n    int i;\n    printf(\"1 \");\n \
    \   i = setjmp(ebuf);\n    if(i == 0) {\n        f();\n    }\n    printf(\"%d\"\
    , i);\n    return 0;\n}\nvoid f(void)\n{\n    printf(\"2 \");\n    longjmp(ebuf,\
    \ 3);\n}\n```\n\nIn the given example, the output is:\n\n1 23\n\nThe first time\
    \ when `setjmp()` is called, it returns `0` to the variable `i`, and the control\
    \ jumps to the function `f()`. In function `f()` `2` will be printed, and the\
    \ return value of `setjmp` is set to `3` as it is passed as the second argument\
    \ of the `longjmp()` macro.\n\n# Process states\n\nThe lifetime of a process can\
    \ be modeled by a set of states, and each process can be in any of the states\
    \ at one point in time. These states can be shown by a state transition diagram\
    \ shown in figure 3.1, which is a directed graph whose nodes represent the states\
    \ a process can enter and whose edges represent the events that cause the process\
    \ to move from one state to another.\n\n![](images/Figure-3.1.jpg)\n\n**Figure\
    \ 3.1:** Process transition diagram\n\nUNIX process undergoes into following different\
    \ states throughout its lifetime:\n\n* **Executing:** The process executes in\
    \ two different modes user and Kernel mode.\n* **Ready:** Process is ready to\
    \ execute as soon as Kernel schedules it, or process is in a ready state in secondary\
    \ memory.\n* **Sleeping:** Process is in sleeping state in main memory, or swapper\
    \ has swapped the process in the secondary memory to swap in other processes in\
    \ the main memory.\n* **Created:** Process is just created. It is neither in a\
    \ ready state nor in a sleeping state.\n* **Zombie:** Process has just executed\
    \ the `exit()` system call. The process does not exist but leaves the exit code.\n"
  raw: '1.  User mode: When the user process executes, it does so in the user mode.
    In the user mode, processes can access their own instructions and data but not
    Kernel instructions and data or those of other processes.


    2.  Kernel mode: When a user process executes a system, call the execution mode
    of the process changes from user mode to Kernel mode; the Kernel executes the
    users’ request. Processes in Kernel mode can access Kernel and user addresses.


    # [Process termination](#toc.xhtml_s68a)


    When a process terminates, the operating system deallocates all resources allocated
    to the process, updates statistics related to the process, and intimate all processes
    about the process termination. UNIX process terminates either normally or abnormally.
    When a process terminates, it goes into a zombie state, that is, it does not release
    the process ID; rather, it waits for the parent process to acknowledge that child
    is terminated and PID is released.


    # [Normal termination](#toc.xhtml_s69a)


    Normal termination of the process is done by returning from the main function
    or calling **`exit()`** or **`_exit()`** functions.


    The **`exit()`** function performs a cleanup function before exiting from the
    process. It closes all open files and flushes all buffers.


    **Prototype:**


    `void exit(int status);`


    The **`_exit()`** function does not perform any cleanup operation before exiting.


    # [Abnormal process termination](#toc.xhtml_s70a)


    A process terminates abnormally if any or more of the following conditions occur:


    *   Resource usage of the process exceeds


    *   The task no longer needed


    *   If the parent process is exiting


    Another reason for abnormal process termination is calling **`abort()`** function
    in some other process, especially by the parent. This function sends the SIGABRT
    signal to the caller.


    For abnormal termination, the Kernel generates the termination status. The termination
    status is obtained by the parent process using the **`wait()`** system call.


    # [Command-line arguments and environment variables](#toc.xhtml_s71a)


    The **`main()`** function in C has two standard arguments **`argc`** and **`argv`**
    called command-line arguments. **`argc`** specifies the number of arguments counting
    the command name as an argument itself.


    argv is an array of pointers to strings. The first member of argv, that is, **`argv[0]`**,
    points to the command name, and the second one **`argv[1]`**, points to the first
    argument of the command.


    Because argv exists, the program can react to command line parameters entered
    by the user fairly easily. For example, you might have your program to detect
    the word help as the first parameter following the program name and dump a help
    file to stdout. File names can also be passed in and used in your open statements.
    Any input too can be passed as command-line arguments, and avoid using I/O statements
    to read input.


    The **`envp`** gives the program’s environment variables represented as an array
    of strings as **`VAR=value`**. For example, **`PATH=/bin;/usr/bin`**. The last
    element of the array is a null pointer. This gives C programmers access to the
    shell’s global environment.


    In addition to the **`envp`** vector, it is possible to access the environment
    variables through the call **`getenv()`**. This is used as follows; suppose we
    want to access the shell environment variable **`$HOME`**.


    `char *string;`


    `string = getenv(“HOME”);`


    The **`getenv()`** gets the value of **`$HOME`** variable and stores it to the
    string.


    **Example:**


    `/* myprog.c*/`


    `#include <stdio.h>`


    `int main(int argc, char *argv[], char*  envp[])`


    `{`


    `int I;`


    `printf(“The program %s has %d arguments\n”, argv[0], argc);`


    `printf(“The first two arguments are %s and %s \n”, argv[1], argv[2]);`


    `for (I=0; envp[I]; I++)`


    `printf(“%s\n”,envp[I]);`


    `}`


    In the given example, the program is executed as follows:


    `$myprog this is good`


    The output is:


    **`The program myprog has 4 arguments`**


    **`The first two arguments are this and is`**


    The **`argc = 4`** while **`argv[0]`** points to **`myprog`**, **`argv[1]`** points
    to **`this`**, **`argv[2]`** to **`is`** and **`argv[3]`** to **`good`**. After
    this, it displays the environment variables.


    # [Memory layout of a UNIX process](#toc.xhtml_s72a)


    The memory area allocated to a program will usually be split into several sub-areas
    for particular:


    *   **The code area:** This is known as the text area in UNIX and simply contains
    the executable code of the program. If there are several processes running the
    same program, there will still only be one code area as it is identical for all
    processes. The text area is usually read-only to prevent a program from modifying
    its instructions.


    *   **The data area:** This holds the data being processed by the program. This
    section contains both initialized and non-initialized data variables.


    *   **The stack area:** This is automatically created, and its size is adjusted
    at run time. It consists of logical stack frames that are pushed when calling
    a function and popped when returning. It contains parameters to a function, local
    variables, and data. A process has one stack for user mode and another for Kernel
    mode.


    *   **Heap:** This part of the virtual address space contains the dynamically
    allocated variables to be used by the process.


    # [Setting branch into another function](#toc.xhtml_s73a)


    C program does allow to jump to the label set in another function. To branch the
    control to another function **`setjump`** and **`longjump`** C library macros
    are used. Generally, these kinds of jumps should be avoided because it is not
    considered as a good programming practice.


    **Prototype**


    `int setjmp(jmp_buf env); void longjmp(jmp_buf env, int val);`


    The **`setjmp()`** macro saves the current environment in the variable **`env`**.
    This macro returns more than once. The first time it always returns **`0`**; the
    second time, when it returns from **`longjmp()`**, it returns the value set for
    the second argument of **`longjmp()`**. Here it is represented by **`val`**.


    Let us see an example:


    `include <setjmp.h>`


    `#include <stdio.h>`


    `jmp_buf ebuf;`


    `void f(void);`


    `int main(void)`


    `{`


    `int i;`


    `printf(“1 “);`


    `i = setjmp(ebuf);`


    `if(i == 0) {`


    `f();`


    `}`


    `printf(“%d”, i);`


    `return 0;`


    `}`


    `void f(void)`


    `{`


    `printf(“2 “);`


    `longjmp( ebuf, 3);`


    `}`


    In the given example, the output is as follows:


    **`1`**


    **`2`**


    **`3`**


    The first time when **`setjmp()_`** is called, it returns **`0`** to the variable
    **`I`**, and the control jumps to the function **`f()`**. In function **`f()`**
    **`2`** will be printed, and the return value of **`setjmp`** is set to **`3`**
    as it is passed as the second argument of the **`longjmp()`** macro.


    # [Process states](#toc.xhtml_s74a)


    The lifetime of a process can be modeled by a set of states, and each process
    can be in any of the states at one point in time. These states can be shown by
    a state transition diagram shown in *[figure 3.1](#c03.xhtml_fig3_1)*, which is
    a directed graph whose nodes represent the states a process can enter and whose
    edges represent the events that cause the process to move from one state to another.


    ![](images/Figure-3.1.jpg)


    **Figure 3.1:** Process transition diagram


    UNIX process undergoes into following different states throughout its lifetime:


    *   **Executing:** The process executes in two different modes user and Kernel
    mode.


    *   **Ready:** Process is ready to execute as soon as Kernel schedules it, or
    process is in a ready state in secondary memory.


    *   **Sleeping:** Process is in sleeping state in main memory, or swapper has
    swapped the process in the secondary memory to swap in other processes in the
    main memory.


    *   **Created:** Process is just created. It is neither in a ready state nor in
    a sleeping state.


    *   **Zombie:** Process has just executed the **`exit()`** system call. The process
    does not exist but leaves the exit code.'
