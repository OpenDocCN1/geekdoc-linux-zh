  raw: 'Once a connection has been established, the client and server use the **`send()`**
    system call to send information from client to server or from server to client.
    If the client is using **`send()`**, the server should be using **`recv()`** or
    vice-versa. This function either returns the number of bytes sent out or returns
    **`–1`** if there is an error.


    **Prototype:**


    `int send(int sockfd, const void *msg, int len, int flags);`


    The **`sockfd`** is the socket file descriptor for the socket being used to send
    the data. On the client-side, **`sockfd`** is the same socket used when calling
    **`connect()`**. On the server-side, **`sockfd`** is the socket returned from
    **`accept()`**, **`msg`** is a pointer to the data that is being sent, **`len`**
    is the length of the data in bytes, flags are set to **`0`**.


    # [Receiving message through socket (connection-oriented)](#toc.xhtml_s134a)


    The **`recv()`** system call is used to receive data that has been sent over the
    socket. The function returns the number of bytes actually received; in case of
    an error, it returns **`-1`** or returns **`0`** if the other end has closed the
    connection.


    **Prototype**


    `int recv(int sockfd, void *buf, int len, unsigned int flags);`


    The **`sockfd`** is the socket descriptor for the socket from which the data is
    being read. On the client-side, **`sockfd`** is the same socket used when calling
    **`connect()`**. On the server-side, **`sockfd`** is the socket returned from
    **`accept()`**, **`buf`** is a pointer to the buffer that will hold data after
    reading, **`len`** is the maximum length of the buffer in bytes, flags are set
    to **`0`**.


    # [Receiving message through socket (connectionless)](#toc.xhtml_s135a)


    This function is similar to **`send()`**; however, it is used for connectionless
    datagrams rather than connection-oriented communications.


    **Prototype**


    `int sendto(int sockfd, const void *msg, int len, unsigned int flags, const struct
    sockaddr`


    `*toaddr, int addrlen);`


    The **`sockfd`** is the socket descriptor for the socket being used to send the
    data, **`msg`** is a pointer to the data that is being sent, **`len`** is the
    length of the data in bytes, flags are set to **`0`**, **`toaddr`** is the **`sockaddr`**
    containing the IP address and port number to which the data is being sent, **`addrlen`**
    is the size of the preceding **`sockaddr`** in the data structure.


    # [Closing socket](#toc.xhtml_s136a)


    The **`close()`** system call is used to close the socket.


    **Prototype**


    `void close(sockfd);`


    Let us see an example of the client and server programs.


    # Client program


    The following is the code for the client side:


    `#include <stdio.h>`


    `#include <sys/types.h>`


    `#include <sys/socket.h>`


    `#include <netinet/in.h>`


    `#include <netdb.h>`


    `#include <string.h>`


    `#define PORT        5000`


    `#define HOST        “uptu.ac.in”`


    `#define DIRSIZE     8000`


    `main(argc, argv)`


    `int argc; char **argv;`


    `{`


    `char hostname[100];`


    `char dir[DIRSIZE];`


    `int  sd;`


    `struct sockaddr_in sin;`


    `struct sockaddr_in pin;`


    `struct hostent *hp;`


    `strcpy(hostname,HOST);`


    `if (argc>2)`


    `{ strcpy(hostname,argv[2]); }`


    `if ((hp = gethostbyname(hostname)) == 0) {`


    `perror(“gethostbyname”);`


    `exit(1);`


    `}`


    `/* fill in the socket structure with host information */`


    `memset(&pin, 0, sizeof(pin));`


    `pin.sin_family = AF_INET;`


    `pin.sin_addr.s_addr = ((struct in_addr *)(hp->h_addr))->s_addr;`


    `pin.sin_port = htons(PORT);`


    `/* grab an Internet domain socket */`


    `if ((sd = socket(AF_INET, SOCK_STREAM, 0)) == -1) {`


    `perror(“socket”);`


    `exit(1);`


    `}`


    `/* connect to PORT on HOST */`


    `if (connect(sd,(struct sockaddr *)  &pin, sizeof(pin)) == -1) {`


    `perror(“connect”);`


    `exit(1);`


    `}`


    `/* send a message to the server PORT on machine HOST */`


    `if (send(sd, argv[1], strlen(argv[1]), 0) == -1) {`


    `perror(“send”);`


    `exit(1);`


    `}`


    `/* wait for a message to come back from the server */`


    `if (recv(sd, dir, DIRSIZE, 0) == -1) {`


    `perror(“recv”);`


    `exit(1);`


    `}`


    `printf(“%s\n”, dir);`


    `close(sd);`


    `}`


    # Server program


    Following is the code for the server side:


    `#include <stdio.h>`


    `#include <sys/types.h>`


    `#include <sys/socket.h>`


    `#include <netinet/in.h>`


    `#include <netdb.h>`


    `#include <string.h>`


    `#define PORT  5000`


    `#define DIRSIZE  8000`


    `main()`


    `{`


    `char     dir[DIRSIZE];  /* used for incoming dir name, and`


    `outgoing data */`


    `int   sd, sd_current, cc, fromlen, tolen;`


    `int   addrlen;`


    `struct   sockaddr_in sin;`


    `struct   sockaddr_in pin;`


    `/* get an internet domain socket */`


    `if ((sd = socket(AF_INET, SOCK_STREAM, 0)) == -1) {`


    `perror(“socket”);`


    `exit(1);`


    `}`


    `/* complete the socket structure */`


    `memset(&sin, 0, sizeof(sin));`


    `sin.sin_family = AF_INET;`


    `sin.sin_addr.s_addr = INADDR_ANY;`


    `sin.sin_port = htons(PORT);`


    `/* bind the socket to the port number */`


    `if (bind(sd, (struct sockaddr *) &sin, sizeof(sin)) == -1) {`


    `perror(“bind”);`


    `exit(1);`


    `}`


    `/* show that we are willing to listen */`


    `if (listen(sd, 5) == -1) {`


    `perror(“listen”);`


    `exit(1);`


    `}`


    `/* wait for a client to talk to us */`


    `addrlen = sizeof(pin);`


    `if ((sd_current = accept(sd, (struct sockaddr *)  &pin, &addrlen)) == -1) {`


    `perror(“accept”);`


    `exit(1);`


    `}`


    `/* if you want to see the ip address and port of the client, uncomment      the
    next two lines */`


    `/*`


    `printf(“Hi there, from  %s#\n”,inet_ntoa(pin.sin_addr));`


    `printf(“Coming from port %d\n”,ntohs(pin.sin_port));`


    `*/`


    `/* get a message from the client */`


    `if (recv(sd_current, dir, sizeof(dir), 0) == -1) {`


    `perror(“recv”);`


    `exit(1);`


    `}`


    `/* get the directory contents */`


    `read_dir(dir);`


    `/* strcat (dir,” DUDE”);`


    `*/`


    `/* acknowledge the message, reply w/ the file names */`


    `if (send(sd_current, dir, strlen(dir), 0) == -1) {`


    `perror(“send”);`


    `exit(1);`


    `}`


    `/* close up both sockets */`


    `close(sd_current); close(sd);`


    `/* give client a chance to properly shutdown */`


    `sleep(1);`


    `}`


    # [I/O models](#toc.xhtml_s137a)


    There are normally two distinct phases for an input operation:


    *   Waiting for the data to be ready.


    *   Copying the data from the Kernel’s buffer to the process.


    # [Blocking I/O model](#toc.xhtml_s138a)


    When the socket is in blocking mode, Kernel puts the process in the wait state
    until there is data to read or data is fully written. If data is not available,
    wait till data is ready and block the process. As shown in *[figure 5.2](#c05.xhtml_fig5_2)*,
    the application is asking for data from Kernel in blocking mode. In this case,
    Kernel puts the application in a wait state till data is available. Once data
    is available and written to the application, it resumes execution.


    ![](images/Figure-5.2.jpg)


    **Figure 5.2:** Block diagram of I/O model (blocking)


    # [Non-blocking I/O model](#toc.xhtml_s139a)


    When the socket is in non-blocking mode, the Kernel does not put the process in
    a sleep state but returns with an error **`EWOULDBLOCK`**.


    The non-blocking I/O model looks as shown in *[figure 5.3](#c05.xhtml_fig5_3)*:


    ![](images/Figure-5.3.jpg)


    **Figure 5.3:** Block diagram of I/O model (non-blocking)


    To receive data, the application repeatedly calls **`recvfrom`**. During a call,
    if data is not available, then a Kernel returns an error of **`EWOULDBLOCK`**.
    If data is available during **`recvfrom`**, it is copied to the application’s
    buffer, and the function returns successfully. This process is called polling,
    where the application is continuously polling the Kernel to see if some data is
    ready. In this process, there is a wastage of CPU time, but this model is occasionally
    encountered, normally on systems dedicated to one function.


    # [I/O multiplexing model](#toc.xhtml_s140a)'
