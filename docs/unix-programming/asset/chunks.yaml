    ![](images/Figure-5.4.jpg)


    **Figure 5.4:** Block diagram of multiplexing I/O model


    A disadvantage of this model is that it requires two system calls instead of one.


    # [Signal-driven I/O model](#toc.xhtml_s141a)


    In this model, Kernel notifies the process that data is available by sending the
    SIGIO signal. As shown in *[figure 5.5](#c05.xhtml_fig5_5)*, the application enables
    signal handler using **`sigaction()`** function. After enabling, the application
    keeps on executing. Once data is available at the Kernel end, Kernel sends a SIGIO
    signal to the application. SIGIO signal is handled by the signal handler at the
    application end. Now, the application call **`receivfrom()`** function to receive
    data from Kernel, and when data is completely written, it starts executing.


    ![](images/Figure-5.5.jpg)


    **Figure 5.5:** Block diagram of signal-driven I/O model


    Initially, the socket is made enabled for signal-driven I/O. The **`sigaction()`**
    system call is executed to install a signal handler for handling I/O. Once a handler
    is installed, the system calls to return and does not block the process. Once
    the datagram is ready, the Kernel sends a SIGIO signal to the process. The process
    then reads the datagram either from the signal handler by calling **`recvfrom()`**
    system call, or the main function of the process can also read the datagram.


    In this mode, the process is not blocked while waiting for the datagram to arrive;
    rather, it continues executing. Once the datagram is ready to arrive, the process
    is notified by the signal handler.


    # [Asynchronous I/O model](#toc.xhtml_s142a)


    In this mode of I/O, the **`io_read()`** function is called defining the descriptor,
    buffer pointer, buffer size (same as in **`read()`** function) to the Kernel,
    file offset, and the method of notification of data arrival. When the entire operation
    is complete, the system calls immediately. This does not require blocking the
    process while waiting for the I/O to complete. The system model is illustrated
    in *[figure 5.6](#c05.xhtml_fig5_6)*.


    ![](images/Figure-5.6.jpg)


    **Figure 5.6:** Block diagram of asynchronous I/O model


    This model is quite different from signal-driven I/O as the signal is generated
    until data has been copied into the application’s buffer.


    # [Name and address conversion](#toc.xhtml_s143a)


    DNS is used to map between hostnames and an IP address. The hostname can be either
    a simple name (solaris) or a Fully Qualified Domain Name (FQDN) ([solaris.kohala.com](http://solaris.kohala.com)).


    # [Resource records](#toc.xhtml_s144a)


    DNS entries are called Resource Records (RRs). It defines all the information
    about the domain name, including the type of resource, protocol family, time in
    seconds during which a server can cache the RR, length of the data field, and
    resource data. The following table describes different types of resource records.


    | **Resource record type** | **Mapping** |


    | A | Maps hostname into 32-bit IPv4 address |


    | AAAA | Maps hostname into a 128-bit IPv6 address |


    | PTR | Map IP address into a hostname. For IPv4, the 4 bytes are reversed, and
    each byte is converted into a decimal ASCII value (0-255). Then in-`addr.arpa`
    is appended.For an IPv6 address, the 32 4-bit nibbles of the 128-bit address are
    reversed. Each nibble is converted to its corresponding hexadecimal ASCII value
    (0-9-a-f), and `ip6.int` is appended. |


    | MX | Mail exchange for the specified host. |


    | CNAME | Canonical name, for example, assigns CNAME to common services such as
    FTP, WWW, and so on. |


    **Table 5.2:** Resource types with their mapping


    # [The gethostbyname() function](#toc.xhtml_s145a)


    The **`gethostbyname()`** function takes the hostname of the current host and
    returns the corresponding IP address to pass as a parameter to the **`connect()`**
    function. It performs a query for an A and AAAA records and returns IPv4 and IPv6
    addresses.


