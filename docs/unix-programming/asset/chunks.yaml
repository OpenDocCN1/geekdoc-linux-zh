    # The dup() system call


    The **`dup()`** system call duplicates the file descriptor for a file, which points
    to the same file table entry as the old file descriptor does. The **`dup()`**
    system call generates the lowest available file descriptor. Both the file descriptors
    share the same file offset and status flags (read, write, and append).


    **Prototype**


    `int dup(int fd)`


    This system call returns a new file descriptor for the file. Both file descriptors
    can be interchangeably used to edit the file.


    **Example**


    `#include <stdio.h>`


    `#include <fcntl.h>`


    `#include <sys/types.h>`


    `#include <sys/stat.h>`


    `int main()`


    `{`


    `int fd;`


    `fd = open(“file.dat”,O_WRONLY | O_CREAT, S_IREAD | S_IWRITE );`


    `if (fd == -1)`


    `{`


    `perror(“FILE already opened”);`


    `exit (1);`


    `}`


    `close(1);         /* close standard output  */`


    `dup(fd);       /* fd will be duplicated  */`


    `close(fd);        /* close the extra slot */`


    `printf(“Hello\n”);`


    `exit(0); }`


    In the given example, the file is created in write-only mode. If it already exists,
    an error occurs, and **`FILE already opened`** message is printed. The file is
    duplicated, and both the standard output and original file are closed afterward.
    The only opened file is the second one, and **`Hello`** message is printed on
    this.


    # The stat and fstat system calls


    The **`stat()`** and **`fstat()`** system calls give the status of files. These
    system calls return information such as file owner, i-node number, file type,
    file size, access permission, and file access time.


    **Prototype**


    `int stat(const char *pathname, struct stat *buf);`


    `int fstat(int fd, struct stat *buf);`


    `int lstat(const char *oathname, struct stat *buf);`


    **Where:**


    **`buf`** is the address of the data structure in the user process that contains
    the status information of the file. These system calls simply write fields of
    the i-node table into the **`buf`**.


    The **`fstat`** system call to obtain information about the file that is already
    open on the descriptor **`fd`**. A Stat system call gives information about a
    file specified in the pathname; **`lstat`** system call is the same as a stat
    system call.


    Stat structure contains following information:


    `dev_t     st_dev         /* Device ID of device containing file. */`


    `ino_t     st_ino          /*  File serial number.  */`


    `mode_t    st_mode    /* Mode of file (see below). */`


    `nlink_t   st_nlink       /* Number of hard links to the file. */`


    `uid_t     st_uid           /* User ID of file.  */`


    `gid_t     st_gid           /* Group ID of file.  */`


    `dev_t     st_rdev         /* Device ID (if file is character or block special).
    */`


    `off_t     st_size          /* For regular files, the file size in bytes.`


    `For symbolic links, the length in bytes of the`


    `pathname contained in the symbolic link.`


    `For a shared memory object, the length in bytes.`


    `For a typed memory object, the length in bytes.`


    `For other file types, the use of this field is`


    `unspecified. */`


    `time_t    st_atime     /* Time of last access.  */`


    `time_t    st_mtime   /* Time of last data modification. */`


    `time_t    st_ctime    /* Time of last status change. */`


    `blksize_t st_blksize /*A file system-specific preferred I/O block size for`


    `this object. In some file system types, this may`


    `vary from file to file. */`


    `blkcnt_t  st_blocks  /* Number of blocks allocated for this object. */`


    # [BASIC file permission](#toc.xhtml_s44a)


    In UNIX, each file can be accessed by different users as per the permission assigned
    to them. Each user is identified by a unique number, known as **`User_Id`**. The
    user who has created the file is the owner of the file. Users can also belong
    to a group. All members of the group share the same file permissions. Users who
    are neither owners nor belong to the group are known as others. The file owner
    can provide the file access permissions to the group members and other users.
    The file access permissions may read (r), write (w), or execute (x). the ls –l
    command may be used to see the assigned access permission given to the various
    files in the directory.


    **Example**


    `>ls -l /usr/bin/new1`


    `-rwxr-xr-x    1 user1   use1    8632 Sep 19 2021 /usr/bin/new1`


    In the given example, the file **`/usr/bin/new1`** file is owned by user1\. The
    file belongs to the group user. **`-rwxr-xr-x`** shoes the file access permission
    and type of file. The first letter shows that the file type is regular. The next
    three letters show permission assigned to the owner. The owner can read, write,
    and execute the file. The next three-letter show permission given to the group
    members, and the last three letters show the permission given to the others. The
    group members and others can only read and execute the file.


    The file access permission is represented as a 9-bit vector, where the first 3
    bits are allocated to the owner, the next three bits are allocated to group members,
    and the last three bits are allocated to other users. Thus, **`rw-`** corresponds
    to 110, that is, 4+2+0 = 6 in decimal. Where r-bit corresponds to decimal 4, the
    w-bit to decimal 2, and the *x*-bit to decimal 1.


    **`rwxr-xr-x`** means  755 in decimal for **`/usr/bin/new`**.


    Each user in UNIX has different access permission to their files. Every user has
    a user-Id, a unique number that identifies her/him. Users also belong to one or
    more groups. Groups can be used to restrict access to a number of people. Access
    permissions can be set per file for the owner, group, and others on the basis
    of read (r), write (w), and execute permissions (x). The command **`ls -l`** is
    used to see these permissions.


    `>ls -l /usr/bin/new -rwxr-xr-x    1 root   root  8632 Sep 9 2008 /usr/bin/new`


    The file **`/usr/bin/new`** is owned by the user root and belongs to a group called
    root. The -rwxr-xr-x shows the file access permissions. This file is readable(r),
    writable (w), and executable (x) for the owner. For the group and all others,
    it is readable(r) and executable (x).


    The permissions are represented as a bit vector with 3 bits each for the owner,
    group, and others. Thus *r*-*x* corresponds to 101 as a bit pattern or 4+1=5 in
    decimal. The r-bit corresponds to decimal 4, the w-bit to decimal 2, and the x-bit
    to decimal 1.


    | rwx 421 user (owner) | rwx 421 group | rwx 421 others |


    # [Real and effective user-IDs and group-IDs](#toc.xhtml_s45a)


    Each user name and a group name are mapped to a unique unsigned number, called
    user and group ID. This mapping is done via the /etc/passwd and /etc/group files,
    respectively. The user and group ID 0 are commonly called root, but that is really
    just a convention.


    Each UNIX process has a user ID and a group ID associated with it, and when trying
    to open a file for writing, for instance, these IDs are used to determine whether
    the process should be granted access or not. These IDs constitute the effective
    privilege of the process because they determine what a process can do and what
    it cannot. Most of the time, these IDs will be referred to as the effective **`uid`**
    and **`gid`**.


