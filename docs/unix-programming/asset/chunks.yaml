    \ 13–24 个字符组成，字符取自 64 位字母表，包括 a 到 z、A 到 Z、0 到 9、`.` 和 `/`。可选情况下，它可以以 `$` 字符开头。这意味着加密密码是使用另一种（非\
    \ DES）算法生成的。例如，如果以 `$1$` 开头，则意味着使用了基于 MD5 的算法。\n\n# 结论\n\nUNIX 提供了多种执行输入输出操作的方法。两种最主要的方法是\
    \ I/O 系统调用和库函数。库函数在内核层级执行时，也会转换为相应的系统调用。UNIX 内核维护了各种数据结构来管理所有打开的文件。用户进程如何访问文件由管理员向用户提供的文件访问权限控制。为了管理文件访问，用户被分为三类，即所有者、组员和其他。所有者可以向所有其他类型的用户提供访问。所有组员共享相同的访问权限。UNIX\
    \ 还提供了库函数来对读写数据进行缓冲。维护 I/O 缓冲区是为了避免频繁访问外部设备并加快输入输出操作。在第 1 和第 2 章分别完成了进程和文件管理这两个主要部分后，后续章节将讨论\
    \ UNIX Shell 环境，并为处理进程和文件提供用户界面。\n\n# 复习练习\n\n1. 使用 `setvbuf` 实现 `setbuf`。\n2.\
