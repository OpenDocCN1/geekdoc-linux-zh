    \ the starting number should be taken as 10. [Command line argument: `number`\
    \ ]\n13. Write a shell script to change all uppercase filenames in the current\
    \ directory to lowercase.\n14. Write a shell script to change the extension of\
    \ all text files in the current directory, from `.txt` to `.doc`.\n15. Write a\
