  trans: "\n\n*   **返回内核模式：** 进程被内核抢占，直到内核调度另一个进程。\n\n# 进程控制块\n\n操作系统通过一个进程控制块（PCB）来表示每个进程。它包含了与进程相关的信息，例如：\n\
    \n* **进程状态：** 新态、运行态、等待态等。\n* **程序计数器：** 指向该进程将执行的下一条指令的地址。\n* **CPU 寄存器：** 包括累加器、索引寄存器、栈指针和通用寄存器。\n\
    * **CPU 调度信息：** 如进程优先级、指向进程调度队列的指针以及调度调度。\n* **内存管理信息：** 如基寄存器和限界寄存器的值、页表。\n*\
    \ **统计信息：** 如 CPU 使用的时间量。\n* **I/O 状态信息：** 如分配给该进程的 I/O 设备列表、打开的文件列表。\n\n进程的上下文包括\
    \ CPU 寄存器的值、进程状态和内存管理信息。进程的上下文包含 (1) 用户级上下文，(2) CPU 寄存器和 (3) 内核级上下文。\n\n用户级上下文包含了进程虚拟地址空间的内存布局，如文本段、数据段、用户栈和共享内存。\n\
    \nCPU 寄存器由以下信息组成：\n\n* **程序计数器** 包含将执行的下一条指令的地址。\n* **程序状态寄存器** 包含各种指示最近计算结果的标志位、显示当前执行模式的子字段（用于判断进程是否可以运行特权指令），以及显示当前处理器执行级别的子字段。\n\
    * **栈指针** 指向内核栈或用户栈中下一个空条目或最后使用的条目。\n* **通用寄存器** 包含进程执行过程中产生的中间数据。\n\n进程的内核级上下文包含一个静态部分和在整个生命周期内数量变化的动态部分。系统级上下文的组件如下：\n\
    \n* **进程表** 条目包含进程的状态和控制信息。\n* **u area** 包含只需要访问一次的进程控制信息。\n* **Pregion** 条目、区域表和页表提供了进程的文本、数据、栈和其他区域。\n\
    * **内核栈** 当进程在内核模式下执行时，包含一个内核函数调用栈。当进程在用户模式下执行时，内核栈为空。\n* **动态部分** 包含几层系统级上下文，每一层都包含关于上一层的信息。\n\
    \n# 进程控制\n\n进程控制处理所有与进程相关的操作，包括创建子进程、在执行协作或独立进程时从一个进程切换到另一个进程，以及以正常方式终止进程。\n\n\
    # 进程创建\n\n进程在 UNIX 中通过 `fork()` 函数启动。`fork()` 函数创建一个与父进程完全相同的子进程，父子进程都在运行。父子进程共享相同的真实和有效用户\
    \ ID 及组 ID、当前工作目录、根目录、文件创建掩码等。\n\n`fork()` 将子进程的 `PID` 返回给父进程，子进程中的返回值为 `0`。内核增加与进程相关的文件和节点表计数器。如果由于以下原因无法创建子进程：(A)\
    \ 系统中进程过多。(B) 超过了父进程真实用户 ID 的进程数量限制，则父进程返回值为 `-1`。\n\n让我们来看一个例子：\n\n```\nmain()\n\
    {\n  int pid;\n  pid = fork();\n  if (pid < 0)\n    printf(\"Fork failed \\n\"\
    );\n  else\n  {\n    if (pid == 0)\n    {\n      printf(\"In child process pid\
    \ is %d \\n\",getpid());\n      printf(\"In child process parents pid is %d \\\
    n\",getppid());\n    }\n    else\n    {\n      printf(\"In parent process pid\
    \ is %d \\n\",getpid());\n      printf(\"In parent process parents parent pid\
    \ is %d \\n\",getppid());\n    }\n  }\n}\n```\n\n在父进程中设置的文件锁不会被子进程继承。在给定的示例中，如果\
    \ `fork()` 成功，它会向新创建的子进程返回 `0`，或者向调用 `fork()` 的父进程返回新创建子进程的进程 ID。两个进程按照 CPU 的调度逐一执行。如果\
    \ `fork()` 失败，它将返回一个负数。\n\n# 等待进程终止\n\n进程确认子进程死亡的简单方法是使用 `wait()` 系统调用。当调用 `wait()`\
    \ 时，进程会被挂起，直到其中一个子进程退出，然后调用带有子进程的退出状态返回。如果它有一个僵尸子进程，调用将立即返回并带有该进程的退出状态。\n\n调用\
    \ `wait()` 函数会执行几件事。首先会检查父进程是否有任何子进程。如果没有，`wait()` 将返回 -1。如果父进程有一个已终止（僵尸）的子进程，则返回子进程的\
    \ `PID` 并将其从进程表中移除。\n\n然而，如果父进程有一个尚未终止的子进程，父进程将被挂起，直到它接收到信号。一旦子进程死亡，信号就会被接收。\n\
    \n`wait()` 还可以告诉我们子进程是以什么方式终止的。为此，我们需要向 `wait()` 传递一个整数变量。如果进程是正常终止的，传递给 `wait()`\
    \ 的整数变量的高 8 位将进行更新；如果进程是非正常终止的，则低 8 位将初始化为 `0`。\n\n在发生核心转储（core dump）错误的情况下，wait\
    \ 返回一个第 7 位被设置的整数。\n\n让我们来看一个例子：\n\n```\n/* example of wait() */\nmain()\n{\n\
    \  int i, pid, exitstat, status;\n  pid = fork();\n  if (pid == 0)\n  {\n    printf(\"\
    Enter exit stat:\");\n    scanf(\"%d\", &i);\n    exit(i);\n  }\n  else\n  {\n\
    \    wait(&status);\n    if ((status & 0xff) != 0) /* abnormal exit */\n    {\n\
    \      printf(\"Signal interrupted\\n\");\n    }\n    else /* normal exit */\n\
    \    {\n      exitstat = (int) status/256 ;\n      printf(\"Exit status from %d\
    \ was %d\\n\", pid, exitstat);\n    }\n  }\n}\n```\n\n在这里，子进程用户输入一个退出代码，进程以该代码退出。父进程通过\
    \ `status` 变量接收此退出代码。我们可以检查 `status` 变量来确定退出类型。\n\n`fork()` 创建子进程所有变量的副本，因此全局变量也会复制。如果在一个进程中修改值，它不会反映在另一个进程中。即使指针变量所指位置的值在不同进程之间也是不同的。\n\
    \n# 执行另一个程序\n\n现有进程可以通过执行 exec 系统调用调用另一个进程。运行进程的进程 ID 不会改变，因为 `exec()` 函数并没有创建新进程，而是调用一个现有进程。`exec()`\
    \ 函数的各种原型如下：\n\n* `int execl(const char *path, const char *arg, …);`\n* `int execlp(const\
    \ char *file, const char *arg, …);`\n* `int execle(const char *path, const char\
    \ *arg,…, char * const envp[]);`\n* `int execv(const char *path, char *const argv[]);`\n\
    * `int execvp(const char *file, char *const argv[]);`\n\n"
- fmt: "\n`path` or `file` contains the filename being invoked, `arg` is a pointer\
    \ to character string passed as an argument to invoked file. The first argument,\
    \ by convention, should point to the filename associated with the file being executed.\
    \ The list of arguments must be terminated by a NULL pointer.\n\nThe functions\
    \ `execlp()` and `execvp()` will duplicate the actions of the shell in searching\
    \ for an executable file if the specified filename does not contain a slash (`/`)\
    \ character. The search path is the path specified in the environment by the `PATH`\
    \ variable. If this variable is not specified, the default path `:/bin:/usr/bin`\
    \ is used. In addition, certain errors are treated specially.\n\nThe new process\
    \ inherits the following properties from the old process such as process ID and\
    \ parent process ID, real user ID and real group ID, session ID, current working\
    \ directory, root directory, file mode creation mark, and so on.\n\nEffective\
    \ IDs of the invoked process may change depending on the status of the set-user-ID\
    \ and set-group-Id bits. If the set-user-ID bit of the new program is set, then\
    \ the effective user-ID will become the owner ID of the program.\n\n# Accessing\
    \ user information\n\nThere are a number of functions and system calls that let\
    \ us access information about UNIX users.\n\n## User details\n\nThe `passwd` structure\
    \ in the `pwd.h` header file contains the user information similar to `/etc/passwd`\
    \ directory:\n\n```c\n#include <pwd.h>\nstruct passwd {\n  char *pw_name;  /*\
    \ name of the user */\n  char *pw_passwd;  /* password */\n  uid_t pw_uid;  /*\
    \ user id*/\n  gid_t pw_gid;  /* group id */\n  time_t pw_change; /* validity\
    \ and\n  char *pw_class;  password class */\n  char *pw_gecos;  /* full user name\
    \ */\n  char *pw_dir;  /* login directory */\n  char *pw_shell;  /* user login\
    \ shell */\n  time_t pw_expire; /* password expiry date*/\n};\n```\n\nThe `passwd`\
    \ structure is returned by the `getpwnam()` and `getpwuid()` functions. It provides\
    \ information about a user account. The `getpwnam()` and `getpwuid()` function\
    \ searches the user database for an entry with a matching name or UID.\n\nThe\
    \ `getuid()` gets the user id of the logged-in user.\n\nExample of a program that\
    \ prints details about the user is as follows:\n\n```c\n#include <pwd.h>\nmain()\n\
    {\n  struct passwd *pass;\n  int uid;\n  uid = getuid();\n  pass = getpwuid(uid);\n\
    \  printf(\"Login name: %s\\n\", pass->pw_name);\n  printf(\"Encrypted Password:\
    \ %s\\n\", pass->pw_password);\n  printf(\"User ID: %d\\n\", pass->pw_uid);\n\
    \  printf(\"Group ID: %d\\n\", pass->pw_gid);\n  printf(\" Password Age: %s\\\
    n\", pass->pw_age);\n  printf(\"Comment: %s\\n\", pass->pw_comment);\n  printf(\"\
    Login Dir  %s\\n\", pass->pw_pw_dir);\n  printf(\"Shell: %s\\n\", pass->pw_shell);\n\
    }\n```\n\n## Group details\n\nThe group structure in `grp.h` header file contains\
    \ group information as in the following:\n\n`/etc/grpup`:\n\n```c\n#include <grp.h>\n\
    struct group {\n  char *gr_name;  /* group name */\n  char *gr_passwd; /* group\
    \ password */\n  gid_t gr_gid;  /* group id*/\n  char **gr_mem; /* pointer to\
    \ group member names */\n};\n```\n\nThe `getgid()` gets the group id of the user,\
    \ whereas `getgrgid()` populates the group structure.\n\nThe following is the\
    \ example to print group information:\n\n```c\n#include <grp.h>\nmain()\n{\n \
    \ int I;\n  struct group *grp;\n  grp = getgrgid(getgid());\n  printf(\"Group\
    \ Name %s\\n\", grp->gr_name);\n  printf(\"Group Password %s\\n\", grp->gr_passwd);\n\
    \  printf(\"Group ID %s\\n\", grp->gr_gid);\n  printf(\"Group Members :\");\n\
    \  for (I = 0; grp->gr_mem[I];I++)\n    printf(\"\\n: %s\", grp->gr_mem[I]);\n\
    }\n```\n\n## Show information of all users logged in\n\nStruct `utmp` in `utmp.h`\
    \ header file has information of logged in users as `/etc/utmp`, as shown following.\
    \ We can populate this structure by reading logged in user information from `/etc/utmp`:\n\
    \n```c\nstruct utmp {\n  char ut_user[8]; /* User login name */\n  char ut_id[4];\
    \ /* process id */\n  char ut_line[12]; /* device name (console, lnxx) */\n  short\
    \ ut_pid; /* short for compat. process id */\n  short ut_type; /* type of entry\
    \ */\n  struct exit_status ut_exit; /* exit status of a process */\n  time_t ut_time;\
    \ /* entry was made */\n};\n```\n\nThe following is a program to display information\
    \ of logged in users:\n\n```c\n#include <sys/types.h>\n#include <stdio.h>\n#include\
    \ <utmp.h>\n#include <pwd.h>\n#define UTMP \"/etc/utmp\"\n#define NAMELEN 8\n\
    main()\n{\n  FILE *fp;\n  struct utmp u;\n  struct passwd *p;\n  char temp[NAMELEN+1];\n\
    \  fp = fopen(UTMP, \"r\");\n  while (!feof(fp)) {\n    fread(&u,sizeof(u),1,fp);\n\
    \    if (u.ut_name == NULL) continue;\n    strncpy(temp, u.ut_name, NAMELEN);\n\
    \    p = getpwnam(temp);\n    if (p == NULL) continue;\n    printf(\"%-10s %-10s\
    \ %-30s\\n\", u.ut_name, u.ut_line, p->pw_gecos, ctime(&u.ut_time));\n  }\n  fclose(fp);\n\
    \  exit(0);\n}\n```\n\n# Process groups\n\nProcesses (under UNIX, least) are organized\
    \ into process groups, generally corresponding to an entire job. When a single\
    \ shell command consists of a series of commands that pipe data from one to the\
    \ other, those processes (and their child processes) belong to the same process\
    \ group. Each process group has a process group header and a process group number\
    \ corresponding to the process group leader. The process group exists as long\
    \ as there is at least one process in the group, regardless of whether the process\
    \ group header terminates. The time when the process group is created to the time\
    \ when the last process in the group leaves is called the process group lifetime.\
    \ The last process in the group can terminate or enter into some other group.\n\
    \nA process joins an existing group or creates a process group using `setpgid()`\
    \ function.\n\nPrototype:\n```c\nint setpgid(pid_t pid, pid_t pgid);\n```\n\n\
    A process can set the process group ID of itself or one of its children.\n\n#\
    \ Sessions\n\nA session is a collection of one or more process groups. A new session\
    \ can be established by a process using the `setsid()` function.\n\nPrototype:\n\
    ```c\npid_t setsid(void);\n```\n\nIt returns an error if the process is already\
    \ a session header. If the process is not a process group header, then the process\
    \ becomes both session and group header, and the process group ID is set to the\
    \ process ID of the process.\n\nLet us see an example:\n\n```c\n#include <sys/types.h>\n\
    #include <unistd.h>\n#include <stdio.h>\nvoid main()\n{\n  pid_t pid;\n  printf(\"\
    The process group ID is %d\\n\", (int) getgrp());\n  setsid();\n  printf(\"The\
    \ new process group ID is %d\\n\", (int) getgrp());\n}\n```\n\n# Signals\n\nSignals\
    \ are asynchronous software interrupts that indicates that an event has occurred.\
    \ Signals are identified by their names and specified in the header file `<signal.h>`.\
    \ Signals are sent by the following:\n\n* One process to another (or itself)\n\
    * The Kernel to a process\n\nTable 3.1 shows the free signal available in the\
    \ BSD system:\n\n| Signal name | Signal number | Signal description |\n| :---\
    \ | :--- | :--- |\n| SIGHUP | 1 | Terminal line hangup |\n| SIGINT | 2 | Interrupt\
    \ program |\n| SIGQUIT | 3 | Quit program |\n| SIGILL | 4 | Illegal instruction\
    \ |\n| SIGTRAP | 5 | Trace trap |\n| SIGABRT | 6 | Abort |\n| SIGEMT | 7 | Emulate\
    \ instruction executed |\n| SIGFPE | 8 | Floating-point exception |\n| SIGKILL\
    \ | 9 | Kill program |\n| SIGBUS | 10 | Bus error |\n| SIGSEGV | 11 | Segmentation\
    \ violation |\n| SIGSYS | 12 | Bad argument to the system call |\n| SIGPIPE |\
    \ 13 | Write on a pipe with no one to read it |\n| SIGALRM | 14 | Real-time timer\
    \ expired |\n| SIGTERM | 15 | Software termination signal |\n| SIGURG | 16 | Urgent\
    \ condition on I/O channel |\n"
