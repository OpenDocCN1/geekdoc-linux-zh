- fmt: "\n- **Sockets**: UNIX sockets are used to establish communication between\
    \ two processes residing same or different machines. Just like other types of\
    \ files, sockets are also associated with a file descriptor.\n- **Symbolic link**:\
    \ A symbolic link is a special type of file that points to an existing file. It\
    \ is also call soft link. The file contents can be either accessed through the\
    \ file name or through the link name.\n- **FIFO**: `FIFO` that is First In First\
    \ Out is a file, which that has a directory entry and is accessed by pathname.\
    \ It works as a pipe between two processes.\n\n# UNIX file name convention\n\n\
    Every file or directory has an associated filename in the directory entry. Some\
    \ UNIX systems restrict the filename to 14 characters, and most other systems\
    \ allow 256 characters in the filename. In general, UNIX follows some naming conventions\
    \ for files:\n\n- File names are case-sensitive.\n- Almost all characters on the\
    \ keyboard are allowed in the filename except.\n  - `|| ; , ! @ # $ () <> / \\\
    \ “ ‘ `{} [] + = & ^ <space> <tab>`\n- Character delimiters are used to make file\
    \ name easy to read.\n- In UNIX file name does not specify its functionality.\n\
    \n# File names and meta characters\n\nThe shell expands the filename if it contains\
    \ `*`, `?`, and `[` characters. The `*` in the file name can be replaced with\
    \ 0 or more permissible characters, the `?` can be replaced with any single character\
    \ in the file name, and square brackets specify a range of particular combinations\
    \ of characters. The range of characters is specified using—in the square brackets.\
    \ If the first character inside the square bracket in `!` sign, the complement\
    \ of the range of other characters is used. *Table 1.4*\n\n| Pattern | Expansion\
    \ |\n| :--- | :--- |\n| `*` | All files are in the current directory. |\n| `?`\
    \ | All files with one character in the file name. |\n| `[a-h]` | One character\
    \ file name consisting a to d. |\n| `[abcdefgh]` | Same as above. |\n| `[a-ef-h]`\
    \ | Same as above. |\n| `*[0-9]` | File where the name ends with a number. |\n\
    | `?[0-9]` | Two character file name that ends with a number. |\n| `[a-zA-Z0-9]`\
    \ | File names that contain a single letter or number. |\n\n**Table 1.4:** Pattern\
    \ used for file naming\n\n**Note: In UNIX, the `.` is not a special character.\
    \ The file name may or may not contain a dot. Normally file names where the name\
    \ starts with a dot are not listed using the `ls` command.**\n\n# UNIX file system\n\
    \nEach disk drive is divided into various partitions. Each partition may contain\
    \ a file system. A file system consists of a sequence of logical blocks, each\
    \ consisting of 512, 1,024, or any other multiple of 512 bytes. The size of the\
    \ logical block within the filesystem is the same, but it can vary across the\
    \ different file systems.\n\nThe file system has the following structure, which\
    \ is described as follows:\n\nBoot block Super block Inode list Data blocks\n\n\
    The boot block is the first block and contains the bootstrapping code required\
    \ to boot the system. Although only one boot block is needed to boot the system,\
    \ every file system has an empty boot block.\n\nThe superblock describes the state\
    \ of the system and contains information including the following:\n\n- Size of\
    \ the file system\n- Number of free blocks\n- List of available free blocks\n\
    - Index of next free block\n- Size of inode list\n- Number of free inodes\n- List\
    \ of free inode\n- Flag to check whether the superblock has been modified\n\n\
    The inode list is a list of the inode. It contains entries for every index node\
    \ of a file. Inode contains:\n\n- File type\n- Permissions\n- Number of hard links\n\
    - Owner user-id\n- Group id\n- Size of the file\n- Time of last access\n- Time\
    \ of last modification and\n- location of data blocks\n\nFinally, data blocks\
    \ start at the end of the inode list and contain file data and administrative\
    \ data. An allocated data block belongs to only one file system.\n\n# Important\
    \ UNIX directories\n\n*Table 1.5* shows important UNIX directories related to\
    \ administrating the system resources, including users, files, processes, and\
    \ devices.\n\n| Directory | Description |\n| :--- | :--- |\n| `/` | Root-kernel.\
    \ |\n| `/etc` | Files are required to boot the system, communicate, and scripts\
    \ to control the boot process. |\n| `/etc/config` | System configuration option\
    \ files. |\n| `/etc/cron.d` | Cron access files and FIFO. |\n| `/etc/rc#.d` |\
    \ Operations performed when entering run level # (S,0,1,2,3). |\n| `/usr` | Directories\
    \ of system files. |\n| `/usr/bin` | System binary files. |\n| `/usr/etc` | Further\
    \ system communication and administration programs. |\n| `/usr/lib` | Libraries\
    \ of object files, send mail. |\n| `/var` | Directories for administrative programs.\
    \ |\n| `/var/adm` | Administrative programs and logs. |\n| `/var/log` | System\
    \ log. |\n| `/var/spool/mail` | Mail spool directory. |\n| `/var/mail` | Mail\
    \ spool directory. |\n| `/var/spool` | Directories for cron, logs, and so on.\
    \ |\n| `/dev` | Devices directory. |\n| `/home` `/usr/users` | User directories.\
    \ |\n| `/usr/local` | Locally installed files. |\n| `/tmp` | Contains temporary\
    \ files created in the system. |\n\n**Table 1.5:** Important directories\n\n#\
    \ Conclusion\n\nThe operating system is a special type of system software that\
    \ manages all operating resources to facilitate users to perform their work. UNIX\
    \ is a multi-user, multi-tasking portable operating system to facilitate text\
    \ processing, communication, and many other tasks. UNIX works in different environments.\n\
    \n- **Kernel**: Part of the operating system that resides in memory all time and\
    \ performs most essential tasks.\n- **Multiprocessing**: A technique that allows\
    \ a single processor to process multiple programs residing in the memory.\n- **Parent\
    \ process**: A job that controls one or many child processes it created.\n- **Child\
    \ process**: A process that is created and controlled by the parent process.\n\
    - **File**: Collection of data. File in UNIX typically includes ordinary file,\
    \ directory, and device files.\n- **File attributes**: Characteristics that describe\
    \ the file.\n- **init**: First non-kernel process, thus, parent of all processes.\n\
    - **Process**: Program under execution.\n- **Process ID**: Numeric identifier\
    \ of process.\n- **Directory**: Type of file that serves as a container for other\
    \ files and directories.\n\n# Test your skills\n\n1. **Which of the following\
    \ information is stored in the inode structure?**\n   - The file size\n   - The\
    \ name of the owner of the file\n   - The access permission for the file\n   -\
    \ All dates since the file was last modified or accessed\n   - The number of symbolic\
    \ links\n\n2. **Absolute path begins with the path from the root.**\n   - TRUE\n\
    \   - FALSE\n\n3. **Which of the following files in the current directory are\
    \ identified by the regular expression a?b*.**\n   - afile\n   - aab\n   - abb\n\
    \   - abc\n   - axbb\n   - abxy\n\n4. **Works as a command interpreter.**\n  \
    \ - Hardware\n"
