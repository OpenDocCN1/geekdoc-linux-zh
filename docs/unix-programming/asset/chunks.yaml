    current working directory, root directory, file mode creation mark, and so on.


    Effective IDs of the invoked process may change depending on the status of the
    set-user-ID and set-group-Id bits. If the set-user-ID bit of the new program is
    set, then the effective user-ID will become the owner ID of the program.


    # [Accessing user information](#toc.xhtml_s80a)


    There are a number of functions and system calls that let us access information
    about UNIX users.


    # [User details](#toc.xhtml_s81a)


    The passwd structure in the **`pwd.h`** header file contains the user information
    similar to **`/etc/passwd`** directory:


    `#include <pwd.h>`


    `struct passwd {`


    `char *pw_name;  /* name of the user */`


    `char *pw_passwd;  /* password */`


    `uid_t pw_uid;  /* user id*/`


    `gid_t pw_gid;  /* group id */`


    `time_t pw_change; /* validity and`


    `char *pw_class;  password class */`


    `char *pw_gecos;  /* full user name */`


    `char *pw_dir;  /* login directory */`


    `char *pw_shell;  /* user login shell */`


    `time_t pw_expire; /* password expiry date*/`


    `};`


    The **`passwd`** structure is returned by the **`getpwnam()`** and **`getpwuid()`**
    functions. It provides information about a user account. The **`getpwnam()`**
    and **`getpwuid()`** function searches the user database for an entry with a matching
    name or UID.


    The **`getuid()`** gets the user id of the logged-in user.


    Example of a program that prints details about the user is as follows:


    `#include <pwd.h>`


    `main()`


    `{`


    `struct passwd *pass;`


    `int uid;`


    `uid = getuid();`


    `pass = getpwuid(uid);`


    `printf(“Login name: %s\n”, pass->pw_name);`


    `printf(“Encrypted Password: %s\n”, pass->pw_password);`


    `printf(“User ID: %d\n”, pass->pw_uid);`


    `printf(“Group ID: %d\n”, pass->pw_gid);`


    `printf(“ Password Age: %s\n”, pass->pw_age);`


    `printf(“Comment: %s\n”, pass->pw_comment);`


    `printf(“Login Dir  %s\n”, pass->pw_pw_dir);`


    `printf(“Shell: %s\n”, pass->pw_shell);`


    `}`


    # [Group details](#toc.xhtml_s82a)


    The group structure in **`grp.h`** header file contains group information as in
    the following:


    **`/etc/grpup`**:


    `#include <grp.h>`


    `struct group {`


    `char *gr_name;  /* group name */`


    `char *gr_passwd; /* group password */`


    `gid_t gr_gid;  /* group id*/`


    `char **gr_mem; /* pointer to group member names */`


    `};`


    The **`getgid()`** gets the group id of the user, whereas **`getgrgid()`** populates
    the group structure.


    The following is the example to print group information:


    `#include  <grp.h>`


    `main()`


    `{`


    `int I;`


    `struct group *grp;`


    `grp = getgrgid(getgid());`


    `printf(“Group Name %s\n”. grp->gr_name);`


    `printf(“Group Password %s\n”. grp->gr_passwd);`


    `printf(“Group ID %s\n”. grp->gr_gid);`


    `printf(“Group Members :”);`


    `for (I = 0; grp->gr_mem[I];I++)`


    `printf(“\n: %s”, grp->gr_mem[I];`


    `}`


    # [Show information of all users logged in](#toc.xhtml_s83a)


    Struct **`utmp`** in **`utmp.h`** header file has information of logged in users
    as **`/etc/utmp`**, as shown following. We can populate this structure by reading
    logged in user information from **`/etc/utmp`** file:


    `struct utmp {`


    `char ut_user[8];  /* User login name */`


    `char ut_id[4];    /* /etc/inittab id(usually line 2  char ut_line[12];  /* device
    name (console, lnxx) */`


    `short ut_pid;   /* short for compat. - process id     short ut_type;   /* type
    of entry */`


    `struct exit_status ut_exit; /* The exit status of a process */`


    `time_t ut_time;   /* time entry was made */`


    `};`


    The following is a program to display information of logged in users:


    `#include <sys/types.h>`


    `#include <stdio.h>`


    `#include <utmp.h>`


    `#include <pwd.h>`


    `#define UTMP “/etc/utmp”`


    `#define NAMELEN 8`


    `main()`


    `{`


    `FILE *fp;`


    `struct utmp u;`


    `struct passwd *p;`


    `char temp[NAMELEN+1];`


    `fp = fopen(UTMP,”r”);`


    `while (!feof(fp))`


    `{`


    `fread(&u,sizeof(u),1,fp);`


    `if (u.ut_name == NULL) continue;`


    `strncpy(temp, u.ut_name, NAMELEN);`


    `p = getpwnam(temp);`


    `if (p == NULL) continue;`


    `printf(“%-10.8s %-10.8s %-30.30s %s\n”,u.ut_name, u.ut_line, p->pw_gecos, ctime(&u.ut_time));`


    `}  /*The ctime() converts time to ascii format.*/`


    `fclose(fp);`


    `exit(0);`


    `}`


    # [Process groups](#toc.xhtml_s84a)


    Processes (under UNIX, at least) are organized into process groups, generally
    corresponding to an entire job. When a single shell command consists of a series
    of filter commands that pipe data from one to the other, those processes (and
    their child processes) all belong to the same process group. Each process group
    has a process group header and a process group number corresponding to the process
    number of the process group leader.


    Process group header can create a process group and processes in the group. The
    process group exists as long as there is at least one process in the group, regardless
    of whether the process group header terminates. The time when the process group
    is created to the time when the last remaining process in the group leaves the
    group is called the process group lifetime. The last process in the group can
    terminate or can enter into some other group.


    A process joins an existing group or creates a new process group using setpgid()
    function.


    **Prototype:**


    `int setpgid(pid_t pid, pid_t pgid);`


    A process can set the process group ID of only itself or one of its children.


    # [Sessions](#toc.xhtml_s85a)


    A session is a collection of one or more process groups. A new session can be
    established by a process using the **`setsid()`** function.


    **Prototype:**


    `Pid_t setsid(void);`


    It returns an error if the process is already a process group header. If the process
    is not a process group header, then the process becomes both session and group
    header, and the process group ID is set to the process ID of the process.


    Let us see an example:


    `#include <sys/types.h>`


    `#include <unistd.h>`


    `#include <stdio.h>`


    `void main()`


    `{`


    `pid_t pid;`


    `printf(“The process group ID is %d\n”, (int) getpgrp());`


    `setsid();`


    `printf(“The new process group ID is %d\n”, (int) getpgrp());`


    `}`


    # [Signals](#toc.xhtml_s86a)


    Signals are asynchronous software interrupts that indicates that an event has
    occurred. Signals are identified by their names and specified in the header file
    **`<signal.h>`**. Signals are sent by the following:


    *   One process to another (or itself)


    *   The Kernel to a process


    *[Table 3.1](#c03.xhtml_tab3_1)* shows the free signal available in the BSD system:


    | **Signal name** | **Signal number** | **Signal description** |


    | SIGHUP | 1 | Terminal line hangup |


    | SIGINT | 2 | Interrupt program |


    | SIGQUIT | 3 | Quit program |


    | SIGILL | 4 | Illegal instruction |


    | SIGTRAP | 5 | Trace trap |


    | SIGABRT | 6 | Abort |


    | SIGEMT | 7 | Emulate instruction executed |


    | SIGFPE | 8 | Floating-point exception |


    | SIGKILL | 9 | Kill program |


    | SIGBUS | 10 | Bus error |


    | SIGSEGV | 11 | Segmentation violation |


    | SIGSYS | 12 | Bad argument to the system call |


    | SIGPIPE | 13 | Write on a pipe with no one to read it |


    | SIGALRM | 14 | Real-time timer expired |


    | SIGTERM | 15 | Software termination signal |


    | SIGURG | 16 | Urgent condition on I/O channel |'
