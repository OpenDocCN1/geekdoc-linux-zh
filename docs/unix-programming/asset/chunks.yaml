    and it returns a struct hostent, which contains a huge amount of information,
    including the IP address. Other information is the official hostname, a list of
    aliases, the address type, the length of the addresses, and the list of addresses.


    # [The hostent structure](#toc.xhtml_s146a)


    The hostent structure contains information about host in hosts database. The elements
    of the hostent structure are: host name, alternative name of the host, type of
    address type IPv4 or IPv6, length of address in bytes, address vector of hosts.


    `/* <netdb.h> */`


    `struct hostent { /* structure returned by network */`


    `char *h_name;  /* official name of host */`


    `char **h_aliases;  /* alias list */`


    `int h_addrtype;  /* host address type */`


    `int h_length;   /* length of address */`


    `char **h_addr_list;  /* list of addresses from name server */`


    `};`


    `/* h_addrtype */ /* always is AF_INET */`


    `/* h_length */ /* always is 4 */`


    `/* h_addr_list[] */ /* for multinode host */`


    `void main()`


    `{`


    `int i;`


    `struct hostent *he;`


    `struct in_addr addr;`


