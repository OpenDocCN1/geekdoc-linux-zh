    \ `delete()`, `read()`\n    4. `lseek()`, `stat()`, `link()`, `kill()`\n\n3. **The\
    \ mechanism that brings a page into memory when there is a page fault.**\n   \
    \ 1. Demand paging\n    2. Segmentation\n    3. Fragmentation\n    4. Page replacement\n\
    \n4. **The virtual memory manages the logical address space of a process.**\n\
