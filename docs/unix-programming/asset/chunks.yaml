  trans: "\n如果这些系统调用在 `select()` 或 `poll()` 中阻塞，而不是在实际 I/O 本身上阻塞，进程就会被阻塞。返回时，套接字是可读；也就是说，任何描述符上的数据已准备就绪，进程调用\
    \ `recvfrom()` 获取实际数据。\n\n这种模式的优点是进程可以等待多个文件描述符准备就绪。如 *图 5.4* 所示，应用程序执行 `select()`\
    \ 系统调用；如果服务器端数据未就绪，应用程序将阻塞该系统调用，但应用程序本身将处于运行模式。一旦数据可用，应用程序执行 `recefrom()` 函数从内核接收数据并立即返回。\n\
    \n![](img/Figure-5.4.jpg)\n\n**图 5.4：** 多路复用 I/O 模型的框图\n\n这种模型的缺点是它需要两个系统调用而不是一个。\n\
    \n# 信号驱动的 I/O 模型\n\n在该模型中，内核通过发送 SIGIO 信号通知进程数据可用。如 *图 5.5* 所示，应用程序使用 `sigaction()`\
    \ 函数启用信号处理器。启用后，应用程序继续执行。一旦内核端数据可用，内核向应用程序发送一个 SIGIO 信号。SIGIO 信号由应用程序端的信号处理器处理。现在，应用程序调用\
    \ `receivfrom()` 函数从内核接收数据，当数据完全写完成后，它开始执行。\n\n![](img/Figure-5.5.jpg)\n\n**图\
    \ 5.5：** 信号驱动 I/O 模型的框图\n\n最初，套接字被设置为信号驱动 I/O。执行 `sigaction()` 系统调用以安装一个处理 I/O\
    \ 的信号处理器。一旦安装了处理器，系统调用就会返回不再阻塞进程。一旦数据报准备就绪，内核向进程发送 SIGIO 信号。进程随后可以通过调用 `recvfrom()`\
    \ 系统调用从信号处理器读取数据报，或者进程的主函数也可以读取数据报。\n\n在此模式下，进程在等待数据报到达时不会被阻塞；而是继续执行。一旦数据报准备到达，进程就会收到信号处理器的通知。\n\
    \n# 异步 I/O 模型\n\n在这种 I/O 模式下，调用 `io_read()` 函数向内核定义描述符、缓冲区指针、缓冲区大小（与 `read()`\
    \ 函数相同）、文件偏移量以及数据到达的通知方法。当整个操作完成后，系统调用立即返回。这不需要在等待 I/O 完成时阻塞进程。系统模型如图 *图 5.6*\
    \ 所示。\n\n![](img/Figure-5.6.jpg)\n\n**图 5.6：** 异步 I/O 模型的框图\n\n这种模型与信号驱动 I/O 非常不同，因为只有在数据复制到应用程序缓冲区之后才会生成信号。\n\
    \n# 名称和地址转换\n\nDNS 用于在主机名和 IP 地址之间进行映射。主机可以是简单的名称（solaris），也可以是完全限定域名（FQDN）（如[solaris.kohala.com](http://solaris.kohala.com)）。\n\
    \n# 资源记录\n\nDNS 条目被称为资源记录（RRs）。它定义了关于域名的所有信息，包括资源类型、协议族、服务器可以缓存 RR 的秒数、数据字段长度以及资源数据。下表描述了不同类型的资源记录。\n\
    \n| **资源记录类型** | 映射 |\n| :--- | :--- |\n| A | 将主机名映射到 32 位 IPv4 地址 |\n| AAAA |\
    \ 将主机名映射到 128 位 IPv6 地址 |\n| PTR | 将 IP 地址映射为主机名。对于 IPv4，反转 4 个字节，并将每个字节转换为十进制\
    \ ASCII 值（0-255）。然后追加 `.addr.arpa`。对于 IPv6 地址，反转 128 位地址的 32 个 4 位半字节（nibbles）。每个半字节转换为其相应的十六进制\
    \ ASCII 值（0-9-a-f），并追加 `ip6.int`。 |\n| MX | 指定主机的邮件交换记录。 |\n| CNAME | 规范名称，例如为\
    \ FTP、WWW 等常用服务分配 CNAME。 |\n\n**表 5.2：** 资源类型及其映射\n\n# gethostbyname() 函数\n\n\
    `gethostbyname()` 函数获取当前主机机名，并返回对应的 IP 地址作为参数传递给 `connect()` 函数。它对 A 和 AAAA 记录进行查询并返回\
    \ IPv4 和 IPv6 地址。\n\n**原型**\n\n```c\n#include <netdb.h> /* Berkeley */\nstruct\
    \ hostent *gethostbyname (const char *hostname);\n```\n\n`gethostbyname()` 的参数是一个类似于\
    \ `[www.yahoo.com](http://www.yahoo.com)` 的字符串，它返回一个 `struct hostent` 结构体，其中包含大量信息，包括\
    \ IP 地址。其他信息是官方主机名、别名列表、地址。\n\n# hostent 结构\n\n`hostent` 结构包含了主机信息。`hostent` 结构元素是：名称、别名、地址类型、地址。\n\
    \n```c\n/* <netdb.h> */\nstruct hostent {\n  char *h_name;     /* 官方名称 */\n  char\
    \ **h_aliases; /* 别名列表 */\n  int h_addrtype;   /* 地址类型 */\n  int h_length;   \
    \  /* 长度 */\n  struct in_addr **h_addr; /* 地址列表 */\n};\n```\n\n`gethostbyname()`\
    \ 执行查询 A 和 AAAA 记录并返回 IPv4 和 IPv6 地址。\n\n# gethostbyaddress() 函数\n\n`gethostbyname()`\
    \ 函数获取当前主机名，并返回对应的 IP 地址以作为 `connect()` 函数的参数。\n\n**原型**\n\n```c\n#include <netdb.h>\n\
    struct hostent *gethostbyaddr(const char *addr, int len, int type);\n```\n\n`gethostbyaddr()`\
    \ 返回一个 `hostent` 结构，包含主机名和其他等信息。对于 TCP/IP，第一个参数 `addr` 应该指向 `struct in_addr` 或网络字节序的无符号整数，`len`\
    \ 通常为 `sizeof(struct in_addr)`，`type` 应该是 `AF_INET`。\n\n主机信息可以通过解析器或在系统的 `/etc/hosts`\
    \ 文件找到。\n\n```c\nmain()\n{\n  const char *ipstr = \"66.94.230.32\";\n  struct\
    \ in_addr addr;\n  struct hostent *hp;\n  if (!inet_aton(\"66.94.230.32\", &addr))\
    \ {\n    errx(1, \"无法解析 IP 地址 %s\", ipstr);\n  }\n  if ((hp = gethostbyaddr(&addr,\
    \ sizeof addr, AF_INET)) == NULL) {\n    errx(1, \"与 %s 无关联名称\", ipstr);\n  }\n\
    \  printf(\"主机名: %s\\n\", hp->h_name);\n  exit(0);\n}\n```\n\n输出是请求 URL 的官方名称和\
    \ IP 地址。\n\n# [Resolver]\n\n`gethostbyname()` 和 `gethostbyaddress()` 函数使用 `resolver()`\
    \ 库函数获取主机信息。`resolver()` 函数读取 `/etc/resolv.conf` 以获取 DNS 服务器的 IP 地址。\n\n# getservbyname()\
    \ 和 getservbyport() 函数\n\n`getservent()` 函数读取服务数据库以识别服务器。\n\n`getservbyname()`\
    \ 搜索服务数据库，以识别与指定名称和服务协议匹配的服务，并在必要时打开连接。\n\n"
- fmt: "\nThe `getservbyport()` searches the service database to identify the service\
    \ with given port and specified protocol and opens the connection if necessary.\n\
    \nAll these three functions search the database in a sequential manner until a\
    \ match is found or until EOF occurs.\n\n### Prototype\n\n```c\n#include <netdb.h>\n\
    \nstruct servent *getservbyname (const char *servname, const char *protname);\n\
    \nstruct servent *getservbyport (int port, const char *protname);\n```\n\nThe\
    \ `servent` structure is as follows:\n\n```c\nstruct servent {\n    char    *s_name;\n\
    \    char    **s_aliases;\n    int     s_port;\n    char    *s_proto;\n};\n```\n\
    \nThe members of this structure are:\n\n*   `s_name`: The official name of the\
    \ service.\n*   `s_aliases`: A zero-terminated list of alternate names for the\
    \ service.\n*   `s_port`: The port number at which the service resides. Port numbers\
    \ are returned in network byte order.\n*   `s_proto`: The name of the protocol\
    \ to use when contacting the service.\n\nThese functions use static data storage;\
    \ if the data is needed for future use.\n\n### Conclusion\n\nThe socket is an\
    \ interface between client and server either residing in a single system, on a\
    \ network, or across different networks to send and receive information. The client\
    \ program sends a request of data to the server through connections oriented or\
    \ a connection less interface. In this chapter, all concepts related to socket\
    \ programming have been discussed. These include different types of sockets, functions\
    \ to establish a connection, and sending and receiving messages between client\
    \ and server. In this chapter, we discussed about socket programming for communication\
    \ in a UNIX environment. There various other environments are also available for\
    \ the UNIX platform user may customize these environments. We will discuss these\
    \ environments in the upcoming chapter.\n\n### Review Exercise\n\n1. From the\
    \ command line, read (1) the URL from which you can extract the name of the remote\
    \ WWW server and the file to retrieve and (2) the server port number. Create a\
    \ socket that is connected to the server machine at the specified port (e.g.,\
    \ HTTP port 80) [getservbyname, gethostbyname, socket, connect].\n2. What information\
    \ does a process running on one host to identify a process running on another\
    \ host use?\n3. Does a server program request and receive services from a client\
    \ program?\n4. Create the socket using `socket()`, convert the hostname to an\
    \ IP address using `gethostbyname()`, and then issue the `connect()` call, passing\
    \ the relevant structures containing the IP address and port to connect to.\n\n\
    # CHAPTER 6: Memory Management\n\nMemory is considered as an important resource\
    \ in computers, and memory management is the process of managing the computer\
    \ memory, which consists of primary memory and secondary memory. The purpose of\
    \ memory management is to efficiently allocate the different types of available\
    \ memories among processes that are running or residing in the system. It keeps\
    \ track of which parts of memory are in use and which parts are not in use to\
    \ allocate memory to processes when they need it. The memory allocated to the\
    \ running process is deallocated once the process terminates so that it can be\
    \ given to another process requesting the memory resource. UNIX operating system\
    \ implements swapping and demand paging techniques to manage the system’s memory.\
    \ This chapter discusses all concepts and techniques used for the proper management\
    \ of memory resources.\n\n### Structure\n\nIn this chapter, we will cover the\
    \ following topics:\n\n*   Memory management\n    *   Use of operating system\
    \ memory\n    *   Memory contents of the running process in UNIX\n    *   Swapping\n\
    \    *   Implementation of memory management functions\n*   Memory management\
    \ functions\n*   Setting branch to another function\n\n### Objective\n\nAfter\
    \ reading this chapter, the reader will be able to know how UNIX is written in\
    \ C and how UNIX operating system is used extensively for programming in C. In\
    \ this section chapter, we will study some UNIX and C interface concepts such\
    \ as:\n\n*   To understand the use of different types of memory resources in the\
    \ UNIX operating system.\n*   To understand different memory management techniques\
    \ such as swapping and demand paging.\n*   To understand system calls and memory\
    \ management functions.\n*   To understand context switching during the function\
    \ call.\n\nSystem calls and library functions:\n\n*   Command-line arguments and\
    \ environment variables.\n*   multitasking in C in UNIX using `fork()`, `exec()`.\n\
    *   Process synchronization using `wait()`.\n*   Accessing user information using\
    \ system calls.\n*   Sharing of data and inter-process communication mechanisms.\n\
    *   Socket programming fundamentals.\n\n### Memory management\n\nThe memory management\
    \ component of the UNIX Kernel manages the contents of processor memory. UNIX-like\
    \ operating systems use sophisticated memory management algorithms for the efficient\
    \ use of memory resources. In UNIX, there are three different types of memory\
    \ resources, including main and secondary memory:\n\n*   **Main:** Physical memory\
    \ available on the CPU motherboard is called main memory. This does not include\
    \ processor caches, video memory, or other peripheral memory.\n*   **File system:**\
    \ Physical memory, available on the local disk or on the network and accessible\
    \ through pathname. This does not include raw devices, tape drives, swap space,\
    \ or other storage not addressable via normal pathnames.\n*   **Swap device:**\
    \ A swap device is a physical memory available on the disk to hold data that is\
    \ not in RAM or in the file system. A swap device can be used efficiently when\
    \ it is on a separate disk or partition.\n\n### Use of operating system memory\n\
    \nFor efficient management of memory resources, it is kept reserved for both the\
    \ operating system’s own functions and for the processes being executed. Some\
    \ part of memory is always reserved and cannot be used for users’ processes.\n\
    \n*   **Kernel memory:** It is the operating system’s private memory always available\
    \ on the main memory.\n*   **Cache memory:** It is part of the main memory to\
    \ hold elements of the file system and I/O operations. Cache memory does not include\
    \ CPU cache disk drive.\n*   **Virtual memory:** Virtual memory includes the total\
    \ addressable memory of all processes running on the machine. The total address\
    \ space of the process can be spread over all three types of memories.\n\n###\
    \ Memory contents of a running process in UNIX\n\nA process on UNIX uses memory\
    \ to hold its data, stack, and mapped files:\n\n*   **Data segment:** This includes\
    \ allocated memory to hold process data.\n*   **Stack segment:** This segment\
    \ of the process holds the execution stack and is fully managed by the operating\
    \ system.\n*   **Mapped files:** This section of the process includes files contents\
    \ accessed within the process memory space.\n\n### Swapping\n"
