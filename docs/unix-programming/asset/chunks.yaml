    # [The while command](#toc.xhtml_s237a)


    The **`while`** command lets you loop as long as the condition is true. The condition
    is tested; if its exit status is zero, the command list enclosed between doing
    and done is executed repeatedly till the condition remains true.


    `while condition`


    `do`


    `command list`


    `[break]`


    `[continue]`


    `done`


    The command list enclosed between do and done may never be executed if the exit
    status of the condition is non-zero.


    A simple script to illustrate a while loop is as follows:


    `#!/bin/sh`


    `while [ $# -gt 0 ]`


    `do`


    `echo $1`


    `shift`


    `done`


    This script takes the list of arguments, echoes the first one, then shifts the
    list to the left, losing the original first entry. It loops through until it has
    shifted all the arguments on the argument list.


    **`$ ./while.sh one two three`**


    **`one`**


    **`two`**


    **`three`**


    # [The until command](#toc.xhtml_s238a)


    The **`until`** is a control command used for executing a set of statements until
    the condition is true. As soon as the condition becomes false, the control moves
    out of the until loop.


    `until condition`


    `do`


    `command list while condition is false`


    `done`


    The condition is tested at the start of each loop, and the loop is terminated
    when the condition is true. The until construct is similar to while only it executes
    command list as long as condition after until returns non-zero status.


    A script equivalent to the preceding example is as follows:


    `#!/bin/sh`


    `until [ $# -le 0 ]`


    `do`


    `echo $1`


    `shift`


    `done`


    Notice, though, that here, we are testing for less than or equal, rather than
    greater than or equal, because the until the loop is looking for a false condition.
    Both the until and while loops are only executed if the condition is satisfied.
    The condition is evaluated before the commands are executed.


    Same as while the command list between do and done might never be executed if
    the condition returns zero status the first time it is tested.


    # [The for command](#toc.xhtml_s239a)


    One way to loop through a list of string values is with the for command.


    `for variable [in list_of_values]`


    `do`


    `command list`


    `done`


    The **`list_of_values`** is optional, with **`$@`** assumed if nothing is specified.
    Each value in this list is sequentially substituted for a variable until the list
    is emptied. Wildcards can be used and are applied to file names in the current
    directory.


    Here is a for loop for copying all files ending in old to similar names ending
    in .new. In these examples, the basename utility extracts the base part of the
    name so that we can exchange the endings.


    `#!/bin/sh`


    `for file in *.old`


    `do`


    `` newf=`basename $file .old` ``


    `cp $file $newf.new`


    `done`


    # [The break command](#toc.xhtml_s240a)


    The **`break`** command is used to make an immediate exit from the loop.


    When **`break`** command is executed, control immediately switches to the next
    statement written just after the loop, and then the program continues as normal.


    Condition status within the loop construct serves no purpose but returns zero
    or non-zero depending upon the loop in which the break command is used.


    Following is an example using the **`break`** command:


    `while :`


    `do`


    `read  -p  “Enter integer number ; ‘ a`


    `if  [ $a  -eq -1 ]`


    `then`


    `break`


    `fi`


    `done\`


    `echo $a`


    # [The continue command](#toc.xhtml_s241a)


    The **`continue`** command passes control to the next iteration of the loop bypassing
    the remaining command in the loop body.


    Following is an example of the shell script to display even numbers:


    `for number in 1 2 3 4 5 6 7 8`


    `do`


    `case $number in (1| 3|5 |7) continue`


    `esac`


    `echo $number`


    `done`


    It will give the output **`2  4  6  8`**.'
