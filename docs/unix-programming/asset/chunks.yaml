    \ scope for multi-programming\n    3. It extends the address space\n    4. It\
    \ reduces external fragmentation as well as internal fragmentation.\n\n# Answers\
    \ (#toc.xhtml_s167a)\n\n1. **(a)**\n2. **(c )**\n3. **(b)**\n4. **(b)**\n5. **(a)**\n\
    6. **(a)**\n7. **(b)**\n\n# Questions (#toc.xhtml_s168a)\n\n1. What is the main\
