    # The C shell family


    The C shell family consists of a C shell (`/bin/csh`) and its derivative `tcsh`
    (`/bin/tcsh`).


    The C shell was developed by BILL joy in Berkeley and contained the command, which
    looks like C statements. The compatible version of the C shell is `tcsh`, which
    is used in LINUX. The C-like commands in the C shell were intended to improve
    programming because programmers were familiar with the C language at Berkeley.
    TENEX/TOP is the new version of the C shell, which allows scrolling through the
    command history, and command listing is possible through arrow keys.


    The C shell has become popular for interactive use because of its improved features:


    * **Command history:** Previously executed commands can be recalled for further
    execution. These commands can be re-edited before execution.

    * **Command aliases:** Short mnemonic names can be given to the commands.

    * **Filename completion:** C shell automatically completes the filename by just
    writing a few characters of the filename.

    * **Job control:** The C shell executes multiple processes. The concurrent processes
    are controlled using jobs commands.


    The C shell is used for writing scripts because of the following reasons:


    * Lazy interpreter

    * Lack of functions

    * Weak input and output


    # Summary of features


    The following table shows the summary of features provided by the different shells:


    | | Command history | Command alias | Shell scripts | Filename completion | Command-line
    editing | Job control |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | Bourne | N | N | Y | N | N | N |

    | C | Y | Y | Y | Y* | N | Y |

    | TC | Y | Y | Y | Y | Y | Y |

    | Korn | Y | Y | Y | Y* | Y* | Y |

    | BASH | Y | Y | Y | Y | Y | Y |


    **Table 7.1:** Shell wise features


    # Meta character and wild cards


    Shell metacharacters are special symbols that the shell interprets rather than
    passing them to the command.


    The list of metacharacters is as follows:


    | Meta character symbol | Meaning |

    | :--- | :--- |

    | ? | Filename substitution wild card single character |

    | * | Filename substitution wild card multiple characters |

    | [] | Filename substitution wild card any character between brackets |

    | < | Input redirection |

    | << | Input redirection (here, document) |

    | > | Output redirection |

    | >> | Output redirection (append) |

    | # | Comment |

    | () | Command grouping |

    | “cmd” | Command substitution |

    | $(Cmd) | Command substitution |

    | \| | Pipe |

    | ; | Command sequence |

    | & | Run command in the background |

    | \| | OR logical operator |

    | && | AND logical operator |

    | $ | Expand the value of the variable |

    | \ | Avoid interpretation of the next character |


    **Table 7.2:** Metacharacters for file name substitution


    Sometimes it is required not to interpret these symbols by the shell. Shell provides
    three different options to prevent the interpretation of these metacharacters
    (discussed in the next section).


    # Command standard input/output


    In the UNIX system, a program including many UNIX commands is aromatically connected
    to the terminals. Terminals are represented by generic files. A command takes
    input from a generic file when no filename/pathname is specified and sends the
    output to the generic file when no filename/pathname is specified. By default,
    generic file (terminal) through which input is provided is called standard input;
    the generic file (terminal) to which the command’s output is displayed is called
    standard output and sends any error message to standard error. When the command
    is reading input from standard input and writing output to the standard output,
    it means that it is reading from the keyboard and writing to the screens, as shown
    in [figure 7.2](#c07.xhtml_fig7_2).


    ![](images/Figure-7.2.jpg)


    **Figure 7.2:** Standard I/O


    In UNIX, standard input is accessed by a generic file named `stdin`, standard
    output is accessed by a generic file named `stdout`, and standard error is accessed
    by a generic file named `stderr`. In UNIX, every file has a number associated
    with it. All operations performed on the file are actually performed on the associated
    file descriptor. The generic file for standard output, standard input, and standard
    error is always open and access to the command or program that runs. These generic
    files also have associated file descriptors to be accessed and modified. The file
    descriptors reserved for standard I/O are as follows:


    | Filename | File descriptor |

    | :--- | :--- |

    | `stdin` | 0 (Keyboard) |

    | `stdout` | 1 (Screen) |

    | `stderr` | 2 (Screen) |


    **Table 7.3:** File descriptors for standard files


    **Note: Some commands do not take input from standard input.**


    **Example: cat file1**


    # Redirection


    By default, each command or program is connected to a standard file for input
    and output. This default assignment can be changed temporarily using redirection.
    Redirection is the process of specifying which file will be used in place of any
    of the standard generic files to provide input or to take the output from the
    command.


    # Output redirection


    Execution of the program always generates some output on the shell prompt; however,
    there are some situations when output is required to be directed elsewhere, such
    as:


    * If output of the program is required to be transferred directly to the printer.

    * If the output is required to be used later.

    * If a lot of output is generated from the program, it is difficult to see all
    the output because the screen scrolls very rapidly.


    In all these situations, the output can be redirected elsewhere, either to the
    file or to the printer.


    There are two basic redirection operators for standard output `>` and `>>`. Think
    `>` symbol as an arrow pointing output of the command to the file that is to receive
    the output. The choice of operator used will be dependent on how the user wants
    to handle the output. If the user wants that file should contain the output of
    the current command only, the `>` operator will be used. In this case, if a file
    already contains something, that will be replaced by the output of the current
    command.


    **Example:**


    ```bash

    $ls -l > file1

    ```


    Symbol `>` is recognized as the special output redirection, and the word next
    to this symbol is treated as the file name.


    In the preceding example, the output of `ls -l` command is redirected to the file
    `file1`. If `file1` already exists, its contents are replaced by the current output.
    The command being executed is not concerned with where the output is redirected.


    **Note: If file1 does not already exist, UNIX creates the file and copies the
    output.**


    If a user wants to append the output of the current command to the file, the token
    for redirection is two `>>` signs. If the file does not already exist, UNIX creates
    the file and redirects the output.


    Consider an example of joining two files one after another:


    ```bash

    $cat file1 >> file2

    ```


    In the preceding example, the contents of `file1` will be copied to `file2`.


    # Safe I/O redirection with noclobber


    The noclobber shell variable in c shell or noclobber option in bash and ksh prevents
    accidentally destroying the contents of a file. Reconsider the redirection example:


    ```bash

    $ls –l > file1

    ```


    In this example, if `file1` already exists, its contents are replaced by the output
    of the command `ls –l`. If noclobber option is turned on, it prevents destroying
    the contents of the file; instead, it generates an error message.


    The command for setting noclobber is as follows:


    ```bash

    % set noclobber ( C shell)

    $ set –o noclobber



    **Note: If the user explicitly wants to replace an existing file during redirection,
    an exclamation (!) is required to be placed after the output redirection operator.**


    **Example:**


    ```bash

    %  ls - l > ! file1

    ```

