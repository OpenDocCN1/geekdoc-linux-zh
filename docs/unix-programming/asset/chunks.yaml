    \ buffer);\n        else\n        printf (“Error in reading datafile\\n”);\n \
    \       close (fd);\n    }\nelse\n    printf(“\\n File already exists\\n”);\n\
    \    exit(0);\n}\n```\n\n在给出的示例中，它首先创建一个既可读可写的文件。如果文件已以同名存在，它会打印消息 `File already\
    \ exists`。一旦文件创建，就会将消息 `File programming in C` 写入其中。在下一步中，文件指针被设置为文件的开头，并执行读取操作。它检查读取的内容是否与消息一致；如果是，则打印该消息；否则打印错误消息。\n\
    \n# `write` 函数\n\n`write` 函数将数据从缓冲区写入文件。要写入的字节数作为系统调用的第三个参数给出。成功时返回写入的字节数。错误时写入\
