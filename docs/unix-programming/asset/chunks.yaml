    *   `n1 -ge n2`: True if integer `n1` is greater than or equal to integer `n2`.

    *   `n1 -lt n2`: True if integer `n1` is less than integer `n2`.

    *   `n1 -le n2`: True if integer `n1` is less than or equal to integer `n2`.


    Following is an example of a program for numeric comparisons:


    ```bash

    #compare.sh

    echo “Enter two numbers”

    read n1 n2

    if test $n1 –eq $n2

    then

    echo “The numbers are equal”

    elif test $n1 –gt $n2

    then

    echo $n1 is greater than $n2

    else

    echo $n2 is less than $n1

    fi

    ```


    It will be as two numbers to enter. If both the numbers are equal, it will print
    `The numbers are equal`; otherwise, then it will test the greater number and print
    the message accordingly.


    The `test` command can also be represented using `[` and `]` without the `test`
    operator.


    For example:


    ```bash

    if [ -d $fname ]

    then

    Echo “$fname is a directory”

    else

    Echo “$fname is a file”

    fi

    ```


    ## Logical operators with test


    The following logical operators are also available:


    ### The negation operator (!)


    The `!` unary operator can be used with a `test` command to negate the result
    of the evaluation of any expression.


    ```bash

    [ ! –r /users/home/data]

    ```


    Condition will evaluate true if directory `/user/home/data` is not readable.


    ### The logical AND operator


    The `-a` and (binary) operators perform logical AND of two expressions with `test`
    command.


    ```bash

    [ -f $file1 –a –r $file1 ]

    ```


    The preceding condition will evaluate true if variable `file1` contains an ordinary
    file and it is readable.


    ### The logical OR operator


    The `-o` or (binary) performs logical or of two expressions with `test` command.


    ```bash

    [ -f $file1 –o -r $file1 ]

    ```


    The preceding condition will evaluate true if variable `file1` contains either
    an ordinary file, or it is readable.


    ## Control commands


    Bourne shell has control commands such as `if-then-else` construct, `case` construct,
    loops, and expression evaluation.


    ### Conditional if


    This is the basic control flow mechanism. It uses the `if`, `elif`, and `else`
    commands/keywords to control the flow of the process.


    ```bash

    if condition1

    then

    command list if condition1 is true

    [elif condition2

    then

    command list if condition2 is true]

    [else

    command list if condition1 is false]

    fi

    ```


    The conditions to be tested for are usually done with the `test` command. The
    `if` and `then` must be separated, either with a `<newline>` or a semicolon (`;`).


    Following is an example to check number of command line arguments:


    ```bash

    #!/bin/sh

    if [ $# -ge 2 ]

    then

    echo $2

    elif [ $# -eq 1 ]; then

    echo $1

    else

    echo No input

    fi

    ```


    There are required spaces in the format of the conditional test, one after `[`
    and one before `]`. This script should respond differently depending upon whether
    there are zero, one, or more arguments on the command line. First with no arguments:


    `$ ./if.sh`

    `No input`


    Now with one argument:


    `$ ./if.sh one`

    `one`


    And now with two arguments:


    `$ ./if.sh one two`

    `two`


    ### Conditional case


    To choose between a set of string values for a parameter use `case` in the Bourne
    shell:


    ```bash

    case parameter in

    pattern1[|pattern1a]) command list1;;

    pattern2) command list2

    command list2a;;

    pattern3) command list3;;

    *) ;;

    esac

    ```


    You can use any valid filename meta-characters within the patterns to be matched.
    The `;;` ends each choice and can be on the same line, or following a `<newline>`,
    as the last command for the choice.


    Additional alternative patterns to be selected for a particular case are separated
    by the vertical bar, `|`, as in the first pattern line in the preceding example.
    The wildcard symbols, `?` to indicate any one character and `*` to match any number
    of characters, can be used either alone or adjacent to fixed strings.


    This simple example illustrates how to use the conditional case statement:


    ```bash

    #menu.sh

    clear

    echo “Press 1 to see directory listing “

    echo “Press 2 to see users logged in”

    echo “Press 3 to quit”

    case choice in

    1)ls;;

    2)who;;

    3)exit;;

    *)echo “Unknown option”

    esac

    ```


    ### The while command


    The `while` command allows you to execute a block as long as a condition is true.


    ```bash

    while condition

    do

    command list

    done

    ```


    The conditions to be tested for are usually done with the `test` command. The
    `if` and `then` must be separated, either with a `<newline>` or a semicolon (`;`).


    Following is an example to check number of command line arguments:


    ```bash

    #!/bin/sh

    if [ $# -ge 2 ]

    then

    echo $2

    elif [ $# -eq 1 ]; then

    echo $1

    else

    echo No input

    fi

    ```


    There are required spaces in the format of the conditional test, one after `[`
    and one before `]`. This script should respond differently depending upon whether
    there are zero, one, or more arguments on the command line. First with no arguments:


    `$ ./if.sh`

    `No input`


    Now with one argument:


    `$ ./if.sh one`

    `one`


    And now with two arguments:


    `$ ./if.sh one two`

    `two`


    ### The break command


    The `break` command is used to make an immediate exit from the loop.


    When `break` command is executed, control immediately switches to the next statement
    written just after the loop, and then the program continues as normal.


    Condition status within the loop construct serves no purpose but returns zero
    or non-zero depending upon the loop in which the `break` command is used.


    Following is an example using the `break` command:


    ```bash

    while :

    do

    read -p “Enter integer number ; ” a

    if [ $a -eq -1 ]

    then

    break

    fi

    done

    echo $a

    ```


    ### The continue command


    The `continue` command passes control to the next iteration of the loop bypassing
    the remaining command in the loop body.


    Following is an example of the shell script to display even numbers:


    ```bash

    for number in 1 2 3 4 5 6 7 8

    do

    case $number in (1| 3|5 |7) continue

    esac

    echo $number

    done

    ```


    It will give the output `2 4 6 8`.

