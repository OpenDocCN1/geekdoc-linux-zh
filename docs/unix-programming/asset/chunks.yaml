    # [Functions](#toc.xhtml_s244a)


    The Bourne shell has a function facility too. These are somewhat similar to aliases
    in the C shell but allow more flexibility. The function is reusable code that
    can be later called from UNIX code.


    A function has the form:


    `fcn () { command; }`


    Where the space after {, and the semicolon (;) are both required; the latter can
    be dispensed with if a <newline> precedes the }. Additional spaces and <newline>’s
    are allowed.


    `ls() { /bin/ls -sbF “$@”;}`


    `ll() { ls -al “$@”;}`


    The first one redefines **`ls`** so that the options **`-sbF`** are always supplied
    to the standard **`/bin/ls`** command and acts on the supplied input, **`“$@”`**.
    The second one takes the current value for **`ls`** (the previous function) and
    tacks on the **`-al`** options. Functions are very useful in shell scripts.


    # [Passing arguments to function](#toc.xhtml_s245a)


    Positional parameters $1, $2, …, $*n* are used arguments to the function. White
    spaced set of strings is used to assign the values to the positional parameters
    during the function call. For example:


    `Shell__fun ()`


    `{`


    `echo $1`


    `echo $2`


    `}`


    To assign values to **`$1`** and **`$2`**, the function will be called as follows:


    **`Shell_fun “hell” World”`**


    # [Returning from function](#toc.xhtml_s246a)


    Shell function returns the control in four different ways:


    *   Changes the states of the local variables within the function.


    *   Using **`exit`** command to terminate shell script.


    *   Using the return command to exit from the function and return a value to the
    calling section of the shell script.


    *   echo the output to the terminal.


    Following is an example script to explain returning from a function:


    `fun_ret.sh`


    `fun1_ret()`


    `{`


    ``c=`expr $1 = $2’``


    `return`


    `}`


    `Fun1_ret 10 20`


    `ret=$?`


    `echo   sum is $ret`


    Save and execute script **`fun_ret.sh`**:


    **Output is:**


    **`Sum is 30`**


    # [Trapping signals](#toc.xhtml_s247a)


    A process running in UNIX can receive signals and respond to them. For example,
    when we give the **`kill –9`** command, we send signal Number 9 to the process
    to abort it. UNIX lets you alter the effects of signals using a trap.


    # Trap command signal list


    Trap waits for the signal given in the signal list. If a signal shows up, it executes
    the command.


    Consider the following example:


    `#myfile.sh`


    `file=$1`


    `pat=$2`


    `trap ‘rm –f  test.$$’ 1 2 15`


    `if grep $pat $file > test.$$`


    `then`


    `echo “Pattern found”`


    `else`


    `echo  “Pattern not found”`


    `fi`


    `rm –f test.$$`


    So, if we send an interrupt before the program reaches the trap line, the interrupt
    will act in the usual way; that is, it will terminate the program. If the interrupt
    is sent after the program has read this line, the commands in the trap will be
    executed.


    # [Arrays](#toc.xhtml_s248a)


    Bourne and C shell do not support arrays, but bash and Korn shell support arrays.
    The array facility provided by Korn shell is limited to one dimension and can
    have a maximum of 1,024 elements.


    Array elements can be assigned in two ways. One is to use the standard variable
    assignment method with the array index operator []. For example:


    `my_arr [3]= arr3`


    The value **`arr3`** is assigned to the element of **`my_arr`** with Index **`3`**.


    The second method to assign values to the array elements is using a variant of
    the set command. For example:


    `set –A my_arr arr1 arr2 arr3---`


    This will assign arr1 to the variable **`my_arr[0]`**, **`arr2`** to the variable
    **`my_arr[1],`** and so on. If the array is not already created, it first creates
    and then assigns values to the corresponding array indices.


    An array element can be referred to in the same manner as other shell variables.
    For example, i-th index of array **`my_arr`** can be referred as **`$ my_arr [i]`**.
    Index **`i`** can be generated using mathematical expressions. If **`*`** is placed
    in the place of the index, it will refer to all elements of the array separated
    by space. Omitting i will automatically be replaced by index 0.


    The shell provides **`#`** operator to count total elements in the array. For
    example **`$ { # my_arr [*]}`** will refer to all the elements of array **`my-arr`**.


    **`$ksh`** invokes the Korn shell.


    We can declare and set values to an array as follows:


    **`$myarr={10 23 14 15 16}`**


    To print all the elements of the array:


    **`$echo ${myarr[*]}`**


    Output will be: **`10 23 14 15 16`**.


    To print the size of the array:


    **`$echo ${#myarr[*]}`**


    **Output:** **`5`**.


    To assign values to individual elements, use:


    **`$myarr[0]=15; myarr[1]=18`**


