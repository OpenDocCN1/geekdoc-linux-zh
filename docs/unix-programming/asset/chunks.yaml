    # [The gethostbyaddress() function](#toc.xhtml_s147a)


    The **`gethostbyaddr()`** returns a hostent structure containing the host’s name
    and other information.


    **Prototype**


    `#include <netdb.h>`


    `struct hostent *gethostbyaddr(const char *addr, int len, int type);`


    For TCP/IP, the first argument **`addr`** should point to struct **`in_addr`**
    or an unsigned long integer in network byte order, **`len`** is normally the **`sizeof(struct
    in_addr)`**, and type should be **`AF_INET`**.


    Host information is found either through the resolver or in your system’s equivalent
    of the **`/etc/hosts`** file.


    `main()`


    `{`


    `const char *ipstr = “66.94.230.32”;`


    `struct in_addr ip;`


    `struct hostent *hp;`


    `if (!inet_aton(“66.94.230.32”, &addr);`


    `errx(1, “can’t parse IP address %s”, ipstr);`


    `if ((hp = ethostbyaddr(&addr, sizeof addr, AF_INET); ==NULL)`


    `errx(1, “no name associated with %s”, ipstr);`


    `printf(“Host name: %s\n”, hp->h_name);`


    `exit(0);`


    # Resolver


    The **`gethostbyname()`** and **`gethostbyaddress()`** functions use **`resolver()`**
    library function to get host information. The **`resolver()`** function reads
    the file **`/etc/resolv.conf`** to get the IP address of the DNS server to start
    from.


    # [The getservbyname() and getservbyport() functions](#toc.xhtml_s148a)


    The **`getservent()`** functions reads the service database to identify server
