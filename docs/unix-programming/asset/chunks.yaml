    \ `set` 命令。\n\n## 交互式输入\n\nShell 脚本将接受交互式输入来设置脚本中的参数。\n\nShell 使用内置命令 `read` 从标准输入读取一行，并将由空格分隔的单词赋值给变量。如果单词数量超过变量数量，则多出的单词将存储在最后一个变量中。\n\
    \n`read` 命令的退出状态为零，除非遇到文件结束（EOF）条件。如果从终端读取，则在按下 `Ctrl` + `D` 时遇到文件结束。如果是从文件读取，则当文件中没有更多数据时会遇到行结束。\n\
    \n考虑以下示例：\n\n```bash\n$ vi add.sh\nwhile read v1 v2\ndo\necho $((v1 –v2))\ndone\n\
    ```\n\n执行执行时：\n\n```bash\n$ add.sh\n23 13\n10\n25 5\n20\nCtrl = d\n$\n```\n\n\
    让我们来看另一个示例：\n\n```bash\n$ read age name\n39 Bill George\n$ echo '$age\\n $name'\n\
    39\nBill George\n```\n\n我们可以通过这个简单的脚本来说明这一点：\n\n```bash\n#!/bin/sh\necho -n “Input\
    \ a phrase \\c” # 这是 /bin/echo，需要“\\c”来防止换行\nread param\necho param=$param\n```\n\
    \n当我们运行此脚本时，它会提示输入并回显结果：\n\n```bash\n$ ./read.sh\nInput a phrase hello mca01 #\
    \ 我输入了 hello mca01 <回车>\nparam=hello mca01\n```\n\n## 子 shell\n\n如前所述，系统中有多个 shell\
    \ 对应每个终端。此外，每当执行 shell 脚本时，shell 都会创建一个子 shell（sub shell）。子 shell 是执行程序的一个完全全新的\
    \ shell。新 shell 带有其自身的 shell 环境和局部变量运行。子 shell 不知道父 shell 中分配的局部变量。子 shell 无法更改父\
    \ shell 中变量的值。子 shell 也无法更改父 shell 中内置环境变量的值。\n\n以下是子 shell 中局部变量的示例：\n\n```bash\n\
    vi loc_var.sh\necho initialize local variable x in sub shell\nx=50\necho $x\n\
    $ loc_var.sh     execute loc_var.sh\n$50     Sub shell terminated\n$ echo $x\n\
    $\n```\n\n这将会显示为空，因为变量 `x` 在父 shell 中没有被赋值任何值。\n\n以下是带有环境变量的子 shell 示例：\n\n```bash\n\
    vi shell_vars.sh\necho $PS1\nPS1=’=>’\n```\n\n保存并执行文件 `shell_var.sh`：\n\n```bash\n\
    $ shell_var.sh\n$ $\n=>\n```\n\n现在再次从父 shell 中显示 `PS1`：\n\n```bash\n$ echo $PS1\n\
    $ $\n```\n\n这意味着在子 shell 环境变量中所做的更改不会反映在父 shell 中。\n\n## 导出变量\n\n如前所述，子 shell\
    \ 不知道父 shell 中分配的局部变量。如果需要在子 shell 中访问父 shell 中的局部变量，必须先将其导出（export）。导出变量意味着将变量传递给子\
    \ shell。\n\n以下是子 shell 中局部变量的示例：\n\n```bash\n$ x=200\n$ echo 4x\n$ 200\nvi exp_var.sh\n\
    echo x = $x\n```\n\n保存并执行脚本 `exp_var`；输出为 `x`。\n\n由于变量 `x` 在子 shell 中不可用，因此子 shell\
    \ 的输出是 `x` 而不是 `200`。要将 `x` 导出到子 shell：\n\n```bash\n$ x=200\n$ echo 4x\n$ 200\n\
    vi exp_var.sh\necho x = $x\n```\n\n以下是子 shell 中局部变量的示例：\n\n```bash\n$ x=200\n\
    $ echo 4x\n$ 200\n```\n\n以下是 `export` 的示例：\n\n```bash\n$ x=200\n```\n\n以下是 `export`\
    \ 的示例：\n\n```bash\n$ x=200\n```\n\n## 测试操作符\n\n`test` 命令用于检查各种条件。它在本质上是一元操作。它接受单个参数作为文件名。\n\
    \n文件测试：\n\n*   `-r`: 如果存在且可读，则为真。\n*   `-w`: 如果存在且可写，则为真。\n*   `-x`: 如果存在且可执行，则为真。\n\
    *   `-f`: 如果是普通文件，则为真。\n*   `-d`: 如果是目录，则为真。\n*   `-c`: 如果是字符设备，则为真。\n*   `-b`:\
    \ 如果是块设备，则为真。\n*   `-p`: 如果是命名管道 (fifo)，则为真。\n*   `-u`: 如果设置了用户 ID，则为真。\n*   `-g`:\
    \ 如果设置了组 ID，则为真。\n*   `-k`: 如果设置了粘位，则为真。\n*   `-L`: 如果是符号链接，则为真。\n*   `-s`: 如果大小大于零，则为真。\n\
    \n文件描述符测试：\n\n*   `-t`: 如果文件描述符关联终端，则为真。\n\n以下是文件用法示例：\n\n```bash\n#检查文件\necho\
    \ “Enter filename”\nread fname\nif test -d $fname\nthen\n  echo “$fname 是一个目录”\n\
    else\n  echo “$fname 是一个文件”\nfi\n```\n\n字符串测试：\n\n*   `-z`: 如果字符串长度为零，则为真。\n*\
    \   `-n`: 如果字符串长度非零，则为真。\n*   `string1 = string2`: 如果 string1 与 string2 相同，则为真。\n\
    *   `string1 != string2`: 如果 string1 与 string2 不同，则为真。\n\n以下是使用字符串检查的示例：\n\n```bash\n\
    #检查字符串是否为空\necho “Enter a file name”\nread fname\nif test -z $fname\nthen\n  echo\
    \ “Enter 一个非空文件名”\nfi\n```\n\n数值比较测试：\n\n*   `n1 -eq n2`: 如果整数 n1 和 n2 相等，则为真。\n\
    *   `n1 -ne n2`: 如果整数 n1 和 n2 不等，则为真。\n*   `n1 -gt n2`: 如果整数 n1 大于整数 n2，则为真。\n\
    \n"
