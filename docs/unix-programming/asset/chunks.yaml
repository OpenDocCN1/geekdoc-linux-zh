  raw: 'The details about the comment are already discussed in the previous chapter
    as conventional programming languages shell provides a way to write remarks inside
    the program. A special symbol # is provided to write comments. Whenever # is encountered
    in the program, the words following # till the end of the line are considered
    as a comment. If # starts, the line entire line is treated as a comment.


    `# this line is to write remarks`


    `cp $file1 $file2`


    `# Test for the correct argument`


    # [Quoting](#toc.xhtml_s218a)


    Strings are quoted to control the way the shell interprets any parameters or variables
    within the string. The single (’) and double (″) quotes can be used to quote strings.


    # [Single quotes](#toc.xhtml_s219a)


    Single quotes are used to keep words together which are otherwise separated by
    whitespaces. Single quotes are also used to preserve white spaces. All special
    characters are ignored by the shell if they are enclosed inside single quotes.


    As an example, let us consider a file **`per_data`**:


    **`$ cat per_data`**


    **`John miller 34 graduate`**


    **`Bill Geirge 45 graduate`**


    **`John Gates 50 graduate`**


    Search the pattern Bill in the file per-data.


    **`$ grep Bill per_data`**


    **`Output : Bill Geirge 45 graduate`**


    If the search string is John, then:


    **`$grep John per_data`**


    The output of the preceding command will be:


    **`John miller 34 graduate`**


    **`John Gates 50 graduate`**


    But if Bill Gates is required to be found specifically, then:


    The command is:


    **`$ grep Bill Gates per_data`**


    The output is an error.


    **`grep can’t open Gates`**


    **`grep`** command takes second words as a file name. To search pattern containing
    two or more words, the search pattern must be enclosed in the single quotes.


    **`$ grep  ‘Bill Gates’ per_data`**


    Let us take another example to show whitespace preservation using single quotes:


    **`$ echo this     example   is to show use of   single    quotes`**


    **`Output : this  example  is to show use of  single  quotes`**


    To preserve white spaces, the string is to be displayed should be enclosed within
    single quotes:


    **`$ echo ‘this     example   is to show use of   single    quotes ‘`**


    **`Output :  : this     example   is to show use of   single    quotes`**


    Let us take an example to show ignorance of special characters:


    **`$ var=23`**


    **`$ echo $var`**


    Output : **`23`** , $var is substituted by value of variable **`var`**.


    **`$ echo ‘$var’`**


    Output: **`$var`**, the substitution of value is ignored because **`$var`** is
    enclosed inside the single quotes.


    # [Double quotes](#toc.xhtml_s220a)


    Double quotes work similar to single quotes, but it does not ignore dollar signs,
    back quotes, and backslash characters.


    As an example, let us use the variable, var, that has been assigned the value
    bat, and the constant string, man. If I wanted to combine these to get the result
    batman, I might try:


    **`$varman`**


    But this does not work because the shell will be trying to evaluate a variable
    called **`varman`**, which does not exist. To get the desired result, we need
    to separate it by quoting or by isolating the variable with curly braces ({}),
    as in:


    **`“$var”man - quote the variable`**


    **`$var””man - separate the parameters`**


    **`$var”man” - quote the constant`**


    **`$var’’man - separate the parameters`**


    **`$var’man’ - quote the constant`**


    **`$var\man - separate the parameters`**


    **`${var}man - isolate the variable`**


    These all work because ″, ’, \, {, and } are not valid characters in a variable
    name.


    We could not use either of:


    **`’$var’man`**


    **`\$varman`**


    Because it would prevent the variable substitution from taking place. When using
    the curly braces, they should surround the variable only and not include the **`$`**;
    otherwise, they will be included as part of the resulting string, for example:


    **`$ echo {$var}man`**


    **`{bat}man`**


    # [The backslash](#toc.xhtml_s221a)


    The backslash is used to quote a single character. When a single character is
    following a backslash, any special meaning assigned to that character is ignored.


    For example:


    **`$ echo >`**


    In the preceding example, the shell assumes > as the indirection operator and
    generates an error because it does not find the corresponding file in which standard
    output will be transferred. To ignore special meaning of > operator, it should
    be preceded by \ symbol:


    **`$ echo \>`**


    **`Output : >`**


    As discussed in the previous section, a double quote does not ignore backslash.
    This means that \ can be used inside a double quote to ignore the special meaning
    of the character, which is otherwise not ignored by double-quotes.


    **`$ x=23`**


    **`$ echo ‘\$x”`**


    **`Output: :$x`**


    # [Command substitution](#toc.xhtml_s222a)


    Command substitution means inserting the standard output of the command at any
    point in the command line.


    The shell performs command substitution by enclosing the command in the backquotes
    (`).


    **`$ echo current directory : pwd`**


    **Output:** **`current directory`**: **`pwd`**; in this command **`pwd`** is treated
    as a simple string.


    **`` $echo current directory; `ped` ``**


    **Output:** **`current directory: /users/home`**


    When the shell finds a backquote while scanning the command line, it expects a
    command following the backquote. If the command is found, it first executes the
    command and substitutes the output on the command line.


    # [Special shell variables](#toc.xhtml_s223a)


    There are a number of variables automatically set by the shell when it starts.
    These allow you to reference arguments on the command line.


    | **Variable** | **Usage** |


    | $# | Number of arguments on the command line. |


    | $- | Options are supplied to the shell. |


    | $? | The exit value of the last command executed. |


    | $$ | Process number of the current process. |


    | $! | Process number of the last command done in the background. |


    | $n | Argument on the command line, where *n* is from 1 to 9, reading left to
    right. |


    | $0 | The name of the current shell or program. |


    | $* | All arguments are passed to the shell program on the command line (“$1
    $2 … $9”) |


    | $@ | All arguments on the command line, each separately |


    | quoted (“$1” “$2” … “$9”) |  |


    **Table 8.1:** Shell Script built-in-parameters with details


    We can illustrate these with some simple scripts as follows:


    Example:


    **`echo “$#:” $#`**


    **`echo ‘$#:’ $#`**


    **`echo ‘$-:’ $-`**


    **`echo ‘$?:’ $?`**


    **`echo ‘$$:’ $$`**


    **`echo ‘$!:’ $!`**


    **`echo ‘$3:’ $3`**


    **`echo ‘$0:’ $0`**


    **`echo ‘$*:’ $*`**


    **`echo ‘$@:’ $@`**


    When executed with some arguments it displays the values for the shell variables,
    for example:


    **`$ ./variables.sh one two three four five`**


    **`5: 5`**


    **`$#: 5`**


    **`$-:`**


    **`$?: 0`**


    **`$$: 12417`**


    **`$!:`**


    **`$3: three`**


    **`$0: ./variables.sh`**


    **`$*: one two three four five`**


    **`$@: one two three four five`**


    # [The shift command](#toc.xhtml_s224a)


    The list of strings typed after shell script names on the command line are passed
    as arguments to the shell script. $1, $2–$9 refers to the positional arguments
    to the shell script. If the numbers of arguments are greater than nine, then the
    shift command is used.


    The shift command is used to effectively left shift positional parameters. The
    argument $1 is lost; the value of $2 is shifted to $1, and so on. The inaccessible
    tenth parameter is available for $9.


    Following is the example of a shift command:


    **`vi shift.sh`**


    **`echo “functioning of shift command’`**


    **`echo $1`**


    **`shift`**


    **`echo $1`**


    Save and execute shift.sh file as follows:


    **`shift.sh shift command`**


    The output of this shell script is as follows:


    **`functioning of shift command`**


    **`shift`**


    **`command`**


    # [The set command](#toc.xhtml_s225a)


    The set command is used to explicitly initialize the values of positional parameters:


    **`set  a b c`**


    The **`set`** command will assign values **`a`**, **`b`**, and **`c`** to **`$1`**,
    **`$2`**, and **`$3`**, respectively.'
