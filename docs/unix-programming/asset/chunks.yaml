  trans: "\n\n- **Sockets (套接字)**：UNIX sockets 用于相同或不同机器的两个进程之间建立通信。与其他类型的文件一样，sockets\
    \ 也与文件描述符相关。\n- **Symbolic link (符号链接)**：符号链接是一种指向现有文件的特殊类型文件。它也称为软链接。可以通过文件名或链接名访问文件内容。\n\
    - **FIFO (先进先出)**：`FIFO`即 First In First Out（先进先出）是一种文件，它有一个目录项并可以通过路径访问。它作为两个进程之间的管道起作用。\n\
    \n# UNIX 文件命名规范\n\n每个文件或目录在目录项中都有一个关联的文件。某些 UNIX 系统将文件名限制为 14 个字符，而大多数其他系统允许文件名包含\
    \ 256 个字符。通常，UNIX 对文件遵循以下命名规范：\n\n- 文件名是区分大小写的。\n- 键盘上几乎所有的字符都允许出现在文件名中，除了：\n\
    \  - `|| ; , ! @ # $ () <> / \\ “ ‘ `{} [] + = & ^ <space> <tab>`\n- 使用字符分隔符使文件名易于阅读。\n\
    - 在 UNIX 中文件名不指定其功能。\n\n# 文件名与元字符\n\n如果文件名中包含 `*`、`?` 和 `[` 字符，shell 会扩展该文件名。文件名中的\
    \ `*` 可以替换为 0 或多个允许的字符，`?` 可以替换为文件名中的任何单个字符，而方括号则指定特定字符组合的范围。字符范围使用—在方括号中指定。如果方括号内的第一个字符是\
    \ `!` 符号，则使用该范围其他字符的补集。*表 1.4*\n\n| 模式 | 扩展 |\n| :--- | :--- |\n| `*` | 当前目录下的所有文件。\
    \ |\n| `?` | 文件名包含单个字符的文件。 |\n| `[a-h]` | 由 a 到 d 组成的单字符文件名。 |\n| `[abcdefgh]`\
    \ | 与上相同。 |\n| `[a-ef-h]` | 与上相同。 |\n| `*[0-9]` | 结尾为数字的文件。 |\n| `?[0-9]` | 结尾为数字的两个字符文件名。\
    \ |\n| `[a-zA-Z0-9]` | 包含单个字母或数字的文件名。 |\n\n**表 1.4：** 用于文件命名的模式\n\n**注意：在 UNIX\
    \ 中，`.` 并不是特殊字符。文件名可能包含点也可能不包含。通常情况下，以点开头的文件名不会使用 `ls` 命令列出。**\n\n# UNIX 文件系统\n\
    \n每个磁盘驱动器被划分为多个分区。每个分区可以包含一个文件系统。文件系统由一系列逻辑块组成，每个块由 512、1024 或任何 512 字节的倍数组成。文件系统中逻辑块的大小相同，但在不同文件系统之间可能会变化。\n\
    \n文件系统具有以下结构，描述如下：\n\n启动块 超级块 Inode 列表 数据块\n\n启动块（Boot block）是第一个块，包含了启动系统所需的引导代码。虽然启动系统只需要一个启动块，但每个文件系统都有一个空的启动块。\n\
    \n超级块（superblock）描述系统状态并包含以下信息：\n\n- 文件系统大小\n- 空闲块数量\n- 可用空闲块列表\n- 下一个空闲块的索引\n\
    - inode 列表大小\n- 空闲 inode 数量\n- 空闲 inode 列表\n- 检查超级块是否被修改的标志\n\ninode 列表是 inode\
    \ 的列表。它包含了每个文件的索引节点（index node）条目。inode 包含：\n\n- 文件类型\n- 权限\n- 硬链接数量\n- 所有者用户-id\n\
    - 组 id\n- 文件大小\n- 最后访问时间\n- 最后修改时间以及\n- 数据块的位置\n\n最后，数据块从 inode 列表的末尾开始，包含文件数据和管理数据。分配的数据块只属于一个文件系统。\n\
    \n# 重要的 UNIX 目录\n\n*表 1.5* 显示了与系统资源（包括用户、文件、进程和设备）管理相关的 UNIX 目录。\n\n| 目录 | 描述\
    \ |\n| :--- | :--- |\n| `/` | 根目录-内核。 |\n| `/etc` | 启动系统、通信所需的文件，以及控制启动过程的脚本。\
    \ |\n| `/etc/config` | 系统配置文件。 |\n| `/etc/cron.d` | Cron 访问文件和 FIFO。 |\n| `/etc/rc#.d`\
    \ | 进入运行级别 # (S,0,1,2,3) 时执行的操作。 |\n| `/usr` | 系统文件目录。 |\n| `/usr/bin` | 系统二进制文件。\
    \ |\n| `/usr/etc` | 进一步的系统通信和管理程序。 |\n| `/usr/lib` | 对象文件库，发送邮件。 |\n| `/var` |\
    \ 管理程序的目录。 |\n| `/var/adm` | 管理程序和日志。 |\n| `/var/log` | 系统日志。 |\n| `/var/spool/mail`\
    \ | 邮件队列目录。 |\n| `/var/mail` | 邮件队列目录。 |\n| `/var/spool` | cron、日志等的目录。 |\n| `/dev`\
    \ | 设备目录。 |\n| `/home` `/usr/users` | 用户目录。 |\n| `/usr/local` | 本地安装的文件。 |\n|\
    \ `/tmp` | 包含在系统中创建的临时文件。 |\n\n**表 1.5：** 重要的目录\n\n# 结论\n\n操作系统是一种特殊的系统软件，用于管理所有资源以方便用户完成工作。UNIX\
    \ 是一种多用户、多任务的可移植操作系统，用于文本处理、通信和许多其他任务。UNIX 运行在不同的环境中。\n\n- **内核 (Kernel)**：始终驻留在内存中执行最核心任务的操作系统部分。\n\
    - **多处理 (Multiprocessing)**：允许单个处理器处理内存中多个程序的技术。\n- **父进程 (Parent process)**：创建并控制多个子进程的作业。\n\
    - **子进程 (Child process)**：由父进程创建并控制的进程。\n- **文件 (File)**：数据的集合。UNIX 文件包括普通文件、目录和设备文件。\n\
    - **文件属性 (File attributes)**：描述文件的特性。\n- **init**：第一个非内核进程，因此是所有进程的父进程。\n- **进程\
    \ (Process)**：执行中的程序。\n- **进程 ID (Process ID)**：进程的数字标识符。\n- **目录 (Directory)**：作为其他文件和目录容器的文件类型。\n\
    \n# 测试技能\n\n1. 哪些信息存储在 inode 结构中？\n   - 文件大小\n   - 文件所有者名称\n   - 文件权限\n   - 自上次修改或访问以来的所有日期\n\
    \   - 符号链接数量\n\n2. 绝对路径从根目录开始。\n   - 正确 (TRUE)\n   - 错误 (FALSE)\n\n3. 当前目录下哪些文件被正则表达式\
    \ `a?b*` 识别？\n   - afile\n   - aab\n   - abb\n   - abc\n   - axbb\n   - abxy\n\
    \n4. 作为命令解释器工作。\n   - 硬件\n\n"
- fmt: "\n##2. Kernel\n3. Shell\n4. CPU\n\n5. **The process which terminates before\
    \ the parent process exits is called as.**\n1. Zombie\n2. Orphan\n3. Child\n4.\
    \ None of the other options listed for this question\n\n6. **Context switch means**\n\
    1. Kernel switches from executing one process to another\n2. Process switches\
    \ from kernel mode to user mode\n3. Process switches from user mode to kernel\
    \ mode\n4. None of the other options listed for this question\n\n# Answers\n\n\
    1. **e**\n2. **a**\n3. **b-c-e**\n4. **c**\n5. **b**\n6. **a**\n\n# Review exercise\n\
    \n1. What happens if the file mode creation mask is set to 777?\n2. Does UNIX\
    \ have a fundamental limitation on the depth of a directory tree?\n3. Explain\
    \ absolute and relative pathnames with examples.\n4. What do multiprogramming,\
    \ multi-user, and multi-tasking means?\n5. With a neat diagram explain the relationship\
    \ between the Kernel and the shell of Unix.\n6. Explain the wild cards `*` and\
    \ `?`\n7. Where is the password stored ?\n8. Explain standard UNIX file hierarchy\
    \ own9. What do UID and GID signify?\n\n# CHAPTER 2\n\n## File Management\n\n\
    A file is a collection of related information that is recorded on secondary storage.\
    \ Or file is a collection of logically related entities. From user’s perspective,\
    \ a file is the smallest unit of secondary storage to provide input and receive\
    \ output from the computer program. In storage, a media file is just a sequence\
    \ of bits, bytes, or records whose logical meaning is defined by the file owner.\n\
    \nThe structure and logical rules to manage files in the data storage are called\
    \ a file system. To understand the internal operation of a filesystem, it is required\
    \ to know how files and directories are presented externally to the user and how\
    \ they are represented internally in the system. A storage medium may have many\
    \ file systems existing in different partitions. This chapter discusses the structure\
    \ of the UNIX file system and file system-related system calls to manipulate files.\n\
    \n## Structure\n\nWe will cover the following topics in this chapter:\n\n* System\
    \ calls and library functions for I/O\n* Kernel data structures used to handle\
    \ all opened files\n* File access permission\n* Standard files for maintain user\
    \ passwords and aging information\n* Structure and operations on the UNIX file\
    \ system\n\n## Objectives\n\nAfter going through this chapter, you will be able\
    \ to:\n\n* Know how the UNIX operating system organizes files in secondary storage\n\
    * Understand the file-related activities such as naming, retrieval, and sharing\n\
    * Learn how the file protection policies are implemented in UNIX operating system\n\
    \n## File input/output\n\nFile input/output (I/O) is an important function of\
    \ any operating system, and file input is performed to provide information to\
    \ the executing process to manipulate existing information. File output is performed\
    \ to permanently store either first-time created information or updated information\
    \ through a UNIX process. UNIX maintains some Kernel data structures to manage\
    \ FILE I/O. These data structures store Metadata required to access and update\
    \ all files opened in the system. UNIX FILE I/O is performed using either C standard\
    \ library functions or UNIX system call. In this section, we are discussing various\
    \ system calls to perform UNIX FILE I/O.\n\n## Kernel data structures for file\
    \ input/output\n\nThe following three data structures are used to manage opened\
    \ files in the UNIX file system:\n\n* **The Kernel file table:** the file table\
    \ contains an entry for each file opened by any process. It is a global data structure\
    \ that keeps track of bytes offset during read and write operations; each entry\
    \ in this file contains flags to indicate read/write access, blocking/no blocking,\
    \ and so on, and an entry contains a pointer to the v-node table entry for the\
    \ file. The Kernel file table contains a reference count, which shows how many\
    \ times the file is opened.\n* **Per-process file descriptor table:** it monitors\
    \ all opened files for a process. Each entry contains a pointer to the Kernel\
    \ file table. A file descriptor used in read, write, and other system calls is\
    \ an index in this table. The file descriptor is an unsigned positive number with\
    \ negative values being reserved to indicate \"no value\", or error conditions.\
    \ Values 0, 1, and 2 are reserved for \"standard input\", \"standard output\"\
    , and standard error, respectively.\n* **The in-core table:** the in-core table\
    \ holds an in-memory copy of the i-node of each open file.\n\n![](images/Figure-2.1.jpg)\n\
    \n**Figure 2.1:** Kernel data structures for files\n\nWhenever a file is opened\
    \ in any process, a corresponding entry is made in the file table, the file’s\
    \ I-node table entry is copied to v-node table, and an entry is made in the per-process\
    \ file descriptor table. When a process closes a file, the Kernel deletes the\
    \ entry, which refers to the file from the per-process file table and decrements\
    \ the reference count in the Kernel file table. If the reference count becomes\
    \ zero, the Kernel file table entry is deleted, and the file is closed.\n\nWhen\
    \ a process is forked, a copy of its parent’s per-process file table is created.\
    \ The parent and child share the same file pointer.\n\nOn the other hand, the\
    \ same file can be opened more than once by the same process or different processes.\
    \ In that case, each open results in a different entry in the global file table.\
    \ Each of these has its own current position pointer. Closing one has no effect\
    \ on the others.\n\n## System call for UNIX file I/O\n\nUNIX provides system calls\
    \ for basic file I/O, such as for opening, creating, closing, and reading writing\
    \ operations.\n\nKernel refers to all the opened files by file descriptors. The\
    \ file descriptor is a unique integer number assigned to all opened files in the\
    \ operating system. When an existing file is opened, or a new file is created,\
    \ Kernel returns a file descriptor to the process. This file descriptor is further\
    \ used for other file operations like read and write.\n\n### The open function\n\
    \nThe `open()` is used to open an existing file for reading and writing. If the\
    \ file does not already exist, it also creates a new file for further file operations.\n\
    \n**Prototype:**\n\nThe syntax for the open function is as follows:\n\n`int open\
    \ (char*pathname, int oflag, int mode);`\n\nIf the file is opened successfully,\
    \ the `open` function returns a file descriptor for the file. (If not, the return\
    \ value is -1.) All of the other system calls use a file descriptor (rather than\
    \ its name) to refer to a file.\n\nThe first argument is the name of the file\
    \ to be opened. `oflag` contains the following 1-bit flags to indicate how the\
    \ file is to be opened:\n\n* `O_RDONLY`: open for reading only.\n* `O_WRONLY`:\
    \ open for writing only.\n* `O_RDWR`: open for reading and writing.\n* `O_APPEND`:\
    \ open in append mode (initializes the position pointer to the end of the file\
    \ instead of the beginning).\n* `O_CREAT`: create the file if it does not exist.\n\
    * `O_TRUNC`: if the file exists and is opened for either writing or read/write,\
    \ truncate its length to 0.\n\nThe third argument is used only if a file is created.\
    \ It is used to set the permission bits for the new file.\n\n**Example**\n\n```c\n\
    #include <stdio.h>\n#include <sys/types.h>\n#include <sys/stat.h>\nStatic char\
    \ msg = \"greeting message\";\nint main()\n{\n    int fd;\n    char buffer[80];\n\
    \    fd = open(\"dfile.dat\", O_RDWR | O_CREAT | O_EXCL | S_IREAD S_IWRITE);\n\
    \    if (fd != -1)\n    {\n    printf(\"datafile opened\\n\");\n    write(fd,msg,sizeof(msg))\n\
    \    close(fd);\n    }\n    else\n    printf(\"data file already exists\");\n\
    \    exit(0);\n}\n```\n"
