- fmt: "\n## Utilities and application programs or tools layer.\n\nViewing the system\
    \ as set of layers, the operating system is commonly called the system kernel\
    \ or just the `Kernel`. It emphasizes its isolation from user programs because\
    \ programs are independent of the underlying hardware, and it is easy to move\
    \ them between UNIX systems running on different hardware. If the programs do\
    \ not make an assumption about the underlying hardware, programs such as the `shell`\
    \ and editors shown in the next layer interact with the `Kernel` by invoking a\
    \ well-defined set of system calls. The system calls to interact with the `Kernel`\
    \ to do various operations for calling the program and exchange data between the\
    \ `Kernel` and the program. Several programs known as `commands` are above this\
    \ layer. Other application programs can build on top of lower-level programs.\
    \ Let us discuss them in detail:\n\n*   **Hardware layer**: Innermost layer that\
    \ provides the services for the OS is called the hardware layer. This includes\
    \ the terminals, terminal controllers, disks, tapes, memory, and various device\
    \ controllers.\n*   **Kernel**: This is the central part of the operating system,\
    \ which interacts directly with the hardware and provides the services to the\
    \ user programs. The `Kernel` is stored in a file called “UNIX”. There is only\
    \ one `Kernel` running on the system. User programs interact with the `Kernel`\
    \ through a set of standard system calls that are a part of the `Kernel` and provide\
    \ the following basic functions of the `Kernel`:\n    *   **File system management**:\
    \ This includes management of the UNIX file system that comprises files and directories.\
    \ This includes creating, opening, reading, writing, closing files, and other\
    \ file system-related operations and data transfer between the file system and\
    \ the hardware.\n    *   **Memory management**: This includes allocation of memory\
    \ to programs, sharing of memory spaces, or freeing memory. If the system is low\
    \ on free memory, the `Kernel` frees memory by writing a program temporarily to\
    \ secondary memory called a `swap device`.\n    *   **Process management**: In\
    \ UNIX, a process is a program in execution. Process managing includes scheduling\
    \ of various processes to the CPU and execution of processes, including creating,\
    \ terminating, or suspension of a process. It also includes inter-process communication.\n\
    \    *   **Storage management**: Allocation of secondary storage disks for user\
    \ data and management of free space.\n    *   **Device management**: This includes\
    \ allowing controlled access to peripheral devices such as terminals, tape drives,\
    \ disk drives, and network devices.\n*   **Shell**: This is the part of the UNIX\
    \ that is most visible to the user. It is the command interpreter that interprets\
    \ the commands entered by the user and conveys them to the `Kernel`, which executes\
    \ them. The `shell` is a program running separately for each user working with\
    \ UNIX. The number of shells running in the system is equal to the number of users\
    \ working in the system at a time. There are different types of shells, and the\
    \ commonly used ones are the `Bourne shell`, `C Shell`, `Korn Shell`, and so on:\n\
    \    *   `Bourne shell` created by Steve Bourne is most popular and bundled with\
    \ every UNIX system.\n    *   The `C shell` was popular among UNIX programmers\
    \ and was created by Bill Joy at Berkeley. The advantages of the `C shell` over\
    \ `Bourne` are as follows:\n        *   It allows the aliasing of commands; that\
    \ is, we can rename command with our alias so that we can use a short alias name\
    \ for a long command.\n        *   `C shell` has a command history feature in\
    \ which previously typed commands can be recalled.\n    *   The `Korn Shell` is\
    \ a superset of the `Bourne shell` and is more powerful. David Korn of AT and\
    \ T Bell labs designed it.\n    *   `Bourne Again Shell (Bash)` from the Free\
    \ Software Foundations GNU project, based on `shell`.\n*   **Utilities and application\
    \ programs**: There are hundreds of utilities in UNIX. A utility is a standard\
    \ UNIX program to provide support to the user. Most of the UNIX utilities are\
    \ available as application programs:\n    *   File management: `rm`, `cat`, `ls`,\
    \ `rmdir`, `mkdir`.\n    *   User management: `passwd`, `chmod`, `chgrp`.\n  \
    \  *   Process management: `kill`, `ps`.\n    *   Printing: `lp`, `troff`, `pr`.\n\
    \    *   Program development tools such as `sccs`, `make`, editors (`vi` and `ed`),\
    \ and compiler.\n    *   UNIX email utility.\n*   **Windowing layer**: The GUI\
    \ on UNIX is a separate layer that sits on top of the core operating system. `X\
    \ window system` is an underlying graphical layer for all modern UNIX operating\
    \ systems. The `X Window System` just facilitates the system to accept input from\
    \ devices such as keyboard and mouse and to draw the graphical objects on display.\
    \ Drawing and taking input from devices is the job of software called a `Window\
    \ manager`. There are many Window managers available for `X`. Generally, the Window\
    \ manager is proprietary software and will only run on a particular type of UNIX.\
    \ Some of these are open and will run on any system that has `X` installed.\n\n\
    The `X Window system` has some very unique and useful features. These things are\
    \ provided by the `X` itself and, as such, are common to all X window managers\
    \ and all UNIX/X11 systems.\n\n# UNIX programming environment\n\nUNIX is a portable\
    \ operating system basically designed for multi-user and multi-tasking environments.\
    \ It contains hundreds of simple, single-purpose functions that can be combined\
    \ virtually to do every processing task imaginable. UNIX system is used in three\
    \ different programming environments.\n\n## Personal environment\n\nAlthough UNIX\
    \ was originally designed for multi-user environments, but some users install\
    \ it on their personal computers. This trend is accelerated with the invention\
    \ of `LINUX`, a free UNIX system. In 2001, Apple systems incorporated UNIX as\
    \ its Kernel.\n\n## Time-sharing environment\n\nUNIX is a multi-user and multi-tasking\
    \ system that runs in time-sharing environment to handle multiple tasks by a single\
    \ processing unit. The `Kernel` maintains a list of current tasks and allots a\
    \ slot of time to each task, then to the next, and so on. Normally, Kernel switches\
    \ from one process to the next so rapidly that each user has individual attention.\n\
    \n**Figure 1.2:** Multi-user environment\n\n## Client-server environment\n\nA\
    \ client/server computing environment divides processing functions between a server\
    \ computer and a client computer. In the client/server model, data processing\
    \ load is shared between the client computer and more powerful server computers.\
    \ The server computer is dedicated to storing and managing data and fulfills client\
    \ requests. The server receives structured requests from the client, processes\
    \ the requested data, and sends the data back to the client. His client computers\
    \ take the user’s input from an interface, process some information using its\
    \ CPU, and present the result to the user.\n\n**Note: In the single-user environment,\
    \ a program may have multiple instances because the process may be split into\
    \ two processes by default.**\n\n## UNIX process\n\nA program in execution is\
    \ a process. In UNIX, a process is a unit of work. If n users are executing the\
    \ same program, then there are n processes executing in the system. A process\
    \ executes by following a strict sequence of instructions that is self-contained\
    \ and does not jump to that of another process.\n\nAll the UNIX commands are programmed,\
    \ and thus, contribute to the process in the system when they are under execution.\n\
    \n## Process attributes\n\nEvery process in UNIX is attributed to some properties\
    \ (as shown in table 1.1), which affect the execution of the process.\n\n| **Attribute**\
    \ | **Meaning** |\n"
