- fmt: "\nFollowing is the example of the `set` command:\n\n```bash\nvi set.sh\nset\
    \ ONE TWO THREE\necho $1\necho $2\necho $3\n```\n\nSave and execute the script:\n\
    \n```bash\n$ set.sh\nOutput   ONE     TWO      THREE:\nl\nEDITOR= /users/bin\n\
    HOME=/users/George\nLOGNAME=Geore\nPATH= /users/bin\n```\n\nThe `set` command\
    \ is also used to reassign the values of positional parameters. The positional\
    \ parameters take values from strings passed on the command line at the time of\
    \ execution of the shell script. The only way to change these values is to use\
    \ `set` command during execution.\n\n## Interactive input\n\nShell scripts will\
    \ accept interactive input to set parameters within the script.\n\nShell uses\
    \ the built-in command `read`, to read in a line from standard input and assign\
    \ whitespace delimited words to variables. If a number of words are more than\
    \ the number of variables, then excess words are stored in the last variable.\n\
    \nThe exit status of the `read` command is zero unless an end-of-file condition\
    \ is encountered. If reading is performed from the terminal, the end-of-file is\
    \ encountered when `Ctrl` + `D` is pressed. If reading is performed from the file,\
    \ the end-of-line is encountered when there is no more data in the file.\n\nConsider\
    \ the following example:\n\n```bash\n$ vi add.sh\nwhile read v1 v2\ndo\necho $((v1\
    \ –v2))\ndone\n```\n\nWhen executed:\n\n```bash\n$ add.sh\n23 13\n10\n25 5\n20\n\
    Ctrl = d\n$\n```\n\nLet us take another example:\n\n```bash\n$ read age name\n\
    39 Bill George\n$ echo '$age\\n $name'\n39\nBill George\n```\n\nWe can illustrate\
    \ this with the simple script:\n\n```bash\n#!/bin/sh\necho -n “Input a phrase\
    \ \\c” # This is /bin/echo which requires “\\c” to prevent <newline>\nread param\n\
    echo param=$param\n```\n\nWhen we run this script, it prompts for input and then\
    \ echoes the results:\n\n```bash\n$ ./read.sh\nInput a phrase hello mca01 # I\
    \ type in hello mca01 <return>\nparam=hello mca01\n```\n\n## Subshell\n\nAs discussed\
    \ earlier, there are multiple shells in the system corresponding to each terminal.\
    \ Moreover, the shell creates sub shell whenever a shell script is executed. A\
    \ subshell is an entirely new shell for executions of the program. A new shell\
    \ runs with its own shell environment and local variables. A subshell does not\
    \ have knowledge of local variables assigned in its parent shell. A subshell cannot\
    \ change the value of a variable in the parent shell. A subshell can also not\
    \ change the values of the built-in environment variables in the parent shell.\n\
    \nFollowing is the example of a local variable in subshell:\n\n```bash\nvi loc_var.sh\n\
    echo initialize local variable x in sub shell\nx=50\necho $x\n$ loc_var.sh   \
    \  execute loc_var.sh\n$50     Sub shell terminated\n$ echo $x\n$\n```\n\nThis\
    \ will display blank because variable `x` is not assigned any value in the parent\
    \ shell.\n\nFollowing is the example of a subshell with environment variables:\n\
    \n```bash\nvi shell_vars.sh\necho $PS1\nPS1=’=>’\n```\n\nSave and execute the\
    \ file `shell_var.sh`:\n\n```bash\n$ shell_var.sh\n$ $\n=>\n```\n\nNow again,\
    \ display `PS1` from the parent shell:\n\n```bash\n$ echo $PS1\n$ $\n```\n\nThat\
    \ means changes made in the environment variables of subshell are not reflected\
    \ in the parent shell.\n\n## Exporting variables\n\nAs discussed earlier, a subshell\
    \ does not have knowledge of local variables assigned in the parent shell. If\
    \ local variables in the parent shell are required to be accessed in the subshell,\
    \ they must be first exported. Exporting variables means passing down variables\
    \ to the subshell.\n\nFollowing is the example of local variables in sub shell:\n\
    \n```bash\n$ x=200\n$ echo 4x\n$ 200\nvi exp_var.sh\necho x = $x\n```\n\nSave\
    \ and execute script `exp_var`; the output is `x`.\n\nSince variable `x` is not\
    \ available in the subshell to access, the output of the subshell is `x`, not\
    \ `200`. To export `x` to the subshell:\n\n```bash\n$ x=200\n$ echo 4x\n$ 200\n\
    vi exp_var.sh\necho x = $x\n```\n\nFollowing is the example of local variables\
    \ in sub shell:\n\n```bash\n$ x=200\n$ echo 4x\n$ 200\n```\n\nFollowing is the\
    \ example of `export`:\n\n```bash\n$ x=200\n```\n\nFollowing is the example of\
    \ `export`:\n\n```bash\n$ x=200\n```\n\n## Test operators\n\nThe `test` command\
    \ is used to check various conditions. It is unary in nature. They take a single\
    \ argument as the name of the file.\n\nTest for files:\n\n*   `-r`: True if exists\
    \ and is readable.\n*   `-w`: True if exists and is writable.\n*   `-x`: True\
    \ if exists and is executable.\n*   `-f`: True if it is a regular file.\n*   `-d`:\
    \ True if it is a directory.\n*   `-c`: True if it is a character special device.\n\
    *   `-b`: True if it is a block special device.\n*   `-p`: True if it is a named\
    \ pipe (fifo).\n*   `-u`: True if it has the user-id set.\n*   `-g`: True if it\
    \ has the group-id set.\n*   `-k`: True if the sticky bit is set.\n*   `-L`: True\
    \ if it is a symbolic link.\n*   `-s`: True if the size is greater than zero.\n\
    \nTest for file descriptors:\n\n*   `-t`: True if the file descriptor is associated\
    \ with a terminal.\n\nFollowing is an example of the use of a file:\n\n```bash\n\
    #check a file\necho “Enter filename”\nread fname\nif test -d $fname\nthen\n  echo\
    \ “$fname is a directory”\nelse\n  echo “$fname is a file”\nfi\n```\n\nTest for\
    \ strings:\n\n*   `-z`: True if string length is zero.\n*   `-n`: True if the\
    \ string length is non-zero.\n*   `string1 = string2`: True if string1 is identical\
    \ to string2.\n*   `string1 != string2`: True if string1 is non identical to string2.\n\
    \nFollowing is an example to use string check:\n\n```bash\n#check if string is\
    \ null\necho “Enter a file name”\nread fname\nif test -z $fname\nthen\n  echo\
    \ “Enter a non null filename”\nfi\n```\n\nTest for numeric comparisons:\n\n* \
    \  `n1 -eq n2`: True if integers n1 and n2 are equal.\n*   `n1 -ne n2`: True if\
    \ integers n1 and n2 are not equal.\n*   `n1 -gt n2`: True if integer n1 is greater\
    \ than integer n2.\n"
