- fmt: '

    UNIX is a powerful operating system, first developed in Bell Labs and has been
    under development ever since. It is very popular among scientific, engineering,
    and academic communities because of its stability, multi-user, and multi-tasking
    environment for servers, desktops, and laptops. The system is divided into two
    parts consisting of programs and services that have made the UNIX system environment
    so popular. The second part consists of the operating system, which supports these
    programs and services. The two entities `files` and `processes` are the main control
    concepts in the UNIX system model. This chapter discusses the architecture and
    overview of these control entities of the operating system.


    # Structure


    We will cover the following topics in this chapter:


    *   History of UNIX

    *   Salient features of UNIX

    *   Architecture of UNIX operating system

    *   Unix programming environment

    *   Unix process

    *   Handling files and process control entities.

    *   Unix file system


    # Objectives


    After going through this chapter, you will be able to:


    *   Understand salient features of the UNIX operating system to make it a popular
    OS.

    *   Get to know about the architecture and functioning of each layer.

    *   Learn about UNIX programming environments.

    *   Understand fundamental concepts of files and processes.


    # History of UNIX


    Bell Laboratories, jointly with MIT and General Electric, developed a new operating
    system Multics (Multiplexed Instruction Computing Service), in 1965. The main
    features included in the operating system were multi-user, multi-processor, and
    multi-level (hierarchical) file systems, among its many forward-looking features.


    In the year 1969, a few programmers, Ken Thompson, Dennis Ritchie, and others
    working in Multics, designed and implemented the first version of the UNIX file
    system on a `PDP-7`. After including a few more utilities, it was given the name
    UNIX by Brian Kernighan. UNIX was written mainly in assembly language.


    In the year 1971, the system was implemented on `PDP-11` with 16K bytes of memory,
    including 8K bytes for user programs and a 512K byte disk. It was designed with
    the following features due to which it caught the interest of researchers:


    *   Programmers environment.

    *   Simple user interface.

    *   Simple utilities that can be combined to perform powerful functions.

    *   Hierarchical file system.

    *   Simple interface to devices consistent with file format.

    *   Multi-user and multi-process system.

    *   Architecture is independent and transparent to the user.


    In the year 1973, it was decided to re-write the UNIX in the C language developed
    by Dennis Ritchie. This decision made it easy to port the UNIX to new machines.


    In the year 1974, it finally got recognition from the academic community when
    Thompson and Ritchie published a paper in the Communications of the ACM describing
    the new UNIX OS.


    In the year 1980, Berkeley released the `BSD 4.1` (Berkeley Software Development)
    version of UNIX.


    In the year 1988, AT&T and Sun Microsystems jointly developed System V Release
    4 (`SVR4`).


    In the year 1993, Novell bought UNIX from AT&T.


    # Salient features of UNIX


    UNIX is a very popular operating system due to its special and useful features,
    and these are discussed as follows.


    ## Portability


    UNIX is considered a portable operating system as a large portion of it is written
    in the C language, and only a very small portion of it is written in assembly
    language. Because the C program can be easily moved from one hardware environment
    to another, provided a standard Compiler is available, this makes the UNIX code
    run on different hardware. All this only requires a standard C compiler.


    The application program interface allows many different types of applications
    to be easily implemented under UNIX without writing assembly language. These applications
    are relatively portable across multiple vendor hardware platforms.


    ## Multi-tasking


    This is managed by dividing the CPU time intelligently between all jobs. Each
    job gets a time slot depending on its priority. A user can print a file and, at
    the same time, execute a C program. Users do not have to wait for an application
    to end before starting another one. A huge file can be sorted as a background
    job while working on a foreground job.


    ## Multi-user


    The UNIX environment design allows multiple users to work concurrently, and hence,
    they can share hardware and software resources of hard disk, CPU, memory, printer,
    and file by working on a separate terminal. A terminal is a keyboard and monitor,
    which is connected to the main computer called the host machine, server, or console.
    In UNIX, every user gets an equal chance to share resources while preventing the
    user from locking other’s resources.


    ## Device independence


    In UNIX, input/output devices are treated like ordinary files. Input and output
    from the files and devices are handled using a design feature called indirection
    (`<`, `>`, `<<`, `>>`) without going into detail specifications of devices. Input
    to a program can come from any file or device, and output from a program can go
    to any file or device.


    ## Modularity


    UNIX kernel consists of modules, and system administrators can customize it to
    include only those modules that are normally required. If a new feature is required
    later, the corresponding module can be added to the Kernel, and it can be reconfigured
    or rebuilt.


    ## Networking


    Originally networking was not incorporated into the UNIX system. Networking was
    added after the separation of UNIX between BSD and At&T.


    Networking allows a user to log on to the remote system. Once access is gained
    to remote system, users can use system resources using permission granted to him/her.
    A standard communication protocol known as `TCP/IP` is used to access other system
    resources. UNIX also supports a network file system, which allows users to access
    files on another network.


    # Tools and utilities


    Productivity of the system is increased with available software and tools. UNIX
    is very rich in tools and comes with hundreds of programs. These tools are either
    integral utilities that are absolutely necessary for the operation of the computer,
    such as command interpreter, and tools that are not necessary for the operation
    of the UNIX but provide the user with additional capabilities such as email, typesetting
    capabilities such as `troff`, `nroff`, `awk`, `sed`, and so on.


    # Security


    UNIX has several levels of security:


    *   Assigning login name and password to individual users provides the first level
    of security.

    *   The second level is at a file level, where each file has read, write and execute
    permission associated with the owner of the file, group members, and others, which
    decide who can read, write, or execute a file.

    *   The third type of security is that files can be encrypted so that the file
    is in an unreadable format, and only you can decrypt it to read it


    # The UNIX system architecture


    The UNIX system has become quite popular since its inception in 1969, running
    on machines of varying processing capacities from microprocess to the mainframe
    and providing a common execution environment across them. The operating system
    interacts directly with the hardware, providing common services to the programs
    and insulating them from the hardware.


    UNIX operating system is made up of layers around the hardware layer, as shown
    in figure 1.1:


    ![](images/Figure-1.1.jpg)


    **Figure 1.1:** UNIX system architecture


    It contains:


    *   Hardware layer.

    *   Kernel layer.

    *   Shell layer.

    *   Windowing layer as X—interacts with the shell but can interact with applications
    and commands.

