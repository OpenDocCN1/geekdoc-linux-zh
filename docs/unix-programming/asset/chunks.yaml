- fmt: "\nUNIX is a large collection of commands. Users can build their own complex\
    \ commands by combining these simple sets of commands. The notion of software\
    \ development in UNIX started with the shell at the top level of the program.\
    \ The UNIX shell is a full-featured programming language with a shell environment,\
    \ shell variable, command-line arguments, conditional, and control constructs.\
    \ In addition to the basic tools of programming, the shell also provides array,\
    \ functions, and signal trapping with limited capacity. The bourn shell is considered\
    \ as a primary shell for UNIX operating system.\n\n# Review Exercise\n\n1. Write\
    \ a shell script to display a word repeatedly a number of times. [Command line\
    \ arguments: `word`, `number` ]\n2. Write a shell script to check for a leap year.\
    \ [Command line argument: `four digit year` ]\n3. Write a shell script to delete\
