  trans: "\n`getservbyport()` 搜索服务数据库以识别具有给定端口和指定协议的服务，并在必要时打开连接。\n\n这三个函数都会按顺序搜索数据库，直到找到匹配项或发生文件结束符（EOF）。\n\
    \n### 原型\n\n```c\n#include <netdb.h>\n\nstruct servent *getservbyname (const char\
    \ *servname, const char *protname);\n\nstruct servent *getservbyport (int port,\
    \ const char *protname);\n```\n\n`servent` 结构如下：\n\n```c\nstruct servent {\n \
    \   char    *s_name;\n    char    **s_aliases;\n    int     s_port;\n    char\
    \    *s_proto;\n};\n```\n\n该结构的成员为：\n\n*   `s_name`: 服务的正式名称。\n*   `s_aliases`:\
    \ 服务的备用名称列表，以零终止。\n*   `s_port`: 服务所在的端口号。 端口号以网络字节序返回。\n*   `s_proto`: 访问服务时使用的协议名称。\n\
    \n这些函数使用静态数据存储；如果以后需要使用这些数据。\n\n### 结论\n\n套接字是客户端和服务器之间的接口，可以位于单个系统、网络或跨不同的网络，用于发送和接收信息。客户端程序通过面向连接或无连接的接口向服务器发送数据请求。在本章中，讨论了所有与套接字编程相关的概念，包括不同类型的套接字、建立连接的函数以及客户端与服务器之间的消息收发。在本章中，我们讨论了\
    \ UNIX 环境下的套接字编程。 UNIX 平台还有许多其他环境，用户可以自定义这些环境。我们将在下一章中讨论这些环境。\n\n### 复习习题\n\n\
    1. 从命令行读取 (1) 可以从该 URL 提取远程 WWW 服务器名称和要检索的文件名，以及 (2) 服务器端口号。创建一个连接到指定端口（例如 HTTP\
    \ 端口 80）的服务器机器的套接字 [getservbyname, gethostbyname, socket, connect]。\n2. 运行在一台主机上的进程为了识别运行在另一台主机上的进程，使用哪些信息？\n\
    3. 服务器程序是否会向客户端程序请求并接收服务？\n4. 使用 `socket()` 创建套接字，使用 `gethostbyname()` 将主机名转换为\
    \ IP 地址，然后发出 `connect()` 调用，传递包含要连接的 IP 地址和端口的相关结构体。\n\n# 第 6 章：内存管理\n\n内存被认为是计算机中重要的资源，内存管理是管理计算机内存的过程，由主内存和辅内存组成。内存管理的目的是在运行或存在于系统的进程之间高效地分配不同类型的可用内存。它跟踪哪些内存部分正在使用，哪些部分未在使用，以便在进程需要时为其分配内存。一旦进程终止，分配给运行进程的内存将被释放，以便分配给另一个请求内存资源的进程。UNIX\
    \ 操作系统实现了交换和请求分页技术来管理系统内存。本章将讨论用于正确管理内存资源的所有概念和技术。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\
    \n*   内存管理\n    *   操作系统内存的使用\n    *   UNIX 中运行进程的内存内容\n    *   交换\n    *   内存管理函数的实现\n\
    *   内存管理函数\n*   跳转另一个函数\n\n### 目标\n\n阅读本章后，读者将能够 UNIX 如何用 C 语言编写，以及 UNIX 操作系统如何广泛用于\
    \ C 语言编程。在本节中，我们将学习一些 UNIX 和 C 接口概念，例如：\n\n*   理解 UNIX 操作系统中不同类型内存资源的使用。\n*  \
    \ 理解不同的内存管理技术，如交换和请求分页。\n*   理解系统调用和内存管理函数。\n*   理解函数调用期间的上下文切换。\n\n系统调用和库函数：\n\
    \n*   命令行参数和环境变量。\n*   在 UNIX 中使用 `fork()`、`exec()` 在 C 语言中实现多任务。\n*   使用 `wait()`\
    \ 进行进程同步。\n*   使用系统调用访问用户信息。\n*   数据共享和进程间通信机制。\n*   套接字编程基础。\n\n### 内存管理\n\n\
    UNIX 内核的内存管理组件管理处理器内存的内容。类 UNIX 操作系统使用复杂的内存管理算法来高效利用内存资源。在 UNIX 中，有三种不同的内存资源，包括主内存和辅内存：\n\
    \n*   **主内存 (Main):** CPU 主板上的可用物理内存称为主内存。这不包括处理器缓存、显存或其他外围内存。\n*   **文件系统 (File\
    \ system):** 本地磁盘或网络可用且可通过路径访问的物理内存。这不包括原始设备、磁带驱动器、交换空间或其他无法通过普通路径访问的存储器。\n* \
    \  **交换设备 (Swap device):** 交换设备是磁盘上的可用物理内存，用于存储不在 RAM 或文件系统中的数据。当交换设备位于单独的磁盘或分区时，可以高效使用。\n\
    \n### 操作系统内存的使用\n\n为了高效管理内存资源，内存保留给操作系统自身的功能和正在执行的进程。内存的某些部分始终保留，不能用于用户进程。\n\n\
    *   **内核内存 (Kernel memory):** 操作系统系统的私有内存，主内存中始终可用。\n*   **缓存 (Cache memory):**\
    \ 主内存的一部分，用于存放文件系统元素和 I/O 操作。缓存不包括 CPU 缓存磁盘。\n*   **虚拟内存 (Virtual memory):** 虚拟内存包括机器上运行的所有进程的可寻内存。进程的总地址空间可以分布在所有类型的内存中。\n\
    \n"
- fmt: "\nSwapping occurs when a running process needs a virtual page in the physical\
    \ memory, and there is no free space available in the physical memory. In this\
    \ situation, the operating system moves out some of the pages from the main memory\
    \ and brings in the required pages from the swap device. The decision regarding\
    \ which pages to be swapped in or swapped out is done by the scheduler (`swapper`).\
    \ The scheduler wakes up at least once every 4 seconds to check which processes\
    \ can be swapped out. A process that has been idle in the main for a long time\
    \ is most likely to be swapped out. If no such process is there in the main memory,\
    \ then a large process is selected for swapping out. A process that has been swapped\
    \ out for a long time and small is most likely to be swapped in. To prevent thrashing,\
    \ processes that have not been in the main memory for a certain amount of time\
    \ are not selected for swapping out. Process pages selected for swapping out to\
    \ the location depending on their type. Pages from the data segment are moved\
    \ to swap space, pages from the stack segment are moved to swap space, and pages\
    \ from the mapped file are moved to the originating file if changed and shared.\
    \ The pages from the mapped file are moved to swap space if changed and private.\
    \ If pages from mapped files are unchanged, they are discarded.\n\n# Demand Paging\n\
    \nDemand paging is a paging policy in which a page is not read into the memory\
    \ until it is requested. Demand paging transfers only required memory pages instead\
    \ of a process to and from a secondary device.\n\nThe Kernel implements a page\
    \ table to achieve demand paging. Page table converts logical page address to\
    \ physical page address. The page table uses a binary flag to check the page’s\
    \ validity. A page is valid if it resides in the main memory and invalid if it\
    \ currently resides in secondary memory. When a process needs a page, and the\
    \ page is not there, a page fault interrupts to the Kernel occurs. Kernel checks\
    \ if page reference is valid in the secondary memory, it schedules disk read operation\
    \ to swap in the demanded page. Once the page is in the main memory, it restarts\
    \ the interrupted instructions.\n\n**Note: Berkeley introduced demand paging to\
    \ UNIX with BSD (Berkeley System).**\n\nAdvantages of the demand paging policy\
    \ are that it permits greater flexibility in mapping the virtual address of a\
    \ process into the physical memory of a machine, usually allowing the size of\
    \ a process to be greater than the amount of availability of physical memory and\
    \ allowing a greater number of processes to fit in the main memory simultaneously.\n\
    \nDisadvantages of the demand paging policy are that a single process may face\
    \ extra latency when a process requires a page first time. More page faults may\
    \ cause thrashing, and the process may face the security risk of a timing attack.\n\
    \n# The mkdir system call\n\nThe `mkdir()` function creates a new directory named\
    \ by the pathname pointed to by `path`.\n\n**Prototype:**\n\n```c\nint mkdir(const\
    \ char *path, mode_t mode);\n```\n\nThe mode of the new directory is initialized\
    \ from `mode`. The protection part of the mode argument is modified by the process’s\
    \ file creation mask.\n\nThe directory’s owner ID is set to the process’s effective\
    \ user ID. The directory’s group ID is set to the process’s effective group ID,\
    \ or if the `S_ISGID` bit is set in the parent directory, then the group ID of\
    \ the directory is inherited from the parent. The `S_ISGID` bit of the new directory\
    \ is inherited from the parent directory.\n\nIf path names a symbolic link, `mkdir()`\
    \ fails and sets `errno` to `EEXIST`.\n\nThe newly created directory is empty\
    \ with the exception of entries for itself (`.`) and its parent directory (`..`).\n\
    \nUpon successful completion, `0` is returned. Otherwise, `-1` is returned, no\
    \ directory is created, and `errno` is set to indicate the error.\n\n# The rmdir\
    \ system call\n\nThe `rmdir()` system call removes a directory file whose name\
    \ is given by `path`. The directory must not have any entries other than “.” and\
    \ “..”.\n\n**Prototype:**\n\n```c\nint rmdir(const char *path);\n```\n\nThe `rmdir()`\
    \ function returns the value `0` if successful; otherwise, the value `-1` is returned,\
    \ and the global variable `errno` is set to indicate the error.\n\nBefore deleting\
    \ a directory entry, the system checks the link count entry (`ls -l` command)\
    \ to identify whether the directory to be deleted is opened by some other process\
    \ or not. The directory is deleted only if the link count of the directory is\
    \ 0 with this call and no other process has the directory open, then the space\
    \ occupied by this directory is freed.\n\n# Memory management functions\n\nMemory\
    \ to the variables can be allocated and freed dynamically.\n\n# The malloc() function\n\
    \n`malloc` requires one argument - the number of bytes you want to allocate dynamically.\n\
    \nIf the memory allocation is successful, `malloc` will return a void pointer.\
    \ You can assign this to a pointer variable, which will store the address of the\
    \ allocated memory.\n\nIf memory allocation fails (for example, if you are out\
    \ of memory), `malloc` will return a NULL pointer.\n\n# The free() function\n\n\
    Passing the pointer into `free` will releases the allocated memory. It is good\
    \ practice to free memory when you have finished with it.\n\n```c\nvoid free(void\
    \ *ptr);\n```\n\nWhere `ptr` is the pointer.\n\nConsider the following Example:\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main() {\n    int number;\n\
    \    int *ptr;\n    ptr = (int*)malloc(sizeof(int));\n    if (ptr != NULL) {\n\
    \        *ptr = 10;\n        printf(\"Value: %d\\n\", *ptr);\n        free(ptr);\n\
    \    } else {\n        printf(\"Memory failed\\n\");\n    }\n    return 0;\n}\n\
    ```\n\n# The calloc() function\n\n`calloc` is similar to `malloc`, but the main\
    \ difference is that the values stored in allocated memory are zero by default.\n\
    \n`ptr = (cast_type *) calloc (n, size);` `calloc` requires two arguments. The\
    \ first is the number of n variables like allocate for. The second is the size\
    \ of each variable.\n\nConsider the following:\n\n```c\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\nint main() {\n    float *ptr1;\n    int i;\n    ptr1 = calloc(3,\
    \ sizeof(float));\n    if (ptr1 != NULL) {\n        for(i=0 ; i<3 ; i++) {\n \
    \           printf(\"ptr1[%d] holds %0.5f\\n\", i, ptr1[i]);\n        }\n    \
    \    free(ptr1);\n    } else {\n        printf(\"memory not allocated\\n\");\n\
    \    }\n    return 0;\n}\n```\n\n# The realloc() function\n\nThe `realloc()` function\
    \ is used to change the size of the already allocated block of memory without\
    \ losing data in that location.\n\n`ptr = realloc (ptr,newsize);` `realloc` takes\
    \ two arguments. The first is the pointer referencing the memory, that is, `ptr`\
    \ whose size is be changed. The second is the total number of bytes that needs\
    \ to be reallocated, that is, `newsize`.\n\nPassing zero as the second argument\
    \ is the equivalent of calling free, `realloc` returns a void pointer if successful,\
    \ else a NULL pointer is returned.\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    \nint main() {\n    int *ptr;\n    int i;\n    int number;\n    printf(\"How many\
    \ ints would you like store? \");\n    scanf(\"%d\", &number);\n    ptr = malloc(number*sizeof(int));\n\
    \    if (ptr != NULL) {\n        for (int I =0; I<number ;I++) {\n           \
    \ *(ptr + I) = i;\n        }\n        ptr = realloc(ptr, (number 2 )*sizeof(int));\n\
    \        if(ptr!=NULL) {\n            printf(\"Now allocating more memory… \\\
    n\");\n        }\n        free(ptr);\n    }\n    return 0;\n}\n```\n"
