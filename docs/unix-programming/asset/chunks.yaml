    ## Figure 3.2: Single thread process


    A process can have separate threads for different activities. Having a separate
    thread for each activity allows the programmer to define the actions associated
    with that activity as a single sequence of actions and events.


    Each thread associated with the process has its own logical control flow; each
    thread shares the code, data, and Kernel context, and each thread has its own
    thread ID.


    ![](images/Figure-3.3.jpg)


    ## Figure 3.3: Process with multiple threads


    Why allow threads to access the same memory? Because inside OS, threads must coordinate
    their activities very closely. Following are the situations when shared memory
    and disjoint memory are required by the threads:


    *   If two processes issue read file system calls at close to the same time must
    make sure that the OS serializes the disk requests appropriately.

    *   When one process allocates memory, its thread must find some free memory and
    give it to the process. It must ensure that multiple threads allocate disjoint
    pieces of memory.


    Having threads share the same address space makes it much easier to coordinate
    activities—can build data structures that represent system state and have threads
    read and write data structures to figure out what to do when they need to process
    a request.


    One complication that threads must deal with as asynchrony. Asynchronous events
    happen arbitrarily as the thread is executing and may interfere with the thread’s
    activities unless the programmer does something to limit the asynchrony. Examples
    are as follows:


    *   An interrupt occurs, transferring control away from one thread to an interrupt
    handler.

    *   A time-slice switch occurs, transferring control from one thread to another.

    *   Two threads running on different processors read and write the same memory.


    Asynchronous events, if not properly controlled, can lead to incorrect behavior.
    Examples:


    *   Two threads need to issue disk requests. The first thread starts to program
    the disk controller (assume it is memory-mapped and must issue multiple writes
    to specify a disk operation). In the meantime, the second thread runs on a different
    processor and also issues the memory-mapped writes to program the disk controller.
    The disk controller gets horribly confused and reads the wrong disk block.

    *   Two threads need to write to the display. The first thread starts to build
    its request, but before it finishes, a time-slice switch occurs, and the second
    thread starts its request. The combination of the two threads issues a forbidden
    request sequence, and smoke starts pouring out of the display.

    *   For accounting reasons, the operating system keeps track of how much time
    is spent in each user program. It also keeps a running sum of the total amount
    of time spent in all user programs. Two threads increment their local counters
    for their processes, then concurrently increment the global counter. Their increments
    interfere, and the recorded total time spent in all user processes is less than
    the sum of the local times.


    So, programmers need to coordinate the activities of the multiple threads so that
    these bad things do not happen. The key mechanism and synchronization can be adopted
    to coordinate the activities of the multiple threads. These operations allow threads
    to control the timing of their events relative to events in other threads. Appropriate
    use allows programmers to avoid problems like the ones outlined preceding.


    ## Conclusion


    This chapter describes the process subsystem of the UNIX operating system. The
    process subsystem manages memory when required by various processes, schedules
    processes for execution, and controls other aspects related to the processes.
    This chapter described the memory layout of the process and functions of managing
    memory. This chapter also described the context of the UNIX process and how context
    switching is performed when a process is either interrupted or the CPU is switched
    to another process. This chapter also described how processes inform each other
    about an asynchronous event by sending signals with the `signal()` system call.
    The upcoming chapter discusses all methods of inter-process communication in more
    detail.


    ## Review Exercise


    1.  Write a program to ask the user to enter the total number of bytes he or she
    wants to allocate. Then, initialize the allocated memory with consecutive integers,
    starting from 1\. Add all the integers contained by the memory block and print
    out the final result on the screen.

    2.  Write a program that allocates a block of memory space to hold 100 items of
    the float data type by calling the `calloc()` function. Then, reallocate the block
    of memory in order to hold 50 more items of the float data type.

    3.  Write a program to ask the user to enter the total number of float data. Then
    use the `calloc()` and `malloc()` functions to allocate two memory blocks with
    the same size specified by the number and print out the initial values of the
    two memory blocks.

    4.  Write a program to display information about all the users logged in currently
    in the system.


    ## CHAPTER 4


    ## Inter-Process Communication


    ### Introduction


    Most modern operating systems allow for concurrent execution of multiple processes
    in a computer system. The processes can be independent of cooperating, that is,
    sharing data with each other or sometimes require to share event information with
    each other. An operating system provides inter-process communication mechanisms
    to execute cooperating processes either on the single system or in the networking
    environment. The IPC can be either synchronous or asynchronous. This chapter describes
    IPC and corresponding techniques used to perform IPC among different processes.


    ### Structure


    We will cover the following topics in this chapter:


    *   Interprocess communication and its different methods

    *   Pipes as means of IPC

    *   FIFO as means of IPC

    *   Shared memory and its usage

    *   Sending and receiving messages using the message queue

    *   Process synchronization using semaphores


    ### Objective


    After completing this chapter, you will be able to:


    *   Understand the concept of inter-process communication.

    *   Understand how named and unnamed pipes are used to share data between two
    cooperating processes.

    *   Understand how to share data directly between cooperating processes.

    *   Understand the functioning of semaphores for process synchronization.


    ### Introduction to IPC


    Two processes can communicate with each other using interposes communication techniques
    provided by an operating system. The processes may need to communicate to share
    data or to inform about some event. In a traditional single processing environment,
    modules within the single process can communicate with each other using global
    variables and function calls. In a multi-processing environment where processes
    run under different address spaces, an operating system must provide some facility
    for inter-process communication.


    The use of IPC is not restricted to multiple processes running on a single system.
    Figure 4.1 shows three processes residing in a single system that can communicate
    using different modes of IPC.


    ![](images/Figure-4.1.jpg)


    **Figure 4.1:** Process communications on a single system


    Figure 4.2 shows a network environment where processes are running on different
    systems, and they can communicate with each other using means of interprocess
    communication.


    ![](images/Figure-4.2.jpg)


    **Figure 4.2:** Process communications on multiple systems


    ### Means of interprocess communication


    The main methods of sharing data or-inter-process communication are using the
    following:


    *   Files

    *   Message queues

    *   Pipes

    *   Shared memory

    *   Sockets

