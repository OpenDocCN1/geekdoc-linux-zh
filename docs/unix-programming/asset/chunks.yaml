- fmt: "\n```c\nint chown(const char *pathname, uid_t owner, gid_t group);\n```\n\n\
    After the change of ownership, the old owner losses owner access rights to the\
    \ file. The mode is bitwise OR of constants in `st_mode` member of the stat structure.\n\
    \n# Mounting and unmounting a file system\n\nThe `mount` system call connects\
    \ the file system in a specified partition of a disk to the existing file system\
    \ hierarchy. The `mount` system call thus allows users to access data in a disk\
    \ section as a file system instead of a sequence of disk blocks.\n\n### Prototype\n\
    \n```c\nint mount (const char * source , const char * target , const char * filesystemtype\
    \ , unsigned long mountflags , const void * data );\n```\n\nThe `mount()` attaches\
    \ the filesystem specified by the `source` (which is often a device name but can\
    \ also be a directory name or a dummy) to the directory specified by the `target`.\n\
    \nThe `umount` system call disconnects a file system and frees the hierarchy.\n\
    \n### Prototype\n\n```c\nint umount(const char *target);\n```\n\nThe `umount2()`\
    \ removes the attachment of the (topmost) filesystem mounted on the `target`.\n\
    \n# Directory related system calls\n\nLike file-related system calls, the UNIX\
    \ Kernel also defines a set of system calls for performing directory-related operations\
    \ as in UNIX; everything is considered as a file. These system calls are used\
    \ to create, remove, and manipulate directory contents.\n\n# The mkdir system\
    \ call\n\nThe `mkdir()` function is used to create a new directory named by the\
    \ pathname pointed by the path.\n\n### Prototype\n\n```c\nint mkdir(const  char\
    \ *path, mode_t mode);\n```\n\nThe mode of the new directory is initialized from\
    \ `mode`. The protection part of the `mode` argument is modified by the process’s\
    \ file creation mask.\n\nThe directory’s owner ID is set to the process’s effective\
    \ user ID. The directory’s group ID is set to the process’s effective group ID,\
    \ or if the `S_ISGID` bit is set in the parent directory, then the group ID of\
    \ the directory is inherited from the parent. The `S_ISGID` bit of the new directory\
    \ is inherited from the parent directory.\n\nIf `path` names a symbolic link,\
    \ `mkdir()` fails and sets `errno` to `EEXIST`.\n\nThe newly created directory\
    \ is empty with the exception of entries for itself (.) and its parent directory\
    \ (..).\n\nUpon successful completion, the system call returns `0`. Otherwise,\
    \ it returns `-1`, no directory is created, and `errno` is set to indicate the\
    \ error.\n\n# The rmdir system call\n\nThe `rmdir()` system call to remove a directory\
