  raw: 'From the depth of our heart, we dedicate this work to the supreme teacher
    and supreme guide, The God, who has given us the strength and paved the path to
    carry this task. We’d also like to thank many people who have helped us to learn
    and practice fundamentals and advanced concepts of the UNIX operating system.
    We would like to thank our superiors from industry who have shown confidence in
    us and given the challenging task of UNIX server administration.


    We would like to thank our colleagues, reviewers, editors and publishers for adding
    value to the contents. We’d like to thank our students and scholars because their
    enthusiasm always motivates us to give more.


    Last but not the least we are very grateful to our family members who are always
    supportive in all the work we do.


    # Preface


    Having rich industrial experience of authors to work in UNIX operating system.
    We feel very passionate about the subject and enjoy working and teaching. While
    working, We consulted various books, journals and articles. Hence, we are trying
    to consolidate all material and bring out a book, which, we are sure will help
    the readers.


    The book is useful for Engineering students and Master’s degree students for their
    academic preparations as well as competitive exams. In each chapter a problem-solving
    approach has been followed. More emphasis has been given to develop self-learning
    and greater thinking skills to understand the concepts rather than following textual
    content.


    The book fulfills the beginner’s requirements to clear Multi-user OS concepts
    with gradual lead to the high-level concepts and programming, so that it can be
    used as text book at the university level as well it can be used to apply the
    high-level concepts further. The book contains numerous debugged programming examples
    to increase understanding of the subject.


    **[Chapter 1](#c01.xhtml)** discusses the evolution of the UNIX operating system
    since its beginning and its continuing significance as technology and operating
    system. The chapter discusses UNIX system architecture, programming environment
    and it gives a structured overview of all system resources and their management.
    The chapter is organized in such a way that all major entities and their function
    should be clear at a glance to enhance further understanding of the topic when
    it is covered in details in other sections of the book.


    **[Chapter 2](#c02.xhtml)** discusses the most important function of the UNIX
    operating system responsible for all activities in the file, the chapter covers
    UNIX file system, Kernel Data structures to perform File I/O, Basic File permissions,
    Library functions and UNIX system calls for File input/output.


    **[Chapter 3](#c03.xhtml)** will cover more comprehensive and detailed functions
    required for process management like process status, process control block, process
    control and further also discusses about the accessing of user information.


    **[Chapter 4](#c04.xhtml)** will cover Inter process communication which is a
    method through which processes share data and information with each other. Inter-process
    communication is required to synchronize action between cooperating processes
    for uninterrupted sharing of system resources. This chapter entails the IPC options
    available in UNIX operating system. The chapter also discusses the methods of
    processes synchronization in details.


    **[Chapter 5](#c05.xhtml)** Socket programming is a technique which allows two
    network nodes to communicate with each other. Socket is used as an interface to
    send. Receive messages between networking processes. The chapter discusses socket
    data structure, system call for socket communication and different types of I/O
    models. Naming and address conversion system calls are also discussed in this
    chapter.


    **[Chapter 6](#c06.xhtml)** Memory Management is considered as one of the important
    resources i.e. memory of the system. This chapter discusses briefly about the
    types of memory. Different types of memory management techniques implemented in
    the UNIX operating system and functions used to allocate and de-allocate memory
    to the program for its efficient use.


    **[Chapter 7](#c07.xhtml)** explains, Shell a command-line interface to the Unix
    system. Shell provides an environment to execute commands and programs. The chapter
    provides comprehensive concepts of shell including its type, modes of execution,
    functions of shells and command execution.


    **[Chapter 8](#c08.xhtml)** is to explain about the working of the shell which
    is both an interactive command language and a scripting language, and is used
    by the operating system to control the execution of the system using shell scripts.
    Shell scripts are computer programs to execute a series of shell commands to perform
    a system task. The chapter all constructs to write a shell script along with examples.


