    # [Semaphore operations semop()](#toc.xhtml_s117a)


    The **`semop()`** system call is used to perform atomically a user-defined set
    of semaphore operations on the semaphores set.


    **Prototype**


    `int semop(int semid, struct sembuf *sops, unsigned int nsops);`


    The argument **`semid`** is the number obtained from the call to **`semget()`**
    to identify the semaphore set, and the next argument sops is a pointer to a user-defined
    array of the struct **`sembuf`** that is filled with semaphore commands; the third
    argument **`nsops`** specifies the number of semaphore operation structures.


    `struct sembuf {`


    `ushort sem_num;`


    `short sem_op;`


    `short sem_flg;`


    `};`


    The **`sem_num`** is the number of the semaphore in the set that is targeted for
    manipulation, and the **`sem_op`** defines the operation on the semaphore. This
    takes on different meanings, depending on whether **`sem_op`** is positive, negative,
    or zero. Let us have a look at them:


    | **sem_op** | **What happens** |


    | Positive | The value of `sem_op` is added to the semaphore’s value. This is
    how a program uses a semaphore to mark a resource as allocated. |


    | Negative | If the absolute value of `sem_op` is greater than the value of the
    semaphore, the calling process will block until the value of the semaphore reaches
    that of the absolute value of `sem_op`. Finally, the absolute value of `sem_op`
    will be subtracted from the semaphore’s value. This is how a process releases
    a resource guarded by the semaphore. |


    | Zero | This process will wait until the semaphore in question reaches 0. |


    **Table 4.2:** Values of sem_op variable


    The **`sem_flg`** is set to **`IPC_NOWAIT`** and **`SEM_UNDO`**. If an operation
    asserts **`SEM_UNDO`**, it will be undone when the process exits.


    # [Destroying a semaphore](#toc.xhtml_s118a)


    The semaphore set is destroyed using **`semctl()`** system call. The **`cmd`**
    argument is set to **`IPC_RMID`**, which tells **`semctl()`** to remove this semaphore
    set. The two parameters **`semnum`** and **`arg`** have no meaning in the **`IPC_RMID`**
    context and can be set to anything.


    **Example:**


    Assume the semaphore in our set whose id is **`semset_id`** was initialized to
    **`1`** initially:


    `/* this function updates the contents of the file with the given path name. */`


    `void update_file(char* file_path, int number)`


    `{`


    `/* structure for semaphore operations.   */`


    `struct sembuf sem_op;`


    `FILE* file;`


    `/* wait on the semaphore, unless it’s value is non-negative. */`


    `sem_op.sem_num = 0;`


    `sem_op.sem_op = -1;   /* <-- Comment 1 */`


    `sem_op.sem_flg = 0;`


    `semop(sem_set_id, &sem_op, 1);`


    `/* Comment 2 */`


    `/* we “locked” the semaphore, and are assured exclusive access to file.  */`


    `/* manipulate the file in some way. for example, write a number into it. */`


    `file = fopen(file_path, “w”);`


    `if (file) {`


    `fprintf(file, “%d\n”, number);`


    `fclose(file);`


    `}`


    `/* finally, signal the semaphore - increase its value by one. */`


    `sem_op.sem_num = 0;`


    `sem_op.sem_op = 1;   /* <-- Comment 3 */`


    `sem_op.sem_flg = 0;`


    `semop(sem_set_id, &sem_op, 1);`


    `}`


    This code needs some explanations, especially regarding the semantics of the **`semop()`**
    calls, which are as follows:


    *   **Comment 1:** Before we access the file, we use **`semop()`** to wait on
    the semaphore. Supplying **`-1`** in **`sem_op.sem_op`** means: If the value of
    the semaphore is greater than or equal to **`1`**, decrease this value by one
    and return to the caller. Otherwise (the value is 1 or less), block the calling
    process until the value of the semaphore becomes **`1`**, at which point we return
    to the caller.


    *   **Comment 2:** The semantics of **`semop()`** assures us that when we return
    from this function, the value of the semaphore is 0\. Why? It could not be less,
    or else **`semop()`** will not return. It could not be more due to the way we,
    later on, signal the semaphore.


    *   **Comment 3:** After we are done manipulating the file, we increase the value
    of the semaphore by 1, possibly waking up a process waiting on the semaphore.
    If several processes are waiting on the semaphore, the first that got blocked
    on it is wakened and continues its execution.


    Now, let us assume that any process that tries to access the file does it only
    via a call to our **`update_file`** function. As you can see, when it goes through
    the function, it always decrements the value of the semaphore by 1 and then increases
    it by 1. Thus, the semaphore’s value can never go above its initial value, which
    is 1\. Now, let us check two scenarios:


    *   No other process is executing the **`update_file`** concurrently. In this
    case, when we enter the function, the semaphore’s value is 1\. After the first
    **`semop()`** call, the value of the semaphore is decremented to 0, and thus,
    our process is not blocked. We continue to execute the file update, and with the
    second **`semop()`** call, we raise the value of the semaphore back to 1.


    *   Another process is in the middle of the **`update_file`** function. If it
    already managed to pass the first call to **`semop()`**, the value of the semaphore
    is “0”, and when we call **`semop()`**, our process is blocked. When the other
    process signals the semaphore with the second **`semop()`** call, it increases
    the value of the semaphore back to 0, and it wakes up the process blocked on the
    semaphore, which is our process. We now get into executing the file handling code,
    and finally, we raise the semaphore’s value back to 1 with our second call to
    **`semop()`**.


    # [Conclusion](#toc.xhtml_s119a)


    Interprocess communication is an important mechanism that allows two processes
    to communicate with each other. IPC is either used to share data among cooperating
    processes or through this one process can control activities in other processes;
    IPC is used to communicate between two threads in a single process, two processes
    residing in a single system, or processes residing in a distributed environment.
    We discussed the concepts of IPC, including all methods used for IPC. This also
    discussed the concept of semaphores for process synchronization to avoid deadlock
    situations while sharing the shared resource by two concurrent processes. The
    upcoming chapter discusses another inter-process communication method based on
    socket between client and server residing in or across the network.


    # [Review Exercise](#toc.xhtml_s120a)


    1.  How does a semaphore provide access to a shared object to multiple processes?


    2.  Define function calls in UNIX for implementing semaphores.


    3.  Write a program to create a message queue and send some data to it.


    4.  Write a program to destroy a message queue after receiving data available
    on it.


    5.  A shared memory segment is a memory area that can be attached to multiple
    processes. Write a client and server program that passes data back and forth.


    6.  Write a program to show race conditions between client and server programs.


    7.  What happens if the argument to open is a non-existent command?


    8.  Write a program to send and receive data between parent and child processes
    through pipes.


    # [CHAPTER 5](#toc.xhtml_c05)


    # [Socket Programming](#toc.xhtml_c05)


    # [Introduction](#toc.xhtml_s121a)


    Socket programming is the method through which a server can communicate to the
    client. A client creates a connection with the server on a particular port. The
    server listens to the client’s request for connection. The server can communicate
    with multiple clients at a time and serves these clients in a synchronous manner.
    This chapter discusses the socket as a communication interface between client
    and server to send and receive information.


    # [Structure](#toc.xhtml_s122a)


    We will cover the following topics in this chapter:


    *   Socket


    *   Types of sockets


    *   Socket data structure


    *   System calls for socket communication


    *   I/O models


    *   Name and address conversion'
