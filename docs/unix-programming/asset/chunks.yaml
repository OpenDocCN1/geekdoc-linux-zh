- fmt: "\n# [HOME variable](#toc.xhtml_s199a)\n\nThe `HOME` environment variable is\
    \ set by the login process. It specifies the login’s home directory. When the\
    \ `cd` command is executed without any argument, it automatically goes to the\
    \ home directory.\n\n# [Prompt string 1 (PS1) variable](#toc.xhtml_s200a)\n\n\
    The variable `PS1` is a set of characters specified as a prompt symbol. Generally,\
    \ it is a “$` sign. However, this can be changed to anything the user wants.\n\
    \n# [Prompt string 2 (PS2) variable](#toc.xhtml_s201a)\n\nThe `PS2` is displayed\
    \ when the system thinks that the new line started without completing the command.\
    \ Generally, it is `>` sign.\n\n# [MAIL variable](#toc.xhtml_s202a)\n\nThe `MAIL`\
    \ variable contains the address of the mailbox. The `MAIL` variable is set during\
    \ the login process in the user’s profile.\n\n# [CDPATH variable](#toc.xhtml_s203a)\n\
    \nWhen `cd` command is executed to change the directory, the shell searches the\
    \ directory inside the current directory. Variable `CDPATH` contains the list\
    \ of additional directories to be searched to change the directory.\n\n`$CDPATH=$HOME`\n\
    \n**Example:**\n\n`$cd ch_dir`\n\nShell looks for the directory `ch_dir` in the\
    \ current directory; if `ch_dir` is not found in the current directory, the shell\
    \ searches the list of directories defined in `CDPATH` variables.\n\n# [MAILCHECK\
    \ variable](#toc.xhtml_s204a)\n\nThe `MAILCHECK` variable specifies the time and\
    \ how often the shell checks for the mail. The default value of this variable\
    \ is 10 minutes for the Bourne shell. If this variable is not set, shell disables\
    \ the mail checking.\n\n**Note: Specifying the current directory as a search path\
    \ may be dangerous sometime; consider a condition if somebody creates a program\
    \ in the current directory, then this trojan horse will be executed in place of\
    \ the actual who command**\n\n**Note: If `MAILCHECK` is set to 0, the shell checks\
    \ the mail whenever it prints the primary “prompt” symbol.**\n\n# [MAILPATH variable](#toc.xhtml_s205a)\n\
    \nBourne shell checks a single directory set in the `MAIL` variable to provide\
    \ mail notification. If the user wants to watch multiple mailboxes, `MAILPATH`\
    \ variable is required to be set. The `MAILPATH` variable consists colon of a\
    \ separate list of files or directories to be checked to provide mail notification.\n\
    \n`$MAILPATH=/usr/spool/mail/George:/usr/spool/mail/cust_query`\n\n**NOTE : Shell\
    \ ignores `MAIL` variable if `MAILPATH` variable is set. Both can’t be used together.**\n\
    \nIn addition, the login process defines several other environment variables.\
    \ `TERM` defines the terminal type, `USER` or `LOGNAME` defines `userID`, `SHELL`\
    \ defines the default shell, and `TZ` defines the time zone.\n\n# [User’s profile](#toc.xhtml_s206a)\n\
    \nWhen a user logs in to the UNIX system, the shell displays the prompt symbol\
    \ and waits for the user to type the command. However, before displaying the prompt,\
    \ symbol shells executes two files.\n\nThe first file is `/etc/profile`, set up\
    \ by the system administrator. This file contains system-wide default settings\
    \ for all the users who login using Bourne shell (`/bin/sh`). This file usually\
    \ performs things such as checking whether `MAIL` is set, default file creation\
    \ mask (`umask`), and setting standard exported variables. Command in this file\
    \ is simple variable assignments.\n\nA typical `/etc/profile` file is as follows:\n\
    \n```bash\n#Set file creation mask\nunmask 022\n#Tell me where new mail arrives\n\
    MAIL=/usr/mail/$LOGNAME\n#Add my /bin directory to the shell search sequence\n\
    PATH=/usr/bin:/usr/sbin:/etc::\n#Set terminal type\nTERM=lft\n#Make some environment\
    \ variables global\nexport MAIL PATH TERM\n```\n\nThe second file is `.profile`,\
    \ set up by the system administrator and automatically gets executed in the user’s\
    \ home directory after the login process adds `LOGNAME` and `HOME` variables to\
    \ the environment. This file contains the definition of several shell variables\
    \ and exports them to customize the user’s own environment. Because `.profile`\
    \ is stored in the user’s home directory, user can change their `.profile` to\
    \ include whatever commands to be executed when the user logs in. Commands in\
    \ `.profile` can override the settings in the `/etc/profile` file.\n\nA typical\
    \ `.profile` is as follows:\n\n```bash\nPATH=/usr/bin:/etc:/home/bin1:/home/lpp/tps4.0/user::\n\
    epath=/home/gsc/e3:\nexport PATH epath\ncsh\n```\n\nThe `.profile` is simply a\
    \ shell script that gets executed when the user logs in. Regular UNIX commands\
    \ can also be included in the `.profile`. Modifying `.profile` makes a customized\
    \ UNIX environment for the user.\n\n**Note: `.profile` is not shown in the listing\
    \ of files and directories in the home directory because it is a hidden file.\
    \ To list it, `ls -a` command is used.**\n\n# [Conclusion](#toc.xhtml_s207a)\n\
    \nThe shell is an important component of the UNIX operating system. Users can\
    \ interact with Kernel through the shell. It acts as a command interpreter for\
    \ the UNIX operating system. Most of the system administration tasks are performed\
    \ using shell scripts. This chapter discusses all possible features and functions\
    \ of the shell. The next chapter includes the logic, control and writing script.\n\
    \n# [Test your skills](#toc.xhtml_s208a)\n\n1.  **Which of the following commands\
    \ displays the login shell?**\n    a) `$SHELL`\n    b) `$0`\n    c) `echo`\n \
    \   d) `None of the above\n\n2.  **Which of the following commands displays the\
    \ current shell?**\n    a) `$SHELL`\n    b) `$0`\n    c) `echo`\n    d) `None\
    \ of the above\n\n3.  **What is the descriptor of standard output stream?**\n\
    \    a) `0`\n    b) `1`\n    c) `2`\n    d) `3`\n\n4.  **What is the descriptor\
    \ of standard input stream?**\n    a) `0`\n    b) `1`\n    c) `2`\n    d) `3`\n\
    \n5.  **What is the descriptor of standard stream?**\n    a) `0`\n    b) `1`\n\
    \    c) `2`\n    d) `3`\n\n6.  **Which of the following commands creates the Bash\
    \ subshell?**\n    a) `Bash`\n    b) `bsh`\n    c) `Csh`\n    d) `None of the\
    \ above`\n\n7.  **Assuming that `dat_file` is a text file, what is the error (if\
    \ any) in each of the following commands?**\n    a) `Date | dat_file`\n    b)\
    \ `Dat_file | date`\n\n# [Answers](#toc.xhtml_s209a)\n\n1.  `e`\n2.  `a`\n3. \
    \ `b`\n4.  `a`\n5.  `c`\n6.  `a`\n7.  `b`\n\n# [Review Exercises](#toc.xhtml_s210a)\n\
    \n1.  Put a listing of the files in your directory into a file called `filelist`.\
    \ (Then delete it!)\n2.  Create a text file containing a short story, then use\
    \ the `spell` program to check the spelling of the words in the file.\n3.  Redirect\
    \ the output of the `spell` program to a file called `errors`.\n4.  Type the command\
    \ `ls -l` and examine the format of the output. Pipe the output of the command\
    \ `ls -l` to the word count program `wc` to obtain a count of the number of files\
    \ in your directory. Create your own `bin` subdirectory in your home directory\
    \ and make it part of the search `PATH`.\n5.  Explain why we cannot use input\
    \ indirection with `cal`, `date`, `man`, and which commands.\n6.  Explain why\
    \ we cannot use output indirection with the `echo` command?\n7.  If we use the\
    \ following commands in sequence: `Command 1 | Command 2`\n    *   What is the\
    \ necessary requirement for `Command1`?\n    *   What is the necessary requirement\
    \ for `Command2`?\n8.  One of the following commands works, and the other does\
    \ not. Which one works, and what is the problem with other commands?\n    *  \
    \ `date | more`\n    *   `more | date`\n9.  Can we use input indirection with\
    \ `vi` command?\n10. Briefly explain the concept of pipelining here or give reference\
    \ to the earlier chapter (if it has already been explained) before proceeding\
    \ with the commands.\n\n# [Lab practice](#toc.xhtml_s211a)\n"
