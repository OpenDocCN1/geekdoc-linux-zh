  trans: "\n\n在给定的示例中，创建了一个用于读写的共享内存段。创建的内存段被挂载到当前程序，并将字符串 `str` 写入其中。写入后，该进程进入睡眠状态，直到另一个进程读取该字符串并在内存段中放入\
    \ `*`。\n\n# 服务端程序\n\n```c\n#include <sys/types.h>\n#include <sys/ipc.h>\n#include\
    \ <sys/shm.h>\n#include <stdio.h>\n\n#define SHMSIZE     100\n#define SHM_KEY\
    \  1267\n\nmain()\n{\n    char *str;\n    int shmid;\n    key_t key;\n    char\
    \ *shm, *s;\n    key = SHM_KEY;\n    /*    创建内存段。*/\n    if ((shmid = shmget(key,\
    \ SHMSZ, IPC_CREAT | 0666)) < 0) {\n        printf(\"Segment not created successfully\"\
    );\n        exit(1);\n    }\n    /* 现在我们将该内存段挂载到我们的数据空间     */\n    if ((shm =\
    \ shmat(shmid, NULL, 0)) == (char *) -1) {\n        perror(\"shmat\");\n     \
    \   exit(1);\n    }\n    s = shm;\n    scanf(\"%s\",&str);\n    strcpy(s,str);\n\
    \    *s = NULL;\n    /* 进程进入睡眠状态，直到其他进程读取共享段并放入 *  */\n    while (*shm != '*')\n\
    \        sleep(1);\n    exit(0);\n}\n```\n\n在客户端程序中，内存段被访问并挂载到客户端进程。如果挂载成功，则从内存段中读取字符串并打印到屏幕上，直到找到\
    \ NULL 字符。一旦内存段为空，客户端进程会将 `*` 放入段中。服务端进程一旦发现 `*` 就会终止。\n\n```c\n#include <sys/types.h>\n\
    #include <sys/ipc.h>\n#include <sys/shm.h>\n#include <stdio.h>\n\n#define SHMSIZE\
    \     100\n#define SHM_KEY  1267\n\nmain()\n{\n    int shmid;\n    key_t key;\n\
    \    char *shm, *s;\n    if ((shmid = shmget(SHM_KEY, SHMSIZE, 0666)) < 0) {\n\
    \        printf('\\n Memory segment not created successfully \\n');\n        exit(1);\n\
    \    }\n    if ((shm = shmat(shmid, NULL, 0)) == (char *) -1) {\n        perror(\"\
    shmat\");\n        exit(1);\n    }\n    /* 现在读取服务端放入内存的内容  */\n    for (s = shm;\
    \ *s != NULL; s++)\n        putchar(*s);\n    putchar('\\n');\n    /* 从共享内存中读取字符后，在对应位置放入\
    \ *  */\n    *shm = '*';\n    exit(0);\n}\n```\n\n# 进程同步\n两个并发进程在共享资源时必须进行同步，以避免死锁。UNIX\
    \ 使用信号量来控制两个进程之间共享资源的访问。\n\n# 信号量\n信号量并不完全是一种 IPC（进程间通信）形式；它是一个用于控制多个进程共享资源访问的变量。信号量是一个包含整数值的资源，允许进程通过在原子操作中测试和设置该值来实现同步。这意味着，测试信号量值并根据测试结果将其设置为不同值的进程，可以保证在操作过程中没有其他进程会干扰。\n\
    \n进程在获取共享资源之前需要执行测试。对共享资源的访问由信号量控制。在使用资源之前，执行以下步骤来检查信号量的值：\n\n1. 进程测试控制资源访问的信号量。\n\
    2. 如果信号量值为正，则进程可以使用该资源。进程一旦获取资源访问权限，会将信号量的值减 1，表示它已使用了一个资源单元。\n3. 如果信号量值为 0，进程进入睡眠状态；当进程唤醒时，会再次检查信号量的值。\n\
    4. 在完成资源的使用后，信号量的值加 1，以便任何其他处于睡眠状态的进程可以访问。\n\n图 4.6：信号量\n\n# 信号量操作\n信号量上执行两种类型的操作：`wait`（等待）和\
    \ `signal`（信号）。`wait` 操作首先检查信号量的值是否等于某个数。如果是，则减少其值并返回。如果不是，该操作将阻塞调用进程，直到信号量的值达到期望值。`signal`\
    \ 操作增加信号量的值，唤醒一个或多个等待信号量的进程。\n\n# 信号量集\n信号量集是一个将一组信号量存储在一起的结构，可能允许进程对部分或全部信号量共同提交一个事务。事务意味着我们保证要么所有操作都成功完成，要么一个都不执行。\n\
    \n内核为每个信号量集维护一个结构：\n\n```c\nstruct semid_ds {\n    struct ipc_perm sem_perm; \
    \  /* 权限 ..ipc.h */\n    time_t sem_otime;           /* 上次 semop 时间 */\n    time_t\
    \ sem_ctime;           /* 上次修改时间 */\n    struct sem *sem_base;      /* 指向数组中第一个信号量的指针\
    \ */\n    struct wait_queue *eventn;\n    struct wait_queue *eventz;\n    struct\
    \ sem_undo *undo;     /* undo 请求 */\n    ushort sem_nsems;           /* 数组数量 */\n\
    };\n```\n\n让我们详细讨论它们：\n\n* `sem_perm`: `ipc_perm` 结构包含访问权限。\n* `sem_otime`: 上次\
    \ `semop` 操作的时间。\n* `sem_ctime`: 上次修改此结构的时间。\n* `sem`: 内核用于维护信号量值的内部结构。\n* `undo`:\
    \ 关于此数组的 undo 请求。\n* `sem_nsems`: 信号量的数量。\n* `wait_queue`: 指向任务结构的循环列表。\n\n# 创建信号量\n\
    通过 `semget` 系统调用创建信号量或访问现有信号量，该调用返回信号量 ID。\n\n原型：\n\n```c\nint semget(key_t key,\
    \ int nsems, int semflg);\n```\n\n`key` 是用于标识此信号量集的唯一标识。下一个参数 `nsems` 是在新信号量集中创建的信号量数量；`semflg`\
    \ 参数指定新信号量集的权限。如果 `semflg` 的值仅为 `IPC_CREAT`，则将返回新创建的信号量集的标识，或与 key 参数匹配的现有信号量集的标识。如果\
    \ `IPC_CREAT` 配合 `IPC_EXCL` 使用，则创建新集，如果信号量集已存在则返回 -1。\n\n# 控制信号量\n信号量集创建后，使用 `semctl`\
    \ 系统调用控制整个集或特定的信号量。\n\n原型：\n\n```c\nint semctl ( int semid, int semnum, int cmd,\
    \ union semun arg );\n```\n\n`semid` 是信号量集的键标识，`semnum` 参数是信号量集中目标操作的信号量索引。`cmd`\
    \ 参数控制信号量操作，它具有以下值：\n\n* `IPC_STAT`: 获取集的 `semid_ds` 结构并将其存储在 `semun` 联合体 `buf`\
    \ 参数的地址中。\n* `IPC_SET`: 设置集的 `semid_ds` 结构中的 `ipc_perm` 成员。从 `semun` 联合体的 `buf`\
    \ 参数获取值。\n* `IPC_RMID`: 从内核中删除该集。\n* `GETALL`: 给集中所有信号量的值。这些整数值存储在联合体数组成员指向的无符号短整数数组中。\n\
    * `GETNCNT`: 返回当前等待资源的进程数量。\n* `GETPID`: 返回执行上次 `semop` 调用的进程 PID。\n\n"
- fmt: "\n*   `GETVAL`: Returns the value of a single semaphore within the set.\n\n\
    # Semaphore operations `semop()`](#toc.xhtml_s117a)\n\nThe `semop()` system call\
    \ is used to perform atomically a user-defined set of semaphore operations on\
    \ the semaphores set.\n\n### Prototype\n\n```\nint semop(int semid, struct sembuf\
    \ *sops, unsigned int nsops);\n```\n\nThe argument `semid` is the number obtained\
    \ from the call to `semget()` to identify the semaphore set, and the next argument\
    \ `sops` is a pointer to a user-defined array of the struct `sembuf` that is filled\
    \ with semaphore commands; the third argument `nsops` specifies the number of\
    \ semaphore operation structures.\n\n```c\nstruct sembuf {\n    ushort sem_num;\n\
    \    short sem_op;\n    short sem_flg;\n};\n```\n\nThe `sem_num` is the number\
    \ of the semaphore in the set that is targeted for manipulation, and the `sem_op`\
    \ defines the operation on the semaphore. This takes on different meanings, depending\
    \ on whether `sem_op` is positive, negative, or zero. Let us have a look at them:\n\
    \n| sem_op | What happens |\n| :--- | :--- |\n| Positive | The value of `sem_op`\
    \ is added to the semaphore’s value. This is how a program uses a semaphore to\
    \ mark a resource as allocated. |\n| Negative | If the absolute value of `sem_op`\
    \ is greater than the value of the semaphore, the calling process will block until\
    \ the value of the semaphore reaches that of the absolute value of `sem_op`. Finally,\
    \ the absolute value of `sem_op` will be subtracted from the semaphore’s value.\
    \ This is how a process releases a resource guarded by the semaphore. |\n| Zero\
    \ | This process will wait until the semaphore in question reaches 0. |\n\n**Table\
    \ 4.2:** Values of `sem_op` variable\n\nThe `sem_flg` is set to `IPC_NOWAIT` and\
    \ `SEM_UNDO`. If an operation asserts `SEM_UNDO`, it will be undone when the process\
    \ exits.\n\n# Destroying a semaphore](#toc.xhtml_s118a)\n\nThe semaphore set is\
    \ destroyed using `semctl()` system call. The `cmd` argument is set to `IPC_RMID`,\
    \ which tells `semctl()` to remove this semaphore set. The two parameters `semnum`\
    \ and `arg` have no meaning in the `IPC_RMID` context and can be set to anything.\n\
    \n### Example:\n\nAssume the semaphore in our set whose id is `semset_id` was\
    \ initialized to `1` initially:\n\n```c\n/* this function updates the contents\
    \ of the file with the given path name. */\nvoid update_file(char* file_path,\
    \ int number)\n{\n    /* structure for semaphore operations. */\n    struct sembuf\
    \ sem_op;\n    FILE* file;\n    /* wait on the semaphore, unless it’s value is\
    \ non-negative. */\n    sem_op.sem_num = 0;\n    sem_op.sem_op = -1;   /* <--\
    \ Comment 1 */\n    sem_op.sem_flg = 0;\n    semop(sem_set_id, &sem_op, 1);\n\
    \    /* Comment 2 */\n    /* we “locked” the semaphore, and are assured exclusive\
    \ access to file.  \n\n/* manipulate the file in some way. for example, write\
    \ a number into it. */\n    file = fopen(file_path, “w”);\n    if (file) {\n \
    \       fprintf(file, “%d\\n”, number);\n        fclose(file);\n    }\n    /*\
    \ finally, signal the semaphore - increase its value by one. */\n    sem_op.sem_num\
    \ = 0;\n    sem_op.sem_op = 1;   /* <-- Comment 3 */\n    sem_op.sem_flg = 0;\n\
    \    semop(sem_set_id, &sem_op, 1);\n}\n```\n\nThis code needs some explanations,\
    \ especially regarding the semantics of the `semop()` calls, which are as follows:\n\
    \n* **Comment 1:** Before we access the file, we use `semop()` to wait on the\
    \ semaphore. Supplying `-1` in `sem_op.sem_op` means: If the value of the semaphore\
    \ is greater than or equal to `1`, decrease this value by one and return to the\
    \ caller. Otherwise (the value is 1 or less), block the calling process until\
    \ the value of the semaphore becomes `1`, at which point we return to the caller.\n\
    \n* **Comment 2:** The semantics of `semop()` assures us that when we return from\
    \ this function, the value of the semaphore is 0. Why? It could not be less, or\
    \ else `semop()` will not return. It could not be more due to the way we, later\
    \ on, signal the semaphore.\n\n* **Comment 3:** After we are done manipulating\
    \ the file, we increase the value of the semaphore by 1, possibly waking up a\
    \ process waiting on the semaphore. If several processes are waiting on the semaphore,\
    \ the first that got blocked on it is wakened.\n\n# Conclusion](#toc.xhtml_s119a)\n\
    \nInterprocess communication is an important mechanism that allows two processes\
    \ to communicate. IPC is either used to share data among cooperating processes\
    \ or through this one process can control activities in others; IPC is used to\
    \ communicate between threads in a single process, two processes residing in a\
    \ single system, or processes residing in a distributed environment. We discussed\
    \ the concepts of IPC, this also discussed the concept of semaphores for process\
    \ synchronization to avoid deadlock situations while sharing the resource. The\
    \ upcoming chapter discusses another inter-process communication method based\
    \ on socket between client and server.\n\n# Review Exercise](#toc.xhtml_s120a)\n\
    \n1. How does a semaphore provide access to a shared object to multiple processes?\n\
    2. Define function calls in UNIX for implementing semaphores.\n3. Write a program\
    \ to create a message queue and send some data to it.\n4. Write a program to destroy\
    \ a message queue after receiving data available on it.\n5. A shared memory segment\
    \ is a memory area that can be attached to multiple processes. Write a client\
    \ and server that passes data back and forth.\n6. Write a program to show race\
    \ conditions between client and server programs.\n7. What happens if the argument\
    \ to open is a non-existent command?\n8. Write a program to send and receive data\
    \ between parent and child processes through pipes.\n"
