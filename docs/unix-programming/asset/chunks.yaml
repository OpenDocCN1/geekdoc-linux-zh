- fmt: "\nIn the given example, a shared memory segment is created for reading and\
    \ writing. The created segment is attached to the current program, and string\
    \ `str` is written onto it. After writing, the process goes into a sleep state\
    \ until some other process reads the string and puts `*` onto the memory segment.\n\
    \n# Server program\n\n```c\n#include <sys/types.h>\n#include <sys/ipc.h>\n#include\
    \ <sys/shm.h>\n#include <stdio.h>\n\n#define SHMSIZE     100\n#define SHM_KEY\
    \  1267\n\nmain()\n{\n    char *str;\n    int shmid;\n    key_t key;\n    char\
    \ *shm, *s;\n    key = SHM_KEY;\n    /*    Create the segment.    */\n    if ((shmid\
    \ = shmget(key, SHMSZ, IPC_CREAT | 0666)) < 0) {\n        printf(\"Segment not\
    \ created successfully\");\n        exit(1);\n    }\n    /* Now we attach the\
    \ segment to our data space     */\n    if ((shm = shmat(shmid, NULL, 0)) == (char\
    \ *) -1) {\n        perror(\"shmat\");\n        exit(1);\n    }\n    s = shm;\n\
    \    scanf(\"%s\",&str);\n    strcpy(s,str);\n    *s = NULL;\n    /* Process goes\
    \ in sleep state until some other process read shared segment and put *  */\n\
    \    while (*shm != '*')\n        sleep(1);\n    exit(0);\n}\n```\n\nIn the client\
    \ program, the memory segment is accessed and attached to the client process,\
    \ If successfully attached, the string from memory segment is read and printed\
    \ to the screen until NULL character found. Once memory segment is empty, the\
    \ client process puts `*` onto the segment. Server process terminates as soon\
    \ as it find `*`.\n\n```c\n#include <sys/types.h>\n#include <sys/ipc.h>\n#include\
    \ <sys/shm.h>\n#include <stdio.h>\n\n#define SHMSIZE     100\n#define SHM_KEY\
    \  1267\n\nmain()\n{\n    int shmid;\n    key_t key;\n    char *shm, *s;\n   \
    \ if ((shmid = shmget(SHM_KEY, SHMSIZE, 0666)) < 0) {\n        printf('\\n Memory\
    \ segment not created successfully \\n');\n        exit(1);\n    }\n    if ((shm\
    \ = shmat(shmid, NULL, 0)) == (char *) -1) {\n        perror(\"shmat\");\n   \
    \     exit(1);\n    }\n    /* Now read what the server put in the memory  */\n\
    \    for (s = shm; *s != NULL; s++)\n        putchar(*s);\n    putchar('\\n');\n\
    \    /*After characters from the shared memory. put * at the location  */\n  \
    \  *shm = '*';\n    exit(0);\n}\n```\n\n# Process synchronization\nTwo concurrent\
    \ processes must be synchronized while sharing resources with each other to avoid\
    \ deadlock. The UNIX uses semaphores to control access to the shared resource\
    \ between two processes.\n\n# Semaphores\nA semaphore is not exactly a form of\
    \ IPC; it is a variable to control access to the shared resource among multiple\
    \ processes. A semaphore is a resource that contains an integer value and allows\
    \ processes to synchronize by testing and setting this value in a single operation.\
    \ This means that the process that tests the value of a semaphore and sets it\
    \ to a different value (based on the test) is guaranteed no process will interfere\
    \ with the operation in the middle.\n\nA process needs to perform testing before\
    \ getting access to the shared resource. The access to the shared resource is\
    \ controlled by a semaphore. The following steps are performed to check the value\
    \ of the semaphore before using the resource as:\n\n1. Process tests the semaphore\
    \ that controls access to the resource.\n2. If the value of the semaphore is positive,\
    \ then the process can use the resource. As soon as the process gets access to\
    \ the resource, it decrements the value of the semaphore by 1 to indicate it has\
    \ used one unit of resource.\n3. If the value of the semaphore is 0, the process\
    \ goes into a sleep state; when the process wakes up, it again checks the value\
    \ of semaphore.\n4. After finishing the use of the resource, the value of the\
    \ semaphore is incremented by 1 to give access to any other process that is in\
    \ the sleep state.\n\nFigure 4.6: Semaphore\n\n# Semaphore operations\nTwo types\
    \ of operations are carried on a semaphore: `wait` and `signal`. The `wait` operation\
    \ first checks if the semaphore’s value equals some number. If it does, it decreases\
    \ its value and returns. If it does not, the operation blocks the calling process\
    \ until the semaphore’s value reaches the desired value. The `signal` operation\
    \ increments the value of the semaphore, awakening one or more processes that\
    \ are waiting for the semaphore.\n\n# Semaphore set\nA semaphore set is a structure\
    \ that stores a group of semaphores together and possibly allows the process to\
    \ commit a transaction on part or all of the semaphores together. A transaction\
    \ means that we are guaranteed that either all operations are done successfully\
    \ or none is done.\n\nKernel maintains a structure for every semaphore set:\n\n\
    ```c\nstruct semid_ds {\n    struct ipc_perm sem_perm;   /* permissions .. ipc.h\
    \ */\n    time_t sem_otime;           /* last semop time */\n    time_t sem_ctime;\
    \           /* last change time */\n    struct sem *sem_base;      /* ptr to first\
    \ semaphore in array */\n    struct wait_queue *eventn;\n    struct wait_queue\
    \ *eventz;\n    struct sem_undo *undo;     /* undo requests on this array */\n\
    \    ushort sem_nsems;           /* no. of semaphores in array */\n};\n```\n\n\
    Let us discuss them in detail:\n\n* `ipc_perm`: `ipc_perm` structure contains\
    \ access permissions for a particular semaphore.\n* `sem_otime`: Time of the last\
    \ `semop()` operation (more on this in a moment).\n* `sem_ctime`: Time of the\
    \ last change to this structure (mode change).\n* `sem`: The `sem` structure is\
    \ an internal structure used by the Kernel to maintain the set of values for the\
    \ semaphore.\n* `sem_undo`: Number of undo requests in this array.\n* `sem_nsems`:\
    \ Number of semaphores in the semaphore set.\n* `wait_queue`: A `wait_queue` is\
    \ a circular list of pointers to task structures.\n\n# Creating semaphore\nA semaphore\
    \ is created, or an existing semaphore can be accessed using the `semget()` system\
    \ call, which returns the semaphore ID.\n\n**Prototype**\n\n```c\nint semget(key_t\
    \ key, int nsems, int semflg);\n```\n\n`key` is a unique identifier that is used\
    \ by different processes to identify this semaphore set. The next argument, `nsems`,\
    \ is the number of semaphores that should be created in the new semaphore set;\
    \ the `semflg` argument specifies what permissions should be on the new semaphore\
    \ set. If the value of `semflg` is `IPC_CREAT` alone, it returns an identifier\
    \ for a newly created semaphore set or an identifier for an existing semaphore\
    \ set with which the key argument matches. If `IPC_CREAT` is used along with `IPC_EXCL`,\
    \ then it creates the new set or returns –1 if the semaphore set already exists.\n\
    \n# Controlling semaphore\nAfter the semaphore set is created, the whole set or\
    \ a particular semaphore is controlled using the `semctl()` system call.\n\n**Prototype**\n\
    \n```c\nint semctl ( int semid, int semnum, int cmd, union semun arg );\n```\n\
    \n`semid` is the key identifier of the semaphore set, and the `semnum` argument\
    \ is an index of semaphore in the semaphore set, which is targeted for control\
    \ operation. The `cmd` argument controls the semaphore operation, and it has the\
    \ following values:\n\n* `IPC_STAT`: Retrieves the `semid_ds` structure for a\
    \ set and stores it in the address of the `buf` argument in the `semun` union.\n\
    * `IPC_SET`: Sets the value of the `ipc_perm` member of the `semid_ds` structure\
    \ for a set. Takes the values from the `buf` argument of the `semun` union.\n\
    * `IPC_RMID`: Destroys the set from the Kernel.\n* `GETALL`: Gives values of all\
    \ semaphores in a set. The integer values are stored in an array of unsigned short\
    \ integers pointed to by the array member of the union.\n* `GETNCNT`: Returns\
    \ the number of processes currently waiting for resources.\n* `GETPID`: Returns\
    \ the PID of the process which performed the last `semop` call.\n"
