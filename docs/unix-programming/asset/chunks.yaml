    # Receiving a message from the queue


    The **`msgrcv()`** function is used to read a message from the message queue.


    **Prototype**


    `int msgrcv(int msqid, void *msgp, size_t msgsz, long msgtyp, int msgflg);`


    The **`msqid`** is the message identifier, **`msgp`** is the pointer to the buffer
    to store the read message, **`msgsz`** is the length of the data part of the buffer
    storing the message, and messages are received from the queue depending on the
    **`msgtyp`** parameter. The following table shows which message will be read based
    on the value of **`msgtyp`** parameter:


    | **msgtyp** | **Effect on msgrcv()** |


    | Zero | Retrieves the next message on the queue, regardless of its `mtype`. |


    | Positive | Retrieves the next message with `mtype` equal to the specified `msgtyp`.
    |


    | Negative | Retrieves the first message on the queue whose `mtype` field is less
    than or equal to the absolute value of the `msgtyp` argument. |


    **Table 4.1:** Working of msgrcv()


    If the message of the specified type is not there in the message queue, then the
    action will be decided based on the value of **`msgflg`** parameter.


    If **`msgflg`** is set to **`IPC_NOWAIT`**, the function returns immediately with
    the error **`ENOMSG`**, and the caller process is blocked until:


    *   The message queue is destroyed.


    *   A message of specified type ids arrived at the message queue.


    *   The calling thread is interrupted; in this case, the function returns with
    the error **`EINTR`**.


    If **`msgflg`** is set with an additional bit **`MSG_NOERROR`**, the function
    does not return an error if the length of the actual message is greater than the
    **`msgsz`** parameter; instead, it truncates an extra portion of the message.


    **Example**


    In the given example, the receiver process connects to the message queue; if the
    message queue does not exist, an error will be generated, and the process terminates
    abnormally. Otherwise, all messages are read and printed to the screen till the
    end of the message queue.


