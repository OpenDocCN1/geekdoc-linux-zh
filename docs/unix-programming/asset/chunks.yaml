    \n# 答案 (#toc.xhtml_s167a)\n\n1. **(a)**\n2. **(c )**\n3. **(b)**\n4. **(b)**\n\
    5. **(a)**\n6. **(a)**\n7. **(b)**\n\n# 问题 (#toc.xhtml_s168a)\n\n1. 内存管理的主要目标是什么？\n\
    2. 交换和分页之间的区别是什么？\n3. 哪些进程不受交换程序的打扰？给出原因。\n4. 为什么 UNIX 不允许内核内存分页出？\n\n# 第 7 章\
    \ (#toc.xhtml_c07)\n\n# UNIX Shell 和自定义环境 (#toc.xhtml_c07)\n\n正如我们所知，UNIX 操作系统的最可见部分是\
    \ shell，这使得它是用户需要了解的最重要的组件。要执行任何任务，都需要向 shell 执行命令。如果需要执行工具或程序，shell 请求内核执行它。shell\
    \ 有两个部分；第一个是解释器，第二个部分是 shell 的编程能力，允许我们编写脚本。shell 的另一个重要功能是自定义环境。我们将密切查看作为解释器和自定义器的\
    \ shell。\n\n# 结构 (#toc.xhtml_s169a)\n\n在本章中涵盖以下主题：\n\n* shell 的功能和执行模式\n* shell\
    \ 执行周期\n* 提供的标准 shell\n* shell 元字符的使用\n* 使用转义和引号避免解释\n* 使用重定向使用输入输出\n* 使用 noclobber\
    \ 选项 `/dev/null`\n* 命令分组\n* 不同命令的管道\n* 使用 shell 变量自定义环境\n* 理解配置文件\n\n# 目标 (#toc.xhtml_s170a)\n\
    \n学习本章后，你将能够：\n\n* 理解 shell 的基础\n* 理解不同的功能模式\n* 理解执行 shell 的概念\n* 理解命令分组和管道\n\
    * 理解配置文件\n\n# Shell 简介 (#toc.xhtml_s171a)\n\nshell 是一个作为 UNIX 界面的程序。shell 通常被称为命令解释器，因为它允许系统理解用户的命令。系统提供了多种\
    \ shell，每个都有不同的特性，但它们都会影响命令的解释。shell 提供了创建环境的工具。\n\nshell 是 UNIX 中的工具。它在用户登录系统时加载到内存中。登录过程中执行的\
    \ shell 列在 `/etc/passwd` 文件的相应条目中。如果 `/etc/passwd` 文件中没有指定 shell，则默认执行标准 shell\
    \ `/usr/bin/sh`。\n\n# UNIX Shell 执行模式 (#toc.xhtml_s172a)\n\nUNIX shell 基本上以三种模式执行：\n\
    \n1. 交互模式\n2. shell 编程模式\n3. UNIX 会话自定义模式\n\n# 交互模式 (#toc.xhtml_s173a)\n\n在交互模式下，shell\
    \ 等待用户输入命令，由 shell 进行解释。命令在消除所有错误后执行。命令可能包含特殊符号来缩写文件名并重定向输入输出。\n\n# 编程模式 (#toc.xhtml_s174a)\n\
    \n在编程模式下，系统以 shell 脚本的形式一起执行一组 UNIX 命令。许多内置命令以 shell 脚本的形式组合在一起。与交互模式相比，脚本可以保存并分层执行。\n\
    \n# UNIX 会话自定义模式 (#toc.xhtml_s175a)\n\n"
