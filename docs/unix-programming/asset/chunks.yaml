  trans: "\n\n## 工具程序与应用程序或工具层。\n\n将系统视为一组分层，操作系统通常被称为系统内核或简称 `Kernel`（内核）。它强调了内核与用户程序的隔离性，因为程序不依赖于底层硬件，并且易于在运行于不同硬件的\
    \ UNIX 系统之间进行迁移。如果程序不对底层硬件做任何假设，那么下一层中显示的 `shell` 和编辑器等程序将通过一组定义良好的系统调用与 `Kernel`\
    \ 交互。与 `Kernel` 交互以执行各种操作的系统调用用于调用程序以及在 `Kernel` 与程序之间交换数据。若干被称为 `commands` 的程序位于此层之上。其他应用程序构建在低级程序之上。让我们详细讨论它们：\n\
    \n*   **硬件层**：最内层的层，为操作系统提供服务，称为硬件层。这包括终端、终端控制器、磁盘、磁带、内存以及各种设备控制器。\n*   **内核 (Kernel)**：这是操作系统的核心部分，直接与硬件交互并为用户程序提供服务。`Kernel`\
    \ 存储在一个名为“UNIX”的文件中。系统中只运行一个 `Kernel`。用户程序通过一组作为 `Kernel` 部分的标准系统调用与 `Kernel`\
    \ 交互，提供 `Kernel` 的以下基本功能：\n    *   **文件系统管理**：包括对由文件和目录组成的 UNIX 文件系统的管理。这包括创建、打开、读取、写入、关闭文件，以及文件系统与硬件之间的其他操作和数据传输。\n\
    \    *   **内存管理**：包括为程序分配内存、共享内存空间或释放内存。如果系统可用内存不足，`Kernel` 会通过将程序临时写入名为 `swap\
    \ device`（交换设备）的次级内存来释放内存。\n    *   **进程管理**：在 UNIX 中，进程是执行中的程序。进程管理包括将各种进程调度到\
    \ CPU 以及执行进程，包括创建、终止或挂起进程。它还包括进程间通信。\n    *   **存储管理**：为用户数据分配辅助存储磁盘并管理空空间。\n\
    \    *   **设备管理**：包括允许对外围设备（如终端、磁带机、磁盘驱动器和网络设备）进行控制访问。\n*   **Shell**：这是 UNIX\
    \ 中用户可见的部分。它是命令解释器，负责解释用户输入的命令并将其传递给 `Kernel`，由 `Kernel` 执行。`shell` 是为每个使用 UNIX\
    \ 的用户独立运行的程序。系统中运行的 `shell` 数量等于同时在系统中工作的用户数量。有不同类型的 shell，常用的有有 `Bourne shell`、`C\
    \ Shell`、`Korn Shell` 等：\n    *   由 Steve Bourne 创建的 `Bourne shell` 最流行，并包含在每个\
    \ UNIX 系统中。\n    *   `C shell` 在 UNIX 程序员中非常流行，由 Bill Joy 在伯克利创建。`C shell` 优于\
    \ `Bourne` 的优点如下：\n        *   它允许对命令设置别名；即我们可以用别名重命名命令，这样就可以用短别名代替长命令。\n    \
    \    *   `C shell` 具有命令历史功能，可以回溯之前输入的命令。\n    *   `Korn Shell` 是 `Bourne shell`\
    \ 的超集，更加强大。由 AT&T 实验室的 David Korn 设计。\n    *   `Bourne Again Shell (Bash)` 来自自由软件基金会的\
    \ GNU 项目，基于 `shell`。\n*   **工具程序与应用程序**：UNIX 中有数百种工具程序。工具程序是标准的 UNIX 程序，用于为用户提供支持。大多数\
    \ UNIX 工具程序以应用程序的形式存在：\n    *   文件管理：`rm`、`cat`、`ls`、`rmdir`、`mkdir`。\n    * \
    \  用户管理：`passwd`、`chmod`、`chgrp`。\n    *   进程管理：`kill`、`ps`。\n    *   打印：`lp`、`troff`、`pr`。\n\
    \    *   程序开发工具，如 `sccs`、`make`、编辑器（`vi` 和 `ed`）以及编译器。\n    *   UNIX 电子邮件工具。\n\
    *   **窗口层**：UNIX  GUI 是位于核心操作系统之上的独立层。`X window system` 是所有现代 UNIX 操作系统的底层图形层。它负责接受键盘和鼠标等输入并在显示器上绘制图形对象。绘制图形和从设备获取输入是名为\
    \ `Window manager`（窗口管理器）软件的工作。`X` 有许多窗口管理器可用。通常，窗口管理器是专有软件，只运行在特定类型的 UNIX 上。其中一些是开源的，可以在任何安装了\
    \ `X` 的系统上运行。\n\n`X Window system` 有一些非常独特且实用的功能。这些功能由 `X` 直接提供，因此所有 X 窗口管理器和所有\
    \ UNIX/X11 系统共有。\n\n# UNIX 编程环境\n\nUNIX 是一种基本上为多用户和多任务环境设计的的可移植操作系统。它包含数百个简单的单用途功能，这些功能几乎可以组合以完成想象的所有处理任务。UNIX\
    \ 系统用于三种不同的编程环境。\n\n## 个人环境\n\n尽管 UNIX 最初是为多用户环境设计的，但某些用户将其安装在个人电脑上。随着免费 UNIX\
    \ 系统 `LINUX` 的发明，这一趋势得到了加速。2001 年，Apple 系统将 UNIX 整合为其内核。\n\n## 分时环境\n\nUNIX 是一种多用户、多任务系统，运行在分时环境中，通过单处理单元处理多个任务。`Kernel`\
    \ 维护一个任务列表，并为每个任务分配时间片，然后是下一个任务，依此类推。通常，内核在进程之间的切换非常快，使得每个用户都能获得单独关注。\n\n图 1.2：多用户环境\n\
    \n## 客户端/服务器环境\n\n客户端/服务器计算环境在服务器计算机和客户端计算机之间划分处理功能。在客户端/服务器模型中，数据处理负载在客户端计算机和强大的服务器计算机之间共享。服务器计算机专门存储和管理数据并满足请求。服务器接收客户端的结构化请求，处理请求的数据并将数据传回客户端。客户端从接口接收用户输入，使用其\
    \ CPU 处理信息，并将结果展示给用户。\n\n**注意：在单用户环境中，程序可能有多个实例，因为进程默认可能会拆分为两个进程**\n\n## UNIX\
    \ 进程\n\n执行中的程序就是进程。在 UNIX 中，进程是一个工作单元。如果 n 个用户正在执行同一个程序，系统中就有 n 个进程在执行。进程通过遵循严格的指令序列执行，该序列自包含且不会跳转到另一个进程。\n\
    \n所有的 UNIX 命令都是程序化的，因此在执行时会对系统进程做出贡献。\n\n## 进程属性\n\nUNIX 中的每个进程都具有某些属性（如表 1.1\
    \ 所示），这些属性影响进程的执行。\n\n| **属性** | **含义** |\n\n"
