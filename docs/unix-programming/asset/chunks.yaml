    \    4. `$(d)?` \n    5. `PS1`\n25. Write a shell script to identify whether an\
    \ odd or an even number of parameters is passed.\n\nSolutions to some of the shell\
    \ scripts are provided here:\n\n## Shell Script to display a word repeatedly\n\
    \n```bash\nif [ $# -ne 2 ]\nthen\n  echo “Usage: a1 word number”\n  exit\nelse\n\
    \  i=1\n  while [ $i -le $2 ]\n  do\n    echo $1\n    i=`expr $i + 1`\n  done\n\
    fi\n```\n\n## Shell Script to check for a leap year\n\n```bash\nif [ $# -ne 1\
    \ ]\nthen\n  echo “Usage: $0 year”\n  exit\nfi\nif [ `expr $1 % 4` -eq 0 -a \\\
    (`expr $1 % 100` -ne 0 -o `expr $1 % 400` -eq 0 \\)]\nthen\n  echo $1 is a Leap\
    \ Year\nelse\n  echo $1 is not a Leap Year\nfi\n```\n\n## Shell Script to delete\
    \ all lines containing the word UNIX\n\n```bash\nif [ $# -ne 1 ]\nthen\n  echo\
    \ “Usage: $0 filename”\n  exit\nelse\n  grep -v “UNIX” $1 > tmp\n  mv tmp $1\n\
    fi\n```\n\n## Shell Script to compare 2 files and delete the second file if found\
    \ equal\n\n```bash\nif [ $# -ne 2 ]\nthen\n  echo “Usage: $0 file1 file2”\n  exit\n\
    else\n  cmp -s $1 $2\n  if [ $? -eq 0 ]\n  then\n    rm -f $2\n  else\n    echo\
    \ “Files $1 and $2 are not identical”\n  fi\nfi\n```\n\n## Shell Script to find\
    \ the sum of digits of a number\n\n```bash\nif [ $# -ne 1 ]\nthen\n  echo “Usage:\
    \ $0 number”\n  exit\nelse\n  sum=0\n  num=$1\n  while [ $num -ne 0 ]\n  do\n\
    \    tmp=`expr $num % 10`\n    sum=`expr $sum + $tmp`\n    num=`expr $num / 10`\n\
    \  done\n  echo The sum of digits is $sum\nfi\n```\n\n## Shell Script to find\
    \ factorial of a number\n\n```bash\nif [ $# -ne 1 ]\nthen\n  echo “Usage: $0 number”\n\
    \  exit\nelse\n  fact=1\n  count=1\n  while [ $count -le $1 ]\n  do\n    fact=`expr\
    \ $fact * $count`\n    count=`expr $count + 1`\n  done\n  echo “Factorial is $fact”\n\
    fi\n```\n\n## Shell Script to prefix each line of a file by line number\n\n```bash\n\
    if [ $# -ne 1 ]\nthen\n  echo “Usage: $0 filename”\n  exit\nelse\n  nl $1 > tmp\n\
    \  mv tmp $1\nfi\n```\n\n## Shell Script to convert lower case characters to upper\
    \ case\n\n```bash\nif [ $# -ne 1 ]\nthen\n  echo “Usage: $0 filename”\n  exit\n\
    else\n  tr \"[a-z]\" \"[A-Z]\" < $1 > tmp\n  mv tmp $1\nfi\n```\n\n## Shell Script\
    \ to copy date without time in a file\n\n```bash\ndate|cut -d\" \" -f1-3 >file\n\
    cat file\n```\n\n## Shell Script to check for regular file or directory\n\n```bash\n\
    if [ $# -ne 1 ]\nthen\n  echo “Usage: $0 filename”\n  exit\nfi\nif [ -d $1 ]\n\
    then\n  echo It is a Directory\nelse\n  if [ -f $1 ]\n  then\n    echo It is a\
    \ Regular File\n  else\n    echo It is neither a directory nor regular file\n\
    \  fi\nfi\n```\n\n## Shell Script to display logged in users after 15 seconds\n\
    \n```bash\nwhile :\ndo\n  who\n  sleep 15\ndone\n```\n\n## Shell Script to count\
    \ down from a number to 0\n\n```bash\nif [ $# -eq 0 ]\nthen\n  start=10\nelse\n\
    \  start=$1\nfi\nwhile [ $start -ge 0 ]\ndo\n  echo $start\n  start=`expr $start\
    \ - 1`\ndone\n```\n\n## Shell Script to change all uppercase filenames to lowercase\n\
    \n```bash\nfor oldfile in *\ndo\n  if [ \"$oldfile\" != \"$newfile\" ]\n  then\n\
    \    mv \"$oldfile\" \"$newfile\"\n  fi\ndone\n```\n\n## Shell Script to change\
    \ all .txt extension to .doc\n\n```bash\nfor file in *.txt\ndo\n  lname=`basename\
    \ $file .txt`\n  mv $file ${lname}.doc`\ndone\n```\n\n## Shell Script to add a\
    \ message (c) MCA 2006-2007 at end of all text files in current directory\n\n\
    ```bash\nfor file in *.txt\ndo\n  echo “(C) MCA 2006-2007” >>$file\ndone\n```\n\
    \n## Shell Script to check capital of India\n\n```bash\ncapital=Delhi\nans=empty\n\
    while [ $ans != $capital ]\ndo\n  echo “Enter capital of India? ”\n  read ans\n\
    done\n```\n\n## Shell Script to check for a logged in user\n\n```bash\nif [ $#\
    \ -ne 1 ]\nthen\n  echo “Usage: $0 login_name”\n  exit\nfi\nwho|grep $1 >/dev/null\n\
    if [ $? -eq 0 ]\nthen\n  echo $1 is currently logged in\nelse\n  echo $1 is currently\
    \ not logged in\nfi\n```\n\n## Shell Script to greet a user according to time\n\
    \n```bash\nh=$(date|cut -c 12-13)\nif [ $h -ge 4 -a $h -lt 12 ]\nthen\n  echo\
    \ Good Morning\nelse\n  if [ $h -ge 12 -a $h -lt 17 ]\n  then\n    echo Good Afternoon\n\
    \  else\n    echo good Evening\n  fi\nfi\n```\n\n## Shell Script to delete files\
    \ passed as command line arguments\n\n```bash\nif [ $# -lt 1 ]\nthen\n  echo “Usage:\
    \ $0 file1 file2…”\n  exit\nfi\nmax=$#\nn=1\nwhile [ $n -le $max ]\ndo\n  rm -r\
    \ $1\n  shift\n  n=`expr $n + 1`\ndone\n```\n\n## Shell Script to count the number\
    \ of lines which contain a word\n\n```bash\nif [ $# -ne 2 ]\nthen\n  echo “Usage:\
    \ $0 word filename”\n  exit\nfi\ngrep -c $1 $2\n```\n\n# Index\n\n### Symbols\n\
    - `/etc/group` file: about 51, attributes 52\n- `/etc/passwd` file: about 50,\
    \ attributes 51\n- `/etc/shadow` file: about 52, 53, attributes 52\n- `_exit()`\
    \ function: 58\n\n### A\n- abnormal process termination: about 58\n- conditions:\
    \ 58\n"
