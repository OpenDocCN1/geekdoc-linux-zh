    # [/etc/shadow file](#toc.xhtml_s58a)


    The **`/etc/shadow`** file stores the actual password in encrypted format for
    the user’s account with additional properties related to the user password. It
    contains one entry per line for each user listed in **`/etc/passwd`** file, generally.
    Each entry has the following format:


    `smithj:Ep6mckrOLChF.:10063:0:99999:7:::`


    Each field is separated by a colon (:) symbol:


    | **User name** | **Specifies user’s login name.** |


    | Password | Specifies encrypted password. The password must be minimum 6–8 characters
    long, including special characters/digits. |


    | Last password change (**`lastchanged`**): | Days since Jan 1, 1970, the password
    was last changed. |


    | Minimum | The minimum number of days required between password changes, that
    is, the number of days left before the user is allowed to change his/her password.
    |


    | Maximum | The maximum number of days the password is valid (after that user
    is forced to change his/her password). |


    | Warn | The number of days before the password is to expire the user is warned
    that his/her password must be changed. |


    | Inactive | The number of days after the password expires, that account is disabled.
    |


    | Expire | Days since Jan 1, 1970, that account is disabled, that is, an absolute
    date specifying when the login may no longer be used. |


    **Table 2.5:** Fields in shadow record with description


    The last six fields provide password aging and account lockout features (you need
    to use the change command to set up password aging). According to the man page
    of shadow—the password field must be filled. The encrypted password consists of
    13–24 characters from the 64 character alphabet a through z, A through Z, 0 through
    9, \. and /. Optionally it can start with a $ character. This means the encrypted
    password was generated using another (not DES) algorithm. For example, if it starts
    with $1$ it means the MD5-based algorithm was used.


    # [Conclusion](#toc.xhtml_s59a)


    UNIX provides a number of methods to perform input/output operations. The two
    most dominating methods are I/O system calls and library functions. The library
    function, when executed at the Kernel level, they are also converted into a corresponding
    system call. UNIX Kernel maintains various data structures to manage all open
    files. How to access the file by user’s process is controlled by file access permission
    provided to the user by the administrator. To manage file access, users are divided
    into three categories, namely, owner, group members, and others. The owner can
    provide access to all other types of users. All group members share the same access
    permissions. UNIX also provides library functions to buffer data for both reading
    and writing. I/O buffers are maintained to avoid frequent access to external devices
    and to speed up input and output operation. After completing the two major components,
    process and file-management, in [Chapters 1](#c01.xhtml) and [2](#c02.xhtml),
    respectively, the upcoming chapter will discuss the UNIX shell environment and
    provide the user interface for functioning with processes and files.


