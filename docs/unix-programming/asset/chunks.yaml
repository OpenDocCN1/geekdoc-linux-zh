    \ shell script to find the sum of digits of a number. [Command line argument:\
    \ `number` ]\n6. Write a shell script to find the factorial of a number.\n7. Write\
    \ a shell script to prefix each line of a file by line number. [Command line argument:\
    \ `filename` ]\n8. Write a shell script to convert all lower case characters in\
    \ a file to upper case. [Command line argument: `filename` ]\n9. Write a shell\
