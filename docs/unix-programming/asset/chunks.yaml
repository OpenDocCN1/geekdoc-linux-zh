    \ queue destroyed”);\n  exit(1);\n}\nreturn 0;\n}\n```\n\n# Receiving a message\
    \ from the queue\n\nThe `msgrcv()` function is used to read a message from the\
    \ message queue.\n\n## Prototype\n\n```c\nint msgrcv(int msqid, void *msgp, size_t\
    \ msgsz, long msgtyp, int msgflg);\n```\n\nThe `msqid` is the message identifier,\
    \ `msgp` is the pointer to the buffer to store the read message, `msgsz` is the\
    \ length of the data part of the buffer storing the message, and messages are\
    \ received from the queue depending on the `msgtyp` parameter. The following table\
    \ shows which message will be read based on the value of `msgtyp` parameter:\n\
    \n| msgtyp | Effect on msgrcv() |\n| :--- | :--- |\n| Zero | Retrieves the next\
    \ message on the queue, regardless of its `mtype`. |\n| Positive | Retrieves the\
    \ next message with `mtype` equal to the specified `msgtyp`. |\n| Negative | Retrieves\
    \ the first message on the queue whose `mtype` field is less than or equal to\
    \ the absolute value of the `msgtyp` argument. |\n\n**Table 4.1:** Working of\
    \ msgrcv()\n\nIf the message of the specified type is not there in the message\
    \ queue, then the action will be decided based on the value of `msgflg` parameter.\n\
    \nIf `msgflg` is set to `IPC_NOWAIT`, the function returns immediately with the\
    \ error `ENOMSG`, and the caller process is blocked until:\n\n* The message queue\
    \ is destroyed.\n* A message of specified type ids arrived at the message queue.\n\
    * The calling thread is interrupted; in this case, the function returns with the\
    \ error `EINTR`.\n\nIf `msgflg` is set with an additional bit `MSG_NOERROR`, the\
    \ function does not return an error if the length of the actual message is greater\
    \ than the `msgsz` parameter; instead, it truncates an extra portion of the message.\n\
    \n## Example\n\nIn the given example, the receiver process connects to the message\
    \ queue; if the message queue does not exist, an error will be generated, and\
    \ the process terminates abnormally. Otherwise, all messages are read and printed\
    \ to the screen till the end of the message queue.\n\n```c\n#include <stdlib.h>\n\
    #include <errno.h>\n#include <sys/types.h>\n#include <sys/ipc.h>\n#include <sys/msg.h>\n\
    \nstruct msgbuf {\n  long mtype;\n  char mtext[200];\n};\n\nint main(void)\n{\n\
    \  struct msgbuf buf;\n  int msqid;\n  key_t key = 41;\n  if ((msqid = msgget(key,\
    \ 0644)) == -1) { /* connect to the queue */\n    perror(“message queue does not\
    \ exist “);\n    exit(1);\n  }\n  printf(“Receiving messages from message queue\
    \ \\n”);\n  for(;;)\n  {            \n    if (msgrcv(msqid, (struct msgbuf *)&buf,\
    \ sizeof(buf), 0, 0) == -1) {\n      perror(“msgrcv”);\n      exit(1);\n    }\n\
    \    printf(“%s”\\n”, buf.mtext);\n  }\n  return 0;\n}\n```\n\n# Destroying a\
    \ message queue\n\nThe message queue is destroyed using `msgctl()` function.\n\
    \n## Prototype\n\n```c\nint msgctl(int cmd, struct msqid, int msqid_ds *buf);\n\
