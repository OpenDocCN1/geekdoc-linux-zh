  trans: "\n\n*   `GETVAL`: 返回集合中单个信号量的值。\n\n# 信号量操作 semop()\n\n`semop()` 系统调用用于对信号量集原子地执行一组用户定义的信号量操作。\n\
    \n### 原型\n\n```\nint semop(int semid, struct sembuf *sops, unsigned int nsops);\n\
    ```\n\n参数 `semid` 是通过调用 `semget()` 获取的标识信号量集的数字，下一个参数 `sops` 是指向用户定义的 `sembuf`\
    \ 结构数组的指针，该数组填充了信号量命令；第三个参数 `nsops` 指定信号量操作结构的数量。\n\n```c\nstruct sembuf {\n \
    \   ushort sem_num;\n    short sem_op;\n    short sem_flg;\n};\n```\n\n`sem_num`\
    \ 是集合中要操作的信号量的编号，`sem_op` 定义了对信号量进行的操作。其含义取决于 `sem_op` 是正数、负数还是零。让我们来看一下：\n\n\
    | sem_op | 发生了什么 |\n| :--- | :--- |\n| 正数 | `sem_op` 的值加到信号量的值上。这是程序使用信号量标记资源已分配的方式。\
    \ |\n| 负数 | 如果 `sem_op` 的绝对值大于信号量的值，调用进程将阻塞，直到信号量的值达到 `sem_op` 的绝对值。最后，从信号量的值中减去\
    \ `sem_op` 的绝对值。这是进程释放受信号量保护资源的方式。 |\n| 零 | 此进程将等待相关的信号量达到 0。 |\n\n**表 4.2：**\
    \ `sem_op` 变量的值\n\n`sem_flg` 设置为 `IPC_NOWAIT` 和 `SEM_UNDO`。如果操作断言了 `SEM_UNDO`，它将在进程退出时被撤销。\n\
    \n# 销毁信号量](#toc.xhtml_s118a)\n\n使用 `semctl()` 系统调用删除信号量集。`cmd` 参数设置为 `IPC_RMID`，这告诉\
    \ `semctl()` 移除该信号量集。参数 `semnum` 和 `arg` 在 `IPC_RMID` 语境下没有意义，可以设置为任何值。\n\n###\
    \ 示例：\n\n假设我们集合中 ID 为 `semset_id` 的信号量初始值为 `1`：\n\n```c\n/* 此函数根据给定路径更新文件内容。 */\n\
    void update_file(char* file_path, int number)\n{\n    /* 信号量操作结构。 */\n    struct\
    \ sembuf sem_op;\n    FILE* file;\n    /* 等待信号量，除非它的值非负。 */\n    sem_op.sem_num\
    \ = 0;\n    sem_op.sem_op = -1;   /* <-- 注释 1 */\n    sem_op.sem_flg = 0;\n  \
    \  semop(sem_set_id, &sem_op, 1);\n    /* 注释 2 */\n    /* 我们“锁定”了信号量，确保对文件的排他访问。\
    \  \n\n/* 以某种方式操作文件。例如，向其中写入数字。 */\n    file = fopen(file_path, “w”);\n    if\
    \ (file) {\n        fprintf(file, “%d\\n”, number);\n        fclose(file);\n \
    \   }\n    /* 最后，信号信号量 - 将其值加一。 */\n    sem_op.sem_num = 0;\n    sem_op.sem_op\
    \ = 1;   /* <-- 注释 3 */\n    sem_op.sem_flg = 0;\n    semop(sem_set_id, &sem_op,\
    \ 1);\n}\n```\n\n这段代码需要一些解释，特别是关于 `semop()`调用的语义，如下：\n\n* **注释 1：** 在访问文件之前，我们使用\
    \ `semop()` 等待信号量。在 `sem_op.sem_op` 中提供 `-1` 意味着：如果信号量的值大于或等于 `1`，则将该值减 1 并返回给调用者。否则（值小于\
    \ 1），阻塞调用进程，直到信号量的值变为 `1`，此时我们返回给调用者。\n\n* **注释 2：** `semop()` 的语义确保当我们从此函数返回时，信号量的值为\
    \ 0。为什么？它不可能更小，否则 `semop()` 将不会返回。由于我们之后信号信号量的方式，它也不更大。\n\n* **注释 3：** 在我们完成文件操作后，我们将信号量的值加\
    \ 1，可能会唤醒正在等待信号量的进程。如果有多个进程在等待信号量，则第一个被阻塞在上面的进程会被唤醒。\n\n# 结论](#toc.xhtml_s119a)\n\
    \n进程间通信是允许两个进程进行通信的重要机制。IPC 可用于在协作进程之间共享数据，或者通过这一个进程控制其他进程的活动；IPC 用于单个进程内线程之间、同一系统中的两个进程之间，或分布式环境中的进程之间的通信。我们讨论了\
    \ IPC 的概念，还讨论了用于进程同步的信号量概念，以避免共享资源时出现死锁情况。下一章将讨论基于套接字的客户端服务器另一种进程间通信方法。\n\n# 习题](#toc.xhtml_s120a)\n\
    \n1. 信号量如何为多个进程访问共享对象？\n2. 定义用于实现信号量的函数调用。\n3. 编写一个程序创建一个消息队列并向其发送一些数据。\n4. 编写一个程序在接收可用数据后销毁消息队列。\n\
    5. 共享内存段是一个可以附加到多个进程的内存区域。编写一个来回传递数据的客户端和服务器。\n6. 编写一个程序显示客户端和服务器程序之间的竞态条件。\n\
    7. 如果 open 的参数是一个不存在的命令会发生什么？\n8. 编写一个程序通过管道在父子进程之间发送和接收数据。\n\n"
