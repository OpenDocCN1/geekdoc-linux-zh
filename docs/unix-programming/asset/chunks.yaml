  trans: "\n\n`path` 或 `file` 包含被调用的文件名，`arg` 是指向作为参数传递给被调用文件的字符串的指针。按照惯例，第一个参数应该指向与正在执行的文件关联的文件名。参数列表必须以\
    \ NULL 指针结束。\n\n函数 `execlp()` 和 `execvp()` 如果发现指定的文件名不包含斜杠（`/`）字符，则在搜索时复制 shell\
    \ 搜索可执行文件的操作。搜索路径是环境变量中通过 `PATH` 变量指定的路径。如果未指定此变量，则使用默认路径 `:/bin:/usr/bin`。此外，某些错误会被特殊处理。\n\
    \n新进程会从旧进程继承以下属性，如进程 ID 和父进程 ID、真实用户 ID 和真实组 ID、会话 ID、当前工作目录、根目录、文件模式创建标记等。\n\n\
    被调用进程的有效 ID 可能会根据 set-user-ID 和 set-group-Id 位标志的状态而改变。如果新程序的 set-user-ID 位被设置，则有效用户-ID\
    \ 将变为程序的所有者 ID。\n\n# 访问用户信息\n\n有很多函数和系统调用可以让我们访问有关 UNIX 用户的信息。\n\n## 用户详情\n\n\
    `pwd.h` 头文件中的 `passwd` 结构包含了类似于 `/etc/passwd` 目录的用户信息：\n\n```c\n#include <pwd.h>\n\
    struct passwd {\n  char *pw_name;  /* 用户名 */\n  char *pw_passwd;  /* 密码 */\n \
    \ uid_t pw_uid;  /* 用户 id*/\n  gid_t pw_gid;  /* 组 id */\n  time_t pw_change;\
    \ /* 有效性和\n  char *pw_class;  password 类 */\n  char *pw_gecos;  /* 用户全名 */\n \
    \ char *pw_dir;  /* 登录目录 */\n  char *pw_shell;  /* 用户登录 shell */\n  time_t pw_expire;\
    \ /* 密码过期日期*/\n};\n```\n\n`passwd` 结构由 `getpwnam()` 和 `getpwuid()` 函数返回。它提供了有关用户账户的信息。`getpwnam()`\
    \ 和 `getpwuid()` 函数在用户数据库中查找匹配名称或 UID 的条目。\n\n`getuid()` 获取登录用户的用户 ID。\n\n打印用户详细信息的程序示例如下：\n\
    \n```c\n#include <pwd.h>\nmain()\n{\n  struct passwd *pass;\n  int uid;\n  uid\
    \ = getuid();\n  pass = getpwuid(uid);\n  printf(\"Login name: %s\\n\", pass->pw_name);\n\
    \  printf(\"Encrypted Password: %s\\n\", pass->pw_password);\n  printf(\"User\
    \ ID: %d\\n\", pass->pw_uid);\n  printf(\"Group ID: %d\\n\", pass->pw_gid);\n\
    \  printf(\" Password Age: %s\\n\", pass->pw_age);\n  printf(\"Comment: %s\\n\"\
    , pass->pw_comment);\n  printf(\"Login Dir  %s\\n\", pass->pw_pw_dir);\n  printf(\"\
    Shell: %s\\n\", pass->pw_shell);\n}\n```\n\n## 组详情\n\n`grp.h` 头文件中的组结构包含了如下的组信息：\n\
    \n`/etc/grpup`:\n\n```c\n#include <grp.h>\nstruct group {\n  char *gr_name;  /*\
    \ 组名 */\n  char *gr_passwd; /* 组密码 */\n  gid_t gr_gid;  /* 组 id*/\n  char **gr_mem;\
    \ /* 指向组成员名的指针 */\n};\n```\n\n`getgid()` 获取用户的组 ID，而 `getgrgid()` 填充组结构。\n\n以下是打印组信息的示例：\n\
    \n```c\n#include <grp.h>\nmain()\n{\n  int I;\n  struct group *grp;\n  grp = getgrgid(getgid());\n\
    \  printf(\"Group Name %s\\n\", grp->gr_name);\n  printf(\"Group Password %s\\\
    n\", grp->gr_passwd);\n  printf(\"Group ID %s\\n\", grp->gr_gid);\n  printf(\"\
    Group Members :\");\n  for (I = 0; grp->gr_mem[I];I++)\n    printf(\"\\n: %s\"\
    , grp->gr_mem[I]);\n}\n```\n\n## 显示所有登录用户的信息\n\n`utmp.h` 头文件中的 `utmp` 结构包含了如 `/etc/utmp`\
    \ 所示登录用户信息。我们可以通过从 `/etc/utmp` 读取登录用户信息来填充此结构：\n\n```c\nstruct utmp {\n  char\
    \ ut_user[8]; /* 用户登录名 */\n  char ut_id[4]; /* 进程 id */\n  char ut_line[12]; /*\
    \ 设备名称 (console, lnxx) */\n  short ut_pid; /* 兼容性进程 id 的缩写 */\n  short ut_type;\
    \ /* 条目类型 */\n  struct exit_status ut_exit; /* 进程退出状态 */\n  time_t ut_time; /*\
    \ 条目创建时间 */\n};\n```\n\n以下是一个显示登录用户信息的程序：\n\n```c\n#include <sys/types.h>\n#include\
    \ <stdio.h>\n#include <utmp.h>\n#include <pwd.h>\n#include <sys/types.h>\n#include\
    \ <stdio.h>\n#include <utmp.h>\n#include <pwd.h>\n#define UTMP \"/etc/utmp\"\n\
    #define NAMELEN 8\nmain() {\n  FILE *fp;\n  struct utmp u;\n  struct passwd *p;\n\
    \  char temp[NAMELEN];\n  fp = fopen(UTMP, \"r\");\n  if (fp) {\n    while (fread(&u,\
    \ sizeof(struct utmp), 1, fp)) {\n      strncpy(temp, u.ut_user, NAMELEN);\n \
    \     temp[NAMELEN-1] = '\\0';\n      p = getpwnam(temp);\n      if (p) {\n  \
    \      printf(\"User: %s, Line: %s, ID: %s, Type: %d\\n\", u.ut_user, u.ut_line,\
    \ u.ut_id, u.ut_type);\n      }\n    }\n    fclose(fp);\n  }\n  exit(0);\n}\n\
    ```\n*(注：由于原文提供的该部分代码块存在逻辑混乱和重复错误，翻译时根据上下文意图进行了结构对齐，以符合文档工程师的逻辑)*\n\n# 进程组\n\n\
    进程组由一个或多个进程组成，进程组 ID 是进程组 ID。进程可以使用 `setpgid()` 函数设置进程组。\n\n```c\n\n\nint setpgid(pid_t\
    \ pid, pid_t pgid);\n```\n\n# 会话\n\n会话是一个或多个进程组的集合。进程可以使用 `setsid()` 函数建立新会话。\n\
    \n```c\npid_t setsid(void);\n```\n\n如果进程已经是会话组组，则返回错误。如果不是，它将成为会话组组，会话 ID 被设置为进程\
    \ ID。让我们来看一个示例：\n\n```c\n#include <sys/types.h>\n#include <unistd.h>\n#include\
    \ <stdio.h>\nvoid main() {\n  printf(\"进程组 ID 为 %d\\n\", (int) getgrp());\n  setsid();\n\
    \  printf(\"新的进程组 ID 为 %d\\n\", (int) getgrp());\n}\n```\n\n# 信号\n\n信号是异步软件中断，表示发生了事件。信号通过其名称识别并在\
    \ `<signal.h>` 中指定。信号由以下发送：\n\n* 一个进程到另一个进程（或自身）\n* 内核发送给进程\n\n表 3.1 显示了 BSD 系统可用的信号：\n\
    \n| 信号名称 | 信号值 | 信号描述 |\n| :--- | :--- | :--- |\n| SIGHUP | 1 | 终端挂起 |\n| SIGINT\
    \ | 2 | 中断程序 |\n| SIGQUIT | 3 | 退出程序 |\n| SIGILL | 4 | 非法指令 |\n| SIGTRAP | 5 |\
    \ 跟踪异常 |\n| SIGABRT | 6 | 中止 |\n| SIGEMT | 7 | 执行模拟指令 |\n| SIGFPE | 8 | 浮点异常 |\n\
    | SIGKILL | 9 | 杀死程序 |\n| SIGBUS | 10 | 总线错误 |\n| SIGSEGV | 11 | 段错误 |\n| SIGSYS\
    \ | 12 | 系统调用参数无效 |\n| SIGPIPE | 13 | 向无读者的管道中写入 |\n| SIGALRM | 14 | 实时定时器超时 |\n\
    | SIGTERM | 15 | 软件终止信号 |\n| SIGURG | 16 | I/O 通道紧急状态 |\n\n"
- fmt: "\n| SIGSTOP | 17 | Stop signal, not from terminal |\n| SIGTSTP | 18 | Stop\
    \ signal from terminal |\n| SIGCONT | 19 | A stopped process is being continued\
    \ |\n| SIGCHLD | 20 | Notification to parent on child stop or exit |\n| SIGTTIN\
    \ | 21 | Read on a terminal by a background process |\n| SIGTTOU | 22 | Write\
    \ to terminal by a background process |\n| SIGIO | 23 | I/O possible on a descriptor\
    \ |\n| SIGXCPU | 24 | CPU time limit exceeded |\n| SIGXFSZ | 25 | File-size limit\
    \ exceeded |\n| SIGVTALRM | 26 | Virtual timer expired |\n| SIGPROF | 27 | Profiling\
    \ timer expired |\n| SIGWINCH | 28 | Window size changed |\n| SIGINFO | 29 | Information\
    \ request |\n| SIGUSR1 | 30 | User-defined Signal 1 |\n| SIGUSR2 | 31 | User-defined\
    \ Signal 2 |\n| SIGTHR | 32 | Thread interrupt |\n\n**Table 3.1:** BSD signals\n\
    \n# Sending a signal to processes\n\nThe `kill` system call is used to send a\
    \ signal from one process to another process or to itself. To send a signal, the\
    \ sending process and receiving process must have the same effective user ID,\
    \ or sending process must be a superuser.\n\n### Prototype\n\n```c\nint kill(int\
    \ pid, int sig);\n```\n\nIf `pid` argument is `0`, signal is sent to all processes\
    \ in the group. If `pid` argument is `–1` and the user is not a superuser, the\
    \ signal is sent to all processes whose real user ID is the same as the effective\
    \ user ID of the sending process. If `pid` argument is `–1` and the user is superuser,\
    \ the signal is sent to all processes except system processes. If `pid` argument\
    \ is negative but not `1`, then the signal is sent to all processes whose process\
    \ group ID equals the absolute value of `pid`. If `pid` argument is `0`, error\
    \ checking is done, but no signal is sent.\n\nAnother way of sending signals to\
    \ processes is to use a certain keypress that is interpreted as a request to send\
    \ a signal to the running process. A few examples are as follows:\n\n* **Ctrl\
    \ + C:** Pressing `C` on the keyboard with the `Ctrl` key causes the system to\
    \ send an `INT` signal (`SIGINT`) to the running process. By default, this signal\
    \ causes the process to terminate immediately.\n* **Ctrl + Z:** Pressing `Z` with\
    \ `Ctrl` key causes the system to send a `TSTP` signal (`SIGTSTP`) to the running\
    \ process. By default, this signal causes the process to suspend execution.\n\
    * **Ctrl + \\:** Pressing `*` with `Ctrl` key causes the system to send an `ABRT`\
    \ signal (`SIGABRT`) to the running process. By default, this signal causes the\
    \ process to terminate immediately. Note that this redundancy (that is, `Ctrl\
    \ +` doing the same as `Ctrl + C`) gives us some better flexibility. We will explain\
    \ that later on.\n\nThe `kill` command is also used for sending signals to processes.\
    \ The `kill` command accepts two parameters: a signal name (or number) and a process\
    \ ID.\n\n```bash\nkill -<signal> <PID>\n```\n\nFor example, in order to send the\
    \ `INT` signal to process with PID 5342, type:\n\n```bash\nkill -INT 5342\n```\n\
    \nThis has the same effect as pressing `Ctrl-C` in the shell that runs that process.\
    \ If no signal name or number is specified, the default is to send a `TERM` signal\
    \ to the process, which normally causes its termination.\n\nSome hardware conditions\
    \ also cause signals. For example, floating-point error, referencing an address\
    \ outside a process, the specific hardware condition, and corresponding signals\
    \ that they generate are different in different UNIX implementations.\n\n# Signal\
    \ handling\n\nThe Kernel has a default action corresponding to each signal. The\
    \ process can handle most of the signals in a customized way by writing code in\
    \ the program. This custom piece of code is called signal handlers.\n\nTwo signals\
    \ are unable to be redefined by a signal handler. `SIGKILL` always stops a process,\
    \ and `SIGSTOP` always moves a process from the foreground to the background.\
    \ These two signals cannot be caught by a signal handler.\n\nThe `signal()` system\
    \ call is used to set a signal handler for a single signal type. `signal()` accepts\
    \ a signal number and a pointer to a signal handler function and sets that handler\
    \ to accept the given signal.\n\n### Prototype\n\n```c\nvoid (*signal(int sig,\
    \ void (*func)(int)))(int);\n```\n\nThe first argument `sig` is the name of the\
    \ signal. The value of the second argument is either `SIG_DFL` or `SIG_ING` or\
    \ the address of the signal handler. `SIG_DFL` is used to specify the default\
    \ handling of the signal, and `SIG_ING` is used to ignore the signal.\n\n**Example:**\
    \ In the given example, after printing the message `press del key`, an endless\
    \ for loop will be executed, but as soon as `del` key is pressed, an interrupt\
    \ signal `SIGINT` will be sent to the handler function `sig_handle`. The function\
    \ will print the message `DEL key is pressed`, and the program will be terminated.\n\
    \n```c\n#include <signal.h>\n\nvoid sig_handle();\n\nvoid main()\n{\n    printf(\"\
    press del key\\n\");\n    signal(SIGINT, sig_handle);\n    for(;;);\n}\n\nvoid\
    \ sig_handle()\n{\n    printf(\" DEL key is pressed\\n\");\n}\n```\n\n*Table 3.2*\
    \ shows all possible values of signals for the first parameter of the `signal()`\
    \ system call. These signals are handled either by the signal handler mentioned\
    \ as the second parameter of the `signal()` system call or by the system if the\
    \ handler is not mentioned.\n\n| Signal | Description |\n| :--- | :--- |\n| SIGALRM\
    \ | A process can set an alarm clock by calling the alarm call. `Unsigned int\
    \ alarm (unsigned int sec)`. The `sec` argument specifies the number of seconds\
    \ to elapse before the Kernel is to send the process a `SIGALRM` signal. If the\
    \ argument is zero, any previous alarm clock for the process is canceled. The\
    \ sleep function usually sets a `SIGALRM` signal, which it catches. |\n| SIGINT\
    \ | This interrupt signal is usually generated when the interrupt key is pressed\
    \ on the terminal. |\n| SIGILL | This signal is generated by an implementation-dependent\
    \ hardware condition. |\n| SIGUSR1 | There are two user-defined signals that can\
    \ be used to communicate between processes. |\n| SIGUSR2 | Same as `SIGUSR1`.\
    \ |\n| SIGXFSI | This signal is generated if the process exceeds its file limit.\
    \ |\n| SIGXCPU | If the process exceeds its soft CPU limit, this signal is generated.\
    \ |\n| SIGTERM | This is the termination signal sent by the `kill` command. |\n\
    | SIGPWR | This signal is generated at the time of power failure. The system continues\
    \ running if battery power is available. |\n| SIGPIPE | This signal is generated\
    \ if the writer process continues writing on the pipeline and the reader process\
    \ is terminated. |\n| SIGQUIT | This signal is generated by the terminal driver\
    \ when `Ctrl \\` key is pressed. This signal is sent to all foreground processes.\
    \ |\n| SIGTSTP | The terminal driver generates this interactive stop signal when\
    \ `Ctrl+Z` is pressed. This signal is sent to all foreground processes. |\n| SIGSTOP\
    \ | The terminal driver generates this signal to stop all foreground processes.\
    \ This signal cannot be caught and ignored. |\n| SIGORG | This signal specifies\
    \ the process that an urgent condition has occurred. |\n| SIGCHLD | This signal\
    \ is sent to the parent process when the process stops. Usually, this signal is\
    \ ignored, so the parent must catch the signal if it wants to be notified whenever\
    \ a child’s status changes. |\n| SIGIO | This signal occurred at the time of asynchronous\
    \ IO. |\n| SIGSYS | This signal indicates an invalid system call. |\n\n**Table\
