    `}`


    `if ((shm = shmat(shmid, NULL, 0)) == (char *) -1) {`


    `perror(“shmat”);`


    `exit(1);`


    `}`


    `/* Now read what the server put in the memory     */`


    `for (s = shm; *s != NULL; s++)`


    `putchar(*s);`


    `putchar(‘\n’);`


    `/*After reading characters from the shared memory. put * at the first location    
    */`


    `*shm = ‘*’;`


    `exit(0);`


    `}`


    # [Process synchronization](#toc.xhtml_s111a)


    Two concurrent processes must be synchronized while sharing resources with each
    other to avoid system deadlock. The UNIX uses semaphores to control access to
    the shared resource between two processes.


    # [Semaphores](#toc.xhtml_s112a)


    A semaphore is not exactly a form of IPC; it is a variable to control access to
    the shared resource among multiple processes.


    A semaphore is a resource that contains an integer value and allows processes
    to synchronize by testing and setting this value in a single atomic operation.
    This means that the process that tests the value of a semaphore and sets it to
    a different value (based on the test) is guaranteed no other process will interfere
    with the operation in the middle.


    A process needs to perform testing before getting access to the shared resource.
    The access to the shared resource is controlled by a semaphore.


    The following steps are performed to check the value of the semaphore before using
    the resource as follows:


    1.  Process tests the semaphore that controls access to the resource.


    2.  If the value of the semaphore is positive, then only the process can use the
    resource. As soon as the process gets access to the resource, it decrements the
    value of the semaphore by 1 to indicate that it has used one unit of resource.


    3.  If the value of the semaphore is 0, the process goes into a sleep state; when
    the process wakes up, it again checks the value of the semaphore.


    4.  After finishing the use of the resource, the value of the semaphore is incremented
    by 1 to give access to any other process that is in the sleep state.


    ![](images/Figure-4.6.jpg)


    **Figure 4.6:** Semaphore


    # [Semaphore operations](#toc.xhtml_s113a)


    Two types of operations are carried on a semaphore: wait and signal. The wait
    operation first checks if the semaphore’s value equals some number. If it does,
    it decreases its value and returns. If it does not, the operation blocks the calling
    process until the semaphore’s value reaches the desired value.


    A signal operation increments the value of the semaphore, possibly awakening one
    or more processes that are waiting for the semaphore.


    # [Semaphore set](#toc.xhtml_s114a)


    A semaphore set is a structure that stores a group of semaphores together and
    possibly allows the process to commit a transaction on part or all of the semaphores
    in the set together. A transaction means that we are guaranteed that either all
    operations are done successfully or none is done at all.


    Kernel maintains a structure for every semaphore set:


    `struct semid_ds {`


    `struct ipc_perm sem_perm;       /* permissions .. see ipc.h */`


    `time_t          sem_otime;      /* last semop time */`


    `time_t          sem_ctime;      /* last change time */`


    `struct sem      *sem_base;      /* ptr to first semaphore in array */`


    `struct wait_queue *eventn;`


    `struct wait_queue *eventz;`


    `struct sem_undo  *undo;        /* undo requests on this array */`


    `ushort          sem_nsems;      /* no. of semaphores in array */`


    `};`


    Let us discuss them in detail:


    *   **`ipc_perm`**: **`ipc_perm`** structure contains access permissions for a
    particular semaphore.


    *   **`sem_otime`**: Time of the last **`semop()`** operation (more on this in
    a moment).


    *   **`sem_ctime`**: Time of the last change to this structure (mode change).


    *   **`sem`**: The **`sem`** structure is an internal structure used by the Kernel
    to maintain the set of values for the semaphore.


    *   **`sem_undo`**: Number of undo requests in this array.


    *   **`sem_nsems`**: Number of semaphores in the semaphore set.


    *   **`wait_queue`**: A **`wait_queue`** is a circular list of pointers to task
    structures.


    # [Creating semaphore](#toc.xhtml_s115a)


    A semaphore is created, or an existing semaphore can be accessed using **`semget()`**
    system call, which returns the semaphore ID.


    **Prototype**


    `int semget(key_t key, int nsems, int semflg);`


    Key is a unique identifier that is used by different processes to identify this
    semaphore set. The next argument, **`nsems`**, is the number of semaphores that
    should be created in the new semaphore set; the **`semflg`** argument specifies
    what permissions should be on the new semaphore set.


    If the value of **`senflg`** is **`IPC_CREAT`** alone, it returns an identifier
    for a newly created semaphore set or an identifier for an already existing semaphore
    set with which the key argument matches. If **`IPC_CREAT`** is used along with
    **`IPC_EXCL`**, then it creates the new set or returns –1 if the semaphore set
    already exists.


    # [Controlling semaphore](#toc.xhtml_s116a)


    After the semaphore set is created, the whole set or a particular semaphore is
    controlled using **`semctl()`** system call.


    **Prototype**


    `int semctl ( int semid, int semnum, int cmd, union semun arg );`


    The **`semid`** is the key identifier of the semaphore set, and the **`semnum`**
    argument is an index of semaphore in the semaphore set, which is targeted for
    control operation. The **`cmd`** argument controls the semaphore operation, and
    it has the following values:


    *   **`IPC_STAT`**: Retrieves the **`semid_ds`** structure for a set and stores
    it in the address of the **`buf`** argument in the **`semun`** union.


    *   **`IPC_SET`**: Sets the value of the **`ipc_perm`** member of the **`semid_ds`**
    structure for a set. Takes the values from the **`buf`** argument of the **`semun`**
    union.


    *   **`IPC_RMID`**: Destroys the set from the Kernel.


    *   **`GETALL`**: Gives values of all semaphores in a set. The integer values
    are stored in an array of unsigned short integers pointed to by the array member
    of the union.


    *   **`GETNCNT`**: Returns the number of processes currently waiting for resources.


    *   **`GETPID`**: Returns the PID of the process which performed the last **`semop`**
    call.'
