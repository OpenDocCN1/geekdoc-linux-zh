  trans: "\n\n在给出的示例中，创建了一个名为 `fifo` 的 FIFO，分别用于读取和写入。如果 `fifo` 已经存在，它将返回错误，并打印错误消息\
    \ `FIFO already exists`。服务器进程等待从客户端读取请求。如果客户端在在此期间终止，将打印错误消息 `read failed`；否则，屏幕上将打印来自\
    \ `fifo` 的消息。\n\n```c\n#include <fcntl.h>\n#include <stdio.h>\n#include <errno.h>\n\
    #define MSGSIZ  100\nchar *fifo = “fifo”;\nint main(int argc, char **argv){\n\
    \  int fd;\n  char msg_buf[MSGSIZ+1];\n  if (mkfifo(fifo, 0666) == -1){\n    if\
    \ (errno != EEXIST)\n    printf(“\\n FIFO already exists \\n”);\n    }\n    if\
    \ ((fd = open(fifo, O_RDWR)) < 0)\n    printf (“\\nfifo open failed\\n”);\n  \
    \  for(;;)\n    {\n    if (read(fd, msg_buf, MSGSIZ+1) <0)\n    printf (“\\n message\
    \ read failed \\n”);\n    printf (“message received:%s\\n”, msgbuf);\n    }\n\
    \  }\n  exit(0);\n}\n```\n\n# 客户端进程\n\n在服务器进程中创建的 FIFO 在客户端进程中以 `O_WRONLY` 模式打开。服务器的回复从\
    \ FIFO 中读取并写入标准输出。随后关闭并删除客户端的 FIFO。\n\n**示例：**\n\n在给出的示例中，客户端进程以只写模式打开 FIFO。如果\
    \ FIFO 打开操作成功，它将检查传递给 FIFO 打印的消息的消息长度是否大于用于临时存储消息的缓冲区，如果是，所有消息将被复制到缓冲区 `msg_buf`\
    \ 中，并逐个写入 fifo。\n\n```c\ninclude <fcntl.h>\n#include <stdio.h>\n#include <errno.h>\n\
    #define MSGSIZE 100\nchar *fifo = “fifo”;\nint main (int argc, char **argv){\n\
    \  int fd, j, nwrite;\n  char msg_buf[MSGSIZ+1];\n  if (argc < 2){\n    printf\
    \ ( “No message passed. \\n”);\n    exit(1);\n  }\n  if ((fd = open(fifo, O_WRONLY\
    \ | O_NONBLOCK)) < 0)\n  printf(“\\n fifo open failed\\n”);\n  for ( j = 1; j\
    \ < argc; j++)\n  {\n  if (strlen(argv[j]) > MSGSIZ)\n  {\n    printf (“message\
    \ is long er than buffer %s\\n”, argv[j]);\n    continue;\n    }\n    strcpy (msg_buf,\
    \ argv[j]);\n    if ((nwrite = write(fd, msg_buf, MSGSIZ+1)) == -1)\n    printf(“\\\
    n message write failed \\n”);\n  }\n  exit (0);\n  }\n```\n\n# 消息队列\n\n消息队列是内核驻留的进程间通信（IPC）。消息队列以链表的形式存储在内核中。一个标识符标识每个消息队列。进程可以对任意队列进行读写操作。进程可以在队列上写入一些消息并退出，并在稍后由另一个进程读取这些消息。\n\
    \n队列上的每条消息具有以下属性：\n\n* 长整型类型消息队列标识符。\n* 消息数据部分的长度。\n* 数据。\n\n内核为每个消息队列维护一个 `msqid_ds`\
    \ 数据结构，如下：\n\n```c\n/* 系统中每个队列对应一个 msqid 结构 */\nstruct msqid_ds {\n  struct ipc_perm\
    \ msg_perm;\n  struct msg *msg_first;  /* 队列上的第一个消息 */\n  struct msg *msg_last;\
    \   /* 队列中的最后一个消息 */\n  time_t msg_stime;      /* 上次 msgsnd 时间 */\n  time_t msg_rtime;\
    \      /* 上次 msgrcv 时间 */\n  time_t msg_ctime;      /* 上次修改时间 */\n  struct wait_queue\
    \ *wwait;\n  struct wait_queue *rwait;\n  ushort msg_cbytes;\n  ushort msg_qnum;\n\
    \  ushort msg_qbytes;      /* 队列最大字节数 */\n  ushort msg_lspid;      /* 上次 msgsnd\
    \ 的 pid */\n  ushort msg_lrpid;      /* 上次接收的 pid */\n}\n```\n\n让我们来讨论其中一些：\n\n\
    * `msg_perm`: 在 `linux/ipc.h` 中定义的 `ipc_perm` 结构对象。它持有消息队列的权限信息，包括访问权限以及创建消息队列的用户信息\
    \ (`uid`)。\n* `msg_first`: 包含指向消息队列中第一条消息的指针（列表头）。\n* `msg_last`: 包含指向消息队列中最后一条消息的指针（列表尾）。\n\
    * `msg_stime`: 上次发送到队列的消息的时间戳 (`time_t`)。\n* `msg_rtime`: 上次从队列中取回的消息的时间戳。\n*\
    \ `msg_ctime`: 上次对队列进行修改的时间戳。\n* `wwait` 和 `rwait`: 当队列满或为空时指向内核等待队列的指针。\n* `msg_cbytes`:\
    \ 留在队列上的总字节数（所有消息之和）。\n* `msg_qnum`: 消息队列中的当前消息总数。\n* `msg_qbytes`: 消息队列可以容纳的最大字节数。\n\
    * `msg_lspid`: 发送最后一条消息的进程 ID。\n* `msg_lrpid`: 取回最后一条消息的进程 ID。\n\n# 创建和打开消息队列\n\
    \n进程可以创建一个新的消息队列，也可以连接到已存在的消息队列。`msgget()` 函数用于创建和连接。\n\n**原型：**\n```c\nint msgget(key_t\
    \ key, int msgflg);\n```\n\n`key` 是描述队列的系统级唯一标识符。创建消息队列的进程生成一个键标识符，其他进程使用此键连接到队列。`msgflg`\
    \ 参数包含读写权限，它可以与 `IPC_CREAT` 或 `IPC_EXCL` 进行按位或操作，以创建新的消息队列或连接到已存在的消息队列。\n\n当创建新的消息队列时，`msgid_ds`\
    \ 结构体的以下成员将被初始化：\n\n* `msg_qbytes`: 设置为系统限制值。\n* `msg_ctime`: 设置为当前时间。\n* `msg_perm.mode`:\
    \ 包含来自 `msgflg` 参数的读写权限。\n* `msg_qnum`: 设置为 `0`。\n* `msg_lspid`: 设置为 `0`。\n* `msg_lrpid`:\
    \ 设置为 `0`。\n* `msg_stime`: 设置为 `0`。\n* `msg_rtime`: 设置为 `0`。\n* `msg_perm.uid`\
    \ 和 `msg_perm.cuid`: 设置为进程的有效用户 ID。\n* `msg_perm.gid` 和 `msg_perm.cgid`: 设置为进程的有效组\
    \ ID。\n\n`msgget()` 成功时返回消息队列 ID，失败返回 -1。\n\n# 向队列发送消息\n\n`msgsnd()` 函数用于向消息队列发送消息。\n\
    \n**原型：**\n```c\nint msgsnd(int msqid, const void *msgp, size_t msgsz, int msgflg);\n\
    ```\n\n`msqid` 是由 `msgget()` 返回的消息队列标识符。`msgp` 是要放入队列的消息指针。消息在 `sys/msg.h` 中以\
    \ `msgbuf` 结构的形式定义如下：\n\n```c\nstruct msgbuf {\n  long mtype;\n  char mtext[1];\n\
    }\n```\n\n编译时对 `mtext` 的长度没有限制；相反，限制由系统管理员设置。`msgsz` 是消息的字节大小。`msgflg` 设置为 `0`\
    \ 或 `IPC_NOWAIT`。\n\n函数的返回值如下：\n\n* 如果可用消息过多。\n* 如果队列上的字节数超过了 `msg_qbyte` 限制。\n\
    \n如果 `msgflg` 设置为 `IPC_NOWAIT`，则函数返回错误 `EAGAIN`；如果 `msgflg` 未设置为 `IPC_NOWAIT`，则线程进入睡眠。\n\
    \n**示例：**\n\n在给出的示例中，进程创建一个用于写入消息的消息队列。如果消息队列未创建，将打印错误消息且程序异常退出。一旦消息队列创建成功，从键盘读取消息并发送到队列。如果发生错误，消息队列将被销：\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <errno.h>\n#include\
    \ <sys/types.h>\n#include <sys/ipc.h>\n#include <sys/msg.h>\n\nstruct msgbuf {\n\
    \  long mtype;\n  char mtext[200];\n};\n\nint main(void)\n{\n  struct msgbuf buf;\n\
    \  int msqid;\n  key_t key= 100;\n```\n\n"
