    \ system call to send information from client to server or from server to client.\
    \ If the client is using `send()`, the server should be using `recv()` or vice-versa.\
    \ This function either returns the number of bytes sent out or returns `-1` if\
    \ there is an error.\n\n**Prototype:**\n\n```\nint send(int sockfd, const void\
    \ *msg, int len, int flags);\n```\n\nThe `sockfd` is the socket file descriptor\
    \ for the socket being used to send the data. On the client-side, `sockfd` is\
    \ the same socket used when calling `connect()`. On the server-side, `sockfd`\
    \ is the socket returned from `accept()`, `msg` is a pointer to the data that\
    \ is being sent, `len` is the length of the data in bytes, flags are set to `0`.\n\
    \n# Receiving message through socket (connection-oriented)\n\nThe `recv()` system\
    \ call is used to receive data that has been sent over the socket. The function\
    \ returns the number of bytes actually received; in case of an error, it returns\
    \ `-1` or returns `0` if the other end has closed the connection.\n\n**Prototype**\n\
    \n```\nint recv(int sockfd, void *buf, int len, unsigned int flags);\n```\n\n\
    The `sockfd` is the socket descriptor for the socket from which the data is being\
    \ read. On the client-side, `sockfd` is the same socket used when calling `connect()`.\
    \ On the server-side, `sockfd` is the socket returned from `accept()`, `buf` is\
    \ a pointer to the buffer that will hold data after reading, `len` is the maximum\
    \ length of the buffer in bytes, flags are set to `0`.\n\n# Receiving message\
    \ through socket (connectionless)\n\nThis function is similar to `send()`; however,\
    \ it is used for connectionless datagrams rather than connection-oriented communications.\n\
    \n**Prototype**\n\n```\nint sendto(int sockfd, const void *msg, int len, unsigned\
