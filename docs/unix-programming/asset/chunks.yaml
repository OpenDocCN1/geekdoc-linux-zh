    \ `recv()`，反之亦然。该函数要么返回发送的字节数，要么在出错时返回 `-1`。\n\n**原型：**\n\n```\nint send(int sockfd,\
    \ const void *msg, int len, int flags);\n```\n\n`sockfd` 是用于发送数据的套字文件描述符。在客户端侧，`sockfd`\
    \ 是调用 `connect()` 时使用的同一个套字。在服务器侧，`sockfd` 是 `accept()` 返回的套字，`msg` 是指向要发送数据的指针，`len`\
    \ 是以字节字节的数据长度，`flags` 设置为 `0`。\n\n# 通过套字接收消息（面向连接型）\n\n`recv()` 系统调用用于接收通过套字发送的数据。该函数返回实际接收的字节数；如果发生错误，返回\
    \ `-1`；如果对方已关闭连接，则返回 `0`。\n\n**原型**\n\n```\nint recv(int sockfd, void *buf, int\
    \ len, unsigned int flags);\n```\n\n`sockfd` 是用于读取数据的套字描述符。在客户端侧，`sockfd` 是调用\
    \ `connect()` 时使用的同一个套字。在服务器侧，`sockfd` 是 `accept()` 返回的套字，`buf` 是指向读取后存放数据的缓冲区指针，`len`\
    \ 是缓冲区的最大字节长度，`flags` 设置为 `0`。\n\n# 通过套字接收消息（无连接型）\n\n此函数与 `send()` 类似；但它用于无连接的数据报文，而不是面向连接的通信。\n\
    \n**原型**\n\n```\nint sendto(int sockfd, const void *msg, int len, unsigned int\
    \ flags, const struct sockaddr *toaddr, int addrlen);\n```\n\n`sockfd` 是用于发送数据的套字描述符，`msg`\
    \ 是指向要发送数据的指针，`len` 是以字节字节的数据长度，`flags` 设置为 `0`，`toaddr` 是包含数据目标 IP 地址和端口号的 `sockaddr`，`addrlen`\
    \ 是数据结构中上述 `sockaddr` 的大小。\n\n# 关闭套字\n\n`close()` 系统调用用于关闭套字。\n\n**原型**\n\n```\n\
    void close(sockfd);\n```\n\n让我们来看一个客户端和服务器程序的示例。\n\n# 客户端程序\n\n以下是客户端侧的代码：\n\n\
    ```c\n#include <stdio.h>\n#include <sys/types.h>\n#include <sys/socket.h>\n#include\
    \ <netinet/in.h>\n#include <netdb.h>\n#include <string.h>\n\n#define PORT 5000\n\
    #define HOST \"u.ac.in\"\n#define DIRSIZE 8000\n\nmain(int argc, char **argv)\
    \ {\n    char hostname[100];\n    char dir[DIRSIZE];\n    int sd;\n    struct\
    \ sockaddr_in sin;\n    struct sockaddr_in pin;\n    struct hostent *hp;\n\n \
    \   strcpy(hostname, HOST);\n    if (argc > 2) {\n        strcpy(hostname, argv[2]);\n\
    \    }\n    if ((hp = gethostbyname(hostname)) == 0) {\n        perror(\"gethostbyname\"\
    );\n        exit(1);\n    }\n\n    memset(&pin, 0, sizeof(pin));\n    pin.sin_family\
    \ = AF_INET;\n    pin.sin_addr.s_addr = ((struct in_addr *)hp->h_addr)->s_addr;\n\
    \    pin.sin_port = htons(PORT);\n\n    if ((sd = socket(AF_INET, SOCK_STREAM,\
    \ 0)) == -1) {\n        perror(\"socket\");\n        exit(1);\n    }\n\n    if\
    \ (connect(sd, (struct sockaddr *)&pin, sizeof(pin)) == -1) {\n        perror(\"\
    connect\");\n        exit(1);\n    }\n\n    if (send(sd, argv[1], strlen(argv[1]),\
    \ 0) == -1) {\n        perror(\"send\");\n        exit(1);\n    }\n\n    if (recv(sd,\
    \ dir, DIRSIZE, 0) == -1) {\n        perror(\"recv\");\n        exit(1);\n   \
    \ }\n\n    printf(\"%s\\n\", dir);\n    close(sd);\n}\n```\n\n# 服务器程序\n\n以下是服务器侧的代码：\n\
    \n```c\n#include <stdio.h>\n#include <sys/types.h>\n#include <sys/socket.h>\n\
    #include <netinet/in.h>\n#include <netdb.h>\n#include <string.h>\n\n#define PORT\
    \ 5000\n#define DIRSIZE 8000\n\nmain() {\n    char dir[DIRSIZE];\n    int sd,\
    \ sd_current, cc, fromlen, tolen;\n    int addrlen;\n    struct sockaddr_in sin;\n\
    \    struct sockaddr_in pin;\n\n    if ((sd = socket(AF_INET, SOCK_STREAM, 0))\
    \ == -1) {\n        perror(\"socket\");\n        exit(1);\n    }\n\n    memset(&sin,\
    \ 0, sizeof(sin));\n    sin.sin_family = AF_INET;\n    sin.sin_addr.s_addr = INADDR_ANY;\n\
    \    sin.sin_port = htons(PORT);\n\n    if (bind(sd, (struct sockaddr *)&sin,\
    \ sizeof(sin)) == -1) {\n        perror(\"bind\");\n        exit(1);\n    }\n\n\
    \    if (listen(sd, 5) == -1) {\n        perror(\"listen\");\n        exit(1);\n\
    \    }\n\n    addrlen = sizeof(pin);\n    if ((sd_current = accept(sd, (struct\
    \ sockaddr *)&pin, &addrlen)) == -1) {\n        perror(\"accept\");\n        exit(1);\n\
    \    }\n\n    /*\n    printf(\"Hi there, from %s\\n\", inet_ntoa(pin.sin_addr));\n\
    \    printf(\"Coming from port %d\\n\", ntohs(pin.sin_port));\n    */\n\n    if\
    \ (recv(sd_current, dir, sizeof(dir), 0) == -1) {\n        perror(\"recv\");\n\
    \        exit(1);\n    }\n\n    read_dir(dir);\n    /* strcat(dir,\" DUDE\");\
    \ */\n\n    if (send(sd_current, dir, strlen(dir), 0) == -1) {\n        perror(\"\
    send\");\n        exit(1);\n    }\n\n    close(sd_current);\n    close(sd);\n\
    }\n```\n"
- fmt: "\nThe process is blocked in `select()` or `poll()` if one of these systems\
    \ calls instead of blocking on the actual I/O itself. On return, the socket is\
    \ readable; that is, data is ready on any of the descriptors, and process calls\
    \ `recvfrom()` to get the actual data.\n\nThe advantage of this model is that\
    \ process can wait for more than one file descriptor to be ready. As shown in\
    \ *[figure 5.4](#c05.xhtml_fig5_4)*, the application executes `select()` system\
    \ call; if data is not ready at the server end, the application blocks the system\
    \ call, but the application itself will be in running mode. Once data is available,\
    \ the application executes `recefrom()` function to receive data from the Kernel\
    \ and immediately returns.\n\n![](images/Figure-5.4.jpg)\n\n**Figure 5.4:** Block\
    \ diagram of multiplexing I/O model\n\nA disadvantage of this model is that it\
    \ requires two system calls instead of one.\n\n# [Signal-driven I/O model](#toc.xhtml_s141a)\n\
    \nIn this model, Kernel notifies the process that data is available by sending\
    \ the SIGIO signal. As shown in *[figure 5.5](#c05.xhtml_fig5_5)*, the application\
    \ enables signal handler using `sigaction()` function. After enabling, the application\
    \ keeps on executing. Once data is available at the Kernel end, Kernel sends a\
    \ SIGIO signal to the application. SIGIO signal is handled by the signal handler\
    \ at the application end. Now, the application call `receivfrom()` function to\
    \ receive data from Kernel, and when data is completely written, it starts executing.\n\
    \n![](images/Figure-5.5.jpg)\n\n**Figure 5.5:** Block diagram of signal-driven\
    \ I/O model\n\nInitially, the socket is made enabled for signal-driven I/O. The\
    \ `sigaction()` system call is executed to install a signal handler for handling\
    \ I/O. Once a handler is installed, the system calls to return and does not block\
    \ the process. Once the datagram is ready, the Kernel sends a SIGIO signal to\
    \ the process. The process then reads the datagram either from the signal handler\
    \ by calling `recvfrom()` system call, or the main function of the process can\
    \ also read the datagram.\n\nIn this mode, the process is not blocked while waiting\
    \ for the datagram to arrive; rather, it continues executing. Once the datagram\
    \ is ready to arrive, the process is notified by the signal handler.\n\n# [Asynchronous\
    \ I/O model](#toc.xhtml_s142a)\n\nIn this mode of I/O, the `io_read()` function\
    \ is called defining the descriptor, buffer pointer, buffer size (same as in `read()`\
    \ function) to the Kernel, file offset, and the method of notification of data\
    \ arrival. When the entire operation is complete, the system calls immediately.\
    \ This does not require blocking the process while waiting for the I/O to complete.\
    \ The system model is illustrated in *[figure 5.6](#c05.xhtml_fig5_6)*.\n\n![](images/Figure-5.6.jpg)\n\
    \n**Figure 5.6:** Block diagram of asynchronous I/O model\n\nThis model is quite\
    \ different from signal-driven I/O as the signal is generated until data has been\
    \ copied into the application’s buffer.\n\n# [Name and address conversion](#toc.xhtml_s143a)\n\
    \nDNS is used to map between hostnames and an IP address. The hostname can be\
    \ either a simple name (solaris) or a Fully Qualified Domain Name (FQDN) ([solaris.kohala.com](http://solaris.kohala.com)).\n\
    \n# [Resource records](#toc.xhtml_s144a)\n\nDNS entries are called Resource Records\
    \ (RRs). It defines all the information about the domain name, including the type\
    \ of resource, protocol family, time in seconds during which a server can cache\
    \ the RR, length of the data field, and resource data. The following table describes\
    \ different types of resource records.\n\n| **Resource record type** | Mapping\
    \ |\n| :--- | :--- |\n| A | Maps hostname into 32-bit IPv4 address |\n| AAAA |\
    \ Maps hostname into 128-bit IPv6 address |\n| PTR | Map IP address into a hostname.\
    \ For IPv4, the 4 bytes are reversed, and each byte is converted into a decimal\
    \ ASCII value (0-255). Then in-`addr.arpa` is appended. For an IPv6 address, the\
    \ 32 4-bit nibbles of the 128-bit address are reversed. Each nibble is converted\
    \ to its corresponding hexadecimal ASCII value (0-9-a-f), and `ip6.int` is appended.\
    \ |\n| MX | Mail exchange for the specified host. |\n| CNAME | Canonical name,\
    \ for example, assigns CNAME to common services such as FTP, WWW, and so on. |\n\
    \n**Table 5.2:** Resource types with their mapping\n\n# [The gethostbyname() function](#toc.xhtml_s145a)\n\
    \nThe `gethostbyname()` function takes the hostname of the current host and returns\
    \ the corresponding IP address to pass as a parameter to the `connect()` function.\
    \ It performs a query for an A and AAAA records and returns IPv4 and IPv6 addresses.\n\
    \n**Prototype**\n\n```c\n#include <netdb.h> /* Berkeley */\nstruct hostent *gethostbyname\
    \ (const char *hostname);\n```\n\nThe argument to `gethostbyname()` is a string\
    \ like `[www.yahoo.com](http://www.yahoo.com)`, and it returns a struct hostent,\
    \ which contains a huge amount of information, including the IP address. Other\
    \ information is the official hostname, a list of aliases, the address type, the\
    \ length of the addresses, and the list of addresses.\n\n# [The hostent structure](#toc.xhtml_s146a)\n\
    \nThe hostent structure contains information about host in hosts database. The\
    \ elements of the hostent structure are: host name, alternative name of the host,\
    \ type of address type IPv4 or IPv6, length of address in bytes, address vector\
    \ of hosts.\n\n```c\n/* <netdb.h> */\nstruct hostent { /* structure returned by\
    \ network */\n  char *h_name;  /* official name of host */\n  char **h_aliases;\
    \  /* alias list */\n  int h_addrtype;  /* host address type */\n  int h_length;\
    \  /* length of address */\n  char **h_addr_list;  /* list of addresses from name\
    \ server */\n};\n```\n\n`h_addrtype` always is `AF_INET`, `h_length` always is\
    \ 4, `h_addr_list[]` for multinode.\n\n```c\nvoid main()\n{\n  int i;\n  struct\
    \ hostent *he;\n  struct in_addr addr;\n  // get the addresses of www.yahoo.com:\n\
    \  he = gethostbyname(\"www.yahoo.com\");\n  if (he == NULL) {\n    herror(\"\
    gethostbyname\");\n    exit(1);\n  }\n  // print information about this host:\n\
    \  printf(\"Official name is: %s\\n\", he->h_name);\n  printf(\"IP address: %s\\\
    n\", inet_ntoa(*(struct in_addr*)he->h_addr[0]));\n  exit(0);\n}\n```\n\nThe output\
    \ is the official name and IP Address of the requested URL.\n\n# [The gethostbyaddress()\
    \ function](#toc.xhtml_s147a)\n\nThe `gethostbyaddr()` returns a hostent structure\
    \ containing the host’s name and other.\n\n**Prototype**\n\n```c\n#include <netdb.h>\n\
    struct hostent *gethostbyaddr(const char *addr, int len, int type);\n```\n\nFor\
    \ TCP/IP, the first argument `addr` should point to struct `in_addr` or an unsigned\
    \ long integer in network byte order, `len` is normally the `sizeof(struct in_addr)`,\
    \ and type should be `AF_INET`.\n\nHost information is found either through the\
    \ resolver or in your system’s equivalent of the `/etc/hosts` file.\n\n```c\n\
    main()\n{\n  const char *ipstr = \"66.94.230.32\";\n  struct in_addr addr;\n \
    \ struct hostent *hp;\n  if (!inet_aton(\"66.94.230.32\", &addr)) {\n    errx(1,\
    \ \"can’t parse IP address %s\", ipstr);\n  }\n  if ((hp = gethostbyaddr(&addr,\
    \ sizeof addr, AF_INET)) == NULL) {\n    errx(1, \"no name associated with %s\"\
    , ipstr);\n  }\n  printf(\"Host name: %s\\n\", hp->h_name);\n  exit(0);\n}\n```\n\
    \n# Resolver\n\nThe `gethostbyname()` and `gethostbyaddress()` functions use `resolver()`\
    \ library function to get host information. The `resolver()` function reads the\
    \ file `/etc/resolv.conf` to get the IP address of the DNS server to start from.\n\
    \n# [The getservbyname() and getservbyport() functions](#toc.xhtml_s148a)\n\n\
    The `getservent()` functions reads the service database to identify server to\
    \ open the connection.\n\nThe `getservbyname()` searches the service database\
    \ to identify the service that matches with the name specified and service protocol\
    \ and opens a connection if necessary.\n"
