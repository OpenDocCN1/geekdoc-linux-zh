    # [Mounting and unmounting a file system](#toc.xhtml_s46a)


    The mount system call connects the file system in a specified partition of a disk
    to the existing file system hierarchy. The mount system call thus allows users
    to access data in a disk section as a file system instead of a sequence of disk
    blocks.


    **Prototype**


    `int mount (const char * source , const char * target , const char * filesystemtype
    , unsigned long mountflags , const void * data );`


    The **`mount()`** attaches the filesystem specified by the source (which is often
    a device name but can also be a directory name or a dummy) to the directory specified
    by the target.


    The umount system call disconnects a file system and frees the hierarchy.


    **Prototype**


    `int umount(const char *target);`


    The **`umount2()`** removes the attachment of the (topmost) filesystem mounted
    on the target.


    # [Directory related system calls](#toc.xhtml_s47a)


    Like file-related system calls, the UNIX Kernel also defines a set of system calls
    for performing directory-related operations as in UNIX; everything is considered
    as a file. These system calls are used to create, remove, and manipulate directory
    contents.


    # [The mkdir system call](#toc.xhtml_s48a)


    The **`mkdir()`** function is used to create a new directory named by the pathname
    pointed by the path.


    **Prototype**


    `int mkdir(const  char *path, mode_t mode);`


    The mode of the new directory is initialized from mode. The protection part of
    the mode argument is modified by the process’s file creation mask.


    The directory’s owner ID is set to the process’s effective user ID. The directory’s
    group ID is set to the process’s effective group ID, or if the **`S_ISGID`** bit
    is set in the parent directory, then the group ID of the directory is inherited
    from the parent. The **`S_ISGID`** bit of the new directory is inherited from
    the parent directory.


    If path names a symbolic link, **`mkdir()`** fails and sets **`errno`** to **`EEXIST`**.


    The newly created directory is empty with the exception of entries for itself
    (.) and its parent directory (..).


    Upon successful completion, the system call returns **`0`**. Otherwise, it returns
    **`-1`**, no directory is created, and **`errno`** is set to indicate the error.


    # [The rmdir system call](#toc.xhtml_s49a)


    The **`rmdir()`** system call to remove a directory file whose name is given by
    path. The directory must not have any entries other than “.” and “..”.


    **Prototype**


    `int rmdir(const char *path);`


    The **`rmdir()`** function returns the value **`0`** if successful; otherwise,
    it returns a value **`-1,`** and the global variable **`errno`** is set to indicate
    the error.


    If the link count of the directory becomes 0 with this call and no other process
    has the directory opened, then the space occupied by this directory is freed.


    # [The chdir() system call](#toc.xhtml_s50a)


    The **`chdir()`** system call is used to change the current directory pointed
    by the argument path. The process executing **`chdir()`** system call must have
    to execute access permission on the directory.


    **Prototype**


    `int chdir(const char *path);`


    Upon successful completion, **`chdir()`** returns a value of **`0`**. Otherwise,
    it returns a value of **`-1`**, and **`errno`** is set to indicate the error.


    # [Standard I/O library in UNIX](#toc.xhtml_s51a)


    In UNIX standard I/O library is used to provide a stream I/O interface to the
    program. The stream I/O interface is the simple and efficient way to provide input
    to the program and write the produced output.


    Three streams, standard input, standard output, and standard error, are by default
    opened and provided to the program whenever it starts executing.


    # [Stream and FILE object](#toc.xhtml_s52a)


    Streams are a portable way of reading and writing data.


    A stream can be a file or a physical device (for example, a printer or monitor).
    All streams are defined by an internal C data structure, FILE. The FILE data structure
    is declared in **`stdio.h`**, which is manipulated with a pointer to the stream.
    To perform I/O with stream, it is simply required to refer to the FILE structure
    in C programs.


    A stream must be opened before doing any I/O to access it, and it must be closed
    after use.


    # [I/O buffering](#toc.xhtml_s53a)


    Buffering is used to minimize the number of read and write calls. I/O buffering
    can be of basically three types, as discussed in the following sections.


    # Fully/blocked buffered


    When a stream is a block buffered, many characters are saved up and written as
    a block. Normally, all files are block buffered. Actual I/O occurs when the buffer
    is filled up. When the first I/O operation occurs on a file, malloc(3) is called,
    and an optimally sized buffer is obtained.


    The term flush describes the writing of a standard I/O buffer. A buffer can be
    flushed automatically by the standard I/O routines (such as when a buyer fills)
    or by using the function **`fflush`** explicitly.


    Standard input and standard output are fully buffered streams unless they are
    not referred to as interactive devices.


    # Line buffered I/O


    When streams are line-buffered, characters are saved up until a newline (**`\n`**)
    is output or input is read from any stream attached to a terminal device (typically
    stdin). This allows us to output a single character at a time (for example, with
    **`fputc`**), knowing that actual I/O will take place only when we finish writing
    each line. Line buffering is typically used on a stream when it refers to a terminal
    (for example, standard input and standard output).


    # Unbuffered I/O


    The standard I/O library does not buffer the characters. When an output stream
    is unbuffered, information appears on the destination file or terminal as soon
    as written. For instance, by using the discussed write(2) call, the standard error
    stream is normally unbuffered. Any error messages are displayed as quickly as
    possible (regardless of whether they contain a newline or not).


    # [Stream buffering operations](#toc.xhtml_s54a)


    UNIX provides buffer operation to buffer information to avoid frequent access
    to external storage devices. The buffering makes data reading and writing less
    time-consuming.


    # setbuf(3), setvbuf(3)


    Functions must be called after the stream has been opened and before any other
    operation is performed on the stream. The **`setbuf(3)`** is used to turn to buffer
    on and off.


    **Prototype**


    `void setbuf ( FILE * stream , char * buf );`


    To enable buffering, **`buf`** must point to a buffer of length **`BUFSIZ`**.
    To disable buffering, **`buf`** is set to NULL.


    **`setvbuf()`** may be used to alter the buffering behavior of a stream.


    **Prototype**


    `int setvbuf ( FILE * stream , char *buf , int mode , size_t size );`


    The **`mode`** parameter must be one of the three macros following. The **`size`**
    parameter may be given as zero to obtain deferred:


    `# define _IOFBF 0 /* setvbuf should set fully buffered */`


    `# define _IOLBF 1 /* setvbuf should set line buffered */`


    `# define _IONBF 2 /* setvbuf should set unbuffered */`


    # Flushing a stream


    When **`fflusg()`** function is called, all data buffered for given output is
    forcefully written to the **`FILE`** object pointed out by stream argument. The
    steam is remained open. Stream argument is set to NULL, and then all opened output
    streams are fflushed. The second function **`fpurge()`** deletes all input or
    output buffered in the given stream


    The **`fflush()`** forces a write of all buffered data for the given output or
    update stream via the stream’s underlying write function. The open status of the
    stream is unaffected. If the stream argument is NULL, **`fflush()`** flushes all
    open output streams. **`fpurge()`** erases any input or output buffered in the
    given stream.'
