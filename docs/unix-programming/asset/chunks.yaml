    }\nvoid f(void)\n{\n    printf(\"2 \");\n    longjmp( ebuf, 3);\n}\n```\n\n# Conclusion\
    \ (#toc.xhtml_s165a)\n\nMemory is considered as an important resource of the computer\
    \ system. If memory is not managed properly, it can degrade the overall performance\
    \ of the operating system. The memory management function is used to keep track\
    \ that which part of memory is used and how much and which part of memory is free\
    \ to assign to the processes requiring memory space. The memory management function\
    \ controls both primary and secondary memory available in the system. The UNIX\
    \ operating system implements swapping and demand paging techniques for efficient\
    \ use of system memory. The memory can be dynamically allocated and deallocated\
    \ as and when required.\n\n# Multiple choice questions (#toc.xhtml_s166a)\n\n\
