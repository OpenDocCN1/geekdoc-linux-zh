    **Example:**


    **`$ mail   George < mail_file`**


    The preceding command mails the contents of the file **`mail_file`** to George.


    Let us consider two exactly same commands:


    **`Case 1:  wc –l file1`**


    **`output: 10`**


    **`Case 2:  wc –l < file1`**


    **`output: 10 file1`**


    In Case 1, the shell determines the command **`wc`** to be executed for counting
    the number of lines in the file **`file1`**; it opens the file **`file1`** and
    counts the number of lines.


    In Case 2, **`wc`** executes in a slightly different manner. The shell determines
    the input redirection operator < when it scans the command line, the word following
    < symbol is the name of the file from which input is to be redirected. The shell
    executes **`wc`** command, redirecting its standard input from the file **`file1`**.


    **Note: Both input and output redirection cannot be used in a single command.**


    # [Redirecting error](#toc.xhtml_s193a)


    A standard stream to display error generated by a program or command is by default
    combined with a standard output stream. Consider an example:


    **`$ls  -l file1 file2`**


    **Output:**


    **`Cannot access file2\. No such file or directory`**


    **`-rwxr-xr-x 1 workshop acs 532 May 2015:31 . file1`**


    Output and the error message are both displayed on the same screen. Users can
    redirect standard errors to the file and leave the output on the screen, or vice-versa
    is also possible. To do this user needs to specify the file descriptor along with
    the redirection operator. Let us reconsider the preceding example:


    **`$ls –l  file file2 1> out_file`**


    **Output:**


    **`Cannot access file2\. No such file or directory`**


    **`$ cat out_file`**


    **`-rwxr-xr-x 1 workshop acs 532 May 2015:31 . file1`**


    The error message is shown on the screen to inform us that there is a problem
    while executing the command, and the output is redirected to the file **`out_file`**.


    Both error message and output can be redirected to the file as follows:


    **`$ls –l  file file2 1> out_file  2> err_file`**


    **`$more err_file`**


    **`Cannot access file2\. No such file or directory`**


    **`$more out_file`**


    **`-rwxr-xr-x 1 workshop acs 532 May 2015:31 . file1`**


    Redirecting to the one file


    Both **`STDOUT`** and **`STDERR`** can be redirected to the same file. Consider
    an example:


    **`$ls –l  1> out_file  2> &1`**


    Discarding STDOUT or STDERR


    Either or both **`STDOUT`** and **`STDERR`** can be discarded by redirecting to
    a null device accessed by a special write-only file **`/dev/null`**.


    **Example:**


    **`$ls –l > /dev/null 2>&1`**


    Leftmost redirection sends **`SDTOUT`** to **`/dev/null`** file, and 2>$1 indicates
    that Channel 2 should be redirected to the same file as Channel 1.


    # [Command grouping](#toc.xhtml_s194a)


    Commands may be grouped in the following two ways:


    *   { command-list ; }


    *   ( command-list )


    In the first command, list is simply executed. The second form executes the command
    list as a separate process. For example, (**`cd x; rm junk`**) executes **`rm
    junk`** in the directory **`x`** without changing the current directory of the
    invoking shell.


    The commands **`cd x; rm junk`** has the same effect but leaves the invoking shell
    in the directory **`x`**.


    # [Command pipelining](#toc.xhtml_s195a)


    Sometimes it is required to execute a series of commands to complete the task.
    Consider an example if the user wants to generate a hard copy of the list of files
    and directories in the current directory. To generate the list **`ls –l`** command
    will be used; the output of this command will be stored in some file using redirection,
    and then the **`lpr`** command will be used to print the file.


    **`$ls –l > file1`**


    **`$lpr file1`**


    These two commands can be written as single command combining them using pipe
    ( |) as follows:


    **`$ ls –l | lpr`**


    When a pipe is set up between two commands, the standard output from the first
    command is connected directly to the standard input of the second command. The
    output of the first command is not displayed on the screen because it is piped
    directly with the second command.


    A pipe can be made between the two commands only if the first command writes its
    output to the standard output and the second command takes its input from the
    standard input.


    **Note: Pipe is an operator, not a command, which tells the shell to redirect
    the output of the first command as input to the second command.**


    Consider another example: if a list of files and directories in the current directory
    is very large, it scrolls up, and we can only see the last page of the output
    of **`ls –l`** command. We can use a pipe to see output one page at a time:


    **`$ls –l | more`**


    # [The tee command](#toc.xhtml_s196a)


    The **`tee`** command copies output of the command or program to the standard
    output and, at the same time, copies it to one or more files. The tee command
    first creates the file to copy the output, and if the file is already existing,
    it overwrites the output. To prevent overwriting to an existing file, the **`-a`**
    option is used with the tee command. With **`–a`** option, the output is appended
    instead of overwritten.


    Consider the following example:


    **`$ls –l tee file_list`**


    In the preceding example, a long list of files and directories in the current
    directory is displayed on the monitor as well it is copied to the file **`file_list`**.


    # [UNIX environment variables](#toc.xhtml_s197a)


    Environment variables are predefined variables. Environment variables control
    the user environment. In a shell environment, variables are commonly used to communicate
    to and from the shell. For example, setting a **`PATH`** variable tells the shell
    in which directory to look for the commands; the shell automatically sets the
    variable **`PWD`** when the current directory is changed.


    Environment variables are managed by the shell and are inherited by all processes,
    including the sub-shell. The new process gets its own copy of these variables.
    These local copies can be read, modified, and passed on to the children of the
    processes.


    You can set environment variables with a command like this:


    In Bourne and Korn shell:


    **`$ NAME=value`**


    In C shell:


    **`% setend NAME value`**


    # [PATH variable](#toc.xhtml_s198a)


    The **`PATH`** environment variable lists directory searched for commands. When
    a command is given at the prompt, the directories listed in the **`PATH`** variable
    are searched in the order specified.


    Syntax for setting **`PATH`** variable is as follows:


    **`$ PATH= :/usr/bin`**


    If there are multiple directories, each will be separated by: can be specified
    as a search path. An empty string specifies the current directory.


    **Note : $0 displays the current shell of the user.**


    **The external program “env” prints all the environment variables.**'
