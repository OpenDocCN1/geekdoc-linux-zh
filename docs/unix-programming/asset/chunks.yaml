    # 关于作者


    **Vineeta Khemchandani 教授（博士）** 是计算机科学博士，毕业于孟买印度银行金融学院，获得计算机应用硕士学位和“银行技术文凭”。她在各机构的
    IT 领域拥有约 23 年的丰富经验。经验涵盖软件开发、企业培训、系统管理、学术、行政和研究等多个领域。她在指导多个 B.Tech/MCA 项目、M.Tech
    论文和博士论文方面做出了显著贡献。她在众多知名期刊上发表了 30 篇研究论文，编写了 6 个书籍章节并编写了 3 书。她申请了三项专利。她是沙特国王大学期刊、INDERSCIENCE
    电子政府期刊以及美国 Science Publishing Group 的评审委员会成员。


    她作为北方普拉什邦州级大学“学习委员会”成员，为教育创新做出了贡献。目前，她也是勒克瑙 AKTU 的 CS、IT 和 MCA 课程学习委员会成员。她在国际会议和
    TEQIP 项目期间进行过多次演讲。她作为分会顾问和管理委员会成员，为 IEEE 和印度计算机学会等国家和国际专业机构做出了贡献。她连续四年担任 AICTE
    和人力资源开发部（印度政府）发起的“智慧印度黑客松”（SMART INDIA HACKTHON）评审。她过去几年的研究工作集中在信息安全和算法的不同方面。简要研究领域包括密码学、数字水印、视觉密码学、隐写术、多维数据结构和电子治理项目。


    **Darpan Anand 教授（博士）** 目前任于印度钦迪加尔大学计算机科学工程系教授，在教学、工业和研究方面拥有超过 18 年的经验。他是钦迪加尔大学计算机系学习委员会成员、研究学位委员会成员、基于成果的教育协调员、ABET
    认证协调员、研究协调员以及计算机系项目协调员。他指导过许多篇博士和研究生论文。他是 50 多篇研究论文（被 SCI, ESCI, Scopus 等收录）的作者/合著者，并编写/撰写了
    1 本教科书、6 个书籍章节（IET, Springer 和 Elsevier）、4 项专利以及 SWAYAM MOOC 课程等。此外，他还为许多 SCI
    和 Scopus 索引期刊审阅了稿件。他还是 IEEE, ACM, IAENG, TAEI, CSI, AIS, CSTA 等各种知名研究协会的成员。


    **K. K. Mishra 博士** 目前任教于普拉雅格拉德国立技术学院（MNNIT Allahabad）计算机科学与工程系助理教授。他曾作为会议秘书成功在印度组织了约
    6 场 IEEE 会议（ICCCT 系列），并担任许多其他会议的项目主席。他曾担任印度及海外许多会议的程序委员会成员，并成功在高索引期刊上组织了若干特刊。他是《Journal
    of Supercomputing》(Springer)》、《Applied Intelligence》、《Applied Soft Computing》、《IEEE
    Transaction on Cybernetics》、《IEEE System Journal》、《Neural computing and application》以及
    IETE 期刊的定期审稿人。此外，他还为许多 SCI 和 Scopus 索引期刊审阅了大量稿件。


    **Sandeep Harit 博士** 从 BIET Jhansi 开始接受正规教育，完成 B.Tech 学业后，在 MNNIT Allahabad 获得硕士和博士学位。他目前任教于旁普工程学院计算机科学与工程系教师。他指导了
    30 篇 M.Tech 论文和 2 篇博士论文。在职业生涯 20 年中，他参与了各种学术、行政和研究活动。他在包括 SCI 和 Scopus 以及 IEEE
    索引在内的领先期刊和会议上发表了 40 多篇高质量研究文章，引用良好。


    **Akash Punhani 博士** 目前任教于 SRM 理理工学院 Delhi NCR 校区（莫迪纳加尔，加雅巴德）。他自 2007 年起从事学术工作。他于
    2018 年毕业于索兰希基马普拉尔德邦杰普信息大学，获得关于“提高网格互连网络吞吐量和延迟”的博士学位。在读博士期间，他提出了可以用于芯片的路由算法和拓扑结构，有助于改进片上系统中的通信。他在各大知名期刊和会议上发表了文章。他的研究领域包括片上网络、机器学习和优化算法。他还是许多高影响因子期刊的活跃审稿人。


