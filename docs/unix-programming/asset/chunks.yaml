  trans: '


    UNIX shell 通过预定义的 shell 变量控制会话行为。Shell 变量用于设置用户主目录、提示符符号、邮件等。某些 shell 变量由系统自动设置，而用户可以在启动文件中设置其他
    变量。


    ## Shell 解释周期


    Shell 命令处理通常分五个步骤完成：


    1. Shell 一启动，就会立即在终端上显示提示符符号。

    2. Shell 简单地等待用户输入要执行的命令。

    3. Shell 分析用户输入的命令。

    4. Shell 继续执行用户的请求。如果需要执行特定的程序，shell 将搜索磁盘以找到指定的程序。

    5. 一旦找到程序，shell 请求内核（Kernel）启动程序执行，并进入睡眠状态直到程序执行完成。如果程序从标准输入读取输入，它将在执行期间等待用户在命令行提示符处输入输入。


    程序执行完成后，控制权再次返回 shell 以执行下一个程序/命令。


    ## UNIX shell 的功能


    *图 7.1* 显示了 shell 执行的基本功能。功能的更多细节将在随后的章节中给出。


    ![](img/Figure-7.1.jpg)


    **图 7.1:** shell 的用途


    ## 程序执行


    Shell 启动从用户终端请求的所有程序的执行。要执行的程序以命令行的形式在终端上给出，如下：


    ```

    Program-name list-of-arguments

    ```


    Shell 扫描命令行并识别要执行的程序名称以及传递给执行程序的程序的参数值。


    在第一个空白符之前，shell 将所有内容视为程序名；每个参数也通过空格分隔。如果从程序名和参数之间给出多个空格，shell 将忽略额外的空格。


    **示例：**


    `prog.sh  first_arg second_arg`


    * `prog.sh`: 程序名

    * `first_arg second_arg`: 参数列表


    ## 输入/输出重定向


    Shell 处理命令行上的输入/输出重定向。在程序执行期间，shell 会扫描输入命令中的特殊重定向运算符 `<`, `>` 和 `>>`。


    Shell 具有从文件或向文件重定向输入和输出的能力。


    在程序执行期间，shell 使用特殊重定向运算符 `<`, `>`, 和 `>>` 处理命令的输入/输出重定向。`<` 运算符从右侧给的文件获取命令输入。`>`
    将命令的输出重定向到文件。`>>` 将命令的输出追加到现有文件的末尾。


    `ls -l > file1`


    在前面的示例中，`ls -l` 命令的输出重定向到 `file1`。如果 `file1` 已存在，则其内容会被当前输出替换。正在执行的命令并不关心输出被重定向到了哪里。


    让我们考虑两个完全相同的命令：


    `wc -l file1`


    `output : 10`


    `wc -l < file1`


    `output : 10 file1`


    在第一的情况下，shell 确定执行命令 `wc` 来统计文件 `file1` 的行数；它打开文件 `file1` 并计算行数。


    在第二的情况下，`wc` 的执行方式略有不同。shell 在扫描命令行时确定输入重定向运算符 `<`，`<` 符号后的单词是用于重定向输入的文件名。shell
    执行 `wc` 命令，将其标准输入从文件 `file1` 重定向过来。


    ## 命令管道


    与重定向运算符一样，shell 在扫描命令行时确定 `|` 符号。对于每一个此类符号，shell 将 `|` 之前命令的标准输出传输到 `|` 符号之后的命令。


    让我们考虑以下命令：


    `ls -l | wc -l`


    前面的命令输出当前目录下的文件总数。命令 `ls -l` 列出当前目录下的文件和目录并将结果写入标准输出，而感知不到 `|` 符号；命令的输出随后作为标准输入传输给命令
    `wc -l`，`wc -l` 执行时确定了有数量提供作为输入的文件数量，并计算标准输入上的总行数。


    ## 环境自定义


    Shell 环境包含一组预定义的变量。这些变量被称为环境变量。Shell 保留这些变量以控制和配置实用程序的行为。shell 变量的值通常在程序外部由操作系统或通过微服务设置。在
    UNIX 中，有一组大量的环境变量，包括：


    * 用户主目录的路径：`HOME`

    * shell 命令搜索路径：`PATH`

    * 默认提示符：`PS1`

    * 终端类型：`TERM`

    * UNIX 主机名：`HOSTNAME`


    Shell 提供了自定义环境的命令。


    ## Shell 语言


    Shell 有自己的编程语言来编写 shell 脚本。与 C 等其他功能性编程语言（整个程序被编译并转换为执行代码）不同，shell 编程是解释型的。Shell
    编程涉及使用 shell 命令和编程语言来编写 shell 脚本。shell 脚本是用纯文本编写的一系列命令。Shell 编程构造包括 if-then-else
    结构、循环、case 结构、变量、表达式。


    ## Shell 的类型


    与大多数操作系统一样，UNIX shell 并不是内置的，而是 只是另一个程序。UNIX shell 保护内核以及用户免受相互干扰。系统提供了几种 shell，每种都有不同的特性。不同的
    shell 可以分为两个 shell 家族——Bourne shell 家族和 C shell 家族。


    ### Bourne shell 家族


    Bourne shell 家族由三个 shell 组成：Bourne shell `/bin/sh` 以及 Bourne shell 的两个衍生版本——Korn
    shell `/bin/ksh` 和 Bourne again shell `/bin/bash`。


    #### Bourne shell


    Bourne shell 由 AT&T labs 开发，是最古老的 UNIX shell。它包含在几乎所有的 UNIX 版本中。未增强的 Bourne shell
    版本是 BASH，用于 LINUX。Bourne shell 命令是算法风格编程语言（ALOGOL）风格。


    #### Korn shell


    Korn shell 由 David G Korn 在 AT&T labs 开发。它是 Bourne shell 的超集，并具有更多功能。Korn shell
    将 C shell 的交互功能整合到 Bourne shell 的语法中。Korn shell 为 Bourne shell 增加了以下新功能：


    * 数组

    * 文件名补全

    * 命令别名

    * 函数

    * 命令历史和替换


    另一种变体 shell 是 POSIX，适用于 HP-UX 11.0。在 HP-UX 中 POSIX 安装在 `/bin/sh`，而 Bourne shell
    安装在 `/usr/old/bin/sh`。


    #### BASH (Bourne again) shell


    bash 由自由软件基金会的 Brian Fox 开发。目前由 Chester Ramey 维护。未增强的 Bourne shell 版本是 BASH，用于
    LINUX。Bash 为 Korn shell 增加了以下几个额外功能：


    * 无限制大小的数组。

    * `cd` 命令中的路径修正。

    * 2 到 64 之间任何进制的整数算术。


