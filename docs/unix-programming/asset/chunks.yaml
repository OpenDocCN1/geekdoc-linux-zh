    **`vi set.sh`**


    **`set ONE TWO THREE`**


    **`echo $1`**


    **`echo $2`**


    **`echo $3`**


    Save and execute the script:


    **`$ set.sh`**


    **`Output   ONE     TWO      THREE:`**


    **`l`**


    **`EDITOR= /users/bin`**


    **`HOME=/users/George`**


    **`LOGNAME=Geore`**


    **`PATH= /users/bin`**


    The **`set`** command is also used to reassign the values of positional parameters.
    The positional parameters take values from strings passed on the command line
    at the time of execution of the shell script. The only way to change these values
    is to use set command during execution.


    # [Interactive input](#toc.xhtml_s226a)


    Shell scripts will accept interactive input to set parameters within the script.


    Shell uses the built-in command, read, to read in a line from standard input and
    assign whitespace delimited words to variables. If a number of words are more
    than the number of variables, then excess words are stored in the last variable.


    The exit status of the read command is zero unless an end-of-file condition is
    encountered. If reading is performed from the terminal, the end-of-file is encountered
    when *Ctrl* + *D* is pressed. If reading is performed from the file, the end-of-line
    is encountered when there is no more data in the file.


    Consider the following example:


    **`$ vi add.sh`**


    **`while  read v1 v2`**


    **`do`**


    **`echo $ ((v1 –v2))`**


    **`done`**


    **`When executed:`**


    **`$ add.sh`**


    **`23 13`**


    **`10`**


    **`25 5`**


    **`20`**


    **`Ctrl = d`**


    **`$`**


    Let us take another example:


    **`$ read age name`**


    **`39 Bill George`**


    **`$ echo ‘$age\n $name’`**


    **`39`**


    **`Bill George`**


    We can illustrate this with the simple script:


    **`#!/bin/sh`**


    **`echo “Input a phrase \c” # This is /bin/echo which requires “\c” to prevent
    <newline>`**


    **`read param`**


    **`echo param=$param`**


    When we run this script, it prompts for input and then echoes the results:


    **`$ ./read.sh`**


    **`Input a phrase hello mca01 # I type in hello mca01 <return>`**


    **`param=hello mca01`**


    # [Subshell](#toc.xhtml_s227a)


    As discussed earlier, there are multiple shells in the system corresponding to
    each terminal. Moreover, the shell creates sub shell whenever a shell script is
    executed. A subshell is an entirely new shell for executions of the program. A
    new shell runs with its own shell environment and local variables. A subshell
    does not have knowledge of local variables assigned in its parent shell. A subshell
    cannot change the value of a variable in the parent shell. A subshell can also
    not change the values of the built-in environment variables in the parent shell.


    Following is the example of a local variable in subshell:


    **`vi loc_var.sh`**


    **`echo initialize local variable x in sub shell`**


    **`x=50`**


    **`echo $x`**


    **`$ loc_var.sh     execute loc_var.sh`**


    **`$50     Sub shell terminated`**


    **`$ echo $x`**


    **`$`**


    This will display blank because variable **`x`** is not assigned any value in
    the parent shell.


    Following is the example of a subshell with environment variables:


    **`vi shell_vars.sh`**


    **`echo $PS1`**


    **`PS!=’=>’`**


    Save and execute the file **`shell_var.sh`**:


    **`$ shell_var.sh`**


    **`$ $`**


    **`=>`**


    Now again, display PS1 from the parent shell:


    `$ echo $PS!`


    `$ $`


    That means changes made in the environment variables of subshell are not reflected
    in the parent shell.


    # [Exporting variables](#toc.xhtml_s228a)


    As discussed earlier, a subshell does not have knowledge of local variables assigned
    in the parent shell. If local variables in the parent shell are required to be
    accessed in the subshell, they must be first exported. Exporting variables means
    passing down variables to the subshell.


    Following is the example of local variables in sub shell:


    **`$ x=200`**


    **`$ echo 4x`**


    **`$ 200`**


    **`vi exp_var.sh`**


    **`echo x = $x`**


    Save and execute script **`exp_var`**; the output is **`x`**.


    Since variable **`x`** is not available in the subshell to access, the output
    of the subshell is **`x`**, not **`200`**. To export **`x`** to the subshell and
    to access the value of **`x`** to the subshell, it needs to be exported to the
    subshell.


    Following is the example for exporting local variable:


    **`$ x=200`**


    **`$ export x`**


    **`$ exp_var.sh`**


    **`x=200`**


    This time variable **`x`** is exported to the subshell; therefore, this time,
    the output is **`200`**.


    # [Test operator for comparisons](#toc.xhtml_s229a)


    The built-in shell command test is used to test logical conditions:


    # Test expression


    The expression represents the logical comparison. The test operator can be used
    for numeric comparisons, string comparisons, or file-related comparisons.


    Conditional statements are evaluated for true or false values. This is done with
    the test, or its equivalent, the [] operators. If the condition evaluates to true,
    a zero (TRUE) exit status is set; otherwise, a non-zero (FALSE) exit status is
    set. If there are no arguments, the non-zero exit status is set.


    # Test operator for files: test [option] filename


    Every shell script deals with a file. Due to this reason, test commands provide
    a set of options to test various attributes of the files. We can check whether
    a file exists, whether it is readable, and so on, using the test operator.


    **The options available for the test operator for files include:**


    *   -**`r`**: True if it exists and is readable.


    *   -**`w`**: True if it exists and is writable.


    *   -**`x`**: True if it exists and is executable.


    *   **`-f`**: True if it exists and is a regular file (or for csh, exists and
    is not a directory).


    *   **`-d`**: True if it exists and is a directory.


    *   **`-h`** or **`-L`**: True if it exists and is a symbolic link.


    *   **`-c`**: True if it exists and is a character special file (that is, the
    special device is accessed one character at a time).


    *   **`-b`**: True if it exists and is a block special file (that is, the device
    is accessed in blocks of data).


    *   **`-p`**: True if it exists and is a named pipe (fifo).


    *   **`-u`**: True if it exists and is **`setuid`** (that is, has the set-user-id
    bit set, s or S in the third bit).


    *   **`-g`**: True if it exists and is **`setgid`** (that is, has the set-group-id
    bit set, s or S in the sixth bit).


    *   **`-k`**: True if it exists and the sticky bit is set (a t in bit 9).


    *   **`-s`**: True if it exists and is greater than zero in size.


    There is a test for file descriptors:


    *   **`-t [file_descriptor]`**: True if the open file descriptor (default is **`1`**,
    **`stdin`**) is associated with a terminal.


    All these operators are unary in nature. They take a single argument as the name
    of the file, including the directory.


    Following is an example of the use of a file:


    `#check a file`


    `echo “Enter a filename”`


    `read fname`


    `if  test  –d  $fname`


    `then`


    `echo “$fname is a directory”`


    `else`


    `echo “$fname is a file”`


    `fi`


    **Test for strings:**


    There are tests for strings: we can check if a string has a length of zero or
    compare two strings, as shown in the following table:


    *   **-z string:** True if the string length is zero.


    *   **-n string:** True if the string length is non-zero.


    *   **string1 = string2:** True if string1 is identical to string2.


    *   **string1 != string2:** True if string1 is non identical to string2.


    *   **string:** True if the string is not NULL.


    Following is an example to use string check:


    `#check if string is null`


    `echo “Enter a file name”`


    `read fname`


    `if test –z  $fname`


    `then`


    `echo “Enter a non null filename”`


    `fi`


    It will ask for the filename. If no filename is given, it will print **`Enter
    a non null filename`**.


    **Test for numeric comparisons:**


    A test operator can be used to compare two numbers. There are integer comparisons
    is given as follows:


    *   **n1 -eq n2:** True if integers n1 and n2 are equal.


    *   **n1 -ne n2:** True if integers n1 and n2 are not equal.


    *   **n1 -gt n2:** True if integer n1 is greater than integer n2.'
