    # [Special string operations](#toc.xhtml_s242a)


    We can also find out the length of the string, extract a substring or locate a
    character in a string using the `expr` operator.


    To calculate the string length: use `expr` with “.*”


    ```bash

    $expr “abcdefghijk”  :  ‘.*’

    ```

    ```

    12

    ```


    Prints the length of the string.


    Use the following to extract a substring:


    ```bash

    $expr “abcd” :  ‘..\(..\)’

    ```

    ```

    cd

    ```


    The number of dots corresponds to the number of characters. This means to retrieve
    characters cd in the string `abcd`, we skip the first two characters and then
    extract two characters.


    Next, let us locate a character in a string:


    ```bash

    $expr “abcdefg” :  ‘[^d]*d’

    ```

    ```

    4

    ```


    This command is used to locate the position of character `d` in the string `abcdefg`.
    The `expr` command indicates that skip all characters that are not `d` till it
    reaches the character `d`.


    # [Parameter substitution](#toc.xhtml_s243a)


    You can reference parameters abstractly and substitute values for them based on
    conditional settings using the operators defined following. Again we will use
    the curly braces ({}) to isolate the variable and its operators.


    *   `$parameter`: Substitute the value of the parameter for this string

    *   `${parameter}`: Same as above. The brackets are helpful if there is no separation
    between this parameter and a neighboring string.

    *   `$parameter=`: Sets parameter to null.

    *   `${parameter-default}`: If a parameter is not set, then use default as the
    value here. The parameter is not reset.

    *   `${parameter=default}`: If the parameter is not set, then set it to default
    and use the new value

    *   `${parameter+newval)`: If the parameter is set, then use `newval`; otherwise,
    use nothing here. The parameter is not reset.

    *   `${parameter?message}`: If the parameter is not set, then display the message.
    If the parameter is set, then use its current value.


    There are no spaces in the preceding operators. If a colon (:) is inserted before
    the `-`, `=`, `+`, or `?` then a test if first performed to see if the parameter
    has a non-null setting.


    To illustrate some of these features, we will use the following test script:


    ```bash

    #!/bin/sh

    param0=$0

    test -n “$1” && param1=$1

    test -n “$2” && param2=$2

    test -n “$3” && param3=$3

    echo 0: $param0

    echo “1: ${param1-1}: \c” ;echo $param1

    echo “2: ${param2=2}: \c” ;echo $param2

    echo “3: ${param3+3}: \c” ;echo $param3

    ```


    In the script, we first test to see if the variable exists; if so, we set a parameter
    to its value. As follows, we report the values, allowing substitution.


    In the first run through the script we will not provide any arguments:


    ```bash

    $ ./parameter.sh

    0: ./parameter.sh # always finds $0

    1: 1: # substitute 1, but don’t assign this value

    2: 2: 2 # substitute 2 and assign this value

    3: : # don’t substitute

    ```


    In the second run through the script, we will provide the arguments:


    ```bash

    $ ./parameter one two three

    0: ./parameter.sh # always finds $0

    1: one: one # don’t substitute, it already has a value

    2: two: two # don’t substitute, it already has a value

    3: 3: three # substitute 3, but don’t assign this value

    ```


    # [Functions](#toc.xhtml_s244a)


    The Bourne shell has a function facility too. These are somewhat similar to aliases
    in the C shell but allow more flexibility. The function is reusable code that
    can be later called from UNIX code.


    A function has the form:


    ```bash

    fcn () { command; }

    ```


    Where the space after `{`, and the semicolon (`;`) are both required; the latter
    can be dispensed with if a `<newline>` precedes the `}`. Additional spaces and
    `<newline>`’s are allowed.


    ```bash

    ls() { /bin/ls -sbF “$@”;}

    ll() { ls -al “$@”;}

    ```


    The first one redefines `ls` so that the options `-sbF` are always supplied to
    the standard `/bin/ls` command and acts on the supplied input, `$@`. The second
    one takes the current value for `ls` (the previous function) and tacks on the
    `-al` options. Functions are very useful in shell scripts.


    # [Passing arguments to function](#toc.xhtml_s245a)


    Positional parameters `$1`, `$2`, …, `$*n` are used as arguments to the function.
    White spaced set of strings is used to assign the values to the positional parameters
    during the function call. For example:


    ```bash

    Shell__fun ()

    {

    echo $1

    echo $2

    }

    ```


    # [Returning from function](#toc.xhtml_s246a)


    The Bourne shell has a function facility. The function is reusable code that can
    be later called from UNIX code.


    A function has the form:


    ```bash

    fcn () { command; }

    ```


    Where the space after `{`, and the semicolon (`;`) are both required; the latter
    can be dispensed with if a `<newline>` precedes the `}`. Additional spaces and
    `<newline>`’s are allowed.


    # [Trapping signals](#toc.xhtml_s247a)


    The Bourne shell has a function facility. These are somewhat similar to aliases
    in the C shell but allow more flexibility. The function is reusable code that
    can be later called from UNIX code.


    # [Arrays](#toc.xhtml_s248a)


    Bourne and C shell do not support arrays, but bash and Korn shell support arrays.
    The facility is limited to one dimension and can have a maximum of 1024 elements.

