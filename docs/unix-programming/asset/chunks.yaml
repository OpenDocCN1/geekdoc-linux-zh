    # 目标


    阅读本章后，你将能够：


    * 理解服务器与客户端通信的套字（socket）概念和类型。

    * 理解涉及 socket 通的各种系统调用执行。

    * 理解有助于 socket 通的 I/O 模型。

    * 理解用于名称到地址计算的系统调用。


    # Socket（套字）


    socket 是应用程序进程与传输层之间的接口。socket 是应用程序进程向另一个本地或远程应用程序进程发送/接收消息的媒介。这种通信通常用于服务器进程和客户端进程之间。


    在 UNIX 中，socket 被称为 UNIX 域套字（UNIX domain sockets），因为 socket 只能用于单个主机上进程之间的通信。在
    UNIX 中，socket 由文件描述符定义——这是一个与打开的文件关联的整数。相比之下，Internet 域套字（Internet domain sockets）支持多种通信协议。socket
    可以由内核支持，也可以作为将调用转换为原生网络 API 的库支持。下图展示了 socket 结构图：


    ![](img/Figure-5.1.jpg)


    **图 5.1:** Socket


    # Socket 的类型


    在创建 socket 时，程序需要指定地址域和要创建的 socket 类型，且只有当两个进程通信的 socket 处于同一域且具有相同的 socket 类型时，这两个进程才允许相互通信。


    两种广泛使用的 socket 地址域是 UNIX 域和 Internet 域。在 UNIX 域中，共享公共文件系统的进程可以相互通信；而在 Internet
    域中，进程并不一定在同一个文件系统中；它们可以位于 Internet 上的任何主机并相互通信。这两种域类型都有自己的地址格式。在 UNIX 域中，地址在文件系统中有一个条目，并用字符串表示。在
    Internet 域中，socket 地址由 Internet 上主机的 32 位 IP 地址表示。在 Internet 域中 socket 还需要一个端口号来表示
    16 位无符号整数。


    # Socket 数据结构


    关于 socket 的信息存储在名为 `sockaddr` 的数据结构中。`sockaddr` 结构包含两个元素 `sa_family` 和 `sa_data`。`sa_family`
    元素存储协议地址。


    ```c

    struct sockaddr {

    unsigned short sa_family; //地址族 AF_xxx

    unsigned short sa_data[14]; //14 字节的协议地址

    }

    ```


    # Socket 通信的系统调用


    socket 通信在客户端侧通过以下方式建立：


    * 使用 `socket()` 系统调用创建 socket。

    * 使用 `connect()` 系统调用将新创建的 socket 连接到服务器地址。

    * 使用 `read()` 和 `write()` 系统调用发送接收数据。


    socket 通信在服务器端通过以下方式建立：


    * 使用 `socket()` 系统调用创建 socket。

    * 使用 `bind()` 系统调用将新创建的 socket 绑定到地址。对于 Internet 上的服务器 socket，地址由主机上的端口号组成。

    * 使用 `listen()` 系统调用监听连接。

    * 使用 `accept()` 系统调用接受客户端的连接请求。此调用通常会阻塞，直到客户端连接服务器。

    * 使用 `read()` 和 `write()` 调用发送接收数据。


    [表 5.1] 显示了在 TCP 和 UDP 协议通过 socket 进行服务器与客户端通信的函数 set。


    | 协议类型 | 客户端 | 服务端 |

    | :--- | :--- | :--- |

    | 面向连接 TCP | `socket()` | `socket()` |

    | | `connect()` | `bind()` |

    | | | `listen()` |

    | | | `accept()` |

    | | `send()` | `recv()` |

    | | `recv()` | `send()` |

    | 无连接 UDP | `socket()` | `socket()` |

    | | | `bind()` |

    | | `sendto()` | `recvfrom()` |

    | | `recvfrom()` | `sendto()` |


    **表 5.1:** 不同 socket 相关的系统调用


    # 创建 socket（服务端和客户端）


    `socket()` 系统调用创建 socket 并返回一个用于 socket 的唯一文件描述符。根据输入参数，socket 可以是流式（TCP）socket
    或数据报文（UDP）socket。


    **原型：**


    ```c

    int socket(int domain, int type, int protocol);

    ```


    域参数 `domain` 设置为 `AF_INET` 或 `PF_INET`；`type` 参数指定 socket 的类型，并设置为 `SOCK_STREAM`
    用于 TCP 流（如 telnet、HTTP 等）或设置为 `SOCK_DGRAM` 用于 UDP 数据报文；`protocol` 参数取值 0 可根据类型自动选择正确协议，或取
    `IPPROTO_TCP` 选择 TCP 协议，或取 `IPPROTO_UDP` 选择 UDP 协议。


    # 将 socket 绑定到地址（服务端）


    `bind()` 系统调用用于将 `sockfd` 绑定到本地机器上的端口。服务器需要调用此函数。如果发生错误，返回 -1。


    **原型：**


    ```c

    int bind(int sockfd, struct sockaddr *addr, int addrlen);

    ```


    第一个参数 `sockfd` 是 `socket()` 系统调用的返回值，`addr` 是包含 IP 地址的数据结构中的 `sockaddr`，`addrlen`
    是 `sockaddr` 的大小。


    # 监听传入连接


    `listen()` 系统调用监听传入的连接。对于面向连接（TCP）socket，只需要服务器调用。该函数在发生错误时返回 -1。


    **原型：**


    ```c

    int listen(int sockfd, int backlog);

    ```


    `sockfd` 是 `socket()` 函数的返回值，`backlog` 是传入队列允许的最大连接数。传入连接在被服务器接受之前保留在队列中。


    # 发起连接


    客户端调用 `connect()` 系统调用发起到服务器的连接。用于面向连接（TCP）socket。系统调用在发生错误时返回 -1。


    **原型：**


    ```c

    int connect(int sockfd, struct sockaddr *addr, int addrlen);

    ```


    `sockfd` 是 `socket()` 函数的返回值，`addr` 是包含服务器 IP 地址和端口号的 `sockaddr`，`addrlen` 是 `sockaddr`
    的大小。


    # 从传入队列接受连接


    服务器使用 `accept()` 系统调用接受与 socket `sockfd` 关联的传入队列中的连接。用于面向连接（TCP）socket。系统调用返回一个新的
    socket 文件描述符，用于在该连接上发送接收信息。系统调用发生错误时返回 -1。


    **原型：**


    ```c

    int accept(int sockfd, void *addr, int *addrlen);

    ```


    `sockfd` 是监听连接的 socket 描述符。`addr` 是指向本地 `sockaddr` 的指针，包含接入客户端的 IP 地址和端口号。该数据结构与包含服务器
    IP 地址和端口号的不同；`addrlen` 是数据结构中前一个 `sockaddr` 的大小。


    # 通过 socket 发送数据（面向连接）


