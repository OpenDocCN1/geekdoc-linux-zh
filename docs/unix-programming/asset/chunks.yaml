- fmt: "\nNormally, a program executes under the privileges of the normal user. But\
    \ there are situations where normal users require special privileges in order\
    \ to perform some special tasks such as changing passwords. A hashed representation\
    \ of each user’s password is stored in a `/etc/passwd` file, which has write permission\
    \ to superusers only. When a normal user wants to change his or her password,\
    \ this file must be updated. But a normal user does not have write and save permissions\
    \ for this file. So the program that changes the password must be running on behalf\
    \ of the normal user but with the privileges of the superuser. For such situations,\
    \ a special bit (set-user-ID or `SUID`) is set on the file permissions. When this\
    \ bit is set, the program it is applied to does run with the privileges of the\
    \ file owner. Doing a long file listing, this bit will show up as “s” instead\
    \ of an “x” in the owner permissions. A lowercase s means both the SUID bit and\
    \ the execute bit are set. An uppercase `S` represents a SUID bit without the\
    \ execute bit.\n\nThe SUID bit can also be set on directories. When set on a directory,\
    \ all the files and directories created within this directory will have the same\
    \ owner as of the SUID directory itself, no matter who has created these files.\n\
    \n# Set-group ID\n\nIf the user executes a program with this bit set. He/she inherits\
    \ the file access permission assigned to the group of the owner of the program.\
    \ The SGID bit is represented with a lowercase or uppercase “s” in place of “x”\
    \ for the group execute permission bit. This bit is generally set for utilities,\
    \ such as mail utility, print utility, and so on. If the SGID bit is set for a\
    \ directory, then all subdirectories and files created in it also inherit the\
    \ group permission.\n\nWhen the program is executing with this bit set, the user\
    \ will automatically inherit the privileges of the group owning the program. Just\
    \ like the SUID bit, the SGID bit is represented with a lowercase or uppercase\
    \ “s” in place of “x” for the group execute bit. This usually is used for various\
    \ utilities of some subsystems, such as the mail subsystem or the printing subsystem,\
    \ and so on. An SGID bit on a directory means that all files and subdirectories\
    \ created in the directory inherit the group of the directory.\n\n## Sticky-bit\
    \ permission\n\nThe sticky bit is primarily used on public directories. It is\
    \ useful for shared directories such as `/var/tmp` and `/tmp`. All the users should\
    \ be able to create files, read, and execute files of other users in these temporary\
    \ directories. If the sticky bit is applied to a directory, a file in that directory\
    \ can only be deleted or renamed if the user has to write permission to the directory\
    \ itself, and in addition to this, he is either the owner of the file, the owner\
    \ of the directory itself or the superuser (root). Users are not allowed to remove\
    \ files owned by other users. So the sticky bit makes files stick to the owner\
    \ and prevents users to delete and rename other users’ files in publicly writable\
    \ directories.\n\n## User and group IDs of new files\n\nThe user ID of a new file\
    \ is set to the effective user ID of the process of creating the file. The group\
    \ ID of a new file is either:\n\n*   The effective group ID of the process of\
    \ creating the file.\n*   The group ID of the directory in which the file is created.\n\
    \n## Effective user and group IDs\n\nFor most processes, Effective User ID (`EUID`)\
    \ is the same as User ID (`UID`), and Effective Group ID (`EGID`) is the same\
    \ as Group ID (`GID`). When the executable file that contains the image that is\
    \ executed by the process has the Set-UID or Set-GID bit set, then the process\
    \ `EUID/EGID` is set to the `UID/GID` of the executable file, not of the user\
    \ executing the process! This is UNIX’s mechanism to grant users well-defined\
    \ and limited access to a resource that would otherwise be inaccessible. For example,\
    \ changing the password requires writing to `/etc/passwd`. Ordinary users, of\
    \ course, do not have write access to this file. But the Set-UID root program\
    \ `/bin/passwd` provides a well-defined gateway.\n\n## File Access Permission\
    \ Mask\n\nThe `st_mode` member of `stat` structure contains file permissions:\n\
    \n```\nst_mode mask – owner, group, other\n```\n\n```\n#define S_IRWXU 00700 /*\
    \ read, write, execute: owner */\n#define S_IRUSR 00400 /* read permission: owner\
    \ */\n#define S_IWUSR 00200 /* write permission: owner */\n#define S_IXUSR 00100\
    \ /* execute permission: owner */\n#define S_IRWXG 00070 /* read, write, execute:\
    \ group */\n#define S_IRGRP 00040 /* read permission: group */\n#define S_IWGRP\
    \ 00020 /* write permission: group */\n#define S_IXGRP 00010 /* execute permission:\
    \ group */\n#define S_IRWXO 00007 /* read, write, execute: other */\n#define S_IROTH\
    \ 00004 /* read permission: other */\n#define S_IWOTH 00002 /* write permission:\
    \ other */\n#define S_IXOTH 00001 /* execute permission: other */\n```\n\n## User\
    \ file creation mode—umask() call\n\nThe UNIX uses a four-digit octal number `umask`\
    \ to determine the file permission for newly created files. Every process has\
    \ its own `umask`, inherited from its parent process.\n\nThe `umask()` sets the\
    \ process’s file creation mask and returns the previous value of the mask. The\
    \ low-order 9 bits of mask are used whenever a file is created. To set default\
    \ access permission for regular file\n\nUNIX Kernel sets the default permission\
    \ 666 for a regular file at the time of the creation and 777 for a directory.\
    \ When the file or a directory is created using `open()`, `mkdir()`, and other\
    \ system calls, the UNIX kernel subtracts the set umask value from the default\
    \ access permission to set the resulting access permission for a file or directory.\n\
    \n### Example\n\nLet the set umask value is `044`. To assign access permission\
    \ to a regular file that has default access permission 666, the Kernel subtracts\
    \ 044 from 666 (`666-044`) and sets 622 as the resulting access permission.\n\n\
    Clearing corresponding bits in the file access permissions restricts the default\
    \ access to a file.\n\n### Prototype\n\n```\nMode_t umask(mode_t cmask)\n```\n\
    \nThe `cmask` argument is formed as bitwise OR of any of the nine constants.\n\
    \n### Example\n\n```c\n#include <sys/types.h>\n#include <sys/stat.h>\n#include\
    \ <stdio.h>\n\nint main() {\n    int fd;\n    int old_mask;\n    old_mask = umask(0);\n\
    \    fd = open(\"f1\", O_WRONLY | O_CREAT | O_TRUNC, 666);\n    close(fd);\n \
    \   printf(\"created f1: 666\\n\");\n\n    fd = open(\"f2\", O_WRONLY | O_CREAT\
    \ | O_TRUNC, 200);\n    close(fd);\n    printf(\"created f2: 200\\n\");\n\n  \
    \  umask(22);\n    fd = open(\"f4\", O_WRONLY | O_CREAT | O_TRUNC, 777);\n   \
    \ close(fd);\n    printf(\"created f4: %o\\n\", 777 & ~22);\n\n    fd = open(\"\
    f5\", O_WRONLY | O_CREAT | O_TRUNC, 200);\n    close(fd);\n    printf(\"created\
    \ f5: %o\\n\", 200 & ~22);\n    return 0;\n}\n```\n\nIn the given example, umask\
    \ is set to 0, so all files created take access permission given in `open()` function.\
    \ The umask is set to 22. To set final access permission, the umask will be subtracted\
    \ from the access permission in the open() function.\n\n# The access () function\n\
    \nThe `access()` system call checks the accessibility of the file named by the\
    \ pathname argument for the access permissions indicated by the mode argument.\
    \ The value of mode is either the bitwise inclusive OR of the access permissions\
    \ to be checked (`R_OK` for read permission, `W_OK` for write permission, and\
    \ `X_OK` for execute/search permission) or the existence test (`F_OK`).\n\n**Prototype**\n\
    \n```\nint access (const char *pathname, int mode);\n```\n\nUpon successful completion,\
    \ the `access()` returns value `0`; otherwise, it returns value `-1`, and the\
    \ global variable `errno` is set to indicate the error.\n\n# Changing owner and\
    \ changing mode\n\nChanging the owner and mode of a file are operations on the\
    \ i-node. The process owner executing system calls to change owner or mode must\
    \ be either superuser or owner of the file.\n\n**Prototype**\n\n```\nint chmod(const\
    \ char *pathname, mode_t mode);\nint fchmod(int fd, mode_t mode);\n```\n"
  raw: 'Normally, a program executes under the privileges of the normal user. But
    there are situations where normal users require special privileges in order to
    perform some special tasks such as changing passwords. A hashed representation
    of each user’s password is stored in a /etc/passwd file, which has write permission
    to superusers only. When a normal user wants to change his or her password, this
    file must be updated. But a normal user does not have write and save permissions
    for this file. So the program that changes the password must be running on behalf
    of the normal user but with the privileges of the superuser. For such situations,
    a special bit (set-user-ID or SUID) is set on the file permissions. When this
    bit is set, the program it is applied to does run with the privileges of the file
    owner. Doing a long file listing, this bit will show up as “s” instead of an “x”
    in the owner permissions. A lowercase s means both the SUID bit and the execute
    bit are set. An uppercase *S* represents a SUID bit without the execute bit.


    The SUID bit can also be set on directories. When set on a directory, all the
    files and directories created within this directory will have the same owner as
    of the SUID directory itself, no matter who has created these files.


    # Set-group ID


    If the user executes a program with this bit set. He/she inherits the file access
    permission assigned to the group of the owner of the program. The SGID bit is
    represented with a lowercase or uppercase “s” in place of “x” for the group execute
    permission bit. This bit is generally set for utilities, such as mail utility,
    print utility, and so on. If the SGID bit is set for a directory, then all subdirectories
    and files created in it also inherit the group permission.


    When the program is executing with this bit set, the user will automatically inherit
    the privileges of the group owning the program. Just like the SUID bit, the SGID
    bit is represented with a lowercase or uppercase “s” in place of “x” for the group
    execute bit. This usually is used for various utilities of some subsystems, such
    as the mail subsystem or the printing subsystem, and so on. An SGID bit on a directory
    means that all files and subdirectories created in the directory inherit the group
    of the directory.


    # Sticky-bit permission


    The sticky bit is primarily used on public directories. It is useful for shared
    directories such as **`/var/tmp`** and **`/tmp`**. All the users should be able
    to create files, read, and execute files of other users in these temporary directories.
    If the sticky bit is applied to a directory, a file in that directory can only
    be deleted or renamed if the user has to write permission to the directory itself,
    and in addition to this, he is either the owner of the file, the owner of the
    directory itself or the superuser (root). Users are not allowed to remove files
    owned by other users. So the sticky bit makes files stick to the owner and prevents
    users to delete and rename other users’ files in publicly writable directories.


    # User and group IDs of new files


    The user ID of a new file is set to the effective user ID of the process of creating
    the file. The group ID of a new file is either:


    *   The effective group ID of the process of creating the file.


    *   The group ID of the directory in which the file is created.


    # Effective user and group IDs


    For most processes, Effective User ID (EUID) is the same as User ID (UID), and
    Effective Group ID (EGID) is the same as Group ID (GID). When the executable file
    that contains the image that is executed by the process has the Set-UID or Set-GID
    bit set, then the process’ EUID/EGID is set to the UID/GID of the executable file,
    not of the user executing the process! This is UNIX’s mechanism to grant users
    well-defined and limited access to a resource that would otherwise be inaccessible.
    For example, changing the password requires writing to **`/etc/passwd`**. Ordinary
    users, of course, do not have write access to this file. But the Set-UID root
    program /bin/passwd provides a well-defined gateway.


    # File Access Permission Mask


    The **`st_mode`** member of stat structure contains file permissions:


    `st_mode mask – owner, group, other`


    `#define S_IRWXU 00700 /* read, write, execute: owner */`


    `#define S_IRUSR 00400 /* read permission: owner */`


    `#define S_IWUSR 00200 /* write permission: owner */`


    `#define S_IXUSR 00100 /* execute permission: owner */`


    `#define S_IRWXG 00070 /* read, write, execute: group */`


    `#define S_IRGRP 00040 /* read permission: group */`


    `#define S_IWGRP 00020 /* write permission: group */`


    `#define S_IXGRP 00010 /* execute permission: group */`


    `#define S_IRWXO 00007 /* read, write, execute: other */`


    `#define S_IROTH 00004 /* read permission: other */`


    `#define S_IWOTH 00002 /* write permission: other */`


    `#define S_IXOTH 00001 /* execute permission: other */`


    # User file creation mode—umask() call


    The UNIX uses a four-digit octal number **`umask`** to determine the file permission
    for newly created files. Every process has its own **`umask`**, inherited from
    its parent process.


    The **`umask()`** sets the process’s file creation mask and returns the previous
    value of the mask. The low-order 9 bits of mask are used whenever a file is created.
    To set default access permission for regular file


    UNIX Kernel sets the default permission 666 for a regular file at the time of
    the creation and 777 for a directory. When the file or a directory is created
    using **`open()`**, **`mkdir()`**, and other system calls, the UNIX kernel subtracts
    the set umask value from the default access permission to set the resulting access
    permission for a file or directory.


    **Example**


    Let the set umask value is 044\. To assign access permission to a regular file
    that has default access permission 666, the Kernel subtracts 044 from 666 (666-044)
    and sets 622 as the resulting access permission.


    Clearing corresponding bits in the file access permissions restricts the default
    access to a file.


    **Prototype**


    `Mode_t umask(mode_t cmask)`


    The **`cmask`** argument is formed as bitwise OR of any of the nine constants
    from **`st_mode`** mask.


    **Example**


    `#include <sys/types.h>`


    `#include <sys/stat.h>`


    `main()`


    `{`


    `int fd;`


    `int old_mask;`


    `old_mask = umask(0);`


    `fd = open(“f1”, O_WRONLY | O_CREAT | O_TRUNC, 0666);`


    `close(i);`


    `printf(“created f1: 0666\n”);`


    `fd= open(“f2”, O_WRONLY | O_CREAT | O_TRUNC, 0200);`


    `close(i);`


    `printf(“created f2: 0200\n”);`


    `umask(022);`


    `fd = open(“f4”, O_WRONLY | O_CREAT | O_TRUNC, 0777);`


    `close(i);`


    `printf(“created f4: %o\n”, 0777 & ~022 & 0777);`


    `fd = open(“f5”, O_WRONLY | O_CREAT | O_TRUNC, 0200);`


    `close(i);`


    `printf(“created f5: %o\n”, 0200 & ~022 & 0777);`


    `}`


    In the given example, umask is set to 0, so all files created will take access
    permission given in **`open()`** function. The umask is set to 022. To set final
    access permission, the umask will be subtracted from the access permission in
    the open() function.


    # The access () function


    The **`access()`** system call checks the accessibility of the file named by the
    pathname argument for the access permissions indicated by the mode argument. The
    value of mode is either the bitwise- inclusive OR of the access permissions to
    be checked (**`R_OK`** for read permission, **`W_OK`** for write permission, and
    **`X_OK`** for execute/search permission) or the existence test (**`F_OK`**).


    **Prototype**


    `int access (const char *pathname, int mode);`


    Upon successful completion, the **`access()`** returns value **`0`**; otherwise,
    it returns value **`-1`**, and the global variable **`errno`** is set to indicate
    the error.


    # Changing owner and changing mode


    Changing the owner and mode of a file are operations on the i-node. The process
    owner executing system calls to change owner or mode must be either superuser
    or owner of the file.


    **Prototype**


    `int chmod(const char *pathname, mode_t mode);`


    `int fchmod(int fd, mode_t mode);`'
