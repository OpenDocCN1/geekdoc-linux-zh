  trans: "\n\n## 2. 内核 (Kernel)\n3. Shell\n4. CPU\n\n5. **在父进程退出之前终止的进程称为。**\n1. 僵进程\
    \ (Zombie)\n2. 孤儿进程 (Orphan)\n3. 子进程\n4. 本题选项都不是\n\n6. **上下文切换意味着**\n1. 内核从执行一个进程切换到另一个进程\n\
    2. 进程从内核态切换到用户态\n3. 进程从用户态切换到内核态\n4. 本题其余选项都不是\n\n# 答案\n\n1. **e**\n2. **a**\n\
    3. **b-c-e**\n4. **c**\n5. **b**\n6. **a**\n\n# 复习题\n\n1. 如果文件创建掩码设置为 777 会发生什么？\n\
    2. UNIX 对目录树的深度是否有基本限制？\n3. 结合解释绝对路径和相对路径。\n4. 多程序、多用户和多任务意味着什么？\n5. 请用整洁的图解释\
    \ Unix 内核与 shell 之间的关系。\n6. 解释通配符 `*` 和 `?`。\n7. 密码存储在何处？\n8. 解释标准的 UNIX 文件层次结构。\n\
    9. UID 和 GID 代表什么？\n\n# 第 2 章\n\n## 文件管理\n\n文件是记录在次级存储上的相关信息的集合。或者说文件是逻辑相关实体的集合。从用户的角度来看，文件是次级存储的最小单元，用于向计算机程序提供输入和接收输出。在存储中，媒体文件只是位、字节或记录的序列，其逻辑含义由文件所有者定义。\n\
    \n在数据存储中管理文件的结构和逻辑规则被称为文件系统。为了理解文件系统的内部操作，需要了解文件和目录如何外部呈现给用户，以及它们在系统内部如何表示。存储介质可能在不同的分区上存在许多文件系统。本章将讨论\
    \ UNIX 文件系统的结构以及用于操作文件的文件系统相关系统调用。\n\n## 结构\n\n本章将涵盖以下主题：\n\n* 用于 I/O 的系统调用和库函数\n\
    * 用于处理所有已打开文件的内核数据结构\n* 文件访问权限\n* 用于用户密码和老化信息的标准文件\n* UNIX 文件系统的结构和操作\n\n## 目标\n\
    \n学习完本章后，你将能够：\n\n* 了解 UNIX 操作系统如何在次级存储中组织文件\n* 理解文件相关的活动，如命名、检索和共享\n* 学习 UNIX\
    \ 操作系统如何实现文件保护策略\n\n## 文件输入/输出\n\n文件输入/输出 (I/O) 是任何操作系统的重要功能，文件输入是为了向执行的进程提供信息以处理现有信息。文件输出是为了通过\
    \ UNIX 进程永久存储首次创建的信息或更新后的信息。UNIX 维护了一些内核数据结构来管理文件 I/O。这些数据结构存储了访问和更新系统中所有已打开文件所需的元数据。UNIX\
    \ FILE I/O 使用 C 标准库函数或 UNIX 系统调用执行。在本节中，我们将讨论执行 UNIX FILE I/O 的各种系统调用。\n\n## 用于文件输入/输出的内核数据结构\n\
    \n以下三个数据结构用于管理 UNIX 文件系统中的已打开文件：\n\n* **内核文件表 (Kernel file table)：** 文件表包含任何进程打开的每个文件的条目。它是一个全局数据结构，用于跟踪读写期间的字节偏移量；该文件中的每个条目都包含指示读/写访问、阻塞/非阻塞等标志位，且每个条目包含一个指向该文件\
    \ v-node 表条目的指针。内核文件表包含一个引用计数，显示文件被打开的次数。\n* **进程级文件描述符表 (Per-process file descriptor\
    \ table)：** 它监控一个进程的所有已打开文件。每个条目都包含一个指向内核文件表的指针。在读、写和其他系统调用中使用的文件描述符是该表中的索引。文件描述符是一个无符号正整数，负值预留用于表示“无值”或错误情况。值\
    \ 0、1 和 2 分别预留给“标准输入”、“标准输出”和“标准错误”。\n* **内存表 (The in-core table)：** 内存表持有每个打开文件\
    \ i-node 的内存中副本。\n\n![](img/Figure-2.1.jpg)\n\n**图 2.1:** 文件的内核数据结构\n\n每当在任何进程中打开一个文件时，文件表中就会创建一个相应的条目，文件的\
    \ i-node 表条目被复制到 v-node 表，并在进程级文件描述符表中创建一个条目。当进程关闭文件时，内核会删除该条目（该条目从进程级文件表中引用该文件），并减少内核文件表中的引用计数。如果引用计数变为零，内核文件表条目将被删除，文件被关闭。\n\
    \n当进程被 fork 时，会创建其父进程进程级文件表的副本。父进程和子进程共享同一个文件指针。\n\n另一方面，同一个文件可以被同一个进程或不同进程多次打开。在这种情况下，每次打开都会在全局文件表中产生不同的条目。这些条目中的每一个都有自己的当前指针。关闭其中一个对其他的没有影响。\n\
    \n## UNIX 文件 I/O 的系统调用\n\nUNIX 提供了基本文件 I/O 的系统调用，例如打开、创建、关闭以及读/写操作。\n\n内核通过文件描述符引用所有已打开的文件。文件描述符是分配给操作系统所有已打开文件的唯一整数。当打开一个现有文件时，或创建一个新文件时，内核会向进程返回一个文件描述符。该文件描述符进一步用于读、写等文件操作。\n\
    \n### open 函数\n\n`open()` 用于读写方式打开现有文件。如果文件不存在，它还会创建一个新文件用于后续的文件操作。\n\n**原型：**\n\
    \n`open` 函数的语法如下：\n\n`int open (char*pathname, int oflag, int mode);`\n\n如果文件打开成功，`open`\
    \ 函数返回该文件的文件描述符。（如果失败，返回值为 1。）所有其他系统调用使用文件描述符（而不是名称）来引用文件。\n\n第一个参数是要打开的文件名。`oflag`\
    \ 包含以下位标志，用于指示打开文件的方式：\n\n* `O_RDONLY`:仅读打开。\n* `O_WRONLY`:仅写打开。\n* `O_RDWR`:读写打开。\n\
    * `O_APPEND`:追加模式打开（将指针初始化到文件末尾而不是开头）。\n* `O_CREAT`:如果文件不存在则创建它。\n* `O_TRUNC`:如果文件存在且以写或读写方式打开，则将其长度截断为\
    \ 0。\n\n第三个参数仅在创建文件时使用。它用于设置新文件的权限位。\n\n**示例**\n\n```c\n#include <stdio.h>\n#include\
    \ <sys/types.h>\n#include <sys/stat.h>\nStatic char msg = \"greeting message\"\
    ;\nint main()\n{\n    int fd;\n    char buffer[80];\n    fd = open(\"dfile.dat\"\
    , O_RDWR | O_CREAT | O_EXCL | S_IREAD S_IWRITE);\n    if (fd != -1)\n    {\n \
    \   printf(\"datafile opened\\n\");\n    write(fd,msg,sizeof(msg))\n    close(fd);\n\
    \    }\n    else\n    printf(\"data file already exists\");\n    exit(0);\n}\n\
    ```\n\n"
- fmt: "\nIn the given example, a file is created to write a greeting message. If\
    \ the file already exists, a message or data file that already exists will be\
    \ printed.\n\n# The `close` function\n\nThe process closes a file when it is no\
    \ longer required. Closeting file releases all locks on the file that the process\
    \ may have. Kernel decreases the reference count of the file in the file table.\
    \ If the reference count reaches to 0, then Kernel frees the file table entry\
    \ and releases the in-core memory allocated at the time of opening the file.\n\
    \nWhen a process terminates, the Kernel automatically terminates all the opened\
    \ files in that process.\n\n### Prototype\n\nThe syntax for `close` function is\
    \ as follows:\n\n```\nint close(int fd);\n```\n\nWhere `fd` is the file descriptor\
    \ for the file. It returns `0` on success and `-1` on error.\n\n# The `creat`\
    \ function\n\nThe `creat()` system call creates a new empty file in the file system.\
    \ It creates a file table entry. If a file with the same name already exists,\
    \ Kernel releases all the data blocks and sets file size equal to 0 subject to\
    \ the suitable access permission. Kernel assigns a new I-node to a newly created\
    \ file and creates an entry in the parent directory.\n\n### Prototype\n\n```\n\
    int creat(char*pathname, int mode);\n```\n\n### Equivalent to:\n\n```\nopen(pathname,\
    \ O_RDWR | O_CREAT | O_TRUNC, mode);\n```\n\nThe `creat` function opens the newly\
    \ created file in write mode only. It sets and returns the first unused file descriptor.\
    \ On failure, it returns -1.\n\n### Example\n\n```\n#include <stdio.h>\n#include\
    \ <sys/types.h>\n#include <sys/stat.h>\n\nint main()\n{\n    int fd;\n    fd =\
    \ creat(“datafile.dat”, S_IREAD | S_IWRITE);\n    if(fd != -1)\n    {\n      \
    \  printf(“datafile.dat opened for read/write access\\n”);\n    }\n    else\n\
    \    printf(“Error in opening datafile.dat\\n”);\n    close(fd);\n    exit(0);\n\
    }\n```\n\nIn the given example, a file is created for reading and writing access\
    \ both. The newly created file is always opened in WRITE mode. If the error occurs,\
    \ the program prints the message `Error in opening datafile.dat`.\n\n# The `read`\
    \ function\n\nRead system call is used to read data from an opened file. If the\
    \ read is successful, the number of bytes read is written. If the end of the file\
    \ is encountered, 0 is written. To begin reading from a file, Kernel sets various\
    \ I/O parameters such as I/O mode, a flag to indicate that the I/O will go to\
    \ user address space, a count field to indicate the number of bytes to read, the\
    \ target address of the user data buffer, and offset field to indicate the byte\
    \ offset into the file where the I/O should begin.\n\n### Prototype\n\n```\nssize_t\
    \ read(int fd, void *buff, size_t nbytes);\n```\n\n### Example\n\n```\n#include\
    \ <cntl.h>             /* defines options flags */\n#include <sys/types.h>   \
    \      /* defines types used by sys/stat.h */\n#include <sys/stat.h>         \
    \  /* defines S_IREAD & S_IWRITE */\nstatic char message[] = “File programming\
    \ in C”;\nint main()\n{\n    int fd;\n    char buffer[80];\n    fd = open(“datafile.dat”,O_RDWR\
    \ | O_CREAT | O_EXCL, S_IREAD | S_IWRITE);\n    if (fd != -1)\n    {\n       \
    \ printf(“datafile.dat opened for read/write access\\n”);\n        write(fd, message,\
    \ sizeof(message));\n        lseek(fd, 0L, 0);    /* go back to the beginning\
    \ of the file */\n        if (read(fd, buffer, sizeof(message)) == sizeof(message))\n\
    \        printf(“ Contents of the datafile are %s\\n”, buffer);\n        else\n\
    \        printf(“Error in reading datafile\\n”);\n        close (fd);\n    }\n\
    else\n    printf(“\\n File already exists\\n”);\n    exit(0);\n}\n```\n\nIn the\
    \ given example, it first creates a file both for reading and writing. If the\
    \ file is already existing with the same name, it prints a message `File already\
    \ exists`. Once the file is created, the message `File programming in C` is written\
    \ into it. In the next step, the file pointer is set to the beginning of the file,\
    \ and the read operation is performed. It checks if the contents read are the\
    \ same as the message; it prints the message; otherwise, an error message is printed.\n\
    \n# The `write` function\n\nThe `write` function writes data from the buffer to\
    \ the file. The number of bytes to be written is given as the third argument to\
    \ the system call. On success number of bytes written is returned. On error -1\
    \ is written.\n\nIf the value of the `write` function is less than the number\
    \ of bytes requested, the function should be called again until all the data is\
    \ written.\n\n### Prototype\n\n```\nint write(int fd, void *buf, int count);\n\
    ```\n\nWhere:\n*   `fd`: file descriptor\n*   `buf`: buffer to write\n*   `count`:\
    \ number of bytes\n\n# The `lseek` function\n\nThe `lseek` function sets the file\
    \ pointer. It allows you to move the pointer to a specific location in the file\
    \ for reading or writing.\n\n### Prototype\n\n```\noff_t lseek(int fd, off_t offset,\
    \ int whence);\n```\n\nWhere:\n*   `fd`: file descriptor\n*   `offset`: number\
    \ of bytes to move\n*   `whence`: reference point for the offset (`SEEK_SET`,\
    \ `SEEK_CUR`, `SEEK_END`)\n\n### Example\n\n```\n#include <stdio.h>\n#include\
    \ <fcntl.h>\n\nint main()\n{\n    int fd;\n    long position;\n    fd = open(\"\
    datafile.dat\", O_RDONLY);\n    if (fd != -1)\n    {\n        position = lseek(fd,\
    \ 0, SEEK_SET);\n        if (position != -1)\n            printf(\"The file position\
    \ is %ld\\n\", position);\n        else\n            perror(\"lseek error\");\n\
    \        close(fd);\n    }\n    else\n        perror(\"open error\");\n    return\
    \ 0;\n}\n```\n\n# The `link` function\n\nThe `link()` system call creates a hard\
    \ link to an existing file. This creates a new directory entry pointing to the\
    \ same inode.\n\n### Prototype\n\n```\nint link(const char *oldpath, const char\
    \ *newpath);\n```\n\nWhere:\n*   `oldpath`: name of the existing file\n*   `newpath`:\
    \ name of the new link\n\n# The `unlink` system call\n\nThe `unlink` system call\
    \ removes a hard link and corresponding directory entry and decreases the link\
    \ count of the file. If the link count reaches 0, the contents of the file are\
    \ also deleted. If the file is opened by any process, the contents of the file\
    \ are not deleted till it is closed. When the process closes the file, the Kernel\
    \ removes the contents of the file.\n\n### Prototype\n\n```\nint unlink(const\
    \ char *pathname);\n```\n\nWhere `pathname` is the name of the linked file which\
    \ is to be removed.\n"
  raw: 'In the given example, a file is created to write a greeting message. If the
    file already exists, a message or data file that already exists will be printed.


    # The close function


    The process closes a file when it is no longer required. Closeting file releases
    all locks on the file that the process may have. Kernel decreases the reference
    count of the file in the file table. If the reference count reaches to 0, then
    Kernel frees the file table entry and releases the in-core memory allocated at
    the time of opening the file.


    When a process terminates, the Kernel automatically terminates all the opened
    files in that process.


    **Prototype:**


    The syntax for **`close`** function is as follows:


    `int close(int fd);`


    Where **`fd`** is the file descriptor for the file. It returns **`0`** on success
    and **`–1`** on error.


    # The creat function


    The **`creat()`** system call creates a new empty file in the file system. It
    creates a file table entry. If a file with the same name already exists, Kernel
    releases all the data blocks and sets file size equal to 0 subject to the suitable
    access permission. Kernel assigns a new I-node to a newly created file and creates
    an entry in the parent directory.


    **Prototype**


    `int creat(char*pathname, int mode);`


    **Equivalent to:**


    `open(pathname, O_RDWR | O_CREAT | O_TRUNC, mode);`


    The **`creat`** function opens the newly created file in write mode only. It sets
    and returns the first unused file descriptor. On failure, it returns **`-1`**.


    **Example:**


    `#include <stdio.h>`


    `#include <sys/types.h>`


    `#include <sys/stat.h>`


    `int main()`


    `{`


    `int fd;`


    `fd = creat(“datafile.dat”, S_IREAD | S_IWRITE);`


    `if(fd != -1)`


    `{`


    `printf(“datafile.dat opened for read/write access\n”);`


    `}`


    `else`


    `printf(“Error in opening datafile.dat\n”);`


    `close(fd);`


    `exit(0);`


    `}`


    In the given example, a file is created for reading and writing access both. The
    newly created file is always opened in WRITE mode. If the error occurs, the program
    prints the message **`Error in opening datafile.dat`**.


    # The read function


    Read system call is used to read data from an opened file. If the read is successful,
    the number of bytes read is written. If the end of the file is encountered, 0
    is written. To begin reading from a file, Kernel sets various I/O parameters such
    as I/O mode, a flag to indicate that the I/O will go to user address space, a
    count field to indicate the number of bytes to read, the target address of the
    user data buffer, and offset field to indicate the byte offset into the file where
    the I/O should begin.


    **Prototype**


    **`ssize_t read(int fd, void *buff, size_t nbytes);`**


    **Example**


    `#include <cntl.h>                /* defines options flags */`


    `#include <;sys/types.h>      /* defines types used by sys/stat.h */`


    `#include <sys/stat.h>          /* defines S_IREAD &amp; S_IWRITE */`


    `static char message[] = “File programming in C”;`


    `int main()`


    `{`


    `int fd;`


    `char buffer[80];`


    `fd = open(“datafile.dat”,O_RDWR | O_CREAT | O_EXCL, S_IREAD | S_IWRITE);`


    `if (fd != -1)`


    `{`


    `printf(“datafile.dat opened for read/write access\n”);`


    `write(fd, message, sizeof(message));`


    `lseek(fd, 0L, 0);     /* go back to the beginning of the file */`


    `if (read(fd, buffer, sizeof(message)) == sizeof(message))`


    `printf(“ Contents of the datafile are %s\n”, buffer);`


    `else`


    `printf(“Error in reading datafile\n”);`


    `close (fd);`


    `}`


    `else`


    `printf(“\n File already exists\n”);`


    `exit(0);`


    `}`


    In the given example, it first creates a file both for reading and writing. If
    the file is already existing with the same name, it prints a message **`File already
    exists`**. Once the file is created, the message **`File programming in C`** is
    written into it. In the next step, the file pointer is set to the beginning of
    the file, and the read operation is performed. It checks if the contents read
    are the same as the message; it prints the message; otherwise, an error message
    is printed.


    # The write function


    The **`write`** function writes data from the buffer to the file. The number of
    bytes to be written is given as the third argument to the system call. On success
    number of bytes written is returned. On error **`-1`** is written.


    If the value of the third argument is zero and the file descriptor refers to a
    regular file, 0 may be returned, or an error could be detected. For a special
    file, the results are not portable.


    **Prototype:**


    `int write(int fd, void*buffer, int nbytes);`


    **Where:**


    *   First argument: **`fd`** represents file descriptor.


    *   Second argument: Temporary buffer contains data to write on the file.


    *   Third argument: Size of data in bytes.


    # The lseek function


    The **`lseek()`** function sets the current position of the file pointer. If successful,
    **`lseek`** returns the new position; else, it returns **`-1`**.


    **Prototype**


    `int lseek(int fd, int offset, int whence);`


    Where **`fd`** is the file descriptor of the file in which the file pointer will
    be set; offset is the number of bytes by which the pointer will be adjusted; hence,
    maybe one of the following:


    *   **`SEEK_SET`** offset is from the beginning of the file.


    *   **`SEEK_CUR`** offset is from the current position.


    *   **`SEEK_END`** offset if from the end of the file.


    *   Whence maybe **`0`**, **`1`**, or **`2`**, respectively, for **`SEEK_SET`**,
    **`SEEK_CUR`**, and **`SEEK_END`**.


    **Example**


    `#include <stdio.h>`


    `#include <fcntl.h>`


    `int main()`


    `{`


    `int fd;`


    `long position;`


    `fd = open(“datafile.dat”, O_RDONLY);`


    `if ( fd != -1)`


    `{`


    `position = lseek(fd, 0L, 2);  /* seek 0 bytes from end-of-file */`


    `if (position != -1)`


    `printf(“The length of datafile.dat is %ld bytes.\n”, position);`


    `else`


    `perror(“lseek error”);`


    `}`


    `else`


    `printf(“can’t open datafile \n”);`


    `close(fd);`


    `}`


    In the given example, a file is opened in read-only mode. On error, a message
    **`can’t open datafile`** will be printed. Once the file is opened successfully,
    the file pointer is set to the End of the File.


    # The link() function


    The **`link()`** system call links an existing file to a new one. Linking a file
    in the UNIX system creates a new directory entry (hard link) that contains the
    linked filename and the I-node number of the existing file. All linked files refer
    to the same data. Changing content in one file is reflected in all links. In a
    simple way, we can say that it makes a new name for a file.


    **Prototype**


    `int link(char*original_name, char * new_name)`


    On success, it returns **`0`**, and on error **`-1`** is returned. The **`link()`**
    system call fails if any of the following conditions exist:


    *   **`Original_name`** does not exist.


    *   **`New_name`** does exist.


    *   **`Original_name`** is a directory, and the user is not a superuser.


    *   Try to create a link across the file system.


    **Example**


    `#include <stdio.h>`


    `int main()`


    `{`


    `if ((link(“file.old”, “file.new”)) == -1)`


    `{`


    `perror(“ERROR“);`


    `exit(1);`


    `}`


    `exit(0);`


    `}`


    In the given example, a new name file. New is created for a file. If an error
    occurs, it prints **`ERROR`**.


    # The unlink system call


    The unlink system call removes a hard link and corresponding directory entry and
    decreases the link count of the file. If the link count reaches 0, the contents
    of the file are also deleted. If the file is opened by any process, the contents
    of the file are not deleted till it is closed. When the process closes the file,
    the Kernel removes the contents of the file.


    **Prototype**


    `int unlink(const char *pathname)`


    Where **`pathname`** is the name of the linked file which is to be removed. For
    **`unlink()`** to be successful, the directory containing the corresponding directory
    entry must have write and execute permission. On success, **`0`** is returned,
    and on error, **`-1`** is returned.


    **Example**


    `#include <stdio.h>`


    `int main()`


    `{`


    `if ((unlink(“file.old”)) == -1)`


    `{`


    `perror(“ERROR “);`


    `exit(1);`


    `}`


    `exit(0);`'
