    *   **CPU scheduling information:** Like process priority, pointers to process
    scheduling queues, and other scheduling parameters.


    *   **Memory management information:** Like the value of base and limit registers,
    page tables.


    *   **Accounting information:** Like the amount of time for which the CPU is used.


    *   **I/O status information:** Like a list of I/O devices allocated to this process,
    a list of open files.


    The context of a process includes the value of CPU registers, process state, and
    memory management information. The context of the process contains (1) User-Level
    context, (2) CPU registers, and (3) Kernel level context.


    The user-level context contains the memory layout of the virtual address space
    of the process, such as text, data, user stack, and shared memory.


    The CPU registers consist of the following information:


    *   The Program Counter contains the address of the next instruction to be executed.


    *   The Program Status Register contains various flags to indicate the result
    of the recent computation, the subfield that shows the current execution mode
    to determine whether the process can run in privileged instructions, and the subfields
    that show the current processor execution level.


    *   The Stack Pointer points to the next free entry or last used in the Kernel
    or user stack.


    *   The General-Purpose Registers contain intermediate data generated during the
    execution of the process.


    The Kernel-level context of a process contains one static part and a variable
    number of dynamic parts throughout its lifetime. The components of system-level
    context are as follows:


    *   The Process Table entry contains state of process and control information.


    *   The u area contains process control information that needs to be accessed
    only once.


    *   Pregion entries, region table, and page table provide text, data, stack, and
    other regions of the process.


    *   Kernel Stack contains a stack of Kernel functions when the process executes
    in the Kernel mode. The Kernel stack is empty when the process executes in user
    mode.


    *   The Dynamic part contains several system-level context layers where each layer
    contains information about the previous layer.


    # [Process control](#toc.xhtml_s76a)


    Process control handles all operations related to the process, including the creation
    of the child process, changing context from one process to another while executing
    cooperating or independent processes, and terminating the process in a normal
    and normal manner.


    # [Process creation](#toc.xhtml_s77a)


    Processes are initiated in UNIX using the **`fork()`** function. The **`fork()`**
    function creates one child process identical to the parent, and both parent and
    child processes are running. Both parent and child share the same real and effective
    user and group ID, current working directory, root directory, file creation mask,
    and so on.


    The **`fork()`** returns the value of the PID of the child to the parent, and
    the return value in a child is **`0`**. Kernel increments file and inode table
    counters for files associated with the process. If the child process cannot be
    created due to (**`A`**) there are too many processes in the system.


    (B) limit on the number of processes for real-user ID of the parent process exceeds,
    then return value of parent process is **`–1`**.


    Let us see an example:


    `main()`


    `{`


    `int pid;`


    `pid = fork();`


    `if (pid < 0)`


    `printf(“Fork failed \n”);`


    `else`


    `{`


    `if (pid == 0)`


    `{`


    `printf(“In child process pid is %d \n”,getpid());`


    `printf(“In child process parents pid is %d \n”,getppid());`


    `}`


    `else`


    `{`


    `printf(“In parent process pid is %d \n”,getpid());`


    `printf(“In parent process parents parent pid is %d \n”,getppid());`


    `}`


    `}`


    `}`


    File locks set in the parent process are not inherited in the child process. In
    the given example, if **`fork()`** is successful, it returns either **`0`** to
    the newly created child or the process ID of the newly created child to the parent
    process in which **`fork()`** is called. Both the processes execute one after
    another as scheduled by the CPU. If **`fork()`** is unsuccessful, it returns a
    negative number.


    # [Awaiting process termination](#toc.xhtml_s78a)


    The simple way of a process to acknowledge the death of a child process is by
    using the **`wait()`** system call. When **`wait()`** is called, the process is
    suspended until one of its child processes exits, and then the call returns with
    the exit status of the child process. If it has a zombie child process, the call
    returns immediately, with the exit status of that process.


    A call to **`wait()`** function does a number of things. A check is made to verify
    if the parent process has any children. If it does not, a –1 is returned by **`wait()`**.
    If a parent process has a child that is terminated (zombie), the child’s PID is
    returned, and it is removed from the process table.


    However, if a parent process has a child or children that have not terminated,
    the parent process is suspended till it receives a signal. The signal is received
    as soon as the child dies.


    The **`wait()`** can also tell us in what manner the child process was terminated.
    For this, we need to pass an integer variable to **`wait()`**. If the process
    was terminated normally, the high order 8 bits of the integer variable passed
    to the **`wait()`** will be updated, whereas the lower order 8 bits will be initialized
    to **`0`**.


    On the other hand, if it has been terminated abnormally, the lower-order 8 bits
    are updated, and higher-order 8 bits are initialized to **`0`**.


    In case of a core dump error, the wait returns an integer whose 7th bit is put
    on.


    Let us see an example:


    `/* example of  wait() */`


    `main()`


    `{`


    `int i, pid, exitstat, status;`


    `pid = fork();`


    `if (pid == 0)`


    `{`


    `printf(“Enter exit stat:”);`


    `scanf(“%d”, &i);`


    `exit(i);`


    `}`


    `else`


    `{`


    `wait(&status);`


    `if ((status & 0xff) != 0) /* abnormal exit */`


    `{`


    `printf(“Signal interrupted\n”);`


    `}`


    `else /* normal exit */`


    `{`


    `exitstat = (int) status/256 ;`


    `printf(“Exit status from %d was %d\n”, pid, exitstat);`


    `}`


    `}`


    `}`


    Here in the child process, the user enters an exit code, and the process exits
    with this exit code. The parent process receives this exit code in the status
    variable. We can check the status variable to know the type of exit.


    **`fork()`** creates a duplicate of all variables in the child process, so even
    global variables are duplicated. If we change the value in one process, it is
    not reflected in the other. Even the value of location pointed to by pointer variable
    is different for different processes.


    # [Executing another program](#toc.xhtml_s79a)


    An existing process can call another process by executing exec system call. The
    process ID of the running process does not change because **`exec()`** function
    does not create new process rather it calls an existing process. The various function
    prototypes of **`exec()`** function are as follows:


    *   `int execl(const char *path, const char *arg, …);`


    *   `int execlp(const char *file, const char *arg, …);`


    *   `int execle(const char *path, const char *arg,…, char * const envp[]);`


    *   `int execv(const char *path, char *const argv[]);`


    *   `int execvp(const char *file, char *const argv[]);`'
