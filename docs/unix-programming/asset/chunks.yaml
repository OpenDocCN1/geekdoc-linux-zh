  trans: "\nUNIX 是一个巨大的命令集合。用户可以通过组合这些简单的命令集来构建自己的复杂命令。在 UNIX 中，软件开发的概念始于程序最顶层的 shell（外壳）。UNIX\
    \ shell 是一种功能完备的语言，具有 shell 环境、shell 变量、命令行参数、条件和控制结构。除了基础编程工具外，shell 还提供了容量有限的数组、函数和信号捕获功能。Bourn\
    \ shell（布恩外壳）被认为是 UNIX 操作系统的主要 shell。\n\n# 复习练习题\n\n1. 编写一个 shell 脚本，重复显示指定次数的某个单词。[命令行参数：`word`,\
    \ `number` ]\n2. 编写一个 shell 脚本，检查是否为闰年。[命令行参数：`four digit year` ]\n3. 编写一个 shell\
    \ 脚本，删除文件中所有包含单词 `UNIX` 单词的行。[命令行参数：`filename` ]\n4. 编写一个 shell 脚本，比较两个文件，如果发现相等则删除第二个文件。[命令行参数：`file1`,\
    \ `file2` ]\n5. 编写一个 shell 脚本，计算一个数字各位位数字之和。[命令行参数：`number` ]\n6. 编写一个 shell 脚本，计算一个数字的阶乘。\n\
    7. 编写一个 shell 脚本，在文件的每行前加上行号。[命令行参数：`filename` ]\n8. 编写一个 shell 脚本，将文件中所有的小写字母转换为大写字母。[命令行参数：`filename`\
    \ ]\n9. 编写一个 shell 脚本，将不带时间的日期复制文件中。\n10. 编写一个 shell 脚本，检查给定文件是普通文件还是目录。\n11.\
    \ 编写一个 shell 脚本，每隔 15 秒显示一次已登录的用户。\n12. 编写一个 shell 脚本，从一个数字倒减到 0。如果没有提供参数，则起始数字应为\
    \ 10。[命令行参数：`number` ]\n13. 编写一个 shell 脚本，将当前目录下所有大写字母文件名更改为小写。\n14. 编写一个 shell\
    \ 脚本，将当前目录下所有文本文件的扩展名从 `.txt` 改为 `.doc`。\n15. 编写一个 shell 脚本，在当前目录下所有文本文件的末尾添加消息\
    \ (c) MCA 2006-2007。\n16. 编写一个 shell 脚本，反复询问印度的首都。当用户输入 Delhi 时，程序应终止。\n17. 编写一个\
    \ shell 脚本，检查用户是否已登录。\n18. 编写一个 shell 脚本，根据一天的时间显示 Good Morning 或 Good Afternoon\
    \ 或 Good Evening。\n19. 编写一个 shell 脚本，删除作为命令行参数传递的文件。\n20. 编写一个 shell 脚本，统计文件中包含给定单词的行数。[命令行参数：`word`,\
    \ `filename` ]\n21. 什么是系统变量和用户变量？讨论任意五个系统变量。\n22. 编写一个 shell 脚本，反转输入数字 `n` 的数字。\n\
    23. 用合适的示例解释不同的 shell 编程结构。\n24. 解释以下变量的：\n    1. `$#`\n    2. `$*`\n    3. `$$`\n\
    \    4. `$(d)?` \n    5. `PS1`\n26. 编写一个 shell 脚本，识别传递的参数个数是奇数还是偶数。\n\n这里提供了部分\
    \ shell 脚本的解决方案：\n\n## 重复显示单词的 Shell 脚本\n\n```bash\nif [ $# -ne 2 ]\nthen\n  echo\
    \ “Usage: a1 word number”\n  exit\nelse\n  i=1\n  while [ $i -le $2 ]\n  do\n\
    \    echo $1\n    i=`expr $i + 1`\n  done\nfi\n```\n\n## 检查闰年的 Shell 脚本\n\n```bash\n\
    if [ $# -ne 1 ]\nthen\n  echo “Usage: $0 year”\n  exit\nfi\nif [ `expr $1 % 4`\
    \ -eq 0 -a \\(`expr $1 % 100` -ne 0 -o `expr $1 % 400` -eq 0 \\)]\nthen\n  echo\
    \ $1 is a Leap Year\nelse\n  echo $1 is not a Leap Year\nfi\n```\n\n## 删除所有包含\
    \ UNIX 单词行的 Shell 脚本\n\n```bash\nif [ $# -ne 1 ]\nthen\n  echo “Usage: $0 filename”\n\
    \  exit\nelse\n  grep -v “UNIX” $1 > tmp\n  mv tmp $1\nfi\n```\n\n## 比较 2 个文件并在相等时删除第二个文件的\
    \ Shell 脚本\n\n```bash\nif [ $# -ne 2 ]\nthen\n  echo “Usage: $0 file1 file2”\n\
    \  exit\nelse\n  cmp -s $1 $2\n  if [ $? -eq 0 ]\n  then\n    rm -f $2\n  else\n\
    \    echo “Files $1 and $2 are not identical”\n  fi\nfi\n```\n\n## 计算数字各位位之和的\
    \ Shell 脚本\n\n```bash\nif [ $# -ne 1 ]\nthen\n  echo “Usage: $0 number”\n  exit\n\
    else\n  sum=0\n  num=$1\n  while [ $num -ne 0 ]\n  do\n    tmp=`expr $num % 10`\n\
    \    sum=`expr $sum + $tmp`\n    num=`expr $num / 10`\n  done\n  echo The sum\
    \ of digits is $sum\n```\n\n## 计算数字阶乘的 Shell 脚本\n\n```bash\nif [ $# -ne 1 ]\n\
    then\n  echo “Usage: $0 number”\n  exit\nelse\n  fact=1\n  num=$1\n  while [ $num\
    \ -ne 0 ]\n  do\n    tmp=`expr $num % 10`\n    fact=`expr $fact * $tmp`\n    num=`expr\
    \ $num / 10`\n  done\n  echo Factorial is $fact\n```\n\n## 在文件每行前加上行号的 Shell 脚本\n\
    \n```bash\nif [ $# -ne 1 ]\nthen\n  echo “Usage: $0 filename”\n  exit\nelse\n\
    \  i=1\n  while read line\n  do\n    echo $i $line\n    i=`expr $i + 1`\n  done\
    \ < $1\nfi\n```\n\n## 将文件中所有小写字母转为大写字母的 Shell 脚本\n\n```bash\nif [ $# -ne 1 ]\n\
    then\n  echo “Usage: $0 filename”\n  exit\nelse\n  tr 'a-z' 'A-Z' < $1 > tmp\n\
    \  mv tmp $1\nfi\n```\n\n## 将不带时间的日期复制到文件的 Shell 脚本\n\n```bash\nif [ $# -ne 1\
    \ ]\nthen\n  echo “Usage: $0 filename”\n  exit\nelse\n  date +%Y-%m-%d > $1\n\
    fi\n```\n\n## 检查给定文件是普通文件还是目录的 Shell 脚本\n\n```bash\nif [ $# -ne 1 ]\nthen\n  echo\
    \ “Usage: $0 filename”\n  exit\nfi\nif [ -f $1 ]\nthen\n  echo $1 is a regular\
    \ file\nelif [ -d $1 ]\nthen\n  echo $1 is a directory\nelse\n  echo $1 is neither\
    \ a regular file nor a directory\nfi\n```\n\n## 每 15 秒显示一次已登录用户的 Shell 脚本\n\n\
    ```bash\nwhile :\ndo\n  who\n  sleep 15\ndone\n```\n\n## 从数字倒减到 0 的 Shell 脚本\n\
    \n```bash\nif [ $# -eq 0 ]\nthen\n  start=10\nelse\n  start=$1\nfi\nwhile [ $start\
    \ -ge 0 ]\ndo\n  echo $start\n  start=`expr $start - 1`\ndone\n```\n\n## 将当前目录下所有大写文件名更改为小写的\
    \ Shell 脚本\n\n```bash\nfor file in *[A-Z]*\ndo\n  mv \"$file\" \"`echo $file |\
    \ tr '[:upper:]' '[:lower:]`\"\ndone\n```\n\n## 将当前目录下所有文本文件的扩展名从 .txt 改为 .doc\
    \ 的 Shell 脚本\n\n```bash\nfor file in *.txt\ndo\n  mv \"$file\" \"${file%.txt}.doc\"\
    \ndone\n```\n\n## 在当前目录下所有文本文件的末尾添加消息 (c) MCA 2006-2007 的 Shell 脚本\n\n```bash\n\
    for file in *.txt\ndo\n  echo \"(c) MCA 2006-2007\" >> $file\ndone\n```\n\n##\
    \ 反复询问印度的首都是 Shell 脚本\n\n```bash\nwhile [ $ans != \"Delhi\" ]\ndo\n  echo \"What\
    \ is the capital of India?\"\n  read ans\ndone\n```\n\n## 检查用户是否登录的 Shell 脚本\n\
    \n```bash\nif [ $# -ne 1 ]\nthen\n  echo “Usage: $0 username”\n  exit\nfi\nwho\
    \ | grep \"$1\" > /dev/null\nif [ $? -eq 0 ]\nthen\n  echo $1 is logged in\nelse\n\
    \  echo $1 is not logged in\nfi\n```\n\n## 根据时间显示 Good Morning 或 Good Afternoon\
    \ 或 Good Evening 的 Shell 脚本\n\n```bash\nh=$(date +%H)\nif [ $h -ge 4 -a $h -lt\
    \ 12 ]\nthen\n  echo Good Morning\nelse\n  if [ $h -ge 12 -a $h -lt 17 ]\n  then\n\
    \    echo Good Afternoon\n  else\n    echo Good Evening\n  fi\nfi\n```\n\n## 删除作为命令行参数传递文件的\
    \ Shell 脚本\n\n```bash\nif [ $# -lt 1 ]\nthen\n  echo “Usage: $0 file1 file2…”\n\
    \  exit\nfi\nfor file in \"$@\"\ndo\n  rm \"$file\"\ndone\n```\n\n## 统计文件中包含给定单词的行数的\
    \ Shell 脚本\n\n```bash\nif [ $# -ne 2 ]\nthen\n  echo “Usage: $0 word filename”\n\
    \  exit\nfi\ngrep -c \"$1\" \"$2\"\n```\n\n21. 什么是系统变量和用户变量？讨论任意五个系统变量。\n22. 编写一个\
    \ shell 脚本，反转输入数字 `n` 的数字。\n23. 用合适的示例解释不同的 shell 编程结构。\n24. 解释以下变量的：\n    1.\
    \ `$#`\n    2. `$*`\n    3. `$$`\n    4. `$(d)?` \n    5. `PS1`\n25. 编写一个 shell\
    \ 脚本，识别传递的参数个数是奇数还是偶数。\n\n这里提供了部分 shell 脚本的解决方案：\n\n## 重复显示单词的 Shell 脚本\n\n```bash\n\
    if [ $# -ne 2 ]\nthen\n  echo “Usage: a1 word number”\n  exit\nelse\n  i=1\n \
    \ while [ $i -le $2 ]\n  do\n    echo $1\n    i=`expr $i + 1`\n  done\nfi\n```\n\
    \n## 检查闰年的 Shell 脚本\n\n```bash\nif [ $# -ne 1 ]\nthen\n  echo “Usage: $0 year”\n\
    \  exit\nfi\nif [ `expr $1 % 4` -eq 0 -a \\(`expr $1 % 100` -ne 0 -o `expr $1\
    \ % 400` -eq 0 \\)]\nthen\n  echo $1 is a Leap Year\nelse\n  echo $1 is not a\
    \ Leap Year\nfi\n```\n\n## 删除所有包含 UNIX 单词行的 Shell 脚本\n\n```bash\nif [ $# -ne 1\
    \ ]\nthen\n  echo “Usage: $0 filename”\n  exit\nelse\n  grep -v “UNIX” $1 > tmp\n\
    \  mv tmp $1\nfi\n```\n\n## 比较 2 个文件并在相等时删除第二个文件的 Shell 脚本\n\n```bash\nif [ $#\
    \ -ne 2 ]\nthen\n  echo “Usage: $0 file1 file2”\n  exit\nelse\n  cmp -s $1 $2\n\
    \  if [ $? -eq 0 ]\n  then\n    rm -f $2\n  else\n    echo “Files $1 and $2 are\
    \ not identical”\n  fi\nfi\n```\n\n## 计算数字各位位之和的 Shell 脚本\n\n```bash\nif [ $#\
    \ -ne 1 ]\nthen\n  echo “Usage: $0 number”\n  exit\nelse\n  sum=0\n  num=$1\n\
    \  while [ $num -ne 0 ]\n  do\n    tmp=`expr $num % 10`\n    sum=`expr $sum +\
    \ $tmp`\n    num=`expr $num / 10`\n  done\n  echo The sum of digits is $sum\n\
    ```\n\n## 计算数字阶乘的 Shell 脚本\n\n```bash\nif [ $# -ne 1 ]\nthen\n  echo “Usage: $0\
    \ number”\n  exit\nelse\n  fact=1\n  num=$1\n  while [ $num -ne 0 ]\n  do\n  \
    \  tmp=`expr $num % 10`\n    fact=`expr $fact * $tmp`\n    num=`expr $num / 10`\n\
    \  done\n  echo Factorial is $fact\n```\n\n## 在文件每行前加上行号的 Shell 脚本\n\n```bash\n\
