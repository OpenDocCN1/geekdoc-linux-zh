  trans: "\n通常情况下，程序在普通用户的权限下执行。但在某些情况下，普通用户需要特殊权限来执行某些特殊任务，例如更改密码。每个用户密码的哈希表示形式存储在\
    \ `/etc/passwd` 文件中，该文件仅超级用户（root）具有写权限。当普通用户想要更改密码时，必须更新此文件。但普通用户没有该文件的写入和保存权限。因此，更改密码的程序必须代表普通用户运行，但要具有超级用户的权限。对于此类情况，在文件权限上设置了一个特殊的位（设置用户-ID\
    \ 标识位，即 `SUID`）。当此位被设置时，其所应用的的程序将以文件所有者的权限运行。在执行长文件列表时，该位在所有者权限中将显示为“s”而不是“x”。小写的\
    \ s 表示 SUID 位和执行位均已设置。大写的 `S` 代表设置了 SUID 位但没有设置执行位。\n\nSUID 位也可以设置在目录上。设置在目录上，无论是谁创建了这些文件，在该目录下创建的所有文件和目录将与该\
    \ SUID 目录具有相同的所有者。\n\n# 设置组 ID\n\n如果用户执行一个带有此位的程序，他/她将继承分配给程序所有者组的文件访问权限。SGID\
    \ 位用小写或大写的“s”代替组执行权限位“x”来表示。该位通常用于工具程序，例如邮件工具、打印工具等。如果对一个目录设置了 SGID 位，那么在其中创建的所有子目录和文件也将继承该组权限。\n\
    \n当程序在带有此位的状态下执行时，用户将自动继承所有该程序的组所拥权限。与 SUID 位一样，SGID 位用小写或大写的“s”代替组执行位的“x”来表示。这通常用于某些子系统的各种工具，例如邮件子系统或打印子系统等。目录上的\
    \ SGID 位意味着在该目录下创建的所有文件和子目录都继承该目录的组。\n\n## 粘滞位（Sticky-bit）权限\n\n粘滞位主要用于公共目录。它对于\
    \ `/var/tmp` 和 `/tmp` 等共享目录非常有用。所有用户都应该能够在这些临时目录中创建文件、读取执行其他用户的文件。如果将粘滞位应用于目录，只有当用户对目录本身具有写权限，并且满足以下任一条件：他是文件的所有者、目录的所有者或超级用户（root），才能删除或重命名该目录中的文件。用户不允许删除其他用户所有的文件。因此，粘滞位使文件固定所有者，并防止用户在公共可写目录中删除和重命名其他用户的文件。\n\
    \n## 新文件的用户 ID 和组 ID\n\n新文件的用户 ID（UID）设置为创建文件进程的有效用户 ID。新文件的组 ID（GID）为：\n\n* \
    \  创建文件进程的有效组 ID。\n*   创建该文件所在目录的组 ID。\n\n## 有效用户 ID 和组 ID\n\n对于大多数进程，有效用户 ID\
    \ (`EUID`) 等于用户 ID (`UID`)，有效组 ID (`EGID`) 等于组 ID (`GID`)。当进程执行包含镜像的可执行文件设置了 Set-UID\
    \ 或 Set-GID 位时，进程的 `EUID/EGID` 将设置为可执行文件的 `UID/GID`，而不是执行进程的用户！这是 UNIX 的一种机制，允许用户对原本无法访问的资源获得定义明确且受限的访问。例如，更改密码需要写入\
    \ `/etc/passwd`。当然，普通用户没有该文件的写入访问。但 Set-UID root 程序 `/bin/passwd` 提供了一个定义明确的网关。\n\
    \n## 文件访问权限掩码\n\n`stat` 结构中的 `st_mode` 成员包含文件权限：\n\n```\nst_mode mask – 所有者，组，其他\n\
    ```\n\n```\n#define S_IRWXU 00700 /* 读、写、执行：所有者 */\n#define S_IRUSR 00400 /* 读权限：所有者\
    \ */\n#define S_IWUSR 00200 /* 写权限：所有者 */\n#define S_IXUSR 00100 /* 执行权限：所有者 */\n\
