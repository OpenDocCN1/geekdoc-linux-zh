    # About the Authors


    **Prof. (Dr.) Vineeta Khemchandani** is a Doctorate (Ph.D) in Computer Science,
    Post Graduate in Computer Applications and ‘Diploma in Banking Technology” from
    Indian Institute of Banking and Finance, Mumbai. Overall experience of around
    23 years in the field of IT in various organizations. The experience spans from
    software development, Corporate Training , System Administration, Academics, Administration
    and Research, in various capacities. She significantly contributed with guiding
    several B.Tech/ MCA projects, M.Tech dissertations and PhDs. Publications of 30
    research papers in journals of repute, 6 book chapters and authored 3 books. She
    filed three patents. She is part of review committee for Journal of King Saud
    University, INDERSCIENCE Journal of Electronic Government and Science Publishing
    Group, USA.


    She contributed towards education innovation as members of “board of studies”
    of State level universities in Uttar Pradesh. Currently also she member of board
    of studies of AKTU, Lucknow for CS, It and MCA programs. She delivered several
    talks during International conferences and TEQIP programmes. She contributed to
    National and International professional bodies like IEEE and Computer Society
    of India as Branch counselor and management committee member. She was part of
    jury to judge “SMART INDIA HACKTHON”, an initiative of AICTE and Ministry of Human
    Resource Development (Govt of India) for four consecutive years. Her research
    work over the past several years has focused on different aspect of information
    security and algorithms. Brief areas of research include cryptography, Digital
    watermarking, visual cryptography, stenography, multi- dimensional data structures,
    and e-Governance projects.


    **Prof. (Dr.) Darpan Anand** is presently working as Professor in the Department
    of Computer Science Engineering Department at Chandigarh University, India with
    more than 18 years of experience in teaching, industry, and research. He is currently
    a member of the Board of Studies, a Member of the research Degree Committee, and
    Outcome Based Education Coordinator, ABET Accreditation Coordinator, Research
    Coordinator, and the Coordinator of Projects in the Department of Computer Science,
    Chandigarh University. He has guided several Ph.D. and PG Dissertations. He is
    an author/co-author of more than 50+research papers (indexed in SCI, ESCI, Scopus,
    etc.), 1 Textbook, 6 book chapters (IET, Springer, and Elsevier), 4 patents, SWAYAM
    MOOC courses, etc. In addition to it, he has reviewed many publications for SCI
    and Scopus indexed journal. He is also a member of various esteemed research associations
    as IEEE, ACM, IAENG, TAEI, CSI, AIS, CSTA, etc.


    **Dr. K. K. Mishra** is presently working as Assistant Professor in Department
    of Computer Science and Engineering, MNNIT Allahabad, Prayagraj. He has successfully
    organized around 6 IEEE conferences in India (ICCCT Series) as a conference secretary
    and worked as a program chair for many other conferences. He has worked as PC
    members for many conferences in India and abroad and has successfully organized
    some special issues in highly index journals. He is a regular reviewer of Journal
    of Supercomputing (Springer), Applied Intelligence, Applied Soft Computing, IEEE
    Transaction on Cybernetics, IEEE System Journal, Neural computing and application
    and IETE journals. In addition to it, he has reviewed many publications for SCI
    and Scopus indexed journal.


    **Dr. Sandeep Harit** started his formal education from BIET Jhansi with B.Tech
    program completed, Postgraduate and PhD from MNNIT Allahabad. He is presently
    working as faculty at department of Computer Science and engineering at Punjab
    Engineering College He supervised thirty M.Tech Thesis and two PhD thesis. Since
    last 20 years in profession, he has been involved in various Academic, administrative
    and research activities. He has published 40+ quality research article in leading
    journals and conferences including SCI and Scopus, and IEEE Indexed with good
    number of citations.


    **Dr. Akash Punhani** is currently working as Associate Professor at SRM Institute
    of Science and Technology, Delhi NCR campus, Modinagar, Ghaziabad, India. He is
    the part of academics since 2007. He has done his Ph.D. on Interconnection Networks
    titled “On Improving throughput and latency of mesh interconnection networks”
    in year 2018 from Jaypee University of Information technology, Solan Himachal
    pradesh, India. During his Ph.D. he proposed the routing algorithms and topologies
    that can be used on chips and help in improving communication on System on Chips.
    He has published the articles in the various reputed journals and conferences.
    His area of research includes Network on chips, Machine learning and Optimization
    Algorithms. He is also an active reviewer of various journals of high impact factors.

