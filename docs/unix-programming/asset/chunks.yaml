    In system V, to startup the system init read `/etc/initab` file to put the system
    in a different mode (single-user or multi-user) depending on the value of the
    run level. For normal multi-user operation `/etc.rc` file is executed, which starts
    various daemon processes.


    Regardless of the UNIX system, init process invokes `fork` copies of itself to
    activate terminals. Each child process executes the `/etc/getty` process to set
    the terminal’s speed, display a greeting message, and waits for the user to enter
    the login name. The Getty process executes `/bin/login` program to check whether
    login exists in `/etc/passwd` file or not. If it finds the login name in `./etc/passwd`
    file, it prompts the user to enter a password. If rejected, Getty gives three
    chances to enter your login and password.


    The init, Getty, and login processes are executed with the user ID and effective
    user ID of the super-user. All these processes run with the same process ID because
    the process ID does not change during the `exec` system call.


    ![](images/Figure-1.4.jpg)


    **Figure 1.4:** Process relationship


    # Login program


    While logging in, the system login program sets the following things:


    *   The current working directory as a login directory using `chdir` system call.

    *   The effective group ID and the effective user ID of the login process in the
    order specified in the password file entry using `setgid` and `setuid` system
    calls.

    *   Executes the shell program as specified in the `/etc/passwd` file, or `/bin/sh`
    if the shell is not specified in the passwd file.


    The shell that is invoked by the login program is called login-shell and is treated
    as the parent of all processes.


    # Shell process


    The shell process normally waits for the user to enter the command. When the user
    enters the command on the command line, the shell `fork` make a copy of itself
    and wait for the child process to terminate. The child shell process checks the
    `PATH` environment variable to search the command file. Commands in UNIX are generally
    available in `/bin` directory.


    When the command finishes, it calls an `exit` system call and exits with its exit
    status, which terminates the child process and allows the `wait` to return to
    the parent process.


    # Network login


    In 4.3 BSD, to startup the system, init executes the shell script `/etc/rc`. The
    file does some bookkeeping and then calls daemon processes. One of the daemons
    that are started by the shell script is `netd`. Once the shell script terminates,
    the parent process of `inetd` becomes `init`. This daemon can be used by a server
    that uses either TCP or UDP. This daemon creates sockets on behalf of a number
    of services and listens to all of them simultaneously.


    # Files and directories


    The organization of the UNIX files is shown in the following figure:


    ![](images/Figure-1.5.jpg)


    **Figure 1.5:** UNIX directory structure


    UNIX file system is a hierarchical tree structure of directories and files. The
    tree grows or decays dynamically.


    The file system tree starts with a single node root `/`; every non-leaf node is
    a directory of files, and leaf nodes are directories, regular files, or special
    device files.


    # File


    To UNIX, everything is a file; this means in UNIX data, program files, directories,
    devices, and links are considered as files. Each file has a name, an owner, and
    access rights. Each file is assigned an inode number that is unique. All attributes
    of files are stored in the filesystem in an inode entry. An inode entry stores
    everything except the filename. The names are stored in directories and associated
    with inode through pointers.


    Each inode generally contains the following:


    *   The location of the file’s contents on the disk.

    *   Type of file.

    *   Size of the file in bytes.

    *   The time when file’s inode was last modified.

    *   The time when file’s contents were last modified.

    *   The time when the file was last accessed for reading, writing, and for other
    operations.

    *   The reference count, different number of names the file has.

    *   The file’s owner’s ID.

    *   The file’s group ID.

    *   File’s access permission bits.


    In UNIX, every file has a nonnegative number associated with it called the file
    descriptor. The Kernel uses a file descriptor to identify a file when any program
    accesses it. Every file or directory has an associated filename in the directory
    entry. Slash and null characters cannot appear in the filename. Some UNIX systems
    restrict the filename to 14 characters, and most other systems allow 256 characters
    in the filename.


    Every directory and file has a corresponding entry in its parent directory. Directory
    entry specifies an attribute of the file, such as type of file, size of the file,
    owner of the file, and permission on the file. The root directory is the first
    directory of the directory tree, and it contains its own information. Every directory
    also contains information on two special directory entries, the current directory
    and the parent of the current directory.


    `Note: [Reserved Inode Number]:`


    `0: Deleted files / directories`


    `1: File system Dependent, ( file system creation time / bad block count etc )`


    `2: Refers to the root directory of the file system.`


    # Pathname


    Every file or directory is identified by its pathname; the pathname of the file
    or directory is either absolute or relative to a location.


    The absolute pathname starts with the root `/` and follows the branches of the
    directory tree, each separated by `/`, until the required file is found, for example,
    `/bin`.


    A relative pathname specifies the path relative to another, usually the current
    directory. So if the current directory is `/bin` then the path of the file in
    this current directory is specified as `../`. This indicates that control should
    move directory level up, then come down.


    # Types of files


    UNIX considers everything as a file. There are seven types of files in UNIX, as
    shown in the following figure:


    ![](images/Figure-1.6.jpg)


    **Figure 1.6:** Types of UNIX files


    The UNIX files can be described as follows:


    *   **Regular files:** These are a sequence of unformatted bytes. A regular file
    may contain ASCII or binary characters or a combination of both. A text file is
    also considered as a regular file. ALL shell scripts and programs are written
    in high-level languages, and even object codes are also considered as regular
    files. There’s no header, trailer, label information, or EOF character as part
    of the file.

    *   **Directory files:** These are a sequence of formatted bytes and contain information
    about other files and subdirectories. A directory contains information on the
    name of the file or directory in it and its inode (index node) number. For directory
    files, the output of the `ls -l` command shows the first character as d. To change
    into a directory or list files in a directory, we need read permission for that
    directory. To create a file or subdirectory in that directory, we need write permission
    for that directory.

    *   **Special files:** This represents physical devices such as keyboards, tapes,
    disks, and printers. They are characters, block files, sockets, and so on. The
    operating system uses these files to communicate with the hardware. We can use
    the same commands for these special files that we use for regular files, but the
    operating system takes care of handling the devices. The physical devices are
    represented /dev directory.

    *   **PIPES:** A type of file used for inter-process communication between processes.
    Their implementation allows processes to communicate even though they do not know
    what processes are on the other end of the pipe. Pipes are basically of two types:
    named pipes and unnamed pipes.

