    # [Destroying a message queue](#toc.xhtml_s105a)


    The message queue is destroyed using **`msgctl()`** function.


    **Prototype**


    `int msgctl(int cmd, struct msqid, int msqid_ds *buf);`


    Here, **`msqid`** is the queue identifier obtained from **`msgget()`**. The **`cmd`**
    argument is set to **`IPC_RMID`** to destroy a queue.


    This **`cmd`** can only be executed by a process that has an effective user ID
    equal to either that of a superuser or to the value of either **`msg_perm.uid`**
    or **`msg_perm.cuid`** in the data structure associated with **`msqid`**.


    # [Controlling message queue](#toc.xhtml_s106a)


    The **`msgctl()`** system call is used to perform control operations on a message
    queue.


    **Prototype**


    `int msgctl ( int msgqid, int cmd, struct msqid_ds *buf );`


    Where **`msqid`** is a unique positive integer identifying a message queue, and
    **`cmd`** specifies a message control operation. **`cmd`** can take the following
    values:


    *   **`IPC_STAT`**: Returns the current message queue structure **`msqid_ds`**
    for the specified message queue ID.


    *   **`IPC_SET`**: Sets **`msg_perm.uid`**, **`msg_perm.gid`**, **`msg_perm.node`**,
    **`msg_qbytes`** members of the **`msqid_ds`** structure from the **`buf`** argument.


    *   **`IPC_RMID`**: Removes the message queue identifier specified by **`msqid`**
    from the system and destroys the message queue and data structure associated with
    it.


    The **`buf`** points to a structure used for message queue data manipulation operations.
    On success, the function returns **`0`**. Otherwise, it returns **`-1`**, and
    an errno is set.


    # [Shared memory](#toc.xhtml_s107a)


    The problem with pipes, message queues, and FIF is that for two processes to exchange
    information, and the information has to go through the Kernel. Shared memory is
    the form of IPC that allows processes to communicate by writing onto a memory
    area that is shared among them. Processes need to coordinate the use of shared
    memory segments to exchange information. If one process is reading a shared segment,
    the other processes have to wait.


    # [Creating shared memory](#toc.xhtml_s108a)


    The **`shmget()`** is used to obtain access to a shared memory segment.


    **Prototype**


    `int shmget(key_t key, size_t size, int shmflg);`


    The **`key`** argument is an access value associated with the shared memory. The
    **`size`** argument is the size in bytes of the requested shared memory. The **`shmflg`**
    argument specifies the initial access permissions and creation control flags.


    When the call succeeds, it returns the shared memory segment ID. This call is
    also used to get the ID of an existing shared segment (from a process requesting
    sharing of some existing memory portion).


    # [Controlling a shared memory segment](#toc.xhtml_s109a)


    The **`shmctl()`** function is used to alter the permissions and other characteristics
    of a shared memory segment.


    **Prototype**


    `int shmctl(int shmid, int cmd, struct shmid_ds *buf);`


    The process must have an effective **`shmid`** of the owner, creator, or superuser
    to perform this command. The **`cmd`** argument is one of the following control
    commands:


    *   **`SHM_LOCK`**: Locks the specified shared memory segment in memory. The process
    must have the effective ID of the superuser to perform this command.


    *   **`SHM_UNLOCK`**: Unlocks the shared memory segment. The process must have
    the effective ID of the superuser to perform this command.


    *   **`IPC_STAT`**: Returns the status information contained in the control structure
    and places it in the buffer pointed to by **`buf`**. The process must have read
    permission on the segment to perform this command.


    *   **`IPC_SET`**: Sets the effective user and group identification and access
    permissions. The process must have an effective ID of owner, creator, or superuser
    to perform this command.


    *   **`IPC_RMID`**: Removes the shared memory segment.


    The **`buf`** is the structure of type struct **`shmid_ds`**, which is defined
    in **`<sys/shm.h>`**.


    # [Attaching and detaching a shared memory segment](#toc.xhtml_s110a)


    The **`shmat()`** and **`shmdt()`** are used to attach and detach shared memory
    segments to the address space of the calling process.


    **Prototypes**


    `void *shmat(int shmid, const void *shmaddr, int shmflg);`


    `int shmdt(const void *shmaddr);`


    The **`shmat()`** function attaches the shared memory segment associated with
    the shared memory identifier, **`shmid`**; it reruns a pointer, **`shmaddr`**,
    to the head of the shared segment associated with a **`shmid`**.


    The **`shmdt()`** detaches the shared memory segment located at the address indicated
    by **`shmaddr`**.


