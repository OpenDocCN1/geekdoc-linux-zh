    # [CHAPTER 3](#toc.xhtml_c03)


    # [Process Management](#toc.xhtml_c03)


    # [Introduction](#toc.xhtml_s61a)


    The Kernel performs various primitive operations on behalf of user processes.
    These operations include controlling the execution of processes by allowing their
    creation, termination, or suspension and communication. Scheduling processes fairly
    for execution on the CPU. Allocating main and secondary memory for executing processes.
    Protecting processes’ address spaces. The Kernel also controls access to peripheral
    devices such as terminals and other devices. UNIX maintains a parent–child relationship
    among different processes executed in the system. The UNIX Kernel maintains this
    process tree through different process IDs to keep control of process creation,
    execution, and termination. This chapter discusses all these primitive operations
    to perform effective process management.


    # [Structure](#toc.xhtml_s62a)


    We will cover the following topics in this chapter:


    *   Processes and their relationships


    *   Processes related operations


    *   Process control and execution


    *   Memory allocation to the executing process.


    *   Process communication


    # [Objectives](#toc.xhtml_s63a)


    After going through this chapter, you will be able to:


    *   Understand fundamental concepts of process management


    *   Learn how processes are identified in the UNIX system


    *   Get to know the process related operations such as creation, execution, termination,
    and suspension


    *   Understand how processes communicate with each other


    *   Understand how UNIX controls process execution and switching


    # [UNIX process](#toc.xhtml_s64a)


    A program in execution is a process. In UNIX, a process is a unit of work. The
    system consists of a collection of processes: operating system processes executing
    system code and user processes executing user code. All the processes execute
    concurrently with the CPU switching between the processes.


    A process executes by following a strict sequence of instructions that is self-contained
    and does not jump to that of another process.


    # [Process IDs](#toc.xhtml_s65a)


    Each process has an identification number called process id that identifies it
    uniquely. The **`getpid()`** function is used to get the process id of a process.
    Processes in UNIX have a parent–child relationship. Each process has one parent
    and one or more children.


    The process ID 0 is the scheduler process and is called swapper. Swapper is part
    of the Kernel and is called a system process.


    The init process (process ID 1) is the process dispatcher, which gives birth to
    the shell, and all processes initiated by us are children of the shell and so
    descendants of init process. Init is a normal user process and never dies.


    UNIX keeps track of all processes in an internal data structure called a process
    table. The process ID of a parent can be obtained by the function **`getppid()`**
    as follows:


    `main()`


    `{`


    `printf(“In child process pid is %d \n”,getpid());`


    `printf(“In child process parents pid is %d \n”,getppid());`


    `}`


    # [Executing process in UNIX environment](#toc.xhtml_s66a)


    Process in UNIX is a C program. Whenever a C program executes, it calls the main
    function.


    **Prototype:**


    `int main(int argc, char * argv);`


    Here, **`argc`** is the number of command-line arguments, and **`agrv`** is the
    pointer to command line arguments.


    The Kernel starts executing a C program through the exec function, which calls
    a special start-up routine specified as starting address by the executable program
    file. The starting routine takes command-line arguments from the Kernel and calls
    the main function.


    # [Modes of execution of a process](#toc.xhtml_s67a)


    There are the following two modes of execution of the system as seen by the hardware:'
