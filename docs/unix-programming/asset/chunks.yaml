    UNIX shell controls the session behavior through predefined shell variables. Shell
    variables are used to set the user’s home directory, prompt symbol, setting mails,
    and so on. Some shell variables are automatically set by the system, whereas the
    user can set other shell variables in startup files.


    ## Shell interpretation cycle


    Shell command processing is generally performed in five steps:


    1. The shell displays a prompt symbol on the terminal as soon as it starts.

    2. The shell simply waits for the user to enter the command to be executed.

    3. The shell analyzes the command entered by the user.

    4. The shell proceeds to carry out the user’s request. If a particular program
    is required to be executed, the shell searches the disk to find the specified
    program.

    5. Once the program is found shell asks the Kernel to initiate the program execution
    and goes to sleep until the program execution is completed. In case the program
    reads input from the standard input, it waits for the user to type input on the
    command prompt during execution.


    Once the program execution is over control again returns to the shell to execute
    the next program/command.


    ## Functions of UNIX shell


    *Figure 7.1* shows the basic functions performed by the shell. Further details
    of the functions are given in subsequent sections.


    ![](images/Figure-7.1.jpg)


    **Figure 7.1:** Uses of shell


    ## Program execution


    Shell initiates the execution of all programs requested from the user terminals.
    The program to be executed is given as a command line on the terminal as follows:


    ```

    Program-name list-of-arguments

    ```


    Shell scans the command line and identifies the name of the program to be executed
    and the values of parameters passed to execute the program.


    Till the first white space, the shell takes everything as the program name; each
    argument is also separated by white space. If multiple white spaces are given
    between program name and argument, the shell ignores extra white spaces.


    **Example:**


    `prog.sh  first_arg second_arg`


    * `prog.sh`: Program name

    * `first_arg second_arg`: Argument list


    ## Input/output redirection


    Shell takes care of input/output redirection on the command line. During the execution
    of the program, the shell scans the input command for special redirection operators
    `<`, `>`, and `>>`.


    Shell has the ability to redirect input and/or output from and/or to files.


    During the execution of the program shell takes care of input/output redirection
    on the command using special redirection operators `<`, `>`, and `>>`. The `<`
    operator takes the input to the command from the file given on the right-hand
    side. The `>` redirects the output of the command to a file. The `>>` appends
    output of the command at the end of an existing file.


    `ls -l > file1`


    In the preceding example output of `ls -l` command is redirected to `file1`. If
    `file1` already exists, then its contents are replaced by the current output.
    The command being executed is not concerned with where the output is redirected.


    Let us consider two exactly same commands:


    `wc -l file1`


    `output : 10`


    `wc -l < file1`


    `output : 10 file1`


    In the first case shell determines the command `wc` to be executed for counting
    the number of lines in the file `file1`; it opens the file `file1` and counts
    the number of lines.


    In the second case, `wc` executes slightly different. The shell determines the
    input redirection operator `<` when it scans the command line, the word following
    `<` symbol is the name of the file from which input is to be redirected. The shell
    executes `wc` command, redirecting its standard input from the file `file1`.


    ## Command pipelining


    Like redirection operators shell determines the `|` symbol while scanning the
    command line. For each such symbol, the shell transfers the standard output of
    the command preceding `|` to the command following `|` symbol.


    Let us consider the command:


    `ls -l | wc -l`


    The preceding command outputs the total number of files in the current directories.
    The command `ls -l` lists files and directories in the current directory and writes
    the result to the standard output, unaware of the `|` symbol; the output of the
    command is then transferred as standard input to the command `wc -l`, which, when
    then executes and determines that there is the no of files provided as input and
    calculates a total number of lines on the standard input.


    ## Environment customization


    Shell environment contains a set of predefined variables. These variables are
    called environment variables. Shell keeps these variables to control and configure
    behavior of utility programs. The value of shell variables is generally set outside
    the program by the operating system or through microservices. In UNIX, there is
    a large set of environment variables that includes:


    * Path to the user’s home directory: `HOME`

    * Search for shell command: `PATH`

    * Default prompt: `PS1`

    * The terminal type: `TERM`

    * UNIX hostname: `HOSTNAME`


    Shell provides commands to customize the environment.


    ## Shell programming language


    Shell has its own programming language to write shell scripts. In contrast with
    other functional programming languages such as C where the whole program is compiled
    and converted into execution code, the shell programming language is interpreted.
    Shell programming involves using the shell commands and programming language to
    write shell scripts. A shell script is a series of commands written in plain text.
    Shell programming constructs such as if-then-else construct, loops, case construct,
    variables, expressions.


    ## Types of shells


    Like most of the operating systems, the UNIX shell does not built-in rather shell
    is just another program. UNIX shell protects the Kernel as well as the user from
    each other. There are several shells provided by the system, each having different
    features. Different shells can be considered in two shell families—the Bourne
    shell family and C shell family.


    ### The Bourne shell family


    The Bourne shell family consists of three shells the Bourne shell `/bin/sh` and
    the two derivatives of the Bourne shell—Korn shell `/bin/ksh` and Bourne again
    shell `/bin/bash`.


    #### The Bourne shell


    The Bourne shell was developed by Steve Bourne AT&T labs is the oldest UNIX shell.
    This comes bundled with almost all UNIX versions. The unenhanced version of the
    Bourne shell is BASH, which is used in LINUX. The Bourne shell commands are algorithm-style
    programming language (ALOGOL) style.


    #### The Korn shell


    The Korn shell was developed by David G Korn at AT&T labs. It is a superset of
    the Bourne shell and has many more capabilities. The Korn shell incorporates all
    interactive features of the C shell in the Bourne shell’s syntax. Korn shell adds
    the following new features to the Bourne shell:


    * Arrays

    * Filename completion

    * Command aliases

    * Functions

    * Command history and substitution


    Another variant of the Korn shell is POSIX, available with HP-UX 11.0. In HP-UXPOSIX
    is installed in `/bin/sh` and Bourne shell is installed in `/usr/old/bin/sh`.


    #### The BASH (Bourne again) shell


    The bash was developed by Brian Fox of the free software foundation. It is currently
    maintained by Chester Ramey. The unenhanced version of the Bourne shell is BASH,
    which is used in LINUX. Bash provides the following few additional features to
    the Korn shell:


    * An array of unlimited sizes.

    * Correction of the pathname in `cd` command.

    * Integer arithmetic in any base between 2 and 64.

