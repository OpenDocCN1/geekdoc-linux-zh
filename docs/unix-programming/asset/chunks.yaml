  trans: "\n\n# HOME 变量\n\n`HOME` 环境变量由登录过程设置。它指定了登录用户的家目录。当执行不带任何参数的 `cd` 命令时，它会自动进入家目录。\n\
    \n# 提示符字符串 1 (PS1) 变量\n\n`PS1` 变量是一组指定为提示符符号的字符。通常，它是一个“$` 符号。但是，它可以更改为用户想要的任何。\n\
    \n# 提示符字符串 2 (PS2) 变量\n\n当系统认为新行开始但未完成完成时，会显示 `PS2`。通常，它是 `>` 符号。\n\n# MAIL 变量\n\
    \n`MAIL` 变量包含邮箱的地址。`MAIL` 变量在登录过程中的用户配置文件中设置。\n\n# CDPATH 变量\n\n当执行 `cd` 命令更改目录时，shell\
    \ 会搜索当前目录内部的目录。变量 `CDPATH` 包含了用于更改目录时要搜索的附加目录列表。\n\n`$CDPATH=$HOME`\n\n**示例：**\n\
    \n`$cd ch_dir`\n\nShell 在当前目录下查找目录 `ch_dir`；如果在当前目录下未找到 `ch_dir`，shell 将在 `CDPATH`\
    \ 变量定义的目录列表中进行搜索。\n\n# MAILCHECK 变量\n\n`MAILCHECK` 变量指定了 shell 检查邮件的时间和频率。对于 Bourne\
    \ shell，此变量的默认值为 10 分钟。如果未设置此变量，shell 将禁用邮件检查。\n\n**注意：有时将当前目录作为搜索路径可能是危险的；考虑一种情况：如果有人在当前目录创建了程序，那么这个木马将代替实际的\
    \ who 命令被执行**\n\n**注意：如果 `MAILCHECK` 设置为 0，shell 在每次打印主“提示符”符号时都会检查邮件。**\n\n#\
    \ MAILPATH 变量\n\nBourne shell 通过检查 `MAIL` 变量设置的单个目录来提供邮件通知。如果用户想监控多个邮箱，则需要设置 `MAILPATH`\
    \ 变量。`MAILPATH` 变量由冒号分隔的独立文件或目录列表组成，用于检查提供邮件通知。\n\n`$MAILPATH=/usr/spool/mail/George:/usr/spool/mail/cust_query`\n\
    \n**注意：如果设置了 `MAILPATH` 变量，shell 会忽略 `MAIL` 变量。两者不能一起使用。**\n\n此外，登录过程定义了其他环境变量。`TERM`\
    \ 定义终端类型，`USER` 或 `LOGNAME` 定义 `userID`，`SHELL` 定义默认 shell，`TZ` 定义时区。\n\n# 用户配置文件\n\
    \n当用户登录到 UNIX 系统时，shell 显示提示符符号并等待用户输入命令。然而，在显示提示符符号之前，shell 执行两个文件。\n\n第一个文件是\
    \ `/etc/profile`，由系统管理员设置。该文件包含所有使用 Bourne shell (`/bin/sh`) 登录的用户的系统级默认设置。此文件通常执行此类操作，如检查\
    \ `MAIL` 是否设置、默认文件创建掩码 (`umask`) 以及设置标准的导出变量。此文件中的命令是简单的变量赋值。\n\n一个典型的 `/etc/profile`\
    \ 文件如下：\n\n```bash\n#设置文件创建掩码\nunmask 022\n#告诉我新邮件到达的位置\nMAIL=/usr/mail/$LOGNAME\n\
    #将我的 /bin 目录添加到 shell 搜索序列\nPATH=/usr/bin:/usr/sbin:/etc::\n#设置终端类型\nTERM=lft\n\
    #将某些环境变量全局化\nexport MAIL PATH TERM\n```\n\n第二个文件是 `.profile`，由系统管理员设置，并在登录过程将\
    \ `LOGNAME` 和 `HOME` 变量添加到环境变量后，在用户目录下目录下执行。包含了该 shell 的定义并将其导出以自定义用户自己的环境。由于`.profile`\
    \ 存储在用户的家目录下，用户可以更改 `.profile` 以包含用户登录时执行的任何命令。`.profile` 中的命令可以覆盖 `/etc/profile`\
    \ 文件中的设置。\n\n一个典型的 `.profile` 如下：\n\n```bash\nPATH=/usr/bin:/etc:/home/bin1:/home/lpp/tps4.0/user::\n\
    epath=/home/gsc/e3:\nexport PATH epath\ncsh\n```\n\n`.profile` 仅仅是在用户登录时执行的 shell\
    \ 脚本。普通的 UNIX 命令也可以包含在 `.profile` 中。修改 `.profile` 可以为用户创建一个自定义的 UNIX 环境。\n\n**注意：`.profile`\
    \ 不显示在家目录的文件和目录列表中，因为它是一个隐藏文件。要列出它，使用 `ls -a` 命令。**\n\n# 结论\n\nshell 是 UNIX 操作系统的重要组成部分。用户可以通过\
    \ shell 与内核（Kernel）交互。它作为 UNIX 操作系统的命令解释器。大多数系统管理任务都是使用 shell 脚本完成的。本章讨论了 shell\
    \ 所有可能的功能和特性。下一章将逻辑、控制和脚本编写。\n\n# 测试你的技能\n\n1.  哪个变量指定了提示符符号？\n    a) `PS1`\n\
    \    b) `PS2`\n    c) `HOME`\n    d) `USER`\n\n2.  当系统认为新行开始但未完成命令时，显示哪个变量？\n\
    \    a) `PS1`\n    b) `PS2`\n    c) `PATH`\n    d) `USER`\n\n3.  `MAIL` 变量包含什么？\n\
    \    a) 终端类型\n    b) 邮箱地址\n    c) 用户 ID\n    d) 目录搜索路径\n\n4.  当执行 `cd` 命令更改目录时，shell\
    \ 会搜索哪个目录内部的目录？\n    a) `HOME`\n    b) `MAIL`\n    c) `CDPATH`\n    d) `TERM`\n\
    \n5.  `$CDPATH=$HOME`\n    **示例：**\n\n    `$cd ch_dir`\n\n    Shell 在当前目录下查找目录\
    \ `ch_dir`；如果在当前目录下未找到 `ch_dir`，shell 将在 `CDPATH` 变量定义的目录列表中进行搜索。\n\n6.  `MAILCHECK`\
    \ 变量指定了什么？\n    a) 邮箱地址\n    b) shell 检查邮件的时间和频率\n    c) 终端类型\n    d) 默认 shell\n\
    \n7.  如果未设置 `MAILCHECK`，shell 将做什么？\n    a) 每分钟检查邮件\n    b) 禁用邮件检查\n    c) 自动登录\n\
    \    d) 退出系统\n\n8.  **注意：将当前目录作为搜索路径可能是危险的；考虑一种情况：如果有人在当前目录创建了程序，那么这个木马将代替实际的\
    \ who 命令被执行**\n\n9.  **注意：如果 `MAILCHECK` 设置为 0，shell 在什么时候检查邮件？**\n    a) 每 10\
    \ 分钟\n    b) 每次打印主“提示符”符号时\n    c) 只有启动时\n    d) 从不检查\n\n10. Bourne shell 通过检查哪个变量设置的单个目录来提供邮件通知？\n\
    \    a) `PATH`\n    b) `TERM`\n    c) `MAIL`\n    d) `USER`\n\n11. 如果用户想监控多个邮箱，需要设置哪个变量？\n\
    \    a) `MAIL`\n    b) `CDPATH`\n    c) `MAILPATH`\n    d) `HOME`\n\n12. `MAILPATH`\
    \ 变量由什么组成？\n    a) 用户名\n    b) 冒号分隔的独立文件或目录列表\n    c) 二进制代码\n    d) 终端类型\n\n13.\
    \ **注意：如果设置了 `MAILPATH` 变量，shell 会忽略哪个变量？两者不能一起使用。**\n    a) `HOME`\n    b) `MAIL`\n\
    \    c) `TERM`\n    d) `USER`\n\n14. 此外，登录过程定义了其他几个环境变量。`TERM` 定义什么？\n    a) 用户\
    \ ID\n    b) 终端类型\n    c) 时区\n    d) 默认 shell\n\n15. `USER` 或 `LOGNAME` 定义什么？\n\
    \    a) userID\n    b) 家目录\n    c) PATH\n    d) MAIL\n\n16. `SHELL` 定义什么？\n  \
    \  a) 终端类型\n    b) 默认 shell\n    c) 时区\n    d) userID\n\n17. `TZ` 定义什么？\n    a)\
    \ 路径\n    b) 终端类型\n    c) 时区\n    d) 密码\n\n18. 当用户登录到 UNIX 系统时，shell 显示提示符符号并等待用户输入命令。然而，在显示提示符符号之前，shell\
    \ 执行两个文件？\n    a) `/etc/profile`\n    b) `.profile`\n    c) `/bin/sh`\n    d)\
    \ `/etc/passwd`\n\n19. 第一个文件 `/etc/profile` 由谁设置？\n    a) 用户\n    b) 系统管理员\n \
    \   c) 内核\n    d) 编译器\n\n20. `/etc/profile` 包含哪些用户的系统级默认设置？\n    a) 仅 root 用户\n\
    \    b) 所有使用 Bourne shell (`/bin/sh`) 登录的用户\n    c) 仅普通用户\n    d) 访来用户\n\n21.\
    \ 此文件通常执行哪些操作？\n    a) 安装新软件\n    b) 检查 `MAIL` 是否设置、默认文件创建掩码 (`umask`) 以及设置标准的导出变量\n\
    \    c) 删除用户\n    d) 启动图形\n\n22. `/etc/profile` 中的命令是简单的？\n    a) 循环结构\n    b)\
    \ 变量赋值\n    c) 文件删除\n    d) 递归定义\n\n23. 第二个文件 `.profile` 由谁设置？\n    a) 用户\n  \
    \  b) 系统管理员\n    c) 内核\n    d) 编译器\n\n24. `.profile` 在什么时候自动执行？\n    a) 每次启动时\n\
    \    b) 登录过程将 `LOGNAME` 和 `HOME` 变量添加到环境变量后，在用户目录下执行\n    c) 每次保存文件时\n    d) 关机时\n\
    \n25. `.profile` 包含了什么定义并将其导出以自定义用户自己的环境？\n    a) 内核模块\n    b) 多个 shell 变量\n \
    \   c) 硬件驱动\n    d) 网络配置\n\n26. 用户可以更改 `.profile` 是因为？\n    a) 它是隐藏的\n    b) 它用户的家目录下，用户可以更改它以包含什么？\n\
    \    a) 只有系统命令\n    b) 用户登录时执行的任何命令\n    c) 只有删除命令\n    d) 磁盘分区表\n\n27. `.profile`\
    \ 中的命令可以覆盖哪个文件的设置？\n    a) `/etc/passwd`\n    b) `/etc/profile`\n    c) `/bin/ls`\n\
    \    d) `/root`\n\n28. **注意：`.profile` 不显示在家目录的文件和目录列表中，因为是什么？**\n    a) 它是只读的\n\
    \    b) 它是隐藏文件\n    c) 它是加密的\n    d) 它是二进制的\n\n29. 要列出它，使用哪个命令？\n    a) `ls`\n\
    \    b) `ls -l`\n    c) `ls -a`\n    d) `find`\n\n30. shell 是 UNIX 操作系统的什么重要组成部分？\n\
    \    a) 硬件驱动\n    b) 组成部分\n    c) 编译器\n    d) 显示器\n\n31. 用户可以通过 shell 与什么交互？\n\
    \    a) 物理内存\n    b) 内核\n    c) 磁盘驱动\n    d) BIOS\n\n32. shell 充当 UNIX 操作系统的什么？\n\
    \    a) 文件系统管理器\n    b) 命令解释器\n    c) 编辑器\n    d) 编译器\n\n33. 大多数的系统管理任务都是使用什么完成的？\n\
    \    a) 手写\n    b) shell 脚本\n    c) C++ 程序\n    d) 图形界面\n\n34. 本章讨论了 shell 所有可能的功能和特性。下一章包括什么？\n\
    \    a) 硬件安装\n    b) 逻辑、控制和编写脚本\n    c) 驱动开发\n    d) 网络协议\n\n"
- fmt: "\n1. Execute the `who` command and display the result in the file called `file1`.\
    \ Use `more` to see the contents of the file.\n2. Display the long list of files\
    \ and directories in the current directory and send the output to the printer.\n\
    3. What is the difference between backslash, a double quote, and a single quote?\n\
    4. How can we make a duplicate of standard output and send them to two different\
    \ files?\n5. How following two commands are different from each other.\n    1.\
    \ `cal > out_file`\n    2. `cal 1 > out_file`\n6. Consider the command `ls –l\
    \ | tee`\n    1. Where does the input of the `tee` command will come from?\n \
    \   2. How many output files will be created?\n\nEnvironment variables are managed\
    \ by your shell. The difference between environment variables and regular shell\
    \ variables (`6.8`) is that a shell variable is local to a particular instance\
    \ of the shell (such as a shell script), while environment variables are “inherited”\
    \ by any program you start, including another shell (`38.4`). That is, the new\
    \ process gets its own copy of these variables, which it can read, modify, and\
    \ pass on in turn to its own children. In fact, every UNIX process (not just the\
    \ shell) passes its environment variables to its child processes.\n\n# Chapter\
    \ 8\n\n# Shell Programming Using Bourne Shell\n\nThe UNIX operating system has\
    \ emerged as a standard operating system for the development of the application.\
    \ The essence of the UNIX operating system exists in its efficient environment\
    \ for application development. The strength of UNIX lies in its long and sophisticated\
    \ list of more than 200 commands and also the way these commands can be combined\
    \ to perform a more useful function in the form of shell scripts.\n\nA shell simply\
    \ accepts user commands and converts them into a system understandable form. Shell\
    \ also provides fundamental programming concepts to make decisions control the\
    \ execution of scripts and functions.\n\n# Structure\n\nIn this chapter, we will\
    \ cover the following topics:\n\n* Introduction to shell\n* Uses of UNIX shell\n\
    * Writing shell script\n* Understanding basic commands used in shell programming\n\
    * How to control the flow of logic using control commands in shell programming\n\
    \n# Objective\n\nAfter reading this chapter, you will be able to learn to:\n\n\
    * Advanced concepts of the shell as a programming language\n* Features and mode\
    \ of execution of shell\n* Shell programming contracts\n* Control commands in\
    \ shell programming\n\n# Introduction to shell programming\n\nA shell is simply\
    \ a program that acts as an interface to UNIX. The shell is often called as a\
    \ command interpreter because it allows the system to understand the user’s commands.\
    \ There are several shells provided in the system, each has different features,\
    \ but all of them affect how commands are interpreted. The shell provides tools\
    \ to create the UNIX environment. The shell functionality includes control flow\
    \ primitives, variable and string substitution, and parameter passing.\n\nShell\
    \ processing is generally executed in five steps, as discussed in the previous\
    \ chapter. The details of these steps are in the forthcoming section.\n\n# Writing\
    \ shell scripts\n\nShell scripts are used to automate tasks that need to be done\
    \ regularly. They are extensively used by the system administrator. Shell scripts\
    \ save time as you do not have to type the commands every time and can just store\
    \ them in a file as a shell script and run the shell script instead.\n\nA shell\
    \ script can be written directly on the terminal as follows:\n\n```bash\n$ ls\
    \ –l |wc –l\n```\n\nWe can write shell programs by creating scripts containing\
    \ a series of shell commands into a file using an editor like `vi`. Later the\
    \ file can be executed by the shell.\n\n```bash\n$vi my.sh\n```\n\nWe also need\
    \ to specify that the script is executable by setting the proper bits on the file\
    \ with `chmod`:\n\nFor example:\n\n```bash\n$ chmod +x my.sh\n```\n\nWe can then\
    \ execute it on the shell prompt as follows:\n\n```bash\n$ my.sh\n```\n\nOr\n\n\
    ```bash\n$./my.sh\n```\n\nFollowing is an example of a simple shell script:\n\n\
    ```bash\n$vi my.sh\n#my.sh\necho “My first shell script”\necho “Hello $LOGNAME”\n\
    echo “Date is `date`”\n$chmod +x my.sh\n$my.sh\n```\n\nMy first shell script:\n\
    ```\nHello usha\nDate is Wed Feb 22 10:11:37 IST 2006\n```\n\nFrom the first shell\
    \ script, we note that:\n\n* Within the script, `#` indicates a comment from that\
    \ point until the end of the line.\n* `LOGNAME` is an environment variable, and\
    \ `$LOGNAME` is accessing its value.\n* We can substitute the output of a command\
    \ using command substitution by using backquotes as in `date`. Here the date command\
    \ is executed, and its value is substituted in the echo output.\n\n# Variables\n\
    \nAs in all programming languages, the shell also allows to store values into\
    \ variables. We can create our own variables in the shell and assign values. Conventionally,\
    \ the shell variable name starts with an alphabet or underscore (`_`) character\
    \ followed by zero or more alphanumeric values or underscore characters.\n\n```bash\n\
    $param=value\n```\n\nWhere `value` is any valid string and can be enclosed within\
    \ quotations. The value stored in the shell variable can be displayed using the\
    \ `echo` command. Shell uses a `$` symbol followed by the variable name to substitute\
    \ its value, for example:\n\n```bash\n$ echo $param\n```\n\nValues of more than\
    \ one variable can be substituted at the same time:\n\n```bash\n$ echo $param\
    \ $count\n```\n\nIn this case, the shell substitutes the value of param and then\
    \ executes the echo command.\n\nShell variable can be used anywhere on the command\
    \ line once it is declared:\n\n```bash\n$ my_dir=/users/home\n$ ls $my_dir\n```\n\
    \nIn the preceding example, `ls` command will display the contents of `/users/home`\
    \ through the variable `my_dir`.\n\nShell variable can also store command name\
    \ as value:\n\n```bash\n$ my_command=cp\n$ $my_command file1 file2\n```\n\nIn\
    \ the preceding example, the shell first substitutes `cp` in place of `my_command`\
    \ and then executes `cp` command to copy `file1` to `file2`.\n\nIf we try to display\
    \ a variable without assigning any value, the shell does not give any error message;\
    \ instead, it displays blank:\n\n```bash\n$ $var\n```\n\nFollowings are the examples\
    \ of displaying values of different shell variables:\n\n```bash\nCommand: $day=”Monday”\n\
    $echo $day\nOutput: Monday\n\nCommand: $ day=‘date +%a‘\n$ echo $day\nOutput:\
    \ Wed\n```\n\nAfter the parameter values have been assigned, the current value\
    \ of the parameter is accessed using the `$param`, or `${param}` notation.\n\n\
    Some points are required to be considered while assigning values to variables:\n\
    \n* White spaces are not allowed before and after the equal to sign.\n* In the\
    \ shell, programming values are not bound to the data type as in other programming\
    \ languages. The value of the shell variables is always considered as a string\
    \ no matter what type of value is assigned to it. If Value 12 is assigned to the\
    \ variable, it is considered as String 12, not Integer 12.\n* As in other programming\
    \ languages, the shell variable is not required to be declared before use because\
    \ its value is not bound to the data type.\n\n# Comment\n"
  raw: "1.  Execute the who command and display the result in the file called file1\\\
    . Use more to see the contents of the file.\n\n2.  Display the long list of files\
    \ and directories in the current directory and send the output to the printer.\n\
    \n3.  What is the difference between backslash, a double quote, and a single quote?\n\
    \n4.  How can we make a duplicate of standard output and send them to two different\
    \ files?\n\n5.  How following two commands are different from each other.\n\n\
    \    1.  cal > out_file\n\n    2.  cal 1 > out_file\n\n6.  Consider the command\
    \ ls –l | tee\n\n    1.  Where does the input of the tee command will come from?\n\
    \n    2.  How many output files will be created?\n\nEnvironment variables are\
    \ managed by your shell. The difference between environment variables and regular\
    \ shell variables (**6.8**) is that a shell variable is local to a particular\
    \ instance of the shell (such as a shell script), while environment variables\
    \ are “inherited” by any program you start, including another shell (**38.4**).\
    \ That is, the new process gets its own copy of these variables, which it can\
    \ read, modify, and pass on in turn to its own children. In fact, every UNIX process\
    \ (not just the shell) passes its environment variables to its child processes.\n\
    \n# [CHAPTER 8](#toc.xhtml_c08)\n\n# [Shell Programming Using Bourne Shell](#toc.xhtml_c08)\n\
    \nThe UNIX operating system has emerged as a standard operating system for the\
    \ development of the application. The essence of the UNIX operating system exists\
    \ in its efficient environment for application development. The strength of UNIX\
    \ lies in its long and sophisticated list of more than 200 commands and also the\
    \ way these commands can be combined to perform a more useful function in the\
    \ form of shell scripts.\n\nA shell simply accepts user commands and converts\
    \ them into a system understandable form. Shell also provides fundamental programming\
    \ concepts to make decisions control the execution of scripts and functions.\n\
    \n# [Structure](#toc.xhtml_s212a)\n\nIn this chapter, we will cover the following\
    \ topics:\n\n*   Introduction to shell\n\n*   Uses of UNIX shell\n\n*   Writing\
    \ shell script\n\n*   Understanding basic commands used in shell programming\n\
    \n*   How to control the flow of logic using control commands in shell programming\n\
    \n# [Objective](#toc.xhtml_s213a)\n\nAfter reading this chapter, you will be able\
    \ to learn to:\n\n*   Advanced concepts of the shell as a programming language\n\
    \n*   Features and mode of execution of shell\n\n*   Shell programming contracts\n\
    \n*   Control commands in shell programming\n\n# [Introduction to shell programming](#toc.xhtml_s214a)\n\
    \nA shell is simply a program that acts as an interface to UNIX. The shell is\
    \ often called as a command interpreter because it allows the system to understand\
    \ the user’s commands. There are several shells provided in the system, each has\
    \ different features, but all of them affect how commands are interpreted. The\
    \ shell provides tools to create the UNIX environment. The shell functionality\
    \ includes control flow primitives, variable and string substitution, and parameter\
    \ passing.\n\nShell processing is generally executed in five steps, as discussed\
    \ in the previous chapter. The details of these steps are in the forthcoming section.\n\
    \n# [Writing shell scripts](#toc.xhtml_s215a)\n\nShell scripts are used to automate\
    \ tasks that need to be done regularly. They are extensively used by the system\
    \ administrator. Shell scripts save time as you do not have to type the commands\
    \ every time and can just store them in a file as a shell script and run the shell\
    \ script instead.\n\nA shell script can be written directly on the terminal as\
    \ follows:\n\n**`$ ls –l  |wc –l`**\n\nWe can write shell programs by creating\
    \ scripts containing a series of shell commands into a file using an editor like\
    \ vi. Later the file can be executed by the shell.\n\n**`$vi my.sh`**\n\nWe also\
    \ need to specify that the script is executable by setting the proper bits on\
    \ the file with **`chmod`**:\n\nFor example:\n\n**`$ chmod +x my.sh`**\n\nWe can\
    \ then execute it on the shell prompt as follows:\n\n**`$ my.sh`**\n\nOr\n\n**`$./my.sh`**\n\
    \nFollowing is an example of a simple shell script:\n\n**`$vi my.sh`**\n\n**`#my.sh`**\n\
    \n**`echo “My first shell script”`**\n\n**`echo “Hello $LOGNAME”`**\n\n**``echo\
    \ “Date is `date`”``**\n\n**`$chmod +x my.sh`**\n\n**`$my.sh`**\n\nMy first shell\
    \ script:\n\n**`Hello usha`**\n\n**`Date is Wed Feb 22 10:11:37 IST 2006`**\n\n\
    From the first shell script, we note that:\n\n*   Within the script, **`#`** indicates\
    \ a comment from that point until the end of the line.\n\n*   **`LOGNAME`** is\
    \ an environment variable, and **`$LOGNAME`** is accessing its value.\n\n*   We\
    \ can substitute the output of a command using command substitution by using backquotes\
    \ as in date. Here the date command is executed, and its value is substituted\
    \ in the echo output.\n\n# [Variables](#toc.xhtml_s216a)\n\nAs in all programming\
    \ languages, the shell also allows to store values into variables. We can create\
    \ our own variables in the shell and assign values. Conventionally, the shell\
    \ variable name starts with an alphabet or underscore (_) character followed by\
    \ zero or more alphanumeric values or underscore characters.\n\n**`$param=value`**\n\
    \nWhere **`value`** is any valid string and can be enclosed within quotations,\
    \ either single (**`value`**) or double (**`value`**), to allow spaces within\
    \ the string value. When enclosed with backquotes (“value”), the string is first\
    \ evaluated by the shell, and the result is substituted. This is often used to\
    \ run a command, substituting the command output for value.\n\nThe value stored\
    \ in the shell variable can be displayed using the echo command. Shell uses a\
    \ special $ symbol followed by the variable name to substitute its value, for\
    \ example:\n\n**`$ echo $param`**\n\nShell first substitutes value stored inside\
    \ param and then executes the **`echo`** command. Values of more than one variable\
    \ can be substituted at the same time:\n\n**`$ echo $ param $count`**\n\nIn this\
    \ case, the shell substitutes the value of param and count and then executes the\
    \ echo command.\n\nShell variable can be used anywhere on the command line once\
    \ it is declared:\n\n**`$ my_dir=/users/home`**\n\n**`$ ls $my_dir`**\n\nIn the\
    \ preceding example, ls command will display the contents of directory users/home\
    \ through the variable **`my_dir`**.\n\nShell variable can also store command\
    \ name as value:\n\n**`$ my_command=cp`**\n\n**`$ $my_command file1 file2`**\n\
    \nIn the preceding example, the shell first substitutes cp in place of **`my_command`**\
    \ and then executes **`cp`** command to copy **`file1`** to **`file2`**.\n\nIf\
    \ we try to display a variable without assigning any value, the shell does not\
    \ give any error message; instead, it displays blank:\n\n**`$ $var`**\n\nFollowings\
    \ are the examples of displaying values of different shell variables:\n\n**`//\
    \ Command  : $day=”Monday”`**\n\n**`$echo $day`**\n\n**`Output  : Monday`**\n\n\
    **`Command : $ day=‘date +%a‘`**\n\n**`$ echo $day`**\n\n**`Output: : Wed`**\n\
    \nAfter the parameter values have been assigned, the current value of the parameter\
    \ is accessed using the **`$param`**, or **`${param}`** notation.\n\nSome points\
    \ are required to be considered while assigning values to variables:\n\n*   White\
    \ spaces are not allowed before and after the equal to sign.\n\n*   In the shell,\
    \ programming values are not bound to the data type as in other programming languages.\
    \ The value of the shell variables is always considered as a string no matter\
    \ what type of value is assigned to it. If Value 12 is assigned to the variable,\
    \ it is considered as String 12, not Integer 12.\n\n*   As in other programming\
    \ languages, the shell variable is not required to be declared before use because\
    \ its value is not bound to the data type.\n\n# [Comment](#toc.xhtml_s217a)"
