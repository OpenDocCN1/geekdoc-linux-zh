  trans: "\n当一个运行中的进程需要物理内存中的虚拟页，而物理内存中没有可用空间时，就会发生交换。在这种情况下，操作系统会将主内存中的某些页面调出，并从交换设备引入所需的页面。关于哪些页面被换入或换出的决策由调度器（`swapper`）做出。调度器至少每\
    \ 4 秒唤醒一次，以检查哪些进程可以被换出。在主内存中空置很久的最有可能被换出。如果主内存中没有这样的进程，则会选择一个大进程进行换出。被换出长时间且体积较小的进程最有可能被换入。为了防止抖动（thrashing），在主内存中停留一段时间的进程不会被选择换出。被选择换出的进程页面根据其类型移动到不同的位置。数据段的页面被移动到交换空间，栈段的页面被移动到交换空间，映射文件的页面如果已修改且共享，则移动回原始文件。如果映射文件的页面已修改且是私有的，则移动到交换空间。如果映射文件的页面未更改，则将其丢弃。\n\
    \n# 需存分页\n\n需存分页是一种分页策略，在页请求之前，不会将其读取到内存中。需存分页仅将所需的内存页而非整个进程在次级设备之间传输。\n\n内核通过实现页表来实现需存分页。页表将逻辑页地址转换为物理页地址。页表使用二进制标记来检查页的有效性。如果页位于主内存中，则为有效；如果当前位于辅助内存中，则为无效。当进程需要某个页而该页不存在时，会发生页异常中断内核。内核检查辅助内存中的页引用是否有效，并调度磁盘读取操作以换入请求的页。一旦页进入主内存，就会重启被中断的指令。\n\
    \n**注意：Berkeley 通过 BSD（Berkeley System）向 UNIX 引入了需存分页。**\n\n需存分页策略的优点是允许将进程虚拟地址映射到机器物理内存时具有更大的灵活性，通常允许进程的大小大于物理内存容量，并允许更多进程同时放入主内存中。\n\
    \n需存分页策略的缺点是进程在第一次需要某个页时可能会面临额外的延迟。更多的页异常可能会导致抖动，且进程可能面临定时攻击的安全风险。\n\n# mkdir\
    \ 系统调用\n\n`mkdir()` 函数创建一个由 `path` 指向的路径命名的新目录。\n\n**原型：**\n\n```c\nint mkdir(const\
    \ char *path, mode_t mode);\n```\n\n新目录的模式由 `mode` 初始化。`mode` 参数的保护部分会由进程的文件创建掩码修改。\n\
    \n目录的所有者 ID 设置为进程的有效用户 ID。目录的组 ID 设置为进程的有效组 ID；或者如果父目录设置了 `S_ISGID` 位，则目录的组 ID\
    \ 继承自父目录。新目录的 `S_ISGID` 位也从父目录继承。\n\n如果 path 指向一个符号链接，`mkdir()` 将失败并将 `errno`\
    \ 设置为 `EEXIST`。\n\n新创建的目录是空的，除了自身（`.`）和其父目录（`..`）的条目外。\n\n在成功完成后，返回 `0`。否则，返回\
    \ `-1`，不创建目录，并设置 `errno` 以指示错误。\n\n# rmdir 系统调用\n\n`rmdir()` 系统调用删除名称由 `path`\
    \ 指定目录文件。该目录不能包含除 “.” 和 “..” 之外的任何条目。\n\n**原型：**\n\n```c\nint rmdir(const char\
    \ *path);\n```\n\n`rmdir()` 函数成功时返回值 `0`；否则返回值 `-1`，并设置全局变量 `errno` 以指示错误。\n\n\
    在删除目录条目之前，系统会检查链接计数项（`ls -l` 命令），以识别要删除的目录是否被其他进程打开。只有当在该调用时目录的链接数为 0 且没有其他进程打开该目录时，目录才会被删除，然后释放该目录占据的空间。\n\
    \n# 内存管理函数\n\n变量的内存可以动态分配和释放。\n\n# malloc() 函数\n\n`malloc` 需要一个参数 - 你想要动态分配的字节数。\n\
    \n如果内存分配成功，`malloc` 将返回一个空指针。你可以将其赋值给一个指针变量，该变量将存储分配内存的地址。\n\n如果内存分配失败（例如，内存溢出），`malloc`\
    \ 将返回一个 NULL 指针。\n\n# free() 函数\n\n将指针传递给 `free` 将释放已分配的内存。在完成使用后释放内存是一个良好的习惯。\n\
    \n```c\nvoid free(void *ptr);\n```\n\n其中 `ptr` 是指针。\n\n考虑以下示例：\n\n```c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n\nint main() {\n    int number;\n    int *ptr;\n\
    \    ptr = (int*)malloc(sizeof(int));\n    if (ptr != NULL) {\n        *ptr =\
    \ 10;\n        printf(\"Value: %d\\n\", *ptr);\n        free(ptr);\n    } else\
    \ {\n        printf(\"Memory failed\\n\");\n    }\n    return 0;\n}\n```\n\n#\
