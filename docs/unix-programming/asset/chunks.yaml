    \ and port number to which the data is being sent, `addrlen` is the size of the\
    \ preceding `sockaddr` in the data structure.\n\n# Closing socket\n\nThe `close()`\
    \ system call is used to close the socket.\n\n**Prototype**\n\n```\nvoid close(sockfd);\n\
    ```\n\nLet us see an example of the client and server programs.\n\n# Client program\n\
    \nThe following is the code for the client side:\n\n```c\n#include <stdio.h>\n\
