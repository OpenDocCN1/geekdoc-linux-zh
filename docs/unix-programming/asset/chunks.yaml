- fmt: "\nThe communication between processes is synchronized using signals and semaphores.\
    \ The C library functions and system calls are available for interprocess communication.\n\
    \nIn a UNIX environment, the shared information can reside at different levels.\
    \ The method of IPC used to share information is dependent on where information\
    \ is available. The IPC methods corresponding to the availability of information\
    \ are listed following:\n\n* If the information to be shared is residing in a\
    \ file in the file system, then Kernel system calls such as `read()`, `write()`,\
    \ and so on are used to share the information between the processes. Some synchronization\
    \ is needed when the file is being updated.\n* If information is residing in the\
    \ pipes, message queue, and semaphores, Kernel system calls corresponding to these\
    \ data structures are used to share information between cooperative processes.\n\
    * Two processes can directly access information if it is available in shared memory.\
    \ Once shared memory is set up by the processes, then for communication, Kernel\
    \ involvement is not required.\n* Two processes can share information by residing\
    \ in a file in the file system. The Kernel system calls for files that are used\
    \ to access information in files. Some synchronization is needed when the file\
    \ is being updated.\n* Two processes can share information that resides within\
    \ the Kernel. Pipes, message queues, and semaphores are used to share the information.\n\
    * Two processes can refer to a region of shared memory. Once the shared memory\
    \ is set up by the processes, two processes can access information without involving\
    \ the Kernel at all.\n\n![](images/Figure-4.3.jpg)\n\n**Figure 4.3:** Information\
    \ sharing among processes\n\n# Pipes and FiFOs\n\nThrough pipes, the output of\
    \ one process is made the input of another process, as shown in [figure 4.4](#c04.xhtml_fig4_4).\
    \ One process writes data on the pipe, and at the same time, the other process\
    \ reads data from the pipe. The pipe must be open before use.\n\nThe `pipe()`\
    \ system call creates a pipe and returns two file descriptors, `fd[0]`, `fd[1]`.\
    \ `fd[0]` is opened for reading, and `fd[1]` is opened for writing. `pipe()` returns\
    \ `0` on success, `-1` on failure and sets errno accordingly.\n\nIn the standard\
    \ programming model, once the pipe has been set up, two (or more) cooperative\
    \ processes will be created by a fork, and data will be passed using `read()`\
    \ and `write()`.\n\n![](images/Figure-4.4.jpg)\n\n**Figure 4.4:** Reading and\
    \ writing pipe\n\nAfter use, pipes should be closed with `close(int fd)`.\n\n\
    **Example:**\n\nIn the given example, a pipe is created using `pipe()` System\
    \ call. The parent process writes the message at one end of the pipe when it is\
    \ executed, and the child process reads the same message from the other end of\
    \ the pipe:\n\n```\nvoid main()\n{\n  int fd[2];\n  pipe(fd);\n  if ( fork() ==\
    \ 0 )\n  { /* child  process*/\n    close(fd[1]);   /* fd[1] is not  used in this\
    \ process*/\n    printf(\"\\n read data from parent );\n    read( fd[0]); /* read\
    \ from parent */\n  }\n  else\n  {  close(fd[0]);   /* not used in this process\
    \ */\n    printf(\"\\n Write data to child process\\n\");\n    write( fd[1]);\n\
    \  }\n  exit(0)\n}\n```\n\n# One end closed pipe\n\nIf a read operation is performed\
    \ from the pipe whose write end is closed, the read returns 0 to indicate the\
    \ end of the file.\n\nIf the write operation is done whose read end is closed,\
    \ then the SIGPIPE is generated. If we either ignore or catch it and return it\
    \ from the signal handler, write returns an error with the errno set to EPIPE.\n\
    \n# The popen() I/O library function\n\nThe `popen()` is a standard I/O library\
    \ function that creates a pipe and forks another process to read from or write\
    \ in the pipe.\n\n**Prototype:**\n\n```\nFILE *popen(char *cmd, char *type);\n\
    ```\n\nThe `cmd` is the shell command. The function `popen` forks and executes\
    \ the `cmd` command and returns a FILE pointer that is used for either input or\
    \ output depending upon the character string type.\n\nIf the value of type is\
    \ `r`, then the calling process reads the standard output of the command. If the\
    \ value of type is `w`, then the calling process writes to the standard input\
    \ of the command. In case of failure, `popen()` returns NULL.\n\n# The pclose()\
    \ I/O function\n\nThe `pclose()` function closes the I/O stream created by the\
    \ `popen()` function. It returns an exit status of the command executed or –1\
    \ if the stream is not created.\n\n**Prototype:**\n\n```\nint pclose(FILE *stream);\n\
    ```\n\n**Example:**\n\nIn the given example, `popen()` function executes the `who`\
    \ command, and the output is written in the file pointed by `fp` pointer. The\
    \ `fgets()` function reads the file and stores the data in the character string\
    \ user. The contents of user are printed using `printf()`.\n\n```\n#include <stdio.h>\n\
    main()\n{\n  FILE *fp;\n  char user[130];\n  fp = popen(\"who\", \"r\");\n  while\
    \ ( fgets(user, sizeof(user), fp))\n  {\n    printf(\"%s\", user);\n  }\n  pclose(fp);\n\
    }\n```\n\n# FIFOs\n\nA FIFO i.e. First In Out is named pipe. A FIFO allows one-way\
    \ data flow between processes; however, FIFO allows unrelated processes to access.\
    \ FIFO is a file that exists in the file system.\n\n# Creating FIFO\n\nA FIFO\
    \ is created using `mknode()` system call, which is generally reserved for superuser\
    \ to create a directory entry.\n\n**Prototype:**\n\n```\nint mkfifo(const char\
    \ *pathname, mode_t node);\n```\n\nWhere `pathname` is the UNIX name of the fifo.\
    \ The `mode` contains open permission on the file. The `mkfifo()` returns an error\
    \ EEXIST if FIFO already exists.\n\n**Example:**\n\nIn the given example, a FIFO\
    \ named fifo is created with read and write permission from the owner. An abnormal\
    \ termination occurs if FIFO already exists; otherwise, the program is terminated\
    \ normally.\n\n```\n#include <stdlib.h>\nmain()\n{\n  int rc;\n  int fifo_fds;\n\
    \  char data[100];\n  rc = mkfifo(\"fifo\", S_IRUSR | S_IWUSR);\n  if (rc != 0)\
    \ {\n    perror(\"mkfifo failure\");\n    exit(1);\n  }\n  exit(0);\n}\n```\n\n\
    # Interprocess communication using FIFO\n\nA FIFO is named pipe, and it is used\
    \ for inter-process communication between two cooperating processes compared to\
    \ the pipe, which is used to communicate between parent and child. The two processes\
    \ communicating with each other are treated as server and client processes, as\
    \ shown in [figure 4.5](#c04.xhtml_fig4_5).\n\n![](images/Figure-4.5.jpg)\n\n\
    **Figure 4.5:** Data transfer using FIFOs\n\n# Server process\n\nA FIFO is created\
    \ and opened in the server process to accept client requests. The client request\
    \ is read using the read function.\n\nIn the server process, FIFO should be opened\
    \ for both reading and writing because if the client terminates, server’s read\
    \ will return 0 to show end-of-file, the server has to close FIFO and open it\
    \ again in O_RDONLY mode, and the server will block until the next client request\
    \ arrives. In the case of FIFO, which is always open for reading and writing,\
    \ server read will never return 0.\n\nInstead, the server will just block in a\
    \ call to read, waiting for the next client request.\n"
  raw: 'The communication between processes is synchronized using signals and semaphores.
    The C library functions and system calls are available for interprocess communication.


    In a UNIX environment, the shared information can reside at different levels.
    The method of IPC used to share information is dependent on where information
    is available. The IPC methods corresponding to the availability of information
    are listed following:


    *   If the information to be shared is residing in a file in the file system,
    then Kernel system calls such as **`read()`**, **`write()`**, and so on are used
    to share the information between the processes. Some synchronization is needed
    when the file is being updated.


    *   If information is residing in the pipes, message queue, and semaphores, Kernel
    system calls corresponding to these data structures are used to share information
    between cooperative processes.


    *   Two processes can directly access information if it is available in shared
    memory. Once shared memory is set up by the processes, then for communication,
    Kernel involvement is not required.


    *   Two processes can share information by residing in a file in the file system.
    The Kernel system calls for files that are used to access information in files.
    Some synchronization is needed when the file is being updated.


    *   Two processes can share information that resides within the Kernel. Pipes,
    message queues, and semaphores are used to share the information.


    *   Two processes can refer to a region of shared memory. Once the shared memory
    is set up by the processes, two processes can access information without involving
    the Kernel at all.


    ![](images/Figure-4.3.jpg)


    **Figure 4.3:** Information sharing among processes


    # [Pipes and FiFOs](#toc.xhtml_s97a)


    Through pipes, the output of one process is made the input of another process,
    as shown in *[figure 4.4](#c04.xhtml_fig4_4)*. One process writes data on the
    pipe, and at the same time, the other process reads data from the pipe. The pipe
    must be open before use.


    The **`pipe()`** system call creates a pipe and returns two file descriptors,
    **`fd[0]`**, **`fd[1]`**, **`fd[0]`** is opened for reading, and **`fd[1]`** is
    opened for writing. **`pipe()`** returns **`0`** on success, **`-1`** on failure
    and sets errno accordingly.


    In the standard programming model, once the pipe has been set up, two (or more)
    cooperative processes will be created by a fork, and data will be passed using
    **`read()`** and **`write()`**.


    ![](images/Figure-4.4.jpg)


    **Figure 4.4:** Reading and writing pipe


    After use, pipes should be closed with **`close(int fd)`**.


    **Example:**


    In the given example, a pipe is created using **`pipe()`** System call. The parent
    process writes the message at one end of the pipe when it is executed, and the
    child process reads the same message from the other end of the pipe:


    `void main()`


    `{`


    `int fd[2];`


    `pipe(fd);`


    `if ( fork() == 0 )`


    `{ /* child  process*/`


    `close(fd[1]);    /* fd[1] is not  used in this process*/`


    `printf(“\n read data from parent );`


    `read( fd[0]); /* read from parent */`


    `}`


    `else`


    `{   close(fd[0]);   /* not used in this process */`


    `printf(“\n Write data to child process\n”)_;`


    `write( fd[1]);`


    `}`


    `exit(0)`


    `}`


    # [One end closed pipe](#toc.xhtml_s98a)


    If a read operation is performed from the pipe whose write end is closed, the
    read returns 0 to indicate the end of the file.


    If the write operation is done whose read end is closed, then the SIGPIPE is generated.
    If we either ignore or catch it and return it from the signal handler, write returns
    an error with the errno set to EPIPE.


    # [The popen() I/O library function](#toc.xhtml_s99a)


    The **`popen()`** is a standard I/O library function that creates a pipe and forks
    another process to read from or write in the pipe.


    **Prototype:**


    `FILE *popen(char *cmd, char *type);`


    The **`cmd`** is the shell command. The function **`popen`** forks and executes
    the **`cmd`** command and returns a FILE pointer that is used for either input
    or output depending upon the character string type.


    If the value of type is **`r`**, then the calling process reads the standard output
    of the command. If the value of type is **`w`**, then the calling process writes
    to the standard input of the command. In case of failure, **`popen()`** returns
    NULL.


    # [The pclose() I/O function](#toc.xhtml_s100a)


    The **`pclose()`** function closes the I/O stream created by the **`popen()`**
    function. It returns an exit status of the command executed or –1 if the stream
    is not created.


    **Prototype:**


    `int pclose(FILE *stream);`


    **Example:**


    In the given example, **`popen()`** function executes the **`who`** command, and
    the output is written in the file pointed by **`fp`** pointer. The **`fgets()`**
    function reads the file and stores the data in the character string user. The
    contents of the user string are printed on the standard output using **`printf()`**
    function, and then the pipe is closed using **`pclose()`** function.


    `include <stdio.h>`


    `main()`


    `{`


    `FILE *fp;`


    `char user[130];   /* line of data from unix command*/`


    `fp = popen(“who”, “r”);  /* Issue the command.  */`


    `/* Read a line file pointed by fp*/`


    `while ( fgets( user, sizeof (user), fp))`


    `{`


    `printf(“%s”, user);`


    `}`


    `pclose(fp);`


    `}`


    # [FIFOs](#toc.xhtml_s101a)


    A FIFO i.e. First In First Out is named pipe. A UNIX FIFO allows one-way data
    flow between processes; however, with FIFO, a name is also associated. A FIFO
    allows unrelated processes to access a single FIFO.


    FIFO is a file that has a directory entry and is accessed by pathname. It permanently
    exists in the file system hierarchy.


    # Creating FIFO


    A FIFO is created using **`mknode()`** system call, which is generally reserved
    for a superuser to create a directory entry, but any user can create FIFO using
    **`mkfifo`** system call.


    **Prototype:**


    `int mkfifo(const char *pathname, node_t node);`


    Where **`pathname`** is the UNIX pathname name of the fifo. The **`node`** contains
    open permission on the file specified in the pathname.


    The **`mkfifo()`** returns an error EEXIST if FIFO already exists. Once FIFO is
    created, it must be opened for reading or writing using either **`open()`** system
    call or standard I/O library function **`fopen()`**.


    **Example:**


    In the given example, a FIFO named fifo is created with read and write permission
    from the owner. An abnormal termination occurs if FIFO already exists; otherwise,
    the program is terminated normally.


    `#include <stdlib.h>`


    `main()`


    `{`


    `int rc;`


    `int fifo_fds;`


    `char data[100];`


    `rc = mkfifo(“fifo”, S_IRUSR | S_IWUSR);`


    `if (rc != 0) {`


    `perror(“mkfifo failure”);`


    `exit(1);`


    `}`


    `exit(0);                            /* EXIT_SUCCESS */`


    `}`


    # Interprocess communication using FIFO


    A FIFO is named pipe, and it is used for inter-process communication between two
    cooperating processes compared to the pipe, which is used to communicate between
    parent and child. The two processes communicating with each other are treated
    as server and client processes, as shown in *[figure 4.5](#c04.xhtml_fig4_5)*.


    ![](images/Figure-4.5.jpg)


    **Figure 4.5:** Data transfer using FIFOs


    # [Server process](#toc.xhtml_s102a)


    A FIFO is created and opened in the server process to accept client requests.
    The client request is read using the read function.


    In the server process, FIFO should be opened for both reading and writing because
    if the client terminates, server’s read will return 0 to show end-of-file, the
    server has to close FIFO and open it again in O_RDONLY mode, and the server will
    block until the next client request arrives. In the case of FIFO, which is always
    open for reading and writing, server read will never return 0.


    Instead, the server will just block in a call to read, waiting for the next client
    request.


