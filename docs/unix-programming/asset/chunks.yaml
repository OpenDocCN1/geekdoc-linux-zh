    \ /* 写权限：其他 */\n#define S_IXOTH 00001 /* 执行权限：其他 */\n```\n\n## 用户文件创建模式—umask()\
    \ 调用\n\nUNIX 使用四位八进制数字 `umask` 来决定新创建文件的文件权限。每个进程都有自己的 `umask`，继承自其父进程。\n\n`umask()`\
