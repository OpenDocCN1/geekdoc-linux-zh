    3. What are the processes that are not bothered by the swapper? Give reason.\n\
    4. Why UNIX does not allow the paging-out of Kernel memory?\n\n# CHAPTER 7 (#toc.xhtml_c07)\n\
    \n# UNIX Shell and Custom Environment (#toc.xhtml_c07)\n\nAs we know, the most\
    \ visible part of the UNIX operating system is the shell, and this makes it the\
    \ most important component to be known to the users. To perform any task, we must\
    \ give a command to the shell. If the command needs a utility or an application\
    \ program, the shell requests Kernel to execute it. A shell has two parts; the\
    \ first is an interpreter, which takes the user’s command and converts it to the\
    \ system’s understandable form. The second component is the shell’s programming\
    \ capability that allows us to the right shell script. Another important function\
    \ performed by the shell is customizing the environment to work in. In this chapter,\
    \ we will closely look at the types, features, and functions of the shell as an\
    \ interpreter and environment customizer.\n\n# Structure (#toc.xhtml_s169a)\n\n\
    We will cover the following topics in this chapter:\n\n* Functionality and execution\
    \ modes of UNIX’s shell.\n* Shell execution cycle\n* Features provided by an available\
    \ standard shell in the UNIX\n* Significance and uses of shell metacters\n* Avoiding\
    \ interpretation using escaping and quoting\n* Using standard input and output\
    \ using redirections\n* Using noclobber option and `/dev/null`\n* Grouping commands\n\
    * Pipelining different commands\n* Customizing environment using shell variables\n\
    * Understanding user’s profiles\n\n# Objectives (#toc.xhtml_s170a)\n\nAfter going\
    \ through this chapter, you will be able to:\n\n* Understand the fundamentals\
    \ and functionality of shell\n* Understand different functional modes of shell\n\
    * Understand concepts involved in executing shell\n* Understand command grouping\
    \ and pipining\n* Understand user’s profiling\n\n# Introduction to shell (#toc.xhtml_s171a)\n\
    \nA shell is simply a program that acts as an interface UNIX. The shell is often\
    \ called as a command interpreter because it allows the system to understand the\
    \ user’s commands. There are several shells provided by the system, each having\
    \ different features, but all of them affect how commands are interpreted. The\
    \ shell provides tools to create the UNIX environment.\n\nThe shell is a utility\
    \ in UNIX. It is loaded into the memory when the user logs in the system. The\
    \ shell to be executed during the login process is listed in `/etc/passwd` file\
    \ corresponding to the respective entry of the user. If no shell is specified\
    \ in the `/etc/passwd` file, the standard shell `/usr/bin/sh` is executed by default.\n\
    \n# Execution modes of UNIX shell (#toc.xhtml_s172a)\n\nUNIX shell is basically\
    \ executed in the following three mode:\n\n1. Interactive mode\n2. Shell programming\
    \ mode\n3. UNIX session customization mode\n\n# Interactive mode (#toc.xhtml_s173a)\n\
    \nIn the interactive mode, the shell waits for the user to enter the command,\
    \ which is then interpreted by the shell. The command gets executed after removing\
    \ all errors. The command may include special symbols to abbreviate filenames\
    \ and to redirect input and output.\n\n# Programming mode (#toc.xhtml_s174a)\n\
    \nIn the programming mode, the system executes a set of UNIX commands together\
    \ in the form of a shell script. Many built-in commands are grouped together in\
    \ the form of a shell script. In contrast with the interactive mode, the script\
    \ can be preserved and can be executed layer also.\n\n# UNIX session customization\
    \ mode (#toc.xhtml_s175a)\n"
