    # [Message queues](#toc.xhtml_s104a)


    The message queue is the Kernel resident means of the IPC. Message queues are
    stored within the Kernel in the form of a linked list. An identifier identifies
    each message queue. Processes read and write messages to arbitrary queues. It
    is possible for a process to write some messages on the queue and exit and have
    the messages read by another process at a later time.


    Each message on a queue has the following attributes:


    *   Long integer type message queue identifier.


    *   Length of the data portion of the message.


    *   Data.


    Kernel maintains a data structure **`msqid_ds`** for every message queue, as follows:


    `/* one msqid structure for each queue on the system */`


    `struct msqid_ds {`


    `struct ipc_perm msg_perm;`


    `struct msg *msg_first;  /* first message on queue */`


    `struct msg *msg_last;   /* last message in queue */`


    `time_t msg_stime;       /* last msgsnd time */`


    `time_t msg_rtime;       /* last msgrcv time */`


    `time_t msg_ctime;       /* last change time */`


    `struct wait_queue *wwait;`


    `struct wait_queue *rwait;`


    `ushort msg_cbytes;`


    `ushort msg_qnum;`


    `ushort msg_qbytes;      /* max number of bytes on queue */`


    `ushort msg_lspid;       /* pid of last msgsnd */`


    `ushort msg_lrpid;       /* last receive pid */`


    `}`


    Let us discuss some of them as follows:


    *   **`msg_perm`**: Object of the **`ipc_perm`** structure defined in **`linux/ipc.h`**.
    This holds the permission information for the message queue, including the access
    permissions and information about the user who created the message queue (**`uid`**).


    *   **`msg_first`**: Contains a pointer to the first message in the message queue
    (the head of the list).


    *   **`msg_last`**: Contains a pointer to the last message in the message queue
    (the tail of the list).


    *   **`msg_stime`**: Timestamp (**`time_t`**) of the last message sent to the
    queue.


    *   **`msg_rtime`**: Timestamp of the last message retrieved from the queue.


    *   **`msg_ctime`**: Timestamp of the last “change’’ made to the queue.


    *   **`wwait`** and **`rwait`**: Pointers into the Kernel’s wait queue. They are
    used when an operation on a message queue deems the process to go into a sleep
    state (that is, the queue is full, and the process is waiting for an opening).


    *   **`msg_cbytes`**: Total number of bytes residing on the queue (sum of the
    sizes of all messages).


    *   **`msg_qnum`**: Total number of messages currently in the message queue.


    *   **`msg_qbytes`**: Maximum number of bytes that can reside on the message queue.


    *   **`msg_lspid`**: The process ID of the process sent the last message.


    *   **`msg_lrpid`**: The PID of the process retrieved the last message.


    # Creating and opening a message queue


    A process can create a new message queue, or it can connect to an existing message
    queue. The **`msgget()`** function is used for both creation and connection.


    **Prototype**


    `int msgget(key_t key, int msgflg);`


    The key is a system-wide unique queue identifier describing the queue. The process
    of creating the message queue generates a key identifier, and other processes
    use this key to connect to the queue. The **`msgflg`** argument is a flag that
    contains read-write permission, which can be bitwise OR with **`IPC_CREAT`** or
    **`IPC_EXCT`** to create a new message queue or connect to an existing message
    queue.


    Following members of **`msgid_ds`** structure are initialized when a new message
    queue is created:


    *   **`msg_qbytes`**: Set to the system limit.


    *   **`msg_ctime`**: Set to the current time.


    *   **`msg_perm.mode`**: Contain read-write permission from **`msgflg`** argument.


    *   **`msg_qnum`**: Set to **`0`**.


    *   **`msg_lspid`**: Set to **`0`**.


    *   **`msg_lrpid`**: Set to **`0`**.


    *   **`msg_stime`**: Set to **`0`**.


    *   **`msg_rtime`**: Set to **`0`**.


    *   **`msg_perm.uid`** and **`msg_perm.cuid`**: Set to the effective user ID of
    the process.


    *   **`msg_perm.gid`** and **`msg_perm.cgid`**: Set to the effective group ID
    of the process.


    **`msgget()`** returns the message queue ID on success or −1 on failure


    # Sending a message to the queue


    The **`msgsnd()`** function is used to send a message to the message queue.


    **Prototype:**


    `int msgsnd(int msqid, const void *msgp, size_t msgsz, int msgflg);`


    **`msqid`** is the message queue identifier returned by **`msgget()`**. The pointer
    **`msgp`** is a pointer to the message to put on the queue. Message is defined
    in **`sys/msg.h`** file in the form of structure **`msgbuf`**, as follows:


    `struct msgbuf {`


    `long mtype;`


    `char mtext[[1];`


    `}`


    There is no limit on the length of the **`mtext`** at compile time; rather, the
    limit is set by the system administrator. **`msgsz`** is the size in bytes of
    the message. **`msgflg`** is set to either **`0`** or **`IPC_NOWAIT`**.


    The function returns as follows:


    *   If too many messages are available.


    *   If the number of bytes on the message queue exceeds the **`msg_qbyte`** limit.


    If **`msgflg`** is set to **`IPC_NOWAIT`**, then the function returns the error
    **`EAGAIN`**, and if **`msgflg`** is not set to **`IPC_NOWAIT`**, then the thread
    is put to sleep.


    **Example:**


    In this given example, the process creates a message queue for writing a message.
    If message queue is not created an error message will be printed and program exits
    abnormally. Once message queue is created successfully, a message is read from
    keyboard and sent to the queue. In case of error message queue will be destroyed:


    `#include <stdio.h>`


    `#include <stdlib.h>`


    `#include <errno.h>`


    `#include <sys/types.h>`


    `#include <sys/ipc.h>`


    `#include <sys/msg.h>`


    `struct msgbuf {`


    `long mtype;`


    `char mtext[200];`


    `};`


    `int main(void)`


    `{`


    `struct msgbuf buf;`


    `int msqid;`


    `key_t key= 100;`'
