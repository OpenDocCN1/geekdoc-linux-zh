    # Objective


    After reading this chapter, you will be able to:


    * Understand concepts and types of sockets for communication between server and
    client.

    * Understand execution of various system calls involved in socket communication.

    * Understand I/O models to facilitate socket communication.

    * Understand system calls used for the name to address calculation.


    # Socket


    The socket is an interface between an application process and the transport layer.
    The socket is a medium through which an application process can send/receive messages
    to/from another local or remote application process. This type of communication
    is commonly used between server processes and client processes.


    In UNIX, sockets are called UNIX domain sockets because sockets can be used to
    communicate between processes residing on a single host only. In UNIX, a socket
    is defined by a file descriptor—an integer associated with an open file. In contrast,
    Internet domain sockets support various communication protocols. Sockets can be
    supported by the Kernel or as a library that translates calls to the native network
    API. The following figure illustrates the socket diagram:


    ![](images/Figure-5.1.jpg)


    **Figure 5.1:** Socket


    # Types of sockets


    While creating the socket, the program needs to specify the address domain and
    the type of socket to be created, and two processes are allowed to communicate
    with each other only if the socket through which they are communicating is in
    the same domain and has the same socket type.


    The two widely used socket address domains are the UNIX domain and the Internet
    domain. In the UNIX domain, the processes sharing a common file system can communicate
    with each other, while in the Internet domain, the processes are not necessarily
    in the same file system; rather, they can reside on any hosts on the Internet
    to communicate with each other. Both the domain types have their own address formats.
    In the UNIX domain, the address has an entry in the file system and is represented
    by a character string. In the Internet domain, the socket address is represented
    by the 32-bit IP address of a host machine on the Internet. In the Internet domain
    socket also need a port number to represent a 16-bit unsigned integer.


    # Socket data structure


    Information about the socket is stored in a data structure named as `sockaddr`.
    The `sockaddr` structure contains two elements `sa_family` and `sa_data`. The
    `sa_family` element stores the protocol addresses.


    ```c

    struct sockaddr {

    unsigned short sa_family; //address family AF_xxx

    unsigned short sa_data[14]; //14 bytes of protocol addr

    }

    ```


    # System calls for socket communication


    Socket communication is established on the client-side by the following:


    * Creating a socket with the `socket()` system call.

    * Connecting the newly created socket to the address of the server using the `connect()`
    system call.

    * Sending and receiving data with `read()` and `write()` system calls.


    Socket communication is established on the server-side by the following:


    * Creating a socket with the `socket()` system call.

    * Binding the newly created socket to an address using the `bind()` system call.
    For a server socket on the Internet, an address consists of a port number on the
    host machine.

    * Listening for connections with the `listen()` system call.

    * Accepting a connection request from a client with the `accept()` system call.
    This call typically blocks until a client connects with the server.

    * Sending and receiving data with the `read()` and `write()` calls.


    [Table 5.1] shows the set of functions used for communication between server and
    client through sockets in both TCP and UDP protocols.


    | Protocol type | Client | Server |

    | :--- | :--- | :--- |

    | Connection-oriented TCP | `socket()` | `socket()` |

    | | `connect()` | `bind()` |

    | | | `listen()` |

    | | | `accept()` |

    | | `send()` | `recv()` |

    | | `recv()` | `send()` |

    | connectionless UDP | `socket()` | `socket()` |

    | | | `bind()` |

    | | `sendto()` | `recvfrom()` |

    | | `recvfrom()` | `sendto()` |


    **Table 5.1:** Different socket related system calls


    # Creating a socket (server and client)


    The `socket()` system call creates the socket and returns a unique file descriptor
    for the socket. The socket can either be a stream (TCP) socket or a datagram (UDP)
    socket depending on the input arguments.


    **Prototype:**


    ```c

    int socket(int domain, int type, int protocol);

    ```


    The domain argument is set to `AF_INET` or `PF_INET`, the type argument specifies
    the kind of socket and is set to `SOCK_STREAM` for TCP streams (telnet, HTTP,
    and so on) or to `SOCK_DGRAM` for UDP datagrams; the protocol takes value 0 to
    automatically select the correct protocol based on type or `IPPROTO_TCP` to select
    TCP protocol or `IPPROTO_UDP` to select UDP protocol.


    # Binding socket to an address (server)


    The `bind()` system call is used to associate `sockfd` with a port on the local
    machine. This function needs to be called for the server. It returns -1 if there
    is an error.


    **Prototype:**


    ```c

    int bind(int sockfd, struct sockaddr *addr, int addrlen);

    ```


    The first argument `sockfd` is the value returned by the `socket()` system call,
    and `addr` is the `sockaddr` in the data structure containing the IP address,
    `addrlen` is the size of the `sockaddr`.


    # Listening incoming connection


    The `listen()` system call listens for incoming connections. It only needs to
    be called by the server for connection-oriented (TCP) sockets. The function returns
    -1 on an error.


    **Prototype:**


    ```c

    int listen(int sockfd, int backlog);

    ```


    The `sockfd` is the value returned by the `socket()` function call, and the `backlog`
    is the maximum number of connections allowed in the incoming queue. Incoming connections
    remain in the queue until it is accepted by the server.


    # Initiating connection


    The client calls `connect()` system call to initiate a connection to a server.
    It is used for connection-oriented (TCP) sockets. The system call returns -1 on
    an error.


    **Prototype:**


    ```c

    int connect(int sockfd, struct sockaddr *addr, int addrlen);

    ```


    The `sockfd` is the value returned by the `socket()` function call, `addr` is
    the `sockaddr` containing the IP address and port number of the server, and `addrlen`
    is the size of the `sockaddr`.


    # Accepting the connection from the incoming queue


    The server uses `accept()` system call to accept a connection from the incoming
    queue associated with the socket `sockfd`. It is used for connection-oriented
    (TCP) sockets. The system call returns a new socket file descriptor, which can
    be used to send and receive information on the connection. The system call returns
    `-1` on an error.


    **Prototype:**


    ```c

    int accept(int sockfd, void *addr, int *addrlen);

    ```


    The `sockfd` is the socket descriptor for the socket that is listening for connections.
    `addr` is a pointer to a local `sockaddr` containing the IP address and port number
    of the incoming connecting client. This data structure is different from the one
    that contains the IP address and port number of the server; `addrlen` is the size
    of the preceding `sockaddr` in the data structure.


    # Sending data through socket (connection-oriented)

    '
