    # [Process states](#toc.xhtml_s20a)


    The lifetime of a process can be modeled by a set of states, and each process
    can be in any of the states at one point in time. In UNIX, the process may undergo
    a total of nine stages during its lifecycle, as shown in `[figure 1.3](#c01.xhtml_fig1_3)`:


    ![](images/Figure-1.3.jpg)


    **Figure 1.3:** UNIX process sates


    The description of each process state is shown in `[table 1.2](#c01.xhtml_tab1_2)`:


    | Process states | Description |

    | :--- | :--- |

    | Executing (user mode) | Running in user mode. |

    | Executing (Kernel-mode) | Running in kernel mode. |

    | Ready in memory | Ready to run as soon as kernel schedules it |

    | Ready in swap device | Process is ready to run but must be swapped in memory
    so that Kernel can schedule it. |

    | Sleeping in memory | Unable to execute, waiting for an event to occur. |

    | Sleeping in swap device | Process is blocked and awaiting an event in swap device.
    |

    | Preempted | Process is returning from Kernel to user mode, but Kernel preempts
    to schedule another process. |

    | Created | The newly created process is not yet ready to execute. |

    | Zombie | Process just completed but not yet left its resources. |


    **Table 1.2:** Process states


    In UNIX, processes are executed in two different modes, user mode and kernel mode
    (explained in the next section).


    Ready to run in memory and preempted are essentially the two same states, but
    the distinction is made to just emphasize how the process enters in the preempted
    state. When the process executes system calls and interrupts the handler (clock
    or I/), it is in kernel mode. When Kernel finishes its job, the process moves
    from kernel mode to the user mode. However, Kernel can preempt such jobs to execute
    other ready-to-run jobs that have higher priorities.


    # [Modes of execution of a process](#toc.xhtml_s21a)


    There are two modes of execution of the system as seen by the hardware:


    - User mode: When the user process executes, it does so in the user mode. In the
    user mode, processes can access their own instructions and data but not kernel
    instructions and data or those of other processes.

    - Kernel mode: When a user process executes a system call, the execution mode
    of the process changes from user mode to kernel mode; the Kernel executes the
    users’ request. Processes in kernel mode can access both Kernel and user addresses.


    A typical UNIX system consists of a collection of processes: operating system
    processes executing system code and user processes executing user code. System
    processes run in kernel mode to perform administrative and housekeeping activities
    such as allocation of memory, system accounting, and process scheduling. User
    processes run in user mode to execute programs and utilities. User processes move
    into kernel mode if it invokes a system call or when an interrupt or exception
    has occurred.


    Note: UNIX is not suitable for real-time processing because preemption can only
    occur when the process is about to move from kernel mode to user mode. When the
    process is in Kernel mode, it cannot be preempted.


    # [Process context](#toc.xhtml_s22a)


    The process context of the process represents the current operating state of the
    process. The context of a process includes its address space, stack space, virtual
    address space, register set image, accounting information, associated kernel data
    structures, and state information. In general, process context has the following
    three components:


    1. User-level context: User-level context contains the basic user’s program generated
    after compiling the source file. The basic elements of the program are categorized
    in text and data. The text holds a read-only set of instructions for the program.
    The data area is the shared memory area accessible by many processes. There is
    only one shared memory area, but with the concept of virtual memory, each sharing
    process may have a shared memory region in its address space. The user stack area
    is used to store parameters that return values and pointer to function calls.

    2. Register context: Register level context stores process status information
    in the processor’s registers when the process is not executing.

    3. System-level context: System-level context consists of information required
    by the operating system to manage processes. System-level context has static and
    dynamic parts. The static part contains an entry for each process in the process
    table to store process control information to be available to the Kernel at all
    times. The user (U) area is another part of the static context, which contains
    additional control information required by the Kernel when it is executing within
    the context of the process. The third part of the static context is the per-process
    region table to be used by a memory management system to swap in and out processes
    from/to main memory. Finally dynamic part of the system-level context is the Kernel
    stack.


    Kernel stack is used for processes executing in kernel mode. Kernel stack stores
    information required when an interrupt, or procedure call occurs.


    Kernel stack is used by a process executing in Kernel mode. Kernel stack stores
    information required when an interrupt, or procedure call occurs. `[Table 1.3](#c01.xhtml_tab1_3)`
    shows the set of information available under different contexts of the process
    currently executing in the system.


    | User-level context | |

    | :--- | :--- |

    | Process text | Executable machine instructions associated with the program.
    |

    | Process data | Data accessible by the program. |

    | User stack | Contains local variable, arguments, and pointers to functions executing
    in user code. |

    | Register context | |

    | Program counter | Address of next instruction to be executed. |

    | Stack pointer | Point to the top of the kernel or user stack depending upon
    the operation of process. |

    | General-purpose registers | Value of these registers depends on implementing
    hardware. |

    | Processor status register | Status of processor at the time of preemption. |

    | System-level context | |

    | Process table entry | Contains the state of the process. |

    | Per process region table | Mapping from virtual to physical addresses and access
    permission on the process. |

    | User (U) area | Process control information is required for a context switch.
    |

    | Kernel stack | Stack frames for kernel procedures. |


    **Table 1.3:** Process contexts


    # [Process relationship](#toc.xhtml_s23a)


    Processes in UNIX have a parent–child relationship, shown in `[figure 1.4](#c01.xhtml_fig1_4)``.
    Each process has one parent and one or more children. The process ID 0 is the
    scheduler process and is called swapper. Swapper is part of the Kernel and is
    called the system process. The init process (Process id 1) is the process dispatcher,
    which gives birth to the shell, and all processes initiated by us are children
    of the shell, and so descendants of the init process. The init is a normal user
    process and never dies. UNIX keeps track of all processes in an internal data
    structure called a process table.


    When the UNIX system is started for normal multi-user operation, then Kernel invokes
    the program. etc/init. The init process has Process ID 1 and runs under super-user
    privileges (User-ID 0). The operation of init depends on different UNIX systems.


    # [init process in 4.3 BSD](#toc.xhtml_s24a)


    In 4.3 BSD, to startup the system init executes the shell script `/etc/rc`. The
    file does some bookkeeping and then calls daemon processes. The init then reads
    the `/etc/ttys` process to determine which terminal is activated in a multi-user
    environment.


    # [init process in UNIX system V](#toc.xhtml_s25a)

