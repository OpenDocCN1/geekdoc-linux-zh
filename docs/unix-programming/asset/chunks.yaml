    * 文件名、主机名和变量名的完成


    # C shell 家族


    C shell 家族由 C shell (`/bin/csh`) 和其衍生版本 `tcsh` (`/bin/tcsh`) 组成。


    C shell 由 BILL joy 在伯克利开发，它包含了类似于 C 语言语句的命令。C shell 的兼容版本是 `tcsh`，用于 LINUX 系统。C
    shell 中类 C 命令的设计是为了提高编程效率，因为伯克利的程序员对 C 语言非常熟悉。TENEX/TOP 是 C shell 的新版本，它允许滚动查看命令历史，并通过箭头键进行命令列出。


    由于其改进的特性，C shell 在交互式使用中变得非常流行：


    *   **命令历史：** 可以调回之前执行过的命令以便再次执行。这些命令在执行前可以重新编辑。

    *   **命令别名：** 可以为命令赋予简短的助记名。

    *   **文件名补全：** C shell 只需输入文件名的几个字符即可自动补全文件名。

    *   **作业控制：** C shell 执行多个进程。使用作业命令控制并发进程。


    由于以下原因，C shell 常用于编写脚本：


    *   懒惰的解释器

    *   缺乏函数

    *   输入输出能力弱


    # 特性总结


    下表显示了不同 shell 提供的特性总结：


    | | 命令历史 | 命令别名 | Shell 脚本 | 文件名补全 | 命令行编辑 | 作业控制 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | Bourne | N | N | Y | N | N | N |

    | C | Y | Y | Y | Y* | N | Y |

    | TC | Y | Y | Y | Y | Y | Y |

    | Korn | Y | Y | Y | Y* | Y* | Y |

    | BASH | Y | Y | Y | Y | Y | Y |


    **表 7.1：** 各 shell 特性对比


    # 元字符与通配符


    Shell 元字符（metacharacters）是 shell 解释的特殊符号，而不是直接传递给命令。


    元字符列表如下：


    | 元字符符号 | 含义 |

    | :--- | :--- |

    | ? | 文件名替换通配符，单字符 |

    | * | 文件名替换通配符，多字符 |

    | [] | 文件名替换通配符，括号内的任意字符 |

    | < | 输入重定向 |

    | << | 输入重定向（此处，文档） |

    | > | 输出重定向 |

    | >> | 输出重定向（追加） |

    | # | 注释 |

    | () | 命令分组 |

    | “cmd” | 命令替换 |

    | $(Cmd) | 命令替换 |

    | \| | 管道 |

    | ; | 命令序列 |

    | & | 在后台运行命令 |

    | \| | OR 逻辑运算符 |

    | && | AND 逻辑运算符 |

    | $ | 扩展变量的值 |

    | \ | 避免对下一个字符进行解释 |


    **表 7.2：** 用于文件名替换的元字符


    有时要求 shell 不要解释这些符号。shell 提供了三种不同的选项来防止对这些元字符的解释（将在下一节中讨论）。


    # 命令标准输入/输出


    在 UNIX 系统中，包含许多 UNIX 命令的程序逻辑上连接到终端。终端由通用文件（generic files）表示。当没有指定文件名/路径名时，命令从通用文件获取输入，当没有指定文件名/路径名时，将输出发送到通用文件。默认情况下，提供输入的通用文件（终端）称为标准输入（stdin）；显示命令输出的通用文件（终端）称为标准输出（stdout），并将任何错误信息发送到标准错误（stderr）。当命令从标准输入读取输入并向标准输出写入输出时，意味着它从键盘读取并写入屏幕，如图
    7.2 所示。


    ![](img/Figure-7.2.jpg)


    **图 7.2：** 标准输入输出


    在 UNIX 中，标准输入通过名为 `stdin` 的通用文件访问，标准输出通过名为 `stdout` 的通用文件访问，标准错误通过名为 `stderr`
    的通用文件访问。在 UNIX 中，每个文件都有一个关联数字。对文件执行的所有操作实际上都是在关联的文件描述符（file descriptor）上执行的。标准输出、标准输入标准错误的通用文件始终打开，并供运行的命令或程序访问。这些通用文件也有关联的文件描述符用于访问和修改。为标准
    I/O 留的文件描述符如下：


    | 文件名 | 文件描述符 |

    | :--- | :--- |

    | `stdin` | 0 (键盘) |

    | `stdout` | 1 (屏幕) |

    | `stderr` | 2 (屏幕) |


    **表 7.3：** 标准文件的文件描述符


    **注意：某些命令不从标准输入获取输入。**


    **示例：cat file1**


    # 重定向


    默认情况下，每个命令或程序都连接到一个用于输入输出的标准文件。这种默认分配可以使用重定向临时更改。重定向是指定使用哪个文件代替任何标准通用文件来提供输入或获取命令输出的过程。


    # 输出重定向


    程序的执行始终会在 shell 提示符产生某些输出；但在某些情况下，需要将输出重定向到其他地方，例如：


    *   如果程序的输出需要直接传输到打印机。

    *   如果以后使用输出。

    *   如果程序产生大量输出，由于屏幕滚动非常快，很难看到所有输出。


    在所有这些情况下，输出都可以重定向到其他地方，例如文件或打印机。


    有两种基本的输出重定向运算符：`>` 和 `>>`。将 `>` 符号理解为指向接收输出的箭头。


    运算符的选择取决于用户如何处理输出。如果用户希望文件仅包含当前命令的输出，将使用 `>` 运算符。在这种情况下，如果文件已经包含内容，将被当前命令的输出替换。


    **示例：**


    ```bash

    $ls -l > file1

    ```


    符号 `>` 被识别为特殊的输出重定向，符号后面的单词被视为文件名。


    在前面的示例中，`ls -l` 命令的输出被重定向到文件 `file1`。如果 `file1` 已存在，其内容将被替换。执行的命令并不关心输出被重定向到哪里。


    **注意：如果 file1 不存在，UNIX 将创建文件并输出。**


    如果用户想要将当前命令的输出追加到文件中，重定向令牌是两个 `>>` 符号。如果文件不存在，UNIX 将创建文件。考虑一个连接两个文件的示例：


    ```bash

    $cat file1 >> file2

    ```


    在前面的示例中，`file1` 的内容将被复制到 `file2`。


    # 使用 noclobber 进行安全的 I/O 重定向


    c shell 中的 noclobber 变量或 bash 和 ksh 中的 noclobber 选项可以防止破坏文件内容。重新考虑重定向示例：


    ```bash

    $ls –l > file1

    ```


    在这个示例中，如果 `file1` 已存在，其内容将被 `ls –l` 命令的输出替换。如果开启了 noclobber 选项，它可以防止破坏内容；相反，它会生成错误消息。


    设置 noclobber 的命令如下：


    ```bash

    % set noclobber ( C shell)

    $ set –o noclobber



    **注意：如果用户希望在重定向期间显式地替换现有文件，需要在输出重定向运算符后放置感叹号 (!)。**


    **示例：**


    ```bash

    %  ls - l > ! file1

    ```


