    \ that each user has an impression that he has individual attention.\n\n![](images/Figure-1.2.jpg)\n\
    \n**Figure 1.2:** Multi-user environment\n\n# [Client-server environment](#toc.xhtml_s17a)\n\
    \nA client/server computing environment divides processing functions between a\
    \ server computer and a client computer. In the client/server model, data processing\
    \ load is shared between the client computer and more powerful server computers.\
    \ The server computer is dedicated to storing and managing data and fulfills client\
    \ requests. The server receives structured requests from the client, processes\
    \ the requested data, and sends the data back to the client. His client computers\
    \ take the user’s input from an interface, process some information using its\
    \ CPU, and present the result to the user.\n\n**Note: In the single-user environment,\
    \ a program may have multiple instances because the process may be split into\
    \ two processes by default, sharing the same code.**\n\n# [UNIX process](#toc.xhtml_s18a)\n\
    \nA program in execution is a process. In UNIX, a process is a unit of work. If\
    \ n users are executing the same program, then there are *n* processes executing\
    \ in the system. A process executes by following a strict sequence of instructions\
    \ that is self-contained and does not jump to that of another process. All the\
    \ processes execute concurrently with the CPU switching between the processes.\n\
    \nAll the UNIX commands are programmed, and thus, contribute to the process in\
    \ the system when they are under execution.\n\n# [Process attributes](#toc.xhtml_s19a)\n\
    \nEvery process in UNIX is attributed to some properties (as shown in *[table\
    \ 1.1](#c01.xhtml_tab1_1)*), which affect the execution of the process.\n\n| **Attribute**\
    \ | **Meaning** |"
