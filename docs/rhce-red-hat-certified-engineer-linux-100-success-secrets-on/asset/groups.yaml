    # AN OVERVIEW OF RED HAT LINUX


    Red Hat Linux is assembled by the Red Hat company and is a known Linux based operating
    system until it was discontinued in 2004. In November 3, 1994, Red Hat Linux 1.0
    also known as “Red Hat Commercial Linux” was released. It is the first Linux distribution
    to utilize the packing system; and the packing format it utilizes is the RPM Package
    Manager. This also served as the source of other distributions like Yellow Dog
    Linux and Mandriva Linux.


    However, Red Hat has stopped the line of Red Hat Linux to give way to Red Hat
    Enterprise Linux (RHEL), which is intended for enterprise environments. Meanwhile,
    Fedora was also developed to serve as the free version to complement the home
    environment. Hence, Red Hat Linux line stopped their release after the Red Hat
    Linux 9, which is the final release. This was formally ended in 2004. However,
    updates were still released in 2006 until early 2007.'
