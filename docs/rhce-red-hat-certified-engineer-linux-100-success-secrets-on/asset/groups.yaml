    RHCE 100 Success Secrets | 134


    The RHCE Red Hat Certified Engineer Linux Study Guide has all the topics needed
    to get certified. Its table of contents has 16 chapters that discuss everything
    one should know to pass the RHCE certification exam.


    RHCE prerequisites, hardware and installation, the boot process, and the Linux
    file system administration comprise chapter 1 to 4, respectively. Chapter 5 discusses
    about the package management while chapter 6 is about the user administration.
    Meanwhile, discussion about the system administration tools is in chapter 7 and
    chapter 8 will teach about Kernel services and configuration.


    Other topics in the book are the HTTP service, network sharing services, domain
    name service, electronic mail, and other networking services. Later chapters of
    the book discuss about X window system, securing services, and troubleshooting.


    # HOW TO KNOW IF ONE HAS POSITIVE RHCE RESULTS


    Red Hat Certified Engineer (RHCE) certification is said to be one of the toughest
    IT certification tests. Still, many IT professionals aim to get RHCE certification
    to add this to their list of expertise. Besides, passing the RHCE will surely
    make anyone in the IT business proud. But how will the potential RHCE certified
    professionals know that they already hit the bull''s eye?


    There is only one exam required to have a positive RHCE result. This is the RH302
    and it covers three different sections about Red Hat Linux operating system. The
    first section is troubleshooting, second is a multiple-choice type of exam, and
    third is the installation and configuration. All-in-all, the RHCE is at a maximum
    of 6-hour exam. To have a positive RHCE result, the candidate should meet the
    minimum RHCE requirements.


    # RHCE 100 Success Secrets | 136


    The RHCE candidate should acquire an average score of 80 or higher when all the
    scores from three sections are combined. Also, the three sections should have
    at least 50 points each. The skills test on RHCT should garner at least 70 percent
    while the skills test on RHCE in the third section should at least score 70 percent.


    The RHCE results are announced usually through sending emails to the candidates
    who took the test. The email will explain the requirements for passing RHCE and
    will compare that to what the candidate has scored. Red Hat also shows the summary
    of scores. At the end of the email, the candidate will see if they have passed
    the test or not.


    Those who did not have positive RHCE results can still take the test. There is
    no limit on how many times they can attempt to get a positive RHCE result.


    # HOW ‘SITTING FOR THE RHCE’ HELPED SOME RHCE CERTIFICATION EXAM TAKERS


    Many veteran IT certification exam takers say that the Red Hat Certified Engineer
    (RHCE) certification exam is one of the toughest. For some IT professionals, taking
    the RHCE is a challenge while for some, it could be a waste of time and money.
    One of the real-life stories that depicted how difficult the RHCE certification
    exam is, is the feature article Sitting for the RHCE.


    The article was written on April 6, 2004 by Ken Barber. He is a teacher in one
    community college and he thought that getting RHCE certified will help his job.
    He is also a veteran of IT examinations and has passed many IT certification exams
    already. But he considers the RHCE certification exam as one of the most difficult.


    Although Barber did not pass the RHCE, the ‘Sitting for the RHCE’ helped a lot
    of candidates to learn everything about the certification exam. He detailed the
    standing of the RHCE exam compared with other certification exams. He said that
    it is among the three most difficult exams in the history of IT certifications.


    Barber also discussed how to properly prepare for the examination. He gave different
    insights on how to get ready for the test and give some benefits of enrolling
    in a review class. Also, the article provided some links to the list of the things
    that candidates should know for the exam. ‘Sitting for the RHCE’ detailed what
    to expect during the examination too.


    With ‘Sitting for the RHCE’, people knew how hard it was to take the RHCE exam
    considering that only 60 percent of exam takers pass the test.


    # ELIGIBILITY FOR THE RHCE OF THE YEAR CONTEST


    In recognition of the most outstanding Red Hat Certified Engineer (RHCE), the
    RHCE of the Year Contest was founded. This contest is a skills contest where different
    participants will compete to have the chance of travelling to the Red Hat Summit.
    The participants just need to submit a short essay about why they should be awarded
    as the RHCE of the Year. The entry is only limited to one essay each participant.
    Also, this contest is only open to a specific group of individuals.


    First, the participant should currently hold an RHCE certification and this should
    not expire before the contest starts. Aside from that, the participant should
    also be a legal resident of France, South Korea, Canada, Japan, China, Germany,
    Switzerland, Mexico, Australia, United Kingdom, New Zealand, India, Spain, Argentina,
    Ireland, Singapore, Netherlands, United States, or Taiwan. Persons who are interested
    to join in this contest should also be above the age of most people in their country,
    state, or province where they legally reside. Also, participants are expected
    to have an Internet access and a valid email address.


    Meanwhile, those working or immediate families of those working with Red Hat,
    Inc. and its subsidiaries are not allowed to join the RHCE of the Year Contest.


    All in all, there will be five winners for this contest since there will be one
    winner for each RHCE regions. These regions are North America, EMEA, Asia-Pacific,
    India, and South America.


    The prize for the RHCE of the Year Contest includes registration fee for the Red
    Hat Summit, round-trip airfare, hotel accommodations, transportation through shuttle
    bus, access to Red Hat Summit special events, conference meals, and sessions and
    Happy Reception.


    # GETTING THE MOST FROM RHCE EXAMS


    Getting the most from what RHCE exams can give is somehow tricky. Discipline is
    the only key to really get what the candidate can have from these tests.


    First, practice tests are not really time-pressed. Therefore, the candidate can
    decide whether to have a time-pressed practice test or not. However, having a
    time-pressed practice exam is more advised because it will help the candidate
    more.


    Also, taking the best RHCE practice test is important. There are free RHCE practice
    exams that can be downloaded. However, these do not include the latest RHCE topics
    and the questions are usually generalized and easy. Anyway, paying for some practice
    exams will not consume a lot of dollars since these can be purchased with exam
    packs or they can be bought alone.


    # Overview of the Book ‘RHCE Red Hat Certified Engineer Linux Study Guide Exam’


    ‘RHCE Red Hat Certified Engineer Linux Study Guide Exam’ is not only an effective
    review material but this is also one of the few books available about RHCE. For
    those who want to use a book instead of other review tools, then this book is
    already a good one. It has a lot of features helpful in preparing for the RHCE
    certification exam.


    The book boasts a 100 percent complete coverage of all the topics in the RH302
    exam. The topics include the configuration and installation of different hardware,
    boot processes, the file system administration of Linux, and Kickstart. The book
    also discusses the package management, administration of groups and users, the
    different system admin tools, and the kernel configuration and services. Other
    topics included are Apache and Squid, file sharing services through network, domain
    name, X window system, troubleshooting, SELinux, firewalls, secure package, DHCP,
    and extended net services.


    Also, the book has the Exam Readiness Checklist so that the reader can check from
    time to time if he has done all the preparations for the examination. The exam
    sections of the books also highlight the different exam topics covered.

