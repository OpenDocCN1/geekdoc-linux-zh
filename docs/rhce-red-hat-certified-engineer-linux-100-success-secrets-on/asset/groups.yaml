    # 使用红帽软件的问题


    寻求降低成本和提高效率的企业无需另寻他处了。红帽软件可以为企业节省数万美元的许可费用。然而，用户可能会对某些问题产生担忧，这让他们犹豫是否切换到红帽软件。


    这些问题是什么？


    第一个问题是操作系统之间的差异。一直使用 UNIX 的用户不需要担心必须为 Linux 学习另一个系统。如果他精通 UNIX 命令行工具，那么他就可以在新环境中使用这些工具。他所需要的只是进行简单的网页浏览。


    他可以下载一些在 Windows 上原生运行的工具，如 `grep`、`awk`、`gawk` 和 `vim`。更好的解决方案是安装 Cygwin。该产品提供了一个类
    UNIX 环境，运行和看起来都像 UNIX shell。可以在网上免费下载 Cygwin。


    第二个问题是应用程序的访问。如果一个用户一直是 Windows 用户并被要求迁移到 Linux 桌面，他可能会有一些担心。这些担心涉及到他的许多使用 Microsoft
    Office 格式的文档。他会认为可能无法在红帽软件下读取或编辑这些文档。或者他可能担心创建的新文档无法被 MS Office 用户读取。


    这些在红帽软件下并不是问题。他可以使用 OpenOffice 或 StarOffice，它们包含了与 MS Office 产品兼容的办公自动化软件。此外，OpenOffice
    是一个开源产品，可以免费下载。


    # Red Hat Linux 4 面临的新挑战


    在拥有 Red Hat Linux 3 超过 16 个月后，Red Hat Linux 4 发布了。红帽 Linux 用户可能因为其新的部署特性而被迫升级。红帽
    Linux 4 有许多新增内容。


    首先，2.6 Linux 内核取代了经过大量补丁和修改的红帽 2.4 内核。它还提供了更好的扩展性和更广泛的硬件支持。其次，它提供了安全性增强、桌面软件的升级与添加，以及与活动目录（Active
    Directory）认证的集成。


    有人说红 Hat Linux 4 并没有提供太多新东西。2.6 内核下的许多功能已经在 Red Hat Linux 3 中实现。此外，据说安全性增强子系统已集成到许多外部服务中，如
    BIND、NTP 和 Apache。


    与此同时，桌面软件的升级和添加被认为对红帽企业 4 的桌面版和工作站版是有益的。然而，对于 AS（高级服务器）和 ES（企业级服务器）版本来说，这些并不有用，更多被视为一种缺点。


    尽管受到一些用户的批评，红帽企业 Linux 4 相比竞争对手仍然具有一个主要优势，那就是它的多样性。它提供四种版本：高级服务器、企业服务器、工作站和桌面版。这些是为了服务特殊用途而定制的，但所有版本基于同一个核心。这确保了用户可以针对各种任务手握多种工具。


    # 红帽网络及其益处


    红帽网络（通常称为 RHN）是由红帽运营的一个系统。它基本上为订阅者提供 Red Hat Linux 和 Red Hat Enterprise Linux
    中包含的包的更新、补丁和错误修复。它还提供系统的配置和监控。


    红帽网络的用户如果想从 RHN 进行相应的更新，可以使用 `update` 或 `yum` 程序。这与其他种类型的自动系统维护工具类似，例如微软提供的那些工具。


    为什么要使用红帽网络？


    首先，红帽网络简化了红帽 Linux 系统的管理。它为用户提供了一种简单直接的方法来识别过时的包并获取适当的替换。自动更新功能还允许单机在没有用户干预的情况下进行更新。


    其次，单个系统管理员可以管理包含在红帽全球教育计划中的高级管理级功能。它可以同时监督和更新数百甚至数千个系统。然而，管理员必须意识到这种安排有一个缺点。到红帽网络的并发连接可能会导致带宽急剧消耗。这可以通过程序自带的
    RHN 代理服务器来解决。


    红帽网络可以提供很多好处，特别是对于教育系统而言。学校和大学可能因为有用性和成本效益而探索使用红帽网络的可能性。最近，还宣布了红帽网络将开源，这将使其开发速度更快。


    # RHCE 的平均分与收入


    红帽认证工程师（RHCE）考试是一项基于性能的考试，它衡量你对概念和程序的知识与技能，但同时也测试了你处理真实红帽 Linux 系统的熟练程度。


    成为 RHCE 需要通过一项持续五个半小时实操考试。考试分为两个部分：时长 3 小时的“服务器安装与网络服务”，以及时长为 2.5 小时的“故障排除与维护”。


    与任何其他考试一样，有一个及格线或平均分。要获得 RHCE 认证，你必须完成所有强制性的故障排除和系统维护题，并在安装配置部分获得 80 分或以上的分数，在另一部分获得
    70 分或以上的分数。


    RHCE 100 Success Secrets | 180


    通过 RHCE 可以获得一个证书和一个 RHCE 编号，感兴趣的雇主可以通过此验证你是否真的获得了认证。成为 RHCE 让你在其他没有专业证明的人中脱颖而出。在美国，RHCE
    的平均月薪根据经验年计算：1-4 年经验的人为 59,000 美元，20 年或以上的人为 97,000 美元。


    雇主青睐 RHCE 求职者是因为他们的知识已经在 Linux Linux 系统上通过了测试。这意味着聘佣 RHCE 的公司可以确保拥有红帽认证的申请人实际上知道如何工作。


    # 参加 RHCE 认证


    当你听到认证时，首先想到的是培训和考试。大多数考试是以书面形式进行的，你通过回答选择题来测试你的知识和技能。衡量候选人实际能力的考试被称为基于性能的考试。在红帽
    Linux 计算领域工作的工程师应该参加红帽认证工程师（RHCE）机考，通过考试并获得认证。


    RHCE 认证机考的时长为 5.5 小时。它由两部分组成：前 3 小时包括服务器安装和网络服务配置测试，后 2.5 小时涉及故障排除和维护测试。在机考的这两个部分，候选人将面对现实的问题，这要求他们进行规划、诊断并开发完整的解决方案。


    RHCE 认证用于衡量持有者从事红帽 Linux 计算的关键岗位的能力。由于 RHCE 考试是基于性能的测试，通过考试的候选人经过了以下能力的测试：


    - 1. 在红帽 Linux 上安装和配置。

    - 2. 理解硬件限制性。

    - 3. 为网络配置基础网络和文件系统。

    - 4. 配置 X Window 系统。

    - 5. 执行基本的红帽 Linux 系统管理。

    - 6. 为网络服务器配置基础安全。

    - 7. 为组织设置和管理常见的企业网络 (IP) 服务。

    - 8. 执行服务器诊断和故障排除。


    '
