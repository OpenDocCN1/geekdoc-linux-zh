    4. Matzan said that Red Hat Linux 4 is a more ideal option as compared to the
    early release of Red Hat. Apart from that, he also tackled its advantages over
    its competitors such as the products from Sun Micros, Mandrakessoft, and Novell
    by focusing on the specifications of Red Hat Linux 4.


    Primarily, Matzan discussed the latest features compacted in Red Hat Linux 4.
    The specific additions to this version are the following:


    - The heavily patched Red Hat 2.4 kernel was replaced by the 2.6 Linux kernel,
    presenting better scalability and extended hardware support.

    - Developments on SELinux security.

    - Software additions and upgrades on desktop such as: GNOME 2.8; RealPlayer; Novell
    Evolution; Acrobat Reader; OpenOffice.org.

    - Incorporation of Active Directory verification, which also includes a connector
    of Microsoft Exchange.

    - EAL4+ pending certification.


    The list is somewhat light if the zeal in backporting code of Red Hat will be
    considered. Also, the SELinux subsystem that has been included with numerous outward-facing
    services allows for procedure-based fixed access controls. As a result, this gives
    out a finer control on the part of the user.


    Also, the software additions and upgrades for the desktop are really good both
    for the Desktop and Workstation editions of Red Hat Linux 4. The incorporation
    of modified GNOME in this version is also claimed to provide an enhanced usability.


    All in all, Red Hat Linux 4 can be viewed to be not too revolutionary according
    to Matzan. But the good point about this is its competitive update pack to the
    Red Hat Linux 3.


    # THE COMPARISON OF RED HAT LINUX ENTERPRISE TO WINDOWS SERVER


    Most of the organizations that are making a platform assessment are normally drawn
    to key attributes like support, reliability, and total cost of ownership (TCO).
    More often, most of the organizations decide between the Red Hat commercial Linux
    and Windows Server. So, to help those organizations to decide which one between
    these two to choose, lists of comparisons are discussed on the succeeding discussions.


    When it comes to the TCO, Red Hat Enterprise Linux is almost offered for free.
    Basically, the business of Red Hat is based on yearly subscriptions for OS support.
    Therefore, organizations will only pay for each server each year. Additional fee
    will be added if a client will demand for a 24/7 support. On the other hand, Windows
    Server promises a reduced downtime as well as a competitive manageability, which
    means lower TCO. According to the research, the two major cost elements of TCO
    are: the staffing costs with a continuous management and maintenance; and downtime.
    The former covers 60 percent of TCO while the latter covers 15 percent.


    Meanwhile, when it comes to reliability the Red Hat Enterprise Linux is easy to
    configure and manage on the part of the administrators, especially when it changes
    as a response to the varying needs of the business. In fact, Linux administrators
    are claimed to employ a different management tools and processes into this OS.
    Meanwhile, Windows Server presents easier management, configuration, and predictability.
    As a result, Windows Server is capable to provide a reliable platform. Essentially,
    Windows Server is claimed to be capable in lessening the time it takes to manage
    and implement solutions.


    # MIKE FERRIS TALKS ABOUT RED HAT 5


    Senior Site Editor Jan Stafford of SearchOpenSource.com said that Red Hat 5 will
    add the most recent directory server capabilities. These capabilities are intended
    to cover recent issues on identity management according to the Security Solutions
    Director of Red Hat Inc., Mike Ferris.


    Ferris said that the Red Hat Directory Server is designed to simplify the organization
    of Lightweight Directory Access Protocol (LDAP). Unfortunately, LDAP identity
    organization capabilities have been taken for granted said by Ferris. But the
    present case is deemed to be different; the Directory Server, which was originally
    designed as Netscape Directory Server, are created to gain a lot more capabilities
    on identity control in the forthcoming distribution of Red Hat Enterprise Linux
    5.


    Ferris spoke about more of the team''s plans of Red Hat in the area of security
    to SearchOpenSource.com through an interview:


    SearchOpenSource.com: What function can be expected from the Directory Server
    in the forthcoming release of Red Hat Linux 5?


