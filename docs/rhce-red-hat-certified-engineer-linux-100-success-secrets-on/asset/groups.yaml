    # RHCE 100 成功秘籍 | 154


    Red Hat 最新发布的版本之一是 5.3 beta。它属于红帽企业 Linux（Red Hat Enterprise Linux）5 家族，现在已可以下载。从本质上，此
    beta 版本提供了以下改进：在 x86_64 Hypervisor 上支持 126 个及以下的 CPU；x86_64 上的每台主机支持 1 TB 内存；NetworkManager
    0.7；集群镜像支持（提供双链路镜像）；最新的显卡驱动程序；用户空间训练的初步执行；重新构建并带有完整 Kerberos 支持的 CUPS；安装程序中对根分区和交换分区的加密支持；包含审计功能的最新
    NetworkManager 的 SELinux 启用支持；以及从 3.0.28 重新构建到 3.0.32 的 samba，以支持 Windows Vista。


    此 beta 版本可在 Alpha、SPARC 和 Intel 平台上获取。这个 beta 版本是下载的理想选择，因为从总体而言，红帽企业 Linux 是开源计算的顶级平台。另一个原因是红帽企业
    Linux 5 是通过订阅模式提供的，其持续的价值解释了为什么许多领先的企业硬件和软件供应商都在使用它。


    事实上，从桌面到数据中心，企业级 Linux 的创新伴随着开源技术和真实企业级平台的持续性。


    # JIM MATZAN 谈红帽 LINUX 4


    来自 Linux.com 的 Jem Matzan 讨论了红帽 Linux 4 带来的优势。Matzan 表示，与红帽的早期版本相比，红帽 Linux 4
    是一个更理想的选择。此外，他通过通过关注红帽 Linux 4 的规格，探讨了它优于竞争对手（如来自 Sun Micros、Mandrakesoft 和 Novell
    的产品）的优势。


    首先，Matzan 讨论了集成在红帽 Linux 4 中的最新功能。该版本的特定新增内容如下：


    - 经过大量补丁的 Red Hat 2.4 内核被 2.6 Linux 内核取代，提供了更好的扩展性和扩展的硬件支持。

    - SELinux 安全性的进展。

    - 桌面端的软件新增和升级，例如：GNOME 2.8；RealPlayer；Novell Evolution；Acrobat Reader；OpenOffice.org。

    - 集成了活动目录（Active Directory）验证，其中也包含 Microsoft Exchange 的连接器。

    - 等待 EAL4+ 认证。


    如果考虑到红帽在代码回传（backporting）方面的热情，这个列表显得有些单薄。此外，内置了许多外部服务的 SELinux 子系统允许基于过程的固定访问控制。结果，这为用户端提供了更精细的控制。


    此外，对于红帽 Linux 4 的桌面版和工作站版，桌面端的软件新增和升级都非常出色。该版本集成的修改版 GNOME 也被认为增强了可用性。


    总而言之，根据 Matzan 的观点，红帽 Linux 4 可以被认为并不具有革命性。但它的优点在于，它为红帽 Linux 3 提供了一份极具竞争力的更新包。


    # 红帽企业 Linux 与 Windows Server 的对比


    大多数进行平台评估的组织通常会被支持、可靠性和总拥有成本（TCO）等关键属性所吸引。更多时候，大多数组织会在红帽商业 Linux 和 Windows Server
    之间做出决定。因此，为了帮助这些组织在二者之间做出选择，接下来的讨论将列出对比列表。


    当提到 TCO 时，红帽企业 Linux 几乎是免费提供的。基本上，红帽的业务是基于操作系统支持的年度订阅。因此，组织每年只需为每台服务器付费。如果客户要求
    24/7 支持，则会增加额外费用。另一方面，Windows Server 承诺减少停机时间并具有具有竞争力的管理能力，这意味着更低的 TCO。根据研究，TCO
    的两个主要成本要素是：用于持续管理和维护的人力成本；以及停机时间。前者占了 TCO 的 60%，而后者占了 15%。


    同时，涉及到可靠性时，红帽企业 Linux 对于管理员来说易于配置和管理，特别是当它响应业务变化的需求而发生变化时。事实上，Linux 管理员被认为在这一操作系统中使用不同的管理工具和流程。与此同时，Windows
    Server 提供了更简单的管理、配置和可预测性。因此，Windows Server 能够提供一个可靠的平台。本质上，Windows Server 被认为能够减少管理和实施解决方案所需。


    # MIKE FERRIS 谈红帽 5


    SearchOpenSource.com 的高级站点编辑 Jan Stafford 表示，红帽 5 将添加最新的目录服务器功能。根据红帽公司安全解决方案总监
    Mike Ferris 的说法，这些功能旨在涵盖身份管理方面的近期问题。


    Ferris 表示，红帽目录服务器的设计是为了简化量级目录访问协议（LDAP）的组织。遗憾的是，Ferris 认为 LDAP 身份组织能力一直被认为是理所当然的。但现在的情况被认为是不同的；最初设计为
    Netscape 目录服务器的目录服务器，是为了在即将推出的红帽企业 Linux 5 分发中获得更多的身份控制能力。


    Ferris 在采访中通过 SearchOpenSource.com 讲述了红帽团队在安全领域的更多计划：


    SearchOpenSource.com：在即将发布的红帽 Linux 5 中，可以期待目录服务器提供什么功能？


    Ferris：这将包括通过他们的技术在平台和智能卡上进行单一注册的能力。因此，目录服务器将不仅限于作为身份存储；相反，它还可以作为允许高级功能的基础。


    SearchOpenSource.com：在即将发布的红帽 Linux 5 中，LDAP 有什么功能？


    LDAP 将充其实际含义——轻量级目录访问协议。LDAP 在 RHEL5 中的设计是为了与目录服务器协作。通过这种方式，红帽能够为人们提供良好的基础设施。


    # 红帽企业医疗平台功能查看


    为了满足医疗机构对可靠且价格合理的售后的需求，红帽和 DLT 共同打造了红帽企业医疗平台。


    红帽企业医疗平台是一个成本效益的开源技术平台，专为实现医疗机构的重要需求而设计。它通过涵盖红帽企业 Linux 和 JBoss 企业中间件，确实能够提供高质量且安全的患者护理。红帽网络提供更新和支持，以满足医疗环境的需求。


    以下展示了 DLT 提供的红帽企业医疗平台的一些功能。这些也解释了为什么该平台也是医疗组织的理想选择：


    - 稳定性：红帽保证从原始产品发布起提供期七年的支持。

    - 性能：红帽企业医疗平台的核心红帽企业 Linux 提供了卓越的性能。值得注意的是，它在 TPC-C 等规模上成功取得了世界记录。

    - 安全性：红帽企业 Linux 的安全性（如 SELinux、PIE、审计和 ExecShield）是领先且透明的；消除了所有类型的安全漏洞。

    - 关键任务支持：红帽、DLT 以及生态系统合作伙伴提供适用于医疗环境的可靠关键任务支持。

    - 客户价值：根据《CIO Insight》杂志的报道，红帽已连续三年被评为最重要的软件供应商。


    '
