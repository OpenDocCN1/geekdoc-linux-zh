    Yellow Dog Linux 和 Mandriva Linux 等其他发行版的来源。


    然而，红帽公司已停止了 Red Hat Linux 系列，以为旨在企业环境的 Red Hat Enterprise Linux (RHEL) 铺路。与此同时，Fedora
    也被开发出来作为免费版本来补充家庭环境。因此，Red Hat Linux 系列在最后一个发行版本 Red Hat Linux 9 之后停止了发布。该系列于
    2004 年正式结束。不过，更新一直持续到 2006 年直到 2007 年初。


    Red Hat Linux 实际上呈现出不同的特性。例如，3.0.3 版本是早期支持可链接和可执行格式（Linkable and Executable Format）而非
    a.out 格式的发行版之一。Red Hat Linux 还引入了一个名为 Anaconda 的图形化安装程序，旨在简化初学者的使用。该程序也被多个 Linux
    发行版采用。


    此外，版本 7 也作为 2.4 内核的基础得以发布。随后，Red Hat Linux 8.0 被推出，作为系统的默认字符编码。稍后，版本 9 被发布，以支持原生
    POSIX 线程库（Native POSIX Thread Library）。


    # RED HAT LINUX 下载帮助


    # 用户更新


    现在下载 Red Hat Linux 变得非常容易，因为有多个网站提供满足每个用户下载需求的发行版。这些网站具有快速镜像站搜索、阅读评论以及在发布新版本时获取电子邮件更新的功能。很多情况下，网站会以字母顺序列表列出可下载的版本；而另一些网站可能采用其他的呈现方式。


    RHCE 100 成功密码 | 166


    红帽最新发布的版本之一是 5.3 beta。它属于红帽企业版 Linux 5 家族，现在可以下载。基本上，此 beta 版本提供了以下改进：支持在 x86_64
    虚拟机程序中使用 126 个及以下 CPU；支持每个 x86_64 主机拥有 1 TB 内存；NetworkManager 0.7；集群镜像支持（提供双节点镜像）；最新的图形驱动程序；用户空间训练的初始执行；重新构建的且支持
    Kerberos 的 CUPS；安装程序中对根和交换分区的加密支持；包括审计功能的最新 NetworkManager 的 SELinux ；以及从 3.0.28
    重新构建到 3.0.32 的 samba 以支持 Windows Vista。


    此 beta 版本在 Alpha、SPARC 和 Intel 平台上可用。此 beta 版本是非常理想的下载，因为总的来说，红帽企业版 Linux 是开源计算的顶尖平台。另一个原因是红帽企业版
    Linux 5 是通过订阅提供的，并展现了持续的价值，这也是为什么领先的企业硬件和软件供应商对其青睐睐。


    事实上，从桌面到数据中心，企业级 Linux 的创新伴随着开源技术和真实企业级平台的恒久性。


    # 红帽服务器对标 Windows 服务器


    Xandros Bridgeways 是一个图形化界面提供商，便于配置和访问服务器及服务，其管理控制引入了从 Windows 服务器到红帽服务器的平滑转换。Bridgeways
    的管理控制台可以立即从 Xandro 网站免费下载，为预计精通 Windows 服务器但不精通 Linux 的系统管理员带来了更流行的红帽服务器图形化管理。


    该管理控制台还设计为 Linux 管理员的合合一工具——使他们无需选择命令行界面或使用多个工具来管理他们的红帽服务器。许多服务器和服务被整合到一个特定的“托管社区”中，可以从任何
    Vista 或 Windows XP 桌面或红帽服务器进行轻量管理。


    Amazis.net 地区经理 Marcin Zalicki 表示，那些害怕使用 Linux 服务器的 Windows 管理员再也不需要害怕了。他还说，Windows
    管理员将看到 Xandros BridgeWays 的直观、清晰且易于使用的红帽服务器。此外，Zalicki 还表示，Windows 管理员将非常感谢了解
    Linux 世界的优越性。


    基本上，通过汇集防火墙、DHCP、Web 服务器、DNS 或虚拟机等服务，BridgeWays 管理控制台可以将管理任务减少到最低。事实上，Zalicki
    还提到，Windows 管理员可以直接从他们的 Windows 机器运行红帽服务器。这样做的好处是不需要额外的培训。


    # RED HAT LINUX 9 的新特性


    对于那些有兴趣安装最新版本 Red Hat Linux 9 或 Shrike 的用户，他们可能会发现一些惊喜。其他用户可能仍在犹豫，并希望停留在旧版本。


    以下是一些可能说服用户使用 Shrike 的变化：


    - 第一，安装 Red Hat Linux 9 像 Red Hat Linux 8 一样干净直接。此外，用户可以选择升级其计算机上安装的任何之前的 Red
    Hat Linux 版本。然而，用户必须谨慎对待，阅读《发行说明》（Release Notes）以获取有关 Linux 安装影响的信息。有些用户倾向于通过删除之前的操作系统来进行纯净安装。


    - 第二，用户将拥有比 Red Hat Linux 8 更好、更漂亮的登录界面。与 Red Hat Linux 8 中杂乱的一团糟相比，启动菜单安排得更好。菜单上甚至有一个名为“打开最近”的非常有用的最近文档快捷方式。


    - 第三，鼠标光标进行了一些代码更改。它现在被称为“Xcursor”，并具有新的抗锯齿、透明混合功能，使其看起来更好。


    - 对于那些在 Red Hat Linux 8 中安装 Intel i845、i852、i855 和 i865 集成显卡遇到问题的用户；在 Red Hat
    Linux 9 下将不会有这些问题。


    - 对于喜欢使用 Mozilla 的用户来说，这是一个好消息，因为 Red Hat Linux 9 使用 Mozilla 1.2.1 版本作为默认网络浏览器。


    这些只是 Red Hat Linux 9 用户可能感兴趣的少数显著增强。


    # 关于 RED HAT LINUX SERVER 的一切


    Red Hat Linux 服务器为红帽企业版 Linux 3、4 和 5 提供全虚拟化支持，为第三方操作系统以及为红帽企业版 Linux 5 和版本 4
    Update 5 提供半虚拟化虚拟机支持。


    全虚拟化支持需要 Intel 虚拟化技术（Virtualization Technology）和 AMD-V 处理器提供的硬件功能，而半虚拟化虚拟机可以在任何
    32 位 x86、64 位 x86 或 Itanium2 系统上配置。


    在虚拟机操作的数量方面，红帽企业版 Linux 平台可以无限制地托管。仅受物理硬件资源的限制。同时，红帽企业版 Linux 可以支持多四个虚拟机。


    使用红帽 Linux 服务器有什么好处？


    - 1. 在使用红帽企业版 Linux 主机时，虚拟机不需要单独订阅。通过订阅红帽企业版 Linux 主机，它们自动获得订阅服务。然而，第三方操作系统虚拟机必须按照各自供应商的许可进行授权。


    - 2. 拥有红帽 Linux 服务器意味着由于服务器整合、电力、冷却、维护和第三方软件的节省而降低了成本。


    - 3. 由于灵活的资源管理，应用程序的可用性和响应得到了提高。


    - 4. 红帽 Linux 服务器还为 IT 部门提供了以更低成本立即创新并响应新业务需求的机会。


    许多公司已经证明了拥有红帽 Linux 服务器在投资回报和性能提升方面的有效性。


