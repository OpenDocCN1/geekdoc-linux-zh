    in taking the actual RHCE examination since they are already oriented about what
    to expect on the day of the examination itself.


    RHCE boot camp providers have to deal with Red Hat Enterprise about the schedule
    of the examination since Red Hat supervises the examination per se. The training
    centers that offer RHCE boot camp would have to initiate their training center
