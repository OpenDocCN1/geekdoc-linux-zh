    # 提供 RHCE 在线培训


    随着新技术的出现，对于想要按自己的节奏学习的人来说，培训变得非常方便。忙碌的人发现在线培训非常有益，因为他们可以随时随地学习。想要参加红帽认证工程师 (RHCE)
    考试但没有时间参加面对面课堂培训的工程师，应该考虑通过在线培训来准备考试。


    RHCE 在线培训可以是以下任何一种形式：


    - 1. 虚拟培训（Virtual Training）——提供实时的导师引导培训。培训课程按每四小时一个间隔的时间表进行，周一至周五为期两周。课程于东部标准时间下午
    1 点开始，目前仅面向美国和加拿客户开放。


    - 2. 电子学习（ELearning）——通过互联网 100% 交付的自学课程。课程由红帽主题专家和经验丰富的讲师编写准备。每个主题末尾的练习将进行自动评分。


    - 3. 实时访问实验室（Live Access Lab）——为参与者提供了一个进行自学实验室学习的环境，类似于学生在常规 RHCE 路径课程中的体验。参与者可以获得服务器的访问权限，该服务器提供网络基础设施服务以及包含
    RHEL5 分发版和 RHCE 路径课程故障排除软件的 yum 仓库。参与者可以完成红帽培训的实验室练习，或者对机器及其服务的高级配置进行实验。


    RHCE 在线培训的课程涵盖了与面对面课堂设计相同的技能和目标。这些 RHCE 在线培训为准备 RHCE 认证考试的考生提供网络培训，因此请选择最适合你的一种。


    # RHCE 考试前的复习课程


    虽然参加红帽认证工程师 (RHCE) 考试并不要求在考试前参加培训，但大多数候选人认为，参加 RHCE 复习课程对扩展技能和知识很有帮助，因为你也可以从他人那里学习。有些你可能读到并遇到过的问题，RHCE
    复习班可以进一步澄清并彻底解释。


    RHCE 复习班由被认证为红帽合作伙伴的红帽专家和讲师负责。以下是 RHCE 考试候选人在考试前应参加的分类 RHCE 复习课程：


    - 标准路径（Standard Track）包括三门课程，如 RH033、RH133 和 RH253，针对需要更多复习关键概念的人或对 UNIX 和 Linux
    都是新手的人。


    - RH033 红帽 Linux 基础（Red Hat Linux Essentials）是一门针对没有 UNIX 或 Linux 经验的 IT 专业人士的课程，包含了准备
    RH133 的技能，后者涵盖了命令行基础。


    - RH131 和 RH133 红帽系统管理（Red Hat System Administration）是为那些寻求担任技术员级 Linux 系统管理员专业职责的人士设计的课程。


    - RH253 红帽 Linux 网络与安全管理（Red Hat Linux Networking and Security Administration）是为希望建立配置和管理运行关键企业网络服务及安全的红帽
    Linux 服务器技能的人设计的课程。该课程的先决条件包括 RH133 或同等技能。


    - 快速路径（Rapid Track）包括一门名为 RH300 红帽快速路径课程（及 RHCE 考试）的课程。该课程为具有 UNIX 和 Linux 经验的人、网络专家以及需要特定的红帽企业
    Linux 培训以通过 RHCE 考试的系统管理员设计。


    # 辅助 RHCE 准备的学习指南


    在参加红帽认证工程师考试之前，候选人了解一些有助于准备实际考试的学习指南是非常重要的。红帽有自己的红帽全球学习服务（Red Hat Global Learning
    Services），提供 RHCE 考试的官方学习指南。他们不对红帽全球学习服务以外的机构或个人提供的指南、书籍、在线资源或任何其他信息负责。


    学习指南书籍是红帽学习来源之一。这些指南书籍包含了基础、安装、使用 Shell 和编辑器、GNOME 桌面、KDE Linux 桌面等。除了理论细节，它还包含了每章末尾用于自测的实践练习。


    学习书籍指南旨在提供实操技能和理论方面，以便读者准备 RHCE 考试。这也让工程师能够评估他们对该主题的深入知识。使用学习指南书籍允许读者在网络服务的安装、配置和激活方面进行练习，及时准备认证考试。


    红帽还为 RHCE 考生在实际考试前提供了一份准备指南。它有一个提供有关 RHCE 考试信息和说明的网站。该网站解释了为什么 RHCE 考试采用基于性能的形式。


