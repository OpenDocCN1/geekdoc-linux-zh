    ## 成为 RHCE 的要求


    红帽认证工程师（RHCE）被称为“Linux 皇冠上的明珠”。这是一项基于性能的考试，旨在衡量候选者在实机系统上的实际能力。RHCE 认证证明了个人在运行红帽操作系统的服务器上配置网络服务和安全的能力。


    获得 RHCE 认证意味着通过了 RHCE 认证考试，该考试分为两个部分：


    - 1. 第一部分：故障排除与系统维护（2.5 小时）。

    - 2. 第二部分：安装与配置（3.0 小时）。


    获得 RHCE 证书必须满足以下要求：


    - A. 候选者必须在一小时内完成所有强制性的故障排除问题

    - B. 在第一部分必须获得 80 分或以上的分数

    - C. 在第二部分标记为“RHCT”或“本地”（Local）的元素必须获得 70 分或以上的分数，

    - D. 在第二部分标记为“RHCE”或“网络服务”（Network Services）的元素必须获得 70 分或以上的分数


    对于不符合 RHCE 要求的候选者，如果他们在 RHCE 考试中展示了 RHCT 特定的能力，可以获得红帽认证技术员（RHCT）。


    RHCE 设计为基于性能的，是因为红帽希望其证书持有者获得一份能够作为实际能力证明的证书，衡量的是持有者的真实技能，而非其他操作系统认证。红帽相信，寻求 RHCE
    的雇主将有信心认为他们雇佣的是一个知道如何工作的人。


    在设定并满足要求后，拥有 RHCE 的 IT 组织在实施 Linux 时无疑将更有信心、取得更大的成功。


    ## RHCE 向 RHCA 进阶


    RHCA 一词是指红帽认证架构师（Red Hat Certified Architect）。RHCA 是为 IT 专业人员提供的顶级认证，他们的重点是 Linux
    系统管理以及相关功能，例如大型企业环境中多个系统的部署和管理。RHCA 认证是 Linux 领域认可度最高、最受誉且最成熟的认证。


    你必须是红帽认证工程师（RHCE）才能认证 RHCA。获得 RHCA 认证需要通过以下领域的五个额外的性能基考试或专家考试：


    - A. 网络服务安全

    - B. 部署与系统管理

    - C. 目录服务与身份验证

    - D. 集群与存储管理

    - E. 系统监控与性能调优


    你可以按照任何顺序参加考试。有些候选人发现“部署与系统管理是其他课程的良好基础。此外，RHCA 的某些考试也是其他红帽认证所需的，例如红帽认证数据中心专家（RHCDS）和红帽认证安全专家（RHCSS），如果你以后想获得这些证书之一，可能会发现它们很有用。


    成为 RHCA 衡量的是你在 Linux 计算方面的专业知识。你让其他人了解你的知识，而红帽则是你的依靠。你的 RHCE 有效期将与你的 RHCA 保持一致。如果你的
    RHCE 不再有效，你在验证页面上将被列为“不再有效”，你的 RHCA 也是如此。


    ## 通过 RHCE 考试


    红帽认证工程师是一项基于性能的考试，测试候选者在运行红帽操作系统的服务器上配置网络服务和安全的方面的实际能力。考试在实机系统上进行。通过 RHCE 并非易事。虽然其他考试要求你回答理论问题，但
    RHCE 让你通过在实机系统上实际执行解决方案来解决问题。


    RHCE 考试是一场时长 5.5 小时的考试，分为两个部分：


    - 1. 服务器安装与网络服务，持续时间为 3 小时

    - 2. 故障排除与维护，持续时间为 ½ 小时。


    通过 RHCE 考试意味着了以下要求：


    - A. 候选者必须在一小时内完成所有强制性的故障排除问题

    - B. 在第一部分必须获得 80 分或以上的分数

    - C. 在第二部分标记为“RHCT”或“本地”（Local）的元素必须获得 70 分或以上的分数，

    - D. 在第二部分标记为“RHCE”或“网络服务”（Network Services）的元素必须获得 70 分或以上的分数。


    通过 RHCE 考试，你将获得证书和红帽颁发的编号。你被列在红帽的验证页面上，大多数潜在雇主会定期检查该页面。大多数 IT 组织倾向于雇用 RHCE，因为他们更有信心雇佣那些知道如何工作的人。


    如果候选者未能证明 RHCE 所需的要求，如果在 RHCE 考试中证明了 RHCT 特定的能力，可能会获得红帽认证技术员（RHCT）。


    ## 免费红帽 Linux：它是免费的


    操作系统竞争的主要问题在于，人们切换系统的唯一方法是通过购买新的。现在这对某些人来说可能完全不是问题，但对于其他见过这种情况的人来说，这是一个问题。


    那么它是什么问题呢？操作系统对整个计算机至关重要，没有它，即使 CPU 完好，几乎没有所谓的计算机大脑。


    而且从一个操作系统切换到另一个的操作产生了保存信息的需求，这些信息在转换为其他便携介质时将会丢失。


    过去是通过磁盘完成的，容量并不大，今天有了 USB 来弥补。尽管如此，仍然有一些信息无法传输，因此在更换过程中将会丢失。


    RHCE 100 成功密码 | 200


    除了此以外，还有许多不同操作系统系统之间相互通信的困扰。如果它们至少可以相互连接那是好的，但如果它们不能连接呢？因此，红帽正在提供限期的免费红帽 Linux。


    这将使用户能够满足他们关于系统在现实生活中表现的疑问，并亲眼见证，而不是通过供应商的承诺或制造商的信函。


    这也允许他查看它是否与其他操作系统良好地工作，在互联的世界里，不连接就像被遗留在孤岛上。所以，尝试红帽的 Linux 吧。有什么损失的呢，毕竟它是免费的。


    ## 红帽 8 及所做的改进


    随着红帽 8.0 的发布，现在的重点是它将足以打破 Windows 的魔法。每个使用计算机的人都知道 Windows 拥有的那种魔法。


    红帽 8 承诺将包含许多混合功能，以及增强的旧功能。


    其中之一是将字体存储在一个名为“目录”（directory）的组中。


    '
