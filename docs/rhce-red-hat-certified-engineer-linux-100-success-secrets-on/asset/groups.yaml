    # RHCE RAPID TRACK COURSE: FOR EXPERIENCED & SKILLED USERS


    The RHCE Rapid Track Course is really made for the experienced UNIX and Linux
    users like the system administrators and network specialists. The RHCE Rapid Track
    course is actually really geared on training these experienced users for the hands
    on components of the exam. About 40% of the course is in lecture and about 60%
    is held in labs for hands on practice.


    And since the RHCE Rapid Track course is for advanced users, it demands some prerequisite
    knowledge and skills before one can take the course. It is imperative that people
    enrolling in this course have the prerequisite skills. Or else, one would not
    be able to follow the lessons and the trainings. One may not even be successful
    in passing the exam without knowledge on the fundamental concepts of Linux and
    UNIX.


    The course generally covers topics like hardware and installation, file system
    and software administration, boot process and troubleshooting among others. What
    the RHCE Rapid Track course actually aims to accomplish is to teach examinees
    how to install and configure Red Hat Enterprise Linux, configure file systems
    and networking, configure the X Window System and configure security. It also
    enables examinees to understand hardware limitations, setup common network services
    and perform Red Hat administration services.


    All of these topics are covered in just five days. Knowledge is crammed up during
    these days. But after taking the course, examinees are also expected to have the
    skills to do the job. This will also help them pass the exam and obtain the certification.


