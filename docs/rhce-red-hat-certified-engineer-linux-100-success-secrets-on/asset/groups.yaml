    # AN OVERVIEW OF RED HAT LINUX


    Red Hat Linux is assembled by the Red Hat company and is a known Linux based operating
    system until it was discontinued in 2004. In November 3, 1994, Red Hat Linux 1.0
    also known as “Red Hat Commercial Linux” was released. It is the first Linux distribution
    to utilize the packing system; and the packing format it utilizes is the RPM Package
    Manager. This also served as the source of other distributions like Yellow Dog
    Linux and Mandriva Linux.


    However, Red Hat has stopped the line of Red Hat Linux to give way to Red Hat
    Enterprise Linux (RHEL), which is intended for enterprise environments. Meanwhile,
    Fedora was also developed to serve as the free version to complement the home
    environment. Hence, Red Hat Linux line stopped their release after the Red Hat
    Linux 9, which is the final release. This was formally ended in 2004. However,
    updates were still released in 2006 until early 2007.


    Red Hat Linux actually presents different features. Like for instance, the version
    3.0.3 was one of the initial distributions to support Linkable and Executable
    Format rather than the a.out format. Red Hat Linux also introduced a graphical
    installer named Anaconda, which is designed to simplify the use for the beginners.
    This was also adopted by several Linux distributions.


    In addition, version 7 was also released as groundwork for the 2.4 kernel. Afterwards,
    Red Hat Linux 8.0 was introduced to serve as the default encoding character for
    the system. And then a little later, version 9 was released to support the Native
    POSIX Thread Library.


    # RED HAT LINUX DOWNLOAD HELPS


    # USERS BECOME UPDATED


    Red Hat Linux download is easy to do now because of the availability of the several
    sites that provide the distribution of every user’s download needs. Such sites
    feature the search for fast mirrors, reading reviews, and getting e-mail updates
    when there is a newly released version. More often, the site presents the selections
    of downloadable versions in an alphabetical list; while others may do another
    presentation.


    RHCE 100 Success Secrets | 166


    One of the newly released versions of red Hat is the 5.3 beta. This belongs to
    the family of the Red Hat Enterprise Linux 5 and is now available to be downloaded.
    Essentially, this beta release presents the following improvements: support for
    126 CPUs and below in the x86_64 Hypervisor; support for 1 TB memory for every
    host on x86_64; NetworkManager 0.7; cluster mirror support, which presents two
    leg mirrors; up-to-date graphics drivers; initial execution of userspace training;
    re-based CUPS compete with Kerberos support; encryption support of root and swap
    in the installer; SELinux enablement of the recent NetworkManager including audit
    functionality; and re-based samba starting from 3.0.28 to 3.0.32 to support Windows
    Vista.


    This beta release is available on the platforms of Alpha, SPARC, and Intel. This
    beta version is ideal to download since Red Hat Enterprise Linux in general is
    the topnotch platform for open source calculating. Another reason is because Red
    Hat Enterprise Linux 5 is offered by subscription and presents constant value
    reason why it is practiced by leading enterprise hardware and software vendors.


    Actually, beginning from the desktop down to the datacenter, the innovation of
    Enterprise Linux comes with an open source technology and constancy of a real
    enterprise-class platform.


    # RED HAT SERVER OVER WINDOWS SERVER


    The Management Console of Xandros Bridgeways, a provider of graphical interface
    for easy configuration and access of servers and services, introduces a smooth
    conversion from Windows server to Red Hat server. The Management Console of Bridgeways
    is offered immediately to be downloaded for free from the website of Xandro, bringing
    more prevailing graphical administration of Red Hat servers to system administrators
    who are presumed to be skillful on Windows Server but not on Linux.


    This Management Console is also designed to become an-in-one for Linux administrators—sparing
    them from opting to command line selections or using several tools to manage their
    Red Hat servers. There are numbers of servers and services that are incorporated
    into a particular “managed community,” which can be slightly administered from
    any Vista or Windows XP desktop or Red Hat server.


    Amazis.net Country Manager, Marcin Zalicki, said that those Windows administrators
    who have feared to use Linux servers should never be afraid anymore. He also said
    that Windows administrators are expected to see intuitive, clear, and easy to
    use Red Hat servers of Xandros BridgeWays. In addition, Zalicki stated as well
    that Windows administrators would highly appreciate to be introduced to the supremacy
    of the Linux World.


    Essentially, by gathering services such as firewall, DHCP, Web servers, DNS, or
    virtual machines, the Management Console of the BridgeWays can lessen the administrative
    tasks to a minimum. In fact, Zalicki also stated that Windows administrators can
    run their Red Hat servers straight from their Windows machine. What is good about
    this is that no added training is needed.


    # THE NEW FEATURES UNDER RED HAT LINUX 9


    For those users who are interested to install the newest Red Hat Linux 9 version
    or Shrike, they might have a few surprises in store for them. Others might still
    hesitate and would want to stick around their old version.


    Here are a few changes that might convince the user to use Shrike:


    - First, installing Red Hat Linux 9 is as clean and straightforward as Red Hat
    Linux 8. Moreover, a user has the option to upgrade any previous version of Red
    Hat Linux that is installed on his computer. Users, however, must exercise caution
    by reading the Release Notes for information on the impact of Linux installation.
    There are users who prefer to make a clean installation by deleting the previous
    operating systems.


    - Second, a user will have a better and nicer looking login screen than the one
    in Red Hat Linux 8. The start menu is better arranged compared to the bloated
    mess in Red Hat Linux 8. There is even a very useful recent documents shortcut
    called "open recent" on the menu.


    - Third, the mouse cursor has some code changes. It is now called "Xcursor" and
    it has new antialiased, alpha blended features that makes it look better.


    - For users who had problems installing Intel i845, i852, i855 and i865 integrated
    video in Red Hat Linux 8; he won''t have these problems under the Red Hat Linux
    9.


    - For users who like to use Mozilla, then it is good news because Red Hat Linux
    9 is using Mozilla version 1.2.1 as the default web browser.


    These are just a few of the notable enhancements to Red Hat Linux 9 which users
    might find interesting.


    # ALL ABOUT RED HAT LINUX SERVER


    Red Hat Linux server offers a fully-virtualized support for Red Hat Enterprise
    Linux 3, 4 and 5, third party operating systems and para-virtualized guest operating
    system support for Red Hat Enterprise Linux 5 and version 4 Update 5.


    The fully virtualized support needs hardware features that are provided by Intel
    Virtualization Technology and AMD-V processors whereas the para-virtualized guests
    can be configured on any 32-bit x86, 64-bit x86, or Itanium2 system.


    In terms of the number of guest operations systems, Red Hat Enterprise Linux Advanced
    Platform can host in an unlimited manner. It is only constrained by physical hardware
    resources. Meanwhile, a Red Hat Enterprise Linux can support as much as four guest
    operating systems.


    What are the benefits of using Red Hat Linux server?


    - 1. In using a Red Hat Enterprise Linux host, guests do not require separate
    subscriptions. They are automatically entitled to subscription services through
    subscription to the Red Hat Enterprise Linux host. However, third party operating
    system guests must be licensed to the practices of the respective vendor.


    - 2. Having a Red Hat Linux server entails reduced costs because of server consolidation,
    savings in power, cooling, maintenance and third party software.


    - 3. Due to flexible resource management, there is improved application availability
    and response.


    - 4. Red Hat Linux server also gives IT departments the chance to innovate and
    to respond to new business demands immediately at a lower cost.


    There are many companies who have attested to the effectiveness of having Red
    Hat Linux Hat servers in terms of return of investments and increase in performance.

