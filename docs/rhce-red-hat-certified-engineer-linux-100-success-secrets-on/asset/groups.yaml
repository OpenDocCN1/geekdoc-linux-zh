    RHCE 100 成功秘籍 | 134


    《RHCE 红帽认证工程师 学习指南》包含了获得认证所需的所有主题。其目录包含 16 章，讨论了通过 RHCE 认证考试所需的所有知识。


    第 1 到 4 章分别由 RHCE 先提、硬件与安装、启动过程以及 Linux 文件系统管理。第 5 章讨论了包管理，第 6 章关于用户管理。同时，第 7
    章讨论了系统管理工具，第 8 章将介绍内核服务和配置。


    书中的其他主题包括 HTTP 服务、网络共享服务、域名服务、电子邮件以及其他网络服务。书的后续章节讨论了 X 窗口系统、服务加固和故障排除。


    # 如何判断是否获得 RHCE 良好结果


    红帽认证工程师 (RHCE) 认证被认为是最的 IT 认证测试之一。尽管如此，许多 IT 专业人士仍目标是获得 RHCE 认证，将其加入自己的专长列表。此外，通过
    RHCE 认证无疑会让 IT 行业的任何一个人感到自豪。但潜在的 RHCE 认证人士将如何知道自己已经击中了目标呢？


    获得 RHCE 良好结果只需要参加一次考试。这是 RH302，它涵盖了关于红帽 Linux 操作系统的三个不同部分。第一部分是故障排除，第二部分是多选题类型考试，第三部分是安装和配置。总之，RHCE
    最多是一场 6 小时的考试。要获得 RHCE 良好结果，候选者应满足最低 RHCE 要求。


    # RHCE 100 成功秘籍 | 136


    RHCE 候选人在三个部分的得分总加时，应获得 80 分或更高的平均分。此外，三个部分每部分应至少获得 50 分。RHCT 的技能测试应获得至少 70%，而第三部分
    RHCE 的技能测试也至少应获得 70% 的分数。


    RHCE 结果通常通过向参加考试的候选人发送电子邮件公布。邮件将解释通过 RHCE 的要求，并与候选人的得分进行比较。红帽还会显示得分摘要。在邮件末尾，候选者将看到他们是否通过了测试。


    没有获得 RHCE 良好结果的人仍然可以参加。他们尝试获得 RHCE 良好结果的次数没有限制。


    # “参加 RHCE”如何帮助了一些 RHCE 认证通过者


    许多资深 IT 认证备考者表示，红帽认证工程师 (RHCE) 认证考试是最困难的之一。对于一些 IT 专业人士来说，参加 RHCE是一项挑战，而对另一些人来说，这可能是浪费时间和。描述
    RHCE 认证考试有多困难的真实故事之一是名为《参加 RHCE》的专题。


    这篇文章由 Ken Barber 于 2004 年 4 月 6 日撰写。他是某社区学院的老师，他认为获得 RHCE 认证将对他的工作有所帮助。他也是 IT
    考试的老兵，已经通过了许多 IT 认证考试。但他认为 RHCE 认证考试是最困难的考试之一。


    尽管 Barber 没有通过 RHCE，但《参加 RHCE》帮助了许多候选人学习了关于认证考试的所有知识。他详细说明了 RHCE 考试与其他认证考试相比的地位。他说它是
    IT 认证历史上最难的三个考试之一。


    Barber 还讨论了如何妥善地准备考试。他对如何准备测试给出了不同的见解，并介绍了了参加复习班的一些益处。此外，文章还提供了一些链接，列出了候选者考试应该掌握的事项。《参加
    RHCE》也详细说明了考试期间的预期情况。


    通过《参加 RHCE》，人们知道考虑到只有 60% 的考生通过了测试，参加 RHCE 考试是有多难。


    # 年度 RHCE 竞赛的参赛资格


    为了表彰最优秀的红帽认证工程师 (RHCE)，设立了“年度 RHCE 竞赛”。这项竞赛是一项技能竞赛，不同的参赛者将竞争获得参加红帽大会 (Red Hat
    Summit)的机会。参赛者只需提交一篇关于他们为什么应该被授予年度 RHCE 短短。每个参赛者仅限一篇。此外，这项竞赛仅向特定群体开放。


    首先，参赛者目前必须持有 RHCE 认证，且该认证在竞赛开始前不会过期。此外，参赛者还应该是法国、韩国、加拿大、日本、中国、德国、瑞士、墨西哥、澳大利亚、英国、新西兰、印度、西班牙、阿根廷、爱尔兰、新加坡、荷兰、美国或台湾的合法居民。兴趣参加这项竞赛的人也应在其合法居住的国家、州或省达到成年年龄。此外，参赛者预计拥有互联网访问权限和有效的电子邮件地址。


    同时，在红帽公司及其子公司工作或其直接家属不允许参加年度 RHCE 竞赛。


    总之，这项竞赛将产生五位胜者，因为每个 RHCE 地区将有一个胜者。这些地区是北美、EMEA（欧洲、中东和非洲）、亚太、印度和南美。


    年度 RHCE 竞赛的奖励包括红帽大会的注册费、往返机票、酒店住宿、穿梭巴士交通、参加红帽大会特别活动的机会、会议餐饮、课程以及欢迎招待会。


    # 从 RHCE 考试中获得最大


    从 RHCE 考试中获得最大收益是复杂的。自律是从这些测试中获得内容的唯一关键。


    首先，模拟题并不限时。因此，候选者可以决定是否进行限时模拟。然而，建议进行限时模拟考试，因为它会更多地帮助候选者。


    此外，参加最好的 RHCE 模拟题是很重要的。可以下载的免费 RHCE 模拟题。然而，这些不包含最新的 RHCE 主题，问题通常是通用且简单的。无论如何，为模拟题付费并不很多，因为这些可以随考试包购买，也可以单独购买。


    # 《RHCE 红帽认证工程师 学习指南》书籍概述


    《RHCE 红帽认证工程师 学习指南》不仅是有效的复习材料，这也是关于 RHCE 的少数书籍之一。对于那些想要使用书籍或其他复习工具的人来说，这本书已经很棒了。它包含许多有助于准备
    RHCE 认证考试的功能。


    该书自称对 RH302 考试中的所有主题覆盖率为 100%。主题包括不同硬件的配置和安装、启动过程、Linux 文件系统管理以及 Kickstart。书中还讨论了包管理、组和用户管理、不同的系统管理工具以及内核配置和服务。其他包含主题包括
    Apache 和 Squid、网络文件共享服务、域名、X 窗口系统、故障排除、SELinux、防火墙、安全包、DHCP 和扩展网络服务。


    此外，书中还有“考试就绪清单”，让读者可以随时检查自己是否为考试做好了准备。书中的考试章节也突出了涵盖的不同考试主题。

    '
