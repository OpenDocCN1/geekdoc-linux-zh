    study guide for the RHCE exam. They do not take responsibility for other guides,
    books, online resources, or any other information provided by organizations or
    individuals other than Red Hat Global Learning Services.


    Study guide books are one source of Red Hat''s Learning Services. These study
    guide books includes basics, installation, working with shells and editors, GNOME
    desktops, KDE Linux desktop and more. Other than theoretical details, it also
    includes practical exercises at the end of each chapter for self-assessment.


    Study book guides are designed to provide practical hands on skills as well as
    theoretical aspect, so as to prepare reader for the RHCE exam. This also allows
    engineers to assess their in-depth knowledge of the subject. The use of study
    guide books allows readers to practice in the installation, configuration, and
    activation of network services, just in time to get ready for the certification
    exam.


    Red Hat also provides RHCE candidates a preparation guide prior to the actual
    exam. It has a website that provides information and explanation about RHCE exam.
    On the site explains why performance based exam is used for RHCE exam.


    It also informs readers as to the authorized training partners of Red Hat that
