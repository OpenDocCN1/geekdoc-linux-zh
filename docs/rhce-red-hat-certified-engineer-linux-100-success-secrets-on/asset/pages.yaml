    output and the directives that he needs to follow.


    Troubleshooting as mentioned awhile ago may involve hardware or software. If software
    is involved, you are required to have at least average knowledge with 2 or more
    operating systems as prerequisites to have the certification exam for RHCE. Usually
    one operating system should be designed to work under networking platform and
    the other one in stand alone environment. If you are taking the hardware troubleshooting,
