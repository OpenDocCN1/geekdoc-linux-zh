  md: '# TROUBLESHOOTING: ONE OF RHCE’S CORE EXAMINATION PHASES


    You see, the certification examination given by the Red Hat Certification for
    Engineers is more of the practical and hands-on-and not the usual written examination.
    The core examination which largely takes the bulk of the scoring comes from the
    actual troubleshooting (whether it is a troubleshooting the OS or the hardware).


    Troubleshooting is a combination of all things in the software and hardware section
    of information technology. It involves setting up the hardware part or installing
    the software onto the hardware and making sure that nothing goes wrong with the
    installation and setting up. Should there be any issues with the installation,
    you should be able to diagnose the problem and troubleshoot the problem (meaning
    give the best possible resolution to the issue).'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'What is good about the troubleshooting part is that the candidate for RHCE
