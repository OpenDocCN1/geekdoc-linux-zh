  md: '# THE STRUCTURE OF THE RHCE EXAMINATION


    One of the things that most examinees would like to know when they are to take
    a certification examination is how the examination was structured. The structure
    of the examination or how the examination was divided based on the type or nature
    of questions that will be asked during the actual certification gives the examineee
    a sense of relief. By merely knowing what is there to expect makes an examineee
    come better prepared.


    Typically, the Red Hat Certification for Engineers is composed of two parts. These
    are further elaborated below:


    +   A. The Section 1 is the Main Troubleshooting and Maintenance. This is usually
    a 3 hour examination which is all hands-on or in layman''s term it is the laboratory
    examination.


    +   B. The Section 2 is the Proper Way to Install and Configure a System (both
    hardware and software). This is more or less a 3 hour examination which involves
    directly installing and configuring an operating system via the network.'
  merge: -1
  pgno: 57
- img_proc: true
