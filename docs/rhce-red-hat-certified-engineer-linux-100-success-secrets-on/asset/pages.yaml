  md: '# ONLINE TRAINING AVAILABLE FOR RHCE


    With new technology, training becomes convenient for those who want to learn at
    their own paced. Busy people find training online beneficial as they can learn
    at anytime and anywhere. Engineers who wants to take the Red Hat Certified Engineer
    Exam (RHCE) but does not have time to go on face to face classroom training should
    consider preparing for the exam through online training.


    Online Training for RHCE can be on any of the following:


    +   1. Virtual Training — offers a real-time instructor-led training. The training
    classes are done on a four hour increment schedule, Monday through Friday for
    two weeks period. The training class sessions starts at 1pm Eastern Standard Time
    and is currently available only to customers in the US and Canada.


    +   2. ELearning — self paced courses delivered 100% over the Internet. The courses
    are written and prepared by subject matter of Red Hat experts and experienced
    instructors. The exercises at the end of each subject are graded automatically.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '+   3. Live Access Lab – provides an environment for participants to conduct
    self-paced lab learning similar to what students experience in regular RHCE track
    courses. Participants are given access to a server that provides network infrastructure
    services and a yum repository with the RHEL5 distribution and the troubleshooting
    software from the RHCE track courses. Participants are able to do a re-work lab
    exercises from Red Hat training, or to experiment with advanced configuration
    of the machine or its services.


    The curriculum for the RHCE Online Training will cover the same skills and objectives
    that face to face classroom training is designed. These RHCE Online Trainings
    delivers web training to candidates preparing for the RHCE Certification Exam,
    so pick the one that best suits your need.'
