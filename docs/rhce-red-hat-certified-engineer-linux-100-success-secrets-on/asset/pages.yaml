  md: '# RHCE CERTIFICATION EXAM:

    WHAT IS IT?


    The goal of Red Hat Certified Engineer or RHCE certification exam is to measure
    the competency of an IT individual in live systems. The focus of the RHCE certification
    exam is basically on the implementation of the Red Hat operating system. Passing
    the RHCE certification exam means that individuals have the skills to configure
    networking services and ensure security on servers that are running on the Red
    Hat operating system.


    The RHCE certification exam is about 5 hours and 30 minutes. There’s a 30 minute
    multiple choice exam of about 40 to 50 questions. The remaining 50 hours consist
    of two hands on exams. And because of these hands on component, RHCE exams are
    given on a scheduled basis.


    Since the RHCE certification exam is more of hands on than an objective type of
    an exam, there’s less room for guessing. IT individuals should really be knowledgeable
    on all aspects of Linux. One must also have ample experience as an administrator
    of systems running in Linux.'
  merge: -1
