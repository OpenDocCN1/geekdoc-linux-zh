    Red Hat website. This will give individuals an idea on how prepared they are for
    the test and how much studying they have to do to pass the exam. IT individuals
    must remember that the passing grade is 80% and they must not score below 50%
    in any of the three components. They must therefore choose the RHCE course appropriate
    for their level of knowledge and skills. There are a few RCHE courses offered
