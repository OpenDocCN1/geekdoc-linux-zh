  md: '# IMPORTANT THINGS THAT CANDIDATES SHOULD LEARN ABOUT THE RHCE EXAM


    Red Hat Certified Engineer (RHCE) certification is known as one of the toughest
    Red Hat exams. But more than just being the toughest, there are still other things
    that candidates should know about RHCE exam.


    The RHCE exam is more of a performance-based test. This means that the candidate
    should perform similar to real-life situations. Besides, all the questions are
    practical and only few are theoretical. So, if the candidate is planning to take
    the exam, it is advised that he focus more on performance and practical questions
    rather than the book-based knowledge.'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'Also, the RHCE exam is only administered by Red Hat certified training partners.
    There may be some unscrupulous groups who will disguise as a certified training
    partner only to get the exam fees from candidates. Due to this candidates are
    advised that before paying the exam fee to the training partner, they should first
    check if the training partner is certified by Red Hat.


    Meanwhile, the results of the RHCE certification exam will only come from Red
    Hat. Even its certified training partners cannot release a list of passers and
    they are not also authorized to reveal the candidates'' scores.


    Also, the RHCE exams are given in three sections with two general parts. The general
    parts are troubleshooting and system maintenance, which can be taken for a maximum
    of two and a half hours, and the installation and configuration, which can be
    answered for at most 3 hours.


    To ensure a passing remark from RHCE exam, the candidate can enroll in any authorized
    Red Hat courses. They can take an online assessment of skills to determine what
    their weak points are and help them decide the course they need to take.'
