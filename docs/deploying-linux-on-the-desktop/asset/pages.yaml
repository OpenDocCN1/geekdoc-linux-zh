  md: '# Acknowledgments


    I would like to thank my wife Romy and my extended family for their ongoing support
    throughout the writing of this book. Romy gave me the time to work on this book
    by keeping the “honey-do” lists to a minimum and encouraging me to continue to
    write. Romy also donated her doctoral thesis as the best test of many of the document
    tools available for Linux: pages of her work are within this book. Thank you,
    Romy; I deeply appreciate your support.


    Furthermore, I would like to thank my friends Chris and Pat for reviewing the
    chapters for technical faults as they rolled off the word processor, and for keeping
    me on my toes with their insightful questions and suggestions. Many thanks! In
    addition, I would like to thank Pat for providing part of a chapter on the iPAQ;
    he has one, whereas I only have a Palm device.


    Last, I wish to acknowledge my friends, coworkers, and family for their support
    and encouragement.


    Much more than a jumpstart, this book is my recipe for building usable Linux corporate
    desktop that moves far beyond migration to Linux and into the concept of integration.
    This book endeavors to meet the challenge of integrating Linux into the corporate
    environment with a minimized learning curve and no loss of functionality. This
    book presents the tools necessary to build toward integration, as well as the
    costs and support considerations that arise from the use of Linux on the desktop.
    Included is my personal recipe for building my laptop (see Chapter 13).'
  merge: -1
