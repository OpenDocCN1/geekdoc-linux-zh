  md: '# Home Office Tools


    This chapter will discuss tools that are more commonly found on the home desktop
    but can be found on the corporate desktop as well. We will show solutions for
    connecting Palm or Pocket PC handheld devices to the Linux desktop and discuss
    mechanisms to synchronize your PDA''s data. Specifically, we will look at synchronizing
    photographs and Documents-To-Go files with the PDA. In addition, we review accounting
    programs and digital solutions.


    # 8.1 Do I Synchronize My PDA with Linux?


    Synchronizing your Palm OS device with Linux is quite simple if you have pilot
    support for your desktop, mail client, and pilot-link installed. Most, if not
    all, of these are available directly from each distribution; however, they are
    not always installed. There are several subsets to this question we will also
    address. It should be noted that newer Palm devices might require a change to
    the visor kernel module to work properly (This modification is generally to the
    visor.h file in your kernel source directory). Refer to the http://www.pilot-link.org
    website for updates for your kernel visor-module. While this change is relatively
    trivial, it can void warranties on Enterprise Linux distributions. At the very
    least, the following programs are needed to synchronize a Palm device with Linux.


    # 8.1.1 RHEL


    ```

    up2date pilot-link

    up2date gnome-pilot

    2date evolution

    ```


    Pilot-link provides the basic tools to synchronize your Palm device with Linux,
    while the others add more features to the system, including auto-'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# 8.1 How Do I Synchronize My PDA with Linux?


    matic synchronization when the Palm device is connected (gnome-pilot), a conduit
    settings editor (gnome-pilot), and the ability to synchronize your Palm calendar,
    notes, and addresses (Novell Evolution). With all tools, synchronizing your Palm
    device with Linux becomes very straightforward. However, finding the proper port
    is not always simple, and for that you will need to use the pilot-link tools directly.
    There are, however, some general rules; the first is that Visor devices use /dev/ttyUSB0
    and Palm devices are not always accurate, and for Sony devices they could be reversed.
    It should also be noted that the USB port does not correspond to the physical
    USB device.


    # 8.1.2 Finding the Proper Port for Your Palm


    The dpsh command will allow you to print out information about your Palm device.
    This information can be used to verify connectivity as well as providing a handy
    command line interface to gain information about the files stored on your palm.
    When the device asks you to press the HotSync button, and so you will be connected
    only if you choose the proper device. Since I am synchronizing a Palm Tungsten
    device, I chose to use /dev/ttyUSB1, and it connected after HotSync. Some times
    you need to press HotSync before running dpsh. Try both methods, and use the df
    command to read data from the Palm device and verify its accuracy against the
    Palm device. It should also be serial port connections available to dpsh. The
    devices in question will be /dev/ttyS0 or /dev/ttyS1, depending on which device
    the Palm card plugged into.


    ```

    dpsh -p /dev/ttyUSB1

    Listening to port: /dev/ttyUSB1

    ```


    Please press the HotSync button now... Connected


    Welcome to the DLP Shell

    Type ''help'' for additional information


    ```

    dpsh> df

    Filesystem      1k-blocks     Used Available      Used Total

    Card0:ROM       16515072            n/a 16515072      n/a 16128k

    Card0:RAM       66060288    39241776 26813112     59% 64512k

    Total (ROM + RAM) 82753660    55762248              n/a n/a 806409k

    ```'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# 8.1 How Do I Synchronize My PDA with Linux?


    ![](img/a063699af5597deead6a12a449cc2aa3_138_0.png)


    Now that the Palm port is known, in this case /dev/ttyUSB1 we use this to configure
    the automatic synchronization tool, gnome-pilot. Select Red Fedora->Preferences->More
    Preferences->PalmOS Devices to launch the gnome-pilot applet (gpilotd-control-applet)
    to start the gnome-pilot configuration tool (Figure 8.1).


    Then press Forward to select the USB port for your Palm (Figure 8.2).

    Be sure to select /dev/ttyUSB1 or, if you are only going to synchronize this Palm
    device to your system, you can make a symbolic link to /dev/pilot to simplify
    matters.


    ```

    ln -s /dev/ttyUSB1 /dev/pilot

    ```


    Once the proper port, speed, and USB selection are made, continue selecting Forward.
    Where a selection on whether this is the Palm Device has been synchronized to
    this machine is presented (Figure 8.3), select Yes and then Forward.


    Now it is time to perform your first HotSync so that the gnome-pilot software
    can retrieve the UserName and Palm ID from the Palm device. If this dialog box
    appears, I always select Yes. The only time No would be selected is if the Palm
    device had never been initialized with a username or never been synchronized from
    or to any other HotSync software. The HotSync dialog box is shown in Figure 8.4.


    If some reason the Palm device does not synchronize, verify the permissions of
    the port used. In this case, /dev/ttyUSB1 had permissions of rw-rw---- (ls -al
    /dev/ttyUSB1) and ownership of root.uucp,'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'Figure 8.2 Cradle settings for Palm in gnome-pilot.


    ![](img/a063699af5597deead6a12a449cc2aa3_139_0.png)


    Figure 8.3 Pilot identification dialog box for gnome-pilot.


    ![](img/a063699af5597deead6a12a449cc2aa3_139_1.png)


    which implies that only root and those users in the uuuc group can access the
    device. You will need to correct this before you can proceed; once the permissions
