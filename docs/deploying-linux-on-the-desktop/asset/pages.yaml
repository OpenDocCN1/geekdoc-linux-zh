  md: '# File Sharing


    File sharing is an important feature of the desktop, so we will discuss ways of
    accessing file shares using CIFS (Common Internet File System), Apple-Talk, and
    NFS (Network File System) from the Linux desktop. We will also include a discussion
    about reading and writing different CD-ROM and hard disk formats.


    When using CIFS and AppleTalk, there is an assumption that your desktop login
    will be your login to the file-sharing servers across the network. With Linux,
    this is not generally the case, but it can be with a properly configured samba/ldap/kerberos
    setup, so different approaches may be needed. We will cover standalone Linux,
    Wine, and VMware solutions to such file-sharing problems. Last, we will delve
    into how to read the myriad CD-ROM and hard disk formats in use today.


    # 5.1 How Do I Authenticate against an Active Directory Server?


    To authenticate against an Active Directory server, you must use the Kerberos
    system via the PAM security subsystem. Active Directory uses Kerberos to authenticate.
    There is, however, a caveat when using the pam_krb5 module: you must be on the
    network first, so road warriors need to connect to the VPN before they can log
    in and authenticate against the AD server.


    # 5.1.1 RHEL3


    First ensure that the following RPMs are installed:


    ```

    authconfig-gtk

    pam_krb5

    krb5-libs

    krb5-workstation

    ```'
