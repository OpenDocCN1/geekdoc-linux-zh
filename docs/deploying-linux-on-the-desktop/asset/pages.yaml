    ```

    # dmesg | egrep ''hd|sd''

    de: LEXAR ATA FLASH, CPA DISK drive

    de: attached attached ide-disk driver.

    de hde: task_no_data_intr: status=0x51 { DriveReady SeekComplete Error }

    de hde: task_no_data_intr: error=0x04 { DriveStatusError }

    de hde: 2014992 sectors (1032 MB) w/1KiB Cache, CHS=1999/16/63

    de h: [PTBL] [999/32/63] hdel

