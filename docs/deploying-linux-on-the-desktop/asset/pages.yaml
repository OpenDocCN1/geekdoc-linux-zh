    # 6.1.2 ChatZilla


    The ChatZilla tool is provided as a part of the Mozilla Web browser, and has many
    of the required features as well, except timestamped messages. However, ChatZilla
    does host a more aggressive style of highlighting and notifications. You can access
    ChatZilla from the Mozilla tools menu. The interface is shown in Figure 6.2.


    # 6.1.3 mIRC


    mIRC is a very common Windows-based client that can be run on the Linux desktop
    using either CrossOver Office ($79) or VMware ($199). While CrossOver Office or
    Wine provides Linux users with a method to run mIRC, some of the program''s sound
    notification features may not work. Once mIRC is installed into CrossOver Office
    (Appendix A), you will need to create a menu item for it using the following code
    so that you can launch the program easily.'
