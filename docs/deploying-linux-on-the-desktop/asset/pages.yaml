  md: '# About this Book


    Covering Red Hat Enterprise Linux 3 and 4, SuSE Enterprise Linux 9, and Mandrake
    Linux, this book provides the necessary tools that will allow its readers to use
    Linux within a Microsoft-centric network environment. It is an invaluable reference
    regarding the creation of an integrated Linux corporate desktop!


    E-mail address: books@astroarch.com


    Web site: http://www.astroarch.com/~elh/books'
