    # 8.5 Is There a QuickBooks Equivalent?


    GnuCash (http://www.gnucash.org) will work as a business tool but does not import
    or read QuickBooks files. However, if you are using CrossOver Office, you can
    use QuickBooks Pro with no issues. Please note that you will need version 4 of
    CrossOffice for QuickBooks to run properly in CrossOver Office. Installation of
    QuickBooks follows all the normal instal-


