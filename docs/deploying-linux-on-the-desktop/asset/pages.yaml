  md: '# 3.1.1 OpenOffice


    OpenOffice is the most commonly suggested tool for editing Word documents. Specifically
    you would use the OpenOffice Suite''s writer tool. You can run writer from the
    command line or select its icon from the toolbar.


    OpenOffice does have problems with Word documents. At the very least you may experience
    formatting issues (i.e., incorrect page numbering and page alignment; see Figures
    3.1 and 3.2). At the most, graphics may not appear where you had originally placed,
    or sections of text may be misplaced. This disconnect is placed because some of
    the more esoteric features of Word do not work with OpenOffice, which is by its
    nature behind the development curve.


    Due to the different fonts available and issues with page numbering, the visual
    format of the document can appear skewed. You may wish to choose one system upon
    which the final format will be performed.


