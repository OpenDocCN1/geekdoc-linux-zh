- img_proc: true
  md: '# How Do I Access NFS File Systems?


    NFS shares are the mainstream of network file sharing on Linux. Authentication
    is not a concern for these file systems, since the authentication model is at
    the system level and not at the user level. User access is governed by the standard
    Linux permissions. Mounts using NFS require mount points and root access to perform
    any mounts. If users need access to perform mounts, the sudo command, an alternative
    for logging into root that logs all rootbased actions, can be used to perform
    the following mount command:


    ```

    mount <directory@machine> <mount-point>

    ```


    # How Do I Access Macintosh Based Filesystems?


    In some cases you will be required to access files that reside on a Macintosh
    computer. While most modern Macintosh computers speak either NFS or CIFS, there
    are older computers that speak AppleTalk. AppleTalk can be spoken by Linux using
    the netatalk package (http://netatalk.source-forge.net).


    # How Do I Access Various CD-ROM Formats?


    The most commonly used CD-ROM format is ISO 9660, with or without extensions.
    ISO 9660 CD-ROMS are easily accessed using the mount command, and depending on
    whether or not your system has been hardened, they will automatically be mounted
    to the desktop. The mount command to use:


    ```

    mount -o ro /dev/cdrom <mount-point>

    ```


    Note that the mount point is a directory to which you have access. Modern Linux
    installations for the desktop or workstation will expose CD-ROM access functionality
    to the user and will automatically mount all common CD-ROM formats without the
    need to use the mount command which can only be issued by a system administrator
    by default. In the case of hardened systems, this option may not be available.
    You can use the information in Table 5.1 to access most common CD-ROM, floppy,
    or even hard disk formats. The command sequence when using this table is:'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# How Do I Access Other Disk Devices?


    mount -o options -t type /dev/cdrom <mount-point>


    When using Table 5.1 there are a few caveats. The first is that if you are using
    an ISO 9660 CD-ROM, you can simplify the command to:

    mount -o options /dev/cdrom <mount-point>


    A system administrator can set up the /etc/fstab file to handle each of these
    formats so that automatic mounts happen. For floppy disks the /dev/fd0 device
    would be used in place of /dev/cdrom.


    # Table 5.1 Accessing Common CD-Rom, Floppy and Hard Disk Formats


    | Format | Type | Options |

    | Multissession (older) | udf | ro |

    | Multissession (modern) | ISO 9660 | ro |

    | CDRW | ISO 9660 | rw |

    | Macintosh (native) | hfs | ro |

    | Macintosh | ISO 9660 | ro |

    | Linux (native) | ext2 | ro |

    | Linux | ISO 9660 | ro |

    | UNIX (native) | ufs | ro |

    | UNIX | ISO 9660 | ro |


    # 5.5 How Do I Access Other Disk Devices?


    Let''s look at some other formats of interest as well. For example, if the machine
    has Windows on one disk and Linux on another, you may have to access data from
    both disks, no matter how the machine is booted. If your Windows disk is NTFS,
    you can use the experimental NTFS disk format available to Linux; however, if
    you mount NTFS read/write instead of the suggested read-only, you run the risk
    of corrupting the hard disk. The NTFS and UFS read/write drivers must be compiled
    into your kernel first, which could void your distribution warranty as it is not
    a supported configuration.


    The method of mounting is the same as a CD-ROM; however, you will have to determine
    which the disk device to use. If access to the disk is a reg-'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'ular activity on your Linux desktop, you will also want to add an entry into
    your /etc/stab file to automatically mount the disk on boot. Table 5.2 contains
    from Table 5.1, and the same style of mount commands are available.


    # Table 5.2 Accessing Other Disk Devices


    | Format | Type | Options |

    |---|---|---|

    | NTFS (hard disk) | ntfs | ro/rw |

    | Compact Flash | vfat | rw |

    | UNIX (native) | ufs | ro/rw |


    There are many ways to determine which hardware is available to your machine by
    default. In this search, I check the output of the mount command to determine
    which devices are automatically mounted or available to me. If the device is not
    in this list, then we proceed to different mechanisms. Since we are only looking
    for disk devices, the mount command will tell us all the currently mounted devices.
    Many of the lines can be ignored as not useful, but the key ones are the partitions
    /dev/hda2 and /dev/hda1, which all belong to the /dev/hda disk.


    +   -dev/hda2 on / type ext3 (rw)

    - none on /proc type proc (rw)

    - none on /dev/pts type devpts (rw,gid=5,mode=620)

    -usbdevfs /proc/bus/usb type usbdevfs (rw)

    -dev/hda1 on /boot type ext3 (rw)

    - none on /dev/shm type tmpfs (rw)


    This tells us that only /dev/hda is currently mounted.


    # 5.5.1 RHEL


    We use to determine which other devices can be mounted, we can review the output
    of the hwbrowser command, which displays all the currently active devices available.
    Once you run the command, a dialog box will appear, as shown in Figure 5.6.


    The Hardware browser will open to your current CD-ROM drive. To determine the
    other disk devices available, click on Hard Drives and they will be displayed
    (as shown in Figure 5.7). In this case, I wanted to find out the disk device for
    my compact flash card, which is loaded into the PCMIA slot.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# How Do I Access Other Disk Devices?


    ![](img/a063699af5597deead6a12a449cc2aa3_106_0.png)


    ![](img/a063699af5597deead6a12a449cc2aa3_106_1.png)


    In Figure 5.7, you can see that the device I want is the hde device, specifically
    the /dev/hde1 device and partition.'
