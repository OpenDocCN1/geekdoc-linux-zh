  md: '# 5.5.2 Mandrake


    Similar to hwbrowser is the harddrake2 command, which appears in Figure 5.8; it
    will show you the exact device necessary to use in the left column. Clicking on
    the device will show you the device and partition necessary for a mount to occur.


    ![](img/a063699af5597deead6a12a449cc2aa3_107_0.png)


    # SuSE


    SuSE uses its own Hardware browser, which is different from the others. It will
    present similar to the following after starting YaST and selecting Hardware Information
    from the right hand side. Once the Hardware Information dialog is opened you can
    scroll down and expand the Disk Section to show the device associated with each
    disk drive (see Figure 5.9).


    Now that this information is available, we can move forward with the appropriate
    command:


    ```

    mount -t vfat /dev/hdl /mnt

    ```


    If for some reason the Hardware browser (for your Linux installation) does not
    show your devices, you can then refer to the output of dmesg to determine the
    available devices, using this:'
  merge: -1
