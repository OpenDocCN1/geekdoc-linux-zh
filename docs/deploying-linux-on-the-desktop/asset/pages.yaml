    Are we done yet? Unfortunately not, since you need to specify which video output
    driver you will use. Additionally, to make matters interesting, the graphical
    player (gmplayer) uses its own configuration files, which you can edit by right-clicking
    on the program and selecting Preferences. For the command-line tool used by Web
    browsers, you can edit the file ~/.mplayer/config so that it has the following
    line inside:


    ```

    vo=x11

    ```


    For gmplayer you can also select the X11 video output driver from the Preferences
    window under the Video tab. The available drivers are shown in Table 4.1.


    Table 4.1 Available gmplayer Drivers


    | Xmage | Matrox G200/G4x0/G550 |

    | Xv | X11/Xv |

    | x11 | X11 (Ximage/Shm) |

    | Xvidix | X11 (VIDIX) |


    While you can use other drivers if you have the appropriate hardware (Matrox and
    VIDIX), using the x11 driver will work on all machines and depends on your Xfree86
    installation rather than on specific hardware.'
