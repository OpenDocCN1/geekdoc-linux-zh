    # The Cost


    Everyone can agree that the COST of NOT protecting your system from SPAM and virus
    will be much more than NOT protecting your system and therefore the network. However,
    this does not imply that the most expensive solution is the best for your corporation.
    For virus filtering, many of the existing corporate definitions can be used, or
    the inexpensive tools or even active developed free tools.


    # Support


    Support for each of the tools must be considered as these are evils that must
    be conquered. MailScanner and SpamAssassin are very actively developed tools,
    while SpamBouncer is infrequently updated. There is even substantial Support for
    MailScanner from third parties that will augment the dis-'
