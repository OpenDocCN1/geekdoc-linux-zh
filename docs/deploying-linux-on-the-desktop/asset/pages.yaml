    Choosing your requirements in advance gives you a clear understanding of what
    you will need on your Linux desktop. It also gives you an opportunity to reflect
    on the use of these tools. In some cases, you may find only need tools in their
    most basic form, while in others you may need more advanced features. For example,
    a Word document may be your format of choice, and the only advanced feature you
    use is the grammar checker; another office may require that change control and
    tracking be used with every document. These extra requirements can change which
    tool you decide to install on your Linux desktop.


    So our example would change to look something like the following, as each tool
    is considered and its feature use is understood:


    Word—grammar/spell-checker


    Excel—graphing capability'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'Exchange—single user and group accounts

    Printing—Windows-based printer access

    File sharing—Windows-based file sharing

    Palm OS Desktop and HotSync—Documents-To-Go

    Web browser with Word/Excel plug-ins

    IRC


    Understanding how the tools are used in your current environment will aid determining
    what you need to do on a Linux system to achieve the same results, whether or
    not your new Linux desktops must be changed to reflect how things are handled
    on your central servers. Such knowledge could even affect your security settings.


    Finally, advance planning will also help you understand the training that may
    be required as people switch from one operating system to another. It must be
    understood in advance that seemingly equivalent tools on Linux do not behave in
    exactly the same way as the tools in the Microsoft environment. The installation
    and configuration of such tools are often radically different not only between
    Linux and Microsoft, but also between various Linux distributions. This book will
    concentrate on Red Hat Enterprise Linux version 3 Workstation (RHEL3 or RHEL3-WS).
    Wherever possible, we will also look at the SuSE, Mandrake, and Fedora distributions
    of Linux.


    In summary: You can use the chapter list to create a list of the tools you will
    need in advance. Make note of any specific features in the tools you select that
    will be required either by local system settings, corporate use guidelines, or
    security requirements. Last, make sure you understand the learning that will be
    required as you move to your new Linux environment.'
  merge: -1
