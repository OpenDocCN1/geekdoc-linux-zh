- img_proc: true
  md: 'tribution support that may be available for SpamAssassin. The cost of support
    from these companies varies greatly. In addition, clamav while an active opensource
    project may not be what is required when major virus companies are providing milters
    of their own for Linux based mail transport agents.


    # 9.6 Conclusion


    Pick which tools are required by your IT department or if going it alone, use
