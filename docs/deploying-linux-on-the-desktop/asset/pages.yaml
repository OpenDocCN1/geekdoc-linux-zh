  md: '# How Can You Scan a Machine for Viruses?


    The same way that you use ClamAV to scan for e-mail viruses, you use it to scan
    a disk for viruses. The key is to keep the virus software up-to-date, and ClamAV
    provides freshclam to do just that. Default, fresh-clam runs daily. Clamscan,
    ClamAV''s antivirus scanner, does not run daily or at all in an automated fashion.
    You can set up clamscan to be run by each user individually or via the whole system.
    I like the complete system approach, which centralizes control. To do this, create
    the file /cron.daily/doclamscan will run the antivirus file system scanner daily,
    and the output will automatically be e-mailed to root, so that the administrator
    can handle any problems:


    ```

    #!/bin/sh


    /usr/bin/clamscan --stdout -r --exclude /files --exclude /mnt

    > /var/log/clamscan.log

    grep -v "OK" /var/log/clamscan.log | grep -v "Excluded" | grep "Empty file.\$"

    ```


    Clamscan can take many --exclude options you want to give it. In our case, we
    are ignoring external file systems, which will greatly speed up the processing.
    The output would be similar to the following in root''s e-mail:


    ```

    LibClAV Warning: Multipart MIME message contains no boundaries

    LibClAV Warning: messageFindArgument: no ''='' sign found in MIME header

    LibClAV Warning: Multipart MIME message contains no boundaries

    LibClAV Warning: Unsupported format "knowbot'' - report to

    bugs@clamav.net

