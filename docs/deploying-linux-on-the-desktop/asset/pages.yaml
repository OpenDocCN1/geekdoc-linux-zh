    # 2.4 Wireless and Other Network Devices


    The complexities of modern wireless devices deserve a mention. Many of the slower
    wireless devices work out of the box on Linux. These devices are following the
    Wireless-B standards. However, the modern Wireless-G devices (except for Prism-based
