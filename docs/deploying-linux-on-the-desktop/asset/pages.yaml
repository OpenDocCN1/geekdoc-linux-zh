  md: '# The Requirements


    Looking at the world of the desktop computer, you see a myriad of solutions ranging
    from Microsoft Windows 98 and other versions, to Macintosh computers of all types,
    to Linux, the new rising star. While we know that Microsoft Windows and Macintosh
    have been competitors, and more eyes are investigating Linux as a solution to
    rising IT costs. Even so, many are unwilling, or unprepared, to take the plunge
    and use this opensource operating system. So more information is needed, a readily
    available resource that both addresses the issues inherent in using Linux in a
    non-Linux-centric desktop world and provides an information source for IT managers
    and those system administrators with a clear understanding of Linux basics.


    It is necessary to describe the complete scope of this book based desktop-user
    requirements. These requirements will dictate the questions to be answered by
    each subsequent chapter of this book, and stem from two basic questions:


    +   1. Is Linux ready for real use as a desktop?

    2. Is Linux ready to be used as a corporate desktop?


    The easy answer to both is yes. Linux is ready, but the matter is much more complex
    than that. Let us look at two distinct scenarios and try to refine our answer.


    The first scenario consists of using Linux as a replacement for all existing machines,
    from file servers to desktops: a homogenous Linux solution that will not interact
    with any other types of systems. The second scenario consists of a heterogeneous
    solution, in which Linux may act as a desktop,'
  merge: -1
  pgno: 18
- img_proc: true
  md: "server, and so on. While the first scenario is a dream many Linux developers\n\
    have, the second scenario is a more honest world view.\n\nScenario One is a rousing\
    \ affirmative. Everything works as expected\nfor the corporate environment.\n\n\
    Scenario Two is a golf-clap affirmative. Everything will work, but it\nrequires\
    \ more of a mixed-mode desktop, which uses Linux as the\noperating system and\
    \ possibly tools such as Wine and VMware to\ncomplete the interoperability requirements.\n\
    \nWith Scenario Two firmly in mind, we should look at Linux as an\nenabling tool\
    \ that has some native applications, as well as tools to use\nnon-native applications\
    \ that may have no Linux equivalent. Each chapter\nlooks at the desktop from this\
    \ world view and answers the questions\npresent to an administrator who must solve\
    \ the problems of maintaining a\nheterogeneous environment that interoperates\
    \ successfully, and identify the\ncost and benefits the administrator can bring\
    \ to the IT manager who makes\nth decisions.\n\nWhile this book can be viewed\
    \ as a list of Frequently Asked Questions\n(FAQ), a collection of how-to-documents,\
    \ or a list of power tools or hacks I\nwill answer the IT manager’s question,\
    \ \"What is the cost of using Linux on\nthe corporate desktop?\" as well as the\
    \ system administrator’s question,\n\"What is involved in implementing Linux on\
    \ a corporate desktop?\" To\ncome up with this information, we must first visit\
    \ the requirements of a\ncorporate desktop.\n\nThe list of requirements has been\
    \ taken from my own experiences in\n a common desktop within a corporate environment\
    \ on a laptop that\nmust be usable by all described user types. We have approached\
    \ this list to\nfulfill the needs of three different user types:\n\n+   1. Telecommuter—Tools\
    \ and requirements to set up a home office\ndesktop\n2. Corporate office user—Tools\
    \ and requirements to set up an effective\nLinux desktop in the corporate office\
    \ or cubicle\n3. Road warriors—Tools and requirements to set up a useful Linux\n\
    environment on a laptop"
  merge: -1
  pgno: 19
- img_proc: true
  md: 'The requirements are broken out for these environments by classification of
    tools. The order of the requirements, and hence the chapters, takes the reader
    from the basics of connectivity through the final touches of more esoteric desktop
    tools. It should be noted that a broad stroke of the brush has been used with
    our lists of requirements; your environment may not need every tool discussed
    and may need other tools not discussed here.


    Listing your requirements before you delve into setting up and integrating a Linux
    desktop is extremely important, as it will set the tone for your method of integration.
    It will also give you a chance to plan your approach and any possible outlay of
    money needed to finish the integration.


    Consider the following example: Your corporate environment uses Microsoft Office,
    you do not need Access, Visio, or FrontPage. However, use of e-mail, Word, and
    Excel is paramount. In addition, you have network printers as well as Windows-based
    file servers. Everyone in the office has a PalmOS device of some type. Web content
    is generally simple, with shared Word or Excel documents available. Last, IRC
    is the interoffice communication tool of choice.


    Looking at the above example it appears that requirements are the following:


    +   * Word

    * Excel

    * Exchange

    * Printing

    * File sharing

    * PalmOS Desktop and HotSync

    * Web browser with Word/Excel plug-ins

    * IRC


    This book covers the following requirements, of which the above is a subset. While
    your requirements may not be so limited, these are a typical core list and make
    a good example of how to use this book to determine what you will need. Once you
    have defined your requirements, you can then peruse the appropriate chapters and
    determine which apply to your desktop environment. Each chapter will be laid out
    in an easy-to-read ques'
  merge: -1
