    +   Using YUM, specifically install some extra software from the Dag Weiers repository
    using the following command. You should note that some security software mentioned
    in this list is not discussed in the book; this is the list I harden by machines.


    ```

    yum install mplayer mplayer-skins mplayer-fonts xine clamav clamav-db clamtk chkrootkit
    kino perl-Curs perl-Tk yumi

    ```


