  md: '# 8.2 How Do I Synchronize Documents to Go My Palm Device with Linux?


    ```

    ##

    doc="MSWD"

    typ="DTGP" .doc

    name="basename $1"

    if [ $name = "$1" ]; then name="basename $1 .DOC"; doc="MSWD"

    fi

    ##

    # Excel Files

    if [ $name = "$1" ]; then name="basename $1 .xls"; doc="MSXL"

    fi

    if [ $name = "$1" ]; then name="basename $1 .XLS"; doc="MSXL"

    fi

    ##

    # Pictures

    if [ $name = "$1" ]; then name="basename $1 .jpg"; doc="Foto"

    typ="Foto"; fi

    if [ $name = "$1" ]; then name="basename $1 .JPG"; doc="Foto"

    typ="Foto"; fi

    ##

    # Convert to Docs Go stream Format

    ##

    if [ $name != "$1" ]; then

    then

    par c -a "stream" $name.pdb $name $doc $typ $1

    pilot-xfer -i $name.pdb

    elelse

    echo "$0: error: $1 is not a Word or Excel file"

    fi

    ```


    The script uses the par tool (http://www.dwj.org/product/par/), which is easily
    installed and used to convert files to the appropriate streamed data. This simple
    conversion will allow Microsoft Word, Excel, and Photos to be synchronized to
    the Palm device''s main memory using the pilot-xfer command which requires the
    palm to be connected and ready for a hysinc in order to be used. pilot-xfer is
    not a delayed write to the palm but immediate. As of Documents To Go v7.0 PowerPoint
    documents can be edited in their native format on the Palm. This will require
    that the script be amended with the following lines to be placed above the Pictures
    comment to handle the new format.


    ```

    if [ $name = "$1" ]; then name="basename $1 .ppt"; doc="MSPT"

    if [ $name = "$1" ]; then name="basename $1 .PPT"; doc="MSPT"

    ```'
