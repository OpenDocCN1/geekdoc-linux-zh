    Now you have a mail client that can be used to access Exchange, including calendar
    and other features of the standard Exchange client. However, it still has its
    limitations. You will not be able to access group mailboxes, and if these are
    needed, you may have to pursue this with other tools.


    In the beginning, we mentioned a second special case, that is, using CrossOver
    Office to run Microsoft Outlook emulated by Wine. In your way, you can have full
    access via a standard Outlook client. It should be noted that many plug-ins for
    Outlook will not work, nor will the esoteric features, since the underlying layer
    does not yet have the capability to handle them. However, group and normal mailbox
    do work as well as the standard Outlook views.


    # 3.9 Printing (Network or Attached)


    Printing to a generic network printer requires knowing two things for Linux. First,
    you need to know the IP address of the device, and second, you need to know the
    type of device to use. For a generic attached printer, only the device type is
    required; then it is just a case of setting up the printer and picking the proper
    printing options. As everything in Linux, there is more than one way to do this,
    but the easiest by far is to use one of the GUI tools to set up your printer.
    However, which tool to use depends on the printer subsystem to be used. Most Linux
    systems use today the CUPS printer subsystem, rather than the older Berkeley subsystem.
    Use of the configuration tools is covered in depth outside this book.


    ```

    RHEL3: redhat-config-printer

    Mrake: drakconf

    SuSE: yast2

    Fedora/RHEL4: system-config-printer

    ```


    # 3.9.1 Printing to a Windows printer server


    Printing to a Windows printer server is quite simple to do and can be performed
    using either the Berkeley or CUPS printer subsystem. The major caveat for accessing
    a Windows printer server is authentication. If the server requires authentication,
    as is the case for most printers, you will need to either hardcode a password
    into the Linux configuration for the printer or'
