    # 3.3.3 CrossOver Office


    CrossOver Office will run Microsoft PowerPoint within the Linux environment using
    the Wine emulator, plug-ins may not work within this emulation environment, nor
    will most of the esoteric features of PowerPoint.


    Our test included linked video, images, and links, which all displayed as expected.'
