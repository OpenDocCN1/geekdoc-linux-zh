    hardware before purchasing.


    Those people familiar with NetMeeting will find using GnomeMeeting just as comfortable.
    GnomeMeeting also has support for Voice over IP via MicroTelco Internet Telephone
    services (http://www.microtelco.com).


    GnomeMeeting is installed as part of most modern versions of Linux and will look
    like Figure 6.4.


