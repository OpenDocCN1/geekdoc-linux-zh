  md: 'As you can see, Plugger can display many multimedia formats and is the glue
    between multimedia content and the multimedia players. To verify that the plug-in
    is working correctly, visit the http://fredrik.hubbe.net/plug/test.html Web site
    and run through some of the test files. If some of the tests do not appear or
    play, then you will need to configure the necessary tools to make them play. Refer
    to Table 4.2 for information about which tools play back file format.


    Plugger does odd when it is in use; this is NOT a bug in the program, but by the
    nature of the way Plugger uses Xfree86 within the Mozilla browser. The content
    may flag as a bigger window momentarily, before it appears within the browser.
    Do not be alarmed; this is by design. Last, if a Plugger program requires some
    set of setup to use it, it is best to run that program outside of Mozilla before
    using it. A case in point is OpenOffice Writer (owriter), since there are several
    windows used for configuration and registration. If you are unsure or concerned
    that the Plugger program is taking too long to load, first try the program outside
    Plugger.


    Plugger has many capabilities, and we will look at these under their specific
    sections. Plugger does not produce output on its own, but uses thirdparty programs
    to produce that output. You must load some key programs onto your system to get
    the most out of your Plugger installation multimedia. The most important is player,
    discussed previously, while others are discussed in section 4.1.11.


    # 4.1.8 How Do I Listen to MP3?


    Non-Web content can be listened to using many different MP3 players. There are
    many players, but the most common are:


    +   - KsCD (KDE)

    - mplayer

    - XMMS

    - mpg321

    - mpg123

    - AlsaPlayer


    When MP3s are encountered on the Web, the Plugger plug-in will first try to play
    them via mpg123 then proceed to mpg321, mplayer, xmms,'
