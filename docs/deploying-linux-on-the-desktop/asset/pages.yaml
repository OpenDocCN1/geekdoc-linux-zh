    # 10.4 How Does One Take Computer-Based CCNA Training?


    Cisco Certified Network Associate (CCNA) Training is provided by many methods
    including, computer based methods (CBT). Of the computer based methods we have
    reviewed, there are three tools for use with Linux. While none of them has Linux
    alternatives, some of them are available via Wine, and others only via tools such
    as VMware.


    All CBT methods work in VMware, while some work under Wine.


    # 10.4.1 CCNA Complete V1.0


    While CCNA Complete does not run on Linux, it will run under CodeWeavers Wine.
    In order to get this to happen you must first copy the file C:\Windows\WINHLP32.EXE
    from a Windows 98 or Windows 2000 (Windows XP may also work; however, I have not
    tried this) machine to <location of your Wine Bottle>/Windows directory and ensure
    the permissions are set to everyone, as follows:


    ```

    cp WINHLP32.EXE -~/cxoffice/dotwine/fake_windows/Windows

    chmod 755 -./cxoffice/dotwine/fake_windows/Windows/

    WINHLP32.EXE

    ```


    As long as there is a winhl32.exe executable in the proper location, everything
    will work as you would expect. The Wine install tools, and you can then select
    from the Red Fedora Menu for the CCNA Complete Course Navigator (Figure 10.4).


    When running the program, the Begin Reading button will launch the winhlp32.exe
    application with its reading material (Figure 10.5).'
