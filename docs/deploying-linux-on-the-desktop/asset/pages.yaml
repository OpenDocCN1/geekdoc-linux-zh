  md: '# How Do I Sync my iPAQ with Linux?


    ![](img/a063699af5597deead6a12a449cc2aa3_151_0.png)


    The iPAQ device can also be used with Linux but the integration with tools like
    Evolution is not as complete as it requires revisions of software that is not
    currently in the mainstream of use. While the sync-multisync-plugin will integrate
    the sync package into the desktop and Evolution, the installation instructions
    are very sparse and the procedures did not provide a successful sync. The manual
    use of sync does however provide a means to sync an iPAQ on Linux. This section
    was not written by the Author, but Pat Lampert, a colleague who owns an iPAQ.


    If you wish to use a Windows device such as an iPAQ Pocket PC with Linux you will
    need to install SynCe. SynCe is a set of open source tools available from SourceForge.net
    at the following web site:


    ```

    <http://synce.sourceforge.net/synce/index.php>

    ```


    As of the writing of this book the most current version of Synce is 9.0-1. An
    rpm for this software along with optional rpms can be downloaded from the site.
    The basic steps for using Synce are as follows:'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# 8.7 How Do I Sync iPAQ with Linux?


    +   1. Install SynCE on your Linux machine

    2. Configure SynCE

    3. Establish a connection (aka synch) with your Windows CE device

    4. Use the tools provided to copy files to and from the device, and perform other
    operations.

    5. Disconnect your WinCE device.


    Of course steps 1 and 2 are one-time events.

    Tests were performed using a Compaq 3700 series iPAQ Pocket PC. As you will find
    on the Synce web site there are special steps you may need to take depending on
    the device you are using. In my case it was quite straightforward.


    # 8.7.1 Installation of Synce


    You will see from the web site that Synce has other kits available for synchronizing
    your address book and other options. For this I am keeping it, and just downloading
    the software needed to establish a sync. The software needed for a simple connection
    with your Windows CE device consists of a single rpm package: synce-0.9.0-1.i386.rpm.

    Install synce-0.9.0-1.i386.rpm using the rpm command:


    ```

    # rpm -Uvh synce-0.9.0-1.i386.rpm

    Preparing...

    ###################################################### [100%]

    ```


    # 8.7.2 Synce Configuration


    Once Synce is installed then you need to configure Synce. The installation instructions
    vary depending on the type of Windows CE device you are using, the version of
    Linux, and what type of port you are using. More details on available on the Source
    Forge web site.


    In my case, as I mentioned earlier, I had an iPAQ with a USB connector. Because
    I was using a usb connector I had to follow some special instructions and use
    modprobe to enable the iPAQ usb serial module.


    The following three commands must be performed by the root user.


    ```

    $ /sbin/modprobe ipaq

    ```'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'The next step is to configure Synce to use the proper port for connection.
    This is done with the synce-serial-config command. In my case I was connecting
    to USB port 0 so the command needed was:


    # # synce-serial-config ttyUSB0


    After the port is identified then the command to start up the daemon that detects
    connections is:


    # # synce-serial-start

    synce-serial-start is now waiting for your device to connect


    This can be added to your system startup if needed.


    Next you need to set up any user that will be syncing with your device to run
    dcc. This command must be run from the user account. The command can be added
    to the user''s .login file if wanted.


    ```

    $ dccm

    ```


    Once the above steps have been performed you should be able to start a manual
    sync using the Windows CE Active Synch icon on your PC.


    If you have difficulties, especially with a USB connection. The following Source
    Forge Sync web page is very helpful.


    ```

    http://synce.sourceforge.net/synce/usb_linux.php

    ```


    Also examine or tail the file /var/log/messages for errors from the synce-serial-start
    and dccm commands.


    # 8.7.3 Synce Tools


    After you have successfully established a syn connection between your Windows
    CE device and your Linux desktop there are a variety of command line tools available
    to perform various operations with your device.


    # pstatus


    Allows to obtain status on your connection and information about the device you
    have connected.


    Example:'
