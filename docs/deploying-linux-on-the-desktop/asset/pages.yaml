  md: 'who use Linux on the desktop can generally fix their own problems within the
    confines of IT guidelines.


    To conclude this book is difficult, as it grows daily; however, there are a few
    conclusions we can draw. First, using Linux on the desktop is no more complex
    in many ways than using Windows on the desktop. Similar tools are available for
    each system, although there is a learning curve for support personnel who do not
    currently support Linux. While this book shows ways to implement, work with, and
    interoperate with other systems, you will want to standardize your tools, and
    you should plan in advance which tools will be part of your Linux desktop.


    Step back to Chapter 1 for a moment, where we asked the questions:


    +   1. Is Linux ready for real use as a desktop?

    2. Is Linux ready to be used as a corporate desktop?


    The easy answer to both is, Linux is ready; but, as demonstrated in this book,
    the practical implementation is much more complex and must be based on your specific
    desktop requirements. Looking at our example:


    Your corporate environment uses Microsoft Office, yet you do not need Access,
    Visio, or FrontPage. However, using e-mail, Word, and Excel is paramount. In addition,
    you have network printers well as Windows-based file servers. Everyone in the
    office has a PalmOS device of some type. Web content is generally simple, with
    shared Word or Excel documents available. Last, IRC is the interoffice communication
    of choice.


    We end up with the table of requirements shown in Table 10.1.


    As discussed, there are many tools to accomplish the tasks required, and knowing
    which tools are available and any limitations or advantages is a boon to those
    designing a desktop and identifying all the costs involved. When using Linux as
    your desktop, you can make many choices. You will want to choose a distribution
    of Linux that offers the best level of support for your needs. Some preconfigured
    for the best Linux-based integration (as is the case with the Xros distribution
    of Linux).'
