  md: '# 3.9.2 Printing to an AppleTalk or Macintosh printer


    Modern Macintosh computers are very easy to configure to use any printer, since
    they use many of the same tools available to Linux. You can set up your Mac to
    act as a CIFS server and use Windows-style authentication, as described previously.
    Or you can use a UNIX-like printer daemon running on the Mac, which will manage
    the entire Mac, as well as attached or AppleTalk printers.


    Note: Access to older Macs require the netatalk package as does access to any
    Macintosh Ethertalk network attached printer. Netatalk setup is beyond the scope
    of this book.


    # 3.10 Other Considerations


    There are also other issues to consider when using Linux-based tools to replace
    Office products. As we stated previously, several formatting issues arise when
    using the OpenOffice and StarOffice word processing programs. One way to alleviate
    these issues is to use different fonts, many of the fonts available on Microsoft
    (e.g., Arial) are not available on Linux. An open-source project exists (http://fonts.sourceforge.org/)
    to solve this problem. Another solution is to use an existing set of fonts available
    from the C:\Windows\Fonts directory on a Windows box. You may use either of these
    solutions to help with formatting issues, using the following recipe for each
    of the contents mentioned.


    ```

    # rpmbuild --rebuild cabextract-0.6-1.src.rpm

