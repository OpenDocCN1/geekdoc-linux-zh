  md: '# Extracting Files...


    Please Wait ../install.wp: line 103: [: EL: integer expression expected

    ...

    cat: .wptemp: No such file or directory

    cat: .wplist: No such file or directory

    cat: shared/license.: No such file or directory

    ...


    +   4. Continue on even with the above error, since it is safe to ignore. For
    other versions of Linux the error could be different, since it is trying to determine
    your version of Linux.


    +   5. Next, we need to accept the license and then enter the installation directory.
    Something similar to /usr/local/wp8 is suggested.


    +   6. After the installation directory is selected, choose the type of installation:
    it is recommended that Full Installation be chosen.


    +   7. Before the installation starts, the installer will ask if you wish to pattern
    the install after another installation of WP8. Since this is the first time, it
    is suggested you select to continue without entering anything.


    +   8. Now comes the time to tell the installer if you desire to edit your /etc/magic
    file so that tools will automatically recognize WordPress 8 files and launch the
    appropriate tool to edit them. It is recommended that you update the magic file.
    However, it is first to make a copy, just in case.


    +   9. Before you complete the installation setup, select the language you will
    be. Using this demonstration English-US was chosen.


    +   10. An interesting aspect of the installation is the selection of a printer.
    Since I do not have any of the listed printers and there is no generic PostScript
    printer, I selected ASCII Text Printer. This will limit my printing to just text
    printing, unfortunately. However, other tools can read and print WordPerfect files
    including word which will run via CrossOver office.


    +   11. We are now close to the install setup completion, with the selection of
    the Optional Features. It is recommended that the default be selected and continue.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '+   12. Review the installation options and continue to start the installation.


    +   13. The Installation progress bar will track your installation when at 100
    percent your WP8 install is completed . . . Or is it?


    WP8 used to install just fine; I have used it with just about any version of Red
    Hat starting with Red Hat 5 when it was released. However, with modern versions
    of Linux, there are now more steps required in order to complete your installation
    of WP8.


    +   1. Run the command ldconfig as root, to ensure the libraries for WP8 are found.


    +   2. Change the permissions on /usr/i486-linux-libc5/lib directory to allow
    users access to the necessary libraries. For systems that are locked down this
    will be required but should be checked nonetheless.


    ```

    chmod 755 /usr/i486-linux-libc5/lib

    ```


    The installation of WP8 is now completed, and you can safely run the /usr/local/wp8/wpbin/xwp
    program to demonstrate this. The screen shown in Figure C.1 will appear when the
    installation is successful. While this version of WordPerfect will work on Linux,
    it is old and outdated. The most recent version of WordPerfect is version 12 and
    this will only run within a VMware session. While WordPerfect may run within Wine,
    that is relatively untested.'
