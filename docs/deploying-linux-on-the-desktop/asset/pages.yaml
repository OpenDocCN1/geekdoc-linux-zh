    # 3.3 PowerPoint


    PowerPoint files, as with Word and Excel files, can be edited using similar tools.


    # 3.3.1 OpenOffice


    OpenOffice''s voimpress tool is used to edit and view PowerPoint files. Complex
    and simple files can be edited and viewed with ease. There are issues with display
    times sometimes the Linux fonts exceed the page frame, although they would not
    exceed it on a Windows machine. However, linked video is not a part of OpenOffice.


    # 3.3.2 StarOffice


