  md: '# Virtual Private Network (VPN) Connectivity


    A growing number of road warriors need to connect into the corporate environment
    using a Virtual Private Network (VPN). This chapter will address three of the
    possible methods for connecting to the corporate LAN using Linux. It will not
    cover setting up modems, but will cover setting up the necessary software to implement
    VPN. The goal is not to provide a detailed guide on which to choose, but instead
    to provide the practical knowledge of how to implement the necessary components
    and their associated costs.


    # 2.1 How Do I Connect Using PPTP?


    PPTP (Point to Point Tunneling Protocol) requires adding modules to your kernel,
    as well as a specialized setup using pptpconfig and other necessary system modifications
    to implement the PPTP protocol. http://ppptclient.sourceforge.net is an extremely
    good Web site that provides an excellent reference for PPTP on Linux. While we
    will not discuss every distribution, the steps are generally the same for all.
    Since using PPTP requires root access, it is not a bad idea to use a program such
    as sudo or similar tool to control access to this critical component or to use
    the PPTP service setup with pptp-command.


    # 2.1.1 RHEL3


    When installing PPTP into RHEL3, you will need to add modules to the kernel to
    add the required encryption. Once these modules are added, it is just a case of
    defining everything properly in the configuration files and then launching the
    PPTP configuration with the launch tools. As an added bonus the current PPTP modules
    have been compiled to use Dynamic Kernel Module Support (DKMS). DKMS aids you
    when the kernel is'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'upgraded, as you do not need to remember to recompile your kernel modules by
    hand support issues. The recompilation will happen automatically, which will decrease
    support issues when kernels are upgraded for security or bugfix reasons. DKMS
    will also provide a simpler way to distribute third party modules to each host.
    Below are the steps necessary to install PPTP using the DKMS form of the modules.
    Also note that this install DKMS is in RPM format. There are other formats for
    other versions of Linux available.


    ```

    # rpm -ivh pptp-2.4.3-0.cvs.20040527.1.1386.rpm pptp-linux--1.4.23-1.rpm tkf-pptp|tk-mpe-0.0.3-1dkms.noarch.rpm
    kernel_pptp_pppe-0.0.3-1dkms.noarch.rpm

    ```


    DKMS: Add Completed.


    Preparing kernel 2.4.21-15.0.4.EL for module build:

    (This is not compiling a kernel, only preparing kernel symbols)

    Storing current .config to be restored when complete

    Running Red Hat preparation routine


    Building module:


    DKMS: Build Completed.


    DKMS: Install Completed.


    ```

    # service dkms_autoinstaller start

    # chkconfig dkms_autoinstaller on

    # modprobe -v ppp_pppe

    # lsmod | grep ppp

    ```


    | ppp_pppe 13816 0 (unused) |

    | ppp_generic 24436 0 [ppp_pppe] |

    | sihc 6672 0 [ppp_generic] |


    ```

    # pptpconfig

    -Or-

    # pptp-command

    ```


    There are two ways to configure PPTP, and pptpconfig, and pptp-command is a character
    graphical tool, cell mechanism. pptp-command also has a service that can start
    at time after your network comes up (pptpconfig does not have this ability). Both
    must be run as root . pptpconfig on RHEL3 will automatically ask for the root
    password when launched, while pptp-command requires the user to be logged in as
    root to launch. Before using pptp-command or even pptpconfig it is best to check
    with the corporate security policies'
  merge: -1
  pgno: 25
- img_proc: true
