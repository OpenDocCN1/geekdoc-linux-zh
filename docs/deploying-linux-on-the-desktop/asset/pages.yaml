  md: '# How Can You Stop Spam and E-mail Viruses?


    # 9.2 How Can You Stop Spam and E-mail Viruses?


    The MailScanner (http://www.sgc.ecs.soton.ac.uk/mailscanner/) tool can stop spam
    and e-mail viruses. MailScanner is a series of scripts and tools that will integrate
    with your existing Mail Transport Agent. This system-wide tool will process each
    e-mail through SpamAssassin as well as through its own spam and virus antivirus
    tools for Linux. MailScanner also integrates with many different antivirus tools.
    While its install is not trivial, the install script will handle everything for
    you.


    ```

    # - xxzf MailScanner-4.36.4-1.rpm.gz

    # cd MailScanner-4.36.4-1

    # install.sh

    ```


    Once the software is installed, we need to configure the software to use SpamAssassin
    as well as your virus scanner. While MailScanner contains a very basic scanner,
    it does not contain something by default catch all known viruses; to accomplish
    this, you will need a better virus scanner.


    # 9.2.1 Enabling SpamAssassin Support in MailScanner


    Edit /etc/MailScanner/MailScanner.conf and verify that the line Spam Checks =
    yes is set. If instead, it reads Spam Checks = no, enable this feature. Next,
    change the line Use SpamAssassin = no to Use SpamAssassin = yes. This will enable
    the use of SpamAssassin via the SpamAssassin Perl interface.


    There is also a /etc/MailScanner/spam.assin.conf file you can edit to set your
    SpamAssassin configuration. Three spam detection and filtering networks can be
    added to SpamAssassin to block even more spam. They are Vipul''s Razor, Pyzor,
    and DCC.


    +   - Vipul''s Razor (http://razor.sourceforge.net/)

    - Pyzor (http://pyzor.sourceforge.net)

    - DCC (http://www.rhyolite.com)


    Installation of Pyzor, Razor, and DCC will greatly increase the effectiveness
    of network-wide servers to determine and grade e-mail footprints based on RBL,
    black-hole lists, and voting systems. A detailed discussion of the installation
    and con-'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'figuration of these tools is outside the scope of this book. If Razor and Pyzor
    are installed then their perl or python interfaces will be used by the SpamAssassin
    rules, however DCC will require the path to be entered into /etc/MailScanner/spam.amassassin.prefs.conf
    as a line reading


    ```

    dcc_path=/usr/local/bin/dcc

    ```


    Which will allow SpamAssassin to find the third tool to block spam.

    Last, you can create central spam and nospam mailboxes that will update the Bayesian
    database with new spam or ham entries when a user wants that to happen. You can
    use the following shell script every hour or so:


    ```

    #!/bin/sh

    /usr/bin/sa-learn -spam -mbox -no-rebuild /var/spool/mail/spam

    /usr/bin/sa-learn -ham -mbox -no-rebuild /var/spool/mail/nospam

    /usr/bin/sa-learn -rebuild

    ```


    Rebuilding the Bayesian database after all the spam and ham are found will speed
    up the processing of each mailbox. Granted, you can add appropriate aliases to
    your mail subsystem as well; however, if you have a lot of e-mail being reported
    as spam, you may only want to process it so instead of immediately.


    # 9.2.2 Enabling Antivirus Support


    MailScanner supports many different virus scanners; one is free, but the other
    products must be purchased before you can use any of the virus definitions. These
    definitions will include all known definitions for windows and Linux. Currently,
    the list includes the following (Cost column includes both mail-filtering and
    file system-scanning versions of the software).


    | Product | Web Site | Cost |

    | --- | --- | --- |

    | Sophos | http://www.sophos.com | $$$$ |

    | McAfee | http://www.mcafee.com | $ |

    | Command | http://www.command.co.uk | $$ |

    | Kaspersky | http://www.kaspersky.com | $$$ |'
  merge: -1
  pgno: 163
- img_proc: true
