    # 2.5 The Cost


    Are there any hidden costs to using Linux as a VPN platform? There are dollar
    costs as well as support costs associated with using these tools. The dollar costs
    are related to the purchase of hardware and the necessary software to implement
    VPN. Since modern VPN clients may also require biometric dongles or cards, their
    costs are no different than any other system. The software costs be very different
    between systems however. If you are using generic tools then there are minimal
    costs unless VMware is to be used.


    Table 2.1 shows the costs involved.


    | Software | Support Level | Fee | Support Fee |

    |---|---|---|--|

    | PPTP | OpenSource | NA | NA |

    | OpenSWAN/IPsec | OpenSource | NA | NA |

    | VMware | Web-based/Phone | $199 | Free for 90 days |

    | NdisWrapper | OpenSource | NA | NA |

    | DriverLoader | E-mail/Phone | $19.95 | NA |

    | DKMS | OpenSource | NA | NA |

    | SSH Tunneling | OpenSource | NA | NA |'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# 2.6 Support Issues


    There are however pretty major support issues when using VPN tools on Linux, not
    the least of them is the recompilation of your kernel for NAT-T support, which
    will void your warranty on your system. Actually, any recompilation or modification
    of your kernel will void such a warranty. The addition of modules will not void
    your warranty, but you may need to disable their use to fully debug a system,
    as the specific modules will not be supportable.


    After such a strong statement why would anyone use these tools? Because the opensource
    communities are very active, capable, and provide excellent support for their
    modules. In addition, DKMS implementations will decrease the number of support
    calls and allow Corporate IT departments more control over what tools are currently
    in use.'
  merge: -1
