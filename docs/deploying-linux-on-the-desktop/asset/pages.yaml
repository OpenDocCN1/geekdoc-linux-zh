    Chapter 4. In addition, make an RPM using the CheckInstall (http://asic-linux.com.mx/-izto/checkinstall/)
    tool. CheckInstall, while not mentioned in this book, is a new tool that replaces
    “make install” and will build installable packages for Debian-, Slack-, and RPM-based
