    # Installation of CrossOver Office


    CrossOver Office is easy to install, and there are two methods by which it can
    be installed: system-wide and user mode. System-wide is useful if everyone who
    logs into the system will use the same programs.


    CrossOver Office is installed via RPM on most systems.


    ```

    crossover-pro-4.0.i386.rpm

    ```


    CrossOver Office provides its own graphical interface for installing Windows.
    For example, here is a simple installation of mIRC.


    Launch the tool by selecting Fedora->CrossOver Tools->Office Setup to bring up
    the installation tool (Figure A1).


    ![a063699af5597deead6a12a44cc23_208_0]


    Clicking the Install... button will bring the installation screen up (Figure A2).


    ![a063699af5597deead6a12a44cc23_209_0]


    Check the Install unsupported software box and click Next >> (Figure A3).


    ![a063699af5597deead6a12a44cc23_209_1]


    Now, specify the full path to the installation executable for the mIRC program
    (Figure A4).


    ![a063699af5597deead6a12a44cc23_210_0]


    The standard mIRC settings will appear while the CrossOver Office Setup dialog
    waits for a clean installation of the program (Figure A5).


    ![a063699af5597deead6a12a44cc23_210_1]


    Once the installation is complete, CrossOver Office will bring the Setup dialog
    back to the first screen, showing the newly installed program.

    '
