    for these viewers, by using tools such as CrossOver Office, VMware, and so forth.
    We describe these tools in detail in Chapter 5. If you are using Java-based Web
    tools, you are further limited to just Mozilla or VMware, since Java content will
    not display via Wine.


    If, however, you wish to watch streaming movies, then the Plugger plugin loads
    up mplayer to handle the content, or you can get the mplayer plugin. For simplicity''s
    sake, Plugger is the way to; let it bring up the proper tool.


    # 4.1.10 How Do I View or Listen to Microsoft Player Content?


    To listen to Microsoft Media Player content you can use the Microsoft Media Player,
    which is only available via CrossOver Office and VMware. However, in many cases,
    mplayer will work just fine; you can even use the WMA plug-in for xxms.


    CrossOver Office and VMware offer many features that can be used to display Microsoft
    proprietary application content and will be discussed in section 4.1.12.


    # 4.1.11 How Do I View or Listen to Content of Various Types?


    In nearly every case of viewing or listening to multimedia content, the Plugger
    plug-in will bridge the gap. Table 4.2 gives you the content type and which player
    will be used to view or listen to the specified MIME-type'
  - '[PAGE 77]


    content. In some cases, more than one program can be used; the list is displayed
