    ## 7.3 How Do I Access Citrix Metaframe Server?


    Figure 7.5

    New rdesktop login screen.


    ![](img/a063699af5597deead6a12a449cc2aa3_132_0.png)


    Citrix Metaframe servers are very easy to access using the free Metaframe client
    from Citrix. This client can be found at http://www.citrix.com and behaves in
    the same way as it does on Windows. If the client is integrated into an existing
    distribution (as it is with RHEL3), it can be accessed from the system menus.


