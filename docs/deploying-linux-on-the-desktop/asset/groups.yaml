    # 4.1.5 How Do I View Multimedia Web Content?


    Multimedia Web content is difficult to display as Web content, since it has many
    different formats. We therefore need to split this up by what are the most important
    items to view, since most of the tools listed here serve double duty as invoked
    programs that can be used to view or listen to stored multimedia-presentations.
    While we cover the most popular options, we will also provide a matrix for many
    of the other esoteric types of audio or video content. All of these viewers and
    players require the Mozilla Plugger plug-in to be installed, and in some cases,
    specialized software.


    # 4.1.6 How Do I View DVD/Video CD Content?


    DVD is not traditionally Multimedia Web content, but it is still multimedia content
    and is therefore a necessary topic to cover before we continue. To play a DVD,
    you must install a program that is the basis for viewing and playing most of the
    other multimedia formats. DVDs can be played using the mplayer program, downloaded
    from the www.mplayerhq.hu/homepage/ Web site and installed by using many RPM packages.
    Download all the packages into a newly created directory so that you can install
    them with a simple RPM command. There are a number of items you should download
    in several categories. You absolutely need the following-RPMs:


    +   - mplayer-common

    - mplayer

    - mplayer-gui

    - Default skin package


    Mplayer depends on the following minimal version packages, which are available
    as a part of your Operating System Media:'
- md: '

    SDL-1.2.3-7


    Xfree86-libs-4.2.0-0

    audiofile-0.2.3-1

    freetype-2.0.9-2

    libjpeg-6b-19

    libogg-1.0rc3-1

    libpng-1.0.14-0.7x.3

    libtermcap-2.0.8-28

    libvorbis-1.0rc3-1

    zlib-1.1.3-25.7

    libgcc-3.2.2-5 (required for VIDIX support)

    glib2-1.2.10-5 (required for GUI support)

    gtk+-1.2.10-15 (required for GUI support)


    Also, you will need the following minimal version files from http://ftp.icm.edu.pl/pub/linux/mplayer-rpms/apt/7.3/RPMS.testing/:


    lame-3.95.1-1

    lame-libs-3.95.1-1

    lame-mp3x-3.95.1-1


    Optionally, there are fonts and codecs that you can install as well. Codecs are
    bits of code that will interpret the multimedia content for you. The VIDIX codecs
    will only work on specific hardware; if that hardware does not exist, VIDIX multimedia
    will NOT display.


