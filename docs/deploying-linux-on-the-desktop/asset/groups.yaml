    | VMware | Web-based/Phone | $199 | Free for 90 days |

    | NdisWrapper | OpenSource | NA | NA |

    | DriverLoader | E-mail/Phone | $19.95 | NA |

    | DKMS | OpenSource | NA | NA |

    | SSH Tunneling | OpenSource | NA | NA |


    ## 2.6 Support Issues


    There are however pretty major support issues when using VPN on Linux, not the
    least of them is the recompilation of your kernel for NAT-T, which will void your
    warranty. Actually, any recompilation or modification of your kernel will void
    your warranty. The addition of modules will not void your warranty, but you may
    need to disable their use to fully debug a system, as the specific modules will
    not beable.


