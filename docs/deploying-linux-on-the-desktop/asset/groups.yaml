    Linux 发行版发布新版本，建议对每个应用程序进行升级、新功能甚至更新更新软件包的审查。


    ## 11.6 流程实现


    现在让我们采用示例应用程序，看看它是如何融入概述的流程的。


    ### 11.6.1 如何在 Linux 上创建架构视图？


    最著名的架构绘图程序可能不支持 Linux（例如 AutoCAD），但还有许多其他程序。当我们遵循流程时，我们首先查看需求，然后转向解决方案。


    #### 需求


    -   - 与 AutoCAD 集成—即读取和导出 DXF 文件

    -   易于使用

    -   优先考虑开源

    -   提供良好的标准形状和构型库

    -   需要平面视图（如查看蓝图的 2D 平面视图）

    -   如果有 3D 视图就更好了


    #### 开始搜索


    RHEL4 提供了以下图形程序：


    -   - Gimp（更像是 Photoshop 的替代品）

    -   在发行版上运行以下命令：


    -   * apropos draw

    -   apropos graphics

    -   apropos drafting

    -   apropos architect

    -   apropos figures

    -   apropos cad


    -   * Xfig 是一个简单的图形绘图程序


    ### 11.6.2 扩展搜索


    由于 RHEL4 的发行版没有给我们留下太多信息，我们需要向外扩展。我们应该检查 Fedora Core 3 网站以寻找可能的匹配项，因为它是与 RHEL4
    最的。然而，这不会引导我们我们已经发现的许多可能性。是时候访问网站了。首先，我们尝试存储库：


    -   * ATrpms 仓库包含 Skencil，它类似于 xfig。仍然不是很有用，因此我们可以进一步扩展并在 http://www.google.com
    上搜索“CAD Programs”，并立即获得 Linux Gazette (http://www.linuxgazette.com/issue54/frost.html)
    的结果，这是一个口碑良好的 Linux 信息站点。由于它是 2000 年的，有点旧了。但是，提到的软件包令人感兴趣—


    -   * Qcad

    -   CAM Expert

    -   SISCAD-P

    -   ME10

    -   CADDA

    -   Varicad

    -   Microstation

    -   Varimetrix


    -   * 一个更好的链接可能是 http://www.linuxlinks.com/Software/Graphics/CAD/index.html，它列出了更多解决问题的可能方案，包括
    Pro/Engineer 等许多商业程序。


    -   现在我们有了一个关于该问题的良好解决方案列表，我们需要审查每一个项以符合需求；由于我们渴望开源解决方案，这消除了列表中的任何商业产品。然后我们需要检查剩余的内容，并找到一个最近更新且具有活跃社区的程序。其中之一是
    Qcad。虽然


    freeCAD 看起来很有前景，但在简要文档中没有提到 DXF 导入/导出


    ### 11.6.3 实现你的解决方案


    Qcad (http://www.ribbonsoft.com/qcad.html) 提供两种版本。一个是免费的社区支持源码，另一个是小付费支持的软件。检查操作系统的限制显示，它可能无法在
    RHEL4 上运行。


    使用以下命令验证系统是否安装了 QT：


    ```

    rpm -q qt-devel

    ```


    然后验证 qmake 是否可用：


    ```

    qmake -v

    ```


    然后解压源码并构建：


    ```

    tar -xzf qcad-2.0.4.0-1.src.tar.gz

    cd qcad-2.0.4.0-1.src

    cd scripts

    ./build_qcad.sh

    ```


    现在执行：


    ```

    cd ../qcad

    ./qcad

    ```


    安装到 /opt/qcad 或 /usr/local 是通过指向 qcad 目录实现的。一旦我们运行了程序，对话框显示它将读取和写入各种 DXF 文件，这满足了我们的需求。Qcad
    主要处理形状，它是相对易于使用的。


    支持性是下一个问题。由于是开源，你可以支付大约 28 美元获得一年的支持。


    ### 11.6.4 健全检查


    作为健全性检查，我们应该审查是否还有其他选项。有很多可用选项，但都不像 Qcad 那样强大。此外，虽然你可以在 Wine 下尝试运行 AutoCAD，但那也不是绘图工具，且无法返回或写入
    DXF 文件。


    ### 11.6.5 与开源社区合作


    由于 Qcad 是一个持续的开源项目，你可以向邮件列表发送电子邮件并监控它们对各种漏洞的修复。虽然 qcad 不是一个非常活跃的列表，但它有一些非常好的信息。邮件列表的位置在
    Qcad 的主页上说明（正如许多项目一样）。


    ### 11.6.6 保持同步


    书签 Qcad 网站并检查更新。由于它不是项目存储库的一部分，你需要手动这样做，并定期检查——也许只在为你的 Linux 发行版发布新补丁时。我已经使用了
    Qcad 几个版本了，所以一直在监控更新。


    我们现在成功解决了问题。解决方案是使用 Qcad，而问题是：如何在 Linux 上创建架构视图？必须满足的需求已满足，而良好的需求没有满足。Qcad 不是
    3D 建模引擎，那将是不同的搜索标准。虽然如果有 AutoCAD Architectural 来获得完整的 3D 视图会非常棒，但简单的平面视图就能为建筑师或承包商提供所需的信息。


    ## 11.7 结论


    虽然遵循这个流程可以找到你问题的答案，但这绝不是你可以使用的唯一方法；然而，它是我们遵循的


