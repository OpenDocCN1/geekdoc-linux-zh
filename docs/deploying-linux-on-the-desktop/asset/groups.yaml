    # Virus and Spam Protection


    The two worst enemies of the desktop are spam and viruses. These two villains
    cause all administrators major frustration. The good thing about using a Linux
    desktop is that there are very few Linux viruses; however, spam is still a villain!
    A number of tools can combat these two ruffians for Linux; there are key configurations
    that will help to secure your system from viruses. The most common method of virus
    infiltration is via e-mail, so this chapter will concentrate on making e-mail
    safe for Linux machines.


    ## 9.1 How Do You Stop Spam?


    Spam, we can all admit, is a major pain. To combat spam, there are several tools
    available for a Linux box; these tools can be implemented at the user level or
    system-wide. Some tools will learn from messages marked spam, and others require
    manual control. One of the most widely used tools is SpamAssassin. SpamAssassin
    combines all the features and learning control into one highly configurable package.
    The tool will allow you to remote services as well as its own rules for determining
    whether an e-mail is spam, and you can configure it globally as, using the procmail
    subsystem of other mailers. Since sendmail is the most common mailer, we will
    look into its use.


    If an IMAP server running SpamAssassin is in use, otherwise SpamAssassin will
    have no effect on exchange mail via this combination of tools. SpamAssassin is
    designed to work as part of the system mailer via the procmail subsystem, which
    is used for the local delivery of email at a user base, or using other mechanisms
    can be a system level mail filter (milter). If mail is delivered local to the
    server the milter can find Spam before some other transfer mechanism is invoked,
    including POPmail and IMAP. Therefore SpamAssassin can be used for Outlook clients
    that get their email via an IMAP or POPmail server. SpamAssassin has the added
    advantage of being shipped as a part of many versions of Linux. To use SpamAssassin
    for locally delivered e-mail, you can use procmail, as follows:


    Create .forward file:


    ```

    "IFS='' ''& exec /usr/bin/procmail -f - || exit 75 #user"

    ```


    Create .procmail file:


    ```

    :0fw: spamassin.lock

    * <256000

    | spamassin

    ```


    With these instructions entered the local sendmail delivery agent will run spamassin
    or sporc (server-based) program and tag all your e-mail as spam or ham (not spam,
    but good e-mail or ham). Since, in some cases, legitimate e-mail is incorrectly
    marked as spam, it may be better not redirect all spam to mailboxes. You can add
    the following commands to the .procmail file to forward all spam mail to other
    folders you are not bothered with them. However, this behavior is probably best
    left up to your mail client.


    ```

    :0

    * ^X-Spam-Level: \*|\*|\*|\*|\*

    spam-folder

    ```


    ```

    :0

    * ^X-Spam-Status: Yes

    possible-spam-folder

    ```


    These additional .procmail file entries will look at SpamAssassin headers. All
    items with a score of 10 or more will be marked as spam and placed in the spam-folder
    directly or the possible-spam-folder if the mail could be considered spam.


    With procmail in use, you can formulate a recipe to handle just every case of
    spam. SpamBouncer (http://www.spambouncer.org) does just that; however, this tool
    does not contain the powerful Bayesian filter that is a part of SpamAssassin.


    If you are using an e-mail client such as Evolution, or your mail is not delivered
    locally, you may need another method to protect against spam. The following set
    of instructions assumes that your remote mail server does not already have a tool
    to block spam or that you wish to augment this facility.


    ![](img/a063699af5597deead6a12a449cc2aa3_160_0.png)


    Adding SpamAssassin filter to Evolution:

    Navigate to Tools->Filters... (Figure 9.1).


    Click on Add, then change the Rule name to SpamAssassin and in the If clause change
    the condition to Pipe Message to Shell Command. Enter spam-assassin -e >/dev/null
    in the box next to the condition. Select returns greater than the Returns drop-down
    box, and enter 0 as the value to return greater than. (See Figure 9.2).


    Now modify the Then clause of the filter and select click here to select a folder
    and add a new folder or select an existing spam Folder. In this example, we use
    a folder named spam that resides in the Local Folders folder (see Figure 9.3).
    Add a secondary condition to Stop processing; if you do not do this, other filters
    will still run on the spam mail. Be sure this rule is the first rule in your Filter
    list.


    If your mail server already tags spam, instead of a shell command, you can look
    for a specific mail header (perhaps the Subject header as SpamAssassin can change
    the subject to be prefixed with the tag *** capture spam.) and perform a Move
    to Folder actions in addition to installing SpamAssassin, you will want to install
    the tools to talk to outside servers. These outside servers look at Black Lists
    (RBL) as well as member.


    # Figure 9.2

    Adding a SpamAssassin filter to Evolution: adding SpamAssassin.


    ![](img/a063699af5597deead6a12a449cc2aa3_161_0.png)


    # Figure 9.3

    Adding a SpamAssassin filter to Evolution: adding SpamAssassin.


    ![](img/a063699af5597deead6a12a449cc2aa3_160_0.png)


