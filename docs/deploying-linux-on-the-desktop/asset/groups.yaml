    However, if you do not need all the formatting bells and whistles, then CrossOver
    Office may work for you. While it does have its problems with plug-ins, CrossOver
    Office will get the job done. Lastly, if you are concerned about final editing,
    or you are using a homogenous Linux environment, you can use the OpenOffice or
    StarOffice tools.


    One of the most widely used tools on any system is e-mail, and multiple methods
    exist for accessing your e-mail, as discussed previously. The most widely used
    are Evolution with the new free Exchange Connector, OWA via the Web.


    Potential costs for Linux replacements for Office tools are displayed in Table
    3.1.


    # Table 3.1 Cost of Linux Replacements for Office Tools


    | Software | Support Level | Fee | Support Fee |

