    ## 8.2 How I Synchronize Documents to Go on My Palm Device with Linux?


    Documents-To-Go, along with several Linux tools, was used to write this book.
    So synchronizing Documents-To-Go data from the Palm device to the Linux desktop
    was incredibly important to me. Doing this is actually easier now than when I
    first started working on the research for this book. Until Documents-To-Go 6 was
    released, the internal format of a document was proprietary to DataViz. Now, Documents-To-Go
    can read and write raw Word files, which implies that we can just place the .doc
    files on the Palm device and not be concerned about translation. This simplifies
    things significantly; however, it was almost impossible prior to release 6. To
    aid in this, the following script could be:


    ```sh

    #!/bin/sh

    ##

    # Convert Word/Excel file to Documents to Go 6.0 Format

    # And prepare for sync


    ##

    # Word Files

    ```


    ## 8.2 How Do I Synchronize Documents to Go My Palm Device with Linux?


    ```sh

    ##

    doc="MSWD"

    typ="DTGP" .doc

    name="basename $1"

    if [ $name = "$1" ]; then name="basename $1 .DOC"; doc="MSWD"

    fi

    ##

    # Excel Files

    if [ $name = "$1" ]; then name="basename $1 .xls"; doc="MSXL"

    fi

    if [ $name = "$1" ]; then name="basename $1 .XLS"; doc="MSXL"

    fi

    ##

    # Pictures

    if [ $name = "$1" ]; then name="basename $1 .jpg"; doc="Foto"

    typ="Foto"; fi

    if [ $name = "$1" ]; then name="basename $1 .JPG"; doc="Foto"

    typ="Foto"; fi

    ##

    # Convert to Docs Go stream Format

    ##

    if [ $name != "$1" ];

    then

    par -a "stream" $name.pdb $name $doc $typ $1

    pilot-xfer -i $name.pdb

    else

    echo "\$0: error: $1 is not a Word or Excel file"

    fi

    ```


    The script uses the par tool (http://www.dwj.org/product/par/), which is easily
    installed and used to convert files to the appropriate streamed data. This simple
    conversion will allow Microsoft Word, Excel, and Photos to be synchronized to
    the Palm device''s main memory using the pilot-xfer command which requires the
    palm to be connected and ready for a hysinc in order to be used. pilot-xfer is
    not a delayed write to the palm but immediate. As of Documents To Go v7.0 PowerPoint
    documents can be edited in their native format on the Palm. This will require
    that the script be amended with the following lines to be placed above the Pictures
    comment to handle the new format.


    ```sh

    if [ $name = "$1" ]; then name="basename $1 .ppt"; doc="MSPT"

    if [ $name = "$1" ]; then name="basename $1 .PPT"; doc="MSPT"

    ```


    To build par:


    ```sh

    tar -xzf prc

    cd prc

    make

    ```


    ## 8.3 Do I Synchronize Pictures to My Palm with Linux?


    See the previous section.


    ## 8.4 Is There a Microsoft Equivalent?


    There are several Linux-based alternatives to Microsoft Office. For example, OpenOffice.org
    can be used to create and edit documents that are compatible with Microsoft Word,
    Excel, and PowerPoint.


