    # 5.2 How Do I Access CIFS?


    those systems that require domains, users, and passwords. In addition, using something
    like Nautilus, a file system explorer, does not make the share available from
    the command line; however, the reverse is true: anything- available to the command
    line is available to the graphical tools.


    Here are a few things to consider when using Samba to access CIFS shares:


    +   - Unlike share authentication on Microsoft Windows machines, Linux does not
    have a global and automatic way to authenticate against the share.


    +   - The automatic authentication enjoyed by Microsoft Windows users requires
    the relaxing of permissions on the server or the placement of passwords within
    a file on the Linux box.


    +   - Every access to a network share requires separate authentication.


    +   - Password maintenance of global shares becomes an issue.


    # 5.2.1 Using a URL


    The advantage to using a URL within a tool like Nautilus is distinct, since the
    file explorer is great for copying and manipulating files. The following URL style
    will access the share via Nautilus:


    ```

    smb://user@password@machine/share

    ```


    Via Nautilus this will appear as shown in Figure 5.4.


    It will ask for a password, since we did not supply one on the Location line,
    so the dialog box shown in Figure 5.5 also appears. But, you may have to enter
    your credentials twice.


    Programs other than Nautilus that require access to a global share may not be
    able to access the data. For this you need a mount point or a named directory,
    where you will mount the share onto the existing file system.


    Using a mount point as a place to mount the CIFS share is extremely useful for
    those that must be available for programmatic reasons. You can use smb and the
    credentials cache file to automate this functionality; however, the placement
    of a password in a clear text is anathema to most system administrators, so be
    extremely careful with permissions. The mount point can be created at boot time
    after the network is available,'
