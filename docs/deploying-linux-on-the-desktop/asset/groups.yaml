    ## 5.8 我如何制作可引导的 CD-ROM？


    mkisofs 是一个重要的命令，它有许多选项，如表 5.3 所示。


    参考表 5.3 并运行以下命令：


    ```

    cd temporary_data_directory

    mkisofs options -o /tmp/output.iso

    cdrecord options /tmp/output.iso

    ```


    可以使用 mkisofs 制作非常复杂的镜像，这些镜像可以根据读取 CD-ROM 的操作系统引导并显示不同的数据，mkisofs 的手册包含了这些复杂的示例。最后，也可以使用
    Nautilus（文件管理器）通过 `burn://...` 位置将镜像刻录到 CD-ROM 设备，这会创建一个标准的 ISO9660 镜像，而你可以使用以下命令完成相同的操作：


    ```

    cd path_to_dir_to_burn

    mkisofs J -R -o /tmp/output.iso

    cdrecord /tmp/output.iso

    ```


    ## 5.8 我如何制作可引导的 CD-ROM


    可引导的 CD-ROM 往往是制作恢复性 CD-ROM 的要求。这些非常实用的 CD-ROM 将帮助管理员恢复系统，甚至对系统进行取证分析。最后，分发介质始终可以使用，但如果一张名片大小的
    CD-ROM 就能提供从 CD 引导的能力并从而出于管理目的访问机器，为什么还要随身带一套七光盘呢？要制作可引导的 CD-ROM，你需要安装 syslinux
    RPM。


    ### 5.8.1 RHEL3


    ```

    update syslinux

    ```


    一旦安装了 syslinux，你就可以按照以下指令制作 CD-ROM：


    ```

    mkdir iso

    cd iso

    mkdir isolinux

    ```


    ```

    cp -r /usr/lib/syslinux/isolinux.bin isolinux

    cp files . # 将所有必要文件复制到此目录

    包括你想要运行的任何命令以及运行

    这些命令所需的库

    包括你的内核等。

    # 注意，制作一个可引导的cdrom 还涉及更多内容，

    包括必要的内核文件和配置文件，这些在这里未被涵盖。

    mkisofs -J -T -v -r -c isolinux/boot.cat -b isolinux/

    isolinux.bin -no-emul-boot -boot-load-size 4 -boot-info-

    ./file.iso

    ```


    注意，这绝不是完整的；此示例仅演示了基础知识和必要的 `mkcdiso` 命令。如果你想制作一个恢复性 CD-ROM，有一个名为 mkcdrec (www.mkcdrec.org)
    的非常有前景的项目，它将引导你制作可引导的恢复性 CD-ROM（从备份介质恢复你的系统，或仅在主引导记录被破坏时引导系统）或任何其他形式的可引导 CD-ROM。该项目包含了创建可引导
    CD-ROM 的必要步骤，包括任何必要的驱动程序，并提供了一个可以轻松添加的完整包。由于该项目是专为制作恢复性 CD-ROM 而设计的，因此对于帮助所讨论的情况来说已经足够了。此外，还有一个
    `mkbootdisk` 命令，它可以创建特定于你系统的引导磁盘，例如：


    ```

    mkbootdisk --device /tmp/bootdisk.iso --iso --uname -r

    cdrecord /tmp/bootdisk.iso

    ```


    mkbootdisk 的手册页将包含更多细节。


    ## 我如何操作软盘？


    软盘像 CD-ROM 一样有多种格式。然而，最流行的是 DOS 格式。要操作 DOS 格式的磁盘，首先确保已安装 `mtools` 包。


    RHEL: rpm -q mtools


    mtools 提供了模拟你通常使用的 DOS 命令的工具，但这些命令前面都有一个 `m`；格式化命令变为 `mformat`，复制变为 `mcopy`，目录变为
    `mdir`，切换目录变为 `mcd`，以此此类推。需要注意的是，大多数文本文件需要使用以下命令从 DOS 转换为 Linux：


    ```

    dos2unix <inputfile> <outputfile>

    ```


    然后，当需要将文本文件交还给 DOS 用户以便其再次使用磁盘内容时，使用以下命令：


    ```

    unix2dos <inputfile> <outputfile>

    ```


    另一种类型的软盘是持有不同类型文件系统的磁盘。使用标准的 `mount` 命令挂载该文件系统，然后所有标准的 Linux 命令都将按预期工作。


    ## 5.10 成本


    其中仅涉及一个隐藏成本，且那仅在你需要操作晦涩的文件系统时才适用。这个隐藏成本是指如果你必须重新编译内核以访问这些文件系统时，所需的支持费用。然而，如果你坚持使用标准内核，这些系统中的许多以其友好的形式默认可用。如果你迫切需要在本地机器上操作
    NTFS 分区，使用如 VMware 等系统创建一个真实的 Microsoft Windows 安装可能是合适的，而不是在 Linux 中使用风险较高的 NTFS
    写入启用代码。一旦使用了像 VMware 的工具，你可以设置一个 CIFS 服务器将磁盘共享给 Linux 服务器。最后这种选项可能很昂贵，并不一定必要。


    成本显示在表 5.4 中。


    ![](img/a063699af5597deead6a12a449cc2aa3_112_0.png)


    | 软件 | 支持级别 | 费用 | 支持费用 |

    | :--- | :--- | :--- | :--- |

    | VMware | 基于支持 | $199 | 免费 |

    | 内核 | 无 | 免费 |


    '
