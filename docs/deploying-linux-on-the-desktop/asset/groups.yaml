    # 病毒与垃圾邮件防护


    桌面电脑的两个最大敌人是垃圾邮件和病毒。这两个反派让所有管理员都非常头疼。使用 Linux 桌面系统的好处是 Linux 病毒非常少；然而，垃圾邮件仍然是一个反派！Linux
    有许多工具可以对付这两个大恶棍之徒；有些关键配置可以帮助保护你的系统免受病毒侵害。病毒最常见的入侵方式是通过电子邮件，因此本章将集中于如何让 Linux 机器的电子邮件安全。


    ## 9.1 如何阻止垃圾邮件？


    我们必须承认，垃圾邮件是一个巨大的痛苦。为了对抗垃圾邮件，Linux 盒子里有多种工具可用；这些工具可以在用户级或全系统级实现。某些工具会从被标记为垃圾邮件的消息中学习，而另一些则需要手动控制。最广泛使用的工具之一是
    SpamAssassin。SpamAssassin 将所有功能和学习控制整合在一个高度可配置软件包中。该工具允许你使用远程服务以及其自身的规则来判断邮件是否为垃圾邮件，你还可以使用其他邮件传输程序的
    procmail 子系统来对其进行全局配置。由于 sendmail 是最常用的邮件传输程序，我们将介绍它的用法。


    如果正在使用运行 SpamAssassin 的 IMAP 服务器，否则 SpamAssassin 对通过这些工具组合交换的邮件将不起作用。SpamAssassin
    设计为通过 procmail 子系统作为系统邮件传输程序的一部分，该子系统用于用户本地的电子邮件投递，或者使用其他机制可以作为系统级邮件过滤器（milter）。如果邮件被投递到服务器本地，milter
    可以在调用其他传输机制（包括 POPmail 和 IMAP）之前找到垃圾邮件。因此，SpamAssassin 可用于通过 IMAP 或 POPmail 服务器获取邮件的
    Outlook 客户端。SpamAssassin 的额外优势是它是作为许多 Linux 版本的一部分自带的。要使用 SpamAssassin 处理本地投递的电子邮件，你可以如下所示使用
    procmail：


    创建 .forward 文件：


    ```

    "IFS='' ''& exec /usr/bin/procmail -f - || exit 75 #user"

    ```


    创建 .procmail 文件：


    ```

    :0fw: spamassin.lock

    * <256000

    | spamassin

    ```


    输入这些指令后，本地 sendmail 投递代理将运行 spamassin 或 sporc（基于服务器）程序，并将你所有的邮件标记为垃圾邮件（spam）或正常邮件（ham，不是垃圾邮件，而是良好的邮件）。由于在某些情况下，合法邮件会被错误标记为垃圾邮件，因此可能不将所有垃圾邮件重定向到收件箱更好。你可以向
    .procmail 文件添加以下命令，将所有垃圾邮件转发到你你不感兴趣的其他文件夹中。然而，这种行为可能最好留给你的邮件客户端处理。


    ```

    :0

    * ^X-Spam-Level: \*|\*|\*|\*|\*

    spam-folder

    ``` （根据上下文从 spam-folder 修正）


    ```

    :0

    * ^X-Spam-Status: Yes

    possible-spam-folder

    ```


    这些额外的 .procmail 文件条目将查看 SpamAssassin 的头信息（headers）。所有分数在 10 分或以上的项目将被标记为垃圾邮件，并直接放在
    spam-folder 中，或者如果邮件可以被认为是垃圾邮件，则放在 possible-spam-folder。


    在使用 procmail 时，你可以制定配方来处理每种垃圾邮件情况。SpamBouncer (http://www.spambouncer.org) 就是这样做的；但此工具不包含
    SpamAssassin 部分的强大贝叶斯过滤器。


    如果你在使用如 Evolution 的邮件客户端，或者你的邮件不是在本地投递的，你可能需要另一种方法来防止垃圾邮件。以下指令假设你的远程邮件服务器尚未具有阻止垃圾邮件的工具，或者你希望增强此功能。


    在 Evolution 中添加 SpamAssassin 过滤器：

    导航到 Tools->Filters...（图 9.1）。


    点击 Add，然后将 Rule name 更改为 SpamAssassin，并在 If 子句将条件更改为 Pipe Message to Shell Command。在条件旁框中输入
    `spam-assassin -e >/dev/null`。在 Returns greater than 下拉框中选择返回，并输入 0 作为大于返回的值。（见图
    9.2）。


    现在修改过滤器的 Then 子句并点击 click here to select a folder 来选择文件夹，并添加新文件夹或选择现有的 spam 文件夹。在本例中，我们使用位于
    Local Folders 文件夹中名为 spam 的文件夹（见图 9.3）。添加次要条件 Stop processing；如果你不这样做，其他过滤器仍然会在垃圾邮件上运行。确保此规则是你
    Filter 列表中的第一个规则。


    如果你的邮件服务器已经标记了垃圾邮件，你可以查找特定的邮件头信息（也许是 Subject 头，因为 SpamAssassin 可以更改主题以标记 *** 前缀来捕捉垃圾邮件），除了安装
    SpamAssassin 之外，执行 Move to Folder 操作，你将需要安装与外部服务器通信的工具。这些外部服务器查看黑名单（RBL）以及成员。


    # 图 9.2

    在 Evolution 中添加 SpamAssassin 过滤器：添加 SpamAssassin。


    ![](img/a063699af5597deead6a12a449cc2aa3_161_0.png)


    # 图 9.3

    在 Evolution 中添加 SpamAssassin 过滤器：添加 SpamAssassin。


