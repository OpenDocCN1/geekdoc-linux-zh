    ## 6.2 Video Conferencing\n\nFigure 6.3 Miao interface.\n\n![](img/1170)\n\nThere\
    \ are a few methods for video conferencing while using Linux: unfortunately, they\
    \ do not interoperate very well. The first is Gnome Meeting, and the second is\
    \ Microsoft’s NetMeeting via CrossOver Office. Other tools are available to provide\
    \ pictures or videos to users, but these are generally peer-to-peer tools and\
    \ do not provide true video-conferencing capability. The OpenH323 Project (http://www.openh323.org)\
    \ is an excellent place to start researching video conferencing.\n\n### 6.2.1\
    \ GnomeMeeting\n\nGnomeMeeting is a great tool that mimics the abilities of NetMeeting,\
    \ yet shares none of its most useful protocols. Work is being done to achieve\
