  mdcn: "\n-   2. 安装后重启，安装 RHEL4WS Extras 光光盘中的内容。\n\n-   3. 使用 Red Hat Network 和\
    \ `up2date` 工具将 RHEL4WS 升级到所有软件的最新版本。\n\n-   4. 安装并配置 YUM (http://dag.wieers.com/packages/yum/)。具体下载源码\
    \ RPM，并使用 `rpm-build` 重建用于在 RHEL4 上安装的 RPM。\n\n-   5. 通过添加以下行配置 `/etc/yum.conf`，以指向\
    \ Dag Weiers RPM 仓库的 RHEL4 条目：\n\n```\n[dag]\nname=Dag RPM Repository for RHEL\n\
    baseurl=http://apt.sw.be/redhat/el4/en/i386/dag\n```\n\n-   使用 YUM，通过以下命令从 Dag\
    \ Weiers 仓库专门安装某些额外软件。请注意，此列表中提到的某些安全软件在书中并未讨论；这是我加固机器时使用的列表。\n\n```\nyum install\
    \ mplayer mplayer-skins mplayer-fonts xine clamav clamav-db clamtk chkrootkit\
    \ kino perl-Curs perl-Tk yumi\n```\n\n-   6. 按照第 4 章描述编译并安装 `libsidplay` 以及 `sidplay-base`。此外，使用\
    \ `CheckInstall` (http://asic-linux.com.mx/-izto/checkinstall/) 工具创建一个 RPM。CheckInstall\
    \ 虽然在书中未提到，但它是替代“make install”的新工具，将为基于 Debian、Slack 和 RPM 的发行版构建可安装的包。\n\n- \
    \  7. 按照第 4 章描述，使用 `rpmrebuild` 重建并安装 Xanim RPM。\n\n-   8. 按照第 4 章描述，使用 `CheckInstall`\
    \ 工具编译并安装 FreeWRL。\n\n-   9. 在 http://fredrik.hubbe.net/plugger/test.html 配置并测试所有\
    \ Firefox 插件测试场。确保为第 10 章讨论的 WMX 多媒体格式进行所需的添加内容。修复或解决可能出现的任何问题。测试场还提到了 Linspire\
    \ 测试场。Linspire 是进一步测试你的 Firefox 配置的极佳地点。\n\n-   11. 安装来自 http://linux.dell.com/dkms/\
    \ 的 DKMS v2 RPM。\n\n-   12. 按照第 2 章描述，将 Orinoco USB v0.2.2 驱动安装到 DKMS。\n\n-  \
    \ 13. 按照第 3 章描述安装 Microsoft 字体。Cabextract 也可以通过 Dag Wie RPM 仓库获取。\n\n-   14. 按照第\
    \ 8 章和第 10 章中的 RHEL4 更新安装 GNUcash。\n\n-   15. 按照第 8 章和第 10 章中的 RHEL4 更新安装 gphoto\
    \ 更新。\n\n-   16. 按照第 3 章描述安装 WordPerfect。\n\n-   17. 按照第 11 章描述安装 Qcad。\n\n- \
    \  18. 按照第 10 章中的 RHEL4 更新安装 new-kewdebdev (quanta 替代品)。\n\n-   19. 按照第 7 章描述安装\
    \ xkeycaps 和 vmstern。\n\n-   20. 按照附录 A 安装 CrossOver Office。在 CrossOver Office\
    \ 内部安装：\n\n    -   a. Internet Explorer 6\n    -   b. CrossOver Office 安装程序中的所有“免费”查看器\n\
    \    -   c. Microsoft Office 2000\n    -   d. Microsoft FrontPage 2000\n    -\
    \   e. Microsoft Visio 1999\n    -   f. QuickBooks Pro 1999\n    -   g. CCNA 训练材料\n\
    \n-   21. 使用 Bastille (http://www.bastillelinux.org) 加固系统。\n\n-   22. 安装企业特定的\
    \ Windows 和 Linux 工具：\n\n    -   a. VPN\n    -   b. 管理\n    -   c. 内部通信工具\n\n\
    -   23. 配置 Evolution 电子邮件客户端以实现电子邮件和 Palm 的集成。\n\n-   24. 按照第 8 章描述安装 par 工具和\
    \ Documents To Go 脚本。\n\n-   25. 使用 mundo (http://www.microworks.net/~hugo/) 或\
    \ `mkcdrec` 制作恢复光盘。虽然书中没有详述 mundo，但它是另一种恢复机制，拥有比 mkcdrec 更符合用户的界面。此外，可以使用 `mkbootdisk`\
    \ 创建必要的启动盘，以从正在使用的软件光阵 中恢复系统。\n\n搅拌所有配料或遵循这些步骤，在 350 度下烘烤约三小时，你将获得一个提供集成 Linux\
    \ 环境的系统！\n\n# 术语表\n\n| | |\n|--- |--- |\n| 123 | Lotus 1-2-3 文档 |\n| AbiWord |\
    \ Microsoft 的富文本格式 (RTF) 编辑器 |\n| acroread | Adobe Acrobat Reader (http://download.adobe.com/pub/adobe/acrobatreader/unix/)\
    \ |\n| AIM | AOL 即时消息协议和网络 |\n| AlsaPlayer | 使用 Linux ALSA 声音系统的多媒体播放器 |\n| ANIMP\
    \ | Xanim (X Animator) 媒体格式 |\n| artsplay | ARTS 守护进程播放器 (man artsplay) |\n| ASF\
    \ | Windows Media 格式 |\n| ASX | Windows Media 格式 |\n| AU | 基本音频多媒体格式 |\n| AVI\
    \ | Microsoft 视频格式 |\n| awk | Linux 命令 |\n| cabextract | 也可以通过 Dag Wie RPM 仓库获取\
    \ |\n| CCNA | 思科认证网络工程师 |\n| chkrootkit | 安全软件工具 |\n| fontpath | Linux 文件路径 |\n\
    | chmod | Linux 权限命令 |\n\n*(注：原文中重复的术语表部分已去重，以保持文档可读性)*\n"
