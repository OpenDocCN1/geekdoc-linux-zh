    | ClamAV | http://www.clamav.net | |

    | Trend | http://www.trendmicro.com | $$$ |


    To select the appropriate software for MailScanner, you would edit the file /etc/MailScanner/Mailscanner.conf
    and verify that the line `Virus scanning = yes` is set. If instead it reads `Virus
    scanning = no`, enable this feature. Next, change the line `Virus Scanners = be`
    to `Virus Scanners = clamav`. This will enable the use of ClamAV as the virus
    scanner choice. Since ClamAV is an active project with active virus updates, it
    is an inexpensive option to use. Sophos is available, but it is quite expensive
    to use. However, virus scanner is corporate policy, and MailScanner can support
    all the scanners mentioned. Last, you can use more than one scanner on the definition
    line. If you wanted, you could use all the scanners listed by adding one at a
    time in a space-separated list.


    ClamAV is quite easy to install:


    ```bash

    # tar -xzf clamav-0.80.tar.gz

    # cd clamav-0.80

    # useradd -d /var/clamav clamav

    # ./configure

    # make

    # make install

    ```


    ClamAV is installed, let MailScanner handle the rest. To set up mail filtering
    there is also a Perl module; you can install the ClamAV Perl module for Sophos.
    These Perl modules interact with a central virus-scanning server. Instructions
    for installing Perl modules are on the MailScanner website.


    ## How Can You Scan a Machine for Viruses?


    The same way that you use ClamAV to scan for e-mail viruses, you use it to scan
    a disk for viruses. The key is to keep the virus software up-to-date, and ClamAV
    provides freshclam to do just that. Default, fresh-clam runs daily. Clamscan,
    ClamAV''s antivirus scanner, does not run daily or at all in an automated fashion.
    You can set up clamscan to be run by each user individually or via the whole system.
    I like the complete system approach, which centralizes control. To do this, create
    the file /cron.daily/doclamscan to run the antivirus file system scanner daily,
