    | application/vnd.sun.xml.draw | OpenOffice.org Draw Document | sxd | oodraw |\n\
    | application/vnd.sun.xml.draw.template | OpenOffice.org Draw Template Document\
    \ | std | |\n| application/vnd.stardivision.draw | StarDraw Document | sda | |\n\
