    ## 3.9 打印（网络或连接）


    ```bash

    cd "$mozdir"

    localmail

    ```


    现在，你拥有了一个可以访问 Exchange 的邮件客户端，包括日历和其他标准 Exchange 客户端的其他功能。然而，它仍然存在局限性。你将无法访问组邮箱，如果需要这些组邮箱，你可能需要通过其他工具来实现。


    在开始，我们提到了第二种特殊情况，即使用 CrossOver Office 来运行由 Wine 模拟的 Microsoft Outlook。通过这种方式，你可以通过标准的
    Outlook 客户端获得完全访问。需要注意的是，Outlook 的许多插件将无法工作，那些冷门功能也是如此，因为底层尚未具备处理它们的能力。然而，组邮箱和普通邮箱以及标准的
    Outlook 视图都可以正常工作。


    ## 3.9 打印（网络或连接）


    在 Linux 中，打印到通用网络打印机需要知道两点。首先，你需要知道设备的 IP 地址，其次，你需要知道要使用的设备类型。对于通用的连接打印机，只需要设备类型；然后只需设置打印机并选择合适的打印选项即可。像
    Linux 中的所有事情一样，实现此操作有多种方法，但最简单的方法是使用 GUI 工具之一来设置打印机。然而，使用哪种工具取决于要使用的打印子系统。如今大多数
    Linux 系统使用 CUPS 打印子系统，而不是旧的 Berkeley 子系统。配置工具的用法将在本书之外详细介绍。


    ```

    RHEL3: redhat-config-printer

    Make: drakconf

    SuSE: yast2

    Fedora/RHEL4: system-config-printer

    ```


    ### 3.9.1 打印到 Windows 打印服务器


    打印到 Windows 打印服务器非常简单，可以使用 Berkeley 或 CUPS 打印子系统完成。访问 Windows 打印服务器的主要限制是身份验证。如果服务器需要身份验证（大多数打印机的情况），你需要在
    Linux 打印配置中硬编码密码或


    ### 3.9.2 打印到 AppleTalk 或 Macintosh 打印机


    现代 Macintosh 非常容易配置使用任何打印机，因为它们使用了许多与 Linux 相同的工具。你可以将你的 Mac 作为 CIFS 服务器并使用之前描述的
    Windows 风格身份验证。或者你可以使用运行在 Mac 上的类 UNIX 打印守护，它将管理整个 Mac 以及连接的或 AppleTalk 打印机。


    注意：访问旧版 Mac 需要 netatalk 包，访问任何 Macintosh Ethertalk 网络连接打印机也是如此。Netatalk 的设置在本书的范围范围内。


    ## 3.10 其他考虑


    在使用基于 Linux 的工具替换 Office 产品时，还有其他需要考虑的问题。正如我们之前提到的，使用 OpenOffice 和 StarOffice
    文字处理程序会出现一些格式问题。缓解这些问题的方法之一是使用不同的字体，微软提供的许多字体（例如 Arial）在 Linux 上并不可用。有一个开源项目（http://fonts.sourceforge.org/）来解决这个问题。另一个解决方案是使用
    Windows 机器 C:\Windows\Fonts 目录下的现有字体集。你可以使用这些解决方案之一来帮助解决格式问题，针对提到的每个内容使用以下配方。


    ```bash

    # rpmbuild --rebuild cabextract-0.6-1.src.rpm

    Installing cabextract-0.6-1.src.rpm

    ...

    Wrote: /usr/src/redhat/RPMS/i386/cabextract-0.6-1.i386.rpm

    ...

    # rpm -ivh /usr/sec/redhat/RPMS/i386/cabextract-0.6-i1386...rpm

    # cabextract cabinet: arial32.exe

    Extracting: arial32.exe

    extracting: FONTINST.EXE

    extracting: fontinst.inf

    extracting: Ariali.TTF

    ```


    ```bash

    extracting: Arialbd.TTF

    extracting: Arialbi.TTF

    extracting: Arial.TTF

    Finished processing cabinet.

    # cabextract andale32.exe

    Extracting cabinet: andale32.exe

    extracting: fontinst.inf

    extracting: andale.inf

    extracting: fontinst.exe

    extracting: AdeleMo.TTF

    extracting: ADVPACK.DLL

    extracting: W95INF32.DLL

    extracting: W95INF16.DLL

    Finished processing cabinet.

    对每个下载的字体执行操作。

    # mkdir /usr/share/fonts/ttf

    # cp *.ttf /usr/share/fonts/ttf

    # 或从 Windows 字体目录复制

    # cd /usr/share/fonts/ttf

    # mkfontdir

    # mkfontdir

    # chkfont -a /usr/share/fonts/ttf

    ```


    现在在 OpenOffice 中将默认文本字体设置为 Arial


    使用微软字体将有助于解决你的一些格式问题，但不能解决所有。


    ## 3.11 简单的答案


    解决 Linux 上的 Office 程序问题有一个简单的答案，那就是使用 VMware 在你桌面的窗口中运行一个虚拟机会话。这为你提供了一个完整的 Windows
    环境，你可以在其中使用常用的桌面工具，而无需依赖 Linux 工具。然而，VMware 是一个昂贵的选项，每个席位 199 美元，加上 Windows 许可。


    ## 3.12 成本


    解决 Linux 上的 Office 程序问题有一个简单的答案，那就是使用 VMware 在你桌面的窗口中运行一个虚拟机会话。这为你提供了一个完整的 Windows
    环境，你可以在其中使用常用的桌面工具，而无需依赖 Linux 工具。然而，VMware 是一个昂贵的选项，每个席位 199 美元加上 Windows 许可。


    使用 Linux 有成本吗？简而言之，在价格方面。然而，如果你担心功能性，可能会得到。Linux 的潜在成本如表 3.1 所示。


    | 软件 | 支持 | 费用 |

    |---|---|---|

    | OpenOffice | 开源 | NA |

    | StarOffice | Web 端 | $80 |

    | VMware | Web 端 | $199 | 90 天 |

    | Evolution | 开源 | NA |

    | Mozilla | 开源 | NA |

    | CrossOver Office | Web 端 | $60 | 90 天 |


