    Now that we have all the files, let''s discuss installation briefly. The 1.0pre3
    version of mplayer requires installation using the --nodeps option, as shown in
    the following. Alternately, you could install all the required packages and only
    those codecs, fonts, and skins you desire.


    ```

    # rpm -ivh --nodeps lame*

    # rpm -ivh --nodeps mplayer*

    ```


    Are we done yet? Unfortunately, since you need to specify which video output you
    will use. Additionally, to make matters interesting, the graphical player (mplayer)
    uses its own configuration files, which you can edit by right-clicking on the
    program and selecting Preferences. For the command-line tool used by Web browsers,
    you can edit the file ~/.mplayer/config so it has the following line:


    ```

    vo=x11

    ```


    For mplayer you can also select the X11 video output driver from the Preferences
    window under the Video tab. The available drivers are shown in Table 4.1.


    Table 4.1 Available mplayer Drivers


    | Driver | Hardware |

    | :--- | :--- |

    | Xmage | Matrox G200/G400/G550 |

    | Xv | X11/Xv |

    | x11 | X11 (Image/Shared) |

    | Xvid | X11 (VIDIX) |


    While you can use other drivers if you have the appropriate hardware (Matrox and
    VIDIX), using the x11 driver will work on all machines and depends on your Xfree86
    installation rather than on specific hardware.


    Once everything is configured, you can launch mplayer and, by clicking on the
    video box, you can use the menu DVD->Open Disk... to open a DVD and play the default
    title on the DVD. If you wish to switch to another title, you can use the DVD->Title
    menu to switch between all known titles on the disk. Unlike other DVD players,
    there is no ability to use the DVD Menu associated with each DVD. You have to
    switch between the titles yourself.


    ## 4.1.7 How to Install the Mozilla Plugin?


    The Mozilla Plugin (http://fredrik.hubbe.net/plugger.html) is a glue layer that
    uses its own MIME-type definitions to load standard system viewers when content
    is accessed from the Web browsers. These viewers are then loaded using external
    windows and, in rare cases, embedded in Web page documents. Plugin needs to be
    built from source. The standard system viewers are tools that are installed with
    the OS and available from the command line. For example, the previously mentioned
    Xpdf could be considered a standard system viewer for acrobat files.


    ### Building Plugin


    ```

    # xzf plugger-5.1.2.tar.gz

    # cd plugger-5.1.2

    # [plugger-5.1.2]# ./configure

    # [plugger-5.1.2]# make

    # [plugger-5.1.2]# make install

    ```


    After building Plugin you can then verify that Plugin is properly installed by
    using Help>About Plug-ins within Mozilla. You should see something similar to
    the image shown in 4.7.


    ![](img/a063699af5597deead6a12a449cc2aa3_74_0.png)


    # Plugin 5.1.3.(adde14) handles QuickTime Windows Media Player Plugin


    Filename plugger.so

    Plugin version 5.1.1, written by Fredrik Hubbe (hubbe-plugger.net). For documentation
    on how to configure go to the plugin homepage or check the man page (type was
    plugger). Currently, handling 141 mime types.


    Compile file:

    plugger 5.1.3

    Help binary:

    plugger 5.1.3

    Controller binary:

    plugger-controller

    Office helper:

    plugger-helper


    | Format | Description | Support |

    | :--- | :--- | :--- |

    | videocodec | MPEG video | mpeg, mpg, mpe |

    | video/x-mpeg | MPEG video | mpeg, mpg, mpe | Yes |

    | video/x-mpeg2 | MPEG2 video | mp2, mv2 | Yes |

    | videomvideo | AVI video | Yes |


    As you can see, Plugin can display many formats and is the glue between multimedia
    content and the players. To verify that the plugin is working correctly, visit
    the test.hubbe.net/test.html site and run through some of the test files. If some
    of the tests do not appear or play, then you will need to configure the necessary
    tools to make them play.


