    ## 10.7 结论


    由于目前大多数培训都是通过 Web 进行，许多支持培训的工具已经是 Linux 的一部分（请参阅第 4 章）；通过使用 Wine，更多工具变得可用。在 Windows
    上使用 CBT 培训需要 Wine 或 VMware，这可以在不花费大量资金甚至时间的情况下，提供一个可重复使用的训练材料源。然而，我坦诚承认，掌握 Wine
    的细节并非弱者的之选，而且很容易产生误导。直觉将引导你，同时也需要你对程序如何工作有足够的理解。（见表 10.1）


    表 10.1 当前软件信息


    | 软件 | 支持级别 | 费用 | 支持费用 |

    | --- | --- | --- | --- |

