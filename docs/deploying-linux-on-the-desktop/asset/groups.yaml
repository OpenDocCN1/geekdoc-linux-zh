  raw:
  - '[PAGE 195]


    +   2. On reboot after installation, install the contents of the RHEL4WS Extras
    CD-ROM.


    +   3. Upgrade RHEL4WS to the latest versions of all software using the Red Hat
    Network and the up2date tool.


    +   4. Install and configure YUM (http://dag.wieers.com/packages/yum/). Specifically
    download the source RPM, and use rpm-build to rebuild the RPM for installation
    on RHEL4.


    +   5. Configure the /etc/yum.conf to point to the RHEL4 entries for the Dag Weiers
    RPM repository by adding the following lines:


    ```

    [dag]

    name=Dag RPM Repository for RHEL

    baseurl=http://apt.sw.be/redhat/el4/en/i386/dag

    ```


    +   Using YUM, specifically install some extra software from the Dag Weiers repository
    using the following command. You should note that some security software mentioned
    in this list is not discussed in the book; this is the list I harden by machines.


    ```

    yum install mplayer mplayer-skins mplayer-fonts xine clamav clamav-db clamtk chkrootkit
    kino perl-Curs perl-Tk yumi

    ```


    +   6. Compile and install libsidplay, as well as sidplay-base, as described in
    Chapter 4. In addition, make an RPM using the CheckInstall (http://asic-linux.com.mx/-izto/checkinstall/)
    tool. CheckInstall, while not mentioned in this book, is a new tool that replaces
    “make install” and will build installable packages for Debian-, Slack-, and RPM-based
    distributions.


    +   7. Using rpmrebuild, rebuild and install the Xanim RPM, as described in Chapter
    4.


    +   8. Compile and install FreeWRL, as described in Chapter 4, using the CheckInstall
    tool.


    +   9. Configure and test all the FireFox plug-ins grounds at http://fredrik.hubbe.net/plugger/test.html.
    Be sure to make the additions required for the WMX multimedia format discussed
    in Chapter 10. Fix or make any of the problems that may appear. The testing grounds
    mention the Linsp'
  - '[PAGE 196]


    # 13.2 Steps


    testing grounds as well. Linspire is a very good location to test further your
    Firefox configuration.


    +   11. Install DKMS v2 RPM from http://linux.dell.com/dkms/


    +   12. Install the Orinoco USB v0.2.2 drivers into DKMS, as described in Chapter
    2.


    +   13. Install the Microsoft core fonts, as described in Chapter 3. Cabextract
    is also available via the Dag Wie RPM Repository.


    +   14. Install GNUcash, as described in Chapter 8 and in the RHEL4 update in
    Chapter 10.


    +   15. Install gphoto update, as described in Chapter 8 and in the RHEL4 update
    in Chapter 10.


    +   16. Install WordPerfect, as described in Chapter 3.


    +   17. Install Qcad, as described in Chapter 11.


    +   18. Install new-kewdebdev (quanta replacement), as described in the RHEL4
    update in Chapter 10.


    +   19. Install xkeycaps and vmstern as described in Chapter 7.


    +   20. Install CrossOver Office, as described in Appendix A. Inside CrossOver
    Office, install:


    +   a. Internet Explorer 6


    +   b. All the “free” viewers from the CrossOver Office setup


    +   screens


    +   c. Microsoft Office 2000


    +   d. Microsoft FrontPage 2000


    +   e. Microsoft Visio 1999


