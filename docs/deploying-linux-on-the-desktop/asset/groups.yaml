    #  10.5 The Cost


    As can be seen, there are not many Linux-only options for training. There are
    a few and it''s a growing list, but there is nothing in the mainstream yet. However,
    that is not the end of everything, because using inexpensive tools such as CrossOver
    Office can bring CBT and other training tools to the desktop.


    #  10.6 Support


    Training tools, under Cross Office, are not necessarily supported by CodeWeaver
    or the tool vendor, so using these training tools could be a risk. However, the
    Wine open source community is very active and can answer your questions. With
    a little investigation into wine and how to solve its problems, many of the issues
    faced can easily be solved with those tools not dependent upon .NET. Any .NET
    tool in Wine will fail, since it is not yet supported.'
