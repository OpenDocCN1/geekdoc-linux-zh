    into a Linux kernel so that modern Wireless-G devices will work. The NT Ndis driver
    will read the Windows based wireless device copied to the Linux system from its
    Media and use this to control the device. This helps the road warriors. As an
    example, we have a recipe for configuring a LinkSys Wireless-G PCI PCMCIA device:'
