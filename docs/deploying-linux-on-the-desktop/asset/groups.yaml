    图 3.6 PowerPoint 文本布局的对比。

    (img/a063699af5597deeada12a449cc2aa3_41.png)


    gmdb2 GUI 程序可以以类似于 Access 的形式使用，但它目前还没有写入数据库文件的能力，不过它提供了一个图形界面，可以将数据库导出为可供更强大的
    MySQL 或 PostgreSQL 版本读取的文件。0.6 版本应该具有写入权限，但它仍处于测试阶段。


