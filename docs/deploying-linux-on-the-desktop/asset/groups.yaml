    # Conclusion and Future Directions


    While this book tries to answer the most common issues regarding the use of Linux
    as a valid corporate desktop, it is by no means complete. New challenges and questions
    arise every day regarding all desktops, and I will continue to pursue these in
    the realm of Linux. If you would like to pose a question, provide feedback, and
    even new solutions to be presented in a future edition of this book or on the
    Web site related to this book, please send e-mail to books@astroch.com or visit
    the Web site //://www.astroch.com/-elt/books.html I freely admit that there are
    other books covering much of the material in more detail than is presented here;
    however, we are trying to present only the detail required to install the product
    to meet the specified needs for an integrated desktop, as well as the costs of
    use.


    In addition, many items show limitations in Linux; these are not necessarily limitations,
    but questions that the administrators and managers must ask how their network
    and desktops will be used. Each chapter covers a wide range of tools and possible
    implementation options, and it is up to the system designers to ask the right
    questions and plan for success. Planning ahead and asking the tough questions
    up front will save in support and implementation costs later. To prove the usability
    of the tools mentioned herein, this book was written using them: Word via CrossOver
    Office, StarOffice, OpenOffice, and Documents-To-Go on a Palm handheld device,
    as well as other Linux tools.


    Support costs are associated with every implementation of a desktop. The worst-case
    scenario could be the loss of warranty support from the distributor vendor, as
    happens when the kernel is recompiled to add necessary feature such as IPSec NAT-T
    support. While this is not desirable, nonetheless could be the result if the kernel
    is tainted, and plans must be made in advance to debug any using only vendor-supplied
    software and patches. The support costs could be the limiting factor; however,
    those'
