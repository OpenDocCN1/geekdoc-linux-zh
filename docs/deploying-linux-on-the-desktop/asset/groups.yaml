    use the DVD->Title menu to switch between all known titles on the disk. Unlike
    other DVD players, there is no ability to use the DVD Menu associated with each
    DVD. You have to switch between the titles yourself.


    # 4.1.7 How Do Install the Mozilla Plugger-in?


    The Mozilla Plugger-in (http://fredrik.hubbe.net/plugger.html) is a glue layer
    that uses its own MIME-type definitions to load standard system viewers when content
    is accessed from the Web browsers. These viewers are then loaded using external
    windows and, in rare cases, embedded in Web page documents. Plugger needs to be
    built from source. The standard system viewers are tools that are installed with
    the OS and available from the command line. For example, the previously mentioned
    Xpdf could be considered a standard system viewer for acrobat files.


    # Building Plugger


    ```

    # xzf plugger-5.1.2.tar.gz

    # cd plugger-5.1.2

    # [plugger-5.1.2]# ./configure

    # [plugger-5.1.2]# make

    # [plugger-5.1.2]# make install

    ```


    After building Plugger you can then verify that Plugger is properly installed
    by using Help>About Plug-ins within Mozilla. You should see something similar
    to the image shown in 4.7.


