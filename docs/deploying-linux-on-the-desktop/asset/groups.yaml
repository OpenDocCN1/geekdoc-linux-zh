    # 6.2 Video Conferencing


    Figure 6.3 Miao interface.


    ![](img/a063699af5597deead6a12a449cc2aa3_117_0.png)


    There are a few methods for video conferencing while using Linux: unfortunately,
    they do not interoperate very well. The first is Gnome Meeting, and the second
    is Microsoft’s NetMeeting via CrossOver Office. Other tools are available to provide
    pictures or videos to users, but these are generally peer-to-peer tools and do
    not provide true video-conferencing capability. The OpenH323 Project (http://www.openh323.org)
    is an excellent place to start researching video conferencing.


    # 6.2.1 GnomeMeeting


    GnomeMeeting is a great tool that mimics the abilities of NetMeeting, yet shares
    none of its most useful protocols. Work is being done to achieve these protocols,
    but they have yet to be realized. Use of GnomeMeeting is therefore limited to
    video sharing with NetMeeting; there is no chat, application, or whiteboard sharing
    (T.120 Protocol). However, whiteboard and chat sharing are available for Linux-to-Linux
    hosts. To show video, you will need a camera that uses Video4Linux drivers, which
    includes many Creative and Philips cameras, as well as a few Logitech cameras.
    A host of information is available at http://www.gnomemeeting.org. Also, the site
    http://www.exploits.org/v4l/ hosts a list of working drivers for Video4Linux-supported
    cameras. Some webcam support for Linux is disappearing while others'
  - '[PAGE 118]


    # Figure 6.4

    GnomeMeeting


    ![](img/a063699af5597deead6a12a449cc2aa3_118_0.png)


    are appearing. As with any Open Source project review the available list of supported
    hardware before purchasing.


    Those people familiar with NetMeeting will find using GnomeMeeting just as comfortable.
    GnomeMeeting also has support for Voice over IP via MicroTelco Internet Telephone
    services (http://www.microtelco.com).


    GnomeMeeting is installed as part of most modern versions of Linux and will look
    like Figure 6.4.


    # RHEL


    up2date gnomeemeeting


    # 6.2.2 NetMeeting


    Microsoft NetMeeting is also available when using CrossOver Office ($79) or via
    VMware ($199). VMware will provide the full NetMeeting functionality while CrossOver
    Office will not provide good sound or video capabilities, yet the chat, whiteboard,
    and application sharing all work. While Netmeeting is running it will allow you
    to view shared applications, it cannot start the sharing process. Once NetMeeting
    is installed into CrossOver Office, you will need to create a menu item for it
    using the following:


    ```

    cd .gnome2/vfolders/applications

    cat CTree-Windows_Applications-Programs-NetMeeting.desktop

    <<EOF

    ```'
