    ## 2.3 我如何使用 SSH 隧道连接


    SSH 怎么样？安全外壳是否提供隧道方法？答案是肯定的，但在 Linux 和现代 Macintosh 之外，我没有见过它被广泛使用。然而，在使用 SSH 隧道之前，你必须拥有一个有效的网络连接，这就是其他
    VPN 解决方案可能派上用场的地方。SSH 的优势之一是任何网络连接都可启动隧道。再次，你需要 root 权限，因此 `sudo` 命令非常宝贵。我们不会深入研究
    SSH，因为对于这项技术有其他可用资源。


    ## 2.4 无线和其他网络设备


    现代无线设备的复杂性值得提及。许多较慢的无线设备在 Linux 上即插即用。这些设备遵循 Wireless-B 标准。然而，现代的 Wireless-G 设备（除基于
    Prism 的 Wireless-G 设备外）需要开源项目的帮助，请注意 Prism 驱动项目 (/ndiswrapper-sourceforge.net)
    将将 Microsoft NT Ndis 驱动加载到 Linux 内核中，以便现代 Wireless-G 设备能够正常工作。NT Ndis 驱动将读取从介质复制到
    Linux 系统的 Windows 无线设备，并利用此控制设备。这为“道路战士”们提供了帮助。例如，我们有一个配置 LinkSys Wireless-G PCI
    PCMCIA 设备的方案：


    ```

    # tar -xzf ndiswrapper-0.9.tar.gz

    # cd ndiswrapper-0.9

    # make install

    # mkdir /usr/local/linksys.WMP54G (PCI)

    从 CDROM 中将驱动文件 bcmwl15.* 复制到 /usr/local/linksys.WMP54G

    - 或者 -

    # mkdir /usr/local/linksys.WPC54G (PCIA)

    从 CDROM 中将驱动文件 bcmwl15.* 复制到 /usr/local/linksys.WPC54G

    ```


    ```

    # ndiswrapper -l # 检查任何已存在的驱动

    # ndiswrapper -i /usr/local/linksys.WPC54G/bcmwl15.inf # 安装驱动

    # ndiswrapper -l # 检查是否已安装

    # edit modules.conf 以设置 add alias wlan0 ndiswrapper

    ```


    配置 WLAN0


    一旦你使用上述配置工具之一配置了 WLAN0 设备，你就可以轻松地使用 Wireless-G 设备了。还有一个 DriverLoader，这是来自 Linux
    的第三方产品 (www.linuxant.com)。DriverLoader 与 NdisWrapper 非常相似，价格为 19.95 美元。


    NdisWrapper 和 DriverLoader 都使用所用无线设备提供的驱动程序，因此在安装这些工具时，你需要设备介质。


    此外，某些以太网设备必须构建新驱动程序以访问其所有完整功能。其中一个设备来自 Broadcom。虽然标准的 rg3 驱动可以工作，但它没有向驱动程序应用选项以控制速度、双工等的功能。因此，你可能需要重新编译
    BCM5700 驱动以处理这些选项。你可以轻松将此驱动程序和 NdisWrapper 驱动修复到 DKMS，这样当内核发生安全或其他更新时，你就不需要手动重新编译任何驱动程序。虽然以下步骤适用于
    RHEL5，但它们对你测试过的 Linux 版本同样有效。


    ## 2.4.1 通过 DKMS 使用 BCM5700 驱动


    我们正在使用 Broadcom 5700 (BCM5700) 驱动 v7.1.9e。我使用了以下步骤以 root 身份将此添加到 DKMS 中。虽然可能有更简单的方法，但这种方法运行良好，并允许构建相应的
    BCM5700 驱动，以便需要时提供 GigE 速度。


    ```

    # mkdir /usr/src/kernel_bcm5700-7.1.9e

    # cd /usr/src/kernel_bcm5700-7.1.9e

    # tar -xzf bcm5700-7.1.9e.tgz

    ```


    创建一个名为 dkms.conf 的文件，内容如下：

    ```

    PACKAGE_VERSION="7.1.9e"


    # 以下项目不应随每个驱动更改

    PACKAGE_NAME="kernel_bcm5700"

    BUILT_MODULE_NAME[0]="bcm5700"

    DEST_MODULE_LOCATION[0]="/kernel/drivers/net/"

    AUTOINSTALL="yes"

    REMAKE_INITRD="no"


    # 这些仅用于 2.4 内核

    MAKE[0]="make all"

    CLEAN="make clean"

    ```


    运行以下命令：


    ```

    # dkms add -m kernel_bcm5700 -v 7.1.9e

    # service dkms_autoinstall start

    ```


    ## 2.4.2 通过 DKMS 使用 NdisWrapper


    NdisWrapper 也可以非常方便地添加到 DKMS 框架中。实际上，它比之前讨论的 BCM5700 驱动更简单，因为不需要特殊的构建脚本。这些简短的指令就能完成你所需工作。DKMS
    要求安装模块路径以 /kernel开头，因此你需要根据以下说明更改 Makefile。


    ```

    # mkdir /usr/src/kernel_ndiswrapper

    # cd /usr/src/kernel_ndiswrapper

    # tar -xzf ndiswrapper-0.9.tar.gz

    # mv ndiswrapper-0.9/* ./ ; rmdir ndiswrapper

    修改 Driver/Makefile 将安装路径从 ''misc'' 更改为 ''kernel/drivers/net''

    ```


    创建一个名为 dkms.conf 的文件，内容如下：

    ```

    PACKAGE_VERSION="0.9"


    # 以下项目不应随每个驱动更改

    version

    PACKAGE_NAME="kernel_ndiswrapper"

    BUILT_MODULE_NAME[0]="ndiswrapper"

    BUILT_MODULE_LOCATION[0]="driver"

    DEST_MODULE_LOCATION[0]="kernel/drivers/net/"

    AUTOINSTALL="yes"

    REMAKE_INITRD="no"


    # 这些仅用于 2.4 内核

    MAKE[0]="make all"

    CLEAN="make clean"

    ```


    然后运行以下命令：


    ```

    # dkms add -m kernel_ndiswrapper -v 0.9

    # service dkms_autoinstall

    ```


    ## 2.5 成本


    使用 Linux 作为 VPN 平台是否有隐藏成本？使用这些工具会有金钱成本以及支持成本。金钱成本与购买硬件和实现 VPN 所需的软件有关。由于现代 VPN
    客户端可能还需要生物识别狗密或卡，它们的成本与其他任何系统并无区别。然而，系统之间的软件成本可能会非常不同。如果你使用通用工具，除非要使用 VMware，否则成本是最低的。


    表 2.1 显示了涉及的成本。


    | 软件 | 支持级别 | 费用 | 支持费用 |

    |---|---|---|---|

    | PPTP | 开源 | NA | NA |

    | OpenSWAN/IPsec | 开源 | NA | NA |

    | VMware | 基于 Web/电话 | $199 | 90天内免费 |

    | NdisWrapper | 开源 | NA | NA |

    | DriverLoader | 电子邮件/电话 | $19.95 | NA |

    | DKMS | 开源 | NA | NA |

    | SSH 隧道 | 开源 | NA | NA |


    ## 2.6 支持问题


    在 Linux 上使用 VPN 时确实存在相当大的支持问题，其中最主要的是为了 NAT-T 重新编译内核，这会导致你的保修失效。实际上，对内核的任何重新编译或修改都会导致保修失效。添加模块不会导致保修失效，但你可能需要禁用它们的使用以完全调试系统，因为特定模块将无法使用。


    在做出如此强烈的声明后，为什么还要使用这些工具？因为开源社区非常活跃、能力强，并为他们的模块提供了卓越的支持。此外，DKMS 实现将减少支持电话的数量，并允许企业
    IT 部门对当前使用的工具有更多控制。


