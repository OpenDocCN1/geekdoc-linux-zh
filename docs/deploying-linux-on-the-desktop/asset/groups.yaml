    # Linux 发行版


    桌面端有许多 Linux 发行版供您选择。某些是专为桌面设计的，而另一些则是相同基础产品的不同版本，均支持桌面。下表列举了各种 Linux 发行版及其独特之处。这只是书中涵盖的常见发行版的简列表。然而，还有大量的
    Linux 发行版可以满足各种需求。这些内容可以在 http://www.linux.org/dist/index.html 找到完整的文档。


    | 发行版 | 注释 |

    | --- | --- |

    | Debian | Debian 是一个非常优秀的开源 Linux 发行版，几乎包含一切。然而，它的基础安装仍然面向单光 CD-ROM 安装，所有额外的软件包都可以从网络获取。
    |

    | Fedora | Fedora 是 RedHat 的非企业级版本。该发行版拥有大量的支持者，比 RHEL 更具有领先性，但功能相似。 |

    | Mandrake | Mandrake 是可以找到的完整 Linux 发行版；它面向桌面以及服务器。它比 SLES 和 RHEL 等企业级 Linux
    版本更通用。其桌面程序的完整性令人印象深刻。 |

    | Red Hat Enterprise Linux (RHEL) | RHEL 提供了两个服务器平台：高级服务器 (AS) 和企业服务器 (ES)，以及一个工作站版本
    (WS)。每个与其他都不同，随着版本 WS->ES->AS 的变化，服务器功能减少，其中 AS 的功能最多。Red Hat 的支持非常好。Red Hat 在保持可维护性的同时，提供了所有可能程序的子集。
    |

    | Slack | Slack 仍然存在，且包含的内容与其他任何发行版一样多。虽然它是最古老的 Linux 发行版之一，但它一直拥有一批粉丝。 |

    | SuSE Linux Enterprise Server (SLES) | SLES 主要是一个服务器产品，但也可以作为工作站/桌面产品使用。Novell
    所有 SuSE 并提供卓越的支持。SuSE 还提供其软件的非企业版本，服务器功能比 SLES 少。SuSE 包含的程序比 Red Hat 多得多。 |

    | Turbolinux | Turbolinux 面向集群和计算引擎。 |

    | Ubuntu | Ubuntu 是基于 Debian 的发行版，提供了更简单、更完整的用户界面，并且比任何其他发行版都有更高的本地化程度。 |


    # 安装 WordPerfect


    Linux 版的 WordPerfect 8 已不再提供；然而，你仍然可以在网络上找到副本，并在 http://linux-mafia.com/wpfaq/downloadwp8.html#REGKEYS
    找到公共注册密钥。该特定网站包含了许多在 Linux 上使用 WP8 的极其有用的数据。以下是 RHEL3 的简要安装概述；然而，其他每个 Linux 版本也需要类似的策略。


    1. 在开始之前，我们必须意识到 Linux 版 WP8 是在 Red Hat 5.0 发布左右发布的。此外，没有更新的 Linux 版本可用。因此，我们需要在系统上安装一些旧库来运行
    WP8。可以在 http://www.rpmfind.net 通过搜索 `ld.so` 和 `libc` 找到这些库的 RPM。需要的 RPM 包是 `ld.so-1.9-5.i386.rpm`
    和 `libc-5.3-12.28.i386.rpm`，属于 Red Hat 5.0 更新。这些 RPM 可以在 RHEL3 和 RHEL4 系统上顺利安装，且不会影响新应用程序的运行，因为这些库和工具不会覆盖任何现有的库工具。

    2. 安装库后，我们可以通过首先解压压缩的 tar 文件来继续安装 WP8。

    3. 然后运行脚本 `Runme` 并使用默认值回答问题。在开始时有一个错误，但可以安全地忽略。


    ```

    tar -xzf wp8.tar.gz

    ```


    ```

    [root@ruffian wordperfect]# ./Runme

    ```


    你是否解压并提取了所下载的文件？(y/n) y


    # 正在提取文件...


    请等待 ../install.wp: line 103: [: EL: integer expression expected

    ...

    cat: .wptemp: No such file or directory

    cat: .wplist: No such file or directory

    cat: shared/license.: No such file or directory

    ...


    4. 即使出现上述错误也继续继续，因为忽略它是安全的。对于其他 Linux 版本，错误可能会不同，因为它正在尝试确定你的 Linux 版本。

    5. 接下来，我们需要接受许可并进入安装目录。建议类似于 `/usr/local/wp8` 的路径。

    6. 选择安装目录后，选择安装类型：建议选择“完整安装”（Full Installation）。

    7. 在安装开始之前，安装程序会询问是否希望按照另一个 WP8 安装来配置安装。由于这是第一次，建议选择不输入任何内容直接继续。

    8. 现在该告诉安装程序你是否希望编辑你的 `/etc/magic` 文件，以便工具能够识别 WordPress 8 文件并启动相应的工具对其进行编辑。建议更新
    magic 文件。但是，首先要创建一个备份，以防万一。

    9. 在完成安装设置之前，选择你将使用的语言。在本演示中选择了英语-美国（English-US）。

    10. 安装过程中一个有趣的方面是语言的选择。

    11. 在完成安装设置之前，选择你将使用的语言。在本演示中选择了英语-美国（English-US）。

    12. 检查安装选项。

    13. 运行脚本 `Runme` 并使用默认值回答问题。在开始时有一个错误，但可以安全地忽略。


    1. 运行命令 `ldconfig` 以确保找到 WP8 的库。

    2. 修改 `/usr/i486-linux5/lib` 的权限允许用户访问。


    ```

    chmod 755 /usr/i486-linux5/lib

    ```


    WP8 安装现在已完成。屏幕将显示如图 C.1 所示。


    # 图 C.1

    正在运行 WordPerfect 8。


    ![](img/a06369af5597deead6a1244cc2aa3_217_0.png)


