    虽然这本书试图回答有关将 Linux 作为有效的企业桌面使用的最常见问题，但它绝不是完全的。关于所有桌面，每天都会出现新的挑战和问题，我将继续在 Linux
    领域追求这些问题。如果你想提出问题、提供反馈，甚至在本书的未来版本或与本书相关的网站上展示新的解决方案，请发送电子邮件至 books@astroch.com
    或访问网站 http://www.astroch.com/books.html。我诚诚地承认，其他书籍对许多此处介绍的材料有更详细的涵盖；然而，我们试图只呈现安装产品以满足集成桌面特定需求所需的细节，以及使用成本。


    此外，许多项目在 Linux 中表现出局限性；这些并不一定仅仅是局限性，而是管理员和经理必须询问其网络和桌面将如何被使用的问题。每一章都涵盖了广泛的工具和可能的实施方案，这取决于系统设计人员提出正确的问题并为成功做好计划。提前计划并在事初提出棘手的问题将节省以后的支持和实施成本。为了证明本文提到的工具的可用性，本书是使用这些工具编写的：通过
    CrossOver Office 使用的 Word、StarOffice、OpenOffice，以及在 Palm 手持设备上的 Documents-To-Go，以及其他
    Linux 工具。


    支持成本与桌面的每一次实现都相关。最坏的情况可能是失去分销商的保修支持，这种情况发生在重新编译内核以添加如 IPSec NAT-T 支持等必要功能时。虽然这不是人们希望的，但如果内核被污染，可能会导致这种结果，并且必须提前计划仅使用供应商提供的软件和补丁来调试任何问题。支持成本可能是限制因素；然而，在桌面上使用
    Linux 的人通常可以在 IT 指南的范围内解决他们自己的问题。


    总结这本书是困难的，因为它每天都在更新；然而，我们可以得出几个结论。首先，在许多方面，在桌面上使用 Linux 并不比在桌面上使用 Windows 更复杂。每个系统都有类似的工具，尽管对于目前不支持
    Linux 的支持人员来说存在一个学习曲线。虽然这本书展示了实施、工作以及与其他系统进行互操作的方法，但你将希望标准化你的工具，并应该提前计划哪些工具将成为你
    Linux 桌面面的部分。


