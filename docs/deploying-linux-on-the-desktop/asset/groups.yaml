    # An Investigative Approach


    It took many years of research to discover all the applications outlined in the
    previous chapters. Mainly, once deciding what to research, it took time to find
    all the possible options to solve the problem of how to implement the application
    in question. It many not sound difficult, but there are currently at least 14,000
    possible open-source projects and countless for fee products out there for Linux,
    while only at most 6,000 packages are shipped with any Linux distribution. In
    some cases Linux tools grew to overwhelm for-fee products. For example, Red Hat
    3.0.3 shipped with a fee version of X while now Red Hat ships with an open-source
    version of the software.


    With all these open-source projects, there is quite a bit of research to perform
    for each application, so the big question is where to start. To overcome this
    hindrance and the numerous packages, a process was devised to organize each possible
    solution to the integration problem.


    # 11.1 The Process


    # 11.1.1 Gather Requirements


    As outlined in Chapter 1, review your requirements for the application in question.
    If you know which part of the application is unusaged, is a nice thing to have,
    a not heavily used portion, and is a must have, then you can adequately create
    criteria for gathering information about and judging possible solutions.


    # 11.1.2 Start the Search


    Start your search can be a harrowing experience at times, so start the search
    review of your Linux distribution for packages that may already fit your bill.'
  - '[PAGE 179]


    # ### 1.1.3 Expand the Search


    Visit Web sites for other Linux distributions, since there is a chance that there
    is a pre-built or source package that will work with your distribution. For example
    Fedora Core 3 packages can be used with RHEL4 installations if necessary. Also,
    visit sites such as http://www.freshmeat.net, http://www.sourceforge.net, http://www.rpmfind.net,
    and http://www.google.com/linux. Last, review the magazines Linux World, Linux
    journal, Linux Format, and Info World (there are quite a few other magazines that
    are useful but these are the major ones). Once you have gathered up solutions
    to the application in question, you will want to add to your list the use of Wine
    as an interpreted solution.


    # ### 1.1.4 Test Your Solutions


    Now that you have your requirements and possible solutions, you should install
    and test your solutions to see which best fits your needs; include in this test
    the supportability of the solution, the difficulty to install, and possible using
    precompiled packages that contain the solution. Party locations for packages include
    http://www.rpmfind.net, http://dag.wiwers.com/home-made/apt, http://freshrpms.net,
    http://newrpms.sun-site.dk, http://rpm.phone.net, and http://www.rpmseek.com.


    # ### 1.2 Implement Your Solutions


    Now that a list of possible solutions has been defined and your tests completed,
    we need to implement the solutions. Install into /usr/local if necessary or build
    RPMs for your distribution for easier upgrades.


    # ### 1.3 Sanity Check


    With many options available, you should sanity check your solution for being a
    modern tool with possible maintenance and support; it would not be good if you
    chose a tool that has not been updated in five years! Also be sure to consider
    Wine as an option. At this time, you may want to visit other options as well that
    may have become available since the start of your research.'
