    ## 3.6 Visio


    ![](img/a063699af5597deead6a12a449cc2aa3_44_0.png)


    遗憾的是，Linux 并没有原生的 Visio 文档工具；然而，它确实有一些与 Visio 类似的增强工具，包括 Kivio、DIA (www.gnome.org/projects/dia/)
    和 xfig。Kivio 是 Koffice 的一部分，提供了类似 Visio 的视觉效果和操作体验，而 DIA 则提供了一个支持模板库（stencil）的标准绘图画布。这两者都无法读取
    Visio 文档，因为这些文件采用专有格式。不同的小组正在尝试解码这种格式，但还没有哪个程序能真正取代 Visio。那么，到底还有哪些选择呢？


    ### 3.6.1 CrossOver Office


    CrossOver Office 仿真环境是 Wine 的增强版本，它允许你在 Linux 桌面面上本地运行 Visio。由于这是仿真环境，任何种的插件都可能出现问题。


    ## 3.7 WordPerfect


    Linux 版本的 WordPerfect (WP8) 也可以读取和写 WordPerfect 文档以及许多版本的 Microsoft Word 文档。这是使用
    OpenOffice 或 CrossOver 编辑 Word 文档的另一种替代方案。然而，WP8 是一个较旧的产品，因此无法理解现代 Word 文件格式。Core
    不再提供 Linux 版本的 WP8，所以我们必须从次要渠道中寻找。你可以在 www.linuxmafia.com/wpfaq 找到一个 Linux 版本的
    WP8。


    WP8 不适用于商业环境，并且需要非常旧版本的 Linux 系统才能运行。从本质上说，你需要寻找 CLOS 豪华版 v 1.2 盒装版。再次强调，由于它过时，Linux
    版本的 WP8 可能无法在较新的 Linux 操作系统上运行，而且极其难以。虽然你可以通过放置在独立目录结构中的旧系统库来安装 WP8，但获得这种支持的方法并非易事，详情请见附录
    C。


    ## 3.8 Exchange Server Mail


    可以通过多种方式访问 Exchange Server Mail，即使用 Exchange Server Mail 协议或使用 IMAP。


    最易用的是通过 Web 浏览器访问 Exchange。这种方法的优点是除了 Exchange 服务器本身需要特殊设置外，不需要进行任何特殊配置。任何 Web
    浏览器都可以访问这种机制，你可以通过 Web 界面访问任意数量的信箱。Linux 上最常用的 Web 浏览器是 Mozilla。要以规范的方式使用 Exchange，需要特定的插件，只需对你的
    Exchange 服务器进行必要的设置即可。这将让你获得对邮箱的完全权限，包括所有文件夹；但请记住，电子邮件会占用大量的桌面空间。如果启用了 Exchange
    的 OWA 服务，使用类似下面的链接即可访问电子邮件：


    ```

    http://servername/exchange/e-mail.address

    ```


    其中 `servername` 是你的 Exchange 服务器名称，`e-mailaddress` 是你的邮箱地址。


    或者，你也可以通过 IMAP 访问电子邮件。IMAP 限制了你访问你的 Exchange 邮件。在 Linux 上，流行的 IMAP 邮件客户端包括 Evolution,
    Thunderbird, PINE, ELM 等。为了配置，你需要指定你的 Exchange 服务器地址或服务器名称。此外，还有两种特殊的客户端，Ximian
    Evolution 允许你访问 Exchange。设置 Ximian Evolution Connector 可能会有点棘手，以下是你应该采取的步骤：


    ### 3.8.1 红帽企业版 Linux (RHEL3)


    - 更新 evolution，因为 Evolution 是默认安装的一部分。


    - 现在已经安装了 Evolution 和 Connector，你可以使用 Evolution 账户器添加账户。当你首次启动 Evolution 时，会看到图
    3.10 所示屏幕。然后点击继续。


    - 你将通过一系列屏幕并输入相应的内容，直到到达图 3.11，并在列表中选择 Microsoft Exchange。


    - 系统要求你输入 Exchange 服务器的信息，包括你的 Windows 用户名，如图 3.12。该用户名可以包含格式为 `域名\用户名`。请注意，反斜杠
    `\` 非常重要，而不是正斜杠 `/`。


    - 接下来，系统要求你输入用于全局地址表的全局目录名称，如图 3.13。这些信息可以从你的 Exchange 管理员处获得。


    - 配置完成后，你必须重启 Evolution 使器更改生效。启用文件夹视图，你的 Exchange 账户将可见。展开此账户会提示你输入密码，输入后即可通过
    Evolution Connector 访问 Exchange 邮件。


