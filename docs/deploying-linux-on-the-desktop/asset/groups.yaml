    (img/a063699af5597deeada12a449cc2aa3_38.png)


    图 3.4 Excel 和公式的另一个对比。

    (img/a063699af5597deeada12a449cc2aa3_39.png)


    ## 3.2.3 CrossOver Office


    CrossOver Office 允许你直接在 Linux 桌面上运行 Excel。优点是巨大的；唯一的缺点是某些 Excel 插件无法工作。底层的 Wine
    系统（用于模拟 Windows 机器）没有 100% 的 Windows 实现，因此某些未经测试的插件导致程序崩溃。


    ## 3.3 PowerPoint


    PowerPoint 文件与 Word 和 Excel 文件一样，可以使用类似的工具进行编辑。


    ## 3.3.1 OpenOffice


    OpenOffice 的 impress 工具用于编辑和查看 PowerPoint 文件。复杂和简单的文件都可以轻松地编辑和查看。显示上有时会出现问题，有时
    Linux 字体会超出页面框，尽管在 Windows 机器上不会超出。然而，链接视频并不是 OpenOffice 的一部分。


    ## 3.3.2 StarOffice


    StarOffice 可以轻松查看和编辑 PowerPoint 文件。然而，它存在与 OpenOffice 相同的格式错误。图 3.6 显示了它们之间非常细微的区别。这种差异展示了可能发生的格式。注意右下角的名称“Grant”在
    PowerPoint 和 OpenOffice 是不同的。


    ## 3.3.3 CrossOver Office


    CrossOver Office 允许你直接在 Linux 桌面上运行 PowerPoint。优点是巨大的；唯一的缺点是某些插件无法工作。底层的 Wine
    系统（用于模拟 Windows 机器）没有 100% 的 Windows 实现，因此某些未经测试的插件导致程序崩溃。


