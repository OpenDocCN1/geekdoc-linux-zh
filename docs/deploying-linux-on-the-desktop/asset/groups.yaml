    ## Deploying Linux on the Desktop


    ## Edward L. Haletky


    "Mr. Haletky leverages his extensive experience with Linux/Unix to present a picture
    of the options for moving from a Windows Desktop to a Linux Desktop that is both
    wide and deep. This book will help you evaluate honestly whether Linux will work
    for your desktop"


    —Christopher Sweeney, Pleasant Crab Consuming


    ### Key Features:


    - Reviews real world requirements

    - Covers Pure LINUX, and Hybrid Corporate Desktops

    - Covers Enabling Tools such as CrossOver Office and the use of Windows Native
    programs on LINUX

    - Reveals Interoperability Concerns

    - Implements a solid Corporate Desktop

    - Reviews the complete costs of Implementing LINUX as a desktop"


    "Ed''s book is a great tool for anyone with some Linux experience who is trying
    to implement a Desktop with functionality similar to Microsoft Windows. Beyond
    just a hobbyist interest—if I was asked to implement Linux on my desktop at work"


    —Pat Lampert, HP Services


    Deploying LINUX on the Desktop gives an Administrator and their Management the
    tools necessary to implement and understand the implementation of a Corporate
    Desktop using LINUX. This book covers the detail required by an Administrator
    including any interoperability concerns, and the real world costs of implementation
    for the IT decision makers. While other materials cover a pure LINUX environment,
    Jumpstart looks at real world requirements and implementations with the goal of
    creating a solid, supportable Linux desktop.


    Additional information includes updates to Deploying LINUX... can be found at
    http://www.astsearch.com/~elh/books.html. Please email Edward@astsearch.com with
    comments, questions, or even to update the book material.summary.biz.


    Edward L. Haletky graduated from Purdue University in 1988 with a degree in Aeronautical
    and Astronomical Engineering. Since then, he has worked in programming graphics
    and other low-level libraries on various LINUX platforms. He currently works for
    Hewlett-Packard in the High Performance Computing Expert, dealing with Tru64 and
    Linux clustering technologies, as well as general Linux and VMware environments.
    Edward has also published articles about Interoperability, clustering, and security
    issues for Linux.


    Audience: Systems and Network Administrators


