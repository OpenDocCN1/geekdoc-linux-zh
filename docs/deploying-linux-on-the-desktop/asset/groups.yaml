    ## 3.2.3 CrossOver Office


    CrossOver Office allows you to run Excel directly on your Linux desktop. The advantages
    are great; the only drawback is that some of the Excel plug-ins will not work.
    The underlying Wine system (used to emulate a Windows machine) does not have a
    100-percent Windows implementation, so some of these untested plug-ins could crash
    the program.


    ## 3.3 PowerPoint


    PowerPoint files, as with Word and Excel files, can be edited using similar tools.


