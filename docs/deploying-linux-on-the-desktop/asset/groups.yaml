    # Training Tools


    There is a wide range of tools that people use on the corporate desktop for online
    training. The most basic tool would be the Web browser, with all the Plug-ins
    available while the more complex tool will be a proprietary set of programs and
    CD-ROMs. This chapter will review both sets of tools with the idea of running
    training on the Linux desktop.


    Since there is an awful lot of training material available, we cannot cover it
    all within a single chapter, we will subset this to more of the training-enabling
    tools and those programs available for training someone to take the Cisco Certified
    Network Administrator (CCNA) exam.


    Training-enabling tools could be standalone tools such as NetMeeting, media players,
    and specialized plug-ins for Web browsers. Since most training tools are designed
    to run on Microsoft Windows, finding those that work under Linux is difficult.
    Some companies, such as Mindleaders, Inc. (http://www.mindleaders.com), have tools
    for just about all operating systems available, while other companies target Windows.
    In this chapter, we will be looking at this extremely small list of computer/Web-based
    training tools:


    +   WebEx (http://www.webex.com)

    NetMeeting (http://www.microsoft.com/netmeeting)

    LiveMeeting (http://www.microsoft.com/livemeeting)

    CCNA Complete (http://www.cisco.com)

    Cisco CCNA Network Simulator (http://www.cisco.com)

    Sybex CCNAGold virtual router software (http://www.sybex.com)'
