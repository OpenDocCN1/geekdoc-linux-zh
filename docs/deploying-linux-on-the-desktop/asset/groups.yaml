- md: "\n## 6.2 Video Conferencing\n\nFigure 6.3 Miao interface.\n\n![](img/a063699af5597deead6a12a449cc2aa3_117_0.png)\n\
    \nThere are a few methods for video conferencing while using Linux: unfortunately,\
    \ they do not interoperate very well. The first is Gnome Meeting, and the second\
    \ is Microsoft’s NetMeeting via CrossOver Office. Other tools are available to\
    \ provide pictures or videos to users, but these are generally peer-to-peer tools\
    \ and do not provide true video-conferencing capability. The OpenH323 Project\
    \ (http://www.openh323.org) is an excellent place to start researching video conferencing.\n\
    \n### 6.2.1 GnomeMeeting\n\nGnomeMeeting is a great tool that mimics the abilities\
    \ of NetMeeting, yet shares none of its most useful protocols. Work is being done\
    \ to achieve these protocols, but they have yet to be realized. Use of GnomeMeeting\
    \ is therefore limited to video sharing with NetMeeting; there is no chat, application,\
    \ or whiteboard sharing (T.120 Protocol). However, whiteboard and chat sharing\
    \ are available for Linux-to-Linux hosts. To show video, you will need a camera\
    \ that uses Video4Linux drivers, which includes many Creative and Philips cameras,\
    \ as well as a few Logitech cameras. A host of information is available at http://www.gnomemeeting.org.\
    \ Also, the site http://www.exploits.org/v4l/ hosts a list of working drivers\
    \ for Video4Linux-supported cameras. Some webcam support for Linux is disappearing\
    \ while others are appearing.\n\n# Figure 6.4\nGnomeMeeting\n\n![](img/a063699af5597deead6a12a449cc2aa3_118_0.png)\n\
    \nAs with any Open Source project, review the available list of supported hardware\
    \ before purchasing.\n\nThose people familiar with NetMeeting will find using\
    \ GnomeMeeting just as comfortable. GnomeMeeting also has support for Voice over\
    \ IP via MicroTelco Internet Telephone services (http://www.microtelco.com).\n\
    \nGnomeMeeting is installed as part of most modern versions of Linux and will\
    \ look like Figure 6.4.\n\n# RHEL\nup2date gnomeemeeting\n\n### 6.2.2 NetMeeting\n\
