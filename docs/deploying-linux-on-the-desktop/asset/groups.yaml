    ## 2.3 How Do I Connect Using SSH Tunneling


    What about SSH? Does the secure shell provide a method to tunnel? The answer is
    yes, but outside of Linux and modern Macintosh computers I have not seen it in
    wide use. However, before you use SSH tunneling, you must have a valid connection
    to a network, and this is where other VPN solutions may come into play. One advantage
    of SSH is that any network connection can be used to start up the tunneling. Once
    again, you will need root access, so the sudo command is invaluable. We will not
    delve into SSH, as there are other resources available for this technology.


    ## 2.4 Wireless and Other Network Devices


    The complexities of modern wireless devices deserve a mention. Many of the slower
    wireless devices work out of the box on Linux. These devices are following the
    Wireless-B standards. However, the modern Wireless-G devices (except for Prism-based
    Wireless-G devices) need help from an open source project, and note that the Prism
    drivers project (/ndiswrapper-sourceforge.net) will load a Microsoft NT Ndis driver
    into a Linux kernel so that modern Wireless-G devices will work. The NT Ndis driver
    will read the Windows-based wireless device copied to the Linux system from its
    Media and use this to control the device. This helps the road warriors. As an
    example, we have a recipe for configuring a LinkSys Wireless-G PCI PCMCIA device:


    ```

    # tar -xzf ndiswrapper-0.9.tar.gz

    # cd ndiswrapper-0.9

    # make install

    # mkdir /usr/local/linksys.WMP54G (PCI)

    copy the driver files bcmwl15.* to /usr/local/linksys.WMP54G

    from the CDROM

    - OR -

    # mkdir /usr/local/linksys.WPC54G (PCIA)

    copy the driver files bcmwl15.* to /usr/local/linksys.WPC54G

    from the CDROM

    ```


    ```

    # ndiswrapper -l # check for any existing drivers

    # ndiswrapper -i /usr/local/linksys.WPC54G/bcmwl15.inf # install driver

    # ndiswrapper -l # check to see if installed

    # edit modules.conf to set add alias wlan0 ndiswrapper

    ```


    Configure WLAN0


    Once your WLAN0 device is configured using one of the aforementioned configuration
    tools, you can use the Wireless-G device quite easily. There is also DriverLoader,
    a third-party product from Linux (www.linuxant.com). DriverLoader is very similar
    to NdisWrapper and costs $19.95.


    Both NdisWrapper and DriverLoader use the drivers provided by the wireless device
    in use so you will need the device media when installing these tools.


    Also, some ethernet devices must have new drivers built to gain access to all
    their full features. One of such devices is from Broadcom. While the standard
    rg3 driver works, it has no facility to apply options to the driver to control
    the speed, duplex, and so forth. Hence, you may need to recompile the BCM5700
    driver to handle these options. You can easily fix this driver and the NdisWrapper
    driver into DKMS so that you do not need to recompile either driver by hand when
    security and other updates to kernels occur. While the following steps work for
    RHEL5, they work equally with the versions of Linux you have tested.


    ## 2.4.1 BCM5700 Driver via DKMS


    We are working with Broadcom 5700 (BCM5700) driver v7.1.9e. I used the following
    procedure to add this into DKMS as root. While there may be an easier way, this
    method works well and allows for the building of the appropriate BCM5700 driver
    that will give me GigE speeds, as necessary.


    ```

    # mkdir /usr/src/kernel_bcm5700-7.1.9e

    # cd /usr/src/kernel_bcm5700-7.1.9e

    # tar -xzf bcm5700-7.1.9e.tgz

    ```


    Create a file named dkms.conf with the following contents:

    ```

    PACKAGE_VERSION="7.1.9e"


    # Items below here should not have to change with each driver

    PACKAGE_NAME="kernel_bcm5700"

    BUILT_MODULE_NAME[0]="bcm5700"

    DEST_MODULE_LOCATION[0]="/kernel/drivers/net/"

    AUTOINSTALL="yes"

    REMAKE_INITRD="no"


    # These are used for 2.4 kernels only

    MAKE[0]="make all"

    CLEAN="make clean"

    ```


    Run the following commands:


    ```

    # dkms add -m kernel_bcm5700 -v 7.1.9e

    # service dkms_autoinstall start

    ```


    ## 2.4.2 NdisWrapper via DKMS


    NdisWrapper can also be added into the DKMS framework quite easily. Actually,
    it is easier than that the BCM5700 driver discussed previously, as no special
    build script is necessary. These brief instructions will do all you need. DKMS
    requires that the install module path start with /kernel, so you will need to
    change the Makefile according to the following instructions.


    ```

    # mkdir /usr/src/kernel_ndiswrapper

    # cd /usr/src/kernel_ndiswrapper

    # tar -xzf ndiswrapper-0.9.tar.gz

    # mv ndiswrapper-0.9/* ./ ; rmdir ndiswrapper

    Driver/Makefile to change Install path from ''misc'' to

    ''kernel/drivers/net''.

    ```


    Create a file named dkms.conf with the following contents:

    ```

    PACKAGE_VERSION="0.9"


    # Items below here should not have to change with each driver

    version

    PACKAGE_NAME="kernel_ndiswrapper"

    BUILT_MODULE_NAME[0]="ndiswrapper"

    BUILT_MODULE_LOCATION[0]="driver"

    DEST_MODULE_LOCATION[0]="kernel/drivers/net/"

    AUTOINSTALL="yes"

    REMAKE_INITRD="no"


    # These are used for 2.4 kernels only

    MAKE[0]="make all"

    CLEAN="make clean"

    ```


    Then run the following commands:


    ```

    # dkms add -m kernel_ndiswrapper -v 0.9

    # service dkms_autoinstaller

    ```


    ## 2.5 The Cost


    Are there any hidden costs to using Linux as a VPN platform? There are dollar
    costs as well as support costs associated with using these tools. The dollar costs
    are related to the purchase of hardware and the necessary software to implement
    VPN. Since modern VPN clients may also require biometric dongles or cards, their
    costs are no different than any other system. The software costs be very different
    between systems however. If you are using generic tools then there are minimal
    costs unless VMware is to be used.


    Table 2.1 shows the costs involved.


