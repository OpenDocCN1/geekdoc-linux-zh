    # 终端仿真器与服务器客户端


    你可能需要访问命令行 shell，或运行在其他系统上的遗留终端终端应用程序。为了实现这一点，你需要一个字符单元格终端客户端。在许多情况下，这种访问会带来独特的挑战，例如使用正确的键盘布局或终端仿真模式。你可能只需要使用来自
    Windows 服务器的终端服务器客户端将图形化窗口显示回你的机器。


    ## 7.1 我如何访问基于遗留的大型机程序？


    要访问遗留大型机程序，你需要一个能够与大型机通信的终端仿真器。目前有许多可用的工具。我们将介绍两个大型机系统及其相应的客户端。


    首先是 IBM 大型机客户端。它将与基于 IBM MVS 的大型机进行交互，并提供所有必要的功能，包括根据需要为 PC 风格键盘提供功能键映射。市上有大量的
    tn3270 客户端可用，我们提到的是这类工具，而不是具体的程序。tn3270 客户端有一个共同点，那就是它们的交互方式就像一个 3270 终端一样。虽然你可能仍然能找到
    3270 物理终端，但 tn3270 类的仿真器更为流行，而且很难选择哪一个比另一个更好，因此我们不会介绍具体的仿真器。它们都有一些共同点，包括一种在不需要修改任何其他系统的情况下输入
    3270 终端特殊按键的方法。虽然 tn3270 仿真器不需要任何其他软件来更改键位，但其他终端程序确实有此要求。


    在处理键盘和 XFree86 时，至关重要的概念是代表键盘上每个按键的键映射（keyboard map）。虽然键盘有一个键映射，但键映射（键盘）的每个单独键都有一个键帽（keycap）定义。通过修改键帽，我们可以修改键映射报告键盘按键的方式。`xmodmap`
    程序将读取带有其定义键帽的键映射文件，并修改运行系统的键映射。


    对于基于 Digital (HP) VMS 的系统，你需要一个 VT400 终端仿真器。这里有多个 VT400 终端仿真器，其中最方便的一个已经是所有发行版的一部分。那个工具就是
    `xterm`。


    ### 7.1.1 RHEL


    ```

    up2date xterm

    ```


    虽然 `xterm` 比较老旧，但使用 `-sb` 参数可以将数字小键盘置于应用程序模式而非系统模式，并扩展键映射以处理到 20 个功能键，这是 VT400
    终端仿真器所要求的。


    如果你的键盘不支持 20 个功能键且这些按键是必要的，你将需要 `xmodmap` 或 XKeyCaps (http://www.jwz.org/keycaps/)
    图形客户端来映射这些按键，它将写出一个 `xmodmap` 可读的文件，在更改键映射时运行的任何其他应用程序都会影响 `xterm` 以及 openoffice
    和任何未来的应用程序。这**不是**本地化的更改。例如，你可以使用 `xmodmap/XKeyCaps` 通过使用 XKeyCaps 创建的键映射将 ctrl-F10
    映射为 F13。首先我们需要构建 XKeyCaps，因为使用该工具来操纵 `xmodmap` 文件要容易得多。


    ### 7.1.2 编译 XKeyCaps


    ```

    # tar -xzf keycaps-2.4.tar.gz

    # cd keycaps-2.4

    # make

    # make install

    ```


    ### 7.1.3 运行 XKeyCaps


    ```

    # xkeycaps

    ```


    从列表中选择你的键盘，由于代码较旧，请选择最接近的匹配，右键点击按键弹出菜单并选择 Edit（编辑）。“Edit Key”对话框如图 7.1 (img/a06369af5597deead612a49ccaa3_126.png)
    所示。与相关修饰符相关的 Keysym，在这种情况下，按下控制键后修饰符将 Control。对于 F3，选择一个字符集，然后对所有合适的按键执行 Repeat（重复）。图
    7.2 显示了编辑 F13 键定义的对话框。图 7.3 显示了显示输出的消息框。从命令行或启动脚本的一部分运行 `xmodmap -n` 来调用键盘更改。（img/a06369af5597deead612a49ccaa3_127.png）


    | 代码的 Keysym | 修饰符 | 字符集 | Keysym |

    |---|---|---|---|

    | Keysym 1: F13 | Shift | Latin1 | F10 |

    | Keysym 2: F13 | Ctrl+Shift+Alt | Latin2 | F11 |

    | Keysym 3: F13 | Control | Latin3 | F12 |

    | Keysym 4: NoSymbol | | Latin4 | F13 |

    | Keysym 5: NoSymbol | mod2 | Arabic | F14 |

    | Keysym 6: NoSymbol | mod3 | Greek | F15 |

    | Keysym 7: NoSymbol | Cyrillic | F16 |

    | Keysym 8: NoSymbol | mod5 | Technical | F17 |


    AutoRepeat: Yes


    虽然 XKeyCaps 并不是一个美的应用程序，但它可以将键盘重映射到你需要的或想要的任何内容。你对键映射的这种全局更改将影响所有在图形模式下运行的程序。


    ### 7.1.4 应用程序本地化键映射更改


    `xterm` 存在一种应用程序本地化方法，可以使用其键映射和翻译仅在 `xterm` 内部重映射按键。`xterm` 将一组物理按键按下翻译为另一个按键序列在文本流中的输入。一个为你执行映射的脚本允许创建一个新命令
    `vmstream`，以便使用正确的键映射连接到 VMS 机器，而不影响任何其他程序。这种方法是首选的，并在 `xterm` FAQ (http://dickey.com/xterm/xterm.faq.html)
    中充分讨论，那里还列出了与以下不同的脚本。然而，你应该注意某些相似之处，因为执行此过程的方法只有几种。此脚本将映射表 7.1 所示的按键。（img/a06369af5597deead612a49ccaa3_127_1.png）


