    # 10.4.2 Sybex CCNAGold Virtual Router Lab Software


    Due to limitations in Wine''s handling of encrypted filesystems, the only method
    available to use this training tool is via VMware; even though the installation
    works, the data is inaccessible.


    # 10.4.3 Cisco CCNA Network Simulator


    The Cisco CCNA Network Simulator is an invaluable tool for learning about the
    Cisco product line, with the ability to simulate complex networks. Because of
    this, we should see if it runs on Linux. Actually, since it''s a Windows program,
    we want to determine if we require VMware to run this program or we use Wine,
    which is not as expensive.


    First, install the Cisco CCNA Network Simulator using Wine''s installation tool.
    Once you do that, you will also need to do the following:


    ```

    cp -rp /mnt/cdrom/program/files/Cisco\ CCNA\ Network\

    Simulator/-\.cxoffice/Program\ Files

    ```


    Edit the file ~/.cxoffice/config and add the following lines to the end before
    the # [wineconf] marker.


    ```

    [AppDefaults]=\Boson_NetSim.exe\x1lldrdv

    "Desktop" = "800x600"

    "Managed" = "Y"

    ```


    ![](img/a063699af5597deead6a12a449cc2aa3_174_0.png)'
