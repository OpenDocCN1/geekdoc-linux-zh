    \n### 添加到菜单\n\n```\n# cd /usr/share/applications\n# cp net-Xpdf.desktop net-acroread.desktop\n\
    Edit net-acroread.desktop 并将 Name= 和 Exec= 行更改为：\n  Name=Adobe Acrobat\n  Exec=acroread\n\
    然后保存文件\n```\n\n### 添加到 Nautilus\n\n只要 acroread 在你的路径（path）中，Nautilus 就可以使用它来打开本地\
    \ PDF 内容。不过，你需要编辑文件类型（Red Fedora -> 偏好设置 [Preferences] -> 文件类型和程序）以将其设置为默认查看器。\n\
    \n### 如何将 Acrobat 添加到 KDE？\n\n与集成到 GNOME 一样，集成到 K 桌面环境（KDE）需要对随随后的 KDE 系统及其 Konqueror\
    \ 文件夹查看器和浏览器进行两个阶段的设置。如果是通过 Red Hat 网络更新安装的，则可以跳过以下步骤，但验证所有配置均正确总是好的。\n\n### 添加到菜单\n\
    \n右键点击 Red Fedora-> 菜单编辑器 [Menu Editor]，在左侧菜单中选择文档 [Documentation]，按下新建项目 [New\
    \ Item]。当新建项目菜单出现时，输入 Acrobat 并按确定。Acrobat 条目将出现在左侧文档下方，右侧是此菜单项使用的命令条目。在输入框中输入\
    \ /usr/local/bin/acroread，然后点击应用 [Apply]，并选择文件->退出 [File->Quit]。在选择文件->退出之前，编辑\
    \ K 菜单窗口应该看起来如图 4.4。\n\n### 添加到 Konqueror\n\n要将 Acrobat 添加到 Konqueror，首先通过 Red\
    \ Fedora（开始)->主菜单启动 Konqueror。接下来，在 Konqueror 内部使用 >配置 Konqueror [Configure Konqueror]\
    \ 启动设置，并从左窗口选择文件关联 [File Associations]。在中间的已知窗口类型中，展开应用程序并选择 pdf。完成后，点击添加... [Add...]\
    \ 按钮，在第一个输入框中输入 /usr/local/bin/acroread 并点击确定。\n\n![](img/a063699af5597deead6a12a449cc2aa3_65_0.png)\n\
    \n最后，选择 acroread，并使用向上 [Move Up] 按钮将 acroread 移动到列表顶部，然后点击应用，最后点击确定退出设置窗口。在点击应用之前，你的窗口应该看起来如图\
