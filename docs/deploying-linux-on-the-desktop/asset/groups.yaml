    ## How Can I Use native WebEx on Linux


    There is no native WebEx client for Linux; however, when using Internet Explorer
    via CrossOver Office, you can download and successfully use the WebEx client and
    Player. Access to WebEx is extremely simple. Proceed to the http://www.webex.com
    Web site and download the client per the Web pages from an Internet Explorer window
    within Wine.


    While WebEx can be used as a playback tool, it also has a method to provide direct
    access to live feeds, much like NetMeeting can.


    You will need to first sign into WebEx in order to use the tool (Figure 10.1).


    ![](img/a063699af5597deead6a12a449cc2aa3_169_0.png)


    Once you sign in client, you will be presented with a dialog to download and run
    the WebEx client (Figure 10.2).


    And, finally, your WebEx player will run so that the presentation will display
    and allow you to control over the media (Figure 10.3).


    Without Wine, WebEx is not usable. With Wine, the player works just as you would
    expect and provides the necessary tool to enable a meeting or view a course.


    ## 10.1 How Can I Use WebEx on Linux?


    Figure 10.2

    Installing WebEx Client.


    ![](img/a063699af5597deead6a12a449cc2aa3_170_0.png)


    Figure 10.3

    Running WebEx Client.


    ![](img/a063699af5597deead6a12a449cc2aa3_170_1.png)


    Chapter 10


    ## 10.2 How Can I Use NetMeeting for Training on Linux?


    NetMeeting usage is discussed in Chapter 6, so will not be covered in depth here
    except to state for application sharing, NetMeeting on Linux can receive Windows
    but cannot host any sharing. However, all the other functions are available. The
    use of sound via the network is not always a viable option and a phone is still
    useful to have around. It should be reiterated that GnomeMeeting is not a viable
    option for application or whiteboard sharing, since the T.120 protocol necessary
    to make this work is not part of GnomeMeeting.


    ## 10.3 How Can I Use LiveMeeting for Training on Linux?


    LiveMeeting was originally from PlaceWare, but is now from Microsoft and provides
    functionality similar to WebEx. LiveMeeting claims it can work with any browser.
    For playback, however when using Mozilla or Firefox, LiveMeeting displays static
    windows and must go to a blank page to listen to any sound, so always open sound
    into a new window. The use of Internet Explorer enables ActiveX components necessary
    for the dynamic features of the tool. In addition, LiveMeeting will present data
    to be replayed in RealPlayer, MediaPlayer, and WAV formats. In addition, it will
    use static Web pages as well as Flash and ActiveX aspects of a Web browser to
    display its content.


    Linux-based browsers there is RealPlayer, mplayer, xine, and Flash plug-ins to
    handle each of the contents, but those based on ActiveX can be displayed using
    Internet Explorer via Wine. In order to use xine to display the MediaPlayer, x-ms-wmx,
    mime type, we will need to add the following to /etc/pluggerrc-5.1.3:


    ```

    video/x-ms-wmx: Windows Media

    exits nokill: xine -pq "$file" 2>/dev/null 1>/dev/null

    ```


    However, xine is not a part of the base install; it is available at http://xinehq.de/
    and is installed via the standard download and build mechanisms for the following:


    ```

    tar -xzf xine-lib-1.0.tar.gz

    cd xine-lib

    ```


    ## 10.4 How Does One Take Computer-Based CCNA Training?


    ```

    ./configure

    make

    make install

    cd ..

    tar -xzf xine-ui-0.99.3.tar.gz

    cd xine-ui

    ./configure

    make

    make install

    ```


    Cisco Certified Network Associate (CCNA) Training is provided by many methods
    including, computer based methods (CBT). Of the computer based methods we have
    reviewed, there are three tools for use with Linux. While none of them has Linux
    alternatives, some of them are available via Wine, and others only via tools such
    as VMware.


    All CBT methods work in VMware, while some work under Wine.


    ### 10.4.1 CCNA Complete V1.0


    While CCNA Complete does not run on Linux, it will run under CodeWeavers Wine.
    In order to get this to happen you must first copy the file C:\Windows\WINHLP32.EXE
    from a Windows 98 or Windows 2000 (Windows XP may also work; however, I have not
    tried this) machine to <location of your Wine Bottle>/Windows directory and ensure
    the permissions are set to everyone, as follows:


    ```

    cp WINHLP32.EXE -~/cxoffice/dotwine/fake_windows/Windows

    chmod 755 -./cxoffice/dotwine/fake_windows/Windows/

    WINHLP32.EXE

    ```


    As long as there is a winhl32.exe executable in the proper location, everything
    will work as you would expect. The Wine install tools, and you can then select
    from the Red Fedora Menu for the CCNA Complete Course Navigator (Figure 10.4).


    When running the program, the Begin Reading button will launch the winhlp32.exe
    application with its reading material (Figure 10.5).


    ## Figure 10.4 CCNA Complete Course Navigator.


    ![](img/a063699af5597deead6a12a449cc2aa3_173_0.png)


    ## Figure 10.5 CCNA Complete Reading Assignment.


    ![](img/a063699af5597deead6a12a449cc2aa3_173_1.png)


    In addition to the reading material, the tests and study cards (Figure 10.6) also
    work as expected.


    With one slight change it is now possible to use CCNA Complete on your Linux desktop
    via an interpreter.


    ### 10.4.2 Sybex CCNAGold Virtual Router Lab Software


    Due to limitations in Wine, the only method to use this is VMware.


    ### 10.4.3 Cisco CCNA Simulator


    The CCNA Simulator is invaluable for learning. Because of this, we need to set
    the following:


    ```

    AppDefaults

    Desktop = 800x600

    Managed = Y

    ```


    ![](img/a063699af5597deead6a12a449cc2aa3_174_0.png)


    Once the simulator starts, it will want to register with ciscopress. Once this
    happens, you can see the lab environment (Figure 10.7) as well as the actual courses
    (Figure 10.8). The last bit of warning is that the CBT will warn you that telnet
    is not available as a part of Wine.


    ## Figure 10.7 CCNA Network Simulator Login.


    ![](img/a063699af5597deead6a12a449cc2aa3_175_0.png)


    Another gotcha is that the mouse will not always select the lab to run, but once
    you click into the column with the list of labs the mouse keys will traverse to
    each lab, the enter key will start the lab, and the mouse will work perfectly
    into the lab or reading.


    ## Figure 10.8 CCNA Network Simulator Navigator.


    ![](img/a063699af5597deead6a12a449cc2aa3_176_0.png)


    ## 10.5 The Cost


    As can be seen, there are not many Linux-only options for training. There are
    a few and it''s a growing list, but there is nothing in the mainstream yet. However,
    that is not the end of everything, because using inexpensive tools such as CrossOver
    Office can bring CBT and other training tools to the desktop.


    ## 10.6 Support


    Training tools, under Cross Office, are not necessarily supported by CodeWeaver
    or the tool vendor, so using these training tools could be a risk. However, the
    Wine open source community is very active and can answer your questions. With
    a little investigation into wine and how to solve its problems, many of the issues
    faced can easily be solved with those tools not dependent upon .NET. Any .NET
    tool in Wine will fail, since it is not yet supported.

    '
