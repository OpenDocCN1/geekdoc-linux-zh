    ## 家庭工具


    本章将讨论在家庭桌面常用的工具，但在公司桌面也能找到。我们将展示将 Palm 或手持设备连接到桌面的解决方案，并讨论同步 PDA 数据的机制。具体而言，我们将查看照片和文档的数字同步解决方案。


    ## 我的 PDA 与 Linux 同步吗？


    如果你有桌面支持和客户端，同步 Palm OS 设备到 Linux 非常简单。大多数并非所有这些工具都可以直接从每个发行版获取；然而，有几个子集将解决这个问题。需要注意的是，较新的
    Palm 设备可能需要修改内核模块才能正常工作（此修改通常是对源目录中的文件）。参考 http://www.palm.org 获取内核模块的更新。至少需要以下程序来同步
    Palm 设备：


    ### 8.1.1 RHEL


    ```

    up2date palmlink

    up2date gnome-evolution

    ```


    Palmink 提供了同步 Palm 设备的基本工具，而其他工具为系统增加了功能，包括自动同步、日历和地址。有了所有工具，同步 Palm 设备到 Linux
    变得非常直观。然而，找到正确的端口并不总是简单的，有一些通用规则：第一是 Palm 设备使用 /dev/ttyUSB0 且并不总是准确，对于 Sony 设备，它们可能是反的。还需要注意
    USB 端口并不对应物理设备。


    ### 8.1.2 为你的 Palm 寻找正确的端口


    dpsh 命令允许你打印关于 Palm 设备的信息。这些信息可以用于验证连接性，并提供一个获取 palm 上存储文件的方便命令界面。当设备要求你按 HotSync
    按钮时，如果你选择了正确的设备，就会连接。由于我正在同步 Palm Tungsten 设备，我选择使用 /dev/ttyUSB1，并在 HotSync 后连接成功。有时在运行
    dpsh 之前需要按 HotSync。尝试两种方法，并使用 `df` 命令从 Palm 设备读取数据并验证其准确性。涉及的设备将是 /dev/ttyS0 或
    /dev/ttyS1，取决于 Palm 插入了哪个设备。


    ```

    dpsh -p /dev/ttyUSB1

    正在监听端口: /dev/ttyUSB1

    现在按 HotSync 按钮...


    欢迎来到 DLP Shell

    输入 ''help'' 获取更多信息


    ```

    dpsh> df

    文件系统      k-blocks     已用      可用      总计

    Card0:ROM       16515072            n/a 16515072      n/a 16128k

    Card0:RAM       66060288    39241776 26813112     59% 64512k

    总计 (ROM + RAM) 82753660    55762248              n/a n/a 806409k

    ```


    ![](img/a063699af5597deead6a12a449cc2aa3_138_0.png)


    现在知道了 Palm 端口（例如 /dev/ttyUSB1），我们用它配置自动同步工具 gnome-pilot。选择 Fedora->Preferences->More
    Preferences->PalmOS Devices 来启动 gnome-pilot 程序 (gpilot-control-applet) 以启动 gnome-pilot
    配置工具（图 8.1）。


    然后按 Forward 选择适用于 Palm 的 USB 端口（图 8.2）。确保选择 /dev/ttyUSB1，或者如果你只想将此 Palm 设备同步到你的系统，可以创建一个指向
    /dev/palm 的符号链接来简化问题。


    ```

    ln -s /dev/ttyUSB1 /dev/palm

    ```


    一旦选定了正确的端口、速度和 USB，继续点击 Forward。当出现关于此 Palm 设备是否已同步到此机器的选择时（图 8.3），选择 Yes 然后点击
    Forward。


    现在是时候执行第一次 HotSync 了，以便 gnome-pilot 软件可以从 Palm 设备检索用户名和 Palm ID。如果出现此对话框，我总是选择
    Yes。只有在 Palm 设备从未用用户名初始化过，或者从未与任何其他 HotSync 软件同步过时，才会选择 No。HotSync 对话框如图 7.4 所示。


    由于某种原因 Palm 设备未同步，请验证所用端口的权限。在这种情况下，/dev/ttyUSB1 的权限为 rw-rw---- (ls -al /dev/ttyUSB1)，所有者为
    root.uucp。


