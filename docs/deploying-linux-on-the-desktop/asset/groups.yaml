    ## 调查方法


    花费了多年的研究才发现了前几章中列出的所有应用程序。主要是，一旦决定了要研究什么，就需要时间来找到解决如何实现相关应用程序的所有可能选项。这听起来并不难，但目前
    Linux 至少有 14,000 个可能的开源项目和无数的付费产品，而任何 Linux 发行版最多只附带 6,000 个软件包。在某些情况下，Linux 工具的增长已经超过了付费产品。例如，Red
    Hat 3.0.3 带有一个付费版本的 X，而现在 Red Hat 发送的是该软件的开源版本。


    有了这些开源项目，每个应用程序都需要进行大量的研究，因此大问题在于从哪里开始。为了克服这一障碍和大量的软件包，我们设计了一个流程来组织解决集成问题的各种可能的解决方案。


    ## 11.1 流程


    ### 11.1.1 收集需求


    如第 1 节所述，回顾你对相关应用程序的需求。如果你知道应用程序的哪些部分是不使用的、是可选的、是使用频率较低的以及是必须的，那么你就可以创建适当标准，用于收集信息和判断可能的解决方案。


    ### 11.1.2 开始搜索


    开始搜索有时是一段痛苦的经历，因此请从查看你的 Linux 发行版开始，寻找可能符合你要求的软件包。


    ### 11.1.3 扩展搜索


    访问其他 Linux 发行版的网站，因为可能存在预构建或源码包可以与你的发行版兼容。例如，如有必要，Fedora Core 3 软件包可以用于 RHEL4
    安装。此外，访问诸如 http://www.freshmeat.net、http://www.sourceforge.net、http://www.rpmfind.net
    和 http://www.google.com/linux 等站点。最后，回顾 *Linux World*、*Linux journal*、*Linux Format*
    和 *Info World* 杂志（还有其他非常有用的杂志，但这些是主要的）。一旦你收集了相关应用程序的解决方案，你将希望把 Wine 作为一种解释性解决方案加入到你的列表中。


    ### 11.1.4 测试你的解决方案


    现在你已经有了需求和可能的解决方案，你应该安装并测试这些解决方案，以查看哪一个最符合你的需求；测试中应包括解决方案的支持性、安装难度，以及可能使用包含解决方案的预编译包。软件包的来源包括
    http://www.rpmfind.net、http://dag.wiwers.com/home-made/apt、http://freshrpms.net、http://newrpms.sun-site.dk、http://rpm.phone.net
    和 http://www.rpmseek.com。


    ### 1.2 实现你的解决方案


    现在已经定义了可能的解决方案列表并完成了测试，我们需要实施这些解决方案。如有必要安装到 `/usr/local`，或者为你的发行版构建 RPM 以于升级。


    ### 1.3 健全性检查


    有了许多可用选项，你应该对你的解决方案进行健全性检查，确保其具有现代维护和支持；如果你选择了一个五年没有更新的工具，那将不妙！此外，一定要考虑 Wine 作为一个选项。此时，你可能还想查看自你研究开始以来可能出现的其他选项。


    ## 11.4 与开源社区合作


    如果你在开源项目中看到应该修复的内容或 bug（错误），请查阅该项目的邮件列表，看看它之前是否被发现过以及是否有解决方案；否则，提交 bug 报告以便社区进行修复。例如
    gphoto 软件包。我需要一个适用于 Canon EOS 20D 的版本，而当前版本无法工作。这已经在该项目的邮件列表中讨论过，并在源码池中修复了，但尚未发布版本。


    ## 11.5 保持同步或持续更新


    在某些情况下，解决方案可能不包含你需要的一切，因此你需要不断关注这些软件包的更新，或寻找可以起到相同作用的新软件包。例如：


    - 随着 Fedora Core 3 的出现，有了填充相同角色的新软件包。

    - 经常需要 RHEL4 的事实软件包。

    - Canon EOS 20D 需要 gphoto2 v2.16，因此我使用 http://www.gphoto.org 的 CVS（并发版本系统）存储库中的最新源码作为起点，直到正式发布版本。诚然，从源码开始可能很困难，但它时时是必要的。gimp-gtkam
    插件无法正常构建或安装。

    - gimp-perl——为了显示字体文件，xdotpnm 软件包需要 gimp-perl。遗憾的是，RHEL4 还没有 gimp-perl。我将不得不直接从
    CPAN (http://www.cpan.org) 安装，或者尝试 Fedora Core 3 的版本。


    '
