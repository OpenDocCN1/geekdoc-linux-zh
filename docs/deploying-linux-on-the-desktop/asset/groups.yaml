    # How Do I Access NFS File Systems?


    NFS shares are the mainstream of network file sharing on Linux. Authentication
    is not a concern for these file systems, since the authentication model is at
    the system level and not at the user level. User access is governed by the standard
    Linux permissions. Mounts using NFS require mount points and root access to perform
    any mounts. If users need access to perform mounts, the sudo command, an alternative
    for logging into root that logs all rootbased actions, can be used to perform
    the following mount command:


    ```

