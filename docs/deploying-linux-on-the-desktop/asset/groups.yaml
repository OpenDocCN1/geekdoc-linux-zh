    # 致谢


    我要感谢我的妻子 Romy 以及我的家人在本书写作期间提供的持续支持。Romy 通过尽量减少“家务清单”并鼓励我继续写下去，为我撰写这本书留出了充足的时间。Romy
    还捐赠了她的博士论文，作为对 Linux 许多可用文档工具的最佳测试：书中包含了她的作品。感谢你，Romy；我深表你的支持。


    此外，我要感谢我的朋友 Chris 和 Pat 在这些章节从文字处理器初稿后为我检查技术错误，并用他们富有见解的问题和建议让我保持警觉。非常感谢！此外，我还要感谢
    Pat 提供了关于 iPAQ 的章节内容；他拥有一台这样的设备，而我只有一台 Palm 设备。


    最后，我要感谢我的朋友、同事和家人的支持与鼓励。


    这本书不仅仅是一个起点，它是我构建可用的 Linux 企业桌面环境的配方，其意义远超了迁移到 Linux，而是进入了“集成”的概念。本书致力于应对将 Linux
    集成到企业环境的挑战，同时最大限度地降低学习曲线且不损失功能。本书介绍了构建集成环境所需的工具，以及在桌面使用 Linux 所产生的成本和支持考虑。书中还包含了我组装笔记本电脑的个人方案（见第
    13 章）。


    # 关于本书


    本书涵盖了红帽企业 Linux (Red Hat Enterprise Linux) 3 和 4、SUSE 企业 Linux (Enterprise) 9
    以及 Mandrake Linux，提供了必要的工具，让读者能够在以微软为中心的网络环境中使用 Linux。对于创建集成的 Linux 企业桌面来说，这是一份无价参考资料！


    电子邮箱：books@astroarch.com


    网站：http://www.astroarch.com/~elh/books


    # 要求


    看看桌面电脑的世界，你会看到无数解决方案，从 Windows 98 及其他版本到各种类型的 Macintosh 电脑，再到作为新兴明星的 Linux。虽然我们知道
    Windows 和 Macintosh 是竞争对手，而且有越来越多的眼睛正在研究 Linux 作为解决 IT 成本上升的方案。尽管如此，许多人仍不愿或尚未准备好尝试并使用这个开源操作系统。因此，需要更多信息，需要一种触手可及的资源，既能解决在非以
    Linux 为中心的桌面世界中使用 Linux 的固有问题，又能为 IT 经理和那些清晰了解 Linux 基础的系统管理员提供信息来源。


    有必要根据桌面用户的需求来描述本书的完整范围。这些需求将决定本书后续每个章节要回答的问题，并源于两个基础问题：


    1. Linux 已经准备好作为桌面投入使用了吗？

    2. Linux 已经准备好作为企业桌面了吗？


    这两个问题的简单答案都是肯定的。Linux 已经准备好了，但情况比这要复杂得多。让我们来看两个不同的场景，并尝试完善我们的答案。


    第一种场景是使用 Linux 替代所有现有机器，从文件服务器到桌面：这是一个同质化的 Linux 解决方案，不会与任何其他类型的系统交互。第二种场景是一个异构解决方案，其中
    Linux 可以充当桌面、服务器等。虽然首种场景是许多 Linux 开发者的梦想，但第二种场景是一个更诚实的世界观。


    场景一是一个响亮的肯定。在企业环境中，一切运行都符合预期。


    场景二是一个带掌声的（尴尬的）肯定。一切都能运行，但它需要更多的混合模式桌面，即使用 Linux 作为操作系统，并可能使用 Wine 和 VMware 等工具来完成互操作性需求。


    在牢记场景二的情况下，我们应该将 Linux 视为一种赋能工具，它拥有一些原生应用，以及使用可能没有 Linux 等效应用的非原生应用的工具。每一章都从这个世界观来看桌面，并回答管理员面临的问题，即必须解决维护一个成功交互的异构环境的问题，并确定管理员能为做决策的
    IT 经理带来的成本和效益。


    虽然本书可以被视为一份常见问题解答 (FAQ) 列表、一套操作文档集，或者一份强力工具或黑科技列表，但我将回答 IT 经理的问题：“在企业桌面使用 Linux
    的成本是什么？”以及系统管理员的问题：“在企业桌面上实施 Linux 涉及哪些内容？”为了得出这些信息，我们必须首先访问企业桌面的需求。


    需求列表取自我在企业环境常用桌面——笔记本电脑上的经验，这台笔记本电脑必须被所有描述的用户类型能够使用。我们处理此列表是为了满足三种不同用户类型的需求：


    1. 远程办公者——设置家庭办公室桌面的工具和需求

    2. 企业办公室用户——在企业办公室或隔位间设置高效 Linux 桌面的工具和需求

    3. 奔波战士——在笔记本电脑上设置实用 Linux 环境的工具和需求


    需求根据工具的分类对这些环境进行了划分。需求的顺序（以及章节的顺序）引导读者从连接基础到更深奥的桌面工具的最后润色。需要注意的是，我们的需求列表使用了大线条的笔触；你的环境可能不需要书中讨论的所有工具，并可能需要这里未讨论的其他工具。


