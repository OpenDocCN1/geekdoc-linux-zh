    # My Recipe


    The preceding chapters and following appendices outline many new features and
    aspects of Linux that enable us to answer the question: Will Linux work as a corporate
    desktop? Furthermore, we have progressed through a series of discussions based
    around the concept of integration with no migration to Linux. In other words,
    the philosophy of this book is:


    Linux can be integrated into an existing networked environment of mixed computing
    machines and operating systems in such a way that there is a seamless use of necessary
    applications.


    For RedHat Enterprise Linux 4, I used the following recipe on my own machine.


    # 13.1 Ingredients


    +   - Network Access

    - RHEL4WS Media CD-ROMs/DVD-ROM

    - RHEL4WS Extras CD-ROM

    - Knowledge of Linux build and configure tools


    # 13.2 Steps


    +   1. Install RHEL4WS, ensuring that the development environment is also installed.
    Install using Software Raid across two like hard disks.'
