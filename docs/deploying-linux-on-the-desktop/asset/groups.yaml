    ![](img/a063699af5597deead6a12a449cc2aa3_133_0.png)


    Terminal server clients offer interesting licensing concerns, when using rdesktop,
    for example, you will still need a Terminal Server license for the client to be
    able to connect, the same holds true for the Citrix Metaframe client. With Citrix,
    this is in addition to the Citrix Metaframe license. On Windows, use of Citrix
    does not require the additional Terminal Server license however. Use of these
    tools could be slightly more expensive than other options.


