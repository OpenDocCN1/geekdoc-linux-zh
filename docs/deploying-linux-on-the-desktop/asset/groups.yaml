    ## 11.6 Process Implementation


    Let us now take an example application and see how it fits into the outlined process.


    ### 11.6.1 How Can I create Architectural Views on Linux?


    The best-known architectural drawing programs may not be available for Linux (i.e.,
    AutoCAD) but there are many others. When we follow our process, we are first going
    to look at requirements and then move on to solutions.


    #### Requirements


    -   - Integrate with AutoCAD—that is, read, and export DXF files

    -   Be easy to use

    -   Preferably open-source

    -   Provide a good library of standard shapes and shapes

    -   Plane view is required (2D flat view as if looking at a blueprint)

    -   3D view would be nice


    #### Start the search


    RHEL4 provides the following graphics programs:


    -   - Gimp (more a Photoshop equivalent)

    -   Run the following commands on distribution:


    -   * apropos draw

    -   apropos graphics

    -   apropos drafting

    -   apropos architect

    -   apropos figures

    -   apropos cad


    -   * Xfig is a simple figure drawing program


    ### 11.6.2 Expand the Search


    Since RHEL4''s distribution did not leave us much information, we need to progress
    outward. We should check the Fedora Core 3 Web site for possible matches, since
    it''s the closest thing to RHEL4. However, that will not lead to many possibilities
    we have already found. Time to hit the Web sites. First, we try the repositories:


    -   * The ATrpms repository contains Skencil, which is similar to xfig. Still
    not very useful, so we can expand further and search http://www.google.com/linux
    for “CAD Programs” and get an immediate hit for Linux Gazette (http://www.linuxgazette.com/issue54/frost.html),
    which is a reputable site for Linux information. Since it''s dated in 2000, it
    is a bit old. However, the packages mentioned are interest-


    -   * Qcad

    -   CAM Expert

    -   SISCAD-P

    -   ME10

    -   CADDA

    -   Varicad

    -   Microstation

    -   Varimetrix


    -   * A better link may be http://www.linuxlinks.com/Software/Graphics/CAD/index.html,
    which lists many more possible solutions to the problem, including many commercial
    programs such as Pro/Engineer.


    -   Now that we have a good list of possible solutions to the question, we need
    to review each one to fit the requirements; since we desire opensource solutions
    it removes any commercial product from the list. Then we need to go through what
    is left and find one that is recently updated and has an active community. One
    such is Qcad. While


    freeCAD looks promising, there is no mention of DXF import/export in the brief
    documentation.


    ### 11.6.3 Implement Your Solution


    Qcad (http://www.ribbonsoft.com/qcad.html) comes in two flavors. One is the free
    community-supported source code and the other is a small fee-supported version
    of the software. Checking out the limitations on operating systems shows that
    it may not run on RHEL4.


    Verify that QT is installed on the system using:


    ```

    rpm -q qt-devel

    ```


    Then verify that qmake is available:


    ```

    qmake -v

    ```


    Then unpack the source and build:


    ```

    tar -xzf qcad-2.0.4.0-1.src.tar.gz

    cd qcad-2.0.4.0-1.src

    cd scripts

    ./build_qcad.sh

    ```


    Now execute:


    ```

    cd ../qcad

    ./qcad

    ```


    Installation into /opt/qcad or /usr/local is achieved by copying the qcad directory
    to the directory by hand and then pointing the configuration to the new directory.


    Once we have the program running, save and open dialogs show that it will read
    and write various forms of DXF files, which meets our requirements. In addition,
    my test DXF file reads in just time. So this becomes a successful tool for 2D
    drafting with no bells and whistles. There is, in addition, a large parts library
    accessible off the download page for Qcad, which meets another one of our requirements.
    Qcad deals primarily with basic shapes, it is relatively easy to use.


    Supportability is the next concern. Since the code is open-source you can purchase
    a prebuilt release for a minor support fee of roughly $28 to receive one year
    of support.


    ### 11.6.4 Sanity Check


    As a sanity check, we should review whether there are any other options available.
    There are many options available but none the same abilities as Qcad, which is
    a modern project with a viable community and a company that will offer support
    for a small fee. In addition, while you can try to get AutoCAD to work under Wine,
    there is no good success story at this time. Another option is Visio via Wine,
    but that is also not a drafting tool and will not return or write DXF files.


    ### 11.6.5 Work with the Open-Source Community


    Since Qcad is an ongoing open-source project, you can send e-mail to the mailing
    lists and monitor them for fixes to various bugs. While not a very chatty qcad
    list, it has some extremely good information. The mailing list location is documented
    on the home page for Qcad (as it is with many projects).


    ### 11.6.6 Stay in Sync or Keep up-to-date


    Bookmark the Web site for Qcad and check it for updates. Since this is not part
    of a repository of projects, you will need to do this by hand and check every
    so—perhaps only when new patches come out for your Linux Distribution. I have
    been using Qcad for several releases so have monitoring this for updates.


    We have now successfully solved the problem. The solution is to use Qcad and the
    question was: How can I create architectural views on Linux? must-have requirement
    met while the nice-to-have requirement was not. Qcad is not a 3D modeling engine,
    that would be a different search criterion. While AutoCAD Architectural would
    be extremely nice to have to get the full 3D view, a simple plane view gives a
    builder or contractor the necessary information to create exactly what is required.


    ## 11.7 Conclusion


    While following this process will find answers to your questions it is by no means
    the only method you can use; however, it is the one followed for the

