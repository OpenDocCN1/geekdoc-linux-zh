  - '[PAGE 208]


    # Installation of CrossOver Office


    CrossOver Office is easy to install, and there are two methods by which it can
    be installed: system-wide and user mode. System-wide installation is useful if
    everyone who logs into the system will use the exact same programs. It is also
    very useful from a maintenance and control perspective.


    CrossOver Office is installed via RPM on most systems.


    ```

    rpm -ivh crossover-pro-4.0.1.i386.rpm

    ```


    CrossOver Office provides its own graphical interface for installing Windows programs
    into its Wine implementation. For example, here is a simple installation of mIRC.


    Launch the tool by selecting Red Fedora->CrossOver Tools->Office Setup to bring
    up the installation tool (Figure A.1)


    ![](img/a063699af5597deead6a12a449cc2aa3_208_0.png)'
  - '[PAGE 209]


    Clicking the Install... button will bring the installation screen up (Figure A.2).


    ![](img/a063699af5597deead6a12a449cc2aa3_209_0.png)


    Check the Install unsupported software box and click Next >> (Figure A.3).


    ![](img/a063699af5597deead6a12a449cc2aa3_209_1.png)


    Now, specify the full path to the installation executable for the mIRC program
    (Figure A.4).'
  - '[PAGE 210]


    # Figure A.4

    CrossOver Office installation tool: specifying installation path executable for
    mIRC.


    ![](img/a063699af5597deead6a12a449cc2aa3_210_0.png)


    Unsupported software

    To install an application into the CrossOver environment, CrossOver runs the name
    self-extracting setup application that would be used to install under Windows

    nYou must first download or acquire the setup program for the application you
    wish to install. If the application offers you a choice, always use the window
    98 or Windows 95 version

    Select product location

    CD-ROM/Remidrom

    Alternate CD-ROM location

    Other file Home/setup/application/crossovermurc16 exe

    Windows version for this application. Use Default


    The standard mIRC settings will appear while the CrossOver Office Setup dialog
    waits for a clean installation of the program (Figure A.5).


    # Figure A.5

    CrossOver Office installation tool: installing unsupported software.


    ![](img/a063699af5597deead6a12a449cc2aa3_210_1.png)


    Unsupported software

    Installing unsupported software


    Once the installation is complete, CrossOver Office will bring the Setup dialog
    back to the first screen, showing the newly installed program.'
- md: '

    # Linux Distributions


    There are a myriad of Linux distributions from which to choose for your desktop.
    Some are specifically designed as a desktop, and others have differing versions
    of the same base product that support a desktop. The following chart contains
    a rundown of the various Linux distributions and what makes each one unique. This
    is only a short list of the most common distributions covered in the book. However,
    there are a huge number of Linux distributions to meet various needs. These are
    fully documented at http://www.linux.org/dist/index.html.


    | Distribution | Comments |

    | --- | --- |

    | Debian | Debian is a great open source of Linux that has nearly everything.
    However, its base install is still geared toward a single CD-ROM install, with
    all extra packages available from the Web |

    | Fedora | Fedora is the non-enterprise track for RedHat. This distribution has
    a large following and is much more cutting edge than RHEL but with similar functionality
    |

    | Mandrake | Mandrake is a full Linux distribution as can be found; it is geared
    toward the desktop as well as the server. It is more generic than the enterprise
    Linux versions of SLES and RHEL. The desktop programs are impressive in their
    completeness |

    | Red Hat Enterprise Linux (RHEL) | RHEL provides two server platforms, Advanced
    Server (AS) and Enterprise Server (ES), as well as a workstation version (WS).
    Each is different from the others and less server functionality with the version
    changes WS->ES->AS, where AS has the most functionality. Red Hat support is excellent.
    Red Hat provides a subset of all the possible programs while maintaining supportability.
    |

    | Slack | Slack is still around and contains as much as any other distribution.
    While it is one of the oldest distributions of Linux, it has maintained a following.
    |

    | SuSE Linux Enterprise Server (SLES) | SLES is mostly a server product, but it
    can work as a workstation/desktop product as well. Novell owns SuSE and provides
    excellent support. SuSE also offers a nonenterprise version of its software with
    less server functionality than SLES. SuSE contains many more programs than Red
    Hat |

    | Turbolinux | Turbolinux is geared toward clusters and computational engines.
    |

    | Ubuntu | Ubuntu, a Debian distribution, provides a simpler and complete user
    interface with a larger amount of internalization than any other distribution.
    |


    # Installing WordPerfect


    WordPerfect 8 for Linux is no longer available; however, you can still find a
    copy out on the network as well as public registrations keys at http://linux-mafia.com/wpfaq/downloadwp8.html#REGKEYS.
    This particular Web site is full of extremely useful data for using WP8 on Linux.
    What follows is a nutshell installation overview for RHEL3; however, each of the
    other versions of Linux needs a similar strategy.


    1. Before beginning, we must realize that WP8 for Linux was released around the
    time when Red Hat 5.0 was out. Also, there is no later Linux version available.
    So we will need some older libraries installed on the system to run WP8. The RPMs
    for these libraries can be found at http://www.rpmfind.net by searching for ld.so
    and libc. The RPMs required are ld.so-1.9-5.i386.rpm and libc-5.3-12.28.i386.rpm
    and are part of the Red Hat 5.0 Update series of RPMs. These RPMs will install
    just fine on a RHEL3 and RHEL4 system and will not affect the running of new applications,
    since these libraries and tools do not overwrite any existing library tools.

    2. After the installation of the libraries, we can continue with the install of
    WP8 by first unpacking the compressed tar file.

    3. Then run the script Runme and answer the questions with the defaults for your
    answers. There is an error early on but this can be ignored safely.


    ```

    tar -xzf wp8.tar.gz

    ```


    ```

    [root@ruffian wordperfect]# ./Runme

    ```


    Did you unzip and untar the files you downloaded? (y/n) y


    # Extracting Files...


    Please Wait ../install.wp: line 103: [: EL: integer expression expected

    ...

    cat: .wptemp: No such file or directory

    cat: .wplist: No such file or directory

    cat: shared/license.: No such file or directory

    ...


    4. Continue on even with the above error, since it is safe to ignore. For other
    versions of Linux the error could be different, since it is trying to determine
    your version of Linux.

    5. Next, we need to accept the license and then enter the installation directory.
    Something similar to /usr/local/wp8 is suggested.

    6. After the installation directory is selected, choose the type of installation:
    it is recommended that Full Installation be chosen.

    7. Before the installation starts, the installer will ask if you wish to pattern
    the install after another installation of WP8. Since this is the first time, it
    is suggested you select to continue without entering anything.

    8. Now comes the time to tell the installer if you desire to edit your /etc/magic
    file so that tools will automatically recognize WordPress 8 files and launch the
    appropriate tool to edit them. It is recommended that you update the magic file.
    However, it is first to make a copy, just in case.

    9. Before you complete the installation setup, select the language you will be.
    Using this demonstration English-US was chosen.

    10. An interesting aspect of the installation is the selection of the language.

    11. Before you complete the installation setup, select the language you will be.
    Using this demonstration English-US was chosen.

    12. Review the installation options.

    13. Run the script Runme and answer the questions with the defaults for your answers.
    There is an error early on but this can be ignored safely.


    1. Run the command ldconfig to ensure the libraries for WP8 are found.

    2. Change the permissions on /usr/i486-linux5/lib to allow users access.


    ```

    chmod 755 /usr/i486-linux5/lib

    ```


    The installation of WP8 is now completed. The screen shown in Figure C.1 will
    appear.


    # Figure C.1

    Running WordPerfect 8.


    ![](img/a06369af5597deead6a1244cc2aa3_217_0.png)

