    menu or panel. OpenOffice is highly recommended as a way to manipulate Excel files
    on Linux, and is very good. However, as with the Word Document editor for OpenOffice,
    there are also issues with vocalc. These issues resolve Excel''s interpretation
    of formulas in files saved using OpenOffice (see Figures 3.3 and 3.4).


