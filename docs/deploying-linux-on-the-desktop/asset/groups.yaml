    # 2.3 How Do I Connect Using SSH Tunneling


    What about SSH? Does the secure shell provide a method to tunnel? The answer is
    yes, but outside of Linux and modern Macintosh computers I have not seen it in
    wide use. However, before you use SSH tunneling, you must have a valid connection
    to a network, and this is where other VPN solutions may come into play. One advantage
    of SSH is that any network connection can be used to start up the tunneling. Once
    again, you will need root access, so the sudo command is invaluable. We will not
    delve into SSH, as there are other resources available for this technology.


    # 2.4 Wireless and Other Network Devices


    The complexities of modern wireless devices deserve a mention. Many of the slower
    wireless devices work out of the box on Linux. These devices are following the
    Wireless-B standards. However, the modern Wireless-G devices (except for Prism-based
    Wireless-G devices) need help from an open source project, and note that the Prism
