    # 7.1 How Do I Access-based Mainframe Programs?


    Of critical importance when dealing with keyboards and XFree86 the concept of
    a keyboard map that represents each key on the keyboard. While there is a keymap
    for the keyboard, there is a keycap definition for individual key of the keymap
    (keyboard). By modifying keycaps, we can modify the way the keymap reports the
    press of keys on the keyboard. The program xmodmap will read a keymap file with
    its defined keycaps and modify the keymap of the running system.


    For Digital (HP) VMS-based systems, you will need a VT400 terminal emulator. There
    are several VT400 terminal emulators, with the most convenient one already a part
    of all distributions. That tool is xterm.


    # 7.1.1 RHEL


    ```

    up2date xterm

    ```


    While old-fashioned, xterm (using the -sb) will place the numeric keypad into
    application mode rather than system mode and extend the keyboard map to handle
    function keys through 20, which is required by a VT400 terminal emulator.


    If your keyboard does not support 20 function keys and these keys are necessary,
    you will need to map these keys using xmodmap or the XKeyCaps (http://www.jwz.org/keycaps/)
    graphical client, which will write out a file readable by xmodmap and any other
    application running at the time of the keyboard map change will affect xterm as
    well as openoffice and any other application and any future application. This
    is NOT a localized change. For example, you can use xmodmap/XKeyCaps to map ctrl-F10
    to be F13 using a keymap created using XKeyCaps. First, we need to build XKeyCaps,
    as it is much easier to manipulate xmodmap files using this tool.


    # 7.1.2 Building XKeyCaps


    ```

    # tar -xzf xkeycaps-2.46.tar.z

    # cd xkeycaps-2.46

    # xkmf

    # make

    # make install

    ```


    # 7.1.3 Running XKeyCaps


    ```

    # xkeycaps

    ```'
