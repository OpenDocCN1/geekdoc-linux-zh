    它是 OpenOffice 的无缝替代品。由于它是免费的，你可以通过产品开发者获得技术支持。StarOffice 使用命令行调用。StarOffice 在处理页面格式方面存在与
    OpenOffice 类似的问题。我建议先对文档进行测试，因为页码问题和不同字体（Linux 与 Windows）的差异会改变文档的外观。


    ## 3.1.3 CrossOver Office


    CrossOver Office 允许用户在系统中安装版本的 Microsoft Word， 并在原生 Linux 工具中使用它。虽然在大多数情况下这会减少对独立工具的需求，但许多
    Word 插件可能无法安装或运行，因为底层的 Wine 系统（用于模拟 Windows 机器）仍在开发中（尽管它是一个稳定版本）。在拼写检查方面，你可能需要确保安装了多种语言，因为拼写检查器经常由于某种原因向我请求意大利语。也许这是我写作的术性使然。


    ## 3.1.4 AbiWord


    我们也应该提到 AbiWord。它是一个非常好的编辑器，可以读取某些 Word 格式，但在尝试互操作时，它无法保存为可用的 Word 文档格式，这非常局限性且令人沮丧。


    ## 3.2 Excel


    Microsoft Excel 是准备和共享电子表格广泛使用的格式之一。Linux 有许多工具可以读取和编辑电子表格文件。以下是一些常用工具的短列表。就像编辑
    Word 文档一样，有很多工具可以编辑 Excel 文件。


    ## 3.2.1 OpenOffice


    OpenOffice Excel 编辑器通过命令、系统菜单或面板调用。非常推荐使用 OpenOffice 作为在 Linux 上操作 Excel 文件的方法，它非常好。然而，与
    OpenOffice 的 Word 文档编辑器一样，也存在一些问题。这些问题会导致 Excel 对使用 OpenOffice 保存的文件中的公式解析偏差（参见图
    3.3 和 3.4）。


    ## 3.2.2 StarOffice


    StarOffice 是 OpenOffice 的免费版本，它采取了不同的开发路径，但行为方式相似。不同的开发路径并没有很大改变行为；StarOffice
    在图表和图解放置方面存在相同的问题，以及 Excel 显示来自 StarOffice 的公式单元格时也存在问题。（应该注意的是，尽管保存的单元格公式 =(B60)*2
    在 Excel 中没有正常显示，它在 OpenOffice 和 StarOffice 中显示正常。）


