    # 8.4 Is There a Microsoft Money or Quicken Equivalent?


    There are several Microsoft Money or Quicken equivalents; however, none of them
    will edit the Microsoft Money or Quicken databases directly. You can, however,
    export to the appropriate file format, and Linux-based tools such as GnuCash (http://www.gnucash.com),
    MyMoney, and others will read the file formats. It may be better to completely
    switch to one or the other; however, this may not be possible if your account
    or tax software will not work with a proper Money or Quicken database. In this
    case, Cross-Over Office may be your solution of choice. I use GnuCash to manage
    my accounts and do not need to worry about tax software or an accountant, as the
    reports are sufficient for those needs.


    GnuCash will track stock portfolios, as well as various bank accounts and assets
    and expenses. This tool may not be as pretty as the commercial tools, but it will
    work to track your accounts and provide accurate data. GnuCash is difficult to
    install if it is not native with your version of Linux, because you may need packages
    that do not exist in a future revision of the OS.


