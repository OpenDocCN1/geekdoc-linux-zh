    # How do I add Acrobat into Evolution?


    As long as acroread is in your PATH, Evolution can use this program to open and
    view PDF documents. If the viewer is not in your PATH, the Open in Adobe Acrobat...
    viewer option will not appear.


    # 4.1.3 How Do I View VRML Web content?


    Virtual Reality Modeling Language (VRML) is used to display 3D graphic objects
    within a Web browser. Unlike the other plug-ins, one installs very differently
    and has some specific requirements to work; it is not a straightforward installation
    of a prebuilt RPM or package, but the compilation of a plug-in from source. To
    view VRML content:'
  - '[PAGE 66]


    # 4.1 Plug-ins


    ![](img/a063699af5597deead6a12a449cc2aa3_66_0.png)


    +   - Java must be installed, and the Java bin directory must be in your PATH
    (if you install the JRE and JDK that are part of the releases mentioned previously,
    you will have everything you need).

    - gcc must be installed.

    - Perl must be installed.

    - The basic Linux development environment must be installed.


    While gcc, Perl, and the development environments are available from your operating
    system CD-ROMs, Java should be installed as described previously or as your Java
    distribution describes. In the building script, we have used IBM Java, which is
    provided on the RHEL3.0 CDROM. However, any Java will work, and the PATH setting
    needs to be modified accordingly.


    # Building VRML


    ```

    Script started on Sat 24 Apr 2004 11:18:00 AM EDT

    [plugins]$ PATH=/opt/IBMJava2-141/bin:${PATH}

    [plugins]$ export PATH

    ```'
