    # How Do I Make Image Files from a CD-ROM?


    Making an image of a CD-ROM is extremely straightforward in command syntax, but
    not when finishing the image. To make the CD-ROM image, use:


    ```

    dd if=/dev/cdrom=<image file>

    ```


    or


    ```

    readcd dev=/dev/cdrom f=<image file>

    ```


    However, some CD-ROM devices have problems trying to find the end of the device,
    and a subsequent read failure must occur before you physically eject the CD-ROM,
    which could make the system appear to hang until the CD-ROM is ejected. Granted,
    this has only been experienced using a DVD drive on older kernels.


    # How Do I Create a CD-ROM?


    This depends on the type of device you want to be able to read the resulting CD-ROM.
    The base command is cdrecord, and it has many options. However, creating a disk
    is a three-step process.


    +   - Place all the files that you would like to burn to disk into one directory.

    - Use the mkisofs command to create an ISO image of that directory.

    - Use cdrecord to record the resulting ISO image to the CD-ROM device.


    | Format | Type | cdrecord Options |

    | --- | --- | --- |

    | ISO9660 | iso9660 | -J -R |

    | Multisession | udd/iso9660 | -multi |

    | Macintosh | hfs | -hfs |

    | UNIX | ufs/ext2 | None, use cdrecord directly on the device |'
