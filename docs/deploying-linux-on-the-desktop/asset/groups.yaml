    \ | smf | |\n| chemical/x-pdb | Protein Data Bank file | pdb | molecule (xscreen-saver)\
    \ |\n| model/x-pdb | Protein Data Bank file | pdb | |\n\n## Table 4.2 Content\
    \ Types and Players Used to View/Listen to Them (continued)\n\n| MIME Type | Description\
    \ | Suffixes | Program |\n|---|---|---||-|\n| model/vrml | Virtual Reality Modeling\
    \ Language | vrl, vrml | vrweb |\n| model/x-vrml | Virtual Reality Modeling Language\
    \ | vrl | |\n| world/vrml | Virtual Reality Modeling Language | vrl, vrml | |\n\
    | world/x-vrml | Virtual Reality Modeling Language | vrl | |\n| x-world/vrml |\
    \ Virtual Reality Modeling Language | vrl, vrml | |\n| x-world/vrml | Virtual\
    \ Reality Modeling Language | vrl | |\n| application/x-troff | MAN pages | man\
    \ | nroff |\n\nSome small changes need to be made to the /etc/plugerrc-5.0 configuration\
    \ file for some of the MIME types to work. Video/MPEG requires the following change;\
    \ it may be slow to load, because the removal of the -cache option will affect\
    \ performance, but it will not abort prematurely. Make these lines:\n\n```\nmplayer\
    \ -quiet -xy -size -hexwindow -cache 1000 -vop -autoq 99 -joystick -nfs -oslevel\
    \ 1 \"$url\" >dev/null\n```\n\nLook like:\n\n```\nmplayer -quiet -xy -size -hexwindow\
    \ -vop -autoq 99 -joystick -nfs -oslevel 1 \"$url\" >dev/null\n```\n\nIn addition,\
    \ you may need to install more files to get get the complete functionality of\
    \ plugerrc. This truly depends on your package. At the least you will need:\n\n\
    - TiMidity++ to play sounds. However, the TiMidity comes with RHEL3 as part of\
    \ the kdemultimedia-3.1.3-1.rpm and therefore will only work if the audio server\
    \ is running.\n- Xanim to play au files. This package leaves a lot to be desired,\
    \ since it has not been modified in years. Since it is only necessary to use Xanim\
    \ to play .au files, it is best to use an alternative. If you use GNOME, you can\
    \ use esplay; if you use KDE, you can use artsplay to play these sounds. Since\
    \ the use of a desktop is personal, we have to write a script to make the use\
    \ of esplay or artsplay transparent. However, if the RPM is installed, then this\
    \ is not needed since the play command is available. To do this, create a file\
    \ named play in /usr/local/bin:\n\n```bash\n#!/bin/sh\nif [ \"$XDESSESSION\" =\
    \ \"GNOME\" ]; then\n  esplay *\nelif [ \"$XDESSESSION\" = \"KDE\" ]; then\n \
    \ artsplay *\nelse\n  echo \"Unknown session\"\nfi\n```\n\nThen modify the /etc/plugerrc-5.0\
    \ file so that the audio/x-basic MIME type looks similar to the following:\n\n\
    ```\naudio/x-basic: au,snd: Basic audio file\ncontrols: play \"$file\"\ncontrols:\
    \ sndplay \"$file\"\nloop: xanim +a100 -W +q +f \"$file\"\n```\n\nThis is also\
    \ an advantageous thing to do for wav files, since the existing tools leave a\
    \ lot to be desired; mplayer falls short in the playing of wav files.\n\n- MikMod\
    \ to play Soundtracker audio files. This is a part of the mikmod-3.1.6-20.rpm\
    \ package, which is part of RHEL3 installation media.\n- sidplay to play Commodore\
    \ 64 audio files. sidplay can be found at www.geocities.com/SiliconValleyLakes/5147/sidplay.\
    \ While there are two versions, you will need to build only sidplay: do not use\
    \ the sidplay2 release, since it does not work. The first step is to build the\
    \ libraries, and to build the player:\n\n```bash\n# tar -xzf libsidplay-1.36.59.tgz\n\
    # cd libsidplay-1.36.59\n# ./configure; make; make install\n# cd ..\n# tar -xzf\
    \ sidplay-base-1.0.9.tar.gz\n# cd sidplay-base-1.0.9\n# ./configure; make; make\
    \ install\n```\n\n## 4.1.12 How Do I View Microsoft Office Documents?\n\nThere\
    \ are three primary Microsoft Office documents to be viewed via Web browser: Excel,\
    \ PowerPoint, and Word. While these documents are common to Microsoft Office,\
    \ they are not always common to a Linux desktop. What you can see depends mostly\
    \ on which features are required by the files you are viewing. In some cases,\
    \ you may see something slightly different from what you expect. For example,\
    \ graphs in Excel are not always where you expect them to be, and page breaks\
    \ in Word can be unique, depending on the tool used. There are five possible tools\
    \ to view these documents:\n"
