    # 4.1.12 How Do I View Microsoft Office Documents?


    There are three primary Microsoft Office documents to be viewed via

    Web browser: Excel, PowerPoint, and Word. While these documents are

    common to Microsoft Office, they are not always common to a Linux

    desktop. What you can see depends mostly on which features are required

    by the files you are viewing. In some cases, you may see something slightly

    different from what you expect. For example, graphs in Excel are not

    always where you expect them to be, and page breaks in Word can be

    uniquue, depending on the tool used. There are five possible tools to view

    these documents:'
- md: '

    ## OpenOffice


    This option is installed automatically when you install Plugger (section 4.1.7).
    However, you should launch the OpenOffice tools outside the browser to agree to
    the license terms and configure the tools. Once you do this, the tools are available
    for use within Mozilla with no major issues. However, it should be restated that
    even though OpenOffice is a great tool, it is not from Microsoft; as a result,
    not will work as you might expect. The most benign problem may be incorrect fonts
    or bad page breaks. Other problems are missing graphics or incorrectly sized presentations.
    OpenOffice is improving continually but is always behind the soft-vendor.


    For OpenOffice to work as part of the Plugger plug-in, you will first have to
    be sure the following RPMs are installed:


    ```

    openoffice.org-libs-1.1.0-15.EL

    openoffice.org-i18n-1.1.0-15.EL

    openoffice.org-1.1.0-15.EL

    ```


    While these package names are for RHEL3, the other distributions use similar names
    for their OpenOffice packages.


    ## StarOffice


    This for-fee product from Sun Microsystems costs roughly $80 and can either be
    purchased in CD-ROM form or as a download. While this suite of programs is similar
    to OpenOffice, it has different names for every program. Since Plugger v5.1.2
    contains a preprocessor, you can easily switch between OpenOffice and StarOffice
    by setting your path so that the necessary programs precede the OpenOffice versions
    in the path (e.g., swriter).


    ## CrossOver Office


    CrossOver Office ($59) provides an extremely nice suite of tools that allows you
    to run Windows programs within your Linux installation using Wine. While Wine
    is extremely powerful and free, CrossOver Office is a for-fee tool that provides
    a clean method for installing your Windows programs into the underlying Wine layer,
    enabling you to run everything as your desire. In this way, you could run Internet
    Explorer instead of Mozilla. However, there are many limitations, since CrossOver
    Office and Wine do not support many of the necessary features required for a true
    Windows desktop.


    One of the biggest benefits is that you will be able to run Internet Explorer
    directly, with almost all its standard plug-ins. One of the primary exceptions
    is the Java Virtual Machine; it is available, but it does not run appropriately,
    since it hangs the browser.


    To install Internet Explorer follow the CrossOver Office-provided wizard.


    ## CrossOver Plugin


    CrossOver Plugin ($39) is a companion to CrossOver that modifies your Mozilla
    to use Wine and many of the existing document readers available to view Microsoft
    media from your browser. This powerful tool gives great compatibility when viewing
    documents produced by the Microsoft Office suite of products, since it uses viewers
    written specifically for the vendor.


    While CrossOver Plugin does not run Internet Explorer directly, it allows you
    to use all your Mozilla plug-ins as well as specific to Microsoft Office, including
    Office document viewers and Media Player. To install these plug-ins, use the provided
    CrossOver Plugin wizard. CrossOver Plugin has been merged into the CrossOver Office
    product and the same viewers can be enabled to view documents via the web.


    ## VMware


    VMware is another for-fee ($199) product that will place a Virtual Machine running
    Windows on your Linux desktop. Using this product grants you the ultimate in compatibility,
    because it runs a full-blown version of Windows inside your Linux desktop. With
    VMware, Internet Explorer and all its standard plug-ins are available. VMware
    will provide the highest level of compatibility. However, you also need a copy
    of Microsoft Windows to install into the virtual machine—yet another expense.


    ## 4.2 Web Publishing


    In many ways publishing Web documents is both easier and more difficult when using
    Linux. In Linux, you have more ways to actually edit the documents, and less ways
    to interact with FrontPage-style servers used by the corporate network. In essence,
    there is no real equivalent to FrontPage in Linux, but there are some extremely
    nice tools that attempt to mimic this behavior.


    We should point out the several advantages of using FrontPage that are not available
    when using many of the Linux tools. While most of these have alternatives, FrontPage
    and these alternatives do not work together.


    - CVS, RCS, and SCCS are alternatives to FrontPage''s check-out/in facility, but
    these cannot be used with FrontPage directly without a third-party plug-in.

    - Documents can be published to a FrontPage server even when the folder is not
    shared or mounted to the Linux box.

    - FrontPage plug-ins provide enhanced tools.


    Taking these differences into consideration is a major concern for the administrator.
    If you want to edit documents on a Linux system and cannot run FrontPage itself,
    there is no way to publish documents without mapping or mounting the FrontPage
    repository directly to the machine. You can download and save Web pages using
    many tools, publication, FrontPage''s major ability, is NOT available without
    direct access to the share.


    Does your IT administrator want to grant this functionality? Be aware that once
    it is granted, the check-in/out functionality of FrontPage can be completely bypassed.
    The alternative is to use a different source code control system.


    With this mind, we can split the functionality between publishing (or the documents
    onto the Web server to be served) and editing the Web documents. Most editors
    can grab Web pages using a screen-scraping method, in which the document is downloaded
    into a placeholder and then allowed to be edited. However, the editors who can
    not edit dynamically Web pages, and this will lead to confusion. Access to the
    files in question is really the better way to go, so you will need some access
    to the file repository or a copy of all these files. Assuming somehow we can use
    a number of tools to do editing.


    ### 4.2.1 Mozilla


    Mozilla''s Web editing capabilities are quite nice, since it is a WYWYG editor:
    however, it only allows you to edit one page at a time, rather than viewing all
    the pages.


    ### 4.2.2 Quanta


    Quanta is a sort of WYWYG editor, in that you can preview your work at any time.
    It comes closest to the functionality of FrontPage on Linux, as you can upload
    files to servers using one of the supported mechanisms (smb, nfs, ftp, webdev,
    etc.). It also contains an HTML syntax checker that is extremely useful. However,
    the use of plug-ins is severely limited at this time, and you have to edit the
    HTML code.


    ### 4.2.3 Text Editor


    While not a WYWYG editor for HTML, a text editor like vi or emacs can be one of
    the most powerful, since you can move files around quickly, as well as script
    the editing of many pages at once, which is very handy on repetitive edits to
    files, such as changing company names or embedded copyright notices, and so on.


    Alternately, you can use the following tools to run FrontPage directly and gain
    some of the benefits of its abilities.


    ### 4.2.4 CrossOver Office


    CrossOver Office is a for-fee ($59) product that allows you to run FrontPage within
    a Linux system using the Windows emulator Wine. FrontPage through CrossOver Office
    showed many failures and crashes when accessing local files. Remote files cannot
    be accessed unless source code control systems are disabled, due to domain authentication
    issues.


    ### 4.2.5 VMware


    VMware is another for-fee ($199) product that allows you to run the real FrontPage
    within a Windows Virtual Machine. Since VMware allows you to run as if you were
    on a Windows Machine, FrontPage has no limitations in its use.

    '
  mdcn: '


    ## OpenOffice


    此选项在您安装 Plugger（第 4.1.7 节）时会自动安装。然而，您需要在浏览器之外启动 OpenOffice 工具以同意许可条款并配置工具。一旦完成这些操作，这些工具就可以在
    Mozilla 中使用，且没有重大问题。但仍需重申的是，尽管 OpenOffice 是一个非常棒的工具，但它并非由微软开发；因此，它的工作可能不如您预期的那样。最轻微的问题可能是字体错误或分页不当。其他问题包括图形缺失或演示文稿大小不正确。OpenOffice
    正在不断改进，但始终落后于软件厂商。


    为了让 OpenOffice 作为 Plugger 插件的一部分运行，您必须首先确保安装了以下 RPM 软件包：


    ```

    openoffice.org-libs-1.1.0-15.EL

    openoffice.org-i18n-1.1.0-15.EL

    openoffice.org-1.1.0-15.EL

    ```


    虽然这些包名适用于 RHEL3，但其他发行版对它们的 OpenOffice 软件包也使用了类似的名称。


    ## StarOffice


    这款由 Sun Microsystems 提供的付费产品价格约为 80 美元，可以以 CD-ROM 格式或下载形式购买。虽然这套程序与 OpenOffice
    类似，但每个程序都有不同的名称。由于 Plugger v5.1.2 包含一个预处理器，您可以通过设置路径，使必要的程序位于 OpenOffice 版本之前，从而轻松地在
    OpenOffice 和 StarOffice 之间切换（例如，swriter）。


    ## CrossOver Office


    CrossOver Office（59 美元）提供了一套非常棒的工具，允许您使用 Wine 在 Linux 安装版中运行 Windows 程序。虽然 Wine
    极其强大且免费，但 CrossOver Office 是一款付费工具，它提供了一种整洁的方法将 Windows 程序安装到底层的 Wine 层中，让您能够随心所欲运行。通过这种方式，您可以运行
    Internet Explorer 而不是 Mozilla。然而，由于存在许多限制，因为 CrossOver Office 和 Wine 不支持许多真实 Windows
    桌面所需的必要功能。


    最大的优势之一是，您将能够直接运行 Internet Explorer，并带有几乎所有的标准插件。主要的异常之一是 Java 虚拟机；它是可用的，但运行并不正常，因为它会导致浏览器挂起。


    要安装 Internet Explorer，请遵循 CrossOver Office 提供的向导。


    ## CrossOver Plugin


    CrossOver Plugin（39 美元）是 CrossOver 的伴侣，它可以修改您的 Mozilla 以使用 Wine 以及许多现有的文档阅读器，以便从浏览器查看微软媒体。这款强大的工具在查看由
    Microsoft Office 系列产品生成的文档时具有极佳的兼容性，因为它使用了专门为厂商编写的查看器。


    虽然 CrossOver Plugin 不直接运行 Internet Explorer，但它允许您使用所有的 Mozilla 插件以及针对 Microsoft
    Office 的插件，包括 Office 文档查看器和媒体播放器。安装这些插件，请使用提供的 CrossOver Plugin 向导。CrossOver Plugin
    已合并到 CrossOver Office 产品中，可以启用相同的查看器通过网页查看文档。


    ## VMware


    VMware 是另一款付费（199 美元）产品，可以在您的 Linux 桌面放置一个运行 Windows 的虚拟机。使用此产品让您获得极的兼容性，因为它在您的
    Linux 桌面内部运行一个完整的 Windows 版本。通过 VMware，Internet Explorer 及其所有标准插件均可用。VMware 将提供最高级别的兼容性。但是，您还需要一个
    Microsoft Windows 副本安装到虚拟机中——这是另一项支出。


    ## 4.2 Web 发布


    在许多方面，使用 Linux 发布 Web 文档既更简单也更困难。在 Linux 中，您有更多方法来实际编辑文档，但与企业网络使用的 FrontPage 风格服务器交互的方法却更少。本质上，Linux
    中没有真正的 FrontPage 等等品，但有一些非常棒的工具尝试模仿这种行为。


    我们应该指出使用 FrontPage 的几个优势。


    '
