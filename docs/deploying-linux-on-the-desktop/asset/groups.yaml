    # chkfont -a /usr/share/fonts/ttf

    ```


    Now set default text font in OpenOffice to Arial


    Using Microsoft fonts will aid in solving some of your formatting issues, but
    not all of them.


    # 3.11 Easy Answer


    There is an easy answer to solve your Office program issues on Linux, and that
    is to use VMware to run a Virtual Machine session in a Window on your desktop.
    This gives you a complete Windows environment in which you can use your common
    desktop tools without depending on Linux tools. However, VMware is an expensive
    option, at $199 per seat plus a license for Windows.


    # 3.12 The Cost


    Is there a cost to using Linux to replace your Office tools? In a nutshell, there
    is, either in functionality or in price. As you get closer and closer to achieving
    the full functionality of Microsoft Office, your expenditures will go up, since
    you are then looking at the "easy answer" for the desktop.'
