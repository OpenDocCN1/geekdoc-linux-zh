    # x-world/vrml:Virtual Reality Modeling Language

    # x-world/x-vrml:vrml:Virtual Reality Modeling Language

    # swallow (VRWeb Scene Viewer) fill: vrWeb -geometry

    +9000+9000 -URL "Surl" "$file" >/dev/2>/dev/null

