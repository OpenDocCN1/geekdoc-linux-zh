    # 8.8 The Cost


    While relatively esoteric tools are not commonplace they are being used more and
    more in the normal business world. Quickbooks, especially, is the tool of choice
    for many small businesses; many people need digital cameras for support and work
    purposes, and Palm type devices are becoming commonplace in the environment. The
    cost of using these tools and external devices are not as high as you may expect.
    There are native versions of many tools or if necessary the inexpensive CrossOver
    Office tool to gain access to tools like QuickBooks, or even the more expensive
    VMware.


    # 8.9 Support


    The major support concern is the availability of software for the myriad of devices
    that can be attached to the USB slots on your computer. This ranges from your
    Palm, iPaq to a Camera. Support for the OpenSource projects are active and excellent.


    # 8.10 Conclusion


    The learning curve may be higher when using native tools, yet they will greatly
    expand your Linux desktop experience. Add in Wine and even more external devices
    can be attached and used effectively.


    The costs of the software necessary to use these tools are displayed in Table
    8.1.


    Cost of Linux Replacements for Terminal Service Clients

