    \ you will have everything you need).\n- gcc must be installed.\n- Perl must be\
    \ installed.\n- The basic Linux development environment must be installed.\n\n\
    While gcc, Perl, and the development environments are available from your operating\
    \ system CD-ROMs, Java should be installed as described previously or as your\
    \ Java distribution describes. In the building script, we have used IBM Java,\
    \ which is provided on the RHEL3.0 CDROM. However, any Java will work, and the\
    \ PATH setting needs to be modified accordingly.\n\n### Building VRML\n\n```\n\
    Script started on Sat 24 Apr 2004 11:18:00 AM EDT\n[plugins]$ PATH=/opt/IBMJava2-141/bin:${PATH}\n\
    [plugins]$ export PATH\n```\n\n```\n[plugins]$ $ ln\n[plugins]$ tar -xzf FreeWRL-1.03.tar.gz\n\
