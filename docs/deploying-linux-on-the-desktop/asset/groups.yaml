    ## Virtual Private Network (VPN) Connectivity


    A growing number of road warriors need to connect into the corporate environment
    using a Virtual Private Network (VPN). This chapter will address three of the
    possible methods for connecting to the corporate LAN using Linux. It will not
    cover setting up modems, but will cover setting up the necessary software to implement
    VPN. The goal is not to provide a detailed guide on which to choose, but instead
    to provide the practical knowledge of how to implement the necessary components
    and their associated costs.


    ## 2.1 How Do I Connect Using PPTP?


    PPTP (Point to Point Tunneling Protocol) requires adding modules to your kernel,
    as well as specialized setup using pptpconfig and other system modifications to
    implement PPTP protocol. http://ppptclient.net is an extremely good site that
    provides an excellent reference for PPTP on Linux. While we will not discuss every
    distribution, the steps are generally the same for all. Since using PPTP requires
    root access, it is not a bad idea to use a program such as sudo or similar tool
    to control access to this critical component or to use the PPTP service with pptpcommand.


    ### 2.1.1 RHEL3


    When installing PPTP into RHEL3, you will need to add modules to the kernel to
    add the required encryption. Once these modules are added, it is just a case of
    defining everything properly in the configuration files and then launching the
    PPTP configuration. As an added bonus the currentTP modules have been compiled
    to use Dynamic Kernel Support (DKMS). DKMS aids you when the kernel is upgraded,
    as you do not need to remember to recompile your modules by hand. The recompilation
    will happen automatically, which will decrease support issues when kernels are
    upgraded for security or fix reasons. DKMS will also provide a simpler way to
    distribute third party modules to each host. Below are the steps necessary to
    install PPTP using the DKMS form of the modules. Also note that this install DKMS
    is in RPM format. There are other formats for other versions of Linux available.


    ```

    # rpm -ivh pptp-2.4.3-0.cvs.20040527.1386.rpm pptp-linux-1.4.23-1tkf-pptp-0.0.3-1dkms.noarch.rpm
    kernel_pptp-0.0.3-1dkms.noarch.rpm

    ```


    DKMS: Add Completed.


    Preparing kernel 2.4.21-15.0.EL for module build (This is not compiling a kernel,
    only preparing kernel symbols). Storing current .config to be restored when complete.
    Running Red Hat preparation routine: DKMS: Build Completed. DKMS: Install Completed.


    ```

    # service dkms_autoinstall start

    # chkconfig dkms_autoinstall on

    # modprobe -v ppp_

    # lsmod | grep ppp

    ```


    | Module | Size | Used |

    | :--- | :--- | :--- |

    | ppp_pppe | 13816 | 0 (unused) |

    | ppp_generic | 24436 | 0 |

    | pphc | 6672 | 0 |


    ```

    # pptpconfig

    # pptpcommand

    ```


    There are two ways to configure PPTP: pptpconfig, and pptpcommand is a character
    graphical tool. pptpcommand also has a service that can start after your network
    comes up (pptpconfig does not have this ability). Both must be run as root. pptpconfig
    on RHEL3 will automatically ask for the root password when launched, while pptpcommand
    requires the user to be logged in as root to launch. Before using pptpcommand
    or even pptpconfig it is best to check with the corporate security policies automatic
    logins to a VPN may not be allowed. While certainly convenient, pptpcommand is
    not for the faint of heart and not covered herein. When running pptpconfig, you
    will configure using the following screens (Figures 2.1, 2.2, and 2.3):


    Figure 2.1 illustrates the server information box. You will need to fill in your
    server information as well as Routing, DNS, Encryption, and miscellaneous information.


    Figure 2.2 illustrates encryption choices. For example, my servers require the
    displayed items to be checked for encryption.


    Figure 2.3 illustrates the miscellaneous options.


    ### 2.1.2 Other Versions


    It is interesting to note that the Gentoo version of Linux contains the necessary
    tools to use PPTP, while most other mainstream versions of Linux do not contain
    the tools by default.


    ## 2.2 How Do I Connect Using IPSec?


    IPSec (IP Secure) uses the Openswan package to implement the IPSec stack and to
    connect to an Openswan server on the corporate network. The implementation of
    Openswan is similar across most Linux distributions; http://www.openswan.org provides
    an excellent OpenSwan implementation guide. NATversal (NAT-T) often requires patching
    the kernel. In general, version 2.6 kernels will already contain the IPSec and
    dependent modules, while some 2.4 kernels will need to compile the module into
    your kernel. While IPSec use is growing there is a fair amount of incompatibility
    between servers and often requires a specialized client to use.


    ![](img/a06399af5597deead6a12a49cc2aa3_26_0.png)

    > Figure 2.1 Server information for PPTP configuration.


    ![](img/a06399af5597deead6a12a49cc2aa3_27_0.png)

    > Figure 2.2 Encryption information for PPTP configuration.


    ![](img/a06399af5597deead6a12a49cc2aa3_27_1.png)

    > Figure 2.3 Miscellaneous information for PPTP configuration.


    ### 2.2.1 RHEL (Red Hat Enterprise Linux)


    Openswan does not install on RHEL3 as the IPSec module has dependency issues.
    However, IPSec support is part of RHEL3 and 4. Refer to http://www.redhat.com/docs/manuals/enterprise/RHEL/security-guide/sl1-vpn-ipsec.html,
    where the is either 3 or 4 depending on your release, to get specific installation
    and setup instructions. In addition, http://www.cs.helsinki.fi/u/mikkila/docs/linux-avaya-vsu.html#native_config
    provides an easy to use installation discussion on IPSec support in RHEL3 and
    RHEL4. If you need NAT-T support, however, you will need to recompile your kernel
    completely with a patch that void your RHEL warranty.


    ### 2.2.2 Fedora


    Fedora Core 2 or 3 (kernel v2.6) already contains an IPSec module, without NAT-T
    support. Once NAT-T support will need to be compiled into your kernel.


    ### 2.2.3 VMware


    VMware workstation is a for-fee ($199) program that provides a virtual machine
    in which you can run an implementation of Windows. This will allow you to use
    the Microsoft-provided dial-up and VPN tools to connect to the corporate LAN.
    This is the most compatible VPN method, and includes the ability to cache domain
    credentials easily. To allow the Linux host access to your VPN running within
    VMware, you must configure your VMware virtual machine as a router as, either
    using Internet Connection Sharing or some other proxy/router software.

