    ## 5.8 How I Make Bootable CD-ROMs?


    mkisofs is the important command, and it has many options, as shown in Table 5.3.


    Refer to Table 5.3 and run the following commands:


    ```

    cd temporary_data_directory

    mkisofs options -o /tmp/output.iso

    cdrecord options /tmp/output.iso

    ```


    It is possible to make very complex images with mkisofs that boot and display
    different data, based on the OS used to read the CD-ROM, the mkisofs manual page
    contains these complex examples. Last, Nautilus can also be used to burn images
    to the CD-ROM device using the burn://... location will create a standard ISO9660
    image, while you can use the following commands to do the same:


    ```

    cd path_to_dir_to_burn

    mkisofs J -R -o /tmp/output.iso

    cdrecord /tmp/output.iso

    ```


    ## 5.8 How I Make Bootable CD-ROMs


    Bootable CD-ROMs are often a requirement for making recovery CD-ROMs. These very
    useful CD-ROMs will assist an administrator in recovering a system or even to
    perform forensics on a system at. Last, the distribution media can always be used,
    but why keep a seven-CD-ROM set handy when a business card-sized CD-ROM will give
    the ability to boot from CD and thereby allow access to the machine for administrative
    purposes. To build a bootable CD-ROM you will need to have the syslinux RPM installed.


    ### 5.8.1 RHEL3


    ```

    update syslinux

    ```


    Once syslinux is installed, you can make your CD-ROM, using the following instructions:


    ```

    mkdir iso

    cd iso

    mkdir isolinux

    ```


    ```

    cp -r /usr/lib/syslinux/isolinux.bin isolinux

    cp files . # copy all necessary files to this directory

    including any commands you wish to run and libraries to run

    these commands including your kernels etc.

    # note that there is much more involved in making a bootable

    cdrom including the necessary kernel files and config files not

    covered here.

    mkisofs -J -T -v -r -c isolinux/boot.cat -b isolinux/

    isolinux.bin -no-emul-boot -boot-load-size 4 -boot-info-

    ./file.iso

    ```


    Note that this is by no means complete; this example demonstrates-only the basics
    and the necessary mkcdiso command. If you want to make a recover CD-ROM, there
    is a very promising project called mkcdrec (www.mkcdrec.org) that will guide you
    through making a bootable recovery CD-ROM (the recovery of your system from backup
    media, or just

    to boot the system in the master boot record is destroyed) or any other

    form of bootable CD-ROM. Included in this project are necessary steps

    to create a bootable CD-ROM including any necessary drivers and presents an

    an inclusive package that can be added to easily. Since this project is

    designed to make a recover CD-ROM it is all that is necessary to aid in the

    situation discussed. In addition there is the mkbootdisk command which

    will create boot disk specific to your system, for example:


    ```

    mkbootdisk --device /tmp/bootdisk.iso --iso --uname -r

    cdrecord /tmp/bootdisk.iso

    ```


    The mkbootdisk manual page will contain more details.


    ## How Do I Manipulate Floppy Disks?


    Floppy disks, like CD-ROMs, come in multiple formats. However, the

    most prevalent is the DOS format. To manipulate a DOS format disk, first

    be sure that the mtools package is installed.


    RHEL: rpm -q mtools


    mtools provides tools that emulate the DOS commands that you would

    normally use, except these commands are preceded with an m; format

    comes mformat, copy becomes mcopy, dir becomes mdir, cd becomes mcd,

    and so forth. It should be noted that most text files will need to be translated
    from DOS to Linux using:


    ```

    dos2unix <inputfile> <outputfile>

    ```


    and then using the following when there is a need to give the text file back for
    a DOS user to use the disk contents once more:


    ```

    unix2dos <inputfile> <outputfile>

    ```


    The alternative type of floppy disk is the disk that holds a different type of
    file system. Use the standard mount commands to mount the file system, and then
    all standard Linux commands will work as expected.


    ## 5.10 The Cost


    There is only one hidden cost involved, and that only applies if you need to manipulate
    esoteric file systems. This hidden cost is the cost of support if you must recompile
    your kernel to gain access to these file systems. However, if you stick to the
    standard kernels, many of these systems are available by default in their benevolent
    forms. If you desperately need to manipulate NTFS partitions on the local machine,
    it may be appropriate to use a system such as VMware to create a real Microsoft
    Windows installation, instead of using the risky NTFS Write-enabled code in Linux.
    Once you use something like VMware, you can either set up a CIFS server to share
    the disk to the Linux server. This last option can be expensive and not necessarily
    necessary.


    The costs are displayed in Table 5.4.


    ![](img/a063699af5597deead6a12a449cc2aa3_112_0.png)


    | Software | Support Level | Fee | Support Fee |

    | :--- | :--- | :--- | :--- |

    | VMware | Support-based | $199 | Free |

    | Kernel | None | Free | Free |


    ![](img/a063699af5597deead6a12a449cc2aa3_113_0.png)


