    \ viewer option will not appear.\n\n## 4.1.3 How Do I View VRML Web content?\n\
    \nVirtual Reality Modeling Language (VRML) is used to display 3D graphic objects\
    \ within a Web browser. Unlike the other plug-ins, one installs very differently\
    \ and has some specific requirements to work; it is not a straightforward installation\
    \ of a prebuilt RPM or package, but the compilation of a plug-in from source.\
    \ To view VRML content:\n\n## 4.1 Plug-ins\n\n![](img/a063699af5597deead6a12a449cc2aa3_66_0.png)\n\
    \n- Java must be installed, and the Java bin directory must be in your PATH (if\
