    ## Home Tools


    This chapter will discuss tools that are more commonly found on the home desktop
    but can be found on the corporate desktop as well. We will show solutions for
    connecting Palm or PC handheld devices to the desktop and discuss mechanisms to
    synchronize your PDA''s data. Specifically, we will look at synchronizing photographs
    and documents. In addition, we review digital solutions.


    ## Do I Synchronize My PDA with Linux?


    Synchronizing your Palm OS device with Linux is quite simple if you have support
    for your desktop, and client installed. Most, if not all, of these are available
    directly from each distribution; however, they are not always installed. There
    are several subsets to this question we will address. It should be noted that
    newer Palm devices might require a change to the kernel module to work properly
    (this modification is generally to the h file in your source directory). Refer
    to http://www.palm.org for updates for your kernel-module. While this change is
    relatively trivial, it can void warranties on Enterprise. At the very least, the
    following programs are needed to synchronize a Palm device:


    ### 8.1.1 RHEL


    ```

    up2date palmlink

    up2date gnome-evolution

    ```


    Palmink provides the basic tools to synchronize your Palm device, while the others
    add features to the system, including automatic synchronization, calendar, notes,
    and addresses. With all tools, synchronizing your Palm device with Linux becomes
    very straightforward. However, finding the proper port is not always simple, and
    for that some general rules; the first is that Palm devices use /dev/ttyUSB0 and
    are not always accurate, and for Sony devices they could be reversed. It should
    also be noted that the USB port does not correspond to the physical USB device.


    ### 8.1.2 Finding the Proper Port for Your Palm


    The dpsh command will allow you to print out information about your Palm device.
    This information can be used to verify connectivity as well as providing a handy
    command interface to gain information about the files stored on your palm. When
    the device asks you to press the HotSync button, you will be connected only if
    you choose the proper device. Since I am synchronizing a Palm Tungsten device,
    I chose to use /dev/ttyUSB1, and connected after HotSync Some times you need to
    press HotSync before running dpsh. Try both methods, and use the df command to
    read data from the Palm device and verify its accuracy against the Palm device.
    It should also be serial port connections available to dpsh. The devices in question
    will be /dev/ttyS0 or /dev/ttyS1, depending on which device the Palm plugged into.


    ```

    dpsh -p /dev/ttyUSB1

    Listening to port: /dev/ttyUSB1

    Please press the HotSync button now... Connected


    Welcome to DLP Shell

    Type ''help'' for additional information


    ```

    dpsh> df

    Filesystem      k-blocks     Used Available      Total

    Card0:ROM       16515072            n/a 16515072      n/a 16128k

    Card0:RAM       66060288    39241776 26813112     59% 64512k

    Total (ROM + RAM) 82753660    55762248              n/a n/a 806409k

    ```


    ![](img/a063699af5597deead6a12a449cc2aa3_138_0.png)


    Now that the Palm port is known, in this case /dev/ttyUSB1 we use this to configure
    the automatic synchronization tool, gnome-pilot. Select Fedora->Preferences->More
    Preferences->PalmOS Devices to launch the gnome-pilot applet (gpilot-control-applet)
    to start the gnome-pilot configuration tool (Figure 8.1).


    Then press Forward to select the USB port for your Palm (Figure 8.2).

    Be sure to select /dev/ttyUSB1 or, if you are only going to synchronize this Palm
    device to your system, you can make a symbolic link to /dev/palm to simplify matters.


    ```

    ln -s /dev/ttyUSB1 /dev/palm

    ```


    Once the proper port, speed, and USB selection are made, continue selecting Forward.
    Where a selection on whether this is the Palm Device has been synchronized to
    this machine is presented (Figure 8.3), select Yes and then Forward.


    Now it is time to perform your first HotSync so that the gnome-pilot software
    can retrieve the Username and Palm ID from the Palm device. If this dialog box
    appears, I always select Yes. The only time No would be selected is if the Palm
    device had never been initialized with a username or never been synchronized from
    or to any other HotSync software. The HotSync dialog box is shown in Figure 8.4.


    If by some reason the Palm device does not synchronize, verify the permissions
    of the port used. In this case, /dev/ttyUSB1 had permissions of rw-rw---- (ls
    -al /dev/ttyUSB1) and ownership of root.uucp,

