    \ for the nautilus folder viewer and browser. If you install the RPM direct from\
    \ RedHat these steps can be ignored.\n\n# Adding to menus\n\n```\n# cd /usr/share/applications\n\
    # cp net-Xpdf.desktop net-acroread.desktop\nEdit net-acroread.desktop and change\
    \ the Name= and Exec= lines to read:\n  Name=Adobe Acrobat\n  Exec=acroread\n\
    Then save the file\n```\n\n# Adding to Nautilus\n\nAs long as acroread is in your\
    \ path. Nautilus can use it to open local PDF content. However, you will need\
    \ to edit your file types (Red Fedora -> Preferences -> File Types and Programs)\
    \ to make it the default viewer.\n\n# How do I add Acrobat to KDE?\n\nAs integrating\
    \ into GNOME, integration into the K Desktop Environment (KDE) requires a two-phase\
    \ setup into the KDE ensuing system and its Konqueror folder viewer and browser.\
    \ If installed from the Red Hat Network via update the following steps can be\
    \ ignored, but it's always good to verify all is properly configured.\n\n# Adding\
    \ to menus\n\nRight-click on the Red Fedora->Menu Editor, select Documentation\
    \ on the left side menu, and press New Item. When the New Item menu appears, enter\
    \ Acrobat and press OK. The Acrobat entry will appear under Documentation on the\
    \ left side, and on the right will be the entry for the command to use with this\
    \ menu item. In the entry box, enter /usr/local/binacroread, then click Apply,\
    \ and select File->Quit. Before you select File->Quit, the Edit K Menu window\
    \ should look like Figure 4.4.\n\n# Adding to Konqueror\n\nTo add Acrobat to Konqueror,\
    \ first launch Konqueror using Red Fedora (start)-> Home menu. Next, from within\
    \ Konqueror use >Configure Konqueror to launch the Settings, and select File Associations\
    \ from the left window. In the middle Known Windows, expand application and select\
    \ pdf. Once you have completed, press the Add... button and in the first entry\
    \ box type in /usr/local/binacread and click OK."
