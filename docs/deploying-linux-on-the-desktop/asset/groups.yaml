    ## 3.6 Visio


    ![](img/a063699af5597deead6a12a449cc2aa3_44_0.png)


    Unfortunately, Linux does not have a native Visio document tool; however, it does
    boost tools that are similar to Visio, including Kivio, DIA (www.gnome.org/projects/dia/),
    and xfig. Kivio, a part of Koffice, provides a Visio look and feel, while DIA
    provides a standard drawing canvas that has stencil support. Neither can read
    Visio documents, since the files have a proprietary format. Various groups are
    trying to decode this, but no program Can truly replace Visio. So what options
    really exist?


    ### 3.6.1 CrossOver Office


    The CrossOver Office emulation environment, which is an enhanced version of Wine,
    will allow you to run Visio locally on your Linux desktop. Since this is an emulation,
    there may be issues with any sort of plug-ins.


    ## 3.7 WordPerfect


    WordPerfect (WP8) for Linux will read and write WordPerfect and many versions
    of Microsoft Word documents as well. This is another alternative to using OpenOffice
    or CrossOver for editing Word documents. However, WP8 is an older product and
    therefore does not understand modern Word file formats. WP8 for Linux is no longer
    available from Core, so we have to make do with secondary locations. A version
    of WP8 for Linux is available at www.linuxmafia.com/wpfaq.


    WP8 is not valid for a commercial setting, and requires a much older version of
    the Linux system to work. In essence, you want to look out the CLOS Deluxe edition
    v 1.2 boxed editions. Once again, because it is not modern, WP8 for Linux may
    not work on recent Linux operating systems, and it is incredibly hard to find.
    While you can install WP8 using libraries from the older systems placed in a separate
    directory structure it is a non-trivial method to gain this support, Appendix
    C contains the details.


    ## 3.8 Exchange Server Mail


    Exchange Server Mail can be accessed by a number of means, either using the Exchange
    Server Mail protocols or using IMAP.


    The easiest to use is Exchange via your Web browser. This has the advantage of
    not needing any special setup except on your Exchange Server itself. Any Web browser
    can access this mechanism, and you can access as many mailboxes as necessary via
    the Web interface. The most commonly used Web browser on Linux is Mozilla. Special
    plug-ins are necessary to use Exchange in fashion, just the necessary setup for
    your Exchange Server. This will give you full access to your mailbox, including
    all folders; remember, though, that e-mail takes up a lot of desktop space. Using
    a link similar to the following will access your e-mail if the OWA service of
    Exchange is enabled:


    ```

    http://servername/exchange/e-mail.address

    ```


    Where servername is the name of your exchange server, and e-mailaddress is your
    mail address.


    Alternatively, you can access your e-mail via IMAP. IMAP access limits your access
    to your Exchange e-mail, such that your calendar and other folders are not available
    via IMAP. Popular e-mail clients that can handle IMAP include MozillaMail, Evolution,
    Thunderbird, MUTT, PINE, ELM, as well as many other mail clients not part of modern
    Linux distributions. To configure, specify that you will use IMAP and the IP address
    or Exchangeservername as appropriate. For outgoing e-mail you may use your Exchange
    server again, or there may be a SMTP server somewhere else.


    There are two special-case clients, however, that allow you to access your full
    mailbox via Exchange. The first, Ximian Evolution Connector, depends on Ximian
    Evolution. The Connector will access Exchange if it were an Outlook-style client,
    and gain access to all your folders, including a global address list, and your
    calendar. Unfortunately, it cannot easily access your group or public folders,
    or even another mailbox that you could-rally access in Exchange. Setting up Ximian
    Evolution Connector can be a little daunting, so here are the steps you should
    take:


    ### 3.8.1 Red Hat Enterprise Linux Version3 (RHEL3)


    - up2date -nox evolution-connector, since Evolution is available as a part of
    the default installation.


    - Now that Evolution and the Connector are installed, you can add an account using
    the Evolution account creator. When you first start Evolution, you will receive
    the screen on Figure 3.10. You should then click on forward.


    - You will proceed through the appropriate screens, entering the appropriate content,
    until you reach the screen displayed in Figure 3.11, where you will select Microsoft
    Exchange from the menu.


    - You will be asked to enter in the information about your Exchange server, including
    your Windows Username, as shown in Figure 3.12. This username can include your
    Windows Domain and Username in the format of DOMAIN\Username. Please note that
    the backslash (\) is very important; it is not a forward slash (/).


    - Next, you will be asked to enter your Global Catalog Name used for a Global
    Address List, as shown in Figure 3.13. This information is readily available from
    your Exchange Admins.


    - Once the configuration is completed, you will then have to restart Evolution
    for the changes to Connector to take effect. Enable Folder view, and your Exchange
    Account will be visible. Expanding this account will ask you for your password,
    which you then enter to access Exchange Mail via Evolution Connector.


