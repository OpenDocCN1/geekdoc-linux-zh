    to the following:


    FreeWRL Exiting - File was not found.


    This message at least tells us that the display driver has everything it needs:
    otherwise, you would see a No visual found error. A good site to view as a test
    would be file:/home/user/FreeWRL-1.03/tests/collision.wrl. However, if you use
    the Plug-in, you will also have to comment out the appropriate section for the
