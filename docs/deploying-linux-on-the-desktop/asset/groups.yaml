    then NetMeeting is the only real tool.


    # 6.3 Instant Messaging


    Another widely used communication tool is Instant Messaging (IM). These tools
    work using servers that connect individuals to individuals and in some cases will
    connect groups of people as well. While not a true peer-to-peer'
  - '[PAGE 120]


    # Instant Messaging


    network, the use of servers allows some store-and-forward capabilities and guarantees
    the protocols. Popular IM protocols are AIM, ICQ, MSN, Jab-ber, and Yahoo!. On
    Linux, each of these protocols has a client and sometimes two or three versions,
    ranging from command-line versions to very nice graphical clients. Table 6.1 contains
    a list of Linux clients available for each protocol.


    # Table 6.1 Linux Instant Messaging Tools by Protocol


    | Tool | Protocol | Web Site | Notes |

    | --- | --- | --- | --- |

    | Licq | ICQ | http://www.icq.org | |

    | Gaim | AIM/MSN/Yahoo! ICQ | http://gaim.sourceforge.net | Graphical client available
    with most Linux systems |

    | Yahoo! | Yahoo! | http://messenger.yahoo.com | Graphical client from Yahoo!
    |

    | Aytm | AIM/MSN/Yahoo! ICQ/Jabber | http://ayttm.sourceforge.net | Graphical
    client with encryption modules |

    | EB-lite | AIM/MSN/Yahoo! ICQ/Jabber | http://www.everybuddy.com/eb-lite | Useful
    for WAP devices, including Java-based cell phones and PDAs |


    Most of the clients listed are universal clients, designed to have one speak all
    the available protocols, which will save on screen real estate. However, they
    all have different design criteria. Choosing one depends on how you wish to use
    the client. For some, third-party for-fee plug-ins can be found, while for others
    these are not allowed. It depends on the license in use.


    # 6.3.1 EB-lite


    EB-lite''s philosophy is to create a server that speaks all the protocols and
    then allow clients to talk to that server. There are currently clients for PalmOS
    devices, cell phones, Linux Qt, Java, and command line via a Curse front end.
    There are also plans for a robust Windows front end.'
  - '[PAGE 121]


    # 6.3.2 Ayttm


    Ayttm''s philosophy is to create a monolithic client that has many plug-ins for
    its features. Currently there are plug-ins for SMTP, encryption (both GPG and
    proprietary RSA based), each protocol (and other esoteric protocols including
    IRC), notes, and translation tools. Ayttm even has a Windows version of its interface.
    Ayttm has support for the Yahoo! Webcam protocols, for peer-to-peer video conferencing.


    # 6.3.3 Gaim


    Gaim''s philosophy is similar to Ayttm, and it is pretty much an active competitor
    to the project. It is missing Yahoo! Webcam support, but it does have scripting
    ability via Perl.


    # 6.4 Peer-to-Peer Video Sharing


    Outside of GnomeMeeting, NetMeeting via CrossOver Office, and Ayttm with its Yahoo!
    Webcam support, a few other tools are available for peer-to-peer video sharing.
    The current list of available tools includes programs such as nv, QSeeMe, and
    very others. These tools do not exist anymore or have not been updated recently.
    The most effort has gone into making GnomeMeeting work. Multiple items are needed
    to allow video, and although Linux does not support every device, it is supporting
    a growing number of devices. First you should find a device that will work on
    Linux. To show video, you will need a video camera that uses Video4Linux drivers,
    which includes many Creative and Philips cameras, and a few Logitech cameras.
    A host of information is available at http://www.gnomemeet.org; http://www.exploits.org/vl/
    is a site that lists working drivers for Video4Linux-supported cameras and tools
    for sharing video over the Web. Ayttm uses Jasper (http://www.ece.uvic.ca/-mdamas/jasper/)
    to transmit images to other webcam clients.


    # 6.5 The Costs


    Outside of using either CrossOver office or VMWare are no major costs outside
    of Linux supported web cameras. It should be noted that Gnome Meeting is used
    for Voice over IP there will be VoIP fees as well.'
  - '[PAGE 122]


    # 6.6 Support


    Support for the various Linux based tools is based on the Open Source communities
    and with the exception of some of the Instant Messenger Clients, are all quite
    active and responsive. Not having T.120 Protocol support in Gnome Meeting limits
    its effectiveness for meetings between Windows and Linux workstations.


    While there are many useful IRC clients, there are not many meeting or training
    tools. Others outside of Netmeeting will be discussed in chapter 10.


    # 6.7 Conclusion


    There are many useful Linux based messaging tools available and only for items
    like Netmeeting is an alternative tools required.The costs are displayed in Table
    6.2.


    > Table 6.2 Cost of Linux Replacements for Video-Conferencing Tools


    | Software | Support Level | Fee | Support Fee |

    |---|---|---||}{

    | VMware | Web-based/Phone | $199 | Free for 90 days |

    | CrossOver Office | Web-based/e-mail | $70 | Free for 90 days |

    | Webcams | Limited support | See vendor | Different by vendor; not many vendors
    support Linux outright |

    | VoIP | Limited support | NA | NA |'
