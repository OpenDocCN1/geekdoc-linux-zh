    and Palm devices are not always accurate, and for Sony devices they could be reversed.
    It should also be noted that the USB port does not correspond to the physical
    USB device.


    # 8.1.2 Finding the Proper Port for Your Palm


    The dpsh command will allow you to print out information about your Palm device.
    This information can be used to verify connectivity as well as providing a handy
    command line interface to gain information about the files stored on your palm.
    When the device asks you to press the HotSync button, and so you will be connected
    only if you choose the proper device. Since I am synchronizing a Palm Tungsten
    device, I chose to use /dev/ttyUSB1, and it connected after HotSync. Some times
    you need to press HotSync before running dpsh. Try both methods, and use the df
    command to read data from the Palm device and verify its accuracy against the
    Palm device. It should also be serial port connections available to dpsh. The
    devices in question will be /dev/ttyS0 or /dev/ttyS1, depending on which device
    the Palm card plugged into.


    ```

    dpsh -p /dev/ttyUSB1

    Listening to port: /dev/ttyUSB1

    ```


    Please press the HotSync button now... Connected


    Welcome to the DLP Shell

    Type ''help'' for additional information


    ```

    dpsh> df

    Filesystem      1k-blocks     Used Available      Used Total

    Card0:ROM       16515072            n/a 16515072      n/a 16128k

    Card0:RAM       66060288    39241776 26813112     59% 64512k

    Total (ROM + RAM) 82753660    55762248              n/a n/a 806409k

    ```'
