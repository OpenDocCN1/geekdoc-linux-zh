    ## 5.2 如何访问 CIFS 共享？


    ![](img/a063699af5597deead6a12a449cc2aa3_102_0.png)


    或者在登录时。如果你会挂载家目录，我建议采用登录时加载的方法。


    执行以下命令来挂载共享。请注意`.credentials` 文件是包含你的用户名和密码的明文文件，如 `smbmount` 手册页中所述的那样。


    ```

    mount -t smbfs -o credentials=$HOME/.credentials //machine/ share <mount-point>

    ```


    ![](img/a063699af5597deead6a12a449cc2aa3_102_1.png)


    ## 如何访问 NFS 文件系统？


    NFS 共享是 Linux 上网络文件共享的主流。对于这些文件系统，认证不是问题，因为认证模型是在系统层级而不是用户级的。用户访问受标准 Linux 权限的控制。使用
    NFS 挂载需要挂载点和 root 权限来执行任何挂载操作。如果用户需要访问以执行挂载，可以使用 `sudo` 命令（它是登录 root 的替代方案，记录所有基于
    root的操作）来执行以下挂载命令：


    ```

    mount <directory@machine> <mount-point>

    ```


    ## 如何访问基于 Macintosh 文件系统？


    在某些情况下，你可能需要访问位于 Macintosh 计算机上的文件。虽然大多数现代 Macintosh 计算机支持 NFS 或 CIFS，但也有较旧的计算机支持
    AppleTalk。Linux 可以通过 `netatalk` 软件包（http://netatalk.source-forge.net）支持 AppleTalk。


    ## 如何访问各种 CD-ROM 格式？


    最常用的 CD-ROM 格式是 ISO 9660，带有或不带扩展名。ISO 9660 CD-ROM 可以通过 `mount` 命令轻松访问，取决于你的系统是否经过了加固（hardened），它们会自动挂载到桌面上。使用的
    `mount` 命令为：


    ```

    mount -o ro /dev/cdrom <mount-point>

    ```


    注意，挂载点是你你有权访问的目录。现代 Linux 桌面或工作站安装将向用户暴露 CD-ROM 访问功能，并自动挂载所有常见的 CD-ROM 格式，而无需使用默认只能由系统管理员发出的
    `mount` 命令。在加固系统中，此选项可能不可用。你可以使用表 5.1 中的信息访问最常见的 CD-ROM、软盘甚至硬盘格式。使用此表时的命令序列为：


    ## 如何访问其他磁盘设备？


    `mount -o options -t type /dev/cdrom <mount-point>`


    在使用表 5.1 时有几点注意事项。第一是，如果你使用 ISO 9660 CD-ROM，你可以将命令简化为：

    `mount -o options /dev/cdrom <mount-point>`


    系统管理员可以设置 `/etc/fstab` 文件来处理这些每种格式，以便实现自动挂载。对于软盘，将使用 `/dev/fd0` 设备代替 `/dev/cdrom`。


    ## 表 5.1 访问常见的 CD-Rom、软盘和硬盘格式


    | 格式 | 类型 | 选项 |

    | :--- | :--- | :--- |

    | 多光段 (旧式) | udf | ro |

    | 多光段 (现代) | ISO 9660 | ro |

    | CDRW | ISO 9660 | rw |

    | Macintosh (原生) | hfs | ro |

    | Macintosh | ISO 9660 | ro |

    | Linux (原生) | ext2 | ro |

    | Linux | ISO 9660 | ro |

    | UNIX (原生) | ufs | ro |

    | UNIX | ISO 9660 | ro |


    ## 5.5 如何访问其他磁盘设备？


    让我们也看看一些其他格式。例如，如果一台机器的一块磁盘是 Windows，另一块是 Linux，无论机器如何启动，你可能都需要访问两块磁盘的数据。如果你的
    Windows 磁盘是 NTFS，你可以使用可用的 NTFS 格式；但如果你以读写方式挂载而不是只读，可能会有损坏硬盘的风险。NTFS 和 UFS 的读写驱动程序必须编译到内核中，否则会导致失效。挂载方法与
    CD-ROM 相同；但你必须确定使用哪个磁盘设备。如果你的 Linux 桌面访问是常规活动，你可能需要在 `/etc/fstab` 文件中添加条目，以便在启动时自动挂载磁盘。表
    5.2 包含了表 5.1 内容，并提供了类似的 `mount` 命令。


    ## 表 5.2 访问其他磁盘设备


    | 格式 | 类型 | 选项 |

    | :--- | :--- | :--- |

    | NTFS (硬盘) | ntfs | ro/rw |

    | 闪存 | vfat | rw |

    | UNIX (原生) | ufs | ro/rw |


    有许多方法可以确定机器上有哪些可用硬件。在此处，检查 `mount` 命令的输出以确定哪些设备已自动挂载或可用。如果设备不在列表中，我们进入不同的机制。由于我们只寻找磁盘设备，`mount`
    命令会告诉我们所有已挂载的设备。许多行可以忽略，关键的是 `/dev/hda2` 和 `/dev/hda1`，它们属于 `/dev/hda` 磁盘。


    - dev/hda2 on /ext3 (rw)

    - none on /proc (rw)

    - none on /dev/pts (rw,gid=5,mode=620)

    - devfs /proc (rw)

    - dev/hda1 on /boot ext3 (rw)

    - none on /shm tmpfs (rw)


    这告诉我们只有 `/dev/hda` 当前已挂载。


    ## 5.5.1 RHEL


    要确定哪些其他设备可以挂载，我们可以查看 `mount` 命令的输出，它显示了所有活动设备。一旦运行该命令，就会出现如图 5.6 所示的对话框。硬件浏览器将打开当前的
    CD-ROM 驱动器。要确定其他可用设备，点击“硬盘”（如图 5.7 所示）。在这种情况下，我想找到插入 PCMCIA 插槽的闪存卡设备。


    ## 如何访问其他磁盘设备？


    ![](img/a063699af5597deead6a12a449cc2aa3_106_0.png)

    ![](img/a063699af5597deead6a12a449cc2aa3_106_1.png)


    在图 5.7 中，你可以看到我需要的设备是 hde 设备，特别是 `/dev/hde1` 分区。


    ## 5.5.2 Mandrake


    与 `hwbrowser` 类似，`mandrake` 命令出现在图 5.8 中；它将显示你在左侧列中需要的精确设备。点击该设备将显示发生挂载所需的设备和分区。


    ![](img/a063699af5597deead6a12a449cc2aa3_107_0.png)


    ## SuSE


    SuSE 使用自己的硬件浏览器，与其他众不同。在启动 YaST 并从右侧选择“硬件信息”后，它将显示如下。一旦打开硬件信息对话框，你可以向下滚动并展开“磁盘”部分显示与每个磁盘驱动器相关的设备（见图
    5.9）。现在有了这些信息，可以使用相应的命令：


    ```

    mount -t vfat /dev/hdd1 /mnt

    ```


    如果由于某些原因硬件浏览器（你的 Linux 安装版）没有显示你的设备，你可以参考 `dmesg` 的输出来确定可用设备，使用如下：


    图 5.9 YaST 硬件浏览器。


    ![](img/a063699af5597deead6a12a449cc2aa3_108_0.png)


    ```

    dmesg | egrep ''hd|sd''

    de: LEXAR ATA FLASH, CPA DISK drive

    de: attached ide-disk driver.

    de: hde1: task_no_data_intr: status=0x51 { DriveReady SeekComplete Error }

    de: hde1: task_no_data_intr: error=0x04 { DriveStatusError }

    de: hde1: 2014992 sectors (1032 MB) w/1KiB Cache, CHS=1999/16/63

    de: hde1: [PTBL] [999/32/63] hde1

    de: Vcc = 3.3, Vpp = 0.0

    ```


    如果没有 `dmesg` 且你拥有 root 权限，也可以查看日志消息文件：


    ```

    egrep ''hd|sd'' /var/log/messages

    ```


    提供的输出还显示 `hde1`——特别是 `/dev/hdd1`——是我在挂载命令中使用的设备。在命令中使用 `sd` 通常会显示 USB 磁盘。


    ## 如何从 CD-ROM 创建镜像？


    制作 CD-ROM 镜像在命令语法上非常简单，但在完成镜像时并不简单。要制作 CD-ROM 镜像，使用：


    ```

    dd if=/dev/cdrom of=<image file>

    ```


    或者


    ```

    readcd dev=/dev/cdrom f=<image file>

    ```


    然而，某些 CD-ROM 设备在寻找设备末端时存在问题，在物理弹出 CD-ROM 之前必须发生后续读取错误，这可能导致系统看起来挂起了。这种这种情况只在旧内核上使用
    DVD 驱动器时遇到过。


    ## 如何创建 CD-ROM？


    这取决于你希望什么类型的设备能够读取生成的 CD-ROM。基础命令是 `cdrecord`，它有很多选项。然而，创建光盘是一个三步骤的过程：


    -   将所有想要刻录到磁盘的文件放入一个目录中。

    -   使用 `mkisofs` 命令创建该目录的 ISO 镜像。

    -使用 `cdrecord` 将生成的 ISO 镜像刻录到 CD-ROM 设备上。


    | 格式 | 类型 | cdrecord 选项 |

    | --- | --- | --- |

    | ISO9660 | iso9660 | -J -R |

    | 多光段 | udf/iso9660 | -multi |

    | Macintosh | hfs | -hfs |

    | UNIX | ufs/ext2 | 无，直接在设备上使用 cdrecord |


    '
