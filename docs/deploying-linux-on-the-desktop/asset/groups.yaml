    # 4.1 Plug-ins


    There are many plug-ins available for the native Linux browser, Mozilla. Some
    of these plug-ins are pure plug-ins designed specifically for Mozilla; others
    invoke system tools to display the Web content. We will split the plug-ins between
    the pure and the invoked. However, the display of multimedia content is included
    under the pure plug-ins. This audio and video content has both pure and invoked
    plug-ins and is a section unto itself. The best location for Mozilla plug-in information
    is at http://plugin-doc.mozdev/linux.html, the Mozilla plug-in Web site for Linux.
    In this chapter, we will discuss what is required to install the plug-ins.


    If a plug-in does not appear, or is duplicated by another plug-in, you may need
    to remove the file .mozilla/pluginreg.dat to effect the change to the plug-ins
    you desire. Removal of this file will not affect your plug-ins, except to force
    dereggistration.'
