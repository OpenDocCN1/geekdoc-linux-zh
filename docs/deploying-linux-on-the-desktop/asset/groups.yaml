    Much more than a jumpstart, this book is my recipe for building usable Linux corporate
    desktop that moves far beyond migration to Linux and into the concept of integration.
    This book endeavors to meet the challenge of integrating Linux into the corporate
    environment with a minimized learning curve and no loss of functionality. This
    book presents the tools necessary to build toward integration, as well as the
    costs and support considerations that arise from the use of Linux on the desktop.
    Included is my personal recipe for building my laptop (see Chapter 13).


    # About this Book


    Covering Red Hat Enterprise Linux 3 and 4, SuSE Enterprise Linux 9, and Mandrake
    Linux, this book provides the necessary tools that will allow its readers to use
    Linux within a Microsoft-centric network environment. It is an invaluable reference
    regarding the creation of an integrated Linux corporate desktop!


    E-mail address: books@astroarch.com


    Web site: http://www.astroarch.com/~elh/books


    # The Requirements


    Looking at the world of the desktop computer, you see a myriad of solutions ranging
    from Microsoft Windows 98 and other versions, to Macintosh computers of all types,
    to Linux, the new rising star. While we know that Microsoft Windows and Macintosh
    have been competitors, and more eyes are investigating Linux as a solution to
    rising IT costs. Even so, many are unwilling, or unprepared, to take the plunge
    and use this opensource operating system. So more information is needed, a readily
    available resource that both addresses the issues inherent in using Linux in a
    non-Linux-centric desktop world and provides an information source for IT managers
    and those system administrators with a clear understanding of Linux basics.


    It is necessary to describe the complete scope of this book based desktop-user
    requirements. These requirements will dictate the questions to be answered by
    each subsequent chapter of this book, and stem from two basic questions:


    1. Is Linux ready for real use as a desktop?

    2. Is Linux ready to be used as a corporate desktop?


    The easy answer to both is yes. Linux is ready, but the matter is much more complex
    than that. Let us look at two distinct scenarios and try to refine our answer.


    The first scenario consists of using Linux as a replacement for all existing machines,
    from file servers to desktops: a homogenous Linux solution that will not interact
    with any other types of systems. The second scenario consists of a heterogeneous
    solution, in which Linux may act as a desktop, server, and so on. While the first
    scenario is a dream many Linux developers have, the second scenario is a more
    honest world view.


    Scenario One is a rousing affirmative. Everything works as expected for the corporate
    environment.


    Scenario Two is a golf-clap affirmative. Everything will work, but it requires
    more of a mixed-mode desktop, which uses Linux as the operating system and possibly
    tools such as Wine and VMware to complete the interoperability requirements.


    With Scenario Two firmly in mind, we should look at Linux as an enabling tool
    that has some native applications, as well as tools to use non-native applications
    that may have no Linux equivalent. Each chapter looks at the desktop from this
    world view and answers the questions present to an administrator who must solve
    the problems of maintaining a heterogeneous environment that interoperates successfully,
    and identify the cost and benefits the administrator can bring to the IT manager
    who makes the decisions.


    While this book can be viewed as a list of Frequently Asked Questions (FAQ), a
    collection of how-to-documents, or a list of power tools or hacks I will answer
    the IT manager’s question, "What is the cost of using Linux on the corporate desktop?"
    as well as the system administrator’s question, "What is involved in implementing
    Linux on a corporate desktop?" To come up with this information, we must first
    visit the requirements of a corporate desktop.


    The list of requirements has been taken from my own experiences in a common desktop
    within a corporate environment on a laptop that must be usable by all described
    user types. We have approached this list to fulfill the needs of three different
    user types:


    1. Telecommuter—Tools and requirements to set up a home office desktop

    2. Corporate office user—Tools and requirements to set up an effective Linux desktop
    in the corporate office or cubicle

    3. Road warriors—Tools and requirements to set up a useful Linux environment on
    a laptop


    The requirements are broken out for these environments by classification of tools.
    The order of the requirements, and hence the chapters, takes the reader from the
    basics of connectivity through the final touches of more esoteric desktop tools.
    It should be noted that a broad stroke of the brush has been used with our lists
    of requirements; your environment may not need every tool discussed and may need
    other tools not discussed here.


