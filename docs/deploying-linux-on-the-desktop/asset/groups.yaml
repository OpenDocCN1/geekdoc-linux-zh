    # Terminal Emulators and Server Clients


    It may become necessary to access command line shells, or legacy terminal-based
    applications running on other systems. To do this, you will need a character cell
    terminal client. In many cases, such access provides unique challenges, such as
    using the proper keyboard layout or terminal emulation mode. You may just need
    to display Graphical Windows back to your machine using a Terminal Server client
    from a Windows server.


    ## 7.1 How Do I Access Legacy-based Mainframe Programs?


    To access legacy mainframe programs you will need a terminal emulator that can
    talk to the mainframe. There are many tools available for use. We will review
    two mainframe systems and their corresponding clients.


    First there is the IBM mainframe client. It will interact with IBM MVS-based mainframes
    and provide all the necessary features, including function key mappings for PC-style
    keyboards as necessary. There are a huge number of tn3270 clients available and
    we mention the class instead of the specific programs. tn3270 clients have one
    in common and that is that they will interact as if it was a 3270 terminal. While
    you may still be able to find a 3270 physical terminal, the tn3270 class of emulators
    are more prevalent and it is very difficult to choose which one is better than
    another so no emulators will be presented. They all have a few things in common
    including a method to input the specialized keys of a 3270 Terminal without requiring
    a modification to any other system. While tn3270 emulators do not require any
    other software to change keymap other terminal programs do have this requirement.


    Of critical importance when dealing with keyboards and XFree86 the concept of
    a keyboard map that represents each key on the keyboard. While there is a keymap
    for the keyboard, there is a keycap definition for individual key of the keymap
    (keyboard). By modifying keycaps, we can modify the way the keymap reports the
    press of keys on the keyboard. The program xmodmap will read a keymap file with
    its defined keycaps and modify the keymap of the running system.


    For Digital (HP) VMS-based systems, you will need a VT400 terminal emulator. There
    are several VT400 terminal emulators, with the most convenient one already a part
    of all distributions. That tool is xterm.


    ### 7.1.1 RHEL


    ```

    up2date xterm

    ```


    While old-fashioned, xterm (using the -sb) will place the numeric keypad into
    application mode rather than system mode and extend the keyboard map to handle
    function keys through 20, which is required by a VT400 terminal emulator.


    If your keyboard does not support 20 function keys and these keys are necessary,
    you will need to map these keys using xmodmap or the XKeyCaps (http://www.jwz.org/keycaps/)
    graphical client, which will write out a file readable by xmodmap and any other
    application running at the time of the keyboard map change will affect xterm as
    well as openoffice and any future application. This is NOT a localized change.
    For example, you can use xmodmap/XKeyCaps to map ctrl-F10 to be F13 using a keymap
    created using XKeyCaps. First we need to build XKeyCaps, as it is much easier
    to manipulate xmodmap files using this tool.


    ### 7.1.2 Building XKeyCaps


    ```

    # tar -xzf keycaps-2.4.tar.gz

    # cd keycaps-2.4

    # make

    # make install

    ```


    ### 7.1.3 Running XKeyCaps


    ```

    # xkeycaps

    ```


    choose your keyboard from the list, it is older code so choose closest match right
    click on key to raise menu and select Edit. The "Edit Key" dialog screen is shown
    in Figure 7.1 (img/a06369af5597deead612a49ccaa3_126.png). The Keysym associated
    with the modifier in question, in this case the modifier will be Control for the
    control key after you press it. For F3, select a character set and then Repeat
    for all appropriate keys. Figure 7.2 shows the dialog box for editing the key
    definition for F13. Figure 7.3 shows the message box displaying your output. From
    command line or part of a startup script run ''xmodmap -n'' to invoke keyboard
    change. (img/a06369af5597deead612a49ccaa3_127.png)


    | Keysym of Code | Modifiers | Character Set | Keysym |

    |---|---|---|---|

    | Keysym 1: F13 | Shift | Latin1 | F10 |

    | Keysym 2: F13 | Ctrl+Shift+Alt | Latin2 | F11 |

    | Keysym 3: F13 | Control | Latin3 | F12 |

    | Keysym 4: NoSymbol | | Latin4 | F13 |

    | Keysym 5: NoSymbol | mod2 | Arabic | F14 |

    | Keysym 6: NoSymbol | mod3 | Greek | F15 |

    | Keysym 7: NoSymbol | Cyrillic | F16 |

    | Keysym 8: NoSymbol | mod5 | Technical | F17 |


    AutoRepeat: Yes


    While not a pretty application, XKeyCaps will work to remap the keyboard to anything
    you need or desire. This global change to your keymap will affect all programs
    running in graphical mode.


    ### 7.1.4 Application-localized Keymap Change


    An application-localized method exists within xtterm to remap the keys only within
    xtterm using its keymap and translations. xtterm will translate a set of physical
    key presses into the entry of another key sequence into the text stream. A script
    that performs the mapping for you allows the creation of a new command, vmstream,
    to connect to a VMS machine with the proper keymap without affecting any other
    programs. This method is preferred and is fully discussed in the xtterm FAQ (http://dickey.com/xterm/xterm.faq.html),
    where scripts different from the following are also presented. However, you should
    note some similarities, since there are only a few ways to perform this process.
    This script will map the keys shown in Table 7.1. (img/a06369af5597deead612a49ccaa3_127_1.png)


    #### Table 7.1 Key Mapping Script


    | Key | Map |

    |---|---|

    | Shift F3 | F13 |

    | Shift F4 | F14 |

    | Shift F5 | F15 (Help) |

    | Shift F6 | F16 (Do) |

    | Shift F7 | F17 |

    | Shift F8 | F18 |

    | Shift F9 | F19 |

    | Shift F10 | F20 |

    | Shift F11 | F11 |

    | Shift F12 | F12 |

    | Print | Help (F15) |

    | Cancel | Do (F16) |

    | Pause | Keypad Minus |

    | Insert | Insert Here |

    | Delete | Remove |

    | Home | Find |

    | End | Select |

    | Prior | Prev |

    | Next | Next |

    | BackSpace | BackSpace (sends DEL - ascii 127) |

    | Num_Lock | PF1 |

    | KP_Divide | PF2 |

    | KP_Multiply | PF3 |

    | KP_Subtract | PF4 |

    | KP_Add | Keypad Comma |

    | KP_Enter | Enter |

    | KP_Decimal | Period |

    | KP_0 | Keypad 0 |

    | KP_1 | Keypad 1 |


    #### Table 7.1 Key Mapping Script (continued)


    | Key | Map |

    |---|---|

    | KP_2 | 2 |

    | KP_3 | 3 |

    | KP_4 | 4 |

    | KP_5 | 5 |

    | KP_6 | 6 |

    | KP_7 | 7 |

    | KP_8 | 8 |

    | KP_9 | 9 |


    ```

    #!/bin/sh

    xterm -title "VMStream" -geometry 80x24

    xmodmap -e "clear lock" -e "clear shift"

    xmodmap -e "add mod4 = F13" -e " = = ="

    xmodmap -e "add mod5 = F14" -e " = = = _"

    xmodmap -e "add mod6 = F15" -e " = = = ="

    xmodmap -e "add mod7 = F16" -e " = = = _"

    xmodmap -e "add mod8 = F17" -e " = = = ="

    xmodmap -e "add mod9 = F18" -e " = = = _"

    xmodmap -e "add mod10 = F19" -e " = = = ="

    xmodmap -e "add mod11 = F20" -e " = = = _"

    xmodmap -e "add mod12 = F21" -e " = = = ="

