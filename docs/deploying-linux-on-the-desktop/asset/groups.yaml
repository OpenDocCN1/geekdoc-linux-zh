    ## 3.1.1 OpenOffice


    OpenOffice is the most commonly suggested tool for editing Word documents. Specifically
    you would use the OpenOffice Suite''s writer tool. You can run writer from the
    command line or select its icon from the toolbar.


    OpenOffice does have problems with Word documents. At the very least you may experience
    formatting issues (i.e., incorrect page numbering and page alignment; see Figures
    3.1 and 3.2). At the most, graphics may not appear where you originally placed,
    or sections of text may be misplaced. This disconnect is because some of the more
    esoteric features of Word do not work with OpenOffice, which is by its nature
    behind the development curve. Due to different fonts available and issues with
    page numbering, the visual format of the document can appear skewed. You may wish
    to choose one system upon which the final format will be performed.


    ## 3.1.2 StarOffice


    StarOffice is similar to OpenOffice, but is a free product from Sun Microsystems.
    Actually, StarOffice used to be more integrated as a desktop application.


    Figure 3.1 Comparison between Word and writer.

    (img/a063699af5597deeada12a449cc2aa3_35.png)


    Figure 3.2 Another comparison between Word and writer: page alignment.

    (img/a063699af5597deeada12a449cc2aa3_36.png)


    it is a drop-in replacement for OpenOffice. Since it is free, you gain technical
    support through the product developers. StarOffice is invoked using the command
    line. StarOffice has issues similar to those of OpenOffice in dealing with page
    formatting. I suggest testing with the documents first, as the issues with page
    numbering and different fonts (Linux vs. Windows) will change how the documents
    look.


    ## 3.1.3 CrossOver Office


    CrossOver Office allows the user to install a version of Microsoft Word into the
    system and use it inside a native Linux tool. While in most cases this will alleviate
    the need for separate tools, many of the Word plug-ins may not install or work
    because the underlying Wine system (used to emulate a Windows machine) is still
    under development (even though it''s a stable release). In the case of spell-checking,
    you will want to ensure that multiple languages are installed, since the spell-checker
    often asks me for the Italian language for some reason. Perhaps it is the technical
    nature of my writing.


    ## 3.1.4 AbiWord


    We should mention AbiWord as well as the others. It is a very nice editor that
    will read some Word formats, yet its inability to save in a usable Word document
    format is very limiting and frustrating when trying to interoperate.


    ## 3.2 Excel


    One of the widely used formats for spreadsheet preparation and sharing is Microsoft
    Excel. Linux has quite a few tools to read and edit spreadsheet files. Here is
    a short list of some of the widely known tools. There are several tools available
    to edit Excel files, just as there are for Word documents.


    ## 3.2.1 OpenOffice


    OpenOffice editor for Excel is invoked using the command, or from the system menu
    or panel. OpenOffice is highly recommended as a way to manipulate Excel files
    on Linux, and is very good. However, as with the Word Document editor for OpenOffice,
    there are also issues. These issues resolve Excel''s interpretation of formulas
    in files saved using OpenOffice (see Figures 3.3 and 3.4).


    ## 3.2.2 StarOffice


    StarOffice is a free version of OpenOffice that has taken a different development
    path but behaves in a similar fashion. The different development paths have not
    changed the behavior very much; StarOffice suffers from the same issues of chart
    and diagram placements, as well as Excel''s display of cells with formulas from
    StarOffice. (It should be noted that although the cell formula saved, =(B60)*2,
    did not appear properly within Excel, it does appear properly in OpenOffice and
