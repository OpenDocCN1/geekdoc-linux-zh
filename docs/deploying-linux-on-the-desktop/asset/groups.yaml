    # 4.1.4 How Do I View Player Streaming Media Content?


    RealPlayer content can be viewed by installing the RealPlayer 8 RPM available
    from http://scopes.real.com/real/player/unix/unix.html, where you will have to
    enter some basic information before proceeding. Alternately, you can get RealPlayer
    from the Linux vendor. This is a fairly straightforward installation.'
