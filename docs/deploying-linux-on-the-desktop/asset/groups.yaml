    many players, but the most common are:


    + - KsCD (KDE)

    - mplayer

    - XMMS

    - mpg321

    - mpg123

    - AlsaPlayer


    When MP3s are encountered on the Web, the plugin-in will first try to play them
    via mpg123 then proceed to mpg321, mplayer, xmms,

