    ## 在桌面电脑上部署 Linux


    ## Edward L. Haletky


    “Haletky 先生利用他在 Linux/Unix 方面的丰富经验，详细展示了从 Windows 桌面迁移到 Linux 桌面的方案，这些方案既广又深。这本书将帮助你诚实地评估
    Linux 是否适用于你的桌面。”


    —Christopher Sweeney, Pleasant Crab Consuming


    ### 主要特性：


    - 审查真实世界的需求

    - 涵盖了纯 LINUX 和混合企业桌面

    - 涵盖了启用工具，例如 CrossOver Office 以及在 LINUX 上使用 Windows 原生程序

    - 揭示了兼容性问题

    - 实现稳固的企业桌面

    - 审查实施 LINUX 作为桌面的完整成本”


    “Ed 的书对于任何具有某些 Linux 经验并尝试实现类似于 Microsoft Windows 功能桌面的人来说，都是一个极佳的工具。不仅仅是出于爱好——如果我被要求在工作的桌面上部署
    Linux”


    —Pat Lampert, HP Services


    在桌面电脑上部署 Linux 为管理员及其管理层提供了必要的工具，以实施和理解使用 LINUX 构建的企业桌面。这本书涵盖了管理员所需的细节，包括任何兼容性问题，以及针对
    IT 决策者的真实实施成本。虽然其他材料涵盖了纯 LINUX 环境，但《Jumpstart》关注的是真实世界的需求和实现，目标是创建一个稳固、可支持的 Linux
    桌面。


    其他信息包括《在桌面电脑上部署 Linux...的更新可以在 http://www.astsearch.com/~elh/books.html 查询。请邮件至
    Edward@astsearch.com 提供意见、问题，甚至更新书籍内容。summary.biz。


    Edward L. Haletky 于 1988 年毕业于普渡大学，获得航空航天工程学学位。从那以后，他一直在各种 LINUX 平台上从事图形编程和其他底层库的开发工作。他目前就职于惠普（HP），担任高性能计算专家，处理
    Tru64 和 Linux 集群技术，以及通用 Linux 和 VMware 环境。Edward 还发表过关于 Linux 兼容性、集群和安全问题的文章。


    读者群：系统和网络管理员


