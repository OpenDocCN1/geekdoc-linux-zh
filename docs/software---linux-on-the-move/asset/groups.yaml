    # LINUX: COMPATIBILITY AND RELIABILITY FOR THE CREATIVE TECHNOLOGIST


    Dave Hollandeck, Hewlett Packard


    As a microprocessor designer, I must outthink my competitors every day. We are
    living in a frantic race to develop technology—I need every ounce of creativity
    I can muster. I need tools that are flexible and adaptable to create my work.


    Packaged-size-fits-all software seems to, but my job requires more basic tools:
    I don''t want a painting—I want the paints, canvas, and colors, to create my work
    of art. Linux needs to maintain the environment I create when it creates a slightly
    different shade of yellow. I would have the perfect solution, for tomorrow''s
