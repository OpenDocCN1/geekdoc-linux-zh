    # Guest Editors'' Introduction


    What is Linux? And why should you care? This focus section has insights for both
    newcomers and diehard fans.


    ![](img/1475d122f50e27ffa74a3df49508b6e3_0_0.png)


    # Linux on the Move


    Terry Bollinger, The Mitre Corporation

    Peter Beckman, Los Alamos National Laboratory


    Linux is free, open-source operating system that looks like Unix, except that
    it runs on PCs as well as other platforms. Linux was created by Lin Torvalds in
    1991. Today, Linux is cooperatively improved by Torvalds and thousands of volunteers
    from around the world using open-source development methods. At this point in
    time, “Linux” generally refers to the entire suite of software in a distribution,
    from the operating system kernel to the Web server and graphical user interface.


    When we say that Linux is “free” we mean, well...free. You do not need to pay
    to get a copy of it, although it is usually more convenient to buy an inexpensive
    CD-ROM copy than download an entire distribution over the Internet. Once you get
    a copy of Linux, you also have the right to make many copies of it as you want.


    # DEFINING TERMS


    By "open source" we mean that you also have the right to get copies of all the
    source code from Linux and its associated tools were originally compiled. There
    are no magical, mysterious binary files, although you could court the Linux system
    if you prefer. If at some point encounter a bug, you are perfectly free to fix
    the source code. You are encouraged to improve Linux and share your changes with
    the community.


    # GETTING RESULTS


    The only traditional software practice that open-source developers do is peer
    review, and they do that with a vengeance. Each piece of source code is placed
    on display in front of a global community of developers. The global community
    of open-source developers is noted for being brutally honest and focused on bottom-line
    results.


    Alternatively, you can report the bug and simply watch someone fix it for free,
    in a matter of days or in a matter of hours.


    By "Unix" we do not mean simply, a watered-down subset of Unix. Linux is not an
    operating system by anyone''s definition. It has as many more tools and advancements
    than traditional Unix OS. It is also a major component of the Internet, where
    it serves to provide exceptional reliability and stability—7-day work week. Linux
    has been built to power powerful parallel-processing clusters.


    The results of this approach include components that are arguably the most reliable
    pieces of complex software in existence, since even a modest rate of failure in
    critical components would cause the Internet to degrade to the point of being
    unsure. Despite the indifference of open-source methods to software development
    rules, they do achieve the kind of reliability to which traditional software development
    methods still aspire.


    By "on PCs as also other platforms," we mean that Linux currently has the most
    impressive platform run of operating system—and the keeps growing. It has run
    on the Intel x86, Gamma, Alpha, Sun, Apple Macintosh, MIPS, and even the Palm
    Pilot.


    # A SPECIAL ISSUE ON LINUX


    The Linux (and other) articles in this issue are described in the Article Summary
    on page 34. To explore further, see "Open Source and Linux Resources" on p. 34.


    Linux also possesses an unusually wide range of drivers for peripheral devices.
    In cases where a newly released board or device is not supported by Linux, it
    is uncommon to see the except driver show up on the Internet within hours or even
    days of the new device hits the market stability, the largest obstacle standing
    in the way of development drivers for new hardware is finding available specifications.


    IEEE Software has to choose Linux not only because it is an interesting and timely
    topic, but to provide a bit of a wake-up call to traditional software developers
    who may be a little concerned about Linux and open-source software development.
    The fact that Linux has widely hidden secrets makes it all easy to dismiss it
    as "just another software that will fail soon.


    By "open-development" we mean what must be one of the high-raising violations
    of accepted software development practices over to the software radius. Open-source
    development ignores accepted requirements analysis, process, and software configuration
    control; it laughs at them and throws them out. The timeline on pp. 32-33 provide
    a brief history of the movement. The sidebars (pp. 33, 35) provide additional
    flavor of what this community is all about.


    The risk of such thinking is that it will fail to recognize and learn from the
    open-source movement''s success, as its ability to produce reliable software even
    in the absence of traditional configuration and management controls. A general
    principle of science is that when blatant traditions exist between theory and
    practice,


    January/February 1999 IEEE Software 31


    # A BRIEF HISTORY OF FREE SOFTWARE AND OPEN SOURCE


    Jesus Gonzalez Barahona and Pedro de las Heras Quirós, Carlos III de Madrid

    Terry Bollinger, The Mitre Corporation


    ### 1950s-1960s


    Software is distributed with source code and without restrictions in forms such
    as the “Algorithms” section of Communications of the ACM, the IBM Share User Group,
    and the DEC user group.


    ### 1969


    April: RFC 1233 describing the first software for the Internet (then ARPANET)
    was freely accessible to RFCs and especially to the protocol specifications, was
    key to Internet development.


    ### 1971


    Richard Stallman began his kernel at MIT in a program that uses only free software
    (nonproprietary software) includes publicly accessible and redistributable source
    code.


    ### 1978


    Donald Knight of Stanford begins working on the system, and it is distributed
    as free software.


    ### 1983


    Richard Stallman writes the “GNU (Not Unix)” Manifesto, in which he calls for
    a return to sharable software. Early non-proprietary software for academic use
    is largely over.


    ### 1985


    Cygnus, the first to identify business opportunities in free software, is founded.


    ### 1989


    Stallman’s organization, the Free Software Foundation, announces its intent to
    build a powerful Unix-like kernel called Hurd. Their goal is so large that many
    will never be completed. (As of 1999, Hurd is incomplete.)


    ### 1991


    August: Finnish graduate student Lin Torvalds has been working on a Unix-like
    kernel since April 1991, using tools such as GCC and hobby. uses Minix as his
    development kernel.


    October: Tallinn publishes the source code for his Unix-like free kernel and names
    it Linux

    December: Tallinn releases the first self-supporting version of Linux, version
    0.01. Developers can now work on Linux without any proprietary operating systems.


    ### 1992


    The US Force asks New York University to build a free compiler for what is now
    Ada 95. The NYU team uses GCC for code generation and calls their compiler GNU
    for NYU Ada 95 Translator.


    Tanenbaum: publishes Linux as technology to make Unix obsolete and query architecture.
    In the using Linux, Torvalds adopts an aggressively open-source stance that attracts
    new Linux developers.


    July: 368BSD is 0.1 written by William and Lynne Jolitz, but it is illegal. A
    legal battle begins to determine if there is proprietary code in Berkeley Net
    Release/2, on which 368BSD is based. Some months later, a settlement is reached
    with Berkeley Net Release/3, on which all free operating systems are based.


    ### 1993


    August: Ian Murdock creates a new Linux distribution called Debian, developed
    by a distributed group of volunteers. Debian software can be folded back into
    other Linux distributions, but does not create any significant long-term split
    in the Linux distribution.


    December: FreeBSD 1.0, one of the first stable descendants of Jolitz''s early,
    is released on the web.


