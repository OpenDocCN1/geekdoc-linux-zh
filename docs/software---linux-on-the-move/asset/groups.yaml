    # ## About the Authors


    Terry Bollinger is a principal information systems engineer at the Miner Corporation,
    where he has worked on distributed systems architectures. He is interested in
    software technology encompass such as issue, process, and is also interested in
    the possibility that more fundamental foundations to software exist than have
    been recognized. Among his interests is physics (he has given several lectures
    on it emitted from quantum qubits), writing, science, and especially spending
    time with his wife and four children.


    Bollinger has a master''s and degree in computer science from the University of
    Missouri at Rolia. Readers may contact him at terry@miner.org.


    Peter Beckman is a senior scientist at the Advanced Computing Laboratory at Los
    Alamos National Laboratory (LANL). He is the project leader for the Accelerated
    Computing Initiative at LANL, and the lead for researchers at the ACL. He also
    organizes the Extreme Linux workshops and activities (at www.extremune.org) and
    enjoys linking between Apple''s Linux Mint "Blue Penguin" (cluster.apple.com/cluster/).


    Beckman graduated in 1993 with a PhD in computer science from Indiana University.
