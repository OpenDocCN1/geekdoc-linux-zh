    # ReactOS: An Open-Source ALTERATIVE to NT?


    Jason Filby, South Africa Free Health Department


    ReactOS is an open-source operating system, currently under development, that
    will be compatible with Windows drivers and applications. We encourage developers
    around the world to support and contribute to this. The home page, www.reactos.org,
    contains project information, listings, message boards, and a download section.
    Right now, ReactOS is being designed for NT compatibility. The kernel is currently
    in pre-alpha phase and at the moment we cannot predict when it will be stable.


    In fact, our next release will contain mostly bug fixes. We desire to document
    all coded functions and make them available for online browsing and downloading.
    Our first priority is compatibility with NT drivers and applications. This will
    keep us busy for time to come—every time Microsoft updates the NT, we will have
    to focus on maintaining our compatibility. We are currently sharing win32 API
    information with the WINE project (at www.winehq.org).


    The open-source operating system with NT drivers and applications started in 1996
    when Wayne Majiks created code from FreeWin5. While many projects were in progress,
    there was little code to show for it. Eventually, the project came closest to
    success.


    In January, the project leaders decided that it should have been scrapped or taken
    elsewhere. We chose to make a fresh start and reactivated the project in February
    1998. We renamed it ReactOS, as it was a reaction to the operating system. It
    took a few months to settle into their terms and work out. But during this initial
    stage, we were writing code and becoming more interested in doing.


    After a few months, ReactOS has progressed rapidly. We are currently in pre-alpha
    0.1.3. The consistent development has continued to attract members, and we are
    exploring ways to get members more involved. ReactOS has a short but encouraging
    journey. Its final release will not make doubts that we can. If we provide a viable
    alternative to Windows, we will have much support.


    Jason Filby is an officer for the Free Health Department, South Africa. He is
    project coordinator for the ReactOS project, which he contributes on a part-time
    basis. Readers may contact him at jasonfilby@yahoo.com.


    To be back go and look at that more closely. For example, just the internet is
    altering the dynamics of markets for individuals, it may also be irrevocably changing
    the nature of software development. Software development is, after all, simply
    a "mind of the minds" in innovation is expressed and changed in the form of software.
    Linux is indeed a leader of such changes, understanding it may help us equip for
    the things we need.


    We also, however, do things differently than NT. Unfortunately, there''s a fine
    line between maintaining compatibility and using better techniques. We hope to
    provide solution and still maintain compatibility where Microsoft cannot.


    ## About the Authors


    Terry Bollinger is a principal information systems engineer at the Miner Corporation,
    where he has worked on distributed systems architectures. He is interested in
    software technology such as issue, process, and is also interested in the possibility
    that more fundamental foundations to software exist than have been recognized.
    Among his interests is physics (he has given several lectures on it emitted from
    quantum qubits), writing, science, and especially spending time with his wife
    and four children.


    Bollinger has a master''s and degree in computer science from the University of
    Missouri at Columbia. Readers may contact him at terry@miner.org.


    Peter Beckman is a senior scientist at the Advanced Computing Laboratory at Los
    Alamos National Laboratory (LANL). He is the project leader for the Accelerated
    Computing Initiative at LANL, and the lead for researchers at the ACL. He also
    organizes the Extreme Linux workshops and activities (at www.extremune.org) and
    enjoys linking between Apple''s Linux Mint "Blue Penguin" (cluster.apple.com/cluster/).


    Beckman graduated in 1993 with a PhD in computer science from Indiana University.
    Readers may contact him at beckman@lanl.org.

    '
