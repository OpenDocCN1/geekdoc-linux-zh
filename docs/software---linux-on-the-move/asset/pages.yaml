    IEEE Software has to choose Linux not only because it is interesting and timely
    topic, but to provide a bit of a wake-up call to traditional software developers
    who may be a little concerned about Linux and open-source software development.
    The fact that Linux does widely hidden secrets makes it all easy to dismiss it
