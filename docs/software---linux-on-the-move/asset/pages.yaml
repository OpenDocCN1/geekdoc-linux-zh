  md: '# # ReactOS: An Open-Source ALTERATIVE to NT?


    Jason Filby, South Africa Free Health Department


    ReactOS is an open-source operating system, currently under development, that
    will be compatible with Windows drivers and applications. We encourage developers
    around the world to support and contribute to this. The home page, www.reactos.org,
    contains project information, listings, message boards, and a download section.
    Right now, ReactOS is being designed for NT compatibility. The kernel is currently
    in pre-alpha phase and at the moment we cannot predict when it will be stable.


    In fact, our next release will contain mostly bug fixes. We desire to document
    all coded functions and make them available for online browsing and downloading.
    Our first priority is compatibility with NT drivers and applications. This will
    keep us busy for time to come—every time Microsoft updates the NT, we will have
    to focus on maintaining our compatibility. We are currently sharing win32 API
    information with the WINE project (at www.winehq.org).


    The open-source operating system with NT drivers and applications started in 1996
    when Wayne Majiks created code from FreeWin5. While many projects were in progress,
    there was little code to show for it. Eventually, the जल्द and the project came
    closest to success.


    In January, the project leaders decided that it should have been scrapped or taken
    elsewhere. We chose to make a fresh start and reactivated the project in February
    1998. We renamed it ReactOS, as it was a reaction to the Microsoft operating system.
    It took a few months to settle into their terms and work out philosophical issues.
    But during this initial stage, we were writing code and becoming more interested
    in doing around.


    After a few months, ReactOS has progressed rapidly. We are currently in pre-alpha
    0.0.1.3. The consistent development has continued to attract new members, and
    we are exploring ways to get members more actively involved. New code development
    has temporarily slowed down and we have got to fix bugs and doc


    We also, however, do things differently than NT. Unfortunately, there''s a fine
    line between maintaining compatibility and using better techniques. We hope, to
    provide compatibility where Microsoft cannot. For example, many Linux users prefer
    products that don''t support 100% per cent Java. Microsoft is integrating it into
    the operating system, thereby showing out competitors. In some cases, ReactOS
    will provide a solution and still maintain NT compatibility with drivers


    ReactOS has a short but encouraging journey. Its final release will not make doubts
    that we can. If we provide a viable alternative to Windows NT, we will have much
    support.


    Jason Filby is an officer for the Free Health Department, South Africa. He is
    project coordinator for the ReactOS project, which he contributes on a part-time
    basis. Readers may contact him at jasonfilby@yahoo.com.


    Continued from page 33


