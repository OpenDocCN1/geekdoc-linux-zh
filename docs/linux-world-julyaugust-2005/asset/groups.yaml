    # Birmingham bets on Linux


    UK City Council is migrating to Open Source, 1,500 desktops to costs and save
    taxpayers'' money.


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_33_0.png)


    Birmingham City Council has launched one of the UK''s most ambitious open-source
    trials to date, shifting 1,500 client computers and adequate server infrastructure
    to Linux and other open-source software.


    The project is expected to generate objective information on open source benefits,
    according to the UK city''s council. The Office of the Deputy Prime Minister (ODPM)
    via the e-innovations program is funding the trial, which is part of a wider project
    called Open Source Academy.


    The Academy, announced in April this year, is also setting up infrastructure such
    as a code repository, database of open source suppliers and an accreditation program
    for open source, in order to make open source an easier option for local authorities.
    The Academy hopes open source will mean more efficiency gains and cost savings,
    promote inter-operability and open


    standards, avoid proprietary lock-in, reduce duplication work amongst local authorities
    and extend hardware life.


    Birmingham will be migrating 1,500 clients in its library to open source software
    including GNU Linux operating system, and such application software as the Firefox
    browser, office suite and the Firefox details are yet to be worked out. The PCs
    will include public-access desktops around the city, as well as the city''s server-side
    infrastructure.


    Unlike University''s open source project under the auspices of the Academy — Bristol
    City Council''s mission of 5,000 desktops to StartRunning on Windows — Birmingham
    will be open source through and through. This is really the rubber hitting road,
    says Mark Taylor of the Open Source Consortium, an advocacy group


    that has an advisory role with several of the Academy''s projects. "Birmingham
    has the biggest metropolitan council in the UK and Europe, and it is rolling out
    a complete production business system


    The council is currently putting together a usability study and will begin rolling
    out the systems later year. The trial will be followed by an impartial evaluation,
    taking into account productivity and ongoing costs such as training and hiring
    IT staff


    While a number of local authorities are already using open source — usually on
    the server — the benefits have not been made clear enough, according to Taylor.
    One of the major deliverables of this is having an unbiased study. Here''s what
    we have done and here are the good and bad aspects of it," says A lot of councils
    are just objective case studies in the industry.


