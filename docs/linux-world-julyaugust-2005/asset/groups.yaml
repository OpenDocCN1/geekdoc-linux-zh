    # Red Hat releases Directory Server


    Red Directory Server is acquired by Red Hat from the Network Security division
    of America in September, 2004. The proprietary code is now available as open source,
    licensed under the GPL Red Directory Server. It has been developed and packaged
    as an integrated, secure solution for Red Hat Enterprise, the Linux-UX/11 operating
    environment on HP Integrity and HP 9000 servers, and Sun''s Solaris systems.


    Paul Comer, Executive VP of Engineering at Red Hat said: "We are announcing a
    massively scalable, secure, reliable, and open source directory server based on
    proven technology We have proved to offer customers this cost effective, high
    performance solution in a market where none were previously needed."


    Red Directory Server is available using the same annual subscription model as
    Red Hat Enterprise Linux.


