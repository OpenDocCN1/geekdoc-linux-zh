    # 产品细分


    ## IBM 为中小企业（SMB）推出安全应用


    - IBM 正在针对其部分产品线推出一系列捆绑应用程序和托管服务。


    第二个方案 eServerOpen 专注于按需提供恶意邮件安全和基于网络的病毒防护。


    第一种解决方案是 IBM 快速安全托管服务（IBM Express Managed Services for Security），这是一项针对中小企业的服务，旨在帮助减少通过互联网传输邮件的安全风险。该服务会在允许邮件进入本地网络之前，对小公司的电子邮件进行垃圾邮件和潜在危险材料的扫描。


    该产品由 IBM 的 eServerOpen 700 系统和 MPP（消息处理平台）组成，后者由 IBM 合作伙伴 MessageSphere 开发。MPP
    是一种电子邮件安全应用程序，具有内置归档功能，并与大多数网络以及无服务器化公司的官方客户端协同工作。


    > “这是为那些不想自己处理此功能的公司设计的。它就像一个洗车场，水在里面变脏，然后从另一端出来，”IBM 全球中小企业营销总监 Elaine Case 说道。


    捆绑产品的价格为每月 49.99 美元，或分 36 个月每月 144 美元；对于中型企业，租赁 36 个月的价格为每月 299 美元或 537 美元。


    该服务将根据所需的服务水平按席位每月计费。250 到 499 个席位之间的定价，如果选择了所有四个可用服务，价格为每月 4.25 美元到 24 美元。


    根据公司研究和行业研究人员的数据，中小企业在产品和服务上的支出预计在 2006 年将达到 50 亿美元，较 2005 年的 18 亿美元有大幅增长。


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_48_0.png)


    # Linux 驱动的 PlayStation 3


    > 索尼娱乐总裁久保健司在一次采访中提到，PlayStation 3 将自然地运行 Linux。如果是这样，它将与硬盘（HDD）捆绑。“但由于 Linux
    需要硬盘才能运行，”久保健司表示，[PS 3] “我们不会排除它，因为无论这对于市场用户来说成本有多高。”


    目前尚不清楚指的是此前已知的事实（PS3 将没有内置驱动器），还是指示该设备将不会配备在 E3 上展示的 2.5 英寸硬盘。


    # Xandrops 采用 Linux 优化


    - IBM 正在针对其部分产品线推出一系列捆绑应用程序和托管服务。


    第二个方案 eServerOpen Network-mail 邮件安全专注于按需提供恶意垃圾邮件和基于网络的病毒防护。


    第一种方案是 IBM 快速安全托管服务（IBM Express Managed Services for Security），这是一项针对中小企业的服务，旨在帮助减少通过互联网传输邮件的安全风险。该服务会在允许邮件进入本地网络之前，对小公司的电子邮件进行垃圾邮件和潜在危险材料的扫描。


    该产品由 IBM 的 eServerOpen 700 系统和 MPP（消息处理平台）组成，后者由 IBM 合作伙伴 MessageSphere 开发。MPP
    是一种电子邮件安全应用程序，具有内置归档功能，并与大多数网络以及无服务器化公司的官方客户端协同工作。


    > “这是为那些不想自己处理此功能的公司设计的。它就像一个洗车场，水在里面变脏，然后从另一端出来，”IBM 全球中小企业营销总监 Elaine Case 说道。


    捆绑产品的价格为每月 49.99 美元，或分 36 个月每月 144 美元；对于中型企业，租赁 36 个月的价格为每月 299 美元或 537 美元。


    # Linux 驱动的 Cell 微处理器


    根据公司研究和行业研究人员的数据，中小企业在产品和服务上的支出预计在 2006 年将达到 50 亿美元，较 2005 年的 18 亿美元有大幅增长。


    “原型机是为了证明 Cell 将拥有比传统服务器更出色的性能，”一位 IBM 工程师表示。


    该原型是 Cell 刀片式服务器（Cell Based Blade Server），尺寸为 2 x 4 厘米。每块板配备两个 Cell 处理器、两个 512
    MB DDR2 芯片和两个南桥。Cell 处理器的运行频率为 2.2 和 8.8 GHz。“我们正在实验室以更高的速率演示 Cell 处理器，”该工程师补充道，“如果以
    3 GHz 运行，Cell 的理论性能将达到每块板 200 FLOPS。”


    该服务将根据所需的服务水平按席位每月计费。250 到 499 个席位之间的定价，如果选择了所有四个可用服务，价格为每月 4.25 美元到 24 美元。


