    # 43


    非洲的语言和方言。为什么每个人都必须学习英语？


    其次，这损害了贸易平衡。为什么一个国家每年要在边界之外花费数百万美元？我们难道不应该使用南非的程序员吗？他们可以雇佣当地人员、在当地就业并缴纳当地税款？我们为什么还要为外国软件支付高昂的进口费用呢？


    许多发展中国家负担不起支付美国程序员足够的资金在 във进行软件定制化开发。然而，他们可以在自己的经济基础上开发和使用自己的程序来定制软件。


    我们经常听到关于软件盗版的消息，而发展中国家的盗版现象通常比其他国家更多。其中一些人会想：“为什么我不能免费获得所有的钱并随心所欲地使用呢？”


    问题是三个方面的：世界贸易组织正从软件盗版中受益，这使得公司难以防止盗版；当你无法控制它时，盗版软件就会增长。你免费获得了软件，但没有获得增强、培训或其他你希望展示如何使用软件的其他服务，因此你向你所在的国家传达了一个糟糕的信号。


    使用 Foss（自由开源软件）允许我们构建自己的软件，按我们的意愿使用它，并根据我们的需求进行更改。


    ## 考虑到全球使用的计算机数量及其对变化的依赖，在桌面环境中大规模普及 Linux 的最有说力的理由是什么？


    对于新项目，我不光鼓励人们让本国家已有的项目迁移到 Foss。就此而言，这可能完全是一个“只有付出没有回报”的迁移过程。如果一切进展顺利，你可能会失去许多没有从变化中获益的人，而且所有的测试成本都是值得的。


    另一方面，对于人们尚未接受过培训的新项目，他们还没有产生大量可能需要转换的数据。一切都是新的，你可以告诉他们 Linux 和 OpenOffice 只是长期版本的初级副本。


    说到长期版本，这可能是切换到 Linux 的完美时机。在此之后，对于大多数用户来说，Foss 将是所有的“只有付出没有回报”。


    另一方面，可能有一些 Linux 现在无法做的事情。自从 Linux 有 64 位以来，Linux 在很长一段时间都不会是 64 位（预计在 2008 年或
    2009 年）。


    ## 建立支持措施以确保环境是怎样的体验


    一个训练良好且独立的管理员/VAR（增值服务商）。或者我们需要一个裁缝师，为桌面用户精确地包装他们所需的内容。这对于任何入门级项目都是如此的，在这些项目中，桌面的功能不是读邮件、编辑代码或创建演示文，而是简单的填写表单和从数据库输入数据。人们为什么要为此花费大量的钱呢？


    一个朋友比一家大公司好。他**必须**寻求能帮助他工作的帮助，但他没有时间获取所有需要的代码。所以他回到家里坐在沙发上看看电视。（并不是要表现出偏见，也有女性管理员在工作时做同样的事情）。在深夜，他为他加入的
    Foss 项目做出了贡献。第二天这帮助了他，并发现其他系统也在做同样的事情，网络上还有更多代码可以帮助他这样做。他的表态是：“Maddi，我像你一样这样做，并得到了巨大的回报。”


    ## 人说 Linux 在如今还不是一项技术，而是一个更好的业务问题，考虑到在业务边界内的交付、变更管理以及所需的内容，对于一个开启了战略任务的公司，你将提供什么？


    在我看来，对于一个可以用 Foss 从零开始的新项目，将不再有“迁移”。


    此外，当你在自己了解 Linux 而终端用户并不了解的项目中使用 Linux 时。例如：服务器、dns、文件和打印数据库管理员和经理有时间习惯该系统及其管理。


    ## 企业如何以开源精神从 Linux 中获得多于其付出的回报？


    通过理解大多数公司拥有


    2005 年 7 月 — 8 月 LinuxWorld MEA


    在他们的发生过程中以教科书的方式付费，这奖励了从事这类工作的员工。无疑，公共资助的机构和政府应该免于此类行为。应该建立程序来帮助软件程序和管理员解码他们想要的内容，或者免费编写出他们使用的内容。


    最后，Foss 项目应该被记录和讨论。展示使用 Foss 的节省和投资回报率（ROI）的案例研究将帮助其他公司理解为什么 Foss 符合这一目标。


    另一方面，还有一些运行在这个系统之上的东西对大企业是有价值的。那是卖给大企业的软件，而之前的维护者是一个 Foss 社区。如果他们必须兼顾两者，这难道不是有利的吗？


    # 44 产品段


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_44_0.png)


    # 诺基亚看待基于 Linux 的非手机 Web 设备


    诺基亚 770 是一款用于无线宽带网络的口袋型 浏览器


    - 诺基亚发布了一种用于无线宽带网络的口袋型 浏览器。

