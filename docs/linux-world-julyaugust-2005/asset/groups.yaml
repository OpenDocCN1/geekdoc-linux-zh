    # OPEN TALK


    Interview with Eva Beck, HP


    As the Linux Business Manager for HP''s Technology Solutions Group (TSG) in Middle
    East and Africa, Eva Beck''s role is to drive HP''s strategy and marketing. Eva
    has been performing this role for the last two and a half years, having joined
    HP in 2001 as the Programme Manager for Microsoft DataCenter and Intel Alliance
    Manager. Following is the transcript of a telephonic interview with LWMEA:


    # Leaping ahead with Linux


    > YOU COVER A LARGE MARKET LIKE EMEA. BUT MOST OF THE LINUX ACTION SEEMS TO BE
    HAPPENING IN EUROPE, MORE SO GERMANY, UK AND THE US FROM THE MIDDLE EAST.


    Actually, we are seeing quite some interest from this region. We did a Linux now
    for the Middle East and recently there were 260 attendees. If you look at the
    market size, in proportion, that''s lot of interest. A good proof point for us
    [HP] how important Linux and open source is in general. More and more companies
    are now eager to get into.


    In the past two years, Linux has really taken off in the Gulf. That''s excellent
    news for us. Some customers are a bit hesitant to take the first step, they prefer
    waiting for others to take the risk. On a worldwide level, there is a wide level
    of acceptance. Three years ago people only with pony tails wanted Linux. Two the
    Linux argument moved to TCO and ROI. Now Linux is given and enterprises are taking
    it granted.


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_38_0.png)


    IN TERMS OF PERCENTAGE HOW MUCH OF HP''S GLOBAL LINUX REVENUES COME FROM THE EMEA
    MARKET?


    About 40 to 45%, it''s a pretty substantial number. If you have to split those
    percentages however. If you look at the server market, then its around 42%. If
    you look at the client and workstations side, then it is different. In that case,
    the numbers are bigger. There are more Linux desktops and then clients in Europe
    than in North America. Here are the adoptions rates.


    CAN YOU DRILL DOWN NUMBERS FURTHER FOR THE MIDDLE EAST MARKET?


    LinuxWorld MEA – July – August 2005


