    Linux 的收益。

    - 比较当前环境的成本和收益并做出决定。


    在最高层采用 Linux 的最后一个障碍是 CIO 的舒适度。对于对软件版本感兴趣的 CIO 来说，我们是否准备好将最重要的应用程序暴露在一个同行尚未接受的平台上？此外，尽管
    Linux 与 Unix 密切相关，但员工是针对大型机培训的，转向 Intel 环境的成本将是巨大且巨大的。迁移的情绪以及关于开源模式的


    在一个复杂的环境中，应用程序、数据库及其相关的支持和维护可能占据系统运行总成本的 80%，Linux 和 Intel 节省的成本在这里就不那么重要了。


    开发和支持并没有提供帮助，尽管许多知名供应商（如 IBM、惠尔公司和 Oracle）一直在大声地请求 Linux。


    采用 Linux 意味着这么多，对 CIO 来说是一个个人决定，也是一种风险。这是一个先有鸡还是有蛋的问题，是采用还是支持？是降低成本还是节省价值？稳固的支持至关重要，因为需要能够处理技术问题并寻找答案的内部员工，而供应商并不像
    CIO 那样控制 Linux 的开发。适当的测试至关重要，因为 Linux 运行在一种架构——英特尔芯片——上。


    Sabre 同样在旅行社市场中，像其他 GDS 遗迹一样，在过去的十年中将其超过 40% 的市场份额给了互联网竞争对手——那些基础设施成本更低且为代理商和旅行者提供更低费用的航空公司，”摩根丹利的
    Christopher Gutierrez。“GDS 并没有增长，它们正在为保持光彩而战，”另一位分析师道。JP Securities 董事总经理 James
    Wilson。“Galileo 必须不断提高其处理效率——


