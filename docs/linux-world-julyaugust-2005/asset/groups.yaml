  - '[PAGE 39]


    # “Three years ago, people thought only with pony tails wanted Linux. Two years
    ago, the Linux argument moved to TCO and ROI. Now Linux is given and enterprises
    are taking it for granted.”


    Unfortunately, we can''t. We track the EMEA market as a show.


    WHAT DO I AND MANAGERS HAVE A BIG ISSUE WHEN IT COMES TO LINUX?

    ARE ISSUES LIKE SECURITY, MIGRATION, COSTS STILL ON THEIR CONCERN?


    Their biggest issue is still support. Customers want to call upon one another
    for support. They want to tell different vendors for support. In our Linux strategy
    We want to be the interface for the customer from the hardware, middleware to
    the applications.


    DO WE HAVE LOCAL SUPPORT CENTERS IN THE MIDDLE EAST? MOST CUSTOMERS HAVE TO DEAL
    WITH US OR EUROPE SUPPORT?


    We offer support directly through our partners.


    DO YOU HAVE ANY NEW FOR LINUX INITIATIVES?


    We invested into notebooks. In the past you could run Linux on the laptop, but
    it was painful and tiresome. Diverse, without support. So we preinstalled Ubuntu
    Linux on our laptop and enabled it. Customers can now install it easily and it
    comes with all the functions they need. We want to test the market, so we are
    sharing these things with financial customers in Italy, who want to migrate their
    desktops to Linux. We are seeing this in government organisations all.


    HOW HAS THE RESPONSE TO THE NOTEBOOKS?

    We have a preloaded notebooks with Ubuntu. Customers can use the software either
    from the reseller or do it for free. We expect to see tremendous response from
    the market, with this notebook line. That''s what we got so far. In six months
    time, when we talk again, you will get concrete notebooks. HP is the only one
    with a large Linux hardware portfolio.


    But isn''t that whole issue with Linux and Windows? OEMs include the bundle and
    the cost, so customers don''t need to buy anything. Because it comes with it,
    people end using it and rarely see the need to migrate to Linux. So why would
    they make the extra effort, if they already paid for it?


    People want to use Linux to make the effort. It''s a lot of cost to customers
    and they say its an excellent idea. Earlier, they would spend time trying to configure
    their Linux notebooks, now they don''t need to be preconfigured.


    Most of the customers are coming from the Linux world. Sun has seen their business
    face from the edge of the networks. We see lot of customers coming to Linux on
    x86 servers. A bit tricky because people have lot of personnel in Windows that
    they put quite some effort into training them on Linux. It is possible but a little
    challenging.


    WHAT INTEREST IS HP MAKING TO PUSH LINUX?

    The client is on the side. We have a Big Tug, a project to help scale Linux to
    64-way on a single server. We recently opened an open source utility center in
    France to help prototyping and deploying Linux systems. The feedback from the
    market is exciting. We are making some investments so customers can get buy and
    support for everything they want to do.


    WHICH ARE THE BIG CUSTOMERS WIN HP HAD RECENTLY?


    Continental Airlines, Universities of Oslo, ADMA Oppo, a few stock exchanges,
    Police of lower Saxony and others.


    WHAT ABOUT MARKET SHARE THE VENDORS TO MAKE BIG CLAIMS ABOUT LEADERSHIP IN LINUX?


    That''s something we are really proud of. Everyone says IBM is in Linux, but if
    you look at the numbers we have a true server share of 38% in EMEA. For us, that''s
    the best part of what that HP likes.


    But this server number changes every quarter because it depends on what metrics
    we use, what we are considering and who we talk to, there are how many factors
    you are involved.


    This numbers the total server revenue. This number has been stable since 28 quarters,
    and most of the IBM has had 20 to 22% market share. So its is a kind of indication
    that we are an integral part of the market.


    How about desktops?

    We have workstations, coming with Red Hat Linux a few years. In the years we shared
    with Maverick. Moving forward, customers will have have Linux desktops. That''s
    already in place.


    IBM AND HP SEE TO HAVE THEIR LOCKED ON LINUX. BUT IF YOU ARE BIG LINUX CHAMPIONS;
    SHOW US YOUR OWN MACHINES, LINUX AND MAFRAMES. SO WHAT OF CUSTOMER MIGRATION PATTERNS
    DO YOU SEE?


    DO YOU HAVE ANY TARGETS FOR THIS YEAR?

    The market is growing fast, so we would like to maintain the market share. We
