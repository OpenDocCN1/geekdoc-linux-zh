    are currently deploying the Linux based e-learning platform for Bahrain''s Ministry
    of Education around a quarter of a million users.


    Similarly, Novell has launched a new introductory Linux course designed for academic
    environments that gives institutions tools to promote open source. The course
    covers the objects of Linux exam and certification, an international industry
    credential that offers proof of knowledge in Linux areas, with networking configuration
    directions to the Linux desktop.


    Initial Base Product


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_36_1.png)


    Brent Pinear, IT Coordinator, DWC


    # Unleash Linux


    On the other hand, the Dubai Women''s College (DWC), part of the Higher College
    of Technology in UAE has more conservative approach towards Linux. DWC currently
    uses Linux for a few network services, besides a 15-node open source lab by IBM
    for software engineering students.


    The Linux usage has a base of 250 students, which expects to grow to 290 by the
    next academic year. "We want to use something that is relevant to the market...so
    we haven''t seen any drive for Linux to train our students or its," says DWC''s
    IT Coordinator Brent Pinear.


    Unlike institutions such as Emirates College, where Linux sees no reason to follow
    up.


    Furthermore, there might be a cost saving in using Linux, but we need to negotiate
    for 10,000 licenses for all the colleges," concedes Pinear. "The support issue
    is more important to us. We want to have a team in, so to keep support costs low
    or minimal. There isn''t much Linux to know out there to be assured of getting
    good support."


    # Vendors go to school


    For example, IBM is working with Red Hat to bring universities to teach kids open
    source schools. According to IBM''s research of technology at universities around
    the world we have found some need for open-standards offerings. About 75% of CEOs
    interviewed by Big Blue''s Consulting Services said a lack of quality skills are
    the issues with the greatest impact on their business.


    In the region too, IBM and Integrated Technology Group (ITG), a Jordanian software
    vendor have Edu''s e-learning platform to run on the Linux system. Edu has the
    potential to revolutionize education and learning management in the Middle East.
    We are supporting Edu as part of our e-learning efforts, we will be able to offer
    the service to the regional governments who are now developing. Bashar Kilani,
    Manager of IBM Software Group Middle East and North Africa


    The new version of Edu will enable educational authorities to specify and deploy
    open-standards-based Linux rather than being ''locked'' in proprietary software
    environments.


    # Educational enterprise


    Software providers as SunCard are now trying to get the example. The vendor has
    started by porting its office to Linux and is going to have 1300 institution clientele
    worldwide to work with them to improve the code and share the benefits.


    SunCard seeks despite the recent vendor investment, the issues down to the nature
    of an educational institution.


    > "A lot of universities do not look at IT, in the same way an enterprise does,
    since making profits, competition, reporting to shareholders isn''t high on the
    agenda."


    A couple years ago, Pinear''s concern may have held true, but things are changing.
    Traditionally, IT vendors have closed ties with Universities to seek the best
    young talent, research projects and helping them through corporate IT. Companies
    are now developing relationship to open source.


    LinuxWorld ME — July 2005'
