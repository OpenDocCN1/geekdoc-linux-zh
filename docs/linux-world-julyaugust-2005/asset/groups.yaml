    # 开放式对话 (OPEN TALK)


    对话 Red Hat 首席执行官 Matthew Szulik


    ## Red Hat CEO 谈论业务与应用


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_40_0.png)


    本周当你发现 [SUN MICROSYS] 将以 41 亿美元的价格收购 Storage Tech 时，你是否感到松了一口气？


    MATTHEW SZULIK：我得出的结论是，当人们对重大的收购事实断言时，结果通常会让人大失所望。


    关于整合的问题呢？现在软件行业这种现象发生非常频繁。Linux 行业也会发生这种情况吗？


    我不认为会。


    你不认为你或 Novel（诺维尔公司）会被一家更大的公司收购吗？噢，我对此不进行推测，但我认为开源行业已经处于一个成熟的阶段。我认为经济模型已经枯竭了，因为在我看来，它们是专有软件业务。我很难调和它们可能创造的规模经济。


    我曾有机会在哈佛做过演讲，见了 20 位 IT 预算达到 50 亿或以上的 CIO（首席信息官）。他们都是非常严肃的执行官，其中许多人都有部署，但并没有什么战略性。我的收获是：“天哪！！这仍然处于一个非常早的阶段。”


    所以如果你认为我们会整合非常稳实的技术人才呢？当我们回顾最后两次收购时，我们认为它们具有高度的战略意义。其中一个是在系统领域，这当然很重要。而 Netscape
    [目录服务器] 资产是我们追踪了四年的资产。我们相信构建目录的源码锁经验是关键的[以及交付高级别安全、认证的战略性至关重要]。这对于我们公司来说具有高度的战略意义。


    当我们把你们看作数据库和应用程序服务器时，这对 Red Hat 来说真的是一个非常有吸引力的业务吗？这对我来说并不清楚，坦率地说，我没有听到我们的客户有此要求。


    如果能成为开源软件商业价值的布道者，那就是管理公司去证明相反——即 Linux 初创公司并没有全部毁于一旦，同时还要应对在开源软件社区中取得成功的艰巨任务。


    今天，Red Hat 是独一无二的。毕竟，在其他哪里还能看到一家只有一名员工的公司首席执行官在主旨中登台，还带了一支当地福音合唱团？Szulik 最近在纽奥尔沿举行的
    2005 年 Red Hat 峰会上为他的公司这样做。这种开源信誉与市场能力的独特结合，已成为新一代开源公司的标准，包括 JBoss、MySQL 和 Spike：一个建立在自由软件基础上的成功业务。


    LinuxWorld Media 在纽奥尔沿与 Szulik 会面，以帮助我们理解微软，以及他是否在考虑收购我们，以及我们和开源供应商。


    LWN 一直暗示他们正在进行一项重大收购，甚至在某个时候暗示他们可能考虑收购 Novel。你察觉到了迹象吗？


    那么，你认为 Red Hat 如何超越操作系统提供者的角色？


    LinuxWorld Media 2005 年 7 月


    “当我观察 Unix 竞争对手时，惠（HP）似乎正在淡化他们的 Unix 业务。我们继续从 Solaris 手中夺取份额。我认为证明了障碍的下一个深度竞争对手是微软。”


    2004 年，全球销售的 Unix 系统达到 50 亿美元。当人们问‘你们会增长到超越操作系统吗？’我会说，‘我对这种从 Unix 到 Linux 的迁移并不厌倦。它仍然处于婴儿阶段。’我们希望保持务实，不要过度狂热并忽视华尔街的‘去买
