    ## 使用现有的主板，您构建的 PC 性能可以提升 80% 吗？


    ## 选择 AMD Athlon™ 64 X2，打造更智能 PC


    ## AMD Athlon™ 64 X2 双核心处理器


    我们专为您设计了 AMD Athlon™ 64 X2 双核心处理器。与单内核 AMD Athlon™ 64 处理器相比，在特定的数字媒体和生产力应用中，其双核心可将您的计算性能提升高达
    80%。AMD Athlon™ 64 X2 双核心处理器保持了兼容性，因为我们确保保留了当前的主板和芯片组 939 针架构。因此，我们可以通过降低库存和设计成本来节省资金。


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_16_0.png)


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_16_1.png)


    *© 2005 Advanced Micro Devices, Inc. 版权所有。AMD Arrow 标志、AMD Athlon 64 X2 双核心处理器及其组合均为
    Advanced Micro Devices, Inc. 的商标，其他名称仅供参考之用，并可能是其各自所有者的商标。


    ## 金融服务


    考虑到全球银行的规模和复杂性，迁移到 Linux 是一项艰巨的任务。例如，据报道，荷兰根银行（ABN Amro）在多个平台上拥有超过 150 种不同的应用程序和
    36 个不同的数据库。迁移如此庞大的基础设施可能是一个挑战。


    对于像 HBZ 这样在迪拜做出战略决策的中型银行来说，迁移到 Linux 相当容易。HBZ 依赖于一个核心银行应用程序，该程序可以轻松移植到 Linux 上。在看到
    Linux 在第一线银行的适配后，像您这样的银行现在也发生了变化，“过去几年发生了变化，更多的供应商开始采用 Linux，欧洲有更多公司已成为 Linux
    的成功案例，这里也有更多银行正在积极关注 Linux”。


    ## 为什么金融机构正在选择 Linux？


    “如果我们依赖金融机构的外包服务，很难协调任何研发工作或实验。如果他们的精力都投入到维护、内部支持和现有系统的升级中……Linux 并不完全是亮点。首要任务是超越系统和集成商。如果供应商留在
    Linux 上，他们就不会多麻烦，”Pilleri 说道。


    ### 成本

    费用比 Unix、Windows 操作系统低；其使用广泛通用硬件的能力意味着了比购买专有系统更廉价的替代方案。在大多数情况下，开源软件是免费的。


    “管理所有多个供应商和应用程序本身就是一个挑战……让所有供应商支持他们的迁移并确保运营和足够的节约是非常的，”Pilleri 说，对于大多数公司来说，Linux
    并不是一个失败的问题，这可能需要多年——他们转而转向开源以获得良好的……


    ## 市场趋势


    i-Flex Solutions 作为通过其 FlexCube 产品组合向金融服务行业提供 IT 解决方案的供应商似乎也同意。i-Flex 区域经理 Vinod
    Totawat 表示：“我们现在具备了 Linux 资质，但我们还没有客户。很多人感兴趣，但客户尚未看到大规模的部署。”


    Totawat 认为这取决于市场动态。


    ### 性能

    以较小的足迹提供高性能的能力。Linux 集群、网格计算、可视化以及现在的刀片服务器以较小的足迹代价提供了超级计算机级的性能。


    ## 随着更多 Linux 的成功案例以及不仅是银行的人都在积极关注 Linux”


    ### 开放性

    减少了供应商传统上对我们的杠杆（通过硬件和操作系统耦合），增强了竞争，促进了开放环境和供应商中立性。公司可以下载 Linux 的源代码，这在几年前是不可能的。公司还可以选择支持，来自社区或直接来自供应商。


    Vinod Totawat,

    区域经理，

    i-Flex


    测试了非关键标准以最小化任何风险并削减可预成本。

    几位在具有区域业务的多家金融机构工作的经理不愿具名，尽管他们想打破常规，但他们他们被迫对 Linux 采取保守的方法，因为 IT 决策从总部向下传导需要一段时间时间。


    从供应商的角度来看，佳能的 David Brierley 表示：“对于许多跨国公司来说，公司决策是在美国或欧洲做出的：跨国公司在中东的银行从未是第一。当地银行似乎不像外国对手那样有意识。这可能是因为心态不同，或者因为竞争较少。Linux
    在那里不受关注，但可能需要一段时间才能成为首要任务。”


    来源：Tower Group/ LWIMEA


    2005年8月 LinuxWorld MEA


    * Windows*


    ## 金融服务


    西方市场的规模非常大；合格的人才非常充足；那里大多数地方拥有大型的内部 IT 团队和预算，他们可以进行实验并控制开发。这里（中东）的工作文化更倾向于运营，而较少实验或尝试新系统。他们发现
    Linux 是开源的，这很难推销。因此，这里的公司在边缘领域使用 Linux。

    由于 Linux 处理网络服务的能力已得到认可，它在交易和银行等关键领域的成熟度已在不容疑问的情况下被使用。这种变化现在让人们彼此之间产生了分歧。


    S2 从去年起已在整个中东支持 Linux 和 x86 硬件。


    随着更多的本地支持和硬件供应商，像安曼商业银行（Commercial Bank in Amman）这样的银行在过去一年在其 26 个分行中的 24 个上线了
    Linux，新的开源系统驱动着从柜台机到服务器的一切设备。


    ## 谁在运行 Linux？


    - 瑞信第一波士敦（Credit Suisse First Boston）的 Agora 交易系统运行在 Linux 上

    - 大摩士丹利在该平台上运行了 1000 台服务器

    - 莱曼兄弟（Lehman Brothers）的交易和风险分析在 Linux 上；

    - 盛信（Schwab）在 Linux 上运行其交易系统

    - 高盛拥有多个支持在该平台上交易的软件应用程序；

    - 德累斯银行（Dresner Bank）在其上有风险应用程序；而查斯·盛信在 6 月切换到了 Linux。

    - 芝加哥商品交易所（Chicago Mercantile Exchange）在 Linux 上运行

    - 约旦商业银行在 Linux 上支持 23 个分行

    - Habib Zuric 在 Linux 上运行其基础设施

    - 渣打银行、阿联国际在 Linux 上运行特定部门

    - E-Trade Finance 和花旗集团将其大部分基础设施运行在 Linux 上

    - 纽约证券交易所（NYSE）的 Linux TradeWorks 今日处理了 16 亿股股票

    - Dresden Kleintvart Wassstein 运行在 Linux 上，使用部署在集群中的基于 Intel 的 x86 4000 台服务器

    - 州街银行（State Street）在 Linux 上运行 IBM 的系统

    - 纳斯达克股票市场（Nasdaq Stock Market）放弃了其专有的 SuperEntry 和执行系统，转而采用电子经纪商的开源系统。

    - Plus FinanzService，德国最大的金融服务机构之一已迁移到云服务基础设施及 Linux

    - 爱尔兰领先的银行友立爱尔兰银行（AIB）正在将其 7500 个分行的桌面切换到 Sun 基于 Linux 的桌面系统（JDS）


    借助于一些使用 Linux 处理月度任务的创新公司，这种紧迫感正在增加，而其他人仍在犹豫。HP 中东的电信与金融服务经理 Sandeep Chhabra 在他的观点中表示：“中东的情况是
    Linux 的使用更多是出于技术和战略原因。这里的公司已经充分挖掘了开源的益处。他们限制了可能的……”


    Chabiba，开源赋予了客户定制他们想要的方式。这是一个非常伟大的功能。大多数人不需要额外的工作，只需选取中间件，通过第三方进行定制并部署。

    然而，成功案例的数量寥寥无几。Vander 声称，该地区的公司以某种形式使用 Linux，但由于竞争原因，他们在某些方面避免了使用 Linux。他们最担心的问题是什么？这些大多数公司都有异构环境，通过拒绝
    Linux，他们并没有与其他的操作系统供应商站在一起。


    尽管存在所有机会，正如 Carter 的 Dawson 所示，他们对前景是乐观的。“尽管 Linux 在中东的渗透并不激进，但有趣的是，这可能很快实现。如果
    Linux 最终变得成熟，接受速度会更快，或者采用过程将在两年后开始，那时情况将截然不同，”Dawson 补充道。


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_18_0.png)


    Thomas Reda,

    销售经理

    S2 Systems

    中东


    LinuxWorld MEA – 2005年7月


