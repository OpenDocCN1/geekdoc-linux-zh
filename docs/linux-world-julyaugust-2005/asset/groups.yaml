    \n# 案例研究：金融服务\n\n# 中国最大的银行\n转向Linux系统\n\n根据一位参与交易的行内高管介绍，中国最大的银行计划在其涵盖20,000家网机构的网络中在服务器上部署Linux，这可能是中国见过的最大规模的Linux部署。\n\
    \n据Turbolinx中国总经理周（Claude Zhou）介绍，该银行并未将应用程序切换到微软的Windows操作系统。\n\n这家中国银行已授予了基于TurboLinux\
    \ 7 DataServer的站点许可和前端应用。实施工作将逐步推向中国工商银行（ICBC）的所有20,000家办事处。周先生表示：“这是这些终端中最大的应用规模。”\n\
    \n工商银行并非中国四大主银行中唯一决定部署Linux的银行。例如，中国银行已经在区域性项目中部署了来自TurboLinux和红帽的Linux发行版。\n\n\
    周先生表示，预计会有更多银行效仿工商银行进行大规模部署。作为该国顶级四大银行的另一一家，中国农业银行预计将在下个月内宣布一项与工商银行项目类似的Linux许可计划。\n\
    \n据中国国家级媒体报道，第四家银行——中国建设银行也预计将在今年宣布其IT系统向Linux的迁移。\n\n位于北京的中国工商银行分析师Niels Jiang表示，转向Linux是由于银行对更好的软件性能和更好的供应商支持的需求。目前，这些银行的大多数都在SCO上运行应用程序，并正准备升级系统。“在中国，SCO……\n\
    \n![](img/a883fb7c73397cd76c2dae63f64a20f1_20_0.png)\n\n> 转向Linux是由于银行对更好的软件性能和更好的供应商支持的需求。\n\
    \n+ 根据协议条款，中国工商银行（ICBC）计划在三年内将其所有银行业业务逐步淘汰TurboLinux 7 DataServer操作系统。该交易的财务条款未披露。这笔交易的特殊之处在于其规模：工商银行总资产达6400亿美元，是中国最大的银行，为中国超过20,000家分支机构的1亿个人和800万账户提供服务。当项目完成后，工商银行30,000名员工中的许多将每天访问托管在Linux服务器上的应用程序。\n\
    \n工商银行选择Linux的部分原因是其现有的内部开发的前端应用程序运行在SCO上，而决定将它们迁移到Linux是一项……\n\nWorldMedia 2005年7月—8月\n\
    \n# 意大利银行全面部署企业级Linux\n\n![](img/a883fb7c73397cd76c2dae63f64a20f1_21_0.png)\n\n\
    BPU银行从Unix迁移到红帽企业Linux（Red Hat Enterprise Linux），以减少50%的工作站成本并避免供应商锁定。意大利最大的合作银行集团——大众银行（Popolare）的运营网络已选择在其桌面和服务器上全面实施红帽企业Linux。\n\
    \n该银行正将其所有的8000个Windows客户端迁移到红帽桌面版（Red Hat Desktop）。在该项目中，用基于Intel的PC替换硬件实现了约50%的软件成本节约。\n\
    \n从Unix迁移到红帽企业Linux的系统迁移为硬件和软件带来了供应商独立性，确保了BPU银行在实施符合新行业趋势和最佳实践的设施解决方案时具有更大的灵活性。\n\
