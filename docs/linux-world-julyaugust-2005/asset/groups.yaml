    # NEWS ANALYSIS


    # UK turns to Linux for defence


    New Linux cluster to aid in nuclear simulation


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_28_0.png)


    "management environment," says David Ball, Group Leader, HPC platforms at AWE.
    "These were some of the leading factors AWE''s choice of Linux Networks."


    AWE''s Evolution visualisation cluster consists of Intel E6 processors, with each
    node providing 16 GB of storage. Each rendering node has a PCI interface to a
    Nvidia FX3000 high performance graphics card and contains packages such as Chromium,
    CEI, VTK, and Paraview.


    The visualisation cluster also includes cluster management from Linux Networks,
    Clusterwork and icebox, to provide total cluster management from one interface.


    Linux Networks'' experience delivering landmark status to many of the United States''
    national laboratories such as Los Alamos National Laboratory (LANL) and Lawrence
    Livermore Laboratory (LLNL), with excellent performance, was one of the reasons
    for AWE''s selection of Evolution technology.


    The Atomic Weapons Establishment (AWE) responsible for a key part of the United
    Kingdom''s nuclear defence capability, has acquired Evolution visualisation cluster
    system from Linux Networks. AWE is using the cluster as part of their research
    into new techniques for visualisation data produced by their computer simulations.


    "We are delighted that AWE chose Linux Networks to be our partner in producing
    visualisations in a cluster environment," says Fabio Gallo, Vice President of
    Europe, Middle East and Africa (EMEA) regions. We are committed to meeting the
    needs of the engineering and physics oriented supercomputing centers, and are
    confident we can meet AWE''s requirements for reliable, and easy-to-manage cluster
    systems.


    The high performance computing cluster will play a major role at AWE which is
    responsible for managing the entire life cycle of the United Kingdom''s nuclear
    deterrent since the cessation of underground nuclear testing. The development
    of the UK''s nuclear deterrent is dependent on large-scale computer simulations,
    including the visualisation of scientific and engineering data. Visualisation
    is an integral component of AWE''s technical computing facilities, and is essential
    to the understanding of the massive data produced in simulations.


    With the arrival of high-speed interconnect technologies, such as Infiniband,
    64-bit processors and PCI Express, Linux clusters can be used to build scalable
    graphics engines to generate detailed visualisations.


    > "Visualization and Clusters have moved in the last few years and nowadays have
    to deliver more performance than before. This includes large memory, 64-bit addressing,
    low latency interconnect, Open Source and the most recent development - a mature
    system."


    With the arrival of high-speed interconnect technologies, such as Infiniband,
    64-bit processors and PCI Express, Linux clusters can now be used to build scalable
    graphics engines to generate detailed visualisations.


    LinuxWorld MEA July August 2005


