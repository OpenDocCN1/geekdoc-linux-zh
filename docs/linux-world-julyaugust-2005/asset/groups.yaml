    # 开源崛起者


    Cendant 旅游分销服务如何用 144 台 Linux 服务器取代价值 1 亿美元的大型机并幸存，讲述了这一故事。


    作者：Christopher Koch


    # “围绕开源的、关于其可行性的问题已经成为过去了。”


    在 2003 年夏天，Mickey Lutz 做了一件大多数 CIO（首席信息官）甚至认为不可思议的事。他将其 IT 基础设施的关键部分从大型机和 Unix
    迁移到了 Linux。对于 Lutz 来说，关于技术稳健性的质疑以及缺乏证明这种赌博合理的理由都是站不住道的。“围绕开源及其可行性的问题，在过去已经解决了，”Global
    Agency Distribution Brands 的 CIO Lutz 回忆道。


    具有重大的意义。你可能需要精心构建的基于 Linux 的英特尔服务器群组，以确保单台大型机的威力。此外，Linux 在高交易应用中的采用速度缓慢，导致大型复杂的
    Linux 环境变得更加稀缺，而相比之下，Unix 和大型机等平台则略多。在一个复杂的环境中，应用程序、数据库及其相关的支持和维护可能占据系统运行总成本的
    80%，Linux 和 Intel 节省的成本在这里就不那么重要了。


    “包括 Linux 本身在内的平台，”Lutz 说。这导致了可怕的时刻，包括系统最初变慢，导致航空公司在 7 月的四天内间断无法访问预订应用程序（一次中断持续了约
    45 分钟）。如果你是美联航空且每小时处理 8000 名乘客，你需要计算机一直运行。“即使是极小的停机也是件大事，”，”Lutz 承认道。


    Cendant 同样在考虑 64 位系统，这可能包括从 Red Hat 切换到 SUSE。“Lutz 投入切换的能力很好，”Wiseman 说。成本节约将继续是
    Lutz 的驱动力，但 Wiseman 说，在将 Linux 环境投入生产之前，需要对其进行仔细的测试。这同样适用于其他开源应用程序。


    而且事实是，Lutz 的小组确实需要 Linux 提供的每一分支持，以撤销一个复杂的实时定价应用程序，该程序为全球数百名旅行代理商提供服务，并作为爱尔兰所有票务预订的系统。当这个应用程序在
    Linux 上运行时，它证明了需求是如此巨大——它每秒处理多达 700 次定价请求——以至于它完全重新定义了 Cendant 对让 Linux 运行所需的预期。


    Cendant 还使用开源的 Apache Web 服务器和 Tomcat 容器记录其 CheapTickets.com 的报告。


    很少有 CIO 在现在同意 Lutz 的观点。如今，许多 CIO 都在尝试 Linux，但根据 Meta Group 的数据，世界财富 1000 强中少于
    10% 的公司愿意将其核心基础设施押注在上面——以将 Linux 的企鹅吉祥从可爱变得强壮。


    他们对飞行的恐惧有一些合理的理由。首先，技术挑战


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_53_0.png)


    2005 年 7 月 – 8 月 LinuxWorld MEA


    # 客座专栏


    # 为 Linux 基础设施提供论据


    技术挑战已被证明是值得的。“我们的业务策略是在处理交易时尽可能高效，”他说。“为了做到，我们必须降低技术成本。”Lutz 做到了这一点。节省资金的压力变得无法忍受——由
    Expedia、Travel 等品牌引领的互联网趋势——已成为最强大的力量


    # 决定转向开源时需要考虑的五件事


    从血前边缘到领先边缘

    Lutz 控制着 Galileo，这是一个全球分销系统（GDS），它是 20 世纪 70 年代基于大型机的预订系统之一（以及 Sabre）。


    - 估计在未来一到三年内留在当前环境的成本和收益。- 考虑运营、空间成本以及留在已知平台的收益。

