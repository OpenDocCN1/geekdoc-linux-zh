    诺基亚正转向开源开发者，为其基于 Series 6 移动软件平台的智能手机提供一种新的 Web 浏览器。


    Series 6 是运行在三星手机等设备上的用户界面层。诺基亚将其软件许可给多家公司，包括 IE 电子、联想移动无线通信、三星和西门子集团，因为这种新浏览器可能会主导市场。


    苹果和诺基亚被允许基于项目的源代码进行产品商业化，但必须向其客户提供所销售版本的源代码，包括任何更改或改进。


    该浏览器将包含在 Series 6 软件的未来版本中，它使用了两个已在苹果 Safari Web 浏览器中采用的、并由微软 XP 系统制造的组件。这些组件由
    HTML JS 组成，这是开源项目 Konquer 的两个元素。


    该浏览器运行在 K 桌面环境（KDE）上，这并不是诺基亚首次接触开源软件社区。该项目曾因未以能够供他人获取的形式将其更改回馈给社区（导致他人无法使用）而受到批评，且未提供易于访问的在线代码数据库，尽管开源许可并未强制要求此项义务。


