    # 韩国大力在学校推广 Linux


    “源代码和开放标准对学术界应该非常有吸引力，因为这些倡议中的许多源自大学，”Suncard, SCT EMEA 地区总经理马修修·博伊斯（Matthew Boice）如道。


    这些努力并非仅来自供应商。甚至 Linux 用户组（LUGs）也在积极投入其中，以让更多的学校和学院参与进来。“我们希望积极地让青少年接触开放技术。他们应该拥有在任何系统中工作的自由，而不是被局限于使用
    Windows。开源技术给了他们充分的自由，”迪拜某 LUG 的协调员约翰·约瑟夫（John Joseph）说道。


    这个自筹资金的小组正在向整个阿联酋的学生分发 5000 张免费的 OSS 光盘，并与该地区的学校合作，将信息技术（ICT）整合到设施和学生中。


    目前，供应商和学术界都从中获益。

    “向软件开放并让学术界和开源社区参与，有助于我们创造更多业务。我们正试图建立学术管理体系，让学校能够像任何其他企业一样高效运行，”博伊斯说。


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_37_0.png)


    > 根据韩国信息产业促进局（KIPA）的消息，韩国政府正在推进一项计划，通过部署运行 Linux 操作系统的服务器，到 2006 年为该国 10,000 所学校处理数据。


    根据从去年 10 月开始的一项计划，Linux 服务器已部署用于处理首都首尔 132 所学校的学生事务，首尔的一家非营利背景支持机构 KIPA 开源软件推广中心副主席金圣华（Sungha）介绍道。


    该项目将由韩国教育部和人力资源部开发的一种名为 Woody 的本地 Linux 发行版，取代学生的学术和医疗记录，以降低 IT 成本。该项目涉及国家教育信息系统（NES），最终将安装
    288 台服务器来处理 10,000 所学校的记录。


    项目成本未披露。Woody 于去年推出，由政府实验室电子通信研究院以及七家韩国公司（包括 Linux 软件供应商微软和 Yang 公司）开发。


    根据 KIPA 的数据，韩国越来越多的政府和政府附属机构正在使用 Linux，但与 Unix 和微软的 Windows 操作系统相比，其市场份额仍然很小。


    根据 Yang 提供的数据，韩国主要的 Linux 用户包括国立农业科学院，Linux 占了该机构 95% 的服务器；以及韩国疾病控制中心，Linux 用于了该中心超过一半的服务器。


    他表示，到 2007 年，KIPA 希望看到 Linux 在韩国中央和地方政府运营的服务器中应用比例达到 30%。他说，到那时，政策希望将这一比例提高到 40%。


    Yang 说，目前 Linux 仅用于韩国政府 6% 的服务器上。


    ## 开源工具包：


    - http://www.becta.org.uk/

    - http://www.schoolforge.net/

    - http://moodle.org/

    - http://www.uptortal.org/

    - http://www.freshmeat.net

    - http://edu.kde.org/

    - http://ktzlinux.org/


    2005年7月–8月 LinuxWorld MEA


    ## 开放面对谈


    与 HP Eva Beck 的访谈


    作为 HP 中东和非洲技术解决方案集团（TSG）的 Linux 经理，Eva Beck 的角色是推动 HP 的战略和营销。Eva 在过去的两年半里一直担任此职，她在2001年加入
    HP，担任微软数据中心项目经理和 Intel 联盟经理。以下是与 LWMEA 的电话访谈实录：


    ## 在 Linux 领域领先


    > EMEA 地区（欧洲、中东和非洲）是一个巨大的市场，但 Linux 的行动似乎更多发生在欧洲、德国、英国和中东。


    实际上，我们看到了来自该地区的相当大的兴趣。我们最近在中东有了 260 名参会者。如果你从市场规模来看，这部分的比例很大。[这对 HP 来说]这是一个很好的证明，说明
    Linux 和开源在总体范围内有多重要。现在越来越多的公司正渴望加入其中。


    在过去的两年里，Linux 在波湾地区取得了巨大突破。这对我们来说是个好消息。有些客户还犹豫于迈出第一步，他们倾向于等待他人。在全球范围内，接受程度已经很大。三年前人们只想要
    Linux。现在 Linux 的讨论转向了 TCO（总拥有成本）和 ROI（投资回报率）。现在 Linux 已经得到企业级的认可。


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_38_0.png)


    按百分比来看，HP 全球收入有多少来自 EMEA 市场？


    大约 40% 到 45%，这是一个相当大的数字。如果你必须划分这些百分比，如果你看服务器市场，大约是 42%。如果你看客户端和工作站市场，情况则不同。在这种情况下，数字更大。欧洲的
    Linux 桌面数量比北美更多。


    按百分比来看，HP 全球收入有多少来自 EMEA 市场？


    大约 40% 到 45%，这是一个相当大的数字。如果你必须划分这些百分比，如果你看服务器市场，大约是 42%。如果你看客户端和工作站市场，情况则不同。在这种情况下，数字更大。欧洲的
    Linux 桌面数量比北美更多。


    （注：由于原文后续存在大量重复的乱码段落，已根据要求剔除重复信息，仅翻译了核心连贯内容。）


