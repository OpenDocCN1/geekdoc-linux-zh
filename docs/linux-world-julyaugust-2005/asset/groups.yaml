  mdcn: '


    ## 金融服务


    ## 开源节省资金


    金融服务行业涵盖了银行、资产管理公司、交易所、保险公司和信贷机构，长期以来一直寻求运营效率，同时试图降低成本。这一明确的垂直领域现在正转向 Linux 和开源以来实现这一目标。


    - 根据技术研究机构 Finextra 的数据，在传统保守的金融服务领域，对 Linux 的支持在过去一年增长了一倍多。这家市场情报公司证实，主流参与者对开源的支持使得使用
    Linux 的金融机构数量从去年的 27% 增加到 2005 年的 58%。


    Gartner EMEA 企业服务器研究副总裁 Paul Dawson 同意这一观点。“该领域存在巨大的动力，正在脱离 Sun 公司的 Solaris。Windows
    仍然很强劲，但大多数迁移是从 Unix 转向 Linux 的，因为后者更易用。”Dawson 的公司预测，到 2005 年底，Linux 在所有金融服务中的采用率将达到
    40%。


    事实上，在《2005年金融技术策略》调查中写作的研究人员表示，对 Linux日益增长的支持是过去 12 个月内金融机构发生的最单一技术变革。


    ## 第一阶段


    当金融公司发现通过结合免费开源代码和低成本的 x86 芯片，可以获得与大多数昂贵的专有 Unix 和大型机服务器相当的输出时，一些公司开始采用它以降低成本。另一些公司这样做是因为其移植性可以标准化他们碎片化的环境，并改造他们老旧的遗留系统。


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_13_0.png)


    结果是，3,800 美元处理器的 Linux 服务器运行速度可以达到 250,000 美元 Sun 6500 的两倍。为了应对廉价商品服务器的冲击，Sun
    现在正在基于 Solaris 运行基于 AMD 驱动的更低成本 x86 服务器。


    例如，美国最古老、最大的合伙银行 Brown Brothers Harman & Co. 在两年前将 Linux 列入关注范围。在转型之前，Brown Brothers
    选择了 Solaris，而 Open Linux 服务器布在 2003 年迅速扩散，部署在其数据中心业务中，并引发了对成本控制、安全和稳定性的担忧。


    此外，该公司在运行 IBM z 系列大型机上运行 IBM DB2 数据库，并在 Sun 的 Linux 上运行 Solaris/OpenSolar 软件来处理交易处理。当订单完成后，它会通过这个系统传输。


    纽约花花集团（Citigroup）技术基础设施小组高级副总裁 Aaron Graves 表示，虽然花花集团决定使用其现有的大型机，但他们转向 Linux 将负载扩展到大型机硬件之外。花花集团将
    Linux 视为一种通过在一台 IBM z 系列上运行许多 Linux 虚拟机服务器来超越大型机平台的方法。


    前行的道路是不可置信的。“Linux 的优点在于它可以从供应商和社区获得多种方式的支持，而且不仅仅围绕它，”Levin 说。


    当被问及使用开源和 Linux 的“风险”时，Levin 回答道：“我们拥有数百万的资产，并且受到地球上每个地方的监管，你怎么想？如果我们失败了，我将在 Citrix
    上解释我的错误。”


    “在 2003 年上半年，Linux 的局部应用还没有硬件因素来驱动我们的业务、战略或服务器，只有一些 Web 服务器、一位经理和一个因特网关，”Brown
    Brothers 基础设施高级副总裁 Jeff Levin 说。“转向 Linux 的收益约为 800 万美元。稳定性和安全性也得到了解决，我们还练习了内部技能组，”Tech
    Summit 补充道。


    在采用 Linux 之前，该公司花费了几个月时间处理与转向开源相关的法律问题，新公司技术副总裁 Aaron Graves 表示。“对于我们来说，要理解开源支持合同意味着什么。这真的是一种不同的模型，”他说。


    5 月最近举行的 Linux 峰会证实了这一天，Linux 已经成为一个非关键任务的平台。


    ## 供应商行动


    即使是纳斯达克（Nasdaq）股票市场也放弃了其专有系统，转而使用 Red Hat 提供的 Linux 版本来实现其非关键业务。合作伙伴 预测到 2005
    年底，Linux 在所有金融服务中的采用率将达到 40%。


    HP 和 Red Hat 合作在 Sun 的 Linux 上运行 Solaris 操作系统，让金融机构可以获取深度信息。


    Gartner EMEA 企业服务器研究副总裁 Dawson。


    在 Sun 的 Linux 上运行 Solaris 软件，处理交易。每秒 90,000 次到 120,000 次交易，每个 Linux 实例。


    花花集团在 IBM z 系列上运行许多 Linux 虚拟机服务器，在 Linux 环境中见证了卓越的成果。


    IBM 和 Red Hat 合作，在 Sun 的 Linux 上运行 Solaris。Blue 正在与两家金融服务供应商合作，帮助他们实施 Linux 项目。到目前为止，他们已将
    88% 的总业务迁移到 Linux。


    ## Unix 转向 Linux


    ## 银行业行业


    欧洲的许多银行正在使用 Linux 来降低成本并保持安全。意大利的 BU Banca 与 Red Hat 达成协议，将其所有桌面电脑和服务器迁移到 Linux。甚至德国最好的金融服务公司
    Finance GmbH 也已经迁移了其核心 Web


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_14_0.png)


    ## Linux 桌面进入


    当爱尔兰的牛奶银行爱尔兰联合银行（AIB）放弃其柜员使用的 Windows PC 转而使用基于 Linux 的终端时，分析师表示一种 IT 保险正在金融服务领域出现。


    AIB 在柏林与 Sun 签署协议，将其 3,500 家分支的计算机迁移到 Linux 桌面系统（JDS）第2 版本。


    通过与当地合作伙伴，Horizon Open Systems 和 Sun 将在年底之前将系统引入爱尔兰和英国，Jun 将作为银行新分支平台的一部分授权他们的终端，这将是柜员与所有应用程序的界面。


    这家爱尔兰银行服务许多社区以及像他们一样需要更好消费者服务的小企业。金融机构帮助农民增长至关重要。


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_15_0.png)


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_15_1.png)


    LinuxWorld ME – 2005年8月


