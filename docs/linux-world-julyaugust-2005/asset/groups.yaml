    ![](img/a883fb7c73397cd76c2dae63f64a20f1_28_0.png)


    “管理环境，”AWE HPC 平台小组负责人 David Ball 说道，“这些是 AWE 选择 Linux Networks 的一些领先考虑因素。”


    AWE 的 Evolution 可视化集群由英特 E6 处理器组成，每个节点提供 16 GB 的存储空间。每个渲染节点都通过一个 PCI 接口连接到瑞达 FX3000
    高性能显卡，并包含了 Chromium、CEI、VTK 和 Paraview 等软件包。


    该可视化集群还包含了来自 Linux Networks、Clusterwork 和 icebox 的集群管理功能，以便通过一个接口提供全集群管理。


    Linux Networks 在为美国许多国家实验室（如洛斯阿拉莫斯国家实验室 LANL 和洛伦斯·利弗莫实验室 LLNL）提供卓越性能并实现里程碑地位的经验，是
    AWE 选择 Evolution 技术的原因之一。


    负责英国核防御能力关键部分的原子武器管理局（AWE）已从 Linux Networks 获取了 Evolution 可视化集群系统。AWE 正在使用该集群作为对其计算机仿真产生的可视化数据新技术的研究。


    “我们很高兴 AWE 选择 Linux Networks 作为我们在集群环境中制作视觉化的合作伙伴，”欧洲、中东和非洲（EMEA）地区副总裁 Fabio Gallo
    说道。“我们致力于满足面向工程和物理的超级计算中心的需求，并有信我们可以满足 AWE 对可靠且易于管理的集群系统的要求。”


    自停止地下核试验以来，高性能计算集群将在负责管理英国核威慑整个生命周期的 AWE 发挥重要作用。英国核威慑的发展依赖于大规模计算机仿真，包括科学和工程数据的可视化。可视化是
    AWE 技术计算设施不可或缺的组成部分，对于理解仿真中产生的海量数据至关重要。


    随着诸如 Infiniband、64 位处理器和 PCI Express 等高速互连技术的到来，Linux 集群现在可用于构建可扩展的图形引擎，以生成详细的可视化结果。


    > “可视化和集群在过去几年里发生了巨大变化，如今必须比以前提供更高的性能。这包括大内存、64 位寻址、低延迟互连、开源以及最新的发展——一个成熟的系统。”


    随着诸如 Infiniband、64 位处理器和 PCI Express 等高速互连技术的到来，Linux 集群现在可用于构建可扩展的图形引擎，以生成详细的可视化结果。


