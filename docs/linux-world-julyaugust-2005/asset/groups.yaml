    # South Korea pushes forward

    with Linux for schools


    source and open standards should be of great interest to the academia, because
    many of these initiatives started out from universities," says Matthew Boice,
    General Manager, Suncard, SCT EMEA.


    The efforts are not coming from vendors alone. Even Linux user groups (LUGs) are
    pitching in to get more schools and colleges involved. "We want to get youngsters
    educated in open technology actively. They should have the freedom to work in
    any system, not be bound to use Windows instead. Open source technology gives
    them ample freedom," says John Joseph, Coordinator for one of Dubai''s LUGs.


    The self-funded group is distributing 5000 Free OSS CDs to students across the
    UAE and working with the region''s schools to integrate Information Technology
    (ICT) to the facility and students.


    At this point in time, both vendors and academia are facing the benefits.

    Opening up to software and getting the academia and open community involved is
    helping us generate more businesses. We are trying to establish academic administrations
    so schools can operate with the same efficiency as any other enterprise," says
    Boice


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_37_0.png)


    > The South Korean government is moving forward with a program to roll out servers
    running the Linux operating system that will handle data for 10,000 of the nation''s
    schools by 2006, according to the Korea IT Industry Promotion Agency (KIPA).


    Under a program that started last October, Linux servers have been deployed to
    handle students for 132 schools in Seoul, the national capital, according to Sungha,
    vice president of KIPA''s Open Source Software Promotion Center, a nonprofit-backed
    agency in Seoul.


    The project will replace Linux students'' academic and medical records with a
    local distribution of Linux called Woody, by South Korea''s Ministry of Education
    and Human Resource Development to cut IT costs. The project, which will involve
    the National Education Information System (NES), will ultimately involve the installation
    of 288 servers to handle records for 10,000 schools.


    The project''s cost was not disclosed. Woody was introduced last year and was
    developed by the Electronics and Communications Research Institute, a government
    laboratory, and seven South Korean companies, including Linux software vendor
    Microsoft, Yang.


    A growing number of government and government-affiliated organisations in South
    Korea are using Linux, but however have a small share of the market compared to
    Unix and Microsoft''s Windows operating system, according to KIPA.


    Major Linux users in South Korea include the National Institute of Agriculture
    where Linux accounts for 95% of the institute''s servers, and the Korea Center
    for Disease Control and Prevention, where Linux is used on more than half of the
    center''s servers, according to figures provided by Yang.


    By 2007, KIPA hopes to see Linux used on 30% of servers operated by central and
    local government in South Korea he said. By then, the policy wants to raise this
    to 40%, he said.


    At present, Linux is used on 6% of the South Korean government''s servers, Yang
    said.


