    # 25


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_25_0.png)


    作为商业供应商，开发者并不是受客户满意度数值或黑客潜能的驱动，而是通过参与供应商列表以报告软件中的漏洞和缺陷。尽管在推出新技术时，管理在历史上往往是事后考虑，但耶鲁大学的
    Bee 建议，标准化开源发布有助于简化管理并确保以后获得更好的性能。如果你有不同的……，情况会很快变得混乱。


    “在我们向银行发布某些东西之前对其进行检查是值得的，”休斯顿维多利亚国家银行的网络工程师 Kerry Miller 说道，“我们喜欢先在测试环境中为所有人运行程序，然后让几个用户试用一下，最后在我们……之前。”


    从这里开始，对一种发行版进行标准化


    # 低成本 Linux 电脑

    # 面向大众的 Linux


    供应商将使用一系列廉价的 Linux 桌面电脑、客户端和终端，价格低于 25 美元，并以市场价格捆绑软件。这对于削减 IT 硬件和软件成本的中小型企业、政府甚至企业来说可能是一个大利。


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_26_0.png)


    为了争夺发展中国低成本市场份额，许多供应商正在引入专门设计的产品，提供更低的启动成本、更易于管理和维护。这些基于 Linux 的产品预计将于今年上市。


    去年统计显示，印度的桌面电脑数量达到了 90 万台


    为了开发此类市场，来自班加罗尔的 Enforce 在新千年印度技术设计计划（New Millennium Indian Technology Design
    Initiative）的指导和资金支持下推出了 Mobile。


    Linux 移动设备及其两个变体——Mobile Wireless 和 Soft，提供了价格实惠的超廉价桌面产品，价格在 220 美元到 535 美元之间，取决于配置。这三者都针对想要运行常规任务的非用户。


    Mobile 配有 7 英寸 VGA LCD 屏幕，成本接近，同时在移动时拥有全尺寸笔记本电脑键盘，可以作为桌面支架使用。它由基于 Intel X-Scale
    架构的 PA555 处理器驱动，具有 msoffice、屏幕闪存存储以及可选的 GPS 或模拟调制解调器。


    此外，Ubuntu 提供了带有 GPS 和无线调调器的内置 PC。这些设备还提供集成的智能卡读/写能力。第三种产品 Soft 是一种非常紧凑的桌面设备，专为日常工作不再需要当今高速
    PC 的成本和笨重性的办公室设计。


    南印另一个列表级示例是，它正在开发一种售价约为 100 美元且没有移动部件的 Linux 瘦客户端。随着公司的激增，市场中低成本计算的最可行方案将是在网络上的
    Linux 服务器上运行一个简单的设备。Novatum 的发言人说，在这些市场，除了低价格外，管理性也至关重要。


    Novatum 的瘦客户端从底层开始构建，并配备了由 Novatum 内部设计的处理器。除了支持技术设计外，瘦客户端还支持多媒体应用，如视频流。Novatum
    的目标是将计算作为一种公用事业通过细网络进行传输。


    硬件供应商 Via Technologies 想要引入一系列面向印度和中东用户的低成本电脑设计。


    印度国家经理 Ravi Pathrai 说，Tencent 项目计划引入三种不同的产品，这些将使用 Linux 产品和机箱。价格将在 500 美元到 550
    美元之间，并将今年九月与 JPS 等公司一起在印度推出。


    Via 的第一线产品将运行 Linux 以降低成本，公司可能会考虑在以后提供带有 Windows 的产品。


    Tencent 系列计划推出一款特色 PC，售价为 250 美元，包括一个驱动器和一个显示器。它还具有基于闪存的多用户内存，专为宽带互联网应用设计，例如基于
    IP 协议的 VoIP。


    迹象表明，该公司将以印度品牌营销这些产品。Via 正在与印度当地公司谈判制造这些产品。Via 还将提供带有闪存的低端产品。这些产品将包含用于管理的已开发的
    Linux 软件。未来，Via 正在为 Terra PC 客户开发一系列产品组合，针对特定应用程序，如网吧。


    > 在印度，售价 400 美元，但如果由于质量差、维护和软件成本导致运行不畅，其总拥有成本（TCO）要高得多，Encore 主席 Vijay Deshpande
    说道。


    > 降低电脑的……整体成本是挑战。我们提供了六个月的备份系统和可选的硬盘，因为印度的电力很差，特别是在农村地区。


    > 我们的产品不是 PC，因为该术语包含了 Windows 的使用和 PC 配置的维护


    所有三种产品都内置了本地语言支持、办公套件、人员信息管理器、电子邮件、BW 同步或良好的文本转语音，且无需额外费用。


    Encore 推出了 Simple，这是一款售价 500 美元的 Linux 硬件电脑。该产品在市场上的表现并不理想，自商业发布以来大约只有 500 台，Deshpande
    说，市场对产品有需求。


    Mobile 增加了三个大客户，如 ITC（用于教育）、Re 电车公司（用于）和南非学生。


    对于发展经济体的廉价 PC，Encore 并不孤单。据报道，Intel 正在设计一种可以使用汽车电池运行的 PC。其他供应商也在测试低成本计算模型。Novatum
    这是一家初创公司


    LinuxWorld EMEA 2005 年7 月、8 月


    # 下年 100 美元的 Linux 笔记本电脑


    开发和销售 100 美元 Linux 笔记本电脑的 Media Lab 项目预计将在 2006 年推出首批机器。


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_27_0.png)


    马萨诸塞理工学院的一项雄勃任务


    Koetz 说，开源软件通过了与商业产品相同的“足够好的安全测试”，但她可以采取额外措施来确保你网络上开源软件的安全。


    源会对安全漏洞做出广泛响应，”她在商业产品通过的“足够好的安全测试”中写道，但她补充说


    一个“陷阱”是提前检查，”她说 Windows 应用程序在迁移到 Linux 后性能将是一样的。


