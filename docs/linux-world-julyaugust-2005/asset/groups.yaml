    cost by 50% and avoid vendor lock-in. The operational network of the bank Popolare
    in Italy, the largest co-operative banking group, has chosen to implement Red
    Hat Enterprise Linux across its desktops and servers.


    The bank is migrating all of its 8000 Windows clients to Red Hat Desktop. In this
    project replacing hardware with Intel-based PCs achieved software cost savings
    of about 50%


    The migration of its systems from Unix to Red Hat Enterprise Linux also delivers
    vendor independence for both hardware and software, ensuring BPU Banca greater
    flexibility when


    implementing infrastructure solutions that comply with new industry trends and
    best practices. The migration will enable the use of PCs in dual-boot mode to
    support Linux and Windows without additional cost


    "This project is the most important migrations to Linux in the Italian financial
    sector," says Roberto Simplicityi, Account Executive Red Hat Italy. BPU Banca
    is a clear proof-point of the advantages guaranteed by Red Hat Enterprise Linux
    product family, opening the path to future Linux


    implementations in this market sector. Using Red Hat Enterprise Enterprise Linux
    systems will allow BPU Banca to easily manage servers and workstations virtually
    anywhere via a Web interface. BPU Banca will conclude its migration from Unix
    to Red Hat Enterprise Linux by the end of this year.


    Future plans include widening its migration to Red Hat Enterprise Linux to encompass
    the group''s entire infrastructure.


    > This project is one of the most important migrations to Linux in the Italian
    financial sector.

