    此类设备（包括 Research Motion 的 BlackBerry 和 PalmTree）对工作人员来说变得越来越重要，并正推动手持市场的复苏。根据
    Career Today 报道，将创建北美和亚洲使用的 CDMA 手机技术的高通公司将为 MSM650 系统上芯片支持 Linux。该系统支持多个 CDMA
    手机型号以及 BREW 操作系统开发计划、UMTS、宽带和 CDMA2000 ix EV-Dev Ro A。Linux 是第一个支持高通产品的第三方操作系统，但不会是最后一个。“我们正在扩展客户的软件开发，以满足对
    Linux 以及第三方操作系统日益增长的需求。”


    与使用嵌入 Windows 操作系统的 WISE 不同，Win4 使用实际的代码副本来运行兼容 Windows 的应用程序。因此，该公司表示，“Win4 可以在无需移植、重写甚至仿真的情况下免费运行‘数十万个
    Windows 应用程序’。”此外，来自微软的 Windows 操作系统也已无缝集成。


    高通表示，这种解耦集成芯片组消除了运行高端操作系统通常需要的协处理器，并为制造商提供了相对廉价的硬件平台。


    高通加入了包括摩托罗拉和 DoCom 在内的主要公司，共同加入 Linux 行列。摩托罗拉在去年夏天推出了其第一款基于 Linux 的手机。这种开源操作系统提供了通过与其他软件开发者合作来降低开发成本的机会。该系统还避免了目前主导市场的三星和微软所收取的许可费。IDC
    预计到 2006 年，Linux 将控制超过 4% 的智能手机操作系统市场。


    支持将将跟进高通芯片。该公司承诺将实施“激进的更新计划”，其中包括对 Windows XP 的增强支持。


    LinuxWorld — 2005年7月

    Wei Wu


    ## 卡巴斯基反病毒软件

    Linux 版本 3.5


    安全供应商 Kaspersky Lab 发布了三个新版本的卡巴斯基反病毒软件，旨在保护运行 Linux、FreeBSD 和 Open BSD 系统上的电子邮件和文件服务器以及工作站。这些解决方案可以检测并消除文件服务器、工作站和邮件服务器上所有对象中的恶意代码。用户友好功能包括灵活的反病毒保护配置和反病毒数据库的自动更新。


    Kavmonitor（访问扫描器）是一个完全非内存扫描器，支持实时系统监控并识别所有可疑对象，降低了恶意软件渗透网络。在更新的版本中，可以在三种反病毒类型之间进行选择：标准、开放和安全。风险软件——如广告软件或合法软件也可以被黑客检测。反病毒数据库和更新方法实施了新技术，包括检测数据库的灵活性和易用性。这减少了网络流量并提升了产品性能。多项创新显著提高了工作站、文件的处理效率。


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_47_0.png)


    John Roberts

    Sugar CRM 执行官


    ## Sugar Suite 3.0


    - 高通将在其下一代手机中支持 Linux —— 此举可能会提高高性能手机的运行速度。


    - Sugar CRM 发布了其开源 CRM 平台的新版本 Sugar Suite，增加了活动管理、电子营销和预测工具。新的 Sugar 3.0 引入了文档管理、员工目录功能和易于协作的功能，外无线访问选项。


    供应商价值：

    > “Sugar 将我们带到了新的层次。通过它，我们提供了一个开源 CRM 平台，能够以更低的价格和对源代码的完全访问，与任何专有应用程序竞争。”——Sugar
    CRM 执行官 John Roberts。


    Sugar 专业版 3.0 提供托管版本 Sugar On-Demand（每月 39.95 美元，消除了硬件和维护成本），以及 Sugar Cube（这是一种即插即用的独立服务器，包含
    Sugar 专业版和所有支持应用）。


    ## 红帽发布目录服务器


    Red Directory 服务器于 2004 年 9 月从美国网络安全部门被红帽收购。现在，该专有代码以开源形式发布，遵循 GPL 许可。它已开发并封装为红帽企业、HP
    Integrity 和 HP 9000 服务器上的 Linux-UX/11 环境以及太阳 Solaris 系统的集成安全解决方案。


    红帽工程执行总裁 Paul Comer 表示：“我们宣布了一种基于成熟技术的大规模可扩展、安全、可靠的开源目录服务器。我们已经在此前缺乏此类解决方案的市场上，为客户提供了这种成本效益、高性能的选择。”


    Red Directory Server 采用与红帽企业 Linux 相同的年度订阅模式。


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_47_1.png)


    2005年7月–8月 LinuxWorld MEA


