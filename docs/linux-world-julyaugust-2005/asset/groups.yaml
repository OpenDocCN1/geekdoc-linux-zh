    # $100 Linux laptops next year


    The Media Lab project to develop and sell a $100 Linux laptop is expected to see
    the first machines available in 2006.


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_27_0.png)


    An ambitious mission by the Massachusetts Institute of Technology''s (MIT) Media
    Lab to develop and distribute a laptop costing no more than $100 is moving forward
    with the receipt of the first orders.


    Orders from five to six countries, for a total of six million machines, are hoped
    for a pilot project led by Nicholas Negropone, chairman of the MIT Media Lab The
    goal is to provide a laptop for every child, though any country that can afford
    them.


    Negropone was in Japan recently to present the project at the Tokyo Ubiquitous
    Network Conference, a side conference to the United Nations'' World Summit on
    the Information Society, bringing together delegates from around the world.


    "Many countries lack the means or ability to realize the full potential of children
    through their current education systems, he says. The combination of laptops to
    all children, broaden connections for the towns and villages where they live and
    in a school for the use of


    digital materials, will improve not only the education each child receives but
    their future prospects as well, "Negropone says".


    Advanced discussions with various leaders for projects are already well underway.
    China is expected to order three million machines and Brazil is expected to buy
    million. Negropone is looking for more than three nations—each in Africa, the
    Middle East and South Asia—to commit to orders, in addition to supplying some
    schools with production, hopefully sometime in 2006.


    The standard model for laptops requires a large investment of capital, distribution,
    and profit. Negropone is convinced that with simplified models and some reinventing
    of the devices the machine won''t be under cost. The company, having the team
    of The $100 Laptop Company, plans to sell laptops in-buy, directly to ministries
    and is looking to make a profit. About 50% of the cost price is contributed by
    marketing, sales, distribution costs and profit, so those remaining aspects


    will provide big savings, Negropone says. The remaining half of the laptop''s
    cost is accounted for by the parts and manufacturing, and Negropone is planning
    things: Roughly two thirds of this cost is the display panel and backlight, but
    Negropone''s version of the machine will use a projection system that costs a
    tenth of about that?


    The laptop will run Linux. At this stage, the distribution hasn''t been decided
    yet but the project is in serious discussions with Red Hat and Beijing''s Red
    Software.


    The first generation processor will be based on a SoAMD processor from AMD, one
    of the project''s main barriers, and will have 512MB flash memory in place of
    a hard-disk and a wireless connection. The connections will automatically connect
    with others, forming a mesh network to support communications and allow Internet
    sharing and software sharing, open-source approach


    Plans are already underway to include second and third generation machines, due
    in 2007 and 2008 A prototype of the third generation was made based on a flexible-film
    display from E-link. That could use an advanced printing technology to reduce
    the cost and further cutting the price down.


    Current plans for the six million machines to be manufactured in China and for
    nations manufacturing centers to be built in Brazil is also interested in building
    a plant to produce laptops for more than one nation in America, adds Negropone.


    Additional manufacturing might be needed if the project reaches its overall goal
    of between two hundred and three million laptops per year. In comparison the total
    world PC market in 2004 was 195 million, according to a recent report from


    The project is being developed by Negropone along with two other faculty members:
    Jeffrey Jacobson, who developed the E-link technology and Seymour Paper, an expert
    in child learning.


    The project home page is http://media.mit.edu


    July – 2005 LinuxWorld ME'
