    # 44 PRODUCT SEGMENT


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_44_0.png)


    # Nokia views Linux-based Web device without phone


    The Nokia 770 is a pocket-size Web browser for wireless broadband networks


    +   - Nokia has unveiled a pocket-size web browser for wireless broadband networks.

    - This is Finnish''s first Linux-based device and also its first product without
    a built-in mobile phone.

    - The new device, dubbed the Nokia 770, has a four-inch touch screen that can
    display normal images and will sell for $150, the mobile phone maker said.

    - The product marks a significant expansion for Nokia, venturing outside its mainly
    phone business. Nokia aims to sell the device through broadband Internet providers
    and directly to consumers via the Web.

    - "We''re launching a completely new product," said Järneinen, Nokia''s VP for
    convergence in mobile devices.

    - The device is designed for however that can be used at wireless hot spots.

    - The product will run entirely on open-source software, designed in computers,
    marking more unchartered windows for Nokia. "Using standard Linux means innovation
    is faster (than using Linux for small devices). We will be very fast in implementing
    this innovation," said Järneinen.


    The pipeline expands by early next year to enable voice-over-IP calls and instant
    messaging.

    VoIP calls from the device cannibalise voice revenue from Nokia''s main customers,
    which include all of today''s biggest mobile operators.

    Nokia also plans to launch and support an open-source community site, encouraging
    software developers to help and improve the product.

    Nokia aims to be beating ahead of competitors who benefit from its success—it
    makes one of the most mobile phones in the world. Total mobile market is expected
    to be well over 700 million units in India.

    Consumers will be able to store content downloaded from the internet using memory
    cards, or transfer it to a desktop computer with Bluetooth.

    This new device, which Nokia took two years to develop, is at the mark for portable
    computers.

    Last year, 189 million PCs were sold widely. By 2008, researchers expect that
    more half of all sales will be portable computers than desktops.


    # HP to offer customised Linux for notebooks in Europe


    > HP offers its customers in Europe the Ubuntu distribution is specifically designed
    to support the hardware used in HP notebooks.


    Corporations and individuals can use the service to choose Windows, Ubuntu or
    Linux UX as the OS for their new device.

    Recently HP EMEA expanded its activities and reacted to growing criticism that
    a generic Linux distribution does not offer sufficient support for the hardware
    inside a notebook. One of the smaller Linux providers, to offer its customers
    a Linux that is 100% compatible with the hardware.

    HP does not advertise the Ubuntu, but lists FreeDEOS as option. If requested,
    HP will provide a CD-ROM with the latest version. The CD also includes free support
    as well as support through Canonical, the developer of Ubuntu.

    According to Europe, HP''s project is currently limited to EMEA - a region that
    needs to be more responsive than Linux for the US - and to ensure that a Linux
    device can be easily transported to a notebook.


    # New McAfee Shield


    > McA is shipping new versions of McAfeeShield and NetShield antivirus.

    "As more people crave to run on multiple platforms, it is crucial for customers
    to be able to get complete, multi-platform protection," said Steve Cutchfield,
    Director of Product Marketing at McAfee.


    The functionality introduces antivirus protection for the latest of SUSE Linux
    and Novell NetWare.

    With the release of Linux kernel products from Novell such as Open Enterprise
    (OS) and Novell Small Business, McAfee is extending its comprehensive support
    to these platforms. McAfee now offers support for the Linux kernel, version 2.6,
    and for the Novell NetWare 6.5 support pack.


    LinuxWorld July – August 2005'
