    服务器上的工作负载，而仅有 7% 计划减少。对于 Linux 而言，这些数字分别为 50% 和 100%。


    # 2004 年全球个人电脑安装的软件占比为 35%，比 2003 年的 36% 增加了一个百分点。Linux 方面因盗版造成的损失从 290 亿美元增加到
    330 亿美元。全球在消费级软件包上花费了超过 590 亿美元，但安装量也超过了 990 亿美元（从 800 亿增加到 1230 亿）。因此，事实是 PC
    软件市场增长了 6%，且美元对世界许多货币贬值。由于 Linux 是免费使用的，盗版问题完全是不同的。


    # 一项关于 Microsoft Windows 与开源系统副本匹配的研究声称，修补漏洞的成本大致相同。该文件指出，这一结果违背了 IT 社区的普遍认知，即使用开源软件的总成本（包括修补）低于
    Windows。该调查针对 60 家公司，就 Windows 和 Linux 系统安全补丁匹配的程序和成本问题进行了调研。注：该调查由微软赞助，由研究公司
    Meta Group（Gartner 旗下）审计，并由咨询公司 Wipro Technologies 执行。


    # 根据 IDC 发布的数据，Linux 出货量已连续第十一个季度季度实现双倍增长，营收同比增长 35.2%，单位份额增长 15.5%。Gartner 同意这一观点，并报告称今年第一季度服务器市场表现良好。根据
    IT 市场研究机构 Gartner 的统计，全球服务器出货量增长了 10.7%，达到 1745 万台，总营收也增长了 4.1%，达到 123.3 亿美元。


    # Info-Tech Research Group 最近进行了一项调查，目前正用于微软的“获取事实”（Get the facts）活动。在对 SAM 地区的
    1,400 名经理和首席信息官（CIO）进行调查后，该小组发现 28% 的人对 Linux 不感兴趣，15% 的人对 Linux 不确定，10% 的人计划评估
    Linux。尽管如此，所有运行 Linux 的 Web 服务器中有三分之二显示这些数字有所增加，这是因为较小公司的网站由运行 Linux 的服务提供商托管，即使公司本身并非如此。


