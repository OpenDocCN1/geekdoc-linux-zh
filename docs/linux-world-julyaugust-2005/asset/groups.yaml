    # 伯明翰押注 Linux


    英国市议会正在转向开源系统，通过迁移 1,500 台台式电脑降低成本并为纳税人节省资金。


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_33_0.png)


    伯明翰市议会启动了迄今英国最具雄心的开源试验之一，将 1,500 台客户端计算机和相应的服务器服务器基础设施迁移到 Linux 和其他开源软件。


    根据该英国市议会的说法，该项目预计将产生关于开源优势的客观信息。副总理办公室（ODPM）通过电子创新计划资助了这项试验，该试验是一项名为“开源学院”（Open
    Source Academy）的更广泛项目的一部分。


    该学院于今年 4 月宣布，还正在建立各种基础设施，如代码库、开源供应商数据库以及开源认证计划，以使开源成为地方政府更易选择的选择。学院希望开源能意味着更高的效率提升和成本节约、促进互操作性和开放标准、避免供应商锁定、减少地方政府之间的重复工作并延长硬件寿命。


    伯明翰将将其图书馆的 1,500 台客户端迁移到开源软件，包括 GNU Linux 操作系统，以及如 Firefox 浏览器、办公套件等应用软件，具体细节尚待确定。这些
    PC 将包括全市的公共访问台式机以及市的服务器端基础设施。


    与在学院指导下进行的大学开源项目——布里斯托尔市议会将会将 5,000 台台式机运行在 Windows 上的任务——不同，伯明翰将彻头彻尾地开源。开源联盟（Open
    Source Consortium）的马克·泰勒（Mark Taylor）表示，这才是真正的考验，该组织是一个在学院多个项目中担任顾问的团体。“伯明翰拥有英国和欧洲最大的大都市委员会，他们正在推出一套完整的生产业务系统。”


    市议会目前正在制定一项可用性研究，并将在今年晚些时候开始推出系统。试验后将进行公正的评估，充分考虑生产力以及如培训和招聘 IT 人员等持续成本。


    泰勒表示，虽然许多地方政府已经在使用开源（通常是在服务器端），但其优势尚未得到充分说明。此项目的主要交付成果之一就是进行一项无偏见的研究。他说：“这就是我们所做的，以及它的优缺点，
    许多议会在行业内仅仅是客观的案例研究。”


    2005 年 7 月至8 月 LinuxWorld MEDIA


    # 回归根源


    在过去的十年里，Linux 已进入了企业、中小企业和政府部门。然而，它对教育部门——也就是它诞生的地方——的真实价值尚未被量化。情况正在发生变化。现在有越来越多的学校和学院转向开源以获得益处。


    # 爱好行业


    回到 1991 年，赫尔辛基大学的莱纳·托瓦尔斯（Linus Torvalds）创建了 Linux 内核的原始版本。为了他的爱好项目，托瓦尔斯使用了 Minix（Linux
    的变体），并在同行的编程帮助，直到大学的设施允许 Linux 运行。


    有趣的是，过去的十年是由微软、IBM 和政府部门创造的，但教育部门——Linux 诞生的唯一地方——改变了？


    从客观来看，全英国使用开源软件（FOSS）的英国教育交流与技术学校（Becta）的成本仅为使用专利软件学校的一半， 20% 的学校成本更低。Becta 一份
    24 页的报告研究了三个领域——技术基础设施、管理和课程软件。


    报告驳斥了开源软件更难支持的传统观念。发现 FOSS 的成本降低了高达 60%。换句话说，学校和大学每年可以节省数百万美元。


    Becta 首席执行官欧文·林奇（Owen Lynch）表示：“这份报告表明，如果部署，开源软件可以在学校里提供一种具有成本效益且高效的解决方案。我们认为在学校里使用的软件应该是……”


    ... 学院希望开源将意味着更高的效率提升和成本节约、促进互操作性和开放标准、避免供应商锁定、减少地方政府之间的重复工作并延长硬件寿命。


    伯明翰将将其图书馆的 1,500 台客户端迁移到开源软件，包括 GNU Linux 操作系统，以及如 Firefox 浏览器、办公套件等应用软件，具体细节尚待确定。这些
    PC 将包括全市的公共访问台式机以及市的服务器端基础设施。


