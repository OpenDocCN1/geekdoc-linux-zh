    for a pilot project led by Nicholas Negropone, chairman of the MIT Media Lab The
    goal is to provide a laptop for every child, though any country that can afford
    them.


    Negropone was in Japan recently to present the project at the Tokyo Ubiquitous
    Network Conference, a side conference to the United Nations'' World Summit on
    the Information Society, bringing together delegates from around the world.


