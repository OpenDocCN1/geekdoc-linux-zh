  md: '# PRODUCT ANALYSIS


    # World’s largest Internet archive powered by Linux


    Capricorn Technologies Completes Shipment of 1 Petabyte System to Internet Archive.


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_50_0.png)


    Capricorn traces its roots. to the development of the PetBox at the Internet Archive.
    Capricorn started as a project within the IA to develop inxpensive storage devices
    based on Linux and commodity PC components. Last June, the Internet Archive announced
    the spinoff of Capricorn Technologies as a separate, commercial entity. The company
    has since supplied its PetBox products to universities, research centers, libraries,
    and national archives, both within the US and overseas.


    > “Capricorn has helped solve our critical storage problem,” says John Berry,
    Vice President of Engineering for the Internet Archive. “We have more data in
    space at far less cost and much higher reliability” Capricorn’s PetBox products
    are based on Mini-ITX boards running Debian or Fedora Linux, and delivers the
    lowest cost-per-GB and cost-ownership availability: the company claims. Each system
    includes a Via-800 mini-ITX with an 8G C-class processor and 2GB of memory (RAM),
    available. Each features the Hitachi hard drives with BMMC caches, priced at approximately
    $25/GB, in qto- and 6TB capacity devices.


    The IA’s PetBox installation includes about 16 racks housing 600 servers with
    2,500 drives, for a total capacity of roughly 15.2 petabytes.


    Keller Bray, Director and founder of the Internet Archive


    “Despite its size, the IA’s PetBox installation draws only about 25kW of power:
    it is powered by one and only one circuit, with a disproportionate amount of time
    working on order systems,” says C.K. Sarkiley, President and CEO of Capricorn
    Technologies.


    The IA systems built on Debian or Fedora Linux from a central PXE boot server,
    are monitored via icing, a utility which tracks hard disk temperatures, CPU temperatures.


    +   - US based vendor Capricorn Technologies has reached a major milestone by
    completing the shipment of a full petabyte of PetBox products to the Internet
    Archive.


    To quantify this data storage solution - a petabyte is over 6000 cluster storage
    nodes spanning disks.


    Founded in 1996, the Internet Archive (IA) is a non-profit organization to provide
    universal access to all human knowledge. It is an on-line digital library which
    includes very large collections of audio, video, texts, web and software. The
    Archive now offers over 200,000 live events as periodic snapshots of the


    Internet dating back to 1996, accessible through the well-known Wayback Machine.
    On the whole, the IA currently has over 40 billion web pages. For instance, the
    IA’s Wayback Machine contains approximately 22 petabytes of data and is currently
    growing at a rate of 20 terabytes per month.


    Much of the Internet is stored on hundreds of slightly modified x86 servers running
    the Linux operating system. Each computer has 512MB of memory and can hold just
    over 1 Terabyte of data on ATA-disks.


    LincolnWorld Media July 2005'
