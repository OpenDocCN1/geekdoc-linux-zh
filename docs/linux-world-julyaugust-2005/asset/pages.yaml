    migration to Linux. The Fares application and infrastructure represent just 10%
    of the Galileo platform. The rest houses the massive collection of flight information
    for every airline, route in the world, with mainframe language called the Transaction
    Processing Factory (TFF).


    Despite having to re-architect the Linux platform, Wiseman says the combination
    of Linux on Intel servers still saves more than 90% over Unix. All that is, for
