    # Former Linux architect moves to Windows


    Goodbye Gentoo, hello Microsoft


    +   - Daniel Robbins, the founder of Gentoo Linux and his former chief architect,
    has accepted a position at Microsoft.

    - In a note to the Gentoo community, Robbins said "I am helping Microsoft to understand
    Gentoo and Open Source and community-based projects."

    - Microsoft confirmed that Robbins will work at Microsoft''s Linux team at Source
    is working with Bill Hill.

    - Hill is Microsoft''s lead program manager for its Platform Strategy organisation.
    He leads Microsoft''s Linux and Open Source technology team. Microsoft will drive
    IBM''s Linux strategy for its enterprise and markets organizations. Robbins''s
    title is to manage the program and Linux development strategy.

    - Robbins has been moving away from history for some time. He has resigned from
    responsibilities and the role as Chief architect of Gentoo.

    - At that time, he also began up the non-profit Gentoo community, which runs on
    Gentoo developers'' servers.

    - Before joining Microsoft, Robbins finalised the transfer of Gentoo''s intellectual
    property, everybody easily combines copyrights and other software, as well as
    soon-to-trademarked Gentoo deos to the Foundation.


    # HP spans 1 million Tux servers


    $8.3b by HP has seen an first-industry milestone by shipping more than 1 million
    Linux servers since counts started in 1998, 45% more than any other hardware vendor.


    Ciling of IDC''s latest word Quarterly Server Tracker, HP claims to have the worldwide
    Linux market share for consecutive quarters. In the first quarter of 2005, HP
    grew 2.5 percentage points faster than the market in units a


    year-over-year basis, shipped nearly 10 times as many Linux servers as Sun, IBM
    led by almost 8% points in revenue share and outpaced Dell in both units.


    "The don''t lie. Customers are clearly pushing HP as the preferred choice for
    deploying Linux and open source solutions," said Martin Fink, VP and General Manager,
    Open Source and Linux Organisation, HP


    # Mandriva acquires Lycor assets


    ![](img/a883fb7c73397cd76c2dae63f64a20f1_10_1.png)


    Mandriva has purchased several assets from Lycor, a North American insider. As
    part of the agreement, Mandriva founder and CEO Jeffing is joining Mandriva to
    develop a new Linux distribution.


    Since its inception five years ago it has been developing Linux versions targeted
    to the consumer.

    The vendor has also developed products for the market market, such as a Tablet
    and a Pocket edition of Lycor Desktop/LX, which led several partnerships with
    hardware vendors in Asia.


    The plan is to produce a product that will be the convergence of Linux and Desktop.
    We have already started working on this project.


    Lycor currently has no money to produce but Joseph Jenkins has two Linux versions
    targeted to the desktop that we will prove next.

    We bring an unique expertise in desktop and user interface design. Our goal is
    to provide a path forward for moving the desktop to the thousands of Linux users,"
    said François Bonillon, CEO of Mandriva.


    LinuxWorld EMEA — July 2005'
