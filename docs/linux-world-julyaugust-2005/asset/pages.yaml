    # EDITORIAL


    3


    # Back to the grass roots


    +   My first brush with computers was in the time: ''80s during my school days.


    The computers I grew up with had boring screens, limited functionality, multimedia;
    no internet, e-mail or chat; no applications, which were expensive and we had
    to ratify them in our lab. I couldn''t modify, change or tinker with them — in
    short they curtailed my fidget imagination. And sadly, they dashed my dreams of
    becoming a programmer.


    Linux and open source, gives freedom, functionality that any fertile imagination
    would want to have. It encourages everyone to work together for the greater good,
    and sure even make some money. It''s (almost free) meaning Universities can save
    lot of money. Students can play with it; its multimedia; network enabled; and
    they can make it their own, which is not the case with closed operating systems.


    A few weeks ago, I read a report by the British Educational Communications and
    Technology Agency (BETA), which stated that the cost PC for primary schools in
    the UK using open source software was half of those running proprietary software,
    and 20% less for secondary schools.


    Everyone regardless of who they are having access to reliable and affordable computing
    services, students having the freedom to play out their imagination. The possibilities
    are endless.


    The report, and of schools, disposed that open source software is harder to support
    and went on to say that it needed cut support costs up to 60%.


    Not surprisingly companies, like Microsoft, Dell, Sun Microsystems, Google, Yahoo,
    Netscape and even Linux were started by enterprise college students or University
    projects.


    Interingly, we''re also covering four large projects across the US, India and
    South Asia to bring Linux to the masses. These initiatives promise to bring Linux
    notebooks and desktops for as low as $500 to $550 for the common man.


    If we encounter open source and Linux in the learning space, who knows the next
    big thing will come from?


    Though these products are targeted at the masses, I see no reason why they can''t
    be used by SMBs, the government, and schools and even enter markets to cut costs.


    Personally, these two developments got me excited.


    Regards,

    Maddy Reddy.


    Editor

    maddy@@cpidubai.com


    July – August 2005 LinuxWorld MEA'
