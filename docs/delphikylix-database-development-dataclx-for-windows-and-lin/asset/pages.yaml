- pgno: 385
  md: "The only interesting action on the File menu is the Connect/Disconnect menu\
    \ item. FileConnect1Execute simply toggles the socket connection's Connected property\
    \ to connect to or disconnect from the application server. FileConnect1Update\
    \ takes care of setting the action's caption appropriately, depending on the current\
    \ connection status.\n\nFinally, the todo pop-up menu contains several actions\
    \ for manipulating the todo items for the current contact. TodoAddExecute and\
    \ TodoEditExecute display the frmTodo form, which allows the user to enter or\
    \ modify a todo. TodoMarkDoneExecute sets the completed date and time for the\
    \ current todo to the current date and time.\n\nThe rest of the code in the main\
    \ form should be fairly self-explanatory, so I won't go over it in detail.\n\n\
    The final unit in this application is TodoForm.pas. Listing 9.6 contains the source\
    \ code for this file, which enables the user to enter a new todo for a contact\
    \ or edit an existing todo.\n\n# LISTING 9.6 ConMan—TodoForm.pas\n\n```\nunit\
    \ TodoForm;\n\ninterface\n\nuses\n  Windows, Messages, SysUtils, Variants, Classes,\
    \ Graphics, Controls, Forms,\n  Dialogs, ExtCtrls, ComCtrls, StdCtrls;\n\ntype\n\
    \  TfrmTodo = class(TForm)\n    pnlClient: TPanel;\n    pnlBottom: TPanel;\n \
    \   Label1: TLabel;\n    edDescription: TEdit;\n    Label2: TLabel;\n    dtDate:\
    \ TDateTimePicker;\n    dtTime: TDateTimePicker;\n    Label3: TLabel;\n    btnCancel:\
    \ TButton;\n    btnOK: TButton;\n    procedure FormCreate(Sender: TObject);\n\
    \  private\n    { Private declarations }\n  public\n    { Public declarations\
    \ }\n  end;\n\n```"
  merge: -1
  img_proc: true
- pgno: 386
  md: "# **LISTING 9.6** Continued\n\n```\n```\nimplementation\n\n{$R *.dfm}\n\nprocedure\
    \ TfrmTodo.FormCreate(Sender: TObject);\nbegin\n  dtDate.Date := Date;\n  dtTime.Time\
    \ := StrToTime('12:00 pm');\nend;\n\nend.\n```\n```\n\nThe todo form’s FormCreate\
    \ handler simply defaults the date and time of the todo to noon of the current\
    \ date. The user will modify the date and time accordingly.\n\n# ## Room for Improvement\n\
    \nBecause ConMan is a sample application, there is considerable room for improvement.\
    \ In addition to the omissions mentioned in the section titled “What Is ConMan?”\
    \ at the beginning of this chapter, the following improvements would be useful\
    \ additions to this application:\n\n+   - A dialog that pops up to alert the user\
    \ as to when a todo is imminent.\n+   - A screen that shows a list of todos for\
    \ all contacts, ordered by date.\n+   - The capability to assign a todo to a specific\
    \ user, to provide rudimentary scheduling capabilities.\n+   - The capability\
    \ to query the database. As it grows to a large size, it may take a considerable\
    \ amount of time to load all the data onto a client machine.\n\nI’ll leave it\
    \ to you to implement these suggestions if you see fit. That will give you a springboard\
    \ to learning multitier development techniques on your own.\n\n# ## Summary\n\n\
    This chapter pulled together many of the concepts discussed in prior chapters\
    \ to create a complete multitier database application. Specifically, this application\
    \ implements the following:\n\n+   - The application server makes use of dbExpress\
    \ components such as `TSQLConnection` and `TSQLDataSet` for connecting to an Interbase\
    \ database. These components are discussed in Chapters 1 and 2."
  merge: -1
  img_proc: true
- pgno: 387
  md: '+   • The application server contains a minimal user interface that displays
    the number of current connections along with the amount of RAM in use by the server,
    as shown in Chapter 8.


    +   • The server''s `pvContactsBeforeUpdateRecord` event handler shows how to
    ensure that each record has a unique primary key just before posting to the database,
    as discussed in Chapter 7.


    +   • The client application makes use of a calculated field on the `cdsContact`
    dataset. Calculated fields were discussed in Chapter 3.


    +   • The client application''s `dsContactsDataChange` event handler takes care
    of displaying an image from the dataset in a non data-aware `TImage` component.
    This concept was discussed in Chapter 4.


    +   • The client application''s `cdsContactsReconcileError` event handler takes
    advantage of Delphi''s built-in reconciliation form to handle reconciliation errors,
    as discussed in Chapter 7.'
