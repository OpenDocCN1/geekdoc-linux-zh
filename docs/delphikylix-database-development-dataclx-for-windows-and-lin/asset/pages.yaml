- pgno: 279
  md: "> **NOTE**\n> \n> Because the code for TCIiontbaSetGrid is freely available,\
    \ I hope to see some enterprising Delphi programmers providing enhancements to\
    \ it in the future. My personal wish list includes\n> \n> * Saving and loading\
    \ column configuration to and from an ini file and the Windows registry.\n> *\
    \ Enhancing the Configure Columns dialog to support column reordering in addition\
    \ to hiding or showing columns.\n> * Enhancing the Configure Columns dialog to\
    \ support locking individual columns so that they cannot be hidden or moved.\n\
    > * Adding support for an OnColumnSized event.\n\n# TDBCtrlGrid\n\nI’m not going\
    \ to spend a lot of time on TDBCtrlGrid because it isn’t CLX-compatible, and because\
    \ there isn’t any new development going on in terms of TDBCtrlGrid.\n\nTDBCtrlGrid\
    \ is a grid-like component, although it relies on other data-aware components\
    \ to perform the actual data input and output. To use a TDBCtrlGrid in your application,\
    \ drop it on a form and connect the DataSource property to a data source. Then,\
    \ populate the grid with other data-aware components, such as TDBEdit, TDBCheckBox,\
    \ and so on.\n\nTDBCtrlGrid replicates these components at runtime, displaying\
    \ each component for every record displayed in the grid. Every cell in the grid\
    \ corresponds to a single record in the dataset.\n\nMost data-aware controls are\
    \ replicable (that is, they can be used in a TDBCtrlGrid). Some are not (including\
    \ the TEhMDBDateTimePicker component that I created in the preceding chapter).\
    \ In order for the control to be replicable, it must include the csReplicable\
    \ option in its ControlStyle property (typically set in the component’s constructor).\
    \ The following is a snippet from TDBEdit’s constructor:\n\n```\n```pascal\nconstructor\
    \ TDBEdit.Create(AOwner: TComponent);\nbegin\ninherited Create(AOwner);\ninherited\
    \ ReadOnly := True;\nControlStyle := ControlStyle + [csReplicable];\n…;\nend;\n\
    ```\n```\n\nThe following sections discuss the properties and events that TDBCtrlGrid\
    \ introduces."
  merge: -1
  img_proc: true
- pgno: 280
  md: "# Properties\n\nTDBCtrlGrid introduces a handful of properties that you can\
    \ use to customize its look and feel. Table 6.7 lists these properties.\n\n**TABLE\
    \ 6.7** TDBCtrlGrid Properties\n| Property | Description |\n| AllowInsert | When\
    \ True, the user can scroll past the last record in the grid to insert a new record.\
    \ |\n| AllowDelete | When True, the user can delete the current record by pressing\
    \ Ctrl+Delete. |\n| ColCount | Determines the number of columns displayed in the\
    \ grid. |\n| Orientation | Determines the direction in which the grid scrolls\
    \ to display more data. |\n| PanelBorder | Possible values are gbNone and gBRaised.\
    \ gBRaised causes the grid to have a raised look. You can achieve other looks,\
    \ such as lowered or bump, by setting PanelBorder to gbNone and dropping the TDBCtrlGrid\
    \ on a panel with the desired bevel. |\n| PanelHeight | Refers to the height,\
    \ in pixels, of a single panel (cell). |\n| PanelWidth | Refers to the width,\
    \ in pixels, of a single panel (cell). |\n| RowCount | Determines the number of\
    \ rows displayed at a time in the grid. |\n| SelectedColor | Determines the background\
    \ color of the current cell. |\n| ShowFocus | When True, a focus rectangle is\
    \ drawn around the current cell. |\n\nThe ColCount, PanelWidth, and Width properties\
    \ are directly related. ColCount×PanelWidth is approximately equal to Width (allowing\
    \ for the grid border and vertical scrollbar). Setting ColCount automatically\
    \ adjusts the Width, as long as the Align setting does not prevent it. (Setting\
    \ Align to a1cLeft, for example, does not allow the grid to resize. In this case,\
    \ setting ColCount automatically adjusts PanelWidth.)\n\nSimilarly, the RowCount,\
    \ PanelHeight, and Height properties are related. Setting one property affects\
    \ the others.\n\n# Events\n\nTDBCtrlGrid only contains one new event, named OnPaintPanel.\
    \ OnPaintPanel fires just before each panel is about to be drawn. OnPaintPanel\
    \ looks like this:\n\n```\n```pascal\nprocedure TForm1.DBctrlGrid1PaintPanel(DBCtrlGrid1:\
    \ TDBCtrlGrid;\n  Index: Integer);\nbegin\nend;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 281
  md: 'Index refers to the zero-based index of the panel about to be drawn, and is
    a number between zero and RowCount— one, inclusive.


    You might notice that there is no Rect parameter passed to this function, so at
    first glance it isn’t obvious how to determine the bounding rectangle of the current
    cell. Upon entry to this method, the grid canvas’ origin is set to the upper-left
    corner of the current panel. In other words, point (0, 0) on the canvas refers
    to the upper-left corner of the panel. Point (PanelWidth, PanelHeight) references
    the lower-right corner. This enables you to use the canvas for such things as
    drawing a background image on the panel (as the following code snippet taken from
    Listing 6.4 shows).


    ```

    procedure TForm1.DBctrlGrid1PaintPanel(DBCtrlGrid: TDBCtrlGrid;

    Index: Integer);

    begin

    if Index > DBCtrlGrid.PanelIndex then

    DBCtrlGrid1.Canvas.Draw(0, 0, Image1.Picture.Graphic);

    end;

    ```


    This code checks the index passed into the method to see if we’re drawing the
    current panel. (The public property PanelIndex contains the number of the current
    panel.) All noncurrent panels are drawn with a background graphic.


