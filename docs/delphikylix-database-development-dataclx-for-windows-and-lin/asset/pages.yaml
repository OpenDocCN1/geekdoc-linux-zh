- pgno: 50
  md: "# Transaction Support\n\nMost SQL databases, with the notable exception of\
    \ versions of MySQL prior to 3.23, provide support for transactions. A transaction\
    \ must satisfy four criteria, which are called the ACID properties of transactions.\
    \ Specifically, transactions are\n\n+   * Atomic. The transaction must either\
    \ succeed or fail as a whole. It is not acceptable for part of the transaction\
    \ to succeed and part of it to fail.\n\n+   * Consistent. After a transaction\
    \ finishes, the data must be left in a consistent state. All data must adhere\
    \ to current referential integrity constraints.\n\n+   * Isolated. Changes made\
    \ in one transaction must not be visible to another transaction until the transaction\
    \ is committed.\n\n+   * Durable. Once a transaction is committed, its changes\
    \ must be permanent. Nothing, including a system crash, must alter the effects\
    \ of the committed transaction.\n\nTransactions are most easily described with\
    \ an example, so I'll go through the most often-cited example of transaction support.\n\
    \nImagine a bank with a database that contains clients and account information.\
    \ John Q. Customer has both a savings account and a checking account at the bank.\
    \ He makes a trip to his local ATM, and decides to transfer $100 from his savings\
    \ account to his checking account.\n\nIn SQL terms, this constitutes two operations:\
    \ one INSERT statement to record a withdrawal from the savings account, and a\
    \ second INSERT statement to record the deposit into the checking account. Assuming\
    \ the ATM software is written using Delphi and dbExpress, it might contain some\
    \ code similar to the following:\n\n```\nprocedure TransferFunds(FromAccountID:\
    \ Integer; ToAccountID: Integer;\n\tAmount: Double);\nvar\n\tSQL: string;\n\t\
    Params: TParams;\nbegin\n\tParams := TParams.Create;\n\ttry\n\t\tSQL := 'INSERT\
    \ INTO ACCOUNTDETAIL (ACCOUNTID, TRANSDATE, AMOUNT) +\n\t\tVALUES (:AccountID,\
    \ :TransDate, :TransAmount)';\n\t\tParams.ParamByName('AccountID').Value := FromAccountID;\n\
    \t\tParams.ParamByName('TransDate').Value := Date;\n\t\tParams.ParamByName('TransAmount').Value\
    \ := -Amount;\n\t\tSQLConnection1.Execute(SQL, Params);\n\n\t\tParams.ParamByName('AccountID').Value\
    \ := ToAccountID;\n\t\tParams.ParamByName('TransAmount').Value := Amount;\n```\n\
    \n![](img/52a35759a0f10dade27a840504be5d82_50_0.png)"
  merge: -1
  img_proc: true
