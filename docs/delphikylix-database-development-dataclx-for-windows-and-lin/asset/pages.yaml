  md: "TABLE 3.8 Continued\n\n| Function | Description | Example |\n|---|---|---|\n\
    | TrimLeft | Trim leading characters from a string | TrimLeft (Name) \nTrimLeft\
    \ (Name, ',') |\n| TrimRight | Trim trailing characters from a string | TrimRight\
    \ (Name) \nTrimRight (Name, ',') |\n\nTABLE 3.9 Filter Date/Time Functions\n\n\
