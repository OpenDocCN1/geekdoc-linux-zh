    \n# ## Streamed Data\n\nIn addition to streaming images, there are times when\
    \ you might want to stream out unstructured data to a BLOB field. Perhaps you\
    \ want to store a linked list of integers in a single field, for example. The\
    \ following code snippet shows how you can use a stream to save data to a BLOB,\
    \ and then read it back in later.\n\n```\n```pascal\nprocedure SaveListToBlob(List:\
    \ TList);\nvar\n Stream: TStream;\n Num: Integer;\n Index: Integer;\nbegin\n Stream\
    \ := ClientDataSet1.CreateBlobStream(\n   ClientDataSet1.FieldByName('DATA'),\
    \ bmWrite);\n try\n   // Write out the number of integers\n   Num := List.Count;\n\
    \   Stream.Write(Num, sizeof(Num));\n   for Index := 0 to List.Count - 1 do begin\n\
    \     Num := Integer(List[Index]);\n     Stream.Write(Num, sizeof(Num));\n   end;\n\
    \ finally\n   Stream.Free;\n end;\nend;\n\nprocedure LoadListFromBlob(List: TList);\n\
    var\n Stream: TStream;\n Count: Integer;\n Index: Integer;\n Num: Integer;\n```\n\
    ```"
