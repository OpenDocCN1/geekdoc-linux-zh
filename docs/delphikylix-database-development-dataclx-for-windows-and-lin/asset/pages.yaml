    \   else\n      ShowMessage('No bookmark set!');\nend;\nend.\n```\n```\n\nFigure\
    \ 3.6 shows this program at runtime.\n\n# Client Dataset Indexes\n\nSo far, we\
    \ haven’t created any indexes on the client dataset and you might be wondering\
    \ if (and why) they’re even necessary when sequential searches through the dataset\
    \ (using Locate) are so fast.\n\nIndexes are used on client datasets for at least\
    \ three reasons:\n\n+   - To provide faster access to data. A single Locate operation\
    \ executes very quickly, but if you need to perform thousands of Locate operations,\
    \ there is a noticeable performance gain when using indexes."
