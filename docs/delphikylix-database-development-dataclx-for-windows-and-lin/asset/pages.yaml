- pgno: 71
  md: 'The preceding chapter presented an overview of dbExpress connections and the
    TSQLConnection component. You learned how to connect to and disconnect from a
    database, how to set connection parameters, and how to retrieve schema information
    from a database. In this chapter, I’ll introduce dbExpress datasets, which enable
    you to retrieve data from the database connection.


    I’ll make references to a number of dataset methods, such as First, Next, FieldByName,
    and so on. These methods are actually defined at the TDataSet level, which means
    that they are applicable to all types of datasets (including BDE, ADO, dbExpress,
    and the like).


    These methods are well documented in the Delphi help files and in other general-purpose
    Delphi books—I apply them in Chapter 3, “Client Dataset Basics.” For these reasons,
    I won’t go into excruciating detail here. Instead, I will provide short code snippets
    to show how they’re used in context.


    # What are dbExpress Datasets?


    Datasets are the means by which dbExpress retrieves data from a database. For
    example, given the following SQL SELECT statement:


    ```

    SELECT * FROM EMPLOYEES

    ```


    The employee rows are returned in a dataset. You saw in the preceding chapter
    that TSQLConnection could directly process SQL statements that did not return
    a result set. For queries that return a result set, TSQLDataSet (and its derivatives)
    should be used.


    Let’s take a moment to discuss the characteristics of dbExpress datasets, and
    then we’ll move into the concrete dbExpress classes that implement them.


    # dbExpress Datasets Are Unidirectional


    The most important thing to know about dbExpress datasets is that they are unidirectional.
    At first this might seem like a huge disadvantage, but in the rest of this book,
    you’ll see how the dbExpress architecture provides for an extremely lightweight,
    flexible, and powerful means of accessing and updating data.


    Because dbExpress datasets are unidirectional, the only navigating that you can
    do is moving from the beginning of the dataset to the end—one record at a time.
    If you’re familiar with other Delphi datasets (such as TTable, TADODataSet, or
    TIBDataSet), you might be wondering how to search for records or move backward
    through the dataset. Again, the solution to these issues will become crystal clear
    in later chapters.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# dbExpress Datasets Are Read-Only


    dbExpress datasets are a read-only view into the underlying data in a database.
    No editing features are directly supported by dbExpress datasets, so any attempt
    to edit a dbExpress record results in a Delphi exception, as shown in Figure 2.1.


    ![](img/52a35759a0f10dade27a840504be5d82_72_0.png)


    dbExpress datasets are read-only.


    # dbExpress Datasets Are Lightweight


    Because dbExpress datasets are unidirectional and read-only, they are extremely
    lightweight. There is no overhead involved for the fundamental (but expensive)
    tasks of bidirectional cursor support, record buffering, and the like.


    If you’re familiar with the Borland Database Engine (BDE), you know that the BDE
    supports full editing capabilities, forward and backward navigation of datasets,
    and drivers for multiple database backends. However, the BDE install is approximately
    10MB, and the BDE itself is memory-intensive. Consider that dbExpress (when coupled
    with client datasets, which I’ll discuss in future chapters) consists of a mere
    two library files totaling some 400K. Consider further that dbExpress (with client
    datasets) supports even more functionality than the BDE, and you begin to appreciate
    why dbExpress is such a remarkable database technology.


    # Types of Datasets


    As with other Delphi database technologies (such as ADO and IBX), dbExpress supports
    three different types of datasets: tables, queries, and stored procedures. These
    are discussed in the following sections.


    # Tables


    A table is a direct view of the underlying database table. It consists of all
    columns for all rows in the table. You cannot limit the rows returned from the
    table, and you cannot select a subset of columns (or join columns from another
    table).'
