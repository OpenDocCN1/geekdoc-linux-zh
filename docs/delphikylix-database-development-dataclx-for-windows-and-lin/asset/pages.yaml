- pgno: 180
  md: "```\nvar\n  Stream: TStream;\nbegin\n  Stream := TheDataSet.CreateBlobStream(...);\n\
    \  try\n    // Read from or write to the stream here.\n  finally\n    Stream.Free;\n\
    \  end;\nend;\n```\n\nNotice that **Stream** is defined as a **TStream**, which\
    \ is the ancestor class for streams. The actual stream returned may in fact be\
    \ a **TBlobStream** (for a BDE dataset) or another kind of stream. Thanks to polymorphism,\
    \ you can operate on the stream without knowing its exact class type.\n\n# ###\
    \ Streamed Components\n\nAlthough the concept of streaming data relies on you\
    \ (the programmer) to make sure to read and write data in the same order, by creating\
    \ and streaming a component, you can let Delphi's built-in streaming mechanism\
    \ do the work for you.\n\nDelphi provides streaming support for components derived\
    \ from **TPersistent**, as well as helper functions for the **TCollection** family\
    \ of classes.\n\nTo make streaming the list of integers that were described previously\
    \ more automatic, let's create a component wrapper for the data.\n\n```\nTIntegerItem\
    \ = class(TCollectionItem)\nprivate\n  FNumber: Integer;\npublished\n  property\
    \ Number: Integer read FNumber write FNumber;\nend;\n```\n\n```\nTIntegerList\
    \ = class(TComponent)\nprivate\n  FIntList: TCollection;\npublished\n  property\
    \ IntList: TCollection read FIntList;\nend;\n```\n\nGranted, this might be overkill\
    \ for a data structure as simple as a list of integers, but the same concept works\
    \ for a component containing multiple fields or complex subdata."
