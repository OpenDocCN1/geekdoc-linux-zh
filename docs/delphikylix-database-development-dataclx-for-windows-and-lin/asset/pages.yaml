  md: '# Retrieving Database Metadata


    TSQLConnection surfaces a handful of properties that enable you to retrieve basic
    schema information from the database, including table, field, index, stored procedure,
    and stored procedure parameter attributes. The following sections describe how
    to obtain each of these types of information from the database connection.


    # GetTableNames


    You can call GetTableNames to retrieve a list of the tables in the database, including
    user tables, system tables, views, and synonyms (Oracle databases only).


    TSQLConnection.GetTableNames is defined in sqlxexpr.pas like this:


    ```

    ```pascal

    procedure GetTableNames(List: TStrings; SystemTables: Boolean = False);

    ```

    ```


    The first parameter specifies the string list in which the table names are returned.
    Any existing strings in the list are cleared. The second parameter indicates whether
    to return only system tables.


    If the SystemTables parameter is set to True, only system tables are added to
    the list, regardless of the current setting for the TableScope property (shown
    in Table 1.4). If SystemTables is False, TableScope controls the types of tables
    that are added to the list.


    **TABLE 1.4 TableScope Settings**


    | Property | Description |

    | :--- | :--- |

    | TsSynonym | Synonyms |

    | TsSysTable | System tables |

    | TsTable | Normal, user-defined tables |

    | TsView | Views |


    The following code snippet shows a typical call to GetTableNames:


    ```

    ```pascal

    GetTableNames(ListBox1.Items, False);

    ```

    ```


    # GetFieldNames


    GetFieldNames is used to retrieve the names of all fields defined for a given
    table or view. GetFieldNames takes two parameters, and is defined like this:


    ```

    ```pascal

    procedure GetFieldNames(const TableName: string; List: TStrings);

    ```

    ```'
