- pgno: 18
  md: '# Chapter 8


    +   Methods Shows how to add callable methods to an application server.


    +   LocalConn Shows how to implement a single-EXE database application using multiple
    techniques.


    +   Stateless Shows how to create a stateless application server for use with
    MTS or COM+.


    # Chapter 9


    +   ConMan A complete sample application that draws on many of the techniques
    discussed throughout the book to create a simple contact manager.


    With respect to the source code, each chapter has its own subdirectory, with VCL
    and CLX subdirectories under it. In turn, the VCL and CLX subdirectories have
    a separate subdirectory for each sample application.


    In addition to a subdirectory for each chapter, there is a separate subdirectory
    named Components, which contains the data-aware component descendants mentioned
    earlier. The Data subdirectory contains the common.gdb data file used in a number
    of the sample applications and the SQL script file (common.sql) used to create
    the database.


    If you maintain this directory structure on your own drive, the sample programs
    should all run fine out of the box. They are set up to access the CONMAN database
    using the relative path ..\..\..\Data\conman.gdb. If you have trouble running
    the sample programs, you might want to modify them to provide a complete path
    to the data, such as D:\Data\conman.gdb.


    # dbExpress


    dbExpress is Borland''s newest database-access technology, supported both by Delphi
    and Kylix. Several database access technologies are supported by Delphi in previous
    releases, including BDE, ADO, and IBX. With these three technologies, you may
    wonder why we need a new one. dbExpress has a number of exciting characteristics,
    including


    +   Cross-platform Whereas BDE and ADO are specific to the Windows platform, dbExpress
    currently operates under Windows and Linux (the two platforms that Delphi/Kylix
    support). If Borland ever decides to support another platform, such as Mac, BE,
    or what have you, dbExpress will be there also.


    +   Low overhead dbExpress is a thin layer over the underlying database engine''s
    API. For this reason, it adds very little overhead to database operations.


    +   High-performance Largely because of its low overhead, dbExpress is extremely
    high-performance. It is designed to work in conjunction with Delphi''s client
    dataset technology.'
  merge: -1
  img_proc: true
- pgno: 19
  md: "+   *   Easy to distribute Again largely because of its low overhead, dbExpress\
    \ applications are easy to redistribute. A typical multitier application needs\
    \ to deploy MIDAS.DLL and a dbExpress driver for the back-end database, which\
    \ commonly weighs in at around 150KB. Contrast this to the BDE’s 10MB footprint.\n\
    \n# ## Databases Used in This Book\n\ndbExpress can connect to a number of database\
    \ backends, including InterBase, Oracle, DB2, and MySQL. I had to pick a single\
    \ database engine to use for the examples presented in this book. I chose InterBase,\
    \ for four reasons:\n\n+   *   It's free. Anyone can download a free copy of InterBase\
    \ from Borland’s Web site and work with any of the examples in this book.\n+ \
    \  \n+   *   It's universally accessible. InterBase ships on the Delphi and Kylix\
    \ CDs, so if you have a copy of either Delphi 6 or Kylix, you should already have\
    \ a copy of InterBase.\n+   \n+   *   It's manageable. I can easily provide a\
    \ small InterBase database for download. You can copy the database onto your local\
    \ machine and be off and running. I don’t need to worry about how I’m going to\
    \ redistribute a 30MB Oracle database to my readers.\n+   \n+   *   It’s the only\
    \ one of the four database engines that I have.\n\n# ## Conventions Used in This\
    \ Book\n\nSeveral typographic conventions are used through Delphi/Kylix Database\
    \ Development. These have been kept to a minimum in an attempt to make the text\
    \ as concise and clean as possible, but the ones that have been used should help\
    \ clarify certain types of text. Specifically, monospace font is used for Web\
    \ addresses, code listings, and Object Pascal syntax, such as TClientDataSet.\
    \ Filenames are written with lowercase letters.\n\n# ## Contacting the Author\n\
    \nIf you would like to contact me regarding any questions, comments, or criticism\
    \ you might have concerning this book, please feel free to email me at Eric.Harmon@txp.turbopower.com.\
    \ I will do my best to respond to you as quickly as possible. Please understand,\
    \ though, that I receive a large amount of e-mail on a daily basis, so it can\
    \ sometimes take a little while."
