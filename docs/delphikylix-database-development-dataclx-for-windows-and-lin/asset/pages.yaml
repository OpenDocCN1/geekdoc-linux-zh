- pgno: 40
  md: "TSQLConnection returns for tables, fields, indexes, and stored procedures is\
    \ their names. In the following chapter, I'll show you how to retrieve much more\
    \ detailed schema information from a database.\n\n# ## Executing DDL and DML Statements\n\
    \nThe most common operations that you will perform on a database are DDL (Data\
    \ Definition Language) and DML (Data Manipulation Language) statements. You can\
    \ execute DDL and DML statements directly through a TSQLConnection. DML statements\
    \ that return a cursor (that is, SQL SELECT statements) require a dataset component\
    \ in addition to the TSQLConnection, as you'll see in Chapter 3, “Client Dataset\
    \ Basics.”\n\n# ## DDL Commands\n\nDDL commands are statements that operate on\
    \ the database schema, rather than on the data itself. In the previous section,\
    \ I showed you how to retrieve information about the database schema. In this\
    \ section, I'll show you how to change the database schema.\n\nTSQLConnection\
    \ provides a method named `ExecuteDirect`, which you use to execute DDL commands.\
    \ `ExecuteDirect` takes a single parameter, which is the SQL command to execute.\
    \ It returns 0 on success, or a dbExpress error code on failure. dbExpress error\
    \ codes can be found in the file DBXPress.pas, which is included with Delphi.\n\
    \nThe Direct part of the name `ExecuteDirect` comes from the fact that the statement\
    \ is sent directly to the database. The statement is not prepared before it is\
    \ executed, and it cannot contain any parameters. (Parameterized SQL statements\
    \ are discussed in the section titled “Parameterized SQL Statements” later in\
    \ this chapter.)\n\n> **Note**\n> \n> Some databases don't support direct SQL\
    \ execution. On those databases, dbExpress will internally prepare the SQL statement,\
    \ and then execute it.\n\n# ## Creating a Table\n\nOne of the simplest and most\
    \ useful DDL commands you can issue is the command to create a new table in the\
    \ database. Assume that you want to create a table named EMPLOYEE with the structure\
    \ shown in Table 1.5. You would issue the following statement:\n\n```\n```pascal\n\
    SQLConnection1.ExecuteDirect('CREATE TABLE EMPLOYEE (EMPNO INTEGER, '\n  + 'NAME\
    \ VARCHAR(30); 'HIREDATE DATE, SALARY DOUBLE PRECISION');\n```\n```"
  merge: -1
  img_proc: true
- pgno: 41
  md: 'TABLE 1.5 Sample EMPLOYEE Table Definition

    | Column | Definition |

    | :--- | :--- |

    | EMPNO | INTEGER |

    | NAME | VARCHAR(30) |

    | HIREDATE | DATE |

    | SALARY | DOUBLE PRECISION |


    # ## Creating a Database


    You cannot use ExecuteDirect to create a new InterBase database. The following
    line of code does not work:


    ```

    SQLConnection1.ExecuteDirect(''CREATE DATABASE ''''''C:\NewData.gdb'''''');

    ```


    If you try to execute this code, you receive the following exception:


    ```

    Cannot prepare a CREATE DATABASE/SCHEMA statement.

    ```


    The InterBase client doesn''t allow direct execution of DDL or DML, so the dbExpress
    driver attempts to prepare, and then to execute the CREATE DATABASE statement.
    Because InterBase doesn''t allow a CREATE DATABASE statement to be prepared, an
    exception is raised.


    If you want your applications to be capable of creating new InterBase databases,
    you need to find another way to do it. One way is to keep an empty copy of the
    database in your program directory and copy it when the user creates a new database.


    I have found the following to be useful in my own experience: Save a copy of the
    empty database as a resource in your application. When the user creates a new
    database, save the resource to disk under the filename that the user selects.
    The following explanation shows how this can be done in a Windows environment.
    Note that this is Windows specific and can''t be used for a Linux or cross-platform
    application.


    First, you want to create a resource script file that turns your empty database
    into a resource. Assuming that you have an empty copy of your database in the
    D:\Interbase directory, the following script file creates a resource named EMPTYDB:


    ```

    EMPTYDB RCDDA DISCARDABLE "D:\Interbase\Empty.GDB"

    ```


    Save this script as EmptyDB.RC. To create a .RES file from the resource script,
    execute the following command:


    ```

    BRC32 EMPTYDB.RC

    ```'
