    \ TObject);\n\nvar\n  Server: string;\n\nbegin\n  if InputQuery(SConnectCaption,\
    \ SConnectPrompt, Server) then\n    SocketConnection1.Address := Server;\nend;\n\
    \n```\n\nThe first two methods of interest are the DataModuleCreate and DataModuleDestroy\
    \ methods. DataModuleCreate opens the cdsContacts table, which attempts to load\
    \ local data from the file CONMAN.CDS because the component's FileName property\
    \ is set to CONMAN.CDS. If the file does not exist, the program will display a\
    \ blank screen— it doesn't attempt to connect to the application server automatically.\n\
    \nDataModuleDestroy closes the cdsContacts table and also the connection to the\
    \ application server, if a connection was established. Because the cdsContacts.FileName\
    \ property is set, the program automatically writes the data to the file CONMAN.CDS.\
    \ In addition, the todo dataset is stored in the same CDS file because it is a\
    \ nested dataset of cdsContacts."
