- pgno: 303
  md: 'Like several of the other sample applications presented in this book, the Updates
    application contains an event log list box that shows you when and in what order
    interesting events fire for both the dataset provider and the client dataset.
    These events are discussed in the section titled “Provider Events,” later in this
    chapter.


    # ### Resolving Changes to BLOB Fields


    `TDataSetProvider` doesn’t automatically check for conflicts on BLOB fields, including
    memos. If two users change the contents of a BLOB field or memo, the second user’s
    changes will overwrite the first user’s changes without warning.


    Probably the best way to deal with this situation is to add a corresponding integer
    field to your database for each BLOB field. The integer field contains an “update
    number” for the BLOB field. For instance, if the database table contains a column
    named `IMAGE`, add an integer column named `IMAGEUNIQUE`, or something similar.
    Create a trigger for the `IMAGE` column such that the `IMAGEUNIQUE` column is
    incremented whenever the value of the `IMAGE` column changes.


    Using this technique, your application can detect changes on the `IMAGEUNIQUE`
    column, which indicates that the `IMAGE` column was changed also.


    # ## Refreshing Data from the Server


    Earlier chapters discussed the TDBNavigator component, with the exception of one
    button—the Refresh button.


    TDBNavigator’s Refresh button (which calls the TDataSet.Refresh method) is used
    to refresh the dataset from the underlying database. For TClientDataSet, Refresh
    refreshes the data by refetching all rows through the dataset provider.


    # CAUTION


    Refresh will raise an exception if the dataset’s change log is not empty. Before
    you call TClientDataSet.Refresh directly, you should check the ChangeCount property
    to see if it is zero. If it is nonzero, either apply or cancel the updates first
    (using ApplyUpdates or CancelUpdates) or refrain from calling Refresh.


    Refreshing data from the provider is useful in those cases in which a reconciliation
    error occurs and you want to retrieve the latest data from the underlying database.
    You can also call it at other times to ensure that the local copy of the data
    is up to date.'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'Rather than calling Refresh to refresh the entire dataset, you can also call
    TClientDataSet.RefreshRecord to refresh only the current record. RefreshRecord
    does not raise an exception if the dataset''s change log is not empty. Rather,
    it leaves the entire change log intact, including any changes that may have been
    made to the refreshed record.


    > RefreshRecord requires that pfInKey be set for all fields in the primary key
    (as discussed in the following section). In addition, you should usually call
    RefreshRecord only when the UpdateStatus of the current record is unsmodified.

    > ```pascal

    > if ClientDataSet1.UpdateStatus = usnmodified then

    >   ClientDataSet1.RefreshRecord;

    > ```


    # Update Modes


    When resolving data to the database, TDataSetProvider automatically builds the
    necessary SQL statement to send to the server to perform the update. An example
    of such an SQL statement is


    ```

    UPDATE CONTACTS SET LAST = ''Smith'' WHERE ID = 5

    ```


    TDataSetProvider allows you some control over how the SQL statement is built.
    The first level of control is afforded by the TDataSetProvider.UpdateMode property.
    UpdateMode may be set to one of the values shown in Table 7.3.


    TABLE 7.3 UpdateMode Values


    | Value | Description |

    | :--- | :--- |

    | upWhereAll | All designated fields are included in the WHERE clause. |

    | upWhereChanged | Only key fields as well as modified fields are included in
    the WHERE clause. |

    | upWhereKeyOnly | Only key fields are included in the WHERE clause. |


    Assume a table named EMPLOYEES has four columns: ID, NAME, BIRTHDAY, and SALARY.
    ID is the primary key for the table. One particular record in the table contains
    the values 1, "John Smith", 5/1/1958, $40,000.


    The following SQL statements show what SQL statement would be generated for the
    various settings of UpdateMode, assuming John Smith''s SALARY field was changed
    from $40,000 to $45,000.'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'When UpdateMode = upWhereAll, the SQL statement would be

    UPDATE EMPLOYEES SET SALARY TO 45000 WHERE (ID = 1) AND (NAME = ''John Smith'')

    AND (BIRTHDAY = ''5/1/1958'') AND (SALARY = 40000)


    When UpdateMode = upWhereChanged, the SQL statement would be

    UPDATE EMPLOYEES SET SALARY TO 45000 WHERE (ID = 1) AND (SALARY = 40000)


    Finally, when UpdateMode = upWhereKeyOnly, the SQL statement would be

    UPDATE EMPLOYEES SET SALARY TO 45000 WHERE ID = 1


    Table 7.3 describes designated fields and key fields. So what constitutes a designated
    field or key field, anyway? Each persistent field created on the server data module
    has a ProviderFlags property, which is used to instruct the provider how to treat
    the field. ProviderFlags is a set property and can contain any or all the values
    listed in Table 7.4.


    ProviderFlags is a property of TField, which means you don''t need to have persistent
    fields to use ProviderFlags. You can set ProviderFlags for a nonpersistent field,
    like this:

    sqlClients.FieldByName(''ID'').ProviderFlags := [pfInWhere, pfInKey];


    # TABLE 7.4 UpdateMode Values


    | Value | Description |

    | --- | --- |

    | pfInUpdate | The field can be modified. |

    | pfInWhere | The field is included in the WHERE clause when UpdateMode is set
    to upWhereAll or upWhereChanged. |

    | pfInKey | The field is part of the primary key and controls such features as
    refreshing records through a call to RefreshRecord, as well as reconciliation
    options such as merging. |

    | pfHidden | The field is included in data packets sent to and from the client
    only to serve as a way to make each record unique. The client dataset can''t see
    or modify the field. |


    # Note


    Nonpersistent fields also have a ProviderFlags property, which is automatically
    set to [pfInUpdate, pfInWhere].


    Continuing with the previous EMPLOYEES table example, you would set up persistent
    fields for the table as shown in Table 7.5.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '**TABLE 7.5** ProviderFlags Settings for the Fictional EMPLOYEES Table Fields

    | Field | ProviderFlags |

    | :--- | :--- |

    | IO | [pfInUpdate, pfInWhere, pfInKey] |

    | NAME | [pfInUpdate, pfInWhere] |

    | BIRTHDAY | [pfInUpdate, pfInWhere] |

    | SALARY | [pfInUpdate, pfInWhere] |


    IO is the primary key for the table.


    NAME, BIRTHDAY, and SALARY can all be updated, and they should all be included
    in the WHERE clause of an update SQL statement when the provider''s UpdateMode
    property is set to upWhereAll.


    # ## Provider Options


    TDataSetProvider supports various options that determine the way in which data
    is sent to the client dataset, what changes are allowed to the data, and the way
    in which updates to the data are handled. TDataSetProvider.Options is a set property
    that enables you to customize these options to your liking.


    Table 7.6 shows the valid settings for the Options property.


    **TABLE 7.6** TDataSetProvider Options


    | Option | Description |

    | :--- | :--- |

    | poFetchBlobsOnDemand | When True, BLOBs are not returned from the server as
    part of the data packet. The client application must call TClientDataSet.FetchBlobs
    to retrieve BLOB data. When False, BLOBs are returned as part of the data packet.
    |

    | poFetchDetailsOnDemand | Used when the provider is part of a master/detail relationship.
    When True, detail records are not returned from the server as part of the data
    packet. The client application must call TClientDataSet.FetchDetails to retrieve
    detail records. When False, detail records are returned as part of the data packet.
    |

    | poInclFieldProps | When True, field properties including Alignment, Currency,
    DisplayFormat, DisplayLabel, DisplayValues, DisplayWidth, EditFormat, EditMask,
    MaxValue, MinValue, and Visible are sent to the client along with the data. |'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# TABLE 7.6 Continued


    | Option | Description |

    | :--- | :--- |

    | poCascadeDeletes | Used when the provider is part of a master/detail relationship.
    When True, the server deletes detail records automatically when the master record
    is deleted. |

    | poCascadeUpdates | Used when the provider is part of a master/detail relationship.
    When False, updates that affect more than one record raise an exception. |

    | poReadOnly | When True, you can''t edit the data in the client dataset. |

    | poAllowMultiRecordUpdates | When True, allows updates that affect multiple records.
    When False, updates that affect more than one record raise an exception. |

    | poDisableInserts | When True, client datasets will not be able to Insert or
    Append new records. |

    | poDisableEdits | When True, client datasets will not be able to Edit existing
    records. |

    | poDisableDeletes | When True, client datasets will not be able to Delete existing
    records. |

    | poNoReset | When True, calls to AS_GetRecords ignore the reset flag. |

    | poAutoRefresh | When True, the provider automatically refreshes updated records
    with the latest data from the database. It is important to note that this option
    is not yet implemented in Delphi as of version 6. |

    | poPropagateChanges | When True, any changes made to data during the BeforeUpdateRecord
    or AfterUpdateRecord event handlers are sent back to the client. |

    | poAllowCommandText | When True, the client dataset can override the CommandText
    property of the provider''s dataset. When False, attempting to set the client
    dataset''s CommandText property raises an exception. |

    | poRetainServerOrder | When True, alerts the client dataset that it should not
    attempt to sort the data returned from the server. |


    At the time of this writing, the poAutoRefresh option is not implemented. poAutoRefresh
    will be useful for refreshing an updated record from the database when the database
    fills in field values automatically.'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'For example, a database might include a trigger for autogenerating a table''s
    primary key, using a generator. At the time a new record is posted to the database,
    the value of that field may be NULL. During the post operation, the database will
    fill in the value of the primary key, and poAutoRefresh will then reread the record
    so the Delphi application knows the value of the primary key.


    Without the poAutoRefresh option, you can still autoassign primary key values
    to a record, but you will need to perform a little work in the server-side data
    module. This technique is explained later, in the section titled "Changing Field
    Values on the Server."


    # # Provider Events


    TDataSetProvider publishes two types of events—OnXxx and BeforeXxx/AfterXxx. The
    BeforeXxx/AfterXxx events fire before and after “interesting” things happen in
    the provider, such as when updates are applied to the underlying database.


    Table 7.7 lists the Before and After events supported by TDataSetProvider.


    TABLE 7.7 TDataSetProvider BeforeXxx/AfterXxx Events


    | Event | Description |

    | :--- | :--- |

    | AfterApplyUpdates | Fired after the updates to the database are complete. |

    | AfterExecute | Fired after the server executes the query or stored procedure
    that will ultimately return data to the client. |

    | AfterGetParams | Fired after the server returns output parameters from the dataset
    to the client dataset. |

    | AfterGetRecords | Fired after the provider creates the data packet to send to
    the client. |

    | AfterRowRequest | Fired after the provider refreshes the current record because
    of a call to TClientDataSet.RefreshRecord or any other method that fetches data.
    |

    | AfterUpdateRecord | Fired after a record is successfully updated. |

    | BeforeApplyUpdates | Fired before updates are applied to the database. |

    | BeforeExecute | Fired before the server executes a query or stored procedure.
    |

    | BeforeGetParams | Fired before the server returns output parameters from the
    dataset to the client dataset. |

    | BeforeGetRecords | Fired before the provider creates the data packet to send
    to the client. |'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# TABLE 7.7 Continued


    | Event | Description |

    | :---- | :---- |

    | BeforeRowRequest | Fired before the provider refreshes the current record because
    of a call to TClientDataSet.RefreshRecord or any other method that fetches data.
    |

    | BeforeUpdateRecord | Fired before each record''s updates are applied to the
    database. |


    Most of the BeforeXxx and AfterXxx events pass a parameter named OwnerData. OwnerData
    is a variant that contains user-defined data. The data is passed from the client
    dataset to the provider and back to the client dataset during certain method calls,
    such as ApplyUpdates. The flow is as follows:


    In the client dataset BeforeXxx event (such as BeforeGetRecords), OwnerData can
    be set to anything that you want to pass to the provider. Because it is a variant,
    it can contain a simple value such as an integer—or something more complex, such
    as an array of values.


    As flow passes to the provider, the OwnerData parameter is passed to the provider''s
    BeforeXxx event. The value of OwnerData may be changed in the BeforeXxx event,
    if needed.


    Next, flow continues to the provider''s AfterXxx event, where OwnerData may again
    be changed if necessary.


    Finally, flow passes to the client dataset''s AfterXxx event, when you may inspect
    the (possibly modified) value of OwnerData. The client dataset''s AfterXxx event
    is the end of the line, so there is no reason to modify the value of OwnerData
    in the client dataset''s AfterXxx event.


    The following chapter shows an example of how you can use the OwnerData parameter
    to implement a stateless server. OnXxx events are fired to allow the application
    code to "hook" into the various stages of providing data to the client and resolving
    it back to the server. Table 7.8 lists the events supported by the TDataSetProvider
    component, along with their use.


    # TABLE 7.8 TDataSetProvider OnXxx Events


    | Event | Description |

    | :---- | :---- |

    | OnGetData | Fired after data is fetched from the underlying database but before
    the data is returned to the client. You can handle this event to modify the data
    in some way before passing it on to the client. For example, you might encrypt
    fields, compress the data, or weed out certain data that the client should never
    see. This event is discussed in the "Intercepting Data" section later in this
    chapter. |'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# TABLE 7.8 Continued


    | Event | Description |

    | :--- | :--- |

    | OnGetDataSetProperties | Fired after data is fetched from the underlying database
    but before the data is returned to the client. Using the optional parameters (discussed
    later in this chapter in the section titled “Optional Parameters”), you can send
    additional information to the client. |

    | OnGetTableName | Used when the provider returns data from a join or stored procedure.
    You can handle this event to instruct the provider which table to apply updates
    to. This option is discussed in the section titled “Providing and Resolving Data
    from a Join,” later in this chapter. |

    | OnUpdateData | OnUpdateData is the counterpart of OnGetData. It is fired just
    before updates are sent to the database server. You can handle this event to decrypt
    data before it is saved to the database, for example. This event is discussed
    in the “Intercepting Data” section later in this chapter. |

    | OnUpdateError | Fired when an error occurs while reconciling data. If you don’t
    handle this event, the error is sent back to the client application. You can handle
    this event to ignore certain errors or attempt to correct them on the server before
    sending them back to the client. |


    Some of the more interesting events will be discussed in more detail in the sections
    that follow.


    # Changing Field Values on the Server


    Sometimes, you will want the server to make modifications to data that is passed
    to it by the client. The most common example is when a table contains an ID field
    that is the primary key for the table. The database server is often responsible
    for assigning unique IDs to each individual record.


    To accomplish this, you must follow this procedure:


    +   1. Create a stored procedure in the database that will return the next unique
    ID.

    +   2. Include the poPropagateChanges setting in the TDataSetProvider’s Options
    property.

    +   3. Include the pfiInKey setting in the ID field’s ProviderFlags.

    +   4. Provide an event handler for the provider’s BeforeUpdateRecord event.'
  merge: -1
  img_proc: true
- pgno: 311
  md: "In the BeforeUpdateRecord event handler for a newly inserted record, obtain\
    \ the next value of the ID field and assign it to the record. The following code\
    \ snippet shows a typical implementation for the BeforeUpdateRecord event handler.\n\
    \n```\nprocedure TfrmMain DataSetProvider1BeforeUpdateRecord(Sender: TObject;\
    \ SourceDS: TDataSet; DeltaDS: TCustomClientDataSet; UpdateKind: TUpdateKind;\
    \ var Applied: Boolean);\nbegin\n  if UpdateKind = ukInsert then\n    if DeltaDS.FieldByName('ID').OldValue\
    \ <= 0 then\n      DeltaDS.FieldByName('ID').NewValue := GetNextID;\nend;\n```\n\
    \nWhere GetNextID looks like this:\n\n```\nfunction TfrmMain.GetNextID: Integer;\n\
    begin\n  sqlID.ExecSQL;\n  Result := sqlID.ParamByName('AValue').AsInteger;\n\
    end;\n```\n\nsqlID is a TSqlDataSet component that executes a stored procedure\
    \ on the database server, which in turn returns the next unique ID number in an\
    \ output parameter named AValue.\n\nI won't provide a program example using this\
    \ technique at this time, but you'll see this technique implemented in later examples\
    \ in this chapter.\n\n# Intercepting Data\n\nTable 7.4 lists two events, OnGetData\
    \ and OnUpdateData, that can be used to intercept data on its way from the provider\
    \ to the client and also on its way from the client to the provider.\n\nIn this\
    \ chapter, we're working with a single application; in other words, the client\
    \ and server portions of the data are both contained in a single application.\
    \ In the next chapter, we'll create client and server applications that may exist\
    \ on separate machines that can be located down the hall from each other or on\
    \ different continents.\n\nWhen data travels from machine to machine, unfortunately\
    \ there is always the chance that some hacker may be attempting to listen in on\
    \ the exchange of data. If the data includes anything sensitive, such as account\
    \ numbers or the like, you might want to consider encrypting that data before\
    \ sending it over the wire or across cyberspace.\n\nOnGetData and OnUpdateData\
    \ provide the two hooks on the server side for implementing this functionality.\
    \ The following code snippet shows implementations of both OnGetData and OnUpdateData\
    \ that encrypt data on its way to the client and decrypt data on its way back.\
    \ The functions EncryptData and DecryptData referenced by the code are fictitious\
