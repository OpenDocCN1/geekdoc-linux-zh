- pgno: 190
  md: 'analysis of the data. If the user doesn''t like the results, he can revert
    to the previous data by undoing his changes, either one at a time or in large
    chunks.


    # ## Cancel


    You are probably already familiar with the `Cancel` method, but I''ll mention
    it here anyway for completeness.


    The lowest level of undo support is simply discarding changes to the current record
    before they have been posted. The `Cancel` method provides this support:


    ```

    ```plaintext

    ClientDataSet1.Edit;

    ClientDataSet1.FieldByName(''Last'').AsString := ''Carter'';


    // Do more stuff here, and then decide not to save changes after all.


    ClientDataSet1.Cancel;```


    ```

    ```


    # ## The Change Log


    To support more advanced undo operations, client datasets incorporate a change
    log. The change log is used to remember each change that''s made to the dataset
    until the changes are either merged into the data, undone, or canceled. The following
    sections examine the different methods used to commit and roll back changes.


    The change log is saved with the data when you call `SaveToFile` or `SaveToStream`.
    When the dataset is read back in from the file or stream, the change log is in
    the same state that it was prior to the save. This means that you can even perform
    undo operations between invocations of your application.


    # ## LogChanges


    In order for the change log to be active, the dataset''s `LogChanges` property
    must be set to `True` (which is the default). If you don''t intend to provide
    undo support in your application, you can set `LogChanges` to `False`, slightly
    reducing memory requirements and increasing performance.


    > **CAUTION**

    > When creating applications that connect a client dataset to a dataset provider
    (as discussed in Chapter 7, "Dataset Providers"), you should not set `LogChanges`
    to `False`. This is because setting `LogChanges` to `False` prevents you from
    making changes to the client dataset and applying those changes to the underlying
    database.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# UndoLastChange


    You can undo the most recent change to the dataset (regardless of the record it
    was made to) by calling UndoLastChange.


    UndoLastChange takes a single Boolean parameter (FollowChange) that indicates
    whether the dataset should position itself to the record that was affected by
    the undo operation. If FollowChange is True, the client dataset positions its
    cursor to the record that was undone or restored. If FollowChange is False, the
    most recently modified record is still restored, but the current record is not
    changed.


    ```

    ClientDataSet.First;

    ClientDataSet.Next;

    ClientDataSet.Edit;

    ClientDataSet.FieldName(''Last'').AsString := ''Williams'';

    ClientDataSet.Post;

    ```


    ```

    ClientDataSet.First;

    ClientDataSet.Edit;

    ClientDataSet.FieldName(''Last'').AsString := ''Carter'';

    ClientDataSet.Post;

    ```


    ```

    ClientDataSet.Next;

    ClientDataSet.Edit;

    ClientDataSet.FieldName(''First'').AsString := ''Sam'';

    ClientDataSet.Post;

    ```


    ```

    ClientDataSet.Last;

    ```


    ```

    ClientDataSet.UndoLastChange(True);

    ```


    The preceding code snippet first modifies the second record in the dataset, then
    modifies the first record in the dataset, and then modifies the second record
    again. Finally, it moves to the end of the dataset. The call to UndoLastChange
    undoes only the second change to the second record, and repositions the dataset
    at the second record (because True was passed to UndoLastChange).


    If you were to issue a second call to UndoLastChange, the modification to the
    first record in the dataset would be undone. A third call to UndoLastChange would
    undo the first modification to the second record.


    # RevertRecord


    RevertRecord undoes all changes to the current record in the dataset. Modifying
    the preceding code snippet slightly, we get the following:'
