    \n# Summary\n\nThis chapter introduced you to data-aware components. The components\
    \ that we’ve covered are\n\n+   - TDataSource provides a high-level conduit between\
    \ data-aware components and datasets.\n+   - TDBText and TDBEdit are useful for\
    \ displaying and editing simple field values.\n+   - TDBMemo provides a means\
    \ of displaying and editing unformatted multiline text.\n+   - TDBRichEdit (a\
    \ VCL-only data-aware component) can be used to display and edit formatted multiline\
    \ text.\n+   - TDBCheckBox and TDBRadioGroup support the selection of one or more\
    \ options from an available list of options.\n+   - TDBComboBox and TDBListBox\
    \ enable the user to select a field value from a list of predefined values. I\
    \ also provided you with code for descendants of these two components that allows\
    \ finer control over the value stored in the associated data field."
