- pgno: 265
  md: "Figure 6.3 shows the Options application at runtime.\n\n![](img/52a35759a0f10dade27a840504be5d82_265_0.png)\n\
    \n# FIGURE 6.3\n\nThe Options application lets you experiment with the TDBGrid\
    \ component's options.\n\n# Custom Drawing\n\nAs you can see from Figure 6.2,\
    \ the grid's default appearance is pleasing to look at, but not especially eye-catching.\
    \ Using custom drawing, we can spruce up the look of the grid considerably.\n\n\
    To implement custom drawing in your grid, you need to handle the grid's OnDrawColumnCell\
    \ event. You might notice that the grid contains a similarly named event, OnDrawDataCell.\
    \ OnDrawDataCell is an obsolete event that is included for backward compatibility\
    \ with early versions of Delphi. You should not use it in any new programming\
    \ efforts.\n\nA newly created handler for the OnDrawColumnCell event looks like\
    \ this:\n\n```\n```\nprocedure TForm1.DBgrid1DrawColumnCell(Sender: TDBGrid; const\
    \ Rect: TRect;\n   DataCol: Integer; Column: TColumn; State: TGridDrawState);\n\
    begin\nend;\n```\n```\n\nAs with all grid events, the Sender parameter references\
    \ the grid object. Rect refers to the bounding rectangle of the cell that is about\
    \ to be drawn. DataCol is a zero-based index into the absolute position of the\
    \ column that is about to be drawn. State is a set containing one or more of the\
    \ values listed in Table 6.6."
  merge: -1
  img_proc: true
- pgno: 266
  md: "**TABLE 6.6 TGridDrawState Values**\n\n| Value | Description |\n| :--- | :---\
    \ |\n| gdSelected | The cell is selected. |\n| gdFocused | The cell has the focus.\
    \ |\n| gdFixed | The cell is fixed (that is, it's the indicator cell). |\n\nThe\
    \ difference between gdSelected and gdFocused can get confusing (especially because\
    \ these values change meaning slightly as the Options property changes), so I'll\
    \ clarify it here. When dgRowSelect is not set (the default), only the current\
    \ cell has the gdSelected value set. If the grid currently has focus, the current\
    \ cell has gdFocused set in addition to having the gdSelected value set.\n\nWhen\
    \ dgRowSelect is set, all cells in the current row have the gdSelected value set.\
    \ In addition, if the grid has focus, the first cell in the row (excluding the\
    \ indicator) has gdFocused set. You probably want to ignore the gdFocused value\
    \ when using dgRowSelect, as it has no useful meaning.\n\n# The DefaultDrawing\
    \ Property\n\nThe grid's DefaultDrawing property determines how drawing is performed\
    \ in the grid. When this property is True (the default), VCL/CLX draws each cell\
    \ in the grid as usual, and then passes control to the OnDrawColumnCell handler\
    \ that you set up. OnDrawColumnCell is called for every cell in the grid, so you\
    \ want to make sure that whatever code you write in that event handler executes\
    \ quickly.\n\nWhen DefaultDrawing is False, Delphi paints the cell with the appropriate\
    \ background color, and sets the grid's Brush and Font properties in readiness\
    \ to draw the cell. Then, it calls OnDrawColumnCell so that you can draw the contents\
    \ of the cell yourself.\n\nIn practice, you will often find that when you implement\
    \ custom drawing, Delphi's default drawing code does about 90% of what you need.\
    \ You might simply want to change the color of selected cells, draw an image in\
    \ a given column, or perhaps draw negative values in red.\n\nIt might seem that\
    \ the DefaultDrawing property goes to extremes. On the one hand, if it is True,\
    \ the cell is drawn using its default settings, and then you turn around and draw\
    \ over the top of it. On the other hand, if it is False, you need to draw every\
    \ single cell manually—even those that you don't need any special drawing for.\n\
    \nFortunately, this isn't the case. The solution is to set DefaultDrawing to False,\
    \ and then inside the OnCustomDrawColumn event handler, call the grid's DefaultDrawColumnCell,\
    \ like this:\n\n```\nprocedure TForm1.DBGridDrawColumnCell(Sender: TObject; const\
    \ Rect: TRect;\n  DataCol: Integer; Column: TColumn; State: TGridDrawState);\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 267
  md: "```\nbegin\nif Column.FieldName = 'Salary' then begin\nif Column.Field.AsFloat\
    \ > 50000.0 then begin\nDBGrid1.Canvas.Brush.Color := clYellow;\n\nif gfFocused\
    \ in State then\nDBGrid1.Canvas.Font.Color := clRed;\nend;\nend;\n\nDBGrid1.DefaultDrawColumnCell(Rec,\
    \ DataCol, Column, State);\nend;\n```\n\nThis code snippet only changes the way\
    \ the Salary column is drawn. If the salary is greater than $50,000, the background\
    \ of the cell is drawn in yellow. If the cell is focused, the salary is drawn\
    \ in red.\n\nFor all other cells, and for salaries that are less than or equal\
    \ to $50,000, the cell is drawn normally. The call to DefaultDrawColumnCell takes\
    \ care of drawing the cell after the appropriate changes (if any) are made to\
    \ the brush and font colors.\n\nThe way that Delphi’s internal VCL/CLX painting\
    \ code works, all you need to do in this handler is to set the canvas’ Brush and\
    \ Font properties so that they reflect the color and font that you want to use\
    \ when painting the cell. The call to DefaultDrawColumnCell then uses the settings\
    \ that you specified when drawing the cell contents.\n\n> NOTE\n> \n> Notice,\
    \ in the preceding code snippet, that I checked the FieldName property of the\
    \ column to see if the code is drawing the Salary column. You might be tempted\
    \ to use the DataCol parameter to check for this. However, DataCol is the zero-based\
    \ absolute index of the cell being drawn. If the user reorders the columns at\
    \ runtime, this value changes.\n\nThe following sample program demonstrates several\
    \ ways to custom draw grid cells. Listing 6.2 contains the complete source code\
    \ for the CustomDraw application.\n\n# LISTING 6.2 CustomDraw—MainForm.pas\n\n\
    ```\nunit MainForm;\n\ninterface\n```"
