- pgno: 84
  md: '# Parameterized Queries


    In most of the examples shown so far in this chapter, when querying the database,
    the entire query was specified. For example,


    ```

    SELECT * FROM CONTACTS WHERE COUNTRY = "United States"

    ```


    Although this works, it is less than efficient if you are going to execute the
    same general query multiple times. For example, say that you want to first retrieve
    all the contacts in the United States, and then all the contacts in Canada, and
    finally all the contacts in Mexico. You could write something like the following:


    ```

    SQLDataSet1.CommandType := ctQuery;

    SQLDataSet1.CommandText := ''SELECT * FROM CONTACTS '' +

    ''WHERE COUNTRY = "United States"'';

    SQLDataSet1.Open;

    ProcessDataSet;

    SQLDataSet1.Close;

    ```


    ```

    SQLDataSet1.CommandText := ''SELECT * FROM CONTACTS WHERE COUNTRY = "Canada"'';

    SQLDataSet1.Open;

    ProcessDataSet;

    SQLDataSet1.Close;

    ```


    ```

    SQLDataSet1.CommandText := ''SELECT * FROM CONTACTS WHERE COUNTRY = "Mexico"'';

    SQLDataSet1.Open;

    ProcessDataSet;

    ```


    In this example, ProcessDataSet is some fictitious method that would operate on
    the results of the query in some manner.


    Although the preceding code works correctly, it is far from optimal. Each time
    SQLDataSet1.CommandText is set, the backend database engine must parse and prepare
    the SQL statement. A better way to accomplish the same result is to parameterize
    the query, like this:


    ```

    SQLDataSet1.CommandText := ''SELECT * FROM CONTACTS WHERE COUNTRY = :Country'';

    ```


    This sets up a parameter named Country which acts like a placeholder in the SQL
    statement. By setting various values for this parameter, you can issue the same
    SQL statement for different countries, like this:


    ```

    SQLDataSet1.CommandType := ctQuery;

    SQLDataSet1.CommandText := ''SELECT * FROM CONTACTS WHERE COUNTRY = :Country'';

    SQLDataSet1.ParamByName(''Country'').AsString := ''United States'';

    SQLDataSet1.Open;

    ProcessDataSet;

    ```'
  merge: -1
  img_proc: true
- pgno: 85
  md: '```

    SQLDataSet1.Close;


    SQLDataSet1.ParamByName( ''Country'' ) .AsString := ''Canada'';

    SQLDataSet1.Open;

    ProcessDataSet;

    SQLDataSet1.Close;


    SQLDataSet1.ParamByName( ''Country'' ) .AsString := ''Mexico'';

    SQLDataSet1.Open;

    ProcessDataSet;

    ```


    In this scenario, the SQL statement is prepared only once—the first time that
    it is executed. After that, the statement does not need to be prepared again because
    the only thing that changes is the Country parameter.


    # **NOTE**


    > Note that the name of the parameter does not need to be the same as the column
    name that it refers to. In the previous example, the parameter could have been
    named ACountry, CountryParam, or Fred.


    There is one additional property that governs how parameters are treated: the
    ParamCheck property. When ParamCheck is set to True, parameters are automatically
    created by dbExpress (as the previous example indicates). However, if you set
    ParamCheck to False, you are responsible for creating the parameters yourself.
    The following code snippet shows how this is done:


    ```

    SQLDataSet1.CommandType := ctQuery;

    SQLDataSet1.ParamCheck := False;

    SQLDataSet1.CommandText := ''SELECT * FROM CONTACTS WHERE COUNTRY = :Country'';

    SQLDataSet1.Params.CreateParam(''Country'', ftString, ptInput);

    SQLDataSet1.ParamByName( ''Country'' ) .AsString := ''United States'';

    SQLDataSet1.Open;

    ```


    Note that, typically, you would only set ParamCheck to False when issuing a DDL
    statement that creates a stored procedure which accepts parameters as part of
    the stored procedure. Because that sounds confusing, let’s take a look at an example:


    ```

    SQLDataSet1.CommandType := ctQuery;

    SQLDataSet1.ParamCheck := False;

    SQLDataSet1.CommandText :=

    ''CREATE PROCEDURE CONTACTSBYTITLE(ATITLE VARCHAR(20)) '' +

    ''RETURNS (      INTEGER, '' +

    ''FIRST      VARCHAR(20) '' + {+DM} Fix typo: should be FIRST

    ```'
