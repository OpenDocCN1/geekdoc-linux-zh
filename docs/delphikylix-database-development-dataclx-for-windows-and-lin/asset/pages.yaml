- pgno: 143
  md: 'To filter a dataset, set its `Filter` property to the string used for filtering,
    and then set the `Filtered` property to `True`. For example, the following code
    snippet filters out all employees whose names begin with the letter M.


    ```

    ```

    ClientDataSet1.Filter := ''Name LIKE '' + QuotedStr(''M%'');

    ClientDataSet1.Filtered := True;

    ```

    ```


    To later display only those employees whose names begin with the letter P, simply
    change the filter, like this:


    ```

    ```ClientDataSet1.Filter := ''Name LIKE '' + QuotedStr(''P%'');```

    ```


    To remove the filter, set the `Filtered` property to `False`. You don’t have to
    set the `Filter` property to an empty string to remove the filter (which means
    that you can toggle the most recent filter on and off by switching the value of
    `Filtered` from `True` to `False`).


    You can apply more advanced filter criteria by handling the dataset’s `OnFilterRecord`
    event (instead of setting the `Filter` property). For example, say that you want
    to filter out all employees whose last names sound like Smith. This would include
    Smith, Smythe, and possibly others. Assuming that you have a `Soundex` function
    available, you could write a filter method like the following:


    ```

    ```

    procedure TForm1.ClientDataSet1FilterRecord(DataSet: TDataSet;

    var Accept: Boolean);

    begin

    Accept := Soundex(DataSet.FieldByName(''LastName'').AsString) =

    Soundex(''Smith'');

    end;

    ```

    ```


    If you set the `Accept` parameter to `True`, the record is included in the filter.
    If you set `Accept` to `False`, the record is hidden.


    After you set up an `OnFilterRecord` event handler, you can simply set `TClientDataSet.Filtered`
    to `True`. You don’t need to set the `Filter` property at all.


    The following example demonstrates different filter and range techniques.

    Listing 3.4 contains the source code for the main form.


    # **LISTING 3.4** RangeFilter—MainForm.pas


    ```

    ```

    unit MainForm;


    interface


    uses

    SysUtils, Classes, QGraphics, QControls, QForms, QDialogs, QStdCtrls, DB, DBClient,
    QExtCtrls, QGrids, QDBGrids;

    ```

    ```'
