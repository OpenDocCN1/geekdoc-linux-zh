  md: "```\n```\nbegin\n  Stream := ClientDataSet1.CreateBLOBStream(\n    ClientDataSet1.FieldByName('DATA'),\
    \ bmRead);\ntry\n  List.Clear;\n\n  Stream.Read(Count, sizeof(Count));\n  for\
    \ Index := 0 to Count - 1 do begin\n    Stream.Read(Num, sizeof(Num));\n    List.Add(Pointer(Num));\n\
    \  end;\nfinally\n  Stream.Free;\nend;\nend;\n```\n```\n\nNote the use of Stream.Write\
    \ and Stream.Read in the previous procedures. Both of these methods take a reference\
    \ to the data to be written as the first parameter, and the number of bytes to\
    \ write as the second parameter. Saving a block of data is as straightforward\
    \ as making repeated calls to TStream.Write. You must make sure to read the data\
    \ in exactly the same order as it was written in, or you will end up with an exception\
    \ at best and corrupted data at worst.\n\nNote also the use of the TDataSet method\
    \ CreateBLOBStream to create a blob stream suitable for the dataset. Many beginning\
    \ Delphi database programmers attempt to call TBlobStream.Create, like this:\n\
    \n```\n```\nvar\n  Stream: TBlobStream;\nbegin\n  Stream := TBlobStream.Create(...);\n\
    try\n  // Read from or write to the stream here.\nfinally\n  Stream.Free;\nend;\n\
    end;\n```\n```\n\nThe problem with this approach is that TBlobStream is specific\
    \ to the BDE. Creating an instance of TBlobStream will not work with non-BDE datasets,\
    \ such as TClientDataSet. To create a blob stream that will work with the current\
    \ dataset, always call the dataset’s CreateBLOBStream method, like this:"
