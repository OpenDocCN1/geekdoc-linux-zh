- pgno: 73
  md: '# Queries


    A query provides a way to retrieve a subset of the data stored in the underlying
    database table. It also enables you to join information from one table to another.
    In general, a query enables you to execute any SQL SELECT statement and return
    the results.


    # Stored Procedures


    Stored procedures are procedures written in the underlying database, and stored
    in the database itself. dbExpress stored procedures enable you to retrieve data
    from a database stored procedure.


    # General-Purpose Datasets


    The dbExpress components that provide table-level, query-level, and stored procedure
    access are TSQLTable, TSQLQuery, and TSQLStoredProc, respectively. These components
    are provided solely for ease of conversion from BDE applications, and correspond
    to the BDE data-access components TTable, TQuery, and TStoredProc.


    For all new development, it is strongly recommended that you use the general-purpose
    component TSQLDataSet. TSQLDataSet allows access to tables, queries, and stored
    procedures alike, and is more flexible than any of the other special-purpose components
    mentioned previously.


    TSQLDataSet implements almost all of the dbExpress dataset functionality. TSQLTable,
    TSQLQuery, and TSQLStoredProc descend from TSQLDataSet and add behavior specific
    to tables, queries, and stored procedures. In turn, TSQLDataSet descends from
    TDataSet, which is the root class for all Delphi datasets.


    Table 2.1 lists the relevant properties defined by TSQLDataSet.


    TABLE 2.1 TSQLDataSet Properties

    | Property | Description |

    | Active | Set to True to open the dataset, or to False to close the dataset.
    You can also read this property to determine whether the dataset is currently
    open or closed. |

    | CommandText | The way in which CommandText is used depends on the value of CommandType.
    See the following sections for more information on CommandText. |

    | CommandType | Set CommandType to ctQuery to execute a query, to ctStoredProc
    to execute a stored procedure, or to ctTable to open a table. See the following
    sections for more information on CommandType. |

    | DataSource | Used to establish a master/detail link between two datasets. See
    the section titled “Master/Detail Relationships” for more information. |'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# TABLE 2.1 Continued


    | Property | Description |

    | :--- | :--- |

    | MaxBlobSize | Sets the maximum amount of data returned from BLOB fields. See
    the section titled “BLOB Support” for more information. |

    | ObjectView | When True, the dataset provides additional support for ADT fields,
    array fields, and master/detail relationships. See the section titled “Master/Detail
    Relationships” for more information. |

    | ParamCheck | When True, the dataset automatically generates parameters whenever
    CommandText changes. If you want to create parameters manually, set this to False.
    See the section titled “Parameterized Queries” for more information. |

    | Params | Contains a list of input and output parameters for the current query
    or stored procedure. See the section titled “Parameterized Queries” for more information.
    |

    | SortFieldNames | Only used when ComandType = ctTable. Defines the order in which
    data is returned from the server. See the section titled “Ordering Data Returned
    from the Server” for more information. |

    | SQLConnection | The TSQLConnection component to which this dataset is connected.
    You should set this property before setting any other properties in the dataset.
    |


    # Table-Level Access


    To access an underlying database table, you can use the TSQLTable component. The
    fundamental properties are SQLConnection and TableName. You can also set IndexName
    if you want to select an index for record-ordering purposes. The following code
    snippet illustrates how to set table properties and open a table-based dataset:


    ```

    SQLTable1.SQLConnection := conn;

    SQLTable1.TableName := ''CONTACTS'';

    SQLTable1.IndexName := ''IX_CONNAMES'';

    SQLTable1.Open;

    ```


    # Query-Level Access


    You can use TSQLQuery to create an ad hoc query for retrieving data from a database.
    The following code shows how to do this:


    ```

    SQLQuery1.SQLConnection := conn;

    SQLQuery1.SQL.Text := ''SELECT * FROM CONTACTS WHERE COUNTRY = "United

    States"'';

    SQLQuery1.Open;

    ```'
