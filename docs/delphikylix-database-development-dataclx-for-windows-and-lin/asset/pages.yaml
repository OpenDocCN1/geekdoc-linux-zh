    \ the Advanced program in action.\n\n# Retrieving Schema Information\n\nThe preceding\
    \ chapter showed how to retrieve basic schema information for a database (such\
    \ as table names, index names, and stored procedure names). This section explains\
    \ how to use TSQLDataSet to retrieve more detailed information about tables and\
    \ columns.\n\nTo retrieve comprehensive schema information from a database, you\
    \ call TSQLDataSet.SetSchemaInfo, which specifies the object whose schema you\
    \ want to retrieve, and what type of schema data to return. SetSchemaInfo takes\
    \ three parameters, and is defined like this:\n\n```\nprocedure SetSchemaInfo(SchemaType:\
