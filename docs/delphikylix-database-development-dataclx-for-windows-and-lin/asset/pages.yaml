- pgno: 275
  md: "# Persisting Grid Settings\n\nUsers expect customizations to be persistent\
    \ across program invocations, and grid settings are no exception. When your users\
    \ resize or reorder the columns in a grid, they usually expect the column order\
    \ and size to be the same the next time they run the application.\n\nIt isn't\
    \ difficult to persist grid column settings. There are two approaches that you\
    \ can take:\n\n+   - Save the settings to a stream or to a separate file.\n+ \
    \  - Save the settings to the Windows registry or to an ini file.\n\nThe first\
    \ option is simpler, so I'll cover it first. TDBGrid's Columns property provides\
    \ SaveToFile and SaveToStream methods that you can use to save column configurations,\
    \ to either a file or a stream, with a minimum of fuss. The following code snippet\
    \ shows how you can save column settings to a file:\n\n```\nTDBGrid.Columns.SaveToFile(\
    \ 'GRID.CFG' );\n```\n\nSimilarly, to reload the settings:\n\n```\nTDBGrid.Columns.LoadFromFile(\
    \ 'GRID.CFG' );\n```\n\nThe drawback to this approach is that if you have many\
    \ different grids in your application, you need separate configuration files to\
    \ persist each one. If that is the case, you might want to look at SaveToStream\
    \ instead of SaveToFile. With a little effort, you can use SaveToStream to save\
    \ a grid's column configuration to an ini file or to the Windows registry. The\
    \ following procedure saves column information to an ini file:\n\n```\nprocedure\
    \ SaveColumnConfiguration(const FileName: string; Grid: TDBGrid;\n  const SectionName:\
    \ string; const Name: string);\nvar\n  ini: TIniFile;\n  MemStream: TMemoryStream;\n\
    begin\n  MemStream := TMemoryStream.Create;\n  try\n    Grid.Columns.SaveToStream(MemStream);\n\
    \    MemStream.Seek(0, soFromBeginning);\n\n    ini := TIniFile.Create(FileName);\n\
    \    try\n      ini.WriteBinaryStream(SectionName, Name, MemStream);\n    finally\n\
    \      ini.Free;\n    end;\n  finally\n    MemStream.Free;\n  end;\n```"
  merge: -1
  img_proc: true
- pgno: 276
  md: "This code first creates a memory stream and saves the column configuration\
    \ to that stream. Next, it writes the stream out to the ini file. With minor modifications,\
    \ you could change this code to use the Windows registry instead of an ini file.\n\
    Similarly, the following procedure loads the column information back from the\
    \ ini file:\n\n```\nprocedure LoadColumnConfiguration(const FileName: string;\
    \ Grid: TDBGrid;\n   const SectionName: string; const Name: string);\nvar\n  \
    \ ini: TIniFile;\n   MemStream: TMemoryStream;\nbegin\n   MemStream := TMemoryStream.Create;\n\
    \   try\n      ini := TIniFile.Create(FileName);\n      try\n         ini.ReadBinaryFileStream(SectionName,\
    \ Name, MemStream);\n         if MemStream.Size > 0 then\n            Grid.Columns.LoadFromStream(MemStream);\n\
    \      finally\n         ini.Free;\n      end;\n   finally\n      MemStream.Free;\n\
    \   end;\nend;\n```\n\n# Limitations\n\nFor all its power, TDBGrid does have some\
    \ limitations. The most notable one is that it doesn't display memos or images.\
    \ You can draw images or memos manually using the custom drawing features of the\
    \ grid, but because each grid row is the same height, this can lead to difficulties\
    \ when one memo is three lines long and another is thirty lines long.\nThis limitation\
    \ (as well as others) is removed by many of the third-party grids available. At\
    \ the end of this chapter, there is a quick overview of some of the third-party\
    \ grids that you might want to look into.\n\n# TClientDataSetGrid\n\nTClientDataSetGrid\
    \ is a TDBGrid descendant written by John Kaster. It takes advantage of some of\
    \ the functionality of client datasets to provide automatic sorting of the grid\
    \ when the user clicks a column title.\nIn addition, TClientDataSetGrid can automatically\
    \ persist column information to and from a separate configuration file. It doesn't\
    \ support saving and loading column information to and"
  merge: -1
  img_proc: true
- pgno: 277
  md: 'from an ini file, or to and from the Windows registry, so you might still want
    to make use of the SaveColumnConfiguration and LoadColumnConfiguration procedures
    provided in the preceding section. (TClientDataSetGrid is available as ID 15099
    on Code Central at http://codecentral.borland.com.)


    # ## Automatic Sorting


    As indicated previously, TClientDataSetGrid enables the user to sort the grid
    in ascending or descending order, on a single column or on multiple columns. It
    can even sort one column in ascending order and another column in descending order.


    To enable this functionality, you must set the component''s TitleSort property
    to True. (It is False by default, allowing the component to be used with nonclient
    datasets. If you set TitleSort to True, TClientDataSetGrid does not work with
    datasets that do not derive from TCustomClientDataSet.)


    To indicate the current sort order, TClientDataSetGrid draws three-dimensional
    arrows in the title of the sorted column(s). The colors used to draw these arrows
    are set through the ArrowColor, ArrowHighlight, and ArrowShade properties.


    Figure 6.4 shows how the grid looks when sorted by Name, and then by Birthday.


    ![](img/52a35759a0f10dade27a840504be5d82_277_0.png)


    # ### Figure 6.4

    TClientDataSetGrid provides visual feedback about the current sort order.


    To sort, click one of the column titles. An up arrow will be drawn in the title
    cell of that column. To switch to descending order, click the column title again.


    If you want to sort on more than one column, press Shift and click the next column
    title to sort on. Press Shift and click the column title a second time to sort
    in descending order on that column only. Pressing Shift and clicking the column
    a third time removes it from the current sort order. Repeat this for every column
    you want to sort on.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'This is actually easier done than said. If the previous explanation sounds
    complicated, you might want to play with clicking, and pressing shift and clicking,
    column titles to see the effect for yourself.


    # ## Column Customization


    In addition to automatic sorting capabilities, **TClientDataSetGrid** provides
    a separate dialog that can be used to set the visible columns for the grid (as
    shown in Figure 6.5). To display this dialog, call the grid''s **ConfigureColumns**
    method, like this:


    ```

    `TClientDataSetGrid.ConfigureColumns;`

    ```


    ![](img/52a35759a0f10dade27a840504be5d82_278_0.png)


    # ### FIGURE 6.5


    > *TClientDataSetGrid* enables the user to hide columns that he doesn''t want
    to see.


    Using this dialog, the user can hide or show individual columns.


    If you want the grid to automatically save and restore its column configuration
    (including column order and the visibility state of individual columns), set the
    **ConfigFile** property to the name of the file that you want to use for persisting
    the column information. Make sure to use a different filename for each grid, as
    the current version of this component doesn''t support saving multiple configurations
    in a single file.'
