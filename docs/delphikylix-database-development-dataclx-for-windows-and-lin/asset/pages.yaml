    ![](img/52a35759a0f10dade27a840504be5d82_110_0.png)


    # FIGURE 3.2


    *The New Field dialog after entering information for a new field.*


    Click OK to add the field to the client dataset. You''ll see the new ID field
    listed in the field editor.


    Now add a second field, called LastName. Right-click the field editor to display
    the New Field dialog and enter LastName in the Name edit control. In the Type
    combo, select String. Then, set Size to 30—the size represents the maximum number
