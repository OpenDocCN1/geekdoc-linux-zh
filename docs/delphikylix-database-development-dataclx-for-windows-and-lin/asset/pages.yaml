    Note in the preceding code that the transactions are enclosed in try/except blocks.
    If an exception occurs while executing the code, the transaction is rolled back.


    Listing 1.5 contains the complete source code for an application that demonstrates
    dbExpress transaction support (including transaction isolation, committing and
    rolling back transactions, and nested transactions).


    # LISTING 1.5 Trans—MainForm.pas


    ```

    unit MainForm;

    interface

    uses

    SysUtils, Classes, QGraphis, QControls, QForms, QDialogs, OExtCtrls, DBXpress,
    QStdCtrls, DB, SqlExpr;

