- pgno: 331
  md: 'The previous chapter gave an overview of providers and explained how to use
    them in a multi-tier application where the client and application server are physically
    located in a single executable.


    This chapter expands the discussion to show you how to create multitier database
    applications where the client and application server are in different executables,
    which may then run on the same machine or, more likely, on two separate computers.


    Delphi supports a number of underlying protocols to connect to an application
    server, including DCOM, CORBA, HTTP, and SOAP. This book does not attempt to explain
    any of these technologies in detail. Rather, it describes how to set up the required
    connection component for each of the technologies. It is assumed that you already
    have the necessary software installed and functioning properly for the protocol
    that you will use to connect to the application server.


    # ## What Is DataSnap?


    DataSnap is the technology that allows client applications to connect to providers
    in an application server. DataSnap is implemented by a number of components that
    can be used to connect different machines through such underlying technologies
    as sockets, DCOM, CORBA, HTTP, and SOAP.


    > > **NOTE**

    > >

    > > In earlier versions of Delphi, DataSnap was named MIDAS. Because of international
    trademark considerations, the name MIDAS has been changed to DataSnap.


    # ## Creating the Application Server


    This section describes the steps necessary to create an application server. The
    application server contains all the code necessary to connect to the underlying
    database and provide the resulting data to the client application. As you’ll learn
    later in this section, the application server can also provide other, possibly
    non-database related, services to the client.


    # ## Remote Data Modules


    When creating the application server, the first order of business is to set up
    one or more remote data modules. A remote data module is simply a data module
    that can be accessed remotely from a client application. The remote data module
    contains the components that we placed on the server-side data module in the previous
    chapter.'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'In many, if not most, application servers, a single remote data module will
    suffice. However, you can create multiple remote data modules in a single application
    server if you want. Some reasons for doing so include the following:


    +   - The application server needs to connect to multiple databases, and you want
    to create a distinct remote data module for each database connection.

    +   - Two types of users will run this application—perhaps a “normal” user and
    an administrator. You may want to create two separate remote data modules, in
    which the remote data module used for administrators contains additional tables
    or queries for sensitive data.

    +   - One data module is used to provide access to the underlying database, and
    another data module is used to provide other, non-data-aware services, such as
    numeric calculations. This capability is discussed later, in the section titled
    “Adding Methods to the Remote Data Module.”


    # ## Creating a Remote Data Module


    Creating a remote data module for non-SOAP applications is a straightforward operation.


    +   - Create a new application, which will be the application server.

    +   - From Delphi’s main menu, select File, New, Other. Delphi’s New Items dialog
    is displayed. Select the Multitier tab. The New Items dialog should look like
    the image shown in Figure 8.1.

    +   - Select one of the remote data modules from the list and click OK. The different
    data modules are discussed in the following sections.


    ![](img/52a35759a0f10dade27a840504be5d82_332_0.png)


    **Figure 8.1**

    *Delphi supports three remote data modules—Remote Data Modules, Transactional
    Data Modules, and CORBA Data Modules.*'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# Creating a Standard Remote Data Module


    The examples presented in this book all use a standard remote data module. This
    type of data module is used for clients connecting through sockets, DCOM, or HTTP
    connections.


    To create a TRemoteDataModule, select **Remote Data Module** from the Multitier
    page of the New Items dialog and click OK. The dialog shown in Figure 8.2 appears.


    ![](img/52a35759a0f10dade27a840504be5d82_333_0.png)


    # FIGURE 8.2

    *Creating a standard remote data module.*


    Enter a CoClass name for the data module, such as ContactDataServer or some other
    meaningful name. The application name and CoClass together form the name by which
    the remote data module is referenced. For example, if the application name is
    ContactServer and the CoClass name is ContactDataServer, the remote data module
    is referenced from the client application as ContactServer.ContactDataServer.


    Select the type of instancing to use for the remote data module. Table 8.1 lists
    the possible values for this selection.


    # **TABLE 8.1** Instancing Values


    | *Value* | *Description* |

    | :--- | :--- |

    | Internal | The remote data module cannot be created from an external client.
    Internal remote data modules are always created from within the server application.
    |

    | Single Instance | Each client that attempts to connect to the server will cause
    a separate instance of the server executable to run. |

    | Multiple Instance | Only one copy of the server executable will run, but it
    will instantiate a separate remote data module for each client that connects to
    it. |


    In most situations, you should leave the Instancing combo box set to Multiple
    Instance.


    Lastly, select the threading model to use for the remote data module. Table 8.2
    lists the possible values for the Threading Model combo.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# TABLE 8.2 Threading Model Values


    | Value | Description |

    | --- | --- |

    | Single | The data module will receive requests from only a single client at
    a time. Because of this, you don’t need to deal with threading issues. |

    | Apartment | Each instance of the data module will service only a single request
    at a time. However, the server may handle multiple requests on multiple data modules
    at the same time. Therefore, you need to handle multi-threading issues on global
    data. |

    | Free | The data module can receive multiple requests from multiple clients at
    the same time. In addition to dealing with thread conflicts on global data, you
    must also protect instance data. |

    | Both | The same as *Free* with the exception that any callbacks made to client
    interfaces are serialized. |

    | Neutral | Multiple clients can make requests to the same data module at the
    same time, but COM ensures that no two requests conflict with each other. This
    is supported only under COM+. When not running under COM+, this is treated the
    same as the *Apartment* model. |


    After you have filled in the appropriate values (the default values for *Instancing*
    and Threading Model are fine in most cases) you can click OK to create the remote
    data module.


    # Creating a MTS Remote Data Module


    A *TMTSDataModule* should be used for application servers that will be installed
    under MTS or COM+. These data modules can also be used for clients connecting
    through sockets, DCOM, or HTTP connections.


    *TMTSDataModules* can be created only in an ActiveX X library—not in an application.


    To create a *TMTSDataModule*, select **Transactional Data Module** from the Multitier
    page of the New Items dialog. The dialog shown in Figure 8.3 appears.


    ![](img/52a35759a0f10dade27a840504be5d82_334_0.png)


    # FIGURE 8.3


    *Creating a transactional remote data module.*'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'Enter a CoClass name for the data module, such as ContactDataServer, or some
    other meaningful name.


    Select the threading model to use for the remote data module. Transactional data
    modules support the Single, Apartment, and Both threading models from Table 8.2.


    Finally, select the transaction model to use for the data module. Because we won''t
    be creating TMTSDataModules in this book, I''ll refer you to the Delphi help for
    an explanation of the different transactional models.


    Click OK to create the TMTSDataModule.


    # ## Creating a CORBA Remote Data Module


    You should create a TCORBADataModule if you want to use the application server
    to provide data to clients across a CORBA connection.


    To create a TCORBADataModule, select CORBA Data Module from the Multitier page
    of the New Items dialog and click OK. The dialog shown in Figure 8.4 appears.


    ![](img/52a35759a0f10dade27a840504be5d82_335_0.png)


    **FIGURE 8.4**

    *Creating a CORBA remote data module.*


    Enter a CoClass name for the data module, such as ContactDataServer, or some other
    meaningful name.


    Select the instancing type and threading models to use for the remote data module.
    Because we won''t be creating TCOBBADataModules in this book, I''ll refer you
    to the Delphi help for an explanation of the valid instancing types and threading
    models for a CORBA data module.


    Click OK to create the TCORBADataModule.


    # ## Creating a SOAP Remote Data Module


    TSOAPDataModule is used to provide data to clients that are set up to access data
    from a Web service.'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'To create a remote data module for a SOAP application server, perform the following
    steps.


    +   - From Delphi’s main menu, select File, New, Other. Delphi’s New Items dialog
    is displayed. Select the WebServices tab.

    +   - Select SOAP Server Application from the New Items dialog and click OK. The
    dialog shown in Figure 8.5 appears.


    ![](img/52a35759a0f10dade27a840504be5d82_336_0.png)


    # **FIGURE 8.5**


    Delphi supports five types of SOAP server applications.


    +   - Select the type of SOAP server application to create. If you’re creating
    a Web App Debugger executable, enter a CoClass name to use for the COM object
    that the Web App Debugger uses to call your Web module. Click OK to create the
    SOAP Server Application.

    +   - Again, select File, New, Other from Delphi’s main menu. Select the WebServices
    tab in the New Items dialog.

    +   - Select SOAP Server Data Module on the WebServices tab and click OK. The
    dialog shown in Figure 8.6 appears.


    ![](img/52a35759a0f10dade27a840504be5d82_336_1.png)


    # **FIGURE 8.6**


    Creating a SOAP Server Data Module.


    +   - Enter a class name for the data module and click OK. The class name may
    be anything you want, such as MyDataServer, CustomerDataServer, or any other meaningful
    name.'
  merge: -1
