- pgno: 363
  md: "The Todos table stores reminders for each contact. For example, you might want\
    \ to store a reminder to phone a certain contact on a given date to place an order.\
    \ The Todos table and Contacts table are linked through the Todos table's ContactID\
    \ field.\n\nIn addition to the tables, the database contains a stored procedure\
    \ named contactsByState. This procedure is provided for use in the sample applications\
    \ shown in Chapters 1 and 2; it won't be used in the ConMan application.\n\nFinally,\
    \ the script creates a generator used to populate the primary keys of the Contacts\
    \ and Todos tables and two triggers that run when a new contact and todo are entered,\
    \ respectively. The triggers ensure that new contacts and todos always receive\
    \ a unique primary key.\n\n# Listing 9.1 ConMan.SQL\n\n```\n/\\* Table: CONTACTS,\
    \ Owner: SYSDBA \\*/\n\nCREATE TABLE CONTACTS\n(\n    CONTACTID    INTEGER NOT\
    \ NULL,\n    FIRST         VARCHAR(20),\n    LAST          VARCHAR(30),\n    DEAR\
    \          VARCHAR(40),\n    TITLE         VARCHAR(30),\n    COMPANYNAME   VARCHAR(50),\n\
    \    ADDRESS1      VARCHAR(50),\n    ADDRESS2      VARCHAR(50),\n    CITY    \
    \      VARCHAR(30),\n    STATE         VARCHAR(20),\n    POSTALCODE    VARCHAR(10),\n\
    \    COUNTRY       VARCHAR(30),\n    PHONE         VARCHAR(20),\n    FAX     \
    \      VARCHAR(20),\n    CELLULAR      VARCHAR(20),\n    PAGER         VARCHAR(20),\n\
    \    EMAIL         VARCHAR(40),\n    IMAGE         BLOB SUB_TYPE 0 SEGMENT SIZE\
    \ 4096,\n    NOTES         BLOB SUB_TYPE TEXT SEGMENT SIZE 4096,\n    PRIMARY\
    \ KEY (CONTACTID)\n);\n\nCREATE UNIQUE INDEX IX_CONNAME ON CONTACTS (LAST, FIRST);\n\
    \nCREATE TABLE TODOS\n(\n```"
