- pgno: 43
  md: "# ## Simple SQL Statements\n\nThe simplest DML statement is one that takes\
    \ no parameters and returns no rows. For example, you might want to delete all\
    \ employees whose *Active* status is n. To do so, you would issue the following\
    \ statement:\n\n```\n```\nSQLConnection1.ExecuteDirect('DELETE FROM EMPLOYEE WHERE\
    \ Active = ''N''');\n```\n```\n\nNote in the preceding code snippet that the ‘N’\
    \ is surrounded by quotes. A better approach to quoting string constants manually\
    \ is to use the RTL function, `QuotedStr`. `QuotedStr` takes a string parameter\
    \ and returns the string within quotes. One of the main reasons for using `QuotedStr`\
    \ is that it correctly handles string constants that contain quotes. For example,\
    \ given the name O’Toole, would you know how to quote it manually? The correct\
    \ way is ‘O’‘Toole’\n\nUsing `QuotedStr`, you don’t have to worry about how to\
    \ correctly quote a string. The preceding `ExecuteDirect` call becomes\n\n```\n\
    ```\nSQLConnection1.ExecuteDirect('DELETE FROM EMPLOYEE WHERE Active = ' + \n\
    \    QuotedStr('N'));\n```\n```\n\n# ## Parameterized SQL Statements\n\nMany times,\
    \ you want to execute the same basic SQL statement more than once, changing only\
    \ the values that are passed to the parameters in the statement. For example,\
    \ say you want to insert a number of records into the previously created EMPLOYEE\
    \ table. To insert an employee, John Doe, you would execute the following SQL\
    \ statement:\n\n```\n```\nSQLConnection1.ExecuteDirect('INSERT INTO EMPLOYEE VALUES\
    \ (123,\n    ''John Doe'', ''5/15/1994'', 35000)');\n```\n```\n\nAgain, `QuotedStr`\
    \ could be used here instead of quoting the strings manually.\n\nFor each employee\
    \ that you want to add, you would create and execute a similar SQL statement.\
    \ Parameterized SQL statements enable you to create a sort of statement *template*,\
    \ in which you can easily enter the appropriate values for each statement before\
    \ executing. For the EMPLOYEE table, the SQL INSERT statement becomes the following:\n\
    \n```\n```\nINSERT INTO EMPLOYEE VALUES (:EmpNumber, :Name, :Hired, :Salary)\n\
    ```\n```\n\nEach value to be inserted into the database is replaced with a parameter.\
    \ Parameters are easily detectable because they start with a colon. Internally,\
    \ the dbExpress components parse the SQL statement, and convert the parameters\
    \ into question marks that the core dbExpress code supports. In turn, the dbExpress\
    \ driver replaces the question marks with the parameter markers, which are supported\
    \ by the backend database engine."
  merge: -1
  img_proc: true
- pgno: 44
  md: "For example, given the previous INSERT statement, TSQLConnection changes it\
    \ to\n\n```\nINSERT INTO EMPLOYEE VALUES (?, ?, ?, ?)\n```\n\nThe dbExpress driver\
    \ may replace the question marks with some other construct that is specific to\
    \ the database server.\n\n> Parameters do not need to have the same name as the\
    \ underlying column in the table. Notice in the preceding code snippet that I\
    \ named the parameter `EmpNumber` instead of `EmpNo`, and `Hired` instead of `DateHired`.\n\
    \nAfter you create the SQL statement, you need to fill in the value of each parameter\
    \ before executing. The following code snippet shows how this is done:\n\n```\n\
    Params := TParams.Create(nil);\ntry\n   // Create the parameters\n   Params.CreateParam(ftInteger,\
    \ 'EmpNumber', ptInput);\n   Params.CreateParam(ftString, 'Name', ptInput);\n\
    \   Params.CreateParam(ftSQLDate, 'Hired', ptInput);\n   Params.CreateParam(ftFloat,\
    \ 'Salary', ptInput);\n\n   // Assign values to the parameters\n   Params.ParamByName('EmpNumber').Value\
    \ := 123;\n   Params.ParamByName('Name').Value := 'John Doe';\n   Params.ParamByName('Hired').Value\
    \ := '5/15/1994';\n   Params.ParamByName('Salary').Value := 35000;\n\n   // Execute\
    \ the statement\n   SQLConnection1.Execute('INSERT INTO EMPLOYEE VALUES (:EmpNumber,\
    \ :Name, '\n   +':Hired, :Salary)', Params);\nfinally\n   Params.Free;\nend;\n\
    ```\n\nYou might be wondering why you would ever want to do this rather than simply\
    \ executing each statement directly. After all, creating the parameters and assigning\
    \ them takes a lot more effort. In addition, time tests on my development machine\
    \ show that the second method takes about twice as long as the first.\n\nIn cases\
    \ where I need to repeatedly execute the same statement, I still prefer using\
    \ a parameterized query for the following reasons:"
  merge: -1
  img_proc: true
- pgno: 45
  md: '+   - Simplicity. Given a long, complicated SQL statement, it’s often difficult
    to form the SQL statement manually. Getting the quotes lined up correctly can
    be prone to errors, considering that you must double up on single quotes in the
    Pascal language.


    +   - Robustness. Say for the sake of argument that one of the employee names
    has a quote in it, such as Frank O'' Donnell. If you don''t use parameters, the
    quote looks as if it were the terminating quote on the name. The parameterless
    SQL statement would look like this:

    +     INSERT INTO EMPLOYEE VALUES (123, ''Frank O''Donnell'', ''5/15/1994'', 35000)

    +     In this case, the name appears to be Frank O, and the following character
    (D) in the statement is an error. You can solve this problem by double quoting
    the name, like this:

    +     INSERT INTO EMPLOYEE VALUES (123, ''Frank O''''Donnell'', ''5/15/1994'',
    35000)


    +   - When using parameters, a true relational database can compile the prepared
    statement, and then use that compiled version for all subsequent calls to the
    SQL statement. When repeatedly issuing the same SQL statement, this more than
    compensates for the additional time required to prepare the SQL statement.


    The use of quotedStr to automatically quote strings helps to alleviate the first
    two “problems.”


    # SQL Statements That Return a Cursor


    In the previous two sections, I discussed simple and parameterized SQL statements,
    but so far, no statements have returned any data from the database server. The
    SELECT statement is the most commonly used DML statement. So, why am I shy-ing
    away from it?


    It’s because SELECT statements return data, and you need to have a place to put
    the resulting data. For dbExpress, that place is a TCustomSQLDataSet, which I
    don’t discuss in detail until the next chapter. For now, I’ll just give a quick
    overview of how to retrieve data from a TSQLConnection.


    The Execute method, which I discussed in the previous section, actually takes
    a third parameter: a pointer to a result set.


    ```

    function Execute(const SQL: string; Params: TParams;

    ResultSet: Pointer = nil): Integer;

    ```


    If you don’t pass a third parameter to Execute, it defaults to nil, which means
    that the statement doesn’t return a result set.


    > **NOTE**

    > If you pass a nil value for the ResultSet and the SQL command actually does
    return a result set, the result set is simply discarded. No exception is raised,
    and no error is returned.'
  merge: -1
  img_proc: true
