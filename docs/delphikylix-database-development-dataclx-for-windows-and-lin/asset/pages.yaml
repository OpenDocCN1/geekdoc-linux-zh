    finally\n  CloneDS.Free;\nend;\n```\n```\n\n# ## Setting Edit Mode Manually\n\n\
    If dgAlwaysShowEditor is True, the grid automatically enters edit mode when the\
    \ user enters a cell. If dgAlwaysShowEditor is False, the grid enters edit mode\
    \ when the user presses F2. (The user can simply start typing a value to overwrite\
    \ a cell's contents.) However, what if (for compatibility with another software\
    \ package) you want to enter edit mode when the user presses a different key—perhaps\
    \ F9 instead of F2?\n\nTo achieve this, you need to take control over when the\
    \ grid enters edit mode. The best place to do this is in the grid's OnKeyDow n\
    \ event. Within that handler, set the grid's EditorMode property to True to enter\
    \ edit mode.\n\nThe following code snippet shows how to enter edit mode when the\
    \ user presses F9 (not when he or she presses F2)."
