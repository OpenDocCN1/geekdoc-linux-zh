    \n# ## Ordering Data Returned from the Server\n\nThere are two ways to order the\
    \ data returned from the server. One way relates to the TSQLTable component, and\
    \ the other is used with the TSQLQuery and TSQLDataSet components. I’ll address\
    \ the TSQLTable component first.\n\n# ## Ordering Data from a Table\n\nIf you\
    \ are using a TSQLTable, you can set the component’s IndexName or IndexFieldNames\
    \ property before opening the dataset. IndexName refers to the name of an index\
    \ as it is stored in the underlying database. For example, in the ConMan database,\
    \ I have defined an index, named IX_CONNANE, which is composed of the LAST and\
    \ FIRST columns (in that order).\n\n```\nSQLTable1.IndexName := 'IX_CONNANE';\n\
    ```\n\nIf you don’t know the name of the underlying index, you can set the IndexFieldNames\
    \ property instead. IndexFieldNames is a semicolon-delimited list of fields that\
    \ make up the index.\n\n```\nSQLTable1.IndexFieldNames := 'LAST;FIRST';\n```\n\
    \n> **NOTE**\n> \n> You do not need to ensure that there is an index defined on\
    \ the fields that you set in the IndexFieldNames property. Behind the scenes,\
    \ TSQLTable creates an ORDER BY clause for the SQL statement that it passes to\
    \ the database (based on the fields listed in IndexFieldNames)."
