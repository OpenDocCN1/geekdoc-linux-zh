- pgno: 389
  md: 'This appendix tells you what you need to know to redistribute your database
    applications after you''ve written them. Because this book assumes that you''re
    using dbExpress as the data access technology behind your applications, I won''t
    explain how to redistribute the BDE or ADO. Instead, I''ll concentrate specifically
    on dbExpress and DataSnap.


    # Redistributable Files


    Redistributing an application built with dbExpress and DataSnap is incredibly
    simple—especially so if you''re used to messing around with a huge BDE- or ADO-based
    installation set. To support dbExpress and DataSnap, you need to redistribute
    only two files along with your application.


    # NOTE


    Well, that''s two files in addition to whatever else your application might need.
    For example, if you build your application with runtime packages enabled, you
    will also need to redistribute the required runtime packages for the application.


    # Redistributing a Windows Application


    For a VCL or CLX application running under Microsoft Windows, you need to redistribute
    the driver for the database back end that your application uses. The database
    engines and their associated Windows drivers are listed in Table A.1.


    # TABLE A.1  dbExpress Windows Drivers


    | Database | Windows Driver |

    | InterBase | Dbxepint.dll |

    | Oracle | dbxepora.dll |

    | DB2 | dbxepdb2.dll |

    | MySQL | Dbxepmys.dll |


    In addition to the dbExpress driver, you need to redistribute MIDAS.DLL, which
    contains the code necessary for the client dataset technology.


    You can place both the dbExpress driver and MIDAS.DLL anywhere where your application
    can find them, which could be either the application directory or the SYSTEM32
    directory. Neither file needs to be registered with Windows.'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'If you prefer, you can statically link DataSnap into your client application
    by including MidaSLib to your project’s uses clause and rebuilding. If you do
    this, you don’t need to redistribute MIDAS.DLL with the client application (it
    must be redistributed with the server application, however).


    You can also statically link the dbExpress drivers with your application by linking
    in the appropriate file(s), as listed in Table A.2.


    | TABLE A.2 dbExpress Statically-Linked Driver Units |

    |---|

    | Database | Unit |

    | InterBase | Dbexpint |

    | Oracle | Dbexpora |

    | DB2 | dbexpdb2 |

    | MySQL | Dbexpmy |


    > **NOTE**

    > Even though Delphi 6 supports statically linking dbExpress and/or DataSnap to
    your application, you should be aware that the static linking is a new technology
    that isn’t completely compatible with all DataSnap code. For example, attempting
    to call TClientDataSet.SaveToFile to save a client dataset to an XML file doesn’t
    save to the same format when statically linking as when dynamically linking. The
    bottom line is, if you decide to statically link your application, please test
    thoroughly before releasing to your clients.


    # ## Redistributing a Linux Application


    For a CLX application running under Linux, you need to redistribute the appropriate
    Linux dbExpress driver. Table A.3 lists the database engines currently supported
    by dbExpress and the associated Linux driver.


    | TABLE A.3 dbExpress Linux Drivers |

    |---|

    | Database | Linux Driver |

    | InterBase | libsqlb.so |

    | Oracle | libqor.so |

