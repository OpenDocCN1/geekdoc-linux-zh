- pgno: 365
  md: '# # Overview of the Code


    ConMan is separated into an application server and a client, providing true multifilter
    functionality.


    The entire source code for ConMan is contained in seven units—two of which Delphi
    automatically writes for us. The server-side source units include the following:


    +   - **MainForm.pas** Contains the code for the main form of the server (which
    does nothing but show us the number of clients currently connected).

    +   - **RemoteDataModule.pas** Houses the remote data module where the database
    connection components reside.

    +   - **ConManServer_TLB.pas** Type library import file for the application server.
    Delphi automatically creates and maintains this unit.


    The client application is composed of the following units:


    +   - **DataModule.pas** Client-side data module, including DataSnap components
    and TClientDataSets.

    +   - **RecErrorForm.pas** Form to handle reconciliation errors. This form is
    automatically generated by Delphi (see Chapter 7 for more information on handling
    reconciliation errors).

    +   - **MainForm.pas** The application’s main form.

    +   - **TodoForm.pas** A form that facilitates adding or editing a todo.


    The following sections describe the server- and client-side applications in more
    detail.


    # # The Server Application


    As noted in the preceding section, the application server consists of three source
    files, only two of which you write code for.


    Listing 9.2 contains the source code for the application server’s remote data
    module. As you can see from Figure 9.2, the remote data module contains six components.
    These are


    +   - **conn** A TSQLConnection component for connecting to the database.

    +   - **sqlContacts** A TSQLDataSet component for retrieving data from the Contacts
    table.

    +   - **sqlTodos** A TSQLDataSet component for retrieving data from the Todos
    table.

    +   - **sqlID** A TSQLDataSet that calls the stored procedure ID_GEN in the database
    to retrieve a unique ID for each inserted record.'
