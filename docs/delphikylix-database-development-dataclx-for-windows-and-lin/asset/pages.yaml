- pgno: 205
  md: 'The Update button runs through the entire dataset and gives all employees a
    10% raise. Notice that even though the code doesn’t call DisableControl s (discussed
    near the beginning of this chapter), the grid still doesn’t scroll as the dataset
    is traversed. That’s because the grid is connected to Clie ntDataSet1, and the
    update is performed on the clone dataset.


    The Insert (Part 1) and Insert (Part 2) buttons perform two halves of an insert
    operation on the clone. The first button appends a new record to the dataset and
    fills in the data. The second button posts the new record to the dataset, and
    then calls the GoToCurren t method on the original dataset (synchronizing the
    original dataset with the clone). GotoCurren t makes the original dataset jump
    to the current record of the clone dataset.


    The reason for separating the Insert operation into two buttons is so that you
    can easily see what happens during an insert. Click Insert (Part 1). Now scroll
    down to the bottom of the grid. You will not see a line in the grid for employee
    99999—the newly inserted, but not-yet-posted record. When you click Insert (Part
    2), the new record appears in the grid. In contrast, if you change the code in
    the Insert button event handlers to use Clie ntDataSet1, instead of FCloneDS,
    you will see the new record appear in the grid before it is actually posted.


    Finally, the Range button operates in much the same way as the Update button:
    It applies a range to the dataset, and then sets the salary for all employees
    in that range to $50,000. The grid is not updated to reflect the range because
    the range is applied only to the clone dataset and not to Clie ntDataSet1.


    # ## Maintained Aggregates


    Records in a dataset often aren’t completely isolated from one another. Many times,
    you want to obtain the sum or the average of either an entire column, or some
    subset of that column. For example, you might want to calculate the average salary
    of all employees in the Sales department, or you might need to retrieve the number
    of employees whose last name is Jones.


    If you’re using an SQL-based database, you can issue SQL statements to calculate
    these values. For example,


    ```

    SELECT AVG(SALARY) FROM EMPLOYEE WHERE DEPARTMENT = ''SALES'';

    SELECT COUNT(*) FROM EMPLOYEE WHERE LASTNAME = ''Jones'';

    ```


    However, you can’t execute SQL statements directly against a client dataset.


    # **Note**


    If you connect a client dataset to a dbExpress dataset through a database provider,
    you can then send SQL statements to the database backend and retrieve the results
    in the client dataset. This technique is discussed in Chapter 7.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Instead, client datasets support a powerful feature called maintained aggregates.
    Maintained aggregates automatically calculate the sum, average, count, minimum
    value, or maximum value for the entire dataset (or for a group or records).


    # Creating a Maintained Aggregate at Design Time


    Creating a maintained aggregate at design time is similar to creating a field
    at design time. Like fields, maintained aggregates can be either persistent or
    nonpersistent. The following sections show how to create each type.


    # Persistent Aggregates


    You create a persistent aggregate in much the same way that you create a data,
    calculated, or lookup field.


    +   1. Right-click the client dataset in the form editor and select Field Editor...
    from the pop-up menu.

    +   2. Press Ins to create a new field.

    +   3. Enter the field name and field type in the New Field dialog. The field
    type should be Aggregate for maintained aggregates.

    +   4. Select the Aggregate radio button in the Field type group box.

    +   5. Click OK to create the aggregate.


    Figure 4.8 shows the field editor after adding an aggregated field named AvgSalary.


    ![](img/52a35759a0f10dade27a840504be5d82_206_0.png)


    # Figure 4.8


    The field editor shows aggregates in a separate section.


    After the aggregate is created, you need to set some additional properties (such
    as the expression to aggregate on, and whether or not the aggregate is active).


    +   1. Click the aggregate field in the field editor.

    +   2. In the Object Inspector, enter the aggregate expression in the Expression
    property. Aggregate expressions are discussed in the section titled “Aggregate
    Expressions.” For now, you can use Avg(Salary).'
  merge: -1
  img_proc: true
- pgno: 207
  md: "+   3.  Set the *Active* property to True. By default, aggregates are not active,\
    \ which means that you aren’t able to access them. Set `AggregatesActive` to True\
    \ to activate aggregate fields.\n\nCreating a persistent aggregate automatically\
    \ creates a component of type `TAggregateField`, which you can use to reference\
    \ the aggregate value. Unlike most fields, however, you don’t use the `AsFloat`\
    \ property to obtain an aggregate’s value. Instead, you use the `Value` property,\
    \ like this:\n\n```\nShowMessage(‘The average salary is ’ + ClientDataSet1AvgSalary.Value);\n\
    ```\n\nBecause `Value` is a variant, you can reference it as though it were either\
    \ a string or a floating-point number. Therefore, the following code is also correct:\n\
    \n```\n  var\n    AvgRaisedSalary: Double\n  begin\n    AvgRaisedSalary := ClientDataSet1AvgSalary.Value\
    \ * 1.05;\n  end;\n```\n\n# Nonpersistent Aggregates\n\nTo create a nonpersistent\
    \ aggregate at design time, click the client dataset in the form editor, and then\
    \ double-click the `Aggregates` property in the Object Inspector to display the\
    \ aggregate editor.\n\nThe aggregate editor looks and acts a lot like the field\
    \ editor. Click the **Add New** button on the toolbar (or press *Ins*) to create\
    \ a new aggregate.\n\nAgain, you need to set some additional properties (such\
    \ as the expression to aggregate on, and whether or not the aggregate is active).\n\
    \n+   1.  Click the aggregate in the aggregate editor.\n+   2.  In the Object\
    \ Inspector, enter a name for the aggregate, such as `AvgSalary`.\n+   3.  Type\
    \ an aggregate expression into the `Expression` property, such as `Avg(Salary)`.\n\
    +   4.  Set the *Active* property to True.\n+   5.  Set `AggregatesActive` to\
    \ True.\n\nUnlike in the previous section, Delphi does not create a component\
    \ for an aggregate created in this manner. Instead, you access the aggregate through\
    \ the dataset’s `Aggregates` property, like this:\n\n```\nShowMessage(‘The average\
    \ salary is ’ +\n  ClientDataSet1.Aggregates.Find(‘AvgSalary’).Value);\n```"
  merge: -1
  img_proc: true
- pgno: 208
  md: "Alternatively, if you know the index of the aggregate, you can access it directly:\n\
    \n```\nShowMessage('The average salary is ' + ClientDataSet1.Aggregates[0].Value);\n\
    ```\n\n# Creating a Maintained Aggregate at Runtime\n\nCreating a maintained aggregate\
    \ at runtime is similar to creating a nonpersistent aggregate because you make\
    \ use of the Aggregates property. The following code snippet shows how to create\
    \ an aggregate at runtime:\n\n```\nvar\n    Aggregate: TAggregate;\nbegin\n  \
    \  Aggregate := ClientDataSet1.Aggregates.Add;\n    Aggregate.AggregateName :=\
    \ 'AvgSalary';\n    Aggregate.Expression := 'Avg(Salary)';\n    Aggregate.Active\
    \ := True;\nend;\n```\n\n# Aggregate Expressions\n\nIn the previous code snippets,\
    \ I used an expression of Avg(Salary). As you might guess, this expression calculates\
    \ the average value of the Salary field.\n\nDelphi supports the aggregate types\
    \ listed in Table 4.6.\n\n**TABLE 4.6 Aggregate Types**\n\n| Aggregate Type |\
    \ Description |\n| :--- | :--- |\n| Sum | Calculates the sum of a field. |\n|\
    \ Avg | Calculates the average value of a field. |\n| Count | Calculates the number\
    \ of values for a field that are not blank. |\n| Min | Calculates the minimum\
    \ value of a field. |\n| Max | Calculates the maximum value of a field. |\n\n\
    Sum and Avg can only be used with numeric field types, but Count, Min, and Max\
    \ can be used with numbers, strings, or data values.\n\nAggregate expressions\
    \ do not have to be simple expressions, such as Avg(Salary). They can include\
    \ multiple functions, such as Sum(SalesPrice) * Sum(NetCost). However, you can't\
    \ nest functions. Avg(Sum(SalesPrice)) is not a valid aggregate expression.\n\n\
    The Delphi help topic, “Specifying Aggregates,” provides additional examples of\
    \ both valid and invalid aggregate expressions."
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Aggregates Across a Group of Records


    The simplest aggregate that you can create is one that totals or averages over
    the entire dataset. The aggregates that we created previously aggregate across
    the whole dataset. Many times, however, you want to calculate an aggregate based
    on a part of the dataset.


    To create a grouped aggregate, you first need to make sure that there is at least
    one index defined on the dataset. For purposes of the EMPLOYEE.CDS dataset, we’ll
    create an index named byBirthday on the Birthday field.


    +   1.  Drop a TClientDataSet on the main form of your application.

    +   2.  Right-click the dataset, and select Load from MyBase Table... on the pop-up
    menu.

    +   3.  Select the file C:\EMPLOYEE.CDS and click Open.

    +   4.  Create an index named byBirthday on the Birthday field. (If you’ve forgotten
    how to create an index, please refer to Chapter 3, “Client Dataset Basics.”)

    +   5.  Go into the field editor and create persistent fields for all dataset
    fields by selecting Add All Fields from the field editor pop-up menu.

    +   6.  Create a persistent aggregate field, named NumSameBirthday, using the
    expression `Count(Birthday)`. Delphi will create a component named `ClientDataSet1NumSameBirthday`.

    +   7.  Drop a TDataSource, TDBGrid, and TLabel on the main form and connect the
    data source and grid to the client dataset.

    +   8.  In the data source’s OnDataChange event, write the following code:


    ```

    Label1.Caption := ClientDataSet1NumSameBirthday.Value;

    ```


    Now we have our starting application. If you run it, you should see the value
    10000 appear in the label (indicating that there are 10,000 records with a non-NULL
    birthday in the dataset).


    Now that we’ve established our baseline, let’s change the aggregate so that it
    calculates the number of employees who have the same birthday.


    To do this, go back into the field editor and click the NumSameBirthday aggregate
    field. In the Object Inspector, set the IndexName to byBirthday. This tells the
    aggregate field to calculate its value using the byBirthday index. Next, set the
    GroupingLevel property to 1. (GroupingLevel is a one-based value that tells Delphi
    which portion of the index to use when calculating the aggregate value.)


    For example, say that you have an index on the fields LastName; FirstName. If
    GroupingLevel is set to 1, only the first field in the index is used to calculate
    the aggregate. For an expression of Avg(Salary), the aggregate calculates the
    average salary for all employees having the same last name as the current record.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'If you set `GroupingLevel` to 2, the aggregate calculates the average salary
    for all employees having the same last name *and* the same first name as the current
    employee.


    # ## Enabling and Disabling Aggregates


    Usually, you leave aggregates enabled (`Active = True`). However, you can disable
    an individual aggregate by setting its `Active` property to `False`, or you can
    disable all aggregates by setting the dataset''s `AggregatesActive` property to
    `False`.


    Disabling aggregates results in a slightly speedier application because Delphi
    doesn’t continually have to recalculate aggregate values whenever a record is
    inserted, edited, or deleted. If you plan to add a large number of records at
    one time, you might want to disable aggregates, add the records, and then re-enable
    aggregates so that Delphi only has to calculate them once (at the time that you
    re-enable them).


    # ### `GetGroupState`


    You can determine the relative position of a record within an aggregate by calling
    the dataset’s `GetGroupState` method. `GetGroupState` returns a value of `gbFirst`,
    `gbMiddle`, or `gbLast` (depending on whether the current record is the first
    record in the group, the last record in the group, or any other record in the
    group).


    Rather than presenting a sample aggregate application here, I’ll refer you to
    the Aggregate demo in Delphi’s DEMOS\MIDASAGGREGATE directory.


    # ## Miscellaneous Properties


    This section lists several additional properties of the client dataset that don’t
    logically fall into one of the previously discussed categories.


    # ### Constraints


    Constraints provide a way of validating a record’s data before posting. Constraints
    are most useful when the validation relies on a relationship between two or more
    fields in the record. For example, a record’s data might (nonsensically) be determined
    invalid if the `Salary` field is less than 1000 times the employee’s age. In other
    words, a 30-year-old employee must earn at least $30,000.


    Constraints are visually similar to filters. The constraint that I just mentioned
    looks like this:


    ```

    Salary >= Age * 1000

    ```


    To create a constraint on a dataset, double-click the `Constraints` property in
    the Object Inspector. The constraints editor appears. Next, click the Add New
    toolbar button in the constraints editor (or press the Ins key) to add a new constraint.'
  merge: -1
  img_proc: true
- pgno: 211
  md: "Back in the **Object Inspector**, enter the constraint into the **CustomConstraint**\
    \ property. In the **ErrorMessage** property, type the message that you’d like\
    \ to be displayed when the constraint is not met—for example, “The salary must\
    \ be at least 1000 times the employee’s age.”\n\nFigure 4.9 shows a screen capture\
    \ of the **Object Inspector** and the constraint editor after adding a constraint.\n\
    \n![](img/52a35759a0f10dade27a840504be5d82_211_0.png)\n\n# **FIGURE 4.9**  \n\
    *Setting up a constraint.*\n\nYou are not limited to a single constraint for a\
    \ dataset. You can add as many constraints as are necessary.\n\nWhen the record\
    \ is posted to the dataset, Delphi checks all the constraints imposed on the dataset.\
    \ If one of the constraints fails, the message specified in the **ErrorMessage**\
    \ property is displayed, and the post is aborted.\n\n# ## **DisableStringTrim**\n\
    \nNormally, when records are posted to a dataset, any trailing spaces in a string\
    \ are automatically removed. For example, if a user types **John   ** (note the\
    \ two trailing spaces) in a data-aware edit control, only four characters are\
    \ actually written to the underlying field in the dataset because the dataset\
    \ automatically removes the additional two spaces.\n\nClient datasets globally\
    \ trim trailing spaces from string fields when the **DisableStringTrim** property\
    \ is set to **False** (which is the default). However, if you want to retain trailing\
    \ spaces, you can set **DisableStringTrim** to **True**."
  merge: -1
  img_proc: true
- pgno: 212
  md: 'DisableStringTrim is a global property, in that it affects all the string fields
    in the dataset. It doesn''t allow you to trim trailing spaces from the FirstName
    field, and still retain trailing spaces for the LastName field. If you want to
    retain trailing spaces for some fields and remove them for others, you need to
    set DisableStringTrim to True, and then remove trailing spaces manually from the
    appropriate fields (perhaps in the dataset''s BeforePost event handler).


    # ReadOnly


    By default, client datasets are read/write datasets. You can make a client dataset
    read-only (if the underlying data is stored on a CD-ROM drive, for instance) by
    setting the dataset''s ReadOnly property to True.


    # Summary


    In addition to the basic functionality presented in the preceding chapter, TClientDataSet
    supports a number of advanced operations. In this chapter, you learned the following:


    +   - Datasets provide a number of events that you can hook into and be notified
    when certain operations occur. In addition, you can raise an exception during
    the Beforexx events to prevent the operations from occurring.

    +   - You can increase performance dramatically by disabling data-aware controls
    during lengthy processes.

    +   - Delphi datasets provide support for BLOBs, which can be used to store notes,
    images, and other unformatted data.

    +   - Nested datasets provide simplified master/detail support in client datasets.

    +   - TClientDataSet''s undo support enables you to perform what-if scenarios
    in your applications.

    +   - By cloning a client dataset, you can perform operations on a clone of the
    data without disturbing the settings of the original dataset.

    +   - Maintained aggregates support the automatic calculation of sums, minimums,
    maximums, counts, and averages for groups of records or for the entire dataset.


    The following chapter begins a two-chapter introduction to data-aware components.'
  merge: -1
  img_proc: true
