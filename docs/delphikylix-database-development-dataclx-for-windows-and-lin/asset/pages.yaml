    \ that the code doesn't check the DataCol parameter to see if it's 0 because the\
    \ user could rearrange the columns at runtime. Instead, it checks for the Column\
    \ ID, which is a zero-based integer that was established at design time and doesn't\
    \ change.\n\n![](img/52a35759a0f10dade27a840504be5d82_269_0.png)\n\nIf the dgIndicator\
