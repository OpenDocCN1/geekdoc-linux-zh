  md: 'The BLOBs application enables you to store a note, an image, and a file attachment
    in a single record. The notes are stored by using a TDBMemo component.


    I elected to create a separate image type field, which I called ImageType, to
    track the type of image stored in the Image field. If ImageType is blank, the
    image is assumed to be NULL. Notice the way that the image is displayed—The program
    handles the data source''s DataChange event. If the Field parameter sent to the
    event is nil (or if it references the Image field), the Image component loads
    the picture from the Image field using one method for BMP files and another method
    for JPG files. Of course, a real application would recognize more image types
    than just the two.


    Also note the parallel between the code used to load an image and the code used
    to load an attachment. Any file can be loaded into a BLOB field through the field''s
    LoadFromFile method, and can be saved back to disk through the field''s SaveToFile
    method.


    The BLOBs application doesn''t save the data to disk (although it could do so
    by adding a SaveToFile method in the code), and it is rather useless. However,
    it serves to illustrate the correct way (or one of the correct ways, in the case
    of images) to use BLOB fields in your programs.


    Figure 4.3 shows this application at runtime.


