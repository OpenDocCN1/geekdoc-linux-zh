    ```


    Conceptually, this code snippet creates a withdrawal for the originating account,
    and a deposit for the target account. At first, it might seem like there''s nothing
    wrong with this code, but let''s take a look at the possibilities.


    What happens if a power outage, connection failure, or some other catastrophic
    failure occurs between the time the withdrawal is recorded and the time the deposit
    is recorded? The money would be deducted from the savings account, but it would
    never get added to the checking account (which makes Mr. Customer a very unhappy,
    quite possibly former, customer).


    If the code is reversed to create the deposit before the withdrawal, the opposite
    can happen: The deposit gets recorded, but the withdrawal never occurs (which
    makes Mr. Customer very happy and $100 richer, but the bank is shorted).


    Clearly, the ATM software needs to have some assurance that either the withdrawal
    and the deposit both occur, or that neither of them occur. This is what transactions
    are designed to handle.


    The following few sections describe how to detect whether a given database supports
    transactions, how to start (and subsequently end) a transaction, and how to handle
    multiple (and nested) transactions.


    # Checking for Transaction Support


    If you''re writing an application that only works with a single database backend
    (such as Oracle or InterBase), you know before you start coding that the database
    supports transactions. If you''re writing a general-purpose application that can
    access many different database backends, you don''t know up front whether the
    selected database backend supports transactions or not.


    TSQLConnection provides a way to detect whether the underlying database engine
    supports transactions: the TransactionsSupported property. Before you check TransactionsSupported,
    you need to establish a connection to the database, like this:


    ```

    SQLConnection1.Open;

    ...

    if SQLConnection1.TransactionsSupported then begin

    // Go ahead with transaction code

    end else begin

    // Transactions not supported - proceed with alternate code or bail out

    end;

    ```'
  merge: -1
  img_proc: true
- pgno: 52
  md: "# Starting a Transaction\n\nWhen you've determined that the database supports\
    \ transactions, you can start a transaction. To begin, call the method TSQLConnection.StartTransaction.\
    \ StartTransaction is defined like this:\n\n```\nprocedure StartTransaction( TransDesc:\
    \ TTransactionDesc);\n```\n\nTTransactionDesc is a record that describes the transaction\
    \ in detail. Its definition is shown here:\n\n```\nTTransactionDesc = packed record\n\
    \    TransactionID : LongWord;        { Transaction id }\n    GlobalID : LongWord;\
    \        { Global transaction id }\n    IsolationLevel : TTransIsolationLevel;\
    \ {Transaction Isolation level}\n    CustomIsolation : LongWord;        { DB specific\
    \ custom isolation }\nend;\n```\n\nTable 1.6 shows the meaning of the individual\
    \ fields in the TTransactionDesc record.\n\nTABLE 1.6 TTransactionDesc Fields\n\
    \n| Field | Definition |\n|---|---|\n| TransactionID | User-defined, local transaction\
    \ number that uniquely identifies the transaction for purposes of this application.\
    \ |\n| GlobalID | Used for Oracle transactions to define a transaction number\
    \ that must be unique across the entire Oracle database. |\n| IsolationLevel |\
    \ Used to specify how this transaction reacts to other transactions. Valid values\
    \ for this field are listed in Table 1.7. |\n| CustomIsolation | Identifies the\
    \ custom isolation level when IsolationLevel is set to x1iCUSTOM. No dbExpress\
    \ drivers currently support this. |\n\nTable 1.7 shows the valid settings for\
    \ TTransactionDesc's IsolationLevel field.\n\nTABLE 1.7 Valid IsolationLevel Values\n\
    \n| Field | Definition |\n|---|---|\n| x11DIDTRYREAD | The transaction sees all\
    \ changes made by other transactions, even if those changes have not yet been\
    \ committed. Oracle does not support this level of transaction isolation. |\n\
    | x11READCOMMITTED | The transaction sees only those changes made by other transactions\
    \ that have been committed both before this transaction was started, and after\
    \ this transaction was started. |"
  merge: -1
  img_proc: true
- pgno: 53
  md: "**TABLE 1.7** Continued\n\n| Field | Definition |\n| :--- | :--- |\n| x11REPEATABLEREAD\
    \ | The transaction sees only those changes made by other transactions, but only\
    \ if they were committed before this transaction started. |\n| x11CUSTOM | Database-specific\
    \ isolation level. CustomIsolation specifies the actual isolation level. No DbExpress\
    \ drivers currently support this. |\n\nThe following code snippet shows how to\
    \ start a transaction.\n\n```\nvar\n  TransDesc: TTransactionDesc;\nbegin\n  TransDesc.TransactionID\
    \ := 1;\n  TransDesc.IsolationLevel := x11READCOMMITTED;\n  SqlConnection1.StartTransaction(TransDesc);\n\
    end;\n```\n\n# Committing a Transaction\n\nAfter you have issued the appropriate\
    \ SQL commands inside a transaction, you want to *commit* the transaction. This\
    \ ends the transaction, and saves any changes made during that transaction.\n\n\
    Committing a transaction is as easy as calling `TSqlConnection.Commit`, which\
    \ the following line of code illustrates:\n\n```\nSqlConnection.Commit(TransDesc);\n\
    ```\n\n# Rolling Back a Transaction\n\nAt times, you start a transaction only\
    \ to find out later that you don't want to save the changes made during that transaction.\
    \ If that should occur, you can *roll back* the transaction rather than committing\
    \ it. Rolling back a transaction ends the transaction, but all changes made in\
    \ the context of the transaction are discarded.\n\nTo roll back a transaction,\
    \ call `TSqlConnection.Rollback`, like this:\n\n```\nSqlConnection1.Rollback(TransDesc);\n\
    ```\n\n# Multiple Transactions\n\nYou are not limited to just one transaction\
    \ at a time. Transactions can be nested or overlapped. Figure 1.7 shows what nested\
    \ and overlapped transactions look like at a conceptual level."
  merge: -1
  img_proc: true
- pgno: 54
  md: "![](img/52a35759a0f10dade27a840504be5d82_54_0.png)\n\n# FIGURE 1.7\nTransactions\
    \ may be nested or overlapped.\n\nNot all databases support multiple transactions.\
    \ Unfortunately, to determine whether a database supports multiple transactions,\
    \ you can't check a simple property. TSQLConnection contains a private field named\
    \ fSupportsMultiTrans, but there is no public access to it. All is not lost, however,\
    \ as you can use the following function to retrieve the value of this property:\n\
    \n```\nfunction SupportsMultiTrans(conn: TSQLConnection): Boolean;\nvar\n  Supported:\
    \ LongBool;\n  PropSize: SmallInt;\nbegin\n  conn.MetaData.GetOption(eMetaSupportsTransactions,\
    \ @Supported,\n    SizeOf(Integer), PropSize);\n  Result := Supported;\nend;\n\
    ```\n\nIf the database does not support multiple transactions, you want to refrain\
    \ from calling StartTransaction while a transaction is active. You can test to\
    \ see whether a transaction is currently active by checking the InTransaction\
    \ property, like this:\n\n```\nif not SQLConnection.InTransaction then\n  // Safe\
    \ to start a transaction\n```\n\nIf the database supports multiple transactions,\
    \ you can nest them, as the following code snippet shows:\n\n```\nvar\n  TransOuter:\
    \ TTransactionDesc;\n  TransInner: TTransactionDesc;\nbegin\n  TransOuter.TransactionID\
    \ := 1;\n  TransOuter.IsolationLevel := x1READCOMMITTED;\n  SQLConnection.StartTransaction(TransOuter);\n\
    \  try\n```"
