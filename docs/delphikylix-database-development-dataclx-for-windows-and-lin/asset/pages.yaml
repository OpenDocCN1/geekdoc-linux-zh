    # # Third-Party Data-Aware Grids


    Though TDBGrid and TClientDataSetGrid are useful grid components, they don''t
    come close to the flexibility and power that''s provided by third-party data-aware
    grids. This section lists several of the more popular third-party data-aware grids
    that you might want to investigate if you''re looking for more functionality than
    the built-in Delphi grids offer.


    Table 6.8 lists some of the better known third-party TDBGrid replacements.


    **TABLE 6.8 TDBGrid Replacement Components**


    | Product | Description |

    | :--- | :--- |

    | Orpheus | TurboPower Software Company''s flagship Delphi-VCL add-on library
    contains two data-aware grid components that can be used for formatted data entry,
    multilevel data display, and automatic subtotalling and totaling of columns. Visit
    www.turbo power.com for more information about Orpheus or to download a free trial
    version. |

    | InfoPower 2000 | This popular general-purpose Delphi library includes the TwaDBGri
    d component, which works like TDBGrid and adds new functionality (such as memo
    display and automatic footers). Go to www. w0112w011.com for more information
    about the InfoPower product. |

    | ExpressQuantumGrid | An extremely powerful TDBGrid replacement that offers numerous
    advanced grid features—too many to list here. Some of the notable features include
    multiline data display, runtime sorting'
