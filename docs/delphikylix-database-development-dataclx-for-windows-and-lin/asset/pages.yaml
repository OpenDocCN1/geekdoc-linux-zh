- pgno: 149
  md: "In addition to filtering out uninteresting records from a client dataset, **TClientDataSet**\
    \ provides a number of methods for quickly locating a specific record. Some of\
    \ these methods require an index to be active on the dataset, and others do not.\
    \ The search methods are described in detail in the following sections.\n\n# #\
    \ Searching\n\n# ## Nonindexed Search Techniques\n\nIn this section, I’ll discuss\
    \ the search techniques that don’t require an active index on the client dataset.\
    \ Rather than using an index, these methods perform a sequential search through\
    \ the dataset to find the first matching record.\n\n# ### Locate\n\n**Locate**\
    \ is perhaps the most general purpose of the TClientDataSet search methods. You\
    \ can use **Locate** to search for a record based on any given field or combination\
    \ of fields. **Locate** can also search for records based on a partial match,\
    \ and can find a match without respect to case.\n\nTClientDataSet.**Locate** is\
    \ defined like this:\n\n```\n```C++\nfunction Locate(const KeyFields: string;\
    \ const KeyValues: Variant;\n  Options: LocateOptions): Boolean; overload;\n```\n\
    ```\n\nThe first parameter, **KeyFields**, designates the field (or fields) to\
    \ search. When searching multiple fields, separate them by semicolons (for example,\
    \ `'Name;Birthday'`).\n\nThe second parameter, **KeyValues**, represents the values\
    \ to search for. The number of values must match the number of key fields exactly.\
    \ If there is only one search field, you can simply pass the value to search for\
    \ here. To search for multiple values, you must pass the values as a variant array.\
    \ One way to do this is by calling **VarArrayOf**, like this:\n\n```\n```C++\n\
    VarArrayOf(['John Smith', '4/15/1965'])\n```\n```\n\nThe final parameter, **Options**,\
    \ is a set that determines how the search is to be executed. Table 3.11 lists\
    \ the available options.\n\n# **TABLE 3.11** **Locate Options**\n\n| Value | Description\
    \ |\n| --- | --- |\n| loPartialKey | KeyValues do not necessarily represent an\
    \ exact match. Locate finds the first record whose field value starts with the\
    \ value specified in KeyValues. |\n| loCaseInsensitive | Locate ignores case when\
    \ searching for string fields. |"
  merge: -1
  img_proc: true
- pgno: 150
  md: "Both options pertain to string fields only. They are ignored if you specify\
    \ them for a nonstring search.\n\nLocate returns `True` if a matching record is\
    \ found, and `False` if no match is found. In case of a match, the record is made\
    \ current.\n\nThe following examples help illustrate the options:\n\n```\nClientDataSet1.Locate('Name',\
    \ 'John Smith', []);\n```\n\nThis searches for a record where the name is 'John\
    \ Smith'.\n\n```\nClientDataSet1.Locate('Name', 'JOHN', [loPartialKey, loCaseInsensitive]);\n\
    ```\n\nThis searches for a record where the name begins with 'JOHN'. This finds\
    \ 'John Smith', 'Johnny Jones', and 'JOHN ADAMS', but not 'Bill Johnson'.\n\n\
    ```\nClientDataSet1.Locate('Name;Birthday', VarArrayOf(['John', '4/15/1865']),\n\
    [loPartialKey]);\n```\n\nThis searches for a record where the name begins with\
    \ 'John' and the birthday is April 15, 1965. In this case, the loPartialKey option\
    \ applies to the name only. Even though the birthday is passed as a string, the\
    \ underlying field is a date field, so the loPartialKey option is ignored for\
    \ that field only.\n\n# Lookup\n\nLookup is similar in concept to Locate, except\
    \ that it doesn't change the current record pointer. Instead, Lookup returns the\
    \ values of one or more fields in the record. Also, Lookup does not accept an\
    \ Options parameter, so you can't perform a lookup that is based on a partial\
    \ key or that is not case sensitive.\n\nLookup is defined like this:\n\n```\n\
    function Lookup(const KeyFields: string; const KeyValues: Variant;\nconst ResultFields:\
    \ string): Variant; override;\n```\n\nKeyFields and KeyValues specify the fields\
    \ to search and the values to search for, just as with the Locate method. ResultFields\
    \ specifies the fields for which you want to return data. For example, to return\
    \ the birthday of the employee named John Doe, you could write the following code:\n\
    \n```\nvar\n  V: Variant;\nbegint\n  V := ClientDataSet1.Lookup('Name', 'John\
    \ Doe', 'Birthday');\nend;\n```\n\n3"
  merge: -1
  img_proc: true
- pgno: 151
  md: "The following code returns the name and birthday of the employee with ID number\
    \ 100:\n\n```\n```\nvar\n  V: Variant;\nbegin\n  V := ClientDataSet1.Lookup('ID',\
    \ 100, 'Name;Birthday');\nend;\n```\n```\n\nIf the requested record is not found,\
    \ V is set to NULL. If *ResultSet* contains a single field name, then on return\
    \ from *Lookup*, V is a variant containing the value of the field listed in *ResultSet*.\
    \ If *ResultSet* contains multiple single-field names, then on return from *Lookup*,\
    \ v is a variant array containing the values of the fields listed in *ResultSet*.\n\
    \n![](img/52a35759a0f10dade27a840504be5d82_151_0.png)\n\n> For a comprehensive\
    \ discussion of variant arrays, see my book, *Delphi COM Programming*, published\
    \ by Maumillan Technical Publishing.\n\nThe following code snippet shows how you\
    \ can access the results that are returned from *Lookup*.\n\n```\n```\nvar\n \
    \ V: Variant;\nbegin\n  V := ClientDataSet1.Lookup('ID', 100, 'Name');\n  if not\
    \ VarIsNull(V) then\n    ShowMessage('ID 100 refers to ' + V);\n\n  V := ClientDataSet1.Lookup('ID',\
    \ 200, 'Name;Birthday');\n  if not VarIsNull(V) then\n    ShowMessage('ID 200\
    \ refers to ' + V[0] + ', born on ' + DateToStr(V[1]));\nend;\n```\n```\n\n# ###\
    \ Indexed Search Techniques\n\nThe search techniques mentioned earlier do not\
    \ require an index to be active—in fact, they don't require the dataset to be\
    \ indexed at all. But *DataSet* also supports several indexed search operations.\
    \ These include *FindKey*, *FindNearest*, and *GotoKey*, which are discussed in\
    \ the following sections.\n\n# #### FindKey\n\n*FindKey* searches for an exact\
    \ match on the key fields of the current index. For example, if the dataset is\
    \ currently indexed by ID, *FindKey* searches for an exact match on the ID field.\
    \ If the dataset is indexed by last and first name, *FindKey* searches for an\
    \ exact match on both the last and the first name."
  merge: -1
  img_proc: true
- pgno: 152
  md: "FindKey takes a single parameter, which specifies the value(s) to search for.\
    \ It returns a Boolean value that indicates whether a matching record was found.\
    \ If no match was found, the current record pointer is unchanged. If a matching\
    \ record is found, it is made current.\n\nThe parameter to FindKey is actually\
    \ an array of values, so you need to put the values in brackets, as the following\
    \ examples show:\n\n```\nif C1ientDataSet.FindKey([25]) then\n    ShowMessage('Found\
    \ ID 25');\n...\nif C1ientDataSet.FindKey(['Doe', 'John']) then\n    ShowMessage('Found\
    \ John Doe');\n```\n\nYou need to ensure that the values you search for match\
    \ the current index. For that reason, you might want to set the index before making\
    \ the call to FindKey. The following code snippet illustrates this:\n\n```\nC1ientDataSet1.IndexName\
    \ := 'byID';\nif C1ientDataSet.FindKey([25]) then\n    ShowMessage('Found ID 25');\n\
    ...\nC1ientDataSet1.IndexName := 'byName';\nif C1ientDataSet.FindKey(['Doe', 'John'])\
    \ then\n    ShowMessage('Found John Doe');\n```\n\n# FindNearest\n\nFindNearest\
    \ works similarly to FindKey, except that it finds the first record that is greater\
    \ than or equal to the value(s) passed to it. This depends on the current value\
    \ of the KeyExclusive property.\n\nIf KeyExclusive is False (the default), FindNearest\
    \ finds the first record that is greater than or equal to the passed-in values.\
    \ If KeyExclusive is True, FindNearest finds the first record that is greater\
    \ than the passed-in values.\n\nIf FindNearest doesn't find a matching record,\
    \ it moves the current record pointer to the end of the dataset.\n\n# GotoKey\n\
    \nGotoKey performs the same function as FindKey, except that you set the values\
    \ of the search field(s) before calling GotoKey. The following code snippet shows\
    \ how to do this:\n\n```\nC1ientDataSet1.IndexName := 'byID';\nC1ientDataSet1.SetKey;\n\
    C1ientDataSet1.FieldName('ID').AsInteger := 25;\nC1ientDataSet1.GotoKey;\n```"
  merge: -1
  img_proc: true
- pgno: 153
  md: 'If the index is made up of multiple fields, you simply set each field after
    the call to SetKey, like this:


    ```

    ClientDataSet1.IndexName := ''byName'';

    ClientDataSet1.SetKey;

    ClientDataSet1.FieldByName(''First'').AsString := ''John'';

    ClientDataSet1.FieldByName(''Last'').AsString := ''Doe'';

    ClientDataSet1.GotoKey;

    ```


    After calling GotoKey, you can use the EditKey method to edit the key values used
    for the search. For example, the following code snippet shows how to search for
    John Doe, and then later search for John Smith. Both records have the same first
    name, so only the last name portion of the key needs to be specified during the
    second search.


    ```

    ClientDataSet1.IndexName := ''byName'';

    ClientDataSet1.SetKey;

    ClientDataSet1.FieldByName(''First'').AsString := ''John'';

    ClientDataSet1.FieldByName(''Last'').AsString := ''Doe'';

    ClientDataSet1.GotoKey;

    // Do something with the record


    // EditKey preserves the values set during the last SetKey

    ClientDataSet1.EditKey;

    ClientDataSet1.FieldByName(''Last'').AsString := ''Smith'';

    ClientDataSet1.GotoKey;

    ```


    # GotoNearest


    GotoNearest works similarly to GotoKey, except that it finds the first record
    that is greater than or equal to the value(s) passed to it. This depends on the
    current value of the KeyExclusive property.


    If KeyExclusive is False (the default), GotoNearest finds the first record that
    is greater than or equal to the field values set after a call to either SetKey
    or EditKey. If KeyExclusive is True, GotoNearest finds the first record that is
    greater than the field values set after calling SetKey or EditKey.


    If GotoNearest doesn''t find a matching record, it moves the current record pointer
    to the end of the dataset.


    The following example shows how to perform indexed and nonindexed searches on
    a dataset. Listing 3.7 shows the source code for the Search application, a sample
    program that illustrates the various indexed and nonindexed searching techniques
    supported by TClientDataSet.'
  merge: -1
  img_proc: true
