  md: 'Fortunately, in most situations you don''t have to worry about writing a complicated
    event handler for `OnReconcileError`. Delphi comes with a prewritten class that
    you can use to handle reconcile errors. To use this class, perform the following
    steps:


    +   1.  From the Delphi main menu, Select File, New, Other.

    +   2.  On the Dialogs tab of the New Items dialog, select the Reconcile Error
    Dialog icon. Make sure Copy is selected in the option buttons below the list of
    icons (see Figure 7.2).

    +   3.  Click OK.

    +   4.  Save the resulting unit as something like ReconcileErrorForm.pas. (the
    name doesn''t matter).

    +   5.  Add the new unit to the uses clause of the form that contains the client
    dataset (in this example, it''s the main form).

    +   6.  Add the following code to the `OnReconcileError` event for the client
    dataset:


    ```

    ```

    Action := HandleReconcileError(DataSet, UpdateKind, E);

    ```

    ```


    I won''t go into detail about the inner working of `HandleReconcileError` here.
    You should take a look at the unit''s source code to gain an understanding of
    how it works.


    ![](img/52a35759a0f10dade27a840504be5d82_293_0.png)


