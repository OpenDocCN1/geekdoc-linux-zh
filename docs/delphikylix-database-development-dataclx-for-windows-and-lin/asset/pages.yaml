    ```\nprocedure TForm1.ProviderGetData(Sender: TObject;\n  DataSet: TCustomClientDataSet);\n\
    begin\n  while not DataSet.EOF do begin\n    DataSet.Edit;\n    DataSet.FieldByName('AccountNumber').AsString\
    \ :=\n      EncryptData(DataSet.FieldByName('AccountNumber').AsString);\n    DataSet.Post;\n\
    \    DataSet.Next;\n  end;\nend;\n```\n```\nprocedure TFrmMain.DataSetProvider1UpdateData(Sender:\
    \ TObject;\n  DataSet: TCustomClientDataSet);\nbegin\n  while not DataSet.EOF\
    \ do begin\n    if DataSet.UpdateStatus <> usDeleted then begin\n      DataSet.Edit;\n\
    \      DataSet.FieldByName('AccountNumber').AsString :=\n        DecryptData(DataSet.FieldByName('AccountNumber').AsString);\n\
    \      DataSet.Post;\n      DataSet.Next;\n    end;\n  end;\nend;\n```\n```\n\n\
    On the client side, the **AccountNumber** field will be encrypted. **ClientDataSet1.FieldByName('AccountNumber').AsString**\
    \ will return an encrypted account code, which you should then decrypt before\
    \ displaying. Note that the code shown here is a rather simplistic implementation\
    \ of encrypting/decrypting data. For one thing, only the account number is encrypted\
    \ and decrypted. In a real application, you might want to encrypt and decrypt\
