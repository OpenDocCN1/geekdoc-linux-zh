- pgno: 315
  md: "# ## Providing and Resolving Data from Stored Procedures and Joins\n\nSo far,\
    \ the examples in this chapter focused on providing data from a single table using\
    \ a simple select statement, such as `SELECT * FROM CONTACTS`. Frequently, data\
    \ is provided from a stored procedure on the server or is generated as a join\
    \ between multiple tables, as the following two snippets show:\n\n```\n// Stored\
    \ procedure\nSELECT * FROM CONTACTSBYSTATE('FL')\n\nor\n\n// Join\nSELECT CONTACTS.FIRST,\
    \ CONTACTS.LAST, TODOS.SCHEDULED, TODOS.DESCRIPTION\nFROM CONTACTS, TODOS\nWHERE\
    \ CONTACTS.ID = TODOS.CONTACTID;\n```\n\n# ## Providing and Resolving Data from\
    \ a Stored Procedure\n\nIn the preceding example, the stored procedure returns\
    \ all contacts for a given state—in this case, Florida. TDataSetProvider attempts\
    \ to intelligently determine what database table to update when resolving data,\
    \ and in this case, CONTACTSBYSTATE is a stored procedure and not a table.\n\n\
    TDataSetProvider needs a little help to know what table should be updated with\
    \ any data changes. To do this, you need to provide an event handler for the provider’s\
    \ OnGetTableName event. In the event handler, specify the name of the table to\
    \ be updated, like this:\n\n```\nprocedure TFrm1.DataSetProvider1GetTableName(Sender:\
    \ TObject;\n  DataSet: TDataSet; var TableName: String);\nbegin\n  TableName :=\
    \ 'CONTACTS';\nend;\n```\n\nIn addition, you need to set the ProviderFlags to\
    \ [] for all fields in the stored procedure dataset that are not updated.\n\n\
    # ## Providing and Resolving Data from a Join\n\nBy definition, a join returns\
    \ data from more than one table. In many cases, the user will be able to update\
    \ data from only one of the tables. For example, in the select statement shown\
    \ previously, data is retrieved from the CONTACTS table and the TODOS table. On\
    \ the client side, the user may add a new TODO to the list, but the only table\
    \ that is affected is the TODOS table. (Presumably, if the user wants to add a\
    \ new contact, he would not do so on the same screen that he’s viewing todos on)."
  merge: -1
  img_proc: true
- pgno: 316
  md: 'If this is the case, you can specify the T0DOS table name in the OnGetTableName
    event handler, as explained earlier.


    Sometimes, though, the user will be able to update multiple tables at once. To
    handle this situation, you will need to write some code. Again, we turn to TDataSetProvider''s
    BeforeUpdateRecord event handler. The trick is to apply the necessary updates
    to the individual tables ourselves inside the event handler.


    The following code snippet shows the general outline that you will follow to apply
    updates to multiple tables at once. It is not compilable code.


    ```

    procedure TForm1.SQLClientDataSet1BeforeUpdateRecord(Sender: T0bject; SourceDS:
    TDataSet; DeltaDS: TCustomClientDataSet; UpdateKind: TUpdateKind; var Applied
    Boolean);

    var

    SQL: string;

    Connection: TSQLConnection;

    begin

    // Obtain a pointer to the connection from the source dataset

    Connection := (SourceDS as TCustomSQLDataSet).SQLConnection;

    case UpdateKind of

    ukInsert: begin

    // Insert into the first table

    SQL := // SQL INSERT STATEMENT FOR TABLE 1

    Connection.Execute(SQL, nil, nil);

    // Insert into the second table

    SQL := // SQL INSERT STATEMENT FOR TABLE 2

    Connection.Execute(SQL, nil, nil);

    end;

    ukModify: begin

    // Update the first table

    SQL := // SQL UPDATE STATEMENT FOR TABLE 1

    Connection.Execute(SQL, nil, nil);

    // Update the second table

    SQL := // SQL UPDATE STATEMENT FOR TABLE 2

    Connection.Execute(SQL, nil, nil);

    end;

    ukDelete: begin

    // Delete from the first table

    SQL := // SQL DELETE STATEMENT FOR TABLE 1

    Connection.Execute(SQL, nil, nil);

    ```'
