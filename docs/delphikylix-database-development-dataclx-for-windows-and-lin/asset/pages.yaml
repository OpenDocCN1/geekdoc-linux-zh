- pgno: 215
  md: 'The preceding two chapters concentrated on client datasets. Delphi''s *flexible*
    in-memory datasets. This chapter introduces the concept of data-aware components,
    which are ready-made components that know how to display and edit information
    stored in a database.


    Data-aware components can be used with differing datasets, including BDE, ADO,
    IBX, and third-party datasets. However, this chapter shows how to use them with
    client datasets because that is how they are used when dbExpress is the underlying
    data access technology.


    # What Are Data-Aware Components?


    *Data-aware components* are components that can automatically load and store information
    from and to a dataset. For example, consider a standard edit control. It has a
    `Text` property, which the programmer is responsible for reading from and writing
    to. Where you obtain the data, and what you do with the new string after the user
    enters it in the edit control, is entirely up to you. You might store it in a
    dataset. You might store it in an INI file or in the Windows registry. You might
    even simply use it to perform some sort of calculation, and never store it anywhere
    at all.


    Because displaying data obtained from a dataset is such a common application requirement,
    Delphi provides a set of *data-aware* components that mirror the standard components.
    Table 5.1 lists the data-aware components, along with their standard counterparts.


    **TABLE 5.1**

    Delphi Data-Aware Components and Their Non-Data-Aware Equivalents


    | Data-Aware Component | Non-Data-Aware Equivalent |

    | :--- | :--- |

    | TDBText | TLabel |

    | TDBEdit | TEdit |

    | TDBMemo | TMemo |

    | TDBCheckBox | TCheckBox |

    | TDBRadioGroup | TRadioGroup |

    | TDBComboBox | TComboBox |

    | TDBListBox | TListBox |

    | TDBLookupComboBox | TComboBox |

    | TDBLookupListBox | TListBox |

    | TDBImage | TImage |

    | TDBGrid | TStringGrid |

    | TDBRichEdit | TRichEdit (VCL-only component) |

    | TDBCtrlGrid | None. Allows for the display of multiple fields in a format that
    is not row oriented (VCL-only component). |'
  merge: -1
  img_proc: true
- pgno: 216
  md: "# **TABLE 5.1   Continued**\n\n| Data-Aware Component | Non-Data-Aware Equivalent\
    \ |\n| :--- | :--- |\n| TDBNavigator | None. Provides a visual means of navigating\
    \ and manipulating datasets without code. |\n| TDataSource | Not a data-aware\
    \ component per se. Provides a conduit between a dataset and one or more data-aware\
    \ components. |\n\n\nAs you can see in Table 5.1, the similarities between the\
    \ standard components and the data-aware components are self-explanatory (with\
    \ the possible exception of the TDBLookupComboBox and TDBLookupListBox components).\n\
    \nExcept for TDataSource, you’ll find all the components listed in Table 5.1 on\
    \ the Data Controls tab of the component palette. TDataSource can be found on\
    \ the Data Access tab.\n\nAll data-aware components discussed in this chapter\
    \ provide two properties that you must set. The DataSource property references\
    \ the TDataSource component that provides the link between the component and the\
    \ dataset. The DataField property determines from which field in the dataset the\
    \ data-aware component retrieves its data.\n\nLater sections in this chapter discuss\
    \ each of these components, with the exception of TDBGrid. Because the grid is\
    \ such an involved component, I’ll spend the following chapter investigating it.\
    \ Rather than providing numerous small sample applications throughout this chapter,\
    \ I’ll defer an example until the end.\n\nFor the most part, the data-aware components\
    \ mirror their non-data-aware counterparts, so I have not spent a lot of time\
    \ and space here discussing each of their properties, events, and methods. Instead,\
    \ I’ve concentrated on issues that are specific to the data-aware version of the\
    \ component. If you need basic information about the component’s properties or\
    \ methods, please refer to either the online help or to one of the excellent general-purpose\
    \ Delphi books available.\n\n> **NOTE**\n> \n> Some Delphi programmers shy away\
    \ from data-aware components—mostly because they are aware of the implementation\
    \ problems with data-aware components in Visual Basic. They might also shy away\
    \ because data-aware components received a bad reputation in Delphi’s early days.\
    \ Rest assured that data-aware components exhibit good performance characteristics\
    \ under Delphi, especially when used with TClientDataSets (which they are in this\
    \ chapter)."
  merge: -1
  img_proc: true
- pgno: 217
  md: '# TDataSource


    As Table 5.1 indicates, TDataSource provides a conduit between a dataset and one
    or more data-aware controls that are connected to it. You cannot connect a data-aware
    component directly to a dataset. Instead, you connect a TDataSource to the dataset,
    and then connect one or more data-aware components to the data source (as Figure
    5.1 illustrates).


    ![](img/52a35759a0f10dade27a840504be5d82_217_0.png)


    **Figure 5.1**

    Relationship between datasets, data sources, and data-aware components.


    TDataSource is a rather simple component, publishing just three events and three
    properties, in addition to the Name and Tag properties common to all components.
    Table 5.2 lists the published properties and Table 5.3 lists the data source’s
    events. OnDataChange and OnStateChange (the most commonly used of the events)
    are applied in Listing 5.4. later in this chapter.


    **TABLE 5.2**

    TDataSource Properties

    | Property | Description |

    | :--- | :--- |

    | AutoEdit | When True, the underlying dataset is automatically placed into edit
    mode as soon as the user starts to type into a data-aware component that is connected
    to this data source. When False, you must specifically call the dataset’s Edit
    method before the user can type into any of the connected data-aware controls.
    |

    | DataSet | Provides a link to the dataset from which the data-aware components
    retrieve data. |

    | Enabled | When Enabled is True, the data-aware components connected to this
    data source display the data contained in the dataset. When it’s False, data-aware
    controls are blank. |'
  merge: -1
  img_proc: true
- pgno: 218
  md: '**TABLE 5.3 TDataSource Events**


    | Event | Description |

    |---|---|

    | OnDataChange | Fires when the dataset''s current record data is changed; either
    because the dataset''s cursor is moved to a new record, or because one of the
    fields is modified. |

    | OnStateChange | Fires when the underlying dataset''s State property changes.
    For example, when the dataset transitions from browse mode to edit mode, or from
    insert mode to browse mode. |

    | OnUpdateData | Fires immediately before the underlying dataset posts changes
    to the database. |


    It is easy to forget about TDataSource when writing database applications. After
    dropping the data source on a form and connecting the data-aware components to
    it, the data source often seems to serve no useful purpose. However, the three
    events listed in Table 5.3 are extremely useful in a variety of situations. An
    example of their usefulness is shown in the sample application at the end of this
    chapter.


    # Common Data-Aware Component Characteristics


    Before discussing the specifics of each individual data-aware component, there
    are some common characteristics that you should understand. To effectively use
    data-aware components in your applications, you should keep in mind the following
    considerations:


    # Modifying Component Data from Code


    If you want to change the value that''s displayed in a data-aware component from
    within your code, you should edit the underlying field rather than attempting
    to manipulate the data-aware component.


    For example, say you have a TDBEdit named ecFirstName connected to a field named
    FirstName. If you want to programmatically set the edit control so that it displays
    John, you might be tempted to write the following code:


    ```

    ecFirstName.Text := ''John'';

    ```


    This is not the correct way, however. What you should do is set the underlying
    field value to John, like this:


    ```

    ClientDataSet1.Edit;

    ClientDataSet1.FirstName.AsString := ''John'';

    ```


    ![](img/52a35759a0f10dade27a840504be5d82_218_0.png)'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'If you are not using persistent field objects, you would do this instead:


    ClientDataSet1.Edit;

    ClientDataSet1. FieldByName(''FirstName'').AsString := ''John'';


    The important thing to remember is to call the dataset''s Edit method before attempting
    to set the field value. If the dataset is already in edit or insert mode, the
    redundant call to Edit doesn''t have any adverse effects. If for some reason the
    dataset can''t be edited (for example, if the dataset''s ReadOnly property is
    set to True), the call to Edit raises an exception, which you should be prepared
    to handle gracefully.


    # ## Controlling When the User Is Allowed to Edit Data


    By default, as soon as the user starts typing into a data-aware component, VCL/CLX
    puts the associated dataset into edit mode. If you want to control the user''s
    ability to make edits from within your code, you have four options:


    +   * Set the dataset''s ReadOnly property to True, preventing the user from changing
    any values in the dataset. This also prevents any changes being made to the data
    through code.

    +   * Set the underlying field''s ReadOnly property to True. This prevents the
    user from modifying the field, and also prevents the field from being modified
    through code.

    +   * Set the data-aware component''s ReadOnly property to True, preventing the
    user from changing a single value in the dataset. Note that this has no effect
    on any changes that you make in your code using the method described in the preceding
    section. Setting the component''s ReadOnly property does not in any way make the
    field itself read-only. It merely prevents the user from making direct modifications
    to the data through the component.

    +   * Set the data source''s AutoEdit property to False, preventing the dataset
    from automatically entering an edit state when the user starts typing into a data-aware
    component. If you go this route, you will typically provide a menu item or a button
    on the form, which the user clicks to put the dataset into edit mode. Alternately,
    you can use a TDBNavigator, which is discussed later in this chapter.


    # ## Formatting and Editing Field Values


    Data-aware components don''t have a built-in mechanism for controlling the formatting
    of field values during input and output, so at first glance, you might assume
    that there is no way to display nicely formatted numeric and string data. However,
    it turns out that data formatting is taken care of at the field level rather than
    at the component level. For this reason, you can set a specific output format
    for a field, and the same format will be used anywhere that a data-aware component
    is used to display that field.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Numeric Fields


    When you connect a data-aware component to a numeric field, the data that is displayed
    in a component is formatted according to the underlying field''s `DisplayFormat`
    property.


    `DisplayFormat` is a string property that consists of up to three parts, separated
    by semicolons, in the following format:


    ```

    <Positive>;<Negative>;<Zero>

    ```


    The different sections of the string determine how the value is displayed when
    it is positive, negative, or zero (respectively). Null values are always displayed
    as a blank.


    Table 5.4 lists the characters that can be used within the `DisplayFormat` string.


    **TABLE 5.4 DisplayFormat Specifiers**


    | Character | Description |

    | :--- | :--- |

    | # | Digit placeholder. If the formatted value does not require a digit at that
    position, the position is not filled. For example, the value 1.2 formatted with
    a `DisplayFormat` of `###.##` yields 1.2, with no leading or trailing spaces.
    |

    | 0 | Digit placeholder. If the formatted value does not require a digit at that
    position, the position is filled with a 0. For example, the value 1.2 formatted
    with a `DisplayFormat` of `000.00` yields `001.20`. |

    | . | Decimal point. Determines where the radix point occurs in the output string.
    The decimal point is replaced by the character stored in the `DecimalSeparator`
    global variable. |

    | , | Thousands separator. The occurrence of a comma in the `DisplayFormat` indicates
    that the value should be formatted using thousands separators. The comma does
    not occupy a position in the output string—it only serves as an indication that
    thousands separators are needed. At runtime, the comma is replaced by the character
    stored in the `ThousandsSeparator` global variable. |

    | E+/- | Scientific notation. If E+, E-, e+, or e- is present in the `DisplayFormat`,
    the value is formatted using scientific notation. E+ indicates that all exponents
    should be preceded by a sign. E- indicates that only negative exponents should
    be preceded by a sign. The E+ or E- is followed by one to four zeros, specifying
    the minimum number of digits to include in the exponent. |

    | ; | Separator character. Used between positive, negative, and zero portions
    of the string. |

    | '' or " | Literal. Characters enclosed in single or double quotes are copied
    literally to the output string, and are not interpreted as formatting characters.
    |'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Table 5.5 lists some examples of DisplayFormat settings.


    **TABLE 5.5** DisplayFormat Settings


    | Value | DisplayFormat | Output |

    | :--- | :--- | :--- |

    | 1.2 | ##0.00 | 1.20 |

    | 1.2 | 000.# | 001.2 |

    | 1 | #0.000 | 1.000 |

    | 1 | 00.## | 1 (The radix point is not displayed because it is not needed.) |

    | 12.34 | $##0.00 | $12.34 |

    | 1234.56 | $,0.00 | $1,234.56 |

    | 12,345 | X=#.## | X=12.35 (Notice that the part to the left of the radix point
    is automatically expanded to show two digits, but the part to the right of the
    radix point is rounded to the specified number of digits.) |

    | 100000 | #0.000E+00 | 10.000E+04 |

    | −15 | ##0;(##0);zero | (15) |

    | 0 | ##0;(##0);zero | zero |

    | 10 | Room "#" #0 | Room #10 (The # enclosed in quotes is copied verbatim to
    the output result.) |


    If you only specify a single substring in `DisplayFormat`, it is used to format
    all numbers. To use a different output format for negative or zero values, separate
    the specifiers with semicolons, like this:


    ```

    ```

    $,0.00;($,0.00);<zero>

    ```

    ```


    This `DisplayFormat` string formats positive numbers as dollars and cents, negative
    numbers within parentheses, and zero values as the string `<zero>`.


    You can omit a portion of the string by simply leaving its specifier empty. In
    this case, the positive format is used instead. For example:


    ```

    ```

    $,0.00;;<zero>

    ```

    ```


    In this case, positive and negative values are both formatted using `$,0.00`.
    Zero values are displayed as `<zero>`.


    If the `DisplayFormat` property is left completely blank, the value is displayed
    using general floating-point output with 15 significant digits.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'By default, the same format is used when editing a field''s value. You can
    set a different format to use when editing by setting the field''s EditFormat
    property in addition to, or instead of the DisplayFormat property. EditFormat
    works the same as DisplayFormat: It contains a semicolon-delimited set of formats
    to use when displaying positive, negative, and zero values.


    For example, suppose that you have a floating-point field that you want displayed
    as 15.25%, but when editing, you don''t want the percent sign displayed. You would
    set DisplayFormat to #0.00%, and EditFormat to #0.00.


    # String Fields


    String fields do not have separate DisplayFormat and EditFormat properties. Instead,
    they have an EditMask property, which is used for both displaying and editing
    a field''s value. EditMask holds a Paradox-style edit mask that determines how
    the string is both displayed and edited.


    Like the DisplayFormat and EditFormat properties, EditMask consists of three parts,
    separated by semicolons. The first part is the mask to use when formatting the
    string value. The second part contains a 0 to indicate that literals should not
    be saved as part of the string value. Any other character in the second part of
    the string indicates that literals should be saved as part of the string value.
    The third part represents the character that''s displayed to represent blanks,
    or characters that have not yet been entered.


    For example, the following Editmask accepts a U.S. Social Security number, storing
    the hyphens in the underlying field and displaying underscores where numbers are
    to be entered.


    ```

    000-000-0000;1;

    ```


    Table 5.6 shows the valid EditMask specifiers for string fields.


    **TABLE 5.6**

    **EditMask Specifiers**


    | Character | Description |

    |-----------|-------------|

    | L | Requires an alphabetic character. |

    | 1 | Allows an alphabetic character, but does not require it. |

    | A | Requires an alphanumeric character. |

    | a | Allows an alphanumeric character, but does not require it. |

    | C | Requires a character. |

    | c | Allows a character, but does not require it. |

    | 0 | Requires a numeric character. |

    | 9 | Allows a numeric character, but does not require it. |

    | # | Allows a numeric character, or a plus or minus sign, but does not require
    it. |'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'TABLE 5.6 Continued

    | Character | Description |

    | --- | --- |

    | `:` | Time separator. This character is replaced with the time separator that
    is defined in the control panel under regional settings when it''s other than
    `:`. |

    | `/` | Date separator. This character is replaced with the date separator that
    is defined in the control panel under regional settings when it''s other than
    `/`. |

    | `_` | Underscore. This character inserts a space in the text. When editing a
    field, the cursor automatically skips over the _ character. |

    | `;` | Separator character. Used between mask, literal, and blank portions of
    the string. |

    | `!` | If the ! character appears anywhere in the mask, extra and optional characters
    are represented as leading blanks. Otherwise, extra and optional characters are
    represented as trailing blanks. |

    | `>` | All characters following the `>` character are forced to uppercase until
    a `<` character is encountered. |

    | `<` | All characters following the `<` character are forced to lowercase until
    a `>` character is encountered. |

    | `<>` | All characters are accepted in whatever case the user enters them. |

    | `\` | Literal. The character following the \ character is inserted in the string,
    literally, and is not interpreted as a mask character. |


    **NOTE**


    Each character in the mask represents one byte in the string—not one character.
    For that reason, when working with multibyte character sets, each character in
    the string is represented by two characters in the EditMask. For example, AA and
    LL each represent a single multibyte character. When inserting a literal into
    a mask, only single-byte literal characters can be entered.


    Table 5.7 lists some examples of EditMask settings.


    TABLE 5.7 EditMask Settings

    | Stored Value | EditMask | Displayed Value | Remarks |

    | --- | --- | --- | --- |

    | 5615551212 | (000)_000-0000 | (561) 555-1212 | Phone number. Formatting characters
    are not stored. |

    | 123-456-7890 | 000-000-0000;1;_ | 123-456-7890 | Social Security number. Formatting
    characters (hyphens) are stored. |'
  merge: -1
