    # # BLOBs


    BLOBs, or Binary Large Objects, are a fundamental part of many modern database
    applications. Whether you want to store images, formatted and unformatted notes,
    streamed components, or any other chunk of bytes; BLOBs are an essential part
    of your database-programming repertoire.


    In this section, I’ll show you how to effectively store BLOBs in a client dataset
    and how to retrieve them later. In the pages to follow, I’ll focus specifically
    on notes, images, streamed components, and generic BLOB storage.


    As with other field types, you can create BLOB fields either at design time or
    at runtime. The following code snippet shows how to create a BLOB field at runtime:


    ```

    ClientDataSet1.FieldDefs.Add(''Notes'', ftBLOB);

    ```


    This code creates a field named Notes, of type ftBLOB.


    # ## Notes


    One of the most common ways to use a BLOB field is to store notes, or free-format
    text. For small amounts of text a string field typically suffices, but if you
    want to store entire memos, you need to use a BLOB field.


    Accessing a BLOB as a string is particularly easy. You can simply call the AsString
    method on the field, like this:


    ```

    Memo1.Text := ClientDataSet1.FieldName(''Notes'').AsString;

    ```


    Similarly, to store the memo back to the field, you would write code like the
    following:


    ```

    ClientDataSet1.FieldName(''Notes'').AsString := Memo1.Text;

    ```


    # ## Images


    Another common use of BLOB fields is to store images. You might want to write
    a Delphi application to catalog the pictures you’ve taken on your digital camera,
    or you might want to track scanned documents in a paperless office. Either way,
    a BLOB field provides the necessary support to store these images in a database.'
  merge: -1
  img_proc: true
- pgno: 176
  md: "Like formatted and unformatted memos, Delphi provides a data-aware version\
    \ of an image: `TDBImage`. `TDBImage` is lacking, however, because it only correctly\
    \ stores and retrieves bitmaps (BMP files). A robust application should store\
    \ bitmaps, JPGs, and (almost) any other image type that the user might want to\
    \ store.\n\nThere are at least three methods that you can use to store multiple\
    \ image types in a dataset. They include:\n\n+   * Creating a separate field that\
    \ will be used to store the image type. Use this field value to determine how\
    \ to store/load the image.\n+   * Writing a value to the BLOB field indicating\
    \ the image type, immediately followed by the image data.\n+   * Using a third-party\
    \ imaging library to do the work for you.\n\nThe following sections discuss these\
    \ options.\n\n# ## Using a Separate Field to Store the Image Type\n\nOne way to\
    \ track the type of image stored in a dataset is to add a separate field, perhaps\
    \ named `ImageType`, to track the type of image. Say, for the sake of argument,\
    \ that your application can store BMPs and JPGs. You would set up constants for\
    \ each image type, like this:\n\n```\n```\nconst\n  IMAGE_NONE = 0;\n  IMAGE_BMP\
    \ = 1;\n  IMAGE_JPG = 2;\n```\n```\n\nPresumably, the `ImageType` field contains\
    \ the value `IMAGE_NONE` when the BLOB field is NULL. To implement this method\
    \ correctly, you must remember to set the `ImageType` field whenever the user\
    \ loads an image, and then reset it to `IMAGE_NONE` if the user clears the image.\n\
    \n# ## Streaming the Image Type as Part of the BLOB Field\n\nWith a little extra\
    \ code, you can dispense with the additional field and store the image type in\
    \ the BLOB field along with the image itself. Figure 4.2 shows conceptually what\
    \ is involved with this method.\n\nThe following pseudo-code shows how you might\
    \ implement this method:\n\n```\n```\nprocedure SaveImage;\nbegin\n  OpenOutputStream;\n\
    \  WriteImageType;\n  WriteImageData;\nend;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 177
  md: "```\nprocedure LoadImage;\nvar\n  ImageType: Integer;\nbegin\n  OpenInputStream;\n\
    \  ImageType := ReadImageType;\n  case ImageType of\n    IMAGE_BMP: ReadBitmap;\n\
    \    IMAGE_JPG: ReadJPEG;\n  end;\nend;\n```\n\nThe sample application provided\
    \ at the end of this section illustrates both of these techniques.\n\n![](img/52a35759a0f10dade27a840504be5d82_177_0.png)\n\
    \n# Third-Party Imaging Libraries\n\nThird-party imaging libraries generally follow\
    \ the steps outlined in the preceding section (that is, they typically store a\
    \ value to the stream indicating the type of image stored in the stream). Immediately\
    \ following the image type is the image itself.\n\nHowever, other third-party\
    \ libraries might always store an image internally in a proprietary format, and\
    \ then read and write that image format to and from the stream. The point is that\
    \ after you decide on an imaging library and implement it in your applications,\
    \ you shouldn’t expect that you can arbitrarily swap out the library with a different\
