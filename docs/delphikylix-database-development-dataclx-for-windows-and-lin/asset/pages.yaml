- pgno: 269
  md: "# **Listing 6.2** Continued\n\n```\nif gdSelected in State then begin\n   DBGrid1.Canvas.Font.Color\
    \ := clGreen;\n   DBGrid1.Canvas.Font.Style := [fsBold];\nend;\n\nif Column.ID\
    \ = 0 then begin\n   DBGrid1.Canvas.FillRect(Rect);\n   \n   RetirememtBirthdate\
    \ := IncYear(Date, -50);\n   if ClientDataSet1.FieldByName('Birthday').AsDateTime\
    \ <=\n   RetirementBirthdate then begin\n      // Eligible for retirement\n  \
    \    X := (Column.Width - Image1.Picture.Width) div 2 + Rect.Left;\n      DBGrid1.Canvas.Draw(X,\
    \ Rect.Top, Image1.Picture.Graphic);\n   end;\nend else\n   DBGrid1.DefaultDrawColumnCell(Rect,\
    \ DataCol, Column, State);\nend;\nend.\n```\n\nFigure 6.1 showed the CustomDraw\
    \ application at runtime.\n\nSeveral things happen in the DBGrid1DrawColumnCell\
    \ method in Listing 6.2. First, odd rows are drawn using a background color of\
    \ clAqua, and even rows are drawn using a background color of clWhite. This gives\
    \ a checkbook-style look to the grid.\n\nSecond, the current row (determined by\
    \ the fact that the State parameter includes the gdSelected option) is drawn in\
    \ a bold, green font. The State parameter includes the gdSelected option because\
    \ dgRowSelect is specified in the grid's options.\n\nFinally, the code checks\
    \ the birthday of the employee. If the employee is 50 years old (or older), a\
