    \ DatabaseName: string);\nvar\n    HRsrc: THandle;\n    Stream: TResourceStream;\n\
    begin\n    HRsrc := FindResource(HInstance, PChar('EMPTDB'), RT_RCDATA);\n   \
    \ if HRsrc <> 0 then begin\n        Stream := TResourceStream.Create(HInstance,\
    \ 'EMPTDB', RT_RCDATA);\n        try\n            Stream.SaveToFile(DatabaseName);\n\
    \        finally\n            Stream.Free;\n        end;\n    end else\n     \
    \   raise Exception.Create('Internal error: unable to create database.');\nend;\n\
    ```\n\nNow when you want to create a new database in your application, you simply\
    \ call CreateDatabase, passing the complete pathname of the database, like this:\n\
    \n```\nCreateDatabase( 'C:\\NewDatabase.gdb' );\n```\n\nAs you're working on your\
    \ application, if you change the database schema, you must remember to reissue\
    \ the **BRCG32** command (shown previously) to re-create the EMPTYDB.RES file.\
    \ Otherwise, you wind up with an incorrect, empty database inside your application.\n\
    \nAnother way that you could handle this situation is to make direct, low-level\
    \ calls to the database API from within your application. This approach has the\
    \ benefit of being cross-platform, but you must learn the appropriate API commands\
    \ for the database backend in question.\n\n# ## DML Commands\n\nWhereas DDL commands\
    \ are used to define the database schema, DML commands are used to manipulate\
    \ (read, write, and update) the data in the database."
