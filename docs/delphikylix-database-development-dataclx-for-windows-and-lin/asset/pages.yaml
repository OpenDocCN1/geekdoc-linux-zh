- pgno: 107
  md: 'In the preceding two chapters, I discussed dbExpress—a unidirectional database
    technology. In the real world, most applications support bidirectional scrolling
    through a dataset. As noted previously, Borland has addressed bidirectional datasets
    through a technology known as client datasets. This chapter introduces you to
    the basic operations of client datasets, including how they are a useful standalone
    tool. Subsequent chapters focus on more advanced client dataset capabilities,
    including how you can hook a client dataset up to a dbExpress (or other) database
    connection to create a true multitier application.


    # What Is a Client Dataset?


    A client dataset, as its name suggests, is a dataset that is located in a client
    application (as opposed to an application server). The name is a bit of a misnomer,
    because it seems to indicate that client datasets have no use outside a client/server
    or multitier application. However, as you''ll see in this chapter, client datasets
    are useful in other types of applications, especially single-tier database applications.


    NOTE


    Client datasets were originally introduced in Delphi 3, and they presented a method
    for creating multitier applications in Delphi. As their use became more widespread,
    they were enhanced to support additional single-tier functionality.


    The base class in VCL/CLX for client datasets is TCustomClientDataSet. Typically,
    you don''t work with TCustomClientDataSet directly, but with its direct descendent,
    TClientDataSet. (In Chapter 7, “Dataset Providers,” I''ll introduce you to other
    descendants of TCustomClientDataSet.) For readability and generalization, I''ll
    refer to client datasets generically in this book as TClientDataSet.


    # Advantages and Disadvantages of Client Datasets


    Client datasets have a number of advantages, and a couple of perceived disadvantages.
    The advantages include


    +   Memory based. Client datasets reside completely in memory, making them useful
    for temporary tables.


    +   Fast. Because client datasets are RAM based, they are extremely fast.


    +   Efficient. Client datasets store their data in a very efficient manner, making
    them resource friendly.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '+   • On-the-fly indexing. Client datasets enable you to create and use indexes
    on-the-fly, making them extremely versatile.

    +   • Automatic undo support. Client datasets provide multilevel undo support,
    making it easy to perform what if operations on your data. Undo support is discussed
    in Chapter 4, “Advanced Client Dataset Operations.”

    +   • Maintained aggregates. Client datasets can automatically calculate averages,
    subtotals, and totals over a group of records. Maintained aggregates are discussed
    in detail in Chapter 4.


    The perceived disadvantages include


    +   • Memory based. This client dataset advantage can also be a disadvantage.
    Because client datasets reside in RAM, their size is limited by the amount of
    available RAM.

    +   • Single user. Client datasets are inherently single-user datasets because
    they are kept in RAM.


    When you understand client datasets, you’ll discover that these so-called disadvantages
    really aren’t detrimental to your application at all. In particular, basing client
    datasets entirely in RAM has both advantages and disadvantages.


    Because they are kept entirely in your computer’s RAM, client datasets are extremely
    useful for temporary tables, small lookup tables, and other nonpersistent database
    needs. Client datasets also are fast because they are RAM based. Inserting, deleting,
    searching, sorting, and traversing in client datasets are lightning fast.


    On the flip side, you need to take steps to ensure that client datasets don’t
    grow too large because you waste precious RAM if you attempt to store huge databases
    in in-memory datasets. Fortunately, client datasets store their data in a very
    compact form. (I’ll discuss this in more detail in the “Undo Support” section
    of Chapter 7.)


    Because they are memory based, client datasets are inherently single user. Remote
    machines do not have access to a client dataset on a local machine. In Chapter
    8, “DataSnap,” you’ll learn how to connect a client dataset to an application
    server in a three-tier configuration that supports true multisier operation.


    # ## Creating Client Datasets


    Using client datasets in your application is similar to using any other type of
    dataset because they derive from TDataSet.


    You can create client datasets either at design-time or at runtime, as the following
    sections explain.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Creating a Client Dataset at Design-Time


    Typically, you create client datasets at design-time. To do so, drop a TClientDataSet
    component (located on the Data Access tab) on a form or data module. This creates
    the component, but doesn''t set up any field or index definitions. Name the component
    cdsEmployee.


    To create the field definitions for the client dataset, double-click the TClientDataSet
    component in the form editor. The standard Delphi field editor is displayed. Right-click
    the field editor and select New Field... from the pop-up menu to create a new
    field. The dialog shown in Figure 3.1 appears.


    ![](img/52a35759a0f10dade27a840504be5d82_109_0.png)


    # **FIGURE 3.1**


    *Use the New Field dialog to add a field to a dataset.*


    If you''re familiar with the field editor, you notice a new field type available
    for client datasets, called **Aggregate fields**. I''ll discuss Aggregate fields
    in detail in the following chapter. For now, you should understand that you can
    add data, lookup, calculated, and internally calculated fields to a client dataset—just
    as you can for any dataset.


    The difference between client datasets and other datasets is that when you create
    a data field for a typical dataset, all you are doing is creating a persistent
    field object that maps to a field in the underlying database. For a client dataset,
    you are physically creating the field in the dataset along with a persistent field
    object. At design-time, there is no way to create a field in a client dataset
    without also creating a persistent field object.


    # Data Fields


    Most of the fields in your client datasets will be data fields. A data field represents
    a field that is physically part of the dataset, as opposed to a calculated or
    lookup field (which are discussed in the following sections). You can think of
    calculated and lookup fields as virtual fields because they appear to exist in
    the dataset, but their data actually comes from another location.'
  merge: -1
  img_proc: true
- pgno: 110
