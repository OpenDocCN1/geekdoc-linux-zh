  md: 'thousands of records from the database. If each contact has a picture that
    averages 100K in size, the amount of data returned from the server will be huge.
    This problem compounds when the database connection is across a local area network,
    or worse, across the Internet.


    ![](img/52a35759a0f10dade27a840504be5d82_83_0.png)


    > Figure 2.2

    > *TSQLDataset is used to retrieve data from the database.*


    In these cases, you might want to eliminate the BLOB column from the result set.
    There are two ways that you can accomplish this. First, if you''re executing a
    predefined query, simply omit the BLOB field from the query. For example, if you
    are executing the query SELECT FIRST, LAST, PHONE, IMAGE FROM CONTACTS, modify
    the SQL statement to be SELECT FIRST, LAST, PHONE FROM CONTACTS.


    Second, although the previous solution works fine if you know the exact columns
    that you are retrieving from the database, what about a general-purpose database
    utility? If you don''t know the column names or field types, you can execute a
    statement like the following:


    ```

    SELECT * FROM CONTACTS

    ```


    In a situation such as this, you can set TSQLDataSet''s BlobSize property to determine
    the maximum amount of data to retrieve for each BLOB field. If this parameter
    is 0 (the default), the maximum BLOB size is determined by the associated TSQLConnection''s
    BlobSize parameter. If this parameter is -1, the dataset retrieves the entire
    BLOB, regardless of size. Any other value constitutes the maximum number of bytes
    to retrieve for a BLOB.


    # NOTE


    Regardless of whether you set BlobSize at the connection level or at the dataset
    level, it applies to all BLOB fields returned in the dataset. There is no way
    to retrieve just the first 100 bytes of one BLOB field and the entire contents
    of another BLOB field.'
