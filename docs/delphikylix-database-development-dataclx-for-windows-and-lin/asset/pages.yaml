    # Undo Support


    TCustomClientDataSet and its descendents support built-in undo functionality,
    so you can provide for what-if scenarios in your application. For instance, you
    can enable the user to change the values of certain fields in the dataset (perhaps
    graphing, or otherwise displaying, an'
