- pgno: 60
  md: "+   * Some SQL operations are fast, but some are extremely slow. A very complicated\
    \ `SELECT` statement that is performed on a large database might take several\
    \ minutes (or even hours) to execute.\n+   * Especially when using `TSQLConnection`\
    \ in conjunction with datasets (discussed in Chapter 3), the connection might\
    \ run some SQL commands on your behalf. It can be useful for both learning and\
    \ debugging purposes to intercept all SQL commands sent to the database.\n\nIn\
    \ either of these situations, it’s helpful to be able to provide feedback or logging\
    \ facilities to the end user of your application (or to yourself) in the form\
    \ of a log file, database, CodeSite (from Raize Software, at www.raize.com), or\
    \ other debugging tool.\n\n# Changing the Cursor While Executing SQL Statements\n\
    \nThe simplest form of feedback that you can provide is to change the cursor to\
    \ an hourglass when an SQL statement is executing. To provide this functionality\
    \ in your application, all you need to do is set the connection’s `SQLHourGlass`\
    \ property to `True`. `SQLHourGlass` is not a published property, so you can’t\
    \ set it at design time.\n\n```\n```Delphi\nSQLConnection1.SQLHourGlass := True;\n\
    ```\n```\n\n# Creating a Callback Event to Monitor SQL Commands\n\nIf you want\
    \ to intercept every SQL command that passes from `TSQLConnection` to the database,\
    \ you can set up what is called a trace callback event.\n\nYou set up a trace\
    \ callback event by calling `TSQLConnection.SetTraceCallbackEvent`. `SetTraceCallbackEvent`\
    \ takes two parameters: the event to call for SQL activity, and a user-defined\
    \ integer value that is passed to the callback event.\n\nThe format of the callback\
    \ event is defined as follows:\n\n```\n```Delphi\nTSQLCallbackEvent = function(CallType:\
    \ TRACECat;\n  CBInfo: Pointer): CBResult; stdcall;\n```\n```\n\n`CallType` is\
    \ always set to `cTRACE` on entry to the callback function. `CBInfo` is a pointer\
    \ to an `SQLTRACEdesc` record, which is defined like this:\n\n```\n```Delphi\n\
    SQLTRACEdesc = packed record   { trace callback info }\n  pszTrace     : array\
    \ [0..$023] of Char;\n  eTraceCat    : TRACECat;\n  ClientData   : Integer;\n\
    \  uTotalMsgLen : Word;\nend;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 61
  md: 'The fields and their meanings are shown in Table 1.8.


    **TABLE 1.8** SQLTraceDesc Field Explanations


    | Field | Definition |

    | :-- | :-- |

    | pszTrace | The NULL-terminated command that was just passed to or from the database.
    |

    | eTraceCat | The category of the command just sent or received. Table 1.9 lists
    the possible values of this field. |

    | ClentData | The user-defined value passed as the second parameter to SetTraceCallBackEvent.
    |

    | uTotalIMsgLen | The length, in characters, of the string contained in pszTrace.
    |


    Table 1.9 describes the possible values for the eTraceCat field.


    **TABLE 1.9** eTraceCat Values


    | Value | Definition |

    | :-- | :-- |

    | tracePREPARE | A query was sent to the server to prepare. |

    | traceEXECUTE | A query was sent to the server to execute. |

    | traceERROR | An error message was returned by the server. |

    | traceSTMT | An operation for the database to perform was sent to the server.
    |

    | traceCONNECT | A connect-or-disconnect-related operation was sent to the server.
    |

    | traceTRANSACT | A transaction-related operation was sent to the server. |

    | traceBLOB | A BLOB-related operation was sent to the server. |

    | traceVENDOR | A vendor-specific API call was sent to the server. |

    | traceDATAIN | Parameter data was sent to the server during an INSERT or UPDATE
    command. |

    | traceDATAOUT | Data was retrieved from the server. |

    | traceMISC | Any other command not falling under one of the previous categories.
    |


    **Note**


    Not all of these options are currently supported. Many of them are there for future
    expansion. Currently, all vendor calls and executed SQL commands are traced.'
  merge: -1
  img_proc: true
- pgno: 62
  md: "The following code snippet sets a callback event:\n\n```\nfunction SQLCallback(CallType:\
    \ TRACECat; CBInfo: Pointer): CBType; stdcall;\nvar\n    CBI: pSQLTraceDesc;\n\
    begin\n    CBI := pSQLTraceDesc(CBInfo);\n    ShowMessage(CBI^sTrace);\nend;\n\
    begin\n    SQLConnection1.SetTraceCallbackEvent(SQLCallback, 1);\nend;\n```\n\n\
    ![](img/52a35759a0f10dade27a840504be5d82_62_0.png)\n\n> Do not pass 0 as the second\
    \ parameter to SetTraceCallbackEvent, or your callback event will never be called\
    \ and you'll rack your brains trying to figure out why callback events are not\
    \ working.\n\nTo remove a callback handler, execute the following line of code:\n\
    \n```\nSQLConnection1.SetTraceCallbackEvent(nil, 0);\n```\n\n# TSQLMonitor\n\n\
    TSQLMonitor provides a ready-made, easy-to-use mechanism for capturing database\
    \ events. You can log database messages to a list box, a log file, or another\
    \ destination as they occur. You can also allow messages to accumulate in the\
    \ monitor's internal buffer, and dump them to a file (or other destination) in\
    \ one fell swoop.\n\nTo use a TSQLMonitor, drop it on a form or data module, along\
    \ with your TSQLConnection component. To begin logging events, set the monitor's\
    \ SQLConnection property to the TSQLConnection component and set the Active property\
    \ to True.\n\nThere are two ways to monitor database messages: You can elect to\
    \ log each message as soon as TSQLMonitor is notified of it, or you can allow\
    \ the component to buffer up the messages and save them to a log file or string\
    \ list at a later time. The following sections explain these options.\n\n# Logging\
    \ Messages as They Occur\n\nThere are actually two different ways that you can\
    \ log database messages as they occur. The first is through the use of TSQLMonitor's\
    \ AutoSave and FileName properties. Set FileName to\n\n# 1 ESTABLISHING AND USING\
    \ DATABASE CONNECTIONS"
  merge: -1
  img_proc: true
- pgno: 63
  md: 'the name of the log file that you want to create, such as `C:\TRACE.LOG`. Set
    `AutoSave` to `True`, and the component automatically logs all database messages
    to the specified filename. If the file does not exist, it is automatically created.
    If the file does exist, it is appended to.


    The second method of logging messages on the fly is to write an event handler
    for the `OnTrace` or `OnLogTrace` event. `OnTrace` is fired as soon as the component
    receives an indication that a message has passed between the application and the
    database server. The event handler looks like this:


    ```

    procedure TForm1.SQLMonitorOnTrace(Sender: TObject; CBlnto: pSQLTRACEDesc;

    var LogTrace: Boolean);

    begin

    end;

    ```


    Inside the event handler, you can set `LogTrace` to `False` if, for some reason,
    you don''t want the message to be saved to the internal list. By default, the
    message is logged.


    `OnLogTrace` is fired after the message is added to the internal trace list. Its
    event handler looks like this:


    ```

    procedure TForm.SQLMonitorLogTrace (Sender: TObject; CBlnto: pSQLTRACEDesc);

    begin

    end;

    ```


    The parameters are the same as the first two parameters passed to the `OnTrace`
    event handler.


    # Buffering Messages


    Rather than dealing with each individual message as it arrives, you can allow
    them to be buffered in an internal list by the TSQLMonitor component. You can
    then save them to a file or to a string list at a later time.


    To save the list to a file, call the component''s `SaveToFile` method, like this:


    ```

    SQLMonitor.SaveToFile(''C:\EventList.LOG'');

    ```


    Alternately, you can save the messages to a string list by accessing the `TraceList`
    property, which is a TStrings object containing the list of messages. By calling
    methods and/or properties on `TraceList`, you can access the individual lines
    in the list.


    # Using Multiple Feedback Mechanisms


    TSQLConnection is not designed to easily support sending database trace events
    to multiple destinations at the same time. In other words, you can''t use both
    a TSQLMonitor and a user-defined feedback event at the same time. So, if you want
    to assign a callback event, you should'
  merge: -1
  img_proc: true
