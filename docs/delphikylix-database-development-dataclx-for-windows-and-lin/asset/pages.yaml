    # Disconnecting from the Database


    When you are finished accessing the database in your application, you should disconnect
    from it. This releases resources on both the client and the server. You can disconnect
    from the database manually or automatically.


    # Manually Disconnecting from a Database


    Manually disconnecting from a database is straightforward. Simply issue one of
    the following two commands:


    ```

    SQLConnection1.Connected := False;

    ```


    or


    ```

    SQLConnection1.Close;

    ```


    The method you use depends on whether you prefer to set a property or call a method
    to disconnect from the database.


    # Automatically Disconnecting from a Database


    If you want to enable dbExpress to automatically disconnect from the database
    when there are no open datasets, you should set TSQLConnection.KeepConnection
    := False. VCL/DataCLX monitors the number of open datasets on the connection,
    and when the last dataset is closed, the connection is automatically dropped.'
  merge: -1
  img_proc: true
- pgno: 27
  md: "**CAUTION**  \nYou should not set *KeepConnection* to *False* in cases where\
    \ the connection takes a long time to establish, or in applications where you\
    \ frequently open and close datasets. Repeated connecting to and disconnecting\
    \ from a database (especially in situations where it takes a long time to connect)\
    \ can severely impact program performance.\n\n# Connect and Disconnect Events\n\
