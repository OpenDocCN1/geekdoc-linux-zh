- pgno: 361
  md: 'In this book, I’ve discussed quite a number of techniques for writing database
    applications in Delphi and Kylix. Along the way, I’ve presented a number of small
    sample applications to solidify many of the important points discussed in each
    chapter.


    In this chapter, I’ll present a complete multiuser database application that incorporates
    many of the ideas discussed in this book. The application is called ConMan (short
    for Contact Manager).


    # What Is ConMan?


    ConMan is a rather simple contact manager that can be used to remember names,
    addresses, and phone numbers of important clients, friends, and family. You can
    also enter notes for each contact and store reminders.


    Multiple users can run this application simultaneously, and provisions in the
    application allow a user to store the database onto a local machine to use while
    away from the office (briefcase model).


    Although ConMan demonstrates many important multiuser database concepts, it isn’t
    going to replace your production-quality contact manager (such as ACT! or GoldMine)
    anytime soon. Many important features of a commercial contact manager are missing
    from ConMan, including the capability to dial the phone, automatically write letters,
    faxes, and memos using your favorite word processor, and so on. The intent of
    ConMan is not to write a salable product. After all, if that were the case, I
    wouldn’t be including the source code for free in a database book. Rather, the
    intent is to show a real-life application that makes use of important Delphi database
    technologies to give you a concrete understanding of how you might take advantage
    of the same technologies in your own applications.


    Figure 9.1 shows ConMan at runtime.


    Because ConMan takes advantage of technologies not yet supported by Kylix—such
    as DataSnap—it is presented as a VCL application only.'
  merge: -1
  img_proc: true
- pgno: 362
  md: '![](img/52a35759a0f10dade27a840504be5d82_362_0.png)


    # FIGURE 9.1


    *ConMan displays information about a contact, as well as his or her picture, notes,
    and scheduled todos.*


    # ## Database Structure


    You have already accessed some of the tables in the ConMan database through the
    sample pro-  grams provided with earlier chapters. Listing 9.1 contains the partial
    SQL script used to create a new, empty version of the **CONMAN** database.


    The **contacts** table is where company names, addresses, phone numbers, and the
    like are stored. One record is created for each contact, so if multiple contacts
    exist for the same com- pany, the company data is stored with each contact.


    > #### NOTE

    > In reality, this database should also contain a **Companies** table, with each
    contact holding a reference back to the company to which he or she is associated.
    To keep the size of this application manageable, I elected to store both company
    and contact data in the **contacts** table.


    ![](img/52a35759a0f10dade27a840504be5d82_362_1.png)'
