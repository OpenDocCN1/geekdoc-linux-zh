    # Cloning Data from Another Client Dataset


    Client datasets have the unique capability to clone data from another client dataset.
    When you clone a dataset, there is only one physical copy of the data, but there
    are two (or more) different datasets accessing the same copy of that data. Changes
    to one dataset immediately affect the other dataset’s view of the data.


    Why would you want to do this? I have run into several situations in my projects
    where cloning provides an elegant solution to an otherwise sticky situation. The
    following list outlines a few of the benefits:


    +   - You can traverse a clone of a dataset without disturbing the original dataset’s
    current record pointer.

    +   - When viewing a dataset in a grid, you can insert a new record in a dialog
    using data-aware controls that are connected to the clone (without temporarily
    opening a new, empty line in the grid).

    +   - You can apply ranges or filters on the clone without affecting the display
    of the original dataset.'
  merge: -1
  img_proc: true
- pgno: 200
  md: "To clone a dataset, create a second client dataset, and then call the second\
    \ dataset's CloneCursor method, like this:\n\n```\nvar\n  cdsClone: TClientDataSet;\n\
    begin\n  cdsClone := TClientDataSet.Create(nil);\n  try\n    cdsClone.CloneCursor(ClientDataSet1,\
    \ False, False);\n\n    // Perform some operations on the clone here.\n  finally\n\
    \    cdsClone.Free;\n  end;\nend;\n```\n\nThis code snippet creates a clone of\
    \ ClientDataSet1, performs some operation(s) on the clone, and then frees the\
    \ clone. Any Insert, Edit, or Delete operations performed on the clone are automatically\
    \ reflected in ClientDataSet1.\n\nCloneCursor is defined like this:\n\n```\nprocedure\
    \ CloneCursor(Source: TCustomClientDataSet; Reset: Boolean;\n  KeepSettings: Boolean\
    \ = False); virtual;\n```\n\nSource refers to the client dataset that you want\
    \ to clone. You can't clone a nonclient dataset, such as a BDE dataset or a dbExpress\
    \ dataset.\n\nReset and KeepSettings work hand in hand, and determine how the\
    \ clone handles the following attributes:\n\n+   - Filter, Filtered, FilterOptions,\
    \ OnFilterRecord\n+   - IndexName\n+   - MasterSource, MasterFields\n+   - ReadOnly\n\
    +   - RemoteServer, ProviderName\n\nIf Reset and KeepSettings are set to False,\
    \ all the previous properties are copied from the original dataset to the clone.\
    \ If Reset is False and KeepSettings is True, the previous properties are not\
    \ changed for the clone. If Reset is True (regardless of the value of KeepSettings),\
    \ the previous properties are cleared on the clone. Table 4.5 depicts this relationship.\n\
    \n4\nAdvanced Client Dataset Operations"
  merge: -1
  img_proc: true
- pgno: 201
  md: "**TABLE 4.5 Relationship between Reset and KeepSettings**\n| Reset | KeepSettings\
    \ | Behavior |\n|:-------------:|:--------------:|:----------|\n| False | False\
    \ | Properties are copied from the original dataset to the clone. |\n| False |\
    \ True | Properties are not changed for the clone. |\n| True | N/A | Properties\
    \ are cleared on the clone. |\n\nIf you want the clone to copy some of the listed\
    \ properties from the original dataset, but not to copy others, you have to write\
    \ some code. One way to handle this situation is to set both Reset and KeepSettings\
    \ to False copying all the properties listed previously from the original dataset\
    \ to the clone. Then, reset the clone’s properties that were overwritten by the\
    \ original dataset. Alternately, you could set Reset and KeepSettings to True,\
    \ and then set the appropriate properties on the clone.\n\n# **NOTE**\n\nAfter\
    \ cloning a client dataset, the clone does not contain any persistent fields types.\
    \ This means that you’ll typically use FieldByName to access fields in the clone.\
    \ Also, the clone does not inherit any standard calculated fields (internal calculated\
    \ fields are inherited) from the original dataset, so be careful not to try accessing\
    \ any calculated fields in the clone.\n\nThe following example program shows how\
    \ to effectively use a cloned dataset in the situations listed at the beginning\
    \ of this section. Listing 4.9 contains the complete source code for the Clone\
    \ application.\n\n# **LISTING 4.9 Clone—MainForm.pas**\n\n```\n```\nunit MainForm;\n\
    \ninterface\n\nuses\n  SysUtils, Variants, Classes, QOGraphics, QControls, QForms,\n\
    \  QDialogs, QGrids, QDBGrids, DB, DBClient, QExCtrls, QStDCtrls;\n\ntype\n  TfrmMain\
    \ = class(TForm)\n    pnlClient: TPanel;\n    pnlBottom: TPanel;\n    ClientDataSet1:\
    \ TClientDataSet;\n```\n```"
  merge: -1
  img_proc: true
