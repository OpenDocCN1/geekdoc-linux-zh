    \n# **FIGURE 7.3**\n\n*Delphi’s reconcile error handler allows the user to decide\
    \ how to deal with record conflicts.*\n\nBy default, this dialog shows conflicting\
    \ values only—in other words, fields that were changed by another user. Uncheck\
    \ the **Show Conflicting Fields Only** check box to display all field values.\
    \ If you do, you’ll see that this application changed the `LAST` field from Lombardo\
    \ to Smith. Another application changed the `FIRST` field from John to Eddie.\n\
    \nThe upper-right corner of the dialog contains a list of option buttons that\
    \ the user can use to instruct Delphi how to deal with the error. The option buttons\
    \ correspond to the `raSkip`, `raCancel`, `raCorrect`, `raRefresh`, and `raMerge`\
