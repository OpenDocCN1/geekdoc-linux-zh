- pgno: 111
  md: "That's enough fields for this dataset. In the next section, I'll show you how\
    \ to create a calculated field.\n\n# Calculated Fields\n\nCalculated fields, as\
    \ indicated previously, don't take up any physical space in the dataset. Instead,\
    \ they are calculated on-the-fly from other data stored in the dataset. For example,\
    \ you might create a calculated field that adds the values of two data fields\
    \ together. In this section, we'll create two calculated fields: one standard\
    \ and one internal.\n\n> **NOTE**\n> \n> Actually, internal calculated fields\
    \ do take up space in the dataset, just like a standard data field. For that reason,\
    \ you can create indexes on them like you would on a data field. Indexes are discussed\
    \ later in this chapter.\n\n# Standard Calculated Fields\n\nIn this section, we'll\
    \ create a calculated field that computes an annual bonus, which we'll assume\
    \ to be five percent of an employee's salary.\n\nTo create a standard calculated\
    \ field, open the New Field dialog (as you did in the preceding section). Enter\
    \ a Name of Bonus and a Type of Currency.\n\nIn the Field Type radio group, select\
    \ Calculated. This instructs Delphi to create a calculated field, rather than\
    \ a data field. Click OK.\n\nThat's all you need to do to create a calculated\
    \ field. Now, let's look at internal calculated fields.\n\n# Internal Calculated\
    \ Fields\n\nCreating an internal calculated field is almost identical to creating\
    \ a standard calculated field. The only difference is that you select InternalCalc\
    \ as the Field Type in the New Field dialog, instead of Calculated.\n\nAnother\
    \ difference between the two types of calculated fields is that standard calculated\
    \ fields are calculated on-the-fly every time their value is required, but internal\
    \ calculated fields are calculated once and their value is stored in RAM. (Of\
    \ course, internal calculated fields recalculate automatically if the underlying\
    \ fields that they are calculated from change.)\n\nThe dataset's AutoCalcFields\
    \ property determines exactly when calculated fields are recomputed. If AutoCalcFields\
    \ is True (the default value), calculated fields are computed when the dataset\
    \ is opened, when the dataset enters edit mode, and whenever focus in a form moves"
  merge: -1
  img_proc: true
- pgno: 112
  md: "from one data-aware control to another and the current record has been modified.\
    \ If `AutoCalcFields` is False, calculated fields are computed when the dataset\
    \ is opened, when the dataset enters edit mode, and when a record is retrieved\
    \ from an underlying database into the dataset.\n\nThere are two reasons that\
    \ you might want to use an internal calculated field instead of a standard calculated\
    \ field. If you want to index the dataset on a calculated field, you must use\
    \ an internal calculated field. (Indexes are discussed in detail later in this\
    \ chapter.) Also, you might elect to use an internal calculated field if the field\
    \ value takes a relatively long time to calculate. Because they are calculated\
    \ once and stored in RAM, internal calculated fields do not have to be computed\
    \ as often as standard calculated fields.\n\nLet’s add an internal calculated\
    \ field to our dataset. The field will be called `Name`, and it will concatenate\
    \ the `FirstName` and `LastName` fields together. We probably will want an index\
    \ on this field later, so we need to make it an internal calculated field.\n\n\
    Open the New Field dialog, and enter a `Name of Name` and a `Type of String`.\
    \ Set `Size` to 52 (which accounts for the maximum length of the last name, plus\
    \ the maximum length of the first name, plus a comma and a space to separate the\
    \ two).\n\nIn the Field Type radio group, select `InternalCalc` and click OK.\n\
    \n# Providing Values for Calculated Fields\n\nAt this point, we’ve created our\
    \ calculated fields. Now we need to provide the code to calculate the values.\
    \ TClientDataSet, like all Delphi datasets, supports a method named `OnCalcFields`\
    \ that we need to provide a body for.\n\nClick the client dataset again, and in\
    \ the Object Inspector, click the Events tab. Double-click the `OnCalcFields`\
    \ event to create an event handler.\n\nWe’ll calculate the value of the `Bonus`\
    \ field first. Flesh out the event handler so that it looks like this:\n\n```\n\
    ```pascal\nprocedure TForm1.cdsEmployeeCalcFields(DataSet: TDataSet);\nbegin\n\
    \  cdsEmployeeBonus.AsFloat := cdsEmployeeSalary.AsFloat * 0.05;\nend;\n```\n\
    ```\n\nThat’s easy—we just take the value of the `Salary` field, multiply it by\
    \ five percent (0.05), and store the value in the `Bonus` field.\n\nNow, let’s\
    \ add the `Name` field calculation. A first (reasonable) attempt looks like this:\n\
    \n```\n```pascal\nprocedure TForm1.cdsEmployeeCalcFields(DataSet: TDataSet);\n\
    begin\n  cdsEmployeeBonus.AsFloat := cdsEmployeeSalary.AsFloat * 0.05;\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 113
  md: "This works, but it isn't efficient. The Name field calculates every time the\
    \ Bonus field calculates. However, recall that it isn't necessary to compute internal\
    \ calculated fields as often as standard calculated fields. Fortunately, we can\
    \ check the dataset's State property to determine whether we need to compute internal\
    \ calculated fields or not, like this:\n\n```\nprocedure TForm1.cdsEmployeeCalcFields(DataSet:\
    \ TDataSet);\nbegin\n  cdsEmployeeBonus.AsFloat := cdsEmployeeSalary.AsFloat *\
    \ 0.05;\n  if cdsEmployee.State = dsInternalCalc then\n    cdsEmployeeName.AsString\
    \ := cdsEmployeeLastName.AsString + ', ' +\n                                cdsEmployeeFirstName.AsString;\n\
    end;\n```\n\nNotice that the Bonus field is calculated every time, but the Name\
    \ field is only calculated when Delphi tells us that it's time to compute internal\
    \ calculated fields.\n\n# Lookup Fields\n\nLookup fields are similar, in concept,\
    \ to calculated fields because they aren't physically stored in the dataset. However,\
    \ instead of requiring you to calculate the value of a lookup field, Delphi gets\
    \ the value from another dataset. Let's look at an example.\n\nEarlier, we created\
    \ a Department field in our dataset. Let's create a new Department dataset to\
    \ hold department information.\n\nDrop a new TClientDataSet component on your\
    \ form and name it cdsDepartment. Add two fields: Dept (an integer) and Description\
    \ (a 30-character string).\n\nShow the field editor for the cdsEmployee dataset\
    \ by double-clicking the dataset. Open the New Field dialog. Name the field DepartmentName,\
    \ and give it a Type of String and a Size of 30.\n\nIn the Field Type radio group,\
    \ select Lookup. Notice that two of the fields in the Lookup definition group\
    \ box are now enabled. In the Key Fields combo, select Department. In the Dataset\
    \ combo, select cdsDepartment.\n\nAt this point, the other two fields in the Lookup\
    \ definition group box are accessible. In the Lookup Keys combo box, select Dept.\
    \ In the Result Field combo, select Description. The completed dialog should look\
    \ like the one shown in Figure 3.4."
  merge: -1
  img_proc: true
- pgno: 114
  md: "![](img/52a35759a0f10dade27a840504be5d82_114_0.png)\n\n# **FIGURE 3.4**\n\n\
    Adding a lookup field to a dataset.\n\nThe important thing to remember about lookup\
    \ fields is that the **Key field** represents the field in the base dataset that\
    \ references the lookup dataset. **Dataset** refers to the lookup dataset. The\
    \ **Lookup Keys** combo box represents the **Key field** in the lookup dataset.\
    \ The **Result field** is the field in the lookup dataset from which the lookup\
    \ field obtains its value.\n\nTo create the dataset at design time, you can right-click\
    \ the **TClientDataSet** component and select **Create DataSet** from the pop-up\
    \ menu.\n\nNow that you’ve seen how to create a client dataset at design-time,\
    \ let’s see what’s required to create a client dataset at runtime.\n\n# ## Creating\
    \ a Client Dataset at Runtime\n\nTo create a client dataset at runtime, you start\
    \ with the following skeletal code:\n\n```\n```\nvar\n  CDS: TClientDataSet;\n\
    begin\n  CDS := TClientDataSet.Create(nil);\n  try\n    // Do something with the\
    \ client dataset here\n  finally\n    CDS.Free;\n  end;\nend;\n```\n```\n\nAfter\
    \ you create the client dataset, you typically add fields, but you can load the\
    \ client dataset from a disk instead (as you’ll see later in this chapter in the\
    \ section titled “Persisting Client Datasets”)."
  merge: -1
  img_proc: true
- pgno: 115
  md: "# ### Adding Fields to a Client Dataset\n\nTo add fields to a client dataset\
    \ at runtime, you use the client dataset's FieldDefs property. FieldDefs supports\
    \ two methods for adding fields: AddFieldDef and Add.\n\n# **AddFieldDef**\n\n\
    TFieldDefs.AddFieldDef is defined like this:\n\n```\nfunction AddFieldDef: TFieldDef;\n\
    ```\n\nAs you can see, AddFieldDef takes no parameters and returns a TFieldDef\
    \ object. When you have the TFieldDef object, you can set its properties, as the\
    \ following code snipet shows.\n\n```\nvar\n  FieldDef: TFieldDef;\nbegin\n  FieldDef\
    \ := ClientDataSet1.FieldDefs.AddFieldDef;\n  FieldDef.Name := 'Name';\n  FieldDef.DataType\
    \ := ftString;\n  FieldDef.Size := 20;\n  FieldDef.Required := True;\nend;\n```\n\
    \n# **Add**\n\nA quicker way to add fields to a client dataset is to use the TFieldDefs.Add\
    \ method, which is defined like this:\n\n```\nprocedure Add(const Name: string;\
    \ DataType: TFieldType; Size: Integer = 0;\n  Required: Boolean = False);\n```\n\
    \nThe Add method takes the field name, the data type, the size (for string fields),\
    \ and a flag indicating whether the field is required as parameters. By using\
    \ Add, the preceding code snipet becomes the following single line of code:\n\n\
    ```\nClientDataSet1.FieldDefs.Add('Name', ftString, 20, True);\n```\n\nWhy would\
    \ you ever want to use AddFieldDef when you could use Add? One reason is that\
    \ TFieldDef contains several more-advanced properties (such as field precision,\
    \ whether or not it's read-only, and a few other attributes) in addition to the\
    \ four supported by Add. If you want to set these properties for a field, you\
    \ need to go through the TFieldDef. You should refer to the Delphi documentation\
    \ for TFieldDef for more details.\n\n# ### Creating the Dataset\n\nAfter you create\
    \ the field definitions, you need to create the empty dataset in memory. To do\
    \ this, call TClientDataSet.CreateDataSet, like this:\n\n```\nClientDataSet1.CreateDataSet;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 116
  md: "As you can see, it’s somewhat easier to create your client datasets at design-time\
    \ than it is at runtime. However, if you commonly create temporary in-memory datasets,\
    \ or if you need to create a client dataset in a formless unit, you can create\
    \ the dataset at runtime with a minimal amount of fuss.\n\n# ## Accessing Fields\n\
    \nRegardless of how you create the client dataset, at some point you need to access\
    \ field information—whether it’s for display, to calculate some values, or to\
    \ add or modify a new record.\n\nThere are several ways to access field information\
    \ in Delphi. The easiest is to use persistent fields.\n\n# ## Persistent Fields\n\
    \nEarlier in this chapter, when we used the field editor to create fields, we\
    \ were also creating persistent field objects for those fields. For example, when\
    \ we added the `LastName` field, Delphi created a persistent field object named\
    \ `cdsEmployeeLastName`.\n\nWhen you know the name of the field object, you can\
    \ easily retrieve the contents of the field by using the `AsXXX` family of methods.\
    \ For example, to access a field as a string, you would reference the `AsString`\
    \ property, like this:\n\n```\nShowMessage('The employee’s last name is ' +\n\
    \    cdsEmployeeLastName.AsString);\n```\n\nTo retrieve the employee’s salary\
    \ as a floating-point number, you would reference the `AsFloat` property:\n\n\
    ```\nBonus := cdsEmployeeSalary.AsFloat * 0.05;\n```\n\nSee the VCL/CLX source\
    \ code and the Delphi documentation for a list of available access properties.\n\
    \n![](img/52a35759a0f10dade27a840504be5d82_116_0.png)\n\nYou are not limited to\
    \ accessing a field value in its native format. For example, just because `Salary`\
    \ is a currency field doesn’t mean you can’t attempt to access it as a string.\
    \ The following code displays an employee’s salary as a formatted currency:\n\n\
    ```\nShowMessage('Your salary is ' + cdsEmployeeSalary.AsString);\n```\n\nYou\
    \ could access a string field as an integer, for example, if you knew that the\
    \ field contained an integer value. However, if you try to access a field as an\
    \ integer (or other data type) and the field doesn’t contain a value that’s compatible\
    \ with that data type, Delphi raises an exception."
  merge: -1
  img_proc: true
- pgno: 117
  md: "# Nonpersistent Fields\n\nIf you create a dataset at design-time, you probably\
    \ won’t have any persistent field objects. In that case, there are a few methods\
    \ you can use to access a field’s value.\n\nThe first is the `FieldByName` method.\
    \ `FieldByName` takes the field name as a parameter and returns a temporary field\
    \ object. The following code snippet displays an employee’s last name using `FieldByName`.\n\
    \n```\n```pascal\nShowMessage(‘The employee’s last name is ’ +\n  ClientDataSet1.FieldByName(‘LastName’).AsString);\n\
    ```\n```\n\n> If you call `FieldByName` with a nonexistent field name, Delphi\
    \ raises an exception.\n\nAnother way to access the fields in a dataset is through\
    \ the `FindField` method, like this:\n\n```\n```pascal\nif ClientDataSet1.FindField(‘LastName’)\
    \ <> nil then\n  ShowMessage(‘Dataset contains a LastName field’);\n```\n```\n\
    \nUsing this technique, you can create persistent fields for datasets created\
    \ at runtime.\n\n```\n```pascal\nvar\n  fldLastName: TField;\n  fldFirstName:\
    \ TField;\nbegin\n  ...\n  fldLastName := cds.FindField(‘LastName’);\n  fldFirstName\
    \ := cds.FindField(‘FirstName’);\n  ...\n  ShowMessage(’The last name is ’ + fldLastName.AsString);\n\
    end;\n```\n```\n\nFinally, you can access the dataset’s `Fields` property. `Fields`\
    \ contains a list of `TField` objects for the dataset, as the following code illustrates:\n\
    \n```\n```pascal\nvar\n  Index: Integer;\nbegin\n  for Index := 0 to ClientDataSet1.Fields.Count\
    \ - 1 do\n    ShowMessage(ClientDataSet1.Fields[Index].AsString);\nend;\n```\n\
    ```\n\nYou do not normally access `Fields` directly. It is generally not safe\
    \ programming practice to assume, for example, that a given field is the first\
    \ field in the `Fields` list. However, there are"
  merge: -1
  img_proc: true
- pgno: 118
  md: "times when the `Fields` list comes in handy. For example, if you have two client\
    \ datasets with the same structure, you could add a record from one dataset to\
    \ the other using the following code:\n\n```\nvar\n  Index: Integer;\nbegin\n\
    \  ClientDataSet2.Append;\n  for Index := 0 to ClientDataSet1.Fields.Count - 1\
    \ do\n    ClientDataSet2.Fields[Index].AsVariant :=\n      ClientDataSet1.Fields[Index].AsVariant;\n\
    \  ClientDataSet2.Post;\nend;\n```\n\nThe following section discusses adding records\
    \ to a dataset in detail.\n\n# # Populating and Manipulating Client Datasets\n\
    \nAfter you create a client dataset (either at design-time or at runtime), you\
    \ want to populate it with data. There are several ways to populate a client dataset:\
    \ You can populate it manually through code, you can load the dataset's records\
    \ from another dataset, or you can load the dataset from a file or a stream. The\
    \ following sections discuss these methods, as well as how to modify and delete\
    \ records.\n\n# ## Populating Manually\n\nThe most basic way to enter data into\
    \ a client dataset is through the `Append` and `Insert` methods, which are supported\
    \ by all datasets. The difference between them is that `Append` adds the new record\
    \ at the end of the dataset, but `Insert` places the new record immediately before\
    \ the current record.\n\nI always use `Append` to insert new records because it's\
    \ slightly faster than `Insert`. If the dataset is indexed, the new record is\
    \ automatically sorted in the correct order anyway.\n\nThe following code snippet\
    \ shows how to add a record to a client dataset:\n\n```\ncdsEmployee.Append; \
    \ // You could use cdsEmployee.Insert; here as well\ncdsEmployee.FieldByName('ID').AsInteger\
    \ := 5;\ncdsEmployee.FieldByName('FirstName').AsString := 'Eric';\ncdsEmployee.Post;\n\
    ```\n\n# ## Modifying Records\n\nModifying an existing record is almost identical\
    \ to adding a new record. Rather than calling `Append` or `Insert` to create the\
    \ new record, you call `Edit` to put the dataset into edit mode. The following\
    \ code changes the first name of the current record to Fred."
  merge: -1
  img_proc: true
- pgno: 119
  md: "```\ncdeEmployee.Edit; // Edit the current record\ncdeEmployee.FirstName('FirstName')AsString\
    \ := 'Fred';\ncdeEmployee.Post;\n```\n\n# Deleting Records\n\nTo delete the current\
    \ record, simply call the **Delete** method, like this:\n\n```\ncdeEmployee.Delete;\n\
    ```\n\nIf you want to delete all records in the dataset, you can use **EmptyDataSet**\
    \ instead, like this:\n\n```\ncdeEmployee.EmptyDataSet;\n```\n\n# Populating from\
    \ Another Dataset\n\ndbExpress datasets are unidirectional and you can't scroll\
    \ backward through them. This makes them incompatible with bidirectional, data-aware\
    \ controls such as **TDBGrid**. However, **TC1ientDataSet** can load its data\
    \ from another dataset (including dbExpress datasets, BDE datasets, or other client\
    \ datasets) through a *provider*. Using this feature, you can load a client dataset\
    \ from a unidirectional dbExpress dataset, and then connect a **TDBGrid** to the\
    \ client dataset, providing bidirectional support.\n\nIndeed, this capability\
    \ is so powerful and important that it forms the basis for Delphi's multitier\
    \ database support.\n\n# Populating from a File or Stream: Persisting Client Datasets\n\
    \nThough client datasets are located in RAM, you can save them to a file or a\
    \ stream and reload them at a later point in time, making them persistent. This\
    \ is the third method of populating a client dataset.\n\nTo save the dataset to\
    \ a file, use the **SaveToFile** method, which is defined like this:\n\n```\n\
    procedure SaveToFile(const FileName: string = '';\n    Format: TDataPacketFormat\
    \ = dfBinary);\n```\n\nSimilarly, to save the dataset to a stream, you can call\
    \ **SaveToStream**, which is defined as follows:\n\n```\nprocedure SaveToStream(Stream:\
    \ TStream; Format: TDataPacketFormat = dfBinary);\n```\n\n**SaveToFile** accepts\
    \ the name of the file that you're saving to. If the filename is blank, the data\
    \ is saved using the **FileName** property of the client dataset.\n\nBoth **SaveToFile**\
    \ and **SaveToStream** take a parameter that indicates the format to use when\
    \ saving data. Client datasets can be stored in one of three file formats: binary,\
    \ or either flavor of XML. Table 3.1 lists the possible formats."
  merge: -1
  img_proc: true
- pgno: 120
  md: "# TABLE 3.1 Data Packet Formats for Loading and Saving Client Datasets\n\n\
    | Value | Description |\n|---|---|\n| dfBinary | Data is stored using a proprietary,\
    \ binary format. |\n| dfXML | Data is stored in XML format. Extended characters\
    \ are represented using an escape sequence. |\n| dfXMLUTF8 | Data is stored in\
    \ XML format. Extended characters are represented using UTF8. |\n\nWhen client\
    \ datasets are stored to disk, they are referred to as *MyBase* files. MyBase\
    \ stores one dataset per file, or per stream, unless you use *nested* datasets.\n\
    \n> > If you're familiar with Microsoft ADO, you recall that ADO enables you to\
    \ persist datasets using XML format. The XML formats used by ADO and MyBase are\
    \ not compatible. In other words, you cannot save an ADO dataset to disk in XML\
    \ format, and then read it into a client dataset (or vice versa).\n\nSometimes,\
    \ you need to determine how many bytes are required to store the data contained\
    \ in the client dataset. For example, you might want to check to see if there\
    \ is enough room on a floppy disk before saving the data there, or you might need\
    \ to preallocate the memory for a stream. In these cases, you can check the *DataSize*\
    \ property, like this:\n\n```\nif ClientDataSet1.DataSize > AvailableSpace then\n\
    \    ShowMessage('Not enough room to store the data');\n```\n\nDataSize always\
    \ returns the amount of space necessary to store the data in binary format (dfBinary).\
    \ XML format usually requires more space, perhaps twice as much (or even more).\n\
    \n> > One way to determine the amount of space that's required to save the dataset\
    \ in XML format is to save the dataset to a memory stream, and then obtain the\
    \ size of the resulting stream."
  merge: -1
  img_proc: true
