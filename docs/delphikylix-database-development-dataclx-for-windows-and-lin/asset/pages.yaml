- pgno: 270
  md: '# Solutions to Common Grid Questions


    In this section, I’ll attempt to answer a number of commonly asked questions about
    the TDBgrid component. The solutions to these problems are not overly difficult,
    but in most cases they involve more than simply calling a method or setting a
    property.


    # Determining the Current Row or Column


    Sometimes you might need to determine what row, column, or cell is currently focused.
    Depending on the information that you need, there are several ways to go about
    this.


    If all you need to know is what row has the focus, the easiest thing to do is
    to check the underlying dataset. The dataset’s current record is the one that
    has focus. So, if you want to get the value of the current Salary column, you
    can do the following:


    ```

    var

    CurrentSalary: Double;

    begin

    CurrentSalary := TDBgrid.DataSource.DataSet.FieldName(''Salary'').AsFloat;

    ...

    end;

    ```


    To get the index of the focused column, you can access the grid’s *SelectedIndex*
    property. *SelectedIndex* is a zero-based number indicating the absolute position
    of the selected column. *SelectedIndex* adjusts for the indicator, so if the indicator
    is present, the first data column is index 1. If the indicator is not displayed,
    the first data column is index 0.


    To retrieve the field object for the current column, you can reference the grid’s
    *SelectedField* property. *SelectedField* returns the underlying dataset’s TField
    object, so you can directly access it to retrieve the value of the current cell.


    ```

    ShowMessage(''The current cell value is '' + DBgrid.SelectedField.AsString);

    ```


    > **NOTE**

    > If the current column is not connected to a dataset field, *SelectedIndex* returns
    -1 and *SelectedField* returns nil. If you display any columns in your grid that
    are not tied to a field, you should always check for -1 or nil before attempting
    to do something with the *SelectedIndex* or *SelectedField* properties.


    # Getting the Cell at a Given Mouse Coordinate


    With a little effort, you can determine the row and column of the cell at any
    mouse position. Normally, you don’t need to do this because you can use the dataset’s
    current record and the grid’s *SelectedIndex* or *SelectedField* properties to
    determine the current cell. However, you might want to know about a cell that
    isn’t current.'
  merge: -1
  img_proc: true
- pgno: 271
  md: "For example, say that you want to write an event handler that tracks the current\
    \ position of the mouse and provides information about the field at that location.\
    \ A more ambitious project might be to write code that displays a tooltip when\
    \ the mouse hovers over a cell whose contents are too long to be fully displayed\
    \ in the cell.\n\nIn either case, you can call the grid’s `MouseCoord` method\
    \ passing in the X and Y coordinates of the mouse relative to the grid control.\
    \ `MouseCoord` passes back a `TGridCoord` structure, which contains X and Y fields\
    \ representing the absolute column and row indexes of the cell at that mouse position.\n\
    \n`TGridCoord`’s X and Y values deserve a little explanation. These are absolute\
    \ indexes, meaning that they take the indicator column and title rows into account.\
    \ If the indicator is displayed, the X position of the first data column is 1.\
    \ If the indicator is not displayed, it is 0. This is also true for the rows:\
    \ If the grid titles are not displayed (`dgTitles` is not set in the grid’s `Options`\
    \ property), the Y position of the first row of data is 0. If titles are displayed,\
    \ it is 1.\n\nIf the mouse position is not over a cell (for instance, the mouse\
    \ is over the background area of the grid), the returned `TGridCoord`’s X and\
    \ Y values are both −1.\n\nThe following code snippet shows how you might update\
    \ a label to show the X and Y positions, as well as the field name, of the cell\
    \ at the current mouse position.\n\n```\nprocedure TForm1.DBGrid1MouseMove(Sender:\
    \ TObjеct; Shift: TShiftState; X, Y: Integer);\nvar\n  GC: TGridCoord;\n  IndicatorOffset:\
    \ Integer;\n  TitleOffset: Integer;\nbegin\n  GC := DBGrid1.MouseCoord(X, Y);\n\
    \  if GC.X = -1 then\n    Label1.Caption := IntToStr(GC.X) + ', ' + IntToStr(GC.Y)\n\
    \  else begin\n    if dgIndicator in DBGrid1.Options then\n      IndicatorOffset\
    \ := 1\n    else\n      IndicatorOffset := 0;\n\n    if dgTitles in DBGrid1.Options\
    \ then\n      TitleOffset := 1\n    else\n      TitleOffset := 0;\n\n    if GC.X\
    \ < IndicatorOffset then\n      Label1.Caption := IntToStr(GC.X) + ', ' + IntToStr(GC.Y)\
    \ +\n```"
