    ```pascal

    ClientDataSet.First;

    ClientDataSet.Next;

    ClientDataSet.Edit;

    ClientDataSet.FieldName(''Last'').AsString := ''Williams''; // Change 1

    ClientDataSet.Post;


    ClientDataSet.First;

    ClientDataSet.Edit;

    ClientDataSet.FieldName(''Last'').AsString := ''Carter''; // Change 2

    ClientDataSet.Post;


    Baseline := ClientDataSet.SavePoint; // 2 changes on the "stack"


    ClientDataSet.Next;

    ClientDataSet.Edit;

    ClientDataSet.FieldName(''First'').AsString := ''Sam''; // Change 3

    ClientDataSet.Post;


    ClientDataSet.UndoLastChange(True); // 2 changes on the "stack"

    ClientDataSet.UndoLastChange(True); // 1 change on the "stack"

    ClientDataSet.SavePoint := Baseline; // Exception is raised here

    ```

    ```


    In this code snippit, two changes are made, and then a baseline is established.
    Next, a third change is made, and then the third and second changes are undone.
    Finally, the code attempts to revert to the save point. Because the change log
    has been reversed past the point of the save point, Delphi raises an exception.'
  merge: -1
  img_proc: true
- pgno: 194
  md: "# CancelUpdates\n\nThe final level of undo support is undoing all changes in\
    \ the change log. To do this, simply call CancelUpdates, like this:\n\n```\nClientDataSet1.CancelUpdates;\n\
    ```\n\nCancelUpdates discards all changes made to all records in the dataset by\
    \ clearing the change log.\n\n# ChangeCount\n\nYou can determine how many changes\
    \ were made to the dataset by looking at the ChangeCount property:\n\n```\nif\
    \ ClientDataSet1.ChangeCount > 0 then\n    ShowMessage('It is okay to call UndoLastChange');\n\
    ```\n\n# MergeChangeLog\n\nAt some point in your application, you might want to\
    \ merge changes in with the data to commit any modifications that were made to\
    \ the dataset. To do this, call MergeChangeLog. MergeChangeLog takes no parameters.\n\
    \n![](img/52a35759a0f10dade27a840504be5d82_194_0.png)\n\n# StatusFilter\n\nThe\
    \ StatusFilter property provides for a type of filter on the dataset, but I didn't\
    \ discuss it in the \"Ranges and Filters\" section because it relates directly\
    \ to the change log.\n\nAs records are added, modified, or deleted in a client\
    \ dataset, they are tagged with a status. That status can be one (or more) of\
    \ the values shown in Table 4.4.\n\n# TABLE 4.4 TUpdateStatus Values\n\n| Value\
    \ | Description |\n| :--- | :--- |\n| usUnmodified | The record has not been modified\
    \ in any way. |\n| usInserted | The record has been newly inserted into the dataset.\
    \ |\n| usModified | The record was modified. |\n| usDeleted | The record has been\
    \ deleted. |"
  merge: -1
  img_proc: true
- pgno: 195
