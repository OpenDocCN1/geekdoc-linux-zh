    Similarly, add a 20-character FirstName field and an Integer Department field.
    Finally, let''s add a Salary field. Open the New Field dialog. In the Name edit
    control, type Salary. Set the Type to Currency and click OK. (The currency type
    instructs Delphi to automatically display it with a dollar sign.)


    If you have performed these steps correctly, the field editor looks like Figure
    3.3.


    ![](img/52a35759a0f10dade27a840504be5d82_110_1.png)


    # FIGURE 3.3


    *The field editor after adding five fields.*'
