- pgno: 353
  md: '# The Briefcase Model


    Multitier applications lend themselves to something called the briefcase model.
    When in the office, the user is presumably connected to the server and is running
    an application using live data. Before leaving the office, the user downloads
    any data that may be needed onto the user''s local machine, for use while away
    from the office. The general overview of the briefcase model is as follows:


    When in the office, the user works with live data directly from the application
    server. While on the road, the user works with a local copy of the data, making
    additions or modifications to the data as needed. Upon return to the office, the
    user reconnects to the server and reconciles all updates back to the server.


    This magic is performed using the techniques you have already learned in this
    book. When connected to the server, dataset providers provide a live copy of the
    data to the client application''s client datasets. Before the user leaves the
    office, the data is saved locally by calling `TClientDataSet.SaveToFile`.


    While on the road, the client is unable to connect to the application server;
    instead, it loads the local copy of the data by calling `TClientDataSet.LoadFromFile`.
    Changes are accumulated in the change log, which is persisted by calling `TClientDataSet.SaveToFile`
    before the user exits the application.


    When the user returns to the office, the client application again calls `TClientDataSet.LoadFromFile`
    to load the local copy of the data, but then calls `TClientDataSet.ApplyUpdates`
    to resolve any updates back to the application server.


    Note that the server application does not change in any way—only the client application
    contains code to support the briefcase model.


    Because Delphi ships with a useful briefcase demo application, I won''t duplicate
    its functionality here. Instead, I encourage you to take a look at the Delphi
    demo. For a typical Delphi installation, look at C:\Program Files\Borland\Delphi6\Demos\Midas\Briefcase.


    **Note**

    Rather than calling `LoadFromFile` and `SaveToFile` in your application, you can
    simply assign the client dataset''s `FileName` property to the name of the local
    file to save to and load from. Delphi will then take care of loading and saving
    the data at the appropriate times.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# # Stateless Servers


    In the last chapter, I showed you how you can limit the amount of data returned
    at a given time from the application server. The catch with limiting the amount
    of data returned from the server is that you must let the server know from where
    to start retrieving data each time it fetches a new data packet. Delphi database
    applications are stateless, meaning that the server-side database components don''t
    keep track of their current location in the dataset. When the provider retrieves
    data from a TSQLDataSet or other dataset component, the dataset is opened, data
    is sent to the provider, and then the dataset is closed. Because the dataset is
    accessed only for a short period of time, a single server-side dataset can service
    multiple client applications, reducing memory load and increasing performance.
    This isn''t much of an issue with a local connection, but it becomes an important
    consideration when using remote connections.


    Conceptually, incremental data fetching on a stateless server works like this:


    +   - The provider fetches a set of records, remembering the ID of the last record
    in the batch.

    +   - The provider notifies the client application of the last record.

    +   - The client remembers the last record fetched.

    +   - When the client fetches the next batch of records from the server, it notifies
    the server of the last record previously retrieved.

    +   - The server retrieves the next batch of records that occurs after the last
    record previously retrieved.


    To implement a stateless server, you need to supply event handlers for three provider
    events on the server, as well as for two client dataset events on the client.
    Let''s start with the server:


    In the application server, you need to set up the TSQLDataSet as a parameterized
    query, like this:


    ```

    SELECT * FROM CONTACTS WHERE ID > :MinID ORDER BY ID

    ```


    This will select only contacts with an ID greater than the last ID that has already
    been fetched. Now, provide an event handler for the provider''s OnGetData event.
    In this event, you''ll save the last ID retrieved from the contact table.


    ```

    procedure TStatelessServerData.pvContactsGetData(Sender: TObject;

    DataSet: TCustomClientDataSet);

    begin

    DataSet.Last;

    pvContacts.Tag := DataSet.FieldName(''ID'').AsInteger;

    end;

    ```


    ![](img/52a35759a0f10dade27a840504be5d82_354_0.png)'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'The call to DataSets.Last does not operate directly on the TSQLDataSet component.
    Instead, it moves to the last record of the batch of records that is about to
    be sent back to the client application. The ID of that last fetched record is
    then saved temporarily in the Tag property of the provider.


    Next, write an event handler for the provider’s AfterGetRecords event handler.
    In this handler, you’ll pass the last retrieved ID back to the client application
    via the OwnerData parameter.


    ```

    procedure TStatelessServerData.pvContactsAfterGetRecords(Sender: TObject;

    var OwnerData: OleVariant);

    begin

    OwnerData := pvContacts.Tag;

    end;

    ```


    Finally, on the server, you need to handle the provider’s BeforeGetRecords event
    handler. In this event, you’ll set the value of the MiniID parameter so that the
    query knows what record to fetch next. The following code snipppet shows how to
    accomplish this:


    ```

    procedure TStatelessServerData.pvContactsBeforeGetRecords(Sender: TObject;

    var OwnerData: OleVariant);

    begin

    if not VarIsEmpty(OwnerData) then begin

    sqlContacts.Params.ParamValues[''MiniID''] := OwnerData;

    sqlContacts.Refresh;

    end;

    end;

    ```


    That’s all you need to do on the server. In the client application, you need to
    first provide an event handler for the client dataset’s AfterGetRecords event.
    In this event handler, you’ll save the last ID retrieved from the server, as the
    following code snipppet illustrates:


    ```

    procedure TForm1.cdsContactsAfterGetRecords(Sender: TObject;

    var OwnerData: OleVariant);

    begin

    cdsContacts.Tag := OwnerData;

    end;

    ```


    In this example, the last retrieved ID (provided in the OwnerData parameter) is
    again stored in the client dataset’s Tag property. You could also set up a form
    variable named FLastContactID to save the ID.


    Finally, provide an event handler for the client dataset’s BeforeGetRecords event.
    In this event handler, you’ll pass the last retrieved ID back to the server so
    that it knows where to start fetching data from.'
  merge: -1
  img_proc: true
- pgno: 356
  md: "```\n```pascal\nprocedure TForm1.cdsContactsBeforeGetRecords(Sender: TObject);\n\
    var\n  OwnerData: OleVariant;\nbegin\n  if cdsContacts.Active then\n    OwnerData\
    \ := cdsContacts.Tag;\nend;\n```\n```\n\nThe Stateless application example incorporates\
    \ these concepts into a stateless server and client. Because most of the source\
    \ code was listed previously in the form of code snippets, I won’t show it again\
    \ here.\n\n# # Sharing a Connection Between Multiple Client DataSets\n\nSome real-world\
    \ applications allow the user to choose between connection protocols; for example,\
    \ the user may opt for a socket connection, a DCOM connection, or an HTTP connection.\
    \ In this way, the client application lets the user make the decision as to which\
    \ connection type is most appropriate for a particular situation.\n\nTo provide\
    \ support for multiple connection types, you need to place multiple connection\
    \ components on the client’s data module. For example, you may drop a TSocketConnection,\
    \ a TDCOMConnection, and a TWebConnection component on the data module. Switching\
    \ from one connection to another means that you need to set the RemoteServer property\
    \ for each TClientDataSet component to the correct connection at runtime.\n\n\
    In small sample applications, this isn’t a big problem, because most examples\
    \ use only one or two client datasets. However, most real-world applications contain\
    \ many more than that. For example, I am currently working on an application that\
    \ utilizes more than 50 TClientDataSet components in the client application.\n\
    \nTo facilitate switching from one connection component to another, Delphi provides\
    \ a TConnectionBroker component. To use a TConnectionBroker, drop one on the client’s\
    \ data modules and set the ConnectionBroker property for each TClientDataSet component\
    \ to the TConnectionBroker. Then, set TConnectionBroker’s RemoteServer property\
    \ to the correct connection component. Switching connections is then a trivial\
    \ matter of changing the connection broker’s RemoteServer property to the desired\
    \ connection component.\n\nIn addition to easily switching from connection to\
    \ connection, you gain another advantage by using a connection broker. If you\
    \ make calls to the application server in your code, such as the following:\n\n\
    ```\n```pascal\nSocketConnection1.AppServer.ExecuteSomeMethod;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 357
  md: 'You don’t need to change that code if the connection type changes. Instead
    of calling the method on `SocketConnection1` (or any other connection component),
    you can call it on the connection broker, like this:


    ```

    ConnectionBroker1.Connection.AppServer.ExecuteSomeMethod;

    ```


    In this way, the code works regardless of the active connection.


    # ### Brokering Connections Between Multiple Servers


    In large-scale development, a single instance of the application server may not
    be enough to handle the large number of clients connected to it. You also may
    want to run a copy of the application server on multiple server machines so that
    if one machine goes down, the client can still connect to an application server
    running on a different server machine.


    When running multiple copies of the application server, the client needs some
    way of choosing between them at runtime. If it selects a server that is down at
    the moment, it should try again with a different server.


    To incorporate connection brokering into your application, drop a `TSimpleObjectBroker`
    component onto your client’s data module. In the Servers property, enter a list
    of servers that the client application can attempt to connect to. Set the connection
    object’s `ObjectBroker` property to the name of the `TSimpleObjectBroker`.


    When the `TSimpleObjectBroker`’s `LoadBalanced` property is set to `False`, the
    client will attempt to connect to the first server in the Servers property. If
    that connection fails, it will try the second server, and so on. When `LoadBalanced`
    is `True`, the broker attempts to select a different server for each connection
    in the current client application only. If the client application contains a single
    remote connection, setting `LoadBalanced` to `True` has no effect.


    A more common scenario is to have several instances of the application server
    running and a number of clients that connect to the server. In this case, your
    best bet is to randomize the list of servers at runtime so that each client has
    the potential of connecting to a different server.


    For example, suppose that you have three servers, named Server1, Server2, and
    Server3. If there are six instances of the client application, and you randomize
    the order of the servers for each client, potentially each client’s server order
    could be the following:


    +   - Client 1: Server1, Server2, Server3

    +   - Client 2: Server1, Server3, Server2

    +   - Client 3: Server2, Server1, Server3

    +   - Client 4: Server2, Server3, Server1'
