    # ## Creating Your Own Data-Aware Components


    Creating your own data-aware components isn’t all that difficult when you understand
    the steps that you must take to provide a data-aware version of an existing standard
    control. In this section, I provide working code for a data-aware version of the
    **Win32 TDateTimePicker** component. Along the way, I’ll provide an overview of
    the steps required to create a data-aware component. While reading the following
    sections, please refer to the source code shown in Listing 5.3.


    # ### TFieldDataLink


    **TFieldDataLink** is a helper class that establishes a link between the data-aware
    component and the underlying dataset field. TFieldDataLink provides only a small
    number of methods, properties, and events that you need to concern yourself with
    when writing a data-aware component. Tables 5.9, 5.10, and 5.11 list the most
    often-used methods, properties, and events (respectively).


    | **TABLE 5.9 TFieldDataLink Methods** | |

    | :--- | :--- |

    | **Method** | **Description** |

    | Edit | Try to put the dataset into edit mode. *Edit* returns **False** if the
    dataset does not allow editing, and returns **True** otherwise. |

    | Modified | Call the *Modified* method when the data-aware component is changed;
    either because the user types into it, or because the contents of the component
    were changed in some other way (such as through a click or other interaction with
    the component). |

    | Reset | Call the *Reset* method when an action occurs that causes the contents
    of the underlying field to be reset to its original value. For example, a data-aware
    component might support a key (such as **Ctrl+R**) that resets the original value
    of the field. |


    | **TABLE 5.10 TFieldDataLink Properties** | |

    | :--- | :--- |

    | **Property** | **Description** |

    | CanModify | Read-only property that returns **True** if the corresponding field
    can be modified, and returns **False** if it cannot. *CanModify* returns **False**
    if the dataset, the field, or the data-aware component is read-only. |

    | Control | References the link data-aware control. |'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'TABLE 5.10 Continued


    | Property | Description |

    |---|---|

    | Field | References the field object to which the data-aware control is bound.
    The field object might be a persistent field, or it might be an automatically
    generated field object for a nonpersistent field. |

    | FieldName | The name of the field to which the data-aware component is bound.
    |


    TABLE 5.11 TFieldDataLink Events


    | Event | Description |

    |---|---|

    | OnDataChange | Fires when there is a change to the underlying field. |

    | OnEditingChange | Fires when the associated data source changes from an editing
    mode to a browse mode, or vice versa. |

    | OnUpdateData | Fires when the data contained in the data-aware component should
    be written out to the dataset. |

    | OnActiveChange | Fires when the underlying dataset changes from active to inactive,
    or vice versa. |


    The following sections explain how to incorporate a TFieldDataLink class into
    a component to create a data-aware version of that component. They also show the
    proper way to make use of the methods, properties, and events listed in the preceding
    tables.


    # ## Setting Up the TFieldDataLink


    The first step in creating a data-aware component is to add a private field of
    type TFieldDataLink to the component.


    Next, override the Create and Destroy constructor and destructor.


    Create is responsible for creating the TFieldDataLink object and establishing
    the connection to this component through the Control property. Notice in Listing
    5.3 that the Create method adds the csReplicateable setting to the ControlStyle
    property. This informs the component that it can be used in a TDataGrid, as discussed
    in the following chapter.


    Create also sets up event handlers for the TFieldDataLink’s OnDataChange and OnUpdateData
    events. You can also create handlers for the OnEditingChange and OnActiveChange
    events if you want or need to, but I haven’t done that here.


    Destroy simply frees the TFieldDataLink component, and then calls the inherited
    Destroy method.'
  merge: -1
  img_proc: true
- pgno: 240
  md: "Finally, you should handle the `CM_GETDATALINK` message and return a reference\
    \ to the internal `TFIeldDataLink` field. CMGetDataLink provides this service\
    \ in Listing 5.3.\n\n> **NOTE**\n> \n> If you remember from the section titled\
    \ “TDBComboBox,” we took advantage of the CM_GETDATALINK message when writing\
    \ the TETHIDComboBox and TETHListBox components. If the authors of TDBComboBox\
    \ and TDBListBox had not provided the CM_GETDATALINK message handler, we would\
    \ have no way of obtaining a reference to the component’s internal `TFIeldDataLink`.\n\
    \n# Setting Up a Connection to the Data Source\n\nThe next step that you will\
    \ take is to create properties for DataSource and DataField. These properties\
    \ simply make calls to `GetDataSource/SetDataSource` and `GetDataField/SetDataField`.\
    \ For most data-aware components, you can copy the code presented in Listing 5.3\
    \ for these methods verbatim.\n\nIn addition, you should provide an overridden\
    \ **Notification** method, which is called when a linked component is freed. In\
    \ the case of most data-aware components, we want to be notified if the user removes\
    \ the associated TDataSource component from the form or from the data module at\
    \ design time. If this occurs, the reference to the data source is no longer valid,\
    \ so we set the DataSource property to nil.\n\n# Responding to Changes in the\
    \ Dataset\n\nAt this point, you should create a `DataChange` event handler. DataChange\
    \ does the job of updating the data-aware component so that it reflects the current\
    \ state of the linked data field. In the example presented here, DataChange sets\
    \ the component’s Date property to the value of the associated field. If there\
    \ is no associated field, the component displays today’s date.\n\nNext, you should\
    \ provide an overridden implementation of the Loaded event. Loaded simply calls\
    \ the DataChange event when the component is in design mode. At runtime, DataChange\
    \ automatically gets called.\n\n# Updating the Dataset\n\nNow that the component\
    \ updates itself correctly when the underlying data changes, we need to write\
    \ the code that updates the data when the component changes. To do that, we need\
    \ to write the UpdateData event handler."
  merge: -1
  img_proc: true
- pgno: 241
  md: 'In many cases, `UpdateData` contains a single line of code, which gets the
    current value from the data-aware component and writes it to the data field (as
    Listing 5.3 shows).


    You also need to write one or more event handlers for the data-aware component
    that fires when the value of the component is changed. In many cases, this includes
    a `Change` event handler. In some cases, it requires a `Click` handler instead
    of (or in addition to) the `Change` event handler. You should be familiar with
    the component that you are working with so that you know what events might be
    fired as a result of a change to the component’s value.


    In this case, I’ve overridden `TDate`TimePicker’s `Click` and `Change` dynamic
    methods to add calls to the data link’s `Edit` and `Modified` methods. The logic
    is this: First, call `Edit` to attempt putting the underlying dataset into edit
    mode. Next, call the component’s inherited method. Finally, call `Modified` to
    let the data link know that the field was changed.


    # Message Handlers


    Typically, a data-aware component updates the dataset when focus leaves the component.
    To accomplish this, we must provide a message handler for the `CM_EXIT` message
    in the form of the `CMExit` method shown in Listing 5.3.


    The `CMExit` method attempts to update the dataset. If it fails for any reason,
    focus is set back to the component and the exception is raised again. You can
    generally copy this message handler’s code into your own data-aware components
    without modification.


    # Action Handlers


    The final two methods that you should provide in your data-aware component are
    overrides for `ExecuteAction` and `UpdateAction`. These overridden methods ensure
    that the component works correctly with the standard `DataSet` actions provided
    with Delphi. Again, you can copy the code verbatim from this component into your
    own data-aware components.


