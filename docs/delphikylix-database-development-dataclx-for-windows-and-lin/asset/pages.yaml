- pgno: 181
  md: "# NOTE\n\nIt is beyond the scope of this book to present a detailed discussion\
    \ of Delphi's streaming support. For more information on streaming, please refer\
    \ to the *Component Writer's Guide* or to the ultimate reference, the VCL/CLX\
    \ source itself. If you are fortunate enough to own a copy of Danny Thorpe's *Delphi\
    \ Component Design*, it also has an informative chapter on Delphi's streaming\
    \ mechanism.\n\n# File BLOBs\n\nAnother common use of BLOB fields is storing an\
    \ entire file inside a BLOB. For example, say that you have a large number of\
    \ PDF documents that you want to catalog and allow your users to read.\n\nBy storing\
    \ the PDF files in a BLOB field, you can fairly easily create an application that\
    \ enables the user to search for the PDF by category or keyword, and then view\
    \ the file on his computer.\n\nYou can load an external file into a BLOB field\
    \ by using the field’s `LoadFromFile` method, as the following code snippet shows:\n\
    \n```\n```pascal\nvar\n  B: TBlobField;\nbegin\n  B := C1lientDataSet1.FieldName('AttachedFile');\n\
    \  B.LoadFromFile('C:\\\\PROPOSAL.PDF');\nend;\n```\n```\n\nIf you want to save\
    \ the file back to disk (perhaps to load it into an application such as Acrobat\
    \ Reader), you would write the following:\n\n```\n```pascal\nvar\n  B: TBlobField;\n\
    begin\n  B := C1lientDataSet1.FieldName('AttachedFile');\n  B.SaveToFile('C:\\\
    \\TEMP.PDF');\nend;\n```\n```\n\n# Limitations of BLOB Fields\n\nFor all their\
    \ usefulness, BLOBs do have a couple of limitations. Namely:\n\n+   * You can’t\
    \ (currently) perform a filter on a BLOB field. New versions of relational databases,\
    \ such as Informix, support searching on BLOBs. Once this functionality is added\
    \ to the core dbExpress technology, `TC1lientDataSet` might very well be updated\
    \ to support it also."
  merge: -1
