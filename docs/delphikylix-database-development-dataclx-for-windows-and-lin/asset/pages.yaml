- pgno: 327
  md: '![](img/52a35759a0f10dade27a840504be5d82_327_0.png)


    # FIGURE 7.5


    *DataFetch main form showing relationships between components.*


    Two dbExpress datasets—sqlContacts and sqlTodos—are linked in a master/detail
    relationship. A TDataSetProvider is connected to the sqlContacts (master) dataset.
    Remember that a provider is not needed for the detail dataset. This constitutes
    the server side of the equation.


    Next, two client datasets—cdsContacts and cdsTodos—represent the tables on the
    client side. cdsTodos is a nested dataset inside the cdsContacts dataset.


    The FormCreate method opens the cdsContacts client dataset. This causes a chaining
    effect that opens the sqlContacts dbExpress dataset and sends the results back
    to the client through the pvContacts provider.


    Two buttons on the form, labeled Fetch Details and Fetch Blobs, call the btnFetchDetailsClick
    and btnFetchBlobsClick events, respectively. These two events, in turn, call the
    client dataset’s FetchDetails and FetchBlobs methods. They then call the ShowTodoCount
    method, which we’ll examine shortly.


    cdsContactsAfterScroll is fired whenever the current record changes on the cdsContacts
    dataset. It also makes a call to ShowTodoCount.


    cdsContactsApplyUpdates is a method that is connected to cdsContacts’ AfterDelete
    and AfterPost events. What it does is ensure that whenever a record is posted
    to the cdsContacts dataset, it is automatically resolved back to the underlying
    database. This eliminates the need to place an Apply Updates button in the sample
    application.


    ShowTodoCount is a method that checks the current contact record to see if BLOBs
    and/or details have been fetched for it. To check the status of BLOBs, it attempts
    to create a BLOB stream on the NOTES field. The call to CreateBlobStream will
    raise an exception if BLOBs have not been fetched, and the program updates a label
    on the main form accordingly.'
  merge: -1
  img_proc: true
