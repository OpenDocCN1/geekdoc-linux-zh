- pgno: 235
  md: '# ## VCL-Only Data-Aware Controls


    VCL supports a few additional data-aware controls that are not supported under
    CLX. These include


    +   - TDBRichEdit

    +   - TDBChart

    +   - TDBCtrl1Grid


    These components are not included with CLX because they rely on one of the following:
    underlying Win32 implementations (TDBRichEdit), not-yet-available third-party
    components (TDBChart), or unsupported/obsolete functionality (TDBCtrl1Grid).


    Nevertheless, these components have use in VCL applications, so I’ll mention TDBRichEdit
    in this chapter and TDBCtrl1Grid in the next. Because date entry is something
    that many applications require, I’ll present a data-aware implementation of the
    Win32 TDateTimePicker component later in this chapter.


    TDBRichEdit is similar to TDBMemo because it is used to display and edit multiline
    text. However, TDBMemo displays and edits unformatted text, while TDBRichEdit
    works with rich text (text formatted using RTF, or rich text format).


    Rich text enables the user to format paragraphs, words, or individual characters
    using different font styles and formatting techniques—such as bullets, numbering,
    tabs, and indentation. Although TDBRichEdit and its non-data-aware counterpart,
    TRichEdit, support this functionality through a wide array of properties and methods,
    it is up to you to provide the user with a menu, a toolbar, or both to call the
    appropriate methods.


    Without writing any code whatsoever, TDBRichEdit can still be used to display
    formatted text.


    # ## Lookup Data-Aware Controls


    The preceding section discussed simple data-aware components that connect to a
    single field in a single dataset. In this section, I’ll introduce lookup components.
    Lookup components store data to a single field in a dataset, but display a list
    of available data from another dataset.


    For example, let’s assume that we’re dealing with a standard order-entry system
    containing an ORDERDETAIL table and a PARTS table. The PARTS table consists of
    a PartNumber field and a Description field (among others). The ORDERDETAIL table
    also contains a PartNumber field, which references the PARTS table.


    In your application, you might want the user to be able to view a list of part
    numbers and their descriptions, select a part, and have the corresponding part
    number automatically stored in the ORDERDETAIL table.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'This is what the lookup data-aware controls are designed for—displaying a list
    from one dataset and enabling the user to select an item to be stored in another
    dataset.


    To complete the link to the lookup dataset, lookup data-aware components provide
    four additional properties: ListSource, ListField, KeyField, and ListFieldIndex.


    +   - ListSource references the data source of the dataset from which to retrieve
    the list of values.


    +   - ListField is a semicolon-delimited list of field names that are to be displayed
    in the component.


    +   - KeyField determines the field whose value is to be stored in the dataset.


    +   - ListFieldIndex is a zero-based number that determines the field to be used
    for incremental searching in the component. For example, say that you set the
    ListField property to FirstName; LastName. This instructs the component to display
    the first name and the last name in the list. If you set ListFieldIndex to 1,
    as the user types set in the control, it performs automatic incremental searching
    on the LastName field.


    Lookup data-aware components consist of TDBLookupComboBox and TDBLookupListBox.
    These components look and act like TDBComboBox and TDBListBox (respectively),
    except that rather than populating the items manually, TDBLookupComboBox and TDBLookupListBox
    retrieve their items from the dataset referenced through the component''s ListSource
    property.


    ![](img/52a35759a0f10dade27a840504be5d82_236_0.png)


    > You can duplicate the functionality of the TETHDBComboBox and TETHDBListBox
    components by using TDBLookupComboBox and TDBLookupListBox. To do this, create
    a TCClientDataSet that contains the Items and Values associations that are set
    in the TETHDBComboBox or in the TETHDBListBox. If you only have a single occurrence
    of this in your application, you might elect to go this route. However, if you
    have numerous occurrences, your form becomes littered with lookup datasets and
    you might find it easier to use TETHDBComboBox and TETHDBListBox instead.


    # # TDBNavigator


    The remaining components discussed in this chapter are used for displaying and
    editing data, but TDBNavigator provides a code-free means of navigating and manipulating
    a dataset. Visually, TDBNavigator looks like a toolbar because it contains a horizontal
    array of predefined buttons (actually, TSpeedButtons), which are listed in Table
    5.8.'
  merge: -1
  img_proc: true
- pgno: 237
  md: "**TABLE 5.8** TDBNavigator Buttons\n\n| Button | Dataset Method |\n| :--- |\
    \ :--- |\n| | First |\n| | Prior |\n| | Next |\n| | Last |\n| | Insert |\n| |\
    \ Delete |\n| | Edit |\n| | Post |\n| | Cancel |\n| | Refresh (discussed in Chapter\
    \ 7, “Dataset Providers”) |\n\nWhen the user clicks one of the buttons in the\
    \ TDBNavigator, VCL/CLX calls the corresponding dataset method automatically.\
    \ You can control which buttons are displayed through the VisibleButtons property,\
    \ which is implemented as a Pascal set: Simply remove the buttons that you don't\
    \ want shown from the VisibleButtons property.\n\nIt is possible to change the\
    \ image that appears on one or more of the buttons, although the method for doing\
    \ this isn't well documented. TDBNavigator encapsulates a number of TSpeedButtons\
    \ to display the individual images, so you can access an individual speed button\
    \ through the controls array (as the following code snippet illustrates):\n\n\
    ```\n(DBNavigator1.Controls[0 as TSpeedButton).Glyph.LoadFromFile('C:\\First.bmp');\n\
    ```\n\nThe index into the Controls array is a number between zero and nine, which\
    \ refers to the absolute position of the button within the navigator's button\
    \ array. However, a more fail-safe method of accessing the button involves using\
    \ the TNavigateBtn enumerated type, which is defined in DBCtrls.pas like this:\n\
    \n```\nTNavigateBtn = (nbFirst, nbPrior, nbNext, nbLast,\n                  nbInsert,\
    \ nbDelete, nbEdit, nbPost, nbCancel, nbRefresh);\n```"
  merge: -1
