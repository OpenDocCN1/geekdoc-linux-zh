- pgno: 21
  md: 'In this chapter, I’ll show you how to connect to and disconnect from a database
    using dbExpress, as well as how to manage the connection after you’ve established
    it.


    # Connecting to and Disconnecting from a Database


    Before you can perform any operation on a database, you must connect to it. Connecting
    to a database ensures that the database is physically accessible from your location
    and that you have the necessary rights to connect.


    Just because you have the rights to connect to a database doesn’t mean you have
    the right to actually do anything with the database. You might be prevented from
    creating new tables, modifying data, or even viewing existing data.


    To connect to a database using dbExpress, you use the TSQLConnection component.
    TSQLConnection publishes a short list of properties that you can use to specify
    connection parameters and attributes. These properties are listed in Table 1.1.


    TABLE 1.1 TSQLConnection Properties

    | Property | Description |

    | --- | --- |

    | Connected | A Boolean property that you can set to True to try connecting to
    a database, or set to False to disconnect. |

    | ConnectionName | Used to establish a named connection. Setting ConnectionName
    automatically sets DriverName, GetDriverFunc, LibraryName, Params, and VendorLib.
    See the section titled “Named Connections” for more information on setting up
    a named connection. |

    | DriverName | Indicates the type of database you are connecting to, such as InterBase,
    Oracle, and so on. |

    | GetDriverFunc | Specifies the name of the function exported by the dbExpress
    driver that provides access to the driver. |

    | KeepConnection | When True, keeps the connection to the database, even when
    there are no active datasets for the connection. When False, drops the connection
    as soon as all active datasets are closed. |

    | LibraryName | Specifies the name of the dbExpress database driver, such as dbexptint.dll.
    |'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Establishing and Using Database Connections


    **TABLE 1.1  Continued**


    | Property | Description |

    | :--- | :--- |

    | userAuthentication | When True, DBExpress reads the DriverName, SetDriverFunc,
    LibraryName, Params, and VendorLib from the dbconnections.ini configuration file
    at runtime. When False, all properties must be set at design time. |

    | userPrompts | When True, DBExpress prompts the user for username and password
    information when connecting to the database. When False, the application must
    supply username and password information directly, through the Params property.
    |

    | Params | Enables you to set database-specific parameters at design time or at
    runtime. See the section “Setting Database Parameters” for more information. |

    | GetTableScope | Specifies the types of information returned by GetTableServes.
    This property is discussed in more detail in the section “Retrieving Database
    Metadata.” |

    | vendorLib | Returns the database vendor client library used for connecting to
    the database server. For example, InterBase supplies the gd32.dll client-side
    library. |


    # Establishing the Connection


    To connect to a database, set the appropriate connection properties and issue
    one of the following two statements:


    ```

    SQLConnection1.Connected := True;

    ```


    or


    ```

    SQLConnection1.Open;

    ```


    Both of these statements do the same thing, and it is up to you to decide whether
    you prefer to set a property or call a method to connect to the database.


    The properties you set depend on whether you elect to use a named connection or
    an unnamed connection. Both connection types are discussed in the following two
    sections.


    # Named Connections


    Named connections refer to the fact that you set the properties for a connection
    in the file dbconnections.ini, and give the properties a name. For example, the
    following example illustrates how you might set up a named connection for an accounting
    package:'
  merge: -1
  img_proc: true
- pgno: 23
  md: '```

    [Accounting]

    BlobSize=-1

    CommitRetain=False

    Database=D:\InterbaseData\Accounting.gdb

    DriverName=Interbase

    LocaleCode=@

    Password=masterkey

    RoleName=Admin

    ServerCharSet=ASCII

    SQLDialect=1

    Interbase TransIsolation=ReadCommitted

    User_Name=sysdba

    WaitOnLocks=True

    ```


    There are actually two places that you can establish a named connection: on your
    development machine, or on the end user''s machine. To create a named connection
    on your development machine, drop a `TSQLConnection` component onto a form or
    data module. Either double-click the component, or right-click the component and
    select `Edit Connection Properties` from the pop-up menu. The dbExpress Connection
    Editor, shown in Figure 1.1, appears.


    ![](img/52a35759a0f10dade27a840504be5d82_23_0.png)


    **Figure 1.1**

    The Connection Editor helps you to easily create named connections.


    On the left side of the Connection Editor, you see a `Driver Name` combo box and
    a `Connection Name` list box. By default, the list box shows all existing named
    connections on your development machine. If you only want to see named connections
    for InterBase, Oracle, or another database server, select the appropriate server
    from the `Driver Name` combo box.


    Click a connection name in the list box to view the settings for that named connection,
    or click the `Add` Connection button (which looks like a plus sign) on the toolbar
    to create a new named connection.'
  merge: -1
  img_proc: true
- pgno: 24
  md: "The dbExpress Connection Editor displays the settings for the selected, named\
    \ connection on the right side in the Connection Settings section. You should\
    \ set the appropriate settings for your database engine. For example, with an\
    \ InterBase connection, you want to at least set the Database setting. You might\
    \ also want to enter values for RoleName, SQLDialect, and User_Name.\n\nFor an\
    \ Oracle connection, you probably want to set the Database, and you might also\
    \ want to set values for User_Name.\n\n> **CAUTION**\n> \n> Although you can set\
    \ the Password in a named connection, I would generally advise you not to. If\
    \ you're working with a production database, anyone could open the Connection\
    \ Editor (or simply view dbxconnections.ini) on your computer to determine the\
    \ password for a given database. For this reason, you usually want to provide\
    \ the database password at runtime.\n\nIf you want end users to be able to create\
    \ their own named connections, you should redistribute dbxconnections.ini along\
    \ with your application. Your users can either edit dbxconnections manually, or\
    \ you can write and redistribute a utility program similar to the dbExpress Connection\
    \ Editor that assists your end users in creating named connections.\n\n# Unnamed\
    \ Connections\n\nNamed connections are useful in applications that support a number\
    \ of different database servers. However, many database applications are written\
    \ to work with a single database backend. For example, you might distribute an\
    \ application on CD that ships with a precreated InterBase database, such as a\
    \ parts listing or customer list. In these cases, your end users have no need\
    \ to create their own databases. They only need to access the database that you\
    \ provide on the CD.\n\nFor these situations, a named connection is unnecessary.\
    \ Instead, you set the connection properties at design time (excluding User_Name\
    \ and Password, if your application requires the user to log in at runtime).\n\
    \n# Setting Database Parameters\n\nTSQLConnection's Params property contains settings\
    \ specific to the database server you are connecting to. Several properties, listed\
    \ in Table 1.2, are common to all databases. You should refer to your database\
    \ server documentation for information on other database-specific properties."
  merge: -1
  img_proc: true
- pgno: 25
  md: 'TABLE 1.2 Common Database Parameters


    | Property | Description |

    | :--- | :--- |

    | Database | Specifies the database to connect to. For an InterBase database,
    this refers to the actual filename, such as \\SERVERID:\RemoteData.gdb. For an
    Oracle database, this refers to the entry in TNSNames.ora that uniquely identifies
    the database. |

    | Password | Password corresponds to User_Name. You usually do not want to set
    this at design time, as it bypasses database security. |

    | User_Name | The username employed while establishing the connection. You typically
    want the user to supply this information at runtime. |


    You can also access the *Params* property at runtime to set database parameters,
    like this:


    ```

    SQLConnection1.Params.Values[''Database''] := ''D:\Interbase\LocalDatabase.gdb'';

    ```


    For an InterBase connection, you can specify the database in one of three ways:
    as a local path, as a UNC path, or as a TCP path. The following are examples of
    these three constructs, respectively:


    ```

    D:\Interbase\LocalDatabase.gdb

    \\SERVERID:\Data\RemoteDatabase.gdb

    192.168.0.1:D:\Data\RemoteDatabase.gdb

    ```


    It is generally advisable to use either a UNC path or a TCP path when connecting
    to the database because InterBase has difficulties connecting to a database using
    a local path under certain conditions (such as connecting to a database from within
    a service application). You can connect to a local database with a TCP path by
    using 127.0.0.1 as the IP address, like this:


    ```

    127.0.0.1:D:\Interbase\LocalDatabase.gdb

    ```


    # Controlling Login


    As indicated previously, the connection''s *LoginPrompt* property determines whether
    VCL/DataCLX automatically prompts the user for a username and password at runtime.
    If you set *LoginPrompt* to *True*, the default connection dialog is displayed
    at runtime, as shown in Figure 1.2.


    You can override the default login dialog and provide your own means of retrieving
