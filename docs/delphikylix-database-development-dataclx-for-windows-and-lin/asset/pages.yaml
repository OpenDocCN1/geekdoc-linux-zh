    # Resolving Changes to Data


    If you''ll recall from Chapter 4, client datasets store changes to data in a change
    log rather than applying changes to the underlying data immediately. Because of
    that, when you changed the grid''s data in the preceding section, those changes
    didn''t get reflected in the underlying database.


    # Applying Updates


    To save changes to the database permanently, you need to call the client dataset''s
    ApplyUpdates method. ApplyUpdates detects that the dataset is connected to a provider
    and takes care of sending changes back through the provider to the database.'
  merge: -1
  img_proc: true
- pgno: 290
  md: "# 7\nDATASET\nPROVIDERS\n\nAdd a button to your sample application and create\
    \ an OnClick handler for it. In the OnClick handler, add the following code:\n\
    \n```\nif ClientDataSet1.ApplyUpdates(0) > 0 then\nShowMessage('Failed to update\
    \ database');\n```\n\nNow run the application again, modify some data, and click\
    \ the button. If you quit the application and rerun it, you’ll see that the changes\
    \ were indeed saved to the database.\n\nThe call to ApplyUpdates takes a single\
    \ parameter, which indicates the “tolerance level” for errors. In this case, I’ve\
    \ specified a zero-error tolerance level. What this means is that if any errors\
    \ occur during the update process, the changes are rolled back and none of the\
    \ updates are committed to the underlying database.\n\n> NOTE\n> \n> When resolving\
    \ data to a database, VCL/CLX automatically wraps the updates in a transaction,\
    \ so either all the changes are made or none of them are. You don’t need to write\
    \ any code to deal with transactions in this case.\n\nAt times, you might be willing\
    \ to tolerate one or more errors when resolving data. For instance, if the user\
    \ changes three rows in the grid, but only two of the changes can be saved successfully,\
    \ you might still want those two changes saved. If this is the case, pass the\
    \ maximum number of errors that you will allow to ApplyUpdates. If you don’t care\
    \ how many errors occur, call ApplyUpdates with a parameter of -1.\n\nAfter the\
    \ call to ApplyUpdates, any successful updates are removed from the client dataset’s\
    \ change log. If any rows could not be updated, they are left in the change log.\n\
    \nYou may be wondering why the provider might not be able to save changes to the\
    \ underlying database. The most common reason is that another user changed the\
    \ same row while you were viewing it or deleted the row before you had a chance\
    \ to save your changes. Other reasons may include a broken connection to the database\
    \ server.\n\n> NOTE\n> \n> TDataSetProvider and TClientDataSet give you control\
    \ over how to detect and respond to data clashes. Later in this chapter, I’ll\
    \ cover some of the various techniques you can use."
  merge: -1
  img_proc: true
- pgno: 291
  md: "# Resolving to a Dataset\n\nTDataSetProvider publishes a property named ResolveToDataSet.\
    \ By default it is False, indicating that the provider resolves data directly\
    \ to the database server associated with the provider’s DataSet. This is generally\
    \ the most efficient way to resolve data.\n\nIn some cases, you must set ResolveToDataSet\
    \ to True. The most common reasons are listed next:\n\n+   * The provider’s DataSet\
    \ is not connected to a database—for example, it is a TClientDataSet.\n+   * The\
    \ provider’s DataSet does not provide the necessary implementation of the IProviderSupport\
    \ interface.\n\nIn these cases, updates will be applied to the dataset referenced\
    \ by the provider’s DataSet property. You can then handle the provider’s AfterApplyUpdates\
    \ method to make those changes persistent (in the case of a TClientDataSet, you\
    \ could call the dataset’s SaveToFile method, for example). AfterApplyUpdates,\
    \ as well as other provider events, are discussed in the section titled “Provider\
    \ Events,” later in this chapter.\n\n# Reconciliation Errors\n\nBy default, if\
    \ one or more errors occur during reconciliation, ApplyUpdates returns a number\
    \ greater than zero, indicating the number of errors that occurred. This is fine\
    \ if all you want to know is whether there were errors. However, it doesn’t give\
    \ you any control over how to handle reconciliation errors.\n\nFor greatest control\
    \ over reconciliation errors, you should provide an event handler for the client\
    \ dataset’s OnReconcileError event. An empty handler looks like the following:\n\
    \n```\nprocedure TfrmMain.ClientDataSetReconcileError(    \n      DataSet: TCustomClientDataSet;\
    \ E: EReconcileError;\n      UpdateKind: TUpdateKind; var Action: TReconcileAction);\n\
    Begin\nend;\n```\n\nDataSet refers to the client dataset for which the reconciliation\
    \ error occurred. E is an exception that gives more information about the error.\
    \ UpdateKind is one of the values listed in Table 7.1. You should set Action to\
    \ one of the values listed in Table 7.2, which instructs the VCL as to what action\
    \ to take for the offending record.\n\nThe OnReconcileError event is fired for\
    \ each offending record. If eight updates are resolved back to the provider and\
    \ two of them conflict with prior changes made by another user, OnReconcileError\
    \ is fired twice. Depending on the action taken for each record, the number returned\
    \ from ApplyUpdates may be 0, 1, or 2. This is explained in more detail in Table\
    \ 7.2."
  merge: -1
  img_proc: true
- pgno: 292
  md: 'The value returned from `ApplyUpdates` is also dependent on the parameter passed
    to `ApplyUpdates`. The return value will never be more than one greater than the
    value specified by the parameter. For instance, if you pass 0 to `ApplyUpdates`
    (which is typically what''s done), the return value will be either 0 or 1.


    | **T**ABLE **7.1** | | TUpdateKind Values |

    | --- | --- | --- |

    | Value | Description |

    | ukInsert | The record is a newly inserted record. |

    | ukModify | Modifications were made to an existing record. |

    | ukDelete | The record refers to a deleted record. |


    | **T**ABLE **7.2** | | TReconcileAction Values |

    | --- | --- | --- |

    | Value | Description |

    | raSkip | Don''t apply updates to this record. Leave the unapplied changes in
    the client dataset''s change log. This record will be counted in the return value
    from `ApplyUpdates`. |

    | raAbort | Abort the whole operation. No updates are made to the underlying database
    at all, and all changes are left in the client dataset''s change log. All records
    are counted in the return value from `ApplyUpdates`. |

    | raMerge | Merge the record with the record in the underlying database. This
    works only if the fields that are changed in the record don''t conflict with fields
    that were changed by someone else. This record will not be counted in the return
    value from `ApplyUpdates`. You must set the `pfInkey` flag (discussed later in
    the section titled "Update Modes") for all fields in the primary key for this
    option to be available. |

    | raCorrect | Indicates that changes were made to the current record inside the
    `OnReconcileError` event handler. VCL/CLX should try to update again with the
    new field values. |

    | raCancel | Cancel changes to this record, reverting to the original record data.
    This record will not be counted in the return value from `ApplyUpdates`. |

    | raRefresh | Cancel changes to this record and reread the record data from the
    database. This record will not be counted in the return value from `ApplyUpdates`.
    You must set the `pfInkey` flag for all fields in the primary key for this option
    to be available. |


    # 7 DATASET PROVIDERS'
  merge: -1
  img_proc: true
