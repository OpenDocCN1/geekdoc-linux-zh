    SQLStoredProc1.ParamByName( 'STATE' ).Value := 'FL';  \nSQLStoredProc1.Open;\n\
    ```\n\nAgain, if the underlying stored procedure accepts one or more parameters,\
    \ you should use the **ParamByName** method to set the parameters before executing\
    \ the query.\n\n# General-Purpose Data Access\n\nAs the preceding sections show,\
    \ there are several different components that you can use for dbExpress data access\
    \ (depending on whether you’re accessing a table, query, or stored procedure).\
    \ However, there is a single, multipurpose component that provides all the functionality\
    \ of the three separate components: **TSQLDataSet**.\n\nYou should use **TSQLDataSet**\
    \ in all new code that you write, and in my opinion, you should also use it when\
    \ converting existing applications. Borland provides the separate, special-purpose\
    \ components to more easily convert a BDE application to a dbExpress application.\
    \ However, there is very little additional work required to convert to the general-purpose\
    \ **TSQLDataSet** component.\n\nThe following code snippet shows how to use **TSQLDataSet**\
    \ to access a table:\n\n```\nSQLDataSet1.SQLConnection := conn;  \nSQLDataSet1.CommandType\
    \ := ctTable;  \nSQLDataSet1.CommandText := 'CONTACTS';  \nSQLDataSet1.IndexName\
