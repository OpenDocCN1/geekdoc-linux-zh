  md: "# LISTING 9.5 Continued\n\n```\n```\nprocedure TfrmMain.TodoDeleteExecute(Sender:\
    \ TObject);\nbegin\n  DM.cdsTodos.Delete;\nend;\n\nprocedure TfrmMain.TodoMarkDone1Execute(Sender:\
    \ TObject);\nbegin\n  DM.cdsTodos.Edit;\n  DM.cdsTodosCompleted.AsDateTime :=\
    \ Now;\n  DM.cdsTodos.Post;\nend;\n\nprocedure TfrmMain.TodoMarkDone1Update (Sender:\
    \ TObject);\nbegin\n  (Sender as TAction).Enabled := (not DM.cdsContacts.IsEmpty)\
    \ and\n                                (not DM.cdsTodos.IsEmpty) and DM.cdsTodosCompleted.IsNull;\n\
    end;\n\nend.\n```\n```\n\nThe event code shown in Listing 9.5 deserves some discussion.\
    \ I have grouped related sets of event handlers in the source code.\n\nThe form's\
    \ OnCreate event handler sets the data module's TSocketConnection.AfterConnect\
    \ and AfterDisconnect event handlers to point to the main form's DoConnectDisconnect\
    \ method. This way, when a connection is established to or broken from the application\
    \ server, the main form will learn of the connect or disconnect. DoConnectDisconnect\
    \ simply invalidates the status bar, which will then be updated to show the new\
    \ connection status.\n\nThese event handlers are assigned at runtime rather than\
    \ design time because the event handler is not located in the same unit as the\
    \ data module. Because the data module doesn't use the main form, the event handlers\
    \ can't be assigned at design time.\n\ndsContactsDataChange is fired whenever\
    \ the contact data source detects a change in the data. The event handler checks\
    \ to see if the modified field is nil (meaning the current record changed) or\
    \ if it references the IMAGE field (meaning the image for the current record changed).\
    \ If so, the code loads the current image from the dataset and displays it on\
    \ the main form.\n\nImageLoad1Execute and ImageClear1Execute fire when the user\
    \ loads a new image for the current contact or clears the contact's image, respectively.\
    \ Both event handlers put the contact dataset into edit mode and then either clear\
    \ the image or load a new image, respectively. As a result of either of these\
    \ events, dsContactsDataChange fires automatically, causing the displayed image\
    \ to update."
