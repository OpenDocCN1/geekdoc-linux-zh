    # ## Connecting to a Dataset


    In this section I''ll show you how to connect a client dataset to another dataset.
    To do so, follow

    these steps:


    +   1. Start a new application and drop a `TSQLConnection` and `TSQLDataSet` on
    the main form. Connect these components to a database, using the techniques discussed
    in Chapters 1 and 2.

    +   2. Drop a `TDataSetProvider` on the main form. Set the `DataSet` property
    to the `TSQLDataSet` component. For now, leave all other properties set to their
    default values.

    +   3. Drop a `TClientDataSet` on the main form. Set its `ProviderName` property
    to the dataset provider you created in the previous step.

    +   4. Connect a `TDataSource` component to the client dataset and hook up a `TDBGrid`
    component to the data source.

    +   5. Create an event handler for the form''s `FormCreate` event and add the
    following line of code to it:

    +      `C1ClientDataSet1.Open;`

    +   6. Run the application.


    If you set everything up correctly, you should see the data from the dbExpress
    database dis-

    played in the grid. Notice that you can scroll forward and backward through the
    data, and you'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'can make changes to the data. However, if you leave the application and run
    it again, none of your changes have been saved to the database. We''ll remedy
    that situation in the next section. For now, I just want you to see how easy it
    is to establish the relationship between a client dataset and another dataset.
    This relationship is important because dbExpress datasets don''t support editing
    or bidirectional scrolling on their own—they must be connected to a client dataset
    to provide these capabilities.


    Figure 7.1 shows the results of the preceding steps after connecting to the CONMAN
    database.


