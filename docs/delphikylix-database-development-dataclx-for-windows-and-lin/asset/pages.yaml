- pgno: 93
  md: '![](img/52a35759a0f10dade27a840504be5d82_93_0.png)


    # **FIGURE 2.4**


    Advanced displays contact data and related activities.


    `SchemaType` refers to the type of schema data to return, and must be one of the
    values listed in **Table 2.2**.


    # **TABLE 2.2 TSchemaType Values**


    | **Value** | **Schema Information Returned** |

    |---|---|

    | `stNoSchema` | No schema information. The dataset returns the results of the
    query or stored procedure rather than schema information for that object. |

    | `stTables` | Information about the tables in the database that match the object
    name and pattern. |

    | `stSysTables` | Information about the system tables in the database. |

    | `stProcedures` | Information about the stored procedures in the database. |

    | `stColumns` | Information about the columns for a single table. |

    | `stProcedureParams` | Information about the parameters for a single stored procedure.
    |

    | `stIndexes` | Information about the indexes for a single table. |


    `SchemaObjectName` specifies the name of the table or stored procedure to return
    data for. It is only used for schema types of `stColumns`, `stProcedureParams`,
    and `stIndexes`. If the schema type is `stColumns` or `stIndexes`, `SchemaObjectName`
    specifies the table to return column or index information for. If the schema type
    is `stProcedureParams`, `SchemaObjectName` specifies the name of the stored procedure
    to return parameter information for.'
  merge: -1
  img_proc: true
- pgno: 94
  md: "SchemaPattern is an SQL pattern that is used to filter the data that's returned\
    \ in the result set. For instance, to return only columns that start with the\
    \ letter A, you could pass a SchemaPattern of A% to the call to SetSchemaInfo.\
    \ If you don't want to filter the result set, set SchemaPattern to an empty string.\n\
    \nWithin SchemaPattern, use a percent sign (%) to match a string of any length\
    \ and an underscore (_) to match a single character. If you want to include a\
    \ percent sign or underscore in the pattern, double it up (%% or __).\n\nAfter\
    \ you've retrieved schema data for a database, you can use the same dataset to\
    \ run normal queries against the database by calling SetSchemaInfo with a SchemaType\
    \ of stNoSchema.\n\nListing 2.4 shows the complete source code for an example\
    \ program that can extract and display schema information for a dBExpress database.\
    \ After the listing, I'll give just a quick overview of the code because most\
    \ of it should be self-explanatory at this point.\n\nFigure 2.5 shows the Schema\
    \ program as it displays column information from the CONTACTS table in the ConMan.gdb\
    \ database.\n\n![](img/52a35759a0f10dade27a840504be5d82_94_0.png)\n\n# **FIGURE\
    \ 2.5**\n\n*The Schema application decodes and displays column information.*\n\
