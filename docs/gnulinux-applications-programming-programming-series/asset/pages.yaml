    syntax and notation borrow both from shell scripting languages and also C.


    # Awk Structure


    The higher-level structure of awk programs is conceptually very simple (see Figure
    22.1).


    ```

    awk'' BEGIN { }

    pattern { actions }

    ...

    END { }'' <filenames>

    ```


    **FIGURE 22.1** Structure of an awk program.


    The structure of an awk program can be split into three sections. The BEGIN section
    is performed before the first line is read from the input file(s), and the END
    section is performed after the last line is processed from the input file(s).
    Between the optional BEGIN and END sections are the awk pattern/action section.
    For each input file specified, each of the patterns is compared in order, and
    if a pattern matches, then its associated action is performed.


    We''ll split our discussion of awk into two sections. In the first, we''ll look
    at simple awk programs that can be specified on the command line, and then we''ll
    look at building more complex awk programs for scripting.


