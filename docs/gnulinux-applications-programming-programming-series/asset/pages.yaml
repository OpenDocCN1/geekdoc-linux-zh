    # The Message Queue API


    Let''s now dig into the message queue API and investigate each of the functions
    in more detail. For a quick review, Table 15.1 provides the API functions and
    their purposes.


    # TABLE 15.1 Message Queue API Functions and Uses


    | API Function | Uses |

    |---|---|

    | msgget | Create a new message queue

    >Get a message queue ID |

    | msgsnd | Send a message to a message queue |

    | msgrcv | Receive a message from a message queue |

    | msgrctl | Get the info about a message queue

    >Set the info for a message queue

    >Remove a message queue |


    Figure 15.1 graphically illustrates the message queue API functions and their
    relationship in the process.

    We''ll address these functions now in detail, identifying each of the uses with
    descriptive examples.'
