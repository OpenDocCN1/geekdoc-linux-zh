- img_proc: true
  md: 'The syslog is very useful for communicating information for system applications
    and daemons.


    One final topic on error reporting is that of being specific about the error being
    reported. The error message must uniquely identify the error in order for the
    user to be able to deal with it reasonably.


    # Reducing Complexity Also Reduces Potential BugsCode that of higher complexity
    potentially contains more bugs. It''s a fact of life, but one that we can use
    to help reduce defects. In some disciplines this is called refactoring, but the
    general goal is to take a complex piece of software and break it up so that it''s
    more easily understood. This act can lead to higher quality software that is more
    easily maintained.


    # Self-Protective FunctionsWriting self-protective functions can be a very useful
    debugging mechanism to ensure that your software is correct. The programming language
    Eiffel language features to provide this mechanism (known as programming-by-contract).Being
    self-protective means that when you write a function, you scrutinize the input
    to the function and, upon completion of its processing, scrutinize the output
    to ensure that what you''ve done is correct.Let''s look at an example of a simple
    function that illustrates this behavior (see Listing 26.3).


    > If an expression results in false (0), the assert function causes the application
    to fail and an error to be generated to stdout. To disable asserts within an application,
    the DEBUG symbol can be defined, which causes the assert calls to be opti-sized.


    +   Listing 26.3 Example of a Self-protective Function (on the CD-ROM at .source/ch26/selfprot.c)


    ```

    1: STATUS_T checkAntennaStatus( ANTENNA_T antenna, MODE_T *mode )

    2: {

    3:     ANTENNA_STS_T retStatus;

    4:

    5:     /* Validate the input */

    6:     assert( validAntenna( antenna ) );

    7:     assert( validMode( mode ) );

    8:

    ```'
  merge: -1
  pgno: 487
- img_proc: true
  md: '# Code Hardening 461


    ```

    9:

    10: /**************************/

    11: /* Internal checkAntennaStatus processing */

    12: /**************************/

    13:

    14:

    15: /* We may have changed modes, check it. */

    16: assert( validMode( mode ) );

    17:

    18: return retStatus;

    19: }

    ```


    In Listing 26.3 we see a function that first ensures that it''s getting good data
    (validating input) and then that it''s providing correct (checking output). We
    also could have returned errors upon finding these conditions, but for this example,
    we''re mandating proper behavior at all levels. If all functions performed this
    activity, finding the real source of bugs would be a snap.


    The use of assert isn''t restricted just to ensuring that function inputs and
    outputs are correct. It can also be used for internal consistency. Any critical
    failure that should be identified during debugging is easily handled with assert.


    > Using the assert for internal inconsistency is often the only practical way
    to find timing (race condition) bugs in threaded code.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_488_0.png)


    # Maximize Debug Output


    Too much output can disguise errors; too little and an error could be missed.
    The right balance must be found when emitting debug and error output to ensure
    that only the necessary information is presented, to avoid overloading an already
    overloaded user.


    # Memory Debugging


    There are many libraries available that support debugging dynamic memory management
    on GNU/Linux. One of the most popular is called Electric Fence, which programs
    the underlying processor''s MMU (memory management unit) to catch memory errors
    via segment faults. Electric Fence can also detect exceeding array bounds. The
    Electric Fence library is very powerful and identifies memory errors immediately.'
