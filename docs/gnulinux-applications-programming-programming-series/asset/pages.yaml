    # Locking and Unlocking Memory


    Let''s look at an additional set of functions that are very useful to high-performance
    applications. The memory-locking functions permit a process to lock some or all
    of its storage that it is never swapped out of memory. The result is greater performance
    for the application, since it never has to suffer paging penalties in a busy system,
    but this requires the proper permissions.

    The functions of interest for locking and unlocking memory are:


    ```

    #include <sys/mman.h>

    int mlock(void *addr, size_t len);

    int munlock(const void *addr, size_t len);

    int lockall(int flags);

    int munlockall(void);

    ```'
