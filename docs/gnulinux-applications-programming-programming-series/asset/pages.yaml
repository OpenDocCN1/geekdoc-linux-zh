    in a contiguous-mail address from the individual WORD parts. Once we''ve stored
    the address recognized, we free each of the string references. Recall that we
    used strdup to copy the current token. This has the effect of mallocing memory
    for the new object, and therefore, we free this resource.

    Once CLOSE_BRACE is recognized for the section (line 46 or 57), we emit the addresses
    that are (allowed or disallowed), given the context of the rule. If we''re in
    the allowed rule, then we know that these addresses are within an allow section.
    Similarly, within the disallowed rule, we emit the addresses as disallowed. After
    we emit each section, we zero the acquaint to permit additional sections to be
    recognized and stored.

