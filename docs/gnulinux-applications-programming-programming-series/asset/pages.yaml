    In this chapter, we''ll look at a number of available open source unit testing
    frameworks and how they can be used to improve the quality of our software.


    # Unit Testing


    First, let''s address what is meant by “unit” testing. For this discussion, let''s
    divide testing into two unique categories. The first is end-to-end (or system)
    tests, which test specific user-level features of the software (see Figure 24.1).


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_445_0.png)


    FIGURE 24.1 System testing (or end-to-end) perspective.


    We can also think about this as testing based upon the requirements of the software.
    In this category, we typically don''t consider how the software is constructed
    (black-box testing) but instead simply test for what the system should do. As
    illustrated in Figure 24.2, the components of our system can be further broken
    down into smaller modules called units.


    Unit testing assumes more knowledge and insight into the software to be tested.
    Unit not typically address system requirements but instead internal behavior of
    the system. Let''s say that our software system included a queue unit that was
    used for internal task communication. We could separate this queue unit from the
    rest of the system and test it in isolation with a number of different tests.
    This is a unit, since we''re addressing a unit of the system (see Figure 24.3).
    We also commonly consider how the unit was constructed and therefore test with
    this knowledge (white-box testing).'
