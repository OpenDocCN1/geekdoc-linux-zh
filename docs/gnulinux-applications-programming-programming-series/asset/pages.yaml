    to improve on the Minix operating system (which was widely used in the day) and
    thought a monolithic kernel which would be much faster than the microkernel Minix
    (While this is commonly believed to be true, operating systems such as Carnegie
    Mellon''s Mach and the commercial QNX and Neutrino microkernels provide evidence
    to the contrary [Montague03]).


