    # INTRODUCTION


    The topic of parser construction using two very well-known tools will be the focus
    of this chapter. We''ll take a quick tour of lexical analysis and grammar processing
    and then investigate the restrictive tools. We will investigate a few examples,
    including a simple firewall configuration parser. The flex (fast lexical analyzer
    generator) and bison (GNU parser generator) will be the focus of this chapter.


    # Lexical Analysis and Grammar Parsing


    Let''s begin with a short introduction to parser construction. A parser gives
    us the ability to process a file that has a known structure and grammar. Rather
    than build this parser from scratch, we can use tools to specify the parser. This
    is both faster and a less error prone approach to parser construction and is therefore
    very useful.'
