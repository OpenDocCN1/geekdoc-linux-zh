    librand.a to produce the test image file. The -L option tells gcc that libraries
    can be found in the current subdirect ( . represents the directory). Note that
    we could also provide a specific subdirect for the library, such as -L/usr/mylibs.
    The -L option identifies the library to use. Note that myrand isn''t the name
    of our library, but instead librand.a. When the -L option is used, it'
