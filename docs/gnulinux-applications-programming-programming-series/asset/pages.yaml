  md: 'gcc -pthread threadapp.c -o threadapp -lpthread


    This will link our application with the pthread library, making the pthread functions
    available for use. Note also that we specify the -pthread option, which adds support
    for multithreading to the application (such as reentrancy). The-option also ensures
    that certain global system variables (such as errno) are provided on a per-thread
    basis.


    One topic that''s important to discuss in multithreaded applications is that of
    reentrancy. Consider two threads, each of which uses the strtok function. The
    strtok function uses an internal buffer for token processing of a string. This
    internal buffer can be used by only one user at a time, which is fine in the process
    world (forked processes), but in the thread world runs into problems. If each
    thread attempts to call, then the internal buffer is corrupted, leading to undesirable
    (and unpredictable) behavior. To fix this, rather than using an internal buffer,
    a thread-supplied buffer be used instead. This is exactly what happens when the
    thread-safe version of strtok, called strtok_r. The suffix _r indicates that the
    function is thread safe.


    # SUMMARY


    Multithreaded application development is a powerful model for the development
    of high-performance software systems. GNU/Linux provides the POSIX threads API
    for a standard and portable programming model. In this chapter, we explored the
    standard thread creation, termination, and synchronization functions. This includes
    the basic synchronization using a join, but also more advanced coordination using
    mutexes and condition variables. Finally, building pthread applications were investigated,
    along with some of the pitfalls that can be encountered (such as reentrancy) and
    how to deal with them. The GNU/Linux 2.6 kernel (using NPTL) provides a closer
    POSIX implementation and more efficient IPC and kernel support, than the prior
    LinuxThreads version.


