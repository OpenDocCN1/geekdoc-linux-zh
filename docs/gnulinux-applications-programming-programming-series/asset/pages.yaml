    # listen


    Before a server socket can accept incoming client connections, it must call the
    listen function to declare its willingness. The listen function is provided by
    the following function prototype:


    ```

    int listen(int sock, int backlog);

    ```


    The sock argument represents the previously created server socket, and the backlog
    argument represents the number of outstanding client connections that may be queued.
    Within GNU/Linux, the backlog parameter (post 2.2 kernel version) represents the
    numbers of established connections waiting accept by the Application layer protocol.
    Other operating systems may treat this differently.


    # accept


    The accept call is the final call made by servers to accept incoming client connections.
    Before accept can be called, the server socket must be created, a name must be
    bound to it, and listen must be called. The accept function returns a socket descriptor
    for a client connection and is provided by the following function prototype:


    ```

    int accept(int sock, struct sockaddr *addr, int *addrLen);

    ```


    In practice, two examples of accept are commonly seen. The first represents the
    case in which we need to know who connected to us. This requires the creation
    of an address structure that will not be initialized.


    ```

