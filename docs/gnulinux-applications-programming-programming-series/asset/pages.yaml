  md: '# SUMMARY


    This chapter presented the GNU Autotools by illustrating how they can be used
    to build a simple project. The example makes little use of the advanced features
    of automate and autoconf, but it should provide a good illustration of the big-picture
    concepts needed to understand how the Autotools work. The GNU Autotools provide
    a wealth of features that are quite useful to larger software projects, and the
    effort of integrating them into your project should be expended early on. The
    downside of the tools is that they can be somewhat difficult to employ properly,
    and the documentation for them is a bit arcane. On balance, the uses of the Autools
    are well worth the effort, but expect to put a little bit of time into getting
    things working correctly. One of the best ways to learn about the more advanced
    usage of automate and autoconf is to look at the existing implementations used
    in current open source projects. The simple example presented in this chapter
    should provided the basis needed to examine and learn from the more complex use
    of the GNU Autotools found in the larger open source projects.'
