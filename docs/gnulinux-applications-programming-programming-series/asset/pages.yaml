  md: "If we didn't want to rely on the fact that 0x222 may not be unique in our system,\
    \ we could use the ftok system function which provides the means to create a new\
    \ unique key in the system. It does this by using a known file in the filesystem\
    \ and an integer number. The file in the filesystem is unique by considering its\
    \ path). Therefore, by using the unique file (and integer), it's an easy task\
    \ to create a unique key value. We'll assume for an example of the use of ftok\
    \ to create a unique key value that our file and path are defined as /home/mtj/semaphores/mysem.\n\
    \n```\nkey_t mySem;\nint sem;\n// Create a key based upon the defined path and\
    \ number\nmyKey = semget(\"/home/mtj/semaphores/mysem\", 0 );\nsem = semget(myKey,\
    \ 1, IPC_CREATE | IPC_EXCL | 0666 );\n```\n\nNote that each time ftok is called\
    \ with those parameters, the same key is generated (which is why this method works\
    \ at all!). As long as each process needs access to the semaphore knows about\
    \ the file and number, the key can be recalculated and then used to identify the\
    \ semaphore.\n\nIn the examples discussed thus far, we've created a single semaphore.\
    \ We can create an array of semaphores by simply specifying an nsems value greater\
    \ than one, such as:\n\n```\nsemrayid = semget( myKey, 10, IPC_CREATE | 0666 );\n\
    ```\n\nThe result is a semaphore array being created that consists of 10 semaphores.\
    \ The return value (semrayid) represents the entire set of semaphores. We'll look\
    \ at how individual semaphores can be addressed in the semctl and semop discussions.\n\
    \nIn our last example of semget, we'll simply use it to get the key identifier\
    \ of an existing semaphore. In this example, we specify our key value and no command:\n\
    \n```\nsemid = semget(0x222, 0, 0);\nif (semid == -1) {\n  printf(\"Semaphore\
    \ does not exist...\\n\");\n}\n```\n\nOne final note on semaphores is that, like\
    \ message queues, a set of defaults is provided to the semaphore as it's created.\
    \ The parameters that are defined are shown in Table 16.3. Later on in the discussion\
    \ of semctl, we'll demonstrate how some of the parameters can be changed."
