  md: '# Synchronization with Semaphores 263


    > It''s important to note the symmetry sembuf uses in Listings 16.2 and 16.3.
    We subtract 1 from its value. To release the semaphore, add 1 to its value. When
    the semaphore''s value is 0, it''s unavailable, forcing any process attempting
    to acquire it to block. An initial value of 1 for the semaphore defines it as
    a binary semaphore. If the semaphore value is greater than 0, it can be considered
    a counting semaphore.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_290_0.png)


    Let''s now look at a sample application of each of the functions discussed this
    far. Listing 16.4 executes of Listing 16.1 semcreate, Listing 16.2 semacq, and
    Listing 16.3 semrel.


    # Listing 16.4 Execution of the Sample Semaphore Applications


    ```

    1: #./semcreate

    2: semcreate: Created a semaphore 1376259

    3: #./semacq &

    4: [1] 12189

    5: semacq: Attempting to acquire semaphore 1376259

    6: #./semrel

    7: semrel: Releasing semaphore 1376259

    8: semrel: Semaphore released 1376259

    9: #semacq: Semaphore acquired 1376259

    10:

    11: [1]+ Done             ./semacq

    12: #

    ```


    At line 1, we create the semaphore. We emit the identifier associated with this
    semaphore, 1376259 (which is shown at line 2). Next, at line 3, we perform the
    semacq application, which acquires the semaphore. We run this in the background
    (identified by the trailing & symbol) because this application will immediately
    block as the semaphore is unavailable. At line 4, we see the creation of the new
    subprocess (where [1] represents the number of subprocesses and 12189 is its process
    ID, or pid). The semacq application prints out its message, indicating that it''s
    attempting to acquire the semaphore, but then it executes the semrel application
    (line 6). We see two messages from this application; the first at line 7 indicates
    that it is out to release the semaphore, and at line 8, we see that it was successful.
    Immediately thereafter, we see the semacq application was able to acquire the
    newly released semaphore, giving its output at line 9. Finally, at line 11, we
    see the semacq application subprocess finish. Since it is unblocked (based on
    the presence of its desired semaphore), the semacq''s main function reached its
    return, and thus the process finished.'
