- img_proc: true
  md: '# 292 GNU/Linux Application Programming


    ```

    #include <sys/ipc.h>

    #include <sys/shm.h>

    int shmget( key_t key, size_t size, int shmflag );

    ```


    The key argument specifies a system-wide identifier that uniquely identifies the
    shared memory segment. The key must be a nonzero value or the special symbol IPC_PRIVATE.
    The IPC_PRIVATE argument defines that we''re creating a private segment (one that
    has no system-name). No other processes will find this segment, but it can be
    useful to create segments that are used only within a process or process group
    (where the return key can be communicated).


    The size argument identifies the size of the shared memory segment to create.
    When we''re interested in an existing shared memory segment, we leave this argument
    as zero (as it is not used by the function in the create case). As a minimum,
    the size must be PAGE_SIZE. The size should also be evenly divisible by PAGE_SIZE,
    the segment allocated in PAGE_SIZE chunks. The maximum size is implementation
    dependent, but typically 4MB.


    The shmflag argument permits the specification of two separate parameters. These
    are a command and an optional set of access permissions. The command portion can
    take one of three forms. The first is to create a new shared memory segment, where
    the shmflag is equal to the IPC_CREATE symbol. This returns the identifier for
    a new segment or an identifier for an existing segment (if it already exists).
    If we want to create the segment and fail if the segment already exists, then
    we can use the IPC_CREATE with the IPC_EXCL symbol (second form). If (IPC_CREATE
    | IPC_EXCL) is used and the shared segment already exists, then an error is returned
    and errno is set to EEXIST. The final form simply requests an existing shared
    segment. In this case, we specify a value of zero for the command argument.


    When creating a new shared memory segment, each of the read/write access permissions
    can be used except for the execute permissions. These permissions are shown in
    Table 17.2.


    # TABLE 17.2 Shared Memory Segment Permissions for shmflag Argument


    | Symbol | Value | Meaning |

    |---|---|--|

    | S_IRUSR | 0400 | User read permission |

    | S_IWUSR | 0200 | User write permission |

    | S_IRGRP | 0040 | Group read permission |

    | S_IWGRP | 0020 | Group write permission |

    | S_IROTH | 0004 | Other read permission |

    | S_IWOTH | 0002 | Other read permission |'
