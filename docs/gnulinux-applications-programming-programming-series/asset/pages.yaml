  md: '# 332 GNU/Linux Application Programming


    # TABLE 19.1 File Descriptors for Standard I/O Descriptors


    | Descriptor | Description |

    |---|---|

    | 0 | Standard input (stdin) |

    | 1 | Standard output (stdout) |

    | 2 | Standard error (stderr) |


    For the opposite scenario, we could redirect the stdout output to the stderr descriptor
    as:


    ```

    prog 1>&2

    ```


    We could also redirect output to unique files. For example, if we wanted our stdout
    to go to out.txt and stderr to go to err.txt, we could do the following:


    ```

    prog 1>out.txt 2>err.txt

    ```


    To verify that descriptor routing is working the way you expect, the script in
    Listing 19.1 can be used to test.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_359_0.png)


    # Listing 19.1 Descriptor Routing Test Script (on CD-ROM at ./source/ch19/redirecttest.sh)


    ```

    1: #!/bin/bash

    2: echo "stdout test" >&1

    3: echo "stderr test" >&2

    ```


    Finally, consider another example that demonstrates ordering of redirection.


    ```

    prog 2>&1 1>out.txt

    ```


    In this example, we redirect stderr to stdout and then redirect stdout (not including
    stderr) to the file out.txt. This has the effect of consolidating both the stdout
    and stderr to the file out.txt.


