  md: '# Acknowledgments


    My first exposure to open source was in the summer of 1994. I had just come off
    of a project building an operating system kernel for a large geosynchronous communication
    spacecraft in the Ada language on the MIL-STD-1750A microprocessor. The Ada language
    was technically very nice, safe, and easily readable. The MIL-STD-1750A processor
    was old, even by early 1990 standards (it was a 70s instruction set architecture
    designed for military avionics), but was still very elegant in its simplicity.


    I moved on working on a research satellite to study gamma ray bursts and, on the
    side, supported the validation of a project called “1750GALS.” This project, managed
    by Oliver Kellogg, consisted of a GCC compiler, assembler, linker, and simulator
    for the Ada language, targeted to the 1750A processor family. Since I had some
    background in Ada and the 1750A and the gamma ray burst project was just ramping
    up, I loaned some time to its validation. Some months later, I saw a post in the
    comp.comps users usenet group, of which a snippet is provided here:


    > ‘1750GALS’, the MIL-STD-1750 Gcc/Assembler/Linker/Simulator, now has a European
    FTP home, and an American FTP mirror.


    [ snip]


    Kudos to Pekka Ruuska of VTT Inc. (Pekka.Ruuska@vtt.fi), and M. Tim Jones of MIT
    Space Research (mt@space.mit.edu), whose bugreports made the toolkit as usable
    as it now is. Further, Tim Jones kindly set up the U.S. FTP mirror. [1]'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# xxiv Acknowledgments


    I was automatically world famous, and my 15 minutes of fame had begun. This is
    of course an exaggeration, but my time devoted to helping this project was both
    interesting and worthwhile and introduced me to the growing world of Free Soft-ware
    (which was already 10 years old) and open source (whose name would not be coined
    for another three years).


    This book is the result not only of many months of hard work but of many decades
    of tireless work by UNIX and GNU tool developers around the world. Since an entire
    book could be written about the countless number of developers who created and
    advanced these efforts, I''ll whittle it down to four people who (in my opinion)
    made the largest contributions toward the GNU/Linux operating system:


    +   Dennis Ritchie and Ken Thompson of AT&T Bell Labs designed and built the first
    UNIX operating system (and subsequent variants) and also the C programming-language.


    +   Richard Stallman (father of GNU and the Free Software Foundation) motivated
    and brought together other free thinkers around the world to build the world-class
    GNU/Linux operating system.


    +   Linus Torvalds introduced the Linux kernel and remains the gatekeeper of the
    kernel source and a major contributor.


    I''m extremely grateful to Jim Lieb, whose wealth of UNIX knowledge and comprehensive
    review of this text improved it in innumerable ways. I''m also appreciative-for
    the hard work of Curtis Nottberg, who submitted the chapters on GNU make (Chapter
    5) and automake/autoconf (Chapter 9) and otherwise lent his GNU/Linux expertise
    whenever asked.


    > [1] “[announce] 1750GALS Now Have an FTP Home” at http://compilers.iecc.com/comparch/article/94-11-043'
