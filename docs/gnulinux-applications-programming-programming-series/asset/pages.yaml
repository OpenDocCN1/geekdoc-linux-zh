  md: '# Programming with Pipes 139


    We''ll also look at some the other functions that are applicable to pipe communication,
    specifically those that can be used to communicate using a pipe.


    > Remember that a pipe is nothing more than a pair of file descriptors, and therefore
    any functions that operate on file descriptors can be used. This includes but
    is not restricted to select, read, write, fcntl, freeopen, and


    pipe


    The pipe API function creates a new pipe, represented by an array of two file
    descriptors. The pipe function has the following prototype:


    ```

    #include <stdio.h>

    int pipe(int fd[2]);

    ```


    The pipe function returns zero on success, or -1 on failure, with errno set appropriately.
    On successful return, the fd array (which was passed by reference) is filled with
    two active file descriptors. The first element in the array is a file descriptor
    that can be read by the application, and the second element is a file descriptor
    that can be written to.


    Let''s now look at a slightly more complicated example of pipe in multiprocessing
    application. In this application (see Listing 11.2), we''ll create a pipe (line
    14) and then fork our process into a parent and a child process (line 16). At
    the child, we attempt to read from the input file descriptor of our pipe (line
    18), which suspends the process until something is available to read. When something
    is read, we terminate the string with a NULL and print out what was read. The
    parent simply writes a test string through the pipe using the write descriptor
    (array offset 1 of the pipe structure) and then waits for the child to exit using
    the wait function.


    Note that there isn''t anything spectacular about this application except for
    the fact that our child process inherited the file descriptors that were created
    by the parent (using the pipe function) and then used them to communicate with
    one another. Recall that the fork function is complete, our processes are independent
    (except that the child inherited features of the parent, such as the pipe descriptors).
    Memory is shared, so the pipe method provides us with an interest-communication
    between processes.


    +   Listing 11.2 Illustrating the Pipe Model with Two Processes (on the CD-ROM
    at) /source/ch11/pipe.c


    ```

    1: #include <stdio.h>

    2: #include <unistd.h>

    3: #include <string.h>

    4: #include <wait.h>

