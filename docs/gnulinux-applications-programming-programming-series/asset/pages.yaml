    variable can be emitted from the command line, but this value represents the number
    of seconds that the shell has been running.

    Bash provides a variety of other special variables. Some of the more important
    ones are shown in Table 20.1. These can be echoed to understand their formats.


    # Table 20.1 Useful Environment Variables


