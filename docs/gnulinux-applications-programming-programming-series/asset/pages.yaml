    In Figure 23.3, we showed the phases involved in taking an input file, breaking
    it down into tokens (via the lexical analyzer), and then passing these tokens
    to the parser to generate a parse tree. Let''s now amend this figure to illustrate
    what we''ve done here (see Figure 23.4).


