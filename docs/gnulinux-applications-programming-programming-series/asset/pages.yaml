- img_proc: true
  md: "```\nstatic char myArray[10];\\...\nint i;\nfor (i = 0 ; i < 10; i++) {\n \
    \ myArray[i] = (char)(0x30+i);\n}\nmyArray[i] = 0; // <Overrun\n```\n\n# **TABLE\
    \ 26.1** Safe Replacements for C Library Functions\n\n| Unsafe Function | Safe\
    \ Replacement | Header |\n| --- | --- | --- |\n| gets | gets | stdio.h |\n| sprintf\
    \ | snprintf | stdio.h |\n| strcat | strcat | string.h |\n| strcpy | strncpy |\
    \ string.h |\n| strcmp | strncmp | strings.h |\n| strcasecmp | strcasecmp | strings.h\
    \ |\n| vsprintf | vsnprintf | stdio.h |\n\nIn this example, we've overrun the\
    \ bounds of our array by writing to the eleventh element. Whatever object follows\
    \ this array is now corrupted. There's actually a very simple solution to this\
    \ problem, and it involves a better programming practice using symbolic constants.\
    \ In the next example, we create a constant defining the size of our array, and\
    \ then we add one more element for the trailing NULL.\n\n```\n#define ARRAY_SIZE\
    \ 10\nstatic char myArray[ARRAY_SIZE+1];\n...\nint i;\nfor (i = 0 ; i < ARRAY_SIZE;\
    \ i++) {\n  myArray[i] = (char)(0x30+i);\n}\nmyArray[ARRAY_SIZE] = 0;\n```\n\n\
    We've automatically protected our array by an extra element at the end, but also—in\
    \ good programming practice—we've used a symbol to denote the size of the array,\
    \ rather than relying on a number."
