  md: '# Chapter 17, "Shared Memory Programming"


    One of the most important process communication mechanisms available in GNU/Linux
    is shared memory. The shared memory APIs allow segments of memory to be created
    and then shared between two or more processes. This chapter details the shared
    memory APIs for creating, attaching, detaching, locking, and unlocking shared
    memory segments.


