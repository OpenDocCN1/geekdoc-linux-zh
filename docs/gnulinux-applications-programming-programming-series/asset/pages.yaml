  md: 'Once the permissions are created, we can communicate through this pipe via
    the command line. In one terminal, we attempt to read from the pipe using the
    cat command:


    ```

    $ cat cmd_pipe

    ```


    Upon typing this command, we''re suspended awaiting a writer opening the pipe.
    In another terminal, we write to the named pipe using the echo command, as:


    ```

    $ echo Hi > cmd_pipe

    ```


    When this command finishes, our reader wakes up and finishes (here''s the complete
    reader command sequence again for clarity):


    ```

    $ cat cmd_pipe

    Hi

    $

    ```


    This illustrates that named pipes can be useful not only in C applications, but
    also in scripts (or combinations).

    Named pipes can also be created with the mknod command (along with many other
    types of special files). We can create a named pipe (as mkfifo before) as


    ```

    $ mknod cmd_pipe p

    ```


    where the named pipe cmd_pipe is created in the current subdirectory (with type
    as p for named pipe).


    # SUMMARY


