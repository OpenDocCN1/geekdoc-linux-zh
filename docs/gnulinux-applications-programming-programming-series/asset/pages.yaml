  md: '# 194 GNU/Linux Application Programming


    TABLE 13.9 Values of pid Argument for kill Function

    | pid | Description |

    | 0 | Signal sent to the process defined by pid |

    | 0 | Signal sent to all processes within the process group |

    | 1 | Signal sent to all processes (except for the init process) |

    | -1 | Signal sent to all processes within the process group defined by the absolute
    value of pid |


    Some simple examples of the kill function are now explored. We can send a signal
    to ourselves using the following code snippet:


    ```

    kill(getpid(), SIGHUP);

    ```


    The process group allows us to collect a set of processes together that can be
    signaled as a group. API functions such as getpggrp (get process group) and setpggrp
    (set process group) can be used to read and set the process group identifier.
    We can send a signal to all processes within a defined process group as


    ```

    kill(0, SIGUSR1);

    ```


    or to another process group as


    ```

    pid_t group;

    ...

    kill(-group, SIGUSR1);

    ```


    We can also mimic the behavior of sending to the current process group by identifying
    the group and then passing the negative of this value to signal:


    ```

    pid_t group = getpggrp();

    ...

    kill(-group, SIGUSR1);

    ```


    Finally, we can send a signal to all processes (except for init) using the -1
    pid identifier. This of course requires that we have permission to do this.


    ```

    kill(-1, SIGUSR1);

    ```'
