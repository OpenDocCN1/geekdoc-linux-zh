    APIs that will complete our exploration of GNU/Linux application development.
    This will include the getopt function to parse command-line options, time and
    time conversion functions, physical memory mapping functions, and memory locking
    for high-performance applications.


    The C language provides the means to pass command-line arguments into a program
    as it begins execution. The main function may accept two arguments, argv and argc.
    The argc argument defines the number of arguments that were passed in, while argv
    is a character pointer array (vector), containing an element argument. For example,
    argv[0] is a character pointer to the first argument (the program name), and argv[argc-1]
    points to the last argument.'
