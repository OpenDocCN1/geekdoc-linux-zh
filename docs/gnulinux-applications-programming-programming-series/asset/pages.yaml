    # Thread Mutexes


    A mutex is a variable that permits threads to implement critical sections. These
    sections enforce exclusive access to variables by threads, which if left unprotected
    would result in data corruption. This topic is discussed in detail in Chapter
    16, “Synchronization with Semaphores."


    Let''s start by reviewing the mutex API, and then we''ll illustrate the problem
    being solved. To create a mutex, we simply declare a variable that represents
    our mutex and initialize it with a special symbolic constant. The mutex is of
    type pthread_mutex_t and demonstrated as:


    ```

    pthread_mutex_t myMutex = PTHREAD_MUTEX_INITIALIZER

    ```


    As shown here, the initialization makes this mutex a fast mutex. The mutex initializer
    can actually be one of three types, as shown in Table 14.1.


    # TABLE 14.1 Mutex Initializers


    | Type | Description |

    |---|---|

    | PTHREAD_MUTEX_INITIALIZER | Fast Mutex |

    | PTHREAD_RECURSIVE_MUTEX_INITIALIZER_NP | Recursive Mutex |

    | PTHREAD_ERRORCHECK_MUTEX_INITIALIZER_NP | Error-checking Mutex |


    The recursive mutex is a special mutex that allows the mutex to be locked several
    times (without blocking), as long as it''s locked by the same thread. Even though
    the mutex can be locked multiple times without blocking, the thread must unlock
    the mutex the same number of times it was locked. The error-checking _NP suffix
    for recursive and error-checking mutexes indicates that it''s not portable.


    Now that we have a mutex, we can lock and unlock it to create our critical section.
    This is done with the pthread_mutex_lock and pthread_mutex_unlock API functions.
    Another function called pthread_mutex_trylock can be used to try to lock a mutex,
    but it won''t block if the mutex is already locked. Finally, we can destroy an
    existing mutex using pthread_mutex_destroy. They have the prototype:'
