  md: '# Usability/Reliability Ramp


    The early days of the GNU operating system were not for the faint of heart. Installing
    GNU/Linux was not a simple task, and commonly, source changes were necessary to
    get a system working. The operating system, after all, was simply a hobby in the
    early days and did not have the plethora of drivers and hardware support that
    exists today. New open source projects mirror some of these same issues. Early
    adoption can be problematic if one is not willing to get one''s hands dirty. But
    if an application is truly of interest, just wait a few releases, and someone
    will make it more usable.


    # Documentation


    Documentation on any software project is one of the last elements to be done.
    Open source is no different in that respect. Some have claimed that the only way
    to make money from open source is to sell documentation (such as what the Free
    Software Foundation does today, though it''s freely downloadable).


    # Ego


    Like proprietary software, ego plays a large part in the architecture and development
    direction. Ego is a key reason for the failure of many open source projects, probably
    more than technical failings, but this is a personal opinion. Related to ego are
    the conflicts that can arise in open source development. One developer sees an
    application moving in one direction, while another sees a different path. A common
    result is forking of an application, which in itself can be beneficial if viewed
    from the perspective of natural selection.


    # Fanaticism


    The open source movement is filled with fanatically committed people. Phrases
    such as "GNU Zealot" and "Linux Zealor" are not uncommon from those on the "outside."
    Arguments over, for example, which operating system is better mirror many of the
    political debates to which we''ve become accustomed. The danger of fanaticism
    is that we don''t see the real issues and focus on what''s really important. One
    can use both Windows and Linux and argue, it''s about the best tool for the job.


    > Many of the deeply debates on open source result in arguments such as "open
    source is better, just because it is." The argument becomes a disjunctive logism,
    such as "Windows or GNU/Linux; definitely not Windows, therefore GNU/Linux." One
    could argue the merits of the vi editor over Emacs (or vice versa), but ultimately
    what''s most important is that the editor does what one needs to do. Can one operate
    efficiently using it? From personal experience, engineers are aghast that someone
    would use such an editor as vi. But if one can edit as efficiently in


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_50_0.png)'
