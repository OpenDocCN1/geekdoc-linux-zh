    # connect


    The connect function is used by client Sockets applications to connect to a server.
    Clients must have created a socket and then defined an address structure containing
    the host and port number to which they want to connect. The connect function is
    provided by the following function prototype:


    ```

    int connect(int sock, (struct sockaddr*)servaddr, int addrLen);

    ```


    The sock argument represents our client socket, created previously with the Sockets
    API. The servaddr structure is the server peer to which we want to connect (as
    illustrated previously in the "Socket Addresses" section of this chapter). Finally,
    we must pass the length of our servaddr structure so that connect knows we''re
    passing in a sockaddr_in structure. The following code shows a complete example
    of:


