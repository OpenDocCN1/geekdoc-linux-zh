    # Chapter 20, "The Bourne-Again Shell (bash)"


    The bash shell is the facto standard shell for GNU/Linux. Shell programming is
    very beneficial to understand because it permits developers to code repetitive
    tasks quickly. Shell programming can be slower than compiling to the native instruction,
    but efficiency isn''t always the most important aspect of development. Compiling
    source to a native image takes time. The great advantage to scripting is that
