  md: 'The case construct shown in Listing 20.8 illustrates testing an integer among

    values. At line 4, we set up the case construct using $var. At line 5, the test
    against

    0 is performed, and if it succeeds, the commands that follow are executed. Lines
    6\and 7 test against values 1 and 2. Finally at line 8, the default * simply says
    that if all

    previous tests failed, this line will be executed. At line 9, the case structure
    is closed.

    Note that the command list within the tests ends with ;;. This indicates to the

    interpreter that the case construct are finished, and either another case test
    or the

    closure of the case construct is coming. Note that the ordering of case tests
    is important. Consider if line 8 had been the first test of the last. In this
    case, the

