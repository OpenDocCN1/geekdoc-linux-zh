    # GCC OPTIMIZER


    The job of the optimizer is essentially to do one of three potentially orthogonal
    tasks. It can optimize the code to make it faster and smaller, it can optimize
    the code to make it faster but potentially larger, or it can simply reduce the
    size of the code but potentially make it slower. Luckily, we have control over
    the optimizer to instruct it on what we really want.


    While the GCC optimizer does a good job of code optimization, it can sometimes
    result in larger or slower images (the opposite of what you may be after). It''s
    important to test your image to ensure that you''re getting what you expect. When
    you don''t get what you expect, changing the options you provide to the optimizer
    can usually remedy the situation.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_60_0.png)


    In this section, we''ll look at the various mechanisms to optimize code using
    GCC.

    in its simplest form, GCC provides a number of levels of optimization that can
    be enabled. The -O (oh) option permits the specification of five different optimization
    levels, listed in Table 4.4.'
