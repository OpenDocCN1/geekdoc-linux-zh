  md: "# dup and dup2\n\nThe dup and dup2 calls are very useful functions that provide\
    \ the ability to duplicate a file descriptor. They're most often used to redirect\
    \ the stdin, stdout, or stderr of a process. The function prototypes for dup and\
    \ dup2 are:\n\n```\n#include <unistd.h>\nint dup(int oldfd);\nint dup2(int oldfd,\
    \ int targetfd);\n```\n\nThe dup function allows us to duplicate a descriptor,\
    \ and it returns a new descriptor that is identical to the first. This means that\
    \ both descriptors share the same internal structure. For example, if we perform\
    \ an lseek (seek into the file) for one file descriptor, the file position is\
    \ the same in the second. Sample use of the dup function is illustrated in the\
    \ following code snippet:\n\n```\nint fd1, fd2;\n...\fd2 = dup(fd1);\n```\n\n\
    > Creating a descriptor prior to the fork call has the same effect as calling\
    \ dup. The child process receives a duplicated descriptor, just like it would\
    \ after calling dup.\n\nThe dup2 function is similar to dup but allows the caller\
    \ to specify an active descriptor and the id of a target descriptor. Upon successful\
    \ return of dup2, the new target descriptor is a duplicate of the first (targetfd\
    \ = oldfd). Let's now look at a short code snippet that illustrates dup2:\n\n\
    ```\nint oldfd;\noldfd = open(\"app_log\", (O_RDWR | O_CREATE), 0644);\ndup2(oldfd,\
    \ 1);\nclose(oldfd);\n```\n\nIn this example, we open a new file called \"app_log\"\
    \ and receive a file descriptor called fd1. We call dup2 with oldfd and 1, which\
    \ has the effect of replacing the file descriptor identified as 1 (stdout). Anything\
    \ written to stdout will now go into the file name \"app_log\". Note that we close\
    \ oldfd directly after duplicating it. This doesn't close our newly opened file,\
    \ as file descriptor 1 now references it.\n\nLet's now look at a more complex\
    \ example. Recall that earlier in the chapter we investigated pipelining the output\
