  md: '# 11 Programming with Pipes


    +   In This Chapter

    - Review of the Pipe Model of IPC

    - Differences Between (Anonymous) Pipes and Named Pipes

    - Creating Anonymous and Named Pipes

    - Communicating Through Pipes

    - Command-line Creation and Use of Pipes


    # INTRODUCTION


    In this chapter, we''ll explore the GNU/Linux pipes. The pipe model is an older
    but still useful mechanism for inter-process communication. We''ll look at what
    are known as half-duplex pipes and named pipes. Each offers a FIFO queuing model
    to permit communication between processes.


    # THE PIPE MODEL


    One way to visualize a pipe is a one-way connector between two entities. For example,
    consider the following GNU/Linux command:


    ```

    ls -1 | wc -1

    ```'
  merge: -1
