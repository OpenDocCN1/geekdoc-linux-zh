  md: '# 414 GNU/Linux Application Programming


    We''ve seen a few of the internal functions and variables provided by the scanner
    and parser. Table 23.1 provides a list of some of the others that you may encounter
    in your use of flex and bison.


    # TABLE 23.1 Useful Scanner and Parser Functions and Variables


    | Name | Type | Description |

    |---|---|---|

    | yparse | Function | Parser function (called by main) |

    | yyerror | Function | Error function (can be provided by user) |

    | yylex | Function | Scanner functions (returns tokens, used by yyparse) |

    | yyterminate | Function | Terminates the parsing process |

    | yylval | char*/union | Token value |

    | yytext | char* | Pattern string used by the lexer |

    | yydebug | int | Set to 1 to enable debug mode |


    Designing and specifying parsers (lexers) can be a difficult task, but in the
    end, the act of specifying how the grammar works is necessary even if it''s to
    be done by hand. Once the specification is done, the generation of the parser
    with bison is trivial (compared to writing one by hand) and therefore flex and
    bison can be very useful tools in our development toolbox.


    # SUMMARY


    The flex and bison tools can be two very important elements for software specification
    and generation of lexers and grammar parsers. The flex tool allows the specification
    and generation of lexical analyzers that provide the ability to tokenize the input.
    The bison tool allows the specification of a grammar, which when generated can
    take the tokens from the lexical analysis phase to recognize correctly formed
    input. We demonstrated these tools in two scenarios, looking at two different
    parsing examples. The build process was also discussed, including linkage between
    the lexer and parser phases.'
