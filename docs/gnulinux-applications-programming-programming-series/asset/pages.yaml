    # Self-Identifying Structures


    A self-identifying structure is a method that mimics the concept of runtime type
    checking in strongly typed languages. In a strongly typed language, the use of
    an invalid type results in a runtime error. Consider the passing of pointers in
    a weakly typed language such as C. With typecasting, it''s not difficult to confuse
