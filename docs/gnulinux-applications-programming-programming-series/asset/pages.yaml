  md: '# Building and Using Libraries


    As was provided with dclopen, dlclose provides a mechanism by which the shared
    object can export a completion routine that is called when the dlclose function
    is called. The developer must simply add a function called _fini to the shared
    library, and dlclose will ensure that _fini is called prior to dlclose return.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_96_0.png)


    And that''s it! For the small amount of pain involved in creating an application
    that utilizes dynamically loaded shared libraries, it can ultimately save on memory.
    Note also that it''s not always necessary to make all dynamic functions visible
    when your application starts. You can instead make only those that are necessary
    for normal operation and load other dynamic libraries as they become necessary.


    The dynamically loaded library API is very simple and is shown here for completeness:


    ```

    void *dclopen(const char *filename, int flag);

    const char *dlerror(void );

    void *dlsym(void *handle, char *symbol);

    int dlclose(void *handle );

    ```


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_96_1.png)


    How a library is made up depends upon what it''s representing. The library should
    contain all functions that are necessary for the given problem domain. Functions
    that are not specifically associated with the domain should be excluded and potentially
    included in another library.


    # UTILITIES


    Now let''s look at some of the other utilities that are useful when creating static,
    shared, or dynamic libraries.


    # file


    The file utility tests the file argument for the purposes of identifying what
    it is. This utility is very useful in a number of different scenarios, but in
    this case it will provide us with a small amount of information about the shared
    object. Let''s look at an interactive example:


    ```

    $ file /usr/local/lib/libmyrand.so

    /usr/local/lib/libmyrand.so: ELF 32-bit LSB shared object,

    Intel 80386, version 1 (SYSV), not stripped

    $

    ```'
