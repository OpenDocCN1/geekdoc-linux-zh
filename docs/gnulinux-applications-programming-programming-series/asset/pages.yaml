  md: '# 38 GNU/Linux Application Programming


    So if we were compiling specifically for the Intel Celeron architecture, we''d
    use the following command line:


    ```

    $ gcc -mcpu=pentium2 test.c -o test

    ```


    Of course, combining the -mcpu option with an optimization level can lead to additional
    performance benefits. One very important point to note is that once we compile
    for a given CPU, it may not run on another. Therefore, if we''re interested in
    an image running on a variety of CPUs, allowing the compiler to pick the default
    (i386) will support any of the x86 architectures.


    # DEBUGGING OPTIONS


    If we want to debug our code with a symbolic debugger, we can specify the -g flag
    to produce debugging information in the image for GDB. The -g option can specify
    an argument to specify which format to produce. To request debugging information
    to be produced using dwarf- 2 format, we would provide the option as follows:


    ```

    $ gcc -dwarf-2 test.c -o test

    ```


    # OTHER TOOLS


    In this final section, we''ll look at some of the other GNU tools (usually called
    binutils) that help us in the development process.


    First, how can we identify how large our executable image or intermediate object
    is? The size utility emits the text (instruction count) and also the data and
    bss segments. Consider this example:


    ```

    $ size test.o

    text    data  bss  dec      filename

    789     256   4     1049     419 test.o

    $

    ```


    We request the size of our intermediate object file, test.o. We find that the
    text size (instructions and constants) is 789 bytes, and the bss segment (which
    will be automatically initialized to zero) is 4 bytes. If we want more detailed
    information on the image, we can use the objdump utility. We can explore the symbol
    table of the image or object using the -syms argument, as:


    ```

    $ objdump -syms test.o

    ```'
