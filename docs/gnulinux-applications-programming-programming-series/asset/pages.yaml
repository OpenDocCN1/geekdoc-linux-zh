    Now that we have a quick introduction to sed, let''s look at some of sed''s other
    capabilities. The sed utility can be quite broad and complex. Therefore, we''ll
    focus in this chapter on the more useful aspects of sed.


    # sed SPACES (BUFFERS)


    Within sed, there are a number of spaces (buffers) on which sed commands operate.
    Each input line is first copied to the pattern space. The pattern space is the
    temporary holding space on which sed commands are performed. Once the provided
    sed scripts have all been performed on the pattern space, the line is copied to
    the output. Also available in sed is the hold space. Within sed, we can copy the
    contents of the pattern space to the hold space and retrieve them at later time.
    The hold space is just a temporary buffer, but it can be useful to remember lines.


    # TYPICAL sed COMMAND-LINE OPTIONS


    Rather than specify scripts on the command line, sed scripts can also be specified
    in a file. This can be useful when complex sed scripts are needed. To invoke a
    scripted file with sed, simply use the -f option to specify the script file.


    We can suppress automatic emission of sed output by using the -n flag. When we
    look at the print command, we''ll see where this flag can be useful.


    When dealing with very large files, we can achieve better intermediate performance
    with the -u flag. In this unbuffered mode, sed loads smaller amounts of data from
    the input files and flushes data to the output more often. This means better visual
    performance (we see results more often), but it may represent worse overall performance.


    # REGULAR EXPRESSIONS


    A key aspect of sed is its use of regular expressions. A regular expression is
    a pattern that can match text strings. Regular expressions are a formal language
    from which'
