    These operating systems were closed and not modifiable by end users. In fact,
    until very recently, it was impossible to buy a PC from a major supplier without
    having to buy the Windows operating system on. But through the Free Software Foundation
    (FSF), Stallman collected hundreds of programmers around the world to help on
    the task.


