    system-wide fashion that ensures uniqueness. The ftok system function provides
    the means to create system-wide unique keys using a file in the filesystem and
    the file (and its path) will by default be unique in the filesystem, a unique
    key can be easily created. Let''s look at an example of using ftok to create a
    unique key. Assume that the file with path /home/mtj/queues/myqueue exists.


    ```

    key_t myKey;

    int msgid;

    // Create a key based upon the defined path and number

    myKey = ftok("/home/mtj/queues/myqueue", 0);

    msgid = msgget(myKey, IPC_CREAT | 0666);

    ```


    This will create a key for this path and number. Each time ftok is called with
    this path and number, the same key will be generated. Therefore, it provides a
    useful way to generate a key based upon a file in the filesystem.

    One last example is getting the message queue ID of an existing message queue.
    The only difference in this example is that we provide no command, only the key:


    ```

    msgid = msgget(0x111, 0);

    if (msgid == -1) {

    printf("Queue doesn''t exist...\n");

    }

    ```


    The msgflags (second argument to msgget) is zero in this case, which indicates
    to this API function an existing message queue is sought.

    One final note on message queues the default settings that are given to a message
    queue when it is created. The configuration of the message queue is noted in the
    parameters shown in Table 15.3. Note that there''s no way to change these defaults
    within msgget. In the next section, we''ll look at some of the parameters that
    can be changed and their effects.

    The user can override the msg_perm.uid, msg_perm.gid, msg_perm.mode, and msg_qbytes
    directly. On on this topic in the next section.


    # msgctl


    The msgctl API function provides three distinct features for message queues. The
    first is the ability to read the current set of message queue defaults (via the
    IPC_STAT command). The second is the ability to modify a subset of the defaults
    (via IPC_SET). Finally, the ability to remove a message queue is provided (via
    IPC_RMID). The msgctl prototype function is defined as:


    ```

    #include <sys/msg.h>

    int msgctl(int msgid, int cmd, struct msgid_ds *buf);

    ```'
