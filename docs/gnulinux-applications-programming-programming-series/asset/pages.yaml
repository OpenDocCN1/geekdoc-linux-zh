  md: '# Building Packages with automate/autoconf 101


    The additional files added to support a simple Autotools project are these:


    autogen.sh: A script to run Autotools to generate the build environment.

    configure.ac: The input file for the autoconf tool.

    Makefile.am: The top-level Makefile template.

    app/Makefile.am: The Makefile template for appexe executable.

    lib/Makefile.am: The Makefile template for building libexp.a library.


    These files describe the intended build products and environment to Autotools.
    Autotools will take this input and generate a build environment template that
    will be further configured on the build system to generate the final set of Makefiles.
    Assuming that we are developing and building on the same machine, the following
    commands should configure and build our example project:


    ```

    # ./autogen.sh

    # ./configure

    # make

    ```


    Running the autogen.sh script will execute the Autotool utilities to convert the
    input files into a build environment template that can be configured on the host
    system. Executing the configure script will cause both the build environment template
    to be customized for the build machine. The output of the configure script is
    a set of GNU Makefiles that can be used to build the system. Executing the make
    command in the root directory will cause both the library and application to be
    built.


