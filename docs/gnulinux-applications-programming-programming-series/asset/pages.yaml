  md: '# GNU/Linux Process Model 187


    pid_t waitpid( pid_t pid, int *status, int options );


    The return value for waitpid is the process identifier for the child that exited.

    The return value can also be zero if the options argument was set to WNOHANG and
    no child process has exited (returns immediately).\ arguments to waitpid are a
    pid value, a reference to a return status, and a set of options. The pid value
    can be a child process ID or other values that provide different behaviors. Table
    13.3 lists the possible pid values for waitpid.


    # TABLE 13.3 Pid Arguments for waitpid


    | Value | Description |

    |---|---|n| >0 | Suspend until the child identified by the pid value has exited
    |

    | 0 | Suspend until any child exits whose group ID matches that of the calling
    process |

    | -1 | Suspend until any child exits (identical to the wait function) |

    | <-1 | Suspend until any child exits whose group ID is equal to the absolute
    value of the pid argument |


    The status argument for waitpid is identical to the wait function, except that
    two new status macros are possible (see Table 13.4). These macros are seen only
    if the WUNTRAC option is specified.


    # TABLE 13.4 Extended Macro Functions for waitpid


    | Macro | Description |

    |---|---|n| WIFSTOPPED | Returns true if the child process is currently stopped.
    |

    | WOPSIG | Returns the signal that caused the child to stop (relevant only if
    WIFSTOPPED was nonzero). |


    The final argument to waitpid is the options argument. Two options are available:
    WNOHANG and WUNTRACED. WNOHANG, as we discussed, avoids suspension of the parent
    process and returns only if a child has exited. The WUNTRACED option returns for
    children that have been stopped and not yet reported.'
