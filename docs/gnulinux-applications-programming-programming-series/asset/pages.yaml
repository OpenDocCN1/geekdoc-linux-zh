  md: 'These functions are referred to as the base API because they are the platform
    from which the standard I/O library is built.


    The open function allows us to open or create a new file. Two variations are provided,
    with their APIs listed here:


    ```

    int open(const char *pathname, int flags);

    int open(const char *pathname, int flags, mode_t mode);

    ```


    The pathname argument defines the file (with path) to be opened or created (such
    as temp.txt or /tmp/myfile.txt). The flags argument is one of O_RDONLY, O_WRONLY,
    or O_RDWR. One or more of the flags shown in Table 10.3 may also be OR’d, depending
    on the needs of the open call.


    # TABLE 10.3 Additional Flags for the open Function


    | Flag | Description |

    | O_CREAT | Create the file if it doesn''t exist. |

    | O_EXCL | If used with O_CREAT, return an error if the file already exists, otherwise
    the file is created. |

    | O_NOCTTY | If the file descriptor refers to a TTY device, this process will
    not become the controlling terminal. |

    | O_TRUNC | The file will be truncated (if it exists) and the length reset to
    zero if write privileges are permitted. |

    | O_APPEND | The file pointer is repositioned to the end of the file prior to
    each write. |

    | O_NONBLOCK | Opens the file in nonblocking mode. Operations on the file will
    not block (such as read, and so on). |

    | O_SYNC | write functions are blocked until the data is written to the physical
    device. |

    | O_NOFOLLOW | Fail following symbolic links. |

    | O_DIRECTORY | Fail open if the file being opened is not a directory. |

    | O_DIRECT | Attempts to minimize cache effects by doing I/O directly to/from
    user space buffers (synchronously as with O_SYNC). |

    | O_ASYNC | Requests a signal when data is available on input or output of this
    file descriptor. |

    | O_LARGEFILE | Request a large filesystem file to be opened on a 32-bit system
    whose size cannot be represented in 32 bits. |'
