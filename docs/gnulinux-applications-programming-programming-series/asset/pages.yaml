    # alarm


    The alarm API function can be very useful to time out other functions. The alarm
    function works by raising a SIGALRM signal once the number of seconds passed to
    alarm has expired. The function prototype for alarm is:


    ```

    unsigned int alarm( unsigned int secs );

    ```


    The user passes in the number of seconds to wait before sending the SIGALRM signal.
    The alarm function returns zero if no alarm was previously scheduled; otherwise
    it returns the number of seconds pending on the previous alarm.

    Here''s an example of alarm to kill the current process if the user isn''t able
    to enter a password in a reasonable amount of time (see Listing 13.7). At line
    18, we install our signal handler for the SIGALRM signal. The signal handler is
