    # THE SEMAPHORE API


    As we noted before, the semaphore API handles not only the case of managing a
    single semaphore, but also groups (or arrays) of semaphores. We''ll investigate
    their use in this section. For a quick review, Table 16.1 shows the API functions
    and describes their uses. In the following discussion, we will continue to use
    the term semaphore, but this could refer instead to a semaphore array.'
