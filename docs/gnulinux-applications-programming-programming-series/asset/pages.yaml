  md: "# 448 GNU/Linux Application Programming\n\nThe breakpoint is one of the most\
    \ important aspects of debugging, but its behavior is different in multithreaded\
    \ applications. If a breakpoint is created at a source line used by multiple threads,\
    \ then every thread is affected by the breakpoint. We can limit this by specifying\
    \ the thread to be affected. For example:\n\n```\n(gdb) break pos.c:17 thread\
    \ 5\n```\n\nThis installs a breakpoint at line 20 in myfile.c, but only for thread\
    \ 5. We can further refine these breakpoints using thread qualifiers. For example:\n\
    \n```\n11 void *posThread(void *arg )\n12 {\n13     int ret;\n14 \n15     ret\
    \ = checkPosition(arg);\n16 \n17     if (ret == 0) {\n18 \n19         ret = move(arg);\n\
    20 }\n21 (gdb) b pos.c:17 thread 5 if ret > 0\nBreakpoint 1 at 0x8048550: file\
    \ pos.c, line 19\n(gdb)\n```\n\nIn this example, we specify to break at line 17\
    \ in file pos.c for thread 5, but here we qualify that thread 5 will be stopped\
    \ only if the local variable is greater than 0.\nWe can identify the threads that\
    \ are currently active in a multithreaded application using the info threads command.\
    \ This command lists each of the active threads and its current state. For example:\n\
    \n```\n(gdb) info threads\n5 Thread -161359152 (LWP 2819) posThread(arg=0x0) at\
    \ pos.c:17\n...\n* 1 Thread -151046720 (LWP 2808) init at init.c:154\n(gdb)\n\
    ```\n\nThe * before thread 1 identifies that it is the current focus of the debugger.\
    \ We could switch to any thread using the thread command, which allows us to change\
    \ the focus of the debugger to the specified thread.\n\n```\n(gdb) thread 1\n\
    [Switching to thread 1 (Thread -161359152 (LWP 2819))]#0 posThread\n17 if (ret\
    \ == 0) {\n(gdb)\n```"
