    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_423_0.png)


    FIGURE 23.2 Incomplete parse tree for an erroneous code fragment


    Note that the tree illustrates two concepts in parsing. The endpoints of the tree
    (leaves) represent the symbols of the grammar, whereas the edges represent the
    derivation of the endpoints. When a sequence of tokens is properly matched in
    the tree to a set of nodes, tokens are recognized by the grammar.


    # Lexer and Parser Communication


    In a typical compiler, there will be numerous phases (commonly six). The lexical
    analyzer and grammar parser are two of the phases in compiler construction, but
    for our purposes here, they are all that are required. For the parsing of configuration
    files, we''ll need to break our file down into tokens and then parse these into
    a parse tree. This is illustrated in Figure 23.3.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_423_1.png)


    FIGURE 23.3 Typical phases in configuration parsing.


    Given our input file, the lexical analyzer (or lexer) will take the file as characters
    and assemble them into tokens. The grammar parser takes the tokens and parses
    them into parse trees. Based on the successful creation of the parse tree, we
    have syntactically correct code (or configuration). From here, we can utilize
    the parse tree to extract the configuration data.'
