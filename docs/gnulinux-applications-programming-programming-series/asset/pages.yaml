    # Synchronizing with the Creator Process


    One element of Listing 13.2 was ignored, but we''ll dig into it now. At line 23,
    the wait function was called within the context of the parent. The wait function
    suspends the parent until the child exits. If the wait function is not called
    by the parent and the child exits, the child becomes what is known as a "zombie"
    (neither alive nor dead). It can be problematic to have these processes lying
    around (due to the resources they waste), so handling child exit is necessary.
    Note that if the parent exits, the children that have been spawned are inherited
    by the init process.


    > Another way to avoid zombie processes is to tell the parent to ignore child
    exit signals when they occur. This can be achieved using the signal API function,
    which we explore in the next section, “Catching a Signal." In any case, once the
    child has stopped, any system resources that were used by the process are immediately
    released.


