  md: "# Shared Memory Programming 295\n\nWe'll return to these elements shortly when\
    \ we discuss the control aspects of shared memory segments.\n\n# shmctl\n\nThe\
    \ shmctl API function provides three separate functions. The first is to read\
    \ the current shared memory structure (as defined at Listing 17.7) using the IPC_STAT\
    \ command. The second is to write the shared memory structure using the IPC_SET\
    \ command. Finally, a shared memory segment can be removed using the IPC_RMID\
    \ command. The shmctl function prototype is shown below:\n\n```\n#include <sys/ipc.h>\n\
    #include <sys/shm.h>\nshmctl(int shmid, int cmd, struct shmid_ds *buf);\n```\n\
    \nLet's begin by removing a shared memory segment. To remove a segment, we must\
    \ first have the shared memory identifier. We then pass this identifier, along\
    \ with the command IPC_RMID, to shmctl, as:\n\n```\nint ret;\n...\nmid = shmget(SHM_KEY,\
    \ 0, 0);\nif (shmid != -1) {\n  ret = shmctl(shmid, IPC_RMID, 0);\n  if (ret ==\
    \ 0) {\n    // shared memory segment successfully removed.\n  }\n}\n```\n\nIf\
    \ no processes are currently attached to the shared memory segment, then the segment\
    \ is removed. If there are currently attaches to the shared memory segment, then\
    \ the segment is marked for deletion but not yet deleted. This means that after\
    \ the last process detaches from the segment it will be removed. Once the segment\
    \ is marked for deletion, no processes may attach to the segment. Any attempt\
    \ to attach results in an error return with errno set to EIDRM.\n\n> Internally,\
    \ once the shared memory segment is removed, its key is changed to IPC_PRIVATE.\
    \ This disallows any new process from finding the segment.\n\nNext, let's look\
    \ at the IPC_STAT command that can be used within shmctl to gather information\
    \ about a shared memory segment. In Listing 17.7, we listed a number of parameters\
    \ that define a shared memory segment. This structure can be read via the IPC_STAT\
    \ command as shown in Listing 17.8.\n\n![](img/e2d3d6ad54c540455223ec59a4bf39e6_322_0.png)"
