  md: '# TRADITIONAL PROCESS API


    We''ve looked at a number of different API functions that relate to the GNU/Linux
    process model. Let''s now dig further into these functions (and others) and explore
    them in greater detail. Table 13.1 provides a list of the functions that we''ll
    explore in the remainder of this section, including their uses.


    TABLE 13.1 Traditional Process and Related APIs


    | API Function | Use |

    | --- | --- |

    | fork | Create a new child process |

    | wait | Suspend execution until a child processes exits |

    | waitpid | Suspend execution until a specific child process exits |

    | signal | Install a new signal handler |

    | pause | Suspend execution until a signal is caught |

    | kill | Raise a signal to a specified process |

    | raise | Raise a signal to the current process |

    | exec | Replace the current process image with a new process image |

    | exit | Cause normal program termination of the current process |


    We''ll address each of these functions in detail in the remainder of this chapter,
    illustrated in sample applications.


    # fork


    The fork API provides the means to create a new child subprocess from an existing
    parent process. The new child process is identical to the parent process in almost
    every way. Some differences include the process ID (a new ID for the child) and
    that the parent process ID is set to the parent. File locks and signals that are
    pending to the parent are not inherited by the child process. The prototype for
    the fork function is defined as follows:


    ```

    pid_t fork( void );

    ```


    The fork API takes no arguments and returns a pid (process identifier). The fork
    call has a very unique structure in that the return value identifies the context
    in which the process is running. If the return value is zero, the current process
    is the newly created child process. If the return value is greater than zero,'
  merge: -1
  pgno: 211
- img_proc: true
  md: "then the current process is the parent, and the return value represents the\
    \ process ID of the child. This is illustrated in the following snippet:\n\n```\n\
    #include <sys/types.h>\n#include <unistd.h>\n#include <errno.h>\n...\npid_t ret;\n\
    ret = fork();\nif (ret > 0) {\n    /* Parent Process */\n    printf(\"My pid is\
    \ %d and my child's is %d\\n\",\n    getpid(), ret);\n} else if (ret == 0) {\n\
    \    /* Child Process */\n    printf(\"My pid is %d and my parent's is %d\\n\"\
    ,\n    getpid(), getppid());\n} else {\n    /* Parent Process - error */\n   \
    \ printf(\"An error occurred in the fork (%d)\\n\", errno);\n}\n```\n\nWithin\
    \ the **fork()** call, the process is duplicated, and control is returned to the\
    \ unique process (parent and child). If the return value of **fork** is less than\
    \ zero, then an error has occurred. The **errno** value will represent either\
    \ EAGAIN or ENOMEM. Both errors arise from a lack of available memory.\n\nThe\
    \ **fork** API function is very efficient in GNU/Linux because of its unique implementation.\
    \ Rather than copy the page tables for the memory when the **fork** takes place,\
    \ the parent and child share the same page tables but are not permitted to write\
    \ to them. When a write takes place to one of the shared page tables, the page\
    \ is copied for the writing process so that it has its own copy. This is called\
    \ “copy-on-write” in GNU/Linux and permits the **fork to take place very quickly**.\
    \ Only as writes occur to the share data memory does the segregation of the page\
    \ tables take place.\n\n# wait\n\nThe purpose of the **wait** API function is\
    \ to suspend the calling process until a child process (created by this process)\
    \ exits or until a signal is delivered. If the parent isn't currently waiting\
    \ on the child to exit, the child exits, and the child process becomes a zombie\
    \ process.\n\nThe **wait** function provides an asynchronous mechanism as well.\
    \ If the child process exits before the parent had a chance to **wait**, then\
    \ the child becomes a zombie but then is freed once **wait** is called. The **wait**\
    \ function, in this case, returns immediately."
