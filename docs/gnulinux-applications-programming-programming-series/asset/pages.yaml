- img_proc: true
  md: 'This command creates two processes, one for the ls -1 and another for wc -1.
    It then connects the two together by setting the standard-input of the second
    process to the standard-output of the first process (see Figure 11.1). This has
    the effect of counting the number of files in the current subdirectory.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_163_0.png)


    FIGURE 11.1 Simple pipe example.


    Our command, as illustrated in Figure 11.1, sets up a pipeline between two GNU/Linux
    commands. The ls command is performed, which generates output that is used as
    the input to the second command, wc (word count). This is a half-duplex pipe as
    communication occurs in one direction. The linkage between the two commands is
    facilitated by the GNU/Linux kernel, which takes care of connecting the two together.
    We can achieve this as well in applications, which we''ll demonstrate shortly.


    # Pipes and Named Pipes


    A pipe, or half-duplex pipe, provides the means for a process to communicate with
    one of its ancestral subprocesses (of the anonymous variety). This is because
    there''s no way in the operating system to locate the pipe (it''s anonymous).
    It''s most common use is to create a pipe at a parent process and then pass the
    pipe to the child so that they can communicate. Note that if full-duplex communication
    was required, the Socks API should be considered instead.


    Another type of pipe is called a named pipe. A named pipe works like a regular
    pipe but exists in the filesystem so that any process can find it. This means
    that processes of not the same ancestry are able to communicate with one another.

    We''ll take a quick tour of pipes and then follow up with a more detailed look
    at the pipe API and GNU/Linux system-level commands that support pipes programming.'
