    # msgget


    The **msgget** API function serves two basic roles: to create a message queue
    or to get the identifier of a message queue that already exists. The result of
    the **msgget** function (unless an error occurs) is the message queue identifier
    (used by all other message queue API functions). The prototype for the **msgget**
    function is defined as follows:


    ```

    int msgget( key_t key, int msgflag );

    ```


    The key argument defines a system-wide identifier that uniquely identifies a message
    queue. key must be a nonzero value or the special symbol IPC_PRIVATE. The IPC_PRIVATE
    variable simply tells the **msgget** function that no key is provided and to simply
    make one up. The problem with this is that no other process can then find the
    message queue, but for local message queues (private queues), this method works
    fine.


    The msgflag argument allows the user to specify two distinct parameters: command
    and an optional set of access permissions. Permissions replicate those found as
    modes for the file creation (see Table 15.2). The command can take two forms.
    The first is simply IPC_CREAT, which instructs **msgget** to create a new message
    queue (or return the ID for the queue if it already exists). The second includes
    two'
  merge: -1
  pgno: 268
- img_proc: true
  md: "# 242 GNU/Linux Application Programming\n\ncommands (IPC_CREAT | IPC_EXCL),\
    \ which request that the message queue be created, but if it already exists, the\
    \ API function should fail and return an error response (EEXIST). The third possible\
    \ command argument is simply 0. This form tells **get** that the message queue\
    \ identifier for an existing queue is being requested.\n\n**TABLE 15.2** Message\
    \ Queue Permissions for the msgget msgflag Argument\n\n| Symbol | Value | Meaning\
    \ |\n| --- | --- | --- |\n| S_IRUSR | 0400 | User has read permission |\n| S_IWUSR\
    \ | 0200 | User has write permission |\n| S_IRGRP | 0040 | Group has read permission\
    \ |\n| S_IWGRP | 0020 | Group has write permission |\n| S_IROTH | 0004 | Other\
