- img_proc: true
  md: '# 152 GNU/Linux Application Programming


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_179_0.png)


    FIGURE 12.4 Client/server symmetry in Sockets applications.


    We establish our next socket, using connect at the client and accept at the server.
    The connect call starts what''s known as the three-way handshake, with the purpose
    of setting up a connection between the client and server. At the server, the accept
    call creates a new server-side client socket. Once accept finishes, a new socket
    connection exists between the client and server, and data flow can occur.


    In the data transfer phase, we have an established socket for which communication
    can occur. Both the client and server can send and recv data asynchronously.


    Finally, we can sever the connection between the client and server using the close
    call. This can occur asynchronously, but upon one endpoint closing the socket,
    the other side will automatically receive an indication of the closure.'
