    # Conditionals


    In this section, we''ll look at conditionals. The if/then construct provides a
    decision point after evaluating a test construct. The test construct returns a
    value as its result. The result of the test construct is zero for true (test succeeds
    and subsequent commands are executed) or nonzero for false (test fails else section,
    if available, executed). Let''s look at a simple example to illustrate (see Listing
    20.4).


    # Listing 20.4 Simple Script Illustrating if/then/else Construct (on the CD-ROM
    at /source/ch20/cond.sh)


    ```

    1: #!/bin/bash

    2: a=1

    3: b=2

    4: if [[ $a -eq $b ]]

    5: then

    6: echo "equal"

    7: else

    8: echo "unequal"

    9: fi

    ```


    > Note that the result of the test construct is the inverse of what you would
    expect. The is because the exit status of a command is 0 for success/normal and
    != 0 to indicate an error.


    After creating two variables, we test them for equality using the -eq comparison
    operator. If the test construct is true, we perform the commands contained in
    the then block. Otherwise, if an else block is present, this is executed (the
    test construct was false). else-if chains can also be constructed, as shown in
    Listing 20.5.


    # Listing 20.5 Simple Script Illustrating the if/then/elif/then/fi Construct (on
    the CD-ROM at. /source/ch20/cond.sh)


    ```

    1: #!/bin/bash

    2: x=5

    3: y=8

    4: if [[ $x -lt $y ]]

    5: then

    6: echo "$x < $y"

    7: elif [[ $x -gt $y ]]

    8: then

    9: echo "$x > $y"

    10: elif [[ $x -eq $y ]]

    ```'
