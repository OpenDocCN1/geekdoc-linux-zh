    for Loops

    The for/in/do/done construct in bash allows us to loop through a range of variables.
    This differs from the classical loop that is available in high-level languages
    as C, but bash''s perspective is very useful and offers some capabilities not
    found in C. Listing 20.14 provides a very simple loop for


    ```

    Listing 20.14 Simple for Loop Example (on the CD-ROM at ./source/ch20/forloop.sh)

    1: #!/bin/bash

    2:

    3:     echo Counting from 1 to 5

    4:

    5:     for val in 1 2 3 4 5

    6:

    7:     echo -n $val

    8:

    done

    9:     echo

    10:

    11:    exit

    ```


    The result of this script is:


    ```

    # ./test.sh

    Counting from 1 to 5

    1 2 3 4 5

    #

    ```


    Of course, we can emulate the C loop mechanism very simply as shown in Listing
    20.15.


    Listing 20.15 Simple for Loop Example Using C-like Construct (on the CD-ROM at
    ./source/ch20/forloop.sh)


    ```

    1: #!/bin/bash

    2:

    3:     for ((var=1; var <= 5; var++))

    4:

    5:     do

    6:     echo -n $var

    7:

    done

    8:     echo

    9:

    exit

    ```


    This code in Listing 20.15 is identical to the original for-in loop shown in Listing
    20.14.'
