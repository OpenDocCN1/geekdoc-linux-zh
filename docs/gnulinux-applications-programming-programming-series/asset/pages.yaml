    # BUILDING SHARED LIBRARIES


    Now let''s try our test application again, this time using a shared library instead
    of a static library. The process is essentially just as simple. Let''s first build
    a shared library using our initapi.o and randapi.o objects. One change is necessary
    when building source for a shared library. Since the library and application are
    not tied together as in a static library, the resulting library can''t assume
    anything about the binding application. For example, in addressing, references
    must be relative (through the use of a GOT, or Global Offset Table). The loader
    automatically resolves all GOT addresses as the shared library is loaded. To build
    our source files for position-independence, we use the PIC option of gcc:


    ```

    $ gcc -fPIC -c initapi.o

    $ gcc -fPIC -c randapi.o

    ```


    This results in two new objects containing position-independent code. We can create
    a shared library of these using gcc and the -shared flag. This flag flags gcc
    that a shared library is to be created:


    ```

    $ gcc -shared initapi.o randapi.o -o libmyrand.so

    ```'
