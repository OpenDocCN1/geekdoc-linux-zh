    # Bitwise Operators


    Standard bitwise operators are also available in bash. These include bitwise left
    shift (<<), bitwise right shift (>>), bitwise AND (&), bitwise OR (|), bitwise
    negate (-), bitwise NOT (!), and bitwise XOR (^). The following interactive session
    illustrates these operators:


    ```

    $ a=4

    $ let b="$a<<1"

    $ echo $b

    8

    $ b=8

    $ c=4

    $ echo $((c|$d))

    12

    $ echo $((0xc^0x3))

    15

    $

    ```


    # Logical Operators


    Traditional logical operators can also be found within bash. These include the
    logical AND (&&) and logical OR (||). The following interactive session illustrates
    these operators:


    ```

    $ echo $((2 && 0))

    0

    $ echo $((4 && 1))

    1

    $ echo $((3 || 0))

    1

    $ echo $((0 || 0))

    0

    ```


    In the next section, we''ll investigate how these can be used in conditionals
    for decision points.


    # Conditional Structures


    Bash provides the typical set of conditional constructs. In this section, we''ll
    explore each of these constructs and also investigate some of the other available
    conditional expressions that can be used.'
