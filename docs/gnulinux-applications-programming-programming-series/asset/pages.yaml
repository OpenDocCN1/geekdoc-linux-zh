- img_proc: true
  md: '# TABLE 4.4 Optimization Settings and Descriptions


    | Optimization Level | Description |

    | -00 | No optimization (the default level). |

    | -00, -01 | Tries to reduce both compilation time and image size. |

    | -02 | More optimizations than -01, but only those that don''t increase size
    over speed (or vice-versa). |

    | -0s | Optimize for resulting image size (all -02, except for those that increase
    size). |

    | -03 | Even more optimizations (-02, plus a couple more). |


    Enabling the optimizer simply entails specifying the given optimization level
    on the GCC command line. For example, in the following command line, we instruct
    the optimizer to focus on reducing the size of the resulting image:


    ```

    $ gcc -Os test.c -o test

    ```


    Note that it is possible to specify different optimization levels for each file
    that is to make up an image. There are certain optimizations (not contained within
    the optimization levels) that require all files to be compiled with the option
    if one is compiled with it. We''ll not address any of these here.

    Let''s dig into the optimization levels and see what each does and also identify
    the individual optimizations that are provided.


    # -00 Optimization


    With -00 optimization (or no optimizer spec specified at all), the compiler will
    simply generate code that provides the expected results and is easily debuggable
    within a source code debugger (such as the GNU Debugger, gdb). The compiler is
    also much faster when not optimizing, as the optimizer is not invoked at all.


    # -01 Optimization (-0)


    In the first level of optimization, the optimizer''s goal is to compile as quickly
    as possible and also to reduce the resulting code size and execution time. Compilation
    may take more time with -01 (over -00), but depending upon the source being compiled,
    this is usually not noticeable.

    The individual optimizations in -01 are shown in Table 4.5.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# TABLE 4.5 Optimizations Available in -01


    | Optimization Level | Description |

    |---|---|

    | defer-pop | Defer popping args from stack until necessary. |

    | thread-jumps | Perform jump threading optimizations (to avoid jumps to jumps).
    |

    | branch-probabilities | Use branch profiling to optimize branches. |

    | cprop-registers | Perform a register copy-propagation optimization pass. |

    | guess-branch-probability | Enable guessing of branch probabilities. |

    | omit-frame-pointer | Do not generate stack-frames (if possible). |


    The -01 optimization is a safe level if you still desire to safely debug the resulting
    image.


    When specifying optimizations explicitly, the -f option is used to identify them.
    For example, to enable the defer-pop optimization, we would simply define this
    as -fdefer-pop. If the option is enabled via an optimization level, and you want
    it turned off, simply use the negative form -fno-defer-pop.


    # -02 Optimization


    The second optimization level provides even more optimizations (while including
    those in -01) but does not include any optimizations that will trade speed for
    space (or vice-versa). The optimizations that are present in -02 are listed in
    Table 4.6. Note that Table 4.6 lists only optimizations that are unique to -02,
    but it doesn''t list the -01 optimizations. It should be assumed that -02 is the
    collection of optimizations shown in Tables 4.5 and 4.6.


    # -0s Optimization


    The -0s optimization level simply disables some -02 optimizations that would otherwise
    increase the size of the resulting image. Those optimizations that are disabled
    for -0s (that appear in -02) are -falign-labels, -falign-jumps, -falign-labels,
    and -falign-functions. Each of these has the potential to increase the size of
    the resulting image, and therefore they are disabled to build a smaller executable.'
