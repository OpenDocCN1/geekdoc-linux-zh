    # REDICTION


    Let''s first look at a basic topic in GNU/Linux shell use, that of input or output
    redirection.

    The concept of redirection is simply of redirecting our input or output to something
    other than the default. For example, the standard output of most commands will
    be redirected to the shell window. We can redirect the output of a command to
    a file using the > output redirection symbol. For example:'
