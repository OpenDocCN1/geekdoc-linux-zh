  md: '# ranlib


    The ranlib utility is one of the most important utilities when creating static
    libraries. This utility creates an index of the contents of the library and stores
    it in the library file itself. When this index is present in the library, the
    linking stage of building an image can be sped up considerably. Therefore, the
    ranlib utility should be performed whenever a new static library is created. An
    example of ranlib is shown here:


    ```

    $ ranlib libmyrand.a

    $

    ```


    Note that the same thing can be performed using the ar command with the -s option,
    as:


    ```

    $ ar -s libmyrand.a

    $

    ```


    # SUMMARY


    In this chapter, we explored the creation and use of program libraries. Traditional
    static libraries were discussed first, followed by shared libraries and finally
    dynamically loaded libraries. Source code was also investigated to demonstrate
    the methods for creating libraries using the ar command as well as using libraries
    with gcc. Finally, a number of library-based utilities were discussed, including
    ldd, objdump, nm, size, and ranlib.


    # DYNAMIC LIBRARY APIS


    ```

    #include <dlfcn.h>

    void *dlopen(const char *filename, int flag);

    const char *dlerror(void);

    void *dlsym(void *handle, char *symbol);

    int dlclose(void *handle);

    ```'
