    look at each here, but we will primarily focus on the latter mechanism.


    The standard I/O library presents a buffered interface. This has two very important
    properties. System reads and writes are in blocks (typically 8KB in size). Character
    I/O is simply written to the FILE buffer, where the buffer is written to the media
