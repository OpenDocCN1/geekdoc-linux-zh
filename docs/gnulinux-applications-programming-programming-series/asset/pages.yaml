  md: '# 336 GNU/Linux Application Programming


    # cut


    The GNU/Linux cut utility can quickly cut elements of each line in a file using
    one of two types of specification. The user can define the desired data in terms
    of fields in the file or based upon numbered sequences of characters.


    Let''s first look at the basic format of the cut utility and then look at some
    examples of how it can be used. As we discussed, the cut utility can operate in
    two modes. In the first mode, cut extracts based upon field specifications using
    a delimiter character:


    ```

    cut -f[spec] -d[delimiter] file

    ```


    In the second mode, cut extracts based character position specifications:


    ```

    cut -c[spec] file

    ```


    The spec argument is a list of comma-separated ranges. A range can be represented
    as follows (base 1) as shown in Table 19.2.


    # TABLE 19.2 Range Specs for the cut Utility


    | Range | Meaning |

    |---|---|

    | n | Nth character (-c) or field (-f) |

    | n- | Nth character (-c) or field (-f) from the end of the line |

    | n-m | From nth to mth character (-c) or field (-f) |

    | -m | From first to Mth character (-c) or field (-f) |


    Let''s now look at some examples of the cut utility. We''ll explore the field-based
    cut first, using the sample file in Listing 19.2.


    # Listing 19.2 Sample File (passwd) for Field-Based Cutting (on the CD-ROM at
    /source/ch19/passwd)


    ```

    bob:x:500:500::/home/bob:/bin/bash

    sally:x:501:501::/home/sally:/bin/sh

    jim:x:502:502::/home/jim:/bin/tsh

    dirk:x:503:503::/home/dirk:/bin/ash

    ```


    We''ll experiment with interactively, looking now only at the command but exactly
    what cut will produce given the field specification. First, let''s say we'
