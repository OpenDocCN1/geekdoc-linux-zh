    utility, giving an input file representing the regular expressions that recognize
    the tokens of the grammar. The parser is generated from the bison utility, again
    specified by a grammar file. Each of these phases is built together in a single
    image, with connectivity between the two specified by the flex and bison tools
    and also by the developer.'
