  md: '# OPEN SOURCE LICENSES


    Now let''s take a quick look at the free and open source licenses. We''ll look
    at a few different examples that provide different aspects of licensing (from
    preventing commercial distribution to supporting it).


    # GPL


    The GNU General Public License is one of the most popular licenses used in software.
    The GPL provides the user with three basic "rights":


    +   - The right to copy the software and give it away

    - The right to change the software

    - The right to access the source code


    Within these rights is the catch with GPL software. Any changes that are made
    to GPL software are covered by the GPL and must be made available to others in
    source form. This makes the GPL unattractive from a commercial perspective because
    it means that if a company changes GPL software, that source code must be made
    available to everyone (including competitors). This is what''s called the "tainting"
    effect of GPL software. What "touches" GPL software becomes GPL software (otherwise
    known as a derivative work, something derived from the GPL).

    There also exists a variation of the GPL called the LGPL (Library GPL, or what
    is now called the Lesser GPL to indicate the loss of freedom). A library released
    under the LGPL makes it possible for proprietary software to be linked with the
    libraries without the tainting effect. For example, the GNU C library is released
    under the LGPL, allowing proprietary software to be developed on GNU/Linux systems.


    Software built into the Linux kernel is automatically GPL, though differences
    of opinion in the case of kernel modules (which can be viewed both ways). The
    issue of kernel modules has yet to be challenged in court.


    # Qt Public License


    The Qt Public License (QPL) is an oddity in the open source community because
    it breaks the openness created by other public licenses. The QPL permits two types
    of licenses: a free license and a commercial license. In the free version, any
    software that links to the Qt framework may be opened using either the QPL or
    GPL. A developer could instead purchase a commercial license for Qt, which allows
    him to build an application using the Qt framework and keep it closed (it''s not
    required to be released to the open source community).


    From the perspective of openness, "buying-out" of the license makes the Qt framework
    less useful.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# GNU/Linux Application Programming


    # BSD


    If could identify a spectrum of licenses with the GPL on the left, the BSD license
    would exist on the right. The BSD license offers a more commercial friendly license
    because a program can be built with BSD licensed software and not be required
    to be BSD licensed. The BSD community encourages returning modified source code,
    but it''s not required. Despite this, the BSD UNIX operating system is as advanced,
    if not more so, as the GNU/Linux operating system.


    The issue of the BSD license is what''s called forking (two or more versions of
    source code existing from a single source distribution). A commercial incentive
    exists to fork rather than make your hard work available to your competitors.
    The BSD UNIX operating system has been forked into a number of variants, including
    FreeBSD, NetBSD, and OpenBSD.


    The lack of distribution restrictions defines the primary difference between the
    BSD and GPL. GPL specifies that if one uses the GPL in a program, then that program
    becomes a derivative work and therefore GPL itself. BSD has no concept of a derivative
    work, and developers are free to modify and keep their changes.


    # License Summary


    Many licenses exist and can be viewed at the Open Source Initiative or in reference
    [gnu.org04], which also identifies their relation to the GPL and free software.


    How one defines freedom determines how one views these licenses. If freedom means
    access to source code and access to source code that uses the original code, then
    the GPL is the license to use. If freedom is viewed from a commercial perspective
    (the freedom to build a product without distributing any changes to the source
    base), then BSD is a fantastic choice. From our short list, the QPL tries to straddle
    both extremes. If a commercial license is purchased, then the application using
    the Qt (using the so-called free license), source code must be made available.


    The reader is encouraged to read the available references and license resources
    discussed at the end of this section. Like anything legal, nothing is really black
    and white, and a careful review is suggested.


    # Problems with Open Source Development


    It wouldn''t be fair to discuss the open source development paradigm without mentioning
    any of the problems that exist. Open source is a wonderful development paradigm,
    but it does suffer from many of the same problems as proprietary soft-ware development.'
  merge: -1
