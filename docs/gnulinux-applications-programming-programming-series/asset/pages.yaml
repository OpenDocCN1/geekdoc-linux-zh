- img_proc: true
  md: '# 394 GNU/Linux Application Programming


    Parsers are very useful, and we''ll develop many of them in our careers. Though
    few of us will take the task of building full-featured compilers, parsers are
    useful in a variety of areas. For example, configuration files for larger applications
    can require parsers to be built to describe how the application''s behavior is
    specified. The techniques we''ll discuss here make building these kinds of parsers
    a snap.


    The first task in parsing is the tokenization of our input file. In this phase,
    we break out our input file down into its representative chunks. For example,
    breaking down under the C source fragment:


    ```

    if (counter < 9) counter++;

    ```


    ''if'', ''('', ''counter'', ''<'', ''9'', '')'', ''counter'', ''++'', '';''


    That''s quite few tokens, but we''ll see why this is necessary shortly. Identifying
    how the tokens are made up is the specification part of lexical analysis. Further,
    the lexical analyzer will return metadata that describes what was parsed. For
    example, rather than the tokens, additional data is returned, as:


    ```

    IF_TOKEN OPEN_PAREN VARIABLE OP_LESTHAN NUMBER CLOSE_PAREN

    VARIABLE UNARY_INC SEMICOLON

    ```


    This is useful when we''re trying to understand whether the tokens have meaning,
    it''s not important which variable we''re dealing with, but just that we have
    a variable (identified by the VARIABLE token metadata).


    Once we''ve broken down our input file into tokens, these tokens can be passed
    to our grammar parser to understand if they are meaningful. For example, consider
    the following simple grammar to define an if statement:


    ```

    IF_STMT:

    IF_TOKEN OPEN_PAREN TEST CLOSE_PAREN EXPRESSION SEMICOLON

    ```


    This defines an if statement rule (IF_STMT), which specifies that we''ll have
    an IF_TOKEN (if), a test expression surrounded by parents (OPEN_PAREN TEST CLOSE_PAREN),
    followed by an EXPRESS terminated by a SEMICOLON. Further:


    ```

    TEST:

    VARIABLE OPERATOR NUMBER

    OPERATOR:

    OP_EQUALITY | OP_LESTHAN | OP_GREATERTHAN

    ```


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_421_0.png)'
  merge: -1
  pgno: 421
- img_proc: true
  md: '# Parser Generation with flex and bison 395


    defines that our test is represented by a variable, an operator (one of three),
    and a number. Finally, our simple EXPRESSION is:


    ```

    EXPRESSION:

    VARIABLE UNARY_OP

    UNARY_OP:

    UNARY_INC | UNARY_DEC

    ```


    Now that we have our simple grammar rules specified, let''s look at a couple of
    test fragments to see how it works. Consider our original code fragment. Figure
    23.1 illustrates this if statement with its parse tree.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_422_0.png)


    **FIGURE 23.1** Parse tree for a C code fragment.


    We can see in this diagram that each token from our C fragment is correctly recognized
    by our sample grammar. Each token is matched with our syntax and is therefore
    a proper line of C (in this simple example). Now let''s look at another example,
    but in this case, an erroneous one (Figure 23.2).


    In this case, two errors are found. First we parse the TEST subtree and find an
    issue. The TEST is made of a VARIABLE followed by an OPERATOR and ends with a
    number. We find our VARIABLE (counter), but upon recognizing the OPERATOR, we
    find something that is not matched (!=). Since an invalid OPERATOR was defined,
    we''d signal an error and exit (or more intelligently identify the error, then
    try to move on with the parse to see if any other errors are to be found). In
    the next case, we expect an EXPRESS following the CLOSE_PAREN. We try to recognize
    the EXPRESS as a VARIABLE and a UNARY_OP, but instead find a UNARY_OP and a VARIABLE.
    Both elements are recognized, but syntactically, represent an error. Instead of
    finding a VARIABLE, we see a UNARY_OP and signal the error.'
