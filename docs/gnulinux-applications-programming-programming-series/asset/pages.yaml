  md: 'find

    find utility is a powerful complex utility that permits searching the file-system
    for files based upon given criteria. Rather than walk through the plethora of
    options available for find, we''ll demonstrate some of the more useful patterns.

    To find all files in .c and h in the more subdirectory, the following command
    can be:


    ```

    find . -name ''*.[ch]'' -print

    ```


    . . specifies that we want to start at the current subdirectory. The -name argument
    refers to what we are searching for, in this case any (''*'') that ends in either
    c or h. Finally, we specify -print to emit the search results to standard-out.

    For each of the search results, we can execute a command using -exec. This permits
    us to invoke a command on each file that was found based upon the search. For
    example, if we wanted to change the file permissions of all of the files found
    to read-only, we could do the following:


    ```

    find . -name ''*.[ch]'' -exec chmod 444 {} \

    ```


    We can also restrict the type of files that we''ll look at using the type modifier.
    For example, if we wanted to look only regular files (a common occurrence when
    searching for source files), we could do the following:


    ```

    find . -name ''*.[ch]'' -type f -print

    ```


    The f argument to -type represents regular files. We could also look specifically
    for directories, symbolic links, or special devices. Table 19.3 provides the type
    modifiers that are available.


    TABLE 19.3 Type Modifiers Available to find (-type)


    | Modifier | Description |

    |---|---|

    | b | Block Device |

    | c | Character Device |

    | d | Directory |

    | p | Pipe (named FIFO) |

    | f | Regular File |

    | 1 | Symbolic Link |

    | s | Socket |'
