    #


    We begin by running the application (called sigtest) in the background (via the
    & symbol). We see the expected outputs from the child and parent processes identifying
    that the fork has occurred and both processes are now active and awaiting signals
    at the respective pause calls. We use the kill command with the signal of interest
    (-10, or SIGUSR1) and the process identifier to which to send the signal. In this
    case, we send the first SIGUSR1 to the parent process. The parent immediately
    identifies receipt of the signal via the handler, but note that it executes within
    the context of the parent process (as identified by the process ID of 2052). The
    parent then returns from the pause function and awaits the exit of the child via
    the wait function. We then send SIGUSR1 signal to the child using the kill command,
    we direct the child by its process ID (20153). The child also indicates receipt
    of the signal handler and in its own content. The child exits and permits the
    parent to return from the wait function and mechanism.


    Despite the simplicity of the signals mechanism, it can be quite a powerful method
    to communicate with processes in an asynchronous fashion.


    # pause


    The pause function is used to suspend the calling process until a signal is received.
    Once the signal is received, the calling process continues from the pause function,
    permitting it to continue. The prototype for the pause API function is:


    ```

    int pause( void );

    ```


    If the process has installed a signal handler for the signal that was caught,
    then the pause function returns after the signal handler has been called and returns.


    # kill


    The kill API function is used to raise a signal to a process or set of processes.
    A return of zero indicates that the signal was successfully sent, otherwise –1
    is returned. The kill function prototype is:


    ```

    int kill( pid_t pid, int sig_num );

    ```


    The sig_num argument represents the signal to send. The pid argument can be a
    variety of different values (as shown in Table 13.9).'
