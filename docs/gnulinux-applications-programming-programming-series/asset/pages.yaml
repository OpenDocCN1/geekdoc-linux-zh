  md: '# KEY FEATURES!


    # GNU/LINUX APPLICATION PROGRAMMING


    +   * Focuses on GNU/Linux, not only the Linux APIs, but the GNU tools and libraries
    that make Linux programming possible


    +   * Covers a variety of useful APIs for process management, shared memory, message
    queues, semaphores, POSIX, file handling, sockets, and more


    +   * Provides detailed discussion of scripting and integration with the GNU/Linux
    environment with bash, including useful commands


    +   * Introduces developers to the lowest layers of GNU/Linux (kernel, device
    drivers, modules) to the user layer (applications, libraries, tools)


    +   * Explores the multiprocess and multithreaded programming APIs, including
    debugging applications with the GNU Debugger


    +   * Includes a CD-ROM with code snippets for all the detailed APIs and the figures
    from the book


    M. Tim Jones


    The wide range of applications available in GNU/Linux includes not only pure APIs,
    but also tools and utilities for the GNU/Linux environment. GNU/Linux Application
    Programming takes a holistic approach to developing the ins-and-outs of GNU/Linux
    programming using APIs, communication, and scripting. Covering a variety of topics
    to GNU/Linux programming, the book is split into six parts: The GNU/Linux Operating
    System, GNU Tools, Application Development, Advanced Topics (including communication
    and synchronization and distributed computing), Debugging GNU/Linux Applications,
    and Scripting.


    The book introduces programmers to the environment from the lowest layers (kernel,
    device drivers, modules) to the user layer (applications, libraries, tools) using
    an evolutionary approach that builds knowledge to cover the more complex aspects
    of the operating system. Through a readable, code-based style developers will
    learn about the relevant topics of file handling, pipes and sockets, processes
    and POSIX threads, interprocess communication, and other development topics. After
    working through the text, they’ll have the knowledge base and skills to begin
    developing applications in the GNU/Linux environment.


    > On the CD! (see Appendix B for more details)


    +   * SOURCE CODE Includes code examples for all the detailed APIs from the book


    +   * FIGURES Includes all of the figures from the book


    SYSTEM REQUIREMENTS PC: Linux with 2.4 or 2.6 Kernel (tested with Red Hat and
    Fedora) Pentium I or greater; CD-ROM drive; Hard drive; 256MB of RAM; 1MB hard
    drive for the code examples.


    # ABOUT THE AUTHOR


    M. Tim Jones (Longmont, CO) is a successful software engineer and the author of
    TCP/IP Application Layers for Embedded Systems, BSD Sockets Programming for a
    Multi-Language Environment, and Application Programming. His articles have appeared
    in Dr Docs, Embedded Systems Programming, Cell, and The Embedded Linux Journal.


