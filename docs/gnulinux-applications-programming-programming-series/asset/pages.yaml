  md: '# Other Application Development Topics 325


    The mlockall API function locks all memory (disable paging) for a process''s entire
    memory. This includes not only the code and data for the process, but also its
    stack, shared libraries, shared memory, and other memory mapped files.


    The mlockall function takes a single argument, which represents the scope of the
    lock to be provided. The user can specify MCL_CURRENT, which locks all pages that
    are currently mapped into the address space of the process, or MCL_FUTURE, which
    locks all pages that are mapped into the address space of the process in the future.
    For example:


    ```

    /* Lock currently mapped pages */

    mlockall(MCL_CURRENT);

    ```


    ```

    /* Lock all future pages */

    mlockall(MCL_FUTURE);

    ```


    We can also define that all current and future pages are locked into memory performing
    a bitwise OR of the flags together, such as:


    ```

    mlockall( MCL_CURRENT | MCL_FUTURE );

    ```


    If insufficient memory is available to lock the current set of pages, an ENOMEM
    error is returned. If MCL_FUTURE is used, and insufficient memory exists to lock
    a growing process stack, the kernel will throw a SIGSEGV (segment violation) signal
    for the process, causing it to terminate.


    The munlockall system call reenables paging for the pages mapped for the calling-process.
    It takes no arguments and returns zero on success:


    ```

    /* Unlock the pages for this process */

    munlockall();

    ```


    The munlockall system call should be called once the process has completed its
    real-time processing.


