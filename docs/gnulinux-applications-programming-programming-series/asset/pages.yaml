  md: '# Parsing Command-Line Options with getopt and getopt_


    The getopt function provides a simplified API for extracting command-line arguments
    and their options from the command line. Most arguments take the form


    ```

    <application> -f <arg>

    ```


    where -f is a command-line option and <f-arg> is the option for -f. Function getopt
    can handle much more complex argument arrangements, as we''ll see in this section.


    The function prototype for the getopt function is provided as:


    ```

    #include <unistd.h>

    int getopt(int argc, char * argv[], const char *optstring);

    extern char *optarg;

    extern int optarg, optind;

    ```


    The getopt function takes three arguments; the first two are the argc and argv
    arguments that are received through main. The third argument, optstring, represents
    our options that we''ll accept for our application. The optstring string has a
    special form. We define the characters that we''ll accept as our options, and
    for each option that has an argument, we''ll follow it with a :. Consider the
    following option string:


    ```

    "abc:d"

    ```


    This will parse options such as -a, -b, -d, and also -c <arg>. We could also provide
    a double-colon, such as "abc::d", which tells getopt that c uses an optional argument.
    The getopt function returns an int that represents the character option. With
    this, three external variables are also provided as part of the getopt API. These
    are optarg, optopt, and optind. The optarg variable points to an option argument
    and is used to extract the option when one is expected. The optopt variable specifies
    the option that is currently being processed. The return value of getopt represents
    the variable. When getopt is finished parsing (returns -1), the optind represents
    the index of those command line that were not parsed. For example, if a set of
    arguments are provided on the command line without any -options, then these arguments
    can be retrieved via the optind argument (we''ll see an example of this shortly).


    The application developer must ensure that all options that are specified for
    the application. The getopt function will provide the parsing aspect of command-line
    arguments, but the application must determine whether the options specified are
    accurate.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_337_0.png)'
