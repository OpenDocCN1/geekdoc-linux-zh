- img_proc: true
  md: '# 210 GNU/Linux Application Programming


    To know which threads library is used, issue the following command:


    $ getconf GNU_LIBTHREAD_VERSION

    This will provide either LinuxThreads or NPTL, each with a version number.


    # What''s a Thread?


    To define a thread, let''s look back at Linux processes to understand their makeup.
    Both processes and threads have control flows and can run concurrently, but they
    differ in some very distinct ways. Threads, for example, share data, where processes
    explicitly don''t. When a process is forked (recall from Chapter 12, “Introduction
    to Sockets Programming\”), a new process is created with its own globals and stack
    (see Figure 14.1). When a thread is created, the only new element created is a
    stack that is unique for the thread (see Figure 14.2). The code and global data
    are common between the threads. This is advantageous, but the shared nature of
    threads can also be problematic. We''ll investigate this later in the chapter.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_237_0.png)


    FIGURE 14.1 Forking a new process.


    A GNU/Linux process can create and manage numerous threads. Each thread is identified
    by a thread identifier that is unique for every thread in a system. Each thread
    also has its own stack (as shown in Figure 14.2) and also a unique context (program
    counter, save registers, and so forth). But since the data space is shared by'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Process A Address Space


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_238_0.png)


    FIGURE 14.2 Creating a new thread.


    threads, they share more than just user data. For example, file descriptors data
    space or sockets are shared also. Therefore, when a multithreaded application
    uses a socket or file, the access to the resource must be protected against multiple
    accesses. We''ll look at methods for achieving that in this chapter.


    While writing multithreaded applications can be easier in some ways than traditional
    process-based applications, there are problems to understand. The shared data
    aspect of threads is probably the most difficult to design around, but it is also
    powerful and can lead to simpler applications with higher performance. The key
    is to strongly consider shared data while developing threaded applications. Another
    important consideration is that serious multithreaded application development
    should utilize the 2.6 kernel rather than the 2.4 kernel (given the new NPTL threads
    implementation).'
