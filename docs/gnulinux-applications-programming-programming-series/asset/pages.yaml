    analyzer. It accepts the tokens recognized by the lexer and matches them with
    the grammar symbols to identify a properly structured input. The bison tool builds
    a bottom-up parser and, using a process known as shift-reduce, attempts to map
    all of the lexer data to grammar symbols.


