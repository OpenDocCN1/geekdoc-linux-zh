  md: '# 1 GNU/Linux History


    In This Chapter


    +   - UNIX History

    - Richard Stallman and the GNU Movement

    - Linus Torvalds and the Linux Kernel


    # INTRODUCTION


    Before we jump into the technical aspects of GNU/Linux, let''s invest a little
    time in the history of the GNU/Linux operating system (and why we use the term
    GNU/Linux). We''ll review the beginnings of the GNU/Linux operating system by
    looking at its two primary sources and the two individuals who made it happen.


    # HISTORY OF THE UNIX OPERATING SYSTEM


