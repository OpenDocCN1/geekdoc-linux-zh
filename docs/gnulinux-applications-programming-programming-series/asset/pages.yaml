  md: '# 334 GNU/Linux Application Programming


    The . / tells the interpreter the shell we are invoking is located in the current
    directory. Otherwise, we''d get an error message telling us that the path could
    not be found.


    Two special directory files exist that are important in Linux development. The
    . file represents the current directory, while the .. represents the parent directory.
    For example, if we provide the command cd .. , there''s no visible change because
    we''ve changed our current directory to the current directory. More interesting,
    the cd .. command changes the current directory to the parent directory. These
    special files can be seen by viewing the current subdirectory with ls -la.


    If this is undesirable, we could easily update our path environment variable to
    add our current working subdirectory as:


    ```

    $ export PATH=$PATH:./

    $ echo $PATH

    /usr/local/bin:/bin:/bin:/usr/usr/X1R6:/home/mtj/bin/:

    ```


    The script.sh can now be invoked directly without needing prefix .


    File links are special files that are used to provide a reference to another file.
    Two types of links exist: hard links and soft links (otherwise known as symbolic
    links). A hard link is a new entry in the directory file that points to an existing
    file. The hard link is indistinguishable from the original file. The problem with
    hard links is that they must reference files within the same filesystem. Soft
    links are regular files themselves and simply contain a pointer to the actual
    file. Soft links can be absolute (to point to a file with a full path) or relative
    (the path being relative from the current location). Soft links can be moved,
    while retaining their linkage to the original file. Note that the special . and
    .. are in fact hard links to the absolute directories.


    The ln command can be used to construct symbolic links.


    # GNU/Linux Commands


    Now that we have some basic understanding of redirection and the standard I/O
    descriptors (stdin, stdout, stderr), let''s explore the more useful of the GNU/Linux
    commands. We''ll take an interactive approach for investigating these commands,
    compared to simply telling you what the command does and all the available options
    for it. The commands are in no particular order, and therefore you can explore
    each command independently of any other if desired.'
