    ```

    # objdump --disassemble test.o

    ```


    This provides a list of the functions found in the object, along with the instruc-

    tions that were generated for each GCC.

    Finally, the nm utility can also be used to understand the symbols that are

    present in an object file. This utility lists not only each symbol but also detailed

    information on the type of the symbol. Numerous other options are available,

    which can be found in the nm main page.


    # SUMMARY


    In this chapter, we explored the GCC compiler and some of the related tools. We

    investigated some of the commonly used patterns with GCC and detailed the use
