    # expect Utility


    The expect utility has found use wide in the testing domain. expect is an application
    that scripts programmed dialogues with interactive programs. Using expect, we
    can spawn an application and then perform a script consisting of dialogue with
    the application. This dialogue consists of a series of statements and expected
    responses. In the test domain, the statements are the stimulus to the application,
    and the expected response is what we expect from a valid application under test.


    Expect utility can even talk to numerous applications at once and has a very rich
    structure for application test.


    Consider the following test in Listing 24.10. At line 3, we set an internal variable
    timeout to 1. This tells expect that when the timeout keyword is used, the time
    will represent 1 second (instead of the default of 10 seconds). Next, we declare
    a procedure called sendexpect. This function provides both the send and expect
    behaviors in one function. It sends the out string (argument one) to the attached
    process. If we receive the expect function in this case uses the pattern match
    behavior. Two possibilities exist for what we expect as input from the string
    (argument 2 of the sendexpect procedure), then we''ve received what we expected
    and emitted a passed message. Otherwise, we wait, and when the timeout occurs,
    we call it a failure and exit.


    At line 14, we spawn our test process (in this case we are testing the calculator).
    We then emit an indicator to stdout, indicating that the bc has started (line
    17). At this point, we begin our test. Using the sendexpect procedure, we send
    a command to the application and then provide what we expect as a response. Since
    we''re testing the calculator process, we provide a slightly more complex function
    example (lines 20–22), followed by a slightly more quit command, expecting expect
    (an indication that the bc application terminated).


