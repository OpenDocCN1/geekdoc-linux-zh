    int cline;

    cliLen = sizeof(struct sockaddr_in);

    clisock = accept(servsock, (struct sockaddr*)cliaddr, &cliLen);

    ```


    The call to accept will block until a client connection is available. Upon return,
    the clisock return value will contain the value of the new client socket, and
    cliaddr will represent the address for the client peer (host address and port
    number).

    The alternate example is commonly found when the server application isn''t interested
    in the client information. This one typically appears as:


    ```

    clisock = accept(servsock, (struct sockaddr*)NULL, NULL);

    ```'
