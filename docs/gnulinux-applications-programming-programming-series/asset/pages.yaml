  md: '# TABLE 16.3 Semaphore Internal Values


    | Parameter | Default Value |

    | --- | --- |

    | sem_perm.cuid | Effective User ID of the calling process (creator) |

    | sem_perm.uid | Effective User ID of the calling process (owner) |

    | sem_perm.cgid | Effective Group ID of the calling process (owner) |

    | sem_perm.mode | Permissions (lower 9 bits of semfig) |

    | sem_nms | Set to the value of nse |

    | sem_otime | Set to zero (last semop time) |

    | sem_ctime | Set to the current time (create time) |


    The process can override some of these parameters. We''ll explore this later in
    our discussion of semctl.


    # semctl


    The semctl API function provides a number of control operations on semaphores
    or semaphore arrays. Example functionality ranges from setting the value of the
    semaphore (as shown in Listing 16.6) to removing a semaphore or semaphore array
    (see Listing 16.7). We''ll look at these and other examples in this section.

    The function prototype for the semctl call is shown below:


    ```

    int semctl(int semid, int semnum, int cmd, ... );

    ```


    The first argument defines the semaphore identifier, the second, the number of
    interest, the third command to be applied, and potentially another argument (usually
    defined as a union). The operations that can be performed are shown in Table 16.4.

    We''ll now look at examples of each of these operations in semctl, focusing on
    semaphore array examples where applicable. In our first example, we''ll illustrate
    setting a semaphore value and returning its value. In this example, we first set
    the value of the semaphore to 10 (using the command SETVAL) and then read it out
    using GETVAL. Note that the semnum argument (argument 2) defines an individual
    semaphore. Later on, we''ll look at the semaphore array case with GETALL and SETALL.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# TABLE 16.4 Operations That Can Beformed Using semctl


    | Command | Description | Fourth Argument |

    | --- | --- | --- |

    | GETVAL | Return the semaphore value. | |

    | SETVAL | Set the semaphore value. | int |

    | GETPID | Return the pid that last operated on the semaphore (semop). | |

    | GETNCNT | Return the number of processes awaiting the defined semaphore to increase
    in value. | int |

    | GETZCNT | Return the number of processes awaiting the defined semaphore to become
    zero. | int |

    | GETALL | Return the value of each semaphore in a semaphore array. | u_short*
    |

    | SETALL | Set the value of each semaphore in a semaphore array. | u_short* |

    | IPC_STAT | Return the effective user, group, and permission for a semaphore.
    | struct semid_t* |

    | IPC_SET | Set the effective user, group, and permissions for a semaphore. |
    struct semid_t* |

    | IPC_RMID | Remove the semaphore or semaphore-array. | |


    ```

    int semid, ret, value;

    ...

    /* Set the semaphore to 10 */

    ret = semctl(semid, 0, SETVAL, 10 );

    ...

    /* Read the semaphore value (return value) */

    value = semctl(semid, 0, GETVAL );

    ```


    The GETPID command allows us to identify the last process that performed a semop
    on the semaphore. The process identifier is the return value, and argument 4 is
    not used in this case.


    ```

    int semid, pid;

    ...

    pid = semctl( semid, 0, GETPID );

    ```'
