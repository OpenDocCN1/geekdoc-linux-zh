    # Using Breakpoints


    The primary strategy for debugging with GDB is the use of breakpoints to stop
    the running program and allow inspection of the internal data. A breakpoint can
    be set in a variety of ways, but the most common is specifying a function name.
    Here, we tell GDB to break at our main program:


    ```

    (gdb) break main

    Breakpoint 1 at 0x804855b: file testapp.c, line 79.

    (gdb) run

    Starting program: /home/mtj/gnulux/ch25/testapp

    ```


    ```

    Breakpoint 1, main () at testapp.c:79

    79    initStack(&stack);

    (gdb)

    ```


    Once we give the break command, GDB tells us our breakpoint number (since we may
    set multiple) and the address, filename, and line number of the breakpoint. We
    then start our application using the run command, which results in hitting our
    previously set breakpoint. Once the breakpoint is hit, GDB shows the line that
    will'
  merge: -1
  pgno: 469
- img_proc: true
  md: '# Debugging with GDB 443


    be executed next. Note that this statement, line 79, is the first executable statement
    of our application.


    > Recall that in all C applications, the main function is the user entry point
    to the application, but various other work goes behind the scenes to start and
    end the program. Therefore, when we break at the main function, we break at our
    user entry point, but not the true start of the application.


    We can view the available breakpoints using the info command:


    ```

    (gdb) info breakpoints

    Num Type Disp Enb Address What

    1 breakpoint keep y 0x0804855b in main at testapp.c:79

    breakpoint already hit 1 time

    (gdb)

    ```


    We see our single breakpoint and an indication from GDB that this breakpoint has
    been hit.

    If our breakpoint is of no use now, we remove it using the clear command:


    ```

    (gdb) clear 79

    Deleted breakpoint 1

    (gdb)

    ```


    Other methods for setting breakpoints are shown in Table 26.1.


    # TABLE 25.1 Available Methods for Setting Breakpoints


    | Command | Breakpoint Method |

    | --- | --- |

    | break function | Set a breakpoint at a function |

    | break file:function | Set a breakpoint at a function |

    | break line | Set a breakpoint at a line number |

    | break file:line | Set a breakpoint at a line number |

    | break address | Set a breakpoint at a physical address |


    One final interesting breakpoint method is the conditional breakpoint. Consider
    the following command:'
