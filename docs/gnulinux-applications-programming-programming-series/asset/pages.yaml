  md: "# Configuring a Semaphore\n\nWhile there are a number of elements that can\
    \ be configured for a semaphore, let's look here specifically at reading and writing\
    \ the value of the semaphore (the current count).\n\nIn the first example, Listing\
    \ 16.5, we'll demonstrate reading the current value of the semaphore. We achieve\
    \ this using the `semctl` API function.\n\n+   **Listing 16.5** Retrieving the\
    \ Current Semaphore Count (on the CD-ROM at ./source/ch16-semcd.c)\n\n```\n1:\
    \ #include <stdio.h>\n2: #include <sys/sem.h>\n3: #include <stdlib.h>\n4: #include\
    \ \"common.h\"\n5: \n6: int main()\n7: {\n8: int semid, cnt;\n9: \n10: /* Get\
    \ the semaphore with the ID MY_SEM_ID */\n11: semid = semget(MY_SEM_ID, 1, 0);\n\
    12: \n13: if (semid >= 0) {\n14: \n15: /* Read the current semaphore count */\n\
    16: cnt = semctl(semid, 0, GETVAL );\n17: \n18: if (cnt != -1) {\n19: \n20: printf(\"\
    semcd: current semaphore count %d.\\n\", cnt);\n21: \n22: }\n23: \n24: }\n25:\
    \ \n26: return 0;\n27: }\n```\n\nReading the semaphore count is performed at line\
    \ 16. We specify the semaphore identifier, the index of the semaphore (0), and\
    \ the command (GETVAL). Note that the semaphore is identified by an index because\
    \ it could represent an array of semaphores (rather than one). The return value\
    \ from this command is either -1 for error or the count of the semaphore."
