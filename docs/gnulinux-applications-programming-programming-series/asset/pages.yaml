  md: '# Application Development Topics


    +   - Chapter 10: "File Handling in GNU/Linux"

    - Chapter 11: "Programming with Pipes"

    - Chapter 12: "Introduction to Sockets Programming"

    - Chapter 13: "GNU/Linux Process Model"

    - Chapter 14: "POSIX Threads (Pthreads) Programming"

    - Chapter 15: "IPC with Message Queues"

    - Chapter 16: "Synchronization with Semaphores"

    - Chapter 17: "Shared Memory Programming"

    - Chapter 18: "Other Application Development Topics"


    In this part of the book, we will review a number of important topics that are
    important to application development. This includes using the most important elements
    of GNU/Linux including various IPC mechanisms, Sockets, and multiprocess multithreaded
    programming.


    # Chapter 10, "File Handling in GNU/Linux"


    The file handling APIs are important in GNU/Linux because there are patterns for
    many other types of I/O, such as sockets and pipes. This chapter demonstrates
    the proper use of the file handling APIs using binary, character, and string interfaces.
    Numerous examples illustrate the APIs in their different modes.


    # Chapter 11, "Programming with Pipes"


    The pipe model of communication is an older aspect of UNIX, but it is still an
    important one, considering its wide use in shell programming. The pipe model is
    first reviewed, with discussion of anonymous and named pipes. The API to create
    pipes is discussed, along with examples of using pipes for multiprocess communication.
    Shell-level creation and use of pipes complete this chapter.'
  merge: -1
