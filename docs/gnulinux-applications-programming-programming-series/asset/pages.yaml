    # Shared Memory APIs


    Now that we have a quick review behind us, let''s dig down further into the APIs.
    Table 17.1 provides the shared memory API functions, along with their basic uses.


    TABLE 17.1 Shared Memory API Functions and Uses


    | API Function | Uses |

    |---|---|

    | shmget | Create a new shared memory segment<br>Get the identifier for an existing
    shared memory segment |

    | shmctl | Get info on a shared memory segment<br>Set certain info on a shared
    memory segment<br>Remove a shared memory segment |

    | shmat | Attach to a shared memory segment |

    | shmdt | Detach from a shared memory segment |


    We''ll address these API functions now in detail, identifying each of their uses
    with example source.


    # shmget


    The shmget API function (like semget and msqget) is a multiro function. First,
    it can be used to create a new shared memory segment, and second, it can be used
    to get the ID of an existing shared memory segment. The result of the shmget API
    function (in either role) is a shared memory segment identifier that is to be
    used in all other shared memory functions. The prototype for the shmget function
    is-defined as:'
