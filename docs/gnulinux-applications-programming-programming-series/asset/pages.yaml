    # Using a Shared Memory Segment


    Shared memory can be a powerful mechanism for communication and coordination between
    processes. With this power comes some complexity. Since shared memory is a resource
    that''s available to all processes that attach to it, we must coordinate access
    to it. One mechanism is to add a semaphore to the shared memory segment. If the
    segment represents multiple contexts, multiple semaphores can be created, each
    coordinating its respective access to a portion of the segment.


    Let''s look at a simple example of coordinating access to a shared memory segment.
    Listing 17.10 illustrates a simple application that provides for creating, using,
    and removing a shared memory segment. As we''ve already covered the creation and
    removal aspects in detail (lines 31–58 for creation and lines 137–158 for remove),
    we use the scenario (lines 59–111) which we will focus on.


    Our block (which represents our shared memory block) is typed''d at lines 11–15.
    It contains our shared structure (string), a counter (as the index to our string),
    and our semaphore to coordinate access. Note that this was loaded into our shared
    structure at line 48.


    Our scenario begins by grabbing the user character passed as the second argument
    from the command line. This is the character we''ll place into the buffer on each
    pass. We invoke this twice with different characters to see each access the shared
    structure in a synchronized way. After getting the shared memory key (via shmget
    at line 69), we attach to the semaphore at line 72. The return value is the address
    of our shared block, which we cast to our block type (MY_BLOCK_TYPE). We then
    loop through a count of 2500, each iteration acquiring the semaphore, loading
    our character into the string array of the shared memory segment (critical section),
    and releasing the semaphore


