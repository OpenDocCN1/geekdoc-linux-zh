    # Options Available for gcov


    Now we''ve seen gcov in action in a few scenarios, let''s look at gcov''s full
    list of options (see Table 7.1). The gcov utility is invoked with the source file
    to be annotated, as:


    ```

    gcov [options] sourcefile

    ```


    TABLE 7.1 gcov Utility Options

    | Option | Purpose |

    | -v, -version | Emit version information (no further processing). |

    | -h, -help | Emit help information (no further processing). |

    | -b, -branch-probabilities | Emit branch frequencies to the output file (with
    summary). |

    | -c, -branch-counts | Emit branch counts rather than frequencies. |

    | -n, -no-output | Do not create the gcov output file. |

    | -l, -long-file-names | Create long filenames. |

    | -f, -function-summaries | Emit summaries for each function. |

    | -o, -object-directory | Directory where .bb, .bbg, and .da files are stored
    |


    From Table 7.1, we can see a short letter option, and a longer option. The short
    option is useful when using gcov from the command line, but when gcov is part
    of a Makefile, the longer options should be used as they''re more descriptive.
    To retrieve version information about the gcov utility, the -v option is used.
    Since gcov is tied to a given compiler tool chain (it''s actually built from the
    gcc tool source chain), the versions for gcc and gcov will be identical.


    An introduction to gcov and option help for gcov can be displayed using the -h
    option.

    The branch probabilities can be emitted to the annotated source file using the
    -b option (see the section “Looking at Branch Probabilities,” earlier in this
    chapter). Rather than producing branch percentages, branch counts can be emitted
    using the -c option.

    If the annotated source file is not important, the -n option can be used. This
    can be useful all that''s important to understand the test coverage of the source.
    This information is emitted to standard-out.'
