  md: '# 84 GNU/Linux Application Programming


    When including source header files, it can be useful to use the -l option to produce
    long filenames. This helps make filenames unambiguous if multiple source files
    include headers containing source (each getting its gcov annotated stand-out header
    file).


    Coverage information can be emitted for each function rather than the entire application
    using the -f option. This is discussed in the section "Incomplete Execution Coverage,"
    earlier in this chapter.


    The final option, -o, tells where the gcov object files are stored. By default,
    gcov will look for the files in the current directory. If they''re elsewhere,
    this option specifies where gcov can find them.


    # Considerations


    Certain capabilities should be avoided when using gcov for test coverage. Since
    optimization can result in source lines being moved or removed, coverage is less
    meaningful. Coverage testing is also less meaningful when using source macro expansion
    in the source after the preprocessor stage. These aren''t shown in gcov and therefore
    miss identification of full test coverage.


    For GNU/Linux kernel developers, gcov can be used for certain architectures within
    the kernel. A patch is available from IBM to allow gcov use in the kernel. Its
    availability is provided in the Resources section.


