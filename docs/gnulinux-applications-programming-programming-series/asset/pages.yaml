  md: '# 20 GNU/Linux Application Programming


    # Open Source versus Free Software


    Before we discuss free software, let''s first cover one of the many religious
    debates that exist. Open source was a term coined by Eric Raymond with the creation
    of the Open Source Initiative (OSI) in 1997. The term free software was coined
    by Richard Stallman with the release of the GNU Project in 1984 and the founding
    of the Free Software Foundation in 1985.


    While the two terms appear to be similar, and most open source software is released
    under the GPL (also created by Stallman), the debate is over the motivation for
    the release of open software. Richard Stallman defines it: "Open source is a development
    methodology; free software is a social movement" [Stallman04]. Raymond has also
    been criticized by many for hijacking the free software movement (13 years after
    it was originally created) [Raymond04].


    # Anatomy of a Free Software Project


    Free software (including open source) is simply a set of useful source code that
    is licensed under a free software license such as the GNU General Public License
    (or GPL). Popular Web sites like SourceForge and Freshmeat provide a means to
    make free software available to the Internet community. In addition providing
    means for others to find free software, these sites also serve as a meeting place
    for free software developers. Developers can create new free projects or join
    existing projects. This is the essence of free software: developers coming together
    to build software that is both useful and free to the wider community.


    The fact that source code is available means that if something doesn''t work the
    way it should, it can be modified to suit the needs of others. The availability
    of open source also solves the myth of proprietary software, called "security
    through obscurity." Companies believe that their software isn''t provided in source
    form, it''s what happens in free software is that since it''s open, exploits are
    found and fixed faster, making them less likely to be exploited as the distribution
    of the software widens. Proprietary software is quickly proving that obscurity
    does not provide security.


