- img_proc: true
  md: '# Compiler Support


    The compiler itself can be an invaluable tool to identify issues in our code.
    When we build software, we should always enable warnings using the -Wall flag.
    To further ensure that warnings aren''t missed in large applications, we can enable
    the -Werror flag, which treats warnings as errors and halts further compilation
    of a source file. When building an application that has many source files, this
    combination can be beneficial. This is demonstrated as:


    ```

    gcc -Werror test.c -o test

    ```


    If we want our source to use ANSI compatibility, we can enable checking for ANSI
    compliance (with pedantic checking) as:


    ```

    gcc -ansi -pedantic test.c -o test

    ```


    Identifying uninitialized variables is a very useful test, but in addition to
    the warning option, optimization must also be enabled, because the data flow information
    is available only when the code is optimized:


    ```

    gcc -Wall -O -Winitialized test.c -o test

    ```


    Chapter 4, “The GNU Compiler Toolchain,” provides additional warning information.
    The gcc main page also contains numerous warning options as those enabled via
    -Wall.


    # SOURCE CHECKING TOOLS


    To identify security vulnerabilities as well as common programming mistakes, source-checking
    tools should be part of the development process. In addition to being simple to
    use, they can easily be automated as part of the build process. One important
    note when using source checking tools is that while they can identify flaws, they
    can also miss them. Therefore, use your best judgment when using the tools, and
    always know your source.


    The splint tool (short for secure programming lint) is a static source checking
    tool built by the Inexpensive Program Analysis group at the University of Virginia.
    It provides strong and weak checking of source and, with annotation, can perform
    a very complete analysis of source.


    With unannotated source, the -weak option can be used (with header files found
    in the ./inc subdirectory):


    ```

    splint -weak *.c -I./inc

    ```'
