    # Reporting Errors


    The reporting of errors is an interesting topic because the policy''s chosen can
    be very different, depending upon the type of application we''re developing. For
    example, if we''re writing a command-line utility, emitting error messages to
    stderr is a common method to communicate errors to the user. But what happens
    if we''re building an application that has I/O capabilities, such as an embedded
    Linux application? There are a number of possibilities, including the generation
    of a specialized log or use of the standard log (syslog). The syslog function
    has the prototype:


    ```

    #include <syslog.h>

    void syslog(int priority, char *format, ... );

    ```


    To the syslog function, we provide a priority, a format, and some arguments (similar
    to printf). The priority can be one LOG_EMERG, LOG_ALERT, LOG_CRIT, LOG_WARNING,
    LOG_INFO, or LOG_DEBUG. An example of using syslog to generate a message to the
    system log is shown in Listing 26.2.


    **Listing 26.2** Simple Example of syslog Use (on the CD-ROM at ./source/ch26/simpsyslog.c)


    ```

    1: #include <syslog.h>

    2:

    3: int main()

    4: {

    5:

    6: syslog(LOG_ERR, "Unable to load configuration!");

    7:

    8: return 0;

    9: }

    ```


    This results in our system log (stored within our filesystem at /var/log/messages)
    being updated as:


    Jul 21 18:13:10 slstest: Unable to load configuration!


    In this example, our application in Listing 26.2 was called slstest, with the
    hostname of camus. The system log can be especially useful because it''s the aggregate
    of many error reports. This allows a developer to see where a message was generated
    in relation to others, which can be very useful in helping to understand problems.'
