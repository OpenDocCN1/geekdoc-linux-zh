  md: "# Mapping Memory with mmap\n\nWhile not completely related to shared memory,\
    \ the mmap API function provides the means to map file contents into user program\
    \ space. The prototype function for mmap (and munmap to unmap the memory) is defined\
    \ as:\n\n```\n#include <sys/mman.h>\nvoid mmap(void *start, size_t length, int\
    \ prot, int flags,\n    int fd, off_t offset);\nint munmap(void *start, size_t\
    \ length);\n```\n\nThe mmap function takes a file offset (offset) and tries to\
    \ map it to the address defined by the caller (start) from the file descriptor\
    \ fd (we'll look at what this means shortly). Commonly, the start address is defined\
    \ as NULL, allowing mmap to map it to whatever local address it chooses. This\
    \ address (local mapping) is returned by the mmap function. The length of the\
    \ region is defined by lengt. The caller defines the memory protection through\
    \ the prot argument, which can be PRO_EXEC (region may be executed), PRO_READ\
    \ (region can be read), PRO_WRITE (region may be written), or PRO_NONE (pages\
    \ can't be accessed). Limitations of protections can be defined. Finally, the\
    \ type of mapped object is defined by the flags argument. It can be MAP_FIXED\
    \ (fail if the start address can't be used for the local mapping), MAP_SHARED\
    \ (this mapping with other processes), or MAP_PRIVATE (create a copy-on-write\
    \ mapping). The caller must specify MAP_SHARED or MAP_PRIVATE.\n\nThe offset and\
    \ start arguments must be on page boundaries. The length argument should be a\
    \ multiple of the page size.\n\nGNU/Linux also provides some other nonstandard\
    \ flags that are defined in Table 18.2.\n\n# TABLE 18.2 Nonstandard Flags for\
    \ mmap\n\n| Flag | Use |\n|---|---|\n| MAP_NORESERVE | Used with MAP_PRIVATE to\
    \ instruct the kernel not to reserve swap space for this region. |\n| MAP_GROWSDOWN\
    \ | Used by the kernel for stack allocation. |\n| MAP_ANONYMOUS | This region\
    \ is not backed by a file (fd and offset arguments of mmap are therefore ignored).\
    \ |"
