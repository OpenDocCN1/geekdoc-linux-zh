  md: '# 272 GNU/Linux Application Programming


    If no semop has been performed on the semaphore, the return value will be zero.


    To identify value semaphores that are currently awaiting a semaphore to increase
    in value, we can use the GETCNT command. We can also identify the number of processes
    that are awaiting the semaphore value to become zero using GETZCNT. Both of these
    commands are illustrated below for the semaphore number-zero:


    ```

    int semid;

    /* How many processes are awaiting this semaphore to increase */

    count = semct1(semid, 0, GETCNT);

    /* How many processes are awaiting this semaphore to become zero */

    count = semct1(semid, 0, GETZCNT);

    ```


    Now let''s look at an example of some semaphore array operations. Listing 16.8
    illustrates the SETVAL and GETVAL commands with semct1.

    In this example, we''ll create a semaphore array of 10 semaphores. The creation
    of the semaphore array is performed at lines 20-21 using the semget API function.
    Note that since we''re going to create and remove the semaphore array within this
    same function, we use no key and instead use the IPC_PRIVATE key. Our MAX_SEMAPHORES
    symbolic defines the number of semaphores that we''ll create, and finally specify
    that we''re creating the semaphore array (IPC_CREAT) with the standard permissions.


    Next, we initialize our semaphore value array (lines 26–30). While this is not
    a traditional example, we initialize each semaphore to one plus its semnum (so
    semaphore has a value of one, semaphore has a value of two, and so on). We do
    this so we can inspect the value array later and know what we''re looking at.
    At line 33, we set our arg.array parameter to the address of the array (sem_array).
    Note that we''re using the semnum union, which defines some commonly used fields
    for semaphores. In this case, we use the unsigned short to represent an array
    of semaphore values.


    At line 36, we use the semct1 API function and the SETALL command to set the semaphore
    values. We provide the semaphore identifier, semnum as zero (unused in this case),
    the SETALL command, and finally upon return of this API function, the semaphore
    array identified by semid has the values defined in sem_array.


    Next, we explore the GETALL command, which is used to retrieve the array of values
    for the semaphore array. We first set our arg.array to a new array (just to avoid
    reusing our existing array that has the contents we''re looking for), at line
    41. We call semct1 again with our semid, zero for semnum (unused again), the GETALL
    command, and our semnum union.'
