  md: '# 6 Building and Using Libraries


    In This Chapter


    +   - Introduction to Libraries

    - Building and Using Static Libraries

    - Building and Using Shared Libraries

    - Building and Using Dynamic Libraries

    - GNU/Linux Library Commands


    # INTRODUCTION


    In this chapter, we''ll explore the topic of program libraries. First we''ll investigate
    static libraries and their creation using the ar command. Then we''ll look at
    shared libraries (also called *dynamically linked libraries*) and some of the
    advantages (and complexities) they provide. Finally, we''ll look at some of the
    utilities that manipulate libraries in GNU/Linux.


    # WHAT IS A LIBRARY?


    A library is really nothing more than a collection of object files. When the collection
    of object files provides related behavior to solve a given problem, the objects
    can be integrated into a library to simplify their access for application developers.'
