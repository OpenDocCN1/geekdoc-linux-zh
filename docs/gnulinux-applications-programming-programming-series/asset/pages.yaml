    # USER UTILITIES


    GNU/Linux provides the ipcs command to explore IPC assets from the command line
    (including shared memory segments that are visible to the user). The ipc utility
    provides information on shared memory segments as well as message queues and semaphores.
    We''ll investigate its use for shared memory segments here. The general form of
    the ipc utility for shared memory segments is:


    ```

    $ ipcs -m

    ```


    This presents all of the shared memory segments that are visible to the process.
    Let''s start by creating a shared memory segment (as shown in Listing 17.1):


    ```

    $ ./shmcreate

    Created a shared memory segment 163840

    [mtj@campus ch17]$ ipcs -m

    ```


    | key | shmid | owner | perms | bytes | nattch | status |

    | --- | --- | --- | --- | --- | --- | --- |

    | 0x00003e7 | 163840 | mtj | 666 | 4096 | 0 | |


    We see a new shared memory segment being available (0x3e7 = 999). Its size is
    4096 bytes, and we see that there are currently no attachments to it (nattch =
    0). If we wanted to join into this segment we could specify this shared memory
    specifically to ipcs. This is done with ipcs using the -i option:


    ```

    $ ipcs -m -i 163840

    Shared memory Segment shmid=163840

    uid=500 gid=500 cgid=500

    mode=0666 access_perms=0666

    bytes=4096 lpid=0 cpid=15558 nattch=0

    ```'
