  md: '# Part

    Introduction


    Chapter 1: “GNU/Linux History"

    Chapter 2: “GNU/Linux Architecture"

    Chapter 3: “Free Software Development”


    In this first part of the book, we''ll explore a few introductory topics of the
    GNU/Linux operating system and its development paradigm. This includes a short
    history of UNIX, GNU, and the GNU/Linux operating system, a quick review of the
    GNU/Linux architecture, and finally a discussion of the Free Software (and open
    source) development paradigm.


    Chapter 1, “GNU/Linux History"

    The history of GNU/Linux actually started in 1969 with the development of the
    first UNIX operating system. This chapter discusses the UNIX development history
    and the motivations (and frustrations) of key developers that led to the release
    of the GNU/Linux operating system.


    Chapter 2, “GNU/Linux Architecture"

    The composition of the GNU/Linux operating system is the topic of the second chapter.
    We identify the major elements of the GNU/Linux operating system and then break
    them down to illustrate how the operating system works at a high level.


    Chapter 3, “Free Software Development"

    The free software development paradigms are detailed in this chapter, including
    some of the licenses that are available for free software. The two major types
    of open development—called free software and open source—are discussed, as well
    as some of the problems that exist within the domains.'
  merge: -1
