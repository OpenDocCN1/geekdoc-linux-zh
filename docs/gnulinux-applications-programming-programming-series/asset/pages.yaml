    What''s interesting about named pipes, which we''ll explore in the discussion
    of the mkfifo system command, is that they work in what is known as a rendezvous
    model. A reader will be unable to open the named pipe unless a writer has actively
    opened the other end of the pipe. The reader is blocked on the open call until
    a writer is present. Despite this limitation, the named pipe can be a useful mechanism
    for interprocess communication.


    # System Commands


    Let''s now look at a system command that is related to the pipe model for IPC.
    The mkfifo command, just like the mkfifo API function, allows us to create a named
    pipe from the command line.


    # mkfifo


    The mkfifo command is one of two methods for creating a named pipe (fifo special
    file) at the command line. The general use of the mkfifo command is:


    ```

    mkfifo [options] name

    ```


    where options are -m for mode (permissions) and name is the name of the named
    pipe to create (including path if needed). If permissions are not specified, the
    default is 0644. Here''s a sample use, creating a named pipe in /tmp cmd_pipe:


    ```

    $ mkfifo /tmp/cmd_pipe

    ```


    We can adjust the options simply by specifying them with the -m option. Here''s
    an example setting the permissions to 0644 (but we delete the original first):


    ```

    $ rm cmd_pipe

