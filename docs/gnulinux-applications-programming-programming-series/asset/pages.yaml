  md: 'sighhandler_t signal( int signum, sighhandler_t handler );


    where the sighhandler_t typedef is:


    typedef void (*sighhandler_t)(int);


    The signal function returns the previous signal handler that was installed, which
    allows the new handler to chain the older handlers together (if necessary).


    A process can install handlers to catch signals, and can also define that signals
    should be ignored (SIG_IGN). To ignore a signal for a process, the following code
    snippet can be:


    ```

    signal( SIGCHLD, SIG_IGN );

    ```


    Once this particular code is executed, it is not necessary for a parent process
    to wait for the child to exit or waitpid.


    Signal handlers for a process can be of three different types. They can be ignored
    (SIG_IGN), the default handler for the particular signal type (SIG_DFL), or a
    user-defined handler (installed via signal).


    A large number of signals exist for GNU/Linux. They are provided in Table 13.4–13.18
    with their meanings. The signals are split into four groups, based upon default
    action for the signal.


    The first group (terminate) lists the signals whose default action is to terminate
    the process. The second group (ignore) lists the signals for which the default
    action is to ignore the signal. The third group (core) lists those signals whose
    action is to both terminate the process and perform a core dump (generate a core
    dump file). And finally, the fourth group (stop) stops the process (suspend, rather
    than terminate).


    # TABLE 13.5 GNU/Linux Signals That Default to Terminate


    | Signal | Description |

    | SIGHUP | Hang up–commonly used to restart a task |

    | SIGINT | Interrupt from the keyboard |

    | SIGKILL | Kill signal |

    | SIGUSR1 | User-defined signal |

    | SIGUSR2 | User-defined signal |

    | SIGPIPE | Broken pipe (no reader for write) |

    | SIGALRM | Timer signal (from API function alarm) |

    | SIGTERM | Termination signal |

    | SIGPROF | Profiling timer expired |'
