    # Input and Output


    We''ve seen some examples already of output using the echo command. This command
    also emits the provided string to the display. We also saw suppression of the
    newline character using the -n option. The echo command also provides the means
    to emit data through a binary interface. For example, to emit horizontal tabs,
    the \t option can be used:


    ```

    echo -e \t\t\tented text.

    ```


    Some of the other options that exist are shown in Table 20.5. To enable interpretation
    of these strings, the -e option must be specified before the string.


    | Sequence | Interpretation |

    |---|---|

    | \b | Backspace |

    | \f | Form feed |

    | \n | Newline |

    | \r | Carriage return |

    | \t | Horizontal tab |

    | \v | Vertical tab |

    | \\ | Backslash |

    | \NNN | ASCII code of octal value |


    # TABLE 20.5 Special Sequences in Echoed Strings


    We can accept input from the user using the read command. The read command provides
    a number of options, a few of which we''ll investigate. First, let''s look at
    the basic form of a read command via the interactive bash shell:


    ```

    # read var

    test string

    # echo $var

    test string

    # read -s var

    # echo $var

    silent input

    ```'
