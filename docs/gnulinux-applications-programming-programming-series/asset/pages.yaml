  md: "# GNU HARDENING TECHNIQUES\n\nCode hardening can take a number of different\
    \ forms, and entire books have been written on the topic. In this section, we'll\
    \ look at a variety of techniques that can help build better code.\n\n# Return\
    \ Values\n\nThe failure to check return values is one of the most common mistakes\
    \ made in modern software. Many applications call user or system functions and\
    \ are very optimistic about their successful operation. When building hardened\
    \ software, all reasonable attempts should be made to check return values, and\
    \ if failures are found, deal with them appropriately. Reasonable attempts is\
    \ a key here; consider the following example:\n\n```\nret = printf(\"Current mode\
    \ is %d\\n\", mode);\nif (ret < 0) {\n    ret = printf(\"An error occured emitting\
    \ mode.\\n\");\n}\n```\n\nThe point is easily illustrated, but in most cases (of\
    \ user and system calls) the return value is relevant and should be checked in\
    \ every case.\n\n# Strongly Consider User/Network I/O\n\nWhenever we develop applications\
    \ that take input either from a user or from the network (such as a Sockets application),\
    \ it's even more critical to scrutinize the incoming data. Errors such as insufficient\
    \ data for a given operation or more data received than buffer space is available\
    \ are for two of the most common.\n\n# Use Safe String Functions\n\nA number of\
    \ standard C library functions suffer from security problems. The problem they\
    \ present is that there's no bounds checking, which means that they can be exploited\
    \ (we'll discuss the buffer overflow issue shortly). The simple solution to this\
    \ problem is to avoid unsafe functions and instead use the safe versions (as shown\
    \ in Table 26.1).\n\n# Buffer Overflow\n\nBuffer overruns cause unpredictable\
    \ software behavior in the best case and security exploits in the worst. Buffer\
    \ overruns can be avoided very simply. Consider the following erroneous example:"
  merge: -1
