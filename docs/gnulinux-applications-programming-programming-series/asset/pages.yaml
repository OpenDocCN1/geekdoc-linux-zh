- img_proc: true
  md: "# TABLE 16.1 Semaphore API Functions and Their Uses\n\n| API Function | Uses\
    \ |\n| --- | --- |\n| semget | Create a new semaphore\br> Get an existing semaphore\
    \ |\n| semop | Acquire or release a semaphore |\n| semctl | Get info about a semaphore\b\
    r> Set info about a semaphore\br> Remove a semaphore |\n\nWe'll address each of\
    \ these functions in the following sections using simple examples (single semaphore)\
    \ and the more complex uses (semaphore arrays).\n\n# semget\n\nThe semget API\
    \ function serves two fundamental roles. Its first use is in the creation of new\
    \ semaphores. The second use is identifying an existing semaphore. In both cases,\
    \ the response from semget is a semaphore identifier (a simple integer value representing\
    \ the semaphore). The prototype for the semget API function is defined as:\n\n\
    ```\nint semget( key_t key, int nsems, int semflg );\n```\n\nThe key argument\
    \ specifies a system-wide identifier that uniquely identifies this semaphore.\
    \ The key must be nonzero or the special symbol IPC_PRIVATE. The IPC_PRIVATE variable\
    \ tells semget that no key is provided and to make only one unique. Since no key\
    \ exists, there's no way for other processes to know about this semaphore. Therefore,\
    \ it's a private semaphore for this process.\n\nThe developer can create a single\
    \ semaphore (with an nsems value of 1) or multiple semaphores. If we're using\
    \ semget to get an existing semaphore, this value can simply be zero.\n\nFinally,\
    \ the semflg argument allows the developer to alter the behavior of the semget\
    \ API function. The semflg argument can take on three basic forms, depending upon\
    \ what is desired by the caller. In the first form, the developer desires to create\
    \ a new semaphore. In this case, the semflg argument must be the IPC_CREAT value\
    \ ORed with the permissions. The second form also provides for semaphore creation,\
    \ with the constraint that if the semaphore already exists, an error is generated.\
    \ This second form requires the semflg argument to be set to (IPC_CREAT | IPC_EXCL)\
    \ along with the permissions."
  merge: -1
  pgno: 294
- img_proc: true
  md: "# 268 GNU/Linux Application Programming\n\nthe semaphore already exists, the\
    \ call will fail -1 return) with errno set to EEXIST.\nThe third term takes a\
    \ zero for semflg and identifies that an existing semaphore is being requested.\n\
    \nTABLE 16.2 Semaphore Permissions for the semget semflg Argument\n\n| Symbol\
    \ | Value | Meaning |\n| S_IRUSR | 0400 | User has read permission |\n| S_IWUSR\
    \ | 0200 | User has write permission |\n| S_IRGRP | 0040 | Group has read permission\
    \ |\n| S_IWGRP | 0020 | Group has write permission |\n| S_IROTH | 0004 | Other\
    \ has read permission |\n| S_IWOTH | 0002 | Other has write permission |\n\nLet's\
    \ now look at a few examples of semget, used in each of the three scenarios defined\
    \ above. In the examples shown below, assume semid is an int value and mySem is\
    \ of type key_t. In the first example, we'll create a new semaphore (or access\
    \ an existing one) of the private type.\n\n```\nsemid = semget( IPC_PRIVATE, 1,\
    \ IPC_CREATE | 0666 );\n```\n\nOnce the semget completes, our semaphore identifier\
    \ is stored in semid. Otherwise, if an error occurred, a -1 would be returned.\
    \ Note that in this example (using IPC_PRIVATE), semid is all we need to identify\
    \ this semaphore. If semid were somehow lost, there would be no way to find this\
    \ semaphore again.\n\nIn the next example, we'll create a semaphore using a system-wide\
    \ unique key (0222). We also desire that if the semaphore already exists, we don't\
    \ simply get its value, but instead fail the call. Recall that this is provided\
    \ by the IPC_EXCL command, as:\n\n```\n// Create a new semaphore\nsemid = semget(\
    \ 0222, 1, IPC_CREATE | IPC_EXCL | 0666 );\nif ( semid == -1 ) {\n    printf(\"\
    Semaphore already exists, or error\\n\" );\n} else {\n    printf(\"Semaphore created\
    \ %d\\n\", semid);\n}\n```"
