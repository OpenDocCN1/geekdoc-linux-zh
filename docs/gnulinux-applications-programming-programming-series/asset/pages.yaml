  md: '# 56 GNU/Linux Application Programming


    Static libraries are created using the ar, or archive, utility. Once the application
    developer compiles and links with the library, the needed elements of the library
    are integrated into the resulting executable image. From the perspective of the
    application, the external library is no longer relevant once it''s combined with
    the application image.

    Shared, or dynamic, libraries are also linked with an application image, but in
    two stages. In the first stage (at the application''s build time), the linker
    verifies that all the symbols necessary to build the application (functions or
    variables) are available within either the application or libraries. Rather than
    pull in the elements from the shared library into the application image (as was
    done with the static library), at second stage (at runtime) a dynamic loader pulls
    the necessary shared libraries into memory and then dynamically links the application
    image with them. These steps result in a smaller image, as the shared library
    is separate from the application image (see Figure 6.1).


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_83_0.png)


    FIGURE 6.1 Memory savings of static versus shared libraries.'
