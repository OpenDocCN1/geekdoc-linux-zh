- img_proc: true
  md: '# Protocol


    The protocol specifies the details of communication over the socket. The two most
    common protocols used are the Transmission Control Protocol (TCP) and the User
    Datagram Protocol (UDP). TCP is a stream-based reliable protocol, and UDP is a
    datagram (message)-based protocol that can be unreliable. We will provide additional
    details of these protocols in this chapter.


    # Port


    The port is the endpoint for a given process (interface) for a protocol. This
    is the application''s interface to the Socket interface. Ports are unique on a
    host (not interface) for a given protocol. Ports are commonly called "bound" when
    they are attached to a socket.


    Ports are numbers that are split basically into two ranges. Port numbers below
    1024 are reserved for well-known services (called well-known addresses). Port
    numbers above 1024 are typically used by applications.


    > The original intent of service port numbers (such as FTP, HTTP, and DNS) was
    that they fall below port number 1024. Of course, the number of services exceeded
    that number long ago. Now, many system services occupy the port space greater
    than 1024 (for example NFS at port number 2049 and X-11 at port number 6000).


    # Addressing


    From this discussion, we see that a tuple uniquely identifies an endpoint from
    all other endpoints on a network. Consider the following tuple:


    ```

    { tcp, 192.168.1.1, 4097 }

    ```


    This defines the endpoint on the host identified by the address 192.168.1.1 with
    the port 4097 using the TCP protocol.


    # The Socket


    Simply put, a Socket can be defined as an endpoint of a communications channel
    between two applications. An example of this is defined as two tuples:


    ```

    { tcp, 192.168.1.1, 4097 }

    { tcp, 10.0.0.1, 5820 }

    ```


    The first item to note is that a socket is defined as an association of two endpoints
    that share the same protocol. The IP addresses are different here, but they'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Introduction to Sockets Programming 151


    don''t have to be. We could communicate via sockets in the same host. the port
    numbers are different here, but they could be the same unless they exist on the
    same host. Port numbers assigned by the TCP/IP stack are called ephemeral ports.
    This relationship is shown visually in Figure 12.3.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_178_0.png)


    FIGURE 12.3 Visualization of a Socket between two hosts.


    # Client/Server Model


    In most Sockets applications, there exists a server (responds to requests and
    provides responses) and a client (makes requests to the server). The Sockets API
    (which we''ll explore in the next section) provides commands that are specific
    to clients and to servers. Figure 12.4 illustrates two simple applications that
    implement a client and a server.


    The first step in a Sockets application is the creation of a socket. The socket
    is the communication endpoint that is created by the socket call. Note that in
    the sample flow (in Figure 12.4) both the server and client perform this step.


    The server requires a bit more setup as registering a service to the host. The
    bind call binds an address and port to the server so that it''s known. Letting
    the system choose the port can can result in a service that can be difficult to
    find. If we choose the port, we know what it is. Once we''ve bound our port, we
    call the listen function for the server. This makes the server accessible (puts
    it in the listen mode).'
