    for use with gprof and then understand the data products that are provided. Finally,
    we''ll investigate the variety of options that gprof provides and how they can
    be used.


    # WHAT IS PROFILING?


    Profiling is the art of analyzing the performance of an application. By identifying
    where a program spends the majority of its time, we can better isolate where our
    modifications can yield the biggest performance gains. The most common result
    of'
