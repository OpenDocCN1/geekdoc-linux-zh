  md: '# 12 Introduction to Sockets Programming


    # In This Chapter


    +   - Understand the Sockets Programming Paradigm

    - Learn the BSD4.4 Sockets API

    - See Sample Source for a TCP/IP Server and Client

    - Explore the Various Capabilities of Sockets (Control, I/O, Notification)

    - Investigate Socket Patterns that Illustrate Socks API Use

    - Examine Sockets Programming in Other Languages


    # INTRODUCTION


    In this chapter, we''ll take a quick tour of Sockets programming. We''ll discuss
    the Sockets programming paradigm, elements of Sockets applications, and the Sockets
    API. The Sockets API allows us to develop applications that communicate over a
    network. The network can be a local private network or the public Internet. An
    important item to note about Sockets programming is that it''s neither operating
    system specific nor language specific. Sockets applications can be written in
    the Ruby scripting language on a GNU/Linux host or in C on an embedded controller.
    This freedom and flexibility are the reasons that the BSD4.4 Sockets API is so
    popular.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# LAYERED MODEL OF NETWORKING


    Sockets programming uses the layered model of packet communication (see Figure
    12.1). At the top is the Application layer, which is where applications exist
    (those that utilize Sockets for communication). Below the Application layer we
    define the Sockets layer. This isn''t actually later, but it is shown here simply
    to illustrate where the API is located. The Sockets layer sits on top of the Transport
    layer. The Transport layer provides the transport protocols. Next is the Network
    layer, which provides among other things routing over the Internet. This layer
    is occupied by the Internet Protocol, or IP. Finally, the Physical layer driver
    is found, which provides the means to introduce packets onto the physical network.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_175_0.png)


    FIGURE 12.1 Layered model of communication.


    # SOCKETS PROGRAMMING PARADIGM


    The Sockets paradigm involves a number of different elements that must be understood
    to use it properly. Let''s look at the Sockets paradigm in a hierarchical fashion.


    At the top of the hierarchy is the host. This is a source or destination node
    on a network to or from which packets are sent or received. (Technically, we refer
    to interfaces as the source or destination, as a host may provide multiple interfaces,
    but we''re going to keep it simple here.) The host implements a set of protocols.
    These protocols define the manner in which communication occurs. Within each protocol
    is a set of ports. Each port defines an endpoint (the final source of destination).
    See Table 12.1 for a list of these elements (and Figure 12.2 for a graphical view
    of these relationships).'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# TABLE 12.1 Sockets Programming Element Hierarchy


    | Element | Description |

    | - | - |

    | Host (Interface) | Network address (a reachable network node) |

    | Protocol | Specific protocol (such as TCP or UDP) |

    | Port | Client or server process endpoint |


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_176_0.png)


    # Hosts


    Hosts are identified by addresses, and for IP (Internet Protocols), these are
    called IP addresses. An IPv4 address (of the version 4 class) is defined as a
    32-bit address. This address is represented by four eight-bit values. A sample
    address can be illustrated as:


    192.168.1.1 or 0xC0A80101


    The first value shows the more popular form of IPv4 addresses, which is easily
    readable. The second notation is simply the first address in hexadecimal format
    (32 bits wide).'
  merge: -1
