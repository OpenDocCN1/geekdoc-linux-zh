- img_proc: true
  md: '# Chapter 12, "Introduction to Sockets Programming"


    Network programming using the standard Sockets API is the focus of this chapter.
    Each of the API functions is detailed, illustrating their use in both client and
    server systems. After a discussion of the Sockets programming paradigm and each
    of the API functions, other elements of Sockets programming are discussed, including
    multilingual aspects.


    # Chapter 13, "GNU/Linux Process Model"


    The GNU/Linux process model refers to the standard multiprocess environment. We
    discuss the fork function (to create child processes) and the other process-related
    API functions (such as wait). The topic of signals is also discussed, including
    the range of signals and their uses. Finally, the GNU/Linux process commands (such
    as ps) are detailed.


    # Chapter 14, "POSIX Threads (Threads)"


    Programming with threads using the pthreads library is the topic of this chapter.
    The functions in the pthreads library are discussed, including thread creation
    and destruction, synchronization (with mutexes and condition variables), communication,
    and other thread-related topics. Problems in multithreaded applications are also
    discussed, such as reentrancy.


    # Chapter 15, "IPC with Message Queues"


    Message queues are a very important paradigm for communication in multiprocess
    applications. The model permits one-to-many and many-to-one communication and
    a very simple and intuitive API. This chapter details the message queue APIs for
    creating, configuring, and then sending and receiving messages. Advanced topics
    such as conditional message receipt are also discussed, along with user layer
    utilities for message queue inspection.


    # Chapter 16, "Synchronization with Semaphores"


    Semaphores in GNU/Linux and the ability to create critical sections are the topics
    of this chapter. After a discussion of the problems that semaphores solve, the
    API for semaphores is detailed, including creation, acquisition, release, and
    removal. The advanced features provided by GNU/Linux such as semaphore arrays
    are discussed, including user-level commands to inspect and remove semaphores.'
  merge: -1
