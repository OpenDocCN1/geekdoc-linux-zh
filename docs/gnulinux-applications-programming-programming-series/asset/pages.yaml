    Let''s now get back to the subject of libraries, and rather than build the entire
    source together, we''ll build a library for our random number functions. This
    is achieved using the ar utility (archive). Below, we''ll demonstrate the building
    of our static library along with the construction of the final image.


    ```

    $ gcc -c -Wall initapi.c

    $ gcc -c -Wall randapi.c

    $ ar -cru librand.a initapi.o randapi.o

    $

    ```


    In this example, we first compile our two source files (initapi.c and randapi.c)
    using gcc. We specify the -c option to gcc to compile only (don''t link) and to
    turn on all warnings. Next, we use the ar command to build our library (librand.a).
    The cru options are a standard set of options for creating or adding to the archive.
    The -c option specifies to create the static library (unless it already exists,
    in which case the option is ignored). The r option tells ar to replace existing
    objects in the static library (if they already exist). Finally, the u option is
    a safety option to specify that objects are replaced in the archive only if the
    objects to be inserted are newer objects in the archive (of the same name).


    We now have a new file called librand.a, which is our static library containing
    two objects: initapi.o and randapi.o. Let''s now look at how we can build an application
    using this static library. Consider the following:


    ```

    $ gcc test.c -L. -lmyrand -o test

    $ ./test

    getRand() Average 4

    getRand() Average 0.499892

    $

    ```


