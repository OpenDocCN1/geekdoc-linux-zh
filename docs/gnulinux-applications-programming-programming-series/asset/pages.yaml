    The gprof utility writes its human-readable output to standard-out, so the user
    must redirect this to a file to save it. The first element of the gprof output
    is called "flat profile." This provides the basic timing summary of the executable,
    as shown in Listing 8.2. Note that this is not the complete output of gprof. We''ll
    look at other data products shortly.


    # Listing 8.2 Sample Flat Profile Output from gprof


    | gprof sort gmon.out | more |

    | Flat profile: |

    | Each sample counts as 0.01 seconds. |

    | % cumulative seconds seconds calls s/call s/call name |

    | 71.66 | 3.11 | 3.11 | 1 | 1.22 | 1.22 | bubbleSort |

    | 28.11 | 4.33 | 1.22 | 1 | 1.22 | 1.22 | insertSort |

    | 0.23 | 4.34 | 0.01 | 2 | 0.01 | 0.01 | insert_list |


    As we saw in Listing 8.1, our application is made up of three functions. Each
    function is represented here with a variety of timing data. The first column represents
    the percentage of time spent in each function in relation to the whole. What''s
    interesting is that the bubble sort algorithm requires 2.5 times as much execution
    time to sort the identical list as the insert sort. The next column, cumulative
    seconds, is a running sum of the number of seconds taken by this function, self
    seconds. Note that the table itself is sorted by this column in descending order.
    The column calls represents the total number of times that this function was called
    (if the function itself was profiled, otherwise the element will be blank). The
    self s/call represents the average number of seconds spent in this function (including
    functions that it calls), while the total s/call represents the total number of
    seconds spent in the function (including functions that it calls). Finally, the
    name of the function is provided.


    The next element provided by gprof is the call graph. This summary (shown in Listing
    8.3) shows each function and the calls that are made by it, including the time
    spent within each function. It illustrates the timing as a hierarchy, which is
    useful in understanding timing for individual functions down the chain and their
    effect on higher layers of the call chain.'
