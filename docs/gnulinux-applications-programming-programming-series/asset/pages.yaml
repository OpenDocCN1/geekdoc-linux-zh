    Now let''s look at reading this file using fread, rather than reading it sequentially,
    in nonsequential way (otherwise known as random access). In this example, we''ll
    read the records of the file in reverse order. This requires the use of two new
    functions that will permit us to seek into a file (fseek) and also rewind back
    to the start (rewind);


    ```

    void rewind(FILE *stream);

    int fseek(FILE *stream, long offset, int whence);

    ```


    The rewind function simply resets the file pointer back to the start of the file,
    while the fseek function allows us to seek to the new position given an index.
    The whence argument defines whether the position is relative to the start of the
    file (SEEK_SET), the current position (SEEK_CUR), or the end of the file (SEEK_END).
    Table 10.2. The lseek function operates like fseek, but instead on a descriptor:


    ```

    int lseek(FILE *stream, long offset, int whence);

    ```


    # TABLE 10.2 Function fseek/lseek whence Arguments


    | Name | Description |

    | --- | --- |

    | SEEK_SET | Moves the file position to the position defined by offset. |

    | SEEK_CUR | Moves the file position the number of bytes defined by offset from
    the current file position. |

    | SEEK_END | Moves the file position to the number of bytes defined by offset
    from the end of the file. |'
