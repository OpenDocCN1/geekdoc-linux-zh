    The Makefile syntax also provides other capabilities beyond those that have been
    discussed in this section; the rest of this chapter will consider some of the
    most useful capabilities of GNU make.


    # MAKEFILE VARIABLES


    GNU make provides support for a form of variable that closely resembles the variables
    provided in the standard UNIX shells. The variables allow a name to be associated
    with an arbitrarily long text string. The basic syntax to assign a value to a
    variable is:


    MY_VAR = A text string


    This results in the creation of a variable named MY_VAR with a value of A text
    string. The value of a variable can be retrieved in subsequent portions of the
    Makefile by using the following syntax: ${var-name}, where var-name is replaced
    with the name of the variable that is being retrieved. Listing 5.3 provides an
    example Makefile to illustrate the basic use of variables in a Makefile.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_73_0.png)


    Listing 5.3 Simple Variable Makefile (on the CD-ROM at. /source/ch5/ Makefile.simparvar)


    ```

    1:

    2: MY_VAR=file1.c file2.c

    3:

    4: all:

    5: echo ${MY_VAR}

    6:

    ```


    Line 2 assigns the value file1.c file2.c to the MY_VAR variable. When the make
    utility is invoked, it will attempt to build the all target defined on line 4.
    The command on line 5 will be executed, and the output is illustrated in Listing
    5.4.'
