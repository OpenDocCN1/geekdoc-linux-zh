  md: 'Debugging with GDB 447


    # Stopping the Program


    It’s also possible to stop a debugging session using Ctrl+C. If the program is
    stopped in a function for which no debugging information is available (it wasn’t
    compiled with -g), then only assembly will be displayed (since source debugging
    information is not available).


    # OTHER GDB DEBUGGING TOPICS


    In this section, we’ll discuss some other topics of GDB, such as multiprocessing
    application debugging and post-mortem debugging.


    # Multiprocess Application Debugging


    One problem with the debugging of multiprocess applications is which process to
    follow when a new process is created. Recall from Chapter 12, “Introduction to
    Sockets Programming,” that the fork function returns to both the parent and child
    processes. We can tell GDB which returns to follow using the follow-fork-mode
    command. For example, if we wanted to debug the child process, we’d specify to
    follow the child process as:


    ```

    set follow-fork-mode child

    ```


    Or, if we instead wanted to follow the parent (the default mode), we’d specify
    this as:


    ```

    set follow-fork-mode parent

    ```


    In either case, when GDB follows one process, the other process (child or parent)
    continues to run unimpeded. We can also tell GDB to ask which process to follow
    when a fork occurs,:


    ```

    set follow-fork-mode ask

    ```


    When the fork occurs, GDB will ask which to follow. Whichever is not followed
    will execute normally.


    # Multithreaded Application Debugging


    There’s no other way to put it: Debugging multithreaded applications is difficult
    at best. GDB offers some capabilities that assist in multithreaded debugging,
    and we’ll look at those here.'
