  md: '# Chapter 21, "Editing with sed"


    The sed utility is a noninteractive text editing utility that is quite useful
    in performing global editing of files. sed can be used on a single file or many
    files, although it is cryptic, it is generally a useful tool that solves a number
    of text editing problems. This chapter introduces sed and describes its use in
    a number of simple and complex examples.


    # Chapter 22, "Text Processing with Awk"


    While some consider the Awk utility an advancement of sed, it is in its own right
    a high-level procedural programming language. Awk was designed for text pattern
    processing on files, but it has evolved into a compact language that is useful
    in a number of areas. Awk is very convenient in prototyping because it is interpreted,
    and programs can be developed and tested quickly. The Awk programming language
    is useful and can be very beneficial to GNU/Linux developers.


    # Chapter 23, "Parser Generation with flex and bison"


    The development of parsers was traditionally limited to those with experience
    in parsing and compiler theory. With the introduction of lex and yacc (and the
    GNU replacements, flex and bison), building parsers is much simplified as the
    difficult work is done for you. The lex tool is a lexical analyzer generator that
    creates programs for tokenization of input files. The bison tool, working in concert
    with the lexer, generates a grammar parser to validate the correctness of input
    tokens. Each of these tools takes an input file defining the token structure and
    grammar and produces C source to perform tasks. This makes the development of
    parsers simple and very maintainable. In this chapter, flex and bison are introduced
    through multiple examples of tokenization and grammar parsing.'
