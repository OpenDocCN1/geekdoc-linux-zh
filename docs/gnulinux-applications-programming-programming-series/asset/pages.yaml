    # INTRODUCTION


    The GNU Compiler Collection (otherwise known as GCC) is a compiler and set of
    utilities to build binaries from high-level source code. GCC is not only the facto
    standard compiler on GNU/Linux, but it’s also the standard for embedded systems
    development. This is because GCC supports many different target architectures.
    For example, our use here will concentrate on host-based development (building
    software for the platform on which we’re compiling), but if we are cross compiling
    (building for a different target) then GCC provides for 40 different architecture
    families. Examples include x86, RS6000, Arm, PowerPC, and many others. GCC can
    also be used over 40 different host systems (such as Linux, Solaris, Windows,
    or the next operating system).


    GCC also supports a number of other languages, outside of standard C. We could
    compile for C++, Ada, Java, Objective-C, FORTRAN, Pascal, and three dialects of
    the C language.'
