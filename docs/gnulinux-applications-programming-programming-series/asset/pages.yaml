    The trace tool can be useful not only to understand the operation of our pro-

    grams, but also the operation of programs for which we may not have source. From

    the perspective of system calls, we can at some level understand what binary applici-

    cations are up to.


    # SUMMARY


    Code hardening can increase our development time, but it routinely reduces our

    debugging time. By anticipating faults while we design, we automatically increase

    t reliability and quality of our software, so this technique is one to be mastered.

    in this chapter we discussed a variety of code hardening techniques, as well as
    non-

    coding methods to help create better software and understand its operation.


