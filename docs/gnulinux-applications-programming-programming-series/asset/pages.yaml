    # INTRODUCTION


    Writing software is difficult, even when building on an outstanding operating
    system such as GNU/Linux. The complexity of software grows as the sizes of the
    systems that we develop grow. But even when developing smaller systems, problems
    can still find their way in. Even if we develop software that doesn''t work the
    first time, performing tests on the software can identify the shortcomings, allowing
    us to fix them.

    If our tests are repeatable, we can easily retest our software once we''ve made
    changes to it (otherwise known as regressing). This makes it much easier to update
    our software, since we know it''s easy to verify that we haven''t broken anything
    when we''re done. If we find something that''s broken but wasn''t tested before,
    we simply update the regression test to check it in the future.'
