  md: '# 5 Building Software with GNU make


    by Curtis Nottberg


    **In This Chapter**


    +   - Compiling C

    - Basic Makefile

    - Makefile Constructs

    - Dependency Tracking


    # INTRODUCTION


    Creating a binary in a compiled language often involves lots of steps to compile
    all of the source files into object code and then invoking the linker to put the
    object code modules together into an executable. The necessary steps can all be
    performed by hand, but this becomes tedious very quickly. Another solution would
    be to write a shell script to perform the commands each time. This is a better
    solution but has a number of drawbacks for larger projects and tends to be hard
    to maintain over the life of the project. Building software has a number of unique
    requirements that justify the development of a tool that is specifically targeted
    at automating the software build process. The developers of UNIX recognized this
    requirement early on and developed a utility named make to solve the problem.
    This chapter is an introduction to GNU make, the open source implementation of
    the make utility commonly used in Linux software development.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# An Example Project


    The approach used in this chapter will be to introduce a simple example project
    and then show how to build the project starting with a command line solution and
    progressing to a fairly complete GNU make implementation. The examples in this
    chapter will show various ways to build a project consisting of four source files.
    The diagram shown in Figure 5.1 illustrates the directory layout of the project.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_69_0.png)


    FIGURE 5.1 Directory structure of example project.


    # Compiling by Hand


    The simplicity of the example project makes it very easy to compile by hand. Executing
    the following command in the top-level project directory will generate the application
    named apppex with a single command.


    ```

    gcc -o apppex src/main.c app.c src/bar.c src/lib.c

    ```


    This command runs the GCC wrapper program that invokes the preprocessor, compiler,
    and linker to turn these four c-files into an executable. The singlecommand approach
    is acceptable for such a simple project, but for a larger project this would be
    impractical. The following set of commands breaks the compilation into the incremental
    steps commonly seen in a more complicated build process.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '```

    gcc -c -o main.o src/main.c

    gcc -c -o app.o src/app.c

    gcc -c -o bar.o src/bar.c

    gcc -c -o lib.o src/lib.c

    gcc -o appex main.o app.o bar.o lib.o

    ```


    The first commands in this series turn the c-files in the src directory into object
    files in the top-level directory. The last command invokes the linker to combine
    the four generated object files into an executable.


    # A Build Script


    Typing any of the commands described in the previous section would get tedious
    if it had to be done every time the application needed to be rebuilt. The next
    obvious step would be to put these commands into a script so that a single command
    could perform all of the steps needed to build the application. The following
    listing shows the contents of the build script that might be written to automate
    the build process.


    > Listing 5.1 The build Script (on the CD-ROM at ./source/ch5/buildit)


    +   1: #!/bin/sh

    2: # Build the chapter 5 example project

    3:

    4: gcc -c -o main.o src/main.c

    5: gcc -c -o app.o src/app.c

    6: gcc -c -o bar.o src/bar.c

    7: gcc -c -o lib.o src/lib.c

    8: gcc -o appex main.o app.o bar.o lib.o


    The script collects the commands outlined in the previous section into one place.
    It allows the developer and user of the source code to build the application with
    the simple ./build command. Also, it is revision controlled and distributed with
    the source code to ease the understanding needed by trying to build an application.
    One of the disadvantages of the build script is that it rebuilds the entire project
    every time it is invoked. For the small example in this chapter, this does not
    cause a significant increase time in the development cycle, but as the number
    of files increases, running the entire build process turns into a significant
    burden. One of the major enhancements of the make utility over a shell script
    is its capability to understand the dependencies of a project. Understanding the
    dependencies allows the make utility to rebuild only the parts of the project
    that need updating due to source file changes.'
