    \ the critical section time can lead to better performance.\n\n# Thread Condition\
    \ Variables\n\nNow that we have mutexes out of the way, let's explore condition\
    \ variables. A condition variable is a special thread construct that allows a\
    \ thread to wake up another thread based upon a condition. While mutexes provide\
    \ a simple form of synchronization (based upon the lock status of the mutex),\
    \ condition variables are a means for one thread to wait for an event and another\
    \ to signal that the event has occurred. An event can mean anything here. A thread\
    \ blocks on a mutex but can wait on any condition variable. Think of them as wait\
    \ queues, which is exactly what the implementation does in GNU/Linux.\n\nConsider\
    \ this problem of a thread awaiting a particular condition being met. With only\
    \ mutexes, the thread would have to poll to acquire the mutex, check the condition,\
    \ and then release the mutex if there was no work to do (the condition wasn't\
    \ met). That kind of busy looping can lead to poor performing applications and\
    \ should be avoided.\n\nThe threads API provides a number of functions supporting\
    \ condition variables. These functions provide condition variable creation, waiting,\
    \ signaling, and destruction. The condition variable API functions are presented\
    \ below:\n\n```\nint pthread_cond_wait(pthread_cond_t *cond,\n               \
    \    pthread_mutex_t *mutex);\nint pthread_cond_timedwait(pthread_cond_t *cond,\n\
    \                            pthread_mutex_t *mutex,\n                       \
    \     const struct timespec *abstime);\nint pthread_cond_signal(pthread_cond_t\
    \ *cond);\nint pthread_cond_broadcast(pthread_cond_t *cond);\nint pthread_cond_destroy(pthread_cond_t\
    \ *cond);\n```\n\nTo create a condition variable, we simply create a variable\
    \ of type pthread_cond_t. We initialize this by setting it to PTHREAD_COND_INITIALIZER\
