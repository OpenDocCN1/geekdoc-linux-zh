    The following listing shows a simple Makefile that builds the library and an application
    that uses the library. This Makefile will be used to provide a basis for comparing
    how Autotools would build the same project. Keep in mind that the example considered
    here is very simple. The application of automake/autoconf to this project will
    seem like more work than payoff, but as the project grows, the payback from using
    the Autotools will increase.'
