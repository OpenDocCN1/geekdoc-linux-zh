  md: 'In this very simple grammar, we can reduce to the following rules. First each
    statement starts with a set command followed by a variable and a = symbol. After
    the assignment operator, we have what we''ll call an expression and terminate
    with a ; . So our first rule can take the form:


    ```

    ''set'' VARIABLE ''='' EXPRESSION ;''

    ```


    Our EXPRESSION has one of four forms:


    +   NUMBER

    VARIABLE

    VARIABLE OPERATOR NUMBER

    VARIABLE OPERATOR VARIABLE


    Finally, we''ll support two operators within an expression. It can be either an
    addition or a subtraction:


    ```

    ''+''

    ''-''

    ```


    This is reasonable so far for this very simple grammar. It should be clear now
    how the lexer and grammar parser work together. The lexer will break the input
    into the necessary tokens, which the grammar parser takes, and using its rules,
    determines if the symbols can be recognized by the grammar.


    # Encoding the Grammar in bison


    Let''s now look at how the simple grammar can be represented for bison. The bison
    input file is similar to the flex input file. It starts with a section containing
    C code that is imported into the grammar parser, followed by a set of declarations:


    ```

    %{

    C Declarations

    %

    Bison Declarations

    %%

    Grammar Rules

    %%

    C Code

    ```


    The bison input file can be quite a bit more complex than the flex input file,
    so let''s continue our illustration with a real example. In this example, we''ll
    provide a grammar for our previous set example. This is shown in Listing 23.3.'
