    using the gcov utility. The gcov utility provides a way to identify path execution
    of an application. This tool can be very useful in determining full test path
    coverage of an application (where all paths are taken for a given regression of
    an application). It can also be useful in identifying how often a given path was
    taken and therefore is a useful performance tool.


