  md: '# A Simple Makefile


    The make utility uses a developer-created input file to describe the project to
    be built. GNU make uses the name Makefile as the default name for its input file.
    Thus, when the make utility is invoked by typing the make command, it will look
    in the current directory for a file named Makefile to tell it how to build the
    project. The following listing illustrates a basic Makefile used to build the
    example project.


    Listing 5.2 Simple Makefile (on the CD-ROM) at ./source/ch5/Makefile.simple)


    ```

    1: appexp: main.o app bar.o lib.o

    2: gcc -o main.o app bar.o lib.o

    3:

    4: main.o : src/main.c src/lib.h src/app.h

    5: gcc -c -o main.o src/main.c

    6:

    7: app.o : src/app.c src/lib.h src/app.h

    8: gcc -c -o app.o src/app.c

    9:

    10: bar.o : src/bar.c src/lib.h

    11: gcc -c -o bar.o src/bar.c

    12:

    13: lib.o : src/lib.c src/lib.h

    14: gcc -c -o lib.o src/lib.c

    ```


    Line 1 illustrates the basic construct in Makefile syntax, the *rule*. The portion
    before the colon is the *target*, the portion after the colon is called the *dependencies*.
    Rules generally have commands associated with them that turn the prerequisites
    into the target. In the specific case of line 1, the target of the rule is the
    appexp application that depends on the existence of main.o, app.o, bar.o, and
    lib.o before it can be built. Line 2 illustrates the command used to invoke the
    linker to turn the main.o, app.o, bar.o, and lib.o object files into the appexp
    executable. It is important to note that one of the idiosyncrasies of Makefile
    syntax is the need to put a hard tab in front of commands in a Makefile; this
    is how the make utility differentiates from other Makefile syntax. The make utility
    uses rules to determine how to build a project. When the make utility is invoked
    on the command line, it parses the Makefile to find all of the target rules. It
    then attempts to build a target with the name all; if the all target has not been
    defined, then make will build the first target it encounters in the Makefile.


    For the Makefile in Listing 5.2, the default target is the appexp application
    because its rule (line 1) occurs first in the Makefile. The neat part about the
    Makefile rule syntax is that the make utility can chain the rules together to
    create the whole'
