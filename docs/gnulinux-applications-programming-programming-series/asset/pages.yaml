  md: "# Provide Logical Alternatives at Decision Points\n\nA very common mistake\
    \ that can yield unpredictable results is the absence of a default section in\
    \ a switch statement. Consider the following example:\n\n```\nswitch ( mode )\
    \ {\n    case OPERATIONAL_MODE:\n    /* switch to operational mode processing\
    \ */\n    break;\n    case BUILT_IN_TEST_MODE:\n    /* switch to test processing\
    \ */\n    break;\n}\n```\n\nIn the event another mode was added but this particular\
    \ code segment was not updated, the result after this segment executes is unpredictable.\
    \ The solution is to always include a default section that either asserts (in\
    \ debugging mode) or a minimum notifies the caller that a problem has occurred.\
    \ If we're really not expecting another mode, we can simply assert here to catch\
    \ the condition during debugging:\n\n```\nswitch ( mode ) {\n    case OPERATIONAL_MODE:\n\
    \    /* switch to operational mode processing */\n    break;\n    case BUILT_IN_TEST_MODE:\n\
    \    /* switch to test processing */\n    break;\n    default:\n    assert(0);\n\
    \    break;\n}\n```\n\nA similar problem exists with if/then/else chains. The\
    \ following example illustrates the problem:\n\n```\nfloat multiplier = 0.0;\n\
    if (state == FIRST_STAGE) multiplier = 0.75;\nelse if (state == SECOND_STAGE)\
    \ multiplier = 1.25;\n```\n\nIf our state is corrupted or takes on a value that\
    \ we did not expect, then our multiplier takes on the value of 0.0, and the result\
    \ is unpredictable at best, depending upon the application, catastrophic at worst.\
    \ An else should be provided to a minimum catch the issue"
