    servaddr.sin_addr.s_addr = inet_addr("192.168.1.1");

    connect(clisock, (struct sockaddr_in*)&servaddr,

    izeof(servaddr));

    ```


    The connect function blocks until either an error occurs or the three-way handshake
    with the server finishes. Any error is returned by the connect function.


