  md: '# # Building Packages with automake/autoconf


    by Curtis Nottberg


    # ## In This Chapter


    +   - make Review

    - Introduction to the GNU Autotools

    - Quick Introduction to autoconf

    - Quick Introduction to automake

    - Converting a Project to Use Autotools


    # ## INTRODUCTION


    The standard GNU make utility eases many of the burdens associated with building
    an executable from multiple source files. It enables incremental building of the
    source and allows the commands and processes needed to maintain a source package
    to be collected in a single location. GNU make is excellent at implementing the
    steps needed to build a moderately complex project. GNU make starts to become
    cumbersome as projects grow in complexity. Examples of factors that cause Makefile
    maintenance to become cumbersome are these:


    +   - Projects with a large number of files that have varied build requirements.

    - Dependencies on external libraries.

    - A desire to build in a multiplatform environment.

    - Installing built software in multiple environments.

    - Distributing a source package.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# 98 GNU/Linux Application Programming


    The solution to these complexities is to move up one level and automatically generate
    the appropriate Makefiles to build the project. This allows GNU make to focus
    on the things it is good at while still allowing the capability to configure for
    the current build environment. The GNU Autotools are an attempt to provide the
    next level of build functionality on top of the GNU make utility.


    # An Example Project


    The examples in this chapter will show various ways to build a project consisting
    of four source files. Two of the source files will be used to build a library,
    and the other files will build an application that uses the library (see Figure
    9.1).


