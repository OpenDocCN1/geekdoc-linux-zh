    # INTRODUCTION


    Multithreaded applications are a useful paradigm for system development because
    they offer many facilities not available to traditional GNU/Linux processes. In
    this chapter, we''ll explore pthreads programming and the functionality provided
    by the pthreads API.


    > The 2.4 GNU/Linux kernel POSIX thread library was based upon the Linux-Threads
    implementation (introduced in 1996), which was built on the existing GNU/Linux
    process model. The 2.6 kernel utilizes the new Native POSIX Thread Library, or
    NPTL (introduced in 2002), which is a higher performance implementation with numerous
    advantages over the older component. For example, NPTL provides real thread groups
    (within a process), compared to one thread per process in the prior model. We''ll
    outline those differences when it''s useful to know.


    ![](img/e2d3d6ad54c540455223ec59a4bf39e6_236_0.png)'
  merge: -1
