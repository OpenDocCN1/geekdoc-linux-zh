  md: '# 330 GNU/Linux Application Programming


    ```

    ls -la

    ```


    will generate a file listing and emit the results to the shell window. We could
    instead redirect this to a file as:


    ```

    ls -la > ls-out.txt

    ```


    What would have been emitted to the shell window will now be present in the output
    file ls-out.txt.

    Rather than accept input from the keyboard, we can accept input from another source.
    For example, the command cat will simply emit its standard input (or files named
    on its command line) to its standard output. We can redirect the contents of a
    file to cat < input symbol.


    ```

    cat < ls-out.txt

    ```


    We can also build more complicated redirection structures. For example, using
    the | pipe symbol, we can chain a number of generators and filters together. For
    example, consider the following command sequence:


    ```

    find -name ''*.*'' -print | xargs grep ''mtj'' | more

    ```


    This is actually three different commands that stream their output from left to
    right. The first command searches the subdirectory tree (from the current directory)
    looking for all files that fit a certain pattern. The pattern defined is ''*.[ch]'',
    which means all files that end in .c or .h. These are passed to the next command,
    xargs, which is a special command to read from standard input and pass to the
    embedded command. In this case, it''s grep. The grep command is a text search
    utility that will search all files passed to it from the string term mtj. For
    files that pass the search criteria, the lines that contain the search term are
    emitted to the next stage, the more command ensures that the user is able to see
    all output before it scrolls. When a screen full of output is present, the user
    must type return for more to continue and potentially present a new screen''s
    worth of data.


