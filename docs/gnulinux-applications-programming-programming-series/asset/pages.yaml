  md: '# Building Software with GNU make 45


    build process. When the make utility is invoked, it will begin to build the project
    by trying to build the default rule: rule 1 in the example Makefile. On line 1
    tells the make utility to build appexp, make must have the files main.o, app.o,
    bar.o, and lib.o. make will check for the existence of those files to determine
    if it has everything needed to build the application. If one of prerequisite files
    is missing or is newer than the target, make will start searching the target rules
    to determine if it has a rule to create the prerequisite.


    Once an appropriate rule is identified, then the process will start by ensuring
    the new rule''s prerequisites exist. Thus the make utility chains together into
    a tree of dependencies that must be satisfied to build the original target. make
    will then start executing the commands associated with the rules at the leaves
    of the tree to build the example Makefile, the process would start with the default
    rule on line 1. If the object files didn''t exist yet, then the make utility would
    find the rules to make them. First it would find a rule to create main.o, which
    occurs on line 4. Next, make would examine the rule on line 4 and realize that
    main.c, lib.h, and app.h all exist, the commands to create main.o (line 5) would
    be executed. The next prerequisite needing to be created would be app.o, so make
    would find the rule on line 7 and execute the command on line 8. This process
    would continue to create bar.o and lib.o, and finally the command on line 2 would
    be executed to create the application. If the make command is executed in a clean
    directory, then would be expected make would automatically execute the following
    series of commands:


    ```

    gcc -c main.o src/main.c

    gcc -c -o app.o src/app.c

    gcc -c -o bar.o src/bar.c

    gcc -c -o lib.o src/lib.c

    gcc -o appexp main.o bar.o lib.o

    ```


    Comparing this to the script in Listing 5.1, we can see that we have reimplemented
    the simple build script using GNU make. Why use GNU make instead of a build script?
    After all, it seems a more complicated way to implement the steps the build script
    took care of us. The answer is the capability of GNU make to build things in an
    incremental fashion based upon the dependencies that are set up in the Makefile.
    For example, suppose after building the appexp program we discover an error in
