  md: "# POSIX Threads (Pthreads) Programming 219\n\n```\nint pthread_mutex_lock(pthread_mutex_t\
    \ *mutex);\nint pthread_mutex_trylock(pthread_mutex_t *mutex);\nint pthread_mutex_unlock(pthread_mutex_t\
    \ *mutex);\nint pthread_mutex_destroy(pthread_mutex_t *mutex);\n```\n\nAll functions\
    \ return zero on success or a nonzero error code. All errors returned from pthread_mutex_lock\
    \ and pthread_mutex_unlock are assertion (not recoverable). Therefore, we will\
    \ use the return of these functions to abort our program.\n\nLocking the thread\
    \ is the means by which we enter a critical section. Once the mutex is locked,\
    \ we can safely enter the section without worrying about data corruption or multiple\
    \ access. To exit our critical section, we unlock the semaphore and we're done.\
    \ The following code snippet illustrates a simple critical section:\n\n```\npthread_mutex_t\
    \ cntr_mutex = PTHREAD_MUTEX_INITIALIZER;\n\nassert(pthread_mutex_lock(&cntr_mutex)\
    \ == 0);\n/* Critical Section */\n/* Increment protected counter */\ncounter++;\n\
    /* Critical Section */\nassert(pthread_mutex_unlock(&cntr_mutex) == 0);\n```\n\
    \nA critical section is a section of code that can be executed by only one process\
    \ at a time. The critical section exists to protect shared resources from multiple\
    \ access.\n\nThe pthread_mutex_trylock operates under the assumption that if we\
    \ can't lock the mutex, there is something else that we should do instead of blocking\
    \ on the pthread_mutex_lock call. This is demonstrated as:\n\n```\nret = pthread_mutex_trylock(&cntr_mutex);\n\
    if (ret == EBUSY) {\n  /* Couldn't lock, do something else */\n} else if (ret\
    \ == EINVAL) {\n  /* Critical error */\n  assert(0);\n} else {\n  /* Critical\
    \ Section */\n  ret = thread_mutex_unlock(&cntr_mutex);\n}\n```\n\nFinally, to\
