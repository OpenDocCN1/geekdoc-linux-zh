    reviewed application and command-line methods for creating pipes and also reviewed
    typical I/O mechanisms for communicating through them. We also reviewed the ability
    to redirect I/O using the dup and dup2 commands. While useful for pipes, these
    commands are useful in many other scenarios as well (wherever a file descriptor
    is used, such as a socket or file).'
