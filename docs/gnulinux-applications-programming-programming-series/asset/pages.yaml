  md: '# The Generated Makefiles


    The generated Makefiles have a number of nice characteristics that were lacking
    in the simple Makefile of Listing 9.1, such as:


    +   - Automatic dependency tracking. For example, when a header file is modified,
    only the source files that are affected will be rebuilt.

    - A clean target that will clean up all the generated output.

    - The automated ability to install the generated binaries into the appropriate
    system directories for execution.

    - The automated ability to generate a distribution of the source code as a compressed
    tar file.


    The generated Makefiles have numerous predefined targets that allow the user to
    invoke these capabilities. Let''s examine the common targets used in the automake-generated
    Makefile:


    make: The default target. This will cause the project binaries to be built.

    make clean: The clean target. This will remove all of the generated build files
    so that the next call to make will rebuild everything.

    make distclean: This target removes all generated files, including those generated
    by the configure script. After using this target, the configure script will need
    to be run again before another build can take place.

    make install: This target will move the generated binaries and supporting files
    into the system directory structure. The location of the installation can be controlled
    with the --prefix parameter that can be passed to the configure script when it
    is run.

    make dist: This target generates a .tar.gz file that can be used to distribute
    the source code and build setup. Included in the tarball will be all of the source
    files, the Makefile, and the configure script.


    Just looking at the default targets provided by the standard Automake Makefile
    should indicate some of the power that exists in using the Autotools to generate
    the Makefiles for your project. The initial setup to use the Autotools can be
    a bit cumbersome, but once the infrastructure is in place, future updates to the
    files are very incremental, and the payback is large compared to implementing
    the same capabilities by hand in a developer-maintained Makefile.'
