    path by echoing the PATH environment variable as:


    ```

    $ echo $PATH

    /usr/local/bin:/bin:/usr:/usr/X11R6/bin:/home/mtj/bin

    ```


    If we created a script that does not exist in the path defined (for example, in
    our current working directory), then we will have to invoke it as:


    ```

    /script.sh

    ```'
