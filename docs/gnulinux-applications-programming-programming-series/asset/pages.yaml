    The gcov utility is used in conjunction with the compiler tool chain. This means
    that the image that we''re to do coverage testing must be compiled with a special
    set of options. These are illustrated below for compiling the source file bubbles.c.


    ```

    gcc bubblesort.c -o bubblesort **ftest-coverage -fprofile-arcs**

    ```


    The resulting image, when executed, produces a number of files containing statistics
    about the application (along with statistics emitted to standard-out). These files
    are then used by the gcov utility to report statistics and coverage information
    to the developer. When -ftest-coverage option is specified, two files are generated
    for each source file. These files use the extension .bb (basic-block) and .bbg
    (basic block graph) and are used to reconstruct the program flow graph of the
    executed application. For the option -profile-arcs a da file is generated that
    contains the execution count for each instrument branch. These files are used
    after execution, along with the original source file, to identify the execution
    behavior of the source.


