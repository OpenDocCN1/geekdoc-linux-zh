    system. This included a compiler, a shell, and a variety of tools and applications.
    Work was underway in 1986 to migrate MIT''s TRIX kernel, but divisions existed
    on whether to use TRIX or CMU''s Mach microkernel. It was not until 1990 that
    work began on the official GNU Project kernel [Stallman02].


