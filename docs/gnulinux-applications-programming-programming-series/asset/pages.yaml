    # tar


    The tar command (named for Tape ARChive) is a useful and versatile archiving compressing
    utility. Targets for tar can be files or directories, where the directories are
    recursed to gather the full contents of the directory tree. Let''s look at uses
    of the tar utility, investigating a variety of the options as we go.


    We can create a new archive using tar as follows:


    ```

    tar cf mytar.tar mydir/

    ```


    We specify two options for creating an archive of directory mydir. The c option
    instructs tar to create a new archive with the name (identified via f option)
    mytar. tar. The final arguments are the list of files and/or directories to archive
    (for which files will be included in the archive).


    Now let''s say we want to take our tar file (also called a tarball) and re-create
    the subdirectory and its contents (otherwise known as the extract option). We
    could do this (in another subdirectories) by simply typing:


    ```

    tar xf mytar.tar

    ```


    If we''d like to know the contents of our tarball without having to unarchive
    the contents, we could do this:


    ```

    tar tf mytar.tar

    ```


    which lists all files with their directory paths intact.


    By adding the v, or verbose option, we can view the operation of the tar utility
    as it works. For both creating and extracting archives, use the verbose option
    as:


    ```

    tar cvf mytar.tar mydir/

    tar xvf mytar.tar

    ```


    One of the most important aspects of the tar utility is the automatic compression
    of the tarball. This is performed using the z option and works symmetrically for
    both creation and extraction of archives, as:


    ```

    tar czf mytar.tgz mydir/

    tar xzf mytar.tgz

    ```


    A compressed tarball can take more time to create and extract, but this can still
    be beneficial, especially if the set of files is intended to be transferred over
    the Internet.'
