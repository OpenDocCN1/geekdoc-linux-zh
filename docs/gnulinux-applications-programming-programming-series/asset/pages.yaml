    # shmdt


    The shmdt API function detaches an attached shared memory segment from a process.
    When a process no longer needs access to the memory, this frees it also unmaps
    the memory mapped into the process’s local address space that was occupied by
    this segment. The prototype for the shmdt function is:


    ```

    #include <sys/types.h>

    #include <sys/shm.h>

    int shmdt( const void *shmaddr );

    ```


    The caller provides the address that was provided by shmat (as its return value).
    A return value of zero indicates a successful detach of the segment. Consider
    the following code snippet as a demonstration of the shmdt call:


    ```

    int shmid;

    void *myAddr;

    /* Get the id for an existing shared memory segment */

    shmid = shmat( MY SHM_SEGMENT, 0, 0 );

    /* Map the segment into our space */

    myAddr = shmat( shmid, 0, 0 );

    ..

    /* Detach (unmap) the segment */

    ret = shmdt( myAddr );

    if (ret == 0) {

    /* Segment detached */

    }

    ```


    Upon successful detach, the shared memory structure is updated as follows. The
    current time (of the shmdt call), the shm_ipid is updated with the process ID
    of the process calling shmdt, and finally the shm_natatch field is decremented
    by 1.


    The address region mapped by the shared memory segment will be unavailable to
    the process and may result in a segment violation if an access is attempted.'
