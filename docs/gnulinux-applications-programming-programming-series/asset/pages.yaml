  md: '# 324 GNU/Linux Application Programming


    The addr and len arguments must be on page boundaries. Let''s look at the lock/unlock
    pairs of functions in detail.

    lock function addresses an address (addr) for which the memory pages represent
    the region to be locked. The len argument defines the size of the region to lock
    (meaning that one or more pages may be locked by the operation).

    A return value of zero means that the pages are locked. When the application is
    finished with the memory, a call to munlock makes the pages available for swapping.

    A return of zero represents success of the unlock system call.


    The following code example illustrates locking of a memory and then unlocking.
    Our buffer is a locally created array of characters.


    Listing 18.6 Locking and Unlocking a Memory Page (on the CD-ROM at ./source/ch18.lock.c)


    ```

    1: #include <stdio.h>

    2: #include <sys/mman.h>

    3:

    4: char data[4096];

    5:

    6: int main()

    7: {

    8: int ret;

    9:

    10: ret = mlock(&addr, 1024);

    11:

    12: printf("mlock ret = %d\n", ret);

    13:

    14: ret = munlock(&addr, 1024);

    15:

    16: printf("munlock ret = %d\n", ret);

    17:

    18: return 0;

    19: }

    ```


    At line 10, we call mlock with a reference to our global buffer (data) and its
    length. We unlock this page by calling munlock with our buffer and size (identically
    to the call to mlock). The entire page containing the buffer is locked, in event
    it falls under the bounds of a page.


    Child processes do not inherit memory locks (created by mlock or mockall). Therefore,
    if a region of memory is created and subprocesses also created to operate upon
    it, each child process should perform its own mlock.'
