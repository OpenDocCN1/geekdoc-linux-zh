  md: 'As we step through a multithreaded program, we''ll find that the focus of the
    debugger can change at any step. This can be annoying, especially when the current
    thread is what we''re interested in debugging. We can instruct GDB not to preempt
    the current thread by locking the scheduler. For example:


    ```

    (gdb) set scheduler-locking on

    ```


    This tells GDB not to preempt the current thread. When we want to allow other
    threads to preempt our current thread, we can set the mode to off:


    ```

    (gdb) set scheduler-locking off

    ```


    Finally, we can identify the current mode using the show command:


    ```

    (gdb) show scheduler-locking

    ```


    Mode for locking scheduler during execution is “on".


    ```

    (gdb)

    ```


    One final important command for thread debugging is the ability to apply a single
    command to all threads within an application. The thread apply all command is
    used for this purpose. For example, the following command will emit a stacktrace
    for every active thread:


    ```

    (gdb) thread apply all backtrace

    ```


    The thread apply command can also apply to a list of threads instead of all threads,
    as illustrated below:


    ```

    (gdb) thread apply 1 4 9 backtrace

    ```


    This performs a stack backtrace on threads 1, 4, and 9.


    # Debugging an Existing Process


    We can debug an application that is currently running by attaching GDB to the
    process. All that we need is the process identifier for the process to debug.
    In this example, we''ve started our application in one terminal and then started
    GDB in another. Once GDB has started, we issue the attach command to attach to
    the process. This suspends the process, allowing us to control it.


    ```

    $ gdb

    GNU gdb Red Hat Linux (5.3post-0.20021129.18rh)

    ...

    ```'
