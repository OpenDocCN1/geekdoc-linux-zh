    ```

    (gdb) break operator if op = 2

    Breakpoint 2 at 0x8048445: file testapp.c, line 48.

    ```


    This tells GDB to break at the operator if the op argument is equal to two (OP_MULTIPLY).
    This can be very useful if you''re looking for a given condition rather than having
    to break at each call and check the variable.


    # Stepping Through the Source


    When we left our debugging session, we had hit a breakpoint on our main function.
    Let''s now step forward through the source. We have a few different possibilities,
    depending upon what we want to achieve (Table 26.2 lists these). To execute the
    next line of code, we can use the step command. This will also step into a function
    (if a function call is the next line to execute). If we prefer to step over a
    function, we could use the next command, which executes the next line and, if
    function, simply performs it and sets the next line to execute to the line after
    the function. The cont command (short for continue) simply starts the program
