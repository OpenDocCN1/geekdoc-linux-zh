  md: '# 280 GNU/Linux Application Programming


    TABLE 16.5 Semaphore Flag Options (sembuf.sem_fig)

    | Flag | Purpose |

    | --- | --- |

    | SEM_UNDO | Undo the semaphore operation if the process exits. |

    | IPC_NOWAIT | Return immediately if the semaphore operation cannot be performed
    (if the process would block) and return an errno of EAGAIN. |


    Another useful operation that can be performed on semaphores is the wait-for-zero
    operation. In this case, the process is blocked until the semaphore value becomes
    zero. This is performed by simply setting the sem_op field to zero, as:


    ```

    struct sembuf;

    ...

    sbm.sem_num = 0;      // semaphore 0

    sbm.sem_op = 0;       // wait for zero

    sbm.sem_flg = 0;      // no flags

    ...

    ```


    As with previous semops, setting sem_flig with IPC_NOWAIT causes semop to return
    immediately if the operation would block with an errno of EAGAIN.

    Finally, if the semaphore is removed while a process is blocked on it (via a semop
    operation), the process becomes immediately unblocked and an errno value is returned
    as EIDRM.


