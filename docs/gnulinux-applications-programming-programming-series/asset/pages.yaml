    | /dog/ | Matches any occurrence of dog |

    | /[a-z]/ | Matches a single character through z |

    | /[a-zA-Z]/ | Matches single characters through z and A through Z |

    | /[0-9]/ | Matches all single digits (0 through 9) |

    | /0[ab]/ | Matches 0a and 0b |

    | /\Z*/ | Matches zero or more occurrences of Z ("Z, ZZ, ZZZ, and so on) |

    | /\?/ | Match zero or one instance of Z ("Z") |

    | /[^digit]/ | Matches any single character other than digits |

    | /t.m/ | Matches any occurrence of t separate by one character followed by m,
    as tim, tom, and so on |


    These patterns illustrate a number of special symbols used within regular expressions.
    For example, the | indicates a range of characters. The - symbol * character indicates
    that a character may repeat zero or more times. The ? specifies that one or zero
    instances of the character is used for the match. The ^ character indicates the
    characters that are NOT used for the match. Finally, the . character matches any
    character.


    Two other regular expressions (called anchors) that we''ll explore with sed in
    this chapter include ^ (different context before) to match at the beginning of
    the line and $ to match at the end of the line. For example:


    | /^The/ | Matches "The" at the beginning of a line |

    | /end.$ | Matches "end." at the end of a line |

    | /^T.*$/ | Matches lines that start with T and end with . |


