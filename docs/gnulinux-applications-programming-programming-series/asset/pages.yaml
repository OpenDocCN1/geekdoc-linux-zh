  md: "# Code Hardening 463\n\nSplint also supports modes for standard checking (-checks),\
    \ the default mode, moderate checking (-checks), and extremely strict checking\
    \ (-strict).\n\nThe flawfinder tool (developed by David Wheeler) is another useful\
    \ tool that statically checks sources in search of errors. flawfinder provides\
    \ useful error messages that can be tutorial in nature. Consider the following\
    \ example:\n\n```\n$ flawfinder test.c\ntest.c:11: [2] (buffer) char:\nStatically-sized\
    \ arrays can be overflow. Perform bounds checking, use functions that limit length,\
    \ or ensure that the size is larger than the maximum possible length.\n$\n```\n\
    \nIn this case, an array was found that not necessarily present a security issue,\
    \ but a gentle reminder is provided of the potential for exploitation.\nMany other\
    \ source checking tools exist, such as RATS (Rough Auditing Tool for Security)\
    \ and ITS4 (static vulnerability scanner). URLs for these tools can be found in\
    \ the “Resources” section of this chapter.\n\n# CODE TRACING\n\nOne useful topic\
    \ is that of system call tracing. While not specifically a source auditing tool,\
    \ it could be a very useful tool for understanding the underlying operation of\
    \ a GNU/Linux application. The trace utility provides the capability to trace\
    \ the execution of an application from the perspective of system calls (such as\
