    # grep


    The grep command permits searching one or more files for a given pattern. The
    format of the grep command can be complex, but the simpler examples are quite
    useful. Let''s look at a few simple examples and discuss what they achieve.

    in its simplest form, we can search a single file for a given search string, as:


    ```

    grep "the" file.txt

    ```


    The result of this example is each line emitted to stdout that contains the word
    the. Rather than specify a single file, we can use the wildcard to check multiple
    files, as:


    ```

    grep "the" *.txt

    ```


    In this case, all files in the current subdirectly that end in .txt are checked
    for the search string.'
