    will terminate the application. We then emit the message to enter the password
    within three seconds and try to read the password from the keyboard (stdin). If
    the read succeeds, we disable the alarm (by calling alarm with an argument of
    zero). The else portion of the test (line 30) would check the user password and
    continue. If the alarm timed out, a SIGALRM would be generated, resulting in a
    SIGKILL signal, which would terminate the program.


