  md: '# Parser Generation with flex and bison 397


    The lexical analyzer (flex) takes a file of regular expressions and produces a
    finite automaton that recognizes the sequence of tokens for the target language.
    The parser generator (bison) takes a file defining a context free grammar and
    produces an LALR parser that recognizes the language.


    While we focus on flex and bison, some may recognize these tools by their early
    UNIX names flex and yacc (yet-another-compiler-compiler). flex and bison GNU projects,
    therefore we''ll utilize them instead. We''ll look at each of the tools separately
    and then bring them together in a single configuration example.


    # flex


    The fast lexical analyzer generator (or flex) is a tool that uses a collection
    of regular expressions by the user to produce a lexical analyzer. The produced
    application can then be used to tokenize an input file from sequence of characters
    to a sequence of tokens. The generated application is really nothing more than
    a finite automaton derived from the set of regular expressions.


    Let''s now look at a simple example to understand all of what of this means. First,
    the format of a flex input file has the format:


    ```

    %(

    <C declarations>

    %

    <definitions>

    %\%

    <rules>

    %\%

    <user code>

    ```


    The first section introduces a set of C declarations into the resulting lexer.
    Next are definitions, or simple name declarations that are used in the rules section
    (think of them as symbolic regular expressions). This section also contains start
