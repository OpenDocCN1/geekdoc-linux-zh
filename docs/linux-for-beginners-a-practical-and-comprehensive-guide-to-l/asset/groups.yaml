    # System Shutdown, Restart, and Logout Commands


    Thankfully, Linux makes it incredibly user-friendly to restart your computer or
    shut it down. While on most other operating systems, you simply go through the
    buttons and prompts to select shutdown, restart, or logout, with Linux, you can
    do this via the terminal as well.


    For those who are always accessing their terminal, this means that you will be
    able to manage your system with just a few keystrokes. Keep in mind that most
    of these processes will end your current session—for that reason, you must make
    sure that you are ensuring that you will not lose your work as you go. This section
    will guide you through the most common shutdown. With these commands, you can
    begin to take control of the system—you can program the system to shut off at
    a predetermined time or decide to turn off within a few hours or minutes. No matter
    when you choose as your computer''s shutoff time, you will be able to program
    it in. This is the beauty of Linux—you can program whatever commands you desire
    within it.


    - **sudo shutdown -h HH:MM**: After -h, you can enter a time that you would like
    to trigger the computer to turn off. You can enter now or in any other time, keeping
    the format in HH:MM, so if you want your computer to turn off at exactly 7:38
    PM, you will enter:


    > sudo shutdown -h: 19:38


    Without the time included, you will get a message telling you that you must set
    a specific time for the shutdown to occur. Instead of using HH:MM or now, you
    can also opt to do +30 to add 30 minutes to the program.


    - **sudo shutdown -c**: this will cancel the currently scheduled shutdown command
    if you have it set to cancel at a specific point in time. When you use this, you
    will be able to ensure that you are not interrupted by the scheduled shutdown.


    - **sudo reboot**: this will trigger your computer to restart itself.


    - **init Service manager**. This will determine the level at which your program
    is running. There are several different run levels that can be within—from 0-6,
    s, and m.


    - **init 0**: This is shutdown

    - **init 1**: This is the single-user mode or emergency mode. There is no network
    or multitasking.

    - **init 2**: There is no network at this stage, but the support for multitasking
    is available.

    - **init 3**: The network and multitasking are present, but there is no GUI.

    - **init 4**: Similar to init 3, but used in some research. This state is essentially
    irrelevant to you right now.

    - **init 5**: The network is multitasking, and GUI is present.

    - **init 6**: this is used to tell the system to restart.

    - **init s**: this tells the system to enter maintenance mode.

    - **init m**: This tells the system to enter maintenance mode. Synonymous with
    init s.


    - **pkill**: This will kill a process by name. Killing the processes before shutting
    off the system is necessary with Linux, or you risk causing issues with the software
    and files. You can use this to end the sessions of other users as well. When you
    use this to kill other users, make sure that you do not kill a root user or a
    system level process or you will kill the server''s current processes. To kill
    the process of another user, use the following command:


    ```

    pkill -KILL -u {username}

    ```


    - **kill**: This will terminate a process.


    - **logout**: This will force the logout of a shell. You can also use this if
    you are a regular user within the computer. It will log you out of the sh or ssh.


