    The vast majority of use on a computer these days is browsing the internet, and
    if you use Microsoft, you have possibly been using Internet Explorer as your browser.
    If you are one of those people who ditched Internet Explorer as quickly as you
    could for something else, there is the chance that whatever it is that you were
