    Windows 操作系统的长期用户，你可能会觉得不想错过那些已经融入日常生活的某些程序。毕竟，在某些情况下，你可能需要访问 Microsoft Office，例如用于工作、学校或仅仅由于你个人的偏好。虽然运行虚拟机来运行
    Microsoft 以仅足够获取你想要的所有文件绝对是一个选项，但这可能不是你真正想要选择的方案。


    幸运的是，市上有几种针对主流 Windows 应用程序的替代品，这些替代品甚至多了一个额外的奖励——它们通常是免费的。


