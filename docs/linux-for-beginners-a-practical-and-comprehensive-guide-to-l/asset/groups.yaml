    Some of the versions of Linux, known as Linux distributions, or more commonly
    shortened to “Linux distros,” will be easy enough to hop right in to using, while
    others could be your worst nightmare immediately upon installing it, such as Gentoo,
    which requires all programs, including the kernel, to be built from source. This
    chapter will guide you through understanding what a Linux distribution is, how
    to decide which distribution will be right for you and your usage, and then provide
    you with a brief overview of ten of the most common distributions you can find.


    ## What is a Linux Distribution?


    When you think of other operating systems, you would most likely think of Windows
    or macOS—two of the most commonly known and used operating systems out there.
    These are built from the ground up by a single company with incremental upgrades
    and changes, and because of that, you get distinct versions. You have Windows
    XP, Windows 7, Windows, 8, Windows 10, etc. with the latest version of Windows
    (Windows 10 at the time of writing this book), being the most up-to-date and supported.


    If you want to go out and buy Windows for your computer right now through Microsoft,
    your choice is to get Windows 10. Of course, you can get other, older editions
    through other sources, but they are not actively supported, nor are they going
    to always be updated for security. At a certain point, companies stop rolling
    out support for their older, more obsolete software. Unlike Windows or macOS,
    however, Linux is not created by a single company. Linux can be mixed and matched.


    So long as you have all of the right components together to create a complete
    OS, you can put it together. This means that you can, in fact, create an entire
    OS more or less from scratch, using the Linux kernel as your base, though that
    would be quite time-consuming, and you would have to put in some work to configure
    everything to work together. Alternatively, you can seek out Linux distributions.
    The Linux distribution is essentially everything all of the neatly packaged together
    for you. It takes all of the open-source information you would otherwise need
    to seek out on your own and puts it together into a single OS, not unlike what
    you would receive when purchasing licenses to use Windows or macOS. They decide
    which desktops you will have, which programs will be loaded up by default, and
    more, typically with a layer of their own custom interface.


    Of course, this also implies that there will be a nearly infinite number of different
    distributions available to you, all of which can provide all sorts of different
    features. This is why it is important for you to do your research before choosing
    one.


    ## How to Choose the Right Distribution for You


    Now comes the hard part—figuring out which distribution will be right for you.
    As you read through the rest of this chapter, consider the questions that will
    be asked here. What are you installing the OS on? What is the purpose of the OS?
    Do you have any experience? What kind of software availability to you want or
    need? What kind of desktop interface do you want? How often do you need updates?
    All of these are incredibly important questions to keep in mind. If you are not
    careful, you could end up with a version of Linux that you do not actually want,
    or cannot actually make use of.


    As you read through each of the ten distributions that are provided to you, you
    will be provided with a brief overview of the OS itself, whether it is suited
    for beginners or those with plenty of experience, how regularly it is updated,
    and how compatible it is. You will need to choose one that works best for you.


    ## Ubuntu


    The first distribution we will consider Ubuntu. Launched in 2004, it is now officially
    available in three different versions: Desktop, Server, and Core. Each of these
    editions can be run on a computer or in a virtual machine, making this a popular
    choice in OS for cloud computing, especially thanks to its support for OpenStack.
    In fact, Linux is the most popular desktop Linux distribution currently available.
    Originally based on Debian sid, commonly referred to as the unstable distribution,
    thanks to its lack of stability. While Debian sid was unstable, Ubuntu has been
    built intentionally, avoiding the mistakes made within sid or other similar projects.
    In doing so, it created a web-based infrastructure, bug-reporting, and professional
    creation. This particular form of Linux utilizes GNOME, Firefox, and LibreOffice
    by default, all updated, and it utilizes regular, predictable support updates.


    Ultimately, the creation was a well-formed OS that also includes a migration assistant
    for those transferring from Windows, support for latest tech, and it is compatible
    with ATI and NVIDIA graphics cards.


    Difficulty rating: Good for beginners


    Long-term support: Regularly updated distributions every 6 months with long term
    support releases as well.


    ### Pros

    - Regular updates on fixed cycle and support periods

    - Long-term support variants come with 5 years of updates for security

    - Beginner-friendly

    - Widely-used, meaning there is plenty of advice, opinions, and support available
    online


    ### Cons

    - Incompatible with Debian

    - Regular updates often come with major changes that may be annoying to some

    - Variants that are not LTS only have 9 months of security support


    ## Linux Mint


    Linux Mint is a distribution that is based on Ubuntu. This distribution was first
    launched in 2006, just two years after the release of Ubuntu. This particular
    form was created by Clement Lefebvre, a French-born IT specialist who resided
    in Ireland at the time of creation. He had originally been maintaining a website
    that provided help and guides to people new to Linux, and during his time maintaining
    this site, he came up with an idea to develop his own Linux distribution in order
    to address several drawbacks present with other mainstream versions of Linux.


    Though commonly referred to as “Ubuntu done right,” Linux Mint is more than just
    Ubuntu with a refresh—it includes several tools designed to enhance the Linux
    Mint experience, often aptly named with “mint,” such as mintDesktop, mintMenu,
    mintUpdate, and more. The mint tools are designed to be more usable, and greatly
    increase the ease of use, making this one of the easiest forms of Linux to pick
    up thanks to the emphasis on user-friendliness. One of the biggest draws to Linux
    Mint is the fact that the developers are always ready and happy to implement good
    suggestions that will help better the program.


    Difficulty rating: Good for beginners


    Long-term support: Not on a fixed schedule, but is regularly updated, especially
    shortly after each of Ubuntu LTS releases.


    ### Pros

    - mint tools designed for the OS

    - No security advisories

    - User-friendly

    - Not predictably updated

    - Includes multimedia codecs

    - Open to the requests and suggestions of the users


    ## MX Linux


    MX Linux has a bit of a history to it. Originally known as MEPIS Linux, a Debian-based
    distribution meant for both personal and professional purpose desktops, featured
    several cutting-edge features at the time of its creation. However, despite this
    cutting-edge availability, MEPIS Linux eventually was subject to discontinuation.
    Its users, however, were not to be deterred. Merging MEPIS with another Debian-based
    distribution known as antiX resulted in what is known now as MX Linux.


    This is based on Debian’s stable branch, with primary components from both the
    antiX and MEPIS communities. In particular, it utilizes the Xfce desktop along
    with a vertical panel on the side instead of the common horizontal control panel
    across the bottom of most computers. Overall, this distribution is recognized
    as one that offers plenty of modern apps that are occasionally updated, along
    with a stable base, allowing for the creation of good, reliable performance without
    losing those features that people want.


    In particular, MX Linux is recognized for its MX-Tools—a series of graphical administration
    utilities that allow for ready access to several functions, such as managing the
    user accounts on that system, installing codecs, and utilizing and installing
    software packages.

    '
