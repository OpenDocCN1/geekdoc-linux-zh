    commands you can utilize in order to bring it all to the forefront of the terminal
    for you to access as needed. This list for you is provided in alphabetical order
    so you can find the commands by spelling as necessary.


    - **cat**: This will print the content of a file for you. For example, if kitten.txt
    has a long poem about why kittens are cute and fluffy if you use the following
    code:


    ```

    $ cat kitten.txt

    ```


    you will end up with the long poem about cute and fluffy kittens in your terminal.


    - **cd**: This command allows for the changing of the directory to access a new
    one. For example, if you use the following command:


    ```

    $ cd /

    ```


    You will be moved to the root directory. So long as you define the directory that
    you wish to reach, you should be transferred there.


    - **cd ..**: This command allows you to move up one directory level. If you are
    currently looking within a directory named file, and within that directory, there
    is another named basket, for example, using this command will move you from file
    to basket.


    - **cp [file 1] [file 2]:**: This command allows for the copying of one file into
    another one. If the name of file 2 is nonexistent on the system, it will simply
    be copied over. However, if it already exists, the content sharing the same name
    will be overridden. For example:


    ```

    $ cp kitten.txt puppy.txt

    ```


