    ## 命令行界面 (CLI)


    通常情况下，Linux 是通过所谓的命令行界面 (CLI) 管理的。


    这通常也被称为 **shell**。第 4 章将专门深入讨论 shell，但在继续之前，你应该对它们是什么有一个有一个大致的了解。shell 是允许你从键盘输入命令的程序。在
    Linux 中，最常用的程序是 bash (bourne again shell)，它是由 Steve Bourne 编写的 Unix 原始 shell 程序的增强版本。然而，在没有另一个程序的情况下，你无法访问
    shell，该程序将让你能够与 shell 进行通信。这被称为你的**终端模拟器** (terminal emulator)，当你安装了它时，你就可以开始与终端交互。打开终端模拟器将打开另一个窗口，允许通过键入命令进行交互。和
    shell 一样，这些命令以及如何启动和使用终端的指令将在书的后半部分介绍。此时，你只需要知道直接与操作系统交互是你的选项之一就足够了。


    ## Linux 文件层次结构


    为了尽可能有效地运行，Linux 使用了所谓的 **Linux 文件层次结构 (FHS)**。它定义了类 Unix 操作系统（如 Linux）中的目录结构和内容。


    得益于 Linux 基金会 (Linux Foundation) 的维护，这种层次结构得到了管理、维护和规范。


    使用 FHS 时，所有文件和目录都可以在根目录 `/` 下，即使它们在物理或虚拟上存储在其他地方。然而，某些目录只在特定情况下存在，需要安装了特定子系统的系统。在本节中讨论的大多数目录可以在所有
    Unix 操作系统中找到，并且通常以相同的方式使用，尽管你在本小节中获得的描述应仅适用于 Linux。


    ## / (根目录)


    这是整个文件系统的主根。一切都可以追溯到根。只有 root 用户有权限在 `/` 下写入或编辑，你会看到 `/root` 是 root 用户的家目录。注意，`/root`
    与 `/` 不同。


    ## /bin


    这是单用户模式下必须可用的二进制文件列表。它包括二进制格式存储的可执行文件，人类不可读。


    ## /boot


    这些是引导加载文件。你会看到如下文件：


    - Kernel initrd：初始内存磁盘——允许引导加载程序加载内存磁盘。

    - Vmlinux：基于 ELF（可执行和链接格式）的文件，用于调试的未压缩内核镜像。

    - GRUB 文件：引导程序包。


    ## /dev


    这些是设备文件。可能包括终端设备、连接到系统的设备或 USB。


    ## /etc


    这些文件是主机特定的，但系统级的配置文件。你将在本部分找到所有程序的各种配置文件，以及启动或结束程序所需的启动和关闭 shell 脚本。


    ## /home


    你在这里找到个人设置、保存的文件以及家目录。如果你下载并保存了它，就会在这里。它很可能以你的配置文件或计算机名称命名，格式如 `/home/用户名`。


    ## /lib


    这是 `/bin/` 和 `/sbin/` 中保存的二进制文件所需的任何库。


    ## /media


    你在这里找到移动介质的挂载点。通常，你会在这里看到挂载格式的名称，例如插入 CD 时显示 `/media/cdrom`，插入 USB 盘时显示 `/media/usb-drive`。


    ## /mnt


    指向临时挂载的文件。系统管理员可以在此目录中挂载临时文件系统。


    ## /opt


    指向可选应用程序软件。这些文件将托管附加应用程序，它们应该位于 `/opt` 或 `/opt` 内的某个子目录下。


    ## /proc


    一个包含进程和内核信息的虚拟系统。通常，这是自动生成的


