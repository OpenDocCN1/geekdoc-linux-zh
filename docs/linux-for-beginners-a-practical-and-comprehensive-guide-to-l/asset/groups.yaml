    ## /sbin


    This is another file for binary executables, but /sbin files are typically used
    for maintenance purposes by the system admin.


    ## /srv


    Standing for "service," /srv holds data that is related to server-specific functions
    or services.


    ## /tmp


    These are temporary files that are most likely not going to be preserved when
    the system eventually shuts down and reboots. Typically, these are also restricted
    in the size they can take up.


    ## /usr


    This is the secondary hierarchy level for read-only user data.


    This will house most of the user utilities and applications. It is filled with
    several different files, such as:


    - /usr/bin: binary files for user programs

    - /usr/sbin: the system admins’ binary files

    - /usr/lib: libraries for /usr/bin or /usr/sbin

    - /usr/local: Programs that have been installed from their sources

    - /usr/src: the Linux kernel sources


    ## The Process Architecture of Linux


    Process architecture is the design that dictates the hierarchy of processes and
    systems when transforming any inputs to outputs in computing. While this sounds
    complicated to understand at a glance, hopefully, this subchapter will help you
    get through this process with ease.


    ## The purpose of the process architecture


    Within the Linux kernel are several subsystems, and the most important is the
    process scheduler. The purpose of the process scheduler is to control any access
    to the CPU, regardless of whether the access is via user process or from another
    kernel subsystem. This is all done by the process scheduler, which can itself
    be divided into four distinct modules as it interacts with the rest of the computer.


    ## Linux processes


    Commands issued to Linux trigger processes. When you insert a command into Linux,
    then a new process begins. This process is assigned a 5-digit ID that allows the
    OS to track the processes—this will be known as the pid (process ID). While pids
    may be recycled, no two processes will share the same pid at the same time due
    to the pids being the process through which Linux is able to track the process
    in the first place. This process is run one of two ways: In the foreground or
    in the background. When in the foreground, where processes start by default, you
    are able to insert your input to the keyboard, and you get output on the screen.
    However, while these processes are running in the foreground, you are unable to
    complete other processes as well. For this reason, sometimes, processes get booted
    to background processes, where they run in the background, with no access to keyboard
    input, until that input becomes required. With it running in the background, other
    processes can be handled at the same time, meaning you can multitask until you
    are required to input further data. The process runs as one of three distinct
    types: Parent and child, zombie or orphan, or daemon processes. Each of these
    different process types function slightly differently.


    - **Parent and child process**: This occurs when a process creates another process.
    The created process is known as the child process while the parent process is
    the one that triggered the second.

    - **Zombie and orphan process**: Upon finishing its function, the child process
    becomes terminated, and SIGCHLD, the signal from the interface to the parent process,
    informs the parent process of the termination of the child process. However, sometimes,
    the parent process is terminated before the child process terminates, creating
    a situation in which the child is orphaned.

    - **Daemon process**: These are processes that run in the background, without
    access to a controlling terminal. They are often used to provide system services,
    such as web servers or print servers.


