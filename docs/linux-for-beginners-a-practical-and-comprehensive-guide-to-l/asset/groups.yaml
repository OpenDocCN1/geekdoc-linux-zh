    ## Ring


    ![](img/9f7f9b434643423b7aefac26177e90a3_163_0.png)


    In the ring topology, a LAN is set up with the topology of a ring. Each node is
    connected to two others within a closed loop, and all messages will travel around
    that circle. This allows the message that is being passed along to be regenerated
    with each node it goes through.


    ## Tree


    The tree topology is a hybrid of the bus and star topologies to create what looks
    like trees when drawn out. It involves several star-configured networks that connect
    to a single linear backbone. This is great for larger computer networks that are
    benefitted by being broken into easily managed pieces, but the system is at a
    disadvantage because the backbone acts as a hub, and if that fails, everything
    fails.


    ## Mesh


    Full mesh topology connects every node to a circuit connecting it to every other
    node within the network. It is expensive to manage, but it also leads to the most
    redundancy—which means that it is safer. Even if a single node fails, traffic
    can continue because all nodes are interconnected. Sometimes, some nodes are organized
    with a full-mesh pattern while others are not entirely interconnected, allowing
    for some redundancy and some money saved, while still managing an effective network.
    This is known as partial mesh topology.


    ## Main Protocols of the Internet


    ### TCP/IP


    As a precursor to routing, you must first understand the TCP/IP network model.
    This is the way that packets are able to find their way back and forth across
    the internet, allowing them to reach the right host within the network. Within
    this network model, there are five layers that describe the necessary processes
    to actively shift and move the packets from the host to host as necessary, no
    matter whether that host is local or across the world.


    | Layer | Description |

    ||||

    | *Application layer | Browser initiates an HTTP connection request message |

    | *Transport layer | Message is encapsulated and given a source port |

    | *Internet layer | The data is encapsulated into a packet with source and destination
    IPs |

    | *Data link layer | Data link layer identifies MAC address and sends it there
    over the wire |

    | *Physical layer | Default router receives the data and determines the path |


    - **Application layer (Message):** It all starts with a message. The first layer
    consists of the necessary protocols that will be needed for communication, such
    as HTTP, SSH, IMAP, and any other commands that will be necessary. When you then
    request a webpage at any point, the message is communicated through one of those
    formats.

    - **Transport layer (TCP):** Next is the TCP segment—this provides the data transport
    from end to end and also manages the flow. It is independent of the data that
    is being transported.

    - **Internet layer (Packet):** This is done on the internet layer of things. It
    is the part that routes data across the appropriate networks in order to ensure
    that they arrive at the proper final destination through the use of IP addresses
    and routing tables.

    - **Data link layer (Frame):** This layer controls and facilitates the direct
    connections that occur between hardware within a single physical network. It uses
    MAC (Media Access Control) address within NICs (Network Interface Cards) in order
    to recognize any devices that are connected to the network. It is only able to
    interact with other devices and hosts that share a network together.

    - **Physical layer (Bits):** This is the layer consisting of NICs and a physical
    Ethernet cable that allows for the connection between networks. The Ethernet cable
    is what enables the bits to be transmitted.


    ## IPv4


    This refers to the Internet Protocol Address version 4—it is your IP address.
    With the IPv4, you are using the 4th protocol. Effectively, the IPv4 address will
    be a 32-bit number displayed in dotted decimal notation. You will see two primary
    components—the network''s prefix and the host number. Every host sharing the same
    network will also share the same network address. However, each host will also
    have its own part of the number that is unique. If the device is accessing the
    internet and is visible to those outside of the network, it must contain a globally
    unique number.


    ## TCP


    Standing for the transmission control protocol, this is one of the main protocols
    of the internet protocol suite. It was designed to create a standard that allows
    everyone to establish and maintain a network conversation because everyone is
    using data that is compatible. It allows for the exchange of data in the form
    of packets.


    ## UDP


    Referring to the User Datagram Protocol, this is an alternate communications protocol
    to the TCP model discussed above. The UDP is used to establish low-latency and
    loss-tolerant connections to allow for high speeds and low risk.


    ## Routing


    Now, at this point, you may be considering turning your Linux server into a router—this
    is a valid point, and several people do it. In order to do this, you must first
    do a configuration of the router, and then you must assign the address necessary.


    ## Linux as a Router


    First, you must configure the device. This will require you to set an IP address
    on two devices first, making sure that they each use the same gateway IP. Now,
    what you want to do is set your network to accommodate that gateway IP.


    To do this, you must first login to the root account, and then run the command


    ```bash

    # nmtui

    ```


    Next, choose the option to Edit a connection and hit the Enter key. Choose the
    available Ethernet that is present on the leftmost side of the window and select
    Edit on the right, once again pressing Enter.


    At this stage, you will have the opportunity to set your IPv4 configuration to
    manual. Then, you need to enter the IP addresses that you wish to have access
    to the network. You can add more if you need to.


    Select Quit and then press Enter. At this point, you should restart the network,
    and you will need to then confirm that the changes took. In order to do this,
    you will enter the command:


    ```bash

    # ip addr

    ```


    You should then be able to see the systems that can access the gateway without
    accessing the other network. You can confirm this with a ping command. The ping
    should come back as the destination host unreachable.


    ## ifconfig command


    ifconfig is a CLI designed for network interface configuration. Beyond just that,
    it also serves to initialize interfaces during boot up. When the server is actively
    running, ifconfig can further be used to assign IP Addresses to interfaces, as
    well as enabling or disabling any interfaces on demand. This command will also
    allow you to view the status IP, any hardware MAC addresses, and the maximum transmission
    unit (MTU) for all interfaces.


    ## DNS settings


    If you find that your DNS settings are misconfigured or you need to change them
    in some way, there is a simple enough process for this. You will do so by adding
    name servers to your configuration file.


    Within most Linux systems, the DNS will create names within the /etc/resolv.conf
    file. This file will usually contain at least one nameserver line. That line will
    be the defining line for the DNS server. The name servers will be prioritized
    by the order that they are found within the system. For ease of access, use the
    IP addresses of the servers you will be using.


    To manage this, you will need to open the resolv.conf file with some sort of editor
    program, such as nano or vi. If nano is not yet in use on your system, try the
    following command:


    ```bash

    $ sudo nano /etc/resolv.conf

    ```


    You should then have access to add lines for the name servers you are using. Most
    often, you will want the one that will be hosting any cloud servers you have.
    With the line added, you can then save the file. Of course, as with after any
    major change, check the ping to ensure that the domain settings took and confirm
    that you are, in fact, using the specified IP address. If you have gotten a message
    at this point that says that your host was unknown, you may need to try resetting
    the IP address one more time, as there may be an error within the one that you
    set up.


    ## /etc/hosts


    This command will allow you to configure the DNS locally instead of using external
    IP addresses. When you use the /etc/hosts command, you will ensure that the naming
    structure is right.

