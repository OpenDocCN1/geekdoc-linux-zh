  mdcn: '

    你可以安装的系统仅受限于你可用的物理硬盘空间。如果你有足够的空间，可以继续添加其他几个操作系统的安装。然而，你必须记住，这些安装中的每一个都将至少占用你硬盘内的几
    GB 字节空间。你也可以选择同时运行多台虚拟机，尽管同样，你会发现上限是你的物理硬件。


    你的每台虚拟机都需要访问一些处理器、内存（RAM）和其他资源，这意味着你在任何给定时间里活跃尝试使用的资源越多，运行性能就越可能越弱。人们可能选择运行虚拟机的原因有几个点。对于某些人来说，这可能只是为了好玩。如果你对计算机及其工作原理特别感兴趣，你可能会选择使用虚拟机在那些没有作为主操作系统的其他操作系统中进行尝试。这意味着你可以在决定是否真的要物理安装某个新操作系统之前对其进行折腾，例如，在选择你喜欢使用的哪一个之前，先玩玩几个不同的
    Linux 发行版。


    其他人可能会发现，他们有时会有非常特定的需求，需要某个只有特定操作系统才提供的限制程序。例如，如果你正在运行 Linux，但需要一个主要包含在 Windows
    XP 中的应用程序，你可以选择在虚拟机上运行 Windows XP 以使用该特定程序。


    人们使用虚拟机的另一个常见原因是虚拟机是沙箱化的。这意味着所有内容都包含在虚拟机内部，因此你在虚拟机内部可以做的任何事情都不会让你系统的其他部分面临风险。


    就像沙箱及其包含它的侧壁一样，虚拟机被完全隔离在硬盘内，不会受到你在其中所选择执行的任何操作的影响。这意味着你可以在一个安全空间内测试正在开发的应用程序，而不必担心如果整个系统失败可能会引发的后果。


    ![](img/9f7f9b434643423b77_0.png)


    ## 在物理硬件上安装 Linux


    然而，在开始担心虚拟机之前，你将首先学习如何在物理硬件上安装 Linux。在使用此过程时，你正在创建一个在你的电脑上安装 Linux 作为一个独立分区（partition）的选项。


    这意味着你的机器上将有两个（或多个）操作系统。这个过程将一步一步提供给你。


    ### 第 1 步：下载 Linux 发行版


    你在上一章中选好你的发行版了吗？如果是的话，这就是你需要搜索的内容。如果你还没有决定倾向于使用哪一个，你将花时间做决定。如果你正在读这本书，你很可能是 Linux
    的新手，正因如此，你会发现使用轻量级发行版对你更有帮助，它们会更用户友好，例如 Ubuntu 或 Linux Mint。当然，如果你愿意，你也可以挑战自己，尝试一些更复杂的东西。在开始之前，请确保你有一个可以用于安装的
    CD 或 USB 闪盘。


    由于 CD 驱动器在许多消费级产品中已变得过时，USB 可能是任何计算机上最易获取的形式。


    一旦你选择了要使用的发行版，你就必须下载它。你可以在那里找到 ISO 格式的免费下载版发行版。这是一个存档文件，包含了光盘上数据的相同副本，是分发 Linux
    最常见的格式。这个相同副本被称为镜像（image），也就是你为了安装软件而寻求复制的内容。


    - 1. 在发行版的官方网站上下载你选择的 Linux 发行版的 ISO 文件。

    - 2. 使用 Rufus 等程序准备可启动的 USB。

    - 3. 安装像 Pen Drive Linux 或 UNetbootin 这样的镜像刻录程序。

    - 4. 将镜像加载到已格式化的 USB 闪盘中。


    ### 第 2 步：启动到 Live USB


    现在，你的任务首先是加载到 Live USB。大多数计算机被设置为从硬盘启动，因此在它进行必要的更改之前，你需要对默认启动顺序进行一些修改。这个过程听起来并没有那么可怕——你所做的就是重启电脑，进入启动菜单，并选择你希望计算机从哪个源启动。有时，启动菜单是隐藏起来的，但仍然是可以访问的。在这些情况下，你需要访问
    BIOS 菜单以进入启动菜单，这可以在启动界面处完成。


    加载到 BIOS 菜单所需的命令应该显示在启动界面的下方的角落之一。


    - 1. 重启电脑

    - 2. 当计算机重启时，按下触发启动菜单的键。你应该在启动界面的角上看到所需的键——即在初始启动期间显示制造商标志的屏幕。访问启动菜单的常用键是 F12
    或 Del。

    - a. 如果你正在使用 Windows 8，尝试在点击重启时按住 Shift 键。这将触发计算机带高级启动选项启动，允许你做出决定。

    - 3. 在启动菜单中，选择你正用于加载 Linux 的 Live USB 或 CD。选择好方法后，保存并退出启动菜单或 BIOS。你的机器将按照你所选的设置继续启动过程。


    ### 第 3 步：安装前尝试 Linux（可选）


    尝试你正在安装的 Linux 版本是可选的，但如果你还不熟悉 Linux，强烈建议这样做。


    你的 Live USB 允许你进入所谓的“环境环境”，让你在花费时间安装和格式化任何更改之前对其进行测试。虽然在此阶段你无法创建文件。


    ### 第 4 步：开始安装


    安装过程本身非常简单。从启动菜单开始，你将有安装而非启动的选项。在此点上，你的机器将处理大部分工作，但你会被提示配置基本选项，例如你将与操作系统使用的语言、键盘布局和时区。


    ### 第 5 步：创建用户


    在此时，系统会提示你为操作系统创建登录信息。你将输入姓名、计算机名称、你为该实例选择的用户名以及用于登录的密码，确认你有权限执行任何管理任务。


    ### 第 6 步：创建分区（可选）


    如果 Linux 是你的主操作系统，你可以跳过此步。然而，如果你在机器上运行多个系统，你将为你的 Linux 版本专门划分出一个分区。分区是按照特定操作系统要求进行格式化的部分，以便操作系统按预期运行。某些对用户友好的发行版（如
    Ubuntu）会自动格式化分区，尽管你也可以手动调整大小。请记住，大多数安装至少需要 20 GB，因此你必须确保你设置的任何分区都能容纳操作系统以及存储其中的任何其他文件和程序。有时，安装过程不会自动配置自动分区，当发生这种情况时，你必须确保该分区为
    Ext4 格式。


    ### 第 7 步：启动 Linux


    当安装完成后，它会自动提示你重启。启动时，你将看到一个不同的屏幕。这将调出引导程序，提示你选择正在安装的发行版。你可能会遇到的引导程序之一是 GNU GRUB。


    当然，如果你选择跳过分区阶段并将你的 Linux 发行版作为唯一操作系统加载，你可能不会自动看到这个屏幕。和之前一样，你可以在启动界面加载后立即按下 Shift
    键来触发引导程序。

    '
