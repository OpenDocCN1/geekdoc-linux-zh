    - d. 集线器过时且不再使用了


    + 4. 为什么要创建网络？

    + a. 方便文件分

    - b. 分享数据

    - c. 连接性

    - d. 冗余

    - e. 以上都是

    - f. 以上都不是


    + 5. 对错：只有当你打算玩游戏或其他在互联网上流传输大量数据时，你才真的需要访问网络


    # 第 7 章答案页


    + 1. **B:** 虽然你有一个个人网络，但那不是本章的语境。Linux 意义上的网络是一组能够以某种方式共享文件的连接设备。


    + 2. **B:** 广域网。虽然互联网在某种意义上可以被视为 WAN，但它并不是 WAN 的全称。这是一个涵盖大地理区域的网络。


    + 3. **A:** 整个系统都会停止工作。当实现集线器时，它是整个网络的中央处理能力，没有集线器，系统的其余部分没有实际的方法正常运行。


    + 4. **E:** 以上都是。如果你在某种程度上有正当需求，那么建立网络有无尽的理由。如果你需要定期共享文件，或者想在家庭系统之间轻松切换，这些是绝对推荐的。


    + 5. **错误:** 事实上，网络作为文件的长期存储实际上可以运行得非常好，这让文件处于闲置、未使用的状态，而不是使用游戏或流媒体将涉及的高强度互联网进程。


