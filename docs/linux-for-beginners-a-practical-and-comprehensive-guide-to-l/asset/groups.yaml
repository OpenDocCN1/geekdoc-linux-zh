    Difficulty rating: Good for beginners


    **Long-term support:** Features occasional updates through backports


    ## Pros


    ## Cons


    - Immediate support for graphics drivers, codecs, and browser plugins allow for
    near-instant startup out of the box

    - Simple and dated appearance

    - The installer and other configuration tools may take some time to adjust to

    - Stable

    - Updated periodically

    - Convenient features


    ## openSUSE


    Dating back to 1992, openSUSE came about when four German Linux enthusiasts launched
    it. Thomas Wehr, Roland Dyroff, Hubert Mantel, and Burch Steinbild started out
    selling floppy disks with the German edition of Slackware but quickly created
    their own program: SuSE (Software und System Entwicklung, or software and system
    development). In 1996, SuSE Linux became its own distribution, over time, more
    and more features were adopted, such as the RPM package management tool, a graphical
    system administration tool designed for usability, and more. They released frequently,
    kept fantastic documentation, and made their product readily available, and SuSE
    Linux grew more and more popular.


    In 2003, it was acquired by Novell, INC, and eventually transferred to Attachmate
    in 2010. These exchanges in ownership led to major changes in development, and
    eventually, the change in name from SuSE to openSUSE. Despite the constant changes,
    however, it is readily available for free. You can find openSUSE in two primary
    editions. Leap grants users a platform that is stable and has several years of
    support. Tumbleweed, on the other hand, uses a rolling release environment, and
    this is made smooth by the easy configuration and automated filesystem snapshots
    and boot environments.


    Difficulty rating: Good for beginners with some experience


    Long-term support: Plenty of support offered


    ## Pros


    ## Cons


    - Configuration tool is comprehensive

    - Plenty of software packages

    - Fantastic website infrastructure

    - Plenty of printed documentation and support

    - Btrfs with boot environments


    - Bloated and heavy desktop setup

    - Graphical utilities are slow


    ## Fedora


    Fedora itself was not announced and revealed until 2004, though its roots back
    to 1995 with Red Hat Linux, which was launched by Bob Young and Marc Ewing. Their
    product was released and updated several times, and in 1997, it added the RPM
    package management system, along with several other advanced features, which quickly
    shot Red Hat to popularity, eventually even surpassing Slack Linux as the most
    widely-used distribution at the time. In 2003, after Red Hat Linux 9 was released,
    the company made some significant changes, keeping Red Hat trademarked as commercial
    use and then also adding in Fedora Core.


    Eventually named just Fedora, this system is sponsored by Red Hat but primarily
    oriented toward the Linux hobbyist. Despite initial reservations, it was quickly
    accepted and once again skyrocketed back to its status as one of the favorites.


    This is commonly deemed one of the more innovative of the options available these
    days. Fedora has led the way in contributions to Linux as a whole and has made
    use of several enterprise-level features. However, it runs into some downsides
    as well—it requires technical knowhow to really make good use of it, meaning that
    it is still a better product for the hobbyists who enjoy tinkering rather than
    someone trying to learn.


    **Difficulty rating:** Intermediate


    **Long-term support:** Regularly updated


    ## Pros


    ## Cons


    - Innovative

    - Secure

    - Massive number of supported packages

    - Strongly aligned with free software philosophy


    - Enterprise rather than desktop features and usability

    - Bleeding-edge features can sometimes be alienating to those who are less familiar
    with the system

    - Requires a bit more finesse with Linux in general


    ## Debian GNU/Linux


    Announced in 1993, this was designed to become a non-commercial project completed
    through volunteer work of hundreds of developers. Most people thought it would
    fail—after all, how could hundreds of developers code for free in their spare
