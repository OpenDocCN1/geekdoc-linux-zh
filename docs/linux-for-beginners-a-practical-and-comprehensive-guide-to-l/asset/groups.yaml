    Windows 上使用虚拟机并不困难。Windows 10 的 64 位专业版、企业版或教育版已经预装了名为 Hyper-V 的专有虚拟机，这意味着你不需要特意去获取更多软件。如果你还没有
    Hyper-V，你将需要找到一个 VM 程序。你可以使用的一个免费选项是 Oracle VM VirtualBox。


    ## 第 1 步：安装虚拟机


    首先验证你是否已经安装了虚拟机。通过在电脑的“Windows 功能”中搜索“Hyper-V”来实现。你应该会在左侧看到一些方框。当你勾选这些文件旁边的方框时，你正在开启或关闭文件。如果你能在电脑上找到
    Hyper-V，请点击启用它。安装完成后，你需要重启电脑。如果你没有 Hyper-V，请在网上搜索另一个你喜欢的 VM 程序并安装它。


    ## 第 2 步：设置虚拟机


    在这个阶段，你必须确保有足够的硬盘空间来存放你选择的操作系统和文件，并且你需要一个打算使用的 ISO 文件。与之前的版本一样，ISO 可以从发行版那里下载。


    如果你正在使用 Hyper-V，搜索“Hyper-V 快速创建”（Quick Create）将为你提供一种快捷方式，确保一切都按需要设置好。你只需要按照程序中屏幕上的提示操作，如果你不想使用提供的提供的文件之一，则选择你的
    ISO 文件即可。


    如果没有 Hyper-V，你会发现过程稍微没那么流畅，但总体来说仍然非常容易处理。大多数虚拟化软件都会非常相似——决定你喜欢哪种取决于你的喜好和可用性。


    - 1. 启动 VirtualBox 后，你会看到一个空菜单。从那里，你需要点击程序窗口左上角的“新建”（NEW）图标。然后你将为虚拟机命名，并选择你将使用的哪种操作系统。

    - 2. 接下来，你需要为虚拟机分配内存，为其提供必要的资源。通常，最好的办法是采用推荐的量然后点击“下一步”。

    - 3. 你看到的下一个提示将询问你是否想添加虚拟驱动器。同意此项，点击“创建”（Create），并在列表中选择 VDI。VDI 代表虚拟磁盘映像。在下一页上选择“固定大小”（Fixed
    Size）选项。最后，你会被要求为你正在使用的驱动器命名并确认大小。

    - 4. 点击“创建”，虚拟驱动器就创建好了。


    ## 第 3 步：安装操作系统


    此时，是时候安装你选择的 Linux 发行版了。在 VirtualBox 窗口中，点击启动箭头。它应该打开一个标题为“选择启动磁盘”（Select start-up
    disk）的窗口。点击下拉菜单右侧的文件夹，在这里，你可以选择你发行版的 ISO 文件。从那里，你只需要点击“启动”，操作系统应该就会完成安装。


    ## 第 4 步：关闭虚拟机


    当你完成对该机器的操作时，请忍住直接退出窗口的冲动。相反，点击“文件”（File）菜单，并在选择“关闭”的同时选择“保存虚拟机状态”（Save the machine
    state）。这确保你将保留虚拟机内部的信息。


    ## 在 macOS High Sierra 上的虚拟机上安装 Linux


    在编写此本书时，当前的 macOS 是 High Sierra。在 High Sierra 上通过虚拟机安装 Linux 与你在 Windows 上执行该的过程很大相似。考虑到到此时，你已经在引导下完成了最困难的过程，这将是所有指南中最简短的一个。在本章中，你所做的新操作就是在
    macOS 上安装 VirtualBox。从那里，你可以遵循上一个小节中的详细步骤。


    ## 第 1 步：运行 VirtualBox


    - 1. 从运行 VirtualBox 安装程序开始。你可能会看到一个警告，称 macOS 不允许安全的系统扩展。只需点击“下一步”并继续。

    - 2. 安装结束时，它会失败。不要担心失败，只需继续遵循本教程。

    - 3. 转到“系统偏好设置”中的“安全性与隐私”。在底部，应该有一个提示说系统软件被阻止。在窗口的左下角，点击锁。它会要求你输入密码。输入后，在显示程序被阻止的消息旁边点击“允许”。

    - 4. 重新加载 VirtualBox 安装程序。


    ## 第 3 章测验


    恭喜！你已经完成了第 3 章。到此时，你应该准备好学习第 4 章。尝试回答这些问题以确保你理解基础。答案将在下一页。


    - 1. 哪些工具用于安装 Linux（无论是在硬件上还是虚拟机上）？

    a. ISO 文件

    b. USB 驱动器

    c. Virtualbox

    d. A 和 C

    e. 以上所有

    f. 都不是


    - 2. 在同一系统上运行多个操作系统需要什么？

    a. Virtualbox

    b. USB 驱动器

    c. 对硬盘进行分区

    d. 拥有两个硬盘的电脑

    e. 以上所有

    f. 都不是


    - 3. 什么是虚拟机？

    a. 一个能够在同时运行操作系统内操作系统的计算机

    b. 一种将操作系统与电脑其他部分隔离的方法

    c. 一种可以测试软件的方法

    d. 以上所有

    e. 都不是


    - 4. 真或假：如果你想运行 Linux，你就需要虚拟机


    - 5. 真或假：你用来加载 ISO 的 USB 驱动器将开箱即用


    ## 第 3 章答案解析


    - 1. A：列出的运行 Linux 所需的组件是用于发行操作系统的 ISO 文件。在虚拟机安装时可以跳过 USB 驱动器，而在带有 USB 的硬件安装时可以跳过
    Virtualbox。

    - 2. C：列出的必要组件是操作系统之间的分区。Virtualbox 是一个特定的虚拟机，但有许多其他可以替代它，USB 驱动器并非必需，你也不需要两个硬盘——虚拟机的整个意义就是分区单个硬盘以适应多个操作系统。

    - 3. D

    - 4. **假**：如果你在硬件上安装 Linux，你就不需要虚拟机。

    - 5. **假**：你必须格式化 USB 驱动器以准备加载 ISO。


