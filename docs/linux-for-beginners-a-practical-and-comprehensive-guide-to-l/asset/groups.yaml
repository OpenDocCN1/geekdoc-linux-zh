    ## CHAPTER 4 QUIZ


    Congratulations! You have made it through Chapter 4. At this point, you should
    have a pretty solid foundation for understanding the Linux shell. Try to answer
    these questions to ensure you understand the basics before moving on. The answer
    key will be on the page directly after this quiz.


