    ## Installing Linux on Physical Hardware


    Before it is time to worry about the virtual machine, however, you will first
    learn how to install Linux on physical hardware. When using this process, you
    are creating the option to install Linux on your computer as a separate partition.


    This means that you will have two (or more) operating systems on your machine.
    This process will be given to you step by step.


    ### Step 1: Downloading the Linux distribution


    Did you choose out distribution in the previous chapter? If so, this is what you
    will be searching. If you have not yet decided which you prefer to use, you will
    need to spend the time making your decision. If you are reading this book, you
    are most likely new to Linux as a whole, and because of this, you will find that
    you are best served by a lightweight distribution that will be a bit more user-friendly,
    such as Ubuntu or Linux Mint. Of course, you can also choose to challenge yourself
    and go for something a bit more intensive if you so choose. Before beginning,
    also make sure that you have a CD or a USB drive that you can use for the installation.


    Because CD drives are largely becoming obsolete in many consumer-grade products,
    the USB is most likely going to be the most readily-accessible form for any computer.


    Once you have chosen the distribution that you will use, you must download it.
    You can find the distro free to download in an ISO format. This is an archive
    file that has an identical copy of data that was found on a disc and is the most
    common format to distribute Linux. The identical copy is known as the image and
    is what you are seeking to copy in order to install the software.


    - 1. Download the ISO for the distribution of Linux you have chosen on the distribution’s
    website.

    - 2. Prepare the USB to become bootable with a program such as Rufus.

    - 3. Install an image burning program such as Pen Drive Linux or UNetboot.

    - 4. Load image onto the formatted USB.


    ### Step 2: Booting into the live USB


    Now, you are tasked with loading into the live USB in the first place. Most computers
    will be set to boot, starting with the hard drive, so you will need to make some
    changes to the default booting order before it makes the necessary changes. This
    process is not as intimidating as it sounds—all you need to do is reboot the computer,
    enter the boot menu, and choose the source that you would like your computer boot
    from. Sometimes, the boot menu is hidden from view, but it is still accessible.
    In these situations, you will need to access the BIOS menu in order to gain access
    to the boot menu, which can be done at the splash screen.


    The command necessary to load into the BIOS menu should be displayed in one of
    the bottom corners on the splash screen.


    - 1. Reboot the computer

    - 2. As the computer reboots, press the key to trigger the boot menu. You should
    see the necessary key in the corner of the splash screen—the screen where the
    manufacturer’s logo is displayed during the initial startup. Common keys to access
    the boot menu are F12 or Del.

    - a. If you are using Windows 8, try holding the Shift key while clicking restart.
    This triggers the computer to boot with the Advanced Startup Options, allowing
    you to make the decision.

    - 3. When in the boot menu, select the live USB or CD that you are using to load
    up Linux. Upon choosing your method, save and exit the boot menu or BIOS. Your
    machine should continue with the booting process with your selected settings.


    ### Step 3: Try Linux before installing (optional)


    Trying the version of Linux that you are in the process of installing is optional,
    but strongly recommended if you are not yet familiar with Linux or you are unsure
    which version to install.


    Your live USB should allow you to launch what is referred to as a live environment,
    allowing you to test it prior to making any sort of changes. While you will be
    unable to create files during this stage, you will be free to navigate the system
    and experience the interface to make an informed decision before spending the
    time to install and format.


    ### Step 4: Starting installation


    The installation process itself is quite simple. From the boot menu, you will
    have the option to install rather than launch. At this point, your machine will
    handle the bulk of the work, but you will be prompted to configure basic options,
    such as the language that you will be using with the OS, the keyboard layout,
    and the time zone you are in.


    ### Step 5: Creating a user


    At this point, you will be prompted to create the login information for your OS.
    You will insert your name, your computer''s name, the username that you are choosing
    for this instance, and a password for logging in and confirming that you are authorized
    to perform any administrative tasks.


    ### Step 6: Creating the partition (optional)


    If Linux is your primary OS, you can skip this step. However, if you are running
    multiple systems systems on your machine, you will need to separate out a partition
    specifically for your version of Linux. The partition is the portion that has
    been formatted in the way that the specific OS requires, allowing for the OS to
    run intended. Some beginner-friendly distributions, such as Ubuntu, will format
    the partition on their own, though you can adjust the size manually. Keep in mind
    that most installations will need at least 20 GB, so you must make sure that whatever
    partition you set will accommodate the OS and any other files and programs that
    will be stored within it. Sometimes, the installation process will not automatically
    configure the automatic partition, and when this happens, you must make sure that
    the partition is in the format Ext4.


    ### Step 7: Booting Linux


    When the installation finishes, it will automatically prompt you to reboot. Upon
    booting, you will see a different screen. This will pull up the bootloader, which
    will prompt you to pick the distribution you are installing. One of the more likely
    bootloaders that you will encounter GNU GRUB.


    Of course, if you have opted to skip the partition stage and load your Linux distro
    as your only OS, you will likely not see this screen automatically. As with before,
    you can trigger the bootloader by pressing the Shift key immediately after the
    manufacturer splash screen loads.

