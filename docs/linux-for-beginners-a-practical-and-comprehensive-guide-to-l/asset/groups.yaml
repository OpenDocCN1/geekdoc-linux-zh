    ## CHAPTER 5: Linux Commands


    This chapter is designed to be a sort of accessible dictionary for you, where
    you can access a wide range of Linux commands on demand in one place. Because,
    especially at first, you are going to find that you are not quite familiar with
    the system commands off the top of your head, it can be useful to have a chapter
    to fall back on to look up the command you will need. These commands are designed
    to be used within the terminal, allowing you to directly communicate to the system
    itself. This means that, through the use of the terminal and the commands provided
    within this chapter, you will be able to directly influence and interact with
    the computer. Course, there are also several rules that you will have to remember
    when utilizing these commands.


    Keep in mind first and foremost that $ is prompt to inform you that the individual
    is officially ready for your input within bash. However, csh will utilize the
    % to prompt you to enter your input. Also, remember that the inclusion of a colon
    after the code within this book is done to separate it from the description of
    that particular command''s function, and the colons should not be included.


    Beyond that, you must also recognize that Linux is, in fact, case-sensitive. If
    you enter a code with a capitalized letter that is not intended to be there, it
    will fail to load up whatever it is that you have prompted it to load in the first
    place. This does come with some advantages, such as allowing for identical strings
    of symbols in the same case to be processed quicker rather than having to process
    all of the letters to ensure that the letter itself is registered in either case
    rather than the specific case expected. Even though computers today are more than
    capable of processing that extra load, a habit has won out, and case-sensitivity
    remains to be a feature to remember.


    ## System Information Commands


    Hardware is incredibly important to be familiar with when you are working with
    the more intricate matters of a computer. For this reason, Linux comes with several
    commands that will allow you to access any information about the hardware that
    you may need. These commands will help you understand the configuration details
    of several hardware components. When you use these commands, you will be able
    to track your current system''s ability to function, and this means that you can
    see how to allocate resources or know how well the system can handle your current
    tasks.


    While some distributions will have slightly different commands, these are the
    most readily available commands out there if you need to gather information about
    your system.


    As you read through these command codes, notice how there are several that seem
    quite similar, but they all have their own nuances that set them apart somehow.
    It can be intimidating to see all of these codes typed out in front of you, but
    remember, there are tools available to you that will help you if you cannot or
    not wish to memorize the commands.


    - **accept**: Allows you to accept a job to a destination.

    - **arch**: Displays the print machine’s hardware name.

    - **date**: Displays the system’s date and time.

    - **df**: This particular command triggers the computer to report the disk space
    available in the file systems. It reports on several different partitions and
    their mount points, providing data for all of it.

    - **fdisk**: This is the utility command to change partitions on hard drives if
    necessary to do so.

    - **free**: This tells your computer to check the amount of RAM on your computer—free,
    used, and the total amount of RAM on the system.

    - **hdparm**: This tells your computer to provide you with information about hard
    disk drives or other sata devices.

    - **hwclock**: Displays or allows for the configuration of the hardware’s clock.

    - **hwinfo**: This is a general purpose command that probes the hardware—it will
    provide you with either detailed or brief information about hardware components,
    providing more than what you may use lshw for.

    - **Inxi**: This is a bash script, meaning it contains a larger code. In fact,
    this particular command has a 10,000 line code within it. In activating this code,
    you will gather all sorts of hardware data from several different sources, placing
    it all into a nice, easy to read a report that even beginners will have little
    issue navigating.

    - **lsblk**: This triggers the device to list out block devices. In doing so,
    you will see hard drive partitions as well as optical and flash drives.

    - **lcpu**: This command will pull up a report about the CPU processing unit on
    your computer.

    - **lspci**: This command lists out pci buses while also giving you further details
    about them. It includes the vga adapter, graphics card, USB ports, and more. With
    this particular command, you can also filter out the specific information you
    are looking for through the utilization of grep, which will be discussed in further
    detail later in the chapter.

    - **lscsi**: This command lists out scsi devices, such as hard drives and optical
    drives.

    - **lsh**: This is a general purpose command that will list out all of the hardware
    installed on your system, as well as the data included within it.

    - **lsusb**: This command provides the user with data about the USB controllers
    and any devices connected to them. You can add in -v to your code if you wish
    for this detailed information to be printed for you.

