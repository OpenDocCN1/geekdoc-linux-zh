    # Point to point


    With this network topology, sometimes referred to as the bus topology, there is
    a central cable that runs between all devices on a LAN and connects them all.
    It is easy to connect to, but if there is any sort of break in the system, the
    whole thing will crash.


    # Star


    ![](img/9f7f9b434643423b7aefac26177e90a3_162_0.png)


