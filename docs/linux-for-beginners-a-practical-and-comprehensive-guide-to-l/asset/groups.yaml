    Windows 用户很久以前就放弃了 Windows Media Player。即使你是它的常用用户之一，转移到 Linux 也不会损失什么。相反，请尝试
    Linuxmce。这个程序不仅限于视频——它还可以用于几种其他功能和程序，例如安全摄像头、电信，以及运行你最初在设备上的所有媒体。它旨在成为一种将家中家电统一的程序，从照明到安全和媒体，以及其间一切。由于我们是将其作为特定的媒体替代品来讨论的，我们将重点关注媒体功能。特别是，它被设计用于连接网络上的多个设备，允许你访问的文件可以在多个位置访问，从而让你确保始终能够获取到你喜欢的媒体。还有其他可以替代
    Windows Media Player 的选项，例如 Moovida、MythTV 和 XBMC Media Center。尝试玩一下其中几个，找到一个真正非常适合你的。


    # Adobe Acrobat Reader 替代品


    特别是在成年后，Adobe Acrobat Reader 非常有用。为了查看便携文档文件 (PDF)，你必须在操作系统中使用某种阅读器。通常情况下，当你使用微软产品时，你会得到
    Adobe Acrobat Reader。如果你确实有 Adobe Acrobat Reader，你可能对它不断发布的无数更新感到熟悉，即使内容几乎没有变化。这意味着你被不断强制更新，即使在没有必要的情况下。当然，如果你放弃了
    Windows，也抛弃了这个问题。相反，你可以使用免费的开源软件选项，这将从根本上消除这个问题。


    更好的是，许多此类免费选项随最常见的 Linux 发行版一起分发。如果你运行一个常见的发行版，它可能包含 Evince、okular 或 Xpdf，它们都完全能够满足你的软件需求。


    事实上，特别是 Xpdf，它为你提供了几种不同的工具，让你不仅仅是读取文件。你能够将 PDF 转换为文本、PostScript 转换为 PPM/PGM/PBM
    图像文件、PNG 文件、HTML 等。它可以提取元数据或原始图像，甚至可以为你提供创建文档时使用的字体。


    它是非常多功能的，虽然它要求你理解命令行工具，但为了完全优化，你会发现它完全能够胜任这项工作。


