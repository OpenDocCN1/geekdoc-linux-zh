    某些版本的 Linux 被 Linux 发行版（Linux distributions），或者更常见的缩写是“Linux distros”。它们中的某些非常容易上手，而另一些在安装后立即就可能成为你的噩梦，例如
    Gentoo，它要求包括内核在内的所有程序都要从源代码编译。本章将引导你理解什么是 Linux 发行版，如何决定哪种发行版适合你和你的用途，然后为你提供你可以找到的十种最常见发行版的简单概述。


    ## 什么是 Linux 发行版？


    当你考虑到其他操作系统时，你最可能会想到 Windows 或 macOS——这是世界上最广为人知和常用的操作系统。这些系统由单一公司从零开始构建，并进行增量式的更新和更改，因此你会得到不同的版本。你有
    Windows XP、Windows 7、Windows 8、Windows 10 等，其中最新版本的 Windows（在写本书时为 Windows 10）是最更新且受支持的。


    如果你现在想通过微软为你的电脑购买 Windows，你的选择是获取 Windows 10。当然，你可以通过其他渠道获取其他较旧的版本，但它们不再获得活跃支持，而且不会总能获得安全更新。在某个时间点，公司会停止对其较旧、更过时的软件提供支持。然而，与
    Windows 或 macOS 不同，Linux 不是由单一公司创建的。Linux 可以进行混合组合。


    只要你收集了所有正确的组件来创建一个完整的操作系统，你就可以将其组装起来。这意味着你实际上可以以 Linux 内核为基础，或或从零创建一个整个操作系统，尽管这会非常耗时，而且你必须投入精力配置所有内容使其协同工作。或者，你可以寻找
    Linux 发行版。Linux 发行版本质上就是所有为你整齐打包在一起的内容。它将你原本可能需要自己寻找的所有开源信息收集起来并整合成单一的操作系统，这与你购买
    Windows 或 macOS 使用许可时收到的非常相似。它们决定了你将拥有什么种桌面、默认加载哪些程序等，通常还带有一层他们自定义的界面。


    当然，这也意味着会有近乎无限的不同发行版供你选择，它们都可以提供各种不同的功能。这就是为什么在选择之前，进行研究是至关重要的。


    ## 如何选择适合你的的发行版


    现在到了最困难的部分——弄清楚哪种发行版适合你。当你阅读本章的剩余内容时，请考虑这里提出的问题。你把操作系统安装在什么设备上？系统的目的是什么？你有任何经验吗？你想要或需要什么种软件可用？你想要什么样的桌面界面？你需要多频繁的更新？所有这些都是在脑中记住的极其重要的问题。如果你不小心，可能会得到一个你实际上并不想要、或无法实际利用的
    Linux 版本。


    当你阅读提供的十种发行版中的每一个时，你将获得关于操作系统本身的简要概述，包括它是否适合初或经验丰富的人士、它的更新频率如何，以及它的兼容性如何。你需要选择一个最适合你的。


    ## Ubuntu


    我们将考虑的第一个发行版是 Ubuntu。它于 2004 年发布，现在官方提供三个版本：桌面版（Desktop）、服务器版（Server）和核心版（Core）。这些版本可以在计算机或虚拟机上运行，使其成为云计算领域流行的操作系统，特别是得益于它对
    OpenStack 的支持。事实上，Linux 是目前最流行的桌面 Linux 发行版。它最初基于 Debian sid（通常被称为不稳定发行版，是由于其缺乏稳定性而得名）。虽然
    Debian sid 是不稳定的，但 Ubuntu 是刻意构建的，避免了在 sid 或其他类似项目中犯的错误。通过这种方式，它创建了基于网络的基础、错误报告和专业创作。这种特定形式的
    Linux 默认使用 GNOME、Firefox 和 LibreOffice，所有均已更新，并利用定期、可预测的支持更新。


    最终，这个创建是一个良好的操作系统，还包含一个为从 Windows 迁移的用户提供的迁移助手、对最新技术的支持，并且兼容 ATI 和 NVIDIA 显卡。


    难度评分：适合初学者


    长期支持：每 6 个月定期更新的发行版，并配有长期支持版本。


    ### 优点

    - 固定周期和支持期间的定期更新

    - 长期支持版（LTS）变体提供 5 年的安全更新

    - 对初学者友好

    - 广泛使用，意味着在网上有大量的建议、意见和支持


    ### 缺点

    - 与 Debian 不兼容

    - 定期更新通常伴随着重大变化，这可能让某些人感到恼恼

    - 非 LTS 变体仅有 9 个月的安全支持


    ## Linux Mint


    Linux Mint 是一个基于 Ubuntu 的发行版。该发行版首次发布于 2006 年，就在 Ubuntu 发布后两年。这种特定形式由 Clement
    Lefebvre 创建，他是一位出生于法国、在创建时居住在爱尔兰的 IT 专家。他最初维护着一个为 Linux 新手提供帮助和指南的网站，在他维护该网站期间，他产生开发自己的
    Linux 发行版想法，以解决其他主流 Linux 版本中存在的几个缺点。


    虽然 Linux Mint 通常被称为“做对了 Ubuntu”，但它 不仅仅是换了新装的 Ubuntu——它包含了旨在增强 Linux Mint 体验的工具，这些工具通常被贴切地以“mint”命名，例如
    mintDesktop、mintMenu、mintUpdate 等。mint 工具的设计更易于使用，并极大地增加了易用性，得益于对用户友好的强调，使其成为最容易上手的
    Linux 类型之一。Linux Mint 的最大吸引力之一是开发者总是准备好并乐意实施有助于改进程序的良好建议。


    难度评分：适合初学者


    长期支持：没有固定日程，但会定期更新，特别是在每个 Ubuntu LTS 发布后不久。


    ### 优点

    - 为该操作系统设计的 mint 工具

    - 无安全告告

    - 用户友好

    - 更新并非可预测的

    - 包含多媒体解码器

    - 面对用户的请求和建议


    ## MX Linux


    MX Linux 有一段历史。它最初名为 MEPIS Linux，是一种基于 Debian 的发行版，适用于个人和专业用途的桌面，在创建时具有若干项前端功能。然而，尽管有这些前端特性，MEPIS
    Linux 最终被停止了。但是，它的用户并没有因此退缩。将 MEPIS 与另一个名为 antiX 的基于 Debian 的发行版合并，形成了现在被称为 MX
    Linux。


    它基于 Debian 的稳定分支，主要组件来自 antiX 和 MEPIS 社区。特别是，它利用 Xfce 桌面，并使用侧边的垂直面板，而不是大多数计算机底部的常见水平控制面板。总的来说，这个发行版被认为提供了许多不定期更新的现代应用，同时具有稳定的底座，从而能够出良好、可靠的性能，而又不会丢失人们想要的功能。


    特别是，MX Linux 以其 MX-Tools 闻名——这是一系列图形化管理工具，允许快速访问多种功能，例如管理系统上的用户帐户、安装解码器以及使用和安装软件包。


    '
