    # Diagnostic commands


    **ping**: This is how connectivity is tested. Standing for Packet Internet Groper,
    ping is regularly used to identify that connectivity between either LAN or WAN.
    It will make use of ICMP in order to communicate with other nodes on the network.


    **traceroute**: this is a CLI that allows for the tracing of the entire path from
    a local system to a separate system on another network. It will record the number
    of hops between router IPs that will have to occur to reach the server necessary.


    **tracepath**: this command allows for the path to be traced to the destination
    discovering MTU. It will utilize UDP port. Similar to traceroute, but this particular
    form of tracing does not require the same superuser privileges because it is simply
    informational and will provide all the necessary information.


    **netstat**: this CLI is used to display the information you need to know about
    your network connections, any routing tables, statistics, and more that will be
    important to understand with your networking system. It is also used to debug
    and check to determine which programs are on which ports.


    # CHAPTER 7 QUIZ


    Congratulations! You have finished Chapter 7! You should now have a general idea
    of how networking on your Linux machine will work and key features that you will
    encounter. With previous chapters, it is time for your 5 question quiz. This will
    help ensure that you understand what has been presented within this chapter.


    + 1. What is a network?

    - a. A group of people that you know

    - b. A group of devices that are connected together

    - c. A group of software that communicates with each other

    - d. A group of neighbors that all share the same internet provider


    + 2. What is WAN?

    - a. The internet

    - b. Wide area network

    - c. Widely accessible network

    - d. Wonderful access network


    + 3. What happens if the hub of a network goes out?

    + a. The whole network stops working

    - b. Half of the network stops working

    - c. Only the hub stops working

    - d. Hubs are obsolete and no longer used


    + 4. Why create a network in the first place?

    + a. Easy distribution of files

    - b. Sharing data

    - c. Connectivity

    - d. Redundancy

    - e. All of the above

    - f. None of the above


    + 5. True or false: You really only need access to a network if you are going
    to be gaming or otherwise streaming large amounts of data over the internet


    # CHAPTER 7 ANSWER KEY


    + 1. **B:** While you do have a personal network, that is the wrong context for
    this chapter. The network in the sense of Linux is a group of connected devices
    that are able to share files in some way.


    + 2. **B:** Wide area network. While the internet can be considered a WAN in some
    sense, it is not what WAN stands for. This is a large geographical area of networks.


    + 3. **A:** The whole thing will stop working. When a hub is implemented, it is
    the central processing power for the entire network, and without the hub, the
    rest of the system has no real way to run properly.


    + 4. **E:** All of the above. There are endless reasons that setting up a network
    could be useful if you have a legitimate need for one in some way. They are absolutely
    recommended if you need to regularly share files or you want to easily shift from
    system to system within a home.


    + 5. **False:** In fact, networks can actually work incredibly well as long-term
    storage for files, which is letting files rest, unused rather than using intensive
    internet processes that gaming or streaming would involve.


    # CHAPTER 8

    Alternatives to Windows Applications


    If you made it this far in the book, then you are likely either seriously considering
    switching to Linux, or you have already decided to do so. Either way, you may
    have some reservations about the process. For example, it can be somewhat daunting
    to stare into the face of an operating system that is not designed to have all
    of your proprietary software. Especially if you have been a long-term user of
    Windows OS, you are likely going to feel like you do not want to miss out on some
    of those programs that have been implemented into daily life. After all, you may
    need have access to Microsoft Office in some instances, such as for work, school,
    or just due to your own personal preference. While running a virtual machine to
    run Microsoft just long enough to get all of the files you want is absolutely
    an option, it is likely not the option that you really want to go with.


    Luckily for you, there are several substitutes out there for the mainstream Windows
    applications, and these substitutes even come with one more bonus—they are oftentimes
    free.


    # ALTERNATIVES TO WINDOWS APPLICATIONS | 167


    While this may cause you to hesitate at first, wondering if the free software
    is going to be less reliable or less complete than what you are used to, consider
    that Linux itself is a free iteration of an OS and you are likely quite close
    to using that at this point in time. Despite the fact that these projects are
    free, they are still useful. In particular, this chapter is dedicated to finding
    you the best popular alternatives to some of the most mainstream Windows applications
    you will use. From word processing to PDF viewing and all the way to a substitute
    for digital editing programs, free options that are entirely compatible with Linux
    exist out there for you.


    This chapter will provide you substitutes for the following products:


    - Microsoft Office

    - Notepad

    - Internet Explorer

    - Photoshop

    - Movie Maker

    - Windows Media Center

    - Adobe Reader


    Of course, the options that will be recommended within this chapter are not your
    only ones—you can go out of your way to locate several applications that you may
    find to be useful for you.


    # Microsoft Office Substitute


    Many people utilize Microsoft Office on a regular basis. In fact, it is regularly
    used in school settings, with many universities even requiring that their students
    use this format for submission of documents. Microsoft Office comes with several
    different programs within it, allowing for spreadsheets, word documents, and several
    other forms of documentation to be processed and compiled. If you have been in
    school recently, you have likely used this at least somewhat.


    There are, frankly, several alternatives to Office, though you may run into instances
    where you are required to utilize Microsoft Office. Nevertheless, if you can get
    away with it, you can get by with LibreOffice.


    LibreOffice is built to be free, and it is admittedly quite powerful. Within this
    suite, you are given several different programs all bundled under one name, each
    of which produces a different type of document. With LibreOffice, you have access
    to several different programs:


    - **Writer**: LibreOffice''s word processor

    - **Calc**: LibreOffice''s spreadsheet processor

    - **Base**: LibreOffice''s database processor

    - **Impress**: LibreOffice''s presentation creator

    - **Draw**: LibreOffice''s diagram creator

    - **Math**: LibreOffice''s formula editor


    As you can see, all of the major functions of Microsoft Office are provided there
    with LibreOffice, and for the price tag of free, it almost can''t be beat, unless
    you really *need* to have word doc formatting. While you will be able to open
    up files created in Microsoft Office in LibreOffice, the converse is not true.


    LibreOffice is frequently bundled in many of the more common Linux distros, so
    you may not even have to go out of your way to locate this particular installation.
    If you dislike LibreOffice, there are other alternatives as well. In particular,
    you may find that OpenOffice or AbiWord is more your style, and that is okay!

