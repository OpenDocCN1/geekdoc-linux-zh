    # Diagnostic commands


    **ping**: This is how connectivity is tested. Standing for Packet Internet Groper,
    ping is regularly used to identify that connectivity between either LAN or WAN.
    It will make use of ICMP in order to communicate with other nodes on the network.


    **traceroute**: This is a CLI that allows for the tracing of the entire path from
    a local system to a separate system on another network. It will record the number
    of hops between router IPs that will have to occur to reach the server necessary.


    **tracepath**: This command allows for the path to be traced to the destination
    discovering MTU. It will utilize UDP port. Similar to traceroute, but this particular
    form of tracing does not require the same superuser privileges because it is simply
    informational and will provide all the necessary information.


