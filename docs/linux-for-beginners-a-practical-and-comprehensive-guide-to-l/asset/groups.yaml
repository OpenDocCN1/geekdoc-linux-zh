    # Photoshop Substitute


    Photoshop is the golden standard when it comes to photo editing software for many
    people, but unfortunately, it is locked behind quite a large paywall. Photoshop,
    while a good program in general, is quite expensive, and also more on the restrictive
    end. Photoshop is written in C++, making it rather restrictive in general, whereas
    you do have other options available to you.


    In particular, you have access to GIMP. Unlike Photoshop, GIMP is written in C
