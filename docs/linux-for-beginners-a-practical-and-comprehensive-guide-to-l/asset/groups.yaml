    -   移动操作系统：这是任何专为移动移动设备（如智能手机和平板电脑）设计的操作系统。最常用的移动操作系统包括 Android 和 iOS。


    ## 常用操作系统


    大多数时候，你购买的任何电脑都已预装了某种操作系统并可以开箱即用。这意味着如果你想直接开箱即用大多数产品，你可以选择这样做。然而，如果你发现另一个操作系统更好用，你也可以对其进行升级或将其更换为另一个操作系统。在大多数情况下，操作系统的选择主要取决于个人偏好，尽管某些操作系统具有不同的软件兼容性。


    或许操作系统之间最显著的区别在于图形用户界面（GUI，发音为 gooey）。GUI 是你使用电脑时在显示器上看到的内容，它允许你与软件进行交互，进而与硬件交互。这就是你在屏幕上看到的图形和文本的结合。虽然不同操作系统之间的
    GUI 可能有所不同，但它们都具有相同的基础特性和功能。尽管如此，如果你对某种类型的操作系统优于另一种，这完全是一个合理的个人观点，你选择的应该是最适合你的操作系统。尽管如此，请花一点时间熟悉你日常会遇到的三个最常见的操作系统：Microsoft
    Windows、macOS 和 Linux。


    -   **Microsoft Windows：** 创建于 20 世纪 80 年代中期，是你遇到的各种版本中最流行的操作系统。最新的是 Windows 10，它于
    2015 年发布。几乎任何预装 Windows 的个人电脑（PC）都是如此，唯一的例外是 Apple 产品。它在用户可以执行的操作方面非常多样，并且不断获得更新以保持安全。


    -   **macOS：** 预装在 Macintosh 上，macOS 的流行程度要低得多。据估计，全球操作系统中只有不到 10%在使用 macOS。它看起来更精美，但通常只与专有软件和外设设备配合。在三个操作系统中，macOS
    运行其全部功能的成本将是最昂贵的。正因如此，macOS 在使用和定制化方面更具限制性，许多常用程序、游戏和其他软件并不兼容 macOS。然而，macOS 倾向于较少被黑客攻击，这使其可能更安全一些。


    -   **Linux：** Linux 与其他两个有所不同——与专有的 Windows 和 macOS 不同，Linux 是开源的。这意味着任何人都可以对其进行修改并在范围内免费分发。这使得
    Linux 在你遇到的三个主要操作系统中限制最少，但它仅占全球使用操作系统的 2%。尽管有这一统计数据，得益于多功能性和定制性，大多数服务器将使用 Linux。


    ## Linux 作为操作系统


    那么，Linux 是一种开源操作系统——这意味着它可以很容易被定制和修改。开源操作系统是可以免费运行、免费修改和免费分发的，无论你是否对其进行过修改。这意味着市面上有许多不同的
    Linux 发行版（distributions），因为每个进行过更改或为自己定制过版本的人都可以自由地重新发行自己的版本。然而，这些发行版将在第 2 章进行讨论。


    Linux 可以安装在各种硬件上，允许软件开发和应用程序运行。该操作系统是用 C 语言语言开发的，今天，C 仍然是使用的主要语言。Linux 最初设计类似于
    UNIX（将在下一个小节中讨论），它的演变已经远超其最初的范围。它现在被用于从手机到超级计算机以及其之间的一切设备。当你使用 Linux 作为操作系统时，你正在利用
    Linux 内核（kernel）来管理硬件，然后从该内核开始，通过软件构建操作系统的其他部分。


    当你听到 Linux 时想到的操作系统实际上是几个不同部分的组合。这些部分共同协同工作，以允许编写的软件运行。这些核心部分是启动加载器（bootloader）、内核、初始化系统（init
    system）、守护进程（daemons）、图形服务器、桌面环境以及你安装的应用程序。


    这些部分承担着各种功能，对于你实际上运行操作系统至关重要。


    -   **启动加载器 (Bootloader)：** 这是启动电脑的软件——这意味着它将触发操作系统开始运行。大多数情况下，会显示一个快速的启动界面，让你知道操作系统正在启动。一旦操作系统准备好运行，启动界面就会消失，这在很大程度上取决于运行它的硬件。有几种不同的启动加载器，例如
    LILO (Linux Loader)、LOADLIN (Load Linux) 或 GRUB (Grand Unified Bootloader)。


    -   **内核 (Kernel)：** 这就是“Linux”真实名称的来源。Linux 内核是操作系统的心脏，允许对 CPU、RAM 以及所有正在使用的外围设备进行管理和交互。它是操作系统其余部分的字体，没有这个内核，你就无法运行设备。


    -   **初始化系统 (Init system)：** 这允许用户空间的引导或激活。通常情况下，你会看到 systemd 作为初始化系统。


    -   **守护进程 (Daemons)：** 它们运行几个不同的后台服务，这些服务通常在启动过程中自动启动，或者在你登录桌面后启动。将守护进程视为后台进程，你通常会在代码中看到结尾带有“d”的，例如作为网络服务器守护进程的
    httpd。


    -   **图形用户界面 (GUI)：** 这是一个负责将计算机数据翻译为在你选择的显示器上显示的图形的子系统。Linux常用的GUI 是 Window 系统。


    -   **桌面环境 (Desktop environment)：** 这是你实际上能够交互的图形部分。根据你的喜好，有几种常见的 GNOME、Cinnamon、MATE、Unity
    等。


    -   **应用程序 (Applications)：** 它们就像手机上的应用程序。这些是任何为特定目的服务的程序或软件。


    第 8 章将为你介绍一些可以在 Linux 上使用的、作为常用 Windows 应用程序替代方案的若干示例。


