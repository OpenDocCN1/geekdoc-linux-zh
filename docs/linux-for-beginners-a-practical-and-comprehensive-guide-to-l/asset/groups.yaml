    ## 基础网络管理


    多亏了 Linux 的灵活性和可定制，它在网络管理领域极其通用。这使得它在你需要运行数据中心或某种服务器时变得特别有用。本章将为你提供开始配置 Linux
    所需最后信息。我们将引导你学习网络，就像这一切对你来说完全是新事物一样——因为作为一个阅读这本书的初学者，这很可能确实！


    在本章中，你将学习网络扩展和拓扑结构，学习它们是如何工作的。我们将引导你学习几种协议，提供一些关于路由的信息，提供一些对你可能有用的命令，你就可以进入正轨了。下一章将引导你为
    Linux 发行版安装选择各种软件，但这是包含所有硬核、密集内容的最后一章。恭喜你——你快到结尾了！


    ## 网络 101


    网络允许计算机、手机、外围设备、IoT 设备等连接在一起，访问同一数据线并进行通信。这就是互联网的理念——你能够访问互联网网络，并与即使在地球另一端的设备进行通信。网络有几个重要的点需要考虑，但从根本上，把互联网想象成一个巨大的网——它是相互互连的，并有多个接入点供其他设备进入。无论你在那时处于网的哪个位置，你都可以通过某种方式到达网上的任何其他点，即使这种方式可能比需要的或应该的要慢。这意味着你能够以某种方式绕过网络来访问你需要的数据，即使这些数据不在你的物理机器上。这就是互联网的工作原理。


    然而，网络的用途远不止一般的网页浏览。它对于数据分发、数据存储、通用网络等都非常有用。


    多亏了这张网，我们能够从任何可以连接到互联网的地方轻松流媒体视频，或访问云端文件。你只需要一个稳定的连接，就可以访问几乎任何已连接的内容。


    ## 网络扩展


    网络跨越了许多个人，在必要时允许快速分发数据。最终，网络可以被分为三个不同的类别：局域网（LAN）、城域网（MAN）和广域网（WAN）。如下所示，你可以看到
    LAN 最小，MAN 较大，而 WAN 是网络形式。每个后续网络类型将由上一个类型的几个其他方面组成。本质上，多个 LAN 构成一个 MAN，多个 MAN
    构成一个 WAN。


    ![](img/9f7f9b434643423b7aefac26177e90a3_159_0.png)


    ## WAN


    广域网（Wide Area Network,WAN）是指跨越任何指定地理区域的通信网络。它可能涉及一个城市甚至一个国家，根据用途和管理人员，这些可以是公有的或私有的。要理解
    WAN 的作用，停下来思考互联网——现在把它想象成存在最大的 WAN。几个网络连接在一起形成一个巨大的整体。这就是 WAN——在一个 WAN 中，你会有几个较小的
    LAN 或 MAN，它们都在一个区域内，构成了 WAN。WAN 广泛连接，其覆盖范围比 LAN 更远。如果你希望运行网络或某种大规模的服务器，WAN 是最佳选择。


    ## LAN


    局域网（Local Area Network，LAN）的规模要小得多。通常，LAN 覆盖单栋建筑，例如房子，甚至只是建筑中的某一个办公室。它的设计本意要小得多，访问的人也也没有那么多。它们最频繁地通过以太网连接以控制数据流，尽管越来越多的
    LAN 正在转向无线化，即无线局域网（WLAN）。


    如果你有一个家庭设置，其中两个系统共享数据访问，那么你就有 LAN。计算机之外的其他系统也可以构成 LAN，例如共享数据的打印机或智能电视。这些用于本地数据的共享，而不是大规模分发。然而，它们对于家庭或小型微企业来说是非常有用的。


    ## MAN


    城域网（Metropolitan Area Network，MAN）比 LAN 大，但仍比 WAN 小。例如，这可能是一个大型科技园区，共享一个跨越几个街区甚至几英里的网络，但覆盖范围并不广——这就是
    MAN。它也可以用于描述一个城市。通常，一个 MAN 是由 LAN 构成的，而 MAN 是 LAN 内部传递数据的极佳方式，允许其延伸得更远。


    ## 网络拓扑


    在理解了网络本身之后，是时候看看常见的拓扑结构了——网络连接到节点的形式。节点是以某种方式连接到网络的单个设备，不同的拓扑将根据需要和最合理的方式组织这些网络。


    ## 点对点（Point to point）


    在这种网络拓扑中（有时被称为总线拓扑），有一根运行在 LAN 上所有设备之间的电缆并将它们全部连接。它易于连接，但如果系统出现任何中断，整个系统都会崩溃。


    ## 星型（Star）


