    # 第 4 章


    # Linux Shell


    安装好 Linux 后，是时候开始与你的新操作系统进行交互了。这主要通过被称为 shell（外壳）程序来实现。shell 允许你与操作系统进行交互，到此时，你应该理解这对于计算机的运行至关重要。你的操作系统由几层组成：一端是内核（kernel），它是操作系统与计算机硬件交互的方式；而在过程的另一端是
    shell，用户通过它交互。


    硬件


    内核


    shell


    ![](img/9f7f9b434643423b7aefac26177e90a3_92_0.png)


    停下来思考一下这张图：注意硬件是如何处于核心位置的。那里开始，你有围绕硬件的内核，以及包裹内核的 shell。这让你能能看到这种层次结构——如果不先通过外部层，你就无法访问最内层。在本章中，你将学习作为一个系统的
    shell 是，以及它的主要功能是什么。你将学习如何通过终端（terminal）访问 shell。你将学习 shell 脚本编写，并学习与 shell 交互所需的常用命令行编辑知识。最后，你将了解可用的
    shell 类型。


    ## 什么是 shell？


    计算机主要基于二进制运行——这即使用 1 和 0 来表示开关的开启或关闭。然而，如果你被通过二进制向系统输入内容，你会发现自己花费了比需要多得的时间尝试翻译和输入代码。这就是
    shell 的用场。得益于 shell，你不需要精通二进制。


    shell 充当英语编写的人类友好命令与内核之间的翻译器，并将它们翻译成内核可以使用的格式。通过为内核翻译一切，你可以自由地记忆简单得多且更容易管理的命令。这还允许你通过键盘输入命令。总来说，shell
    具有几个关键特性，例如：


    - 它是一个用户程序：它是一个为了人类用户交互而设计的环境。

    - 它是一个命令行语言解释器 (CLI)：它从标准输入（如键盘）接收并执行命令，而无需记忆和翻译二进制等复杂的程序语言。

    - 它是自动的：你一打开终端，shell 就会开始工作。

    - 它与内核协同工作：虽然它不是内核的一部分，但它与内核协同工作，以便允许执行程序、创建文件或完成任何必要的命令。

    - 它是多功能的：Linux 提供了几种不同的 shell，它们可以完成相同的工作，尽管它们使用不同的语法并具有不同的内置函数。


