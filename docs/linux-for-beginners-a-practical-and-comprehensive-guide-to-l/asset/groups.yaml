    # Windows Media Center Substitute


    Windows Media Center is the major entertainment system that was released with
    Windows starting with Windows 7. It allows you to load up videos. However, it
    was also rather strenuous on the graphics card, requiring a high-end one in order
    to actually function properly. Because of this, many Windows users ditched Windows
    Media Player long ago. Even if you were one of the common users of it, you are
