    ## Gentoo


    Despite being the butt of several jokes floating around the internet, Gentoo is
    a valid option for people who know what they are doing. This particular distribution
    is quick and flexible while also entirely free. It is designed in particular for
    people with plenty of IT knowledge, such as developers and network professionals.
    It is built with a source-based package management system known as Portage—a Python-based
    true ports system that comes with several advanced features of its own that can
    make Gentoo an attractive prospect to those who understand how to use it.


    Originally created in 2000 by Daniel Robbins with a vision of creating a meta-distribution
    without needing any pre-compiled binary packages. He certainly succeeded—when
    you install Gentoo, you set up a system with the bare minimum to boot up, and
    from there, you must program it yourself. The system itself is incredibly customizable,
    and you are free to add and remove from it to make it work for you. Thanks to
    this, it is well-known for the flexibility it grants to those who choose to use
    it. They are able to create a wide range of experiences, and because of this,
    Gentoo can be found at the heart of several other projects, such as creating the
    foundation for Google’s Chrome OS.


    Difficulty rating: Advanced


    Long-term support: Regular releases


    ## Pros


    ## Cons


    - Flexible and customizable

    - Can use several different compile-time configurations

    - Can use several init systems

    - Can run on several different architectures

    - Requires a high level of knowledge to get started

    - Takes longer to set up

    - The process to upgrade packages through source can be lengthy


    ## CentOS


    Released in 2003, this is a community project that endeavored to rebuild source
    code for Red Hat Enterprise Linux into something that could be readily installed
    with regular security updates for everything included. Effectively, this makes
    CentOS a clone of Red Hat Enterprise Linux (RHEL), with the one difference between
    them being branding. Despite the fact that CentOS is a clone, there does not seem
    to be any real conflict between the two.


    CentOS is deemed to be reliable as a server distribution—thanks to the utilization
    of the stable Linux kernel and software packages of RHEL. It has been deemed to
    be a reliable and free alternative to other server products that are available
    today, especially for those who are already quite experienced with Linux as a
    whole. These people find little difficulty in administrating the distribution.
    CentOS is also usable for enterprise desktops as well—if you need something stable
    and reliable, with a preference for the support over cutting-edge software, this
    is the OS for you. Of course, if you do care about up-to-date and cutting-edge
    software, you may prefer to look elsewhere, as the updates to CentOS are a bit
    spaced out compared to some of the other options on the market.


    Difficulty rating: Beginners with some experience


    **Long-term support:** Regular updates are rolled out every 9-12 months, and new
    releases come out every 2-3 years


