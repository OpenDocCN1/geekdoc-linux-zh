    # Linux Shell


    With Linux freshly installed, it is time to begin interacting with your new OS.
    This is primarily done through what is known as a shell. The shell allows you
    to interact with the operating system, which at this point, you should understand
    is crucial for the functioning of your computer. Your operating system consists
