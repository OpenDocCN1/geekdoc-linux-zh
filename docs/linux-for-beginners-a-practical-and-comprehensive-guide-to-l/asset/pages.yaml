  pgno: 182
- img_proc: true
  md: 'behind quite a large paywall. Photoshop, while a good program in general, is
    quite expensive, and also more on the restrictive end. Photoshop is written in
    C++, making it rather restrictive in general, whereas you do have other options
    available to you.


    In particular, you have access to GIMP. Unlike Photoshop, GIMP is written in C
    and GTK+, making it far more flexible to use. Even better, GIMP is far less strenuous
    on the processor while still giving you access to several tools. Not only is Photoshop
    monetarily expensive, it is also expensive on the processor, especially when it
    is editing files in high resolution.


    GIMP typically gets bundled in with most common distros, though you may stumble
    upon one that does not include it. Nevertheless, try taking a look at it. Even
    if you do not make the shift over to Linux, you may find that GIMP is a better
    alternative to Photoshop for you anyway. Beyond GIMP, if you find that it is not
    quite to your liking, you can try CinePaint as well. These programs, while being
    recommended for Linux, are also compatible with Windows.


    # Movie Maker Substitute


    Despite common assumptions, Linux actually has several options available for decent
    video editing programs. While'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'many people may feel like they are missing out if they do not have access to
    their media editing on Windows or Mac, such as Windows Movie Maker, you are actually
    able to find alternatives readily available on Linux as well. While Windows Movie
    Maker is a good option for you, if you have access to it, some of the lesser known
    Linux iterations are actually more advanced and allow for further functionality
    that you may not otherwise have access to.


    In particular, Cinlerra is designed to be an advanced alternative to Movie Maker.
    In Cinlerra, you are able to work with ultra-high resolution processing of images.
    Despite being free, it offers you all of the editing software you could possibly
    need—and then some. It offers features such as color correcting, motion tracking,
    mastering audio, and more, all designed to give you everything you could possibly
    need when shifting over to Linux from Windows.


    After all, artistic pursuits should not have to suffer in the name of customizable
    operating systems.


    And even better, like all of the other programs that have been discussed in this
    chapter, it''s free. If Cinlerra is not your style, you may find one of several
    other options appeals more to you. Other options that you could look into alongside
    Cinlerra include Kdenlive, LiVES, Open Movie Editor, VideoLAN, and'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'more. All you have to do is dig around a little bit, and you will find several
    other options for you.


    # Windows Media Center Substitute


    Windows Media Center is the major entertainment system that was released with
    Windows starting with Windows 7. It allows you to load up videos. However, it
    was also rather strenuous on the graphics card, requiring a high-end one in order
    to actually function properly. Because of this, many Windows users ditched Windows
    Media Player long ago. Even if you were one of the common users of it, you are
    not losing out on much by transferring over to Linux. Instead, try taking a look
    at Linuxmce instead. This program is not just limited to videos either—it can
    be utilized with several other functions and programs as well, such as security
    cameras, telecommunication, and also running all of the media that you may have
    had on your device to begin with. It is meant to be a sort of cohesive program
    that unites your electrical appliances at home, from lighting to security and
    media, with everything in between. Since we are discussing this as a media specific
    replacement, we will focus on the media features. In particular, it is designed
    to be used to link together several devices on a network, allowing the files that
    you are accessing to be accessible in several locations, which further allows
    you to ensure that you always have your favorite'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'media available. There are also several other options available for a substitute
    for Windows Media Player, such as Moovida, MythTV, and XBMC Media Center. Try
    playing around with several of these to find one that really works well for you.


    # Adobe Acrobat Reader Substitute


    Especially in adulthood, Adobe Acrobat Reader is incredibly useful. Necessary
    to view portable document files (PDF), you must have access to some sort of reader
    within your operating system. Most commonly, when you use Microsoft, you will
    end up with Adobe Acrobat Reader. If you do have Adobe Acrobat Reader, you may
    also be familiar with the myriad of constant updates it puts out, even when little-to-nothing
    changes. This means that you are constantly forced to update, even when it is
    unnecessary. Of course, if you are leaving behind Windows, you also leave behind
    this problem. Instead, you can use one of the free and open source software options
    that will eliminate that problem altogether.


    Even better, many of these free options are readily distributed with the most
    common Linux distributions. If you are going to be running a common distribution,
    it will likely include either Evince, okular, or Xpdf, all of which are more than
    capable of meeting your software needs.'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'In fact, Xpdf, in particular, provides you with several different tools that
    will allow you to do more than just read your files. You will be able to convert
    PDF to text, PostScript, into PPM/PGM/PBM image files, PNG files, HTML, and more.
    It can be used to extract metadata or raw images, and will even provide the fonts
    that were used to create the document for you.


    It is incredibly versatile, and while it require you to understand the command
    line tools, for full optimization, you will find that it is more than capable
    of getting the job done.


    Ultimately, as you can see, there are nearly endless opportunities for all of
    the major programs you are likely to encounter when using Windows on a regular
    basis. By just being willing to do the necessary research, you can begin to encounter
    a far more versatile operating system in general. While it may not necessarily
    be what you are useful, you do not have to spend an exorbitant amount of money
    just to get functional software that will do what you need it to. You can, in
    fact, get that service through the use of plenty of the freeware offered online.
    As a quick overview, let''s recap the most common replacements for the software
    discussed.'
  merge: -1
  pgno: 187
- img_proc: true
