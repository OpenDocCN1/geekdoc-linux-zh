- img_proc: true
  md: 'or daemon processes. Each of these different process types function slightly
    differently.


    +   **Parent and child process**: This occurs when a process creates another know-how.


    The created process is known as the child process while the parent process is
    the one that triggered the second.


    +   **Zombie and orphan process**: Upon finishing its function, the child process
    becomes terminated, and SIGCHLD, the signal from the interface to the parent process,
    informs the parent process of the termination of the child process. However, sometimes,
    the parent process is terminated before the child process terminates, creating
    a situation in which the child process is orphaned. The parent process still has
    an entry to the process table but is not functioning


    +   **Daemon process**: These processes are system-related and run in the background,
    most often running with permissions of root and waiting for processes that will
    work with them.'
