  md: '# CHAPTER 6

    Control Privileged User


    At this point, it is time to begin discussing the security and privileges of users
    that are able to access your OS or server. Especially today, people seem to think
    that technology and servers are less safe than ever, but contrary to popular believe,
    there is actually plenty of support available to keep systems safe and secure.
    One such way is through controlling privileged users, which this chapter will
    teach you to do. In reading this chapter, you will be guided through various types
    of linux accounts, such as the root user, normal user, and system user. You will
    discover sudo, which stands for the super user do. This is the command for the
    system admin—it is the one command that allows access to everything and anything,
    so long as you are on the right account with the proper privileges to use it.
    Lastly, you will be walked through the sudoers file. This file is essentially
    the underlying programming behind the sudo—it controls the sudo and who has access
    to the sudo command in the first place.'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'All of this will help you juggle the users on your server or machine, allowing
    you to ensure that the proper security systems are in place.


    With everything in place and a secure system, you are able to rest easy and feel
    like your system is truly safe.


    # Types of Linux Accounts


    First, we will be discussing the root, normal, and system users before progressing
    to anything beyond this. You must have a complete understanding of these three
    user account types in order to really understand how sudo and sudoers play into
    the security of the system.


    Because Linux is so incredibly flexible, you have the option to create several
    different types of accounts. In fact, you can have several root accounts if you
    need them, or accounts with different permissions in different categories. All
    that matters is that the needs you have are met effectively.


    Keep in mind that just because you have root accounts does not mean that you should
    not have some sort of security system in place—you should absolutely have a password
    protecting the root accounts to ensure that no one else is ever able to'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'access those files and overtake them without your permission at all.  This
    means that you will be able to ensure that the files themselves have yet another
    layer of protection. Now, without further ado, let''s begin to dig into the three
    primary user types of Linux.


    ![](img/9f7f9b434643423b7aefac26177e90a3_139_0.png)


    # Root user


    The first user that you must knows is the root user. This is also commonly referred
    to as the super user, especially in the acronym sudo. The super user or root user
    is the individual that is on the default admin account. This person has full control
    over the system, much like an administrative account would have control over Windows.
    With the root privileges that are given by default, this user is able to execute
    any of his or her commands'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'and directly control or alter the services and accounts of other people. Effectively,
    this should be your account if you are the one setting up the system.


    This account is the one that is able to rule over the other accounts, managing
    and monitoring them all without need for extra permissions. All permissions are
    granted for the root user.


    They are able to change the permissions of other users, move files around, change
    the ownership of files, and do anything else within the system. Keep in mind that,
    because you have the power to do literally anything within the program, you will
    not have the OS telling you not to do something. There is no safeguard for you,
    and you must be careful when using this account. If you delete a system file,
    there may be no hope for going back if you have not been regularly keeping archives
    and backups of your file. If there is a user that is capable of doing catastrophic
    damage to your program, it is the super user or root user.


    Linux assumes that the root user has a pretty good grasp over what they are doing,
    and because of that, if you are unsure of what you are doing at any point in time,
    it is better than sorry, and you should try reaching out to someone else for help
    if you think it is necessary. Overall, while this should be your account with
    your own privileges, you should also try to avoid'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'this account as much as humanly possible in order to ensure that you are not
    risking destroying everything at all.


    There are very specific periods in which you *should* use the root. Otherwise,
    you are likely going to be fine with just a normal account for most day-to-day
    functions. Of course, any time that you are attempting a task that requires you
    to a user the root, you should make sure that you switch over as necessary and
    back up your data before attempting anything.


    In particular, you will need to use the root privileges in order to move files
    or directories in or out of the system directories. Remember, the system directories
    are those that are directly responsible for the functioning of the operating system,
    and without them, you cannot run the OS. It is also necessary when you are attempting
    to copy any of the files into system directories, when altering the user privileges
    of other users, for some system repairs, and the occasional installation of a
    program will require you to use the root account. Typically, if a file needs root
    permission to be installed, it is because the file itself will be directly interacting
    with the system directories. If you are not doing any of the above, just avoid
    it and save yourself the hassle of potentially messing up.'
  merge: -1
