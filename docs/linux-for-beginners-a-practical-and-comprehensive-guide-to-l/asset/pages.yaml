  md: '# 82 | LINUX FOR BEGINNERS


    Stop and consider this graphic for a moment: Note how the hardware is at heart.
    From there, you have the kernel that surrounds the hardware, and the shell that
    engulfs the kernel. This allows you to sort of see the hierarchy—you cannot access
    the innermost levels without first going through the external levels. Within this
    chapter, you will learn what the shell is as a system, as well as what its primary
    functions are. You will learn how to access the shell through the terminal. You
    will be guided through shell scripting, as well as be provided with basic command
    line editing that you need to know in order to interact with the shell. Lastly,
    you will be walked through the types of shells available.


    # What is Shell?


    Computers primarily operate on a binary—this is the usage of 1s and 0s to represent
    whether a switch is on or off. However, if you were asked to put your input into
    your system via binary, you would find yourself spending far longer than necessary
    trying to translate and input your code. This is where the shell comes in. Thanks
    to the shell, you do not have to master binary.


    The shell acts as the translator between human-friendly commands written in English
    and then translates them into something usable by the kernel. In translating everything
    for'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'the kernel, you are free to memorize commands that are far simpler and more
    manageable. This also allows you to input your commands via a keyboard. Overall,
    the shell has several key features, such as:


    +   - It is a user program: It is an environment that is designed to accommodate
    human user interactions


    +   - It is a command language interpreter (CLI): It receives and executes a command
    from standard input, such as a keyboard, without the need for the memorization
    and translation of difficult program languages such as binary.


    +   - It is automatic: As soon as you open a terminal, the shell will begin functioning


    +   - It works with the kernel: Though it is not a part of the kernel, it does
