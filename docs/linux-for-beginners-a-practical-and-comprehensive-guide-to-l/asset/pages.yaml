- img_proc: true
  md: '# From Unix to Linux


    ![](img/9f7f9b434643423b7aefac26177e90a3_25_0.png)


    What is now known as Linux began first with the development of Unix? Developed
    from the Multics project from the Bell Laboratories Computer Sciences Research
    Center, the goal was to create a multi-user OS that would have single-level storage,
    dynamic linking, and a hierarchical file system. However, this project was discontinued
    in 1969.


    Being discontinued did not deter a group of researchers, including Ken Thompson
    and Dennis Ritchie, to complete their project. Instead of Multics, however, they
    utilized the C programming'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'language to rewrite their entire system, maintaining those core assets of Multics.
    In the end, they created Unix. The programming language made this OS unique—it
    was portable. This meant that it could be moved off of the hardware it was on,
    allowing data to live long past the hardware’s life span.


    This newly created Unix system was developed further and allowed to be adopted
    commercially. It eventually spread further within academia, with the creation
    of Berkeley Software Distribution (BSD). This was further developed into NeXTStep,
    which eventually grew to become the foundation for macOS, and MINIX, designed
    to be educational and eventually became the reference for Linux Torvalds to create
    Linux.


    Unix and its successors primarily remained locked behind licensures, and many
    different developers began to work to create free alternatives. Among these were
    Richard Stallman, a researcher who worked for MIT at the time. He started work
    on what became known as GNU, which was distributed as open-source software beginning
    in 1985.


    Torvalds, frustrated with the licensure for MINIX, began work on his own OS in
    1991. It was reminiscent of MINIX, with beginning development done on MINIX with
    the use of the GNU C compiler. However, over time, it transformed into its own
    project with its'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'own developers to separate it out, and in 1994, version 1.0 of the Linux kernel
    was released.


    This means that there were two major influences from Unix to Linux—GNU, which
    remains a prominent component of many different distributions of Linux, and the
    initial development of Linux done within the MINIX system.


    Most commonly today, when you hear “Linux,” you are most likely discussing the
    presence of both the Linux kernel and GNU. However, there are some systems, such
    as those on handheld devices, frequently use the Linux kernel with next to no
    GNU influence.


    # Systems Architecture of Linux


    At this point, you have already seen a brief overview of the architecture of Linux—this
    is the breakdown of Linux that you saw in the chart earlier in the chapter. However,
    there are some details that need to be discussed in further depth. Within this
    section, you will learn more about the separation of user vs. kernel space, function
    of the Linux kernel, and the command line interface (CLI) known as a shell.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# User space vs. kernel space


    Wouldn''t it be frustrating if you were working on your computer, having spent
    hours trying to solidify something that you were trying to accomplish, only to
    have the entire system shut down because it accidentally took up too much space
    for the OS to keep operating? Most people would agree that yes, it would be incredibly
    frustrating to have a program that would crash randomly due to running out of
    memory, and for that very reason, there is a special space dedicated solely to
    the OS on your memory in order to run it. Your OS will break your memory down
    into two categories, separating them out entirely and completely restricting them.
    It creates a kernel space, which is designed to have enough space for the system
    to run in order to ensure that you never run out of space necessary to run the
    OS in the first place.


    It also creates an extra safeguard, protecting your OS from any tampering from
    outside sources that may have been downloaded or initiated within the user space.
    By creating that sort of divide, the kernel is protected, and your computer should
    function smoothly.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 18 | LINUX FOR BEGINNERS


    ![](img/9f7f9b434643423b7aefac26177e90a3_29_0.png)


    Every application must make system calls to the kernel within the kernel space
    if they wish to access system resources, such as making use of memory or network
    devices since the kernel is what tells the hardware to process in the first place.


    # The Linux Kernel


    The Linux kernel is literally the namesake of the program itself and is crucial
    to understand. The kernel, as summed up earlier in the chapter, is the part of
    the operating system that controls the computer. The kernel acts as the mediator
    between the hardware and the operating system itself, allowing the OS to run applications
    in the first place. It schedules the order that applications will be run, accesses
    data, and even manages how'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'memory is used within the computer. This is the initial part of the OS that
    is booted upon startup, and the kernel contains the most important parts of the
    OS code.


    ![](img/9f7f9b434643423b7aefac26177e90a3_30_0.png)


    As depicted in this graphic above, you can see the relationship between the processes
    clearly—this is a more in-depth version of the graphic introduced in the beginning
    of the chapter, showing you the step between the OS and the hardware now that
    you have a better understanding of how the OS will work in the first place.


    # Command line interface (CLI)


    Most often, Linux is administered from what is known as a command line interface
    (CLI).


    This is also commonly referred to as a shell. Chapter 4 will be dedicated to discussing
    shells in more depth, but you should have a general idea of what they are before
    continuing on. The shell is the program that allows you to input commands from
    a keyboard. Within Linux, the most commonly used program is bash (bourne again
    shell), which is an enhanced version of the'
  merge: -1
  pgno: 30
- img_proc: true
  md: '20 | LINUX FOR BEGINNERS


