  md: '# # CHAPTER 1

    What is Linux?


    So, you have decided that you want to use Linux—or at least learn more about it
    than you already know. You are in the right place! Within this chapter, you will
    develop an understanding of what Linux is. First, you will discuss what operating
    systems are to develop the foundational information you will need to guide you
    through the rest of the book. From there, you will discuss Linux as an operating
    system, learning what it has to offer and why it is so commonly used by other
    people. From there, you will learn how Linux came be to be. Lastly, you will begin
    to learn how Linux is composed, looking at the systems architecture, file hierarchy,
    and processes.


    ![](img/9f7f9b434643423b7aefac26177e90a3_12_0.png)'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# What is an Operating System?


    An operating system, commonly abbreviated as OS, is the program that runs the
    hardware of a computer. In running the hardware, it also allows for the management
    and usage of the software. It also allows for the interaction between the user
    and the hardware, facilitating acts such as input and output. It is essentially
    the intermediary, allowing the hardware to run the programs and the programs to
    make use of the hardware.


    ![](img/9f7f9b434643423b7aefac26177e90a3_13_0.png)


    Of course, this means that the operating system is the single most important piece
    of software that you will ever run—without it, your computer will not be able
    to manage the hardware. Think of the OS as the brain of the computer.


    Just as your brain keeps your body running properly and reacts to interaction,
    so too does the OS keep the computer running properly and allow it to interact
    with the computer. When you use an operating system, you are essentially interacting
    with a program that allows you to speak to the computer, commanding it to do whatever
    you expect it to do without having to speak in a way that the computer understands.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'WHAT LINUX? | 3


    It is the translator, the intermediary—that allows you and the computer to interact,
    and without it, the computer is entirely useless.


    # The operating system''s important job


    As briefly touched upon, the operating system''s job is to manage all software
    and hardware on the computer. Software refers to the programming on a computer—it
    is a list of instructions on how a computer should handle and process certain
    information in order to properly perform the tasks that you have commanded. It
    ranges from programs, such as running your internet browser or playing a video
    file all the the system running your computer. Each of these programs is what
    you have your computer to do, and the operating system makes sure it is run properly
    while also utilizing the hardware.


    Hardware is the physical computer itself and all of the components that make it
    up. This includes the motherboard, the central processing unit (CPU), RAM, graphics
    processing unit (GPU), hard drive, power supply, and all other components that
    you use, such as the monitor, mouse, and keyboard, and anything else hooked up
    to your computer to use it. Each of these computer components has their own specific
    purposes,'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'which come together to allow for the processing of the computer software installed.


    # Hardware


    +   - The physical components of the computer, such as GPU, CPU, RAM, and all
    peripheral devices


    # Software


    +   - The programs containing instructions that tell the computer to handle any
    input and data that arrives


    # Operating System


    +   - Manages and facilitates the function of both the hardware and software together
    with the commands of the user.


    The operating system helps juggle all of those components together while also
    simultaneously managing the software and any user input, allowing for the computer
    to run. It ensures that each program that is functioning is able to access the
    proper hardware support necessary without infringing on the function of other
    programs at the same time. Essentially, the operating'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'system manages it all to give you the smooth and seamless functioning you have
    come to expect from your technology through the following functions:


    +   - **Command interpretation**: Allows for the translation of the commands given
    to the computer


    +   - **Communication management**: Allows for the coordination and assigning
    of software resources


    +   - **Device management**: Manages the usage of all devices


    +   - **File management**: Manages any processes and activities related to files,
    such as organization, naming, retrieving, sharing, or securing


    +   - **Input/Output management**: Translates and manages inputs and outputs


    +   - **Job accounting**: Tracks the time needed and necessary resources by jobs
    and users


    +   - **Memory management**: Allows for the allocation and de-allocation of memory
    that programs are in need of at any given moment'
  merge: -1
  pgno: 16
- img_proc: true
  md: '+   - Networking: Allows for processors that are not sharing any memory or
    hardware to communicate resources or data


    +   - Processor management: Helps the operating system create and delete processes,
    facilitates synchronization, and allows for communication between processes that
    may be interacting with each other


    +   - Secondary storage management: Makes sure that data is stored in the right
    storage to be accessed when needed


    +   - Security: Protects the data stored within a computer system from any malware
    or unauthorized attempts to access it


    # Types of operating system


    Given the wide range of functions for the operating system, it should come as
    no surprise that there are several different types of OS that all serve different
    purposes and come with their own strengths and weaknesses. This section will provide
    a brief overview of the varying types of OS as well as the most common usage scenarios
    for them.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '+   **Batch operating system:** Designed to run jobs with similar needs that
    have been grouped together. The user is never directly interacting with the computer.
    Instead, the job is prepared offline and submitted to the computer operator to
    process. This is reserved for lengthy processes.


    +   **Multitasking/time-sharing operating systems:** This type of OS allows people
    at a different terminal (shell) to use the same computer at the same time. The
    CPU gets shared between the multiple users.


    +   **Real-time OS:** These systems have minimal latency (lag between input/output)
    to allow for the response time to be nearly immediate. Ideal for military or space
    software systems that need to be able to react nearly instantly.


    +   **Network Operating System:** This OS runs on a server that is then accessible
    from several locations at once.


    +   **Distributed Operating System:** An extension of the network operating system,
    this type of OS makes use of several processors in several different machines,
    allowing for high-efficiency computing and processing.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '+   Mobile OS: This is any OS that is designed specifically for mobile devices,
    such as smartphones and tablets. The most commonly used mobile operating systems
    include Android and iOS.


    # Commonly used operating systems


    Most of the time, any computer you buy will come with some sort of operating system
    already installed and ready to go. This means that if you want to use most products
    out of the box, you can choose to do so. However, you can also upgrade them or
    change out your operating system for another one if you find that another one
    is. For the most part, the choice of operating system is primarily a matter of
    preference, though some OS will come with different software compatibility.


    Perhaps the starkest difference between operating systems will be the graphical
    user interface (GUI- pronounced as gooey). The GUI is what you see on your display
    when you are using your computer and allows you to interact with your software,
    and in turn, hardware. This will be the combination of graphics and text that
    you see on your screen. While the GUI may be different between OS, they will all
    bring with them the same basic features and functions. Nevertheless, if you have
    a preference for one type of OS over the other, that is a valid matter of opinion,
    and'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'the one you choose should be the OS that works best for you. Nevertheless,
    take a moment to familiarize yourself with the three most common operating systems
    you will encounter from day to day: Microsoft Windows, macOS, and Linux.


    +   - **Microsoft Windows:** Created in the mid-1980s, this is the most popular
    OS you will encounter in varying versions. The most recent is Windows 10, which
    was released in 2015. Nearly any personal computer (PC) that you will comes preinstalled
    with Windows, with the most notable exception being Apple products. It is fairly
    versatile in what the user can do, and is constantly getting updates to keep it
    secure.


    +   - **macOS:** Preloaded on Macintosh computers, macOS is much less popular.
    It is calculated that less than 10% of the global operating systems are utilizing
    macOS. It looks sleeker but is typically only works with proprietary software
    and peripherals. Together, between the three operating systems, macOS is going
    to be the most expensive to run to its fullest capabilities. Because of this,
    macOS is a bit more on the restrictive end in usage and customizability, with
    many common programs, games, and other software not being macOS compatible. However,
    the macOS tends to be on the less-hacked side, making it perhaps a bit more secure.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '10 | LINUX FOR BEGINNERS


    +   **Linux**: Linux is a bit different than the other two—unlike the proprietary
    Windows and macOS, Linux is open-source. This means that it can be modified by
    anyone and distributed around the world for free. This makes Linux the least restrictive
    of the three major operating systems you will encounter, and yet it makes up less
    than 2% of the global operating systems in use. Despite this statistic, most servers
    will utilize Linux thanks to the versatility and customizability.


    # Linux as an Operating System


    Linux, then, is an OS that is open-source—this means it is readily customized
    and altered. Open-source operating systems are free to run, free to alter, and
    free to distribute, whether you have altered it or not. This means, then, that
    there are many different distributions of Linux floating around out there, as
    each person who has ever made a change or customized version for themselves is
    free to redistribute their own version. However, these distributions will be discussed
    in depth in Chapter 2.


    Linux can be installed on a wide range of hardware, allowing for the development
    of software and running of applications. This OS was developed in the C programming
    language, and today, C is still the primary language used. Initially designed
    to be'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'similar to UNIX, which will be discussed in the next subchapter, Linux has
    evolved far beyond its initial scope. It is now used on phones to supercomputers
    and everything in between. When you use Linux as an OS, you are utilizing the
    Linux kernel to manage the hardware, and then building up from that kernel to
    develop the rest of the OS with software.


    The operating system that you think of when you hear Linux is actually an assortment
    of several different pieces. These pieces all work in tandem to allow the software
    programmed to function. These core pieces are the bootloader, the kernel, the
    init system, daemons, the graphical server, the desktop environment, and the applications
    that you install.


    These pieces all serve various functions that will be crucial to your ability
    to actually run the OS in the first place.


    +   * **Bootloader:** This is the software that will boot the computer—this means
    that it will make trigger the operating system to start running. Most of the time,
    there will be a quick splash screen that will display, letting you know that the
    OS is booting up. The splash screen will disappear as soon as the OS is ready
    to function, and that time is largely dependent upon the hardware that is running
    it. There are several different bootloaders, such'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'as LILO (Linux Loader), LOADLIN (Load Linux), or GRUB

    (Grand Unified Bootloader).


    +   - **Kernel**: This is where the actual name "Linux" came from.

    The Linux Kernel acts as the the heart of the OS, allowing for

    the management of and interaction with the CPU, RAM,

    and all peripheral devices that are being used. It is the

    foundation for the rest of the OS, and without this kernel,

    you cannot run the device.


    +   - **Init system**: This allows for the bootstrap, or activation,

    of the user space. Most often, you will see systemd as the

    init system.


    +   - **Daemons**: These run several different background

    services that typically start on their own during the

    booting process or after you have logged onto the

    desktop. Think of daemons as background processes,

    and most often, you will see them in code with a "d" at

    the end, such as httpd as the web server daemon.


    +   - **Graphical user interface (GUI)**: This is a sub-system

    responsible for translating the computer data into

    the graphics displayed on your monitor of choice. A

    regularly used GUI in Linux is the X Window System,

    more commonly known as X.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '+   **Desktop environment:** This is the part of the graphics that you are
    actually able to interact with. There are several that are readily available depending
    on your own preference, with some of the more common ones being GNOME, Cinnamon,
    MATE, Unity, etc.


    +   **Applications:** These are just like applications on your phone. This is
    any sort of program or software downloaded to serve a specific purpose. There
    is nearly an endless supply of different applications that can be downloaded and
    utilized with Linux, including many that are readily available on the other operating
    systems as well, such as GIMP for image editing, Discord for chatting, Thunderbird
    for emails, and more.


    Chapter 8 will give you a rundown of several alternatives to common windows applications
    for more examples of common Linux apps available to you.'
  merge: -1
