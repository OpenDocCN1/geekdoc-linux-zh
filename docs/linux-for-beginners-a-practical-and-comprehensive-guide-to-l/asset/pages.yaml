  md: '# CHAPTER 8 QUIZ


    Congratulations! You have made it through Chapter 8. By now, you should have a
    pretty solid idea of just how much software is readily available to you without
    having to pay insane amounts of money to access it. Try to answer these questions
    to ensure you understand the basics before moving on. The answer key will be on
    the page directly after this quiz.


    +   1. True or false: You can just use your old Microsoft software with Linux.


    +   2. True or false: You cannot use the Linux software on Microsoft


    +   3. True or false: These programs, both the free and open software and the
    proprietary software, are entirely able to communicate with each other


    +   4. True or false: The Linux software is expensive


    +   5. True or false: You will lose quality by transferring to Linux due to the
    lack of software available to you.'
