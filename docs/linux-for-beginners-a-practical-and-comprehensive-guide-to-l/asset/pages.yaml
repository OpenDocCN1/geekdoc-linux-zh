    # What is a Virtual Machine?


    A virtual machine is an app on your computer that allows you to run an instance
    of an operating system within it. This allows you to effectively be running your
    particular machine’s native OS while simultaneously using another OS entirely
    within a window on your desktop. Virtual machines are not Linux-specific—you can
    run a macOS virtual machine on a Windows or Linux device,'
  merge: -1
