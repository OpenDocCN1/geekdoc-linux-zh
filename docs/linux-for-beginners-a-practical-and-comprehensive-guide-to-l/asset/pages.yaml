  md: '# Process scheduler modules


    The process schedule comes in four modules that will work together to organize
    the processes. These modules are:


    +   * **The scheduling policy module:** This module judges which processes are
    granted access to the CPU, granting fair access to CPU to all processes.

    * **The architecture-specific modules:** This is actually several modules—they
    are designed to share an interface that allows for the abstraction of details
    of any computer architecture. Their purpose is to communicate with the CPU in
    order to suspend or resume processes through knowing what information is needed
    to be preserved for processes and executing assembly codes that directly interact
    with whether a process with be suspended or resumed.

    * **The architecture-independent module:** This module is the center of it all—it
    communicates first with the policy module to decide which process goes next, then
    tasks the architecture-specific schedulers to resume the right process. It then
    interacts with the memory manager to make sure that there is enough memory hardware
    available for the process to run effectively.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '+   - **The system call interface module:** This module allows user processes
    to access only resources that are intentionally and explicitly exported by the
    kernel. This regulates the divide between user and kernel memory.


    As pictured in the graphic below, the architecture-independent module is at the
    heart of this entire process and directly interacts with each of the other modules,
    allowing the entire process to run together effectively in a way that actually
    works. The scheduler essentially manages it all, with an entry for each process.
    The entire graphic encompasses what is known as the process scheduler.'
  merge: -1
