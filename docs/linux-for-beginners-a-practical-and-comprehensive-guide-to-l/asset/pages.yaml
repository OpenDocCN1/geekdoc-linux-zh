    # The Process Architecture of Linux


    Process architecture is the design that dictates the hierarchy of processes and
    systems when transforming any inputs to outputs in computing. While this sounds
    complicated to understand at a glance, hopefully, this subchapter will help you
    get through this process with ease.


    # The purpose of the process architecture


    Within the Linux kernel are several subsystems, and the most important is the
    process scheduler. The purpose of the process scheduler is to control any access
    to the CPU, regardless of whether the access is via user process or from another
    kernel subsystem. This is all done by the process scheduler, which can'
  merge: -1
