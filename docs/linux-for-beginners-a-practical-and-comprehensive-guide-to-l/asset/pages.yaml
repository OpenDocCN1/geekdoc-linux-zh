- img_proc: true
  md: '# CONCLUSION


    Well, that brings this book to a close. At this point, you have enough basic information
    to get started and begin to dabble in the usage of your own Linux distribution
    that you have chosen, installed, and began to program. Hopefully, you found the
    process of reading this book informative and useful to you as you made your way
    through it. The material discussed can be quite dense if you are not technologically
    inclined, or if you have never really dabbled in tech-related systems before,
    but it is worthwhile to learn.


    The benefits that come from being able to alter and regulate your own operating
    system, whether from the ground-up if you were brave enough to attempt Gentoo
    or another advanced program, or even just running an open source distro such as
    Ubuntu that is designed to be easily accessible, are giving yourself a whole new
    world of opportunity. You have the option to directly interact and control your
    computer. You can influence the processes your computer goes through.


    You can tell your computer to do essentially anything, so long as you are able
    to work out the code necessary for it. This coding'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'is the foundation in many much larger projects. What starts as basic coding
    today can eventually become an AI.


    What begins as the first attempts at poking around your software can eventually
    lead to you developing your own OS. Of course, the end result will be what you
    are willing to put in.


    One thing is for sure; however—when you begin to utilize Linux, you are developing
    a series of skills that are essential to learning.


    It can be beneficial to know how to work with computers, and you may even decide
    to take this from a project to a hobby, and eventually even a career if it is
    something that has interested you enough to keep exploring. No matter what, however,
    what is important to remember is that you should make sure you stay up-to-date
    on your knowledge.


    From here, you may be ready to install your own iteration of Linux, if you have
    not done so yet. If this is where you are at in your process, good luck!


    It is an exciting time when you are first beginning on this process, and you will
    surely enjoy it. If you are unsure whether you are ready to make the plunge into
    downloading a distribution for yourself, maybe you would find interest in running
    a few different distros to test first, using the steps listed for you earlier
    in this'
  merge: -1
  pgno: 193
- img_proc: true
  md: "book. You can play around with the system, learning which you\\prefer and which\
    \ you would rather avoid altogether, which may\\help you make your decision sooner.\n\
    \nNo matter what you decide, however, keep in mind that this\nwas an intro to\
    \ the subject. This book focused on providing\ny with the basic essentials to\
    \ understanding what Linux is\n how it works. From here, you may choose to research\
    \ the\nspecialized distribution you are interested in. You may begin\nto look\
    \ into more of the uses that Linux offers and what you\ncan do with the program.\
    \ You may even decide to continue\nto books dedicated toward people who are at\
    \ intermediate or\neven advanced levels to continue to grow your knowledge. No\n\
    matter what you choose to do next, if you are willing to put in\nthe time and\
    \ energy you will find yourself successful in your\ndeavavors. It may not be easy,\
    \ but the end result will absolutely\nwarrant the end result."
  merge: -1
