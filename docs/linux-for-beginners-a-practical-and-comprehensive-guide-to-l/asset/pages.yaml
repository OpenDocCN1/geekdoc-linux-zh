- img_proc: true
  md: '# Normal user


    The normal and system users have the same privileges, and both are typically created
    by the root or another user who has been granted some level of sudo privileges
    .The normal user, however, is normally a real person, while the system user is
    typically a user reserved for software to utilize if necessary. The normal user
    will have a real login shell and its own home directory, and each user will also
    be assigned a UID—user identification. If this went unspecified during the creation
    of the new user with the useradd command, then the UID is typically automatically
    selected for you.


    Essentially, however, this user does not have any super special admin powers or
    superuser status. The normal user is able to access any files that have not been
    otherwise marked as unavailable, and the privileges of the normal fire can be
    changed regularly depending on what is necessary for the user at any given time.
    Most likely, if you are running Linux on your own device, you will have a root
    account, the administrative account that was used to set up the entire OS, to
    begin with, and then you will also set yourself up with a normal user account
    to ensure that you do not accidentally delete something critical or destroy something
    important. This is your sort of safeguard against an accident.'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'The normal user’s own permissions can be customized by the root user—you can
    grant yourself any permissions that you desire on the normal account from the
    root account, so long as you know the right way to code it.


    # System user


    The system user, as briefly touched upon, is granted the same initial privileges
    as the normal user. However, the system user is almost always some sort of software
    or program, such as a daemon, that will be running in the background and will
    likely not be particularly interactive. This user classification primarily exists
    just for organizational purposes.


    When you are able to dictate the account as a system account, you know at a glance
    that it is not going to involve any sort of people interacting with it. There
    may be a daemon running the user, but no person will ever be longed on. While
    in the real world, this may not necessarily matter technically, it is nice to
    be able to see at a glance how many human users you have as opposed to daemons
    running specific software. Usually, these system accounts are created by the operating
    system during installation, and the OS retains their control. The usually have
    very specific user ids that you can identify within the root account.'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'Because these service users will be running processes necessary for the OS,
    they should be left alone when you are altering, ending, or resetting any processes.
    You want to make sure you leave these service users alone as much as possible
    to protect yourself from damaging the software. If you were to damage one of these,
    it is quite possible that you would destroy the entire OS, which is unfortunately
    easy to do if you are not paying attention.


    # Sudo


    Now, it is time to discuss sudo. If you are using sudo before a command, you essentially
    push it up. You tell the system that you are commanding this particular process
    with elevated privileges that should be respected. Usually, the elevated privileges
    are what the system checks to ensure that you are actually granted the privilege
    to make any alterations that you are actually making.


    If you have been using Windows primarily, you already have interaction with a
    sort of example of this account. When you install software, have you noticed how
    certain installations will trigger a prompt to pop up and ask if you are certain
    that you wish to proceed and ask you to give the software the permission it needs
    to proceed? That is what you are doing in'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'Sudo. You are effectively giving that permission, but instead of with a click
    of the button, you are telling the system that you have elevated access to the
    system and should be respected. If you have been primarily using macOS until now,
    you have a similar sort of safeguard when you trigger downloads that may be recognized
    as dangerous or will create major alterations to the OS. On a Mac, you will see
    a security box pop up, and you must then provide the system with your password
    to confirm that you do, in fact, want to perform that change on the system. Effectively,
    then, Sudo is your privilege pass.


    It is the magic passphrase that tells your system that you are in charge—so long
    as the privileges on your user account match.


    # Using Sudo


    When you are ready to use Sudo, you do not have to try very hard. Effectively,
    all you have to do is add **sudo** before the command that you are trying to push
    forward. If you do this, your program should then ask you for the account password
    for the account that you are on. If you provide this password and your credentials
    check out, it will perform the function.'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'For example, imagine that you want to reboot your system. As you may recall,
    the command to trigger your system to reboot is simply **reboot**.


    However, reboot requires sudo privileges. If you were to simply try commanding
    your system with just reboot, it would tell you that you must be a superuser in
    order to execute that particular command. That is where you would then escalate
    your command. At that point, you can add to your command, creating an input of:


    ```

    $ sudo reboot

    ```


    Your system then asks for the account password, and upon entering the password,
    it reboots as requested.


    # Su instead of sudo?


    This is perhaps one of the safest ways that you can use to elevate your privilege
    to trigger the system to obey.


    There are others, such as the switch user command, known as "su."'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'However, when you use the switch user command, you are asked for the root password
    and then given the superuser prompt. You know that you are in the superuser prompt
    when you get a # as your input ready signal instead of the typical $ that you
    are likely used to seeing by now. The # should be your warning sign—if you see
    this waiting for you in the terminal, you know that you are on the root account,
    and you need to be careful.


    While the switch user command may have its uses in very specific situations, it
    also runs the risk of destroying everything with a single typo or the act of someone
    accidentally bumping you while you are clacking away at your keyboard. When you
    use sudo, however, you are required to insert it for each and every command that
    requires extra privileges. This means that you have that extra safeguard. Of course,
    this could get annoying if you were in the process of doing something that would
    require you to constantly validating your credentials, but it could be worthwhile
    if you think that the extra security is worth it.


    Of course, you could just set up a backup of your system right before you begin
    the process of entering your commands if you wanted to bypass the constant sudo
    usage, but that is ultimately a personal decision that you have to make, weighing
    the risk for yourself. Ultimately, the more you are in su, the more likely it
    is that you are going to have an accident.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# The Sudoers File


    Underneath sudo is the sudoers file. This determines who gets to use the sudo
    command in the first place in order to actually make use of the authority it brings
    with it within the OS. Typically, you can access this file within the location
    of /etc/sudoers, and you will have to edit this if you want to mess with command
    values and permissions. Perhaps the best way that you can make user of the sudoers
    file and the safestst way to editing it is thorough using the visudo editor.


    # Visudo


    Visudo itself acts as a sort of stopgap—an extra layer of security for the sudoers
    file. It allows for safe edits while also locking the sudoers file from being
    edited at the same time by multiple users, which could become dangerous if two
    people tried to create contrasting edits at the same time. If you try to access
    the sudoers file with visudo when someone else is currently in it, you will be
    rejected with an error message and told to try again later. When you make an edit,
    it will stop and check the edits for any errors that may be catastrophic in an
    attempt to at least try to make sure that you do not completely destroy something
    important.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# 138 | LINUX FOR BEGINNERS


    Upon finishing your edit of the sudo file after accessing the visudo editing system,
    the edit will be scanned for any errors. If you do happen to make a syntax error,
    it will reject the save, printing the message that declares that there is an error
    and will tell you which lines mistake is in. From there, you are prompted to either
    attempt to re-edit to fix the mistake, or you can quit saving the changes anyway.
    However, if you quit after visudo has found an error, it is highly likely that
    sudo will also find the error, and sudo will not be accessible until the error
    has been corrected.


    In order to access visudo, all you have to do is enter the prompt:


    ```

    $ visudo

    ```


    and you should be granted the access you are looking for, so long as the permissions
    are right. There are also several other options that you can pair with the visudo
    function in order to help you really make the most out of the program.


    These commands include:


    **visudo -c**: This triggers visudo to go into a check-only mode. It will check
    the current sudoers file for any syntax issues and will print the status of the
    file.'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'If the check was clear, visudo would end with a final value of 0. However,
    if there is any sort of error detected, it will end with a value of 1.


    **visudo -f sudoers:** This specifies an alternate location for sudoers, checking
