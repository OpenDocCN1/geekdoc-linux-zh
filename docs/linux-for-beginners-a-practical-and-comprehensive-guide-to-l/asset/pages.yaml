    # Linux processes


    Commands issued to Linux trigger processes. When you insert a command into Linux,
    then a new process begins. This process is assigned a 5-digit ID that allows the
    OS to track the processes—this will be known as the pid (process ID). While pids
    may be recycled, no two processes will share the same pid at the same time due
    to the pids being the process through which Linux is able to track the process
    in the first place. This process is run one of two ways: In the foreground or
    in the background. When in the foreground, where processes start by default, you
    are able to insert your input to the keyboard, and you get output on the screen.
    However, while these processes are running in the foreground, you are unable to
    complete other processes as well. For this reason, sometimes, processes get booted
    to background processes, where they run in the background, with no access to keyboard
    input, until that input becomes required. With it running in the background, other
    processes can be handled at the same time, meaning you can multitask until you
    are required to input further data. The process runs as one of three distinct
    types: Parent and child, zombie or orphan,'
  merge: -1
