  md: '# Networking 101


    Networking allows for the connection of computers, phones, peripherals, IoT devices,
    and more to all connect together, accessing one line of data and being able to
    communicate. This is the idea with the internet—you are able to access the internet
    network and communicate with devices that are even on the opposite side of the
    world from you. There are several important points to consider with networking,
    but at the base, think of the internet as one giant web—it is all interconnected
    with several access points for other devices to get to. No matter where you are
    on that web at that moment, you can get to any other point on the web in some
    way, even if that way may be slower than it needs to be or should be. This means
    then that you are able to sort of your way around the network to access data that
    you need, even if it is not on your physical machine. That is how the internet
    works.


    Networking has far more uses than just general web browsing, however. It can be
    useful for the distribution of data, data storage, general networking, and more.


    Thanks to this web, we are able to stream videos with ease from anywhere we are
    able to connect to the internet, or able to access files on the cloud. All that
    you need is a steady connection, and you are able to access nearly anything that
    is also connected.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# The Network Extension


    Networking spreads out across several people, allowing for rapid distribution
    of data if necessary. Ultimately, the network can be thought of as being divided
    into three distinct categories: The LAN, MAN, and WAN. As depicted below, you
    can see that the Lan is the smallest, with the MAN being larger, and the WAN is
    the largest form of network. Each subsequent network type is going to be comprised
    of several other aspects of the previous. Essentially, several LANs create a MAN,
    and several MANs create the WAN.


    ![](img/9f7f9b434643423b7aefac26177e90a3_159_0.png)'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# WAN


    Standing for Wide Area Network, the WAN is the communication network across any
    given specified geographical are. It may involve a city or even a country, and
    these may be public or privatized depending on the usage and whoever is managing
    it. To understand what the WAN does, stop and think about the internet—now imagine
    this as the biggest WAN there is. Several networks are connected together to create
    one big process. This is what a WAN is—in a WAN, you will have several smaller
    LANs or MANs that are all within one area, making up the WAN. The WAN is widely
    connected and is able to reach farther than a LAN. This makes a WAN the best choice
    if you wish to run a network or a wide-scale sort of server.


    # LAN


    Standing for a Local Area Network, the LAN is much smaller. Usually, the LAN covers
    a single building, such as a house, or even just a single office in a building.
    It is meant to be much smaller and not accessed by nearly as many people. They
    are most frequently connected via Ethernet to control the dataflow, though more
    and more LANs are moving toward wireless, known as Wireless Local Area Networks
    or WLANs.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '150 | LINUX FOR BEGINNERS


    If you have a home setup in which you have two systems sharing access to data,
    then you have a LAN. Other systems beyond computers can also comprise the LAN,
    such as printers or smart televisions that will share the data. These are used
    for the sharing of local data as opposed to wide-scale distribution. However,
    they are incredibly useful for a home or for a small business.


    # MAN


    Standing for a Metropolitan Area Network, this is larger than a LAN but still
    smaller than a WAN. This may be, for example, a large tech campus that shares
    a network spanning several blocks or even several square miles, but is not particularly
    wide-reaching—this would be a MAN. It can also be used to describe a city. Typically,
    a MAN is several LANs that create it, and the MAN is a fantastic way to pass forward
    the data within a LAN, allowing it to stretch further.


    # The Network Topology


    With that understanding of the network itself, it is time to look at the most
    common topologies—the forms through which networks connect to nodes. The node
    is an individual device'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'that is connecting to the network in some way, and different topologies will
    organize these networks in different ways, depending on necessity and what makes
    the most sense.


    # Point to point


    With this network topology, sometimes referred to as the bus topology, there is
    a central cable that runs between all devices on a LAN and connects them all.
    It is easy to connect to, but if there is any sort of break in the system, the
    whole thing will crash.


    # Star


    ![](img/9f7f9b434643423b7aefac26177e90a3_162_0.png)


    The star topology works to connect several devices all to a central computer that
    is referred to as the hub, as seen in the picture above. The nodes are able to
    communicate by first passing through the hub. In this form, a single node''s malfunction'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'not impact the rest of the network, but at the same time, if the hub were to
    fail, the entire network would be crippled.


    # Ring


    ![](img/9f7f9b434643423b7aefac26177e90a3_163_0.png)


    In the ring topology, a LAN is set up with the topology of a ring. Each node is
    connected to two others within a closed loop, and all messages will travel around
    that circle. This allows the message that is being passed along to be regenerated
    with each node it goes through.


    # Tree


    The tree topology is a hybrid of the bus and star topologies to create what looks
    like trees when drawn out. It involves several star-configured networks that connect
    to a single linear backbone. This is great for larger computer networks that are
    benefitted by being broken into easily managed pieces, but the'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'system is at a disadvantage because the backbone acts as a hub, and if that
    fails, everything fails.


    # Mesh


    Full mesh topology connects every node to a circuit connecting it to every other
    node within the network. It is expensive to manage, but it also leads to the most
    redundancy—which means that it is safer. Even if a single node fails, traffic
    can continue because all nodes are interconnected. Sometimes, some nodes are organized
    with a full-mesh pattern while others are not entirely interconnected, allowing
    for some redundancy and some money saved, while still managing an effective network.
    This is known as partial mesh topology.


    # Main Protocols of the Internet


    # TCP/IP


    As a precursor to routing, you must first understand the TCP/IP network model.
    This is the way that packets are able to find their way back and forth across
    the internet, allowing them to reach the right host within the network. Within
    this network model, there are five layers that describe the necessary processes
    to'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# 154 | LINUX FOR BEGINNERS


    actively shift and move the packets from the host to host as necessary, no matter
    whether that host is local or across the world.


    | *Application layer |

    | Browser initiates an HTTP connection request message |

    | *Transport layer |

    | Message is encapsulated and given a source port |

    | *Internet layer |

    | The data is encapsulated into a packet with source and destination IPs |

    | *Data link layer |

    | Data link layer identifies MAC address and sends it there over the wire |

    | *Physical layer |

    | Default router receives the data and determines the path |


    +   **Application layer (Message):** It all starts with a message. The first layer
    consists of the necessary protocols that will be needed for communication, such
    as HTTP, SSH, IMAP, and any other commands that will be necessary. When you then
    request a webpage at any point, the message is communicated through one of those
    formats.


    +   **Transport layer (TCP):** Next is the TCP segment—this provides the data
    transport from end to end and also manages the flow. It is independent of the
    data that is being transported.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '+   Internet layer (Packet): This is done on the internet layer of things.
    It is the part that routes data across the appropriate networks in order to ensure
    that they arrive at the proper final destination through the use of IP addresses
    and routing tables.


    +   Data link layer (Frame): This layer controls and facilitates the direct connections
    that occur between hardware within a single physical network. It uses MAC (Media
    Access Control) address within NICs (Network Interface Cards) in order to recognize
    any devices that are connected to the network.


    It is only able to interact with other devices and hosts that share a network
    together.


    +   Physical layer (Bits): This is the layer consisting of NICS and a physical
    Ethernet cable that allows for the connection between networks. The Ethernet cable
    is what enables the bits to be transmitted.


    # IPv4


    This refers to the Internet Protocol Address version 4—it is your IP address.
    With the IPv4, you are using the 4th protocol.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '156 | LINUX FOR BEGINNERS


    Effectively, the IPv4 address will be a 32-bit number displayed in dotted decimal
    notation. You will see two primary components—the network''s prefix and the host
    number. Every host sharing the same network will also share the same network address.
    However, each host will also have its own part of the number that is unique. If
    the device is accessing the internet and is visible to those outside of the network,
    it must contain a globally unique number.


    # TCP


    Standing for the transmission control protocol, this is one of the main protocols
    of the internet protocol suite.


    It was designed to create a standard that allows everyone to establish and maintain
    a network conversation because everyone is using data that is compatible. It allows
    for the exchange of data in the form of packets.


    # UDP


    Referring to the User Datagram Protocol, this is an alternate communications protocol
    to the TCP model discussed above.'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'The UDP is used to establish low-latency and loss-tolerant connections to allow
    for high speeds and low risk.


    # Routing


    Now, at this point, you may be considering turning your Linux server into a router—this
    is a valid point, and several people do it. In order to do this, you must first
    do a configuration of the router, and then you must assign the address necessary.


    # Linux as a Router


    First, you must configure the device. This will require you to set an IP address
    on two devices first, making sure that they each use the same gateway IP. Now,
    what you want to do is set your network to accommodate that gateway IP.


    To do this, you must first login to the root account, and then run the command


    ```

    # nmtui

    ```


    Next, choose the option to Edit a connection and hit the Enter key.'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'Choose the available Ethernet that is present on the leftmost side of the window
    and select Edit on the right, once again pressing Enter.


    At this stage, you will have the opportunity to set your IPv4 configuration to
    manual. Then, you need to enter the IP addresses that you wish to have access
    to the network. You can add more if you need to.


    Select Quit and then press Enter. At this point, you should restart the network,
    and you will need to then confirm that the changes took. In order to do this,
    you will enter the command:


    ```

    #ip addr

    ```


    You should ten be able to see the systems that can access the gateway without
    accessing the other network. You can confirm this with a ping command. The ping
    should come back as the destination host unreachable.


    # Ifconfig command


    ifconfig is a CLI designed for network interface configuration. Beyond just that,
    it also serves to initialize interfaces during boot up. When the server is actively
    running, ifconfig can further be'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'used to assign IP Addresses to interfaces, as well as enabling or

    disabling any interances on demand.


    This command will also allow you to view the status IP, any

    hardware and MAC addresses connected, and the maximum

    transmission unit (MTU) for all active interfaces. Overall, this

    sysystem command is designed to allow you to debug or to tune

    the system.


    # DNS settings


    If you find that your DNS settings are misconfigured or you

    need to change them in some way, there is a simple enough

    process for this. You will do so by adding name servers to your

    configuration file.


    Within most Linux systems, the DNS will create names defined

    within the /etc/resolv.conf file. This file will usually contain

    at least one nameserver line. That line will be the defining line for

    the DNS server. The name servers will be prioritized by the order

    that they are found within the system. For ease of access, use

    the IP addresses of the servers you will be using.


    To manage this, you will need to open the resolv.conf file with

    some sort of editor program, such as nano or vi.'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'In doing so, you will be able to make the changes. If nano is not yet in use
    on your system, try the following command to install it:


    ```

    $ sudo nano /etc/resolve.conf

    ```


    You should then have access to add lines for the name servers you are using. Most
    often, you will want the one that will be housing any cloud servers you have.
    With the line renamed, you can then save the file. Of course, as with after any
    major change, check the ping to ensure that the domain settings took and confirm
