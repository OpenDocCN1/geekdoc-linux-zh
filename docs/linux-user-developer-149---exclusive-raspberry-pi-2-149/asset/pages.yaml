  md: '# # Touch up photos using GIMP


    Make professional photo enhancements with open source software


    # TUTORIAL


    ![](img/3d658904c66bbb1691af66259d8c8bf9_38_0.png)


    # ## 17 Use the Quick Mask


    So we''ve removed some blemishes, you can also smooth the skin a little using
    the Quick Mask tool. Go to Select and Toggle Quick Mask to cover the image in
    a layer of red. Finally, we''ll be removing the red hue once done.


    # ## 15 Clean up the photo


    The Heal tool can do more than just remove a mole. In this example we''ve removed
    the wrinkle from our model''s neck. On a large scale it can be used to clean the
    background of a photo more naturally than cutting or blurring colours. It''s not
    a perfect tool as it can only estimate, but it''s still very smart and gets better
    all time.


    # ## 19 Grab Gaussian Blur


    The final step to smooth out the skin is using the Selective Blur in Filter->Blur.
    Pay about with the levels again but try to keep them small. Go to top or you can
    make the skin slightly resembleably perfect.


    # ## 16 Enhance the details


    The Unsharp Mask works very well with small details or where the makeup is key.
    Go to Filters->Enhance to select the tool, which will automatically bring out
    some of the details in the photo. Use small values and experiment with it; it
    only needs to be subtle.


    # ## 18 Do some preparation


    Use the Eraser tool to remove the red areas, the eyes, eyes and mouth. After that''s
    done you can turn off the mask and it''ll create a selection of what you want
    deleted, without the Joker-esque look that occurred when the mask was.


    # ## 20 Beautiful photos


    With a bit of practice and creative uses of some tools, you can make any picture
    look much better than the original, without obvious and giving the model a completely
    different appearance.


    ![](img/3d658904c66bbb1691af66259d8c8bf9_38_1.png)'
