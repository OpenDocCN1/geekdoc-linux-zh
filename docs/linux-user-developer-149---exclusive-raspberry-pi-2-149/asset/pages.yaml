    raspberrypi.org/downloads


    The Raspberry Pi 2 is now here. The ultimate upgrade to the Raspberry Pi brings
    more power and better options for your existing projects, while opening the way
    to new and exciting projects. Though you can''t just put your current Raspian
    SD card into the new Pi and expect it to.


    +   01 Clean up Raspbian

    Now is the perfect time to do some overdue spring cleaning. Delete any unneeded
    files and pictures, perform a sudo apt-dist-upgrade to make sure all the packages
    are the same as the new Raspbian and reinstall whatever software you don''t need.


    +   02 Copy package list

    You can make a list of the packages you have installed and use this list to install
    the same packages onto your new Pi. Do this by going into the terminal and typing:


    ```

