    # Full code listing


    This month, we have looked at examples of how to include network monitoring into
    your own program code. But what if your primary intention is to do something like
    nagios? Since nagios includes a large number of monitoring tools, will you want
    to use Python? A good choice might be nagios. Assuming you are using Raspberry
    Pi, you can install nagios with the command:


    ```

    sudo apt-get install nagios3

    ```


    This installs the monitoring tools, with the web interface that you can use to
    control the large number of monitoring tools, you can use Python to write your
    own plugins and add more functionality. To do so, you will also need to install
    the NRPE server package with:


    ```

    sudo apt-get install nagios-nrpe-server

    ```


    You should put your scripts in the same directory (/var/lib/nagios/plugins) as
    the plugins. This simply makes configuration much easier. In order to trigger
    nagios, you will need to set an exit code in your script (exit()). The possible
    values are:


    | Exit Code | Status |

    | --- | --- |

    | 0 | OK |

    | 1 | WARNING |

    | 2 | CRITICAL |

    | 3 | UNKNOWN |


    Once you have written your script, you need to define it as a command in the file
    ''/etc/nagios/nrpe.cfg'' where you define a command name and point it to the location
    on the file system. To add the new command to the checks, you will need to add
    a ''definition'' section to the file ''/etc/nagios/objects/commands.cfg'':


    ```

    # The first step is to import the socket module

    import socket


    # You need a socket object to work with

    # The first parameter is the address family

    # The second parameter sets the socket type to raw

    # The third parameter sets the protocol to TCP

    s = socket.socket(socket.AF_INET, socket.SOCK_RAW, socket.IPPROTO_TCP)

    # The interface needs to be in promiscuous

    # If you want, you can use the following

    import os

    s.ioctl(''eth0'', "promiscuous")

    # In order to see the outside world, you need

    # to bind this socket to a physical interface

    s.bind((''192.168.0.11'', 0))


    # You can start collecting data

    # recv from the source address

    packet_data = s.recv(65535)


    # To check a server, you can

    # send a request to get the index page

    s2 = socket.socket(socket.AF_INET, socket.SOCK_STREAM)

    s2.connect((''google.com'', 80))

    s2.sendall(b"GET / HTTP/1.1")


    # You can get the response data

    data = s2.recv(102)


    # With psutil, you can easily get

    # individual and aggregate network data

    import psutil

    # The network connections are given by

    net_conns = psutil.net_connections()

    # The number is

    num_counts = len(net_conns)


    # Aggregate data is given by

    agg_stats = socket.net_io_counters()


    # The individual elements are

    print("Bytes sent = " + agg_stats.bytes_sent)

    print("Packets received = " + agg_stats.packets_recv)

    ```


