  md: "# # Supercharge your Raspberry Pi\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_68_0.png)\n\
    \n# 02 Choosing the SD card\n\nVarious standards of SD card are available, the\
    \ more expensive for better error correction. For the performance on your Raspberry\
    \ Pi, choose an SDHC card with a high rating. The same advice applies to MicroCards,\
    \ which you can use on your Raspberry Pi with an SD card adapter or directly insert\
    \ into the Raspberry Pi.\n\n# 05 Write data to RAM\n\nRather than reading and\
    \ writing data to your SD card – something that will eventually result in a deterioration\
    \ of reliability and performance – you can configure Raspberry to write to the\
    \ RAM, which will speed up things and improve SD performance.\n\nUsing tmpfs (File\
    \ systems table), a system configuration available in Linux distributions.\n\n\
    ![](img/3d658904c66bbb1691af66259d8c8bf9_68_1.png)\n\nAbove There's a great guide\
    \ to SD cards at elymux.org/RPI_SD_cards\n\n# Bought SD cards\n\n```\n$ pi@raspberrypi:~\
    \ \nsudo raspi-config\n```\n\n# 03 Make the most of your storage\n\nYou'll typically\
    \ need 1GB of storage for your Raspberry Pi, so no matter how large your SD card\
    \ you will be able to create or save data.\n\nIn Raspberry you can use the command\
    \ line or run the configuration utility to get more space (only if your SD card\
    \ is greater than 2GB)\n\n+   - sudo raspi-config\n\n# 04 Expand the Raspberry\
    \ partition\n\nMaximising the partition allows the full capacity of your SD card,\
    \ which will increase the media's lifespan (there is more space to write to, so\
    \ the sectors aren't being overwritten)\n\nWith raspberry-config, use the arrow\
    \ keys to select expand_partitions in the menu. Wait briefly while the partition\
    \ is resized.\n\n# 06 Enable tmpfs\n\nmaking a RAM disk in Linux is as easy to\
    \ set up. In the command line, enter:\n\n+   - sudo nano /etc/fstab\n\nAdd the\
    \ following line to mount a virtual system:\n\n```\ntmpfs /tmp tmpfs defaults,noatime,nosuid,size=755m\n\
    ```\n\nFollow this by saving and exiting nano (Ctrl+O, X), then restart the Raspberry\
    \ Pi.\n\n+   - sudo shutdown -r\n\nIt's tempting to boot up your Raspberry Pi\
    \ with an image card to SD that you just pulled out of your phone. After all,\
    \ it's the same, right? The that chosen SD card will work just like you had when\
    \ using on your Raspberry Pi. But you won't get enough performance. A high-performance,\
    \ SD-card with write speed is highly recommended. Just make sure you're buying\
    \ a known brand!\n\nwww.linuxuser.com"
