  md: '# Opinion


    The latest in the Linux community


    # OPEN SOURCE


    # THE OPEN START-UPS COLUMN


    # Freiheit Berlin


    Berlin is renowned as a place for start-up culture it is also great for lovers
    of software freedom


    ![](img/3d658904c66bbb1691af66259d8c8bf9_10_0.png)


    Left Languages like Ruby have proven the most popular with Travis CI


    Richard Smedley is

    Unix and networking jack-

    offrees and open source software


    What makes a great climate for start-ups?

    What makes a great place for companies to promote free and open source software?
    And how do they come together?


    Images of the Berlin Wall bestowed with ''freedom'' (replacing ''fear'') may be
    seen as something of a cliché, but could also be concrete the reunification of
    the city that is came together.


    Berlin-based venture capitalist Clément O''Leary calls the start-ups that have
    appeared in the last five years the third wave of Berlin start-ups. They are even
    more engine-driven, more enterprising, more open source.


    The local government of the Berlin region initiated Open Berlin four years ago,
    as an umbrella organisation that promoted standards, interoperability and raised
    awareness of free software to push both in the sector and to businesses. The Open
    Berlin website


    (opentech.eu) is well worth a read, with interesting projects featured in its
