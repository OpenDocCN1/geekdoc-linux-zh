    **01 Begin the Installation**, you need to download ''All-In-One SpagoB-xx.zip''
    from http://github.com/spagoB/spagoB/releases. The release zip file contains the
    SpagoB server and database rolled together, so you don''t need to download anything
    else. If you have any problems, or if you have previously installed SpagoB or
    any other software, it is better to start with a fresh installation. To ensure
    you get a response, you must have installed Java on your computer. To check run
    the command `java -version` in the terminal. If it returns something, you can
    go. The Java program can be installed using `sudo apt-get install default-jre`
    on Ubuntu. Once you have done this, continue the process. After downloading the
    file, unzip it to the target folder. Type the command:


    ```bash

    cd /location/download/spagoB-server-5.8/

    ```


    Grant permission for the shell script to be executed using the command `chmod
    755 *`. Also, navigate to the database folder and change the permissions in that
    folder. After changing permissions, by using `chmod 777 *` we change the permissions
    for all the files with extension .sh - not a good practice in production environments.
    Execute the command to run SpagoB. If you see a message like ''Start up sequence
    completed in seconds'', go to your browser and access SpagoB using http://localhost:8080/SpagoB/.
    Once you open the page, you can login with the default credentials mentioned below.


    **02 Get started**


    As a BI tool, SpagoB main focus is to provide actionable analytics. This, connects
    with a range of data sources (like databases) and provides an easy-to-use GUI
    to help you explore your data. You can login with the default credentials mentioned
    below on the first line of a page. In a production environment, you will need
    to create users. For more details, please refer to the user manual.


    Now starting your analysis. Click on the My Analysis link. In the left menu, click
    on the new button in the top-right corner. The next page will ask for the report
    type: select ''ad hoc''. You can now select the appropriate dataset for your analysis.
    Since there is no dataset created,


    **03 Create the analysis**


    Once you have the data, you can choose two options: ''show query'' and ''show
    query''. Select the worksheet designer (which will be the default designer). Then
    select the visualization style, such as bar or pie chart. Once you select the
    style, drag and drop the fields into the designer. Note that fields are displayed
    based on the dataset, and you can see the result of the query using the Preview
    tab. If everything looks right, click the Save button. After an analysis is saved,
    you can view it under the Analysis menu. linuxuser.co.uk


    Tutorial


    ![](img/3d658904c66bbb1691af66259d8c8bf9_45.png)


    **04 Define a query with QBE**


    The ability to draw graphs from a fixed dataset is not enough for real world scenarios.
    You may want to look at things from multiple scenarios. With QBE you can define
    your query graphically, check the results, or create a new report for future use.
    To start, simply click QBE during the query creation. A window (related to the
    selected dataset) will appear and you can drag and drop the relevant dataset fields
    to the editor on the right. Once the filters are populated, your query is generated
    automatically. You can then edit or create graphs for this new query using the
    worksheet tab.


    ![](img/3d658904c66bbb1691af66259d8c8bf9_45_1.png)


