    上方 PiPanther 主板设计为直接连接在树莓派 GPIO 引脚上的扩展。它可以与 Model A 和 Model B 树莓派配合，并能够驱动你的 Ubotia
    机器人。下方直接进入 Ubotia 和你的界面（请查看 Michael 的视频：bit.ly/1Bnkp）。充电：面板翻起以露出下方的 microUSB 端口，这样你可以在回合之间为
    PiPanther 充电。


    ![](img/3d658904c66bbb1691af66259d8c8bf9_62_3.png)

    ![](img/3d658904c66bbb1691af66259d8c8bf9_62_4.png)


    有一个 DC-DC 转换器，为树莓派提供 5V 电源、强大的电机驱动器、舵机控制器和 USB 充电器，你可以使用 microUSB 插头直接为 PiPanther
    充电。我离开三个小时它就充满电了。


    提供了 PiPanther 到移动界面的实时视频流。我是在没有人能做到这一点时制作的，但遗憾的是视频流的延迟太高了，我没有足够的时间修复它。你必须相信我，我是当时第一个从树莓派到
    Android 创建实时视频流的人！所以，你可以实时驱动它。


    这块主板将用于自定义项目——是吗？

    由插件控制器组成。如果你有插件，就可以共享由此软件在运行时加载的库，使用 API 你可以创建基于标准的协议（此处原文可能有误，应为基于协议的协议）。


    ### 喜欢吗？

    了解如何制作你的插件，并在 linux.com/posts/plugin-guide 了解插件架构的概况，关注项目的任何更新。


    确切。要驱动坦克，你需要驱动电机——左履带和右履带——不用履带可以使用轮子，这样你就可以移动到任何地方。转向也是一样的。如果你想向前走，就使用两个电机，如果你想转弯，就使用左右履带。你可以用这个来驱动你的机器人——使用相同的主板，但带有
    Pi 和 Ubotia 软件。这是 Ubotia 软件的主部分（也是最困难的部分）。


    所有大部分都由树莓派处理！


    树莓派运行 Linux，在那个层上，我们编写了负责使用串口接口与 PiPanther 主板通信的代码，USB 控制电机、云塔、状态 LED，我们从 USB
    充电器获取反馈。这些是用 C++ 等语言编写的。你的你的网站说这些插件可以影响 Ubotia 画廊——一个用于坦克的机械臂，对吗？


