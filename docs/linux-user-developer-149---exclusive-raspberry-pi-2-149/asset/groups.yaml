    # 学习如何使用开源软件进行专业的照片增强


    # 资源


    GIMP: gimp.org/downloads


    爱好摄影从未如此流行，这很大程度上归功于高保真单反相机、

    优秀的傻瓜相机以及智能手机的普及。在过去的几年里，数字照片最终取代了胶片相机，获取一张照片比以前冲洗照片要容易得多。


    随着数字照片而来的是数字

    处理软件，例如 GIMP，它能让你快速地对照片

    进行专业风格的修饰和增强，从而真正展现

