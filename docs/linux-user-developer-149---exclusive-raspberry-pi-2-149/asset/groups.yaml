    ### 08 GEO and GIS engine


    SpagoBI GEO engine enables dynamically, according to re-integrate information
    according to a geographic hierarchy (region or district, for example) by the administrator.
    This engine can be used in geographic context, so can display the distribution
    of indicators on any structure that can be represented on a map, including process
    flow diagrams and infrastructure topology. To create geographical analysis, go
    to My Analysis


