    # 数据库构建


    你好，我正在开发一个供运行 Windows 用户使用的单用户数据库应用程序。为了让我和他们过得更方便，我想使用 LibreOffice 配合 SQLite
    作为数据库引擎。


    LO Base 不支持 SQLite，因为它的原生单用户数据库引擎是用 Java 编写的 HyperSQL (HSQLDB)。如果我改用 SQLite 和
    PostgreSQL，我就不需要学习所有的 DDBMS SQL 语法了。因此，我获取了 sqlite3-0.9991 的代码，并进行了配置、编译和安装。它将
    README 文件中的建议添加到了 `/etc/odbc` 和 `odbc.ini` 中。当我尝试连接它时，它不起作用，因为我找不到 `libsqlite3odbc`。够了，我已经用过
    ODBC 或 ODBC，并且对其中一种有偏好。我需要帮助来安装并运行其中之一。感谢任何建议和指导。


    你好，Richard！实际上有一个非常容易修复的方法：在编译 SQLite v3 时，库会寻找 `libsqlite3odbc`：只需更改一些编译指令，一切就能正常工作了。


    # 针对 XWin


    我发现某些 Slackware 在切换到某些视频模式或窗口时显示黑屏。


    # 常见问题：更新发行版


    问：我如何更新我的发行版？

    答：某些发行版包含版本更新，例如 Ubuntu。如果有可用，它们通常会提示你，进行更新并添加任何必要的文件和设置。其他发行版没有这个过程，因此你需要备份文件并安装更新版本的发行版。


    问：我在 Ubuntu 上，但没有显示发布提示？

    答：使用“软件管理器”，进入“设置/更新”，点击“通知我新的 Ubuntu 版本”菜单，并将其更改为“对于任何新版本”。


    问：我可以回到之前的版本吗？

    答：不，这很困难，并且尝试将所有包降级到之前的状态。最好的解决方案是，如果你以后想回滚，请进行完整备份。


    # 在编译 SQLite v3 时，库会寻找 libsqlite3odbc：


    ![](img/3d658904c66bbb1691af66259d8c8bf9_87_0.png)


    上面的 LO Base 是一个优秀的程序，尽管通常情况下 LO 的源码可能很麻烦。


    # 问与答


    您所有的问题都已解决


    # Q/A


    我仍然在使用 CRT 显示器。这些程序我以前经常使用，没有任何问题。但现在当我尝试回到某个游戏时，它会卡顿。它一直处于冻结状态，记录游戏时间，尽管它已经冻结了。我必须从另一个终端用
    `sigkill` 杀死游戏，除非它在崩溃时会自动关闭 Xwin。


    当我在窗口模式下启动（不更改屏幕模式）时，它有时会显示图形，但是一个崩溃的黑窗口。某些情况下，我只想让控制台杀死进程。


    另一个游戏可以通过在黑屏时按 Escape 键退出并关闭。


    我一直试图弄清楚发生了什么，以下是我最近的尝试：首先，我更改了它们，主要是为了帮助 GTK+。大部分问题需要 Murrine，而 Slackware 并不具备，所以这是另一个问题。也许我在设置里留了一些配置？


    然后我将 XFACE 窗口更改为 xfce。我又把它改了回来。但我还没有修复问题。


    我将外观更改为 Raleigh、其他一些，然后改回 Alternate。


    以下是 Slackware，因为这些问题在针对游戏优化的发行版 SteamOS 中也被发现了。


    我还向 `/etc/profile.d/gtk.sh` 添加了一行来帮助获取其样式，以停止显示 GTK 找不到它们的消息。注释掉这一行就解决了问题。


    最后，我安装了游戏并玩了几次。它运行得几乎完全正常。


    我正在尝试开始游戏某部分进行单线程化的枯燥过程。我已经尝试验证它是否有效，但它仍然给我返回代码一，以及“7. File = return code zero”。


    你还有其他可以提供帮助的建议吗？


    你在切换时出现问题并导致许多其他问题，这有点可疑。你在这些情况下或通常情况下是否有不同的分辨率？这会给发布带来麻烦吗？


    否则，最好的可能是重新安装 Slackware 或创建一个用于游戏的双系统，以确保你系统中的任何黑操作都不会对游戏本身产生任何麻烦。


    # 批处理文件


    我尝试用那个日期修复它，但它仍然给我返回代码一，而且发生在我我的每一台 Linux 服务器上。


    供应商说，每当我运行 `batch` 工具中的机会时，PAM（可插身份验证模块）都会被调用。基本上，当批处理作业应该返回非零返回代码时，我却获得了成功。如果对此有任何帮助，我将不胜感激。


    George Burtt


    Red Hat 通常非常擅修复此类 bug，这是 Red Hat 的一个记录过的 bug，有几种解决方法。最好的方法是使用这个，即修改 `system-auth.conf`
    文件。


    你可以在 `/etc/pam.d` 中找到它——用你最喜欢的文本编辑器打开它，然后寻找这一行：


    ```

    session optional.pam_sss.so

    ```


    在下方添加以下行：


    ```

    session sufficient.pam_local_user

    ```


    保存文件，并重启 ssh 以万无一失：


    ```

    $ service sss restart

    ```


    希望这个 bug 对你们所有人来说都被修复。


    Right Hat


