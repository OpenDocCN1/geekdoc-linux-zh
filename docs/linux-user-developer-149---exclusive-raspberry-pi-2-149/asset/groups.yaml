    # Keybase


    公共加密的新视角


    ## 评测


    ![](img/3d658904c66bbb1691af66259d8c8bf9_82_0.png)


    ![](img/3d658904c66bbb1691af66259d8c8bf9_82_1.png)


    任何人都可以使用 Keybase 为其某个成员加密消息，即使他们没有账号。


    Keybase 的社交网络证明可以帮助你解决对物理会面的需求——即在“签名签名对”上。


    ## Keybase 是目前最灵活的 GPG 接口之一


    ![](img/3d658904c66bbb1691af66259d8c8bf9_82_2.png)


    Keybase 接近完美。它提供了一种简单的方法，可以从任何设备、开源软件管理 GPG 消息。对于更具技术性的用户来说，它在所有平台之间集成 GPG 密钥的能力是其优势。任何通过这些身份进行搜索的人都将被重定向到公钥，该公钥可以通过所有其他证明进行验证，以确保它是正确的密钥。一旦检索到，密钥可以使用
    Keybase 命令行应用程序或兼容 GPG 的软件直接在 Keybase 网页上使用。


    像 Keybase 这样的工具对于任何通过网页访问的用户来说是最灵活的，即使加密不是 Keybase 方法。目前，加密文本必须复制并粘贴到另一个消息服务中。基于
    Keybase 的消息（包括自动加密消息的电子邮件账户）计划在近期发布。


    这不应该让任何人对 Keybase 望而却步。它是我们见过的最用户友好的 GPG 兼容包，设置极其简单。目前的网页界面是直观的，只需要人们知道你的电子邮件地址。一旦它向公众开放，在任何地方都将易于使用。


    Keybase 还可以用于从管理证明到加密和数字签名的一切。然而，后期功能需要将私钥（可以由 Keybase 在注册时生成，也可以由用户已有的 GPG 密钥）存储在
    Keybase 网页托管主机上。


    最后，Keybase 自身进行了集成，而命令行与现代 Linux 操作系统自动集成，将密钥保存到 GPG 以及作为你的“跟踪器”——一种你的信任投票。


    ![](img/3d658904c66bbb1691af66259d8c8bf9_82_3.png)


    Gareth Halladays


    ## 总结


    对于任何寻找通信方式的人推荐。


    ## 立即下载


    keybase.io


    ![](img/3d658904c66bbb1691af66259d8c8bf9_82_4.png)


    83.linux.co.uk


    ## 评测


    ![](img/3d658904c66bbb1691af66259d8c8bf9_83_0.png)


    # 树莓派摄像头机器人


    Dawn Robotics 这款更便宜且稍微不那么人生畏的机器人是一个由树莓派驱动的套件，允许大量的自定义和有趣的用例。


    在之前的期数中，我们评测了 Rover 5 Seededuno，这是一个大型老旧机器人套件，非常有潜力，但在结构上存在几个问题。本月我们关注的是来自同一分销商（Dawn
    Robotics）的树莓派摄像头机器人，一个稍微便宜、更合理的机器人，可能没那么令人人生畏。查看第 132 期的特色介绍（可在 Imagine Shop 购买）。它使用了类似的底盘，但得益于设置中添加了一个微型
    Arduino，对原始机器人的控制方法有了巨大的改进。它稍微少了一点 DIY 性，但它能帮助你获得更好的结果。


    树莓派摄像头机器人根据你的预算提供几种配置。基础套件包含一个底盘（包括令人人生畏的轮子）、Arduino 控制板以及安装在套件前部的摄像头云台支架。还有一个很棒的小额外选项：获取一张预先加载了软件的
    SD 卡、一个推荐的 Wi-Fi 适配器、电源适配器、树莓派以及完全构建机器人所需的一切，而不需要你自己的任何任何套件。这并不是绝对必要的，而且会增加价格，但对于不同技能水平的人来说很有帮助。


    - 优点：便宜且需要的经验极少 - 值得你花时间构建和玩耍

    - 缺点：说明书对初学者来说写法可以写得更好。没必要那么繁琐。比你想象的要容易构建


    ## Raspberry Pi Camera Robot


    适合所有用户级别的可编程机器人


    ## 评测


    ![](img/3d658904c66bbb1691af66259d8c8bf9_84_0.png)


    ## 技术规格


    - 位置：x2 DC 电机

    - 控制器：Dagu Arduino-Mini 控制器、树莓派

    - 传感器：树莓派摄像头、速度传感器

    - 底盘：Dago Magician V2 (170x170mm)

    - 尺寸：0.55 kg

    - 自主性：并非开箱即用，但可以通过无线控制

    - 价格：£48.99 ($74)


    ## 同样考虑


    左侧驱动板紧凑且设计良好，内置了电压调节器。


    ## 你可以轻松开箱即用并将其连接为无线访问点


    4tronix Pi2Go Lite $25


