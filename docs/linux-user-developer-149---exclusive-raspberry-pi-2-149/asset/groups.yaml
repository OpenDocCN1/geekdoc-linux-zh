    ## Canonical 推 de Click 迈向新格式


    Canonical 重新关注其内部打包格式 Click，以支持 Ubuntu Touch。Click 格式与其他努力不同之处在于，它直接将依赖项嵌入到包中。Ubuntu
    的每个发布版本都允许开发者创建自己的 Click。基于 QML 的 Unity shell 将进一步推动 Click 的主流化。然而，Canonical 表示其发布可能会任何时候停止。


    ## Free Code Camp 开源


    Free Code Camp 是一种旨在培训新开发者并让他们与经验丰富的配对进行项目的网络化计划，该计划已宣布转向开源。代码可访问。


    # 硬件


    ## Nvidia Tegra X1 “超级芯片”


    ### 公司目标直指车载 Linux


    Nvidia 发布了用于 Linux 的下一代 ARM 系统上芯片 Tegra X1，用于高性能任务。


    在 Tegra K1（分为 32 位和 64 位版本）以及基于 Tegra T25 的开发板的基础上，Tegra X1 带来了巨大的改进。它是第一个基于其最新
    Maxwell 架构的 GPU SoC。64 位芯片还具有通用处理核心：四个高性能 ARM Cortex-A57 核心和四个低功耗 Cortex-A53 芯片，带有
    512KB L2 缓存，采用 ARM 的 big.LITTLE 配置，旨在平衡性能和功耗，目标是汽车市场。首批产品将是 Tegra PX 和 DX——前者是用于导航和娱乐的“计算芯片”，后者是具有上述
    Tegra X1 模块的基于 Linux 的板，用于车辆项目。PX 预计将仅向 Nvidia 的汽车行业合作伙伴出售。DX 可能会商业销售，但 Nvidia
    尚未确认价格或可用性。


