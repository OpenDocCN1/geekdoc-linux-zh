    As the previous steps, datasets are for creating analytics, now see how to create
    your own datasets in SpagoBI. Click on the Data Link on the left menu and click
    the Create Dataset button in the top-right corner. The new page pops up allowing
    you to select xls or csv file. Once the file is loaded, you can specify the delimiters
    and encoding of the file, SpagoBI will automatically identify the column headers.
    Then define the attributes and


    **06 Make models**


    The difference between models and datasets is that while datasets are imported
    from data sources, models relate to the datasets directly. You can create models
    too too. In fact, to create a new model, click on the Add button on the right
    side of the resources link to add a new data source like a database. Click on
    the resources link and then go to Data/Data Sources. Here, click the Add button
    and a new form will open. Fill it with the database connection details. Click
    on the top-right corner to check if SpagoBI can connect to the database, then
    save. Now click on the link again and go to Catalogue:Business Models. Add a new
    model and select the data source as newly added dataset. Save the model to finish
    the process. You can now see the new model under your Data Link.


