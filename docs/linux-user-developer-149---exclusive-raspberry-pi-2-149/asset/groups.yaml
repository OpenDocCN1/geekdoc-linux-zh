- md: "\nFix common photography issues\nsuch as red eye using in-built\ntools from\
    \ GIMP\n\nLearn how to remove minor blemishes\nand unessential items such as necklaces\n\
    to improve overall picture quality\n\nSmooth out and highlight skin using\ncolour\
    \ control and sharpness to\nmake a photo more lifelike\n\nRS27370_image.jpg\n\n\
    RS27370_image.jpg-1.0 (RGB color, 1 layer) 1024x960 - GIMP\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_35_0.png)\n\
    \n![](img/3d658904c66bbb1691af66259d8c8bf9_35_1.png)\n\n# Touch up photos using\
    \ GIMP\n\nAdvisor\n\nRob Zwetsels\ncomplex systems and is a web\ndeveloper proficient\
    \ in Python,\nand PHP. He loves to\nexperiment with computing.\n\n# Learn how\
    \ to make professional photo\nenhancements with open source software\n\n# Resources\n\
    \nGIMP: gimp.org/downloads\n\nHobby photography has never been more\npopular,\
    \ largely thanks to the availability\nof high-fidelity DSLR cameras,\ndecent point-and-shoot,\
    \ and not\nsmartphones. Finally taking over film\ncameras for the last few years,\n\
    digital photos are much easier to get a\ncamera than developing photos ever was.\n\
    \nWith digital photos also comes digital\nmanipulation software, such as GIMP,\n\
    which enables you to quickly perform professionally\nstyled touch-ups and enhancements\
    \ to\nphotos to really bring out the\ntones and lighting, fix any red-eye, and\
    \ control\ncolour temperature and more.\n\nWhile Photoshop may be an extremely\
    \ \npowerful tool for editing, GIMP is\ndefinitely not so slouch in that department.\n\
    Having just about every feature you could\nget in Photoshop, with a few even being\
    \ a bit\nbetter, it's most certainly enough for creating\na great look with any\
    \ of your photos.\n\n36 www.linuxux.co.uk\n\n# Touch up photos using GIMP\nMake\
    \ professional photo enhancements with open source software\n\nTUTORIAL\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_36_0.png)\n\
    \n## 01 Install GIMP\nGIMP is already installed on many Linux distros by default,\
    \ so searching the Graphics in your menu is first to find it. Otherwise, it can\
    \ be installed in your software manager by looking for GIMP. If all else fails,\
    \ head to our website to download the installer.\n\n## 02 Work with RAW photos\n\
    Some cameras allow you to work straight from JPEGs, but others will give you RAW\
    \ files you can edit with light levels and other camera aspects. GIMP can handle\
    \ RAW but you may also need software as URAW to import them.\n\n## 03 Crop the\
    \ image\nNot essential for every image, but if you weren't shooting with a rule-of-thirds\
    \ approach, you can see if the image would look better with one angle. Click on\
    \ the rectangle select tool and see the Guides to Rule of Thirds.\n\n## 04 Use\
    \ the rule of thirds\nThe rule of thirds is used to position an image in such\
    \ a way that certain aspects of a photo take up a third of the composition. This\
    \ helps to make your photos look more dynamic and draw the eye to particular features\
    \ you want to highlight.\n\n## 05 Remove red eyes\nTweak the levels to remove\
    \ as much red as possible without changing the whole picture. You can refresh\
    \ the selection to larger or smaller to get a better result. It can help to do\
    \ both eyes at once.\n\n## 06 Control red-eye levels\n\n## 07 Vary highlights\
    \ and shadows\nPhotos will have a range of colours at different levels, from higher\
    \ highlights to the darker shadows. You can use the histogram to find and set\
    \ these on a 255-point scale: 0 is the darkest and 255 is the brightest.\n\n##\
    \ 08 Adjust the overall range\nHere you can see that the histogram doesn't cover\
    \ the entire graph. A quick fix, and one that will increase image quality, is\
    \ by dragging the slider until the histogram expands. In this case it makes the\
    \ photo slightly darker but better to pick out some detail.\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_36_1.png)\n\
    \n37 www.linuxux.co.uk\n\n# Tutorial\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_37_0.png)\n\
    \n## 09 Add Auto-Levels\nThere are Auto-Tools that will automatically do basic\
    \ corrections on the photo for you and for some people, this will be all you need\
    \ to enhance your photo. Sometimes though, you might want to do a more level editing\
    \ to ensure maximum quality.\n\n## Use the Eraser to remove the red areas from\
    \ the skin\n\n### 11 Correct skin blemishes\nThere's a big debate going on over\
    \ the industry's use of airbrush to make models perfect. We're not equipped to\
    \ debate that in Linux User & Developer, but we feel it is to have a look at covering\
    \ the odd skin if you need to.\n\n### 13 Set up the image\nGrab the Healing tool\
    \ and zoom in on the picture. Select a patch of skin touch or near the blemishes\
    \ - change the brush size if you need, depending on the size of the photo and\
