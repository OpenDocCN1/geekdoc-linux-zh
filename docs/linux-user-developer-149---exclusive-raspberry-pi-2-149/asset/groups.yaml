    ```\n$ find /bin /usr /usr/bin -exec pacman -Qo {} + /dev/null\n```\n\n**George\
    \ Burton**\n\n如果您的账户支持，您可以使用 ImportQuick，它是免费的。它可以在杂乱的图标中显示邮件数量，并在您鼠标悬停在上面时显示。它还可以获取弹出消息和警报。\n\
    \n否则，如果您使用 KDE，有一个很好的 plasmoid mail-checker 插件，它可以实现类似的效果，因为它同时支持 POP 和 IMAP。\n\
