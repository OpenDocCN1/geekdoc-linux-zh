    但今天，我们有了 SpagoBI 的力量，它可以为你完成繁琐的工作。你可以看到安装步骤，然后学习如何使用 SpagoBI 做出决策。例如，在 Ubuntu
    14.04 上使用 SpagoBI 稳定版本 5.0.0。


