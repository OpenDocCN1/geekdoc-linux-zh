    # 树莓派 2


    # 特写


    为了保护我的客人们不拥有树莓派：

    Xbox 调谐器


    自制的新型微计算机

    它不仅仅是给孩子们的

    它属于每个人

    树莓派 2 已经到来


    # 胜利

    树莓派 2


    bit.ly/1CGPjUE


    ![](img/3d658904c66bbb1691af66259d8c8bf9_16_0.png)


    # 特性


    ![](img/3d658904c66bbb1691af66259d8c8bf9_17_0.png)


    # 有什么新？


    树莓派在首次完整迭代中实现的更改很少，但简而言之，树莓派 2 的亮点如下：


    - BCM2836 四核 800MHz 处理器：基于 BCM2835，这是第一款拥有四核处理器的树莓。

    - 52 KB 专用处理器缓存：更现代的指令集，比 ARMv6- ARM7 有更好的支持以支持树莓派 2。

    - 1GB 内存

    - 更新后的 Debian 操作系统现在带有两个内核，ARM7 支持树莓派 2 和其他树莓派型号。


    正确的，SDRAM 位于树莓派 2 的底部，就在板的模块上。


    # 树莓派塔的巨星


    “这实际上是一个非常窄的过滤器。”Eben 对开发不断扩展的树莓派产品系列的工程和软件团队感到非常自豪。


    我们采访了基金会主任 James Acme，他解释了自己如何在 2013 年初首次参与树莓派项目。“我加入了最初的树莓派。A 和 B 并不是由 Broadcom
    设计的，但当这群人在业余时间做这件事时，我已经在其中了。众周知，他们需要适当的工程资源，所以我们需要招聘一些人员，给他们薪水——正规地经营。他们他们聘用的人员之一——我很早就认识
    Eben 了——我们曾一起在 Broadcom 工作过。


    # 看看树莓派 2 如何测试的


    # 第 26 页


    18 www.linuxuser.co.uk


    # 树莓派 2


    再次彻底改变廉价计算


    # 特写


    ![](img/3d658904c66bbb1691af66259d8c8bf9_18_0.png)


    # 树莓派 2 的人们


    这并非所有为我们带来树莓派 2 而努力工作的人的完整列表，这里是一些在开发中发挥了核心作用的专家及其主要关注领域：


    ![](img/3d658904c66bbb1691af66259d8c8bf9_18_1.png)


    上面的树莓派塔拥有着一些非常友好的面孔。并用树莓派固定一些咖啡容器。


    > 我们采用了旧的 2835 芯片，并将其应用于四核 ARM7 中。


    ![](img/3d658904c66bbb1691af66259d8c8bf9_18_2.png)


    而且我们完成了从芯片设计到电路设计的许多工作，实际上我们还处理了树莓派中的视频编码、3D 图形。由于我设计了 B+、A+、模块和树莓派 2，我们希望整个产品是端到端、更一致的。并尝试解决我们在树莓派上遇到的一些问题。


    到此。根据 James 的说法，这是因为在树莓派 2 中，处理器稍大，并且没有堆叠在它上面的 DRAM，所以背面需要留出空间。


    这是放弃在树莓派+ 以及原始型号 A 和 B 中使用的封装设计 (PoP) 的决定。在树莓派 Zero 中，是将两个或多个封装堆叠在一起——处理器和 SoC
    以及它们之间路由信号的接口。James 说，这仅仅是因为之前卖给客户的就是那样。


    # 为树莓派 2 构建的 B+


    基金会一直在 raspberry.org 上，我们收到了关于人们对什么满意、需要什么以及什么与众不同的反馈。他们做出的会产生影响的决策。例如，他们知道他们想要拥有四个
    USB 端口，由于我们反正要形成新的规格，所以我们询问了 James 关于设计 Model B+ 的决定，以便旧芯片可以放置到新板上。他揭露，他在设计 B+
    时也考虑了树莓派 2。如果你看 B+，板的底部不像树莓派 2 靠近 USB 端口处那样密集，但在 LAN 接口处，而在 Model B 上它几乎在末端。


    这是最好的解决方案——你不仅仅是把芯片粘在一起，两个芯片之间有足够的空间，而永远不会触碰。这意味着你不需要在板上布线，因为……。为什么要改变？“树莓派 2
    的诞生是因为我们采用了旧的 2835 芯片，采用了 ARM6 核心，并将其放入带有更多 ARM 功能的四核 ARM7 中，这是复杂的。而且芯片变大了，所以无法妥善地放入
    PoP 封装中。我们想这样做，但旧的 2835 芯片并不合适。”


    ![](img/3d658904c66bbb1691af66259d8c8bf9_18_3.png)


    - James Acme

    - Dave

    - Eben

    - Paul

    - Chris

    - Ross

    - Eric

    - Phil

    - Simon


    # 特写


    > 我们采用了旧的 2835 芯片，并将其应用于四核 ARM7 中。


    ![](img/3d658904c66bbb1691af66259d8c8bf9_19_0.png)


