    ## First ubuntu phone arrives in Europe


    ### Repurposed Android handset launched by Bq and Canonical


    The first smartphone to feature Canonical''s Ubuntu Touch operating system has
    announced for Europe, coming from Spanish company Bq as a tweaked variant of the
    existing Aquaris E4.5 smartphone.


    While Canonical''s Ubuntu operating system originally launched as a desktop, the
    company has since been looking to diversify. An icon-heavy interface originally
    designed for low-resolution mobile devices has seen several releases, and has
    been split into standard Ubuntu, Ubuntu Touch and Ubuntu for Phone services.


    The focus remains on the company''s work on Ubuntu Edge, for a since-cancelled
    project handset which Android handsets are now achieving instead. The software
    was first delivered as part of Canonical''s work on Ubuntu Edge, an extremely
    high-performance running handset that could connect to external peripherals.


    Canonical, however, had pulled out last year after an attempt to raise $32 million
    to build the device via crowd-funding, falling far from the company''s goals.


    Although Canonical had launch plans, final specifications for the device were
    not available at the time this article was written. They are expected to differ
    from the Android Aquaris E4.5 - a 4.5" IPS display with relatively high 720p resolution
    and featuring five-point capacitive multi-touch support and Gorilla glass, 2GB
    of RAM and a quad-core Cortex-A7 and ARM 500MHz speed-on-chip SoC produced by
    MediaTek.


    Muñoz confirmed that the initial launch will see it available in Spain, Portugal,
    Germany and France, with other European nations to purchase directly from Bq''s
    website. The Ubuntu Software Centre will provide access to both free and paid
    apps, including versions of popular note-taking software Evernote and forecasting
    service. The Weather Channel customised for the device.


    ![](img/3d658904c66bbb1691af66259d8c8bf9_5_0.png)


