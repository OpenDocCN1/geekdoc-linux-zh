    allowing you to open data and the relevant document. To get started, click the
    link in the menu bar.


    ### 10 To finish


    SpagoBI is the first 100% open BI tool, it is also huge in size. It has many natural
    features it would probably take to make a full description of everything in detail.
    Combined with the complex field of data analysis, it is very useful, especially
    if you are a beginner. However, as they say, journey of a thousand miles starts
    with the first step, so do not forget SpagoBI as the stepping stone to get started
    on your journey of data analytics. This will help you understand customer behaviour,
