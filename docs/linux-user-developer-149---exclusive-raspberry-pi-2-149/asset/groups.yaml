    # ROBOT

    Raspberry Pi Camera Robot


    Dawn Robotics'' cheaper and slightly less intimidating robot is a Raspberry Pi-powered
    kit, allowing for a lot of customisation and fun use cases


    In a previous issue we reviewed the Rover 5 Seededuno, a big old robot kit that
    had a lot of potential but a couple of problems with construction. This month
    we''re looking at the Raspberry Pi Camera Robot from the same distributors (Dawn
    Robotics), a slightly cheaper, more reasonable robot that may be less intimidating.
    Check out feature back in issue 132 (available from the Imagine Shop). It uses
    a similar chassis but has massive improvements over the control method of original
    robot, thanks to a mini Arduino that''s been added to the setup. It''s a little
    less DIY but it helps you get a better end result.


    The Raspberry Pi camera bot comes in a couple of configurations depending on your
    budget. The basic kit comes with a chassis - which includes the intimidating wheels
    - the Arduino control board and the cameras pan-and-tilt mount to go on the front
    of the kit. There''s also a lovely little extra: grab a pre-loaded SD card, a
    recommended Wi-Fi adapter, power brick, Raspberry Pi and everything you would
    need to completely build the robot without needing any of your own kit. It''s
    not necessary at all and, it increases the price, but it helps for those of varying
    skill level.


    +   Pros

    Cheap and very little experience required - can be worth the time you take to
    build and play with


    +   Cons

    Instructions could be slightly better written for beginners. Unnecessarily fiddly.
