    ### 07 Add data to the cockpit


    Cockpits provide an interactive way to easily enable data insights. With data
    mashup, you can add enter data or externally sourced data to your cockpit. To
    create a cockpit, go to My Analysis. The new page will have a clean canvas. Add
    widgets to the canvas using the Widget button on the top right. After clicking
    it, you configure the widget with the data you''d like to show. The widget setup
    is roughly the same as data analysis setup in Step 3. You can add as many widgets
    as you please, and then use it for future viewing.


    Location analysis. This interface lets you select the hierarchy, the level of
    integration (with extra charts and values), and the map selector. You can also
    zoom in and out of the map, access legend and do most things possible with other
    graphs.


    SpagoBI is also a GIS engine, which helps you process data. The trick here is
    that you can select the graphic layers that you''d like to see the data. For example,
    you might view your sales data based on population concentration? Wouldn''t it
    be a better idea of the sales quality? Take a look at SpagoBI GIS engine to see
