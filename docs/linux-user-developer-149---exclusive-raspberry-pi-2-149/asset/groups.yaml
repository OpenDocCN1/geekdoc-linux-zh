    虽然 Canonical 的 Ubuntu 操作系统最初作为桌面系统发布，但该公司从那时起寻求多元化。这种最初为低分辨率移动设备设计的以图标为主的界面已经过多次发布，并被分为标准
    Ubuntu、Ubuntu Touch 和 Ubuntu for Phone 服务。


    重点仍然是公司在 Ubuntu Edge 上的工作，这是一个此前已取消的项目手机，而现在 Android 手机已经实现了这一目标。该软件最初作为 Canonical
    Ubuntu Edge 工作的一部分交付的，这是一种可以连接到外部外围的极高性能运行手机。


    然而，Canonical 在去年尝试通过众筹筹集 3200 万美元以制造该设备后，由于远未达到公司目标而已退出了。


    尽管 Canonical 有发布计划，但在本文撰写时，设备的最终规格尚未公布。预计它们将与 Android 版 Aquaris E4.5 不同——后者具有
    4.5 英寸 IPS 显示屏、较高的 720p 分辨率、支持五点电容式触控和康宁玻璃、2GB 内存以及由联发科生产的四核 Cortex-A7 和 ARM 500MHz
    上系统的 SoC。


    Muñoz 确认首次发布将在西班牙、葡萄牙、德国和法国上市，其他欧洲国家可以直接从 Bq 网站购买。Ubuntu 软件中心将提供免费和付费应用，包括热门备记软件
    Evernote 的版本和预报服务，以及为该设备定制的天气频道。


