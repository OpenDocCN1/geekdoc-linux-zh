    # 离线安全 保护你的桌面和其他离线设备免受窥探之苦


    在线安全和防止网络攻击的保护对于大多数人来说是很好的威慑，但除非有人在你的电脑周围窥探，否则你的访问点同样脆弱。


    ## 恶意软件

    Linux 发行版通常比其他操作系统更安全，但它们对病毒并非免疫。在安全方面，键盘记录器和其他软件可能是一个大问题——如果有人知道了你的密码。一个最长 12
    位的无意义密码也可以被轻易地复制并粘贴到密码框中。


    作为基础的安全措施，加密你的账户会让破解此密码变得稍微困难，但仍然可行。请权衡你自己的便利性，制定一个符合你需求的密码，但要使用强模式来确保你的信息安全。


    root 密码不应与普通用户密码相同。在 Linux 中，你应该为 root 账户设置一个完全独立的密码（在终端中），这将允许你更新和更改当前的 root
    密码。


    某些系统还允许你通过 sudo 授予访问权限，使用用户权限进入 root。那么，修改你所管理的所有系统上的 sudo 可能更好，特别是对于这种用场景。


    ![](img/3d658904c66bbb1691af66259d8c8bf9_31_0.png)


    # root 密码不应与用户密码相同


    对于 ClamAV 来说，Linux 上没有真正的恶意软件程序，你能做的最好的事情就是保持警惕。经常检查你的日志和运行的服务，以确保没有安装任何恶意程序。


    ## 保护你的文件

    有了良好的密码，你可以用更高的权限挂载驱动器或文件夹来访问你的文件。以确保的方式存储敏感数据，即使电脑被攻破，只有你能访问文件，除非使用 Encrypt，否则永远无法恢复。Encrypt
    非常简单，所以安装它并没有什么问题。


    选择一个文件以：


