    3D 打印机。我们使用激光切割制造了外壳。所以它非常漂亮，但大规模生产成本是可以接受的。


    到底是什么形成了 PiPanther？

    底盘由四个元素组成：树莓派、PiPanther 主板、两个直流电机、两个齿箱和一个舵机。当你将其插入 USB 集线器时，我们围绕树莓派 A 设计了 PiPanther，因为它更小更便宜，但只有一个
    USB 端口。我们还将电池安装在底盘底部。


