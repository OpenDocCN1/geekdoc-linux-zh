    # 教程


    为方向、分辨率、相对位置等功能创建并编辑自定义多屏配置


    所有显示设置


    ![](img/3d658904c66bbb1691af66259d8c8bf9_47_0.png)


    编辑驱动程序的交互和显示方式，确保它们在出现问题时能够加载


    根据你的意愿在驱动之间切换，无论是选择全源码还是专有驱动


    ![](img/3d658904c66bbb1691af66259d8c8bf9_47_1.png)


    # 安装并配置 Nouveau 驱动


    替代的 Nvidia 驱动是开源的，且对 2D 支持更好。学习如何为你的系统正确安装和配置它。


    # 顾问


    Bob Zetsloot 负责系统建模，是一位精通 Python、Django 和 PHP 的 Web 开发者。他喜欢实验计算。


    # 资源


    Nouveau nouveau.freedesktop.org/wiki


    过去，Lin Torvalds（以及他的手势）对待 Nvidia。他们非常喜欢玩弄 Linux 以及各种发行版不不情愿接受的开源和闭源驱动。


    这就是 Nouveau 的用用场——它是 Nvidia 驱动的开源替代方案，曾被某些发行版取代 Nvidia 使用。设置可能需要一些工作，但对某些人来说，使用它要有效得多。在本教程中，我们将展示如何在不产生任何劣势的情况下使用
    Nouveau。


    目前，Nvidia 承诺提供更开放的驱动，并已为此迈出某些步骤。然而，为了获得真正开源且不同的体验，最好尝试一下 Nouveau，看看它是否适合你。


    # 安装并配置 Nouveau

    从替代的开源 Nvidia 驱动开始

    教程


    ![](img/3d658904c66bbb1691af66259d8c8bf9_48_0.png)


    ## X.Org 服务器 -- Nouveau 显示驱动

    xserver-xorg-video-nouveau

    ★★★ (7 条评论)


    ### 已安装

    此用于 X.Org 服务器的驱动程序（更多描述请参见 xserver-xorg）支持 NVIDIA Riva、TNT、GeForce 和 Quadro 显。


    此包提供了 2D 支持，包括 EXA 加速、X 和 RandR。3D 功能由 libgl1-mesa-dri 包提供。


    此包由 FreeDesktop.x86-video-nouveau 驱动程序构建。


    开发者网站


    - 01 访问受限驱动程序

    在 Ubuntu 中，你可以打开“附加驱动”窗口来在驱动之间进行切换。如果你正在使用专有驱动之一，可能可以在重启系统后切换到 Nouveau 驱动。


    - 02 安装 Nouveau

    如果找不到它，你可以手动安装。可以从 Ubuntu 软件中心或 xserver-xorg-video-nouveau 安装，或者从命令行手动安装：


    ```

    sudo apt-get install xserver-xorg-video-nouveau

    ```


    - 03 设置为 Nouveau

    现在你可以通过返回“附加驱动”菜单并寻找 xserver-xorg 选项来激活 Nouveau。你也可以在终端中执行：


    ```

    sudo dpkg-reconfigure xserver-xorg

    ```


    - 04 移除 Nvidia 驱动

    虽然你不需要这样做，但 Nouveau 驱动可以帮助清理你的系统。在安装 Nouveau 后在终端中执行，或在安装 Nouveau 之前从命令行界面执行：


    ```

    sudo apt-get purge nvidia

    ```


    - 05 移除黑名单

    如果你没有安装，可能是该模块被系统黑名单了，打开包含以下行的相关黑名单文件：


    ```

    # /etc/modprobe.d/nouveau.blacklist.conf

    ```


