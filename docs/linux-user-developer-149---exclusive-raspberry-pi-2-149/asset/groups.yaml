  mdcn: "\n\n# PI 2 揭秘\n17 小时视频内容\n外加 4 种发行版、16 个开源软件包及教程资源\n\nwww.linuxuser.co.uk\n\
    \n# LinuxUser\n\n# 独家与开发者专属\n\n# 树莓派 2\n\n## 如何迁移到 PI 2\nEBEN UPTON 访谈\n## 实战评测\n\
    \n![](img/3d658904c66bbb1691af66259d8c8bf9_0_0.png)\n\n# 赢得树莓派 2\n\n# 42 页指南\n\
    \n- >> 从命令行(CLI)更快速地管理你的文件\n>> 为 Nvidia 配置 Nouveau 驱动\n>> 构建 Cactus 插件以监控流量\n\n\
    - 内页同样精彩\n>> 使用 GIMP 修饰照片\n>> Ras Pi Camera 机器人评测\n>> 4 大最佳财务管理器测试\n\n# 全方位 Linux\
    \ 安全\n保护你的系统免受恶意软件攻击并确保数据安全\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_1_0.png)\n\
    \n# 《上世纪量子》\n\n来自《矩阵》三部曲创作者打造\n2 月 6 日全球院线映\nwww.warnerbros.co.uk/jupiterascending\n\
    \n# 群晖科技 (Synology)\n\n# 赢取\n\n携手群晖与《上世纪量子》\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_1_1.png)\n\
    \n# DS415 play\n\n四位 NAS 服务器，具备视频转码功能，确保无损品质\n\n存储和保护电影、音乐、照片和电视节目的完美之处。\n\n为了庆祝《上世纪量子》上映（2\
    \ 月 6 日院线），群晖为您提供了一个机会赢取这套家庭娱乐系统，其中包括一台群晖 DS415play、48 英寸曲面 LED HD 3D 智能电视、智能\
    \ 3D 蓝光播放器和回音声箱。欲获得获奖机会，请访问：\n\nwww.synology.com/jupiterascending\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_1_2.png)\n\
    \n# 欢迎\n# 订阅 Linux User & Developer 第 149 期\n\n# 每期都让 Linux User 更加便宜 第 34 页\n\
    \n**Bob Zwetloot** 曾使用 Python 进行复杂的模拟研究。在他不在期间，Rob 在本月带来了许多新功能，包括一张艺术图表（第 30 页）、关于内核的\
    \ L&U 专栏以及一个新的机器人项目（第 38 页）。他离开时空无一物，只有\n\n- > 树莓派 2 揭秘\n>> Midnight Commander\
    \ 指南\n>> 保护你的网络和账户\n>> 仅使用我们的管理器寻找公钥\n\n**Jon Masters** 是一位深耕 Linux 19 年的内核黑客，他最初就读于马萨诸塞州大学剑桥分校区，目前为企业级\
    \ Linux User 杂志工作。你可以在第 19 页看到他精彩的专栏。\n\n欢迎阅读《Linux User & Developer》最新期，这是英国和美国最喜爱的杂志。\n\
    \n**Richard Sydney** 在 WYSIWYG 出现很久就开始使用电脑，并从数学开始。他是最高效的作家，他的专栏是开放的——Richard 介绍了他最喜欢的\
    \ L&U 生产力工具（第 30 页）。\n\n哇，真是一个极佳的惊喜！当我们收到树莓派基金会的电话说他们新款发布时，我们非常兴奋，迫不及待想去剑桥了解更多信息。我只能说它比\
    \ B+ 强大了六倍，并且完全向后兼容——详情请参阅第 16 页。而且由于我们知道你们非常热爱慈善，我们将把几个全新的树莓派 2 送给你们这几位可爱的朋友。\n\
    \n**Mihalis Toukalos** 是一位 Linux 系统管理员，专长 C 语言以外的编程、数据库和数学。他自 1993 年以来一直使用 Linux。在本中，Mihalis\
    \ 讨论了 Co-rt，解释了如何构建自定义插件（第 36 页），并展示了如何防止（第 52 页）。\n\n本月 Linux 的其他部分，我们还有许多非常实用的指南可以阅读，包括使用\
    \ Nouveau 加速 NVIDIA 专用驱动、为跟踪和 UDP 连接创建自定义插件、家庭和办公室最佳软件汇总、GPU 指南等。此外，我们还对新的 Linux\
    \ 功能如何保护你的隐私进行了评测（请查阅第 28 页）。也值得提前翻到第 82 页，看看我们的专家 Gareth Weaver 对 Keybase 的看法，这是一种适应我们使用\
    \ GPG 加密方式的创新软件——它绝对值得关注。副主编Gavin Thomas。\n\n**Christian Family** 一位自 2010 年以来的软件工程师和支持人员，一直在在线和杂志上为\
    \ Linux 和智能手机用户撰写文章。他描述了提升 Linux 性能的多个步骤，在本期中，最后是对处理器进行超频（第 58 页）。\n\n**Gareth\
    \ Halifax** 一位常驻记者，报道来自开源世界各地的最新进展，从第 6 页开始。在本期中，Gareth 详细讲解了 GPG 加密领域令人兴奋的进展，这让寻找和发布公钥变得更加简单（第\
    \ 92 页）。\n\n# 与团队联系：linuxuser@imagine-public.com\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_2_0.png)\n\
    \n访问我们的网站获取更多新闻、观点、教程和评测：\n\nwww.linuxuser.co.uk\n\n第 149 期\n\n# LinuxUser & Developer\n\
    # 赢取\n# 树莓派 2\n# 订阅并省钱！34 页\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_3.png)\n\
    \n# 内容\n\n## 16 树莓派 2 独家\n## 功能\n- 77 用户管理\n## 评测\n- 06 新闻\n## 教程\n- 36 使用 GIMP\n\
    ## 专栏\n- 40 使用 Midnight Command\n- 82 Keybase\n- 84 树莓派相机\n- 16 树莓派 2 独家\n- 28\
    \ 全方位 Linux 安全\n- 56 使用自定义插件\n\n> 树莓派的必备指南\n> 针对开发者\n> PCI Express \n\nLinuxHilo.co.uk\n\
    \n# 问答\n- 96 免费下载\n- 61 树莓派实用\n- 48 安装\n- 44 我们的专栏\n- 34 订阅\n- 31 订阅\n- 12 专栏\n\
    - 10 使用 Linux\n\n# 群晖科技 (Synology)\n\n# 赢取\n\n# 介绍 MOI+ & MOI PRO\n\nTBS 英国经销商\n\
    \n授权在线销商\n\n"
