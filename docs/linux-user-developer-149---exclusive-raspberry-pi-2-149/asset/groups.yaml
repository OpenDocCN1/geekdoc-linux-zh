    完成后，你就可以在系统上设置加密位置了。打开终端并输入：


    ## KEEPPASS


    虽然 LessPass 对你的账户很有用，但请为系统上的应用和软件使用免费密码管理器。KeepPass 很好用，因为它还允许你使用用户名、附件和剪贴板项目加密文件。这是一个你只有拥有权限时才能访问的数据库，因为它是加密的。在处于
    Alpha 阶段时，许多 Linux 用户已经对其系统和工作流的质量非常满意。


    ## $ encfs - /private


    这将在你的目录下创建一个 ''encrypted'' 文件夹，其中包含所有文件，然后是另一个挂载后即可访问的 ''private'' 文件夹。处理得到的这部分内容对大多数人来说已经足够了。现在，当
    KeepPass 卸载时，你无法直接从 encrypted 文件夹访问加密文件。当卸载后，文件将再次变为加密；记得在之后卸载。


