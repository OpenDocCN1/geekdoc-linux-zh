    # ## X.Org server -- Nouveau display driver

    xserver-xorg-video-nouveau

    ★★★ (7 reviews)


    ### Installed

    This driver for X.Org server (see xserver-xorg for a further description) provides
    support for NVIDIA Riva, TNT, GeForce, and Quadro cards.

    This package provides 2D support including EXA acceleration, X and RandR. 3D functionality
    is provided by the libgl1-mesa-dri package.

    This package is built from the FreeDesktop.x86-video-nouveau driver.


    Developer Web Site


    +   01 Access restricted drivers

    In Ubuntu, you can open the Additional Drivers window to switch between drivers.
    If you''re using one of the proprietary drivers, you may be able to switch to
    the Nouveau driver after restarting your system.


    +   02 Install Nouveau

    If you can''t find it, you may install it manually. From the software centre Ubuntu
    or xserver-xorg-video-nouveau, or install manually from the command line:


    ```

    sudo apt-get install xserver-xorg-video-nouveau

    ```


    +   03 Set to Nouveau

    Now you can activate Nouveau by going back to the Additional Drivers menu and
    looking for the xserver-xorg option. You can also do it in the terminal:


    ```

    sudo dpkg-reconfigure xserver-xorg

    ```


    +   04 Remove Nvidia drivers

    Although you don''t need to do this, Nouveau drivers can help clean up your system.
    Do this in the terminal once Nouveau is installed or just from a command line
    interface before installing Nouveau:


    ```

    sudo apt-get purge nvidia

    ```


    +   05 Remove blacklist

    If you''re not installing, it''s possible that the module may be blacklisted by
    the system, open the relevant blacklist file with the following line:


    ```

    # /etc/modprobe.d/nouveau.blacklist.conf

    ```


    And comment out Nouveau with a hash or crunch.


    +   06 Custom org

    If it''s not already loaded then making a custom boot profile for the Nouveau
    driver, will make X load it instead of the preset Nvidia driver. Go into the terminal
    and create a new conf file using:


    ```

    # /etc/X11/xorg.conf/20-nouveau.conf

    ```


    +   07 Make a custom profile

    In the new file, edit the following before saving:


    Section "Device"

    Identifier "Nvidia Card"

    xserver-xorg-video-nouveau

    EndSection


    +   08 Test Nouveau without reboot

    If you are making these custom profiles, you can change the settings without performing
    a reboot by using the following commands:


    ```

    sudo rmmod nvidia

    sudo modprobe nouveau

    ```


    You can check if they have loaded using "dmesg" in the terminal.


