    need to learn all about DDBMS SQL syntax. So, I got the code for sqlite3-0.9991,
    configured, built and installed. It added the README file''s suggestions to /etc/odbc
    and odbc.ini. When I tried to connect to it it didn''t work because I couldn''t
    find libsqlite3odbc. So enough, I''ve worked with both ODBC or ODBC and have a
    preference for one over the other. What I need is assistance getting one or the
    other installed and working. Suggestions and advice appreciated.


    Hi Richard! There is actually a fairly easy thing to fix: when building v3 of
