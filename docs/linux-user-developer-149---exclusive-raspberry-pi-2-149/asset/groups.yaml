- md: "\n# Tutorial\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_63_0.png)\n\n# What\
    \ you'll need\n\n- Raspberry Pi\n- Breadboard\n- Male-to-female jumper cables\n\
    - LEDs (1 red, 1 yellow, 1 green)\n- 3 x 330 Ohm resistors\n\n# Simulate traffic\
    \ lights using breadboard\n\nStep into physical computing and hardware engineering\
    \ with Raspberry Pi and this breadboard-based traffic light simulation.\n\nEven\
    \ with a platform as cheap, simple and powerful as the Raspberry Pi, taking your\
    \ first foray into the world of physical computing and hardware experience can\
    \ be a daunting prospect. But physical computing is perhaps the most rewarding\
    \ way to experiment and manipulate tangible items in the physical world with the\
    \ power of code.\n\n## 01 Get the parts\nThe parts required for this tutorial\
    \ should all be available from reputable electronics dealers like Merlin, MPC\
    \ or from the many Raspberry Pi retailers. Breadboards, LEDs, and resistors should\
    \ cost you around $10-20.\n\n## 02 Update your Pi\nBefore starting any project,\
    \ regardless of whether it is hardware or software, you should always update your\
    \ Raspberry Pi to ensure you have the most stable version and functionality. This\
    \ is especially important when working with GPIO. You can do this using the following\
    \ commands:\n\n```\nsudo apt-get update\nsudo apt-get upgrade\n```\n\nAaron Shaw\
    \ The Member at The Magazine (linuxuser.com) and has been involved with Raspberry\
    \ Pi since the start, finding it lucky enough to use it Pi for work and for life!\n\
    \nOne of the best ways to make use of GPIO is to get really creative with your\
    \ Pi later on is a simple LED command. Let's get started!\n\n# Simulate traffic\
    \ lights\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_64_0.png)\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_64_1.png)\n\
    \n## 04 Prepare the hardware\n\nTo build and test a simple circuit to ensure everything\
    \ is correct, grab the breadboard, jumper wires, led, 330 ohm resistor and Raspberry\
    \ Pi, and connect everything together as in the above image. Ensure your Raspberry\
    \ is powered off before connecting things to the GPIO to avoid damage.\n\n## 06\
    \ Add more code\n\nIn order to simulate a real block of traffic lights, we need\
    \ to run through a sequence of codes. The code below achieves this and then we've\
    \ uploaded it to FileSite.com so you can understand what it is doing. In step\
    \ 4, you will need to add this to a Python script to execute, calling it \"trafficlight.py\"\
    \ instead of \"test.py\" as before.\n\nThe code below is a simple script to test\
    \ that the connection is correct and the LED is working. Creating the file by\
    \ typing nano test.py in the command line and then writing in the code below the\
    \ script using Ctrl-X and then Y and Enter you can then execute the script by\
