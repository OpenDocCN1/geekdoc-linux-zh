    # Feature


    > We''ve upped the Megahertz,

    youve got four cores and its got

    half a Meg of dedicated cache.

    You have also got double RAM


    ![](img/3d658904c66bbb1691af66259d8c8bf9_19_0.png)


    The new BCM2835 processor is, of course, the defining element of the Pi – it''s
    this chip that''s boosting the Raspberry Pi''s power by a factor of six. We asked
    how much of its design was custom and how much was based on its predecessor: “It''s
    very much based on the 2835,” he replied Gordon Stroud. When I joined, there was
    talk about what to do with the next Pi, but not the current Pi. The Raspberry
    Pi is this $35 form – we wanted a chip that would be better but also made the
    same, and the way to do that was to design our own chip. Our works for Broadcom
    and the deal with Broadcom was that we put up some resource, which in Broadcom
    became this chip, so I joined for nine months for constructing basically. We reinvented
    the design – took the old chip, worked on it for six months, we tested it, we
    built it, and now we''ve got products based on it. You don''t normally do chips
    this way, it''s a bit of an interesting one.


    Upgrading to ARM7

    All the previous Pi models have been based on the ARM6 instruction set, so what
    was the motivation for the upgrade? James told us that the set is really important
    because a lot of people don''t really think about it. We were all focused on ARM6
    and now ARM7. For example, they didn''t have native ARM7 – they were a bit of
    an issue because we didn''t get an off-shelf distribution – which was a great
    win for us. With the Megahertz, you''ve got four cores and it''s got half a Meg
    of dedicated cache for the processor, more power, more speed. We also got double
    RAM. So this is a very useful little desktop machine now. Regarding the Megahertz,
    the official documentation record says it''s a quad-core processor, but in their
    tests the Foundation''s engineering team actually got results that were reaching
    900MHz.


    ![](img/3d658904c66bbb1691af66259d8c8bf9_19_1.png)


    With the extra horsepower, you''d find that the draw of Raspberry Pi 2 would be
    significantly higher than the Model B+ James assured, but that is not the case.
    "We''re consuming less power, although in extreme scenarios it can draw quite
    a bit more, because we have a bigger silicon chip containing it. On the flip side
    this is now non-PoP – there''s more solder holding the physical chip – so the
    heat is dissipated better. We didn''t see any real difference, though. You might
    see some higher peak current draws but it''s within the envelope of the B+


