    # Resources


    Nouveau nouveau.freedesktop.org/wiki


    In the past, Lin Torvalds (and hand gestures) for Nvidia. They''ve really liked
    to play with the Linux and open source up-free, close source drivers that the
    various distros grudgingly accept.


    This is where Nouveau comes in - an open source alternative to the Nvidia drivers
    and at one time used by some distro instead of Nvidia. Setting up can take a bit
    of work but for some people it is far more effective to use. Over the course of
    this tutorial, we show how you can use Nouveau without disadvantage.


    Right now, Nvidia is promising a more open driver and has taken some steps towards
    it. However, for a truly open and different experience, it''s best to try out
    Nouveau to see if it''s for you.


    # Install and configure Nouveau

    Start with the alternate, open source Nvidia driver

    TUTORIAL


    ![](img/3d658904c66bbb1691af66259d8c8bf9_48_0.png)


    ## X.Org server -- Nouveau display driver

    xserver-xorg-video-nouveau

    ★★★ (7 reviews)


    ### Installed

    This driver for X.Org server (see xserver-xorg for a further description) provides
    support for NVIDIA Riva, TNT, GeForce, and Quadro cards.


    This package provides 2D support including EXA acceleration, X and RandR. 3D functionality
    is provided by the libgl1-mesa-dri package.


    This package is built from the FreeDesktop.x86-video-nouveau driver.


    Developer Web Site


    - 01 Access restricted drivers

    In Ubuntu, you can open the Additional Drivers window to switch between drivers.
    If you''re using one of the proprietary drivers, you may be able to switch to
    the Nouveau driver after restarting your system.


    - 02 Install Nouveau

    If you can''t find it, you may install it manually. From the software centre Ubuntu
    or xserver-xorg-video-nouveau, or install manually from the command line:


    ```

    sudo apt-get install xserver-xorg-video-nouveau

    ```


    - 03 Set to Nouveau

    Now you can activate Nouveau by going back to the Additional Drivers menu and
    looking for the xserver-xorg option. You can also do it in the terminal:


    ```

    sudo dpkg-reconfigure xserver-xorg

    ```


    - 04 Remove Nvidia drivers

    Although you don''t need to do this, Nouveau drivers can help clean up your system.
    Do this in the terminal once Nouveau is installed or just from a command line
    interface before installing Nouveau:


    ```

    sudo apt-get purge nvidia

    ```


    - 05 Remove blacklist

    If you''re not installing, it''s possible that the module may be blacklisted by
    the system, open the relevant blacklist file with the following line:


    ```

    # /etc/modprobe.d/nouveau.blacklist.conf

    ```


    And comment out Nouveau with a hash or crunch.


    - 06 Custom org

    If it''s not already loaded then making a custom boot profile for the Nouveau
    driver, will make X load it instead of the preset Nvidia driver. Go into the terminal
    and create a new conf file using:


    ```

    # /etc/X11/xorg.conf/20-nouveau.conf

    ```


    - 07 Make a custom profile

    In the new file, edit the following before saving:


    ```

    Section "Device"

    Identifier "Nvidia Card"

    xserver-xorg-video-nouveau

    EndSection

    ```


    - 08 Test Nouveau without reboot

    If you are making these custom profiles, you can change the settings without performing
    a reboot by using the following commands:


    ```

    sudo rmmod nvidia

    sudo modprobe nouveau

    ```


    You can check if they have loaded using "dmesg" in the terminal.


    # Tutorial


    ![](img/3d658904c66bbb1691af66259d8c8bf9_49_0.png)


    > Reboot your desktop

    Although the last step is good for servers, if you''re on a desktop then now is
    an excellent time to reboot so the kernel loads and boots the modules. You can
    also make sure everything is working in the process.


    Resolution and scale

    Modern Ubuntu and some other distros allow you to use Nouveau which graphical
    driver already exists in the settings. Resolution, orientation and dual-screens
    are normally all there; however do do them if you need to.


    Back your desktop

    A tool, for fixing display output, can be used with Nouveau to create a fixed
    profile that can be changed later. We need to add it to the profile we have created
    earlier in /etc/x11/xorg.conf.d/nouveau.conf. Open that in a terminal.


    # It''s worth making a custom boot profile for the Nouveau driver


    Add a monitor

    For single monitors you may need to add a custom monitor profile like:


    Add a second monitor

    Whatever we did in the first step will be the primary monitor. To add a second
    monitor you do a similar profile but with another option for where it''s positioned:


    ```

    Section "Monitor"

    Identifier "Monitor name"

    Option "PreferredMode" "1920x1080,60.00"

    EndSection

    ```


    ```

    Section "Monitor"

    Identifier "Second monitor"

    Option "PreferredMode" "1920x1080,60.00"

    Option "RightOf "Monitor name"

    EndSection

    ```


    This sets the monitor of a specific name (find it using xrandr -q) to have a 1920
    x1280 resolution and refresh rate of 60 Hz.


