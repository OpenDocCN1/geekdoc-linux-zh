    ## 特性


    ## 新显示模块


    当我们调查最近关于树莓派塔（Pi Towers）的科技时，我们了解到了一些正在开发中的产品——其中包括树莓派模块。我们发现其中一种是为 MIPI 接口器设计的，这样适配板就可以安装在树莓派下方，将屏幕放置在适配板上方，你就可以将整个套设备放入外壳或其他项目中。


    我们已经注意到 MIPI 接口器有一段时间了。“这些接口器每个成本只需要几便士——如果生产 450 万个，它们就免费了。有了这个接口器并使用它，我们有了极大的动力去这样做。”


    树莓派模块自然而也会是市面上最好的显示器之一。“它是一个宽屏 VGA，分辨率为 800x480，而且视角非常好。廉价显示器的问题之一是，你可以通过旋转或调整平板电脑来获得最佳视角，但如果你有的是那种设备，你就无法控制视角了。因此，你需要一个具有良好视角的设备。”


    我们也从正面听过关于它的消息。我们实际上正准备好第一批适配板产品——这样在 Pi 2 产品到达之前……


    ![](img/3d658904c66bbb1691af66259d8c8bf9_21_0.png)


    我们还确认了树莓派 2 将完全兼容，并用于你已经设置好的现有项目中：“你需要一个 v7 内核，足够了，”Ellis 解释道，“对于提前三个或四个月的 2836，你甚至不需要为了发布新的操作系统。”（我们对此挑起了眉毛）“使用
    B 版本的内核，可以仅将其放入固件中——它最近一直在运行。它实际上与内核配合得很好，完全可以毫无问题地获取，无论速度多快，它就那样呆在那儿。”


    与其让内核去适应操作系统，使用两个 v7 内核，启动 Raspian 会检测检测使用的是 Pi 2 还是旧款树莓派，然后运行相应的内核——这意味着我们不需要两个版本的
    Raspian 来适应 Pi 2 及其前代产品的不同需求。除了这些之外，Ellis 告诉我们应该注意到 Raspian 设计上的一个真正改进：“所有开源软件包对所有用户都是兼容的，将旧配置留存在配置文件中，可以在不进行任何配置的情况下进行切换。这真的关乎于移除某些内容——并让运行得更加一致。你窗口框的高度是匹配的——表单颜色保持相同。线条涵盖了你输入的所有细节，这就是为什么随着工程师数量的增加，我们能够做到。”


