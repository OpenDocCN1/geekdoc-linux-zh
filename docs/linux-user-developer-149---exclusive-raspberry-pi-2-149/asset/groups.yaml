    # 新闻

    Linux 社区最新动态


    ## 开源


    ## 开源硬件


    ## 自由笔记本电脑 Librem 15 众筹成功


    生产资金已筹集 250,000 美元


    一家新公司发布了名为 Librem 15 的笔记本电脑，旨在遵循自由、开源 (FLOSS) 伦理。


    这款笔记本是 Todd Weaver 创立 Purism 公司的心血，Librem 15 声称使用了特制的硬件，能够在 Linux 内核不包含闭源和二进制大块（binary
    blobs）的情况下运行。虽然设备的某些部分（包括 CoreBoot BIOS 和组件）处于锁定状态，但 Weaver 表示他将“继续向上游推动”，以实现这些部分的
    FLOSS 化。


    电池续航时间长达八小时，并预装了由 Purism 创建并基于 Trisquel 的 64 位 GNU/Linux 发行版。


    Librem 15 的“早鸟”购买价格为 1,449 美元，随着众筹奖励的履行，标准价格将升至 1,899 美元。Purism 承诺将推出 13 英寸的超便携版本。


    撰稿时，Purism 15 的众筹金额已超过其 250,000 美元目标 10,000 美元，还剩 9 天。


    该系统基于四核 Intel i7-4770HQ 处理器，配备 Iris Pro Graphics 5200 GPU，基础配置配有 4GB 内存。此外，Purism
    15 声称内核中没有任何二进制大块。


    ## 开发


    ## Linus Torvalds 反对并行化


    ![](img/3d658904c66bbb1691af66259d8c8bf9_8_0.png)


    Linus 证明了他对“并行化伪科学”并不感冒。


    > 我们的 24/7 支持是您的安全保障


    Linus Torvalds 以他一贯的直率风格，对他所谓的“并行化伪科学”发表了了。在 Joni Osmala 的一封邮件列表评论中，他指出多核处理器的软件开发应该有所重点，并引用道：“世界的并行化正在浪费每个人的大量时间，它是常见且没有必要的。”


    “存在大量的‘知识’认为并行化比（串行）处理更高效，而这整套理论完全是垃圾。没有缓存的小核心并行化，除非是为了某些非常特定的、幸运地很规则的任务，如图形处理……”


    在告诉 Deming 这一点时，Torvalds 声称“原子对于核心数量级的粗糙度是可以接受的”。然而，Torvalds 的公开客户关注人们对当前多核架构日益增长的兴趣。多核
    ARM 芯片开始对数据中心产生影响，像 Adaptiva 的 Epiphany 这样高度并行的架构采用率正在增加。


    还有谁能在 15 分钟内给出回应？


    我们为 PostgreSQL 用户提供无与伦比的24 小时支持。铂级支持让您无忧。


    ![](img/3d658904c66bbb1691af66259d8c8bf9_8_1.png)


    ![](img/3d658904c66bbb1691af66259d8c8bf9_8_2.png)


    ## 开源

    您的 Linux 新闻与观点来源


    ## 自由源专栏


    ### 牵引


    GCC 促进了 Linux 和其他自由操作系统的移植性。如果它可以被移植性插件访问，那么我们可能就没有 Linux 来在他原始的 386 上运行内核了；但因为它是可移植的，且
    Linux（以及 BSD 系列）可以跨处理器移植到各种架构，所以 Linux 是可移植的，因为 GCC 也是：GCC 支持任何处理器、可以在该处理器上用 GCC
    编译的代码、以及许可证的左版拷贝（copyleft）性质。GCC 帮助了 Linux 和其他操作系统的移植性，如果 GCC 是模块化且可扩展的，这可能就不会发生。这是
    Richard 论点的核心：GCC 应该是务实的。


    GCC 的工作非常简单——将源代码转换为机器可理解且易于执行的格式。GCC 通过一系列过程处理代码，前端和后端是不同的。前端将编程语言翻译成可表示的形式，后端将这些代码转换为机器码。


    Richard Stallman 写了关于艺术、音乐、数字权利和软件的文章。在一个理想的世界里（一切都是自由的）GCC……如果代码是透明的、模块化且可扩展的，那么开源社区的……


    Stallman 经常因其封闭性和理想主义受到批评，但人们认为这是历史。我们可能喜欢一种模块化的方法，让自由软件……如果代码是透明的、模块化且可扩展的插件……


    最近，关于 GCC 的话题以及 Richard Stallman 对插件实现的抵制是由 Ellis 的论点引发的：“明确一点，防止任何程度是不可能的，而且实现那些尚未在
    Linux/Unix 上实现的价值……”


    Stallman 仍然保持他的固执。因为自由软件的历史充满了……

    '
