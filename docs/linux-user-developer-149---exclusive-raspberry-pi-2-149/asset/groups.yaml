    ![](img/3d658904c66bbb1691af66259d8c8bf9_78_0.png)


    ![](img/3d658904c66bbb1691af66259d8c8bf9_78_1.png)


    The undo/redo tools still work after closing and reopening


    Once configured you''ll find your accounts, payees and so on easier to use


    # Usability


    There''s no double-entry to worry about, while it''s less powerful, logging transactions
    is easy. There are some brilliant innovations too, like undo and redo which preserve
    their full history between sessions. You can use bookmarks, adapt custom properties
    and create custom alarms.


    # Usability


    It takes time to get started with HomeBank, as before you any transactions, you
    need to manually set your accounts, payees, categories, automatic importing, scheduled
    transactions and budget. Once that''s done, you''ll find recording your income
    and expenditure is a cinch. Everything is focused on clarity.


    # Home budgeting


    Its simplicity makes this perfect for personal money management. There''s little
    clutter to the menus, interfaces and displays—good if you don''t need the advanced
    features. The dashboard is detailed, showing you your current and previous months''
    income and expenditure. You can also search for transactions.


    # Home budgeting


    As well as being to record high transactions as a result of the initial setup,
    the main interface shows a segmented pie chart to the right that automatically
    updates with your transactions as you record your top categories (with a drop-down
    to customise the them).


    # Accounting tools


    Minimal than other tools—playing its strength as a quick tool for everyday use.
    Monthly reports (auto-generated, visual summaries) and a basic-cares report (no
    template), scheduled import import all accounting tools.


    # Accounting tools


    There''s nothing here in terms of proper accounting. The latest reports is showing
    you trends, amounts and statistics over time, so there''s not even a Profit &
    Loss statement. That said, the basic reporting gives you clarity—the structure
    and design choices.


    # Compatibility


    QF and CSV files can be imported into Skrooge using clean import, and you can
    also import from a range of other finance softwares including all the others in
    this group. A nice feature is being able to manage duplicated transactions through
    the contextual menu when you''ve imported data manually.


    # Compatibility


    You can import QF and QKF files into your specific format (which you can read
    up on the device). Again, the interface shines through with the importing wizard,
    especially in terms of the information being displayed, but it''s not quite opt-rich
    for some of the others in this test


    # Overall


    Skrooge completely falls in the pro department, but then again it''s little unlike
    here that''s not your focus. If you''re just looking to track and budget your
    expenses, this is highly recommended.


    # Overall


    We like HomeBank. It''s a little different because of the setup process, which
    can quite length for a lot of accounts, payees, and there is no way to import
    defaults—but that pays off.'
