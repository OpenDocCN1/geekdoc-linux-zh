    ## 专题裸谈


    ## 全方位在线隐私


    作为本期安全功能的序篇，我们上个月在 Reddit 上分享了关于在线隐私的指南，并引发了一些有趣的评论。欢迎 reddit/r/2mm9 加入讨论。


    **gutgien**

    - 完全认为浏览器选择很重要，没问题。如果你使用 Chrome 或其他私有浏览器——你的隐私面临着风险……


    **hatpageeree**

    - 完全不完整的隐私指南。


    **Vegetano**

    - 然而，Chrome 是目前最难被攻破的浏览器。


    **gutgien**

    - 我认为将我的个人数据并卖给最高出价者（政府）视为一个开放市场。


    **Sigg3nat**

    - 你提出了安全中最重要的的一点——一旦你交出数据，它就消失了。但不要忘记除了技术之外，我们必须保护自己的隐私。大多数政策取决于我们。


    **hatpageeree**

    - 我们必须保护我们的政客。听起来很容易。


    **Sigg3nat**

    - 我没说容易。一个复杂的世界意味着经济脱离了意识形态，这带来了许多好处。然而，只要代理及其利益实体实行一种假设资源无限的现代生产模式。我们需要知道这个保护系统的补救，但任何人都能看出它在于……


    **RealFreedomAusd**

    - 安全领域的实践是假设任何系统**始终**可能被破解。那些人永远不会有虚假的安全感。开源硬件会帮助我们，或者其他人可能拥有完全的隐私。


    他们可能会说“我已经足够隐私了，我觉得不值得冒使用 XYZ 通信的风险，而且并不完全隐私”，你应该信任自己，除非你从未拥有权力。


    跟随他人的做法会让一个国家很难信任我们，除非你位于特定的地点。


    隐私（以及泛指的浏览器）并不是加密私有的。


    我很确定加密，但如果破解它需要数百万年才能达到足够坚固的，那么攻击者执行成功攻击的可行性有多少？在我看来，这种自由可以改进到重要的程度。


    加密算法不是唯一的攻击向量。它可以真的、真的非常如此。


