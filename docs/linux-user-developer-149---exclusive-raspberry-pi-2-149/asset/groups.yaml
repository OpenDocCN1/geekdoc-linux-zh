    色温等。


    虽然 Photoshop 可能是一个极其

    强大的编辑工具，但 GIMP 在该领域绝毫不逊色。

    它几乎拥有你在 Photoshop 中可以获得的每一个功能，甚至某些功能还更好，对于为你的任何照片创建出佳效果来说绝对绰绰有余。


