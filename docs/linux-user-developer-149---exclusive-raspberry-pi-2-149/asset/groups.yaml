  - "[PAGE 53]\n\n# LinuxDeveloper\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_53_0.png)\n\
    \n# 06 Add titles and labels\n\nSooner or later, it's likely that you will want\
    \ to add a title and labels to the output. Adding a main title is simple – you\
    \ just need to make use of the labels (axis) function in order to do so. The previously\
    \ plotted bar plot can be modified with inclusion of the following command at\
    \ the end:\n\n```\n> ggplot(LID, aes(x=RAM, y=SSD, fill=identity)) + geom_bar(stat='identity')\
    \ + labs(title=\"This is a Title\")\n```\n\nAdding X and Y labels can be done\
    \ by entering the following:\n\n```\n> ggplot(LID, aes(x=RAM, y=SSD)) + geom_bar(stat='identity')\
    \ + labs(title=\"This is a Title\") + xlab(label=\"X\") + ylab(label=\"Y\") +\
    \ element_text(size=2, color=\"blue\")\n```\n\n# 07 More about titles and labels\n\
    \nAs well as that, you can also change the appearance, size, and color of all\
    \ the labels. The following command will make the title and its size larger using\
    \ the following method:\n\n```\n> ggplot(LID, aes(x=RAM, y=SSD)) + geom_bar(stat='identity')\
    \ + labs(title=\"This is a Title\") + xlab(label=\"X\") + ylab(label=\"Y\") +\
    \ element_text(size=2, color=\"blue\"), axis.line=element_line(size=3)\n```\n\n\
    To change the attributes of the X and Y axes, use the following function:\n\n\
    ```\n> ggplot(LID, aes(x=RAM, y=SSD)) + geom_bar(stat='identity') + labs(title=\"\
    This is a Title\") + xlab(label=\"X\") + ylab(label=\"Y\") + element_text(size=2,\
    \ color=\"red\")\n```\n\n# 08 Create histograms\n\nGenerate histograms using the\
    \ geom_histogram() function, similar to the geom_bar() function, and change the\
    \ number of bars by the bin argument using the following command:\n\n```\n> ggplot(LID,\
    \ aes(aes)) + geom_histogram(binwidth=1, color=\"gray\")\n```\n\nUsing the geom_density()\
    \ function you draw a density plot:\n\nTo draw both a histogram and a density\
    \ plot on the same plot:\n\n```\n> ggplot(LID, aes(aes)) + geom_histogram(binwidth=2,\
    \ color=\"white\") + geom_density(binwidth=2, color=\"red\")\n```\n\nIf you use\
    \ the geom_density() command first, the histogram will be on top of the density\
    \ and therefore the density plot will not be visible.\n\n# 09 Add smooth layers\n\
    \nAnother type of layer is smoother than rather displays raw data, but statistical\
    \ transformation of the data.\n\nThe geom_smooth() generates a linear regression\
    \ line similar to a LESS (local estimated polynomial fitting curve), which is\
    \ useful for datasets with less than 1000 observations. For larger datasets, the\
    \ best method is GAM (general additive model). The produced plot will be generated\
    \ using the following commands:\n\n```\n> q ggplot(LID, aes(x=RAM, y=SSD))\n q\
    \ + geom_point() + geom_smooth()\n q + geom_smooth(method=\"gam\")\n```"
