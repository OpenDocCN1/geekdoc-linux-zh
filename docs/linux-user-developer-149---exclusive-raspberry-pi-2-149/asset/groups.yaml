    ## Ubuntu 设备


    你好！关于 Ubuntu 手机和平板电脑的传闻似乎再次升温了，感觉我们已经等了非常久。你愿意对此透露一些内幕吗——对它们来说，已经太晚了吗？


    至于平板电脑，就是你听过的 UTab。这款设备最初发起了 Indiegogo 营销，直到在 Ubuntu.com 开启预售后才停止（资金是如何筹集的呢？），而且它不仅为
    Android 和 Linux 打造，还配备了旋转驱动器——除了 64GB 的闪存存储空间外，还有一个高达 1TB 的硬盘，用于存放你的操作系统。此外，它的价格仅为
    499 美元，如果你想升级到 1TB SSD，则为 699 美元。遗憾的是，UTab 的电池续航时间只有 5-7 小时。


    如果你从磁盘、USB 或 SD 卡进行现场启动。即使你的宿主机没有被硬盘任务的内存占满，而是你的 IP 地址（例如）不会在虚拟机之外暴露，但你的活动痕迹仍可以从硬盘中找回。除非你工作得比生活在虚拟机里还要刻苦，否则它仍会留下痕迹。如果你需要使用该发行版，那么最好将它安装在
    SSD 上。


    Carlen K


    我们可能在明年看到第一批 Ubuntu 手机，这真是太好了！正如我们在上个月的一封信中提到的，Ubuntu 的手机合作伙伴之一最近确认了在 2 月发布，所以当你读到这封信时，Ubuntu
    手机已经上市，或者迫在眉睫。目前还没有来自小米（另一个发布方）的消息，但希望他们很快跟进。


