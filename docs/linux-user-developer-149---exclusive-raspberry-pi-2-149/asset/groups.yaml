    树莓派 2 现在已发布——我们与 Eben Upton 和 James Adams 对话，获取其开发的故事以及树莓派会的 2015 年计划


    强大六倍。这是我们关于树莓派 2 听到的消息之一，仅凭这一点就让我们收拾行李前往剑桥旅行——而且，光凭这一点就足以在某个时候到达那里。但事实证明，树莓派升级了新的处理器
