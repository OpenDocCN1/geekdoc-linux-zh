    # # Touch up photos using GIMP

    Make professional photo enhancements with open source software


    TUTORIAL


    ![](img/3d658904c66bbb1691af66259d8c8bf9_36_0.png)


    ## 01 Install GIMP

    GIMP is already installed on many Linux distros by default, so searching the Graphics
    in your menu is first to find it. Otherwise, it can be installed in your software
    manager by looking for GIMP. If all else fails, head to our website to download
    the installer.


    ## 02 Work with RAW photos

    Some cameras allow you to work straight from JPEGs, but others will give you RAW
    files you can edit with light levels and other camera aspects. GIMP can handle
    RAW but you may also need software as URAW to import them.


    ## 03 Crop the image

    Not essential for every image, but if you weren''t shooting with a rule-of-thirds
    approach, you can see if the image would look better with one angle. Click on
    the rectangle select tool and see the Guides to Rule of Threads.


    ## 04 Use the rule of thirds

    The rule of thirds is used to position an image in such way that certain aspects
    of a photo take up a third of the composition. This helps to make your photos
    look more dynamic and draw the eye to particular features. what you want to highlight.


    ## 05 Remove red eyes

    Tweak the levels to remove as much red as possible without changing the whole
    picture. You can refresh the selection to larger or smaller to get a better result.
    It can help to do both eyes at once.


    ## 06 Control red-eye levels


    ## 07 Vary highlights and shadows

    Photos will have a range of colours at different levels, from higher highlights
    to the darker shadows. You can use the histogram to find and set these on a 255
    point scale: 0 is the darkest and 255 is the brightest.


    ## 08 Adjust the overall range

    Here you can see that the histogram doesn''t cover the entire graph. A quick fix,
    and one that will increase image quality, is by dragging the slider until the
    histogram expands. In this case it makes the photo slightly darker but better
    to pick out some detail.


    ![](img/3d658904c66bbb1691af66259d8c8bf9_36_1.png)


    37 www.linuxux.co.uk'
  - '[PAGE 37]


    # # Tutorial


    ![](img/3d658904c66bbb1691af66259d8c8bf9_37_0.png)


    # ## 09 Add Auto-Levels


    There is Auto-Tools that will automatically do basic corrections on the photo
    for you and some people, this will be all you need to enhance your photo. Sometimes
    though, you might want to do a more level editing to ensure maximum quality.


    # ## Use the Eraser to remove the red areas from the skin


    ### 11 Correct skin blemishes

    There''s a big debate going on over the industry''s use of airbrush to make models
    perfect. We''re not equipped to debate that in Linux User & Developer, but we
    feel it to have a look at covering the odd skin if you need to.


    ### 13 Set up the image

    Grab the Healing tool and zoom in on the picture. Select a patch of skin touch
    or near the blemishes - change the brush size if you need, depending on the size
    of the photo and blemishes. Hold Ctrl before clicking. This selection will move
    with your painting to vary the healing tool''s colours.


    # ## 10 Alter the colour


    Back on the levels editor, find the channel selector. Here you can find the individual
    RGB levels. Editing these individually can create a slightly better tone across
    the picture. You can also edit the Blue or Red levels to make the image colder
    or warmer, or correct the white.


    # ## 12 Using the healing tool


    With blemishes like red patches, moles and freckles, you can easily cover them
    using the Healing tool. This takes one area of a photo and uses it to create a
    natural gradient. it''s the plaster symbol on the tools.


    # ## 14 Heal blemishes


    Paint over the blemishes as you normally would any other color using the paintbrush
    tool. You may need to reset the initial point of copy to points to avoid using
    the background or another part of the picture to cover up the target area.


    ![](img/3d658904c66bbb1691af66259d8c8bf9_37_1.png)


    ![](img/3d658904c66bbb1691af66259d8c8bf9_37_2.png)


    38 www.linuxuser.co.uk **'
  - '[PAGE 38]


    # # Touch up photos using GIMP


    Make professional photo enhancements with open source software


    # TUTORIAL


    ![](img/3d658904c66bbb1691af66259d8c8bf9_38_0.png)


    # ## 17 Use the Quick Mask


    So we''ve removed some blemishes, you can also smooth the skin a little using
    the Quick Mask tool. Go to Select and Toggle Quick Mask to cover the image in
    a layer of red. Finally, we''ll be removing the red hue once done.


    # ## 15 Clean up the photo


    The Heal tool can do more than just remove a mole. In this example we''ve removed
    the wrinkle from our model''s neck. On a large scale it can be used to clean the
    background of a photo more naturally than cutting or blurring colours. It''s not
    a perfect tool as it can only estimate, but it''s still very smart and gets better
    all time.


    # ## 19 Grab Gaussian Blur


    The final step to smooth out the skin is using the Selective Blur in Filter->Blur.
    Pay about with the levels again but try to keep them small. Go to top or you can
    make the skin slightly resembleably perfect.


    # ## 16 Enhance the details


    The Unsharp Mask works very well with small details or where the makeup is key.
    Go to Filters->Enhance to select the tool, which will automatically bring out
    some of the details in the photo. Use small values and experiment with it; it
    only needs to be subtle.


    # ## 18 Do some preparation


    Use the Eraser tool to remove the red areas, the eyes, eyes and mouth. After that''s
    done you can turn off the mask and it''ll create a selection of what you want
    deleted, without the Joker-esque look that occurred when the mask was.


    # ## 20 Beautiful photos


    With a bit of practice and creative uses of some tools, you can make any picture
    look much better than the original, without obvious and giving the model a completely
    different appearance.


    ![](img/3d658904c66bbb1691af66259d8c8bf9_38_1.png)'
