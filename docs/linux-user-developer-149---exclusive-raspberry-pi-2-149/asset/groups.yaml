    ## 使用 SpagoBI 从业务数据中获取关键洞察


    企业需要确保根据数据做出正确的决策。这正是商业智能工具大显身场。


    ## 顾问（Advisor）


    Nitish Tiwari 职业是一名软件开发者，内心是一个开源爱好者。他也为开源项目撰写文章，帮助初创公司并引导他们使用开源软件来满足业务需求。


    任何企业的存在都有一个目的——获取客户。然而，当今竞争激烈的商业环境让公司很难留住客户，简单的快速策略旨在打破这种局面。商业智能可以定义为一组工具，从原始数据中生成有意义且有用的信息，以帮助更好地分析相关业务。简单来说，商业智能工具让你根据数据来判断你的业务中什么是对的，什么是错的。


    你可能会想：“如果数据来自我的业务，为什么我不能直接做决策，而要使用更好的软件工具呢？”原因在于人类的进化：我们是在需要根据数据做决策的环境中演化的，因此我们对数字很熟悉，特别是在处理大量项目时。但今天，我们有了
    SpagoBI 的力量，它可以为你完成繁琐的工作。你可以看到安装步骤，然后学习如何使用 SpagoBI 做出决策。例如，在 Ubuntu 14.04 上使用
    SpagoBI 稳定版本 5.0.0。


    ## 资源


    SpagoBI 首页


    www.spagobi.org


    ## 从业务数据中获取关键洞察


    使用商业智能工具做出正确的决策


    ## 教程（TUTORIAL）


    ![](img/3d658904c66bbb1691af66259d8c8bf9_44_0.png)


    **01 开始安装**，你需要下载“All-In-One SpagoBI-xx.zip”，来自 http://github.com/spagobi/releases。发布包包含了
    SpagoBI 服务器和数据库，因此你不需要下载其他。如果你有任何问题，或者你之前安装过 SpagoBI 或其他软件，最好从全新的安装开始。确保你的电脑上安装了
    Java。在终端中运行 `java -version` 进行检查。如果有返回，可以使用 `sudo apt-get install jre` 安装 Java。完成后，继续后续。将下载的文件解压到目标文件夹。输入命令：


    ```bash

    cd /location/download/spagobi-server-5.8/

    chmod 755 *

    ```


    赋予脚本执行权限。同时，导航到数据库文件夹并更改该文件夹的权限。更改权限后，使用 `chmod 777 *` 为所有 `.sh` 文件更改权限。在生产环境中，执行命令运行
    SpagoBI。如果你看到“Startup sequence completed（启动序列完成）”的消息，转到浏览器访问 http://localhost:8080/spagobi/。一旦打开页面，你可以使用下方提到的默认凭据登录。


    **02 开始**


    作为一个 BI 工具，SpagoBI 的主要重点是提供可操作的分析。它连接各种数据源（如数据库），并提供易用的 GUI 来帮助你探索数据。你可以在页面顶部使用下方提到的默认凭据登录。在生产环境中，你需要创建用户。更多细节请参考用户手册。


    现在开始你的分析。点击“我的分析（My Analysis）”链接。在左侧菜单中，点击右上角的新建按钮。下一个页面将要求报告类型：选择“即时（ad hoc）”。现在你可以为你的分析选择适当的数据集。由于还没有数据集，**03
    创建分析**


    一旦有了数据，你可以选择两个选项：“显示查询（show query）”和“显示工作表”。选择工作表设计器（这将是默认设计器）。然后选择可视化样式，例如柱状图或饼图。一旦选择了样式，将字段拖入设计器中。注意字段是根据数据集显示的，你可以使用预览（Preview）标签查看查询结果。如果一切看起来正常，点击保存（Save）按钮。分析保存后，你可以在“分析（Analysis）”菜单下查看。linuxuser.co.uk


    教程


    ![](img/3d658904c66bbb1691af66259d8c8bf9_45.png)


    **04 使用 QBE 定义查询**


    从固定数据集绘制图表的能力对于现实场景是不够的。你可能想从多个场景来看问题。通过 QBE，你可以以图形方式定义查询、检查结果，或创建一个报告供以后使用。要开始，只需在创建查询期间点击
    QBE。会出现一个与选择数据集相关的窗口，你可以将相关数据集字段拖到右侧的编辑器中。一旦填充了过滤器，查询会自动生成。然后你可以使用工作表（worksheet）标签为此新查询编辑或创建图表。


    ![](img/3d658904c66bbb1691af66259d8c8bf9_45_1.png)


    **05 创建数据集**


    前面的步骤数据集用于创建，现在现在如何在 SpagoBI 中创建自己的数据集。点击左侧菜单上的“数据（Data）”链接，点击右上角的“创建数据集（Create
    Dataset）”按钮。弹出的新页面允许你选择 xls 或 csv 文件。一旦文件加载，你可以指定文件的分隔符和编码，SpagoBI 将自动识别列标题。然后定义属性和


    **06 创建模型**


    模型和数据集的区别在于，数据集是从数据源导入的，而模型直接关联数据集。你也可以创建模型。事实上，要创建一个新模型，点击资源（resources）链接右侧的“添加（Add）”按钮以添加新的数据源（如数据库）。点击资源（resources）链接然后进入“数据/数据源（Data/Data
    Sources）”。在这里，点击“添加（Add）”按钮将打开新表单。填入数据库连接详情。点击右上角检查 SpagoBI 是否能连接到数据库，然后保存。现在再次点击链接进入“目录：业务模型（Catalogue:Business
    Models）”。添加新模型并将数据源选择为新添加的数据集。保存模型以完成过程。现在你可以在“数据（Data）”链接下看到新模型。


    SpagoBI 的主要重点是帮助生成可操作的分析。linuxuser.co.uk


    ## 从业务数据中获取关键洞察


    使用商业智能工具做出正确的决策


    ![](img/3d658904c66bbb1691af66259d8c8bf9_46_0.png)


    **07 将数据添加到驾驶舱**


    驾驶舱提供了一种交互方式来轻松启用数据。通过数据组合（mashup），你可以将外部数据添加到你的驾驶舱。要创建驾驶舱，点击“我的分析（My Analysis）”。新页面将有一个干净的画布。使用右上角的“小部件（Widget）”按钮将添加到画布。点击后，你在画布上配置小部件。小部件的设置与步骤
    3 类似。你可以添加尽可能的小部件，然后将其用于以后查看。


