    # Q/A


    I''m still using a CRT monitor as well. These are programs that I used extensively
    before without any issue. One game has lag when I try to go back to it. It continues
    to be frozen, logging game time, even though it''s frozen. If I have to sigkill
    the game from another terminal, unless it shuts down Xwin in a crash.


    When I started it in window mode (no change of screen mode) it sometimes shows
    the graphics, and it''s a black window that crashes. Some cases I just want the
    console to kill the process.


    The other game will back out, by using the Escape from the black screen and will
    shut down.


    I have been trying to figure out what happened, so here''s my recent attempts:
    First, I changed them, mostly to help with GTK+. Most of the problems required
    Murrine, which Slackware does not have, so in a separate department. Maybe I left
    some settings around in my settings?


    Then I changed the XFACE window to xfce. I changed it back again. Now I haven''t
    fixed the problem though.


    I''ve changed appearance to Raleigh, some others, and then back to Alternate.


    Below as Slackware, as these problems are found in game-optimised distro SteamOS.


    I also added a line to /etc/profile.d/gtk.sh to help get its styles, to stop a
    message saying GTK cannot find them. Commenting this line out fixed the problem.


    Finally, I installed the game and played it few times. It runs quite nearly totally.


    And I am trying to start the tedious process of single-threading through one part
    of the games. I have already tried to verify that it works, but it still gives
    me return code one, and "7. File = return code zero".


    Do you have any other ideas that would help?


    It''s a bit suspicious that you are having problems when switching and causing
    lot of them around. Do you have different resolutions with these or in general?
    Might it be causing trouble for release?


    Otherwise it might be best to reinstall Slackware or create a dual boot for gaming
    to make sure none of the hacks on your system cause any trouble for the game itself.


    # Batch Files


    I''ve tried fixing it with that date, except it''s still giving me return code
    one, and it''s happening on every one of my Linux servers.


    The vendor says that PAM (Pluggable Authentication Module) is being invoked every
    time I run a chance on the batch utility. Basically, I''m getting success from
    batch jobs when they should be returning a non-zero return code. Any help on this
    would be really appreciated.


    George Burtt


    Red Hat is usually very good at fixing bugs such as this is a documented bug in
    Red Hat and there are a couple of workarounds for it. The best one is to use this,
    which is modifying the system-auth.conf file.


    You can find this in /etc/pam.d – open it with your favourite text editor and
    then look for this line:


    ```

    session optional.pam_sss.so

    ```


    Add a line to it below as:


    ```

    session sufficient.pam_local_user

    ```


    Save the file, and recycle ssh with this to be on the safe side:


    ```

    $ service sss restart

    ```


    Hopefully, the bug should be fixed for all of you.


    Right Hat


