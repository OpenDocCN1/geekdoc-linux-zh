    ## Canonical pushes Click towards new format


    Canonical has renewed its focus on its in-house packaging, called Click, in an
    effort to support Ubuntu Touch. The Click format differs from other efforts because
    it embeds dependencies directly into the package. Each release of Ubuntu allows
    developers to create their own Click. With Unity shell, based on QML, it will
    further the the mainstream Click. Canonical has not, however, indicated that its
    releases will be dropping at any time.


    ## Free Code Camp opens source


    The Free Code Camp, a web-based programme designed to train new developers pairing
    them with experienced programmers for projects, has announced that it has made
    the transition to open source. The code is available for access.


    # HARDWARE


    ## Nvidia Tegra X1 ‘superchip’


    ### Company sets its sights on automotive Linux


    Nvidia has announced the launch of a next-generation ARM system-on-chip for Linux
    using the Tegra X1, for high-performance tasks.


    Building on the Tegra K1, launched in 32-core and 64-bit variants and the Tegra
    T25-based development board, the Tegra X1 brings big improvements. It is the first
    SoC with a GPU core based on its latest Maxwell architecture. The 64-bit chip
    also features general-purpose processing cores: four high-performance ARM Cortex-A57
    cores and four low-power Cortex-A53 chips with 512KB L2 cache arranged in ARM’s
    big.LITTLE configuration, designed to balance performance and power draw, targeting
    the automotive market. The first products to ship will be the Tegra PX and DX
    - the former ‘computer chip’ for navigation and entertainment, the latter a Linux-based
    board featuring listed Tegra X1 modules and designed for working on vehicle projects.
    The PX is expected to be released exclusively to Nvidia’s partners in the automotive
    industry. The DX may be sold commercially, but Nvidia has yet to confirm pricing
    or availability.


    Nvidia founder Jen-Hsun Huang unveiled the Tegra X1 at the Consumer Electronic
    Show


