    # Monitoring what''s happening on your network activity with Python and your Raspberry
    Pi


    As a renaissance man, he splits his time between building more technological furniture,
    researching with scientific computing problems, and writing apps.


    Raspberry Pis are great devices to use in monitoring. With the full set of 10
    pins, you can connect a range of devices to it, which leads to different de-vironments.
    But what if you need to monitor something more technological, like network activity?
    This month, we will


    It''s the official language of the Raspberry Pi. Read the docs at python.org.


    use Python to look at how your own tools work and see what''s happening on your
    network. You will only have access to what is visible on your Raspberry Pi. This
    means, if you have connected it to a network, you can monitor network packets
    addressed to it. If you want to monitor everything, you''ll need to use a module
    to mirror everything to the relevance interested in. If you want to capture certain
    information, you can use the setsockopt() function of the socket object. This
    will allow you to set the fontil module. However, if you want to capture everything,
    you must set the interface to promiscuous mode. You can do this within Python,
    but it can be messy; its to


    — don''t forget to close this socket before moving on. If you have services that
    you want to track, you can create a socket to the stream socket. Then connect
    this new socket to the host and port where the service is located and use the
    send() function to check the service''s response and message.


    You may be interested in looking at what''s happening on your Raspberry Pi. If
    you don''t want to work directly with socket objects, you can use Scapy to list
    and query the elements of the network. Scapy system also has modules that will
    give you higher-level functions to analyze your network traffic.


    We''ll start at the lowest level using Python. The standard Python library includes
    ''socket''. By importing this module, you can talk to a network interface and
    observe what''s happening. Remember that you will need to run as root to access
    physical devices, the network interface. This means you will need to run your
    Python code under root. First, you need to create a socket object with the function
    socket.socket(socket.AF_INET, socket.SOCK_RAW). The first parameter is the socket
    family and the second is the socket type. There is a full description of the options
    in the Python documentation. Then you can then filter the socket object to a specific
    address that represents you


    ```

    import os

    import socket

    socket=socket.socket("eth0")

    ```


    You can now start collecting data, using the recv() and recvfrom() functions.
    Both take a parameter defining the buffer size. The recvfrom function also includes
    the header of the packet.


    You can also use raw socket objects to get objects on the network. Assuming that
    ICMP packets are involved, you can create a socket object of type ICMP. You will
    need to set the socket family to IPPROTO_RAW for your connection. If the connection
    fails, it will fail with an error. Then you send an ICMP packet to the host. You
    will need to create a binary structure that you can send on the socket connection


    # To capture everything, set the interface to Promiscuous mode


