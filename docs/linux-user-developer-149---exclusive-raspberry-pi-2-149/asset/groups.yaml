    right in the middle of setting up a wireless print server or building a robot
    to collect your mail from your dormat.


    But are you truly getting the most from your little computer? Do the components
    you''re using maximise the potential of your Raspberry Pi or are they holding
    you back? Have you explored the full set of options in Raspian, or are you running
    the OS from SD card, something that can reduce SD card life span?


