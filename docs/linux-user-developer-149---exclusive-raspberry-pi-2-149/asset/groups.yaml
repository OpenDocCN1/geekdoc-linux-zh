    # FAQ: Updating a distribution


    Q: How can I update my distro?

    A: Some distributions include a version update, such as Ubuntu. They will usually
    prompt you if update is available, it will update and add any necessary files
    and settings. Others do not have this process, so you''ll need to back up your
    files and install the updated version of the distro.


    Q: I''m on Ubuntu and the release prompt is not showing?

    A: Use Software Manager, go to Settings/Updates and click for the menu with ''Notify
    me of new Ubuntu version'' and change it to ''For any new version''.


    Q: Can I go back to a previous version?

    A: No, it would be difficult and try to downgrade all packages back to a prior
    state. The best solution is to perform a full backup if you wish to revert later.


