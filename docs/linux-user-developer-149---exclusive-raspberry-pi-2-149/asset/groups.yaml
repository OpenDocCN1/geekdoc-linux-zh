    ## Imagination 致力于开放 PowerVR 驱动程序


    3 月 9 日 - 10 日


    ### 与社区共同探索方法


    Imagination Technologies —— PowerVR 移动 GPU 家族背后的英国公司——宣布其正在“探索”与开源社区合作的方法，而不一定是闭源驱动程序。


    ## Vault（金库/会议）


    - >> 波士顿 皮尔 酒店

    >> 美国

    - >> events.linuxfoundation.org


    在 Linux 夏季会议之后，Linux 基金会旨在汇聚来自所有 Linux 领域的顶级开发者，并在开放的技术环境中建立联系。


    自从 imagination 首次为 PowerSource Dreamcast 主机开发图形控制系统以来，该公司主要专注于具有低功耗、高性能 GPU 的移动领域。PowerVR（第
    6 系列）架构经常出现在苹果、三星、瑞芯媒体和 Intel 等公司的 SoC 中。Linux 用户对其硬件的采用通过公司发布或支持其硬件的开源驱动程序得到了解决。然而，随着基于
    PowerVR 的 C20 开发板的发布，imagination 表示……“我已经向管理层表达了我的所有关于驱动程序的意见，可以与开源社区合作。”我们现在正在探索方法[这并不是任何道路的终点，尽管在撰写本文时，公司对于如何实现其
