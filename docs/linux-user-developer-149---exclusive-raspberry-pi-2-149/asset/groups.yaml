    ## Git 遭受漏洞攻击


    3 月 23 日 - 25 日


    ## 嵌入式会议


    - >> 加利福尼亚州圣何塞

    >> 美国

    - >> events.linuxfoundation.org


    嵌入式 Linux 会将与 Android 开发者峰会同时举行，侧重于 Linux。


    由 Linus Torvalds 创建的流行版本控制系统遭受了一个影响内核的严重漏洞。Julio Hamano 在官方邮件列表上发现的漏洞代表了执行任意代码的能力。“即使该问题可能也不会影响
    Windows 上的用户，”Hamano 说，“如果你正在使用 Mac OS，由于使用了不区分大小的文件系统（如 FAT、NTFS 或 HFS+），该问题得到了缓解。”


    3 月 23 日 - 25 日


    # 开源


    最新新闻与观点


