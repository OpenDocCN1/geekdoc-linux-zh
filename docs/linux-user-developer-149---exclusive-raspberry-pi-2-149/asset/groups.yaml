- md: "\n# Tutorial\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_67_0.png)\n\n# Supercharge\
    \ your Raspberry Pi\n\nGet the most out of your Raspberry Pi with these performance-enhancing\
    \ tips and tricks\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_67_1.png)\n\nChristian\
    \ Cawley is a former IT software engineer and engineer since 2010. He has written\
    \ for smartphone users, both online and in magazines.\n\nYour Raspberry Pi is\
    \ plugged in. Raspian is installed on the SD card and you are right in the middle\
    \ of setting up a wireless print server or building a robot to collect your mail\
    \ from your dormitory.\n\nBut are you truly getting the most from your little\
    \ computer? Do the components you're using maximise the potential of your Raspberry\
    \ Pi or are they holding you back? Have you explored the full set of options in\
    \ Raspian, or are you running the OS from SD card, something that can reduce SD\
    \ card life span?\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_67_2.png)\n\nVarious\
    \ techniques can be employed to improve performance, choosing the right hardware\
    \ to overclock the CPU. You might even maximise storage on the Raspberry Pi's\
    \ SD card or all replace it with a secondary SD card for speed.\n\n# Use storage\
    \ hardware\n\nUse these tips to reconfigure your Raspberry Pi setup and optimise\
    \ hardware to ensure you get the best performance for your projects.\n\n- 1 Your\
    \ choice of storage media can have an impact on your Raspberry Pi's performance,\
    \ regardless of the operating system. A low capacity SD card with poor error correction\
    \ is going to be slower than a larger card with greater resilience, so to find\
    \ the right balance for your project and shop wisely.\n\n## Supercharge your Raspberry\
    \ Pi\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_68_0.png)\n\n# 02 Choosing the\
    \ SD card\n\nVarious standards of SD card are available, the more expensive for\
    \ better error correction. For the performance on your Raspberry Pi, choose an\
    \ SDHC card with a high rating. The same advice applies to MicroCards, which you\
    \ can use on your Raspberry Pi with an SD card adapter or directly insert into\
    \ the Raspberry Pi.\n\n# 05 Write data to RAM\n\nRather than reading and writing\
    \ data to your SD card – something that will eventually result in a deterioration\
    \ of reliability and performance – you can configure Raspberry to write to the\
    \ RAM, which will speed up things and improve SD performance.\n\nUsing tmpfs (File\
    \ systems table), a system configuration available in Linux distributions.\n\n\
    ![](img/3d658904c66bbb1691af66259d8c8bf9_68_1.png)\n\nAbove There's a great guide\
    \ to SD cards at elymux.org/RPI_SD_cards\n\n# Bought SD cards\n\n```\n$ pi@raspberrypi:~\
    \ \nsudo raspi-config\n```\n\n# 03 Make the most of your storage\n\nYou'll typically\
    \ need 1GB of storage for your Raspberry Pi, so no matter how large your SD card\
    \ you will be able to create or save data.\n\nIn Raspberry you can use the command\
    \ line or run the configuration utility to get more space (only if your SD card\
    \ is greater than 2GB)\n\n- sudo raspi-config\n\n# 04 Expand the Raspberry partition\n\
    \nMaximising the partition allows the full capacity of your SD card, which will\
    \ increase the media's lifespan (there is more space to write to, so the sectors\
    \ aren't being overwritten)\n\nWith raspberry-config, use the arrow keys to select\
    \ expand_partitions in the menu. Wait briefly while the partition is resized.\n\
    \n# 06 Enable tmpfs\n\nmaking a RAM disk in Linux is as easy to set up. In the\
    \ command line, enter:\n\n- sudo nano /etc/fstab\n\nAdd the following line to\
    \ mount a virtual system:\n\n```\ntmpfs /tmp tmpfs defaults,noatime,nosuid,size=755m\n\
    ```\n\nFollow this by saving and exiting nano (Ctrl+O, X), then restart the Raspberry\
    \ Pi.\n\n- sudo shutdown -r\n\nIt's tempting to boot up your Raspberry Pi with\
    \ an image card to SD that you just pulled out of your phone. After all, it's\
    \ the same, right? The chosen SD card will work just like you had when using on\
    \ your Raspberry Pi. But you won't get enough performance. A high-performance,\
    \ SD-card with write speed is highly recommended. Just make sure you're buying\
    \ a known brand!\n\n# Tutorial\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_69_0.png)\n\
    \nAbove Having your filesystem on a USB stick makes backups as simple as possible\n\
    \n# 07 Configure fstab for fast performance\n\nUpon restart, the virtual file\
    \ system will be mounted and var/log on the RAM disk. Other directories that can\
    \ be moved to RAM include:\n\n# 10 Copy Raspbian to USB\n\nUsing a blank Ext4-formatted\
    \ USB drive (or external HDD) as the destination drive,\n\n- tmpfs/tmp tmpfs_defaults,noatime,nosode,size=100m\n\
    - tmpfs/var/log tmpfs_defaults,noatime,nosode,size=30m\n- tmpfs/var/spool/unix\
    \ tmpfs_defaults,noatime,nosode,size=755,size=20m\n\n```\nsudo dd bs=4M if=/dev/sda\
    \ of=/dev/sdc\n```\n\nPicking an USB drive\n\nLeave the boot on your computer,\
    \ just in case something goes wrong. With SD and USB storage device, it's time\
    \ to consider what you're going to do - create a faster Raspberry Pi. Speed up\
    \ your Raspberry Pi by migrating the filesystem to an external drive is a start,\
    \ but what sort of device would you use for the best performance? You can add\
    \ flash storage without getting into any problems (the larger is, more reliable).\n\
    \n# 09 Move OS to HDD\n\nIf you're concerned about the Raspberry Pi's reliance\
    \ on SD. Instead of using a SD card, use an SSD or USB stick to run the operating\
    \ system, leaving the SD card for booting. This can give much faster boot to the\
    \ SD.\n\n```\nsudo dd bs=4M if=/dev/sdb of=/backup.img\n```\n\nAdd entry to /etc/fstab\
    \ in nano:\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_69_1.png)\n\n# 11 Split\
    \ the partitions\n\nThe path/sdb represents the SD card. Copying should take about\
    \ 15 minutes. When complete, remove the SD card and connect your USB device. Using\
    \ this method, if you accidentally delete the root from the SD card, you have\
    \ retained the boot partition, then connect your device and boot, taking care\
    \ to leave the root filesystem intact. Resize.\n\n# Supercharge your Raspberry\
    \ Pi\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_70_0.png)\n\n# 12 Identify the\
    \ root filesystem\n\nWith this configuration you're going to have the SD card\
    \ and the external storage connected, so you need to tell the Pi where your root\
    \ filesystem is. Still on the desktop Linux with your SD card inserted, find and\
    \ replace root=/mmblk0p2 with root=/dev/sdb. Save and exit.\n\n# 15 Boost performance\
    \ with overclocking\n\nNeed more from your Raspberry Pi? It is possible to overclock,\
    \ although you should be aware of the risks inherent with this activity. You should\
    \ also ensure that your Pi processor is suitably cooled - heatsinks for the CPU,\
    \ Ethernet controller and power regulator can be.\n\n```\nsudo nano /boot/cmdline.txt\
    \ (or similar) and change to root=/dev/sdb which is your external USB storage.\
    \ Save and exit.\n```\n\nAbove heat sinks for the Pi widely available and cost\
    \ less than $10\n\n# 13 Add other USB devices\n\nYou can now restart your Pi with\
    \ the storage devices attached, but as soon as you connect further USB devices\
    \ you'll suffer problems. By installing:\n\n```\nsudo apt-get update\nsudo apt-get\
    \ install gdisk\n```\n\nThen run gdisk:\n\n```\nsudo gdisk /dev/sdb\n```\n\nEnter\
    \ ? to select the option and Transformation options (experts only), Load MBR and\
    \ Build GPT. Then to edit and remove the last 'Disk' entry, make the time enter\
    \ 1 and then press 1 to display the Partition.\n\n# 14 Make your Pi fast\n\nMake\
    \ a note of the cmdline.txt and change to root=PARTITIONUUID=XXXXXX, replacing\
    \ the numerical string from the partition with your UUID. Once you're done, save\
    \ and exit. You can then restart your Raspberry Pi. Congratulations, your Raspberry\
    \ Pi is now faster and more reliable to use!\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_70_1.png)\n\
    \n# 16 Overclock your Raspberry Pi\n\nOverclocking is available through raspi-config,\
    \ from the command line and follow the overclocking option. Four options are available:\
    \ Modest, Medium, High and Extreme. With your ideal clock speed, select raspi-config\
    \ and reboot your Raspberry Pi to:\n\n```\nsudo shutdown -r now\n```\n\nNow you\
    \ will need to test how stable it is after the overclocking Raspberry Pi. If stable,\
    \ use to run a good stress test. If the Pi fails, hold Shift to boot without overclocking,\
    \ run raspi-config and select a more modest option.\n\n# 17 Run without the GUI\n\
    \nDespite these changes, you might find that the GUI remains slow. If you find\
    \ running a list of commands is slow, you should stop the desktop before booting\
    \ into X. In raspi-config, choose boot_behaviour and select the default to option\
    \ your Pi to the command line. When you need the GUI, use 'start' in terminal.\n\
    \n# Overclock with a heatsink\n\nOverclocking is potentially dangerous to any\
    \ computer which is why it's great that the Raspberry Pi developers have included\
    \ in their improved environment and allowed it to use under warranty. If features,\
    \ and hardware are available, Raspberry Pi might not bake the CPU and RAM when\
    \ used.\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_70_2.png)\n"
