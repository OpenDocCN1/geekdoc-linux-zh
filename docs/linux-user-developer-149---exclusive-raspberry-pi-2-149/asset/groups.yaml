  mdcn: "\n\n# 问题与解答\n\n解决您所有的技术问题\n\n## Q/A\n\n![](img/3d658904c66bbb1691af66259d8c8bf9_90_0.png)\n\
    \n上方：GIS 允许对地理数据进行分析\n\n通过将所有文件放入 /usr/bin 来修复 /in、/bin 或 /usr/bin 中的非官方软件包。那些在仓库中不存在且需要修复的包可以生成：\n\
    \n稍后需要这个。我设置的更新已经发生。\n\n```\n$ pacman -O | awk '{ print $1 }' | /bin|/usr/bin|\
    \ /sbin/\n```\n\n```\n$ pacman -Syu --ignore\n$ pacman -S --bash\n$ pacman -Syu\
    \ -su\n```\n\n还要检查从非官方仓库安装的软件包：\n\nKDE 邮件检查器根据您的需求进行高度定制，在不知道您的具体需求的情况下，我们无法提供更好的建议。\n\
    \n从 FTools-x86_64-3.1.0 的测试版本开始。FTools 包含 GDAL 的 Python 封装器，这将对 ArcGIS 有帮助。\n\n\
    您也可以使用 GRASS，它也支持 GDAL，并且位于大多数发行版的仓库中。\n\n如果这些方法都不行，IDL 是另一个选项，它应该能满足您的一切，可能值得尝试一下。希望这些中有一个对您有效！\n\
    \n## 您有新邮件\n\n您知道软件会在有新邮件到达时通知您配合吗？我目前在 Gmail 和 Yahoo 上使用 AMS，这样我就知道什么时候收到新邮件。问题是\
    \ Windows 已经停止支持，AMS 效果也不够好，尤其是这些通知。\n\n另外，有桌面小部件程序吗？我想要一个显示每天收邮件数量的计数器。是否存在这样的应用？\n\
    \n## GIS 查询\n\n其次，确保 InogoreRepo 或 ororGroup 中的任何包在 /bin、/usr/bin 中没有文件——对于它们来说这是必要的。\n\
    \n你好，我是来寻求建议的。在我的部门，通常使用 ArcGIS，这种新软件能够读取 ArcGIS 创建的内容（即 .mapx 文件）非常重要。他们还有一些由我设置的其他要求。\n\
