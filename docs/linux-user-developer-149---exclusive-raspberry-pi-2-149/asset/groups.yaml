    # 构建 Cacti 插件


    开发一个显示活动 TCP 和 UDP 连接的插件


    ## 教程


    ![](img/3d658904c66bbb1691af66259d8c8bf9_58_0.png)


    ## 每个插件都需要注册钩子才能使用


    ### 关于插件代码的更多详细信息


    通用头文件将你的插件集成到 Cacti 中。当你构建的连接将在 Cacti 的环境中时，它是一个可以从另一个插件中复制的标准文件。要使用它，你必须在你的头文件中注册以下代码：


    `console view`，而 `top_graph_header` 钩子允许你为 Cacti 的用户界面添加标签页。当插件不在 Cacti 中时，你必须如下所示注册到
    `setup.php` 文件：


    ```

    include(''./plugins/connections/general_header.php'');

    ```


    `connections_check_upgrade` 函数目前没有显示你的用量。请检查其他插件的升级函数实现以了解。


    ### 使用函数


    简单的 `plugin_connections_install()` 函数不包含太多代码，但它是插件最重要的函数。为了让你的插件正常工作，你应该先查看它的
    `install()` 函数。它通过 `api_plugin_register_hook()` 和 `api_plugin_register_hook()`
    进行注册。`api_plugin_hook` 的调用如下：


    ```

    api_plugin_register_hook(''connections'',

    ''top_graph_tabs'', ''connections_show_tab'',

    ''setup.php'');

    ```


    第一个参数是钩子的名称，第二个参数是你想要注册的钩子名称，第三个参数是钩子触发时要调用的函数名称，第四个参数是包含上述内容的文件。


    ### 使用钩子


    要显示你的插件，请使用两个钩子。它们都使用同一个 PHP 函数：`top_header_hook` 允许你在查看图像时同时显示你自己的标签。


    Admin 用户自动获得使用每个新插件的权限。如果管理员是唯一需要你的领域的人，你仍然需要对其进行注册。如果你创建一个带有标签的插件，它将不会出现在 Cacti
    的用户界面中。注意，如果你在插件激活时将其插入 PHP 代码中，你将需要卸载并重启插件领域才能生效。


