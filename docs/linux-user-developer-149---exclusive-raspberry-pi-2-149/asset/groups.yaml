    # 开源


    您的 Linux 新闻与观点


    # JON MASTERS


    ## 内核专栏


    随着 3.19 系列内核工作的持续进行，Jon Masters 总结了内核社区的最新动态。


    展望 3.9 版本之后并进入新的一，有趣的是，在接下来的几个月里，我们还将会有 3 到 4 个内核开发周期。从我们想听取意见的角度来说，请给我们写封信，告诉我们您在这一年计划了哪些项目，以及您希望在这些页面中看到什么。《Linux
    用户开发者（Linux User Developer）》旨在为您提供测试和分析，在寻求帮助您学习 Linux 内部工作机制的道路上，我们乐意探讨深度的技术话题。


    尽管程序员方面的工作量较少（编译器处理了大部分细节），但在未来几年里，我们可能会看到这项技术的采用日益增加。这是一好事，因为硬件功能需要多年时间才能使此类能力成为常态。现在确实是时候改进安全性了。


    Jon Masters 是一位内核黑客，他工作 Linux 已多年，从他 13 岁首次进入剑桥大学学习开始。他出生于英国和马萨诸塞州，目前就一家企业供应商工作，在那里负责推动引擎企业开发标准的制定。


    ## MPX


    ### 滚开，该死的部件！


    Linus Torvalds 刚从 3.19 版本回归，宣布 3rc5 发布并表示：“又一周，又一个 rc”。公告中包含了他不寻常的评论，即内核周期的开发是正常的，但在平均月份会达到
    RC（发布候选版本）阶段。Linux 3.19 是一个正常的发布——尽管仍会有超过 10,000 次提交或补丁，其中包含许多行代码，这与年底的时间节点并不完全吻符。新内核将增加几个额外功能，包括对
    Linux MPX 处理器扩展的支持，以及来自 almost 的新型嵌入式微处理器架构。


    Linux 3.19 最令人兴奋的特性之一是对新兴 MPX 技术的支持。内存保护扩展（MPX）是一种 ISA（指令集架构）指令集，可以通过自动防御缓冲区溢出和其他漏洞来提高安全性。然而，在用户获得这种无疑会欣赏的显著安全性提升方面，MPX
    看起来并不特别“酷”。


    Rob Landelow 发布了一个补丁（删除了编译 Linux 内核对 perl 脚本的依赖）。由于内核除了编译器和汇编器外还有各种工具，但其需求通常是（稍微）轻量级的——至少在时间上），如果你不想在桌面电脑或笔记本电脑上构建全部，你可以在树莓派上编译内核。这种灵活性以
    Rob 所看到的方式赋予了 Linux。


    我们正在引入一些新系统和寄存器，例如支持编译器（包括 GCC），它们可以在编译期间产生代码以导致这些异常。MPX 提供了关于程序的更多信息，例如它想要访问的内存范围，并且对现有应用程序没有影响，但新或旧代码可以重新编译以利用此功能。由于许多软件应用程序都会被重建和升级，且
    MPX 可以非常容易地开启……


    “滚开，该死的部件！”，我们被补丁覆盖的反馈评论似乎过于严厉，但对于它的构建要求来说是一好事（而且对于购买目的来说比 shell 免费得多）。


    讨论开发对于需要 Perl 的内核开发和内核维护者活动很重要。Linux 有一个名为 `checkpatch.pl` 的脚本，它可以获取开发者提交的补丁，这些补丁需要更好的指南和社区惯例。当然，这个脚本是在内核中编写的，引发了许多笑话，建议每当遇到
    Perl 警告时就对其进行修改。


    ![](img/3d658904c66bbb1691af66259d8c8bf9_11_0.png)


    # 观点


    Jon Masters


    ## 开源


    ### AMD KFD


    ### 持续开发


    Linux 3.19 将支持 AMD ''KFD'' 内核驱动。这是其 HSA（异构系统架构）基础工作的一部分，旨在为在 GPGPU Linux 上开发提供一个完全开源的解决方案。Linux
    KFD 在与“图形”进程通信时与 Linux DRM（直接渲染管理器）类似，但它加载的是“内核”（专指，与 Linux 内核无关，后者可能不具备图形能力）。


    Alan Cox 在跟进另一个关于维护者滥用的线程时（该线程关注如何处理在合并后前几周内提交的补丁提交）提到，那里有一个 Google 之夏项目或类似项目，由许多内核人员将
    Patchwork 引入到一个项目中，以跟踪已发布、修订和合并的补丁，但与 Linux 内核本身相比，它远不是一个成熟的产品。


    专有的……旨在为运行中的内核提供热补丁（live patching）。希望许多开发者能在 Linux 协作大会上见面，并制定一个协作计划，以便在 3.20
    中实现支持。这将是游内核首次拥有这样的解决方案。


    在开发 KFD 时，发现使用如 r600 OpenCL LLVM 后端（基于 clang 的编译器）等工具将成为该作者在未来几周内一个非常有趣的项目。AMD
    在他们的基金 GitHub 上提供了示例项目，包括矩阵乘法驱动程序。


    作者还考虑在 Linux 中添加对 SPCR（串口控制重定向）API 表的支持。


    Linus Torvalds 和许多人参与了围绕内核热补丁（Kernel Live Patching）方法的讨论。存在许多不同的项目（当然，还有之前的 kpatch
    项目，它最终走向了更多……


    Dan Carpenter 注意到


    ![](img/3d658904c66bbb1691af66259d8c8bf9_12_0.png)


    Linux 3.19 将支持 AMD ''KFD'' 内核驱动。


    为了构建一切


    - 新：SSD、内存和 CPU 可以独立灵活，并根据您的需求进行调整

