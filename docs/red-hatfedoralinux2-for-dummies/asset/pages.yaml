  md: '# Part II: Got Net?


    # Desperately Seeking an ISP


    To get connected using a dial-up modem, you have to successfully hook up a modem
    to your computer and then find a good Internet Service Provider (ISP) to dial
    up to. Odds are that you have an internal modem that came installed with your
    computer. If you don''t, you may want to consider upgrading. Check out Upgrading
    & Fixing PCs for Dummies, 6th Edition, by Rathbone (Wiley).


    The best way to find a good ISP is by word of mouth. Getting personal recommendations
    is a way to find out both the good and bad points of an ISP that you cannot find
    from reading advertisements. Before you sign on with an ISP, make sure the company
    supports Linux.


    If you don''t have any friends and acquaintances to speak to you, try finding
    a local Linux user group (LUG) to ask. You can look up LUGs at the Fedora Core
    community web page, www.redhat.com/apps/community.


