    # Downloading Icecast2 and Ices2


    Before you build your streaming audio server, you have to get the Icecast2 and
    Ices2 software. This section describes how to download the software.


    By now, you know that Linux uses many names and acronyms, many of which are cryptic
    at best. So you probably didn''t raise an eyebrow when you encountered the name
    Ogg Vorbis, icecast2, or xiph.com. Ogg Vorbis is a science fiction character that
    its developers like. Icecast2 is a variation on the name Shoutcast, and Xiph is
    short for Xiphophorus generali, a small swordtail fish that''s popular in small
    aquariums.


    These steps help you prepare Fedora Core computer to start building the multimedia
    server:


