    to which your computer or private network is attached. If your firewall is running
    correctly, the scan shows little or nothing. That''s good. If the scan displays
    information about your computer and network, your firewall isn''t running correctly
    or isn''t running at all.


    You can use that information to your advantage. Seeing what the hackers see gives
