  md: '# # Red Hat® Fedora Linux® 2 For Dummies®


    # ## A few good commands


    Some commonly used and useful commands are listed here. You enter these commands
    from a shell prompt:


    | Command | Description |

    | --- | --- |

    | cd directory | Change the current directory to directory. |

    | ls [options] [directory] | List the current directory''s contents. |

    | ls - | List the current directory''s contents, along with sizes, permissions,
    ownership, and dates of files. |

    | ls -a | List all files, including invisible files (files whose name begin with
    a period). |

    | pwd [option] | Print the working directory (the one you''re in). |

    | rm [options] filename | Remove the file. |

    | mkdir [options] directory_name | Make a new (empty) directory. |

    | rmdir [options] directory_name | Remove an empty directory. |

    | cp [options] src_filename dst_filename | Copy a file. |

    | mv [options] src_filename dst_filename(s) | Move (or rename) a file. |

    | cat [options] filename | Concatenate a file to the standard output (display
    the file). |

    | more [options] filename | Paginate a file. |

    | less [options] filename | Paginate a file. |

    | touch [option] filename | Make a new (empty) file or change the access of an
    existing file. |

    | chown [options] filename | Change the owner of a file or a directory. |

    | chgrp [options] filename | Change the group of a file or directory. |

    | chmod [options] filename | Change the permissions of a file or a directory.
    |

    | sort [options] filename | Sort a file in a particular order (depending on the
    option). |

    | echo [options] text string | Echo back to the screen what is typed after the
    command. |

    | date [options] text string | Read the date and time (without an argument); set
    the date and time (with an argument). |

    | cut [options] filename | Break a file into multiple lines. |

    | sed [options] filename | Stream editor for large files or realtime editing.
    |

    | ln [options] source_filename/directory target_filename/directory | Link a file
    to another. |

    | grep [options] filename | Find data and print it to its output; this search
    program uses regular expressions. |


