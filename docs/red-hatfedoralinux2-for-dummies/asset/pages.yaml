  md: '# 270 Part IV: Revenge of the Nerds


    Log in root, open a GNOME Terminal window (refer to Chapter 4 for more information),
    and run the iwconfig command. If your NIC is configured correctly, you see output
    similar to this example:


    ```

    lo no wireless extensions.

    ```


    ```

    eth0 IEEE 802.11-DS SSID:"linky" Nickname:"..."

    Mode:Ad-Hoc Frequency:2.437GHz Cell: "..."

    Bit Rate:11Mb/s Tx Power=15 dBm Sensitivity:1/3

    Retry limit:4 RTS:off Fragment:off

    Encryption key:A654-6277-4306-ACC3-E6ED-1C12-98

    Power Management:off

    Link Quality:0 Signal level:0 Noise level:0

    Rx invalid nwid:0 Rx invalid crypt:0 Rx retries:0 Noise misc:0 Missed

    ```


    These are the important ones to examine:


    +   Mode: You have to set the same value to Ad-Hoc when you''re connecting to
    an ad hoc network. (Refer to Chapter 7 for more information about this method.)
    You can use the Any when you''re connecting to an infrastructure network. The
    Any value can work for an ad hoc network in some cases; however, a description
    of those cases is beyond the scope of this book, use ad-hoc mode whenever necessary.


    +   ESSID: You have to use the same value on every machine connected to an ad
    hoc LAN. For example, every machine on the network is given the ESSID linky.


    +   Encryption key: You must use the same encryption key on every machine connected
    to a wireless network. The key comes in two flavors: 40 bit and 128 bit. The 40-bit
    key is effectively useless because it can be readily cracked by hackers using
    widely available software. The 128-bit key can also be cracked, but takes more
    time and is better than no key.


    Your wireless network should work as long as you set these parameters correctly
    and your computer is within range of the other devices on your LAN. The other
    parameters are either self generating or unimportant in getting the card to.


    # Maybe the physical connections aren''t set up right


    If you don''t see the line containing lo, which is the loopback interface, and
    eth0, which is your network adapter, your physical network connections aren''t
    set up right. The loopback interface isn''t a physical device; it''s used for
    the software''s internal workings. The loopback interface must be present for
    the network adapter to configure.


    If the loopback interface isn''t present, type this command:


    ```

    ifup lo

    ```'
