  md: '# 254 Part IV: Revenge of the Nerds


    # ### Danger, Will Robinson! Detecting intruders


    Everybody needs a loyal, vigilant robot to sound the alert when aliens, monsters,
    Dr. Smith, and hackers come ever at you. You cannot have literal robots (or can
    you?), but you can have an intrusion-detection system (IDS).


    Many IDSs (far too many to describe here) can give you extra security. We suggest
    two mature and relatively easy-to-use systems that provide good bang for your
    buck: Snort and Tripwire.


    Intrusion detection is the flip side of intrusion prevention. You cannot depend
    on getting hacked unless you turn off your computer and lock it in your panic
    room. Remember that no silver bullet exists in the world of computer security.
    You have to take measures to detect whether and when you get compromised.


    Snort is a network-based IDS. It looks for patterns in your network traffic that
    indicate hacker probes and break-in attempts. Snort isn''t perfect and does report
    false positive alerts. However, that time is well spent because Snort is considered
    to be an excellent IDS by system administrators if you want to use it by system
    administrators and security professionals. Go to www.snort.org


    Intrusion detection requires more ongoing work than any of the security systems
    we discuss in this book. The others, such as firewalls and password protection,
    require some upfront work and then run without much additional work. An IDS, however,
    requires some initial installation and configuration and then continual review.
    You have to monitor an IDS daily if you want it to be of any use to you.


    Tripwire works by securing the fingerprints of files and directories and comparing
    them to subsequent ones. Any differences between the current and original fingerprint
    indicate the file has changed and may have been compromised. The fingerprints,
    and checksums, are unique mathematical values calculated from the contents of
    a file or directory. You can find Tripwire at www.tripwire.com.


    The problem is solved by using a go-between called a certificate authority (CA).
    When you connect to a secure Web server, it sends you its certificate. The Web
    server also subscribes to a CA. The CA has investigated the subscribing server
    and, if satisfied with its authenticity, vouches for its identity. If the CA is
    on your list of known CAs, you accept the certificate and use the public key to
    verify the server''s identity and set the encrypted connection.


    # ### Protecting your Web server with SSL


    A secure Web server requires a certificate. The certificate is used to verify
    the Web server to its clients. The steps in this section describe how to create
    the certificate.'
