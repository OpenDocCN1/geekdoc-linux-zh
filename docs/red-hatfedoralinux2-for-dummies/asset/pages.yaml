  md: '# Introducing Local Area Networks


    The invention of Linux revolutionized computer networking. Creating a LAN before
    Linux was expensive. LANs were the nearly exclusive domain of big corporations,
    universities, and other commercial organizations.


    But the TCP/IP networking protocols were built into Linux from the beginning.
    In the mid-1990s, if you could afford a few PCs, a cheap piece of coaxial cable,
    and a few 10 Mbps (megabits per second) or faster Ethernet adapters, a LAN was
    born. Ethernet adapters, also commonly known as network interface cards (NICs),
    cost about $150 or more at the time; fortunately, they crashed since then, falling
    to faster than a middle-age rock star: A 100 Mbps NIC now costs as little as $10,
    and you can buy a NIC for less than $50 (54 Mbps 802.11g cards for not much more
    than $50)


    To get your Fedora Core computer connected to a network, you have to configure
    a handful of networking subsystems. Here are the tasks that need to be performed
    in order for your networking to work:


    +   - Install your wireless or Ethernet NIC. Most computers, laptops and desktops,
    come with preinstalled Ethernet NICs. Many laptops come with wireless NICs. If
    you need to retrofit a NIC, follow the instructions with the device.

    - Load your wireless or Ethernet NIC kernel module. Fedora Core generally detects
    your hardware and loads the correct kernel modules.

    - Configure your NIC''s IP address, network, and gateway.

    - Configure your Domain Name Service (DNS), which converts Internet names into
    Internet Protocol (IP) addresses.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_107_0.png)


    Wireless networking suffers from some security vulnerabilities. Consult the "Wireless
    network warning" sidebar, later in this chapter.


    Performing these steps requires some "heavy lifting." Your load is eased considerably
    by using the graphical Network Configuration Utility system tool provided by Fedora
    Core. Have fun!


    # Configuring Your NIC with the Fedora Core Network Utility


    To use your Fedora Core computer with an existing local area network (LAN), you
    need a wireless or Ethernet NIC installed on your computer and a network hub,
    or switch, to which to connect the NIC. After you set up the hardware, you need
    to configure your Fedora Core network settings.'
  merge: -1
