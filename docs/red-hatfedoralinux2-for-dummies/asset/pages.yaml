  md: '# Chapter 11: Surfin'' the Net and Groovin'' to Tunes 147


    Anyway, these steps show you how to start playing music:


    +   1. Log in as any user and pop a CD into the CD drive.


    The GNOME CD Player application appears. Depending on how old your audio CD is,
    you may or not see the title information displayed in the CD Player window.


    +   2. Listen as your CD starts playing.


    These steps are the easiest steps in this book. However, if you close CD Player,
