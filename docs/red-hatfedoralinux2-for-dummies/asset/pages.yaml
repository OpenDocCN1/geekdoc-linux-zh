  md: '# Chapter 17: Securing Your Future


    Interactive communication is effective for performing tasks on remote machines.
    For example, the primary way to work on Linux machines was originally via the
    CLI. The CLI is often the best way to perform remote tasks.


    CLI-based communication used to be carried out primarily over the insecure Telnet,
    FTP, and all services used unencrypted connections, and passwords were readily
    detected. The SSH service also used a system of interchange trust. Trust allowed
    hackers, like the infamous Kevin Mitnik, to “own” a network by breaking into one
    machine and then logging in to additional ones without authentication.


    Open Secure Shell (OpenSSH) provides an encrypted channel to perform all tasks.
    Fedora Core bundles OpenSSH by default. We describe first how to use the OpenSSH
    client to communicate with other machines and second, create an OpenSSH server.


    You should (dare we say?) use encrypted channels when communicating over the Internet
    and wireless networks. Both the Internet and Wi-Fi connections are inherently
    insecure, and thus you have to protect your communications.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_266_0.png)


    # Connecting to a Secure Shell server


    Start by using OpenSSH as a client. Suppose you want to log in to your ISP server,
    ssh.mysisp.com, with OpenSSH:


    +   1. Open a GNOME Terminal session.

    2. Enter this command:


    ```

    ssh ssh.mysisp.com

    ```


    Your mileage may vary, of course. You may have to use the -l option if, for example,
    your ISP user account name is different from your local computer. If you use your
    name on your local machine is root, but it is way-of-your ISP, enter this line:


    ```

    ssh -l wayoftthewheel ssh.mysisp.com

    ```


    The first time you connect to a remote server, you''re prompted to accept the
    remote server''s fingerprint.


    +   3. Enter yes when you''re prompted, and you''re logged in.

    4. Enter your password when you''re prompted, and you''re logged in.


    For example, you can now use a text-based e-mail client, like pine, to read your
    messages. This program is useful if you want to read your e-mail securely but
    cannot connect to your ISP with an SSL-enabled Mozilla or Evolution e-mail client.'
