  md: '# Chapter 18: Bringing In the Fedora Core Repairman


    # # Is your Ethernet adapter inserted correctly?


    You have to have an Ethernet adapter to be connected to an Ethernet network. Make
    sure that your Ethernet adapter is plugged in to your computer''s motherboard
    — snugly. Sometimes, you have to pull out the adapter and then reinsert it. The
    process of pulling out an adapter and then plugging it back in is called reseating.


    # # Is your network adapter configured correctly?


    Sometimes a startup script is misconfigured, which causes the startup screen to
    go by without you seeing an error message. If that happens, log in as root and
    from the shell prompt and type this command:


    ```

    ifconfig

    ```


    You see a list of two different interfaces, as shown in the following code, or
    three interfaces if you have PPP configured. The ifconfig command tells the Linux
    kernel that you have a network adapter and gives it an IP address and a network
    mask. This step is the first in connecting your Linux computer to your network:


    +   - eth0 Link encap:10Mbps Ethernet Hwaddr 00:A0:24:2F:30:69 inet addr:192.168.1.1
    Bcast:192.168.1.255 Mask:255.255.255.0 UP BROADCAST RUNNING MULTICAST MTU:1500
    Metric:1 RX packets:16010 errors:18 dropped:18 overruns:23 TX packets:70075 errors:0
    dropped:0 overruns:0 Interrupt:10 Base address:0x300

    - lo Link encap:Local Loopback inet addr:127.0.0.1 Bcast:127.255.255.255 Mask:255.0.0.0
    UP BROADCAST LOOPBACK RUNNING MTU:3584 Metric:1 RX packets:115 errors:0 dropped:0
    overruns:0 TX packets:115 errors:0 dropped:0 overruns:0


    # Checking your wireless NIC


    Linux provides several tools to work with Wi-Fi network interfaces. Fedora Core
    installs the wireless-tools RPM package by default. The tools include iwconfig,
    iwsply, and other utilities. We describe how to use iwconfig to examine your Wi-Fi
    interface configuration.'
