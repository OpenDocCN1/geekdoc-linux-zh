    # Introducing password etiquette


    Your password must be at least six characters long, but you should use at least
    eight characters: The more characters you use, the harder the password is to break.
    If you''re concerned about security, we recommend that you use a combination of
    uppercase and lowercase letters, symbols, and numbers to make your password as
    difficult to compromise. In addition, don''t choose anything you can find in a
    dictionary or names or items that are easy to associate with you. In other words,
    your name spelled backward, your birthday, your dog''s name, or any word in your
    language are all poor choices. Beer, for example, is a poor selection for Jon''s
    password, even though it has both uppercase and lowercase letters, because Jon
    and beer are usually seen in close proximity to each other.


    A good way to come up with a good password is to select a phrase and garble it.
    For example, make "I am not a number" into something like INot#! Even though the
    result doesn''t spell out the phrase in real way, it gives you all the cues to
    remember the random characters ("I" = im, "not" = N0t, "a" = un, and "number"
    = #). Other common substitutions are @ for a, 3 for s, 9 for g, 6 for b, and 5
    for s.


    If you record your password, store it where it won''t get lost and be easily found
    or stolen. For example, save your work passwords at home or store in a locked
    desk or safe. PDAs (personal digital assistants) are a great place to store passwords
    as you use your password protection capability, you can also use encryption software
    to store passwords on PDAs. Do not write your password on a sticky note and attach
    it to your computer monitor!


