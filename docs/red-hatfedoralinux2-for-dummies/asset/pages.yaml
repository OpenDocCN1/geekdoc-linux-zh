    # Entering the Ring of Fire: Burning CDs


    Back in the 1980s, when vinyl melted away under the invasion of CDs, building
    the factories to create the CDs cost megabucks; back then, it took a huge effort
    to make a CD. Now, for roughly the $100 it to purchase a CD burner (to burn means
    to record to CD), you can build your own, personal factory. Amazing!


    If you don''t have a CD burner (or writer), this section doesn''t do you a bit
    of good. Sorry.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_170_0.png)


    # Using the Nautilus burn::: utility


    Nautilus provides an alternative CD-burning utility. Just insert a CD-R or CD-RW
    into a CD-drive and Nautilus does the rest. These steps describe how to use the
    system:


    +   1. Log in as any user and insert a CD-R or CD-RW disc into your CD writer
    driver.

    2. Double-click your home directory icon, in the upper-left corner of your desktop.

    A Nautilus window opens, showing the contents of your home directory.

    3. Click and hold any file or directory and drag it to the burn::// window.

    All the files and directories are displayed in the burn::// window; those files
    and directories aren''t really copied, but instead are linked to the burn:://
    window.


    +   4. Click any and all of the files and directories to highlight them.

    Selecting a file or directory enables it to be written to CD.

    5. Click the Write to CD button and you''re off to the races.

    After a little thought, the Writing CD dialog opens.

    6. When the CD is write finished, the disc is ejected by default. Click the Close
    button when you''re finished.

    7. Close the CD tray by pushing it back into the drive.

    A Nautilus window opens, showing the contents of the disc you just finished writing.'
