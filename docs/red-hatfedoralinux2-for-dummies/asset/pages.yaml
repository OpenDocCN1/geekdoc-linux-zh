    configuration you set in Chapter 3 or 4.


    +   - **System Logs**: Shows the contents of your system logs.


    +   - **System Monitor**: Displays information about your computer''s running
    processor. This utility also shows the recent history of your computer''s processor
    and memory usage.


    +   - **Terminal**: Starts the GNOME Terminal. You can use the Terminal to interact
    nongnraphically with your computer. Refer to Chapter 4 for information about using
    the Terminal.


    +   - **Traceroute**: Displays each hop used to communicate with a networked machine
