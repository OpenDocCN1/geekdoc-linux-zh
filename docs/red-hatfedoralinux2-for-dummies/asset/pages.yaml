- img_proc: true
  md: '# Chapter 18: Bringing In the Fedora Core Repairman


    Every problem has a solution. Computers are cause-and-effect-based machines. When
    something breaks or doesn''t work, there''s always a reason. The reasons may not
    be easy to find, but they exist.


    How do you find the cause? That''s a million-dollar question. Getting a million
    bucks isn''t easy unless you''re willing to grind your teeth, plot against your
    fellow contestants for weeks on a remote island, purchase 10 million PowerBall
    tickets, or - believe it or not - work hard and work smart. Some people are willing
    to eat rats for the chance at a million bucks or lucky enough to win the lottery,
    but most just have to work hard. Oh, well.


    Working hard is conceptually easy, but how do you work smart? This concept is
    where the idea of the fault tree comes into play. The fault tree is a conceptual
    aid that helps you eliminate all the real cause of your problem. The fault tree
    looks like an upside-down tree, where the trunk of the tree represents the fault,
    or problem. The edges, or leaves, of the branches represent all the possible cases.
    After that''s done, solving the problem is virtually guaranteed.


    For example, Figure 18-1 shows a fault tree that points out which major subsystems
    you should examine. To find the solution to a problem, you have to systematically
    identify what''s working. You work your way to what''s not working and when you
    find it, you usually solve your problem. The fault tree simply helps to formalize
    the process of solving.


    # Start debugging


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_288_0.png)


    Here are some possible faults:


    +   * The first branch on the left involves problems with the physical connection.
    Do you have a malfunctioning network adapter or switch/hub? Is the cable not connected
    properly to the adapter? In that case, jiggle the cable or fuss with the connector.
    Do you have a break in the cable or a loose connector?'
