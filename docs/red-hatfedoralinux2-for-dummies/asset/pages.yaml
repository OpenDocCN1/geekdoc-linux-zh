    # Discovering Your Windows NT, Windows 2000, or Windows XP Hardware


    Discovering information about Windows NT, Windows 2000, and Windows XP is similar
    to discovering it about Windows 95 and Windows Me. The process is the same, although
    getting there is a little different:


    On Windows NT and Windows 2000 computers


    +   1. Click the Start button and choose Settings: Control Panel. Then, double-click
    the System icon in the Control Panel window.

    2. Click the Hardware tab when the Systems Properties window opens. Then, click
    the Device Manager button to open the Device Manager window.

    3. Click the plus (+) sign of any hardware subsystem you want to examine. A submenu
    opens, showing you all devices of a particular type.

    4. Right-click any hardware subsystem and choose Properties. The Properties option
    shows you information about that particular device.


    On Windows XP computers


    +   1. Click the Start button and choose the My Computer option.

    2. Double-click the Control Panel icon.

    3. Double-click the System icon, select the Hardware tab, and then double-click
    the Device Manager button. The Device Manager window opens.

    4. Click the plus (+) sign to display the devices within a subsystem.

    5. Right-click a device to open a menu from which you can choose the Properties
