  md: '# Chapter 5: Dial-Up Modems Still Get the Job Done


    # If you''re buying a modem


    Dial-up modems are an old technology, but still the most common method for making
    personal or small-business Internet connections. This state may not be true much
    longer because the number of users with broadband connections is rising fast,
    and most large businesses also use broadband services.


    Internal modems are generally less expensive than external ones, but external
    modems have several advantages. You can easily turn them on and off, and you can
    connect them to a computer without opening the computer case, and if your phone
    line is struck by lightning, the charge passing through the modem doesn''t damage
    your computer. On the other hand, internal modems need only a telephone line cable,
    whereas external modems require a telephone line, and power-supply cables.


    An internal modem plugs into a PCI or ISA slot on your motherboard, or a PCMCIA
    slot for the computer. An external modem comes in its own enclosure, requires
    its own power supply (those clunky, bulky plugs), and connects to the computer
    via a serial (RS232) connection. Both types of modems use your phone jack to connect
    to the Internet.


    Avoid WinModems because they''re designed for Windows computers. WinModems are
    cheaper than other modems because they rely on the operating system to manage
    of their work for them. This generally makes them incompatible with Linux computers.


    If you choose your Internet Service Provider and arrange payment, the ISP provides
    certain pieces of information, including


    AccessFree provides a nice combination of free and subscription Internet service.
    If you register, you get your first 10 hours of service per month free. You''re
    charged on an hourly basis up to $9.95 over 10 hours. You can also subscribe for
    unlimited dial-up access for $9.95 per month; subscribing gives you telephone
    support (866-693-7334) that costs $5 per call otherwise. (That''s not bad either!)
    AccessFree also provides local dial-up and PPP access in U.S. cities.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_86_0.png)'
