  md: "# Exchanging keys makes your life easier\n\nYou use OpenSSH by default to log\
    \ in to a remote user account using traditional passwords. However, OpenSSH can\
    \ use a second authentication method that takes a little work to get started saves\
    \ work in the long run.\n\nOpenSSH provides an authentication method named public-key\
    \ cryptography. This system uses one public and one private key. You install the\
    \ public key on the remote system and keep the private key on your computer. The\
    \ public key can be shared with anyone — hey, it's public. The private key must\
    \ be kept secret at all costs. In fact, OpenSSH encrypts the private key by default.\
    \ You must use a pass phrase (essentially a password with spaces) to decrypt the\
    \ private key before using it.\n\nWhenever you want to log in or communicate with\
    \ the remote computer, the keys are used to negotiate the process. The public-private\
    \ key system ensures that your user account is authenticated and is also the initiating\
    \ host; passwords authenticate only your login account, not the computer you're\
    \ connecting from.\n\n# Setting up for a public-key cryptographic key exchange\n\
    \nTo set up the key exchange, follow these steps:\n\n+   1. Log in to your user\
    \ account on the local computer.\n   For example, log in as the user rod on GNOME\
    \ Terminal session.\n\n+   2. Run this command:\n\n```\n```\nsh-keygen -t dsa\n\
    ```\n```\n\nThis step starts the program that generates your public and private\
    \ keys. Several encryption methods exist: DSA (Digital Signature Standard) and\
    \ RSA (named after Ron Rivest, Adi Shamir, and Len Adleman) are the most popular.\
    \ DSA is a nonproprietary algorithm, whereas RSA was until recently patented.\
    \ Even though RSA is available for public use, we recommend using DSA.\n\nThe\
    \ program thinks for a moment and returns this output:\n\n```\nEnter file in which\
    \ to save the key\n(/home/rod/.ssh/id_dsa):\n```\n\nThe keys are saved to the\
    \ .ssh directory in your home directory. The default should be okay, so press\
    \ the Return key.\n\n![](img/85ec3de0d5219d6ca14d5778e16a3338_270_0.png)"
