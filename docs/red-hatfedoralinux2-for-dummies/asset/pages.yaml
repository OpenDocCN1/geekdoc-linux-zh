    # Installing Ice2 and Icecast2


    In this section, we tell you how to install other applications and services. Neither
    Ice2 or Icecast2 use RPM packages, so you have to build them from scratch.


    Building from scratch in the Linux world requires that you follow these general
    steps:


    +   1. Configure. The first step requires configuring the software. The generation
    process builds dependency files. Several Linux systems that do this are available.
    Icecast2 and Ice2 use a configure script.


    +   2. Compile. After the software is configured, you have to compile it. Compiling
    is a universal process that changes source code into executable code. Source code
    is readable by human beings — well, at least the class of humans as nerds. Compiling
    source code changes it into a form that computers can understand. All applications
    are compiled from source code.'
