    # Running Notepad and Wine File


    The Wine package you just installed, if you have read the preceding section, contains
    several simple Windows applications. The applications are emulated versions of
    the applications. The Wine contributors have done the work to duplicate the functionality
    in addition to the look and feel in order to provide some immediate gratification.


    We take advantage of the situation by demonstrating a couple of programs. These
    steps describe how to run the Notepad and file manager programs:


    +   1. Log in as a regular user (not root).


    +   2. Click the GNOME Menu and select Run Application.


