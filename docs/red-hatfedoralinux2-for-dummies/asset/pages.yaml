    # Configuring an OpenSSH server


    Configuring an OpenSSH server is straightforward. You only have to modify the
    /etc/ssh/sshd_config file and run the /etc/init.d/sshd script. Take a look at
    the configuration file, the important parts of which are listed in these bullets:


    +   Remove the older and faulty protocol version: Version 1 is broken and should
    not be used (change the parameter Protocol 2,1 to Protocol 2, as shown in this
    example):

    Port 22

    Protocol 2

    # HostKeys for protocol version 2

    HostKey /etc/ssh/ssh_host_rsa_key

    HostKey /etc/ssh/ssh_host_dsa_key


    +   Remove the comment in front of the login grace-time parameter: This action
    sets a limit on the length of time from when you start a login and the time you
    complete it:

    LoginGraceTime 600


    +   Disallow root logins: You should prevent users, including yourself, from logging
    in directly as root. Forcing users to first log in as a regular user and then
    "Su-ing" to root provides an audit trail that can be used to see who did what
    as the root user; it also forces everyone to jump through two hoops before becoming
    the all-powerful root user:

    PermitRootLogin yes

    StrictModes yes'
