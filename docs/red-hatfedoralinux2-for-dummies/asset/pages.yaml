    > REMEMBER We strongly advise protecting your Internet connection with either
    the default firewall, installed during the installation process, or the one described
    in Chapter 8. The default firewall should automatically run on your Fedora Core
    unless you choose not to install it in Chapter 3 or explicitly turn it off. We
    prefer that you install the more secure firewall described in Chapter 8; nothing
    is wrong with the default firewall, but it''s more permissive than ours. You can
    verify that your firewall is active by running the command /etc/init.d/iptables
    status.


    # The DSL Option


    The world is wired for telephones, that is. DSL modems take advantage of this,
    but common, and appropriately named Plain Old Telephone Service (POTS) to provide
    a high-speed Internet connection to consumers. The DSL option uses special equipment
    to pump much more data through the POTS lines than a traditional analog modem
    does.'
