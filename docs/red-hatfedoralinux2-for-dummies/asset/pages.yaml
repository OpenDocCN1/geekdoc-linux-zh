  md: '# Chapter 10: Gnowing More GNOME


    # # Using Evolution with your PDA


    You can use the Evolution calendar, to-do manager, and contact manager with your
    PDA. In this section, we concentrate on showing how to use Evolution to back up
    your PDA because that''s one of more interesting and fun things you can do. You
    can find out more about using the calendar by reading the online Evolution documentation
    (choose Help or visit www.gnome.org/gnome-office/evolution.shtml) or by simply
    experimenting with it.


    You can use the Evolution pilot-link utility to back up your PDA databases for
    your computer. Follow these steps:


    +   1. Plug your cradle into your computer''s serial port or USB port, depending
    on the type of PDA.


    The cable attached to your cradle has a female 9-pin (a DB9) plug attached to
    it. Most, if not all, modern computers have a 9-male plug that connects to a serial
    port socket controlled by the /dev/ttyS0 Linux device. (In the Windows world,
    /dev/ttyS0 is equivalent to COM1, /dev/ttyS1 is COM2, and so on.)


    If you''re using a USB-based cradle, the port is /dev/ttyUSB0 or /dev/ttyUSB1.


    +   2. Click the Evolution icon on the GNOME panel.


    The Xianian Evolution (revolution?) application opens.


    +   3. Click the Contacts button and choose Pilot settings from the Tools menu.


    The Welcome to GNOME Pilot Wizard window opens.


    +   4. Click the Forward button and the Gnome Pilot Settings window opens, as
    shown in Figure 10-5.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_158_0.png)'
  merge: -1
