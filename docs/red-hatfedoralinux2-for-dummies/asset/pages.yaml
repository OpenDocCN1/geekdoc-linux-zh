  md: '# 346 Part VI: Appendixes


    The package manager displays all the Red Hat package groups that are installed
    by default on your system. Individual packages are organized into groups, such
    as the X Window System and GNOME. When the check box to the left of a group is
    active, designated by a plus sign (+), one or more packages from that are installed.
    The number to the right of the package group shows how many packages of the total
    in that group are installed.


    Clicking the Details option opens the GNOME Desktop Environment Package Details
    window, which shows all the base and optional packages in the group; short, one-line
    descriptions of each package are also displayed next to each package. Base packages
    are always installed with a package group. Optional packages are well, optionally
    installed.


    This may be for a Dummies book, but you, course, are no dummy. It''s obvious that
    the GNOME RPM buttons, displayed along the top of the RPM window, are used for
    them. This section describes how to use them for their intended functions.


    # Installing an RPM package from the DVD


    When you install your Fedora Core system, all the software that is copied to your
    hard drive from the DVD comes from RPM packages. When you want to add software
    from the companion DVD or an RPM repository, such as www.freshmeat.net, or from
    Red Hat, at www.redhat.com, you can do so by using the Install button. To install
    an RPM package from a CD-ROM, follow these steps:


    +   1. Start the package manager: Choose System Tools-Add/Remove Packages.


    Enter the root password in the Information window, if you''re prompted.


    +   2. When the Add and Remove Software window opens, select the package-group
    you want to install.


    For example, if you want to install the Mozilla e-mail client, you have to do
    some exploring first. Scroll down to the Graphical Internet package group. The
    short description next to the package group says "This group includes graphical
    e-mail, Web, and chat clients," which indicates that you are on the right path.


    +   3. Click the Details button to find out the details of the package you''re
    installing.


    For example, select the Graphical Internet group and the Internet Package Details
    window opens. You see that the Mozilla mail client is included.


    +   4. Select the radio button next to the menu option.


    +   5. Click the Close button to return to the Package Management window.'
