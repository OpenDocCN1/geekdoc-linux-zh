  md: '# 302 Part V: The Part of Tens


    # How Many Daemons Can Dance on the Head of the Linux Process Table?


    Every software company wants to make its operating systems easy to install and
    use. Operating systems are inherently complex animals, and Linux is no exception.
    (Of course, we''re not biased when we say that Linux is, overall, a simpler system
    than Windows, whether you measure simplicity by the number of lines of code or
    the transparency — the open source concept — of its design.) Companies walk the
    tightrope of making systems easy to use and also making them reasonably secure
    — they sell more copies when they make it simple but buy your wrath when you get
    hacked.


    Ease of use and security don''t get along. Your operating system is much easier
    to use, for example, if you install and activate every software package and option.
    On the other hand, running every software package means that you have more potential
    vulnerabilities. Entering your own house is a breeze if you install 10 doors and
    20 windows, but the convenience provides burglars with juicy opportunities. The
    same logic applies to your computer''s operating system: The more software you
    install, the more chances someone has of breaking into your computer.


    We don''t know of a cure-all for this dilemma. The best answer a security viewpoint
    provides is not provide intruders with any openings: Place your computer in a
    locked room with no network or external connections and turn it off. You then
    have a truly safe system whose only job is to hold the floor down.


    With most things in life, the best answer is to learn the security basics and
    then use your best judgment to balance security with convenience. Run only the
    services you need. For example, don''t run the Samba file system server if you
