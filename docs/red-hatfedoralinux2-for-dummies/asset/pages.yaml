  md: '# Chapter 4: Starting Up with Fedora Core


    If you chose (during installation) not to have the X Window System start automatically
    whenever you boot your system, you see the `login:` prompt.


    If you make a mistake typing the password or your login, the system asks you to
    retype it.


    We strongly recommend that you do most of your experimentation with Fedora Core
    as a privileged user and log in as the root user only when necessary. By operating
    as root, you run the risk of corrupting your system, having to reinstall again,
    or losing data because you can change or alter anything and everything. When you''re
    logged in as a regular user, you can accidentally erase your own files and data,
    but you cannot erase someone''s files or system files.


    Fortunately, Fedora Core provides many administrative utilities you can start
    as a privileged user. Each Fedora Core administrative utility prompts you to enter
    the root password as it starts and performs its specific function, but only that
    function, with root privileges. You are prevented, from doing unintended damage
    to other systems. (See Appendix C for information about how file permissions work
    and how you can modify them.)


    # Using Graphical and Text-Based Applications and Utilities


    Fedora Core installs the graphical Window System (or simply X) by default. You
    can perform most administrative tasks with the GUI-based tools (GUI stands for
    graphical user interface) that Fedora Core provides. Most of the how-to instructions
    in this book use the X-based applications and utilities. We do that because they''re
    generally easier to use and because this book wasn''t written for system administrators.


    Occasionally, a utility or program doesn''t run graphically. Believe it or not,
    some geekier users prefer to use a text-based system. If you''re not familiar
    with doing some basic administrative tasks with a text-based system, we don''t
    recommend using one just because you can. Not being a geek is okay. We still like
    and respect you. On the other hand, it makes good sense to know some basics, just
    in case you have to somew it with the text-based interface.


    Text-based interfaces are generally run from a *shell*, which acts as a text-based
    interface between the Fedora Core operating system and you. The bash shell, which
    Fedora Core uses by default, displays a prompt, like this: `[Lidia@cancun Lidia$]`.
    You enter commands at the shell prompt. That''s where the command-line interface
    (CLI) comes from.'
