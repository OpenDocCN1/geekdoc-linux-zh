  md: '# # Chapter 6


    # # Broadband Rocks!


    # ## In This Chapter


    +   - Understanding broadband Internet connections

    - Using a Cable modem connection

    - Using a DSL modem connection


    You''re probably familiar with the ubiquitous dial-up Internet connection: You
    log on to the Internet, hear that screeching modem sound and — Presto! Whammo!
    — you''re online. If you''re lucky, the entire dial-up process takes less than
    a minute, but it can take longer. And then there''s the fact that Web pages take
    so-o-o-lo-o-ng to finish downloading.


    You have a better way to get online, called broadband. *Broadband* is a generic
    term for high-speed cable TV and digital subscriber line (DSL) connections. Cable
    connections are provided by cable television companies, and DSL by your telephone
    company. Both are much faster than dial-up connections, and both have their advantages
    and disadvantages.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_92_0.png)


    The *broad* in broadband means that wires and cables that connect a modem to the
    Internet have a *bandwidth*, they can handle more data at faster speeds and with
    greater reliability. Plain old telephone service (POTS) was created for transferring
    analog voice data. Needless to say, POTS just doesn''t as well as broadband media
    when it connects to the Internet.


    The two most popular broadband connections you can use are cable modems (which
    use your existing cable television lines to transfer data) and DSL (which use
    your POTS lines). Broadband connections work from roughly 100obits per second
    (Kbps) to several million bits per second (Mbps); a *kilobit* is a thousand bits
    per second, and a *megabit* is a million bits per second. That''s enough to transfer
    graphics-rich Web pages in a few seconds; it''s also enough to listen to audio
    streams or to watch a low-resolution video stream.'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# 72 Part II: Got Net?


    If you''re ready to make the switch to a DSL or cable Internet connection, believe
    us when we tell you that you will never want to go back to a dial-up modem. This
    chapter describes how to obtain and configure a broadband connection.


    We recommend avoiding ISDN (Integrated Services Digital Network), satellite, and
    mental-telepathy broadband Internet connections. First, ISDN technology is old
    and is rapidly being replaced by DSL. ISDN is also difficult to configure and
    isn''t much faster than a dial-up modem connection. Satellite Internet connections
    are just now being introduced and suffer from problems, such as transmission delays
    (latency), that wreak havoc with your communications. Some people say that mental
    telepathy (MT) works great, but we don''t think that Intel makes an MT chip yet.


    # Introducing DSL and Cable Connections: The Difference Is in the Wiring


    Although the voice-based telephone network is now modern in many ways, its under
    haven''t fundamentally changed since the early twentieth century. The telephone
    network consists of pairs of copper wire that connect homes and businesses with
    a telephone company''s central offices (CO). The phone company uses switches in
    its COs to connect you to your destination when you make a call. The switches
    are designed to limit the range of frequencies, called bandwidth, that a phone
    call can use. The bandwidth is roughly 3,000 cycles per second (Hz), enough to
    recognize a voice, but not much more. Those limits prevent today''s analog modems
    from pushing more than approximately 56,000 bits per second, or 56 Kbps, through
    the telephone network. (That 56 Kbps speed varies, mostly downward, depending
    on the condition of the copper wires you''re connected to.)


    What does all this mean to you? Improve your modem and the wiring, and you get
    faster Internet access. Two of the most commonly used broadband are


    +   - Cable television (CATV): Although CATV companies don''t provide service
    to many residences and businesses as the telephone companies do, their fiber and
    coaxial cable networks can carry much more bandwidth than telephone wire cans.
    CATV networks don''t have the 3 to 4-mile limits that DSL has. Typically, you
    can get an Internet connection through your CATV company if the company offers
    it and only if the company serves your neighborhood.'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'Digital subscriber lines (DSL): DSL is designed to avoid the restrictions of
    the traditional telephone system by making an end run around the low-speed voice
    switches. DSL uses the existing telephone wires (known as POTS), which connect
    your home to the nearest CO, to carry your Internet communication. After you''re
    connected to the CO, however, your Internet communication is routed through a
    high-speed digital switch rather than through the voice equipment. By avoiding
    the voice equipment, you can achieve many times the speed of a dial-up modem.


    The main limitation of DSL is that traditional copper wire can carry a high-speed
    connection for only a few miles. Your telephone company can tell you whether it
    can provide you with service.


    # The Cable Modem Option


    Cable companies have invested lots of capital (much more than telephone companies,
    so (far) to upgrade their networks in order to gain Internet market share. Their
    effort has paid off for consumers, and many places in the United States now have
    access to high-speed Internet connections.


    However, you have to consider some downsides:


    +   - Unfortunately, not all cable companies have caught up with twenty-first
    century technology. Many companies may provide you with TV service, but not with
    Internet service.

    - Many people don''t live in an area served by cable TV. Internet cable is not
    a good medium to provide services such as Web page hosting.

    - Your company may require you to connect to your ISPs (or use an independent
    ISP that it approves of). Many people like to use an independent ISP because they''re
    familiar with it or it provides better service. Using your own ISP also makes
    it easier to set up your computer (or network) to provide services going out to
    the Internet. Cable companies cannot prevent you from using a different local
    ISP, but they don''t charge you less so you end up paying for two services, one
    of which you''re not using.

    - Relatively few cable companies support Linux. You may get a connection, but
    you''re on your own if you need to troubleshoot problems, even problems that have
    nothing to do with Fedora Core but still affect your machine.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# 74 Part II: Got Net?


    If you decide that cable access is the right choice for your Internet access needs,
    here''s an overview of the process for connecting your Fedora Core computer to
    the Internet via a cable modem:


    +   1. Do some research and subscribe to an ICP service.


    Locate an Internet Cable Provider (ICP) — usually, your existing cable TV company
    — and subscribe to its ICP service.


    +   2. Make a hardware commitment.


    Obtain an Internet cable modem through your ICP, Many ICPs provide cable modems
    as part of their service. Otherwise, you can purchase a modem from the ICP or
    a consumer electronics store.


    +   3. Get registered.


    Register the cable modem with your ICP. You have to register your modem with your
    ICP. During the registration process, your computer is assigned a network address
    to connect to the ICP. Network addresses are called Internet Protocol (IP) addresses.


    You register your modem by giving the ICP the modem''s Media Access Control (MAC)
    address. The ICP generates an IP address by using the MAC address as its reference.
    You don''t need to do anything to your cable modem. The registration process is
    all done by your ICP, and your modem automatically is assigned an IP address.
    You''re ready to use your cable modem to connect to the Internet. Woo-hoo! Blazing
    speed is yours now!


    +   4. Set up the cable modem.


    Cable modems have two connectors: a 75-ohm coaxial port and a twisted-pair (RJ-45)
    connector (the coaxial connector is the same type that''s used for cable TV; the
    RJ-45 connector looks like a large telephone plug):


    +   - Connect a coaxial cable from the cable modem''s port to the cable jack on
    your wall, just like you would do with a TV set.


    +   - Connect a network cable from the RJ-45 port to your Fedora Core computer.
    Normal network cables (referred to as Category 5) may not work, depending on how
    the modem uses a single Ethernet connector rather than multiple Ethernet ports
    that are part of a switch. If you uses the former, you need to use a crossover
    cable if you want to directly connect a computer to a cable modem. You can use
    normal Category 5 cables if the cable modem incorporates a network switch or if
    you connect the modem through a separate Ethernet hub or switch.


    +   5. Set up your Internet protocols.


    Configure your computer to use DHCP on the network interface that connects to
    the modem. Restart your computer''s network interface, and you should be good
    to go.'
