    use it. For example, you can be logged in at the computer console (the attached
    keyboard and monitor) while someone else is logged in via a network connection.
    Therefore, you every other user need a user account in order to use the computer.
    Each account requires an individual account name and password to protect your
    information and keep your tasks separate from other people''s tasks.


    If you have to add new users (if you have a home network, for example) or you
    forget to create a nonroot user during installation, this section shows you. Fedora
    Core offers both graphical and text-based user account creation and modification
    tools for your convenience. The following two sections describe how to use both
    types of utilities.


    > TIP You can use the Fedora Core User Manager to modify an existing user account.
    Click the user name and then the Properties button, and a window similar to the
