  md: '# Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    # Wine utilities


    Wine provides several useful utilities that help you to configure and test it,
    and we describe some of: speak. You need to use this utility only if you''re developing
    a Wine application.


    +   **wineboot**: Simulates the rebooting of a Windows computer. Rebooting is
    necessary whenever you''re installing numerous Windows applications (for example,
    Microsoft Word), and this utility provides that function.

    **winecfg**: Helps set many Wine configuration options.

    **clock**: Duplicates the simple Wine clock.

    **regedit**: Duplicates the Registry editor.

    **progman**: Functions as a program manager.


    +   **winedbg**: Debugs Wine applications. This utility shows what''s going on
    under the surface, so to You try running one of the Wine utilities. For example,
    test the wine utility, which acts as a file manager.


