  md: '# Using Linux Network Tools and Services


    Linux computers can provide many powerful and flexible network services. Your
    Fedora Core 2 DVD comes packed with the tools to provide these services:


    +   - Apache Web server: Of all the Web servers on the Internet, the majority
    are run by the open source Apache Web server. You can start a simple Web server
    by simply installing the bundled Apache software from this book''s companion DVD.


    +   - OpenSSH: The open source version of Secure Shell (SSH) enables you to communicate
    securely across the Internet. Secure Shell is much safer than Telnet because Secure
    Shell encrypts your communication (even when you log in to other computers), making
    much slimmer the chance that others can discover your passwords and other sensitive
    information. OpenSSH also provides other authentication and security features
    and enables you to securely copy files from machine to machine. With OpenSSH,
    you can prevent people from listening to your communication.


    +   - Internet-accessing utilities: Fedora Core provides several configuration
    utilities that help you connect to the Internet. The utilities help you to configure
    DSL, cable modems, and plain old telephone modems to connect to the Internet.
    They also help you to connect to local area networks (LAN) using Ethernet adapters.


    +   - Firewalls: A firewall is a system that controls access to your private network
    from any outside network (in this case, the Internet) and controls access from
    your private network to the outside world. To keep the guys out, Fedora Core provides
    protection by giving you the tools to build your own firewall. Fedora Core is
    flexible in this regard, and many software packages are available, including the
    popular and simple-to-use netfilter/iptables filtering software, which is included
    on this book''s companion DVD. Chapter 8 covers using and modifying the default
    Fedora firewall.


    This list is just a sample of the network-y things you can do with Fedora Core.
    We describe many of them in this book, but it takes much more exploration to find
    them all!'
