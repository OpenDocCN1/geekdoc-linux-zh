    # Installing Linux kernel headers


    VMware makes use of Linux kernel modules, which are similar to Windows device
    drivers, to interact with the host computer. VMware ships kernel modules that
    automatically work with some versions of Fedora Core. However, we cannot be certain
    that those modules match your Linux kernel — the one that ships with this book.
    Therefore, the following steps help you build your own VMware kernel modules.


    Building VMware modules requires the presence of Linux kernel headers, which may
    not be installed on your computer. You need to install the headers by installing
    the Linux kernel source RPM package. Follow these steps:


    +   1. Insert the companion DVD into the DVD/CD-ROM drive.

    2. Click the GNOME Menu button and choose System Tools: Terminal.

    3. If you''re not logged in as root, run the following command:

    4. Enter the root password when you''re prompted.

