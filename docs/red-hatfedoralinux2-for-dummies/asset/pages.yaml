  md: '# Introduction


    Red Hat Fedora Linux 2 For Dummies describes how to install and use this popular
    and powerful Linux distribution for fun and profit. Fedora Core is the successor
    to Red Hat Linux. Fedora Core 1 was essentially Red Hat Linux 10, and you can
    think of Fedora Core 2 as Red Hat Linux 11.


    Let''s back up a little and mention that a Linux distribution (the core software,
    also known as an operating system, that controls your computer and all its supporting
    applications and utilities installation and configuration software that helps
    you get work done and have fun with your computer. The word Linux has traditionally
    been used, shorthand to mean a Linux distribution.


    Why is this Linux distribution named Fedora Core? What do a fedora and a core
    have to do with Linux? Well, the company Red Hat, Inc., recently decided it was
    time to concentrate on its core business, which is centered on its commercial
    product Red Hat Enterprise Linux. Red Hat merged its “free” Red Hat distribution
    with the Fedora Linux Project to create the Fedora Core Project. The Fedora Linux
    Project previously concentrated on developing third-party Linux-based applications
    and utilities.


    The Fedora Core Project is an open source project. Open source describes all software
    that is published under the GNU Public License (GPL) and other similar licenses.
    Open source software gives you (and everyone) access to the underlying source
    code and permits you to use, modify, and redistribute (for free or a fee) the
    code. The only restriction is that you cannot prevent people from doing so. Under
    the new arrangement, Red Hat maintains editorial control over, and provides resources
    for, the Fedora Core Project, and the community of Fedora Core users and developers
    get a larger technical development role.


    Less talk, more rock! Red Hat Fedora Linux 2 For Dummies will help you install
    and use the immensely popular Fedora Core 2 on your personal computer. We show
    you how to get work done and also do fun stuff. This book is also designed to
    be an effective doorstop or coffee cup coaster. Whatever you use it for, we hope
    that you have fun.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# About This Book


    Red Hat Fedora Linux 2 For Dummies is designed to be a helping-hands resource.
    It provides a place to turn for help and solace in those moments when, after two
    hours of trying to get your network connection working, your dog bumps into your
    desk and knocks the book onto your computer, jiggling the network cable — and
    it magically starts working.


    We tried our hardest to fill up this book with the things you need to know, such
    as how to


    +   - Install Fedora Core 2.

    - Get connected to the Internet by using broadband DSL and cable modems or old-fashioned
    dial-up modems.

    - Get connected to your local area network (LAN).

    - Build a simple but effective firewall.

    - Build Internet and LAN services, as Web pages and print servers.

    - Use Red Hat Linux to play CDs and listen to Internet radio stations.

    - Use the GNOME desktop environment.

    - Take advantage of useful and usable applications, such as the OpenOffice desktop
    productivity suite, Evolution desktop organizer and e-mail client, and streaming
    multimedia MPlayer.

    - Work with the OpenOffice desktop productivity suite to satisfy your word processing,
    spreadsheet, and presentation needs — (and, possibly, the commercial Wine enhancer
    CrossOver Office) and use Microsoft Office directly from your Fedora Core computer!

    - Upgrade your computer and network security.

    - Know where to go for help.

    - Manage your Fedora Core workstation.


    You also encounter troubleshooting tips throughout this book. Chapter 18 is, in
    fact, devoted to the subject. The fact is that Fedora Core is all much trouble,
    but we want you to be prepared in case you run into bad luck or unusual situations.


    The instructions in Red Hat Fedora Linux 2 For Dummies are designed to work with
    the version of Fedora Core you find on this book''s companion DVD; we also describe
    how to download several software packages not found on the'' DVD. Feel free to
    use other versions of Fedora Core, or even other Linux distributions, but be aware
    that our instructions may not work exactly or even at all. Good luck!


