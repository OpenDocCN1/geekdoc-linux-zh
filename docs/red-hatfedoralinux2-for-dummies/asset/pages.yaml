  md: '# The ABCs of switches and hubs


    Switches are better than hubs because switches are more secure and faster.


    Suppose that your network consists of three machines — A, B, and C — all connected
    to a switch. When Machine A wants to communicate with Machine B, the switch transmits
    the network traffic from A to B. Machine C is out of the loop. By making sure
    that C doesn''t know what A and B are saying, the switch keeps network communication
    private. Hubs, on the other hand, broadcast network traffic from one machine to
    all machines connected to the hub. When A sends information to B, the hub broadcasts
    that information to both B and C.


    Switches are faster than hubs because network traffic flows only between the machines
    that are talking to each other. The computers that aren''t talking to each other
    don''t use the switch''s *bandwidth* (the maximum rate at which information can
    be transmitted). For example, when Machine A is sending information to Machine
    B, Machine C doesn''t slow up the communication speed by sucking up the bandwidth.


    # Wiring your network with, yes, wires


    This section describes how to build a wired network. You can mix wired and wireless
    networks, but, for simplicity, we describe how to build a pure wired or wireless
    network.


    Way back in prehistoric times (circa 1996), you had to be technically savvy to
    wire your own network. Wiring consisted of coaxial cables like those used for
    cable TV connections. Coaxial cables are bulky and require you to use special
    tools to attach the connectors to the cable ends.


    Life is easy now. Wiring your network requires that you obtain Cat 5 cables, similar
    in appearance to telephone cables. Cat 5 cables are manufactured with telephone-like
    connectors that are a snap (pardon the pun) to use. No, no fuss.


    You can buy Cat 5 cables at any electronics store. They come in many colors and
    sizes. Cat 5 cables aren''t cheap, but they''re not terribly expensive either.
    They''re reliable and much easier to work with than coaxial cables.


    You have to use a network switch or hub in conjunction with Cat 5 cables. Switches
    and hubs are the glue that holds your network together. Both switches and hubs
    connect individual computers so that they can communicate with each other.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_221_0.png)'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Chapter 15: Building Your Own, Private Network 201


    Most, if not all, networking equipment is now based on the Ethernet protocol.
    Ethernet is inexpensive and readily available. You can purchase it from any consumer
    electronics store, mail-order catalog, or computer seller. You don''t need to
    know any of the technical aspects of Ethernet because it requires no configuration.
    You need to know only that an Ethernet connector looks similar to a telephone
    jack. However, Ethernet and telephone jacks aren''t compatible.


    For your network, start by connecting your machines to a central switch. (You
    can use a hub, if you want.)


    Although you can connect as many computers as your switch or hub can handle, keep
    the job as simple as possible, these steps describe how to wire computers, Cancun
    and Veracruz. These steps assume that you have a switch hub and at least two Cat
    5 cables:


    +   1. On your first computer, plug one end of a Cat 5 cable into the Ethernet
    network interface connector (NIC) on the back of the machine.


    +   2. Plug the other end of the cable into the switch.

    A green light should appear near the connector you used on the switch. The green
    light indicates that you have link status, indicating that an Ethernet connection
    has been established: You have an active connection between the computer and the
    switch.


    If you don''t get link status, make sure that both connectors on the cable have
    been properly inserted. Pull each connector out and firmly press it back in (called
    resetting).


    If this suggestion doesn''t fix the problem, make sure that the cable is working
    correctly. Check the cable for cracks and cuts, for example. Check the cable''s
    connectors for loose wires. Substitute another cable, if possible, using a cable
    that you know works can help you determine whether suspect cable is at fault.


    If neither of these options work, you may have a broken switch, cable, or Ethernet
    NIC, or any combination. You may have to replace either or all of the devices
    to determine the real problem. Perhaps you can borrow a known good cable and NIC
    from a working network and use them to eliminate the problem.


    +   3. Repeat Steps 1 and 2 for each additional computer.


    After you have successfully connected all your computers to the switch, you can
    proceed to the section "Building an Internet Gateway," later in this chapter.
    That section describes how to build an Internet gateway on a Linux computer. The
    Internet gateway connects your entire private network to the Internet.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_222_0.png)'
  merge: -1
