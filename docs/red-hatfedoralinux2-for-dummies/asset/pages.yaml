  md: '# Part I: Installing Fedora Core


    Defragmenting consolidates all files on your hard drive into contiguous portions.
    This task is necessary because Windows is a slob as operating systems go, scattering
    data all over the hard drive rather than in any sort of logical order.


    These steps show how to defragment your Windows partition:


    +   1. Close all programs and windows on your computer, leaving just the desktop
    and icon bar.

    2. Double-click the My Computer icon on the desktop.

    3. Select drive C by clicking it and then choose File:Properties:Tools.

    4. Click the Defragmentation Now button.


    The defragmentation program looks at the drive to determine whether it needs defragmentation.


    You may get a message telling you that you do not need to defragment because your
    hard drive is not very fragmented; don''t believe it. Under ordinary circumstances,
    this statement may be true. But resizing is not an ordinary occurrence; defragmenting
    your hard drive is necessary because you''re going to move the end of the partition
    file system and make the smaller partition, erasing any data outside that barrier.


    +   5. Start.


    The defragmentation window appears and the process begins. Defragmenting can take
    a long time, depending on the size of your hard drive and how much the data is
    spread out (fragmented) across the disk.


    The colored blocks represent programs and data, and the white space represents
    free space on your hard drive that FIPS can allocate to the Linux file system.
    The movement of the blocks around the screen shows that the data is moving forward
    on the drive. To see white space appear toward the bottom of the window, which
    represents the end of your drive. At the end of the defragmentation process, no
    colored blocks appear at the bottom of the window, and all the blocks are compressed
    toward the top of the window. After what may seem quite a long time, defragmentation
    ends. All useful blocks of information are now at the beginning of the drive,
    making it ready for the resizing program.


    These instructions describe how to defragment your Windows NT, Windows 2000, or
    Windows XP (NTFS) computer:


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_41_0.png)


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_41_1.png)'
