  md: '# Chapter 3


    # Ready, Set, Install!


    In This Chapter


    +   * Deciding which Fedora Core installation type to use

    * Starting the Fedora Core installation process

    * Automatically selecting Linux partitions

    * Configuring your network

    * Configuring your system options

    * Going beyond the point of no return

    * Configuring your display

    * Finishing the installation...


    Installing Linux isn''t rocket science — it''s more like astrophysics. No, no
    — just kidding. Although installing Fedora Core may seem at first like a mysterious
    process, it''s really quite simple. The installation process requires that you
    answer a few questions, and then the process takes care of itself.


    When you''re done, you have a powerful computer that is capable of performing
    most, if not all, of your daily computing chores — all for the cost of this book!
    That''s pretty amazing when you think about it. For a few dollars, you get the
    same amount of operating power that would cost megabucks just a few years ago.


    This chapter walks you through the process of installing Fedora Core 2. The process
    involves inserting the companion Fedora Core 2 DVD disc, powering your computer,
    and answering some questions.


    This book comes with a companion DVD disc that contains the entire Fedora Core
    2 distribution. The single DVD replaces several CD-ROMs and reduces the need to
    continually swap CD-ROMs during the installation process; it also makes installing
    the software easier, by eliminating the need to find the particular CD-ROM that
    contains the needed package. If your computer cannot handle DVDs, however, you
    can obtain the Fedora Core 2 distribution on CD-ROMs by mailing in the coupon
    in the back of this book.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_50_0.png)'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# 30 Part I: Installing Fedora Core


    # For installation purists only


    You can run the Fedora Core installation system from either a graphical or text-based
    interface. If the installation process successfully detects your graphics hardware,
    the graphical method is selected automatically, and that''s the system we discuss
    in this chapter. In addition to using a mouse to point and click, the graphical
    method groups similar configuration choices. For the keyboard and mouse selections
    are presented within one window, not two, as in the text-based installation.


    You may have to use the text-based installation, for these reasons:


    +   - Your mother told you never to point and click.


    +   - In the unlikely situation where the Fedora Core installation system cannot
    use your graphics adapter. Occasionally, the installation system cannot start
    the graphics interface and defaults to text mode. Using the text-mode interface,
    you use the keyboard to enter information and the cursor (arrow) to move from
    step to step.


    You can select the text-based installation method by typing linux at the boot:
    prompt.


    The Fedora Core installation process has a point of no return. That comes toward
    the end of the configuration process, after which your disk is partitioned and
    the software is installed (see the section "Installation Stage 5: The Point of
    No Return," later in this chapter). If you stop at or before that point, you save
    whatever operating system and data exists on your computer.


    # Choosing an Installation Type


    Fedora Core provides several installation types to choose from. Although we think
    that you can probably get away with less space on your system, we decided to give
    you the minimum disk space requirements that Fedora Core suggests for each installation
    option:


    +   - Workstation: Adds software development tools, such as the gcc compiler,
    to the Personal desktop installation type. You need at least 2.4GB to use this
    option. We use the Workstation installation option in this book not because we
    discuss software programming but, rather, because the tools often come in handy
    when you are installing applications. We encourage you to use the Workstation
    installation type for your Fedora Core installations.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Chapter 3: Ready, Set, Install!


    +   - Personal Desktop: Installs the software necessary to use your computer as
    a personal workstation. Applications such as Mozilla, OpenOffice, and Evolution
    pulse the GNOME graphical environment give you all the tools you need to enjoy
    the Internet and get your work done. This installation requires at least 1GB of
    free space.


    +   - Server: Using this option creates an operating system environment for computers
    that provide services, such as hosting Web pages. This installation requires at
    least 870MB of free space if you want the minimum number of bells and whistles;
    at least 1.4GB of free space if you want to install all the bells and whistles
    but not the graphical X Window System; and at least 2.1GB to install all the bells
    and the whistles to throw in the Acme Bell and Whistle Factory (which includes
    both GNOME and KDE).


    +   - Custom: This installation provides two options: minimal and everything;
    the minimal option installs the bare essentials and nothing more; this installation
    requires only 520MB of hard drive space. The everything option installs, as you
    may have already guessed, every piece of software plus the kitchen sink; you need
    at least 5.3GB for this option.


    +   - Upgrade: Updates the Fedora Core software that''s already installed on a
    computer and leaves all existing settings, users, and data alone. You can optionally
    choose to install additional packages. Your disk space use stay roughly the same
    as your existing installation. Additional packages require additional space, of
    course.


    Both the Workstation and Personal Desktop installation types create a computer
    you can use for your daily work. The installation includes the GNOME graphical
    user interface (GUI) and all the tools that an average computer user (that''s
    you) need to survive. If you want software that the installation doesn''t provide,
    you can always add packages later.


    # # Installation Stage 1: Starting the Journey


    Before you install Fedora Core, you need to insert the companion DVD into the
    DVD/CD-ROM drive and boot or reboot your computer. The instructions in this section
    describe how to start installing Fedora Core on your computer.'
  merge: -1
