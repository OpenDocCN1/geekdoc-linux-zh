    # Configuring VMware networking


    This set of steps describes how to configure VMware networking:


    +   1. We assume that you want to use virtual networking, so press Enter. The
    script automatically configures both bridged and NAT networking.

    Bridged networking doesn''t work if the host computer uses a wireless NIC. NAT
    works on wireless NICs, however, this limitation should be fixed eventually.


    +   2. Answer Yes to allow the script to probe for unused subnets.

    3. You have to accept the DHCP license, so type yes and press Enter.

    The DHCP license is stored in /usr/share/vmware/DHCP- COPYRIGHT. The license makes
    for an good reading.


    +   4. Optionally, type yes and press Enter to use host-only networking.

    Host-only networking consists of a virtual network interface communicates with
    only the VMware host computer (the one you''re configuring now). Host-only networking
    is used primarily to share the host''s file system with the virtual computer.


