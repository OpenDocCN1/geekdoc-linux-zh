  md: '# 106 Part II: Got Net?


    Iptables uses the concept of chains. A chain is a list of one or more interrelated
    rules. Each rule is a link in the chain. Iptables has three built-in chains: INPUT,
    OUTPUT, and FORWARD. You can create custom chains to perform any filtering function
    you want. (For example, the default Core firewall filter creates a custom chain,
    called RH-firewall-1-INPUT). However, creating chains isn''t necessary for this,
    so we use only the built-in chains.


    The first chain, INPUT, filters incoming packets. You can see that the default
    policy denies all packets. This policy makes for a perfect firewall—nothing can
    get in. However, the perfect firewall is also useless because your computer cannot
    see or interact with the network.


    You begin to make the firewall useful by creating a rule to allow all incoming
    packets on the loopback (lo) interface; the loopback interface is for internal
    communication on your computer. The loopback allows the return packets, RELATED
    and ESTABLISHED, from outgoing connections to come back. The last rule, which
    is optional, allows the incoming Shell Shell connections to your computer.


    The next chain, FORWARD, prevents all packets from being forwarded through your
    Linux computer. Forwarding is necessary only if you use your computer for routing
    or other advanced networking functions.


    The last chain, OUTPUT, defines which IP packets are allowed out of your computer.
    Again, the first rule allows unlimited traffic through the loopback (lo) interface.
    The second and last rule allows all packets to leave your firewall.


    The following section describes how to save the rules you just created and displayed
    so that they can be started automatically.


    # # Firing Up Your Firewall (And Dousing the Flames)


    The preceding section describes how to display your firewall-filtering rules.
    However, you certainly don''t want to manually enter these rules every time you
    reboot your computer. This section shows you how to automate your firewall. We
    show you how to make use of the Fedora Core utilities that save the rules you
    just created and start up the firewall whenever you boot your computer.


    These instructions assume that you have configured the firewall as described in
    the preceding section and that the configuration is still in effect.'
  merge: -1
