  md: '# 104 Part II: Got Net?


    6. To allow all outgoing communication from your computer, type these lines:


    ```

    iptables -A OUTPUT -m state --state NEW,RELATED,ESTABL-

    ISHED j ACCEPT

    iptables -A INPUT -m state --state RELATED,ESTABLISHED -J

    ACCEPT

    ```


    These rules do not specify any particular network interface. However, because
    the filter is state, these rules effectively work on your Ethernet, or dial-Point-to-Point
    (PPP) interface.


    The first filter rule permits all outgoing communication. The --state

    NEW, RELATED,ABLISHED option tells the firewall to allow packets

    of both new and already established connections to pass. (Packets are

    the basic of all network communication.) Packets that are related

    toexisting connections but use a different port, such as FTP data transfers,

    are also permitted.


    The second filter rule controls the packets coming back from outgoing

    connections. When you connect to a Web site, for example, your browser

    sends out packets and the Web server responds to them. You can click

    a button on the Web site, and a new display pops up. Clicking a button

    sends a packet out, and the Web server sends packets back. You have

    previously blocked packets from the Internet. This rule creates an exce-

    allowing packets that belong to an existing connection — such as

    the connection that represents you clicking a button — return to your

    computer through the firewall. Note that we do not allow incoming

    connections (-state NEW) to be established because that would

    defeat the purpose of this firewall.


    7. (Optional) Use the following rule to allow SSH connections to your

    Linux computer:


    ```

    iptables -A INPUT -p tcp -m state --state NEW,ESTABLISHED

    -j ACCEPT --dport 22

    ```


    This rule permits SSH connections on Port 22 to

    enter into your computer.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_125_0.png)


    The OpenSSH server is installed by default during the installation process

    we describe in Chapter 3. The service is also started automatically.


    You can modify this rule to allow other types of incoming connections

    to your computer. For example, if you want to create a Web server and

    allow incoming connections to it, run this filter:


    ```

    iptables -A INPUT -p tcp -m state --state NEW,ESTABLISHED

    -j ACCEPT --dport 80

    ```


    Port 80 is used for Web server connections. (Chapter 16 shows how you

    to create a Web server.)'
