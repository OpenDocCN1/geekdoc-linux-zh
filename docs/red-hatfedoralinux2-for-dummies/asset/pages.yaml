    all the things you would expect those menus to do. The toolbar, immediately below
    the main menu, enables you to quickly move up directory (Up) and skip back to
    previous menus (Back and Forward). The toolbar also lets you rescan a directory,
    display your home directory, and change the way icons are displayed.


    The Reload function is useful if you create a new file — for example, via a terminal
    emulator. The file doesn''t show up in the File Manager until you move to another
    directory and return, or else reload.


    # Moving files and directories


    Moving a file or directory is as simple as clicking and dragging the item you
    want to move to the directory you want to move it to. Release the button and you
    have moved your file or directory.'
