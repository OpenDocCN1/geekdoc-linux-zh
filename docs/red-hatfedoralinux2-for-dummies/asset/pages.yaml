  md: '# Chapter 17: Securing Your Future


    **Physical security:** We focus on discussing network-based security in this book.
    We assume that your Fedora Core computer is running on your home network, in which
    case you have to worry about Internet bad guys. In an office environment, you
    have to worry about physical security.


    *Physical security involves preventing people from walking up and gaining unauthorized
    access to your computer. You should set a BIOS password to prevent anyone else
    from booting your computer into single-user mode, totally avoiding your Linux
    passwords. You should lock your computer in your office, if possible, to prevent
    anyone from stealing your hard drive. Don''t, under any circumstances, write your
    passwords in any accessible place (like on your desk or computer).*


    You should also set the GNOME (or KDE) screen lock unless you want to log out
    every time you leave your desk. Choose GNOME Menu > Screensaver and select the
    Lock Screen After option. Select the amount of time to wait before locking your
    screen and then click the Close button.


    +   - **Boring consistency:** Good long-term security depends on consistency.
    Making backups, reading security logs, and performing other, similar tasks all
    depend on your maintaining interest. It''s like staying in shape: You cannot be
    good for a while and then forget about your routine.'
