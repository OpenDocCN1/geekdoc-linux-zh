    # "When I boot into Windows,

    I get the recovery process"


    Problem: You have a dual-boot computer with Microsoft Windows as the

    alternative operating system. When you boot into Windows, you see the

    Windows partition. "Help, I''m scared"


    Solution: Relax — you almost certainly haven''t lost your mind or your

    Windows partition. What happened is that the Fedora Core installation

    process mistakenly selected the Windows recovery partition from which

    to boot Windows. Most computers now come with a preinstalled Windows

    recovery partition (rather than a recovery CD-ROM), so Fedora Core sees

    at least two Windows partitions when it''s configuring GRUB, and it made the

    wrong choice. For example, you have hda1 hda2, and GRUB thinks that

    hda1 is the Windows partition; hda2 is the recovery partition, however, and

    hda2 is Drive C in Windows.


    You have to reconfigure GRUB to point to the correct Windows partition to

    make it work correctly. For example, you may have this /etc/grub/grub.

    file:


    ```

    default=0

    timeout=10\splashimage=(hd0,2)/grub/splash.xpm

    title Fedora Core (2.6.3-2.1.253.2.1)

    root (hd0,2)

    kernel /vmlinuz-2.6.3-2.1.253.2.1 ro root=LABEL=/rhgb

    initrd/initrd-2.6.3-2.1.253.2.1.img

    title Other

    rootnoverify (hd0,0)

    chainloader +1

    ```


    Change the rootnoverify (hd0,0) parameter to rootnoverify (hd0,1)

    and reboot your computer. Alternatively, if your recovery partition is set to

    rootnoverify (hd0,1), change it to rootnoverify (hd0,0). This tech-

    nique should fix your problem.'
  merge: -1
