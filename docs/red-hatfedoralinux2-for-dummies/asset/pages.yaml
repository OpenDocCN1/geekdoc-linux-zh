  md: '# Part IV: Revenge of the Nerds


    # The Fix Is 1n: Troubleshooting Your Network


    Your Fedora Core machine is the foundation of your network and must be set up
    correctly for anything to run. If it''s not working or if you have an unusual
    setup (or if Murphy is in a bad mood), you can check for several different causes.


    We use a Fedora Core computer connected to a private network as the troubleshooting
    example in this chapter. The Fedora Core network is one of the more difficult
    things to set up correctly because it depends on not only your Linux computer
    but also other computers. Suppose that your Fedora Core computer isn''t working
    within your private network. If that''s the case, use this chapter to help troubleshoot
    your network.


    See Part V for insights into other problems. Chapter 20 describes how to find
    information about common problems with your Fedora Core computer. Chapter 21 describes
    several security fixes.


    # Introducing Fault Trets


    Troubleshooting is more of an art than a science. Sometimes, you can easily see
    what the problem is and how to fix it. At other times, that''s not so easy. The
    degree of difficulty you have in fixing a problem depends on how complex the problem
    is and how well you know your staff. Obviously, the better you are with computers
    and Linux, the better you are at troubleshooting.


    # The blind leading the blind


    A colleague of ours, Ken Hatfield, once said, "One of the side benefits from lots
    of troubleshooting comes from what I call the ''value of blind alley.'' Most often
    in troubleshooting, you go down blind alleys, or in your tree example, the growth
    branches of the solution tree. By doing so, you learn something. In the future,
    when you encounter a different problem, previous blind alley may be the road to
    the solution." Well said.


    Here''s an example: We recently had a server that was having lots of problems.
    The /var file system filled up, which caused some programs to fail. When space
    on /var was freed, most of the programs started to do their jobs again. But one
    program didn''t work. Paul spent a long time trying to figure out why it didn''t
    work even after the problem was fixed. As turned out, this particular program''s
    real problem was that its license had expired. He had not only walked down a blind
    alley but also bumped into a wall and kept trying to go forward. Doh!


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_287_0.png)


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_287_1.png)'
