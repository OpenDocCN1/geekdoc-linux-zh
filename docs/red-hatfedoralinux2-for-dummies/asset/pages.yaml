  md: '# Chapter 4


    # Starting Up with Fedora Core


    In This Chapter


    +   - Booting your Fedora Core computer

    - Logging into your Fedora Core computer

    - Using graphical and text-based applications and utilities

    - Configuring your monitor and video card

    - Introducing the Fedora Core file system

    - Creating user accounts

    - Logging out of your Fedora Core computer


    Assuming that you have installed Fedora Core, you should spend a few minutes studying
    some basics. This chapter covers just enough, but more, of the Linux fundamentals
    that you need to get started. We cover topics such as starting and stopping your
    Fedora Core computer, understanding the difference between graphical and nongraphical
    applications, and how Linux uses files.


    We start by describing how to start your new Fedora Core computer. This process
    is a simple one, but it''s helpful to know more about it.


    # Booting Your Fedora Core Computer


    To boot a computer means simply to start it or turn the power on; to reboot a
    computer means to restart it. The following steps describe how to boot your Fedora
    Core computer:


    +   1. Make sure that your computer and monitor are turned off.

    2. Turn on the power to both the monitor and computer (or just the computer, if
    you''re using a laptop).


    After a short time, the Fedora Core boot menu appears on your screen. If you have
    only Fedora Core installed on your computer, you''re given only one choice of
    operating systems to boot: Linux.'
