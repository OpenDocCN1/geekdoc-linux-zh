  md: '# Introduction


    # Foolish Assumptions


    You probably know what they say about people who make assumptions, but Red Hat
    Fedora Linux 2 for Dummies never would have been written if we didn''t make a
    few. This book is for you


    +   * Want to build a Fedora Core workstation: You want to use the Linux operating
    system to build your personal workstation. Surprise! The DVD in the back of this
    book contains the Fedora Core 2 distribution.

    * Have a computer: It''s just a technicality, but you need a computer because
    we describe how to install Fedora Core 2 on a computer.

    * Have no duct tape: You want to put the Fedora operating system and the computer
    together, and using duct tape hasn''t worked.

    * Don''t want to be a guru: You don''t want to become a Fedora Core guru — at
    least not.


    However, Red Hat Fedora Linux 2 for Dummies is not for you if you''re looking
    for


    +   * An all-encompassing reference-style book: We simply don''t have enough space,
    or permission from the publisher, to provide a comprehensive range of topics.
    We concentrate on providing help with getting popular and useful programs up and
    running. We devote more space, for example, to getting your DSL or cable modem
    working than to describing the theory that makes them work.

    * A system administration book: Again, we dont have space to do the subject justice,
    We provide instructions on how to perform certain essential administrative tasks,
    like adding users, packages, and network connections. We select certain topics
    to focus on and leave the rest for others.


