    # Introducing the X Window System


    Fedora Core gives you the option of using the GNOME and KDE desktop environments.
    GNOME and KDE, however, run on top of X, and run on Linux. X is the software that
    provides the low-level graphical bits and pieces that systems like GNOME use.
    X is the foundation that makes complex systems like GNOME possible.


    X is composed of three parts:


    +   * The server

    * Numerous graphics libraries

    * A set of X client graphics applications


    The X server is a program that communicates with the human-interactive hardware—such
    as the video card, keyboard, and mouse—acting as the liaison between the hardware
    and other graphics software. It uses the graphics libraries, software that''s
    shared by many programs, to work properly with the graphics hardware.


    X clients are the graphical programs, such as Mozilla and xclock, that interact
    with X. X clients display their graphical output through the X server; they also
    get their keyboard and mouse input through the X server. X clients can run on
    the same computer that the X server runs or across a network—work to any computer
    running an X server. For example, by using X, you can run an X client on a computer
    on the other side of the world and view it the X server running on your home computer.


    Suppose you''re logged in to a computer in Australia and you want to see what
    time it is there. You could run the text-based date command (from a CLI) to see
    the date and time, but that would be boring. Alternatively, you could'
