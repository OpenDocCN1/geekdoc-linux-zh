  md: '# Wiring without wires


    Life has gotten easier in the past few years. Wireless networking is the best
    technological advance for home or small-business network users in the past five
    years, and it''s now affordable for consumers.


    Going wireless means


    +   - Not having to say you''re sorry while stringing cables around your house
    or office. You don''t have to spend money and time puling wires through walls,
    ducts, attics, and cellars, for example. (The authors have enjoyed all of these
    activities.) You also save the cost of the cables themselves.

    - Geographical freedom: You have the freedom to use your computers anywhere, regardless
    of where your server or Internet gateway or printers are located. [-markdown]Geographical
    freedom: You have the freedom to use your computers anywhere, regardless of where
    your server or Internet gateway or printers are located. Ah, life is easier when
    you can sit outside on a nice day and click away at the keyboard.

    - Looking good: You look high-tech even if you''re not. You can impress your friends
    and family.


    The process of constructing a wireless network is straightforward. You have to
    decide how to connect your wireless devices to your private network. You can do
    that in two ways:


    +   - Use a wireless access point: A wireless access point (WAP) is a device through
    which wireless devices communicate. An access point provides a single point of
    contact through which all other devices communicate. An access point uses two
    network connections. One is an Ethernet port that connects to your LAN through
    a Cat 5 Ethernet cable, and the other point connects to your wireless devices.
    The access point serves as a common connection point to your LAN.

    The other connection point is the access point''s wireless receiver. The wireless
    "port" communicates with all other wireless devices on your network.

    - Use point-to-point (ad hoc) communication: Contrary to popular opinion, you
    can create a wireless network without an access point. Wireless NICs are designed
    to communicate directly with each other as well as through an access point. You
    configure each NIC to know a common network name and a common encryption key,
    and the NICs form their own ad hoc network by communicating directly with each
    other. We show you how, later in this section.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Chapter 15: Building Your Own, Private Network


    Point-to-point communication is referred to as ad hoc mode. The term ad hoc means
    that you put something together with what you have in whatever way you can. Using
    wireless ad hoc mode means that each wireless device can communicate with the
    other wireless devices. (Setting a network with wireless NICs is less expensive
    than using WAPs.)


    You can purchase an access point to construct your wireless LAN. That''s simple
    and quick, if a little expensive. If you choose that route, we leave it to you
    to follow the access point''s instructions for connecting other computers to it.
    You can follow the steps in Chapter 7 for configuring your Fedora Core wireless
    NIC to an access point.


    We describe how to save a few bucks and use a Linux computer to build an ad hoc
    network. Building an ad hoc requires you to pull a Wi-Fi NIC on a Linux gateway.
    Then you configure every computer, on your private network, to use the same network
    name and encryption key. The computers can then communicate directly with each
    other through the Linux gateway to the Internet.


    Follow these general steps to create a wireless LAN:


    +   1. Install both a Wi-Fi and Ethernet NIC on the Internet gateway computer.


    +   Each of your private network''s computers can talk to the Internet gateway
    through the wireless NIC. The Ethernet connects the gateway to the Internet through
    either a DSL or cable modem; you can substitute a telephone modem for the Ethernet
    NIC, if necessary.


    +   The next section in this chapter describes how to build an Internet gateway.


    +   2. Install a Wi-Fi NIC on each of your Linux and Windows computers.


    +   3. Configure each Wi-Fi NIC to use the same network name and encryption key.


    +   Refer to Chapter 7 to find out how to configure a Wi-Fi NIC; use the network
    IP addresses, netmasks, and other items described here.


    +   4. Configure your Internet gateway to forward your private network traffic
    to the Internet.


    +   5. Configure a firewall on your Internet gateway.


    +   Refer to the section “Protecting your LAN with a firewall,” later in this
    chapter.'
  merge: -1
