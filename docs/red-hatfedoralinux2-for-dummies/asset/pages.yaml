    # Maybe you have an interrupt or address conflict


    You may have an interrupt or address conflict. Look at the list of interrupts
    and then the I/O addresses of all devices that the kernel knows about, by typing
    these commands:


    ```

    cat /proc/interrupts

    cat /proc/ioports

    ```


    The I/O address is the location in memory where the device, such as the net-adapter,
    is accessed by the microprocessor (for example, the Pentium chip). The interrupt
    communicates to the microprocessor that it should stop whatever it''s doing in
    order to process information that has arrived at the device sending the interrupt.


    When your Ethernet adapter receives a packet, it sends an interrupt to the microprocessor
    to signal that an event has occurred. Your Pentium stops what it''s doing and
    processes the new information. The microprocessor even interacts with Linux to
    do the processing.


    cat /proc/interrupts to show both the interrupts and the I/O addresses with which
    Fedora Core is familiar. The output should look like this example:


    | 0: 378425 timer |

    1: 1120 keyboard |

    2: 0 cascade |

    10: 16077 3c509 |

    13: 1 math error |

    14: 63652 +ide0 |


    This listing shows that Linux knows that the Ethernet NIC (3c509) exists.


    Typing cat /proc/ioports shows the input-output ports used by Fedora Core to interact
    with the computer''s devices. This output shows the I/O ports used in this:


    ```

    0000-001f : dmal

    0020-003f : pci

    0040-005f : timer

    0060-006f : keyboard

    ```


    For your network adapter. In this case, it''s 3c509. If the adapter is working,
    you shouldn''t have any conflicts. If the I/O ports of two devices overlap, a
    conflict exists and you have to reconfigure the adapter. Run your Ethernet configuration
    program and set the adapter''s parameters in its EEPROM.'
