  md: '# 226 Part IV: Revenge of the Nerds


    Your private network DNS server answers local and external queries. It provides
    the IP addresses for machines on your LAN. It also goes out to the Internet and
    finds IP addresses. You get answers when you ask for Cancun''s address as well
    as any external one, such as wiley.com.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_247_0.png)


    You can specify as many as three name servers, you may add a backup DNS server,
    if you have one, or your ISP''s run servers.


    Open a GNOME Terminal window and run this command:


    ```

    host cancun

    ```


    You see this result:


    ```

    cancun.paunchy.net has address 192.168.1.1

    ```


    The host command provides numerous options that provide more information about
    your query. For example, you can see information about where the host command
    gets its. Add the verbose (-v) option to the preceding example and you see information
    similar to this output:


    ```

    Trying "cancun.paunchy.net"

    ;; --HEADER-- opcode: QUERY, status: NOERROR, id: 18016

    ;; flags: qr aa rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 1,

    ;; ADDITIONAL: 0


    :: QUESTION SECTION:

    cancun.paunchy.net.             IN      A


    :: ANSWER SECTION:

    cancun.paunchy.net.      86400    IN      A      192.168.1.1


    :: AUTHORITY SECTION:

    paunchy.net.               86400    IN ns.paunchy.net.1

    Received 69 bytes from 192.168.1.120#53 in 263 ms

    ```


    This list describes what the various sections in the preceding output mean:


    +   **Question section:** You see in the Question section that the query is cancun.paunchy.net.
    Note that we ask for the address of cancun, but that the search parameter in the
    resolv.conf file specifies that the paunchy.net domain be appended to cancun.
    You also see that an An is part of the query —you''re asking for an IP address.

    **Answer section:** This section shows you the answer to your query. The answer
    includes the host name and domain —cancun.paunchy.net— and its numeric IP address.
    The Answer section also includes the time-to-live (TTL) value.

    **Authority section:** The data in this section shows where the information was
    found in the preceding section. You got the answer from the name server —192.168.1.254
    — that you just built.'
