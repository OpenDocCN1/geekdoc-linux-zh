- img_proc: true
  md: '# 306 Part V: The Part of Tens


    ‘Here’s how buffer overflows work:


    +   - The character stream overflows the intended boundaries of the subroutine''s
    buffer.


    +   - When the subroutine finishes, it reads the return address of the calling
    program or subroutine off the stack.


    +   - But the false return address executes the malicious hacker code — and you
    have been hacked!


    A little more has to happen for the hacker to be successful, but you get the idea.
    When a hacker finds and exploits a vulnerable program, he gains access to your
    computer. Sometimes, that access comes in the form of superuser (root) access!
    Yikes!


    Here are some simple techniques you can use to minimize buffer overflows:


    +   - Your first line of defense is simply to minimize the number of services
    you run. You run zero risk of compromise from a buffer vulnerability in any particular
    service if you don’t run that service.


    For example, the Lion worm wreaked havoc in spring 2001. Lion took advantage of
    a vulnerability in the Linux sendmail and Lpd printer services. Computers that
    didn’t run those services were vulnerable to the Lion worm.


    +   - Your second defense is to update your Fedora Core computer as often as possible.
    Fedora Core posts package updates, as they become available, that fix vulnerabilities.
    Buffer overflow fixes comprise many of the package vulnerabilities. Updating your
    system fixes many buffer overflow vulnerabilities.


    Click the red exclamation button on the GNOME Panel to start the up2 service.
    You can also run the command update to accomplish the same function.


    +   - Your last defense is the new stack protection system named ExecShield. ExecShield
    places a canary in a stack. A canary is a number that, if overwritten by a buffer
    overflow, creates an invalid state for the calling software. The software that
    called the compromised subroutine sees the invalid state and can decide to exit
    before any damage is done.


    ExecShield is included in the Fedora Core kernel. When ExecShield is enabled,
    it prevents sections of a program, including its stack, from executing code or
    other programs. Some sections of a program, such as data, shouldn’t be executable,
    including the stack, of course.


    ExecShield provides three modes of operation:'
