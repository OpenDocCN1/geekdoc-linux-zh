    # My Buffer Overflow


    Beneath the surface, computer programs — applications — are made up of subprograms
    known as subroutines. Subroutines allow programmers to divide into many smaller
    tasks the task a program to perform. Designing big or small programs without subroutines
    would be impossible.


    Whenever a program calls a subroutine, or a subroutine calls a subroutine, information
    can be passed between the two via the stack. A stack is like a can of tennis balls:
    the first pushed into the can is the last taken out. This type of stack is called
    first-in-first-out. Stacks turn out to be efficient for transferring information
    to a subroutine and then are consumed when automatically released when the subroutine
    finishes. Stacks are also referred to as buffers and queues.


    Although stacks make programming with subroutines efficient, they''re vulnerable
    to a hacking technique called buffer overflows (or stack smashing). Overing a
    buffer is one of the most popular methods hackers use to break into computers.
    The idea is to feed seemingly crazy streams of code, in binary form, to a program
    in order to make them behave in ways their designers never intended.'
