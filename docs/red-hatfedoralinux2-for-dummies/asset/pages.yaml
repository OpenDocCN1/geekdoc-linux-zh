  md: '# Chapter 11

    Surfin'' the Net and

    groovin'' to Tunes


    In This Chapter


    +   - A brief history of the Web

    - Using Mozilla to surf the Web

    - Getting extra help with plug-ins

    - Keeping your passwords safe

    - Playing your CDs

    - Building your sound system

    - Burning CDs


    In this chapter, we introduce the open source Mozilla Web browser. Mozilla provides
    all the capabilities of other popular browsers. We show how to set up Mozilla
    for your Fedora Core computer so that you can surf the Net. You can use your computer
    as a multimedia device. After start working with Mozilla, we describe how to configure
    your Linux box to listen to music and create CDs.


    Our goal in this chapter is to describe how to use the basic Mozilla features.
    However, we want you to know that Mozilla can do far more than we describe in
    this chapter. For more information about Mozilla, check out the features available
    on the Help menu, such as the Reference Library or Help contents.


    # Making the World Wide Web Possible


    Once upon a time, a company Netscape created a browser to surf the Internet. The
    browser was originally named Navigator, and later, Communicator. Millions of people
    downloaded it from the Internet for free. Netscape put in the hands of millions
    of people (including us, your authors) the power to access the exploding number
    of Web servers. Netscape made history and changed the world because it changed
    the Internet from a medium that served scientists into a tool that anyone can
    use.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# 140 Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    Even though Netscape Communicator is freely distributed to anyone who wants it,
    it is not open source software in the same way that Linux is. Quite simply, Netscape
    Communicator is a matchmaking venture, and Netscape considers the way the software
    works to be proprietary.


    On the other hand, Netscape recognizes the importance of the open source dynamic,
    which is why it released an open source version of Netscape, named Mozilla. Now,
    countless numbers of people are developing and enhancing Mozilla, the default
    browser for Fedora Core computers.


    The DVD that comes with this book includes Mozilla, the open source brother to
    Netscape Communicator. Netscape and Mozilla are quite similar, although they have
    a slightly different look and feel.


    # Surfin'' the Net with Mozilla


    If you have ever browsed the Internet (and who hasn''t, these days?), the first
    thing you want to do is to tailor Mozilla to your preferences. You can complete
    this task without connecting to the Internet. Follow the steps in this section
    to customize Mozilla to your liking.


    When you connect to the Internet, the first page you see is your home page. You
    have the option to set your home page to a Web page you want to see rather than
    look at a page that someone else wants you to see. You may also want to tweak
    your history settings for whatever reason (but certainly not a paranoid one).
    These steps explain what you need to do:


    +   1. Start Mozilla by clicking the blue globe icon on the GNOME Panel.


    The Welcome to Fedora Core screen appears in Mozilla. You can use this page to
    find out more information about Fedora Core and its products.


    Concentrate on configuring Mozilla and skip over all the Fedora Core information;
    lots of good information is there, however, explore your world at your leisure.


    +   2. Choose Edit:Preferences.


    On the left side of the Preferences window is a list of categories, which you
    can think of as a map of where you are in the Preferences window.


    +   3. Click the plus sign (+) next to the Navigator category to expand it.


    In this step, you determine which Web page appears when you start Mozilla and
    which Web page is loaded when you click the Home button on the Navigation toolbar.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_161_0.png)'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Chapter 11: Surfin'' the Net and Groovin'' to Tunes 141


    4. In the Home Page area of the Preferences window, fill in the Location field
    with the URL of the Web page you want to be your home page.


    You can also surf to the site of your choice and click the Use Current button.


    For example, type **linuxworld.com** and see interesting information about Linux
    whenever you start up your browser or click the Home button, in the upper-left
    corner of the Mozilla window.


    Mozilla remembers where you have been and lets you select (and go to) a previous
    location. How long Mozilla remembers (and how big the list) depends on how many
    days of history you choose. The History configuration option determines the number
    of days that the locations visit are saved. If you''re on short disk space, choose
    a lower History number, such as one or two days. Otherwise, leave the default
    setting.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_162_0.png)


    If your Linux computer is connected to a network with a proxy firewall, you have
    to configure Mozilla to work with it. To do so, from the Preferences window choose
    the Proxies option from the Advanced menu. Click the Manual Proxy configuration
    radio button and enter the name of your firewall. For example, enter **proxy.mynetwork.com**
    in the HTTP Proxy text box (if that''s the name of your firewall) and enter **80**
    in the Port text box. You don''t have to perform this configuration process if
    you''re using the Fedora Core default firewall or the packet-filtering firewalls
    we describe in this book.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_162_1.png)


    # Plugging in plug-ins


    Mozilla performs the tasks you expect from a browser, like displaying Web pages.
    Without help, Mozilla doesn''t go the extra mile and display things like animation
    and JavaScript. When it comes to special functions, Mozilla is a blank slate.


    However, with a little help from friends such as you, Mozilla can go that extra
    mile. That help comes in the form of plug-ins. A *plugin-in* is software Mozilla
    uses when needed to perform extra functions. To make use of plug-ins, all you
    need to do is (sorry) plug it in.


    Adding plug-ins is straightforward process:


    +   1. Obtain the plug-in and place it in the Mozilla plug-in directory.


    +   2. Optionally, configure the Mozilla preferences to use the plug-in.'
  merge: -1
  pgno: 162
