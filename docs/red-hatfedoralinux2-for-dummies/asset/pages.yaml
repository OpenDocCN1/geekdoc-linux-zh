  md: '# # Appendix C


    # # Filing Your Life Away


    **In This Appendix**


    +   - Finding out all about Linux files and directories

    - Finding your way through the Linux file system

    - Creating, moving, copying, and destroying directories and permissions

    - Changing file ownership and permissions


    1 n this appendix, you take your first steps through the Linux file directory
    structure. Don''t worry: Linux may live a structured life, but it''s flexible.
    With a little bit of introduction, you begin to understand the Linux way of life.


    We also introduce you to file types, subdirectories, and the root (which is not
    evil at all) directory. You''re also shown the way home — to your directory. After
    you''re oriented to the Linux files-and-directories structure, we show you how
    to make some changes, as how to copy and move files and how to — eek! — destroy
    them.


    # # Getting Linux File Facts Straight


    Linux files are similar to Unix, DOS, Windows, and Macintosh files. All operating
    systems use files to store information. Files allow you to organize your stuff
    and keep files separate. For example, the text that comprises this appendix is
    stored in a file; all other book elements are stored in their own files. Follow
    the bouncing prompt as we make short work of long files.


    # # Storing files


    We assume that you know that a file is a collection of information identified
    by a filename and that Linux can store multiple files in directories as long as
    the files have different names. Linux stores files with the same name in different
    directories.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# 326 Part VI: Appendices


    Wonderful or not, Linux filenames can be as long as 256 characters. The filenames
    can contain uppercase and lowercase letters (also known as mixed case), numbers,
    and special characters, such as underscores (_), dots (.), and hyphens (-). Because
    filenames can be composed of mixed-case names, and because each name is distinct,
    these names are case sensitive. For example, the names FILENAME, filename, and
    FileName are unique filenames of different files, although they''re the same filename.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_347_0.png)


    Although filenames technically can contain wildcard characters, such as asterisks
    (*) and question marks (?), using them isn''t a good idea. Various command interpreters,
    or shells, use wildcards to match several filenames at one time. If your filenames
    contain wildcard characters, you will have trouble specifying only those files.
    We recommend that you create filenames that don''t contain spaces or other characters
    that have meaning to shells. In this way, Linux filenames are different from DOS
    and Windows filenames.


    # Sorting through file types


    Linux files can contain all sorts of information. In fact, Linux sees as a file
    every device (disk, display, or keyboard, for example) except for a network interface.
    These five file categories eventually become the most familiar to you:


    +   * User data files: Contain information you create. User data files, sometimes
    known as flat files, usually contain the simplest data, consisting of plain text
    and numbers. More complex user data files, such as graphics or spreadsheet files,
    must be interpreted and used by special programs. These files are mostly illegible
    because the contents of these files aren''t always ASCII text. Changing these
    files generally affects only the user who owns the files.

    * System data files: Used by the system to keep track of users on the system,
    logins, and passwords, for example. As system administrator, you may be required
    to view or edit these files. As a regular user, you don''t need to be concerned
    with system data files except, perhaps the ones you use as examples for your own,
    private startup files.

    * Directory files: Hold the names of files — and other directories — that belong
    to them. These files and directories are called children. Directories in Linux
    (or Unix) are just another type of file. If you''re in a directory, the directory
    above it is the parent. Isn''t that homely?


    When you list files with ls -l, it displays a list of files and directories. Directory
    files begin with the letter d; for example:


    ```

    [lidia@xancun lidia]$ ls -l

    drwx-xr-x 5 lidia lidia 1024 Jul 3 2002 Desktop

    drwx------ 2 lidia lidia 1024 Jul 10 2002 nsmail

    ```'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# Appendix C: Filing Your Life Away


    +   Special files: Represent either hardware devices (such as disk drives, tape
    drives (or keyboards) or some type of placeholder that the operating system uses.
    The /dev directory holds many of these special files. You can see this directory
    by running this command at a command prompt:

    ls -l /dev


    +   Executable files: Contain instructions (usually called programs or shell scripts)
    for your computer. When you type the name of one of these files, you''re telling
    the operating system to execute the instructions. Executable files look like gibberish,
    and others look like long lists of computer commands. Many of these executable
    files are located in /bin, /usr/bin, /sbin, and /usr/sbin.


    # Understanding files and directories


    If you live in the Windows world, you can think of a Linux file system as one
    huge folder that contains files and other folders, which in turn contain files
    and other file folders, which in turn contain files and — well, you get the point.
    In fact the Linux file system is generally organized this way. One big directory
    contains files and other directories, and all the other directories in turn files
    and directories.


    # Directories and subdirectories


    A directory contained, or nested, in another is a subdirectory. For example, the
    directory named /mother may contain a subdirectory named /child. The relationship
    between the two is referred to as parent and child. The full name of the subdirectory
    is /mother/child, which would make a good place to keep a file named /mother/child/reunion
    that contains information about a family reunion.


    # The root directory


    In the tree directory structure of Linux, DOS, and Unix, the big directory at
    the bottom of the tree is the root directory. The root directory is the parent
    of all other directories (the poor guy must be exhausted) and is represented by
    a single / symbol (pronounced “slash”). From the root directory, the whole directory
    structure grows like a tree, with directories and subdirectories branching off
    like limbs.


    If you could turn the tree so that the trunk is in the air and the branches are
    toward the ground, you would have an inverted tree — which is how the Linux file
    system is normally drawn and represented (with the root at the top). If we were
    talking about Mother Nature, you would soon have a dead tree. Because the subject
    is computer technology, however, you have something that looks like an ever-growing,
    upside-down tree.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_348_0.png)'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# 328 Part VI: Appendixes


    # What''s in a name?


    You name directories in the same way as you name files, following the same rules.
    Almost the only way you can tell whether a name is a filename or a directory name
    is the we slash character (/) is used to show directories nested in other directories.
    For example, `usr/local` means `local` is in the usr directory. You know `usr`
    is a directory because the trailing slash tells you so; however, you don''t know
    whether `local` is a file or a directory.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_349_0.png)


    If you issue the `ls` command with the `-f` option, Linux lists directories with
    a slash character at the end, as in `/local/`, so you know it is a directory.


    The simplest way to tell whether the slash character indicates the root directory
    or separate subdirectories, or directories is to see whether anything appears
    before the slash character in the directory path specification. If nothing appears
    before the slash, you have the root directory. For example, you know that `/usr`
    is a subdirectory or a file in the root directory because it has only a single
    slash character in front of it.


    # Home again


    Linux systems have a directory named `/home`, which contains the user''s home
    directory, where she can


    +   - Store files

    - Create more subdirectories

    - Move, delete, and modify subdirectories and files


    Linux system files and files belonging to other users are never in a user''s `/home`
    directory. Linux decides where the `/home` directory is placed, and that location
    can be changed only by a superuser (root), and not by general users. Linux is
    dictatorial because it has to maintain order and keep a handle on security.


    # Moving Around the File System with `pwd` and `cd`


    You can navigate the Linux file system without a map or GPS (global positioning
    system). All you need to know are two commands: `pwd` and `cd`. (You run these
    commands from the command line.) However, you also need to know where to start;
    hence, the usefulness of the next section.'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# Appendix C: Filing Your Life Away


    # Figuring out where you are


    Log in to your Fedora Core computer and open a GNOME Terminal session. In this
    case, as an example, you log in as the user lidia. To find out where you are in
    the Linux file system, simply type `pwd` at the command prompt:


    ```

    [lidia@cancun lidia]$

    ```


    You receive this response:


    ```

    /home/lidia

    ```


    This response indicates that you are logged in as lidia and are in the /home/lidia
    directory. Unless your alter ego is out there, you should be logged in as yourself
    and in the /home/yourself directory, where yourself is your login name.


    The `pwd` command stands for print working directory. Your working directory is
    the default directory where Linux commands perform their actions; the working
    directory is where you are in the file system when you type a command. When you
    type the `ls` command, Linux shows you the files in your working directory. Any
    actions you perform occur in your working directory. For reasons that we don''t
    go into, the root user isn''t configured by default to be able to work on the
    current directory. You can change this setting, but root user generally must explicitly
    specify the working directory. For example, if you are root and are in the /etc
    directory and you want to indicate the hosts file, you must type `cat hosts` rather
    than just `cat hosts`.


    If you use this command:


    ```

    ls -la

    ```


    you see only the files in your working directory. If you want to specify a file
    that isn''t in your working directory, you have to specify the name of the directory
    that contains the file in addition to the name of the file. For example, this
    command lists the passwd file in the /etc directory:


    ```

    ls -la /etc/passwd

    ```


    # Specifying the directory path


    If the file you want to read is in a subdirectory of the directory you''re in,
    you can reach the file by typing a relative filename. Relative filenames specify
    the location of files relative to where you'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# 330 Part VI: Appendices


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_351_0.png)


    in addition to what we discuss earlier in this appendix about specifying directory
    paths, you need to know these three rules:


    +   - One dot (.) always stands for your current directory.

    - Two dots (..) specify the parent directory of the directory you''re in.

    - All directory paths that include (.) or (..) are relative directory paths.


    You can see these files using the -a option of the ls(1) command. Without a -a
    option, ls(1) command doesn''t bother to list the .. files, or any filename beginning
    with a period. This statement might seem strange, but the creators of Unix thought
    having some files that are normally hidden keeps the directory structure cleaner.
    Therefore, filenames are always present (. and special-purpose files are hidden.
    The types of files that should be hidden are those a user normally doesn''t need
    to see in every list of the directory structure (files used to tailor applications
    to the user''s preferences, for example).


    Specify a pathname relative to where you are: for example:


    ```

    ls -la /etc/passwd

    ```


    The first command moves you to the /etc directory, where the passwd file resides.
    The second command redundantly starts one directory up (..) and then looks in
    the /etc directory for the passwd file. You move up one .. directory level and
    then back down to /etc to demonstrate the use of relative paths names.


    ```

    ls -la ../etc/passwd

    ```


    If you want to see the login accounts on your system, you can issue this command
    from your home directory:


    ```

    ls -la

    ```


    This command lists the parent directory. Because the parent directory (/) has
    all the login directories of the people on your system, this command shows the
    names of their login directories.


    You have been looking at relative pathnames, which are relative to where you are
    in the file system. Filenames that are valid from anywhere in the file system
    are absolute filenames. These filenames always begin with the slash character
    (/), which signifies the root:


    ```

    ls -la /etc/passwd

    ```'
  merge: -1
