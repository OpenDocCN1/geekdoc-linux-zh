  md: '# 204 Part: Revenge of the Nerds


    One advantage of using infrastructure mode is that a wireless device can move
    from access point to access point without reconfiguration. Access points provide
    mobility and flexibility, which can be a good thing if you have to work on a large,
    dispersed environment. For example, if your company is spread across several locations,
    you want to be able to use your computer anywhere. However, if you don''t configure
    your access point correctly — for example, by not using an encryption key flexibility
    becomes a security liability. Make sure that you correctly configure all your
    wireless devices.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_225_0.png)


    # Building an Internet Gateway


    Okay, you have built your LAN. Woo-hoo! That wasn''t too hard. The next question
    is “What can you do with it?” One answer is that every computer on your private
    network can communicate with all the others and share information and services.
    (We describe in Chapter 16 how to share some useful network-based services. You
    find out how to share files and printers, configure a Domain Name Service (DNS)
    server, and build a simple Web server.


    One essential network function is to be connected to the Internet. Chapters 5
    and 6 show you how to connect a single, stand-alone Linux computer to the Internet.
    We expand that process a step further and show you how to turn the Internet connection
    into one that can be used by the entire private network. Any computer to your
    LAN subsequently has Internet access. Sharing is good, and your mom should be
    pleased.


    The remainder of this chapter deals with building an Internet gateway. We assume
    you have a working Internet connection as we describe in Chapters 5 and 6. This
    connection is the conduit from your LAN to the Internet. You only have to configure
    a Linux computer to redirect (*route*) Internet-bound traffic from your LAN to
    the Internet and modify the firewall we describe in Chapter 8 to work with the
    gateway.


    # Understanding IP forwarding and network address translation (NAT)


    An Internet gateway requires a Linux computer that has two network connections.
    You need one Ethernet or wireless NIC to connect to your LAN. The other network
    connection is used to make the Internet connection; this connection may be a traditional
    telephone-based modem, a DSL modem, or a cable modem. You use an Ethernet NIC
    to make the second connection.'
