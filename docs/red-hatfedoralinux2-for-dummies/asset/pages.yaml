  md: '# Chapter 16


    # Creating Basic Linux Network Services


    In This Chapter


    +   - Preparing a network server

    - Building a Linux Web server

    - Building a DNS server

    - Building a Samba file server

    - Building a print server


    Linux was built from scratch with networking in mind. Therefore, networking is
    fully integrated into Linux and is not merely an afterthought, as with other operating
    systems. Linux also comes bundled with software that provides file sharing, printer
    sharing, and other functions. Thus, Linux gained initial popularity by inexpensively
    and reliably providing network services. (Linux moved to the desktop only when
    applications such as word processing were written for it.)


    In earlier chapters, we show you how to use a Fedora Core computer with an existing
    network. We also show you how to build a private network using Fedora Core computers
    as both clients and the Internet gateway, or firewall. In this chapter, we describe
    how to configure a Linux box to provide some popular services to the private network.


    # Preparing a Network Server


    All examples shown in this chapter can run from any Linux computer, such as the
    one you construct from the Fedora Core distribution in Chapter 3. Linux doesn''t
    care what your intentions were when you built your computer. Linux eagerly does
    what it is told and works gracefully as either a workstation or server.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# 216 Part IV: Revenge of the Nerds


    Linux works equally well whether it''s running a Web browser or a Web server;
    the difference between them is just the software that''s used and how it''s configured.
    For example, you start the Mozilla application when you''re using your computer
    as a Web browser, or you use the Apache program to serve Web pages. In fact, you
    can run both programs at one time and do word processing while running a Web server.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_237_0.png)


    Regarding performance, maintenance, and security, you should run workstations
    and servers on dedicated machines, if possible. Workstations generally use a wider
    range of software than servers—you need a browser and a word processor, for example.
    Your workstation is by nature a jack-of-all-trades. Servers work better and are
    more secure and easier to manage when they''re configured to just a small—preferably,
    one or two—number of jobs.


    Therefore, you should dedicate individual computers to provide individual services,
    such as a Web server, when you get to the point where your business or livelihood
    depends on reliably providing network services. Until that time comes, however,
    you can use the simple workstation we describe in Chapter 3, which is what we
    assume you are doing for this book.


    You can configure the Fedora Core computer from Chapter 3 to provide services
    to a private network, like the one we describe in Chapters 7 and 15. This chapter
    describes how to make the Apache Web server visible to the Internet. Services
    such as Samba and printing, however, definitely be kept private and not shown
    to the Internet.


    We also assume in this that you''re connecting to the Internet through a private
    network, as described in Chapters 7 and 15. (Chapter 15 shows you how to create
    an Internet gateway and a firewall with a Fedora Core computer.) This chapter
    assumes you want to use the same computer to provide services to your private
    network. This assumption is reasonable for small-office and home-office (SOHO)
    networks because the demands on a modern PC by a small network aren''t excessive.
    Using a single computer for multiple purposes greatly simplifies the work you
    must do and is an efficient way to use your resources.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_237_1.png)


    Using a single Linux computer to act as an Internet gateway and network services
    is a cost-effective way of using your limited resources. However, this type of
    configuration is more difficult to secure. Each function you place on a single
    machine increases the machine''s potential number of vulnerabilities. Think of
    adding functions like doors and windows to a house: A house with a single door
    and no windows is more secure than a house with 5 doors and 15 windows. However,
    who wants to live in a dark house? Security, like everything else in life, is
    a matter of compromise. Consult Part II and Chapters 17 and 21 in this book about
    how you can increase.'
  merge: -1
