    Consider putting Fedora Core on a separate hard drive, for a couple of reasons.
    First, you can find 80GB hard drives for much less than $1000 (U.S.). Second,
    the task of shrinking MS-DOS and Windows to be small enough to allow Fedora Core
    to reside in its full glory on an existing hard drive is difficult at best and
    impossible at worst. Also, although splitting the Fedora Core distribution across
    hard drives is possible, doing so makes updating the distribution difficult later.


    # A Bit about Memory Bytes


    Memory is the most important factor in determining how fast your computer runs.
    Computers use Random Access Memory (RAM) to store and access the operating system,
    programs, and data. The Intel processor usually has the following amounts (main
    memory):


    +   * Linux can run on a surprisingly small amount of memory. With some work and
    no graphics, you can squeeze Linux on an old PC with only 16MB of memory; 32MB
    makes life much easier and your computer significantly faster. Many people use
    old PCs with small amounts of memory as simple network servers.

    * If you want to run Linux with graphics, however, you need 64MB.

    * With 128MB, Fedora Core runs multiple graphical programs, like OpenOffice.org,
    with ease.

    * You need 256MB or more (many PCs now come standard with 512MB) for hard-core
    computing. Using big applications, like VMware, makes having enough memory essential.


    VMware virtual computers need their own RAM to operate at a reasonable speed;
    for example, you should allocate a minimum of 128MB of memory to run a Windows
    2000 virtual computer. Plan to use 512MB if you want to run multiple instances
    of VMware virtual computers.'
