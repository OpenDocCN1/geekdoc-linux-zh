- img_proc: true
  md: '# Appendix E


    # Using RPM and YUM


    In This Appendix


    +   - Introducing RPM

    - Using RPM

    - Introducing and using YUM


    This appendix introduces you to the Red Hat Package Manager (RPM) and the Yellowdog
    Updater, Modifier (YUM). Red Hat, Inc., developed RPM in conjunction with another
    Linux distributor, Caldera Systems. Duke University gave us to (nope won''t say
    it) the wonderful YUM.


    RPM is the meat-and-potatoes of much of the Linux world. Its purpose is to reduce
    the amount of work you have to do when you install, remove, and manage software.
    RPM automates the installing, updating, and removing of software. Without RPM,
    Linux would never have become as popular as it is because installing and managing
    a computer would have been too difficult.


    Although other package managers are available, RPM has become the most popular
    system for installing, modifying, and transporting Linux software. This handy-dandy
    tool is a big reason that Red Hat is the de facto Linux distribution. Motor through
    this chapter to find out everything you need to know about RPM.


    YUM is a new entry into the software installation and maintenance world. YUM works
    at a higher level than RPM. YUM manages RPM packages, taking care of installing,
    updating, querying, and removing them. YUM simply makes your life easier.


    # Introducing the Red Hat Package Manager


    One of the primary reasons that the Red Hat Linux, and, subsequently, Fedora Core,
    distributions became so popular was that Red Hat, Inc., added value for its customers
    with technologies such as RPM.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# 344 Part VI: Appendixices


    The software that was installed during the Fedora Core installation process is
    stored in RPM''s giving format, called packages. Packages are a collection of
    individual software (applications, libraries, and documentation, for example)
    contained in one file.


    The package-management concept has been around for quite a while. The major Unix
    vendors supply their own systems. The idea is to pick a single file some software
    that performs a particular function and have a package manager to do the work
    of installing, removing, and managing the individual files. The Linux world has
    benefited greatly from this system, which simplifies the distribution and use
    of software.


    You can install software without RPM, but we''re not sure why you would want to
    — the RPM package contains everything you need to install and run an application.
    For example, if you didn''t have the RPM package, installing Mozilla would work
    a little like this: You would have to install the individual pieces that make
    up the Mozilla system, which could require dozens or more steps. You can also
    install, update, or uninstall software (see the following section for details).


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_365_0.png)


    We remember, back in the day, when we used the Linux operating system for the
    first time. We had to install all the software using the dreaded archive system
    (tar). Trust us: Installing, maintaining, and upgrading Linux with tar was a difficult
    task. RPM has made easy.


    / Fedora/RPM directory on the companion DVD contains all the Fedora RPM packages.


    RPM performs three functions: it installs, upgrades, and removes packages. In
    addition to it can find all sorts of information about installed and yet-to-be-installed
    packages. (All this, and it washes windows too.) Here''s a brief rundown of each
    function:


    +   * Installing packages: RPM installs software. Software systems, such as Mozilla,
    have files of all types that must be put into certain locations in order to work
    properly. For example, under Red Hat (but not all) of the Mozilla files need to
    go into /usr/bin directory. RPM performs this organizational stuff automatically,
    without any fuss or mess.


    RPM not only installs files in their proper directories but performs tasks such
    as creating the directories and running scripts to do the things that need to
    be done.(It''s a tidy and organized little champ.)


    +   * Upgrading packages: Gone are the days when updating a system was worse than
    going to the dentist. RPM acts like the personal Linux assistant that you had,
    by updating software packages for you. RPM keeps track of that, in a database
    of its own, all the packages you have installed. When you upgrade a package, RPM
    does all the bookkeeping chores and replaces only the files that need to be replaced.
    It also saves the configuration files it replaces.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_365_1.png)'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# Appendix E: Using RPM and YUM


    +   - Removing packages: The package database the RPM keeps is also useful in
    removing packages. To put it simply, RPM takes out the trash (Housekeeping was
    never so easy.) RPM goes to each file and uninstalls it. Directories belonging
    to the package are also removed when no files from other packages occupy them.


    +   - Querying packages and files: RPM can also give you a great deal of information
    about a package and its files. You can use the query function to find out the
    function of a package and which files belong to it. RPM can also work on the RPM
    packages themselves, regardless of whether they have been installed.


    +   - Verifying packages: RPM can validate an installed package against a checksum
    (a computer fingerprint) to see whether and how it has changed. This feature is
    useful for security reasons. If you suspect that a file or system has been hacked,
    you can use RPM to find out how it has changed.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_366_0.png)


    RPM often includes configuration files as part of its installation. If you erase
    an RPM package, those configuration files are not deleted but rather renamed by
    adding the suffix .rpmsave. For example, removing the Kerberos package, krbafs,
    saves the configuration file by renaming /etc/krb.conf to /etc/krb.conf.rpmsave.


    When you remove a package, RPM removes the associated files and directories. RPM
    cleans up after itself—what Martha Stewart (when she''s not on laundry duty) would
    definitely call a "good thing."


    # Using the Red Hat Package Manager


    Fedora Core provides a tool named Red Hat Package Manager for working with RPM
    packages. The package manager graphical tool provides all the functions for managing
    RPMs. It''s like putting an automatic transmission on a car: the package manager
    does the shifting for you.


    Okay, the package manager does the shifting for you, but you still have to drive
    it. The package manager provides easy access to RPM functions, such as install,
