    At computer conventions, thousands of computer people get together and talk about
    deep technical issues, such as


    +   * Could Superman beat Batman?

    * Could Mr. Big beat Superman?

    * Could Mr. Big, Superman, Batman, and Spiderman together beat Linus? (No way!)'
