    that it works for free.


    # Waking up Nautilus


    Fedora Core configures a GNOME Desktop Nautilus icon for your home directory.
    Double-click the icon and a Nautilus window opens, as shown in Figure 10-1. The
    window shows the contents of your home directory.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_151_0.png)


