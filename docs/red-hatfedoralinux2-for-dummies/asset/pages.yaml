  md: '# 206 Part IV: Revenge of the Nerds


    # Forwarding network traffic through your gateway


    This section describes how to configure a Linux computer to work as an Internet
    gateway. The process requires you to configure the Linux kernel to forward packets
    from one network interface to another — between the LAN port and the Internet
    port. Because Fedora Core turns off forwarding by default, the steps in this section
    describe how to turn on forwarding (you also need a Linux computer with two network
    connections to construct a gateway):


    +   * One network connection should be an Ethernet or wireless NIC that connects
    the gateway to the LAN. We refer to it as the internal network connection.


    +   * The other connection is either the telephone-based modem or an Ethernet
    NIC connected to a DSL or cable modem. We refer to it as the external network
    connection.


    Figure 15-2 shows Veracruz modified to work as an Internet gateway.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_227_0.png)


    Figure 15-2: Veracruz with an Internet connection.'
