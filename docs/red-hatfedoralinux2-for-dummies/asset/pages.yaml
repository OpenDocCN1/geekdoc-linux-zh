  md: '# Chapter 17: Securing Your Future


    Logwatch is controlled by the /etc/log.d/conf/logwatch.conf file. This file controls
    such options as who is e-mailed the results. The logwatch configuration is well
    documented and simple to configure.


    # Using Logviewer


    Logviewer is a simple utility designed to display any of the standard Fedora Core
    log files in the /var/log directory. Logviewer displays by default the raw log
    information leaves out suspicious entries to your eyes.


    Nothing is special about Logviewer, except that it helps you access common log
    files and look at their data. Don''t underestimate the value of simple assistance.
    Although our busy lives make reading log files a difficult task, it''s one of
    those mind-numbing but necessary jobs — boring but essential!


    # Fending off modular rootkits


    A rootkit is a software program that a hacker installs on your machine and then
    uses against you and others; the software also includes tools to hide itself from
    you. Garden variety root kits run as regular applications and can be detected
    with standard tools. Many root kits (nearly 60 at the time we wrote this book)
    can be detected with the easy-to-use chkrootkit system. Go to www.chkrootkit.org
    and download the software by clicking the Download Source Tarball link (about
    a page down).


    One of the newer and more insidious threats is the modular root kit. Modular rootkits
    insert themselves into your Linux kernel and control everything on your computer.
    Because they live in your kernel, you cannot depend on any standard detection
    techniques.


    After you have employed all the good security hygiene techniques discussed in
    this chapter and this book, the best way to avoid modular root kits is to prevent
    kernel modules from being loaded. You can download the Linux kernel source from
    kernel.org and compile it as a monolithic kernel — that is, compile modules directly
    into the kernel. Describing how to compile monolithic kernels is beyond the scope
    of this book, but an alternative method is easy to use.


    The new 2.6 Linux kernel that comes with Fedora Core 2 provides a switch that
    turns off module loading. Should boot your computer and let the standard modules
    load. When you''re satisfied that your computer is working the way you want, run
    this command as root:


    ```

    echo off > /proc/modules

    ```'
