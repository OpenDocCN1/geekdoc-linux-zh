    K Desktop Environment). Both GNOME and KDE run on top of X, and both environments
    include a menu system to access utilities, applications, and shortcuts in the
    form of icons and numerous other enhancements. Using either of these desktop environments
    makes Fedora Core as your workstation simple and easy.


