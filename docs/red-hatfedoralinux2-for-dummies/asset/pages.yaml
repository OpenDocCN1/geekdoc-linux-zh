    # Understanding URLs


    | Have you ever wondered what the various parts of a URL mean? Using a URL like
    http://localhost:8000/track1.ogg to access a streaming audio server , we thought
    that we dissect what the various parts mean and do This list describes the function
    of each URL element | For example, you could replace local-host with its numeric
