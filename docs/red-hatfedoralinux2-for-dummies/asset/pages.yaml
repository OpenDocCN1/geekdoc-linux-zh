  md: '# Chapter 7: Connect Locally, Communicate Globally: Connecting to a LAN


    # 87


    # IEEE and wireless networks


    The dominant wireless standard is based on the IEEE 802.11b (and the 802.11a and
    the more recent 802.11g) standard; 802.11b is also referred to as Wi-Fi (which
    is short for the wireless industry''s trade term "fidelity”). If you hear people
    talking about a Wi-Fi NIC, they are just talking about wireless NICs.


    worldwide professional society of nerds (is it necessary to use words like nerds
    or geeks to convey some technical meaning?). The IEEE, the "tryclos" of wireless
    networking, concerns itself with issues such as frequency wireless networking
    devices. Fortunately, this group has devised this wonderful standard that now
    enables everyone who''s interested to communicate without stringent wires between
    machines.


    IEEE (pronounced "eye-triple-e", or Institute of Electrical and Electronic Engineers,
    is a


    # Preparing to configure your wireless NIC


    Before you can configure your wireless NIC, you need to figure out two things:


    +   - Which type of wireless NIC do you have (or need)

    - How your wireless NIC should connect to your network


    The two types of 802.11b (11 Mbps) wireless electronics (or chip sets) that are
    widely used are Wavelan, built by Lucent Technologies, and Prism2 by Inters. Both
    types are supported by Fedora Core. The following list shows the manufacturers
    of each type. You can use the list to help figure out what kind of chip device
    you use.


    +   - Wavelan: Orinoco, other, less popular models: Apple Airport Entersyas Room
    802, Esa AirLink, and Melco/Buffalo 802.11b

    - Prism2: D-Link DWL-650, Linksys, Netgear, WPC11, and Compaq WL110; less popular
    models include Addron AWP-130, Bromac Freeport, GemTek WL-211, Intalk/Nokia, SMC
    26322, YDI, Z-COM X1300, and Telephones ZoomAir 400


    At the time this was written, the newest wireless protocol was 802.11g. This technology
    is capable of running up to 54 Mbps, which is roughly five times the speed of
    802.11b. However, many Linux drivers are available for this technology yet. The
    Prism54 project is busy developing open source Linux drivers for it at www.prism54.org
    to see whether your wireless card has a driver (by the time you read this chapter).
    One company sells software that allows your Linux computer to use Microsoft drivers.
    Consult www.linuxant.com for more information.'
