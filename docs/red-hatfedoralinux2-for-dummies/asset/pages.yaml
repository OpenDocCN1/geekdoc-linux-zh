  md: '# Appendix B


    # Discovering Your Hardware


    In This Appendix


    +   - PC hardware subsystems

    - Hard drive controllers

    - Computer memory

    - Hardware identification on Windows 9x and Windows Me computers

    - Hardware identification on Windows NT, Windows 2000, and Windows XP computers


    > You should-know as much about your computer as possible before installing Fedora
    Core. This appendix introduces the basic systems that make up a computer. We also
    show you how to discover information about those parts.


    Knowing your hardware can be useful at parties: “My processor is faster than your
    processor!” In addition to letting you brag at parties, this knowledge can be
    helpful if you have problems installing Fedora Core in Chapter 3. Understanding
    the bits and pieces that comprise your computer can help you install Fedora Core.
    That information also lets you know better what your new Linux computer is capable
    of. This helps you get started on your path to self.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_340_0.png)


    Linux runs on Intel processors from the venerable 386 up to the Digital Equipment
    Corporation (DEC) Alpha, some SPARC, and other systems. However, the version of
    Fedora Core included in these books works only on Intel 386-, 486-, and Pentium-based
    computers. That shouldn’t be a problem because it seems 99,9 percent (well, maybe
    not that many) of the world’s computers use Intel.


    # Breaking Down Your Computer


    We, don’t want you to break your computer. But we do want to describe the computer
    subsystems. Computers may seem mysterious when you first use them, but the truth
    is that they’re not terribly complex. When you break the parts that make up a
    PC, you see that each part performs a specific'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'the sum of the parts equals a computer. This list outlines the subsystems that
    comprise a computer:


    +   - Central processing unit (CPU): The CPU, or microprocessor, is often referred
    to as the brains of a computer because the CPU controls, in detail, everything
    the computer does. CPUs are controlled by software that is essentially a recipe
    for doing tasks as simple as detecting keyboard input or as complex as communicating
    across networks to display pictures in a Web browser.


    +   - Hard disks: Hard disks, also referred to as hard drives, store all the information
    on a computer. Hard disks are metal platters that store bits and bytes in tiny
    magnetic domains (spots). The disk spins, and a magnetic head floats on a cushion
    of air reads and writes from the disk. The spinning disk allows the head to quickly
    access any location on the disk and also the air cushion.


    +   - Disk controllers: The disk controller connects the drive to the computer’s
    microprocessor. Several types of controllers are commonly used: IDE, USB, FireWire,
    and SCSI. Most PCs come with IDE internal hard drives. However, high-performance
    computers tend to use SCSI-based drives because they’re faster (and more expensive).
    IDE controllers can connect as many as four drives.


    +   - CD-ROM: CD-ROMs store information like hard drives, but in optical rather
    than magnetic form. Most PCs use IDE-based CD-ROMs. SCSI CD-ROMs are faster, just
    like SCSI hard drives. The prices of USB and FireWire CD-ROMs are dropping fast,
    they’re becoming more common.


    +   - RAM, or Random Access Memory: RAM is much faster than hard disks and CD-ROMs.
    Because RAM is used to store temporary information, programs, data, and other
    types of information are stored in RAM — it ‘forgets’ everything when power to
    the computer is turned off. RAM is measured in megabytes (MB). A megabyte is roughly
    one million bytes.


    +   - Mouse: Which type of mouse do you have — bus, PS/2, or serial? How many
    buttons does it have? If you have a serial mouse, which - COM port is it attached
    to and which protocol (Microsoft or Logitech) does it use?'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Appendix B: Discovering Your Hardware


    +   - **Monitor/flat-panel display**: What are the make and model of the monitor
    or flat-panel display? What are its vertical and horizontal refresh rates? You
    need this information only if you plan to use the X Windows System, the graphical
    portion of Linux. Monitors and flat-panel displays perform the same function,
    but with different technologies. Monitors are the ubiquitous television-like,
    glass vacuum tube devices that are heavy and quickly being replaced by flat-panel
    displays. Flat panels use liquid crystal display (LCD) technology, which uses
    less power and space.


    +   - **Video card**: What are the make and model number of the video card or
    video chip set, and what is the amount of video RAM?


    +   - **Network interface card (NIC)**: If you have a network connection, what
    are the make and model number of the network interface card?


    That''s the rundown of computer subsystems. Each one performs a specific function;
    buttoned up inside a computer chassis (desktop style or laptop), they work together
    to create the computer you''re familiar with. The next two sections describe hard
    drives and memory in more detail.


    # Understanding Hard Drive Controllers


    The two main types of hard drives are IDE and SCSI, and each type has its own
    controller. IDE is more common in PCs, and newer PCs usually have two IDE controllers
    than rather. For each IDE controller, your system can have only two hard drives:
    a master and a slave. Therefore, a PC with two IDE controllers can have as many
    as four hard drives. You should know which hard drive is which. Also, if you have
    a Windows system you want to preserve, you should know on which hard drive it
    resides. The following list shows a normal configuration on a Windows system:


    +   - The first controller''s master drive is named C.


    +   - The next drive, D, is the slave drive on the first controller.


    +   - The next hard drive, E, is the master drive on the second controller.


    +   - The last hard drive, F, is the slave drive on the second controller.


    Windows is normally located on drive C, and data is on your other drives. This
    lettering scheme is one possibility: your hard drives may be set differently and
    may include CD-ROMs as drives on your IDE controllers.


    Some high-end PCs have SCSI controllers on their motherboards or on separate SCSI
    controller boards, either in addition to or instead of the IDE controllers. Older
    SCSI controllers can have as many as 8 devices on them, numbered from 0 to 7,
    including the controller. Newer SCSI controllers (known as wide controllers) can
    have as many as 16 devices, including the controller itself.'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# 322 Part VI: Appendixes


    If all you have a SCSI hard drive, Drive 0 or Drive 1 is usually your drive C,
    and others follow in order.


    If you have a mixture of IDE and SCSI controllers, your drive C could be on any
    of them. The sections "Discovering Your Windows 9x or Windows Hardware" and "Discovering
    Your Windows NT, 2000, or Windows XP Hardware," later in this appendix, show how
    to identify how many hard drives you have, which type they are, and which controllers
