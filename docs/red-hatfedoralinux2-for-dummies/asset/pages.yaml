  md: '# Red Fedora Linux 2 For Dummies


    The following sections describe each part.


    # Part 1: Installing Fedora Core


    In Part I, we introduce the Linux operating system and its history and some things
    you can do with the Fedora Core distribution. We also describe how to prepare
    your computer to install Fedora Core; because many, if not most, computers come
    with another, alem operating system installed, we describe how to reorganize your
    computer''s hard disk in order to install Linux. You find out what Linux is and
    how to prepare your computer to install Fedora Core. We then walk you through
    the installation and show you the basics of working with Fedora Core.


    # Part 11: Get Net?


    In Part II, you will find out about connecting to the Internet and local networks.
    You see how to jump on the Internet with your everyday modem or high-speed (broadband)
    DSL or cable modem. We also show how to connect to an existing network. If that
    local network has a high-speed Internet connection, you can use it as your portal
    to the wonderful world of surfing. The Internet can be dangerous, so we include
    instructions for creating your own firewall.


    # Part 111: Linux, Huh! What Is It Good For? Absolutely Everything!


    Part III guides you through the glorious particulars of doing something with Fedora
    Core. You''re introduced to the GNOME desktop window environment. You''re taken
    through its paces by finding how to move, resize, hide and close windows and how
    to use the file manager and more. Two chapters are devoted to the Fedora Core
    multimedia capabilities, such as listening to CDs and MP3s, in addition to how
    to rip and record them. The world''s radio stations are now available to you with
    streaming media technology. We introduce you to the Mozilla browser so that you
    can surf the Net and use the Evolution organizer to read your e-mail, use your
    calendar, and perform other tasks. We also describe in detail the full-featured
    OpenOffice desktop productivity suite. You can use OpenOffice with your Fedora
    Core machine to do all your writing and other work-related functions. You can
    even write a book with it! Finally, you see how to get organized with Fedora Core.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Part IV: Revenge of the Nerds


    In Part IV, we guide you through the use of your Fedora Core computer''s network
    capabilities. It''s Nerd City, but it''s also fun and useful. We start by showing
    how to build a simple network. After your network is up and running, we describe
    how to build network services, such as the Apache Web server, Samba, and printer
    servers. The last two chapters in this part are devoted to exploring the art of
    network computer security and troubleshooting network problems. Insert your pocket
    protector, strap the old Hewlett-Packard calculator to your hip, retape your glasses,
    and get ready for Saturday night!


    # Part V: The Part of Tens


    For A Dummies book just isn''t complete without The Part of Tens, where you can
    find ten all-important resources and answers to the ten most bothersome questions
    people have after installing Fedora Core. (The folks at Red Hat Software provided
    these questions.) We introduce the ten most important security concerns too.


    # Part VI: Appendices


    Ah, the appendices. Appendix A outlines the Fedora Core systems administration.
    Appendix B describes how to find out the details of your computer''s individual
    pieces of hardware; this information is sometimes helpful when you''re installing
    Fedora Core. Appendices C and D introduce you to using and managing the Linux
    file system. Appendix E shows how to use the Red Hat Package manager (RPM). Appendix
    F completes this book by describing what you can find on the companion DVD.


    # What You''re Not to Read


    Heck, you don''t have to read any of Red Hat Fedora Linux 2 For Dummies if you
    don''t want to, but why did you buy it? (Not that we are complaining.) Part I
    has background information. If you don''t want it, don''t read it. Also, the text
    in sidebars is optional but often helpful. If you''re on the fast track to using
    Linux, you can skip the sidebars and the text next to the Technical Stuff icon,
    as described in the following section. But we suggest instead that you slow down
    a bit and enjoy the experience.'
