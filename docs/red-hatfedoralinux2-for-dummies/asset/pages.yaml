  md: "# Chapter 17: Securing Your Future\n\nThis example launches the up2date utility\
    \ every day at 1 a.m. The option forces up2date to update any available Fedora\
    \ Core packages.\n\nRegularly updating your computer is an essential security\
    \ measure that's easy to do. Many break-ins occur because of out-of-date software.\
    \ With the help of up2date, you eliminate most vulnerabilities as they occur.\n\
    \n# Reducing your exposure: Removing and reducing services\n\nHackers look for\
    \ computer vulnerabilities by probing for vulnerable network services. Network\
    \ services — such as Apache, Samba, and DHCP — are, of course, designed to respond\
    \ to network queries. Therefore, hackers can identify out which services you run\
    \ and find which, if any, attacks to use.\n\nWe describe elsewhere how keeping\
    \ software updated minimizes your vulnerability. However, you can go one step\
    \ further and make a service vulnerable by turning it off. One simple security\
    \ rule is \"Keep it simple.\" The simple fact is if you do not need to run a service,\
    \ you shouldn't.\n\nWe describe in this section how to eliminate or reduce both\
    \ network and non-network services. These steps describe how to use the chkconfig\
    \ utility to change the startup scripts that control when, how, and whether a\
    \ network service starts at boot time:\n\n+   1. Click the GNU Menu and choose\
    \ System Settings->Server Settings-> Enter the root password, if you're prompted.\n\
    \   The Service Configuration dialog box opens.\n2. Select an unnecessary service\
    \ and shut it off by clicking the Stop button.\n3. Click the OK button when the\
    \ confirmation dialog box appears.\n4. Click the check mark to the left of the\
    \ service to remove the check mark.\n   Removing the check mark prevents the service\
    \ from starting automatically at boot time.\n5. Repeat Steps 2–4 for each unnecessary\
    \ service.\n6. When you have turned off each unnecessary service, click the Save\
    \ button.\n7. Choose Quit from the File menu."
  merge: -1
  pgno: 264
- img_proc: true
  md: '# 244 Part IV: Revenge of the Nerds


    Which services you turn off depends on your needs, of course. For example, if
    you''re unintentionally running a Web server, turn off the httpd service. You
    generally should be able to turn off these services:


    +   - The Advanced Power Management Daemon (APMD) is useful if, like most people,
    regularly power-off your personal workstation or laptop. However, APMD is generally
    unnecessary on servers that run continuously. You want to keep APMD in the former
    case (workstation or laptop) and remove it in the latter (server).

    - GPM: This service allows you to use a mouse when you''re running in nongraphical
    mode. You''re running in graphical mode, so turn it off.

    - The job queue daemon: The atd daemon is used to schedule one-time-cron jobs.
    If you need it, you know it. Otherwise, turn it off.

    - Network File Sharing (NFS): You need only services as nfs, nfslock, portmap
    and autofs when you''re running an NFS server or client. The last thing you want
    to do is share files to the Internet, for example.

    - Print services: Many people don''t run the printer daemon on servers. Turn off
    CUPS (Common UNIX Printing System) or lpd when you don''t need to print.


    +   - Samba: Just like with NFS, you should turn off Samba if you don''t need
    it.


    The rest is up to you. Terminate hackers with a vengeance.


    You cannot modify a service when it isn''t running. You can toggle the check mark
    on a service that isn''t running, but it doesn''t have any effect if it''s not
    running.


    You can use the CLI-based chkconfig utility. Open a Gnome Terminal session and
    log in as root (su -). This lists your options:


    +   - List the services by running chkconfig --list command.

    - List an individual service by specifying the service after the --list option:
    chkconfig -- list apmd.

    - Stop a service with the --add option: chkconfig -- add apmd.

    - Delete a service with the --del option: chkconfig -- del apmd.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_265_0.png)


    # Using a Secure Shell client


    You may be familiar with graphical network communication applications, like the
    Mozilla Web browser and Evolution e-mail clients. However, a world of text-based
