  md: '# Chapter 15: Building Your Own, Private Network 207


    You should turn off your external network connection for now because you turn
    on IP forwarding, which enables communication between the Internet and your private
    network. IP forwarding can be a security hazard until you finish the Internet
    gateway configuration. Temporarily disconnecting your Internet removes the insecurity:
    Unplug your (DSL, cable, or telephone) modem''s external (internet) cable.


    These steps describe how to configure a Linux computer as the Internet gateway
    for a LAN:


    +   1. Add the appropriate internal and external network connections to your intended
    Internet gateway.

    2. For example, the internal network connection is eth0, and the external network
    connection is eth1.

    3. Log in to your Internet gateway (in this example, Veracruz) as root.

    4. Click the GNOME Menu button, choose Accessories:Text Editor, and click the
    Open button.

    The Open File dialog box opens.

    5. Enter /etc/sysctl.conf in the Selection text box and click the OK button.

    The gedit program displays the contents of sysctl.conf, as shown in Figure 15-3.

    6. Locate this line (which should be close to the top of the file):

    net.ipv4.ip_forward = 0

    7. Change 0 to 1:

    net.ipv4.ip_forward = 1

    8. Click the Save button and then choose File:Quit to close gedit.

    You can view the change by clicking the Nautilus Refresh button. You have to restart
    Linux networking for the change to take effect.

    9. Open the Service Configuration utility by clicking the GNOME Menu button and
    choosing SystemSettings:Server Settings:Services.

    10. Enter the root password, if you''re prompted.

    11. Locate and click the network service.

    12. Click the Restart button to turn on IP forwarding.

    The Information dialog box opens.

    13. Click OK.'
