    # Using the Fabulous MPlayer


    Whenever a desperate need exists, the Superman, er open source movement comes
    to save the day. Until recently, you couldn''t use any Linux application to listen
    and view most popular streaming formats. Now, MPlayer has burst on the scene and
    fills that gap.


    MPlayer can play most popular (and many obscure) audio and video streaming formats.
    Although MPlayer is under intense development, it''s still technically in the
    beta development phase. However, MPlayer is quite usable, and we think that you
    should consider using it. We do!


    This list shows some streaming formats MPlayer can play:


    +   - MPEG-1/Layer 3 (MP3): MP3 is a popular but proprietary codec used for both
    storing and streaming audio.

    - Ogg/Vorbis: This new-up-and-coming open source streaming format is unencumbered
    by any copyrights or patents, like other formats are.

    - Microsoft Media Server (MMS): You can listen to radio broadcasts that use the
    popular MMS format with MPlayer. Previously, you had to use the Microsoft client
    to listen to MMS streams.

    - Digital Versatile Disc (DVD): You can play DVDs with MPlayer.

    - RealAudio: You have to download, compile, and install the RTSP package to use
    RealAudio.


    MPlayer is not now included in the Fedora Core distribution. We hope that it will
    be later, but for now you have to obtain it from its developers. These steps describe
    how to download, install, and use MPlayer:


    +   - Log in, open Mozilla, and go to www.mplayerhq.hu/homepage/dload.html.'
