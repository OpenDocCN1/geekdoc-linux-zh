- img_proc: true
  md: '# Appendix C: Filing Your Life Away 333


    # Moving and copying files and directories


    The commands for moving and copying directories and files are mv for move and
    cp for copy. If you want to rename a file, you can use the mv command. No, you''re
    not really moving the file, but the Linux (and Unix) developers realized that
    renaming something was much like moving it. The format of the command is


    ```

    mv source destination

    ```


    Create a file that you can practice moving. The touch command updates the time
    stamp on an existing file or creates an empty file if it doesn''t exist. In this
    case, the file test doesn''t exist and is created by touch:


    ```

    touch go

    ```


    Move the new file:


    ```

    mv go to

    ```


    This command leaves the file in the same directory and changes its name to to.
    The file wasn''t really moved — just renamed.


    Try moving the to file to the veracruz directory. To do that, you have to first
    move the file up and then move it into the veracruz directory. You can do it with
    one command:


    ```

    mv to ...veracruz

    ```


    The destination file uses the double-dot (..) designation; every directory contains
    a double-dot designation that points to the parent directory. The command tells
    Linux to go up one directory level and look for a directory named veracruz and
    then put the file into that directory with the name newgoto because you didn''t
    specify any other name. If you do this instead:


    ```

    mv go ...veracruz/now

    ```


    the go file to the veracruz directory named now. Note that in both cases (with
    the file maintaining its name, go, or taking the new name now), your current directory
    is still can and all your filenames are relative to that directory.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_354_0.png)


    Strictly speaking, the file still hasn''t really moved. The data bits are still
    on the same part of the disk where they were originally. The file specification
    (the directory path plus the filename) you use to talk about the file is different,
    so it appears to have moved.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Removing files and directories


    The command for removing, deleting, a file is rm. Using straightfor- ward. Create
    a dummy file to erase:


    ```

    touch junk

    ```


    You can delete the file with this command:


    ```

    rm junk

    ```


    You have removed the dummy file from the current directory. To remove a file from
    another directory, you need to provide a relative filename or an absolute filename.
    For example, if you want to expunge now from the veracruz direc- tory, use this
    line:


    ```

    rm .../veracruz/now

    ```


    You can use metacacters (similar in many ways to Windows wildcards) with rm, but
    be very careful if you do so! When files are removed in Linux, they’re gone forever
    — kaput, vanished — and cannot be recovered.


    This command removes everything in the current directory and all the dire- ctories
    under it that you have permission to remove:


    ```

    rm -r *

    ```


    Do not give this command as root (the superuser)! You should always be careful
    when you''re running any command as root, but to be especially careful with commands
    that can erase entire directories and file systems.


    To decrease the danger of removing files inadvertently when you use metacacters,
    be sure to use the -i option with rm, cp, mv, and various other commands. The
    -i option, which means interactive, lists each filename (with the mv or cp com-
    mand) to be removed (with the rm command) or overwritten. If you answer y or Y
    to the question, the file is removed or over-written, respectively. If you answer
    anything else, Linux leaves the file alone.


    You can remove not only files but also directories. Suppose that you have an old
    directory, /tmp/junk, that you don''t need anymore. You can remove it and all
    its contents:


    ```

    rm -rf /tmp/junk

    ```


    Giving the rm command these options (r and f) removes the /tmp/junk- directory
    and all files and directories under it. The r option allows to remove recursively,
    in recursion, the command works through every subdirectory in the parent directory.
    The f option issues the command forcefully. No prompts are given.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_355_0.png)


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_355_1.png)'
  merge: -1
