  md: '# Resizing windows


    Sometimes, a window is a little too big or a little too small, and you know that
    life would be much easier if you could just nudge the window into shape. To do
    just that, position the mouse cursor on any border of the window. Click and drag
    the window''s outline to the size you want. Release the mouse button and the window
    takes the new size.


    # Minimizing windows


    Now that you have put lots of windows on the screen, how can you get rid of a
    few or all of them? You can minimize (or iconify) a window by clicking the bold,
    underscored button toward the upper-right corner, which removes the window from
    the desktop and places it in a storage area of the GNOME Panel. If you''re in
    a particularly devilish mood, you can be more drastic and close a window. Figure
    9-2 shows an open Mozilla window minimized—you can see its icon on the GNOME Panel
    along the lower, central edge of the screen.


    Figure 9-2: Mozilla minimized inside GNOME.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_140_0.png)


    Here are a few ways to get rid of a window, starting with the least drastic and
    escalating to outright window death:


    +   * Take advantage of any exit buttons or menu options that the window or application
    in window gives you. For example, many applications allow you to choose Exit to
    close the application.

    * Click the X button in the upper-right corner of the window''s title bar to close
    the window.

    * Click the upper-left corner of the window (or right-click the title bar) and
    choose the Close option from the menu that opens.


    TIP


    You can return a minimized window to the desktop by clicking the icon that corresponds
    to the window on the GNOME Panel.'
