  md: '# Appendix C: Filing Your Life Away 331


    # Changing your working directory


    You occasionally (often?) want to change your working directory. Why? We''re glad
    you asked — because changing it enables you to work with shorter relative pathnames.
    To do so, you simply use the cd (for directory) command.


    To change from your working directory to the /usr directory, for example, type
    this command:


    ```

    cd /usr

    ```


    # Going home


    If you type cd by itself, without any directory name, you return to your home
    directory. Just knowing that you can easily get back to familiar territory is
    comforting. There''s no place like home.


    You can also use cd with a relative specification; for example:


    ```

    cd ..

    ```


    If you''re in the directory /usr/bin and type the preceding command, Linux takes
    you to the parent directory named /usr:


    ```

    cd /usr/bin

    cd ..

    ```


    Here are a couple of tricks: If you type cd ~, you go to your home directory (the
    tilde symbol (~) is synonymous with /home/username). If you type cd ~<username>,
    you can go to that''s home directory. On very large systems, this command is useful
    because it eliminates the need for you to remember — large directory specifications.


    This list describes the shell redirection symbols:


    +   > known as redirect standard output. When you use it, you tell the computer
    "Capture the information that normally goes to the screen, create a file, and
    put the information in it."


    +   > tells the computer, "Feed the information from the specified file to standard
    in (also known as standard input), acting as though the information is coming
    from the keyboard.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_352_0.png)'
  merge: -1
