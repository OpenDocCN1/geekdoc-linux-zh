  md: '# Part III: Linux, Huh! What Is It Good For? Abosutely Everything:


    # Creating directories


    Right-click anywhere in a Nautilus window and choose New Folder to create a new
    directory. A new folder is displayed with the name Untitled folder. Enter any
    name you want for the directory.


    # Viewing files and directories


    Files and directories are displayed onscreen as icons by default. The only information
    an icon shows is the name and whether an item is a file or directory (directory
    icons also show the number of files and directories they contain). You can display
    files and directories as a list by choosing View: View as List.


    This list describes the differences between views:


    +   - Icons view: The default display option; shows the icon and indicates whether
    an item is a file or directory. Regular file icons take several forms, but text
    and configuration files look like pieces of paper with a corner folded. Files
    containing specific types of data have small subicons overlaid on the icon. For
    example, PDF files have a PDF subicon. Links, devices, and other objects take
    other forms. Directories take the form of a partially open mania folder. Icons
    are evenly placed across the entire File Manager screen. Icons tend to distinguishing
    files and directories easier, but take up more space onscreen.

    - List view: Displays the size and time stamp of each file and directory in addition
    to their names.

    - View as: Allows you to select icons or lists as your default folder view for
    all or specific directories. You can also associate MIME types with specific applications.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_153_0.png)


    You can use Nautilus to create some shortcut icons on your desktop that point
    to files or applications. In Nautilus, just click and drag any file or application
    to any blank part of the desktop and then release the mouse button. An icon is
    placed on the desktop. You then start the application by double-clicking its icon.
    If the icon points to a data file (a text file, for example) and Nautilus knows
    how to handle its MIME type, Nautilus launches the application to open the file.
    Otherwise, Nautilus prompts you to tell it which application to use to open it.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_153_1.png)


    Nautilus is programmed to recognize numerous Multipurpose Internet Mail Extensions
    (MIME) types, and they define what type of information a file is. In other words,
    MIME keeps it associated with certain extensions. For example, when you double-click
    a .doc file, Nautilus recognizes the .doc file suffix corresponds to a Word MIME
    type and opens the OpenOffice word processor (as described in Chapter 13), which
    loads the .doc file.'
