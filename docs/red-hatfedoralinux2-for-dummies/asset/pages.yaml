    | Port: Icecast2 lists connection requests on a TCP port and use port 8000 by
    default. You can easily change the port by modifying the Icecast2 configuration
    file. |

    | MountPoint: This component specifies the Icecast2 server to connect to. Icecast2
    is capable of playing two streams. In this example, you use the content file track1.ogg,
    which you may have created in the preceding section. |

    | Protocol: Icecast2 uses HyperText Protocol, or HTTP, packets to encapsulate
    audio streams. HTTP is a good choice because it''s easy to configure your firewalls
    to allow HTTP connections. |

    | Address: The Icecast2 server''s IP address can be either a domain name or in
    numeric |'
