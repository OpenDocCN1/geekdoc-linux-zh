  pgno: 99
- img_proc: true
  md: '# Chapter 6: Broadband Rocks!


    DSL provides high-speed Internet connections by electronically converting your
    computer''s digital information into a form that can be transmitted from your
    home or business to the telephone company. When your data finds its way to the
    telephone company, it''s converted into another form and sent to your ISP.


    DSL uses frequencies in the millions of cycles per second — the megahertz (MHz)
    range — compared to traditional analog modems, which work with signals in the
    thousands of cycles per second (kHz). You get much higher connection speeds when
    you use higher frequencies. Unfortunately, the telephone system wasn''t designed
    to work with higher frequencies.


    Fortunately, the brainiacs of the world have figured out how to get high-speed
    DSL connections from the old, slow POTS. They have designed new digital signal-processing
    chips to overcome the POTS architecture. The result is that if you live close
    enough — roughly three to four miles — to your DSL provider''s equipment, you
    can use DSL to connect to the Net.


    # Facing DSL configuration woes head-on


    This section describes the basic DSL modem-configuration issues. We take the time
    to give you an overview because it''s easy to focus on the trees at the expense
    of the cost. Please check out and get familiar with the following list. Getting
    your DSL modem working is easier after you do so.


    Most consumer DSL providers now use the asymmetrical DSL (ADSL) type of connection.
    The following list describes the process for getting an ADSL connection working.
    (Please note that we use the generic acronym ADSL interchangeable with ADSL. Most
    consumer DSL connections are really ADSL, and that''s the type of connection we
    describe in this chapter.) Follow these steps to set up DSL service:


    +   1. Find a DSL provider.


    You need to find out whether you live or work close enough to the DSL provider''s
    equipment to get a connection. DSL providers check your address and tell you whether
    they can take your business. You can often check your proximity on the DSL provider''s
    Web site.


    +   2. Connect your DSL modem to your telephone jack and your computer.


    Your DSL modem acts as the intermediary between your computer and your DSL service
    provider. You must connect one side to the phone jack and to your computer''s
    Ethernet NIC.


    +   3. Configure your Fedora Core computer to communicate with the DSL modem.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_100_0.png)'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# 80 Part II: Got Net?


    Your Fedora Core computer connects to the DSL modem via an Ethernet NIC. You must
    configure your Ethernet NIC to work with the modem.


    +   4. Configure the DSL modem with your PPP account name and password from your
    ISP.


    You must authenticate your DSL modem to your ISP. DSL connections get logged on
    to your ISP just like traditional analog modems do. You configure your DSL modem
    with your ISP user name and password.


    +   5. Configure the DSL modem''s internal (private) network interface.


    Your DSL modem must be able to communicate with a Fedora Core over an Ethernet
    connection. You must configure the DSL modem so that it uses the same network
    parameters as your computer.


    +   6. Configure the DSL modem user and administrative passwords.


    DSL modems provide a reasonable level of security. You should take advantage of
    this security by assigning your password to the modem. That action prevents hackers
    from breaking into your modem and causing problems.


    +   7. If necessary, configure the modem''s network address translation (NAT)
    settings.


    Many, if not, most, DSL modems come configured to use NAT by default. This is
    a good thing because NAT effectively works as a firewall. There is no such thing
    as too much protection. (NAT also makes your private network, if you have one,
    look like single IP address.


    The Internet was designed to send — or route —information Internet Protocol (IP)
    addresses are used to designate where the information is coming from and where
    it''s going. IP addresses can be routable or nonroutable. Nonroutable addresses
    can be reused; you can use the same nonroutable addresses that your neighbor without
    interfering with one another.


    NAT is used to convert nonroutable IP addresses into routable ones, which is useful
    when you''re connecting your private network to the Internet by translating your
    internal IP addresses into one of your ISP''s routable IP addresses. You need
    to configure your DSL modem to convert your computer''s private (for example,
    192.168.1.1) and nonroutable address into an address assigned to your DSL connection
    by your ISP.


    +   8. Save the settings to nonvolatile memory and restart the modem.


    You need to save your DSL modem''s settings after you have them working. You don''t
    want to enter the configuration every time you turn on your modem.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_101_0.png)'
