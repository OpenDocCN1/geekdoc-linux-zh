    The Icecast2 file is downloaded into your current directory.


    We break our unstated rule of installing only precompiled software from RPM packages
    in this section. Although Icecast2 is available in RPM format,, Ices2 is not.
    We could use the Icecast2 package, but it requires a library (software''s shared
