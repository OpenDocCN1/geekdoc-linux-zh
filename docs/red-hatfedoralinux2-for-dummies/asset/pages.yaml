  md: '# Chapter 14: Days of Wine and Applications


    # VMWare: A Virtual Reality Machine


    Sometimes, you need to use an application that just doesn''t run under Linux,
    even with the help of Wine. For example, one of us has to use a trouble-ticket
    system to fix customers'' problems. The problem is that the trouble-ticket application
    doesn''t run under Linux, or without Wine. That author must then install both
    Windows and Linux on his computer (a dual-boot system) or else maintain a separate
    one for the sole purpose of running the single application.


    Nothing is wrong with using a dual-boot computer, of course. But it''s sort of
    a waste of time if all you need is to run one or two applications. Dual-boot computers
    also have to be rebooted whenever you need to use the other operating system.
    An alternative to dual booting is VMware, a commercial product from VMware, Inc.
    This program creates a virtual computer within a physical computer. The virtual
    computer runs as an application, just like OfficeOr Mozilla.


    VMware looks and works just like a real PC. The virtual VMware can run an operating
    system, as Linux or Windows, just like any real computer. The operating system
    running on the virtual machine behaves just like the real operating system. Any
    applications it hosts, therefore, look and work just like real applications!


    VMware is also good for writing Linux books. Writing techy books like this one
    requires you to use early beta versions of new releases during the initial draft
    phase. The old method required installing the beta on your computer and using
    it for both testing and writing; alternatively, you can use two computers side-by-side.
    Both methods are clunky and cause numerous headaches when the beta does some funky
    thing. VMware solves the problem by allowing you to run the current production
    version of Fedora Core on your host computer and install the beta on the virtual
    computer. You can test the beta to your heart''s content while writing at the
    same time in OpenOffice — all on the same virtual computer. Updating from one
    beta to another is snap too.


    You can download the VMware Work product for free. It requires a license that
    costs approximately $300 for commercial use and $100 for educational use. It''s
    money well spent.


    VMware also offers a 30-day evaluation license for no charge. The temporary license,
    which isn''t limited in any way other than the time limit, is ideal for testing
    this powerful tool. The steps in the following section describe how to download
    the product and its temporary license to find out about its power.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_206_0.png)'
