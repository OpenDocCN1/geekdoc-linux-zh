    # Protecting your passwords


    You can use Mozilla to save passwords that you use when you''re browsing the Internet.
    When you start saving passwords, you should also start encrypting the Internet.
    Encrypting passwords is optional, but we highly(highly!) recommend finding your
    passwords much more difficult for someone else. With all the business you do on
    the Internet, you must protect your information as much as possible. Follow these
    steps:


    +   1. From your Mozilla browser, choose Preferences from the Edit menu.

    2. Click the plus sign (+) next to the Privacy & Security menu.

    A submenu opens.

    3. Choose the Passwords option.

    The Passwords dialog box opens.

    4. In the Encrypting versus Obscuring section of the Passwords window, click the
    button Use encryption when storing sensitive data.

    5. Click OK.

    The Change Master Password dialog box opens.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Chapter 11: Surfin'' on the Net and Groovin'' to Tunes 145


    +   6. Enter your password in the New password text box.


    The Password quality meter shows how "good" your password is.


    +   7. Reenter your password in the New password (again) text box.


    When both passwords match, the OK button becomes active.


    +   8. Click the OK button.


    Mozilla encrypts any password you save. You have to enter the master password
    just once whenever you start Mozilla and access a password-protected object for
    the first time. It''s pretty cool.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_166_0.png)


    You can manage passwords whenever you want. Choose Preferences Privacy & Security
    from the Edit menu. Choose Manage Passwords and the Passwords dialog box opens.
    You can then remove passwords as desired.


    # Groovin'' to Tunes with CD Player


    Imagine that you''re sitting alone, working at your computer — like you are now.
    Or, you could be reading a book that''s boring you. It''s Saturday night too,
    of course. What a drag. Want to go to a party? Perhaps play some music? Although
    we cannot provide the party or the music, we can show you how to use your computer
    to listen to some tunes.


    In this section, we use the tools that Fedora Core provides your workstation into
    a sound system, including all the necessary applications to play CDs and tools
    for connecting your PC to a sound card and speakers. Start by making sure that
    your computer can play music.


    # Setting up your sound system


    Fedora Core should have automatically configured your computer''s sound system
    during the post-installation process we describe in Chapter 3. However, you may
    run into problems — especially on older computers — so Fedora Core provides a
    sound-card-detection utility.


    You can configure and test your sound card at the same time by following these
    steps:


    +   1. Log in to your Linux computer, click the GNOME Menu button, and choose
    System Settings Soundcard Detection.


    Enter the root password, if prompted.


    The Audio Devices dialog box opens, as shown in Figure 11-2.'
