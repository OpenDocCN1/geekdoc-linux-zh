  md: '# Chapter 7


    # Connect Locally, Communicate

    Globally: Connecting to a LAN


    **In This Chapter**


    +   - Networking with an Ethernet or wireless NIC

    - Using the Fedora Core Network utility

    - Starting and stopping your local network connection


    This chapter shows how to connect your Fedora Core computer to an existing local
    area network (LAN), also referred to as a private network. It''s different from
    connecting directly to the Internet with a dial-up modem or broadband connection,
    as we describe in Chapters 5 and 6; these chapters show how to connect a single,
    stand-alone Fedora Core computer directly to the Internet. In this case, you connect
    your Fedora Core computer to a LAN.


    You may be building your Fedora Core computer to use at home, work, or school.
    It doesn''t matter what the venue is: You can use the information in this chapter
    to connect your computer to any existing LAN. Note that your computer has access
    to the Internet if that LAN has access.


    Don''t get discouraged if you don''t have access to a LAN. You can make your own!

    Chapter 15 describes how to put one together.


    In this book, the terms LAN and private network are used interchangeably.


    If you configured your Ethernet card to connect to your LAN during the installation
    process we describe in Chapter 3, that''s great! You can skip this chapter or
    just browse it for fun. Otherwise, you can use this chapter to connect your computer
    to a LAN.


    Although building a private network isn''t exactly rocket science, a detailed
    description of how to network two or more computers is beyond the scope of this
    book because so many network configurations are possible. Many good books are
    available that explain how to do that, and the best place to start is at the Wiley
    Web site: www.wiley.com.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_106_0.png)'
