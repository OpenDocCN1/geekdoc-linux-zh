  md: '# Chapter 20: Ten Problem Areas and Solutions 295


    # "I forgot my password"


    **Problem:** You have to remember a zillion passwords at work and home.

    Unfortunately, you cannot remember your Linux password.


    **Solution:** The solution is simple if you have forgotten a user account password
    but still remember the root password. In that case, simply log in as root and
    reset the root password. For example, if your user name is *rod*, run the command
    password *rod* likes coffee.


    The solution is more difficult when you forget the root password. You have to
    become a hacker and break in to fix the problem. Fortunately, Red Hat provides
    two possible solutions: Either boot into single-user mode via GRUB or boot from
    the first Red Hat installation disc.


    # "I forgot my root password!"


    **Problem:** You cannot reset a regular user''s password if you cannot log in
    as the root (superuser). However, you can easily circumvent having to log in as
    the root user by booting your Fedora Core into single-user mode.


    **Solution:** Turn on or restart your computer and press the cursor keys to select
    the Linux operating system when the GRUB boot screen appears; Linux is selected
    automatically if you''re not using a dual-boot system (installed installed Linux).
    Next, press the *e* key to edit the GRUB configuration. You see three lines, the
    middle of which starts with the word *kernel*. Use the cursor keys to select the
    *kernel* line with the 3-line menu. Press the *e* key again then enter the number
    *1* at the end of the line. Press the Enter key and you return to the original
    GRUB window. Finally, press the *b* key to boot your system into single-user mode.


    You can tell Linux to boot into nongraphical, rather than single-user mode, by
    substituting *3* for *1* when you are editing the GRUB boot mechanism.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_316_0.png)


    # "I need to break into my own computer!"


    Power on or reset your computer. Change your BIOS to boot from CD-ROM, if necessary.
    Before your computer starts the GRUB boot system, insert the companion DVD into
    the DVD or CD-ROM drive. When the Red Hat installation process begins, type *linux
    rescue* at the boot: prompt.'
