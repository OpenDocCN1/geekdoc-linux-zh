  md: "# 356 Part VI: Appendixes\n\n+   - You can run Fedora Core in text mode with\
    \ less than 64MB of memory.\n Nongraphical Linux systems are typically used as\
    \ servers.\n\n+   - Fedora Core provides several installation classes that install\
    \ bundles of software. The various classes take up different amounts of space,\
