    ```

    wine notepad.exe

    ```


    Running the Wine program — for example, wine notepad.exe — for the first time
    creates awine directory in your home directory. The .wine directory contains all
    the configuration information that the Wine system needs to order. The configuration
    information is in the config file. Several additional files, all with the .reg
    suffix, mimics the Windows Registry. The Windows operating system uses the Registry
    to organize its configuration parameters; Linux on the other hand, uses separate
    files, such as in the /etc, /etc/sysconfig, and /usr/local/etc directories, to
    hold its configuration information.


    +   5. Click the Run key and the Notepad window opens, as shown in Figure 14-1.


