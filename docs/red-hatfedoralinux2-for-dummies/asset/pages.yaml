  md: '# Chapter 9: Gnowing GNOME 123


    # Leaving GNOME and X


    If you want to leave your computer on but don''t want to leave it open to anyone
    just walking along, you can save yourself the time logging out of your GNOME desktop
    by using the screen lock. To do so, click the GNOME Menu button and choose Lock
    Screen; the screensaver is displayed. To return to productive life and your desktop,
    press any key or wiggle your mouse and enter your password in the X Screensaver
    window that opens.


    # Securing your computer while you step out for a moment


    Locking your screen is one of the best security features you can use. To lock
    your screen, click the GNOME Menu button and choose Lock Screen. Your screen locks
    up and you must enter your password to get back in. Locking your screen is a good
    idea when you''re going to be away from it for even a minute or two.


    # Going home for the night


    After you have finished for the day and want to go home (or just upstairs), you
    need to log out. Click the GNOME Menu button and choose Log Out. The Are Sure
    Want to Log Out? window opens. Click Log Out to — guessed log out. You also have
    the options to shut down or reboot your computer.


    GNOME configures a random screensaver by default. You can select a single screensaver
    by clicking the GNOME Menu button and choosing Preferences Screensaver Preferences
    window opens. For example, you can switch from the default random screensaver
    to the Xjack (we all know that all work and no play makes Jack a duck boy) screensaver.
    It''s not a bad selection for long winters spent at peaceful resorts with plenty
    of time to write Linux books!


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_144_0.png)


    # eXterminating X


    When you get your applications to respond to you, you can simply stop X, which
    kills all programs running under it. To do so, press the Ctrl+Alt+ Backspace keys
    all at one time. If you started X manually, you can then log out of the account.
    If X is started automatically at boot time (as we assume in this book), you see
    the X login screen and you can log back in.'
  merge: -1
