  md: '# Appendix F


    # About the DVD


    The DVD that comes with this book contains the full Fedora Core 2 distribution.
    Wiley has pioneered the use of DVDs in place of CD-ROMs because they''re easier
    to use, and we hope, will make using Fedora Core more enjoyable.


    This appendix describes the minimum computer configuration you need in order to
    install Fedora Core and also some of what you get on the companion DVD.


    If your computer is not capable of reading DVD-ROMs, you can get the Fedora Core
    2 distribution on CD-ROMs by sending in the coupon in this book.


    Although the DVD contains the Linux kernel and supporting GNU programs and applications,
    it doesn''t carry some applications described in this book. You must download
    applications such as Wine, VMware, MediaPlayer, and Icecast2/Ices2 from the Internet.
    We describe where and how to download all the applications we discuss in this
    book that aren''t on the companion DVD.


    # System Requirements


    Make sure your computer meets the minimum system requirements listed here and
    in Chapter 3. If your computer doesn''t match up to most of these requirements,
    you may have problems installing and running Fedora Core:


    +   - Pentium-class PC with 400MHz or faster processor is recommended for graphical
    mode (that''s what most people use). You need only a 200MHz or faster Pentium-class
    PC if you run your computer in text mode. Many people run their Fedora computers
    in text mode when they''re providing simple network services, such as Apache Web
    or DNS.

    - For reasonable performance using the graphical X Window System, we recommend
    at least 256MB, but you can get away with only 192MB of main memory. You can never
    have too much memory, and we recommend that you increase your computer''s memory,
    if possible.'
  merge: -1
