    # Navigating with the Nautilus File and Internet Integration Manager


    Being the boss doesn''t necessarily make you a bad person. Does it? It''s just
    a job. Right? Well, little GNOME guy is a good worker and doesn''t get paid much
    and likes to get bothered around. Just press a key here and click a button there,
    and you can boss him around any worthy pointy-pointed Dilbert manager. GNOME even
    comes with its own file and integration manager that saves work and makes time
    for those long lunches.


    Nautilus is the GNOME graphical shell and network navigator system. Nautilus follows
    in the tradition of all good file managers by graphically displaying the files
    and directories on your computer. You can copy, move, delete, and execute files
    by pointing and clicking; creating directories and viewing file details are a
    snap too. Nautilus even goes a step further: You can use it to configure'
