  md: '# 38 Part I: Installing Fedora Core


    # # Installation Stage 3: Configuring Your Network


    If you''re ready to configure your network and your computer has an Ethernet adapter
    or a Wi-Fi (a wireless network interface using the 802-11b standard) adapter,
    enter the appropriate information, as described in the following steps. If you
    have a network adapter but don''t have a (wired or wireless) network to connect
    to, you should still enter a host name in Step 3. Entering a host name makes life
    easier if and when you eventually connect to a network.


    If you have a NIC, the Network Configuration window appears and you can follow
    these steps to configure your system for a network; if you don''t have a NIC,
    skip to Step 9:


    +   1. If you''re connecting to a network that uses the Dynamic Host Configuration
    Protocol (DHCP), you don''t have to do anything more to configure your network
    connection. Click the Next button and skip to Step 9.

    2. Click the Edit button.

    3. Toggle the DHCP option by clicking the Configure using DHCP button.

    4. Enter your IP address and netmask in the Edit interface subwindow.

    The following list briefly explains IP addresses and netmasks:


    +   * IP address: This is the numeric network address of your Fedora Core computer
    and the address is known on your local network and, in many cases, the Internet.
    If you haven''t registered your private network''s address space with InterNIC
    (the organization in charge of distributing IP addresses), you can use the public
    address space that goes from 192.168.1.1 to 192.168.254.254,


    If you''re connecting to an existing LAN, consult your administrator to get an
    IP address that isn''t already being used. You have to keep track of unused IP
    addresses if you''re running your own LAN.


    +   * Netmask: Private networks based on the Internet Protocol (IP) are divided
    into subnets. The netmask determines how the network is divided. For IP addresses,
    such as the example in the preceding bullet (192.168.1.1), the most common netmask
    is 255.255.255.0.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_59_0.png)'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Chapter 3: Ready, Set, Install! 39


    5. Click the OK button.


    6. In the Hostname text box (next to the button labeled manually), type your computer''s
    network name (including the host and network (domain) name) in the text box.


    For example, if you want to name your computer cancun and your network name is
    paunchy.net, you type cancun.paunchy.net.


    If you don''t want to name your computer name and domain name during the network
    configuration process, it is referred to as localhost.localdomain. Otherwise,
    the Welcome screen refers to whatever name you gave it. For example, in the preceding
    example, you would see Welcome to cancun, paunchy.net.


    7. Enter your gateway and primary DNS (and, optionally, the secondary and tertiary
    DNS) IP addresses in the appropriate text boxes in the Miscellaneous section,
    at the bottom of the screen.


    This list describes what parameters do:


    +   - Gateway: The gateway is the numeric IP address that connects your private
    network to the Internet (or another private network). Fedora Core uses the 192.168.1.254
    by default. You can accept this address, but leaving it is a better option, unless
    that address is really your gateway. Chapters 5, 6, and 7 describe how to configure
    your Linux computer to connect to the Internet via a telephone, broadband (DSL
    or cable), and existing LAN connections, respectively. If you do, setting a default
    route now can interfere with your connection.


    +   - Primary DNS: The Internet Protocol uses the Domain Name Service (DNS) system
    to convert names such as www.redhat.com into numeric IPs. A computer that acts
    as a DNS server is a name server. We suggest leaving this blank, however, unless
    you''re on a private network with a name server or be connected to the Internet
    (your ISP supplies a DNS). When you designate a nonexistent name server, many
    networking programs work so slowly as to wait in vain for the absent server.


    +   - Secondary and tertiary DNS: The secondary and tertiary DNS back up the primary
    DNS server. If your computer cannot find the primary DNS server, it may find the
    secondary. If not, it should find the tertiary. Best of luck!


    If you''re connecting to someone else''s LAN — if you''re building a Fedora Core
    computer at work, for example — you should obtain this address from your system
    administrator. If you''re connecting to your own LAN at home, consult yourself
    because you''re probably the administrator.


