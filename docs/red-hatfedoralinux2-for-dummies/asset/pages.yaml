  md: '# "My network is working, yet not working"


    **Problem:** You have configured and checked your network connection and it appears
    to be okay. But you cannot connect to some or all of the machines or network services
    you want. You are perplexed.


    **Solution:** Check your Iptables-based firewall. Red Hat has two different levels
    of firewalls during the installation. This book describes several different Iptables
    firewall configurations too. If your firewall isn''t configured correctly, it
    prevents or all network communications. Even if your firewall is configured correctly,
    it may be designed, in many cases, to block the type of communications you want.


    Turn off your firewall with this command:


    ```

    /etc/init.d/iptables stop

    ```


    If your network connection instantly works, your firewall was most likely the
    culprit. In that case, you have to modify your firewall to make it work for your
    needs. Turn the firewall back as soon as you fix the problem:


    ```

    /etc/init.d/iptables stop

    ```


    A description of how to customize an Iptables firewall is beyond the scope of
    this book. However, the firewalls we show you how to construct in this book may
    work for you and also be easier to understand and modify. Refer to Chapter 8 for
    more information about Iptables-based firewalls.


    # "I want to make an emergency boot floppy disk"


    **Problem:** You skipped making an emergency boot disk when you installed Fedora
    Core and want one now.


    **Solution:** All is not lost if you read Chapter 3 and skip making a boot disk.
    Nothing is lost because it''s easy, in to make one. Log in your computer as root
    and insert a blank floppy disk or one that has information you don''t mind deleting
    (losing everything on that disk). Run this command:


    ```

    uname -r

    ```


    This command returns information about the version of Linux you''re running. The
    output looks similar to this:


    ```

    2.6.3-2.1.253.2.1

    ```'
