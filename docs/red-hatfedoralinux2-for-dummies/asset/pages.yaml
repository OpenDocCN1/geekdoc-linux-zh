  md: '# Chapter 8


    # Only You Can Prevent Break-Ins


    In This Chapter


    +   - Introducing computer security

    - Using the netfilter/iptables firewall system

    - Designing and viewing your filtering rules

    - Automatically starting your computer software

    - Automatically updating your computer software


    After connecting to the Internet, you run the very real risk that bad guys will
    try to break into or otherwise harm your computer. The bad guys wear black hats,
    just like in the movies (as opposed to red fedoras, which are a bit odd but still
    good). You may also have heard them hackers, crackers, the Joker, and whatever.
    Whatever their names and whatever their intentions, the Internet is getting more
    dangerous every day, so ya gotta protect yourself.


    No silver bullet exists when it comes to protecting yourself from computer mischief.
    You should not rely on any single method, or system, against hackers. The best
    defense is to create multiple lines of defense that overlap and provide extra
    protection.


    The first thing you should do after establishing an Internet connection is start
    a firewall. A firewall is a device that enables you to use the Internet, or network,
    while blocking the Internet from using you. Firewalls are one-way gates that allow
    your outgoing network connections while blocking incoming connections.


    This chapter describes, not surprisingly, how to build a firewall. First, in case
    you doubt that you truly need a firewall, we explain why having a firewall is
    important. We then introduce you to netfilter/iptables, a Linux firewall system,
    and describe how to set up your firewall-filtering rules. After you set'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# 100 Part II: Got Net?


    up your filters, we describe how to run the firewall automatically. We also show
    you how to do a simple test to make sure that your firewall is working correctly.


    The firewall described in this chapter is designed to protect a simple Fedora
    Core computer that''s connected to the Internet or LAN. The firewall isn''t designed
    to work on a computer working as a gateway to a private network. Chapter 15 describes
    how to modify this firewall to protect your private network.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_121_0.png)


    # Understanding Why You Need a Firewall in the First Place


    You may think that there''s safety in numbers. After all, literally millions of
    people, businesses, and organizations are connected to each other at any given
    time through the Internet. What do you do, an individual with a simple computer
    or small private network connected to the Internet, have to be concerned about?
    The bad guys are usually interested in big money or by publicity, right?


    That assumption is valid up to a point. The chances that you may never get hacked
    even if you don''t take any precautions. If you subscribe to that view, you''re
    — in technical jargon — relying on security by obscurity.


    Many hackers use tools that automatically scan and attack entire networks. The
    happy hacker doesn''t have to work hard to search large numbers of networks to
    find and exploit unprotected computers. Don''t risk needlessly getting owned,
    which is the term used when someone breaks into and controls your computer, by
    a hacker, especially when Linux provides effective tools for protecting yourself.


    Using a firewall is one simple but quite effective method for protecting your-self
    when you connect to the Internet. A firewall allows you to connect to the Internet
    while blocking unnecessary and unwanted connections from coming in.


    Firewalls provide good bang-for-the-buck protection. However, they''re not the
    only security measure you should take. For example, locking your doors certainly
    helps to protect against burglars, but isn''t 100 percent effective — they can
    still break through a window. Your best bet comes from using layers of security,
    such as locking your windows, using alarms, and keeping tabs on neighborhood activities.
    The idea is to have each layer reinforce yours Chapter 17 describes how to add
    security layers to your computer. Layered security is the best method for protecting
    your computer.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_121_1.png)'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Chapter 8: Only You Can Prevent Break-Ins 101


    # Building an Effective Firewall


    Fedora Core comes bundled with a simple but extremely effective firewall system
    named netfilter/iptables. The netfilter part refers to the firewall system that''s
    built into the Linux operating system — the kernel, and Iptables is the interface
    that controls it. We refer to the overall system as Iptables because that''s the
    part you work with.


    The Iptables systems filter IP packets, which are the backbone of the Internet;
    IP stands for Internet Protocol. When you''re connected to the Internet, all the
    information (graphics and text) that you send and receive is in the form of IP
    packets. All the information that enters and leaves your computer via the Internet
    is packaged in the form of IP packets. You can use Iptables to accept or deny
    IP packets based on their destinations, source addresses, and ports.


    # Designing filtering rules: Permissive and restrictive methods


    Firewall-filtering rules are like the bricks (or asbestos, if you prefer) to build
    your firewall. Basically, filtering rules determine what network communication
    can go out of and into your computer.


    When you''re designing firewall-filtering rules, you can choose between two philosophies:


    +   - Allow all connections by default and then deny specific access.

    - Deny all connections by default and then allow specific access.


    Allowing all connections takes the view that you should start by allowing all
    communication with your computer and then denying connections by one. (This method
    is used by the Fedora Core firewall, which you create during the installation
    process.) The danger with this method is that you unintentionally allow dangerous
    traffic to reach your machine. The alternative method is to start by denying all
    communication and selectively allowing certain traffic. This more


    restrictive method is, from a security standpoint, the best way to create a firewall
    because you know exactly what access you''re allowing. However, the restrictive
    method can also create problems because you unintentionally prevent or wanted
    network traffic from reaching your computer.


    We explain in this chapter how to use the restrictive method, for several reasons:


    +   - It''s the safest method. The restrictive method is safer because it minimizes
    all contact with your Internet-connected computer. For example, it minimizes the
    information about your firewall port scanning and other tricks to provide to hackers.


    +   - It''s easier to configure. Because iptables provides stateful filtering,
    you have to configure only two rules to create a safe firewall. However, you have
    to configure numerous individual rules when using the permissive model. Extra,
    unnecessary complexity reduces security.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_122_0.png)'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# 102 Part II: Got Net?


    The Iptables system is effective because it uses stateful filtering: The firewall
    can keep track of the state of each network connection. It''s a technical way
    of saying that Iptables knows which IP packages are valid and which are not. For
    example, if you are browsing www.dummies.com, Iptables keeps track of all packets
    that belong to that connection. The Iptables utility can deny packets that are
    trying to reach your computer but don''t belong to your connection, preventing
    any hackers from sneaking packets through your firewall.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_123_0.png)


    Fedora Core installs an Iptables-based firewall by default. The installation system
    configures a good level of protection during the installation process. You may
    recall from Chapter 3 that we advise you to use the default firewall configuration.
    However, the default firewall isn''t as secure as we would prefer for connecting
    to the Internet. Therefore, we describe in this chapter how to construct a more
    comprehensive and secure firewall.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_123_1.png)


    The concept of ports is an essential part of the Internet Protocol. Ports are
    used to organize the communication between clients and servers. For example, when
    you click a link on a Web page, your browser communicates with the Web server
    using a port. That''s a gross simplification, of course, but it describes the
    basic idea. Suffice to say that ports are used to control the internal workings
    of the Internet for such tasks as Web browsing.


    # Setting Up a Firewall


    So you know that you need a firewall and want to create one. What''s next? This
    section explains how to set up an Iptables-based firewall by using the restrictive
    model. We also describe how to manually create the filter rules. When you''re
    setting up your rules, we see the section "Saving your filtering rules to a script,"
    later in this chapter, so that you don''t have to enter these rules every time
    you turn on your computer.


    In this section, you design an Iptables-based firewall that turns off incoming
    connections on an Internet connection (modem, LAN, or broadband) and still enables
    you to establish an outgoing connection to the Internet. You then back off the
    total restriction of incoming communication to allow incoming Secure Shell connection
    (Secure Shell provides encrypted communications).


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_123_2.png)


    Don''t execute these instructions from a remote connection! You must run these
    commands from your computer''s console. That is, you must be sitting at your computer
    and not working on it over a network connection. The reason is that these firewall
    rules shut off external network connections before restoring them.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Chapter 8: Only You Can Prevent Break-Ins


    These steps describe how to build your firewall, brick by brick:


    +   1. Log in to your computer as root and open a GNOME Terminal window, by right-clicking
    any empty portion of the desktop and choosing Open Terminal from the menu.


    +   2. Type this line to turn off the default Fedora Core firewall:

    ```

    /etc/init.d/iptables

    ```


    This firewall is the one created during the installation process we describe in
    Chapter 3.Itables entries remove any existing filter or Network Address Translation
    (NAT) rules. NAT rules masquerade your network address as another address, making
    your computer appear to be used by someone else. NAT is frequently used to make
    your computer appear to be coming from your ISP so that you don''t have to register
    your computer for an official Internet Protocol (IP) address.


    +   3. Type this line to save the default Fedora Core firewall configuration:

    ```

    mv /etc/sysconfig/iptables /etc/sysconfig/iptables.bak

    ```


    +   4. Start building your firewall by filtering out network communication to,
    and through your computer by entering these rules:

    ```

    iptables --policy INPUT DROP

    iptables --policy OUTPUT DROP

    iptables --policy FORWARD DROP

    ```


    These commands set the default policy of your firewall to not allow any network
    traffic into (the INPUT rule) or out of (the OUTPUT rule) any network interface;
    nor is any traffic allowed to pass between multiple network interfaces (the FORWARD
    rule) if you have them. At this point, you have an extremely safe firewall. However,
    your computer is useless in terms of using it for any network-related tasks. The
    next step opens the firewall a little so that you can access the Internet (or
    any network you''re attached to) in a safe way.


    +   5. Enter these rules to allow network traffic to pass through the Loopback
    device:

    ```

    iptables -A OUTPUT -j ACCEPT -o lo

    iptables -A INPUT -j ACCEPT -i lo

    ```


    Linux computers use an internal network, called the loopback interface (lo). The
    loopback isn''t a physical device, but is a virtual one. Linux uses lo for internal
    communications. (A great deal goes behind the scenes on a Linux computer).'
