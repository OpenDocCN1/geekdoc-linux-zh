  md: '# Chapter 13: Going to the Office


    # # Firing up and using OpenOffice


    Fedora Core provides OpenOffice and installs it by default. OpenOffice is easy
    to access. Click the GNOME button and then choose Office->OpenOffice-Writer. You
    can choose some of, but not all, the other OpenOffice functions from this menu
    too. However, you can start the spreadsheet program, Calc, from any OpenOffice
    window. From any window (Writer or Imp, for example), choose File->New->Spreadsheet
    to open Calc. After thinking about life for a few seconds, the OpenOffice window
    appears.


    The first time you start OpenOffice, it asks whether you want to use the workstation
    or personal model. The former installs the OpenOffice programs in a central location
    accessible to all users; the latter option installs a copy of OpenOffice in your
    home directory. We use the workstation configuration in this section, but you
    can select the personal model.


    When you use OpenOffice for the first time, you''re also asked a few questions
    about importing an address book. We cancel the operation because we prefer to
    use the Ximian address book.


    You can access all OpenOffice functions by clicking the File button, in the upper-left
    corner of the window, and then the option you want.


    The following list introduces the functions, you''re probably familiar with the
    layout and operation of the menu if you have used Microsoft Office:


    +   * **File:** As you may expect, you can open, close, save, and otherwise modify
    OpenOffice documents using the File menu. Writer files have the .swx extension.
    You can also read and write other file formats, such as Microsoft and HTML, by
    using the File menu.

    * **New:** You can create a new document for any OpenOffice function. When you
    choose File->New, you''re given the option to create a new document, spreadsheet,
    presentation, or other function.

    * **Edit:** This menu provides all the functions you need to modify documents.
    Functions such as cut, copy, paste, and delete are all there. The functions that
    are active at any time depend on whether you''re editing a document, spreadsheet,
    or presentation. For example, the cut, copy, and paste options aren''t active
    if you''re not editing a document (like when you first start up OpenOffice and
    haven'' opened any files).


    You can also track changes, as you can in Microsoft Word. Choose Edit->Changes
    and you can track changes on a character-by-character basis. You can display the
    changes or keep them hidden from view. When you''re satisfied with your edits,
    you can make the changes permanent and save only the finished document to disk.
    It''s pretty cool.'
