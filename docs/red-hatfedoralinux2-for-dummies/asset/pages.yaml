  md: '# Red Fedora Linux 2 For Dummies


    But these late-night, coffee-induced conventions aren''t what we mean. Our conventions
    are shorthand ways of designating specific information or tasks.


    # Typing code


    Fedora Core provides various graphical user interfaces (GUI) to help you do most
    of the tasks you want. However, many people still find that performing many tasks
    “manually,” by typing a command, is easier; in some circumstances, the only way
    to get a job done is to enter a command manually.


    Therefore, we show you in Chapter 4 how to use a text-based terminal emulator
    to run a command. In anticipation of manually running commands, we describe several
    conventions in this section.


    When you see URLs (Uniform Resource Locators), filenames, directories, commands,
    and parameters in a paragraph, they’re formatted in `monospace` type. That helps
    differentiate those items from the general text.


    When you see words in boldface, they indicate something you should type:

    for example:


    **Type man chown** at the command prompt and press Enter.


    That line tells you to enter the command `man chown` and press the Enter (Return)
    key. The command is then executed. (Throughout this book, we say “press the Enter
    key” or “press Enter” whenever we want to execute a command; the Enter key is
    synonymous with the Return key.


    Commands set off by themselves, rather than shown in the text, look like this:


    ```

    pwd

    ```


    Here’s a rundown of the command syntax in Linux:


    +   * Text not surrounded by `[ ]` or `{}` brackets must be typed exactly as shown.

    * Text inside brackets `[ ]` is optional.

    * Text in *italics* indicates the part of a command that must be replaced with
    appropriate text. You should not type verbatim the italicized part of a command.
    If we say “Enter the command **more somefile**, we mean for you to replace `somefile`
    with the name of the file you’re interested in. For example, you may end up entering
    the command `more /etc/passwd`, where you substitute `/etc/passwd` for `somefile`.'
