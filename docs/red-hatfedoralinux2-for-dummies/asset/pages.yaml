  md: '# Chapter 15: Building Your Own, Private Network


    Suppose that you open Mozilla on the sample Fedora Core computer Cancun (with
    the IP address 192.168.1.1) and enter the URL fedora.redhat.com. Network packets
    belong to your LAN and fly out to the Internet (and back again), and Mozilla ends
    up displaying the Fedora Core Web page.


    Lots of things have to happen to make all these things happen. Here''s a simplified
    version of how it works:


    +   1. Mozilla asks Linux to look up the address, via DNS, which translates fedora.redhat.com
    into the numeric IP address 209.132.177.50.


    +   2. Linux maps the IP address to its internal routing table. The operating
    system directs network traffic to the default route if the address doesn''t match
    its local networks. (In other words, if the IP address belongs to a machine on
    the private network, Linux directs its communication to the Ethernet device connected
    to the LAN. The IP address is external to the LAN, however, Linux forwards the
    packets to the appropriate router).


    In this case, 209.132.177.50 doesn''t exist on the LAN, so all traffic for the
    browsing session is directed to the default route.


    +   3. In the private network example we describe, the default route of each host
    points to the Internet gateway Veracruz. For example, each Internetbound network
    packets that Cancun produces are sent to Veracruz.


    +   4. The Internet gateway Veracruz receives the outbound packets from Cancun
    on its internal NIC and forwards them to its external NIC. Packets going through
    its external NIC are directed to the Internet.


    +   5. Veracruz (internal NIC 192.168.1.254) also converts the source address
    of packets from Cancun (192.168.1.1) to the source address of its external NIC.
    For example, if Veracruz (connected to a DSL or cable modem) has the address 192.168.32.254,
    the source address of Cancun packets is converted to that same address (192.168.32.254);
    in words, Cancun''s source address 192.168.1.1 is changed to 192.168.32.254.


    +   6. The packets go to their intended destination. The fedora.redhat.com web
    server responds to the query and sends back the requested information.


    +   7. Veracruz receives the return packets, converts their destination address
    back to that of Cancun, and forwards them to the private network.


    +   8. Cancun receives the packets, and the browser displays the information.'
