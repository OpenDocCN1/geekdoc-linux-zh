    # "I Is an enganeer"


    An experienced electrical engineer and Linux author once got really angry with
    a cable Company. His cable service sent dev in the middle of a Philadelphia Eagles
    game. It didn''t matter that the Eagles were losing — he wanted to see the game
    because the Eagles don''t appear on TV often in Albuquerque. The engineer called
    the cable company immediately. Blah! Blah! Blah! My connection — Blah! Blah!


    support person guided the poor engineer stepby-step through his own fault trait.
    Step 1: Is your VCR or TV turned on? "Yes, of course." Step 2: Is the VCR button
    on your VCR toggled on? Of course — ah, whoops, no, it isn''t. Ah, yes, it works
    now, thank you very much. Goodbye. Doh! What was five years of electrical engineering
    good for?


    Older adapters may have jumpers or little switches, called DIP switches, to set.
    If you think that have to do this, remember to write down all the other devices''
    interrupts and I/O addresses so that you don''t end up conflicting with something.


    # Perhaps''re missing the correct module


    You also may be missing the core module. This situation is virtually impossible
    with Fedora Core because the Linux kernel automatically loads networking, and
    other modules, on demand (It''s mature technology). Go ahead and look at these
    files to get an understanding of how Linux works. Display the networking devices
    by typing this command:


    ```

    cat /proc/net/dev

    ```


    If you don''t see the Ethernet interface, you may have an unsupported network
    adapter or a defective or misconfigured one. The Fedora Core kernel, by default,
    automatically loads modules they''re needed. You can look back at the boot process
    by using the dmesg command. Look for a message that says delaying eth0 configuration.
    This message likely means that Linux wasn''t able to load the network adapter
    module or that the adapter isn''t working.


    Display the information about your devices by using the cat /proc/net/dev command.


    The next step is to ensure that your network routing is correctly configured.
    This area is one where you can easily get confused. You don''t have to set up
    routing outside your LAN yet, but Linux needs to know where to send packets on
    its own network. Look at your routing table by typing this command:


    ```

    netstat nr

    ```'
