    # Protecting your LAN with a firewall


    After you have configured your gateway for IP forwarding, you need to protect
    your network from the bad guys on the Internet. This section describes how to
    turn your gateway into a firewall. You use the same process and many of the same
    rules we describe in Chapter 8; however, this firewall is designed to protect
    your entire network, whereas the one in Chapter 8 is oriented toward protecting
    individual workstations.


    The firewall you''re building helps to protect both your computer and your network.
    The firewall provides the network address translation (NAT) function, which allows
    the computers on your private network to access the Internet. NAT, you may recall,
    converts the nonroutable source IP addresses (192.168.1.1, for example) into the
    routable source IP address of your Internet connection.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_231_0.png)


    Network address translation is also referred to as IP masquerading, or simply
    masquerading.


    The basic configuration of the firewall we describe in Chapter 8 works in the
    new configuration. The firewall performs these functions:


    +   Block all incoming, outgoing, and forwarded packets: Start by blocking all
    network traffic by default. This firewall completely protects your private network
    and also makes it useless! Start with this policy to ensure that the firewall
    blocks all connections except the ones you explicitly allow.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Chapter 15: Building Your Own, Private Network


    +   Allow all internal traffic: You must allow all network traffic on the Internet
    gateway''s internal loopback (lo) interface. The loopback interface is used by
    the Linux operating system for its own, internal communication. Many processes
    communicate over this virtual network.


    +   Allow all NIC traffic: Allowing computers on the private network to communicate
    with the gateway provides convenience. For example, you may want to administer
    the gateway via Secure Shell (SSH). Take a lenient approach and allow any internal
    machine to communicate with the gateway; this strategy makes constructing the
    firewall easier. You may decide to limit internal access if your security demands
    it.


    +   Allow all outgoing traffic from the firewall: Allow all outgoing connections
    from within the firewall. The firewall needs to perform its internal processes,
    such as making DNS queries.


    +   Forward all traffic from the private network: A gateway needs to pass traffic
    from one interface to another. You change the forwarding policy to permit communication
    from the private network to pass through the firewall to the Internet. The downside
    is that traffic from the Internet can pass through the private network — not a
    good idea. You fix that problem by adding NAT. It effectively prevents external
    access through the firewall.


    You can set specific forwarding rules to provide more protection for your private
    network. We believe that using NAT to effectively block externally originated
    connections is adequate for your needs.


    +   Use NAT for outgoing connections: Create a NAT rule to make all connections
    originating on the private network appear to be coming from the Internet gateway.
    All private network machines have their source addresses and port numbers changed
    to that of the gateway.


    The network address translation isn''t necessary if your Internet device (telephone,
    DSL, or cable modem) performs NAT. By providing a NAT filtering rule, however,
    you ensure that your Internet gateway works with any connection device — whether
    or not it performs NAT. NAT also prevents external access to your private network.


    +   Allow SSH connections: The Secure Shell (SSH) protocol encrypts network connections.
    SSH provides a reasonably secure system for connecting to your private network
    from the Internet. We configure the firewall to allow SSH connections into your
    firewall.


    The firewall on the Internet gateway is similar to the firewall we describe in
    Chapter 8, except that you add IP forwarding and NAT. This allows packets from
    the private network to pass through the firewall and on to the Internet. In this
    case, NAT makes Internet-bound traffic appear to be coming from the firewall or
    gateway and prevents incoming packets from being forwarded into your private network.'
