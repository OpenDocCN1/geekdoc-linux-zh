  md: '# Chapter 5: Dial-Up Modems Still Get the Job Done 69


    Your modem can connect to one of four serial ports or one of many USB ports available
    on your PC. A serial port is the mechanism your computer uses to communicate with
    a serial device, such as a modem; Universal Serial Bus (USB) is the modern equivalent
    of a serial port. An external serial modem is generally connected to port /dev/ttyS0,
    and sometimes to /dev/ttyS1, or even /dev/ttyS2 or /dev/ttyS3; USB modems are
    connected to /dev/ttyUSB0, /dev/ttyUSB1, and so on. If you have an internal modem,
    it can be any of the tty devices.


    # Firing Up Your Internet Connection


    Fedora Core provides a PPP dialer utility to help you establish a PPP connection.
    You establish this connection by using the PPP configuration you set up with the
    Dialup Configuration tool (which we describe earlier in this chapter, in the section
    “Configuring Your Internet Connection”).


    To connect to the Internet with the PPP dialer, follow these steps:


    +   1. Click the GNOME Menu button and choose System Tools>Network Device Control.


    The Network Device Control window appears, displaying all the network interfaces
    you have.


    +   2. Click the name of your modem (for example, Myconnection) and then click
    Activate.


    The Network Device Control utility dials and connects to your ISP.


    +   3. When you''re finished using the Internet, click the Deactivate button in
    the Network Device Control window.


    Your connection is terminated.'
