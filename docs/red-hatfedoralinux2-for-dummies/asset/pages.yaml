  md: '# Chapter 6: Broadband Rocks!


    # Finding a DSL provider


    You must obtain both DSL and ISP services to make your broadband connection. Some
    companies — notably, the regional Bell telephone companies — can provide both
    services. However, in our case, we preferred the ISP that was aligned with the
    DSL provider. We were fortunate enough to retain our existing ISP when we purchased
    our DSL service.


    # The many faces of DSL


    DSL connects in a variety of modes. Most consumers end up using ADSL which offers
    inexpensive Internet connections at reasonably high speeds. ADSL serves an individual
    computer user''s needs very well; it even provides a small business with adequate
    service. ADSL is, not surprisingly, the most available of all DSL flavors.


    The other types are suited for business use. Most locals probably have access
    to only two or three of these services. This list describes the DSL variations:


    +   * ADSL (Asymmetrical DSL): The DSL download (downstream) speed isn''t the
    same as its (upstream) speed. (That''s why it is asymmetrical). The maximum ADSL
    speed is 8 Mbps, but it''s usually limited to less of the POTS infrastructure
    limits.


    +   * G.Lite: Also known as Universal DSL, splitterless DSL, G.Lite is a low-speed
    version of ADSL that not requiring filtering out the POTS signal. It provides
    as much as 1.5 Mbps downstream and 512 Kbps upstream.


    +   * HSL (high bit-rate DSL): HSL is a symmetrical protocol with equal upstream
    and downstream speeds. You can use HSL as


    a substitute for T1 connections because it provides the same data rates of 1.544
    Mbps.


    +   * VDSL (high bit-rate DSL): VDSL2 has the same specifications as HDSL, but
    works over a single twisted-pair connection.


    +   * IDSL (ISDN Digital Subscriber Loop): IDSL, the successor to the current
    ISDN technology, uses the same line encoding (2B1Q) as ISDN and DSL is used mostly
    to provide DSL service in areas where the more popular forms, such as ADSL and
    DDSL, are not available. IDSL is capable of providing upstream and downstream
    rates of 144 Kbps.


    +   * SDL (Single-line DSL): SDL is commonly called Symmetric DSL because SDL
    is symmetric upstream and downstream speeds are the same.


    +   * VDSL (Very high bit rate DSL): VDSL provides as much as 50 Mbps over distances
    up to 1,500 meters on short loops. VDSL is particularly useful for campus environments
    and business parks. VDSL is not being introduced in market trials to deliver video
    services over existing phone lines. You can also configure VDSL in symmetric mode.


    +   * xDSL: xDSL is a generic term for all the DSL flavors.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_102_0.png)'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# 82 Part II: Got Net?


    The DSL provider market is still quite fluid. Research the DSL service providers
    in your area carefully before choosing one, and remember that longevity is as
    important as a low price. Regional Bells are more likely to provide long-term
    service than many of their competitors.


    Usually, you have to select an ISP after you choose DSL. DSL providers either
    provide their own ISP or allow you to choose from several independent ones (the
    DSL provider makes the arrangements and works directly with the third-party ISP).


