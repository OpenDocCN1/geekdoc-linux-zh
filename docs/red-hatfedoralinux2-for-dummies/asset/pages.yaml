  md: '# Part IV: Revenge of the Nerds


    # Tunneling X across a network


    That was a simple and useful way to use OpenSSH, but you can do more. The Red
    Hat OpenSSH client is automatically configured to forward X-based graphics across
    its secure connection. While logged on to your ISP, you can run X window software
    and view it on your local machine:


    +   1. Log in to your ISP (or any machine running a Secure Shell server), as just
    described.


    +   2. Run an X Window application, such as xclock.


    The simple xclock window is displayed on your desktop.

    OpenSSH also bundles the file-transfer applications Secure Copy (scp) and Secure
    FTP (sftp). Secure Copy is non-interactive and copies files to and from a remote
    machine. Secure FTP is a secure version of FTP and is also interactive. This list
    describes how to copy the file abc from the /tmp directory on the local machine
    to the /var/tmp directory on the remote machine and renames it to xyz:


    +   * Copy from a local machine to a remote: To transfer files from your local
    computer to a remote one, use Secure Copy (scp):


    ```

    scp myaccount@remote.mysisp.com

    ```


    This command copies the filename abc from the directory you''re working to the
    myacct.mysisp.com home directory on the remote machine. You can specify either
    or both of the local and remote directories. For example, this command copies
    the file abc from the /tmp directory on the local machine to the /var/tmp directory
    on the remote machine and renames it to xyz:


    ```

    scp myaccount@remote.mysisp.com:/tmp/abc /var/tmp/xyz

    ```


    The syntax is important. If you leave out the colon (:), your file isn''t copied
    to the remote machine but rather simply copied to a file named myacct@remote.mysisp.com
    in your local directory.


    +   * Copy from a remote to local machine: Reverse the order of the parameters
    to copy a file from a remote machine. The following example copies the file abc
    from your home directory to your current working directory on the local machine:


    ```

    scp myacct@remote:abc

    ```


    The sftp program works like the old standby FTP, but uses encryption, course.
    Follow these steps to perform simple file transfers with sftp:


    +   1. Open a GNOME Terminal session.


    +   2. Enter this command:


    ```

    sftp ssh@mysisp.com

    ```'
