  md: '# Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    # Maximizing windows


    To make a window fill the entire screen, click the Maximize button, in the upper-right
    corner of the window. Check out the buttons to the right of the title bar in a
    typical window. The Maximize button is the one in the middle; it looks like a
    square and is similar in action to the Cascade button in Windows.


    # The Making of a Desktop Icon


    You can create an icon on your desktop for any application on the GNOME menu.
    Just click the GNOME Menu button, find the menu item for the application you want
    an icon for, and then click the application''s icon and continue to hold the mouse
    button, drag the cursor to any open area on the GNOME desktop (or the GNOME Panel).
    Release the mouse button and an icon for that application is placed on the desktop.
    You can then start the application by double-clicking the icon on the desktop
    (or just clicking an icon that lives on the GNOME Panel).


    With GNOME, you can enhance icons with emblems. *Emblems* provide additional information
    about what an icon is supposed to do. You can assign an emblem by right-clicking
    an icon and choosing Properties. The Properties window opens. If you select the
    Emblem tab and select one of the emblems. For example, if you select the Cool
    emblem, a pair of Wayfarer sunglasses is displayed with the icon on the desktop—cool.


    Another GNOME icon feature is the ability to stretch an icon''s boundaries. Right-click
    an icon and choose Stretch. A dashed line and four squares buttons bracket the
    icon. Any of the buttons and you can stretch the icon image as much as you want.


    # Playing with the GNOME Panel


    The *GNOME Panel* is the menu bar along the bottom of the desktop. The GNOME Panel,
    similar to the taskbar in Windows, provides a location to place common menus and
    applets for easy opening or viewing. The GNOME Panel gives you a view of the virtual
    desktop and enables you to keep track of minimized windows.


    By default, Fedora Core places icons on the GNOME Panel for accessing the GNOME
    menu, Mozilla, Evolution, OpenOffice (Writer, Impress, and Calc), a printer, the
    time, and the update applet, and the GNOME Workspace Switcher.'
