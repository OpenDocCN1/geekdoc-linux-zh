    # Introducing SELinux


    SELinux (security-enhanced Linux), designed by the National Security Agency (NSA),
    is a new mandatory access control (MAC) security system that is integrated into
    the Fedora Core 2 Linux kernel. By Linux uses a discretionary access control (DAC)
    model to determine whether users and processes can read, write, and execute files
    (for more information, see the section in Appendix C about file ownership and
    granting permissions) and access network sockets. The DAC model has a number of
    holes that can compromise security. SELinux complements the traditional DAC model
    and closes those holes.


    servers provide multiple services. These types of computers tend to be more vulnerable
    to compromise and lend themselves to the MAC security model. SELinux can certainly
    be used on personal workstations and single service computers. One good analogy
    (the official SELinux FAQ at www.crypt.gen/selinux/faq#www.1) describes SELinux
    as an "internal firewall" that prevents processes from interacting with each other.


    Fedora Core 2 installs and activates SELinux by default. Because SELinux operates
    in permissive mode, however, access details are logged but not enforced—you''re
    still allowed access to a file or process even if you don''t have the correct
    SELinux permission. The message is recorded in /var/log/messages and /var/log/dmesg.
    You can set SELinux to enforce access controls by editing the /etc/sysconfig/selinux
    file and changing the parameter to SELINUX=enforcing.


    On Traditional Linux, users access to their files and processes. The super (root)
    has total access to all files, processes, and network resources (objects). SELinux
    uses a set of rules, however, to determine which users and processes can access
    which objects.


    Traditional Linux is vulnerable to one exploited object compromising other objects
    and eventually infecting an entire system. SELinux helps solve problem by creating
    a system for separating and protecting your system and files from each other.
    If one process is compromised—by a buffer overflow, for example, SELinux prevents
    it from being used to compromise objects. SELlinux works after traditional access
    is granted. For example, you cannot access a file even if SELinux grants you permission
    if the normal read-write-execute access isnt granted.


    You can find out more by visiting these pages:


    +   - www.nsa.gov/selinux/

    - www.crypt.gen/selinux/faq.html#1


    +   - http://forge.net/docman/display_doc.php?docid=21959&group_id=21266&aboutpo12.1


    +   - www.samag.com/documents/s-7835/sam0303a/0303a.htm


    +   - www.crypt.gen/selinux/faq.html#1


    SELinux, for enforcing mode, is best suited for computers shared by multiple users
    or'
