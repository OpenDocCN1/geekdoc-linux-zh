  md: '# Chapter 7: Connect Locally, Communicate Globally: Connecting to a LAN


    # Wireless network warning


    Wi-Fi, the standard for wireless technology uses an encryption system named wireless
    equivalent privacy (WEP) for security. WEP encrypts communication between wireless
    devices to prevent someone with the right equipment from listening to using your
    wireless network. WEP is flawed and can be broken using tools available on the
    Internet (a big surprise). If a hacker gets into your Wi-Fi network, they can
    read your communications. But your problems don''t end there. Hackers can use
    your wireless network to connect to both your private network and the Internet;
    you give the bad guys a free lunch and a launch pad to the Internet.


    for the risk. The logic? If you assume that your wireless network has already
    been hacked, you don''t have to worry about when it might be hacked in the future.

    You should useSSH, Secure Socket Layer (SSL), and private networks (VPN)—all bundled
    with Fedora Core—to conduct all internal and external communication. Keep in mind
    that using SSH, SSL, and VPN protects your information, but doesn''t prevent someone
    from connecting to your network. The next generation of Wi-Fi, 802.11g, is supposed
    to fix the WEP weakness. Until the WEP problems are solved, be aware of the risks.


    On the other hand, wireless networking is so useful that many people make accommodations


    > Ad-hoc networks can also provide a bit more security because they connect to
    other networks — and the Internet — through a network router. Access points work
    as network bridges. Routers examine IP addresses and then decide where to direct
    network traffic from one network to another. Bridges automatically pass on all
    traffic. Ad-hoc networks can be configured to manage tightly—but not completely—control
    network traffic than access-point-based networks. You can configure ad-hoc networks
    with a firewall more easily than a network using an access point. (Many of the
    current crop of access points provide NAT and firewall support, however; using
    NAT effectively creates a firewall.)


    # Configuring your Ethernet or wireless NIC


    To get your Fedora Core computer working on a LAN, you must first configure your
    network interface card, or NIC. The NIC is the device that electronically connects
    your computer to your LAN. To work with the other computers on your network, your
    Ethernet or wireless adapter must be given a network address and a few other pieces
    of information.'
