  md: '# Overview: Preparing Your Hard Drive for Fedora Core


    Before you install Fedora Core alongside Windows, you need to get your hard drive
    ready. This list of steps provides an overview of the disk preparation process:


    +   1. Put on a red fedora.

    2. Back up your Windows computer.

    The processes we describe in this chapter should not affect your existing Windows
    installation. However, you can never be too safe in dealing with your precious
    files, so you should back them up. A description of how to back up a Windows computer
    is beyond the scope of this book. Numerous commercial and freeway (not to be confused
    with open source) backup systems are available.

    3. Determine how your Windows computer''s hard drive is formatted.

    Microsoft Windows uses two types of disk formats: FAT (File Access Table) and
    NTFS (NT File System). FAT is older and less advanced than NTFS. However, open
    source utilities are available for resizing FAT-based disks to make room for Linux.
    You have to purchase commercial software to repartition NTFS systems.

    4. Defragment your disk.

    All resizing programs require you to defr your disk before proceeding. Over time,
    the bits and bytes that comprise your files tend to get scattered around your
    hard drive. Resizing may not work or even cause problems if your computer has
    too much fragmentation.

    5. Repartition your computer''s hard drive to make room for Fedora Core If you
    want to install it alongside Windows (or another operating system).

    You can use destructive or nondestructive resizing to make room for Linux. *Destructive*
    resizing wipes everything, including Windows and your data files, so your hard
    drive and starts fresh. *Nondestructive* resizing uses Windows utilities to dynamically
    shrink the existing partition and then uses the free space to make a new Linux
    partition.


    The open source FIPS (First nondestructive Interactive Partition Splitting) program
    is supplied with the full Fedora Core distribution to repartition FAT disks. You
    will need to use a commercial utility, such as PartitionMagic or Norton Ghost
    2003, to repartition NTFS disks; both these programs also work on FAT systems.'
