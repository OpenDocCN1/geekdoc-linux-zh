    ![](img/85ec3de0d5219d6ca14d5778e16a3338_368_0.png)


    Until the arrival of the RPM (and the Debian package manager on Debian systems),
    Linux software was distributed only by tar archives, which are sometimes referred
    to as tarballs, or more descriptively, hairballs. The tar file mechanism stores
    one or more files in a single file in a tar format. A tar file has the .tar suffix;
    if the tar file is compressed, it has a suffix like .tgz or .tar.gz. Using the
    tar-based distribution system is sufficient if your software doesn''t often change
    or you''re young. But when you need to upgrade or change software or work with
    complex software systems, tar becomes quite difficult to work with. Rather than
    spend your life spitting up hairballs, use systems as RPM to greatly simplify
    your life.


    # Removing an RPM package


    You can remove Red Hat packages as easily as you install them. Use the RPM erase
    (- ) function, which is the opposite of the install (- ) function. The package
    manager removes a package when you select an installed package. These steps describe
    how to remove a package:


    +   1. Click the GNOME Menu button and choose System Settings:: Add/Remove Packages.


    +   2. Enter the root password in the Information window, if you''re prompted.


    The Package Management window opens.


    +   3. Click the Remove Software button to open the Remove Package groups.'
