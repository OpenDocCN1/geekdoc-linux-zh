  md: '# 150 Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    # Burning DVDs


    The new growisofs utility makes it possible to create DVDs. Because growisofs
    is still young, its graphical interface is relatively immature. We show you how
    to use growisofs via a CLI. Follow these steps to copy files to a DVD:


    4. Suppose that you want to burn tracks you ripped using Sound Juicer in the Extraction
    CD Music with Sound Juicer section. Run this command:


    ```

    growisofs -Z /dev/hdc -R -J ~/music/ *.ogg

    ```


    +   1. Insert a DVD into your burner.


    You can use either the "plus" (DVD+RW) or "minus" (DVD-RAM) format burner.


    growisofs writes the files to your DVD. Note that /dev/hdc corresponds to the
    information obtained in Step 3.


    +   2. Open a GNOME Terminal emulator by clicking the GNOME Menu and choosing
    System Tools->Terminal.


    +   5. You may append files:


    ```

    growisofs -M /dev/hdc -R -J ~/music/*.ogg

    ```


    +   3. Run the following command to determine which Linux device file corresponds
    to your DVD:


    +   6. You are not limited to burning only files. You can also write the common
    ISO-9660-formatted images to a DVD. Run this command to create a DVD using an
    ISO image:


    ```

    grep -i dvd /var/log/dmesg

    ```


    ```

    growisofs -dvd-compat -Z /dev/hdc--image.iso

    ```


    You should see output similar to the following, where hdc is the device file you''re
    seeking:


    ```

    hdc: Hewlett-Packard DVD Writer 200, ATAPI CD/DVD-ROM drive

    ```


    The easy-to-use growisofs utility allows you to create DVDs, which now store more
    than 4.5 gigabytes of data—much more than CD-ROMs can handle. Future DVD formats
    will store more than 40 gigabytes of data.


    A one-time recordable CD is referred to as a CD-R; rewritable CD is a CD-RW. CD
    burners look like regular read-only drives and are connected with either an IDE
    or SCSI interface.


