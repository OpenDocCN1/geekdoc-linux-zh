    # Installation Stage 2: Slicing and Dicing the Pie


    You must decide where on your hard disk to install Fedora Core, a process called
    disk partitioning. Disk partitioning divides a disk into multiple sections, or
    slices. Fedora Core is then installed on the partitions. You typically use three
    to seven partitions.


    Fedora Core provides automatic and manual methods for creating disk partitions.
    We use the Fedora Core automatic method because it''s easy to use. The automatic
    method erases any existing Fedora Core partitions, and leaves alone any existing
    Windows partitions. If you don''t have any existing Fedora Core partitions or
    unused space on your disk, you have to make some free space. Refer to Chapter
    2 for instructions on shrinking Windows partitions to make space for Linux.


    Linux partitions are analogous to Windows partitions. The well-known drive C uses
    a single disk partition. The Linux equivalent is the root (/) partition. The two
    operating systems use different terminology, and the analogy isn''t perfect, although
    the concept is the same.


    Follow these steps to continue the installation:


    +   1. In the Installation Type window, select the Workstation option and click
    the Next button.


    The Disk Partitioning Setup window appears. The Fedora Core installation-system
    must partition your hard drive into one or more parts. The divisions are used
    to organize the software and data (the operating system, user files, etc.) that
    comprise the operating system.'
