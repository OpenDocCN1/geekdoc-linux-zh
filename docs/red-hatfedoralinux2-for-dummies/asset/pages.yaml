    cd icecast-2*


    +   5. Run this command to set up the compilation process:

    ./configure


    +   6. Compile and link the software by running the make command:

    make


    +   7. Install the libraries:

    make install


    The Icecast2 software is installed in the /usr/local/bin and /usr/local/etc directories.


    +   8. Change to the Ices2 directory:

    cd ../ices-2*


    +   9. Create the Icecast2 server by repeating Steps 5 through 7. These commands
    summarize the steps:

    ./configure

    make

    make install


    Your Ices2 and Icecast2 servers are now ready for prime time. The following section
    describes how to configure both servers. After they''re configured, you can serve
