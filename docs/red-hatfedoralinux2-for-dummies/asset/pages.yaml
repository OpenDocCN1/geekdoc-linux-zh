  md: '# 230 Part IV: Revenge of the Nerds


    # # Building a Print Server


    Fedora Core easily works with many, if not most, makes and models of print-ers.
    All you have to do is connect your computer to the printer and run the printer
    configuration utility and you''re done.


    Most consumer-level printers must be physically connected to a computer to work;
    physical connections use either USB (Universal Serial Bus) or parallel-port cables.
    Many business-type printers, however, use either physical or network connections.
    Although Fedora Core computers can connect to either type, we focus on those that
    use physical connections.


    You can, of course, use your Fedora Core computer as a print server for your network.


    The following section describes how to physically connect your Fedora Core computer
    to a printer. The subsequent sections show how to configure a network print server
    for both Linux and Windows computers.


    # # Connecting your computer to a printer


    You have two types of printers to choose between when you''re creating a print
    server:


    +   - Networked printers: Printers that can be connected directly to a LAN are
    networked printers. They have their own Ethernet (and, in the future, wireless)
    NICs. Networked printers are divided between those that can act as their own print
    servers (also called print spoolers) and the ones that need to be connected to
    print servers.


    +   - Non-networked, physically connected printers: Traditional printers have
    to be connected to a computer through a printer (parallel) or Universal Serial
    Bus (USB) port.


    Non-networked, physically connected printers outnumber networked printers because
    they cost less. Traditional printers are less flexible than networked printers
    because they must be connected to a computer; networked printers can be located
    anywhere that a network connection exists.


    This section describes how to use non-networked computers because they''re so
    common. The process is simple: You connect your printer to the Linux print server
    via the USB or parallel port. After you''re connected, the Linux computer can
    be configured to send print jobs to the printer.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Chapter 16: Creating Basic Linux Network Services


    Using a parallel port requires no configuration of the Linux operating system.

    The USB connection, however, requires that Linux load a USB kernel module (essentially
    a driver, in Windows terminology). Loading the kernel module be automatic.


    # Configuring a local printer


    After you connect a printer, you have to configure Linux to act as a print server.
    Fedora Core provides an excellent print configuration utility. (Fedora Core refers
    to its configuration systems *utilities*) Building a Linux print server requires
    you to configure the printer as a local device. However, every print server client
    (the computers on the LAN that send their print jobs to the print server) configure
    their print queues use the Windows Printer type. The print server sees the printer
    directly through its USB or parallel port, but the print clients see the printer
    as a Samba (Windows) share on the server.


    Fedora Core can handle five printer types. The printer configuration druid allows
    you to configure each type. This list describes the printer types:


    +   - Locally connected: Use this type if your printer is physically connected
    to your computer through a USB or parallel port. We use this type of configuration
    in the steps in this section to show you how to connect a printer to the Fedora
    Core print server.

    - networked Cups (IPP): The Common CUPS Unix Printing System (CUPS) is the de
    facto Linux and Unix printing standard. CUPS uses the Internet Printing Protocol
    (IPP) and is easy to use. Windows computers cannot print through CUPS, We use
    CUPS for the Linux-to-Windows networked server that we describe in the following
    section.

    - Unix (LPD): The Line Printing Daemon (LPD) is the older printing protocol used
    by Linux and Unix. You can use this system if you''re creating a print server
    that only other Linux and Unix computers use. Windows computers cannot print through
    LPD.

    - networked Windows (SMB): Use this printer type if you''re printing to a Windows
    print server. Samba makes the print server look like a Windows print server, and
    the clients on the private network use this setting.

    - networked Novell: Use this printer type if you''re printing to a Novell server.

    - networked JetDirect: Use this type if you''re printing to a Hewlett-Packard
    (HP) JetDirect interface is built into many HP and other printers. You can also
    purchase JetDirect print server devices that connect to non-networked, traditional
    printers. JetDirect print servers convert traditional printers into networked
    printers.'
