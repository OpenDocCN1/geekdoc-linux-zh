  md: '# 178 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    The backslash (\) is an escape character in the Linux world; in the Windows world,
    a backslash separates directory names. That is, backslashes prevent Linux (the
    bash shell) from interpreting the following character literally. Without the backslash,
    Linux (bash) interprets the directory name Program Files as two separate entities,
    Program and Files, because the bash shell ensures the space character is a separator
    and not part of a directory name filename. Therefore, the combination of a backslash
    and a space, Program Files, allows Linux to process the directory name correctly:
    Program Files. By using backslashes, you don''t have to quote the preceding command
    (refer to Step 8). You could rewrite that command as wine C:\Program\Files\Microsoft\Office\Office\winword.exe.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_199_0.png)


    # Introducing CodeWeavers

    CrossOver Office


    The outstanding Wine system lets you tap the deep resources of the Windows world.
    Wine is developed under the open source system, where volunteers provide countless
    hours of service to the computing world. The community, however, doesn''t limit
    the use of its software to noncommercial use. Software developed under the General
    Public License (GPL) permits commercial use as long as no restrictions are placed
    on the original GPL software.


    The commercial use of open source software can provide an extra punch in certain
    circumstances. Open source for profit? Companies such as CodeWeavers (www.codeweavers.com)
    and TransGaming (www.transgaming.com) deliver just such a punch. Both have added
    features to the basic Wine software to make the installation process simpler.
    CodeWeavers concentrates on making Wine easier to use on the general desktop;
    the company makes installing and using Microsoft Office, Internet Explorer, and
    varying plug-ins easy. The TransGaming product WineX, on the other hand, provides
    a gaming-oriented system.


    This book is oriented toward Linux as a useful day-to-day workstation. Our work
    is tilted toward using word processors and similar programs. We leave it to you
    to experiment with WineX. Suffice it to say that our game-oriented colleagues
    find WineX useful.


    CodeWeavers produces two products: CrossOver Office and CrossOver Plugin. Office
    provides value as an installation utility that helps with installing Windows applications.
    The Plugin product provides internally developed software that'
