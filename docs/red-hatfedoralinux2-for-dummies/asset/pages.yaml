  md: '# Chapter 14


    # Days of Wine and Applications


    +   In This Chapter

    - Introducing and using Wine

    - Using CodeWeavers CrossOver Office

    - Using VMW to run virtual Windows and Linux computers


    As you know if you have been reading other chapters of this book, Linux provides
    for many, if not of your desktop needs. The applications described in the preceding
    chapters satisfy most of your daily work requirements. All the essential applications,
    such as OpenOffice and Evolution, are at your disposal.


    Sometimes, however, you need to perform some function that isn''t provided for
    the Linux world. For example, most games are written for the Microsoft world and
    aren''t available for Linux. At times, such as when you''re editing documents
    with complex macros, you must use Microsoft Word. That''s when Wine and VMware
    come to the rescue.


    Still, there''s always room for improvement, and the open source world works hard
    to provide new and useful applications.


    # Introducing Wine


    Wine doesn''t come from the Sonoma Valley or even from the south of France. You
    cannot get tipsy or spend much money on it. Wine isn''t a beverage, but rather
    a software system that allows you to run Windows applications on a Linux computer.
    Wine helps to fill the Linux application gap.


    Modern Windows applications are, at their core, written to run on Intel, Intel-compatible
    (AMD, for example), Pentium processors. (Some Windows applications are run on
    Apple Macs; for purposes of this discussion, however, we''re talking about only
    Intel-based PCs.) However, you cannot just load a program like Microsoft Word
    on your Linux computer and expect it to work.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# 170 Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    The Microsoft Windows operating system provides a platform for running Microsoft
    applications, such as Word. That platform is a little like an electrical plug
    that provides the power to run various appliances; the appliances are analogous
    to applications. The Windows plug provides a library of commonly used low-level
    functions that are referred to as an Application Interface (API). Those functions
    perform tasks common to every application, such as opening a file or talking over
    a network. Using a common library prevents every single application from reinventing
    the wheel. Instead, the applications just plug into the "outlet" and concentrate
    on performing their particular function.


    The problem is that the Windows platform, or "plug," has square holes and Linux
    has round ones. You cannot plug Wine directly into the Linux operating system,
    for example. That''s where Wine comes in and provides the adapter so you can plug
    the wine peg into the square hole.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_191_0.png)


    Wine stands for Wine Is Not an Emulator. This typical acronym is the type that
    Linux and Windows programmers love. The Wine acronym means not that some people
    just need to get out more, but also that it doesn''t simulate (emulate) the entire
    Windows environment. Rather, it duplicates the interface between the application
    and the operating system. Using the electrical-plug analogy, Wine doesn''t emulate
    the entire electrical grid (as in Windows) but, rather, simply provides the adapter.


    # # Downloading Wine


    Unfortunately, because Fedora Core doesn''t include Wine in its distribution,
    you have to download it from the internet. These steps describe how:


    +   1. Log in to your Fedora Core computer as any user.


    You can log in as the superuser (root) if you want, but that''s not necessary.
    By not logging in as the superuser, you don''t run the risk of unintentionally
    damaging your computer (for example, deleting all your files).

    2. Open your Mozilla browser by clicking the blue globe on the GNOME Menu.

    3. Enter the address winehq.com/site/download in the text box at the top of the
    browser and press Enter.


    Using Mozilla is described in Chapter 11.


    Your browser displays the Wine Binary Downloads page. This page contains links
    to various noncommercial and commercial repositories.(We describe the commercial
    Wine versions in the section "Introducing CodeWeavers Cross Office," later in
    this chapter.) This section describes how to obtain and use the noncommercial
    version of Wine.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_191_1.png)'
