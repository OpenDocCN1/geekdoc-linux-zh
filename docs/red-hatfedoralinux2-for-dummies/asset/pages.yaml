  md: '# Chapter 15


    # Building Your Own, Private Network


    In This Chapter


    +   - Designing your private network

    - Building an Internet gateway

    - Building a firewall to protect your private network


    A private network is two or more computers that are interconnected so that they
    can communicate with each other; you can also refer to a private network as a
    *local-area network (LAN)*. The computers are generally in close proximity within
    a room or building. Unlike the Internet, which is designed to allow the world''s
    computers to communicate with each other, LANs are designed to keep communication
    local and private. (You can always connect your LAN to the Internet, of course,
    but we talk about that topic elsewhere in this book.)


    Building a private network isn''t as difficult as it may sound. First, you have
    to decide on a general network layout. Second, you have to physically connect
    the computers with cables and wireless devices. Third, and last, you have to configure
    each computer''s network settings. Design, connect, configure — one, two, three
    — it''s as simple as that.


    This chapter shows how to build a simple LAN. If you want to know how to add a
    Linux computer to an existing network, check out Chapter 7. To find out about
    adding a firewall to your LAN, check out Chapter 8.


    In this chapter, we show you how to wire computers together. You should refer
    to the Linux network-configuration instructions in Chapter 7 to connect individual
    computers on your network. The steps in Chapter 7 are also designed to work with
    any LAN, including the one you''re building here.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_218_0.png)'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# 198 Part IV: Revenge of the Nerds


    In this chapter, we describe how to connect computers to form a LAN. However,
    you can connect many other devices to a network. Devices such as broadband (cable
    and DSL) Internet devices: routers; switches and hubs; network-capable printers;
    and even some personal digital assistants (PDAs) all can be connected to a network
    — wireless or wired. In the future, we fully expect to be able to connect nearly
    every electronic device to a LAN. We discuss only computers here because we''re
    focusing on your Fedora Core computer connected. However, remember that you''re
    not limited to just networking computers.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_219_0.png)


    # Designing and Building Your Private Network


    This chapter shows how to design a simple, flat network. Flat refers to the fact
    that all the computers connected to the network communicate over a single subnet
    (or subset). Subnets can be combined within a single LAN, but that makes the network
    more complex to design, build, and maintain.


    The network we describe in this section is also designed to use a Fedora Core
    Internet gateway. An Internet gateway is a computer that acts as a portal, connecting
    the private network to the internet. The networked computers in the private network,
    also referred to as hosts or clients, are connected via either of these two methods:


    +   Wired connections: Hosts are connected to the LAN through a device called
    an Ethernet hub or Ethernet switch (or just hub or switch). Switches are superior
    to hubs in performance and security and have become the standard. For your LAN,
    we suggest that you connect all computers (hosts), using the Internet gateway,
    by using an Ethernet switch. Figure 15-1 shows an example of our private network,
    where the interconnecting fabric is the Ethernet switch. In recent years, Ethernet
    switches have become so inexpensive that Ethernet hubs have all but disappeared.)'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Chapter 15: Building Your Own, Private Network


    **Wireless connections:** Wireless devices make it possible to build a network
    without interconnecting cables. Wireless networks can take two forms:


    +   - **An access point:** Using a device called an *access point*, you can connect
    wireless hosts to a LAN. This design has the hosts connect to the access point
    via radio frequency (RF) signals. The access point also connects to a wired network,
    and the wireless hosts communicate with the wired network through connection.

    - The RF signals used by wireless networks are the same ones you tune in to on
    your radio or communicate with your cell phone or to open your garage door. The
    only differences between the RF signals are its frequency and strength. The Federal
    Communications Commission (FCC) permits anybody to use the 5 gigahertz (GHz) —
    billions of cycles per second — frequency portion of the spectrum for any purpose
    as long as the signal strength is low.

    - Access points have the most popular system for creating wireless LANs. You can
    find access point devices in consumer stores for much less than $100.

    - **Ad hoc mode:** The alternative wireless-connection method, *ad hoc mode*,
    doesn''t require a separate access point, other than a wireless device for each
    host. Wireless hosts communicate directly with each other by using ad hoc mode.
