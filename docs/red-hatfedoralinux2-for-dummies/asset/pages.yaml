  md: '# Chapter 1: And in the Opposite Corner... a Penguin?


    By the way, if you''re wondering about the whole penguin thing, the answer is
    disappointingly simple: Linux loves penguins. The Linux world naturally started
    it as its symbol. The friendly and familiar penguin (whose name is Tux, by the
    way) now symbolizes All Things Linux.


    The Free Software Foundation (FSF), the brainchild of the great Richard Stallman,
    contributes much to the utilitarian software that makes Linux much easier. Most
    of its bread-and-butter utilities and commands, such as ls and cat, come from
    the FSF. Stallman is considered by many to be the originator of the open source
    movement.


    # Knowing What You Can Do with Fedora Core


    Fedora Core combines all those pieces, plus some additional applications, and
    then goes another step to add a few of its own to create an integrated product.
    The Fedora Project projects the basic Linux operating system with software (some
    made by other companies and some made by Red Hat) to produce a package with a
    value that''s greater than the sum of its parts. That combination is known as
    a *distribution*, or *flavor*, of Linux.


    So that you can get up and running as quickly as possible, we have bundled the
    Fedora Core 2 distribution on the DVD in the back of this book.


    If your computer cannot use DVDs, you can get the full Fedora Core 2 distribution
    on CD-ROMs by sending the coupon in the back of this book.


    Fedora Core (and in its previous life, Red Hat Linux) was initially used almost
    solely to provide network services. However, the company Red Hat, Inc., and many
    open source developers, such as the GN Project, started working hard to make Linux
    suitable for everyday use. The result is that Fedora Core is now used in both
    server and desktop environments. It''s used by individuals, businesses, and governments
    to cut costs, improve performance, and just plain get done.


    You can use Fedora Core as a desktop workstation, a network server, an Internet
    gateway, a firewall, the basis of an embedded system (such as a smart VCR or a
    robot), even a multiprocessor supercomputer. And, thanks to the many, many people
    who continually make refinements and innovations, Fedora Core continues to become
    more flexible and capable with each release.'
  merge: -1
