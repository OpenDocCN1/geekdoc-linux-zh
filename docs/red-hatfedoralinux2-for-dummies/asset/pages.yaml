  md: '# 260 Part IV: Revenge of the Nerds


    # Modifying your firewall to allow SSL


    You have to modify your Internet gateway or firewall to allow secure connections
    from external Web browsers to connect to Port 443 on your Apache server. The following
    rule allows SSL connections:


    ```

    iptables -A INPUT -p tcp -m state NEW,ESTABLISHED -dport 443

    ```


    If you''re using a DSL modem like the one we describe in Chapter 6, you must modify
    your modem''s network address translation (NAT) configuration. Many DSL modems
    are now on the market; describing how to configure them individually is beyond
    the scope of this book. Consult your manual for configuration instructions. You
    have to allow external connections to Port 443.


    # Reading your logs


    You are ultimately your best intrusion-detection system (IDS). Log files store
    information about nearly every one of your Fedora Core systems. Reading your logs
    lets you discover what has been happening on your computer and is one way to detect
    intrusions.


    Unfortunately, exploring log files is somewhat akin to reading tea leaves. No
    mechanical method exists for sifting through log-file tea leaves. You have to
    look for unusual and suspicious occurrences. As you read more, you realize what
    is usual and, of course, unusual. Experience counts for a great deal when you''re
    an IDS.


    Red Hat provides two systems for viewing log files. The e-mail based Logwatch
    log-alert system sifts through the log files in var/ and e-mails the root user
    under any alerts or errors. You can configure the Logwatch operational parameters
    to better fit your operation. However, the default works well at alerting you
    to the happenings on your computer. The Red Hat Logviewer graphical utility provides
    one-stop shopping for all standard log files. This manual tool helps you to remember
    which log files to look at.


    # Using Logwatch


    Logwatch, installed by default during the Red Hat installation process, is a Perl
    script that runs nightly by cron. It reads through every log file in the /var/log
    directory and picks out items that it finds interesting.


    The Logwatch Perl script is in /etc/log.d/scripts/logwatch.pl. The soft link,
    00-logwatch, in the /etc/cron.daily directory, directs the cron system to run
    the script nightly.'
