  md: '# Chapter 17


    # Securing Your Future


    # In This Chapter


    +   * Thinking security

    * Preventing intruders

    * Updating Fedora Core packages

    * Deactivating services with chconfig

    * Using the Secure Shell client

    * Configuring a Secure Shell server

    * Securing a Web server with SSL

    * Reading logs

    * Understanding the security process


    Protecting your individual computers and collective network is an essential task
    in today''s insecure world. Unfortunately, computer and network security is a
    big, complex job. This chapter boils that job down to a few essential functions.
    We describe several straightforward utilities and methods that make your security
    job manageable and help you make your computers and network safer.


    This chapter describes security methods and systems. We have chosen several security
    tools and systems that should give you the most bang for your buck. This chapter
    provides a starting point for making your computers and network safer. We encourage
    you to continue learning and evolving your security system.


    # Thinking Security


    Computer security is best thought of as an ongoing process. No single method,
    tool, or system (a silver bullet) can magically protect you from the wild-west
    Internet. Security, like exercise and diet, is just plain hard work.'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# 240 Part IV: Revenge of the Nerds


    Because no silver bullet exists, you have to use the method of defense in depth,
    which uses layers of security measures. Each layer helps to protect the other
    layers and vice versa. When one layer fails, you fall back on the other. You can
    also add and remove layers as necessary.


    Layered security systems and measures fall into three categories:


    +   * Prevention: You can use security-oriented tools, utilities, and methods
    effectively to prevent any attacks from succeeding. Tools such as passwords and
    the firewalls we describe in Chapter 8 are under this heading.


    +   * Detection: Because not all attacks can be prevented, detecting them, if
    possible, is essential. Intrusion detection is still more of an art than a science.


    +   * Eradication: If you''re ever successfully hacked, you must be able to eradicate
    the compromise. Be ready to reinstall your Fedora operating operating if you cannot
    identify and remove whatever software the hacker puts on your computer.


    +   * Process: Most computer users would prefer to construct a security system
    and then sit back and forget about it. However, the hacker world changes as fast
    as the rest of the world, and the systems that work now won''t necessarily work
    tomorrow. Therefore, you must keep learning and use that knowledge to improve
    your security.


    # # An Ounce of Protection: Preventing Intruders


    We start by describing how to minimize your chances of being hacked. The following
    sections describe systems that increase your security:


    +   * Updating software: The Fedora Core up2date and Yum utilities help your computer''s
    software up-to-date, which eliminates vulnerabilities as they are discovered.


    +   * Removing services: Hackers cannot take advantage of vulnerable software
    if you don not use it. Turning off unnecessary services reduces your exposure.
    You may also want to remove software, such as compilers, on your servers. Removing
    the software prevents a hacker from using it.


    +   * OpenSSH and SSL: Except when you''re viewing garden-variety, non-Web pages,
    you should never communicate over the Internet (or . wireless LANs) without using
    encryption. The open source SecureShell (SSH) and Secure Sockets Layer (SSL) provide
    effective encryption for your communications.


    We describe each system in this section.'
  merge: -1
  pgno: 261
- img_proc: true
  md: "# Chapter 17: Securing Your Future 241\n\n# Updating software to remove vulnerabilities\n\
    \nStandard hacker operating procedure is simple: Find and then exploit vulnerabilities.\
    \ The method, simple but effective, works like this: Joe Hacker walks around the\
    \ Internet, ratling doorknobs and occasionally finding one's open. When no door\
    \ is unlocked, the hacker looks for easier doors to pick. Your job is to make\
    \ sure that your doors and windows are locked and reasonably safe.\n\nRunning\
    \ firewalls, shutting down unnecessary services, and using good passes ensures\
    \ that you don't leave anything unlocked. Making sure that your locks aren't easily\
    \ defeated requires constant supervision and maintenance. Software is getting\
    \ ever more powerful, but also complex. Complexity breeds bugs, and bugs come\
    \ vulnerabilities. Because the only certainties in life are death, taxes, and\
    \ buggy software, the bugs have to be fixed whenever possible. Everyone needs\
    \ to continually update software whenever errors are found and corrected.\n\n\
    Red Hat created an excellent method for updating its software: The Up-to-Date\
    \ (update) system automatically detects new software and installs it for you.\
    \ Fedora Core installs updates by default. Next to using good passwords and firewalls,\
    \ it's probably the most effective security system you can run. Fedora Core uses\
    \ the update system.\n\nFollow these steps to run update:\n\n+   1. Connect your\
    \ Fedora Core to the Internet.\n2. Click the GNOME menu and choose System Tools>Red\
    \ Hat Network.\n3. Enter your root password, if you're prompted.\n   The Red Hat\
    \ Network Configuration dialog opens boxes.\n   We describe how to configure an\
    \ IP packet-filtering firewall, but not a proxy firewall, in Chapter 8. If you're\
    \ connected to a network that uses a proxy, click the Enable HTTP Proxy button\
    \ and enter the proxy address in the text box.\n4. (Optional) Click to select\
    \ the Package Exceptions tab and select kernel*.\nClick the Remove button and\
    \ you can receive and update your kernel.\n   Some people prefer to upgrade the\
    \ kernel manually because kernel updates can occasionally cause problems. However,\
    \ because your current kernel isn't removed, you can always revert to it, if necessary.\
    \ We prefer to update the kernel when it's available.\n5. Click the OK button.\n\
    \n![](img/85ec3de0d5219d6ca14d5778e16a3338_262_0.png)"
  merge: -1
