    # # In the news


    You can obtain additional information about the Linux operating system from mailing
    lists and newsgroups on the Internet. In fact, one of the first popular uses of
    the Internet was the Usenet information-sharing system. Usenet is similar to the
    World Wide Web in that it uses a set of protocols to perform a special type of
    communication over the general-purpose Internet. Usenet provides the capability
    to let people participate in discussions via e-mail. Please post messages to a
    specific interest group that anyone can view and respond to.


    Newgroups and mailing lists are dedicated to specific topics: technological and
    any topic in which two or more people are interested. Dozens of newsgroups and
    mailing lists are devoted to Linux topics. Searching these groups often provides
    laser-like answers to your questions because someone else is quite likely to have
    encountered your problem and found a solution to it. You can also post your questions
