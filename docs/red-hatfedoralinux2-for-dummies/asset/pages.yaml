  md: '# Introduction


    # 5


    Text inside braces { | indicates that you must choose one of the values inside
    the braces and separated by the | sign. For example, you should enter either echo
    "one" or echo "two" or echo "three" if you see the command echo "one i two three".


    An ellipsis (...) means "and so on" or to repeat the preceding command as needed.


    Don''t concern yourself with these conventions for now. In most chapters in this
    book, you don''t need to know these particulars. When you need to know something
    about a particular syntax, come back to this introduction for a refresher course.


    # Keystroke and clicks


    Some instructions require that you press a specific key or keys to execute the
    desired result. If you need to press a single key, we say, for example, "press
    the A key". We use a plus sign to indicate multiple keys. For example, Ctrl+Alt+Delete
    means that you should press the Ctrl key, Alt key, and Delete key all at the same
    time.


    # How This Book Is Organized


    Like For Dummies books, Red Hat Fedora 2 For Dummies is organized into independent
    parts. You can read the parts in any order. Heck, if you have ever seen the movie
    Memento, you may want to read the parts in reverse. Basically, this book isn''t
    meant to be read from cover to back; rather, it''s meant to be a reference book
    that helps you find what you''re looking for when you''re looking for it. Between
    the Contents at a Glance page, the table of contents, and the index, you should
    have no problem finding what need.


    If you read the chapters in this book in order, you encounter the useful and interesting
    things first and the more technical items last. For example, after installing
    Fedora Core in Part I, you may want to proceed immediately to Part II to see how
    to connect Linux to the Internet or your local network. From there, you can use
    your new workstation to surf the Internet and use e-mail.'
