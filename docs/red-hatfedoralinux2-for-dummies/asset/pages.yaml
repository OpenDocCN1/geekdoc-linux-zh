  md: '# 118 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    # Trading places on your workspace switcher


    Switching between workspaces is easy. GNOME provides a utility, the Workspace
    Switcher, to select any workspace. The Workspace Switcher is on the GNOME Panel.


    You use the GNOME Workspace Switcher to access any workspace. The Workspace Switcher
    is divided into four quadrants. Clicking any of the quadrants displays the corresponding
    desktop. Click the lower-right one and you enter that workspace.


    You can force a window into any or all workspaces. Click the downward-facing arrow
    in the upper-left corner of a window. The menu that opens provides all the expected
    functions that close, minimize, maximize, and resize the window. However, toward
    the bottom of the menu are options for placing the window in any of the remaining
    three workspaces; or, you can put the window in all the workspaces. You may want,
    for example, to put an application like Mozilla in all workspaces in order to
    use it no matter what you''re doing.


    # Messing Around with Windows


    Before you can do anything to a window, you have to get its attention. When you
    have a window''s attention, it has *focus*. Depending on how you have set up GNOME,
    you can give a window focus with GNOME in several ways:


    +   * Click the window''s name on the GNOME Panel.

    * Click the window''s title bar, at the top of the window.

    * Click a part of the window itself, which typically also makes the window the
    topmost. This method is the default.

    * If you''re working in an office with lots of people, you can shout, "Hey, you
    — wake up!" Although this tactic isn''t likely to wake up your window, it is sure
    fin.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_139_0.png)


    In this book, we stick with the Fedora Core and GNOME default setting gives focus
    to a window when you click it.


    # Moving windows


    To move a window, click anywhere on the window''s title bar and hold the mouse
    button. As long as you continue to hold down that button, the window moves wherever
    you move your mouse. Release the button and the window dow stays there.'
