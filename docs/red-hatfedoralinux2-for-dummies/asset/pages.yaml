    Yeah, right. The problem is that this guy named Murphy (from Murphy''s law) hangs
    out in both virtual and real bookstores in addition to all things mechanical and
    electronic. He''s always jumping in just when things are starting to go well.
    The guy just cannot keep his nose out of other people''s business. This chapter
    is meant to smooth things out between you and Murphy in case he catches up with
