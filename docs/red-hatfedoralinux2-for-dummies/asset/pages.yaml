  md: '# # Chapter 19

    # Building a Streaming Audio Server


    +   In This Chapter

    - Introducing Icecast2 and Ices2 streaming audio servers

    - Creating a music source

    - Installing and configuring Ices2 and Ices2

    - Streaming audio to your private network


    All work and no play make Linux a dull boy. So forget the workday world for a
    while and have some fun. This chapter describes how to configure your Fedora Core
    computer as an audio stream server for your private network.


    We show you in Chapter 12 how to use Linux applications, like MPlayer, and to
    listen to Internet audio streams. In this chapter, we switch sides and show you
    how to serve these types of streams. Again, the open source movement fills the
    bill with Ices2 and Icecast2, which you use to serve up your audio stream.


    # Introducing Ices2 and Icecast2


    You''re most likely familiar with how audio streaming works from the desktop perspective.
    Chapter 12, for example, shows how to use XMMS and MPlayer to listen to Internet
    audio streams. (You can also use MPlayer to see video content.) However, many
    people consider it a mystery how multimedia (audio, video and slide shows) are
    created.


    Feeding audio information to a multimedia server, such as Icecast2, creates audio
    streams. (Shoutcast and RealServer, which are commercial servers, operate in a
    manner similar to Ices2.) You use Ices2 to feed audio information to Icecast2.
    Where you get the audio information is up to you — as long as you abide by copyright
    law. You then use a multimedia client to connect to the audio stream.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# 278 Part IV: Revenge of the Nerds


    The original Icecast worked with MP3 streams. Icecast is still available, but
    is no longer being developed or supported. Because of possible copyright problems,
    Icecast essentially been abandoned in favor of Icecast2, which works with the
    open source Ogg Vorbis format.


    This list provides more detail on each component in the system:


    +   - Multimedia client: The client connects to the multimedia server and plays
    the feed. For example, you use XMMS to connect to Icecast2.


    +   - Multimedia server: The server is responsible for accepting requests from
    a client and streaming multimedia information to the client. The server also converts
    the original multimedia content into Internet Protocol (IP) packets in order to
    route it across a private network or the Internet.


    +   - Multimedia content: Your multimedia server isn''t very useful without a
    content source. Your source may be a music CD or a DJ—you, for example. Sources
    are either fixed or dynamic. For example, a music CD is a fixed source. If you
    decide to switch careers and become a DJ, you''re a dynamic source. The Ices2
    application reads from a fixed source and feeds it to Icecast2.


    # Creating a Music Source


    Before you create your server, you have to create something to play. This section
    describes how to create an Ogg Vorbis file to play. We assume that you want to
    create a file from a commercial music CD. This practice is legal, and does not
    violate copyright law because you don''t create a server that is broadcast on
    the Internet. Instead, you''re creating a server that is broadcast to private
    networks (you). As far as we know, you''re still allowed to listen to your own
    CDs.


    The Ogg Vorbis audio formatting system is similar in function to MP3. However,
    Ogg Vorbis is an open source format (also known as a codec) and, unlike MP3, doesn''t
    have any proprietary algorithms or protocols. Ogg also provides higher fidelity
    than other formats. Ogg Vorbis is really two separate entities: Ogg is an audio
    compression format, and Vorbis is an encoding system.


    Follow these steps to create an Ogg-Vorbis-formatted music file:


    +   1. Log in to your computer as any user and insert an audio CD.


    +   2. Click the GNOME Menu button and choose Sound & Video��More Sound & Video
    Applications��Sound Juicer CD Ripper.'
