  md: '# 48 Part I: Installing Fedora Core


    Fedora Core runs in three different states (referred to as run levels): 1, 3,
    and 5. Each run level is used to perform different functions. At Level 1 (called
    single-user mode), Linux operates with a minimum of processes so that you can
    make configuration changes and troubleshoot problems. In Level 3, the computer
    runs without a graphical interface, so you have to interact with the computer
    by typing commands; you typically use Level 3 to run servers that provide only
    network services without need graphical interfaces. When your Fedora Core is running
    in Level 5, it runs with the X interface; it''s the default run level. You can
    use GRUB (Grand Unified Bootloader) to select a different Linux run level. When
    GRUB appears, press e for edit. The down-arrow key to select the line that begins
    with Kernel. Press the e key again, add a space, and then press 1, 3, or 5. Press
    the Enter and then press the b key. Your computer boots into the selected mode.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_69_0.png)


    +   3. Press the up- and down-arrow keys to highlight the bold Linux (if it''s
    not highlighted already) and press Enter.


    If you don''t press any of the keys, the default operating system (Fedora Core
    sets itself as the default when you install it) starts automatically after a 10-second
    delay.


    If you''re running more than one operating system (for example, Fedora Core and
    Windows), you can select any of the listed operating systems to boot; we assume
    here that you choose Linux.


    After you press Enter, Fedora boots. During this process, a graphical progress
    window shows how far along the process is. You can optionally display lists of
    technical information by pressing the Show details button. The optional information
    is what Linux is learning about your computer and its hardware (disk drives, networks,
    and memory, for example).


    # Logging In Your Fedora Core Computer


    When you use Fedora Core, or any Linux distribution, you must log in as a particular
    user with a distinct login name. Why? Because Linux is a multiuser system and
    uses different accounts to keep people from looking at other people''s secret
    files, erasing nearly files from the system, and otherwise (intentionally or unintentionally)
    doing bad things.


    The use of identities helps to keep the actions of one person from affecting the
    actions of another because many people may be using the same computer system at
    the same time (for example, over a network). A benefit of this strategy is that
    Linux computers are essentially invulnerable to viruses simply because no user''s
    files and directories can be used to corrupt the system as a whole.


    As Fedora boots, you see all sorts of messages scrolling on the screen. After
    the scrolling stops, the login screen appears.'
