  md: '# Manipulating Files and Directories


    Linux has many ways to create, move, copy, and delete files. Some features are
    so easy to use that you need to be careful: Unlike other operating systems, Linux
    doesn''t tell you you''re about to overwrite a file — it just follows your orders
    and overwrites!


    We have said it elsewhere in this book, and we''ll say it again: Make sure that
    you''re not logged in the root user when you read through these sections. You
    can unintentionally harm your computer when you''re logged in as root. As root,
    or the superuser, you can erase any file or directory — regardless of permissions
    are set. Be careful!


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_353_0.png)


    # Creating directories


    To create a new directory in Linux, you use the mkdir command (just like in MS-DOS).
    The command looks like this:


    ```

    mkdir newdirectory

    ```


    This command creates a sub oldest under your current or working directory. If
    you want the subdirectory under another directory, change to that directory first
    and then create the new subdirectory.


    Create a new directory named cancun. Go ahead — do it:


    ```

    mkdir cancun

    ```


    (Can you tell where we would rather be right now?)


    Create another directory named veracruz:


    ```

    mkdir veracruz

    ```


    Then, change the directory to put yourself in the cancun directory:


    ```

    cd cancun

    ```


    Now, verify that you''re in the directory cancun:


    ```

    pwd

    ```'
  merge: -1
