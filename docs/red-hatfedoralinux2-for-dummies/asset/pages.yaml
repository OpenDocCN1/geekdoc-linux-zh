    # # Adding and Deleting Panels


    You''re not limited to the default GNOME Panel. You can create additional panels
    at will. Click anywhere on an unused portion of the GNOME Panel and choose New
    Panel. For example, choosing Edge Panel places a blank panel along the top of
    the screen.


    The new panel is blank and doesn''t contain any icons, like the default GNOME
    Panel does. The new panel has a basic menu you can use to populate it with icons
    and other menus. Right-click the new panel and the Add to Panel submenu opens.
    You can use the Add to Panel menu to build up the new panel. For example, choose
    Accessories->Clock and a digital clock is added to the panel. Or, click Appearance->G.
    Keep adding icons until you''re satisfied with the system.


    You of course, remove any panel you create, but you can remove the default GNOME
    Panel. The process is simple: Right-click any unused section of the panel and
    choose Delete This Panel. Click the Delete button in the Delete window that opens,
    and the panel is "depaneled."


    You can hide any panel when it''s not in use. Right-click any unused section of
    the panel and choose Properties from the pop-up menu, and the Panel Properties
    window opens. Select the Autohide option and click the Close button. The panel
    disappears off the edge of the screen until you move the cursor to that edge.
    The panel reappears.


    > > TIP  Every new panel contains arrows at each end, called Hide buttons; the
    original default panel does not. Clicking either of the arrows forces the panel
    to slide off one side or the other. The panel is hidden except for those same
    arrows. Clicking the arrow uncovers the hidden panel.'
