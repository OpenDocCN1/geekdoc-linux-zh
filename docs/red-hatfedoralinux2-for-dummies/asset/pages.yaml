- img_proc: true
  md: '# Appendix C: Filing Your Life Away


    Fedora Core assigns a unique group to each user. For example, when you add the
    first user to your system, that user gets the user ID and group ID of 500. The
    next user receives the user ID and group ID of 501, and so on. This system gives
    you lots of control over who gets access to your files.


    # Making Your Own Rules


    You, as the owner of a file, can specify permissions for reading, writing to,
    or executing a file. You can also determine who (yourself, a group of people,
    or everyone in general) can do these actions on a file. What do these permissions
    mean? Read (on you have permission):


    +   ** Read permission:** You can read the file. For a directory, read permission
    allows the ls -l command to list the names of the files in the directory. You
    must also execute permission for the directory name to use the -l option of the
    ls -l command or to change that directory.


    +   ** Write permission:** You can modify the file. For a directory, you can create
    or delete files inside that directory.


    +   ** Execute permission:** You can type the name of the file and execute it.
    You cannot view or copy the file unless you have read permission. Files containing
    executable Linux commands, called shell scripts, must therefore be both executable
    and readable by the person executing them. Programs written in a compiled language,
    such as C, however, must have only executable permissions, to protect them from
    being copied where they shouldn''t be copied.


    For a directory, execute permission means that you can change to that directory
    (with cd). ls - doesn''t work. Unless you have read permission for the directory,
    ls -l lists directories and files in that directory, but you cannot see additional
    information about the files or directories by using ls -l command. Although this
    arrangement may seem strange, it''s useful for security.


    The first character of a file permission is a hyphen (-) if it''s a file; the
    first character of a directory is d. The nine other characters are read, write,
    and execute positions for each of the three categories of file permissions:


    +   - Owner (also known as the user)


    +   - Group


    +   - Others'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# 338 Part VI: Appendixes


    Your gotowork file, for example, may show these permissions when it''s listed
    with `ls -l gotowork` command:


    ```

    rw-rw-r--

    ```


    The hyphen (-) in the first position indicates that it''s a regular file (not
    a directory or special file). The next characters (rw- ) are the owner''s permissions.
    The owner can read and write to the file, but cannot execute it. The next three
    characters (rw-) are the group''s permissions. The group also has read-write access
    to the file. The last three characters (r--) are the others'' permissions, which
    are read-only.


    [rw-][rw--][r--] illustrates the four parts of the permissions: the file type
    followed by three sets of triplets, indicating the read, write, and execute permissions
    for the owner, group, and *other* users (meaning everyone else).


    You can specify most file permissions by using only six letters:


    +   - ugo stands for — no, not a car — user (or owner), group, and other.

    - rwx stands for read, write, and execute.


    These six letters, and some symbols, such as the equal sign (=) and commas, are
    put together into a specification of how you want to set the file''s permissions.


    The command for changing permissions is `chmod`. Here''s its syntax:


    ```

    chmod specification filename

    ```


    Change the mode of gotowork to give users the ability to read, write, and execute
    a file:


    ```

    chmod u=rwx gotowork

    ```


    That was easy enough. If you want to give the group permission to only read and
    execute the file? You execute this command:


    ```

    chmod g=rwx gotowork

    ```


    This command doesn''t affect the permissions for owner or other — just the group''s
    permissions. You can set the permission bits in other ways. But because this way
    is so simple, why use any other?'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# Appendix D

    Becoming a Suit: Managing the Linux File System


    In This Appendix


    +   - Mounting and unmounting a file system

    - Increasing disk space with a new drive or memory space


    Managing the Linux file system isn''t a complex job, but it''s an important one.
    You have the responsibility of managing the Linux file system and ensuring that
    users (even if you''re the only user) have access to secure, corrupted data. You''re
    the manager (yes, — gag — a suit) of your file system.


    This chapter introduces you to managing your Linux file system. Consider yourself
    a management trainee. When you''re done reading this, feel free to take a nice,
    long, expensive lunch.


    # Mounting and Unmounting a File System


    Fedora Core other Unix-like operating systems use files in different ways from
    MS-DOS, Windows, and Macintosh operating systems. In Linux, everything is stored
    as files in predictable locations in the directory structure; Linux even stores
    commands as files. Like other modern operating systems, it has a tree-structured,
    hierarchical directory organization: the file system.


    All user-available disk space is combined in a single directory tree. The base
    of this system is the root directory (not to be confused with the root user),
    designated with a slash (/). A file system''s contents are made available to Linux
    using space. Mounting a file system makes Linux aware of the files and directories
    it contains. This process is just like mounting a horse — except that no horse
    is involved.


    Unlike in the Windows world, Linux file systems, except for /root, must be explicitly
    mounted or unmounted, which means that file systems can be connected or disconnected
    from the directory tree.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Mounting Windows files from a floppy disk


    File system mounting and unmounting provide a good example of the difference between
    Linux and Windows. If you use a floppy disk or CD with Windows, you just insert
    it into the drive and you have immediate access to it. With Linux, you must insert
    the floppy disk into the drive and then explicitly mount it. Sound complicated?
    Not really.


    You can mount a Windows hard drive partition or floppy drive on your Linux computer.
    You can read and write to FAT or FAT32, but can only read from NTFS file systems.
    These steps show you how to mount a Windows floppy:


    +   1. Insert a Windows MS-DOS-formatted floppy disk into the drive, click the
    GNOME button, and choose System Tools:Disk Management. Enter the root password,
    if requested.


    +   2. Select the floppy disk and click the Mount button.

    You know that the floppy disk has been mounted successfully when the floppy disk
    icon is displayed on the left side of the screen.

    You can now read and write to the floppy disk (unless the read-only tab on the
    disk is set).


    +   3. Click the Exit button to close the utility.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_361_0.png)


    Fedora Core and GNOME are configured to automatically start the process that mounts
    your floppy disk or CD when you insert it into the drive. We use the manual method
    here to show you how the process works. To manually mount the floppy disk in the
    command-line interface, log in as root, open the terminal window, and run this
    command:


    ```

    mount -t msdos /dev/fd0 /mnt/floppy

    ```


    # Unmounting file systems


    Unmounting a Linux file system is a little simpler than mounting one. Because
    the file system is already mounted, you don''t have to specify any options or
    other information. You just have to tell the Red Hat disk management druid to
    unmount the file system. Follow these steps:


    +   1. Click the Main Menu button and choose System Tools:Disk Management. Enter
    the root password, if you''re prompted.


    +   2. When the User Mount window appears, click the button to the right of the
    file system in which you''re interested.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Appendix D: Becoming a Suit: Managing the Linux File System 341


    The button indicates whether the file system is mounted or unmounted.

    After a few seconds, the button changes from Unmount to Mount to show that it
    has been unmounted.


    +   3. Click the Exit button to close the utility.


    The file system is mounted. If the file system is a removable type, such as a
    floppy disk or CD, you can remove it. Otherwise, the file system is not simply
    available for you until you remove it.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_362_0.png)


    You can run the eject command from a bash shell to eject a CD. You have to unmount
    the CD first and then enter the eject command. Otherwise, to eject a CD, you must
    unmount it and then press the eject button on the CD-ROM drive. In either case,
    you cannot eject the CD until you have unmounted it.


    # Adding a Disk Drive


    Sooner or later, life catches up with you and you''re likely to need or want a
    bigger house or car or diamond in your tooth, or whatever. The same goes for disk
    space, in which case you want to add another disk drive.


    The first step to increasing your drive space is to add a new storage device.
    It can be a hard drive (IDE or SCSI) or a USB or FireWire memory stick. These
    steps describe the general process of adding a storage device and then formatting
    and mounting it:


    +   1. Install the hard drive or insert the USB or FireWire device.


    If the device is an IDE or SCSI hard drive, turn off the power to your computer
    and monitor. unplug the power cable and open the computer case. (Don''t cut yourself
    on the sharp metal edges when you''re reaching into the computer). Use the antiseptic
    strap that comes with the hard drive; follow the instructions with the strap.


    Most PCs use IDE controllers. SCSI-based PCs are more expensive and aren''t commonly
    found in consumer realm; these types are more common in the commercial realm.
    IDE-based PCs have two IDE controllers. Each device can control as many as two
    IDE devices. Ribbon cables connect the controller to the devices.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_362_1.png)


    You have to configure your new disk to function as a slave device if it''s connected
    to a ribbon cable or IDE controller that already has another device (hard drive
    or CD-ROM) attached.


    If the device is a USB or FireWire memory stick, skip to Step 3.'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# 342 Part VI: Appendixes


    2. Reboot your computer and run the dmesg command from a GNOME Terminal window.


    If you added an IDE drive, look for the mention of an hdx device, where x is replaced
    with the letter b, c, d, or e. This information tells you that your kernel ''saw''
    the new hard drive as it booted:


    ```

    hdb: HITACHI_DK227A-50, 4789MB w/512KB

    Cache.CHS-610/255/63

    ```


    If you added a SCSI drive, the general device type is sdx.


    3. Partition the new drive.


    Run the fdisk /dev/hdb command for an IDE drive.


    Use the command fdisk /dev/sda for a USB or FireWire memory stick. The memory
    stick appears as a SCSI device, for example as /dev/sda, /dev/sda, /dev/sdb, or
    /dev/sdc depending on your computer''s configuration.


    You can find out more information about fdisk at www.redhat.com/docs/manuals/linux/RHL-9-Manual/install-guide/.


    4. Create a file system on the new partition (change the devices as appropriate).


    When you''re using an IDE or SCSI drive, for example, enter this command:


    ```

    mkfs /dev/hdb

    ```


    For a USB memory stick, enter this command:


    ```

    mkfs /dev/sdc

    ```


    5. Create a new directory in which to mount the new device:


    ```

    mkdir /space

    ```


    6. Mount the newly formatted drive by using the appropriate command:


    ```

    mount /dev/hdb /space

    ```


    or


    ```

    mount /dev/sdc /space

    ```


    Your drive has been physically added to your system and partitioned, and you have
    added file systems. The drive is ready to join the rest of the file system.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_363_0.png)'
