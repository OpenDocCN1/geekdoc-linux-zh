  md: 'You need to figure out how your wireless NIC (or network adapter) should connect
    to your network. Wireless NICs connect to a LAN in two ways:


    +   - **Adapter-to-adapter**: This type, referred to as an ad-hoc connection,
    is useful if you have two or more computers that you want to talk and form their
    own, exclusive private network.


    +   - **Adapter-to-wireless hub**: This type, called infrastructure, provides
    a single entrance (an access point) into a LAN. An access point allows one or
    more computers to be connected to a network. However, unlike an ad-hoc network,
    the individual computers can connect to any access point that allows them to.


    The wireless-configuration instructions we provide work with either the infrastructure
    or ad-hoc connection methods. Your wireless NIC can connect to either the access
    point or other computers (Linux and Windows) as long as you correctly configure
    your Network ID (ESSID) and encryption key.


    # Choosing between ad-hoc and infrastructure


    Using ad-hoc mode provides several advantages:


    +   - **Lower costs**: You don''t have to purchase an access point; an access
    point starts at around $50. Computers using wireless NICs running in ad-hoc mode
    communicate directly with each other, eliminating the need for a common access
    point.


    +   - **Simple configuration for Linux users**: Older access-point devices could
    be configured using only Windows-based software — the simple network management
    protocol (SNMP), to be exact. You had to physically connect a Windows computer
    to the access point via a wired Ethernet network and then use the software supplied
    with the device. That was difficult if you didn''t have any Windows-based computers.
    Newer access points tend to use HTML-based configuration systems, which you can
    use Mozilla to configure these newer devices.


    +   - **Ad-hoc networks eliminate the need to configure any access point**: You
    need to configure only the wireless NIC in each computer on your network. You
    can use the Fedora Core Network Configuration utility to configure a wireless
    NIC, which simplifies the process. Each NIC must have the same Network ID and
    encryption key.'
