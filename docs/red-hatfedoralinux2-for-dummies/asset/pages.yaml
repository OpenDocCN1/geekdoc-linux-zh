  md: '# 14 Part I: Installing Fedora Core


    This list shows some cool Fedora Core features you can use:


    +   - Desktop productivity tools: Red Hat, and now Fedora Core, have successfully
    worked overtime over the past few years to make Linux work on your desktop. Fedora
    Core bundles software, such as the OpenOffice suite of productivity tools, so
    that you can get your everyday work done. The OpenOffice suite has a full-function
    word processor plus spreadsheet, presentation, graphical drawing, and Web-page-creation
    tools. Its word processor can read and write all Windows formats plus many others,
    such as WordPerfect.

    - Multimedia stuff: Fedora Core packs numerous multimedia tools for you to use.
    You play, record, and rip audio tracks from CDs and DVDs. You can listen to streamed
    media sources, such as radio stations, or the Internet. Linux also lets you transfer
    photos and other items from your cameras and MP3 players, for example.

    - Network services: Fedora Core works as a network-based server tool. Linux found
    its initial popularity in performing jobs like Web serving and file and printer
    sharing hasn''t missed a beat. We show you how to create several network services.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_35_0.png)


    # Linux is for needs too


    The Linux operating system has been ported (converted) from the 32-bit Intel architecture
    to a number of other architectures, including Alpha, MIPS, PowerPC, and SPARC.
    This conversion gives users a choice of hardware manufacturers and keeps the Linux
    kernel for few processors. Linux handles symmetric multiprocessing (it can take
    on more than one CPU or mathematical or logical programming unit per system).
    In addition, projects are in the works to provide sophisticated processing capabilities,
    as:


    High availability: You can use Fedora Core computers to construct high-availability
    servers. Some servers, such as commercial Web servers, must run nearly 100 percent
    of the time. Fedora Core processors can be configured so that if one fails, another
    automatically takes its place.


    Embedded computing: Computers-on-a-chip are devices that combine all the parts
    of a computer on a single chip. These devices are embedded (placed inside) in
    machinery, equipment, and consumer products. The embedded computers-on-a-chip
    control items such as refrigerators and car engines.


    Parallel processing: Enabling the problem solving power of a computer by using
    multiple processors to work in parallel. Parallel processing comes in various
    flavors, such as Symmetric Multi Processing (SMP), extreme Linux systems, and
    Beowulf clusters. Research organizations and individuals can create machines with
    supercomputer capabilities at a fraction of the price of supercomputers. In certain
    cases, extreme Linux systems have been made from obsolete PCs, costing the organizations
    that make them nothing in material costs.'
