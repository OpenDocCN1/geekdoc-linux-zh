  md: '# Chapter 16: Creating Basic Linux Network Services


    DNS makes the Internet possible. The Internet just wouldn''t be practical if we
    had to look up IP addresses from some gigantic yellow-page phone book. DNS also
    makes working on smaller private networks more convenient. By building your own
    DNS, you avoid having to remember the addresses of your machines. This section
    describes how to build a simple DNS system to your network.


    Add the name/address pairs to each computer''s /etc/hosts file if you don''t construct
    a DNS server. Edit /etc/hosts and add the IP address full host name, and, optionally,
    an alias for every computer on your private network. For example, add 192.168.1.254
    veracruz.paunchy.net veracruz Cancun''s /etc/host file. Then add 192.168.1.1 cancun.paunchy.net
    cancun to Veracruz''s /etc/host file. These entries allow each of the two machines
    in the example to address each other by name.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_242_0.png)


    # Introducing DNS components


    The overall DNS system is a complex system that contains many components. But
    because we show you how to build a DNS server for your private network, you can
    use a simpler system. Building your DNS server requires understanding only a reasonable
    handful of DNS components.


    This list outlines the basic DNS components:


    +   - Domains: You''re probably familiar with network domains, whether you realize
    it or not. Domains are the networks you access all the time on the Internet. For
    example, redhat.com is a domain (and www.redhat.com is the name of a server within
    the redhat.com domain).

    - Domains can optionally be divided into subdomains. For example, Red Hat has
    a subdomain, fedora.redhat.com, used for the Fedora Core project.

    - Domains themselves are divided into domains. The ubiquitous .com, .edu, .org
    are all top-level domains. They organize the Internet into business, educational,
    and not-for-profit arenas, respectively.

    - Zones: Domains are divided into zones. DNS server service zones. A zone can
    map directly to a domain; multitone can service a domain too. The DNS server you''re
    building in this section consists of a single domain that services the fictitious
    paunchy.net domain.

    - Authoritative name servers: Every zone must have an authoritative name server.
    It holds the information for every host within the zone. You can create primary
    and secondary authoritative name servers. The secondary name servers back up the
    primary name servers.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# 222 Part IV: Revenge of the Nerds


    +   - Non-authoritative name servers: You can create name servers that don''t
    necessarily provide the most up-to-date information.


    +   - Caching name server: Name servers can be configured to look up addresses
    from other name servers and temporarily save, or cache, the information. Caching
    name servers helps spread out the load of servicing large domains.


    +   - Root name servers: The authorities who control domain name registrations
    provide root name servers that hold the addresses of name servers for each domain.
    DNS queries to root name servers to find where to find authoritative name servers.


    The parameters found in DNS configuration and zone files are called resource records
    (RR). This list describes them:


    +   - A records: Address (A) records map IP addresses to numeric addresses.


    +   - C records: Canonical (C) records define generic aliases for A records.


    +   - MX records: Mail exchange (MX) records specify the mail servers that serve
    a domain.


    +   - NS records: Name server (NS) records specify the name server for a zone.


    +   - SOA: The start of authority (SOA) parameter creates a section that describes
    the generic properties of a zone file. The SOA configures parameters that set
    the serial number and various timeouts, plus the domain name of a zone.


    # Understanding how a DNS address request works


    This section gives you a quick look at the steps your browser takes to find the
    Fedora Core Web page:


    +   1. You open your browser and enter any URL, such as `fedora.redhat.com`.


    +   2. The browser asks Linux for the Web page’ numeric IP address.


    +   3. Linux looks in its `/etc/resolv.conf` configuration file and finds the
    address of a name server.


    You can use any available DNS server on the Internet. For example, you can use
    Albuquerque''s finest ISP Southwest Cyberport DNS server, `98.115.2`, from anywhere
    on the Internet. You should use your own ISP''s servers because it has fewer routers,
    or hops, to go through, which results in better reliability and speed.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_243_0.png)


    +   4. Linux requests the IP address for `fedora.redhat.com` from the name'
