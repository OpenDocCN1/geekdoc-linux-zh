  md: '# 186 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    # VMware networking


    The VMware virtual computers can use your host computer''s network connection.
    VMware provides three methods for accessing a private LAN and one method for accessing
    the host computer''s local file system:


    used by private networks to funnel all their hosts through a single gateway to
    the Internet.


    VMware uses NAT to make the virtual machine appear to be the host machine on the
    host machine''s LAN. NAT is easy to configure because you have to configure only
    the virtual machine''s network configuration to use the dynamic host configuration
    protocol (DHCP). You have to select only DHCP, and nothing else.(We mention NAT
    in Chapter 16.)


    **Bridged network:** "Bridges" to the host machine''s private network through
    the host interface card (NIC). The virtual machine appears to be an independent
    network device to the LAN. The virtual computer has its own virtual NIC with a
    real IP address. The bridged configuration provides to the virtual machine the
    most flexible network configuration possible. However, the virtual machine must
    be configured and maintained like any other device.


    **Network Address Translation (NAT):** A process that makes one networked computer
    appear to be another computer. NAT translates the source network address (and
    port) to that of another address (and port). This method is widely


    **Host-only network:** Configures the virtual machine to use the host machine''s
    file system. VMware sets up Samba on the host machine, and then the virtual machine
    can mount the host''s file system. (Samba is a Linux/Unix system that speaks the
    same protocol, or language, as the Microsoft file-sharing system. Samba allows
    Linux computers to access file systems on Windows computers and vice versa.)


