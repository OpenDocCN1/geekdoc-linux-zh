  md: '# 54 Part I: Installing Fedora Core


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_75_0.png)


    # Delving deep into color depth


    **Color depth**, the number of colors your system can have active on the window,
    loosely a function of both the amount of video memory contained by your system
    and the window resolution.


    If your system has a small amount of memory (as 1 megabyte), your screen can have
    a resolution of 1024 x 768 pixels (dots) with 256 colors (6 bits) on the screen
    at one time. If your system has 2MB of memory, you can have 64 thousand colors
    (16 bits) on the screen at


    same time at the same resolution. The more memory you have, the more colors you
    can display for any given resolution.


    When you want to display an image and the color depth isn''t correct, nothing
    drastic happens. The picture may look lackluster or not quite normal. X has an
    interesting capability to have virtual color maps, which allow the active window
    to utilize all the colors of the bits of color depth, even if other windows are
    using different colors.


    Alternatively, you can reboot your computer to enforce the changes.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_75_1.png)


    You can also restart X unceremoniously; but quickly, by pressing Ctrl+Alt+Backspace.
    Your current X session is stopped and eventually restarted. You can log back in.


    # Introducing the Linux File System Tree


    Linux, like Windows, uses files and directories to store and organize information
    and applications. This section introduces the Linux file system.


    Linux sees all its parts, except its network, as files. Linux accesses files,
    directories, and devices as *file addresses*. Linux refers to drives and drive
    partitions using a system of letters and numbers; for example, `/dev/hda` may
    be the name of the first IDE hard drive, and `/dev/sdb` may be the name of the
    second SCSI hard drive.


    You can compare the Linux file system to a tree, as shown three subdirectories
    of root (more than a dozen subdirectories are in the root directory); a subdirectory
    is a directory within a directory. The top of the upside-down tree, represented
    by a /, is the root directory. A series of limbs, branches, and leaves extends
    below the root: Limbs are mount points, the branches that extend from the limbs
    are directories, and the leaves on those branches are your files.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# Chapter 4: Starting Up with Fedora Core 55


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_76_0.png)


    A mount point is a drive partition or remote file system (such as your DVD or
    CD-ROM drive) that is mounted, and made visible to, a directory of the limb above
    it. Whenever a disk partition or remote file system is mounted on the directory
    branch, it turns into another limb, allowing even more branches to be positioned
    and attached below the mount point.


    Fedora Core needs at least a root partition in your directory structure and a
    swap space. The root partition is used to store all your personal and system files
    and directories; Linux uses swap space, the Hamburger Helper of the computer world,
    to extend your memory beyond the limit of your random access memory (RAM). If
    you have 512MB of RAM and 512MB of swap space, for example, you can run programs
    that use 1 gigabyte of memory.


    This configuration isn''t much different from the Windows and MS-DOS file systems.
    Windows uses the concept of a hierarchical directory tree. However, the syntax
    is somewhat different. The top-level directory in Fedora Core, root, is designated
    with a forward slash (/). Every subsequent subdirectory name follows that initial
    slash. For example, the home directory is a subdirectly of root and is shown as
    /home. In the Windows world, the root directory is designated with an backslash
    (\). The famous C: is synonymous with C:\ For both operating systems it is carried
    forward when dividing directories; Linux uses forward slashes, and Windows uses
    backslashes. Your home directory is then shown as /home/me in Linux and as user
    directoriesime Windows.


    Another fundamental difference between Linux and Windows file systems is that
    Linux requires you to explicitly mount file systems. Windows does so automatically.
    Explicitly mounting the file system isn''t as onerous as it sounds. Fedora Core
    installs utilities that automatically sense and mount file systems when necessary.
    For example, the default Fedora Core configuration mounts a DVD or CD-ROM automatically
    whenever you insert it in the drive.'
