  md: '# Manually removing packages


    RPM packages are good residents on your computer because they lend themselves
    to easy removal. The rpm command permits you to remove packages via the erase
    (-e) function.


    Suppose you''re not so fond of the Mozilla e-mail client because you like the
    Evolution client better. No problem: Go ahead and remove the Mozilla mail package.
    To remove an RPM package, follow these steps:


    +   1. Log in as root and open a terminal emulator window.

    The GNOME Terminal window opens.


    +   2. Enter this command to find the name of the package to remove:

    rpm -qa | grep mozilla

    You should see these results:

    mozilla nss 1.0.1-10

    mozilla 1.0.1-10

    mozilla-npr-1.0.1-10

    mozilla-psm-1.0.1-10

    mozilla-mail-1.0.1-10


    You need to know the name of the package before you can remove it. Use this step
    to display all installed Mozilla packages to find the name of the package.


    +   3. You can also find out about the package by using this command:

    rpm -qi mozilla-mail

    Alternatively, you can display a list of all installed packages by using the rpm
    -qa command. Run the man rpm command to query options.


    +   4. Enter this command to remove the Mozilla e-mail client:

    rpm -e mozilla-mail


    # Introducing and Using YUM


    The Yellowdog Updater, Manager (YUM) is, simply put, a wonderful system. YUM takes
    software installation and management to the next level by providing three functions
    that RPM doesn''t:'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# Appendix E: Using RPM and YUM 351


    +   - Takes over the task of finding and obtaining software packages: YUM can
    download packages from the Internet (or a private network), a DVD or CD-ROM, or
    your local hard disk.


    +   - Computes package dependencies: If you want to install an RPM package that
    requires the installation of other packages, you usually have to determine what
    those packages are, find them, and install them manually.


    +   - Updates your computer: YUM can update your entire Fedora Core computer as
    well as install and remove individual packages or package groups. RPM can update
    individual packages, but not your entire system. The YUM update option performs
    the same function as the Red Hat up2date system.


    YUM is also easy to configure and access multiple software repositories (mirrors).
    Here''s the default YUM configuration, `/etc/yum.conf:


    ```

    cached=/var/cache/yum

    debuglevel=2

    logfile=/var/log/yum.log

    pkgpolicy=newest

    distroverpkg=fedora-release

    tolerant=1

    exactarch=1

    clclude=

    ```


    ```

    [base]

    name=Fedora Core reveleaser $basesearch - Base

    baseurl=http://fedora.redhat.com/releases/fedora-core-

    $releaser

    ```


    ```

    [updates-released]

    name=Fedora Core reveleaser $basesearch - Released Updates

    baseurl=http://fedora.redhat.com/updates/released/fedora-

    core-$releaser

    ```


    ```

    #updates-testing

    name=Fedora Core reveleaser $basesearch - Unreleased

    Updates

    baseurl=http://mirrors.kernel.org/fedora/core/test/1.90/

    $basesearch/os

    ```


    The YUM configuration options are shown in this list:


    +   - cachedir: This option sets the location where YUM stores RPM packages and
    their headers (storing the files and other information about the package). YUM
    downloads the RPM packages (and headers) before installing or updating them. The
    default is `/var/cache/yum` directory.'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# 352 Part VI: Appendixes


    +   - debuglevel: This option sets the detail level of information that is transmitted
    to the log file. The range is from 0 to 10, where 0 is no information and 10 is
    too much information. The default is 2.


    +   - logfile: The location of the log file. Not surprisingly, the default location
    is /var/log/yum.log; /var/log is the default location for most, if not all, Linux
    log files.


    +   - pkgpolicy: There are two options: newest and last. The newest option tells
    YUM to install the most recent version of a package. The last option selects the
    package found on the last server in an alphabetical list of servers. We can think
    of no reason to use the last option.


    +   - distropkg: Your Fedora contains an RPM package named fed-release. This package
    contains information about the version of your installation. (Red Hat Linux computers
    contain a package redhat-release that contains the same type of information.)
    Because YUM is platform independent (it works on multiple Linux distributions),
    this option tells YUM where to look for the distribution name and version number.
    The default is fedora-release.


    +   - tolerant: YUM is strict or not strict. When tolerant is set to 1 (the default),
    YUM ignores errors that occur during its operation.


    +   - exactarch: YUM can also be strict about the architecture of the packages
    it installs. When YUM is set to its default of 1, it does not install an i386


    +   - exclude: You can tell YUM not to install packages. For example, if you don''t
    want YUM to automatically update your Linux kernel, set exclude=kernel*.


    The remaining contents of /etc/yum.conf contain the Server sections. These sections
    tell YUM where to look for RPM packages. The Server sections also tell YUM the
    general purpose of the packages. The following list describes each Server section
    option in more detail:


    +   - [serverid]: The server identification (serverid) field tells YUM which type
    of software repository it controls (known as a channel by the Red Hat Update system).
    Fedora Core is configured to work with the following types: base, updates-released,
    updates-testing, and development. The base repository contents are identical to
    what''s on your companion DVD - it includes the "base" Fedora Core 2 distribution.
    The updates-released repository includes all the officially tested and blessed
    updates to the base installation; the updates-testing type includes pending updates
    not officially released yet. The development type includes intended for the next
    Fedora Core version. It''s essentially the beta version of the next release.'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# Appendix E: Using RPM and YUM 353


    By the time you read this book, the Development repository will include the software
    Fedora Core 3 (or beyond, depending on when you read this book). You can participate
    in the Fedora test cycle by downloading and installing the Fedora Core 3 Test
    distribution. Alternatively, you can use YUM to update your computer from the
    Development repository. That''s what we did while writing this book.


    +   - name: This option sets a description for the server that displayed when
    you run YUM.

    - baseurl: This option points to the server repository URL. You can use the base,
    updates-released, updates-testing, and development repository types. The default
    URL is fedora.redhat.com, but you can add one or more mirrors.


    For example, you can change the server ID to


    ```

    baseurl=http://fedora.redhat.com/releases/fedora-core/

    $releasever=

    http://mirrors.kernel.org/fedora/core/

    $releasever/1386

    ```


    This example provides YUM with two repositories to use (in sequence); if one is
    unavailable, the second used is likely to use slightly different directory structures
    to store its repository. The Fedora Core project''s default repository download.fedora.redhat.com
    uses fedora/linux/core/2/1386 as its base directory, but mirrors.kernel.org uses
    fedora/core/1/1386/os. YUM works as long as baseurl points to the location in
    the repository where the headers directory is found. For example, if you browse
    the mirror limestone uregon.edu, you find the headers directory at /fedora/2/1386/os,
    although fedora/core/2/1386 contains the headers mirrors.org.


    You can use YUM without modification. Log in as root and run the command yum check-update.
    YUM checks the base repository and lists all available updated packages for your
    computer. Run the command yum update to find, download, and install all the updates.
    You can configure YUM to automatically update your system once per day by executing
    the commands chkconfig-level 35 yum once on and /etc/init.d/yum restart.'
