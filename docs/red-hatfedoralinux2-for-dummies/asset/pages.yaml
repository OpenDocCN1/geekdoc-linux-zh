  md: '# How cable modems work


    Modern cable modems do more than just transmit and receive Internet Protocol (IP)
    packets. They transmit and receive IP packets by modulating and demodulating electrical
    signals over the cable TV wires—thus the name modem (modulate/demodulate). Cable
    modems now use the industry standard Data Over Cable Service Interface Specification
    (DOCSIS) protocol to


    deliver electrical signals across the cable network. The electrical signal carries
    the actual bits and bytes that comprise the network packets. A good analogy is
    an AM or FM radio. The DOCSIS-based electrical signals transmit bits and bytes
    just like radio waves transmit speech or music.


    The following sections take you through the process of finding a cable provider
    and setting up your access.


    # Finding an Internet cable provider


    Finding an Internet Cable Provider (ICP) is as simple as calling your cable television
    company. Not all cable TV systems carry Internet traffic, but many do.


    Locating a cable television company that provides broadband Internet connections
    is, unfortunately, quite easy. It''s unfortunate because little competition exists
    within the cable industry. Federal law effectively restricts competition within
    municipalities and creates the environment for monopoly companies. The result,
    of course, is that prices remain higher than necessary. Oh, well, at least many
    cable companies are offering Internet connections.


    Your ICP is your default Internet Service Provider (ISP). Most cable companies
    give you one or more e-mail addresses. However, cable companies don''t generally
    provide login accounts, like ISPs do.


    Login accounts are used for launching applications and storing information. They
    aren''t essential, but they''re useful. However, nothing stops you from maintaining
    a regular ISP and using your login account. You then have a high-speed Internet
    connection you can use to log in to any account you have.


    We don''t run through the process of signing up for cable service because it varies
    from ICP to ICP. In any case, the process should be simple enough. A good portion
    of the sign-up process involves waiting on hold and listening to Muzak. One suggestion,
    though: Make sure that you have pertinent information about your system and that
    the cable company knows you''re using Linux.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# Dealing with the hardware


    One great thing about Internet cable is that you can buy the cable modems from
    your local electronics store or an Internet store. DSL equipment is less readily
    available. Cable modems are generally priced the same whether you purchase through
    your provider, the Internet, or a bricks-and-mortar store. (Cable companies sometimes
    run promotions where they rebate by most, if not all, of the price of the modem.)
    But the convenience of running to a local store is significant, especially if
    your cable modem breaks on a Saturday night and you just have to download the
    latest game patch.


    Before you purchase a cable modem, make sure that you


    +   - Ask whether you have to buy your modem through the cable provider. If not,
    you can shop around for the best price.


    +   - Make sure that the modem you buy is compatible with your service provider.
    The cable industry is converging on using the Data Over Cable Service Interface
    Specification (DOCSIS) as its Internet standard. DOCSIS modems are quite easy
    to configure, keep your fingers crossed that your service provider uses them.


    If your provider doesn''t use DOCSIS, you likely have to purchase your modem through
    your provider.


    The instructions we provide later in this chapter are designed for DOCSIS modems.


    Setting up your cable modem is usually a straightforward process. Cable modems
    act as network bridges. A network bridge simply rebroadcasts network packets in
    both directions — incoming and outgoing. One side of the bridge connects to the
    cable TV. The other side connects to your computer through your Ethernet NIC with
    a Category 5 crossover cable; you can also connect through a network switch or
    hub (LAN). If your modem is the bridge type — we believe that the cable industry
    in the United States mostly uses that system — it doesn''t require any configuration.


    # Setting up Internet protocols


    You don''t have to configure your DOCSIS cable modem for it to work. What you
    do need to do, however, is register your modem''s Ethernet address with your ICP
    and tell your Fedora Core computer how to connect to the modem. Cable modems typically
    connect to your computer via an Ethernet network interface. Therefore, you need
    to connect the cable modem to your computer using an Ethernet-based network.


    ![](img/85ec3de0d5219d6ca14d5778e16a3338_97_0.png)'
  merge: -1
