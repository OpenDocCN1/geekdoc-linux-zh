    A typical release of AMANDA is a gzip compressed tar file, which can easily be
    downloaded and installed. After downloading, you must read the README, docs/INSTALL,
    and doacs/SYSTEM.NOTES files to get the latest information on how to set up AMANDA.


    You also might require several other packages for installing AMANDA. You should
    locate and install the packages listed in Table 13-7.'
