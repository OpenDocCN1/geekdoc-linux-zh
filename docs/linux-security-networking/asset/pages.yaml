    # Configuring AMANDA


    After installing, you need to configure AMANDA for use. The first thing you should
    decide is which machine will be used as the tape server. If you want to perform
    server compression, the tape server machine should be able to take that load.
    The machine should have a direct access to a tape device that supports media with
    enough capacity to handle the unexpected load.


    You should first estimate the size of the backups based on the total disk usage
    and the frequency of full dumps to calculate the tape capacity. AMANDA must be
    configured with non-rewinding tape devices.


    You can establish a link between AMANDA and the tape device group using one of
    these methods:


    +   Make the AMANDA user a member of the group owning the tape devices.


    +   Create a new group for AMANDA users. The ownership of the tape devices should
    be passed to this group.


    As stated earlier, you can choose to use software compression on the client or
    the tape server. Alternatively, you can choose to compress dump images on the
    tape device hardware. Software compression allows AMANDA to track usage and make
    better estimates of image sizes. However, hardware compression is more efficient
    than CPU resources.


    If possible, you should allocate some holding disk space for AMANDA on the tape
    server. The holding disk space allows AMANDA to take several dumps at'
  merge: -1
  img_proc: true
- pgno: 450
  md: '# BACKUP TOOLS Chapter 13 423


    the same time when the tape is being written. This reduces the backup time by
    a great deal. For efficient backup, there should be enough holding disk space
    for two large dump images so that, while one image is being dumped on the holding
    disk, the other can be dumped on the tape.


    There are three user-editable files that control the behavior of Amanda and are
    stored in a config directory /var/Amanda/etc/Amanda. These include:


    +   * amanda.conf. This is the main configuration file. It contains parameters
    customize Amanda for your site.


    +   * disklist. This file lists hosts and disk partitions to back up.


    +   * tapelist. This file lists the tapes that are currently active.


    amanda.conf file has a number of parameters that control the behavior of AMANDA
    programs. All of these parameters have default values. You can change these default
    values if they are not suitable. Some of the parameters that you might need to
    change are listed in Table 13-9.


    # Table 13-9 Parameters in the amanda.conf File


    | Parameter | Description |

    |---|---|

    | org | This parameter specifies the subject line text of AMANDA e-mail reports.
    |

    | mailto | This parameter specifies the recipients of the AMANDA reports that
    are sent through e-mail. |

    | dumpcycle | This parameter specifies the days after which full backup is to
    be made. |

    | runperscycle | This parameter specifies the number of times AMNDA is to be run
    in the dump cycle. |

    | tapecycle | This parameter determines the tape cycle. |

    | runtapes | This parameter specifies the number of tapes to run per run. The
    value that you specify here should be one more than the number of runs during
    dumpcycle. |

    | dumpuser | This parameter specifies the username that''ll be used by AMANDA
    to run backups. |

    | tapetype | This parameter specifies the tape media type. |

    | netusage | This parameter is used to specify the network bandwidth allocated
    to AMANDA. |

    | labelstr | This parameter specifies the expression format to be used to label
    tapes. |'
