- pgno: 375
  md: '# SpiderMap


    Spidermap is a collection of perl scripts. Spidermap provides you with a set of
    tools for scanning networks. The tools have features such as custom packet rates
    and scan types for each network with increased efficiency.


    # Components


    There are three major components of the SpiderMap toolkit:


    +   - Breakdown

    - Spidermap

    - nlogdb


    # Breakdown


    This script takes a list of IP addresses as input and then prompts the user for
    specific information about each network. This allows scans to be predefined for
    specific tasks.


    # SpiderMap


    This script reads in a configuration file generated by breakdown, performs the
    scans, and dumps the raw output to a file for use by the createdb script.


    # nlogdb


    The nlogdb script reads in the nmap output from spidermap and copies it to the
    Nlog file. Nlog is a log file that can be used for various purposes, such as scheduled
    network analysis and providing input for another set of tools.


    # Firewall


    Firewall is a network-auditing tool. This tool determines the transport protocols
    that a specific gateway will let through. Firewall sends out TCP or UDP packets
    with an IP Time-To-Live (TTL) greater than the targeted gateway. If the gateway
    allows the traffic, it will forward the packets to the next hop. In the next hop,
    the packets will expire and the “TTL exceeded in transit” message is sent. If
    the gateway does not allow the traffic, it will drop the packets. You can determine
    the access list on the gateway by sending and recording packets.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# FIREWALLS Chapter 10 349


    Firewalk has two phases:


    +   * A network discovery phase

    * A scanning phase


    In the network discovery phase, the IP TTL is obtained. To get the correct TTL,
    you need to determine the hop counts. You do this by sending out packets with
    incremented TTLs towards the destination host. After determining the gateway hop
    count, you can move to the next phase: the scanning phase.


    In the scanning phase, Firewalk sends out TCP or UDP packets and sets a time-out.
    If it receives a response before the timer expires, the port is considered open.
    If no response is received, the port is considered closed.


    Although scanning is necessary to detect intrusion, you need to protect your network
    from the external threats. Scanning is of no use until you take action to safeguard
    your networks. Exposing your network to the outside world will certainly encourage
    hackers to attack your network. One way to prevent external users from accessing
    your internal resources is to use firewalls.


    # Firewalls


    A firewall is a set of related programs located at a network gateway server that
    protects the resources of a private network from the outside world. For example,
    an enterprise with an intranet that allows its employees to access the Internet
    can install a firewall to prevent outsiders from accessing its internal resources.
    Firewalls also control the outside resources that a user within the network can
    access.


    The most basic operation in the firewall technology is packet filtering. Routers
    can be configured to examine and filter the incoming packets to the network. The
    packets can be filtered based on various criteria, such as IP addresses or subnets,
    particular TCP or UDP port numbers, or combinations of these properties.


    IP packet filtering is designed to do three things:


    +   * IP Filtering. This involves consulting a set of rules to determine whether
    to pass each IP packet. Undesirable or potentially unsafe packets can be blocked.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# Chapter 10 LINUX NETWORK DEFENSE AND INTRUSION DETECTION


    +   - Network Address. This involves assigning new IP addresses according to mapping
    rules and translating IP packets between old and new addresses. This can be useful
    in an environment with a large number of hosts.


    +   - IP Accounting. This involves recording the number of input and output bytes.


    There are rules that determine the entry and exit of packets from a network through
    a firewall. These rules are designed to check the packet headers of the packets.
    A collection of rules is called a chain. Normally, checks during the packet filtering
    are performed based on the rules in the chains. There are three basic chains:


    +   - Input chain. The rules in this chain are used to perform checks on the incoming
    packets.


    +   - Output chain. The rules in this chain are used to perform checks on the
    outgoing packets.


    +   - Forward chain. The rules in this chain are used to perform checks on the
    packets that are meant for another computer.


    Two firewall subsystems available with Linux are ipchains and IPTables. These
    are discussed in detail in the next few sections.


    # ipchains


    You can use ipchains to set up, maintain, and inspect IP firewalls rules specified
    in the Linux kernel. These rules can be divided into four different categories:


    +   - The IP input chain

    - The IP output chain

    - The IP forwarding chain

    - The user defined chains


    For each of these categories, a separate table of rules is maintained.

    The syntaxes for using the ipchains command are as follows:


    ```

    ipchains [-ADC] chain rule-specification [options]

    ipchains [-RI] chain rulenem rule-specification [options]

    ipchains -O chain rulenum [options]

    ipchains -L[LFZK] [chain] [options]

    ```'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# FIREWALLS Chapter 10 351


    ```

    ipchains -P chain target [options]

    ipchains -M [ -L | -S ] [options]

    ```


    A firewall rule specifies criteria for a packet to pass through. If the packet
    does not match, the next rule in the chain is examined. If the packet matches
    the rule, the next rule is specified by the value of the target. The value of
    the target can be the name of a user-defined chain or one of these special values:


    +   - ACCEPT. This value lets the packet pass through.

    - DENY. This value drops the packet.

    - REJECT. This value is same as the DENY value. However, it is easier to debug
    because an ICMP message is sent back to the sender indicating that the packet
    was dropped

    - MASQ. This value is applicable only for the forward and user defined chains.
    MASQ can only be used when the kernel is compiled with CONFIG_IP_MASQUERADE defined.

    - REDIRECT. This value is applicable to the chains. It can be used only when the
    Linux kernel is compiled with CONFIG_IP_TRANSPARENT_PROXY defined.

    - RETURN. This value is the target value of a rule.


    Some of the options that you can use with the ipchains program are as follows:


    +   - A. This option is used to append rules at the end of the selected chain.
    A rule is added for each address combination when the source and/or destination
    names resolve to more than one address.

    - D. This option is used to delete rules from a chain.

    - R. This option is used to replace a rule in a chain. The command will fail if
    the source and/or destination names resolve to multiple addresses.

    - I. Insert one or more rules in the selected chain.

    - L. This option is used to list the rules in a chain.

    - F. This option is used to delete rules in a chain.'
  merge: -1
  img_proc: true
