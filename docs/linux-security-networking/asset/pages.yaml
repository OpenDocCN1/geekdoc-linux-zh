    # 2. The SSH protocol consists of three layers:


    +   Transport Layer. This layer provides server authentication, data confidentiality,
    and integrity. SSH transport layer provides various services, including encryption,
    host authentication, and data integrity protection.


    +   User Authentication Layer. This layer runs over Transport layer protocol and
    authenticates a client to a server. SSH user authentication protocol relies on
    the transport layer for data integrity. It also assumes that the transport protocol
    has already authenticated a server machine, established an encrypted communication
    channel, and computed a unique session identifier for that session. It supports
    different authentication modes.


    +   Connection Layer. This layer runs over the user authentication layer. The
    connection layer allows opening secure channels over a single SSH connection.
    These channels may be used for a wide variety of services, such as transparent
    tunneling of existing protocols and new ones. It provides interactive login sessions,
    remote execution of commands, forwarded TCP/IP connections, and forwarded X11
    connections.'
