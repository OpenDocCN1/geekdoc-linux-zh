  md: '# GENERAL ADMINISTRATION


    # Chapter 4 107


    # Daemon Control


    In Greek mythology, daemon means supernatural being. In Linux, daemons are invisible
    programs that run in the background. A daemon is not attached to any terminal,
    because no output on the screen is expected from it. The common functions of daemons
    are to do the following:


    +   Serve other client programs

    Publish information as required by other programs

    Assist other programs in accessing a resource on the computer

    Enable two individual programs to communicate with each other


    A user might never need to know about a daemon. But, for an administrator, knowledge
    of daemons is critical.


    Daemons can be invoked by using any of the following methods:


    +   re script at boot time

    init method at boot time\inetd daemon

    tcpd


    Daemons are usually associated with a network port. A network port is an isolated
    channel through which a particular daemon sends or receives information. For example,
    an http daemon will have the port 80 attached to it. Therefore, if an http server
    is attached to port 80, and a domain, for example, www.abc.com is hosted on it,
    typing: http://www.abc.com or http://www.abc.com:80 would display the same output
    in the Web browser.


    Some default ports have been assigned to various daemons, as given here:


    +   HTTP to port 80

    Post office protocol (POP) to port 110

    Simple Mail Transfer Protocol (SMTP) to port 25

    File Transfer Protocol (FTP) to port 21

    Telnet to port 23


    The /etc/service file should contain information about the ports and daemons on
    your system.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Chapter 4 LINUX ADMINISTRATION


    The purpose of a daemon is to serve the system while working in the background.
    A mechanism exists that allows daemons to start and shut down without human intervention.
    This is accomplished by the inetd daemon, which is a special daemon that monitors
    the ports of a computer. The inetd daemon invokes the appropriate daemon, according
    to the schedule. The /etc/inetd file has information about all the daemons that
    are under the control of inetd.


    You can set new daemons to work under inetd by adding the appropriate fields in
    /etc/inetd. The file has seven fields to configure various aspects of the daemon:


    +   **Service.** This is the name of the daemon. This name should also be listed
    in the list of services, defined in /etc/services file.

    * **Socket_type.** This can be one of the following values:

    dgram, raw, raw, and seqpacket.

    * **Protocol.** This specifies the protocol the daemon will use. All available
    protocols are listed in /etc/protocols.

    * **Wait/nowait.** This field is either wait or nowait. This field is used for
    the datagram sockets only. If a datagram server frees the datagram socket after
    connecting to a peer, the nowait value is used. The nowait value indicates that
    the socket is free to receive messages. The wait value is used for the datagram
    servers that process all incoming datagrams on the socket.

    * **User.** This field specifies the username under which this daemon will run.
    Each daemon is associated with a user name. The access permissions also applies
    to the daemon.

    * **Program.** This is the name of the executable file of the daemon.

    * **Argument.** This contains the command line arguments that are passed to the
    server when the command is executed.


    There are many daemons available in standard Linux distributions. Descriptions
    some of the important daemons are given here:


    +   * **fingerd.** This daemon maintains information that can be retrieved using
    the finger command.

    * **gated.** This daemon provides services for routing protocols.

    * **gdc.** This daemon controls the gated daemon.

    * **syslogd.** This daemon maintains a log for the system.'
  merge: -1
  img_proc: true
