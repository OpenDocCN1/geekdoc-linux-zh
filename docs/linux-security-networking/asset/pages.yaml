    # AMANDA


    Advanced Maryland Automated Network Disk Archiver (AMANDA) is a

    client/server based backup program with support for most UNIX and

    Windows hosts. AMANDA allows you to set up a single master backup server to

    back up multiple hosts to a single backup drive. AMANDA is usually used with

    tape drives. It can also be used with an optical or CD-ROM drive.


    AMANDA instructs each client backup program to write to standard output,

    which is collected and transmitted to the tape server. This allows AMANDA to\add
    compression and encryption to the data. Multiple clients are simultaneously

    backed up to files in one or more areas on the disk. A separate process writes
    this

    data to the tape for maximum throughput.


    AMANDA supports a variety of tape storage devices. It also supports several tape

    chargers, backers, and robots to prevent unattended operation. Clients that go

    go into a hang during backup are noted and bypassed. If errors occur on the tape,

    backups are still performed, but only to the holding disks. After the errors are

    handled, the backup can be transferred to the tape.


    AMANDA supports both hardware and software compression. Software com-

    pression can be performed by either the tape server or the client server. Software

    compression on the client side reduces network traffic and on the server side

    reduces the client CPU load. If the backup files need to be kept in an encrypted

    format, clients can use Kerberos for authentication. Using Kerberos, dump images

    al also be encrypted. If Kerberos is not available, amandah authentication

    c be used, which is similar to .hosts authentication, or AMANDA can be

    configured to use .hosts. AMANDA is compatible with security tools such as

    TCP Wrappers and firewalls.


    Because AMANDA uses standard tools to create dump images and software

    compression, normal UNIX tools—such as mt, dd, and gzip—can be used to

    recover a dump image in case AMANDA software is not available. If AMANDA

    is available, it first locates the tapes needed on the tape server and then locates
    thendump images on the tapes.'
