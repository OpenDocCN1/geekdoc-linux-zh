    # # Snort


    Snort is a network intrusion detection system developed by Martin Roesch. Snort
    can be used to notify an administrator of an intrusion attempt. Snort is easy
    to use and there are many command line options available. Snort can be configured
    in three main sections:


    +   * Sniffer

    * Packet logger

    * Network intrusion detection


    # # Sniffer Mode


    Sniffer reads the packets off the network and displays them on the console. The
    following command is used to print the TCP/IP headers:


    ```

    ./snort -v

    ```


    The preceding command will run Snort and display only the IP and TCP/UDP/ICMP
    headers. If you also need to see the application data in transit, execute the
    following command:


    ```

    ./snort -vd

    ```


    The preceding command displays the packet data as well as the headers. If you
    need to obtain more information, such as the data link layer headers, execute
    the following command:


    ```

    ./snort -vde

    ```


    # # Packet Logger Mode


    Packet logger mode is used to log the packets to a log file. To log the packets,
    you need to specify a logging directory, and Snort will automatically switch to
    the packet logger mode:


    ```

    ./snort -dev -1 ./log

    ```'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# NETWORK SECURITY TOOLS Chapter 10 345


    The preceding command assumes that you have a directory named log in the current
    directory. If the specified directory does not exist, Snort exits with an error
    message. In this mode, Snort collects and places the packets in a directory hierarchy.


    If you are on a high-speed network or you want to log the packets into a more
    compact form for later analysis, you should log it in binary mode:


    ```

    /snort -l /log -b

    ```


    In binary mode, the entire packet is logged, not only sections of it. Therefore,
    when in binary mode, you need not run in verbose mode or specify the -d or e switches.
    To Snort into logger mode, you need only to specify a logging directory at the
    command line. The default output format is plain ASCII text. However, you can
    specify a different output format with the -b option.


    Sniffers that support the tcpdump binary format can be used to read binary file
    packets. Two such sniffers are tcpdump and Ethereal. You also can use Snort to
    read packets. To read packets, you need to put Snort in playback mode by using
    the -r switch.


    # Network Intrusion Detection Mode


    Network intrusion detection mode allows Snort to analyze network traffic for matches
    against a user-defined rule set and perform actions. To enable Network Intrusion
    Detection System (NIDS), execute the following command:


    ```

    /snort -dev -l /log -h 172.17.1.0/24 -c snort.conf

    ```


    Here, snort.conf is the name of the rules file. Doing this will apply the rules
    specified in the snort.conf file to the packets. The rules in the snort.conf file
    are used to determine the action to be taken on the packets. If no output directory
    is specified, the default is taken as /var/log/snort.


    If you are using Snort as your Intrusion Detection tool, you shouldn''t use the
    -v option. This decreases the speed of the system.


    The data link headers need not to be recorded for most applications. Therefore,
    it is also not necessary to specify the -e switch.'
