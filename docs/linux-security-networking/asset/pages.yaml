- pgno: 217
  md: 'Vulnerabilities on the Internet can put governments, businesses, and individual
    users at risk. No one could have imagined that the Internet would grow to become
    the huge, complex, and dynamic structure of interconnected networks that it is
    today. The Internet has clear boundaries and no central command control.


    When the Internet was designed, security was not the main concern. The aim of
    the Internet was to be an open-ended system with distributed control and responsibility.
    Further, users on the Internet were expected to have mutual trust.


    Security issues are still not well understood and are not given high priority
    by software developers, network managers, or even end users. Therefore, to ensure
    the integrity, availability, and privacy of information, especially on the Internet.


    In addition, the Internet is virtual, not physical. This means that it has no
    geographic status, location, or well-defined boundaries. Conventional rules of
    physical security are impossible to apply on the Internet. Instead, new technologies
    and innovative thinking are required to understand the working and the vulnerabilities
    of the Internet.


    With the development of security services, intruders also are becoming organized.
    Intruders discover vulnerabilities within weeks of the release of software. Moreover,
    intruders prefer to use the open-architecture approach. Highly sophisticated and
    user-friendly intruder tools are being developed and distributed over the Internet.
    Even though a user might simply download these tools to experiment with hacking,
    he or she could inadvertently fall into a trap and become a victim of an attack.


    The Internet is growing at a very rapid pace. Networks have become interconnected
    and the intrusion tools have become advanced, which means that the security of
    your machine depends more on the security of other computers than on your own.


    To begin with this chapter, I give an overview of network attacks, different kinds
    of attackers, possible motives of attacks, possible vulnerabilities, and basic
    measures to avoid network attacks. Proceeding further, I discuss various types
    of attacks in detail.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# DEFINITION OF AN ATTACK


    Chapter 7 191


    # Definition of an Attack


    An attack is an attempt to do one of the following on a known or unknown net-work
    or server:


    +   - Undermine or adversely affect performance

    - Retrieve secret information

    - Destroy or replace information

    - Illegally use user from accessing resources

    - Restrict or prevent a legitimate user from accessing resources


    The moment a computer on your network is connected to the Internet, it opens a
    window to your local network that all users on the Internet can peer through.
    Most visitors to your network will not be interested in window-shopping. How-ever,
    a few visitors might view data that you do not intend to make avail-able for public
    use. Some visitors, who experiment just for the satisfaction, might attempt to
    force the window open and sneak in. The results of this "sneaking" can range from
    more embarrassment to serious data loss for an organization. For example, you
    might discover one fine morning that the content of all Web sites on your server
    has been replaced with obscene messages. Another serious loss can be a case in
    which your server has been unreachable for the last 12 hours or more, and all
    your confidential data has been stolen and wiped off your system.


    Even the threats mentioned here have been around for some time, there is no software
    available that is invulnerable to all attacks. The maxim is that every software
    product has bugs or security holes. Some of them have been discovered and exploited.
    The rest are waiting to be discovered. Internet development cannot stop out of
    fear of network attacks, however. Services also be denied to legitimate users
    fearing a security threat.


    The sole aim of having network security is to provide to a controlled method of
    access-ing your network. Drawing the line between controlled access and uncontrolled
    access can be difficult. For example, a poorly configured Ping Server Internet
    Control Message Protocol (ICMP) can compromise even a very carefully planned firewall
    security system. Similarly, a poorly configured firewall system can make a Web
    server impossible to use.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Chapter 7 NETWORK ATTACKS


    An attack can be launched from anywhere at any time. Your information can be attacked
    when data is about to be dispatched, when data is being transmitted, when data
    is being received. Therefore, end users as well as administrators need to take
    precautions against network attacks.


    # Who Is an Attacker?


    As already discussed in earlier chapters, a typical computer network has three
    types of users: administrators, normal users, and outsiders. Following is a description
    of each of these users:


    +   Administrators. An administrator of a network or a computer is a user who
    has the maximum authority to access or modify the network or the computer. The
    administrator has access to all the resources of the computer and the network.
    An administrator creates users, applies security updates, and determines security
    policies for the network. The administrator is also responsible for ensuring that
    nothing goes wrong on the network and can access it at all times. This means that
    the administrator does not need to attack his network. Instead, attackers would
    be normal users or outsiders who are trying to become the administrators of the
    network.


    +   Normal users. A normal user is any user who has been provided a username-
    and a password and has the authority to log on to a server or a network. This
    type of user generally has limited access permissions to the server. For example,
    permissions for disk space in the user''s home directory, FTP access to e-mail,
    access to Telnet, SSH, and so on are restricted. Permissions granted to a normal
    user depend on the security of a particular network.


    +   Outsiders. An outsider is a person who is unknown to the server or the network
    and does not have permissions to log on the server or the network. Similarly,
    access to services such as Anonymous FTP, open relay SMTP, ICMP, and HTTP also
    are provided to an outsider. The degree of access provided to these services varies
    in each network.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# MOTIVES BEHIND AN ATTACK


    Chapter 7 193


    # Motives behind an Attack


    You can never quite determine the exact motive of an attack. However, there are
    a few common reasons for an attack, which are discussed below:


    +   * Undermine or adversely affect the performance of a computer. A personal
    grudge, an inadvertent mistake, or frustration can provoke an attacker to unleash
    an attack on your system. A few examples of attacks that adversely affect the
    performance of a server is flooding, spamming, and Distributed Denial of Service
    (DoS) attack. “External Attacks,” later in this chapter.


    +   * Retrieve secret information. In such attacks, the attacker wants some confidential
    information that might be available on your computer. Such attacks are generally
    dictionary- or word list-based password or brute force attacks. More information
    on these attacks can be found in the “Password Attacks” section.


    +   * Destroy or replace information. An attacker who fails to retrieve information
    from your network might just destroy whatever information is available. The attacker
    might launch a password attack or exploit the known vulnerabilities in a program
    installed on your computer.


    +   * Illegitimately using resources. An attacker trying to send email messages
    might randomly use your SMTP server to relay them email messages. Or he may run
    a program on your computer to collect data from the Internet, process it, and
    send it to some other location.


    +   * Restrict a legitimate user from accessing resources. In these attacks, the
    attacker targets your computer and deploys Trojans on your system. These Trojans
    might disallow users from accessing resources on their computers.


    # Types of Attacks


    A network can be attacked from within or without. These are referred to internal
    and external attacks, respectively. In this section, I describe both types of
    attacks in detail.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Chapter 7 NETWORK ATTACKS


    # Internal Attacks


    Internal attacks are generally initiated from within a server or a network. They
    may be used to reduce the performance of a server or gain unsolicited access to
    a network or a server. Examples of such attacks are password file brute forcing
    and Trojan attacks. Let''s examine some of these attacks in detail.


    # Trojans


    The Trojan legacy dates back to a Greek myth of a wooden horse in which a dangerous
    army was inside what appeared to be a magnificent gift. Trojans behave in a similar
    manner. In layman terms, Trojans are malicious programs that appear to be nice
    utilities or games but have a malicious intent. For example, an executable cartoon
    file that you download to show your child might contain a program to destroy all
    the data on your disk.


    A Trojan is harmless if it''s stored on your disk but isn''t accessible for execution.
    However, a problem arises when you run a Trojan. A Trojan, when executed, might
    display nothing and return you to the prompt or display a confusing error message.
    If the program is really a Trojan, you could be in trouble. A powerful Trojan
    could give more control to a hacker than the administrator. Trojans could run
    in the background just like a daemon. Unlike the daemon, however, the Trojan will
    serve the attacker instead of the administrator.


    The more severe impact of Trojans is that Trojans facilitate hackers who wouldn''t
    have bothered to peek into your system. There are numerous programs available
    on the Internet that search Trojan-infected servers. Any person with such a scanner
    can make the fullest use of Trojans.


    It doesn''t take a mastermind hacker to get into a Trojan-infected computer. People
    who are likely to break into your computer using Trojans aren''t nuclear scientists
    or hardened cyber criminals. Usually, they are enthusiasts who thinking hacking
    a computer is an achievement to display their might. Many such hackers have just
    a little more knowledge than the administrator of the hacked server. Firstly,
    the hacker knows that the system is infected, and secondly, the hacker knows how
    to use the Trojan!


    Single-user operating systems have been threatened by Trojans for a long time.
    In a multi-user environment like Linux, however, the damage can be significantly
    contained if proper precautions are taken.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# TYPES OF ATTACKS


    Chapter 7 195


    # CAUTION


    All administrators should remember this: " Never run an unknown executable as
    root.

    To go a step further, never log on as root unless you need to for a specific purpose.


    Having talked about Trojan attacks, I will now discuss the types of Trojans;

    namely Remote Access Tools (RAT), Password Retrievers, Key loggers, and Tro-

    jans based on known protocols.


    # Remote Access Tools


    A RAT (Remote Access Tools) Trojan runs a daemon-like service on your com-

    puter. The daemon enables the attacker to connect to your computer and execute

    any command on your system. Even when you scan the services running on

    server, the Trojan would probably be listed with a description, such as "required
    by

    Linux kernel," so that a novice administrator would never turn it off.


    Most Trojans are not self-propagating. Therefore, unless you run a program with

    incorrect permissions, a Trojan won''t cause trouble. When you run the program,

    however you automatically trigger the Trojan. The Trojan would copy itself at
    a

    safe location, rename itself, and add itself in the middle of the

    /etc/services file.


    Every RAT Trojan runs on a particular port (like a daemon). Therefore, by search-

    ing for a specific open port, a Trojan scanner can find the presence of a RAT
    Tro-

    jan. As a result, Trojan scanners can help systems administrators find the presence

    of Trojans on their computers.


    # Password Retrievers


    Passwords retrievers are Trojans that run in the background and illegally hog
    sys-

    tem resources by trying to recover passwords for user accounts that are installed

    with Linux. Such Trojans are easier to detect because they show up as a lot of

    activity in various log files and the running process list.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Key Loggers


    Key loggers are also daemons that record every incoming character. These logs
    can be sent by e-mail or published to attackers. Key loggers don''t simply record
    the data typed on the console. Powerful Trojans may log even those characters
    that were typed on Telnet terminals, VNC sessions, rlogin sessions, and so on.


    In addition to logging commands and typed characters, a key logger can log all
    content read, written, or displayed during a user''s session. For example, key
    loggers can log the output of the following line:


    ```

    cat /etc/passwd

    ```


    The preceding command could facilitate an active Trojan to log the contents of
    the entire passwd file and inform a hacker about the accounts that are not shadowed.
    These accounts can later be brute forced to recover original passwords and gain
    access to the server. I discuss password-retrieving attacks later in this chapter,
    in the section "Password Attacks."


    # Trojans Based on Known Protocols


    Trojans based on known protocols are not very difficult to detect but can cause
    serious damage. Such Trojans will install themselves as though they are known
    services. For example, a Telnet-based Trojan can delete your currently installed
    Telnet server and redefine all links to itself. The Trojan also will retain the
    name of the service as "Telnet Server" to avoid detection. In addition, the Trojan
    can hook port 23, which is the default port for Telnet. Whenever a user tries
