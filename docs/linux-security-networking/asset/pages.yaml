    # The DefaultType Directive


    A client may request a document whose MIME type is not recognized by the server.
    In such a case, the server responds to the request by using a default MIME type.
    The DefaultType directive specifies the default MIME type that is used by the
    Web server.


    ```

    # DefaultType is the default MIME type the server will use for a document

    # if it cannot otherwise determine one, as from filename extensions.

    # If your server contains mostly text or HTML documents, "text/plain"

    # a good value. If most of your content is binary, such as applications

    # or images, you may want to use "application/octet-stream" instead of

    # keep browsers from trying to display binary files as though they are

    # text.

    ```


    ```

    DefaultType text/plain

    ```


    This extract indicates that the DefaultType directive is assigned the value text/plain.
    This means that the default MIME type used by the server is plain text.


    # The HostnameLookups Directive


    This directive is responsible for specifying whether DNS lookups should be enabled.
    DNS lookups are used to log the names of clients. Enabling this option can slow
    down the server considerably, however, because every client request initiates
    a lookup request to the DNS server. As a result, HostNameLookups is disabled by
    default.


    ```

    # HostnameLookups: Log the names of clients or just their IP addresses

    # e.g., www.apache.org (on) or 204.62.129.132 (off).

    # The default is off because it''d be overall better for the net if people

    # had to knowingly turn this feature on, since enabling it means that

    # each client request will result in AT LEAST, one lookup request to the

    # nameserver.

    ```


    ```

    HostnameLookups Off

    ```'
