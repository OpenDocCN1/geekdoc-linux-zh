    file system. All directives specified in <Directory> and </Directory> will only
    apply to the root directory.


    Within the <Directory> and </Directory> directives, two more directives named
    Options and AllowOverride are specified. The Options directive is used to specify
    features that will be available for the specified directory. When the Options
    directive is set to the FollowSymlinks value, it indicates that the server will
    follow the symbolic links in the specified directory.


    The AllowOverride directive is used to specify which options specified in the
    .htaccess file can be overridden. The .htaccess file is used for specifying rights
    and authentication services to users. When the value for the AllowOverride directive
    is set to None, all .htaccess files are ignored.


