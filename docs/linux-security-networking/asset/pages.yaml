- pgno: 151
  md: '# Super


    Super is a tool that can be used to give users and groups varied levels of access
    for system administration. In addition to giving access to users, you can specify
    access time and the level of access to scripts. The access level you give is critical.
    for example, giving setuid access to ordinary commands could create unexpected
    consequences. Debian with super, and there are rms available in the contrib directory.
    This is a powerful tool, but it requires a significant amount of effort to be
    implemented properly. The primary distribution site for super is ftp://ftp.ucolick.org/pub/users/will/


    # Remote Administration


    An administrator who manages only one server can afford to use the local administration
    tools alone, but a network administrator who has to manage many client computers
    and other hosts on a network cannot do without administration tools. You might
    need to remotely manage your Linux computer and other hosts of your network. Remote
    administration tools even allow an administrator to see the remote computer''s
    desktop in a virtual window. There are many tools and utilities available to assist
    you in maintaining your system from a remote location. I discuss the following
    remote administration tools in this section:


    +   * VNC

    * Webmin

    * cfengine


    # VNC


    Virtual Network Computing (VNC) is a remote display system that enables you to
    view a computing desktop environment—not only on the computer where it is running,
    but also from a remote location.


    Users use a VNC viewer to view Linux environments that are running on different
    computers. The computer running the Linux environment can be at a remote location.
    Some of the features of VNC are listed here:


    +   * State is not stored at the VNC viewer. This means that you can shift to
    VNC viewers on different computers, reconnect to your desktop, and complete the
    task you were performing. All the information about the tasks that you were performing
    will be intact.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# REMOTE ADMINISTRATION Chapter 4 125


    +   - VNC is a small and simple utility. It''s about 150KB in size and can be
    stored and run from a floppy disk.


    +   - No installation is needed.


    +   - It is platform-independent. The VNC protocol is portable to any platform.


    +   - VNC is shareable. Many VNC viewers can share a desktop.


    +   - It is free. It is distributed under the terms of GNU Public License.


    The VNC protocol is used to connect the VNC viewer and server. This is a protocol
    for remote access to GUIs. The VNC protocol is based on the remote framebuffer
    (RFB) model. Therefore, the framebuffer is updated on the VNC viewer. It is supported
    by almost all operating systems and applications.


    VNC protocol has been designed to make very few demands from clients. It can be
    used with a variety of hardware. The implementation of the VNC clients has been
    simplified.


    You can run Xnc servers for various users at a time. Each user is represented
    by a VNC desktop. These desktops resemble an X display. In X display, there''s
    a root window containing several X applications.


    # Connection Setup and Shutdown


    When a connection between the VNC client and VNC server is established, the server
    requests authentication from the client using a challenge-response scheme. In
    the challenge-response scheme, users are prompted for a password. The password
    provided by the user is verified and the server and client start exchanging information.
    The connection between the server and the client is stateless.


    The VNC protocol uses port 59xx, where xx is the display number of the server.
    For example, a VNC server running on a computer with display number 1 will use
    the port 5911 for listening to the clients. You can also configure VNC server
    as running on your local host. This can be done by configuring the port number,
    which the server uses to listen to the client, on the remote server.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Securing VNC


    As discussed in the preceding section, VNC uses a challenge-response system to
    provide secure user authentication. The password is not sent over the network
    for authentication. Once the connection is established, however, the communication
    between the viewer and server is unencrypted. Therefore, any unauthorized user
    can easily gain access to the data being exchanged. To ensure security, you should
    tunnel the VNC protocol through a secure channel, such as SSH.


    SSH encrypts the data that is being transferred by the public key encryption.
    SSH is freely available for the Linux platform. It provides you a secure shell
    that displays a login window to a remote computer.


    # Compression


    In addition to securing VNC, SSH can compress the data that is sent between the
    VNC server and the VNC client. This is particularly useful if the link between
    your computer and the server is slow. It can be helpful on a fast link where encryption
    happens. The encryption process takes some time, and it can slow down the link.
    Therefore, using SSH can help make the time that is spent in encryption.


    # Webmin


    Webmin is a Linux administration tool that provides you a Web-based interface
    for performing the administrative tasks. It provides access to the administrative
    modules that are responsible for the maintenance and running of your Linux computer.


    Beginners appreciate Webmin because it can manage almost all administrative tasks
    from a single location. You do not have to memorize or write down executable commands
    with numerous options and long file paths.


    # Installation


    Webmin is a collection of CGI scripts. By default, Webmin is run on port number
    1000. However, you can specify another port number during installation. Webmin
    supports distributions such as Red Hat, Solaris, Debian, SCO, and Mac OS X.


    Every service or program on your Linux computer is connected through a set of
    modules. If the application you want to control from Webmin is not supported,
    you can build a new module for that application.'
  merge: -1
  img_proc: true
