- pgno: 76
  md: '# INSTALLING RED HAT LINUX Chapter 3 49


    # SuSE


    SuSE Linux is one of the world''s leading providers of complete solutions based
    on Linux. SuSE also provides Linux deployment solutions.


    SuSE provides a wide range of consultation, technical, and other services to its
    customers. It has the largest open-source solutions development team.


    Now that you are familiar with the different types of Linux distributions, I''ll
    discuss the installation of Red Hat Linux using various installation media.


    # Installing Red Hat Linux


    In this section, you''ll look at the various media you can use to install Red
    Hat Linux. You can install Red Hat Linux by using one of the following media:


    +   - CD-ROM

    - NFS

    - Hard drive

    - FTP


    # CD-ROM Installation


    One media you can use to install Red Hat Linux distribution is CD-ROM. To install
    the Red Hat Linux installation from CD-ROM, follow these steps:


    +   1. Select the Local CD-ROM option from the list of installation types, and
    then click OK. When you are prompted for the type of drive; specify whether you
    have a SCSI, IDE/ATAPI, or proprietary CD-ROM drive.

    2. Select the SCSI card from the list that is displayed at selection of the SCSI
    drive. After you select the SCSI card, you will be asked whether you want to select
    AUTOPROP or SPECIFY OPTIONS for the SCSI card.

    3. Choose AUTOPROP. This causes the program to scan for your SCSI card and, when
    the card is found, enable the SCSI support. The installation program now locates
    the Red Hat CD-ROM and proceeds with the installation.'
