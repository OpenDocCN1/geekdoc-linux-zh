    The next section lists some signs that indicate intrusion.


    # ## General Indications of Intrusion


    Intruders usually leave behind signs of intrusion attempts that can be tracked.
    Some of the intrusion signs are listed here:


    +   * Failed logon attempts and logon attempt at unusual time and to unusual accounts.


    +   * Presence of accounts not created by the administrators.


    +   * Failed su attempts.


    +   * Modified timestamp of files and software. Unexpected change in the file
