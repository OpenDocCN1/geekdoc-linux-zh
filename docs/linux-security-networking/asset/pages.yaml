- pgno: 80
  md: '# VERIFYING PACKAGE INTEGRITIES Chapter 3 53


    access to your NFS server on an existing Red Hat Linux computer, one way to determine
    package dependencies is to telnet or log on to it and query the package for dependencies.


    The libc and termcap packages form a part of the base system of the Linux operating
    system. Therefore, you must make sure that the libc and libtermcap packages are
    present so that you can install bash. After you install the entire base system,
    you can start the system.


    # Verifying Package Integrities


    An attacker can create RPMs that appear very much like a genuine package. Finding
    the MD5 sums of the files in trusted locations is very difficult. Typically, all
    RPM distribution files are signed, which makes it easy to verify their correctness.
    Some packages are not signed, however, which makes it very easy for an unauthorized
    person to change packages at a distribution site and go unnoticed. An unauthorized
    person need not even modify or add files to the package to cause the problem.
    Instead, the person needs only to add a pre/post installation malicious script,
    which runs with root privileges and is capable of corrupting the system. Therefore,
    users must ensure that the RPMs they are downloading are signed. They must also,
    if possible, verify MD5 checksums.


    # Trojan Infected CDs/Distributions


    Anyone with a CD writer can access the public distribution Web sites of Linux
    distributions and burn installation CDs. Also, in accordance with the General
    Public License, they can make modifications in these Linux distributions and distribute
    them. On the pretext of helping you, malicious distributors may give you CDs that
    are infected with Trojans. Therefore, it is more secure to buy original distribution
    CDs or make installation CDs on your own. If you download a modified Linux distribution
    accessible on the net, keep in mind that many FTP search programs may find that
    the server has and can download files from there. It is best to only download
    from verified servers.'
