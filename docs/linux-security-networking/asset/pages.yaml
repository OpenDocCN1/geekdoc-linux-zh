    # FTP Administrative Tools


    Many tools are available to monitor your FTP servers. Here are two such administrative
    tools:


    +   - ftpwo. This tool displays all the active FTP users and their current processes.


    +   - ftpcount. This tool displays only the number of users currently logged on
    the FTP server. In addition, it also displays the maximum number of users who
    are allowed access.


    # Anonymous FTP


    The Anonymous FTP service lets anyone in the world have access to a certain area
    of disk space in a secure way. The connection process involves a remote user creating
    an FTP connection and logging on to the system. The user logs on with the username
    and usually the password is the email-id.


    # Configuring Anonymous FTP


    Setting up anonymous FTP is simple. All you need to do is install the anonftp
    RPM package. To set up the anonymous FTP, you need to install the anonftp RPM
    package. Some facts regarding the settings and configuration of Anonymous FTP
    are discussed in the next section.


    # Setting up the Anonymous FTP Directories


    The anonymous FTP root directory and its subdirectories should not be owned by
    the FTP account or be in the same group as the FTP account. If you allow the FTP
    account of any other user in the same group to own the FTP root directory or its
    subdirectory, an intruder will be able to add or modify files. The FTP account
    shouldn''t own the anonymous FTP root directory. Doing this enable the intruders
    to access the FTP server and modify the files in the root directory. You'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Chapter 9 OTHER NETWORK SERVERS


    can secure the anonymous FTP server by allowing root to own the FTP directory
    and its subdirectories. In addition, you should assign the write permission only
    to the root.


    # Using Proper Password and Group Files


    Anonymous FTP should not be allowed to use the system''s /etc/passwd file as the
    password file or the system''s /etc/group as the group file in the -ftp/etc directory.
    Doing so will enable intruders to get a copy of these files. You should consider
    using the dummy version of both the -ftp/etc/passwd and -ftp/etc/group files.
    No account name in the -ftp/etc/passwd file should be the same as those in the
    system''s /etc/passwd.


    Another risk associated with anonymous FTP is that it allows users to create directories.
    Users should not be able to automatically create a drop-off directory unless you
    have analyzed the risks involved. Many cases have been reported where these directories
    have been used to distribute pirated versions of copyrighted software or to exchange
    information regarding accounts and password files.


    This section discusses three ways to address these problems. The solutions to
    these problems are listed:


    +   * Use a modified FTP daemon


    +   * Use protected directories


    +   * Use a separate directory


    # Using Modified FTP Daemon


    If you plan to allow a drop-off service, which will enable anonymous FTP users
    to store files on the FTP server, you should use a modified FTP daemon. This modified
    FTP daemon should be able to control access to the drop-off directory. Some modifications
    that you can make to the daemon are as follows:


    +   * Implement a policy where any file dropped off can be accessed only after
    the administrator has examined it and moves it to a public directory. Only the
    administrator should be able to access the dropped off files. After verifying
    the content of the file, administrators can move these files to directories accessible
    to other users.


    +   * Limit the amount of data transferred in one session. Anonymous FTP should
    be allowed to transfer limited data only.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# ANONYMOUS FTP Chapter 9 287


    +   - Limit the overall amount of data transferred based on available disk space.

    - Ensure logging to enable earlier detection of abuses.


    Public domain sources for such modified FTP daemons are available from the following
    sites:


    +   - wuararchie.wustl.edu -ftp/packages/wuararchie-ftpd

    - ftp.uu.net -ftp/systems/unix/bsd-sources/libexec/ftpd

    - gatekeeper.dec.com -ftp/pub/DEC/gwtools/ftpd.tar.Z


    # Protected Directories


    If your site is planning to offer a drop off service and is possible to control
    access by using protected directories. The protected directories enable you to
    restrict access to the anonymous FTP users. The protected directories are more
    useful if you are providing the drop off service to the anonymous FTP users. Although
    this method cannot guarantee complete protection, it has been used effectively
    by many sites.


    You should protect the top-level directory, -ftp/incoming, by giving only execute
    permission to the anonymous user. This will permit the anonymous user to move
    to a different directory. By doing this, you can restrict the user''s view to
    the content of the directories.


    # Using a Single Disk Drive


    Consider the amount of data transferred to a single file system mounted as -ftp/incoming.
    If possible, dedicate a disk drive and mount it as -ftp/incoming. The -ftp/incoming
    directory should be monitored on a regular basis to ensure it is not misused.


    # Anonymous FTP Warnings


    Here are some precautions to take before configuring anonymous FTP:


    +   - Responsibility. You are responsible for the files that are stored on your
    domain. This includes files that were uploaded by you as well as by anonymous
    FTP users.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Chapter 9 OTHER NETWORK SERVERS


    +   - Data Transfer. All the FTP downloads will be used in the calculation of
    the total data transfer for your account. You might end up spending money if the
    transferred data exceeds the limit.


    +   - Disk Space. If you allow people to upload files to your site, you should
    keep track of the disk space usage.


    # Securing FTP


    The following list provides the measures you can use to secure your FTP server:


    +   - Ensure that you have properly configured the /etc/ftusers file. This file
    should contain the list of users who are not allowed to access the FTP server.


    +   - If you need to disable anonymous FTP, you should remove the anonymous ftp
    from the password file. In addition to this, verify that anftp-version.i386.rpm
    package is not installed on your system.


    +   - Grant upload permissions carefully. Users should not be able to upload to
    the dev, bin, etc, and lib directories. You can edit /etc/ftpaccess to modify
    the upload permissions.


    +   - Use the nonretrieve directive to deny transfer of selected files or directories.


    # Sendmail


    E-mail has become the easiest and fastest way of communication in modern times.
    On the Internet, the majority of servers run the UNIX operating system or its
    derivatives, such as BSD, Linux, and SunOS. Sendmail is the program that these
    systems use to handle e-mail. To use sendmail, you need to install the sendmail
    and sendmail-cf packages.


    Sendmail is able to route or deliver mail between a mail User Agent (UA) and a
    Message Transfer Agent (MTA). UA is a program you might use to read and send e-mails.
    MTA is a program that moves mail between hosts using a particular network protocol
    or language. Sendmail can be easily configured to accommodate new UAs and MTAs,
    with only minor configuration changes.'
  merge: -1
  img_proc: true
- pgno: 316
  md: "When a sender wants to send a message, it issues a request to sendmail. The\
    \ send-mail program operates in two distinct phases:\n\n+   - In the first phase,\
    \ It collects messages and stores them as requests from the senders.\n\n+   -\
    \ In the second phase, it delivers the messages to the recipients.\n\nIf there\
    \ are errors during processing in the second phase, sendmail creates and returns\
    \ a message. This mail provides details of the error that occurred and/or the\
    \ source of the error. When an error is encountered that can be retried, sendmail\
    \ places the message in a message queue. When an unrecoverable error is encountered,\
    \ automatic routing happens and e-mail is sent to the sender.\n\n# Configuration\
    \ Files\n\nThe sendmail program uses many configuration files. These files are\
    \ located in the /etc/mail directory. I'll discuss some of these configuration\
    \ files here:\n\n+   - Makefile. This file is used when the make command is run.\
    \ Running make might cause missing database (.db) files to be created with no\
    \ entries. The make command creates the database files. The content of Makefile\
    \ is given here:\n\n```\nall: virtustable.db access.db domaintable.db mailertable.db\n\
    .db : %\n\t@makemap hash $@ $<$\nclean:\n\t@rm -f *.db *\n```\n\n+   - helper.\
    \ This is the text file sendmail displays when you issue a HELP.\n\n+   - relay-domains.\
    \ This file specifies the domains that the computer will relay.\n\n+   - sendmail.mc.\
    \ This file contains the m4 macro preprocessor program. The m4 program is used\
    \ by sendmail to produce a sendmail configuration file. When run, this macro program\
    \ produces the sendmail.cf configuration file:\n\n```\ndivert(-1)\ndnl This is\
    \ the macro config file used to generate the /etc/sendmail.cf\n```"
  merge: -1
  img_proc: true
