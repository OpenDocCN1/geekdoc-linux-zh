- pgno: 208
  md: '# OPEN SYSTEMS INTERCONNECTION (OSI) Chapter 6 181


    determined by measuring the time taken by a packet to complete a return trip from
    the client, to the server, and back to the client.


    # Transport Layer


    The fourth layer in the OSI reference model is the transport layer. This layer
    facilitates data transfer between two systems by encapsulating the data packet
    within the network layer data packet. Two important components of the transport
    layer are TCP and the UDP protocol, which are discussed in detail in this section.


    # TCP


    TCP is a connection-oriented and reliable transport protocol. A connection-oriented
    protocol implies that two hosts, wanting to communicate with each other, must
    first establish a connection before actual data exchange can take place. In TCP,
    a connection is established using a three-way handshake. TCP assigns sequence
    numbers to every packet in each segment, and all data received is responded to
    with an acknowledgement to the sender. TCP hides perplexing network details from
    the upper layers of the IP protocol.


    # Information Fields in a TCP Packet


    A typical TCP packet contains the following six information fields along with
    actual data:


    +    Synchron Sequence Numbers (SYN). This field is valid only during the three
    steps involving the handshake. The sequence number is read by the receiving host
    and is stored as the client computer''s first sequence number. TCP sequence numbers
    are 32-bit numbers, ranging from 0 to 4,294,295(2 ^ 32). Every packet of data
    that is exchanged between two computers using a TCP connection is sequenced.


    +    Acknowledgement (ACK). This field is generally set. The acknowledgement number
    field in the TCP header contains the assumed value of the next sequence number.
    This field is also an acknowledgement of the data received in the previous packet.


    +    Reset (RST). This field informs the other computer that the connection has
    been dropped and all memory structures have been flushed.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Chapter 6 NETWORK BASICS


    +   Urgent (URG). This field informs the other computer to process data on a priority
    basis.


    +   Push (PSH). This field informs the other computer to pass the data to the
    concerned application as soon as possible instead of putting the data in the queue.
    This flag is generally set in interactive connections, such as Telnet, rlogin,
    and some other applications.


    +   Finish (FIN). This field informs the other computer that the transmission
    of data is complete, but the host is still open to accepting data.


    # User Datagram Protocol (UDP)


    The US Department of Defense (DoD) developed UDP for use with IP. Unlike TCP,
    which first tries to establish a reliable connection with the server, UDP works
    on the concept of "best-effort mechanism." However, UDP is an unreliable protocol
    for communication because of the following reasons:


    +   1. No error is generated for lost data packets.


    +   2. No error is generated for duplicate packets.


    +   3. No assurance is provided that a packet has reached the destination safely.


    In simpler terms, UDP is a one-way protocol—what is sent from the client is gone
    for good. The client will never hear any further information about this packet.


    Although some reliability is provided in UDP, the end recipients reject packets
    that are corrupted during transit. It''s the responsibility of the upper layer
    application to check such loss. In addition, because no packet acknowledgement
    is required in UDP, the network load is reduced to a certain extent.


    The packet structure of UDP is very simple, as shown in Figure 6-7.


    | 2 bytes source port | 2 bytes destination port | 2 bytes UDP length | 2 bytes
    UDP check sum | Packet data (if any) |

    |---|---|---|---|---|


    FIGURE 6-7 Structure of a UDP packet.'
