    # The UseConicalName Directive


    The canonical name is the primary name used by a Web server. However, there might
    be situations in which you want to specify more than one hostname for your Web
    server. This can be achieved by creating aliases to the existing canonical names.
    The UseConicalName directive allows you to specify whether you want to use the
    canonical name for your server.


    +   # UseCanonicalName: (new for 1.3) With this setting turned on, whenever

    # Apache needs to construct a self-referencing URL (a URL) that refers back

    # to the server the response is coming from) it will use ServerName and

    # Port to form a ''canonical'' name. With this setting off, Apache will

    # use the hostname:port that the client supplied, when possible. This

    # also affects SERVER_NAME and SERVER_PORT in CGI scripts.

    #


    UseCanonicalName On


