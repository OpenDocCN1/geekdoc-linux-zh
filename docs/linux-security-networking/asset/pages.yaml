    Customizing the list of packages for installation is an option while you are installing
    the system using FTP, NFS, and your hard drive. You can copy the files from the
    CD-ROM to the hard drive and install Linux from there with the customized package
    list. To install from an FTP or NFS server, you need to have root access to the
    servers on the network.


    You might need to perform a customized installation in some situations; for example,
    when you are installing Red Hat Linux via FTP over a low-bandwidth connection.
    To customize the installation, you need to do the following:


