  md: '# The Redirect Directive


    The Redirect directive directs the client to an alternate location. This is useful
    when you remove certain documents from the site. When this happens, the URLs that
    point to the document cease to work. To redirect the user to an alternate location,
    you need to use the old URL, as well as the new URL, with the Redirect directive.
    The entry for the Redirect directive is as follows:


    ```

    # Redirect allows you to tell clients about documents which used to exist in

    # your server''s namespace, but do not anymore. This allows you to tell the

    # clients where to look for the relocated document.

    # Format: Redirect old-URI new-URL

    ```


    # Directives used for Directory Listing


    The directives that are used for directory listing occupy a considerable amount
    of space in the httpd.conf file. You can use several directives to customize the
    directory listing on your server. The following list discusses some of them:


    +   - Indexes This directive specifies the behavior of directory indexing. The
    IndexOptions directive contains several options, which determine the behavior
    of directory indexing.

    - AddIconByEncoding This directive displays an icon next to files that are encoded.

    - AddIconByType This directive displays an icon next to files that are MIME type.

    - AddIcon This directive displays an icon next to different files, depending on
    the type of file.

    - DefaultIcon As the name suggests, the DefaultIcon directive specifies the default
    icon that is used for files whose type is not recognized.

    - AddDescription The AddDescription directive specifies that a description will
    be displayed for each file that is part of the indexed directory.

    - ReadName This directive is used to append a file to the end of the index listing.

    - HeaderName This directive specifies that a file will be added to the header
    of the indexing list.

    - IndexIgnore This directive specifies a list of files that you don''t want displayed
    with all the other files in the indexed directory.'
  merge: -1
  img_proc: true
