- pgno: 326
  md: 'good practice to check the system log for errors and warnings whenever the
    name server is started or restarted. An invalid directive or option in the daemon
    control scripts can cause errors in the name server, preventing it from starting
    or halting abruptly.


    To start the named daemon, you can use the following command:


    ```

    /etc/rc.d/init.d/named start

    ```


    Now, to restart a server in RHL, you can use the following command:


    ```

    /etc/rc.d/init.d/named reload

    ```


    To stop an already running named daemon, you can use the following command:


    ```

    /etc/rc.d/init.d/named stop

    ```


    The command to terminate BIND forcibly is as follows:


    ```

    kill -9 `cat /var/run/named.pid`

    ```


    # BIND Configuration


    BIND''s configuration file is stored as named.conf in the /etc directory. It is
    a text file that you can use to configure various aspects of BIND. BIND also comes
    with a shell script that can convert older BIND 4 configuration files to the newer
    format of BIND. This shell script is exceptionally useful while upgrading BIND
    because the format of the configuration file of BIND 4, which is named.boot, is
    entirely different from BIND 8 and above.


    # Global Options


    The Global Options section of the named.conf file allows you to configure the
    following directives:


    +   - directory. This directive defines the base directory for storing all relative
    paths specified in the named.conf.

    - pid-file. This directive stores the name of the Process ID (PID) file for the
    named service.

    - allow-query. This directive specifies the range of computers that can send DNS
    queries to a server. The directive accepts individual IPs, IP ranges, and any
    keyword as value arguments.'
  merge: -1
  img_proc: true
- pgno: 327
  md: "# 300 Chapter 9 OTHER NETWORK SERVERS\n\n+   - allow-transfer. This directive\
    \ specifies hosts that might copy the database. This option can be used to limit\
    \ zone transfers in a BIND server. The arguments are similar to those of the Allow-query\
    \ directive.\n\nAn example of the Global Options section of BIND's main configuration\
    \ file is shown in the following code:\n\n```\noptions {\n    directory      \
    \  \"/var/named\";\n    pid-file          \"/var/run/named.pid\";n    allow-query\
    \      { any };\n    allow-transfer   { 172.17.100/50 };\n}\n```\n\n+   - The\
    \ directory directive specifies that the default zone directory for BIND is /var/named.\n\
    - The pid-file directive specifies that while the named service is running, its\
    \ ProcessID should be stored in the /var/run/named.pid file.\n- The allow-query\
    \ directive specifies that any client can perform a DNS transaction with the server.\n\
    - The allow-transfer directive specifies BIND to allow DNS transfer transactions\
    \ only to the server whose IP address is in the range 172.17.100/50.\n\n# Zones\n\
    \nA zone is a subset in a domain space. This subset is maintained in a master\
    \ name server. It is advisable to have one or more slave name servers also for\
    \ backup purposes. Depending on ownership or permissions for a domain name, the\
    \ DNS master server can be configured to manage an entire domain, a domain and\
    \ all its children domains, or any portion in the domain.\n\nMaster Zones\nMaster\
    \ zones are used to generate authoritative records for queries on non-cached domain\
    \ names. The host name given in the query is matched against all configured zones.\
    \ The file directive specifies the text file that contains the particular zone's\
    \ database."
  merge: -1
  img_proc: true
- pgno: 328
  md: "An example of an entry for a master zone in BIND is shown in the following\
    \ code snippet:\n\n```\nzone \"premierpress.com\" IN {\n  type    master;\n  file\
    \    \"db.premierpress.com\";n\n};\n```\n\n# Slave Zones\n\nThe slave server,\
    \ which is the secondary server, loads the zone information from a primary server\
    \ or another slave server. This server acts as an instantly available backup solution\
    \ in case the primary name server is down or unreachable. An example of an entry\
    \ for a slave zone in BIND is shown here:\n\n```\nzone \"premierpress.com\" IN\
    \ {\n  type    slave;\n  masters { 172.17.100.1 }\n  file    \"db.premierpress\"\
    ;n\n};\n```\n\n# Root Zones\n\nRoot zone is the default zone found in every installation.\
    \ It is used whenever configured zones do not resolve a query. The type here is\
    \ hint. The file directive contains named.ca, which contains information about\
    \ root servers on the Internet.\n\nThe sample code for the Root zone is shown\
    \ here:\n\n```\nzone \".* IN {\n  type hint;\n  file \"named.ca\";n\n};\n```\n\
    \n# Loopback Zones\n\nAlthough loopback zones are not strictly required, they\
    \ are always specified. Many programs in the X Window System use local sockets\
    \ to emulate IPC queues between cooperating processes. These sockets are bound\
    \ to host 172.17.0.1, which is the lookup device. Loopback zones should never\
    \ be slaves.\n\n\"0.0.172.addr.arpa*\""
  merge: -1
  img_proc: true
- pgno: 329
  md: '# Chapter 9 OTHER NETWORK SERVERS


    # Resource Records (RR)


    A DNS resource record (RR) contains all the information about a domain name system.
    It defines all the attributes for a domain name such as an IP address or a mail
    route.


    A DNS RR has six fields:


    ```

    <NAME>, <TYPE>, <CLASS>, <TTL>, <RD Length>, and <RDATA>

    ```


    These fields are explained in the following list:


    +   * Name. This field specifies the DNS name, also known as the owner name, to
    which the RR belongs.

    * Type. This field is a 2-byte value that specifies the type of the resource that
    is defined in the resource record. This field is necessary because a DNS name
    can have more than one type of RR.

    * Class. This defines the protocol field for the RR record. For example, IN, which
    stands for Internet.

    * Time To Live (TTL). This field is the time, in seconds, for which a name server
    can cache an RR. A zero TTL implies that a server should not cache the RR.

    * RD Length. This field is the RDATA field''s octets.

    * RDATA. This field is a resource data field and is the value to which the entity
    specified in the NAME field maps. It is unique for each type of RR.


    Table 9-1: Common DNS Resource Records

    | Record Type | Description | Usage |

    |---|---|---|

    | A | An address record | FQDN into an IP address. For example,|

    | | | Mail IN A 172.100.100.1 |

    | | | Login IN A 172.100.100.2 |

    | PTR | A pointer record | Maps an IP address into FQDN. For example,|

    | | | 1.100 IN PTR mail.premierpress.com |'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# BIND Chapter 9 303


    | Record Type | Description | Usage |

    | NS | A name server record | Denotes a name server for a zone. For example, IN
    NS ns1.abc.com. IN NS ns2.abc.com. |

    | SOA | A Start of Authority record | Specifies many attributes concerning the
    zone, such as the name of the domain (forward or inverse), administrative contact,
    the serial number of the zone, refresh interval, and so on. |

    | CNAME | A canonical name record | Defines an alias name and maps it to the absolute
    (canonical) name. For example, IN CNAME mail |

    | MX | A mail exchange record | Used to redirect e-mail for a given domain or
    host to another host. For example, xyz.com IN MX 0 mail.abc.com |


    # Start of Authority (SOA) record


    The Start of Authority (SOA) record is the first section in every zone. This record
    contains information about a particular zone. This section also specifies that
    the server is authoritative for a particular zone. The various attributes that
    contain information about a zone are discussed briefly in the following list:


    +   * **Serial number.** Used for controlling versions. Serial numbers represent
    the full date plus two more digits for sequential revisions during a single day.

    * **Refresh.** This attribute is the delay time that slave name servers should
    wait before checking the master name server''s serial number.

    * **Retry.** This attribute is the delay time that a slave name server should
    wait before refreshing its database after a refresh has failed.

    * **Expire.** This attribute is the upper limit that a slave name server should
    use in serving DNS information for a lack of a refresh from the master server.'
  merge: -1
  img_proc: true
- pgno: 331
  md: "# 304 Chapter 9 OTHER NETWORK SERVERS\n\n◆ Minimum time to live. This attribute\
    \ specifies the number of seconds for which the records in the zone are valid.\
    \ All cached entries for this record in various DNS servers should expire after\
    \ this time limit.\n\nAn example of an SOA section is shown in the following code\
    \ sample:\n\n```\nIN          SOA         xyz.root.xyz.com (\n               \
    \                1997022700 ;      Serial\n                             28800\
    \ ;      Refresh\n                             14400 ;      Retry\n          \
    \                   3600000 ;      Expire\n                             86400\
    \ )      Minimum time\nto live\n```\n\n# Round Robin Load Sharing\n\nAll configurations\
    \ mentioned in the previous sections are stored in one single database file. If\
    \ a domain consists of multiple hosts or there is a logical separation between\
    \ domains, a domain can be divided into multiple domains. Multiple domains can\
    \ be implemented by performing the following steps:\n\n+   1. Configure the subdomain\
    \ as though it were a normal zone in the named.conf file.\n2. Specify the main\
    \ domain in its database file.\n3. Create a subdomain database file in /var/named.\n\
    \nIn addition, you can use round robin load sharing for heavily loaded servers.\
    \ This allows duplication of A records to distribute evenly all incoming requests.\
    \ An example of round robin load sharing is shown in the following sample:\n\n\
    ```\nWWW         0       IN      A       192.102.44.1\nWWW         0       IN\
    \      A       192.102.44.2\nWWW         0       IN      A       192.102.44.3\n\
    ```\n\n> NOTE The Web server traffic is increased depending on the A records duplication.\
    \ At the same time, the chance of server failure also increases by the same factor."
  merge: -1
  img_proc: true
- pgno: 332
  md: '# nslookup


    nslookup is a program available in Linux that you can use to send queries to a
    DNS. The nslookup program can operate in two modes:


    +   - Interactive mode


    +   - Non-interactive mode


    The syntax for the nslookup program is as follows:


    ```

    nslookup [ -option ... ] [ host-to-locate | - [ server ]

    ```


    The two modes are discussed in the following sections.


    # Interactive Mode


    Interactive mode allows a user to query name servers for information about various
    hosts and domains or to print a list of hosts in a domain. In interactive mode,
    users can query name servers for information, such as hosts in a domain. Interactive
    mode is the default mode used when no arguments are given in the command line.
    This mode allows a user to enter commands while the nslookup program is running.
    After executing the program in interactive mode, a user can press Ctrl+c combination
    to enter a number of commands. A few commonly used commands are discussed in the
    following sections.


    # host [servername]


    If the host command is used without the [servername] parameter, the lookup is
    done for the default server, as mentioned in the resolv.conf configuration file.
    Otherwise, the lookup is done using the servername as mentioned in the host command.


    If the host is an Internet address and the query type is A or PTR, the name of
    the host is returned. However, if host is a name and does not contain a trailing
    period, the default domain name is appended to the name. This behavior depends
    on the state of the options domain, searchlist, defname, and search. To look up
    a host not in the current domain, append a period to the name. The host name returned
    is an IP address and the query is either A or PTR type. On the other hand, if
    only the host name is returned, the domain name is added to the host name.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# server <servername>


    The server command is used to change the default server to that specified in the
    command.


    # finger [hostname]


    The finger command is used to connect to a finger server on the host computer
    and retrieve finger information for that host. If a finger daemon is not running,
    information cannot be retrieved for any other reason and the command returns an
    error.


    # Is [option] domainname


    The 1s command is used to return host names and Internet address information for
    a particular domain. The command retrieves this information from a DNS server.
    A few options that you can use with this command are listed here:


    +   - qtype. This parameter is used to specify that the list information should
    be retrieved only for a particular type. The types include A, CNAME, HINFO, MINFO,
    MX, NS, PTR, SOA, TXT, UINHO, WKS, ANY, AXFR, MB, MD, MF, and NULL. The default
    type is A.


    +   - a. This parameter is used to retrieve alias names for a particular host
    in a domain.


    +   - d. This parameter is used to list all available records for a domain.


    +   - h. This parameter is used to find hardware and operating system information
    for a host.


    +   - s. This parameter is used to display all services that are being run in
    a host. The parameter can list only a limited number of services that are being
    in the host computer.


    +   - ?. This parameter is used to display help. It also includes sections to
    display the list of available commands.


    +   - exit. This parameter is used to exit the program.


    # Non-Interactive Mode


    In non-interactive mode, the program prints the name and the requested name for
    a host or domain. The program operates in non-interactive mode when the first
    argument is the name to be looked up and the second optional argument is a host
    name or a name server.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# BIND Security


    Initially security was not considered a part of DNS because the main purpose of
    DNS was to help users in communication. It was designed to be used by the public,
    and therefore, restricting users who can query the server was not considered during
    its design. But with the evolution of the Internet, many applications were developed
    that used IP addresses and host names as a basis for allowing or disallowing users
    to access their services. As a result, gradually ensuring correct information
    to users became very important, and therefore security became a part of DNS. By
    incorporating security, it has become risky for organizations that rely on the
    Internet for communicating with clients or other firms to provide false information.


    Several problems are faced by the DNS, however. Some of these are discussed in
    the following sections.


    # Cache Poisoning


    Cache poisoning is one of the main problems faced by the DNS, especially the older
    versions of BIND. Whenever a DNS server gets a query that cannot be resolved through
    its cache, it can pass it to another DNS server. If the DNS server passes its
    query to another DNS server which contains incorrect information, the original
    server caches the response from the second server, leading to cache poisoning.
    The malicious form of cache poisoning is also called DNS spoofing.


    In spoofing, the users in control of a DNS server try to force the target DNS
    server to query their server. Once the target server queries, its cache can be
    easily poisoned. Early versions of BIND were very susceptible to such attacks.


    > NOTE

    In July 1997, Eugene Kashpureff, while protesting against InterNIC''s control
    over DNS servers, poisoned caches of major servers around the globe, such that
    all requests going for www.internic.net landed in a site that belonged to the
    AlterNIC. This was made possible because BIND cached any response coming from
    another server without checking its authenticity. A survey carried out in February
    1999 showed that around 33 percent of DNS servers were easy targets of such attacks.'
  merge: -1
  img_proc: true
- pgno: 335
  md: "# Chapter 9 OTHER NETWORK SERVERS\n\nCache poisoning can lead to two major\
    \ problems, as discussed in the following list:\n\n+   A request made to a poisoned\
    \ server for a particular domain name can lead to a failure. This is called denial\
    \ of service.\n\n+   The person controlling the rogue server can easily poison\
    \ any server querying it and act as a trusted source. This can be very harmful,\
    \ especially for people who give out their credit card numbers and expiration\
    \ dates on the Internet. This is known as masquerading.\n\n# Host Spoofing\n\n\
    Apart from cache poisoning, a malicious user can use hundreds of DNS responses\
    \ for a query and the querying server will accept them without authentication.\
    \ This is termed cache flooding.\n\nOther DNS server attacks include leakage of\
    \ information through zone transfers. Host names can reveal certain things about\
    \ the host, as as its operating system. This information can be useful to its\
    \ rival hosts. DNS tools can be used to query a server continuously with different\
    \ IP addresses of a particular domain. The unused IP addresses can be used to\
    \ spoof the server and act as a host of that network. If another system is configured\
    \ to trust the entire IP network, it is vulnerable to attack by an attacker using\
    \ the unused IP address of the trusted IP network. The way to deal with it is\
    \ to never configure your machine to trust an entire network; instead, mention\
    \ explicitly the hosts of the network that can be trusted.\n\n# Restricting Queries\n\
    \nAs discussed earlier, DNS was designed for public use, and therefore, the earlier\
    \ versions of BIND did not include any option for restricting querying sources.\n\
    \nLater, when the importance of security was realized, sub-statements like allow-query\
    \ were added from Version 8. The allow-query directive can be used both as global\
    \ option or in particular master/slave section. You learned about allow-query\
    \ in the section, “BIND Configuration,” earlier in this chapter.\n\nAn example\
    \ of allow-query is shown in the following code:\n\n```\noptions {\n    allow-query\
    \ { 192.49.49/30; 192.59.59/30; };n};\n```"
  merge: -1
  img_proc: true
- pgno: 336
  md: "The following code shows a sample of restricting queries in the zone you want\
    \ to protect:\n\n```\nzone \"premierpress.com\" IN {\n    type            slave;\n\
    \    masters         { 172.17.100.1 }\n    file            \"db. premierpress\"\
    ;\n    allow-query \"XYZ-NET\";\n}\n```\n\n# Restricting Zone Transfers\n\nRestricting\
    \ zone transfers is considered more important than restricting queries. If you\
    \ take another look at the \"BIND Configuration\" section, you will find an allow-transfer\
    \ statement that can limit zone transfers by specifying the hosts allowed to copy\
    \ the database.\n\nBy using the allow-transfer statement in the master zone, the\
    \ number of slaves who can transfer the master can be controlled. An example of\
    \ the allow-transfer statement is shown here:\n\n```\nzone \"premierpress.com\"\
    \ IN {\n    type            master;\n    file            \"db.premierpress.com\"\
    ;n    allow-transfer { 172.32.32.2; 172.42.42.4; };\n}\n```\n\nThe mentioned directives\
    \ also can be used in slave and global configuration. By using them in slave,\
    \ you can restrict hackers who can transfer zone in that particular slave.\n\n\
    # Running BIND with Least Privileges\n\nBIND should be run under the user or group\
    \ that has the minimum number of rights or privileges on that system. These rights\
    \ should just be enough for the name server to run. If a hacker gets into the\
    \ system running BIND as root, the hacker is able to execute any command using\
    \ the root privileges, which is potentially very dangerous."
  merge: -1
  img_proc: true
- pgno: 337
  md: '# Chapter 9 OTHER NETWORK SERVERS


    Versions 8.1.2 and later of BIND provide the facilities of running BIND under
    another user or group with less privileges.


    # BIND Versions


    BIND has been constantly evolving. The newer versions are definitely more secure
    than their earlier counterparts. It is always recommended to install the latest
    version of BIND. The administrator should keep track of the latest versions available
    on the Web at www.isc.org/BIND. At this site, you also can find the list of vulnerabilities
    of any BIND versions.


    It is not desirable to let the hacker know which version of BIND you are using.
    The version number should be removed so that it cannot be revealed using version.bind
    query. This facility is available in Version 8.2 and later.


    # Transaction Signatures


    Transaction Signatures (TSIG) is a security measure implemented in BIND Version
    8.2 and above. This concept provides security with flexibility and without compromising
    on performance.


    TSIG record is added to the DNS message data by the name server. The TSIG is calculated
    using a one-way hash function. This function computes a hash value based on each
    and every bit of the message data and a few other fields I will discuss later.
    The resulting hash function is secure because it cannot be reversed and changes
    dramatically even with a minor change in the input used for computing.


    The MD5 hashing technique is widely used for storing passwords over the Internet.
    TSIG uses a modified version of MD5 called HMAC-MD5, which requires a key and
    computes a 128-bit hash value using the message data and the key as input.


    First a secret code is decided between the sender and the receiver, which is keyed
    with the hash value. This secret key has two advantages, as discussed in the following:


    +   - It ensures that the message originates from a reliable and expected source.


    +   - It ensures that the message was not altered after the time it was signed
    by the sender.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# BIND Chapter 9 311


    Once the TSIG record and message is ready, it is sent by the signer. After receiving
    the signed message, the receiver first removes the TSIG record and checks it.
    At this point, no data is cached; caching is done only when it is confirmed that
    the message is genuine. These security measures help in combating hackers who
    try to attack by authorized (signed) messages and sending them again at their
    own convenience.


    TSIG is used for securing zone transactions, queries, responses, and dynamic updates.
    In BIND 8, the TSIG key is created using the dnskeygen program included in it.


    # DNS Security Extensions (DNSSEC)


    DNSSEC is the DNS security extensions provided by the work group (WG) formed in
    1994 by IETF. This was done because of the security issues haunting DNS servers.


    The primary aim of this WG was to provide the information in DNS zones with authentication
    and integrity. This was achieved through the use of public key technology and
    is based on the use of cryptographic signatures like the TSIG concept. The need
    for public key cryptography arises due to the problems faced by the TSIG. Some
    of these problems are listed here:


    +   - Trouble in maintaining too many keys at a time.

    - Once somebody gains access to the server, the keys can be easily retrieved.


    # Public Key Encography


    Public key cryptography is used for safe transactions between two computers. A
    computer first creates a key pair. This key pair is generated using an asymmetric
    cryptographic algorithm where one key is used to decrypt the data and the other
    key is used to encrypt the data.


    After a key pair is made, the public key can be placed for anyone who wants to
    communicate with that computer. To communicate with the computer, the message
    is encrypted using the public key of the receiving computer. When the message
    is received, the computer decrypts it using its private key. Therefore, if the
    private key is saved securely, the genuine computer will only read the message.'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'Signing and verification of a message is also possible by using digital signatures.
    In this process, first the hash value of the message is calculated and then it
    is encrypted. This encrypted hash value is called a *digital signature*, which
    is then sent along with the message. The receiver can authenticate it by first
    decrypting the digital signature and by computing the hash value of the message.
    The message is considered genuine if the two hash values match.


    # Signing and Verification of a Message


    The process of signing and verifying a message is used because asymmetric algorithms
    for encryption usually take more time to encrypt, and therefore, encrypting the
    whole message can be really time-consuming. Some resource records were created
    with DNSSEC to assist it. These records are discussed in the following sections.


    # KEY Record


    Key record or key RR is a general record used for storing public cryptographic
    keys. It stores information like the public key, protocol type, algorithm type,
    and flags for various purposes.


    # SIG Record


    SIG RR is used to store the digital signature of the private key. It also provides
    the signature''s validity time and authentication. If more than one algorithm
    for encryption is used to sign the resource records, more SIG RR will be required.


    # NXT Record


    All records in a zone are sorted in alphabetical order. Whenever a request generates
    a negative response, it implies that the query has no corresponding RRSet. RRSets
    that are not present also are given signatures to authenticate their absence.
    This is done using NXT RR. NXT RR indicates the following:


    +   - The range of unavailable DNS names


    +   - The list of absent RRSets for an existing DNS name'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# SAMBA


    SAMBA is open source software used to provide Windows-like network services, such
    as file and printer sharing. SAMBA makes the UNIX-based box act like a Windows
    NT server, providing many services that an NT server provides over a network.


    SAMBA is basically the UNIX version of Common Internet File System (CIFS), which
    is used by Microsoft to induce compatibility between the Windows NT and Windows
    98 operating systems. SAMBA was originally designed and developed by Andrew Tridell
    in 1992. It was called SAMBA because the name contained SMB, which is the underlying
    protocol it uses. SAMBA is now developed and maintained as an open project under
    the guidance of Andrew Tridell. The official Web site of SAMBA is www.samba.org.


    The goal of the SAMBA project is to monitor the changes done by Microsoft in CIFS
    and to provide the same services and features in SAMBA. Over the years, as has
    been proved through various real-world tests, SAMBA performs significantly better
    than Microsoft''s CIFS implementations.


    # SAMBA Services


    The various services provided by a SAMBA server are given in the following list:


    +   * File and Printer Sharing. File and printer sharing are the most widely used
    SAMBA services. These services make it very easy to retrieve files over the server
    or print through any printer attached to the network.


    +   * WINS Server. WINS server is a NetBIOS Name Server (NBNS) for Windows networks.


    +   * User Authentication and Authorization. Authentication of the user is done
    via passwords or domains. This is explained in detail later in this chapter.


    +   * Browsing Support. NetBIOS Name Server is used by SAMBA, which gives the
    browsing support. SAMBA can also act as LAN''s Master Browser.


    +   * FTP-like Options. Various resources from other operating systems can be
    accessed through its FTP-like SMB client feature.'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'Apart from these features, there are various administrative functions that
    can be performed by SAMBA, using tools discussed later in this chapter. All communication
    in SAMBA is done primarily with the Server Message Block (SMB) protocol.


    # SAMBA Servers


    Two main servers are used by SAMBA:


    +   - nmbd. This server is the NetBIOS name server. The purpose of this server
    is to help in browsing resources over the network. The nmbd server can also act
    as a WINS server if required.

    - smbd. This server is the SMB server that is used mainly for user authentication
    and authorization and file- and printer-sharing. This is done using the SMB protocol.


    # SMB Protocol


    The SMB protocol is a server client-response protocol. All Windows operating systems
    that can be used for networking—such as Windows 3.11, Windows 95, Windows 98,
    Windows ME, Windows NT, Windows 2000, and Windows XP—can run SMB as server, client,
    or both. This protocol is used mainly to connect systems with different operating
    systems, such as Windows, Linux, and so on.


    SAMBA runs SMB over TCP/IP, with NetBIOS under it. Whenever an SMB client starts
    and needs to know the IP address of a specified host, it broadcasts its query
    over the network. It gets replies from the nmbd server in the form of clients''
    NetBIOS information. In this case, nmbd acts as a WINS server and keeps a record
    of all hosts connected in the network. This keeps the network safe from saturation
    caused by the broadcasts made by the SMB clients.


    # SAMBA Installation


    SAMBA supports a variety of Linux distributions and other UNIX variants like Solaris,
    NetBSD, UNIXWARE, HP-UX, Digital UNIX, SCO Open Server, IRIX (SGI), SunOS, AIX,
    AULTRIX, BSDI, and so on.


    You can download the latest version of SAMBA from www.samba.org. Installation
    manuals and other documents are also available with the SAMBA distributions.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# SAMBA Configuration


    The main configuration file of the SAMBA server is smb.conf. By default, this
    file is located in the /etc/samba directory. This file provides a number of directives
    that you can set to enable or disable various features of SAMBA. The same configuration
    file also allows users to add new and shared directories in SAMBA.


    smb.conf is divided into sub sections, each headed by a caption enclosed in square
    brackets ([ ]). The parameters contained in the sections are in the form of name
    =


    An example of a portion of the smb.conf file is shown here:


    ```

    [global]

    workgroup = domain_name

    [share1]

    comment = Linux SAMBA Server

    path = /users/sbuser1

    read only = yes

    ```


    The preceding lines are the minimum lines required in the smb.conf file for the
    server to work. The options in the smb.conf file are discussed in the following
    list:


    +   * [global]. This option describes the global settings for controlling the
    server.

    * [share1]. This option is used when you need to define a new share that the SMB
    clients can access.

    * comment. The label specified in the comment directive is shown in the users
    network neighborhood folder as the share name.

    * path. This directive specifies the name of the directory that will be shared.


    A few other directives that are important from the security point of view are
    discussed in the following list:


    +   * public. This is a Boolean directive and can accept arguments in yes or no.
    If this directive is set, guest users are able to access the share.

    * browsable. This is also a Boolean directive and if it is set, network users
    are able to see the share in the network browse list.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Printer Sharing


    All installed printers are defined in the /etc/printcap file. Only valid SAMBA
    users are allowed to use these printers. All printers in the /etc/printcap file
    are shared as resources by default. However, this can be changed to allow sharing
    of only specific printers. The following code shows the sample of the global printer
    option:


    ```

    [printer]

    comment = printer x

    path = /var/spool/samba

    browsable = no

    public ok = yes

    writable = yes

    printable = yes

    ```


    You can define a specific printer by using the statement public = no and add another
    option, valid users, as shown in the following code:


    valid users = userX userY userZ


    # Mounting the SMB File System


    Linux exclusively supports mounting of the SMB file system. This is due to the
    support that Linux enjoys from its kernel. The mounted SMB file system can be
    used just like a normal network file system. The command used for mounting file
    system is as follows:


    ```

    submount //server1/share /mnt/SMBfs mountpoint=-o username=user

    ```


    In the preceding example, share is connected to host server1.


    +   - printable. This Boolean directive tells SAMBA that the device is a printer.

    - users. This directive accepts user names as parameters. The users listed in
    this list are allowed to access the shared resource.

    - group. This directive stores the group names that are allowed to access this
    particular shared resource.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# SAMBA Chapter 9 317


    Mounting also can be done automatically at system boot. This is done by adding
    the following line in the /etc/fstab file:


    ```

    //server1/share /mnt/SMB SMBfs defaults,username=user 0 0

    ```


    # SAMBA Client Tools


    Some tools used by SAMBA clients are useful and easy to use. These tools are discussed
    in the following sections.


    # nmblookup


    The nmblookup tool is used to query a WINS server. In addition, it is used to
    list machines and works similarly to nslookup in DNS. To list specific machines,
    use the following statement:


    ```

    nmblookup -U server -R ''machine_name''

    ```


    To list all machines on the network, use the following statement:


    ```

    nmblookup \*

    ```


    The preceding statement uses * to query broadcasting, but a \ (backslash) should
    precede it to protect it from shell expansion.


    # smclient


    The smclient tool is used for retrieving files during a normal FTP operation.
    The smclient tool uses the following command:


    ```

    smclient //machine1/share

    > cd directory123

    > get file123

    ```


    To view shared services, you can use the following command:


    ```

    smclient -L hostx

    ```


    You also can specify the username and password by using the -U option, as shown
    in the following example:


    ```

    smclient -U user%unsafepassword

    ```'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# 318 Chapter 9 OTHER NETWORK SERVERS


    As you can see, the username and password fields are separated with a%. It is
    unsafe to mention password like this because anyone who can retrieve previous
    commands will be able to access the password easily.


    # SAMBA Security


    Security has been a major concern with the SAMBA server. SAMBA has several options
    that allow an administrator to set up file sharing safely. SAMBA security can
    be learned in four levels:


    +   * Share-level security

    * User-level security

    * Server-level security

    * Domain-level security


    I now discuss each of these options in detail.


    # Share-Level Security


    Every share that is set up in a network workgroup can be either a free share or
    a share that requires an access password. SAMBA supports both shares. When a user
    needs to access a share that requires no password, only the share needs to go
    with the connect request. However, if a share name requires a password before
    it allows access, a client would be required to send the sharename and a password.


    Note that no username is associated with such a share. There are the two types
    of share-level security options in SAMBA. Each share requires independent authentication.
    Therefore, if there are 10 shares up in a particular server and a single client
    needs to access them, the client computer must authenticate 10 times.


    These shares are similar to those in Windows 98 that can be associated with a
    password. The only difference is that SAMBA uses UNIX authentication of a username
    and password instead of the Windows authentication combination of sharename and
    password. One main advantage of this security mode is that, in order to connect
    to a SAMBA server, no UNIX accounts are needed for every corresponding Windows
    account.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# User-Level Security


    This is a user-based authentication scheme. In this security level, when the user
    connects to the server, the server has no idea which share the user wants to access.
    Therefore, no share names are involved until the user is successfully authenticated
    into the server. The authentication is done only on the basis of a username and
    password. With user-level security, each client needs to authenticate itself only
    once, irrespective of how many shares the person wants to access. After logging
    in, all the shares with required permission become accessible to the user. The
    SAMBA server verifies each user using the standard authentication with /etc/passwd
    files. If the shadow suite is installed and enabled, /etc/shadow also is used
    in addition to /etc/passwd.


    Alternatively, if encrypt password = yes is set in the smb.conf file, SAMBA uses
    the smb.passwd file to authenticate users.


    An administrator can reduce some workload by keeping /etc/passwd synchronized.
    However, this should be done only if all users have shell access and shadow suite
    is not being used. If any users on the computer do not have shell access, this
    would prevent all those users from accessing SAMBA share. This is due to the presence
    of a * in place of the hashed password. Similarly, if the shadow suite is being
    used, the hashed password is replaced by a * in the /etc/passwd file.


    # Server-Level Security


    Server-level security mode is almost identical to the user-mode security mode.
    The only exception is that the authentication is not performed within the same
    server. A separate SMB server is used to authenticate the users. This can be a
    Windows NT computer, a SAMBA server, or any other server that is fully compatible
    with the SMB protocol. The server that is used to perform this authentication
    can be specified in the global section in the smb.conf file with the following
    directive:


    ```

    server = <SERVERNAME>

    ```


    The <SERVERNAME> should be a valid Netbios name of the SMB computer.


    The server-level security has a major disadvantage, however. SAMBA is used mainly
    to support Windows file-sharing features with Linux computers. When SAMBA connects
    to a remote server, the connection does not close down after the authentication
    is complete. The connection remains active until either the'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Chapter 9 OTHER NETWORK SERVERS


    SAMBA daemon that requested authentication sends a close connection request or
    the requesting daemon is dead. In both cases, long active connections are required.
    If the authenticating server is a Windows server, the limited simultaneous license
    restraint in some versions of Windows, such as Windows 2000 and NT server, can
    be a hindrance.


    # Domain-Level Security


    If domain-level security is set in SAMBA, it needs to perform all authentications
    from the Primary Domain Controller (PDC). Before SAMBA can send authentication
    requests to the PDC of the network, it must be added in the NT domain using Server
    Manager for domains. An important thing to note here is that the SAMBA server
    should not be made the PDC of the network.


    Unlike the share-level security, once a user has been authenticated with domain
    level security, the user is not asked for individual passwords for shares. After
    authentication, the user is granted a ticket that can be universally used to access
    all permissible shares.


    The authenticated user already has a session ticket to access all information,
    domain-level security mode doesn''t require the SAMBA server to maintain a continuous
    connection with the PDC of the network.


    # Summary


    In this chapter, I discussed the important network servers that are used in Linux.
    I also explained the methods to secure these servers. In the first half of the
    chapter, I discussed the concepts and options that are used to configure FTP and
    send-mail. In the latter half, I explained servers like DNS and SAMBA.'
  merge: -1
  img_proc: true
