- pgno: 453
  md: '# Chapter 13 SYSTEM BACKUPS


    +   - amdump logs an error and terminates if another copy of amdump is running
    or a previous run is aborted. If an earlier run is aborted, the amcleanup command
    must be run.


    +   - The areas to be backed up and when the backup should be performed is determined
    by the AMANDA planner.


    +   - The backup schedule is available to the driver program. The driver programs
    perform the backup based on the schedule.


    The driver instructs theumper to start backups. In addition, the driver provides
    each dumper with dump information, such as its client, area, and options, such
    as compression and whether the dump amandad to the holding disk or directly to
    tape. The dumper requests the client to run dump programs. Along with the requests,
    options to run the programs are also passed. The client sends the dump image back
    to the dumper who writes it through the server compression, into the holding disk,
    or directly to a tape connection.


    The amort command can be used to generate backup reports. The report is sent as
    e-mail. Complete information about the backups can be gathered from AMANDA reports
    obtained from the amort command. It gives all details about the failed dumps,
    file systems dumped, the dump rate, the number of dumps made daily, partial dumps,
    and so on. The following are additional commands used by AMANDA:


    +   - amflush. Used to flush backups from the holding disk to tape. When amdump
    reports an error while writing backups to tape, backups stay in the holding disk.
    After resolving the tape problem, you can run amflush to write backups from the
    holding disk to tape.


    +   - amcleanup. Used to clean up after an interrupted amdump. At times, the amdump
    command is interrupted for reasons like the crashing of tape server hosts.


    +   - amrecover. Enables you to search for index files of AMANDA. It also enables
    you to select the backup tape from which the files will be restored. It can also
    run amrestore and the system restore program, such as tar, in some cases.


    +   - amrestore. Used to read an AMANDA tape, searching for requested backups.
    It provides an interactive interface to restore single files as well as partitions
    on a failed disk.'
  merge: -1
  img_proc: true
