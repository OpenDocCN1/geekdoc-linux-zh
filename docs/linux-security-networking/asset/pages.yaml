    Each of these directories is discussed in detail in the upcoming sections.


    # /dev(Devices)


    In Linux, a device resides in a file. Devices in Linux fall under two categories:
    character and block. Character devices are those in which input is read character
    at a time. Examples of character devices are the keyboard, mouse, and serial port.
    Block devices, such as the hard drive and CD-ROM drive, read and write information
    in blocks of characters. For block devices, you need to know the block size for
    I/O operations. Drivers under Linux are specified by two numbers—a major and a
    minor number. The major number identifies the type of device, and the minor number
    identifies an interface specific to that device. All device files are stored in
    the /dev directory.'
