    The MetaDir directive is used to specify the location for meta information files.
    Meta information files store information that is hidden from the user. In the
    Apache context, meta information files are used to store additional HTTP headers
    that are included in the document before it is sent to the client:


    +   # MetaDir: specifies the name of the directory in which Apache can find

    # meta information files. These files contain additional HTTP headers'
