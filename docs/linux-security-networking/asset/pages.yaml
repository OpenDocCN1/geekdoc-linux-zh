- pgno: 479
  md: 'linux''s growth has been exponential for the past seven years. In 1995, an
    estimated 500,000 computers used Linux. This figure tripled the next year. In
    1997, 3.5 million were using Linux. The growth is continuing. Several factors,
    such as its open source nature, efficiency, portability, and flexibility have
    contributed to its popularity. In this appendix, I discuss some products for the
    Linux platform that are expected to be catalysts in continuing to boost the popularity
    of Linux. Specifically, I''ll talk about Bastille Linux, Apache 2.0 Web server,
    and qmail.


    # # Bastille Linux


    The Bastille Linux project was started in April 1999 with the goal assisting system
    administration in the Linux environment. It was initially released for the Red
    Hat distribution but later versions were compatible with the other distributions
    as well. Bastille Linux is freely available under the GNU General Public License
    (GPL). Jay Beale is the lead developer of the project.


    A few of the scripts that manage Bastille Linux are listed here:


    +   - **InteractiveBastille.pl.** This script prompts users for various options
    during configuration. The options selected by the user are stored in a config
    file.

    - **BackEnd.pl.** This script takes care of systems modification.

    - **Undo.pl.** This script enables you to undo any modification in case of trouble.
    The backup copies of configuration files are placed at /root/Bastille/undo directory.


    # # Features of Bastille Linux


    Some features of the Bastille Linux are listed here:


    +   - Bastille provides support for various distribution of Linux.'
  merge: -1
