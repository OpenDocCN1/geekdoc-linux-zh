- pgno: 194
  md: '# ANSWERS


    # Chapter 5 167


    The [control_flag] argument is used to specify the response of the PAM library
    in events of success or failure of the module with which it is associated. The
    keywords that you can assign are listed here:


    +   - Required

    - Requisite

    - Sufficient

    - Optional


    The [module_path] argument represents the pathname of the dynamically loadable
    object file, which is normally the pluggable module.

    The [arguments] arguments are a list of tokens that are passed to the module when
    it is invoked.


    # 2 DES


    DES is a method for data encryption that uses a secret key, which is extremely
    difficult to break, to encrypt data. DES applies a 56-bit key to each 64-bit block
    of data. This method uses the private key cryptography, where both the sender
    and the receiver use the same private key to encrypt and decrypt data.


    # 3DES


    3DES takes three 64-bit keys to form an overall key length of 192 bits. The data
    is encrypted with the first key and decrypted with the second key. This decrypted
    data is again encrypted with the third key. The 3DES encryption breaks the secret
    key into three subkeys and pads the keys, if necessary, so that they are each
    64-bit long. The 3DES encryption is more secure than the DES encryption.


    # IDEA


    IDEA is a symmetric block cipher designed to facilitate both software and hardware
    implementation. It was developed to provide a high level of security with ease
    of implementation. IDEA encrypts data in 64-bit blocks with a 128-bit key. The
    64-bit data block is divided into four 16-bit sub-blocks. Each of these sub-blocks
    undergoes eight rounds of operations where the XOR algorithm is applied on the
    sub-blocks. This results in a very complex value, which is very difficult to analyze.'
  merge: -1
  img_proc: true
