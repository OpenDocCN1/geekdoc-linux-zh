  md: '# Chapter 7 NETWORK ATTACKS


    STEP 4. A huge amount of network traffic is generated, and the victim computer
    is caught unaware with bulks of ICMP ECHO reply packets.


    A side effect of this kind of attack is also felt by the intermediate networks.
    Severe network congestion occurs occurs when ICMP ECHO reply packets are being
    generated and dispatched all over a network.


    When such an attack is organized using multiple intermediary networks, the impact
