    # The SSL Handshake Protocol


    The SSL handshake protocol, also called the key-exchange protocol, is responsible
    for creating secure communication between client and server. It authenticates
    both the client and the server and negotiates the encryption algorithm and cryptographic
    keys.


    Communication through SSL handshake protocol is divided into several stages:


    +   * Authentication of the server to the client.

    * Negotiation of cryptographic algorithms between the server and the client.

    * Authentication of the client to the server.

    * Exchange of cryptography parameters by using public-key encryption.

    * Establish an encrypted SSL connection.


    Different types of SSL handshake protocol messages are exchanged between a server
    and a client:


    +   * client_hello

    * server_hello

    * server_certificate'
