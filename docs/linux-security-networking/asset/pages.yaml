    # Linux Security Checklist


    System administrators need to perform some tasks regularly in order to protect
    their systems. In this section, you look at some checklists for securing Linux.
    Here are some tasks you can perform to reduce your risk:


    +   - Keep up with software patches

    - Comb through your log files and investigate any entry that is out of the ordinary.


    Here are some tasks you can perform to reduce the risk for the Linux system:


    +   - Check network integrity

    - Turn off your unessential services


    Unused running services are the prime target of the hackers. You tend to forget
    about the services that are running and not often used, and those are the services
    that get attacked by the hackers. There are some easy ways to guard against this.
    You can move to the directory where the init files are stored and add an exit
    line at the beginning of the scripts for the services that you do not want to
    use. An easier and more secure way to accomplish this task is to use the chconfig
    and sys utility. These utilities do not involve editing the script. As a result,
    it is less error-prone to use them. The init files are usually stored in the /etc/rc.d/init.d
    directory. Services you might want to turn off include these:'
