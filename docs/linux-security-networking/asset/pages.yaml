    action is executed by the system boot before any boot or boot entries. This command
    saves administrators a lot of effort and time spent on restarting computers during
    troubleshooting and disaster recovery.


    # tload


    The tload command presents the average system load in graphical mode. This command
    prints to the specified terminal a graph of the current average system load. The
    -scale option allows a vertical scale to be specified for the display, which means
    that a smaller value represents a larger scale, and vice versa. The -delay option
    sets the delay (in seconds) between graph updates. The syntax of the tload command
    is displayed here:


    ```

    tload [-V] [- scale] [-d delay] [tty]

    ```


    The output of the tload command is printed to the specified [tty].


    # vmstat


    The vmstat command reports virtual memory statistics. This command reports information
    about processes, memory, paging, block IO, traps, and CPU activity. The first
    report produced by this command gives all averages since the last reboot.'
