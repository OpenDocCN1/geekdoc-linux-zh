    # Netstat


    Netstat prints information about the Linux networking subsystem. The netstat command
    is used to view the network connections, routing tables, interface statistics,
    masquerade connections, and multi-cast memberships.


    The different syntax of the netstat command is shown here:


    ```

    netstat {address_family_options} [-tcp| -t] [-udp| -u] [-raw| -w] [-listen| -l]
    [-all| -a] [-numeric| -n] [-symbolic| -N] [-extend| -e][-extend| -e] [-timers|
    -o] [-program| -p] [-verbose| -v] [-continuous| -c]

