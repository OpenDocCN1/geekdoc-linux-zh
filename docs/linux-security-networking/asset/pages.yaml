- pgno: 186
  md: '# PLUGGABLE AUTHENTICATION MODULES (PAM) Chapter 5 159


    # [arguments]


    Arguments are passed to a module when it is invoked. Valid arguments are usually
    optional and are specific to any given module. Invalid arguments are ignored by
    a module. However, while encountering an invalid argument, the module writes an
    error to syslog (3).


    So far, you have looked at the format of the pam.conf file. PAM can be configured
    in another way—using the configuration files in the /etc/pam.d/ directory. The
    format of the files in the /etc/pam.d/ directory is similar to that of the pam.conf
    file, as given here:


    ```

    module-type control-flag module-path arguments

    ```


    The only difference between the structure of the pam.conf file and the files in
    the /etc/pam.d/ directory is that the [service_name] is not present in the latter.
    This is because the name of the service is assigned to the configuration file.
    For example, the /etc/pam.d/login file contains the configuration for the logon
    service. The content of the /etc/pam.d/login file is displayed here:


    ```

    auth      required      /lib/security/pam_securetty.so

    auth      required      /lib/security/pam_stack.so service=system-auth

    auth      required      /lib/security/pam_stack.so service=nologin.so

    account   required      /lib/security/pam_stack.so service=system-auth

    password  required      /lib/security/pam_stack.so service=system-auth

    session   required      /lib/security/pam_stack.so service=system-auth

    session   optional      /lib/security/pam_console.so

    ```


    This method of configuration has a number of advantages over the single file approach.
    I have listed some of these advantages here:


    +   * It is easier to maintain.

    * Parsing is quicker.

    * Read access to Linux-PAM configuration files can be limited.

    * Package management is simpler.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# # Kerberos


    Kerberos is a network protocol designed to provide authentication by using secret
    key cryptography. It has been designed to provide security from hackers, as well
    as any users with doubtful intentions within your network. Kerberos was created
    at Massachusetts Institute of Technology (MIT) as a solution to the authentication
    problems in your network.


    The Kerberos authentication process is listed here:


    +   1. First, a client requests a ticket from the Key Distribution Center (KDC).

    2. A Ticket Granting Ticket (TGT) is created by the KDC for the client. The TGT
    is encrypted by using the client''s password. This encrypted TGT is then sent
    back to the client.

    3. Upon receipt of the TGT, the client decrypts the TGT by using his password.
    The client is authenticated if he is able to decrypt the TGT successfully.


    The TGT expires after a specified time. A client can obtain multiple TGTs, which
    gives permission for various services to the client. The requesting and granting
    of tickets is transparent to the user. Kerberos uses the single-sign-on system,
    which means that you need to supply your password once per session.


    I''ll now discuss some aspects of the Kerberos authentication system:


    +   * Kerberos Principal

    * Ticket Management

    * Password Management


    # # Kerberos Principal


    The Kerberos principal is an identity to which a ticket can be granted. This identity
    can be a user or a service. A Kerberos principal is divided into three parts:
    prim-ary, instance, and realm.


    +   * Primary. The primary is the first part of the principal. For a user, a principal
    is the username.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# KERBEROS Chapter 5 161


    +   - Instance. The instance is an optional part that qualifies the primary. The
    instance is separated from the primary by a slash (/). For users, the instance
    is usually null, sometimes a user might have an additional principal. For example,
    the principal user1@abc.com is different from the principal user1/admin@abc.com.
    Both will have different sets of passwords and permissions.


    +   - Realm. The realm is usually the domain name to which the client belongs.


    # Ticket Management


    Usually, the Kerberos is built into the login program. Clients or services get
    the ticket automatically when they logon. The ticket is destroyed when clients
    exit the application. Kerberos has built-in ability for ticket management. You
    can perform the following ticket management tasks by using Kerberos:


    +   - Obtain Tickets


    +   - View Tickets


    +   - Destroy Tickets


    # Obtaining Tickets


    If you are using the Kerberos V5 login program, a ticket is issued automatically
    when they logon. However, if you are using a different logon program, you need
    to explicitly obtain the ticket. The kinit program is also used to obtain new
    tickets, in case your old tickets expire.


    The syntax of the kinit program is given here:


    ```

    Shell% kinit [options] [optional_realm]

    ```


    [options] can have these values:


    +   - f. This option is used if you want to create a ticket that can be forwarded
    to another host.


    +   - I. This option is used to specify a life line for the ticket. Tickets are
    provided for a default lifeline, after which they expire. If you want to obtain
    a ticket with a life line different from the default life line, you should use
    the -1 option.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Chapter 5 ENCRYPTION AND AUTHENTICATION


    The [optional_realm] is used if you need to obtain a ticket for a user on a realm

    different from the default realm.


    # Viewing Tickets


    You can view the tickets available to you by using the klist program. The syntax

    of the klist program is as follows:


    ```

    Shell% klist

    ```


    The format of the output is given here:


    ```

    Ticket cache: /tmp/file1

    Default principal: user@abc.com

    Valid starting  Expires      Service principal

    XX/XX/XX        XX/XX        XXXXXX

    ```


    In the format given above, the critical parts of the output, which have been high-

    lighted in bold, are explained:


    +   * Ticket cache. Specifies the location of the ticket file.

    * Default principal. Specifies the default Kerberos principal.

    * Valid starting. Specifies the date and time of the starting period when

    the ticket is valid.

    * Expires. Specifies the date and time of expiration of the ticket.

    * Service principal. Describes the primary and the instance of the TGT.


    You can use the -f option to view the flags that apply to your tickets. These
    flags

    are as follows:


    +   * F. Ticket can be forwarded.

    * f. Ticket has been forwarded.

    * P. Ticket is proxiable.

    * p. Ticket is proxy.

    * D. Ticket is postdateable.

    * d. Ticket has been postdated.

    * R. Ticket is renewable.

    * i. Ticket is invalid.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Destroying Tickets


    You should destroy tickets when you don''t need them. This will prevent their
    misuse by unauthorized users. You can use the kdestroy program to destroy your
    tickets. If kdestroy is unable to locate or destroy any ticket, it will generate
    an error message.


    # Password Management


    Password is the only authentication mechanism used by Kerberos to establish a
    client''s identity. If malicious users get access to your password, they can be
    authenticated and manipulate your data. Therefore, it is important to select a
    good password and keep it secure. You also should change passwords frequently.


    # Changing Passwords


    To change the Kerberos password, you can use the kpasswd program. The program
    will prompt you for the old password. The old password is needed to ensure that
    you are valid user. After password verification, you are prompted to enter the
    new password twice. An error message will be displayed if there is any mismatch
    in the new passwords that you have entered. The syntax for using the kpasswd program
    is as follows:


    ```

    Shell% kpasswd

    ```


    # Granting Access to Your Account


    At times, you need to give access to your account to different users. To provide
    access without giving your password to other users, you can create a .klogin file
    in your home directory. This is a text file, which might exist in the home directory.
    It contains a list of the principals who have permission to log onto the account.
    The listed principals can log on and use the account without any restrictions.
    However, other users should have Kerberos tickets in their respective Kerberos
    realms.'
  merge: -1
  img_proc: true
