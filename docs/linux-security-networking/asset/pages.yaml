  md: '# Chapter 7 NETWORK ATTACKS


    two services together create an extremely high volume of packets. The result is
    that the two computers, the intermediate and the victim, consume all available
    network bandwidth between them, which means that all other computers on the network
    have difficulty with communication. When such attacks are targeted between many
    computers on the same network, the impact of the attack can be devastating.


    # DoS Attacks on a Network without Consuming the Bandwidth


    A Denial of Service attack can cause a system to deny access to legitimate users
    without actually invading the victim system or choking its bandwidth. The concept
    might sound very strange. The explanation lies in the basics of TCP/IP protocols
    and the way operating systems handle them. Such DoS attacks create many "half-open"
    connections in the victim server.


    Before explaining the attack, let me first give you an overview of how a TCP connection
    is established between two computers. TCP establishes a connection between two
    computers using a three-stage mechanism. Suppose that computer X, which has a
    client program, wants to establish a connection with computer Y, which has a server
    program. The process by which the two computers can establish a connection is
    depicted in Figure 7-1.


    ![](img/a46d40e435b42e09209eb0761898e63c_233_0.png)


    FIGURE 7-1 Establishing a TCP connection.'
