    Even if the firewall allows a connection to establish, you need to ensure that
    the clients are allowed access to the service they are requesting. The level of
    trust is different for different clients. Every client has different requirements.
    You need to analyze the trust and requirements of clients before providing them
    access to your resources. A mechanism to do this is to use TCP wrappers.


    # TCP Wrappers


    TCP Wrapper can be used to provide services, such as access control, restrictions,
    and requests logging. TCP wrappers check the access control list to determine
    whether a connection should be allowed. It also submits a log entry to the daemon
    syslogd. The tcppd invokes a suitable list if a service is not restricted. The
    access list is used to determine the restricted services. The invoked daemon authenticates
    the service and writes an entry in syslog.'
  merge: -1
  img_proc: true
- pgno: 381
  md: '# 354 Chapter 10 LINUX NETWORK DEFENSE AND INTRUSION DETECTION


    TCP wrappers implement access control through the use of two files:


    +   * /etc/hosts.allow. This file contains the deny list.

    * /etc/hosts.deny. This file contains the deny list. The /etc/hosts.allow file
    is an allow list, while the /etc/hosts.deny is a deny list. The allow and deny
    lists in these files determine the set of restrictions imposed on all services
    accessed through tcpd.


    You can use TCP Wrappers for UDP and TCP services. However, these services should
    be invoked through a central daemon.


    # Routing Security


    Routers are the computers that let the packets flow between the source and destination
    hosts. Routers identify the identification of the packets by reading the packet
    headers. The router refers to a configuration table to decide where the packets
    should go. A configuration table is a collection of information:


    +   * The connections that lead to a particular address

    * Priorities for the identified connection

    * Rules for handling traffic


    There are various routing packages available for Linux. I discuss a few in the
    following-sections.


    # routed


    routed is one of the standard routing packages available for Linux. It supports
    only the RIP protocol, the simplest of all the routing protocols. In RIP, the
    routers simply broadcast their routing tables to neighboring routers. The broadcasting
    of routing tables results in a routing table that contains entries for every destination
    on the Internet. This method is insecure and inefficient outside small secure-networks.
    Securing it is not possible. You can firewall ports 520 and 521, which RIP uses
    to transfer data. However, doing so might result in blocking the routes you want
    and the hackers can still spoof routes. Therefore, it is not recommended to run
    this service.'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# ROUTING SECURITY


    # Chapter 10 355


    # GateD


    You can use GateD software to manage interior as well as exterior protocols. GateD
    is more advanced routing software than routed. It supports the following:


    +   * RIP versions 1 and 2

    * DCN HELLO

    * OSPF version 2

    * EGP version 2

    * BGP versions 2 through 4


    The routing protocols are divided into two general groups:


    +   * Interior protocols. These protocols are used to exchange information within
    an autonomous system.

    * Exterior protocols. These protocols are used to exchange routing information
    between different autonomous systems.


    GateD supports the following interior protocols:


    +   * RIP

    * OSPF

    * ISIS


    # RIP


    The Routing Information Protocol (RIP) is the most commonly used interior protocol.
    RIP selects the route that has the lowest hop count. The longest path that RIP
    accepts is 15 hops. If the hop count is greater than 15, the destination is considered
    unreachable and GateD discards the route. GateD discards a route with hop counts
    greater than 15.


    # OSPF


    Open Shortest Path First (OSPF), is a routing protocol used to determine the shortest
    and the fastest route for packets within IP networks. It was designed by the Internet
    Engineering Task Force to serve as an Interior Gateway Protocol (IGP), replacing
    RIP.'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# 356 Chapter 10 LINUX NETWORK DEFENSE AND INTRUSION DETECTION


    The advantages of OSPF are listed here:


    +   - Any change in an OSPF network can be incorporated quickly.

    - OSPF has a hierarchical structure. It uses area 0 as the top of the hierarchy.

    - OSPF is a Link State Algorithm and supports Variable Length Subnet Masks (VLSM).

    - OSPF uses multicasting within areas.

    - OSPF sends only the updated routing table sections upon initialization. OSPF
    does not send the entire routing table.

    - OSPF networks can be logically segmented to decrease the size of routing tables.
    This is possible by the use of areas. Using route summarization can further reduce
    table size.

    - OSPF is not related to any particular vendor. It is an open standard.


    # ISIS


    Intermediate System to Intermediate System (ISIS) protocol is a protocol similar
    to OSPF. ISIS uses the state-link algorithm and short-path-first algorithm. The
    components of the ISIS network are as follows:


    +   - End systems. These are typically the user devices.

    - Intermediate systems. These are the routers.

    - Areas. These are a set of users organized in a local group.

    - Domains. These are a set of the areas taken together.


    ISIS is an IGP originally developed for routing International Organization for
    Standardization/Connectionless Network Protocol (ISO/CLNP) packets. The ISIS version
    distributed with GateD can route IP packets as well.


    Exterior protocols exchange information between autonomous systems. The gateways
    between two autonomous systems communicate by using an exterior routing protocol.
    GateD supports two exterior protocols:


    +   - Exterior Gateway Protocol (EGP)

    - Border Gateway Protocol (BGP)'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# ROUTING SECURITY


    # Chapter 10


    # EGP


    The EGP protocol is used for exchanging routing information between two gateways
    in a network of autonomous systems. It is used to exchange routing table information.
    The routing table contains the following:


    +   - A list of known routers

    - The addresses they can reach

    - A cost metric associated with the path to each router


    The entries in the routing table determine the selection of the best available
    route. The router polls its neighbor at regular intervals between 120 and 480
    seconds. The neighbor responds by sending its complete routing table.


    # BGP


    BGP is replacing EGP as the exterior protocol. Like, EGP, BGP also exchanges reachability
    information between autonomous systems. However, BGP provides more capabilities
    than EGP. It uses path attributes to provide more information about each route.
    These path attributes help in selecting the best route. BGP supports non-hierarchical
    topologies. It can be used to implement a network structure of equivalent autonomous
    systems.


    BGP hosts communicate through TCP protocol. These hosts send an updated part of
    the routing table. BGP communicates with autonomous networks using IBGP. The autonomous
    networks maintain two routing tables:


    +   - One table for the interior gateway protocol

    - One table for IBGP


    # MRT


    The Multi-threaded Routing Toolkit (MRT) toolkit can be used to build a wide variety
    of tools, ranging from routing daemons to BGP fault-injection and traffic generation
    test packages. MRT provides features such as the following:


    +   - Parallel lightweight processes

    - Multiple processor support

    - Shared memory'
  merge: -1
  img_proc: true
