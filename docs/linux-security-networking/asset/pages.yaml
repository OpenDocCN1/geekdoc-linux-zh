- pgno: 446
  md: '# BACKUP TOOLS Chapter 13


    AMANDA can be configured to control all aspects of the backup operation and provides
    many scheduling options. A typical configuration performs periodic full backups
    with partial backups in between. Some of the other features of AMANDA configuration
    includes these:


    +   - Periodic archival backup. AMANDA allows you to make full backups on a site
    away from the primary site.


    +   - Incremental-only backups. AMANDA can be configured to perform incremental
    backups where full backups are performed outside AMANDA, such as crucial areas
    that must be taken off the network, or no full dumps at all for areas that can
    be easily recovered from vendor media.


    +   - Full-only backups. AMANDA can be configured to perform full backups for
    areas that change completely with each run, such as databases or critical areas,
    which can be dealt with easily during an emergency, if they are stored in a single
    archive.


    +   - Support multiple configurations. AMANDA also can support multiple configurations
    on the same tape server if there are multiple tape drives. For example, a periodic
    archival backup configuration can run simultaneously with a normal daily full
    backup configuration. The configuration files will be stored in /var/amanda/etc/amanda/normal/
    and /var/amanda/etc/amanda/archive/, respectively.


