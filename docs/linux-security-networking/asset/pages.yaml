    # nmap


    The nmap program is a network exploration tool and security scanner. Following
    is the syntax of the nmap program:


    ```

    nmap [Scan Type(s)] [Options] <host or net> ... [#N]

    ```


    nmap is designed to allow system administrators and users to scan large networks
    to determine which hosts are running and the services running on the hosts. nmap
    supports a number of scanning techniques, such as, UDP, TCP connect(), TCP SYN,
    ftp proxy, Reverse-indent, ICMP, FIN, ACK sweep, Xmas Tree, SYN sweep, IP Protocol,
    and Null scan.


    nmap also offers advanced features, such as:


    +   * Remote OS detection via TCP/IP fingerprinting

    * Stealth scanning

    * Dynamic delay

    * Retransmission calculations

    * Parallel scanning

    * Detection of down hosts via parallel pings

    * Decoy scanning

    * Port filtering detection

    * Direct RPC scanning

    * Fragmentation scanning


    nmap should be run as root whenever possible. Many critical kernel interfaces
    require root privileges. A number of ports on the computer are scanned. nmap provides
    service name, number, state, and protocol of the port. The state can be one of
    the following:


    +   * Open means that the target machine will accept connections on that port.'
  merge: -1
