    c. amcheck

    d. amverify


    +   3. Which types of backups are supported by Backup Professional?


    +   a. Selective backups

    b. Master backups

    c. Incremental backups

    d. All of the above


    # Short Questions


    +   1. What is the difference between selective and incremental backups?

    2. How can backup logs be helpful in managing backups?

    3. Name a commercial backup tool that is a hardware device.


    # Answers


    # Multiple Choice Answers


    +   1. a, c. Both AMANDA and rsync are client/server-based network backup tools.


    +   2. amrecover provides you with an interactive interface to browse the AMANDA
    index files and allows you to choose the tape from which files will be recovered.
    It also can run amrestore and the system restore program, such as tar, in some
    cases.


    +   3. Backup Professional allows you to take three types of backups. A master
    backup archives the complete data on a specified client. An incremental backup
    archives the data that have been modified after the last master backup was performed.
    A selective backup archives only the selected files. Backup Professional file
    recovery/verification utility is used to restore files and directories to client
    machines and verify previous backups.'
