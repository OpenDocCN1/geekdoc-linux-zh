- pgno: 422
  md: '# IMPORTANT LOG FILES Chapter 12 395


    # error_log


    error_log file stores all the activities handled by the Apache server which resulted
    in error responses. These errors could be due to several reasons. A few commonly
    encountered errors are shown here:


    +   - Buggy scripts that were executed by Web site visitors

    - Links to missing files, also known as broken links

    - Internal server errors that could occur due to erroneous modules

    - Access denied errors that could be due to links to files that the apache daemon
    cannot read or furnish


    The default error log for Apache contain the following fields:


    +   - Date and time. This is the time and date of the host server, when this error
    occurred.

    - Type of message. This column specifies the type of error that was generated;
    for example, a message could be a notice or error.

    - Reason for this error. This is generally a phrase or sentence that explains
    the cause of the error.

    - Service name. This is the name of the service that resulted in the error. This
    is generally Apache followed by the version number or the daemon name that halted
    the proceedings of this activity and generated an error response.

    - Apache response. This column specifies the corrective action or the reciprocated
    response that was performed by the Web server.


