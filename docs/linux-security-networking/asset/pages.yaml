    # Process Control


    Some of the commands used to control processes running on a Linux computer are
    fury, kill, killall, ps, ptree, and top.


    # fuser


    The fuser command displays the process IDs (PIDs) of processes by using the specified
    files or file systems. The fuser command, when executed, will display a letter
    after each file in the output. These letters indicate the access of the files.
    The letters that you can use for access types are listed here:


    +   * c denotes the current directory.

    * e denotes the executable that is being run.

    * f denotes that it is an open file.

    * r denotes that the file is the root directory.

    * m denotes that the file is mapped or shared.


    The fuser command returns a non-zero return code if none of the specified files
    are accessed—or in case of a fatal error.


    # kill


    The kill command is used to terminate a process. The kill command sends a signal
    to the process that needs to kill. The command must also include the Process IP(pid)
    of the application that needs to be terminated. If somehow the kill command fails
    to terminate an application, then the more forceful -9 signal can'
