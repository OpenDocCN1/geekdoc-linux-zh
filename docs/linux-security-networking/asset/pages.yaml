- pgno: 115
  md: 'The job of an administrator, in relation to system and network administration,
    can be briefly described as follows:


    +   * Managing users and groups on a host and network.

    * Installing, uninstalling, and upgrading software packages.

    * Configuring services and applications on a server or network.

    * Monitoring network performance.

    * Troubleshooting of system and network problems, and disaster recovery.


    In this chapter, you will learn about various commands and tools that are critical
    for the proper administration of a Linux computer. The Linux OS comes with a large
    number of tools for system administrators'' use. In this chapter, I discuss some
    of these tools to show you the various administrative tools available for configuring
    a server.


    # General Administration


    You need to know some basic commands to manage your computer, users, and programs.
    Based on the tasks performed by an administrator, some aspects of administration
    of a Linux computer are listed here:


    +   * Searching information

    * System diagnostics

    * Process control

    * Daemon control

    * Linuxconf

    * Webmin


    In this section, I''ll discuss each of these aspects.'
  merge: -1
