- pgno: 402
  md: '# Building the Kernel


    Next, you need to build the kernel. The steps to build the kernel are as follows:


    +   Select the modules to enable and then generate the dependency files.

    The command to generate the dependency files is as follows

    ```bash

    make dep clean

    ```


    +   Create the kernel image. If you want the image file to be compressed using
    gzip, type the following command:

    ```bash

    make zimage

    ```

    Otherwise, if you want the image file to be compressed using bzip2, execute the
    following command:

    ```bash

    make bImage

    ```


    +   Install kernel modules. To do this, you need to execute the following command:

    ```bash

    make modules modules_install

    ```


    After you perform these steps, you can install the kernel. To install the kernel,
    perform the following steps:


    +   Rename the zimage and bImage to vmlinux<version>. Move this file to the root
    partition. Usually, the kernel is stored in the /boot directory.

    Add the new kernel to the boot manager.

    Create a bootable recovery disk.


    > NOTE The kernel package enables you to automate the kernel building process.
    After you have installed the kernel package, you need to execute this command:

    ```bash

    make -kpkg kernel_zimage

    ```


    The next section discusses the kernel security.'
  merge: -1
  img_proc: true
- pgno: 403
  md: '# Recompiling Kernel


    You might need to recompile kernel after you''ve added some hardware to your Linux
    system. You should also recompile your kernel after the installation process for
    your Linux system is complete.


    Another reason to modify the kernel is to customize some of its data structures
    for your system. Some modifications that you need to perform are increasing the
    number of processes the kernel can support and modifying the size of certain buffers.
    To modify the kernel, you need the kernel source code. You can obtain the source
    code from various sites on the Internet. For users who installed Linux from CD-ROM,
    the source code can be found as part of the distribution.


    Some guidelines to remember while recompiling the kernel are as follows:


    +   * You should check the directory where the kernel will be installed. Some
    sources install kernel to directories given by the kernel version and not to the
    linux directory. You can check the directory where the kernel will be installed
    by issuing the following command:


    ```

    tar -txvf source_filename

    ```


    The preceding command will list all the files and directories that are contained
    in source_filename. If they are to be installed into a directory other than Linux,
    you must make a symbolic link, called linux, in /usr/src directory. This link
    should point to the directory containing the new source.


    +   * Never delete the old source. You might need to recompile your old kernel
    version if the new version doesn''t work properly.


    # Kernel Security


    You can secure kernel by configuring various options during the kernel configuration
    process. Some of these options are discussed here:


    +   * CONFIG_FIREWALL. This option should be set if you intend to run any firewall
    on your Linux computer. If the computer will be used just as a client computer,
    you should specify the no value. If you specify the yes value here, you''ll get
    a packet filter. A packet filter can block network traffic based on type, origin,
    and destination.'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# KERNEL SECURITY


    +   * CONFIG_IP_FORWARD. This option effectively makes your computer a router.
    This option is enabled if you specify the yes value. IP forwarding is not secure
    if your computer is on a network because the data will be directly forwarded from
    one computer to another. If enabled, this option might subvert the firewall on
    your network.


    +   * CONFIG_SYN_COOKIES. This option, if enabled, allows a legitimate user to
    connect by using a challenge protocol known as SYN cookies. TCP/IP networking
    is vulnerable to an attack known as SYN flooding. SYN flooding prevents remote
    users from connecting to your computer during a session.


    +   * CONFIG_IP_FIREWALL. This option enables you to filter packets for the local
    network. You need to assign the yes value to this option to be able to use IP
    masquerading, IP packet logging and accounting, and IP transparent proxying.


    +   * CONFIG_IP_TRANSPARENT_PROXY. This option enables you to redirect local network
    traffic.


    +   * CONFIG_NCPFS_PACKET_SIGNING. This option enables you to secure packets.


    +   * CONFIG_IP_FIREWALL_NETLINK. This option enables you to use the ipchools
    tool to copy packets reaching the Linux firewall to optional user space monitoring
    software. The monitoring software then detects attacks and takes appropriate actions.


    +   * CONFIG_FILTER. This option enables programs to attach a filter to a socket.
    This will enable the kernel to determine whether it should allow or deny data
    through the socket.


    # Applying Kernel Patches


    Incremental upgrades of the kernel are available as patches. Patches are basically
    text files containing a list of differences between two versions of kernels. A
    kernel patch file contains the differences between all files in one version of
    the kernel to the next. The benefit of using patches is that they reduce download
    time and space.


    To apply a patch, you can use the patch command. The patch command expects a file
    as a parameter to which the patch should be applied.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# The patch Command


    The patch command is used to apply a different file to an original file. The syntax
    of the patch command is shown here:


    ```

    patch [options] [originalfile [patchfile]]

    ```


    The patch command takes a patch file called patchfile, which contains a list of
    differences. The differences in the listing are applied to one or more original
    files, producing the patched versions. The patch file contains the file names
    that need to be patched. You also can specify the file to be patched on the command
    line. However, only one file can be specified at a time.


    For example, to patch original_file with patch_file, use the following command:


    ```

    patch original_file patch_file

    ```


    The preceding command applies the patch_file patch to original_file. After the
    command, a file called original_file.orig is created as a backup of the original
    file. Before proceeding further, I''ll discuss the patch command in detail.


    The various options of the patch command are listed here:


    +   -b --backup. This option specifies that, during the patch operation, the original
    should be backed up. When you backup a non-existent file, an empty and unreadable
    backup file is created.


    +   --backup-if-mismatch. This option instructs the patch command to back up a
    file if the patch does not match the file exactly. This is the default, unless
    patch conforms to POSIX.


    +   --no-backup-mismatch. This option instructs the patch command not to back
    up a file if the patch does not match the file exactly. This is the default if
    patch conforms to POSIX.


    +   -P or --prefix=pref. This option specifies the prefix pref to be added to
    a file name when generating its simple patch.


    +   --binary. This option instructs the patch command to read and write all files
    in binary mode, except for standard output and /dev/tty.


    +   -d dir or --directory=dir. This option instructs the patch command to change
    the directory immediately.


    +   -D define or --ifdef=define. This option uses the #ifdef ... #endif construct
    to make changes.'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# SUMMARY Chapter 11


    +   - —dry-run. This option prints the results of applying the patches, with-out
    actually changing any files.


    +   - —e or—ed. This option interprets the patch file as an ed script. ed is a
    text editor utility.


    +   - —E or—remove-empty-files. This option deletes the empty files and directories.


    +   - —g num or—get=num. This option determines the action to be taken for RCS
    and SCCS controlled. In addition, it also controls the patch''s actions when a
    file is read-only and matches the default version.


    +   - —ipatchfile=patchfile. This option reads the patch from patchfile.


    +   - —l or—ignore-whitespace. This option matches the patterns loosely, ignoring
    the whitespaces.


    Another drawback is that you need to apply all the patches to upgrade. For example,
    to upgrade a kernel version that is three versions behind the required version,
    you need to obtain and apply three patches. It is much easier and quicker to obtain
    the entire kernel source again than it is to upgrade.


    # Summary


    In this chapter, we looked at the various aspects of kernel. Kernel is the core
    of the Linux operating system and provides the mechanism for interaction between
    the OS and the underlying hardware. The kernel source code is freely available.
    You can modify and customize the kernel to meet your requirements. Modules provide
    the various functionalities for the kernel depending on your need. In this chapter,
    I discussed the procedure for upgrading and building kernel. I also discussed
    the patches in detail. Patches are incremental upgrades of the kernel.'
  merge: -1
  img_proc: true
