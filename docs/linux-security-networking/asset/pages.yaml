    # Boot Loader Installation


    To start your Red Hat Linux computer without a boot disk, you need to install
    a boot loader. Two of the commonly used boot loaders are GRand Unified Bootloader
    (GRUB) or LiNux LOader (LILO). Introduced with Red Hat Linux 7.2, GRUB is a software
    boot loader that can be used to start Red Linux on your computer. It can also
    start other operating systems, such as Windows 9x.


    If you do not install a boot loader during Linux installation, you need to have
    a boot disk or a third-party boot loader, which will boot the RedHat Linux system.
    When you decide to install a boot loader, you must first determine where it should
    be installed. The boot loader can be installed at two locations:


    +   * The Master Boot Record

    * The first sector of your root partition


    # Master Boot Record (MBR)


    MBR is automatically loaded by the BIOS during system startup. When you install
    boot loader in MBR, the boot loader can take control of the boot process during
    boot itself. Therefore, it is recommended to install boot loader at MBR. However,
    as an exception, you shouldn''t install boot loader at MBR when the MBR is configuring
    to start another operating system. On computers where only Linux is installed,
    install boot loader over MBR.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Chapter 3 LINUX DISTRIBUTIONS AND INSTALLATION


    # The First Sector of the Root Partition


    # GRUB


    GRUB is a boot loader that can load a variety of open source operating systems
    and proprietary operating systems. GRUB is designed to address the complexity
    of starting a computer.


    One of the important features of GRUB is flexibility. GRUB interprets file systems
    and kernel executable formats. You can load the kernel simply by specifying its
    file name and the drive where the kernel resides. To let GRUB know the drive and
    the file name, you can either type them in manually, using the command-line interface,
    or use the menu interface. You can easily select the OS to boot through the menu
    interface. GRUB loads a preexisting configuration file to allow you to customize
    the menu interface.


    The goals of GRUB are listed here:


