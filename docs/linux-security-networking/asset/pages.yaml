- pgno: 433
  md: 'n the last few chapters, I discussed various aggressions that can be targeted
    against your online server, taking preventive measures, and hardening services
    in Linux to defend against such attacks. An equally important part of Linux security
    is data backup, which is an integral part of any security policy. If you have
    a very important piece of information in a document that you want to preserve
    at all costs, a logical solution would be to keep another copy of it! This is
    exactly what data backup is all backups are copies of original data that can be
    used later as a part of a disaster recovery operation. A good backup arrangement
    can save lots of time and money.


    # # Overview


    Data losses can occur for a number of reasons and not just due to network attacks.
    Here are a few possibilities:


    +   * **Hardware failure.** Hardware devices, including your storage devices,
    are prone to failure, either due to manufacturing defects or irregular power supply.
    Such failures can cause data losses.

    * **Unintentional data deletion.** Administrators or other privileged users or
    a system may inadvertently modify or delete critical data.

    * **Erroneous software.** Wrongly configured software or buggy applications can
    cause data loss.

    * **Natural disasters.** Natural disasters such as floods, earthquakes, and so
    on cause damage to network centers and vis-à-vis the stored data.


    Many reasons exist for backing up your data. These include the nature of the Linux
    operating system itself. Linux is a multiuser and multitasking operating system.
    Therefore, many system files can be be open at any given moment and data is written
    to the disk every millisecond. In addition, Linux also maintains information about
    its current state and file systems. When the system comes to an unexpected halt,
    system files and tables can be lost from memory. Therefore, these files should
    be written to the disk frequently.'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# OVERVIEW Chapter 13 407


    Data backups are possible in a variety of ways. An administrator should choose
    a backup plan according to the requirements of the organization. For example,
    an administrator in the computer lab of a computer institute wouldn''t need to
    backup all the sample database, but he would need to backup configuration files
    of different nodes so he can reset computers to their initial stages if needed.
    Similarly, an administrator managing a Web hosting server would be required to
    make backups of not only the configuration files but also the home directories
    of the users, databases, and other related files.


    # Types of Backups


    The backup should be taken at regular intervals. Obviously, the very purpose of
    the backup will be lost if you do not do them regularly. The interval at which
    you will make backups depends on your requirements. For example, if you use a
    Linux machine for your own purposes, you can make a backup when you feel it important.
    If the system is used by many users, it should be decided when and where the backups
    will be made on a regular basis. Based on the requirements, backups are of two
    types:


    +   **Full backup.** This type of backup copies everything on your file system,
    including all files, to the backup media. It does not keep any record of past
    backups. The backup media required for full backups is usually equal to the total
    size of the file system.


    +   **Differential backup.** This type copies only the files that have been modified
    since the last backup.


    +   **Incremental backup.** This type copies only the files that have been modified
    or created since the last full or incremental backup. This type of backup is advisable
    for most systems that have few users, constant Internet access for e-mail or newsgroups,
    and similar changes to file systems.


    # Backup Media


    Similarly, you can choose from a variety of backup media. The media ranges from
    magnetic tapes to removable hard disks, from CD-ROM drives to WORM drives (write
    once, read many), and from cartridge systems to floppy disks. All of these backup
    media offer their own advantages. You can choose the one that is best suited to
    your requirements.'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# 408 Chapter 13 SYSTEM BACKUPS


    When you are connected on a network, the first and foremost backup medium that
    comes to mind is another system on the network. You can also add another hard
    disk to your system and use it as the full backup.


    The most common medium for backups is tape because it is low cost, easy to store,
    portable, and fast. However, its limitation is that you need a tape drive to be
    able to use a tape for taking backup. Alternatively, you can use a removable hard
    disk—for example, Iomega Bernoulli or ZIP drives. These disk platter systems,
    which are kept inside a protective cartridge, can be removed from the main system
    and stored in another location. Many removable cartridges can cost less than the
    tape cartridges. The cost of removable cartridges varies depending on the capacity,
    manufacturer, and technology.


    Magneto-optical cartridge systems are 3.5-inch cartridge systems that fit into
    a small drive unit. These systems provide more security and some of them might
    even cost less than some tape drives. Magneto-optical cartridge systems have a
    potentially longer life. Some of the costlier but higher capacity systems approaching
    2.4GB are also available these days.


    The CD-ROM and WORM drives are also popular but cannot be reused and are only
    used for archival purposes. CDs are used for permanent storage of important files.
    They can hold up to 750MB of data. Finally, you can also use a floppy disk to
    back up small files. The drawback of using floppy disks is that the media is not
    reliable and has very small capacity. You need to handle floppy disks extremely
    carefully because they get corrupted very easily.


    # Automating Backups – Cron


    In systems that support multiple users and where data changes frequently, you
    should schedule the backups after fixed intervals. This scheduling of repetitive
    tasks at a certain time can be done manually by an administrator by maintaining
    manual backup logs for future and history backups. The backup scheduling can be
    automated using the cron facilities to set the exact backup time.


    The cron facilities in Linux place scheduling information in the system crontab
    file in the /etc directory, using the following format:


    ```

    minute hour day month weekday command

    ```'
  merge: -1
  img_proc: true
- pgno: 436
  md: '# OVERVIEW Chapter 13 409


    The minute, hour, day, month, and weekday components of the preceding format can
    be assigned numerical values. For example, day can have values from 1 to 31. You
    can also use wildcards, such as *. Consider the following example:


    ```

    00 15 uuu echo ''Time to make backup and log off''

    ```


    The preceding statement will display the message, Time to make backup and log
    off, every day at 3 P.M. The content of a sample crontab file is given here:


    ```

    SHELL=/bin/bash

    PATH=/sbin:/bin:/usr/sbin:/usr:/usr/bin

    MAILTO=root

    HOME=/

    ```


    ```

    # run-parts

    01 * * * run-parts /etc/cron.hourly

    02 4 * * run-parts /etc/cron.daily

    22 4 * * 0 run-parts /etc/cron.weekly

    42 4 1 * run-parts /etc/cron.monthly

    # sysstat

    0 * * * 0,6 /usr/lib/sa/sa1 600 6 &

    5 19 * * * /usr/lib/sa/sa2 -A &

    ```


    Apart from the crontab file, Red Hat has other subdirectories in the /etc directory.
    Some subdirectories are listed here:


    | | | | | | |

    |---|---|---|---|---|---||

    | drwxr-xr-x | 2 | root | | 4096 | Feb 27 21:45 | cron.daily |

    | drwxr-xr-x | 2 | root | | 4096 | Feb 27 21:20 | cron.hourly |

    | drwxr-xr-x | 2 | root | | 4096 | Aug 8 | 2000 | cron.monthly |

    | drwxr-xr-x | 2 | root | | 4096 | Feb 27 21:24 | cron.weekly |


    These directories contain executables that can be executed on a daily, hourly,
    monthly, or weekly basis. The directory name where the executables are placed
    suggests when it will be executed. For example, an executable placed in the /etc/cron.daily
    directory will be executed daily.'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# Backup Tools


    Linux supports many tools to backup your data; each one has its advantages and
    disadvantages. These are noncommercial tools, which are available in any Linux
    distribution, and they include various command line tools, such as tar and cpio
    and text-based tools such as Amanda.


    # Non-Commercial Backup Tools


    The following tools can either be downloaded freely from the Internet or are available
    by default Linux:


    +   * tar and gzip

    * cpio

    * AMANDA

    * rsync

    * Burt


    The following sections elaborate on these tools.


    # tar


    tar is a command used to save files and directories to an archive medium which
    can be recovered later. As the name indicates, tar (tape archiver) creates an
    archive file, which is a single large entity that holds many files within it.
    The syntax of the tar command is as follows:


    ```

    tar switch modifiers files

    ```


    In the preceding syntax, files are the files or the directories that you need
    to archive. You can archive files, directories, or an entire file system. The
    switch in the preceding syntax determines the way the tar reads or writes to the
    backup media. You can specify only one switch at a time. Table 13-1 explains the
    switches used with the tar command.'
  merge: -1
  img_proc: true
- pgno: 438
  md: '# Table 13-1 tar Switches


    | Switch | Description |

    | --- | --- |

    | c | This switch creates a new archive file. |

    | r | This switch is used to append to an existing archive. |

    | t | This switch is used to list the content of an archive. |

    | u | This switch adds files that are not already archived or modified. |

    | x | This switch is used to extract content from an archive. |


    Modifiers in the tar command control the archive and how tar uses it. Table 13-2
    explains the modifiers used with the tar command.


    # Table 13-2 tar Modifiers


    | Modifier | Description |

    | --- | --- |

    | A | This modifier suppresses the absolute file names. |

    | b | This modifier specifies the blocking factor. |

    | e | This modifier prevents files from splitting. |

    | f | This modifier specifies that the argument is an archive file or a device.
    |

    | F | This modifier is used to specify a filename for tar. |

    | k | This modifier enables you to specify archive volume size in kilobytes. |

    | 1 | This modifier displays an error message for unresolved links. |

    | n | This modifier indicates that the archive media is not a tape. |

    | p | This modifier stores the permissions of files while archiving. |

    | v | This modifier lists files in an archive. |

    | w | This modifier waits for user inputs after displaying archive actions. |

    | z | This modifier specifies the backup media that needs to be compressed with
    gzip. |

    | j | This modifier specifies the backup media that needs to be compressed with
    bzip2. |


    In addition to the switch and modifiers, you can specify some options with the
    tar command. Table 13-3 explains the options used with the tar command.'
