- pgno: 305
  md: 'In Chapter 8, I discussed the Apache Web server in detail. In this chapter,
    I discuss the following additional network servers:


    +   * FTP server

    * Sendmail

    * DNS

    * SAMBA


    # FTP Server


    File Transfer Protocol (FTP) is used to transfer files over the Internet. When
    you download a file from the Internet, you actually transfer the file from a computer
    on the Internet to your computer.


    Wuarchived or wu-ftpd, the most popular ftp daemon for Linux systems on the Internet,
    was developed at Washington University by Chris Myers. While configuring an FTP
    server, you might need to edit the following files:


    +   * /etc/ftpaccess. This file enables users to access the FTP server. You can
    configure this file to enable logical groups to access the FTP server.

    * /etc/fthosts. This file enables or disables access to accounts from various
    hosts.

    * /etc/ftpusers. This file contains a list of users who are not allowed to connect
    to your computer through FTP.


    # Setting the FTP User Account


    FTP has been the target of attacks from hackers. You need to be careful while
    configuring FTP. FTP users should not be given the shell account for security
    reasons. You should not allow FTP users to execute all tasks that normal users
    perform on your Linux system can. This section provides the steps you need to
    follow to create new FTP users.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# FTP SERVER Chapter 9 279


    Start by creating new users in the /etc/passwd file. To do this, execute the fol-lowing
    commands:


    ```

    # mkdir /home/ftp

    # useradd -d /home/ftp/ftpuser2 -s /dev/null

    # passwd ftpuser2

    ```


    The mkdir command creates the /home/ftp directory. This directory will contain
    all FTP users'' home directories. Next, use the useradd command to add a new user
    ftpuser2 to the server. You set the password for ftpuser2 by using the passwd
    command.


    The next step is performed to limit the access of FTP users on your system. To
    do this, you need to edit the /etc/shells file as follows:


    ```

    /bin/bash

    /bin/sh

    /bin/ash

    /bin/bsh

    /bin/tcsh

    /bin/csh

    /dev/null

    ```


    Notice the last statement, /dev/null. This statement will add a non-existent shell.


    Next, you need to edit the /etc/passwd file. The original entry for the ftpuser2
    user is in the /etc/passwd file is shown here:


    ```

    ftpuser2:x:502:502::/home/ftp/ftpuser2:/dev/null

    ```


    The above entry should be modified as follows:


    ```

    ftpuser2:x:502:502::/home/ftp/.ftpuser2:/dev/null

    ```


    The preceding modification needs to be done for every user on a system that requires
    FTP access. After you have the above modifications, a fake shell is created for
    the FTP users, limiting their access to the system.'
  merge: -1
