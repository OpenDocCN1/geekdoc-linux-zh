- pgno: 234
  md: 'As depicted above, the following steps are involved in creating a TCP connection:


    +   1. X ---SYN---> Y

    2. X <---SYN/ACK--- Y

    3. X ---ACK---> Y


    Let me explain each of these steps:


    +   STEP 1. The client informs the server that it requires a connection by setting
    the SYN flag to on. The only purpose of the SYN flag is to inform the server about
    the state of the flag. The server computer also replies to the server that the
    sequence number field is valid. Therefore, the server must check the sequence
    number and note it. The sequence number field in the TCP header is set to its
    ISN Initial Sequence Number (ISN).


    +   STEP 2. The server receives this segment and responds back with its own ISN;
    the SYN flag is set to on. The server also sends back an acknowledgement (ACK)
    as a receipt of the client''s first segment. The value of this ACK is the client''s
    ISN+1.


    +   STEP 3. The client receives the acknowledgement (ACK) for its data as well
    as the server ISN.


    If these three steps complete successfully, the connection is established and
    data transfer may begin.


    When a DOS attacker computer initiates Step 1, however, the scenario changes significantly.
    During Step 2, a space is allocated for the client computer to store the details
    of the connection. In Step 1, while sending SYN to the server, the attacking computer
    spoofs its address and sends a request for a connection with a wrong source address.
    In the second step, the server computer sends the SYN-ACK packet to the wrong
    address. This wrong address must be a non-existent address; otherwise, the attack
    will not be effective for reasons I explain later. The server, however, is now
    in the middle of a nowhere situation. The server is still waiting for the final
    Step 3 ACK packet, which will never come Come. This is a half-open connection
    as displayed in Figure 7-2.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Chapter 7 NETWORK ATTACKS


