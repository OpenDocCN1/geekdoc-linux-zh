- pgno: 242
  md: '# TYPES OF ATTACKS


    Chapter 7 215


    As shown in Figure 7-4, an attacker sends two ICMP ECHO requests (pings) to the
    IP broadcast addresses of two networks simultaneously. Both packets contain spoofed
    IP addresses of the victim computer. All hosts on both the networks will receive
    the ICMP ECHO request and respond by sending an ICMP ECHO reply. Therefore, the
    traffic is multiplied by the number of hosts that respond. If the intermediate
    networks are multi-access broadcast types, potentially thousands of computers
    could reply to each packet.


    A similar attack, "fraggle," sends UDP packets to generate such traffic. The main
    targets of such attacks are IRC servers because they use UDP many times. Two parties
    affected by this kind of attack are the intermediary networks and the victim computer.
    The intermediary networks are affected because they generate high traffic and
    the victim computer is affected because it receives multiple amounts of such traffic.


    # E-Mail Bombing and Spamming


    E-mail bombing happens when abusers repeatedly send identical or very similar
    e-mail messages to a particular address. E-mail spamming is a variant of bombing
    and refers to sending e-mail messages to many users simultaneously. Directing
    these e-mail messages to mailing lists that have a large number of subscribers
    can increase the magnitude of the attack.


    The e-mail messages that are sent contain fake origin or "return-to" addresses.
    Therefore, when the recipient replies to the mail, the mail server is not able
    to reach the bogus address, resulting in the SMTP server leaving the message in
    the pending queue. The SMTP continuously tries to send the message every few seconds,
    until it finally decides to crash the message.


    E-mail bombs may be targeted against specific mail addresses that need only a
    trigger to start a mail war among them. Suppose there are several e-mail addresses
    that have auto-responders or vacation messages set. Let''s say an attacker prepares
    a list of 10 such mail addresses. The attacker sends several e-mails, where recipient
    and sender attribute are chosen from these 10 mail addresses. Upon receiving the
    mail, the recipient mailbox will send an auto-reply to the original recipient.
    When this happens more than two mail addresses, huge amounts of unnecessary network
    traffic can be generated. This grows exponentially as the target of e-mail accounts
    increases. Although methods have been developed to many mail servers are still
    open to them.


    ![](img/a46d40e435b42e09209eb0761898e63c_242_0.png)'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Chapter 7 NETWORK ATTACKS


    E-mail spamming is very difficult to contain because a user with a valid e-mail
    address can send e-mail messages to any other valid e-mail address, newsgroup,
    mailing list, or bulletin board service. It is also very difficult for a computer
    to judge whether the e-mail is a spam or a genuine message.


    When a large number of e-mail messages are directed to or through a single site,
    the site may suffer a Denial of Service attack due to overloaded network connections
    or system crashes. As a result of multiple postings and related log file entries,
    bandwidth and disk space is wasted.


    # E-Mail Spoof Attacks


    E-mail spoofing is defined as disguising the identity of the sender to retrieve
    some crucial information from the victim. The victim receives an e-mail message
    that appears to come from one source when it actually was sent from another source.
    E-mail spoofing is technically a low-level attack, which attempts to fool the
    person accessing an account instead of fooling a computer. Spoof attacks attempt
    to trick the e-mail recipient into releasing sensitive information, such as user
    passwords, and so on.


    A few commonly used tricks take the following form:


    +   - An e-mail message appears to come from your system administrator, asking
    you to tell your account password to make urgent modifications in your profile,
    and so on.

    - An e-mail message is received from an administrator telling a user to change
    his password to a particular string or face account deactivation.

    - An e-mail message arrives claiming to be from a person in authority, requesting
    users to send them a copy of a password file or other sensitive information.


    The basis of the attack lies in the fact that SMTP doesn''t have provisions for
    authenticating the e-mail sender. If proper precautions are not taken, unauthorized
    person can use their SMTP server to relay spoofed e-mail messages.


    # Viruses and Worms


    In Linux and other UNIX-based systems, security controls are a fundamental part
    of the operating system. This precisely means that most users use root aren''t
    allowed to perform tasks freely on the computer. An ordinary user has very limited
    access, and therefore, a virus-infected file that comes into the system using
    the user''s log on session does not have much data to corrupt.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# TOOLS USED FOR ATTACKING NETWORKS


    Chapter 7


    Of the very rare Linux viruses, a popular one is called bliss. This is a decent
    virus that comes with an uninstall option! The virus can''t affect the system
    unless it''s run root.


    Although viruses are not bothersome to Linux users, worms are widely prevalent
    in UNIX-based systems. Ever since the first breakout of the Morris Internet worm
    that caused panic over the world, worms have been appearing often. The Internet
    worm has exploited the vulnerability of the sendmail package. Newer, advanced
    Linux worms exploit minor mistakes in imapd, sendmail, WU-FTPD, and other daemons.


    The reason for the success of worms is that they rely on instant explosions and
    don''t host themselves; they just continue to explode and multiply forever. In
    addition, unlike Dos and other forms of hacking attacks, worms do not target specific
    computers. A worm''s target is “every” computer that is connected to the infected
    network. The effectiveness of a worm is highest when network servers are not up-to-date
    with security patches. Their attack fades gradually as security patches become
    available and people upgrade their software.


    Worms are scripts that replicate themselves. Unlike viruses, however, they do
    not alter other executable programs. Also, worms are different from Trojans because
    they don''t need to be triggered by users. Worms are closed programs or scripts
    that spread themselves using networks, attack systems, or other programs without
    changing them in any way. They typically use networks to accomplish this. The
    worm reportedly gained access to more than 6,000 UNIX systems flooded the Internet
    with so many access requests that it became unusable. However, such worms are
    no longer as common as they once were.


    # Tools Used for Attacking Networks


    Network tools are sophisticated software applications that are widely available
    on the Internet. These tools are packaged with user-friendly interfaces. As a
    result, even a novice can use them to attack another computer. These tools also
    take assistance from various other computers that have the same tools installed.
    Such tools are called distributed-system attack tools. Offenders can involve a
    large number of tool installations and use the resources on those computers to
    focus on all of them to attack one or more victim computers or networks. In this
    section, I explain some of these tools and explore how they can be used for attacking
    networks.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Chapter 7 NETWORK ATTACKS


    # Trinoo


    Trinoo is software that can be used to hurl coordinated DoS attacks against remote
    servers. The tool allows a user to launch a coordinated UDP flood to the victim
    computer, which results in DoS to its legitimate users due to connectivity overload.
    As the tool is widely used, it is able to strengthen the attack. A typical Trinoo
    attack team can include a few servers and a large number of client computers on
    the Trinoo daemon is running.


    The tool is very easy to use, and an attacker using it doesn''t need to be a networking
    guru. An offending computer can instruct one of many Trinoo servers to open a
    DoS attack against a particular computer. After the attack is opened, the Trinoo
    master searches for as many client Trinoos as possible and directs them to UDP
    flood one or more IP addresses of the victim computer.


    A typical Trinoo attack can be divided into four steps:


    +   1. An intruder connects to the master on port 27665/tcp and provides attack
    details.

    2. A master connects to many daemons on port 27444/udp.

    3. Multiple daemons propagate UDP floods to the target computers with random destination
    ports. The binary for the Trinoo daemon contains IP addresses for one or more
    Trinoo masters.

    4. The daemon announces the availability of Trinoo upon its execution. The daemon
    does this by sending a UDP packet that has the string *HELLO*. This string is
    sent to the Trinoo master''s IP address.


    The Trinoo master stores a list of known daemons in an encrypted file named (dot-dot).
    This file and the master binary are stored in the same directory. You can configure
    the Trinoo master so that it sends requests to the daemons to determine the daemon''s
    availability. Daemons respond to these requests by sending UDP packets back to
    the Trinoo master. The UDP packets contains the string PONG.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Trinoo operates on a set of standards, a few of which are known and have been
    listed in Table 7-2.


    Table 7-2: Standards for Operating Trinoo

    | Application | Type | Port |

    |---|---|---|n| Trinoo Master Server | TCP | 27665 |

    | Trinoo Master Server | UDP | 31335 |

    | Trinoo Daemon | UDP | 27444 |


    Before an attack can be announced by the master server to other Trinoo client
    daemons, an attacker requires a password to connect to a master Trinoo server.
    Trinoo does not separately maintain a password database for attackers. Instead,
    it maintains encrypted passwords hidden within the main executable. The master
    server listens on the port 27665 on TCP to allow an attacker to connect to the
    Trinoo service. Another master server runs on the port 31335 on UDP, but this
    master listens only to Trinoo client computers. Trino client daemons run on the
    port 27444 on UDP.


    There are a variety of Trinoo variants available on the Internet today. Some are
    known to implement IP spoofing for Trinoo clients, while others are simple flooders.
    Even without IP spoofing, the attack comes simultaneously from many computers.
    Finally, Trinoo daemons amass disguise themselves under many names but the most
    commonly used ones are ns, http, rpc.trino, trix, rpc.irix, and irix.


    # Tribe Flood Network (TFN)


    TFN attack is an advanced DoS attack tool that can initiate coordinated Dos attacks
    from one or more sources to one or more destinations. Tribe Flood Attack supports
    many methods of attack in addition to the UDP floods supported by Trino. TFN also
    supports TCP SYN floods, ICMP ECHO request floods, ICMP-directed broadcast DoS
    attacks, and spoofing of IP addresses.


    A TFN network can employ hundreds of TFN clients and masters to initiate an attack
    against a particular computer. TFN provides a command-line interface to send various
    commands to TFN daemons. TFN masters communicate with TFN daemons by encapsulating
    the commands within ICMP ECHO reply packets. Two'
  merge: -1
