- pgno: 398
  md: '# MODULES Chapter 11 37


    +   - Modules. The Linux module code is available in the kernel and modules package.
    The kernel/modules.c file contains the kernel code. The include/linux/module.h
    file contains the data structures. The include/linux/kerneld.h file contains the
    kerneld daemon messages.


    Kernel has a modular structure. Various functions and features of kernel are available
    through the use of modules. I discuss modules in the next section.


    # Modules


    A module is an object file containing functions for interfacing with a particular
    device or performing particular tasks. The use of modules makes kernel smaller
    and keeps only the bare basics compiled into the kernel. Modules have also revolutionized
    the kernel compilation. You no longer need to compile every driver into kernel.
    You can simply enable or disable the modules, as per your requirements.


    The functionality of modules is used by the kernel while communicating with a
    program called kerneld, which is run at boot time. When the kernel receives a
    request for use of a module, kernel checks whether the module is loaded in memory.
    If it is not loaded, the kernel loads the module into memory. kerneld also remove
    a module if it has not been used for a specific period of time, which is configurable.


    The concept of modules is advantageous, but you should be aware of the following:


    +   - Frequently used devices and the devices required during boot process, should
    not be used as modules. These devices must be compiled into the kernel.

    - If you compile a module into the kernel, it might use more memory. However,
    this is better than a system that uses its CPU and IO resources to constantly
    load and unload modules.

    - You should modularize devices, such as the floppy disk, CD-ROM, and parallel
    port. Either these devices are not used very often, or they are used only for
    a short period.

    - You should not modularize frequently used modules.'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# Chapter 11 THE LINUX KERNEL


    After learning about the kernel compilation and how useful modules can be, it''s
    time to discuss how to build kernels.


    # Building Kernel


    The Linux kernel contains the drivers for various hardware and file systems. Each
    hardware component on a Linux system has its own module. If you add hardware to
    your computer, you need to add the corresponding module to the kernel. You also
    might want to enable or disable a module. You can do this by using the modprobe
    command.


    Making changes to the kernel is a three-step process:


    +   - Editing the kernel, which includes adding or removing modules

    - Building or compiling the kernel

    - Installing the kernel


    Before reconfiguring the kernel, you should save the current settings. This will
    enable you to recover your settings, just in case you make mistakes while recon-figuring
    kernel.


    # Obtaining Kernel and Module Information


    The kernel configuration is determined by the modules that are available. To view
    the list of currently loaded modules, execute the following command:


    ```

    modprobe -1

    ```


    The sample output of the preceding command to view the list of modules is given
    here:


    ```

    /lib/modules/2.2.16-22/fs/autofs.o

    /lib/modules/2.2.16-22/fs/binfmt_aout.o

    /lib/modules/2.2.16-22/fs/binfmt_java.o

    /lib/modules/2.2.16-22/fs/binfmt_misc.o

    /lib/modules/2.2.16-22/fs/coda.o

    /lib/modules/2.2.16-22/fs/fat.o

    /lib/modules/2.2.16-22/fs/hfs.o

    /lib/modules/2.2.16-22/fs/hpfms.o

    /lib/modules/2.2.16-22/fs/lockd.o

    ```'
  merge: -1
  img_proc: true
- pgno: 400
  md: '```

    /lib/modules/2.2.16-22/fs/minix.c

    ```


    You might want to obtain the version of the kernel you are using. The command

    to do so is as follows:


    ```

    uname -r

    ```


    # Preparing to Build a Kernel


    Before you actually start building the kernel, you should perform the following

    steps:


    +   Prepare a bootable recovery disk. This will be helpful if the kernel

    does''t work properly after you build it. By using the recovery disk,

    can restart the system and rectify the problem.


    +   Make a backup of the kernel. After you have done this, provide an entry

    for the backed up kernel in the boot manager.


    # Selecting Modules


    Next, you need to select modules to be enabled or deselect modules to be disabled.

    The steps to do this are:


    +   Log on as root user and move to the /usr/src/linux directory.


    +   Open a kernel-editing tool. Two commonly used editing tools are as fol-\lows:


    +   menuconfig. The interface of the menuconfig tool is displayed in

    Figure 11-1.'
