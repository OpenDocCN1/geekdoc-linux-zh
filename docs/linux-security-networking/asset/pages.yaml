- pgno: 395
  md: 'The kernel is the core of the Linux operating system. It controls the basic
    services offered by the Linux operating system. The kernel is responsible for
    the following:


    +   * CPU resource scheduling

    * Process management

    * Memory management

    * Device control, as well as the device-file and device-driver interface

    * Security at the device, process, and user level

    * Accounting services including CPU usage and disk quotas

    * Inter process communication


    The kernel acts as an interface for your programs and system. It performs memory
    management tasks for all the running processes and ensures that each process gets
    the required amount of processor time.


    Linux comes with the source code of the kernel. The source enables the system
    administrators to customize the kernel according to their requirements. You might
    need to customize kernel for reasons such as:


    +   * Modification in the system hardware

    * Optimization of memory usage

    * Improvement in the speed and performance of the system


    A naming convention is followed for Linux kernel sources. A version with an even
    number is stable, and odd numbered kernels are unstable. The Linux kernels that
    are being developed support all the available functionalities of the existing
    kernels. These kernels are sometimes unstable. You should always make backups
    of your data if you intend to use such developing kernels.


    The kernel is stored in the /usr/src/linux directory. The source code of the kernel
    is spread across various subdirectories of /usr/src/linux. Descriptions of some
    important subdirectories of /usr/src/linux are as follows:'
