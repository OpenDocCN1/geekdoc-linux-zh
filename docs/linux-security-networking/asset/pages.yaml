- pgno: 93
  md: 'starts the default operating system. When LILO boots the system, it uses BIOS
    calls to load the Linux kernel off the disk. This means that the kernel should
    be accessible by the BIOS.


    If you need to exceed the 1024 cylinder limit for the /boot option, you should
    use the LBA32 option of LILO. If you have a system that supports the LBA32 extension
    for starting operating systems above the 1024 cylinder limit, you should place
    your /boot partition above this limit. If the installation program has not already
    detected this extension from your BIOS, you should select this option.


    LILO does not read the file during booting. The pathnames in lilo.conf are resolved
    during the installation time. This happens when the /sbin/lilo file is invoked.
    During installation, the program builds the tables that list some sectors. These
    sectors are used by the files that load the operating system, which means that
    these files should be in a partition that is accessible by BIOS. The files are
    usually located in the /boot directory. Therefore, only the root partition of
    your Linux system needs to be accessed through the BIOS.


    You need to reinstall the loader whenever any modification is made to the LILO
    setup. The LILO should be reinstalled when you compile the kernel. The lilo.conf
    file has a boot directive. This directive tells LILO about the location of the
    primary boot loader. The location can be either of these two:


    +   ◆ MBR

    ◆ Root partition of Linux


    If more than one OS is installed on your computer, you should specify the root
    partition as bootable. This can be done by using the fdisk command (with -a option)
    and the cfdisk command (with -b option).


    You may install LILO to MBR even if you already have another operating system
    installed. For example, if you have installed Windows NT 4.0 as the first operating
    system on your computer, NT''s boot loader will be placed into MBR. Therefore,
    when you install LILO to MBR, LILO rewrites the NT''s boot loader. Now when you
    start the computer, you will not be able to boot NT. You can solve this problem
    by editing the /etc/lilo.conf file and adding a new entry for NT. When you restart
    your system, there will be a new added NT entry under the LILO menu.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'The linear keyword available in the lilo.conf file helps you solve the disk
    geometry related problems. The linear keyword directs the LILO to use the linear
    sector addresses. Otherwise, LILO uses the sector, head, or cylinder tuples. The
    linear keyword delays the conversion of linear sector addresses to 3-D addresses
    till the runtime.


    # NOTE


    If you have more than one hard disk and Linux uses only some of them, you can
    configure BIOS so that they are detected. This will cause quick detection of disks
    and therefore, Linux will boot faster.


    During boot process, the LILO prompt is displayed to you. You can view the configuration
    option available in LILO by pressing the Tab key. While booting Linux kernel,
    you can specify various command-line arguments that are acceptable for kernel.
    A few command-line arguments are given in the following list:


    +   - root. This enables you to specify the Linux kernel to mount as root partition
    different from the one appearing in /lilo.conf.

    - init. This enables you to execute a command other than /sbin/init, specified
    on the command line.

    - number. This enables init to run at the specified run level.


    # SMP Motherboards


    If you are using an SMP motherboard, two files are created by the installation
    program: /boot/grub/grub.conf and /etc/lilo.conf. The entry created on the boot
    loader you have installed.


    The grub.conf file has the following entries:


    +   - Red Hat Linux (Kernel version)

    - Red Hat Linux (Kernel version-SMP)


    The Red Hat Linux (Kernel version-SMP) boots by default. You can also boot the
    Red Hat Linux (kernel version). However, this should be done when there is some
    problem with the SMP kernel. This allows you to retain all functionality. In contrast,
