    One drawback associated with the password suite is that it is not secure. Users
    have read permission to the passwd file, which could prove to be a security hole.
    You can solve this problem by using Shadow suite. The Shadow suite helps you secure
    your passwords more efficiently.


    # Shadow Suite


    The Shadow suite stores the passwords to another file: /etc/shadow. No user has
    the read permission for the shadow file. Only the root user has read and write
    access for the file. Moving the passwords to the /etc/shadow file prevents hackers
    from gaining access to them.


    The Shadow suite enables you to do the following:


    +   * Set logon defaults using the configuration file, /etc/login.defs

    * Manage users and groups

    * Manage passwords and accounts


    You should not use the Shadow suite in the following situations:


    +   * User accounts are not stored in the computer.

    * The computer is using Network Information Services (NIS) to receive usernames
    and passwords or supply them to other machines on the network.'
