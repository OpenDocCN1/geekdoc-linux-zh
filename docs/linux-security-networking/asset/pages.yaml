- pgno: 126
  md: '# GENERAL ADMINISTRATION Chapter 4 99


    be used to terminate the application forcefully. kill is a forceful way to terminate
    a process. If you do not specify a signal with the kill command, the TERM signal
    is sent. The processes that don''t catch this signal are killed by the TERM signal.
    Programs similar to kill are available in modern shells.


    # killall


    The killall command kills processes by name. This command sends a signal to all
    running processes. If no signal name is specified, SIGTERM is. Signals can be
    specified either by name or by number. For example, a signal specified by name
    can be written as -HUP, and a signal specified by number can be -1. HUP and 1
    are the same. Signal 0 can be specified only by number. If you specify a slash
    with the command, it will kill the process that is executed from a specified file.
    The killall command will return a non-zero value if no process is killed.


