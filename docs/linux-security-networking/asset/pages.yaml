- pgno: 182
  md: '# PLUGGABLE AUTHENTICATION MODULES (PAM)


    # Chapter 5 155


    # # Pluggable Authentication Modules

    (PAM)


    Traditionally, users of UNIX-based systems are authenticated by the password encryption
    method. The password provided by the user is encrypted using a specific value.
    The encrypted password is then matched with another encrypted password stored
    in a file. If both encrypted forms of the passwords match, the user is authenticated.


    After a user is authenticated, various privileges are granted to the user, based
    on the UID. This UID is used by the system to determine the user''s permissions
    for services and applications. However, these methods are vulnerable to attacks
    from hackers. There are many tools and applications available to make your system
    secure. One such tool is Pluggable Authentication Modules (PAM) for Linux. PAM
    is a suite of shared libraries that the system administrators to determine the
    way in which users will be authenticated.


    PAM enables you to separate development of privileges granting software from the
    development of secure and appropriate authentication schemes. This is possible
    because PAM provides a library of shared functions that an application can use
    to authenticate users. The library is configured with the /etc/pam.conf file,
    or the /etc/pam.d directory. The /etc/pam.d directory contains various configuration
    files for PAM. The modules that are used to authenticate users are located in
    the /usr/lib/security directory and are loaded dynamically.


    Linux PAM supports four types of modules:


    +   * Authentication. This module provides two aspects of user authentication.
    First, it establishes the identity of the user by directing the applications to
    accept passwords or other identity details from the users. Next, the module grants
    permissions and group membership to the user.


    +   * Account. This module performs account management. It can be used to perform
    tasks, such as granting permission for files and directories based on the time
    and day configured, maximum number of users allowed to logon at a time, and so
    on.


    +   * Session. This module manages tasks, such as maintaining logs and other information,
    after a session is established with a user. The module works until the session
    remains active.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Chapter 5 ENCRYPTION AND AUTHENTICATION


    * Password. This module is required for updating the authentication token associated
    with the user.


    The module that PAM calls for an application is determined by the configuration
    file. An application''s configuration file is stored in the /etc/pam.d/ directory.
    The pam.conf is the configuration file for PAM, which is discussed in the next
    section.


    # # /etc/pam.conf File


    PAM can be configured in the /etc/pam.conf file or the /etc/pam.d directory. I''ll
    now discuss the structure of the pam.conf file. The general entry in pam.conf
    has the following format:


    ```

    [service-name] [module-type] [control-flag] [module-path] [arguments]

    ```


    Each of these arguments is discussed in the subsequent sections.


    # ## service_name


    This argument specifies the service or the application associated with the given
    configuration entry. By using this parameter, you can select services, such as
    ftppd, rlogind, and su.


    It is difficult to create an entry for all the services and applications that
    exist on your system. A general entry in pam.conf can be created to determine
    the default authentication scheme for services and applications other than those
    specified in the file. For the general entry, the [service_name] parameter will
    be OTHER, which can be written either in upper- or lowercase. If an entry already
    exists for a service or an application, the OTHER entry will be ignored.


    # ## module_type


    This argument can have one of the four listed values:


    +   * auth (for authentication module)

    * account (for account module)

    * session (for session module)

    * password (for password module)'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# [control_flag]


    The control_flag specifies the action to be performed on success or failure of
    modules. Modules of similar type are stacked over one another and they are assigned
    priority by the control_flags. The execution order of these modules is specified
    in the /etc/pam.conf file. The earliest listed entries will be executed first.


    The syntax of the control flag is displayed here:


    ```

    value1 = action1 value2 = action2

    ```


    This syntax gives the administrator greater control over the user authentication
    process.


