    # whereis


    The whereis command locates the binary, source, and manual page files for a command.
    The supplied names are first stripped of leading pathname components and any trailing
    extension. whereis then locates the desired program in a list of system directories
    in your Linux computer.


    If you execute the following command:


    ```

    whereis

    ```


    the following output is displayed:


    ```

    whereis: /usr/bin/whereis

    ```


    # updatedb


    The updatedb program updates the locate database. Updatedb is simply a link to
    locate, which implies the -u option.


    An example of the usage of updatedb is displayed here:


    ```

    updatedb -uv

    ```


    # System Diagnostics


    Various commands are available for system diagnostics. These commands enable you
    to obtain information about your computer—for example, the amount of disk space
    being used. Some system diagnostics commands are df, du, free, ipcs, tload, runlevel,
    and vmstat. These commands are explained in detail in this section.'
