- pgno: 310
  md: '# FTP SERVER Chapter 9 283


    The following directives are used to specify whether real and guest users have
    access outside their home directories on the FTP server:


    ```

    restricted-uid <uid-range> [...]

    restricted-gid <gid-range> [...]

    unrestricted-uid <uid-range> [...]

    unrestricted-gid <gid-range> [...]

    ```


    The site-exec-max-lines directive is used to limit the number of lines to send
    to a remote client:


    ```

    site-exec-max-lines <number> <class> ...

    ```


    The ftppass file specifies which users can access the FTP server. In ftppass,
    you can define the activities that can be performed by a user. The content of
    a sample ftppass file is shown here:


    ```

    class all real,guest,anonymous *

    email root@localhost

    loginfails 5

    readme README* login

    readme README* cwd=

    message /welcome.msg login

    message .message cwd=

    compress yes all

    tar yes all

    chmod no guest,anonymous

    delete no guest,anonymous

    overwrite no guest,anonymous

    rename no guest,anonymous

    log transfers anonymous, real inbound, outbound

    shutdown /etc/shutdown

    passwd-check rfc822 warn

    ```


    In the preceding extract, you first set the class to allow local and remote access
    from all addresses. This can be customized depending upon your requirements. You
    can specify all of your guest groups, one per line. You should log all for security
    purposes as shown here:


    ```

    log commands real,anonymous,guest

    log transfers guest,anonymous, real inbound, outbound

    ```'
