- pgno: 367
  md: '# 340 Chapter 10 LINUX NETWORK DEFENSE AND INTRUSION DETECTION


    # Connection Layer


    The connection layer runs over the user authentication layer. This layer allows
    opening secure channels over a single SSH connection. These channels can be used
    for a wide variety of services, such as transparent tunneling of existing protocols
    and new ones. It provides interactive login sessions, remote execution of commands,
    forwarded TCP/IP connections, and forwarded X11 connections.


    Although this protocol is used mostly as a replacement for RSH command, it is
    much more flexible. It can wrap and forward any other protocol, for example X11,
    making it secure. X11 protocol has its own means of data protection, but SSH tunneling
    or forwarding is much more secure.


    A single secure connection can hold multiple sessions. These sessions are called
    channels. The connection layer creates multiple channels using time multiplexing.
    Therefore, opening many connections is not recommended unless there is enough
    bandwidth. SSH protocol suite is designed in such a way that new protocols can
    be added any time and will coexist with those listed previously.


    # Intrusion Detection


    Intruders attack and harm your system, data, and business interests. As system
    administrator, it is your duty to be able to detect such intrusion attempts and
    avoid them. You should be aware of the security measures that you can take to
    protect your system and data. The process of identifying attack from users is
    known as Intrusion Detection. There are various tools and software available in
    the market that enable you to catch intrusion and prevent it. In addition, you
    can take some security measures to avoid intrusion. The collection of such intrusion
    detection tools and security measures is called Intrusion Detection System (IDS).


    There are various types of mechanisms available for intrusion detection:


    +   * Network Based Intrusion Detection. This mechanism consists of tools that
    search for patterns indicating attempted intrusion in the network.


    +   * Host Based Intrusion Detection. This mechanism involves performing intrusion
    detection checks on each host on your network. You need to look for signs of intrusion,
    such as suspicious entries in the log file. This mechanism involves lots of overhead.
    Therefore, the administrators do not prefer it.'
  merge: -1
  img_proc: true
