- pgno: 64
  md: '# ACCOUNT SECURITY


    Chapter 2


    Log files can grow quite large, especially on servers. To prevent a log file from
    filling up all available space in your data partition and crashing your system,
    either limit the log files to a maximum size or move the log files to a separate
    partition containing only log files.


    # Securing the File System


    You can restrict a user''s access to files by setting the file system security.
    The read and write permissions for the system files and directories should not
    be provided to all the users and groups. The permissions on system files and directories
    should be granted as per user requirements. You need to ensure that unauthorized
    users are not able to view or modify the files in the Linux system. You can assign
    access permissions to users and groups on the files and directories.


    UNIX manages access control on files and directories according to three permissions:
    read, write, and execute. You can assign file-level and directory-level permissions
    to users, owners, and others. These permissions listed here:


    +   - The read permission enables you to view and read the contents of a file.
    You cannot modify or delete the file.


    +   - The write permission enables you to modify a file by adding or deleting
    contents of the file. You can also move the files in a directory.


    +   - The execute permission enables you to run the binary code or shell script.


    If you need to share a system with other users, you can assign permissions to
    other users depending upon the level of need and trust. You should identify and
    grant the exact degree of authority users will need.


    Preparing and planning the file system before putting your systems on line can
    help to protect the systems and the data stored on them. Here are some issues
    you need to address:


    +   - The SUID or the SGID programs should not be executed from the home directories
    of the users. This can be done by using the nodev and noexec options on the home
    directories. These options prevent the execution of these programs.


    +   - If you are using NFS to export the file system, access to the /etc/exports
    file should be very restrictive. Similarly, the umask settings for file creation
    should be restrictive.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Chapter 2 LINUX SECURITY: AN OVERVIEW


    +   - The records containing user login details, such as time and place of logon,
    are stored in the /log/wtmp and /run/utmp files. You should check these files
    to look for the logon attempts of intruders.


    +   - The SUID and SGID permissions to users and groups to files in your system
    should be provided as per their requirements. Misuse of these permissions can
    harm your system. This is because these permissions grant special privileges to
    the users. Using the SUID programs to gain entry in your system is a common practice
    among hackers. Therefore, you should monitor these permissions regularly. You
    can change the SUID and SGID permissions by using the chmod command. You can restore
    the permissions if necessary, however. The syntax of the chmod command is as follows:

    ```bash

    chmod [ugo.] [+=] [rwx]

    ```


    The [uoga] option in the preceding syntax determines the permission to be set
    for the user who owns the file (u), users in the file''s group (g), other users
    not in the file''s group (o), and all users (a). The [+=] options are used to
    add or remove permissions. You can assign permissions (+), remove permissions
    (-), or specify the only available permissions (=). The read (r), write (w), and
    execute (x) are permissions assigned to users or groups. The read, write, and
    execute permissions can be numerically represented by the numbers 4, 2, and 1,
    respectively. Therefore, 6 would represent (4) and write (2) permissions. Consider
    this command:


    ```

    chmod 664 test.txt

    ```


    This command is equivalent to the following command:

    ```bash

    chmod u+rw g+w o+r test.txt

    ```


    +   - The files that have write permissions for all the users can prove to be
    a major security hole in your network. The hackers can easily modify these files
    and use them to harm your system. You should look for such files in your system
    and remove the global write permissions on these files. Here is the command to
    search for files:

    ```bash

    root find / -perm -2 ! -type 1 -ls

    ```


    +   - Look for files in your system that have no ownership. There is a possibility
    that these files might have been dropped in your system by the hackers. You can
    find such unwanted files with the following command:

    ```bash

    root find / -nouser -o -nogroup -print

    ```'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# ACCOUNT SECURITY


    +   The .rhosts file is used by the remote users to log on to your systems.

    This file should be securely configured as per your requirements. You can locate
    the .rhosts file by executing the following command:


    ```

    root# find /home -name .rhosts -print

    ```


    +   The permission on the system files should be assigned as per your requirements.
    Assigning read or write permissions to unauthorized users might cause problems.


    # Setting umask


    The umask command can be used to set the file creation mode. The permissions attached
    to the file system are very critical from the security point of view. The read
    or write permissions should be assigned carefully. The settings you specify through
    the umask command apply to all users. This is because these settings are saved
    in the /etc/profile file. The umask is the octal complement of the file mask.
    You can calculate the mask by deleting the desired mask from 777. If you provide
    umask of 777, no user will have the read, write, or execute permission. The umask
    of the root should be 777. Doing this will disable read, write, and execute permission
    for other users. The permission for a user or group can be changed by the chmod
    command.


    Table 2-1 gives the description of various file permissions as obtained by executing
    the ls -1 command.


    | Table 2-1: File Permissions |

    | Permission | Description |

    | --- | --- |

    | -r | Allows read access to the owner of the file. |

    | -w | Allows the owner to modify or delete the file. |

    | -x | Enables the owner to execute the program. |

    | -s | Execute with effective User ID. |

    | -S | Execute with effective Group ID. |

    | -rw--T | Disable the update of the last modified time. This kind of permission
    is usually required for swap files. |'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Chapter 2 LINUX SECURITY: AN OVERVIEW


    Table 2-2 gives the description of various directory permissions as obtained by
    executing the ls -1 command.


    | Permission | Description |

    |--- |--- |

    | dr- | Enables you to list the contents of the directory. However, you cannot
    read the file attributes. |

    | d-x | Enables you to enter the directory and use it in full execution paths.
    |

    | d-x-t | Prevents files from being deleted by others with write access. This
    permission is usually used on /tmp. |


    > NOTE

    * System files should be owned by the root.

    * System files normally are created in the mode 640. You can change this mode
    as per your requirements.

    * Users and groups other than root should not have write permission on the system
    files.


