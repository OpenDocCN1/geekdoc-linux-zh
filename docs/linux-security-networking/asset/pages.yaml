    \ ID of the Calling Web server.\n- Enabling SSI for .html or .htm files can be\
    \ risky. SSI-enabled files should have a separate extension, such as the conventional\
    \ .shtml. This helps you minimize the server load and manage your files.\n- Disable\
    \ the ability to run scripts and programs from SSI pages. To do this, replace\
    \ Includes with IncludesNOEXEC in the Options directive.\n\nYou should consider\
    \ limiting CGI to specific directories. Doing this enables administrators to control\
    \ these directories. The users who have write access to these directories should\
    \ be trusted. In addition, the administrator should test each new CGI script or\
    \ program for potential security holes.\n\n# Default Access\n\nThe Apache Web\
    \ server provides default access. This means the server can walk through the entire\
    \ file system to serve a client request. To work around this, add the following\
    \ entry to the server configuration:\n\n```\n<Directory />\n  Order Deny,Allow\n\
    \  Deny from all\n</Directory>\n```"
