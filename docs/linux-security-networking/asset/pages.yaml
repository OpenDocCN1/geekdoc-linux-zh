  md: '# Chapter 13 SYSTEM BACKUPS


    # Burt


    Burt, the backup and recovery tool, is an extension of Tcl/Tk 8.0 designed to
    perform backups and recoveries for a wide variety of data sources. It provides
    an interactive user interface built using Tcl, which provides greater flexibility
    for administration. The main feature of Burt is that it provides an I/O engine
    built in a powerful scripting language that solves many problems related to backups
    of large installations.


    Most of today''s network installations run a wide variety of operating systems.
    Most users want to store data on their hard disks. In addition, in our fast-paced
    world, network administrators are under constant pressure to increase backup speeds.
    Burt is made to address these issues. The main features of Burt are as follows:


    +   - Allows you to store and track data on long term media, such as tapes

    - Allows maximum integrity and reliability of stored data on the backup medium

    - Provides a mechanism to run backups unattended

    - Allows the administrator to create a completely custom interface

    - Allows parallel streams of data backup to run directly to the tape provider
    faster backups


    # Commercial Backup Tools


    Apart from the tools freely available, certain backup tools are available commercially.
    These include the following:


    +   - BRU

    - Backup Professional

    - CTAR

    - Arkeia

    - Legato NetWorker

    - EssentialServer


