- pgno: 366
  md: '# SSH Chapter 10 339


    +   * IDEA in CBC mode

    * CAST-128 in CBC mode


    The transport layer protects data integrity by by including a MAC with each message,
    computed from the contents of a packet.


    Public key algorithms are used for server authentication. The following public
    key formats are currently defined:


    +   * Simple DES

    * X.509 certificates

    * SPKI certificates

    * OpenPGP certification


    # User Authentication Layer


    The user authentication layer runs over Transport layer protocol. This layer authenticates
    a client to a server. SSH user authentication protocol relies on the transport
    layer for data integrity. It also assumes that the transport protocol already
    has authenticated a server machine, established an encrypted communication channel,
    and computed a unique session identifier for that session.


    SSH supports the following authentication methods:


    +   * No authentication

    * Public key authentication

    * Password authentication

    * Host-based authentication


    Server initiates the authentication process, which goes through the following
    stages:


    +   * Server sends a list of supported authentication methods to the client.

    * Client chooses the most convenient method for the current application and returns
    its name to the server. Further exchange of messages depends on the authentication
    method chosen.

    * If the server accepts the authentication request, it sends a message to the
    client and starts the requested service.'
  merge: -1
