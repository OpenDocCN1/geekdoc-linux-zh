- pgno: 519
  md: '# LINUX SECURITY


    # Prevent a cyber attack on your company!


    Electronic commerce has become a significant part of business. As more companies
    are moving to the Web, there is a growing need to ensure the security of the servers.
    Viruses and hackers aren''t the only threats; with e-commerce, the illegitimate
    use of information is also a major concern. The Linux operation system is widely
    used for networking and software development. It includes features to identify
    and control breaches of security, both internal and external. Linux Security gives
    you the knowledge to maximize the benefits of Linux products, keep your business
    safe, and gain a competitive edge!


    This book will show you how to:


    +   * Detect intrusion of your network and assess system vulnerabilities

    * Protect user account and strengthen authentication procedures

    * Reduce exposure to threats by providing accounts and file system security


    Start by learning the basics of Linux security technologies and then move on to
    discovering the practical and real-life uses of the products. Check your understanding
    with practice questions at the end of each chapter.


    ![](img/a46d40e435b42e09209eb0761898e63c_519_0.png)'
