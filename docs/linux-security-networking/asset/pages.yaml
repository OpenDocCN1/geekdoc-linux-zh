  md: 'bytes of binary values are embedded in the ID field and the parameters are
    embedded in the data portion. Using TFN isn''t as easy as using Trino, but with
    a few trials, intermediate network users can determine ways of controlling TFN.

    In order to use TFN, the TFN master requires an attacker to provide a list of
    daemon IPs. The TFN program cannot search a network for client daemons automatically.
    However, other independent utilities are available on the Internet to do this
