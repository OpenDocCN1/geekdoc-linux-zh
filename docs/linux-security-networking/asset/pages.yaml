  md: '# LINUX FILE SYSTEMS


    Chapter 3


    +   - /dev/ht0. This file represents the first IDE tape drive. Subsequent drives
    are numbered ht1, ht2, and so on.


    +   - /dev/js0. This file is the first analog joystick. Subsequent joysticks are
    numbered js1, js2, and so on. Digital joysticks are called djs0, djs1, and so
    on. These are character devices.


    +   - /dev/lp0. This file is the first parallel printer device. Subsequent printers
    are numbered lp1, lp2, and so on.


    +   - /dev/loop0. This file is the first loopback device. Loopback devices are
    used for mounting file systems that are not located on other block devices, as
    disks. For example, if you want to mount an iso9660 CD-ROM image without burning
    it to CD, you need to use a loopback device. This is usually transparent to the
    user and is handled with the mount command.


    +   - /dev/md0. This file is the first metadisk group. Metad are related to Redundant
    Array of Independent Disks (RAID) devices. Metad devices are block devices beginning
    at 0 and numbered sequentially.


    +   - /dev/mixer. This file is part of the Open Sound System (OSS) driver. It
    is a character device.


    +   - /dev/null. This file is like a black hole to which you can send data. This
    data is never seen again. Anything sent to /dev/null will be permanently deleted.
    This can be useful, for example, if you want to run a command but not have any
    feedback on the terminal. It is a character device.


    +   - /dev/psaux. This file is the PS/2 mouse port. This is a character device.


    +   - /dev/pda. These files represent parallel port IDE disks. Their names are
    similar to the disks on internal IDE controllers (/dev/hd*). They are block devices.
    The first device is /dev/pda. Partitions on this device are found by adding the
    partition number to the minor number of the device.


    +   - /dev/pcd0. This file is a parallel port CD-ROM device. These are numbered
