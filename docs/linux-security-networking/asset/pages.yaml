- pgno: 197
  md: 'A network is a communication system that helps computers interact with each
    other. To enable this interaction, certain rules must be followed. These rules
    are known as protocol. A protocol is nothing but a set of rules or formats that
    are followed to create a means of effective communication between two or more
    computers. It is very difficult to build a protocol that is sufficient to cater
    to various kinds of applications and computers. Therefore, the need for a common
    platform that supports protocols at various levels of communication arises. Such
    a platform is the OSI reference model.


    In this chapter, I discuss the different layers of the OSI reference model. You
    will also learn in greater detail about the important layers of network security.
    Finally, the last section of the chapter covers topics that are relevant to system
    administrators.


    # Open Systems Interconnection (OSI)


    The OSI reference model is an open set of definitions that presents a common technical
    framework for standardization of communication. This framework provides an infrastructure
    that is sufficient to place mandatory and optional components of effective communication
    in place.


    The OSI reference model is divided into several layers. Each layer provides a
    plug-in space to various components involved in networking. The layers of the
    OSI reference model are illustrated in Figure 6-1.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# OPEN SYSTEMS INTERCONNECTION (OSI)


    # Chapter 6 171


    ![](img/a46d40e435b42e09209eb0761898e63c_198_0.png)


    **FIGURE 6-1** OSI reference model.


    The layers of the OSI reference model are as follows:


    +   * Physical layer

    * DataLink layer

    * Network layer

    * Transport layer

    * Session layer

    * Presentation layer

    * Application layer


    In the following sections, I explain each of these layers.


    # Physical Layer


    The physical layer is essentially the hardware support layer for networking equipment.
    This layer provides electrical and functional characteristics to initialize, maintain,
    and deactivate physical network links. Network links send bit streams of data
    and understand information only in the form of individual bits. The cabling used
    in a network is an example of a component that operates in the physical layer
    of the OSI model.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Chapter 6 NETWORK BASICS


    The physical layer takes care of the following components in a network:


    +   - Transmission medium


    +   - Means of signaling


    +   - Timing and clocks


    +   - Synchronous serial communication


    Network security is not limited to intrusions; it also involves choosing the right
    type of hardware while setting up your network. Therefore, though the physical
    layer might not seem to be a very important part in a secure network, you can''t
    overlook it. For example, poor quality cabling might save initial infrastructure
    costs, but in the long run, it can lead to data loss in the best protocols, such
    as the User Datagram Protocol (UDP), and cause network performance problems with
    other reliable protocols. Therefore, you should always use standardized networking
    equipment and avoid bizarre configurations for your network—even if investing
    in standard networking components pushes your networking budget a little higher.


    # Data Link Layer


    The data link layer is the second basic layer of the OSI model. It provides a
    functional and procedural method for the exchange of data between network entities.
    This layer understands data in the form of characters and enables you to initialize
    and maintain link connections. An example of a component that functions in this
    layer of the OSI model is the standard of the Institute of Electrical and Electronic
    Engineers (IEEE), the IEEE 802.3 or Ethernet. Ethernet is a widely accepted standard
    for LAN, and it can accommodate up to 1024 nodes. If the distance is greater,
    the High-Level Data Link Control (HDLC)-based networks are used.


    # Network Layer


    The network layer is an important layer from the point of view of a network administrator.
    This layer encapsulates most upper layers of the OSI model and provides point-to-point
    interaction between the two networking components in the upper layer. Some components
    of this layer, such as IP, Routers, and ICMP, are important for network security.
    These components are discussed in the following sections.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Internet Protocol


    Internet Protocol (IP) operates in the third layer of the OSI model and provides
    encapsulation facilities to protocols that operate in the higher levels of the
    model. An example of this is shown in Figure 6-2.


    | IP Header | ICMP Header | ICMP Packet Data |

    | --- | --- | --- |

    | | ICMP Packet | | | |


    FIGURE 6-2 Encapsulation of an ICMP packet within the IP protocol.


    The IP protocol uses datagrams to communicate over a packet-switched network.
    In a packet-switched network, every packet of data that is traveling through a
    network is treated as a separate entity. The packet contains a header information
    section, which contains the address of the recipient, and other important details
    about the data within the packet. Intermediate systems, such as routers (discussed
    in the next section) use this header information to forward the packet to the
    correct path or return an error message if the packet cannot be forwarded. An
    IP datagram is depicted in Figure 6-3.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Chapter 6 NETWORK BASICS


    | Version (4 bits) | Header Length |

    |---|---|

    | Type of Service (1 byte) | |

    | Packet Length (2 bytes) |

    | Identification (2 bytes) |

    | Flags (3 bits) Fragment offsets (13 bits) |

    | Time-to-Line (1 byte) |

    | Protocol Number (1 byte) |

    | IP Header''s Checksum (2 bytes) |

    | Source IP Address (4 bytes) |

    | Destination IP Address (4 bytes) |

    | Options |

    | User Data or Encapsulated Packet |


    ![](img/a46d40e435b42e09209eb0761898e63c_201_0.png)


    FIGURE 6-3 Structure of an IP datagram.


    Following is the structure of the IP packet header:


    +   - **Version.** This is the version of the IP.

    - **IP Header Length.** This field contains the size of the IP header. Note that
    this field contains only the length of the IP header and not the combined length
    of all headers that may be encapsulated inside the IP packet.

    - **Type of Service.** This field is usually set to zero and defines the “quality”
    of service that is expected from a network.

    - **Packet Size.** This field contains the total size of the packet, which is
    the sum of the size of the header and size of actual data.

    - **Identification.** This is a 2-byte number used by recipient computers to arrange
    fragmented data packets before merging them. More information on packet fragmenting
    and merging can be found in the “Routers” section of this chapter.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# OPEN SYSTEMS INTERCONNECTION (OSI)


    Chapter 6 175


    +   - Flags. This is a combination of three bits that inform the intermediate
    systems about the fragmenting feasibility for a packet. The field also contains
    the Don''t Fragment (DF) flag of the IP packet.


    +   - Fragmentation Offset. This is 13-bit byte count that starts from the first
    byte of the original packet (the packet before any fragmentation). This counter
    helps the end system, or the recipient computer, to confirm correct re-assembly
    of the packet.


    +   - Time To Live. This field contains an 8-bit number of hops that a packet
    can sustain. A packet can be routed only up to a certain number of times, which
    is specified in this field. This is done to avoid a scenario in which a packet
    continues to hop infinitely inside a network. Every time a packet is passed through
    a network, this number is decremented by the router.


    +   - Protocol. This field specifies the type of packet that is encapsulated inside
    the IP packet. A specific number represents each higher level, encapsulated protocol
    type. For example, if the packet being carried is an ICMP packet, the value of
    this field is 1. Similarly, if the packet is a TCP packet, the value of this field
    is 6.


    +   - Header Checksum. This field is a checksum number that can inform the recipient
    or an intermediate system whether the IP header is corrupted. End recipients or
    intermediate systems discard packets if the checksums are wrong. The checksum
    is initially inserted by the sender of the packet and can be updated by every
    intermediate system if any changes (such as fragmentation) are made to the packet.


    +   - Source Address. This is the IP address of the original sender of the packet.
    This field can be dangerously modified to spoof the identity of the sender during
    a network attack. More on this topic is discussed in the “IP Spoofing” section
    of Chapter 7, “Network Attacks.”


    +   - Destination Address. This is the IP address of the final recipient of the
    IP packet.


    +   - Options. The options are almost never used. If they are used, however, the
    size of the IP header can be increased.


    # Routers


    Routers are computers or gadgets that do not directly store usernames or act as
    a server or a client. Routers operate at the Network Layer 3 (L3) of the OSI model.
    They forward data to the intended recipient. Routers may connect to two'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Chapter 6 NETWORK BASICS


    or more IP networks or to connect an IP network to an Internet connection. Although
    routers need not know the information being sent through them, they might modify
    certain aspects of the information to enable information packets to reach the
    correct destination.


    A router, in physical terms, consists of a computer with a minimum of two network
    interface cards. Both these network cards should support IP. A router receives
    a packet from each interface and forwards the received packets to an appropriate
    output network interface. All packets received by the router have DataLink (L2)
    protocol headers. The router removes these headers and adds a new DataLink Layer
    header to the packet. After the new header is added to the packet, it can be transmitted
    using the appropriate network interface.


    A router reads the network layer header or IP header information before it can
    decide the following:


    +   - Should the packet be forwarded?


    +   - Which network interface should the packet be forwarded to?


    A series of steps is involved in routing a packet. These steps are shown here:


    +   1. The router receives a packet.


    +   2. The packet''s header information is extracted.


    +   3. The destination IP address of the packet is extracted.


    +   4. If the size of the packet is larger than the Maximum Transfer Unit (MTU)
    and the packet''s header information has a Don''t Fragment (DF) flag set, the
    packet is discarded. A message of failure is sent to the original sender of the
    packet.


    +   5. If the size of the packet is larger than the MTU but the DF flag is not
    set, the packet is broken down into smaller fragments.


    +   6. The best path for the packet is found by searching the routing table inside
    the router.


    +   7. If the size of the original packet is larger than the MTU, the small fragments
    are dispatched through the appropriate network interface. Otherwise, the packet
    is forwarded to its destination address.


    +   8. The packet fragments are collected at the destination and reassembled.


    Routing tables have the same format as the tables in network bridges and switches.
    The difference is that routers are identified by the IP addresses of computers
    instead of MAC hardware addresses.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# OPEN SYSTEMS INTERCONNECTION (OSI) Chapter 6 177


    The routing table is nothing but a list of known IP destination addresses and
    the associated network interfaces that can be used to reach the destinations.
    Routers also have a provision for a default network interface. This interface
    may be used for all addresses that are not mentioned in a routing table. Routers
    also provide packet filters. The packet filter simply discards unwanted packets,
    which can cause an unnecessary overload on networks. The filter can be used as
    a firewall, and unsupported protocols can be blocked outside the router. Such
    a firewall, to some extent, can provide basic security to prevent unauthorized
    users from entering a network using remote computers.


    The basic purpose of a router is to forward packets from one IP network to another
    IP network. A router determines the broadcast IP destination of a network from
    the logical AND of an IP address and its associated subnet mask. If a router is
    not configured properly, a serious security threat can occur when a packet is
    sent to a network broadcast address. If a large number of packets is forwarded,
    your network might face the problem of network overload.


    Routers are often used to connect different types of networks. A router can connect
    networks that use totally different link methodologies. For example, an HDLC link
    can connect a WAN to an Ethernet-based LAN, as shown in Figure 6-4.


    ![](img/a46d40e435b42e09209eb0761898e63c_204_0.png)


    **Figure 6-4** Role of routers in a network.


    The important thing to note here is that each of these networks has a different
    MTU. This is due to the fact that optimization levels for packet sizes are different
    for the two networks. Therefore, whenever a packet comes from the network that
    has a bigger MTU and needs to go to the network with a smaller MTU, the router
    will fragment the packet according to the norms of the destination network. IP
    packet fragmentation is illustrated in Figure 6-5.'
