- pgno: 396
  md: '# Chapter 11 369


    +   * arch. Contains all of the architecture-specific kernel code. The subdirectories
    of arch are based on the architectures supported by the Linux platform.


    +   * include. Contains the include files. These files are needed to build the
    kernel code. Like the arch directory, it has various subdirectories. There''s
    a subdirectory corresponding to each supported architecture.


    +   * init. Contains the initialization code for the kernel.


    +   * mm. Contains the memory management code. The architecture specific memory
    management code is stored in this directory.


    +   * drivers. Stores the device drivers. Device drivers are an interface between
    the operating system and the hardware devices.


    +   * ipc. Stores the kernel''s inter-process communications code.


    +   * modules. Stores the built-in modules.


    +   * fs. Stores the file system code. The subdirectories within this directory
    represent a supported file system.


    +   * kernel. Stores the main kernel code.


    +   * net. Stores the kernel''s networking code.


    +   * lib. Contains the kernel''s library code.


    +   * scripts. Contains the scripts that are used to configure the kernel.


    As you can see from the preceding list, the directory structure for kernel is
    very complex. Here are guidelines for searching for a specific subject in the
    kernel tree:


    +   * System Startup and Initialization. During system startup, the boot loader
    loads the kernel into the memory. The control is passed over to the kernel. The
    commands for loading are located in the arch/i386/kernel/head.S file.


    +   * Memory Management. The code for memory management can be found in the mm
    directory. The mm/memory.c file contains the code for handling page fault. You
    can find the memory mapping and page cache code in mm/filemap.c. The mm/buffer.c
    file implements the buffer cache.


    +   * Kernel. You can find the relevant generic code in kernel. The architecture-specific
    code is available in arch/*/kernel. The kernel/sched.c file implements the scheduler.'
