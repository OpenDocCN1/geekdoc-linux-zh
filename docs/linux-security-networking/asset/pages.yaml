    # rsync


    Rsync is a utility that enables you to perform faster file transfers. This utility
    uses the rsync remote-update protocol to increase the speed of file transfer.
    It performs the incremental file transfer. Therefore, only the differences between
    two sets of files are transferred across the network link, using an efficient
    checksum-search algorithm. Some of the additional features of rsync taken from
    the manual page are as follows:


    +   - Support for copying links, devices, owners, groups, and permissions


    +   - Exclude and exclude-from options similar to GNU tar


    +   - A CVS exclude mode for ignoring the same files that CVS would ignore


    +   - Can use any transparent remote shell, including rsh or ssh


    +   - Does not require root privileges


    +   - Pipelining of file transfers to minimize latency costs


    +   - Support for anonymous or authenticated rsync servers (ideal for mirroring)'
  merge: -1
