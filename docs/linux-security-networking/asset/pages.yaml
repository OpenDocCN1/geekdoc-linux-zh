  md: '# BACKUP TOOLS Chapter 13 429


    # BRU


    Backup and Restore Utility (BRU) is quite an old backup tool. This tool provides
    a variety of features with a flexible format, available both in command-line and
    GUI interface. The graphical interface allows easier administration and can easily
    be automated. It supports full, incremental, and differential backups, as well
    as catalogs, and can write both to a file or a tape drive.


    # Backup Professional


    Professional tool is a client/server backup tool server that allows for both manual
    and automated backups. It is an enterprise backup and disaster recovery system.
    It supports more than nine servers and over 20 operating systems. When running
    manually, Backup Professional allows registered clients to be backed up from the
    backup user agents (UAs). Backup UA can exist on both the client and the server.
    The backup UA on the client can request backup for itself. On the other hand,
    the server UA can request backup for itself as well as a client.


    When a client sends a backup request to the server, the server reads the request
    and places it into the task table. The backup is performed based on the availability
    of the resources needed for the backup.


    There are three types of backups that can be performed:


    +   **Master Backup.** This backup archives the complete data on a specified client.


    +   **Incremental Backup.** This backup archives data that has been modified after
    the last master backup was performed.


    +   **Selective Backup.** This backup specifies only the selected files.


    Backup Professional file recovery/verification utility is used to restore files
    and directories to client machines and verify previous backups. Documentation
    and other information about Backup Professional is available on the Web at www.unitrends.com.


    # CTAR


    Compressing Tape Archiver (CTAR) provides a rock-solid backup and recovery solution
    for UNIX systems and UNIX-only networks. It allows you to backup and restore files
    from a variety of storage media, such as tape, floppy disk, or'
  merge: -1
  img_proc: true
- pgno: 457
  md: '# 430 Chapter 13 SYSTEM BACKUPS


    add-on hard disks. A key argument controls the actions performed by CTAR.

    The key contains the function names and modifiers. Like Backup Professional,

    CTAR is available at www.unitrends.com.


    CTAR can be used to archive or restore all the files and directories in a file
    system.

    The crash recovery features of CTAR enables it to recover data from archive files.

    FILES enables you to split files across multiple media. CTAR also supports

    faster backups. The double buffering feature enables it to do so. During double

    buffering, shared memory buffers, semaphores, and dual processes increase the

    backup speed. Shared memory buffers play a critical role in this. While one

    CTAR process is reading data from the hard disk and writing it to the shared

    memory buffers, the other process writes the data from the shared memory buffer

    to tape drive.


    # Arkeia


    Arkeia is another backup tool that greatly simplifies data protection by providing

    automated backup and recovery. Available at www.arkeia.com, Arkeia supports a

    wide variety of computers, operating systems and storage devices. Arkeia is easy

    to install and configure. It is suitable for any kind of network, simple or complex.

    Other features of Arkeia include:


    +   - Speed. Arkeia uses a multi-flow technology and client-side compression

    provides a high speed to Arkeia operations. You can perform several

    backups and restore operations at the same time.

    - Reliability. If network and system errors halt the backup process, Arkeia

    is designed to recover and restore the backup process. Arkeia uses a catalog to
    track the data and metadata. In case of backup server failure,

    Arkeia recovers the data by using the catalog. The fail-safe restore utility

    enables Arkeia to do so.


    +   - User-friendly. The software is based on three components: a server, a

    client, and a graphical user interface (GUI). This kind of architecture

    offers an exceptionally easy installation and management of any backup.

    Arkeia''s architecture and GUI enables easy deployment of Arkeia and

    makes it user friendly. It also allows the administration to remotely manage backup
    and restore operations virtually from any computer where the

    GUI is installed, including via the Internet.


    Arkeia can be used to perform full and incremental backups. You can schedule the

    backups to be performed.'
  merge: -1
