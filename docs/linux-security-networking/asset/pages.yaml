- pgno: 307
  md: '# Configurations File for FTP Server


    The following configurations files are required for the effective functioning
    of your FTP server:


    +   * ftpaccess

    * ftpusers

    * ftphosts

    * ftpgroups

    * ftpconversion


    The next few sections discuss some of these files.


    # ftpaccess


    The ftpaccess file is the main configuration file for the Wu-fptd server. This
    file manages the users and other security-related issues of the FTP server. You
    should place this file in the /etc folder. The default location for this file
    is /etc/ftpaccess.


    The important directives of the ftpaccess file are discussed here:


    +   * The deny directive will disallow access to the hosts with the address, <address>.
    If any specified hosts try to connect, the <message> is displayed:


    deny <address> <message>.


    +   * The following directives add users and groups as guest user/group or real
    user/group:


    guestgroup <groupname> [<groupname>_]

    gustuer <username> [<username> _]

    realgroup <groupname> [<groupname>_]

    realuser <username> [<username> _]


    +   * The tcpwindow directive is used to control network traffic by setting up
    the TCP window size:


    tcpwindow <size> [<class>]'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# # FTP SERVER Chapter 9 281


    +   * The timeout directive is used to specify various time limits:

    timeout [accept | connect | data | idle | maxsize | RFC931] <seconds>


    +   * The file-limit directive limits the number of files a user in the specified
    class can transfer:

    file-limit <raw> <in|out|total> <count> [<class]>


    +   * The data-limit directive is used to specify the limit of the data in bytes
    that a user in the specified class can transfer:

    data-limit <in|out|total> <count> [<class]>


    +   * The limit-time directive is used to set the time limit for a session:

    limit-time <*anonymous|guest> <minutes>


    +   * The limit directive is used to limit the class to a specified number of
    users. The error message <message> is displayed when the user is denied access:

    limit <class> <n> <times> <message_file>


    +   * The notretrieve directive is used to deny the transfer of the specified
    files:

    notretrieve [absolute|relative] [class=<classname>] ... [-] <filename> <filename>
    ...


    +   * The allowretrieve directive allows retrieval of the specified files:

    allowretrieve [absolute|relative] [class=<classname>] ... [-] <filename> <filename>
    ...


    +   * The login directive is used to specify the number of failed logon attempts
    that is allowed. The default value is 5:

    login <fails>


    +   * The log commands directive allows logging of individual commands by users.
    The <typelist> can be anonymous, guest, and real:

    log commands <typelist>'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'The log transfers directive enables you to log file transfers for anonymous
    and real FTP users. <directions> can have TO value for the incoming transfer or
