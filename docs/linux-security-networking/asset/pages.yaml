- pgno: 480
  md: '# APACHE 2.0 Appendix C 453


    +   - The GUI interface installation makes Bastille user friendly for users new
    to Linux.


    +   - It supports the Linux 2.4 kernel and enhanced firewall features.


    # Apache 2.0


    Apache 2.0 is the latest version of Apache. Apache 2.0 has improved significantly
    from its previous versions. Some of the new features of Apache 2.0 are listed
    here:


    +   - The scalability of Apache has increased. Apache now runs in a hybrid multiprocessing
    and multithreaded mode on systems with POSIX-support.


    +   - Apache 2.0 supports multiple protocols.


    +   - Apache 2.0 is now faster and stable on platforms such as OS/2 and Windows.
    This became possible due to the implementation of Multi-Processing Modules (MPM)
    and Apache Portable Runtime (APR).


    +   - Apache 2.0 API has been significantly enhanced as compared to previous versions.
    New calls in the API provide enhanced functionality.


    +   - Apache 2.0 can be used to filter the incoming and outgoing data traffic
    to the server.


    +   - IPv6 socket is now available by default for Apache. This socket is required
    for systems where IPv6 is supported by the underlying Apache Portable Runtime.


    +   - Multilingual error responses can now be displayed to the client. This is
    done by using the Server Side Includes (SSI).


    +   - The directives have been simplified. Some directives from previous versions
    are now deprecated. For example, the BindAddress directive is dropped.


    +   - Apache 2.0 uses utf-8 for all filename encoding on Windows NT.


    # New Modules in Apache 2.0


    Apache 2.0 has introduced some new modules in the latest release. Some modules
    in Apache 2.0 are these:'
  merge: -1
