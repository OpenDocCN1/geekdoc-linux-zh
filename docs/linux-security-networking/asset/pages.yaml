- pgno: 8
  md: '# About the Author


    Shadab Siddiqui is an Instructional Designer with the Knowledge Solutions Business
    (KSB) division of NIIT, Inc. He is a Sun Certified Java Programmer. He has developed
    several Computer-Based Tutorials (CBTs) and Web-Based Tutorials (WBTs) and has
    written other books. He has developed learning materials covering various technical
    areas, such as Windows 2000 Networking, JSP, JEEE, and Linux, so so on. These
    learning materials were developed to cater to the needs of different learners
    ranging from network administrators to programmers.


    NIIT, a global training and software organization, offers customized and packaged
    multimedia educational software products and training, training needs identification
    (TNI), systems integration, software solutions (for business, engineering, and
    manufacturing), IT consulting and application software development to a range
    of audiences—both individuals and organizations.


    The success of NIIT''s courses lies in its unique approach to education. NIIT''s
    Knowledge Solutions Business conceives, researches, and develops all the course
    material for a range of audiences. Each NIIT course has a definite aim. After
    finishing a course, the learner should be able to do a set of tasks.


    Besides being a large software development and consulting division, NIIT has one
    of the largest learning material development facilities in the world. NIIT trains
    over 150,000 executives and learners each in Information Technology areas using
    Stand-up Training, Video-Aided Instruction, Computer-Based Training (CBT), and
    Internet-Based Training (IBT). NIIT has been featured in the Guinness Book of
    World Records for the largest number of learners trained in one year!


    NIIT has developed over 10,000 hours of Instructor-Led Training (ILT) and over
    3,000 hours of Internet-Based Training and Computer-Based Training. Through the
    innovative use of training methods and its commitment to research and development,
    NIIT has been in the forefront of computer education and training.


    NIIT has strategic partnerships with companies such as Microsoft, Computer Associates,
    AT&T, NETg, Sybase, Intersol, and Information Builders.*'
