- pgno: 251
  md: 'The Apache Web server is the most widely used Web server on the Internet. It
    hosts more than 50 percent of the Web sites in the world. The first version of
    Apache was developed by a group of volunteer programmers in 1995 and was based
    on the httpd Web server of NCSA. Apache was known as the patchy server, because
    it was developed from existing NCSA code, plus various patches. Apache has become
    the world’s most popular Web server because of these characteristics:


    +   * Sophisticated features

    * Efficient performance

    * Security features

    * Module Plug-in support

    * Free availability


    A group of volunteer programmers, known as the Apache Software Foundation, is
    involved in the development of the Apache server. In addition, programmers throughout
    the world can contribute to its development, because the source code is freely
    available. Apache was originally developed for the Unix operating system, but
    is now available for platforms such as Linux, OS/2, and Windows.


    You can choose to install the Apache Web server while installing Red Hat Linux.
    However, if you did not install Apache during the installation process, you can
    install it later by using the rpm program or by compiling the Apache source distribution.
    Once installed, Apache has the following directories:


    +   * /etc/httpd/conf/. This directory contains all Apache configuration files.
    Some of the configuration files include httpd.conf, access.conf, and smrm.conf.

    * /var/www/html/. This is the default location for the CGI programs and HTML files.
    If you change the default location, the configuration files need to be updated
    accordingly.

    * /usr/sbin/. This directory contains the executable programs. The programs can
    be critical server executables or utilities, such as the htpasswd program. The
    htpasswd program is used for creating and updating the user authentication files.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# THE HTTPD DAEMON


    +   * /var/log/http/. This directory contains the server log files. There are
    two log files by default: access_log and error_log.


    +   * /etc/rc.d/. This directory stores the daemon startup scripts. The scripts
    are usually located in the init.d directory within this directory. The scripts
    in this directory are executed automatically at boot time.


    +   * /usr/doc/ and /usr/man/. These directories store the help and manual files
    for Apache.


    You know the /etc/httpd/conf directory contains some important configuration files
    for the Apache server. The directives in these files determine the configuration
    of the Apache server. The following list describes the three most important configuration
    files:


    +   * httpd.conf. This file contains directives that control the operation of
    the server daemon.


    +   * srm.conf. This file contains directives for controlling the specification
    of the documents provided to the clients by the server. Server settings, which
    affect how requests are serviced and how the results are formatted, also are defined
    in this file.


    +   * access.conf. This file defines the server settings that affect the types
    of services allowed and the conditions for allowing these services.


    In later versions of Apache 1.3.4, the configuration files for Apache are stored
    in single file, httpd.conf. The other files are present but they are there for
    purely historical reasons. These files contain only the comment entries. You should
    put all the configuration details in the httpd.conf file.


    # The httpd Daemon


    The httpd daemon, which runs as a stand-alone daemon process, is the Apache server
    program. The Web server can be run in the stand-alone mode or by the inetd server.
    You can invoke the httpd daemon by using the Internet daemon, inetd. The main
    configuration file for the httpd daemon is the httpd.conf file. This httpd service
    controls the Web server and the HTTP services in Linux. The main script for starting
    and stopping the Web server is presented in the httpd file in the /etc/rc.d/init.d
    directory.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Chapter 8 APACHE WEB SERVER


    When run in the stand-alone mode, the httpd daemon creates a pool of processes
    to handle requests. To stop the daemon, you need to send a TERM signal to the
    initial parent process. The process ID (PID) of this process is written to a file,
    as given in the configuration file. This file is usually the /var/run/httpd.pid.


    Here is an example of the httpd daemon running in the stand-alone mode:


    ```

    cat /var/run/httpd.pid

    ps -aux | grep httpd

    root      830 0.0 0.1 10724 184 ? S 13:09 0:00 /usr/sbin/httpd -

    apache    846 0.0 1.5 10852 1988 ? S 13:09 0:00 /usr/sbin/httpd -

    apache    847 0.0 1.4 10816 1780 ? S 13:09 0:00 /usr/sbin/httpd -

    apache    848 0.0 1.4 10816 1784 ? S 13:09 0:00 /usr/sbin/httpd -

    apache    849 0.0 1.4 10816 1784 ? S 13:09 0:00 /usr/sbin/httpd -

    apache    850 0.0 1.5 10852 1988 ? S 13:09 0:00 /usr/sbin/httpd -

    apache    851 0.0 1.4 10816 1784 ? S 13:09 0:00 /usr/sbin/httpd -

    apache    852 0.0 1.4 10816 1784 ? S 13:09 0:00 /usr/sbin/httpd -

    apache    853 0.0 1.4 10816 1784 ? S 13:09 0:00 /usr/sbin/httpd -

    root     2515 0.0 0.4 1520 684 pts/2 S 16:22 0:00 grep httpd

    ```


    In the preceding example, note the output of the first command, /var/run/httpd.pid.
    It displays the PID of the parent httpd daemon. The next command displays all
    the running httpd daemon processes. You can start the httpd service by using the
    script present in the /etc/rc.d/init.d directory.


    The httpd daemon should not be run as root user. A better idea is to create a
    new user and define that in the user directive in Apache''s main configuration
    file, /etc/httpd/conf/httpd.conf. This directive tells Apache to run under that
    user. Apache will have all the permissions that this user has been granted. Therefore,
    this user should not have access to files that are not meant for public use.


    The user directive also can be used inside the <virtualhost> block. This means
    that only CGIs for this host would have a different userid for execution. The
    directive can be used only if the suExec wrapper feature is enabled on Apache.
    The suXEC wrapper is discussed in detail in the next section.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# suEXEC Chapter 8 227


    Some administrators prefer to run the httpd daemon as the nobody user. This option
    has its own advantages and disadvantages. The main advantage is that Apache will
    have very limited access, and the security threat will be minimized. A disadvantage
    is that some utilities that allow distributed permission systems, like suEXEC,
    will be more difficult to implement.


    # suEXEC


    suEXEC is a utility in Apache that allows CGIs to be executed by usernames different
    from the user who runs Apache''s parent thread. It allows different users on a
    server to have different levels of permissions while executing CGI scripts. All
    CGI scripts are run under a single username, that user has the potential to access
    the cgi-bin/ directories of other users on the system. To get rid of this problem,
    suEXEC can be enabled. Enabling this feature would mean that all users who have
    CGI files run under their own userids. The advantage to this is that access permissions
    of every CGI file will be limited to the extent of the user who wrote the CGIs.


    # The httpd.conf File


    The httpd.conf file is the configuration file for the Apache server. It is a text
    file and has numerous configuration options. These options can be configured by
    adding, commenting, un-commenting, and deleting the options present in it. This
    file is based on the configuration files of the NCSA server that were originally
    developed by Rob McCool.


    Editing the Apache configuration file is the most common method used for configuring
    the Apache server. However, only the experienced Web server administrators do
    this. New users might find it difficult to understand the options specified in
    this file.


    # Directives


    Before examining the options present in the httpd.conf file'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Chapter 8 APACHE WEB SERVER


    operate like programming languages. Directives can be referred to as instructions
    to the Apache server that help Apache behave in a particular manner and locate
    the resources to be used. Directives do not control the actions of Apache, however.
    An Apache Web server administrator should be able to understand the purpose and
    usage of Apache directives to perform Web administration tasks effectively.


    Directives can be classified into two categories:


    +   * Core directives

    * Directives supplied by add-on modules


    I will briefly discuss these types of directives before we begin examining the
    sections and options of the httpd.conf file.


    # Core Directives


    As the name suggests, core directives are the most critical directives for the
    Apache Web server. These directives are compiled into the Apache executable code
    and are available by default. No special configuration is required. The core directives
    are essential for Apache Web server to function properly.


    # Directives Supplied by Add-on Modules


    There are numerous add-on modules that can be used with the Apache Web server.
    When you install these add-on modules, they make directives available to the Apache
    server. This means that the Web server administrator can use these directives
    only when the corresponding add-on module is added.


    # Layout of the httpd.conf File


    The configuration directives in the httpd.conf file are grouped into three sections.
    These sections make it convenient for you to locate the configuration options
    while editing the httpd.conf file. These sections are as follows:


    +   * The Global Environment section

    * The Main server configuration section

    * The Virtual Hosts section'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# The Global Environment Section


    This section contains directives that globally affect the functioning of the Apache
    Web server. These directives are essential for the overall operation of Apache.
    The directives presented in this section determine how the Apache server processes
    will be controlled.


    # The ServerType Directive


    The ServerType option can be configured with two modes: inetd or standalone. The
    inetd mode is used only when you install Apache on Linux or UNIX platforms. The
    extract from the httpd.conf, where the ServerType directive, is specified as follows:


    ```

    # ServerType is either inetd, or standalone. Inetd mode is only supported on

    # Unix platforms.

    ```


    Do not tamper with the ServerType option. The default value for this option is
    standalone.


    # The ServerRoot Directive


    The ServerRoot directive is used to specify the location where the following important
    files will be located:


    +   - Configuration files

    - Error files

    - Log files


    The location you specify in the ServerRoot directive to store the configuration,
    error, or log files could be the local file system or a Network File System (NFS).
    If you choose to use a location on the local file system, you need to specify
    the directory path in this directive, as follows:


    ```

    # ServerRoot: The top of the directory tree under which the server''s

    # configuration, error, and log files are kept.

    #n# NOTE! If you intend to place this on an NFS (or otherwise network)

    # mounted filesystem then please read the LockFile documentation

    # (available at URL:http://www.apache.org/docs/mod/core.html#lockfile);

    ```'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# you will save yourself a lot of trouble.

    #

    ServerRoot "/usr/local/apache"


    > NOTE

    I''ve taken extracts of these directives from the http.conf file from my Linux
    computer. The values of the directives might be different in the http.conf file
    of your Linux computer, depending on the kind of installation you have performed.


    The path in the ServerRoot directive should be specified with care.


    # The LockFile Directive


    The LockFile directive is used to specify the path for the lockfile. A lockfile
    is used when Apache is compiled by using either of these two options:


    +   - USE_FCNTL_SERIALIZED_ACCEPT

    - USE_FLOCK_SERIALIZED_ACCEPT


    You should leave the value of this directive as default. However, if the lockfile
    is located on an NFS mounted file system, the default path of the lockfile should
    be changed accordingly. A sample LockFile directive is given here:


    ```

    # The LockFile directive sets the path to the lockfile used when Apache

    # is compiled with either USE_FCNTL_SERIALIZED_ACCEPT or

    # USE_FLOCK_SERIALIZED_ACCEPT. This directive should normally be left at

    # its default value. The main reason for changing it is if the logs

    # directory is NFS mounted, since the lockfile MUST BE STORED ON A LOCAL

    # DISK. The PID of the main server process is automatically appended to

    # the filename.

    ```


    ```

    #LockFile /usr/local/apache/logs/httpd.lock

    ```


    In the preceding extract, the path for the lockfile is set as /usr/local/apache/logs/httpd.lock.
    If you are using the standard installation of Apache, the path would ideally be
    /var/run/httpd.lock.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# # THE HTTPD.CONF FILE Chapter 8 231


    # ## The PidFile Directive


    Whenever Apache is started, a PID is allocated to it. The PID is then stored in
    a file. You use the PidFile directive to specify the path for the file that stores
    the PID of the Apache Web server. However, this file is used only if you have
    configured the value of ServerType directive as standalone. A sample PidFile directive
    is given:


    +   # PidFile: The file in which the server should record its process

    # identification number when it starts.



    PidFile /usr/local/apache/logs/httpd.pid


    In the preceding extract, the path set for the PID file is /usr/local/apache/logs/httpd.pid.
    If you are using the standard installation of Apache, the path will be /var/run/httpd.pid.


    # ## The ScoreBoardFile Directive


    The ScoreBoardFile directive is used to specify the location for the httpd.scorefile.
    This file stores information regarding the internal server processes. It determines
    how the parent and child processes, which are invoked by the Apache Web server,
    communicate with each other:


    +   # ScoreBoardFile: File used to store internal server process information.

    # Not all architectures require this. If yours does (you''ll know because

    # this file will be created when you run Apache) then you *must* ensure that

    # no two invocations of Apache share the same scoreboard file.


    ScoreBoardFile /usr/local/apache/logs/httpd.scoreboard


    In the preceding extract, the path specified for the ScoreBoardFile directive
    is /usr/local/apache/logs/httpd.scoreboard.


    The ScoreBoardFile directive need not be configured for all architectures. To
    identify whether the architecture you are using requires the ScoreBoardFile directive,
    perform the following steps:


    +   * Start the Apache server.

    * Search for the file named httpd.scoreboard.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'If you find this file, it means that your architecture requires that the ScoreBoardFile
    directive be configured. If you are using the ScoreBoardFile directive, you should
    ensure that no more than one instance of Apache is using this file at a given
    time.


    # The ResourceConfig and AccessConfig Directives


    The ResourceConfig and the AccessConfig directives are used to store the path
    for the srm.conf and access.conf files, respectively. These files were used with
    versions of Apache prior to 1.3.4. For later version of Apache, it was recommended
    that all directives be stored in a single file.


    Although, srm.conf and access.conf files are not required any more, they are still
    a part of the Apache distribution. These files contain only comments and you can
    safely get rid of them by specifying /dev/null as the filename for the ResourceConfig
    and AccessConfig directives. Doing this will ignore these directives. Consider
    the following extract:


    ```

    # In the standard configuration, the server will process httpd.conf (this

    # file, specified by the -f command line option), srm.conf, and access.conf

    # in that order. The latter two files are now distributed empty, as it is

    # recommended that all directives be kept in a single file for simplicity.

    # The commented-out values below are the built-in defaults. You can have the

    # server ignore these files altogether by using "/dev/null" (for Unix) or

    # "null" for the arguments to the directives.


    #ResourceConfig conf/srm.conf

    #AccessConfig conf/access.conf

    ```


    In the preceding extract, notice that the ResourceConfig and the AccessConfig
    directives are commented by default.


    # NOTE


    If you specify a directory as a value for these directives, the Apache Web server
    will parse all files present in the specified directory. Apache assumes that the
    files within the specified directory are the configuration files. Therefore, in
    order to avoid a situation where all stray files in the specified directory are
    loaded as configuration files, you should keep the specified directory empty.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# THE HTTPD.CONF FILE Chapter 8 233


    # The Timeout Directive


    The Timeout directive specifies the time lapse for which Apache will wait before
    sending a timeout message. The value specified in this directive specifies the
    time taken to do the following:


    +   * Receive a GET request.

    * Receive a POST or PUT request.

    * Send TCP packets as responses to a request.


    # Timeout: The number of seconds before receives and sends time out.

    #

    Timeout 300


    The default value set for this directive is 1200 seconds in Apache versions prior
    to 1.2.


    # The KeepAlive Directive


    The KeepAlive directive is used to specify whether Apache should allow persistent
    connections. HTTP/1.1 uses a mechanism called persistent connections. Persistent
    connections allow the client to establish multiple connections at a given time,
    resulting in faster download.


    # KeepAlive: Whether or not to allow persistent connections (more than)

    # one request per connection. Set to "Off" to deactivate.

    #

    KeepAlive On


    By default, the value for the KeepAlive directive is set to On. The On value means
    Apache will allow the use of persistent connections. However, if you do not want
    to use persistent connections, you can set the value to Off.


    # The MaxKeepAliveRequests Directive


    You can specify the maximum number of requests that are allowed per connection.
    This is needed if you have enabled support for the KeepAlive directive. You can
    use the MaxKeepAliveRequests directive to specify the number of maximum requests
    that can be sent to the server for each connection. A numeric value can be assigned
    to this directive, to specify the maximum number of allowed requests. If the number
    0 is specified, unlimited requests are allowed. If you are using'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'persistent connections, it is advisable that you set the value of this directive,
    so that

    it can handle several requests at a time.


    A sample MaxKeepAliveRequests directive is given here:


    ```

    # MaxKeepAliveRequests: The maximum number of requests to allow

    # during a persistent connection. Set to 0 to allow an unlimited amount.

    # We recommend you leave this number high, for maximum performance.

    #

    MaxKeepAliveRequests 100

    ```


    The default value for this directive is 100, which means that 100 requests will
    be

    allowed per connection. To improve performance, this value can be set to a higher

    number.


    You should consider the performance and availability of resources while allowing

    KeepAlive connections. Every operating system has a maximum number of simul-

    taneous TCP connections that are allowed. Therefore, the number of Max-

    KeepAliveRequests should be set so that the performance is not adversely

    affected, and there is excess load on the server.


    # The KeepAliveTimeout Directive


    The KeepAliveTimeout directive is used to specify the amount of time after which

    Apache will be ready to receive the next request from a client.


    ```

    # KeepAliveTimeout: Number of seconds to wait for the next request from the

    # same client on the same connection.

    #

    KeepAliveTimeout 15

    ```


    By default, the time specified for this directive is 15 seconds, which means that
    a

    KeepAlive connection will close if a new client request is not received

    in 15 seconds.


    # The MinSpareServers and the MaxSpareServers Directive


    The MinSpareServers and MaxSpareServers directives are used to specify the

    minimum number of servers and the maximum number of processes that will be

    idle and waiting for requests at a given time. The number specified in these direc-

    tives does not determine the maximum number of clients that can connect to an'
  merge: -1
