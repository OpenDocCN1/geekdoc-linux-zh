    # Linux File Systems


    In the Linux file system, every resource in your system is considered a file.
    The devices are considered to be files. Some of the device files are listed here:


    +   * **/dev/dsp**. This file represents the Digital Signal Processor and acts
    as an interface between the software that produces sound and the sound card.

    * **/dev/fd0**. This file represents the first floppy drive. If you have several
    drives, they will be numbered sequentially.

    * **/dev/fb0**. This file represents the first framebuffer. A framebuffer is an
    abstraction layer between software and graphics hardware. Therefore, applications
    need not identify the hardware. They need to know only how to communicate with
    the framebuffer driver''s Application Programming Interface (API).

    * **/dev/hd[a-d]**. This file is the master IDE drive on the primary IDE controller.
    The drive /dev/hdb is the slave drive on the primary controller. The drives /dev/hdc
    and /dev/hddd are master and slave devices on the secondary controller. Each disk
    is divided into partitions. Partitions 1 through 4 are primary partitions and
    partitions 5 and above are logical partitions, inside extended partitions.'
  merge: -1
