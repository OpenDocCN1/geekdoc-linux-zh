  md: '# 394 Chapter 12 SYSTEM LOGS


    +   * 300. Indicates that the client''s requested data had been moved recently.

    * 301. Indicates that the client''s requested data was found at an alternate URL.

    * 302. Indicates that the server suggested an alternate location for the client''s
    requested data.

    * 303. Indicates that the server could not modify the data concerned.

    * 400. Indicates a flawed request that could not be processed.

    * 401. Indicates an attempt by the client to access data that he was not authorized
    to have.

    * 402. Indicates that a payment process has been set up.

    * 403. Indicates that the access is altogether forbidden.

    * 404. Indicates that the document was not found at the requested location.

    * 500. Indicates that an internal server error and the server could recover.

    * 501. Indicates that the client requested an action, which the server does not
    support.

    * 502. Indicates a server overload.

    * 503. Indicates that http was waiting for another service to return information,
    but the external application did not return any data.


    Access logs can play an important role in data security. An administrator can
    extract much useful information about a Web server from these logs and make appropriate
    changes to the server to correct issues. For example, by analyzing access logs,
    an administrator can find out when all pages of a Web site were indexed by search
    engines. If the logs show access to pages that were not meant for public use,
    an administrator can add relevant directives in the robots.txt file. This file
    is present in the root directory of every Web site and most search engine and
    Web crawlers follow the guidelines mentioned in this file. Apache access logs
    can also be used to generate statistical reports of visitors; for example, a script
    that can analyze popular user trends, most visited pages, never accessed pages,
    etc. Such reports are useful for Web masters and can help fix many logical errors
    in their Web sites.'
