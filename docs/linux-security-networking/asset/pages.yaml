- pgno: 163
  md: 'Encryption and authentication are methods you use to secure your data and establish
    the identity of users and clients. Encryption secures data by converting it into
    a form that is hard to understand. On the other hand, authentication establishes
    the identity of users and clients and ensures that only authorized users are allowed
    access to data. In this chapter, you''ll look at the various encryption and authentication
    methods that make your Linux environment secure and learn about the tools available
    for encrypting data and authenticating users in Linux.


    # Encryption


    Encryption is the process of converting data into a form that is not easy to read.
    The original data is called plain text, and the encrypted data is called cipher
    text. There are simple or sophisticated methods of encryption. The simple encryption
    includes substituting, rotating, and scrambling letters. The sophisticated cipher
    includes applying complex algorithms to letters, words, or phrases.


    You can convert the cipher text back to plain text through the decryption process.
    To recover the plain text from the cipher text, you use the decryption key. The
    decryption key is another algorithm that reverses the effect of the algorithm
    that was applied to the plain text to the cipher text.


    The encryption process is also known as cryptography. There are two main types
    of cryptography:


    +   - Single key cryptography

    - Public key cryptography


    The following sections discuss each of these in detail.


    # Single Key Cryptography


    Single key cryptography is also known as symmetric key cryptography. In this type
    of cryptography, the encryption and decryption of data takes place with the use
    of a secret key. The sender, as well as the receiver, should have the secret key.'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Several secret key algorithms have been developed. Some of them discussed in
    this chapter include:


    +   - Data Encryption Standard (DES)

    - Triple Data Encryption Standard (3DES)

    - International Data Encryption Algorithm (IDEA)


    # Data Encryption Standard


    DES is a secure method for data encryption that uses a secret key to encrypt data.
    The secret key is extremely difficult to break. With this method, more than 72
    quadrillion encryption keys can be generated and used. This method uses private
    key cryptography, in which both the sender and the receiver use the same key to
    encrypt and decrypt data.


    DES applies a 56-bit key to each 64-bit block of data. Although this is considered
    a strong level of encryption, many companies use triple DES, which applies three
    keys in succession.


    ![](img/a46d40e435b42e09209eb0761898e63c_164_0.png)


    > NOTE

    DES originated at IBM in 1977 and was adopted by the U.S. Department of Defense.
    DES is specified in the ANSI X3.92 and X3.106 and in the Federal FIPS 46 and 81
    standards.


    # Triple DES Encryption Standard


    3DES is another form of DES encryption. Three 64-bit keys are needed to form an
    overall length of 192 bits. The 3DES encryption breaks the secret key into three
    sub-keys and pads the keys, if necessary, so that they are each 64 bits long.
    The data is encrypted with the first key and then decrypted with the second key.
    This decrypted data is again encrypted with the third key.


    The procedure for encryption is the same as with regular DES, but is repeated
    three times. This makes the 3DES encryption more secure than the DES encryption;
    however, it is slower than DES.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# International Data Encryption Algorithm


    IDEA is a symmetric block cipher developed by Xuejia Lai and James Massey of the
    Swiss Federal Institute of technology. IDEA, which is designed to facilitate both
    software and hardware implementation, provides a high level of security with easy
    implementation. Due to its strength and reliability, IDEA is now used worldwide
    in many banking and industry applications.


    IDEA encrypts data in 64-bit blocks with a 128-bit key. The 64-bit block is divided
    into four 16-bit sub-blocks. Each of these undergoes eight rounds of operations.
    In each round of operation, the XOR algorithm is applied. After that, they are
    added and multiplied with one another and with 16-bit sub-blocks of data. These
    functions are combined to produce complex encrypted data that is very difficult
    to analyze.


    # Public Key Cryptography


    The public key cryptography uses a pair of keys instead of a single key for the
    encryption and decryption process. In this process, one key is used for encryption,
    and the other key is used for decryption. This process is known as asymmetric
    cryptography because both the keys are required to complete the process and both
    the keys are based on different algorithms.


    In the public key cryptography, one of the keys is freely distributed to the users.
    This key is called the public key and is used for encryption. The other key, called
    the private key, is used for the decryption purpose and is kept with the owner.
    The data that is encrypted with the public key can be decrypted only with the
    corresponding private key. Conversely, data encrypted with the private key can
    be decrypted only with the corresponding public key. The most popular algorithm
    of asymmetric encryption is the RSA encryption.


    # RSA Encryption


    RSA encryption is based on asymmetrical cryptography. The RSA encryption algorithm
    uses very large prime numbers to generate the public and private keys. The usage
    of large numbers makes it almost impossible to calculate the original keys. RSA-based
    encryption schemes encrypt a symmetrical key using the public key. The data is
    then encrypted by using the symmetrical key, which uses a faster algorithm. The
    symmetrical key is randomly generated. Therefore, the only'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# HASHING FUNCTIONS


    way to get it is is to use the private key to decrypt the RSA-encrypted symmetrical
    key. The use of large numbers to generate the public and private keys makes this
    encryption algorithm very slow.


    # Hashing Functions


    A hash function is a conversion technique that takes input and returns a string,
    which is called a hash value. The hash function converts the string into a form
    that is irreversible. Hashing is different from encryption in the sense that the
    encrypted data can be decrypted, but once hashing is applied to data, it can''t
    be converted back to the original form. Some of the basic requirements of a hash
    function are listed here:


    +   * The input can be of a variable length.

    * The output has a fixed length.

    * The hash value should be easy to compute.

    * The conversion should be one way only. This means that you can derive the original
    value from the hash value.


    A well-known hash function is message digest (MD).


    # Message Digest


    Professor Ronald L. Rivest of MIT has created three MD algorithms. These are as
    follows:


    +   * MD2. In this algorithm, the message is first padded so that its length is
    divisible by 16 bytes. A 16-byte checksum is appended to the message, and the
    hash value is computed on the resulting message. This was developed in 1989.

    * MD4. In this algorithm, the message is padded to ensure that its length, plus
    64-bits, is divisible by 512 bits. A 64-bit binary representation of the original
    length of the message is then concatenated to the message. The message is processed
    in 512-bit blocks, and each block is processed in three distinct rounds. This
    was developed in 1990.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'MD5. MD5 was developed by Rivest in 1991. It is basically the same as MD4,
    but includes more security features. This algorithm consists of four distinct
    rounds, which have a slightly different design from that of MD4. Message-digest
    size, as well as padding requirements, remain the same as those in MD4.


    MD5 is an algorithm used to verify data integrity. MD5 verifies data integrity
    through the creation of a 128-bit message digest. It is intended for use with
    digital signature applications, which require data to be compressed by a secure
    method before being encrypted with a secret key. According to the MD5 standard,
    it is nearly impossible to produce the same output with different data when the
    MD5 algorithm is applied.


    Although the three algorithms have similar structures, MD2 is optimized for 8-bit
    machines. The other two algorithms, MD4 and MD5, are optimized for 32-bit machines.
    The MD5 algorithm is an extension of MD4, which is fast, but not absolutely secure.
    In comparison, MD5 is not as quick as the MD4 algorithm, but it offers much more
    reliability for data security.


    Apart from encryption, another way to protect your data is to restrict the access
    of users to your systems. Only authenticated users should be allowed access. Lightweight
    Directory Access Protocol (LDAP) is one method available for authentication. The
    next section discusses LDAP.


    # LDAP


    LDAP is a client-server protocol for accessing a directory service. A directory
    service is similar to a database, but contains more descriptive and attribute-based
    information. Directory services can be local or global, providing access to a
    restricted set or wider group of users. There are many different ways to provide
    a directory service, and different methods allow kinds of information to be stored
    in the directory. They also specify how the information can be referenced, queried,
    and updated.


    In Linux, the daemon for the LDAP directory server is called slapd. The slap daemon
    runs on different UNIX platforms. Another daemon called slurpd performs replication
    from LDAP servers. The slurpd daemon enables the server to take the benefits of
    caching and manage concurrency with databases.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# LDAP Chapter 5 141


    # NOTE


    The slurpd daemon is responsible for replication between LDAP servers.


    The command for running slapd is shown here:


    ```

    /usr/local/etc/libexec/slapd <option>*

    ```


    In the given command, the <option> can be replaced by any of the following options:


    +   - f. This option is used to specify an alternate configuration file for the
    slapd daemon.

    - n. This option is used to specify the service name that will be used for logging
    and other purposes.

    - -l. This option is used to specify the local user for the syslog facility.

    - -u user and -g group. These options are used to specify the user and group.

    - -r. This option is used to specify a run-time directory.

    - -d. This option is used to set the slapd debug level to a specified level. To
    access the LDAP service, the LDAP client first must authenticate itself. If the
    client authentication is successful, the server checks whether the client has
    the required permissions for accessing the requested service. This process is
    called access control.


    In LDAP, three types of authentication are supported:


    +   - Anonymous. In this type of authentication, the client is treated as the
    anonymous one.

    - Simple. In this type of authentication, the fully qualified name of the client
    and the password is sent in clear-text format to the LDAP server for authentication.
    This mechanism is not very secure because the password is sent as clear-text.

    - SASL Authentication. Simple Authentication and Security Layer (SASL) specifies
    a challenge-response protocol in which data is exchanged between the client and
    the server. The challenge-response protocol is used for the authentication and
    establishing a security layer on which subsequent communication will be carried
    out.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Chapter 5 ENCRYPTION AND AUTHENTICATION


    This section discussed authentication by LDAP. Another common method involves
    using passwords. Linux has the password suite, which implements authentication
    through passwords.


    # Password Suite


    On a Linux system, the user information and passwords are stored in the /etc/passwd
    file. The password is encrypted using the hashing technique. The encrypted password
    and the value with which the password was encrypted are both stored in the /etc/passwd
    file. The benefit of storing the encrypted password is that it is very difficult
    to obtain the original password. Therefore, if someone manages to steal your /etc/passwd
    file, the person cannot decrypt the passwords. At most, an attempt can be made
    to guess the original password and then confirm it by first calculating a hash
    for it and then comparing it to the one in the /etc/passwd file. More about such
    attacks is discussed in Chapter 7, the “Word List or Dictionary Attacks” section.


    When a user tries to log on:


    +   1. First, the password hash is retrieved from the passwd file.

    2. Next, the password provided by the user is encrypted.

    3. Then, the encrypted form of the password provided by the user is matched with
    the encrypted password retrieved from the passwd file.


    Storing encrypted passwords in the passwd file is not completely safe. Hackers
    use techniques, such as dictionary attacks, to obtain passwords. Storing the value
    used to encrypt the password in the passwd file is also risky, because unauthorized
    users can easily obtain it once they get access to the passwd file. In addition
    to the passwords, the /etc/passwd file also contains information such as user
    and group IDs, which are used by many system programs. Therefore, the /etc/passwd
    file must have read access for applications that use Linux authentication directly.
    If you deny the read access, the ls -l command displays user IDs instead of usernames.


    Following is a sample output of the ls -1 command:


    ```

    -rwxr-xr-x 1 0  root     2828 Aug 31 2000 arch

    -rwxr-xr-x 1 0  root     64924 Aug 31 2000 ash

    -rwxr-xr-x 1 0  root     384232 Aug 31 2000 ash.static

    ```'
  merge: -1
  img_proc: true
