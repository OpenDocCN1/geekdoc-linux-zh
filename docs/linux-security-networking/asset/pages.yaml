    The upload directive is used to specify whether the directory, <dirglob>, will
    allow uploads:


    upload [absolute|relative] [class=<classname>...] [-] <root-dir> <dirglob> <yes|no>
    <owner> <group> <mode> [dirs|nodirs] [<d-mode>]


    The throughput directive is used to restrict the download file transfer rates
    in a specified directory:


    throughput <root-dir> <subdir-glob> <file-glob-list> <bytes-per-second> <bytes-per-second-multiply>
    <remote-glob-list>


