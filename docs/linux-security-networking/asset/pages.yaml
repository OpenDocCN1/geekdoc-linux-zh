- pgno: 108
  md: '# INTRODUCTION TO THE LINUX FILE SYSTEM


    # /mnt (Temporary Mount Point)


    The /mnt directory is a temporary mount point. Sometimes, it has subdirectories
    for different types of file systems.


    # /lost+found (Lost and Found)


    The /lost+found directory is used for storing files that the file system cannot
    identify when it cleans up the file system. If you lose some data unexpectedly,
    look for it in this directory.


    # /usr (Applications)


    The /usr directory is meant for storing applications. The /usr directory typically
    includes the following subdirectories:


    +   * lib/. This directory contains application-specific libraries.

    * sbin/. This directory contains binaries that are not critical to system operation,
    but without which the system''s functionality would be greatly reduced. For example,
    some binaries available in this directory are crond, l1pd, edquota, makewhatis,
    and traceroute.

    * bin/. Most application binaries reside in this directory.

    * etc/. This directory contains config files for applications.

    * tmp/. This directory is a temporary storage for your applications.


    In addition, /usr has directories that do not have systemwide counterparts. Some
    of these directories are listed here:


    +   * X11 or X1R6/. This directory represents the X windowing application hierarchy.

    * dict/. This directory contains a dictionary.

    * doc/. This directory contains documentation for the applications in /usr/bin.

    * games/. This directory contains game programs.

    * include/. This directory contains files for software development.

    * info/. This directory is used by the info command. The info command can be used
    instead of man, for some applications.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Chapter 3 LINUX DISTRIBUTIONS AND INSTALLATION


    +   - man/. This directory contains man pages.


    +   - src/. This directory contains source code for applications. The Linux kernel
    is stored here.


    The /usr/share directory contains the data that you can share across various applications.
    The /usr directory can contain various utilities, such as awk, emacs, gettext,
    lyx, and vim. Additionally, the directory can contain the subdirectories listed
    here:


    +   - afterstep/


    +   - automake/


    +   - games/


    +   - icons/


    +   - magic


    +   - termino/


    +   - zoneinfo


    Some information and applications are specific to a single network of computers,
    however. For example, you need different applications to run the office and home
    versions of LAN. The /usr/local directory provides storage for this information.
    The /usr/local directory generally is a complete file system. Therefore, the /usr/local
    directory will probably include the bin, etc, games, include, info, lib, man,
    sbin, and src directories. Sometimes, shared and proprietary configuration files
    are located in the /usr/local/share directory. People also store applications
    like a Web server under www, or a database under mysql.


    # Summary


    In this chapter, you learned about various Linux distributions, such as Red Hat,
    MandrakeSoft, Debian, Core, and SuSE. Next, you learned about the different installation
    methods of Linux. You can install Linux via CD-ROM, NFS, hard disk drive, and
    FTP. You also can automate the installation process by using the Kickstart feature.
    Using Kickstart, you can automate tasks such as language, keyboard, time zone,
    package, and mouse selection.'
  merge: -1
