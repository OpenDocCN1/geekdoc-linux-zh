  md: '# SHADOW SUITE


    # Chapter 5 153


    # # Installing Shadow Suite


    You can install the Shadow suite two ways. First, you can install it by using
    the following syntax of rpm command, as you see here:


    ```

    rpm -i <package_name>

    ```


    The other installation method involves steps categorized like this:


    +   - Pre-installation steps

    - Installation steps


    # ## Pre-Installation Steps


    The pre-installation steps are listed here:


    +   1. First, you need to obtain the archive file for the Shadow suite from a
    mirror site. The package you obtain is in the tar format, compressed using gzip.
    To unpack the package, you need to type:


    ```

    tar -xzvf shadow-current.tar.gz

    ```


    > NOTE

    The package should be unpacked to the /usr/src/shadow-YYMMDD directory.


    +   2. Next, you need to copy the Makefile and the config.h file. To copy these
    files, issue the following commands:


    ```

    cp Makefile.linux Makefile

    cp config.h.linux config.h

    ```


    +   3. Make backup copies of the original programs. The programs that you need
    to backup are /bin/sin, /bin/login, /usr/bin/passwd, /usr/bin/newgrp, /usr/bin/chfn,
    /usr/bin/chsh, and /usr/bin/id. In addition, backup the /etc/passwd file.


    +   4. Execute the following command to compile the executables in the package:


    ```

    make all

    ```'
