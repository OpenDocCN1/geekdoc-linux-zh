- pgno: 411
  md: 'In the aftermath of an attack, nothing can prove to be more revealing than
    a comprehensive log accounting for the complete chronology and description of
    the attack. This information is recorded and updated regularly in the system logs.


    Logs are an efficient and easy way to track down past intruders and manage your
    system so that “break-ins” are not repeated. They provide accountability and traces
    that would keep any future hacker from remaining anonymous. Apart from assisting
    in tracking intruders, logs also have intrinsic functions, such as keeping track
    of jobs run regularly on the system, backups, booting information, and other important
    tasks.


    As major archives of sensitive data, these logs automatically are the prime targets
    of any intelligent hacker who wants to cover his trail of intrusion in the system.
    Assuming that any hacker would not consider meddling with these files would be
    underestimating the hacker’s ability, which in recent times has shown great acumen
    for innovative damage and stealth.


    The greatest challenge faced by any system administrator is the segregation of
    information in the logs and deciding which information is important enough to
    be logged and which is to be discarded. The system administrator should take great
    care that these files are inaccessible to the majority of users and remain untraceable.


    # # What Are Log Files?


    Log files are activity recorders. Every operation that is done in a computer,
    irrespective of whether it was successful or resulted in an error, is recorded
    in a log. This sequential recording is known as logging.


    In any computer, the operations or activities can be general system activities
    or service specific. Similarly, logs can be general system logs or service specific
    logs. A few uses of logs are listed here:


    +   - Help in intrusion detection

    - Create demographic statistical reports

    - Create system summary reports'
  merge: -1
  img_proc: true
- pgno: 412
  md: 'The log files in any Linux system reside in various directories. By default,
    most important log files are stored in the /var/log directory. If some packages
    were customized during installation time, the logs files also may be present in
    other directories. The access to all important system logs is reserved with the
    system administrator unless indicated otherwise. All user logs are modifiable
    by the owner of the respective log and by the super user. In addition, service-specific
    logs can be written or appended by respective service daemons.


    # # Important Log Files


    As already discussed, log files can be general activity logs or service-specific
    logs. A few important log files that reside in your Linux system and are important
    from the network security aspect are discussed in detail in the subsequent sections:


    +   - System Logs

    - Kernel Logs

    - Apache Web Server Logs


    System logging in a Linux box is done by the system logging daemon (syslogd) and
    kernel logging daemon (klogd). The log configuration, which includes the parameters
    and the basic rules for logging, is stored in the /etc/syslog.conf file. All log
    messages are typically redirected and stored in the /var/log directory. Some of
    the common systems logs in Linux are listed here:


    +   - boot.log. This file contains all messages and relays generated for the services
    starting and stopping during system startup and shutdown.


    +   - cron. This file is used to store messages generated by the cron daemon.
    We can see the start time of each job as well as information about any errors
    that may have occurred during execution of the job.


    > NOTE

    Cron jobs are specific processes that are scheduled to run at regular intervals
    in the system.'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# Chapter 12 SYSTEM LOGS


    +   - error_log. This file contains information about error messages generated
    by processes running in the system.

    - dmesg. This file contains messages that are generated during system startup
    regarding hardware initialization. It is particularly useful for debugging hardware
    failures.

    - maillog. This file records the messages and activities of the sendmail daemon.


    # NOTE


    Sendmail daemon is a service used to send and receive e-mail messages. This service
    has been discussed in greater detail in Chapter 9, "Other Network Servers."


    +   - messages. This file stores the messages generated by the various processes
    in the system, such as apmd and xinetd.

    - secure. This file is one of the most important log files that can aid you in
    cracking down attackers on your system. It contains all data about remote hosts
    logged into your system, including attempts to log into your system. Any discrepancy
    in the secure file indicates a breach in security.

    - xferlog. This file stores the files that have been transferred, uploaded, downloaded
    to and from your ftp server.

    - wtmp. This file contains information about those who are currently logged on
    to your system and what each one of them is doing.

    - lastlog. This file contains the latest login time and date for each user logged
    on your system.


    In addition to these files, there are other logs present in the system; these
    are also stored in the /var/log directory. A few of them are listed here:


    +   - httpd. All messages from Apache are stored in this file. This file is created
    only if Apache Web server is installed in your system.

    - news. Messages from Internet news service are stored in this file.

    - samba or log.smb. The messages that are generated by the SAMBA server are stored
    in this file.'
  merge: -1
  img_proc: true
- pgno: 414
  md: '# IMPORTANT LOG FILES Chapter 12


    > NOTE

    SAMBA is a server that enables Linux computers to masquerade as a Windows computer
    and access all shared files and printers using the SMB protocol. SAMBA has been
    discussed in greater detail in Chapter 9, "Other Network Servers."


    +   - uucp. Status messages from the UNIX-to-UNIX copy protocol daemon are stored
    in this file.


    # General System Logs


    General system logs mainly constitute the System activity logs and the Kernel
    logs. Both these logs are managed by two daemons that come with the syslogd package.
    The two daemons have been listed below:


    +   - syslogd

    - klogd


    Almost all log files in the /var/log directory are maintained and updated by syslogd.
    The function of syslogd is to accept messages from other processes, sort them
    by their type and priority, and write the information to the respective log file.


    syslogd provides the following advantages:


    +   - a centralized logging facility instead of a distributed logging system in
    which each program writes the log independently.

    - Saves much needed system resources and also provides ease of use because anyone
    can configure syslogd according to their own priorities.

    - Logs can be maintained on remote computers. This feature is particularly handy
    for system administrators who are handling a vast network of computers. It also
    provides a major security advantage if any hacker breaks into a system, he cannot
    change or delete any log files because the log files are not stored in the same
    computer.


    Besides handling messages generated locally within a system, the syslog daemon
    can also accept messages from other computers connected to the system via LAN
    or the Internet.'
  merge: -1
  img_proc: true
- pgno: 415
  md: '# syslogd Installation


    Before you begin installation, it is important to check for an already installed
    version of syslogd. To verify this, type the following command at the command
    prompt:


    ```

    rpm -q syslogd

    ```


    If it is not installed, you can download the syslogd rpm file for your Linux distribution
    from either www.rpmfind.net or from the home site of your Linux distribution.


    # TIP


    The syslog daemon and the klog daemon are automatically started during system
    boot up if they have been installed from the /etc/init.d/syslog script.


    The syslog script can also be executed manually to perform operations, such as
    starting, stopping, restarting, or finding out the status manually. The command
    to do this is as follows:


    ```

    /etc/rc.d/init.d/syslog start | restart | status

    ```


    # Configuring Daemons


    Each system has its own needs and requirements. As a result, the levels and priorities
    of logging might vary from system to system. By default, the syslog daemon works
    according to the configuration file /etc/syslog.conf. However, this file can be
    edited to suit specific requirements.


    To edit the syslog.conf file, you need to be logged in as the superuser. Therefore,
    if you are already logged into the system, type su to become the root user. Then
    open the configuration file /etc/syslog.conf using any text editor, such as pico
    or vi.


    To view the entire set of commands related to editing of the syslog.conf file,
    type the following command:


    ```

    man syslogd

    ```


    The syslogd manual will be displayed on the screen.'
  merge: -1
  img_proc: true
- pgno: 416
  md: '# IMPORTANT LOG FILES


    To write to the syslog.conf file, you will have to understand and then appropriately
    modify two fields:


    +   - **The selector field.** Defines which information is to be logged.

    - **The action field.** Defines where information is to be logged.


    # The selector Field


    The selector field specifies the type and priority of the message to be logged
    as well as other characteristics that might pertain to selective logging. Therefore,
    the selector field must contain at least one of the two sub-fields listed here:


    +   - The message type

    - The message priority


    # Message Type


    The message type is also called a *facility* and can be one of the following:


    +   - **kern.** This facility tracks kernel messages.

    - **cron.** This is a daemon, which can be used to schedule jobs to run at specific
    time periods. The cron facility in the selector field tracks messages from the
    cron system.

    - **daemon.** This facility is used to track messages from additional system daemons.

    - **auth.** This facility is used to track authorization messages from the system.
    It is essentially a security feature that can track every program that uses the
    Linux authentication scheme.

    - **lpr.** This facility is used to track printer system (lpd).

    - **authpriv.** This is a security feature that tracks security and authorization
    messages.

    - **mail.** This is used to track all mail system messages.

    - **news.** This is used to track the Internet news service messages.

    - **uucp.** This tracks UNIX-to-UNIX copy protocol messages.'
  merge: -1
  img_proc: true
- pgno: 417
  md: '# Chapter 12 SYSTEM LOGS


    # Message Priority


    This part of the field is not required unless you want to segregate the output
    from the other messages. It proves useful in situations where a large number of
    messages are generated in the system.


    The types of priority parameters are as follows:


    +   * alert. This is used to indicate a serious malfunction, which requires immediate
    attention by the user.


    +   * crit. This indicates a fatal problem and demands quick action.


    +   * debug. This provides debugging and the output information of the processes
    currently running.


    +   * emerg. This indicates an emergency condition.


    +   * err. These messages consist of errors committed on the system; typically
    STDEAR.


    +   * info. This provides information (text messages) about any program that you
    specify.


    +   * notice. This is used to generate standard messages.


    +   * warning. This provides standard warning messages if a function could not
    be completed.


    # The action Field


    The action field specifies the task that the system logging should do with the
    information gathered by the first field, the message type. The output target can
    be anything from a file to a user message. The various choices are as follows:


    +   * To a file. The target name contains the target filename; for example, /var/log/kern.log.


    +   * To the console. The target contains /dev/console.


    +   * Through targeted pipes. The target is a named pipe that can be created using
    the mkfifo command; for example, .file > /var/log/output.log.


    +   * To a remote system. The target contains the ID of a remote system, such
    as a dedicated logserver; for example, @localhost.


    +   * To a group or to users. The target contains the UID, GID, or a * (indicates
    that the message to be sent to all the users).'
  merge: -1
  img_proc: true
- pgno: 418
  md: '# Some Examples of Writing to syslog.conf


    Below is an example of the syslog.conf.


    In the following listing, lines beginning with a # indicate a comment.


    ```

    # Log all kernel messages to a kernel log file

    kern.*                              /var/log/kernlog

    #Log all mail authpriv messages to the screen

    authpriv.*                         /dev/console

    #log all cron messages to a log file

    cron.*                              /var/log/cron

    #Emergency messages are sent to all plus they are logged on another system

    *.emerg

    # Till now all these messages did not have a a priority field

    #In case of news or mail errors

    news.=crit                        /var/log/newscrit.log

    news.=err                          /var/log/newserr.log

    mail.=crit                        /var/log/mailcrit.log

    mail.=err                          /var/log/mailer.log

    #(message type and priority)      (target file or action field)

    ```


    In the preceding listing, notice that the lines containing the rules for logging
    two fields, the selector and the action field, which are separated by colons:


    # Redirecting Log Messages to a Dedicated Loghost or Logserver


    To send messages to a loghost or a logserver, simply replace the action field
    with the symbol @ and the identifier or name of the loghost. A sample is given
    here:


    ```

    #Log anything (except mail) of level info or higher

    #Don''t log private authentication messages

    *.info:mail.none;news.none;authpriv.none;cron.none  @loghost


    The authpriv file has reserved access rights

    authpriv.*                         @loghost


    #log all mail and news messages to the loghost in one place

    mail.*;news.*                      @loghost

    ```'
  merge: -1
  img_proc: true
- pgno: 419
  md: '#log all kernel messages to the loghost

    kern.* @loghost


    Using the preceding configuration will enable the syslog of one system to export
    its log messages to another loghost or remote system for better security. After
    the logs are sent, they will be handled by the system-logging daemon, which is
    running on the target system.


    This also provides easy portability and transfer of the loghost. If you ever want
    to change the loghost, simply replace the loghost alias with the name of the new
    loghost system instead of editing each computer''s syslog.conf individually.


    # Apache Server Logs


    Apache Web server logs are written by the httpd daemon. The default directory
    for storing apache logs is /var/log/httpd/apache. Two important logs files are
    generated by Apache:


    +   - access_log

    - error_log


    # access_log


    This file stores the general access activity handled by the Apache server. The
    apache configuration file provides several directives and sections that can be
    modified to store more or less information in the log files. The default columns
    in a particular row of the access_log file contain the following information:


    +   - Visitor''s IP address. This is the IP address of the client machine made
    a request to the browser.

    - Time and date of event. This column specifies the time and date of the event.
    The time and date mentioned in the log is according to the system clock settings
    of the server.

    - Commands and requests. This column logs the type of request, the document that
    was requested, and the content type header that was sent by the server.

    - Status code. This is the result code for the logged event. The server according
    to the result of the event generates these codes. Result codes have been discussed
    in detail later in the chapter.'
  merge: -1
  img_proc: true
