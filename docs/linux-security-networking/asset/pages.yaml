    # Running AMANDA


    After configuring, you can run AMANDA completely hands-free. The amdump command
    takes care of the normal AMANDA backup runs. Amdump can be run completely in an
    automated mode cron. You should run cron as the AMANDA user, not root or the installer.
    The amdump command performs the following tasks:'
  merge: -1
