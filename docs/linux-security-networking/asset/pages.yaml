    Be careful when dealing with file systems in Linux. You should take the following
    precautions:


    +   - Never store files in the root directory, and never create new directories
    in the root directory unless you cannot do without them.


    +   - Use your home directory (/home/<username>) to store data. You can create
    subdirectories to organize data.


    +   - Directory and file names under Linux are case-sensitive. If you make a capitalization
    error in typing a directory or file name, the case sensitivity can cause problems,
    such as missing files.


    Setting up partitions for Linux is very similar to setting up partitions for other
    operating systems, such as MS-DOS. To create your Linux partitions, use the Linux
    version of the fdisk program. After you create the partitions, you can create
    file systems on them. This allows the partitions to be used by the Linux system.


    # Introduction to the Linux File System


    Linux uses a single hierarchical file system layout. It uses the same inverted-tree
    type directory hierarchy as UNIX. There''s a root directory at the top and other
    directories are spread out below the root. The / is the root of the directory
    structure in Linux.'
