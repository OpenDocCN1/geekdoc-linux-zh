- pgno: 481
  md: '# Appendix C FUTURE OF LINUX


    +   - mod_ss1. This module provides an interface to the SSL/TLS encryption protocols
    provided by OpenSSL.


    +   - mod_dav. This module implements the HTTP Distributed Autoring and Versioning
    (DAV) specification for posting and maintaining web content.


