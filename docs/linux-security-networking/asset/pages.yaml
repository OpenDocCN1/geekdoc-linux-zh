- pgno: 451
  md: '# 424 Chapter 13 SYSTEM BACKUPS


    Each holding disk is to be configured in the holdingdisk section in the amanda.conf
    file. Each option in the section is explained in Table 13-10.


    Table 13-10 Options in the holdingdisk Section

    | Option | Description |

    |---|---||

    | comment | This option contains details of the holding disk. |

    | directory | This option contains the path to the holding area. The default value
    is /dumps/Amanda. |

    | use | This value contains the amount of space that can be used in this holding
    disk area. If partitions are dedicated to AMANDA, you can set this value as negative.
    This instructs AMANDA to use all available space minus that. |

    | chunkSize | This value contains the holding disk chunk size. If the value is
    negative, the dumps larger than the size of the holding disk will be written directly
    to the tape. Positive number values cause the dumps in the holding disk to split
    into chunks of the size of the chunksize value. |


    The backup options can be specified in the config file. The dumptype section of
    the config file contains the backup options. The options might be used to configure
    various settings, such as using compression, recording results of backups, and
    so on.


    The amanda.conf file can define multiple types of tape media. The characteristics
    of the tape media can be set in the tapetype section in the amanda.conf file.
    After setting the tapetype definition, set the tapetype parameter to reference
    it.


    If you are not using any special hardware to mount tapes, such as a robot or stacker,
    you should either set the tapedev parameter to no-rewind device name or set up
    the AMANDA chg-manual changer script. This script prompts for tape mounts, when
    required, usually on the terminal of the person running AMANDA. Other popular
    tape changers are chg-multi and chg-scsi. These changers have configuration files.
    You can specify your settings for the changers in these files and specify the
    path to the configuration file in the amanda.conf file. There are samples in example/chg-multi.conf
    and example/chg-scsi.conf, respectively.'
