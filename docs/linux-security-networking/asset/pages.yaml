    # IP Spoofing


    IP spoofing is a way of hiding your identity on a network. Any computer can hide
    its original identity using public proxy servers. Most protocols, such as TCP,
    two-way communication protocols. Many attacks on the Internet use the reliability
    of two-way protocols against the servers that employ these protocols.


    A proxy server is a kind of storage buffer between your computer and a Web site
    on the Internet you are accessing. The Web site does not necessarily need to use
    the HTTP protocol. A Web site can be an anonymous FTP server, a POP mail server,
    an SMTP or IMAP server, and so on. The main functional difference between using
    a proxy and not using a proxy server between your computer and the end resource,
    a reply to your request doesn''t come to you directly; it comes to the proxy server
    first, and from there, it is relayed to you.


    Proxy servers employ a well-known concept of caching. Caching is nothing but a
    way of locally storing accessed data. A proxy can store files locally. As a result,
    whenever a user requests these files, instead of downloading them from the Web
    site, the proxy server simply checks whether the documents are up-to-date and
    furnishes them from local storage. This mechanism of proxy servers can effectively
    enhance the performance of a network.


    Many Web sites record IP addresses of their visitors to track their movements
    through pages and monitor visitor trends. Your visit to each page can be logged
    into a database and used later to generate demographic data or gather information
    about you.


    A solution was developed to prevent Web sites from extracting information about
    your identity. The solution came up in the form of public proxy servers. These
    proxy servers are free and open to everyone on the Internet. There are a large
    number of public proxy servers available in many countries. Some of these require
    a user to log on to a Web site while allowing anonymous proxy usage. To obtain
    a list of free proxy servers on the Internet, trying searching for public proxies
    or free proxies.'
  merge: -1
  img_proc: true
