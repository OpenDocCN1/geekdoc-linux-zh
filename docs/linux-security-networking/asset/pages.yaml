    # Administration Utilities


    Numerous administrative utilities are available for managing and maintaining a
    Linux computer. In this section, I discuss the following utilities:


    +   - YaST

    - Sudo

    - Super


    # YaST


    Yet Another Setup Tool (YaST) is a command line graphical interface that provides
    a user-friendly approach to many administrative tasks of Linux administration.
    However, it does not have the ability to restrict user access, which makes it
    useful for minimizing errors and allowing users to administer their systems. Unlike
    Linuxconf, YaST is not network aware, which means that you must log into each
    computer you want to manage.


    # Sudo


    Superuser do (Sudo) allows a system administrator to give users, or groups of
    users, the ability to run commands as root users. Its features are listed here:


    +   - Sudo restricts the commands a user can execute.

    - Sudo logs details of each command being executed. When used along syslog, the
    system log daemon, Sudo can be configured to log all commands to a central host
    as well as to the local host. Sudo also can be configured to log all the attempts,
    whether successful or unsuccessful, of'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'the commands being executed. In addition, sudo can also log errors generated
    while executing the command. These events are logged in the syslog (3) file. However,
    this log file is changeable.


    +   - Sudo uses timestamp files to implement a timeout system. Users, upon invoking
    sudo, are prompted for their password. Upon validation, they are granted a ticket
    for five minutes. This timeout is configurable at compile-time. Each subsequent
    sudo command updates the ticket for another five minutes.


    +   - The configuration file of Sudo, sudoers, is set up in such a manner that
    the same sudoers file may be used on many machines. This allows for central administration.
    However, the flexibility to define a user''s privileges on a per-host basis is
    still available.


    Sudo allows a user to execute a command as the superuser, as specified in the
    sudoers file. The uid and gid of the user are set to match those of the superuser,
    as specified in the passwd file. The /etc/sudoers file contains the list of authorized
    users. Sudo uses this file to validate users. If a user not listed in this file
    tries to log on, an error message is generated.


    By default, sudo requires that users be authenticated with a password. The authentication
    password is normally the user''s password, not the root password. After a user
    has been authenticated, a timestamp is updated and the user can use sudo without
    a password for a permitted period of time. The prompt for password will also time
    out if the user''s password is not entered within five minutes, unless it''s overridden
    by a modification in the sudoers file. You can update the default timestamp by
    running the sudo command with the -v flag.


    > NOTE

    E-mail message will not be sent if an unauthorized user tries to run sudo with
    the -1 or -v flags.


    +   - The -V (version) option is used to print the version number of sudo. When
    executed by the root user, the -v option prints a list of defaults.


    +   - The -l (list) option is used to list the commands that are allowed or restricted
    for a user.


    Sudo accepts the following command line options:'
