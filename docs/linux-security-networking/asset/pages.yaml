    of mmap_static in Apache 1.3.


    # Enhanced Modules


    Here are some improved modules in Apache 2.0:


    +   - mod_auth_digest. This module provides additional support for session caching
    across processes using shared memory.


    +   - mod_headers. This module can be used to modify request headers used by mod_proxy.
    This module is much more flexible in Apache 2.0, as compared to previous versions.


