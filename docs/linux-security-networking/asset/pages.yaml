- pgno: 463
  md: '# Linux Partitions


    You need to set up Linux partitions during Linux installation. Be sure to take
    proper care while partitioning the hard disk. You should ensure that no components
    of Linux are installed in the boot partition of Linux. No file systems containing
    files that can be modified by ordinary users reside on the boot partition of Linux.
    Here are a few guidelines about file systems or directories that should not be
    present in the boot partition:


    +   - You should not place user logfiles in the boot partition. These logfiles
    sometimes so huge that they can consume all the space on the system. This might
    cause Linux to crash.

    - File systems with critical system components and configuration should be stored
    on separate partitions. Then if a user data partition gets corrupted, the rest
    of the system remains safe.

    - Partitions with system binaries should be mounted as read-only prevent anyone
    from modifying them. A possible disadvantage of doing this is that more effort
    is required at the time of upgrading.

    - The root directory requires extra care. It should be modifica by users other
    than the root. You need to restrict users'' access to the directory completely.

    - All backup files should reside on a separate partition, or if enough resources
    are available, on a separate partition.


    # The/home Directory


    /home directory contains users'' home directories, and users have write permissions
    to these directories. E-mail client programs also store their e-mails in this
    directory. This file system can grow huge very rapidly. If any users have limited
    disk quotas, space overuse can cause a lot of problems.'
  merge: -1
  img_proc: true
- pgno: 464
  md: '# GENERAL BEST PRACTICES Appendix A 437


    Here are some of the precautions you should take while dealing with the /home
    directory:


    +   - Store the /home directory on a partition separate from the boot partition.
    User directories can grow huge and storing them in the boot partition can cause
    damage to the Linux system.


    +   - Storing the /home directory on a separate partition restricts users from
    creating hard links to the /home directory and other files inside the /home directory.
    Hard links are links that point to the actual INODE of the files.


    +   - The /home directory should be mounted in nosuid mode.


    +   - If possible, also mount the /home directory as noexec. Although this is
    a good security measure, it can put many restrictions on the users.


    # General Best Practices


    A few best practices are listed here:


    +   - Ensure the software is downloaded from secure and authentic Web sites. As
    an added precaution, validate the installation file checksums like PGP or MD-5
    signatures before installation is done.


    +   - Ensure the partition sizes are set according to the data that will be stored
    in them. Partitions that contain writable data should have extra space beyond
    their expected use.


    +   - Ensure the partition scheme and security policies are well documented and
    are kept in safe custody. After reading the documentations, a new administrator
    should be able to restore a damaged system without much effort. The document should
    specify the details of the services that are needed, storage location of all configuration
    files, important directives in all running services, authentication schemes in
    use, details of backup server, and restore procedures.


    # Stop All Unused Services


    In a Linux system, services that are running are the only ones that can be attacked.
    Other services that are installed on the server but have not been started either
    at boot time or manually are not vulnerable to network attacks. An administrator'
  merge: -1
  img_proc: true
- pgno: 465
  md: '# 438 Appendix A LINUX-BEST PRACTICES


    should analyze closely all the services that are required on the server and stop
    the rest of the services. Apart from these services, an administrator should try
    to avoid running services that can be remotely utilized in any way and do not
    use any kind of encryption. The following list provides a few services that are
    not recommended on a Linux computer unless they are critically:


    +   - login. This service allows remote terminal sessions.

    - rstat. This service serves kernel performance statistics.

    - usersd. This service provides information on users that are currently logged
    on to the system.

    - tftpd. This service is used to transfer files between computers. tftpd doesn''t
    support any authentication mechanisms; therefore, it can be used to transfer only
    those files that are publicly accessible.

    - talkd. This service allows remote users to communicate with each other. This
    program allows two or more remotely logged on users to copy and paste data from
    the terminal screen of one user to that of another.

    - fingerd. This service provides an interface to the finger program at most network
    sites. The program displays a user-friendly and detailed status report on either
    the system at the moment or a particular user.

    - uscp. This service copies files between systems.


    To stop services that are not required, you need to make changes in the /etc/inet.conf
    file. You can turn off a service by placing a # symbol in front of it. It stops
    the service from starting during the next system reboot.


    Not all services that run in Linux systems are controlled by the inet daemon.
    Therefore, in addition to commenting out services from the inetd, check /etc/inittab
    to look for other programs that are being executed at boot time.


    # Secure Protocols for Remote Administration


    Administrators should avoid using remote terminal protocols such as login and
    telnet. Instead, use encryption-based protocols, such as SSH. SSH protocol ensures
    that the information you type at your local computer is not sent across a network
    in plain text. Data is encrypted using dual key cryptography before it is transmitted
    over an unreliable network.'
  merge: -1
  img_proc: true
- pgno: 466
  md: '# Choosing Your Passwords


    Passwords should be strong enough that they won''t be guessed by anyone. The only
    way to crack your password is using a brute force attack. Brute force attacks
    can be made impractical by choosing longer passwords and using wider character
    sets in your passwords. Here are a few guidelines you can keep in mind while choosing
    your passwords:


    +   - Your login name should not be related to your password in any way. Other
    common mistakes are reversed, capitalized, doubled, and numbered forms of your
    login name

    - Your password should not contain your first, last, or middle name in any form.
    Neither it contains names of your spouse, child, dog, license plate numbers, telephone,
    home addresses, or any other information about that can be easily guessed

    - Your passwords should not be all letters or all numbers. Passwords that contain
    combinations of mixed-case letters, numbers, and punctuation marks are difficult
    to guess or crack

    - Do not use words in language directories. Brute force attacks are often based
    on language and name databases.

    - Choose longer passwords. Passwords should be longer than six characters.

    - Choose a password that is easy to remember and you don''t have to write it down.
    The first character of each word from a line in one of your favorite songs can
    be a good password.

    - Choose passwords that you can type very quickly without looking at the keyboard.


    Apart from these guidelines, passwords should be changed at regular intervals.
    Some security advisory boards encourage you to change your passwords every 30
    days.


    # Regular Updates


    All services running in your system should be updated regularly. Administrators
    should subscribe to popular security advisory lists, such as www.cert.org, to
    keep themselves updated about all version updates and security patches. All running
    services in a system must be updated as soon as the upgrades are available.'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# Appendix A LINUX-BEST PRACTICES


    Running an older system is an open invitation to attackers. A hacker can easily
    know the version you are using because most services display version numbers in
    the output of various commands.


    # Make Backups


    You should make regular backups of your critical files. No security software or
    policy is 100 percent safe. If a system is compromised, the only means to restore
    the system is to use backups. Every storage media has a limited lifetime. Older
    backup media should be verified at regular intervals and replaced with newer media.


    # Enable Shadow Suite


    Shadow Suite is a good security tool that can discourage attackers from trying
    to download your password files. You should use Shadow Suite to protect your password-related
    information.


    # BIND


    Here are the guidelines regarding BIND:


    +   - If a master server is maintained in a server, ensure that /etc/named.conf
    is modified suitably to restrict zone transfers. The allow-transfer option should
    explicitly mention the IP address of the master server.

    - If a Slave or Secondary is running on your system, all zone transfers should
    be restricted. The allow-transfer option should not have anything next to where
    the directive is placed in the file.

    - Ensure that named is chrooted.

    - Ensure that all events in the DNS server are being properly logged by syslog.
    The /etc/rc.d/init.d/syslog should contain the following line:


    ```

    daemon syslog-a /home/dns/dev/log.

    ```'
  merge: -1
  img_proc: true
- pgno: 468
  md: '# Sendmail


    Here are some guidelines regarding sendmail:


    +   - Permit only fully qualified domain names and subdomains for mail relays.
    The /etc/mail/access file should be modified to include valid networks to mail
    relaying.


    +   - Review the /etc/sendmail.cf file to ensure that the SMTP vry and expn have
    been turned off.


    +   - Ensure that the POP/IMAP servers are of the latest stable version available.


    +   - Set up TCP wrappers in /etc/hosts.allow to allow mail deliveries only to
    authorized networks.


    +   - Set up domain name masquerading by modifying the /etc/sendmail.cf file.


    +   - Set up SSL wrapper to secure POP/IMAP connections.'
  merge: -1
  img_proc: true
