    There is a data structure in the system memory of the server. This data structure
    describes all connections that have not yet been approved or disapproved by the
    server. Each data structure is of a finite size and occupies space in system memory.
    Too many half-open connections can fill this space. When this space eventually
    gets filled, the server will not accept any new connections, resulting in Denial
