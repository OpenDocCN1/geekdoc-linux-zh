- pgno: 356
  md: '# SECURE PROTOCOLS


    Chapter 10


    # Secure Protocols


    In the Internet age, when business transactions are happening increasingly over
    the network, you need to secure your data that is being transmitted. Hackers and
    unauthorized users keep attacking the network. One way you can discourage hackers
    from doing so is to use secure protocols. The following two secure protocols are
    commonly used today:


    +   - Secure Socket Layer (SSL)

    - Secure Shell (SSH)


    # SSL


    The SSL protocol was developed by Netscape. SSL provides privacy and reliability
    between communicating applications and prevents unauthorized access to data over
    the network. It provides encryption for the server and client, as well as message
    authentication services. SSL is a layered protocol. It runs above the TCP/IP protocol
    and below the higher level protocols, such as Telnet, FTP, or HTTP.


    Some of the features of SSL are as follows:


    +   - Cryptography security. SSL establishes a secure connection between the communicating
    parties. A symmetric encryption is used after an initial handshake to define a
    secret key.

    - Reliability. SSL establishes a reliable connection. Message transport includes
    a integrity check using a keyed Message Authentication Code (MAC). Secure hash
    functions are used for MAC computations.

    - Interoperability. SSL enables different applications to exchange cryptographic
    messages successfully.

    - Extensibility. SSL provides a framework that allows new public-key and encryption
    methods to be incorporated whenever necessary.

    - Relative efficiency. Cryptographic operations tend to be highly CPU-intensive.
    For this reason, the SSL protocol includes options, such as caching and compression,
    that allow a reduction in the number of connections that need to be established
    from scratch and a reduction in network activity.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# Chapter 10 LINUX NETWORK DEFENSE AND INTRUSION DETECTION


    The SSL protocol supports different ciphers. It uses symmetric cryptography—such
    as DES, RC4, and Triple DES—for data encryption and also supports public-key cryptography,
    such as RSA, DSS, and KEA.


    SSL is located above a reliable transport layer, such as TCP, and below an application
    layer. It takes the data of the application to be sent, fragments it into manageable
    blocks, compresses it, applies a MAC to the data, encrypts it, and transmits the
    result. When data is received, the reverse process occurs: the data is decrypted,
    verified, decompressed, reassembled, and delivered to the application layer.


    SSL protocol has two important states:


    +   * SSL session state

    * SSL connection state


    An SSL session state has the following parameters:


    +   * Session ID. An arbitrary byte for identifying the session state.

    * Peer certificate. An X509.v3 certificate of the peer.

    * Compression method. Definition of compression algorithm.

    * Cipher method. Definition of cryptography and MAC algorithms to be used when
    application data is to be transmitted.

    * Master secret. A secret shared value between client and server.

    * Is resumable. Flag for indicating whether the session can be used for other
    connections.


    A connection state consists of the following components:


    +   * Server and client random numbers

    * SERVER-MAC-WRITE-SECRET

    * CLIENT-MAC-WRITE-SECRET

    * SERVER-WRITE-KEY

    * CLIENT-WRITE-KEY

    * Initialization vectors

    * Sequence number'
