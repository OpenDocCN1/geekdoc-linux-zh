    # The CacheNegotiatedDocs Directive


    The CacheNegotiatedDocs directive allows the proxy to cache the content-negotiated
    documents. Doing this enables clients behind the firewall to extract the cached
    documents and, as a result, save time and bandwidth.


    +   # CacheNegotiatedDocs: By default, Apache sends ''Pragma: no-cache'' with
    each

    # document that was negotiated on the basis of content. This asks proxy

    # servers not to cache the document. Uncommenting the following line disables

    # this behavior, and proxies will be allowed to cache the documents.

    #


