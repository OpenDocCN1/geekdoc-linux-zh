    # Log Filtering


    Log filtering is a process that is used to remove junk data from a log file. Such
    junk data can become because of inadvertent recursive operation, hack attempts,
    or improperly configured cron jobs. Such accidents can cause log files to become'
  merge: -1
  img_proc: true
- pgno: 425
  md: 'extremely large with useless data. This data can cover a majority portion in
    log files and can significantly affect statistics that are extracted from these
    logs.


    Log filtering can be done on the basis of the following criteria:


    +   **Pattern matching.** This involves removal of rows from a log that have a
    common pattern. An example could be too many users with spurious IP addresses
    trying to access a particular non-existent file.


    +   **Time period based filtering.** This process involves removal of particular
    sets of records that were recorded in a particular time frame. For example, when
    some tests were being performed on the server, a lot of data might get recorded
    in the logs. This data is useless unless the testing is complete. If an administrator
    knows the time frame of this period, such entries can be safely removed from the
    main logs.


    +   **Source based filtering.** Source based filtering is done by removing all
    log entries that originated from an identified client source. Such filtering is
    done generally after remote brute force attack attempts.


    # Tools for Managing Log Files


    In a single computer or a very small network, the amount of log generated is mostly
    intrinsic, and therefore, very small in size. You won''t have any problems handling
    the small quantity of logs; however, in a large network or in a Web server that
    is publicly accessible over the Internet, massive logs are generated because of
    heavy traffic to and from the system. Any adept system administrator should sort,
    backup, and rotate the logs regularly. There are various methods of log rotation;
    one discussed in the following section is called logrotate.


    # logrotate


    logrotate is a package that allows an administrator to manage log files on a system.
    The logrotate program can perform various functions of system logs such as those
    listed here:


    +   **Rotating log files.** This is a process in which log files are copied to
    a new location and a blank file is left in the original location. This process
    helps in dividing log files into smaller chunks.


    +   **Compressing log files.** This process involves compressing old log files
    that were copied during the rotate process. This compression saves disk space
    on servers, which is a limited resource.'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# LOG FILTERING Chapter 12 399


    +   - Taking backup of log files. This is a process that gathers all the logs
    from original locations or from the files that were created during the rotation
    phase. These files then are put together separately in a sequential format, which
    can be later used to restore original logs or be analyzed for attack matching.


    +   - Exporting system logs. This is a process of freeing disk space from the
    main server and storing the logs in cheaper backup mediums or those servers that
    have ample disk space. This process is a critical need and is a very good asset
    at times when the server crashes. Exported logs are not affected by any problems
    in the original server; therefore, to a certain extent they may be used to find
    the cause of the problem.


    logrotate has been specially designed to facilitate the task of system administrators
    who manage systems related to a fairly large amount of traffic. logrotation is
    a critical process in administering a Linux server because log files are ever
    growing in nature. Servers with high traffic activity can choke themselves if
    the log files become too large. In addition, for every periodic log analysis,
    it is better to analyze a log file that was created only during the fixed time
    period. Extracting periodic information from a single massive log file is a wasteful
    activity and can increase the load on the server unnecessarily.


    Maintaining a single huge log file has some disadvantages that might not be easy
    to see. In a single huge file, every time the log is analyzed, the log file needs
    to be locked by the software. This means that the log-writing daemon will have
    no write/append access to the log for that period, which could mean loss of information.
    If logs are rotated at regular time intervals, older logs can be analyzed safely
    while the log recording daemons can continue to write to fresh log files.


    The logrotate package itself is very flexible and allows any chronology or parameter
    for execution. You can run logrotate as a daily, weekly, or monthly job or specify
    other parameters as log file sizes for its execution. logrotate is run according
    to a user-specified configuration file. This file can be modified to suit any
    particular purposes of the user.'
  merge: -1
  img_proc: true
- pgno: 427
  md: "# The logrotate configuration file\n\nEach time logrotate is run, the program\
    \ reads its options from a configuration file, which is created and modified by\
    \ the user. Following is a typical logrotate configuration file:\n\n```\nerrors\
    \ webmaster@localnetwork.net\ncompress\n/var/log/messages {\n  rotate 3\n  daily\n\
    \  notifempty\n  postrotate    /sbin/kill -9 syslogd\n  endscript\n}\n```\n\n\
    The first lines are the global parameters for the configuration file. They specify\
    \ that all error message logs are to be mailed to webmaster@localnetwork.net and\
    \ that all the logs should be compressed for export.\n\nThe rest of the lines\
    \ are a set of rules for the respective log file; in this case, the /var/log/messages\
    \ file. These rules are written using a directive based language.\n\nThe section\
    \ begins with the filename of the log file, and then lists all the lines based\
    \ upon a set of directives enclosed within an opening brace{ and a closing brace\
    \ (). Consider this:\n\n```\n/var/log/messages { # work on the log file /var/log/messages\n\
    \  rotate 3 # rotate the log file 3 times before removal\n  daily # rotate the\
    \ log file daily\n  notifempy # do not rotate the log file if it is empty\n  postrotate\
    \ # indicates that the file has been rotated and do the\n  following things...\n\
    \  /sbin/kill -9 syslog # run after rotation basically kill the daemon\n  endscript\
    \ # indicates end of script\n} # closing brace\n```"
  merge: -1
  img_proc: true
- pgno: 428
  md: '# LOG FILTERING Chapter 12 401


    A list of important logrotate configuration file directives is as follows:


    +   - **compress**. This keyword, if present in a set, tells the logrotate program
    that the old log file is to be compressed using gzip.


    +   - **nocompress**. This keyword indicates to logrotate that the final log files
    need not be compressed


    +   - **create mode owner group**. When logrotate rotates an old log file, it
    creates a new one in its place.The create command is used to specify the new file''s
    mode, owner, or group rights.


    +   - **ncreate**. This directive is used to specify that logrotate should not
    create a new log file.


    +   - **daily**. The daily directive is used to specify that logrotate should
    rotate the logs daily.


    +   - **weekly**. The weekly directive specifies that logrotate should rotate
    the logs weekly.


    +   - **monthly**. The monthly directive specifies that logrotate should rotate
    the logs monthly.


    +   - **errors <e-mail address>**. This directive is used to indicate that all
    error logs should be sent to the specified e-mail address.


    +   - **mail <e-mail address>**. This directive is used to specify the e-mail
    address to which logrotate will mail the final files (after rotation and compression).


    +   - **nomail**. This directive is used to indicate that logrotate need not mail
    the final files anywhere.


    +   - **ifempty**. This directive is used to indicate that logrotate should rotate
    the specified log files if they are empty.


    +   - **notifempty**. This directive is used to indicate that logrotate should
    not rotate the log file if it is empty.


    +   - **nolddir**. This directive is used to indicate that logrotate should rotate
    the log file in the same old directory where they are currently present.


    +   - **olddir <directory>**. This directive is used to declare that logrotate
    should move the rotated log files into the specified directory.


    +   - **rotate n**. This directive is used to specify the number of times logrotate
    should rotate the specified file before mailing or removing it.'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# SYSTEM LOGS


    +   - size [size Mb/Kb]. This directive is used to specify the maximum permissible
    limit for the size of the file specified before logrotate should rotate it. The
    value can be expressed in megabytes or kilobytes.


    +   - endcript. This directive is used to declare the end of a particular section
    for a specified log file in the configuration file.


    The logrotate program is a vital package that must be installed on every Linux
    server that has significant traffic activity. Once the logrotate configuration
    is complete, the program can be used in two ways:


    +   - Manual execution. Manual execution has only one advantage into play when
    the activity on the server is exceptionally low or high. The administrator can
    manually execute the program as per requirements of the server. But when the server
    activity is normal, this can become a difficult option because manual operation
    would be required each time, even if the job can be easily automated.


    +   - Automatic execution as a cron job. This form of operation should be preferred
    in normal circumstances. Automating a logrotation process can be of great help
    to the administrator because does not have to do the job manually. On a single
    server this might not seem like much, but with a data center that manages many
    servers at a time, this can be a crucial cost-cutting and security-enhancing factor.


    # Summary


    In this chapter, you learned that log files are powerful assets that can help
    system administrators detect many problems in a server. You also learned that
    if logs are not managed properly, these very helpful assets can easily overwhelm
    you with data. When this overflow of data happens, it can cause many problems
    with the server apart from creating a possible security hole. Exceptionally large
    logs or administrators who ignore such large files can miss important information
    that can cause problems later. Automating the filtering of such logs solves the
    problem. These automated filters do work for you, alerting you in real time with
    the information you need.'
  merge: -1
  img_proc: true
