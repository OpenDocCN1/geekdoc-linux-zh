  md: '# TYPES OF ATTACKS Chapter 7


    # DoS Attacks that Exploit Scarce or Nonrenewable Resources


    Computers and networks require certain resources to function at full capacity.
    Some of these resources, such as bandwidth, can be increased to a certain extent
    by using instant burst mechanisms.Other resources are nonrenewable, however, such
    as CPU time, memory, and in some cases, disk space.


    DoS attacks target these resources to bring a network to a halt. These attacks
    can be in the form of flooding infinite recursive programs or propagating self-replicating
    scripts. These attacks generally employ very basic methodology to crash a computer.
    For example, a Flood attack can occur when the attacker tries to send continuous
    e-mail messages to or from the victim server. An example of an infinite recursive
    attack could be two e-mail accounts in a victim computer that have autoponders
    or support for ICMP ECHO and reply packets.


    Another example could be a self-replicating script that evolves in an infinite
    loop and keeps generating its copy and executing it. I discuss each kind of attack
    in more detail later in this chapter, in the section "Viruses and Worms"


    # DoS Attacks on Network Bandwidth


    An attacker can flood the entire bandwidth available on a computer, preventing
    all legitimate users from accessing that system. Such an attack can be launched
    by sending ICMP ECHO packets or UDP ECHO packets to the victim computer. If mounted
    on a one-to-one basis, the attack can be controlled very easily, when clusters
    of unconcerned computers are forced to be a part of this attack, the victim computer
    can be paralyzed within minutes.


    To make such an attack possible, the attacking program should have the following
    capabilities:


    +   The attacker''s computer should be able to spoof its original identity. Otherwise,
    the attack on the intermediary computers would backfire on the attacker himself.


    +   The attacker program should be able to search computers on the Internet that
    support ICMP or UDP ECHO packets to increase the strength of the attack several
    times.


    In DoS attacks on network bandwidth, the intruder sends to a server fabricated
    UDP packets that connect its ECHO service to the service on another computer.
    The forged packets contain the false source address of the victim computer. The'
  merge: -1
  img_proc: true
