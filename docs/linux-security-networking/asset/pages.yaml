- pgno: 78
  md: '# INSTALLING RED HAT LINUX Chapter 3 51


    # FTP Installation


    You can also install Red Hat Linux through the FTP server. To install Linux through
    an FTP server, you need to specify the FTP server and the path. If you are installing
    Linux through the FTP server over the Internet, it might take a while because
    /RedHat/RPMS directory is huge. If you get disconnected, you will need to start
    the Linux installation all over again. Therefore, it is advisable that on networks
    with low bandwidth, you should first copy the installation files to the hard drive
    and then perform the Linux installation from there.


    FTP installation is similar to the NFS installation. You will need to specify
    the Ethernet card and other information, such as TCP/IP details of your computer,
    FTP server name, directory path, and so on. You can provide your own FTP server
    that has a Red Hat Installation or enter the Red Hat directory and one of the
    Red Hat mirrors site. Select a server that is closest to your location and is
    processing the fewest number of requests. If your hardware is not detected, you
    might need to specify manually the hardware available on your computer.


    For the FTP installation, you need a single floppy disk and a server with all
    the files. Simply mirror the directory structure you need and then make it accessible
    through an FTP server, after providing your username and password. The files should
    be read-only, and no write permissions should be given.


    FTP installations can also be automated with the Kickstart utility. (For more
    information, see the section, “Automated Installation: Kickstart,” later in this
    chapter.) In addition, you can perform customized installation by removing unwanted
    packages. The FTP servers should be secure. If you are using a public FTP server,
    make sure that the Web site is listed as a secure server in the main distribution
    Web site.


