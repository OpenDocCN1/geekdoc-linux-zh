- pgno: 262
  md: '# THE HTTPD.CONF FILE Chapter 8 235


    Apache server at a given time. The spare server''s parameter should be left unaltered,
    unless the network traffic of your site is high. Sample MinSpareServers and MaxSpareServers
    directives are given here:


    +   # Server-pool size regulation. Rather than making you guess how many

    # server processes you need, Apache dynamically adapts to the load it

    # sees -- that is, it tries to maintain enough server processes to

    # handle the current load, plus a few spare servers to handle transient

    # load spikes (e.g., multiple simultaneous requests from a single

    # Netscape browser).


    +   # It does this by periodically checking how many servers are waiting

    # for a request. If there are fewer than MinSpareServers, it creates

    # a new spare. If there are more than MaxSpareServers, some of the

    # spares die off. The default values are probably OK for most sites.


    MinSpareServers 5

    MaxSpareServers 10


    The default value for the MinSpareServers directive is 5, and the MaxSpare-Servers
    directive has the value of 10. If the number of idle servers is less than the
    specified amount, the Apache server automatically creates child processes until
    it reaches the minimum specified limit. The maximum limit is specified to keep
    a check on the number of child processes invoked. If the number of child processes
    exceeds the limit specified in the MaxSpareServers directive, the parent process
    automatically kills the excess processes.


    # The StartServers Directive


    The StartServers directive allows you to specify the number of child processes
    that will be created during startup. However, Apache considers the server load
    before deciding how many child processes should be running at any given time.
    Therefore, you might not need to edit the value in this directive, and you can
    safely leave the default option for this directive unaltered.


    +   # Number of servers to start initially -- should be a reasonable ballpark

    # figure.


    StartServers 5'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'In the preceding extract, the default value assigned to the StartServers directive
    is 5. This means that 5 child processes will be automatically created at start
    time.


    # The MaxClients Directive


    The MaxClients directive helps you specify the maximum number of clients that
    can connect simultaneously at any given time:


    +   - Limit on total number of servers running, i.e., limit on the number

    - # of clients who can simultaneously connect -- if this limit is ever

    - reached, clients will be LOCKED OUT, so it should NOT BE SET TOO LOW.

    - # It is intended mainly as a brake to keep a runaway server from taking

    - # the system with it as it spirals...

    - #


    ```

    MaxClients 150

    ```


    In the preceding extract for the MaxClients directive, the default value is 150.
    This means that at any given time, Apache will not handle more than 150 simultaneous
    connections. If there are more connections, they get queued. The number of queued
    connections depends on the ListenBacklog directive.


    # The MaxRequestsPerChild Directive


    The MaxRequestsPerChild directive is used to specify the maximum number of requests
    that each child process will handle:


    +   - # MaxRequestsPerChild: the number of requests each child process is

    - # allowed to process before the child dies. The child will exit so

    - # as avoid problems after prolonged use when Apache (and maybe the

    - # libraries it uses) leak memory or other resources. On most systems, this

    - # isn''t really needed, but a few (such as Solaris) do notable leaks

    - # in the libraries. For these platforms, set to something like 10000

    - # or so; a setting of 0 means unlimited.

    - #


    +   - # NOTE: This value does not include keepalive requests after the initial

    - # request per connection. For example, if a child process handles

    - # an initial request and 10 subsequent ''keptalive'' requests, it

    - # would only count as 1 request towards this limit.

    - #


    ```

    MaxRequestsPerChild 0

    ```'
