- pgno: 319
  md: '# Chapter 9 OTHER NETWORK SERVERS


    +   - Use the sendmail restricted shell (smsh) program to limit the programs that
    can be executed in .forward, aliases, and include files.


    +   - Use the SafeFileEnvironment option to limit where the file system hosts
    can be written.


    # Domain Name Service


    You need to identify each computer uniquely when computers are connected to each
    other in a network. Using IP addresses is the most widely accepted identification
    system today. Each computer is provided with a unique IP address. You can search
    for a computer using its IP address.


    I''ll discuss IP addresses in detail in the next section of the chapter. However,
    the drawback of using an IP address is that it is difficult to remember. Consider
    how difficult it would be if you were required to remember the IP addresses of
    50 computers. The alternative is to use the host names, which are easier to remember.
    For example, remembering www.yahoo.com is much easier than remembering the 32-bit
    IP address. However, you need a mechanism to convert host names to IP addresses,
    and vice versa. This mechanism is required because host names are universally
    converted to the IP addresses. The service that implements this mechanism is known
    as Domain Name Service (DNS).


    In the early days of the Internet, the responsibility for maintaining unique host
    names for the computers on the Internet was given to the Stanford Research Institute''s
    Network Information Center (SRI-NIC). Initially, they created a single file hosts
    txt that contained the host name to IP address mappings. All webmasters around
    the Internet were supposed to regularly update the SRI-NIC about any changes in
    status of their host names or IP addresses.


    This created a lot of problems:


    +   - The file grew with the growth of the Internet. After some time, it became
    extremely difficult to maintain the file.


    +   - With the large number of computers connecting to the Internet, it became
    more impractical to guarantee the uniqueness of a host name.


    These shortcomings created a need for things like hierarchical naming structure
    and distributed management of host names. This led to the evolution of a lookup
    facility known as DNS. It is a distributed database used for mapping host names'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# DOMAIN NAME SERVICE Chapter 9


    to their respective IP addresses. The concept of the distributed database means
    a single organization will no longer be responsible for host name to IP address
    mappings.


    The next few sections discuss basic concepts of the DNS.


    # IP Addresses


    An IP address is a unique 32-bit name assigned to each computer in a network.
    A computer with an assigned IP address is known as a host. This IP address is
    used to identify hosts on a network.


    The IP address consists of four 8-bit numbers separated by periods; for example,
    172.17.20.10. This technique is known as dot-notation. A part of the address is
    used to identify the network to which the computer belongs. The remainder of the
    address identifies the system itself. Addresses are categorized under three classes:


    +   - Class A

    - Class B

    - Class C


    Class A is used to address very large networks, whereas class B addresses medium-sized
    networks. The class C addresses are assigned to small networks, with fewer than
    approximately 250 hosts.


    # Domain Name Space


    Host names are divided into several pieces called domains. Domains are designed
    in a hierarchical structure. The top-level domains refer to the type of organization
    to which the network belongs, and subdomains further identify the specific network
    on which the host is situated.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# 294 Chapter 9 OTHER NETWORK SERVERS


    The domain name space is also a hierarchical tree structure, as shown in Figure
    9-1.


    ![](img/a46d40e435b42e09209eb0761898e63c_321_0.png)


    FIGURE 9-1 An example of a Domain Name Space.


    While searching for a host, the DNS tree is traversed in an ascending order, starting
    from leaf nodes and moving towards the root. Therefore, the nodes falling on the
    left side are more specific in contrast to the nodes on the right side. For example,
    node abc in www.abc.com is more specific than the com node.


    In a Fully Qualified Domain Name (FQDN), the host name is specified by the leftmost
    label. The next label to the right defines the local domain to which the host
    belongs. The local domain can also be a part of or a sub-domain of another domain.
    Therefore, naming gets less specific while moving from the left to the right.
    This process is followed until the root of the tree is reached.


    The dot (.), which is the root domain, the starting point of the tree. In DNS,
    records are specified as the last character in the domain name. A domain is a
    portion in a domain name space. Consider the following example:


    There are four domain names:


    +   * abc.com

    * abc.net'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# DOMAIN NAME SERVICE Chapter 295


    +   * xyz.com

    * pqr.org


    In these domain names, there are only seven domains involved. These domains are
    listed here:


    +   * abc

    * abc

    * xyz

    * pqr

    * com

    * net

    * org


    A Top-Level Domain (TLD) is a domain that directly branches off from the root
    of the tree. com, net, and org were the top-level domains in the preceding example.


    A subdomain is a child domain that comes lower in the DNS hierarchy tree. For
    example, here are three domain names:


    +   * www.abc.com

    * pop.abc.com

    * somethingelse.abc.com


    In these three domain names, www, pop, and somethingelse are the subdomains of
    the com domain. Therefore, it can be concluded that all domains—except the root
    domain—are subdomains of other domains.


    A DNS master server is a computer that maintains a database of host names and
    IP addresses for one or more zones. It is advisable to have DNS slave name servers
    that can be synchronized with the master name server to act as backup name servers
    in case the primary server fails.


    While performing the function of inverse resolution, mapping an IP address to
    its host name, the DNS moves from the left node toward the right node to deduce
    the IP address. In contrast to the host name, the dot (.) notation of an IP address
    becomes more specific while moving to the right. Therefore, the IP addresses in
    the DNS are represented in reverse order to handle this situation. The Top-Level
    Domain (TLD) for IP addresses is in-addr.arpa domain. This technique'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Chapter 9 OTHER NETWORK SERVERS


    helps in simplifying the process of inverse resolution that now works as a forward
    resolution process in which the DNS host name finds the corresponding IP addresses.


    # Services Offered By a DNS Server


    The DNS server is a vital component in a network. It is the most popular name
    resolution service on the Internet. A few functions of a DNS server are given
    in the following list:


    +   * Provides a mechanism for resolving host names into Internet Protocol (IP)
    addresses. This process is known as forward lookup.

    * Provides a mechanism to find host names from IP addresses. This is known as
    a reverse lookup.

    * Provides Internet directory-like lookup capabilities to retrieve information
    concerning other DNS Name Servers, Canonical Names, Mail Exchangers, and so on.

    * Allows machines to be logically grouped by domains names, and therefore, lead
    to efficient searching.

    * Organized named machines into efficient hierarchies.

    * Is distributed by nature, which increases its robustness and reliability.


    # Components of DNS


    The DNS implementation in a network has three major components: database, client,
    and server. These components are discussed in the following list:


    +   * Database. The database contains the DNS tree and the Resource Records (RR).
    RR specifies the domain name. The database is distributed in nature and comprises
    the Domain Name Space, which is basically the DNS tree, and the Resource Records
    (RRs). RR defines the domain names within the Domain Name Space.

    * Client. The client in the DNS contains functions or software routines, which
    request information from the Domain Name Space on behalf of an application. The
    clients in the DNS are also known as resolvers because they group functions to
    a resolver library. The resolver library'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'sends query to the name server, accepts answers, and sends it back to the specific
    application. The client contains methods for gaining information from the DNS.
    The client is used by the applications.


    +   * Server. The server in the DNS is called a Name Server. These servers manage
    portions of the Domain Name Space and assist clients in finding information within
    the DNS tree. In addition, servers can be used as a delegation point to identify
    other name servers that have authority over subdomains within a given domain.


    # DNS Transactions


    DNS transactions are a regular occurrence over the Internet. The two most common
    types of transactions are discussed in the following list:


    +   * DNS zone transfers. In this type of transaction, synchronization of new/updated
    domains in the backup or secondary DNS server takes place. The secondary DNS server
    compares its serial number to the serial number of the primary server at regular
    intervals. If the serial number on the primary server is more recent, the secondary
    server downloads the new copy of the zone. This is called the zone transfer. You
    will learn more about zones later in this chapter.


    +   * DNS queries/responses. In this type of transaction, the client sends a DNS
    query, and the server replies through a DNS response. Clients usually choose three
    domain name servers to send their queries. These servers are the default servers
    defined on the client computer that are provided by the ISP. These servers are
    checked one by one until you obtain the desired result. The query keeps passing
    through the name servers until a valid response is generated. The name server
    can forward the query to another name server if it cannot resolve the query. In
    this case, the query keeps passing through the servers and when an answer is found,
    it is sent back to the original name server. The answer is first cached by the
    original server and then sent back to the client.


    The DNS query and responses that take place between the DNS server and client
    have five sections. These sections are discussed in the following list:


    +   * Header section. This section contains information about the type of message
    and other sections that are present in the message.'
  merge: -1
  img_proc: true
