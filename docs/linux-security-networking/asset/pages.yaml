- pgno: 98
  md: '# INTRODUCTION TO THE LINUX FILE SYSTEM


    In the Linux file system, you need to mount a partition or a device to be able
    to use it. This might not be the easiest way to gain access to partitions and
    devices, but it offers great flexibility.


    The directory Listing of / is given here:


    +   - bin/

    - etc/

