    # # Summary


    One of the top priorities of the system administrator should be making regular
    backups. A powerful operating system, such as Linux, also can face disasters in
    the form of hardware failures, power failure, natural disasters, or other unforeseen
    problems. These problems might be caused by human error resulting in undesired
    changes to files or cause deletions of crucial files in certain cases. Regular
    backups save you from such calamities. In this chapter, you learned about various
    commercial and non-commercial tools available for taking backups. You must intelligently
    choose a backup mechanism that provides maximum security of data on individual
    workstations as well as on servers.


