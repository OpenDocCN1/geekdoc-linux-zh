- pgno: 120
  md: '# GENERAL ADMINISTRATION Chapter 4 93


    # df


    the df command is used to generate a report on disk space usage. The df command
    displays the amount of disk space available on the file system. If you do not
    provide any file name, the df command displays the space available on the mounted
    file systems. Disk space is shown in 1K blocks by default, unless the environment
    variable POSIX_CORRECT is set as, in which case 512-byte blocks are used.


    The syntax of the df command is as follows:


    ```

    df [options] [filesystems] [files]

    ```


    In the syntax, filesystems is the name of the device on which the file system
    resides, the directory on which the file system is mounted, or the relative path
    name of a file system. The files parameter specifies a file or a directory that
    is not a mount point.


