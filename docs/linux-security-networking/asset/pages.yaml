    UserDir disabled root


    # Summary


    The Apache Web server is a popular server that has many advantages, such as advanced
    features, better performance, and free availability of the source code. http.conf,
    srm.conf, and access.conf are the three configuration files for Apache. However,
    the srm.conf and access.conf files are no longer in use. All configuration options
    of Apache are specified in the http.conf file, which contains several directives
    that determine the settings of the Apache Web server. This chapter covered several
    directives in detail.


    You can run several virtual hosts on Apache. The concept of virtual hosts enables
    you to run multiple Web services on the same computer. The two types of virtual
    hosts are IP-based and Name-based virtual hosts. In this chapter, I discussed
    these types in detail. I also explained .htaccess files. An .htaccess file is
    a text file containing Apache directives. These directives apply to the documents
    in the directory where the .htaccess file is located, as well as to all the file''s
    subdirectories.'
