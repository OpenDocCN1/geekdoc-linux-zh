  md: '# TYPES OF ATTACKS Chapter 7 21


    kind of attack. It is possible to crash or reboot a remote computer by sending
    a ping of a certain size. This is a serious problem, mainly because it can be
    reproduced very easily from a remote computer. The more severe aspect of the attack
    is that the attacker doesn''t need to know anything about the victim computer
