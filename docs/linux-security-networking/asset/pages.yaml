    Other high-end anonymity HTTP servers block a few more headers from reaching Web
    sites. For example, HTTP_X_FORWARDED_FOR, HTTP_VIA and HTTP_PROXY_CONNECTION variables
    can be blocked to provide anonymity. This ensures that the destination Web site
    doesn''t even know that you are being redirected via a proxy.


