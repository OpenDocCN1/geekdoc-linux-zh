- pgno: 365
  md: '# Data Security


    SSH encrypts data during transmission. It can be used with POP3/IMAP3/SMTP clients
    and servers. If a user is using packet sniffers, he can catch the data during
    transaction in a Telnet session. SSH provides a solution to this by transferring
    the data in encrypted form. In addition, SSH provides security against unauthorized
    access to your data. It provides a strong means of user authentication.


    # Network Security


    Network security involves protecting network devices, which includes securing
    routers, firewalls, switches, and any computer connected to the network. SSH secures
    connections over the Internet by encrypting passwords and other data. It provides
    strong authentication and secure communications over insecure networks.


    The SSH protocol consists of three layers:


    +   * Transport layer

    * User authentication layer

    * Connection layer


    # Transport Layer


    This layer runs over insecure TCP/IP networks. The transport layer provides server
    authentication, data confidentiality, and integrity.


    The SSH transport layer provides the following services:


    +   * Encryption

    * Host authentication

    * Data integrity protection


    SSH might also provide data compression. The encryption mechanism as well as a
    key is negotiated during the establishment of the connection. The following encryption
    algorithms are currently supported:


    +   * 3DES in CBC mode

    * Blowfish in CBC mode'
  merge: -1
