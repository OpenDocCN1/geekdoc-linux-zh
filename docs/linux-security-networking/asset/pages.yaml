- pgno: 105
  md: "# /proc (Linux Profiling & Tuning)\n\n /proc directory is an interface to the\
    \ kernel data structures. Most of the files in this pseudo file system are read-only.\
    \ This directory contains subdirectories representing the running processes on\
    \ the system. Each of subid is named by the process ID of the process that it\
    \ represents. Each subdirectory contains these files and subdirectories:\n\n+\
    \   - cmdline. This holds the command line for the process.\n- cwd. This is a\
    \ link to the current working directory of the process.\n- environ. This contains\
    \ the process environment.\n- exe. This is a link to the binary that is executed.\n\
    - fd. This is a subdirectory containing one entry for each file that the process\
    \ has opened. The entry is named by its file descriptor and is a symbolic link\
    \ to the actual file.\n- maps. This is a file that contains the currently mapped\
    \ memory regions and its access permissions.\n- mem. The mem file points to the\
    \ memory of the process that accesses it.\n- stat. This contains the status information\
    \ about the process.\n\nOther files and directories in /proc include:\n\n+   -\
    \ cpuinfo. This is a collection of CPU and items that are dependent on system\
    \ architecture. The only two common entries are CPU and BogoMIPS. CPU shows the\
    \ CPUs that are currently in use. BogoMIPS is a system constant, which is calculated\
    \ during kernel initialization.\n- devices. This is a text listing of major numbers\
    \ and device groups.\n- dma. This is a list of registered ISA Direct Memory Access\
    \ (DMA) channels in use.\n- filesystems. This is a text listing of the different\
    \ file system types that were compiled in the kernel.\n- interrupts. This is used\
    \ to record the number of interrupts per IRQ on the i386 architecture.\n- iports.\
    \ This is a list of currently registered Input-Output port regions that are in\
    \ use.\n- kcore. This file represents the physical memory of the system."
  merge: -1
