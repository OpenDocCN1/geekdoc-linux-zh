- pgno: 87
  md: 'Master Boot Record (MBR) is the first cylinder, the first head, and the first
    sector of the disk. the boot record is used to boot the system, and the partition
    table contains information about the location and size of your partitions.


    Partitions are of three types:


    +   - Primary

    - Extended

    - Logical


    The primary partition type is the one most used. A drive supports a maximum of
    four primary partitions. The partition table size is limited, however. The extended
    partition can be used to overcome this limit. The extended partitions act as containers
    for logical partitions. Extended partitions do not hold any data. A single extended
    partition can cover the entire drive.


    Within this partition, you can create several logical partitions. However, you
    might have only one extended partition for each drive. Extended partitions should
    cover the entire drive only when the disk is not to be used for booting. Extended
    partitions have an address inside /dev. In Linux although extended partitions
    have drive labels assigned to them, extended partitions themselves cannot be mounted.
    However, once logical partitions are created in extended partitions, individual
    logical partitions can be mounted.


    # Resizing Current Partitions


    If your drive currently taken up by partitions for other operating systems, you
    need to delete and resize these partitions to allocate space for Linux. There
    is no safe or reliable way to resize an existing partition without deleting it.
    An interesting experiment is however being carried out by the GNU community at
    www.gnu.org/software/parted/. In any case, before repartitioning the drive, you
    should back up your system. After you have repartitioned the drive, you can reinstall
    your original software..


    Here are the two commands you can use for managing the partitions:


    +   - fdisk.

    - cfdisk.


    In the sections that follow, I discuss each of these commands in detail.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# AUTOMATED INSTALLATION: KICKSTART


    # fdisk


    You use the fdisk command to create and manipulate partition tables. The fdisk
    command is used with DOS type partitions. In addition, it is also compatible with
    BSD or SUN disk labels. The volume headers should not be covered by any partition.
    If you do this, the partition table will be lost.


    You can have numerous partitions in a DOS type partition table. In sector 0, there
    is space for a description of four partitions, called primary partitions. One
    of these is an extended partition. The four primary partitions get numbers ranging
    from 1 to 4. Logical partitions start with the number 5.


    The geometry specifies the number of heads and the number of sectors for each
    track. The fdisk command will automatically try to get the disk geometry. This
    is not necessarily the physical disk geometry; however, this is the disk geometry
    that MS-DOS uses for the partition table. If you have only Linux on your computer,
    you shouldn''t have any problem. On the other hand, if multiple operating systems
    are installed on your computer, you should run the fdisk command from the operating
    systems other than Linux. You should do this to create at least one partition.


    When you start Linux, the operating system tries to obtain information about the
    disk geometry by reading the partition table. The partition table is checked for
    the integrity for its entries. This happens when the partition table is printed.
    The check is done to ensure that the logical start and end is the same as that
    of the physical start and end. The check also ensures that the starting and ending
    points of the partition is the cylinder boundaries. This may not be necessary
    for the first partition.


    # cfdisk


    The cfdisk command is used for partitioning the hard disk drive. To write to the
    partition table, cfdisk needs the geometry of the disk. If the disk is not accessed
    by other operating systems, you can safely accept the defaults that cfdisk selects.


    I''ll now explain the geometry used by the cfdisk command. First, the partition
    table is examined to determine the geometry used by the previous program that
    changed it. If the partition table is empty, contains garbage, or does not reveal
    a consistent geometry, the kernel is referred.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'The cfdisk command reads the current partition table from the disk drive. An
    error message is generated in case it is unable to do so. The error message can
    also be displayed due to incorrect geometry information. You can also solve this
    problem by using the -z option of the cfdisk command. The -z option ignores the
    partition table.


    The main display consists of four sections:


    +   - Header. This section contains the program name and the version number. In
    addition, it contains the disk drive and geometry information.

    - Partition. This section displays the current partition table.

    - Command Line. This section contains the available commands.

    - Warning Line. This section contains information, such as the warnings to be
    displayed.


    The current partition is highlighted with a reverse video or an arrow, if the
    -a option is given. All partition-specific commands apply to the current partition.


    The fdisk command can create either primary or logical partitions. The file system
    type of the partition is displayed in the file system section. If the file system
    is not known, the Unknown value and hex value of the file system get displayed.
    The Unusable value is displayed for the file system type when all the partitions
    are used. The partition size is displayed in the size field. If the partition
    is not aligned on cylinder boundaries, an asterisk appears after the size.


    Given here is a list of the commands available:


    +   - bb. This command toggles the bootable flag of the current partition. The
    toggling of the bootable flags enables you to select the primary partition.

    - dd. This command deletes the current partition.

    - gg. This command changes the disk geometry.

    - hh. This command prints the help screen.

    - mm. This command maximizes disk use of the current partition.

    - nn. This command creates a new partition from free space. If the partition type
    is primary or logical, a partition of primary or logical type is created. On the
    other hand, if the partition type is Pri/Log, you are prompted for the partition
    type that you want to create.

    - pp. This command prints the partition table to the screen or to a file.

    - qq. This command quits the program.'
  merge: -1
  img_proc: true
