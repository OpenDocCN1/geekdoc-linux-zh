- pgno: 471
  md: '# Q. Briefly discuss the security of Linux.


    A. Security is ensuring the availability, integrity, and confidentiality of your
    systems. In Linux, chances of a security breach increase with the increase in
    the number of services that your server offers. The best way to tackle this threat
    is to install Linux with minimum packages and then add the required services.
    Any services that are no longer needed should be removed from the system. Linux
    is very secure if it is implemented properly. The administrator should also keep
    track of the security updates and patches released by various Internet communities.


    # Q. How can I protect my system from hackers?


    A. You can use these security measures to protect your system from hackers:


    +   - Turn off the services not required and protect the other services by implementing
    TCP wrappers.


    +   - Keep track of the latest security updates and install new security patches
    regularly.


    +   - Replace unencrypted services, such as ftp and Telnet, with more secure equivalents,
    such as SSH and SCP.


    +   - Always maintain backup copies of the important resources. Having backup
    copies helps in recovery. If possible, you also should back up all files that
    were created or modified by either the administrator or any user.


    +   - Go through security manuals to read updated information about all security
    measures.


    # Q. Why do I always fail while trying to login as root through Telnet?


    A. Many Linux distributions don''t allow you to login as root through Telnet as
    an added security feature because the password will travel in a plain text format
    through the network. You should first login as a normal user and'
  merge: -1
  img_proc: true
- pgno: 472
  md: 'then use the su command to work as root. You can change this option from /etc/securetty,
    although it is not recommended.


    # Is Linux vulnerable to viruses?


    Linux is to a great extent safe from viruses due to the following reasons:


    +   - First, it is very difficult for a virus to activate itself on a Linux machine
    because Linux does not run programs automatically in the form of mail attachment
    scripts.

    - In Linux, every piece of code needs permission to run. This means that the virus
    has to find a code in which it can insert itself and get executed. For this, the
    virus code needs a certain degree of privilege, which is not easy to acquire.


    # Why is using SSL considered safe?


    Secure Socket Layer (SSL) protocol was created to provide reliable and secure
    transfer of data over an unreliable network. This is done by utilizing encryption
    and authentication features that make SSH more reliable than other protocols,
    unlike the Telnet protocol in which data commands are transmitted and received
    in plain text. The SSH protocol encrypts every piece of data before transmitting
    it and decrypts it before the data is put in use. This ensures that network traffic
    sniffers are unable to collect any unauthorized information during data transits.


    # How can I detect whether my system has been hacked?


    To check whether your system has been intruded, you should search for various
    signs that the hacker may have left behind. Here are some common signs of intrusion:


    +   - Failed logon attempts

    - Change of password

    - Sudden degradation in system performance

    - Strange and unexpected entries in log file

    - Missing files

    - Change in file organization'
  merge: -1
  img_proc: true
- pgno: 473
  md: '# Appendix B LINUX FAQS


    +   Q. I want to shut down all unused services, but how do I find out which services
    are already running?


    +   A. You can use the ps auxw command to get a list of processes that are currently
    running. You can also use variations such as ps, auxf, or ps auxfw for a better
    output in tree format. Using netstat also is a good option for listing services.


    Some of the options of netstat that you can use are:


    +   - a. This option lists the services listening for connection.


    +   - 1ltp. This option lists services listening to well-known ports.


    +   Q. Why is connecting to a computer using Telnet considered unsafe?


    +   A. Telnet is a very unsafe means for communication. The data is not encrypted
    and any hacker listening to your connection can retrieve important information,
    such as password. This is possible because all data is sent as plain text. Therefore,
    using a secure method like SSH is recommended. In SSH, the transfer of the data
    is encrypted, which makes it more secure.


    +   Q. My computer has been hacked. What do I do now?


    +   A. After your computer has been hacked, your aim should be done to minimize
    the damage that could be done to your system and draw a safe recovery chart. First
    remove your computer from the network. This can protect the system from any further
    damages by the hacker. You should log your files to determine the method of attack.
    If your data is severely damaged, you should use the backup to replace the data
    with a correct copy. You also should try to find the vulnerability in your system
    which led to an attack. This loophole should be immediately removed in order to
    safeguard your systems from similar threats in future.


    +   Q. How can I use TCP wrappers to enhance security?


    +   A. TCP wrappers are used to provide access control for services. They can
    be used to mention explicitly the hosts who can use a service. It controls access
    through two lists:'
  merge: -1
  img_proc: true
- pgno: 474
  md: '# Appendix B 447


    +   - /etc/hosts/allow. This file contains a list of users who are allowed access
    to the service.


    +   - /etc/hosts/deny. This file contains a list of users who are denied access
    to the service.


    These configurations are used to accept or drop a requested connection. TCP wrapper
    also provides you with the additional function of writing logs for all activities
    that take place.


    +   I want to test my computer for vulnerabilities. Are their any tools available
    for this purpose?


    +   Plenty of tools are available for this purpose and it is considered a good
    practice to use these tools to check your system, both from inside and outside
    your network. Here''s a list of tools:


    +   - SATAN (System Administrator''s Tool for Analyzing Networks)

    This tool is available from http://www.porcupine.org/satan/.


    +   - SAINT (Security Administrator''s Integrated Network Tool)

    This tool is available from http://www.wwdsi.com/saint/


    +   - Nmap

    This tool is available from http://www.insecure.org/nmap/.


    +   - Other tools like Nessus are available.


    +   Are Trojans viruses? Is my system vulnerable to them?


    +   Trojans are different from viruses. Trojans are harmful and friendly useful
    programs. Unlike viruses, Trojans do not act to replicate by themselves. Their
    aim is to create a security loophole in your system, which can give the hacker
    access to it.


    +   How does Linux manage passwords?


    +   In Linux, passwords are not encrypted. They are hashed using hashing algorithms
    like MD5; these hash values are unique and cannot be reverted back to the original
    text. When you enter your password in Linux, its hash value is generated and compared
    to the hash value of the stored password. If the values match, access is given;
    otherwise, access is denied.'
  merge: -1
  img_proc: true
- pgno: 475
  md: '# Appendix B LINUX FAQS


    +   - How can I make my Linux kernel more secure?


    +   - The Linux kernel can be configured in a number of ways to make it more secure.
    A few of these configurations are listed here:


    +   - CONFIG_FIREWALL. This option enables a kernel-based firewall. If you use
    the intended host on which this configuration will be done as a client machine,
    this option is not needed.


    +   - CONFIG_IP_FIREWALL. Use this option to enable kernel support for a packet
    filter-based firewall. This option allows you to use features such as IP masquerading,
    IP transparent proxying, and IP logging. Packet filtering is done in the network
    layer. Therefore, packet filtering uses only the source address, destination address,
    type and protocol used, and the port information in the IP packet header to decide
    whether to let a packet through.


    +   - CONFIG_IP_FORWARD. This option enables IP forwarding on the host machine,
    enabling it to act as a router. If used according to the planned security architecture
    of a network, this option enables you to avoid the need for a hardware router.
    But if this is enabled on a secured network that depends on firewall security,
    it can become the biggest loophole in the security of the network because this
    host can forward IP packets to external networks without going through the firewall.


    +   - CONFIG_SYN_COOKIES. This option is used to protect the system from a SYN
    flooding attack. When enabled, the TCP/IP stack uses a SYS cookie protocol to
    establish connections. Although this challenge protocol is very effective against
    a SYN flooding attack, it can cause erroneous reporting at the client machine
    if the server is busy. SYN cookies are not enabled by default.


    +   - CONFIG_IP_MASQUERADE. Use this to enable masquerading for TCP and UDP packets.
    Masquerading is basically Network Address Translation in which the firewall changes
    the source IP address of outgoing packets to its own address and the destination
    IP address of the incoming packet to the actual destination address of the internal
    network host. You need to enable IP forwarding in order to use this option.'
  merge: -1
  img_proc: true
- pgno: 476
  md: '# Appendix B


    Q Does disabling incoming or outgoing pings make my Linux more secure?


    A Although rejecting incoming pings doesn''t make your system invisible, it can
    certainly work against ping sweeps and certain denial-of-service attacks. Incoming
    pings can be used to flood your network or simply to detect your presence.


    Outgoing pings can be exploited by certain Trojans to broadcast their presence
    in a host to the base. Although outgoing pings are useful in some cases, they
    should be disabled if not needed.


    Q How can identd affect security?


    A identd is used to identify a user in your network who is creating trouble in
    an external network. It is not of much use for a very small network. When a user
    initiates TCP/IP connection to a remote host, the identd of the remote host reports
    to port 113, asking the identity of the initiator. identd at this time replies
    with the username of the owner of the process that initiated the connection request.


    If a user misuses the system to launch an attack targeted at another network,
    the victim can identify the defaulter and report to the system administrator of
    the first network. This can be very helpful in keeping the network from becoming
    a launch pad of attacks.


    identd should never be used as an authenticating service because anyone with root
    privileges or on a Windows system can tamper the identd response.


    You can block access to identd by commenting out the auth line in /etc/identd.conf
    or using tcpwrappers and/or firewalling software to disable or restrict access.
    If you need to enable identd in order to connect to a certain server, you might
    want to consider allowing access to it only from that server. If you choose to
    firewall the identd port, consider using a reject policy rather than a deny policy.
    Using deny may greatly increase the time it takes you to connect to servers that
    use identd.'
  merge: -1
  img_proc: true
