    # Monitoring boot/supp Disks


    The RedHat boot disk, boot .img, is in the MS-DOS format and uses the SYS-LINUX
    program to start. The supplementary disk, supp. .img, is a Linux ext2 file system.
    If you have support for the loopback file system in your Linux kernel, you can
    mount these files in your file system and gain unauthorized access to them:


    ```

    # mkdir -p /mnt/boot /mnt/supp

    # mount -o loop -t msdos boot.img /mnt/boot

    # mount -o loop supp.img /mnt/supp

    ```


    Now you should be able to see and manipulate the files on the boot and supplementary
    disk under /mnt/boot and /mnt/supp, respectively. The older versions of mount
    might not support the -o loop option. In this case, you will need to configure
    the loopback device explicitly for each file. You also might need to use the -t
    ext2 option explicitly when mounting the ext2 file system. If you are using the
    latest Linux distributions, you need not worry about the lack of support for the
    -o option.


    # Linux Partitions


    Hard drives are divided into one or more partitions, which are sections of the
    hard drive set aside for some operating system to use. The concept of a partition
    allows you to have a dual boot mechanism. For example, you might have MS-DOS running
    on one partition on your hard drive and Linux on another.'
  merge: -1
