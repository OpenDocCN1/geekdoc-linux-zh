    # Internal Flood Attacks


    Internal flood attacks make use of loopholes that go unchecked by an administrator.
    Authenticated users of a server carry out these attacks to exploit the errors
    committed by an administrator. For example, a common mistake committed by administrators
    is to keep user log files on the boot partition of Linux. Recursive and frequent
    requests to a service by a user can cause the log files to become very huge and
    eventually choke the server. Such attacks can also be caused if users'' home directories
    are on the boot partition. In addition, some users with no disk quota can run
    the simplest shell scripts to fill space on the partition and cause a computer
    to stop responding.


    Internal floods also be initiated by sending an exceptionally high number of e-mail
    messages or other kinds of requests to remote servers. These requests can overload
    the server substantially.


    # External or Network Attacks


    External attacks are perpetrated from outside the computer. These attacks generally
    aim at reducing the performance of a server or pushing the server to a limit at
    which point it breaks down and can then be used to gain access to data. In most
    cases, the attacker has very limited or no unauthorized access to the victim computer.
    There are many types of external attacks:


    +   - Common Gateway Interface (CGI) attacks


    +   - Denial of Service'
