    # CGI Attacks


    CGI is a mechanism through which a browser is allowed to communicate with the
    programs running on a Web server. The phrase CGI means:


    +   - Common. Something that is widely available, regardless of the platform or
    software used by people.

    - Gateway. A method by which two devices or components, such as a Web browser
    and a server, communicate.

    - Interface. A “front end” for the server that is running in the background. For
    example, when an HTML form is filled and submitted, a CGI script might be submitting
    data to the server and then to another destination.


    CGI is a powerful feature for Web servers, it enables Web servers to display information
    to the users. In addition to this, CGI utilizes the computing abilities of the
    computer. A Web server that supports CGI gives users a certain amount of control
    over the Web server displays.


    Careful implementation of CGI programs can make a Web server more versatile. Web
    sites can deliver dynamic information, interactive pages, user-friendly Web interfaces,
    and other features. However, careless use of CGI can cause a security hole in
    a server. Each Web server uses a username for its operations. CGI scripts are
    potential security threats when you run your Web server as “nobody”. A subverted
    CGI script running as “nobody” still has sufficient privileges to collect and
    reveal system-critical data or examine the network information that later be used
    to compromise the host computer. A poorly written CGI application can have over
    unlimited control to the Web user. Therefore, a system administrator who doesn''t
    worry about CGI security should expect abuse of his network infrastructure, network
    downtime due to malicious attacks, and loss of confidential data.


    CGI scripts and applications should be written with the same care and attention
    given to Internet servers because each CGI script is a gateway to the server.'
