- pgno: 77
  md: '# NFS Installation


    For the NFS installation, you need an existing Linux computer that can support
    and export an ISO-9660 file system. Otherwise, you need to mirror one of the Red
    Hat distributions with the directory tree. You need to export the /RedHat directory
    to the computers on the network where the Red Hat Linux will be installed. This
    computer must be on an Ethernet network, because you cannot perform an NFS installation
    through a dial-up link.


    Some important steps during the NFS installation are listed here:


    +   1. Select the Ethernet card. This ensures that the appropriate driver is loaded.


    +   2. Select the appropriate card from the list that is displayed.


    +   3. At times, your computer may stop responding. In this case, press Ctrl+Alt+Del
    to restart the computer.


    +   4. The system then searches for the card. Upon successful detection of the
    card, you are prompted to provide some information, such as TCP/IP details, NFS
    server name, network, gateway address, and the DNS server.


    +   5. In the last screen, specify the NFS server name. You also need to specify
    the path of the directory that contains the Linux distribution.


    # Hard Drive Installation


    During a hard drive installation, the root directory of the partition, which will
    contain the Red Hat distribution, must have the /RedHat directory. On the primary
    Disk Operating System (DOS) partition, the path to /RedHat should be C:\RedHat.
    You can get the Red Hat distribution from either a CD-ROM or an FTP server.


    In an MS-DOS file system, you do not have to ensure that the package.rpm names
    are truncated. You need to make sure that the /RedHat/base directory contains
    the required files copied from the CD-ROM or FTP server. You should also ensure
    that the package.rpm files are present in the /RedHat/RPM directory. Now you can
    install or upgrade from the partition. You will need to insert an additional disk
    if you haven''t selected to support PCMCIA.'
