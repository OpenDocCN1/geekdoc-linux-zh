    # Advantages of SSL


    Some of the advantages provided by SSL are given here:


    +   * Prevents identity fraud

    * Prevents garbling attacks

    * Prevents replaying of messages

    * Prevents cut and paste attacks

    * Prevents CipherSuite rollback attacks

    * Prevents version rollback attacks

    * Prevents dictionary attacks

    * Prevents traffic attacks

    * Prevents short block attacks


    # SSH


    SSH secures connections over the Internet by encrypting all transmitted confidential
    data, including passwords, binary files, and administrative commands. SSH enables
    secure remote management of network hosts over the Internet.


    SSH offers the following types of security:


    +   * Data security

    * Network security'
