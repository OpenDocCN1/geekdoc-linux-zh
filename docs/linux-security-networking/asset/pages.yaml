    the two computers.


    # NOTE


    > Although the IP protocol is responsible for reliable communication, IP isn''t
    a reliable protocol. This is simply because network hardware itself can''t be
    relied upon. The purpose of the ICMP protocol is only to provide feedback to the
    source computers and not to ensure the reliability of the IP protocol.


    The ping application is the client interface to the ICMP server. A ping application
    is the easiest method to verify the operational status of another computer. A
