  md: '+   qmail distributes functions in different programs, which don''t trust each
    other. As a result, even if an intruder gets access to some of the programs, he
    would not be able to gain complete control over the system.


    +   qmail has been kept as simple as possible. The more features a system has,
    the more vulnerable it is to attacks. Therefore, only the minimum required features
    have been provided with qmail.


    # sendmail vs. qmail


    sendmail has some security problems. It has been the target of hackers and many
    security holes have been detected. Users often configure sendmail with minimal
    security, making it vulnerable to attacks. qmail is more secure and efficient
    than sendmail. Fewer security-related problems have been reported by qmail users.


    sendmail has a plethora of features. As a result, a user uses barely 30 to 40
    percent of the features. Many of the services provided by sendmail remain unused
    and they continue to consume your system resources. qmail, on the other hand,
    is less complex and all its features are more or less frequently used. In addition,
    the qmail documentation is simpler and easy to understand compared to the sendmail
    documentation.'
