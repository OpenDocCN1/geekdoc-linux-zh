    +   * Attempt to logon to an account that has not been used in a long time.


    +   * The unexpected deterioration in the performance of your system.


    +   * Modified log in your system. The log contains suspicious entries.


    +   * Some processes running unexpectedly on your system. Repeated probes of the
    available services on your machines.


    +   * Some unknown computer tries to connect to the hosts and servers on your
    network. Repeated logon attempts from remote hosts.


    # ## General Methods for Detecting Intrusions


    Some of the intrusion detection methods you should be familiar with are listed
    here:


    +   * Analyze the log file for unusual entries.


    +   * Use the last, lastcomm, and netstat commands to get the information about
    the users and computers connected to your system.'
