- pgno: 311
  md: '# Chapter 9 OTHER NETWORK SERVERS


    The chmod, delete, overwrite, and rename directives are set to yes by default.
    The entries to deny the permissions for anonymous users are as follows:


    | chmod | no | guest,anonymous |

    | delete | no | guest,anonymous |

    | overwrite | no | guest,anonymous |

    | rename | no | guest,anonymous |


    # ftpusers


    The ftpusers file is used to specify the users who are denied access to your FTP
    server. This file is in the /etc directory by default. The /etc/ftpusers file
    allows you to keep certain users from logging into your machine via FTP. When
    an incoming FTP connection is received, the /etc/ftpusers file is read by the
    FTP daemon program (ftpd). The file is a simple list of those users who are not
    allowed to log on. The content of the file is given here:


    +   * root

    * bin

    * daemon

    * adm

    * lp

    * sync

    * shutdown

    * halt

    * mail

    * news

    * uucp

    * operator

    * games

    * nobody


    # ftpconversions


    The ftpconversions file contains instructions for compressing files before transfer.
    The file contains the conversion types and their attributes. The format for entries
    in the file is given here:


    ```

    %s (field 1): %s (field 2): %s (field 3): %s (field 4): %s (field 5): %s (field
    6): %s (field 7): %s (field 8)

    ```'
