- pgno: 101
  md: '# Chapter 3 LINUX DISTRIBUTIONS AND INSTALLATION


    # /lib (System Libraries)


    The /lib directory contains shared object libraries needed by system-critical
    programs, such as rm and ls, which make system and library calls. Libraries occasionally
    are updated with new features. As a result, there are two different versions of
    libraries: major and minor. New libraries that are backward compatible with previous
    versions have the same major version number, but a higher minor number. Libraries
    not not backward compatible get a new major number.


    Here are some of the libraries contained in /lib:


    +   - libc.so. This is a C programming library. This contains code for all system
    calls and all library calls.

    - ld-linux.so. This contains shared objects for Linux utilities.

    - libdl.so. This contains dynamic linking functions.

    - libm.so. This contains math functions.

    - libncurses.so. This contains functions that support character-based graphics.

    - libcrypt.so. This contains cryptologic functions.


    # /sbin (System Admin Binaries)


    The /sbin directory holds system administration and maintenance binaries. These
    tools generally are used only by the root user. Some of the programs that you
    may need to make your system operational are discussed in the following section.


    # Disk Fixers


    Disk fixers programs are used to manage partitions and file systems. Some of these
    disk fixers are listed here:


    +   - fdisk. This is used for changing your partition tables.

    - fsck. This is the file system integrity checker.

    - mkfs. This makes a file system on a partition.

    - lilo. This tells MBR where to find the systems files. LILO stores its working
    files in /boot.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Hardware Detectors


    Hardware detector tools are used to detect various hardware devices on your system.
    Some of these tools are discussed here:


    +   - pnpdump. This checks for any Plug-and-Play peripherals.

    - isapnp. This configures PnP cards.


    # Network


    Some of the network tools include these:


    +   - ifconfig. This is used to add or remove a network interface.

    - route. This manipulates your kernel IP routing table.


    # Modules


    These are some of the modules for performing kernel-related activities:


    +   - insmod. This inserts a kernel module.

    - lsmod. This lists kernel module.

    - rmmod. This removes kernel module.


    # General System Admin


    Some of the general administrative tools are listed here:


    +   - init. This creates processes from a script stored in the file /etc/inittab.

    - pidof. This finds the process ID of a running program.

    - shutdown. This shuts down the system.


    # /bin (Useful Binaries)


    The /bin directory holds programs that make the system usable. However, the programs
    in the /bin directory aren''t absolutely necessary to keep the system running.
    These utilities are listed in the next section.'
