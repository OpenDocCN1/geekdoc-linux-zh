  img_proc: true
- pgno: 210
  md: '# OPEN SYSTEMS INTERCONNECTION (OSI) Chapter 6 183


    The UDP header consists of four fields, each two bytes in length:


    +   - Source Port

    - Destination Port

    - UDP Data Length

    - UDP Checksum


    UDP is unsuitable for many applications, although the simplicity of the protocol
    gives performance advantage to those applications that do not require much reliability.
    An example of such an application is one that pertains to streaming video and
    audio content.


    # What Are Ports?


    Port is a term that is used often in networking. Regardless of whether your computer
    is online or offline, your computer has a number of open channels to which various
    programs or other computers can connect. These channels are known as ports. Obviously,
    if your computer isn''t connected to a network, only the local program will be
    able to access these ports. Once a computer is online, however, anyone on the
    network can execute a client program on their remote computer to connect to these
    ports.


    Ports are channels created between two computers for the exchange of information.
    A computer can have many open ports for receiving connection requests. For example,
    a server that has HTTP, SMTP, POP, FTP, and Telnet services can have five open
    ports. The default port numbers of HTTP, SMTP, POP, FTP, and Telnet are 80, 25,
    110, 21, and 23, respectively. These ports are not hardware components, but are
    like virtual stations within your computer''s memory. All computers have them,
    including the server you deal to access the Internet.


    When a computer is turned on, a number of ports are virtually created. They remain
    open and search for programs that are running on remote or local computers. If
    another computer wishes to connect to a port on your computer, it can do this
    in two ways: by being offered a port address to connect to, or by scanning open
    ports.


    Sometimes, your computer willingly gives a port number to another computer to
    make a connection. At other times, the other computer might just guess or try
    one of the universally known ports. However, hackers might also choose to run
    a port scan through your computer from a remote location. A port scanner is'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'software that allows a user to search all ports that a server is listening
    to. When such a program is used, the user simply has to type the IP address of
    the desired computer, and the scanner presents a complete report of all ports
    that are being listened to by the host computer.


    > NOTE

    Port scanners are of two types: *stealth* and *normal*. Stealth port scanners
    are less effective in finding open ports, but they can hide from intrusion detection
    systems, firewalls, and an ISP''s administrative staff. Normal scanners, on the
    other hand, provide more information about open ports in a server and are used
    by administrators because they do not need to hide within their own network.


    # Session Layer and Presentation Layer


    The session layer is the fifth layer in the OSI model, and it offers a channel
    to session-based services, such as:


    +   * **Telnet.** Telnet is a protocol that can be used to perform remote logins
    and operate a remote computer from a virtual terminal.

    * **FTP.** FTP is used for transferring files between two connected computers.


    Both these protocols maintain user sessions from the time they log on to the time
    they log out. The session layer supports a feature that helps in structuring response
    dialogues between computers. This feature allows two-way simultaneous or alternative
    cross-network operations.


    The presentation layer supports a common syntax and provides conversion facilities
    from one type of network to another. This layer also permits computers to be referenced
    by their names, rather than by their difficult-to-remember addresses. The presentation
    layer defines how applications should use a network. An example of a component
    that operates in this layer is the SMB protocol. The SMB protocol provides naming
    facilities and file sharing features in Windows and UNIX-based networks, using
    appropriate servers.'
  merge: -1
  img_proc: true
