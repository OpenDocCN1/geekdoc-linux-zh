- pgno: 29
  md: '# Origin of Linux


    Linux is a UNIX-like operating system developed by Linus Torvalds, a student at
    the University of Helsinki in Finland. Linus was interested in Minix, and he decided
    to develop a system that exceeded Minix standards. Linux released the Linux Kernel
    Version 0.02 in 1991, and it was originally hosted on the Minix operating system.
    In 1994, Linux Kernel Version 1.0 was released.


    ![](img/a46d40e435b42e09209eb0761898e63c_29_0.png)


    # NOTE


    > Minix is a free UNIX-like operating system that is available with its source
    code. Features such as small size, micro kernel-based design, and good documentation
    make it suitable for people who want to run a UNIX-like system. Minix was designed
    by Andrew Tanenbaum for teaching operating system concepts for his book, Operating
    Systems: Design and Implementation (Prentice Hall, 1997).


    Linux can be used for a wide variety of purposes, including:


    +   * Networking

    * Application development

    * End-user platform


    Linux has quickly become popular worldwide because of the free availability of
    its source code. A large number of software programmers have modified Linux source
    code to meet their individual needs. Thousands of programmers have contributed
    to the development of Linux. The free availability of Linux makes it a low-cost
    alternative to other expensive operating systems.


    ![](img/a46d40e435b42e09209eb0761898e63c_29_1.png)


    # NOTE


    > Linux''s official mascot, the penguin, was selected by Linus Torvalds.


    Let me begin by listing some of the advantages of the Linux operating system.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Advantages


    Since its introduction, Linux has become immensely popular among various kinds
    of users. Numerous surveys conclude that Linux is among the fastest growing operating
    systems in the world today. I''ve listed some of the advantages that led to its
    popularity here:


    +   - Cost. Many vendors freely distribute Linux; hence, there is no license charge.
    Some vendors charge for Linux, but the price is nominal compared to that of other
    operating systems.

    - Stability. Linux is very stable due to the fact that patches for it are frequently
    released. Thousands of programmers have reviewed the source code to improve performance,
    eliminate bugs, strengthen security, and ensure stability. As a result, security
    problems in Linux tend to get resolved quickly. Patches are quickly available
    and are sometimes distributed across the Internet within hours of being detected.
    Fixes are often available before commercial vendors—such as Sun, HP, and IBM—even
    acknowledge a problem.

    - No other operating system has ever undergone the kind of extensive review that
    Linux has gone through. The stability of Linux has been tested by running some
    applications on it for years at a stretch. The stretch forced the applications
    to be rebooted often when run on other operating systems.

    - Support. Support to counter Linux-related problems is free and readily available
    because those involved include commercial distributors, consultants, and a very
    active community of users and developers. You can contact Linux users groups (LUGS)
    mailing lists to resolve your queries. In addition, you will find extensive documentation
    available for every reference. Another added advantage is that Linux is not locked
    in a single vendor. The availability of its source code means that user and support
    provider is able to get to the root of technical problems quickly and effectively.
    This contrasts with other operating systems, where people rely on the OS vendor
    for bug fixes.

    - Portability. Most Linux systems are based on standard PC hardware, and Linux
    supports a wide range of PC devices. Linux was originally developed for 386/486-based
    PCs. Now, however, Linux supports a wide range of other computer types, including
    Alpha, Power PC, 680x0,'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'SPARC, ARMs, DEC Alphas, Sun Sparcs, M68000 computers, MIPS, Strong Arm processors,
    and system sizes ranging from PDAs to supercomputers.


    +   - Customization. You can modify Linux for your hardware and software requirements.
    Therefore, you can configure Linux to your computer for optimum utilization. For
    example, Linux can run both the SMB protocol and AppleTalk.


    +   - Tools and Applications. Linux has the tools and applications to cater to
    your needs. Programs ranging from the Apache Web Server to the GIMP graphics editor
    are included in most Linux distributions. Most of these applications and tools
    are available free of cost.


    Work is ongoing for creating highly stable Linux systems. Properly configured
    Linux kernels with suitably configured software commonly run for hundreds of days
    without any need for rebooting the computer.


    ![](img/a46d40e435b42e09209eb0761898e63c_31_0.png)


    > NOTE

    nYou can get more information about the popularity of Linux at the following sites:

    - www.linux-mag.com

    - http://counter.li.org

    - www.idc.com

    - www.nwfusion.com

    - http://linuxtoday.com


    Next, I''ll explain the architecture of Linux.


    # Linux Architecture


    Linux was based on the UNIX architecture. It is POSIX-compliant and supports most
    standards set for UNIX. Therefore, the basic architecture and many features of
    UNIX and Linux are the same. In fact, Linux often is considered another version
    of UNIX. The file system supported by Linux also is similar to the UNIX file system.
    Both have similar directory structures.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# LINUX ARCHITECTURE Chapter 1


    The UNIX-based architecture of Linux is illustrated in the Figure 1-1.


    ![](img/a46d40e435b42e09209eb0761898e63c_32_0.png)


    FIGURE 1-1 The Linux architecture


    Because of these similarities, you can easily port UNIX applications on a Linux
    platform. Linux and the GNU C library used by it have been designed with application
    portability in mind. Linux also implements many features found in the System V
    Interface Definition (SVID) and Berkeley Software Distribution (BSD) variants
    of UNIX, but it does not necessarily adhere to them in all cases. In general,
    Linux has been designed to be compatible with UNIX implementations and to make
    application porting easier. In a number of instances, these applications have
    been improved and then implemented on the Linux operating system.


    > NOTE

    GNU is a recursive acronym for GNU''s Not UNIX and is pronounced "guh-NEW," GNU
    is the output of the GNU project launched in 1984 to develop a UNIX-like operating
    system.


    Let me next provide more detail on the free availability of Linux source code.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Linux - Open Source


    Linux is developed under the GNU General Public License; therefore, its source
    code is freely distributable. Linux is said to have been developed over the Web
    because it has been seen by thousands of developers worldwide who have added to
    its features. These developers have tested Linux, reported bugs, and at the same
    time, contributed toward the elimination of these bugs. As a result, Linux has
    turned out to be a very stable system.


    Eric Raymond has written an essay, "The Cathedral and the Bazaar," on the Linux
    development process. Cathedral and Bazaar are two different approaches for releasing
    software. In this, Raymond discusses the way Linux kernel development uses a Bazaar
    approach, in which code is released as quickly and as often as possible; thereby
    permitting extensive outside input that leads to rapid improvements.


    > Eric Raymond is a member of the Board of Directors of VA Linux Systems, which
    is a leading Linux hardware and systems company. He was the co-founder and of
    the Open Source Initiative, an educational organization that builds bridges between
    hacker communities and business communities with the aim of spreading the open
    source development method. To learn more about Eric Raymond, visit tuxedo.org/~esr/resume.html.


    The code for the applications following the Cathedral approach is more stable
    and released less often than the code released under the Bazaar approach. The
    approach also offers less opportunity for people outside the core development
    group to contribute.


    Projects with the Bazaar approach do not necessarily involve making code available
    to everyone at the design phase. Once the code has been debugged by the developer''s
    end, however, it is reasonable to open the code to everyone so that more and more
    people can get involved in the process of finding and rectifying errors. This
    ensures that the errors are fixed.


    You can use Linux as a server, as a workstation, and as a development platform
    for various applications. I''ll now discuss the various roles that Linux can play.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Linux: A Server


    Linux, like UNIX, is an excellent operating system for Internet servers, including
    Web, e-mail, and FTP servers. The vast networking capability of the Linux operating
    system makes it a prime candidate to be used as a server in any kind of networking
    environment. Linux supports all of the most common Internet protocols. Following
    is a list of some of the protocols supported by Linux:


    +   * FTP

    * SMNP

    * HTTP

    * POP

    * SMTP

    * Telnet

    * SSH

    * NNTP


    Linux has already been widely used and tested on all of these listed protocols.
    Let we now discuss each of these protocols.


    # FTP


    File Transfer Protocol (FTP) is one of oldest Internet protocols, and it is still
    being used extensively. FTP is a part of the Internet protocol suite that can
    be used to transfer files between two computers. FTP works in two modes: text
    and binary transfer mode. Many FTP servers such as WS-FTP are available for Linux.
    Using FTP, you can access files stored in the disk directory of a remote computer.
    FTP is used to do the following:


    +   * Share files, which might include computer programs and data

    * Indirectly or implicitly use remote computers

    * Shield a user from variations in file storage systems among hosts

    * Transfer data reliably and efficiently'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# SNMP


    Simple Network Management Protocol (SNMP) is a network management protocol. It
    was developed in 1988 to provide a framework for network management. Some typical
    purposes for which SNMP can be used are these:


    +   * Assigning addresses to devices

    * Prioritizing communication

    * Installing software on a network

    * Managing printer queues


    Over the years, SNMP has become the standard protocol for internetwork management.
    In the manager/agent model, which is adopted by the SNMP protocol, the processing
    capability resides on the management system. The management system is responsible
    for issuing messages such as Get, GetNext, and Set. You use these messages to
    obtain or store the value of variables. These messages are sent to the agent responsible
    for sending a response back to the management system.


    # HTTP Protocol


    Hyper-Text Transfer Protocol (HTTP) is the standard protocol used for transferring
    documents on the World Wide Web. HTTP is employed in the client/server architecture.
    After a successful connection is established between server and client, the client
    can send requests for resources, such as Web pages, on the server. The server
    sends the requested resource back to the client. HTTP operates over TCP connections,
    usually at port 80, though this can be overridden and another port can be used.


    # POP Protocol


    Post Office Protocol (POP) is a messaging protocol that enables users to access
    their mailboxes. The POP protocol is based on a client/server model. The messages
    are stored in the server. Users download these messages to their computer using
    a POP client, such as Eudora. POP provides for user authentication by authenticating
    users through passwords. However, passwords are transmitted as clear text, which
    means that POP should be used very carefully because the transmission method is
    not secure.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# LINUX: A SERVER


    Chapter 1


    # SMTP Protocol


    Simple Mail Transfer Protocol (SMTP) is a messaging protocol responsible for delivering
    mail. It Relays mail messages from an SMTP client to the SMTP server and from
    one SMTP server to another. In case of delivery failure of mail, the messages
    are queued up in the SMTP server. The SMTP server tries again to deliver these
    queued messages. Two popular SMTP servers for Linux are Sendmail and qmail.


    # Telnet Protocol


    The Telnet protocol enables you to remotely log on a computer on a network. The
    Telnet protocol is based on the client/server model. The computer that tries to
    connect to the server from a remote location is. On the other hand, the computer
    to which the request is being made and allows establishment of the connection
    is the server. The connection between the two computers is established based on
    some pre-defined criteria, such as the terminal type to be used. The username
    you specify during the connection determines your access on the destination''s
    computers files and directories.


    # SSH Protocol


    The Secure Shell (SSH) is a protocol for encrypting TCP sessions over the Internet.
    The primary use of SSH is remote login. However, it can also be used as a cryptographic
    tunnel. This tunnel generated by the SSH can be used for various purposes, such
    as copying files, encrypting e-mail connections, and triggering remote execution
    of programs.


    Before establishing connection between two computers, SSH connects to the server,
    performs secret key negotiation between the two computers, and starts encrypting
    the session after successful negotiation. SSH uses asymmetric key pairs to implement
    its secure sessions. The asymmetric key pair consists of two keys: a private key
    and a public key. The private key is stored with the owner, and the public key
    is distributed freely across the network. The private and public key pair contains
    algorithms that complement each other. During authentication, the public and the
    private keys are matched. After successful authentication, the SSH client is allowed
    to log on without the need to supply a password.


    ![](img/a46d40e435b42e09209eb0761898e63c_36_0.png)'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# NNTP


    The Network News Transport Protocol (NNTP) is based on the request-response model.
    The news delivery is based on the broadcasting technology. Unlike the messaging
    protocols, NNTP is delivered to several hosts at a time rather than to a specific
    host. NNTP is used to send messages from newsgroups to a Linux computer and from
    users to the newsgroup. These messages are stored on a newsgroup or newsnet server.
    NNTP supports the processes of reading newsgroups, posting new articles, and transferring
    articles between news servers.


    # Networking Support in Linux


    In today''s environment, no operating system can be successful without efficient
    capabilities and support for easier network management. Linux provides you both
    these features. The use of the Internet is the backbone of the development for
    the Linux OS. As a result, the support for networking was included during the
    development phase itself. In addition, due to the constant research and development
    activities being performed on Linux by various programmers, it has outperformed
    various existing operating systems. Linux provides full and seamless support for
    other operating systems, such as Macintosh, DOS, Windows, and OS/2.


    Some of the advanced networking features of Linux are:


    +   - Support for TCP/UDP/IP protocol suite

    - A number of new features added to the kernel

    - Support for Quality of Service (QoS)

    - Firewall implementation by using ipchains

    - VPN implementation by using Generic Routing Encryption (GRE) tunnels

    - Advanced routing implementation using netlink sockets


    # Linux on a Desktop


    Linux supporters claim it''s a perfect desktop replacement for Windows. Linux
    is a legitimate OS for normal desktop users, full-time Internet users, and others.
    It meets the requirements of most users. But, at times, some applications'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# LINUX ON A DESKTOP Chapter 1


    or tools might not be supported on Linux. For example, CAD programs such as AutoCAD
    might not be work as per the expectation.


    Linux has many features that qualify it as a workstation. Linux supports the following:


    +   - Multiuser workstations

    - Web browsers (Mozilla/Konqueror/Netscape/Opera)

    - Applications (such as word processing, spreadsheets, graphic applications, and
    games)

    - Printers

    - Plug-n-Play hardware devices

    - X Windows GUI interface

    - Thousands of other freely available software applications


    # Linux as a Development Platform


    Linux can also be used as a development platform. It provides support for various
    programming and scripting languages, such as Perl, PHP, Python, C++, gtk, ASP,
    Java, and TCL. Linux supports compilers and other tools necessary to develop applications
    by using these languages. A brief description of some of these languages is given
    in the following list:


    +   - Perl. Perl is a scripting language. Perl scripts can be used as CGI scripts
    and can be embedded in HTML code. Perl caters to a wide range of programming requirements.
    The language has been vastly tested and tried. The advantage of Perl is its string
    parsing abilities, and the draw-back is that its source code appears complex to
    manage.

    - Python. Python is an interpreted, object-oriented language. Python scripts have
    a very well-defined structure and source codes are much simpler-looking than Perl.
    Some security concerns have been reported for Python, but that is true for every
    language.

    - PHP. HyperText PreProcessor (PHP) is a server-side scripting language and has
    gained tremendous popularity over the last few years. One of the reasons for this
    popularity is PHP''s capability to manipulate datatypes and ease of use while
    interacting with databases. The simple source code'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'and easy implementation on the Web has made PHP the best choice for performing
    dynamic tasks on Web sites.


    +   Java is the programming language that is based on the concept of "write once,
    run anywhere." The Java Virtual Machine (JVM) enables Java programs to run on
    any machine. You just need to transfer the compiled Java code on the target machine.
    Linux supports Java, Servlets, JSP, applets, and related technologies. Servlets
    and JSP are used to create dynamic Web pages. The servlet and the JSP code are
    executed on the server. Applets are Java programs that are executed on the client
    browsers.


    +   C/C++. The C and C++ languages are so popular that they need no introduction
    for programmers. Linux supports compilers for these languages. For example, gcc
    is a compiler for the C language. Linux itself has been written in C/C++.


    # Summary


    In this chapter, you learned about the features of Linux. Linux is an operating
    system with freely distributed source code. You learned how Linux can be used
    as a server, a workstation, and as an application development platform. You also
    learned about the protocols Linux supports, including FTP, Gopher, HTTP, IP, POP,
    SMTP, TCP, Telnet, SSH, and NNTP. You also learned about the networking features
    of Linux and how Linux can be used as a workstation. Finally, you looked at Linux''s
    ability to be used as a development platform for languages, such as Perl, C, C++,
    and Java.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '![](img/a46d40e435b42e09209eb0761898e63c_40_0.png)


    # # Chapter 2


    Linux Security:

    An Overview'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'n the modern world, electronic media are being used increasingly for communication
    and data storage. With the increase in electronic data exchange, the threat to
    shared data and information also has increased. The threat can be multifold, ranging
    from a competitor tracking communication to physical damage of the storage media.


    This chapter provides guidelines to help you effectively counter these threats.
    In this chapter, I will discuss the basics of security, the need for security,
    and the precautions you can take to secure data on your computer. I''ll also discuss
    security for the Linux environment wherever applicable.


    # # Need for Security


    Today, millions of computers are connected to the Internet. People across the
    globe communicate, share business plans and goals, and store data on the network.
    Storing data on a network is risky because your business rivals always stand a
    fair chance of accessing this data.


    For example, if you send data from a computer in Washington to a computer in Tokyo,
    the data may have to pass through several computers in order to reach its destination.
    This may give other users the opportunity to intercept and alter the data. Other
    users on your system may even maliciously modify the data.


    Organizations are well aware of the importance for security of transactions, such
    as online shopping and banking, because the revenue of an organization depends
    on the security of the networks over which these critical transactions take place.
    However, security is equally necessary on a user''s desktop or laptop computer.
    For example, your office computer may contain business information that may prove
    advantageous to your competitor if they somehow get their hands on it.


    In a different scenario, losing information may cost you valuable time to retrieve
    or recreate it. Your home PC may contain information such as financial records,
    personal passwords for accessing your banking and investing online accounts, credit
    card numbers, private documents and e-mail, and other pieces of information that
    could be misused by any person to cause financial losses. The data that is deleted
    by intrusion or physical damage may be irrevocable.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# NEED FOR SECURITY


    No computer can be completely secure. Hackers are always on the lookout for ways
    to attack your system. However, you can make it difficult for someone to misuse
    your system. The average home Linux user doesn''t have to make special efforts
    to keep the casual hacker at bay; high profile Linux users need to take extra
    measures to secure their systems.


    As an administrator, you should secure your system as much as possible. You should
    do a thorough analysis of the security that your system and network require. You
    need to evaluate the threat to your system, the vulnerability of your system,
    the security holes in your systems, the estimated loss to your organization in
    case of an intrusion, and so on.


    These three factors determine the level of security you need to implement:


    +   * Risk. This is the risk that is involved in providing access to the users.
    You need to analyze the possibility of an intrusion. An intruder can inflict heavy
    damage to your system if he is able to obtain read and write permission to the
    file system. You might lose your data permanently.


    +   * Access. You should have complete control over the kind of access that is
    provided to users. You should provide access judiciously. Only trusted users should
    be provided access. In addition, provide access to a user dependent upon his or
    her requirements. A user who doesn''t write access shouldn''t be provided with
    it.


    +   * Vulnerability. You should also do an analysis of the vulnerability of your
    system to attacks from users outside your local network. One way to protect data
    and ensure user privacy is to create and implement an effective security policy.
    The security policy you create be such that users are easily able to comprehend
    it, and they shouldn''t face any problem implementing it. The security policy
    should mention the permissions users have, the services a user can access, and
    so on. It is the responsibility of the system administrator to ensure that the
    policies are updated and implemented properly.


    Intruders constantly attempt to attack your system. Their prime targets are the
    servers, dial-up accounts, and the Web sites. You should be aware of the techniques
    they might use. Intruders usually look for security holes in your system and networks.
    One of the common security holes is the presence of insecure accounts on your
    system. If an intruder gets access to your system he can hack other hosts if your
    system is connected to a network. There'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'are several categories of intruders. They are categorized depending on their
    intentions and the damage they can cause.


    The categories of the intruders are listed here:


    +   - Curious intruders try to gather information, such as your system configuration
    and settings, the data that is stored on your system, and so on. The curious intruders
    do not intend to harm your system and data; their only purpose is to gain critical
    information stored on your system.


    +   - Malicious intruders, unlike curious intruders, intend to damage your data
    and system. Once they gain access to a system, they will perform destructive activities,
    such as defacing Web pages, destroying system data, and so on. The purpose of
    these intruders is only destruction; they will not use the data on your system
    for their own benefit.


    +   - Competitor intruders try to access the data on your computer. They use this
    data for their business benefit and gain an edge over their business in the market.
    The purpose of their data access is to obtain your business-related data, analyze
    it, gain an insight into your future business plans, and use it for their own
    benefit.


    +   - Borrower intruders lack resources that they need to perform their own activities.
    They intrude in your system to use your resources to fulfill their need.


    +   - Lefrogger intruders usually attack systems that are well-connected to other
    computers on the network. They try to attack and use resources on other computers
    in a network through a well-connected computer. Gateways are prime targets of
    such intruders.


    In the wake of increasing Internet usage for communication and data exchange,
    it becomes essential for you to secure your system from attacks occurring via
    the Internet.


    Security for the Linux environment can be categorized into four levels:


    +   - Physical security

    - Data security

    - Network security

    - Accounts security


    In this chapter, I discuss each level of security in detail.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# PHYSICAL SECURITY


    # Chapter 2


    # Physical Security


    Physical security is the basic security that you need to implement. You need to
    consider factors such as physical accessibility of people to your system. Home
    users may not need to secure their computer physically. In an office environment,
    physical security of systems is more critical because they contain data sensitive
    to your business. In such an environment, you can take security measures, such
    as installing video surveillance and employing security guards.


    The physical security you can provide to your system is based on security need
    and budget. For example, you will certainly not provide high physical security
    on a computer where only games are loaded. A computer with critical and confidential
    data will need high physical security. In an office environment, someone can easily
    access to systems by simply walking to a user''s desk and manipulating data.


    # Common Precautions for Physical Safety


    You can take a number of measures to safeguard your PC equipment. Some methods
    are inexpensive and can be implemented easily, while others are expensive and
    more sophisticated. Here are a few of these measures:


    +   - Use video surveillance at your workplace. The video cameras should be hidden
    and not easily noticeable.


    +   - Store the backup media at safe places. If possible make copies of the backup
    and store them separately.


    +   - Take care of your computer and other equipment while traveling.


    +   - Lock the CPU cover to avoid theft of any part, such as motherboard or hard
    disk.


    +   - Lock the equipment in a safe place when you leave.


    +   - Install security alarms.


    +   - Employ security personnel to protect your equipment.


    +   - Restrict access to critical and expensive equipment. Use security measures,
    such as fingerprint scanners and voice identifiers.


    +   - Buy computers and equipment that have built-in security features.


    +   - Install the servers, such as gateways, that are most prone to attacks on
    separate computers.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Chapter 2 LINUX SECURITY: AN OVERVIEW


    I have listed above some of the precautions that you should take for physical
    security, but there''s much more to physical security. Other aspects of physical
    security include:


    +   * Computer locks

    * BIOS security

    * Boot Loader security

    * xLock and vLock

    * Detecting physical security compromises


    # Computer Locks


    Using locks can prevent theft of hardware components of your system. If you leave
    your computer unlocked, thieves can open the CPU of your system and steal hardware
    pieces, such as motherboard and RAM chip. They might even damage your your system
    beyond repair. In both cases, you lose your critical data as well as costly components.
    There are customized locks available in the market. Some computer manufacturers
    attach clamps with the CPU with which you can protect your system. You can secure
    your system by attaching a cable to the computer. Thieves would need to cut the
    cable in order to get to the computer. This method is not foolproof, but it is
    helpful in discouraging thieves. You can use locks to safeguard your expensive
    equipment, such as Web cameras, CD Writer devices, and so on. Small devices can
    be placed in locked cabinets.


    # BIOS Security


    The Basic Input/Output System (BIOS) is a program that determines how your computer
    starts. BIOS manages the communication between the operating system and the hardware
    devices attached to the computer. BIOS enables you to protect your computer. It
    does this by enabling you to secure a boot password. A user needs to provide this
    password in order to boot and log on your system. However, the security provided
    by BIOS is very weak and can be easily breached because you can reset or remove
    the BIOS. Some BIOS makers provide default passwords easily known to the hackers
    and they can easily boot your system if you haven''t changed the default password.
    You can also configure BIOS so that it won''t boot from floppy disks. Although
    protection through BIOS is not very secure, it can prove to be a deterrent. It
    will take more time for the attackers and there is high possibility of traces
    being left behind.'
  merge: -1
  img_proc: true
- pgno: 46
  md: "# PHYSICAL SECURITY\n\n# Boot Loader Security\n\nYou can set boot passwords\
    \ for various Linux boot loaders. These passwords are not foolproof, however,\
    \ and they will only delay the attacker. Intruders can bypass this password and\
    \ boot the system. They can boot from floppies. To prevent intruders from employing\
    \ this technique, disable booting from floppy on your system.\n\n# xlock and vlock\n\
    \nAt times, you might have to leave your workstation. While you are away, anyone\
    \ can come to your workstation and have a look at the document on which you are\
    \ working. You can prevent this by locking your display console. The two programs\
    \ that enable you to lock your console are xlock and vlock.\n\n+   - xlock is\
    \ an X display locker. xlock locks the display monitor of your computer. You may\
    \ need to provide a password to unlock the display monitor. xlock is available\
    \ in all Linux distributions that support X.\n- vlock locks the virtual consoles.\
    \ It can be used to lock any or all of the virtual consoles on your computer.\
    \ If you lock only a few consoles, you can continue to use other consoles. Locking\
    \ your console will prevent someone from tampering with your work, but it does\
    \ not prevent them from doing the following:\n  - Rebooting your computer\n  -\
    \ Accessing your computer from another computer on the network and causing problems\n\
    \  - Switching out of the X Window System entirely and going to a virtual console\
    \ login prompt\n\n# Detecting Physical Security Compromises\n\nYou should watch\
    \ for various signs that hint at security breaches on your computer, and note\
    \ the date and time your computer was rebooted. This can provide a vital clue\
    \ about the intrusion. Linux is very stable. You don't need to reboot a Linux\
    \ computer often except in situations as you upgrade the OS or change the password.\
    \ If you reboot the computer after changing the OS or upgrading the hardware,\
    \ you will be aware of the date and time you did that. Therefore, you can easily\
    \ get an indication of intrusion if you notice that the computer was rebooted\
    \ at an unusual time."
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Chapter 2 LINUX SECURITY: AN OVERVIEW


    Check for physical signs of tampering, such as scratches or the shifting of the
    monitor or CPU from their original positions. Intruders often attempt to clean
    up any evidence of intrusion. They might modify the log files to delete entries
    caused by the attack. However, unless they are extremely careful, they will leave
    behind some evidence such as last modified timestamp of the log. Therefore, if
    you suspect any intrusion, you should analyze the log carefully. You can also
    maintain copies of log files at a different location and protect them. If you
    do not store logs in a protected environment, log data might be of little use
    because there is a high possibility of an intruder modifying it.


    There''s a daemon called syslog that can be used to log the activities on your
    computer. You can configure syslog to send data automatically to a central syslog
    server. However, the drawback of using syslog is that the log entries that it
    sends to the syslog server are plain text. It is not encrypted. Therefore, any
    unauthorized user keeping a tab on your network can access the data that is being
    transferred. There''s one more risk associated with using the syslog daemon. The
    syslog server doesn''t verify the source of the log entry. It accepts log entries
    from any computer that claims to be a local host in the network. You should study
    the logs in the syslog server for these indications of intrusion:


    +   * Unfamiliar log entries

    * Unusual date and time entry in the log

    * Logs suggesting that the computer was restarted or rebooted

    * Logon attempts from unknown hosts


    You have now looked at securing your system physically. Next I''ll discuss how
    you can secure the data on your computer.


    # Securing Data


    Securing data is most critical for your business. The causes of data loss are
    many. You might lose data due to hard disk crash, virus attack, hardware failure,
    or attack by intruders. One way to prevent data loss is to make regular backups.
    You can make backups on various storage media, such as tape, other hard disks,
    and cartridges. The choice of the backup media depends on the storage space that
    the data being backed up requires and the resources available to you. Data redundancy
    is another measure to prevent data loss. Data redundancy writes data onto several
    disks, which may be spread across disks. Identical data is copied to each other.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# DATA SECURITY Chapter 21


    This will ensure that even if one of the disks crashes, your data will be intact.

    Rundant Array of Inexpensive Devices (RAID) enables you to perform data redundancy
    rather inexpensively.


    You should consider making more than one backup copy and storing the backups at
    different physical locations. Consider a situation where you have stored the backup
    data at your workplace, and some unfortunate event such as flood or earthquake
    occurs. In this case, you will end up losing your original data and backed up
    data. Storing backups at different locations will help you restore data in such
    situations.


    Many organizations provide emergency recovery services. These organizations provide
    services such as storing backup data at different physical locations and provide
    you computers and facilities in case your workplace becomes unusable.


    You can also prepare a disaster recovery plan. This plan will contain details
    of how, when, and where the backup should be made and include the measures you
    need to take in order to protect that backup media and restore the data in case
    of any disaster. In addition to these items, the plan should mention how to continue
    running your business while your workplace is being repaired. The plan should
    enable you to perform all your business activities. The plan should be known to
    every concerned user and it should be open and regularly updated.


    Many programs have the built-in feature of data recovery. If you have several
    servers on a network, you can configure the servers to back up data from one another.
    This will ensure that data is not lost in case one of the servers crashes.


    # NOTE


    Sometimes an unauthorized user can reboot your computer, resulting in loss of
    any unsaved data. To prevent this from happening, you can use the /etc/shutdown.allow
    file, which contains a list of usernames that are authorized to reboot the computer.
    Linux looks up this file when a user tries to boot the system using the Ctrl+Alt+Del
    keys to determine whether the user has the authority to boot the system.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Secure Data Deletion


    You make backups to prevent data loss. However, at times, you no longer use them
    but need to ensure that your business competitors or any other unauthorized user
    can''t access that data. However, merely deleting a file does not ensure that
    an expert user cannot recover it. When you delete data, the reference data still
    exists in the memory until it is physically overwritten by other data. When then,
    deleted files are potentially recoverable with sophisticated data recovery tools.
    To destroy sensitive data, you can use programs that will overwrite deleted files
    multiple times with dummy data. Of course, if the system is scrapped or recycled,
    rather than resold, the sure method of preventing data from being recovered is
    to physically damage the hard disk beyond repair.


    # Data Encryption


    The security measures discussed up to this point are helpful to a large extent
    in securing your data and PC and keeping intruders out. However, if an intruder
    is able to get access to your data even after you''ve adopted all this security
    measures, they can easily read and understand your data. One way to prevent this
    is to encrypt the critical data. You can encrypt the data that is stored on your
    computer as well as the data that is being transferred over a network.


    Encryption is the process of converting data by applying some algorithm in such
    a way that it can''t be read by anyone except the user who has the algorithm to
    reverse the algorithm that was applied earlier. The process of reversing encrypted
    data back to its original form is known as decryption. Encrypting data is particularly
    safe when you are transferring data over a network. If an intruder gets access
    to the data being transferred, he won''t be able to use that data because he won''t
    have the decryption algorithm. Only users with the decryption algorithm will be
    able to use the data.


    You''ll learn more about encryption in Chapter 5, "Encryption and Authentication."


    Next, we''ll look at securing your network.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Network Security


    In modern times, more and more people are connecting to the network, and an increasing
    number of organizations are moving toward network-centric business. Such businesses
    have become prone to attacks from intruders who want unauthorized access with
    varied intentions, such as business rivalry. A number of tools are available to
    help you with network security. Some of these tools are shipped with Linux operating
    systems.


    You need to prepare for two kinds of security on a network: host-based security
    and network security. Host-based security is the most critical security area that
    system administrators need to implement. Ensuring host-based security involves
    securing your own and other systems on the network. This involves choosing strong
    passwords, securing the host''s local network services, keeping logs, and upgrading
    programs. However, these tasks can become daunting when your network becomes larger
    than a few computers.


    Network security is as necessary as host security. Network administrators should
    ensure that only authorized users access networks, build firewalls, use strong
    encryption, and ensure that all computers on the network are secure. The key to
    network security is to allow only those functions that users actually need and
    to make those functions as secure as possible. The following list provides some
    critical factors that are important for the smooth functioning of a network:


    +   - Firewalls

    - Secure protocols

    - FTP security

    - Modem security

    - Windows networking

    - Network monitoring

    - Network configuration files

    - Disable unnecessary and unauthorized services

    - DNS security

    - Network information service


    I''ll now discuss each of these in detail.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Firewalls


    Each network includes some computers that are dedicated to the proper functioning
    of the network. The firewall is one such computer meant for the security of the
    network. Firewalls are used to separate an organization''s intranet from the Internet.
    Firewalls are used to check the communication between computers in different networks.
    Let me first explain the terms related to firewalls. These are as follows:


    +   - Bastion host

    - Router

    - Demilitarized Zone

    - Proxy


    # Bastion Host


    A Bastion host is a computer used to control access between an organization''s
    intranet and the Internet. The Bastion host usually runs a Linux-like operating
    system. These hosts are configured so that they perform only the task for which
    they are meant. All other unnecessary and unutilized services are turned off.


    # Router


    A router is a computer meant for connecting networks together. Routers also handle
    additional functions, such as managing the traffic on the networks they connect.


    # Demilitarized Zone (DMZ)


    A DMZ is a host or a small network within a network. It acts as a neutral zone;
    that is, it is neither trusted nor distrusted. It is usually placed between an
    intranet of an organization and the outer network. It prevents users from outside
    the network from directly accessing data on computers within a network. The host
    on the DMZ network receives requests from the internal users and then creates
    a session for these requests.


    # Proxy


    A proxy server is a server that acts as an intermediary between the Internet and
    a user. A computer that has the ability to fetch documents from the Internet might'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# NETWORK SECURITY Chapter 25


    be configured as a proxy server, and other computers on the intranet might be
    configured to be proxy clients. Therefore, when proxy clients need to access resources
    on the Internet, they make a request to the proxy server. The proxy server then
    uses the URL provided by the proxy client, fetches the resource from the Internet,
    and then passes it to the proxy client. In this way, all hosts on the intranet
    are able to access resources on the Internet without being directly connected
    to the Internet.


    Access servers, such as firewalls and gateways, should be configuring after much
    thought. These servers act as entry points to your network. Therefore, hackers
    try to gain access to these servers, because once they get access to all the hosts
    on the networks.


    There are three basic types of firewalls:


    +   - Application gateways

    - Packet filters

    - Hybrid systems


    These are discussed in the next three sections.


    # Application Gateways


    The application or proxy gateways act as a proxy server in the network. The software
    that enables the application to run as a proxy server runs at the application
    layer of the OSI Model. By default, the application gateway blocks the traffic
    between the local network and the Internet. They need to be configured in order
    to allow traffic to pass through.


    # Packet Filtering


    Packet filtering is a technique whereby routers have Access Control Lists (ACL)
    turned on. You can use ACL to enforce security policy in a network. ACL determines
    the kind of access you allow computers over the Internet or other networks to
    have to your internal network and vice versa. If ACL is not turned on, a router
    will pass all traffic sent to it without any restrictions.


    Packet filtering requires less overhead than application gateways. Therefore,
    packet filtering techniques work faster than the application gateways.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'The packet filtering technique uses either the transport or the session layer
    of the OSI Reference Model. The usage of lower levels enables it to support new
    applications. This support for new applications comes automatically. However,
    the disadvantage of using packet filters is that you cannot determine the source
    of the packets. To overcome this disadvantage, you can use different techniques
    to identify the source of the packet filters. One of the methods is to use different
    layers of packet filters for local networks or Internet.


    # Hybrid Systems


    Many vendors are developing systems that provide advantages of both application
    gateways and packet filtering techniques. The application gateway is secure, whereas
    the packet filtering technique is faster and flexible. In these systems, application
    gateways approve the new connections requests. The packet filtering ensures that
    the packets belonging to the authenticated connection pass through.


    You should regularly review the access policies, security, and services running
    on the system. The system should run only the services necessary to perform the
    desired tasks. If you have configured a firewall on the system, you should not
    use it as a mail server, Web server and so on. Here are some of the checks you
    need to perform while configuring a firewall:


    +   - Disable the services that are no longer required.

    - Disable the system from using the routing packets by stopping the IP Forwarding
    service.

    - Use the latest version of the software that runs the firewall. A policy for
    firewalls should be in place. The policy should specify the action to be performed
    for preventing attacks.

    - Access to the system and network management utilities should be restricted.

    - You should check the status of your system and network at regular intervals.
    Any unusual activity might be a sign of an intrusion.


    Take every care while configuring firewalls because they act as an entry point
    to your network. The firewalls are more prone to intrusion attacks. Make sure
    that you review your firewall policies before the configuration and at regular
    intervals.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Prevent Spoofing


    A computer can imitate another host on a network by using the same host name,
    which means that it can pretend to be a trusted computer on your network.


    You can stop this by modifying system files on the host computers in your network.
    The hosts should be configured to turn off the source routing. The incoming packets
    to your network should be filtered properly. This will ensure that the source
    IP address of any of the packets is not the same as that of host on your network.
    If any such packet is found, it should be discarded.


    # Secure Protocols


    You should use secure protocols on your network. These are two secure protocols
    that you can use:


    +   * SSH

    * SSL


    These protocols are described in the following sections.


    # SSH


    Secure Shell (SSH) protocol is used for securing remote access connections over
    IP networks. SSH protocol secures data by encrypting it when it is transmitted
    over the network. The SSH program has made remote management of network hosts
    over the Internet possible. SSH is designed to be a complete replacement for Telnet
    programs and login, rsh, and rcp commands.


    # SSL


    Secure Socket Layer (SSL) protocol was developed by Netscape to provide privacy
    and reliability between two communicating applications. The SSL protocol runs
    above TCP/IP and below other higher-level protocols, such as TELNET, FTP, or HTTP.
    SSL enables data encryption, authentication of server and client, and message
    authentication.


    SSL is a layered protocol. It has two layers: the SSL Handshake Protocol and the
    SSL Record Protocol. The SSL Handshake Protocol creates secure communication between
    the client and the server. The Record Protocol encapsulates information of higher
    level protocols. The benefits of using SSL include cryptographic security, reliability,
    interoperability, extensibility, and efficiency.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# FTP Security


    The guidelines you should follow regarding FTP security are listed here:


    +   - When not needed, disable the FTP service. As per your requirements, you
    can disable the entire service or provide access to some users.

    - The /etc/passwd file contains the list of users who do not have access to the
    FTP service. This file should be maintained and monitored regularly.

    - Maintain a log of the FTP-related activities.

    - The access permission you assign to FTP users should be as restrictive as possible.
    The write permissions shouldn''t be given to the directories unless it is a master.


    # Modem Security


    If you are using a modem to connect to the Internet, you should configure a password
    for security reasons. A user getting access to the Internet will have to provide
    this password in order to get through. To do this:


    +   - Configure the /etc/d_passwd file.

    - Verify that passwords are not guessable.

    - Do not assign the same password to more than one user.

    - Disable the account when the user no longer needs access.

    - Log out users after disconnecting.


    # Windows Clients


    Networks normally include Microsoft clients that most probably use either NetBIOS
    or other insecure networking protocols. NetBIOS is the protocol that publishes
    share names, user names, and host names on the network. It is advisable to disable
    NetBIOS for Windows workstations. In situations where you need NT servers in the
    network, you should have two NICs in the NT server. One NIC one should be internal.
    After configuring NICs, you can disable NetBIOS binding to TCP/IP. This will prevent
    intruders from accessing your network through TCP/IP. Once intruders get access
    to your network through TCP/IP, they can easily obtain critical information about'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'your network. In addition to performing these tasks, you should also consider
    blocking ports 137 to 139 on routers and firewalls.


    # Network Monitoring


    Monitor your network closely and regularly. You should be aware of the status
    of your network so that you can detect any kind of intrusion. Monitoring also
    helps you detect abnormal system activities, as high system load, increased disk
    use, slower network, unfamiliar processes, etc. Many tools are available for network
    monitoring. Some tools, such as KServermon, Sysmon, and NetSaint, were developed
    for other platforms first and ported to Linux.


    # Disable Unnecessary and Unauthorized Services


    By default, Linux might run several services. These services offer a wide range
    of services to the users. You should switch off the services that you do not require.
    Running unnecessary services poses a risk of unauthorized users accessing these
    services and harming your system. Computers on your network running unauthorized
    services can provide an opportunity for a hacker to gain access to the system.
    You should create and implement a policy to scan the ports of the hosts on your
    network. The port scanning helps you detect security holes in your network. It
    is common practice among intruders to look for vulnerable ports in a network.
    There are several scanning tools that help you in this task.


    # Domain Name Service Security


    The monitoring and regular updating of DNS information in your network is critical
    for network security. The DNS information of the hosts on your network helps you
    monitor the network and ensure security. In case an intruder tries to connect
    to your network, you can recognize him by checking the DNS entry of his host.
    If there is no corresponding DNS entry, it indicates an unauthorized host. Various
    services are available to assist you in denying the connectivity permissions to
    the unauthorized hosts. These services look up the DNS entries to authenticate
    hosts.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Network Information Service


    Network Information Services (NIS) is a distributed access system in which every
    host on the network that an NIS client accesses a central server called the NIS
    master for access permission. NIS is a generic client/server database system.
    It shares account information contained in various database files, such as the
    /etc/passwd and /etc/group files over a network.


    NIS maintains a centralized password database that is accessible over a network.
    This eases the administrative concerns associated with multiple hosts and users.
    Without NIS, the user''s account would have to be maintained on each host. Maintaining
    account information on a large number of computers may cause problems. For example,
    you wouldn''t be sure that the change of password on one host is reflected on
    other hosts. Every host on the network is configured to use the NIS server for
    its security instead of using its own local password database.


    # Account Security


    Account security involves securing and maintaining accounts of various users on
    your computers and networks. In the Linux environment, accounts are created for
    different users and groups, and each account has certain access rights and permissions
    associated with it. Accounts of high-profile users, such as administrators, would
    have more access rights than a normal user.


    Linux systems support two types of users:


    +   * Root users

    * Normal users


    The root users have all the administrative rights for the system. The root users
    are responsible for performing all the administrative tasks, such as creating
    partitions, installing and upgrading software, creating user accounts, and so
    on. On the other hand, normal users are the users who use the services provided
    by your system. The root users assign the required permissions to the normal users.
    These permissions are set in the home directories that are created for each user.
    A user cannot access the home directory of another user.


    You should be careful while you are logged in as a root user. Consider a situation
    in which you accidentally delete some critical system files. Therefore, you should
    log in as root only when you need to perform root-specific tasks. For performing
    the routine tasks, you should log on as a normal user.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Password Security


    When selecting passwords, it is important to select ones that are not easy to
    guess.


    A company should have standard guidelines for passwords. You should not use common
    words as passwords because hackers easily guess those common words. There are
    programs available to test password security by trying the thousands of words
    available in the dictionary. If the password is a word found in the dictionary,
    your security is rendered useless.


    You should encourage users on your network to change passwords at regular intervals.
    You should try to hack the passwords of the hosts on your network to ensure that
    passwords are strong enough. Configure the accounts to be disabled after a specified
    number of unsuccessful login attempts. This will discourage hackers who are trying
    to get through your system by guessing your password.


    Many vendors supply systems with default passwords. Most hackers are aware of
    these default passwords. You can eliminate the problem of default passwords by
    changing the default password when allotting systems to users. You can create
    unique default passwords for each system before distributing them to users and
    ask users to change the passwords.


    The /etc/passwd file contains your passwords. To prevent someone from breaking
    into the file, create shadow passwords. Shadow passwords are used to protect system
    passwords by making the file containing the shadow passwords readable only by
    the root operator. Shadow passwords replace with asterisks the encrypted password
    in the passwd file. Moving the passwords to the shadow makes it less likely that
    the encrypted password can be decrypted because only the root user has access
    to the shadow file. To see whether you have shadow passwords enabled on your system,
    use the command:


    ```

    ls /etc/shadow

    ```


    If the file has not yet been created, you receive the following message:


    ```

    ls /etc/shadow: No such file or directory

    ```


    If you are using or planning to use shadow passwords, you can use the pwconv utility
    and pwconv utilities that are part of the Shadow Suite tools. The pwconv utility
    will create the shadow file if it does not exist. If the shadow file exists, pwconv
    synchronizes it with passwd by adding to the shadow file any passwords that are
    not there and deleting those that are no longer in the passwd file. The pwconv
    utility also updates any password age information. The pwconv utility allows you
    to remove shadow passwords and restore passwd to its original state.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Chapter 2 LINUX SECURITY: AN OVERVIEW


    The command passwd is the default command used to change passwords in UNIX and
    Linux systems. It generally supports password minimal checking of user passwords.
    Password aging is the requirement that users change their passwords after a specified
    period. For example, the version of passwd included in Sun Solaris supports password
    aging and makes the following checks:


    +   - Minimum length, which the administrator can specify. Only the first eight
    characters are considered for the purpose of authentication.

    - Must contain at least two letters in any case and one number or symbol.

    - Cannot be the user''s login name, the reverse of the name, or any circular shift
    of that name.

    - New passwords must have at least three characters that are different from the
    old password.


    You can set up passwords for LILO and screen savers as well. If you configure
    passwords for LILO, you are prompted to specify passwords during the boot time.
    The lilo.conf file is used to configure the LILO password. However, this method
    is not secure if you have multiple operating systems installed on your computer.
    An intruder can boot to the other operating system on your computer that does
    not have the booting configured.


    You can protect your data from being displayed to the other users by setting a
    screen saver. The screen saver blocks the display of your monitor after a specified
    inactivity period. You can also configure a password for the screen saver. You
    need to provide this password in order to view the display again. This method
    is useful for those users who frequently walk away from their workstation.


    You can specify passwords for hardware devices as well. There are two such types
    of passwords:


    +   - Power On Password (POP)

    - Privileged Access Password (PAP)


    The POP is configured in the CMOS of the computer. POP requires users to specify
    the configured password before booting the computer. The PAP password stores passwords
    in nonvolatile memory. If a hacker is to break the POP password and boot your
    computer, he is prompted for the PAP password. You should be extra careful with
    this, because there is no way to crack the PAP password. If you forget the PAP
    password, system will not be of any use. If you forget the POP password, however,
    you can reconfigure it using the PAP password.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Some hard drives are available that can be configured to demand passwords.
    This password is needed before you start using the drive. You won''t be able to
    use the drive unless you provide the password. However, this ensures that the
    data on the drive is untouched because no one other than the person with the password
    can get access the files on the drive.


    The account security can be implemented for three categories of users. These are
    as follows:


    +   - Root accounts

    - Guest accounts

    - User accounts


    I will now discuss each of these categories in detail.


    # Root Accounts


    Root users are the most powerful users in Linux systems. They have the rights
    to perform all the administrative tasks. This means that you need to be careful
    when you assign root accounts to users and also when you are logged in a root
    user yourself. It is easiest to track changes and security violations when very
    few people have root account access. Here are some guidelines regarding root account
    security:


    +   - The passwords to the root accounts should be very strong. They should be
    known only to trusted users.

    - You should log on to the root shell only when it is a must. Log out of the root
    shell as soon as you finish your work.

    - Only the root should be assigned UID 0.

    - The non-root accounts should not have any write permissions in the root directory.

    - The temporary files of the root account should be in directories that provide
    read and write access to other accounts.


    You should always log out of the root shell immediately after performing the rootspecific
    tasks. You should be extremely careful while you are in the root shell. Even a
    small mistake made by root users could be disastrous for the whole system. The
    less time you are on with root privileges, the safer your system will be. Several
    tricks to avoid compromising your Linux system when logged in as root as follows:'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Chapter 2 LINUX SECURITY: AN OVERVIEW


    +   - When in doubt about the usage of a particular command that can damage your
    system, get the complete information about the command from the manual page. If
    possible, run the commands with the options that will not damage your system.


    +   - Even if you have the privilege of a root user, you should log on to the
    root account only when it is required. For example, you need to perform some administrative
    tasks. While performing the routine tasks, if possible, you should log on as a
    normal user. The su command can be used to temporarily switch to the root account.
    You need to provide the root login name and root password while using the su command.
    The syntax of the su command is shown here:


    ```

    su [option]...[user] [arg]...

    ```


    # NOTE


    If no user is specified, the default user is root.


    +   - The root users shouldn''t use the rex tools. These are the prime targets
    of the hackers. The root users also shouldn''t have the .hosts file created for
    themselves.


    +   - The terminals from where the root users can log on are listed in the security
    file. You shouldn''t modify the content of this file.


    # SUDO


    sudo can be used to provide users root access to the Linux system. However, the
    root access provided to them is restricted depending upon their requirements.
    The disadvantage of sudo is that you can perform only limited tasks. For example,
    mounting and removing various media on your system, restarting a server, and adding
    new users. sudo prompts you for a password before allowing root access. In addition,
    a program such as /bin/cat can be used to overwrite files. This could allow root
    to be exploited. Therefore, sudo can be considered as a means for accountability.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# ACCOUNT SECURITY


    # Chapter 35


    # Guest Accounts


    The guest accounts are created for temporary users and for users who are not regular
    users of your networks. However, the users should be the trusted ones. You should
    monitor these accounts regularly. Delete any guest accounts no longer in use.
    You can also set an expiration period for guest accounts. In addition, you can
    configure the password of guest accounts to expire after a specified period. The
    password assigned to the guest accounts should be strong.


    # User Accounts


    Here are some guidelines for working with user accounts:


    +   - Do not share the user accounts.

    - Accounts no longer in use should be deleted. In addition, you should consider
    disabling login to well-known accounts. These accounts do not require interactive
    login.

    - Assign strong passwords to the accounts in your network.

    - The non-regular users, such as the guest accounts, should have restricted shell.


    User accounts should be provided with the minimal required privileges. These privileges
    should be sufficient to enable the user to perform all the required tasks. Here
    are some precautions you should take:


    +   - The permissions and rights should be assigned carefully.

    - Identify the time and place from which the user needs to logon.

    - Use a standard pattern for assigning usernames in your network. This helps in
    management tasks.

    - You shouldn''t create a common user account for several users in your network.
    This creates problems with accountability.


    Here are some guidelines for monitoring and ensuring user accounts security:


    +   - You should regularly maintain the logs of activities in your system and
    network. Analyze the log periodically.

    - Create a backup policy to backup up the critical data at regular intervals.
    The back up copies should be stored at safe locations.'
  merge: -1
  img_proc: true
- pgno: 63
