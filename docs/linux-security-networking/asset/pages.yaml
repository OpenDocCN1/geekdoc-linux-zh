    # The Action Directive


    The Action directive is used to specify an action. This activates a CGI script
    when a request from the client triggers an action-type. The CGI script is a URL
    path. This path points to a resource that is configured as a CGI script:


    +   # Action lets you define media types that will execute a script whenever a
    matching file is called. This eliminates the need for repeated URL

    # filenames for oft-used CGI file processors.

    # Format: Action media/type /cgi-script/location

    # Format: Action handler-name /cgi-script/location


    By default, the Action directive is commented.


