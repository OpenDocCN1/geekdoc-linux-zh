  md: '# Virtual Host Configuration Options


    All other hosts that you can configure on your Apache server, apart from the main
    server, are virtual hosts. There are various advantages to using virtual hosts.
    One major benefit is the ability to host more than one Web site, with separate
    domain names, on a single Apache server. The directives in this category are as
    follows:


    +   * <VirtualHost>

    * NameVirtualHost

    * ServerName

    * ServerAlias

    * ServerPath


    # Apache Modules


    Apache has a modular architecture. Various modules are available to implement
    different functions of the Apache server. You can customize the Apache server
    according to your requirements, by using the modules. One of the biggest advantages
    of Apache, over other Web servers, is that it is easy to write powerful modules
    for Apache.


    Apache has used modules since version 1.0 to implement its functions. Modules
    need to have access to every stage of serving a client request because Apache
    itself uses modules for everything. Some of the useful modules provided with Apache
    are listed here:


    +   * mod_dir. This module enables slash redirection and serving directory index
    files. A slash redirection is issued when the server receives a request for a
    URL.


    +   * mod_autoindex. This module enables automatically indexing of directories.


    +   * mod_access. This module can be used to perform access control over clients.
    The directives provided by mod_access are used in <Directory>, <Files>, <Location>
    sections, and .htaccess files to control access to particular parts of the server.


    +   * mod_auth. This module enables user authentication using the text files.
    The text files contain the text password.'
  merge: -1
