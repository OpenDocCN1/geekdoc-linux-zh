- pgno: 288
  md: '# APACHE MODULES Chapter 8 261


    +   - mod_auth_dbm. This module enables user authentication based on the DBM files.
    The DBM files contain the username and the password.

    - mod_auth_db. This module enables user authentication based on the Berkeley DB
    files.

    - mod_auth_anon. This module enables anonymous to access the restricted data.
    In addition, it allows access to a user having the anonymous username and the
    email address as a password.

    - mod_auth_digest. This module enables user authentication based on the MD5 Digest
    Authentication.

    - mod_headers. This module enables you to customize the HTTP response.

    - mod_expires. This module enables generation of Expires HTTP headers. The HTTP
    header is generated according to the user-specified criteria. The Expires HTTP
    header is an instruction to the client about the document''s validity and persistence.

    - mod_asis. This module enables you to send files containing their own HTTP headers.
    This module enables as-is handler that causes Apache to send the files.

    - mod_cgi. This module enables execution of CGI scripts. Any file that has the
    MIME type application/x-httpd-cgi or the cgi-script handler is treated as a CGI
    script and is run by the server.

    - mod_actions. This module enables you to execute CGI scripts that are based on
    media type or request method. This module has two directives Action and Script.
    The Action directive enables you to run CGI scripts whenever a file of a specific
    type is requested. The Script directive enables you to run CGI scripts whenever
    a particular method is used in a request.

    - mod_status. This module provides information on server status and performance.
    The Status module allows an administrator to analyze the performance of the server.

    - mod_log_config. This module enables logging of requests that are made to the
    server.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Virtual Hosts


    Apache enables you to run virtual hosts. On a single server, you might need to
    run multiple Web services, each with different host names and URLs, which appear
    to be completely separate sites. Virtual hosts enable you to do this. Virtual
    hosts are used to host multiple sites. There are two types of virtual hosts:


    +   * IP-based

    * Name-based


    # IP-based Virtual Hosts


    In IP-based virtual hosts, each virtual host has its own IP address. Some operating
    systems allow you to provide multiple IP addresses to a single Ethernet by using
    the ifconfig command.


    After selecting the IP address, you should update the DNS so that browsers convert
    the hostname to the corresponding address. The entry you need to add to the DNS
    is an address record pointing to the appropriate IP address. After you have updated
    the DNS, you will need to configure Apache to respond differently to the different
    addresses. There are two ways of telling Apache which addresses and ports to listen
    to:


    +   * Use the BindAddress directive to specify a single address or port.

    * Use the Listen directive to specify any number of specific addresses or ports.


    For example, if you run your main server on IP address 172.17.2.3 port 80 and
    a virtual host on IP 172.17.2.4 port 8000, you can use the Listen directives as
    follows:


    ```

    Listen 172.17.2.3:80

    Listen 172.17.2.4:8000

    ```


    # Configuring the Virtual Hosts


    Next, you need to configure the server so that it responds differently to the
    requests from the different IP addresses, which you have configured.This is done
    using <VirtualHost> sections in the httpd.conf file.'
  merge: -1
  img_proc: true
- pgno: 290
  md: "A sample of the virtual host configuration is given here:\n\n```\n<VirtualHost\
    \ 172.17.0.0>\nDocumentRoot /www/vhost1\nServerName www.mywebsite.com\n</VirtualHost>\n\
    ```\n\nThe preceding entries should be placed in the httpd.conf file. You need\
    \ to replace\nt IP number with the required IP address.\n\nIf you do not specify\
    \ the <VirtualHost> section in the configuration files, Apache\n process requests\
    \ from different addresses and ports identically, as per the\ndefault settings.\
    \ The default behavior for processing the request is specified in the\nmain server\
    \ configuration section of the httpd.conf file. All virtual hosts inherit\nthe\
    \ main server behavior unless you override it.\n\nApache finds a virtual host\
    \ by using the target IP address and port information\nwhenever a request arrives.\
    \ If the matching host is found, Apache handles the\nrequest as per the virtual\
    \ host configuration. If no matching virtual host is found,\nthe request is processed\
    \ according to the main server configuration.\n\n# Name-based Virtual Hosts\n\n\
    Name-based virtual hosts are configured in a manner very similar to IP-based\n\
    virtual hosts. The IP address that the requests reach is specified in the\n<VirtualHost>\
    \ directive and the host name is specified in the ServerName direc-\ntive. There\
    \ will usually be more than one <virtualHost> section handling the same\nIP address.\
    \ To tell Apache whether name-based requests are supposed to arrive onna particular\
    \ IP address, the NameVirtual directive is used. The ServerAlias\ndirective enables\
    \ a virtual host to handle multiple non-IP host names.\n\nThe VirtualHost directive\
    \ in the configuration file is used to set the values\nof ServerAdmin, ServerName,\
    \ DocumentRoot, ErrorLog and TransferLog, or\nCustomLog, configuration directives\
    \ to different values for each virtual host:\n\n```\n<VirtualHost www.premierpressbooks.com>\n\
    ServerAdmin webmaster@email.com. premierpressbooks.com\nDocumentRoot /groups/\
    \ premierpressbooks /www\nServerName www.premierpressbooks.com\nErrorLog /groups/\
    \ premierpressbooks /logs/error_log\n```"
  merge: -1
  img_proc: true
- pgno: 291
  md: '# 264 Chapter 8 APACHE WEB SERVER


    ```

    TransferLog /groups/ premierpressbooks /logs/access_log

    </VirtualHost>

    ```


    ```

    <VirtualHost www. premierpress.org>

    ServerAdmin webmaster@mail. abc.org

    DocumentRoot /groups/ premierpress /www

    ServerName www. premierpress.org

    ErrorLog /groups/ premierpress /logs/error_log

    TransferLog /groups/ premierpress /logs/access_log

    </VirtualHost>

    ```


    You can include almost any configuration directive in use the VirtualHost directive.
    Exceptions are the directives that control process creation, and a few other directives.


    # CAUTION


    When specifying where to write log files, you should be aware of some security
    risks. If the directory where the log files are written is made available to users
    other than the user who starts Apache, security problems can be posed.


    You must designate the IP address on the server that accepts requests for the
    hosts. This is configured using the NameVirtualHost directive. In cases where
    any IP addresses on the server can be used, you can use * as the argument to the
    NameVirtualHost directive. For example, consider that both www.premierpress.tld
    and www.premierpressbooks.tld point to an IP address that the server is listening
    to. You should then add the following entry to http:


    ```

    NameVirtualHost *

    <VirtualHost *>

    ServerName www. premierpress.tld

    DocumentRoot /www/ premierpress

    </VirtualHost>

    <VirtualHost *>

    ServerName www. premierpressbooks.tld

    DocumentRoot /www/ premierpressbooks

    </VirtualHost>

    ```'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# DIRECTORY ACCESS CONTROL Chapter 8 265


    When a request arrives, the server first checks whether it is using an IP address
    that matches the NameVirtualHost directive. If it is, the server looks at each
    <VirtualHost> section with a matching IP address and tries to find a <VirtualHost>
    section where the ServerName or ServerAlias matches the requested hostname.


    If the server finds a matching <VirtualHost> section, it uses the configuration
    for that server. The first listed virtual host is the default virtual host. The
    DocumentRoot directive from the main server will never be used when an IP address
    matches the NameVirtualHost directive. If you would like to have a special configuration
    for requests that do not match any particular virtual host, simply put that configuration
    in a <VirtualHost> container, and list it first in the configuration file.


    # Directory Access Control


    Apache enables you to control access to the directories. You can use the <Directory>
    directive to control the access to the directories, as shown here:


    ```

    <Directory "/var/www/html">

    AllowOverride None

    Options None

    </Directory>

    ```


    The advantage of the <Directory> directive is that you do not need to worry about
    a user being able to change the settings. No user except the administrator can
    modify the server configuration files. However, it has a disadvantage that you
    need to restart Apache every time the config file is changed. Also, adding all
    the <Directory> containers can be tedious.


    # .htaccess File


    You can use an alternative to overcome the disadvantages of the <Directory> directive.
    You can use the config file, .htaccess, in each directory with special requirements.
    An .htaccess file is a text file containing Apache directives. These directives
    are applicable to the files and subdirectories in the parent directory of the
    .htaccess file. However, if the subdirectories contain the .htaccess file, the
    settings in the .htaccess file of the subdirectories are effective in the subdirectory.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 266 Chapter 8 APACHE WEB SERVER


    The AccessFileName directive enables you to change the name of the config files.

    For example,


    AccessFileName my.htaccess


    The preceding statement will cause Apache to look for files named my.htaccess,

    instead of .htaccess. However, this file will serve the same purpose as .htaccess.


    A sample authentication page can be seen in Figure 8-1:


    ![](img/a46d40e435b42e09209eb0761898e63c_293_0.png)


    FIGURE 8-1 An example of an .htaccess file based authentication dialog box.


    # Working of .htaccess


    If the requested resource is a file on the disk, it performs an internal process
    ofirectory walk. Using directory walk, Apache checks its internal list of <Directory>

    containers. It might also search the directories on the file system for .htaccess

    files. Directories are included in the settings whenever a set of directives applicable
    to the request is found during directory walk. Therefore, you get a collection

    of settings that apply to the final document.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# DIRECTORY ACCESS CONTROL Chapter 8 267


    .htaccess files are evaluated for each request, so you don''t need to reload the
    Apache server whenever you make a change. If there''s a syntax error in an .htaccess
    file, only a portion of the server''s Web space is affected.


    # Directives in .htaccess File


    Apache directives fall into seven different categories, all of which can appear
    in the config files. However, only five of the categories can be used in .htaccess
    files. For Apache to only accept a directive in a per-directory file, the settings
    for the directory must permit the directive''s category to be overridden. The
    five categories of directives that can be used in .htaccess files are as follows:


    +   * AuthConfig. These directives can be used to control directives that deal
    with Web page security, such as the AuthName, Satisfy, and Require directives.


    +   * FileInfo. These directives control how files are processed.


    +   * Indexes. These directives affect file listings.


    +   * Limit. These directives are related to security.


    +   * Options. These directives support miscellaneous options, such as ContentDigest
    and XBitHack.


    A special directive, AllowOverride, specifies the category to be overridden in
    a directory tree. This directive is usable only in the server-side configuration
    files. The AllowOverride directive accepts the following categories:


    +   * All. This lists all categories. The two statements below are equivalent:

    AllowOverride AuthConfig FileInfo Indexes Limits Options

    AllowOverride All


    +   * None. This keyword disables the processing of .htaccess files for a specified
    directory and its subdirectories. Once this keyword is specified, Apache won''t
    search for the .htaccess files.


    These are the two main disadvantages of using .htaccess:


    +   * Effect on the performance

    * Extending control access to other users


    Performance degradation can be managed through judicious use of the AllowOverride
    directive. This is a matter of establishing trust and performing risk assessment.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# Chapter 8 APACHE WEB SERVER


    Content of a sample .htaccess file is given here:


    ```

    UserFile /Directory1/.htpasswd

    AuthGroupFile /dev/null

    AuthName "Group is null"

    AuthType Basic

    ```


    ```

    <Limit GET>

    require valid-user

    </Limit>

    ```


    In the preceding sample, AuthGroupFile is null. This directive is used if you
    have multiple users. AuthName''s text is displayed to users when they are prompted
    for a password. The AuthType directive indicates that Basic authentication will
    be used.


    The password file, .htpasswd, is located in the UserFile directive. This file
    contains a list of usernames and passwords. Remember that there is no relation
    between the username and password of your Linux system and the username and password
    used for the authentication schemes. You can create the .htpasswd file by using
    the htpasswd command. The syntax of the htpasswd command is as follows:


    ```

    htpasswd -c .htpasswd [username]

    ```


    A sample output of a failed authentication request is shown in Figure 8-2.


    ![](img/a46d40e435b42e09209eb0761898e63c_295_0.png)


    FIGURE 8-2 An example of an .htaccess-based authentication failure.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# DIRECTORY ACCESS CONTROL Chapter 8 269


    # Digest Authentication


    Two modules provide Digest authentication in Apache:


    +   - mod_digest. This module enables user authentication by using MD5 authentication.


    +   - mod_auth_digest. This module also enables user authentication by using MD5
    authentication. However, it provides more features and is more secure than mod_digest.


    Here is an example of a Location directive specifying a URL that is protected
    with digest authentication:


    ```

    <Location /MyDirectory/>

    AuthType Digest

    AuthName "MyDirectory Authenticated"

    AuthDigestDomain /MyDirectory/ /protected/

    AuthDigestFile /web/auth/.password.md5

    Require group WebAdmin

    </Location>

    ```


    # CGI Security


    The Common Gateway Interface (CGI) acts as an interface between external applications
    and Web servers. A CGI program is executed on the server during the runtime. The
    server sends the output to the client.


    CGI programs are executed on the servers, and the output of the program depends
    on the input and request from the client, you need to be careful about the security
    of the system. You shouldn''t let a request pass through that demands to execute
    a CGI program in a manner that will damage your system.


    With every transaction, various components are involved. Some of these components
    are listed here:


    +   - The client who sends the requests


    +   - The request sent by the client


    +   - The CGI script


    +   - The database, if required'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Chapter 8 APACHE WEB SERVER


    There are two types of security risks involved in using CGI:


    +   - At times


    Some of the measures you should take to ensure CGI security are:


    +   - Ensure that the CGI script has the required permissions. You do so with
    the chmod command.

    - You can place the CGI script inside a wrapper script. Wrappers are capable of
    performing some critical tasks, such as performing checks on a script and changing
    the ownership of the CGI prints.

    - You should check thoroughly all elements of the FORM that is submitted to the
    CGI program. You should also check the content submitted to the CGI script through
    the FORM. Checking the content becomes more critical if you use information from
    the FORM as arguments to a command, which is executed on the server.

    - You should restrict access to the script to a certain IP address or user-name.
    You can ensure that the HTTP_REFERER environmental variable is set to either the
    server name or the server name from where the CGI script is accessible. The HTTP_REFERER
    variable is not always set and it can be forged. Therefore, you should not rely
    on it for all your security needs.


    # The cgi-bin Directory


    CGI scripts usually are stored in the cgi-bin directory. Storing the CGI scripts
    in a central location is more secure and convenient, because you need to apply
    restrictions only to one directory. You should restrict the accessibility to the
    cgi-bin directory to only those users who need the information.


    The CGI scripts are stored in a file with the extension *.cgi. You should configure
    the Apache server in such a way that it will not accept any request for documents
    other than the *.cgi files. You should not leave any important file in the cgi-bin
    directory.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# SECURING APACHE SERVER


    Chapter 8


    # CGI Applications versus CGI Scripts


    CGI applications are binary executable programs that have been compiled using
    a compiler. These programs are executable from the command line and have execution
    permissions. CGI programs are less dependent on Apache and its modules. Such programs
    can be either dynamic applications that require other external libraries for execution
    or huge static applications that have all the required libraries embedded in them.


    CGI applications have a disadvantage in that sometimes the applications can become
    unstable after the system goes through a library upgrade. Static CGI applications
    are invulnerable to this problem. However, there''s another problem with static
    CGI applications: because all the required libraries are embedded in static CGI
    applications, such CGI programs can grow to a huge size after compilation.


    CGI scripts are program source codes that do exactly the same job as a CGI application.
    The only difference is that CGI applications are compiled programs, whereas CGI
    scripts are source codes of the program. The CGI scripts are compiled every time
    they are called. CGI scripts are easier to manage, as compared to CGI applications.
    CGI scripts have a security risk in that if the file permissions are not set correctly,
    a malicious user can download the script and scan the source code of the file
    to obtain sensitive data, such as passwords, names of directories, and so on.


    # Securing Apache Server


    You should ensure that the non-root users aren''t able to modify Apache. Only
    the root users should have write permissions. The files, directories, and parents
    of the directories must be writable only by the root user. You also should protect
    the httpd executable in a similar manner. You should prevent users from modifying
    .htaccess files, which can override security features. Here''s one way to do it.


    In the server configuration file, make the following entry:


    ```

    <Directory>

    AllowOverride None

    </Directory>

    ```'
  merge: -1
  img_proc: true
- pgno: 299
  md: "# 272 Chapter 8 APACHE WEB SERVER\n\nThis will prevent the use of .htaccess\
    \ files in all directories, apart from those specifically enabled.\n\n# Securing\
