  md: '# runlevel


    The runlevel command is used to find the current and previous system runlevel.
    Runlevels are stages when various features and services become available in Linux.
    This command first reads the system utmp file to locate the runlevel record


    runlevel


    # init


    You use the init command to change the runlevels in Linux. Information about the
    runlevel settings can be found in the /etc/inittab file. An abstraction of this
    file is given here:


    +   # Default runlevel. The runlevels used by RHS are:

    # 0 - halt (Do NOT set initdefault to this)

    # 1 - Single user mode

    # 2 - Multiuser, without NFS. This is same as runlevel 3, if your computer is
    not connected to a network.

    # 3 - Full multiuser mode

    # 4 - unused

    # 5 - X11

    # 6 - reboot (Do NOT set initdefault to this)


    ```

    id:5:initdefault:

    # System initialization.

    si::sysinit:/etc/rc.d/rc.sysinit

    # Things to run in every runlevel.

    ud::once:/sbin/update

    # Trap CTRL-ALT-DELETE

    ca::ctrlaltdel:/sbin/shutdown -t3 -r now

    # When our UPS tells us power has failed, assume we have a few minutes left.

    # of power left. Schedule a shutdown for 2 minutes from now.

    # This does, of course, assume you have powered installed and your

    # UPS connected and working correctly.

    p::powerfail:/sbin/shutdown -f -h2 "Power Failure; System Shutting Down

    ```'
