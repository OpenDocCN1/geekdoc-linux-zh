- pgno: 229
  md: '# 202 Chapter 7 NETWORK ATTACKS


    A DoS attack can do the following damage:


    +   * Flood network and block legitimate network traffic

    * Disrupt communication between two computers and prevent everyone from accessing
    a service

    * Prevent an authorized user from accessing a service on the computer

    * Choke all services on a specific system


    Denial of service attacks are simple to implement and can be very effective. An
    attacker tries to choke a service by giving it more tasks than it can handle.
    For example, if you have a Web server capable of accepting or publishing 5,000
    pages per second, a DoS attack might send 50,000 fake requests. This means that
    many genuine page view requests would be denied permission to an overloaded server.
    The server might even stop responding and freeze. Typically, DoS attacks are targeted
    at easily accessible targets, such as HTTP servers, routers, or network gateways.


    DoS service attacks have been successfully used against some bandwidth-abundant
    network servers, such as Yahoo and MSN. The attacks caused the servers to stop
    their services for a short period of time. A well-planned DoS attack can bring
    down the most resource-abundant servers on the Internet.


    A DoS attack can be used in combination with Trojans to multiply the attack strength.
    An attacker can arrange a group of Trojan computers to attack the victim. The
    underlying statement in DoS attacks is that the actual request is sent to the
    victim computer by the offender is a common request, but the number of requests
    is so high that the server cannot easily differentiate between attack requests
    and genuine user requests resulting in Denial of Service.


    A more dangerous aspect of a DoS attack is that the attacker needs to send a very
    small amount of data. This data gets so amplified by the time it reaches the computer
    that even a high-end bandwidth server cannot handle it. This kind of DoS uses
    Internet Address spoofing along with other techniques.


    DoS attacks can be precisely targeted at particular services on a network. To
    make DoS attacks effective, the nonrenewable or scarce resources of a computer
    might be identified and targeted. DoS attacks can be classified into three categories,
    based upon their targets:'
