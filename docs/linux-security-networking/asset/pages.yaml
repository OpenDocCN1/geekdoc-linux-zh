    +   * The strong dependency between its packages ensures consistency in upgrades.


    Debian includes over 3,950 packages. The Debian GNU/Linux distribution is the
    primary product of the Debian project. The distribution contains kernel and various
    pre-packaged software applications. The Debian distribution supports multiple
    processor types, such as Intel i386 and above, PowerPC, IBM S/390, Sparc, and
    Hitachi.


    Debian motivated the formation of Software in the Public Interest, Inc. (SPI),
    which is a New York-based, non-profit organization. SPI helps companies in development
