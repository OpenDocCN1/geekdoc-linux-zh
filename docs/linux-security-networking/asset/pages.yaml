    | -label | Specifies some information about the backup set into the archive file
    itself. |


    I will now discuss some examples to help you understand the usage of the tar command.
    Consider the following command:


    ```

    tar -cvpf /dev/tape /

    ```


    The preceding command creates a new archive in the tape drive called /dev/tape
    and copies the entire root file system into it, provided the size of the file
    system is less than the tape''s capacity. The switch and modifiers specified create
    a new archive file, list the files while archiving, preserve file permissions,
    and allow you to specify the archive media device name.


    The following command restores an entire file system from an archive:


    ```

    tar -xvpf /dev/nst /

    ```


    The preceding command restores all files because no specific file is indicated
    for restoring. If you want to restore the specific file /usr/moo1/myfile, issue
    the following command:


    ```

    tar -xvpf /dev/nst /usr/moo1/myfile

    ```


    The following command can perform a backup of your entire Linux system on the
    /archive file system, excluding the /proc pseudo-file system, any mounted file
    systems in /mnt, /archive file system, and Squid''s rather large cache files (these
    files are not required to back up):


    ```

    tar -cvpf /archive/backup_date ''%Y-%m-%d'' -directory / -exclude=mnt exclude=proc
    exclude=/archive exclude=/var/pool/squid

    ```


    Apart from the familiar switch and modifiers, the preceding command specifies
    the name of the archive in which the current directory is derived by encoding
    the command in reverse quotes. .tar is the common naming convention for tar files.
    Notice how the-directory option is used to switch the current directory to'
