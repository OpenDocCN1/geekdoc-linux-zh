    * Selecting the type of keyboard

    * Installing boot loader

    * Partitioning disks

    * Creating file systems

    * Selecting Mouse

    * Configuring X window server

    * Selecting time zone

    * Selecting the packages


    If you have installed Linux, you know that these steps are essentially the most
    important steps involved in the manual installation of a RedHat Linux system.
    Kickstart enables you to script the installation process by specifying the install-ation
    information in a configuration file.


    After completing the installation process, you can specify a list of shell-level
    commands, which will be executed by Kickstart. You can also automatically install
    extra software that is not distributed as part of RedHat Linux and carry out other
    tasks that you might need to do to get a fully operational system.


    There are two approaches to Kickstart installation:


    +   * The first approach is to copy the configuration file of the Linux to a RedHat
    boot floppy.

    * The second approach is to use a regular boot floppy to boot the com-puter. After
    doing that, you can obtain the config file for Kickstart from the network.


    These two approaches are meant for different types of networks. For a network
    with a DHCP server, no individual IP addresses needs to be defined in the Kick-start
    configuration files. Therefore, if a network has a DHCP server, the Kickstart
    boot floppy can contain the config file. If each computer on the network has to'
