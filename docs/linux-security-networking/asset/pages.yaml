  md: '# Chapter 10 LINUX NETWORK DEFENSE AND INTRUSION DETECTION


    +   * Version (16 bit). This field specifies the SSL version protocol.

    * Length (16 bit). This field specifies the record data length.


    # SSL Record Data


    The record data part of the SSL record contains the actual data that will be trans-mitted
    through SSL. Before being transmitted, the record data passes through four stages:


    +   * Fragmentation

    * Compression

    * Applying MAC

    * Encryption


    # Fragmentation


    The data is first fragmented into small pieces. In this phase, the data is frag-mented
    into SSLPlaintext records of 2^14 bytes or less.


    # Compression


    In this phase, the compression algorithm defined in the handshake stage com-presses
    the given SSLPlaintext. No data is lost during compression. The resultant compressed
    data is SSLCompressed. The SSLCompressed length must not exceed 2^14 + 1024.


    # Applying MAC


    In this phase, a MAC is attached to the SSLCompressed data. MAC is an authen-tication
    tag or checksum obtained by applying an authentication scheme to the data. MACs
    can be generated and verified by using the same key. Therefore, it is ensured
    that only the intended recipient can verify MAC. The hash algorithm used to compute
    the MAC is derived from the cipher suite. SSL supports two hash function algorithms:


    +   * MD5, a 128-bit hash

    * SHA, a 160-bit hash'
  merge: -1
