    # Packet Sniffers


    Intruders can easily gain access to the hosts on your computer by using a packet
    sniffer on a compromised host. The packet sniffers listen on the Ethernet port
    for information such as password and login in the packet stream. The packet sniffer
    creates a log of the traffic on the network. Therefore, critical information like
    passwords are logged by the packet sniffers. Intruders can use these logs to gain
    entry into your system. You can avoid this by encrypting passwords with methods
    such as SSH. If you are using syslog to send your data to a central log server,
    consider using a secure implementation of syslog, which encrypts and compresses
    data before it is sent.


