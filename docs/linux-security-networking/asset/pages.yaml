    # # Summary


    The utility of a server is directly proportional to the number of features available
    on it. Unfortunately, the vulnerability of a machine also is directly proportional
    to the number of features that a server provides to its legitimate users. In this
    chapter, you learned about the various vulnerabilities that exist in modern networks.
    You also learned how small loopholes in basic network protocols can be exploited
    to create havoc in platforms that are presumably very secure. Network attack tools
    are becoming exceptionally organized and intelligent. In today''s potentially
    hostile networking environment, certain measures can be taken to make an intruder''s
    task very difficult.


    In Chapter 10, “Linux Network Defense and Intrusion Detection,” I discuss network
    defense strategies, security policies, firewalls, and various other tools that
    can assist administrators in preventing attacks and recovering a network when
    it is under attack.'
