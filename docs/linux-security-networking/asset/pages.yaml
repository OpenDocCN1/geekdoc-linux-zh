  md: '# RedHat Package Manager


    The RedHat Package Manager (rpm) is a powerful and flexible package manager. You
    can use rpm to build, install, query, verify, update, and uninstall various packages.
    A package consists of an archive of files. The package also contains other information,
    such as name, version, release, and description of the package. The syntax for
    rpm to install a package is shown here:


    ```

    rpm -i [install_options] <package_file>

    ```


    The syntax to upgrade a package by using rpm is as follows:


    ```

    rpm -u [install_options] <package_file>

    ```


    The preceding command will upgrade a package already installed on the computer.
    When the command is executed, the previous versions of the package are removed
    from the computer. The <package_file> in the preceding command can be specified
    as an FTP server or an HTTP URL. The package will be downloaded from the specified
    location before installation starts.


    You can obtain information about a package by using the -q option of the rpm command:


    ```

    rpm -q [query_options]

    ```


    The format in which the packet will be printed can be specified.


    You also can verify a package by using the rpm manager. The rpm manager verifies
    a package by comparing the details of the already installed package with the original
    package stored in the rpm manager. Packages are also verified by comparing the
    size, MD5 sum, permissions, type, owner, and group of each file. The syntax for
    rpm command to verify a package is as follows:


    ```

    rpm -V -Y --verify [verify-options]

    ```


    The general form of an rpm signature check command is shown here:


    ```

    rpm --checksig <package_file>

    ```


    The preceding command will check the PGP signature of package <package_file> to
    ensure its integrity and origin. PGP configuration information'
  merge: -1
  img_proc: true
