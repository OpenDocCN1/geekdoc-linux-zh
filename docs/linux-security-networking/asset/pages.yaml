    Most genuine ping interfaces will not allow packets over 64Kb to be sent. However,
    because writing an ICMP client interface is not difficult, you can find numerous
    malicious implementations of the ping interface on the Internet.


    # NOTE


    RFC-791 defines the structure of an IP packet. According to these definitions,
    a unit IP packet cannot exceed the size of 65,535 bytes (that is, 2^16-1). This
    is the maximum packet size and is inclusive of header information. The header
    has a default length of 20 bytes when no special parameters are used to alter
    the packet. Packets that are bigger than the maximum size must be broken down
    into smaller chunks and later on assembled into the original form. For Ethernet
    devices, the MTU is typically 1,500.


    An ICMP ECHO request is encapsulated within an IP packet and it contains 8-byte
    header information. Therefore, the structure of an IP packet that encapsulates
    the ICMP ECHO request can be broken down as follows:


    +   - 20-bytes IP header

    - 8-bytes ICMP ECHO header

    - xx-bytes data in the ping packet


    The sum of these packet components cannot exceed 65,535 bytes. Therefore essentially,
    the ping packet size (excluding the header) can''t be more than 65,507 bytes.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Chapter 7 NETWORK ATTACKS


    As already discussed, it is possible to send larger packets using the fragmentation
    abilities of intermediate computers. The fragmentation concept relies on an offset
    value in each fragment to determine the position of each fragment at the time
    of reassembly. Therefore, it is possible to combine an offset with an appropriate
    fragment size so that the sum of the offset and the size becomes greater than
    64Kb on the last fragment. The recipient computer can''t start reassembling a
    packet until all its fragments have been received. This creates the possibility
    of an overflow of 16-bit internal variables in recipient computers, which can
    lead to system crashes, reboots, kernel panics, and so on.


    An interesting thing to note is that ping is not the only program that uses arguably.
    The root cause lies in the basic low-level IP protocol and, therefore, can be
    exploited by any service that can send an IP packet. A few examples of such services
    are TCP, UDP, Telnet, HTTP, and so. To put it clearly, any port listens to your
    server is open to such an attack. Even those ports that are not listened to are
    vulnerable!


    Blocking the ping program or somehow disabling ICMP cannot bring a solution to
    the above problem. The correct solution would be applying an available patch to
    your kernel if it hasn''t been already patched.


    To determine whether your system is vulnerable, you can ping your computer. If
    you computer reboots, hangs, or displays a “kernel panic” you should find a patch
    immediately. If a patch is not available yet, which is highly unlikely, you can
    consider blocking fragmented pings. This will allow your common 64-byte ping to
    work while blocking all pings bigger than the MTU of your link.


    # Smurf DoS Attack


    The “Smurf attack” is a more recent type in the category of network-level attacks
    against hosts. Smurf denial-of-service attacks use fabricated ICMP ECHO packets
    and direct them to IP broadcast addresses.


    As already discussed, ICMP is used to provide feedback on errors to the sender
    computer. You can use ICMP to determine the functionality of a computer on the
    network. The ICMP ECHO requests are sent to the remote computer. On receipt of
    the request packets, the remote computer sends back the ICMP reply packets. I
    have already discussed an implementation of this mechanism in the ping application.
    You can send a packet to a single computer or broadcast it to the computers in
    a network. If you send a packet from a computer within a local network and is
    addressed to the IP broadcast address of a network, the packet'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# TYPES OF ATTACKS


    Chapter 7 213


    delivered to all computers on the network. On the other hand, if the packet is
    sent from a computer outside the local network, the packet is broadcasted to all
    computers on the network.


    A network broadcast address sets the destination to the network part and fills
    each position of the host part of the address with a binary 1. For example, the
    IP broadcast address for the network 10.0.0.0 is 10.255.255.255. If your network
    has a class A subnet of 256 subnets, the IP broadcast address for the 10.50 subnet
    would be 10.50.255.255. A broadcast response also can be generated from network
    addresses with all zeros in the host portion, such as 10.50.0.0.


    # Table 7-1: Examples of Determining Broadcast IP for Networks


    | IP Address | Subnet Mask | Network Number | Host Network | Broadcast Address
    |

    |---|---|---|---|-|

    | 9.9.9/10 | 255.0.0.0 | 9.0.0.0 | 9.9.9 | 9.255.255.255 |

    | 179.133.7/10/24 | 255.255.255 | 179.133.7 | 10 | 179.133.7.255 |

    | 119.6.255.2/16 | 255.255.0.0 | 119.6.0.0 | 255.2 | 119.6.255.255 |


    A smurf attack sends an ICMP ECHO request packet to the IP broadcast addresses
    of various networks to increase the impact of the strike on the victim computer.
    The offensive computer generally sends these packets from outside intermediate
    networks. There are three bodies involved in smurf attack: the offensive computer
    or the attacker, intermediate networks, and the target victim. The attack propagates
    in such a way that sometimes the intermediate networks not targeted by the attacker
    become partial victims of the attack.


    The attack progress can be broken down as follows:


    +   * STEP 1. The attacker sends an ICMP ECHO request to an IP broadcast address
    of a network (the intermediate network). This ICMP ECHO request apparently has
    a source IP address of the target victim.

    * STEP 2. All computers on the network receive this ICMP request.

    * STEP 3. On receiving this request, each computer on the network generates an
    ICMP ECHO reply response and sends it to the source IP address.'
  merge: -1
  img_proc: true
