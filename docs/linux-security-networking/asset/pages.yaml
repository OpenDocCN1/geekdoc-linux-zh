- pgno: 267
  md: '# Main Server Configuration Options


    The default Apache Web server is the main server. The Main server configuration
    section consists of all the directives that are used to define the parameters
    used by the main server.


    # The Port Directive


    The Port directive is used to specify the port number on which Apache will listen
    to client requests:


    ```

    # Port: The port to which the standalone server listens.

    # ports < 1023, you will need httpd to be run as root initially.

    #

    ```


    You can view the port allocation in the /etc/services file in a Red Hat Linux
    system. Keep the following points in mind while configuring the Port directive:


    +   - The server will listen to the port number specified in the Port directive,
    but only when a port number is not specified in the Listen or BindAddress directives.


    +   - The Port directive is used to set the environment variable named SERVER_PORT.
    This environment variable is used for Common Gateway Interface (CGI) and Server
    Side Includes (SSI).


    +   - Sometimes, you will want to use SSL for secure transmission of data. In
    this case, you will need to specify port number that will be used by Secure Hypertext
    Transfer Protocol (HTTPS). This port number is ideally 443 and is specified with
    the Listen directive as shown here:


    ```

    ## When we also provide SSL, we have to listen to the

    ## standard HTTP port (see above) and to the HTTPS port

    ##

    <IfDefine HAVE_SSL>

    Listen 80

    Listen 443

    </IfDefine>

    ```


    The <IfDefine> and </IfDefine> directives are used to check whether SSL support
    is required.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# THE HTTPD.CONF FILE Chapter 8 241


    # The User and the Group Directive


    The User and Group directives are used to store the default user information that
    runs Apache. For example,


    ```

    # If you wish httpd to run as a different user or group, you must run

    # httpd as root initially and it will switch.

    #nUser/Group: The name (or #number) of the user/group to run httpd as.

    # On SCO (ODT 3) use "User nouns" and "Group nogroup".

    # On HPUX you may not be able to use shared memory as nobody, and the

    # suggested workaround is to create a user www and use that user.

    # NOTE that some kernels refuse to setgid(Group) or setcmtl(IPC_SET)

    # when the value of (unsigned)Group is above 60000;

    # don''t use User www on these systems!

    ```


    User www

    Group www


    # The ServerAdmin Directive


    The ServerAdmin directive is used to specify an e-mail address. This e-mail address
    belongs to the server administrator and can be used to contact the server administrator
    if the client is facing a problem:


    ```

    # ServerAdmin: Your address, where problems with the server should be

    # e-mailed. This address appears on some server-generated pages, such

    # as error documents.

    #nServerAdmin@localhost.localdomain

    ```


    # The ServerName Directive


    The ServerName directive specifies the server name. This name is used when redirection
    of URLs is created. If you don''t specify a server name at the time of installation,
    the value localhost is used by default. For example,


    ```

    # ServerName allows you to set a host name that is sent back to clients for

    # your server if it''s different than the one the program would get (i.e., use

    # "www" instead of the host''s real name.

    #

    ```'
