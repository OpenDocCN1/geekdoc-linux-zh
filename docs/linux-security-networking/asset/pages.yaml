    * certificate_verify

    * change_cipher_spec

    * finished


    All of these messages is discussed in the next few sections.


    # client_hello


    The client sends the client_hello message to the server when it first tries to
    establish a session with the server. This message includes the following parameters:


    +   * Version. This is the client version of SSL.

    * Random. This is a random data value generated by the client.

    * Session ID. This is the session identifier. This ID can be used by a client
    to establish a new connection in the session.

    * CipherSuite. This is a list of key-exchange algorithms supported by the client.

    * Compression Method. This is the list of compression algorithms that the client
    supports.


    # server_hello


    The client sends the server_hello message in response to the client_hello message.
    The parameters of the server_hello message are the same as that of the client_hello
    message. The version field includes the version suggested by the client and the
    highest versions supported by the server. The server searches a match for the
    client''s given session ID. If the session ID is found, the handshake process
    is carried out. If it is not found, the server creates a new session ID, and the
    client and server perform a handshake:'
