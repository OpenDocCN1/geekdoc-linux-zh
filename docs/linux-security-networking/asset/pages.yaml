- pgno: 116
  md: '# GENERAL ADMINISTRATION


    # Chapter 4


    # 89


    # Searching for Information


    At times, you need to search for specific files—such as files modified after a
    particular date—to generate statistical representations, and so on. The search
    command provided by Linux can be used effectively for extracting such information
    from the system. Some of the commands used by administrators for this purpose
    are grep, find, locate, finger, which, whereis, and updated.


    # find


    The find command searches for files in a directory and its subdirectories. The
    find command searches the directory tree by evaluating an expression.


    The syntax of the find command is as follows:


    ```

    Find [path] [expression]

    ```


    The [path] argument specifies the directory where the files matching the [expression]
    will be searched lines that match a specified. If the path is not specified, the
    current directory is used for searching files. Similarly, if no expression is
    given, the expression -print is used, which prints the output on the screen. The
    find command ends with status 0 if all files are searched successfully. If an
    error occurs, a value greater than 0 is returned. For example, to search for all
    the files with the .txt extension in the current directory, you execute the following
    command:


    ```

    find *.txt

    ```


    Similarly, to find all the files in the root directory that were accessed in the
    last three days, you execute the following command:


    ```

    find -atime 3

    ```


    You can use the find command to search for a file that might be created as a result
    of unauthorized user activity or some virus activity. In case of intrusion detection,
    this command can also be used to detect the files modified during a specific period.


    # grep


    The grep command prints lines that match a specified pattern. You can specify
    different patterns by using the options available for the grep command. You can
    use the grep command to search for some specific strings in the log files. Thus,'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Chapter 4 LINUX ADMINISTRATION


    Input to the grep command can be provided in the form of a file name, output from
    another command, or directly as a parameter. The grep command accepts a number
    of parameters to perform search on the input data. The syntax of the grep command
    is shown here:


    ```

    grep [options] [search_text] [filenames]

    ```


    Some important parameters of the grep command are listed here:


    +   - -n. This parameter returns the line(s) containing the search phrase along
    with the line number.

    - -v. This parameter returns output that does not contain the search phrase or
    word.

    - ^<word>. This parameter returns all the lines starting with <word>.

    - <word>$. This parameter returns all the lines ending with <word>.


    # slocate


    The slocate (secure locate) command is the security-enhanced version of the GNU
    Locate command. Secure locate provides a secure way to index and search quickly
    for files on your computer. It uses incremental encoding to compress its database
    to search faster. The command also stores file permissions and ownership details
    of files so that users will not be able to view files they do not have access
    to. The syntax of the slocate command is as follows:


    ```

    slocate [options] [path] [search_string]

    ```


    # finger


    The finger command displays information about the user. The following list tells
    you about the options of the finger command and the user information it displays.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# GENERAL ADMINISTRATION


    # Chapter 4


    +   - s. This option displays the user''s login name, real name, terminal name,
    write status, idle time, login time, office location, and office phone number.
    Login time is displayed as month, day, hours, and minutes. Unknown devices, as
    well as non-existent idle and login times, are displayed as single asterisks.


    +   - -l. This option shows a multi-line format output that displays all information
    described for the -s option. This option also displays details of the user''s
    home directory, phone number, login shell, mail status, and the contents of the
    .plan, .project, and .forward files from the user''s directory.


    Suppose that you have created a user named John, and you want to view his information.
    To do so, you can execute the following command:


    ```

    -ls john

    ```


    The output of the preceding command looks like this:


    ```

    Login: john             Name: (null)

    Directory: /home/john  Shell: /bin/bash

    Never logged in.

    No mail.

    No Plan.

    ```


    The finger command, when used by unauthorized users, can reveal user information.
    Therefore, its usage should be restricted.


    # which


    The which command shows the full path of shell commands. This command takes one
    or more arguments. For each of the command''s arguments, it prints to stdout the
    full path of the executables. These are executed when the arguments are entered
    at the shell prompt. The which command searches for an executable or script in
    the directories listed in the environment variable, PATH, using the same algorithm
    as bash (1). This command can be useful in detecting trojans. An administrator
    can find the exact location of the trojan that is present in the memory. This
    tool can also help to verify the correct location of files for a particular service.'
  merge: -1
