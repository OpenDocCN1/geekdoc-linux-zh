  md: '# REMOTE ADMINISTRATION Chapter 4 129


    Webmin is not very safe because it is a Web-based tool. However, using a firewall

    c greatly reduce the risks of attack.


    ```

    ipfwadm -I -a accept -P tcp -S 10.0.0.0/8 -D 0.0.0.0/0 10000

    ipfwadm -I -a accept -P tcp -S this_is_some.trusted.host -D 0.0.0.0/0 10000

    ipfwadm -I -a deny -P tcp -S 0.0.0.0/0 -D 0.0.0.0/0 10000

    ```


    Webmin also can be firewalled using IPCHAINS:


    ```

    ipchains -A input -p all -j ACCEPT -s 10.0.0.0/8 -d 0.0.0.0/0 10000

    ipchains -A input -p all -j ACCEPT -s this_is_some.trusted.host -d 0.0.0.0/0 10000

    ipchains -A input -p all -j DENY -s 0.0.0.0/0 -d 0.0.0.0/0 10000

    ```


    # cfengine


    The cfengine tool is the result of a research project started in 1993 that was

    designed to help system administrators solve problems such as managing permis-

    s for files and users in a large network. cfengine is a very high-level policy

    language, in which a single statement can result in hundreds of operations being

    formed on multiple hosts.


    The cfengine tool manages the systems by using a high-level policy language.

    cfengine sets up and maintains BSD and System-5-like operating systems

    attached to a TCP/IP network.


    cfengine enables you to create a centralized configuration system. You can use

    this system to manage configuration of the hosts in your network. To configure

    t hosts based on this system, an interpreter parses the master file. The Configu-

    ration of each host is then checked. Any deviations from the defined configura-

    t are fixed automatically. You do not need to mention host names. Instead,

    can refer to the properties, which distinguish hosts from one another. It is a
    use-

    ful tool for managing old junk files and for making scripts to manage the access

    rights and permissions on your files. cfengine also contains a text editing lang-

    gnage that can be used to edit text files.


    Originally, cfengine was meant only for root users. However, it is increasingly

    used by ordinary users as a scripting language.


    cfengine focuses on a few keys that are handled rather poorly from

    scripts. You can specify how your network should be configured from a single-

    figuration file. cfengine parses your file and executes the instructions. While

    executing the instructions, it generates warnings or fixes errors.


    ![](img/a46d40e435b42e09209eb0761898e63c_156_0.png)'
