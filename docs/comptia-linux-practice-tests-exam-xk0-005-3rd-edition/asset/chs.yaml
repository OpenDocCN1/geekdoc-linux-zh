  \ 21, 34, 184, 190, 206, 207\n\n# 在线题库\n\n注册即可获得一年的免费在线题库访问权限，帮助您准备 CompTIA Linux+\
  \ 考试——购买本书即可获得！书中的所有章节练习题和测试题都包含在在线题库中，您可以在计时环境下进行练习。\n\n## 注册并访问在线题库\n\n要注册书籍并访问题库，请按照以下步骤操作：\n\
  \n1.  访问 [`www.wiley.com/go/sybestprep`](http://www.wiley.com/go/sybestprep)。\n\
  2.  从列表中选择您的书籍。\n3.  完成所需的注册信息，包括回答安全验证以证明拥有书籍。您将收到一封包含代码的邮件。\n4.  按照邮件说明或访问 [`www.wiley.com/go/sybestprep`](http://www.wiley.com/go/sybestprep)。\n\
  5.  在该页面找到您的书籍并点击 `Register or Login` 链接。然后输入您收到的代码并点击 `Activate PIN` 按钮。\n6.  在创建账户或登录页面，输入您的用户名和密码，然后点击登录；如果您还没有账户，请创建一个新账户。\n\
  7.  此时，您应该已进入题库网站，页面顶部会列出您的新题库。\n"
