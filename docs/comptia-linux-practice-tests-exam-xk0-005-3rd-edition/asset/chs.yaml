  \ triOS College 教授的每一堂课程中。他还被计算机技术行业协会（CompTIA）评为 2019 年度优秀培训师。关于 Eckert 先生的更多信息，请访问\
  \ [`jasoneckert.net`](http://jasoneckert.net)。\n\n# 引言\n\n本书为 CompTIA Linux+ 认证\
  \ XK0-005 提供了练习题。题目为单选题，题目平衡反映了考试权重。\n\n## 如何获得 Linux+ 认证\n\n考试由 CompTIA 的全球测试合作伙伴\
  \ Pearson VUE 管理。有关考试的更多信息，请访问 CompTIA 网站：[`www.comptia.org`](http://www.comptia.org)。您也可以访问\
  \ Pearson VUE：[`www.pearsonvue.com`](http://www.pearsonvue.com)。\n\n## 如何使用本书和交互学习环境\n\
  \n本书旨在作为 *CompTIA Linux+ Study Guide Exam XK0-005, 5th Edition* 的补充。理想情况下，您已经拥有该书，并在学习目标时可以使用本书中的练习题。\n\
  \n本书包含 1000 道与 CompTIA 确定的获得 Linux+ 认证所需的技术相关。如果您具备所需的技能和经验，可以尝试书中的题目，并在需要时查找。本书也可用于识别您可能需要额外经验和知识的领域。\n\
  \n[`www.wiley.com/go/sybextestprep`](http://www.wiley.com/go/sybextestprep) 的在线题库包含了书中所有的题目。像参加实际考试一样（不参考任何资料）进行这些模拟考试。如果您回答正确率超过\
  \ 90%，说明您准备好参加认证考试了。\n\n## Linux+ 认证考试目标：（XK0-005)\n\n考试目标可以通过 [`www.comptia.org/certifications/linux`](http://www.comptia.org/certifications/linux)\
  \ 获取。\n\n\n\n\n\n如果您认为在书中发现了错误，请告知我们。在 John Wiley & Sons，我们深知为客户提供准确内容是多么么重要，但即使我们尽了最大努力，也可能出现错误。要提交您可能的勘误，请将电子邮件发送至我们的客户服务团队，邮箱为\
  \ `wileysupport@wiley.com`，邮件主题为“Possible Book Errata Submission”。\n\n# 第 1 章\n\n\
  ## 系统管理（领域 1.0）\n\n1. 使用哪个命令自动加载模块及其依赖项？\n    1. `modprobe`\n    2. `lsmod`\n  \
  \  3. `insmod`\n    4. `rmmod`\n\n2. 在 GRUB2 启动项配置中，启动时提供的哪个选项会将系统引导到单用户模式？\n  \
  \  1. `single-user`\n    2. `su`\n    3. `single`\n    4. `root`\n\n3. 在运行 `systemd`\
  \ 的计算机上，哪个命令用于显示默认目标？\n    1. `systemctl defaults`\n    2. `update-rc.d`\n    3.\
  \ `systemctl runlevel`\n    4. `systemctl get-default`\n\n4. 使用哪个命令获取 USB 设备列表？\n\
  \    1. `usb-list`\n    2. `lsusb`\n    3. `ls-usb`\n    4. `ls --usb`\n\n5. 哪个命令可以获取已加载模块的列表？\n\
  \    1. `insmod`\n    2. `modlist`\n    3. `ls --modules`\n    4. `lsmod`\n\n6.\
  \ 在运行统一扩展固件接口 (UEFI) 系统时，EFI 分区通常挂载到哪里？\n    1. `/etc/efi`\n    2. `/efi`\n    3.\
  \ `/sys/efi`\n    4. `/boot/efi`\n\n7. 假设 USB 磁盘包含一个分区并在 `/dev/sdb` 上可用，哪个命令将磁盘挂载到\
  \ `/media/usb`？\n    1. `mount /dev/sdb1 /media/usb`\n    2. `usbconnect /dev/sdb0\
  \ /media/usb`\n    3. `mount /dev/sdb0 /media/usb`\n    4. `usbmount /dev/sdb1 /media/usb`\n\
  \n8. 尽管设备已加载并正常工作，`lsmod` 输出中未出现驱动程序的原因是：\n    1. 使用 `systemd` 意味着大多数设备不需要驱动。\n\
  \    2. 使用 `initrd.img` 意味着默认启用。\n    3. 设备不需要驱动程序。\n    4. 设备支持已直接编译进内核。\n\n9.\
  \ `rmmod` 的哪个选项会等待模块不再被使用后再卸载？\n    1. `-test`\n    2. `-b`\n    3. `-w`\n    4.\
  \ `-unload`\n\n10. 哪个命令会输出新的 GRUB 配置并发送到正确的启动位置？\n    11. `update-grub`\n    12.\
  \ `update-grub > /boot/grub.cfg`\n    13. `grub-rc.d`\n    14. `grub-boot`\n\n11.\
  \ MBR 系统的主分区数量是多少？\n    1. 二\n    2. 四\n    3. 一\n    4. 五\n\n12. 通过 `fdisk` 等工具处理磁盘分区时，看到\
  \ `0x82` 是什么类型的分区？\n    1. Linux\n    2. Linux swap\n    3. NTFS\n    4. FAT\n\n\
  13. 使用 GRUB2 时，应该编辑哪个文件来定义超时等选项？\n    1. `/etc/default/grub`\n    2. `/etc/grub/boot`\n\
  \    3. `/etc/boot/grub.d`\n    4. `/grub.d/boot`\n\n14. `grub2-mkconfig` 命令的哪个选项将输出发送到文件而不是\
  \ `STDOUT`？\n    1. `-stdout`\n    2. `--file`\n    3. `-o`\n    4. `-f`\n\n15.\
  \ Linux 系统 `/boot` 分区的哪个大小最合适？\n    1. 至少 1 GB。\n    2. 100 MB 到 200 MB 之间。\n  \
  \  3. `/boot` 应该单独分区。\n    4. 小于 5 MB。\n\n16. 以下哪个命令用于为 LVM 初始化磁盘分区？\n    1. `lvmcreate`\n\
  \    2. `pvcreate`\n    3. `vgextend`\n    4. `pvs`\n\n17. 以下哪个命令将 GRUB 安装到第二个 SATA\
  \ 磁盘的 MBR 中？\n    1. `grub2-install /dev/hdb2`\n    2. `grub2-install /dev/sda2`\n\
  \    3. `grub2-config /dev/sda`\n    4. `grub2-install /dev/sdb`\n\n18. 使用哪个命令创建\
  \ LVM 逻辑卷？\n    1. `pvcreate`\n    2. `lvmcreate`\n    3. `lvcreate`\n    4. `volcreate`\n\
  \n19. LVM 逻辑卷创建逻辑顺序是什么？\n    1. 物理卷创建、卷组创建、逻辑卷创建\n    2. 物理卷创建、逻辑卷创建、卷组创建\n    3.\
  \ 逻辑卷创建、物理卷创建、卷组创建\n    4. LVM 创建、格式化、分区\n\n20. 修改 `/etc/default/grub` 文件后应该运行哪个命令？\n\
  \    1. `grub`\n    2. `grub-mkconfig`\n    3. `grub-inst`\n    4. `reboot`\n\n\
  21. 哪个命令用于更改逻辑卷的详情？\n    1. `lvmcreate`\n    2. `pvcreate`\n    3. `lvchange`\n\
  \    4. `lvmscan`\n\n22. GRUB Legacy 配置文件将硬盘报告为 `hd(0,0)`。这对应于哪个磁盘和分区？\n    1. `/dev/hdb2`\n\
  \    2. `/dev/hda0`\n    3. `/dev/disk1`\n    4. `/dev/sda1`\n\n23. 以下哪个命令将 GRUB\
  \ 安装到第一个 SATA 磁盘的主引导记录 (MBR)？\n    1. `grub-install /dev/hda`\n    2. `grub-install\
  \ /dev/sda`\n    3. `grub-install /dev/hd0,0`\n    4. `grub -i /dev/hda`\n\n24.\
  \ `yum` 命令提供的哪个选项将安装软件包？\n    1. `update`\n    2. `configure`\n    3. `install`\n\
  \    4. `get`\n\n25. 将新硬盘插入系统后，使磁盘可用的正确顺序是？\n    1. 使用 `fdisk` 创建分区。\n    2. 挂载分区。\n\
  \    3. 使用 `-a` 挂载所有新创建区。\n    4. 使用 `fdisk` 创建分区，然后使用 `mkfs` 格式化分区。\n\n26. 处理 `rpm`\
  \ 文件并使用 `cp` 时，默认输出发送到哪个位置？\n    1. `STDOUT`\n    2. `cpio.out`\n    3. `a.out`\n\
  \    4. `/tmp/cio.out`\n\n27. 以下哪项描述了 `ext2` 和 `ext3` 文件系统的主要区别？\n    1. `ext3`\
  \ 主要是对 `ext2` 的错误修复更新。\n    2. `ext3` 为文件系统包含了日志。\n    3. `ext3` 完全改变了磁盘管理所需的工具。\n\
  \    4. `ext3` 没有差异。\n\n28. 根据文件系统标准 (FHS)，附加应用程序软件的正确位置是？\n    1. `/etc`\n    2.\
  \ `/var`\n    3. `/tmp`\n    4. `/opt`\n\n29. `mount` 命令的哪个选项将挂载 `/etc/fstab` 中当前可用的文件系统？\n\
  \    1. `-f`\n    2. `-d`\n    3. `-a`\n    4. `-m`\n\n30. `systemctl` 命令的哪个选项会更改服务以便在下次启动时运行？\n\
  \    1. `enable`\n    2. `startonboot`\n    3. `loadonboot`\n    4. `start`\n\n\
  31. `xfs_metadump` 的哪个选项显示进度指示？\n    1. `-g`\n    2. `-p`\n    3. `-f`\n    4. `-v`\n\
  \n32. 主目录分区空间不足，且未启用配额。可以使用哪个命令确定可能包含大文件的目录？\n    1. `du`\n    2. `df`\n    3. `ls`\n\
  \    4. `locate`\n\n33. 哪个文件包含要挂载的文件系统信息、分区以及应用于挂载的选项？\n    1. `/etc/filesystems`\n\
  \    2. `/etc/mounts`\n    3. `/etc/fstab`\n    4. `systemd.mount`\n\n34. 根据 FHS，可移动媒体的适当挂载点是？\n\
  \    1. `/etc`\n    2. `/srv`\n    3. `/tmp`\n    4. `/media`\n\n35. 每个总线支持多少个 SCSI\
  \ 设备？\n    1. 七到十五\n    2. 二到四\n    3. 十二\n    4. 四\n\n\n\n\n\n36. 哪个 `umount` 选项会导致在卸载过程失败时，命令尝试以只读模式重新挂载文件系统？\n\
  \n1. `-o`\n2. `-r`\n3. `-f`\n4. `-v`\n\n37. 以下哪项代表了 `/etc/fstab` 文件的正确格式？\n\n1.\
  \ `<directory> <device> <type> <options>`\n2. `<device> <type> <options>`\n3. `<device>\
  \ <type> <options> <directory> <dump> <fsck>`\n4. `<device> <directory> <type> <options>\
  \ <dump> <fsck>`\n\n38. 以下哪个命令用于识别分区的 UUID？\n\n1. `blkid`\n2. `partprobe`\n3. `find`\n\
  4. `cat`\n\n39. `xfs_info` 命令在功能上与哪个命令和选项等效？\n\n1. `xfs_test -n`\n2. `xfs_list`\n\
  3. `tunexfs -i`\n4. `xfs_growfs -n`\n\n40. 以下哪个命令会在第一个 SATA 驱动器上创建 `btrfs` 文件系统？\n\
  \n1. `mkfs /dev/sda1`\n2. `mkfs.btrfs /dev/sda`\n3. `mkfs.btr2fs /dev/sda1`\n4.\
  \ `mkfs –b /dev/sda`\n\n41. 哪个命令和选项可以用于确定给定服务当前是否加载？\n\n1. `systemctl –ls`\n2. `telinit`\n\
  3. `systemctl status`\n4. `sysctl -a`\n\n42. 哪个命令可以更改磁盘的分区方案，例如在不删除现有分区的情况下更改其大小？\n\
  \n1. `resize2fs`\n2. `parted`\n3. `mkfs`\n4. `rfdisk`\n\n43. 以下哪个命令会将 `/dev/sdb1`\
  \ 的 USB 设备挂载到 `/mnt/usb` 目录，假设 USB 驱动器使用 VFAT 文件系统？\n\n1. `mount -t vfat /dev/sdb1\
  \ /mnt`\n2. `usbmount /dev/sdb1 /mnt/usb`\n3. `mount -t vfat /dev/sdb1 /mnt/usb`\n\
  4. `mount -t usb /dev/sdb1 /mnt/usb`\n\n44. `gdisk` 中的哪个选项将更改分区名称？\n\n1. `n`\n2.\
  \ `b`\n3. `v`\n4. `c`\n\n45. 在由 `systemd` 控制的系统中，哪个命令会将系统置于单用户模式？\n\n1. `systemctl\
  \ stop`\n2. `systemctl isolate rescue.target`\n3. `systemctl single-user`\n4. `systemctl\
