  ## 2. 第一章：无线网络简介及其在工作流中的作用

  在计算机网络的初期，节点之间几乎所有的连接都依赖铜质电缆。这种布线方式以高效、廉价和耐用而闻名，是早期互联网的骨干。然而，随着对宽带需求的增加，光纤介质逐渐取代了互联网骨干的大部分。尽管如此，本地网络仍然依赖于铜质连接。


  近期移动设备的激增以及笔记本电脑取代便携性较差的台式机成为主要设备，使得我们现在熟悉的无线网络被广泛使用。虽然这些无线网络提供了便利性和灵活性，但它们从本质上说比有线对应设备不安全。这主要是因为无线信号是向各个方向广播的，而不是局限于电缆内部。


  为了缓解这些漏洞，引入了加密协议来保护无线通信。成功破解这些加密算法的黑客可以获得对目标的未经授权访问。


  ### 无线技术

  必须理解，不同的无线通信标准在目的、范围、速度和带宽方面存在差异。每种标准都在其特定的协议下运行，尽管它们都利用 `TCP/IP` 框架来促进网络通信。


  由于无线信号的全方位性，其质量随着与信号源距离的增加而迅速恶化。这限制了在特定范围内可以维持的数据速率。此外，无线信号容易受到电磁干扰，这会降低信号质量。


  无线保真，俗称 `Wi-Fi`，是一种用于本地和商业局域网 (`LANs`) 的无线通信标准。`Wi-Fi` 在 100 米范围内可以提供无干扰的有效覆盖，但在大多数住宅和城市环境中，范围会缩小到
  30 米左右。


  另一种无线技术是 `蓝牙`，专为个人区域网络内的较小配件和设备设计，范围不超过 10 米。对于 1 米或更短距离的短距离数据传输使用了近场通信标准 (`NFC`)，有时需要设备之间进行物理接触。


  ### Wi-Fi 网络

  让我们深入研究 `Wi-Fi`，这种技术已无处不在，以至于很难找到一个没有私有或公共接入点的城市。然而，这种广泛的可用性也带来了巨大的挑战。范围内的任何人可以在没有物理连接或授权的情况下监控
  `Wi-Fi` 信号，即使是在局域网 (`LAN`) 内的不同位置。


  黑客有时会通过在街道上行走或开车来利用不受保护的 `Wi-Fi` 网络，识别易受攻击的网络进行剥削。这强调了加密 `Wi-Fi` 网络以保护敏感数据的至关性。


  由电气和电子学会建立的原始 `Wi-Fi` 标准是 `802.11`。多年来，该标准经过了修订以提高安全、速度和范围。著名的迭代版本包括 `802.11g` 和
  `802.11n`，最近的是 `802.11ac`。这些标准支持各种频段，包括 `900 MHz`、`2.4 GHz`、`3 GHz`、`6 GHz` 和 `5
  GHz`。


  根据标准，一个 `Wi-Fi` 网络包含至少两个站，其通信由协调功能管理。由单一 `CF` 管理的一组站构成了 `Wi-Fi` 的基本服务集。每个站提供四种基本服务：

  - `身份验证` (`Authentication`)：验证网络上站的身份。

  - `取消身份验证` (`Deauthentication`)：使之前已验证的站失效。

  - `隐私保护` (`Privacy`)：利用加密保护消息帧。

  - `MAC 服务单元交付` (`MAC Service Unit Delivery`)：将数据帧交付到其目的地。


  作为无线接入点的站（通常是正在使用的路由器）必须提供五项额外服务。这些包括：

  - `关联` (`Association`)：此过程涉及将已验证的站映射到接入点。

  - `取消关联` (`Disassociation`)：在此，之前关联的站被取消身份验证，断开其连接。

  - `重新关联` (`Reassociation`)：允许将站重新映射到另一个接入点。

  - `分布` (`Distribution`)：处理局域网内 `MSDU` 帧的交付。

  - `集成` (`Integration`)：该服务管理局域网与外部有线局域网之间 `MSDU` 帧的传输。


  ### Wi-Fi 网络操作

  Wi-Fi 网络由三个关键参数定义，使其与附近的网络区分来。这些参数是网络名称（服务集标识符或 `SSID`）、工作模式和工作通道。虽然路由器带有默认的 `SSIDs`，但大多数用户选择自定义。为了隐私可以隐藏
  `SSID`，但熟练的黑客仍然可以发现隐藏的网络名称。


  `Wi-Fi` 网络在两种模式下运行。范围内的任何人可以在没有物理连接或授权的情况下监控 `Wi-Fi` 信号，即使是在局域网 (`LAN`) 内的不同位置。


  黑客有时会通过在街道上行走或开车来利用不受保护的 `Wi-Fi` 网络，识别易受攻击的网络进行剥削。这强调了加密 `Wi-Fi` 网络以保护敏感数据的至关性。


  原始的 `Wi-Fi` 标准是 `802.11`。多年来，该标准经过了修订以提高安全、速度和范围。著名的迭代版本包括 `802.11g` 和 `802.11n`，最近的是
  `802.11ac`。这些标准支持各种频段，包括 `900 MHz`、`2.4 GHz`、`3 GHz`、`6 GHz` 和 `5 GHz`。


  一个 `Wi-Fi` 网络根据其标准包含至少两个站，其通信由协调功能管理。由单一 `CF` 管理的一组站构成了 `Wi-Fi` 的基本服务集。每个站提供四种基本服务：

