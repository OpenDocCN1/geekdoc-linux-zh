    32 位还是 64 位系统的选项。你实际上会想要获取所有 `.iso`/`.img` 记录或 `.down` 文件的合法镜像。记住，这样做对于基于 Intel
    的电脑是显式要求的。你同样也可以获得允许你在虚拟机或其他不同配置上运行 Kali Linux 的文件。


