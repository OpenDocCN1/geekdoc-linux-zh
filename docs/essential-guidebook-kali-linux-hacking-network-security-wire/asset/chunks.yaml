    Kali Linux 官方网站以获取更多执行此操作的访问权限和数据。


    ## 第 4 章：基础 Linux 命令


    从现在开始，你获得的数据将是有用数据以及你可以以某种方式有效使用数据的混合。本节将专门为你提供开始与 Kali Linux 关联的基础数据。你将获得一份最知名且必要的常用命令清单。


    在阅读这些命令时，请尝试深入研究它们。你需要确保了解它们是什么，以及如何最好使用它们来帮助你。假设你能做到这一点，你就确保自己准备好与你的 Linux 发行版协作，无论你选择了哪一个。记住，在
    Kali Linux 中，你当然处于 root 客户端，你应该安全起见。当你没有 root 权限时使用这些命令中的某些命令，你会遇到阻止你继续操作的问题。在任何情况下，在
    Kali 中，假设你现在处于 root 客户端，命令会立即完成，无论它是否是破坏性的命令。为此，严谨和谨慎的衡量对于培养你的 Kali Linux 能力并精通渗透测试和黑客技术至关重要。


