    说实话，只要你能将请求发送到完美的地方，你甚至可以从一个陆地开始，轻松地经过另一个陆地将信息发送到海外。为了真正开始理解网络位置以及它们如何与黑客攻击、`Kali
    Linux` 和通用注册相关，你最初应该了解一些核心概念。这部分将引导你理解并刻画枢纽，以及公共和私有的 `IP addresses`（节点）。


    ### 节点 (Nodes)

    节点是组织网络内部唯一的重组点——假设你正在通过邮寄发送东西，那么枢纽就是邮件通过的每一个单一邮政中心。假设你从阿拉巴马州向阿拉斯加州的一个遥远城镇寄送信件，这封信不会直接发往那个遥远的城镇——它会经过几个作为中转站的指定地点。节点也可以指最后的终点。它实际上是信息被发送到的每一个区域，直到它最终到达目的地并被传输到它应该去的地方。


    ### 主机 (Hosts)

    主机是一台与另一台电脑连接并负责发送信息的电脑。主机是一个组织枢纽——它接收和发送数据，并有自己的地址。


    这可以作为一个记录数据的服务器，允许其他人访问它。它也可以是个人与个人的主机，你有一台电脑持有所有数据，你从另一台电脑访问这些数据。就像在一个大型派对中，有人是提供娱乐、食物和庆祝的人，这台电脑（主机）提供了所需的所有数据。要被视为主机，该电脑或服务器应该拥有自己的组织地址。


    ### IP 地址 (IP Address)

    `IP addresses` 是你的“网络协议”地址。这是分配给你电脑网络操作的唯一位置。根据组织的邮政站模型，将你的 `IP address` 想象成信封上的回信地址——它考虑了组织以及你访问的网站或服务器，以确保是你的特定电脑在访问，并允许服务器将相应的数据发回给你。如果没有这个地址被妥善安置，尽管数据需要回传，也很可能传回给你。


    这些 `IP addresses` 并不是取决于电脑的静态地址；而是由网络访问提供商（ISP）为你提供的。由于 ISP 充当你从局域网（LAN）到互联网的通道，它还会通过分配给你家里或路由的
    `IP address` 为你的请求进行标记。它允许电脑与互联网建立该连接并随后让你访问它。它可以通过网络协议进行进一步交互，这将在本节稍后进行讨论。这意味着每当你与另一个网络区域连接时，即使来自同一台电脑，你也会获得另一个
    `IP address`。餐厅附近的 Wi-Fi 会给你一个与你在家里或公司处不同的 `IP address`，无论这三处是否是从同一台电脑访问的。这是因为当你处于另一个网络区域时，你从另一个区域访问互联网。你的数据需要根据你的位置通过一条完全独特的路线来联系你。


    #### 公共 IP 与私有 IP 地址

    `IP` 基本上通常有两种结构——公共和私有。每种结构都以某种相当独特的方式分配，以考虑其应去往位置的基本访问权限。`public IP address`
    是前面提到的那个——它是 ISP 提供的允许访问互联网的地址。它是全球唯一的且可以查找到，可以通过使用 `Linux` 系统时通过终端命令或通过网页。只需在网上搜索“我的
    IP 地址是多少”就应该得到你的 `public IP address`。


    `private IP address` 的作用方式非常相似——它给电脑一个特定的地址，但在这种情况下，它被用于私有空间或组织内部的电脑，而不会暴露该特定设备。想一个局域网（LAN）——你可能在同一个组织上有几台电脑。在这种情况下，连接到你私有组织的单一电脑通常拥有
    `private IP addresses`。这些 `IP addresses` 未连接到互联网，但连接点（可能是交换机）可以将数据发送到正确的 `private
    IP address`。路由器随后获取公共 ID，而连接到路由器的电脑则获得私有 ID。


    ### 分配 IP 地址 (Assigning an IP address)

    还有第三种 `IP address`——`static IP address`（静态 IP）。这种 `IP address` 允许你使用不同的组织服务，而无需期望提供这些服务的框架拥有
    `IP address`。这可以通过多种方式实现，例如将 `MAC address` 绑定到 `IP address`，或者在命令行或网络管理器中设置一个。


    当你想要从物理上执行此操作时，你应该查看你正在使用的交换机。通常情况下，交换机会使用自己的策略来锁定和绑定 IP 地址，你应该始终检查你正在使用的交换机手册。它的工作原理是简单地将
    `MAC address` 限制到 `IP address`。`MAC address` 是介质访问控制地址——它是放置于设备中的标识符，专门用于表征该设备。它是持久的，并属于该特定设备的网络接口控制器（`NIC`）。这意味着无论设备多频繁地进行工厂级重置或更改，它将永远具有相同的
    MAC 地址。


    当你将 `IP address` 设置为静态时，你所做的简单地将一个特定的 `MAC address` 分配给一个特定的 `IP address`。这种技术不会用于为虚拟机制作静态
    IP。


    在 `Kali Linux` 中，制作静态 IP 非常简单。你只需直接使用 `Network Manager` 设置。这样做时，你应该去屏幕右上角并点击菜单。然后，点击“Wired
    Connected”进入“Wired Settings”。这样做之后，会弹出另一个窗口。你应该看到与 Wired 相关的齿轮图标——这将触发另一个窗口，你在其中将选择
    `IPv4` 选项卡。你可以将 `IPv4` 方法从自动切换到手动，然后输入你想要实现的理想静态 IP。当你选择理想位置时，记住你选择地址的前七位应与默认网关匹配。也就是说，假设交换机的网关
    IP 地址是 `123.456.7.8`，你的选择 IP 应该是 `123.456.7.` 并且你应该在该菜单的 Address 下记录你的选择 IP。你还应该选择掩码——对于大多数人来说，只需输入
    `255.255.255.0` 就足够了。然后你应该记录网关，它应该匹配交换机的 IP 地址。在完成位置、掩码和网关的设置后，你可以决定设置任何 DNS 设置（如果你需要），但这并不是强制的。


