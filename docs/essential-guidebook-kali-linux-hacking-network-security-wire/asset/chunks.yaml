    # 系统信息


    `cat /etc/redhat-release` 这将向你显示计算机上当前运行的是哪个版本的 redhat。


    `date` 这将向你显示你正在使用的系统当前的时间和日期。


    `hostname` 这将告诉你系统主机的名称。``hostname -I` 这将为你提供主机的 IP 地址。


    `last reboot` 这将显示系统最后一次重启的时间。


    `uname -a` 这允许显示存储的 Linux 系统信息。

    `uname -r` 这允许输出显示你正在使用的内核版本。


    `uptime` 告诉你的系统已经运行了多久，或者加载了多久。

    `w` 这将向你显示当前在系统中在线的用户是谁。

    `whoami` 这将告诉你当前是以什么用户身份登录到系统的。


    # 用户信息与管理命令


    这些命令对于你管理用户信息的能力关关。当你掌握了这些控制方法，你就可以从服务器中添加或删除人员。你可以确保某些人拥有特定的权限，等等。这些命令在 Kali
    Linux 中可能不是那么必要（因为你被设计为使用 root 用户而不是其他用户），但了解并理解它们仍然是非常棒的。


    `groupadd group1` 允许在此实例中创建一个新组“group1”。你可以用任何其他组名替换“group1”。

    `id` 显示系统上当前用户的用户 ID 和组 ID。

    `last` 显示最后几个登录的人员是谁。

    `useradd –c “full name” –m “nickname"` 允许创建一个账户，其注释为“full name”（全名），家目录为“nickname”（昵称）。

    `userdel “name"` 允许你删除用户“name”。


    `usermod –aG group1 “name"` 允许你将用户“name”移动到“group1”组。


    # 第二二部分：Kali Linux 黑客攻击


    ## 第 5 章：Nmap 以及漏洞的检测与利用


    到此时，你可能已经非常渴望彻底开始使用 Kali Linux 了。你现在应该已经安装了该操作系统，或者正准备这样做。无论哪种，阅读这一节都能为你提供有价值的信息。在这里，你将开始看到
    Kali Linux 的真正威力以及它是如何被使用的。你将开始看到在黑客攻击中可以获得的实力，以及学习如何观察并掌握这种力量；同时你还应该开始看到网络变得毫无保护或毫无防备是多么容易。当这种情况发生时，确保你能发现漏洞并进行修补将符合你的最佳利益。


    Nmap 只是 Kali Linux 提供的许多工具之一，本章专门关注它。Nmap 功能非常强大，它允许你收集和识别有用的信息，允许你检测系统上的一切。它主要是一个安全工具，但你应该记住它也可以被用来造成伤害。现在，是时候进入实际攻击过程的开头了。


    如果你已经安装了 Kali Linux，请直接打开它——Nmap 默认自带并包含在系统中。


    ### 什么是 Nmap？


    Nmap 是 network mapper（网络映射器）——它是一个非常流行的工具，用于发现你可用的资源。与 Kali Linux 发行版提供的所有工具一样，它是免费且安全的。当你使用
    Nmap 时，你可以映射网络，让自己查看资产清单并寻找开放端口。它非常易用——它会弹出一个终端，你可以在其中输入命令和脚本，一旦进入系统，就可以在其中执行任何你想操作。


    该工具能够穿透防火墙和路由器，可以绕过 IP 过滤器，并能够导航进入系统。虽然它被设计为能够穿过大型网络，但也可以用于较小规模的操作。它主要用于端口扫描、版本检测、操作系统检测以及使用
    ping 扫描（ping sweeps）。它的工作原理非常简单——它使用 IP 包来寻找网络上的主机以及它们运行的程序。只需发现某人的电脑运行着什么，就能获得大量信息。


    总的来说，Nmap 非常强大——它允许你执行各种操作并搜索多种漏洞。它不仅收集信息，还可以进行安全扫描，使其成为一个对你大有益的多用途工具。它可以执行此类操作：


    * 检测网络上的任何活动主机

    * 检测主机上当前存在的任何开放端口

    * 检测操作系统、硬件和软件

    * 通过 Nmap 脚本检测漏洞


    工具本身非常常见，并且同时兼容 CLI（命令行界面）和 GUI（图形界面），这意味着它不仅常见且强大，而且灵活。


    ### 如何使用 Nmap 理解并利用漏洞


    当你准备好使用 Nmap 时，你有几种不同的选项。根据你能够提交的命令，你可以扫描一个目标、有限的目标或多个目标。目标决定了你具体如何执行使用该系统的过程，但归结底，这将需要一些时间。


    #### 扫描命令


    Nmap 最基本的用法可能是通过扫描。当你想要扫描时，你有几种不同的选项。你可以选择你想要的目标，无论是单个人、几个人还是整个目录。想象一下，你想扫描单个单元或系统。你可以使用以下命令进行，并相应地更改
    IP 地址。


    ```

    nmap target

    # nmap target.com

    # nmap 192.143.1.1

    ```


    这将扫描那个特定的系统。如果你想扫描关联的所有子网，你的命令将略有不同。改为：


    ```

    nmap target/cidr

    # nmap 192.143.1.1/24

    ```


    如果相反你想扫描多个目标，只需对它们标记并用空格分隔 IP 地址。例如，你可能会写：


    ```

    nmap target1 target2

    # nmap 192.143.1.1 192.143.1.2

    ```


    你甚至可以选择连续扫描一系列 IP 地址，而不扫描整个子网。当你只想扫描 50 个关联的 IP 地址而不是整个子网时，你将使用以下命令：


    ```

    nmap target-50

    # nmap 192.143.1.1-50

    ```


    这将导致一次性扫描从 192.143.1.1 到 192.143.1.50 的每一个 IP 地址。


    你可能还会认为你需要一个正在被扫描的主机列表——在这种情况下，你需要添加适当的参数。在这种情况下，该参数将是 `-sL`：


    ```

    nmap -sL target/cidr

    # nmap -sL 192.143.1.1/24

    ```


    然而，有时你可能扫描整个子网，但你知道需要让该子网的部分完全不扫描以避免检测。


    特别是当你有一个必须避免的单个 IP 地址时，你可以使用带有排除该 IP 地址的参数来创建代码。这非常简单。你只需要像添加 `-exclude` 参数：


    ```

    nmap 192.143.1.1/24 -exclude 192.143.1.13

    ```


    如果你有一个包含所有排除 IP 地址的单一文件，你甚至可以输入该文件，在排除处插入文件名即可。


