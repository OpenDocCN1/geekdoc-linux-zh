    ![](img/image_rsrcUB.jpg)


    1. 从官方 Kali Linux“下载”镜像站下载 `ISO` 镜像，然后计算 `SHA256` 哈希值，并将其与 Kali Linux 网站上列出的值进行比较。你应该能够很简单地完成此操作——但也可能存在被利用漏洞。


    ![](img/image_rsrcUC.jpg)


    2. 通过种子（torrent）下载 `ISO` 镜像，它也会提供一个带有计算好的 `SHA256` 签名的文件。如果你已经在 Linux 或 OS X 上，你就可以使用
    `shasum` 命令，或者使用 Windows 上的工具来验证文件签名是否与下载的其他文件夹中的签名匹配。再次，这存在可能被利用漏洞的风险，因为有人基本上可以为你提供匹配的数字，让它看起来像真实的
    Kali Linux ，以确保你被骗。


    ![](img/image_rsrcUD.jpg)


    3. 唯一能够完全确定的方法稍微复杂一点——你需要下载明文签名文件以及用官方私钥签名的文件版本。然后，你必须使用 `GNU Privacy Guard`。这将验证
    `SHA256` 组合与明文文件中的是否匹配，然后它将确保带有 `SHA256` 哈希的已签名文件也已使用正确的官方密钥进行了正确签名。


    ### 步骤 3：创建 Kali Linux 启动 USB 盘


    可能是让 Kali 准备就绪的最快方法是使用活动启动 USB。基本上，你正在做的是将 Kali Linux 获取到 USB 闪盘中，然后从该 USB 启动。这带有它自己的优点，例如避免任何形式的破坏或混乱。当你使用它时，你没有对你正在使用的框架进行任何更改——你基本上是从
    USB 运行它。这同样突出了它的多功能和可调节性——你实际上想带它去任何地方并从任何电脑启动，你实际上还想在 USB 盘上制作你自己的自定义 Kali ISO，这在这里也会被讨论。


