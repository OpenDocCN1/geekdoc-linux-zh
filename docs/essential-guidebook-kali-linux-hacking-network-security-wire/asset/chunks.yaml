    当你试图潜入一个网络时，你永远不知道哪些信息是有帮助的，哪些是不需要的或必要的。尽可能地收集信息以做好准备，只有在你确认已经收集了所有对你有用的信息后，再进入第
    3 步。


    ## 威胁建模与漏洞识别


    第 3 步仍然围绕规划展开——在此时，你希望利用在前几个步骤中收集的所有信息，并开始脑暴网络可能面临的最现实的漏洞和威胁是什么。它是否使用了某种对特定攻击计划特别脆弱的网络类型？他们使用的硬件类型是否存在漏洞利用程序？只要是目标极可能面临的相关威胁，这里任何想法皆可。


    此阶段还可以利用漏洞扫描器来扫描网络弱点。这可以发现当前该特定网络中存在的任何漏洞，允许你计算出可能存在的漏洞。当你试图了解如何最好访问你尝试渗透的网络时，这对你来说是一个极佳的资产。幸运的是，`Kali
    Linux` 自带 `Metasploit`——这是一种可以在特定目标 IP 列表扫描漏洞的方法。`Metasploit` 将在本书后部分详细讨论。


    此阶段的另一个常用技术是使用扫描工具和端口扫描器来寻找开放端口或存活主机。通过这种方式，你可能会发现另一个可以利用以获取访问的弱点。这种技术允许你扫描设备，从而获得另一个入口点。


    这几乎是侦察 2.0——在这里，你侧重于获取更多关于系统的细节。你应该能够识别出存在哪些系统，它们当前是否处于开启和活动状态，或者是否安装了任何类型的防火墙或防病毒软件。在你识别出漏洞列表后，是时候开始获取更多信息了。


    你能通过查看网络上的员工获取任何有价值的信息吗？发现客户数据有价值吗？客户是否有访问症状权限？是否存在窃取财务信息的可能性？如果有，那么你可能想先查看财务信息以外的地方，以力求避开，并制定一个更好的攻击计划，而不是尝试“开火齐射”地直接冲入陷阱或守备森严的区域。考虑这种情况下最可能的情况并给出一个初步的攻击计划，但请记住，随着你获取的信息越来越多，你的测试很可能会不断演变和变化。


    ## 漏洞利用


    此时，是时候开始尝试访问网络了。你应该有几个不同的位置可以用来攻击系统，现在是时候采取行动了。你是否发现了任何可以用于访问的弱点？你可以尝试启动一个 shell，或者尝试获取分配给你的凭据，以便你可以以
    `root` 用户身份开始访问。是否有空间可以使用其他计算机的信息来帮助你获得突破？此阶段的主要部分是尝试在不被检测和拦截的情况下，获取尽可能多的访问权限。虽然可能在没有实际获得管理访问和权限的情况下造成大量损害，但大多数情况下，你尝试做的是获得那些权限。


    这一阶段在很大程度上取决于你尝试突破的网络，你需要发挥创意。确保你在操作过程中记录哪些是有效的，哪些是无效的，以便开始理清思路。记住，如果你是为了自己或客户这样做，你将希望确切知道哪些是有效的，哪些是无效。当你在这里获取了尽可能的信息后，就是该进入下一个阶段了。


    ## 渗透后利用


    接下来是后利用阶段。此时，你已经完成了测试，可能是因为时间不够，或者达到了你利用能力的极限，或者是没有可供利用的系统。此时，你必须列出所有漏洞并将它们提供给客户。在过程中，你应该对任何有效或无效的操作做了笔记，或者可能截了屏。你应该能够判断你所做的漏洞利用有多大意义——你是进入了主服务器，还是被困在一台对服务器访问权限很小的计算机上？你从系统中获取的信息（如果有的话）有多价值？系统本身的风险有多大？


    除外，你还应该考虑如何修复发现的任何漏洞。你能想出一个简单的补丁来解决问题吗？你还能做些其他什么来确保网络更安全？网络可以做得更好吗？哪些效果良好？此外，你还应该确保清理了现场工作。你需要移除植入系统中的任何内容，并将所有设置改回到原来的样子。你要确保你所利用的一切都已被移除。


    ## 报告


    在这个阶段，是时候编写你的报告了。这可能无趣，但如果你是为了帮助他人而进行渗透测试，你就需要确保你的报告写得整齐漂亮。这是你传达任何可能使客户面临风险的弱点漏洞的地方。你将确保告诉他们发生了哪些漏洞利用，以及应该如何修复它们。


    '
- fmt: '

    This stage should be as brutally honest as possible—you want the other party to
    know exactly what happened and how to fix it. If their system is truly that vulnerable
    to exploitation and you were able to get access to everything, let it loose. Tell
    them in unbiased but honest terms exactly how things went wrong. This is where
    they are also given an example plan of action to make sure that everything gets
    patched up. The clearer you make this stage for the client, the better you will
    be at your job and the more likely it will be that your client is able to fix
    the problems and secure the network.


    ## Retesting

    This is not a stage that everyone is willing to go through as penetration testers,
    but it is an important one if you want to do a thorough job in doing so. During
    this stage, you will give the client time to look through their own vulnerabilities
    and attempt to repair them and you reevaluate their attempts to bolster their
    defenses. You will essentially retest the parts that were fixed in order to see
    that they actually did patch up any vulnerability that was there. You may not
    always be asked to do this, but if you are, it is always an act of good faith
    to go through with it.


    ## Chapter 6: How to Become and Remain Anonymous

    Anonymity is crucial if you hope to be a hacker, no matter the kind. If you are
    not careful, it becomes incredibly easy to simply blacklist your specific IP address
    and you no longer have that access. Instead of managing to get through the system
    or finding any exploits, you instead end up banned and unable to do anything.
    However, that does not have to be your fate if you are trying to hack—you can
    instead cover your tracks.


    Just as many burglars will wear gloves in order to hide their fingerprints from
    the system that they are trying to access, making sure that you put on your own
    metaphorical digital gloves can help you remain anonymous. This means that your
    information will be private—you will be able to disguise yourself and your software
    in order to make sure that your real IP address is not being used.


    Now, you may be thinking, what if you are using a virtual machine? Would that
    not have a digitized IP address or be hidden more because the entire thing is
    digital? Yes and no—however, that is still only as secure as the network that
    you are using. This means that if you really want true anonymity, you are going
    to want to involve the usage of something else as well. You are going to want
    to add in extra tools and precautions to arm yourself against your IP address
    is found out. When you are able to fight it off, you are more likely to remain
    anonymous.


    There are several tools out there that would be able to aid you with the process
    of being anonymous and protecting yourself, all built within Kali Linux and ready
    to be used. All it will take is the time and effort to configure everything, but
    it will be well worth the effort. The three methods in particular that will be
    discussed within this chapter will be proxy servers, VPNs, and the use of TOR.
    Within each section, you will be guided through what the particular method is,
    how it works, and how to use it with Kali Linux.


    ![](image_rsrcUZ.jpg)


    ### Proxychains

    Perhaps one of the simplest methods to obscure your IP address is through the
    use of a proxy server. Through using chains of proxies, you are able to obscure
    your tracks, making them harder to follow. In making them more difficult to follow,
    you will be more likely to avoid detection. When you use a proxy, of course that
    proxy is logging your information. However, you can get around this as well—you
    can string together several proxies together in a chain. So long as at least one
    proxy is able to be outside of the jurisdiction of the target, you should be able
    to avoid the problem altogether.


    ![](image_rsrcV0.jpg)


    Luckily, within Kali, you have access to a tool known as `Proxychains`. This can
