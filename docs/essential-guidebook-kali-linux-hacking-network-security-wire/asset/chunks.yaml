    Your scanning can even get more specific as well—you can start to specify exactly
    which ports are to be targeted if you have the right codes as well.


    # Scanning Techniques and Commands


    Of course, there are other types of scans that you can perform as well. `Nmap`
    has several different scanning techniques available that will be necessary for
    you to know to be effective. This section will provide you with the information
    you will need to use several other scan types as well.


    ### TCP SYN Scan

    Commanded with the prompt `-sS` the TCP SYN scan is a basic scan. It is commonly
    referred to as half-opening because it gathers information from the remote host
    without finishing the TCP process that was discussed earlier in this book.


    In this sort of scan, `Nmap` seeds out an SYN packet to the right destination
    but never bothers to actually create or trigger a session. In the end, the interaction
    never gets logged by the target computer because the computer never initiated
    a session. This is what makes TCP SYN scanning so beneficial. This is used by
    default, though you will need root access. Of course, if you are using Kali Linux
    as you do this, there will be no problem, as you will be in the root account by
    default. A command for this sort of scan looks like:

    ```

    nmap -sS 192.143.1.1

    ```


    ### TCP Connect() Scan

    When the SYN scan cannot happen for any reason, this will be the default scan
    that is used. With the code of `-sT` in order to utilize this scan, your system
    will instead complete the TCP handshake process, requiring the other system to
    log the transaction. This is only good for finding TCP ports rather than any others
    . To use this code, you would have a command such as:

    ```

    nmap -sT 192.143.1.1

    ```


    ### UDP Scan

    This scan seeks out open UDP ports in whatever the targeted machine is. It does
    not make use of an SYN packet due to the targeting of a UDP port instead. However,
    you are still able to make this more efficient if you use the `-sS` and `-sU`
    commands together.


    In using this scanning method, `Nmap` sends out a UDP packet and waits for some
    sort of response. An error message implies that the port is closed, but a proper
    response will let you know that the port is actually open and accessible. In this
    case, you will use the following command:

    ```

    nmap -sU 192.143.1.1

    ```


    ### FIN Scan

    Sometimes a TCP SYN scan would not necessarily be the right choice based on the
    parameters that you have been provided. Usually, a firewall will cause a block
    from the SYN packets, so you will need to go through another method. When this
    happens, you can try to make use of a FIN scan—this only sends a FIN flag, meaning
    it does not require the completion of the TCP transaction that would otherwise
    trigger the detection of `Nmap`. The proper command for a FIN scan is `-sF` such
    as:

    ```

    nmap –sF 192.143.1.1

    ```

    Which then brings back plenty of information—it should provide whether the host
    is up or down, what the latency is, and the state of the port. The target does
    not log this scan, but you are able to get the information.


    ### Ping Scan

    Unlike the other forms that have been discussed thus far, ping scanning is only
    used to determine if the host is currently alive or active. It does not discover
    whether a port is open. It does require root access, as there is the potential
    to send out ICMP packets. When there is no root access granted, it will complete
    the command using `connect()` call. The command for a ping scan is `-sP` and it
    would be used:

    ```

    nmap -sP 192.143.1.1

    ```


    ### Version Detection

    This is the command you need if you want to determine what kind of software is
    being used on the target computer or any ports. It does not detect any open ports,
    though it does need to get the information from any open ports in order to provide
    the information on the software that has been detected. The first step here would
    be to find a port that is open with a TCP SYN scan and then direct the `-sV` to
    the specific port available:

    ```

    nmap –sV 192.143.1.1

    ```


    ### Idle Scanning

    In an idle scan, you are able to maintain your invisibility while scanning. In
    this particular technique, you do not send out any real packets from your own
    IP address. Instead, it takes a host from within the target network in order to
    send out packets. This will require you to first figure out an open port within
    the IP and then uses a zombie host in order to communicate with the target. In
    this code, you will use first the IP of the zombie host and then the IP of the
    target in order to create a command of:

    ```

    nmap -sI 192.143.1.4 192.143.1.1

    ```

    In this instance, the zombie host of `192.143.1.4` is being used to communicate
    with `192.143.1.1` without detection since they are a part of the same network.


    # Penetration Testing

    Ultimately, penetration testing can be broken down into seven steps or phases—when
    you are able to get through these phases, you are more likely to find some sort
    of weakness or vulnerability. In utilizing these phases, you will find that your
    own ability to break through a system grows. You will be more likely to crack
    through, which means that you are more likely to identify any of those weaknesses
    that you need to patch in your own system.


    The phases of penetration testing are pre-engagement, reconnaissance, threat modeling,
    exploiting, post-exploit, report, and re-test. You will be guided through each
    of the steps during this section of this chapter.


    ![](image_rsrcUY.jpg)


    ### Pre-Engagement

    This particular step is more like a precaution, but it is crucial—when you are
    in the pre-engagement stage, you need to begin by figuring out the test’s scope.
    Essentially, you are looking for the exact goals of your attempt to penetrate
    the network. You need to ensure that you know what you are planning out so you
    do not do anything unintended. Especially if you will be performing this as a
    possible career path, you need to get into the habit of laying out what you are
    going to do and what the limits on what you are and not allowed to do are. You
    need to know what is expected for you to do and which networks you should be on.
    Note it all down. If you are trying to crack into someone else’s network at their
    behest, make sure you cover yourself legally and get signed documentation stating
    that you are working at their request and within their terms. Because penetration
    testing is dangerous by virtue of it attempting to chip away at security measures,
    you want to make sure that you are safe from being blamed if something were to
    go catastrophically wrong, which can occasionally happen.


    ### Reconnaissance

    At this stage, you are going to work on gathering information. While you may prefer
    to skip over this if you can get away with it, you are going to be more prepared
    if you actually know what you are doing. When you have the information that you
    need all lined up neatly in front of you, you will know what you expect. In particular,
    you may want to gather information about the network you are targeting or the
    most likely types of technology you will be encountering. You may want to have
    personal information about the people that you are trying to hack into, or about
    their email addresses.

