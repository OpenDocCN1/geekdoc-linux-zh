    `msfdb status` 此命令将允许终端打印当前数据集的状态，向你显示终端内部所有的基础数据。


    ## Metasploit 数据存储 (Datastore)


    除了为止记录的所有内容外，还有一个数据存储器——这是 Metasploit 系统中另一个经常被忽视的核心部分。这是一系列允许你在 Metasploit 结构内设计任何你想要属性。数据存储器允许接口更改设置，而有效负载可以修复操作码，并利用它可以确定明确的边界。这同样考虑了系统在模块之间进行传递。


    具体来说，Metasploit 有两个不同的数据存储：全局数据存储和模块数据存储。你应该熟悉这两者才能有效利用 Metasploit。


    全局数据存储可以被所有使用它的模块考虑。当设置了数据存储选项时，所有模块都会访问它。要刻描述全局数据存储选项，你应该使用命令：`setg`


    而模块数据存储则被设计为仅让分配的模块实际使用它，而不是所有人。


    ## Metasploit 工作空间 (Workspaces)


    Metasploit 内部的工作区域允许你对数据集中的主机和信息进行划分。这允许你利用工作区域在你想要测试的任何部分之间建立分区。例如，想象你为你协会内的每个子网都需要一个工作区域，因为你需要将主机数量限制在一个预定的范围内。这将导致你创建工作空间，例如每个部门一个。这意味着每个协会的专业部门将拥有自己的工作空间。


    当你使用工作区域时，你可以导入信息、控制这些信息，然后将这些信息交换出去，以确保信息可以自然地重用。这同样考虑了类似的工作区域，以便报告关于任何正在锁定的主机的任何信息。这允许漏洞等信息进行传输。


    如果你想创建一个工作区域，你应该使用工作区域命令并带有 `-` 选项来这样做。你创建的任何工作区域都会变成当前正在使用的。简单想象一下，你为组织中的 A、B、C
    三个部门需要一个。


    你会写：

    ```

    msf workspace -a A

    msf workspace -a B

    msf workspace -a C

    ```


    总的来说，显然，假设你准备好使用 Metasploit，你应该注意到与之交互完全是容易的。你只需要知道如何浏览框架以及如何获取你正在查看的内容。一旦你知道哪些模块是可用的，例如，你实际上会想要选择那些对你有用的模块。因为
    Metasploit 已经为你充满了各种信息，这些信息旨在确保你只需少数命令就能完成几乎任何事情，而不需要不断地手动告诉系统你想让它做什么，所以它非常容易理解。这实际上它变得如此受欢迎的原因。最终，你应该能够接受
    Linux 附带的免费形式。尽管如此，如果你愿意付费，就有可用的更新，最后，这将取决于你私人的观点，你应该根据你自己的思考和需求进行选择。显然，更新的版本尽管标着惊人的高价，但其目的是为你提供不可思议的绝妙体验。它们专注于那些清楚知道自己在做什么以及想要什么的非常有天赋的渗透测试专家，他们可以证明那个高昂的价格是合理的。然而，你并不需要这样做。


    ## 第 8 章：数字证书


    就像现实世界中，我们需要携带身份证明来证明我们是谁，特别是当我们做重大事情时（例如买车或贷款），你的互联网连接也需要某种程度的身份识别。这就是计算机认证用武的地方。当服务器加载了大量数据时，你可能需要确保你的数据始终尽可能安全——这听起来没问题。然而，你如何确保获取你服务器上数据的人真的是他们所说的人，或者确实被允许访问它？


    特别是现在，当我们如此担心信息被窃取或受控时，感到我们的信息处于危险之中并不困难，而且理由充分——事实如此。当你提供了一层计算机认证时，无论如何，你都为你的服务器增加了额外的安全层，或者让你感觉私有数据是安全的。你可以确保，无论你如何使用可能位于公共网络上的目标，你的信息本身是经过认证的。


    但如果你有一个局域网 (LAN)，你可能不需要这种在使用公共组织进行信息传输时出现的重大认证。支付这些证书的费用与风险相比可能是多余的。在这些示例中，获取组织的明智计划是使用你本地的
    CA 或验证机构——这将对引入局域网内的任何证书进行签名以确保其服务器的安全。


    通常，这是通过一个名为 `OpenSSL` 的工具完成的——它是 Kali Linux 预装的。我们将讨论如何在几秒钟内创建认证，但在此之前，我们将首先回到基础数据。


    这部分将最初检查什么是计算机认证以及存在的证书专家。从那时起，将引导你如何在基于 Kali Linux 的 Web 服务器上创建高级认证。创建自己的高级认证的能力无疑有其自身的用途，但也伴随着它自己的问题。无论如何，如果你觉得它对你有价值，你可以完全去寻找它。无论如何，这更多


