    这一阶段应该尽可能残酷且诚实——你要让对方确切知道发生了什么以及如何修复。如果他们的系统确实那么容易受到攻击，而且你能够访问所有内容，那就尽管放手去做。用客观但诚实的术语准确地告诉他们问题到底出在哪里。在这个阶段，他们还会获得一份示例性的行动计划，以确保所有漏洞都得到修复。你向客户说明这一阶段得越清晰，你的工作表现就越出色，客户修复问题并保护网络的可能性也越大。


    ## 重测

    作为渗透测试员，这并不是一个每个人都愿意经历的阶段，但如果你想做到尽职，那么它是至关重要的。在这个阶段，你将给客户时间来检查他们自己的漏洞并尝试修复，而你将重新评估他们加强防御的尝试。你基本上将对已修复的部分进行重新测试，以确认他们确实修补了存在的任何漏洞。你并不总是被要求这样做，但如果被要求了，完成它始终是一种诚意的表现。


    ## 第 6 章：如何成为并保持匿名

    如果你希望成为黑客（无论是哪种），匿名性都是至关重要的。如果你不小心，系统只需非常简单地将你的特定 IP 地址列入黑名单，你就再也无法获得访问。你不仅没有成功进入系统或发现任何漏洞，反而会被封禁并无能为力。然而，如果你尝试进行黑客，这不必成为你的命运——你可以掩盖自己的踪迹。


    就像许多入为了为了从试图访问的系统中隐藏指纹而戴手套一样，确保戴上自己的虚拟数字手套有助于你保持匿名。这意味着你的信息将是私密的——你可以伪装你自己和你的软件，以确保不使用真实的
    IP 地址。


    现在，你可能在想，如果使用虚拟机呢？它难道没有数字化的 IP 地址或不会因为整个过程都是数字化的而更加隐蔽吗？是也不是——但是，它的安全性仍然取决于你所使用的网络。这意味着，如果你真的想要真正的匿名，你还需要使用其他东西。你需要添加额外的工具和预防措施，以防止你的
    IP 地址被发现。当你能够抵御这种情况时，你更有可能保持匿名。


    市上有几种工具可以帮助你实现匿名并保护自己，它们都内置在 Kali Linux 中并已准备就绪。只需要花费时间和精力来配置一切，但这是非常值得的。本章将特别讨论的三种方法是：代理服务器、VPN
    和 TOR 的使用。在每个章节中，你将引导了解这些特定方法是什么、工作原理以及如何在 Kali Linux 中使用它们。


    ![](img/image_rsrcUZ.jpg)


    ### Proxychains

    也许隐藏 IP 地址最简单的方法之一就是使用代理服务器。通过使用代理链，你可以掩盖自己的踪迹，使其更难被追踪。通过增加追踪的难度，你更有可能规避检测。当然，当你使用代理时，该代理会记录你的信息。但是，你也可以绕过这一点——你可以将多个代理串联成一条链。只要至少有一个代理位于目标管辖范围之外，你就应该能够完全避免这个问题。幸运的是，在
    Kali 中，你可以使用名为 `Proxychains` 的工具。你可以在目录中找到它，可以使用 `location` 命令查看。它可能位于 `/usr/bin`
    目录。


    在使用 `Proxychains` 时，你将使用一个非常简单的命令：


    ```

    # proxychains [输入被代理的命令] [添加任何参数]

    ```


    现在，假设你想用它配合 `Nmap` 进行匿名且通过代理的扫描。可能具体来说，你想对 IP 地址 `192.143.1.1` 进行 TCP SYN 扫描，但你想通过该工具利用代理来完成。在这种情况下，你创建一个命令行提示符：


    ```

    # proxychains nmap -sS 192.143.1.1

    ```


