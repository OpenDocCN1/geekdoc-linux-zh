    此时，假设你点击 `Network Manager` > `VPN Connections` > `PrivateInternetAccess VPN`，你应该能看到一个黄色的关联标记。你的
    VPN 目前已准备就绪。


    ## Tor 与 Kali Linux

    Tor 是安全保护伞中的另一层防护，你可以通过它来确保自己的安全。这仅仅是另一项安全防护措施，但假设你利用了它，你会发现自己真的已经准备好真正保护自己了，特别是当你开始将这些安全技术层层叠加，以在最大范围内确保你的秘密性时。请记住，`Kali
    Linux` 目前是安全的，但你可以使用其归包中的工具为它添加额外的层。Pinnacle 是 Kali Linux 工具集中自带的这些特定工具之一，可以帮助保障你的安全。Tor
    本身是免费软件，它将通过让你的通信在几个不同的组织节点之间有效跳转来确保你的安全。基本上，这是一个由全球志愿者组成的庞大组织。他们帮助不规律地移动你的数据，这样数据实际上无法被无缝地追踪。通过不断将你的数据从一个地方移动到另一个地方，你最终使你的信息变得极其安全。你的经历将不会被有效追踪，你访问的地点也无法准确得知你的物理位置在哪里。实际上，你阻止了自己被发现，因为全世界的人都在不受控地传输你的消息和数据。一个请求可能从美国开始，另一个出现在西班牙，再一个出现在德国。特别是当你将此与最近研究的真实匿名技术相结合时，你变得极其难以追踪。你不仅会有一系列不同的
    IP 地址通过，这些 IP 地址还会被你的 VPN 加密和保护，随后你还会确保你的网络访问是通过 Tor 而不是通过你的常规方法。


    当你需要在 Kali Linux 机器上使用 Tor 时，你应该手动引入。由于你使用的是 Kali，你作为根客户端是安全的，这意味着你无法使用通常准备使用的简单模式。与其拥有使用任何替代路由的选项，不如你应该手动下载
    Tor 安装包。


    你可以通过 Tor Project 官网执行操作。你需要从他们的网站获取下载包，然后从 GitHub 下载 `torbrowserlauncher`。确保你下载了适合你设计的文件，并将其保存到你可以访问的地方。然后，利用
    `tar` 命令从下载目录解压包。你可以运行以下命令：


    ```bash

    tar –xvf tor

    ```


    请注意，该命令假设你索引目录下以“pinnacle”开头的文档是你的 Tor 下载记录。然后，你需要运行 Tor Browser Bundle。这需要你运行刚刚解压的启动程序脚本：


    ```bash

    ./start-tor-browser.desktop

    ```


    执行此操作后，你会看到 Vidalia 启动并与 Tor 关联。在与 Tor 关联后，Firefox 将启动。如果你能使用这三种独特的安全组合，你很快就会发现自己真的准备好极大防御真实网络中的危险了。你能够确保
    IP 地址不会被发现，特别是当你尝试某些 Kali Linux 用户感兴趣的特定领域时，例如可能会引起问题的渗透测试。


    ## 第 7 章：Metasploit 框架

    渗透测试在书中已经经过了很好的讨论，但它会被再次提到。在 Kali Linux 中，你被允许访问大量的优秀工具，这些工具可以帮助你的黑客攻击、渗透测试以及寻找漏洞或后门的过程。渗透测试的一种尚未在此检查的设备是名为
    Metasploit Framework 的工具。这个特定工具可以使用命令行或 GUI。它也可以作为一种辅助技术，用于各种目的。这台设备非常出色，网络犯罪分子和道德程序员都因为该程序的便利性而使用它。


    具体来说，Metasploit 考虑了检查组织或服务器内部的任何有序漏洞，并且它是开源的，这意味着该框架可以轻松调整以适用于任何人和几乎任何操作系统。


    ### 什么是 Metasploit？

    具体来说，Metasploit 指的是被使用的一种特定工具。使用它的渗透测试小组实际上想要使用当时为他们编写的代码，或者他们自己编写并注入组织的自定义代码。通过这样做，特定组织内部的缺陷被发现并被考虑进来。这意味着他们可以处理该组织的缺陷以便进行修复。


    实际上，Metasploit 只是另一种利用工具，类似于 `Nmap`，尽管它的用途不同。无论如何，必须认识到实际工具本身并不是邪恶或不可信的。实际工具旨在供道德黑客使用。Metasploit
    项目于 2003 年成立，作为一个基于 Perl 的通用框架工具。尽管如此，到 2007 年，它被转换为 Ruby，并随后获得了 Rapid7 的授权并一直保留在那里。Metasploit
    系统中的部分工具比 Metasploit 本身大，包含了一些在 Kali Linux 中经常使用的不同工具。这些工具都有不同的用途，而 Metasploit
    系统已成为开发和维护的默认选择之一。在此之前，测试通常必须物理执行，使得渗透测试变得异常缓慢、耗时且枯燥。该系统甚至发展到包含一些限制性工具，而不是集成到
    Kali Linux 中的免费贡献。这些工具（如 Metasploit Pro 和 Metasploit Express）有它们自己的优势，但如果你不想使用它们，它们也是必要的。


    ### Metasploit 用户

    由于 Metasploit 应用范围之广，它既被那些希望让自己的工作框架和服务器更安全的道德程序员使用，也被那些真正出于恶意目的入侵操作系统的人使用。尽管如此，它仍然非常强大的工具，并不难引入且非常有用。无论你决定使用哪种语言或哪个阶段，Metasploit
    都应该可以工作，这也是为什么 Metasploit 在任何情况下都是著名的原因之一。目前，Metasploit 包含了超过 1600 个针对 25 个不同阶段的漏洞，并提供了近
    500 个负载。这一切造就了它成为人们真正非常珍惜的惊人资产。部分负载包括：


    - 命令 Shell 负载：它们允许人们针对不同的目标或主机运行脚本或命令。

    - 动态负载：它们允许渗透测试人员在尝试规避任何杀毒软件时产生独特的负载。


