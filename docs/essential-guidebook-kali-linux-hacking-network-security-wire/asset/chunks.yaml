    你的扫描甚至可以更加具体——如果你拥有正确的代码，你还可以开始精确指定要针对哪些端口。


    # 扫描技术与命令


    当然，你还可以进行其他类型的扫描。`Nmap` 提供了几种不同的扫描技术，为了能够高效工作，你对了解这些技术是很有必要的。本节将为你提供使用其他几种扫描类型所需的信息。


    ### TCP SYN 扫描

    TCP SYN 扫描通过命令 `-sS` 执行，是一种基础扫描。它通常被称为“半开放”扫描，因为它从远程主机收集信息，而无需完成本书之前讨论过的 TCP 进程过程。


    在此类扫描中，`Nmap` 向正确的目标地址发送一个 SYN 数据包，但从不费力去创建或触发会话。最终，目标计算机永远不会记录这种交互，因为计算机从未启动过会话。这正是
    TCP SYN 扫描非常有益的之处。虽然它是默认使用的扫描方式，但你需要 root 权限。当然，如果你在 Kali Linux 上进行此操作，那将没有问题，因为你默认就是
    root 账户。此类扫描的命令如下：

    ```

    nmap -sS 192.143.1.1

    ```


    ### TCP Connect() 扫描

    当由于任何原因无法进行 SYN 扫描时，将使用默认扫描方式。通过代码 `-sT` 来利用此扫描，你的系统将完成 TCP 握手过程，这将另一个系统记录该事务。这仅适用于寻找
    TCP 端口，而不是其他端口。要使用此代码，你使用的命令如下：

    ```

    nmap -sT 192.143.1.1

    ```


    ### UDP 扫描

    此扫描寻找目标机器上开放的 UDP 端口。由于目标是 UDP 端口，它不使用 SYN 数据包。然而，如果你结合使用 `-sS` 和 `-sU` 命令，仍然可以提高其效率。


    在使用这种扫描方法时，`Nmap` 发送一个 UDP 数据包并等待某种响应。错误消息意味着端口已关闭，但正确的响应将让你知道端口实际上是开放且可的。在这种情况下，你将使用以下命令：

    ```

    nmap -sU 192.143.1.1

    ```


    ### FIN 扫描

    有时根据你提供的参数，TCP SYN 扫描并不一定是正确选择。通常，防火墙会拦截 SYN 数据包，因此你需要通过另一种方法。发生这种情况时，你可以尝试使用
    FIN 扫描——它只发送一个 FIN 标志，这意味着它不需要完成会触发 `Nmap` 检测的 TCP 事务。FIN 扫描的正确命令是 `-sF`，例如：

    ```

    nmap –sF 192.143.1.1

    ```

    这会返回大量信息——它应该提供主机是在线还是离线、延迟是多少以及端口的状态。目标主机不会记录这次扫描，但你可以获取这些信息。


    ### Ping 扫描

    与迄为止讨论的其他形式不同，ping 扫描仅用于确定主机当前是否存活或活跃状态。它不发现端口是否开放。这需要 root 权限，因为存在发送 ICMP 数据包的可能性。在没有授予
    root 权限的情况下，它将使用 `connect()` 调用完成命令。ping 扫描的命令是 `-sP`，用法如下：

    ```

    nmap -sP 192.143.1.1

    ```


    ### 版本检测

    如果你想确定目标计算机或任何端口上使用的是什么软件，就需要此命令。它不检测任何开放端口，尽管它确实需要从任何开放端口获取信息，以便提供关于检测到的软件的信息。这里的第一步是用
    TCP SYN 扫描找到一个开放端口，然后将 `-sV` 指向特定的可用端口：

    ```

    nmap –sV 192.143.1.1

    ```


    ### 空闲扫描

    在空闲扫描中，你可以在扫描时保持你的隐身性。在这种特定技术中，你不会从自己的 IP 地址发送任何真实数据包。而是利用目标网络内部的一个主机来发送数据包。这需要你首先确定该
    IP 内的一个开放端口，然后使用“僵尸主机”与目标进行通信。在此代码中，你将首先使用僵尸主机的 IP，然后是目标的 IP，以创建如下命令：

    ```

    nmap -sI 192.143.1.4 192.143.1.1

    ```

    在这种情况下，使用僵尸主机 `192.143.1.4` 与 `192.143.1.1` 通信，而不会被检测到，因为它们属于同一个网络。


    # 渗透测试

    归根底，渗透测试可以分为七步或阶段——当你能够通过这些阶段时，你可能会发现某些弱点或漏洞。在利用这些阶段时，你会发现自己攻破系统的能力在增长。你更有可能破解成功，这意味着你更有可能识别出你自己的系统中需要修复的任何弱点。


    渗透测试的阶段包括：介入前准备、侦察、威胁建模、利用、利用后处理、报告和重测。在本章的这一部分中，你将在指导下完成每一个步骤。


    ![](img/image_rsrcUY.jpg)


    ### 介入前准备

    这一步骤像是一种预防措施，但它是至关重要的——当你处于介入前准备阶段时，你需要从确定测试范围开始。本质上，你是在寻找尝试渗透网络时的确切目标。你需要确保知道自己正在计划执行什么，以防发生任何无意之外的操作。特别是如果你将此作为一种可能的职业路径，你需要养成列出你将要做什么，以及你被允许和不能做的事情限制的习惯。你需要知道对方期望你做什么，以及你应该在哪些网络上。将所有内容记录下来。如果你是应人的要求破解他人的网络，请确保在法律上保护自己，并获得签署过的文件，证明你是在应其要求并在其条款内工作。因为渗透测试由于其试图削弱安全措施而具有危险性，所以你想要确保在发生灾难性错误时不会被指责，尽管这种情况偶尔会发生。


    ### 侦察

    在此阶段，你将致力于收集信息。虽然你可能倾向于在可行的情况下跳过这一步，但如果你真的知道自己在做什么，准备会更加充分。当你所需的信息整齐地排列在面前时，你就会清楚预预期什么。特别是，你可能想要收集有关目标网络或可能遇到的各种技术类型的信息。你可能想要获取你试图破解的人的个人信息，或者他们的电子邮箱地址。

    '
