    ![](image_rsrcV4.jpg)Meterpreter payloads: They allow for the overtaking of device
    monitors to overtake other sessions![](image_rsrcV5.jpg)Static payloads: They
    enable ports to be forwarded and communications to be had between networks.


    # Metasploit Modules


    There are a few modules included inside Metasploit. These are center parts — programming
    that have unmistakable activities that they should perform. These likewise address
    the activities that you can accomplish inside the Metasploit structure. These
    modules are promptly found: you should simply find the accompanying repository:`/path/to/metasploit/apps/pro/msf3/modules`


    The module type will be dictated by the motivation behind that specific one, just
    as the activity that the specific module is liable for. Specifically there are
    eight that are deserving of talking about. These include:


    ![](image_rsrcV6.jpg) **Exploits**: Exploit modules are designed to execute a
    series of commands that then target a vulnerability that has been discovered within
    the targeted system or application. This module is designed to take advantage
    of any vulnerability in order to provide access to whatever the target system
    is. There are several different examples of exploit modules, such as code injection
    and web application exploits.


    ![](image_rsrcV7.jpg) **Payloads**: A payload refers to a shell code that runs
    after the exploit has managed to compromise the system at hand. The payload allows
    you to decide exactly how you want to be able to connect to the shell and what
    it is that you want to be done to the target after you have taken control of it.
    It can involve opening a meterpreter or a different command shell. The Meterpreter
    is specifically an advanced type of payload that allows for the writing of DLL
    files, allowing for new features as you need them to be created.


    ![](image_rsrcV8.jpg) **Encoders**: The encoders are critical tools that are able
    to convert one form of code into another.


    ![](image_rsrcV9.jpg) **Listeners**: Malware that is designed to hide to listen.
    When they are able to listen, they are able to gather up all sorts of important
    information, allowing for sensitive information, such as passwords, social security
    numbers, or other information that people would largely like to keep private to
    be leaked.


    ![](image_rsrcVA.jpg) **Auxiliary function**: Tools and commands meant to supplement
    the other functions of the device


    ![](image_rsrcVB.jpg) **Shellcode**: Code programmed to activate as soon as it
    is inside the target in order to do specific purposes, allowing for a more discrete
    way to get in and activate.


    ![](image_rsrcVC.jpg) **NOP generator**: This is a tool that is able to produce
    a series of random bytes that are designed to bypass any standard IDs in order
    to get past firewalls or important blockages.


    ![](image_rsrcVD.jpg) **Post-exploitation code**: The post-exploitation modules
    allow you to get more information or manage to steal further access within an
    exploited target. These include hash dumps or service enumerators.


    # Using Metasploit


