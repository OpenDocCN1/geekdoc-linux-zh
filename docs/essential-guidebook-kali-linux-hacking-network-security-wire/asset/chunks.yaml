    揭开它们并相互取代其中之一。虽然我们目前已经讨论了在 shell 中运行你的 `Python` 代码是可行的，但同样也可能超出每个人的预期——你不仅可以在
    shell 内部展示你的 `Python` 脚本，也可以将你的 shell 脚本嵌入到 `Python` 中。你只需要导入 `OS` 模块即可。


    ### 集成 Shell 和 Python


    假设你这样做了，你实际上可能也想在 `Python` 中利用你的 `shell` 命令——这意味着你已经成功地准备好轻松地混合和协调你的命令。想一下那些在家里用两种方言交流长大的孩子，他们通常可以在同一个句子中无缝地从一种语言切换到另一种，在单一句子中嵌入几种语言的单词，同时交替地嵌入部分不同的方言，这听起来是很困难的，但他们却做得如此轻松。这就是你如何通过嵌入
    `shell` 来使用 `Python` 的。


    为了将 `shell` 语言带入 `python`，你只需要执行：


    ```bash

    $ python >>>from os import *>>> system (‘sudo apt-get update’)

    ```


    现在你就可以同时处理这两种语言了。你应该完全尝试摆弄这两种方言。假设你对 `Python` 仍然感到好奇，你可能会倾向于学习它——它非常容易上手，而且假设你已经准备好与
    `Linux` 对话，那么你也应该有机会理解 `Python`。你所做的只是将曾经用于培养 `Linux` 能力的部分精力投入到获取这个框架中来。你可能会发现，随着实用性的增强，你会很快习惯这种变化。


    如果你不确定你的框架上是否已经安装了 `Python`，那么幸运眷临了你——这时，你应该输入以下命令：


    ```bash

    $ python --version

    ```


    你无疑会获得一个更成熟、稳定的 `Python` 版本，这足够了，但你可能需要将该结构更新到最新版本。这个版本在不断变化，所以如果你在读完这本书后检查你可用的版本，将是一件好事——你基本上可以通过在网络上寻找最新版本然后进行更新来完成。


    如果你确实选择专门追求 `Python`，你将需要去寻找一些工具和书籍，就像你现在正在阅读的这书一样，以发现你想了解的知识。教程练习和网络示例无疑是你开始探索
    `Python` 不同途径的极佳敲门石。最后，当你变得越来越熟练和熟悉时，你可能会选择开始将你的努力结合起来使用。你甚至可能会发现自己更倾向于使用 `Python`
    而不是 shell，这也可以。最终，创新的变化之快，到你无法因为害怕改变、发展或转向一个真正的新事物而停滞不前——进步和学习对你完全有利。


    ### 向前看


    现在，随着本章节和本书接近尾，这是你开始思考如何整合一切的理想时机。是时候考虑你是否真的对 `Kali Linux` 感兴趣，或者你是否有机会学习一些不同的东西。毫无疑问的是，你最终应该引导自己和自己的选择，以确保你对所决定要做的事情感到满意。


    #### 结论


    恭喜你——你已经来到了《Kali Linux Hacking》的极限。这本书被设计成一门学习 `Kali Linux` 的速成课程——该操作系统专门为渗透测试专业人员设计，用于发现和修复系统中发现的任何类型的漏洞或利用程序。假设你已经走到了这里，你可能对
    `Kali Linux` 的介绍深受启发，或者你将这本书作为辅助工具，无论其中哪一个保持恒不变，感谢你与我共同走这段旅程。


    在书中，你获得了关于 `Kali Linux` 的基础知识。再次更新，`Kali Linux` 绝不是一个业余者的 `Linux` 发行版。如果你读了这本书并且在某些主题上完全迷茫，这没关系——但你可能更适合从一本针对新手的书开始，而不是一本为那些知道自己在做什么并渴望改进及更多的人准备的书。


    最终，你的下一步完全取决于你自己以及你认为自己需要做什么。你想在真实的 `Kali Linux` 交付中进行练习吗？你可以查阅数据并投入精力引入你自己的副本，以便你可以开始使用和发现它。如果你觉得
    `Kali Linux` 不适合你，无论是因为它太难、太不同，还是仅仅是因为你不知道自己在做什么，那么你从更简单的东西开始，如 `Ubuntu` 和 `Mint`
    可能会更合适。


    是的，这一点被重复了几次，因为它非常重要。即使在读完这本指南后，如果你对自己和自己的能力完全没有信心，那么在建立技能期间暂时放弃 `Kali Linux`
    可能会更好——这没关系。


    也许现在，你已经接受了本书最后一章节的劝告，并选择了同样探索 `Python`，完善你的规划能力，以便你实际上会更乐意使用你自己的命令。这也是一个极佳的选择，并将有助于引导你的旅程，因为你将拥有多得知识。


    无论你立即决定做什么，无论是寻找关于 `Linux` 的更多信息，还是尝试如何最好与你已经引入的 `Kali Linux` 协作，有一件事是不疑问的：你理想地在阅读书中掌握了一些东西。

