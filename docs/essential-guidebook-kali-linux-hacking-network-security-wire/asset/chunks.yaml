    你基本上是在向服务器发送请求，并预期的它会在另一端返回合法的响应。这是最简单的 Linux 命令的原理。为了方便操作，假设已经过去了一段时间，你可以将终端复制到图形化界面中，这样你就可以看到可以阅读和理解的信息与结果了。假设你现在有
    Linux 或 OS X，你现在进入终端（Terminal），你也可以引入其他终端。如果你是 Windows，你可能需要引入 `PuTTY`。Kali Linux
    内部也包含它自己的终端，你可以轻松访问。


    ## 命令提示符

    当你与终端通信时，你正在使用命令提示符（command prompts）或 shell 提示符（shell prompts）你在阅读不同的指南时可能会反复看到这些术语。当你进入终端时，你会看到一段非常明显的简写。它将包含客户端的用户名、服务器的主机名、你所在的索引以及简写符。很多时候，你看到的简写符是
    `$`。实际上，假设你的客户端用户名为 `programmer`，你所处的服务器是 `hacking`，且你目前处于默认主目录，你可能会看到如下默认提示符：`hacker@hacking:~$`


    在 Kali Linux 中，你始终登录在单个 root 客户端账户上。你会看到用户名 `root`，而不是 `programmer` 或任何其他可能存在的名称。


    ## 执行命令

    当你想要执行命令时，你必须以系统能够正确处理的方式指定你想要的内容。你可以输入一段内容，一组建议的数据序列，这将触发框架针对特定目标做出响应。你也可以输入你自己的命令。这将是当前部分的大部分内容：关联和排序服务器的方法。


    当一个命令运行时，它被称为一次交互（interaction）。当这种交互在前台发生时，你应该等待它完成后才能进行任何其他操作。这是运行程序的默认方法。


    你也可以通过两种结构输入你的命令：带参数或不带参数（contentions）。当你输入一个不带参数的命令时，你输入的是一个基础命令，不期望其他任何。这将让电脑精确地发送你确定的内容，或精确地执行你所说的事情。例如，如果你编写
    `ls`，你将立即在屏幕上列出之前的所有内容——当前注册表的记录和目录。


    然而，参数会尝试合理地调整该命令。通过添加参数，你增加了一个额外的条件——你可能会指示框架列出另一个索引的文档。你可能会指示框架在短时间内关闭而不是立即关闭。它们改变了第一个命令的重要性。当你输入带参数的命令时，你将按照特定的命令顺序输入它，然后是你正在运行内容的规范或位置。


    执行命令的另一种常见方式是使用选项（choices）——这意味着它们有一类型遵循的更改。这后面跟着一个 `-` 和一个字母，让框架知道你到底从中想要什么。例如，如果我们回到
    `ls`，你可能会决定给它添加另一个东西，比如 `ls -l`，这让你的框架知道你需要它列出更详细的权限列表，显然比通常包含的更多细节。


    你也可以混合和匹配，所以你可以将选项和参数结合起来——事实上，将两者合为一运行正确的命令是非常普遍的。


    从这里开始，你将获得几个 Linux 内部的命令，你会认为它们是有价值的。这些要么是一个非常棒的额外补充课程，要么你根本不需要这些数据。如果你不需要这些数据，或者你对自己探索
    Linux 框架的能力有信心，请直接离开这里并跳到下一节。无论如何，假设你并不完全确定自己探索产品的能力，那么至少花精力阅读给你的这份详尽命令列表可能是明智的。显然，如果你以后在任何时候觉得需要命令并需要确保你确实知道如何使用它们，你也可以随时返回这些数据。


    ## 存档

    此部分中的代码与你框架内的存档文件直接相关。它们将帮助你直接连接文件，无论是访问、移动还是与它们协作。


    ```

    tar cf archive.tar registry

    ```

    这将创建一个包含目录的 tar 包（`archive.tar`）。


    ```

    tar cjf archive.tar.bz2 catalog

    ```

    与上面类似，但 tar 包将使用 `bzip2` 格式进行压缩。


    ```

    tar czf archive.tar.gz index

    ```

    主命令的另一种变体。它将创建一个 `gzip`压缩的 tar 包（`archive.tar.gz`）。


    ```

    tar xf archive.tar

    ```

    这是上述的反命令。它将从 `archive.tar` 中提取数据。


    ```

    tar xjf archive.tar.bz2

    ```

    使用此从 `bzip2` 压缩的 tar 包中提取数据。


    ```

    tar xzf archive.tar.gz

    ```

    从 `gzip` 格式压缩的 tar 包中提取内容的命令。


    ## 目录导航

    这些代码将允许你快速方便地在目录移动。当你这样做时，你可以在空间之间移动，而无需手动一个一个地遍历目录。


    通过这种方式导航变得更容易。


    ```

    cd

    ```

    你将回到 `HOME` 目录。


    ```

    cd ..

    ```

    与上面类似，但有两个点。将你移动到上一级。例如，你在目录 2，它位于目录 1。你通过此命令进入目录 1。


    ```

    cd /etc

    ```

    你将进入 `/etc` 目录。


    ## 磁盘使用

    这些特定的命令与磁盘使用直接相关。它们允许你查看有关磁盘的各种信息，当你密切监控系统时是非常必要的。


    ```

    df -h

    ```

    通过此命令你可以查看磁盘的已用可用空间。


    ```

    df -i

    ```

    使用此查看挂载文件系统的已用可用索引节点（inodes）。


    ```

    du -ah

    ```

    以人类可读的格式（字节、兆、吉字节）显示所有对象和目录的大小。


    ```

    du -sh

    ```

    与上面类似，但只会显示当前工作目录的信息。


    ```

    disk -l

    ```

    当你需要查看硬盘的分区大小和类型时，使用此命令。


    ## 文件和目录命令

    本节中的命令将帮助你直接与系统内的文件和目录交互。它们允许你对文件进行各种额外的访问和使用，并让你充分利用系统和效率。


    ```

    cp fileA fileB

    ```

    此命令将文件 A 复制到文件 B。


    ```

    cp -r source_directory destination

    ```

    该命令将递归地将目录复制到指定的目录。如果位置已存在，将复制目录。如果位置不存在，将创建一个包含源目录文件的位置。


    ```

    ls -al

    ```

    命令将以详细格式列出目录中的所有文件。


    ```

    mv fileA fileB

    ```

    将 `fileA` 重命名为 `fileB`。它也可以移动文件。如果 `fileB` 是目录，命令将 `fileA` 移动到该目录。

    ```

    '
- fmt: '

    # File Operations


    `rm file` Removes the file in question. Most commonly known as deleting a file.

    `rm f file` “Forces” the deletion of a file. No confirmation prompt will follow
    this command. Be sure you intend to delete this file.


    `rm -r directory` Deletes a directory, along with its contents recursively.

    `rm rf directory` Use this when you want to “force” the deletion of a directory
    and its contents recursively. Again, be sure this is what you intend to do, as
    no confirmation will be asked.


    # File Transfers

    These commands act as your guide to moving around files from place to place as
    necessary in order to ensure that you are always able to put your files where
    you want them.


    `rsync -a /home /backups/` Will synchronize the home directory over to `/backups/home`.


    `rsync -avz /home server:/backups/` Compression enabled synchronization of files
    or directories between a local and remote system.


    `scp file.txt server:/tmp` Secure copies the file (in this case `file.txt`) to
    the `/tmp` folder on the server.


    `scp -r server:/var/www /tmp` Recursively copies all directories and files from
    the server to the current system’s `/tmp` directory.


    `scp server:/var/www/*.html /tmp` Copies overall `.html` files from the server
    to the local `/tmp` directory.


    # Hardware Information Commands

    These commands will provide you with all sorts of information about your hardware,
    ensuring that your hardware is functioning properly and effectively so you can
    be sure that all is well with your system.


    `badblocks -s /dev/sda` This will check to see if there are any unreadable blocks
    on the disk `sda` (you can change `sda` to whatever disk drive you want to check).

    `cat /proc/cpuinfo` This will provide you with the current CPU information, such
    as usage, speed, and other important aspects of its ability to run.

    `cat /proc/meminfo` This will provide you with memory information, such as usage,
    speed, and other important aspects of its ability to run.

    `dmidecode` This will show you pertinent hardware information from the BIOS.


    `dmesg` This will show messages in the kernel ring buffer.

    `free -h` This will display the free and used memory space in your system at that
    moment, specifically in a human-readable form. You can also select to `m` instead
    of `-h` for the display in MB, or `-g` to get your result in GB.

    `hdparm –I /dev/sda` This will provide you with all sorts of information about
    the disk `sda`.


    `lspci -tv` This shows you the current PCI devices.


    `lsusb -tv` This shows your current USB devices.


    # Installing Packages

    These commands are all about installing packages from your files, whether from
    zip files, downloaded files, or otherwise.


    `rpm -i package.rpm` Installs the package from a local file, in this case named
    `package.rpm`.

    `tar zxvf sourcecode.tar.gz`


    ```

    cd sourcecode

    ./configure

    make

    make install

    ```

    As opposed to installing from a package, this will have you install software from
    source.

    `yum info package` Displays information about the package you reference.

    `yum install package` Installs a package.

    `yum remove package` Uninstalls (removes) a package.

    `yum search keyword` Provides a search for a package using a keyword.


    # Networking

    These commands are directly related to networking —allowing you to see what is
    going on with your own network and anything that your own network is interacting
    with.

    `dig domain` Displays the DNS information for a given domain.

    `dig -x IP_ADDRESS` Use this to run a reverse lookup of a given IP address.

    `ethtool eth0` A tool to view and change network drivers and hardware settings.


    `host domain` Displays the DNS IP address for a given domain.


    `hostname -i` This command is used to displaying the network address of the “host
    name”.


    `hostname -I` Very similar to the above command, but this will display all local
    ip addresses.

    `ifconfig -a` This will bring up all network interfaces and their ip addresses.

    `ifconfig eth0` Will display the `eth0` address and its details.

    `netstat -nutlp` Will show oyu any listening tcp & udp ports and their related
    programs.


    `ping host` Will send an ICMP echo request to “host”.


    `wget http://domain.com/file` Downloads the web file found at the given web address.


    `whois domain` Will display the whois information for “domain”.


    # Performance Monitoring

    These commands are dedicated to ensuring that you are able to monitor your system’s
    performance. This will make sure that your system is functioning well, effectively,
    and to your preference in order to ensure that there is nothing further you have
    to do to optimize your own settings to what you want or need them.

    `htop` This will allow you to move to the top of the process viewer. `iostat 1`
    This will allow you to see the input/output statistics.


    `lsof` Allows for a list of all open files currently presents on the system.

    `lsof -u [username]` Allows for a list of open files present currently by the
    username specified.


    `mpstat 1` This will allow you to see processor-related stats. `tail 100 var/log/messages`
    This will let you see the last 100 system log messages.


    `tcpdump –i eth0` This will allow you to see all packets on that particular interface
    listed (in this case, `eth0`).

    `tcpdump –i eth0 ‘port 10''` This will allow for the monitoring of data on port
    10, and you can change the port name to whichever port you are trying to manage.

    `top` This will show the top processes and allow you to manage them. `vmstat 1`
    This will allow you to see the virtual memory-related statistics .


    # Process Management

    These commands are dedicated to process management —they tell you what the processes
    that are currently ongoing are doing, as well as allow you to shift from foreground
    processes to background processes as needed to make sure that your own activity
    does not suffer due to other processes running as well.

    `bg` Will show background tasks or those that have stopped.


    `fg` This command will push the most background process to the foreground.


    `fg n` Similar to the above command, this will push process `n` to the front.

    `htop` Will allow you to interactively monitor your computer’s processes. `kill
    pid` Use this to end or “kill” a particular process, where the process ID matches
    `pid`.


    `killall processname` When you want to kill all processes with a particular name,
    utilize this command.

    `program &` This starts your program in the background. `ps` Displays your own
    processes currently running. `ps -ef` Displays all of the processes currently
    running.

    `ps -ef | grep processname` This will display the information for `processname`.

    `top` A process viewer. It is older than htop, but serves the same purpose. It
    has some differences, such as lack of mouse support.


    # Search

    When you need to find something within your system, these commands are your best
    bet. When you are using your search commands, you will be able to find the files
    you need quick access to with ease and learn exactly where they are so you are
    able to jump to them and access them elsewhere.

    `find /home -size +25M` Utilize this command to find files larger than 25MB in
    `/home`


    `find /home/mark name ‘prefix*’` This will find files in `/home/mark` that start
    with `prefix`.

    `grep pattern file` This will look for pattern in `file`.


    `grep -r pattern directory` Performs a recursive search for pattern in `directory`.
    `locate name` Will look for files and directories by the specified `name`.


    # SSH Login

    `ssh host` Connects to host using the username you use locally.


    `ssh user@host` Connects to host as `user`.


    `ssh -p port user@host` Connects to host using `port`.


    # System Information Commands

    These commands are all used for some sort of system information to understand
    what the system is doing and how you are able to interact with it. These are Linux
    specific—they should work for any form of Linux you are operating within, Kali
    Linux included. Some of these commands may be less useful on Kali Linux, but they
    are important to know anyway when interacting with other Linux systems. Consider
    this your sort of refresher course on how to interact with Linux. `cal` This will
    show you the current month’s calendar.

