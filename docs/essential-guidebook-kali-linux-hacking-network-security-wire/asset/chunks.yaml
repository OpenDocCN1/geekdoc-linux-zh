    ![](image_rsrcU6.jpg)


    ## What is a Network?


    Defined just, an organization is at least two PCs that are associated together
    here and there to share data or cooperate somehow or another. The PCs don’t need
    to be associated by means of wire—they can be associated through infrared pillars,
    through the transmission of radio waves or satellites, or even through wires.
    Notwithstanding, they are constantly associated in some kind of way.


    There are a few occurrences wherein an organization is a best decision for the
    utilization that is arranged out. For instance, envision that you have two PCs
    (a PC and a work area), a tablet, and a cell. You regularly use all four items
    at home and want to make sure that data that is attached to your laptop, which
    you use primarily for being able to access and browse the internet or answer emails,
    is also available on your more powerful desktop, which may be reserved for more
    intensive programs, such as playing video games or editing large files or videos.
