  trans: '


    假设你已经熟悉了 Linux 以及使用它的基本知识，你会意识到 `sudo` 命令是触发框架绕过任何监管限制的指令，前提是你已经被设置为了 `sudo` 客户端。如果你发现自己对这个流程还只是个新手，那么在继续阅读这本书之前，查找一份
    Linux 的初级手册可能会大有益处。在输入 `sudo` 命令后，你现在可以停下来仔细查看你本地的 IP 流，以确保你的进展已获取并生效。你可以通过以下命令实现此点：


    ```

    ip a

    ```


    随后你应该会有查看你框架上 IP 地址的选项。如果它与你尝试设置的相，那么在那个时候，你就成功设置了你自己的 IP 地址。


    ## 协议层

    正如之前简要提到的，网络是由约定（惯例）控制的。这种约定由五个特定的层组成，共同构成一个网络协议栈。网络协议栈的前四层包含在 `TCP/IP` 模型中。通过观察这些层是如何运作的，你可以精确地看到个人和框架是如何与网络协作的。这部分将让你熟悉网络的分层以及访问这些层的方法。


    ### 互联网协议 (IP)

    IP 协议 (`IP`) 是指导数据如何在网络上管理通信的核心约定。它阐明了数据报文（你的电脑在请求额外数据时发送的数据）是如何跨组织和界限传输的。它的首要功能是路由信息，这允许信息进行传输，从而创建了整个互联网。


    `IP` 负责将数据包（需要通信的小型数据包包）从源主机移动到目标主机。它使用 `IP` 地址来执行此操作，为它们提供数据包头。虽然 `IP` 曾经是无连接的，但也被用作传输控制程序的基础，该程序最终演变成了传输控制协议
    (`TCP`)。因此，你偶尔会看到 `IP` 被提及为 `TCP/IP`，将在后续章节中进行解释。


    `IP` 起于 `IPv4`（网际协议版本 4），但它正开始被 `IPv6` 取代。


    最终，`IP` 负责长长时间的传输。它可以很好地划分为四个特定的能力——应用层、传输层、网络层和链路层。信息和数据包的传输还有第五层——物理层，然而 `TCP/IP`
    模型并不包含物理层。


    ### TCP/IP 模型

    `TCP/IP` 模型是 `IP` 的细节之一——它是关于组织内电脑之间应该如何进行通信的权威规则列表。它指导了信息的组织标准，允许所有框架使用相似的原理。基本上，`TCP/IP`
    模型考虑了所有框架，无论它们源自何处，以访问相同的互联网。


    ![](img/image_rsrcU8.jpg)


    这是通过创建标准数据报文完成的——这些数据报文由两部分组成：头部和有效负载。头部包含了源 `IP` 地址、目标 `IP` 地址以及任何其他为了确保数据完全准确到达它应该去的地方的重要元数据。随后，有效负载就是将交付给需要接收它的源的数据。当有效负载和头部组合成所谓的“数据包（parcel）”时，这种交互被称为封装。


    在 `IP` 栈中，如前所述，五个特定的层。前四层与 `TCP/IP` 模型相关。主层，即物理层，负责从一个源到合法的组织通信介质的信息的编码和传输。它利用被称为从物理层发送的帧的信息，目标物理层将接收这些信息。基本上，主层将你输入电脑的信息，通过你控制台按键的位冲和按下转换为位并进行编码。


    接下来，你通过数据链路层——在这一层，最近编码的数据包从网络层移动到两个独立的主机。这种数据包的传输有时会受到组织网卡或固件中产品设备驱动程序的限制，不同的协议对于宽带网络有不同的技术，例如，接入需要
    `PPPoE` 协议，但附近的有线组织将使用 `Ethernet` 线路。而附近的远程组织则将使用 `IEEE 802.11`。


    从数据链路层，你继续进入网络层或网层。这是信息真正从源组织被提取并到达目标的地方。这通常通过将数据包从一个组织传递到另一个组织进行安排来实现，这种循环被称为互连，这就是
    `IP` 变得关键的地方。这个过程包括信息从一个源到达目的地。


    一旦信息发送到目标，在它被接收之前还有两个额外的层。下一层是传输层——它的职责是考虑要传输的消息。这通常以两种方式之一发生：要么通过传输控制协议或通过用户数据报协议
    (`UDP`)。


    #### TCP 和 UDP

    `TCP` 作为一种通信协议，指的是旨在跨网络进行消息交换的面向连接交换协议。它通常被认为是稳健的，因为它有几种独特的错误检查来确保所有内容都被正确地解释和通信。它首先被分组数据包并编号，然后将数据发送给接收者，并要求发送者返回响应以确认收到消息。如果接收者的响应有任何不准确，则消息将重新发送，以确保正确的数据和包被正确读取。这是互联网中最为人知的通信和信息传输类型。


    `UDP` 则考虑更快的传输。遗憾的是，更快的传输包含了一些缺点——准确性。


