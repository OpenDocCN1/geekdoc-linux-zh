    It not only gathers information but also allows for the scanning of security,
    making it a multipurpose tool that can greatly benefit you. It can be used for
    actions such as:![](image_rsrcUU.jpg)Detecting any live hosts on a network![](image_rsrcUV.jpg)Detecting
    any open ports that are currently present on the host![](image_rsrcUW.jpg)Detecting
    OS, hardware, and software![](image_rsrcUX.jpg)Detecting vulnerability through
    Nmap scriptsThe tool itself is incredibly common and it is also compatible both
    with CLI and GUI, meaning it is not only common and powerful, but also flexible.How
    to Use Nmap to Understand and Exploit VulnerabilitiesWhen you are ready to use
    Nmap, you have several different options. You will be able to scan one target,
    limited targets, or several targets, all based on the command that you are able
    to submit. The target determines exactly how you would go through the process
    of using this system, but ultimately, doing so will take some time.Scanning CommandsPerhaps
    the most basic usage of Nmap is through scanning. When you want to scan, you have
    several different options. You can choose what you wish to target, whether it
    is one individual, several individuals, or an entire directory. Imagine for a
    moment that you want to scan a single unit or system. You would do so with the
    following command, changing the IP addresses accordingly.nmap target


    # nmap target.com


    # nmap 192.143.1.1This will scan that one specific system. If you wish to scan
    all associated subnets to that system, your command will change slightly. It would
    instead be:nmap target/cdir


    # nmap 192.143.1.1/24And if instead, you wanted to scan several different targets
    instead, you would simply label them and separate the IP addresses with spaces.
    For example, maybe you would write:nmap target target1 target2 # nmap 192.143.1.1
    192.141.1.2You even have the option to scan only several IP addresses in a row
    without scanning the entire subnet. When you wish to scan 50 of the associated
    IP addresses but not the entire subnet, you will use the following command:nmap
    target-50 # nmap 192.143.1.1-50


    This would then lead to the scanning of every IP address from 192.143.1.1 to 192.143.1.50
    all in one go.You may also decide that what you need is a list of several hosts
    that are being scanned—in this case, you want to add the proper parameter. In
    this case, that parameter would be -sL, which would create the command prompt
    of:nmap -sL target/cdir


    # nmap -sL 192.143.1.1/24


    Sometimes, however, you may want to scan the entire subnet, but you also know
    that you need to leave a section of that subnet entirely unscanned inorder to
    avoid detection.


    Especially if you have the single IP address that you must avoid, you can then
    create your code with a parameter meant to exclude that one IP address. This is
    quite simple. All you need to do is add in the -exclude parameter like so:# nmap
    192.143.1.1/24 - -exclude 192.143.1.13


    You can even enter a single file that contains all excluded IP addresses if you
    have one, inserting the file name within the exclusion instead.'
