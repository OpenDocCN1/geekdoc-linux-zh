  trans: '


    # 文件操作


    `rm file` 删除指定的文件。最常见的用法是删除文件。

    `rm -f file` “强制”删除文件。执行此命令后不会有确认提示。请确保你确实想要删除此文件。


    `rm -r directory` 递归地删除目录及其内容。

    `rm -rf directory` 当你想要“强制”递归删除目录及其内容时，使用此命令。同样，请确保这是你想要的操作，因为系统不会进行任何确认。


    # 文件传输

    这些命令将作为你的指南，帮助你根据需要在不同位置之间移动文件，以确保你始终能够将文件放在你想要的地方。


    `rsync -a /home /backups/` 将 /home 目录同步到 `/backups/home`。


    `rsync -avz /home server:/backups/` 在本地和远程系统之间对文件或目录进行同步，并启用压缩功能。


    `scp file.txt server:/tmp` 将文件（在此例为 `file.txt`）安全地复制到服务器的 `/tmp` 文件夹。


    `scp -r server:/var/www /tmp` 递归地从服务器复制所有目录和文件到当前系统的 `/tmp` 目录。


    `scp server:/var/www/*.html /tmp` 将服务器上所有的 `.html` 文件复制到本地 `/tmp` 目录。


    # 硬件信息命令

    这些命令将为你提供有关硬件的各种信息，确保你的硬件运行正常且高效，从而让你确信系统一切正常。


    `badblocks -s /dev/sda` 这将检查磁盘 `sda` 上是否存在不可读取的区块（你可以将 `sda` 更改为任何想要检查的磁盘驱动器）。

    `cat /proc/cpuinfo` 这将提供当前的 CPU 信息，例如使用率、速度以及运行能力的其他重要方面。

    `cat /proc/meminfo` 这将提供内存信息，例如使用率、速度以及运行能力的其他重要方面。

    `dmidecode` 这将为你显示来自 BIOS 的相关硬件信息。


    `dmesg` 将显示内核环形缓冲区中的消息。

    `free -h` 将显示你系统当前空闲和使用的内存空间，特别是以人类易读的形式。你也可以选择用 `m` 代替 `-h` 以 MB 为单位显示，或用 `-g`
    以 GB 为单位获取结果。

    `hdparm –I /dev/sda` 这将提供有关磁盘 `sda` 的各种信息。


    `lspci -tv` 显示当前的 PCI 设备。


    `lsusb -tv` 显示你当前的 USB 设备。


    # 安装软件包

    这些命令都是关于从你的文件安装包，无论是来自 zip 文件、下载的文件或其他格式。


    `rpm -i package.rpm` 从本地文件安装包，在此例名为 `package.rpm`。

    `tar zxvf sourcecode.tar.gz`


    ```

    cd sourcecode

    ./configure

    make

    make install

    ```

    与从软件包安装不同，这将将让你从源码编译安装软件。

    `yum info package` 显示你引用的软件包信息。

    `yum install package` 安装软件包。

    `yum remove package` 卸载（移除）软件包。

    `yum search keyword` 使用关键字搜索软件包。


    # 网络

    这些命令与网络直接相关——允许你查看你自己的网络状况，以及你的网络正在交互的任何内容。

    `dig domain` 显示给定域名的 DNS 信息。

    `dig -x IP_ADDRESS` 使用此命令对指定的 IP 地址运行反向查找。

    `ethtool eth0` 用于查看和更改网络驱动和硬件设置的工具。


    `host domain` 显示给定域名的 DNS IP 地址。


    `hostname -i` 此命令用于显示“主机名”的网络地址。


    `hostname -I` 与上述命令非常相似，但它将显示所有本地 IP 地址。

    `ifconfig -a` 将启动所有网络接口及其 IP 地址。

    `ifconfig eth0` 显示 `eth0` 地址及其详细信息。

    `netstat -nutlp` 将显示任何正在监听的 tcp & udp 端口及其相关程序。


    `ping host` 向“host”发送一个 ICMP 回显请求。


    `wget http://domain.com/file` 下载给定网络地址上的网络文件。


    `whois domain` 显示“domain”的 whois 信息。


    # 性能监控

    这些命令专门用于确保你能够监控系统的性能。这将确保你的系统运行良好、高效并符合你的偏好，从而确保无需对自己的设置进行进一步优化以达到你的目标或需求。

    `htop` 允许你移动到进程查看器的顶部。`iostat 1` 将允许你查看输入/输出统计数据。


    `lsof` 允许列出系统中当前存在的所有打开的文件。

    `lsof -u [username]` 允许列出指定用户当前打开的文件。


    `mpstat 1` 将允许你查看与处理器相关的统计。`tail 100 var/log/messages` 将让你看到最后 100 条系统日志消息。


    `tcpdump –i eth0` 将允许你查看列出的特定接口（在此例中为 `eth0`）上的所有包。

    `tcpdump –i eth0 ‘port 10''` 将允许你查看该接口上端口为 10 的数据包。`vmstat 1` 将允许你查看虚拟内存统计。


    # 进程管理

    这些命令专门用于进程管理——它们告诉你正在运行的进程情况，并允许你在前台和后台进程之间切换，以确保你的活动不受影响。

    `bg` 显示已停止的任务。


    `fg` 此命令将后台进程推回前台。


    `fg n` 与上述命令类似，但它会将进程 `n` 推回前台。

    `htop` 允许你交互式监控计算机的进程。`kill pid` 使用此结束或“杀死”特定进程，其进程 匹配 `pid`。


    `killall processname` 当你想杀死所有特定名称的进程时使用此命令。

    `program &` 在后台启动你的程序。`ps` 显示正在运行的进程。`ps -ef` 显示所有运行的进程。

    `ps -ef | grep processname` 将显示 `processname` 的信息。

    `top` 进程查看器。它比 htop 旧，但功能相同。它的不同之处在于不支持鼠标。


    # 搜索

    当你需要在系统中查找内容时，这些命令是你的最佳选择。当你使用搜索命令时，你能够轻松找到需要快速访问的文件，并准确学习它们的位置，以便你可以在其他跳转并访问它们。

    `find /home -size +25M` 使用此命令查找 /home 中大于 25MB 的文件。


    `find /home/mark name ‘prefix*’` 将查找 /home/mark 中以 `prefix` 开头的文件。

    `grep pattern file` 在 `file` 中查找模式。


    `grep -r pattern directory` 在 `directory` 中递归搜索模式。`locate name` 将根据指定的 `name`
    查找文件和目录。


    # SSH 登录

    `ssh host` 使用你的本地用户名连接到主机。


    `ssh user@host` 以 `user` 身份连接到主机。


    `ssh -p port user@host` 使用 `port` 连接到主机。


