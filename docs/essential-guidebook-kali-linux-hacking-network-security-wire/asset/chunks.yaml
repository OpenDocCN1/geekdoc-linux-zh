    When you are trying to sneak into a network, you never know what is and is not
    helpful or necessary. Gather as much information as you possibly can in order
    to be prepared and then move on to step 3, only after you are content that you
    have gathered anything that will be useful to you.


    ## Threat Modeling and Identifying Vulnerabilities


    Step 3 is still all about planning —at this point, you want to take all of the
    information that you have gathered in the previous steps and begin brainstorming
    up what the most realistic vulnerabilities and threats that the network would
    face would be. Does it use a certain network type that is particularly vulnerable
    to a specific plan of attack? Is there an exploit on the type of hardware they
    are using? Anything goes here, so long as it is a relevant threat that the target
    will likely face.


    This stage can also utilize a vulnerability scanner in order to scan the network
    for weaknesses. This could be done to find any vulnerabilities that are currently
    within that particular network, allowing you to calculate out the most likely
    vulnerabilities present. This can be a fantastic asset to you when you are trying
    to understand how best to access the network that you are attempting to penetrate.
    `Kali Linux`, luckily, comes with `Metasploit`—a way that you can scan for vulnerabilities
    within a list of specific target IPs. `Metasploit` will be discussed in-depth
    later within this book.


    Another common technique at this stage is to use scanning tools and port scanners
    in order to find open ports or live hosts. In doing so, you may find that you
    are able to find another weakness that can be exploited to gain access. This technique
    allows you to scan devices, allowing for another point of entry.


    This is almost like reconnaissance v 2.0 —here, you are making it a point to get
    more details about the systems. You should be able to identify what systems are
    present, whether or not they are currently up and active, or whether there are
    any sorts of firewalls or antivirus software installed. With your list of vulnerabilities
    identified, it is time to start figuring out more information as well.


    Can you get any valuable information form looking at the employees on the network?
    Is there value in finding customer data? Do customers have access to symptoms?
    Is there a possibility to steal financial information? If there is, then it is
    quite possible that you may want to look somewhere other than surrounding the
    financial information first, in an effort to sneak around and figure out a better
    plan of attack rather than trying to run in, guns blazing, straight into a trap
    or an area that is heavily guarded. Think about the most likely possibilities
    in this situation and come up with a tentative plan of attack, but remember that
    your test is most likely going to be constantly evolving and changing as you get
    more and more information.


    ## Exploitation


    At this point, it is time to begin attempting to access the network. You should
    have several different locations that you could use to attack the system and it
    is time to begin making those moves. Have you found any weaknesses that can be
    used to access? You may try to start a shell, or try to get some sort of credential
    assigned to you so you can begin to access as a `root` user instead. Is there
    any room for using another computer’s information to help you get head? The main
    part of this phase is attempting to gain as much access as you can without being
    detected and blocked out. While it is possible to do plenty of damage without
    ever actually gaining administrative accesses and permissions, most of the time,
    what you are attempting to do is get that permission.


    This stage will be largely dependent upon the network that you are attempting
    to break through, and you will need to be creative. Make sure that you document
    what does and does not work as you go so you can start to figure out. Remember,
    if you are doing this for yourself or for a client, you are going to want to know
    exactly what worked and what did not. When you have gotten as much information
    as you can here, it is time for the next stage.


    ## Post-Exploitation


    Next comes the post-exploitation phase. At this point, you will have finished
    testing, either due to running out of tie or having reached the end of your ability
    to exploit or run out of the system to exploit. At this point, you must make a
    list of all vulnerabilities and provide them to the client. As you have gone through,
    you should have made notes, or potentially screenshots, of anything that did or
    did not work. You should be able to figure out how significant the exploit that
    you have done is—did you get into the main server or did you get stuck at a computer
    with little sophisticated access to the server? How valuable was the information
    that you got from the system, if any? How at risk is the system itself?


    Beyond that, you should also be thinking of how to fix any vulnerabilities that
    were discovered. Can you think of an easy patch to solve the problem? Is there
    something else that you can do to ensure that the network is more secure? What
    can the network do better? What worked well? Beyond that, you should also make
    sure that you clean up as well. You need to remove anything that was planted within
    the system and change back any and all settings to what they used to be. You want
    to make sure that everything that you have exploited is removed.


    ## Reporting


    At this stage, it is time to come up with your report. It may not be fun, but
    if you have gone through the penetration testing in order to help someone, you
    need to make sure that your report is written up nice and neatly. This is where
    you are able to convey any weaknesses and vulnerabilities that will put the client
    at risk. You will make sure that you are able to tell them which exploits happened
    and how they should be fixed.

