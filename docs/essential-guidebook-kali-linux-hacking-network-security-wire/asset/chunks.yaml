- fmt: "\n# System Information\n\n`cat /etc/redhat-release` This shows you which redhat\
    \ is currently present on your computer for use.\n\n`date` This will show you\
    \ the current time and date on the system you are using.\n\n`hostname` This will\
    \ tell you what the name of the system host is. ``hostname -I` This will provide\
    \ you with the host’s IP address.\n\n`last reboot` This will show you the last\
    \ time that the system was rebooted.\n\n`uname -a` This allows for the display\
    \ of the Linux system’s information that is stored.\n`uname -r` This allows for\
    \ the output to show which kernel release you are using.\n\n`uptime` Tells you\
    \ how long your system has been up or how long it has been loading. \n`w` This\
    \ will show you who is currently online on the system. \n`whoami` This will tell\
    \ you who you are currently logged into the system as. \n\n# User Information\
    \ and Management Commands\n\nThese commands are crucial to your ability to managing\
    \ user information. When you master these controls, you can add and remove people\
    \ from your server. You can make sure that certain people have certain permissions,\
    \ and more. These commands may not be so necessary within Kali Linux, where you\
    \ are designed to be in root user and not others, they are still fantastic to\
    \ know and understand.\n\n`groupadd group1` Allows you to create a new group “group1”\
    \ in this instance. You can replace “group1” with any other name for your group.\
    \ \n`id` shows the user and group ids of the current user on the system. \n`last`\
    \ Shows who the last people that logged on were. \n`useradd –c “full name” –m\
    \ “nickname\"` Allows for the creation of an account with the comment of “full\
    \ name” and the home directory of “nickname”. \n`userdel “name\"` allows you to\
    \ delete the user “name”.\n\n`usermod –aG group1 “name\"` Allows you to move user\
    \ “name” to the “group1” group. \n\n# Part II: Kali Linux Hacking\n\n## Chapter\
    \ 5: Nmap and Detecting and Exploiting Vulnerabilities\n\nAt this point, you may\
    \ be quite eager to get started with Kali Linux once and for all. You should now\
    \ have the OS installed yourself, or you are preparing to do so. Either way, reading\
    \ through this section can provide you with valuable information. This is where\
    \ you begin to see the true power of Kali Linux and how it can be used. You will\
    \ begin to see the strength that can be earned in hacking and in learning to see\
    \ and wield that strength for yourself, you should also be able to begin to see\
    \ just how easy it is for a network to go unprotected or undefended. When this\
    \ happens, it is in your best interest to ensure that you can figure out vulnerabilities\
    \ in order to patch them up.\n\nNmap is just one of many tools that Kal Linux\
    \ offers, and this particular chapter focuses on it. Nmap is powerful, allowing\
    \ you to gather and identify information that is meant to be useful, allowing\
    \ you to detect everything on the system. It is primarily a security tool, but\
    \ you should keep in mind that it can be used to cause harm as well. Now, it is\
    \ time to dive into the beginning of the actual hacking process.\n\nIf you have\
    \ already installed Kali Linux, go ahead and open it up—Nmap comes by default,\
    \ already provided within the system.\n\n### What is Nmap?\n\nNmap stands for\
    \ network mapper —it is an incredibly popular tool that is used to discover that\
    \ is available to you. As with all of the tools provided to you within the Kali\
    \ Linux distribution, this is free to use and secure. When you use Nmap, you are\
    \ able to map out networks, allowing yourself to see inventories and find open\
    \ ports as well. It is quite simple to use—it brings up a terminal that you are\
    \ able to enter your commands and scripts within, allowing you to do whatever\
    \ you would like within the system once you have gotten in.\n\nThis tool is able\
    \ to work through firewalls and routers, it can bypass an IP filter, and it is\
    \ able to navigate into systems. While it was designed to be capable of getting\
    \ through massive networks, it can also be used on smaller scales as well. It\
    \ is primarily used for port scanning, version detection, operating system detection,\
    \ and using ping sweeps. It works quite simply—it uses IP packets in order to\
    \ find hosts on a network and what they are running. Plenty of information can\
    \ be earned just by finding out what someone’s computer is running on.\n\nOverall,\
    \ Nmap is incredibly powerful —it enables you to do all sorts of actions and search\
    \ for several exploits. It not only gathers information but also allows for the\
    \ scanning of security, making it a multipurpose tool that can greatly benefit\
    \ you. It can be used for actions such as:\n\n* Detecting any live hosts on a\
    \ network\n* Detecting any open ports that are currently present on the host\n\
    * Detecting OS, hardware, and software\n* Detecting vulnerability through Nmap\
    \ scripts\n\nThe tool itself is incredibly common and it is also compatible both\
    \ with CLI and GUI, meaning it is not only common and powerful, but also flexible.\n\
    \n### How to Use Nmap to Understand and Exploit Vulnerabilities\n\nWhen you are\
    \ ready to use Nmap, you have several different options. You will be able to scan\
    \ one target, limited targets, or several targets, all based on the command that\
    \ you are able to submit. The target determines exactly how you would go through\
    \ the process of using this system, but ultimately, doing so will take some time.\n\
    \n#### Scanning Commands\n\nPerhaps the most basic usage of Nmap is through scanning.\
    \ When you want to scan, you have several different options. You can choose what\
    \ you wish to target, whether it is one individual, several individuals, or an\
    \ entire directory. Imagine for a moment that you want to scan a single unit or\
    \ system. You would do so with the following command, changing the IP addresses\
    \ accordingly.\n\n```\nnmap target\n# nmap target.com\n# nmap 192.143.1.1\n```\n\
    \nThis will scan that one specific system. If you wish to scan all associated\
    \ subnets to that system, your command will change slightly. It would instead\
    \ be:\n\n```\nnmap target/cidr\n# nmap 192.143.1.1/24\n```\n\nAnd if instead,\
    \ you wanted to scan several targets instead, you would simply label them and\
    \ separate the IP addresses with spaces. For example, maybe you would write:\n\
    \n```\nnmap target1 target2\n# nmap 192.143.1.1 192.143.1.2\n```\n\nYou even have\
    \ the option to scan only several IP addresses in a row without scanning the entire\
    \ subnet. When you wish to scan 50 of the associated IP addresses but not the\
    \ entire subnet, you will use the following command:\n\n```\nnmap target-50\n\
    # nmap 192.143.1.1-50\n```\n\nThis would then lead to the scanning of every IP\
    \ address from 192.143.1.1 to 192.143.1.50 all in one go.\n\nYou may also decide\
    \ that what you need is a list of several hosts that are being scanned—in this\
    \ case, you want to add the proper parameter. In this case, that parameter would\
    \ be `-sL`, which would create the command prompt of:\n\n```\nnmap -sL target/cidr\n\
    # nmap -sL 192.143.1.1/24\n```\n\nSometimes, however, you may want to scan the\
    \ entire subnet, but you also know that you need to leave a section of that subnet\
    \ entirely unscanned inorder to avoid detection.\n\nEspecially if you have the\
    \ single IP address that you must avoid, you can then create your code with a\
    \ parameter meant to exclude that one IP address. This is quite simple. All you\
    \ need to do is add in the `-exclude` parameter like so:\n\n```\nnmap 192.143.1.1/24\
    \ -exclude 192.143.1.13\n```\n\nYou can even enter a single file that contains\
    \ all excluded IP addresses if you have one, inserting the file name within the\
    \ exclusion instead.\n"
