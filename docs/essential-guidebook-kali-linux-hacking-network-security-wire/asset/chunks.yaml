    Linux 发行版——Ubuntu、Mint 和 Debian 都是非常棒的起点。显然，如果你现在是一名渗透分析师，或者正专注于学习渗透测试，那么 Kali
    Linux 正是你的不二之选。你无法胜过专家为专家设计的工具，更无法获得这套工具集所提供的免费价值。


    ## Kali Linux 特性

    如果你已经认定 Kali Linux 可能适合你，那么有一些工具可能适用于你。这一部分将引导你了解 Kali Linux 最广为人知的特性，以便你开始更好地判断这是否对你用处。


    ### 数百渗透测试工具

    Kali Linux 拥有一个巨大的工具库，可用于渗透测试，其中所有工具都经过了检查并尝试了保护。每个工具都提供了一个对你进入和控制系统的工作有所帮助的理由。


    ### 免费

    这可能是使用 Kali Linux 最具说服力的理由之一——假设它符合你的用途，它是完全免费的。你永远不需要付费来获取这套工具，这意味着没有持续的许可维护费用。


    ### 安全

    Kali Linux 由一个受信任与商店交流的小社区创建，令人惊讶的是，它有一些约定来帮助确保 Kali Linux 达到预期的安全水平。这意味着任何供下载的包都将由提交并构建它的设计者认可，并考虑在发生任何万一错误时承担责任。


    ### 可定制

    虽然 Kali Linux 有明确且受鼓励的应用场景，且某些框架的用法是被明确反对的，但整个框架被设计得具有适应性。你可以尝试更改 Kali Linux 以适应你的需求，无论这些需求是否与建议的用途冲突。你可能会遇到困难，但你可以尝试做任何你想做的事。


    ### 多语言支持

    与许多其他渗透工具不同，Kali Linux 提供了真正的多语言支持。与其用英语进行工作和学习一切，人们可以使用自己的本地语言使用 Kali Linux。


    ### 开源 Git 树

    所有源代码均供个人查看或根据特定需求进行修改。人们可以跟踪进展和源代码，以确保他们获得确切需要且想要的内容，正如前一节中记录的少数限制。


    ### 符合 FHS 标准

    Kali Linux 采用了一直以来使用的通用文件系统层级标准（Filesystem Hierarchy Standard），以便 Linux 用户查找他们的文档和库。这意味着如果你已经熟悉
    Linux，使用它将少一个需要克服的障碍。


    ### 无线设备支持

    Kali Linux 旨在帮助广泛的远程设备，使其能够与 USB 和其他远程设备轻松连接。这可以更方便地访问数据和传输信息。


    ### 自定义内核

    由于渗透分析师应该有权进行远程评估，Kali 内部的 Linux 内核将始终包含每一个底层的补丁，以支持对其他系统的渗透演示。


    ## 如何安装 Kali Linux

    此时，你应该对引入 Kali Linux 是否有所帮助有一个清晰的想法。如果你在浏览了关于该操作系统的所有信息后，认为它确实适合你，那么是时候开始讨论操作系统的安装过程了。安装是使用
    Kali Linux 工作系统的第一步，并且可以通过多种方式实现。如果你是以任何非传统的在 PC 上安装 Kali Linux 操作系统的技术来引入 Kali
    Linux，或者你设想你将运行虚拟机，那么你可能处于一个理想状态，可以去 Kali Linux 官方网站查看他们提供的指南和教程。


    ### 安装所需

    当你准备好安装时，你应该确保你已经拥有了你所需要的一切。这很大取决于你所使用的框架。运行 Linux 的人现在可能已经拥有了所需的一切，但如果你运行的是 macOS
    X 或 Windows，你将需要确保为特定操作系统安装适当的 `GPG`。

