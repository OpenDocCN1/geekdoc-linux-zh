    the server to the current system’s /tmp directory.


    scp server:/var/www/*.html /tmp Copies overall .html files from the server to
    the local /tmp directory.Hardware Information CommandsThese commands will provide
    you with all sorts of information about your hardware, ensuring that your hardware
    is functioning properly and effectively so you can be sure that all is well with
    your system.badblocks -s /dev/sda This will check to see if there are any unreadable
    blocks on the disk sda (you can change sda to whatever disk drive you want to
    check).cat /proc/cpuinfo This will provide you with the current CPU information,
    such as usage, speed, and other important aspects of its ability to run. cat /proc/meminfo
    This will provide you with memory information, such as usage, speed, and other
    important aspects of its ability to run.dmidecode This will show you pertinent
    hardware information from the BIOS.


    dmesg This will show messages in the kernel ring buffer.free -h This will display
    the free and used memory space in your system at that moment, specifically in
    a human-readable form. You can also select to m instead of -h for the display
    in MB, or -g to get your result in GB.hdparm –I /dev/sda This will provide you
    with all sorts of information about the disk sda.


    lspci -tv This shows you the current PCI devices.


    lsusb -tv This shows your current USB devices.Installing PackagesThese commands
    are all about installing packages from your files, whether from zip files, downloaded
    files, or otherwise.


    rpm -i package.rpm Installs the package from a local file, in this case named
    package.rpm.tar zxvf sourcecode.tar.gz


    cd sourcecode


    ./configure


    make


    make install As opposed to installing from a package, this will have you install
    software from source.yum info package Displays information about the package you
    reference. yum install package Installs a package.yum remove package Uninstalls
    (removes) a package.


    yum search keyword Provides a search for a package using a keyword.NetworkingThese
    commands are directly related to networking —allowing you to see what is going
    on with your own network and anything that your own network is interacting with.dig
    domain Displays the DNS information for a given domain. dig -x IP_ADDRESS Use
    this to run a reverse lookup of a given IP addressethtool eth0 A tool to view
    and change network drivers and hardware settings.


    host domain Displays the DNS IP address for a given domain


    hostname -i This command is used to displaying the network address of the “host
    name”.


    hostname -I Very similar to the above command, but this will display all local
    ip addresses.ifconfig -a This will bring up all network interfaces and their ip
    addresses. ifconfig eth0 Will display the eth0 address and its details.netstat
    -nutlp Will show oyu any listening tcp & udp ports and their related programs.


    ping host Will send an ICMP echo request to “host”.


    wget http://domain.com/file Downloads the web file found at the given web address.


    whois domain Will display the whois information for “domain”.Performance MonitoringThese
    commands are dedicated to ensuring that you are able to monitor your system’s
    performance. This will make sure that your system is functioning well, effectively,
    and to your preference in order to ensure that there is nothing further you have
    to do to optimize your own settings to what you want or need them to be.htop This
    will allow you to move to the top of the process viewer. iostat 1 This will allow
    you to see the input/output statistics.


    lsof Allows for a list of all open files currently presents on the system.lsof
    -u [username] Allows for a list of open files present currently by the username
    specified.


    mpstat 1 This will allow you to see processor-related stats. tail 100 var/log/messages
    This will let you see the last 100 system log messages.


    tcpdump –i eth0 This will allow you to see all packets on that particular interface
    listed (in this case, eth0).tcpdump –i eth0 ‘port 10’ This will allow for the
    monitoring of data on port 10, and you can change the port name to whichever port
    you are trying to manage.top This will show the top processes and allow you to
    manage them. vmstat 1 This will allow you to see the virtual memory-related statistics
    .Process ManagementThese commands are dedicated to process management —they tell
    you what the processes that are currently ongoing are doing, as well as allow
    you to shift from foreground processes to background processes as needed to make
    sure that your own activity does not suffer due to other processes running as
    well.bg Will show background tasks or those that have stopped.


    fg This command will push the most recent background process to the foreground.


    fg n Similar to the above command, this will push process “n” to the front.htop
    Will allow you to interactively monitor your computer’s processes. kill pid Use
    this to end or “kill” a particular process, where the process ID matches “pid”.


    killall processname When you want to kill all processes with a particular name,
    utilize this command.program & This starts your selected program in the background.
    ps Displays your own processes currently running. ps -ef Displays all of the processes
    currently running in the system.ps -ef | grep processname This will display the
    information for “processname”.top A process viewer. It is older than htop, but
    serves the same purpose. It has some differences, such as lack of mouse support
    (something htop has). Pick your preference.SearchWhen you need to find something
    within your system, these commands are your best bet. When you are using your
    search commands, you will be able to find the files you need quick access to with
    ease and learn exactly where they are so you are able to jump to them and access
    them elsewhere.find /home -size +25M Utilize this command to find files larger
    than 25MB in /home


    find /home/mark name ‘prefix*’ This will find files in /home/mark that start with
    “prefix”.grep pattern file This will look for pattern in “file”.


    grep -r pattern directory Performs a recursive search for pattern in “directory”.
    locate name Will look for files and directories by the specified “name”.SSH Loginsssh
    host Connects to host using the username you use locally.


    ssh user@host Connects to host as “user”.


    ssh -p port user@host Connects to host using port.System Information CommandsThese
    commands are all used for some sort of system information to understand what the
    system is doing and how you are able to interact with it. These are Linux specific—they
    should work for any form of Linux you are operating within, Kali Linux included.
    Some of these commands may be less useful on Kali Linux, but they are important
    to know anyway when interacting with other Linux systems. Consider this your sort
    of refresher course on how to interact with Linux.cal This will show you the current
    month’s calendar.'
