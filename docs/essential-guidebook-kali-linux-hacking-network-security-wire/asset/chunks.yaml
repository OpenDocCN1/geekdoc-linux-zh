    ![](img/image_rsrcV4.jpg)Meterpreter 负载：它们允许接管设备监控器以接管其他会话![](img/image_rsrcV5.jpg)静态负载：它们能够实现端口转发并在网络之间进行通信。


    # Metasploit 模块


    Metasploit 内部包含几个模块。这些是核心部分——即具有明确执行任务的程序。它们同样涵盖了你可以在 Metasploit 结构内完成的操作。你可以很快地找到这些模块：你只需找到相应的仓库：`/path/to/metasploit/apps/pro/msf3/modules`


    模块类型将取决于特定模块背后的动机，就像该特定模块负责的操作一样。具体来说，有八种值得讨论。它们包括：


    ![](img/image_rsrcV6.jpg) **漏洞 (Exploits)**：漏洞模块旨在执行一系列命令，然后针对在目标系统或应用程序中发现的漏洞。该模块旨在利用任何漏洞以获取对目标系统的访问权限。漏洞模块有多种示例，例如代码注入和
    Web 应用程序漏洞。


    ![](img/image_rsrcV7.jpg) **负载 (Payloads)**：负载是指在漏洞成功入侵当前系统后运行的 shell 代码。负载允许你精确决定想要如何连接到
    shell，以及在获得控制权后想要对目标执行什么操作。它可能涉及打开一个 Meterpreter 或不同的命令 shell。Meterpreter 是一种特殊的高级负载，它允许写入
    DLL 文件，以便根据你的需要创建新功能。


    ![](img/image_rsrcV8.jpg) **编码器 (Encoders)**：编码器是能够将一种代码形式转换为另一种形式的关键工具。


    ![](img/image_rsrcV9.jpg) **监听器 (Listeners)**：设计用于隐身并进行监听的恶意软件。当它们能够监听时，它们能够收集各种重要信息，导致敏感信息（如密码、社会安全号码或其他人们希望私密的信息）泄露。


    ![](img/image_rsrcVA.jpg) **辅助函数 (Auxiliary function)**：用于补充设备其他功能的工具和命令。


    ![](img/image_rsrcVB.jpg) **Shell 码 (Shellcode)**：程序化为在进入目标后立即激活的代码，以实现特定目的，提供一种更隐蔽的进入和激活方式。


    ![](img/image_rsrcVC.jpg) **NOP 生成器 (NOP generator)**：这是一个能够产生一系列随机字节的工具，旨在绕过任何标准
    ID 以通过防火墙或重要的拦截。


    ![](img/image_rsrcVD.jpg) **后渗透利用代码 (Post-exploitation code)**：后渗透模块允许你在被利用的目标内部获取更多信息或窃进一步的访问权限。这些包括哈希转储或服务枚举器。


    # 使用 Metasploit


    当你引入了 Metasploit 并准备好使用时，你只需以某种方式收集数据，无论是通过首次端口过滤，还是追踪漏洞扫描器来寻找进入点。一旦进入，你只需选择一个漏洞利用和一个负载，Metasploit
    就会为你完成一切。恰恰，漏洞是指如何在更难防御的网络中识别缺陷的方法。该框架专门设计用于利用各种模型和接口，例如 `msfconsole` 交互式界面等。它可以从
    `terminal/cmd` 工作，同样兼容 Metasploit 社区 Web 界面，后者支持渗透测试。


    # 安装 Metasploit


    在使用 Metasploit 之前，你首先需要引入它。引入它通常要求你最初禁用防火墙和反病毒软件。由于实际记录，当你尝试在运行防火墙和反病毒软件的情况下引入它时，通常被认为是有害的。这会中断你的安装。就此而言，最好是在继续之前直接禁用防火墙和反病毒软件。尽管如此，这意味着你应该确保你的下载源是真实且安全的。如果你不小心，可能会意外下载对你来说真正危险或有风险的东西。


    在关闭防火墙和反病毒软件后，确保你还拥有管理员权限。这在 Kali Linux 中不应该是问题，因为你理应已经拥有 root 客户端权限，但假设你由于未知原因没有，或者你正尝试在其他
    Linux 发行版上引入 Metasploit，你需要确保自己也拥有该管理员权限。


    最后，引入 Metasploit 最明智的选择是从 Rapid7 网站引入。这样做允许你获取适用于你特定工作系统的安装程序。它还将包含一个独立的环境，你可以用于刷新和运行系统。这意味着你真正需要的一切将在底层安装过程中得到处理。当然，如果你决定这样做，你也可以手动物理配置
    Metasploit，但该过程是没有意义的，在本书的目标中将被跳过。当你拿到文件后，运行安装程序。它会提示你进入特定的系统。作为 Kali Linux 用户，你应该看到它是预装的，无需进一步操作。


    # 管理 Metasploit 数据库


    现在，是停下来并在继续之前完成数据集设置了。当你准备好处理你的数据库时，你应该使用 `msfdb` 内容来配置运行 `postgresql` 以将数据集存储在
    `~/.msf4/db/` 中。


    准备好开始操作时，你将使用以下命令：


    ```

    $ msfdb init

    ```


    这将触发数据集的启动，然后可以使用任何最适合你的命令。这些命令增加了额外的功能，并帮助你处理可访问的空间。在此阶段最广知的命令包括：


    `msfdb reinit` 这将使你的数据集被删除并重新初始化以恢复它。


    `msfdb erase` 使用此特定命令将提示你的数据集被删除，而不会像之前的命令那样重新初始化。


    `msfdb start` 此命令将再次启动数据集，允许其重新运行。


    `msfdb stop` 此命令被使用时，将阻止数据集完全运行。


