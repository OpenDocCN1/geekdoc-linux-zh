    This then triggers you to do the TCP SYN scan on that one particular IP address
    through a proxy. With the syntax understood, you are able to move on to completing
    a config file. As with basically anything else within Linux, there are simple
    text files known as config files that will hold all of the necessary information.
    You are able to open these in any of the text editors you have, such as via `gedit`
    or `leafpad`.


    Open the config file into your text editor and you should see a file with all
    sorts of information. Within it, you will find that one particular area has a
    spot for you to add the proxy. You will simply enter the IP address of any proxies
    that you are utilizing there. Typically, `proxychains` will default to Tor, as
    you can see within your file. If you will be using Tor, leave this as is. If you
    are not using Tor, you will need to make the appropriate edits to the file. This
    book will be moving forward with Tor.


    With the proxy server set up, it is time to test it. You can do so by sending
    out a scan through the proxy. When you send the scan out, you should see your
    chosen IP address listed and it should line up with your proxy one. Beyond just
    setting up the proxy, however, you can do plenty of other things with this as
    well. You can add several proxies, for example, and then chain them together so
    they chain either at random, in a specific order, or uses only part of them.


    Start by opening your `proxychains` config file again. You will then look at the
    `dynamic_chains` line—you can see that it is commented out. This means that it
    will not be used at this moment. If you erase the comment mark, it should activate
    when the process is run. You can also find random chaining as well within your
    file. You can re-add the `#` to comment out the `dynamic_chains` line and instead
    remove the `#` from the `random_chain` option instead. You can only make use of
    one or the other of these options at any given time, so you will have to go back
    in and remove one if you wish to use the other.


    ## VPN


    Another layer of security that you can add to your system is through adding a
    VPN on top of the use of proxy addresses. This is common practice—it allows for
    further protection from piracy or other issues. It also allows people to bypass,
    for example, any particular activities that may be illegal within a country. It
    also can allow you to scan other networks without being detected—something else
    is commonly considered to be illegal in several countries. Even just scanning
    the network can be enough to lead to it being considered illegal, even though
    you may not have done anything with it. Now, since you are currently reading about
    how best to do exactly that, you are going to find that the extra security is
    crucial to protecting yourself.


    ![](image_rsrcV1.jpg)


    There are several reasons to use a VPN, all of which are incredibly compelling.
    Not only does a VPN allow you to cloak your IP address and therefore protect you,
    but it also allows you to use any network while ensuring that there is still encryption.
    Further, you will be able to log into your sensitive information without worrying
    about it being hijacked if you are on another network. You will be able to skip
    past any monitoring that may have been installed, or access region-restricted
    websites.


    Of course, it is also important to recognize that your VPN will not cloak everything—there
    will be some ways to identify you. For example, your regular search engine can
    probably recognize you simply due to cookies and browsing behavior, especially
    if you are already logged into an account with that particular engine. Despite
    the shortcomings, however, the fact that a VPN can help you hide more means that
    you can rely on it to provide you with more protection than you would otherwise
    have. Just as a seatbelt is not a guarantee of safety in a car accident, a VPN
    is not a guarantee of security—however it is an extra layer that is there to help
    keep you safe if necessary.


    When you want to enable a VPN on Kali Linux, you will have a handful of commands
    to use and steps to follow, but in the end, you will add extra protection to your
    software, meaning that you will be able to better protect yourself.


    ### Step 1: Enable VPN


    The VPN option is usually disabled by default when you use Kali Linux, so you
    will have to open it up before continuing. This will require you to enter your
    own command, such as:


    ```bash

    apt-get install network-manager-openvpn

    ```


    This particular command is specific to enable a VPN. At this point, you may need
    to restart your networking and `network-manager`. Upon the restart, you should
    find that the VPN is now available.


    ### Step 2: Download and extract openvpn


    Now, you will need to download the `openvpn.zip` file. This is not particularly
    difficult—a code such as:


    ```bash

    wget https://www.privateinternetacess.com/openvpn/openvpn.zip

    ```


    To download the file. Once it is downloaded and saved, you will then need to unzip
    the file and make sure it is deposited into the right directory for later use.
    You can do this with the following command:


    ```bash

    unzip -q openvpn.zip –d /etc/openvpn

    ```


    Your record ought to be prepared, and presently the time has come to continue
    on to step 3.


    ### Step 3: Configure Network Manager to use PIA VPN


    At this progression, you will set up Network Manager so it will perceive and permit
    the utilization of the VPN that you are wanting to set up. This will involve you
    going into Network Manager, editing the connections, then swapping to the `VPN`
    tab and selecting that you would like to add it. You would then click on `ADD`,
    at which point, you would then set the type as `OpenVPN`. Then, click on create.


    If you go to `VPN`, you will observe a few significant subtleties that will permit
    you to tell whether or not you are really utilizing the legitimate VPN in any
    case. For this situation, you should see an association name of `PrivateInternetAccess
    VPN`, an entryway that ought to be nearest to your very own area, a username that
    you can set in, a secret key that you can save, and afterward the `CA` certificate.


    To get the `CA` endorsement, you should go to `/etc/openvpn/` to get to the right
    index, and afterward select on `ca.crt` to utilize it inside this stage.


    Now, click on `Advanced` and pick the case that is close to `Use LZO information
    pressure`. You then, at that point, should tap on `OK`, then, at that point, save
    and close the window.

