  md: '# 14.6 Webcam Operation with gcam


    ![](img/0d7086818d63bf06d3da42b908c48b45_224_0.png)


    gcam is a webcam application that assists in taking snapshots or automatic pictures
    with webcams. To use gcam, your webcam must be supported by Video4Linux. Many
    USB webcams, like the Logitech Quickcam Express, are automatically recognized.
    Grayscale and color cameras can be used. TV cards that support Video4Linux can
    also be used as an image source. An overview of the supported USB devices is maintained
    at http://www.linux-usb.org. A graphical user interface is not compulsory because
    gcam can also run from the command line.


    Figure 14.4: the mtt4 Video Text Browser'
