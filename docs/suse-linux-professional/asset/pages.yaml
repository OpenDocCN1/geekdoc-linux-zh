  md: '# 3.5 Assistive Technology Support


    GNOME offers a number of applications to support users with disabilities. These
    applications include an-screen keyboard (GOK), a powerful screenreader (Gnopernicus)
    with magnification, speech and braille support, and a text entry interface (Dasher).
    Activate the support for any assistive technology via the GNOME control center
    that can be accessed by selecting ''Desktop'' + ''Preferences''.


    # 3.5.1 GNOME On-Screen Keyboard


    Gnome On Screen Keyboard (GOK) provides a virtual keyboard on screen to those
    who cannot use standard mouse and keyboard devices to control their computers.
    With appropriate hardware support, you can use a joystick or any pointer device
    as the input device.


    ![](img/0d7086818d63bf06d3da42b908c48b45_84_0.png)


    Figure 3.6: GOK in Use


    The following example of using a text editor via GOK should illustrate the way
    how GOK works.


    Procedure 3.2: Editing a Text File via GOK


    +   1. Click ''Launcher'' in the main menu. See Figure 3.6 on this page

    2. Select ''Text editor'' to launch a GNOME text editor and click ''back'' to
    return to the main menu.

    3. Hit ''Compose'' to launch the actual on-screen keyboard and start entering
    your text. If in need of advanced editing functality like selecting, copying,
    pasting, or skipping characters, words, sentences, or lines, hit ''Edit''. To
    return to the keyboard window, hit ''back''.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '4. To save the text you have written, click ''back'' to return to the main
    window then select ''Menus'' to launch a window containing buttons to open any
    menu from the text editor''s menu bar.


    5. Select ''File'' → ''Save'' as to open the file dialog of the text editor.


    6. Hit ''Compose'' to enter the filename via the virtual keyboard and hit ''Re-turn''
    on the virtual keyboard.


    7. To terminate the text editor, return to the main menu and select ''Menus''
    → ''File'' → ''Quit''.


    To configure the behavior of GOK, click ''GOK'' → ''Preferences'' in the main
    window and adjust the ''Appearance'', ''Actions'', ''Feedback'', ''Access Methods'',
    and ''Prediction'' settings.


    More information about GOK can be obtained at http://www.gok.ca/ where you also
    find a comprehensive online help for this tool.


    # 3.5.2 Gnopernicus


    Gnopernicus is a powerful tool collection with various types of screen reading
    applications for blind and visually impaired users. It provides the following
    functionalities:


    **Speech** A speech synthesizer software is used to translate the actions on screen
    to spoken words. If your computer has a sound card, you can configure Gnopernicus
    to comment anything that happens on-screen.


    **Braille and Braille monitor** If a braille device is connected to your system,
    Gnopernicus can translate the screen directly to this device. If you activated
    ''Braille Monitor'' as well, an on-screen display of the braille output. This
    option might prove useful for demonstration purposes.


    **Magnifier** This module assists visually impaired users by magnifying the screen
    using a customizable zoom factor.


    Once Gnopernicus has been started, its main menu appears in the top left corner
    of the screen, as shown in Figure 3.7 on the next page. Determine which functionalities
    should be provided when your desktop starts by opening the ''Startup Mode'' dialog.
    Each active module can be configured via the ''Preferences'' dialog. Get more
    information about the Gnopernicus project at http://www.baum.ro/gnopernicus.html.'
