    +   -h Shows the number of occupied blocks in gigabytes, megabytes, or kilobytes—in
    human-readable format

    -T Type of file system (ext2, nfs, etc.)


    du [option(s)] [path] This command, when executed without any parameters, shows
    the total disk space occupied by files and subdirectories in the current directory.


    +   -a Displays the size of each individual file

    -h Output in human-readable form

    -s Displays only the calculated total size


    free [option(s)] The command free displays information about RAM and swap space
    usage, showing the total and the used amount in both categories.


    +   -b Output in bytes

    -k Output in kilobytes

    -m Output in megabytes


    date [option(s)] This simple program displays the current system time. run as
    root, it can also be used to change the system time. Details about the program
    are available in date(1).


    # Processes


    top [options(s)] top provides a quick overview of the currently running processes.
    Press (H) to access a page that briefly explains the main options to customize
    the program.


    ps [option(s)] [process ID] If run without any options, this command displays
    a table of all your programs or processes—those you started. The options for this
    command are not preceded by hyphen.'
