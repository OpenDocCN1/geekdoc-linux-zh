    # 3.4.4 Watching Movies with Totem


    Totem is a multimedia player for the GNOME desktop based on Xine. It supports
    playback of DVDs, VCDs, and audio CDs. Start playback of a VCD or DVD via ''Movie''
    → ''Play VCD'' or ''Movie'' → ''Play DVD''. Totem offers menu support for DVDs
