  md: 'your browser to ''Firefox'', this application is started when you click a link
    in an e-mail. These settings only apply to GNOME applications, however.


    # 3.2.13 Sessions


    The ''Sessions'' dialog enables you to control the behavior of your desktop right
    from the login. In the ''Session Options'' tab, determine whether you want to
    see the GNOME splash screen while the desktop is loading after login. If ''Prompt
    on logout'' is checked, a confirmation dialog appears at the end of a session,
    asking if you want to confirm the logout action. Check ''Automatically save changes
    to session'' if you want to have the exact state of a session restored for the
    subsequent login. With ''Startup Programs'', configure any additional programs
    that should be started on login (certain applets or terminals, for example). The
    ''Current Session'' tab lists all programs that are currently started once a session
    begins. Remove applications or change the order in which they are started as desired.


    # 3.3 File Management with Nautilus


    Nautilus is the file manager and viewer of GNOME. The following section provides
    an overview of the basic functions of Nautilus as well as a few tips on its configuration.
    More information can be found in the help pages for Nautilus.


    # 3.3.1 Navigating in Nautilus


    The standard window of Nautilus is shown in Figure 3.2 on the following page.
    The default view of a folder''s content is the icon view featuring an icon and
    the filename for each file. If configured accordingly, a preview of the file''s
    content can be provided, as described in Section 3.3.4 on page 60. When you double-click
    a folder icon, a new Nautilus window opens, displaying the folder''s content.


    If you prefer browser-like file navigation, switch to the Nautilus browser interface.
    Right-click the folder to browse and choose ''Browse Folder''. A new Nautilus
    window opens, providing the normal functionality, but with a browser''s look and
    feel. To navigate folders and files, you can now use the ''Back'', ''Forward'',
    and ''Up'' buttons as you would do in a web browser. The functionalities and configuration
    options described below (Section 3.3.2 on the following page and Section 3.3.4
    on page 60) also apply to the file browser interface.'
