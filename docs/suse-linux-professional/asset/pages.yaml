    # 4.4.9 KDE Accessibility Tools


    KDE offers handicap support for daily computer work. There are a number of options
    in KDE, especially ‘Regional & Accessibility’ → ‘Accessibility’ in the KDE Control
    Center. Some additional programs help meet particular needs.


    # KMag–Magnify Your Desktop


    People with low vision have limited possibilities for improve the visibility of
    their desktop. The font size can be increased, but that is not always a good solution.
    The tool KMag solves this problem. It is a tool to magnify your desktop. Start
    with the command kmag then see a part of the screen in the KMag window.


    With the toolbar, choose some important options, such as the zoom, the refresh
    rate, and how KMag should behave. You can magnify around the mouse cursor, show
    a window for selecting the magnified area, or magnify the entire screen. With
    ⊘, halt the process. Press it again to restart it.


    # KTTS—The KDE Text-to-Speech Manager


    KTTS is an implementation of a system for producing speech from text. This enables
    other applications to use this subsystem in a consistent manner. The capabilities
    of KTTS include speaking the content of a text file, KDE notification events,
    and all or part of the text of a Web page in Konqueror. Before configure KTTS,
    make sure that you have festival and the KDE accessibility package installed.


