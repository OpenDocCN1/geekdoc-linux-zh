  md: '# Digital Cameras and Linux


    Managing photos from your camera can be fun, if you have the right tools. Linux
    offers several handy utilities to sort and organize your photographs. This chapter
    covers the use of gphoto, gtkam, Konqueror, and Digikam.


    +   16.1 Connecting to the Camera . . . . . . . . . . . . . . . . . . . . 216

    16.2 Accessing the Camera . . . . . . . . . . . . . . . . . . . . . . . 216

    16.3 Installing the Programs . . . . . . . . . . . . . . . . . . . 217

    16.4 Using Konqueror . . . . . . . . . . . . . . . . . . . . . 217

    16.5 Using gtKam . . . . . . . . . . . . . . . . . . . . . . . . 218

    16.6 Using Digikam . . . . . . . . . . . . . . . . . . . . . . . . 219

    16.7 For More Information . . . . . . . . . . . . . . . . . . . 224'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'A comprehensive list of supported cameras is available at http://www.gphoto.org/.
    If gphoto2 is installed, retrieve the list with the command gphoto2 --list-cameras.
    Get information about the available commands with gphoto2 --help.


    > > Tip

    Unsupported Cameras

    If you do not find your camera in the list from gphoto, do not despair. It is
    likely that your camera is supported as a USB mass storage device. Find more information
    in Section 16.2 on the current page.


    # # 16.1 Connecting to the Camera


    The fastest and most convenient way to connect digital cameras to the computer
    is USB, provided the kernel, the camera, and the computer support it. The standard
    SUSE kernel provides this support. A suitable cable is also required. Simply connect
    the camera to the USB port and turn on the camera. You may need to switch your
    camera to a special data transfer mode. For this procedure, consult the manual
    of your digital camera.


    # # 16.2 Accessing the Camera


    There are three possibilities for accessing the pictures on the camera. It depends
    on your camera and which protocol it supports. Usually it is USB mass storage,
    which is handled by the hotplug system, PTP (Picture Transfer Protocol), and some
    proprietary protocols by gphoto2.


    The easiest way is if your camera supports USB mass storage. Read the documentation
    of your camera if you are unsure if this is possible. Some support two protocols,
    both like PTP and USB mass storage. Unfortunately, there are also some that communicate
    with a proprietary protocol, which can complicate the tasks. If your camera does
    not support USB mass storage or PTP, the following descriptions: Try gphoto2 --list-cameras
    and the information at http://www.gphoto.org.'
  merge: -1
