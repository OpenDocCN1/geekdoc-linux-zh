  md: '# Mind Mapping MindManager, Free Mind VYM (View Your Mind)


    OpenOffice.org OpenOffice.org is the Source answer to MS Office. It is a powerful
    office suite including a word processor (Write), a spreadsheet and database manager
    (Calc), a presentation manager (Impress), and a drawing program (Draw). Users
    familiar with the MS Office family of applications find a very similar application
    interface and all the functionality to which they are accustomed. Because OpenOpenOffice.org
    is capable of importing data from MS Office applications, the transition from
    one suite to the other is very merry. A Windows version of OpenOffice.org even
    exists, enabling Windows users to switch to an Source alternative while still
    using Windows. Find more information about OpenOffice.org at http://www.openoffice.org/
    and read Chapter 6 on page 109 for an introduction to OpenOffice.org and a short
    guide to migrating your data from one office to the other.


    StarOffice StarOffice is a proprietary version of OpenOffice.org is distributed
    by Sun Micros. It is available on multiple platforms including Windows and Solaris.
    It includes certain features not available with the free version (OpenOffice).
    Find more information about StarOffice at http://www.sun.com/software/star/staroffice/


    Gnuplot Gnuplot is a very powerful and portable command-line controlled plotting
    software. It is also available for MacOS and Windows platforms. Plots created
    by Gnuplot can be exported to various formats, such as PostScript, PDF, SVG, and
    others, allowing you to process these plots easily. Find more information about
    Gnuplot at http://www.gnuplot.info/index.html.


    Recall Recall is a tool to manipulate databases. Supported databases include MySQL,
    PostgreSQL, XBase with XBase, IBM DB2, and ODBC. Use Recall to generate different
    sorts of reports and forms, design database queries, or import and export data
    to various formats. Find more information about Recall at http://www.thecompany.com/products/recall/


    knoda knoda is a database front-end to various different types of databases. It
    supports connections to MySQL, PostgreSQL, SQLite, and ODBC database servers.
    knoda can be used for manipulating data in tables, creating and storing queries,
    and importing and exporting data in CSV format. Find more information about knoda
    at http://www.knoda.org/


    ![](img/0d7086818d63bf06d3da42b908c48b45_52_0.png)


    SUSE LINUX 33'
