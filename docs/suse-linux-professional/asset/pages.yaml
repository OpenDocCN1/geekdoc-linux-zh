    # 1.3.3 Little Helpers


    Both GNOME and KDE come with numerous little helper applications that can be included
    in your panel. If you want to add new ones or remove existing ones, proceed as
    described in Section 1.3.2 on page 10. The most prominent features in GNOME and
    KDE are SUSEWatcher and SUSE Hardware Tool.


    SUSEWatcher is a program that is integrated into the system tray of the panel.
    It checks for new software updates. To be able to find any new updates, it requires
    an online connection. The status of SUSEWatcher is displayed in the panel by icons
    in different colors.


    When you click the icon in the panel, a window opens, informing you about the
    status of your online updates and the availability of any new updates. You can
    also launch the check manually by clicking ''Check for updates''. Start the online
    update by selecting ''Start online update'' and entering the root password. YaST
    Online Update is displayed.


    SUSE Hardware Tool The SUSE Hardware Tool keeps a list of all hardware components
    of your system. Left-click the panel icon to open a dialog window with a tree
    view featuring the major hardware categories. Configure'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'new hardware item by selecting it and clicking ''Configure'', which starts
    the appropriate YaST module after you provide the root password. Clicking ''Details''
    reveals all information present for the specific hardware item. As soon as new
    hardware is connected and recognized, a pop-up announces this new hardware.


    # 1.3.4 Switching Users


    Both GDM and KDM allow you to switch between different user accounts on the same
    system. You can stay logged in while other users work on your system. Your session
    is locked while you switch to another account, but your applications continue
    to run and your whole session remains unchanged.


    # Switching Users in GNOME


    To open an additional session for another user, select ''New Login'' from the
    GNOME ''Applications'' menu. The other user enters username and password in GDM
    then another GNOME session starts. Your original session is locked-automatically
    on the user switch. To change back into your original session, use Ctrl+Alt+F7.


    # Important


    > Switching Displays

    Your original session is started on the graphical console that can be reached
    with Ctrl+Alt+F7. Additional sessions are started on the higher consoles, reachable
    via F8 and higher.


    # Switching Users in KDE


    Open an additional session in KDE via the main menu. Select ''Switch User'' and
    determine whether your original session should be locked while you switch to another
    user account. KDM appears, requesting username and password for the new account.
    Enter the requested data and a new KDE session starts. To switch back to your
    original session, click ''Switch User'' again. Select the session to switch to.


    Another way to start a new session is to lock your current session via ''Lock
    Session'' and then click ''Switch User'' in the unlock dialog. This goes to the
    KDM login screen, where username and password for the new session can be entered.'
