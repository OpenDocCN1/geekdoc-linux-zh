- img_proc: true
  md: '# 19.1.3 Bash Functions


    There are two important functions of the shell that can make your work a lot easier:


    History To repeat a command that has been entered before, press ↑ until the previous
    command appears at the prompt. Move forward through the list of previously entered
    commands by pressing ⇩. To edit the command line, just move the cursor to the
    desired position using the arrow keys and start typing. Using Ctrl-R to search
    in the history.


    Expansion Expand a filename to its full length after typing its first letters
    until it can be uniquely identified. To do so, type the first letters then hit
    Tab. If there are several filenames starting with the same letters, obtain a list
    of them by hitting Tab twice.


    # First Example: Managing Files


    Now that you know what a command looks like, which directories exist in SUSE LINUX,
    and how to speed up things when using Bash, put this knowledge into practice with
    a small exercise.


    +   1. Open a console from the KDE desktop by clicking the shell icon.


    +   2. Enter the ls command to see the contents of your home directory.


    +   3. Use the command mkdir (which stands for make directory) to create a new
    subdirectory called test by entering mkdir test.


    +   4. Now launch the Kate editor by pressing Alt-F2 and entering kate in the
    input field. Type a few letters in the editor then save the file as Testfile in
    your home directory. Linux distinguishes between uppercase and lowercase. For
    this example, use an uppercase T.


    +   5. View the contents of your home directory again. Instead of typing ls again,
    just press ↑ twice and the ls command should reappear at the prompt. To execute
    the command, hit Enter. The newly created directory test should appear in blue
    letters and Testfile in black. This is how directories and files can be distinguished
    in a console.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '6. Move Testfile into the subdirectory test with the command mv. To speed this
    up, use the expansion function: just enter mv and press [Tab]. As long as there
    is no other file beginning with this letter in the directory, the shell expands
    the filename and adds the string extfile. Otherwise, add a letter or two yourself
    and test [Tab] each time to see whether the shell can expand the name. Finally,
    type a space then after the expanded filename and press [Enter] to execute the
    command.


    7. At this point, Testfile should no longer be in the directory. Check this by
    entering ls again.


    8. To see whether the file has been successfully moved, change into the directory
    with the command cd test. Now enter ls again. You should see Testfile in the listing.
    Change back to your home directory at any point by entering only cd.


    9. To make a copy of a file, use cp. For instance, enter cp Testfile Testbackup
    to copy Testfile to Testbackup. Once again, command ls can be used to see whether
    both files are in the directory.


    # 19.4 Specifying Paths


    When working with files or directories, it is important to specify the correct
    (absolute) path from the root directory to the respective file. You can start
    from the current directory. Address your home directory directly with ~. This
    means there are two ways to list the file Testfile in the directory: by entering
    the relative path with ls or by specifying the absolute path with ls ~/.


    To list the contents of home directories of other users, enter ls ~username. In
    the above-mentioned directory tree, one of the samples is users. In this case,
    ls ~ux lists the contents of the home directory of tux.


    Refer to the current directory with a dot. The next level in the tree is represented
    by two dots. Enter ls .. see the contents of the parent directory of the current
    directory. The command ls .. shows the contents of the directory two levels higher
    in the hierarchy.


    # Second Example: Working with Paths


    Here is another example to illustrate how to move around the directories of your
    SUSE LINUX system.'
