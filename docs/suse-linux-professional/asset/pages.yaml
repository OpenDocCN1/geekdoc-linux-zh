  md: '![](img/0d7086818d63bf06d3da42b908c48b45_77_0.png)


    # ### Figure 3.2: Nautilus Standard Window


    To navigate between folders, use the drop-down menu at bottom left edge of the
    Nautilus window. Here, find all parent folders to the current directory up to
    the file system root. Select the desired folder and it opened in a new Nautilus
    win-dow on top of the old one. Alternatively, open just the immediate parent of
    the current folder by choosing ''File'' ⊒ ''Open Parent''. If you want to close
    these par-ent folders, select ''File'' ⊒ ''Close Parent Folders''.


    # ## 3.3.2 File Management


    Nautilus supports drag and drop for file management. Any file from the desktop
    can simply be dragged onto an open Nautilus window and dropped to its final destination.
    To move files between directories, open the source directory containing- the file
    to. Select ''File'' ⊒ ''Open Location'', enter the path to the target directory,
    drag the files to move to the Nautilus window holding the target directory. Files
    and folders can be moved to and from an open Nautilus window and the desktop.


    If you need to create multiple copies of a file, use ''Edit'' ⊒ ''Duplicate''.
