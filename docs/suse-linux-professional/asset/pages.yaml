  md: 'Change into your home directory with the command cd. Then create a directory
    in it with the name test2 by entering mkdir test2.


    Change into the new directory with cd test2 and create a subdirectory in it with
    the name subdirectory. To change into, use the expansion function: enter cd then
    Tab. The shell expands the rest of the directory name.


    Now try to move the previously created file Testbackup into the current directory
    (subdirectory) without changing the directory again. To achieve this, specify
    the relative path to file: mv ../test/Testbackup . The dot at the end of this
    command is required to tell the shell that the current directory is the destination
    to which to move the file. ../.., in this example, refers to your home directory.


    # # 19.1.5 Wild Cards


    Another convenience offered by the shell is wild cards. There are four different
    types of these in Bash:


    +   * Matches exactly one arbitrary character


    +   * Matches exactly any number of characters


    +   [set] Matches one of the characters from the group specified inside the square
    brackets, which is represented here by the string set


    +   [set] Matches one character other than those identified by set


    Assuming that your test directory contains the files Testfile, Testfile, Testfile2,
    and datafile, the command ls Testfile? lists the files Testfile1 and Testfile2.
    With ls *, the list also includes Testfile. ls * shows all the sample files. Finally,
    you can use the set wild card to address all sample files whose last character
    is a number: ls Testfile[1-9].


    Of the four types of wild cards, the most inclusive one is the asterisk. It could
    be used to copy all files contained in one directory to another one or delete
    all files with one command. The command rm *fil*, for instance, would delete all
    files in the current directory whose name includes the string fil.'
