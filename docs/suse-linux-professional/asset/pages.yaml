- img_proc: true
  md: 'aux Displays a detailed list of all processes, independent of the owner


    kill [option(s)] process ID Unfortunately, sometimes a program cannot be terminated
    in the normal way. In most cases, you should be able to stop a runaway program
    by executing the kill command, specifying the respective process ID (see top and
    ps). kill sends a TERM signal that instructs the program to shut itself down.
    If this does not help, the following-parameter can be used:


    +   -9 Sends a KILL signal instead of a TERM signal, bringing the specified process
    to an end in all cases


    killall [option(s)] processname


    # Network


    ping [option(s)] hostname|IP address

    The ping command is the standard tool for testing the basic functionality of TCP/IP
    networks. It sends a small data packet to the destination host, requesting an
    immediate reply. If this works, ping displays a message to that effect, which
    indicates the network link is basically functioning.


    +   -c number Determines the total number of packages to send and end after they
    have been dispatched (by default, there is no limitation set)

    -f flood ping sends as many data packages as possible; a popular means, reserved
    for root, to test networks

    -i value Specifies the interval between two data packages in seconds (default:
    one second)


    nslookup The domain name system resolves domain names to IP addresses. With this
    tool, send queries to information servers (DNS servers).


    telnet [option(s)] hostname or IP address [Port]

    Telnet is actually an Internet protocol that enables you to work on remote hosts
    across a network. telnet is also the name of a Linux program that uses this protocol
    to enable operations on remote computers.'
