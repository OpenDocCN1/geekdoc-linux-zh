    # 7.3 Mail


    The Evolution component can work with multiple accounts in a variety of formats.
    It offers useful features, such as virtual folders for searching results and filtering
    for junk mail. Configure the application in ‘Edit’ → ‘Preferences’.


    # 7.3.1 Configuring Accounts


    Evolution is capable of fetching e-mail from multiple mail accounts. The account
    from which to send e-mail can be selected when composing a message. Configure
    mail accounts in ‘Edit’ → ‘Preferences’ → ‘Mail Accounts’. To modify an existing
    configuration, select it and click ‘Edit’. To delete an account, select it and
    click ‘Delete’.


    To add a new account, click ‘Add’. This opens the configuration assistant. Click
    ‘Forward’ to use it. Enter your name and your e-address in the respective fields.
    Enter the optional information if desired. Check ‘Make this my default account’
    to use this account by default when writing mails. Click ‘Forward’.


    Select the appropriate e-mail format for this address in ‘Server Type’. ‘POP’
    is the most common format for downloading mail from a remote server. ‘IMAP’ works
    with mail folders on a special server. Obtain this information from your ISP or
    server administrator. Complete the other relevant fields displayed when the server
    type is selected. Click ‘Forward’ when finished. Select the desired ‘Receiving
    Options’, if available. Click ‘Forward’.


    The next set of information to enter is about mail delivery. For submitting outgoing
    e-mail to the local system, select ‘Sendmail’. For a remote server, select ‘SMTP’.
    Get the details from your ISP or server administrator. Complete the other fields
    displayed after selection. Click ‘Forward’ when finished.'
