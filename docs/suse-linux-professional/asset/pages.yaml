- img_proc: true
  md: 'OpenOffice.org consists of several application modules (subprograms), which
    are designed to interact with each other. They are listed in Table 6.1 on the
    current page. The discussion in this chapter is focused on Writer. A full description
    of each module is available in the online help, described in Section 6.6 on page
    115.


    # Table 6.1: The OpenOffice.org Application Modules


    | Writer | Powerful word processor application |

    |---||

    | Calc | Spreadsheet application that includes a chart utility |

    | Draw | Drawing application for creating vector graphics |

    | Math | Application for generating mathematical formulas |

    | Impress | Application for creating presentations |

    | Base | Database application |


    The appearance of the application varies depending on which desktop or window
    manager is used. Additionally, the open and save dialog formats for your desktop
    are used. Regardless of the appearance, the basic layout and functions are the
    same.


    # 6.1 Compatibility with Other Office Applications


    OpenOffice.org is able to work with Microsoft Office documents, spreadsheets,
    presentations, and databases. They can be seamlessly opened like other files and
    saved back to that format. Because the Microsoft formats are closed and the specifics
    are not available to other applications, there are occasionally formatting issues.
    If you have problems with your documents, consider opening them in the original
    application and resaving in an open format, such as RTF for text documents or
    CSV for spreadsheets.


    To convert a number of documents, such as when switching to the application, select
    ''File'' → ''Wizard'' → ''Document Converter''. Choose the file format'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'from which to convert. There are several StarOffice and Microsoft Office formats
    available. After selecting a format, click ''Next'' then specify where OpenOffice.org
    should look for templates and documents to convert and in which directory the
    converted files should be placed. Before continuing, make sure that all other
    settings are appropriate. Click ''Next'' to see a summary of the actions to perform,
    which gives another opportunity to check whether all settings are correct. Finally,
    start the conversion by clicking ''Convert''.


    # # Important


    # ### Finding Windows Files


    Documents from a Windows partition are usually in a subdirectory of /windows.


    # # Important


    When sharing documents with others, you have several options. If the recipient
    only needs to read the document, export it to a PDF file with ''File'' → ''Export
    to PDF''. PDF files can be read on any platform using a viewer like Adobe Acrobat
    Reader. To share a document for editing, use one of the regular document formats.
    The default formats comply with the OASIS standard XML format, making them compatible
    with a number of applications. TXT and RTF formats, although limited in formatting,
    might be a good option for text documents. CSV is useful for spreadsheets. OpenOffice.org
    might also offer your recipient''s preferred format, especially Microsoft formats.


    OpenOffice.org is available for a number of operating systems. This makes it an
    excellent tool when a group of users frequently need to share files and do not
    use the same system on their computers.


    # # 6.2 Word Processing with Writer


    There are two ways to create a new document. To create a document from scratch,
    use ''File'' → ''New'' → ''Text Document''. To use a standard format and defined
    elements for your own documents, try a wizard. Wizards are small utilities that
    let you make some decisions and then produce a ready-made document from a template.
    For example, to create a business letter, select ''File'' → ''Wizards'' → ''Letter''.
    Using the wizard''s dialogs, easily create a basic document using a standard format.
    A sample wizard dialog is shown in Figure 6.2 on page 113.


    Enter text in the document window as desired. Use the ''Formatting'' toolbar or
    the ''Format'' menu to adjust the appearance of the document. Use the ''File''
    menu'
  merge: -1
