    # 5.4 The Linux Documentation Project


    The Linux Documentation Project (TLDP) is run by a team of volunteers who write
    Linux and Linux-related documentation (see http://www.tldp.org). The set of documents
    contains tutorials for beginners, but is mainly focused on experienced users like
    professional system administrators. TLDP publishes HOWTOs, FAQs, and guides (handbooks)
    under a free license.


    # 5.4.1 HOWTOs


    HOWTOs are usually a short, informal step-by-step guide to accomplish a specific
    task. It is written by experts for nonexperts in a procedural manner. For example,
    how to configure a DHCP server. HOWTOs can be found in the package howto and are
    installed under /usr/share/doc/howto'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# ## 5.4.2 Frequently Asked Questions


    FAQs (frequently asked questions) are a series of questions and answers. They
    originate from Usenet newsgroups where the purpose was to reduce continuous reposting
    of the same basic questions.


    # ## 5.5 Wikipedia: the Free Online Encyclopedia


    Wikipedia is a “multilingual encyclopedia designed to be read and edited by anyone”
    (see http://en.wikipedia.org). The content of Wikipedia is created by its users
    and is published under a free license (GDFL). Any visitors edit articles, which
    gives the danger of vandalism, but this does not repel visitors. With over four
    hundred thousand articles, find an answer for nearly every topic.


    # ## 5.6 Guides and Books


    Linux offers a broad range of guides and books.


    # ### 5.6.1 SUSE Books


    SUSE provides detailed and informative books—the User Guide and Administration
    Guide. We provide informative HTML and PDF versions of our books in different
    languages.


    If you need some basics, install the User Guide from the packages suselinux-userguide_XX
    and suselinux-userguide_XX-pdf (replace XX with your preferred language). For
    the Administration Guide, the package names are suselinux-adminguide_XX and suselinux-adminguide_XX-pdf.


    # ### 5.6.2 Other Manuals


    The SUSE help center offers additional manuals and guides for various topics or
    programs. More can be found at http://www.tldp.org/guides.html.'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'They range from Bash Guide for Beginners to Linux Filesystem Hierarchy Linux
    Administrator’s Security Guide. Generally, guides are more detailed and exhaustive
    than a HOWTO or FAQ. They are usually written by experts for experts. Some of
    these books are old but still valid. Install books and guides with YaST.


    # 5.7 Usenet


    Created in 1979 before the rise of the Internet, Usenet is one of the oldest computer
    networks and still in active use. The format and transmission of Usenet articles
    is very similar to e-mail, but is developed for a many-to-many communication.


    Usenet is organized into seven typical categories: comp.* for computer related
    discussions, misc.* for miscellaneous topics, news.* for newsgroup-related matters,
    rec.* for recreation and entertainment, sci.* for science-related discussions,
    soc.* for social discussions, and talk.* for various controversial topics. The
    top levels are split in subgroups. For instance, comp.os.linux.hardware is a news-group
    for Linux-specific hardware issues.


    Before you can post an article, have your client connect to a news server and
    subscribe to a specific newsgroup. News clients include Knode or Evolution. Each
    news server communicate to other news servers and exchanges articles with them.
    Not all newsgroups may be available on your news server.


    Interesting newsgroups for Linux users are comp.os.linux.apps'
  merge: -1
