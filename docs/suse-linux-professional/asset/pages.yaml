  md: '# 1.3.2 Configuring Desktop Components


    Almost all desktop components can be configured individually. Right-clicking the
    respective element opens it its context menu. To illustrate the procedure, we
    provide some examples.


    > > Tip

    >Controlling the Desktop Configuration

    Both GNOME and KDE feature a Control Center providing central access to all key
    configuration options of the desktop environment. Refer to Chapter 3 on page 47
    or Chapter 4 on page 69 for details.


    Configuring GNOME Desktop Components


    Procedure 1.1: Adding a New Application to the Quick Launch Area


    +   1. Right-click an empty patch of the panel where you want to add the new application.

    2. Choose ‘Add to Panel’ from the menu that appears.

    3. Select ‘Application Launcher’ from the ‘Add to Panel’ menu.

    4. Select the application from the ‘Applications’ menu and quit the configuration.


    Procedure 1.2: Changing the Desktop Background


    +   1. Right-click the desktop.

    2. Choose ‘Change Desktop Background’ from the menu that appears.

    3. A dialog window appears, offering several options concerning the desktop. Either
    use the mouse cursor to select one of the existing wallpapers or click ‘Add’ to
    open a file dialog where you can add your own image. Use ‘Style’ to determine
    how the image should be rendered to fit into the dimensions of your display. Use
    ‘Remove’ to remove a selected background from the menu. If you prefer no background
    image at all, set a desktop color.

    4. Your changes are applied automatically. Leave the dialog with ‘Close’.'
