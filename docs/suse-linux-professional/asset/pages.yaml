  md: '# Visualizations


    amaroK comes with a number of visualizations that display a graphical effect for
    the music played. Native amaroK visualizations are displayed in the player window.
    Cycle through the various available display modes by clicking the animation.


    In addition to the above, amaroK also supports the visualization plug-ins of the
    XMMS media player. To use these, first install the `xmms-plugins` package then
    select ''Visualizations'' from the amaroK menu. This opens a window listing the
    available plug-ins. XMMS plug-ins are always displayed in an extra window. In
    some cases, there is an option to display them in fullscreen mode. For some plug-ins,
    you may not get a smooth visual effect unless you use a 3D-accelerated graphics
    card.


    # XMMS


    XMMS is another full-featured media player with robust audio support, that pops
    or breaks during playback should be very rare. The application is easy to use.
    The button for displaying the menu is located in the upper left corner of the
    program window. For those preferring a GNOME-like look and feel, there is a GTK
    2 version of XMMS available, the Beep Media Player. Just install the package bmp.
    However, not all XMMS plug-ins are supported by this port of XMMS.


    Select the output plug-in module with ''Options'' → ''Preferences'' → ''Audio
    I/O Plugins''. If the `xmms-kde` package is installed, the aRT sound server can
    be configured.


    > Important


    Using the Disk Writer Plug-In

    XMMS automatically redirects its output to the ''Disk Writer Plugin'' if it is
    not able to find a configured sound card. In this case, the files are written
    to the hard disk as WAV files. The time display runs faster than when playing
    the output through a sound card.


    Start various visualization plug-ins with ''Options'' → ''Preferences'' → ''Visualization
    Plugins''. If you have a graphics card with 3D acceleration, select an application
    such as the OpenGL spectrum analyzer. If the `xmms-plugins` package is installed,
    try the Infinity plug-in.'
