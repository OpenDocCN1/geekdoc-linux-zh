    # 13.1.3 alsamixer


    alsamixer can be run from the command line without the X environment, so is entirely
    contained. An alsamixer window always consists of the following elements: a top
    row holding basic information on card and chip type, the selected view type, and
    the mixer item bars the information area. Use ← and → to scroll left or right
    if the controls cannot be displayed in one screen. The names of the controls appear
    below controls and the currently selected control is colored in red. Toggle between
    muted and unmuted state of any mixer control. A muted control has ''MM'' written
    its name. Any control that has capture (recording) capabilities has a red capture
    flag.


    alsamixer has three different view modes: ''Playback'', ''Capture'', and ''All''.
    By default, alsamixer is started in ''playback'' mode, displaying only those mixer
    controls relevant for playback (Master Volume, PCM, CD, etc.). ''Capture'' displays
    only those controls used for recording. ''All'' displays all controls available.
    Switch the view modes using F3 and F5.


    Select channels with ← and → or N and P. Use + and - or + to in-'
