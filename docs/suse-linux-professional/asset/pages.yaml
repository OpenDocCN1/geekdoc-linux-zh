  md: '# Kontakt: An E-Mail and Calendar Program


    Kontakt combines the functionality of a number of KDE applications into a convenient
    single interface for personal information management. These applications include
    KMail for e-mail, KOrganizer for the calendar, KAddressbook for contacts, and
    KNotes for notes. It is also possible to sync data with external devices, such
    as a handheld. Kontakt integrates easily with the rest of the KDE desktop and
    connects to a variety of groupware servers. It includes extra features, such as
    spam and virus filtering and an RSS reader.


