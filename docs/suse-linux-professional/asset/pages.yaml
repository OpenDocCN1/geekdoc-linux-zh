  md: '# 7.3.5 Filters


    Evolution offers a number of options for filtering e-mail. Filters can be used
    to move a message into a specific folder or to delete a message. Messages can
    also be moved directly to the trash with a filter. There are two options for creating
    a new filter: creating a filter from scratch or creating a filter based on a message.
    The filter is extremely useful for filtering messages sent to a mailing list.


    # Setting Up a Filter


    Select ‘Tools’ → ‘Filters’. This dialog lists your filters, which can be edited
    or deleted. Click ‘Add’ to create a new filter. To create a filter based on a
    message, instead select the message then ‘Tools’ → ‘Create Filter from Message''.


    Enter a name for the new filter in ‘Rule Name’. Select the criteria to use for
    the filter. Options include sender, recipients, source account, subject, date,
    and status. The drop-box showing ‘Contains’ provides a variety of options, such
    as contains, and is not. Enter the text for which to search. Click ‘Add’ to add
    more filter criteria. Use ‘Execute actions’ to determine if all or some of the
    criteria must be met to apply the filter.


    In the lower part of the window, determine the action to take when the filter
    criteria are met. Messages can, for example, be moved or copied to a folder or
    assigned a special color. When moving or copying, select the destination folder
    by clicking. In the folder list that appears, select the folder. Use ‘New’ to
    create a new filter. Click ‘OK’ when the correct folder is selected. When finished,
    click ‘OK’.


    # Applying Filters


    Filters are applied in the order listed in the dialog accessed with ‘Tools’ →
    ‘Filters’. Change the order by highlighting a filter and clicking ‘Up’ or ‘Down’.
    Click ‘OK’ to close the filter dialog when finished.


    Filters are applied to all new messages. They are not applied to mail already
    in your folders. To apply filters to messages already received, select the desired
    messages then select ‘Actions’ → ‘Apply Filters’.


    # 7.4 Contacts


    Evolution can use several different address books. Available books are listed
    in the left frame. Search for a particular contact using the search bar. Add contacts'
