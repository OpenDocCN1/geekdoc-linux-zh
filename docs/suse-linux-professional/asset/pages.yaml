  md: '# Important


    # Establishing a Web of Trust


    Encrypted communication is only secure to the extent that you can positively associate
    public keys in circulation with the specified user. By cross-checking and signing
    these keys, you contribute to the establishment of a web of trust.


    # Important


    Select the key to sign in the key list. Select ‘Keys’ → Sign Keys’. In the following
    dialog, designate the private key to use for the signature. An alert reminds you
    to check the authenticity of this key before signing it. If you have performed
    this check, click ‘Continue’ and enter the password for the selected private key
    in the next step. Others can now check the signature by means of your public key.


    # 12.3.2 Trusting Keys


    Normally, you are asked by the corresponding program whether you trust the key
    (whether you assume it is reliable by its authorized owner). This happens time
    a message needs to be decrypted or a signature must be checked. To avoid this,
    edit the trust level of the newly imported key.


    Right-click the newly imported key to access a small context menu for key management.
    Select ‘Edit Key in Terminal’ from it. KGpg opens a text console in which to set
    the trust level with a few commands.


    At the prompt of the text console (Command), enter trust. On a scale from 1 (unsure)
    and 5 (complete trust) make an estimate of how much you trust the signers of the
    imported key have checked the true identity of the key owner. Enter the selected
    value at the prompt (Your decision?). If you are sure about the signers'' trustworthiness,
    enter 5. Answer the following question by entering y. Finally, enter quit to exit
    the console and return to the list of keys. The key now has the trust level Ultimate.


    The trust level of the keys in your key ring is indicated by a color bar next
    to the key name. The trust level is, the less you trust the signer of the key
    to have checked the true identity of the keys signed. You may be entirely sure
    about the signer''s identity, but he may still be lazy in checking other people''s
    identities before signing their keys. Therefore, you could trust him and his own
    key, but assign lower trust levels to keys of others that have been signed by
    him. The trust level''s purpose is solely one of a reminder. It does not trigger
    any automatic actions by KGpg.


    ![](img/0d7086818d63bf06d3da42b908c48b45_188_0.png)'
  merge: -1
