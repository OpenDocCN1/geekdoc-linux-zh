  md: '# 14.1 Watching TV with motv


    motv is an improved successor to xawtv. It incorporates all essential functions
    into the user interface. Start the application with ''Multimedia'' → ''Video''
    → ''motv''. Start it at the command line with motv. Initially, only a TV window
    appears after the application starts. Open a menu window by right-clicking.


    ![](img/0d7086818d63bf06d3da42b908c48b45_217_0.png)


    Figure 14.1: The TV Application motv


    # 14.1.1 Video Source and Network Search


    In ''Settings'' → ''Input'', select the video source. If you select ''Television'',
    set up the broadcasting network before starting the application. This automatically
    takes place with the network search, also found under the ''Settings'' menu. If
    you click ''Save settings'', the network found is entered into the .xawtv file
    in your home directory and will be available the next time you start the application.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Tip


    Selecting Channels

    If you do not want to browse for all available channels, find the next channel
    with Ctr↑. If needed, subsequently adjust the broadcast frequency with ← →.


    # Tip


    # 14.1.2 Retrieving Audio Data


    The audio output of the TV card is connected to the line input of your sound card,
    to the speakers, or to an amplifier. Some TV cards can change the volume of the
    audio output. The volume can be set with the sliders that appear after selecting
    ‘Settings’ → ‘Slider’. This window also provides the sliders for brightness, contrast,
    and color.


    To use your sound card for audio playback, check the mixer settings using gamix,
    described in Section 13.1 on page 178. For sound cards meeting the AC97 specifications,
    set ‘Input-MUX’ to ‘Line’. The volume can then be adjusted with the ‘Master’ and
    ‘Line’ sliders.


    # 14.1.3 Screen Proportions and Full-Screen Mode


    Most televisions have a height and width ratio of 4:3. These proportions can be
    set with ‘Tools’ → ‘Screen Dimensions’. If ‘4:3’ is selected here (this is the
    default setting), the screen dimensions are retained automatically, even when
    the display size is changed.


    With F or ‘Tools’ → ‘Fullscreen’, switch to full-screen mode. If the TV image
    in full-screen mode is not scaled to the full monitor size, some fine-tuning is
    required. Many graphics cards can scale the full-screen television image to the
    full monitor size without changing the graphical mode. If your card does not support
    this function, the graphics mode must be switched to 640x480 for the full-screen
    mode. Create the related configuration in ‘Settings’ → ‘Configuration’. After
    restarting motv, the monitor mode is also changed if you have switched to full-screen
    mode.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '> Tip

    Storing the Configuration in .xawtv


    The .xawtv file is created automatically and updated by clicking ''Settings''
    ''Save settings''. Here, the broadcasters are saved along with the configuration.
    More information about the configuration file can be found in the man page for
    xawtvrc.


    # 14.1.4 The Launcher Menu


    Use the launcher menu to start other applications to use with motv. Start the
    audio mixer gamix and the video text application alev, for example, using a keyboard
    shortcut. Applications to launch from motv must be entered in the .xawtv file.
    The entries should look like this:


    ```

    [launch] Gamix = Ctrl+G, gamix aLev = Ctrl+A, alev

    ```


    The shortcut then the command used to start the application should follow the
    application name itself. Start the applications entered under [launch] via the
    ''Tool'' menu.


    # 14.2 Video Text Support


    Alevt to browse video text pages. Start the application with ''Multimedia'' ->
    ''Video'' -> ''alev'' or at the command line with alevt.


    The application saves all the pages of the selected station activated with motv.
    Browse pages by entering the desired page number or by clicking a page number.
    Move forward or backward through the pages by clicking ''«'' or ''»'', located
    in the lower window margin.


    Recent versions of motv and its successor xawtv4 include their own video text
    applications: mtt (motv) and mtt4 (xawtv4). mtt4 even supports DVB cards.'
  merge: -1
