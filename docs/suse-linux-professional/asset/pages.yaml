  md: '# SUSE LINUX FAQ


    # Additional Information


    Where do I find general and up-to-date information for SUSE LINUX?


    In addition to this FAQ chapter, SUSE provides a comprehensive FAQ Web site at
    http://www.novell.com/products/linuxprofessional/faq/index.html.


    Are the SUSE manuals also available as PDF or HTML files?


    Our manuals are included on the CDs and are also available through the SUSE help
    center. To start the help center, press Alt-F2 and enter the command susehelp.
    The HTML versions are available in the packages suselinux-adminglide_en and suselinux-userguide_en.
    In the installed system, go to the directory /usr/share/doc/manual/suseinux-adminglide_en
    or /usr/share/doc/manual/suselinux-userguide_en. The PDF versions can be found
    in suselinux-adminglide_en-pdf and suselinux-userguide_en-pdf.


    Where can I get more information about SUSE LINUX?


    Most of the information about the installation and features of SUSE LINUX is provided
    in the manuals. Documentation for applications is available in /usr/share/doc/packages
    and the HowTos are located in /usr/share/doc/howto/en. Read these files with a
    command like less /usr/share/doc/howto/en/DOS-to-Linux-HOWTO.txt.gz. Terminate
    the command by pressing Q.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Hardware


    Is my hardware supported? It is best to refer to the component database at http://cdb.suse.de/index.php?LANG=en_EN
    or http://cdb.suse.de.less /usr/doc/howto/en/Hardware-HOWTO.gz can also provide
    some information. Also check the hardware section of the SUSE LINUX FAQ at http://www.novell.com/products/linuxprofessional/faq/index.html.


    # Installation


    Where do I find the current system requirements for an installation of SUSE LINUX?


    Refer to http://www.novell.com/products/linuxprofessional/sysreqs.html for the
    system requirements of the most recent SUSE LINUX distribution.


    How much disk space do I need for Linux?


    This depends on how many and which packages you want to install. A standard installation
    with office applications requires about 2 GB. Is recommended if you want space
    for your own data as well. To install just about everything, you need 3–6 GB,
    depending on the version.


    What is partitioning?


    Partitioning is dividing the hard disk into smaller sections. For the default
    configuration, SUSE LINUX requires at least two partitions (one for Linux itself
    and one swap partition for the virtual main memory).


    Which file system do you recommend?


    The file system best suited for you highly depends on the scenario in which your
    system will be run. ReiserFS tends to be suited for home users, but if you intend
    to run a high performance server, you might want to use another file system. Refer
    to File Systems in Linux in the Administration Guide for more information about
    the file systems supported by SUSE LINUX.


    How can I get a short information on all software packages contained in SUSE LINUX?


    SUSE maintains a list of all packages contained in the current version under http://www.novell.com/products/linuxpackages/professional/index.html.
    Either enter a package name or use one of


    272'
  merge: -1
  pgno: 291
- img_proc: true
  md: 'the sort methods available. Then view a short description of the package similar
    to the one you would get in YaST.


    I want to remove Linux. How does this work?


    With fdisk, delete the Linux partitions. You might need to run fdisk in Linux.
    Afterwards, boot from the MS-DOS disk and run fdisk /MBR in DOS or Windows.


    # System Configuration and Administration


    Do I need to be afraid of a virus in Linux?


    In Linux, there have been no serious viruses found. Also, viruses cannot cause
    any serious damage if they are not activated by root. The only virus scanners
    available in Linux search e-mails for Windows viruses (if Linux is used as a router
    or server). Nevertheless, you should back up important data and configurations.


    I cannot find any .exe files. Where are all the applications?


    In Linux, executable files normally do not have file extensions. Most programs
    are located in /usr/bin and /usr/X11R6/bin.


    How can I recognize executable files?


    The command ls -l returns all executable files in the directory /usr/bin in green.
    Recognize them by the x in the first column.


    ```

    -rwx-xr-x 1 root root 64412 Jul 23 15:23 /usr/bin/ftp

    ```


    How do I start a service or an application at boot?


    To start certain services at boot, use the YaST module ''System Services (Runlevel)''.
    Find a detailed description of this module and some background-information about
    the boot and runlevel concept of Linux in the Administration Guide.


    To configure GNOME to start any application automatically when it starts, open
    the GNOME Control Center and choose ''System'' → ''Sessions''. Open the tab named
    ''Startup Programs'' and enter the application that you started.


    In KDE, start Konqueror and open the folder .kde/Autostart in your home directory.
    Drag the application icon from the main menu into the Konqueror window and choose
    ''Link Here''. The application will be started the next time you log in KDE.'
  merge: -1
  pgno: 292
- img_proc: true
  md: 'I only have an application in source code. How can I install it?


    Before trying to compile an application on your own check whether it already exists
    as install RPM. Web sites like http://packman.links2linux.org/ or http://rpmfind.net.


    Decompress the archive with tar vzf name.tar.gz, read the INSTALL or README files,
    and follow the instructions. If compiling on your own, note that neither the compilation
    nor the resulting application is covered by the installation support.


    # Do I need to compile a kernel?


    No, it is usually unnecessary and strongly discouraged for inexperienced users
    to recompile the kernel. Do so only at your own risk. In cases of custom compiled
    kernels, SUSE cannot provide any installation support.


    # How can I defragment my hard disk?


    Linux file systems prevent fragmentation. However, make sure that you do not use
    more than 80% of each partition. The fuller your hard disk, the more "fragmentation"
    you get, even under Linux. Use df -h to view information used and available hard
    disk space.


    # I need more space for Linux. How can I add another hard disk?


    To make more space available, integrate a new hard disk or parts of it (partitions)
    into your Linux system at any time. For example, if it turns out that you need
    more space in /opt, mount an additional hard disk partition to this directory.
    To do so, follow this procedure:


    +   1. Install your new hard disk following the instructions of the manufacturer
    to start Linux.


    +   2. Log in as the root user.


    +   3. Partition the new hard disk with fdisk. For further information, refer
    to the manual page of fdisk with man fdisk.


    +   4. Format the partition with mke2fs /dev/hdb1.


    ```

    cd /opt

    mkdir /opt2

    mount /dev/hdb1 /opt2

    cp -avx . /opt2

    ```


    Check thoroughly to see whether all the data has been copied. Afterwards, move
    the old directory and add a new one—an empty mount point:'
