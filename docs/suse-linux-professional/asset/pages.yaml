    such add-on programs, read their licenses as well as the instructions included.


    # 9.5.3 Synchronizing Your Address Books and Calendars


    To synchronize your calendars and addresses, use the KDE tools MultiSync. Start
    the tool with the command multisync. Create a Connector pair before you synchronize
    your data. Go to ''File'' -> ''New'' and select your Knectors. Leave it with ''Ok''.


    The name is listed in the main window. To synchronize with your handheld computer
    go to ''File'' -> ''Sync''.'
