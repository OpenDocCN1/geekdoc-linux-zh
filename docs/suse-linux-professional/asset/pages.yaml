  md: '# Tip


    Preserving Data Integrity

    When burning audio CDs, choose a lower burning speed to reduce the risk of burning
    errors.


    # 15.3 Copying a CD


    Select ''Tools'' → ''CD'' → ''Copy CD'' or the copy CD button from the toolbar.
    In the dialog that opens, make the settings for the reading and writing device
    as shown in Figure 15.3 on the following page. The writing options discussed are
    also available here. An additional function enables the creation of several copies
    of the CD.

    Check ''On the fly'' to burn the CD as soon as it has been read or select ''Only
    create image'' to create an image in the path specified in ''Temp Directory''
    → ''Write image file to'' and burn the image later.


    # 15.4 Writing ISO Images


    If you already have an ISO image, go to ''Tools'' → ''CD'' → ''Burn CD image''.
    A window opens in which to enter the location of the ''Image to Burn''. K3b calculates
    a check sum and displays it in ''MD5 Sum''. If the ISO file was downloaded from
    the Internet, this sum shows if the download was successful.


    Use the ''Options'' and ''Advanced'' tabs to set your preferences. To burn the
    CD, click ''Start''.


    # 15.5 For More Information


    Apart from the two main functions described above, K3b offers other functions,
    such as the creation of DVD copies, reading audio data in WAV format, rewriting
    CDs, and the integrated audio player. A detailed description of all available
    program features is available at http://k3b.sourceforge.net.'
