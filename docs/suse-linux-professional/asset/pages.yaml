  md: 'This chapter focuses on the installed system. It does not cover questions regarding,
    the installation or hardware configuration procedures under SUSE LINUX. These
    procedures are covered in-depth in the Administration Guide and some of the most
    frequently encountered problems are dealt with in the SUSE LINUX FAQ at the end
    of this book.


    # 1.1 Logging In and Out


    If your computer is not run in a networking environment and you are the only person
    using it, your system automatically boots into the desktop environment. Once you
    have started your computer, there is no need for you to authenticate. This feature,
    called auto login, is only provided by the KDM display manager, however. It can
    be disabled at any time using the YaST user management described in the Administration
    Guide.


    If than one user account is configured on your computer, any user must authenticate.
    After your SUSE LINUX system has started, you will be prompted for your username
    and password.


    Depending on the desktop environment installed, the program managing the login
    process and sessions is either GDM for GNOME desktops or KDM for KDE. GDM and
    KDM differ slightly in functionality, which is why they are treated separately.
    See Section 1.3 on page 7 for details on the desktop environments or refer to
    the separate GNOME or KDE chapters, Chapter 3 on page 47 or Chapter 4 on page
    69.


    # 1.1.1 Introducing GDM


    A GDM login screen consists of two main components, the input field for username
    and password and a menu. See Figure 1.1 on the facing page.


    The menu contains three items:


    Language Select the language to use in the following GNOME session. You may change
    the language temporarily for just the next session or set the choice permanently
    as your default.


    Session Determine the session type (GNOME, KDE, etc.). Change this setting only
    if you want to use something other than the system default. Future sessions will
    always be of the same type as the initial one, unless you'
  merge: -1
  pgno: 23
- img_proc: true
  md: '![](img/0d7086818d63bf06d3da42b908c48b45_24_0.png)


    Figure 1.1: A GDM Login Screen


    change the session type manually. If you change the session type manually, you
    will be asked whether the changes should be applied to the following sessions
    or whether they should be made default for all future sessions.


    **Actions** Choose some system-related actions, such as shutting down the system,
    rebooting it, or configuring the login manager.


    To terminate the session, choose ‘Log Out’ from the ‘System’ menu. Then determine
    whether you want to save the current state of your session, end your session and
    leave the system running, or restart or shut down on logout. Choose to save your
    session if you want to start your next one with exactly the same setup as when
    you leave.


    #  1.1.2 Introducing KDM


    A KDM login screen consists of two main elements. As shown in Figure 1.2 on the
    next page, it has input fields for username and password and a menu. The menu
    provides the following options:'
  merge: -1
  pgno: 24
- img_proc: true
  md: '![](img/0d7086818d63bf06d3da42b908c48b45_25_0.png)


    Figure 1.2: A KDM Login Screen


    **Session Type** Determine the session type. Make changes only if you want to
    use a session type other than the default (KDE). Future sessions are automatic-
    of the same session type unless you change the session type manually.


    **Menu** ‘Remote Login’ enables you to log in on a remote machine. ‘Shutdown’
    either turns off the computer or reboots the system.


    To terminate the session, choose ‘Logout’ from the main menu. Then determine whether
    to end your session and leave the system running or restart or shut down on logout.
    If your system provides power management, you are offered to suspend the computer,
    making the next system start much faster than a complete boot.


    # 1.2 The User Concept of Linux


    Linux distinguishes between “ordinary” users and a superuser. The superuser, called
    root, takes care of all kinds of administrative tasks and has access to all'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'parts of the system. Normal users lack these privileges.


    All users including the supervisor have their own home directories where all private
    data, like documents, bookmarks, or e-mail, are stored. Access to these home directories
    is strictly limited to their respective owners. Folders in a home directory holding
    sensitive data can also be protected against read access by other users. System
    directories holding central configuration files or executable files can only be
    modified by the superuser. For more information about the Linux permissions and
    user concept, refer to Section 19.2 on page 255.


    While this concept may not look very appealing at first, it adds to security.
    A user without root privileges cannot damage the entire system. Any damage caused
    is strictly limited to the user''s own account and data. Any operation executed
    with root privileges may potentially harm the entire system. Anyone intending
    to harm a running Linux system must gain root privileges first. This is why it
    is much harder to create viruses for Linux systems. They have to overcome the
    root barrier first.


    As well as offering user identities for administrators and normal users, Linux
    supports multiple users working on one machine simultaneously. These users can
    connect to the system via different terminals or network connections.


    # 1.3 Desktop


    SUSE LINUX offers several choices for your desktop. GNOME and KDE, the most common
    desktops, provide features and functions similar to those of the desktop used
    in Microsoft Windows or Mac OS. This section introduces its most important features
    and helps you get accustomed to your new desktop environment.


    # 1.3.1 Desktop Terminology


    The following list includes some terms often used in a desktop context, regardless
    of the base system. However, some of them have different meanings in desktop environment
    or are even limited to one environment.


    desktop The desktop is your primary work environment. It fills the screen, but
    is more than just a background. Put icons of your most frequently used applications
    or objects on the desktop for easy access.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '![](img/0d7086818d63bf06d3da42b908c48b45_27_0.png)


    # Figure 1.3: An Example Desktop


    panel The panel is a bar, typically located at the top or a bottom of the screen,
    that holds the menus, the quick launch area, a notification area or tray, some
    little helper applications, and, in most cases, also the taskbar (called window
    list in gnome). It is designed to provide all vital information needed for running
    applications or the system and to provide easy access to some important functions.
    Both gnome and KDE allow you to adjust the panel orientation (horizontal versus
    vertical) to your needs. In a KDE environment, you might also see “Kicker” as
    another word for the panel.


    menu button Similar to the “start button” on the MS Windows desktop, Linux desktops
    normally contain a menu button at the left end of the panel that opens the main
    menu. This menu is a well-ordered structure for accessing the main applications
    or functions, such as “Search,” “Logout,” and Lock Session.


    taskbar or window list The taskbar (window list in gnome) is used to switch between
    open windows. In Linux, it also provides an overview'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'of all virtual desktops available and provides a means to switch between them.
    The taskbar is part of the panel.


    The quick launcher is part of the panel. It holds the icons for the most important
    functions or applications to enable you to start them without going through the
    applications menu.


    notification area or system tray The rightmost part of the panel holds the system
    clock, the volume control, and several other helper applications.


    applet An applet is a small application that is integrated into the panel. An
    application is a fullyfledged computer program using its own window on


    desktop icons Desktop icons reside on the desktop. They represent files, directories,
    or functions, and removable media, like CDs or DVDs. The best known desktop icon
    is probably the trash bin, where you can drop files you want to delete.


    virtual desktops or workspaces The concept of virtual desktops (workspaces in
    GNOME) is like having several desks at your office. You store things on all of
    them, but you only work at one of them at a time. You can devote each to multiple
    tasks or use them as extra space. Virtual desktops enable you to have multiple
    windows open at the same time, but only look at one or some of them. Easily shift
    windows between virtual desktops, like shifting papers from one physical desk
    to another. All desktop environments offer a means to control the number and use
    of virtual desktops. A workspace switcher is provided in both the GNOME and the
    KDE panel.


    terminal enables you to send commands to the operating system. There are "real"
    (physical) terminals basically consisting of a display screen and a keyboard connected
    to the computer. Then there are terminalations, which run in a window on your
    desktop and offer a prompt where you can pass commands to the operating system.


    session Once you log in to your desktop, it starts a session for you. This session
    is valid until you log out. A session includes the start-up and shutdown of certain
    programs on login and logout. These settings can be configured individually for
    each user account.'
  merge: -1
  pgno: 28
