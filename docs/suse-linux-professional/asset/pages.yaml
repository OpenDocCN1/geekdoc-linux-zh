  md: 'The list overview window displays a list of all currently available actions
    along with their keyboard shortcuts. Deactivate or change a keyboard shortcut
    by clicking the corresponding shortcut entry. Then enter a new shortcut or delete
    the current one with `Backspace`. All changes take effect immediately. Restore
    the current keyboard shortcut by clicking its entry and leaving the dialog with
    ''Close''.


    # 3.2.10 Assistive Technology


    Use this module to activate and configure active technology support for disabled
    users. First, globally activate this support via ''Enable assistive technologies''.
    Because this affects various settings of your entire desktop, such as mouse and
    keyboard behavior or font sizes, these changes do not take effect until the next
    time you log in. Select the type of support you need. Choose from ''Screen reader'',
    ''Magnifier'', and ''On-Screen keyboard''. More information about this topic can
    be found in Section 3.5 on page 65.


    # 3.2.11 Sound (System Alerts)


    This module allows the association of certain system events and application alerts
    with characteristic audio signals. The dialog box consists of three tabs (''General'',
    ''Sound Events'', and ''System Bell''). The two check boxes in the ''General''
    tab must be activated to use audio signals for certain desktop events.

    In ''Sound Events'', determine which events and application alerts should be associated
    with which sounds. All sound associations already defined for applications are
    listed. Test a sound by first selecting the notice in the ''Event'' column then
    clicking ''Play''. Change the sound by clicking ''Event'' then ''Browse''. The
    dialog that appears provides a list of files from which to choose. Close it with
    ''OK''.


    In the ''System Bell'' tab, determine whether an audible bell should be activated
    for all kinds of system events and whether to have visual feedback as well. Visual
    feedback could consist of a flashing window title bar or the entire screen flashing.


    # 3.2.12 Default Applications


    To improve the interoperability of your GNOME desktop, configure the default Web
    browser, mail reader, and terminal applications that should be launched whenever
    another GNOME application needs these functionalities. Select the application''s
    name and customize its command if necessary. If you, for example, set'
  merge: -1
