- img_proc: true
  md: 'Start Kooka from the menu or enter the command kooka. When started, Kooka opens
    a three-frame window with a menu bar to the upper left and a toolbar directly
    below it. All windows can be freely readjusted or rearranged with the mouse. It
    is also possible to completely detach single frames from the Kooka window for
    deliberate placement on the desktop. Click and drag the double line right above
    the frame. Any frame, except the main window, can be placed within any other frame
    aligned to the left, right, top, bottom, or center. Centered windows have the
    same size, are stacked, and can be brought to the foreground with tabs.


    The ''Image Viewer'' and the ''Scan Preview'' frames share a window by default.
    Tabs allow switching between them. The left frame provides the gallery. This is
    a small file browser for accessing the scanned images. The frame to the lower
    right is shared by OCR (optical character recognition) and the thumbnails, which
    can be loaded into the image viewer with a click of the mouse. See Figure 17.1
    on the current page.


    ![](img/0d7086818d63bf06d3da42b908c48b45_247_0.png)


    | Image Name | Size | Format |

