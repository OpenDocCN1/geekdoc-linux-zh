  md: '# Important


    # Protect Your KWallet Password


    If you forget your KWallet password, it cannot be recovered. Further, anyone who
    knows your password can obtain all information contained in the wallet.


    # Configuring KWallet


    When you start KWallet for the first time, a dialog window appears with the welcome
    screen. Choose between ‘Basic setup’ and ‘Advanced setup’. ‘Basic setup’ is recommended.
    If you choose it, select in the next screen whether you want to store personal
    information. Some KDE applications, like Konqueror or KMail, can make the wallet
    system to store Web data and cookies. Select ‘Yes, I wish to use the KDE wallet
    to store my personal information for this purpose and leave with ‘Finish’.


    If you choose ‘Advanced setup’, you have an additional security level screen.
    The default settings are generally acceptable for most users, but others may wish
    to change them. ‘Automatically close idle wallets’ closes wallets after a period
    of inactivity. To separate network passwords and local passwords, activate ‘Store
    network passwords and local passwords in separate wallet files’. Close with ‘Finish’.


    Once configured, KWallet appears in the panel. Right-click the KWallet icon and
    select ‘Configure KWallet’ if you want to modify the configuration. A dialog window
    opens. Configure different settings, like how KWallet closes a wallet, which is
    automatically selected, and two options about the wallet manager itself.


    # The KWallet Manager Window


    To store data in your wallet or view its contents, open the manager window by
    right-clicking the KWallet icon in the panel and selecting ‘Configure KWallet’.
    The kwallet folder is the default folder for your passwords. Click kwallet and
    a window prompts for your password. After a successful login, you can see the
    main window. It is divided into four parts: the top left part displays subfolders,
    the lower left part shows a list with folder entries, and the lower right part
    shows the contents of a selected entry. The window is shown in Figure 4.2 on the
    next page.'
