    # 13.4.3 Saving and Exporting


    To save the entire project, select ''File'' → ''Save Project'' or ''Save Project
    As''. This generates an XML file with the extension .aup, which describes the
    project. The actual audio data is saved in a directory named after the project
    with _data appended.


    The entire project or the currently selected segment can also be exported as a
    stereo WAV file. To export the project in Ogg Vorbis format, refer to the information
    in Section 13.3.3 on page 189.


    # 13.5 Direct Recording and Playback of WAV Files


    arecord and aplay from the alsa package provide a simple and flexible interface
    to the PCM devices. arecord and aplay can be used to record and play audio data
    in the WAV format and other formats. The command arecord -d 10 -f cd -t wav myself
    records a WAV file of 10 seconds in CD quality (16 bit, 44.1 kHz). List all options
    of arecord and aplay by running them with the --help option.


    qaRecord (package alsutils) is a simple recording program with a graphical interface
    and level display. Because this program uses an internal buffer of 1 MB (configurable
    with --buffers), it enables uninterrupted recordings even on slow hardware, especially
    if it is run with real-time priority. During the recording, the currently-used
    buffer size is displayed in the status line under ''Buffer'' and the maximum buffer
    size required so far for this recording is displayed under ''Peak''.'
