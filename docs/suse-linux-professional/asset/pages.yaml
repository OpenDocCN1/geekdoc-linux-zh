- img_proc: true
  md: '# 12.5.3 The KGpg Editor


    Instead of creating contents for encryption in an external editor then encrypting
    the file with one of the methods described above, you can use the integrated editor-of
    KGpg to create the file. Open the editor (‘Open Editor’ from the context menu),
    enter the desired text, and click ‘Encrypt’. Then select the key to use and complete
    the encryption procedure. To decrypt files, use ‘Decrypt’ and enter the password
    associated with the key.


    Generating and checking signatures is just as easy as encrypting directly from
    the editor. Go to ‘Signature’ -> Generate Signature’ and select the file to sign
    from the password. KGpg informs about the successful generation of the signature.
    Files can also be signed from the editor by simply clicking ‘Sign/Verify’. To
    check a signed file, go to ‘Signature’ ▷ ‘Verify Signature’ and select the file
    to check in the following dialog. After you confirm the selection, KGpg checks
    the signature and reports the result of the operation. Another possibility is
    to load the signed file into the editor and click ‘Sign/Verify’.


    # 12.6 For More Information


    For theoretical background information about the encryption method, refer to the
    brief and clear introduction on the GnuPG project pages at http://www.gnupg.org/documentation/howtos.html.
    This document also provides a list of further information sources.'
