  md: 'Bookmarks’ The bookmark editor allows you to create, group, change, or delete
    bookmarks. The bookmarks are used by the browser and file manager Konqueror. The
    bookmark editor can also import bookmarks from other browsers, as Mozilla, Netscape,
    Opera, and Internet Explorer.


    Run Command’ This menu opens a window in which to enter a command manually. Execute
    the command by pressing `Enter`.


    Undo Use this item to undo the last action. For example, if you have just created
    a new directory on the desktop, clicking this reverts the creation of the directory.


    Paste’ To keep a folder or document handy on the desktop, you can copy an icon
    from the file manager by right-clicking and selecting ‘Copy’ then move the mouse
    to the desired location on the desktop. Right-click again and select ‘Paste’.
    The icon is now available on your desktop and can be moved around by dragging
    it with the left mouse button pressed.


    Icons’ This allows you to rearrange the icons on the desktop. You can also change
    the order of the icons.


    Windows’ This arranges the windows on the desktop, either on top of each other
    beginning from the top left corner or next to each other.


    Refresh Desktop’ If the desktop appears garbled in some way, use this menu to
    redraw it.


    Configure Desktop’ This menu item starts a configuration dialog with which to
    configure the appearance and behavior of the desktop. Details about the configuration
    of the desktop are provided in Section 4.2 on page 73.


    Start New Session’ This menu opens a dialog box asking you to start a new user
    environment. After clicking ‘Start New Session’, the current session disappears
    into the background and the system switches to a new login screen. Each session
    has a function key assigned to it: `F7` represents the first session, `F8` the
    second one, and so on. To switch between different sessions, press `Ctrl+Alt+FX`,
    where `FX` is the function key corresponding to the desired session.


    Lock Screen’ If you leave your workstation and do not log out, you should use
    this function to prevent others from gaining access to your files. On the setting,
    the screen turns blank or starts displaying screensaver. To continue using the
    computer, enter your password.


    ![](img/0d7086818d63bf06d3da42b908c48b45_90_0.png)'
