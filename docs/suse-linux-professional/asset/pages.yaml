  md: '# Important CDDA and Analog CD Playback


    There are two different ways of playing back audio CDs. CD and DVD drives capable
    of analog CD playback read out the audio data and send it to the output device.
    Some external devices connected via PCMCIA, FireWire, or USB need to use CDDA
    (Compact Disk Digital Audio) to extract the audio data first then play it as digital
    PCM. The players featured in the following sections do not support CDDA. Use XMMS
    if you need CDDA support.


    # 13.3.1 KsCD—Audio CD Player


    KsCD is an easy-to-use audio CD player. It integrates into the KDE taskbar and
    can be configured to start playing automatically after a CD has been inserted.
    To access the configuration menu, select ‘Extras’ → ‘Configure KsCD’. Fetch album
    and track information from a CDDB server on the Internet if KsCD is configured
    accordingly. You can also upload CDDB information to share it with others. Use
    the ‘CDDB’ dialog for information retrieval and upload.


    ![](img/0d7086818d63bf06d3da42b908c48b45_207_0.png)


    Figure 13.6: The KsCD User Interface


    # 13.3.2 GNOME CD Player Applet


    This is a simple applet that integrates into a GNOME panel. Using the tools icon,
    configure its behavior and select a theme. Control the playback with the buttons'
  merge: -1
