    # ## 19.3.1 File Commands


    The following section lists the most important commands for file management. It
    covers anything from general file administration to manipulation of file system
    ACLs.


    # File Administration


    ls [option(s)] If you run ls without any additional parameters, the program lists
    the contents of the current directory in short format.


    +   - Detailed list

    -a Displays hidden files


    cp [option(s)] source target Copies source to target.


    +   - Waits for confirmation, if necessary, before an existing target is written

    -r Copies recursively (includes subdirectories)


    mv [option(s)] source target Copies source to target then deletes the original


    +   -b Creates a backup copy of the source before moving

    -i Waits for confirmation, if necessary, before an existing targetfile is overwritten


    rm [option(s)] file(s) Removes the specified files from the file system. Directories
