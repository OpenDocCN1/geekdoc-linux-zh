    # 8.3.2 Creating Messages


    To compose new messages, select ‘Message’ → ‘New Message’ or the corresponding
    icon in the toolbar. To send messages from different email accounts, select one
    of the identities as described in Section 8.3.1 on page 132. In the recipient
    fields, enter an e-mail address or part of a name in your address book. If Contact
    can match what you enter to something in your address book, a selection list opens.
    Click the desired contact or complete your input if none matches. Select directly
    from the address book, click ‘...’.


    To attach files to your message, click the paper clip icon and select the file
    to attach. Alternatively, drag a file from the desktop or other folder to the
    ‘New Message’ window or select one of the options in the ‘Attach’ menu. Normally,
    the format of a file is recognized correctly. If this is not the case, right-click
    the icon. From the menu that appears, select ‘Properties’. This opens a dialog
    to set the format and the name of the file and add a description. In addition,
    decide whether the attached file should be signed or encrypted.


    When you are finished composing your message, send it immediately with ‘Message’
    → ‘Send’ or move it to the outbox with ‘Message’ → ‘Queue’. If you do the former,
