    # 13.3.3 Compressing Audio Data


    Audio compression can be handled by various tools. The following sections feature
    a command-line approach to encoding and playing audio data as well as some graphical
    applications capable of audio compression.


    # Command Line Tools for Encoding and Playback of Audio Data


    Ogg Vorbis (package vorbis-tools) is a free audio compression format that is now
    supported by the majority of audio players. The Web page of the project is http://www.xiph.org/ogg/vorbis.


    SUSE comes with several tools supporting Ogg Vorbis. Oggenc is a command line
    tool used for encoding WAV files to Ogg. Just run oggenc myfile.wav to transform
    a .wav file into Ogg Vorbis. The option -h displays an overview of the other parameters.
    Ogg supports encoding with a variable bit rate. In this way, an even higher degree
    of compression can be achieved. Instead of the bit rate, specify the desired quality
    with the parameter -q and -M specify the minimum and maximum bit rate.


    ogg123 is a command-line Ogg player. Start it with a command like ogg123 mysong.ogg.


    # Compressing Audio Data Using Grip


    rip is a GNOME CD player and ripper (see Figure 13.7 on the next page). The CD
    player functionality is entirely controlled by the buttons in the bottom part
    of the window. Controlling the ripping and encoding functionality using the tabs
    at the top of the window. To view and edit the track and album information or
    to select the tracks to rip, open the ''Tracks'' tab. Select a track by clicking
    the check box next to the track title. To edit the track information, click ''Toggle
    disc editor'' and submit your modifications. The ''Rip'' tab selects the preferred
    rip mode and controls the ripping process. Access the entire Grip configuration
    under the ''Config'' tab. Use ''Status'' to check the status of the application.'
