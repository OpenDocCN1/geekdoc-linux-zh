  md: '# 1.9.2 Mobile Computing


    Working on a mobile computer requires a great deal of flexibility in adjusting
    to changing network and system environments. SUSE LINUX offers small helpers,
    like GNOME Battery Charge Monitor, KPowersave, and Profile Chooser, which assist
    you in adjusting the power management scheme and the system configuration of your
    computer.


    +   - More Information about Mobile Computing


    Refer to the Administration Guide to learn more about mobile computing under SUSE
    LINUX. Get an introduction to the software components involved and learn how to
    configure your mobile devices for maximum flexibility.


    # Power Management


    Successfully working on battery power requires a very sophisticated handling of
    the system resources by the operating system. Mobile hardware is optimized to
    allow a very flexible management of power usage by the CPU and other components.
    Depending on the environment on which the system is run, the power management
    can be easily adjusted in SUSE LINUX using GNOME Battery Charge Monitor or KDE
    PowerManagement.


    Battery Charge Monitor allows you to send your machine into a hibernation state
    (''Suspend Computer'') in which entire system state is written to disk prior to
    shutdown. Once reactivated, configure the power management settings via ''Power
    Management Settings''. The YaST Power Management module is enabling you to configure
    all power management settings centrally.


    Using KPowersave, you can start the YaST Power Management module and choose a
    suspend to disk or to RAM (if configured accordingly with YaST). You may change
    the CPU frequency policy, meaning your system either lets the CPU frequency drop
    when the system is idle and adjusts it dynamically if more CPU power is needed
    (set the CPU frequency policy to ''Dynamic''), permanently keeps a low CPU frequency
    to save power (select ''Powersave''), or permanently keeps a high CPU frequency
    for maximum CPU performance (select ''Performance''). If you change the active
    power management scheme (''Set Active'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'Scheme''), all components of your system are part of the powersaving effort.
    A power management scheme includes settings for CPU frequency scaling, throttling,
    hard disk control, and for the cooling of the system. To start this program in
    a GNOME kpowersave at the ‘Run Application’ terminal.


    # Profile Management


    Your system needs to adapt to changing operating environments used for mobile
    computing. A lot of services depend on the environment and the underlying clients
    must be reconfigured. Use the system configuration profile management (SCPM) framework
    to create different configuration profiles for all environments your machine is
    used in. Change the active profile using Profile Chooser. To modify your SCPM
    settings, select ‘YaST Profile Manager Module’ and enter the root password when
    prompted to do so. Start Profile Chooser in KDE using the main menu. In GNOME,
    enter profile_chooser at the ‘Run Application’ terminal.


    # 1.10 Using the Shell


    Most tasks in Linux can be conveniently handled via a graphical user interface.
    Some tasks, mainly system administrator’s ones, can be handled more efficiently
    on the command line from a terminal or shell. A basic understanding of how a Linux
    shell works and knowledge of some basic command line tools is required for this.
    Refer to Chapter 19 on page 245 to get to know the Bash shell and some Linux command
    line tools.'
