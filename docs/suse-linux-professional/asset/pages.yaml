  md: '# Getting to Know Linux Software


    Linux comes with a wealth of applications, often offering more than one solution
    to your specific problems. The difficulty is finding the one application that
    suits your needs and offers a similar ease of use compared to the Windows or Mac
    applications you have been using so far. This chapter points out the most important
    and powerful Linux applications, enabling you to change into your new working
    environment smoothly.


    +   2.1 Office 32

    2.2 Network 35

    2.3 Multimedia 37

    2.4 Graphics 40

    2.5 System and File Management 42

    2.6 Software Development 45'
