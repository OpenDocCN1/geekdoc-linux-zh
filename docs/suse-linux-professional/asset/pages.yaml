  md: '# Managing Playlists


    Start-up, amaroK scans the file system for multimedia files according to the settings
    made in the wizard. The right part of the playlist window lists any playlists
    found. Play titles listed in it in the order of your choice. If no playlist is
    found, create one. The best way to do this is by using the sidebar to the left
    of the window. To the far left, there are a number of tabs that can be used to
    open different views. From each of these views, drag individual titles or entire
    directories and drop them into the playlist to include them in the list. The following
    is a description of the function of each tab.


    Context With this tab, view information about your collection and the current
    artist. For example, the view informs you about your favorite titles, the newest
    titles added to the collection, and other details. The ''Home'' view provides
