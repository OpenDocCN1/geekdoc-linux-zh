    #  3.3 Editing MIME Types


    MIME types determine which application should open a file when clicked in a Web
    or file browser. The actual file type and the MIME type of a file are closely
    associated with each other. An HTML file has the file type html and would be registered
    to have a MIME type text/html. Nautilus has built-in support for most of the common
    MIME types and proposes the appropriate application you choose to open a file.
    In this case, it would propose a Web browser.


    However, you might want to change the MIME type for certain files if you are not
    quite happy with the default applications suggested by Nautilus. Changing the
    default application assigned to a certain MIME type is very straightforward. Figure
    3.3 on the following page.


    Procedure 3.1: Editing the MIME Type


    +   1. Right-click a file of the MIME type in question in a Nautilus window.

    2. Select ‘Properties’ → ‘Open With’ tab from the ‘Properties’ dialog.

    3. Choose the ‘Open’ dialog.

    4. Click ‘Add’ and ‘Browse’ to search for a suitable application.

    5. Leave the dialog with ‘Close’.


    If a MIME type has not yet been properly registered, the procedure is the same
    as described above. These modifications are applied globally, which means that
    any file of this type is subsequently opened by the application defined.'
