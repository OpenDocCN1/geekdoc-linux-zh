  md: 'K3b K3b is a multitalented media creation tool. Create data, audio, or video
    CD and DVD projects by dragging and dropping. Find more information about K3b
    at http://www.k3b.org/ or refer to Chapter 15 on page 209.


    Kaffine Kaffine is a versatile multimedia application supporting a wide range
    of audio and video formats including Ogg Vorbis, WMV, MOV, and AVI. Import edit
    playlists of various types, create screenshots, and save media to your local hard
    disk. Find more information about Kaffine at http://kaffine.sourceforge.net/.


    amarok The amarok media player handles various audio formats and plays the streaming
    audio broadcasts of radio stations on the Internet. The program handles all file
    types supported by the sound server acting as a back-current amaroks or GStreamer.
    Find more information about amarok at http://amarok.kde.org/ or refer to Section
    13.2.1 on page 182.


    XMMS XMMS is the traditional choice for multimedia playback. It is focused on
    music playback, offering support for CD playback and Ogg Vorbis files. Users of
    Winamp make XMMS comfortable because of its similarity. Find more information
    about XMMS at http://www.xmms.org/ or refer to Section 13.2.2 on page 26.


    Audacity Audacity is a powerful, free sound editing tool. Record, edit, and play
    any Ogg Vorbis or WAV file. Mix tracks at your whim and apply effects to them
    and export the results to WAV or Ogg Vorbis. Find more information about Audacity
    at http://audacity.sourceforge.net/ or refer to Section 13.4 on page 192.


    Noteedit Noteedit is a powerful score editor for Linux. Use it to create sheets
    of notes and to import scores to from many formats, such as MIDI, MusicXML and
    LilyPond. Find more information about Noteedit at http://developer.berlio.de/projects/noteedit/.


    LilyPond LilyPond is a free music sheet editor. Because the input format is text-based,
    you can use any text editor to create note sheets. Users do not need to tackle
    any formatting or notation issues, like as spacing, line-breaking, and polyphonic
    collisions. All these issues are automatically resolved by Lily-Pond. It supports
    many special notations like chord names and tablatures. The output can be exported
    to PNG, TeX, PDF, PostScript, and MIDI. Find more information about LilyPond at
    http://lilypondond.org/web/.'
  merge: -1
