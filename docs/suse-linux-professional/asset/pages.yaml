  md: '# 5.1 Using the SUSE Help Center


    When you start the SUSE Help Center for the first time from the main menu (''SuSE
    help-center'') or with the command `susehelp` in the shell, the view as shown
    in Figure 5.1 on the facing page is displayed. The dialog window consists of three
    main areas:


    # Menu Bar and Toolbar


    The menu bar provides the main editing, navigation, and configuration options.
    ''File'' contains the option for printing the currently displayed content. Under
    ''Edit'', access the search function. ''Go'' contains ''Table of Contents'' (home
    page of the Help Center), ''Back'', ''Forward'', and ''Last Search Result''. With
    ''Settings'' -> ''Build Search Index'', generate a search index for all selected
    information sources. The toolbar contains three navigation icons (forward, back,
    home) and a printer icon for printing the current contents.


    # Navigation Area with Tabs


    The navigation area in the left part of the window provides an input field for
    a quick search in selected information sources. Details regarding the search and
    the configuration of the search function in the ''Search'' tab are presented in
    Section 5.1.2 on the next page. The ''Contents'' tab presents a tree view of all
    available and currently installed information sources. Click the book icons to
    open and browse the individual categories.


    View Window The view window always displays the currently selected contents, such
    as online manuals, search results, or Web pages.


    # 5.1.1 Contents


    The SUSE Help Center provides access to useful information from various sources.
    It contains special documentation for SUSE LINUX (User Guide and Administration
    Guide), all available information sources for your workstation environment, online
    help for the installed programs, and help texts for other applications. Furthermore,
    the SUSE Help Center provides access to SUSE''s online databases that cover special
    hardware and software issues for SUSE LINUX. All these sources can be searched
    comfortably once a search index has been generated.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# 5.1.2 The Search Function


    To search all installed information sources of SUSE LINUX, generate a search-index
    and set a number of search parameters. To do this, open the ''Search'' tab. See
    Figure 5.2 on the following page.


    If no search index has been generated, the system automatically prompts you to
    do so when you click the ''Search'' tab or enter a search string and click ''Search''.
    In the dialog for generating the search index, shown in Figure 5.3 on page 104,
    use the check boxes to determine the information sources to index. The index is
    generated when you exit the dialog with ''Build Index''.


    To limit the search base and the hit list as precisely as possible, use the three
    drop-down menus to determine the number of displayed hits and the selection area
    of sources to search. The following options are available for determining the
    selection area.


    **Default** A predefined selection of sources is searched.


    **All** All sources are searched.


    **None** No sources selected for the search.


    Figure 5.1: The Main Window of the SUSE HelpCenter


    ![](img/0d7086818d63bf06d3da42b908c48b45_120_0.png)'
  merge: -1
  pgno: 120
- img_proc: true
  md: '![](img/0d7086818d63bf06d3da42b908c48b45_121_0.png)


    Figure 5.2: Configuring the Search Function


    **Custom** Determine the sources to search by activating the respective check
    boxes in the overview.


    When you have completed the search configuration, click ‘Search’. The relevant
    items are displayed in the view window and can easily be navigated with mouse
    clicks.


    # 5.2 Man Pages


    Man pages are an essential part of any Linux system. They explain the usage of
    a command and all available options and parameters. Man pages are sorted in categories
    as shown in Table 5.1 on this page (taken from the man page for man itself).


    Table 5.1: Man Pages—Categories and Descriptions


    | Number | Description |

    | --- | --- |

    | 1 | Executable programs or shell commands |'
  merge: -1
  pgno: 121
- img_proc: true
  md: '+   2 System calls (functions provided by the kernel)


    +   3 Library calls (functions within program libraries)


    +   4 Special files (usually found in /dev)


    +   5 File formats and conventions (/etc/fstab)


    +   6 Games


    +   7 Miscellaneous (including macro packages and conventions), e.g., man(7),
    groff


    +   8 System administration commands (usually only for root)


    +   9 Kernel routines (nonstandard)


    Generally, man pages are delivered with the associated command. They can be browsed
    in the help center or directly in a shell. To display a man page in a shell, use
    the man command. For example, to display the man page for ls enter man ls. Each
    man page consists of several parts labeled NAME, SYNOPSIS, DESCRIPTION, SEE ALSO,
    LICENSING, and AUTHOR. There may be additional sections available depending on
    the type of command. With Q, exit the man viewer.


    Another possibility to display a man page is to use Konqueror. Start Konqueror
    and type, for example, man:/ls. If there are different categories for a command,
    Konqueror displays as links.


    # 5.3 Info Pages


    Info pages are another important source of information on your system. Usually
    they are more verbose than man pages. You can browse an info page with an info
    viewer and display the different sections, called “nodes.” Use the command info
    for this task. For example, to view the info page of itself, type info info in
    the shell.


    For more convenience, use the Help Center or Konqueror. Start Konqueror and type
    info:/ to view the top level. To display the info page for grep, info:/grep.'
  merge: -1
