    # 14.6.1 Operation


    Connect your camera to the USB port of your computer before starting gqcam. Then
    run gqcam. current picture of your webcam is automatically shown in the upper
    part of the application window. The lower part has sliders for adjusting the brightness,
    white balance, contrast, tint, and color saturation as needed. The brightness
    is automatically preset. This feature can be set in ''General'' ''File'' -> ''Preferences''.
    ''Filters'' features false color correction because some cameras swap the red
    and blue channels in transmission.


    If you operate more than one webcam, use ''File'' -> ''Open New Camera'' to switch
    to another camera. Select the new device from the dialog that opens. The first
    camera is attached to the device /dev/video0, the second is attached to /dev/video1,
    and so on.


    # 14.6.2 Snapshots


    To take a snapshot with a camera, click ''Snap Picture''. Select a filename and
    format in the dialog that opens. Create a picture series with ''Camera'' -> ''Set
    Timer''. The capturing frequency in seconds or minutes along the properties of
    the images in ''Set image information''. An optional script to run after every
    capture can be chosen with ''Run command after snap''. This could, for example,
    be used to upload the captured image onto an FTP server.


    # 14.6.3 Command Line


    gqcam can also be run without its graphical user interface. This may be interesting,
    for instance, for automatic surveillance controlled by a cron job. This requires'
