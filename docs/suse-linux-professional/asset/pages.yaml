  md: '# Encryption with KGpg


    KGpg is an important component of the encryption infrastructure on your system.
    With the help of this program, generate and manage all needed keys, use its editor
    function for the quick creation and encryption of files, or use the applet in
    your panel to encrypt or decrypt by dragging and dropping. Other programs, such
    as your mail program (Kontact or Evolution), access the key data to process signed
    or encrypted contents. This chapter covers the basic functions needed for daily
    work with encrypted files.


    +   12.1 Generating a New Key Pair . . . . . . . . . . . . . . . 166

    12.2 Exporting the Public Key . . . . . . . . . . . . . . 166

