- img_proc: true
  md: 'It is preferable to select a suitable burning speed that avoids buffer-runs.


    ‘Only create image’ This option creates an image file. Set the path for this file
    under ‘Temporary File’. The image file can be written to CD at a later time. To
    do this, use ‘Tools’ → ‘CD’ → ‘Burn CD Image’. If this option is used, all other
    options in this section are deactivated.


    ‘Remove image’ Remove the temporary image file from hard disk when finished.


    ‘Verify written data’ Check the integrity of the written data by comparing the
    MD5 sums of the original and the burned data.


    The ‘Settings’ tab features options needed for the creation of CDs with multiple
    data or audio tracks (multissection CDs). In the ‘Volume Disc’ tab, enter some
    general information that can be used to identify this particular data project,
    its publisher and preparer, and the application and operating system used in the
    creation of this project. Under ‘File system’, specify settings for the file system
    on the CD (RockRidge, Joliet, UDF). Also determine how symbolic links, permissions,
    and blanks are treated. In the ‘Advanced’ tab, experienced users can specify additional
    settings.


    After adjusting all settings to your needs, start the actual burning process using
    ‘Burn’. Alternatively, save these settings for future use and adjustment with
    ‘Save’.


    # 15.2 Creating an Audio CD


    Basically, there are no significant differences between creating an audio CD and
    creating a data CD. Select ‘File’ → ‘New Audio Project’. Drag and drop the individual
    audio tracks to the project folder. The audio data must be in WAV or Ogg Vorbis
    format. Determine the sequence of the tracks by moving them up or down in the
    project folder.


    The dialog for burning an audio CD is not very different from the dialog for burning
    a data CD. However, the ‘Disc at once’ and the ‘Track at once’ modes have greater
    importance. The ‘Track at once’ mode inserts an intermission of two seconds after
    each track.'
