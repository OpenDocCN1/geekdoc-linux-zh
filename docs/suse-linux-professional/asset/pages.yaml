  md: '# 13.1 Mixers


    Mixers provide a convenient means of controlling the volume and balance of the
    sound output and input of computers. The main difference between the various mixers
    is the outer appearance of the user interface. However, there are a number of
    mixers that are designed for specific hardware. One example is envy24control,
    a mixer for the Envy 24 sound chip. Another is hdspmixer, which is for RME Hammerfall
    cards. From the mixers available, select the one that best suits your needs.


    Generally, it is advisable to open a mixer application before opening other applications.
    Use the mixer to test and adjust the control settings for the input and output
    of the sound card.


    # 13.1.1 KMix


    KMix is the KDE mixer application. It is integrated into the KDE panel as a small
    panel app located in the system tray. Click the panel icon to control the volume
    of your speakers with a control slider. If you right-click the icon, the context
    menu of KMix appears. Select ''Mute'' to switch off the sound output. The panel
    icon then changes its appearance. Clicking ''Mute'' again unmutes the volume.
    To fine-tune your sound settings, select ''Show Mixer Window'' and configure ''Output'',
    ''Input'', and ''Switches''. Each of the devices featured there has its own text
    menu that is opened by right-clicking the device icon. You can mute or hide each
    one of them separately.


    # 13.1.2 The GNOME Mixer Applet


    GMix, the volume control applet for the GNOME desktop, is integrated into the
    GNOME panel. Click the panel icon to control the volume of your speakers with
    a simple control slider. To switch off the sound output, right-click the icon
    and select ''Mute''. The volume control icon then changes its appearance. To unmute
    the sound output, right-click the icon again and select ''Mute'' from the menu.
    Select ''Open Volume Control'' to access the more advanced mixer features, shown
    in Figure 13.2 on page 180. Each sound device has its own mixer tab.'
  merge: -1
