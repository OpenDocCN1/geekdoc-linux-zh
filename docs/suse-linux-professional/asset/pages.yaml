  md: '''Logout'' Log out of your system if you are not going to use the system for
    some time.


    # 4.1.2 The Main Menu


    Open the main menu by clicking the icon to the far left of the panel. Alternatively,
    press Alt+F1. The main menu is subdivided into these sections: ''Most Used Applications'',
    ''All Applications'' (a menu with all applications sorted according to categories),
    and ''Actions''. The following section provides information about a number of
    actions that can be triggered from the main menu. Detailed information about the
    Control Center is available in Section 4.2 on the next page.


    ''Bookmarks'' By selecting Edit Bookmarks from this menu, start an editor to organize
    your bookmarks. If you select one of the bookmarks present in the menu, the Konqueror
    browser starts and loads the corresponding URL.


    ''Run Command'' This item opens a dialog in which to enter a command. You can
    use it to start an application whose command you know without navigating through
    the program submenus.


    ''Switch User'' To start a second session with a graphical user interface on your
    machine, select ''Start New Session'' from the main menu. Your current session
    remains active until you are taken to the login screen. You can also start another
    window manager. Access the first session by pressing Ctrl+Alt+F7. Press F8 instead
    of F7 to access the new session. Additional sessions can be accessed by pressing
    Ctrl+Alt+F9 to F12.


    ''Lock Session'' If you leave your workstation, you can blank your screen or start
    a screensaver. Access to the session can only be regained with a password. To
    unlock, enter your normal login password. Locking the screen ensures that others
    cannot read or manipulate your documents or e-mail messages.


    ''Logout'' You can log out from the system by means of this menu item. However,
    first you are asked what should happen after the logout. If you select ''Login
    as different user'', the login screen is displayed, allowing you or another user
    to log in to the system. You can shut down and turn off the computer or reboot
    immediately. Confirm your selection with ''OK'' or remain logged in by clicking
    ''Cancel''.'
