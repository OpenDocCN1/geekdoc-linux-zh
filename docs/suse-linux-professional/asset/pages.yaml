- img_proc: true
  md: '# 16.5 Using gtKam


    gtKam is a graphical interface for downloading and deleting pictures from a digital
    camera. To adjust or edit your pictures, use GIMP as described in Chapter 18 on
    page 235.


    Connect your camera to the appropriate port and turn on the camera. Start gtKam
    with the command `gtcam` &. From the menu, select ''Camera'' → ''Select Camera''.
    In the dialog that opens, select the camera model or use ''Detect''. Select the
    appropriate port if the detection fails.


    The main gtKam window is divided into three sections—the menu and toolbars, the
    left pane with index settings and camera and directory selection, and the right
    pane for displaying an index listing or without thumbnails. The icons in the toolbar
    provide the main functions needed. The disk icon saves the selected images. The
    trash icon deletes them. The icon with the paper and pencil opens the camera index
    camera configuration options. The door icon exits the program.


    Your camera should be listed in the left pane. Use the plus sign (+) to the left
    to expand the tree display of the directory structure. Your exact directory structure
    depends on the camera type and model. Continue expanding until you reach the entries
    that cannot be expanded. These are the index lists of the pictures. Click an item
    to select it. If ''View Thumbnails'' is activated, the picture names and thumbnails
    are displayed in the right pane. Otherwise, the names and an image are displayed.


    Images in the right pane can be selected or deselected by clicking them. Select
    all images with ''Select'' → ''All'' or (Shift+A). To save the images, use the
    disk icon in the toolbar, select ''File'' → ''Save Selected Photos'', or use the
    shortcut Ctrl+S. The ''Save'' dialog has a number of options. Under ''What to
    Save'', select whether to save the thumbnails, the images, or both. With ''Open
    image(s) with'', save the image and open it in another program. To open the images
    in GIMP immediately, enter `gimp`. Using the filenames suggested by the camera
    is recommended.


    If you need more features, try gtThumb. With this application, you can organize
    and sort your photographs.'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# # 1.6 Using Digikam


    Digikam by Renchi Raju is a KDE program for downloading photographs from digital
    cameras. The first time it is run, Digikam asks where to store your photo album.
    If you enter a directory that already contains a collection of photographs, Digikam
    treats each subfolder of the folder as an Album.

    On start-up, Digikam presents a window with two sections: your albums are displayed
    to the left and the respective photographs available are displayed to the right.
    See Figure 16.1 on the current page.


    ![](img/0d7086818d63bf06d3da42b908c48b45_238_0.png)


    Figure 16.1: The Main Window of Digikam


    # ## 1.6.1 Configuring Your Camera


    To set up a camera in Digikam, select ‘Camera’ → ‘Add Camera’. First, try to autodetect
    the camera with ‘Auto-Detect’. If this fails, browse the list for your model with
    ‘Add’. If your camera model is not included in the list, try an older model or
    use ‘USB Mass Storage’ or ‘USB PTP Class Camera’. Normally, this should work.
    Confirm with ‘Ok’'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# 16.6.2 Downloading Pictures from Your Camera


    After your camera has been configured correctly, connect to your camera with the
    ''Camera'' menu and the name that you gave in the dialog from Section 16.6.1 on
    the preceding page. Digikam opens a window and begins to download thumbnails and
    displays them as in Figure 16.2 on the current page. Right-click an image to open
    a pop-up menu with the options to ''View'', display some ''Properties'' and ''EXIF
    Information'', ''Download'', or ''Delete'' the image. With ''Advanced'', select
    renaming options and how the camera-provided information (EXIF) be handled.


    ![](img/0d7086818d63bf06d3da42b908c48b45_239_0.png)


    Figure 16.2: Downloading Pictures from Camera


    The renaming options can be very convenient if your camera does not mean meaningful
    filenames. You can let Digikam rename your photographs automatically. Give a unique
    prefix, and optionally give a date, time, or sequence number. The rest is done
    by Digikam.


    Select all photographs to download from the camera by pressing the left mouse
    button or clicking individual photographs with (Ctrl) pressed. Selected photographs
    appear with inverted colors. Click ''Download''. Select the destination from the
    list or by creating a new album with ''New Album''. This automatically suggests
    a filename with the current date. Confirm with ''Ok'' to start the download process.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# 16.6.3 Getting Information


    Getting information about the photograph is not difficult. A short summary is
    displayed as a tool tip if you point with the mouse cursor at the thumbnail. For
    longer information, right-click the photograph and choose ‘Properties’ from the
    menu. A dialog box opens with three tabs, ‘General’, ‘EXIF’, and ‘Histogram’.
    ‘General’ lists the name, type, owner, and some other basic information. The most
    interesting part is the ‘EXIF’ tab. The camera stores some metadata for each photograph.
    Digikam reads these properties and displays them in this list. The exposure time,
    pixel dimensions, and others. To get more information for the selected list entry,
    press Shift-F1. This shows a small tool tip. The last tab, ‘Histogram’, shows
    some statistical information.


    # 16.6.4 Managing Albums


    Digikam inserts a ‘My Albums’ folder by default, which collects all your photographs.
    You can store these in subfolders later. The albums can be sorted by their directory
    layout, the collection name that has been set in the album properties or by the
    date that the albums were first created (this date can also be changed in the
    properties of each album).


    To create a new album, you have some possibilities:


    +   - Uploading new photographs from the camera

    - Creating a new album by clicking the ‘New Album’ button in the toolbar

    - Importing an existing folder of photographs from your hard disk (select ‘Album’
    → ‘Import’ → ‘Import Folders’)

    - Right-clicking ‘My Albums’ and selecting ‘New Albums’


    After selecting to create and album in your preferred way, a dialog box appears.
    Give your a title. Optionally, choose a collection, insert some comments, and
    select an album date. The collection is a way of organizing your albums by a common
    label. This label is used when you select ‘View’ → ‘Sort Albums’ → ‘By Collection’.
    The comment is shown in the banner at the top of the main window. The album date
    is used when you select ‘View’ → ‘Albums’ → ‘By Date’.


    Digikam uses the first photograph in the album as the preview icon in the ‘My
    Albums’ list. To select a different one, right-click the respective photograph
    and select ‘Set as Album Thumbnail’ from the context menu.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# 16.6.5 Managing Tags


    Managing lots of different photographs with different albums can sometimes be
    complex. To organize individual photographs, Digikam provides the ‘My Tag’ system.


    For example, you have photographed your friend John at different times and you
    want to collect all images, independent of your album. This let you find all photographs
    very easily. First, create a new tag by clicking ‘My Tags’ → ‘People’. From the
    context menu, choose ‘New Tag’. In the dialog box that appears, enter ‘John’ as
    title and optionally select an icon. Confirm with ‘OK’.


    After creating your tag, assign it to the desired goals. To each album and select
    the respective photographs. choose ‘Assign Tag’ → ‘People’ → ‘John’ from the menu
    that appears. Alternatively, drag the photographs to the tag name under ‘My Tags’
    and drop them there. Repeat as necessary with other albums. View all the images
    by clicking ‘My Tags’ → ‘People’ → ‘John’. You can assign more than one tag to
    each photograph.


    Editing tags and comments can be tedious. To simplify this task, right-click a
    photograph and select ‘Edit Comments & Tags’. This opens a dialog box with a preview,
    a comment field, and a tag list. Now you can insert all the needed tags and add
    a comment. With ‘Forward’ and ‘Back’, navigate in your album. Store your changes
    with ‘Apply’ and leave with ‘OK’.


    # 16.6.6 Useful Tools


    Digikam provides several tools to simplify some tasks. Find them in the ‘Tools’
    menu. The following is a small selection of the available tools.


    # Creating a Calendar


    If you want to please someone, a custom calendar can be a nice gift. Go to ‘Tools’
    → ‘Create Calendar’, which opens a wizard dialog like that in Figure 16.3 on the
    facing page.


    Customize the settings (paper size, image position, font, etc.) and confirm with
    ‘Next’. Now you can enter the year and select the images to use. After clicking
    ‘Next’ again, see a summary. The final ‘Next’ opens the KDE Printer dialog. Here,
    decide if you want to see a preview, save as PDF, or just print directly.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Create Template for Calendar


    ![](img/0d7086818d63bf06d3da42b908c48b45_242_0.png)


    # Finding Duplicate Photographs


    Sometimes you photograph similar scenes repeatedly and want to keep only the best
    shots. This is the perfect task for the ‘Find Duplicate’ plug-in.


    Go to ‘Tools’ → ‘Find Duplicate Images’, which opens a window similar to Figure
    16.4 on the next page. Select the albums or tags to handle. Under ‘Method & Cache’,
    choose the search method: a more accurate or a faster method. After you confirm
    with ‘Ok’, Digikam proceeds with the investigation.


    If it finds some duplicates, it shows the result in a window like Figure 16.5
    on page 225. Decide which images to delete by activating the desired check boxes
    then clicking ‘Delete’. Leave the window with ‘Close’.'
