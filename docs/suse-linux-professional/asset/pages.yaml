  md: '# # Kooka—A Scanning Application


    Kooka is a KDE application for scanning. This chapter explains the user interface
    and the functionality of the application. In addition to creating image files
    from printed media, like photographs or magazines, Kooka has character recognition
    capabilities. This means it can help convert written text to a text file that
    can be edited.


