  md: '# 12.5.1 Encrypting and Decrypting the Clipboard


    Files copied to the clipboard can easily be encrypted with a few clicks. Open
    the function overview by clicking the KGpg icon. Select ''Encrypt Clipboard''
    and designate the key to use. A status message about the encryption procedure
    is displayed on the desktop. The encrypted contents can now be processed from
    the clipboard as needed. The decryption of clipboard contents is just as easy.
    Simply open the menu on the panel, select ''Decrypt Clipboard'', and enter the
    password associated with your private key. The decrypted version is now available
    for-processing in the clipboard and in the KGpg editor.


    # 12.5.2 Encrypting and Decrypting by Dragging and Dropping


    To encrypt or decrypt files, click the icons on the desktop or in the file manager,
    drag them to the padlock in the panel, and drop them there. If the file is not
    encrypted, KGpg asks for the key to use. As soon as you select a key, the file
    is encrypted without any further messages. In the file manager, encrypted files
    are designated with the suffix .asc and the padlock icon. These files can be Decrypted
    by clicking the file icon, dragging it to the KGpg symbol in the panel, and dropping
    it there. Then select whether the file should be decrypted or saved or displayed
    in the editor.


    ![](img/0d7086818d63bf06d3da42b908c48b45_191_0.png)


    172 12.5. Text and File Encryption'
  merge: -1
