  md: '# 1.9 Networking and Mobility


    GNOME and KDE offer several applications for working in a network environment
    or using a mobile computer. It is much more convenient and much easier to click
    a small icon to connect or disconnect from a network than to manually run some
    script. Monitoring the power state of your mobile computer via a small icon is
    easier than watching obscure system messages. The following sections introduce
    some of these little helpers, but many more are offered by your desktop environment.


    # 1.9.1 Networking


    Network connections, even wireless ones, can be easily configured and monitored
    by small applications seamlessly integrating into your desktop panel. KMonitor
    can be used to configure and monitor any kind of network connection. Network Monitor
    in GNOME and Wireless Network Information in KDE can be used to monitor the state
    of your wireless link.


    > **Important**n**Network Configuration**nThe initial configuration of any network
    connection is made with YaST, the SUSE LINUX configuration management tool. Find
    information about this in the [Administration Guide].


    # Kinter—Connecting to the Internet


    After your network device has been configured correctly, control the Internet
    dial-up with Kinder. On start-up, KDE loads Kinder. The program checks whether
    an Internet connection can be established. If this is possible, the application
    icon, a plug, automatically appears in the right part of the KDE panel. Depending
    on the state of the network connection, the panel icon changes appearance:


    +   - Currently there is no connection to the Internet.


    +   - The connection is just being established or terminated.'
