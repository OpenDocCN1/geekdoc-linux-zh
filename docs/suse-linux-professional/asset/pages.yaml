  md: '# Welcome


    SUSE LINUX User Guide was written to introduce the Linux operating system and
    its wealth of applications to Linux novices. Get to know your choices for a Linux
    desktop and learn how to configure and control it. Despite its aim towards novices,
    it still provides a variety of information helpful for the experienced user.


    SUSE LINUX User Guide consists of six major parts featuring the aspects of your
    SUSE LINUX system:


    Introducing Get started with Linux. Learn how to manage your desktop and how to
    perform basic administrative tasks. A comprehensive list comparing Windows and
    Linux applications helps you find the appropriate counterparts of your favorite
    Windows applications. As for the desktop, choose from two alternatives—GNOME or
    KDE—and learn more about their strengths and highlights. Finally, learn where
    to get more information and help for your Linux system.


    OpenOffice is a powerful substitute for any Office you might have used under Windows
    or Mac OS. Learn how to use it and how to migrate your data. Linux also provides
    two fully-fledged personal information management suites, Evolution and Kontakt.
    Both offer e-mail, calendar, address management, and many other functionalities.


    Internet Linux offers two great browser alternatives: Firefox and Conqueror. Get
    to know how to use and how to enjoy many small add-on features. A chapter about
    the KDE encryption tool, KGpg, shows you how to secure your Internet communication.'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'Multimedia Linux offers many players both for video and audio media. You can
    also use Linux software to create and edit your movies or music recordings. If
    digital image processing is your scene, try GIMP, which easily rivals Adobe Photoshop.
    Easy-to-use scanning applications and album software for your digital photo collection
    are also provided.


    Excursions Similar to the DOS shell, a Linux system offers a powerful shell environment
    that can be used to interact directly with the operating system. Learn about the
    basic principles behind that functionality and get some hands-on experience using
    the most important shell commands featured in this section.


    Appendix The SUSE LINUX FAQ contains some of the most frequently asked questions
    regarding SUSE LINUX. Feel free to contribute and send us your suggestions.


    If looking for in-depth information about the SUSE LINUX installation process
    or system administration, refer to the SUSE LINUX Administration Guide. It introduces
    installation and configuration with YaST and gives background knowledge for many
    services and applications running on your Linux machine.


    # Changes in the User Guide


    The following is a list of the changes introduced in this guide, as compared to
    the previous version (SUSE LINUX 9.2):


    +   - A new chapter about basic concepts helps new users. See Chapter 1 on page
    3.


    +   - If you are new to SUSE LINUX, coming from Windows, a list of equivalent
    programs under Linux is a valuable aid. See Chapter 2 on page 31.


    +   - The GNOME and KDE chapters have been revised. See Chapter 3 on page 47 and
    Chapter 4 on page 69.


    +   - The help chapter has been revised. It contains more information about man
    and info pages, guides, books, and other resources. See Chapter 5 on page 99.


    +   - The former chapters of KMail and KOrganizer have been transferred to the
    new Contact chapter. See Chapter 8 on page 129.'
  merge: -1
  pgno: 5
- img_proc: true
  md: '+   - Konqueror has been enhanced with information about tabbed browsing and
    other small improvements. See Chapter 10 on page 151.


    +   - There is a new Firefox chapter. See Chapter 11 on page 157.


    +   - The chapter about digital cameras has been updated and expanded. It contains
    more information about Digikam. See Chapter 16 on page 215.


    # Typographical Conventions


    The following typographical conventions are used in this book:


    +   - /etc/passwd: files or directories


    +   - (placeholder): replace the character string (placeholder) (including the
    brackets) with the actual value


    +   - PATH: an environment variable


    +   - ls: commands


    +   - user: users


    +   - Alt: a key to press


    +   - ''File'': menu items, buttons or other elements from a graphical user interface


    # Acknowledgements


    With a lot of personal commitment, the Linux developers continue to promote the
    development of Linux. We would like to express our sincere gratitude for their
    efforts. Without them, this distribution would not exist. Additional thanks go
    to Frank Zappa and Pawar. Special thanks, of course, to Linus Torvalds.


    Have a lot of fun!


    Your SUSE Team'
