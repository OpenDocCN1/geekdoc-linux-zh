    KDevelop allows you to write programs for different languages (C/C++, Python,
    Perl, etc.). It includes a documentation browser, a source code editor with syntax
    highlighting, a GUI for the compiler, and much more. Find more information at
    http://www.kdevelop.org.


    The Eclipse Platform is designed for building integrated development environments
    that can be extended with custom plug-ins. The base distribution also contains
    a full-featured Java development environment. Find more information at http://www.eclipse.org.


    Qt is a program library for developing applications with graphical user interfaces.
    It allows you to develop professional programs rapidly. The Qt library is available
    not only for Linux, but for a number of Unixes and even for Windows and Macintosh.
    Thus it is possible to write programs that can be easily ported to those platforms.
    Find more information at http://www.ttech.com.


    GTK is a multipatform toolkit for creating graphical user interfaces. It is used
    for all GNOME applications, the GIMP, and several others. GTK has been designed
    to support a range of languages, not only C/C++. Originally it was written for
    GIMP, hence the name “GIMP Toolkit”. Find more information at http://www.gtk.org.'
