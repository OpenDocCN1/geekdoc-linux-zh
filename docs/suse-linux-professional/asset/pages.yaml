    RCS included in the standard Linux distributions. Read more about CVS in our Administration
    Guide. Find more information at the home page http://www.cvshome.org/.


    **Subversion** Subversion does the same thing CVS does but has major enhancements,
    like moving, renaming, and attaching meta-information to files and directories.
    Read more about Subversion in our Administration Guide or go to the home page
    http://subversion.tigris.org/


    **Mono** The Mono Project is an open development initiative that is working to
    develop an Open Source Unix version of the .NET development platform. The objective
    is to enable Unix developers to build and deploy cross-platform .NET applications.
    The project implements various technologies that have been submitted to the ECMA
    for standardization. For more information, refer to http://www.mono-project.com/about/index.html.'
