  md: '# 13


    # Sharing Playlists with Other Players


    Save playlists in m3u or pls format, so you can share them with any other players
    using these formats.


    amarOK can compile playlists (“Smart Playlists”) on the fly. Use the bottom part
    of the playlist browser to select one of the smart playlists or click ‘Create
    Smart Playlist’ to define a custom smart playlist. Enter a name, search criteria,
    order, and optional track limit.


    File Browser This tab opens a file browser. It corresponds to the standard KDE
    file selector dialog with the usual controls for navigating the file system. Enter
    a URL or directory directly into the text input field. From the contents displayed,
    drag elements to the playlist to include them. You can also perform a recursive
    search for a file in a given directory. To do so, enter a string for the title
    and the location at to start the search. Select ‘Search’ and wait for the results
    to appear in the lower section of the window.


    # The Cover Manager


    amarOK features a cover manager to enable you to keep matching music and image
    data on the albums you play. Start the ‘Cover Manager’ with ‘Tools’ → ‘Cover Manager’.
    A tree view in the left part of the window lists all the albums of your collection.
    The covers retrieved from Amazon are displayed in the right part of the window.
    With ‘View’, choose what is displayed in the cover list view. ‘All albums’ lists
    all albums of your collection, regardless of whether they have a cover image.
    ‘Albums with cover’ lists only those with a cover and ‘Albums without cover’ lists
    those lacking a cover. To retrieve cover data, choose ‘Amazon Fetch Missing Covers’.
    amarOK then tries to get covers for all albums contained in your collection.


    # Effects


    Select the ‘FX’ button in the player window or use the amarOK application menu
    to open a dialog in which to enable and configure several sound effects, such
    as an equalizer, the stereo balance, and a hall effect. Select the desired effects
    and adjust the settings, if available, for each of them.


    SUSE LINUX 185'
