  md: '# # 17.3 The Menus


    Some of the functions of the toolbar are also available in the ''File'' and ''Image''
    menus. Modify preference settings for Kooka in ''Settings''.


    File Use this menu to start the KPrinter printing assistant, create a new folder
    for your images, and save, delete, and close files. The OCR results of a scanned
    text document can be saved here. Also use this menu to close Kooka.


    Image The ''Image'' menu allows starting a graphics application for postprocessing
    or optical character recognition of an image. The recognized text from an OCR
    operation is displayed in its own frame. Various tools for scaling, rotating,
    and flipping an image can also be accessed from the toolbar. ''Create From Selection''
    allows saving an area of an image previously marked with the mouse.


    Settings ''Settings'' adjusts the look and feel of Kooka. The toolbar and status
    bar can be switched on and off and keyboard menu entries can be defined. ''Configure
    Toolbars'' provides a list of all the functions available to the toolbar. ''Configure
    Kooka'' opens a configuration dialog in which to modify the look and feel of Kooka.
    Normally, the defaults are sufficient. In ''Tool Views'', enable and disable the
    thumbnail viewer, the preview, the gallery, the scanning parameters, and the OCR
    result window.


    Help ''Help'' menu provides access to the online help manual for Kooka. Also use
    it to access a feedback channel for problems and issues. It also provides information
    about the version, authors, and license of Kooka and KDE.


    # # 17.4 The Gallery


    The gallery window shows the default folder where Kooka stores all its image files.
    An example is shown in Figure 17.4 on the following page. To save an image to
    your personal home directory, click the thumbnail to select it and then select
    ''File'' -> ''Save Image''. Then enter your personal home directory and give the
    file a descriptive name.


    To add images to the gallery, simply drag and drop them from Konqueror. Start
    Konqueror, navigate to the directory containing the images to add to the gallery,
    and drag them with the mouse to manage the Kooka gallery.'
