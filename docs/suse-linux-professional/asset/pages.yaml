  md: '# 1.7 Basic Administrative Tasks


    In SUSE LINUX, YaST handles the system installation and configuration. The following
    sections introduce some frequently needed functions of this tool. Refer to the
    Administration Guide for a detailed description of YaST and background information
    about system administration.


    # 1.7.1 Installing New Applications


    To install a new application, start YaST from the main menu. Provide the root
    password when requested to do so. Check whether the installation source is valid
    in the ''Change Source of Installation'' module. If you intend to install from
    the original SUSE LINUX CDs or DVDs, the active installation path should begin
    with cd:// or dvd=. If you intend to install from a network installation path,
    ask your system administrator for the full data, select ''Add'' and the type of
    network source, and enter the full path. Leave the dialog with ''Finish''.


    Start the YaST ''Install and Remove Software'' module. Enter the name of the desired
    application in the ''Search'' bar and hit ''Search''. Any patches matching your
    search criterion are listed in the right part of the window. If you want to install
    one of the packages, select the check box next to the package''s name and click
    ''Accept''. YaST automatically resolves all package dependencies—if there is any
    additional software component required to run the application, YaST automatically
    installs the missing package. To finish, YaST runs some scripts to update the
    system configuration. Leave YaST and your freshly installed application is ready
    to run. For a detailed description of the YaST software module, refer to the Administration
    Guide.


    # 1.7.2 Retrieving and Applying Software Updates


    Make sure that your system is up-to-date and security fixes by constantly running
    SUSEWatcher. If configured correctly, it automatically informs you about the availability
    of any software updates (see Section 1.3.3 on page 13). Launch the YaST ''Online
    Update'' and provide the root password. Select an appropriate installation source
    and hit ''Next''. A dialog similar to the one in Section 1.7.1 on the current
    page opens, showing all patches that are available for update. SUSE patches may
    fall in any of the three categories: security (security-sensitive patches that
    should always be installed to maintain a secure system), recommended (improvements
    to packages already'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'installed), and other (other patches available for update not relevant to any
    of your installed packages. Security updates are marked in red and are preselected
    along with the blue recommended patches. Accept this proposal to keep your system
    consistent. Click ‘Accept’ to apply the updates. For more information about the
    YaST Online Update, refer to the Administration Guide.


    # 1.8 Security


    If converting to a Linux system from a Windows system, you probably experienced
    a fair share of trouble caused by multiple kinds of viruses and worms spreading
    over the Internet via e-mail. Now that you have made the switch to Linux, you
    can at least feel that fear aside, because these cannot harm a Linux system as
    easily as Windows.


    As mentioned in Section 1.2 on page 6, Linux knows two different kinds of users,
    a superuser root has access to all system resources and is allowed to change all
    aspects of the system''s configuration. Switching from your normal user account
    to root for administrative tasks and switching back for your normal work sounds
    tedious and perhaps unnecessary because root has ultimate power over the system.
    Still, switching back to the normal user after accomplishing the administrative
    jobs adds to security, because any mistake made as root can have severe consequences.
    The whole system might be affected, not just the normal user account. Thus, preserve
    your system''s integrity by clearly distinguishing between the different roles
    (“normal user” and “superuser”).


    Keeping your system up to date by always applying the software updates provided
    by SUSE (see Section 1.7.2 on the preceding page) adds to the security of your
    system. These updates fix possible exploits contained in the application code.


    Protect your system or your network against external “visitors” by running a firewall.
    A preconfigured firewall is started on installation, providing maximum security
    to your network. If you need to add support for certain services and do not maintain
    your system yourself, ask your system administrator to make the necessary adjustments
    in the firewall settings. Otherwise read the chapter about security in the Administration
    Guide and learn how to secure your network using SuSEFirewall.'
