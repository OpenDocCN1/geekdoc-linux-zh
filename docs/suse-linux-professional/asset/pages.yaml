  md: '# 15


    ![](img/0d7086818d63bf06d3da42b908c48b45_230_0.png)


    K3b—The KDE Burning Application


    Figure 15.2: Customizing the Burning Process


    write process is used for each individual track. The RAW mode is not used very
    often, because the writer does not perform any data corrections. The best setting
    is ‘Auto’, because it allows K3b to use the most suitable settings.


    Simulate’ This function can be used to check if your system supports the selected
    writing speed. The writing is performed with the laser deactivated to test the
    system.


    ‘On the fly’ Burns the desired data without creating an image file (do not use
    this feature on low-performance machines). An image file—also known as an ISO
    image—is a file containing the entire CD content that is subsequently written
    to the CD exactly as it is.


    ‘Burnfree’ This option was formerly known as burn-proof. It helps to avoid buffer
    underruns of a CD writer. If burnfree is selected, the CD writer marks the current
    position and can return here in the event of a underrun. However, this causes
    small data gaps that are audible in audio CDs.


    SUSE LINUX 211'
