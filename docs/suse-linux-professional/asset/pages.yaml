- img_proc: true
  md: 'Choose between color and black-and-white scanning and set the resolution with
    the slider. See Figure 17.3 on the current page. The higher the resolution, the
    better the quality of the scanned image. However, this also results in a correspondingly
    larger file and the scanning process can take a very long time at high resolutions.
    Activate ''Use custom gamma table'' and click ''Edit'' to change the settings
    for brightness, contrast, and gamma.


    ![](img/0d7086818d63bf06d3da42b908c48b45_249_0.png)


    Figure 17.3: The Kooka Scanning Parameters


    Once all settings have been made, click ''Final Scan'' to scan the image. The
    scanned image is then displayed in the image viewer and as a thumbnail. When prompted,
    select the format in which to save the image. To save all the future images in
    that same format, check the corresponding box. Confirm with ''OK''.'
