  md: '# 4.2 Settings


    KDE desktop can be customized according to your preferences and needs. ''Control
    Center'' in the main menu opens the configuration dialog for your KDE desktop.
    The following section introduces a number of modules. You can also start it with
    the command `kcontrol`.


    > Tip

    Using Konqueror for Your Settings

    You can also use Konqueror to view and modify your settings. Type settings:/ in
    your location bar and Konqueror displays all the modules in icon view or tree
    view according to your configuration.


    # 4.2.1 Using the KDE Control Center


    After starting the KDE Control Center, see the main window. It has its menus at
    the top and a sidebar on the left. The configuration is displayed on the right.

    You can change the appearance of the sidebar with the ''View'' menu. Switch from
    the tree view to icon view or vice versa. Configure some shortcuts to ''Settings''
    ➝ ''Configure Shortcuts''.


    The sidebar contains three tabs. The first, ''Index'', displays all the modules
    according to the settings of the ''View'' menu. The second, ''Search'', enables
    you to search for some keywords. With the last tab, ''Help'', read small help
    texts about the current module.


    # 4.2.2 Appearance & Themes


    This item features all fine tuning options for the appearance of your desktop.
    ''Background'' lets you choose a color, picture, or slideshow for your background
    desktop.

    If do not like the actual color scheme, modify it in ''Colors''. You can change
    the color of the window background, your menu, links, and others.


    Fonts are also an essential part of your desktop. Set your default fonts with
    ''Fonts''. This module displays a preview of the currently selected font in a
    text field. With ''Choose'', select the font, style, and size.'
