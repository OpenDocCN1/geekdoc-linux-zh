    # 19.3 Important Linux Commands


    This section gives insight into the most important commands of SUSE LINUX system.
    Along with the individual commands, parameters are listed and, where appropriate,
    a typical sample application is introduced. To learn more about the various commands,
    use the manual pages, accessed by the name of the command, for example, man ls.


    In the man pages, move up and down with (PgUp) and (PgDn). Move between the beginning
    and the end of a document with (Home) and (End). End this viewing by pressing
    (Q). Learn more about the command itself with man man.


    There are many more commands than listed in this chapter. For information about
    other commands or more detailed information, the O''Reilly publication Linux in
    a Nutshell is recommended. In the following overview, the individual command elements
    are written in different typefaces.'
