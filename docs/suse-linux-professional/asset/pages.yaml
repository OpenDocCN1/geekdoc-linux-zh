    # 13.1.4 Look and Feel of Mixer Applications


    The look and feel of mixer applications depends on the type of sound card used.
    Some drivers, like SB Live!, have many controllable (tunable) mixer elements while
    the drivers for professional sound cards may have elements with totally different
    names.


    # On-Board Sound Chip


    Most of the PCI on-board sound chips are based on AC''97 codec. ''Master'' controls
    the main volume from the front speakers. ''Surround'', ''Center'', and ''LFE''
    control the rear, center, and bass-boost speakers. Each of them has a mute switch.
    In addition to that, some boards have individual ''Headphone'' and ''Master Mono''
    volumes. The latter is used for the built-in speaker on some laptops.'
  merge: -1
