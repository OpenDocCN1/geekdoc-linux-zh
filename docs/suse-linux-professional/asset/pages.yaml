- img_proc: true
  md: 'PCM controls the internal volume level of digital WAVE playback. PCM is an
    acronym for Pulse Code Modulation, one of the digital signal formats. This control
    has an individual mute switch.


    Other values, like ''CD'', ''Line'', ''Mic'', and ''Aux'', control the loopback
    volume from the corresponding input to the main output. They do not influence
    the recording level, only the playback volumes.


    For recording, turn on the ''Capture'' switch. The ''Capture'' volume is the input
    gain for recording. By default, this switch is set to zero. Choose a recording
    source like ''Line'' or ''Mic''. The recording source is exclusive, so you cannot
    choose two of them at the same time. ''Mix'' is a special recording source. You
    can record the currently played signal from this source.


    Depending on the AC97 codec chip, special effects, like 3D or bass/treble, are
    available.


    # SoundBlaster Live! and Augigy Family


    SoundBlaster Live! and SB Augigy1 have numerous mixer controls for their AC97
    codec chip and DSP engine. In addition to the controls already described, they
    have ''Wave'', ''Music'', and ''AC97'' volumes to control the internal signal
    routing and attenuation for PCM, WaveTable MIDI, and AC97 mixing. Keep the volume
    at 100% to hear all of them. SB Augigy2 (depending on the model) has less controls
    than SB Live, but still has ''Wave'' and ''Music'' controls.


    The recording on SB Live is similar to on-board chip. You can choose ''Wave''
    and ''Music'' as the additional recording source to record the played PCM and
    WaveTable signals.


    # USB Audio Devices


    USB audio devices usually have a small number of mixer controls. Sometimes they
    have none at all. Most devices either have a ''Master'' or ''PCM'' control switch
    to control the playback volume.


    # 13.1.5 The Mixer for the Sound Chip Envy24


    env24control is a mixer application for sound cards using the Envy24 (ice1712)
    chip. The flexibility of the Envy24 chip can result in varying functionalities
    in different sound cards. The latest details on this sound chip are available
    in /usr/share/doc/packages/alsa-tools/envy24control.'
