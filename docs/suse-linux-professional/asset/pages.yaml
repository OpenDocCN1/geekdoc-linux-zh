  md: 'that all the necessary settings be passed to the application as parameters.
    Running gqcam -t JPEG -s -d webcam.jpg saves the current image captured by the
    camera with the filename webcam.jpg. The option -t defines the file format. Possible
    values are JPEG, PNG, and PPM. The command line switch -s activates the color
    correction. The filename for saving is passed with the option -d. If more than
    one webcam is operated, the name of the device must be passed. If no device is
    given, the default device /dev/video0 is used. To capture an image from the second
    camera, the option -v /dev/video1 must be added. List all options gqcam --help.


