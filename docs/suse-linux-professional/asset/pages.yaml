    # 3.5.3 Dasher


    Dasher is a small application enabling you to create texts without using a keyboard.
    You can use it on any computer device that comes without a keyboard (handheld
    or wearable computers) or on a normal computer that is controlled with a joystick,
    touchpad, head mouse, or eyetracker instead of keyboard and mouse.


    Dasher is driven by continuous pointer gestures. Start with one character then
    drag the pointer to the next one until your text input is finished. Dasher supports
    various languages out of the box (English and European languages, Japanese, and
    some African languages) and can easily be trained to support other languages.
    Find more information about the Dasher project at http://www.inference.phy.cam.ac.uk/dasher/.'
