  md: 'POV-Ray The Persistence of Vision Raytracer creates three-dimensional, photo-realistic
    images using a rendering technique called ray tracing. Because there is a Windows
    version of POV-Ray, it does not take much for Windows users to switch to the Linux
    version of this application. Find more information about POV-Ray at http://www.povray.org/


    Blender is a powerful rendering and animation tool available on many platforms,
    including Windows, macOS, and Linux. Find more information about Blender at http://www.blender3d.com/


    Digikam is a smart digital photo management tool for the KDE desktop. Importing
    and organizing your digital images is a matter of a few clicks. Create albums,
    add tags to spare you from copying images around different subdirectories, and
    eventually export your images to your Web site. Find more information about Digikam
    at http://digikam.sourceforge.net/digikam-SPIP/ or refer to Chapter 16 on page
    215.


    gThumb is an image viewer, browser, and organizer for the GNOME desktop. It supports
    the import of your digital images via gphoto2, allows you to carry out basic transformation
    and modifications, and lets you your images to create albums matching certain
    categories. Find more information about gThumb at http://gthumb.sourceforge.net/


    Kooka is a scan and OCR suite for the KDE desktop. It allows you to configure
    the main scan parameters, choose from various export formats, and recognize the
    scanned data. The OCR module provided by the Kooka adds some basic text recognition
    features. Find more information about Kooka at http://www.kde.org/apps/kooka/
    or refer to Chapter 17 on page 227.


    Gwenview is a simple image viewer for KDE. It features a folder tree window and
    a file list window that provides easy navigation of your file hierarchy. Find
    more information at http://gwenview.sourceforge.net/home/


