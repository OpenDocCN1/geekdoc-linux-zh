    # 3.4 Important Utilities


    GNOME has many applets and applications. They are designed to interact with the
    desktop and each other. This section introduces some of them. Learn how to manage
    little notes on your desktop, use the GNOME dictionary, chat with Gaim, and enjoy
    various types of multimedia applications.


    # 3.4.1 Taking Notes with Tomboy


    Tomboy is a little panel applet offering a note application for the GNOME desktop.
    Left-click the panel icon to open the Tomboy menu and select ‘Create New Note’.
    Enter the text of your note. Notes can be linked with each other by clicking ‘Link’.
    These links even survive renaming and reorganizing. A ‘Search Notes’ function
    located in the panel menu of Tomboy lets you search your notes. Web links and
    e-mail addresses can also be dropped onto Tomboy.


    # 3.4.2 Dictionary


    Dictionary (command gnome-dictionary) is a useful applet for checking the spelling
    and meaning of words. An Internet connection is required, because this applet
    accesses an online dictionary.


    Enter the term to look up in ‘Word’. The menu under ‘Dictionary’ gives a choice
    ‘Look Up Word’ and ‘Check Spelling’. By default, the query is sent to the dict.org
    server. To use a different server, select ‘Edit’ -> ‘Preferences’. See a sample
    entry in Figure 3.4 on the next page. dict.org allows you to choose from various
    databases for special vocabularies, such as jargon or computer terminology. Under
    ‘Default strategy’, specify what to look for the exact word, parts of the word,
    or the prefix or suffix. Under ‘Help’, access the online manual of the application
    with information about the author and version of the application with ‘About’.'
