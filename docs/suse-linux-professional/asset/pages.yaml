  md: '# 14.3 Webcams and motv


    If your webcam is already supported by Linux, access it with motv. Find a summary
    of the supported USB devices at http://www.linux-usb.org. If you have already
    used motv to access the TV card prior to access the bttv driver is loaded. The
    webcam driver is loaded automatically when your webcam is connected to the USB.
    Start motv at the command line -c /dev/video1 to access the webcam. Access the
    TV card with motv -c /dev/video0.


    When connecting to the webcam to the USB before the bttv driver has been automatically
    loaded (for example, by a TV application), /dev/video0 is reserved for the bttv.
    In this case, if you start motv with the -c /dev/video1 parameter to access the
    TV card, you might get an error message, because the bttv driver was not automatically
    loaded. Solve this problem by loading the driver separately with modprobe bttv
    as the root user. Access an overview of the configurable video devices on your
    system with motv -hwscan.


    # 14.4 nxtvepg—The TV Magazine for Your PC


    From some broadcasters, an EPG signal (Electronic Program Guide) is transmitted
    along with the video text signal. Easily view this electronic guide using the
    program nxtvepg. To do this, however, you must have a TV card supported by the
    bttv driver and be able to receive one of the channels broadcast with an EPG.
    With nxtvepg, the broadcasts are sorted according to channel and topic, such as
    ''movie'' and ''sport'', and filtered according to criteria, as Live, Stereo,
    or Subtle. Start the application with ''Multimedia'' → ''Video'' → ''nxtvepg''
    or at the command line with nxtvepg.


    # 14.4.1 Importing the EPG Database


    To set up and update the program database via the EPG signal, set the tuner of
    your TV card to a station that broadcasts EPG. This can be done using a TV application,
    such as motv or nxtvepg. Only one application at a time can access the tuner.


    SUSE LINUX 201'
