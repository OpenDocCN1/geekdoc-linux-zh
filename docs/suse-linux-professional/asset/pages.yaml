  md: '# 3.4.3 Messaging with Gaim


    Gaim (command gaim) is a powerful instant messenger client. It supports various
    protocols, such as AIM, ICQ, GroupWise, IRC, Jabber, MSN, and others. Its most
    popular features include the ability to log in to multiple accounts on instant
    messaging networks at the same time, automatic text replacement, and spell checking.
    Gaim has bouncy pounces (known as "buddy alerts" in AOL Messenger), meaning that
    you can configure Gaim to notify you whenever one of your buddies enters a channel
    to which you are currently connected. Gaim can send you a message announcing this,
    play a sound, or execute a command.


    On first-start, create a list of your accounts on instant messaging networks by
    clicking ''Add'' in the ''Accounts'' window to open the appropriate dialog. Select
    the protocol then enter your screen name, password, and alias. Check ''Remember
    password'' and ''Auto-Login'' if you want Gaim to log in automatically on start-up.
    To keep track of your e-mail while using Gaim, check ''New mail notifications''.
    To select a buddy icon for your account, open a file dialog and choose one. Additional
    options, such as proxy settings and server addresses, can be configured after
    ''Show more options''. Once you have completed your account settings, leave this
    dialog with ''Save''.


    As soon as you are done entering the account data, it is shown in the login window.
    To sign on, select your account from the ''Account'' menu, enter your password,
    click ''Sign on'', and start chatting.


