  md: 'GNOME has a very intuitive look and feel to it. However, users migrating to
    Linux from a Microsoft Windows desktop might need to get accustomed to a few things.
    Users migrating from a Macintosh might notice that GNOME feels much like home,
    because it aims to provide a Mac-type look and feel to a Linux desktop.


    Two issues are very important:


    +   double-click Like a Mac desktop, a GNOME desktop is entirely ruled by the
    double-click. To trigger an event by clicking a GNOME icon, for example, open
    your home folder, you need to double-click it. To open subdirectories in the file
    manager, double-click the parent folder.


    +   instant apply Any configuration dialog opened from a GNOME application or
    as part of the GNOME desktop configuration follows the principle of “instant apply.”
    Once you enter your preferences, just click the ‘Close’ button to save them and
    leave the dialog. You will not find any ‘Apply’, ‘OK,’ or ‘Cancel’ buttons in
    this kind of dialog.


    # 3.1 The Desktop


    The most important elements of the GNOME desktop are the icons on the desktop,
    the panels at the top and bottom border of the screen, and the panel menus. The
    mouse is your most important tool, although GNOME has built-in support for assistive
    technologies, such as braille, speech synthesizers, and on-screen keyboards for
    support handicapped users. For details on these technologies, refer to Section
    3.5 on page 65.


    # 3.1.1 The Icons


    The default GNOME desktop features at least the following desktop icons-providing
    basic navigation and functionalities of your system:


    Trash Anything you want to delete can be dropped onto the ‘Trash’ desktop icon.
    As long as you not empty the trash can, these items are not deleted permanently
    and can still be restored.


    Home The ‘Home’ desktop icon provides easy access to your private data.'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'The ''Computer'' desktop icon can be used to quickly access any device attached
    to your computer. This includes hard drives, partitions, digital cameras, and
    USB flash drives.


    Right-clicking an icon displays a menu offering file operations, like copying,
    or renaming. Selecting ''Properties'' from the menu displays a configuration dialog.
    The title of the icon and the icon itself can be changed with ''Custom icon''.
    Use the ''Permissions'' tab to view and modify the access, read, and write permission
    settings for this file for the user, group, or others. The ''Notes'' tab manages
    contents. The menu for the trash can additionally features the ''Empty Trash''
    option. This deletes its contents.


    To remove an icon from the desktop, simply move it into the trash. However, be
    careful if you throw folders icons or files into the trash, the actual data is
    deleted. If the icons represent links to a file or directory, only the links are
    deleted.


    To create a link on the desktop to a folder or file, access the object in Nautilus.
    Right-click the object and select ''Make Link''. Drag the link from the Nautilus
    window and drop it on the desktop.


    # 3.1.2 The Desktop Context Menu


    Right-clicking a free spot on the desktop displays a menu with various options.
    Select ''New Folder'' to create a new folder. Create a launcher icon for an application
    with ''New Launcher''. Provide the name of the application and command starting
    then choose an icon to represent it. The order and alignment of desktop icons
    are controlled via ''Clean Up by Name'' and ''Keep Aligned''. It is also possible
    to change the desktop background or reset it to its default setting. If you need
    a command line environment, click ''Open Terminal''.


    # 3.1.3 The Panels


    On first login, the GNOME desktop starts with two panels located at the top and
    bottom of the screen. The upper panel holds three panel menus (''Applications'',
    ''Places'', and ''Desktop''), a quick launch area providing application buttons
    for the most important programs, a system tray holding app icons, and a notification
    area with the system clock and the volume control.


    GNOME Desktop


    # 3


    SUSE LINUX


    49'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'The bottom panel contains the window icons of all started applications in the
    taskbar. If you click the name of a window in the taskbar, it is moved to the
    foreground. If the program is already in the foreground, a mouse click minimizes
    it. Clicking a minimized application reopens the respective window.


    Beside the taskbar, the ‘Workspace Switcher’ provides access to additional work
    areas. These virtual desktops provide extra space in which to arrange open applications
    and windows. For example, put an editor on one workspace, some shells on another,
    and your e-mail application and Web browser on third. Move a window to another
    workspace by dragging its icon in the workspace switcher from one workspace to
    another.


    If you right-click an empty spot in the panel, a menu opens, offering help, information,
    and commands for GNOME and panels. Select ‘Properties’ to open a configuration
    dialog to change the position and background of the panel. If desired, add launchers,
    tools, and various applets to the existing panels with ‘Add to Panel’. Remove
    panel elements by right-clicking their icons and selecting ‘Remove’. A new panel
    can be added with ‘New Panel’


    # The Applications Menu


    The ‘Applications’ menu provides an easily accessible hierarchy of the applications
    installed on your system. Most of them are grouped into smaller submenus each
    dedicated to a category, like ‘System’, ‘Office’, and ‘Internet’. To start any
    application, just click ‘Applications’ to unfold the complete menu. Then select
    a suitable category, unfold the submenu, and click the application’s name.


    Applications not in the menu can be started via the ‘Run Application’ prompt (Alt+F2),
    if you know their command. For example, if you want to browse your digital photographs
    and could not find gThumb in the menu, enter gThumb at the ‘Run Application’ prompt.


    # The Places Menu


    The ‘Places’ menu provides easy access to common locations, such as the user’s
    ‘Home’, drives, desktop and network folders. A search function for recent documents
    and a file search can also be launched with this menu. For more information about
    file management of local and remote folders, refer to Section 3.3.2 on page 58.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# 3


    # The Desktop Menu


    The ''Desktop'' menu contains the basic controls for managing your desktop. Here,
    find ''Lock Screen'' and ''Log Out'' as well as an easy-to-use function for taking
    screenshots of your desktop. The screenshot function can alternatively be accessed
    by pressing the Print Screen key (also known as (PrtSc)).


    # Applets


    Applets are little applications that are nested in the panel by means of a small
    icon. Unlike a ''real'' application, they do not have their own window on screen.
    Some applets are already preconfigured to be in your panel from start, but there
    are many more to be discovered and added to your custom panel.


    Adding a panel applet is very simple. Right-click the panel to open the ''Add
    to Panel'' dialog, shown in Figure 3.1 on the current page, scroll down until
    you find what you need, select the item, and click ''Add''. A new applet is then
    permanently added to the panel.


    ![](img/0d7086818d63bf06d3da42b908c48b45_70_0.png)


    Figure 3.1: Adding a New Icon to the Panel'
