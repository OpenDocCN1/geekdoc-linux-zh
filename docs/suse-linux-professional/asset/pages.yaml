  md: '# Warning


    Do not use telnet over a network on which third parties can eavesdrop. Particularly
    on the Internet, use encrypted transfer methods, such as ssh, to avoid the risk
    of malicious misuse of a password (see the man page for ssh).


    # Warning


    # Miscellaneous


    passwd [option(s)] [username] Users may change their own passwords at any time
    using this command. The administrator root can use the command to change the password
    of any user on the system.


    su [option(s)] [username] The su command makes it possible to log in under a different
    username from a running session. Specify a username and the corresponding password
    to use the environment of the respective user. The password is not required from
    root, because root is authorized to assume the identity of any user. When using
    the command without specifying a username, you are prompted for the root password
    and change to superuser(root).


    halt [option(s)] To avoid loss of data, you should always use this program to
    shut down your system.


    reboot [option(s)] Does the same as halt except the system performs an immediate
    reboot.


    clear This command cleans up the visible area of the console. It has no options.


    # 19.4 The vi Editor


    Operating the vi editor takes some practice. For many, it is the preferred editor,
    partly it is available on any UNIX-like operating system and is included in default
    Linux installations. Also, if nothing else works, vi will. The shortinstructions
    that should enable you to edit various configuration files and other types of
    files with vi.


    vi provides three operating modes. In command mode keys are interpreted as command
    elements. Insert mode interprets all keys as text entries. Last line mode is used
    for more complex commands, which are entered in the last line.'
