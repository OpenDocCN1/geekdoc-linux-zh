  md: '# 8.3.3 Encrypted E-Mail and Signatures


    To encrypt your e-mail, first generate a key pair as described in Chapter 12 on
    page 165. To configure the details of the encryption procedure, select ''Settings''
    → ''Configure KMail'' → ''Identities'' to specify the identity under which to
    encrypted and signed messages. Then press ''Modify''. After confirming with ''OK'',
    the key should be displayed in the corresponding field. Close the configuration
    dialog with ''OK''.


    # 8.3.4 Folders


    Message folders help organize your messages. By default, they are located in the
    directory ~/KMail. When starting KMail for the first time, the program creates
    several folders. inbox is where new messages fetched from a server are initially
    placed. outbox is for temporary storage of messages queued for sending. sent-mail
    is for copies of messages sent. trash contains copies of all e-mails deleted with
    ''Del'' or ''Edit'' → ''Delete''. Use drafts to save unfinished messages. If you
    are using IMAP, the IMAP folders are listed below the local folders.


    If you want additional folders to organize your messages, create them by selecting
    ''Folder'' → ''New Folder''. This opens a window in which to specify name and
    format of the newly created folder.


    Right-click the folder for a context menu offering several folder operations.
    Click ''Expiry'' to specify the expiration date for read andunread messages and
    what should happen with them after expiration. If you intend to use the folder
    to store messages from a mailing list, set the necessary options under ''Folder''
    → ''Mailing List Management''.


    To move one or several messages from one folder to another, highlight the messages
    and then press ''Select'' → ''Move to''. In the list of folders that appears,
    select the folder to move your messages. Messages can also be moved by dragging
    them from the upper window and dropping them into the appropriate folder in the
    left window.


    # 8.3.5 Filters


    Filters are a convenient method of automatically processing incoming mail. They
    use aspects of mail, such as sender or size, to move mail to certain folders,
    delete unwanted mail, bounce back mail to the sender, or perform a number of other
    actions.'
