- img_proc: true
  md: '# 16


    # Digital Cameras and Linux


    If your camera can be switched to a USB mass storage device, select this option.
    After you connect it with the USB port of your computer and turn it on, it is
    detected by the hotplug system. This takes care of mounting the device automatically,
    so it is easily accessible. The KDE desktop shows a camera icon after a successful
    mount.


    After the camera is successfully mounted, see a new directory under /media, beginning
    with usb and lots of numbers. Each vendor and product has a number, so when you
    connect a device on your computer it always has the same name. Depending on what
    you have connected to the USB bus, find different entries. The only problem left
    is to find the correct entry for your camera. Try to list one of these directories
    and see what happens. Each camera has a tree structure, so there is no general
    rule. If you see JPEG files in a directory, you probably


    After you find your correct entry, you can copy, move, or delete the files of
    your camera with a file manager like Konqueror or simple shell commands (see Section
    19.3 on page 260 and the Administration Guide).


    # 16.3 Installing the Programs


    Use YaST to install the gtkam package. The other required packages are selected
    automatically. Digikam is included in the default installation. If it is not installed,
    use YaST to install it, if desired.


    # 16.4 Using Konqueror


    KDE users can easily access digital cameras by means of the familiar Konqueror
    interface. Connect your camera to the USB port. A camera icon should appear on
    the desktop. Click this icon to open the camera in Konqueror. The camera can also
    be accessed by entering the URL camera:/ in Konqueror. Navigate through the camera’s
    directory structure until the files are shown. Use the usual Konqueror file management
    features to copy the files as desired. More information about using Konqueror
    is available in Chapter 10 on page 151.'
  merge: -1
