  md: '# 3.2 Settings


    Use the GNOME control center to customize your desktop. Access it with ''Desktop''
    → ''Preferences''. The most important and prominent modules of the GNOME control
    center are featured in the following sections. In the individual modules, access
    relevant help for the options with ''Help''. The system immediately adopts every
    change made in a configuration module.


    # 3.2.1 Keyboard


    The ''Keyboard'' module consists of four tabs. The ''Keyboard'' tab determines
    key repeats and cursor blinking. Keyboard layouts can be configured in the second
    tab, specifying the keyboard model and the localized keyboard layout. ''Layout
    Options'' can be used to activate special keyboard features like Keys. Typing
    breaks can be configured in the fourth tab (''Typing Break''). With this, the
    screen is shut down after a certain time for you to take breaks from screen work.
    Exit the ''Keyboard'' module with ''Close'' or go the accessibility module with
    ''Accessibility''. The functionality of this module is described in Section 3.2.8
    on page 54.


    # 3.2.2 Mouse Configuration


    The mouse configuration consists of three tabs: ''Buttons'', ''Cursor'', and ''Motion''.
    The configuration options of the ''Buttons'' tab refer to the ''Mouse Orientation''.
    Left-handed users should activate ''Left-handed mouse'' to swap the right and
    left mouse buttons. Use the slider to determine the maximum delay (in seconds)
    between two clicks that the system should interpret as a double-click.


    The appearance and size of the cursor can be changed under the ''Cursor'' tab.
    Three different settings are available. Changes are not activated until the next
    login. Under ''Locate Pointer'', activate an option that causes the cursor to
    be highlighted when you press Ctrl, making it easier to find. Under ''Motion'',
    set the acceleration and sensitivity of the screen cursor and the drag and drop
    threshold.


    # 3.2.3 Menus and Toolbars


    The settings in this module affect the menus and toolbars of all GNOME-compatible
    applications. Select for toolbar icons to be displayed as ''Text Only'','
  merge: -1
  pgno: 71
- img_proc: true
  md: '‘Icons Only’, ‘Text Icons’, or ‘Text Below Icons’. The default setting is ‘Text
    below icons’.


    Activate ‘Detachable toolbars’ to allow the detachment of the toolbar from all
    other window elements and allow free positioning on the desktop. This makes a
    grabbing area appear on the left side of the toolbar. Clicking and holding this
    area relocates the toolbar.


    Every menu entry in any application menu can be displayed with the corresponding
    icon. Activating ‘Show icons in menus’ tests the settings with the provided example
    menu.


    # 3.2.4 Windows


    This module controls the behavior of application windows. Determine how the window
    should react to contact with the mouse pointer or double-clicks on its title and
    define the key to hold for moving an application window.


    When several application windows populate the desktop, the active one, by default,
    is the last one clicked. Change this behavior by activating ‘Select windows when
    the mouse moves over them’. If desired, activate ‘Raise selected window after
    an interval’ and adjust the latency time with the slider. This activates a window
    only when the cursor was placed within the window for a time exceeding the set
    latency.


    Application windows can be rolled up by double-clicking the title bar, leaving
    only the title bar visible. This saves space on the desktop and is the default
    behavior. It is alternatively possible to set windows to maximize when the title
    bar is double-clicked.


    With the radio buttons, select the modifier key to press for moving a window.
    The possible choices are `Ctrl`, `Alt`, and the `Windows` key.


    # 3.2.5 Background


    Determine a background for your desktop. By default, the changes made here are
    applied to all virtual desktops. If you do not want any background picture, click
    ‘No Wallpaper’ and define a background style. The drop-down menu offers a horizontal
    gradient, a vertical gradient, or no gradient at all. Use ‘Desktop Colors’ to
    define the desired colors in the color editor.


    To use an image file as a background picture, drag it from the file manager and
    drop it in the ‘Desktop Wallpaper’ window. Alternatively, click ‘Add Wallpaper’
    to open a dialog in which to select the desired image.'
  merge: -1
