  md: 'You can always change your password with ''File'' → ''Change Password''.


    # Advanced Features


    You probably do not need to pay much attention to KWallet. It resides silently
    in the panel and is automatically activated if needed. One nice feature of KWallet
    is that you can move your wallet files to another computer, for example to your
    laptop. To simplify this task, wallets can be dragged from the manager window
    to a file browser window. For example, save it on a USB stick and carry your passwords
    with you.


    # 4.4.3 The Download Manager KGet


    KGet is the download manager for KDE. It manages your transfers in a window. Stop,
    resume, delete, queue, and add transfers.


    # Adding Transfers


    Start KGet by pressing Alt+F2 and entering the command kget. When the program
    starts for the first time, a dialog is displayed. Confirm this dialog to integrate
    KGet in Konqueror. When you close the dialog, KGet is integrated in the system
    panel as an icon with a downward arrow.


    Click this arrow to open the dialog displaying your transfers. To add a transfer
    to the list, select ''File'' → ''Paste''. A dialog opens. Enter a URL in the input
    field and confirm with ''OK''. Then specify the location for saving the downloaded
    file. After all information has been entered, the entry for the transfer is added
    to the main window of KGet and started.


    Another way to add a transfer is by means of drag and drop. Simply drag a file,
    for example, from an FTP server, from Konqueror and drop it in the main window.


    # Timer-Controlled Transfers


    You can also instruct KGet to perform your transfers at a specific time. Activate
    ''Options'' → ''Offline Mode''. All transfers inserted from this point are not
    immediately but queued. To start the clock, double-click the reactive entry. A
    dialog opens. Select ''Advanced''. The dialog is expanded by the settings needed
    for starting the transfer at a certain time. Enter the day, month, year, time
    and activate the timer icon. Then close the window.


    # 4.4. Important Utilities'
