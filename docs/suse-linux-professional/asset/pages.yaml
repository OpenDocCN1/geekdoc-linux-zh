  md: '# Setting Up a Filter


    To create a filter from scratch, select ''Settings'' → ''Configure Filters''.
    To create a filter based on an existing message, select the desired message then
    select ''Tools'' → ''Create Filter'' and the desired filter criteria.


    Select the match method for filter criteria (all or any). Then select criteria
    that applies only to the desired messages. In ''Filter Actions'', set what the
    filter should do to the messages that meet the criteria. ''Advanced Options''
    provides control over when the filter is applied and whether additional filters
    should be considered for these messages.


    # Applying Filters


    Filter are applied in the order listed in the dialog across ''Settings'' → ''Configure
    Filters''. Change the order by selecting a filter and clicking the arrow buttons.
    Filters are only applied to new incoming messages or sent messages specified in
    the filter''s advanced options. To apply filters to existing messages, the desired
    messages then ''Message'' → ''Apply Filters''.


    If your filters do not act as expected, monitor them with ''Tools'' → ''Filter
    Log Viewer''. When logging is enabled in this dialog, it shows how messages are
    processed by your filters and can help locate the problem.


    # 8.4 Contacts


    The contacts component uses KAddressBook. Configure it with ''Settings'' → ''Configure
    KAddressBook''. To search for a particular contact, use the search bar. With ''Filter'',
    select to display only contacts in a certain category. Right-click a contact to
    open a menu in which to select from a variety of options, such as sending contact
    information in an e-mail.


    # 8.4.1 Adding Contacts


    To add a contact with the name and e-mail address from an e-mail, right-click
    the address in the main component and select ''Open in Address Book''. To add
    a completely new contact, select ''File'' → ''New Contact'' in the address component.
    Both methods open a dialog in which to enter information about the contact.'
