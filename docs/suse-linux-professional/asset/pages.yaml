    # 4.4.4 The Clipboard Klipper


    The KDE program Klipper serves as a clipboard for selected text, normally marked
    by keeping the left mouse button pressed. This text can be transferred to another
    application by moving the mouse pointer to the target location then pressing the
    middle button (on a two-button mouse, press both buttons simultaneously). The
    text is copied to the selected location from the clipboard.


    By default, Klipper is started when KDE is loaded and appears as a clipboard icon
    in the panel. View the contents of the clipboard by clicking this icon. The Klipper
    context menu and the last seven entries, also referred to as the history, are
    displayed. See Figure 4.3 on this page. If an extensive text was copied to Klipper,
    only the first line of the text is displayed as active with a black check mark.
    To copy an older text fragment from Klipper to an application, select it by clicking
    it, move the mouse pointer to the target application, middle-click.


