    # 4.4.5 Ark: Displaying, Decompressing, and Creating Archives


    To save space on the hard disk, use a packer that compresses files and directories
    to a fraction of their original size. The application Ark can be used to manage
    such archives. It supports common formats, such as zip, tar.gz, tar.bz2, lha,
    and rar.


    Start Ark from the main menu or from the command line with Ark. If you already
    have some compressed files, move these from an open Konqueror window to the Ark
    window to view the contents of the archive. To view an integrated view of the
    archive in Konqueror, right-click the archive in Konqueror and select ‘Preview
    in Archiver’. Alternatively, select ‘File’ → ‘Open’ in Ark to open the file directly.
    See Figure 4.4 on the next page.


    Once you have opened an archive, perform various actions. ‘Action’ offers options
    such as ‘Add File’, ‘Add Folder’, ‘Delete’, ‘Extract’, ‘View’, ‘Edit With’, and
    ‘Open With’.'
