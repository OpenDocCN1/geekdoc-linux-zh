  md: 'Can I copy and paste in Linux? Yes, this is possible. Highlight the text by
    clicking and dragging with the left mouse button then insert by clicking with
    the middle mouse button. The right mouse button has a special function in most
    programs and applications.


    How can I switch from a virtual text console to the graphical user interface?
    By default, there are six virtual text consoles that can be accessed with `Ctrl-Alt-F1`
    to F6. Press `Ctrl-Alt-F7` to go to the graphical user interface.


    Why isn''t there a movie player that supports encoded DVDs?

    Movie player applications on SUSE LINUX are unable to play a number of file formats,
    especially movie DVDs. Due to patented codecs and copy protection, SUSE is not
    allowed to deliver full-featured movie players with the distribution.


    # Troubleshooting


    Where can I see the system messages?

    System messages are logged under `/var/log/`. To access this directory and all
    information stored there, log in `root`. The most important messages are logged
    in `messages`. To view the most recent entries, enter `tail -f /var/log/messages`
    in the terminal window. To view messages relating to the boot process, apply this
    command to the file `boot.msg`.


    To monitor the processes running on your system, enter `top` in a terminal window.
    If you need access information located under `/proc`, use `procinfo`. monitors
    the status of CPU usage, load average, memory usage, and more.


    How can I find a specific file on my system?

    There are two possibilities. One is to use the KDE or search tool. Find them in
    the main menu. Alternatively, use the command `find`, described in man `find(1)`.


    I am searching for a specific file (`libfoo.so.2`). How do I find out what package
    this file is in?

    Use the command `pin` (Package Information) to locate a file:


    ```

    pin libfoo.so.2

    ```


    The above command tries to find a package or filenames and paths. Use man `pin(1)`
    for more information.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# My computer crashed. Can I just press the reset button without risking anything?


    If your computer no longer reacts to your mouse or keyboard, this does not necessarily
    mean that your entire system has crashed. Possibly one program is blocking the
    mouse or the keyboard, but all other programs are still running. If your machine
    can be accessed remotely (serial terminal, network), or log elsewhere, identify
    the crashed application by ps or top, and abort the respective program with killall
    (program name). If this does not work, try killall -9 (program name).


    If this is not possible, try switching to another console using (Ctrl-Alt)-F2
    to kill the faulty process from. If the computer does not respond to any of the
    keys and network intervention is not possible, wait at ten seconds before resetting
    the system to make sure there is no hard disk activity.


    To avoid damage to your file system, make sure that all data is safely written
    to disk before resetting the system. This can be done using the SysRq option of
    the Linux kernel. The kernel support for this feature must be enabled. Open the
    file /etc/sysconfig/sysctls as root and set ENABLE_SYSRQ to use. Use the key combination
    Alt-SysRq-U to empty all data buffers by safely writing the data to disk and unmount
    the file system. SysRq may also be labeled (Print Screen) on some keyboards.


    After the file system is unmounted, press the reset button to reboot your system.


    I cannot log in to my computer with telnet. I always get the answer Login incorrect.


    You are probably trying to log in as root. For security reasons, this is not possible
    via telnet by default. With YaST, set up a normal user account. Log in with this
    username. Then change to the user root with su. It is better and safer, however,
    to use the program ssh instead of telnet. The ssh program uses encrypted, secure
    connections.


    # Contacting SUSE


    I found a bug in SUSE LINUX. Where should I report it?


    First, ascertain whether it is actually a bug in the program or just an error
    in operation or faulty configuration settings. Also read the documentation in
    /usr/share/doc/packages and /usr/share/doc/howto. The bug may already have been
    discovered. Check in the support'
  merge: -1
  pgno: 296
- img_proc: true
  md: 'database at http://portal.suse.com/sdb/en/index.html.

    Enter a keyword or work your way forward or backward via the History link. If
    it is really a bug, send a description of it using http://www.suse.com/feedback
    and read the article at http://portal.suse.com/sdb/en/2001/10/bugreport.html.


    # What is a mirror? Why shouldn''t I get these things from ftp.suse.com?

    as there are many users who need to retrieve things from the server at the same
    time, its capacity limit would be reached very quickly. For this reason, there
    are a number of other FTP servers that contain a duplicate of the vicinity (same
    country) for the download. A list of mirrors is available at http://www.novell.com/products/linuxprofessional/downloads/ftp/int_mirrors.html.

    SUSE server. These servers are referred to as mirrors. Select a mirror in your
    vicinity to speed up the download.


    I might have a problem or question that isn''t referenced here. Is there a way
    to submit this information so others can benefit from it?


    Submit your questions by contacting the writers of this book via an e-mail to
    mailto:documentation@suse.de?subject=FAQ. Future editions of this FAQ will benefit
    from your feedback. Note that the editors will not provide support of any kind
    in answer to your mail. Refer to the support team if in need of help.'
