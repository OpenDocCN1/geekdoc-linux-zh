  md: '# 15.1 Creating a Data CD


    To create a data CD, go to ''File'' → ''New Project'' → ''New Data Project''.
    The project view appears in the lower part of the window, as shown in Figure 15.1
    on this page. Drag the desired directories or individual files from your home
    directory to the project folder and drop them there. Save the project under a
    name of your choice with ''File'' → ''Save as''.


    ![](img/0d7086818d63bf06d3da42b908c48b45_229_0.png)


    Figure 15.1: Creating a New Data CD


    Then select ''Burn'' from the toolbar. A dialog with five tabs offering various
    options for writing the CD opens. See Figure 15.2 on the next page.


    The ''Writing'' tab has various settings for the burning device, the speed, and
    the burning options. The detected writer is displayed under ''Burning Device''
    in the burning dialog. Set the burning speed in ''Speed''. The following options
    are offered here:


    **Writing Mode** This option determines how the laser writes a CD. In DAO (disk
    at once) mode, the laser is not deactivated when the CD is written. This mode
    is recommended for the creation of audio CDs. However, it is not supported by
    all CD writers. In the TA mode (track at one), separate


    210 15.1. Creating a Data CD'
