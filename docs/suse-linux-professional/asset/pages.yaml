  md: '# 4.1 Desktop Components


    The main components are the icons on the desktop and the panel at the bottom of
    the screen. The mouse is your most important tool. Click a symbol or an icon once
    to start the associated program or the file manager Konqueror. If you right-click
    an icon, different menus appear, depending on the program. As well as the icons,
    there are two desktop menus.


    # 4.1.1 The Desktop Menus


    If you middle-click the desktop (if your mouse has only two buttons, press both
    buttons at the same time), a window and desktop management menu is displayed.
    The menu lists the various desktops and the windows opened in them. It also offers
    the following items:


    +   ''Unclutter Windows'' If you have several windows on your desktop, they are
    placed next to each other and aligned with the top left corner.


    +   ''Cascade Windows'' Starting from the top left corner, the windows on the
    desktop are placed on top of each other in such a way that only the top and left
    borders of the lower windows are visible.


    +   ''Desktop x'' Desktop 1 is your default desktop. This part of the menu lists
    all the windows currently opened. You can bring them to the foreground by clicking
    one of the respective items.


    +   ''Additional Desktops You can use the additional (virtual) desktops provided
    and switch to them with the menu or the panel. All functions are available on
    all desktops. This limits the number of programs and associated windows that need
    to be arranged on one desktop. These virtual desktops resemble additional desks
    in your office.


    If you right-click the desktop, a more complex menu is displayed, allowing you
    to customize your desktop.


    +   ''Create New'' Use this menu item to create new directories, files, or devices
    on the desktop. A list of possible elements is provided for selection in a sub-'
  merge: -1
