    # # 12.3 Importing Keys


    If you receive a key in a file (for example, as an e-mail attachment), integrate
    in your key ring with ''Import Key'' and use it for encrypted communication with
    the sender. The procedure is similar to the procedure for exporting keys already
    described.


    # # 12.3.1 Signing Keys


    Keys can be signed like every other file to guarantee their authenticity and integrity.
    If you are absolutely sure an imported key belongs to the individual specified
    as the owner, express your trust in the authenticity of the key with your signature.'
