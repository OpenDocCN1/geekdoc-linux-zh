  md: '# Working with the Shell


    Graphical user interfaces are increasingly becoming important for Linux, but using
    the mouse is not always the best way to perform daily tasks. The command line
    provides high flexibility and efficiency. The first part of this chapter provides
    an introduction to the Bash shell. It is followed by an explanation of the user
    permission concept in Linux and a list of the most important commands. The chapter
    closes with a description of the vi editor.


    +   19.1 Introduction to Bash . . . . . . . . . . . . . . . . . . . . . . . 246

    19.2 Users and Access Permissions . . . . . . . . . . . . . . . 255

    19.3 Important Linux Commands . . . . . . . . . . . . . . . . 260

    19.4 The vi Editor . . . . . . . . . . . . . . . . . . . . . . . . . . 268'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'Text-based applications are especially important for controlling older Linux
    computers that do not have the resources for demanding display systems. Virtual
    consoles are used in this case. Six of them are available in text mode. Press
    (Alt)-(F1) through (Alt)-(F6). The seventh console is reserved for X.


    # 19.1 Introduction to Bash


    In the KDE taskbar, there is an icon depicting a monitor with a seashell. When
    you click this, a console window opens in to enter commands. The console normally
    runs Bash (Bourne again shell), a program developed as part of the GNU project.
    When you have opened the shell, the prompt on the first line. The prompt usually
    consists of the username, hostname, and current path, but it can be customized.
    When the cursor is after this prompt, you can send commands directly to your system.


    # 19.1.1 Commands


    A command consists of several elements. The first element is always the actual
    command, followed by parameters or options. Commands are executed when you press
    (Enter). Before doing so, easily edit the command line, add options, or correct
    typing errors. One of the most frequently used commands is `ls`, which can be
    used with or without arguments. Entering the plain `ls` command in the console
    shows the contents of the current directory.


    Options are prefixed with `ls -l`, for instance, shows the contents of the same
    directory in full detail. Next to each filename, the date when the file was created,
    the file size in bytes, and for further details, which are covered later. One
    very important option that exists for many commands is `--help`, display all the
    options for the `ls` command. Also use the ls command to view the contents of
    other directories. To do so, the directory must be specified as a parameter. For
    example, to see the contents of Desktop, enter `ls -l` Desktop.


    # 19.1.2 Files and Directories


    To use the shell efficiently, it is really useful to have some knowledge of the
    file and directory structures of a Linux system. You can think of directories
    as electronic folders in which files, programs, and subdirectories are stored.
    The top'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# 19


    level directory in the hierarchy is the root directory, referred to as /. This
    is the place from which all other directories can be accessed.

    The /home directory contains the directories in which the individual users can
    store their personal files. Figure 19.1 on this page shows the standard directory
    tree in Linux, with the home directories of the example users xyz, linux, and
    tux. The directory tree of a Linux system has a functional structure that follows
    the Filesystem Hierarchy Standard. The following list provides a brief description
    of the standard directories in Linux.


    # Working with the Shell


    ![](img/0d7086818d63bf06d3da42b908c48b45_266_0.png)


    Figure 19.1: Excerpt from a Standard Directory Tree


    +   / root directory, starting point of the directory tree

    /home (private) directories of users

    /dev device files that represent hardware components

    /etc important files for system configuration

    /etc/init.d boot scripts

    /usr/bin generally accessible programs


    SUSE LINUX 247'
  merge: -1
  pgno: 266
- img_proc: true
  md: '+   /bin programs needed early in the boot process

    /usr/sbin programs reserved for the system administrator

    /sbin programs reserved for the system administrator and needed for booting

    /usr/include header files for the C compiler

    /usr/include/g++ header files for the C++ compiler

    /usr/share/doc various documentation files

    /usr/share/man system manual pages (man pages)

    /usr/src source code of system software

    /usr/src/linux kernel source code

    /tmp, /var/tmp temporary files

    /usr all all application programs

    /var/doc configuration files (such as those linked from /usr)

    /var/log system log files

    /var/adm system administration data

    /lib shared libraries (for dynamically linked programs)

    /proc process file system

    /sys "system" file system where all device information for the kernel is gathered

    /usr/local local, distribution-independent extensions

    /opt optional software, larger add-on program packages (such as KDE, GNOME, Netscape)'
