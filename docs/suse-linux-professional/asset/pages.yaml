  md: 'PostgreSQL is an object-relational database management system that supports
    an extended subset of the SQL standard, including transactions, foreign keys,
    subqueries, triggers, and user-defined types and functions. Find more information
    about PostgreSQL at http://www.postgresql.org/.


    GnuCash GnuCash is a software tool to control your personal and business finances.
    Keep track of income and expenses and manage your bank accounts and stock portfolios
    using all one piece of software. Learn more about GnuCash at http://www.gnucash.org.


    moneyplex moneyplex is a tool to control your finances. All tasks from managing
    incoming resources and expenses and monitoring your portfolio to online transactions
    via the HCIBC standard are handled by moneyplex. Keep track of your financial
    transactions over time using various analysis options. This tool is also available
    for Windows, users can migrate very easily without having to learn a new application
    interface. More information about moneyplex can be found at http://www.matrica.de.


    Planner Planner is a project management tool aiming to provide functionality to
    the project management tools used under Windows. Among its various features are
    Gantt charting abilities, different kinds of views on tasks and resources, and
    much more. Find more information about Planner at http://www.imendo.com/projects/


    Taskjler Taskjler is a lean, but very powerful project management software. Control
    track of your projects using the Gantt charting features by generating all kinds
    of reports (in XML, HTML, or CSV format). Users who are not comfortable with controlling
    applications via the command line can use a graphical front-end to Taskjler. Find
    more information about Taskjler at http://www.taskjler.org.


    VYM (Your Mind) VYM is a software for visualizing your thoughts by creating and
    manipulating mind maps. Most manipulations do not require more than one mouse
    click. Branches can be inserted, deleted, and reordered very easily. VYM offers
    a set of flags allowing you to mark certain parts of the mind map (important,
    time critical, etc.). Links, notes, and images can be added to a mind map as well.
    VYM mind maps use an XML format, allowing you to export your mind maps to HTML
    files. Find more information about VYM at http://www.insilil.de/vym.'
