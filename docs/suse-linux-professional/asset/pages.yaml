- img_proc: true
  md: '''Style'' determines what processing steps should be applied to the selected
    image to adapt it optimally to the current screen resolution. The options are
    ‘Centered’, ‘Fill Screen’, ‘Scaled’, and ‘Tiled’.


    # 3.2.6 Font


    This module determines the font to use for the desktop. In a second step, enable
    optional effects for the improvement of the font quality. The upper part of the
    dialog window shows the fonts selected for ‘Application font’, ‘Desktop font’,
    ‘Window title font’, and ‘Terminal font’. Click one of the buttons to select a
    dialog in which to set the font family, style, and size. The options for ‘Font
    Rendering’ and the additional configuration options accessible through ‘Details’
    are set to optimal values by default.


    # 3.2.7 Theme


    The style for all control elements on the desktop and of GNOME applications is
    set here. Choose from various preinstalled themes. Selecting a style in the list
    overview applies it automatically. ‘Theme Details’ opens another dialog in which
    to customize the style of single desktop elements, like window controls, window
    borders, and icons. Making changes and leaving the dialog with ‘Close’ switches
    the theme to ‘Custom theme’. Click ‘Save theme’ to save your modified theme under
    a custom name. The Internet and other sources provide many additional themes for
    GNOME as .tar.gz files. Install these with ‘Install theme’. New themes can be
    dragged and dropped into the ‘Theme Preferences’ win-dow.


    # 3.2.8 Accessibility


    The settings of this module facilitate the use of the keyboard for users with
    motion impairments. The module consists of the three tabs ‘Basic’, ‘Filters’,
    and ‘Mouse Keys’. Before modifying settings, activate ‘Enable keyboard accessibility
    features’.


    Features The keyboard accessibility functions can be deactivated automatically
    after a certain time. Set an appropriate time limit measured in seconds with the
    slider. The system can additionally provide audio feedback when the keyboard accessibility
    functions are activated and deactivated.'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'Enable Sticky Keys Some keyboard shortcuts require that one key is kept pressed
    constantly (this applies to (Alt), (Ctrl), (Shift)) while the rest of the shortcut
    is typed. When “sticky” keys are used, the system regards them keys as pressed
    after being hit once. For an audible feedback generated each time a modifier key
    (Ctrl) or (Alt) is pressed, activate ‘Beep’ when modifier is pressed’. ‘Disable
    if two keys pressed together’ is selected, the keys do not stick once two keys
    are pressed simultaneously. The system then assumes that the keyboard shortcut
    has been completely entered.


    Enable Repeat Keys Activate ‘Repeat Keys’ to make settings with sliders for ‘Delay’
    and ‘Speed’. This determines how long a key must be pressed for the automatic
    keyboard repeat function to be activated and at what speed the characters are
    then typed.


    Test the effect of the settings in the field at the bottom of the dialog window.
    Choose parameters to reflect your normal typing habits.


    Enable Slow Keys To prevent accidental typing, set a minimum time limit that a
    key must be pressed and held before it is recognized as valid input by the system.
    Also determine whether audible feedback should be provided for keypress events,
    accepted keypresses, and the rejection of a keypress.


    Enable Bounce Keys To prevent double typing, set a minimum time limit for accepting
    two subsequent keypress events of the same key as the input of two individual
    characters. If desired, activate audible feedback upon rejection of a keypress
    event.


    Toggle Keys It is possible to request audible feedback from the system when a
    keycap modifier key is pressed.


    Mouse Activates the keyboard mouse—the mouse pointer is controlled with the arrow
    keys of the number pad. Use sliders to set the maximum speed of the mouse pointer,
    the acceleration time until the maximum speed is reached, and the latency between
    the pressing of a key and the cursor movement.


    # 3.2.9 Keyboard Shortcuts


    Use this module to manage global keyboard combinations. It is possible to determine
    the keyboard combinations to use during text input and for objects on the desktop.'
  merge: -1
  pgno: 74
