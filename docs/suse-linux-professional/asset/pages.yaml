  md: '![](img/0d7086818d63bf06d3da42b908c48b45_131_0.png)


    # Figure 6.1: The OpenOffice.org Writer


    or the relevant buttons in the toolbar to print and save your document. With the
    options under ''Insert'', add extra items to your document, such as a table, picture,
    or chart.


    # 6.2.1 Selecting Text


    To select text, click the desired beginning of the selection, and keeping the
    mouse button pressed, move the cursor towards the end of the range (which can
    be characters, lines, or entire paragraphs). Release the button when all desired
    text is selected. While selected, text is displayed in inverted colors. Open a
    context menu by right-clicking the selection. Use the context menu to change the
    font, the font style, and other text properties.


    Selected text can be cut or copied to the clipboard. Cut or copied text can be
    pasted into the document at another location. Use the context menu, ''Edit'',
    or the relevant toolbar icons to access these functions.


    112 6.2. Word Processing with Writer'
