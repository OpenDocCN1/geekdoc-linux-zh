  md: '# Sound in Linux


    Linux includes a wide range of sound and multimedia applications. Some of these
    applications are part of one of the main desktop environments. With the applications
    described here, control the volume and balance of playback, play CDs and music
    files, and record and compress your own audio data.


    +   13.1 Mixers . . . . . . . . . . . . . . . . . . . . . . . . . . . . 178

    13.2 Multimedia Players . . . . . . . . . . . . . . . . . . . . . . 182

