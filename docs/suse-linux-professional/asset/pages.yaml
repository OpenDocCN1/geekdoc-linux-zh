  md: '# # Manipulating Graphics with The GIMP


    The GIMP (The GNU Image Manipulation Program) is a program for creating and editing
    pixel graphics. In most aspects, its features are comparable to those of Adobe
    Photoshop and other commercial programs. Use it to resize and retouch photographs,
    design graphics for Web pages, make covers for your custom CDs, or almost any
    other graphics project. It meets the needs of both amateurs and professionals.


    +   18.1 Graphics Formats . . . . . . . . . . . . . . . . . . . . . . . . . 236

    18.2 Starting GIMP . . . . . . . . . . . . . . . . . . . . . . . . . 236

    18.3 Getting Started in GIMP . . . . . . . . . . . . . . . . . . 238

    18.4 Saving Images . . . . . . . . . . . . . . . . . . . . . . . . . 240

    18.5 Printing Images . . . . . . . . . . . . . . . . . . . . . . . . . 241

    18.6 For More Information . . . . . . . . . . . . . . . . . . . . . . 241'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'Like many other Linux programs, The GIMP is developed as a cooperative effort
    of developers worldwide who volunteer their time and code to the project. The
    program is under constant development, so the version included in your SUSE LINUX
    may vary slightly from the version discussed here. The layout of the individual
    windows and window sections is especially likely to vary.


    The GIMP is an extremely complex program. Only a small range of features, tools,
    and menu items are discussed in this chapter. See Section 18.6 on page 241 for
    ideas of where to find more information about the program.


    # 18.1 Graphics Formats


    There are two main formats for graphics—pixel and vector. The GIMP works with
    pixel graphics, which is the normal format for photographs and scanned images.
    Pixel graphics consist of small blocks of color that together create the entire
    image. The files can easily become quite large because of this. It is also not
    possible to increase the size of a pixel image without losing quality.

    Unlike pixel graphics, vector graphics do not store information for all individual
    pixels. Instead, they store information about how image points, lines, or areas
    are grouped together. Vector im-ges can also be scaled very easily. The drawing
    application of OpenOffice.org, for example, uses this format.


    # 18.2 Starting GIMP


    Start GIMP from the main menu. Alternatively, enter `gimp` & in a command line.


    # 18.2.1 Initial Configuration


    When starting GIMP for the first time, a configuration wizard opens for preparatory
    configuration. The default settings are acceptable for most purposes. Press ‘Continue’
    in each dialog unless you are familiar with the settings and prefer another setup.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# 18.2.2 The Default Windows


    Three windows appear by default. They can be arranged on the screen and, except
    the toolbox, closed if no longer needed. Closing the toolbox closes the application.
    In the default configuration, GIMP saves your window layout when you exit. Dialogs
    left open reappear when you start the program.


    # The Toolbox


    The main window of GIMP, shown in Figure 18.1 on the current page, contains the
    main controls of the application. Closing it exits the application. At the very
    top, the menu bar offers access to file functions, extensions, and help. Below
    that, find icons for the various tools. Hover the mouse over an icon to display
    information about it.


    ![](img/0d7086818d63bf06d3da42b908c48b45_256_0.png)


    Figure 18.1: The Main Window'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'The current foreground and background color are shown in two overlapping boxes.
    The default colors are black for the foreground and white for the background.
    Click the box to open a color selection dialog. Swap the foreground and background
    color with the bent arrow symbol to the upper right of the boxes. Use the black
    and white symbol to the lower left to reset the colors to the default.


    To the right, the current brush, pattern, and gradient are shown. Click the displayed
    one to access the selection dialog. The lower portion of the window contains allows
    of various options for the current tool.


    # Layers, Channels, Paths, Undo


    In the first section, use the drop-down box to select the image to which the tabs
    refer. By clicking ‘Auto’, control whether the active image is chosen automatically.
    By default, ‘Auto’ is enabled.


    Layers’ shows the different layers in the current images and can be used to manipulate
    the layers. ‘Channels’ shows and can manipulate the color channels of the image.


    Paths are an advanced method of selecting parts of an image. They can also be
    used for drawing, ‘Paths’ shows the paths available for an image and provides
    access to path functions. ‘Undo’ shows a limited history of modifications to the
    current image.


    The bottom portion of the window contains three tabs. With them, select the current
    brush, gradient, and pattern.


    # 18.3 Getting Started in GIMP


    Although GIMP can be a bit overwhelming for new users, most quickly find it easy
    to use once they work out a few basics. Crucial basic functions are creating,
    opening, and saving images.


    # 18.3.1 Creating a New Image


    To create a new image, select ‘File’ → ‘New’ or press Ctrl-N. This opens a dialog
    in which to make settings for the new image. If desired, use ‘Template’ to select
    a template to base the new image. The GIMP includes a number of templates, ranging
    from an A4 sheet of paper to a CD cover, from which to choose.'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'To create a custom template, select ''File'' → ''Dialogs'' → ''Templates''
    and use the controls offered by the window that opens.


    In the ''Image Size'' section, set the size of the image to create in pixels or
    another unit. Click the unit to select another unit from the list of available
    units. The ratio between pixels and a unit is set in ''Resolution'', which appears
    when the ''Advanced'' section is open. A resolution of 72 pixels per inch corresponds
    to screen display. It is sufficient for Web page graphics. A higher resolution
    should be used for images to print. For most printers, a resolution of 300 pixels
    per inch results in an acceptable quality.


    In ''Colorspace'', select whether the image should be in color (''RGB'') or ''Grayscale''.
    Select the ''Fill Type'' for the new image. ''Foreground Color'' and ''Background
    Color'' use the colors selected in the toolbox. ''White'' uses a white background
    in the image. ''Transparent'' creates a clear image. ''Transparency'' is represented
    by a gray checkerboard pattern. Enter a comment for the new image in ''Comment''.


    When the settings meet your needs, press ''OK''. To restore the default settings,
    press ''Reset''. ''Cancel'' aborts creation of a new image.


    # ## 18.3.2 Opening an Existing Image


    To open an existing image, select ''File'' → ''Open'' or press (Ctrl)-O. In the
    dialog that opens, select the desired file. Click ''OK'' to open the selected
    image. Press ''Cancel'' to skip opening an image.


    # ## 18.3.3 The Image Window


    The new or opened image appears in its own window. The menu bar in the top of
    the window provides access to all image functions. Alternatively, access the menu
    by right-clicking the image or clicking the small arrow in the left corner of
    the rulers.


    ''File'' offers the standard file options, such as ''Save'' and ''Print''. ''Close''
    closes the current image. ''Quit'' closes the entire application.


    With the items in the ''View'' menu, control the display of the image and the
    image window. ''New View'' opens a second display window of the current image.
    Changes made in one view are reflected in all views of that image. Alternate views
    are useful for magnifying a part of an image for manipulation while seeing the
    complete image in another view. Adjust the magnification level of the'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'current window with ‘Shrink Wrap’ is selected, the image window is resized
    to fit the current image display exactly.


    # 18.4 Saving Images


    No image function is as important as ‘File’ → ‘Save’. It is better to save too
    often than too rarely. Use ‘File’ → ‘Save as’ to save the image with a new filename.
    It is a good idea to save image stages under different names or make backups in
    another directory so you can easily restore a previous state.


    When saving for the first time or using ‘Save as’, a dialog opens in which to
    identify the filename and type. Enter the filename in the field at the top. For
    ‘Save in folder’, select the directory to save the file from a list of commonly
    used directories. To use a different directory or create a new one, press ‘Browse
    for other folders’. It is recommended to leave ‘Select File Type’ set to ‘By Extension’.
    With that, GIMP determines the file type by the extension applied to the file.
    The following file types are frequently used:


    XCF is the native format of the application. It saves all layer and information
    along with the image itself. Even if you need an image in another format, it is
    usually a good idea to save a copy as XCF to simplify future modifications.


    PAT is the format used for GIMP patterns. Saving in this format enables using
    the image as a fill pattern in GIMP.


    JPG or JPEG is a common format for photographs and Web page without transparency.
    Its compression method enables reduction of file sizes, but information is lost
    when compressing. It may be a good idea to use the preview option when adjusting
    the compression level. Levels of 85% to 75% often result in an acceptable image
    with reasonable compression. Saving a backup in a lossless format, like XCF, is
    also recommended. If editing an image, save only the finished image as JPG. Repeatedly
    loading a JPG then saving can quickly result in poor image quality.


    GIF Although very popular in the past for graphics with transparency, GIF is less
    often used now because of license issues. GIF is also used for animated images.
    The format can only save indexed images. The file size can be quite small if only
    a few colors are used.'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'PNG with its support transparency, lossless compression, free availability,
    and increasing browser support, PNG is replacing GIF as the preferred format for
    Web graphics with transparency. An added advantage is that PNG offers partial
    transparency, which is not offered by GIF. This enables smoother transitions from
    colored areas to transparent areas (antialiasing).


    To save the image in the chosen format, press ‘Save’. To abort, press ‘Cancel’.
    If the image has features that cannot be saved in the chosen format, a dialog
    appears with choices for resolving the situation. Choosing ‘Export’, if offered,
    normally gives the desired results. A window then opens with the options of the
    format. Reasonable default values are provided.


    # 18.5 Printing Images


    To print an image, select ‘File’ → ‘Print’ from the image menu. If your printer
    is configured in SUSE, it should appear in the list. In some cases, it may be
    necessary to select an appropriate driver with ‘Setup Printer’. Select the appropriate
    size with ‘Media Size’ and the type in ‘Media Type’. Other settings are available
    in the ‘Image / Output Settings’ tab.


    In the bottom portion of the window, adjust the image size. Press ‘Use Original
    Image Size’ to take these settings from the image itself. This is recommended
    if you set an appropriate print size and resolution in the image. Adjust the image’s
    position on the page with the fields in ‘Position’ or by dragging the image in
    ‘Pre-view’.


    When satisfied with the settings, press ‘Print’. To save the settings for future
    use, use ‘Print and Save Settings’. ‘Cancel’ aborts printing.


    # 18.6 For More Information


    The following are some resources that may be useful for a GIMP user. Unfortunately,
    many resources apply to older versions.


    +   * ‘Help’ provides access to the internal help system. This documentation is
    also available in HTML and PDF formats at http://docs.gimp.org.


    +   * The GIMP User Group offers an informative and interesting Web site at http://gug.sunsite.dk.'
  merge: -1
