    # unix domain sockets


    unix domain sockets are files.


    ```

    $ file mysock.sock socket

    ```


    the file''s permissions determine who can send data to the socket.


    they let 2 programs on the same computer communicate.


    Docker uses Unix domain sockets, for example!


    ```

    GET /container HTTP request

    ```


    Here you go!


    ![](img/7fb494784d11059c33eeec0b7adb1608_11_0.png)


    There are 2 kinds of unix domain sockets:


    +   stream like TCP! Lets you send a continuous stream of bytes.


    +   datagram like UDP! Lets you send discrete chunks of data


    # advantage 1


    Lets you use file permissions to restrict access to HTTP/ database services! chmod
    600 secret.sock


    This is why Docker uses a unix domain socket.


    # advantage 2


    UDP sockets aren''t always reliable (even on the same computer). unix domain datagram
    sockets are reliable! And they won''t reorder packets!


    ```

    I can send data and I it''ll arrive

    ```


    # advantage 3


    You can send a file descriptor over a unix domain socket. Useful when handling
    untrusted input files!


    ```

