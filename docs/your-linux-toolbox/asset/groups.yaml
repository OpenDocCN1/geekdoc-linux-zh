    \ HTTP request\n```\n\nHere you go!\n\n![](img/7fb494784d11059c33eeec0b7adb1608_11_0.png)\n\
    \nThere are 2 kinds of unix domain sockets:\n\n-   stream like TCP! Lets you send\
    \ a continuous stream of bytes.\n\n-   datagram like UDP! Lets you send discrete\
    \ chunks of data\n\n# advantage 1\n\nLets you use file permissions to restrict\
    \ access to HTTP/ database services! chmod 600 secret.sock\n\nThis is why Docker\
    \ uses a unix domain socket.\n\n# advantage 2\n\nUDP sockets aren't always reliable\
    \ (even on the same computer). unix domain datagram sockets are reliable! And\
