- md: "\n# SPYING ON YOUR PROGRAMS WITH STRACE\n## BY JULIA EVANS\n\n## Who makes\
    \ this?\n\nHi! I'm Julia! I look a little like this:\n\n![](img/7fb494784d11059c33eeec0b7adb1608_126_0.png)\n\
    \nAbout 5 years ago, I learned that there was a program called strace that let\
    \ you spy on what your programs were doing.\n\n![](img/7fb494784d11059c33eeec0b7adb1608_126_1.png)\n\
    \nstrace introduced me to a whole world of awesome Linux debugging tools that\
    \ let you spy on your network / your programs, and it really changed the way I\
    \ think about debugging and computers.\n\n![](img/7fb494784d11059c33eeec0b7adb1608_126_2.png)\n\
    \n![](img/7fb494784d11059c33eeec0b7adb1608_126_3.png)\n\n## ♡ a tiny manifesto\
    \ ♡\n\noperating systems are\n\n![](img/7fb494784d11059c33eeec0b7adb1608_127_0.png)\n\
    \nthe strace zine thinks:\n\n- ♡your computer is yours\n- ♡your OS is yours\n\
    - ♡open licenses mean you can READ AND CHANGE THE CODE!!\n- ♡Linux is REALLY COOL\n\
    \n→→→→→→→→→→→→→→→→→→→→→yaaaaaay→→→→→→→→→→→→→\nLET’S GO LEARN\n→→→→→→→→→→→→→→→→→→→→→it’s\
    \ really fun→→→→→→→→→\n\n## what is this strace thing?\n\npronounced \"ess-strace\"\
    \ is a program on Linux that lets you inspect what a program is doing without:\n\
    \n> on OSX you can use dtrace/dtruss\n\n- a debugger\n- or the source code\n-\
    \ or even knowing the programming language at all (?!?!?? how can it be?)\n\n\
    Basically strace makes you a wizard\n\n> strace! what config file does bash open\
    \ when it starts? thank you!\n\n.bashrc! strace\n\nTo understand how this works,\
    \ let's talk a little about operating systems!\n\n## Why you should ♡ your operating\
    \ system\n\nSome things it does for you:\n\n- understands how your hard drive\
    \ works and how the file system on it organizes the bytes into files so you can\
    \ just read the file\n- runs code every time you press a key so that you can type\n\
    - implements networking protocols like TCP/IP so that you can get webpages, pictures\
    \ of cats from the internet\n- keeps track of all the memory every process is\
    \ using\n- basically knows everything about how all your hardware works so you\
    \ can just write programs♡\n\n![](img/7fb494784d11059c33eeec0b7adb1608_129_0.png)\n\
    \n![](img/7fb494784d11059c33eeec0b7adb1608_130_0.png)\n\n![](img/7fb494784d11059c33eeec0b7adb1608_130_1.png)\n\
    \nSystem calls are the API for your operating system:\n\n- want to open a file?\
    \ use open and then read and write to it\n- sending data over a network? Use connect\
    \ to open a connection and send and recv pictures of cats.\n\nreally, all of them!\
    \ Every program on your computer is using system calls all the time to manage\
    \ memory, write files, do networking, and lots more.\n\n## a first cup of strace\n\
    \nYou might think with all the talk of operating systems and system calls that\
    \ using strace is hard.\n\nGetting started is easy! If you have a Linux machine,\
    \ I want you to try it RIGHT NOW.\n\n![](img/7fb494784d11059c33eeec0b7adb1608_131_0.png)\n\
    \nThere's a LOT of output and it's pretty confusing at first. I've annotated some\
    \ for you on the next page. \U0001F918\n\n> try stracing more programs! Google\
    \ the system calls! Don't worry if you don't understand everything! I sure don't.\n\
    \n## annotated strace\n\nWhen you run strace, you'll see thousands of lines of\
    \ output like this:\n\n```\n$ strace ls /home/bork/blah\nexecve(\"/bin/ls\", \"\
    ls\", \"/home/bork/blah\", [/* 62 vars */]) = 0\nbrk(NULL) = 0xb67000\nopen(\"\
    /etc/ld.so.cache\", O_RDONLY|O_CLOEXEC) = 3\nopen(\"/proc/filesystems\", O_RDONLY)\
    \ = 3\n    omitted\nopen(\"/home/bork/blah\", O_RDONLY|O_NONBLOCK|O_DIRECTORY)\
    \ = 3\nfstat(3, {st_mode=S_IFDIR|07755, st_size=168, ...}) = 0\ntdents(3, /* 3\
    \ entries */, 32768) = 80\ntdents(3, /* 0 entries */, 32768) = 0\nclose(3) = 0\n\
    fstat(1, {st_mode=S_IFCHR|0620, st_rdev=136, 5, ...}) = 0\nwrite(1, \"awesome_file\\\
    n\", 13) = 13\nclose(1) = 0\nclose(2) = 0\nexit_group(0) = ?\n```\n\nStudies show\
    \ this is not self-explanatory (me asking my friends if it makes sense and NOPE\
    \ NOPE)\n\nlet's learn how to interpret strace output:\n\n```\n11999 execve(\"\
    /bin/ls\", \"ls\", \"/home/bork/blah\") = 0\n```\n\n- ① The process ID (included\
    \ when you run strace -f)\n- ② The name of the system call (execve starts programs)\n\
    - ③ The system call's arguments, in this case a program to start and the arguments\
    \ to start it with\n- ④ The return value\n\n## Here's an example of how to interpret\
    \ an open system call (opening a file!) in a little more depth:\n\n| system name\
    \ | file to open | open with read/write permissions | file descriptor |\n| :---\
    \ | :--- | :--- | :--- |\n| open | \"awesome.txt\" | O_RDWR | 3 |\n\nThe 3 here\
    \ is a file descriptor number. Internally, Linux tracks open files with numbers!\
    \ You can see all the file descriptors for process 42 and what they point to by\
