    \ protocol\n\nYour network card understands it.\n\n| destination MAC | source\
    \ MAC addr | type |\n|---|---|---|\n| | 4 bytes | |\n\n| ver | hlen | TOS | packet\
    \ length |\n|---|---|---|---|\n| identification | flg | fragment offset |\n\n\
    | TTL | protocol | header checksum |\n|---|---|---|\n| Source IP address | Destination\
