  - '[PAGE 129]


    # # Why you should ♡ your operating system


    Some things it does for you:


    +   - understands how your hard drive works and how the file system on it organizes
    the bytes into files so you can just read the file


    +   - runs code everytime you press a key so that you can type


    +   - implements networking protocols like TCP/IP so that you can get webpages
    pictures of cats from the internet


    +   - keeps track of all the the memory every process is using


    +   - basically knows everything about how all your hardware works so you can
    just write programs♡


    ![](img/7fb494784d11059c33eeec0b7adb1608_129_0.png)'
  - '[PAGE 130]


    ![](img/7fb494784d11059c33eeec0b7adb1608_130_0.png)


    ![](img/7fb494784d11059c33eeec0b7adb1608_130_1.png)


    System calls are the API for your operating system:


    +   - want to open a file? use open and then read and write to it


    +   - sending data over a network? Use connect to open a connection and send and
    recv pictures of cats.


    really, all of them! Every program on your computer is using system calls all
    the time to manage memory, write files, do networking, and lots more.'
