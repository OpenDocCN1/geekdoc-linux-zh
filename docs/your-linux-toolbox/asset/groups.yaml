  - '[PAGE 76]


    # # Notation time !


    10.0.0/8  132.5.23.0/24


    People often describe groups of IP addresses using CIDR notation.


    ![](img/7fb494784d11059c33eeec0b7adb1608_76_0.png)


    ![](img/7fb494784d11059c33eeec0b7adb1608_76_1.png)


    CIDR range of IPs 10.0.0/8 10.*.\* 10.0.0/8 and 192.168.0/16

    10.9.0/16 10.9.\* and 172.16.0/12 are reserved

    10.9.0/24 10.9.8.* for local networking.


    In CIDR notation, a /n gives you $2^{32-n}$ IP addresses. So a /24 is $2^{8} =
    256$ IPs.


    It''s important to represent groups of IP addresses efficiently because routers
    have LOTS TO DO.


    ![](img/7fb494784d11059c33eeec0b7adb1608_76_2.png)


    The IP address 10.9.0.0 is in binary:

    00001010 00001001 00000000


    first 24 bits


    10.9.0.0/24 is all the IP addresses which have the same first 24 bits as 10.9.0.0!'
