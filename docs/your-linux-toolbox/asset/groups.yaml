  - '[PAGE 20]


    # page faults


    every Linux process has a page table


    * page table *


    | virtual memory address | physical memory address |

    | --- | --- |

    | Ox 19723000 | Ox 1422000 |

    | Ox 19724000 | Ox 1423000 |

    | Ox 11524000 | not in memory |

    | Ox 1844000 | Ox 4a4000 read only |


    some pages are marked as either


    +   * read only

    * not resident in memory


    when you try to access a page that''s marked "not resident in memory", it triggers
    a page fault!


    what happens during a page fault?

    -> the MMU sends an interrupt

    -> your program stops running

    -> Linux Kernel code to handle the page fault runs


    > I''ll fix the problem and let your program keep running


    "not resident in memory" usually means the data is on disk!


    # how swap works


    +   ① run out of RAM


    +   ④ When a program tries to access the memory, there''s a page fault!


    +   ② Linux saves some RAM data to disk


    +   ⑤ time to move some data back to RAM!


    +   ③ mark those pages "not resident in memory" in the page table


    +   ⑥ if this happens alot, your program gets VERY SLOW


    virtual memory


    ![](img/7fb494784d11059c33eeec0b7adb1608_20_0.png)


    in RAM on disk


    Having some virtual memory that is actually on disk is how swap and mmap work.


    > I''m always waiting for data to be moved out of RAM'
  - '[PAGE 21]


    # mmap


    21


    What''s mmap for?


    I want to work with a VERY LARGE FILE but it won''t fit in memory


    ![](img/7fb494784d11059c33eeec0b7adb1608_21_0.png)


    you could try mmap! (mmap = "memory map")


    ![](img/7fb494784d11059c33eeec0b7adb1608_21_1.png)


    load files lazily with mmap


    When you mmap a file, it gets mapped into your program''s memory.


    ![](img/7fb494784d11059c33eeec0b7adb1608_21_2.png)


    but nothing is ACTALLY read into RAM until you access the memory. (how it works:
    page faults!)


    how to mmap in Python


    ```

    import mmap

    f = open("HUGE.txt", "r")

    m = mmap.mmap(f.fileno(), 0)

    ```


    this won''t read the file from disk! Finishes ~instantly. this will read only
    the last 1000 bytes.


    sharing big files with mmap


    we all want to read the same file! no problem mmap


    ![](img/7fb494784d11059c33eeec0b7adb1608_21_3.png)


    Even if 10 processes mmap a file, it will only read into memory once


    dynamic linking uses mmap


    I need to use libc.so (standard library)


    ![](img/7fb494784d11059c33eeec0b7adb1608_21_4.png)


    You too eh? no problem. I always mmap, so that file is probably loaded into memory
    already.


    ![](img/7fb494784d11059c33eeec0b7adb1608_21_5.png)


    anonymous memory maps


    - not from a file (memory set to ∅ by default)


    - with MAP_SHARED, you can use them to share memory with a subprocess!'
