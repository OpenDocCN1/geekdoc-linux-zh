    | m | a | n | g | | |

    | o | t | e | a | | |


    UDP 头部

    （如果是 TCP 数据包这里应该是 TCP 头部）

    数据包的“内容”放在这里。ASCII 字符为 1 字节，所以 "mangotea" = 8 字节 64 位


