    ## A small tool handbook for anyone who writes (or runs!) programs on Linux computers.


    by Julia Evans


    ## what''s this?


    Hi! This is me:


    JULIA EVANS

    blog: jns.ca

    twitter: @bork


    and in this zine I want to tell you about:


    These are 5 ways I''ve changed how I think about debugging:


    - Remember the bug is happening for a logical reason. It''s never magic. Really.
    Even when it makes no sense.

    - I''m confident I can fix it. before: maybe this is too hard. now: (Well, I''ve
    fixed a lot of hard bugs before!)

    - Talk to my coworkers.


    ## Know my debugging toolkit.


    before: I want to know something BUT I don''t know how to find out. now: I KNOW!
    I''ll use tcpdump!


    ## most importantly: I learned to like it!


    before: oh no a bug now: I think I''m about to learn something! facial expression:
    determination.


    > what you''ll learn


    I can''t teach you everything in 20 pages (though I''ll try anyway!) I can show
    you some of my debugging toolkit though!


    These are the tools I reach for when I have a question about a program I want
    to know the answer to. By the end of this zine, I hope to have given you a few
    new-tools to use!


    ## section 1: I/O and system calls


    In this zine, there are 3 sections of tools that I love.


    For each tool, I’ll tell you why it''s useful and give an example. Each one is
    either:


    ![](img/7fb494784d11059c33eeec0b7adb1608_40_0.png)


    Some of the most basic questions you might have when you log into a misbehaving
    machine are:


    - is this machine writing to disk?

    - are programs reading?


    I love dstat because it''s simple. It prints out how many bytes were written.


    ```bash

    $ dstat

    ```


    | recv | during |

    |---|---|

    | 0 | normal |

    | 3k | |

    | 5k | |

    | 300 MB | GET |

    | 48 MB | |

    | 0 | |


    strace is my favorite program. It prints every system call your used.


    You might think... strace can do this too! Just use $ strace -e open -p and you
    would be right. But strace can make your program run 50x slower. opensnoop won''t
    slow you down.


    ## strace


    strace is my favorite program. It prints every system call your used.


    You might think... strace can do this too! Just use $ strace -e open -p and you
    would be right. But strace can make your program run 50x slower. opensnoop won''t
    slow you down.


    ## opensnoop!


    opensnoop is a script that uses a new kernel feature called eBPF. eBPF is fast!


    github.com/iovisor/bcc


    There''s also an opensnoop on OSX & BSD!

    That one is powered by dtrace.

