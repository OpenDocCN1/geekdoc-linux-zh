    # # SSL/TLS


    (TLS: newer version of SSL)


    When you send a packet on the internet, LOTS of people can potentially read it.


    ![](img/7fb494784d11059c33eeec0b7adb1608_77_0.png)


    SSL encrypts your packets: new packet


    ![](img/7fb494784d11059c33eeec0b7adb1608_77_1.png)


    here is my secret lemon pie recipe


    ![](img/7fb494784d11059c33eeec0b7adb1608_77_2.png)


    What happens when you go to https://jvns.ca:


    ![](img/7fb494784d11059c33eeec0b7adb1608_77_3.png)


    Once the client and server agree on a key for the session, they can encrypt all
    the communication they want.


    To see the certificate for jvns.ca, run:


    ```

    $ openssl s_client -connect jvns.ca:443 -servername jvns.ca

    ```


    TLS is really complicated. You can use a tool like SSL Labs to check the security
    of your site.'
  - '[PAGE 78]


    # wireshark


    Wireshark is an amazing tool for packet analysis.

    Here''s an exercise to learn it! Run this:


    ```

    $ sudo tcpdump port 80 -w http.pcap

    ```


    While that''s running, open metafilter.com in your browser.

    Then press Ctrl+C to stop tcpdump. Now we have a pcap!

    Open http.pcap with Wireshark.

    Some questions you can try to answer:


    +   - What HTTP headers did your browser sent to metafilter.com?

    (hint: search frame contains "GET")


    +   - How many packets were exchanged with metafilter.com''s server?

    (hint: search ip_dst == 54.1.2.3) ping metafilter.com here


    Wireshark makes it easy to look at:


    +   * IP addresses and ports

    * SYNS and ACKs for TCP traffic

    * exactly what''s happening with DNS requests

    * and so much more! It''s a great way to poke around and learn.'
