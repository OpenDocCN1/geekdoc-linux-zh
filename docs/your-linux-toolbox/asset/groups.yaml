    \ to send the packet next\n\n| source port | destination port |\n|---|---|\n|\
    \ length | UDP checksum |\n\nLayer 4: TCP or UDP\nWhere you get your ports!\n\n\
    | G | E | T |\n|---|---|---|\n| | | H |\n\nLayer 5+6: don't really exist\n(though\
