    # # TCP: how to reliably get a cat


    Step 3 in our plan is "open a TCP connection!"

    Let''s learn what this "TCP" thing is 🐱


    ![](img/7fb494784d11059c33eeec0b7adb1608_66_0.png)


    how does TCP work, you ask? WELL!


    ![](img/7fb494784d11059c33eeec0b7adb1608_66_1.png)'
  - '[PAGE 67]


    # The TCP handshake


    This is what a TCP header looks like:


    the "sequence number" lets you assemble packets in the right order


    | Source Port | Destination Port |

    |---|---|

    | Sequence Number |

    | Acknowledgement Number |

    | Data Offset | Reserved | ACK | SYN | Window |

    | Checksum | Urgent Pointer |

    | Options | Padding |


    Every TCP connection starts with a "handshake". This makes sure both sides of
    the connection can communicate with each other.


    ![](img/7fb494784d11059c33eeec0b7adb1608_67_0.png)


    But what do "SYN" and "ACK" mean? Well! TCP headers have 6 bit flags (SYN, ACK,
    RST, FIN, PSH, URG) that you can set (you can see them in the diagram). A SYN
    packet is a packet with the SYN flag set to 1.


    When you see "connection refused" or "connection timeout" errors, that means the
    TCP handshake didn''t finish! Here''s what a TCP handshake looks like in tcpdump:


    ```

    $ sudo tcpdump host jvns.ca

    localhost:51104 > 104.28.6.94:80 flags [S] TCP

    104.28.6.94:80 > localhost:51104 flags [S.] handshake!

    localhost:51104 > 104.28.6.94:80 flags [.]

    jvns.ca IP address

    ```


    S is for SYN

    is is for ACK'
  - '[PAGE 68]


    # HTTP


    Step 4: Finally we can request cat.png!

    Every time you get a webpage or see an image online, you''re using HTTP.


    HTTP is a pretty simple plaintext protocol. In fact, it''s so simple that you
    can make an HTTP request by hand right now. Let''s do it!!!


    ```

    $ printf "GET / HTTP/1.1\r\nHost: example.com\r\n\r\n"

    nc example.com 80

    ```


    the nc command ("netcat") sets up a TCP connection to example.com and sends the
    HTTP request you wrote!

    The response we get back looks like:


    ```

    200 OK

    Content-Length: 120321

    ... headers ...


    <html>

    <body>

    .... more HTML

    ```


    ![](img/7fb494784d11059c33eeec0b7adb1608_68_0.png)


    HTTP/2 is the next version of HTTP. Some big differences are that it''s a binary
    protocol, you can make multiple requests at the same time, and you have to use
    TLS.'
