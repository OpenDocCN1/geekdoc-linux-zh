  - "[PAGE 91]\n\n# # Why are there kernel functions in my stack trace?\n\nSometimes\
    \ you'll get a stack trace from perf, and it'll mix functions from your program\
    \ (like __getd64) and functions from the kernel (like btrfs_real_readdr). This\
    \ is normal!\n\nExample:\n\n```\n27968 79997.204322: 707897 cycles:pp:\n\ffff0c34aec7\
    \ read_extent_buffer ([kernel.kallsyms])\n\ffff0c32ae4f btrfs_real_readdr ([kernel.kallsyms])\n\
    \ffff8129eb8 iterate_dir ([kernel.kallsyms])\n\ffff8122a39 sys_getdents ([kernel.kallsyms])\n\
    \ffff8185fc8 entry_SYSCALL_64_fastpath ([kernel.kallsyms])\nc88eb__getdents64\
    \ (/lib/x86_64-linux-gnu/libc-2.23.so)\n```\n\nIt usually means your program did\
    \ a system call or there was a page fault, and it's telling you exactly which\
    \ kernel functions were called as a result of that syscall.\n\nFor example, because\
    \ I'm using the btrfs filesystem, in this case the gets calls btrsf_real_readdr\
    \ function. Neat!\n\n> Oh, the kernel isn't magic. it kinda makes sense!"
- md: '

    # ★ perf cheat sheet


    important command line arguments:

    ❤ what data to get ❤

    ❤ what program(s) to look at ❤

    - -F: pick sample frequency -a: entire system

    - -g: record stack traces -p: specify a PID

    - -e: choose events COMMAND: run this


    ## perf top: get updates live! ★


    - - Sample CPUs at 49 Hertz, show top symbols:

    perf top -f 49


    - - Sample CPUs, show process names and segments:

    perf top -ns comm,dso


    - - Count system calls by process, refreshing every 1 second:

    perf top -e raw_syscalls:sys_enter-* -ns comm -d1


    - - Count sent network packets by process, rolling output:

    perf -oL -e net:net_dev_xmit -ns comm | strings


    ## perf stat: count events! CPU counters! ★


    - - CPU counter statistics for COMMAND:

    perf stat COMMAND


    - - *Detailed* CPU counter statistics for COMMAND:

    perf stat -ddd command


    - - Count system calls for PID, until Ctrl-C:

    perf stat -e ''syscalls:sys_enter-*'' -p PID


    - - Count block device I/O events for the entire system, for 10 seconds:

    perf stat -e ''block:*'' -a sleep 10


    ## Reporting ★


    - - Show perf.data in an ncurses browser:

    perf report


    - - Show perf.data as a text report:

    perf report --stdio


    - - List all events from perf.data:

    perf script


    - - Annotate assembly instructions from perf.data with percentages

    perf annotate --stdio


    sourced from breandingregg.com/perf.html, which has many more great examples


    ## perf trace: trace system calls & other events


    - - Trace syscalls system wide

    perf trace

    - - Trace syscalls for PID

    perf trace -p PID


    ## perf record: record profiling data


    - - Sample CPU functions for COMMAND at 99 Hertz;

    perf record -f 99 COMMAND records into perf.data file

    - - Sample CPU functions for PID, until Ctrl-C:

    perf record -p PID


    - - Sample CPU functions for PID, for 10 seconds:

    perf record -p PID sleep 10


    - - Sample CPU traces for PID, for 10 seconds:

    perf record -p PID -g -- sleep 10


    - - Sample CPU traces for PID, using DWARF to unwind stack:

    perf record -p PID --call-graph dwarf


    ## perf record: record tracing data


    - - Trace new processes, until Ctrl-C:

    perf record -e sched:sched_process_exec -a records into perf.data file


    - - Trace all context switches, until Ctrl-C:

    perf record -e context-switches -a


    - - Trace all context switches with stack traces, for 10 seconds:

    perf record -e context-switches -ag -- sleep 10


    - - Trace all page faults with stack traces, until Ctrl-C:

    perf record -e page-faults -ag


    ## adding new trace events


    - - Add a tracepoint for kernel function tcp_send_msg():

    perf probe ''tcp_send_msg''


    - - Trace previously created probe:

    perf record -e probe:tcp_send_msg -a


    - - Add a tracepoint for myfunc() and include the retval as a string:

    perf probe ''myfunc$return+$(retval):string''


    - - Trace previous probe when size > 0:

    perf record -e probe:tcp_send_msg --filter ''size > 0'' -a


    - - Add a tracepoint for os_sys_open() with the filename as a string:

    perf probe ''do_sys_open filename:string''


    ## perf stat: CPU counters


    If you''re writing high-performance programs, there are a lot of CPU/hardware-level
    events you might be interested in counting:


    ![](img/7fb494784d11059c33eeec0b7adb1608_94_0.png)


    You might wonder:


    ![](img/7fb494784d11059c33eeec0b7adb1608_94_1.png)


    Basically, Linux can ask your CPU to start recording various statistics:


    ![](img/7fb494784d11059c33eeec0b7adb1608_94_2.png)


    As an example, here''s part of the output of perf stat -ddd 1 is for detailed


    ```

    $ perf stat -ddd 1 ls -R /

    Performance counter stats for ''ls -R /'':

    3849.615096 task-lock (msec) * 0.535 CPUs utilized

    26,120 context-switches * 0.007 M/sec

    7,942 page-faults * 0.089 K/sec

    10 8,583,744,395 cycles * 2.230 GHz

    10,337,612,995 instructions * 1.20 insns per cycle

    1,987,339,660 branches * 516.244 M/sec

    happen 20,738,887 branch-misses * 1.04% of all branches

    fast 2,883,947,626 dTLB-misses * 749.152 M/sec

    branch prediction stats

    7.19255725 seconds time elapsed

    ```


    ## perf stat : count any event


    You can actually count lots of different events with perf stat — the same events
    you can record with perf record!


    Here are a couple of examples of using perf stat ls -R (which lists files recursively,
    so it makes lots of system calls):


    - ① count context switches between the kernel and userspace!


    - ② count system calls


    ```

    $ sudo perf stat -e ''syscalls:sys_enter-*'' ls -R / /dev/null

    count system call

    8,028 syscalls:sys_enter_newstat

    15,167 syscalls:sys_enter_write

    254,755 syscalls:sys_enter_close

    254,777 syscalls:sys_enter_open

    509,496 syscalls:sys_enter_newstat

    509,598 syscalls:sys_enter_getdents

    ```


    perf stat does introduce some overhead. Counting "every" system call for find
    make the program run up to 6 times slower in my brief experiments.


    I think as long as you only count a few different events (like just the syscalls:sys_enter_open
    event) it should be fine. I don''t 100% understand why there''s so much here though.


    ## perf trace


    strace is an awesome Linux debugging tool that traces system calls. It has one
    problem though:


    ![](img/7fb494784d11059c33eeec0b7adb1608_96_0.png)


    perf trace traces system calls, but with way less overhead. It''s safe to run
    in production, unlike strace.


    There are 2 disadvantages (as of Linux 4.4):


    - - sometimes it drops system calls (this is sort of an advantage since it limits
    overhead)


    - - it won''t show you the strings that are being read/written.


    Here''s a comparison of both strace and perf trace output, on the same program:


    ![](img/7fb494784d11059c33eeec0b7adb1608_96_1.png)


    ```

    brk(brk: 0x2397000) write(fd: 2, buf: 0x28) read(buf: 0x7fd77b0a8, 1) ioctl(cmd:
    TCGETS, arg:) ioctl(cmd: TCSETSW, arg:)

    brk(brk: 0x2397000) write(2, "bork@kiwi-", 13) read(0, "#4", 1) ioctl(0, TCGETS,
    arg: 0x7fd77b0a) ioctl(0, SNDCTL_TMR_STOP OR TCSETSW)

    ```


    These have the same system call, but only strace actually shows you what string
    was written. Recently I used perf trace, and it told me that 200,000


    ## how perf works: overview


    Now that we know how to use, let''s see how it works

    The perf system is split into 2 parts:


    - a program in userspace

    - a system in kernel


    When you run perf record, perf stat, or top

    - - perf asks the kernel to collect samples

    - - perf displays the data back to you


    ![](img/7fb494784d11059c33eeec0b7adb1608_97_0)


    ## kernel versions


    perf works really closely with the Linux Kernel. This means a couple of things:


    - - You need to install a version of perf that exactly matches your Kernel. On
    Ubuntu, you can do that with:

    sudo apt-get install linux-tools-$(uname -r)


    - - perf''s features (and sometimes command-line options) change between kernel
    versions.


    The first version of perf was in Linux 2.6.


    This also means that there''s a perf documentation in the Linux git repository.
    You can see it on github:


    ```

    github.com/torvalds/linux/tree/master/tools/perf/Documentation

    ```


    Some of the cool things in there:

    perf.data file spec

    how to use perf''s built-in Python interpreter

    write scripts

    all the man pages for each subcommand


    ## how profiling with perf


    The Linux Kernel has a built-in sampling profiler.


    ![](img/7fb494784d11059c33eeec0b7adb1608_99_0)


    How does Linux Know which functions your program is running though? Well, the
    Linux Kernel is in charge of scheduling.


    That means that at all times it has a list of every process and the address of
    the CPU instruction that process is currently running. That address is called
    the instruction pointer.


    Here''s what the information the Linux Kernel has:


    | command | PID | thread ID | instruction pointer |

    |---|---|---|---|

    | nodejs | 2379 | 2379 | 0x0000759d20 |

    | bash | 1229 | 1229 | 0x00123456 |

    | use_cpu | 4991 | 4991 | 0xabababab |

    | use_cpu | 4991 | 4992 | 0xababdddd |


    Sometimes perf can''t figure out how to turn an instruction pointer address into
    a function name. Here''s an example of what that looks like:


    ```

    self command shared object symbol

    0.00% nodejs [.] 0x0000759d20

    0.00% V8 WorkerThread [kernel.kallsyms] [k] hrtimer_active

    ```

