  - '[PAGE 118]


    # learning to design software


    It''s surprisingly easy to end up in this situation:


    ![](img/7fb494784d11059c33eeec0b7adb1608_118_0.png)


    A little bit of planning helps me make sure hard work doesn''t go to waste.


    Here are a few things I find helpful to remember:


    +   - you can''t predict how requirements will change let''s reprocess every record
    every day ...2 years later... ok, doing that is way too expensive now


    I just try my best and deal with changes when they come.


    +   - "good enough" is often really awesome this is a bit sketchy but it should
    work ...2 years later... wow it''s still working with... no problems


    +   - making a proof of concept can really help. I bet we can make this 100x faster
    show me a prototype and I''ll believe it coming right up!'
