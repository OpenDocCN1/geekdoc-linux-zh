  - '[PAGE 100]


    # which programming languages can perf profile?


    The way perf usually figures out what function your programs are running is:


    +   - get the program''s instruction pointer address

    - get a copy of the program''s stack

    - unwind the stack to find the address of the current function call

    - use the program''s symbol table to figure out the name of the symbol that address
    corresponds to!


    The important thing to understand is that perf will by default give you a symbol
    from the program symbol table. That means perf won''t give you function names
    for binaries where the symbols are stripped.

    Here''s how perf can help you, broken down by programming language:


    ![](img/7fb494784d11059c33eeec0b7adb1608_100_0.png)


    ![](img/7fb494784d11059c33eeec0b7adb1608_100_1.png)


    ![](img/7fb494784d11059c33eeec0b7adb1608_100_2.png)


    ![](img/7fb494784d11059c33eeec0b7adb1608_100_3.png)'
  - '[PAGE 101]


    # perf: under the hood


    It''s often useful to have a basic understanding of how our tools are implemented.
    So let''s look at the interface userspace tool (perf) uses to talk to the Linux
    Kernel. Here''s what happens, basically:


    +   - perf calls the perf_event_open system call

    - the kernel writes events to a ring buffer in userspace

    - perf reads events off that ring buffer and displays them to you somehow


    What''s a ring buffer?


    Basically, it''s important to use a limited amount of memory for profiling events.
    So the kernel allocates a fixed amount of money:


    ![](img/7fb494784d11059c33eeec0b7adb1608_101_0.png)


    each of these is space for 1 record and when that memory gets full because new
    records are being written faster than perf can read them...


    > whoops! we''re out of space, guess I can''t write more events!


    Linux so if you see warnings from perf about events being dropped, that''s what
    happening.'
  - "[PAGE 102]\n\n# the perf_event_open system call\n\nThis system call is how perf\
    \ asks the Linux Kernel to start sampling or tracing.\n\nHere's the system call's\
    \ signature, from man perf_event_open:\n\n```\nint perf_event_open(struct perf_event_attr\
    \ *attr,\n               pid_t pid, int cpu, int group_fd,\n               unsigned\
    \ long flags);\n```\n\nPID& CPU to look at. Can be \"all of them\". this is where\
    \ most of the arguments are.\n\nI don't find this page all useful for day-to-day\
    \ perf usage. But did you know the perf CLI tool isn't the only program that uses\
    \ the perf_event_open syscall?\n\nThe bcc project is a toolkit for writing advanced\
    \ profiling tools using eBPF. github.com/iovisor/bcc\n\nWith bcc, you can relatively\
    \ easily use perf_event_open to create your own profiling/tracing events! And\
    \ then you can write code to aggregate/display them any way you want.\n\nSearch\
    \ for BCC_PERF_OUTPUT in the bcc docs to learn more."
