    # sockets


    networking protocols are complicated


    Unix systems have an API called the "socket API" that makes it easier to make
    network connections


    here''s what getting a cat picture with the socket API looks like:


    ![](img/7fb494784d11059c33eeec0b7adb1608_10_0.png)


    +   - Create a socket

    - fd=socket(AF_INET,SOCK_STREAM...

    - Connect to an IP/port connect(fd, 12.13.14.15:80)

    - Make a request write(fd, "GET /cat.png HTTP/1.1 ...")

    - Read the response cat-picture=read(fd ...)


    ![](img/7fb494784d11059c33eeec0b7adb1608_10_1.png)


    Every HTTP library uses sockets under the hood $ curl awesome.com Python: requests.get("yay.us")


    # AF_INET? What''s that?


    # 3 kinds of internet (AF_INET) sockets:


    AF_INET means basically "internet socket": it lets you connect to other computers
    on the internet using their IP address.


    SOCK_STREAM = TCP curl uses this

    SOCK_DGRAM = UDP dig(DNS) uses this

    SOCK_RAW = just let me send IP packets. ping uses this I will implement my own
    protocol.


    The main alternative is AF_UNIX ("unix domain socket") for connecting to programs
    on the same Computer.


    ![](img/7fb494784d11059c33eeec0b7adb1608_10_2.png)'
