  - '[PAGE 99]


    # how profiling with perf works


    The Linux Kernel has a built-in sampling profiler.


    ![](img/7fb494784d11059c33eeec0b7adb1608_99_0.png)


    How does Linux Know which functions your program is running though? Well, the
    Linux Kernel is in charge of scheduling.


    That means that at all times it has a list of every process and the address of
    the CPU instruction that process is currently running. That address is called
    the instruction pointer.


    Here''s what the information the Linux Kernel has looks like:


    | command | PID | thread ID | instruction pointer |

    |---|---|---||

    | python | 2379 | 2379 | 0x00759d2d |

    | bash | 1229 | 1229 | 0x00123456 |

    | use_cpu | 4991 | 4991 | 0xabababab |

    | use_cpu | 4991 | 4992 | 0xababdddd |


    Sometimes perf can''t figure out how to turn an instruction pointer address into
    a function name. Here''s an example of what that looks like:


    ```

    self command shared object symbol

    0.00% nodejs [.] 0x0000759d20

    0.00% V8 WorkerThread [kernel.kallsyms] [k] hrtimer_active

    ```'
- md: "\n## which programming languages can perf profile?\n\nThe way perf usually\
    \ figures out what function your programs are running is:\n\n- get the program's\
    \ instruction pointer address\n- get a copy of the program's stack\n- unwind the\
    \ stack to find the address of the current function call\n- use the program's\
    \ symbol table to figure out the name of the symbol that address corresponds to!\n\
    \nThe important thing to understand is that perf will by default give you a symbol\
    \ from the program symbol table. That means perf won't give you function names\
    \ for binaries where the symbols are stripped.\nHere's how perf can help you,\
    \ broken down by programming language:\n\n![](img/7fb494784d11059c33eeec0b7adb1608_100_0.png)\n\
    ![](img/7fb494784d11059c33eeec0b7adb1608_100_1.png)\n![](img/7fb494784d11059c33eeec0b7adb1608_100_2.png)\n\
    ![](img/7fb494784d11059c33eeec0b7adb1608_100_3.png)\n\n## perf: under the hood\n\
    \nIt's often useful to have a basic understanding of how our tools are implemented.\
    \ So let's look at the interface userspace tool (perf) uses to talk to the Linux\
    \ Kernel. Here's what happens, basically:\n\n- perf calls the perf_event_open\
    \ system call\n- the kernel writes events to a ring buffer in userspace\n- perf\
    \ reads events off that ring buffer and displays them to you somehow\n\nWhat's\
    \ a ring buffer?\n\nBasically, it's important to use a limited amount of memory\
    \ for profiling events. So the kernel allocates a fixed amount of memory:\n\n\
    ![](img/7fb494784d11059c33eeec0b7adb1608_101_0.png)\n\neach of these is space\
    \ for 1 record and when that memory gets full because new records are being written\
    \ faster than perf can read them...\n\n> whoops! we're out of space, guess I can't\
    \ write more events!\n\nLinux so if you see warnings from perf about events being\
    \ dropped, that's what is happening.\n\n## the perf_event_open system call\n\n\
    This system call is how perf asks the Linux Kernel to start sampling or tracing.\n\
    \nHere's the system call's signature, from man perf_event_open:\n\n```\nint perf_event_open(struct\
    \ perf_event_attr *attr,\n               pid_t pid, int cpu, int group_fd,\n \
    \              unsigned long flags);\n```\n\nPID & CPU to look at. Can be \"all\
    \ of them\". this is where most of the arguments are.\n\nI don't find this page\
    \ all useful for day-to-day perf usage. But did you know the perf CLI tool isn't\
    \ the only program that uses the perf_event_open syscall?\n\nThe bcc project is\
    \ a toolkit for writing advanced profiling tools using eBPF. github.com/iovisor/bcc\n\
    \nWith bcc, you can relatively easily use perf_event_open to create your own profiling/tracing\
    \ events! And then you can write code to aggregate/display them any way you want.\n\
    \nSearch for BCC_PERF_OUTPUT in the bcc docs to learn more.\n\n## more perf resources\n\
    \nThanks for reading! A few more useful resources:\n\nBrendan Gregg's blog ->\
    \ brendangregg.com/perf.html <- is my favorite perf resource. His blog & talks\
    \ are also useful!\n\nLWN is a great Linux publication, and they sometimes publish\
    \ articles about perf! Linux Weekly News LWN.net\n\nperf has man pages, as you'd\
    \ expect. man perf top, for example.\n\n- most importantly: experiment -> Pick\
    \ a program and try to profile it! -> See what your kernel is doing under different\
    \ workloads! -> Try recording or counting a few kinds of perf events and see what\
    \ happens\n\ngood luck! have fun JULIA\n\n![](img/7fb494784d11059c33eeec0b7adb1608_104_0.png)\n\
