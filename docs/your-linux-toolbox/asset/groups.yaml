  - '[PAGE 120]


    # let''s build expertise!


    Let''s zoom out a bit. A lot of the people I admire the most have been working
    on getting better at what they do for years ★.


    I''ve found it useful to pick a few things I''m really interested in (like Linux!)
    and focus on those.


    Things I''ve spent significant amounts of time (at least a year) working on getting
    better at:


    +   - Linux networking!

    - debugging + profiling tools!

    - machine learning!

    - planning projects at work!

    - technical writing/speaking!


    There are lots of things (Go! Databases! Javascript!) that are important and I
    know a little about but haven''t spent that much time on. That''s okay!


    It''s super fun to see a progression like:


    ![](img/7fb494784d11059c33eeec0b7adb1608_120_0.png)


    I think a) picking something to focus on and b) *actively* working on getting
    better at it is how all the people I admire got where they are'
