    ## floating point


    a double is 64 bits:

    | sign | exponent | fraction |

    | :--- | :--- | :--- |

    | 00000000 | 00000000 | 00000000 00000000 |

    | 00000000 | 00000000 | 00000000 00000000 |


    $\pm E^{-1023} \times 1.\text{frac}$


    That means there are $2^{64}$ doubles.

    The biggest one is about $2^{1023}$.


    weird double arithmetic:

    $2^{52} + 0.2 \cdot 2^{52}$ (the next number after $2^{52}$ is $2^{52}+1$)

    $1 + \frac{1}{2^{54}} =$ (the next number after 1 is $1+\frac{1}{2^{52}}$)

    $2^{2000} = \text{infinity}$ (infinity is a double)

    $\text{infinity-infinity} = \text{nan}$


    doubles get farther apart as they get bigger.


    between $2^n$ and $2^{n+1}$ there are always $2^{52}$ doubles, evenly spaced.


    that means the next double after $2^{60}$ is $2^{60+64} \cdot \frac{2^{60}}{252}$.


    Javascript only has doubles (no integers!).


    > $2^{53}$

    9007199254740992


    > $2^{53}+1$

    9007199254740992

    same number! uh oh!


    > doubles are scary and their arithmetic is weird!

    they''re very logical! just understand how they work and don''t use integers over
    $2^{53}$ in Javascript ♥


    ## file buffering


    ![](img/7fb494784d11059c33eeec0b7adb1608_15_0.png)


    I printed some text but it didn''t appear on the screen. why??


    On Linux, you write to files & terminals with the system call:

    ❤ write ❤


    I/O libraries don''t always call write when you print.


    ```

    printf("I ❤️ cats");

    ```


    time to learn about flushing!


    please write "I ❤️ cats" to file #1 (stdout)


    I''ll wait for a newline before actually writing.


    This is called buffering and it helps save on syscalls.


    ### 3 kinds of buffering (defaults vary by library)


    ### flushing


    when it''s useful to flush:


    - None. This is the default for stderr.

    - Line buffering. (write after newline). The default for terminals.

    - "full" buffering: (write in big chunks) The default for files and pipes.


    To force your I/O library to write everything it has in its buffer right now,
    call flush!


    - when writing an interactive prompt!

    - Python example: print("password: ", flush=True)


    ## memory allocation


    ![](img/7fb494784d11059c33eeec0b7adb1608_16_0.png)


    your allocator manages:

    - 10MB

    - 32MB

    - 58MB

    - 100MB

    - 2GB (heap)


    each allocator has its own interface:

    malloc(size_t) - allocate a block of memory

    free(void*) - free a block of memory

    calloc(size_t, size_t) - allocate and zero out

    memalign(size_t) - allocate aligned memory

    realloc(void*, size_t) - resize a block of memory


    ## virtual memory


    ![](img/7fb494784d11059c33eeec0b7adb1608_17_0.png)


    your program has:

    - virtual space

    - heap

    - stack

    - shared libraries

    - text segment

    - data segment


    the MMU manages virtual memory.


    ![](img/7fb494784d11059c33eeec0b7adb1608_17_1.png)


    the page table maps:

    | virtual address | physical address |

    | :--- | :--- |

    | 0x00000000 | 0x00000000 |

    | 0x00001000 | 0x00005000 |

    | 0x00002000 | 0x00006000 |

    | 0x00003000 | 0x00007000 |


    ## shared libraries


    ![](img/7fb494784d11059c33eeec0b7adb1608_18_0.png)


    Most programs on Linux use:

    - openssl

    - glibc

    - c++

    - gzip


    There are 2 ways to use libraries:

    - statically linked

    - dynamically linked


    ![](img/7fb494784d11059c33eeec0b7adb1608_18_1.png)


    If you know where the library is, try setting `LD_LIBRARY_PATH`.


    - LD_LIBRARY_PATH

    - DT_RPATH

    - DT_RUNPATH

    - /etc/ld.so.cache (run ldconfig)

    - /etc/ld.so.conf


    ## copy on write


    ![](img/7fb494784d11059c33eeec0b7adb1608_19_0.png)


    On Linux, you start new processes using the `fork()` or `clone()` system call.


    the cloned process has EXACTLY the memory.


    copying all that memory every we fork would be slow and a waste of RAM.


    calling fork creates a child that''s a copy of the caller:


    - same heap

    - same stack

    - same memory maps


    ![](img/7fb494784d11059c33eeec0b7adb1608_19_1.png)


    so Linux lets share physical RAM and only copies the memory when one of them tries
    to write.


    Linux does this by giving both processes identical page tables.


    When a process tries to write to a shared memory address:


    ![](img/7fb494784d11059c33eeec0b7adb1608_19_2.png)


    ![](img/7fb494784d11059c33eeec0b7adb1608_19_3.png)


    +   ① there''s a page fault

    ② Linux makes a copy of the page table & updates the page table

    ③ the process continues, blissfully ignorant


    ![](img/7fb494784d11059c33eeec0b7adb1608_19_4.png)


    but it marks every page as read only.


    ![](img/7fb494784d11059c33eeec0b7adb1608_19_5.png)

