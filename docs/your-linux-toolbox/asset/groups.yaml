  - '[PAGE 135]


    Sometimes a program is sending network requests to another machine and I want
    to know WHICH MACHINE.


    ```

    $ strace -e connect PROGRAM

    ```


    shows me every IP address a program connects to.


    ![](img/7fb494784d11059c33eeec0b7adb1608_135_0.png)


    What''s fun? Spying on network activity is fun. If you have an HTTP service and
    you''re debugging and totally at your wits'' end, maybe it''s time to look at
    what''s REALLY EXACTLY being sent over the network...


    these are your pals♡


    ![](img/7fb494784d11059c33eeec0b7adb1608_135_1.png)


    Once on my first day of work, a Ruby script that ran some ssh commands wasn''t
    working. Oh no! But who wants to read the code to find out why? Neither of us
    did.


    ```

    $ strace -f -e execve ./script.rb

    ```


    told us what the problem ssh command was, and we fixed it!'
  - '[PAGE 136]


    # # strace command line flags I ♡


    -e Overwhelmed by all the system calls you don''t understand? Try


    ```

    $ strace -e open

    ```


    and it''ll just show you open system calls much simpler. ❤


    -f Does your program start subprocesses? is for follow


    Use -f to see what those are doing too. Or just always use -f! That''s what I
    do.


    -P "OH NO! I STARTED THE PROGRAM 6 HOURS AGO AND NOW I WANT TO STRACE IT!"


    > don''t worry! Just find your program''s PID (like 747) and run:


    tip: if the process runs as root, you''ll need to be root because SECURITY


    ```

    $ strace -p 747

    ```'
  - '[PAGE 137]


    Sometimes I''m looking at the output of recvfrom and it''s like:


    recvfrom(6, "and then the monster...") and OH NO THE SUSPENSE.


    strace -s 800 will show you the first 800 characters of each string. I use -s
    all the time.


    Let''s get real. No matter what, prints way too much output. Use:


    ```

    $ strace -o too_much_stuff.txt

    and sort through it later.

    ```


    Have no idea which file the file descriptor "3" refers to? -y is a flag in newer
    versions of strace, and it''ll show you filenames instead of just numbers! -yy
    does the same for sockets too.


    Putting it all together:


    Want to spy on a ssh session:


    ```

    $ strace -f -o ssh.txt ssh juliabox.com

    ```


    Want to see what files a Dropbox sync process (with PID 230) is opening?


    ```

    $ strace -f -p 230 -e open

    ```'
