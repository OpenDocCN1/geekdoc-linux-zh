  - '[PAGE 114]


    # debugging: ♥ love your bugs ♥n(thanks to Allison Kaptur for teaching me this
    attitude! she has a great talk called "Love Your Bugs.")


    Debugging is a great way to learn. First, the harsh reality of bugs in your code
    is a good way to reveal problems with your mental model.


    ![](img/7fb494784d11059c33eeec0b7adb1608_114_0.png)


    ing bugs is also a good way to learn to write more reliable code!


    ![](img/7fb494784d11059c33eeec0b7adb1608_114_1.png)


    Also, you get to solve a mystery and get immediate feedback about whether you
    were right or not.


    ![](img/7fb494784d11059c33eeec0b7adb1608_114_2.png)


    Nobody writes great code without writing + fixing lots of bugs. So let''s talk
    about debugging skills a bit!'
