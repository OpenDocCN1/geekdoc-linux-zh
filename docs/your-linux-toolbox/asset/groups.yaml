  - '[PAGE 133]


    # Here''s an example of how to interpret an open system call (opening a file!)
    in a little more depth:


    system name file to open open with read/write permissions file descriptor open("awesome.txt",
    O_RDWR = 3


    The 3 here is a file descriptor number. Internally, Linux tracks open files with
    numbers! You can see all the file descriptors for process 42 and what they point
    to by doing:


    ```

    $ ls -1 /proc/42/fd fd is for file descriptor!

    ```


    and here''s what strace displays when a program reads from a file: file descriptor
    what got read number of bytes read strace(3, "wow!yay!") = 9\downarrow$


    If you don''t understand something in your strace output:


    +   * it''s normal! There are lots of system calls and

    * it''s ok if you don''t know what futex does yet

    try reading the man page for the system call!

    * man 2 open\downarrow$


    +   * remember that just understanding

    read + write + open + execve

    can take you a long way'
