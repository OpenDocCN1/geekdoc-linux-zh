    # perf is for everyone


    One day, I had a server that was using 100% of its CPU. Within about 60 seconds,
    I knew it was doing regular expression matching in Ruby. How? perf top is like
    top, but for functions instead of programs.


    ```

    $ sudo perf top top

    ```


    | process PID % function |

    |---|---|---|---|

    | ruby 1957 77 match_at |


    perf top doesn''t always help. But it''s easy to try, and sometimes Ruby''s internal
    regex matching function! I learn something!


    ... especially for Java and node devs! Remember when I said perf only knows C
    functions? It''s not quite true. node.js and the JVM (Java, Scala, Clojure) have
    both taught perf about their functions.


