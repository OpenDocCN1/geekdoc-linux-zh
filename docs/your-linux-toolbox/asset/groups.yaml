  - '[PAGE 109]


    # # When to invest in understanding?


    We work with a lot of abstractions. You don''t always need to spend time understanding
    how they all work under the hood.


    ![](img/7fb494784d11059c33eeec0b7adb1608_109_0.png)


    But a huge part of becoming a wizard is understanding how a seemingly magical
    computer system works. When is it useful to spend time learning how a thing works?


    +   - When you''re trying to debug a tricky problem

    - Sometimes the libraries you depend on have bugs.

    - Often,libraries/systems (like CSS or Linux) have complex abstractions (like
    the box model or epoll) that take time to learn.


    +   - When you''re trying to push the limits /optimize performance


    For example, if you''re writing data to a file you''re always limited by the speed
    of your disks! Thinking about hardware can be important.


    +   - When you''re trying to innovate


    If you''re building a new abstraction (like an async library), you gotta understand
    how the next layer down works! (epoll, select, etc.)'
