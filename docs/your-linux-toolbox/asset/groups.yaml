    \n![](img/7fb494784d11059c33eeec0b7adb1608_130_0.png)\n\n![](img/7fb494784d11059c33eeec0b7adb1608_130_1.png)\n\
    \nSystem calls are the API for your operating system:\n\n- want to open a file?\
    \ use open and then read and write to it\n- sending data over a network? Use connect\
    \ to open a connection and send and recv pictures of cats.\n\nreally, all of them!\
    \ Every program on your computer is using system calls all the time to manage\
