    \ kernel version!\n\n# perf is for everyone\n\nOne day, I had a server that was\
    \ using 100% of its CPU. Within about 60 seconds, I knew it was doing regular\
    \ expression matching in Ruby. How? perf top is like top, but for functions instead\
    \ of programs.\n\n```\n$ sudo perf top\n```\n\n| process | PID | % | function\
    \ |\n| :--- | :--- | :--- | :--- |\n| ruby | 1957 | 77 | match_at |\n\nperf top\
    \ doesn't always help. But it's easy to try, and sometimes Ruby's internal regex\
    \ matching function! I learn something!... especially for Java and node devs!\
    \ Remember when I said perf only knows C functions? It's not quite true. node.js\
    \ and the JVM (Java, Scala, Clojure) have both taught perf about their functions.\n\
    \nUse the --perf-basic-prof command line option Look up perf-map-agent on GitHub\
    \ and follow the directions\n\n# Flamegraphs\n\nFlamegraphs are an awesome way\
    \ to visualize CPU performance. Generate them with Brendan Gregg's flamegraph.pl\
    \ tool:\n\n```\ngithub.com/breandgregg/flamegraph\n```\n\nHere's what they look\
    \ like:\n\nThey're constructed from collections (usually thousands) of stack traces\
    \ sampled from a program. The one above means 80% of the stack traces started\
    \ with [main alligator] and 10% with [main panda].\n\nYou can construct them from\
    \ perf recordings (see Brendan Gregg's flamegraph GitHub for how), but lots of\
    \ other unrelated tools can produce them too. I ♡ them.\n\n# spy on your CPU!\n\
    \nYour CPU has a small cache on it (the L1 cache) that it can access in ~0.5 nanoseconds!\
    \ 200 times faster than RAM!\n\n> tip! google \"Latency numbers every programmer\
    \ should know!\n\nIf you're trying to do an operation in microseconds, CPU cache\
    \ use matters!\n\n```\n$ perf stat -e\n```\n\nthis listens on the port!\n\nthis\
    \ sends the data!\n\n- you can also use ifconfig to get your IP address\n\n# netstat\n\
    \nEvery network request gets sent to a port (like 80) on a computer. To receive\
    \ a request, a program (aka \"server\") needs to be \"listening\" on the port.\
    \ Finding out which programs are listening on which ports is really easy. It's\
    \ just:\n\n# tuna, please!\n\nalso known as\n\n```\n$ sudo netstat -tunap\n```\n\
    \nHere's what you'll see:\n\n| proto | local address | PID / program name |\n\
    | :--- | :--- | :--- | :--- |\n| tcp | 0.0.0.0:8080 | 2993 | / python |\n\nSo!\
    \ I♡ netstat because it tells me which processes are using which ports.\n\nOn\
    \ OSX, use lsof -Pni instead\n\n# ♡ ngrep ♡\n\nngrep is my favorite starter network\
    \ spy tool! Try it right now! Run:\n\n```\nsudo ngrep -d any metfilter\n```\n\n\
    Then go to http://metafilter.com in your browser. You should see matching network\
    \ packets in ngrep's output! We are SPIES!\U0001F603\n\nOnce at work, I made a\
    \ change to a client so that it sent {\"some_id\":...} with all its requests.\
    \ I wanted to make sure it was working, so I ran:\n\n```\nsudo ngrep some_id\n\
    ```\n\nI found out everything was okay. \U0001F603\n\n# tcpdump\n\ntcpdump is\
    \ the most difficult networking tool we'll discuss here, and it took me a while\
    \ to ♡ it. I use it to save network traffic to analyze later!\n\n> see wizardines.com\
    \ for a zine all about tcpdump!\n\n```\nsudo tcpdump port 8997 -w service.pcap\n\
    ```\n\n> a pcap file (\"packet capture\") is the standard for saving network traffic.\
    \ Everything understands .pcap.\n\n> 8997 is actually a tiny program in the Berkeley\
    \ Packet Filter (BPF) language. These programs are compiled and they run really\
    \ fast!\n\nSome situations where I'll use tcpdump:\n\n- I'm sending a request\
    \ to a machine and I want to know where it's even getting there. tcpdump port\
    \ 80 prints every packet on port 80.\n- I have some slow network connections and\
    \ I want to know whether to blame the client or server(also need wireshark!)\n\
    - I just want to print out packets to see them. (tcpdump -A)\n\n# wireshark\n\n\
    Wireshark is an amazing GUI tool for network analysis. Here's an exercise to learn\
    \ it! Run this:\n\n```\n$ sudo tcpdump port 80 -w http.pcap\n```\n\nWhile that's\
    \ running, open metafilter.com in your browser. Then press Ctrl+C to stop tcpdump.\
    \ Now we have a pcap file to analyze!\n\n```\n$ wireshark http.pcap\n```\n\nExplore\
    \ the Wireshark interface! Questions you can try to answer:\n\n- 1. What HTTP\
    \ headers did your browser send to metafilter.com? (hint: search frame contains\
    \ \"GET\")\n- 2. How long did the longest request take? (hint: click Statistics\
    \ -> Conversations)\n- 3. How many packets were sent to metafilter.com's servers?\
    \ (hint: search ip.dst == 54.186.13.33)\n\n# section 3 : CPU + perf\n\nYour programs\
    \ spend a lot of time on the CPU! Billions of cycles. What are they DOING?!\n\n\
