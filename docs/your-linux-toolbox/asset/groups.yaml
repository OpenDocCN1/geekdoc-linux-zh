    \ profile 20\n- perf: under the hood 21-22\n- more perf resources 23\n\n## perf\
    \ top\n\nMy favorite place to start with perf is perf top.\n\n![](img/7fb494784d11059c33eeec0b7adb1608_84_0.png)\n\
    \nI know how much CPU every program is using! Well I know how much CPU every function\
    \ is using! perf top\n\nI like to run perf top on machines when a program is using\
    \ 100% of the CPU and I don't know why.\n\n![](img/7fb494784d11059c33eeec0b7adb1608_84_1.png)\n\
    \nAs an example, let's profile a really simple program I wrote. It has a single\
    \ function, run_awesome_function, which is an infinite loop.\n\nHere's the code\
    \ I ran. I called the binary use_cpu.\n\n```c\nvoid run_awesome_function() {\n\
    \  int x = 0;\n  while (1) {\n    x = x + 1;\n  }\n}\nint main() { run_awesome_function();\
    \ };\n```\n\nWhile that's running, start perf top. It needs to run as root, like\
    \ every perf subcommand.\n\n### $ sudo perf top\n\n## perf top output\n\nHere's\
    \ what it looks like when I run perf top when use_cpu is running on my laptop:\n\
    \n99.78% use_cpu [.] run_awesome_function\n0.02% [kernel] [k] update_vsyscall\n\
    0.02% [kernel] [k]__softirqentry_text_start\n\n| % of the CPU function is using\
    \ | name of program or library |\n| :--- | :--- |\n| (empty) | function name/symbol\
    \ |\n\nThis is telling us that 100% of the CPU time is being spent in run_awesome_function:\n\
    \nperf top can tell you about both:\n\n- functions in userspace programs\n- functions\
    \ in the kernel\n\nHere's what it looks in an example where the kernel is using\
    \ a lot of CPU:\n\n```\n27.70% [kernel] [k]cpuidle_reflect\n11.87% [libxu.so]\
    \ [.]_init\n10.24% [kernel] [k]_aesni_encl\n6.75% [kernel] [k]end_bio_extent_writepage\n\
    3.94% [kernel] [k]find_get_pages_contig\n```\n\nThis function is doing encryption\
    \ (\"aes\") because I'm writing to an encrypted filesystem\n\n## perf record\n\
    \nperf top is great for getting a quick idea of what's happening, but I often\
    \ want to investigate more in depth.\n\nperf record collects the same information\
    \ as perf top, but it lets you save the data to analyze later. It saves it in\
    \ a file called perf.data in your current directory.\n\n![](img/7fb494784d11059c33eeec0b7adb1608_86_0.png)\n\
    \n![](img/7fb494784d11059c33eeec0b7adb1608_86_1.png)\n\n![](img/7fb494784d11059c33eeec0b7adb1608_86_2.png)\n\
    \n![](img/7fb494784d11059c33eeec0b7adb1608_86_3.png)\n\n![](img/7fb494784d11059c33eeec0b7adb1608_86_4.png)\n\
    \nThere are 3 main ways to choose what process(es) to profile with perf record:\n\
    \n- perf record COMMAND: start COMMAND and profile it until it exits\n- perf record\
    \ PID: profile PID until you press ctrl+c\n- perf record -a: profile every process\
    \ until you press ctrl+c\n\nThere's a 4th hybrid thing you can do: if you specify\
    \ both a PID (or -a) and a command, it'll profile the PID until the command exits.\
    \ Like this:\n\n```\nPID COMMAND\nperf record -p 8325 sleep 5\n```\n\nThis useful\
    \ trick lets you profile PID 8325 for 5 seconds!\n\n## collect data with perf\
    \ record\n\nSo far we've collected data with perf. When perf collects data, it\
    \ samples what is running.\n\nHere are a few kinds of events:\n\n- system calls\n\
    - network\n- context switches\n- page faults\n\nFor example, let's say you have\
    \ a program, but you don't know which function is running. Flamegraphs help by\
    \ showing the stack trace that led to the event.\n\n## flamegraphs\n\nFlamegraphs\
    \ are an awesome way to visualize profiling data. They were invented and popularized\
    \ by Brendan Gregg. Here's what they look like: (img/7fb494784d11059c33eeec0b7adb1608_89_0.png)\n\
    \nThey're constructed from thousands of stack traces sampled from perf. To generate\
    \ flamegraphs, get\n\n```\ngithub.com/brendandregg/flamegraph\n```\n\nOnce you\
    \ have that, here's how to generate a graph:\n\n```\nsudo perf script | stackcollapse-pl\
    \ | flamegraph.pl > graph.svg\n```\n\nopen this in your browser!\n\n## perf +node.js\
    \ = Java\n\nNormally with interpreted languages like node.js, perf will tell you\
    \ interpreter function is running but not Javascript. This works because both\
    \ node and Java have a JIT compiler.\n\n```javascript\nfunction awesome() {\n\
    \  // do a thing\n}\n```\n\nJIT compiled instructions\n\n| Ox affaffe |\n| :---\
    \ |\n| Ox affeba |\n\nnode.js communicates with perf by writing a file called\
    \ /tmp/PID.map. How to set that up:\n\n-1 get perf-map-agent from github\n-2 find\
    \ PID of process\n3 create-java-perf-map.sh $PID\n\nnode --perf-basic program.js\n"
