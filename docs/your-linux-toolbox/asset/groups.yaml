    use_cpu instruction

    stack 13650 12337 096592:657702 cycles:ppp:

    trace 4e1 run_awesome_function (use_cpu)

    4f5 main (use_cpu) symbol

    20830 __lib_start_main (libc-2.23.so)

    8fe258d4c544155 [unknown] ([unknown])

    ```'
