    \ is my laptop sending?\n$ tcpdump -i any port 1337 - what packets are coming\
    \ into that server from 1.2.3.4?\n$ tcpdump -i any port 1337 and host 1.2.3.4\
    \ - show me all DNS queries that fail.\n$ tcpdump -i any port 1337 - how long\
    \ are the TCP connections on this box lasting?\n\nSave packets to disk: $ tcpdump\
    \ -w packets.pcap and analyze packets.pcap in Wireshark\n\n# what tcpdump output\
    \ means\n\nEvery line of tcpdump output represents a packet. The parts I usually\
    \ pay attention to are:\n\n- source addresses and ports\n- timestamp\n- TCP flags\
    \ like SYN and ACK\n\nGood for spotting the beginning of a TCP connection or a\
    \ DNS query\n\nUDP packet:\n| timestamp | source IP | port | dest IP |\n| ---\
    \ | --- | --- | --- |\n| 11:12:44.48676 | 192.168.1.170 | 28282 | 192.168.1.53:\
    \ 2445+ A? ask.metafilter.com. (36) | |\n\nDNS query (I ignore this)\n\nTCP packet:\n\
    TCP flags. SYN is for starting, ACK is for acknowledgment.\n\n09:16:23.402215\
    \ IP 192.168.1.170.33016 > 52.84.90.443: Flags (S), seq 31918319, win 29020, options\
    \ [mss 1460, sack, ts 241479823, ecr 0, nop, wscale 7], length 0\n\nEver seen\
    \ a \"Connection refused\" error? Here's what that looks like in tcpdump!\n\n\
    09:50:22.544102 IP 127.0.0.1.40822 > 127.0.0.1234: Flags [S]\n09:50:22.544118\
    \ IP 127.0.0.1.1234 > 127.0.0.1.40822: Flags [R] RST ACK\n\nWe sent a SYN to open\
    \ the connection, but the server replied with an RST packet. That gets translated\
    \ \"connection refused.\"\n\n# BPF filters!\n\ntcpdump uses a small language called\
    \ BPF (\"berkeley packet filter\") to let you filter packets.\n\nIn `sudo tcpdump\
    \ port 53`, \"port 53\" is a BPF filter which means \"only show port 53 packets\"\
