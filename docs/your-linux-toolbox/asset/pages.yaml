  md: '# what''s a port?


    ports are part of the TCP and UDP protocols.

    (TCP port 999 and UDP port 999 are different!)

    When you send a TCP message, you want to talk to a specific kind of program.

    This would be bad:


    ![](img/7fb494784d11059c33eeec0b7adb1608_72_0.png)


    We want to have different kinds of programs on the same server:


    ![](img/7fb494784d11059c33eeec0b7adb1608_72_1.png)


    So every TCP/UDP packet has a port number between 1 and 65535 on it:


    ![](img/7fb494784d11059c33eeec0b7adb1608_72_2.png)


    | DNS | UDP port 53 |

    | HTTP | TCP port 80 |

    | HTTPS | TCP port 443 |

    | SMTP | TCP port 25 |

    | Minecraft | TCP + UDP port 25565 |'
  merge: -1
