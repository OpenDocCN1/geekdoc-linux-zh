- img_proc: true
  md: '# what tcpdump output means


    Every line of tcpdump output represents a packet.

    The parts I usually pay attention to are


    +   * source + dest IP addresses and ports

    * timestamp

    * TCP flags like SYN and ACK. Good for spotting the beginning of a TCP connection

    * the DNS query, for DNS queries


    UDP packet:


    | timestamp | source IP | port | dest IP (my router) | |

    |---|---|---|---||

    | 11:12:44.486716 | 192.168.1.170 | 28282 > 192.168.1.53:24457+ ask.metafilter.com.,
    (36) | |


    DNS query queryID (I ignore this)


    # TCP packet:


    TCP flags. Sis is for SYN is for ACK


    09:16:23.402215 IP 192.168.1.170.33016 > 52.84.90.246.443: Flags (S.), seq 319184319,
    win 29020, options [mss 1460,sackOK,ts 2414798023 ecr 0,nop,wscale 7], length
    0


    Ever seen a "Connection refused" error? Here''s what that looks like in tcpdump!
    SYN


    09:50:22.544102 IP 127.0.0.1.40822 > 127.0.0.1.1234: Flags [S]

    09:50:22.544118 IP 127.0.0.1.1234 > 127.0.0.1.40822: Flags [R] RST ACK


    We sent a SYN to open the connection, but the server replied with an RST packet.
    That gets translated to "connection refused."'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# BPF filters!


    tcpdump uses a small language called BPF ("berkeley packet filter") to let you
    filter packets


    In`sudo tcpdump port 53`, "port 53" is a BPF filter which means "only show port
    53 packets" Here''s a quick guide to BPF filters:


    +   - port 53

    - checks if the source port OR the dest port is 53. Matches TCP port 53 and UDP
    port 53.


    +   - src port 80

    - dst port 80

    - tcp port 80

    - are what they look like ʬ. so are:

    - src host 1.2.3.4

    - dst host 1.2.3.4


    +   - host 192.168.3.2

    - checks if the source or dest IP is 192.168.3.2.


    +   - udp[] & Oxf ==3 byte 11

    - you can do bit math on packet contents! This checks for the DNS response "NXDOMAIN"
    (I googled to find this, and it works ʬ


    +   - host 192.168.3.2

    - and port 80


    you can use ''and'', ''or'', or ''not''.'
  merge: -1
