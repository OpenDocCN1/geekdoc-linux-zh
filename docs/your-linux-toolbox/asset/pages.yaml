  md: '# netstat


    Every network request gets sent to a port (like 80) on a computer. To receive
    a request, a program (aka "server") needs to be "listening" on the port. Finding
    out which programs are listening on which ports is really easy. It''s just:


    # tuna, please!


    also known as


    ```

    $ sudo netstat -tunap

    ```


    Here''s what you''ll see:


    proto local address PID / program name

    tcp 0.0.0.0:8080 2993 / python

    port


    So! I♡ netstat because it tells me which processes are using which ports.


    On OSX, use lsof -Pni instead'
