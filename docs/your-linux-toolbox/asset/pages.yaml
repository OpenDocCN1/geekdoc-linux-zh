  md: '# # DNS


    * Step (1): get the IP address for jvns.ca *


    All networking happens by sending packets. To send a packet to a server on the
    internet, you need an IP address like 104.28.7.94.


    jvns.ca and google.comare domain names. DNS (the Domain Name System) is the protocol
    we use to get the IP address for a domain name.


    ![](img/7fb494784d11059c33eeec0b7adb1608_62_0.png)


    The DNS request & response are both usually UDP packets.


    When you run $ curl jvns.ca/cat.png:


    | curl calls the getaddrinfo function jvns.ca | getaddrinfo finds the system DNS
    server (like 8.8.8.8) | getaddrinfo makes a DNS request to 8.8.8.8 | IP address:
    obtained! ★ 104.28.7.94 |


    Your system''s default DNS server is often configured in /etc/resolv.conf.


    8.8.8.8 is Google''s DNS server, and lots of people use it. Try it if your default
    DNS server isn''t working!'
