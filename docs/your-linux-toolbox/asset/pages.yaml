  md: "# # Why are there kernel functions in my stack trace?\n\nSometimes you'll get\
    \ a stack trace from perf, and it'll mix functions from your program (like __getd64)\
    \ and functions from the kernel (like btrfs_real_readdr). This is normal!\n\n\
    Example:\n\n```\n27968 79997.204322: 707897 cycles:pp:\n\ffff0c34aec7 read_extent_buffer\
