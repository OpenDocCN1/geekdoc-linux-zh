  md: '# section 2: networking


    I''ve devoted a lot of space in this zine to networking tools, and I want to explain
    why.


    A lot of the programs I work with communicate over HTTP.


    ```

    request response "GET /cats/42" => my program => (name: "frufru" color: "blue")

    ```


    Every programming language uses the same network protocols! So the network is
    a nice language-independent place to answer questions like:


    +   * was the request wrong, or was it the response?

    * is my service even running?

    * my program is slow. Whose fault is that?


    Let''s go!'
