  md: '# perf record


    perf top is great for getting a quick idea of what''s happening, but I often want
    to investigate more in depth.


    perf record collects the same information as perf top, but it lets you save the
    data to analyze later. It saves it in a file called perf.data in your current
    directory.


    ![](img/7fb494784d11059c33eeec0b7adb1608_86_0.png)


    ![](img/7fb494784d11059c33eeec0b7adb1608_86_1.png)


    ![](img/7fb494784d11059c33eeec0b7adb1608_86_2.png)


    ![](img/7fb494784d11059c33eeec0b7adb1608_86_3.png)


    ![](img/7fb494784d11059c33eeec0b7adb1608_86_4.png)


    There are 3 main ways to choose what process(es) to profile with perf record:


    +   - perf record COMMAND: start COMMAND and profile it until it exits

    - perf record PID: profile PID until you press ctrl+c

    - perf record -a: profile every process until you press ctrl+c


    There''s a 4th hybrid thing you can do: if you specify both a PID (or -a) and
    a command, it''ll profile the PID until the command exits. Like this:


    ```

    PID COMMAND

    perf record -p 8325 sleep 5

    ```


    This useful trick lets you profile PID 8325 for 5 seconds!'
  merge: -1
