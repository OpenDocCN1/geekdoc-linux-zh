  md: '# file descriptors


    Unix systems use integers to track open files


    ![](img/7fb494784d11059c33eeec0b7adb1608_8_0.png)


    these integers are called file descriptors


    lsof (list open files) will show a process''s open files


    ```

    $ lsof -p 4242 - PID we''re interested in

    FD NAME

    0 /dev/pts/tty1

    1 /dev/pts/tty1

    2 pipe:24174

    3 /home/bark/awesome.txt

    5 /tmp/

    ```


    FD is for file descriptor


    +   file descriptors can refer to:

    -> files on disk

    -> pipes

    -> sockets (network connections)

    -> terminals (like xterm)

    -> devices (your speaker? /dev/null!)

    -> LOTS MORE (event fd, notify, poll, etc.)


    ![](img/7fb494784d11059c33eeec0b7adb1608_8_1.png)


    When you read or write to a file/pipe/network connection you do that using a file
    descriptor


    ![](img/7fb494784d11059c33eeec0b7adb1608_8_2.png)


    Let''s see how some simple Python code works under the hood:

    Python:


    ```

    f = open("file.txt")

    f.read lines()

    ```


    Behind the scenes:


    ![](img/7fb494784d11059c33eeec0b7adb1608_8_3.png)


    (almost) every process has 3 standard FDs:


    ```

    stdin -> 0

    stdout -> 1

    stderr -> 2

    ```


    > “read from stdin” means read from the file descriptor 0”


    could be a pipe or file or terminal'
