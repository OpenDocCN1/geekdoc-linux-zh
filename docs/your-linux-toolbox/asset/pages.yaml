  md: '# # Local networking


    aka "how to talk to a computer in the same room


    Every computer is in a subnet. Your subnet is the list of computers that you can
    talk to directly.


    ![](img/7fb494784d11059c33eeec0b7adb1608_74_0.png)


    What does it mean to talk "directly" to another computer? Well, every computer
    on the internet has a network card with a MAC address.


    ![](img/7fb494784d11059c33eeec0b7adb1608_74_1.png)


    When you send a packet to a computer in your subnet, you put the computer''s MAC
    address on it. To get the right MAC, your computer uses a protocol called ARP:
    "Address Resolution Protocol".


    ![](img/7fb494784d11059c33eeec0b7adb1608_74_2.png)


    You can run arp -na to see the contents of the ARP table on your computer. It
    should look like this:


    ```

    $ arp -na

    ? (192.168.1.120) at 44:53:30:30:98 [ether] on wlp3s0

    ```'
  merge: -1
  pgno: 74
