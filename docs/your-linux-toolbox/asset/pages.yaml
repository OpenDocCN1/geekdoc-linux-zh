  md: '# collect tracing data with perf record


    So far we''ve collected profiling data with perf like "what function is running?".
    When perf collects profiling data, it samples — it checks what function is running
    100 times/second or something.


    But perf can also record lots of different kinds of events. And when it records
    events, it doesn''t sample — if you ask it to record system calls, it''ll attempt
    to record every single system call.


    Here are a few kinds of events:


    +   - system calls

    - sending network packets

    - reading from a block device (disk)

    - context switches/page faults

    - and you can make any kernel function into an event (that''s called "kprobes")


    > list every event with perf list


    For example, let''s say you have a program outbound network connections, but you
    don''t know which program. perf can help!


    This perf incantation records every time a program connects to a web server (the
    connect system call), and it also records the stack trace that led up to the syscall.


    ```

    perf record -e syscalls:sys_enter_connect -ag stack trace

    ```


    Being able to take a syscall/page fault/disk write and trace it back to the exact
    code that caused it is pretty magical.'
  merge: -1
  pgno: 87
