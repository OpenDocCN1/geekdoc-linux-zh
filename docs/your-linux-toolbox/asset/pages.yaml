  md: '# netcat


    HTTP requests are just text, and you can use netcat to make any HTTP request you
    want by hand. Here''s how to make a request for example.com! Try it!


    ```

    printf "GET / HTTP/1.1\r\nHost: example.com\r\n\r\n" | nc example.com 80

    ```


    You should get a response back with a bunch of HTML! You can also use netcat to
    send huge files over a local network quickly:


    | step 1: (on target machine) |

    | $ hostname - |

    | 192.168.2.132 |

    | $ nc -1 9931 > bigfile |


    | step 2: (on the source) |

    | cat bigfile |

    | nc 192.168.2.132 9931 |


    this listens on the port!


    this sends the data!


    * you can also use ifconfig to get your IP address'
