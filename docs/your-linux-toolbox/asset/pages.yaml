  md: 'I love dstat because it''s super simple. Every second, it prints out how many
    bytes were written to the network/disk that second.


    Once, I had an intermittently slow database server. I opened up dstat and stared
    at the output while monitoring database speed.


    ```

    $ dstat

    ```


    | recv | during this period, |

    |---|---|

    | 0 | everything is normal |

    | 3k | |

    | 5k | |

    | 300 MB | DATABASE |

    | 48 MB | GETS SLOW || |

    | 0 | |

    | 0 | back to normal


    Could 300MB coming in over the network mean... a 300MB database query? YES!


    This was an AWESOME CLUE that helped me isolate the problem query.'
