    and sort through it later.

    ```


    Have no idea which file the file descriptor "3" refers to? -y is a flag in newer
    versions of strace, and it''ll show you filenames instead of just numbers! -yy
    does the same for sockets too.


    Putting it all together:


    Want to spy on a ssh session:


    ```

    $ strace -f -o ssh.txt ssh juliabox.com

    ```


    Want to see what files a Dropbox sync process (with PID 230) is opening?


    ```

    $ strace -f -p 230 -e open

    ```'
