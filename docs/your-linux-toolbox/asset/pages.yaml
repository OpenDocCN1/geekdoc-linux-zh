  md: '# perf trace


    strace is an awesome Linux debugging tool that traces system calls. It has one
    problem though:


    ![](img/7fb494784d11059c33eeec0b7adb1608_96_0.png)


    perf trace traces system calls, but with way less overhead. It''s safe to run
    in production, unlike strace.


    There are 2 disadvantages (as of Linux 4.4):


    +   - sometimes it drops system calls (this is sort of an advantage since it limits
    overhead)


    +   - it won''t show you the strings that are being read/written.


    Here''s a comparison of both strace and perf trace output, on the same program:


    ![](img/7fb494784d11059c33eeec0b7adb1608_96_1.png)


    ```

    brk(brk: 0x2397000) write(fd: 2, buf: 0x28) read(buf: 0x7fd77b0a8, 1) ioctl(cmd:
    TCGETS, arg:) ioctl(cmd: TCSETSW, arg:)

    brk(brk: 0x2397000) write(2, "bork@kiwi-", 13) read(0, "#4", 1) ioctl(0, TCGETS,
    arg: 0x7fd77b0a) ioctl(0, SNDCTL_TMR_STOP OR TCSETSW)

    ```


    These have the same system call, but only strace actually shows you what string
    was written. Recently I used perf trace, and it told me Docker calling stat on
    200,000 files, which was a VERY USEFULUE that helped me figure out that Docker
    gets container sizes by looking at every file. I used perf trace because I didn''t
    want to deal with strace''s overhead!'
