  md: '# The TCP handshake


    This is what a TCP header looks like:


    the "sequence number" lets you assemble packets in the right order


    | Source Port | Destination Port |

    |---|---|

    | Sequence Number |

    | Acknowledgement Number |

    | Data Offset | Reserved | ACK | SYN | Window |

    | Checksum | Urgent Pointer |

    | Options | Padding |


    Every TCP connection starts with a "handshake". This makes sure both sides of
    the connection can communicate with each other.


    ![](img/7fb494784d11059c33eeec0b7adb1608_67_0.png)


    But what do "SYN" and "ACK" mean? Well! TCP headers have 6 bit flags (SYN, ACK,
    RST, FIN, PSH, URG) that you can set (you can see them in the diagram). A SYN
    packet is a packet with the SYN flag set to 1.


    When you see "connection refused" or "connection timeout" errors, that means the
    TCP handshake didn''t finish! Here''s what a TCP handshake looks like in tcpdump:


    ```

    $ sudo tcpdump host jvns.ca

    localhost:51104 > 104.28.6.94:80 flags [S] TCP

    104.28.6.94:80 > localhost:51104 flags [S.] handshake!

    localhost:51104 > 104.28.6.94:80 flags [.]

    jvns.ca IP address

    ```


    S is for SYN

    is is for ACK'
  merge: -1
