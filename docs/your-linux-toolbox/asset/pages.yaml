  md: "sourced from breandingregg.com/perf.html, which has many more great examples\n\
    \n# # perf trace: trace system calls & other events\n\n+   - Trace syscalls system\
    \ wide\n perf trace\n- Trace syscalls for PID\n perf trace -p PID\n\n# # perf\
    \ record: record profiling data\n\n+   - Sample CPU functions for COMMAND at 99\
    \ Hertz;\n perf record -f 99 COMMAND\n records into perf.data file\n- Sample CPU\
    \ functions for PID, until Ctrl-C:\n perf record -p PID\n\n+   - Sample CPU functions\
    \ for PID, for 10 seconds:\n perf record -p PID sleep 10\n\n+   - Sample CPU traces\
    \ for PID, for 10 seconds:\n perf record -p PID -g -- sleep 10\n\n+   - Sample\
    \ CPU traces for PID, using DWARF to unwind stack:\n perf record -p PID --call-graph\
    \ dwarf\n\n# # perf record: record tracing data\n\n+   - Trace new processes,\
    \ until Ctrl-C:\n perf record -e sched:sched_process_exec -a\n records into perf.data\
    \ file\n\n+   - Trace all context switches, until Ctrl-C:\n perf record -e context-switches\
    \ -a\n\n+   - Trace all context switches with stack traces, for 10 seconds:\n\
    \ perf record -e context-switches -ag -- sleep 10\n\n+   - Trace all page faults\
    \ with stack traces, until Ctrl-C:\n perf record -e page-faults -ag\n\n# # adding\
    \ new trace events\n\n+   - Add a tracepoint for kernel function tcp_send_msg():\n\
    \ perf probe 'tcp_send_msg'\n\n+   - Trace previously created probe:\n perf record\
    \ -e probe:tcp_send_msg -a\n\n+   - Add a tracepoint for myfunc() and include\
    \ the retval as a string:\n perf probe 'myfunc$return+$(retval):string'\n\n+ \
    \  - Trace previous probe when size > 0:\n perf record -e probe:tcp_send_msg --filter\
    \ 'size > 0' -a\n\n+   - Add a tracepoint for os_sys_open() with the filename\
    \ as a string:\n perf probe 'do_sys_open filename:string'"
