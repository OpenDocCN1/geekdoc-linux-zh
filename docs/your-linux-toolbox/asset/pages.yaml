  md: '# Resources + FAQ


    I''ve written like 7 posts about strace because I have an unhealthy obsession.
    They''re at:


    jvns.ca/categories/strace


    A few questions you might have about strace:


    Q: Is there strace on OS X?

    A: No, but trydtruss/dtrace!


    Q: Can I strace solace?

    A: Yup! If you do, you''ll find out that strace uses the ptrace system call to
    do its magic.


    Q: Should I strace my production database?

    A: NONONONONO. It will slow down your database a LOT.


    Q: Is there a way to trace system calls that won''t slow down my programs?

    A: Yes! Look into perf trace and eBPF-based tools.'
