  md: '# flameigraphs


    Flameigraphs are an awesome way to visualize profiling data, profiling data. They
    were invented and popularized by Brendan Gregg.


    Here''s what they look like:


    ![](img/7fb494784d11059c33eeec0b7adb1608_89_0.png)


    They''re constructed from lots (usually thousands) of stack traces sampled from
    a program. This one above means that 20% of the stack traces started with panda
    and 28% started with teeth.


    To generate flamegraphs, get


    ```

    github.com/brendandregg/flamegraph

    ```


    and put it in your PATH. Once you have that, here''s how to generate a flamegraph:


    ```

    sudo perf script | stackcollapse-perf.pl | flamegraph.pl > graph.svg

    ```


