  md: '# HTTP


    Step 4: Finally we can request cat.png!

    Every time you get a webpage or see an image online, you''re using HTTP.


    HTTP is a pretty simple plaintext protocol. In fact, it''s so simple that you
    can make an HTTP request by hand right now. Let''s do it!!!


    ```

    $ printf "GET / HTTP/1.1\r\nHost: example.com\r\n\r\n"

    nc example.com 80

    ```


    the nc command ("netcat") sets up a TCP connection to example.com and sends the
    HTTP request you wrote!

    The response we get back looks like:


    ```

    200 OK

    Content-Length: 120321

    ... headers ...


    <html>

    <body>

    .... more HTML

    ```


    ![](img/7fb494784d11059c33eeec0b7adb1608_68_0.png)


    HTTP/2 is the next version of HTTP. Some big differences are that it''s a binary
    protocol, you can make multiple requests at the same time, and you have to use
    TLS.'
