  md: '# perf perf


    perf is not simple or elegant. It''s a weird multitool that does a few different,
    very useful things. First, it''s a sampling profiler


    Try running:


    ```

    $ sudo perf record python # saves a file perf.data (press Ctrl+C after a few seconds)

    ```


    You can look at the results with:


    ```

    $ sudo perf report

    ```


    Mine says it spent 5% of its time in the Py Dict_GetItem function. Cool! We learned
    a tiny thing about the CPython interpreter.


    Shows you C functions


    Works everywhere ♡


    if you use perf to profile a Python program, it''ll show you the C functions (symbols)
    from the CPython interpreter, not the Python functions.


    perf can be installed on pretty much any Linux machine. The exact features it
    has will depend on your kernel version!'
