  md: '# spy on your CPU!


    Your CPU has a small cache on it (the L1 cache) that it can access in ~0.5 nanoseconds!
    200 times faster than RAM!


    > tip! google "Latency numbers every programmer should know!


    If you''re trying to do an operation in microseconds, CPU cache use matters!


    ![](img/7fb494784d11059c33eeec0b7adb1608_54_0.png)


    ![](img/7fb494784d11059c33eeec0b7adb1608_54_1.png)


    > pass -e to request a specific statistic


    ```

    $ perf stat ls

    ```


    ![](img/7fb494784d11059c33eeec0b7adb1608_54_2.png)


    This runs 1s and prints a report at the end Your CPU can track all kinds of counters
    about what it''s doing. perf stat asks it to count things (like L1 cache misses)
    & report the results.


    ![](img/7fb494784d11059c33eeec0b7adb1608_54_3.png)


    Hardware is cool. I''ve never used perf stat in earnest, but I think it''s awesome
    that you can get so much info from your CPU!'
