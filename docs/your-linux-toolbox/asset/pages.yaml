  md: '# pipes


    a pipe is a pair

    of 2 magical

    file descriptors


    ![](img/7fb494784d11059c33eeec0b7adb1608_9_0.png)


    When ls does

    write("hi"),

    wc can read it!

    read("hi")

    Pipes are one way.

    You can''t write to .


    ![](img/7fb494784d11059c33eeec0b7adb1608_9_1.png)


    Linux creates a buffer

    for each pipe.


    buffer data waiting to read

    If data gets written to the pipe

    faster than it''s read, the buffer

    will fill up.

    When the buffer is full, writes

    to will block (wait) until the

    readers. This is normal & ok


    ![](img/7fb494784d11059c33eeec0b7adb1608_9_2.png)


    what if your

    target process dies?


    If wc dies, the pipe

    will close and ls will be

    sent SIGPIPE. By default,

    SIGPIPE terminates your process.


    ![](img/7fb494784d11059c33eeec0b7adb1608_9_3.png)


    named pipes

    $ mkfifo my-pipe

    This lets 2 unrelated

    processes communicate

    through a pipe !


    ```

    f=open(./my-pipe)

    f.write("hi\n")

    ```


    ```

    f=open(./my-pipe)

    f.readline()("hi!")

    ```'
