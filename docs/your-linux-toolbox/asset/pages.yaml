  md: "# annotated strace\n\nWhen you run strace, you'll see thousands of lines of\
    \ output like this:\n\n```\n$ strace ls /home/bork/blah\nexecve(\"/bin/ls\", \"\
    ls\", \"/home/bork/blah\\ [/* 62 vars */]) = 0\nbrk(NULL) = 0xb67000\nopen(\"\
    /etc/ld.so.cache\", O_RDONLY|O_CLOEXEC) = 3\nopen(\"/proc/filesystems\", O_RDONLY)\
    \ = 3\n    omitted\nopen(\"/home/bork/blah\", O_RDONLY|O_NONBLOCK|O_DIRECTORY)\
    \ = 3\nfstat(3, {st_mode=S_IFDIR|07755, st_size=168, ...}) = 0\ntdents(3, /* 3\
    \ entries */, 32768) = 80\ntdents(3, /* 0 entries */, 32768) = 0\nclose(3) = 0\n\
    fstat(1, {st_mode=S_IFCHR|0620, st_rdev=136, 5, ...}) = 0\nwrite(1, \"awesome_file\\\
    n\", 13) = 13\nclose(1) = 0\nclose(2) = 0\nexit_group(0) = ?\n```\n\nStudies show\
    \ this is not self-explanatory (me asking my friends if it makes sense and NOPE\
    \ NOPE)\n\nlet's learn how to interpret strace output\n\n```\n11999 execve(\"\
    /bin/ls\", \"ls\", \"/home/bork/blah\") = 0\n```\n\n+   ① The process ID (included\
    \ when you run strace -f)\n② The name of the system call (execve starts programs)\n\
    ③ The system call's arguments, in this case a program to start and the arguments\
    \ to start it with\n④ The return value"
  merge: -1
