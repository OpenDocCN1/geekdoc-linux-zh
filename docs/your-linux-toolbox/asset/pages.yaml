  md: '# # strace command line flags I ♡


    -e Overwhelmed by all the system calls you don''t understand? Try


    ```

    $ strace -e open

    ```


    and it''ll just show you open system calls much simpler. ❤


    -f Does your program start subprocesses? is for follow


    Use -f to see what those are doing too. Or just always use -f! That''s what I
    do.


