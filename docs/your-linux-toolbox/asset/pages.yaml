  md: '# our star:

    the packet


    All data is sent over the internet in packets. A packet is a series of bits (011001001...)
    and it''s split into section (aka "headers")."


    Here''s what a UDP packet that says "mangotea" looks like. It''s 50 bytes (400
    bits) in all!


    ![](img/7fb494784d11059c33eeec0b7adb1608_60_0.png)


    ![](img/7fb494784d11059c33eeec0b7adb1608_60_1.png)


    | destination MAC | source MAC addr | type | Ethernet frame header (14 bytes)
    |

    | 4 bytes 32 bits | | |


    | ver | hlen | TOS | packet length | 160 bits |

    | identification | flg | fragment offst | 20 bytes |

    | TTL | protocol | header checksum | |

    | Source IP address | | |

    | Destination IP address | | |


    IP header

    This tells routers what IP to send the packet to.


    | source port | destination port | 64 bits |

    | length | UDP checksum | 8 bytes |

    | m | a | n | g |

    | o | t | e | a |


    UDP header

    (a TCP packet would have a TCP header instead here)

    The packet''s "contents" go here. ASCII characters are 1 byte so "mangotea" =
    8 bytes 64 bits'
