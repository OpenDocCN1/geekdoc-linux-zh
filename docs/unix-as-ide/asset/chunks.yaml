    Even if you’re just working with a 16-color terminal, just include the following
    in your `.vimrc` if you’re not already:


    ```

    syntax on

    ```


    The colorschemes with a default 16-color terminal are not pretty largely by necessity,
    but they do the job, and for most languages syntax definition files are available
    that work very well. There’s a [tremendous array of colorschemes](http://code.google.com/p/vimcolorschemetest/)
    available, and it’s not hard to tweak them to suit or even to write your own.
    Using a [256-color terminal](http://vim.wikia.com/wiki/256_colors_in_vim) or `gVim
    will give you more options. Good syntax highlighting files will show you definite
    syntax errors with a glaring red background.


    ## Line numbering


    To turn line numbers on if you use them a lot in your traditional IDE:


    ```

    set number

    ```


    You might like to try this as well, if you have at least Vim 7.3 and are keen
    to try numbering lines relative to the current line rather than absolutely:


    ```

    set relativenumber

    ```


    ## Tags files


    Vim [works very well](http://amix.dk/blog/post/19329) with the output from the
    `ctags` utility. This allows you to search quickly for all uses of a particular
    identifier throughout the project, or to navigate straight to the declaration
    of a variable from one of its uses, regardless of whether it’s in the same file.
    For large C projects in multiple files this can save huge amounts of otherwise
    wasted time, and is probably Vim’s best answer to similar features in mainstream
    IDEs.


    You can run `:!ctags -R` on the root directory of projects in many popular languages
    to generate a `tags` file filled with definitions and locations for identifiers
    throughout your project. Once a `tags` file for your project is available, you
    can search for uses of an appropriate tag throughout the project like so:


    ```

    :tag someClass

    ```


    The commands `:tn` and `:tp` will allow you to iterate through successive uses
    of the tag elsewhere in the project. The built-in tags functionality for this
    already covers most of the bases you’ll probably need, but for features such as
    a tag list window, you could try installing the very popular [Taglist plugin](http://vim-taglist.sourceforge.net/).
    Tim Pope’s [Unimpaired plugin](https://github.com/tpope/vim-unimpaired) also contains
    a couple of useful relevant mappings.


    ## Calling external programs


    There are two major methods of calling external programs during a Vim session:


    * `:!<command>` — Useful for issuing commands from within a Vim context particularly
    in cases where you intend to record output in a buffer.

    * `:shell` — Drop to a shell as a subprocess of Vim. Good for interactive commands.


    A third, which I won’t discuss in depth here, is using plugins such as [Conque](http://code.google.com/p/conque/)
    to emulate a shell within a Vim buffer. Having tried this myself and found it
    nearly unusable, I’ve concluded it’s simply bad design. From `:help design-not`:


    > Vim is not a shell or an Operating System. You will not be able to run a shell
    inside Vim or use it to control a debugger. This should work the other way around:
    Use Vim as a component from a shell or in an IDE.


    ## Lint programs and syntax checkers


    Checking syntax or compiling with an external program call (e.g. `perl -c`, `gcc`)
    is one of the calls that’s good to make from within the editor using `:!` commands.
    If you were editing a Perl file, you could run this like so:


    ```

    :!perl -c %


    /home/tom/project/test.pl syntax OK


    Press Enter or type command to continue

    ```


    The `%` symbol is shorthand for the file loaded in the current buffer. Running
    this prints the output of the command, if any, below the command line. If you
    wanted to call this check often, you could perhaps map it as a command, or even
    a key combination in your `.vimrc` file. In this case, we define a command `:PerlLint`
    which can be called from normal mode with `\l`:


    ```

    command PerlLint !perl -c %

    nnoremap <leader>l :PerlLint<CR>

    ```


    For a lot of languages there’s an even better way to do this, though, which allows
    us to capitalise on Vim’s built-in quickfix window. We can do this by setting
    an appropriate `makeprg` for the filetype, in this case including a module that
    provides us with output that Vim can use for its quicklist, and a definition for
    its two formats:


    ```

    :set makeprg=perl\ -c\ -MVi::QuickFix\ %

    :set errorformat+=%m\ at\ %f\ line\ %l\.

    :set errorformat+=%m\ at\ %f\ line\ %l

    ```


    You may need to install this module first via CPAN, or the Debian package `libvi-quickfix-perl`.
    This done, you can type `:make` after saving the file to check its syntax, and
    if errors are found, you can open the quicklist window with `:copen` to inspect
    the errors, and `:cn` and `:cp` to jump to them within the buffer.

