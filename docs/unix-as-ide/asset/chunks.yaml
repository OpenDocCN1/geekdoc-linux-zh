  trans: "\n\n```\n$ rcsdiff -u -r1.1 -r1.2 ./example.c \n===================================================================\n\
    RCS file: ./example.c,v\nretrieving revision 1.1\nretrieving revision 1.2\ndiff\
    \ -u -r1.1 -r1.2\n--- ./example.c 2012/02/15 07:36:23 1.1\n+++ ./example.c 2012/02/15\
    \ 07:39:16 1.2\n@@ -4,6 +4,7 @@\n int main (int argc, char* argv[])\n {\n    \
    \ printf(\"Hello, world!\\n\");\n+    printf(\"Extra line!\\n\");\n     return\
    \ EXIT_SUCCESS;\n }\n```\n\n如果暗示简单的补丁（patches）现在不再作为版本控制的方法被使用，那是误导性的；它们仍然以上述的形式广泛使用，并且在集中式和去中心化的版本控制系统中都占重要地位。\n\
    \n## CVS 和 Subversion\n\n为了处理多个开发者对代码库做出更改的冲突问题，开发了`集中式版本系统`（centralized version\
    \ systems），其中[并发版本系统 (CVS)](http://en.wikipedia.org/wiki/Concurrent_Versions_System)\
    \ 先后，随后是稍先进的 [Subversion](http://en.wikipedia.org/wiki/Apache_Subversion)。这些系统的核心特性是使用包含存储库的`中央服务器`（central\
    \ server），可以从中检索特定时间或修订版本的代码库权威版本。这些被称为代码的`工作副本`（working copies）。\n\n对于这些系统，系统的基本单元仍然是`更改集`（changeset），向用户表示这些更改的最常见方式是使用早期系统中使用的典型\
    \ `diff` 格式。这两个系统的工作原理都是保留这些更改集的记录，而不是文件本身在不同状态之间的演变记录。\n\n这一代系统引入的其他概念包括项目的`分支`（branching），以便并发地处理同一项目的不同实例，然后经过适当的测试和审查将其合并到主线或`trunk`中。同样，还引入了`标签`（tagging）的概念，以标记某些版本代表软件发布时代码库的状态。还引入了`合并`（merge）的概念；用于手动调和对文件所做的冲突更改。\n\
    \n## Git 和 Mercurial\n\n下一代版本控制系统是`分布式`或`去中心化`系统，在系统中，代码的工作副本本身包含了项目的完整历史，因此不再依赖中央服务器即可贡献项目。在开源、对\
    \ Unix 友好的环境中，突出的系统是 Git 和 Mercurial，它们的客户端程序分别为 `git` 和 `hg`。\n\n对于这两个系统，通信更改集的概念通过\
    \ `push`、`pull` 和 `merge` 操作完成；一个存储库的更改会被另一个接受。这种去中心化的系统允许极其复杂但受控的开发生态系统；Git 最初由\
    \ Linus Torvalds 开发，旨在提供一个能够管理 Linux 内核开发的分布式版本控制系统（DVCS）。\n\nGit 和 Mercurial\
    \ 与 CVS 以及 Subversion 的区别在于，它们的操作基本单元不是更改集，而是使用压缩保存的完整文件（blobs）。这使得查找单个文件的日志历史或文件两个修订版本之间的差异开销略大，但\
    \ `git log --patch` 的输出仍然保留了每个版本熟悉的统一 `diff` 输出，而这在 `diff` 首次被使用后已经过去了四十年多：\n\n\
    ```\ncommit c1e5559ddb09f8d02b989596b0f4100ad1aab422\nAuthor: Tom Ryder <tom@sanctum.geek.nz>\n\
    Date:   Thu Feb 2 01:14:21 2012\n\nChanged my mind about this one.\n\ndiff --git\
    \ a/vim/vimrc b/vim/vimrc index cfbe8e0..65a3143 100644\n--- a/vim/vimrc\n+++\
    \ b/vim/vimrc\n@@ -47,10 +47,6 @@\n set shiftwidth=4\n set softtabstop=4\n set\
    \ tabstop=4\n\n-\" Heresy\n-inoremap <C-a> <Home>\n-inoremap <C-e> <End>\n-\n\
    \ \" History\n set history=1000\n```\n\n这两个系统在功能甚至在命令集上有相当重叠，关于使用哪一个的问题引发了[激烈的讨论](http://stackoverflow.com/questions/35837/what-is-the-difference-between-mercurial-and-git)。我过的关于这两个最好的介绍是\
    \ Scott Chacon 写的 [Pro Git](http://progit.org/) 和 Joel Spolsky 写的 [Hg Init](http://hginit.com/)。\n\
    \n## 结论\n\n这是[Unix 作为 IDE 系列](http://blog.sanctum.geek.nz/series/unix-as-ide/)\
    \ 的最后一篇文章；我尝试对 Linux 中 shell 内部即可提供的基本工具进行快速综述，以涵盖专业 IDE 提供的所有基本功能。在某些地方，解释某些功能时我无法像希望的那样详尽，但对于不熟悉在\
    \ Linux 机器上开发的人来说，希望这些内容能让他们了解简单的 shell 开发环境可以是多么全面，而且这一切都是通过免费、高度成熟且标准的软件工具实现的。\n\
    \n"
