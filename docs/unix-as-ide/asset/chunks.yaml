- fmt: "But to use the script as a `logical binary`, so you can invoke it directly\
    \ without knowing or caring what the script is, you can add a special first line\
    \ to the file called the “shebang” that does some magic to specify the interpreter\
    \ through which the file should be run.\n\n```\n#!/usr/bin/env perl\nprint \"\
    Hello, world.\\n\";\n```\n\nThe script then needs to be made executable with a\
    \ `chmod` call. It’s also good practice to rename it to remove the extension,\
    \ since it is now taking the shape of a logic binary:\n\n```\n$ mv hello{.pl,}\n\
    $ chmod +x hello\n```\n\nAnd can thereafter be invoked directly, as if it were\
    \ a compiled binary:\n\n```\n$ ./hello\n```\n\nThis works so well that many of\
    \ the common utilities on modern Linux systems, such as the `adduser` frontend\
    \ to `useradd`, are actually Perl or even Python scripts.\n\nIn the next post,\
    \ I’ll describe the use of `make` for defining and automating building projects\
    \ in a manner comparable to IDEs, with a nod to newer takes on the same idea with\
    \ Ruby’s `rake`.\n\n# Building\n\nBecause compiling projects can be such a complicated\
    \ and repetitive process, a good IDE provides a means to abstract, simplify, and\
    \ even automate software builds. Unix and its descendents accomplish this process\
    \ with a `Makefile`, a prescribed recipe in a standard format for generating executable\
    \ files from source and object files, taking account of changes to only rebuild\
    \ what’s necessary to prevent costly recompilation.\n\nOne interesting thing to\
    \ note about `make` is that while it’s generally used for compiled software build\
    \ automation and has many shortcuts to that effect, it can actually effectively\
    \ be used for any situation in which it’s required to generate one set of files\
    \ from another. One possible use is to generate web-friendly optimised graphics\
    \ from source files for deployment for a website; another use is for generating\
    \ static HTML pages from code, rather than generating pages on the fly. It’s on\
    \ the basis of this more flexible understanding of software “building” that modern\
    \ takes on the tool like [Ruby’s `rake`](http://rake.rubyforge.org/) have become\
    \ popular, automating the general tasks for producing and installing code and\
    \ files of all kinds.\n\n## Anatomy of a `Makefile`\n\nThe general pattern of\
    \ a `Makefile` is a list of variables and a list of `targets`, and the sources\
    \ and/or objects used to provide them. Targets may not necessarily be linked binaries;\
    \ they could also constitute actions to perform using the generated files, such\
    \ as `install` to instate built files into the system, and `clean` to remove built\
    \ files from the source tree.\n\nIt’s this flexibility of targets that enables\
    \ `make` to automate any sort of task relevant to assembling a production build\
    \ of software; not just the typical parsing, preprocessing, compiling proper and\
    \ linking steps performed by the compiler, but also running tests (`make test`),\
    \ compiling documentation source files into one or more appropriate formats, or\
    \ automating deployment of code into production systems, for example, uploading\
    \ to a website via a `git push` or similar content-tracking method.\n\nAn example\
    \ `Makefile` for a simple software project might look something like the below:\n\
    \n```\nall: example\n\nexample: main.o example.o library.o\n    gcc main.o example.o\
    \ library.o -o example\n\nmain.o: main.c\n    gcc -c main.c -o main.o\n\nexample.o:\
    \ example.c\n    gcc -c example.c -o example.o\n\nlibrary.o: library.c\n    gcc\
    \ -c library.c -o library.o\n\nclean:\n    rm *.o example\n\ninstall: example\n\
    \    cp example /usr/bin\n```\n\nThe above isn’t the most optimal `Makefile` possible\
    \ for this project, but it provides a means to build and install a linked binary\
    \ simply by typing `make`. Each `target` definition contains a list of the `dependencies`\
    \ required for the command that follows; this means that the definitions can appear\
    \ in any order, and the call to `make` will call the relevant commands in the\
    \ appropriate order.\n\nMuch of the above is needlessly verbose or repetitive;\
    \ for example, if an object file is built directly from a single C file of the\
    \ same name, then we don’t need to include the target at all, and `make` will\
    \ sort things out for us. Similarly, it would make sense to put some of the more\
    \ repeated calls into variables so that we would not have to change them individually\
    \ if our choice of compiler or flags changed. A more concise version might look\
    \ like the following:\n\n```\nCC = gcc\nOBJECTS = main.o example.o library.o\n\
    BINARY = example\n\nall: example\n\nexample: $(OBJECTS)\n    $(CC) $(OBJECTS)\
    \ -o $(BINARY)\n\nclean:\n    rm -f $(BINARY) $(OBJECTS)\n\ninstall: example\n\
    \    cp $(BINARY) /usr/bin\n```\n\n## More general uses of `make`\n\nIn the interests\
    \ of automation, however, it’s instructive to think of this a bit more generally\
    \ than just code compilation and linking. An example could be for a simple web\
    \ project involving deploying PHP to a live webserver. This is not normally a\
    \ task people associate with the use of `make`, but the principles are the same;\
    \ with the source in place and ready to go, we have certain targets to meet for\
    \ the build.\n\nPHP files don’t require compilation, of course, but web assets\
    \ often do. An example that will be familiar to web developers is the generation\
    \ of scaled and optimised raster images from vector source files, for deployment\
    \ to the web. You keep and version your original source file, and when it comes\
    \ time to deploy, you generate a web-friendly version of it.\n\nLet’s assume for\
    \ this particular project that there’s a set of four icons used throughout the\
    \ site, sized 64 by 64 pixels. We have the source files in SVG format, safely\
    \ tucked away in version control, and now need to `generate` smaller bitmaps for\
    \ the site. We could therefore define a target `icons`, set the dependencies,\
    \ and type out the commands to perform. This is where command line tools in Unix\
    \ really begin to shine in use with `Makefile`:\n\n```\nicons: create.png read.png\
    \ update.png delete.png\n\ncreate.png: create.svg\n    convert create.svg create.raw.png\
    \ && \\\n    pngcrush create.raw.png create.png\n\nread.png: read.svg\n    convert\
    \ read.svg read.raw.png && \\\n    pngcrush read.raw.png read.png\n\nupdate.png:\
    \ update.svg\n    convert update.svg update.raw.png && \\\n    pngcrush update.raw.png\
    \ update.png\n\ndelete.png: delete.svg\n    convert delete.svg delete.raw.png\
    \ && \\\n    pngcrush delete.raw.png delete.png\n```\n\nWith the above done, typing\
    \ `make icons` will go through each of the source icons files in a Bash loop,\
    \ convert them from SVG to PNG using ImageMagick’s `convert`, and optimise them\
    \ with `pngcrush`, to produce images ready for upload.\n\nA similar approach can\
    \ be used for generating help files in various forms, for example, generating\
    \ HTML files from Markdown source:\n\n```\ndocs: README.html credits.html\n\n\
    README.html: README.md\n    markdown README.md > README.html\n\ncredits.html:\
    \ credits.md\n    markdown credits.md > credits.html\n```\n\nAnd perhaps finally\
    \ deploying a website with `git push web`, but only *after* the icons are rasterized\
    \ and the documents converted:\n\n```\ndeploy: icons docs\n    git push web\n\
    ```\n\nFor a more compact and abstract formula for turning a file of one suffix\
    \ into another, you can use the `.SUFFIXES` pragma to define these using special\
    \ symbols. The code for converting icons could look like this; in this case, `$<`\
    \ refers to the source file, `$*` to the filename with no extension, and `$@`\
    \ to the target.\n\n```\nicons: create.png read.png update.png delete.png\n\n\
    .SUFFIXES: .svg .png\n\n.svg.png:\n    convert $< $*.raw.png && \\\n    pngcrush\
    \ $*.raw.png $@\n```\n"
  raw: "But to use the script as a *logical binary*, so you can invoke it directly\
    \ without knowing or caring what the script is, you can add a special first line\
    \ to the file called the “shebang” that does some magic to specify the interpreter\
    \ through which the file should be run.\n\n```\n#!/usr/bin/env perl\nprint \"\
    Hello, world.\\n\";\n```\n\nThe script then needs to be made executable with a\
    \ `chmod` call. It’s also good practice to rename it to remove the extension,\
    \ since it is now taking the shape of a logic binary:\n\n```\n$ mv hello{.pl,}\n\
    $ chmod +x hello\n```\n\nAnd can thereafter be invoked directly, as if it were\
    \ a compiled binary:\n\n```\n$ ./hello\n```\n\nThis works so well that many of\
    \ the common utilities on modern Linux systems, such as the `adduser` frontend\
    \ to `useradd`, are actually Perl or even Python scripts.\n\nIn the next post,\
    \ I’ll describe the use of `make` for defining and automating building projects\
    \ in a manner comparable to IDEs, with a nod to newer takes on the same idea with\
    \ Ruby’s `rake`.\n\n# Building\n\nBecause compiling projects can be such a complicated\
    \ and repetitive process, a good IDE provides a means to abstract, simplify, and\
    \ even automate software builds. Unix and its descendents accomplish this process\
    \ with a `Makefile`, a prescribed recipe in a standard format for generating executable\
    \ files from source and object files, taking account of changes to only rebuild\
    \ what’s necessary to prevent costly recompilation.\n\nOne interesting thing to\
    \ note about `make` is that while it’s generally used for compiled software build\
    \ automation and has many shortcuts to that effect, it can actually effectively\
    \ be used for any situation in which it’s required to generate one set of files\
    \ from another. One possible use is to generate web-friendly optimised graphics\
    \ from source files for deployment for a website; another use is for generating\
    \ static HTML pages from code, rather than generating pages on the fly. It’s on\
    \ the basis of this more flexible understanding of software “building” that modern\
    \ takes on the tool like [Ruby’s `rake`](http://rake.rubyforge.org/) have become\
    \ popular, automating the general tasks for producing and installing code and\
    \ files of all kinds.\n\n## Anatomy of a `Makefile`\n\nThe general pattern of\
    \ a `Makefile` is a list of variables and a list of *targets*, and the sources\
    \ and/or objects used to provide them. Targets may not necessarily be linked binaries;\
    \ they could also constitute actions to perform using the generated files, such\
    \ as `install` to instate built files into the system, and `clean` to remove built\
    \ files from the source tree.\n\nIt’s this flexibility of targets that enables\
    \ `make` to automate any sort of task relevant to assembling a production build\
    \ of software; not just the typical parsing, preprocessing, compiling proper and\
    \ linking steps performed by the compiler, but also running tests (`make test`),\
    \ compiling documentation source files into one or more appropriate formats, or\
    \ automating deployment of code into production systems, for example, uploading\
    \ to a website via a `git push` or similar content-tracking method.\n\nAn example\
    \ `Makefile` for a simple software project might look something like the below:\n\
    \n```\nall: example\n\nexample: main.o example.o library.o\n    gcc main.o example.o\
    \ library.o -o example\n\nmain.o: main.c\n    gcc -c main.c -o main.o\n\nexample.o:\
    \ example.c\n    gcc -c example.c -o example.o\n\nlibrary.o: library.c\n    gcc\
    \ -c library.c -o library.o\n\nclean:\n    rm *.o example\n\ninstall: example\n\
    \    cp example /usr/bin\n```\n\nThe above isn’t the most optimal `Makefile` possible\
    \ for this project, but it provides a means to build and install a linked binary\
    \ simply by typing `make`. Each *target* definition contains a list of the *dependencies*\
    \ required for the command that follows; this means that the definitions can appear\
    \ in any order, and the call to `make` will call the relevant commands in the\
    \ appropriate order.\n\nMuch of the above is needlessly verbose or repetitive;\
    \ for example, if an object file is built directly from a single C file of the\
    \ same name, then we don’t need to include the target at all, and `make` will\
    \ sort things out for us. Similarly, it would make sense to put some of the more\
    \ repeated calls into variables so that we would not have to change them individually\
    \ if our choice of compiler or flags changed. A more concise version might look\
    \ like the following:\n\n```\nCC = gcc\nOBJECTS = main.o example.o library.o\n\
    BINARY = example\n\nall: example\n\nexample: $(OBJECTS)\n    $(CC) $(OBJECTS)\
    \ -o $(BINARY)\n\nclean:\n    rm -f $(BINARY) $(OBJECTS)\n\ninstall: example\n\
    \    cp $(BINARY) /usr/bin\n```\n\n## More general uses of `make`\n\nIn the interests\
    \ of automation, however, it’s instructive to think of this a bit more generally\
    \ than just code compilation and linking. An example could be for a simple web\
    \ project involving deploying PHP to a live webserver. This is not normally a\
    \ task people associate with the use of `make`, but the principles are the same;\
    \ with the source in place and ready to go, we have certain targets to meet for\
    \ the build.\n\nPHP files don’t require compilation, of course, but web assets\
    \ often do. An example that will be familiar to web developers is the generation\
    \ of scaled and optimised raster images from vector source files, for deployment\
    \ to the web. You keep and version your original source file, and when it comes\
    \ time to deploy, you generate a web-friendly version of it.\n\nLet’s assume for\
    \ this particular project that there’s a set of four icons used throughout the\
    \ site, sized to 64 by 64 pixels. We have the source files to hand in SVG vector\
    \ format, safely tucked away in version control, and now need to *generate* the\
    \ smaller bitmaps for the site, ready for deployment. We could therefore define\
    \ a target `icons`, set the dependencies, and type out the commands to perform.\
    \ This is where command line tools in Unix really begin to shine in use with `Makefile`\
    \ syntax:\n\n```\nicons: create.png read.png update.png delete.png\n\ncreate.png:\
    \ create.svg\n    convert create.svg create.raw.png && \\\n    pngcrush create.raw.png\
    \ create.png\n\nread.png: read.svg\n    convert read.svg read.raw.png && \\\n\
    \    pngcrush read.raw.png read.png\n\nupdate.png: update.svg\n    convert update.svg\
    \ update.raw.png && \\\n    pngcrush update.raw.png update.png\n\ndelete.png:\
    \ delete.svg\n    convert delete.svg delete.raw.png && \\\n    pngcrush delete.raw.png\
    \ delete.png\n```\n\nWith the above done, typing `make icons` will go through\
    \ each of the source icons files in a Bash loop, convert them from SVG to PNG\
    \ using ImageMagick’s `convert`, and optimise them with `pngcrush`, to produce\
    \ images ready for upload.\n\nA similar approach can be used for generating help\
    \ files in various forms, for example, generating HTML files from Markdown source:\n\
    \n```\ndocs: README.html credits.html\n\nREADME.html: README.md\n    markdown\
    \ README.md > README.html\n\ncredits.html: credits.md\n    markdown credits.md\
    \ > credits.html\n```\n\nAnd perhaps finally deploying a website with `git push\
    \ web`, but only *after* the icons are rasterized and the documents converted:\n\
    \n```\ndeploy: icons docs\n    git push web\n```\n\nFor a more compact and abstract\
    \ formula for turning a file of one suffix into another, you can use the `.SUFFIXES`\
    \ pragma to define these using special symbols. The code for converting icons\
    \ could look like this; in this case, `$<` refers to the source file, `$*` to\
    \ the filename with no extension, and `$@` to the target.\n\n```\nicons: create.png\
    \ read.png update.png delete.png\n\n.SUFFIXES: .svg .png\n\n.svg.png:\n    convert\
    \ $< $*.raw.png && \\\n    pngcrush $*.raw.png $@\n```\n\n## Tools for building\
    \ a `Makefile`"
