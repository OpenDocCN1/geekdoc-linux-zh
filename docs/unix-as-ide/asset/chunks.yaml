  trans: "\n但为了将脚本作为一个`logical binary`（逻辑二进制文件）使用，以便你可以直接调用它而无需知道或关心脚本内容，你可以在文件开头添加特殊的行，称为“shebang”（解释字节），它会通过一些魔法操作来指定运行该文件的解释器。\n\
    \n```\n#!/usr/bin/env perl\nprint \"Hello, world.\\n\";\n```\n\n然后需要通过调用 `chmod`\
    \ 来将脚本设为可执行。将它重命名以移除扩展名也是一个良好的习惯，因为现在它呈现出逻辑二进制文件的形式了：\n\n```\n$ mv hello{.pl,}\n\
    $ chmod +x hello\n```\n\n此后就可以直接调用它，就像它是编译后的二进制文件一样：\n\n```\n$ ./hello\n```\n\n\
    这种方法非常有效，以至于现代 Linux 系统上的许多常用工具（例如 `useradd` 的前端工具 `adduser`）实际上都是 Perl 甚至是 Python\
    \ 脚本。\n\n在下一篇文章中，我将描述如何使用 `make` 来定义和自动化构建项目，其方式可以与 IDE 相比，并顺带提到 Ruby 的 `rake`\
    \ 对这一理念的新新实现。\n\n# 构建 (Building)\n\n由于编译项目可能是一个非常复杂且重复的过程，一个良好的 IDE 提供了一种抽象、简化甚至自动化软件构建的手段。Unix\
    \ 及其后代通过 `Makefile` 实现这一过程，`Makefile` 是一种标准格式的规定配方，用于从源文件和对象文件生成可执行文件，它只针对变化的部分重新构建需要的内容，以防止昂贵的重复编译。\n\
    \n关于 `make` 需要注意的一个有趣点是，虽然它通常用于编译型软件的构建自动化并有许多快捷方式，但它实际上可以有效地用于任何需要从一组文件生成另一组文件的情况。可能的用途是从源文件生成用于网站部署的\
    \ Web 友好型优化图形；另一种用途是从代码生成静态 HTML 页面，而不是动态地生成页面。正是基于这种对软件“构建”更灵活的理解，现代对该工具的变体（如\
    \ [Ruby 的 `rake`](http://rake.rubyforge.org/)）才变得流行，它们自动化了生产和安装各种代码和文件的通用任务。\n\
    \n## `Makefile` 的结构\n\n`Makefile` 的通用模式是变量列表、`targets`（目标）列表，以及提供这些目标的源文件和/或对象。目标并不一定是链接后的二进制文件；它们也可以构成使用生成文件来执行的操作，例如\
    \ `install` 将构建好的文件安装到系统中，以及 `clean` 从源码树中移除构建好的文件。\n\n正是这种目标的灵活性使得 `make` 能够自动化任何与组装软件生产构建相关的任务；不仅是编译器执行的典型解析、预处理、正式编译和链接步骤，还运行测试（`make\
    \ test`）、将文档源文件编译成一个或多个适当格式，或者自动化将代码部署到生产系统（例如通过 `git push` 或类似的内容跟踪方法上传到网站）。\n\
    \n一个简单软件项目的 `Makefile` 示例可能如下：\n\n```\nall: example\n\nexample: main.o example.o\
    \ library.o\n    gcc main.o example.o library.o -o example\n\nmain.o: main.c\n\
    \    gcc -c main.c -o main.o\n\nexample.o: example.c\n    gcc -c example.c -o\
    \ example.o\n\nlibrary.o: library.c\n    gcc -c library.c -o library.o\n\nclean:\n\
    \    rm *.o example\n\ninstall: example\n    cp example /usr/bin\n```\n\n上面的并不是该项目最优的\
    \ `Makefile`，但它提供了一种通过输入 `make` 来构建和安装链接二进制文件的方法。每个 `target` 定义都包含后续命令所需的 `dependencies`（依赖项）列表；这意味着定义可以以任何顺序出现，而\
    \ `make` 的调用将按相应的顺序调用相关命令。\n\n上述许多内容是多余的冗长或重复的；例如，如果对象文件是直接从同名的单个 C 文件构建的，那么我们不需要包含该目标，`make`\
    \ 会为我们处理好。同样，将一些更重复的调用放入变量中是有意义的，这样当我们选择编译器或标志发生变化时，就不需要逐个修改它们。一个更简洁的版本可能如下：\n\
    \n```\nCC = gcc\nOBJECTS = main.o example.o library.o\nBINARY = example\n\nall:\
    \ example\n\nexample: $(OBJECTS)\n    $(CC) $(OBJECTS) -o $(BINARY)\n\nclean:\n\
    \    rm -f $(BINARY) $(OBJECTS)\n\ninstall: example\n    cp $(BINARY) /usr/bin\n\
    ```\n\n## `make` 更通用的用途\n\n然而，出于自动化的考虑，将其更宽泛地思考为不仅仅是代码编译和链接是有启发的。一个例子可以是涉及将 PHP\
    \ 部署到实时 Web 服务器的简单 Web 项目。这通常不是人们与使用 `make` 关联起来的任务，但原理是相同的；只要源码就位并准备就绪，我们就有构建需要满足的某些目标。\n\
    \n当然，PHP 文件不需要编译，但 Web 资产通常需要。Web 开发者熟悉的一个示例是从矢量源文件生成缩放并优化的位图图像，以便部署到网络。你保留并版本化你的原始源文件，当需要部署时，你为其生成一个\
    \ Web 友好的版本。\n\n假设对于这个特定项目，有一组全站使用的四个图标，大小为 64x64 像素。我们有 SVG 格式的源文件安全地存储在版本控制中，现在需要为网站生成位图。因此，我们可以定义一个\
    \ `icons` 目标，设置依赖项，并写出执行的命令。这就是 Unix 命令行工具在 `Makefile` 中开始大发光热的地方：\n\n```\nicons:\
    \ create.png read.png update.png delete.png\n\ncreate.png: create.svg\n    convert\
    \ create.svg create.raw.png && \\\n    pngcrush create.raw.png create.png\n\n\
    read.png: read.svg\n    convert read.svg read.raw.png && \\\n    pngcrush read.raw.png\
    \ read.png\n\nupdate.png: update.svg\n    convert update.svg update.raw.png &&\
    \ \\\n    pngcrush update.raw.png update.png\n\ndelete.png: delete.svg\n    convert\
    \ delete.svg delete.raw.png && \\\n    pngcrush delete.raw.png delete.png\n```\n\
    \n完成上述操作后，输入 `make icons` 将遍历每个图标文件，使用 ImageMagick 的 `convert` 将其转换为 PNG，并使用 `pngcrush`\
    \ 进行优化，从而产生用于上传的图像。\n\n类似的方法也可以用于生成各种格式的帮助文件，例如从 Markdown 生成 HTML 文件：\n\n```\n\
    docs: README.html credits.html\n\nREADME.html: README.md\n    markdown README.md\
    \ > README.html\n\ncredits.html: credits.md\n    markdown credits.md > credits.html\n\
    ```\n\n最后通过 `git push web` 部署网站，但要在图标光栅化和文档转换*之后*：\n\n```\ndeploy: icons docs\n\
    \    git push web\n```\n\n对于将一种后缀的文件转换为另一种文件的更紧凑、抽象的公式，可以使用 `.SUFFIXES` 指令通过特殊符号来定义这些。转换图标的代码可能如下；在这种情况下，`$<`\
    \ 指向源文件，`$*`指向不带扩展的文件名，而 `$@` 指向目标。\n\n```\nicons: create.png read.png update.png\
    \ delete.png\n\n.SUFFIXES: .svg .png\n\n.svg.png:\n    convert $< $*.raw.png &&\
    \ \\\n    pngcrush $*.raw.png $@\n```\n"
- fmt: "\nA variety of tools exist in the GNU Autotools toolchain for the construction\
    \ of `configure` scripts and `make` files for larger software projects at a higher\
    \ level, in particular [`autoconf`](http://en.wikipedia.org/wiki/Autoconf) and\
    \ [`automake`](http://en.wikipedia.org/wiki/Automake). The use of these tools\
    \ allows generating `configure` scripts and `make` files covering very large source\
    \ bases, reducing the necessity of building otherwise extensive makefiles manually,\
    \ and automating steps taken to ensure the source remains compatible and compilable\
    \ on a variety of operating systems.\n\nCovering this complex process would be\
    \ a series of posts in its own right, and is out of scope of this survey.\n\n\
    *Thanks to user samwyse for the `.SUFFIXES` suggestion in the comments.*\n\n#\
    \ Debugging\n\nWhen unexpected behaviour is noticed in a program, Linux provides\
    \ a wide variety of command-line tools for diagnosing problems. The use of `gdb`,\
    \ the GNU debugger, and related tools like the lesser-known Perl debugger, will\
    \ be familiar to those using IDEs to set breakpoints in their code and to examine\
    \ program state as it runs. Other tools of interest are available however to observe\
    \ in more detail how a program is interacting with a system and using its resources.\n\
    \n## Debugging with `gdb`\n\nYou can use `gdb` in a very similar fashion to the\
    \ built-in debuggers in modern IDEs like Eclipse and Visual Studio. If you are\
    \ debugging a program that you’ve just compiled, it makes sense to compile it\
    \ with its `debugging symbols` added to the binary, which you can do with a `gcc`\
    \ call containing the `-g` option. If you’re having problems with some code, it\
    \ helps to also use `-Wall` to show any errors you may have otherwise missed:\n\
    \n```\n$ gcc -g -Wall example.c -o example\n```\n\nThe classic way to use `gdb`\
    \ is the shell for a running program compiled in C or C++, to allow you to inspect\
    \ the program’s state as it proceeds towards its crash.\n\n```\n$ gdb example\n\
    ...\nReading symbols from /home/tom/example...done.\n(gdb)\n```\n\nAt the `(gdb)`\
    \ prompt, you can type `run` to start the program, and it may provide you with\
    \ more detailed information about the causes of errors such as segmentation faults,\
    \ including the source file and line number at which the problem occurred. If\
    \ you’re able to compile the code with debugging symbols as above and inspect\
    \ its running state like this, it makes figuring out the cause of a particular\
    \ bug a lot easier.\n\n```\n(gdb) run\nStarting program: /home/tom/gdb/example\
    \ \n\nProgram received signal SIGSEGV, Segmentation fault.\n0x000000000040072e\
    \ in main () at example.c:43\n43     printf(\"%d\\n\", *segfault);\n```\n\nAfter\
    \ an error terminates the program within the `(gdb)` shell, you can type `backtrace`\
    \ to see what the calling function was, which can include the specific parameters\
    \ passed that may have something to do with what caused the crash.\n\n```\n(gdb)\
    \ backtrace\n#0  0x000000000040072e in main () at example.c:43\n```\n\nYou can\
    \ set breakpoints for `gdb` using the `break` to halt the program’s run if it\
    \ reaches a matching line number or function call:\n\n```\n(gdb) break 42\nBreakpoint\
    \ 1 at 0x400722: file example.c, line 42.\n(gdb) break malloc\nBreakpoint 1 at\
    \ 0x4004c0\n(gdb) run\nStarting program: /home/tom/gdb/example \n\nBreakpoint\
    \ 1, 0x00007ffff7df2310 in malloc () from /lib64/ld-linux-x86-64.so.2\n```\n\n\
    Thereafter it’s helpful to `step` through successive lines of code using `step`.\
    \ You can repeat this, like any `gdb` command, by pressing Enter repeatedly to\
    \ step through lines one at a time:\n\n```\n(gdb) step\nSingle stepping until\
    \ exit from function _start,\nwhich has no line number information.\n0x00007ffff7a74db0\
    \ in __libc_start_main () from /lib/x86_64-linux-gnu/libc.so.6\n```\n\nYou can\
    \ even attach `gdb` to a process that is already running, by finding the process\
    \ ID and passing it to `gdb`:\n\n```\n$ pgrep example\n1524\n$ gdb -p 1524\n```\n\
    \nThis can be useful for [redirecting streams of output](http://stackoverflow.com/questions/593724/redirect-stderr-stdout-of-a-process-after-its-been-started-using-command-lin)\
    \ for a task that is taking an unexpectedly long time to run.\n\n## Debugging\
    \ with `valgrind`\n\nThe much newer [valgrind](http://valgrind.org/) can be used\
    \ as a debugging tool in a similar way. There are many different checks and debugging\
    \ methods this program can run, but one of the most useful is its `Memcheck` tool,\
    \ which can be used to detect common memory errors like buffer overflow:\n\n```\n\
    $ valgrind --leak-check=yes ./example\n==29557== Memcheck, a memory error detector\n\
    ==29557== Copyright (C) 2002-2011, and GPL'd, by Julian Seward.\n==29557== Valgrind-3.7.0,\
    \ rerun with -h for info\n==29557== Command: ./example\n==29557== \n==29557==\
    \ Invalid read of size 1\n==29557== at 0x40072E: main (example.c:43)\n==29557==\
    \ Address 0 is not stack'd, malloc'd or (recently) free'd\n==29557== \n```\n\n\
    The `gdb` and `valgrind` tools [can be used together](http://valgrind.org/manual/core)\
    \ for a thorough survey of a program’s run. Zed’s [Learn C the Hard Way](http://codetheway.org/)\
    \ includes a really good introduction for elementary use of `gdb` with a deliberately\
    \ broken program.\n\n## Tracing system and library calls with `ltrace`\n\nThe\
    \ `strace` and `ltrace` tools are designed to allow watching system calls and\
    \ library calls respectively for running programs, and logging them to the screen,\
    \ or usefully, to files. You can run `ltrace` and have it run the program you\
    \ want to monitor in this way by simply providing it as the sole parameter. It\
    \ will then give you a listing of all the system and library calls it makes until\
    \ it exits.\n\n```\n$ ltrace ./example\n__libc_start_main(0x4006ad, 1, 0x7fff9d7e5838,\
    \ 0x400770, srand(4, 0x7fff9d7e5838, 0x7fff9d7e548, 0, 0x7ff3aeb320) = 0\nmalloc(24)\
    \                                                  = 0x0107010\nrand(0, 0x1070020,\
    \ 0, 0x1070000, 0x7ff3aeb60)            = 0x754eddd\nmalloc(24)              \
