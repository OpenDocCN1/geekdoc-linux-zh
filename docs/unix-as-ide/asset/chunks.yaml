    \ 24, 0, 0x1070080, 0x7ff3aebec8)      = 0x1b6d0f3\nmalloc(24)               \
    \                                   = 0x01070b0\nrand(0x7ff3aeb60, 24, 0, 0x10700a0,\
    \ 0x7ff3aebec8)      = 0x2e19c49\nmalloc(24)                                 \
    \                 = 0x01070d0\nrand(0x7ff3aeb60, 24, 0, 0x10700c0, 0x7ff3aebec8)\
    \      = 0x35bc1a99\nmalloc(24)                                              \
    \    = 0x01070f0\nrand(0x7ff3aeb60, 24, 0, 0x10700e0, 0x7ff3aebec8)      = 0x53b8d61b\n\
    malloc(24)                                                  = 0x0107110\nrand(0x7ff3aeb60,\
    \ 24, 0, 0x1070100, 0x7ff3aebec8)      = 0x18e0f924\nmalloc(24)              \
    \                                    = 0x0107130\nrand(0x7ff3aeb60, 24, 0, 0x1070120,\
    \ 0x7ff3aebec8)      = 0x27a51979\n--- SIGSEGV (Segmentation fault) ---\n+++ killed\
    \ by SIGSEGV +++\n```\n\nYou can also attach it to a process that’s already running:\n\
    \n```\n$ pgrep example\n5138\n$ ltrace -p 5138\n```\n\nGenerally, there’s quite\
    \ a bit more than a couple of screenfuls of text generated by this, so it’s helpful\
