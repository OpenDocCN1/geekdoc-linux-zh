    ![](img/unix-as-ide-cover.png)


    # Unix 作为 IDE


    ## Tom Ryder


    © 2015 Tom Ryder, CC BY-NC-SA


    最初发布于 [Arabesque](http://blog.sanctum.geek.nz/series/unix-as-ide/)


    电子书由 [mrzool](http://mrzool.cc) 构建


    # 引言


    无论是新手还是经验丰富的专业程序员都赞同 IDE（或[集成开发环境](http://en.wikipedia.org/wiki/Integrated_development_environment）的概念。在一个集成了所有不同工具通用接口的应用程序中，拥有组织、编写、维护、测试和调试代码的主要工具，无疑是一项非常有价值的资产。此外，专门为各种语言编程而设计的环境还提供如自动补全、语法检查和高亮等优势。


    随着包括 Linux 和 BSD 在内的所有主流桌面操作系统上的开发者可以使用此类工具，而且其中许多是免费的，实际上没有什么理由用 Windows 记事本或通过
    `nano` 或 `cat` 来编写代码。


    然而，在 Unix 及其现代衍生品的支持者中，流传着一个小梗，即“Unix 就是一个 IDE”，这意味着开发者在终端上可用的工具可以轻松地涵盖尖端桌面 IDE
    的主要功能。人们对此意见相当分歧，但无论你认为将 Unix 称为与 Eclipse 或 Microsoft Visual Studio 同等意义的 IDE
    是否合理，这个简陋的 Bash shell 所能提供的多么全面的开发环境，可能会让你感到惊讶。


    ## Unix 如何成为 IDE 的？


    使用 IDE 的首要理由是它将所有工具聚集在同一个地方，你可以用大致相同的用户界面范式协同使用它们，而无需花费过多精力让不同的应用程序相互配合。这种需求在
    GUI 应用程序中变得格尤为迫切，因为要让窗口化应用程序使用同一种语言或良好地协同工作非常困难；除了剪贴文本之外，它们并不共享`共同接口`。


    对于 shell 用户来说，这个问题的有趣之处在于，设计良好且经久考验的 Unix 工具已经通过`文本流`和`文件作为持久化对象`共享了通用的用户界面，换句话说，就是“万物皆文件”这一公理。Unix
    中的几乎一切都是围绕这这两个概念构建的，而正是这种通用的用户界面，结合拥有四十年历史的高性能工具（其用户和开发者特别看重互操作性），使得 Unix 变得像完整的
    IDE 一样强大。


    ## 正确的想法


    这种态度并不是那些饱经沙场的 Unix 老兵的专利；你可以从另一种形式看到，两个古老文本编辑器 Emacs 和 Vi（GNU Emacs 和 Vim）的现代变体拥有如此活跃的社区来开发插件，使其支持几乎任何类型的编辑任务。在这两个编辑器中，插件可以完成你在编程中真正想做的几乎任何事情，而且像任何
    Vim 狂迷一样，我可以列出至少六七个我认为“必不可少”的插件。


    然而，当我读到这些努力时，我经常明显感觉到，相关的开发者正试图将这些文本编辑器变成它们自己的 IDE。有关于[永远不需要离开 Vim](http://kevinw.github.com/2010/12/15/this-is-your-brain-on-vim/)或[永远不需要离开
    Emacs](http://news.ycombinator.com/item?id=819447)的帖子。但我认为，试图将 Vim 或 Emacs 硬挤成它们本身不是的东西，并不是以正确的方式思考问题。Vim
    的作者 Bram Moolenaar 似乎在某种程度上同意这一点，你可以通过阅读[`:help design-not`](http://vimdoc.sourceforge.net/htmldoc/develop.html#design-not)
    看到。shell 只有一个 Ctrl+Z 的距离，它成熟且高度可组合的工具集将为你提供比任何编辑器都无法提供的力量。


    ## 关于本系列


    在这一系列文章中，我将介绍 IDE 的六个主要功能，并示例说明 Linux 中提供的常用工具如何让你轻松地一起使用它们。这绝不是一个全面的调查，我演示的工具也不是唯一的选择。


    *   **文件和项目管理** — `ls`, `find`, `grep`/`ack`, `bash`

    *   **文本编辑器和编辑工具** — `vim`, `awk`, `sort`, `column`

    *   **编译器和/或解释器** — `gcc`, `perl`

    *   **构建工具** — `make`

    *   **调试器** — `gdb`, `valgrind`, `ltrace`, `lsof`, `pmap`

    *   **版本控制** — `diff`, `patch`, `svn`, `git`


    ## 我不是想说的


    我不认为 IDE 是坏的；我认为它们很棒，这就是为什么我试图说服你 Unix 可以被当作 IDE 使用，或者至少被视为 IDE。我不会说 Unix 总是任何编程任务的最佳工具；可以说，对于
    C、C++、Python、Perl 或 Shell 开发，它比 Java 或 C# 等更“行业”语言更合适，尤其是在编写依赖 GUI 的应用程序时。特别是，我不会试图说服你放弃辛苦苦得的
    Eclipse 或 Microsoft Visual Studio 知识，转进入有时晦涩的命令行世界。我只想向你展示我们在围栏的另一侧在做什么。


    # 文件


    IDE 的一个显著特性是内置的用于管理的系统，包括移动、重命名、删除以及编译和语法检查等。在第一篇文章中，我将探索一些 Linux 用户熟悉的工具使用方法。


    ## 列出文件


    使用 `ls` 可能是管理员学习的第一个命令，用于获取内容的简单列表。大多数管理员也会 `-a` 和 `-l` 选项，用于显示所有文件以及显示详细数据。GNU
    `ls` 还有其他较少使用的选项，其中某些在编程中被证明非常有用：


    *   `-t` — 按最后修改日期列出文件，最新的在前。这对于想要获取最近更改的文件列表的大型目录非常有用，可能配合 `head` 或 `sed` 使用。

    *   `-X` — 按扩展名分组；对于多语言代码非常方便，可以将头文件和源文件分开，或者将源文件与目录或构建文件分开。

    *   `-v` — 自然排序文件名中的版本号。

    *   `-S` — 按文件大小排序。

    *   `-R` — 递归列出文件。这个配合 `less` 等分页器效果良好。


    由于列表与其他任何文本一样，例如你可以将此命令的输出管道到 `vim` 进程，这样就可以添加每个文件的用途并将其保存为 `inventory` 文件或添加到
    README 中：


    ```

    $ ls -XR | vim -

    ```


    这种事情通过少量工作就可以通过 `make` 实现，我将在系列后续文章中介绍。


    ## 查找文件


    有趣的是，只需输入不带参数的 `find` 即可获得包含相对路径的完整文件列表，尽管将其管道到 `sort` 通常是个好主意：


    ```

    $ find | sort

    .

    ./Makefile

    ./README

    ./build

    ./client.c

    ./client.h

    ./common.h

    ./project.c

    ./server.c

    ./server.h

    ./tests

    ./tests/suite1.pl

    ./tests/suite2.pl

    ./tests/suite3.pl

    ./tests/suite4.pl

    ```


    如果你想要 `ls -l` 风格的列表，可以在 `find` 结果中添加 `-ls` 作为动作。


