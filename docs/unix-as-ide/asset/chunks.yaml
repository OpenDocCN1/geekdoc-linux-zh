    output of this command into a `vim` process, so you could add explanations of
    what each file is for and save it as an `inventory` file or add it to a README:


    ```

    $ ls -XR | vim -

    ```


    This kind of stuff can even be automated by `make` with a little work, which I’ll
    cover in another article later in the series.


    ## Finding files


    Funnily enough, you can get a complete list of files including relative paths
    with no decoration by simply typing `find` with no arguments, though it’s usually
    a good idea to pipe it through `sort`:


    ```

    $ find | sort

    .

    ./Makefile

    ./README

    ./build

    ./client.c

    ./client.h

    ./common.h

    ./project.c

    ./server.c

    ./server.h

    ./tests

    ./tests/suite1.pl

    ./tests/suite2.pl

    ./tests/suite3.pl

    ./tests/suite4.pl

    ```


    If you want an `ls -l` style listing, you can add `-ls` as the action to `find`
