    to do pretty much anything you could really want to do in programming in both
    editors, and like any Vim junkie I could spout off at least six or seven that
    I feel are “essential”.


    However, it often becomes apparent to me when reading about these efforts that
    the developers concerned are trying to make these text editors into IDEs in their
    own right. There are posts about [never needing to leave Vim](http://kevinw.github.com/2010/12/15/this-is-your-brain-on-vim/),
    or [never needing to leave Emacs](http://news.ycombinator.com/item?id=819447).
