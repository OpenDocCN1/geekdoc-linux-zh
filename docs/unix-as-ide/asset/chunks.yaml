    \ `pmap` 查看特定进程的内存分配：\n\n```\n# pmap 30779 \n30779:   /usr/sbin/apache2 -k start\n\
    00007fdb3883e000     84K r-x--  /lib/x86_64-linux-gnu/libgcc_s.so.1 (deleted)\n\
    00007fdb38853000   2048K -----  /lib/x86_64-linux-gnu/libgcc_s.so.1 (deleted)\n\
    00007fdb38a53000      4K rw---  /lib/x86_64-linux-gnu/libgcc_s.so.1 (deleted)\n\
    00007fdb38a54000      4K -----    [ anon ]\n00007fdb38a55000   8192K rw---   \
    \ [ anon ]\n00007fdb392e5000     28K r-x--  /usr/lib/php5/20090626/pdo_mysql.so\n\
    00007fdb392ec000   2048K -----  /usr/lib/php5/20090626/pdo_mysql.so\n00007fdb394ec000\
    \      4K r----  /usr/lib/php5/20090626/pdo_mysql.so\n00007fdb394ed000      4K\
    \ rw---  /usr/lib/php5/20090626/pdo_mysql.so\n...\ntotal           152520K\n```\n\
    \n这将向你运行进程正在使用哪些库，包括共享内存中的库。底部给出的总数有点误导性，因为对于加载的共享库，运行进程并不是唯一使用该内存的进程；[确定给定进程的“实际”内存占用](http://stackoverflow.com/questions/118307/a-way-to-determine-a-processs-real-memory-usage-i-e-private-dirty-rss)\
    \ 在引入共享库后，比看起来要复杂得多。\n\n# 修订\n\n版本控制现在被视为专业软件开发中不可或缺的一部分，像 Eclipse 和 Visual Studio\
    \ 这样的 GUI IDE 已经接受了它，并在产品中包含了对行业标准版本控制系统的支持。然而，现代版本控制系统的谱源可以追溯到 `diff` 和 `patch`\
    \ 等程序的 Unix 概念，而且有许多人坚持使用版本控制系统的最佳方法仍然是在 shell 提示符下。\n\n在[Unix as an IDE 系列](http://blog.sanctum.geek.nz/series/unix-as-ide/)的最后一篇文章中，我将遵循常见开源版本控制系统的演变，从最早的版本控制工具之一\
    \ `diff` 和 `patch` 的基本概念开始。\n\n## `diff`、`patch` 和 RCS\n\n版本控制系统的核心概念是*统一差异 (unified\
    \ diff)*，该文件以人类和计算机可读的术语表示对一个或多个文件所作的更改。`diff` 命令由 Douglas McIlroy 在 1974 年首次为\
    \ Unix 第 5 版发布，因此它是现代系统中仍在在使用的最古老的命令之一。\n\n*统一差异*是最常见且互操作性最好的格式，可以通过以下语法比较文件的两个版本来生成：\n\
    \n```\n$ diff -u example.{1,2}.c\n--- example.c.1    2012-02-15 20:15:37.000000000\
    \ +1300\n+++ example.c.2    2012-02-15 20:15:57.000000000 +1300\n@@ -1,8 +1,9\
    \ @@\n #include <stdio.h>\n+#include <stdlib.h>\n \n int main (int argc, char*\
    \ argv[]) {\n-    printf(\"Hello, world!\\n\");\n-    return 0;\n+    printf(\"\
    Hello, world!\\n\");\n+    return EXIT_SUCCESS;\n }\n```\n（注：上面的代码块是根据文中描述的 `unified\
    \ diff` 逻辑重建的，因为原始输入中的代码块是不完整的。）\n"
- fmt: "\n```\n$ rcsdiff -u -r1.1 -r1.2 ./example.c \n===================================================================\n\
    RCS file: ./example.c,v\nretrieving revision 1.1\nretrieving revision 1.2\ndiff\
    \ -u -r1.1 -r1.2\n--- ./example.c 2012/02/15 07:36:23 1.1\n+++ ./example.c 2012/02/15\
    \ 07:39:16 1.2\n@@ -4,6 +4,7 @@\n int main (int argc, char* argv[])\n {\n    \
    \ printf(\"Hello, world!\\n\");\n+    printf(\"Extra line!\\n\");\n     return\
    \ EXIT_SUCCESS;\n }\n```\n\nIt would be misleading to imply that simple patches\
    \ were now in disuse as a method of version control; they are still very commonly\
    \ used in the forms above, and also figure prominently in both centralised and\
    \ decentralised version control systems.\n\n## CVS and Subversion\n\nTo handle\
    \ the problem of resolving changes made to a code base by multiple developers,\
    \ `centralized version systems` were developed, with the [Concurrent Versions\
    \ System (CVS)](http://en.wikipedia.org/wiki/Concurrent_Versions_System) developed\
    \ first and the slightly more advanced [Subversion](http://en.wikipedia.org/wiki/Apache_Subversion)\
    \ later on. The central feature of these systems are using a `central server`\
    \ that contains the repository, from which authoritative versions of the codebase\
    \ at any particular time or revision can be retrieved. These are termed `working\
    \ copies` of the code.\n\nFor these systems, the basic unit of the systems remained\
    \ the `changeset`, and the most common way to represent these to the user was\
    \ in the archetypal `diff` format used in earlier systems. Both systems work by\
    \ keeping records of these changesets, rather than the actual files themselves\
    \ from state to state.\n\nOther concepts introduced by this generation of systems\
    \ were of `branching` projects so that separate instances of the same project\
    \ could be worked on concurrently, and then merged into the mainline, or `trunk`\
    \ with appropriate testing and review. Similarly, the concept of `tagging` was\
    \ introduced to flag certain revisions as representing the state of a codebase\
    \ at the time of a release of the software. The concept of the `merge` was also\
    \ introduced; reconciling conflicting changes made to a file manually.\n\n## Git\
    \ and Mercurial\n\nThe next generation of version control systems are `distributed`\
    \ or `decentralized` systems, in which working copies of the code themselves contain\
    \ a complete history of the project, and are hence not reliant on a central server\
    \ to contribute to the project. In the open source, Unix-friendly environment,\
    \ the standout systems are Git and Mercurial, with their client programs `git`\
    \ and `hg`.\n\nFor both of these systems, the concept of communicating changesets\
    \ is done with the operations `push`, `pull` and `merge`; changes from one repository\
    \ are accepted by another. This decentralized system allows for a very complex\
    \ but tightly controlled ecosystem of development; Git was originally developed\
    \ by Linus Torvalds to provide an open-source DVCS capable of managing development\
    \ for the Linux kernel.\n\nBoth Git and Mercurial differ from CVS and Subversion\
    \ in that the basic unit for their operations is not changesets, but complete\
    \ files (blobs) saved using compression. This makes finding the log history of\
    \ a single file or the differences between two revisions of a file slightly more\
    \ expensive, but the output of `git log --patch` still retains the familiar unified\
    \ `diff` output for each revision, some forty years after `diff` was first being\
    \ used:\n\n```\ncommit c1e5559ddb09f8d02b989596b0f4100ad1aab422\nAuthor: Tom Ryder\
    \ <tom@sanctum.geek.nz>\nDate:   Thu Feb 2 01:14:21 2012\n\nChanged my mind about\
    \ this one.\n\ndiff --git a/vim/vimrc b/vim/vimrc index cfbe8e0..65a3143 100644\n\
    --- a/vim/vimrc\n+++ b/vim/vimrc\n@@ -47,10 +47,6 @@\n set shiftwidth=4\n set\
    \ softtabstop=4\n set tabstop=4\n\n-\" Heresy\n-inoremap <C-a> <Home>\n-inoremap\
    \ <C-e> <End>\n-\n \" History\n set history=1000\n```\n\nThe two systems have\
    \ considerable overlap in functionality and even in command set, and the question\
    \ of which to use provokes [considerable debate](http://stackoverflow.com/questions/35837/what-is-the-difference-between-mercurial-and-git).\
    \ The best introductions I’ve seen to each are [Pro Git](http://progit.org/) by\
    \ Scott Chacon, and [Hg Init](http://hginit.com/) by Joel Spolsky.\n\n## Conclusion\n\
    \nThis is the last post in the [Unix as IDE series](http://blog.sanctum.geek.nz/series/unix-as-ide/);\
    \ I’ve tried to offer a rapid survey of the basic tools available just within\
    \ a shell on Linux for all of the basic functionality afforded by professional\
    \ IDEs. At points I’ve had to be not quite thorough as I’d like in explaining\
    \ certain features, but to those unfamiliar to development on Linux machines this\
    \ will all have hopefully given some idea of how comprehensive a development environment\
    \ the humble shell can be, and all with free, highly mature, and standard software\
    \ tools.\n"
