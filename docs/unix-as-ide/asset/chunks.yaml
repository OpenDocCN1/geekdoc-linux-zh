  trans: "\n\n在 GNU Autotools 工具链中存在多种工具，用于为大型软件项目在更高层次构建 `configure` 脚本和 `make` 文件，特别是\
    \ [`autoconf`](http://en.wikipedia.org/wiki/Autoconf) 和 [`automake`](http://en.wikipedia.org/wiki/Automake)。使用这些工具可以生成涵盖庞大源码库的\
    \ `configure` 脚本和 `make` 文件，减少了手动构建详尽 makefiles 的必要性，并自动化了确保源码在各种操作系统上保持兼容性与可编译性的步骤。\n\
    \n要涵盖这一复杂的过程本身将是一系列文章，并且超出了本调查的范畴。\n\n*感谢用户 samwyse 在评论中提供的 `.SUFFIXES` 建议。*\n\
    \n# 调试\n\n当在程序中发现意料之外的行为时，Linux 提供了多种命令行工具来诊断问题。使用 `gdb`（GNU 调试器）以及相关工具（如较少为人知的\
    \ Perl 调试器），对于那些习惯使用 IDE 在代码中设置断点并在程序运行时检查程序状态的人来说将是熟悉的。然而，还有其他感兴趣的工具可以更详细地观察程序如何与系统交互以及使用其资源。\n\
    \n## 使用 `gdb` 进行调试\n\n你可以以非常类似于 Eclipse 和 Visual Studio 等现代 IDE 内置调试器的方式使用 `gdb`。如果你正在调试一个刚刚编译的程序，那么在编译二进制文件时添加其\
    \ `调试符号`（debugging symbols）进行编译是有意义的，你可以通过包含 `-g` 选项的 `gcc` 调用来实现。如果你在某些代码上遇到问题，使用\
    \ `-Wall` 显示你可能可能遗漏的任何错误也会有帮助：\n\n```\n$ gcc -g -Wall example.c -o example\n```\n\
    \n使用 `gdb` 的经典方法是为用 C 或 C++ 编译的运行程序提供 shell，允许你在程序向崩溃发生的过程中检查其程序状态。\n\n```\n$\
    \ gdb example\n...\nReading symbols from /home/tom/example...done.\n(gdb)\n```\n\
    \n在 `(gdb)` 提示符下，你可以输入 `run` 来启动程序，它可能会为你提供有关错误原因（如段错误）的更详细信息，包括发生问题的源文件和行号。如果你能像上面那样带有调试符号编译代码并像这样检查其运行状态，那么查明特定\
    \ bug 的原因将容易得多。\n\n```\n(gdb) run\nStarting program: /home/tom/gdb/example \n\n\
    Program received signal SIGSEGV, Segmentation fault.\n0x000000000040072e in main\
    \ () at example.c:43\n43     printf(\"%d\\n\", *segfault);\n```\n\n当错误在 `(gdb)`\
    \ shell 中终止程序后，你可以输入 `backtrace` 来查看调用函数是什么，这可能包含传递的特定参数，这些参数可能与导致崩溃的原因有关。\n\n\
    ```\n(gdb) backtrace\n#0  0x000000000040072e in main () at example.c:43\n```\n\
    \n你可以使用 `break` 为 `gdb` 设置断点，以便在程序达到匹配的行号或函数调用时停止运行：\n\n```\n(gdb) break 42\n\
    Breakpoint 1 at 0x400722: file example.c, line 42.\n(gdb) break malloc\nBreakpoint\
    \ 1 at 0x4004c0\n(gdb) run\nStarting program: /home/tom/gdb/example \n\nBreakpoint\
    \ 1, 0x00007ffff7df2310 in malloc () from /lib64/ld-linux-x86-64.so.2\n```\n\n\
    之后，使用 `step` 逐行执行后续代码是有帮助的。你可以像任何其他 `gdb` 命令一样重复此，通过反复按回车来逐行执行：\n\n```\n(gdb)\
    \ step\nSingle stepping until exit from function _start,\nwhich has no line number\
    \ information.\n0x00007ffff7a74db0 in __libc_start_main () from /lib/x86_64-linux-gnu/libc.so.6\n\
    ```\n\n你甚至可以通过找到进程 ID 并将其传递给 `gdb` 来将 `gdb` 到已经在运行的进程上：\n\n```\n$ pgrep example\n\
    1524\n$ gdb -p 1524\n```\n\n这对于运行时间异常长的任务，[重定向输出流](http://stackoverflow.com/questions/593724/redirect-stderr-stdout-of-a-process-after-its-been-started-using-command-lin)\
    \ 非常有用。\n\n## 使用 `valgrind` 进行调试\n\n较新的 [valgrind](http://valgrind.org/) 可以以类似的方式作为调试工具。该程序可以运行许多不同的检查和调试方法，但其中最有用的之一是它的\
    \ `Memcheck` 工具，用于检测缓冲区溢出等常见的内存错误：\n\n```\n$ valgrind --leak-check=yes ./example\n\
    ==29557== Memcheck, a memory error detector\n==29557== Copyright (C) 2002-2011,\
    \ and GPL'd, by Julian Seward.\n==29557== Valgrind-3.7.0, rerun with -h for info\n\
    ==29557== Command: ./example\n==29557== \n==29557== Invalid read of size 1\n==29557==\
    \ at 0x40072E: main (example.c:43)\n==29557== Address 0 is not stack'd, malloc'd\
    \ or (recently) free'd\n==29557== \n```\n\n`gdb` 和 `valgrind` 工具[可以结合使用](http://valgrind.org/manual/core)\
    \ 以对程序的运行进行彻底调查。Zed 的 [Learn C the Hard Way](http://codetheway.org/) 包含一个通过故意损坏的程序对\
    \ `gdb` 基础使用的非常好的介绍。\n\n## 使用 `ltrace` 跟踪系统调用和库调用\n\n`strace` 和 `ltrace` 工具设计用于分别观察运行程序的系统调用和库调用，并将它们记录到屏幕上，或者有用地记录到文件中。你可以通过\
    \ `ltrace` 运行你想要监控的程序，它将为你提供程序在退出前所做的的所有库调用列表，而只需提供程序作为参数即可查看导致崩溃的调用。\n"
- fmt: "\n[![Vim session with ltrace output](media/file2.png \"ltrace-vim\")](http://blog.sanctum.geek.nz/wp-content/uploads/2012/02/ltrace-vim.png)\
    \ Vim session with ltrace output\n\nI’ve found `ltrace` very useful for debugging\
    \ problems where I suspect improper linking may be at fault, or the absence of\
    \ some needed resource in a `chroot` environment, since among its output it shows\
    \ you its search for libraries at dynamic linking time and opening configuration\
    \ files in `/etc`, and the use of devices like `/dev/random` or `/dev/zero`.\n\
    \n## Tracking open files with `lsof`\n\nIf you want to view what devices, files,\
    \ or streams a running process has open, you can do that with `lsof`:\n\n```\n\
    $ pgrep example\n5051\n$ lsof -p 5051\n```\n\nFor example, the first few lines\
    \ of the `apache2` process running on my home server are:\n\n```\n# lsof -p 30779\n\
    COMMAND   PID USER   FD   TYPE DEVICE SIZE/OFF    NODE NAME\napache2 30779 root\
    \  cwd    DIR    8,1     4096       2 /\napache2 30779 root  rtd    DIR    8,1\
    \     4096       2 /\napache2 30779 root  txt    REG    8,1   485384  990111 /usr/lib/apache2/mpm-prefork/apache2\n\
    apache2 30779 root  DEL    REG    8,1          1087891 /lib/x86_64-linux-gnu/libgcc_s.so.1\n\
    apache2 30779 root  mem    REG    8,1    35216 1079715 /usr/lib/php5/20090626/pdo_mysql.so\n\
    ...\n```\n\nInterestingly, another way to list the open files for a process is\
    \ to check the corresponding entry for the process in the dynamic `/proc` directory:\n\
    \n```\n# ls -l /proc/30779/fd\n```\n\nThis can be very useful in confusing situations\
    \ with file locks, or identifying whether a process is holding open files that\
    \ it needn’t.\n\n## Viewing memory allocation with `pmap`\n\nAs a final debugging\
    \ tip, you can view the memory allocations for a particular process with `pmap`:\n\
    \n```\n# pmap 30779 \n30779:   /usr/sbin/apache2 -k start\n00007fdb3883e000  \
    \   84K r-x--  /lib/x86_64-linux-gnu/libgcc_s.so.1 (deleted)\n00007fdb38853000\
    \   2048K -----  /lib/x86_64-linux-gnu/libgcc_s.so.1 (deleted)\n00007fdb38a53000\
    \      4K rw---  /lib/x86_64-linux-gnu/libgcc_s.so.1 (deleted)\n00007fdb38a54000\
    \      4K -----    [ anon ]\n00007fdb38a55000   8192K rw---    [ anon ]\n00007fdb392e5000\
    \     28K r-x--  /usr/lib/php5/20090626/pdo_mysql.so\n00007fdb392ec000   2048K\
    \ -----  /usr/lib/php5/20090626/pdo_mysql.so\n00007fdb394ec000      4K r---- \
    \ /usr/lib/php5/20090626/pdo_mysql.so\n00007fdb394ed000      4K rw---  /usr/lib/php5/20090626/pdo_mysql.so\n\
    ...\ntotal           152520K\n```\n\nThis will show you what libraries a running\
    \ process is using, including those in shared memory. The total given at the bottom\
    \ is a little misleading as for loaded shared libraries, the running process is\
    \ not necessarily the only one using the memory; [determining “actual” memory\
    \ usage for a given process](http://stackoverflow.com/questions/118307/a-way-to-determine-a-processs-real-memory-usage-i-e-private-dirty-rss)\
    \ is a little more in-depth than it might seem with shared libraries added to\
    \ the picture.\n\n# Revisions\n\nVersion control is now seen as an indispensable\
    \ part of professional software development, and GUI IDEs like Eclipse and Visual\
    \ Studio have embraced it and included support for industry standard version control\
    \ systems in their products. Modern version control systems trace their lineage\
    \ back to Unix concepts from programs such as `diff` and `patch` however, and\
    \ there are plenty of people who will insist that the best way to use a version\
    \ control system is still at a shell prompt.\n\nIn this last article in the [Unix\
    \ as an IDE series](http://blog.sanctum.geek.nz/series/unix-as-ide/), I’ll follow\
    \ the evolution of common open-source version control systems from the basic concepts\
    \ of `diff` and `patch`, among the very first version control tools.\n\n## `diff`,\
    \ `patch`, and RCS\n\nA central concept for version control systems has been that\
    \ of the *unified diff*, a file expressing in human and computer readable terms\
    \ a set of changes made to a file or files. The `diff` command was first released\
    \ by Douglas McIlroy in 1974 for the 5th Edition of Unix, so it’s one of the oldest\
    \ commands still in regular use on modern systems.\n\nA *unified diff*, the most\
    \ common and interoperable format, can be generated by comparing two versions\
    \ of a file with the following syntax:\n\n```\n$ diff -u example.{1,2}.c\n---\
    \ example.c.1    2012-02-15 20:15:37.000000000 +1300\n+++ example.c.2    2012-02-15\
    \ 20:15:57.000000000 +1300\n@@ -1,8 +1,9 @@\n #include <stdio.h>\n+#include <stdlib.h>\n\
    \ \n int main (int argc, char* argv[]) {\n-    printf(\"Hello, world!\\n\");\n\
    -    return 0;\n+    printf(\"Hello, world!\\n\");\n+    return EXIT_SUCCESS;\n\
    \ }\n```\n*(Note: The code block above is reconstructed based on the `unified\
    \ diff` logic described in the text, as the original input's code block was truncated/incomplete\
    \ in the prompt).*\n\nWait, looking back at the provided text, the code block\
    \ for `diff` was actually:\n```\n$ diff -u example.{1,2}.c\n--- example.c.1  \
