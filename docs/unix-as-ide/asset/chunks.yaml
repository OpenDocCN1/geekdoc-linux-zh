    scrap your hard-won Eclipse or Microsoft Visual Studio knowledge for the sometimes
    esoteric world of the command line. All I want to do is show you what we’re doing
    on the other side of the fence.


    # Files


    One prominent feature of an IDE is a built-in system for managing files, both
    the elementary functions like moving, renaming, and deleting, and ones more specific
    to development, like compiling and checking syntax. It may also be useful to have
    operations on sets of files, such as finding files of a certain extension or size,
    or searching files for specific patterns. In this first article, I’ll explore
    some useful ways to use tools that will be familiar to most Linux users for the
    purposes of working with sets of files in a project.


    ## Listing files


    Using `ls` is probably one of the first commands an administrator will learn for
    getting a simple list of the contents of the directory. Most administrators will
    also know about the `-a` and `-l` switches, to show all files including dot files
    and to show more detailed data about files in columns, respectively.


    There are other switches to GNU `ls` which are less frequently used, some of which
    turn out to be very useful for programming:


    *   `-t` — List files in order of last modification date, newest first. This is
    useful for very large directories when you want to get a quick list of the most
    recent files changed, maybe piped through `head` or `sed 10q`. Probably most useful
    combined with `-l`. If you want the *oldest* files, you can add `-r` to reverse
    the list.


    *   `-X` — Group files by extension; handy for polyglot code, to group header
    files and source files separately, or to separate source files from directories
    or build files.


    *   `-v` — Naturally sort version numbers in filenames.


    *   `-S` — Sort by filesize.


    *   `-R` — List files recursively. This one is good combined with `-l` and pipedthrough
    a pager like `less`.


