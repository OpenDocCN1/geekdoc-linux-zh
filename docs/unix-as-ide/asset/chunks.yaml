    ## About this series


    In this series of posts, I will be going through six major features of an IDE,
    and giving examples showing how common tools available in Linux allow you to use
    them together with ease. This will by no means be a comprehensive survey, nor
    are the tools I will demonstrate the only options.


    *   **File and project management** — `ls`, `find`, `grep`/`ack`, `bash`


    *   **Text editor and editing tools** — `vim`, `awk`, `sort`, `column`


    *   **Compiler and/or interpreter** — `gcc`, `perl`


    *   **Build tools** — `make`


    *   **Debugger** — `gdb`, `valgrind`, `ltrace`, `lsof`, `pmap`


    *   **Version control** — `diff`, `patch`, `svn`, `git`


    ## What I’m not trying to say


    I don’t think IDEs are bad; I think they’re brilliant, which is why I’m trying
    to convince you that Unix can be used as one, or at least thought of as one. I’m
    also not going to say that Unix is always the best tool for any programming task;
