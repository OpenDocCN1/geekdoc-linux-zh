    \ 20:15:57.000000000 +1300\n@@ -1,8 +1,9 @@\n #include <stdio.h>\n+#include <stdlib.h>\
    \ \n\n int main (int argc, char* argv[]) { printf(\"Hello, world!\\n\");\n-  \
    \  return 0;\n+    return EXIT_SUCCESS; }\n```\n\nIn this example, the second\
    \ file has a header file added, and the call to `return` changed to use the standard\
    \ `EXIT_SUCCESS` rather than a literal `0` as the return value for `main()`. Note\
    \ that the output for `diff` also includes metadata such as the filename that\
    \ was changed and the last modification time of each of the files.\n\nA primitive\
    \ form of version control for larger code bases was thus for developers to trade\
    \ `diff` output, called *patches* in this context, so that they could be applied\
    \ to one another’s code bases with the `patch` tool. We could save the output\
    \ from `diff` above as a patch like so:\n\n```\n$ diff -u example.{1,2}.c > example.patch\n\
    ```\n\nWe could then send this patch to a developer who still had the old version\
    \ of the file, and they could automatically apply it with:\n\n```\n$ patch example.1.c\
    \ < example.patch\n```\n\nA patch can include `diff` output from more than one\
    \ file, including within subdirectories, so this provides a very workable way\
    \ to apply changes to a source tree.\n\nThe operations involved in using `diff`\
    \ output to track changes were sufficiently regular that for keeping in-place\
    \ history of a file, the [Source Code Control System](http://en.wikipedia.org/wiki/Source_Code_Control_System)\
    \ and the [Revision Control System](http://en.wikipedia.org/wiki/Revision_Control_System)\
    \ that has pretty much replaced it were developed. RCS enabled “locking” files\
    \ so that they could not be edited by anyone else while “checked out” of the system,\
    \ paving the way for other concepts in more developed version control systems.\n\
    \nRCS retains the advantage of being very simple to use. To place an existing\
    \ file under version control, one need only type `ci <filename>` and provide an\
    \ appropriate description for the file:\n\n```\n$ ci example.c\nexample.c,v  <--\
    \  example.c\nenter description, terminated with single '.' or end of file:\n\
    NOTE: This is NOT the log message!\n>> example file\n>> .\ninitial revision: 1.1\n\
    done\n```\n\nThis creates a file in the same directory, `example.c,v`, that will\
    \ track the changes. To make changes to the file, you *check it out*, make the\
    \ changes, then *check it back in*:\n\n```\n$ co -l example.c\nexample.c,v  -->\
    \  example.c\nrevision 1.1 (locked)\ndone\n$ vim example.c\n$ ci -u example.c\n\
    example.c,v  <--  example.c\nnew revision: 1.2; previous revision: 1.1\nenter\
    \ log message, terminated with single '.' or end of file:\n>> added a line\n>>\
    \ .\ndone\n```\n\nYou can then view the history of a project with `rlog`:\n\n\
    ```\n$ rlog example.c\n\nRCS file: example.c,v\nWorking file: example.c\nhead:\
    \ 1.2\nbranch:\nlocks: strict\naccess list:\nsymbolic names:\nkeyword substitution:\
    \ kv\ntotal revisions: 2; selected revisions: 2\ndescription:\nexample file\n\
    ----------------------------\nrevision 1.2\ndate: 2012/02/15 07:39:16;  author:\
    \ tom;  state: Exp;  lines: +1 -0\nadded a line\n----------------------------\n\
    revision 1.1\ndate: 2012/02/15 07:36:23;  author: tom;  state: Exp;\nInitial revision\n\
    =============================================================================\n\
    ```\n\nAnd get a patch in unified `diff` format between two revisions with `rcsdiff\
    \ -u`:"
