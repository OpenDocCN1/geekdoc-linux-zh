    \ files:\n\n- `find -name '*.c'` — Find files with names matching a shell-style\
    \ pattern. Use `-iname` for a case-insensitive search.\n- `find -path '*test*'`\
    \ — Find files with paths matching a shell-style pattern. Use `-ipath` for a case-insensitive\
    \ search.\n- `find -mtime -5` — Find files edited within the last five days. You\
    \ can use `+5` instead to find files edited before five days ago.\n- `find -newer\
    \ server.c` — Find files more recently modified than `server.c`.\n- `find -type\
    \ d` — Find directories. For files, use `-type f`; for symbolic links, use `-type\
    \ l`.\n\nNote, in particular, that all of these can be combined, for example to\
    \ find C source files edited in the last two days:\n\n```\n$ find -name '*.c'\
    \ -mtime -2\n```\n\nBy default, the action `find` takes for search results is\
    \ simply to list them on standard output, but there are several other useful actions:\n\
    \n- `-ls` — Provide an `ls -l` style listing, as above\n- `-delete` — Delete matching\
    \ files\n- `-exec` — Run an arbitrary command line on each file, replacing `{}`\
    \ with the appropriate filename, and terminated by `\\;`; for example:\n\n```\n\
    $ find -name '*.pl' -exec perl -c {} \\;\n```\n\nYou can use `+` as the terminating\
    \ character instead if you want to put all the results on one invocation of the\
    \ command. One trick I find myself using often is using `find` to generate lists\
    \ of files that I then edit in vertically split Vim windows:\n\n```\n$ find -name\
    \ '*.c' -exec vim {} +\n```\n\nEarlier versions of Unix as IDE suggested the use\
    \ of `xargs` with `find` results. In most cases this should not really be necessary,\
    \ and it’s more robust to handle filenames with whitespace using `-exec` or a\
    \ `while read -r` loop.\n\n## Searching files\n\nMore often than attributes of\
    \ a set of files, however, you want to find files based on their contents, and\
    \ it’s no surprise that `grep`, in particular `grep -R`, is useful here. This\
    \ searches the current directory tree recursively for anything matching `someVar`:\n\
    \n```\n$ grep -FR someVar .\n```\n\nDon’t forget the case insensitivity flag either,\
    \ since:\n\n```\n$ grep -FR someVar .\n```\n\n# Editing\n\nThe text editor is\
    \ the core tool for any programmer, which is why choice of editor evokes such\
    \ tongue-in-cheek zealotry in debate among programmers. Unix is the operating\
    \ system most strongly linked with two enduring favourites, Emacs and Vi, and\
    \ their modern versions in GNU Emacs and Vim, two editors with very different\
    \ editing philosophies but comparable power.\n\nBeing a Vim heretic myself, here\
    \ I’ll discuss the indispensable features of Vim for programming, and in particular\
    \ the use of Linux shell tools called within Vim to complement the editor’s built-in\
    \ functionality. Some of the principles discussed here will be applicable to those\
    \ using Emacs as well, but probably not for underpowered editors like Nano.\n\n\
    This will be a very general survey, as Vim’s toolset for programmers is enormous,\
    \ and it’ll still end up being long. I’ll focus on the essentials and the things\
    \ I feel are most helpful, and try to provide links to articles with a more comprehensive\
    \ treatment of the topic. Don’t forget that Vim’s `:help` has surprised many people\
    \ new to the editor with its high quality and usefulness.\n\n## Filetype detection\n\
    \nVim has built-in settings to adjust its behaviour, in particular its syntax\
    \ highlighting, based on the filetype being loaded, which it happily detects and\
    \ generally does a good job at doing so. In particular, this allows you to set\
    \ an indenting style conformant with the way a particular language is usually\
    \ written. This should be one of the first things in your `.vimrc` file.\n\n```\n\
    if has(\"autocmd\")\n  filetype on\n  filetype indent on\n  filetype plugin on\n\
    endif\n```\n"
