    Press Enter or type command to continue

    ```


    The `%` symbol is shorthand for the file loaded in the current buffer. Running
    this prints the output of the command, if any, below the command line. If you
    wanted to call this check often, you could perhaps map it as a command, or even
    a key combination in your `.vimrc` file. In this case, we define a command `:PerlLint`
    which can be called from normal mode with `\l`:


    ```

    command PerlLint !perl -c %

    nnoremap <leader>l :PerlLint<CR>

    ```


    For a lot of languages there’s an even better way to do this, though, which allows
    us to capitalise on Vim’s built-in quickfix window. We can do this by setting
    an appropriate `makeprg` for the filetype, in this case including a module that
    provides us with output that Vim can use for its quicklist, and a definition for
    its two formats:


    ```

    :set makeprg=perl\ -c\ -MVi::QuickFix\ %

    :set errorformat+=%m\ at\ %f\ line\ %l\.

    :set errorformat+=%m\ at\ %f\ line\ %l

    ```


    You may need to install this module first via CPAN, or the Debian package `libvi-quickfix-perl`.
    This done, you can type `:make` after saving the file to check its syntax, and
    if errors are found, you can open the quicklist window with `:copen` to inspect
    the errors, and `:cn` and `:cp` to jump to them within the buffer.


    [![Vim quickfix working on a Perl file](media/file0.png "vim-quickfix")](http://blog.sanctum.geek.nz/wp-content/uploads/2012/02/vim-quickfix.png)
    Vim quickfix working on a Perl file


    This also works for output from [`gcc`](http://tldp.org/HOWTO/C-editing-with-VIM-HOWTO/quickfix.html),
    and pretty much any other compiler syntax checker that you might want to use that
    includes filenames, line numbers, and error strings in its error output. It’s
    even possible to do this with [web-focused languages like PHP](http://stackoverflow.com/questions/7193547/debugging-php-with-vim-using-quickfix),
    and for tools like [JSLint for JavaScript](https://github.com/hallettj/jslint.vim).
    There’s also an excellent plugin named [Syntastic](http://www.vim.org/scripts/script.php?script_id=2736)
    that does something similar.


    ## Reading output from other commands


    You can use `:r!` to call commands and paste their output directly into the buffer
    with which you’re working. For example, to pull a quick directory listing for
    the current folder into the buffer, you could type:


    ```

    :r!ls

    ```


    This doesn’t just work for commands, of course; you can simply read in other files
    this way with just `:r`, like public keys or your own custom boilerplate:


    ```

    :r ~/.ssh/id_rsa.pub

    :r ~/dev/perl/boilerplate/copyright.pl

    ```


    ## Filtering output through other commands


    You can extend this to actually filter text in the buffer through external commands,
    perhaps selected by a range or visual mode, and replace it with the command’s
    output. While Vim’s visual block mode is great for working with columnar data,
    it’s very often helpful to bust out tools like `column`, `cut`, `sort`, or `awk`.


    For example, you could sort the entire file in reverse by the second column by
    typing:


    ```

    :%!sort -k2 -r

    ```


    You could print only the third column of some selected text where the line matches
    the pattern `/vim/` with:


    ```

    :''<,''>!awk ''/vim/ {print $3}''

    ```


    You could arrange keywords from lines 1 to 10 in nicely formatted columns like:


    ```

    :1,10!column -t

    ```


    Really *any kind* of text filter or command can be manipulated like this in Vim,
    a simple interoperability feature that expands what the editor can do by an order
    of magnitude. It effectively makes the Vim buffer into a text stream, which is
    a language that all of these classic tools speak.


    ## Built-in alternatives


    It’s worth noting that for really common operations like sorting and searching,
    Vim has built-in methods in `:sort` and `:grep`, which can be helpful if you’re
    stuck using Vim on Windows, but don’t have nearly the adaptability of shell calls.


    ## Diffing


    Vim has a *diffing* mode, `vimdiff`, which allows you to not only view the differences
    between different versions of a file, but also to resolve conflicts via a three-way
    merge and to replace differences to and fro with commands like `:diffput` and
    `:diffget` for ranges of text. You can call `vimdiff` from the command line directly
    with at least two files to compare like so:


    ```

    $ vimdiff file-v1.c file-v2.c

    ```


