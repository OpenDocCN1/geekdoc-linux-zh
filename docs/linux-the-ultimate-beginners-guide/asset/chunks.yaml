    Bash 提供了一个预装的 `time` 命令，用于显示执行进程所需的时间。该工具兼具准确性和多功能性——你可以用它来获取任何命令的精确数据。为了帮助你理解
    `time` 命令，下面提供了一张截图：


    ![](img/00011.jpeg)


    在这个示例中，`time` 命令用于计算创建一个特定 `.pdf` 文件所需的时间。结果显示该过程耗时 1 分钟 41 秒。


    目录 `/usr/bin` 包含一个 GNU 版本的 `time` 命令（这与预装的 BASH 工具不同）。该命令可以显示更多数据，并用于多种方式。此外，它还会显示命令的退出状态和总运行时间。当与
    GNU `time` 命令配合使用时，上述示例提供了这些结果：


    ![](img/00012.jpeg)


    如果你想了解更多关于这些时间命令，可以检查系统的 `Info` 页面。


    ## 性能


    对于普通用户来说，“卓越性能”指的是进程快速且正确的执行。然而，对于系统管理员来说，这些词具有更深层的含义：管理员需要最大化整个系统的性能，包括守护进程、程序和用户。通常，系统性能可能取决于许多未被
    `time` 命令评估的“微不足道”因素。以下是这些“微不足道”因素的一些示例：


    * 对驱动器、显示器、控制器、接口等的访问。

    * 运行的程序设计不当，或没有有效利用计算机资源。

    * 系统中活跃用户的数量。

    * 一天中的时间。

    * 远程网络的可用性。


    ## 负载


    基本上，负载取决于对你的网络来说什么是常态。例如，一台运行防火墙、文件服务器、SSH 服务器、路由守护进程、代理服务器、sendmail 服务器和其他设备的旧
    P133 可以支持最多 7 个活跃用户。在这种情况下，负载仍然为零。某些系统（特别是具有多个处理器的系统）可以轻松支持多达 67 个用户。


    识别网络负载的方法只有一个：定期进行检查。这样，你就会知道你的网络中什么是常态。如果你不使用这种方法，只能通过命令的响应时间来判断系统负载。响应时间缺乏准确性——由于各种因素的影响，它是并不可靠的。


    记住，即使具有相同的平均负载，不同网络的行为也不同。例如，如果网络拥有支持硬件加速的显卡，它可以流畅地渲染 3D 图像。然而，使用旧 VGA 卡的网络在渲染图像时会像乌龟一样慢。旧系统在启动
    X 服务器时可能非常慢，而现代系统则甚至“感觉”不到增加的负载。


    ## 优先级


    任务的重要性（或优先级）由其 nice 值决定。高 nice 值的任务对其他用户、其他任务以及网络本身是“协作”的（或是“友好”的）：它们是低优先级任务。低
    nice 值表示其所属的任务很重要，并将将消耗更多的系统资源。


    你可以通过给任务一个更高的 nice 值来使其变得“更友好”。然而，这种技术仅对需要大量 CPU 时间的进程（例如软件编译器）有效。持续利用大量 I/O 时间的进程会被赋予较低的
    nice 值（即更高的优先级）。例如，键盘输入在计算机网络中始终获得最高优先级。


    你可以使用 `nice` 命令设置程序的重要性。


    许多系统提供了一个名为 `BSD renice` 的命令。该命令允许用户编辑活动程序的“友好度”。你可以检查你操作系统的手册，以确定该命令是否可用。


    ## CPU 资源


    在每个操作系统上，许多进程都需要同时使用计算机的 CPU。即使你是唯一的活跃用户也是如此。每个进程都需要特定数量的 CPU 资源才能正常运行。有时，由于 CPU
    处理许多请求，计算机程序可能无法获得资源。如果你想优化计算机，就需要了解可用的系统资源。你可以使用工具来获取这些数据。


    `Uptime` 是你可以在 Linux 中使用的命令之一，它缺乏准确性（它只能显示平均值，你需要识别出正常数值），但在某些情况下是有用的。以下是你可以采取的提高
    CPU 效率的一些措施：


    * 停止系统执行不必要的任务。停止你没有使用的程序和守护进程。你可以使用 `locate` 命令来实现此。

    * 在系统负载处于低水平时运行资源密集型进程。通常，你应该在夜运行“重量级”进程。

    * 优先运行低优先级任务。


    如果这些方法不能解决你的问题，你可能需要一个更好的 CPU。对于 Linux 系统来说，这是系统管理员的工作。


    ## 用户


    在 Linux 系统中，根据使用系统资源的方式，可以将计算机用户分为不同的类型。以下是 Linux 用户的三种类型：


    * 运行大量小进程的人。一个很好的例子是没有经验的 Linux 用户。

    * 运行几个（但很复杂的）进程的人。这种类型的例子是运行模拟器、计算和仿真的人。

    * 运行少数需要大量 CPU 时间的进程的人（例如游戏开发者）。


    正如你看到的，每种类型的用户系统要求不同。此外，要满足网络中所有用户的需求是非常困难的。如果你属于多用户网络，识别同事的习惯是有益的（而且很有趣）。


    ## 可视化工具


    对于图形环境，你在监控工具方面有广泛的选择。这里是名为 `Gnome System Monitor` 工具的截图。该工具可以发现并显示活动任务的信息。此外，它还可以监控系统资源。


    ![](img/00013.jpeg)


    大多数 Linux 系统都有一些用的图标（例如负载、磁盘等的监控器），你可以将其安装到任务栏上。


    # 第 5 章：I/O 重定向


    本章将解释输入、输出和错误的重定向机制。I/O（输入/输出）重定向最初是为 Unix 系统开发的一种机制。


    ## 简单重定向


    ### 标准输入和标准输出


    许多 Linux 命令会扫描输入（例如文件或命令属性）并产生输出。通常，输入是通过键盘输入的，输出是通过计算机显示器显示的。键盘被视为标准输入设备（也称为
    `stdin`）。显示器和终端窗口被视为标准输出设备（也称为 `stdout`）。


    然而，由于 Linux 系统是多功能的，你不必应用这些默认设置。例如，打印机可以作为某些网络的标准输出设备。


    ### 用于 I/O 重定向的运算符


    #### 使用 "|" 和 ">" 重定向输出


    在某些情况下，你需要将进程的输出保存为单独的文件。或者，你可能需要在完成进程的输出上运行命令。这被称为输出重定向。这种重定向通过使用 `|` 或 `>` 运算符来实现。这些运算符将进程的输出作为输入传输给另一个进程。


    在这里，你可以使用 `cat` 命令合并文件并作为标准输出。当将输出重定向到新文件时，将创建此文件名——如果它已存在，则会覆盖。这意味着你应该小心处理 I/O
    重定向。这里有一张截图：


    ![](img/00014.jpeg)


    使用重定向将“空”保存到现有文件类似于清空该文件：


    ![](img/00015.jpeg)


    此过程被称为截断。


    使用重定向到不存在的文件将生成新的空文件。这里是一个示例：


