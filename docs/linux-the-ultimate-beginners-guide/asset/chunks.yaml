    ### 基础


    ### 基础命令


    在本节中，你将学习一些快速上手命令（也称为快速命令）。你需要这些命令来使用 Linux。


    * `is` —— 显示当前所在目录的一组文件。这类似于 DOS 系统中的 `dir` 命令。

    * `passwd` —— 更改当前用户的密码。

    * `pwd` —— 显示当前工作目录。

    * `cd directory` —— 切换目录。

    * `man command` —— 读取 `command` 的帮助页。

    * `logout 或 exit` —— 允许你离开当前会话。

    * `info command` —— 读取 `command` 的 Info 页。

    * `file filename` —— 显示名为 `filename` 的文件类型。

    * `apropos string` —— 使用 what is 数据库搜索字符串。


