    在使用 `VIM` 时，你可以通过键盘输入命令。这意味着你可以让手停留在键盘上，眼睛直视电脑屏幕。你不需要移动鼠标，因此使用这个工具既简单又方便。然而，如果你更倾向于使用鼠标，可以通过工具的配置页面来激活它。


    # 如何使用 VIM 编辑器


    `VIM` 是一个强大的工具，包含了一份详细的预装手册。要访问该手册，你可以在 `VIM` 运行时运行 `:help` 命令。本书的这一部分将教你如何使用这个文本编辑器。


    `VIM` 对初学者可能会非常困惑，因为它有两个不同的模式：插入模式和命令模式。这个文本编辑器 100% 的时间会在命令模式启动。通常情况下，命令帮助你标记、搜索和替换文本。命令模式还有一个开关，你可以用它启动
    `VIM` 的插入模式。因此，每个键都有两个潜在的用途：它可能代表工具的命令（在命令模式下），也可能代表你需要添加的字符（在插入模式下）。


    # 基本功能


    ## 如何在文本中移动


    你可以使用键盘的方向键在文本中移动。如果无法这样做，你可以：


    * 按 `k` 将光标向上移动

    * 按 `j` 将光标向下移动

    * 按 `l` 将光标向右移动

    * 按 `h` 将光标向左移动

    * 使用 `Shift + G` 将光标置于活动文本文件的末尾


    ## 基本操作


    这里是一些常见的 `VIM` 命令：


    * `x` – 删除光标高亮的字符。

    * `:n` – 将光标移动到文档的第 `n` 行。

    * `:w` – 保存（写入）文档。

    * `:q` – 使用此命令退出文本编辑器。

    * `:wq` – 此命令允许你保存最近的文件更改并退出 `VIM`。

    * `:q!` – 此命令允许你在不保存最近更改的情况下退出程序。

    * `n p` – 此命令将复制的内容粘贴 `n` 次。

    * `n dd` – 从光标当前位置删除 `n` 行。

    * `n dw` – 删除光标右侧 `n` 个单词。

    * `:w newfile` – 此命令将文档保存为 `newfile`。

    * `:wq!` – 覆盖只读权限。

    * `/astring` – 在文档中搜索字符串并将光标置于找到的结果上。

    * `/` – 此命令执行上一次搜索。如果你想查看下一个搜索结果，请使用此命令。

    * `yy` – 复制文本内容。

    * `:recover` – 此命令允许你恢复文档。如果你在编辑或写入文本文件时遇到进程中断，请使用此命令。


    #  VIM 插入模式的命令


    * `a` – 除了触发插入模式外，你还可以使用此命令向现有文件追加数据。

    * `i` – 此命令可以激活插入模式并向现有文件插入一些数据。

    * `o` – 此命令可以在光标当前位置添加一个空行。


    你可以通过按下 `Escape` 键返回工具的命令模式。通常情况下，如果你不确定当前正在使用的模式，可以使用此键。一旦你按了 `Esc` 键，你就知道自己处于命令模式了。


    ### 一种简单的方法


    与其仔细阅读可能极其无聊的 `VIM` 手册，你可能触发 `vimtutor` 来理解基础的 `VIM` 命令。`vimtutor` 是一个 30 分钟的教程，解释了基础的
    `VIM` 功能。通过这个教程，在完成八简单的练习后，你将成为良好的 VIM 用户。虽然你无法在 30 分钟内精通 `VIM`，但这些学习材料旨在解释足够的命令。这意味着你将足够熟练使用
    `VIM` 作为多功能文本编辑器。


    对于 Unix 和 Windows 系统，如果 `VIM` 安装妥当，你可以使用 shell 或命令行启动程序。这种方法会创建一个教程的新副本，允许你对其进行修改而不影响原始文件。到目前为止，该教程提供多种语言版本。要检查你的语言是否可用，你可以利用语言的两个字母代码。对于英语，应该是
    `vimtutor en`。


    # 第 7 章：网络


    在构建网络方面，Linux 是你的最佳选择。以下是 Linux 使其成为网络之优秀系统的一些特性：


    * 网络功能是操作系统的内置功能。

    * 有许多免费的网络工具和程序。

    * 即使整个网络承受高负载，该操作系统也是可靠的。


    在本章中，你将学习如何使用 Linux 进行网络。


    # 网络 – 概述


    ## 简单模型


    简单来说，协议是用于通信的一组规则。为了跨网络获取信息，各种软件和硬件必须和谐地工作。


    这些软件和硬件使用不同的“语言”。例如，电子邮件程序通过特定协议与计算机的操作系统通信。然而，同一个程序无法与计算机硬件“对话”。你必须使用一个可以执行此任务的特殊程序。


    反之，机器必须与电话线（或其他用于获取在线访问的连接方法）通信。在“后台”，用于网络连接的硬件必须与类似的设备通信，以成功发送消息。


    这些各种协议被分为七层，称为 OSI 模型（开放系统体系参考模型）：


    * 网络层 – 该层使用 `IP` 和 `IPv6`。

    * 传输层 – 该层使用 `UDP` 和 `TCP`。

    * 应用层 – 该层使用 `DNS`、`POP3`、`SMTP` 和 `HTTP`。

    * 网络访问层 – 该层使用 `Ethernet`、`PPP` 和 `PPPoE`。


    # 网络信息与配置


    ## 网络接口 – 基本配置


    每个 Linux 系统都带有图形化工具。你可以使用这些工具连接互联网或建立本地网络。要访问图形化工具，你可以使用命令行或以下选项之一：


    * 对于 Ubuntu 系统，进入 系统 > 管理 > 网络。

    * 对于 Gnome 系统，运行 `gnome-network-preferences`。

    * 对于 KDE 系统，运行 `knetworkconf`。

    * 对于 Mandriva/Mandrake 系统，运行名为 Network and Internet Configuration 的预装工具。

    * 对于 RedHat 系统，你可以运行 `redhat-config-network`。此命令提供两种模式：图形模式和文本模式。


    以下是你连接网络时应该做的事情：


    1. 连接互联网 – 你需要提供互联网提供商（ISP）的登录信息。如果你使用调制解调器，还需要提供电话号码。完成后，你的 ISP 将提供上线所需的一切。

    2. 连接本地网络 – 你必须提供你的 IP 地址、主机名和域名。如果你在工作中进行此操作，计算机将给你列出的信息。


    ## 配置文件


    图形工具可以帮助你修改网络配置文件。配置文件的名称和位置取决于你使用的 Linux 系统。然而，某些配置文件存在所有类型的 Linux 机器中：


    1. `/etc/hosts` – 该文件 100% 的时间持有本地主机的 IP 地址（即 `127.0.0.1`）。你可以使用 `/etc/hosts`
    执行进程间通信。无论你做什么，都不应该删除此文件。


    这里是本地网络的 host 文件：

    ![](img/00030.jpeg)


    如果你想了解更多关于此文件的信息，请运行 `man hosts` 命令。


    2. `/etc/resolv.conf` – 该文件调节对域名服务器的访问。检查此文件时，你将看到你的域名和名称服务器。


