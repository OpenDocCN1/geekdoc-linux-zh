    # Redirecting Inputs


    In a different situation, you might need to use an existing file as the input
    a process. If the process doesn’t accept files normally, you need to use the `<`
    operator. In the following example, input redirection is utilized to send a file
    to another user.


    ![](images/00017.jpeg)


    You won’t have to enter the complete address if the user (“mike,” for the current
    example) is an existing member of the local network. If you are going to reach
    someone over the internet, on the other hand, you have to supply the complete
    email address to send the message as an email.


    ## How to Combine Redirections


    In this section, you’ll learn how to combine the two types of redirection. First,
    the file (i.e. `text.txt`) is scanned for spelling errors. Then, the result is
    redirected to a log file named “error.”


    ![](images/00018.jpeg)


    The next screenshot shows all the commands that can be executed to check a different
    file using the `less` command.


    ![](images/00019.jpeg)


    Keep in mind that Linux systems are extremely case-sensitive. That means you should
    use the `–i` option when conducting case-insensitive network searches.


    If you think you’ll need a piece of information in the future, you may save the
    output into a file:


    ![](images/00020.jpeg)


    Make sure that you are not using the names of active files. Using those names
    for redirection will overwrite the content of the existing files.


    ## Advanced Redirection


    ### File Descriptors


    Currently, I/O is divided into three types. Each type has its own identifier,
    which is known as “file descriptor.” These are:


    * Standard Inputs = 0

    * Standard Outputs = 1

    * Standard Errors = 2


    For the descriptions below, if `<` is the initial character of the redirection
    operator, and the file descriptor is missing, the redirection process refers to
    standard inputs. If the initial character is `>` , on the other hand, the process
    refers to standard outputs. The practical examples given below will help you to
    understand this concept.


    Sample command:![](images/00021.jpeg) - This will redirect both outputs and errors
    to the “dirlist” file.


    Sample command: ![](images/00022.jpeg) - This will redirect standard outputs to
    the “dirlist” file.


    These sample commands can be exceptionally useful for computer programmers.


    ### Practical Techniques


    #### How to Analyze Errors


    If a certain process creates many errors, you may use the following command:


    ![](images/00023.jpeg)


    That command allows you to examine the error-prone process thoroughly. Additionally,
    you can combine it with the `make` command when developing new computer programs.
    Here’s an example:


    ![](images/00024.jpeg)


    #### How to Separate Standard Outputs from Standard Errors


    Computer programmers often need to separate outputs from errors. That means they
    use certain constructs to display outputs in a terminal window, and errors in
    another. You can run the `tty` command to identify the active pseudo terminal.
    Here’s the command:


    ![](images/00025.jpeg)


    #### How to Write Files and Outputs Simultaneously


    If you want to copy inputs to standard outputs and other file/s, you may use the
    `tee` command. This command allows you to write outputs and files in just one
    go. You have to use the `–a` option to append information to existing files. In
    addition, this command can show and save process outputs.


    To activate this tool, you should use a “pipe” (see below).


    ![](images/00026.jpeg)


    ### Filters


    When computer programs perform tasks on input and save the result to standard
    outputs, it is known as filter. Filters are commonly used to restructure outputs.
    In this section, you’ll learn about the most important filters in Linux operating
    systems.


    #### The GREP Command


    You can use the `grep` command to scan output files thoroughly and search for
    patterns. Lines that contain a matching pattern will be copied to a standard output
    file. You can reverse this behavior by adding the `–v` option.


    As an example, let’s assume that you need to know which entries in a particular
    directory have been edited in February. Here’s the command you should use:


    ![](images/00027.jpeg)


    Like other commands, `grep` is case-sensitive. You may use `–i` to ignore the
    difference between lower and upper case. Many GNU extensions also exist. For instance,
    `--colour` is an extension that can help you to highlight keywords when working
    on long lines. Meanwhile, `--after-context` is a GNU extension that checks and
    prints the total number of lines past the final matching line. You may also use
    the `–r` option to run the recursive `grep` command. This command scans the subdirectories
    of all the directories you’ve accessed during the current session.


    If you want to add more details regarding character matches, you may use regular
    expressions. Read the documentations about `grep` so you can start using regular
    expressions on your searches.


    #### How to Sort Outputs


    The `sort` command allows you to arrange lines. By default, it organizes information
    in alphabetical order. Here’s a sample:


    ![](images/00028.jpeg)


    But `sort` can do other things. For instance, it can help you check file sizes.
    Using this command, you can arrange directory content based on file size. Here’s
    an example:


    ![](images/00029.jpeg)


    # Chapter 6: Linux Systems and Text Editor


    This chapter will explain the importance of text editors in Linux operating systems.
    Additionally, it will teach you how to master text editors.


    ## General Information About Text Editors


    ### Why should you use this kind of tool?


    As a Linux user, you must know how to use a text editor. The skill to use this
    tool is a necessary step to achieving proficiency and independence.


    You have to master at least one editor since you will likely edit files in the
    Linux environment. File editing can be easily done using text editors. If you
    are an advanced user, you will utilize this type of tool when working on websites,
    books, scripts, and computer programs. Basically, mastering a text editor will
    vastly enhance your overall productivity and capabilities.


    ### Which text editor should you choose?


    This chapter focuses on text editors, which can be used for terminal windows and
    systems that lack a graphical interface. As a bonus, you can use text editors
    on remote computers. Because you are not required to send the whole graphical
    interface through the system, working with a text editor improves your efficiency
    and productivity.


    Obviously, you have various methods to solve the problem. Here are some of the
    text editors being used for Linux systems:


    #### GNU Emacs


    Emacs is a customizable, versatile, self-documenting text editor that can display
    information in real-time. This editor is used on Linux and Unix operating systems.
    While you are typing commands, the screen will show and update the text you are
    working on. It is considered as “real-time” since it updates information frequently,
    often after every character you type. That means you can reduce the bulk of data
    you have to memorize while editing.


    Computer users refer to it as an “advanced” tool since it allows them to do lots
    of things. Here are some examples: deletion and insertion of characters, managing
    subtasks, viewing multiple files simultaneously, modifying text files, and automated
    indentation of computer programs. Additionally, it allows users to work on text
    files in terms of lines, words, characters, sentences, pages, and paragraphs.
    Users may even use comments and expressions from various programming languages.


    #### VIM


    This tool was previously called “Vi Imitation.” However, the numerous improvements
    it experienced required a name change. Now, VIM means “Vi Improved.” Basically,
    this tool is an improved version of vi (i.e. a Unix text editor).

