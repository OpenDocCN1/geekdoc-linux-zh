    Bash provides a pre-installed `time` command that shows the amount of time required
    to execute processes. This tool offers accuracy and versatility – you can use
    it to get precise data about any command. To help you understand the `time` command,
    a screenshot is given below:


    ![](images/00011.jpeg)


    In this example, the `time` command is used to calculate the amount of time needed
    to create a certain `.pdf` file. The result shows that the process requires 1
    minute and 41 seconds.


    The file directory `/usr/bin` contains a `time` command for GNU (this is different
    from the pre-installed BASH tool). This command shows more data that can be used
    in various ways. Additionally, it displays the command’s exit status and total
    elapsed time. When used with the GNU `time` command, the example given above provides
    these results:


    ![](images/00012.jpeg)


    You may check the system’s `Info` pages if you want to learn more about these
    time commands.


    ## Performance


    For common users, “excellent performance” refers to quick and correct execution
    of processes. For system managers, however, these words have more meaning: the
    admin needs to maximize the performance of the entire system, including daemons,
    programs, and users. In general, system performance may depend on numerable “insignificant”
    things that are not evaluated by the `time` command. Here are some examples of
    these “insignificant” things:


    * Access to drives, display, controllers, interfaces, etc.

    * The program being run was poorly designed or doesn’t utilize the computer’s
    resources efficiently.

    * The number of active users in the system.

    * The time of day.

    * The accessibility of remote networks.


    ## Load


    Basically, load relies on what is ordinary for your network. For instance, an
    old P133 that runs a firewall, file server, SSH server, route daemon, proxy server,
    sendmail server, and other devices can support up to 7 active users. In this kind
    of situation, the load is still zero. Some systems, particularly those that have
    several processors, can easily support up to 67 users.


    There is just one way to identify your network’s load: check it on a regular basis.
    This way, you’ll know what’s ordinary for your network. If you won’t use this
    method, you can only gauge system load from the command’s response time. The response
    time lacks accuracy – it cannot be reliable since various factors are affecting
    it.


    Remember that different networks behave differently even if they have identical
    load averages. For instance, a network can render 3D images smoothly if it has
    a graphics card that supports hardware acceleration. A network that uses an old
    VGA card, however, will be as slow as a turtle when rendering images. An old system
    can be extremely slow when starting an X server, while modern ones won’t even
    “feel” the added load.


    ## Priority


    The importance (or priority) of a task is determined by its nice number. Tasks
    with a high nice number are “cooperative” (or nice) to other users, other tasks,
    and the network itself: they are low-priority tasks. Low nice numbers indicate
    that the tasks they belong to are important and will take more system resources.


    You can make a task “nicer” by giving it a higher nice number. However, this technique
    is only effective for processes that require lots of CPU time (e.g. software compilers).
    Processes that utilize lots of I/O time consistently are provided with a low nice
    number (i.e. higher priority). For instance, keyboard inputs always receive the
    highest priority in a computer network.


    You can set a program’s importance using the `nice` command.


    Many systems offer a command called `BSD renice`. This command allows users to
    edit the “niceness” of an active program. You may check the manual of your OS
    to find out if this command is available.


    ## CPU Resources


    On each operating system, many processes need to use the computer’s CPU at the
    same time. This is true even if you’re the only active user. Each process requires
    a specific amount of CPU resource in order to run properly. Sometimes, computer
    programs don’t get sufficient resources since the CPU handles many requests. You
    need to know the available system resources if you want to optimize your computer.
    There are tools that you can use to obtain this data.


    `Uptime`, one of the commands you can use in Linux, lacks accuracy (it can only
    show averages, you need to identify the normal number), but can be useful in some
    situations. Here are some of the things you can do to improve the efficiency of
    your CPU.


    * Stop your system from performing unnecessary tasks. Stop programs and daemons
    that you aren’t using. You may use the `locate` command for this.

    * Run resource-intensive processes when the system’s load is at a low level. Often,
    you should run “heavy” processes during nighttime.

    * Run low-priority tasks first.


    If these methods don’t solve your problem, you may need to get a better CPU. For
    Linux systems, this is the system admin’s job.


    ## Users


    In Linux systems, computer users can be segregated into different types, depending
    on how they use system resources. Here are the three types of Linux users:


    * People who run lots of small processes. A good example for this would be inexperienced
    Linux users.

    * People who run several (but complex) processes. Examples for this type are people
    running emulators, calculations, and simulations.

    * People who run few processes that require lots of CPU time (e.g. game developers).


    As you can see, system requirements differ for each type of user. Also, it is
    extremely difficult to meet the needs of all the users in a network. If you belong
    to a multiuser network, it is beneficial (and entertaining) to identify the habits
    of your fellow users.


    ## Visual Tools


    For graphical environments, you have a wide-range of options in terms of monitoring
    tools. Here’s a screenshot of a tool called `Gnome System Monitor`. This tool
    can find and show information about active tasks. Also, it can monitor system
    resources.


    ![](images/00013.jpeg)


    Most Linux systems have some useful icons (e.g. monitors for load, disk, etc.)
    that you may install onto your taskbar.


    # Chapter 5: The I/O Redirection


    This chapter will explain the redirection mechanism for inputs, outputs, and errors.
    I/O (Input/Output) redirection is a mechanism originally developed for Unix systems.


    ## Simple Redirection


    ### Standard Inputs and Standard Outputs


    Many Linux commands scan input (e.g. files or command attributes) and create output.
    In general, input is entered using a keyboard, and output is shown using a computer
    monitor. Keyboards are considered as standard input devices (also called `stdin`).
    Monitors and terminal windows are considered as standard output devices (also
    known as `stdout`).


    Because Linux systems are versatile, however, you don’t have to apply these default
    settings. For instance, printers can serve as standard output devices for some
    networks.


    ### The Operators Used for I/O Redirection


    #### Redirecting Output Using “|” and “>


    In some cases, you need to save the output of a process as a separate file. Alternatively,
    you may need to run a command on the output of a completed process. This is called
    output redirection. This kind of redirection is accomplished using either the
    `|` or `>` operator. These operators transmit the output of a process to another
    process as input.


    Here, you can concatenate files using the `cat` command and put them together
    as a standard output. When redirecting outputs into a new file, you will be creating
    this filename – or overwrite if it’s already there. That means you should be careful
    with I/O redirection. Here’s a screenshot:


    ![](images/00014.jpeg)


    Using redirection to save “nothing” into an existing file is similar to clearing
    out that file:


    ![](images/00015.jpeg)


    This procedure is known as truncation.


    Using redirection to nonexistent files will generate new empty files. Here’s an
    example:

