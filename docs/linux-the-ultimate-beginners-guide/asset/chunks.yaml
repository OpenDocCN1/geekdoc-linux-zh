    通常情况下，你可以单独执行命令（例如 `ls` 命令）。如果你指定了选项（option），命令的行为会有所不同，选项通常由破折号引入（例如 `ls -a`）。该选项字符在其他命令中可能具有不同的含义。GNU
    程序接受长选项（long options），由两个破折号引入（例如 `ls --all`）。某些命令没有选项。


    命令的参数（argument）是对你想要应用命令的对象的指定说明。让我们使用这个例子：`ls /etc/`。在这种情况下，`/etc` 目录就是 `ls`
    命令的参数。这个参数表示你想要查看该特定目录的内容，而不是默认的内容（默认内容是通过输入 `ls` 并按 `Enter` 键获取的活动目录内容）。某些命令需要参数。


    如果你想知道某个命令是否接受选项和/或参数，可以检查操作系统的在线帮助文件。这将在稍后进行讨论。


    与 Unix 系统类似，Linux 使用正斜线来分隔目录。这种方法也用于 URL。


    # 如何使用 Bash 特性


    Bash 是大多数 Linux 系统的默认 GNU shell，它允许你使用某些组合键来快速方便地完成任务。以下是 Bash shell 常用的特性。如果你想最大限地利用
    Linux 的优势，你应该学习如何使用这些组合键。


    *   `Tab` – 完成命令或文件名。如果有多个选项，系统将通过音频或视觉通知告知你。另一方面，如果可能性太多，系统会询问你是否要检查所有选项。

    *   `Tab Tab` – 显示命令或文件名的补全可能性。

    *   `Ctrl + A` – 将光标移动到当前命令行的开头。

    *   `Ctrl + C` – 结束当前运行中的计算机程序并显示提示符。

    *   `Ctrl + D` – 将你退出当前会话。此组合键类似于输入 `logout` 或 `exit`。

    *   `Ctrl + E` – 将光标移动到当前命令行的末尾。

    *   `Ctrl + H` – 类似于按下键盘上的退格键（backspace）。

    *   `Ctrl + L` – 清除当前终端。

    *   `Ctrl + R` – 搜索命令历史。

    *   `Ctrl + Z` – 允许挂起计算机程序。

    *   `Arrow Right/Arrow Left` – 这些键允许你沿着当前命令行移动光标。你可以使用这些键在行的其他部分添加字符。

    *   `Arrow Up/Arrow Down` – 这些键允许你浏览系统历史。访问你需要重复的行，在需要时更改数据，然后按 `Enter` 键快速执行命令。

    *   `Shift + Page Up/Shift + Page Down` – 这些组合键允许你检查终端缓冲区。


    # 如何获取帮助


    书的这一部分将教你如何获取所需的信息。在询问他人之前，你应该检查此处包含的提示和说明。作为 Linux 用户，你应该自力更生。


    ## 手册页 (Manual Pages)


    许多初学者害怕手册（也称为“man”页），因为它们包含了海量信息。然而，它们是完全结构化的，这意味着你可以很轻松地使用它们。


    阅读手册页通常使用 `xterm` 窗口（如果你正在使用图形模式），或者在更简单的文本模式下。在提示符处输入以下命令，然后按 `Enter`。


    ```

    yourname@yourcomp `> man man

    ```


    一旦按下 `Enter` 键，手册的文档将显示在你的屏幕上。


    ![](img/00004.jpeg)


    使用空格键查看下一页。如果你想查看上一页，可以使用 `b` 键。一旦到达最后一页，手册通常会退出，你会再次获得提示符。如果你想在到达最后一页之前离开手册页，或者程序没有自动关闭，你可以输入
    `q` 并按 `Enter`。


    ## 信息页 (Information Pages)


    除了手册，你还可以使用 Info 页学习更多有关系统的信息。使用 `info` 命令访问你操作系统的 Info 页。这些页面包含了更新的信息，并且更易使用。某些命令的手册页指向
    Info 页。


    要开始，打开一个终端窗口并输入 `info info:`：


    ```

    info

    ```


    ![](img/00005.jpeg)


    你应该使用方向键来浏览页面，并控制光标沿由星号开头的行移动。如果它包含你想要学习的关键词，按 `Enter` 键。你可以使用 `N` 和 `P` 键跳转到下一个或上一个主题。空格键将显示下一页，无论它打开的是新主题还是信息页。要关闭
    info 页，你只需输入 `q.`。


    # 第 3 章：文件系统


    在本章中，你将学习 Linux 系统中使用的文件和目录。许多用户在使用这类操作系统时遇到困难，因为他们不知道在什么区域存储了什么类型的信息。本章将解释 Linux
    文件系统是如何组织文件的。


    ## 文件系统 – 概述


    ### 文件


    这里是对 Linux 系统的简单描述：


    “在 Linux 系统中，一切都被视为文件。如果它不是一个文件，它就被视为一个过程。”


    上述陈述是正确的，因为存在特殊文件（例如管道和套接字）。在这一点上，这种陈述是可以接受的。Linux 以相同的方式对待文件和目录，因为目录只是包含其他名称的文件。


    ### 不同类型的文件


    大多数文件都是普通文件：它们持有普通数据。


    虽然可以假设你看到的所有都是文件，但也有例外：


    *   链接 – 显示系统各个部分的文件和目录的方法。

    *   套接字 – 这是一种特殊文件。它们提供了由操作系统控制的进程间通信。

    *   目录 – 这些包含其他名称的文件。

    *   特殊文件 – 用于输入和输出的设备。几乎所有特殊文件都在 `/dev` 中。这将在后讨论。

    *   命名管道 – 它们像套接字一样：允许进程相互交互。


    命令接受 `-l` 选项可以显示文件类型。这是一个截图：


    ![](img/00006.jpeg)


    下面的列表显示了一些用于识别文件类型的字符：


    *   连字符（即 `-`）用于普通文件。

    *   字母 `d` 用于目录。

    *   字母 `l` 用于链接。

    *   字母 `c` 用于特殊文件。

    *   字母 `s` 用于套接字。

    *   字母 `p` 用于管道。

    *   字母 `b` 用于块设备。


    ## 文件系统的布局


    为了方便，Linux 操作系统的文件系统被视为一个树形结构。对于典型的 Linux 系统，布局遵循以下方案：


    ![](img/00007.jpeg)


    该布局被 RedHat 系统使用。结构可能会发生，目录可能会添加或删除，取决于管理员。此外，名称是为了惯例：并非强制要求。


    文件系统的树起始于斜杠（也称为根目录）。这由 `/` 表示。根目录包含了操作系统内部所有的底层文件和目录。

