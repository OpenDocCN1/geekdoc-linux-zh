    ![](images/00031.jpeg)


    ### 3. /etc/nsswitch.conf


    This file determines how name services are contacted. If you are connecting to
    the internet, `dns` should appear in the line that says “hosts.” Here’s an example:


    ![](images/00032.jpeg)


    This data tells your machine to scan the `/etc/hosts` file for IP addresses and
    hostnames. If no hosts exist in that file, your computer will contact the domain
    name server. Alternatively, you may instruct your computer to contact other name
    services such as `NIS`, `NIS+`, and `LDAP`.


    You can learn more about this file by running this command: `man nsswitch.conf`.


    ## The Configuration Commands for Networking


    #### The `ip` command


    This command shows and controls the networking configuration of the kernel. To
    perform these tasks, `ip` uses graphical tools and distribution-specific scripts.


    You can use this command to do cool things. Here are some examples:


    * Assign an IP address to each interface

    * Set up routes to local networks and the Internet

    * Display the configurations of your machine’s TCP/IP


    The screenshot below will show you two powerful commands. These commands can give
    you routing information and IP addresses.


    ![](images/00033.jpeg)


    #### The `ifconfig` command


    This is one of the most popular commands on Linux systems. You may run it without
    an option to display some information about your network’s interface. Here’s a
    screenshot:


    ![](images/00034.jpeg)


    To get the most out of this command, you should know the two vital aspects of
    interface configurations. These are:


    * “inet addr” – this marks the IP address.

    * “HWaddr” – this tag shows the hardware address.


    Both commands (i.e., `ip` and `ifconfig`) show detailed information about the
    network’s current configuration. They can also display multiple statistics about
    every interface. Lastly, they will tell you whether the system is active.


    ## Conclusion


    I hope this book was able to help you master the basics of Linux systems.


    The next step is to use Linux in creating your own networks or computer programs.


    Finally, if you enjoyed this book, please take the time to share your thoughts
    and post a positive review on Amazon. It’d be greatly appreciated!


    Thank you and good luck!

