    `NIS`、`NIS+` 和 `LDAP`。


    你可以通过运行此命令来了解更多关于该文件的信息：`man nsswitch.conf`


    ## 网络配置命令


    #### `ip` 命令


    该命令用于显示和控制内核的网络配置。为了执行这些任务，`ip` 使用了图形化工具和特定于发行版的脚本。


    你可以使用此命令来完成一些酷操作。以下是一些示例：


    *   为每个接口分配 IP 地址

    *   设置通往本地网络和互联网的路由

    *   显示机器的 TCP/IP 配置


    下面的截图将向你展示两个强大的命令。这些命令可以为你提供路由信息和 IP 地址。


    ![](img/00033.jpeg)


    #### `ifconfig` 命令


    这是 Linux 系统上最流行的命令之一。你可以不带任何选项运行它，以显示关于你网络接口的一些信息。这是一个截图：


    ![](img/00034.jpeg)


    为了充分利用此命令的作用，你应该了解接口配置的两个关键方面。它们是：


    *   “inet addr” – 这标记 IP 地址。

    *   “HWaddr” – 该标签显示硬件地址。


    这两个命令（即 `ip` 和 `ifconfig`）都会显示有关网络当前配置的详细信息。它们还可以显示关于每个接口的多个统计数据。最后，它们会告诉你系统是否处于活动状态。


