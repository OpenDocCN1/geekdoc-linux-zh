  raw: 'In general, you can issue commands by themselves (e.g. the “Is” command).
    A command will behave differently if you will specify an option, which is often
    introduced by a dash (e.g. “Is –a.” The option character can have different meanings
    for other commands. GNU programs accept long options, introduced by two dashes
    (e.g. “Is –all”). Certain commands don’t have options.


    An argument to a command is a specification for the object on which you want to
    apply the command. Let’s use this example: “Is /etc.” For this situation, the
    /etc directory is the argument for the “Is” command. This argument shows that
    you like to view the contents of that particular directory, rather than the default,
    which will be the contents of the active directory, gathered by typing “Is” and
    hitting “Enter.” Certain commands need arguments.


    If you want to know whether a command accepts options and/or arguments, you may
    check the operating system’s online help file. This will be discussed later.


    Similar to Unix systems, Linux uses forward slashes to separate directories. This
    method is also used for URLs.


    How to Use the Bash Features


    Bash, the default GNU shell for most Linux systems, allows you to use certain
    key combinations to perform tasks quickly and easily. Here are the commonly used
    features of the Bash shell. If you want to maximize the benefits of using Linux,
    you should learn how to use these key combinations.


    *   Tab – This completes the command or filename. If there are multiple options,
    the system will inform you using an audio or visual notification. If there are
    too many possibilities, on the other hand, the system will ask you if you want
    to check all of them.


    *   Tab Tab – It shows the completion possibilities for commands or filenames.


    *   Ctrl + A – This moves the cursor to the start of the current command line.


    *   Ctrl + C – This ends an active computer program and shows the prompt.


    *   Ctrl + D – This will log you out of the current session. This key combination
    is similar to typing logout or exit.


    *   Ctrl + E – It moves the cursor to the end of the current command line.


    *   Ctrl + H – This is similar to pressing the backspace key on your keyboard.


    *   Ctrl + L – This clears the current terminal.


    *   Ctrl + R – This searches the command history.


    *   Ctrl + Z – This allows you to suspend computer programs.


    *   Arrow Right/Arrow Left – These keys allow you to move the cursor along the
    current command line. You can use these keys to add characters at other parts
    of the line.


    *   Arrow Up/Arrow Down – These keys allow you to browse the system’s history.
    Access the lines you need to repeat, change data if needed, and press the “Enter”
    key to execute commands quickly.


    *   Shift + Page Up/Shift + Page Down – These key combinations allow you to check
    the terminal buffer.


    How to Get Help


    This section of the book will teach you how to get the information you need. You
    should check the tips and instructions included here before asking other people.
    As a Linux user, you should be self-reliant.


    The Manual Pages


    Many beginners fear the manual (also called “man”) pages, since they contain an
    overwhelming amount of information. However, they are completely structured, which
    means you will be able to use them quite easily.


    Reading the manual pages is often done using an xterm window (if you are using
    the graphical mode), or in the simpler text mode. Type the following command at
    the prompt, then hit “Enter.”


    yourname@yourcomp `> man man


    The documentation for the manual will be shown on your screen once you press the
    “Enter” key.


    ![](images/00004.jpeg)


    Use the spacebar to view the next page. If you want to see the previous page,
    you can use the b-key. Once you reach the final page, the manual will often quit
    and you will get the prompt again. If you want to leave the manual pages before
    reaching the last page, or if the program doesn’t close automatically, you can
    type “q” and hit “Enter.”


    More Information


    The Information Pages


    Aside from the manual, you can also use the Info pages to learn more about the
    system. Use the info command to access the Info pages of your OS. These pages
    hold updated information and are simpler to use. The manual pages for certain
    commands point to the Info pages.


    To get started, open a terminal window and type info  info:


    ![](images/00005.jpeg)


    You should use the arrow keys to browse through the page and control the cursor
    along a line that starts with an asterisk. If it contains the keyword you want
    to learn about, hit the “Enter” key. You may use the “N” and “P” keys to go to
    the next or previous subject. The spacebar will show the next page, regardless
    of whether it opens a new subject or an information page. To close the info page,
    you can just type “q.”


    Chapter 3: The File System


    In this chapter, you’ll learn about the files and directories used in Linux systems.
    Many users experience difficulties with this type of OS because they don’t know
    what kind of information is stored in what areas. This chapter will explain how
    files are organized in Linux’s file system.


    The File System – General Overview


    Files


    Here’s a simple description for Linux systems:


    “In Linux systems, everything is considered as a file. If it is not a file, it
    is considered as a procedure.”


    The statement given above is correct because of the existence of special files
    (e.g. pipes and sockets). At this point, Linux users consider this statement as
    an acceptable generalization. Similar to Unix, Linux treats files and directories
    the same way, because directories are just files that contain the names of other
    files. Texts, images, programs, and services, are files. Additionally, Linux systems
    consider all devices (i.e. input and output devices) as files.


    To manage files in an organized way, the manual “thinks” of them using a systematic
    tree-like structure on the computer’s hard drive. This method is also being used
    by MS-DOS. The big branches contain other branches, and the smallest branches
    found at the end contain normal files.


    Different Types of Files


    Majority of the files are regular files: they hold ordinary data such as programs,
    text files, and outputs from a task.


    Although it is safe to assume that all you see in a Linux system are files, there
    are some exceptions:


    *   Links – A method to show files and directories in various parts of the OS’s
    file tree.


    *   Sockets – This is a special type of file. They provide inter-process networking
    secured by the OS’s security control.


    *   Directories – These contain the names of other files.


    *   Special files – The device used for inputs and outputs. Almost all special
    files are found in /dev. This will be discussed later.


    *   Named pipes – They act like sockets: they allow processes to interact with
    each other.


    The -1 option of the “Is” command shows the file type. Here’s a screenshot:


    ![](images/00006.jpeg)


    The list given below shows some of the characters used for identifying file types:


    *   Hyphens (i.e. “-”) are used for regular files.


    *   The letter “d” is used for directories.


    *   The letter “l” is used for links.


    *   The letter “c” is used for special files.


    *   The letter “s” is used for sockets.


    *   The letter “p” is used for pipes.


    *   The letter “b” is used for block devices.


    The Layout of the File System


    For convenience, the file system for Linux operating systems is considered as
    a tree-like structure. For typical Linux systems, the layout follows the scheme
    below:


    ![](images/00007.jpeg)


    That layout is being used by the RedHat system. The structure may change and directories
    may be added or removed, depending on the administrator. Additionally, the names
    are used for convention: they are not required.


    The file system’s tree begins at the slash (also known as “root directory”). This
    is indicated by a (/). The root directory contains all of the underlying files
    and directories inside the operating system.'
