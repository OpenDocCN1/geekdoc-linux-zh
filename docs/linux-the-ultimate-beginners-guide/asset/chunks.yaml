    ## 引言


    我想感谢你购买本书，并祝贺你……


    “LINUX：终极新手指南！”


    这本书将教你如何使用 Linux 操作系统。在阅读这些材料后，你将能够使用 Linux 进行基础和高级用途。除了解释基本概念和理论外，这本书还将为你提供实用的技巧和实际命令。这意味着你通过阅读这本书就能成为一名精通的
    Linux 用户。


    每一章都致力于 Linux 的一个重要方面。例如，有一章专门介绍 Linux 使用的文件系统。通过这种数据呈现方式，你不必在阅读无关话题上浪费时间。


    请彻底学习这本书，因为可以帮助你让 Linux 电脑发挥最大价值。


    再次感谢购买本书，希望你喜欢它！


    ## 第一章：Linux – 基础


    ### 什么是 Linux？


    Linux 是一个操作系统（OS）。它是一种软件，允许用户和计算机程序与机器进行交互（例如访问执行某些任务所需的设备）。操作系统将来自计算机程序的指令转发给（例如）PC
    的处理器。处理器执行给定的任务，并通过操作系统将数据传回程序。Linux 类似于 Windows 和 Mac OS 等其他操作系统。


    此外，Linux 是一个开源操作系统。这意味着每个用户都可以检查软件代码并对其改进——没有哪家公司专门负责它的持续开发和支持。参与 Linux 项目的企业与其他机构（例如合作伙伴、竞争对手等）共享研发费用。这种在团体和个人之间的责任分担，导致了令人惊叹的软件开发和高效的工作生态系统。


    ### Linux – 领先的操作系统之一


    现在，Linux 是操作系统市场上的顶尖者之一。起初，Linux 开发者专注于网络和基础服务。在操作系统存在的最初几年几年里，他们并没有创建办公应用程序。但现在，这些开发者已经创建了许多微软
    Office 套件中包含程序的替代方案。这些新的计算机程序旨在让 Linux 成为优秀的工作站。除了用户友好的界面外，Linux 操作系统拥有与微软兼容的办公程序，如演示文稿、表格、文字处理器等。


    在服务器方面，Linux 是一个稳定高效的平台——它为亚马逊和美国邮政等企业提供交易和数据库服务。ISP（互联网服务提供商）喜欢 Linux 是是因为它的代理、防火墙和网络服务器功能。最后，大量的
    Linux 计算机被用于制作著名的电影（例如《史莱克》、《泰坦尼克号》等等）。


    ### Linux 的用户界面


    这个操作系统是否难学取决于你所交流的用户。经验丰富的用户无疑会说不，因为 Linux 对程序员和高级用户来说是一个极好的操作系统。此外，它经过了数千名计算机专家的检查和改进。


    Linux 为程序员提供了所需的一切：库、编译器以及调试/开发工具。这些功能包含在所有标准 Linux 版本中。你还将免费获得 `C` 编译器——与大多数要求许可费的
    Unix 系统不同。所有的手册和文档都包含在内，通常会提供示例以帮助新手起步。由于由于，在 Unix 和 Linux 之间切换是一件容易而自然的事情。


    ### Linux 与无经验的用户


    SuSE、Mandriva 和 RedHat 等企业已经建立，为公共用户提供封装好的 Linux 系统发行。它们结合了许多社区创建和改进的 GUI（图形用户界面），以简化服务和程序的使用管理。作为一名现代
    Linux 用户，你拥有所有必要的工具来完全理解你的操作系统。然而，在使用 Linux 系统之前，不再需要深厚的知识。即使是新手也可以相当轻松地使用此操作系统。


    如今，你可以通过图形登录并启动所有需要的程序，而无需输入任何键。Linux 系统允许你快速快捷地访问系统核心。由于这种设置，你可以熟悉该操作系统的基础知识：Linux
    非常适合新手和专家用户。无经验的用户不需要做复杂的事情，专家用户不需要使用基础功能。


    这里是 Linux 表格的截图：


    ![](img/00001.jpeg)


    ## Linux 的优缺点


    在本节中，我们将讨论使用 Linux 操作系统的优缺点。


    ### 优点


    - 免费——如果你不想为计算机操作系统花费任何费用，那么这就是最适合你的软件。你不需要购买光盘来获得这个强大的操作系统。事实上，你只需要在线下载 Linux
    —— 免费。有了这个操作系统，你不需要担心注册费、更新成本和高级源代码。

    - 能够与任何硬件配合——想要销售新 PC 但不知道电脑将运行何种操作系统的商人，可以获取 Linux 内核并将其用于他的硬件。由于有免费的教程和手册，他不会遇到任何问题。


    '
- fmt: '

    * It is designed to stay running – Just like Unix, Linux systems are designed
    to keep on running without the need for a reboot. This is the reason why many
    tasks are performed at night or assigned automatically. This results in improved
    computer availability during busy periods and better balance in terms of hardware
    usage. This feature enables Linux to be appropriate in working areas where individuals
    don’t have the time or resources to manage their machines 24/7.


    * It is completely secure and flexible – Linux systems use a security model that
    is based on Unix (which is famous for its top-notch security). However, Linux
    is not just good for preventing online hacking attacks: it is also useful for
    other situations, using the same security standards. Your control station or development
    computer can be as secure as the firewall itself.


    * It is scalable – From Palmtop machines with 2MB of storage to petabyte memory
    clusters with numerous nodes: include or exclude the correct packages and Linux
    systems will work for you. You no longer need a supercomputer, since you can use
    this OS to perform grand things via pre-installed programs. If you prefer to do
    small stuff, like developing an OS for embedded processors or recycling old programs,
    Linux can still help you.


    * Its debug times are extremely short – Since Linux systems have been designed
    and tested by thousands of users, problems are often found easily. Sometimes,
    there are just a couple of hours between the discovery and solving of a glitch.


    ## The Cons


    * There are too many versions – The number of Linux systems can be intimidating.
    However, it also means that all users will find what they need. You don’t have
    to be a computer expert to find a good version.


    In general, Linux users claim that the ideal version is the particular one they
    are using. So which version should you select? At this point, you shouldn’t worry
    about that aspect – each release contains virtually the same array of basic features.
    Aside from the core features, 3rd party programs are included which makes, for
    instance, TurboLinux more appropriate for small- and medium-sized businesses.
    Basically, the differences are superficial. The ideal strategy is to try some
    Linux distributions – unfortunately, not everyone has the time and resources for
    this.


    What you can do is get some advice from other users through online forums and
    discussion boards. You may run a Google search for the Linux systems you want
    and scan the search results for a relevant forum. Those online forums will give
    you the information you need (e.g. pros and cons of specific Linux versions).


    * Linux may be confusing for inexperienced users – It is true that, in its core,
    Linux is less user-friendly than other operating systems. Because of its fame,
    significant effort has been exerted to make Linux systems easier to use, particularly
    for beginners. More data is being provided on a regular basis to help Linux users
    become familiar with the intricacies of this OS.


    * Its trustworthiness is questionable – Thousands of people have worked on this
    OS, which makes users question its reliability and trustworthiness. In addition,
    this type of system is provided for free: nowadays, people are suspicious of free
    stuff.


