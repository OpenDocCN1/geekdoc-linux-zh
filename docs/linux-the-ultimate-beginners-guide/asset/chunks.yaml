    \ and is available for use anytime. The computer’s `BIOS` provides peripheral\
    \ devices with a low-level interface and manipulates the first phase of the startup\
    \ procedure.\n\nThe `BIOS` checks the entire system, searches for and tests peripheral\
    \ devices, and searches for a drive that can be used to start the system. Often,\
    \ `BIOS` checks the CD-ROM drive (for newer OS) or the floppy drive (for older\
    \ ones) for usable media. The sequence of the drives utilized for the booting\
    \ process is commonly managed by a certain `BIOS` configuration on the operating\
    \ system. Once a Linux system is installed onto the computer’s hard drive, the\
    \ `BIOS` searches for an `MBR` (i.e. master boot record) starting at the initial\
    \ part of the first hard disk, puts the data into the memory, and gives control\
    \ to it.\n\nThe Master Boot Record holds the steps on how to use the `LILO` or\
    \ `GRUB` boot-loader, through a predetermined OS. Afterward, the `MBR` activates\
    \ the boot-loader, which controls the rest of the process (that is, if a boot-loader\
    \ is installed in the Master Boot Record). In the standard configuration of the\
    \ Red Hat OS, `grub` utilizes the settings in the master boot record to show available\
    \ boot choices. Once `grub` gets the right instructions for the OS to boot, either\
    \ from the configuration file or its own command line, it acquires the required\
    \ boot file and passes the control of the computer to the OS.\n\n### The Different\
    \ Features of GRUB\n\nThis method of booting up a computer is known as direct\
    \ loading. This is because no transitional code exists between the boot-loader\
    \ and the OS’s main files (e.g. the kernel). Thus, startup instructions are utilized\
    \ to load the OS directly.\n\n"
