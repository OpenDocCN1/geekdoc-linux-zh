    * 它的设计旨在持续运行——就像 Unix 一样，Linux 系统被设计为无需重启即可持续运行。这就是为什么许多任务在晚上执行或自动分配的原因。这提高了计算机在忙碌期间的可用性，并在硬件使用率方面实现了更好的平衡。这一特性使得
    Linux 适用于那些没有时间或资源 24/7 小时管理自己机器的工作区域。


    * 它是完全安全且灵活的——Linux 系统基于 Unix 的安全模型（Unix 以其顶级的安全性闻名）。然而，Linux 不仅在防止网络黑客攻击方面有效：使用相同的安全标准也适用于其他情况。你的控制站或开发计算机可以像防火墙本身一样安全。


    * 它具有可扩展性——从具有 2MB 存储容量的掌上机到拥有众多节点的 PB 级内存内存集群：只要包含或排除正确的软件包，Linux 系统就能为你工作服务。你不再需要超级计算机了，因为你可以使用此操作系统通过预装程序来完成宏大的任务。如果你倾向于做一些小事，比如为嵌入式处理器开发操作系统或回收旧程序，Linux
    仍然可以为你提供帮助。


    * 它的调试时间极短——由于 Linux 系统是由成千上万的用户设计和测试的，问题通常很容易被发现。有时，在发现故障和解决故障之间只需要几个小时。


    ## 缺点


    * 版本太多——Linux 系统的数量可能令人生生畏。然而，这也意味着所有用户都能找到他们需要的。你不需要成为计算机专家就能找到一个好的版本。


    总的来说，Linux 用户声称理想的版本就是他们正在使用的那一个。那么，你应该选择哪个版本呢？在这一点上，你不必担心这个问题——每个发行版本都包含几乎相同的基础功能
    set。除了核心功能外，还包含了第三方程序，这使得例如 TurboLinux 更加适合中小型企业。基本上，它们之间的差异是表浅的。理想的策略是尝试一些 Linux
    发行版——遗憾的是，并不是每个人都有时间和资源去这样做。


    你可以做的是通过在线论坛和讨论板从其他用户那里获得建议。你可以对你想要的 Linux 系统运行 Google 搜索，并扫描搜索结果寻找相关的论坛。这些在线论坛将为你提供所需的信息（例如，特定
    Linux 版本的优缺点）。


    * Linux 对于缺乏经验的用户来说可能令人困惑——事实确实，在核心层面，Linux 没有其他操作系统那么用户友好。由于它的知名度，人们付出了巨大的努力让
    Linux 系统变得更容易使用，特别是对于初学者。现在定期提供更多数据以帮助 Linux 用户熟悉此操作系统的复杂之处。


    * 它的可靠性值得怀疑——有成千上万的人工作过这个操作系统，这让用户对其可靠性和信任度产生怀疑。此外，这种系统是免费提供的：如今，人们对免费的东西深表怀疑。


