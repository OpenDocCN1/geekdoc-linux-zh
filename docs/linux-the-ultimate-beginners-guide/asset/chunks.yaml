  raw: '*   It is designed to stay running – Just like Unix, Linux systems are designed
    to keep on running without the need for a reboot. This is the reason why many
    tasks are performed at night or assigned automatically. This results in improved
    computer availability during busy periods and better balance in terms of hardware
    usage. This feature enables Linux to be appropriate in working areas where individuals
    don’t have the time or resources to manage their machines 24/7.


    *   It is completely secure and flexible – Linux systems use a security model
    that is based on Unix  (which is famous for its top-notch security). However,
    Linux is not just good for preventing online hacking attacks: it is also useful
    for other situations, using the same security standards. Your control station
    or development computer can be as secure as the firewall itself.


    *   It is scalable – From Palmtop machines with 2MB of storage to petabyte memory
    clusters with numerous nodes: include or exclude the correct packages and Linux
    systems will work for you. You no longer need a supercomputer, since you can use
    this OS to perform grand things via pre-installed programs. If you prefer to do
    small stuff, like developing an OS for embedded processors or recycling old programs,
    Linux can still help you.


    *   Its debug times are extremely short – Since Linux systems have been designed
    and tested by thousands of users, problems are often found easily. Sometimes,
    there are just a couple of hours between the discovery and solving of a glitch.


    The Cons


    *   There are too many versions – The number of Linux systems can be intimidating.
    However, it also means that all users will find what they need. You don’t have
    to be a computer expert to find a good version.


    In general, Linux users claim that the ideal version is the particular one they
    are using. So which version should you select? At this point, you shouldn’t worry
    about that aspect – each release contains virtually the same array of basic features.
    Aside from the core features, 3rd party programs are included which makes, for
    instance, TurboLinux more appropriate for small- and medium-sized businesses.
    Basically, the differences are superficial. The ideal strategy is to try some
    Linux distributions – unfortunately, not everyone has the time and resources for
    this.


    What you can do is get some advice from other users through online forums and
    discussion boards. You may run a Google search for the Linux systems you want
    and scan the search results for a relevant forum. Those online forums will give
    you the information you need (e.g. pros and cons of specific Linux versions).


    *   Linux may be confusing for inexperienced users – It is true that, in its core,
    Linux is less user-friendly than other operating systems. Because of its fame,
    significant effort has been exerted to make Linux systems easier to use, particularly
    for beginners. More data is being provided on a regular basis to help Linux users
    become familiar with the intricacies of this OS.


    *   Its trustworthiness is questionable – Thousands of people have worked on this
    OS, which makes users question its reliability and trustworthiness. In addition,
    this type of system is provided for free: nowadays, people are suspicious of free
    stuff.


    Chapter 2: Basic Functions


    To help you get the most out of Linux systems, let’s discuss the basic things
    that you can do with them.


    How to Log In, Activate the Interface, and Log out


    You need to provide login credentials (i.e. username and password) before you
    can use Linux directly. This OS requires you to verify your identity and access
    rights every time you start it. At this point, you’ll learn about the two basic
    modes of running a Linux system.


    Graphical Mode


    This is considered as the default mode for desktop computers. You’ll know that
    you are using the graphical mode if the computer screen is asking you to enter
    your username and password.


    To sign in, just enter your login credentials in the appropriate boxes. Then,
    press “Enter” or hit “OK”.


    After entering your login information, it might take a few minutes before the
    system gets started, depending on your computer’s processing power. Once the computer
    is done loading, you will have to open an xterm (i.e. x is the name of your supporting
    software) or terminal window. You’ll find this tool by clicking on “Applications”
    and choosing “Utilities”. Some Linux distributions have a shortcut icon to access
    the xterm window.


    Here’s an example of a terminal window:


    ![](images/00002.jpeg)


    This window serves as your control panel for the operating system. Almost all
    of the procedures are done using this powerful tool. In general, terminal windows
    must display a command prompt as soon as you open them. The terminal window given
    above has a typical prompt, which shows the person’s username and some data about
    the performed updates.


    To log out using this mode, you should close all of the open programs and terminal
    windows. Afterward, click on the logout icon or search for the “Log Out” option
    in the main menu. Closing all the windows and applications isn’t really required,
    and the computer can do that on your behalf. However, session management may retrieve
    all the open programs and windows once you log in again: this process takes longer
    and produces undesired effects.


    Once the screen asks you for your login credentials, you’ll know that you have
    logged out successfully.


    Text Mode


    You’ll know that you are using the text mode if the entire screen is black, with
    some characters on it. This mode’s login screen usually displays some data about
    the computer you are using, the name of the computer, and a prompt that you can
    use to sign in:


    ![](images/00003.jpeg)


    This is different from the graphical mode, in that you need to press the “Enter”
    key after typing in your username (there is no clickable link or button on the
    screen). Then, type your password and hit “Enter” again. Basically, you won’t
    see any sign that you are typing something, not even a dot. This feature is typical
    on Linux systems and is implemented for security purposes.


    Once the system accepts you as a legitimate user, you will get more data, known
    as “message of the day.” Some distributions even have a “fortune cookie” feature
    that provides wise/unwise (it depends on you) thoughts. Then, the system will
    give you a shell, explained with the same details that you will get in the graphical
    mode.


    To log out from the system, you can just type “logout” and press “Enter.” You’ll
    know that you have logged successfully if the screen asks for your login information.


    Now that you know how to log in and log out from the operating system, you are
    ready for the basic commands.


    The Basics


    The Basic Commands


    In this section, you’ll learn about the quickstart commands (also known as quickies).
    You need these commands to use Linux.


    *   “Is” – Shows a set of files in the directory you are currently using. This
    is similar to the “dir” command in DOS systems.


    *   “passwd” – This command changes the password of the current user.


    *   “pwd” – This shows the current working directory.


    *   “cd directory” – This changes the directories.


    *   “man command” – This reads man pages on “command.”


    *   “logout or exit” – This allows you to leave the current session.


    *   “info command” – This reads Info pages on “command.”


    *   “file filename” – This shows the file type of the file named “filename.”


    *   “apropos string” – This searches for strings using the what is database.


    General Remarks


    You will type the following commands after the initial prompt, in the text mode,
    or in an xterm window. Press “Enter” on your keyboard after typing these commands.'
