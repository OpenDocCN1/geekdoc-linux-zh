- fmt: "\nIn general, you can issue commands by themselves (e.g. the `Is` command).\
    \ A command will behave differently if you will specify an option, which is often\
    \ introduced by a dash (e.g. `Is –a.`). The option character can have different\
    \ meanings for other commands. GNU programs accept long options, introduced by\
    \ two dashes (e.g. `Is –all`). Certain commands don’t have options. \n\nAn argument\
    \ to a command is a specification for the object on which you want to apply the\
    \ command. Let’s use this example: `Is /etc.`. For this situation, the `/etc`\
    \ directory is the argument for the `Is` command. This argument shows that you\
    \ like to view the contents of that particular directory, rather than the default,\
    \ which will be the contents of the active directory, gathered by typing `Is`\
    \ and hitting `Enter.` Certain commands need arguments.\n\nIf you want to know\
    \ whether a command accepts options and/or arguments, you may check the operating\
    \ system’s online help file. This will be discussed later.\n\nSimilar to Unix\
    \ systems, Linux uses forward slashes to separate directories. This method is\
    \ also used for URLs.\n\n# How to Use the Bash Features\n\nBash, the default GNU\
    \ shell for most Linux systems, allows you to use certain key combinations to\
    \ perform tasks quickly and easily. Here are the commonly used features of the\
    \ Bash shell. If you want to maximize the benefits of using Linux, you should\
    \ learn how to use these key combinations.\n\n*   `Tab` – This completes the command\
    \ or filename. If there are multiple options, the system will inform you using\
    \ an audio or visual notification. If there are too many possibilities, on the\
    \ other hand, the system will ask you if you want to check all of them.\n*   `Tab\
    \ Tab` – It shows the completion possibilities for commands or filenames.\n* \
    \  `Ctrl + A` – This moves the cursor to the start of the current command line.\n\
    *   `Ctrl + C` – This ends an active computer program and shows the prompt.\n\
    *   `Ctrl + D` – This will log you out of the current session. This key combination\
    \ is similar to typing `logout` or `exit`.\n*   `Ctrl + E` – It moves the cursor\
    \ to the end of the current command line.\n*   `Ctrl + H` – This is similar to\
    \ pressing the backspace key on your keyboard.\n*   `Ctrl + L` – This clears the\
    \ current terminal.\n*   `Ctrl + R` – This searches the command history.\n*  \
    \ `Ctrl + Z` – This allows you to suspend computer programs.\n*   `Arrow Right/Arrow\
    \ Left` – These keys allow you to move the cursor along the current command line.\
    \ You can use these keys to add characters at other parts of the line.\n*   `Arrow\
    \ Up/Arrow Down` – These keys allow you to browse the system’s history. Access\
    \ the lines you need to repeat, change data if needed, and press the `Enter` key\
    \ to execute commands quickly.\n*   `Shift + Page Up/Shift + Page Down` – These\
    \ key combinations allow you to check the terminal buffer.\n\n# How to Get Help\n\
    \nThis section of the book will teach you how to get the information you need.\
    \ You should check the tips and instructions included here before asking other\
    \ people. As a Linux user, you should be self-reliant.\n\n## The Manual Pages\n\
    \nMany beginners fear the manual (also called “man”) pages, since they contain\
    \ an overwhelming amount of information. However, they are completely structured,\
    \ which means you will be able to use them quite easily.\n\nReading the manual\
    \ pages is often done using an `xterm` window (if you are using the graphical\
    \ mode), or in the simpler text mode. Type the following command at the prompt,\
    \ then hit `Enter.`\n\n```\nyourname@yourcomp `> man man\n```\n\nThe documentation\
    \ for the manual will be shown on your screen once you press the `Enter` key.\n\
