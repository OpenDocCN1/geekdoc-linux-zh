  raw: 'When using VIM, you can enter commands using your keyboard. That means you
    can keep your hands on your keyboard and your eyes on the computer screen. You
    don’t need to move the mouse so using this tool is simple and easy. If you prefer
    to use a mouse, however, you may activate it using the tool’s configuration page.


    How to Use the VIM Editor


    VIM is a powerful tool that contains a detailed pre-installed manual. To access
    the manual, you may run the :help command while VIM is running. This section of
    the book will teach you how to use this text editor.


    VIM can be extremely confusing for beginners because it has two different modes:
    insert mode and command mode. This text editor will start in command mode 100%
    of the time.  In general, commands help you to mark, search, and replace texts.
    The command mode also has a switch that you can use to initiate VIM’s insert mode.


    Thus, every key has two potential uses: it may represent commands for the tool
    (while in command mode), or characters that you need to add (while in insert mode.)


    The Basic Functions


    How to Move Through Text Contents


    You can use the arrow keys of your keyboard to move through texts. If this is
    not possible, you may:


    *   Press “k” to move the cursor upward


    *   Press “j” to move the cursor downward


    *   Press “l” to move the cursor to the right


    *   Press “h” to move the cursor to the left


    *   Use Shift + G to put the cursor at the end of the active text file.


    The Basic Operations


    Here are the well-known VIM commands:


    *   x – This deletes the character highlighted by the cursor.


    *   :n – This moves the cursor to line n of the document.


    *   :w – This saves (or writes) the document.


    *   :q – Use this command to exit the text editor.


    *   :wq – This command allows you to save the recent file changes and exit VIM.


    *   :q! – This command allows you to exit the program without saving the recent
    changes.


    *   n p – This command pastes the copied text n times.


    *   n dd – This deletes n lines from the cursor’s current position.


    *   n dw – This deletes n words to the right of the cursor.


    *   :w newfile – This command saves the document to “newfile.”   


    *   :wq! – This overrides the read-only permission.


    *   /astring – This command searches the string in the document and places the
    cursor on the first result it finds.


    *   / - This command performs the previous search. Use this if you want to see
    the next search result.


    *   yy – This command copies text content.


    *   :recover – This command allows you to recover a document. Use this if you
    experienced a process interruption while editing or writing a text file.


    The Commands That Allow You to Activate VIM’s Insert Mode


    *   a – Aside from triggering the insert mode, you can use this command to append
    data to existing files.


    *   i – This command can activate the insert mode and insert some data into an
    existing file.


    *   o – This command can also add a blank line on the cursor’s current position.


    You can go back to the tool’s command mode by pressing the Escape key. In general,
    you can use this key if you aren’t sure about the mode you are currently using.
    You’ll know that you are in the command mode once you have pressed the Esc key.


    An Easy Way


    Rather than perusing the VIM manual, which can be extremely boring, you may trigger
    vimtutor to understand basic VIM commands. Vimtutor is a 30-minute tutorial that
    explains the fundamental VIM functions. With this tutorial, you’ll be a good VIM-user
    after completing eight simple exercises. Although you can’t master VIM in just
    30 minutes, this learning material is created to explain sufficient commands.
    That means you’ll be skilled enough to use VIM as a multi-purpose text editor.


    For Unix and Windows systems, if VIM was installed properly, you may initiate
    the program using either the shell or a command line. This method will create
    a new copy of the tutorial, allowing you to modify it without affecting the original
    file. As of now, this tutorial is available in different languages. To check if
    your language is available, you may utilize the two-letter code for languages.
    For English, this would be vimtutor en.


    Chapter 7: Networking


    Linux is your best option when it comes to building a network. Here are some features
    of Linux that make it a great system for networking purposes:


    *   Networking is a built-in function of the operating system.


    *   Free networking tools and programs are available for free.


    *   The OS can be relied on even if the entire network experiences heavy loads.


    In this chapter, you’ll learn about how you can use Linux for networking.


    Networking – An Overview


    A Simple Model


    Simply put, a protocol is a group of rules used for communication.


    To get information across the network, various software and hardware must work
    together harmoniously.


    These pieces of software and hardware use different “languages.” For example,
    an email program communicates with the computer’s OS using a certain protocol.
    However, that same program cannot “talk” to the computer’s hardware. You have
    to use a special program that can perform this task.


    In turn, the machine must communicate with the phone line (or other hookup method
    used to get online access). At the “backstage,” the hardware used for network
    connection must communicate with similar devices to successfully send the message.


    These various kinds of protocols are grouped into seven layers, called the OSI
    Model (or Open Systems Interconnection Reference Model). To help you understand
    this concept, the OSI model is converted into a 4-layer protocol system. Check
    the list below:


    *   Network Layer – This layer uses the IP and IPv6 protocols.


    *   Transport Layer – This one uses the UDP and TCP protocols.


    *   Application Layer – This layer uses various protocols such as DNS, POP3, SMTP,
    and HTTP.


    *   Network Access Layer – This layer uses the Ethernet, PPP, and PPPoE communication
    protocols.


    Network Information and Configuration


    Network Interfaces – Basic Configuration


    Each Linux system comes with built-in graphical tools. You can use these tools
    to connect to the internet or establish local networks. To access a graphical
    tool, you may use the command line or one of these options:


    *   For Ubuntu systems, go to System > Administration > Networking.


    *   For Gnome systems, run the gnome-network-preferences command.


    *   For KDE systems, run the knetworkconf command.


    *   For Mandriva/Mandrake systems, run the pre-installed tool called Network and
    Internet Configuration Wizard.


    *   For RedHat systems, you can run the redhat-config-network command. This command
    will give you two options: graphical mode and text mode.


    Here are the things you should do when connecting to a network:


    1.  To connect to the internet – You need to provide the login information for
    your Internet Service Provider (ISP). If you are using a modem, you also need
    to give your telephone number. Once done, your ISP will give you all the things
    you need to be online (e.g. IP address).


    2.  To connect to a local network – You must give your IP address, hostname, and
    domain name. If you’re doing this at work, the computer will give you the information
    listed.


    The Configuration Files


    A graphical tool can help you modify network configuration files. The names and
    locations of network configuration files depend on the Linux system you are using.
    However, some configuration files exist in all types of Linux machines:


    1\. /etc/hosts – This file holds the localhost’s IP address (i.e. 127.0.0.1) 100%
    of the time. You can use /etc/hosts to perform interprocess communications. No
    matter what you do, you should never delete this file.


    Here’s a host file for a local network:


    ![](images/00030.jpeg)


    If you want to learn more about this file, run the man hosts command.


    2\. /etc/resolv.conf – This file regulates access to a domain name server. When
    checking this file, you’ll see your domain name and name server. Here’s a screenshot:'
