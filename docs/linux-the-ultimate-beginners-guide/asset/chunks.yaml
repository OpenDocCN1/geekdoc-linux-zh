    ![](img/00016.jpeg)


    # 输入重定向


    在其他情况下，你可能需要使用一个现有文件作为进程的输入。如果该进程无法正常接收文件，你就需要使用 `<` 运算符。在下面的示例中，利用输入重定向将文件发送给另一个用户。


    ![](img/00017.jpeg)


    如果用户（在当前示例中为“mike”）是本地网络中的现有成员，你就不需要输入完整地址。相反，如果你想通过互联网与某人联系，你必须提供完整的电子邮件地址以邮件形式发送消息。


    ## 如何组合重定向


    在本节中，你将学习如何结合两种类型的重定向。首先，对文件（即 `text.txt`）进行拼写错误扫描。然后，将结果重定向到名为“error”的日志文件中。


    ![](img/00018.jpeg)


    下一张截图显示了所有可以使用 `less` 命令执行以检查不同文件的命令。


    ![](img/00019.jpeg)


    请记住，Linux 系统对大小写极其敏感。这意味着在进行不区分大小写的网络搜索时，你应该使用 `–i` 选项。


    如果你认为未来可能需要某些信息，你可以将输出保存到文件中：


    ![](img/00020.jpeg)


    确保你没有使用正在运行的文件名称。使用这些名称进行重定向将覆盖现有文件的内容。


    ## 高级重定向


    ### 文件描述符


    目前，I/O 分三种类型。每种类型都有自己的标识符，称为“文件描述符”。它们是：


    * 标准输入 (Standard Inputs) = 0

    * 标准输出 (Standard Outputs) = 1

    * 标准错误 (Standard Errors) = 2


    对于下面的描述，如果 `<` 是重定向运算符的起始字符且缺少文件描述符，重定向过程指向标准输入。相反，如果起始字符为 `>` ，进程指向标准输出。下面提供的实际示例将帮助你理解这一概念。


    示例命令：![](img/00021.jpeg) - 这会将输出和错误都重定向到“dirlist”文件。


    示例命令：![](img/00022.jpeg) - 这会将标准输出重定向到“dirlist”文件。


    这些示例对计算机程序员来说非常有用。


    ### 实用技术


    #### 如何分析错误


    如果某个进程产生了许多错误，你可以使用以下命令：


    ![](img/00023.jpeg)


    该命令允许你彻底检查易错的进程。此外，在开发新的计算机程序时，你可以将其与 `make` 命令结合。这里有一个示例：


    ![](img/00024.jpeg)


    #### 如何将标准输出与标准错误分离


    程序员经常需要将输出与错误分离。这意味着他们使用某些结构在终端窗口中显示输出，在另一个窗口显示错误。你可以运行 `tty` 命令来识别活跃的伪终端。该命令如下：


    ![](img/00025.jpeg)


    #### 如何同时写入文件和输出


    如果你想将输入复制到标准输出和其他文件中，你可以使用 `tee` 命令。该命令允许你一次性写入输出和文件。你必须使用 `–a` 选项将信息追加到现有文件中。此外，此命令还可以显示并保存进程输出。


    要激活此工具，你应该使用“管道”（见下文）。


    ![](img/00026.jpeg)


    ### 过滤器


    当计算机程序对输入执行任务并将结果保存到标准输出时，被称为过滤器。过滤器通常用于重构输出。在本节中，你将学习 Linux 操作系统中最重要的过滤器。


    #### GREP 命令


    你可以使用 `grep` 命令彻底扫描输出文件并搜索模式。包含匹配模式的行将被复制到标准输出文件。你可以通过添加 `–v` 选项来反转这种行为。


    例如，假设你需要知道特定目录中的哪些条目在 2 月份被编辑过。你应该使用的命令如下：


    ![](img/00027.jpeg)


    像其他命令一样，`grep` 对大小写敏感。你可以使用 `–i` 来忽略大小写差异。还存在许多 GNU 扩展。例如，`--colour` 是一个可以帮助你在处理长行时突出显示关键词的扩展。同时，`--after-context`
    是一个 GNU 扩展，用于检查并打印最后一条匹配行之后的总行数。你还可以使用 `–r` 选项运行递归 `grep` 命令。该命令会扫描你在当前会话期间访问的所有目录的子目录。


    如果你想添加更多关于字符匹配的详细信息，可以使用正则表达式。阅读关于 `grep` 的文档，这样你就可以在搜索中使用正则表达式了。


    #### 如何对输出


    `sort` 命令允许你排列行。默认情况下，它按字母顺序组织信息。这里有一个示例：


    ![](img/00028.jpeg)


    但 `sort` 还可以做其他事情。例如，它可以帮助检查文件大小。使用此命令，你可以根据文件大小安排目录内容。这是一个示例：


    ![](img/00029.jpeg)


    # 第 6 章：Linux 系统与文本编辑器


    本章将解释文本编辑器在 Linux 操作系统中的重要性。此外，还将教你如何掌握文本编辑器。


    ## 文本器的通用信息


    ### 为什么要使用这种工具？


    作为 Linux 用户，你必须学会使用文本编辑器。学会这种工具是走向精通和独立的必要步骤。


    你必须掌握一种编辑器，因为你将在 Linux 环境中编辑文件。使用文本编辑器可以轻松完成。如果你是高级用户，将在编写网站、书籍、脚本和程序时利用这种工具。基本上，掌握文本编辑器将极大提高你的整体效率和能力。


    ### 你应该选择哪个编辑器？


    本章关注文本编辑器，它们用于终端窗口和缺乏图形界面的系统。作为额外，你可以在远程计算机上使用文本编辑器。由于你不需要通过系统发送整个图形界面，使用文本编辑器可以提高你的效率。


    显然，你有多种方法来解决问题。以下是一些用于 Linux 系统的编辑器：


    #### GNU Emacs


    Emacs 是一种可定制、多功能、自文档文本编辑器，可以实时显示信息。该编辑器用于 Linux 和 Unix 操作系统。当你输入命令时，屏幕会显示并更新你正在工作的文本。它被认为是“实时”，因为它频繁更新信息，通常在你输入每个字符后更新。这意味着你可以减少编辑时需要记忆的大量数据。


    计算机用户将其称为“高级”工具，因为它允许他们做很多事情。例如：删除和插入字符、管理子任务、同时查看多个文件、修改文本文件以及程序的自动缩进。此外，它允许用户按行、单词、字符、句子、页面和段落处理文本文件。用户甚至可以使用各种编程语言的注释和表达式。


    #### VIM


    该工具以前被称为“Vi Imitation”。由于它经历了无数改进，需要更改名称。现在，VIM 意味着“改进版的 Vi”。基本上，该工具是 vi（即一种 Unix
    文本编辑器）的改进版本。


