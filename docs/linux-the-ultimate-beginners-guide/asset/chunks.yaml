- fmt: "\nWhen using `VIM`, you can enter commands using your keyboard. That means\
    \ you can keep your hands on your keyboard and your eyes on the computer screen.\
    \ You don’t need to move the mouse so using this tool is simple and easy. If you\
    \ prefer to use a mouse, however, you may activate it using the tool’s configuration\
    \ page.\n\n# How to Use the VIM Editor\n\n`VIM` is a powerful tool that contains\
    \ a detailed pre-installed manual. To access the manual, you may run the `:help`\
    \ command while `VIM` is running. This section of the book will teach you how\
    \ to use this text editor.\n\n`VIM` can be extremely confusing for beginners because\
    \ it has two different modes: insert mode and command mode. This text editor will\
    \ start in command mode 100% of the time. In general, commands help you to mark,\
    \ search, and replace texts. The command mode also has a switch that you can use\
    \ to initiate `VIM`’s insert mode. Thus, every key has two potential uses: it\
    \ may represent commands for the tool (while in command mode), or characters that\
    \ you need to add (while in insert mode.)\n\n# The Basic Functions\n\n## How to\
    \ Move Through Text Contents\n\nYou can use the arrow keys of your keyboard to\
    \ move through texts. If this is not possible, you may:\n\n* Press `k` to move\
    \ the cursor upward\n* Press `j` to move the cursor downward\n* Press `l` to move\
    \ the cursor to the right\n* Press `h` to move the cursor to the left\n* Use `Shift\
    \ + G` to put the cursor at the end of the active text file.\n\n## The Basic Operations\n\
    \nHere are the well-known `VIM` commands:\n\n* `x` – This deletes the character\
    \ highlighted by the cursor.\n* `:n` – This moves the cursor to line `n` of the\
    \ document.\n* `:w` – This saves (or writes) the document.\n* `:q` – Use this\
    \ command to exit the text editor.\n* `:wq` – This command allows you to save\
    \ the recent file changes and exit `VIM`.\n* `:q!` – This command allows you to\
    \ exit the program without saving the recent changes.\n* `n p` – This command\
    \ pastes the copied text `n` times.\n* `n dd` – This deletes `n` lines from the\
    \ cursor’s current position.\n* `n dw` – This deletes `n` words to the right of\
    \ the cursor.\n* `:w newfile` – This command saves the document to `newfile`.\
    \ \n* `:wq!` – This overrides the read-only permission.\n* `/astring` – This command\
    \ searches the string in the document and places the cursor on the first result\
    \ it finds.\n* `/` – This command performs the previous search. Use this if you\
    \ want to see the next search result.\n* `yy` – This command copies text content.\n\
    * `:recover` – This command allows you to recover a document. Use this if you\
    \ experienced a process interruption while editing or writing a text file.\n\n\
    ## The Commands That Allow You to Activate VIM’s Insert Mode\n\n* `a` – Aside\
    \ from triggering the insert mode, you can use this command to append data to\
    \ existing files.\n* `i` – This command can activate the insert mode and insert\
    \ some data into an existing file.\n* `o` – This command can also add a blank\
    \ line on the cursor’s current position.\n\nYou can go back to the tool’s command\
    \ mode by pressing the `Escape` key. In general, you can use this key if you aren’t\
    \ sure about the mode you are currently using. You’ll know that you are in the\
    \ command mode once you have pressed the `Esc` key.\n\n### An Easy Way\n\nRather\
    \ than perusing the `VIM` manual, which can be extremely boring, you may trigger\
    \ `vimtutor` to understand basic `VIM` commands. `vimtutor` is a 30-minute tutorial\
    \ that explains the fundamental `VIM` functions. With this tutorial, you’ll be\
    \ a good VIM-user after completing eight simple exercises. Although you can’t\
    \ master `VIM` in just 30 minutes, this learning material is created to explain\
    \ sufficient commands. That means you’ll be skilled enough to use `VIM` as a multi-purpose\
    \ text editor.\n\nFor Unix and Windows systems, if `VIM` was installed properly,\
    \ you may initiate the program using either the shell or a command line. This\
    \ method will create a new copy of the tutorial, allowing you to modify it without\
    \ affecting the original file. As of now, this tutorial is available in different\
    \ languages. To check if your language is available, you may utilize the two-letter\
    \ code for languages. For English, this would be `vimtutor en`.\n\n# Chapter 7:\
    \ Networking\n\nLinux is your best option when it comes to building a network.\
    \ Here are some features of Linux that make it a great system for networking purposes:\n\
