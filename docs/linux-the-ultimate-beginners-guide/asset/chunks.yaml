    ## Chapter 1: Linux – The Basics


    ### What is Linux?


    Linux is an operating system (OS). It is a type of software that allows users
    and computer programs to interact with the machine (e.g. access the devices needed
    to perform certain tasks). The operating system forwards commands from a computer
    program to, for example, the PC’s processor. The processor conducts the given
    task, and transmits the data back to the program using the OS. Linux is like other
    operating systems, such as Windows and Mac OS.


    In addition, Linux is an open-source operating system. That means every user may
    check the software’s code and improve it – no single company is exclusively responsible
    for its continuous development and support. Businesses participating in the Linux
    project share research and development expenses with other organizations (e.g.
    partners, competitors, etc.). This distribution of responsibilities amongst groups
    and individuals has resulted in amazing software development and efficient working
    ecosystem.


    ### Linux – One of the Leading Operating Systems


    Now, Linux is one of the top players in the OS market. At first, Linux developers
    focused on networking and basic services. They didn’t create office applications
    during the OS’s first few years of existence. But now, these developers have created
    many alternatives to the programs included in Microsoft’s Office Suite. These
    new computer programs are designed to make Linux a great workstation. Aside from
    its user-friendly interface, Linux operating systems have Microsoft-compatible
    office programs such as presentations, spreadsheets, word processors, etc.


    In terms of servers, Linux is a stable and efficient platform – it provides trading
    and database services for businesses such as Amazon and US Post Office. ISPs (internet
    service providers) like Linux because of its proxy, firewall, and web server capabilities.
    Finally, arrays of Linux computers were used to create famous motion pictures
    (e.g. Shrek, Titanic, and many others).


    ### The User Interface of Linux


    Whether this OS is difficult to learn depends on the user you are talking to.
    Experienced users will certainly say no, since Linux is a great operating system
    for programmers and power-users. In addition, it has been checked and improved
    by thousands of computer experts.


    Linux provides programmers with everything they need: libraries, compilers, and
    debugging/development tools. These features are included in all standard Linux
    versions. You will also get the `C`-compiler for free – unlike most Unix systems
    that demand licensing fees. All of the manuals and documentations are included,
    and examples are usually given to help beginners in getting started. Because of
    this, switching between Unix and Linux is an easy and natural thing.


    ### Linux and Inexperienced Users


    Businesses such as SuSE, Mandriva and RedHat have been established, offering packaged
    distributions of Linux systems for public users. They combined many GUIs (graphical
    user interface), created and improved by the community, to streamline the usage
    and management of services and programs. As a modern Linux user, you have all
    the necessary tools to understand your operating system completely. However, deep
    knowledge is no longer needed before you can use the Linux system. Even beginners
    can use this OS with considerable ease.


    These days, you can sign in graphically and begin all the needed programs without
    even entering a single key. Linux system allows you to access the system’s core
    quickly and easily. Because of this setup, you can become familiar the basics
    of this OS: Linux is great for beginners and expert users. Inexperienced users
    don’t need to do difficult stuff, and expert users don’t have to use basic features.


    Here’s a screenshot of a Linux spreadsheet:


    ![](images/00001.jpeg)


    ## The Pros and Cons of Linux


    In this section, we will discuss the pros and cons of using a Linux operating
    system.


    ### The Pros


    - It is free – If you don’t want to spend anything for your computer’s OS, then
    this is the best software for you. You don’t have to purchase a CD just to get
    this powerful operating system. In fact, you can just go online and download Linux
    - FOR FREE. With this OS, you won’t have to worry about registration fees, update
    costs, and premium source codes.

    - It can be used with any hardware – A merchant who wants to sell a new PC but
    doesn’t know what type of OS the computer will run, can get a Linux kernel and
    use it for his hardware. He won’t experience any problems since tutorials and
    manuals are available for free.

