    斜杠 `/` 通常出现在根目录正下一层级的目录名前。这个符号用于指示这些目录的位置，并将它们与其他可能具有相似名称的位置隔离开。如果你正在使用新的 Linux
    系统，应该先检查根目录。以下是你会看到的内容：


    ![](img/00008.jpeg)


    ## 根目录的子目录


    * `/bin` – 此目录包含普通程序，供用户、系统和系统管理员共享。

    * `/dev` – 该子目录保存了指向 CPU 所有外围硬件的引用。通常，这些硬件设备被表示为具有特殊特征的文件。

    * `/boot` – 此目录由内核（即 `vmlinuz`）和启动文件组成。某些 Linux 系统还包含 `grub`（即统一引导加载程序 grand unified
    boot loader）信息。`Grub` 是一种旨在消除目前使用的各种启动加载程序的数据。

    * `/etc` – 该子目录包含与系统配置相关的文件。基本上，这类似于 Windows 的控制面板。

    * `/home` – 这是普通用户的主目录。

    * `/misc` – 该子目录用于存放杂文件。

    * `/lib` – 此目录包含计算机中安装的所有类型计算机程序的库文件。

    * `/opt` – 此位置通常存放第三方程序和额外程序。

    * `/root` – 这是系统管理员的主目录。

    * `/proc` – 这是一个虚拟文件数组，包含系统资源的数据。如果你想获取有关此子目录的更多信息，可以打开终端窗口并输入 `man proc`。

    * `/initrd` – 它保存启动过程的数据。你不应该删除这个子目录。

    * `/lost+found` – 该子目录包含在系统故障期间保存的文件。

    * `/tmp` – 这是操作系统使用的临时存储空间。由于它在系统重启时会被清理，请不要用它保存工作。

    * `/sbin` – 包含系统管理员和操作系统本身使用的计算机程序。

    * `/usr` – 包含与相关的计算机程序的库、程序和文档。

    * `/var` – 用于存储用户生成的变量和临时文件（例如：邮件队列、日志文件、文件下载等）。


    你可以使用 `df` 命令后跟点（即 `.`）来识别你当前使用的目录。该命令还会显示该特定目录占用的存储空间。这是一个截图：


    ![](img/00009.jpeg)


    通常情况下，每个子目录都属于根分区，除非在 `df` 生成的列表中具有不同的条目。


    ## Shell（解释壳）


    Shell 可以被视为一种语言：你用它来与计算机“对话”。大多数人知道另一种语言，即桌面使用的点点点击系统。然而，在那种语言中，是机器在引导对话——用户处于被动角色，从呈现出的任务中进行选择。对于计算机程序员来说，很难通过
    GUI 格式添加某个命令的所有用途和可能性。这就是为什么基于 GUI 的系统优于后端提供的命令。


    然而，Shell 是一种与机器交互的高级方法，因为它允许双向对话。此外，它允许用户采取主动。对话中的双方被同等对待，因此可以尝试新概念。Shell 允许你以多化的方式管理系统。此外，Shell
    还允许你自动化执行任务。


    ## 不同类型的 Shell


    以下是 Linux 操作系统使用的 Shell：


    * `sh`（也称为 Bourne Shell）– 这是最初用于 Unix 系统和 Unix 相关项目的 Shell。将其视为一个基础 Shell：一个功能有限的小型计算机程序。当你使用
    POSIX 兼容模式时，Linux 的 `bash` 会模拟这个 Shell。

    * `bash`（也称为 Bourne Again Shell）– 这是典型的 GNU Shell：多功能且直观。建议初学者使用它，尽管高级用户仍然可以将其作为主要工具。在使用
    Linux 时，`bash` 是普通用户的默认 Shell。

    * `csh`（也称为 C Shell）– 程序员使用这种 Shell，是因为它的语法与 C 语言语言相似。

    * `ksh`（也称为 Korn shell）– 熟悉 Unix 系统的人喜欢这个 Shell。

    * `tcsh`（也称为 Turbo C Shell）– 这是 C Shell 的超集，提升了系统的速度和用户友好性。


    如果你想查看 Linux 系统使用的 Shell 概览，可以检查 `/etc/shells` 文件。这是一个截图：


    ![](img/00010.jpeg)


    ## 如何切换到不同的 Shell


    要实现这一点，你只需要在活跃的终端中输入你偏好的 Shell 名称即可。操作系统将使用 `PATH` 设置来寻找新 Shell 的位置。因为 Shell 被视为计算机程序（即可执行文件），活跃的
    Shell 将启动并执行新的 Shell。


    ## 如何确定你正在使用的 Shell


    你可以通过以下两种方法识别活跃的 Shell：


    * 访问 `/etc/passwd` 目录并查看你用户账户的行。

    * 输入此命令：`echo $SHELL`


    ## 第 4 章：进程


    如果你想成为一名 Linux 用户，也应该理解进程。在本章中，你将学习 Linux 操作系统中执行的不同计算机进程。


    ### 基础知识


    ### 多用户与多任务


    现在你已经学会了如何与系统交互，可以更详细地学习计算机进程。某些命令无法通过单个进程执行。某些命令（例如 `mozilla`）会触发一组或一系列进程。


    此外，Linux 基于 Unix 系统，在该系统中，多个用户同时运行不同的命令是自然的。显然，你需要确保计算机处理器可以处理所有进程。你还应该提供允许用户在不同进程之间切换的功能。在某些情况下，即使启动的用户退出，进程也继续运行。你应该赋予用户恢复中断进程的能力。


    ### 不同类型的进程


    #### 交互式进程


    你必须使用终端会话来启动和控制交互式进程。这意味着只有当你连接到系统时，才能启动交互式进程。基本上，系统不会作为其基本功能的一部分启动这些进程。交互式进程在前台运行，占用启动它的终端。当这种情况发生时，只要该进程处于活动状态，你就无法启动其他程序。作为替代方案，可以将它们在后台运行，以便你使用的终端可以接收其他命令。


    Linux Shell 提供了名为“作业控制”（job control）的功能。该功能允许你轻松处理各种进程。作业控制可以在后台和前台之间切换进程。通过这种方式，你可以快速在后台启动进程。


    注意：只有不需要用户输入的程序才能在后台运行。通常，耗时较长的任务会被放在后台。


    以下列表显示了 Linux 系统常用的控制程序：


    * `bg` – 用于在后台激活已中断的进程。

    * `fg` – 将进程返回前台。

    * `jobs` – 显示正在后台运行的命令。

    * `kill` – 结束任务。

    * `regular_command` – 在系统前台运行命令。

    * `command &` – 在系统后台运行命令。它释放了终端：你可以在之前的命令仍然运行时运行其他程序。


