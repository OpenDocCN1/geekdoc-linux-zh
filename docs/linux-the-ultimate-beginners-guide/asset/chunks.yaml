  raw: 'A slash often precedes directories that are just one degree below the root
    directory. This symbol is used to indicate the position of those directories and
    differentiate them from other locations that may have a similar name. If you are
    using a new Linux system, you should check the root directory first. Here are
    the things that you’ll see:


    ![](images/00008.jpeg)


    The Subdirectories of a Root Directory


    *   /bin – This one contains ordinary programs, shared by the users, the system,
    and the system administrator.


    *   /dev – This subdirectory holds references to all the peripheral hardware of
    the CPU. In general, these pieces of hardware are indicated as files that have
    special characteristics.


    *   /boot – This is composed of the kernel (i.e. vmlinuz) and startup files. Some
    Linux systems also include the grub (i.e. grand unified boot loader) information.
    Grub is a piece of data designed to eliminate the various boot loaders being used
    today.


    *   /etc – This subdirectory contains files related to the system configuration.
    Basically, this is similar to the Control Panel of Windows computers.


    *   /home – This is the main directory for common users.


    *   /misc – This subdirectory is used for miscellaneous files.


    *   /lib – This one contains the library files for all types of computer programs
    installed in the computer.


    *   /opt – This location normally holds 3rd-party and extra programs.


    *   /root – This is the main directory of the system administrator.


    *   /proc – This is a virtual file array that contains data about the system’s
    resources. If you want to get more information about this subdirectory, you can
    open a terminal window and type in “man proc.”


    *   /initrd – This holds the data for booting processes. You should never remove
    this subdirectory.


    *   /lost+found – This subdirectory contains the files saved during system failures.


    *   /tmp – This is a temporary storage used by the operating system. Don’t use
    this for saving your work since it gets cleaned up during a system reboot.


    *   /sbin – This holds the computer programs used by the system administrator
    and the operating system itself.


    *   /usr – This contains the libraries, programs, and documentations, for user-related
    computer programs.


    *   /var – This is used to store variable and temporary files generated by users
    (e.g. mail queue, log files, file downloads, etc.).


    You can use the “df” command followed by a dot (i.e. “.”) to identify the directory
    you are currently using. This command also shows the amount of storage used on
    that particular directory. Here’s a screenshot:


    ![](images/00009.jpeg)


    In general, each subdirectory belongs to the root partition, unless it possesses
    a different entry in the list generated by “df.”


    The Shell


    A shell can be considered as a language: you use it to “talk” to a computer. Most
    people know the other language, the point-then-click system being used in desktops.
    However, in that language, the machine is directing the conversation – the user
    assumes a passive role of choosing tasks from the presented ones. It is hard for
    a computer programmer to add all uses and possibilities of a certain command using
    the GUI-format. That’s why GUI-based systems are inferior to commands given from
    the backend.


    A shell, however, is an advanced method of interacting with the machine, since
    it enables two-way conversations. Additionally, it allows the user to take the
    initiative. Both parties in the conversation are treated equally, so new concepts
    can be tried. Shells allow you to manage the system in a versatile way. As a bonus,
    shells allow you to automate tasks.


    The Different Types of Shells


    Here are the shells used by the Linux operating system:


    *   “sh” (also known as the Bourne Shell) – This is the shell originally used
    for Unix systems and Unix-related projects. Consider this as a basic shell: a
    small computer program that has limited features. When you are using a POSIX-compatible
    mode, Linux’s bash will mimic this shell.


    *   “bash” (also called the Bourne Again Shell) – This is the typical GNU shell:
    versatile and intuitive. Beginners are advised to use this, although advanced
    users can still use this as their main tool. When using Linux, bash is the default
    shell for ordinary users.


    *   “csh” (also known as C Shell) – Programmers use this shell since its syntax
    is similar to that of the C-programming language.


    *   “ksh” (also called the Korn shell) – People who are familiar with Unix systems
    appreciate this shell.


    *   “tcsh” (also known as Turbo C Shell) - This is a superset of the C Shell,
    boosting the system’s speed and user-friendliness.


    If you want to see an overview of the shells used in Linux systems, you may check
    the file /etc/shells. Here’s a screenshot:


    ![](images/00010.jpeg)


    How to Switch to a Different Shell


    To accomplish this, you just need to type in the name of your preferred shell
    in an active terminal. The operating system will use the PATH settings to find
    the location of the new shell. Because shells are considered as computer programs
    (i.e. executable files), the active shell will start and execute the new one.


    How to Determine the Shell You Are Using


    You can identify the active shell using these two methods:


    *   Access the directory /etc/passwd and see the line for your user account.


    *   Enter this command: echo $SHELL


    Chapter 4: The Processes


    You should also understand processes if you want to be a Linux user. In this chapter,
    you’ll learn about the different computer processes performed in Linux operating
    systems.


    The Basics


    Multi-users and Multi-tasking


    Now that you know how to interact with the system, you may study computer processes
    in more detail. Some commands cannot be executed using a single process. There
    are commands (e.g. “mozilla”) that trigger a group or series of processes.


    Additionally, Linux is based on the Unix system, where it is natural to have different
    users running different commands simultaneously. Obviously, you need to make sure
    that the computer’s processor can handle all the active processes. You should
    also provide a functionality that allows users to switch between different processes.
    In certain cases, you have to continue running a process even if the user who
    initiated it already logged out. You should also give users the capability to
    resume interrupted processes.


    Different Types of Processes


    Interactive Processes


    You have to use a terminal session to start and control interactive processes.
    That means you can only start an interactive process if you are already connected
    to the system. Basically, the system doesn’t start these processes automatically
    as part of its basic functions. An interactive process runs in the foreground,
    taking over the terminal that started it. When this happens, you can’t initiate
    other programs as long as that particular process is active. As an alternative,
    you may run them in the background, so that the terminal you used can receive
    other commands.


    Linux shells provide a feature called “job control.” This feature allows you to
    handle various processes easily. Job control can switch processes between the
    background and the foreground. With this, you may quickly start processes in the
    background.


    Important Note: You can only run processes in the background for programs that
    don’t require user inputs. In general, tasks are placed in the background if they
    take a long time to complete.


    The following list shows the common control applications for Linux systems:


    *   “bg” – This is used to reactivate an interrupted process in the background.


    *   “fg” – This returns the process onto the foreground.


    *   “jobs” – It shows the commands being run in the background.


    *   “kill” – This ends a task.


    *   “regular_command” – This runs the command in the system’s foreground.


    *   “command &” – This runs the command in the system’s background. It releases
    the terminal: you can run other programs while the previous command is still active.'
