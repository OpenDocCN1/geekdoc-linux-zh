- "# LINUX：终极初学者指南！\n\n\n\n![](img/cover.jpeg)\n\n\n\n## 引言\n\n我想感谢你购买本书，并祝贺你……\n\n\
  “LINUX：终极新手指南！”\n\n这本书将教你如何使用 Linux 操作系统。在阅读这些材料后，你将能够使用 Linux 进行基础和高级用途。除了解释基本概念和理论外，这本书还将为你提供实用的技巧和实际命令。这意味着你通过阅读这本书就能成为一名精通的\
  \ Linux 用户。\n\n每一章都致力于 Linux 的一个重要方面。例如，有一章专门介绍 Linux 使用的文件系统。通过这种数据呈现方式，你不必在阅读无关话题上浪费时间。\n\
  \n请彻底学习这本书，因为可以帮助你让 Linux 电脑发挥最大价值。\n\n再次感谢购买本书，希望你喜欢它！\n\n## 第一章：Linux – 基础\n\n\
  ### 什么是 Linux？\n\nLinux 是一个操作系统（OS）。它是一种软件，允许用户和计算机程序与机器进行交互（例如访问执行某些任务所需的设备）。操作系统将来自计算机程序的指令转发给（例如）PC\
  \ 的处理器。处理器执行给定的任务，并通过操作系统将数据传回程序。Linux 类似于 Windows 和 Mac OS 等其他操作系统。\n\n此外，Linux\
  \ 是一个开源操作系统。这意味着每个用户都可以检查软件代码并对其改进——没有哪家公司专门负责它的持续开发和支持。参与 Linux 项目的企业与其他机构（例如合作伙伴、竞争对手等）共享研发费用。这种在团体和个人之间的责任分担，导致了令人惊叹的软件开发和高效的工作生态系统。\n\
  \n### Linux – 领先的操作系统之一\n\n现在，Linux 是操作系统市场上的顶尖者之一。起初，Linux 开发者专注于网络和基础服务。在操作系统存在的最初几年几年里，他们并没有创建办公应用程序。但现在，这些开发者已经创建了许多微软\
  \ Office 套件中包含程序的替代方案。这些新的计算机程序旨在让 Linux 成为优秀的工作站。除了用户友好的界面外，Linux 操作系统拥有与微软兼容的办公程序，如演示文稿、表格、文字处理器等。\n\
  \n在服务器方面，Linux 是一个稳定高效的平台——它为亚马逊和美国邮政等企业提供交易和数据库服务。ISP（互联网服务提供商）喜欢 Linux 是是因为它的代理、防火墙和网络服务器功能。最后，大量的\
  \ Linux 计算机被用于制作著名的电影（例如《史莱克》、《泰坦尼克号》等等）。\n\n### Linux 的用户界面\n\n这个操作系统是否难学取决于你所交流的用户。经验丰富的用户无疑会说不，因为\
  \ Linux 对程序员和高级用户来说是一个极好的操作系统。此外，它经过了数千名计算机专家的检查和改进。\n\nLinux 为程序员提供了所需的一切：库、编译器以及调试/开发工具。这些功能包含在所有标准\
  \ Linux 版本中。你还将免费获得 `C` 编译器——与大多数要求许可费的 Unix 系统不同。所有的手册和文档都包含在内，通常会提供示例以帮助新手起步。由于由于，在\
  \ Unix 和 Linux 之间切换是一件容易而自然的事情。\n\n### Linux 与无经验的用户\n\nSuSE、Mandriva 和 RedHat 等企业已经建立，为公共用户提供封装好的\
  \ Linux 系统发行。它们结合了许多社区创建和改进的 GUI（图形用户界面），以简化服务和程序的使用管理。作为一名现代 Linux 用户，你拥有所有必要的工具来完全理解你的操作系统。然而，在使用\
  \ Linux 系统之前，不再需要深厚的知识。即使是新手也可以相当轻松地使用此操作系统。\n\n如今，你可以通过图形登录并启动所有需要的程序，而无需输入任何键。Linux\
  \ 系统允许你快速快捷地访问系统核心。由于这种设置，你可以熟悉该操作系统的基础知识：Linux 非常适合新手和专家用户。无经验的用户不需要做复杂的事情，专家用户不需要使用基础功能。\n\
  \n这里是 Linux 表格的截图：\n\n![](img/00001.jpeg)\n\n## Linux 的优缺点\n\n在本节中，我们将讨论使用 Linux\
  \ 操作系统的优缺点。\n\n### 优点\n\n- 免费——如果你不想为计算机操作系统花费任何费用，那么这就是最适合你的软件。你不需要购买光盘来获得这个强大的操作系统。事实上，你只需要在线下载\
  \ Linux —— 免费。有了这个操作系统，你不需要担心注册费、更新成本和高级源代码。\n- 能够与任何硬件配合——想要销售新 PC 但不知道电脑将运行何种操作系统的商人，可以获取\
  \ Linux 内核并将其用于他的硬件。由于有免费的教程和手册，他不会遇到任何问题。\n\n\n\n\n\n* 它的设计旨在持续运行——就像 Unix 一样，Linux\
  \ 系统被设计为无需重启即可持续运行。这就是为什么许多任务在晚上执行或自动分配的原因。这提高了计算机在忙碌期间的可用性，并在硬件使用率方面实现了更好的平衡。这一特性使得\
  \ Linux 适用于那些没有时间或资源 24/7 小时管理自己机器的工作区域。\n\n* 它是完全安全且灵活的——Linux 系统基于 Unix 的安全模型（Unix\
  \ 以其顶级的安全性闻名）。然而，Linux 不仅在防止网络黑客攻击方面有效：使用相同的安全标准也适用于其他情况。你的控制站或开发计算机可以像防火墙本身一样安全。\n\
  \n* 它具有可扩展性——从具有 2MB 存储容量的掌上机到拥有众多节点的 PB 级内存内存集群：只要包含或排除正确的软件包，Linux 系统就能为你工作服务。你不再需要超级计算机了，因为你可以使用此操作系统通过预装程序来完成宏大的任务。如果你倾向于做一些小事，比如为嵌入式处理器开发操作系统或回收旧程序，Linux\
  \ 仍然可以为你提供帮助。\n\n* 它的调试时间极短——由于 Linux 系统是由成千上万的用户设计和测试的，问题通常很容易被发现。有时，在发现故障和解决故障之间只需要几个小时。\n\
  \n### 缺点\n\n* 版本太多——Linux 系统的数量可能令人生生畏。然而，这也意味着所有用户都能找到他们需要的。你不需要成为计算机专家就能找到一个好的版本。\n\
  \n总的来说，Linux 用户声称理想的版本就是他们正在使用的那一个。那么，你应该选择哪个版本呢？在这一点上，你不必担心这个问题——每个发行版本都包含几乎相同的基础功能\
  \ set。除了核心功能外，还包含了第三方程序，这使得例如 TurboLinux 更加适合中小型企业。基本上，它们之间的差异是表浅的。理想的策略是尝试一些 Linux\
  \ 发行版——遗憾的是，并不是每个人都有时间和资源去这样做。\n\n你可以做的是通过在线论坛和讨论板从其他用户那里获得建议。你可以对你想要的 Linux 系统运行\
  \ Google 搜索，并扫描搜索结果寻找相关的论坛。这些在线论坛将为你提供所需的信息（例如，特定 Linux 版本的优缺点）。\n\n* Linux 对于缺乏经验的用户来说可能令人困惑——事实确实，在核心层面，Linux\
  \ 没有其他操作系统那么用户友好。由于它的知名度，人们付出了巨大的努力让 Linux 系统变得更容易使用，特别是对于初学者。现在定期提供更多数据以帮助 Linux\
  \ 用户熟悉此操作系统的复杂之处。\n\n* 它的可靠性值得怀疑——有成千上万的人工作过这个操作系统，这让用户对其可靠性和信任度产生怀疑。此外，这种系统是免费提供的：如今，人们对免费的东西深表怀疑。\n\
  \n## 第二章：基本功能\n\n为了帮助你充分利用 Linux 系统，让我们讨论一下可以使用它们执行的基本操作。\n\n### 如何登录、激活界面和注销\n\n\
