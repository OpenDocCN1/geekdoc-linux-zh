  \ processes can be executed using one of these methods:\n\n(The rest of the translation\
  \ follows)\n\n 译文：\n\n[content]\nThese are server processes that continuously run.\
  \ Often, they are activated during startup and wait in the system's background until\
  \ their services are needed.\n\n## The Boot Process\n\nOne of the popular features\
  \ of Linux is its method of initiating and suspending the OS, where it gets specific\
  \ programs through their ideal settings, allows you to modify the settings and the\
  \ boot procedure, and stops in an organized and graceful way.\n\nBeyond manipulating\
  \ the boot and shutdown processes, the “openness” of Linux systems helps you to\
  \ determine the causes of problems related to shutting down or booting up your machine.\n\
  \n### The Procedure\n\nWhen a computer is started up, the CPU looks for the Basic\
  \ Input/Output System (`BIOS`) and executes it. This program is coded into the computer’s\
  \ permanent `ROM` (read-only memory) and is available for use anytime. The computer’s\
  \ `BIOS` provides peripheral devices with a low-level interface and manipulates\
  \ the first phase of the startup procedure.\n\nThe `BIOS` checks the entire system,\
  \ searches for and tests peripheral devices, and searches for a drive that can be\
  \ used to start the system. Often, `BIOS` checks the CD-ROM drive (for newer OS)\
  \ or the floppy drive (for older ones) for usable media. The sequence of the drives\
  \ utilized for the booting process is commonly managed by a certain `BIOS` configuration\
  \ on the operating system. Once a Linux system is installed onto the computer’s\
  \ hard drive, the `BIOS` searches for an `MBR` (i.e. master boot record) starting\
  \ at the initial part of the first hard disk, puts the data into the memory, and\
  \ gives control to it.\n\nThe Master Boot Record holds the steps on how to use the\
  \ `LILO` or `GRUB` boot-loader, through a predetermined OS. Afterward, the `MBR`\
  \ activates the boot-loader, which controls the rest of the process (that is, if\
  \ a boot-loader is installed in the Master Boot Record). In the standard configuration\
  \ of the Red Hat OS, `grub` utilizes the settings in the master boot record to show\
  \ available boot choices. Once `grub` gets the right instructions for the OS to\
  \ boot, either from the configuration file or its own command line, it acquires\
  \ the required boot file and passes the control of the computer to the OS.\n\n###\
  \ The Different Features of GRUB\n\nThis method of booting up a computer is known\
  \ as direct loading. This is because no transitional code exists between the boot-loader\
  \ and the OS’s main files (e.g. the kernel). Thus, startup instructions are utilized\
  \ to load the OS directly.\n\n\n\n\nBash 提供了一个预装的 `time` 命令，用于显示执行进程所需的时间。该工具兼具准确性和多功能性——你可以用它来获取任何命令的精确数据。为了帮助你理解\
  \ `time` 命令，下面提供了一张截图：\n\n![](img/00011.jpeg)\n\n在这个示例中，`time` 命令用于计算创建一个特定 `.pdf`\
  \ 文件所需的时间。结果显示该过程耗时 1 分钟 41 秒。\n\n目录 `/usr/bin` 包含一个 GNU 版本的 `time` 命令（这与预装的 BASH\
  \ 工具不同）。该命令可以显示更多数据，并用于多种方式。此外，它还会显示命令的退出状态和总运行时间。当与 GNU `time` 命令配合使用时，上述示例提供了这些结果：\n\
  \n![](img/00012.jpeg)\n\n如果你想了解更多关于这些时间命令，可以检查系统的 `Info` 页面。\n\n## 性能\n\n对于普通用户来说，“卓越性能”指的是进程快速且正确的执行。然而，对于系统管理员来说，这些词具有更深层的含义：管理员需要最大化整个系统的性能，包括守护进程、程序和用户。通常，系统性能可能取决于许多未被\
  \ `time` 命令评估的“微不足道”因素。以下是这些“微不足道”因素的一些示例：\n\n* 对驱动器、显示器、控制器、接口等的访问。\n* 运行的程序设计不当，或没有有效利用计算机资源。\n\
  * 系统中活跃用户的数量。\n* 一天中的时间。\n* 远程网络的可用性。\n\n## 负载\n\n基本上，负载取决于对你的网络来说什么是常态。例如，一台运行防火墙、文件服务器、SSH\
  \ 服务器、路由守护进程、代理服务器、sendmail 服务器和其他设备的旧 P133 可以支持最多 7 个活跃用户。在这种情况下，负载仍然为零。某些系统（特别是具有多个处理器的系统）可以轻松支持多达\
  \ 67 个用户。\n\n识别网络负载的方法只有一个：定期进行检查。这样，你就会知道你的网络中什么是常态。如果你不使用这种方法，只能通过命令的响应时间来判断系统负载。响应时间缺乏准确性——由于各种因素的影响，它是并不可靠的。\n\
  \n记住，即使具有相同的平均负载，不同网络的行为也不同。例如，如果网络拥有支持硬件加速的显卡，它可以流畅地渲染 3D 图像。然而，使用旧 VGA 卡的网络在渲染图像时会像乌龟一样慢。旧系统在启动\
  \ X 服务器时可能非常慢，而现代系统则甚至“感觉”不到增加的负载。\n\n## 优先级\n\n任务的重要性（或优先级）由其 nice 值决定。高 nice 值的任务对其他用户、其他任务以及网络本身是“协作”的（或是“友好”的）：它们是低优先级任务。低\
  \ nice 值表示其所属的任务很重要，并将将消耗更多的系统资源。\n\n你可以通过给任务一个更高的 nice 值来使其变得“更友好”。然而，这种技术仅对需要大量\
  \ CPU 时间的进程（例如软件编译器）有效。持续利用大量 I/O 时间的进程会被赋予较低的 nice 值（即更高的优先级）。例如，键盘输入在计算机网络中始终获得最高优先级。\n\
  \n你可以使用 `nice` 命令设置程序的重要性。\n\n许多系统提供了一个名为 `BSD renice` 的命令。该命令允许用户编辑活动程序的“友好度”。你可以检查你操作系统的手册，以确定该命令是否可用。\n\
  \n## CPU 资源\n\n在每个操作系统上，许多进程都需要同时使用计算机的 CPU。即使你是唯一的活跃用户也是如此。每个进程都需要特定数量的 CPU 资源才能正常运行。有时，由于\
  \ CPU 处理许多请求，计算机程序可能无法获得资源。如果你想优化计算机，就需要了解可用的系统资源。你可以使用工具来获取这些数据。\n\n`Uptime` 是你可以在\
  \ Linux 中使用的命令之一，它缺乏准确性（它只能显示平均值，你需要识别出正常数值），但在某些情况下是有用的。以下是你可以采取的提高 CPU 效率的一些措施：\n\
  \n* 停止系统执行不必要的任务。停止你没有使用的程序和守护进程。你可以使用 `locate` 命令来实现此。\n* 在系统负载处于低水平时运行资源密集型进程。通常，你应该在夜运行“重量级”进程。\n\
  * 优先运行低优先级任务。\n\n如果这些方法不能解决你的问题，你可能需要一个更好的 CPU。对于 Linux 系统来说，这是系统管理员的工作。\n\n## 用户\n\
  \n在 Linux 系统中，根据使用系统资源的方式，可以将计算机用户分为不同的类型。以下是 Linux 用户的三种类型：\n\n* 运行大量小进程的人。一个很好的例子是没有经验的\
  \ Linux 用户。\n* 运行几个（但很复杂的）进程的人。这种类型的例子是运行模拟器、计算和仿真的人。\n* 运行少数需要大量 CPU 时间的进程的人（例如游戏开发者）。\n\
  \n正如你看到的，每种类型的用户系统要求不同。此外，要满足网络中所有用户的需求是非常困难的。如果你属于多用户网络，识别同事的习惯是有益的（而且很有趣）。\n\n\
  ## 可视化工具\n\n对于图形环境，你在监控工具方面有广泛的选择。这里是名为 `Gnome System Monitor` 工具的截图。该工具可以发现并显示活动任务的信息。此外，它还可以监控系统资源。\n\
  \n![](img/00013.jpeg)\n\n大多数 Linux 系统都有一些用的图标（例如负载、磁盘等的监控器），你可以将其安装到任务栏上。\n\n# 第\
  \ 5 章：I/O 重定向\n\n本章将解释输入、输出和错误的重定向机制。I/O（输入/输出）重定向最初是为 Unix 系统开发的一种机制。\n\n## 简单重定向\n\
  \n### 标准输入和标准输出\n\n许多 Linux 命令会扫描输入（例如文件或命令属性）并产生输出。通常，输入是通过键盘输入的，输出是通过计算机显示器显示的。键盘被视为标准输入设备（也称为\
  \ `stdin`）。显示器和终端窗口被视为标准输出设备（也称为 `stdout`）。\n\n然而，由于 Linux 系统是多功能的，你不必应用这些默认设置。例如，打印机可以作为某些网络的标准输出设备。\n\
  \n### 用于 I/O 重定向的运算符\n\n#### 使用 \"|\" 和 \">\" 重定向输出\n\n在某些情况下，你需要将进程的输出保存为单独的文件。或者，你可能需要在完成进程的输出上运行命令。这被称为输出重定向。这种重定向通过使用\
  \ `|` 或 `>` 运算符来实现。这些运算符将进程的输出作为输入传输给另一个进程。\n\n在这里，你可以使用 `cat` 命令合并文件并作为标准输出。当将输出重定向到新文件时，将创建此文件名——如果它已存在，则会覆盖。这意味着你应该小心处理\
  \ I/O 重定向。这里有一张截图：\n\n![](img/00014.jpeg)\n\n使用重定向将“空”保存到现有文件类似于清空该文件：\n\n![](img/00015.jpeg)\n\
  \n此过程被称为截断。\n\n使用重定向到不存在的文件将生成新的空文件。这里是一个示例：\n\n\n\n\n\n![](img/00016.jpeg)\n\n\
  ## 输入重定向\n\n在其他情况下，你可能需要使用一个现有文件作为进程的输入。如果该进程无法正常接收文件，你就需要使用 `<` 运算符。在下面的示例中，利用输入重定向将文件发送给另一个用户。\n\
  \n![](img/00017.jpeg)\n\n如果用户（在当前示例中为“mike”）是本地网络中的现有成员，你就不需要输入完整地址。相反，如果你想通过互联网与某人联系，你必须提供完整的电子邮件地址以邮件形式发送消息。\n\
  \n## 如何组合重定向\n\n在本节中，你将学习如何结合两种类型的重定向。首先，对文件（即 `text.txt`）进行拼写错误扫描。然后，将结果重定向到名为“error”的日志文件中。\n\
  \n![](img/00018.jpeg)\n\n下一张截图显示了所有可以使用 `less` 命令执行以检查不同文件的命令。\n\n![](img/00019.jpeg)\n\
  \n请记住，Linux 系统对大小写极其敏感。这意味着在进行不区分大小写的网络搜索时，你应该使用 `–i` 选项。\n\n如果你认为未来可能需要某些信息，你可以将输出保存到文件中：\n\
  \n![](img/00020.jpeg)\n\n确保你没有使用正在运行的文件名称。使用这些名称进行重定向将覆盖现有文件的内容。\n\n## 高级重定向\n\n\
  ### 文件描述符\n\n目前，I/O 分三种类型。每种类型都有自己的标识符，称为“文件描述符”。它们是：\n\n* 标准输入 (Standard Inputs)\
  \ = 0\n* 标准输出 (Standard Outputs) = 1\n* 标准错误 (Standard Errors) = 2\n\n对于下面的描述，如果\
  \ `<` 是重定向运算符的起始字符且缺少文件描述符，重定向过程指向标准输入。相反，如果起始字符为 `>` ，进程指向标准输出。下面提供的实际示例将帮助你理解这一概念。\n\
  \n示例命令：![](img/00021.jpeg) - 这会将输出和错误都重定向到“dirlist”文件。\n\n示例命令：![](img/00022.jpeg)\
  \ - 这会将标准输出重定向到“dirlist”文件。\n\n这些示例对计算机程序员来说非常有用。\n\n### 实用技术\n\n#### 如何分析错误\n\n\
  如果某个进程产生了许多错误，你可以使用以下命令：\n\n![](img/00023.jpeg)\n\n该命令允许你彻底检查易错的进程。此外，在开发新的计算机程序时，你可以将其与\
  \ `make` 命令结合。这里有一个示例：\n\n![](img/00024.jpeg)\n\n#### 如何将标准输出与标准错误分离\n\n程序员经常需要将输出与错误分离。这意味着他们使用某些结构在终端窗口中显示输出，在另一个窗口显示错误。你可以运行\
  \ `tty` 命令来识别活跃的伪终端。该命令如下：\n\n![](img/00025.jpeg)\n\n#### 如何同时写入文件和输出\n\n如果你想将输入复制到标准输出和其他文件中，你可以使用\
  \ `tee` 命令。该命令允许你一次性写入输出和文件。你必须使用 `–a` 选项将信息追加到现有文件中。此外，此命令还可以显示并保存进程输出。\n\n要激活此工具，你应该使用“管道”（见下文）。\n\
  \n![](img/00026.jpeg)\n\n### 过滤器\n\n当计算机程序对输入执行任务并将结果保存到标准输出时，被称为过滤器。过滤器通常用于重构输出。在本节中，你将学习\
  \ Linux 操作系统中最重要的过滤器。\n\n#### GREP 命令\n\n你可以使用 `grep` 命令彻底扫描输出文件并搜索模式。包含匹配模式的行将被复制到标准输出文件。你可以通过添加\
  \ `–v` 选项来反转这种行为。\n\n例如，假设你需要知道特定目录中的哪些条目在 2 月份被编辑过。你应该使用的命令如下：\n\n![](img/00027.jpeg)\n\
  \n像其他命令一样，`grep` 对大小写敏感。你可以使用 `–i` 来忽略大小写差异。还存在许多 GNU 扩展。例如，`--colour` 是一个可以帮助你在处理长行时突出显示关键词的扩展。同时，`--after-context`\
  \ 是一个 GNU 扩展，用于检查并打印最后一条匹配行之后的总行数。你还可以使用 `–r` 选项运行递归 `grep` 命令。该命令会扫描你在当前会话期间访问的所有目录的子目录。\n\
  \n如果你想添加更多关于字符匹配的详细信息，可以使用正则表达式。阅读关于 `grep` 的文档，这样你就可以在搜索中使用正则表达式了。\n\n#### 如何对输出\n\
  \n`sort` 命令允许你排列行。默认情况下，它按字母顺序组织信息。这里有一个示例：\n\n![](img/00028.jpeg)\n\n但 `sort` 还可以做其他事情。例如，它可以帮助检查文件大小。使用此命令，你可以根据文件大小安排目录内容。这是一个示例：\n\
  \n![](img/00029.jpeg)\n\n# 第 6 章：Linux 系统与文本编辑器\n\n本章将解释文本编辑器在 Linux 操作系统中的重要性。此外，还将教你如何掌握文本编辑器。\n\
  \n## 文本器的通用信息\n\n### 为什么要使用这种工具？\n\n作为 Linux 用户，你必须学会使用文本编辑器。学会这种工具是走向精通和独立的必要步骤。\n\
  \n你必须掌握一种编辑器，因为你将在 Linux 环境中编辑文件。使用文本编辑器可以轻松完成。如果你是高级用户，将在编写网站、书籍、脚本和程序时利用这种工具。基本上，掌握文本编辑器将极大提高你的整体效率和能力。\n\
  \n### 你应该选择哪个编辑器？\n\n本章关注文本编辑器，它们用于终端窗口和缺乏图形界面的系统。作为额外，你可以在远程计算机上使用文本编辑器。由于你不需要通过系统发送整个图形界面，使用文本编辑器可以提高你的效率。\n\
  \n显然，你有多种方法来解决问题。以下是一些用于 Linux 系统的编辑器：\n\n#### GNU Emacs\n\nEmacs 是一种可定制、多功能、自文档文本编辑器，可以实时显示信息。该编辑器用于\
  \ Linux 和 Unix 操作系统。当你输入命令时，屏幕会显示并更新你正在工作的文本。它被认为是“实时”，因为它频繁更新信息，通常在你输入每个字符后更新。这意味着你可以减少编辑时需要记忆的大量数据。\n\
  \n计算机用户将其称为“高级”工具，因为它允许他们做很多事情。例如：删除和插入字符、管理子任务、同时查看多个文件、修改文本文件以及程序的自动缩进。此外，它允许用户按行、单词、字符、句子、页面和段落处理文本文件。用户甚至可以使用各种编程语言的注释和表达式。\n\
  \n#### VIM\n\n该工具以前被称为“Vi Imitation”。由于它经历了无数改进，需要更改名称。现在，VIM 意味着“改进版的 Vi”。基本上，该工具是\
  \ vi（即一种 Unix 文本编辑器）的改进版本。\n\n\n\n\n\n在使用 `VIM` 时，你可以通过键盘输入命令。这意味着你可以让手停留在键盘上，眼睛直视电脑屏幕。你不需要移动鼠标，因此使用这个工具既简单又方便。然而，如果你更倾向于使用鼠标，可以通过工具的配置页面来激活它。\n\
  \n## 如何使用 VIM 编辑器\n\n`VIM` 是一个强大的工具，包含了一份详细的预装手册。要访问该手册，你可以在 `VIM` 运行时运行 `:help`\
  \ 命令。本书的这一部分将教你如何使用这个文本编辑器。\n\n`VIM` 对初学者可能会非常困惑，因为它有两个不同的模式：插入模式和命令模式。这个文本编辑器 100%\
  \ 的时间会在命令模式启动。通常情况下，命令帮助你标记、搜索和替换文本。命令模式还有一个开关，你可以用它启动 `VIM` 的插入模式。因此，每个键都有两个潜在的用途：它可能代表工具的命令（在命令模式下），也可能代表你需要添加的字符（在插入模式下）。\n\
  \n### 基本功能\n\n### 如何在文本中移动\n\n你可以使用键盘的方向键在文本中移动。如果无法这样做，你可以：\n\n* 按 `k` 将光标向上移动\n\
  * 按 `j` 将光标向下移动\n* 按 `l` 将光标向右移动\n* 按 `h` 将光标向左移动\n* 使用 `Shift + G` 将光标置于活动文本文件的末尾\n\
  \n### 基本操作\n\n这里是一些常见的 `VIM` 命令：\n\n* `x` – 删除光标高亮的字符。\n* `:n` – 将光标移动到文档的第 `n`\
  \ 行。\n* `:w` – 保存（写入）文档。\n* `:q` – 使用此命令退出文本编辑器。\n* `:wq` – 此命令允许你保存最近的文件更改并退出 `VIM`。\n\
  * `:q!` – 此命令允许你在不保存最近更改的情况下退出程序。\n* `n p` – 此命令将复制的内容粘贴 `n` 次。\n* `n dd` – 从光标当前位置删除\
  \ `n` 行。\n* `n dw` – 删除光标右侧 `n` 个单词。\n* `:w newfile` – 此命令将文档保存为 `newfile`。\n* `:wq!`\
  \ – 覆盖只读权限。\n* `/astring` – 在文档中搜索字符串并将光标置于找到的结果上。\n* `/` – 此命令执行上一次搜索。如果你想查看下一个搜索结果，请使用此命令。\n\
  * `yy` – 复制文本内容。\n* `:recover` – 此命令允许你恢复文档。如果你在编辑或写入文本文件时遇到进程中断，请使用此命令。\n\n## VIM\
  \ 插入模式的命令\n\n* `a` – 除了触发插入模式外，你还可以使用此命令向现有文件追加数据。\n* `i` – 此命令可以激活插入模式并向现有文件插入一些数据。\n\
  * `o` – 此命令可以在光标当前位置添加一个空行。\n\n你可以通过按下 `Escape` 键返回工具的命令模式。通常情况下，如果你不确定当前正在使用的模式，可以使用此键。一旦你按了\
  \ `Esc` 键，你就知道自己处于命令模式了。\n\n### 一种简单的方法\n\n与其仔细阅读可能极其无聊的 `VIM` 手册，你可能触发 `vimtutor`\
  \ 来理解基础的 `VIM` 命令。`vimtutor` 是一个 30 分钟的教程，解释了基础的 `VIM` 功能。通过这个教程，在完成八简单的练习后，你将成为良好的\
  \ VIM 用户。虽然你无法在 30 分钟内精通 `VIM`，但这些学习材料旨在解释足够的命令。这意味着你将足够熟练使用 `VIM` 作为多功能文本编辑器。\n\
  \n对于 Unix 和 Windows 系统，如果 `VIM` 安装妥当，你可以使用 shell 或命令行启动程序。这种方法会创建一个教程的新副本，允许你对其进行修改而不影响原始文件。到目前为止，该教程提供多种语言版本。要检查你的语言是否可用，你可以利用语言的两个字母代码。对于英语，应该是\
  \ `vimtutor en`。\n\n# 第 7 章：网络\n\n在构建网络方面，Linux 是你的最佳选择。以下是 Linux 使其成为网络之优秀系统的一些特性：\n\
  \n* 网络功能是操作系统的内置功能。\n* 有许多免费的网络工具和程序。\n* 即使整个网络承受高负载，该操作系统也是可靠的。\n\n在本章中，你将学习如何使用\
  \ Linux 进行网络。\n\n## 网络 – 概述\n\n### 简单模型\n\n简单来说，协议是用于通信的一组规则。为了跨网络获取信息，各种软件和硬件必须和谐地工作。\n\
  \n这些软件和硬件使用不同的“语言”。例如，电子邮件程序通过特定协议与计算机的操作系统通信。然而，同一个程序无法与计算机硬件“对话”。你必须使用一个可以执行此任务的特殊程序。\n\
  \n反之，机器必须与电话线（或其他用于获取在线访问的连接方法）通信。在“后台”，用于网络连接的硬件必须与类似的设备通信，以成功发送消息。\n\n这些各种协议被分为七层，称为\
  \ OSI 模型（开放系统体系参考模型）：\n\n* 网络层 – 该层使用 `IP` 和 `IPv6`。\n* 传输层 – 该层使用 `UDP` 和 `TCP`。\n\
  * 应用层 – 该层使用 `DNS`、`POP3`、`SMTP` 和 `HTTP`。\n* 网络访问层 – 该层使用 `Ethernet`、`PPP` 和 `PPPoE`。\n\
  \n## 网络信息与配置\n\n## 网络接口 – 基本配置\n\n每个 Linux 系统都带有图形化工具。你可以使用这些工具连接互联网或建立本地网络。要访问图形化工具，你可以使用命令行或以下选项之一：\n\
  \n* 对于 Ubuntu 系统，进入 系统 > 管理 > 网络。\n* 对于 Gnome 系统，运行 `gnome-network-preferences`。\n\
  * 对于 KDE 系统，运行 `knetworkconf`。\n* 对于 Mandriva/Mandrake 系统，运行名为 Network and Internet\
  \ Configuration 的预装工具。\n* 对于 RedHat 系统，你可以运行 `redhat-config-network`。此命令提供两种模式：图形模式和文本模式。\n\
  \n以下是你连接网络时应该做的事情：\n\n1. 连接互联网 – 你需要提供互联网提供商（ISP）的登录信息。如果你使用调制解调器，还需要提供电话号码。完成后，你的\
  \ ISP 将提供上线所需的一切。\n2. 连接本地网络 – 你必须提供你的 IP 地址、主机名和域名。如果你在工作中进行此操作，计算机将给你列出的信息。\n\n\
  ## 配置文件\n\n图形工具可以帮助你修改网络配置文件。配置文件的名称和位置取决于你使用的 Linux 系统。然而，某些配置文件存在所有类型的 Linux 机器中：\n\
  \n1. `/etc/hosts` – 该文件 100% 的时间持有本地主机的 IP 地址（即 `127.0.0.1`）。你可以使用 `/etc/hosts`\
  \ 执行进程间通信。无论你做什么，都不应该删除此文件。\n\n这里是本地网络的 host 文件：\n![](img/00030.jpeg)\n\n如果你想了解更多关于此文件的信息，请运行\
  \ `man hosts` 命令。\n\n2. `/etc/resolv.conf` – 该文件调节对域名服务器的访问。检查此文件时，你将看到你的域名和名称服务器。\n\
  \n\n\n\n\n![](img/00031.jpeg)\n\n### 3. /etc/nsswitch.conf\n\n此文件决定了如何访问名称服务。如果你正在连接互联网，`dns`\
  \ 应该出现在包含“hosts”字样的行中。以下是一个示例：\n\n![](img/00032.jpeg)\n\n这些数据告诉你的机器扫描 `/etc/hosts`\
  \ 文件以查找 IP 地址和主机名。如果该文件中不存在任何主机，你的计算机将联系域名服务器。或者，你也可以指示计算机联系其他名称服务，如 `NIS`、`NIS+`\
  \ 和 `LDAP`。\n\n你可以通过运行此命令来了解更多关于该文件的信息：`man nsswitch.conf`\n\n## 网络配置命令\n\n####\
  \ `ip` 命令\n\n该命令用于显示和控制内核的网络配置。为了执行这些任务，`ip` 使用了图形化工具和特定于发行版的脚本。\n\n你可以使用此命令来完成一些酷操作。以下是一些示例：\n\
  \n*   为每个接口分配 IP 地址\n*   设置通往本地网络和互联网的路由\n*   显示机器的 TCP/IP 配置\n\n下面的截图将向你展示两个强大的命令。这些命令可以为你提供路由信息和\
  \ IP 地址。\n\n![](img/00033.jpeg)\n\n#### `ifconfig` 命令\n\n这是 Linux 系统上最流行的命令之一。你可以不带任何选项运行它，以显示关于你网络接口的一些信息。这是一个截图：\n\
  \n![](img/00034.jpeg)\n\n为了充分利用此命令的作用，你应该了解接口配置的两个关键方面。它们是：\n\n*   “inet addr” –\
  \ 这标记 IP 地址。\n*   “HWaddr” – 该标签显示硬件地址。\n\n这两个命令（即 `ip` 和 `ifconfig`）都会显示有关网络当前配置的详细信息。它们还可以显示关于每个接口的多个统计数据。最后，它们会告诉你系统是否处于活动状态。\n\
  \n## 总结\n\n我希望这本书能够帮助你掌握 Linux 系统的基础。\n\n下一步是使用 Linux 创建你自己的网络或计算机程序。\n\n最后，如果你喜欢这本书，请花时间分享你的想法并在\
  \ Amazon 上发表好评。我们将不胜感激！\n\n感谢，并祝你好运！\n\n"
