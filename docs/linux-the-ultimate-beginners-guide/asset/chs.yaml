  \ 基础命令\n\n在本节中，你将学习一些快速上手命令（也称为快速命令）。你需要这些命令来使用 Linux。\n\n* `is` —— 显示当前所在目录的一组文件。这类似于\
  \ DOS 系统中的 `dir` 命令。\n* `passwd` —— 更改当前用户的密码。\n* `pwd` —— 显示当前工作目录。\n* `cd directory`\
  \ —— 切换目录。\n* `man command` —— 读取 `command` 的帮助页。\n* `logout 或 exit` —— 允许你离开当前会话。\n\
  * `info command` —— 读取 `command` 的 Info 页。\n* `file filename` —— 显示名为 `filename`\
  \ 的文件类型。\n* `apropos string` —— 使用 what is 数据库搜索字符串。\n\n## 一般说明\n\n你将在初始提示符后、文本模式或\
  \ xterm 窗口中输入以下命令。输入这些命令后，按下键盘上的“Enter”键。\n\n\n\n\n通常情况下，你可以单独执行命令（例如 `ls` 命令）。如果你指定了选项（option），命令的行为会有所不同，选项通常由破折号引入（例如\
  \ `ls -a`）。该选项字符在其他命令中可能具有不同的含义。GNU 程序接受长选项（long options），由两个破折号引入（例如 `ls --all`）。某些命令没有选项。\n\
  \n命令的参数（argument）是对你想要应用命令的对象的指定说明。让我们使用这个例子：`ls /etc/`。在这种情况下，`/etc` 目录就是 `ls`\
  \ 命令的参数。这个参数表示你想要查看该特定目录的内容，而不是默认的内容（默认内容是通过输入 `ls` 并按 `Enter` 键获取的活动目录内容）。某些命令需要参数。\n\
  \n如果你想知道某个命令是否接受选项和/或参数，可以检查操作系统的在线帮助文件。这将在稍后进行讨论。\n\n与 Unix 系统类似，Linux 使用正斜线来分隔目录。这种方法也用于\
  \ URL。\n\n# 如何使用 Bash 特性\n\nBash 是大多数 Linux 系统的默认 GNU shell，它允许你使用某些组合键来快速方便地完成任务。以下是\
  \ Bash shell 常用的特性。如果你想最大限地利用 Linux 的优势，你应该学习如何使用这些组合键。\n\n*   `Tab` – 完成命令或文件名。如果有多个选项，系统将通过音频或视觉通知告知你。另一方面，如果可能性太多，系统会询问你是否要检查所有选项。\n\
  *   `Tab Tab` – 显示命令或文件名的补全可能性。\n*   `Ctrl + A` – 将光标移动到当前命令行的开头。\n*   `Ctrl + C`\
  \ – 结束当前运行中的计算机程序并显示提示符。\n*   `Ctrl + D` – 将你退出当前会话。此组合键类似于输入 `logout` 或 `exit`。\n\
  *   `Ctrl + E` – 将光标移动到当前命令行的末尾。\n*   `Ctrl + H` – 类似于按下键盘上的退格键（backspace）。\n* \
  \  `Ctrl + L` – 清除当前终端。\n*   `Ctrl + R` – 搜索命令历史。\n*   `Ctrl + Z` – 允许挂起计算机程序。\n\
  *   `Arrow Right/Arrow Left` – 这些键允许你沿着当前命令行移动光标。你可以使用这些键在行的其他部分添加字符。\n*   `Arrow\
  \ Up/Arrow Down` – 这些键允许你浏览系统历史。访问你需要重复的行，在需要时更改数据，然后按 `Enter` 键快速执行命令。\n*   `Shift\
  \ + Page Up/Shift + Page Down` – 这些组合键允许你检查终端缓冲区。\n\n# 如何获取帮助\n\n书的这一部分将教你如何获取所需的信息。在询问他人之前，你应该检查此处包含的提示和说明。作为\
  \ Linux 用户，你应该自力更生。\n\n## 手册页 (Manual Pages)\n\n许多初学者害怕手册（也称为“man”页），因为它们包含了海量信息。然而，它们是完全结构化的，这意味着你可以很轻松地使用它们。\n\
  \n阅读手册页通常使用 `xterm` 窗口（如果你正在使用图形模式），或者在更简单的文本模式下。在提示符处输入以下命令，然后按 `Enter`。\n\n```\n\
  yourname@yourcomp `> man man\n```\n\n一旦按下 `Enter` 键，手册的文档将显示在你的屏幕上。\n\n![](img/00004.jpeg)\n\
  \n使用空格键查看下一页。如果你想查看上一页，可以使用 `b` 键。一旦到达最后一页，手册通常会退出，你会再次获得提示符。如果你想在到达最后一页之前离开手册页，或者程序没有自动关闭，你可以输入\
  \ `q` 并按 `Enter`。\n\n## 信息页 (Information Pages)\n\n除了手册，你还可以使用 Info 页学习更多有关系统的信息。使用\
  \ `info` 命令访问你操作系统的 Info 页。这些页面包含了更新的信息，并且更易使用。某些命令的手册页指向 Info 页。\n\n要开始，打开一个终端窗口并输入\
  \ `info info:`：\n\n```\ninfo\n```\n\n![](img/00005.jpeg)\n\n你应该使用方向键来浏览页面，并控制光标沿由星号开头的行移动。如果它包含你想要学习的关键词，按\
  \ `Enter` 键。你可以使用 `N` 和 `P` 键跳转到下一个或上一个主题。空格键将显示下一页，无论它打开的是新主题还是信息页。要关闭 info 页，你只需输入\
  \ `q.`。\n\n# 第 3 章：文件系统\n\n在本章中，你将学习 Linux 系统中使用的文件和目录。许多用户在使用这类操作系统时遇到困难，因为他们不知道在什么区域存储了什么类型的信息。本章将解释\
  \ Linux 文件系统是如何组织文件的。\n\n## 文件系统 – 概述\n\n### 文件\n\n这里是对 Linux 系统的简单描述：\n\n“在 Linux\
  \ 系统中，一切都被视为文件。如果它不是一个文件，它就被视为一个过程。”\n\n上述陈述是正确的，因为存在特殊文件（例如管道和套接字）。在这一点上，这种陈述是可以接受的。Linux\
  \ 以相同的方式对待文件和目录，因为目录只是包含其他名称的文件。\n\n### 不同类型的文件\n\n大多数文件都是普通文件：它们持有普通数据。\n\n虽然可以假设你看到的所有都是文件，但也有例外：\n\
  \n*   链接 – 显示系统各个部分的文件和目录的方法。\n*   套接字 – 这是一种特殊文件。它们提供了由操作系统控制的进程间通信。\n*   目录 –\
  \ 这些包含其他名称的文件。\n*   特殊文件 – 用于输入和输出的设备。几乎所有特殊文件都在 `/dev` 中。这将在后讨论。\n*   命名管道 – 它们像套接字一样：允许进程相互交互。\n\
  \n命令接受 `-l` 选项可以显示文件类型。这是一个截图：\n\n![](img/00006.jpeg)\n\n下面的列表显示了一些用于识别文件类型的字符：\n\
  \n*   连字符（即 `-`）用于普通文件。\n*   字母 `d` 用于目录。\n*   字母 `l` 用于链接。\n*   字母 `c` 用于特殊文件。\n\
  *   字母 `s` 用于套接字。\n*   字母 `p` 用于管道。\n*   字母 `b` 用于块设备。\n\n## 文件系统的布局\n\n为了方便，Linux\
  \ 操作系统的文件系统被视为一个树形结构。对于典型的 Linux 系统，布局遵循以下方案：\n\n![](img/00007.jpeg)\n\n该布局被 RedHat\
  \ 系统使用。结构可能会发生，目录可能会添加或删除，取决于管理员。此外，名称是为了惯例：并非强制要求。\n\n文件系统的树起始于斜杠（也称为根目录）。这由 `/`\
  \ 表示。根目录包含了操作系统内部所有的底层文件和目录。\n\n\n\n\n斜杠 `/` 通常出现在根目录正下一层级的目录名前。这个符号用于指示这些目录的位置，并将它们与其他可能具有相似名称的位置隔离开。如果你正在使用新的\
  \ Linux 系统，应该先检查根目录。以下是你会看到的内容：\n\n![](img/00008.jpeg)\n\n## 根目录的子目录\n\n* `/bin`\
  \ – 此目录包含普通程序，供用户、系统和系统管理员共享。\n* `/dev` – 该子目录保存了指向 CPU 所有外围硬件的引用。通常，这些硬件设备被表示为具有特殊特征的文件。\n\
  * `/boot` – 此目录由内核（即 `vmlinuz`）和启动文件组成。某些 Linux 系统还包含 `grub`（即统一引导加载程序 grand unified\
  \ boot loader）信息。`Grub` 是一种旨在消除目前使用的各种启动加载程序的数据。\n* `/etc` – 该子目录包含与系统配置相关的文件。基本上，这类似于\
  \ Windows 的控制面板。\n* `/home` – 这是普通用户的主目录。\n* `/misc` – 该子目录用于存放杂文件。\n* `/lib` –\
  \ 此目录包含计算机中安装的所有类型计算机程序的库文件。\n* `/opt` – 此位置通常存放第三方程序和额外程序。\n* `/root` – 这是系统管理员的主目录。\n\
  * `/proc` – 这是一个虚拟文件数组，包含系统资源的数据。如果你想获取有关此子目录的更多信息，可以打开终端窗口并输入 `man proc`。\n* `/initrd`\
  \ – 它保存启动过程的数据。你不应该删除这个子目录。\n* `/lost+found` – 该子目录包含在系统故障期间保存的文件。\n* `/tmp` – 这是操作系统使用的临时存储空间。由于它在系统重启时会被清理，请不要用它保存工作。\n\
  * `/sbin` – 包含系统管理员和操作系统本身使用的计算机程序。\n* `/usr` – 包含与相关的计算机程序的库、程序和文档。\n* `/var` –\
  \ 用于存储用户生成的变量和临时文件（例如：邮件队列、日志文件、文件下载等）。\n\n你可以使用 `df` 命令后跟点（即 `.`）来识别你当前使用的目录。该命令还会显示该特定目录占用的存储空间。这是一个截图：\n\
  \n![](img/00009.jpeg)\n\n通常情况下，每个子目录都属于根分区，除非在 `df` 生成的列表中具有不同的条目。\n\n## Shell（解释壳）\n\
  \nShell 可以被视为一种语言：你用它来与计算机“对话”。大多数人知道另一种语言，即桌面使用的点点点击系统。然而，在那种语言中，是机器在引导对话——用户处于被动角色，从呈现出的任务中进行选择。对于计算机程序员来说，很难通过\
  \ GUI 格式添加某个命令的所有用途和可能性。这就是为什么基于 GUI 的系统优于后端提供的命令。\n\n然而，Shell 是一种与机器交互的高级方法，因为它允许双向对话。此外，它允许用户采取主动。对话中的双方被同等对待，因此可以尝试新概念。Shell\
  \ 允许你以多化的方式管理系统。此外，Shell 还允许你自动化执行任务。\n\n## 不同类型的 Shell\n\n以下是 Linux 操作系统使用的 Shell：\n\
  \n* `sh`（也称为 Bourne Shell）– 这是最初用于 Unix 系统和 Unix 相关项目的 Shell。将其视为一个基础 Shell：一个功能有限的小型计算机程序。当你使用\
  \ POSIX 兼容模式时，Linux 的 `bash` 会模拟这个 Shell。\n* `bash`（也称为 Bourne Again Shell）– 这是典型的\
  \ GNU Shell：多功能且直观。建议初学者使用它，尽管高级用户仍然可以将其作为主要工具。在使用 Linux 时，`bash` 是普通用户的默认 Shell。\n\
  * `csh`（也称为 C Shell）– 程序员使用这种 Shell，是因为它的语法与 C 语言语言相似。\n* `ksh`（也称为 Korn shell）–\
  \ 熟悉 Unix 系统的人喜欢这个 Shell。\n* `tcsh`（也称为 Turbo C Shell）– 这是 C Shell 的超集，提升了系统的速度和用户友好性。\n\
  \n如果你想查看 Linux 系统使用的 Shell 概览，可以检查 `/etc/shells` 文件。这是一个截图：\n\n![](img/00010.jpeg)\n\
  \n## 如何切换到不同的 Shell\n\n要实现这一点，你只需要在活跃的终端中输入你偏好的 Shell 名称即可。操作系统将使用 `PATH` 设置来寻找新\
  \ Shell 的位置。因为 Shell 被视为计算机程序（即可执行文件），活跃的 Shell 将启动并执行新的 Shell。\n\n## 如何确定你正在使用的\
  \ Shell\n\n你可以通过以下两种方法识别活跃的 Shell：\n\n* 访问 `/etc/passwd` 目录并查看你用户账户的行。\n* 输入此命令：`echo\
  \ $SHELL`\n\n# 第 4 章：进程\n\n如果你想成为一名 Linux 用户，也应该理解进程。在本章中，你将学习 Linux 操作系统中执行的不同计算机进程。\n\
  \n### 基础知识\n\n### 多用户与多任务\n\n现在你已经学会了如何与系统交互，可以更详细地学习计算机进程。某些命令无法通过单个进程执行。某些命令（例如\
  \ `mozilla`）会触发一组或一系列进程。\n\n此外，Linux 基于 Unix 系统，在该系统中，多个用户同时运行不同的命令是自然的。显然，你需要确保计算机处理器可以处理所有进程。你还应该提供允许用户在不同进程之间切换的功能。在某些情况下，即使启动的用户退出，进程也继续运行。你应该赋予用户恢复中断进程的能力。\n\
  \n### 不同类型的进程\n\n#### 交互式进程\n\n你必须使用终端会话来启动和控制交互式进程。这意味着只有当你连接到系统时，才能启动交互式进程。基本上，系统不会作为其基本功能的一部分启动这些进程。交互式进程在前台运行，占用启动它的终端。当这种情况发生时，只要该进程处于活动状态，你就无法启动其他程序。作为替代方案，可以将它们在后台运行，以便你使用的终端可以接收其他命令。\n\
  \nLinux Shell 提供了名为“作业控制”（job control）的功能。该功能允许你轻松处理各种进程。作业控制可以在后台和前台之间切换进程。通过这种方式，你可以快速在后台启动进程。\n\
  \n注意：只有不需要用户输入的程序才能在后台运行。通常，耗时较长的任务会被放在后台。\n\n以下列表显示了 Linux 系统常用的控制程序：\n\n* `bg`\
  \ – 用于在后台激活已中断的进程。\n* `fg` – 将进程返回前台。\n* `jobs` – 显示正在后台运行的命令。\n* `kill` – 结束任务。\n\
  * `regular_command` – 在系统前台运行命令。\n* `command &` – 在系统后台运行命令。它释放了终端：你可以在之前的命令仍然运行时运行其他程序。\n\
  \n\n\n\n\n* `Ctrl + Z` – 这会停止（挂起但不终止）在系统前台运行的进程。\n* `Ctrl + C` – 这会中断（停止并终止）在前台运行的进程。\n\
  * “`n`” – 系统为每个后台运行的进程分配一个数字。使用“%`”符号，你可以通过其数字引用某个进程（例如 `bg %2`）。\n\n### 自动进程\n\n\
  自动进程（也称为批处理进程）与任何终端都没有关联。相反，这些是可以在打印缓冲器区域中排队的任务，它们将按照先来后式的原则进行执行。这些进程可以使用以下方法之一执行：\n\
  \n* 在指定的日期和时间 – 你必须使用 `at` 命令来实现这一点。\n* 在系统整体负载足够低以接收额外任务的时间。你可以通过 `batch` 命令实现此。通常情况下，进程会排队，以便在系统负载低于\
  \ `0.8` 时执行。在大型系统中，当需要处理海量数据或在已经繁忙的系统上执行需要大量资源的任务时，管理员可能会利用批处理。你也可以使用批处理来优化系统性能。\n\
  \n### 守护进程 (Daemons)\n\n这些是持续运行的服务器进程。它们通常在启动期间被激活，并在系统后台等待，直到需要它们的服务。一个常见的例子是网络进程“xinetd”，它在每次引导过程中都会被触发。在启动过程完成后，`xinetd`\
  \ 会等待直到某个程序（例如 POP3 客户端）需要连接互联网。\n\n### 启动过程\n\nLinux 的流行功能之一是其启动和挂起操作系统的方法，它通过理想设置获取特定程序，允许你修改设置和启动过程，并以一种组织且优雅的方式停止。\n\
  \n除了操作启动和关机过程之外，Linux 系统的“开放性”有助于你确定与机器关机或启动相关问题的原因。\n\n### 步骤\n\n当计算机启动时，CPU 会寻找基本输入输出系统（`BIOS`）并执行它。该程序被编码在计算机的永久\
  \ `ROM`（只读存储器）中，可以随时使用。计算机的 `BIOS` 为外围设备提供低级接口，并控制启动过程的第一阶段。\n\n`BIOS` 检查整个系统，搜索并测试外围设备，并寻找用于启动系统的驱动器。通常，`BIOS`\
  \ 会检查 CD-ROM 驱动器（较新的操作系统）或软盘驱动器（较旧的系统）是否有可用的介质。启动过程中利用的驱动器序列通常由操作系统上的某个 `BIOS` 配置管理。一旦\
  \ Linux 系统安装到计算机的硬盘上，`BIOS` 就会从第一块硬盘的初始部分开始搜索 `MBR`（即主引导记录），将数据放入内存，并将控制权交给它。\n\n\
  主引导记录 (MBR) 包含了如何通过预设的操作系统使用 `LILO` 或 `GRUB` 启动加载程序的步骤。之后，`MBR` 会激活启动加载程序，由该程序控制引导过程的其余部分（如果在主引导记录中安装了启动加载程序）。在红帽操作系统的标准配置中，`grub`\
  \ 利用主引导记录中的设置来显示可用的启动选项。一旦 `grub` 从配置文件或其命令行获取了启动操作系统的正确指令，它就会获取所需的启动文件，并将计算机的控制权交给操作系统。\n\
  \n### GRUB 的不同特性\n\n这种启动计算机的方法被称为直接加载。这是因为在启动加载程序和操作系统的主文件（例如内核）之间不存在过渡代码。因此，利用启动指令直接加载操作系统。\n\
  \n这种启动计算机的方法被称为直接加载。这是因为在启动加载程序和操作系统的主文件（例如内核）之间不存在过渡代码。因此，利用启动指令直接加载操作系统。 这种启动计算机的方法被称为直接加载。这是因为在启动加载程序和操作系统的主文件（例如内核）之间不存在过渡代码。因此，利用启动指令直接加载操作系统。\
