    The second line looks complex; the intent is. renice +19 command makes that this
    script doesn''t run if there''s anything else running on your system. It does
    this by lowering the priority of the threads associated with the cron. Explaining
    the details of this command is well within the scope of this book.


    ```

    renice +19 -p $$>/dev/null 2>&1

    /usr/bin/updatedb -f "nfs,smbfs,ncpfs,proc,devpts"

