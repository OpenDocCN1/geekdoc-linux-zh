  md: '# Linux Transfer for Windows Network Admins


    While you can set an os level of up to 255, you should not do this unless it''s
    on the computer that you''re configuring as a PDC. And as described earlier, an
    os level of 32 is used by Microsoft servers to win a browser election as a PDC.


    If the PDC and Domain master browser are on different computers, you''ll observe
    errors as browse lists not running on computers on the network. However, if you
    are configuring the local computer as the PDC and the Domain master browser, you
    should activate the following command:


    ```

    domain master = yes

    ```


    If you don''t have a PDC on the LAN, you''ll still need a master browser. In case,
    you could set your computer as the preferred master browser by activating the
    following command:


    ```

    preferred master = yes

    ```


    If you are configuring the local server as a PDC and there are Windows 95/98/ME
    computers on the Domain, you''ll want to activate this. Remember, because encrypt
    passwords = yes, Windows 95 computers cannot log in to this Domain unless the
    Microsoft Service Pack 2 (OSR2 or later) has been installed. And you need to set
    security = user (not server or domain) as explained in this chapter.


    ```

    domain logons = yes

    ```


    If you are configuring the local server as a PDC, you can set up logins by NetBIOS
    name (%m.bat) or user name (%U.bat). Be sure to activate the appropriate one of
    the following commands:


    ```

    logon script = %m.bat

    logon script = %U.bat

    ```


    If you''re converting from a Microsoft Windows PDC, you can use any scripts that
    you have made in directories such as the Windows NETLOGON share. If you want to
    configure a logon script by variable (%m), activate the first command, and set
    up scripts by NetBIOS name. If you want to configure a logon script by user (%U),
    activate the second command, and set up scripts by user name. You can define the
    directory for these scripts under the [netlogon] tag in this file.


    When convert from a Microsoft Windows PDC on NT 4, you should be able to copy
    the appropriate files directly from the Windows PDC NETLOGON share, which is commonly
    the %C:\WINNT\system32\Replimport directory.


    As Microsoft Windows administrators already know, a roving profile provides a
    consistent look and feel for users who log in different workstations on a network.
    For example, if you activate the command, login profiles are stored as the [profiles]
    tag in the smb.conf file.


    ```

    logon path = \\%L\Profiles\U

    ```


    In this case, the %L also defines the NetBIOS name of the computer, and the %U,
    once again, defines the user name.'
