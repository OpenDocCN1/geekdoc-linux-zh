    If you''ve configured the GUI, the first login terminal does not work. Finally,
    there''s one command, which does not apply unless you disable Red Hat''s default
    GNOME GUI login terminal:


    ```

    x5:respawn:/etc/X11/-nodemon

    ```


    # Standard mounts with /etc/fstab


    When Linux boots on your computer, it relies on /etc/fstab for a list of directories
    to mount on different partitions. This is the filesystem (fs) tabulation file.
    These are known as filesystems; **Figure 8** illustrates an example from my Red
    Hat Linux computer; the LABEL command is used for standard directories that are
    mounted when you boot your computer.


    | LABEL=/ | / ext3 defaults 1 1 |

    | LABEL=boot | /boot ext3 defaults 1 2 |

    | LABEL=/ | /home ext3 defaults,uscrota,rgpquote 1 2 |

    | none | /dev/pts devpts gid=5,mode=620 0 0 |

    | none | /proc proc defaults 0 0 |

    | none | /dev/shm tmpfs defaults 0 0 |

    | none | swap defaults 0 0 |

    | /dev/sda3 | /mnt/floppy auto noauto,owner,kudzu 0 0 |

    | /dev/fd0 | /mnt/cdrom udf,iso9660 noauto,owner,kudzu,ro 0 0 |


    **Figure 8.** Standard mounts with /etc/fstab.


    Unfortunately, this file is more complex than it looks, but a detailed description
    is beyond the scope of this book. I''ll explain some basics about the first and
    the last two in this particular file. The first three lines are associated with
    actual directories mounted on my hard drives:'
