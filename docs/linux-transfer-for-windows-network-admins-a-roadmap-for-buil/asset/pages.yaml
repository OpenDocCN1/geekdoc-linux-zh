    couple of different commands. The following sections explain this process in detail.


    # Editing nsswitch.conf


    Open the /etc/nsswitch.conf file in a text editor. Take a look at the following
    two lines:


    ```

    passwd      files

    group       files

    ```


    These lines tell Linux to look the standard files for the authentication database:

    /etc/passwd for users, and /etc/group for groups. It''s simple to use windbind
    to this list; just

