  md: '# Chapter 3: Setting Up Your Server File System


    # My Network


    In this book, I''ve set up a number of different computers with various Microsoft
    Windows operating systems, from Windows 95 through Windows XP Professional. I''ve
    also set up three computers with Red Hat Linux 9 in various roles. I''ve set them
    up in a peer-to-peer Workgroup named Darkstar and a Domain named Grateful. Each
    of the individual computers listed in Table 1 is named after various Grateful
    Dead Bean Bears.


    Table 1. Computers on my network.


    | Computer Name | Operating System | Role |

    |---|---|--|

    | sugaree | Windows NT 4 Server | PDC |

    | cosmmic | Red Hat Linux 9 | PDC |

    | tennjed | Windows 2000 Server | Domain Member Server |

    | allaccess | Windows XP Professional | Client |

    | reuben | Windows 98 | Client |

    | ststephen | Windows 2000 Professional | Client |

    | nopaws | Red Hat Linux 9 | Domain Member Server |

    | samson | Windows 98 | Client |

    | daisy | Windows NT Workstation | Client |

    | ripple | Windows 95 | Client |

    | althea | Windows ME | Client |

    | delilah | Red Hat Linux 9 | Client |


    The clients in this network can be part of the Darkstar peer-to-peer Workgroup
    or the Grateful Domain. I can configure to share local directories or printers
    with other members of the Workgroup or Domain. Several of these computers are
    installed as "Virtual Machines" using VMware (www.vmware.com). While I have a
    Windows and Linux configured as a PDC, I do not run both computers at the same
    time.


    # Basic look and feel


    On the various Windows operating systems, there are three basic ways to view computers
    and shared directories on a network. Older Microsoft operating systems, namely
    Windows 95/98, support a viewer known as the Network Neighborhood. The example
    shown in Figure 1 is from a Windows 98 connected to a Workgroup named Darkstar
    and a Domain named Grateful.


    You''ll note that Workgroups and Domains look alike in the GUI. But as you already
    know a Microsoft Windows administrator, groups of computers are governed by sets
    of rules. Domain user names, passwords, and profiles are stored in a centralized
    location.


    Newer Windows operating systems, including Windows ME, work with a slightly different
    GUI view of networks, known as My Network Places. As you can see in Figure 2,
    this is a broader view of networking which, interestingly enough, can include
    the NFS (Network File System) networks that are native to Linux and Unix computers.
    I''ll discuss that in more detail later in this chapter.'
