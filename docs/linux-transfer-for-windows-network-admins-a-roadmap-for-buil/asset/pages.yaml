    ```


    In Linux, the umount command unmounts directories (this is not a typo).


    There is one drawback to the mount and unmount commands: You can run only as the
    Linux administrative user, root. But most users won''t log in as root. There are
    related commands that can enable for regular users. To do, take the following
    steps:


