  md: '# Introduction


    As Microsoft licensing fees increase, Microsoft administrators are looking for
    alternatives. In the world of servers, the main alternatives to Microsoft Windows
    are those operating systems related to Unix. With Samba, Unix-style operating
    systems can take their place as a Microsoft workstation or server on a Microsoft-based
    network. Linux stands out because it is freely available. Red Hat Linux is by
    far the most popular Linux


    This book is targeted at Microsoft administrators. As an MCSE and an RHICE, I
    think I know how to de use Linux with the language of the Microsoft network administrator.
    In this book, I assume the reader is familiar to Linux. I do not cover the elements
    of Samba that would be too difficult for the average Windows administrator to
    handle


    With a few tweaks, you can set up a Linux computer on a Microsoft network. You
    can set it up as a workstation or a server. You can set up Linux as a member or
    a Primary Domain Controller (PDC) on a Microsoft-style domain. This book illustrates
    how to do this with Red Hat Linux 9, which you can download from various internet
    sites. Red Hat is the finest available Linux distribution developed and packaged
    by Red Hat.


    Red Hat 9 comes with Samba 2.2.7, and this book is based on software. If you choose
    to upgrade to Samba 3.0, I advise you to use the packages from the Red Hat Rawwide
    directory on the Red Hat FTP server at ftp.redhat.com.


    Don''t let the lawsuits from SCO discourage you. There is a consensus within the
    Linux community that even if there is any questionable code in the Linux kernel,
    they''ll be able to substitute code quickly, which you could then easily install
    and install on various distributions, including Red Hat


    This book is all you need to get started with Red Hat on your network of Microsoft
    computers. In spirit, Chapter 1, "Basic Linux Installation," and Chapter 2, "Installing
    Linux as a File Server," will walk you through the installation process. Once
    you''ve completed these chapters, you''ll have all what you need to set up a Linux
    computer on a Microsoft network.


    Chapter 3, "Setting Up Your File System," and Chapter 4, "Setting Up Your File
    Server''s," will show you how to set up Samba on a Linux computer. In Chapter
    3, you''ll examine the graphical tools included with Red Hat that help you configure
    Linux on a Microsoft network. In Chapter 4, you''ll see how to make this work
    with users and groups on a network. In both chapters, you''ll see how this works
    on the governing Linux configuration files.


    In Chapter 5,ConnectingConnecting Workstations," and Chapter 6, "Connecting Windows
    Workstations," you''ll see the set up on your new network.


    In the world of client-server networks, File and Print servers go together. In
    Chapter 7, you''ll see how to configure CUPS on Red Hat Linux as a client and
    server on your network.


    Finally, Chapter 8, "Administration and Management," and Chapter 9, "System Backup,"
    illustrate some survival skills that you''ll use as a new Linux administrator.
    The information presented in these chapters isn''t enough if you''re serious about
    Linux, but it provides a start.'
  merge: -1
