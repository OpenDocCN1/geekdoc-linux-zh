    # Samba configuration files


    There are five configuration files associated with Samba, located in the /etc/samba
    directory. They define how your Linux computer interacts with a Microsoft Windows-based
    network.


    +   lmhosts contains a database of IP addresses and NetBIOS names. It is similar
    to the LMHOSTS file that you find on a Windows server. It''s rarely used, giving
    the available alternatives for finding computers: a Windows Internet Name Service
    (WINS) server, a DNS server, or the hosts in the /etc directory.


    +   secrets.tdb contains a Microsoft-style security identifier (SID) for your
    Samba computer. It''s in binary code, you can''t read it through a text editor.


