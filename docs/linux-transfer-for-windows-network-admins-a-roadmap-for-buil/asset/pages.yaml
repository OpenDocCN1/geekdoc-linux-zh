  md: '# # Chapter 9 System Backup


    There are a lot of threats to your data. Viruses and attacks by malicious users
    can overwrite data. Power surges can erase data. Natural and man-made disasters
    can destroy the computers that store your data. Hard drives are mechanical devices
    that eventually fail, which also can affect your data. Users can accidentally
    erase important files such as airplane schematics and financial statements. For
    these reasons, count you as a system administrator to back up your data.


    What do you do to back up your computers depends on the value of your data and
    how you''re willing to go. You can hold users responsible for their own backups.
    Alternatively, you can create and store backups on floppy disks, CDs, tape drives,
    and so on. You can back up part or all of the data, even in real time


    You can configure a Redundant Array of Independent or Inexpensive Disks (RAID)
    to help protect your data in real time. You can store data on portable, writable
    media as floppy disks and writable CDs. You can create and store backup data on
    remote computers on your network. You can even store the computers or portable
    media in remote physical locations.


    The commands described in this chapter are administrative; unless otherwise noted,
    I''m assuming you''ve logged in to your Linux computer as the root user.


    # ## Backup strategies and types


    What you do to back up your computers depends on the time and money you have available.
    If you''re administering a time- and mission-critical network, you may want to
    set up a high-speed connection to a remote site to replicate your data in real
    time. If your data is not valuable, a weekly or even monthly backup may be sufficient.
    In addition, I''ll show you two RAID arrays that preserve your data on the local
    computer in real time.


    In this chapter, I assume you want to back up the contents of the /home directory.
    While it can help to back up the contents of other directories, /home by large
    contains the data from your users.


    In this scenario, if you lose a file server and need to restore it from scratch,
    you would take the following basic steps:


    +   1. Fix the hardware. This may mean replacing the hard drive or configuring
    a new computer.


    +   2. Reinstall the operating system on your computer. This basic process is
    covered in Chapters 1 and 2.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '+   3. Reinstall any updates to the operating system. If it''s Red Hat Linux,
    you''ll need to use the Red Hat Update Agent described in Chapter 2, "Installing
    Linux as a File Server."


    +   4. Reinstall all applications that you''ve added to the operating system—and
    beyond any applications that you may have included when you installed Red Hat
    Linux (such as the OpenOffice suite).


    +   5. Restore the data that you''ve backed up, presumably from the /home directory.


    # Backup strategies


    The most straightforward backup involves copying all data on your hard drive.
    Hard drives may contain gigabytes and terabytes of data. If you want to back up
    every byte of data on a larger hard drive, that can take hours. If you want to
    back up your hard drive on a remote computer, that can create the kind of traffic
    that could effectively shut down the network for your users.


    Backups by system administrators are generally driven by four factors:


    +   - Timing. When you schedule backups during the hours when your users don''t
    need your file server or network.


    +   - Need. What you back up depends on the importance and timeliness of the data.


    +   - Cost. Backing up everything on your hard drives will drive up the cost of
    backup media, well as the demands on your network.


    +   - Size. Larger backups are more difficult to manage. Depending on the speed
    of your network and the size of your hard drives, it may not be possible to completely
    back up your computer overnight, or even over a weekend.


    # Backup types


    Most administrators use a combination of backup strategies. The files associated
    with the operating system don''t change unless you''ve used the Red Hat Update
    Agent, or otherwise downloaded and installed new RPM packages. Therefore, you
    may not need to back up all of the files on your computer daily basis.


    When setting up a backup, many administrators will back up everything on a hard
    drive weekly or monthly. If a hard drive is too large, they may limit the backup
    to all user files, which on a Linux computer can be found under the /home directory.
    They then back up created files more often. To support these needs, there are
    three major types of backups: full, incremental, and differential.


    # Full backup


    A full backup of a computer is not quite as straightforward as it sounds. A full
    backup does not have to include every file on a computer. The choice of full backup
    options is up to the administrator. For example, you can create a full backup
    of only a single hard disk on a computer. You can also create a full backup of
    a single directory on a Linux computer, such as /home.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Chapter 9: System Backup


    # Incremental backup


    An incremental backup includes all of the files and directories that have been
    created or changed since the last backup. It does not matter if you have other
    incremental or differential backups. As time goes on and more files are created
    or changed, incremental backups get larger. If you want to restore a system, you''ll
    need to restore the files from the full backup and the latest incremental backup.


    # Differential backup


    A differential backup includes all of the files and directories that have been
    created or changed since the last full, incremental, or differential backup. If
    you run differential backups on a daily basis, they''ll typically remain about
    the same size. Unfortunately, restoring from a system with a differential backup
    will need to restore the files from the latest full, incremental, and all subsequent
    differential backups.


    # RAID


    Backing up and restoring data takes time. If you have a disaster, your users may
    have to wait until you can restore their data from backups. There are alternatives.
    Several different types of RAID arrays save data in real time. Your users can
    access their data even if a single hard drive fails


    You can set both hardware and software RAID arrays. A hardware RAID array consists
    of physical hard. For that reason, the failure of a single hard drive does not
    cause you to lose all the data in that array. A software RAID array consists of
    partitions on the same physical hard drive, I don''t recommend it. If you do,
    any problem with physical hard drive can lead to the loss of all data on that
    array.


    ![](img/6ee4859e736a0839007ea9afb576c195_287_0.png)


    > RAID is commonly used as an acronym for different terms: a Redundant Array of
    Independent Disks, or a Redundant Array of Inexpensive Disks. I prefer the first
    acronym. Fault tolerance does not work unless the disks are independent.


    Red Hat supports three basic types of RAID arrays, known as RAID 0, RAID 1 and
    RAID 5. A array is a group of two hard drives or partitions grouped together.
    A RAID 0 array is used to combine two or more hard drives or partitions in a single
    volume. While it is faster, it does not protect data. A RAID 1 array is used to
    configure two hard drives or partitions with identical data. A RAID 5 array is
    used to configure three or more hard drives or partitions, in a way that protects
    your data.


    # RAID 0


    A RAID 0 array is a group of two or more partitions or drives, grouped together.
    This grouping is known as a volume. If you set up a RAID 0 array on a Linux computer,
    you can mount a single directory such as /home on that volume.


    If you set up RAID 0 array on two different physical hard drives, your computer
    can use the buffers on each drive. That can speed reading and writing to that
    volume.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Linux Transfer for Windows Network Admins


    The drawback to RAID 0 is that it does not back up your data. If any disk or partition
    on a RAID 0 array fails, you lose all of the data that you''ve stored on that
    volume. RAID 0 is also known as "disk striping without parity."


    # RAID 1


    A RAID 1 array is a group of two partitions or drives, paired together. Data is
    stored on both partitions or drives. If one partition or drive is damaged, you
    can still access all of your data on the remaining partition or drive. For example,
    if you set the /home directory on a RAID 1 array, you will have identical copies
    of that on both drives or partitions.


    Unfortunately, a RAID 1 can be slower, because data has to be written to both
    disks and partitions. And RAID 1 arrays can be expensive, because you''ll need
    twice as much storage space for your data. RAID 1 is also known as "disk mirroring."


    If you set up a spare disk or partition in a RAID 1 array and one component of
    the array is lost, Linux can immediately begin to rewrite the data to the spare
    disk.


    # RAID 5


    A RAID 5 array is a group of three or more partitions or drives. Parity information
    is stored on each partition or drive and if there is a failure in one component
    of the array, Linux can use the parity information to re-create the missing data.
    RAID 5 is also known as "disk striping with parity."


    A RAID 5 array involves compromises. While it requires three or more partitions
    or drives, it sacrifices the space of only one partition or drive for parity information.
    If you include a spare partition or drive in a RAID 5 array, and one component
    of the array is lost, Linux can immediately begin to rewrite the data to the spare.


    # Configuring RAID on Red Hat Linux


    You can set up a RAID array during the installation process as described in Chapter
    1, "Basic Linux Installation.\ With the Red Hat installer, you can set up a software
    RAID array with different partitions. Figure 1 illustrates a software RAID array
    with partitions on four different physical hard drives.


    ![](img/6ee4859e736a0839007ea9afb576c195_288_0.png)


    Figure 1. Configuring a software RAID array while installing Red Hat Linux.'
