    # Windows 95 and encryption


    If you''re concerned about network security, you should use encryption at least
    the most critical items such as passwords. With the following command, the standard
    Samba configuration ensures you''re using an operating system that encrypts passwords:


    ```

    encrypt passwords = yes

    ```


    Passwords sent from the latest version of the Windows 95 operating system, known
    as OSR2, are encrypted. If you have a Windows 95 workstation, it''s easy to find
    its version. On the Windows 95 desktop, right-click the My Computer icon. This
    opens the System Properties dialog. On the General tab shown in Figure 1, you
    should see 4.0.950 B, which corresponds to OSR2.


    | General | Device Manager | Hardware Profiles | Performance |

