  md: '# Chapter 4: Setting Up Your File Server''s Users


    # File and directory management


    For those we less familiar with Linux, it''s important to understand the nature
    of files, directories, ownership, and permissions. Before showing how Linux and
    Windows permissions work together, I need to explain how these concepts work in
    Linux.


    In Linux, everything is represented by a file. Directories, drivers, and links
    are just special versions of a file. Each file is associated with permissions
    for the owner and group that owns the file.


    # Linux permissions


    Take a look at permissions on your Linux computer. The best place to start is
    with your home directory. I can review permissions for my home directory by running
    the following command (to see the permissions on your home directory, substitute
    your user name for mj):


    ```

    ls -l /home/mj

    ```


    Here are three entries from my home directory on a Linux PDC:


    ```

    drwx-xr-x 3 mj  mj       4096 May 14 16:45 Start Menu

    -rw-r--r-- 1 mj  mj       106528 May 14 19:24 USER.DAT

    -rwxrxr-x 1 mj  project  46528 May 14 19:24 script

    ```


    The permissions for this file are listed on the left side of each entry. It''s
    important to analyze in this detail. The first letter indicates the type; the
    other letters are r, w, or x, as listed in Table 5.


    # Table 5. File permissions.


    | Letter | Function |

    | c | driver |

    | d | directory |

    | l | link to another file |

    | r | read |

    | w | write |

    | x | execute |

    | | null character; when in the first position, it''s a regular |


    The remaining letters are associated with permissions for three entities: the
    owner of the file, the group that owns the file, and all others on the system.


    Each file identifies the user and group that owns that file. The user who owns
    each file is shown in the third column. The group that owns each file is shown
    in the fourth column. In /home/mj directory, the owner of each file is mj; the
    group that owns the file named project.


    Consider the permissions for the script file above. The second, third, and fourth
    letters are rwx, which are associated with the owner of this file, mj. It means
    that you can read from, write to, and execute this script.'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'The next three letters are associated with the file permissions for the group
    that owns the file. Users in the project group can read and execute but can''t
    write to the script file.

    The final three letters define the file permissions for all other users on the
    system, who in this case can read only what''s in the script file.


    # Default permissions


    Whenever you create a file in Linux, that file gets a default set of permissions.
    In Red Hat Linux 9, these permissions are:


    ```

    -rw-rw-r--

    ```


    In Linux, these letters are translated into numeric codes as defined in Table
    6.


    # Table 6. File permission numeric values.


    | Permission | Value | Description |

    |---|---|--|

    | r | 4 | r is assigned a value of 4 |

    | w | 2 | w is assigned a value of 2 |

    | x | 1 | x is assigned a value of 1 |

    | wx | 3 | set to the value of w + x = 3 |

    | rx | 5 | r + x = 5 |

    | rw | 6 | r + w = 6 |

    | rwx | 7 | r + w + x = 7 |


    Take a look at the list of files from my home directory,/home/mj. In that directory,
    I can translate the permissions for the USER.DAT to a numeric code of 664. In
    other words, the user and group that owns USER.DAT can read and write that file;
    others on that computer can read or copy from the file.


    Now that you know this works, you can change the permissions associated with a
    file. For example, the following command keeps the script from being executable
    by anyone on that system:


    ```

    # chmod 644 /home/mj/script

    ```


    When you run `ls -l /home/mj` command, again you can see the permissions have
    changed:


    ```

    -rw-r--r--  1 mj  project  46528 May 14 19:24 script

    ```


    As you can see, the x is gone from the left side of the file listing, which means
    the script is no longer executable by the owner of this file, mj, or any member
    of the project group.'
