    This opens the quota configuration file in the vi editor, which I describe in
    Chapter 8, "Administration and Management." I will give you step-by-step instructions
    shortly. But first, take a look at the configuration file on my computer:


    | Disk quotas for user jkp (uid 506) | | | | | |

