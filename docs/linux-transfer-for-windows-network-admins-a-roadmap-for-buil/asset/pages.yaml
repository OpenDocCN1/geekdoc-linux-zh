    # Regular user tasks


    There are two straightforward tasks that you should know about as a Linux administrator.
    First, you should know how to set up password policies for your users. Second,
    you should know how to synchronize password databases, in the rare case where
    you need to replace a Linux PDC. You can set password policies for specific users
    with the Red Hat User Manager. You can set this in general through the /etc/login.defs
    configuration file.


    # Password policies


