    When you configure a Linux computer with Samba, you can choose whether it''s a
    client or a server—and on either a Microsoft Workgroup or a Domain.\Before I show
    you how to configure Linux computers on a Windows network, I''ll show you an alternative:
    configuring NFS on a Windows computer.


    # The NFS alternative—an overview


    The Network File System (NFS) is designed for sharing directories between Linux
    and Unix computers. NFS is native to Linux, so if you have only Linux and Unix
    computers on your LAN, it''s more efficient to use NFS. You could set up a Samba
    network between Linux and Unix computers, but why install software that you don''t
    need? There are security issues associated with NFS, but you can protect an NFS
    LAN with an appropriate firewall.

    But the point of this book is to set up communication on a network with Linux
    and Microsoft Windows computers, which is why I focus on Samba.


    Microsoft offers a way to communicate with NFS networks: Microsoft Services for
    Unix 3.0. For an additional $99 per computer, you can set up your 32-bit Windows
    computers as clients and servers on an NFS network. However, this does not work
    for Windows 9x without additional third-party software. It also does not work
    on the Windows XP operating system.


    Thus, unless you''re willing to limit Microsoft Windows clients on your network
    to Windows NT, 2000, and XP, Professional Services for Unix is not a viable option.
    I focus on Samba as a way to help Linux communicate on a network with Windows
    computers.


    # Basic administration


    When you administer a Linux computer, you need to understand processes and users.
    Services such as Samba run as processes. When you configure Samba, you''ll generally
    need to configure a file to associate Microsoft Windows users with Linux users.


    As you''ll see in Chapter 4, “Setting Up Your Server''s Users,” you could set
    up the same user names on a Linux server, and use Samba commands to make them
    readable. If you can''t set up the same user names, you could add a database that
    matches the user names you have on your Linux Domain and the Microsoft computers
    on your network.'
