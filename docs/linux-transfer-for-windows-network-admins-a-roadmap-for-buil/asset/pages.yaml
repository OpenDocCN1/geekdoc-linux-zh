    # rpm -Dvh /mnt/cdrom/RedHat/RedHat/RPM/samba-client*

    ```


    However, if you don''t plan to share directories or printers from a Linux workstation,
    don''t install the Samba server. Installing software that you don''t use can be
    a security risk.'
