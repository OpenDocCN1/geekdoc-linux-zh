    | 5 | The inodes count the number of files owned by the user in the /home directory.
    |

    | 6 | The second soft limit defines the number of files that a user can store
    in the /home directory. |

    | 7 | The second hard limit defines the number of files that a user can store
    in the /home directory after the grace period expires. |


