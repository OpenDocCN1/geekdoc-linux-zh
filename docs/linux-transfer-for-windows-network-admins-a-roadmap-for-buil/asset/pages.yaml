  md: '# Chapter 8: Administration and Management 235


    Table 2. Is command examples.


    | Command | Explanation |

    |---|---|

    | ls /etc/samba | Lists the regular files in the /etc/samba directory. |

    | ls -a | Lists all files, including hidden files, in the current directory, in
    alphabetical order. |

    | ls -F | Lists all files by type. The file type is indicated by a character at
    the end of the name. A forward slash (/) means that a file is a directory, and
    an asterisk (&) means that a file is actually a link to another file. |

    | ls -l | Lists all the files in the current directory, with output as described
    in Table 1. Functionally equivalent to the MS-DOS dir command. |

    | ls -r | Lists files in reverse alphabetical order. |

    | ls -t | Lists files by the last time they were changed; by default, the most
    recently changed files are listed first |


    You can combine command switches. For example, the **ls -ltr** command lists all
    files (-l), by the last time they were changed (-t), in reverse order (-r).


    # Basic file management commands


    Once you know how to get around and view your files, you can poke through your
    filesystem. You can learn about Linux by looking up the files in many directories
    such as /etc/samba. But there are of different directories. You may need help
    searching the thousands of files on your Linux system. There are two commands
    that you can use: **find** and **locate**.


    Once you find an interesting file, you may want to know what''s inside. There
    are a variety of commands that can look through files in a number of different
    ways, including **cat**, **more**, **less**, **head**, and **tail**.


    > You can find out more about bash commands through their manuals; for example,
    to find out more about the **head** command, type **man head**.


    As you learn more about files, you''ll know how to create and delete the files
    of your choice. For example, you may want to copy current files such as /etc/samba/smb.conf
    as a backup, or as a way to try out different configurations.


    # File searches


    On a Linux server, users add and delete files all the time. There are two commands
    that you can use to find files on your computer: **find** and **locate**. There
    are advantages and disadvantages to each command.


    # find


    If you want to know for sure the location of a file, you''ll want to use the **find**
    command. It''s fairly straightforward. For example, if you want to find the location
    of the Samba-PDC-HOWTO.html file on your system, run the following command:


    ```

    $ find -name Samba-PDC-HOWTO.html

    ```'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'There are two issues with the find command. First, if you run it as a regular
    user, you don''t have access to, and therefore can''t search through, all directories
    on your Linux computer. For example, the following message states that you don''t
    have permission and therefore can''t search through /root, the home directory
    for the administrative root user:


    ```

    /root: Permission denied

    ```


    Second, the find command times to search through all files on the computer. If
    a number of users are connected to the slower computer, the find command could
    easily take several minutes.


    You can use wildcards with each search. For example, if you don''t know the whole
    file name, you can use an asterisk as a wildcard:


    ```

    $ find -name *Samba-*.html

    ```


    # locate


    The alternative to find is the locate command. There are two advantages to locate.
    This command works very quickly, as it searches through an existing database of
    files on your computer. It automatically searches for all files that have the
    search term anywhere in their file name. For example, the following command searches
    for the same files as the previous find command with the wildcards:


    ```

    $ locate Samba-

    ```


    The drawback is that the database associated with the locate command may not be
    up to date. As we will see later in this chapter, it''s updated by default at
    4:02 every morning.


    # Reading files


    Most Linux services are configured through text files. There are many ways to
    take a quick look at the files of your choice. You can use one of five basic commands
    to browse through a text file: cat, more, less, head, and tail.


    # cat


    The cat filename sends the contents of the file name to the screen. For example,
    the following command reads the contents of your basic password database file:


    ```

    $ cat /etc/passwd

    ```


    You can also read several files continuously; for example, the following command
    scrolls through /etc/passwd and /etc/group consecutively.


    ```

    $ cat /etc/passwd /etc/group

    ```'
