    # Logon scripts


    Logon scripts are commonly used to automatically connect users to shared directories
    and printers. They should be located in the directory defined in the smb.conf
    [logon] share. They’ll work for all Windows workstations as they’re saved as MS-DOS
    text files with a BAT extension. You can do this by saving files in text format
    with Microsoft Windows Notepad, not Notepad.


    ![](img/6ee4859e736a0839007ea9afb576c195_174_0.png)


    Microsoft Windows WordPad adds a return character to files saved that Notepad
    and Linux text editors, as gedit, do not.


    Thus, to configure logon scripts, you will need both a PDC and a Microsoft Windows
    computer on a network. Installing a PDC on a Linux computer requires Samba. In
    this case, I’ll be setting up a script for a user named **pilot**. Once these
    computers are available, take the following steps:


    +   On the Linux computer, log in as the root user. Open the Samba configuration
    file, /etc/samba/smb.conf. Make sure to activate the [logon] share. I’m assuming
    that you’re setting up the share as described in Chapter 4:


    ```

    [logon] = Network Logon Service

    path = /home/home/logon

    guest ok = no

    writable = yes

    ```


    +   In the Samba configuration file, activate the appropriate **login script**
    command. I’m assuming that you’re activating scripts by user name, which corresponds
    to the following command:


    ```

    login script = %U.Bat

    ```


    +   Reload the Samba configuration with the /sbin/service smb reload command.
    This makes Samba read the new smb.conf configuration file.


    +   On a Microsoft Windows computer, log in as the administrative or root user
    on the Domain.


    +   Open Microsoft Windows WordPad by clicking Start | Run and then typing **wordpad**
    in the text box that appears. Press Enter.'
