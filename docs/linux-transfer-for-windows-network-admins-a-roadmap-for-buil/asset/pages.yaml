    LA\Profiles%U and the following command, you can set the path variable for your
    profiles:


    ```

    path = /home/profiles

    ```


    Don''t forget to create the directory as defined by the path variable (/home/profiles);
    you''ll

    want to give all users full permissions to that directory with the following commands.
    (Don''t

    include these commands in the Samba configuration file; run them from the command-line

    interface.)


    ```

    # mkdir /home/profiles

    # chmod 777 /home/profiles

    ```


    Windows NT/2000/XP NTUSER.DAT files are stored in the /home/profiles/%U directory,

    where%U corresponds to the user name. For example, with the commands shown in
    this

    section, the profiles for user mj are stored in the /home/profiles/mj directory.
    Unless the profile

    is mandatory, you need this to be a writable directory for the subject user, which
    you can set

    with the following command:


    ```

    read only = no

    ```


    Microsoft Windows users often do change their profiles. To allow the owner of
    the profile

    to write his or profile directory, you''ll need to set the following permissions
    for files

    and the directory:


    ```

    create mode = 0600

    directory mode = 0700

    ```


    As with the [netlog] share, it''s best to keep [profiles] off the browse list,
    and prevent

    access to guest users:


    ```

    browseable = no

    guest ok = no

