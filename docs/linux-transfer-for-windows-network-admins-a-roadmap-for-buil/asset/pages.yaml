  md: '# Appendix A


    # Samba 3.0 Preview


    Samba 3.0 was officially released in September of 2003. It is not included with
    Red Hat Linux 9. You can use it to more tightly integrate your Linux computers
    in a network with Microsoft Windows computers. The Samba designers have included
    a number of tools that allow Linux computers to work as Active Directory member
    servers with other Windows 2000/2003 Servers. You can even download this software
    from www.samba.org and the Fedora Rawhide database currently at ftp.redhat.com.


    In this book, I''ve covered using Red Hat 9 with Samba 3.2.7 to use as a File
    and Print server on a network with Microsoft Windows computers. This network is
    the standard Microsoft network, which uses Server Message Block (SMB) over the
    NetBIOS protocol. You can use a Linux computer so as a client on a peer-to-peer
    Workgroup or a Domain. You can configure that computer as a member server on a
    peer-to-peer Workgroup or a Domain. You can even configure that as a Primary Domain
    Controller (PDC) on a Domain. That computer can take the place of a Microsoft
    Windows NT 4 PC. Unfortunately, it cannot take the place of a Domain controller
    in a network associated with the Active Directory features of Windows 2000/2003
    Server.


    Because Samba 3.0 was not included with Red Hat Linux 9, a full description of
    this software is beyond the scope of this book.


    # New features in Samba 3.0


    There are a number of new features in Samba 3.0 that bring Linux into the standard
    network environment associated with Microsoft Windows 2000/2003 Server. Samba
    3.0 has been under active development for years. As Microsoft has released new
    features in Windows 2000/2003, the Samba developers have worked on matching those
    features. These features include:


    +   Access Control Lists (ACL). Samba 3.0 supports the use of ACL, as long as
    you''re working with a format such as the ext3 system associated with Linux.


    +   Active Directory support. Samba 3.0 allows a Linux computer to join an Active
    Directory realm as a member server. This is possible with the support that the
    Samba developers are including for LDAP and Kerberos 5.


    +   Authentication flexibility. Samba 3.0 allows a Linux administrator to manage
    Samba-enabled users, groups, and computers through the Samba configuration file,
    samba.conf.


    +   File name mangling support. File mangling is the way that long file names
    are represented as MS-DOS files. For example, file mangling in MS-DOS represents
    a long file name such as linuxtransferchapter1.doc as linux-1.doc.


    +   DOS-style net commands. Samba 3.0 includes net commands that can help you
    view and manage the users, groups, and computers on your network. While they are
    not identical to the net commands in MS-DOS, they are more capable.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '+   Microsoft Windows NT-style error codes. Samba 3.0 includes support for
    Windows NT error codes and messages as "System error 53 has occurred" when a computer
    cannot be found.


    +   Additional printer details. Samba 3.0 supports sharing additional attributes
    of shared printers in the active directory.


    +   Winbind daemon flexibility. The Samba winbind daemon supports authentication
    through the Domain controller with user name and password database. Samba 3.0
    has an upgraded winbind with two threads. One thread keeps the authentication
    database up to date. The other thread answers requests from the cache. This dual-thread
    configuration promises to improve performance.


    +   Easier migration from a Windows NT 4 PDC. Samba 3.0 includes a migration script
    that eases the burden of converting from a Windows NT 4 PDC to one based on Samba
    on a Linux computer. This script will convert users and groups, as well as the
    Machine Security Identifiers (SID) for the Domain.


    +   Winbind architecture mapping. Samba 3.0 upgrades the winbind daemon architecture
    to support mapping between a machine SID and group IDs. It will require LDAP support.


    +   Alternate name/password database. For stand-alone servers, such as on a peer-to-peer
    Workgroup, you can set up a password database suitable for Windows computers in
    the /etc/samba/passwd.tdb file.


    +   Trust relationships. Samba 3.0 supports the creation of trust relationships
    between Windows NT 4 Domains. If you have a large network, you probably have multiple
    Domains. One of the net commands will support the creation of trusts between Domains.


    # New variables in the Samba configuration file


    As the current version of Samba, the behavior of Samba 3.0 and Linux depends on
    the configuration as defined in the main Samba configuration file. In Red Hat
    Linux 9, that file is located in /etc/samba/smb.conf. Samba 3.0 includes a new
    number of defaults as well as newly configurable variables.


    The following highlights will give you more of a feel of what you can do with
    Samba 3.0. The behavior of some of the variables you''ve seen in this book changes
    for Samba 3.0.


    +   encrypt passwords: Passwords are now encrypted by default. If you want to
    accommodate older Windows operating systems that cannot handle encrypted passwords,
    you''ll need to add the following line to smb.conf:


    ```

    encrypt passwords = no

    ```


    +   winbind uid, winbind gid: These variables have been replaced by idmap uid
    and idmap gid. The new variables support mapping to NT user and group SIDs.'
  merge: -1
  pgno: 308
- img_proc: true
  md: "# Appendix A: Samba 3.0 Preview 289\n\n+   **add user script**: This command\
    \ is replaced by **add machine script**; the default version of this command no\
    \ longer assigns the computer account to any specific group.\n\nNaturally, there\
    \ are a number of new variables that you might find useful when incorporate Samba\
    \ 3.0 into your network. Some of the most interesting variables related to user\
    \ names and passwords include the following:\n\n+   **add group script**: Supports\
    \ creation of Windows Domain groups on the local Linux computer. Closely related\
    \ to **delete group script**.\n\n+   **add user group script**: Supports adding\
    \ a Samba-enabled user to a Windows Domain group on the local Linux computer.\
    \ Closely related to **delete user group script**\n\n+   **auth methods**: If\
    \ you have multiple user name/password authentication databases, this variable\
    \ allows you to search the order.\n\n+   **passdb backend**: Allows you to switch\
    \ between password databases. The default uses the **smbpasswd** command. You\
    \ can set up this variable to look at the passwd.tdb database for a stand-alone\
    \ server, or a database that conforms to LDAP.\n\n+   **realm**: Lets you specify\
    \ the Kerberos 5 server to use for authentication with an associated LDAP database.\n\
    \n+   **set primary group script**: Allows administrators to set a primary group\
    \ for a new user.\n\nYou can also use several Samba configuration variables to\
    \ manage the files that are shared with clients on the network. Some of these\
    \ variables include the following:\n\n+   **hide special files**: Linux includes\
    \ a number of special files that you may not want to share, as devices.\n\n+ \
    \  **hide unritable files**: You can minimize the frustration of users by hiding\
    \ readonly files from browse lists. Naturally, this is not a good idea if you've\
    \ shared a directory that is supposed to be read-only.\n\n+   **map acl inherit**:\
    \ Supports mapping from a Microsoft Windows ACL. \n\n# Conclusion\n\nThis book\
    \ is focused on Samba 2.2,7, which is included with Red Hat Linux 9. It allows\
    \ you to set up a Linux computer in one of three roles on a Microsoft Windows\
    \ network: a client, a member server of Domain or a peer-to-peer Workgroup, or\
    \ a PDC that can substitute for a Windows NT 4 computer.\n\nTwo major factors\
    \ make Samba 3.0 valuable to you. It allows you to configure Linux as on a Microsoft\
    \ Active Directory network, which makes it a suitable replacement for a Windows\
    \ 2000/2003 server. It also allows you to automate upgrades from a Domain based\
    \ on a Windows NT 4 PDC."
  merge: -1
