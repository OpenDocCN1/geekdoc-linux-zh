  md: '# 102 Linux Transfer for Windows Network Admins


    All users as guest

    You can set up a public directory for all users. The following stanza sets a guest
    directory where everyone can overwrite everyone''s files. I have changed the path
    variable to be a part of the /home directory.


    ```

    [public]

    path = /home/public

    public = yes

    only guest = yes

    writable = yes

    printable = no

    ```


    The key command is only guest = yes, which directs all logins to the guest account.
    On the Samba server, no matter how you log in this shared directory any files
    you create are owned by the guest account. Anyone else who logs in that same guest
    account. Therefore, anyone can delete files that others create or copy into this
    directory.


    # A small group


    The final stanza allows you to set up a private directory for a group of two users.
    It''s similar to the directory described in the earlier section "A group directory,"except
    this directory is private. You still need to set up a separate directory owned
    by a group that has the desired users.


    You then need to set the shared directory with complete group permissions, in
    which this case permits only to mary and fred. Each user retains individual ownership
    of any files he or places in the shared directory. For example, if Fred creates
    the chapter4.doc file, Mary can''t delete file.


    ```

    [myshare]

    comment = Mary''s and Fred''s stuff

    path = /home/maryfred

    valid users = mary fred

    public = no

    writable = yes

    printable = no

    create mask = 0765

    ```


    # Conclusion


    You can configure Samba to set up your Linux computer as a client, a server, or
    a Domain controller on a Microsoft Windows network. Before before doing so, you
    need to understand the background behind the Microsoft CIFS. In this system, you
    can set up client and server computers in Microsoft networks, organized in Workgroups
    and Domains.


    There is an alternative; you can set up Microsoft Services for Unix on Microsoft
    Windows computers. Unfortunately, this is costly and it does not support Microsoft
    Windows 9/ME computers on your LAN. In contrast, Samba is free and reliable and
    is therefore the main focus of this book.


    Before you configure Samba, you need to understand how to start and manage the
    Samba process. Samba users depend on the basic organization of users on your Linux'
