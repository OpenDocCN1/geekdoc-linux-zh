  md: '# Defining shared directories and printers


    The shared in the default Samba configuration file address a wide variety of situations.
    The following sections analyze each of these shared settings in detail. You can
    then activate and customize these settings to meet your needs. I define additional
    scenarios for shared directories in Chapter 4, "Setting Up Your File Server’s
    Users," and for shared printers in Chapter 7, "Configuring Printers."


    Samba includes a default share that allows users to access their home directories
    on Linux computer. It allows you to configure shared directories for network logins
    and roaming profiles. It also supports shared printers with varying permissions.


    Shares in samb.conf are organized in stanzas. A stanza in a Linux configuration
    file is a group of commands organized for one purpose. For example, the following
    stanza relates to the way Samba allows Linux to share user home directories:


    ```

    [homes]

    comment = Home Directories

    browseable = no

    writable = yes

    valid users = %%

    create mode = 0664

    directory mode = 0775

    # If you want samba doesn''t recognize to be mapped to a guest

    map to guest = bad user

    ```


    # Home directories


    By default, every user who logs in to a Linux computer is taken to his or her
    home directory. Users who connect to a Samba server—and who have an account on
    that Linux computer—have default access to the same home directories. The settings
    are associated with the [homes] tag in the Samba configuration file.


    This stanza first starts with a comment variable, viewable in Windows Neighborhood
    or My Network Places. Modify it as desired.


    ```

    comment = Home Directories

    ```


    By default, you can tell Samba to keep home directories of individual users off
    the browse list using the following command:


    ```

    browseable = no

    ```


    The directory is still browseable if the user logs in the right Linux user name
    and password. If you change this variable to browseable = yes, Samba adds the
    home directories of all users on your Linux computer to the base.


    Generally, you’ll want to allow users write access to their home directories.
    But there are exceptions; you can delete or disable user accounts as described
    in Chapter 4, "Setting Up Your File Server’s Users."


    ```

    writable = yes

    ```'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Chapter 3: Setting Up Your Server File System 95


    With home directories, you want to limit access to the owner. On a Linux computer,
    the name of a home directory such as /home/mj corresponds to the name of the user
    (mj). As the following command sets the valid users variable to the name of the
    share (%S), it''s setting it to the name of the home directory.


    ```

    valid users = %S

    ```


    All Linux files have permissions associated with the file owner, group owner,
    and all others on the computer. The create mode command specifies the permissions
    for files that you copy, in this case, to the home directory on the Linux computer.
    I explain these permission numbers in detail in Chapter 4, "Setting Up Your File
    Server’s."


    ```

    create mode = 0664

    ```


    As with files, all Linux directories have permissions. This command assigns permissions
    for all directories that you copy or create:


    ```

    directory mode = 0775

    ```


    Unless the computer is on a Domain, anyone without a valid account on the Linux
    computer won''t be able to log in to a home directory. If you activate this command,
    users that aren''t on your Samba system are automatically mapped to the guest
    user, as defined earlier in the Samba configuration with the guest account variable
    described earlier in this section.


    ```

    ; map to guest = bad user

    ```


    If you''re configuring a Linux computer as a Domain member server, users are mapped
    to a home directory even if it doesn''t exist. For example, Assume Wil has an
    account on the PDC, but no account or /home/wil home directory on the member server.
    The default share makes it like Linux has a home directory on the member server.

    Therefore, you may want to deactivate the Home Directories stanza for Linux Domain
    member servers.


    # Domain network logons


    The next, [netlogon], allows you to set up the Network Logon Service on a Samba
    server configured as a PDC. This assumes you set the following commands earlier
    in this file:


    ```

    security = user

    domain master = yes

    domain logons = yes

    ```


    Then to set up the NETLOGON share for user login scripts, you''ll want to modify
    as needed, and activate the following commands. Don''t forget to activate the[netlogon]
    tag by removing the semicolon in front of the tag:


    ```

    ; [netlogon]

    ```'
