  md: '# Linux Transfer for Windows Network Admins


    ```

    SHELL=/bin/bash

    PATH=/bin:/sbin:/usr/sbin:/usr/bin

    MAILTO=root

    HOME=/


    # run-parts

    01 * * * root run-parts /etc/cron.hourly

    02 4 * * root run-parts /etc/cron.daily

    22 4 * * * root run-parts /etc/cron.weekly

    42 4 1 * * run-parts /etc/cron.monthly

    ```


    # Figure 5. A schedule for cron jobs.


    As described earlier, the PATH is the default shell in Linux. The next command
    sets a search path for commands. The path command used here tells Linux to automatically
    look in the noted directories for a given command in the order they are listed:


    ```

    PATH=/bin:/sbin:/usr/bin

    ```


    For example, if you run the run-parts command, Linux automatically searches the
    /sbin, the /bin, the /usr/sbin directories for command, and in order. The first
    run-parts command that it finds is one of these directories.

    The MAILTO command is useful for administrators; any time Linux runs a cron job,
    the command sends the message to the noted administrative user, root. You can
    set this to the name of your choice. If you set a mail server, to your Internet
    e-mail address.


    ```

    MAILTO=root

    ```


    Finally, the HOME variable sets the starting directory for the remaining commands
    in script—in this case, the top-level root (/) directory:


    ```

    HOME=/

    ```


    As described in earlier chapters, any command that starts with a pound sign (#)
    or a semicolon (;) is a comment: the #run-parts line is just a comment for the
    commands that follow. Now it becomes a bit more complex. In the /etc/crontab file,
    there is a specific format for a command. For example, the first command from
    the default version of this file runs every in the /etc/cron.hourly directory
    at minute past hour of every day:


    ```

    01 * * * root run-parts /etc/cron.hourly

    ```


    The next command runs the scripts in the /etc/cron.daily directory at 4:02 a.m.
    daily:


    ```

    02 4 * * * run-parts /etc/cron.daily

    ```


    The third command runs every script in the /etc/cron.weekly directory at 4:22
    a.m. every Sunday:


    ```

    22 4 * * 0 run-parts /etc/cron.weekly

    ```'
