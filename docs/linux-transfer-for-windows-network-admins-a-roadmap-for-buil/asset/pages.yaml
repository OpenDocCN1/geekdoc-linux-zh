  md: '# Linux Transfer for Windows Network Admins


    # A common directory


    You may want a common directory for all of the users on your network. It''s a
    common practice to use the /tmp directory to share files and store downloads.
    If you intend to use /tmp for either of these purposes, you may want to mount
    it on a separate partition when you install Linux.

    The default Samba configuration provides standard commands that you can use to
    share the /tmp directory with all users. Remember, to activate these, delete the
    semicolon at the start of the line. Naturally, the stanza starts with a tag:


    ```

    ; [tmp]

    ```


    As with shared directories, the comment you enter is shown in Windows Network
    Neighborhood or My Network Places and can help users understand the purpose of
    the share. Change the value of the comment variable as desired.


    ```

    ; comment = Temporary file space

    ```


    Naturally, if you want all users to be able to share files in this directory,
    you need to make it writable. The writable = yes command is synonymous to the
    following:


    ```

    ; read only = no

    ```


    And if you have guest users, you can make the directory accessible to them with
    the following command:


    ```

    ; public = yes

    ```


    # A group directory


    You can set up directories for individual groups of users. The following command
    stanza, if activated, creates a directory that is writable for a specific group
    of users, and read-only for everyone else who connects to your Samba server. As
    always, the stanza starts with a specific tag:


    ```

    ; [public]

    ```


    Once again, the stanza follows up with a comment command to help explain the purpose
    of the share:


    ```

    ; comment = Public Staff

    ```


    The path defines the shared directory. When you create this directory, access
    depends on Linux ownership of this directory. If users mj and ej are part of the
    staff group, you need to make that staff is the group owner of /home/samba directory—and
    that members of the staff group have permission to write to /home/samba. For more
    information on this process, see Chapter 4, “Setting Up Your File Server’s Users.”


    ```

    ; path = /home/samba

    ```'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Chapter 3: Setting Up Your Server File System 99


    You can set the directory and contents to be visible to all users who connect
    to your Samba server with the following command:


    ```

    public = yes

    ```


    Before any user can write to /home/samba, you need to include the following command:


    ```

    writable = yes

    ```


    The following command is probably not critical, unless you have a printer that
    might use this directory for spool files:


    ```

    printable = no

    ```


    You can specify the users and groups who are allowed to write to this directory
    with the write list command. If you activate the following command, users in the
    staff group are allowed to write to files at /home/samba directory.


    ```

    write list = @staff

    ```


    Alternatively, you can specify a list of users in the write list, such as:


    ```

    write list = mj ez

    ```


    When a user writes a file to the /home/samba directory, Linux assigns file ownership
    to that user. For example, if mj copies the Chapter3.doc file to /home/samba,
    only user mj gets to overwrite it.


    # Sharing printers


    You can''t use Samba to configure a printer; you''ll learn about this process
    in Chapter 7. However, you can use Samba to share installed printers, based on
    the list collected through the /etc/printcap file. Naturally, this starts with
    the name of the Printers stanza:


    # [printers]


    Based on what you''ve seen so far, two of the commands from the default smb.conf
    configuration file used to matter but no longer make any difference. The comment
    command no longer drives the command associated with shared printers in a Windows
    Network Neighborhood or My Network Places. In other words, you can delete the
    following command, and it''ll make no difference:


    ```

    comment = All Printers

    ```


    The standard Microsoft Windows and Linux print systems both work on spool files.
    In other words, they process a print job through a filter; the print job is processed
    into a file in the spool directory. In Samba, the spool directory is defined by
    the path variable, as:


    ```

    path = /var/spool/samba

    ```'
