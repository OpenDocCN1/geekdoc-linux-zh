  md: '# Linux Transfer for Windows Network Admins


    ![](img/6ee4859e736a0839007ea9afb576c195_222_0.png)


    **Figure 1.** Switching print systems.


    When you switch print services, the Red Hat Printer System Switch also deactivates
    the unwanted print service. For example, if you switch from LPD to CUPS, it stops
    the lpd service and starts the cups service from the /etc/init.d/rc directory.
    It also translates the code in /etc/printcap.


    If you''ve created a printer using the Red Hat Printer Configuration utility (also
    known as the Printer Configurator), you can use the Printer System Switch to switch
    all configured printers on your print server between the two systems.


    # Configuring a print service


    As with Samba, there are two different GUI tools available to configure CUPS printers.
    One is a tool developed by Red Hat, called the Printer Configuration utility.
    Another is a Web-based configuration tool, developed by the people behind CUPS,
    Easy Software Products, Inc. (www.easyys.com). I''ll focus on the Red Hat tool
    which includes all of the settings you''ll need to configure a CUPS printer locally—or
    over a Microsoft Windows-based network.


    If you want to use the default CUPS print service, don''t worry about CUPS licensing.
    Easy Software Products has licensed the version of CUPS included with Red Linux
    under the same license as the rest of the Linux operating system, the General
    Public License.


    To start the Red Hat Printer Configuration utility from the Linux GUI, click Main
    Menu | System Settings | Printing. Enter the root user password if prompted; Red
    Hat should now open the Printer configuration dialog shown in **Figure 2**. It
    also include the name of the local computer. As you can see, I''m configuring
    printers on my Linux Domain member server named NoPaws.'
