  md: '# Acknowledgements


    The world of Linux includes a number of communities, with people of all personalities
    and motives. For example, some of the communities are working on elements such
    as the kernel, the GUI, and print servers. Together, they''ve developed an operating
    system which many find to be superior to the Microsoft server operating systems.
    With Samba, you can substitute a Linux computer directly for a Microsoft server.


    It''s a small community to create this computer. With the Linux Transfer series,
