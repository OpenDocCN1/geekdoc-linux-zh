  md: '# Global settings


    In this section, I''ll explain the global options available from the standard.smb.conf
    configuration file. As you''ll see, many of the options are commented, and can
    be activated by deleting the hash or semicolon at the beginning of the line. The
    following tag tells Samba to look for global settings:


    [global]


    Next, you''ll want to identify the network that you want this computer to join.
    As noted in the comment, it doesn''t matter whether you''re joining a Windows
    Workgroup or Domain; just substitute the name of the Workgroup or Domain for MYGROUP.


    ```

    workgroup = NT-Domain-Name or Workgroup-Name

    workgroup = MYGROUP

    ```


    If the workgroup variable is missing from the file, Samba assumes you''re joining
    the default workgroup, which happens to be the default associated with Microsoft
    Windows peer-to-peer networks: WORKGROUP. Next, you can customize how other users
    see when they browse through Network Neighborhood or My Places.


    ```

    # server string is the equivalent of the NT Description field

    server string = Samba Server

    ```


    As described earlier, you can limit access to specific networks. The following
    commands, if active, limit access to computers with a network IP address of 192.168.1.0
    and 192.168.2.0, as well as the loopback address (127.0.0.1).


    ```

    ; hosts allow = 192.168.1. 192.168.2. 127.

    ```


    The dot on the right side of the IP address acts as a wildcard. Remember, with
    a semicolon in front it is a comment; if you want to use the command shown, open
    smb.conf in a text editor and delete the semicolon.


    You could set limits in the allowed IP addresses; for example, the following command
    allows access for all computers with a network address of 10.0.0.0, except those
    with a network address of 10.44.0.0.


    ```

    hosts allow = 10. EXCEPT 10.44. 127.

    ```


    Next you''ll see how Samba shares the list of installed printers on your system.
    From the commands shown, Samba gets its from /etc/printcap, and automatically
    shares these printers on the Microsoft network.


    ```

    printcap name = /etc/printcap

    load printers = yes

    ```


    For Red Linux, /etc/printcap includes your list of installed printers whether
    you''re using the default CUPS or the former LPR print service. You''ll see how
    this works in Chapter 7, “Configuring Printers.”'
  merge: -1
