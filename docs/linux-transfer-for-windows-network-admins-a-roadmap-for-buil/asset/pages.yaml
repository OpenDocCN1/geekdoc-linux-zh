  md: '# Backing up over a network


    One of the reasons for having a file server is that you have a central database
    of files for easier backups. Users on your network can store all important data
    on the file server, and then as the administrator, all you have to do is back
    up directories on the file server. I illustrated this in the previous section
    of this chapter.


    If the Linux partition with the /home directory is large enough, the users on
    your network can simply save their important files to their individual home directories.
    To work up the /home directory then automatically backs up your users'' files.
    As usual, there are four basic scenarios for backups on a mixed network with Linux
    and Windows computers:


    +   * From a Windows client to a Windows file server

    * From a Windows client to a Linux file server

    * From a Linux client to a Windows file server

    * From a Linux client to a Linux file server.


    The basic steps that you take to connect to a Linux client are the same, whether
    you''re connecting to a Windows or a Linux file server. I''ve described some of
    the differences in Chapter 5, "Connecting Windows Workstations." For our purposes,
    some defaults as home directories do configure from server to server, depending
    on how the Windows and Linux file servers are configured.


    As with the rest of the book, I''m assuming that you''re using Samba on your Linux
    computers to connect to other Linux and Windows computers in a Microsoft Windows-style
    network.


    If the file server resides on a Linux or Windows Domain Member Server, you can
    share and back up the directories of your choice. If it''s a Linux Domain Member
    Server, you can use the techniques I described in Chapters 3 and 4 to share its
    /home directory for read-only backups over the network.


    # Backing up from a Windows client to a Windows file server


    Because this book is written for Microsoft Windows administrators, I''m assuming
    that you know how to configure a backup from a Windows client to a Windows file
    server. I''ll just review the basic technique you can use the same techniques
    to back up Linux clients.


    Remember, the directories and profiles are associated with the Windows User Profile.
    In Windows NT 4 Server, the User Environment Profile is associated with the Windows
    User for Managers, as shown in **Figure 4**.


    Naturally, you should choose user home directories and profiles in the sample
    folder. This will ease your burden when you back up these files. Windows NT 4
    Server includes its own backup utility, which is accessible from Start | Programs
    | Administrative Tools (Common) | Backup. (Windows 2000 includes a similar backup
    utility when you click Start | Programs | Accessories | System Tools | Backup.)
    Because this is a book on Linux, I don''t address backups from a Windows client
    to a Windows server in detail.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Chapter 9: System Backup


    ![](img/6ee4859e736a0839007ea9afb576c195_301_0.png)


    **Figure 4.** Defining user series and directories in Windows NT 4 Server.


    ![](img/6ee4859e736a0839007ea9afb576c195_301_1.png)


    Windows NT 4 Server''s backup utility works only with tape drives. If you use
    other backup media, you will need a third-party utility to support your backup.
    There is a seemingly endless series of third-party backup utilities listed in
    the Google Web directory at directory.google.com/Top/Computers/Software/Backup.


    # Backing up from a Windows client to a Linux server


    In Chapters 3 and 4, I configured a number of commands in the main Samba configuration
    file, /etc/samba/smb.conf. These commands configure user home directories and
    Windows profiles within the home directory. Therefore, users who log in to Domain
    on a Linux PDC can save the files of their choice to their home directories.


    Once you''ve logged in to a Linux PDC, you have access to your home directory
    on the PDC or any Linux member servers through the Windows Network Neighborhood.
    If you access it through Windows Explorer, it''s easy to back up the files and
    directories of your choice to your home directory. **Figure 5** illustrates my
    connection to the /home/mj directory from my Windows XP workstation client.


    Alternatively, if you''re willing to create an additional shared directory from
    your Microsoft Windows client, you can connect to it from the Linux server using
    the smbmount command. Once you''ve mounted the shared directory from the Microsoft
    client, you can work with the shared Windows directory as if it were local to
    the Linux server. You can then back up the files from that directory using the
    text commands described earlier in this chapter. If you''re backing up to a writable
    CD, you can even use the GUI Nautilus tool shown in Figure 2.'
