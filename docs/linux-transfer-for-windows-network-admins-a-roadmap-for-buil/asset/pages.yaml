    # LPD packages


    The Print Daemon (LPD) is also known by its RPM package name, LPR (Line Print
    Request, next generation). It is the traditional print service for older versions
    of Linux and many different versions of Linux. Red Hat and other Linux distributions
    are making the transition away from LPD. There are two optional RPMs in the Red
    Hat Linux Support package group:


    LPRng

    redhat-switch-printer


    redhat-switch-printer is useful if you have installed the LPD and CUPS print services,
    because it allows you to switch your computer between these services. It is also
    known as the Red Hat Printer Switcher.

    In Red Hat Linux, there are two configuration files associated with LPD: printcap
    and printcap.local, both in the /etc directory. Any changes you make with the
    Red Hat Printer Configurator are written to /etc/printcap; if you want to add
    a printer with the text editor, you''d add the information to /etc/printcap.local.


    # Configuring a local printer


    In this section, I will show you how to configure a printer on a local server/workstation.
    For the moment, forget your network. Assume that you just have a local PC that
    directly connected to a printer. Later in this chapter, we''ll repeat the process
    for a printer that you want to switch on a network.


    # Checking services


    Before you installing printers, make sure CUPS is the active service. To do so
    from the Red Hat Linux 9 GUI, click Main Menu | System Settings | More Settings
    | Printer System Switcher. If you''ve installed both CUPS and LPD, you can switch
    between these services. For the purposes of this chapter, make sure CUPS is selected.


    ![](img/6ee4859e736a0839007ea9afb576c195_221_0.png)


    > Because Red Hat appears to remove LPD from future releases of its distribution,
    I believe that the Printer System Switcher may also disappear from future releases.'
