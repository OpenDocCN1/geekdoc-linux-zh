    drwxr-xr-x root 4096 May 22 12:53 usr

    drwxr-xr-x 19 root 4096 May 22 19:30 var

    [m]delilah[m]$

    ```


    > **Figure 1.** Basic directories.


    To summarize from Chapter 1, here are the key directories where you''ll be working
    with most:'
