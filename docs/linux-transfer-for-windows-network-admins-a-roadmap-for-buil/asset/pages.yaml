  md: '# Chapter 6: Connecting Windows Workstations 157


    # Disabling encryption


    If you want to use Microsoft Windows 95 operating systems on your network, the
    only option is to disable encryption on the PDC and all other workstations on
    the network. Samba includes Microsoft registry files that you can use on various
    Microsoft workstations. On Red Hat Linux 9, the files described in Table 1 are
    located in the /usr/share/doc/samba-2.2.7a/docs/registry/


    If you have upgraded to a later version of Samba 2.2, the directory name will
    change accordingly. If you can''t find these files, the following command should
    help:


    ```

    rpm -ql samba | grep .reg

    ```


    # Table 1. Registry files for disabling encryption.


    | File | Operating System |

    | --- | --- |

    | Win95_PlainPassword.reg | Windows 95 OSR2 (4.00.950 B) |

    | Win98_PlainPassword.reg | Windows 98 (all versions) |

    | WinME_PlainPassword.reg | Windows ME |

    | NT_PlainPassword.reg | Windows NT Workstation |

    | Win2000_PlainPassword.reg | Windows 2000 Professional/Windows XP Professional
    |

    | XP_SignOrSeal.reg | Windows XP Professional for joining a Domain with Linux
    PDC |


    To apply the registry file to a particular operating system, copy it to a temporary
    directory on the target workstation. Then double-click it through a medium such
