    # Roaming profiles


    A roaming profile provides a snapshot of a user''s desktop, background, Start
    menu items, and more on a central server, usually a PDC. When the user who owns
    a roaming profile logs in to any workstation on that network, user gets the same
    snapshot.


    If you have roaming profiles on your network, the actual location of the profile
    depends on whether the computer is Windows 95/ME or Windows NT/2000/XP. The roaming
    profile for Windows 9x/ME clients is stored in that user home directory on the
    Linux PDC, based on the commands described in Chapter 3, "Setting Up Your User
    File System."


    In contrast, the location of a roaming profile from a Windows NT/2000/XP computer
    depends on the logon path variable. Based on the value of the following variables,
    roaming profiles for Windows NT/2000/XP computers are stored in the /home/profiles/username
    directory.


    ```

    logon path = %L/Profiles/%U

    path = /home/profiles

    ```


