  md: '# Linux Transfer for Windows Network Admins


    +   - Storage area networks (SAN): A high-speed network of storage devices; many
    are common use for higher-capacity Linux systems. While this isn''t explicitly
    a backup option, it is a way to organize a RAID system.


    # High Availability Linux project


    The High Availability Linux project is one way to set up multiple computers as
    a cluster. The cluster of computers appears like a single server to the other
    computers on the network. They often share a common external storage medium, usually
    with a SCSI connection.


    If one computer in the cluster fails, another computer takes over automatically.
    Client computers on the network don''t know which computer in the cluster is working
    as the file server. Because the computers in the cluster share the same external
    storage, clients see no difference in the data.


    While this does not back up your data, it does serve as a backup for your hardware.
    For example, if you set up a PDC in a cluster, the failure of one computer does
    not affect your network. For more information on the High Availability Linux project
    and its “heartbeat” software, navigate to www.linux-ha.org.


    # Linux Virtual Server project


    The Linux Virtual Server project is another way to set up multiple computers as
    a cluster. The cluster of computers also appears like a single server to the other
    computers on the network. It can also be configured with a common external storage
    medium. One additional feature supports load balancing. In other words, if a lot
    of clients are working over one server in the cluster, load balancing adds clients
    to busy servers in the cluster.


    As with the High Availability Linux project''s heartbeat software, if one computer
    fails, other computers take over automatically. The cluster of computers appears
    as one server to the other computers on the network. For more information, see
    www.virtualserver.org.


    Red Enterprise Linux (RHEL) Advanced Server supports its version of the Virtual
    Server project. Red Hat has developed its Enterprise distributions from older
    versions of Red Hat for higher capacity systems. As of this writing, the latest
    version of RHEL Advanced is 2.1, which is based on Red Hat Linux 7.2.


    > RHEL 3 should be available by the time this book is released. RHEL 3 is based
    on the primary operating system used in this book, Red Hat Linux 9.


    # Backup and Restore commands


    As of this writing, the Nautilus file browser does not include any GUI for writing
    to a writable CD. In general, to perform backups, you will need to use the command-line
    interface. Text commands support scheduled backups through the cron daemon. Fortunately,
    the commands are not defunct. Once you have configured connections to remote computers,
    you can back up any directories shared from those computers.


    Let''s start looking at some basic backups. You can create archives with the tar
    or cpio commands. You can dump and restore data from a tape drive. And you can
    record data to writable CDs and DVDs by using the cdrecord and dvdrecord commands.'
