    Table 3. Basic Red Hat directories.


    | Directory | Function |

    | --- | --- |

    | / | The top-level directory is known as "root." All other directories are subdirectories.
    Any directory not mounted on a separate partition is included in the root (/)
    partition. |

    | /bin | Includes the basic utilities that you can run at the command, such as
