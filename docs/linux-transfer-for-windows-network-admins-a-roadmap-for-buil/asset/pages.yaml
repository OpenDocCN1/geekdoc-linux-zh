    its own package system for software installation, which is an alternative to the
    Red Hat Package Manager (RPM).

    - **Linux**: Linux (**www.linux.com**) is one of the Linux distributions focused
    on the desktop; you can get it pre-installed on computers by Wal-Mart. Unfortunately,
