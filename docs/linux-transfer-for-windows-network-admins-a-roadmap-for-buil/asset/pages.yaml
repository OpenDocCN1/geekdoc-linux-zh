  md: '# Linux Transfer for Windows Network Admins


    # Linux rescue mode


    If you''ve lost your rescue disk, it is not lost. You can boot into broken Red
    Hat Linux systems using the first Red Hat Linux installation CD. No, you''re not
    reinstalling Linux. You''re just rescuing a system that you could otherwise boot.


    The Red Hat Linux rescue mode is powerful. Recently, I accidentally deleted the
    master boot record from my desktop computer. I installed Windows 8 and Red Hat
    Linux 9 in a dual-boot configuration. I tested various Windows 9 boot floppies.
    They did not recognize the hard drive. The linux rescue mode is that I explain
    in this section helped me fix the hard drive quickly and easily.


    The steps in this section are based on Red Hat Linux 9. If you''re using another
    version of Red Hat Linux, the steps may vary slightly. The linux rescue mode did
    not exist before Red Hat Linux 7.3.


    To use linux rescue mode, take the following steps:


    +   Boot your computer. When it boots, check the BIOS menu. Depending on your
    computer, you can do this by pressing the F1, F2, or Delete keys. If none of these
    keys work, check the documentation for your computer.


    +   Adjust the boot order of your computer, so it boots first from your CD drive.


    +   Insert the Red Hat Linux installation CD, and then reboot your computer.


    If you have a Red Hat Linux boot floppy, you can substitute it for the first Red
    Hat Linux installation CD.


    +   When you see the Red Hat Linux installation screen, you''ll see the following
    at the bottom of the screen, you can type the linux rescue command:


    ```

    [F1-Main] [F2-Options] [F3-General] [F4-Kernel] [F5-Rescue]

    boot: linux rescue

    ```


    +   The Red Hat Linux installation program installs a basic Linux system on your
    computer. You''ll need to go through a few installation steps before the linux
    rescue mode searches through your system. In the Choose a Language screen, select
    a language and press Enter.


    +   In the Keyboard Type screen, select the keyboard that most closely reflects
    your system, and then press Enter.


    +   Your CD starts running Anaconda. When you set up the Networking screen, use
    the Tab key to highlight No, and then press Enter.


    +   You''ll see the rescue screen shown in Figure 10. You have three choices here:
    the Read-Only and Skip require skills that are beyond the scope of this book.
    Therefore, highlight Continue and press Enter.'
