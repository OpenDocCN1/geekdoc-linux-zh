    If the mounted directory is different, such as /usr or /, create the quota file
    in that directory.


    Now you can configure each of these files. The following commands scan (-a), return
    verbose output (-v), and remove the /home directory. Naturally, the first command
    performs this task for user quotas (-u), and the second command performs this
    task for group quotas (-g). Finally, it does all of without removing (-m) the
