  md: '# touch


    In Chapter 4, I showed you how to create an empty file by using the touch command.
    For example, the following command helps you set quotas in the /home directory:


    ```

    # touch /home/aquota.user

    ```


    # cp


    The copy (cp) command is nearly as versatile as ls. Naturally, you can copy the
    contents of one file to another with the following command:


    ```

    # cp file1 file2

    ```


    You can copy one or more files to a directory. For example, if you wanted to copy
    all of the files from the current directory to a directory named backup, run the
    following command:


    ```

    # cp * backup

    ```


    If a file already exists, you''re prompted to see if you want to overwrite the
    existing copy of the file. For example, if you run the cp backup command, you''ll
    be trying to overwrite the files you just copied to the backup directory. The
    bash shell warns you of this problem such as:


    ```

    cp overwrite ''backup/file1?''

    ```


    to which you can reply y or n. Alternatively, you can automatically overwrite
    existing files with the -f switch. You can search through the full cp command
    manual with the man cp command. Alternatively, you can look through Table 3, which
    includes examples of the cp command that I use frequently.


    # Table 3. cp command examples.


    | Command | Explanation |

    | cp file1 file2 | Creates a new file file2, and then copies the contents of file1
    into file2. |

    | cp file1 file23 dir1 | Copies the contents of file1, file2 and dir3 to dir1
    subdirectory. |

    | cp -a dir1 dir2 | Copies the directory and all files within dir1 to directory
    dir2. You''ll find a copy of dir1 as a subdirectory of dir2. |

    | cp -f file1 file2 | Copies the contents of file1 into file2. If file2 already
    exists, the cp -f command automatically overwrites it. |

    | cp -i file1 file2 | Copies the contents of file1 into file2. If file2 already
    exists, the cp -i command requests confirmation before overwriting it. |

    | cp -r dir1 dir2 | Copies the contents of dir1 into dir2. If there are subdirectories
    in dir1, those contents are also recursively copied to dir2. |'
