  md: '# Linux Transfer for Windows Network Admins


    There’s another way to update the package groups currently installed on your Linux
    computer: You can use Rawhide.


    # Rawhide


    While the latest versions of software packages should be available through the
    RHN, the list you see is not complete. For example, some of the software available
    through the Update Agent may only address security issues, while Rawhide may include
    upgrades to the actual software.


    You can check for the latest versions of software associated with Red Hat Linux
    by using the Rawhide directory on a Red Hat FTP server or mirrored sites. You
    can find Rawhide in the /pub/redhat/rawhide directory. Subdirectories are associated
    with different CPUs; you can download Intel 32-bit compatible packages from the
    i386 subdirectory.


    # Other updates


    Especially when it comes to security, Red Hat is conscientious about updating
    packages and making them available through the Update Agent and Rawhide on a timely
    basis. However, if you’re extra security conscious, you can go to security updates,
    SysAdmin, Audit, Security (SANS) Institute at www.samba.org.


    It’s helpful to become familiar with the organizations besides the software you
    need to create a Linux File server on a Windows network. The basic software, Samba,
    is developed primarily by a group of volunteers. Their work is documented at www.samba.org.


    The default print service for Red Hat Linux, as earlier, is CUPS. More information
    and the latest updates for its sponsor, Easy Software Products, are at www.cups.org.


    ![](img/6ee4859e736a0839007ea9afb576c195_68_0.png)


    > The versions of CUPS and Samba included with Red Hat Linux are both covered
    under the same license as the Linux operating system, the General Public License
    (GPL). More information and a copy of this license are available from the Free
    Software Foundation at www.gnu.org/copyleft/gpl.html.


    # Package management


    Once Linux is installed on your computer, there are other ways to keep your system
    up to date. Distributions such as Red Hat built upon the Red Hat Package Manager
    (RPM) system. An RPM is an integrated group of files. When opened with the rpm
    command, it installs or upgrades a specific software component. Alternatively,
    you can install an RPM in the Linux GUI.


    To maintain Red Hat Linux, you need to use more than just the Red Hat Update Agent.
    There are times when you’ll need to install or upgrade a specific software package
    from the command line. To do this, it’s important to take a detailed look at the
    rpm command.


    # Installing and upgrading RPMs


    When you installed Red Hat Linux on your computer, you actually installed a series
    of RPM packages. There are more than 1,400 RPMs on the three Red Hat 9 installation
    CDs. You can see a list of installed RPMs in the /var/log/rpmpkgs file.'
