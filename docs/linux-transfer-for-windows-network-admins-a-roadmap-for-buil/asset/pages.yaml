    # Installing what''s necessary


    During the Red Hat Linux installation process, you can select the package groups
    that you want to install on your system. These groups install everything from
    a GUI to database servers.


    If you have a relatively modern hard drive, chances are that you have plenty of
    space. You could install all the software available on Red Hat Linux and still
    have more than enough space for data. As described earlier, that''s not the best
    idea for security reasons.


    In the following sections, I explain what you can install with Red Hat Linux—the
    basic components, as well as the services you need for a File and print server,
    and other network services.


    # Basic components


    If you have a small drive, or if you''re very concerned with security, you might
    be tempted to just install the minimum software required for the Linux operating
    system. The minimum space required by Red Hat Linux is less than 500MB, which
    sounds appealing to the 2GB of software installed on your Microsoft Windows XP
    Professional C:\Windows directory.


    In fact, a minimum installation of Red Hat Linux allows networking with other
    Linux and Unix computers with NFS It includes the basic tools and commands that
    make Linux robust. But for those of you who are converting from Microsoft Windows,
    it is probably not enough. A minimum installation does not include a GUI or the
    tools to share files or printers with Microsoft Windows computers on your network.


    # Basic components plus


    To take advantage of what Linux can do for you, it is best to learn the command-line
    interface. Text commands may seem cryptic, but they are often the quickest and
    most efficient way to administer a computer. However, command-line skills are
    no longer required to configure a Linux computer or server on a Microsoft Windows
    network. Later in this chapter I will describe some tips and tricks that you can
    perform at the command line.


    Shortly, I''ll illustrate a fairly minimal configuration with a GUI and services
    that support a File and Print server. This configuration installs about 1.5GB
    of linux for your computer.


    # Options


    A number of optional package groups are associated with Red Hat Linux. A package
    group is just—a group of common software packages. For example print systems are
    part of the Printing software group; these are known as CUPS and LPD and are described
    in Chapter 7, "Configuring Printers."


    When you install Red Hat Linux in the standard graphical mode, you''ll eventually
    see a screen similar to Figure 3, which illustrates the package groups that you
    can install. If you select the X Window System package group for installation,
    you click the Details link, or deselect some of these. The same pattern holds
    true for the other package groups in this window.


    The different package groups are summarized in Table 1, and are in the same order
    as you might find during the Red Hat Linux 9 graphical installation process. I
    won''t install most of these for the purposes of this book, but you can select
    some of these groups to configure your computer for more than just file and print
    services.'
