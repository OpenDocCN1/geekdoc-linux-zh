  md: "# # Appendix B\nSample Samba Configuration Files\n\nThis appendix lists a couple\
    \ of different versions of the main Samba configuration file, /etc/samba/smb.conf.\
    \ The first file is used on a PDC, the second on a Domain member server. The comments\
    \ are a mix of those normally included with the standard samba.conf file, and\
    \ based on variables that I have added in this book. In Red Hat Linux, the standard\
    \ Samba configuration files are located in the /etc/samba directory.\n\n# ## Primary\
    \ Domain Controller\n\nThe Primary Domain Controller (PDC) includes the database\
    \ of user names and passwords for a Domain. With the following samba.conf configuration\
    \ file, you can set up a Linux computer with Samba in a Windows NT 4-based PDC\
    \ on the default version of the file that comes with the Red Hat 9 packages. I've\
    \ deleted those commands that are not used; I've added some comments in caps.\
    \ Near the end of the file, I've also added a couple of shares that I configure\
    \ on my computers. For a more detailed explanation, see Chapters 3 and 4.\n\n\
    > > The default Samba configuration file includes misspelled words and imperfect\
    \ grammar. Don't let that bother you.\n\n![](img/6ee4859e736a0839007ea9afb576c195_311_0.png)\n\
    \n```\n# This is the main Samba configuration file. You should read the\n# smb.conf\
    \ (manual) page in order to understand the options listed\n# here. Samba has a\
    \ huge number of configurable options (perhaps\n# many!) most of which are not\
    \ shown in this example\n# TO ACCESS THE smb.conf MANUAL PAGE, RUN THE man smb.conf\
    \ COMMAND.\n# Any line which starts with a ; (semi-colon) or a # (hash)\n# is\
    \ a comment and is ignored. In this example we will use a #\n# for comments and\
    \ a ; for parts of the config file that you\n# may wish to enable\n\n# NOTE: Whenever\
    \ you modify this file you should run the command \"testpar\"\n# to check that\
    \ you have not made any basic syntax errors.\n#===================================================\n\
    # Global Settings ==================================\n# workgroup = NT-Domain-Name\
    \ or Workgroup-Name\n  workgroup = GRATEFUL\n# LOCAL COMPUTER NAME\nnetbios name\
    \ = cosmmic\n```"
  merge: -1
