    The basic smclient communicates with any server on a Microsoft Windows network.
    That includes any Linux computer with shared directories or printers on a network.


    The -L switch directs smclient to look for the shares of a specific computer on
    a network. In this case, that computer is named allacces. The -U michael at the
    end of the command specifies a user name for the allacces computer, or a user
    name on the Domain. You''re prompted to look over your user''s password.


