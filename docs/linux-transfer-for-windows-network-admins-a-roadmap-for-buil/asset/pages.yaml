    # Scripts for repetitive tasks


    Computers need to be maintained. Because maintenance affects computer and network
    performance, most administrators maintain networks in the middle of the night,
    or during periods of minimal activity. If you''re administering a network of computers,
    you could stay up and set a script to maintain them automatically.


    Red Linux normally installs a number of scripts that run tasks periodically. They
    run by the Linux **cron** service and are stored by default in the following directories:


    ```

    /etc/cron.hourly

    /etc/cron.daily

    /etc/cron.weekly

    /etc/cron.monthly

    ```


    I''ll show you how scripts in these directories are scheduled, lead you through
    two standard daily cron scripts, and show you how to run jobs on a one-time basis
    using the **at** daemon.


    # The cron scheduler


    By default, Red Linux runs a number of maintenance jobs in the middle of the night.
    These jobs are run by the Linux **cron** service, as configured through the /etc/crontab
    configuration file. Take a look at the default version of this file in **Figure
    5**.


    While the first commands may seem cryptic, they are straightforward. Just as you
    can set.x to a certain number in algebra, you can set variables to certain values.
    For example, the following command sets **bash** as the default **SHELL** variable:


    ```

    SHELL=/bin/bash

    ```'
