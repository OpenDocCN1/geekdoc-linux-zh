    # Quotas


    Quotas keep users from being selfish, disorganized, or sloppy. They can limit
    the space or number of files taken by any single user or group. Users who take
    up too much space can crowd other users, the space you have for data, or even
    the space you need to boot a Linux computer. If you configure home directories
    on a Linux computer and don''t have unlimited disk space, you''ll need to set
    quotas.


    You can limit the damage caused by any particular user by partitions, as discussed
    in Chapter 1, "Basic Linux Installation." Even if you''ve set up a separate partition
    for the /home directory, you''ll still have the potential of users who crowd others.
    Unfortunately, there is no GUI installed with Red Hat 9 that can help you configure
    quotas.


    The Red Linux quota RPM is installed by default. So all you need to do to set
    up and group quotas is to take the following steps:


    +   1. Set up the main Linux partition configuration file (/etc/fstab) to start
    quotas the next time you mount the desired directory.

    2. Remount the target directory so you can enable quotas without rebooting Linux.

    3. Set up the quota configuration file for users or groups.

    4. Create or modify the quota file for the mounted directory.

    5. Configure the quotas you''ve created for a set of users or groups.

    6. Modify the quota period as desired.

    7. Activate quotas with the quota command.


    Once you''ve configured quotas, you can use the quota and repquota commands to
    check on your users. In the following sections, I explain each step of the process
    in detail.

    The amount data you assign to each user depends on the space you have available
    on your hard drive, and what users you do in your business. If users are just
    creating office-suite files, they need considerably less space than they are creating
    3-D solid Computer-Aided Design models of airline galleys.


    # The boot process


    When you start Linux, it loads the kernel, basic startup files, and more. During
    this process, Linux mounts directories such as /boot and /home on specific partitions.
    The file /etc/fstab defines the way these directories are mounted.'
