    useradd command.**.


    +   3. Configure accounts for each computer on your network that will connect
    to your Samba-enabled Linux PDC. As described earlier, you can use the /usr/sbin/useradd
    command to set up a computer account in /etc/passwd and then use the following
    command to add it to the Samba database.


    ```

    smbpasswd -am computername

    ```


    ![](img/6ee4859e736a0839007ea9afb576c195_138_2.png)


    You can administer a Linux PDC remotely. If you''re on another Linux computer
    on the network, you can log in as user **mj** using the **ssh mj@pdc_computer**
    command. Because this is the secure shell, SSH communication is encrypted. If
    you''re on a Windows computer on the network, download the OpenSSH on Windows
    package from Network Simplicity at **www.networksimplicity.com/openssh** and then
    run the same **ssh** command.'
