  md: 'Chapter 1: Basic Linux Installation 1


    # # Chapter 1

    Basic Linux Installation


    In this book, I''ll cover the tools you need to create a File and Print server
    on a Linux computer. The first chapter helps you figure out what it will take
    to move your files to Linux. It explains file servers and Linux distributions,
    and illustrates the basic steps you need to set up your computer for Linux. Many
    Linux distributions are available, but this book focuses on Red Hat Linux.


    In this chapter we review the basic purposes of a file server, to help define
    what you really need. I also need to look at Linux distributions. Red Hat Linux
    is by the most popular Linux distribution and the one used in this book, a number
    of other options are available. I follow up with guidance on hardware; just like
    Windows 2000/XP/2003, Linux may not work with all of your hardware.


    Once you''ve identified the computer that you''re going to use, it''s best to
    plan ahead. You want to make sure Linux works with hardware, and that you have
    sufficient space on your hard drives. In Linux, filesystems and swap space are
    organized in hard-drive partitions. Once you''ve selected a partition configuration,
    you can prepare your hard drive. Finally, you can put this together with Chapter
    2, "Installing Linux as a File Server."


    The same Linux can be configured as a workstation or a server — you don''t have
    to download (or buy) different versions for each. As a server, Red Hat Linux includes
    a number of tools that you can configure Web servers, FTP, a firewall, and more.
    This book covers the tools you need to create a File and Print server on a Linux
    computer.


    # ## File server functions


    Before jumping into the wonderful world of Linux, it''s a good idea to take a
    step back. What are you going to do with Linux? This book is targeted at people
    who want to use Linux as a File and Print server. I cover configuring a print
    server in Chapter 7, "Configuring Printers."

    File servers are useful in ways:


    +   - Central storage for individuals: Many computer-savvy individuals have (or
    want) more than one computer, such as a desktop and a laptop. It''s often safest
    to save your files on one computer, to make sure that you have one version of
    each file, and to ease burdens when you back up your systems.


    +   - File sharing for workgroups: Groups need a central file server. When users
    work together on a project, it''s best if they work on the same version of a file.
    You should encourage the users in a workgroup to keep their individual files on
    a central server, so all you need to do for data security is to protect and back
    up the file server.


    +   - Organizations: Organizations may need more than one file server. It''s useful
    to have a larger organization as a collection of workgroups, organized into a
    Domain.'
