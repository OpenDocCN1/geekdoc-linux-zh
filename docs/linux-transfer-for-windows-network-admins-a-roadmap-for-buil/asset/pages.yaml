    This opens the Red Hat Printer Configurator window.


    +   Click New to open the "Add a new print queue" window.


    +   Click Forward to open the "Queue name" window. Enter a name and description
    appropriate for the desired network printer. Remember, you should limit printer
    names to 13 alphanumeric characters.


    +   Click Forward to open the "Queue type" window. Click the "Select a queue type"
    drop-down text box and then select Windows (SMB). If your Linux computer is properly
    connected to the network, the Red Hat Printer Configurator searches for available
    computers.


    +   Double-click the desired server. You should see the printers that have been
    shared from that server through Samba. Figure 19** illustrates my connection to
