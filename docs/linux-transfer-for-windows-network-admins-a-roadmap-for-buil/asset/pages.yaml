    Figure 7. The Hat Samba Server Configurator.


    Before you begin, back up the Samba configuration file, /etc/samba.conf. It includes
    some excellent comments that you can use to learn about a number of Samba variables.
    To configure a Samba server, it''s important to start by learning about a few
    basic variables:


    +   **Authentication Mode:** Corresponds to the Samba **security** variable. There
    are options: **share, server, and domain**. As it sounds, if you''re setting your
    Samba server as a Primary Domain Controller (PDC) on a Microsoft network, you''ll
    want to use this mode for:


    +   **share:** Supports shared directories on Workgroups common to Windows 9x;
    shared directories are protected only by passwords.


    > > ! Linux security is based on user names and passwords. If you set share-level
    security, you could compromise your system to anyone who learns a critical password.


    +   **user:** Requires a user name and password for access to shared directories
    on the server or Domain. Checks authentication against local databases. Appropriate
    for a member server on a peer-to-peer Workgroup—or a Domain controller. For example,
    if you''re configuring a computer as a PDC, you want remote users to use local
    user names and passwords as authoritative for the Domain.


    +   **server:** Requires a user name and password for access to shared directories
    on the server or Domain. Checks authentication against a database on a remote
    computer. If the connection to the remote computer is down, it reverts to **security
    = user**. Normally you wouldn''t use this option on a Domain.


    +   **domain:** Requires a user name and password for access to shared directories
    on the server or Domain. Checks authentication against a database on a remote
    Domain controller. If the connection to the remote computer is down, this reverts
    to **security = server**. Appropriate for a Linux member server or workstation
    client on a Domain. Not appropriate for a PDC, because you want a PDC to have
    the final say on user names and passwords on a Domain.'
