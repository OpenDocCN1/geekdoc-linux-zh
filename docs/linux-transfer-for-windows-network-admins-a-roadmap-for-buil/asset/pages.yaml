    # Setting up roaming profiles


    Roaming profiles allow users to get the same look and feel on their desktops regardless
    of which Windows 9x/ME workstation on a Domain they log in. Roaming profiles are
    stored on the PDC, and when enabled, are sent over the network to the workstation.
    Unfortunately, Windows 9x/ME roaming profiles are not interchangeable with those
    available for Windows NT/200/XP.


    Not all administrators will want to create roaming profiles, because they can
    get large. For example, the roaming profile on my Windows XP Professional workstation
    is nearly 300MB. It takes quite a while to transmit that one profile from my PDC
    to my Windows XP Pro workstation on my Ethernet network. Network performance suffers
    during this process.'
