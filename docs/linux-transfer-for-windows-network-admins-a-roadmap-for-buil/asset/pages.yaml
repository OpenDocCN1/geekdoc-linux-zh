- img_proc: true
  md: '# Chapter 9: System Backup 271


    +   - Writable CD media can store 650MB of data, which can contain all but the
    data files for many dedicated Red Hat Linux servers where the GUI is not installed.

    - Writable DVD media vary in size. They can contain 4.7GB to 17GB of data, which
    can be used to back up many Linux servers, including data files.

    - Tape drives are available in a variety of sizes. As of this writing, I’ve seen
    single tape drives that can contain up to 300GB of data.


    The media that you select depends on the money you have available, as well as
    your backup hardware. You also need to consider your specific environment. For
    example, if the only place where you can store your backups includes a number
    of magnetic fields (such as a factory or a market shop), you may want to stick
    with CDs or DVDs.


    # System backups


    There are a number of ways to back up larger file servers. The most direct way
    is to use thirdparty hardware to back up all the data on the server to some high-capacity
    media. You may also want to back up the hardware associated with your file server.
    This is possible courtesy of two different open-source projects: the High Availability
    Linux project and the Linux Virtual Server project.


    # Third-party hardware


    If the hardware you use, such as a CD or a DVD writer, is not enough, there are
    a number of third-party options available. For example, some systems can combine
    of writable CDs, DVDs, and tape drives to save the data from every computer on
    your network.

    A wide variety of hardware options are available. I use the data from **www.storagesearch.com**
    in my research. This site is published by Applied Computer Science, Ltd. of the
    United Kingdom. In addition to previously described, some of the backup hardware
    include:


    +   - FireWire: One common option is to back up personal computers to a portable
    highcapacity drive. This type of drive uses connections that correspond to the
    IEEE1394 standard, also known as iLink. This is essentially a high-speed SCSI
    connection, which is used to back up data at speeds of nearly 400 Mbps. Types
    of FireWire can write data to other media such as writable DVDs. (Linux support
    for FireWire as well as the alternative USB 2.0 devices is experimental as of
    this writing)

    - Removable hard drives: If you’ve configured a RAID 1 array of removable hard
    drives, you can remove one of the drives in the array and store that drive in
    secure remote location. Ifwait, If you’ve configured a RAID 1 array of removable
    hard drives, you can remove one of the drives in the array and store that drive
    in secure remote location. If you have a spare hard drive in the array, a RAID
    1 system automatically writes your data to that drive. You can then set up a new
    hard drive as a spare. Larger groups of removable hard drives are often configured
    as rack-mount storage.

    - Jukeboxes: These are “storage cabinets” that allow you to combine the data capacity
    of a group of media types, such as writable tape, DVDs, and CDs.'
