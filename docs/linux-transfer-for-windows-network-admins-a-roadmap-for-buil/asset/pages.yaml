  md: '274 Linux Transfer for Windows Network Admins


    # # cpio archives


    The cpio command can help you archive a group of files. The group can be in a
    single directory, or it can include all files with a single pattern of alphanumeric
    characters. The cpio command is as literal, because it copies (cp) from input
    to output.


    As described in Chapter 8, the find command lists files on your system, based
    on a search term. For example, the following command searches for all the files
    on your computer with a JPG extension.


    ```

    # find / -name *.jpg

    ```


    You can now use the cpio command to collect these files. The following command
    combines find and cpio. The output from the find command is "piped" as input to
    the cpio command. The pipe is the vertical line next to or under the backspace
    key on a standard U.S. keyboard.


    ```

    # find / -name *.jpg | cpio

    ```


    > Linux''s bash shell includes a number of characters that you can use to connect
    the input and output of different commands. The use of the following characters
    requires an understanding of standard input, standard output, and error: >, >>,
    |, 2>, < This topic is beyond the scope of this book. You can find out more in
    my other book, Mastering Red Linux 9.


    ![](img/6ee4859e736a0839007ea9afb576c195_294_0.png)


    But this command is not complete. You have input from the find command, but you
    need a place for the output. The following command sends that output (-o) to jpegs.cpio
    archive:


    ```

    # find / -name *.jpg | cpio -o > jpegs.cpio

    ```


    Alternatively, if you have a tape drive connected to your computer, you can send
    this output directly to that tape drive. Normally, the first tape drive on a Linux
    computer is associated with the /dev/st device file. Thus, you can archive all
    JPG files on your computer with the following command:


    ```

    # find / -name *.jpg | cpio -o > /dev/st0

    ```


    You could archive the files from /etc/samba directory to the floppy drive. The
    first floppy drive on a Linux computer is normally associated with the /dev/fd0
    device file. Thus, you can archive the files in your /etc/samba directory with
    the following command:


    ```

    # find /etc/samba | cpio -o > /dev/fd0

    ```


    The cpio command is substantially more complex; for more information, open the
    cpio manual from the command-line interface with the man cpio command.'
  merge: -1
