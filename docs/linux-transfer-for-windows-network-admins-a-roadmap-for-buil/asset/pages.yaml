  md: '# Appendix B: Sample Samba Configuration Files 297


    # ENCRYPTED PASSWORDS ARE THE DEFAULT FOR LINUX, WINDOWS 95 (WITH OSR2),

    # WINDOWS 98/ME, WINDOWS NT 4 WITH SP3 OR HIGHER, WINDOWS 2000/XP/2003

    encrypt passwords = yes

    smb password file = /etc/samba/smbpasswd


    # The following are needed to allow password changing from Windows to

    # update the Linux system password also.

    # Note: Use these with ''encrypt passwords'' and ''smb password file'' above.

    # NOTE2: You do not need to enable these to allow to change only

    # the encrypted SMB passwords. They allow the Unix password

    to be kept in sync with the SMB password.

    unix sync = yes

    passwd program = /usr/bin/passwd u

    passwd chat = *Newpassword* *\n*Retype*newpassword* \n*password*="*all*authentication=tokens=updated=successfully*


    # You can use PAM''s password control flag for Samba.

    # enabled, PAM will be used for password requests when requested

    # by a client instead of the group listed in pam program.

    # It would be possible to enable this without changing the passwd

    # chat parameter for most setups.

    pam password change = yes


    # Users can map to SMB User names

    # SUPPORTS DIFFERENT WINDOWS AND LINUX USER NAMES

    username map = /etc/samba/smbusers


    # This parameter will control whether or not Samba should obey PAM''s

    # account and session management directives. The default behavior is

    # to use PAM for clear text authentication and to ignore or any

    # account or session management. Note that Samba always ignores PAM

    # for authentication in the case of encrypted passwords = yes

    # obey pam restrictions = yes


    # Most people will find that this option gives better performance.

    # Speed.txt and the manual pages for details

    socket options = TCP_NODELAY RCBUF=8192_12 SNDBUF=8192


    # Configure remote list synchronization here

    # request announcement to, or browse list sync from:

    # a specific host or from / a local subnet (see below)

    # remote sync = 192.168.3.25 192.168.1.525

    # cause this to announce itself to local subnets

    # remote announce = 192.168.1.255 192.168.2.44

    # THIS SYNCHRONIZ THE BROWSE LIST FROM THE LOCAL COMPUTER WITH THE WINS SERVER

    # ON IP ADDRESS = 172.22.30.13

    remote announce = 172.22.30.13


    # Browser Options:

    # set local master to if you don''t want Samba to become a master

    # browse on your network. The normal election rules apply

    # THIS ASSUMES YOU HAVE A DIFFERENT BROWSER MASTER SUCH AS THE PDC

    local master = no


    # Wins Server - Tells the NMB components of Samba to be a Wins Client

    # Note: Samba can be either a Wins Server, or a Wins Client, but not both

    # THIS POINTS TO THE IP ADDRESS OF THE WINS SERVER

    wins server = 172.22.30.4'
