    # Conclusion


    While it''s not possible to become a seasoned Linux administrator from a book
    of this size, you will need to know how to use basic navigational and file-management
    commands. If you ever have rescue your system from a failure, you''ll never have
    access to a GUI and will need to know how to use the vi text editor.


    Once you''ve acquired basic command-line skills, you don''t need to stay in the
    office until the middle of the night to back up your computers. You can set scripts
    to perform these tasks automatically.


    If you have a problem booting Linux, you need to know something about the critical
    startup files: /etc/grub.conf, /etc/initab, and /etc/fstab. Errors in these files
    can make Linux unbootable.


    If you have an unbootable system, you can use the rescue floppy that you created
    during the installation process, or you can use the rescue mode available through
    the first Red Hat Linux installation CD.


    Finally, you can do a bit to manage more users. You can set password policies
    with the Red Hat User Manager. And if you ever have a problem with your Linux
    PDC, now you know what you would need to copy to a second computer that you might
    want to configure as a backup PDC.


