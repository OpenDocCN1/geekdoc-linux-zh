    # Text command connections to a network printer


    If you''re familiar with the MS-DOS net use command described in Chapter 6, you
    can also use to connect network printers to a local printer port. For example,
    the following command connects the printer known as winclass to the cosmic computer
    to the third parallel printer port:


    ```

    C:\net use lpt3:\cosmicwinclass

    ```


    One key difference here is that you''re not prompted for a printer driver. Thus,
    if you want to print to this Computer, you''ll have to print from programs that
    don''t need a separate printer driver. For example, some Computer-Aided Design
    programs print jobs in a suitable format for the output you configured in this
    chapter.


    ![](img/6ee4859e736a0839007ea9afb576c195_241_1.png)


    Once you set the command on a Windows/2000/XP computer, Windows tries to reconnect
    to the same printer port the next time you log in to that computer.


    The aforementioned MS-DOS command does not add the printer to the Printers folder
    on Microsoft operating systems that use Windows XP Professional.


    ![](img/6ee4859e736a0839007ea9afb576c195_241_2.png)


    You can change any configured printer to take advantage of a new port. The appropriate
    settings are in the properties page for the printer. Right-click the printer of
    your choice. Click Properties in the pop-up menu that appears. On Windows 9x/ME
    computers, click the Details tab. On Windows NT/2000/XP computers, click the Ports
    tab. You should easily see where you can make the changes.


    # Connecting to a Windows print server from a Windows client


    It''s easy to connect to a printer on a Windows print server from a Windows workstation—just
    as easy as connecting to a printer on a Windows print server from a Linux workstation.
    The exception is that you can install printer drivers for Windows clients on a
    Windows. For example, if you''re using a Windows 2000 Professional computer as
    a printer server, you can install printer drivers for Windows 9x/NT/2000 workstation
    computers. All you need to navigate to the properties page for the printer, and
    then select Additional Drivers on the Sharing tab. That''s enough easy.


    However, Microsoft does not make it easy if you have an older Microsoft operating
    system working as a print server. For example, it''s not easy to install Windows
    XP Professional print drivers on a Windows 2000 Professional print server.'
