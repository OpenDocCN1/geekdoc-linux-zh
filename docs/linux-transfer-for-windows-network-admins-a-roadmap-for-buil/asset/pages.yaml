  md: '> Whenever you edit a key configuration file as /etc/fstab, back it up first.
    You could save it on a floppy disk or to the /root directory. If you have problems
    booting in the future, restore your system using the rescue disk techniques described
    in Chapter 8, “Administration and Management.”


    Take a typical line from this file:


    ```

    LABEL=/home      /home      ext3      defaults 1 2

    ```


    This line defines how the /home directory is mounted on this computer—the third
    extended filesystem (ext3). Because this is not a about the inner workings of
    Linux, I’ll focus on the fourth column, which defines how the directory is mounted.


    If you did not set up the /home directory on a separate partition during the installation
    process (Chapter 1), you won''t see it in /etc/fstab.


    Generally, you won''t need to change what''s been configured in /etc/fstab. To
    configure quotas, all you need to add usquota or grpquota to the fourth column
    depending on whether you want to configure user or group quotas on that directory.


    For example, if you''re setting user and group quotas on the /home directory in
    /etc/fstab, change the applicable line to:


    ```

    LABEL=/home      /home      ext3      defaults,usquota,grpquota 1 2

    ```


    You may need to remove some spaces to make sure all the information associated
    with the /home remains on one line. Once you''ve edited and saved your /etc/fstab
    file, just remount the directory. For the example you''ll see the change with
    the home directory, the following command should work:


    ```

    # mount -o remount /home

    ```


    You can verify the result. When you run the mount command, you''ll see a list
    of mounted directories. For the aforementioned command, you''ll see something
    similar to the following part of the output:


    ```

    /dev/sd2 on /home type ext3 (rw,usquota,grpquota)

    ```


    This result shows the /home directory mounted on the second partition on the second
    SCSI hard drive. Your result depends on where you''ve configured /home. For more
    information on this naming convention, see Chapter 1, “Basic Linux Installation."


    # Configuring quota configuration files


    Before you configure a quota on Linux, you''ll need to set up a quota configuration
    file. A simple process. For example, to set up the user quota configuration file
    on the /home directory, run the following commands:'
