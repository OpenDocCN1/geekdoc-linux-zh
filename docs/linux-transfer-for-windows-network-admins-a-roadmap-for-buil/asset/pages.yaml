    # Configuring a firewall


    To understand how a firewall works, step back and take a brief look at Linux networking
    theory.


    The protocols with TCP/IP are like channels on a TV. When you set up a firewall,
    you''re blocking many (if not most) of these channels. For users, this is a form
    of censorship. For crackers who want to get into your system, it makes life a
    lot more difficult.


    When you set up a Linux computer on the network, the default language is known
    as TCP/IP. It happens to be the language that computers use over the Internet.
    It''s a large number of protocols, or rules for communication. Some examples of
    TCP/IP protocols are HTTP for Web pages, POP3 for e-mail, and FTP for file transfers.
    Conceptually, it''s like a big two-way set, with 65,536 ports that lock two-way
    channels. Unfortunately, crackers can try to break into your system on any of
    these channels.


    When you configure a firewall during the Red Hat installation process, you''ll
    see a screen similar to Figure **1**.


    As you see, there are three basic security levels associated with Red Hat firewalls:


    +   **High-security** firewall blocks incoming traffic to your network, except
    the traffic that comes from DNS servers. A DNS server is most used to translate
    domain names such as www.mommbears.com to IP addresses such as 192.168.0.33. You
    can still get data that you request from an outside network, such as Internet
    Web pages.


    +   **Medium**: A medium-security firewall blocks incoming traffic over the most
    commonly used TCP/IP channels—between 1 and 1023. It also blocks communication
    on NFS and remote GUI connections.


    +   **No firewall**: You can disable firewalls on the local computer. This is
    appropriate for a computer that''s inside a LAN that is already protected by a
    firewall.'
