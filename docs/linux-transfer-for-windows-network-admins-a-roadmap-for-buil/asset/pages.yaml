  md: '# Linux Transfer for Windows Network Admins


    With the latest versions of Linux, there are a few practical limits on the number
    of files, so quota limits for files are rare. (The current limit is encoded into
    the Linux kernel in the `/proc/sys/fs/file-max`.)


    A soft limit defines the maximum amount or number of files associated with this
    user. If there''s a grace period, the user will have to reduce the number of files
    and/or the space he she uses. The default grace period is seven days; I''ll describe
    how you can change this shortly.


    A hard limit applies if you set a grace period. After the grace period, Linux
    locks the account unless the user reduces the space and number of files below
    these limits.

    ''ve summarized each column in Table **7**.


    # Table 7. User quotas.


    | Column | Function |

    |---|---|

    | 1 | Filesystem, which defines the partition with the quota. The quotas you define
    apply to any directory mounted on that. |

    | 2 | Blocks the space currently taken by the user in the specified filesystem,
    which corresponds to kilobytes. For the example above, user **jkp** currently
    has 68KB of files in the /home directory. |

    | 3 | The first soft limit defines the space, in KB, that the user is allowed
    to store in the /home directory. |

