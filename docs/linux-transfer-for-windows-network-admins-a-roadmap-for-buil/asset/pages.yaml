    # Samba client packages


    All you need to connect to shared directories on a Microsoft Windows-based network
    are the samba-client and samba-common RPM packages. If you followed the installation
    instructions in Chapter 2, you''ve installed the System Tools package group, which
    includes these RPMs by default. You can make these packages installed by using
    the following:


