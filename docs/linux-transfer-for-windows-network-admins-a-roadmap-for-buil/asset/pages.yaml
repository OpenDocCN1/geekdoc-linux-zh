  md: 'You can learn the skills you need to become a sophisticated Linux administrator
    from the other books in the Linux Transfer series, or from another book by this
    author, Mastering Red Hat Linux 9, from Syb.


    As you go through the book, you''ll work as a Linux administrator. While Red Hat
    Linux GUI tools are much improved, you''ll be running a number of utilities from
    the command-line interface.


    In addition, the Linux community is eager to help. If you identify yourself as
    a Microsoft Windows administrator, I''ve found that Linux users will bend over
    backwards to help you set up Red Hat Linux, Red Hat also maintains a number of
    active mailing lists where you can find help for your particular needs. See www.redhat.com/mailing/listinfo.


    When you update Red Hat with the latest available software, what you may see somewhat
    different from what I illustrate in this book. As with Microsoft Windows Update,
    minor and even variations for installed software are a fact of life.


