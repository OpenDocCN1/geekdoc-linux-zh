  md: '# Chapter 5: Connecting Linux Workstations 143


    # # Linux login batch files


    On a Microsoft Windows workstation, you can set username.bat or login.bat files
    to connect shared directories automatically. You can set up the same functionality
    for users on Linux workstations.


    By default, when user logs into the Linux workstation, Linux runs startup files
    for that user. The name of the startup file depends on whether you''re logging
    in to the GUI or the command-line interface.


    # # GUI login batch setup


    You can set up commands that Linux runs when you log in to the GUI. From the GNOME
    desktop, click Main Menu | Preferences | More Preferences | Sessions. This opens
    the Sessions dialog, which starts the Sessions manager. Click the Startup Programs
    as shown in Figure 7.


    ![](img/6ee4859e736a0839007ea9afb576c195_163_0.png)


    **Figure 7.** Setting up startup programs.


    If you want to add a startup program, click Add. In the Add Startup Program dialog,
    enter the command of your choice in the Startup command box. As you can see from
    Figure 7, I set it up with the smount command described earlier. I''ve also added
    the password (voy4ager) to the command. If you''re configuring multiple startup
    commands, you can set up the command that runs first by giving it a higher order
    number.


    > NOTE The GUI Sessions manager won''t mount a directory unless you''ve added
    the password. You can do this with the "%" character in the example shown in Figure
    7, wayman''s password is voy4ager.


    Any commands you set up with the Sessions manager are saved in each user''s home
    directory. For example, if I run the Sessions manager as mj, the command I added
    saved in the /home/mj/.gnome2 directory, in the session-manual file.


    In Linux, files and directories with a period (.) in front are hidden. Thus, the
    .gnome2 directory is normally hidden from view.'
