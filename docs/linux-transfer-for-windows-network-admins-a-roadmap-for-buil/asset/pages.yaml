  md: 'You can set up two different databases of user name and passwords. In other
    words, you could use one user name to log in from a client on a Microsoft Windows
    network and a second user name to log in directly to a Linux computer. All you
    need to do is set up a database with the smbdaser command used in Chapter 4, "Setting
    Up Your File Server''s Users." Then you can activate the following command:


    +   - username map = /etc/samba/smbusers


    You can customize the Samba configuration file for different Linux and Unix computers
    on your network. The following command inserts the noted configuration. Any commands
    from the inserted file supersede any active commands earlier in the file.


    +   - include = /etc/samba/smb.conf.map


    As described before, the %n variable corresponds to the NetBIOS name of the remote
    computer. For example, if you want to use a custom configuration for a remote
    Linux computer named nowpops, you would insert a file named /etc/samba/smb.nowpops.

    The following parameter in the default Samba configuration file should not match.
    In other words, unless you use-OSR2 Windows 95 computers on your network, you''re
    using encrypted passwords. In that case, there is no need for Pluggable Authentication
    Module (PAM) restrictions; you can delete this command from your configuration
    file.


    +   - obey restrictions = yes


    You can regulate the speed of file transfer to and from your Samba server with
    the following command. The default is sufficient for most users; optimizing performance
    requires trial-and-error and is beyond the scope of this book.


    +   - socket options = TCP_NODELAY SO_RCBUF=8192 SO_SNDBUF=8192


    Linux computers are connected to more than one. If Samba is installed on such
