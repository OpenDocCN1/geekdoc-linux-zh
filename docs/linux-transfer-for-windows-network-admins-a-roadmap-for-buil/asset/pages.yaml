  md: '# Appendix B: Sample Samba Configuration Files 293


    ```

    # It should be possible to enable this without changing your passwd

    # pam password change = yes

    ```


    ```

    # Unix users can map to different SMB User Names

    # WITHOUT THIS COMMAND, WINDOWS USERS WOULD REQUIRE LINUX USNAMES

    username map = /etc/samba/smbusers

    ```


    ```

    # This parameter will control whether not Samba should obey PAM''s

    # account and session management directives. The default behavior is

    # use PAM for clear text authentication and to ignore any

    # account or session management. Note that Samba always ignores PAM

    # for authentication in the case of encrypt passwords = yes

    # obey pam restrictions = yes

    ```


    ```

    # Most people will find that option gives better performance.

    # Speed see.txt and the manual pages for details

    socket options = TCP_NODELAY SO_RCBUF=8192 SO_SNDBUF=8192

    ```


    ```

    # Browser Control Options:

    # set master to no if you don''t want Samba to become a master

    # browser on your network. The normal election rules apply

    # THIS SETS UP PC AS THE MASTER FOR THE LAN

    local master = yes

    ```


    ```

    # OS level determines the precedence of this server in master browser

    # elections. The default value should be reasonable

    # THE DEFAULT IS 20; STANDARD FOR AN NT PC = 32; MAX = 255

    os level = 63

    ```


    ```

    # Domain Master causes Samba to be the Domain Browser. This

    # allows Samba to collate lists between subnets. Don''t use this

    # if you already have a Windows dom controller controlling this job

    domain master = yes

    ```


    ```

    # Preferred Master causes Samba to force a local browser election on startup

    # and gives it a slightly higher chance of winning the election

    preferred master = yes

    ```


    ```

    # Enable this if you want Samba to be a domain server for

    # Windows95 workstations.

    # THIS COMMAND APPLIES FOR ALL WORKOPTIONS

    domain logins = yes

    ```


    ```

    # If you enable domain logins then you may want a per-machine and

    # per login script:

    # Run a specific login batch file per workstation (machine)

    login script = \tmp.bat

    # Run a specific login batch file per username.

    # THE LOCATION OF THESE SCRIPTS DESCEND ON THE [Netlogon] SHARE

    login script = \%bat

    ```


    ```

    # Where to store profiles for Win95 and WinNT

    # %L subsets for their netervis name, %U is username share below

    # WINDOWS 9X PROFILES ARE STORED IN USERS'' HOME DIRECTORIES:

    # WINDOW NT/2000/XP PROFILES ARE STORED IN THE /home/Profiles/$USER DIRECTORY;

    login path = \%LProfiles\%U

    login path = \%LProfiles\%M

    ```'
