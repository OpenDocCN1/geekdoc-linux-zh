    To understand where profiles are stored, read the commentary associated with the
    [profiles] tag in this section.


    If you want to set up WINS server on this computer, activate the following command.
    Just make sure that there is no more than one WINS server on the LAN. Naturally,
    you''ll need to substitute the active IP address of the server for w.x.y.z.


    +   * wins server = w.x.y.z


    Modern Microsoft operating systems and Linux with an active Samba server all be
    configured to access a WINS server. However, if you have a Linux client without
    the Samba software, you''ll need to activate the following command. Needless to
    say, this requires a configured WINS server on the network.


    +   * wins proxy = yes


    The computers on a network may not always make it into a WINS server database.
    If you have a DNS server and want to use it as a backup, change the following
    down to you:


    +   * dns proxy = no


    As described, one of the major issues associated with Samba is the difference
    in case-sensitivity between Linux and Microsoft Windows. By default, the case
    of file names is preserved. If you don''t like this, activate the following command:


    +   * preserve case = no


    A specific issue is what happens to older DOS 8.3-style file names such as DOCUME~1.DOC.
    By default, case is preserved. If you want to set a different case, activate this
    command:


    +   * short preserve case = no


    If you''ve activated one of the previous commands, you can set a default case
    variable for file names that are transferred. This command corresponds to the
    default; if you prefer, you change "lower" to "upper":


    +   * default case = lower


    Linux is naturally case-sensitive. Samba is not, as defined by the following command:


    +   * case sensitive = no


    If you set this variable to, file names such as Document.doc are considered different
    from document.doc.


    As you can see, you can define a broad range of Samba parameters for the global
    server. The following sections illustrate how to share directories and printers
    on a Samba server.'
