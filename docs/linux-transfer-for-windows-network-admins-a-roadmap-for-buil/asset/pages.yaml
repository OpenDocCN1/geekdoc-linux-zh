    # Viewing computers


    Just as you use the **smclient** command to view the computers on a Groupwork
    or a Domain from the Linux command-line interface, you can use the **net view**
    command to view computers from the MS-DOS prompt.


    > Sometimes when you run the **net** command from the DOS prompt, you may get
    an error message like "Access is denied." If your connections are sound, don''t
    let that discourage you. If you''ve just logged in to the computer, it may take
    a minute or two for the computers to find each other.


    ![](img/6ee4859e736a0839007ea9afb576c195_213_0.png)


    As you can see in **Figure 40**, the **net view** command returns a list of the
    current computers in your Groupwork or Domain. The **net view /domain:darkstar**
    command is somewhat counter-intuitive; it allows me to view the computers in my
    darkstar peer-to-peer Groupwork. The command would work just well as if **darkstar**
    were the name of a Domain.


