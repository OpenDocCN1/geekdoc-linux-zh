    them. If you have Linux user names and know their corresponding Microsoft user
    names, run the following command to match the two, and when prompted, enter the
    Microsoft user name''s password. You can also use the Samba Server Configurator
    to set up the map in Chapter 3, “Setting Up Your File System.”


    ```

    # smbadduser username:microsoftusername

    ```


    ![](img/6ee4859e736a0839007ea9afb576c195_138_1.png)


