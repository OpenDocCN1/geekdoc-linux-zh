  md: 'In cases, Linux backups involve a two-step process. First you need to create
    a file, such as an archive of the files or directory that you want to save. Then
    you can save the archive to media such as a tape drive or a writable CD.


    > No matter what method or media you use for backup, make sure you can restore
    it. The small amount of time spent testing your backup media can save you a lot
    of frustration down the road.


    # tar archives


    The tar command archives and records a group of files, usually the the contents
    of a directory. With the right switches, you can collect a group of files into
    single compressed archive. In that way, the tar command is analogous to the WinZip
    utilities associated with Microsoft Windows. Users can run the tar command to
    archive the files in their own directories. For example, if user waymon wanted
    to back up the files in his home directory to waymon.tar.gz, he could use the
    following command:


    ```

    $ tar cvzf waymon.tar.gz /home/waymon

    ```


    You may notice something a little strange with the tar command; it does not require
    a dash in the switches. There are several Linux commands that work like this;
    the tar command is the only one of type that I cover in this book.


    There are four switches associated with this particular command. It creates (e)
    the backup in the archived file (f), waymon.tar.gz. It runs the command in a verbose
    (v) way, which lists the files that are being collected in the archive. It compresses
    the result (z), which reduces the space taken by the archive.


    You may notice that tar archives are associated with two consecutive file extensions.
    The “tar” indicates that it was created by the tar command. The “.gz” is associated
    with a compressed file.


    Finally, it''s important to consider the absolute path to the directory that you
    want to archive. Absolute paths with the first forward slash, /, Linux reads starting
    as the level root directory (/). You can restore this archive from any location
    in the Linux directory tree; an archive created from an absolute path is automatically
    restores to the same location in the Linux directory hierarchy.


    Naturally you reverse the process. The following command restores from the compressed
    waymon.tar.gz archive:


    ```

    $ tar tkvf waymon.tar.gz

    ```


    This command lists (t) the files in the archive. It does not overwrite (k) any
    existing files. It works in verbose (v) mode so you watch as tar restores from
    your archive. It works from a compressed (z) archive, from the (f) file cited,
    waymon.tar.gz.


    The tar command is substantially more complex; for more information, open the
    tar manual from the command-line interface with the man tar command.'
  merge: -1
  pgno: 293
