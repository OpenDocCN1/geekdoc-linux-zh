  md: 'As strange as it sounds, the smb.conf file uses the workgroup variable to identify
    the Workgroup or the Domain.


    Because you''re working with a Domain-authentication database on a different computer,
    you''ll need to cite that with the following command:


    ```

    security = domain

    ```


    Then you need to tell Samba how to look for the PDC machine. You can specify its
    NetBIOS name or IP address. If you don''t know, you can set it up via a broadcast
    message by substituting an asterisk (*). My Windows PDC''s NetBIOS name is sugary.


    ```

    password server = sugary

    ```


    To ensure that users and groups from the Windows PDC do not interfere with your
    Linux computer, you should tell Samba how to configure Windows users and groups
    on your computer. The following commands, which are beyond the current capabilities
    of the Red Hat Samba Configurator, add a range of User IDs and Group IDs outside
    the range of normal Linux users and groups:


    ```

    # Set a new range of user and group IDs that do not interfere with the normal
    ID range for Linux users and groups.

    winbind uid = 5000-6000

    winbind gid = 5000-6000

    ```


    Because this is not a PDC, do not activate the following commands closely associated
    with a PDC:


    ```

    # domain master

    # domain logons

    ; login script

    ; login path

    ```


    To deactivate a command, precede it with a comment character (# or :).

    For other details command in the smb.conf file, see Chapter 3, "Setting Up Your
    Server File System." As noted in that chapter, save your changes and test the
    syntax with the testperf command.


