  md: '# Chapter 2: Installing Linux as a File Server


    # Checking installed services


    In Red Hat Linux, network services are activated with two directories. Major services
    are activated with scripts in the /etc/rc.d/init.d directory. Other network services
    can be found in the /etc/xinetd.d directory. From the command line, you can find
    the lists in these directories. Figure 11 illustrates how many services are installed.


    ```

    [root@localhost ~]# /etc/rc.d/init.d

    amacron firstbirth irda named ntpd sasld ssh

    apmd functions idn netsfs pcmia sendmail syslog

    atd gpm kctrate portmap single winbind

    autofs halt keytable random smb xfs

    count httpd kill nfsock radevices xineted

    cups iptables rhnd snmptrapd ybind

    [root@localhost ~]# /etc/xinetd.d

    chargen cups-ld daytime-up echo-up servers sgi_fam time-up

    charg-upd daytime rsync services time

    ```


    Figure 11. Many or not, this list is the rest of the installation selections on
    a Red Hat computer.


    Believe it or not, this list is mentioned earlier in this chapter. For example,
    even if you did not install the Web Server package group, the Apache script, httpd,
    was still installed.


    ![](img/6ee4859e736a0839007ea9afb576c195_73_0.png)


    > Red Hat often installs "extra" software. In earlier in this chapter, I chose
    to install Red Hat Linux with the default Server Configuration Tools package group.
    This group includes redhat-config-httpd, which is a GUI tool that configures Apache.
    Thus, Red Hat assumed I forgot to include the Apache Web server in the installation
    list and "conveniently" added that software to the operating system.


    Before you make a judgment on whether to install or deactivate a service, you
    might want to understand the services. I have listed the services from Figure
    11 in Table 3. This is not a complete list; it is based on the typical installation
    described earlier in this chapter. Be aware that some of the scripts and services
    in the network directories are located elsewhere. Do not deactivate any of the
    network-related services unless you know what you are doing.


    # Table 3. Service scripts in /etc/rc.d/init.d.


    | Script | Service | RPM package |

    |---|---|---|

    | anacron | Configures regular, scheduled, administrative jobs. Keep this installed.
    | apmd | Supports the one-time scheduling of a specific job, such as processing
    a large database in the middle of the night. You should keep this installed. |
    at |

    | autofs | Allows Linux to automatically mount partitions, CDs, and more. Must
    be installed |'
