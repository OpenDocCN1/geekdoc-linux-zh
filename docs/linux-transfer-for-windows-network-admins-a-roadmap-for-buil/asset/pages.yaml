  md: '# Chapter 8: Administration and Management 239


    mv

    In Linux, if you rename a file, you''re actually moving it from one file name
    to another. As a result, the Linux rename command is **mv**. For example, if you
    run the following command:


    ```

    # mv file1 file2

    ```


    the **mv** command creates file2, copies the contents of file1 into file2, and
    then deletes file1. The options for the mv command are similar to those for the
    **cp** command. I illustrate some examples in Table 4.


    **Table 4. mv command examples.**


    | Command | Explanation |

    | mv file1 file2 | Creates a new file named file2, copies the contents of file1
    into file2, and then deletes file1. |

    | mv file1 file2 file3 dir1 | Creates new files file1, file2, and file3 in the
    dir1 subdirectory, and then deletes file1, file2, and file3 in the current directory.
    |

    | mv -i file1 file2 | Copies the contents of file1 into file2. If file2 already
    exists, the **mv -f** command automatically overwrites it. Then file1 is deleted.
    |

    | mv -i file1 file2 | Copies the contents of file1 into file2. If file2 already
    exists, the **mv -i** command requests confirmation before overwriting it. Then
    file1 is deleted |


    rm

    To delete a file in Linux, you can use the **rm** command to remove it from your
    system. Like any delete command on a, it can be dangerous if not used properly.
    For example, if you want to delete all files starting with **a** in the current
    directory, you''d run the following command:


    ```

    # rm a*

    ```


    Once you''ve deleted a file in Linux, there is no "undelete" function to restore
    it. For example, Red Hat has configured so that the root user to confirm before
    deleting a file. For example, if you run the **rm*** as the root user, you''d
    get a message similar to:


    ```

    rm: remove regular file ''abcd''

    ```


    This happens because of the Linux concept of *aliases*, where one command is substituted
    for another. By default, Red Hat includes aliases for the root user in the standard
    Red Hat //.bashrc configuration:


    ```

    # User specific aliases and functions

    alias rm=''rm -i''

    alias cp=''cp -i''

    alias mv=''mv -i''

    ```


    If you''ve logged in as the root user, you might want to delete a group of files
    and directories with one command. For example, if you want to delete the files
    and directories in /tmp/orbit-tr directory, you could run the following command:'
