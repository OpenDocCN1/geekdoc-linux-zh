    # Special Windows 98 issues


    There are no basic problems with connecting Windows 98 computers to a peer-to-peer
    Workgroup or Domain with a centralized database of user names and passwords. Windows
    98 computers by default send passwords to the PDC in encrypted format. Naturally,
    Windows 98 includes drivers for more adapters than are available in the Windows
    95 CD.

    Otherwise, there are few significant differences between Windows 98 and the other
    16-bit Microsoft operating systems, at least with respect to network connections.
    Here are a couple of items that you might find:


    +   * When you install Windows 98 network properties Windows always includes a
    default "Dial-Up Adapter" even if you don''t have a telephone modem. Just be careful
    to configure the network card and not the modem.

    * If you want to clear text passwords (non-encrypted) passwords on your network.
    While I don''t recommend this procedure, it may be acceptable if your network
    is protected by a firewall. You can clear up text passwords on a Windows 98 computer
    by applying the Win98_PlainPassword.reg file described in Table 1 to your Windows
    98 registry.


    # Special Windows ME issues


    There are no basic problems with connecting Windows ME computers to a Workgroup
    or Domain. Windows ME computers normally transmit passwords in encrypted format.

