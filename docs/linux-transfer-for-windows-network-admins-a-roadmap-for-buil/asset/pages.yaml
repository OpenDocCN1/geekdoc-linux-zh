    # Profiles


    As described in Chapter 3, you can configure roaming profiles for Microsoft workstations.
    Profiles for Windows 9x/ME computers are different from Windows NT/2000/XP computers
    and are stored in different locations. While Windows 9x/ME profiles are stored
    in users'' home directories, Windows NT/2000/XP profiles are defined by the [Profiles]
    share and login path variable defined in smb.conf file.


    If you''re converting from a Microsoft-based PDC to a Linux-based PDC as defined
    in Chapter 4, you can copy roaming profile to the corresponding home directories.
    You can copy 9x/ME profiles directly to users'' home directories. For user mj,
    that''s /home/mj directory on the Linux PDC.


    ![](img/6ee4859e736a0839007ea9afb576c195_175_0.png)


    > One of the drawbacks of roaming profiles for Windows 9x/ME computers on a Linux
    PDC is that users can accidentally delete their profiles on their home directories.


    For Windows NT/2000/XP profiles, there are two variables. In Chapter 4, we defined
    the path variable in [Profiles] share as /home/profiles. We defined the login
    path variable as %\L\Profiles\%U, which means the profile is stored in the /home/mj
    directory.


    # Configuring the Microsoft workstation


    There are two basic types of Microsoft workstations. The first type is on the
    16-bit Microsoft operating systems: Windows 95, 98, and ME. The connections you
    make from those operating systems do not require a computer account on the PDC,
    because Windows 9x/ME computers are actually full members of a Domain. This does
    not change whether the PDC is on a Windows or a Linux computer.'
