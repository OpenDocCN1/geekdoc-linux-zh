    # Conclusion


    You can set up a Linux workstation in a Microsoft Windows-style Domain or Workgroup.
    While you use the GUI Nautilus tool or the text smbclient command to browse shared
    directories and printers, as an administrator you need to learn how to use text
    commands as you can set up logon scripts for individual users.


    When a Linux user logs in, Linux runs a different logon script depending on whether
    the user logs in from the text or graphical console. You can set up logon scripts
    by editing the hidden bash_profile file in each user’s home directory. You can
    set up GUI logon scripts with the Sessions manager in GNOME. Both require you
    to configure the smbmount commands with appropriate permissions for all users.


    You can also set up a Linux workstation in a peer-to-peer network. If you''re
    connecting to a share from a Windows 9x/ME computer, all you need the read-only
    or full-access password for that share. If you''re connecting to a share from
    a Windows NT/2000/XP or another Linux computer, you need an authorized user name
    and password from that target computer.


    In the next chapter, we''ll take a look at configuring a Microsoft Windows workstation
    at network with Linux servers.


    > Updates and corrections to this chapter can be found on Hentzenwerke’s Web site,
    www.hentzenwerke.com. Click “Catalog” and navigate to the page for this book.'
