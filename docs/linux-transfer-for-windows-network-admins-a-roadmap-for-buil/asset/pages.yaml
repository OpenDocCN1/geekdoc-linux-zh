    # Troubleshooting


    Whenever Samba starts, it''s recorded in the logs. Whenever something goes wrong
    with Samba, it''s recorded in the logs. Whenever another computer has connecting
    to a Samba server, it''s recorded in the logs. In Red Hat Linux, the Samba log
    files are stored in /var/log/samba directory.

    But looking before the logs, there''s the matter of syntax.


    # Samba syntax


    It''s easy to check the syntax of the Samba configuration file, smb.conf. All
    you need is testparm. If you have a problem with one of your variables, it should
    show up in the output. For example, if I misspelled in my smb.conf file, I might
    see the following:


    ```

