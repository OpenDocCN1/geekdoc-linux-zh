  md: '# Chapter 7: Configuring Printers 203


    ![](img/6ee4859e736a0839007ea9afb576c195_223_0.png)


    **Figure 2.** The Red Hat Printer Configuration utility.


    To install a local printer with the Printer Configuration tool, take the following
    steps:


    +   On the toolbar, click New. This opens the first page of the “Add a new queue”
    wizard.


    +   Click Forward to the “Queue name” page, where you''ll need to enter the following:

    * A printer name such as HPLaserj100. If you''re going to share a printer on a
    network, you should limit the name to 13 characters; otherwise, users on Windows
    9x/ME or Linux workstations won''t be able to read the full name of the printer.

    * A printer description, which is used for reference within the applicable configuration
    files. This comment is not shown or added to the list on a Microsoft Windows-based
    network.


    +   Enter the required information and click Forward to open the “Queue type”
    page shown in **Figure 3**.


    By default, the Printer Configuration tool looks at “Locally-connected” queue
    types. You should see available printer ports as:


    +   * /dev/lp0, which corresponds to the first standard printer port in the Microsoft
    world, this is known as LPT1:.

    * /dev/usb/lp0,, which corresponds to the first printer connected to a USB port.


    +   If you do not see your local printer in the list, click “Rescan devices.”
    If you have a special printer port, click “Custom device” to specify the file
    associated with your special printer port. This can be useful if the printers
    you''re planning to install haven''t arrived, but you want to configure the printer
    on the Linux server now.


    +   Select the port attached to your printer and click Forward to open the “Printer
    model” page shown in **Figure 4**, where you can select a printer manufacturer
    and model.'
