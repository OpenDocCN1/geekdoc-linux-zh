    To support Samba traffic with Microsoft Windows clients, you do need to enter
    the following line in the "Other ports" text box:


    ```

    135:udp,137:udp,138:udp,1512:udp,135:tcp,139:tcp,445:tcp,1512:tcp

    ```


    This allows lokit to set the firewall rules that you need to support Samba communication
    with clients outside your network. For more information on each of these port
    numbers, Table 2.


    # Table 2. Samba TCP/IP ports for configuring a firewall.


    | Port | Function |

    | --- | --- |

    | 135 | Remote Procedure Call (RPC) client mapper. Supports communication from
    clients. |

    | 137 | NetBIOS name service. Allows transmission of NetBIOS computer names. |

    | 138 | NetBIOS datagram service. For communication that doesn''t require a response.
    |

    | 139 | NetBIOS session service. Supports reliable data transmission. |

    | 445 | Supports Samba connections with Windows 2000/XP clients. |

    | 1512 | Allows communication with a WINS server. |


    For those of you know iptables, you can add these commands to your firewall configuration
    file to allow Samba communication through firewall (In Red Hat Linux, the default
    firewall configuration file is /etc/sysconfig/iptables):


    ```

    iptables -A RH-Lokkit-0-50-INPUT -p udp -m udp --dport 135 -j ACCEPT

    iptables -A RH-Lokkit-0-50-INPUT -p udp -m udp --dport 137 -j ACCEPT

    iptables -A RH-Lokkit-0-50-INPUT -p udp -m udp --dport 139 -j ACCEPT

    iptables -A RH-Lokkit-0-50-INPUT -p udp -m udp --dport 1512 -j ACCEPT

    iptables -A RH-Lokkit-0-50-INPUT -p tcp -m tcp --dport 135 --syn -j ACCEPT

    iptables -A RH-Lokkit-0-50-INPUT -p tcp -m tcp --dport 139 --syn -j ACCEPT

    iptables -A RH-Lokkit-0-50-INPUT -p tcp -m tcp --dport 445 --syn -j ACCEPT

    iptables -A RH-Lokkit-0-50-INPUT -p tcp -m tcp --dport 1512 --syn -j ACCEPT

    ```


    There is one more way to access Samba: by using the hosts allow and deny in the
    smb.conf configuration file. The default version of this command restricts access
    to networks with the following IP network addresses: 192.168.1.0 and 192.168.2.0,
    as well as the loopback address, 127.0.0.1, to access from the local computer.
    Here is the default version of this:


    ```

    ; hosts allow = 192.168.1.0 192.168.2.0 127.

    ```


