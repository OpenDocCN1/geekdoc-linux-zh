    Red Linux, this starts a command-line window, where you can enter regular commands,
    as well as commands that open various GUI utilities and applications.


    # The Red Hat Network


    The Red Hat Network (RHIN) provides a connection between your computer and update
    servers at rhn.redhat.com. it is conceptually similar to the Microsoft Windows
    Update utility, in that checks your system against the latest software associated
    with the operating system.


    Naturally, to connect to the RHN, you need a connection between your computer
    and the Internet. If your computer is on a LAN that''s already connected to the
    Internet, Red Hat should have already configured your computer during the installation
    process. RHN is different, because it provides updates for the full range of Linux
    software associated with the Red Hat distribution. For example, it supports regular
    updates of key applications such as the Evolution mail manager. However, the RHN
    also requires that you register your system.


    To start the registration process, open the Red Hat Network utility by clicking
    Main Menu | System Tools | Red Hat Network. The first time you run this, you should
    see the Red Hat Network configuration in Figure 7.


    ![](img/6ee4859e736a0839007ea9afb576c195_64_0.png)


