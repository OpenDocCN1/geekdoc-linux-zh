  md: '# Chapter 4: Setting Up Your File Server''s Users 123


    # Linux file ownership


    Permissions define what the user, the group, and every other user on your network
    can do with a file. You can change the identity of the user and the group that
    owns that file. The chown command transfers the ownership of a file from one user
    to another. Consider the case of a script on a shared directory. User mj and nc
    are both engineers working on the script. If you run the following command, user
    nc would get ownership of the script file:


    ```

    # chown nc /home/engineer/script

    ```


    This is shown by the following output:


    ```

    # ls -l /home/engineer

    --rw-r--r-- 1 nc project 46528 May 14 19:24

    ```


    Let''s say someone decides to reassign responsibility of the script from the project
    to the mfg group. You could set this with the following command:


    ```

    # chgrp mfg /home/engineer

    # ls -l /home/engineer

    --rw-r--r-- 1 nc mfg 46528 May 14 19:24

    ```


    # Limited support for Access Control Lists


    An Access Control List (ACL) is a Windows concept for user and group rights and
    permissions. The details go beyond the ownership and permissions associated with
    a standard Windows file. ACLs are beyond the scope of this book.

    Samba version 2.2.7, which is included with Red Linux 9, gets improved support
    for the Microsoft concept of ACLs. When you share files and directories from Windows
    workstations, you can set up Users and Domain groups with the rights and permissions
    you need—even if you''ve configured the PDC on a computer. You''ll see examples
    of how this works in Chapter 6, "Connecting Windows Workstations."


    ACLs specify the rights and permissions that users and groups in a Domain have
    over files and directories. As of this writing, you can set ACLs from Microsoft
    Windows workstations and Microsoft Domain members over a Red Linux PDC. However,
    you can''t set ACLs directly from a Red Linux PDC or Domain member server. I believe
    this situation will get soon changed with upcoming releases of Samba.


    # Linux groups


    Microsoft Windows includes, by default, a series of groups, such as backup operators,
    power users, and so on. Linux does not include these standard groups. Nevertheless,
    you can set up directories that are readable by only users in a specific, private
    group.


    # Red Linux''s private groups


    Red Linux organizes standard groups differently from Microsoft Windows, and for
    that matter, differently from most other distributions. Every user on a Red Linux
    computer belongs to its own private group. For example, if you''ve created a user
    named gecko,'
  merge: -1
