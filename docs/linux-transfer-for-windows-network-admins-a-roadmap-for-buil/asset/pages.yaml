  md: '# Chapter 1: Basic Linux Installation


    # Red Hat Linux


    Red Hat has released a number of different distributions, each aimed at a different
    band of customers, such as small users or large-scale enterprises. While the numbering
    systems are different and there are different functions, of the software in these
    Red Hat Linux distributions are, for the purposes of this book, identical.


    # Red Hat Linux 9


    As of writing, Red Hat Linux 9 is the latest distribution from Red Hat. There
    are actually two versions of this operating system: Personal and Professional.
    You can download the software and source code for Red Hat Linux 9 edition from
    ftp.redhat.com or one of the mirror sites listed at www.redhat.com/download/mirror.html.
    The installation software is freely available via very large ISO files, suitable
    for copying to throwable CDs.


    Alternatively, you can purchase the Personal or Professional editions, which come
    with limited amount of support as well as a subscription to the Red Network. The
    Professional edition includes more support as a multimedia CD.


    Another advantage of Red Hat Linux is that the Personal edition comes with various
    kernels customized for different CPUs, including two versions of the Symmetric
    Multiprocessing (SMP) kernel. In other words, you can install Red Hat Linux 9
    on computers with more than one CPU.


    # Red Hat Enterprise Linux


    Red Hat also includes several different distributions focused on the enterprise.
    These are designed for performance on larger (multi-CPU) computers on mission-critical
    systems. There are three basic versions of Red Hat Enterprise Linux:


    +   * Red Hat Enterprise Linux WS: This operating system is designed for workstations
    on networks with the other Red Hat Enterprise distributions and is designed for
    desktop computers with up to 32-bit or 64-bit CPUs.


    +   * Red Hat Enterprise Linux ES: This entry-level operating system is suited
    for larger networks, and is optimized for computers with up to two 32-bit or 64-bit
    CPUs but is


    +   * Red Hat Enterprise Linux AS: This Red Hat advanced operating system is optimized
    for larger servers with up to 32-bit or 64-bit CPUs and 16GB of RAM.


    Each of these offerings includes various levels of support from Red Hat.


    # United Linux


    United Linux is a consortium of four different Linux distributions attempting
    to create a viable competitor to Red Hat Linux (www.linux.com). They include SuSE,
    SCO, Turbolinol, and Connectiva. As so, their combined efforts are focused on
    the competition with SuSE Linux Enterprise 8.1. While Red Hat is currently the
    market leader, keep an eye on United Linux. One of its member companies, SuSE,
