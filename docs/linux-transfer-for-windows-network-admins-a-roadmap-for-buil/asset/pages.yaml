    to preparing your computer for Linux. I will explain the first steps of the installation
    process here, but I won''t cover actual software installation until Chapter 2,
    "Installing Linux as a File Server." When you install Linux, you should follow
    these basic steps:


    +   - Check your hardware. While I have never had any problems with basic components,
    not all hardware works with Linux. (For that matter, not all hardware works with
