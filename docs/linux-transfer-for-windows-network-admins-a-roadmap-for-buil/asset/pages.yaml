  md: '# About the Authors


    # Michael Jang


    Michael Jang (RHCE, LCP, MCSE) is currently a full-time writer, specializing in
    operating systems and networks. His experience with computers goes back to the
    days of jumbled punch cards. He has written a number of other books on Linux and
    Linux certification, including Mastering Red Hat Linux 9, Red Certified Engineer
    Study Guide, Linux+ Exam Cram, and Cair GNU/Linux Installation and Configuration
    Exam Cram. His other Linux books include Mastering Linux, Second Edition and Linux
    Networking Clearly Explained. He has also written or contributed to books on Microsoft
    operating systems, MCSE Guide to Microsoft Windows 98, Windows 98 Exam Prep, and
    Mastering Windows XP Professional, Second Edition.


    # Elizabeth Zinkann


    Elizabeth Zinkann is a logical Linux catalyst, a freelance technical editor, and
    an independent computer consultant. She was a contributing editor and review columnist
    for Sys Admin Magazine for 10 years. (Her most recent reviews have refuge at www.equillink.com.)
    Her articles have also appeared in Performance Computing, Linux Magazine, and
    Network Administrator magazines. As an independent computer consultant, she has
    built Linux servers, maintained Linux, Solaris, Macintosh, and Windows computers,
    programmed databases, and taught Linux, Unix, computer hardware basics, and Internet
    essentials. In a former life, she also programmed communications features, including
    ISDN, at AT&T Network Systems.'
