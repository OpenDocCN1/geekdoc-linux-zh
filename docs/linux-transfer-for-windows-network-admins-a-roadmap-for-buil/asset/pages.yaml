  md: '# Linux Transfer for Windows Network Admins


    # XFS


    The XFS filesystem was developed by Silicon Graphics (SGI) as an early journaling
    filesystem for SGI''s IRIX operating system. IRIX is a clone of Unix. Unlike Linux,
    IRIX is primarily used for computers with 64-bit processors. SGI has ported or
    adapted XFS for Linux. XFS has a number of advantages over ext3. The maximum file
    size is 9 x 4,500,000 times the size of the largest allowable ext3. If you find
    this to be too small, SGI plans to eliminate this limit in future releases of
    XFS. This filesystem is also well suited to high-bandwidth transfers.


    ![](img/6ee4859e736a0839007ea9afb576c195_32_0.png)


    Don''t confuse the XFS filesystem with the Linux X Font Server; use the same lowercase
    acronym: xfs.


    # Working with other filesystems


    Once you''ve connected Linux and Microsoft Windows computers in a network, file
    transfers between the two are nearly seamless. You need to watch out for several
    differences.


    +   - Linux file names are sensitive. For example, Linux Chapter1.doc as a different
    file from chapter1.doc.

    - Linux names don''t require specific extensions. For example, whether Linux executes
    a program as "program.exe" or "program" does not depend on the EXE extension,
    but on the permissions associated with the file.

    - If you have Linux and Microsoft Windows on the same computer, Linux can see
    the files in the Windows directories. However, Microsoft can''t see the files
    in the Linux partitions.


    > If you install Linux and Microsoft Windows on the same computer, don''t write
    any files to an NTFS partition from Linux. You could easily corrupt the data on
    the NTFS partition. This does not apply if you''re writing to an NTFS partition
    on a remote computer.


    For your reference, these filesystems are summarized in Table 4.


    # Table 4. Partitions for installing Linux on a small hard drive.


    | Filesystem format | Description |

    |---|---|n| ext2 | The second extended filesystem is an older Linux filesystem,
    in common use Red Hat Linux 7.2. |

    | ext3 | The third extended filesystem is now the developed Red Hat Linux filesystem;
    it''s essentially the same as ext2 but has a journal for quick recovery from sudden
    failures. |

    | reiserfs | The Reiser filesystem supports fast journaling, is faster because
    of its "balanced trees", and makes more efficient use of space. |

    | swap | Linux swap partition. A dedicated area on the hard drive for virtual
    memory. |

    | vfat | A common description of a Microsoft Windows FAT16 or FAT32 filesystem.
    (The difference is immaterial to Linux.) |'
