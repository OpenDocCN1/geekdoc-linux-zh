  md: '# # Chapter 5

    Connecting Linux Workstations


    The same Red Hat Linux that is making a name as a server can also be configured
    as a powerful desktop and workstation computer. Naturally, you can connect a Linux
    computer to a network of Microsoft Windows and Linux computers. In fact, configuring
    Linux as a workstation is a natural option for Windows users who want to try Linux
    for the first time.


    You don''t need to install every Samba package to connect a Linux computer as
    a workstation. You just need the Samba client packages to connect to the shared
    directories of your choice. But if you also want to share directories or printers
    from your Linux workstation, that will require running the Samba server package.


    One drawback to running a Linux workstation on a Microsoft Windows Domain is that
    you can''t log in to the local workstation using the Windows authentication database
    from Microsoft Windows or Linux PDC (You could use the Network Information System
    or the Lightweight Directory Assistance Protocol to set up a single authentication
    database; these technologies are beyond the scope of this book).


    However, once you''ve logged in to a Linux workstation, you can connect to shared
    directories on a Windows-based network. When you make the connection, you''ll
    enter a user name and password for the Domain or the member server. If the workstation
    is part of a Domain, the user name and password can also come from any user that''s
    a member of the Domain.


    You can set up the Domain name and password in Linux startup files. This way,
    users who log in to a Linux are automatically connected to shared directories
    and printers on the Domain. In this chapter, I''ll show you how to set this up
    for individual users.


    ![](img/6ee4859e736a0839007ea9afb576c195_155_0.png)


    > A number of books on Samba help you configure automatic connections through
    the /etc/fstab configuration file. I avoid this in this book, because you can''t
    use it over a network to customize mounted directories by users.


    The steps you take to connect to a shared directory or printer vary very slightly.
    At the end of this chapter, I''ll show you how to connect your Linux workstation
    to a PDC or a Domain member server on a Windows-based Domain. The steps vary depending
    on whether you''re connecting to share on a Windows or a Linux server.


    If you have problems connecting to a Samba server or PDC, there are a number of
    log files for every computer that connects. They may help. With the standard smb.conf
    file, there are individual log files for every detail in the /var/log/samba directory.
    I describe these files in some detail in Chapter 6, "Connecting Windows Workstations."
    The messages from these log files apply well to Linux workstations.


    Many of the commands described in this chapter require administrative or root
    user access. If you''ve logged in as a regular user (as you should), you can get
    root user access with the following command:'
