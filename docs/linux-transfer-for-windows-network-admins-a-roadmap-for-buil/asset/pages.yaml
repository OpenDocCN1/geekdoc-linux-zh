  md: '# Chapter 8: Administration and Management 245


    The final command runs script in the /etc/cron.monthly directory at 4:42 a.m.
    on the first day of each month:


    42 4 1 * * root run-parts /etc/cron.monthly


    As you can see, there is a definite pattern to each of these commands. The first
    five columns determine the time that cron runs the command. The administrative
    user, root, runs the run-parts command with the data as shown. In each case, the
    input to the run-parts command is a directory. Table 7 details the meaning of
    each of these columns, from left to right.


    # Table 7. /etc/crontab command columns.


    | Item | Description |

    | --- | --- |

    | Minute | Set this column between 0 and 59. If you substitute an asterisk, the
    command is run every minute. |

    | Hour | Set this column between 0 and 23, if you substitute an asterisk, the
    command is run every hour. |

    | Day | Set this to between 1 and 31. If you substitute an asterisk, the command
    is run every day. |

    | Month | Set this to the desired month, where 1 represents January and 12 represents
    December. If you substitute an asterisk, the command is run every month. |

    | Day of week | Set this to the desired day, where 0 represents Sunday and 6 represents
    Saturday. If you substitute an asterisk, the command is run every day of the week.
    |


    With Table 7 in mind, you can reschedule standard jobs or set up new jobs. One
    thing to keep in mind is that you can set a range; for example, if you set 1-5
    in the third column, the job is run daily from Monday through Friday.

    For example, if you configure /etc/cron.yearly directory, you could set it so
    cron runs the scripts in 30 minutes past midnight on January 1:


    30 0 1 * * root run-parts /etc/cron.yearly


    I''ve noticed on the fifth column, because the day of the week associated with
    January 1 changes from year to year.


