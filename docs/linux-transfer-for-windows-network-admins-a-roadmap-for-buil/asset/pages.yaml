  md: '# Chapter 3: Setting Up Your Server File System 89


    Some Samba RPM packages (not including the version associated with Red Hat Linux
    9) are installed with Secure Socket Layer (SSL) support. If you get SSL errors,
    activate the following command:


    ```

    ; ssl CA certFile = /usr/share/ssl/certs/ca-bundle.crt

    ```


    By definition, this file is part of the openssl RPM package for secure communication
    on a network. The following commands allow you to set the parameters for changing
    Samba- and Linux-related passwords. The first command maintains the same password
    for logins to Samba shares and the Linux computer. This assumes that you have
    the same user name for both databases.


    ```

    unix password sync = yes

    ```


    In Linux, /usr/bin/passwd username is the standard command for changing for a
    specific user. Samba substitutes the current user name for the %u.


    ```

    passwd program = /usr/bin/passwd %u

    ```


    The next line works at the command-line interface; the passwd chat responds with
    the wildcards of what you would see at the command-line interface. To understand
    how this works, you really need to break this command into four components:


    ```

    passwd chat = *password* %n\n*Retype*new*password* %n\n \*password: *all*authentication*tokens*updated*successfully*

    ```


    +   * The *new*password* command is a prompt for a password. The new password
    as typed is set as the type of %n.

    * The *Retype*new*password* command prompts again for a new password; the entry
    is checked against the value of %n.

    * The backslash (\ at the end of the first line links the two code lines. In Linux,
    the backslash is to "escape" the intent of the next character. In other words,
    when Samba reads this command, it returns the Return character and adds the second
    line to the end of the first.

    * Finally, the command on the second line works as a response—assuming the passwords
    that you typed matched. In Linux, the case of the password matters. In Samba,
    it may not. This is determined by three variables listed at the end of this section.


    The wildcards support flexibility, and can be included in entries in the SWAT
    Password menu showing the following command without effect on your Samba server:


    ```

    pam password change = yes

    ```'
