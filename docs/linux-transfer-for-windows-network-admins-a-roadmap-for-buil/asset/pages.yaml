    # 2. Planning partitions


    In Microsoft Windows, partitions seem easy. All you need is a single partition
    for all files, including a swap file. In contrast, Linux installations use multiple
    partitions, which results in a more efficient use of space. One key to this is
    the Linux swap partition.


    While Windows associates drives with partitions, Linux associates (or "mounts,"
    in Linux-speak) specific directories on different partitions. Each Linux directory
    includes specific types of files, based on the Filesystem Hierarchy Standard (FHS).
    Not all Linux directories are suitable for mounting; I explain this in detail
    later in the "Understanding the Filesystem Hierarchy Standard".


    But before I explain the FHS, I need to explain the standards for naming partition
    devices.


    # Linux partition names


    Before you can up a Linux partition, you need to know something about how the
    partitions are organized and named. There are four alphanumeric characters associated
    with each hard disk partition. If it''s an IDE hard disk, the first two letters
    are hd. If it''s on a SCSI hard disk, those letters are sd.


    The third letter depends on the location of the hard disk. If it''s an IDE hard
    disk, it depends on the position relative to the ATAPI controllers. For example,
    if it''s the master on the primary controller, the third letter is a; if it''s
    the slave on that controller, it is b; and so on.

    The fourth character is a number that depends on the type of partition. If it''s
    a SCSI hard drive, if it''s a CD or DVD player on an IDE or SCSI interface, that''s
    it—because there are no partitions on CD or DVD drives. You can configure three
    different types of partitions on a hard disk:


    +   * Primary partition: You can configure up to four different partitions on
    a hard drive. The partition with your boot files should be located on the active
    partition. Thus, if you have a primary partition, the fourth character in your
    Linux partition name is 1, 2, 3, or 4. The primary partitions on the first IDE
    hard drive are hda1, hda2, hda3, or hda4.

    * Extended partition: If you can''t store more partitions than four hard drive,
    you''ll need an extended partition. You can further subdivide it into logical
    partitions. If you use the normal Red Hat installation program, an extended partition
    always has a fourth character of 4. For ex,ample, the extended partition on the
    second SCSI hard drive is labeled sdb4.

    * Logical partition: You can subdivide the space in an extended partition into
    multiple logical partitions. The logical partitions that you create have a fourth
    character of 5 and above.


    To make sure you understand this system, read Table 2. It includes several examples
    of partition device names.'
