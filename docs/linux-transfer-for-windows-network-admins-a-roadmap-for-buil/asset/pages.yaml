  md: '# Chapter 8: Administration and Management 229


    # Chapter 8

    Administration and Management


    Linux is a sophisticated operating system with the capabilities of Windows 2003
    Server and the flexibility of the Microsoft desktop operating systems. If you
    want to take full advantage of what Linux can do, you need to administer and manage
    Linux from the command-line interface. While I can''t turn you into an RHCE-quality
    administrator in one chapter, I can provide some of the basic survival skills
    that you need to manage your Linux systems.


    The Red Hat Certified Engineer (RHCE) exam is the elite Linux certification exam.
    It tests your mastery of Red Hat Linux in real-life situations. On this exam,
    you have a limited amount of time to install, configure, and troubleshoot Red
    Linux.


    In this chapter, we''ll work entirely from the command-line interface. I will
    show you how to move around and perform some basic tasks in the default Linux
    command-line shell, which is called bash. In addition, I will give you a brief
    introduction to the vi editor, which may be the only command-line editor available
    if your system does not boot normally.


    When you install Red Hat Linux on your computer, you''re also installing a group
    of scripts that automate administrative tasks. I''ll analyze two of them to help
    you learn to create your own scripts.


    With these tools at hand, I will show you how to manage four key administrative
    tasks. First, I''ll help you set up a central server for Red Hat installation
    files. Next, I will show you how to work with two key files associated with the
    Red Hat Linux boot process, etc/initab and etc/fstab. I will guide you on the
    use of the Red Hat Linux disk system, which can be a lifesaver if "some other"
    administrator accidentally tinkers too much with a key configuration file. Finally,
    I''ll show you how to set up password policies for your users and synchronize
    password databases.


    This chapter includes the most basic survival skills. As you expand your Linux
    horizons, I recommend that you read a more general book such as Mastering Red
    Hat Linux 9, written by this author, from Syex.


    > Remember, Linux is case-sensitive. For example, in Linux, the smb.conf file
    is different from the Smb.conf or smb.Conf files.


    # Shells


    A shell is a command interpreter that takes what you type in the command-line
    interface and passes it to the Linux operating system. Commands that you run in
    the shell allow you to do considerably more than any GUI tool available on/a Linux
    or Microsoft operating system.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# 230 Linux Transfer for Windows Network Admins


    Commands that you type in the shell execute faster because they don''t have the
    “overhead” associated with the GUI.


    The default when you install Red Hat bash is bash, which is short for the Bourne
    Again Shell. It''s essentially the next generation of the original command-line
    interpreter written by Stephen Bourne for AT&T''s original versions of Unix. A
    number of alternative shells are available, but those details are beyond the scope
    of this book.


    There are a good number of books on various shells and commands, such as Introduction
    to Unix and Linux by John Muster, and Teach Yourself Shell Programming in 24 Hours
    by Sriranga Veeraraghavan.


    ![](img/6ee4859e736a0839007ea9afb576c195_250_0.png)


    In this section, I''ll show you a few hundreds of basic commands that you can
    use in bash to navigate around your filesystem, manage the files you use, and
    edit configuration files in the visual editor, more commonly known as vi.


    # Basic navigational commands


    Getting around the shell means knowing how to view and navigate the files and
    directories in your Linux computer. There are three key commands for navigating
    directories with the shell: **pwd**, **cd**, and **ls**. Before I begin, let''s
    review the structure of Linux systems.


    # The Linux directory structure


    Linux files and directories are organized in the Filesystem Hierarchy, which is
    described in detail in Chapter 1, “Basic Installation.” To summarize, you can
    list the basic directories under the top-root (/) directory, as shown in Figure
    1.


    ```

