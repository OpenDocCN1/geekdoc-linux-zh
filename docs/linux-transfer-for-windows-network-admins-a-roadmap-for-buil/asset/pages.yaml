    I described the locate command earlier in this chapter as one that finds files
    quickly because it searches through an existing database of files. Well, by default,
    Red Hat Linux regenerates the database daily, courtesy of the locate.cron script
    in the /etc/cron.daily directory.


    This script is a bit more complex; it includes three lines. You''ll recognize
    the first line from the locate.cron script as one that sets this script to use
    the bash shell:


    ```

