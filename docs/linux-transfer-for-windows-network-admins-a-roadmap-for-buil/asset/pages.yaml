    You''ll also need to create the pguest user with a command such as useradd, which
    I describe in Chapter 4,"Setting Up Your File Server''s." One use for this type
    of guest account might be a directory of public information.


    When I have problems with Samba, the first place I look is in the log files. By
    default, the following command configures a separate log file for each client
    computer that connects to your Samba server:


    ```

    log file = /var/log/samba/%m.log

    ```


    %m is a variable that is associated with the client "machine name." In Samba,
    this corresponds to the NetBIOS name of the client computer. For example, one
    of my computers has a NetBIOS name of Sstephen, Samba creates a connection log
    file named ststephen.log in /var/log/samba/directory.


    If you have big log files, you may want to limit the amount of data in each file.
    The default shows there is no limit, the default limit is 5000KB.


    ```

    max log size = 0

    ```


    ![](img/6ee4859e736a0839007ea9afb576c195_107_0.png)


    Log file limits generally are not needed in Red Hat Linux. By default, log files
    are rotated every week. The old log file is saved with a numeric extension such
    as .1, .2, .3, and .4, for up to four weeks of archived logs.


    Earlier in this chapter, I covered the possible values for the security variable.
    Just to remind you, the options are share, user, server, and domain:


    ```

    security = user

    ```'
