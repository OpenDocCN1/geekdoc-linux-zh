  md: '# Chapter 3: Setting Up Your Server File System 101


    The final two commands in stanza are identical to those in the [printers] stanza,
    which allows the valid user to use this printer:


    ```

    writable = no

    printable = yes

    ```


    # A private directory


    Users on your computer have their own private directories—their home directory.
    Many distributions other than Red Linux organize users as part of the users group.
    In that case, other users can see and read the files in all /home directories.


    In that case, special commands are required to give user fred a private directory.
    For example, you can activate the following commands to set up a private directory
    that is visible and accessible only to fred:


    ```

    comment = Fred''s Service

    path = /usr/somewhere/private

    valid users = fred

    public = no

    tritable = yes

    printable = yes

    ```


    For these commands to work, you need to create the directory specified by the
    path variable. You need to set fred as the user and group owner of the /usr/somewhere/private
    directory.


    # Directories by client


    As the [homes] share directories by user, you can set special directories based
    on the NetBIOS name of the client computers on your network. For example, one
    of my computers has a NetBIOS name of StStephen, so I set up a home directory
    for /home/stephen. I modified the path from the default Samba configuration file,
    and configured NetBIOS client directories in the following stanza:


    ```

    comment = PC Directories

    path = /home/%m

    public = no

    tritable = yes

    ```


    Remember, the %m corresponds to the NetBIOS name of a computer. Thus, the /home/stephen
    directory is visible only to users who log in to their Samba server from the StStephen
    computer.


    When you create the specific directory, you will need to make accessible to all
    users. Otherwise, users may not be able to write to that particular NetBIOS-specific
    directory. As described in Chapter 4, “Setting Up Your File Server’s Users,” you
    can do that with the following command from the command-line interface:


    ```

    chmod 777 /home/stephen

    ```'
