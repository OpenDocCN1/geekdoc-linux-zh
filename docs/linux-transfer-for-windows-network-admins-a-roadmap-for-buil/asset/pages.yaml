    # Creating a Windows 95/98/ME Workgroup share


    If you''re setting up a peer-to-peer Workgroup, the steps you''ll take to share
    a directory from Microsoft Windows 95/98/ME workstation are slightly different.
    The main difference is that peer-to-peer Windows Groups use only passwords. User
    names are not required to connect to a shared directory from these 16-bit operating
    systems.


    To include a Linux computer as a Samba server on a Windows Workgroup, you''ll
    need to change the following variable in the /etc/samba/smb.conf configuration
    file:


    ```

    security = share

    ```


    Naturally, you''ll need to change other variables, such as making sure that the
    workgroup variable is the name of the peer-to-peer Workgroup instead of a Domain.
    Describe the differences in more detail in Chapter 5, "Connecting Linux Workstations."


    Creating a peer-to-peer share on a Windows 9x/ME directory is fairly straightforward.
    Open Windows Explorer by clicking Start | Select the directory you want to share.
    In the pop-up menu that appears, click Sharing. This should open a Properties
    window named for the directory you''re sharing, similar to Figure 13.


    ![](img/6ee4859e736a0839007ea9afb576c195_187_0.png)


    > If don''t see Sharing in a pop-up menu when you right-click a folder, click
    Properties. If you can share a directory, click the Sharing tab. If you don''t
    see a Sharing tab, you need to configure networking as described earlier in this
    chapter.


    You can set different passwords to share files from the folder. One password would
    support read-only sharing; a second password would support full-control shares,
    where connecting users have full control over the files and directories. If you
    set up both types of shares, you must use different passwords.'
