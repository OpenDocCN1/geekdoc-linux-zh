  md: '# server string is the equivalent of the NT Description field

    server string = PDC - from a Samba Server


    # if you want to automatically load your printer list rather

    # setting them up individually then you''ll need this

    printcap name = /etc/printcap

    lospinters = yes


    # It should not be necessary to spell out the print system type unless

    # yours is non-standard. Currently supported print systems includes:

    bsd, syev, plp, lprng, hpxux, qnx, cups

    CUPS IS THE DEFAULT FOR RED HAT LINUX 90

    CUPS = cups


    # Uncomment this if you want a guest account, you must add this to /etc/passwd

    # otherwise the user "nobody" is used

    guest account = pcogest


    # THIS COMMAND ADDS COMPUTER ACCOUNTS FOR LINUX AND WINDOWS NT2000/XP CLIENTS

    # TO BE A PART OF THE DOMAIN; NOT REQUIRED FOR WINDOWS 9X/ME CLIENTS

    add user script = /usr/bin/useradd -d /dev/null -g 100 -s /bin/false -M %u


    # this tells Samba to use a log file for each machine

    # that connects to this Samba server

    # THIS CAN HELP CONNECTION PROBLEMS FROM A SPECIFIC COMPUTER

    log file = /var/log/samba/sm.log


    # A capping on the size of the log files (in Kb).

    # A MAX OF 0 CORRESPONDS TO NO LIMIT

    max size = 0


    # Security mode. Most people will use user level security. See.

    # security.txt for details.

    # THIS IS REQUIRED FOR A PDC; MEMBER SER REQUIRE security = domain

    user security = yes


    # You may use password encryption. Please read

    # ENCRYPTION.txt, Win5txt and Win6txt in the Samba documentation.

    # Do not enable this option unless you want read those documents

    # ENCRYPTED PASSWORDS ARE THE DEFAULT FOR LINUX, WINDOWS 95 (WITH OSR2),

    # WINDOWS 98/ME, WINDOWS 2000/XP/2003

    encrypt passwords = yes

    smb password file = /etc/samba/smpasswd


    # The following are allowed to allow password changing from Windows to

    # update the Linux system password also.

    # NOTE: Use these may not "encrypt" passwords and allow workstations to change
    only

    # the ENCRYPTED smpasswd. They allow the Unix password

    to be in sync with the Samba password.

    unix password = yes

    passwd program = /usr/bin/passwd %u

    passwd chat = *Newpassword* *retype*password* *n

    *password:*all*authentication*tokens*updated*successfully*


    # You can use PAM''s password change control for Samba. If

    # enabled, PAM will be used for password changes when requested

    # by an smb client indent of the program listed in password program.'
  merge: -1
