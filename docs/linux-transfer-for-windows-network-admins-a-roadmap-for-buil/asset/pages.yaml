  md: '> Some of the commands in this chapter will seem familiar. In fact, MS-DOS
    and Linux commands have similar roots in older versions of Unix.


    # pwd


    The pwd command is straightforward; it gives the location of your present working
    directory. Open a command-line interface and type the command:


    ```

    $ pwd

    /home/mj

    ```


    The output shows that you''re currently working in the /home/mj directory, which
    is the home directory for user mj.


    # cd


    Now that you know where are, you can navigate to the Linux directory of your choice.
    The standard way to move between directories in Linux is with the cd command.
    If you''re familiar with MS-DOS, you''ll recognize this as the "change directory"
    command.


    To understand how cd works, you need to understand two concepts: absolute and
    relative paths. An absolute path starts with the top-level root directory/. It
    doesn''t matter where you start; you can run a command with an absolute path from
    any directory. You''ll always get the same result. For example, if you want to
    navigate to the /etc/samba directory with the Samba configuration files using
    an absolute path, you''d run the following command:


    ```

    $ cd /etc/samba

    ```


    The relative path starts without the first slash. If you run a command with a
    relative path, the result depends on your present working directory. For example,
    the following series of commands work only if you have a /home/mj/etc/samba directory:


    ```

    $ pwd

    /home/mj

    $ cd etc/samba

    $ pwd

    /home/mj/etc/samba

    ```


    There are three important shortcuts associated with the cd command. For example,
    you can move up one level in the directory tree with the cd .. command. One example
    of how this works:


    ```

    $ pwd

    /home/mj

    $ cd ..

    $ pwd

    /home

    ```'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Chapter 8: Administration and Management 233


    Note that the cd .. command does not work in Linux unless there is a space between
    the cd and the two dots (..).


    If, for some reason, do not remember the location of your home directory, the
    tilde (~) can help. For example, any user in the /etc/samba directory can navigate
    to his or her home directory using the cd ~.


    The tilde is useful for Linux scripts and programs. For example, you can set up
    a script that collects file names from users'' home directories using the ls ~.


    # ls


    The ls command can do a lot more than just list files in a directory. With the
    right switches, you can list hidden files; list files with size and revision times;
    list files on the last access time; and The ls command by itself is simple. It
    lists just the non-hidden files in the current directory. For example, the following
    command lists files in the current directory in a "long listing" format. This
    is the version of ls''s most closely related to the Microsoft dir command. As
