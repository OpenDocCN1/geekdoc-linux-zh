    # Peer-to-peer Workgroups


    Not all networks are configured in a Domain. In a peer-to-peer Workgroup, all
    computers can be configured as workstations and servers. Just as there is no central
    server, there is no central database of user names and passwords, and therefore
    no need for the windbind daemon.

    All you need to participate in a Workgroup is a list of the other computers in
    that Workgroup. If you don''t want to share directories or printers, you don''t
    need to set up the Samba server on your Linux workstation. Use the smbclient and
    smmbient commands described earlier.


    While share mode does not require a user account, it requires a password. If you''re
    connecting to a shared directory from a Windows 2000/XP or a Linux workstation,
    you''ll also need a valid user name on the server. However, if you''re connecting
    to a shared directory from a Windows 9x/ME computer, you just need the read-only
    or full-access password for the share.


    ![](img/6ee4859e736a0839007ea9afb576c195_167_0.png)


    > As of this writing, the GUI Nautilus only supports browsing from a Linux member
    server or PDC on a Domain. It does not work when started from a workstation in
    a peer-to-peer Workgroup.


    For example, a user named polk has logged in to a Linux workstation. That user
    can find a list of shared directories on the Windows 9x/ME Workgroup named reuben
    by using the smbclient client. He does not need a specific password when viewing
    shared directories and computers on a peer-to-peer Workgroup, as shown in Figure
    11.'
