  md: 'That’s it! You’re now connected from a Linux workstation to a printer that’s
    connected to a Microsoft Windows print server.


    # Conclusion


    Shared directories and printers have always gone together in a File and Print
    server. Just as you can share directories and printers from Windows servers, you
    can do the same from a Linux computer configured with Samba.


    Red Hat Linux includes two different services that you can use to install a printer:
    CUPS and LPD. CUPS is the default for Red Hat Linux 9. Red Hat Linux allows you
    to switch between these services by using the Red Hat Printer System Switcher.
    Red Hat Linux includes two different GUI tools that you can use to configure a
    printer on the local computer: the Red Printer Configurator and the CUPS Web-based
    tool.


    If you want to install a printer on Linux print server to share over your Domain
    or Workgroup, you should set up that printer without a Linux print driver. Both
    GUI tools include a “Raw” print queue option, which installs that printer locally
    without a driver. When you need to connect to that printer from a remote client,
    you can install the correct print driver directly on that client.


    Finally, this chapter illustrated how to connect to Linux and Windows print servers
    from Linux and Windows client workstations on the network.


    > Updates and corrections to this chapter can be found on Hentzenwerke’s Web site,
    www.hentzenwerke.com. Click “Catalog” and navigate to the page for this book.'
