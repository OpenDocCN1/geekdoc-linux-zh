    If you''ve set up Linux in the GUI, the function commands configure set text terminals.
    You can switch between these terminals with the Ctrl-Alt-F command, where x is
    a number between 1 and 6. A text-mode terminal is known as a getty.


    ```

    # Run getty in standard runlevel

    1:2345:respawn:/sbin/mingettytty1

    2:2345:respawn:/sbin/mingettytty2

    3:2345:respawn:/sbin/mingettytty3

    4:2345:respawn:/sbin/mingettytty4

    5:2345:respawn:/sbin/mingettytty5

    6:2345:respawn:/sbin/mingettytty6

