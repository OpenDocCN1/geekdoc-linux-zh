    The standard tool for adding and deleting partitions in Linux is fdisk. The Microsoft
    version of this utility, FDISK.EXE, can be used to create more than one partition.
    Because Red Disk includes the Druid tool, it is no longer necessary to use fdisk
    to prepare partitions for installation.


    The Linux disk utility can manage more than 100 different types of partitions,
    including various Microsoft, Novell, and of course, Linux types. Before I show
    you an example of how'
