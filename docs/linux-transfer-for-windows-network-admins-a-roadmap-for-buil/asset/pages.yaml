    # 4. Selecting a filesystem format


    Just as Microsoft partitions may be formatted to the FAT16, FAT32, or NTFS systems,
    Linux includes its own filesystem formats. One primary advantage is efficiency;
    unlike Microsoft filesystems, Linux filesystems can work well when very little
    space is available on a partition. For example, I''ve run Linux partitions that
    were nearly 99 percent full with no loss of speed.


    You can use a number of formats on a Linux system; I cover four of them. Two of
    them, ReiserFS and XFS, were introduced with kernel version 2.4 and are fairly
    new.


    # Linux extended filesystems


    Two major extended filesystems are most commonly used today: the second and third
    extended filesystems, which are ext2 and ext3, While the current default for Red
    Hat is ext3, it is fully compatible with the older versions of Linux, ext2.


    The only difference is that ext3 includes a journal, which speeds recovery from
    a problem such as a power failure. In this way, ext3 is functionally similar to
    Microsoft''s NTFS3, first introduced for Windows 2000. It''s easy to convert partitions
    between ext2 and ext3. Therefore, ext3 is appropriate for later versions of Red
    Hat Linux because it allows you to use legacy data on ext2 partitions.


    One major problem with the ext2 and ext3 formats is that file sizes are limited
    to 2GB. This can be a problem for very large databases or the log files associated
    with the largest online merchants.


    # ReiserFS


    The ReiserFS filesystem includes fast journaling. In other words, the time it
    takes to recover from a problem such as sudden power failure is less than you
    might experience for an ext3formatted partition. ReiserFS is based on a concept
    called "balanced trees," which enhances performance if most of your files are
    very small and very large. It is also space efficient, because it can store more
    than one file per disk block. It is sponsored by the U.S Defense Advanced Research
    Projects Agency, which is a testament to its reliability. For more information
    on ReiserFS, see www.namesys.com.


    One additional advantage is that you can increase the size of a ReiserFS filesystem
    dynamically, up to the current size of the partition.'
