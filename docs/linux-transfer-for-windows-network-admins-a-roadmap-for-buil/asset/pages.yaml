    show you what you need to configure to make a Linux computer with Samba work as
    a member server or a Primary Domain Controller (PDC) on a Microsoft Windows-based
    network.


    Linux and Unix computers can share files and printers with each other. Microsoft
    Windows computers can share files and printers with each other. Unfortunately,
    the network file systems native to each operating system are not compatible. That
    is the essential reason behind Samba, which allows Linux computers to understand
    the language of the Microsoft Windows network file system.


    This chapter focuses on the details of configuring a Linux system as a File and
    Print server on a Microsoft network. Because the file systems are different, I
    start this chapter by taking a look at the fundamentals of networking between
    Microsoft Windows computers, to define the different concepts of Workgroups and
    Domains.


    Alternatively, you can set up the 32-bit Microsoft Windows operating systems on
