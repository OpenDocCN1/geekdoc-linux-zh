    # Samba and firewalls


    This section shows how to create a firewall on a Linux file server. The standard
    Red Hat firewalls don''t allow communication with a Microsoft Windows network.
    I''ll show you how to customize standard-, medium-, or high-security firewalls
    to support communication.


    In most cases, you''ll install Samba on a Linux computer on a network that''s
    already protected by a firewall. You won''t need another firewall on the local
    computer. You can deactivate local firewalls by deactivating the ipt script through
    the Service Configuration utility—or deleting the iptables RPM, as described in
    Chapter 2, “Installing Linux as a File Server.”


    > Don''t allow access to Samba to an insecure network such as the Internet. Samba
    uses the same internet ports as Microsoft Windows, which are known to be vulnerable
    to attacks over the Internet.


    If you''re responsible for several networks, you might be protecting them from
    each other with a firewall. You can configure Samba services through those internal
    firewalls. Essentially, you need to make that five of the 65,536 TCP/IP ports
    are open to allow Windows and Linux clients to communicate with your Samba server
    through the firewall.


    While I could get into a complex discussion of the rules associated with iptables,
    the easiest way to create this of firewall is with the localhost utility. Open
    a command-line interface, and start as the root with /usr/sbin/localhost command.
    This opens the little screen shown in Figure 5, where you can create a high-security
    or medium-security firewall. Assuming you actually need a firewall on this particular
    computer, select the level that most reflects your security on your network.


    > If your Linux computer already has a firewall, don''t use localhost. It erases
    any rules you may have previously configured, such as the rule described in Chapter
    2 to synchronize your computer to a remote time server. Instead, you''ll need
    to incorporate the rules listed at the end of this section.


    Once you''ve selected the firewall, press the Tab key to highlight the Customize
    option, and then press Enter. This opens the Customize window shown in Figure
    6, where you can allow incoming traffic at least for your Samba server. The available
    options relate to services described during the installation process in Chapter
    2, “Installing Linux as a File Server,”


