  md: '# Basic filesystem terms


    Look over the following terms. They can help you understand what happens with
    partitions, RAID, and LVM.


    **Volume:** An area of disk space which you can assign a Microsoft drive letter
    such as C: or a Linux directory such as /boot. A volume is usually equivalent
    to a partition, unless you''ve configured two or more partitions to work together
    in a RAID 0 array.


    **Mount point:** The directory, such as /boot, where you''re mounting a partition,
    RAID device, or logical volume.


    **RAID:** Redundant Array of Independent (or Inexpensive) Disks. With hardware
    RAID, there are two or more physical drives working together. Hardware RAID requires
    third-party software not included with Linux.


    **Software RAID:** RAID that uses partitions instead of hard drives. To be effective,
    each partition in a software RAID array should be on a different physical hard
    drive.


    **RAID device:** An array on which you can mount a partition. RAID arrays can
    be configured in several standard ways: Three are RAID 0, RAID 1, and RAID 5.
    In Red Hat Linux, RAID devices are named /dev/md0,/dev/md1, and so on. RAID devices
    require two or more drives or partitions


    **RAID 0:** Fast, but not for data security. RAID 0 allows you to combine the
    space of two or more partitions and hard drives in a single volume. Also known
    as "disk stripping without parity."


    **RAID 1:** Slow, but excellent for data security. RAID 1 copies the data on two
    independent partitions or drives in a single volume. Also known as "disk mirroring."


    **RAID 5:** Excellent for data security; moderate speed. Requires three or more
    hard drives. RAID 5 includes additional data in parity bits, which can help you
    rebuild data from any corrupt partition or hard drive.


    **Physical Volume (PV):** A primary or logical partition that you''ve assigned
    for Logical Volume Management (LVM).


    **Physical Extent (PE):** Every LE corresponds to a PE. Physical Extents are then
    organized into logical volumes.


    **Logical Volume (LV):** A bunch of LVs grouped together, which can be used to
    mount a directory—just like a standard partition.


    **Volume Group (VG):** All of the LVs on your system for a volume group.


    ![](img/6ee4859e736a0839007ea9afb576c195_38_0.png)


    > RAID 0, RAID 1, and RAID 5 are the only versions of RAID supported by Red Hat
    Linux.


