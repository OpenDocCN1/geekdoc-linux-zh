  md: '# Chapter 3: Setting Up Your Server File System


    ```

    ; path = /usr/local/samba/profiles

    ; browseable = no

    ; guest ok = yes

    ```


    Instead, we''ll activate the following commands to configure a shared profiles
    directory.

    First, with other shares, you need to list the stanza in the configuration file:


    # [Profiles]


    You can add a comment to further identify the share to administrators, such as:


    ```

    comment = Roving Profiles

    ```


    Naturally, you''ll want to define the directory path variable for the profiles,
