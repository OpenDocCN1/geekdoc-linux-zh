    # 5. Preparing partitions and drives for dual booting


    Before you can install Linux on your computer, you need free space on your hard
    drive. To get the full benefit of Linux, you need to set up separate partitions
    in that free space. This section assumes you want to set up Linux in a dual-boot
    configuration with Microsoft Windows. If you have a dedicated computer or empty
    hard drive for Linux, feel free to jump ahead to the section "Red Hat''s Druid
    Dru."


    # The dual-boot option


    There are a number of ways to set up a dual-boot between Linux and Microsoft Windows.
    You can use third-party proprietary tools such as System Commander or Partition
    Magic. If you''re using one of the Microsoft 32-bit operating systems (Windows
    NT/2000/XP/2003), you can even use Microsoft NTLDR. If you''re installing Linux,
    the standard is to use the boot loader. The default Red Hat boot loader is known
    as GRUB and is shown in Figure 1. When you see this, you can use the up and down
    arrows to select your desired system from the menu.


    If you''ve installed Linux in an empty partition, distributions such as Red Hat
    will automatically set the dual-boot. Once Linux is installed, your computer boots,
    and the next thing you see is a menu similar to what is shown in Figure 1. You
    may get more information on how to configure a boot loader, see my book from Sykes,
    Mastering Red Hat Linux 9.


    # Splitting an existing partition


    Usually, computers with Windows installed don''t have enough free space. In many
    cases, the entire drive is allocated as one partition, which you probably know
    as the C: drive. Even with the piles of office suites and graphical applications
    with Linux, it does not require a great deal of room compared to the hard drives.


    While you can purchase a third-party tool to split a partition, it usually isnt
    necessary. Most Linux distributions, including Red Hat Linux, include the First
    Partition Splitter in the form of FIPS.EXE. It works fine with Primary partitions
    formatted to the Microsoft FAT16 or FAT32 filesystems. However, FIPS.EXE cannot
    split an NTFS partition.'
