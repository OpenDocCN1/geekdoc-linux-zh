    # Workstation log files


    For each workstation on your network, you may see two common errors:


    ```

    Error = No route to host

    Error = Connection reset by peer

    ```


    These standard errors happen when you connect to a Domain, when network connections
    fail, or after you restart. In any of these cases, it may take some time before
    the PDC, master browser, and workstations can find each other, which leads to
    these noted errors. In other words, you need not worry about these errors unless
    the computers on your network aren''t able to find each other for a reasonable
    period of time, such as 15 minutes. This may vary depending on your hardware setup
    and the number of computers on your network.


    Most of the log files in my /var/log/samba directory are associated with specific
    workstations on your network. Red Hat Linux by default keeps up five weeks of
    logs, rotated with a numeric extension. For example, I have five weeks of logs
    for connections from the computer named ststephen. The current week''s log for
    connections are stored in ststephen.log. The previous week''s log is stored in
    ststephen.log.1, and so on.


    In other words, you can collect a history of logs, to check the performance of
    your Domain on the Linux computer you''ve configured as the PDC.


    # Conclusion


    With Samba, you can configure a Microsoft-style Domain with users on Microsoft
    workstations. Before you start the process, you should check the configuration
    on your PDC for computer accounts, logon scripts, and user profiles as needed.


    You can start configuring Microsoft Windows workstations to join your Domain.
    The steps you take for Microsoft Windows 95, 98, and ME are quite similar. While
    the steps you take for Windows NT, 2000, and XP are somewhat different, the basic
    concepts are the same:'
  merge: -1
  pgno: 217
- img_proc: true
  md: '+   * Make sure that networking is properly configured.


    +   * Set up the connection to the Domain. On Microsoft Windows 9x/ME, you can
    do this through the network properties for the workstation. On Microsoft Windows
    NT/2000/XP, the steps vary.


    +   * Once you''re connected to the Domain, set up roaming profiles if desired.


    +   * Connect to shares as needed.


    +   * Share the directories of your choice with other users on the Domain.


    You can perform many of these functions from the MS-DOS command-line interface.
    For example, you can browse Domains and Workgroups with the **net view** command.
    You can connect to shared directories with the appropriate **net use** command.


    You also set up Microsoft and Linux computers in a peer-to-peer network. When
    you connect to shared directories in a peer-to-peer network, the steps vary depending
    on whether the source is a Windows 9x/ME, Windows NT/2000/XP, or a Linux member
    server.


