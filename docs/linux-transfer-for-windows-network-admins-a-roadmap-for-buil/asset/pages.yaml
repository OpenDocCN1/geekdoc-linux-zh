  md: '# Chapter 5: Connecting Linux Workstations 137


    # Connecting to a Domain


    With a Linux computer, you can connect to a Domain governed by a Windows or a
    Linux PDC. If you also want to share from the Linux client, you''ll need the additional
    Samba server packages described in Chapter 3, and will need to set up your computer
    as a Domain member as described in Chapter 4. Once the required packages are installed,
    there are several things you need to do:


    +   - Make sure the Samba daemon is running by using the following command:


    ```

    /sbin/service smb status

    ```


    +   - Make sure the Winbind daemon is running by using the following command:


    ```

    /sbin/service winbind status

    ```


    If you have a problem with a daemon, restart it. For example, the following command
    stops and starts the Winbind daemon: /sbin/service winbind restart. If you get
    a "sys locked" error message, try joining your workstation to the Domain first.


    ![](img/6ee4859e736a0839007ea9afb576c195_157_0.png)


    +   - Join your workstation to the Domain. The following command joins the local
    workstation to the GRATEFUL Domain, with a PDC on a Linux named cosmic (if the
    PDC is on a Windows computer, substitute administrator for root):


    ```

    # mbpassword -j GRATEFUL -r cosmic -u root

    ```


    Check your winbind connection to the PDC by using the following commands:


    +   - wbindinfo -p checks the connection to the PDC.


    +   - wbindinfo -t tests the workstation account on the PDC; if it is, you''ll
    see a "secret is good" message.


    +   - wbindinfo -u lists the users from the PDC.


    +   - wbindinfo -g lists the groups from the PDC.


    If you have trouble with one of these commands, you may need to restart the Samba
    or Winbind daemons. Alternatively, there may be a problem with the Samba configuration
    file as described in Chapter 4, "Setting Up Your Server''s Users.\ Typical problems
    are related to the password error, wins client, winbind uid, and winbind gid variables.


    After you''ve verified each of these items, your computer is ready to be a client
    that shares directories and printers on the Domain.


