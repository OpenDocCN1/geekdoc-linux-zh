  md: '# 124 Linux Transfer for Windows Network Admins


    you''ll also have a group named gecko. You can see how this works by looking at
    the /etc/passwd and /etc/group files. You''ll find regular users at the end of
    each of these files.

    Other Linux distributions organize all users as part of the same group, called
    users. All users on other distributions normally have some level of access to
    other''s files.

    In contrast, when you create a file in Red Linux, you own the file. You are normally
    the only member of the group that owns it. Regular users on the computer don''t
    get any more access to your files guest users.


