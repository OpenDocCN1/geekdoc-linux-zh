    There are more than 300 Samba variables; it''s instructive to examine the smb.conf
    file that comes with the samba-common RPM package. It includes most of the variables
    that you want to configure, and some of the variables include helpful comments—helpful
    that is, to people more familiar with Linux.


    The smb.conf file that I analyze in this section is based on the version of Samba
    that comes with Red Hat Linux 9. Different versions of Samba may include different
    smb.conf file with different variables.


    If you want to restore the original smb.conf and lmhosts from the samba-common
