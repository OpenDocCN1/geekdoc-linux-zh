  md: '# # Windows Internet Name Serving Section:

    # WINS Support - Tells the NBMD component of Samba to enable it''s WINS Server

    # THIS IS ALL YOU NEED TO ACTIVATE A WINS SERVER WITH SAMBA

    wins support = yes


    # DNS Proxy - Tells Samba whether or not to resolve NetBIOS names

    # via dns nooksup. The built-in default for versions 1.9.17 is yes,

    # this has been changed in version 1.98 to no

    dns proxy = no


    # ## Share Definitions

    # THIS IS THE STANDARD SHARE FOR USER HOME DIRECTORIES

    [homes]


    ```

    comment = Home Directories

    browable = no

    writable = yes

    valid users = %

    create mode = 0664

    directory mode = 0775

    ```


    # if you want users samba doesn''t recognize to be mapped to a guest user

    # map to = bad user


    # THIS SETS UP LOGON DIRECTORIES FOR USER BATCH FILES IN

    # /home/netlogon/username

    [netlogon]

    comment = Network Logon Service

    path = /home/netlogon

    guest ok = no

    writable = no

    share modes = no


    # THE FOLLOWING SHARE STORES WINDOWS NT/2000/XP PROFILES IN

    # /home/profiles/username

    # WINDOWS 95/ME PROFILES ARE STORED IN USER HOME DIRECTORIES

    [printers]

    comment = Roving profiles

    path = /home/profiles

    read only = no

    create mode = 0600

    directory mode = 0700

    browseable = no

    guest ok = no


    # NOTE: If you have a BSD-style print system there is no need to

    # specifically define each individual printer

    # THIS SHARES CUPS PRINTER LISTED IN /etc/printcap

    [printers]

    comment = All Printers

    path = /var/spool/samba

    browseable = no

    guest ok = no

    writable = no

    printable = yes


    # This one is useful for people to share files

    # THIS IS A NORMAL SHARE FOR DOWNLOADS'
