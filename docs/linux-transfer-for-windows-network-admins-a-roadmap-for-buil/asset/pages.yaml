    To set up a Linux computer as a PDC configured with Samba, take the following
    basic steps. Because I''ve already covered every topic in detail, I summarize
    the actions here.


    +   1. Set up your accounts on the Linux computer. You can use the command **/usr/sbin/useradd
    username**, or use the Red Hat User Manager. Linux user names are limited to 32
    characters.


    ![](img/6ee4859e736a0839007ea9afb576c195_138_0.png)


    > In case matters. Linux does not allow you to start user names with numbers.
    Linux also does not allow uppercase characters.


