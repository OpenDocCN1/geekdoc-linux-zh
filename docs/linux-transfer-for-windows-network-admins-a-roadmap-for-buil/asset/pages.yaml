  md: '# Chapter 7: Configuring Printers 207


    While any user can access the CUPS Web-based tool, administrative tasks such as
    adding new printers require the root administrative account and password.


    With the CUPS Web-based tool, you can configure single printers locally or over
    a network. You can also configure a group of printers in a class. For example,
    if you''re in a bigger organization with a group of printers in a room, you can
    set up a single printer class. You can assign all of the printers in that room
    to that class. When users present the print job to the first available printer
    in that room. First, I''ll show you how to access the CUPS administrative interface.
    I''ll show you how to set up a printer with CUPS. Finally, I''ll show you how
    to organize a group of printers in a class with CUPS.


    # Getting to the CUPS administrative interface


    To access the CUPS administrative interface, take the following steps:


    +   1. Open the browser of your choice. The Red Hat Linux default Web browser
    is Mozilla, which will start in the Linux GUI by clicking Main Menu | Internet
    | Mozilla Web Browser.

    2. Navigate to the CUPS Web-based tool. In the address text box, type localhost:631.

    3. Once the Web-based tool opens, click the Do Administration Tasks link.

    4. When prompted for the user name and password for CUPS, enter root under the
    user name and root user password. (It''s required even if you''re logged in to
    the GUI as root.) This takes you to the CUPS administration screen shown in Figure
    7.


    ![](img/6ee4859e736a0839007ea9afb576c195_227_0.png)


