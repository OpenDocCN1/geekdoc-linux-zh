  md: '# Chapter 8: Administration and Management 257


    # The Red Hat Linux rescue mode


    If you have a booting Red Hat Linux on your computer, you can use the boot floppy
    disk that you created during the installation process. You can still create that
    boot floppy after Red Hat Linux is installed. For example, if you see a message
    like the following, you can insert the rescue floppy and boot normally into your
    Linux system:


    ```

    Booting ''Red Hat Linux (2.4.20-9) ''

    root(hd1,0)

    Filesystem type unknown, partition type 0x83

    kernel/mlinux-2.4.20-9 root=LABEL==

    ```


    Error 17: Cannot mount selected partition


    Press any key to continue...


    If you press a key, you''re taken back to the GRUB menu. That''s not good enough
    if you have only one version of Linux on this computer. But you can fix the problem.
    If you''ve read the previous sections, you''ll know that the problem is with the
    root variable in the GRUB configuration file, /boot/grub/grub.conf. You can start
    your system by booting your computer from the rescue floppy. You can then edit
    and fix /boot/grub/grub.conf or restore it to backup.


    If you''ve forgotten to create or have that boot floppy, you''ll have a little
    more trouble booting into your system. But all is not lost. You can rescue failed
    Red Hat Linux systems by booting from the first Red Hat Linux installation CD,
    in what is known as linux rescue mode.


    # Rescue disks


    You should have "Installing Linux as a File Server." as described in Chapter 2,
    But there are two problems with rescue floppies. They are easy to lose, and they
    are customized for a specific Linux kernel. For example, the kernel that''s installed
    with Red Hat 9 is version 2.4.20-8.


    Red Hat has already released versions of your customized Linux kernel. You can
    upgrade to the latest Red Hat kernel with the Red Hat Update Agent described in
    Chapter 2. If you do, you''ll need to upgrade your rescue kernel. For example,
    if you upgrade to a hypothetical kernel version 2.4.21-2, you can create a new
    rescue floppy. Insert a 1.44MB floppy into the drive and enter the following command:


    ```

    # mkbootdisk 2.4.21-2

    ```


    When you reboot your computer from a rescue disk, you''ll see a message similar
    to the following:


    ```

    SYSLINUX 2.00 2002-10-25 Copyright (C) 1994-2002 H. Peter Anvin

    ```


    ```

    Press <return> (or wait 10 seconds) to boot your Red Hat Linux system from /dev/sda2.
    You may override the default linux kernel parameters by typing "linux <params>",
    followed by <return> if you like.

    ```


    boot:'
