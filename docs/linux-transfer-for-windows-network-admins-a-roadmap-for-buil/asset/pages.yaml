    Sometimes, you''ll just need to use the command-line interface. The rpm command
    is quite valuable and under standing in some detail.


    Take one of the RPM packages that you might need, samba-swat. For Red Hat Linux
    9, it''s also on the third installation CD. If you followed the instructions in
    the last section, then CD should already be mounted to


    It''s easy to install the samba-swat RPM. The following rpm command uses the -i
    (for install) switch to install the RPM from the specified directory:


    ```

    # rpm -i /mnt/cdrom/RedHat/RPM/samba-swat-*

    ```


    The asterisk is a wildcard; any RPM package file that starts with samba-swat-*
    is automatically installed. When you run the rpm -i command, there are three possible
    results:


    +   * rpm successfully installs the package.

    * rpm can''t install packages because there are dependencies; in other words,
    you need to install other RPM packages files. If you''ve installed the rpmdb-redhat
    package as described in the previous section, the messages will name the packages
    that should be installed.

    * rpm can''t install the package it''s already installed.


    You could find errors, which is the reason that more experienced Linux users add
    the -v (verbose) and -h (hash) switches to it. Naturally, the -v switch provides
    additional information, and the -h switch creates hash marks, which can help you
    measure the progress of the installation:


    ```

    # rpm -ivh /mnt/cdrom/RedHat/RPM/samba-swat-*

    ```


    If an other version of the package is installed, this command won''t update it.
    For that purpose, you''ll want to replace the -i with a -U switch. The -U switch
    upgrades a package if it''s already installed, or installs the package if it isn''t
    currently on your system. So the preferred command is:


    ```

    # rpm -Uvh /mnt/cdrom/RedHat/RPM/samba-swat-*

    ```


    The rpm command is rich and complete. Entire are available on the subject. The
    first edition of a book named Maximum RPM is included on the Red Hat Linux 9 Documents
    CD. A few of the switches are shown in Table 2; they use the samba-swat package
    as an'
