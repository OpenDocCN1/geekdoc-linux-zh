    ```


    Once the file is configured, it''s easy to enable quotas. Just run the following
    command:


    ```

    /sbin/quotan

    ```


    And that''s it. The next time you reboot Linux, it uses the settings you changed
    in /etc/fstab to find the quotas you created during this process, and then it
    activates them automatically.


    # Conclusion


    In this chapter, you learned to configure and configure the users and groups that
    you need to set up a Linux computer as a Domain member server or a PDC. There
    are three different types of user accounts on a Linux computer with Samba: Regular
    users, Samba users for logins to Microsoft workstations, and computer accounts
    to accommodate connections from those Windows workstations.


    If you''re keeping a Windows computer as a PDC, you can set up the windbind daemon
    on Linux-based Domain members. It''ll use the user name and password database
    from the PDC to share files and printers from the Linux Domain member.


    If you''re configuring a Linux computer as a PDC, the right settings in the Samba
    configuration file, smb.conf, support roaming profiles. The effect is slightly
    different depending on whether you''re connecting from Windows 9x/ME or Windows
    NT/2000/XP workstations.


    To understand the interactions between Linux and Microsoft Windows, you need to
    understand the nature of ownership and permissions files and directories in Linux.
    Fortunately, even a Linux-based PDC supports the use of ACLs from Microsoft workstations
    and members. However, you can''t set ACLs directly on current Samba servers that
    are based on Red Hat 9.


    While Linux doesn''t have the diversity of default groups available on Microsoft
    Windows servers, you can configure-special groups with rights and permissions
    to limited members. In this chapter, I showed you how to create these groups directly,
    or through the Red Hat User Manager.


    Finally, you can regulate the resources by users and groups by using quotas. While
    there is no Red Hat GUI that you can use to configure quotas, the commands you
    need to set up quotas are straightforward.


    > Updates and corrections to this chapter can be found on Hentenwerke''s Web site,
    www.hentwerke.com. Click “Catalog” and navigate to the page for this book.'
