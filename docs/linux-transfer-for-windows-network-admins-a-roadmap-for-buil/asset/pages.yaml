    **Figure 41.** Samba log files on a Linux PDC.


    # Primary log files


    The primary log files in /var/log/samba tell you about problems with the Samba,
    NetBIOS, and Winbind daemons. Here are more details about each of these log files:


    +   - **log.smbd.** Every time the Samba daemon is started, there will be another
    entry in this file, with date and time.


    +   - **log.nmbd.** On a Linux PDC, this file includes browser data, including
    elections. Every time the NetBIOS daemon, **nmbd**, is started, there will be
    another entry in this file (for more information see Chapter 3, "Setting Up Your
    Server System.")


    +   - **log.winbind.** On a Linux/Samba Domain member server, this file records
    problems with connections to a PDC on a Microsoft computer.'
