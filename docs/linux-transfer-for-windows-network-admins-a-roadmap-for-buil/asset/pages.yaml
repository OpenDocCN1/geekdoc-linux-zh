    # Synchronizing user databases


    Linux is reliable. I stand by my belief that Linux is so reliable, backup Domain
    controllers are rarely. But there are things beyond the control of the Linux operating
    system that may require you to set up a different computer as the Domain controller
    for your network. For example, a power supply can fail, a hard drive can get bad
    sectors, or a network card can degrade. In any of these cases, you may be forced
    to bring up another computer as the PDC on your network.


    > If you need a backup computer for your Domain controller, you can set up Linux
    DCs in a cluster. describe clustering briefly in Chapter 9, "System Backup."


    I''m assuming that you''ll transfer the files you need from a backup of your Linux
    PDC. And I''m assuming you make regular backups. To set up another Linux computer
    as a Backup Domain Controller (BDC), you''ll need to do the following:


    +   * Copy the machine identifier from the PDC. Use the smbpasswd -S command,
    which takes the machine identifier from the PDC and stores it in the local /etc/samba/secrt.td
    file. (In Samba 3.0, the corresponding command is net rpc getsid).


    +   * Copy the user database files from the PDC. This includes /etc/passwd, /etc/group,
    /etc/shadow, and /etc/gshadow.


    +   * Copy the Samba database files from the PDC. This includes /etc/samba/smbusers
    and /etc/samba/smbpasswd.


    +   * Copy the Samba configuration file, /etc/samba/smb.conf. If you''re going
    to use the backup computer as the WINS server, you may need to change the wins
    server variable in this file.


    +   * Make sure that those you configured on the PDC are also available on the
    backup computer. If you have [netlogin] scripts or profiles on the PDC, you''ll
    need to copy those files to the backup computer as well.


