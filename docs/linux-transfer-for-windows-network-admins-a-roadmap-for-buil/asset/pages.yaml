    server. When you do, Nautilus takes time to copy these files over your network.


    # # Scheduled backups


    In Chapter 8, I showed you Linux''s cron service runs scripts on a regular basis.
    Now I''ll show you how to make it work for backups. As an administrator, you''ll
    want to make sure to back up at least the files in the /home directory on a regular
    basis. Based on what you learned in Chapter 8, I can show you how to create a
    script you need.


    # # Creating a file server script


    Linux scripts are text files that you can create with GUI or command-line text
    editors. As described in Chapter 8, the slocate.cron script in the /etc/cron.daily
    directory starts with the following command, which sets this script to use the
    bash shell.


    ```

    #!/bin/sh

    ```


    > A wide variety of command shells are available, but bash is the default shell
    for Red Hat Linux.'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'Let''s say you''re setting up a backup of the /home directory to a drive up,
    such as /dev/nst0. In that case, you''ll want to add the following command to
    your script:


    ```

    /bin/dump 0f /dev/nst0 /home

    ```


    Of course, this will only work if you actually have a drive drive connected to
    the /dev/nst0 device. You''ll note that this is a bit different from the command
    described earlier in this chapter, which did not include /bin the dump command.
    That''s because scripts require the full path to all commands you use, unless
    you set up a PATH command similar to the one I explained for the etc/cron script
    in Chapter 8, "Administration and Management."


    The previous command is all you need in the script. Save it with an appropriate
    descriptive file name such as etc/cron.weekly/fullback. As described in Chapter
    8, Red Hat Linux in the /etc/cron.weekly directory every Sunday morning at 4:22.


    But the script isn''t ready until you make it executable. To do so, you''ll need
    to use the chmod command described in Chapter 4, "Setting Up Your File Server''s
    Users." The following command makes the script /etc/cron.weekly readable and executable
    by all users:


    ```

    # chmod 755 /etc/cron.weekly/fullback

    ```


    You can create scripts for incremental or differential backups, based on your
    desired schedule. The /etc/cron script may not be flexible enough for your needs.
    As explained in Chapter 8, this script every script in the /etc/cron.weekly directory
    every Sunday.


    For example, if you wanted to create an incremental backup every Wednesday night
    at 11:30: You''d need to set up a new directory, such as /etc/cron.wednesday.
    You could then add the following command to /etc/cron:


    ```

    30 23 * * 3 root-run /etc/cron.wednesday

    ```


    Then you could create the script for incremental backups, and save it in the /etc/cron.wednesday
    directory.


    # Other commands


    The aforementioned script is just a sample of what you can do. You''re not limited
    to the dump command. Depending on the hardware you have available, you can configure
    the other commands in this chapter in scripts that back up /home directory to
    appropriate media as writable CDs or DVDs.


    As of this writing, Linux does not support automation of GUI interfaces. Therefore,
    you need to use text commands to back up the /home directory to a Linux server.


    # Conclusion


    File servers are a central location for user files on a network. Because they
    contain valuable information from your users, you''ll want to back up your file
    servers on a regular basis. By definition, linux computers save files in the /home
    directory.


    What you do to back up your file servers depends on a number of factors, including
    the amount of data, the frequency of required backups, and the media that you
    select. You can set up RAID arrays to keep data available on a real-time basis.
    You can back up all or part of your'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# Chapter 9: System Backup 285


    data. You can set up full, incremental, and differential backups. There are a
    number of third-party hardware options that can support different levels of hardware
    RAID and large-scale backups.


    You can set up backups for your Linux file server with clusters and virtual servers.
    This is supported through the High Availability Linux project and the Linux Virtual
    Server project.


    Red Hat supports three levels of software RAID: RAID 0, RAID 1, and RAID 5. You
    can set up a RAID array during the installation process, and can configure additional
    RAID partitions with fdisk or parted. You can set up the RAID array in larger
    or additional arrays in the /etc/raidtab configuration file.


    To set up backups from Linux, you need to learn many of different text commands.
    While you can copy files through the GUI to blank CDs, that does not help with
    tape drives, DVDs, and or other media. Because you can''t automate Linux GUIs,
    you need to learn the basic text commands used for backups, including dump, restore,
    tar, and cpio. You may also find the commands that send data to writable CDs and
    DVDs valuable. These include mkisofs, ddcdrecord, and ddvdrecord.


    Your network servers should save all their important data to your file servers.
    Then you need to do back up the appropriate home directories from these servers.
    These home directories on Windows servers are defined in user profiles. These
    home directories on Linux servers are located in the /home/directory.


    You don''t want to back up a file server when it''s busy. And you don''t want
    to stay in the middle of the night to back up files when the servers aren''t busy.
    From a Linux server, you can automate backups with scripts. You can set up the
    scripts you need with the existing structure defined in /etc/crontab. You can
    create and store daily and weekly scripts in the /etc/cron.daily and /etc/cron.weekly
    directories. You can create your own directories for any specialized scripts that
    you may need.


    > Updates and corrections to this chapter can be found on Hentswerke’s Web site,
    www.hentenwerke.com. Click “Catalog” and navigate to the page for this book.'
  merge: -1
