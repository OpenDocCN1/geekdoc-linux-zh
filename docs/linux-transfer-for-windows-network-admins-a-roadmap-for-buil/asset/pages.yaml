  md: '# Chapter 4: Setting Up Your File Server’s Users 105


    # Chapter 4 Setting Up Your File Server’s Users


    Computer networks revolve around users and groups. Users can log in computers
    and networks, and they can access the files and directories that they own. In
    a Microsoft-based network, administrators usually share additional files and directories
    with groups. While the Microsoft and Linux user and group databases are different,
    this chapter shows how to make them work together. When you''re finished with
    this chapter, you''ll be able to set up users and groups on a Microsoft or a Linux-based
    PDC.


    If you''re going up a Linux PDC, you need to know how to set up Linux users and
