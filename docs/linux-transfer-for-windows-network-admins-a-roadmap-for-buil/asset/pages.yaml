  md: '# Administrative tools


    As a Linux administrator, you have a number of other key tools at your disposal.
    The tools covered in this section are not difficult to use, but can help you in
    so many ways. While I''ve shown you how to mount the Red Linux installation CDs,
    it would be easier if you could access the Red Linux installation files from a
    single source, over a network.


    To paraphrase what you experience as an administrator, correction happens. Critical
    files may be lost, or inexperienced Linux administrator could make a mistake.
    To understand where things might go wrong, I''ll show you the basics of the Linux
    boot process. Then I''ll show you how to use the Linux rescue disk. Finally, I''ll
    help you learn how to manage your users in more detail.


    # Managing the installation files


    Chapter 2 showed how to install and remove RPM packages with the rpm command.
    But that command is not enough for a system administrator. There are three Red
    Hat installation CDs, and you may not always have the CDs with you.


    # Creating an installation source


    Once you''ve copied the Red Hat installation files to a single source on your
    network, you can connect to it like any other Samba directory. To copy the Red
    Hat installation files, first create a shared directory, copy the base and RPM
    subdirectories from the first CD, and then copy the RPM package from the second
    and third installation CDs. I''m assuming you already know how to do this on a
    Microsoft computer. In either case, you''ll need a computer with about 2GB of
    free space. To set this on on a Linux computer, follow these steps:


    +   1. Log in as the root user. If you''re in the GUI, open a command-line interface.
    Right-click on the desktop, and click New Terminal in the pop-up menu that appears.

    2. Create a separate directory for installation files. For the purpose of this
    exercise, I''ll create the /mnt/source directory.


    ```

    mkdir /mnt/source

    ```


    +   3. Mount the Red Hat installation CD. If you''re in the GUI, that should happen
    automatically when you insert the CD; otherwise run the following command:


    ```

    mount /mnt/cdrom

    ```


    +   4. Copy the required files and directories from the first CD. Remember, because
    you''re transferring several hundred MB of files, this may take a few minutes.
    As described in Table 3, the following command copies all files from the RedHat
    directory to /mnt/source, recursively; when complete, you''ll find the RedHat
    directory and all subdirectories under /mnt/source.


    ```

    cp -ar /mnt/cdrom/RedHat /mnt/source

    ```'
  merge: -1
  pgno: 268
- img_proc: true
  md: '5. Unmount the first CD and insert the second installation CD. If you''re not
    in the GUI, mount it as described in step 3. Copy the files from the second CD.


    ```

    # umount /mnt/cdrom

    # mount /mnt/cdrom

    # cp -ar /mnt/cdrom/RedHat /mnt/source

    ```


    6. Repeat step 5 with the third installation CD.


    7. Make sure to share the /mnt/source directory. In the Samba smb.conf configuration,
    you''ll need to insert a stanza of commands similar to the following:


    ```

    [inst]

    comment = Red Hat Linux 9 CD files

    path = /mnt/source

    browseable = yes

    read only = yes

    ```


    8. Save your changes to the smb.conf file. Remember to make Samba reread your
    changes with the following command:


    ```

    # /sbin/service smb reload

    ```


    > You can even install Red Hat Linux over the network—if you share it through
    NFS, FTP, or Web server. For more information, see the Syb book Mastering Red
    Hat Linux 9, written by this author.


    # Using the installation source


    Now you can mount this source of installation files from other Linux computers
    on your network. The basic steps are the same as you set up the Red Hat Linux
    installation files on Windows or a Linux computer. Assume the computer is cosmic,
    and your user name on the domain is tr. To mount the Samba [inst] share on the
    /home/tr/source directory, log in to the local computer as tr, and run the following
    smbount command:


    ```

    # smbount //cosmic/inst /home/tr/source

    ```


    Assuming tr also exists on the PDC, the smbount command automatically mounts the
    [inst] share from the cosmic computer on /home/tr/source directory.


    > You will get an error message when you try the smbount command as a regular
    user, you may need to apply the chmod u+s command on the smbount and smbmount
    commands. For more information, see Chapter 5, "Connecting Linux Workstations."'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Linux Transfer for Windows Network Admins


    After you''ve mounted the Red Hat Linux installation files on a single directory,
    you have a single source from which to install the RPMs from the Red Hat Linux
    CDs.


    # Managing the Linux boot process


    When you boot a Red Hat Linux computer, it runs a set of commands that checks
    your hardware, loads the kernel, mounts standard directories, sets basic initialization
    parameters, and then loads the services you need for a fully Linux server or workstation.
    As described in Chapter 3, you can configure different services to start if you
    set your computer to log in at the text or GRUI interfaces.


    While this may seem like a lot of trivia, you need to know your configuration
    files to this level of detail if you need to rescue your Linux system. One of
    the biggest problems with these files is from administrators who do not know the
    details. I''ll cover three of the key configuration files associated with the
    Linux boot process:


    +   - /boot/grub/grub.conf is the configuration associated with the default GRUB
    boot loader.

    - /etc/initstab sets the default runlevel and the standard text-mode login screens.

    - /etc/fstab mounts and sets up preconfigured directories for filesystems.


    Pay attention to these files. Whenever you''ve had a problem booting Linux, I''ve
    found that the cause is most often related to one or more of these files. For
    more information, see the Red Hat documentation on this topic, www.redhat.com/docs/manuals/linux/


    # The GRUB boot loader


    Once configured, GRUB allows you to load the operating system or the Linux kernel
    of your choice. Because it''s a key file in the boot process, it''s worth analyzing
    in some detail. Let''s take a careful look at the grub.conf configuration file
    on my desktop computer, which illustrates a "dual-boot" configuration. In other
    words, the grub.conf file shown in Figure 6 allows you boot into Linux or Microsoft
    Windows.


    ![](img/6ee4859e736a0839007ea9afb576c195_270_0.png)


    There are many boot loaders associated with Linux. GRUB is the Unified Boot Loader,
    which is the current default for Red Hat Linux. LILO is the Linux Loader, which
    was the default for Red Hat Linux through early 2002. If you want to convert from
    LILO to GRUB, read the GRUB manual. You can read it on Linux computers with the
    info grub command.


    Let''s analyze the GRUB commands in detail. The first line indicates that grub.conf
    was first created using Anaconda, which is Red Hat''s code name for the installation
    program that was covered in Chapters 1 and 2:


    ```

    # grub.conf generated by anaconda

    ```


    The next comment indicates that any changes you make to GRUB are automatically
    recognized the next time you boot your computer.


    # Note that you do not have to rerun grub after making changes to this file'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Chapter 8: Administration and Management 251


    ```

    # grub.conf generated by anaconda

    #

    # Note that you do not have to rerun grub after making changes to this file

    # NOTICE: You have a /boot partition. This means that

    # all kernel and initrd paths are relative to /boot/, eg.

    # root (hd0,1)

    # kernel/mlinuz-version ro=/dev/hda3

    # initrd/initrd-version.img

    #boot=/dev/hda3

    default=0

    timeout=30

    splashimage=(hd0,1)/grub/splash.xgm

    title Red Hat Linux 2.4.0-29

    root (hd0,1)

    kernel/mlinuz-2.4.0-29 ro=LAEL; hd=ide-scsi

    initrd/initrd-2.4.0-29

    title Windows Server

    rootverify=(hd0,0)

    chainloader +1

    ```


    **Figure 6. GRUB configured for a dual-boot.**


    Unlike boot loaders (for LILO or Windows'' NTLDR), you don''t have to write boot-loader
    to change any hard drive boot record (MBR).

    As you may remember from Chapter 1, I installed Red Hat Linux with the /boot directory
    mounted on a separate partition. The following notice indicates that the Linux
    kernel (vmlinuz) and Initial RAM disk (initrd files) are both stored in the /boot
    directory.


    > **NOTICE: You have a /boot partition. This means that

    all kernel and initrd paths are relative to /boot/, eg.

    root (hd0,1)

    kernel/vmlinuz-version ro=/dev/hda3

    initrd/initrd-version.img


    Now here it is easy to get confused. The root (hd0,1) comment tells me that the
    /boot directory is located on the first hard drive (0), on the second partition
    (1). The root=/dev/hda3 comment tells me that the top-level directory, which is
    also called the "root directory.", it is located on the third partition of the
    first IDE hard drive.


    > It is easy to get lost with Linux''s different definitions of root. There''s
    the root user, which is the administrative user on the Linux computer. The root
    user''s home directory is /root. The /root directory is just one subdirectory.
    The top-level directory in Linux, /, is also known as the root directory. In the
    GRUB configuration file, the root(hd0,1) variable represents the partition with
    the /boot directory.


    Finally, the following comment tells me that the Linux /boot directory is located
    on the first IDE hard drive on my computer:


    ```

    #boot=/dev/hda

    ```


    If the /boot device were located in the first SCSI drive, this line would read:


    ```

    #boot=/dev/sda

    ```


    ![](img/6ee4859e736a0839007ea9afb576c195_271_0.png)'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Linux Transfer for Windows Network Admins


    We''ve just looked at the comments. Now let''s look at the actual commands in
    my grub.conf configuration file. The first command refers to the default operating
    system. In other words, the following command sets Red Linux as the default:


    ```

    default=0

    ```


    If I changed this variable to default=1 in this file, that would point to the
    second stanza, which would set Microsoft Windows Server as the default. The next
    command sets a timeout; in this case, if I don''t run a command or click the up
    or down arrow within 10 seconds, GRUB automatically boots the default operating
    system.


    ```

    timeout=10

    ```


    Red Linux has its own standard graphical image that has the GRUB boot loader,
    which is associated with the splashimage command. Based on the root(hd0,1) comment
    earlier in this file, the splash.xpm file is located in the /boot/grub directory.


    ```

    splashimage=(hd0,1)/grub/splash.xpm.gz

    ```


    You''ll see how this looks shortly. First, let''s look at the first stanza. The
    title command sets the label that you see in the GRUB menu:


    ```

    title Red Linux (2.4.0-29)

    ```


    The next line tells GRUB the location of the /boot directory. As described earlier,
    it''s on the second primary partition on the first IDE drive:


    ```

    root (hd0,1)

    ```


    The following line actually represents three commands. The first part of the command
    tells me that GRUB can find the kernel in the /boot directory, in the vlinux-2.4.0-29
    file, and that it should read into the operating system as a read-only (ro) file.
    The next part of the command labels the top-level Linux directory, /. The final
    part of the command is a message to the kernel about hdc, which typically represents
    the CD Drive on a PC. The ide-scsi device is required by Linux to read some CD
    drives and is automatically included for required drivers by the Red Linux installation
    process:


    ```

    kernel /mlinuz-2.4.0-29 ro root=LABEL=/hdc=ide-scsi

    ```


    When Red Linux boots up your system, it starts by loading an Initial RAM disk,
    which loads other drivers from Linux to your computer. The following line locates
    the Initial RAM disk on /boot directory.


    ```

    initrd /initrd-2.4.0-29.img

    ```


    Now we''ll look at the other stanza, which boots some version of a Windows Server
    operating system on this computer. Before, the title command sets the label that
    you see in the GRUB menu:'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Chapter 8: Administration and Management 253


    title Microsoft Windows Server


    The next command locates the boot files associated with this operating system.
    The rootoverify command means that GRUB doesn''t look for a Linux /boot directory
    in the Windows partition. The (hd0,0) label means the Windows boot files are located
    on the first partition of that hard drive.


    rootoverify (hd0,0)


    Finally, this last command, for a Microsoft Windows server, loads the NT Boot
    Loader from the first sector of the noted partition. You can inspect the result
    of this configuration file in Figure 7.


    ![](img/6ee4859e736a0839007ea9afb576c195_273_0.png)


    Figure 7. The GRUB boot screen.


    # Starting Linux with /etc/initstab


    Once you''ve selected Linux, the boot process eventually moves to the /etc/initstab
    file. This file determines whether Linux starts in text or GUI mode, starts a
    list of services in that mode, configures standard text login screens, and sets
    a few standard commands. You may want to change one of these commands for the
    sake of your Windows users.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Linux Transfer for Windows Network Admins


    As with grub.conf, the first part of /etc/initab includes comments that help you
    understand the purpose and some basic parameters for this file. As you can see,
    there are seven possible runlevels for Red Hat Linux. The only runlevels that
    you normally need to consider are 3 (Full multiuser mode) and 5 (X11). As discussed
    in Chapter 2, these runlevels correspond to text and GUI logins.


    +   # Default runlevel defined by RHS are:

    # 0 halt (Do NOT set initdefault to this)

    # 1 Single user mode

    # 2 Multiuser, without NFS (The same as 3, if you do not have networking)

    # 3 Full multiuser mode

    # 4 unused

    # 5 X11

    # 6 reboot (Do NOT set initdefault to this)


    The first command sets the default runlevel. The number 5 in this tells me that,
    by default, the computer starts in a GUI login screen. If you prefer a text login
    screen, you can change the 5 to 3 in the text editor of your choice.


    ```

    id:5:initdefault:

    ```


    The following command completes the basic boot process, which runs the /rc.sysinit
    script, located in the /etc/rc.d directory:


    ```

    si::sysinit:/etc/rc.d/rc.sysinit

    ```


    Linux uses only one of the next seven commands, the one that corresponds to the
    default runlevel. For example, if the default runlevel is 5, the applicable command
    starts the scripts in /etc/rc.d/rc.5/ directory.


    ```

    10:0:wait:/etc/rc.d/rc 0

    11:1:wait:/etc/rc.d/rc 1

    12:2:wait:/etc/rc.d/rc 2

    13:3:wait:/etc/rc.d/rc 3

    14:4:wait:/etc/rc.d/rc 4

    15:5:wait:/etc/rc.d/rc 5

    16:6:wait:/etc/rc.d/rc 6

    ```


    The following command allows any user to press Ctrl-Alt-Del to reboot the Linux
    computer. If you''re going to have users who are more familiar with Microsoft
    Windows, they might press Ctrl-Alt-Del at the first sign of trouble. Unfortunately,
    this reboots this Linux for all users. I''d disable this by adding a pound sign
    (#) in the first of the command line.


    ```

    # Trap CTRL-ALT-DELETE

    ca::ctrlaltdel:/sbin/shutdown -t3 -r now

    ```


    The following commands relate to the installation of an uninterruptible power
    supply by this computer. You can read more about installing a UPS on your system

    www.tldp.org/HOWTO/UPS-HOWTO.html.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Chapter 8: Administration and Management 255


    ```

    # When our UPS tells us power failed, assume we have a few minutes

    # of power left. Schedule a shutdown for 2 minutes from now.

    # This does, of course, assume you have power installed and your

    # UPS connected and working correctly.

    pf:=powerfail:/sbin/respawn -f -h2 "Power Failure: System Shutting Down"

    # If power was restored before the shutdown kicked in, cancel it.

    pr:12345:respawn:/:/sbin/shutdown -c "Power Restored: Shutdown Cancelled"

