    The touch command creates the aquota.user file in the /home directory with zero
    bytes; this chmod makes it readable and writable only by the root (administrative)
    user. Others who do not have access to the root user password cannot read or change
    this file. Similarly, to set the group quota configuration file on /home, run
    these commands:


