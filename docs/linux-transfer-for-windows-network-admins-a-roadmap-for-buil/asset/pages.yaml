  md: '# Process management


    You''ve presumably installed Samba as part of the Linux installation as described
    in Chapter 2, "Installing Linux as a File Server." Now you need to know how to
    manage the Samba processes—specifically, how to start and stop Samba, as well
    as reload the Samba configuration file. You can manage services from a GUI application
    or from the command-line interface.


    # Managing services from a GUI


    To manage Samba in a GUI, start Service Configuration utility first described
    in Chapter 2. Click Main Menu | System Settings | Server Settings | Services.
    You can scroll down the list of running services to review the status of Samba
    and Winbind services, as shown in Figure 3.


    ![](img/6ee4859e736a0839007ea9afb576c195_84_0.png)


    Figure 3. Checking the status of Samba.


    As you can see from the Chapter 2, the Service Configuration utility is checking
    status in runlevel 5. As you log in to a GUI interface, I''ve highlighted smbd:
    in the Status pane, you can see the status and Process IDs associated with the
    Samba (smbd) and NetBIOS (nmbd) daemons. These are the programs in /usr/sbin directory
    that actually run Samba on Linux.


    > Process IDs (PID) can help you a crashed program from crashing your system.
    You can select a process and end it as shown in Figure 4, you can also run the
    kill -HUP PID command for a graceful shutdown (or run kill -9 PID for an immediate
    shutdown that may leave processes running).


    You might also note that the winbind service is not active. If you also want to
    set up Linux members to use a Microsoft Windows database of users and passwords,
    you''ll want to activate this daemon with the /sbin/winbind start command. I discuss
    this daemon in more detail in Chapter 4, "Setting Up Your File Server''s Users."'
