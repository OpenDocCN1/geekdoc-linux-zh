    from your Linux GUI, click Main Menu | System Settings | Users and Groups.


    Now select the user of your choice. To configure the password policy for that
    user, click the Properties button. This opens the Users Properties window, where
    you can click the Account Info tab. Using this, you can:


    +   * Set an expiration date for the account.

    * Lock the account by deleting the password from /etc/shadow. If you reactivate
    the account, you''ll need to set the password again.'
