  md: '# Conclusion


    This chapter started as a continuation of Chapter 1, finishing the installation
    process for Red Hat Linux. You can configure firewalls and authentication during
    installation. Most important is you choose to install with Linux. If you install
    services that you don''t need, you are essentially opening doors for crackers
    who want to break into your computer.


    To this end, I examined the basic services that you need to configure a Linux
    File and Print server that can connect to a Microsoft Windows-style network. While
    the requirements are quite minimal, I''ve also specified the package groups that
    someone who is used to a GUI want on Linux.


    The First Boot process allows you to add a non-administrative user, synchronize
    your computer''s clock with a central server, configure a sound card, set up a
    connection to the Red Hat Network (RHN), and install additional Red Hat software.


    The Red Hat Update Agent allows you to update your software based on the latest
    available RPM packages on the RHN. While it requires registration, you can choose
    from any available updates.


    After Red Hat Linux is installed, you may want to uninstall or deactivate several
    services with scripts in the /etc/rc.d/init.d directory. You can uninstall RPM
    packages by using the **rpm -e** command. You can deactivate services in the key
    runlevels (3, 5) by using the Service Configuration utility or the **chkconfig**
    command.


    > Updates and corrections to this chapter can be found on Hentzenwerke’s Web site,
    **www.hentzenwerke.com**. Click “Catalog” and navigate to the page for this book.'
