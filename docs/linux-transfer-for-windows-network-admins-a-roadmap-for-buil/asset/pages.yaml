    users, the requirements increase accordingly.


    +   Memory (RAM): At least 64MB if you need Linux in text mode on a workstation.
    You should have at least 128MB for a graphical workstation; 192MB is recommended.
    If you''re configuring a server for multiple users, the requirements increase
    accordingly.


