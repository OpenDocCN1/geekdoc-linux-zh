  md: '# Chapter 3: Setting Up Your Server File System


    If you activate this particular command, it synchronizes your browser list with
    that the computer with an IP address of 192.168.3.25. It also sends a broadcast
    message to find and synchronize with the browser master on the network with an
    IP address of 192.168.5.0.

    If users on other networks are having trouble finding your Samba computer, you
    can also tell others about your browser list. The following command, if you activate
    it, sends a broadcast message to a remote network with an IP address of 192.168.1.0,
    and a master browser with an address of 192.168.2.44


    ```

    remote announce = 192.168.1.255 192.168.2.44

    ```


    By default, Samba servers participate in "elections" for browser master on a LAN.
    If you have already prepared a preferred browser master as a PDC, you should activate
    this command:


    +   - local master = no


    Microsoft Windows LANs where the browser master is on a computer other than the
    PDC can have problems. If the PDC is on a remote LAN, this is not an issue.

    If you want to participate in browser master elections, you can give it a certain
    number of votes. The default os level is 20; if you''ve configured your Linux
    computer as a PDC, you should activate this command. The os level can be set as
    high as 255


    +   - os level = 33


    Browser elections proceed in two stages. The first stage depends on the operating
    system, as described in Table 5.


    Table 5. Browser election values.


    | Operating System | Value |

    |---|---|

    | Windows for Workgroups (3.11) | 1 |

    | Windows 95/98/ME | 1 |

    | Windows NT/2000/XP/2003 | 16 |

    | Windows NT/2000/2003 PDC | 32 |


    If there is a tie—for example, if there’s more than one Samba server with an os
    level of 33, the elections proceed to a second stage. As shown in Table 6, the
    hierarchy of values for a browser election is highly dependent on its current
    role on the network.


    Table 6. Additional browser values, in the case of a tie.


    | Current Browser Role | Value |

    |---|---|

    | Current backup browser | 1 |

    | Previous backup browser | 2 |

    | Local master browser | 4 |

    | Preferred master browser | 8 |

    | WINS client | 32 |

    | Domain master browser | 128 |'
