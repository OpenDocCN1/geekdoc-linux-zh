  md: "# Sharing printers over a network\n\nNow that you've created your special printers\
    \ over the network, I'll show you how they're shared on a Microsoft Windows network\
    \ through Samba. The key once again is the commands in the /etc/samba/smb.conf\
    \ configuration file. There are two major sections in this file: [global] parameters\
    \ to all shares, and specific commands related to shared printers.\n\nThere are\
    \ two relevant [global] commands in the default version of this file:\n\n```\n\
    printcap name = /etc/printcap\nload printers = yes\nprinting = cups\n```\n\nThese\
    \ commands are straightforward. The **printcap name** command refers to /etc/printcap\
    \ for a list of printers. The **load printers** command loads these printers into\
    \ the Windows-style networking browse list. The **printing** command refers to\
    \ the system service, typically **cups** or **lpring** (lpring is another name\
    \ for the LPD service).\n [global] commands are set, printers are normally shared\
    \ in the smb.conf configuration with the following [printers] shares:\n\n```\n\
    [printers]\ncomment = All Printers\npath = /var/pool/samba\nbrowable = no\n# Set\
    \ public = yes to allow 'guest account' to print\nguest ok = no\nwritable = no\n\
    printable = yes\n```\n\nOnce you've shared your printers, you can see how things\
    \ look from a Windows Neighborhood view of shared directories and printers. **Figure\
    \ 13** illustrates this view from a Windows 98 workstation on your Great Domain.\n\
    \n![](img/6ee4859e736a0839007ea9afb576c195_234_0.png)\n\nFigure 13. A Windows\
    \ 98 workstation view of shared directories and printers."
  merge: -1
  pgno: 234
