  md: '# Chapter 7: Configuring Printers


    # # Chapter 7

    Configuring Printers


    Like Bogart and Bacall, Sonny and Cher, or Spike and Buffy, File and print servers
    have always gone together in the world of computer networks. Just as you can configure
    Samba to share directories in a Microsoft Windows-style network, you can also
    configure Samba and a Linux print server to share printers on that same network.


    Presumably, you already know how to configure and share printers from a Microsoft
    Windows computer. In this chapter, I''ll show you how to configure and share printers
    from a Linux computer. You can connect to shared printers from either operating
    system from a Windows or a Linux workstation on your network.


    As of this writing, Red Hat sometimes installs printers when you install the operating
    system. Red Hat assumes any computer with installed printers is a print server.
    If you want to print from your computer or network, you may have to configure
    local or network printers after you''ve installed Linux.


    The two prints most closely associated with the Common Unix Print System (CUPS)
    and the Line Print Daemon (LPD). Both are options when you install Red Hat Linux
    9 on your computer. They are mutually exclusive; while you can run CUPS or LPD
    on your network, in either case, you can use the Red Hat Printer Configuration
    to manage local or remote printers on your Linux workstation.


    CUPS also includes a Web-based interface to SWAT (described in Chapter 3), which
    allows you to connect a number of different printers as a group. This group of
    printers is known in CUPS as a class. LPD has its own Web-tool. As with other
    GUI tools, CUPS and the Red Hat Printer Configurator are "front ends" that help
    you edit key-text configurations.


    Once you''ve configured a CUPS or an LPD printer, you can share it with other
    computers on your Microsoft Windows-style network through Samba. I''ll show you
    how to connect to these printers from Microsoft Windows and Linux workstations.


    This chapter provides only the briefest of introductions to CUPS and LPD. For
    detailed book-length information on CUPS, see the documentation available at www.cups.org/documentation.php.
    For detailed information on LPD, refer to the Printing HOWTO, available at www.tldg.org/HOWTO/Printing-HOWTO/index.html.


    > As of this writing, the successor to Red Hat Linux, Fedora Linux, will not include
    LPD software.


    ![](img/6ee4859e736a0839007ea9afb576c195_219_0.png)


    # Packages


    If you''re working with Red Hat Linux 9, you may have installed the Printing Support
    group described in Chapter 2, "Installing Linux as a File Server." If you installed
    the default packages in this group, you should have the packages needed to set
    up CUPS printers on your computer. Alternatively, if you upgraded or are using
    an older version of Linux, you'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'have the LPD system installed on your computer. For example, if you''ve upgraded
    to Red Hat Linux 7.x, LPD should still be installed on your computer.


    Whether you select CUPS or LPD, like that you''ve installed the same RPMs on each
    of the Linux print servers and Linux workstations on your network.


    In case, Red Hat lists configured printers in the /etc/printcap file. It''s connected
    to a Microsoft Windows-style network courtesy of the printcap name variable in
    the smb.conf file on the Linux print server.


    # CUPS packages


    As with other software in Red Linux, CUPS is organized and can be installed from
    Red Hat Package Manager (RPM) packages. These packages are organized as files
    with .rpm extensions on your Red Hat installation CDs. Remember, you can check
    to see if a package is installed by using the rpm -q packagename command. For
    example, the following command checks if the main CU is installed:


    ```

    $ rpm -q cups

    ```


    I''ve summarized the RPM packages associated with CUPS in Table 1. They are installed
    by default if you''ve installed the Red Hat 9 Supporting package group. The only
    explicitly CUPS-related package is the cups RPM. The remaining packages are generic
    and are also required if you''re using a different print service such as LPD.


    # Table 1. CUPS RPM packages.


    | Package | Function |

    | --- | --- |

    | 4Suite | XML tools, including Universal Resource Identifier (URI) references
    associated with CUPS |

    | Xfree86-font-utils | Utilities that support printer fonts |

    | a2ps | Filter that converts text to PostScript format |

    | cups | The main service for the Common Unix Print System (CUPS) |

    | ghostscript | An open-source implementation for PostScript |

    | hpijs | Optimized drivers for several types of Hewlett Packard printers |

    | ttprint | Filter that converts Chinese text to PostScript format |

    | redhat-config-printer | The Red Hat Printer Configurator—available in Text or
    GUI modes |


    If these packages aren''t already installed, you can install them on a Red Hat
    Linux computer in two ways. You can use the Red Hat Package Management utility
    or the rpm command. Both of these tools are covered in Chapter 2, "Installing
    Linux as a File Server."


    Key configuration files are associated with CUPS; these are stored in the /etc/cups
    directory. While a full discussion of these files is beyond the scope of this
    book, 1 describe'
