    # Other network services


    There are several other network services that you''ll find useful when installing
    them with Red Hat Linux. You can install them from the Package Selection window
    (see Figure 3). These packages are part of the various package groups.


    If you don''t need these services, don''t install them. If you do, you may provide
    a conduit for a cracker to get into your computer. You can always install these
    services later. Please note that additional information on these services is beyond
    the scope of this book.


    These services include:


    **Amanda:** The Advanced Maryland Network Disk Archiver regularly supports scheduled
    backups from a Linux server.


    **Apache:** Apache Web server is by far the most popular web server on the Internet.
    It allows you to set secure web sites, databases, scripts, proxies, and more.


    > For information on Apache from the viewpoint of a Windows administrator, see
    another book in this series, Linux Transfer for Windows Web Server Admin, 2003.


    ![](img/6ee4859e736a0839007ea9afb576c195_59_0.png)


    +   **bind:** The Berkeley Internet Name Domain (bind) provides the software that
    allows Linux to act as a DNS server. Also known as namemaster.


    +   **caching-nameserver:** A caching nameserver that can store recent requests
    from remote DNS servers.


    +   **CIPE:** Crypto IP Encapsulation provides secure connections between private
    networks through insecure networks such as the Internet. Also known as Virtual
    Private Networking.


    +   **Finger:** Administrative tool that queries users on local or remote computers.


    +   **MySQL:** An open-source database-management system. Can be used with Apache
    for Web applications.


    +   **InterNews:** A news server commonly used on Usenet, the bulletin board system
    associated with Internet message groups.


    +   **NIS:** The Network Information Service provides a common database of authentication
    files and more, as described earlier.


    +   **Postfix:** A common alternative to sendmail, which you can configure as
    a service for incoming and outgoing mail.


    +   **postgreSQL:** An open-source database-management system. Can be used with
    Apache for Web applications.'
