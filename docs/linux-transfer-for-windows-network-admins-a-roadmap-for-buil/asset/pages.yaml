    If you''re setting up workstations on a Domain, the first step is to recheck the
    computer serving as the Linux PDC. On that computer, you want to make sure that
    computer connects, account login scripts, and profiles are ready to connect. You''ll
    also need to record some basic network settings from the PDC to help you configure
