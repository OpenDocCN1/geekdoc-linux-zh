  md: '# Linux Transfer for Windows Network Admins


    It''s generally a good practice to add a comment to every network share; if the
    share is visible, the following comment identifies the share to your users.


    ```

    comment = Network Logon Service

    ```


    There is no required path for network logon scripts; feel free to change the path
    variable to the directory of your choice. Because a login to a Samba-based PDC
    directs a user to his or her home directory, many administrators replace this
    with path =home/netlogon.


    ```

    path = /usr/local/samba/lib/netlogon

    ```


    You may want to change this default to guest ok = no to prevent users without
    accounts from reading startup scripts.


    ```

    guest ok = yes

    ```


    If you don''t want individuals to rewrite their logon scripts, activate the following
    command:


    ```

    writable = no

    ```


    Even though the command is in the default Samba configuration file, there is no
    reason to activate it. If you do, it would disable file locks, which would allow
    multiple users on different computers to read the same file simultaneously.


    ```

    share modes = no

    ```


    There''s no need for users to browse the [netlogon] share. Crackers could use
    it to find a list of users on your Domain. They could create all sorts of trouble
    for your system. Thus, I recommend that you add one more command to prevent browsing:


    ```

    browseable = no

    ```


    # Roaming profiles


    Users who log in from different workstations on a Domain often prefer the same
    look and feel on different computers. This is where roaming profiles are useful.


    In Microsoft Windows, the user part of a registry can be stored in a file on a
    remote server. As administrators know, the file is normally NTUSER.DAT for Windows
    9x/ME computers and NT/2000/XP computers. When that user logs in to the Domain,
    the appropriate file is downloaded to the current workstation.


    We won''t use much of the standard [profiles] stanza from the smb.conf configuration
    file, because the following commands, if active, would leave profiles vulnerable
    to guests and other users on your Domain:'
