    # A swap partition


    Linux normally a different virtual memory structure from Microsoft Windows. While
    operating systems store less-frequently-used data in a swap file on one or more
    partitions, Linux normally uses a dedicated swap partition.


    Swap partitions can supplement the RAM on your system to some extent. Remember,
    because a swap partition is on a hard drive, access is much slower than if it
    were stored in RAM. If you observe slow performance and hear your hard drive working
    very hard, consider installing more RAM on your computer.


    The size of a swap partition is highly debatable. Generally, if you have a small
    amount of RAM, such as 128MB, you might consider a partition up to four times
    the size of your RAM. Conversely, if you have a large amount of RAM, such as 1GB,
    a swap partition of the same size should be sufficient.


    But as they may, your mileage may vary. The swap partition that works best for
    you depends on your hardware and the demands of other computers on your system.


    # RAID and LVM


    When creating partitions, two things to consider are security and flexibility.
    The right Redundant Array of Independent or Expensive Disks (RAID) can make sure
    that your computer keeps working even if a hard disk fails. RAID is covered in
    more detail in Chapter 9, "System Backup."


    Logical Volume Management (LVM) allows you to set up partitions in chunks. In
    that way, it is functionally similar to the third-party tools System Commander
    Magic, which can also resize Linux partitions that are formatted to the ext2 or
    ext3 filesystems.


    In this chapter, I briefly explain the process of creating RAID and LVM arrays.


    # 3. Understanding the Filesystem Hierarchy Standard


    Before you create a good plan for your partitions, you need to know how files
    and directories are organized. You can select appropriate Linux directories to
    mount on a partition, a RAID array, or an LVM volume.


    The Filesystem Hierarchy Standard (FHS) is the basis for organizing directories
    and files in Unix-style operating systems, including Linux. For more information,
    see www.pathname.com/fs. Not all of the directories in Red Hat Linux conform to
    the FHS. While the information in Table 3 may seem long, read through it. It can
    help you avoid mistakes that can stop your Linux computer.'
