  md: '# Selecting a distribution


    Strictly speaking, Linux is the kernel, the central module that serves as the
    interface between applications and computer hardware. A Linux distribution contains
    the other pieces of an operating system, which include several basic components:


    +   - Shell: A shell includes the commands and utilities that allow you to navigate,
    command, administer, and configure Linux. The shell allows you to interface with
    the kernel. Linux distributions often come with a number of shells, and you can
    choose which one you want to use according to your personal preferences. The default
    shell used in this book is Bash, the Bourne Again Shell.

    - Network services: Linux is a clone of Unix, which was designed concurrently
    with the precursor to the Internet. Thus, Linux is built for networking in the
    Internet and is well suited to manage workgroup and client/server networks.

    - Daemons: Linux services run in the background and start on demand. Most of these
    services like Samba, the daemon that allows Linux to communicate on a network
    of Windows computers, is smbd, in the /usr/bin directory. It works-in-hand with
    the Linux NetBIOS server daemon, mbnd. You can also activate the winbind daemon,
    winbind, if you want to use a Windows/2000 server database of user names and passwords
    for the Linux computers over your network. (Daemons usually have a trailing ''d''
    in the file name.)


    The graphical user interface (GUI) is built upon the program modules that are
    associated with the X Window. Strictly speaking, you don''t need a GUI to make
    Linux work like a Microsoft Windows Primary Domain Controller (PDC). Because most
    of you are more familiar with Microsoft Windows, I use GUI tools wherever possible
    in this book to configure Linux as a File and Print server.


    Linux distributions also include components that you do not normally find in other
    operating systems, such as fully featured office suites, graphical programs, multimedia
    applications, and more.


    Linux distributions are created by a number of different companies, organizations,
    and even volunteer groups. In this book I''ll focus on Red Hat, which is the leading
    Linux in the marketplace. There are a substantial number of options in the world
    of Linux.


    > Strictly speaking, Linux is the kernel, which allows the rest of the operating
    system to work with your hardware, allocate resources, and more. A number of the
    other components of the Linux operating system were developed by the Free Software
    Foundation, under the code name of GNU (GNU''s Not Unix). Thus, many people in
    the Linux community refer to the GNU/Linux operating system.


