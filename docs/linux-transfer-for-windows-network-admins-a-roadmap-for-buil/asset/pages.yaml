- img_proc: true
  md: 'While printers are not browseable to guest users, they are visible to authorized
    users in a Windows Network Neighborhood or My Network Places. Therefore, the following
    command does not matter unless you have guest users:


    ```

    browseable = no

    ```


    If you actually want to authorize guest users on your printers, change the following
    line to guest ok = yes.


    ```

    guest ok = no

    ```


    The print spool directory is read-only. Despite the following line, your printer
    can still send jobs to the /var/spool/samba directory. In Samba, writable = no
    works exactly like read = yes.


    ```

    writable = no

    ```


    The following command allows your printer to write jobs to the print spool directory,
    superseding the writable = no command.


    ```

    printable = yes

    ```


    # A dedicated printer


    It''s possible to limit the use of a printer to one or more users. For example,
    if you activate the following commands, you can set up a printer for the sole
    use of the user named Fred. The first couple of commands should be familiar now;
    they include a tag for the stanza and a comment for the printer:


    +   ; <fedsprn>

    ; comment = Fred''s Printer


    +   ; valid users = fred

    ; path = /home/fred


    Fred''s home directory is a good choice, by definition, Fred has access to this
    directory. If you use more than one printer, you''ll want to specify the printer
    assigned to Fred. Based on previous commands, the following command assumes freds_printer
    is the name of a printer in the /etc/tcpprintconf file.


    a printer in the /etc/tcpprintconf file. The following command keeps others from
    seeing fred_printer in the browse list.


    +   ; printer = freds_printer

    ; public = no'
