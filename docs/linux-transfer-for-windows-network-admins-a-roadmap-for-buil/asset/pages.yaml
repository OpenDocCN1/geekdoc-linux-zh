  md: '# Chapter 8: Administration and Management 237


    # more and less


    The more and less commands are similar. They allow you to review a longer text
    file, line by line or screen by screen. The more filename command is straightforward;
    it allows you to review the contents of a file, screen by screen or by line.


    ```

    $ more /etc/samba/smb.conf

    ```


    To scroll by line, press the Enter key; scroll by screen, press the spacebar key.
    Unfortunately, with the more command, you can only scroll forward in a file.

    As strange it is, the less command is more capable than more. When you run the
    following command, you can scroll up and down the length of the file.


    ```

    $ less /etc/samba/smb.conf

    ```


    You can use the Page and Page Down keys on your keyboard, as well as the arrow
    keys. In either case, you can search through the file as I described earlier with
    the man command. For example, if you''re looking for the add user script variable
    in the smb.conf file, type the following after you''ve run the more or less command:


    ```

    /add user script

    ```


    To exit from the more or less scrolling interface, press q on your keyboard. You
    can use this search method with files that are open in the vi editor.


    # head and tail


    The head and tail commands are intuitive commands. They allow you to look at the
    first and few lines in a text file.


    They are essentially opposite commands. While the head filename looks at the first
    10 lines in filename, the tail command looks at the last 10 lines in filename.
    You can change the number of lines viewed by head or tail. For example, the following
    command allows you to look at the last 20 lines in the NetBIOS log file:


    ```

    # tail -n 20 /var/log/samba/nmbd.log

    ```


    > Regular users don''t have permission to view Samba log files. You need to log
    in as the root user to view files in the /var/log/samba directory.


    # Creating and deleting files


    To administer a Linux computer from the command-line interface, you need to know
    how to create and delete files and directories. Some of the commands that you
    will include touch, cp, mv, rm, mkdir, and rmdir.


    > If you''ve logged in as the administrative root user in Red Hat Linux, there
    are safeguards. By default, the root user can''t overwrite an existing file with
    the cp, mv, or rm unless he confirms the change. For the remainder of this chapter,
    I''ll be running commands as the root user.'
