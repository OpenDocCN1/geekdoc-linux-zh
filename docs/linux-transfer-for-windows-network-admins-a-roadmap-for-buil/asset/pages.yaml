  md: '# Chapter 9: System Backup 269


    This particular configuration illustrates a RAID 5 array. I''ve included four
    partitions. The first three partitions (sda2, sdb1, and sdc1) are configured as
    part of the array. The last partition (sdd1) is reserved as a space. Because all
    four partitions are located on different physical hard drives, the failure of
    any one physical hard drive does not destroy the data that you store in the array.


    If you want to configure or reconfigure a RAID array after installing Red Linux,
    you''ll need skills that are beyond the scope of this book. Because it is an important
    skill for a system administrator, I''ll just outline the required steps here.
    A full description of the required steps is available in my book Mastering Red
    Linux 9, published by Syex.


    +   1. Install one or more physical hard drives.


    +   2. After booting Linux, configure the new physical hard drives in a partition.
    Make sure that the size of the partition is equal to the other partitions in the
    array. You can use either fdisk or parted for this purpose. Both utilities are
    located in the /sbin directory. I recommend fdisk as more reliable. In fdisk,
    make sure to set the partition type to fd, which corresponds to a “Linux auto”
    type.


    > NOTE If you use fdisk or parted, be very careful. A small mistake with either
    utility can easily destroy all of the data on any partition or hard drive on your
    computer.


    +   3. Format the partitions that you''ve created. For example, if you''ve created
    the /dev/sda and /dev/sdf partitions to expand the size of the array, you''ll
    need to run the following mkfs commands to format those partitions:


    ```

    # mkfs -j /dev/sda

    # mkfs -j /dev/sdf

    ```


    +   4. Configure the partitions in a RAID array. If you''ve already installed
    a software RAID array, all you need to do is modify the /etc/raidtab configuration
    file. Red Linux 9 includes a sample RAID configuration file in raidtab.sample,
    located in the /usr/share/doc/raidtools-1.00.3. You can edit this sample file
    and save it as /etc/raidtab.


    +   5. Create the RAID device. Typical RAID devices are based on file names such
    as /dev/md0 and /dev/md1. For example, if you''re creating the third RAID device
    on your system, you''d run the following command:


    ```

    # mkraid -R /dev/md2

    ```


    +   6. Format the RAID device. This part is fairly straightforward, because it''s
    analogous to the previous mkfs commands used to format individual partitions:


    ```

    # mkfs -j /dev/md2

    ```'
