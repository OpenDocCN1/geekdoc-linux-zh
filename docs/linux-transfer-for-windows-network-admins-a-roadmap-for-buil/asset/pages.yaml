  md: '# 66 Linux Transfer for Windows Network Admins


    into slightly different categories, as you can see by reviewing the main user
    name/password authentication file, /etc/passwd. There are three categories of
    users:


    +   - The administrative user on a Linux computer is root. Because this book is
    for administrators, I assume you have access to this account.

    - Services are associated with their own user names, such as mail, news, and apache.
    You can see a full list in your /etc/passwd file.

    - Individual users have their own accounts.


    In Red Linux, each user gets an individual (UID), which by default starts with
    500. Each user is assigned to his or her group. For example, on my Red Linux computers,
    I normally set up a regular account with a user name of mj. Red Linux by default
    assigns mj to a group name mj. This is the User Private scheme, which is designed
    to keep individual users away from the files of others and is commonly used by
    Internet Service Providers (ISPs). As you will see in Chapter 4, "Setting Up Your
    File Server’s Users," you can use the Red Hat Manager to set up users with names,
    home directories, account and password rules,


    You''ll also see the details on how to make the Red Hat User manager with a Samba
    user database. But before you can create Samba users for your Windows network,
    you need to know how to configure a Samba server.


    # Configuring a Samba server


    You probably installed the Samba RPM packages when you installed Red Hat Linux.
    You may be able to get more-to-date versions of Samba from the Red Hat FTP site
    or from the Rawhide developers. For more information, see Chapter 2, "Installing
    Linux as a File Server." Once Samba is installed, you will want to understand
    the key configuration files. If your Samba server is on a firewall, you need to
    make sure Samba messages can get through.

    Then you can configure Samba itself by using one of two GUI tools: the Samba Server
    Configurator or the Samba Web Administration Tool (SWAT). Later in this chapter,
    I will show you how to edit the Samba configuration file directly from the command-line
    interface.


    # Getting Samba


    Here''s the easiest to see if you successfully installed the RPM packages that
    you need. Run the following command:


    ```

    # rpm -qa samba

    ```


    If successful, you''ll see the following packages in the output. You might see
    different version numbers; these packages are from the Hat Linux 9 installation
