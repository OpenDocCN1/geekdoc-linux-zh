    and developers adapt to Linux. Elizabeth Zinkann is a marvelous technical editor,
    superb Linux administrator, and great friend. As a copy and project editor, Jeana
    Frazier has done a marvelous job keeping the book on track. Lori Lathrop has developed
    a great index for this book.


    I hope; therefore, I can live.


