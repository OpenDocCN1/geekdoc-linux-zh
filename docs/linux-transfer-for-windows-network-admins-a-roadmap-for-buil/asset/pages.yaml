  md: '# Setting a grace period


    Based on the example in this chapter, the default grace period is seven days.
    The soft limit is 110MB and the hard limit is 100MB. If I store 100MB in the /home
    directory, the clock on the grace period starts. I need to get under 100MB hard
    limit before the grace period ends. To open the file that sets the grace period,
    use the following command:


    ```

    # /usr/sbin/edquota -t

    ```


    The grace period is shown in Figure 8. As you can see, it''s a simple file. If
    you want to change the grace period, you should note there is no space between
    “7” and “days” under the grace period columns. If you add a space, quotas will
    no longer work.


    | Filesystem | block grace period | Inode grace period |

    | --- | --- | --- |

    | /dev/sdb2 | 7days | 7days |


    Figure 8. Grace periods. The Filesystem is the partition associated with the /home
    directory. You can verify it with the following command:


    ```

    # e2label /dev/sdb2

    home

    ```


    The Block period is associated with the space limits for each user. If you want
    to change the grace period, take the following steps:


    +   1. Move the cursor to the number.

    2. Enter the cw command. This should delete “7days”.

    3. Enter the period of your choice, as 5days. Remember, don’t add a space between
    the number and period.

    4. Press the Esc key.

    5. Enter the wq command to write your changes to the grace period.


    > If you want to exit the vi editor without saving, use the q! command.


    # Activating quotas


    Quotas may not be help unless you can apply them to a group of users. Fortunately,
    this is easy with the edquota command. For example, the following command applies
    the same quota that you configured for user jkp to the other users in this list:


    ```

    # edquota -up jkp gabe mj padma waymon diane j nc vf wf

    ```'
