  md: '# Chapter 8: Administration and Management 241


    # Adding information to the end of a file


    Here''s an example where you can use the cat command to add the previously described
    aliases to a user''s .bashrc configuration file. Once added, the aliases can help
    prevent accidental file overwrites.


    If you want to apply the previously described aliases to user''s home directory,
    run the following commands as the mj or root:


    ```

    # echo "Use information to the end of the file" >> /home/mj/.bashrc

    # echo "alias=rm -i" >> /home/mj/.bashrc

    # echo "alias=rm -i" >> /home/mj/.bashrc

    # echo "alias=rm -i" >> /home/mj/.bashrc

    ```


    The echo command is almost self-explanatory: It echoes the information in quotes.
    The double forward arrow,>>, takes the information and adds it to the end of the
    noted file. Be careful: if you use a single forward arrow,>the contents within
    the quotes will overwrite the entire file.


    Alternatively, if you entered the same information in a file, you could use the
    cat command to read the contents of the file to the end of mj''s bashrc file.
    For example, if the file name is alias, you''d use the following command:


    ```

    # cat alias >> /home/mj/.bashrc

    ```


    To make this work, you need to know how to use text editors. While you could do
    this in the GNOME text editor described in Chapter 3, you also need to know how
    to do it with a command-line text editor such as vi. If you ever have to use Red
    Hat''s rescue mode, you won''t have access to the GUI.


    # Text editing


    As a Microsoft user and administrator, you''re probably quite familiar with using
    editors in a GUI. Chapter 3 shows how to use the GNOME text editor. That''s not
    enough, because you may need to know vi to rescue your Red Hat Linux system. The
    vi editor is rich with commands; this provides the most basic of instructions.


    As an example, I''ll use vi to create the alias1 file described in the previous
    section. Because I want to append contents of this file to the .bashrc file of
    a number of users, I''ll do so as the administrative root user. Here''s the procedure:


    +   1. Open a command-line interface. Log in to text mode, or right-click on the
    GUI desktop and click Terminal in the pop-up menu that appears.

    2. At the command line, type in vi alias1. This starts the vi editor in command
    mode, with a prospective filename named alias1. Linux does not actually create
    the file until you save it.

    3. Type the i command. This toggles vi into insert mode. You can then type in
    the desired text. In Red Hat, you can use the standard keys on the keyboard to
    enter text and reposition the cursor.

    4. When you''re done editing text, press the Esc key. This returns vi to command
    mode.'
