  md: 'If you''ve specified security = server or domain, you''re passing along a user
    name and password request to a different server, presumably a PDC. You''ll then
    want to make the PDC in some way by activating one of the following commands:


    ```

    # password server = My_PDC_Name [My_BDC_Name] [My_Next_BDC_Name]

    # password server = *

    # password server = <NT-Server-Name>

    ```


    The first command can search the PDCs or BDCs (Backup Domain Controllers). If
    you want a backup to a Linux PDC, read the review of backups in Chapter 9, “System
    Backup.\ If you''re setting up a Samba Domain member server, you can use this
    command to look through the user name and password database on Microsoft PDCs
    and BDCs.


    Once you''ve set up Samba as a PDC, backup controllers are rarely necessary. Linux
    is so more reliable than Microsoft Windows that reboots are rarely required. If
    you absolutely need to have a BDC, read the unofficial Samba BDC HOWTO document
    at ut3.samba.org/samba/ftp/docs/samba-BDC-HOWTO.html.


    The second command searches the computers on the network for a Domain controller
    with the authentication database. The third option names a server, which does
    not have to be a Domain controller.


    One of the problems with mixing Linux in a Microsoft Windows network is the sensitivity
    of passwords and user names. Linux passwords and user names are case-sensitive.
    Microsoft Windows 9x/ME passwords and user names are not. If the following commands,
    if active, check the uppercase and lowercase versions of passwords and user names
    up to eight characters:


    ```

    ; password level = 8

    ; username level = 8

    ```


    Activating these commands can affect the performance of your network. It means
    that uppercase and lowercase variations of each password and user name are checked
    if someone logs in to your server.


    As discussed, passwords are encrypted by default. The user names and passwords
    that someone may use to log in to your Samba server (or PDC) are normally stored
    in a specific file, documented by the following commands:


    ```

    encrypt passwords = yes

    smb passwd file = /etc/samba/smbpasswd

    ```


    If you have to computers running Windows 95 (before OSR2), Windows NT 4 Workstations
    (before Service Pack 3), or Windows for Workgroups (3.11) on your network, set
    encrypt passwords = no. You’ll also need to deactivate encryption on all other
    computers on your network. Alternatively, you can install Service Pack 2 (or later)
    to enable encryption on pre-OSR Windows 95 computers.'
