    # Basic steps to installing Red Hat Linux


    Installing Red Hat Linux is not difficult. Except for what I''ve just covered
    in configuring partitions, I think anyone could install Red Hat Linux on their
    computers with the guidance from this section and the next chapter. The steps
    required to install Red Hat from a CD are slightly different from those you use
    to install this operating system from a network source.


    # Local installation steps


    When you start the Red Hat installation process, the basic steps are straightforward.
    In most cases, the installation program automatically detects your hardware; all
    you need to confirm the selection. The following procedure is based on Red Hat
    9, but it hasn''t changed greatly from previous versions of Red Hat. My previews
    of future versions of Red Hat suggest that minor changes are coming. So if you
    are not using Red Linux, the 9 steps aren''t exact.


    Remember, these are just the first installation steps from a CD; I describe the
    guts of the installation process in more detail in Chapter 2, “Installing Linux
    as a File Server.”


    +   1. Set your computer''s BIOS to boot from CD.


    > If you can''t boot from CD, you can create a boot floppy. Run the RAWWRITEN.EXE
    utility in Microsoft Windows; it''s on the first Red Hat installation CD, in the
    /dosutils/rawwritein directory.


