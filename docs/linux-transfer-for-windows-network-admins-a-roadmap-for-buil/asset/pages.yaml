  md: '3. Every RPM is supposed to include a description. You can find the description
    for the httpd package by using the following command. Note how I run this command

    without the revision number:


    ```

    # rpm -qi httpd

    ```


    Now that you know how to determine what''s installed, you can make your own decisions
    about whether to uninstall or deactivate a service. I''ve noted several services
    in Table 3 that can be safely uninstalled or deactivated.


    # Uninstalling a service


    If you know you''re never going to set up a Web server on the local computer,
    you can uninstall the associated packages. The same is true for the other services
    with scripts in the aforementioned directories.

    It''s easy to uninstall a package. For example, if you want to uninstall Apache,
    just run the rpm command with the name of the package (httpd):


    ```

    # rpm -e httpd

    ```


    But there can be problems. If other packages depend on what you''re trying to
    uninstall, the attempt will fail. But you might get a message about dependencies.
    An example of this is shown in Figure 12.


    ```

    [root@localhost]# rpm -e httpd

    error: Failed dependencies:

    d needed by (installed) redhat-config-httpd-1.0.1-18

    [root@localhost]# rpm -e httpd redhat-config-httpd

    [root@localhost]#

    ```


    Figure 12. Uninstalling Apache and a dependency.


    There is a simple solution. As shown in Figure 12, you can use the same command
    to uninstall both packages simultaneously. For the configuration shown in Figure
    11, I''ve repeated this command to uninstall the DNS (bind), sendmail, lrda-utils,
    and isdn4k-utils RPM packages. You can repeat this command for the RPM packages
    of your choice.


    # Deactivating a service


    If you''re planning to use a service in the future, you can deactivate it of instead
    uninstalling it. Crackers can''t get in a deactivated service. Because this is
    a book for Microsoft Windows administrators who are coming to Linux, Start with
    the GUI, but in this case, the Service Configuration utility. Start it by clicking
    Main Menu | System Settings | Server Services | which opens the Service Configuration
    window shown in Figure 13.

    In the case shown in the figure, Apache is running and is set to start the next
    time you boot your computer. If you want to deactivate Apache, you need to take
    the following steps:


    +   1. Highlight the service in question and click Stop.


    +   2. Deselect the service. This ensures that Linux does not start the service
    the next time you boot.'
