    # Backup options


    This section provides a high-level overview of the hardware backup options available
    for Linux and Windows. Much of the hardware is expensive, and the commands depend
    on what you might buy. A detailed discussion of these options could easily fill
    a book three times this size.


    # Media options


    Choosing the media you might want to back up your data depends on the amount of
    data that you want to keep safe. Individual users who work with text files may
    need only the space associated with a 1.44MB floppy disk. The same may hold if
    you''re backing up critical configuration files from the /etc directory, such
    as initab, fstab, grub.conf, and the files in /etc/amba subdirectory.


    > The /etc/grub.conf file is actually linked to the /boot/grub/grub.conf. You
    can open and edit either file name; the result is saved in /boot/grub.conf.


    A number of types of media are available that you can use with a Linux computer.
    The variations are endless; I cite only the "typical" size for each media type:


    +   - Zip drives (from lomega) are normally 100MB and are suitable for backing
    up other critical files such as the kernel from /boot directory. If you remember
    from Chapter 1, the standard Red Linux installation allocates 100MB to the /boot
    directory.


    +   - Bernoulli drives normally include 230MB of space, which might be enough
    to back up user files from the /home directory on some smaller networks.'
