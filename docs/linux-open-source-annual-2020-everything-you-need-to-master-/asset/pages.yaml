- pgno: 172
  md: '# Productivity


    Put some order into your life with these finance, web filtering and admin tools.


    # OSMO


    A personal information manager (PIM) helps you keep track and organise all the
    information coming in from various sources. Osmo is a lightweight PIM that helps
    manage appointments, tasks, contacts and notes. The application has a straightforward
    and integrated interface with four tabs on the top for Calender, Tasks, Contact
    and Notes. The program lacks many menus, but the action-linked buttons at the
    top change as you switch between the four components. The Calender pane provides
    a simple functional calendar along with some related information such as the week
    number and the number of days to the end of the year. You can double-click a date
    to add notes or right-click a date to add a task.


    The options for defining a task in Osmo are housed within a basic and an advanced
    tab. Use the basic tab to define the due date and time and assign the task a priority,
    while the advanced tab enables you to mark the task as recurrent and define relevant
    properties. You can store the address of your contact using the Contacts pane.
    It sports additional features including a search function, a birthday browser,
    as well as the ability to point out the address of a contact on Google Maps. The
    Notes pane makes it possible to jot down text using rich text editing functions
    and you can optionally encrypt all your notes using a password.


    http://clayo.org/osmo


    # FOCUSWRITER


    Scribe without distraction with the FocusWriter text editor, which runs full-screen
    and uses an auto-hide menu for a clean writing mode. The editor supports the popular
    text formats and has basic support for ODT files as well.


    The primary goal of FocusWriter is to enable you to focus on the writing, so while
    the tool might lack some of the dexterity of the mainstream text editors, it has
    several unique features that are more tuned towards that objective. You can set
    alarms to trigger after a certain period has elapsed, or at a particular time
    and also set yourself targets in FocusWriter. An interesting feature is Focused
    Text, which fades out everything except the section you''re typing - a whole paragraph,
    a block of three lines, or just the current line.


    https://gotcode.org/focuswriter


    # GATESENTRY


    A simple web filter, GateSentry works on Linux as well as the Raspberry Pi. It''s
    easy to deploy and configure. GateSentry authenticates users and filters traffic
    by websites, content type as well as time. The simple proxy server can display
    data consumption statistics and can also enables you to remotely disable a user''s
    access.


    http://gatesentry.lister.abdulrahimfan.com


    ![](img/7a0a282248f9658f0c87e55744c797b6_172_0.png)


    GateSentry can also filter traffic over HTTPS once you install its certificate
    on your devices.


    # KIMAI V2


    Kimai tracks work times and prints out a summary of your activities. It can be
    used for a single user or multiple ones and can manage multiple customers, projects.
    The program has a browser-based dashboard that you can fiddle around with using
    the demo installation on the project''s homepage.


    https://v2.kimai.org


    # SIMPLESCREEN RECORDER


    Contrary to its name, SSR is flush with features and gives its users a good amount
    of control over the screenshot. The tool can record the entire screen and also
    enables you to select and record windows and regions on the desktop.


    http://maartenbaert.be/screenscreencorder


    # TURTl


    A note-taking tool with a focus on privacy, Turtl has an impressive list of features.
    It can create different types of notes and makes it possible for you to attach
    images and other files to the notes that you''ve created.


    https://turtlapp.com


    # DICTION


    A CLI utility, Diction helps flag words that are commonly misspelt. It can create
    better copies by flagging words that are commonly associated with beginner''s
    mistakes and to even suggest better wording.


    www.gnu.org/software/diction


    # TASK COACH


    A simple to-do manager, Task Coach simplifies the process of defining and following
    up on tasks. You can also use the tool to assign a priority to tasks along with
    a completion date and an optional reminder.


    www.taskcoach.org


    # ECONOMIZE


    Economize is a personal expense manager with a clean interface and all the features
    you need to help organise your finances. The program can track single or multiple
    accounts and fix budgets.


    https://economize.github.io


    # STRETCHLY


    A simple app that pops in to remind you to take a break. It has a couple of preset
    break intervals and the break windows share ideas to help you relax. You can control
    the tool from its tray icon.


    https://hovancik.net/stretchly'
