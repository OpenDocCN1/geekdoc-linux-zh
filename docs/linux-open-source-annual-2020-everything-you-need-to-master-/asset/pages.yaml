    These take lots of different rectangles and put them all in the right places in
    the right order to make a coherent desktop. Lately they might also apply a bunch
    of shadow or transparency effects, and also manage timings to avoid screen tearing.
    Wayland hopes to be – and in fact already is – a slimmer, simpler way of pushing
    pixels. With Wayland, compositor, server and window manager are all more or less
    unified.


    # » TROUBLESHOOTING


    In our LXF243 interview with Collabora graphics veteran Daniel Stone, we learned
    that there are two approaches to implementing a Wayland compositor. Either you
    have a single unified environment that handles everything (menus, docks, desktop
    add-ons), or you do things piecemeal: a small compositor program, with auxiliary
    utilities for handling everything else. We''ll look at both approaches here.


    There are all sorts of reasons why you might not be able to start a Wayland session.
    Most commonly, it''s because you''re using the proprietary Nvidia driver – although
    this won''t be the case with a fresh install of Fedora, since Fedora doesn''t
    include any proprietary blobs. Recent versions of GNOME and KDE, from Plasma 5.15
    on, actually do support the driver''s EGLStream APIs (all the other drivers use
    GBM), but whether or not it works is going to depend a lot on your particular
    hardware and driver version. One solution is to use the free Nouveau driver, although
    this is not a good idea if you like serious gaming.


    The latter approach is quite similar to the X way of doing things; even if you''re
    running a unified desktop environment like GNOME, you have an X instance running,
    a Mutter instance running on top of that, and all sorts of little things running
    alongside. GNOME has generally been considered the best place to try


    A strange issue we witnessed on Arch Linux, using Intel graphics – which has supported
    Wayland for ages – was that the 1915 module had to be loaded as part of the initrifacts
    in order for Wayland to start correctly. As a bonus, with this done, the system
    switched to its native resolution right at the beginning of the boot process,
    making for a much slicker-looking startup experience. Such variety and frippiness,
    we know. For other issues, check the logs with: `$ journalctl -b -e` or email
    our Wayland warrior and Answers King Neil Bothwick at: lxf.answers@futurenet.com.'
