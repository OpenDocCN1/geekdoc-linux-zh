  md: '# # PROTECT YOUR PRIVACY


    The government wants your data, but they don''t understand tech. Facebook and
    Google want your data – and they do. **Jonni Bidwell** tries to disappoint them
    all.


    ![](img/7a0a282248f9658f0c87e55744c797b6_51_0.png)


    A s our lives increasingly take place online, traditional definitions of ‘privacy’
    seem to be fast eroding. Instead of ‘what you do in private shouldn’t be anyone
    else’s business’ (unless you’re hurting someone), perhaps we should now think
    in terms of ‘suitably decorated government officials can access your data at any
    time, but don’t worry because they’ll only do that to prevent crimes’.


    The UK’s disastrous Investigatory Powers Act, passed in 2016, goes some way to
    enshrining this dark pattern. ISPs are now obliged to keep a one-year record of
    everyone’s online activities, and they regularly interfere with DNS queries to
    enforce content blocks or satisfy other nebulous agendas. Most websites use encryption
    now (which frustrates efforts to eavesdrop on your browsing), but think about
    all the information you voluntarily hand over to social media titans and search
    engines, both of which we could reasonably


    describe as ‘advertising platforms’, on a daily basis. We tell them where we are,
    what we had for breakfast, our political and moral ideologies, whether we prefer
    dogs or cats. *(cats! –Ed)* All this information can be used to profile you. Even
    if you stopped using social media – which comes with its own downsides – just
    using the web can, thanks to browser fingerprinting and dodgy extensions, allow
    these advertising platforms to track your activities across sites.


    The Android-iOS duopoly further erodes traditional notions of privacy, since now
    your texts and calls (or at least the metadata about them) can all be correlated,
    via your AppID or Google account, with your activity on the interwebs. And let’s
    not forget the GPS module in your phone that gives these titans up-to-the-second
    data about your location. There’s no need to go full foil-hat (or ‘Tux tank’)
    to take back your privacy. A few simple tweaks to your online habits can go a
    long way, letting you communicate privately and keeping the snoop at bay.'
