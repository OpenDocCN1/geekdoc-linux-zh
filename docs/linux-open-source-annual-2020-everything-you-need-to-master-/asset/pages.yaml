    \n# Internet of terrible Things\n\nShadowy agencies snooping up data from the\
    \ wire is one thing; being silently coerced into an ecosystem where you volunteer\
    \ data to advertisers is another. From a privacy point of view, an even worse\
    \ thing is the world of voice assistants such as Amazon’s Alexa, Apple’s Siri\
    \ and Google’s imaginatively titled Assistant.\n\nIn April, Bloomberg revealed\
    \ that Amazon employs a small army of low-paid humans spread across Boston, Romania\
    \ and India to aid the machine-learning process. Their mission is to annotate\
    \ recordings and very often, thanks to devices more- hearing their wake word,\
    \ these people are getting entirely unintended glimpses into Alexa users’ private\
    \ lives. Pretty creepy. In all likelihood Apple and Google do exactly the same\
    \ thing – machine learning does some help, though no all.\n\nBesides that issue,\
    \ all your audio searches and textual transcriptions are held by the companies.\
    \ They offer an option to ‘delete’ them, but that just dissociates the recording\
    \ from the account: the recording itself still lives on as part of a massive vocal\
    \ corpus. If you must use a Voice Assistant, we recommend the open source Mycroft,\
    \ as featured in LXF249. Microsoft doesn’t store any data on its servers unless\
    \ you specifically opt in. That voice data, Mycroft plexes, will only be used\
    \ to improve the product, not sold on to advertisers.\n\nIoT devices, even open\
    \ source ones, can be hacked through – and thanks to poor design choices, regularly\
    \ are. With that in mind the idea of showing a network stack in your fridge, front\
    \ door or first-born doesn’t seem so hot. All of these things suffer from unprecedented\
    \ glimpses into their users’ lives, quite literally in the case of home security\
    \ cameras. Smart utility meters claim to save you money, but what good is that\
    \ if they can be hacked?\n\n![](img/7a0a282248f9658f0c87e55744c797b6_54_1.png)\n\
    \nIf you must have a voice assistant it may as well be an open source one such\
    \ as Mycroft, but consider turning it off when it’s not needed.\n\nMAT in Tails\
    \ is not much to look at, but you don’t need to look cool to stay covert. And\
