  md: '![](img/7a0a282248f9658f0c87e55744c797b6_100_0.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_100_1.png)


    > LMMS has a brilliant method for composing MIDI, plus some crazy instruments
    including a classic Gameboy and even a Commodore 64.


    of every instrument within the drumkit, and if you want to preview a sound, just
    click an instrument.


    The Pattern Editor is pretty straightforward, but something that may throw you
    off is the Size function. Size is set to 8 by default, and the default ''resolution''
    is eighth notes (quavers), so the Size function will be set to eight eighth notes
    to make a full 4/4 bar. That''s slightly confusing at first, but if you want to
    make a pattern in 5/4, the Size should be 10, and if you want something in 7/8,
    the Size would be 7 – and so on.


    If eighth notes won''t suffice, and if you need smaller subdivisions, you can
    change the Resolution to 16th notes (semi-quavers), or go right down to 32nd or
    even 64th notes. If you need something in a triplet-based subdivision (for blues
    or jazz, for example), you can choose the same numbers, but with a T – such as
    8T for eighth-note triplets.


    Moving into the Song Editor, in the top half of the screen, there is a list of
    patterns on the left. Click a different pattern from the list to open another
    pattern below in the Pattern Editor; it''s a good idea to name each pattern –
    just right-click and open Properties to change it.


    On the right is a giant grid with empty squares. Each square represents a bar
    of music: clicking each square will sequence that bar of sound the song reaches
    that point in time. For anyone into highly complex percussion arrangements, multiple
    patterns can run together.


    If you don''t like the default drumkit (GMKit, which admittedly is pretty mediocre),
    there should be a selection of alternative drumkits available as a package in
    your repositories. To the right of Hydrogen''s screen is the Sound library tab.
    This lists whichever kits are installed; to load one, right-click on the title
    of the drumkit and click Load.


    Once you''ve finished your drum arrangements, you can export your project as an
    audio file to be used in a recording suite later – speaking of which, it''s time
    to look at these...


    # PLUG-INS, MIDI AND SOUNDFONTS


    While your package manager is open we recommend installing just about every audio
    plug-in available (search for LADSPA, DSSI, VS, and LV2) – and you should install
    jack-keyboard if you plan on recording MIDI without an external device.


    Every plug-in you install will augment your system''s functionality. While we
    would normally be selective about what to install, plug-ins aren''t massive, so
    unless disk space is at a premium you may as well install more than one you can
    find!


    Note that MIDI by itself doesn''t have any sound: MIDI is merely a set of standardised
    instructions for what sounds to play and when. Therefore, if you try to run raw
    MIDI on your system, you will be greeted with silence. MIDI-based hardware such
    as keyboard synthesisers use internal recordings of instruments captured at specific
    pitches to create a whole sound spectrum.


    In the modern audio world we use soundfonts: audio files of recorded instruments
    that can be used by your sound card, played according to MIDI instructions. Some
    soundfonts are tiny, whereas others can be elaborate recordings of multiple gigabytes.


    However, SoundFont (note the capitalisation!) is a commercial term for a file
    format that is supported in hardware by products like Creative''s Sound Blaster
    range. Popular software synthesisers like FluidSynth bypass the need for such
    dedicated hardware, allowing you to run general soundfonts through any sound card.
    If you would prefer to avoid soundfonts entirely, Yoshimi comes with its own set
    of sounds. For a list of free soundfonts and plug-ins, see: https://lms.io/documentation/Useful_resources.


    ![](img/7a0a282248f9658f0c87e55744c797b6_100_2.png)


    Hydrogen gives minute control for intricate drum arrangements, and can be extended
    with JACK for amazing drum sounds.'
