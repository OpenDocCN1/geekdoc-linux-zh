  md: "# Tools for composition\n\nNo matter how you might prefer to create songs,\
    \ there's a bit of software for you.\n\n![](img/7a0a282248f9658f0c87e55744c797b6_99_0.png)\n\
    \n**T** he app called *Linux Multi Media System* (*LMMS*) has become the daddy\
    \ of loop-based music making and easy MIDI editing. The important bit of *LMMS*\
    \ is the sidebar on the left, which has samples, file management and instrument\
    \ plug-ins – and instrument plug-ins are what really power *LMMS*. Included are\
    \ a bunch of weird instruments and different synthesisers, but we'll be focusing\
    \ on the component called **SF2 Player**, which runs MIDI soundfonts, enabling\
    \ you to compose MIDI-based music without external hardware.\n\nIf you drag **SF2\
    \ Player** onto the Song-Editor window it will create a new track. Click the track's\
    \ **SF2 Player** button and a new plug-in window appears, with a piano and sound\
    \ controls. If you click the piano now, no sound will come out of it – first you\
    \ need to load a soundfont. In the middle of the window are two menus: **FILE**\
    \ is for choosing the soundfont, and **PATCH** is for choosing which instrument\
    \ to use (and there may be many to choose from). Once you've loaded your soundfont,\
    \ clicking a piano key should make a noise, and your computer keyboard will act\
    \ as a substitute piano.\n\nThe Song-Editor has a collection of nodes for activating\
    \ notes or samples: left-clicking enables a node, middle-clicking disables it\
    \ and double-clicking opens the Piano-Roll to create new tunes. In the Piano-Roll\
    \ you either record notes on the fly, or draw them by hand. Clicking on the piano\
    \ keys on the left previews each note, and as long as the Piano-Roll is in Draw\
    \ mode (click the pencil icon if it isn't), clicking in the blank field creates\
    \ a note that looks like a solid bar.\n\nIf the note is the wrong length, you\
    \ can click and drag the right of the note to make it longer or shorter. If you've\
    \ played the wrong note, click and drag the note up or down the piano to adjust\
    \ it, or move it into another octave. To delete a note, just right-click.\n\n\
    If drawing out riffs isn't for you, you can use your computer keyboard to play\
    \ notes in real time, and if you press the record button, *LMMS* will transcribe\
    \ the notes for you on the fly. The beauty of *LMMS* is that you don't have to\
    \ choose between one mode or the other – you can combine both methods: drawing\
    \ notes by hand, or playing them live. If you electe a note while recording, you\
    \ can redraw it later.\n\nWhether you like into electronic music or not, *LMMS*\
    \ is an excellent way to navigate songs and sequence musical arrangements. *LMMS*\
    \ may not be as a recording suite, but for those happy enough using synthesised\
    \ instruments and virtual drumkits, there's genuinely all you need to construct\
    \ a song without having to buy extra hardware.\n\n# >> AUDACITY  \nwww.audacityteam.org\n\
    \nOver the page we'll be looking at fully fledged Digital Audio Workstations (DAWs),\
    \ and these programs can be daunting to say the least! If you just want to do\
    \ some basic multi-track recording (that is, layering one take over another) without\
    \ the complexity of a full DAW, *Audacity* is your best bet.\n\nAlthough it's\
    \ technically possible to do it, *Audacity* isn't really suited to multi-channel\
    \ digital recording, such as digital drum recording with lots of mics, as the\
    \ interface is really geared around mono and stereo.\n\nHowever, it's brilliant\
    \ for home demo and has become something of a defacto standard for simple audio\
    \ editing as it is intuitive enough for most people to navigate, while being powerful\
    \ enough to do some serious wave editing.\n\nThat said, *Audacity* has become\
    \ more complex lately, and it's more likely you'll need to troubleshoot something\
    \ than in times past. For example, if you want to record a new stereo track, press\
    \ Shift+R instead of the Record button, as now *Audacity* keeps writing to the\
    \ end of the last track you recorded.\n\nIf *Audacity* in its current form isn't\
    \ to your taste, it's worth trying a build from a couple of years ago instead.\
    \ For a proper tutorial to the program, see tutorials in LXF213, LXF228 and LXF249.\n\
    \n![](img/7a0a282248f9658f0c87e55744c797b6_99_1.png)\n\n> *Audacity is great for\
    \ taking down easy demos when you're still strilling and can't bothered with a\
    \ big scary DAW!*\n\n# Hydrogen  \nhttp://hydrogen-music.org\n\nUnlike looping\
    \ programs, *Hydrogen* is made by drummers for drummers, and is a great way to\
    \ experiment with beat-making – even for people who have never held drumsticks.\
    \ If you want to compose easily charted percussion arrangements across an entire\
    \ song, *Hydrogen* is the way to go.\n\nPerhaps the easiest place to start is\
    \ the bottom half of the screen, with the Pattern Editor. This is where you write\
    \ drum bars, and the numbers along the top indicate which beat your note sits\
    \ on. On the left is a list"
