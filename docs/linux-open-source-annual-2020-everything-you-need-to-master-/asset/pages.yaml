  md: '# Roundup


    Flowblade » Kdenlive » LiVES » OpenShot » Shotcut


    ![](img/7a0a282248f9658f0c87e55744c797b6_147_0.png)


    Shashank Sharma

    By day Shashank is a New Delhi trial lawyer, but by night he’s an open source
    vigilante!


    # Video editors


    Desperate to turn his amateur attempts at shooting film into praise-worthy masterpieces,
    **Shashank Sharma** tries his hands at video editors.


    # HOW WE TESTED...


    We’re running the latest offering for each of the tools featured in this Roundup
    on top of a quad-core machine with 12GB RAM. Apart from vast amounts of RAM and
    processing power for optimum performance, you’d also need plenty of spare disk
    space to horse around with video editors.

    All the projects are fairly popular and many distribution feature them in the
    software repositories. Some of the tools featured here also ship Snap and AppImage
    packages for easy installation. Apart from installation, documentation is vastly
    important to help new users acclimate to the vast feature set contained within
    each of these projects.

    We’ll discuss some of the most useful features these tools offer and whether their
    interface is intuitive or if it gets in the way of you jazzing up your home videos.
    While cellphone cameras are all the rage, many people still use dedicated devices
    to shoot film, so we’ll also consider the different file formats supported by
    these tools.


    ![](img/7a0a282248f9658f0c87e55744c797b6_147_1.png)


    Whether it’s still photography or a film recording some minuteiae of the daily
    life for posterity, some people just have a natural knack for framing shots. They
    can make even a plastic bag blowing in the wind look mesmerising. With just a
    dash of creativity but far more patience, you too can transform your amateur captures
    into professional-grade videos, complete with a background score, if you like.
    But this is only possible if you’re willing to put in the time and effort it takes
    to master these behemoth, feature-rich projects.

    We’ve selected the tools that are easy to use for new users, yet offer enough
    features to be of interest to skilled video editors. With ever-decreasing prices
    of consumer hardware, it’s no surprise that these resource-intensive tools have
    continued to find favour with the developers and users over the past 15 years
    or more. The youngest application in our list, Flowblade, was first released in
    2011, while the oldest, Kdenlive and LiVES, have both been around since 2002.

    Using these tools, you can add effects to your videos, cut out unnecessary footage
    or out of focus parts, move stuff around, and otherwise splice or combine different
    clips into a single meaningful narrative. The world is your editing oyster!'
