- pgno: 118
  md: '# # Office suites

    ## The Verdict


    ![](img/7a0a282248f9658f0c87e55744c797b6_118_0.png)


    The choice of Roundup subjects over the past several issues has left us to conclude
    that perhaps one application might not cater to all your needs. This was true
    for the image and video editors, and office suites aren''t an exception either.
    If you can spare the resources, you might find yourself preparing presentations
    on one suite''s application, while relying on another for your spreadsheets.


    With the exception of the podium finishers, the other office suites alternately
    disappointed and impressed us in equal measure. **WPS Office** is a highly capable
    suite, and we would optimistically advise users to give it a chance, but the lack
    of ODF support, with no word on when if ever it will be available, sealed its
    fate for this Roundup. Never mind that it is fast and responsive, and fun to work
    with. The lack of many useful features on the Linux edition also goes against
    it.


    **Calligra Office**, despite being highly capable, and offering an impressive
    feature set, was also a major disappointment – but chiefly for its interface.
    If you can get past its esoteric workflow, and don''t mind finding your own way
    through trial and error, there''s nothing per se wrong with it. But if you plan
    on running Calligra on a small screen, say a 14-inch laptop, you''ll barely have
    any room to work on your document or slides, and so it too couldn''t make the
    podium.


    While both **OnlyOffice** and **LibreOffice** support the proprietary Microsoft
    Office formats. **OnlyOffice** is far better at rendering documents. Unlike the
    other suites, however, it doesn''t feature a database or drawing application,
    only offering a spreadsheet, word processor and presentation application. The
    offline desktop edition also doesn''t provide all the same features as are on
    offer with the cloud variants, and that''s disappointing too. Still, for the limited
    number of applications on offer, **OnlyOffice** performs rather well, and isn''t
    as resource hungry as **LibreOffice**. If you don''t care for collaboration then
    we would definitely advise you to give it a try.


    There''s very little separating **Google Docs** and **LibreOffice**, save for
    the fact that the former needs an internet connection to function, while the latter
    is a desktop solution.


    1st

    **LibreOffice 10** 10/10

    Web: www.libreoffice.org Licence: MPL 2.0, other open source

    Version: 6.1.2

    This mature office suite excels at just about everything.


    2nd

    **Google Docs** 9/10

    Web: https://docs.google.com Licence: Proprietary

    Version: N/A

    Makes collaboration a breeze.


    3rd

    **OnlyOffice** 8/10

    Web: www.onlyoffice.com Licence: AGPLv3

    Version: 5.1.29

    Impressive support for proprietary formats, and works as advertised.


    4th

    **Calligra Suite** 6/10

    Web: www.calligra.org Licence: GPL

    Version: 3.1.0

    Just as feature-rich as LibreOffice, but its interface is very cumbersome.


    5th

    **WPS Office** 5/10

    Web: http://wps-community.org Licence: 10.1.0

    Version: Proprietary

    Purists will dislike the proprietary licence and the lack of ODF support.


    # ## ALSO_CONSIDER


    There aren''t any other open source suites to consider save for the ones already
    featured in this Roundup. If none of our solutions work for you, check out the
    Apache OpenOffice suite. LibreOffice is based on it, but whereas the latter has
    continued to innovate, OpenOffice has stagnated in recent years. Based on SoftMaker
    Office 2018, FreeOffice is another free suite, but as with WPS Office and OnlyOffice,
    it only features a spreadsheet, word processor and presentation tool.


    If you are looking for a cloud-based alternative, there are a couple of others
    besides Google Docs, including the proprietary Zoho Office Suite and the host-your-own
    open source Tiki. The AGPLv3 licensed Fong Office Community Edition is another
    viable option. If none of these catch your fancy, you can grab individual applications,
    such as Gnumeric or Pyspread for spreadsheets. Abiword and Sazol can similarly
    be used for word processing or creating presentations, respectively.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Roundup


    Claws Mail » Evolution » Kmail » Mailspring » Thunderbird


    ![](img/7a0a282248f9658f0c87e55744c797b6_119_0.png)


    Shashank Sharma

    By day Shashank is a New Delhi trial lawyer, but by night he’s an open source
    vigilante!


    # Email clients


    Can’t decide which desktop email client to use? **Shashank Sharma** has been locked
    in the *Linux Format* Server Dungeon tweaking his SMTP.


    # HOW WE TESTED…


    Unlike the last time we ran a Roundup of email clients (LXF151 – seven years ago!)
    when we installed the different applications on their native desktop environments,
    we’re running all of them on the Budge desktop this time around. Most distributions
    carry these applications in their software repositories, and we’re running the
    latest available versions of each of them. The only exception is Thunderbird,
    because its latest release isn’t yet available in the software repositories, and
    we had to install it manually. Most email clients are similar in appearance, but
    we’ll be testing these tools on their performance, their search capabilities and
    ability to handle junk and spam messages. We’ll also keep an eye out for any standout
    features on offer, and their support for IMAP and POP accounts. Extending functionality
    through plug-ins and other customisation options is another criteria to consider
    when choosing an application that you’ll rely on for important communications.


    ![](img/7a0a282248f9658f0c87e55744c797b6_119_1.png)


    W hile email clients may appear to have not changed much since their debut on
    the Linux desktop, the different applications are constantly working on adding
    new features to please existing users, and attract new ones. In addition to accommodating
    for touch devices, many applications also support advanced features such as delivery
    notifications. This is especially useful when working with an IMAP account, such
    as that of GMail. Much like the perfect web browser, or text editor, there’s no
    clear answer as to which is the best email client. The ideal feature set for a
    desktop email client depends on the intended use. A casual home user probably
    doesn’t any need for features such as delivery confirmation or scheduling, which
    would be relevant to business users. Despite many viable alternatives on offer
    for users who prefer the command-line over a GUI, we’ve restricted ourselves to
    graphical applications for this Roundup. While our selection may seem heavily
    in favour of GTK, with only one KDE application thrown in the mix, the chosen
    applications can be installed on any desktop, and your distribution’s software
    management tool will fetch the additional libraries needed for these applications
    to function properly.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# # Unique features


    What makes these particular email clients stand out from the crowd?


    Linux machines fitted with either 8 or 16GB of RAM are unlikely to be affected
    by the memory footprint of the always-open email applications. However, for low-spec
    or older machines that have limited hardware resources, Claws Mail is the perfect
    solution. Not only does it require far fewer resources than its peers, it’s also
    feature rich, supporting both POP and IMAP accounts. In addition to extensive
    filtering capabilities, it also enables you to create coloured labels when sorting
    messages. Setting up new accounts is also straightforward in all the clients tested
    here.


    Apart from emails, you can also use Evolution to schedule appointments and track
    your tasks list. Together with KMail, both programs are especially conscious of
    users’ privacy and provide easy means to sign, encrypt and decrypt messages. The
    import wizard on KMail supports a large number of applications that the tool can
    import from, such as Evolution, Thunderbird and Outlook Express. If you’re on
    an KDE system, you must install the akonadi-import-package to access the feature.


    Like the others, MailSpring also supports creating multiple accounts. Even the
    free version provides limited access to some of its Pro features such as delivery
    notification, which produces a pop-up as soon as emails are delivered to the recipient’s
    mail box. For important messages that require urgent replies, the application
    can inform you if no one has replied to your message within the specified time
    period. You can also receive a summary of messages sent and received, as well
    as track whether recipients actually open your emails, and whether they click
    a link in the message body, by clicking Activity on the sidebar.


    ![](img/7a0a282248f9658f0c87e55744c797b6_120_0.png)


    When reading emails with Thunderbird, if you double-click a message, it opens
    in a separate tab. Unless you close such tabs after reading the mail, Thunderbird
    will keep them open indefinitely. Unlike the other tools that require add-ons
    to protect you from phishing attacks, Thunderbird natively offers this feature.
    Like its brother Firefox, Thunderbird features a vast array of add-ons that can
    be used to extend its functionality. You can also configure it to block HTML messages,
    if you find them a nuisance.


    # **VERDICT**


    | CLAWS MAIL | 7/10 | MAILSPRING | 10/10 |

    |---|---|---|---|

    | EVOLUTION | 7/10 | THUNDERBIRD | 8/10 |

    | KMAIL | 7/10 | | |


    > MailSpring takes the lead because of some innovative offerings out of the box.


    # # Filter and search


    Just like Hogwarts sorting hat!


    Mail now offers users’ 15GB mailboxes. Yahoo similarly offers 1TB of storage space
    for your messages and attachments. While this is much appreciated, the downside
    to the vast storage space is that people no longer delete emails. Most email services
    now enable you to archive mails, or perform a similar function such that the Inbox
    is reserved only for important messages. This inevitably leads to massive mailboxes
    that hold tens of thousands of message over the years.


    As you subscribe to more mailing lists and add more contacts, your mail client
    should make it possible for you to perform filtering operations to automatically
    sort the different messages into dedicated folders, or apply labels for easy identification.
    Just as important is the search capabilities, because looking for one particular
    email from your father from several years ago, when he routinely sends several
    in a day, can be a daunting ask.


    All the clients enable you to create different filters for each configured account.
    You can set these applications to perform a number of operations such as moving
    mail to specified folders and applying labels based on different conditions such
    as from, to, header, BCC, subject, size, attachments, and so on.


    When searching for messages, MailSpring provides instantaneous results, offering
    matching suggestions even as you type in the search box. You can also use advanced
    GMail-style search queries with the tool, such as ‘in:unread’, etc. Claws Mail
    can also quit slow when connecting to your existing mail account which already
    has thousands of messages. The search, although fast, lags behind Thunderbird
    and MailSpring.


    ![](img/7a0a282248f9658f0c87e55744c797b6_120_1.png)


    > Despite being on a par with all the other three in terms of speed, KMail’s ‘find
    messages’ feature is disappointingly unintuitive.


    # **VERDICT**


    | CLAWS MAIL | 9/10 | MAILSPRING | 10/10 |

    |---|---|---|---|

    | EVOLUTION | 9/10 | THUNDERBIRD | 9/10 |

    | KMAIL | 8/10 | | |


    > While all the tools are fairly fast when searching, MailSpring has the edge.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# # Assessing a client’s usability


    Will they help or hinder your work?


    While online services such as Yahoo and GMail continue to tweak their interfaces
    every few years, desktop mail clients are far more lax with their appearances,
    with seemingly no change having taken place since the introduction of the modern
    email clients decades ago.


    How do you then explain the popularity and continued existence of desktop clients?
    One of the reasons for this is their tight integration into the desktop, which
    means pop-up notifications for incoming messages. Add to that features such as
    queuing messages, their anti-spam measures and support for encrypting your messages,
    and it’s easy to see why these applications can boast of such vast user communities.


    The first and only task that a mail client should do well is connect easily with
    the different accounts and send and receive messages. We want a client that can
    do this, but doesn’t make the experience of putting its myriad features to use
    tiresome.


    # Claws Mail

    7/10


    The interface features a sidebar on the left that displays the count of read,
    unread and total number of messages in each folder. You can tweak this setting
    by clicking View\>Set Displayed Columns\>In Folder List. If you dislike the default
    layout, you can also switch to another from View\>Layout, and choose from one
    of the five different options. There are also several other themes that you can
    download from the website, but these will only change the icons within the interface.
    Still, some of the themes can add a bit of colour to an otherwise drab appearance.


    You can apply different colour labels to your messages. You can even use this
    colour as a search criteria when looking for messages. Instead of a globally accessible
    search bar, the tool expects users to select a folder in the sidebar and then
    click Edit\>Search Folder to launch the search dialog.


    ![](img/7a0a282248f9658f0c87e55744c797b6_121_0.png)


    # Evolution

    8/10


    The interface is liberally sprinkled with buttons, tabs and sidebars. The intuitively
    designed application is fairly easy to master, even for absolute novices who have
    never used a desktop mail client.


    The default installation gives you access to all its features, including Calender,
    Tasks and Memos. The application defaults to the mail interface, but you can switch
    to the other tasks using the buttons on the bottom right of the left sidebar.
    The sidebar at the right displays all your upcoming appointments, and you can
    create new ones by right-clicking a date.


    By default, the application defaults to a threaded message view, where all replies
    to an email are collated together. You can toggle off threaded view by pressing
    Ctrl+T. In fact, a vast number of operations can be carried out using the default
    keyboard shortcuts. Click Help\>Quick Reference for a complete list of these.


    ![](img/7a0a282248f9658f0c87e55744c797b6_121_1.png)


    # # Configuration and documentation


    Navigating the path between getting started and getting stuck, and beyond.


    For this test, the awarded score is cumulative to the quality of documentation
    on the ease of configuring new accounts. Unlike the other tools that work flawlessly
    with most IMAP and POP accounts, GMail considers Claws Mail as an insecure application.
    You’re required to enable access to ‘Less secure apps’, from within GMail before
    you can configure Claws to fetch messages. Failure to do so results in a login
    failure message, even when you provide the correct password. Unfortunately, despite
    the user manual and FAQ on the website, the Claws documentation doesn’t discuss
    this hiccup of working with GMail.


    Evolution is similarly difficult to configure with Yahoo, but like the other tools,
    the program can automatically fetch all the pertinent details when configuring
    GMail. You can access the thorough documentation from within the application itself
    by pressing F1. The quick reference PDF provides all the keyboard shortcuts you
    can use.


    As with most KDE applications, KMail has a complete handbook discussing all its
    features. It can connect with a large number of services without you having to
    manually enter any settings, and only took us a matter of seconds to connect not
    only with Yahoo and GMail, but also a mail server hosted on GoDaddy!


    Apart from thorough documentation covering different aspects of its usage, you
    can also access tips and tricks and details about customisation options and more
    on Thunderbird’s support page. Since Mailspring compulsorily requires creating
    an account, it regularly sends emails informing users of its myriad features.
    Like the others, its online help provides easy-to-follow instructions to configure,
    enable and use the different features.


    # VERDICT


    | CLAWS MAIL | 8/10 |

    |---|---|

    | EVOLUTION | 9/10 |

    | KMAIL | 8/10 |


    | MAILSPRING | 9/10 |

    |---|---|

    | THUNDERBIRD | 10/10 |


    Only Evolution provides in-built documentation. The other applications launch
    the help section on their websites.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# **KMail** 8/10


    You can drag and drop all your regularly accessed email folders into the box on
    the top-left of the application''s interface. This creates a list of frequently
    accessed folders, saving you the time to navigate the left sidebar looking for
    these folders.


    All your emails are grouped by day/month/year. Messages are collapsed into the
    respective day/month/year heading, and you''ll have to double-click the heading
    to get a list of messages. KMail does the threaded view better than the other
    tools, using line spacing to denote replies to messages in a thread. The search
    bar at the top can be used to perform basic search operations, but if you want
    more functionality, you must click Tools>Find Messages first.


    For messages that require some action, click the Create To-Do button on the menu
    bar at the top. You can then fill in all the pertinent details to create a reminder.


    ![](img/7a0a282248f9658f0c87e55744c797b6_122_0.png)


    # **MailSpring** 10/10


    Unless you''re comfortable with announcing to all your peers that the mail has
    been sent using MailSpring, the default signature needs immediate attention. Not
    quite the same as ''Sent from my iPhone'', but it''s still rather uninspiring.


    Like Claws and Thunderbird, MailSpring supports theming. Click Edit>Change Theme
    to cycle through the six options available in the default installation.


    Unlike the other tools, MailSpring sports a four-panel layout. The left-most sidebar
    is the same as on all the other applications. Next to it is the list of all the
    messages in the selected folder. To its right are the selected message. Finally,
    in the fourth pane you get details about all the people in the conversation, but
    it only informs you of the names of the parties in the conversation. At the bottom
    of this right sidebar are a list of all past emails exchanged with the same person.


    ![](img/7a0a282248f9658f0c87e55744c797b6_122_1.png)


    # **Thunderbird** 10/10


    Despite offering the choice of several layouts such as Wide View, Vertical View
    and Folder Pane, the best appearance is that of the Classic View, which presents
    a three-panel interface.


    When confronted with an unfamiliar word in an email, you can select and right-click
    the word and then click ''Search Bing for "word"''. You can change the default
    search engine from the Preferences dialog.


    When searching messages, results show up in a new tab, with filters on the left
    sidebar that help segregate the different messages, based on whether you were
    the sender or recipient and whether the messages have an attachment.


    When composing a message, you can click Options and toggle Return Receipt if you
    want delivery confirmation. You can configure this for all outgoing messages by
    clicking Menu>Preferences>Preferences>Advanced. Then click Return Receipts.


    ![](img/7a0a282248f9658f0c87e55744c797b6_122_2.png)


    # # Customising with add-ons


    Because building on top of the stock install isn''t enough...


    MailSpring''s default installation is the sum total of what''s on offer. You''re
    provided with a few more features if you opt to subscribe to the Pro version,
    at a cost of $8 per month (Â£6), but it still doesn''t give you as many features
    as you can get with the other tools.


    Claws is a straightforward email client, and you must resort to its plug-ins if
    you want additional features, such as a news aggregator. One such add-on is the
    ACP1 notifier plug-in, which can light up the new email light on some laptop models,
    from Acer and Asus, for example. You can also opt from one of several themes to
    change the appearance of the interface.


    Evolution''s default installation already has several plug-ins installed and enabled.
    In fact, many of its basic email features, such as new mail notification is also
    provided through a plug-in. A lot of functionality on KMail is driven by what
    the application itself identifies as plug-ins. Click Settings>Configure KMail
    and click Plug-ins on the sidebar for a list. You might be especially interested
    in the ad-blocker plug-in.


    Thunderbird offers the choice of dozens of themes to change the appearance, in
    addition to specific extensions to tweak the menu entries and make other changes
    to the interface. You also get functionality such as the Automatic Dictionary.
    This extension can be used to remember the language you use when communicating
    with a particular person or group and automatically switches the spell-checker.
    The add-ons page provides a categorised list of available extensions such as Contacts,
    Folders and Filters, Message and News reading, Privacy and Security, and Tags.
    You can also scroll through the Most Popular list on the left.


    # **VERDICT**


    | CLAWS MAIL | 7/10 | MAILSPRING | N/A |

    | EVOLUTION | 6/10 | THUNDERBIRD | 10/10 |

    | KMAIL | 6/10 |  |  |


    > Thunderbird''s vast collection of extensions puts all the others to shame.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# ## Security features


    Protecting against the many hazards of the internet.


    All the applications featured in this *Roundup* provide different tools and solutions
    to safeguard your privacy of your communications and the safety of your machines.


    In addition to the default settings, most also offer additional mechanisms to
    protect you with the aid of plug-ins. You have the choice of using *Bogofilter*
    or *SpamAssassin* to detect and eliminate spam messages when working with *Evolution*,
    *KMail* and *Claws*. With *Claws*, the core package includes several useful plug-ins
    including *Bogofilter*; but if you''ve installed it using your distribution''s
    software management utility, you must additionally install the *claws-mail-plugins*
    package.


    *KMail*''s anti-spam and anti-virus wizards help you to configure the respective
    tools. You must actually have the tools installed to handle these operations,
    such as *Bogofilter* or *ClamAV*. If no tools are found, the wizard will merely
    inform you so. It doesn''t recommend any tools. Some users have reported problems
    with the wizard detecting their anti-virus tools. Worse still, when connected
    with an anti-virus utility, *KMail*''s performance is considerably slower, as
    each message is scanned for viruses. *Thunderbird* has an advanced junk mail filter,
    which learns and improves its filtering depending on what you mark as spam. All
    incoming messages pass through the filter, and you can get


    Even though it says OpenPGP, it''s possible to configure *Evolution* to work with
    GPG as well.


    *Thunderbird* to warn you about potential phishing emails, and also when a link
    in a message is leading you to a website other than the one indicated in the URL.

    With the exception of *Mailspring*, all the clients can be configured to work
    with a spam detection and encryption, via the popular *GnuPG* utility.


    # **VERDICT**


    | CLAWS MAIL | 10/10 |

    | :--- | :--- |

    | EVOLUTION | 10/10 |

    | KMAIL | 10/10 |


    | MAILSPRING | N/A |

    | :--- | :--- |

    | THUNDERBIRD | 10/10 |


    *Despite repeated feature requests, Mailspring still doesn''t have any encryption
    or anti-spam capabilities.*


    # ## Other features


    Will it make you breakfast?


    Along with the web browser, the email applications are one of the most recognisable
    components of the desktop.

    What started as means to easily communicate with your contacts have now expanded
    to behemoth projects with a vast feature set. Not all users would want their email
    client to set up reminders and double up as a calendar. But if these are things
    that you use daily, it''s probably best to use just the one tool, rather than
    several.


    *Evolution*, GNOME''s official Personal Information Manager (PIM), provides a
    calendar, address book and a task manager. You can get the same features with
    *KMail*, provided you run it on top of the KDE desktop, where it can connect with
    other well-known KDE components such as *Kontact* and *Korganizer*.


    If you frequently collaborate with non-English speakers over email, you''ll appreciate
    *Mailspring*''s ability to translate messages written in English into Spanish,
    Russian, simplified Chinese, French, and German. It can auto-detect your language
    and performs spell-check without changing the language settings. It''s also specially
    tailored for touch devices and supports many configurable gestures such as swipe
    left or right.

    Unlike the other tools, *Thunderbird* can also connect with chat accounts on various
    services so that a single application keeps record of all your communications
    with your contacts. The advantage of its multiple-channel chat support is that
    you can use the search feature to go through past conversations and emails exchanged
    with all your contacts. Should you ever have the need to perform a search on the
    web, you can do so from the search


    ![](img/7a0a282248f9658f0c87e55744c797b6_123_0.png)


    As many services block email messages based on size, you can configure Thunderbird
    to connect with your account on Box.


    bar within the application itself, instead of switching over to a web browser,
    and can even choose the search engine you wish to use. *Claws* doesn''t provide
    as many features out of the box but you can get almost all the same functionality
    with the use of plug-ins. It can easily double as a news aggregator, manage appointments,
    and more. *Evolution* and *Thunderbird* are more resource hungry than the others.
    Something to consider if you decide to use these applications for more than just
    email.


    # **VERDICT**


    | CLAWS MAIL | 10/10 |

    | :--- | :--- |

    | EVOLUTION | 10/10 |

    | KMAIL | 10/10 |


    | MAILSPRING | 10/10 |

    | :--- | :--- |

    | THUNDERBIRD | 10/10 |


    *The use of anti-spam and anti-virus plug-ins does affect performance.*


    ![](img/7a0a282248f9658f0c87e55744c797b6_123_1.png)'
  merge: -1
