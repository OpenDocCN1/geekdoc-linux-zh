  md: '# Lightweight desktops


    # The Verdict


    Taking app launch times as an indication, all the options in this Roundup are
    equally lightweight and responsive, and don’t give us much to choose between in
    terms of performance. So instead we’ll concentrate on their other aspects and
    determine our winner using the tried-and-tested mechanism of elimination.


    Lumina loses out for the simple reason that it wasn’t designed for Linux. It also
    isn’t available in the repos of many distributions, which makes installation a
    tall order for most users.


    We are really prone to deny Equinox a podium finish, especially since it performs
    extremely well and doesn’t score too badly in terms of usability. However, the
    project isn’t as actively developed as its peers, and you can’t always find it
    in your favourite distro.


    Moksha gets on the podium for its beautiful Enlightenment pedigree. It not only
    looks good but is very responsive and light on resources. As with most desktops
    designed for a specific distribution, though, Moksha doesn’t always sit pretty
    across other distributions.


    Both LXQt and Openbox are mature projects and have been around for several years
    now. Openbox is surely the faster of the two, but what prevents it from claiming
    victory is its weak usability. Since it’s a bare-bones window manager, users will
    have to spend some time assembling various components and writing a custom configuration
    file to create a usable desktop environment. While that doesn’t take as much effort
    as it sounds, it’s still an exercise and takes longer than a ready-made solution
    like LXQt.


    LXQt is the result of the merger of the LXDE and Razor-Qt projects. It boots very
    quickly and makes judicious use of available resources. Despite consuming a fraction
    of the resources of its mainstream rivals, LXQt looks good thanks to its Qt underpinnings,
    which are also the reason for its slightly higher resource use when compared to
    Openbox.


    That said, LXQt will feel at home on a modern machine, but is still light enough
    to push an out-of-commission computer back into active duty.


    # 1st LXQt


    8/10


    **Web**: https://lxqt.org **Licence**: GPL, LGPL **Version**: 0.14.1


    A lightweight desktop which still manages to look good.


    # 2nd Openbox


    7/10


    **Web**: http://openbox.org/wiki/Main_Page **Licence**: GPLv2 **Version**: 3.6.1


    The best option for tweakers who love spending time setting up their desktop.


    # 3rd Moksha Desktop


    7/10


    **Web**: https://www.bodhilinux.com/moksha-desktop **Licence**: BSD Licence **Version**:
    0.3.0


    A wonderful option for users who love Enlightenment’s bling.


    # 4th Equinox Desktop Environment


    6/10


    **Web**: https://edeproject.org **Licence**: GPL, LGPL **Version**: 2.1


    A good bet for anyone who can find it in the repositories of their distribution.


    # 5th Lumina


    6/10


    **Web**: https://lumina-desktop.org **Licence**: BSD 2.0 **Version**: 1.4.0


    Optimised for BSD, it doesn’t adhere to the sensibilities of a Linux distro.


    ![](img/7a0a282248f9658f0c87e55744c797b6_38_0.png)


    # ALSO CONSIDER


    Unlike some of other Roundups, there’s no dearth of lightweight options besides
    the ones featured here. There’s the Sugar desktop environment that is developed
    as an educational desktop for the OLPC project. Although not a regular desktop
    environment, it’s a fantastic option if you are looking for an environment custom-built
    for an educational computer.


    One of the most popular options for cutting the flab from desktop environments
    is to simply run their lightweight window managers instead. We’ve covered some
    in the Roundup and there are plenty of others as well. There are stacking window
    managers like Fluxbox, Fwm, FVWM, IceWM and JWM that will all run without stressing
    the available resources of your computer.


    Meanwhile, command-line warriors will appreciate the hackability of tiling window
    managers such as X11 and mroned. Many of them are available in the repositories
    of popular desktop distributions. However, they score poorly in terms of usability
    and for that reason aren’t everybody’s cup of tea.'
