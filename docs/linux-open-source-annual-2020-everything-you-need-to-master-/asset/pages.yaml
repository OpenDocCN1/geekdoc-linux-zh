- pgno: 173
  md: '# FOSS


    # # System Administration


    Find out exactly what''s going on under the hood of your Linux box.


    # **GLANCES**


    *Glances* is a Python script that smartly displays a lot of information about
    your current session inside a standard terminal window. You can use the tool to
    monitor remote machines and use the built-in web interface to monitor machines
    using a web browser.

    https://nicolargo.github.io/glances


    # **PORTAINER**


    Using Docker via the terminal isn''t all that cumbersome and the tool is well
    documented. To make your life easier however, you can use *Portainer*, which is
    an open source, web-based graphical front-end that supports all the features exposed
    by the Docker API. You can use it to manage containers, images, networks, and
    volumes and it can manage a standalone Docker environment, or a Docker Swarm.
    From its dashboard you can create containers and view and manage all available
    ones. You can obtain real-time stats such as CPU and memory usage and various
    other details about the running containers and even access a container''s console,
    all from within the browser window. *Portainer* is available as a Docker container
    so you can install it with a single command. To create containers you can use
    one of the dozens of predefined templates. The tool can be used by multiple users
    and has useful user-management functions. You can for example use it to define
    the levels of access any other users have to *Portainer*, and the aspects of Docker
    they can manage from within *Portainer*.

    https://portainer.io


    ![](img/7a0a282248f9658f0c87e55744c797b6_173_0.png)


    You can use Portainer to pull images from Docker Hub or a private registry.


    # **FIREJAIL**


    *Firejail*enhances security by isolating programs and processes inside limited
    sandboxed environments. By locking away the web browser or any tool that can be
    compromised, *firejail*prevents a compromised program from accessing critical
    areas of the filesystem.

    https://firejail.wordpress.com


    # **BOOTCHART**


    One of the major causes of longer boot times is that your system starts unnecessary
    tools and services during startup. But before you are them, it''s best to get
    a picture of what''s happening while your distro boots up. *Bootchart* is a simple
    utility that enables you to profile your Linux boot process and help measure the
    loading times of different services. It''s now merged with SystemD. Fire up a
    terminal and enter *systemd-analyze time* to know the breakup of the boot duration.
    Similarly, *systemd-analyze blame* will list all running units ordered by the
    time they took to start.


    To generate an image of the boot process, type *systemd-analyze plot* and *boot.svg*.
    From this image you can find all the active processes and can remove any you don''t
    need. For example, if you print occasionally, you can disable CUPS from starting
    at the boot time. Furthermore, the image also helps you spot processes that take
    control of all resources and force the other processes to wait, slowing boot up.

    www.bootchart.org


    # **GRUB CUSTOMIZER**


    There are several reasons you might want to change the default boot loader behaviour
    and *Grub Customizer* tool will help you to do that. The graphical tool can modify
    all aspects of the boot process and can even tweak how the Grub screen looks.
    https://launchpad.net/grub-customizer


    ![](img/7a0a282248f9658f0c87e55744c797b6_173_1.png)


    *Grub Customizer* also helps restore order when you''ve accidentally wiped clean
    the MBR.


    # **REMMINA**


    A very usable remote desktop client, *Remmina* supports a wide range of protocols.
    It performs well and offers useful features such as the flexibility to change
    the quality settings of the connection on the fly.

    https://remmina.org


    # **INXI**


    A CLI tool that lists info about the hardware in your computer. With *inxi* you
    can collate details about the kit, including vendor details, device driver configuration
    and more.

    https://github.com/smx/inxi


    # **POWERTOP**


    Intel developed the *PowerTOP* utility to track down apps that eat up your laptop''s
    battery. The CLI utility offers suggestions to tweak power-guzzling tools to squeeze
    more juice from your laptop''s battery.

    https://01.org/powertop


    # **STACER**


    *Stacer* is a system monitor that helps you track different aspects of your installation.
    It can also show alert messages when values for a parameter exceed a certain threshold.

    https://github.io/Stacer-Web


    # **LOGWATCH**


    *Logwatch* parses, analyses and filters logs and then generates daily reports
    on your system''s log activity. The utility also enables you to control the level
    of the report''s verbosity.

    https://sourceforge.net/projects/logwatch'
  merge: -1
