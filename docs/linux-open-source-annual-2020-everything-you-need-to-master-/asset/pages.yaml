- pgno: 163
  md: '# ## Special features


    How much extra value can you get with one program?


    W e also tested features that didn''t fall into any of the previous sections.
    One of Gimp''s most valuable feature is its extensibility. There''s a range of
    useful raw editing scenarios and plug-ins for Gimp, from motion blur remover (Refocus)
    to some great photo filters from FX Foundry (see Photo>Enhancement). It turns
    out that Gimp is the most versatile and at the same time feature-rich image editor
    for Linux.


    Darktable has enough benefits too, from OpenCL support (Gimp has this, too) to
    easy lens profiling, keywords editor and print preview feature. Rawtherapee has
    few extra options, but we really liked its powerful file browser that can carry
    out batch processing and apply edit profiles to several images at once; this feature
    in Rawtherapee is much easier to use than copying and pasting history stacks in
    Darktable!


    Lightzone contains a beautiful set of ready-to-use presets called Styles. Each
    style is a preconfigured existing filter or effect, which you can always fine-tune
    to your liking. The way Lightzone effects are stacked is perhaps the best one
    in terms of usability. You can have as many effects applied to the image at once
    as you like, with one of the best effects being Relight.


    Moving on to PixeVuo, we enjoyed the Quick Color feature, which is basically a
    set of one-click Instagram-like effects. The


    ![](img/7a0a282248f9658f0c87e55744c797b6_163_0.png)


    We liked the powerful print preview and placement tools in Darktable.


    Warp tool was also a unique tool for creating instant and fun distortion effects.
    While definitely not a tool for professionals, PixeVuo contains all the necessary
    functions for an average photo processing and retouching pipeline, and for many
    people this would be sufficient.


    +   - **GIMP** 10/10

    - **DARKTABLE** 8/10

    - **RAWTHERAPEE** 7/10

    - **LIGHTZONE** 7/10

    - **PIXELVUO** 9/10


    Despite the handy Spot tool and layers, Lightzone doesn''t have many extra features
    compared with the other programs on test.


    # ## Help and support


    Can you become a pro user easily?


    S ome time ago Lightzone insisted on users registering their data on the website
    before obtaining permission to download the application. This is no longer an
    obligatory step, but we understand that it was a way to motivate users to participate
    at the LightZone forums. But even without any registration it''s possible to view
    annotated screenshots, watch videos and consult tutorials in PDF from the Lightzone
    website.


    Of course, for novice users the most useful materials are those step-by-step guides
    where you can instantly see which settings lead to certain results. It''s particularly
    surprising given the fact that Lightzone has a dramatically smaller user base
    than Gimp. You can find quite help for Gimp online, including videos recorded
    and shared on YouTube by enthusiasts.


    Both Rawtherapee and Darktable have superb online documentation of all sorts,
    including freely available PDF books (Rawpedia and Digital Photo Development with
    Darktable, respectively), and it''s hard to tell which community is larger. The
    problem, though, is that a RAW file isn''t easy to edit, and both Rawtherapee
    and Darktable gives you a hundred ways to make it worse. For instance, while the
    noise reduction tools are incredible, in the wrong hands they end up fighting
    each other. We recommended that you consult a handbook before doing anything.
    That sort of things can be a challenge when working with Gimp.


    ![](img/7a0a282248f9658f0c87e55744c797b6_163_1.png)


    RawPedia (http://rawpedia.rawtherapee.com) is a must-read site for every photo
    enthusiast who''s keen to improve their knowledge of the Raw format.


    recommend splitting tasks between Gimp and a RAW editor (with which Gimp can possibly
    integrate).


    Predictably, PixeVuo has less to offer, although there are still some useful sources
    of help. As a commercial product, PixeVuo simply has to offer some support, including
    training materials and documents. The available stock is limited and mainly lives
    at the main web site (pixeVuo.com). We can''t blame the developer for that because
    PixeVuo isn''t a popular product. The official PixeVuo forum isn''t very lively
    either, though...


    +   - **GIMP** 9/10

    - **DARKTABLE** 10/10

    - **RAWTHERAPEE** 10/10

    - **LIGHTZONE** 8/10

    - **PIXELVUO** 7/10


    Darktable and Rawtherapee come top for online help sources.'
  merge: -1
