  md: '# Comprehensively

    benchmark your PC


    **Ed Bennett** shows how you can apply the same techniques used to

    benchmark the world''s fastest supercomputers to one-up your friends...


    ![](img/7a0a282248f9658f0c87e55744c797b6_89_0.png)


    You''ve probably seen benchmark statistics

    reported about all manner of popular devices,

    but what exactly is a benchmark, and how can

    you run one on your own systems?


    A benchmark originally referred to a testing process

    for rifles, where the gun was mounted to a bench

    rather than being held by a human markspeople: the

    bench was acting as the mark, hence benchmark.


    With several test firings, the spread of shots could be

    measured - the smaller the spread, the better the gun.

    Nowadays however it refers to any process that allows

    different methods, devices or processes to be

    compared with each other directly, based upon a

    standard reference.


    In computing, this is done by taking a set of

    reference tasks which reliably take exactly the same

    amount of effort each time, and measuring how a

    system performs when completing them. These

    tasks might be designed to stress one specific

    component - for example, hard disk write speed;

    the machine, to see what the absolute limits of the system

    are (synthetic benchmarks); or they might be

    representative of the kinds of work that a system will be

    used for (application benchmarks). A gaming

    benchmark might run a set portion of a game over a fixed

    route and measure the frame rate, while a 3D rendering

    benchmark may choose a complex 3D scene and

    measure the time the computer takes to render it.

    Benchmarks are frequently distributed as benchmark

    suites; since it''s rare for a computer to only be used for

    a single task, benchmark suites measure all-round

    performance by including contributions from a variety

    of typical tasks.


    ![](img/7a0a282248f9658f0c87e55744c797b6_89_1.png)


    In this article, we''ll look at the Sombrero benchmark

    suite. *Sombrero* is a suite of application benchmarks

    for a piece of high-performance research software

    used in theoretical particle physics computations.

    The benchmarks within it stress to varying degrees the raw

    speed of the processor, the speed at which data can get

    into the processor from the system memory, so while

    the speed at which data can be communicated between the

    different CPU cores and computers that are

    cooperatively working on a problem.


    Despite some effort to problem alternatives, in the

    world of high-performance computing the command-

    line reigns supreme. Because of this, the instructions

    that follow all take place at a terminal. To start, you''ll

    need to install the dependencies: Git, make, GCC, bc,

    gnuplot, OpenSSH and Open MPI. On Ubuntu, these can

    be installed with:


    ```

    $ sudo apt install git make gcc bc gnuplot

    $ openssh-server openmpi-bin openmpi-common

    ```


    Since you''ve installed Git, you''ll be able to update to

    the latest version of Sombrero from the repository at

    https://github.com/sa2c/Sombrero:


    ```

    $ cd ~/git/Sombrero

    $ git pull

    ```


    The default settings are enough to get you up and

    running, so just make and Sombrero will build itself. It

    includes six different benchmarks, each from a different

    formulation that theoretical physicists are studying to

    see whether or not it could describe reality, so while

    Sombrero builds you''ll see the same files compiled six

    different times, once for each benchmark. Also included

    is a shell script that runs each benchmark in turn, and

    gives a summary of the results. Since Sombrero is a

    highly parallel benchmark suite designed to run on some

    of the largest computers in the world, you need to tell

    it that you want to run it on a single CPU core. To do this, use

    the smallest problem size it knows about. To do this, use:

    $ ./sombero.sh -n 1 -s small


    You''ll immediately see some output from the first

    benchmark about the setup - since this test does not

    communicate between processes at all, the "operations

    per byte" is infinity. Within a couple of minutes you''ll see

    the results of each benchmark start to appear. The

    headline figure is the second [RESULT] line within each

    block - the one ending Gflops/seconds. ''Gflops'' here is'
