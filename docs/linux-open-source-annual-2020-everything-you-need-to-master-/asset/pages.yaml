  md: '# ## Distros


    # # Healing capabilities


    ## What wrongs can they right?


    All these distros will help you wiggle out of tricky situation, irrespective of
    the ailments that plague your installation. Many of them can also image and clone
    disks, identify and list damaged sectors, and extract recoverable data from physically
    damaged disks. However, some of them are more useful than others.


    For instance, data recovery is the sole advertised purpose of MorphusArch, so
    you can use the distro for little else. AIO System Rescue Toolkit has a handful
    of rescue tools to fix boot errors and rescue accidentally deleted files. The
    majority of its tools, though, are for fixing Windows installations, and can be
    used to fix all kinds of issues with the proprietary OS.


    The tools bundled with ALT Linux Rescue can do a wide variety of repair jobs.
    In the hands of an expert, the distro can fix bootloaders, optimise filesystems,
    recover accidentally deleted files and partitions, and even diagnose network problems.


    Similarly, you can use SystemRescueCd to rectify all sorts of issues with hard
    disks, including restoring the partition table. It can also scan the contents
    of the filesystem into a compressed archive, securely delete files and recover
    accidentally deleted ones. You can also use the distro to rescue data from an
    unbootable Windows machine.


    As in most other cases, UBCD goes further than the other contenders in that it
    can fix bootloaders but can also restore BIOS settings as well as restore and
    backup the CMOS. This is in addition to the usual rescue tasks such as recovering
    passwords and deleted files. The distro also features several diagnostic utilities.


    ![](img/7a0a282248f9658f0c87e55744c797b6_43_0.png)


    # **VERDICT**


    AIO SYSTEM RESCUE TOOLKIT 8/10 | SYSTEMRESCUECD 8/10

    ALT LINUX RESCUE 8/10 | ULTIMATE BOOT CD 9/10

    MORPHEUSARCH 3/10


    MorphusArch is the only distro in the Roundup that has a very focussed rescue
    objective.


    # # Customisation


    ## Can you adapt them as needed?


    Despite their fairly large collection of apps, these distros don''t include all
    the repair and rescue tools available. This is partly because some popular rescue
    tools have licence restrictions which prevent developers from including them in
    their distros. In any case, instead of lumping around multiple distros to accomplish
    different tasks, advanced users and technicians will prefer to flesh out their
    favourite distro to include all the tools they need.


    If you''re looking to decompile and assemble your own rescue distro, you won''t
    get far with ALT Linux Rescue, MorphusArch or AIO System Rescue Toolkit. None
    of them offers the option to customise the distro, although you can use their
    respective package managers to pull in additional utilities and flesh out the
    live environment as needed. AIO System Rescue Toolkit has a Lite version that
    is designed to give experienced users an opportunity to easily fix their installation.


    On the other hand, one of the marquee features of SystemRescueCD is its capability
    to enable anyone to compile customised versions. There were a bunch of scripts
    to ease the process of remastering older versions of the distro. That process
    has now been simplified in the newer Arch-based version, in that it can simply
    rebuild using the sources posted in the project''s Git repository. You will need
    to have an Arch installation to be able to run SystemRescueCD''s build scripts,
    which are based on the archiso tool.


    UBCD''s customisation is on a par with SystemRescueCD. The project''s website
    hosts a guide which details the procedure for extracting the ISO image and then
    customising the environment, by adding new run Freppy and ISO images as well as
    FreeDOS-based apps, before compiling a new ISO image. The website documentation
    also lists the process for updating Virus definitions. One particular benefit
    of UBcd''s customisation mechanism is that since all the modifications are housed
    within a single folder, you can easily move to a newer version of UBcd without
    losing any of the changes you''ve made to the distro.


    ![](img/7a0a282248f9658f0c87e55744c797b6_43_1.png)


