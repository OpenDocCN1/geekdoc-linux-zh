  md: 'Badger will sniffle out whether ad networks are respecting your Do Not Track
    settings, and duly blacklist them if so.


    One of the most worrying aspects of ad trackers is the potential for browser fingerprinting.
    Even though an advertiser doesn’t know you by name, they can, through the wonders
    of JavaScript, HTML5 and good old fashioned content headers, get your browser
    to jump through some hoops – and, based on those gymnastics, uniquely fingerprint
    it. The hoops in question are things like font availability, user agent strings,
    plug-ins and window size. The Tor Browser goes as far as to warn you when you
    maximise a window that this will betray your display’s resolution to the current
    website. Just by using Linux your browser marks itself out as being in the minority,
    which is why the Tor Browser supplies misinformation through its User Agent string,
    purporting to be:


    ```

    ```

    Mozilla/5.0 (Windows NT 6.1; rv:60.0)

    Gecko/20100101 Firefox/60.0

    ```

    ```


    Browser fingerprinting is nothing new (the inimitable Dr Brown covered it in LXF190,
    back when we could afford to pay him), but given all the other information that’s
    already probably held about us nowadays, it’s all the more worrying. See how unique
    you are, and try to do something about it, at the EFF’s Panopticlick website,
    https://panopticlick.eff.org. And no, we can’t explain entropy here – which is
    probably a sign that we don’t understand it.


    Stack Overflow recently became unwitting host to a fingerprinting script embedded
    in an advert. It would illustrate our point nicely if that was a questionnable
    ad agency supplying ads for second-rate products, but the offending ad was served
    by Google and advertised Microsoft’s Azure cloud service. Seriously though, it’s
    possible the JavaScript in question was being used to identify bots rather than
    track users.


    # ## Preferring privacy


    Web browser settings pages have become a lot simpler nowadays, but that doesn’t
    mean web browsers are any less configurable. It just means many of those options
    are more likely to confuse the average user than benefit them. Search for ‘chromium
    command line switches’, for example, or browse to about:config in Firefox and
    you will find more abstruse options than you can shake a stick at. Incidentally,
    you’ll find a privacy.resistfingerprinting option here that can mitigate against
    fingerprinting requests.


    ![](img/7a0a282248f9658f0c87e55744c797b6_58_0.png)


    We’ve been a bit anti-Google in this feature, but we should note that its browser
    sandboxing technologies are second to none.


    ![](img/7a0a282248f9658f0c87e55744c797b6_58_1.png)


    These grown-up options are all stored in a JavaScript file called prefs.js in
    Firefox’s profile directory, for example ‘~/.mozilla/firefox/xxxxxx.default’.


    People have gone to extraordinary lengths to harden Firefox’s default options,
    and you’ll find one of the most comprehensive examples at https://github.com/plylyukk/uxer.js.
    There’s not enough space in the magazine to go through all of these options, but
    do look into them at your leisure and consider making your own user.js file, which
    will be merged into the main prefs.js file in a robust way next time you start
    your browser. A similar project is ghacks-user.js, which you should study at https://ghacksuserjs.github.io/ghacks-user.js.
    If you have Git installed, you can start using the Pplylyukk user.js right away
    with:


    ```

    ```

    $ cd ~/.mozilla/firefox

    $ git clone ''https://github.com/plylyukk/uxer.js.git''

    $ cd xxyyzz.default

    $ ln -s ../uxer.js user.js

    ```

    ```


    One of the most important things this file does is to rein in WebRTC, which although
    designed as a protocol for real-time video communications can be used to identify
    the IP address behind proxies or VPNs. The relevant settings can be found on the
    about:config page by searching for media.peerconnection. You can read more about
    what these WebRTC settings do at https://wiki.mozilla.org/Media/WebRTC/Privacy.
    Good news, too, if you’re fed up with websites asking to send push notifications
    to your desktop: the method outlined here will disable those altogether, via the
    dom.webnotifications* options.


    One of the simplest things you can do right now to boost your privacy is to stop
    using Google as your default search engine and start using DuckDuckGo. You might
    not get quite the up-to-the-minute results you’re used to, but you also know your
    searches aren’t connected to your identity. Both Firefox and Chrome enable you
    to make this change from the Search part of their settings. If you miss your ‘tailored
    for you’ Google results, prefix your search query with ‘lg’ – but bear in mind
    that even if you’re not logged in to Google, these searches probably still get
    tied to your account.


    > > Take back your privacy! Switch to DuckDuckGo now – it won’t track you or sell
    your search queries to scallawags.'
