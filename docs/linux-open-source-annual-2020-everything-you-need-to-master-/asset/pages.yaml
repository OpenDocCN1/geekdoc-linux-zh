- pgno: 174
  md: '# ## Internet tools


    Make your online time more efficient with this collection of utilities.


    # ### UGET


    By default, the lightweight **UGet** download manager relies on `curl`, but if
    you install the `aria2` package, it can take on some more features, such as the
    ability to download torrents.


    **UGet** is an all-round downloader that has all the features you''d expect from
    a download manager. It features a download queue, can pause and resume downloads
    and also accelerates downloads by grabbing files from multiple parallel streams.
    Furthermore, batch downloads are one of its specialities. You can use the tool
    to prioritise the download queue and even regulate the speed of the downloads
    individually. **UGet** can also shut down and hibernate your computer once it''s
    finished downloading all the files.


    https://ugtdim.com


    ![](img/7a0a282248f9658f0c87e55744c797b6_174_0.png)


    # ### RAMBOX


    Most desktop distros ship with a default messaging tool that enables you to sign
    into multiple online messaging services. These tools can sign into only a handful
    of the popular services.


    In contrast, **Rambox** can plug into over 100 online messaging and email services.
    Every added service resides within its own tab, from where you browse the message
    history, write messages to your contacts, or use the other means of communication
    supported by the service. The tool will also display notifications. **Rambox**
    can also sync configurations if you use it on multiple computers. The program
    respects your privacy. Instead of storing your personal data, **Rambox** uses
    the `partition.persist` attribute of the `-webkit-` tag to create a persistent
    connection with the signed-in service. You can also set a master password and
    ask the tool to lock itself after a predefined period of inactivity.


    http://rambox.pro


    # ### BRAVE


    While popular browsers can be equipped to thwart information leaks, **Brave**
    ships with privacy-strengthening features. The Brave project promises two improvements
    over the competition: privacy and speed. One of them is achieved by blocking ads
    and trackers, which has the pleasant side effect of improving the browsing speed.


    https://brave.com


    ![](img/7a0a282248f9658f0c87e55744c797b6_174_1.png)


    Since blocking ads may rob sites of revenue, **Brave** has some unique compensating
    tricks.


    # ### WALLABAG


    A read-it-later tool, **wallabag** began when Google Reader was shuttered in 2013.
    You can install it on your own server or use it via its own service that costs
    about £8/year. **Wallabag** has favourite features including the ability to save
    articles, filter them by reading time, and more.


    www.wallabag.org


    ![](img/7a0a282248f9658f0c87e55744c797b6_174_2.png)


    # ### TOR BUNDLE


    **Tor** enables users to browse the web anonymously. Its goal is to prevent people
    from tracking you online. The **Tor Browser Bundle** includes everything you need
    to connect to the **Tor** network of relays through a customised version of Firefox
    known as the **Tor Browser**.


    www.torproject.org/projects/torbrowser.html.en


    ![](img/7a0a282248f9658f0c87e55744c797b6_174_3.png)


    The tool is available as a Snap and AppImage binary that you can use without installing.


    # #### MAGIC WORMHOLE


    A Python script that creates single-use encrypted channels to ferry files between
    computers across the Internet identified via pronounceable code.


    https://github.com/warner/magic-wormhole


    # #### UBLOCK ORIGIN


    The **uBlock Origin** browser extension is an ad-blocker that also blocks tracking
    servers, malware domains, and more. It''s available in the app stores of all mainstream
    web browsers.


    https://github.com/gorhill/uBlock/


    # #### QUITERSS


    **Quiterss** has all the features that you''d expect from a news reader. It can
    pull in RSS and Atom feeds, apply labels to each item and offers plenty of customisation
    options to boot.


    https://quiteross.org


    # #### VOCAL


    A feature-rich podcast grabber, **Vocal** can subscribe to and stream podcasts
    on-the-fly or download them for offline listening. It integrates with popular
    desktops and has smart library management functions.


    https://vocalproject.net


    # #### UFTPD


    **uftp** ships with defaults that work for most users. It''s designed for home
    users and developers who need a simple FTP server, but aren''t too particular
    about being secure.


    https://trogothib.com/projects/uftpd'
  merge: -1
