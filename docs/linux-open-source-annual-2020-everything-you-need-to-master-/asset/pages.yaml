- pgno: 85
  md: '# # Vulnerabilities and exploits


    Malware begins with breaking programs and ends in tears. Find out how we rein
    it in.


    W ithout some knowledge of memory management, pointers and execution stacks, it''s
    hard to give a rigorous account of how programs get compromised and thus enable
    malware to do its thing. This isn''t the time or place for such an in-depth look,
    but we can at least provide an only slightly hand-wave account of one way a program
    might be exploited.


    Programs work with input, which might come from a user, a website, another program,
    a piece of hardware (like a keyboard or a sensor) or a file. For a program to
    work correctly, that input has to be correctly formed. If it''s not, then it won''t
    fit nicely into the memory allocated to it, and horrible things can happen. We''ll
    be more specific about what those horrible things are in a moment, so bear with
    us. So, some kind of input validation ought to take place. If it does not, then
    the program will attempt to digest something that is the wrong size or shape for
    the memory assigned to it. As you can imagine, the results of this unpredictability
    can be unpredictable; to labour a metaphor, you may witness the digital equivalent
    of anywhere between regurgitation and a food coma. This might be application crashes
    or system slow-downs.


    But it could be much worse. Once such a vulnerability is discovered, it can be
    exploited by specially crafting our malicious input. In extremis, instead of crashing
    a program by feeding it the wrong kind of cat GIF, we could have it execute the
    payload of our choosing, which might be a covert keylogger or a persistent backdoor
    to the host machine. Thus is the progression from vulnerability to exploitation
    to what is commonly referred to as malware.


    For example, if we have a program that asks a user for a number and then spits
    out the square of that number, we first check that the raw input resembles an
    integer. If it doesn''t, the program quits with an error (we could check for decimal
    input and coerce that to an integer too, but let''s keep it simple). Compilers
    are fuzzy about data types, and the largest signed integer 64-bit registers can
    store natively is $2^{63}-1$, so we also need to check if an integer is too big
    (or negative and thus too small) - and if it is, bail with a different error.


    There''s more than meets the eye to these checks, since the raw input has to exist
    in some sort of buffer before it can be checked, and how can we know a priori
    how big to make that buffer? Let''s not concern ourselves with that - smaller
    people than us have mostly figured it out. So at this stage we''re sure we have
    an integer, and we want to make our computer square it. That''s easy, except for
    the small (actually large) catch that the result of this squaring this integer
    could well be larger than the space we allocate for it. Multiplying an integer
    with itself will always give a positive integer, so we could use an unsigned int
    to store our result. That will work fine so long as that result is less than $2^{64}-1$,
    or, by some elementary mathematical deduction, our original input was less than
    $2^{32}$. If not, the result may spill into other memory, overwriting it. This
    so-called integer


    +   >> CVES, BUGS AND BOUNTIES


    There are good ways and bad ways to go about reporting newly discovered vulnerabilities.
    Up until they''re disclosed to the relevant vendor or project, these are known
    as zero-day bugs. Day Zero being the day that disclosure happens. If you were
    in possession of a Zero Day, you could brag about it on Twitter (and publish full
    details on some medium that allows more than 280 characters) - sending affected
    parties, especially the relevant project, into a panic and possibly unleashing
    a wave of script-kiddie attacks.


    Better yet be responsibly disclose the vulnerability privately, so that a fix
    can be rolled out before things get out of control. Some projects even operate
    a bug bounty program so that such efforts can be rewarded. Vulnerabilities are
    assigned an ID on Mitre''s Common Vulnerabilities and Exposures (CVE) list, and
    once a suitable patch is in place, will provide public details of the vulnerability
    at https://cve. mitre.org. This will be picked up and packaged as a matter of
    urgency by all good distros. Relevant parties may not respond within a reasonable
    timeframe, or be interested, at which point going public becomes an option.


    As we write this, the most recent vulnerability that might affect us is CVE-2019-9553,
    a buffer overflow in the venerable wget - a command line utility for fetching
    things (most probably webpages) via HTTP. Using the tool to download a maliciously
    crafted file could result in arbitrary code execution, and a very bad day.


    ![](img/7a0a282248f9658f0c87e55744c797b6_85_0.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_85_1.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_85_2.png)'
