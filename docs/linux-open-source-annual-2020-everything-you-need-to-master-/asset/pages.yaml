- pgno: 34
  md: '# # Availability

    Can you find it in a repository near you?


    ![](img/7a0a282248f9658f0c87e55744c797b6_34_0.png)


    With the exception of a couple, all the desktops in this **Rundown** are available
    in the repositories of mainstream desktop distributions. Arch, however, leads
    the pack, in that it gives you access to all the options via its official and
    community-supported repositories. You’ll also get good mileage with Fedora, thanks
    to its Copr build system which complements its repositories.


    Similarly, Ubuntu with its PPAs enables you to get your hands on a wide number
    of DEs. One word of advice though: the quality of packages in the community-maintained
    repositories varies widely and ranges from anywhere between rock-solid to barely
    usable. You might not get the best experience using packages from a community-supported
    repository as compared to the official ones.


    LXQt and Openbox are the two options that are universally available in almost
    every Linux distribution. LXQt maintains an extensive list of projects it supports
    officially on its website, and you can install it on Fedora using a Copr repository.
    Openbox too is universally supported. We couldn’t bring up the right-click applications
    menu using the package in the repositories of Fedora 29, but that was easily (or
    *really?–Ed*) resolved by downgrading the **python-pyxid** package.


    Lumina is primarily developed for the BSDs, but has also been ported to some Linux
    distributions. The project’s page lists a few distributions that have pre-built
    packages, including Debian, Gentoo and Arch. The desktop is also available via
    a Copr repository for Fedora, but it doesn’t perform well and crashed during virtually
    every session. Ubuntu users can find guides to take them through the process of
    compiling it from source, which isn’t too cumbersome.


    > We’ll advise against installing several desktops inside a single installation.
    Not only will it needlessly clutter the application menus, some don’t play well
    with the others.


    Equinox Desktop Environment (EDE) hosts installation instructions on its official
    wiki and covers Arch, Debian, Slackware, Alpine and a couple of BSDs. The project
    itself lists these packages as experimental and advises you to compile EDE from
    source for the best user experience.


    The Mokska desktop is a fork of the Enlightenment (E17) desktop. Again, it’s the
    default only on Bodhi Linux and we couldn’t get it to work on any other distribution
    besides Arch. There is a Copr repository but its last build failed for Fedora
    25.


    | VERDICT | SCORE |

    | :--- | :--- |

    | EQUINOX DESKTOP | 5/10 |

    | LUMINA | 7/10 |

    | LXQT | 9/10 |

    | MOKSHA DESKTOP | 5/10 |

    | OPENBOX | 8/10 |


    Desktops designed for a particular distribution don’t work well on others.


    # # Default apps

    What’s on offer?


    ![](img/7a0a282248f9658f0c87e55744c797b6_34_1.png)


    One of the ways some desktops help you conserve resources is to offer matching
    lightweight apps for common desktop tasks such as file management, text editing,
    image viewing and so on. Others leave it to the user to pair the lightweight desktop
    or window manager with third-party lightweight apps.


    EDE belong to the latter category. The goal of the desktop is to provide a desktop
    environment only, and you will have to add even the most common apps like a file
    manager. Openbox similarly concentrates on being a lightweight window manager
    that you can complement with third-party light apps. It’s the same story with
    Mokska. Since it was designed to ship with Bodhi Linux, the desktop borrows the
    few essential apps that are bundled with the distribution.


    The other two options are a lot better in terms of bundled apps. Admittedly, you
    won’t find apps such as web browsers, email clients and office suites in Lumina,
    but the desktop does bundle a handful of utilities that are written specifically
    for the project. These include an archiver, a scientific calculator, a configurator,
    a PDF viewer, a text editor, a media player and a file manager. LXQt too features
    a small cache of optional apps which add extra capabilities to the desktop. There’s
    an image viewer and screenshot tool, a lightweight terminal emulator, a file archiver,
    a process manager, a file manager and desktop icon manager – which is essentially
    just a Qt port of **PCMANfm** – and more along those lines.


    > Lumina has a good collection of lightweight apps which nicely complement the
    desktop itself.


    | VERDICT | SCORE |

    | :--- | :--- |

    | EQUINOX DESKTOP | 1/10 |

    | LUMINA | 7/10 |

    | LXQT | 8/10 |

    | MOKSHA DESKTOP | 2/10 |

    | OPENBOX | 9/10 |


    You’ll like Openbox’s clean slate if you want to build your own environment.'
