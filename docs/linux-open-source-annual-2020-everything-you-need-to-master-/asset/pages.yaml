  md: '# FOSS


    **bundle** command to the number of cores on the machine, as follows:


    ```

    $ cd ...

    $ git clone https://github.com/tootsuite/mastodon.git live

    $ cd live

    $ git checkout $(git tag -l | grep -v ''rc[0-9]*'' | sort -V | tail -n1)

    $ gem install bundler

    $ bundle install -j2 --deployment --without development test

    $ yarn install --pure-lockfile

    ```


    Now we can log out the **mastodon** user and continue with setting up Postgres
    and the Nginx web server. First we start the database client and create a database
    user:


    # THE FATE OF YOUR DATA


    > “Ever since Yahoo!\''s acquisition of Flickr and YouTube\''s assimilation by
    Google, people have raised concerns about **how their pictures and video are used**"*


    ```

    $ sudo -u postgres psql

    postgres=# CREATE USER mastodon CREATEDB;

    postgres=# \q

    ```


    Setting up a webserver and https certificates is beyond the scope of this feature,
    so we\''ll assume you\''ve got Nginx up and running, as well as a domain name
    and SSL certificates for that domain. Create an empty configuration for your Mastodon
    site, say `/etc/nginx/sites-available/bfmastodon.net.conf` (change this to match
    your domain). Then copy, paste and change the example.com URLs from the example
    Nginx configuration at [https://github.com/tootsuite/documentation/blob/master/Running-Mastodon/Production-finding.md](https://github.com/tootsuite/documentation/blob/master/Running-Mastodon/Production-finding.md)
    (about halfway down the page). You\''ll also find instructions for generating
    and renewing free SSL certificates with Let\''s Encrypt there. Now we can activate
    our Mastodon site with

    `$ cd /etc/nginx/sites-enabled`

    `$ sudo ln -s /sites-available/bfmastodon.net.conf`


    All the pieces are now in place and we can run the Mastodon setup wizard, which
    we\''ll do as the **mastodon** user we set up earlier:


    `$ sudo su - mastodon`

    `$ cd -`\`-live`

    `$ RAILS_ENV=production bundle exec rake mastodon:setup`


    You\''ll be prompted to enter your domain name, whether to use single user mode
    (useful for testing purposes), whether you\''re using Docker (not this time),
    PostgreSQL details (the defaults are correct unless you changed something – the
    database user deliberately has no password). Mastodon can send emails (for account
    verification and recovery purposes) either using a local server or through an
    external service such as Mailgun. It\''s possible to run an instance that doesn\''t
    send emails too. You\''ll be prompted to set up an admin user, which you should
    because you\''ll want to administer your instance. A password will be generated
    for you: note it down and change on login.


    # Set up services


    Our work is tantalisingly close to being done: we just need to set up three systemd
    services: **mastodon-web**, **mastodon-sidekiq** and **mastodon-streaming** which
    should be placed in `/etc/systemd/system/`. Again, you can find, copy and paste
    their contents from the setup guide linked earlier. You can start and enable this
    trio of services in one shot with:


    `$ sudo systemctl enable --now /etc/systemd/system/mastodon*.service`


    Now, fingers crossed, you should be able to access your Mastodon instance through
    your web browser. Log in with the email address you signed password provided,
    and tell all your friends to sign up.


    ![](img/7a0a282248f9658f0c87e55744c797b6_141_0.png)


    The final stages of Mastodon\''s configuration wizard use a lot of RAM and spit
    out a lot of data, punctuated by reassuring emoji.


    # SOLID AND THE DECENTRALISED WEB


    Professor Tim Berners-Lee invented the World Wide Web, so when he announces that
    his invention "has evolved into an engine of inequality and division" (see [https://medium.com/@timberners_lee-one-small-step-for-the-web-879f2217d085](https://medium.com/@timberners_lee-one-small-step-for-the-web-879f2217d085)),
    people tend to listen. The professor and his team at MIT have come up with a plan
    to re-invent it. Built on top of the existing web, the Solid platform hopes to
    give users the ability to choose where their data is stored, who can see it and
    how it is used. Solid is a portmanteau of "Social Linked Data", and the idea of
    linked data is nothing new – Berners-Lee introduced it in 2006, alongside the
    idea of the semantic web. It enables published data to be contextually linked
    and sourced from external sources, so that it\''s no longer beholden to a particular
    provider or application. If a new, better app comes along, then it can access
    and re-use the same data as its inferior predecessor.


    It\''s an ambitious effort, but Solid isn\''t the only projects aiming for a decentralised
    re-imagining of the web. ZeroTier, the SAFE (Secure Access For Everyone) Network
    and PiperNet all hope to achieve this in their own ways.


    ![](img/7a0a282248f9658f0c87e55744c797b6_141_1.png)


    Why try and re-invent centralised web services when you can re-invent the whole
    entire web?'
