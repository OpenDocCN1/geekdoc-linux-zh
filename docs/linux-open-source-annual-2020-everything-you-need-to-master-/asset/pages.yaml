- pgno: 40
  md: '# # The range of tools on offer


    What''s in the goody bag?


    ![](img/7a0a282248f9658f0c87e55744c797b6_40_0.png)


    Should you be looking for a wide range of repair tools and utilities, you''ll
    be disappointed with MorepheusArch. The distro has a very focussed approach and
    only really includes TestDisk, along with its companion PhotoRec utility, for
    recovering files. The tools support all popular file systems and can identify
    files in over 400 formats. In addition to files, you can also use them to find
    lost partitions, rebuild the boot sector, fix FAT tables, locate the backup superblock
    and more. Experienced users can use its Arch base to fetch other rescue tools.


    Another Arch-based rescue distro, SystemRescueCd is a slightly better option.
    Unlike MorepheusArch, this one ships with several repair and rescue tools and
    utilities, and supports all the important filesystems. There are multiple recovery
    tools, filesystem-specific repair tools, and a couple of boot images including
    HDT to query the hardware. There''s also FSArcher, which can help save and restore
    a partition table, or the contents of a filesystem, to a compressed archive file.


    Then there''s AIO System Rescue Toolkit, which readily admits to not shipping
    with the entire gamut of rescue tools on offer. It instead includes only the most
    useful ones that its creator, a skilled technician, has used out in the field
    to fix machines. Besides tools like Boot Repair, Clonezilla and TestDisk, there
    are also a couple of stress-testing and benchmarking tools. The primary goal of
    the distro, however, is to fix Windows machines, and it has the largest collection
    of tools for this purpose as compared to the other options in this Roundup.


    Navigate through UBCD''s diverse menu to find the tool you''re interested in,
    and boot straight into its streamlined environment.


    Stress-testing and benchmarking utilities are also included in ALT Linux Rescue,
    which packs in over a hundred CLI tools, including several versatile ones. The
    distro also has several utilities to help recover deleted files and fix common
    issues with both Linux and Windows installations.


    Ultimate Boot CD (UBCD) leads the pack with the largest and most diverse collection
    of utilities. You can use the distro to query and stress-test hardware and peripherals
    connected to a system. It can be used to restore BIOS settings as well as to restore
    and backup the CMOS. UBCD enables you to fix bootloaders, recover lost passwords
    and deleted files and will also help you tweak the Windows Registry without booting
    into the installation.


    **VERDICT**


    | AIO SYSTEM RESCUE TOOLKIT | 8/10 | SYSTEMRESCUECD | 6/10 |

    | ALT LINUX RESCUE | 9/10 | ULTIMATE BOOT CD | 9/10 |

    | MORPHEUSARCH | 3/10 |  |  |


    With the exception of MorpheusArch, the others can get fair bit of mileage with
    the other rescue distros in the Roundup.


    # # Customisation


    Do they help ease admin access?


    ![](img/7a0a282248f9658f0c87e55744c797b6_40_1.png)


    SystemRescueCd doesn''t offer much in terms of a customised interface. The distro
    has a simple boot option that takes you to your Xfce desktop, which doesn''t offer
    any conveniences or customised interfaces to help orientate new and inexperienced
    users.


    The MorpheusArch project does produce an ncursest based script called LinDiag
    to assist with common system admin and recovery tasks. You can use it to check
    services, diagnose the network, manage packages and recover data from drives.
    However, the script isn''t included in the distro by default, and you''ll have
    to clone it from GitHub.


    If you manage a bunch of Windows machines, AIO System Rescue Kit can help you
    to keep them in a perfect condition.


    ALT Linux Rescue also doesn''t offer much in terms of customisation. One of the
    few aids it does have is the forensic-mode boot option that brings up the distro
    without activating the swap or mounting any partition. There are also a couple
    of scripts that automatically mount attached disks and fix any issues with the
    master boot record, which is rather convenient.


    What helps UBCD standout from its competition is its custom boot menu. The distro
    ships with no graphical desktop and instead boots to a very well laid-out menu.
    The customised text-based menus help guide you to the relevant utility for your
    issue. The menu is logically arranged and individual menus have useful information
    to help identify them.


    In contrast, AIO System Rescue Toolkit has a bunch of CLI tools, but to make for
    easier access it has a shortcut on the desktop for all of them. Besides the Live
    environment, you can also boot the distro''s CD/USB inside Windows to access all
    its Windows-specific repair and rescue tools via a custom interface.


    **VERDICT**


    | AIO SYSTEM RESCUE TOOLKIT | 8/10 | SYSTEMRESCUECD | 3/10 |

    | ALT LINUX RESCUE | 7/10 | ULTIMATE BOOT CD | 9/10 |

    | MORPHEUSARCH | 5/10 |  |  |


    New users will appreciate UBCD''s customised boot menu in particular.'
