  md: 'try to sell you a VPN, so let''s go with https://dnsleaktest.com, which won''t.
    It''s an interesting experiment to reverse those DNS changes, find your ISP''s
    DNS settings, then change your DNS server to a public one such as 1.1.1.1 and
    run the test again, to see if your ISP or some other malevolent creature is hijacking
    your DNS requests.


    # Know your onions


    For the network, formerly The Onion Router, consists of thousands of volunteer-run
    PCs: there are about 1,000 bridges and 7000 relays listed as of July 2019. These
    route connections past each other, with successive layers of encryption to regular
    ''cleanweb'' addresses or Tor .onion URLs. These layers are removed on the return
    journey, completing a ''circuit'', and it all makes for a system that''s very
    difficult to snoop on.


    The simplest way to use the Tor network is to download the Tor Browser from www.torproject.org/download.
    On Linux it ships as an XZ file which you can extract with:


    ```

    $ tar xvjf tor-browser-tor-browser-linux64-8.5.4_en-US.tar.xz

    ```


    and then run it directly from the tor-browser_en-US/ directory. Because new releases
    happen fast and often urgently, and the Tor Browser ships in a fairly self-contained
    form, it doesn''t make sense to rely on a distribution''s packaging methods for
    distribution. The locally installed Tor Browser will keep itself up to date in
    your home directory in much the same way as Steam does if you use it. There''s
    more to do to Tor than just the browser though: different applications can be
    proxied through Tor; similar to how connections can be tunnelled over SSH.


    > A browser is not an island (a profound insight... did you spend two weeks in
    a cave not writing this feature to come to this revelation? - Ed.), the operating
    system it''s running on can reveal all kinds of clues about how Tor Browser is
    used. So for what the shiny brochures call military-grade security, you need something
    special. Enter Tails, a distro you can boot from a USB stick that does not remember
    anything you do with it. Tails includes the Tor Browser. But you shouldn''t use
    it, at least not for anything other than curiosity.


    In fact you should only trust Tails with a higher version number than 3.14.2,
    because a patch happened that fixed multiple vulnerabilities in the Tor Browser,
    Thunderbird and others. One of the vulnerabilities affecting the Tor Browser was
    discovered during - and in fact won the Browser category of - the Pwn2Own competition
    held in March. So you really shouldn''t trust older versions with your private
    data. Of course, it''s entirely possible that between us writing this and you
    reading it there will be other issues and other releases, so follow our handy
    three-step guide below to download and install the latest edition.


    ![](img/7a0a282248f9658f0c87e55744c797b6_56_0.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_56_1.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_56_2.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_56_3.png)


    # HEAD FOR TAILS'
