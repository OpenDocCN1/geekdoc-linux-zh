    # # Dip into Containers


    Contain your applications, run a mailserver and have a whale of a time.


    ![](img/7a0a282248f9658f0c87e55744c797b6_75_0.png)


    **T**hose of you who are proud to be called Linux greybeards or have ever repaired
    a broken Linux install with a live disc will be familiar with the **chroot** command.
    This changes the root directory of the current shell, and if done into a directory
    containing a Linux install, effectively pivots into it. Provided you do some bind-mounting
    trickery first, this enables you to use all the software and libraries in the
    `/chroot` directory with the kernel and hardware from the working install. This
    is how most desktop Linux installers work.


    If you throw in some fairly complicated kernel technologies (namely resource management
    with `cgroups` and isolation with namespaces), then modern containers are just
    a natural evolution of this idea. Coming from another direction, modern containers
    are what you get if you sacrifice some of the isolation of VMs and throw away
    the requirement to have a complete operating system. This makes them more portable
    and easier to spin up than VMs. From a utilitarian point of view, containers enable
    applications


    # ## Installing Docker


    There’s a **docker** package in the Ubuntu repos, but it has nothing at all to
    do with containers, it being a dock applet for the venerable WindowMaker window
    manager. To install Docker on Ubuntu 18.04 you can use the Snap (available straight
    from the *Software Centre*) or you can add the **Docker repo**. The latter is
    slightly more work, but is also kept slightly more up to date than the snap, so
    let’s do that. First ensure everything is up to date:


    ```

    ```

    $ sudo apt update && sudo apt upgrade

    ```


    Then install some addons and helpers for Apt, and add the **Docker GPG** key:

    ```

    $ sudo apt install git apt-transport-https

    ca-certificates curl software-properties-common

    $ curl -fsSL https://download.docker.com/linux/

    ubuntu/gpg | sudo apt-key add -

    ```

    ```


    Now add the **Docker Ubuntu repo** and update the package lists:


    ```

    ```

    $ sudo add-apt-repository "deb [arch=amd64]

    https://download.docker.com/linux/ubuntu bionic

    stable"

    $ sudo apt update

    ```


    Finally we can install the Docker Community Edition with the following:

    ```

    $ sudo apt install docker-ce

    ```

    ```


    # ## Mail with added moo


    Back in **LXFA240** we showed you how to set up your own mail server. It took
    the best part of three pages, and it was fairly primitive. A wise reader wrote
    to us and told us about the **mailcow:docker** project by which a much more fully
    featured mail server (including a webmail interface, spam blocking and support
    for **Two Factor Authentication** and other tokens) could be set up more or less
    at the click of a button. Naturally, we were intrigued. Of course, nothing’s ever
    that simple and as before we won’t cover all the makeyzer of setting up your domain
    name and MX records. You’ll also need to make


    > > “Your code doesn’t work!” “It works on *my* machine.” “Fine, we’ll ship your
    machine!”

    >

    > And that’s how Docker started :)


    ![](img/7a0a282248f9658f0c87e55744c797b6_75_1.png)


    This tweet pretty much sums up why Docker is so useful.


    # ## » KU, KU, KUBERNETES... »


    If you’re struggling to keep up with all these trends and abstractions, then you
    may be appealed to hear that the innovation is ongoing and relentless. With the
    rise of **Cloud Native** applications, you would be forgiven for thinking that
    nobody runs anything on bare metal anymore. **Kubernetes** (designed by Google
    but now developed under the aegis of the **Cloud Native Computing Foundation**)
    has been described as “the POSIX of the Cloud”, in the sense that it’s fast becoming
    the standard way to orchestrate and manage containers and VMs in an infrastructure-agnostic
    manner. Microservices are what you get when you apply UNIX principles to services
    running in the clouds: lots of containers each doing a small jobs (but doing them
    well) connected together to do complex tasks.


    The security of containers (especially as compared to that of VMs) has been the
    subject of much debate. One might believe containers can’t match the level of
    isolation offered by VMs, namespace *maude* notwithstanding, since in a multi-tenant
    environment they must communicate through the host’s kernel. Containers can be
    locked down with **AppArmor** or **SELinux** or `seccomp` profiles, but these
    tend to break complex applications. Enter **Kata Containers**, which run containers
    with their own kernel, and use CPU features to provide VM-like isolation. They
    effectively turn **Docker** containers or k8s pods into lightweight VMs. Confused?
    We are, which is why we learned more at **https://katacontainers.io**.


    ![](img/7a0a282248f9658f0c87e55744c797b6_75_2.png)


    **Kata** containers – *blurring boundaries, increasing isolation, and simplifying
    security.*'
