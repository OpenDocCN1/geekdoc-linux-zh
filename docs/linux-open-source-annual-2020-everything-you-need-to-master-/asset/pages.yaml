  md: '# Distros


    # Usability


    What’s their user experience like?


    When it comes to distros that package specialised tools, it takes a lot more than
    the sum of its parts to win us over. Stuffing distros with loads of tools will
    help experienced users, but won’t be of much help in the hands of the average
    desktop user looking to rescue an unbootable machine.


    It’s because of this that usability becomes such a critical factor for specialised
    distros such as the ones in this Roundup. Also, remember that there’s more to
    usability than just beautiful interfaces; having relevant information on using
    the tools at hand is just as essential as picking the right tool for the job.


    Finally, just because a distro is usable irrespective of a user’s level of experience
    doesn’t mean it has less powerful tools than a distro designed for experienced
    users.


    # System Rescue Toolkit 8/10


    The distro is unique in that it has a couple of user modes. You can transfer the
    ISO to a CD or a USB and use it as a regular Live disk, which boots into a tweaked
    LXDE desktop. The desktop has icons for all the apps including command-line versions,
    which is really helpful for first-time users.


    Besides the Live environment, you can also run the distro from inside Windows.
    In this case it fires up a custom repair utility that lists all the available
    tools in its repository to help you repair a broken Windows installation.


    The custom app has multiple tabs, each of which houses apps for a particular area
    such as Hardware, Software, Networking, and such. While the custom app is intuitive
    to operate for anyone who is familiar with troubleshooting, there’s also a very
    helpful AutoFix utility which can help novices repair many common issues with
    a Windows installation.


    ![](img/7a0a282248f9658f0c87e55744c797b6_41_0.png)


    # ALT Linux Rescue 5/10


    Unlike the other distros in the Roundup, ALT Linux Rescue boots straight to the
    shell and is missing a graphical desktop altogether. This clearly points to the
    fact that it’s designed for experienced users who are not only familiar with the
    bundled tools but also know the ones they need to use to fix the issues affecting
    a system.


    Besides the couple of scripts mentioned earlier, you get no other conveniences.
    In addition to the regular boot option, the distro has a couple of others. There’s
    the aforementioned Forensics mode, which minimises interactions with the computer’s
    disk to help you conduct forensic investigation on the system.


    The other boot option is designed to rescue headless machines. It automatically
    assigns an IP address to the machine, assigns a random root password and starts
    a SSH server to help you access the machine remotely.


    ![](img/7a0a282248f9658f0c87e55744c797b6_41_1.png)


    # Help and support


    For when you need some hand-holding.


    MorpheusArch is one of the two distros in this Roundup that doesn’t have any sort
    of help information of its own. You do get a brief illustrated guide on LinDiag’s
    GitHub page, but there are no forum boards or mailing lists on which to seek help,
    so this distro is only designed for people who want to use the bundled recovery
    tools on an Arch base.


    ALT Linux Rescue isn’t any better in that it only gets a single page on the ALT
    Linux website, which lists the distro’s capabilities and some of the marquee utilities.
    There are Russian forums and mailing lists for the main ALT Linux distribution,
    but the Rescue edition doesn’t have any official support avenues.


    In sharp contrast, AIO System Rescue Toolkit has a detailed FAQ with a list of
    all the utilities and a couple of videos to help you find your way around the
    distro. There are no forum boards, but the developer has created a page on the
    website where users can post questions.


    SystemRescueCd’s website hosts a quick-start guide as well as detailed instructions
    on basic and advanced use. There are also instructions for experienced campaigners,
    such as the guide on how to make a custom version and backing up data from an
    unbootable Windows computer.


    With a tutorial section wiki and a detailed FAQ designed to familiarise users
    with the distro, UBCD surpasses its competition by a long way in this regard.
    The tutorial section, however, is just a pointer to a long list of user-contributed
    tutorials curated from the forum boards, so it could still be a little more friendly.
    The wiki has a list of all the tools in the distro, along with useful notes on
    their capabilities.


    # VERDICT


    | AIO SYSTEM RESCUE TOOLKIT | 7/10 | SYSTEMRESCUECD | 9/10 |

    | ALT LINUX RESCUE | 5/10 | ULTIMATE BOOT CD | 9/10 |

    | MORPHEUSARCH | 2/10 | | |


    SystemRescueCd and UBCD are the only distros that actively resolve queries on
    forum boards.'
  merge: -1
