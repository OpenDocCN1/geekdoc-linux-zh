- pgno: 82
  md: '# Malware on Linux


    Running desktop Linux certainly puts you in a minority, but malware doesn''t discriminate
    when it comes to your OS.


    At one stage utterances of the form “Linux doesn’t get viruses” were commonplace.
    They still are, by fans of the operating system and even by distro makers (see
    right https://manjaro.org). Unfortunately such talk was never quite true and it’s
    more fallacious now than it ever was. Worms, rootkits and all kinds of other nasties
    existed on UNIX systems while Linux was still just a twinkle in Linus’s eye. Many
    of the techniques they used were adapted to the Linux platform only as it fruitified.


    As far as desktop Linux is concerned, things are reasonably clear cut: there are
    far fewer attacks reported, and the list of known malware strains is far shorter
    than on Windows machines. Given desktop Linux’s market share (somewhere around
    two per cent), this makes sense – attackers will be more inclined to go after
    whatever the masses are using. In 2006 the ‘Get a Mac’ series of television commercials
    claimed “Macs don’t get viruses”. Since then, its desktop market share has increased
    to somewhere around ten per cent, and the number of threats has increased proportionally.
    This in spite of Apple’s walled-garden approach to software installation.


    These days opinion is divided on whether or not antivirus software is helpful
    on Windows, not because it doesn’t do what it claims to do, but because it sometimes
    (due to poor programming) opens the system up to New, potentially more dangerous
    attacks. Security guru Tavis Ormandy, part of Google’s Project Zero security team,
    has been particularly vocal about this threat. Programs that run with the highest
    level of privilege, as is required for antivirus to scan system files or privileged
    memory, need to be warytight. If these are vulnerable, then so is the system,
    possibly more so than if no such antivirus was running.


    More often than not you don’t need to rely on a vulnerable program to exploit
    a system: a vulnerable user will do just fine. Writing a program to encrypt all
    user files, to log/inject keystrokes (at least in X – see https://github.com/CoolerVoid/roostkealer),
    to


    ![](img/7a0a282248f9658f0c87e55744c797b6_82_0.png)


    Oh no, apparently our letters address has ended up on a breach list somewhere.
    No one tell the readers!


    ![](img/7a0a282248f9658f0c87e55744c797b6_82_1.png)


    Manjaro’s home page says you don’t need antivirus software, and they’re almost
    certainly correct.


    launch an FTP server (making a machine’s files available to the world), even to
    wipe all local storage if that user has root privileges and can be tricked into
    entering a password – all this is trivial. The trick is getting a suitably gullible
    user to run it. Likewise, with some knowledge of a potential mark, a carefully
    crafted phishing email could trick them into visiting a fake website from whence
    their passwords can be swallowed, opening a poisoned PDF, or even just running
    a malicious executable – if so something that wasn’t blocked by either email provider
    or the target’s email client. Humans have a bad habit of trusting things when
    they (seemingly) come from someone they know, so it’s easy to see how these things
    can cascade and become a large-scale outbreak.


    # WE ♥ STATS


    The Thycotic Black Hat 2018 Hacker Survey Report¹ states that almost 60 per cent
    of hackers thought social engineering was the fastest way to pwn a network. Malware
    (6 per cent) and application vulnerabilities (20 per cent) apparently are much
    less likely to be used. Thanks to lax security practices (or hacker ingenuity,
    there are considerably sized password dumps publicly available. You can check
    if any of your email addresses are associated with these dumps by visiting Troy
    Hunt’s https://haveibeenpwned.com.


    A password for an old forum you joined years ago may not be much use to a hacker,
    but if that four account can be tied to your identity (via email address, username
    or otherwise) and you re-use that password or some trivial variation of it elsewhere,
    the game changes. The survey found that password re-use was by far the most exploited
    behaviour by hackers (50 per cent), with public Wi-Fi use and poisoned USB drives
    being joint second at around 20 per cent each.


    Of course, the stereotypical image of a hacker doing destructive things with hex
    editors, dissemblers and debuggers isn’t entirely a work of fiction, but why go
    to that effort, if just asking nicely for someone’s password will do the trick.
    Of course, these aren’t definitive numbers, and the survey reports “300+” participants.”


    1) https://thycotic.com/resources/black-hat-2018-survey'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# # Protect your browser

    Web browsers have become OSes in their own right, and the modern web is a jungle.


    Drive-by downloads are pretty rare on Linux, and to be fair they’re becoming increasingly
    rare on Windows too. Gone, also, are the days where respectable programs bundled
    superstitious ‘optional’ extras with their installers, such as browser search
    bars or spontaneous uncloseable popup adverts. But that’s no excuse for complacency.


    Where these kinds of things do appear on Linux, it’s usually in the form of browser
    extensions, which are usually installed unwittingly by users. The goodly humans
    and machine-learn’d bots that patrol the Chrome store and the Firefox extension
    page can’t catch everything, after all. More often than not, these are easily
    uninstalled from the Add-ons (*Firefox*) or Extensions (*Chrome*/Chromium) preferences.
    Recent versions of *Chromium* can log all extension activity; just start it with:

    ```

    $ chromium --enable-extension-activity-logging

    ```

    Then go to the Extensions page, hit Details on the extension you’d like to interrogate,
    and scroll down to ‘View activity log’. If you don’t like what you see, disable
    or delete the extension.


    ![](img/7a0a282248f9658f0c87e55744c797b6_83_0.png)


    Firefox’s Multi-Account Containers are an extension well worth your attention.
    As with Docker and such, the idea is to segregate workflows, in this case through
    colour-coded browser tabs. So you can do all your social media, say, in one domain
    and all your research and actual work in another. They also provide the convenient
    ability to log into the same site with two different sets of credentials – useful
    if you manage multiple Gmail or Twitter accounts. Facebook gets its own special
    container (**http://bit.ly/txf251book**) which ensures that its tracking cookies
    won’t know who you are outside this container.


    *Firefox* containers address privacy concerns more than malware ones (we wouldn’t
    dare slander Facebook by calling it malware), but it’s not inconceivable that
    some advanced malware exists, or will exist, that can use the fact that the user
    is logged into the high-profile or high-value sites. See more extensions we approve
    of in the box later on.


    Internet banking is naturally an area in which you should consider using a container.
    And in fact exercise every available precaution: long passwords, regular checks
    for dodgy transactions, carefully reading any emails purportedly from them for
    signs of fraud. In particular, check any links to suspect domains. Readers are
    often wary of our use of *bit.ly* shortened URLs. We think you should trust us
    (it’s impossible to change them after the fact) and oftentimes URLs are longer
    than a sane reader would care to scrouse, so it’s not something we’re going to
    stop. If in doubt, services like **http://checkshorturl.com** or **https://urlex.org**
    are your friends (but can you trust them?).


    # ## WHEN TO BE PARANOID


    > “Internet banking is naturally an area in which you should consider using a
    container, and exercise every caution.”


    ![](img/7a0a282248f9658f0c87e55744c797b6_83_1.png)


    # ## Freshen up


    More persistent browser infections have been recorded in the past, but these days
    rogue extensions have to fight with a lot of browser safeguards to hide, access
    files or siphon personal data. That being said, if you are at all worried about
    your browser then safeaty trumps sorrowsy and worry, and since any unwanted browser
    extras generally live in the user profile directory, an easy fix is just to delete
    the old profile and start with a new one. Even if you don’t think there’s anything
    untoward in there, a fresh profile will have a clean cache and so could speed
    up your browsing experience.


    *Firefox* even has an option to do almost this straight from the browser. Just
    navigate to **about:support** and hit the ‘Refresh Firefox’ button on the top-right
    of the page. This will preserve your bookmarks, auto-fill information and passwords,
    but will purge any extensions and themes. Add-ons which live outside the profile
    folder will survive, but will have live preferences reset. The old profile folder
    will be packed up to the Desktop and its contents can be copied back to the original
    location if the situation isn’t resolved or you miss something.


    If you want to nix your profile directory the old-fashioned way, first find out
    where it is with:

    ```

    $ cd ~/.mozilla/firefox/

    $ ls

    ```'
  merge: -1
