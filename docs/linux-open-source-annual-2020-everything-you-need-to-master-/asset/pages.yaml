  md: '# QUICK TIP


    > We said that embedded computing platforms don''t have operating systems, but
    they might. Devices such as set-top boxes, routers and other networking equipment,
    and medical electronics might well run an operating system. What''s more, there''s
    a good chance it could be Linux-based.


    note that there''s a forum where you can enlist community support. We should also
    point out that the first tutorial in the starter kit describes the installation
    of the IDE so, if you have problems, take a look at the PDF document that appears
    on the kit''s CD in the folder for your language.


    # Ellegro UNO


    We''re now going to be showing you how to get some hands-on experience of embedded
    computing using the Ellegro UNO Basic Starter Kit. Ellego sells directly from
    its website ([www.ellego.com](http://www.ellego.com)) in US dollars, but it also
    sells via Amazon in several countries at much more competitive prices. At the
    time of writing, the Basic Starter Kit costs just £13.99 in the UK and $14.99
    in the USA, from Amazon.


    As the name suggests, the kit includes an SBC that''s compatible with the Arduino
    UNO R3. We won''t list the specification of that board; suffice to say that it''s
    adequate for all the projects documented in the kit, and a whole lot more. The
    kit also includes a USB cable to connect the UNO to a PC, and a mini-CD containing
    a tutorial document and the code for all the projects, although they''re also
    available online. The rest of the kit comprises several electronic components
    with the means of connecting them together and to the SBC.


    ![](img/7a0a282248f9658f0c87e55744c797b6_105_0.png)


    The Integrated Development Environment enables you to develop code on a PC and
    upload it to an Arduino board when you''ve finished.


    # THE ARDUINO FAMILY


    The Arduino family – even if we only consider the official boards – is much more
    diverse than the Raspberry Pi family, and becomes even more so when we include
    third-party products in the mix. The names don''t really reflect where they are
    in the pecking order, though, so you''ll need to consult a comparison table to
    decide which one to use. Like SBCs that run Linux, Arduino boards are differentiated
    by the power of the processor and the amount of memory, but only to a degree.
    You might do better than the 16MHz 8-bit processor on the UNO, but you''re not
    going to find anything comparable to the Raspberry Pi''s processor, and only a
    few have more than 256KB program flash or 32KB RAM. For all but top-end embedded
    applications, you''d be more interested in the number of I/O pins and the size
    and form factor, and here Arduinos vary quite a bit. You''ll also find that some
    don''t have headers for I/O connections. While these are indispensable for learning
    and for development, or if you want to add a shield, for a real-world application
    much greater reliability would be achieved if you use one of the boards that just
    has ''pads'' onto which you can solder the leads to external components.


    First is the breadboard on which you''ll mount the various electronic components
    and make electrical connections between them. There are male-male patch leads
    for making connections between components on the breadboard; a few for connecting
    the components on the breadboard to the input/output pins on the UNO, and there
    are also a few female-female patch leads. Turning to the components themselves,
    there are LEDs of various colours, pushbuttons, a buzzer, a photo detector and
    a tilt switch. There are also several components that are needed for interfacing,
    mostly resistors, including a 74HC595 IC – a serial-to-parallel converter that''s
    used in some of the projects.


    To see the UNO in action, just attach it to your PC using the USB cable supplied.
    Be careful not to put the board down on an electrically conducting surface, because
    this could cause shorts to the solder joints on the bottom of the UNO. As soon
    as it''s connected to a PC, you''ll notice that the green power LED illuminates
    and an orange LED starts flashing. The UNO is supplied with a simple program already
    flashed into memory, and it''s this code which is responsible for flashing the
    LED, and serves to prove that the board is working properly. Now it''s time to
    start off the IDE, which we assume you''ve already installed; this won''t stop
    the LED from flashing. You''re now ready to take your first steps in embedded
    programming.


    # Programming in an UNO


    First we''re going to see how to upload some code to the UNO and move on to modify
    that code. This mirrors the second lesson on the Ellego UNO Basic Starter Kit
    CD, the first one being the installation of the IDE. This is an excellent place
    to start since it doesn''t require you to wire any external components to the
    UNO''s I/O pins. Before doing anything, it''s necessary to tell the IDE which
    Arduino board you''re using, although it''ll probably default to the UNO. To check,
    or change it if necessary, go to Tools > Board. We''re not going to create any
    new code to start; nor use one supplied in the starter kit, but instead we''ll
    use some sample code supplied with the IDE. Open that in File > Examples > 01.Basics
    > Blink and it appear in the IDE''s editing window. In Arduino-speak, the code
    is called a sketch.


    ![](img/7a0a282248f9658f0c87e55744c797b6_105_1.png)


    The Ellego UNO Basic Starter Kit is a very cost-effective way of learning the
    principles of embedded computing.


    CREDIT: Ellego'
