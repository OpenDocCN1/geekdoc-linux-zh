  md: 'or dnf on your system. The search command will show you hits in any of your
    configured for the keyword that you provide:


    ```

    $ flatpak search calibre

    ```


    This will return a result for the excellent Calibre e-book manager, which is often
    out of date in the Ubuntu repositories. Note the first column, which gives the
    Application ID in a sort of reverse-domain format (com first, then domain, and
    so on). You’ll need to give this to the install command for Flatpak to install
    your program:


    ```

    $ flatpak install com.calibre_ebook.calibre

    ```


    At this point Flatpak will start downloading and installing your application and
    any runtimes (org.freedesktop — see the screenshot, below right) it requires.
    A runtime is a collection of libraries and other software for the application.
    It’s the Flatpak way of resolving your dependencies for you.


    “Wait,” you might say, “isn’t this what apt and yum do for me?” It’s a fair question.
    There are a few notable factors that set runtimes apart from normal Linux dependency
    management.


    +   * Flatpak’s sandbox environment ensures anything you install won’t conflict
    with your system proper.

    * A runtime is a fixed set of software, so you know you’ll get exactly you need
    to run the app — no more, no less.

    * Flatpaks are built against specific runtimes, so there’s no need to worry about
    upgrades breaking your program all of a sudden.


    The trade-off boils down to confidence that the program will always have what
    it needs to run as intended, but note that it’ll need to take up more disk space
    to do so.


    There are a couple of other methods you can use to install applications. If you
    happen across a rogue Flatpak and download it, install it from the command line
    using the command above:


    ```

    $ flatpak install somefile.flatpak

    ```


    Finally, Flatpak provides a method for installing an application by running an
    installation file. This file, called a .flatpakref, contains some metadata about
    the program, including:


    +   * Its full name.

    * The hub from which it should be downloaded.

    * Its version.

    * Whether it is a runtime or not.

    * Its GPG signature.


    Installing from a .flatpakref file is the same as installing from a locally downloaded
    Flatpak file:


    ```

    $ flatpak install /somerefile.flatpakref

    ```


    You can also use a GUI package manager, which should display and install Flatpaks
    in the same way it does other packages (provided that you installed the backend).


    # Running Flatpak programs


    Once your program is installed, you can launch it from the command line as follows:


    ```

    $ flatpak run com.calibre_ebook.calibre

    ```


    Once the program starts up, there are a couple of things you’ll notice. The first
    is that you’ll have access to all your normal $HOME directory files. “But, but,”
    you’ll ask, “I thought the Flatpak sandbox was isolated from the rest of the system?”
    That’s very accurate of you. However, running a program that can’t interact with
    your files isn’t very useful. The Flatpak developers have worked around this.


    You should also see entries for the application show up in your desktop’s menu.
    If you don’t see them, check the Quick Tip (left) for how to try and fix this.
    Actually, under most circumstances, you shouldn’t be able to tell the difference
    between these programs and those provided by your distribution. You can operate
    on your files, play multimedia files, and generally use them as a “normal” program.


    # Managing your Flatpak installs


    Once you have a Flatpak or two installed, you can, of course, use your GUI package
    manager to administer them. But if you prefer the terminal, some of the below
    commands will be useful. You can list the Flatpaks (both apps and runtimes) you
    have installed with the following command:


    ```

    $ flatpak list

    ```


    The result displays not only the installed modules, but also their installation
    type (system/user). You can update all your Flatpaks with a single command, just
    like native package managers:


    ```

    $ flatpak update

    ```


    In the event you need to remove a Flatpak, enter the following at the prompt:


    ```

    $ flatpak remove [full-qualified app name]

    ```


    If you need to remove one of the hubs you’ve configured, you can do so with the
    following:


    ```

    $ flatpak remove-remote [name of remote]

    ```


    # Conclusion


    The benefits of the Flatpak format are numerous. It provides developers with an
    option to target multiple distributions, while giving users multiple tools to
    install the resulting applications. It enables programs to access the resources
    they need, while restricting them from the things they don’t. It works around
    some of the dependency problems of traditional packaging formats, at the expense
    of a little disk space. Finally, it opens up opportunities for developers to wrap
    up applications that are traditionally tedious to install in a format that’s drop-dead
    simple.


    So if you want to try out the cutting-edge version of LibreOffice or run a Wine-based
    game like World of Warcraft, give Flatpak a try. You really can’t go wrong! [13]


    Like traditional package managers, Flatpak will download and install Calibre and
    the runtimes on which it depends.


