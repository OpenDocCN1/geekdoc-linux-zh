- pgno: 166
  md: '![](img/7a0a282248f9658f0c87e55744c797b6_166_0.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_166_1.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_166_2.png)


    # T


    he mainstream Linux distributions spend a lot of time selecting their default
    bouquet of programs. After all, they need the tools to cater to the largest number
    of users. Sure, these programs excel at what they do, but there are thousands
    of other brilliant software lurking in code-sharing silos like GitHub and Sourceforge,
    and even inside the official repositories of your favourite distribution, waiting
    to be discovered.


    Realistically though, do you have time to try all of these tools? Do you even
    want to, considering that your needs are served well enough by the distro’s default
    options? Add to that the


    fact that most of us have our favourite open source apps and a conviction that
    they work for us better than any available alternative. That said, we’ll encourage
    you to take a step outside your comfort


    zone to marvel at the diversity of the Linux-verse. And don’t let the number of
    low-quality, unmaintained programs deter you from exploration.


    # EXPAND YOUR FRONTIERS


    “Don’t let the number of low-quality, unmaintained programs deter you from exploration”


    At LXF Towers we spend a lot of time rummaging around the source code mirrors
    and other places to discover new gems to cover in the magazine. This issue we’ve
    decided to collate all the best ones we’ve encountered in our travels. We’ve stayed
    away from including the popular mainstream tools, but you might still be familiar
    with some of them because they’re just that good.


    For the most part though, the next few pages will introduce you to graphical apps
    and CLI utilities that you’ve never come across before. No matter the type of
    user you are or how you use Linux, the following pages will give you plenty of
    open source goodies to spruce up your Linux box.'
