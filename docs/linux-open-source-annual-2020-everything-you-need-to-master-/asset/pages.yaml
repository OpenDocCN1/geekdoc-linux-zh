  md: "![](img/7a0a282248f9658f0c87e55744c797b6_9_0.png)\n\nMayank Sharma can't help\
    \ you find your purpose in life, but he sure can help find a distribution for\
    \ your purpose.\n\nL inux, the kernel, by itself wouldn't be of much use to most\
    \ of us. Version 0.01 of the Linux kernel made its debut in September 1991, but\
    \ it only made sense to a particular Finnish student and his ilk of uber-geekish\
    \ hackers.  \nOne of them, Owen Le Blanc of the Manchester Computing Centre (MCC),\
    \ wrote a menu-driven installer to install the kernel along with a handful of\
    \ GNU utilities, and in the process created the first Linux distribution in February\
    \ 1992. This distribution allowed even non-Unix users to get a taste of Linux\
    \ and helped roll in more developers.\n\nLater that year Peter MacDonald created\
    \ the Softlanding Linux System (SLS) distribution that offered a software collection\
    \ on top of the X11 graphical interface, which had only recently been ported to\
    \ Linux. SLS in turn spawned two major distributions. The first was Slackware\
    \ created by Patrick Volkerding in July 1993. Over two decades later it remains\
    \ the oldest Linux distribution that's still actively maintained. The other was\
    \ Ian Murdoch's Debian. Although it had been in development for several months,\
    \ v0.91 released in January 1994 was its first public release and included a simple\
    \ package system that could install\n\nand uninstall packages. The next major\
    \ milestone in the Linux distribution timeline also happened in 1994 with the\
    \ birth of Marc Ewing's Red Hat Linux. Together these three distributions form\
    \ the bedrock of the modern Linux distribution habitat. Although there have been\
    \ other independent distributions such as Crux, Arch, Gentoo and Puppy, a majority\
    \ of the current stock is an offshoot of the three oldest distributions. You'll\
    \ find hundreds of them on distrowatch, all vying for a slice of your hard disk.\
    \ Over the next few pages we'll help you sort through the lot and pick the one\
    \ that'll serve you best."
  merge: -1
  img_proc: true
- pgno: 10
  md: "# # Name your poison\n\nWhat do you want to get out of a modern Linux distro?\n\
    \nAs users make their way to Linux, one of the first peculiarities they encounter\
    \ is that there’s no single one Linux. The concept of distributions is fairly\
    \ foreign to a majority of new users migrating from the shores of proprietary\
    \ desktop operating systems. Long-time readers wouldn’t flinch at the fact that\
    \ Linux is essentially just a kernel, but Linux, the operating system that most\
    \ people refer to is actually the distribution: a collection of software consisting\
    \ of the kernel and all the support programs that a user would need.\n\nOn the\
    \ face of it, all distros borrow from the same common pool of apps and libraries.\
    \ However, a Linux distro is more than the sum of its parts. All distros, especially\
    \ the mainstream ones, put in several hundred hours working on the open source\
    \ components to tweak and polish them to suit their particular flavour of Linux.\
    \ For a majority of projects, it takes a globally dispersed team of developers\
    \ to engineer and ship a Linux distro.\n\nThe popular distro go that extra mile\
    \ to create a solid operating system experience, and write everything from installers\
    \ to several critical programs and utilities to help manage the\n\n# ## » HOW\
    \ WE TESTED\n\nOur distros have been tested against various parameters that vary\
    \ from one category to the next. For instance, when evaluating a beginner-friendly\
    \ product we pay attention to the custom tools and other tweaks that help increase\
    \ the distros’ usability. That’s because a new Linux user needs to be handed through\
    \ everyday computing tasks as they get familiar with the lay of the land. While\
    \ choice is the hallmark of open source, it’s a distraction to a first timer.\
    \ A good beginner-friendly distro helps users by making choices on their behalf.\
    \ Some go to the extent of forking popular apps to write customised versions that\
    \ can be handled by newbies. Generally speaking, a distro aimed at the inexperienced\
    \ user should be easier to use than your typical desktop distro.\n\nFor server\
    \ distros, our focus will be on their comprehensibility and ease of rollout and\
    \ management. Like desktop distros, server distros are designed to work on various\
    \ hardware configurations depending on how you plan to use them, but will perform\
    \ best on 64-bit hardware. In contrast, hardware is a paramount factor for distros\
    \ designed for older boxes.\n\ninstallation. The top distros are also constantly\
    \ evolving, some more than others. Some distros have the resources of cash-rich\
    \ multinational corporations (Ubuntu, Red Hat, OpenSUSE) that fuel their R&D.\
    \ Yet thanks to the nature of open source, that one factor alone doesn’t always\
    \ help corporate-backed projects get a technological edge over pure donation-based,\
    \ community-supported (Mint, Debian, Arch) efforts.\n\nIn this feature we’ve broken\
    \ down the seemingly endless list of distros into five most-required categories\
    \ that cover the top-use cases for deploying Linux, from the desktop to the business\
    \ server and everything in between.\n\nChoosing a distro is an involved process,\
    \ and this is why many users prefer to stick to the one they have set up and update\
    \ it every six months or so. However, most distros, especially the more popular\
    \ ones, are constantly evolving. A distro that fell out of favour for introducing\
    \ a new feature in one release might score better with its peers when that feature\
    \ stabilises in a subsequent release. Of course, we aren’t going to suggest that\
    \ you keep hopping distros whenever a major player unveils a new version. But\
    \ if you’ve been using the same distro for a while, it’s time to take a good look\
    \ at the other options out there.\n\n# ### Conscious omissions\n\nWe’ve deliberately\
    \ avoided the contentious “best desktop” category, which frankly would just list:\
    \ Ubuntu, Linux Mint, Fedora, OpenSUSE and then any one of a multitude of distros\
    \ whose inclusion or absence will in turn enrage various groups! Debian is also\
    \ very much absent despite its fine pedigree and foundational status in the Linux\
    \ ecosystem. If we had a pure Server category this would clearly be in there (don’t\
    \ start on us with Debian-Ed) but hopefully this is an insightful list for those\
    \ new to the world of Linux distros.\n\n# ### Do it yourself\n\nWe’ll also help\
    \ you produce your own distro. That would seem counterproductive given the myriad\
    \ of excellent options on offer. The custom distros we’re talking about here are\
    \ highly customised ones that you’ve tweaked as per your needs. Imagine converting\
    \ your perfectly setup system into a live installable medium? Carry it with you\
    \ on a flash drive or even install it on other PCs you use.\n\nBesides satisfying\
    \ your personal itch, there are several other uses for a custom distro. You can\
    \ spin one with programs that you use in school and pass it around to everyone\
    \ in class, stuffed with class notes and other study aids. You can do something\
    \ similar within a professional organisation as well that uses a defined set of\
    \ applications. The possibilities are practically endless!\n\n# # TOP 20 DISTROS\n\
    \n# ## BEGINNER DISTROS\n\n+   * **DEEPIN**\n  An elegant-looking Debian-based\
    \ distribution that uses an intuitive custom desktop along with a host of custom\
    \ tools.\n\n![](img/7a0a282248f9658f0c87e55744c797b6_10_0.png)\n\n+   * **PINGUYOS**\n\
    \  Its customised Gnome rendition will impress new and old desktop Linux users\
    \ alike, but it has stringent requirements.\n\n![](img/7a0a282248f9658f0c87e55744c797b6_10_1.png)\n\
    \n# ## ELEMENTARY OS\n\n+   * **ELEMENTARY OS**\n  Another aesthetically pleasing\
    \ distribution with beautifully crafted desktop and apps, only limited by its\
    \ default cache of programs.\n\n![](img/7a0a282248f9658f0c87e55744c797b6_10_2.png)\n\
    \n# ## ZORIN OS\n\n+   * **ZORIN OS**\n  Its USP is the appearance altering tool\
    \ that’ll make the Gnome desktop similar to that of Windows, which will comfort\
    \ new users.\n\n![](img/7a0a282248f9658f0c87e55744c797b6_10_3.png)\n\n# ## LINUX\
    \ LITE\n\n+   * **LINUX LITE**\n  Its host of custom tools such as its software\
    \ utility and welcome screen make light work of regular desktop tasks.\n\n![](img/7a0a282248f9658f0c87e55744c797b6_10_4.png)"
  merge: -1
  img_proc: true
- pgno: 11
  md: '# # Distros


    # # (Re)Master Ubuntu


    Point and click your way to a custom spin.


    ne reason that’s contributed to the staggering number of Ubuntu respins is the
    availability of easy-to-use tools that help you create a customised version of
    the installation. While the process for creating a customised distribution isn’t
    rocket science, with Ubuntu it’s a walk in the park.


    One of the easiest to use is Bodhibuilder, which is a fork of the popular Remastersys
    script (see box, below). Despite its name, Bodhibuilder can create customised
    respins of Ubuntu and any of its derivatives like Linux Mint and Bodhi Linux.
    The latest version of Bodhibuilder works on both 32- and 64-bit installations,
    and builds UEFI compatible images. The Bodhi Linux project in fact uses this script
    to churn out their official releases as well.


    To create your customised Ubuntu spin, it’s best to first build an installation
    from scratch. We’d advise you to do this inside a virtual machine to save yourself
    a lot of hassle. Begin the process by downloading the minimal Ubuntu ISO that
    includes the least number of components required to boot Linux.


    When you install Ubuntu from the minimal ISO, the installer will bring up the
    tasksel tool to enable you to select the additional components you’d like to install.
    There are options to help you tailor your installation as a mail server, file
    server and various other types of servers. We are, however, interested in the
    several desktop-centric options that cover all the popular desktop environments
    including Mate, Gnome, Xfce, LXDE and Budgie with both vanilla and extended application
    suites.


    We prefer to start with a minimal desktop and then flesh out the installation
    from within. Besides the desktop options, it’ll give you options that will fetch
    programs of a particular genre, such as audio recording/editing suite, photograph
    touch-up and editing suite, video creation and editing suite, and more. Once you’ve
    made the selection, the installer will fetch the required components from the
    online repository and install them just like the installer on a regular Ubuntu
    ISO. For your first build, we’d suggest you select one of the minimal graphical
    environments.


    # ## Start building


    After installation, boot into it and modify things as you see fit. You can install
    and remove any applications using the package manager and also by downloading
    pre-packaged binaries for app not in the official repositories. Also feel free
    to customise the desktop by modifying the various components like the menus, wallpaper
    and themes.


    When you are done customising your installation, you can install Bodhibuilder.
    The script is available as a pre-packaged binary at the project’s Sourceforge
    page (https://sourceforge.net/projects/bodhibuilder). Bodhibuilder is intuitive
    to use once you get familiar with its interface. The first thing you should do
    is switch to the Settings tab to define the name of your custom distribution.
    Use the various text boxes under this tab to set up the username of the Live environment,
    the name of the ISO image file, and the name of the distro as it’ll appear in
    the GRUB boot menu. The working directory is where the script will generate and
    place the custom ISO image. It’ll first create a folder named Bodhibuilder under
    the specified directory to conduct all its operations. Make sure the folder is
    on a partition that has ample free space and is formatted with a Linux filesystem,
    like EXT4.


    Advanced users get the option to list the files and directories they’d like to
    leave out of the generated ISOs. Similarly, by default Bodhibuilder will include
    all icons and locales under the /usr/share/icons and /usr/share/locales directories.
    You can only include particular icons and locales by listing them in the space
    provided. There’s also space to list any squashfs images, but it’s best to leave
    it empty unless you know what you’re doing.


    After describing your distro, switch back to the Actions tab that offers build
    options. Of the note are the Backup and Dist options. Backup will roll the installation
    into an ISO image with the same settings as your current desktop. It’s meant for
    your personal use and it includes all your user data and personal information.


    For our purpose though, we’ll use the Dist option that will also create an ISO
    image, but will exclude all your


    # ## FORK IN THE ROAD


    Remastersys has always been one of the most popular scripts for transforming a
    customised Ubuntu installation into a bootable ISO image. It drew inspiration
    from Mandriva’s mivivecd, but was written for Ubuntu. When the original script
    ceased development, it was forked by several other projects, most notably Bodhi
    Linux and PinguOS. We’ve used the Bodhi Linux fork called Bodhibuilder in this
    article and you can just as easily use PinguOS’s fork named Pinguoy Builder.


    Besides these, there’s now something of an official fork of the original script.
    Dubbed Linux Respin, this script is hosted at the original remastersys.org website.
    Unlike the other two however, Linux Respin focuses on creating custom spins from
    Debian and Linux Mint. There’s also a version that will work on one of Free Software
    Foundation’s favourite distributions called Trisquel GNU/Linux. The Linux Respin
    developers are working to port the script to Fedora installations as well, so
    keep your eyes peeled for news on that front.


    ![](img/7a0a282248f9658f0c87e55744c797b6_11_0.png)


    > If you have multiple users, specify the user whose settings will be used as
    default when using the Backup option.'
  merge: -1
  img_proc: true
- pgno: 12
  md: "personal and user-specific data. You can then safely distribute this ISO without\
    \ sharing any sensitive information. This option is designed for making custom\
    \ distros. Additionally, the Dist mod’s live user logs you in without a password.\
    \ Besides these options, there are buttons for the Distcdts and Distiso options\
    \ that break the Dist process into two steps and enable you to plop additional\
    \ files on the ISO image.\n\nAnother set of interesting options are listed below\
    \ the main functions. Using them you can replace the default GRUB background image\
    \ with any custom 640x480 PNG image for both the live environment and the installed\
    \ system. You can also apply a custom Plymouth boot animation. You can find several\
    \ at www gnome-look.org and www. deviantart.com. Before we can use them on our\
    \ custom distro you’ll have to install them on your system. So grab the Plymouth\
    \ themes tool with **sudo apt install plymouth-themes**. Then download and extract\
    \ a theme under the /usr/share/plymouth/themes directory. You can then set the\
    \ new plymouth theme as the default with **sudo update-alternatives --install\
    \ /usr/ share/plymouth/themes/default.plymouth default.plymouth <path-plymouth>\
    \ 100**.\n\nRemember to replace <path-plymouth> with the **plymouth** file in\
    \ your custom Plymouth theme. You’ll now have to rebuild the initrd image with\
    \ **sudo update-initramfs -u**. Once a Plymouth theme has been installed it’ll\
    \ be listed when you press the button to select a Plymouth theme in Bodichild.\n\
    \n# Skeleton in the cupboard\n\nThe next step is to transfer your desktop customisations\
    \ to the ISO. Here we’ll use the Skeleton directory (**/etc/skel**) that initiates\
    \ a new user’s home directory. In practice this means any files placed under the\
    \ **/etc/skel** directory will be copied over to every new user’s home directory\
    \ when a user is created. The skeleton directory helps all new users get the same\
    \ initial settings.\n\nAll your custom desktop settings are housed in hidden files\
    \ in your user directory. For example, we change the default wallpaper of the\
    \ Mate desktop and use the MATE Tweak app to place icons on the desktop, along\
    \ with a Plank dock on the desktop and position it to the left side of the screen\
    \ and change the layout and behaviour of the panel.\n\nTo carry these changes\
    \ over to the custom distro copy the **~/.config** directory to **/etc/skel**.\
    \ Some programs house their customisations under **~/.local/share** directory\
    \ so you can move this over to **/etc/skel** as well. Make sure that none of the\
    \ programs in the installed system have any account-related information such as\
    \ usernames and passwords, or you’ll end up transferring them to your custom distro\
    \ as well. Similarly, if you’ve installed custom themes and icons, they’ll be\
    \ under the **~/.icons** and **~/.themes** directories and should also be copied\
    \ over to **/etc/skel**.\n\nThe **/etc/skel** directory represents a new user’s\
    \ home directory. So if you want to place a custom icon on the desktop of your\
    \ custom distro,\n\n![](img/7a0a282248f9658f0c87e55744c797b6_12_0.png)\n\nMake\
    \ sure you’ve copied the customised ISO image out of the working directory before\
    \ you empty it with the Clear button.\n\nYou’ll need to create a desktop file\
    \ under the **/etc/skel/Desktop** directory. For example, to create a Desktop\
    \ icon to your favourite website, first create the desktop directory with **mkdir\
    \ -p /etc/skel/Desktop**. Then change into that directory and create a shortcut.desktop\
    \ file with the following contents:\n\n```\n<Desktop Entry>  \nVersion=1.0  \n\
    Name=Shortcut  \nComment=My favourite website  \nGenericName=Shortcut  \nExec=firefox\
    \ www.linuxformat.com  \nTerminal=false  \nX-MultipleArgs=false  \nType=Application\n\
    ```\n\nSave the file when you’re done. Your custom distro will now include an\
    \ icon on the desktop to launch Firefox and visit linuxformat.com.\n\nNow, the\
    \ last bit of customisation is to clear out the crud from the installed system.\
    \ Save yourself a lot of time by using BleachBit (available in the official repositories).\
    \ Fire up the program, head to Edit>Preferences and switch to the Languages tab.\
    \ To reduce the size of the ISO image, uncheck any languages you don’t want to\
    \ include in your distro.\n\nBack in the app’s main interface, the left panel\
    \ lists the areas of your system it’ll clean. Toggle the checkbox next to APT,\
    \ Deep Scan, Journal and Thumbnails sections. Expand the System section and toggle\
    \ all options except Free disk space and Memory. These will take a long time and\
    \ don’t really help us in our current endeavour. After toggling the checkboxes,\
    \ click the Clean button to zap all the unnecessary files from the installation.\
    \ All that’s left is to convert it into a Live distributable ISO image. In Bodichild\
    \ press the Dist button to ask the script to start compressing your Live ISO.\
    \ It’ll automatically switch to the Output tab to enable you to keep an eye on\
    \ the task’s progress. Depending upon the resources you’ve earmarked for the VM\
    \ this can take a while.\n\nWhen it’s done, the script will display the path to\
    \ the cooked ISO image, which is under the working directory you specified earlier.\
    \ You can scp the image out of the VM to the host and then use the ISO to boot\
    \ another VM. After you’ve made sure that your customisations have been imaged\
    \ you can dd the image to a USB disk and even send it out to your friends and\
    \ family.\n\n# TOP 20 DISTROS\n\n# ROLLING DISTROS\n\n# MANJARO\n\nBased on Arch\
    \ Linux, it focuses on user-friendliness and supports editions based on the Gnome,\
    \ KDE and Xfce desktops.\n\n![](img/7a0a282248f9658f0c87e55744c797b6_12_1.png)\n\
    \n# SABAYON\n\nA 64-bit only Gentoo-based distro that uses the Calamaris installer\
    \ and comes with its own package management system: Entropy.\n\n![](img/7a0a282248f9658f0c87e55744c797b6_12_2.png)\n\
    \n# SOLUSOS\n\nThe highlight of this distro is its home-brewed Budgie desktop\
