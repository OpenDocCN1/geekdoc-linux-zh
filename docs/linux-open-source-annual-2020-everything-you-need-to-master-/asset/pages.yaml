  md: '# Lighttpd 10/10


    During lighttpd installation, we can install fast-cgi and fastcgi-php so that
    we can build PHP apps and test them. But, there is much more to it than that.
    Lightly installs very quickly and responds almost instantly when a command is
    typed. In addition, the simple commands do all the hard work for us and both PHP
    and mySQL database will work just as we expect. However, we must note that if
    we do not enable and reload Lightly after installing fast-cgi, we will receive
    403 errors in our browser.

    Once Lightly has been installed, it will look for one of two default files (index.html,
    index.lighttpd.html and index.php) from the /var/www/html folder. The quick Lightly
    setup and the fact that all files and folders reside in the same path as Nginx
    and Apache make it a gem, too. It’s nice to be able to build in one location and
    test all servers from one spot rather than having files all over the place.


    ![](img/7a0a282248f9658f0c87e55744c797b6_128_0.png)


    # Openlitespeed 8/10


    During Openlitespeed installation, an index.html file is created that is used
    as the default webpage. In addition, PHP works right off the bat since it comes
    with its own PHP handler called LiteSpeed SAPI PHP. Unlike Nginx, Apache and Lighttpd,
    the html files are stored at the path /usr/local/lsws/Example/html/index.html.

    With Openlitespeed, its strengths lies in testing simple HTML and PHP files in
    the root folder. However, as soon as we want to test a real-world application
    like WordPress, or the Laravel Framework, its default setup falls flat on its
    face. If we’re working with subdirectories, we need to change the vhost.conf file
    and add the subfolders manually. Another issue is that our mySQL installations
    which work seamlessly with Nginx, Apache and Lighttpd, do not work out of the
    box with Openlitespeed. Any of our previous databases built with PhpMyAdmin cannot
    be initially used.


    ![](img/7a0a282248f9658f0c87e55744c797b6_128_1.png)


    # Tomcat 9/10


    Tomcat installs and works right off the bat. Unlike, like Openlitespeed, Tomcat
    files, by default, sit in a different location than those for Apache, Nginx and
    Lighttpd. In fact, they reside in the /var/lib/tomcat7/webapps/ROOT directory.
    In addition, its default port is 8080, unlike other web servers running on port
    80.

    Unlike all the other servers, Tomcat is designed to deliver Java Servlets and
    JSPs. Thus, with a Java project, a (WAR (web archive) file can be dropped and
    deployed with Tomcat. Although Tomcat can be used to deliver browser-interpreted
    files such as HTML, CSS and JavaScript, it can be configured to interpret PHP
    files as well, although it was not designed for this purpose which makes it more
    of a specialized tool for programming in Java. Considering Tomcat is Java-based,
    it does rank fairly well as a popular web server and seems to just work without
    issues.


    ![](img/7a0a282248f9658f0c87e55744c797b6_128_2.png)


    # Customisation

    Adding and enabling modules and custom directory options.


    Since most websites will use a server-side language, such as a WordPress installation
    or basic code to handle a contact form from HTML, let’s have a look at how easy
    that is to implement.

    Extending web servers is easier with some others. However, from a simplistic standpoint,
    both Apache and Lighttpd make it very easy to check modules and enable them as
    needed. For example, one such module that is not enabled by default in Apache
    is mod_cache. Nginx, on the contrary does offer plenty from the first go, but
    single commands to enable and disable them are not part of the program. With Nginx,
    adding and configuring modules runs beyond novice usage.

    Openlitespeed is not as straightforward as Apache or Lighttpd either, but they
    both can at least be added to with something simple commands for more intermediate
    users.

    Aside from adding modules to a server, there will come a time when we want to
    edit the server configuration files themselves or add files to folders for which
    we can make custom configurations, such as within an .htaccess file.

    Apache and Tomcat make such configurations very easy since we can add an .htaccess
    file to any folder and make custom rules, browser caching, and so on. Meanwhile,
    Openlitespeed has methods for which we can migrate our old .htaccess from Apache
    to its own system and use the same rewrite rules, which eases transition from
    an old Apache server.

    Lighttpd had its own way of creating custom files in its own lighttpd.conf. With
    Nginx and Lighttpd, most custom rules will take place in configuration files.


    # VERDICT


    | Apache | 10/10 | Tomcat | 9/10 |

    | Nginx | 8/10 | Openlitespeed | 9/10 |

    | Lighttpd | 8/10 | | |


    Apache is very flexible since we can make server rules with a single .htaccess
    file and enable and disable modules with one-line commands.'
