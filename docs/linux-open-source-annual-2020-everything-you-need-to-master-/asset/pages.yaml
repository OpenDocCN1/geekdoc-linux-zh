- pgno: 154
  md: '# # Ease of use


    ## Spotlight on productivity.


    Except in the case of a very poorly designed interface, where commonly used functions
    might be several levels down in the directory structure and there are no icons
    to act as shortcuts, regular users will eventually get up to speed with any software.
    Admittedly, you''ll learn some packages more quickly than others, but there''s
    more than an element of truth to the suggestion that it''s the software with fewer
    features that will fare better in this respect.


    For these reasons, our appraisal of ease-of-use has considered a lot more than
    a potentially subjective assessment of the user interface. In particular, and
    especially for the more fully-featured packages, we have given consideration to
    resources such as the user documentation and tutorials.


    We found that we could use Google Drawings almost immediately without referring
    to Help, but primarily that was because it''s by far the simplest in terms of
    its functionality. All the others, if necessary, have a more complicated user
    interface because of their richer set of features. Having said that, despite it
    probably being the most fully featured, we didn''t find Inkscape the hardest to
    use, but we recognise that this view might be somewhat subjective.


    Turning to educational and reference material, all the software have official
    documentation in the form of a user guide, while LibreOffice Draw also offers
    a Getting Started guide. Documentation differs significantly in how extensive
    it is, with the Google Drawings guide being much shorter than the others, although
    this is hardly surprising, given its fewer features. By way of contrast, the Inkscape
    website refers to several manuals and books, albeit not all free.


    ![](img/7a0a282248f9658f0c87e55744c797b6_154_0.png)


    > > Gravit''s modern user interface has drawn much praise.


    All the packages except for Google Drawings also provide online tutorials, mostly
    textual, although Gravit has no fewer than 13 official YouTube video tutorials.
    Vechr has a particularly impressive set of 29 text tutorials, some concentrating
    on features, others on common applications.


    So far, we''ve referred only to official user documentation or, in some cases,
    third-party documentation that is officially sanctioned by being linked from the
    publisher''s website. You''ll find a wealth of other third-party video guides
    and tutorials for all the software, even Google Drawing, but we haven''t reviewed
    these because, by their nature, they''re likely to come and go.


    # ## VERDICT


    | GOOGLE DRAWINGS | 7/10 |

    | LIBREOFFICE DRAW | 6/10 |

    | GRAVIT DESIGNER | 8/10 |

    | VECVR | 8/10 |

    | INKSCAPE | 8/10 |


    > > On balance, ease-of-use is good across the board.


    # # Licensing


    ## Examining the small print.


    All our chosen software is free. This choice was made partially because the highly
    respected Adobe Illustrator and CorelDRAW aren''t available under Linux, but also
    to illustrate the fact that you can get performance comparable to these leading
    commercial packages without spending several hundred pounds. In other respects,
    though, there are differences between our five packages.


    First of all, we''re not all open source which, while probably not deterring users
    who just need to create good quality graphics, will be an issue for more technically
    minded users with more ambitious aims. Inkscape and LibreOffice Draw are open
    source, the others aren''t. In addition, in order to use any of the three which
    are not open source you''ll need to create an account with the publisher. In the
    case of Google Drawings, that''s just a general Google account which you might
    already have.


    The situation with Gravit might be a concern to some potential users. The product
    has now been sold to Corel and, while the basic version of Gravit Designer remains
    free to use, it has now been joined by Gravit Designer Pro (for which you get
    a 14-day free trial when you sign up) that costs $75/$99 per year. Gravit say
    it has no plans to discontinue the free version, but questions remain. For example,
    might some of the features of the free version become available only in the Pro
    version – or will new features only be offered if you''re prepared to pay for
    them? It undermines confidence in the long-term functionality.


    ![](img/7a0a282248f9658f0c87e55744c797b6_154_1.png)


    > > By no means universal among drawing software, LibreOffice Draw has an open
    source license.


    # ## VERDICT


    | GOOGLE DRAWINGS | 7/10 |

    | LIBREOFFICE DRAW | 10/10 |

    | GRAVIT DESIGNER | 5/10 |

    | VECVR | 7/10 |

    | INKSCAPE | 10/10 |


    > > Only two packages are open source and, while all are free, Gravit has commercial
    aspirations.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Drawing tools


    Investigating the core functionality.


    Here can be no more important features of a vector-based drawing package than
    the drawing tools/features. In this paragraph we define the basic minimum, as
    provided by all our software. Tools are provided for drawing lines, lines with
    arrow heads, text, and shapes such as squares and circles, and to define the thickness
    and colour of the lines or outlines, and the colour of any fill. In addition to
    straight lines and polylines – that’s a line comprising several straight line
    segments – freehand and curved lines are available.  Editing enables objects to
    be moved, stretched or shrunk, and rotated. A snap feature assists in aligning
    objects, and the order of objects, front to back, can be defined. Several objects
    can be grouped so they can more easily be manipulated. Groups can subsequently
    be ungrouped, if necessary, for manipulating their individual constituent objects.


    # Google Drawings


    5/10


    Google Drawings offers the basic drawing tools and little more, but just saying
    that doesn’t do it justice. For example, while some drawing packages offer just
    a handful of shapes – commonly rectangles, rectangles with rounded corners and
    circles – Google Drawings offers a vast number, under the headings of shapes,
    arrows, callouts and equation. This emphasises the most commonly suggested application
    for the software, namely the creation of flowcharts, block diagrams, organisational
    charts and so on.


    Text support is also good which makes this solution suitable for simple design
    applications such as the creation of flyers containing a mixture of text and graphics.
    Basic word art is offered in addition to text boxes, the latter offering the sort
    of formatting options found in word processors. More usefully as number of template
    diagrams are offered.


    ![](img/7a0a282248f9658f0c87e55744c797b6_155_0.png)


    # Gravit Designer


    8/10


    Promotional literature for Gravit commonly shows artistic design applications,
    which hints at the fact that it has more advanced drawing facilities than most
    vector editing packages.


    However, we’re of the view that the more sophisticated features won’t normally
    be needed for technical applications, so they’ll generally be of interest only
    to more imaginative illustrators.


    Gravit offers nearly everything provided by the other packages reviewed here,
    with the exception of connectors and dimensioning, but adds a range of extra facilities.
    Of particular note are master pages and styles, which can offer major benefits
    in improving your productivity.


    Most of the other advanced features will be of relevance to a minority of readers,
    but the key add-ons include a knife tool, non-destructive Booleans, path graphs
    and advanced colour support.


    ![](img/7a0a282248f9658f0c87e55744c797b6_155_1.png)


    # Import and export


    Which file formats are supported?


    Realistically, the only reason to create a diagram or illustration is so that
    you can display it online or insert it into a document, so it’s essential that
    you can save or export it in a suitable format. Similarly, if you want to work
    on a drawing someone else has created or, perhaps, include a third-party image
    in your drawing, the range of supported import formats becomes important.


    Nearly all the reviewed software uses a proprietary format for saving drawings,
    which isn’t too helpful – except in the case of LibreOffice Draw, because its
    native format is recognised by other LibreOffice applications. The one package
    that can save in a variety of formats is Inkscape, which supports SVG, compressed
    SVG, PostScript/EPS, Adobe Illustrator and several other vector formats. Separate
    from the save formats, most of the software can export in several file types,
    including bitmapped as well as vector formats. Bear in mind, though, that if you
    export in a bitmapped format without also saving it in a vector format separately,
    you won’t be able to edit it properly afterwards.


    Inkscape supports the widest range of import formats, including just about anything
    you’d ever want. However, all offer import of at least a few bitmapped formats,
    and most also allow you to import the vector SVG format. Google Drawings is particular
    poor in this respect, though, this may be due to the fact that it’s an online-only
    tool, working through Google Docs. We didn’t find a list of supported import formats,
    and our tests didn’t reveal any vector formats that worked. We did find reference
    to a few workflows suggested online, but didn’t manage to get any to work either.


    # VERDICT


    | | GOOGLE DRAWINGS | 2/10 | | LIBREOFFICE DRAW | 5/10 |

    |---|---|---|---|---|---|

    | | GRAVIT DESIGNER | 7/10 | | VECTR | 5/10 |

    | | INKSCAPE | 10/10 | | | |


    Somewhat surprisingly, there is a vast difference in the number of file formats
    supported for import and export.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# **Inkscape** 10/10


    *Inkscape* is commonly compared favourably to *Adobe Illustrator*, a fully featured
    commercial offering with a hefty annual licence fee. It has an impressive range
    of features which means that, like *Gravit Designer*, it will appeal to graphic
    designers as well as those with more down-to-earth applications.


    We''re not aware of any major drawing tools provided by any of the other software
    here that aren''t also in *Inkscape*. The dimensioning feature for engineering
    drawings is provided by an extension, but this isn''t a major drawback; indeed
    the support for extensions is one of *Inkscape*''s significant features.


    The list of advanced features is long: some of the most significant include support
    for generalized polygons and stars, spirals, Boolesian operations, and calligraphy
    tools for freehand drawing using filled paths.


    ![](img/7a0a282248f9658f0c87e55744c797b6_156_0.png)


    # **LibreOffice Draw** 7/10


    Compared to our basic set of drawing tools, *LibreOffice Draw*''s main extensions
    are in the areas of layers and pages, 3D objects, connectors, and dimensioning.
    Its support for 3D objects is provided primarily by allowing 2D objects to be
    extruded, although a library of ready-made 3D objects is also available. Once
    you have a 3D object on-screen, you can apply drawing effects like lighting and
    shading.


    The concept of connectors very much simplifies the editing of diagrams such as
    flow charts or organisational charts, where boxes are connected by lines. When
    you connect objects using a special type of line called a connector, those connecting
    lines stay connected to their associated objects. If you move an object, its connectors
    remain connected and re-route accordingly. Finally, automatic dimensioning labels
    are valuable for engineering applications.


    ![](img/7a0a282248f9658f0c87e55744c797b6_156_1.png)


    # **Vectr** 6/10


    *Vectr* offers more than basic drawing tools, but not by a huge margin. First,
    there''s support for layers and pages. Layers enable you to assign objects to
    different layers, which can then be dragged above or below other layers, locked
    or hidden.


    The concept of pages is fundamental to word processors, but it''s not universal
    in the realm of graphics editors. However, while it means that you can keep all
    the elements in a multi-page element together – unlike some of the other packages
    reviewed here – it doesn''t provide the full benefit you might expect, because
    you can only export one page at a time.


    Another interesting feature is filters. For example, you could define both a solid
    colour and a graduated fill as an object''s background with different opacities,
    although this won''t be on most people''s must-have list.


    ![](img/7a0a282248f9658f0c87e55744c797b6_156_2.png)


    # # Bitmap support

    Going beyond just vector graphics capabilities.


    Although we''re looking at vector-based graphics packages instead of the bitmap
    software used for editing photos, there are times when some limited support of
    bitmaps is useful, say for including photos of staff in an organisational chart.
    All the software reviewed here enables you to import bitmap images for this purpose,
    and the basic editing functions available enable you to move, resize and rotate
    them. Some software also enables you to crop images but, even if there''s no specific
    crop bitmap function, with most reasonably featured vector graphics software you''ll
    be able to find some way of achieving this.


    While we wouldn''t recommend using any vector-based software for dedicated image
    editing use – something like *GIMP* is far more appropriate – some of the packages
    included here do offer a bit more than the basics in terms of support for bitmaps
    and sometimes a lot more. This might streamline your workflow by not requiring
    you to edit images in other software before importing them to your vector-based
    editor. *Gravit* is particularly strong here, enabling you to adjust brightness
    and contrast, and even fine-tune colours and remove noise. While *Inkscape* doesn''t
    offer all this natively, the raster extension adds all *Gravit*''s bitmap editing
    capabilities and a lot more. *LibreOffice Draw* also has advanced features in
    this area – mostly artistic effects. Another useful feature associated with bitmaps
    is to convert them to vectors. This is variously called tracing, vectorising,
    or converting to polygons. Once converted to vectors or polygons, all the usual
    vector editing facilities become available. This functionality is available in
    *Inkscape*, *LibreOffice Draw* and *Gravit*.


    # **VERDICT**


    GOOGLE DRAWINGS 4/10

    LIBREOFFICE DRAW 6/10

    GRAVIT DESIGNER 8/10

    VCTR 4/10

    INKSCAPE 10/10


    All packages offer some sort of support for bitmaps, but some go well beyond the
    basics, with more advanced features.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Online/offline


    Do you need an internet connection to run it?


    oogle Drawings is available only as an online application, in the sense that it
    runs in your browser. Conversely, Inkscape and LibreOffice Draw are only available
    to run locally on your PC. There is an application called LibreOffice Online,
    but this is provided only as software and not as an online hosted service. Gravit
    and Vectr, on the other hand, can be run either online or offline. Strictly speaking
    Gravit Designer, as reviewed here, is for offline use only, but the same publishers
    also provide Gravit Cloud, which provides the same features, but which runs in
    the cloud.


    Both approaches have their supporters, not rather than automatically being drawn
    to the one solution, it would be appropriate to consider the pros and cons of
    having just an online or just an offline solution. Clearly if you only have online
    drawing software, you can''t use it if you''re without an internet connection
    – perhaps when you''re on a plane, or don''t want to have to pay for Wi-Fi.


    You might think that the offline option is therefore preferable, but this is only
    true if you have a PC on which it''s installed to hand. With online software,
    so long as there''s an internet connection you could work from any PC, running
    under any operating system for that matter. The dual approach, therefore, seems
    to offer a win-win solution. This might seem to favour Gravit and Vectr, but things
    aren''t quite that simple with the latter because, even if you have it installed
    locally on your PC, you will only be able to use it if you log in via an online
    connection – one of those ''features'' than benefit the publisher rather than
    the user.


    **VERDICT**


    | | |

    |---|---|

    | GOOGLE DRAWINGS | 6/10 |

    | LIBREOFFICE DRAW | 6/10 |

    | GRAVIT DESIGNER | 10/10 |

    | VECTR | 6/10 |

    | INKSCAPE | 6/10 |


    Gravit is unique in offering both online editing and a complete offline offering,
    while the others vary in capabilities.


    ![](img/7a0a282248f9658f0c87e55744c797b6_157_0.png)


    > Vectr might offer online and offline version but you need to be online to use
    the offline version.


    # Collaboration


    Helping you work as a team.


    hen you''re working as part of a team, perhaps in business or as part of a club,
    being able to collaborate with others will sometimes be necessary. There are several
    aspects to this, some of which we''ve given consideration to already. Even if
    your collaboration involves nothing more sophisticated than emailing files back
    and forth, or sharing them via an online file sharing service, an extensive set
    of supported vector-based file formats for import and export is useful. This might
    permit you to collaborate with people who are using different software.


    All the packages have at least one vector-based format for import and export,
    with the exception of Google Drawings. However, this doesn''t mean that Google
    is inappropriate for collaboration, as we''re about to see.


    Another way of ensuring collaboration is to insist that all members of the team
    use the same software. If your co-workers use a variety of operating systems,
    however, this could be difficult. Inkscape and LibreOffice Draw run under Windows
    and macOS as well as Linux, Vectr runs under Windows and ChromeOS, and Gravit
    runs under all three. This question doesn''t apply to the Google offering since
    it''s accessed online.


    Going beyond this, some software has specific facilities to enable collaboration.
    As an online utility, Google Drawings, for example, permits several users to work
    simultaneously on the same drawing. Vectr says it is working on a similar facility
    but, in the meantime, and bearing in mind that Vectr always saves your work online
    even if you''re using the offline version, you can share your work with other
    users. Despite the existence of Gravit Designer''s online stablemate Gravit Cloud,
    Google is one step further behind in offering collaboration, saying only that
    it''s under consideration. The online Gravit Cloud does streamline the process
    slightly since a team could share the same account. Needless to say, in such a
    scenario, you''d have to ensure that multiple people don''t try to edit a project
    at the same time.


    **VERDICT**


    | | |

    |---|---|

    | GOOGLE DRAWINGS | 10/10 |

    | LIBREOFFICE DRAW | 5/10 |

    | GRAVIT DESIGNER | 7/10 |

    | VECTR | 7/10 |

    | INKSCAPE | 6/10 |


    As you''d expect from an online-only app, Google Drawings is unparalleled in its
    support for collaborative simultaneous editing.


    ![](img/7a0a282248f9658f0c87e55744c797b6_157_1.png)


    > If you want to work as part of a team, Google Drawings is ideal.


    158'
