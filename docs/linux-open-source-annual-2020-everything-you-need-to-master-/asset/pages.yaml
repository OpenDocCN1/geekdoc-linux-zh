  md: '# Package management


    What apps are available in their repositories?


    ![](img/7a0a282248f9658f0c87e55744c797b6_31_0.png)


    ome of the Oses in this *Roundup* ship with a lot of apps, but others are rather
    bare-bones and aren''t really useful straight after installation. You''ll have
    to flesh these out to use the OS productively on the desktop. Unfortunately, not
    all of the Oses let you install additional apps, and some take far more effort
    than others.


    KolibriOS and Vismopsy belong to the former category: there is no means of installing
    additional packages to them. While Openindiana does have a package management
    system, and quite an adept one at that, flashing out the OS is one of the weakest
    points of the OS. The OS uses the Image Packaging System but features a CLI package
    manager, pkg, rather than a graphical one. While pkg is very similar to apt and
    dnf, you''ll have to read through the man page and other documentation for tasks
    such as adding repositories.


    On the contrary, package management is the only saving grace of ReactOS''s vanilla
    installation. The OS uses a *Synaptic*-like app store that appears when you use
    the Add/Remove Programs function in the Control Panel. The ReactOS Application


    Besides apps like LibreOffice and Firefox, you can also use the ReactOS Application
    Manager to download libraries like Adobe AII and Microsoft .NET framework.


    Manager is intuitive to operate and enables you to install multiple programs in
    bulk. You can also continue to use the app while it''s downloading and installing
    software. Similarly, one of the highlights of the latest release of Haiku is its
    graphical package manager, *HaikuDepot*. It''s intuitive to operate and works
    pretty much like the package management systems on Linux.


    # VERDICT


    | | HAIPU | 8/10 | REACTOS | 8/10 |

    |---|---|---|---|---|

    | KOLIBRIOS | 0/10 | VISOPSYS | 0/10 |

    | OPENDIANIA | 5/10 | |


    *Being stuck with the default apps isn''t as much of an issue in KolibriOS as
    it is in Visopsys.*


    # Daily use


    Can you use them as your everyday desktop?


    ![](img/7a0a282248f9658f0c87e55744c797b6_31_1.png)


    You can definitely use Openindiana as a regular desktop, especially when you consider
    the fact that it ships with a familiar environment and mainstream open source
    apps. However, the OS doesn''t include all the apps you''ll need and you''ll have
    to fetch additional ones using its CLI package manager, which interrupts an otherwise
    smooth user experience.


    Although Visopsys is a fully functional OS, you can''t really use it as an everyday
    desktop in the traditional sense. The OS is developed by an individual and is
    more of an educational tool rather than an actual OS which you can put to use
    for everyday tasks. It also lacks crucial productivity apps such as an internet
    browser and a package management system.


    ReactOS is discouraged because, by its own admission, the project isn''t yet ready
    for use as your daily desktop. It won''t disappoint you in terms of app availability,
    but the system isn''t stable enough yet to be used reliably for productive work.
    The Live CD only worked on one of our test machines, and installing the *VirtualBox*
    Additions brought up the infamous Windows-like Blue Screen of Death.


    In contrast to the previous two, KolibriOS ships with a large number of apps out
    of the box. Unfortunately, many of the crucial ones are rather rudimentary. For
    instance, the web browser is text-based, and while it had no issues rendering
    simple sites like the KolibriOS website, it crashed whenever we tried to use it
    to visit data-intensive websites such as YouTube. The one task we


    > The Time Slider utility in Openindiana takes advantage of the ZFS filesystem
    to take snapshots of the installation at timed intervals.


    absolutely recommend the OS for is retro gaming, for which it remains unparalleled.


    All things considered, the OS you''ll be most comfortable using for daily desktop
    duties is Haiku. It has impressive hardware support and doesn''t throw any unexpected
    errors during installation. The collection of apps on the desktop, such as the
    WebKit-powered web browser and the availability of useful apps in the package
    management utility, surely helps it meet the desktop computing requirements of
    a large number of people.


    # VERDICT


    | | HAIPU | 8/10 | REACTOS | 5/10 |

    |---|---|---|---|---|

    | KOLIBRIOS | 5/10 | VISOPSYS | 4/10 |

    | OPENDIANIA | 8/10 | |


    *Openindiana and Haiku are your best bets if you''re looking to be productive.*'
