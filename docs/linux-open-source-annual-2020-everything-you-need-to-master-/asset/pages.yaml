    \nIn this world of Slack and Discord and Telegram and whatever other communication\
    \ platform is currently hip, it’s easy to forget about humble email. Email is\
    \ pretty special in that it’s federated – you don’t need to be the same email\
    \ provider as the person you’re talking to – and decentralised: it can be your\
