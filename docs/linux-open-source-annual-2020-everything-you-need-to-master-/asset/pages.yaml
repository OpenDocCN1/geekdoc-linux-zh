  md: "it’s necessary to let the benchmark run at all. For example, Sombrero currently\
    \ can’t run on GPUs: if a manufacturer wanted to show off the power of their GPU-based\
    \ supercomputers, they would need to adapt it so that it could run there. This\
    \ is allowed, provided that the problem being solved doesn’t change; that would\
    \ be a different benchmark entirely.\n\n# Plotting the results\n\nWhat good is\
    \ a set of benchmark data without a set of colourful graphs to show off? While\
    \ you could copy and paste numbers into **LibreOffice Calc** by hand, it makes\
    \ a lot more sense to use a tool specifically designed for text-based data, so\
    \ let’s get started with **gnuplot**.\n\nFor this, the first thing you’ll need\
    \ to do is transform the results logs into a more tabular format. You can do this\
    \ using **awk**. To start with the previous example:\n\n```\n$ ./sombrero.sh -h\
    \ hostfile.ctxt -s small \\\\ $ BEGIN {print(\"pyx\" and \"pgmy\")} /^\\[RESULT\\\
    ]\" {Case\"Gflops.seconds\" printf(\"%t\" $4);} END {printf(\"\\n\"1)} >> results.dat\n\
    ```\n\nThis will append one line to the end of **results.dat** with seven columns\
    \ separated by tabs. The first will contain the label **pyx** and **pgmy**, with\
    \ the remaining six containing the results of the six benchmarks. You can repeat\
    \ the process for various configurations by editing **hostfile.txt** – perhaps\
    \ **pyx** by itself and **pgmy** by itself for comparison. Change the value of\
    \ the *label* variable so that each line gets a unique label.\n\nNow that your\
    \ results file contains a table of results, you’re ready to generate a plot. Start\
    \ **gnuplot** with:\n\n```\n$ gnuplot\n```\n\nThis puts you into the *gnuplot*\
    \ interpreter, with a prompt that looks like **gnuplot>**. Tell **gnuplot** that\
    \ you’re going to plot a grouped bar chart, with filled bars and a black border:\n\
    \n```\ngnuplot> set style data histogram\ngnuplot> set style histogram cluster\
    \ gap 1\ngnuplot> set style fill solid border rgb \"black\"\n```\n\nNext, ask\
    \ it to automatically scale the horizontal axis, but make sure that the vertical\
    \ one starts at zero. Bar charts starting away from zero are generally used as\
    \ the tool of those who want to mislead you about the data they’re presenting:\n\
    \n```\ngnuplot> set auto x\ngnuplot> set xrange [0:]\n```\n\nThen make sure that\
    \ **gnuplot** knows that the data files uses tabs as its separator, since by default\
    \ it will use any white space to separate values:\n\n```\ngnuplot> set datafile\
    \ separator \"\\t\"\n```\n\nGraphs aren’t particularly useful without axis labels\
    \ to tell you what the information means. Add one with:\n\n```\ngnuplot> set ylabel\
    \ \"GFLOPs/s\"\n```\n\nFinally, you’re ready to plot the data. This command makes\
    \ use of a loop, so that you don’t have to type the same commands over again for\
    \ each column:\n\n```\ngnuplot> plot for [i=1:6] \"results.dat\" \\ using (column(i+1)-xtic())\
    \ \\\n  title \"SOMBERO \" i\n```\n\nAnd with that, you’re done! A plot appears\
    \ in a new window, showing a labelled comparison of your different runs as a grouped\
    \ bar chart. If you want to,\n\n# » TOP TRUMPS FOR SUPERCOMPUTERS\n\nOnce upon\
    \ a time, the **Linpack** benchmark – used to calculate the Top500 ([www.top500.org](http://www.top500.org))\
    \ – was the only benchmark in town for ranking supercomputers. However, since\
    \ that benchmark is designed to do as many floating point operations (FLOPs) and\
    \ little else as possible, it doesn’t always paint a good picture of how well\
    \ a machine will perform when it tries to do something more useful. Hardware manufacturers\
    \ want to sell more hardware, and they sell hardware by having the biggest numbers,\
    \ so they design machines to do better at **Linpack** than anyone else. Because\
    \ all hardware design involves compromise, this can have the perverse effect of\
    \ harming the machine’s performance in properly interesting problems, just to\
    \ get a better TOP500 score.\n\nBecause of this, a whole zoo of benchmarks and\
    \ rankings has started to spring up. For example, Green500 measures supercomputers’\
    \ energy efficiency when running **Linpack**: crucial, when as a rule of thumb\
    \ the electricity costs for running a supercomputer for its lifetime are about\
    \ the same as the cost of buying the machine. Graph 500 ([http://graph500.org](http://graph500.org))\
    \ focuses on data-intensive applications rather than the computationally intensive\
    \ **Linpack**. Sombrero focuses on a mix of raw computation, speed of reading\
    \ from RAM, and time it takes to send data across the high-speed network between\
    \ nodes – with the balance between these shifting between different benchmarks.\
    \ For each benchmark, a different supercomputer will reign champion.\n\nyou can\
    \ export it as a PDF or image file, to email to your friends to show off, or print\
    \ out and hang on your fridge.\n\nIn this article, we’ve explored how you can\
    \ benchmark your system and even your entire network by using the **Sombrero**\
    \ benchmark. So next time someone claims to have a faster setup than you, or you’re\
    \ trying to justify buying a new one because your machine has slowed down in its\
    \ old age, you can back up your arguments with cold, hard data. [18]\n\n![](img/7a0a282248f9658f0c87e55744c797b6_92_0.png)"
