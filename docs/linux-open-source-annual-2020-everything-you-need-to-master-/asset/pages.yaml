  md: '![](img/7a0a282248f9658f0c87e55744c797b6_26_0.png)


    > Ubuntu’s Weston package includes some demos in the /usr/lib/weston directory.


    hipsters – folks who prefer their GUIs minimal, discerning bearded types who prefer
    keyboard shortcuts to friendly menus, people who are more Openbox and i3 than
    Gnome and KDE. Oh, and people not using the Nvidia driver. Anyway, that approach
    is exemplified by the Sway compositor for Wayland ([https://swaywm.org](https://swaywm.org)).
    Sway is a drop-in replacement for i3, which is a minimal tiling window manager.
    You can install it in Fedora in the usual way (which will give you quite an old
    version), or you could first add the **copr** repo and get a newer version:


    $ sudo dnf copr enable tofik/sway

    $ sudo dnf install sway


    You’ll be asked to accept a GPG key, which is up to you. If you do, some dependencies
    and the *xvt-unicode* terminal program will be installed, because everyone needs
    a good terminal.


    Sway is the brainchild of Drew DeVault, aka sircomm. The 1.0 releases are quite
    exciting insofar as they introduce a new library, wroot, which can be reused by
    any budding writer of Wayland desktops. It saves those individuals the burden
    of reproducing functions for standard tasks, as well as the not insignificant
    task of implementing an XWayland layer. This is good as, besides saving effort,
    it might standardise bread-and-butter Wayland interfaces, avoiding the fragmentation
    that people so often like to complain plaguing the Linux ecosystem. Quoth the
    GitHub, “about 50,000 lines of code you were going to write anyway”.


    Anyway, start Sway by logging out of your current desktop and selecting it when
    you enter your password. You might be shocked at the minimalism, or if you’re
    used to i3 you’ll feel right at home. There are no menus, no Activities view and
    no matter where or how furiously you click, nothing will happen. However, if you
    press Super+Return a 256-colour, Unicode-supporting terminal will dutily occupy
    the whole screen. Press it again and another terminal will open, with the previous
    one courteously making room for it.


    This is how tiling window managers work. You can switch focus simply by hovering
    over a window, and you can switch between ten () virtual desktops with Super and
    the number keys. Windows can be closed with Super+Shift+Q. Sway is configured
    per-user from *~/.config/sway/config*. This directory doesn’t exist until you
    create it, so do that; then copy over the global config file at */etc/sway/config*
    and customise it. We’re running out of space, so we’ll direct you to the wiki
    at [https://github.com/swaywm/sway/wiki](https://github.com/swaywm/sway/wiki)
    to learn more about configuring and using Sway. Oh, and if you want to exit cleanly,
    use Super+Shift+E.


    We mentioned earlier that the version of *Firefox* bundled with Fedora 30 requires
    the XWayland layer. This wasn’t the original plan. Fedora has been working on
    a native-Wayland version of *Firefox* for some time, but it was deemed not quite
    ready for this release. It’s easy to try though, as easy as:


    $ sudo dnf install firefox-wayland


    The package just provides a new launcher so is a mere 19K big. See if it works
    for you with *firefox-wayland*. If you’re using Arch you can find a binary package
    of this in the AUR, catchily titled *fedora-firefox-wayland-bin*.


    ![](img/7a0a282248f9658f0c87e55744c797b6_26_1.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_26_2.png)


    > Wayland works on KDE Plasma now, and it’s only going to get better.'
