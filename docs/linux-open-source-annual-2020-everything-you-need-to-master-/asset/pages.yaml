- pgno: 86
  md: '![](img/7a0a282248f9658f0c87e55744c797b6_86_0.png)


    The Spectre and Meltdown vulnerabilities were a nightmare for sysadmins, but at
    least gave rise to these funky, CC0-licensed logos.


    overflow is hard to exploit directly, but it has been used historically to attack
    the SSHv1 protocol (thankfully now deprecated); see www.kb.cert.org/vuls/id/945216.


    # Getting over buffer overflows


    Programers have been trying for 30 years to avoid the kind of overwrites that
    lead to these vulnerabilities and their exploitation. But, to quote our 2015 interview
    with Mozilla programmer Jim Blandy: “The experiment has been run. Humans cannot
    be trusted to write that code”. Instead of giving up writing code, boffins have
    come up with new ‘memory safe’ languages such as Mozilla’s Rust, Google’s Go and
    Apple’s Swift, which, while not entirely invincible to exploitation, at least
    put the kibosh on a lot of common memory vulnerabilities.


    But rewriting major projects in these languages isn’t something that’s going to
    happen overnight, and nor is it an option for large projects (like the Linux kernel)
    which depend on the features and speed of the C language. It’s not all doom and
    gloom though – these languages are being used productively in a number of places.
    Mozilla has been developing its Rust-based web engine Servo since 2012, and Go
    continues to be the language of choice for hipster system programmers. Swift is
    popular too, but rather than cite a real example we’ll direct you to the @swiftinsecurity
    Twitter account where you’ll find an irreverent account of information security
    (infosc) today.


    One of the major breakthroughs in defying exploitation became mainstream around
    2005 in the form of Address Space Layout Randomisation (the original PaX kernel
    patch appeared in 2000). This shuffles around the in-memory data required by a
    program when it is loaded. Before ASLR, an attacker could figure out where a program’s
    resources, such as its stack and libraries, were located in memory. So if the
    program was subject to some kind of vulnerability, this could be exploited by
    writing data that would be guaranteed to overwrite, say, the stack.


    Amid a tide of Word macro viruses and email worms this – together with Data Execution
    Prevention, which prevents designated addresses from being both writable and executable
    – was great news for Windows. It eliminated a whole class of vulnerabilities.
    No longer could one just find any old vulnerability and use it to stick any old
    shellecode onto the execution stack. Unfortunately miscreants moved with the times,
    and new, more malevolent techniques (such as Return Oriented Programming and Heap
    Spraying) evolved,


    and there’s no shortage of exploits to this day. Fortunately tools like Valgrind
    make detecting some of them, at least, slightly easier.


    ASLR was extended to the Linux Kernel itself in 2014, making a new acronym (KASLR)
    and defending against nasty kernel exploits. However KASLR, it turned out, could
    be defeated using timing exploits on modern CPUs, so further defences were necessary.
    These came in the form of Kernel Page Table Isolation (KPTI), which was introduced
    to address the Meltdown vulnerability – though this was kept hush-hush until said
    vulnerability was made public in January 2018. Meltdown meant that by exploiting
    a race condition, privileged information could be extracted by processes not entitled
    to it.


    Ultimately it enables a rogue process to read memory from the kernel or other
    processes, like a password manager. Since it can be exploited through JavaScript,
    this also means one tab could access information in another, which is pretty terrifying.
