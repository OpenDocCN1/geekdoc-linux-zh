  md: '# # Surveillance and society

    Just because there''s no one following you doesn''t mean you aren''t being tracked.


    ![](img/7a0a282248f9658f0c87e55744c797b6_52_0.png)


    And at the same time, just because you live in an ostensibly free country doesn''t
    mean you should be blasé about privacy. Surveillance in all its forms is becoming
    widespread: CCTV, bodycams and contactless transactions are all handy ways for
    governments to track our activities in meatspace. But the trail of digital dust
    that our online activities leave behind is increasingly resembling the detritus
    left behind by the canal-cutting navvies of the 18th century.

    The problem is that this trail, particularly on social media, isn''t optional.
    Back in the 18th century you could always find a private space in the woods, have
    a tête-à-tête and be reasonably sure no one recorded it. That''s still true today
    – you just have to go further to find a secure space in the woods.

    But in the digital world, every post you make and every interaction you have become
    a part of the network. The record is there: some of it public, some of it visible
    to your friends, but all of it ultimately indelible, and law enforcement have
    the right to ask social networks for data on an individual given a court order.

    We don''t take issue with that; traditional, targeted surveillance has undone
    many criminals and criminal organisations and will continue to do so in future.

    Unchecked, indiscriminate, mass surveillance is a completely different animal,
    and we''re dubious if it''s actually that useful. Criminal investigations aside,
    the fact that this data is sold to advertisers – albeit in ''anonymised'' form
    – is extremely worrisome.

    If you''re concerned about privacy then one of the best things you can do is stop
    using these services: one company knowing so much about you should rightfully
    give you the heebee-jeebies. It''s hard to cut the cord – you''ll miss the fresh
    memes, you''ll miss the odd party, but on the plus side you''ll probably have
    a lot more free time to play with Linux. Anyway, if you''re not ready to let go
    of proprietary social networks you can still be a little more conscious about
    how you use them.

    One of the most insidious aspects of these sites is how they track you across
    other sites, which use Like and Retweet buttons to boost engagement. This trickery
    is possible because the cookie that is set when you log in is visible from any
    tab that browser opens – and if you click those buttons then Facebook knows something
    about your activities outside of Facebook.

    One drastic way around this is to segregate activities across different browsers.

    Unfortunately, if you use lots of different social networks in parallel this rapidly
    becomes untenable. You can achieve the same thing using Private Browsing/Incognito
    mode, but this comes with the downside of not leaving any history, so you might
    never be able to find that hilarious cat picture again. Enter Firefox Multi-Account
    Container extension, which


    ![](img/7a0a282248f9658f0c87e55744c797b6_52_1.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_52_2.png)


    keeps activity on one site entirely contained to a particular browser tab. There''s
    even a dedicated Facebook container extension, which will helpfully open any "Share
    on Facebook" links you click outside of the container inside it, so you can still
    link those cat pics.


    Firefox''s multi-account containers are a great way to isolate sides from the
    rest of your browsing.


    # ## >> VILLAINARY


    While we''re bigging up Mozilla, now''s a good time to mention that an utterly
    toothless organisation – the UK ISP Association – nominated Mozilla for its Internet
    Villain award, placing it alongside such gems as President Trump and the EU''s
    Article 13 Copyright Directive. Why? Because Mozilla plans on enabling DNS-over-HTTPS
    (DoH) by default in Firefox, which would make it hard (boo hoo! –Ed) for ISPs
    to snout on DNS queries.

    Setting this up at the OS level is probably beyond your average user (but we''ll
    show you how to do it later), so the villainary appears to lie in helping average
    users boost their privacy. DoH is no silver bullet, and there are legitimate concerns
    around any kind of centralised DNS, but this all seems pretty nonsensical to us.
    Oh, and Google also plans on enabling DoH in Chrome soon, but we don''t see them
    getting nominated for any Internet Skullduggery award.

    In the interests of fair and balanced reporting, it''s nice to see the UK ISP
    Ass. nominating Sir Tim Berners-Lee for an Internet Hero award, for his work protecting
    the free and open nature of the Internet. We should also note that the UK is not
    alone in pushing a surveillance state agenda: we''re still behind China''s facial
    recognition-powered social credit system, and Australia''s "Access And Assistance"
    Bill passed in December 2018 asks communication providers to either do the impossible
    or break end-to-end encryption.


    We wanted to use the UKISPA''s Internet Villain graphic, but copyright said no.
    ''Nuff said.


    ![](img/7a0a282248f9658f0c87e55744c797b6_52_3.png)'
