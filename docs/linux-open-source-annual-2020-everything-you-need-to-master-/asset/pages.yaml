  md: '# Notable additions


    Sometimes it’s the little things that make all the difference...


    Setting up printers in Arch is a bit of a faff, but Antergos and Manjaro include
    Redhat’s *system-config-printer* utility. All our distros bar ArchLabs include
    the *HP Device Manager*, which is great if you have such devices to manage.


    Netrunner includes Grub customizer, a nice touch, and like Manjaro also includes
    out-of-the-box support for hibernation. *KDE Discover* is a good way to, um, discover
    new applications and Plasma add-ons. It’s much more solid than it used to be and
    we found it much less annoying than *Gnome Software*.


    Netrunner’s Firefox install comes with uBlock Origin and several popular blocklists
    installed, making the web a marginally less obnoxious place.


    KaOS includes a Wayland session which is a nice/brave touch for a KDE distro.
    Gnome on Antergos will try and start a Wayland session. Being lazy typists, we
    were sad to see the *bash-completion* package missing from Manjaro and Netrunner,
    but heartily approved of KaOS’s Ash configuration and the tab completion feature.
    Manjaro and KaOS both feature simple frontends for the UFW firewall. We think
    it’s high time that intermediate and higher users start paying attention to which
    packages get in or out, so applaud both these distros. Antergos and ArchLabs both
    retain Arch’s customisability, primarily by


