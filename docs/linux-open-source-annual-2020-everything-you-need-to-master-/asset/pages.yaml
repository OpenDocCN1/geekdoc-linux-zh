  md: '# Installation


    How easy is it to cross the first hurdle (turning the lights on)?


    You really learn to appreciate the beauty of the package management tools on Linux
    distributions when you attempt to install third-party projects like the ones featured
    in this Roundup. Not only do these tools require a number of different third-party
    applications and libraries to provide many essential functions, you also need
    a large number other libraries and resources. Worse still, some of the additional
    software have vast dependencies of their own.


    This is why distribution agnostic packaging formats like AppImage and Snap are
    finding great favour with many different application developers. Another advantage
    with such packages is that they require no installation, making the software portable.
    You merely have to make the downloaded file executable by running the `chmod +x
    <filename>` command, and you''re done. Kdenlive, Openshot and Shotcut each provide
    portable 64-bit AppImage packages. The Kdenlive help manual also describes the
    different resources from where you can grab deb or RPM binaries, if you prefer
    applications to be integrated into the desktop.


    Apart from an official deb binary package, Flowblade doesn''t ship any binaries
    for other popular distributions. The download page on the website recommends using
    the software repositories of your distribution for installing the project, but
    also cautions you that the latest release might not always be on offer in the
    software repositories. Thankfully, you can find RPM packages for the latest release
    on third-party websites such as RPMfusion.


    ![](img/7a0a282248f9658f0c87e55744c797b6_148_0.png)


    Kdenlive and Shotcut offer to create entries in the menu when you first run the
    AppImage binaries.


    LIVEVES doesn''t produce binary packages for different distros itself, but recommends
    Ubuntu users to install it using a P. Fedora users can similarly find RPM packages
    for the latest release on RPMfusion. If you''re confident in your dependency-resolving
    skills, you can compile it yourself from source. But for most of the projects
    featured here, this is ill advised.


    When you launch LIVEVES after installing it, unlike with other tools, it starts
    a configuration wizard that checks if your system has all the dependencies installed.
    Next, you''ll be asked to choose an audio player, whether pulse audio (recommended),
    jack audio, sox or mplayer. Finally, you''re asked to choose between two different
    startup interfaces: clip edit or the multitrack mode.


    # VERDICT


    | FLOWBLADE | 5/10 | OPENSHOT | 10/10 |

    | Kdenlive | 10/10 | Shotcut | 10/10 |

    | LIVEVES | 7/10 | | |


    While Flowblade only works on Linux, all the others support Windows and Mac.


    # Documentation


    No one can RTFM if there isn''t one!


    Flowblade features quick instructions on how to use the application, but the lack
    of suitable screenshots make following the terse instructions difficult. Worse
    still, the instructions are outdated and don''t reflect the changes introduced
    with recent releases.


    Kdenlive fares far better, with a thorough user manual hosted at https://userbase.kde.org/Kdenlive/Manual.
    You''ll also find a forum board discussing different aspects of the project such
    as Installation, Video Effects & Transitions and Audio. Users can also share their
    own content in the Kdenlive Gallery forum.


    First published in 2009, the LIVEVES user manual isn''t all that relevant any
    more, and is of no assistance to novices. The Beginner''s Quick Introduction is
    a better prospect, coupled with the several video tutorials available on the Documentation
    page of the website. You can also ask for help in the live-users mailing list.


    Every section of the Openshot guide is replete with helpful screenshots of the
    tool. If you''re already familiar with video-editing software, or even if you
    only have a general awareness of the process, the Quick Tutorial runs you through
    the broad steps. You can then navigate the sidebar to delve deeper into the usage.
    The forum boards hosted on openshotusers.com aren''t active and there hasn''t
    been any new posts in almost a year. But the


    ![](img/7a0a282248f9658f0c87e55744c797b6_148_1.png)


    Complex operations such as using the multi-track editing mode on LIVEVES require
    patience, and spending time with the documentation.


    dedicated sub-forum on user-recommended tutorials are definitely worth some of
    your time.


    Shotcut features a Getting Started guide in several languages, including English.
    Also on offer are video tutorials covering key topics such as Multitrack Timeline
    Basics.


    # VERDICT


    | FLOWBLADE | 7/10 | OPENSHOT | 10/10 |

    | Kdenlive | 10/10 | Shotcut | 8/10 |

    | LIVEVES | 8/10 | | |


    Flowblade needs to rethink its approach to documentation.'
