  md: '![](img/7a0a282248f9658f0c87e55744c797b6_137_0.png)


    # OPEN SOCIAL NETWORKS


    Tired of Facebook knowing him better than he knows himself, **Jonni Bidwell**
    goes in search of a more open and less creepy open social network.


    **A** rguments about whether having such a rich, and carefully curated, online
    persona (which may not be a particularly good reflection of who we are in meatspace)
    is a healthy thing that we can save for another day. But as readers of this fine
    magazine, we can all agree that if we’re going to put our media and ramblings
    online, then things would be a whole lot better if the sites that handle them
    should be open source, and have clear policies about how that data is used. Better
    yet, we should be able to host our own instances of these services. This isn’t
    as far fetched as it seems. Decentralised and federated architectures enable different
    instances to connect with one another, so an account on each platform is all that’s
    necessary. Not like the old days of following so many blogs across MySpace, Bebo
    and Geocities, as well as that one guy who hosted his own static site and wrote
    screeds lamenting the monetisation of the web, and the perils of using ‘free’
    yet closed platforms. Maybe his message would be heard but for our being distracted
    by all the cat photos, “influencers” and the rise of meme culture on all those
    proprietary social networks...'
