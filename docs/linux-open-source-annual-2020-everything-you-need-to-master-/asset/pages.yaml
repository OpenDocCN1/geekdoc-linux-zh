- pgno: 17
  md: '# Roundup


    teragos » ArchLabs » KaOS » Manjaro » Netrunner Rolling


    ![](img/7a0a282248f9658f0c87e55744c797b6_17_0.png)


    **Jonni Bidwell**

    required judicious application of Jura whiskey to fend off the germs that tried
    to interfere with this *Roundup*.


    # Arch-based distros


    Ever more distros are being built upon Arch Linux. Once **Jonni Bidwell** would
    have called this sacrilege, but now he finds it a glorious development.


    # **HOW WE TESTED...**


    We installed each distro on a Dell XPS13, which enabled us to test HiDPI and touchscreen
    support. We checked that the distros happily installed alongside other operating
    systems without breaking them. Further testing was done in virtual machines (limited
    to 3GB of RAM), which gave us some idea of how the distros would run on older
    hardware.


    We looked at what came with an out-of-the-box install, and whether this struck
    the right balance between usefulness and bloat. Since we’ve focused on distros
    providing a desktop, we looked at how stylish and effective those desktops were.
    Bear in mind that it’s possible to install and configure alternative desktops
    to your liking.


    We compared repositories to Arch Linux’s, renowned for offering the very latest
    software and making minimal changes to upstream releases. In particular, we looked
    at the desktop packages used by each distribution. We also checked how each distro
    integrated with the Arch User Repository (AUR).


    ![](img/7a0a282248f9658f0c87e55744c797b6_17_1.png)


    F ew would disagree that Arch is a fine distribution: cutting-edge, customisable
    and possessed of an enthusiastic community and excellent documentation. But it’s
    not for everyone.


    Many people are put off by the lack of an installer: having to manually partition
    disks and *chroot* into a bootstrapped install to get things going doesn’t really
    score any user-friendliness points. Those that surmount that obstacle are met
    with a new challenge: namely, building the minimal install into something useable.
    If you’re installing it for desktop use, you’ll find getting that desktop to look
    and play nice is decidedly non-trivial.


    In short, it really makes you appreciate the efforts that other distros go, to
    have all this set up out of the box.


    But the goodness of Arch can be married with the convenience of other distros.
    Imagine never having to add a PPA to obtain new releases. Imagine being able to
    rebuild custom versions of stock packages. Imagine, and then imagine no more.
    We’re focusing on desktop varieties here, so we’ll be paying particular attention
    to modern desktop innovations, but people have used Arch Linux as the base for
    all kinds of things (security, Raspberry Pi, 32-bit hardware, the list goes on),
    such is its flexibility.'
