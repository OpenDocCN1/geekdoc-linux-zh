- pgno: 140
  md: 'First, on newer installs (those based on the 18.04.1 point release), it''s
    necessary to enable the Multiverse and Restricted repositories:


    ```

    $ sudo add-apt-repository multiverse

    $ sudo add-apt-repository restricted

    ```


    We also need to add the node.js and Yarn repos, which uses the slightly unsavory
    but undeniably convenient practice of piping curl output to bash:


    ```

    $ curl -sL https://deb.nodesource.com/setup_8.x | sudo bash -

    $ curl -Ss https://dl.yarnpkg.com/debian/pubkey.gpg | sudo apt-key add -

    $ echo "deb https://dl.yarnpkg.com/debian/ stable main" | sudo tee /etc/apt/sources.list.d/yarn.list

    $ sudo apt update

    ```


    Now we are ready to install the dependencies, of which there are many (you may
    want to copy and paste this command the Tootsuite GitHub pages linked previously
    – just follow the Standalone Installation link):


    ```

    $ sudo apt -y install imagemagick ffmpeg libpq-dev

    libxml2-dev libxslt1-dev libfile-gdbm-perl g++

    libprotobuf-dev libprotobuf-dev pkg-config

    nodejs gcc autoconf bison build-essential libssl-dev

    libyaml-libber2-dev elib211-dev

    dev libncurses5-dev libffi-dev libgdbm5 libdb5m5-dev

    nginx redis-server redis-tools postgresql postgresql-contrib certbot yarn libll1n1-dev
    libcuc-dev

    ```


    Now we''ll set up a Mastodon user and build a Ruby environment, as follows:


    ```

    $ sudo adduser mastodon

    $ sudo su - mastodon

    $ git clone https://github.com/rbenv/rbenv.git -/. rbenv

    $ cd -/. rbenv && src/configure && make -C src

    $ echo "export PATH="\$HOME/.rbenv/bin"\$PATH"" >> -/. bashrc

    $ echo "eval "\$(rbenv init -y)" >> -/. bashrc

    ```


    # SOCIAL NETWORK OPEN SOURCING


    We''ve focused on Mastodon here, but there are all kinds of other open source,
    decentralised alternatives to popular social media platforms. PeerTube is a video-sharing
    platform that uses WebTorrent technology to ease the burden on servers (again,
    anyone can host a server and servers can federate with each other). When a user
    views a video they also can share it with other users, creating a sort of positive
    feedback loop for popular videos.


    For static images, and those looking for a home for them that isn''t Instagram
    or Flickr, there''s Pixelfed (https://pixelfed.org). Like Mastodon you can host
    your own Pixelfed instance and federate with other instances, such as the one
    you''ll find at https://pixelfed.social. For a more Facebook, less Twitter, type
    of decentralised social network, diaspora\* (https://diasporafoundation.org) is
    where you should turn your attention. Instances are referred to as "pods" and
    pods may be based on geographical location, interest, the foresaid funky domain
    names, or popularity. For the indiesive, The Federation (https://the-federation.info)
    collects op-to statistics for not just diaspora\* pods, but instances for all
    the networks mentioned here and many more. Federation blurs traditional boundaries,
    so many of these networks can talk to each other, either through crossposting
    tools or natively via ActivityPub.


    We need to restart the shell to enact these environment changes, then install
    ruby-build and install the required Ruby version:


    ```

    $ exec bash

    $ git clone https://github.com/rbenv/ruby-build.git -/. rbenv/plugins/ruby-build

    $ rbenv install 2.5.1

    $ rbenv global 2.5.1

    ```


    Now we can clone the Mastodon repository, checkout the latest stable release (v2.5.0
    at the time of writing), and install the needed Ruby gems and node.js packages.
    Change the -j argument in the


    ![](img/7a0a282248f9658f0c87e55744c797b6_140_0.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_140_1.png)


    Mastodon''s layout resembles that of Tweetdeck or Hootsuite. You can find Jonai
    at @lunesofalzahan@ scicom.xyz, but to be honest he doesn''t say much.'
