  md: '# Going to ground


    Use Tor and Tails to hide your browsing, and then upset the UK ISP Association
    by enabling DNS-over-HTTPS, villainous stuff!


    ![](img/7a0a282248f9658f0c87e55744c797b6_55_0.png)


    > Every three months linuxformat.com has to get a new SSL certificate so that
    our viewers can continue to see this friendly green padlock.


    T hanks in large part to the efforts of Let''s Encrypt over the past few years,
    most websites are now served over HTTPS. This provides two things: authentication
    and privacy. Authentication in the sense that you can be sure that the website
    you’re looking at isn’t some kind of forgery, and privacy in the sense that communication
    between you and the webserver is encrypted.


    As such, HTTPS more or less thwarts the ability of a passive middleman to see
    which pages are being viewed, but out of technical necessity your DNS provider
    – usually your ISP – needs to see the domain name, and your ISP needs to see the
    IP address it resolves to. You can, and in a lot of cases should, use a VPN, but
    that just shifts the second requirement downstream. Also, there’s generally very
    little reason to trust a VPN any more than you do your ISP – unless your ISP is
    really bad, in which case you should find another one. You can use one of any
    number of public DNS servers like Google’s 8.8.8.8 or Cloudflare’s 1.1.1.1 which
    remove your ISP from the equation altogether – except that ISPs then have a nasty
    habit of intercepting (DoH!-Ed) DNS queries.


    Multiple websites are often hosted behind the same IP address, and for this to
    work with HTTPS a scheme called SNI (Server Name Indication) is used. This requires
    the client to send the desired domain name to a server unencrypted, which means
    it can be eavesdropped twice: once during the DNS look-up, and once again during
    the TLS handshake. If you don’t like this, there’s always the Tor network, but
    that’s slow in comparison to regular browsing, and just downloading the Tor Browser
    is likely to score you a space on a very big list at one or more of the three-letter
    agencies.


    Nonetheless, we love being on lists, so we’ll show you how Tor works just over
    the page.


    Work to solve hostname leakage is underway in the form of ESNi, which you can
    read more about at Cloudflare’s blog (https://blog.cloudflare.com/ encrypted-nsi),
    who are leading this charge. ESNi requires changes to be standardised by browsers
    before it works, and is a moot gesture so long as DNS queries are still unencrypted.
    But there is a solution to that DNS problem – two, in fact: DNS-over-HTTPS (DoH)
    and DNS-over-TLS (DoT). For the purposes of atrocious journalistic oversimplification,
    let’s say that these two are similar, but that DoH looks like regular web traffic
    so is much harder for ISPs to filter.


    DoH can be implemented in a number of ways. We talked about using DNSCrypt-proxy
    in our Harden Mint feature in LXF247. If you missed it, that sets up a local DNS
    server that takes regular DNS queries and proxies them to an external resolver,
    one that supports DoH – or the eponymous DNSCrypt protocol, which we won’t cover
    here. However, since we wrote that DNSCrypt 2.0 has become the standard, and unfortunately
    it hasn’t made it into the Ubuntu 18.04 LTS repos (it’s in 19.04 though). So if
    you’re using the LTS you’ll need to use Andrei Shevchuk’s PPA to get the newer
    version, which is a matter of:


    ```

    $ sudo add-apt-repository ppa:shevchuk/dnscrypt-proxy

    $ sudo apt update

    $ Then it can be installed with:

    $ sudo apt install dnscrypt-proxy

    ```


    We can then point our DNS queries to our local resolver via NetworkManager. To
    do this, go to the Settings screen and find your wired or wireless network. If
    the Method drop-down is set to Automatic, change it to ‘Automatic (Addresses only)’,
    which will still use DHCP to request an IP address from your router, but will
    ignore what it (and your ISP) tells you to use for DNS. In the DNS box enter 127.0.2.1
    – the address DNSCrypt runs on – and then restart your network by disconnecting
    and reconnecting. You can check that these settings have taken effect by visiting
    one of any number of DNS-leak test websites. Many of these will


    ![](img/7a0a282248f9658f0c87e55744c797b6_55_1.png)


    NetworkManager integrates nicely with OpenVPN, so connecting to a commercial VPN
    is often just a matter of importing an OVPN file.'
