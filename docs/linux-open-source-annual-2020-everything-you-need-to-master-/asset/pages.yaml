- pgno: 62
  md: '# BACKUP WITH DÉJÀDUP


    ![](img/7a0a282248f9658f0c87e55744c797b6_62_0.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_62_1.png)


    # 1  Set backup location


    You can use Gnome’s online accounts feature to back up to Google Drive, a Nextcloud
    instance and more. You can also use a network location such as Samba or SSH, or
    a local folder. We recommend using an external hard drive and unplugging it afterwards.
    If you use a truly local folder, be aware that anywhere you can write to could
    be hit by a ransomware attack.


    # 2  Choose what to save


    Add any folders outside your home directory you want to include in the backup,
    and exclude any inside that you don’t. The `~/.cache/` folder is not necessary
    and often takes up lots of space – it’s where *Chromium*’s cache is stored. If
    you use Steam then you’ll want to exclude `~/.steam` as well. Gnome’s Disk Usage
    Analyzer is a useful tool to see what’s taking up space.


    ![](img/7a0a282248f9658f0c87e55744c797b6_62_2.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_62_3.png)


    # 3  Initiate the backup


    Hit the Back Up Now button. You may be prompted to install **Duplicity** and you
    will be prompted for a password. If you use any (encrypting off-site backups is
    a good idea) then for pity’s sake don’t forget it: in fact, just use a password
    manager, like we tell you to later in this feature. Click the **Forward** button
    and start to feel secure in the knowledge that your files are safe.


    # 4  Set up a schedule


    Just as with yoga, regular practice is the key to backup heaven. Click the Scheduling
    tab to choose the frequency and longevity of backups. If you backed up to a location
    that isn’t available when an automatic backup initiates, don’t worry, you’ll be
    warned. Also beware of running out of space – old backups will be silently removed
    in this event, which may not be ideal.


    ![](img/7a0a282248f9658f0c87e55744c797b6_62_4.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_62_5.png)


    # 5  Be sure to be sure


    This step is optional, but a belt-and-braces approach is always good if you truly
    care about your data. So consider manually copying your encrypted backups somewhere
    else: a USB key, your home server, somewhere in the cloud, it doesn’t matter.
    Redundancy is good and since you encrypted your backups (didn’t you?), losing
    the storage shouldn’t be a concern.


    # 6  Test your backups


    Making backups is all very well, but you need to be sure they are viable and you
    know the drill for restoring them. Click the Restore button, plug in your storage
    device (if that’s how you did it, choose your backup location and choose the date
    to restore from. The most recent is shown first. For this test, restore to a specific
    folder so nothing is overwritten.'
