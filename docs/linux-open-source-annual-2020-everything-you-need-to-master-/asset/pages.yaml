    # ## SHARE OUT RESOURCES WISELY


    > “If you allocate too much CPU to the guest, then the host will suffer, which
    in turn will cause the guest to suffer”


    and uses the host OS one, but has been reported to speed up I/O intensive tasks,
    in particular OS installation and package updates. We won’t cover setting up a
    Windows VM here, but if you want to, you’ll probably have to experiment a little
    to get things running smoothly.


    ![](img/7a0a282248f9658f0c87e55744c797b6_70_2.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_70_3.png)


    ![](img/7a0a282248f9658f0c87e55744c797b6_70_4.png)


    # ### 4 Virtual hard disks


    We’ll need some persistent storage for our VM. Modern Linux distros tend to be
    fussy about installing anywhere with less than 10GB of space, and if you can spare
    it then allocating more is a wise idea. Choose “Create a virtual hard disk now”
    to begin the process. If you have a spacious data partition it’s worth storing
    VMs there to avoid filling up your home folder.


    # ### 5 Customise virtual storage


    Choose the default VDI storage. These files can be fixed or dynamically sized
    (up to a given maximum). Dynamic storage is obviously much more flexible, and
    these days you’re unlikely to notice the increased I/O overhead, so go with that.
    You can specify the file’s location with the tiny icon to the right, otherwise
    it goes in `~/VirtualBox VMs/`


    # ### 6 Boot your VM


    You’ll need an ISO image to boot your machine. Download the Ubuntu flavour of
    your choosing and then go to **Settings>Storage** and select the optical drive
    **Now** click on the tiny disc drop-down on the right and select **Choose Virtual
    Optical Disk File (sic)**. Locate your ISO, click OK, then hit the green **Start**
    arrow. Chocks away!'
