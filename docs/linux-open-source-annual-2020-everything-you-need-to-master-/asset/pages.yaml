- pgno: 28
  md: '# # Installation


    What does it take to anchor the OS to your machine?


    A I most all the OSes in the **Roundup** are equipped with a graphical installer.
    Unfortunately, though, that doesn’t mean you can expose them to a physical drive
    on a production machine as soon as you download the OS. You should realise that
    not all of them have undergone the same amount of testing as the Linux installers
    – and as we mentioned, it’s always a good idea to test in a VM first.


    The one exception is OpenIndiana. Linux users won’t have any trouble navigating
    through its installer, which is very polished and streamlined, much like a typical
    Linux installer. You can use the partition built into the installer to carve space
    for the OS, or use the familiar **Gparted** tool that’s available in the Live
    environment.


    Then there’s ReactOS, which is the only OS in the **Roundup** which offers a dedicated
    installable edition. Also available is a Live ISO image, designed to help you
    test the OS on your hardware. Once you’re satisfied that everything works, you
    can use the install-only variant to anchor ReactOS to the computer. The OS’s installer
    is a throwback to old Windows installers and isn’t particularly difficult to use.
    Like many Linux distros, ReactOS runs through a first-boot configurator to help
    you create a user and select a theme for the desktop.


    Haiku and Visopsys both have simple and straightforward installers. All you need
    to do is point Haiku to a BeFS filesystem partition and it’ll copy the files and
    install the bootloader fairly quickly. The installer can now boot from GPT partitions
    and the 64-bit image ships with an EFI bootloader so that Haiku can boot on EFI
    computers.


    ![](img/7a0a282248f9658f0c87e55744c797b6_28_0.png)


    Many OSes such as Haiku include a partitioner to help you create a dedicated partition
    for the OS.


    The Visopsys installer also includes a partitioner to help you create a slice
    for the OS. You’re forced to use the system as an admin user, but the installer
    enables you to set up a password for it. If you’re installing Visopsys on a new
    virtual disk, make sure you choose the option to write the basic MBR to the disk
    in order to boot into the installation.


    The one OS that frees you from the cycle of installation is KolibriOS, which doesn’t
    have an installation procedure as such. All you need to do is point GRUB to the
    **kolibri.img** file by adding an entry in the **40_custom** file under */etc/grub.d*,
    and you’re good to go.


    # VERDICT


    HAIKU: 8/10; REACTOS: 8/10; KOLIBRIOS: 8/10; VISOPSYS: 6/10; OPENINDIANA: 9/10


    Besides OpenIndiana, we’d suggest you first install these OSes inside a VM.


    # # Default apps


    Are they usable out of the box?


    J ust like the OS it emulates, ReactOS includes a handful of apps. Besides a number
    of utilities including *Paint*, *Notepad* and *WordPad*, the OS includes the three
    favourite Windows card games.


    Visopsys isn’t much better and ships with a minimalistic suite of apps, since
    the goal of the OS is to create a fully functional OS for CS students and alternate
    OS enthusiasts like us. Besides the disk manager and the installer, there’s a
    basic text editor, an image editor, a virtual keyboard app, a couple of games
    and a handful of administrative utilities.


    By contrast, KolibriOS ships with dozens of apps. There’s an audio player, a video
    player, a VNC viewer, a text editor, a rudimentary web browser and more. The OS
    also has lots of tools for developers, particularly for FASM assembly, and several
    game console emulators.


    Haiku too includes quite a lot of nifty but essential apps which a typical user
    might need on the desktop. There’s an email client, a web browser, a media player,
    an image viewer and a text editor, as well as administrative tools like an activity
    monitor, a hex editor, a disk partitioner, a simple web server and more.


    Openindiana ships with the all-too-familiar MATE desktop and a majority of the
    apps are from MATE’s stable as well. Besides these, there are a handful of mainstream
    productivity apps such as *Firefox*, *Thunderbird* and *Pidgin*. Straight out
    of the box, the Openindiana installation has limited usability and you’ll need
    to use its package management system to flesh it out.


    ![](img/7a0a282248f9658f0c87e55744c797b6_28_1.png)


    KolibriOS is an absolute treasure trove for retro gaming aficionados.


    # VERDICT


    HAIKU: 8/10; REACTOS: 4/10; KOLIBRIOS: 6/10; VISOPSYS: 4/10; OPENINDIANA: 6/10


    Besides Haiku, all other OSes leave out essential apps for everyday use.'
