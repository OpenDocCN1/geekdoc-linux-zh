  md: '# # Roundup


    Apache **»** Nginx **»** Lighttpd **»**

    Openlitespeed **»** Tomcat.


    ![](img/7a0a282248f9658f0c87e55744c797b6_125_0.png)


    **Kent Elchuk** is an experienced web developer and in his spare time does hydroponic
    food production.


    # ## Web servers


    Looking at the options for building, testing and deploying web apps at home or
    in the office? Well, let’s check out some of the best!


    # ### HOW WE TESTED...


    Since our Linux box has the ability to build and setup web servers in minutes,
    our local machine is the device we used in this tutorial to test our servers.
    In order to complete our testing, all we really need is access to the Internet
    while installing our building and testing software. Once that has been done, we
    can manage without it for our testing needs. Since browsers are the main way users
    experience server performance these days browser-response times will be a key
    test, we can test loads and delivery to produce some very useful numbers.


    In addition to browsers, we’ll use the Apache Benchmark test suite, which delivers
    some very useful data, this will help us gauge the efficiency of our servers and
    why some are better in some circumstances. On top of raw performance we’ll also
    judge each by their ease of installation, availability of support and documentation,
    the range of devices they support plus general features and any ability to extend
    the servers beyond their basic feature sets.


    ![](img/7a0a282248f9658f0c87e55744c797b6_125_1.png)


    Much of the World Wide Web is used to display readable web pages. From a typical
    web development point of view, most websites and web applications are built with
    a combination of web coding languages; like HTML, CSS, JavaScript, PHP, Java and
    mySQL to name but a few of the most common ones. Going into details a little deeper,
    web pages can be basic, speed optimised web pages, or complex web applications
    with lots of bells and whistles like slideshows, data reporting and e-commerce
    features.

    As websites comes in all shapes and sizes, it cannot be stressed enough how essential
    it is to know which web server delivers the best performance for the content you’re
    dealing with. So, that’s just what we will do. We’re going to test varying examples
    of content from the most basic to more elaborate websites, alongside how the servers
    install, perform and are configured.

    The servers we will examine are Apache, Nginx, Lighttpd, Openlitespeed and Tomcat.
    So, stick around and we’ll explore which server suits your needs best. Hopefully
    you’ll discover that the tests here will influence your real-world hosting choices
    and enable you to host faster serving websites.


    > > “We’re going to test varying examples of content from the most basic to more
    elaborate websites”'
