  md: 'the specifications of the virtual video card. In order to display higher resolutions
    at higher colour depths, it’ll need more video memory. With the default settings,
    this uses system RAM rather than video RAM, so you can probably spare at least
    64MB here. It’s actually possible to set this higher than the slider allows using
    the VBoxManage command line tool. More on that later...


    Modern desktops, despite appearing on a two-dimensional surface, all use some
    kind of 3D acceleration (be it OpenGL, OpenGL ES, or latterly Vulkan) to move
    windows around and draw nice shadows beneath them. By clicking the **Enable 3D
    acceleration** box we let our VM pass these primitives more or less directly to
    the host’s video card, as well as access its video RAM directly. So if you’re
    using onboard graphics (or a very old and short of VRAM graphics card) make sure
    you don’t over-allocate here. It’s tempting to click the 2D acceleration box too,
    but that’s only for DirectDraw acceleration on Windows guests.


    We can also accelerate the CPU side of things. The default settings allocate only
    a single thread to running the guest OS; this is pretty painful in a world that
    takes multitasking for granted. So select the **System** section on the left and
    choose the **Processor** tab. You can allocate as many virtual CPUs to the guest
    as threads the host machine is capable of running (so twice the number of cores
    if your processor supports HyperThreading or whatever AMD call it nowadays). Again,
    if you allocate too much CPU to the guest, then the host will suffer, which in
    turn will cause the guest to suffer. A reasonable rule of thumb is not to allocate
    more than half the available CPU resources. It’s also possible to set an execution
    cap, so that the VM can’t max out an entire core on the host, which can help for
    some misbehaving workloads.


    Some operating systems require the **Enable PAE/NX box**, which would enable 32-bit
    VMs to access more than 4GB of memory. If you’re setting up an Ubuntu Server guest
    (and you admit as much in the **Machine Type** and


