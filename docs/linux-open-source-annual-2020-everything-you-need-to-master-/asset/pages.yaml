  md: '```

    echo $ "network files"

    If interrupts don''t like this file to missing..

    and http://regcli.k.org/fedora/rel/0-0g-sel/iso-284912

    $ yum config-manager --add-repo

    network-scripts.repo

    /etc/network-scripts/ifcfg-eth0

    net\nBOOTIF="7F46E0391D29"\n\nifcfg=\

    NETBOOT=\

    ONBOOT="yes"\nTYPE="Ethernet"\nPERSISTENT_MACADDR="yes"

    QPF

    ```


    Fedora''s LiveCD tools have been ported to other RPM-based distributions like
    Mageia.


    ```

    # simple config, again not hard-coded to the build hw\nDEFAULTCONFIG="\nhttp://ftp.pbone.net/mirror/ftp.distri.org/fedora\nrel/0-0g-sel/iso/284912/network/ifcfg-eth0"\n\n#\n#\n#\nQPF

    ```


    fetched from Fedora repositories mentioned in the fedora-repos.ks file. You can
    either directly specify the exact URL for a repository (with the --baseurl option)
    or let it choose one from a list of mirrors (with the --mirrorlist option).


    In case you pull in packages from third-party repositories like RPMFusion or those
    for fetching proprietary software like the Steam client, Google Chrome, Nvidia
    graphics and the like, Fedora guidelines mandate you to rebrand your creation.
    But they''ve made the process simple. All you need to do is remove a bunch of
    Fedora branding packages, namely -fedora-logos and -fedora-release*, and then
    replace them with generic ones, generic-release* and generic-logos.


    # Post haste


    Lastly there''s the %post section that enables you to run commands after all the
    packages have been downloaded and installed to the temporary directory. You can
    add custom users, copy files, configure the network, and do a lot more interesting
    stuff in this section.


    To correctly identify your remixed distro, we''ll rename it in the /etc/fedora-release
    file, with:


    ```

    %post

    sed -i -e ''s/\$Generic release/LXF Fedora Remix/g'' /etc/fedora-release

    %end

    ```


    The commands in the %post section by default run inside a chroot environment against
    the new filesystem in the Live CD. But there''s also a mechanism for adding files
    to the LiveCD''s filesystem. The %post --chroot section enables you to interact
    with your custom distro''s environment from outside. This enables you to copy
    files from your host Fedora installation to the customised distro.


    Kickstart offers two variables for interacting with the custom distro environment.
    The $INSTALL_ROOT points to the root (/) of the customised distro where all the
    packages are installed during the build process. This comes in handy for copying
    files you need in your Live environment. For example:


    ```

    %post --nochroot

    cp -r /home/\$INSTALL_ROOT/Pictures/wallpapers/\

    $INSTALL_ROOT/etc/skel/Pictures/

    %end

    ```


    This will copy a bunch of images housed inside the wallpapers directory on the
    host to the custom distro. We''ve placed it inside the skeleton directory (/etc/skel)
    so that it''s available to all users in the custom distro. You can use the same
    mechanism to copy over your desktop customisations to the custom distro. First,
    just like before, configure your desktop as per your requirements on an installed
    system. When you''re done, simply scoot over the configuration files from your
    home directory to the /etc/skel directory on the live CD:


    ```

    %post --nochroot

    cp -r /home/\$INSTALL_ROOT/etc/skel/

    cp -r /home/\$INSTALL_ROOT/etc/skel/

    %end

    ```


    The other variable is $LIVE_ROOT. This is the root of the Live CD and any files
    placed here will be available without having to boot the media. Think of all the
    HTML files in the Linux Format DVD that you can view without booting into the
    month''s featured distro. For instance:


    ```

    %post --nochroot

    cp -r /home/\$INSTALL_ROOT/

    Music

    %end

    ```


    This will copy over all music files from the host to the root of the customised
    media. You can also use both variables together to move files from inside the
    root of the compressed filesystem to the root of the media:


    ```

    %post --nochroot

    cp \$INSTALL_ROOT/usr/share/doc/*/\\

    release-*GPL $LIVE_ROOT/GPL

    %end

    ```


    This will extract the GPL license file from your customised distro''s filesystem
    and place it in the root of the customised media.


    After you''ve assembled the kickstart files, you can pass them on to livecd-creator
    to compile the ISO image of your customised distro. First ensure SELinux on the
    host is set to the permissive mode with the setenforce 0 command, before you call
    the livecd-creator script:


    ```

    $ livecd-creator --config=custom-fedora.ks

    --fslabel=LXF Remix28 --cache=/var/cache/

    live --verbose

    ```


    Here, the --config option identifies our custom kickstart file and the --fslabel
    defines the name of the volume as well as the ISO image. The --cache option defines
    the directory where the script will download the packages from the repositories
    and assemble them into a Live environment. Remember to use this cache directory
    for subsequent builds to avoid having to download the same packages again. The
    script will only download packages if you''ve added any new ones to the kickstart
    file after running the initial build.


    The time it takes to compile the distro depends, as usual, on the number-crunching
    process of your computer and the number of packages that need to be fetched from
    the Internet. When it''s done, it''ll leave an ISO file for your customised Fedora
    remix in the current directory. You can then test it on a virtual machine before
    passing it around to friends, family and interested colleagues.


    # TOP 20 DISTROS


    # LIGHTWEIGHT DISTROS


    # MX LINUX


    ![](img/7a0a282248f9658f0c87e55744c797b6_14_0.png)


    A joint effort between antiX and MEPIS, the USPs of this distribution are its
    user-friendliness and a host of custom tools.


    # ANTIX


    ![](img/7a0a282248f9658f0c87e55744c797b6_14_1.png)


    The Debian-based distribution doesn''t ship with Systemd and is available in four
    editions with different lightweight desktops.


    # 4M LINUX


    ![](img/7a0a282248f9658f0c87e55744c797b6_14_2.png)


    The distribution uses the JWM window manager and, despite its miniscule requirements,
    can be used for various purposes.


    # PUPPY LINUX


    ![](img/7a0a282248f9658f0c87e55744c797b6_14_3.png)


    One of the all-time favourites for reviving old computers, it''s loved and hated
    in equal measures for its choices of esoteric programs.


    # BODHI LEGACY


    ![](img/7a0a282248f9658f0c87e55744c797b6_14_4.png)


    Ships with its own Enlightenment-based desktop and is designed to perform well
    on aging computers and netbooks.'
