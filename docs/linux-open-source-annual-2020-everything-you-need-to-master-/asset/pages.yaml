  md: '# # BEWARE OF THE RANSOMWARE


    **Jonni Bidwell** knows how not to do a lot of things, including how not to pay
    ransoms and how not to be fooled by social engineering scams...


    ![](img/7a0a282248f9658f0c87e55744c797b6_59_0.png)


    We’re still patiently waiting for the year of the **Linux** desktop, but one sign
    that Linux has become **mainstream** is that it is now actively targeted by malware
    pushers. Perhaps not to the same extent as Windows, and perhaps those miscreants
    are more interested in hijacking servers than desktops, but peddling the old “Linux
    doesn’t get viruses” line does not make for credible journalism. *(don’t use the
    J word!–Ed)*


    Linux servers can be compromised all the time. It’s a little too easy for your
    run-of-the-mill script kiddie to find their favourite exploit in Metasploit, find
    some vulnerable servers via **shodan.io** and create havoc. Attacking desktop
    Linux is a little more delicate, but that’s not to say it doesn’t happen. Rogue
    websites may serve drive-by downloads, bona fide websites may get hacked or a
    long-standing bug in the kernel may be discovered. All of which might spell the
    end for your data.


    A much greater threat, however, is social engineering. This is pretty much operating
    system agnostic – it relies on weaknesses in human nature rather than in software
    – so there’ll be few tips that will help you even if you use some other OS. A
    well-crafted email can trick a weary mark into opening the wrong kind of file,
    disclosing their password (or other personal information) or even wiring money
    to a stranger. Some of these scams are easy to spot, but others are not. Over
    the last five years, cyber-criminals (who promise not to use this prefix too much)
    have cottoned on to the fact that people care about their files, so a popular
    MO is to encrypt them and hold them to ransom. Victims are ‘invited’ to pay, usually
    by cryptocurrency, for a decryption key, but often this is never provided. Sometimes
    ransomware is ill thought-out, and boffins can reverse-engineer whatever encryption
    was used and provide free decryption tools. But you shouldn’t count on this. Instead
    heed our guide – be strong, be vigilant and behave.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Ransom and deceit


    The scammers have figured out that your data is more valuable to you than it is
    to others. Don''t let them exploit this fact.


    ![](img/7a0a282248f9658f0c87e55744c797b6_60_0.png)


    **W** hile we did a cover feature on malware not all that long ago (*LXF251*),
    our state of the art analytical engine (*that’s me* – *Ed*) tells us that you
    want to hear more detail about one particular type of malware – ransomware – and
    one particular means of delivery, social engineering.


    Holding things to ransom is an ancient idea, and one that has been shown to work
    very well. Kings, nobles and precious works of art have been ransomed since antiquity.
    Likewise using smooth talking to hoodwink people into doing things they probably
    shouldn''t – grifting, if you will. But in the digital age these practices take
    on a whole new, sinister dimension. On the face of it having files held to ransom
    is in an entirely different league to having a family member kidnapped. But what
    if people’s lives depended on the integrity of those files? Terrorifyingly enough,
    this has happened on more than one occasion.


    The Wannacry ransomware outbreak of 2017 infected some 300,000 computers in 150
    countries – making it, according to veteran security researcher Mikko Hypponen,
    "the biggest ransomware outbreak in history". People showing up to work were greeted
    by their computers asking for Bitcoin payments equivalent to $300–$600 to decrypt
    their files. In the UK it brought our (already struggling–not Wales) NHS to its
    knees. Patients saw operations cancelled, and were advised to only seek medical
    care in emergencies. Staff, devoid of network and phone access, had to resort
    to manual methods to deliver vital healthcare services.


    Commentators were quick to point out that the NHS had, and still has, a number
    of machines running Windows XP, but these weren''t really the problem –


    most of these were embedded installations that can''t be upgraded and weren''t
    even connected to the network. The problem was the huge number of unpatched Windows
    7/8/2000 systems that were vulnerable to a bug in the SMB protocol of which, it
    turns out, the NSA was aware for some time. It had in fact weaponised said bug
    for use in its own Tailored Access Operations unit, and named the exploit EternalBlue.


    Unfortunately that exploit fell into the hands of a hacker collective known as
    the Shadow Brokers. The NSA alerted Microsoft to the possible theft and a patch
    was issued in March 2017. In April 2017 EternalBlue – alongside other NSA exploits
    named EternalChampion and EternalRomance – was leaked by the Shadow Brokers and
    a month later, when many systems remained unpatched, WannaCry used it to wreak
    havoc around the world. See the box later on for more on the anatomy of WannaCry.


    We''d love to say there are magical open source tools that with just a little
    bit of command-line fu can help you recover from any ransomware attack, but that''s
    just not the case. And nor will it ever be. There are a couple of things that
    are guaranteed to help you though, and they''re skills everyone should practise.


    ![](img/7a0a282248f9658f0c87e55744c797b6_60_1.png)


    > The best solution to all of these woes is something you should already be doing:
    regular backups.


    SET, the Social Engineering Toolkit, comes with Kali Linux and is full of tips
    and tricks (and references to our favourite movie).


    # » PAY UP OR THE DATA GETS IT


    A number of high-profile organisations have paid ransom fees, and we are likely
    to see a lot more of this unless our collective security game is upped. Large
    organisations with lax security practices can (but shouldn''t) be crippled by
    a careless employee falling for an email scam. This may be an untargeted attack,
    where the ransomware keystaters'' expected targets are unsuspecting home users,
    in which case the asking price is pretty modest. Or it could be some kind of spear
    phishing campaign, where execs or sysadmins are targeted so their privileges or
    well-endowed bank accounts can be ransacked. And if you''re going to cripple a
    large organisation you''ll probably be after more than pocket change.


    In June of this year, Riviera Beach City Council in Florida agreed to pay a $600,000
    (65 BTC) ransom to hackers after their systems were crippled. They join a growing
    number of institutions that have chosen to cough up six-figure sums in order to
    restore critical services. A 2018 report from SentinelOne surveyed some 500 large
    organisations and found that of those hit by ransomware, 45 per cent of them had
    paid up, but only 26 per cent of those had their files unlocked. So much for honour
    among thieves.'
