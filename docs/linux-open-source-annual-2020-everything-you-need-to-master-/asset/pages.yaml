- pgno: 115
  md: '# ## User experience


    # They all look alike, but do they all behave the same too?


    Productivity applications is a term that gets thrown around quite a bit nowadays.
    Until the 1980s, the world was still getting by on typewriters or pen and paper,
    but with the introduction of office suites, the oldest productivity applications
    changed how we use the computer at home and work. It’s no surprise, then, that
    there are very few jobs in the world today that don’t require basic skills with
    office software.


    While the suites all provide similar functionality in one or two component applications,
    they are distinct enough in their workflow that switching between them may involve
    quite a bit of learning before you’re comfortable using them for everyday use.


    If you’re only interested in a single office component, such as a spreadsheet
    or word processor, then refer to the Also Consider section at the end of this
    month’s Roundup for some recommendations.


    # Google Docs 8/10


    It has the distinction of being the only online office suite featured in this
    Roundup. But to be fair, OnlyOffice too provides a cloud-based solution. While
    originally the suite worked best on the Chrome browser, you won’t find any performance
    issues or missing features when using it on alternative such as Firefox.


    The vast number of templates for each of the component applications is the biggest
    USP for Google Docs. Its easy integration with Google to perform searches, and
    integrating results, or sharing files with other users with a single click, is
    also a bonus. If you frequently have to collaborate with users, you’re regularly
    on the move and can’t afford to leave urgent files behind, the use of Google Drive
    as the storage provides great luxury, in that you can access your work from anywhere
    – as long as there’s an available internet connection.


    ![](img/7a0a282248f9658f0c87e55744c797b6_115_0.png)


    # Calligra Suite 7/10


    There’s little wrong with Calligra itself, but you may struggle with its esoteric
    workflow. For instance, you can’t insert any shape into a presentation or document
    without accessing the Add Shapes docker. Indeed, the whole process of switching
    between dockers to access elements and features that are easily accessible on
    the alternate suites from the toolbar itself, is inexplicable and unintuitive.


    We don’t generally condemn the different style of working, but easy availability
    of documentation becomes quite important for such applications. While plenty of
    documentation exists for some of its component applications such as Sheets and
    Stage, it’s not accessible from within the app itself.


    But if you’re willing to put in the time to master its style of working, or are
    using old machines, you’ll appreciate Calligra’s ability to function on low-spec
    systems.


    ![](img/7a0a282248f9658f0c87e55744c797b6_115_1.png)


    # ## Help and support


    # Who can you turn to, when you can’t tell if you’re coming or going?


    Judging by the nature of work that these programs perform, you’d think they’re
    fairly easy to use. While this is true for the most part, especially for the straightforward
    offerings of Google Docs, the other applications may require some guidance. Such
    as when you’re trying to figure out how to install plugins on WPS Writer, or if
    there are even any on offer!


    While all the applications are cross-platform, WPS Writer’s Linux edition doesn’t
    get the same attention as its Microsoft counterpart. This is why you may find
    solutions to certain problems in the official documentation that don’t apply to
    the Linux edition. For instance, the official Help will tell you how to use the
    Mail Merge feature, but it isn’t even available on Linux.


    There isn’t much documentation on OnlyOffice’s website, beyond instructions covering
    installation and basic usage, but you’ll find far more useful information from
    within the program itself. Depending on the application you’re running, clicking
    File>Help presents a categorised list, and there’s also a search bar if you’re
    looking for something specific.


    In contrast, Calligra’s documentation is non-existent. Launching the handbook
    from within the program drops you to a KDE handbook page that doesn’t exist. When
    you do finally manage to track down some documentation on KDE.Userbase, all it
    lists is a few isolated features. Thankfully, you can tap the user community for
    advice and assistance on the official forum boards.


    LibreOffice boasts of detailed user guides, accessible from within each of the
    component applications. In addition to its thorough documentation guides, the
    project also has a Q&A website called Ask LibreOffice.


    # VERDICT


    CALLIGRA SUITE 4/10  ONLYOFFICE 8/10

    GOOGLE DOCS 8/10  WPS OFFICE 4/10

    LIBREOFFICE 10/10


    Office suites are unlikely to attract new users if there aren’t any help files
    to help acclimatise them.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# **LibreOffice 10/10**


    One of the most comprehensive suites, each of the component applications feature
    detailed documentation that can be accessed from within the app itself.

    With the 6.0 release, the project has also introduced a ribbon interface, much
    like *Microsoft Office* but it isn''t *enabled by default*. If you like the ribbon
    interface though, the implementation on *WPS Office* is quite pleasing, but unfortunately
    not so on *LibreOffice*.


    Despite its ease of use, our only complaint with *LibreOffice* is how poorly it
    renders most docx files. Another frequent complaint is that it''s a resource hog,
    and if you''re running a low-spec machine with only about 2GB RAM, you''ll probably
    be best served by one of its alternatives.

    But it makes up for these shortcomings by offering hundreds of extensions which
    enhance its functionality, and *LibreOffice* is unmatched on this front.


    ![](img/7a0a282248f9658f0c87e55744c797b6_116_0.png)


    # **OnlyOffice 8/10**


    For this *Roundup*, we''ve tested the *OnlyOffice Desktop Editors*, which is the
    offline variant of the office suite. This version doesn''t provide many useful
    features such as collaboration. You can try various cloud installations with a
    free 30-day trial, if you want to experience the whole host of features. While
    these variants might suit enterprises, or even a SoHo setup, they''re much too
    expensive and cumbersome for home users.

    Unlike the other suites that feature separate applications, *OnlyOffice* presents
    a single interface. You can decide whether you wish to work on a presentation,
    spreadsheet or document, or all three, at any time, which open up in separate
    tabs within the interface.

    For basic home users however, *Only Office* provides most of the common functionality
    you expect from three of the most common productivity applications.


    ![](img/7a0a282248f9658f0c87e55744c797b6_116_1.png)


    # **WPS Office 7/10**


    Both *Only Office* and *WPS Office* only offer a spreadsheet, word processor and
    presentation programs, while the others also provide a drawing application, or
    a database management tool. Of the two, we like *OnlyOffice* better because the
    project is more mature in comparison, since *WPS Office* is lucky to be able to
    push out a Linux release.

    With a barebones team working on the Linux edition, we''re also unsure if the
    project will still be available down the road. It''s also unknown, when if ever,
    it will introduce some of its best features, such as collaboration, which are
    restricted for the Windows version for now.

    The lack of support for ODF is also disappointing, and might put off many open
    source purists. But its ribbon implementation is impressive, and we''d go so far
    as to suggest that this is something *LibreOffice* can learn for *WPS Office*.


    ![](img/7a0a282248f9658f0c87e55744c797b6_116_2.png)


    # # Other tools


    # What else can you accomplish with these programs?


    Word processor, spreadsheet and presentation application are three of the most
    commonly used tools in an office suite. Our selection of suites for this *Roundup*
    each offers other applications as well.

    *Google Docs* Forms can be used to quickly create some of the most common ones,
    such as contact and party invite. The templates provide a vast selection of the
    commonly used ones across many different categories such as *Personal*, *Word*
    (job application, event feedback), and *Education* (assessment, worksheet). You
    can also use *Google Drawings* to create flowcharts and mind maps, but not artistic
    works.

    *Calligra* provides you with *Karbon*, a vector graphics drawing application,
    but the tool is no longer maintained. If you''re interested in a graphical application
    for building databases, you can try your hands at *Kexi*. *Calligra Plan* is a
    project management tool that can be used to manage even moderately large projects.

    Like *Calligra''s Kexi*, *LibreOffice Base* is a graphical database management
    application similar to *Microsoft Access*. Base boasts


    of various wizards to help new users, or even skilled hands create tables, queries,
    forms and reports. It also features pre-defined table definitions for tracking
    assets, customers, sales orders and invoices to ease quick deployment. It provides
    native support for most of the widely used database engines, such as *MySQL*,
    *MS Access*, *PostgreSQL* and others. In comparison, *Calligra''s Kexi* doesn''t
    support *MS Access* and isn''t as well developed as *Base*.

    Unlike the other tools, *WPS Office* and *OnlyOffice* only feature the three essential
    components, and there''s no word on whether they''ll ever provide a drawing or
    database application.


    # **VERDICT**


    | CALLIGRA SUITE | 9/10 | ONLYOFFICE | 5/10 |

    |---|---|---|---|

    | GOOGLE DOCS | 7/10 | WPS OFFICE | 5/10 |

    | LIBREOFFICE | 9/10 | | |


    > *The scores here only reflects the number of tools on offer within each suite,
    and not their usability.*'
