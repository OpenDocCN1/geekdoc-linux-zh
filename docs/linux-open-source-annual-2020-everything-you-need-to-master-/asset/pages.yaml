- pgno: 133
  md: '# # Usability


    What makes them stand out?


    Unlike desktop apps, disk cloning tools are administrative software and you’d
    expect them to sacrifice a certain amount of user-friendliness in order to make
    room for advanced functions and features. That being said, while we don’t expect
    these tools to have point-and-click usability, a certain amount of intuitiveness
    will surely make them more approachable.


    We are in no way expecting these tools to cater to a non-technical audience that
    doesn’t know what they are getting into, but having a logically laid-out interface
    with a clear path of progression will go a long way to getting the most out of
    the tools. Ease of deployment and reasonable defaults are the icing on the cake,
    and while they aren’t all critical to selecting a good administrative tool, they
    can’t really hurt its chances.


    # ### Clonezilla 8/10


    Clonezilla is one of the most recommended tools on Linux forums for imaging an
    old disk to a bigger, new disk thanks to its curses-based frontend, which is intuitive
    (Really?—Ed) to navigate. In the background, Clonezilla uses a set of scripts
    with several open source disk utilities such as Partimage, ntfsclone, Partclone
    and dd to help you duplicate individual partitions and complete disks.


    The menus offer sensible defaults so you’ll likely go with the recommended options
    most of the time. Just make sure that the partition to be cloned isn’t mounted.
    Also, despite its unglamorous text-based interface, Clonezilla isn’t intimidating
    because of its very verbose screens. Each step is dotted with relevant information
    to help you make an informed choice. Still, Clonezilla isn’t something to be approached
    without adequate knowledge and experience.


    ![](img/7a0a282248f9658f0c87e55744c797b6_133_0.png)


    # ### Deepin Clone 8/10


    If there’s one area where Deepin Clone trumps the rest of the competition, it’s
    usability: the app really is as simple as they come.


    On the first screen, it asks you to select whether you wish to clone a complete
    or individual partitions. Depending on the selection, it’ll bring up another set
    of options to help you narrow down the disk/partition you want.


    On the following screen you’re shown a list of disks or partitions. Unlike some
    of the other options on test here, if you’ve selected the option to clone partitions,
    the app won’t let you clone multiple partitions in one go. Also, its default mode
    of cloning is a direct disk-to-disk or partition-to-partition, which is rather
    unsafe and something we’d never recommend doing. In addition, to use Deepin Clone
    to image the current installation, you’ll have to run it via Deepin Recovery.


    ![](img/7a0a282248f9658f0c87e55744c797b6_133_1.png)


    # # Supported fileystems


    Will they work across all machines in your network?


    Clonezilla supports a wide number of filesystems, from popular ones like ext2/3/4,
    ReiserFS4, Btrfs, FAT16/32 and NTFS to specialised ones like XFS, JFS and UFS.
    But that doesn’t mean it’s totally unusable for unsupported filesystems. For those
    it supports, Clonezilla images only the used blocks for greater restore functionality.
    If it runs into a filesystem that doesn’t understand, Clonezilla uses dd to image
    the contents as-is, and can restore them easily to equal-sized disks.


    Much like Clonezilla, G4L works in two modes. There’s the filesystem level where
    it uses utilities such as NTFSclone and FSArchiver to directly clone supported
    filesystems, including virtually all the popular ones. If you work with exoteric
    filesystems or need to clone entire disks, you can use G4L in RAW mode to copy
    all bits of any file system.


    FOG Project uses both Partimage and PartClone in the background, so it supports
    all the popular filesystems. The Imaging section also enables you to create a
    sector-by-sector image of the drive using dd.


    In contrast, there isn’t much information on the internet about the way that Deepin
    Clone works, and it doesn’t offer any configurable parameters that would hint
    at the filesystems it supports. In our tests, however, it worked on both ext4
    and NTFS partitions, so there’s that.


    In contrast to its peers, WereSync uses rsync to copy the contents of the drive,
    and can image the contents of GPT, MBR and LVM drives. According to the official
    documentation, you can even force the tool to copy the contents of a drive to
    a file by specifying the IMG extension type.


    # **VERDICT**


    | CLONEZILLA | 9/10 | G4L | 9/10 |

    |---|---|---|---|

    | DEEPIN CLONE | 5/10 | WERESYNC | 5/10 |

    | FOG PROJECT | 9/10 | | |


    All these tools give you decent mileage so long as you’re working with one of
    the popular filesystems.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# FOG Project 8/10


    FOG Project has a much more involved installation process than the other solutions
    here. Unlike Clonezilla and G4L, you first need to set up an imaging server. While
    the initial deployment might be time-consuming, FOG Project''s web interface makes
    the effort worthwhile since it can image and deploy multiple computers simultaneously
    with ease. FOG Project''s web interface is fairly intuitive for anyone who is
    familiar with the intricacies of the imaging process. The menus are arranged in
    a logical fashion and first time users should have no issues navigating it. The
    setup is scalable as well, and you can set up dedicated storage nodes which can
    help take the load off the main FOG Project server. If you have to host and deploy
    images to a large number of computers. You can use the web interface to manage
    all imaged computers as well as their cloned images.


    ![](img/7a0a282248f9658f0c87e55744c797b6_134_0.png)


    # G4L 8/10


    Live with Clonezilla, the interface of the G4L Live CD is text-based and written
    in curses. This one, however, is much more verbose. The process of creating and
    restoring images takes you through several wizards, each of which is loaded with
    quite a number of steps. Unlike Clonezilla, G4L ships with four different kernels
    so you''ll first have to select the one based on your hardware. If you''re using
    G4L on an older machine, use an older kernel for greater compatibility. Upon booting,
    the Live environment will first display some basic usage information spread across
    multiple pages. Advanced users can then either issue a cloning or restoration
    command directly, or use the interface to construct the command using the various
    menus. As you step through each screen, G4L brings up another screen asking for
    more relevant options to complete the task.


    ![](img/7a0a282248f9658f0c87e55744c797b6_134_1.png)


    # WereSync 6/10


    Installing WereSync is fairly straightforward since you can grab it from Python''s
    PIP package manager with a single command. You can then fire up the graphical
    interface which is fairly intuitive, although there are some options that don''t
    immediately make sense. A quick scroll through the documentation is advisable
    to familiarise yourself with the peculiarities of the tool. Some of the options
    also have a brief explanation built into the app itself. Despite these avenues
    of help, it''s difficult to differentiate between options that are mandatory and
    optional, and the impact that their inclusion or exclusion will have on the cloning
    process. Also disappointing is the lack of meaningful errors. By default the app
    is configured such that once begun, all cloning tasks end with a success message,
    even when the process has failed.


    ![](img/7a0a282248f9658f0c87e55744c797b6_134_2.png)


    # Help and support


    Where do you go if you run into trouble?


    Clonezilla hosts a pretty comprehensive FAQ on its website, which you should scroll
    through before experimenting with the tool. You can also engage directly with
    Clonezilla''s developer via the official forum boards, where he is fairly active.
    New users can also find getting started information littered all over the web,
    including on YouTube. The primary source of information about G4L is its verbose
    interface. The project is hosted on SourceForge and besides the built-in help,
    there''s little else on its website. G4L does have an active forum where you can
    engage with the developer, who again is fairly active. Again, just like Clonezilla,
    G4L is fairly well-covered and you can find lots of getting started information
    and tutorials all over the internet. New users will be well taken care of by FOG
    Project. The project has extensive documentation on its website including a wiki
    and a detailed FAQ. There''s also an installation guide with distro-specific installation
    notes. If you run into any trouble with your FOG Project installation you can
    get help from its very active forum boards, and can even find its developers and
    seasoned users via its IRC channel. Although it has a very intuitive interface,
    as we''ve said there isn''t much information available about Deepin Clone. It
    doesn''t have any dedicated avenues of support besides the ones for the main distro.
    There are two parts to the WereSync tool, a command-line utility and a graphical
    one. The project''s webpage has adequate information to orientate new users with
    both the utilities, including an in-depth explanation of all its CLI parameters.


    VERDICT

    | Tool | Rating |

    |---|---|

    | CLONEZILLA | 9/10 |

    | DEEPIN CLONE | 5/10 |

    | FOG PROJECT | 9/10 |

    | G4L | 8/10 |

    | WERESYNC | 5/10 |


    While the mature tools don''t always have good documentation of their own, you
    can find help elsewhere on the internet.'
