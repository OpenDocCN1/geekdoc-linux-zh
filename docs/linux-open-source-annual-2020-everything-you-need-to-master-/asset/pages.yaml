- pgno: 29
  md: '# ## Usability and performance


    Does it take much effort

    to get used to them?


    **T**his Roundup includes

    operating systems that are

    called ‘alternative’ for a reason.

    They are unlike your everyday desktop

    distro and in fact it’ll be unreasonable to

    expect them to look, feel and behave

    like other mainstream OSes as well.

    Many of them are also in the nascent

    stages of development, despite the fact

    that developers have been working on

    some of them for over a decade. The

    early development stage is a reflection

    of the OSes’ unstable base, which will

    have a direct impact on their usability

    and performance.

    Even when it comes to mainstream

    distros, usability is an important factor

    for consideration. Having a long list of

    features comes to naught if a distro isn’t

    usable. The same is true for these

    alternate OSes.

    This is why in addition to comparing

    them on various individual aspects that

    influence their usability, we’ll also rate

    their overall user experience to help you

    find one that gives you the most

    mileage on the desktop.


    # **Haiku**

    **8/10**


    Don’t let Haiku’s beta status fool you;

    the project is pretty mature and been in

    existence for over a decade now. The

    usability of the OS is phenomenal, both

    inside a VM and on real hardware.

    The ISO gives you the option to either

    launch the installer or boot into a fully

    functional Live environment. The installer

    is very efficient at its job and also includes

    a partitioner to help you carve space for

    the OS. Even on a moderately powered

    machine, Haiku’s boot-up and shutdown

    times are pretty impressive.

    The OS works straight out of the box on

    most machines with standard hardware. It

    has one of the most comprehensive set of

    default apps, and you can fetch more

    using the graphical package manager. The

    user experience is further enhanced by the

    rich documentation and the project’s

    support infrastructure, which is designed

    to habituate first-time users.


    ![](img/7a0a282248f9658f0c87e55744c797b6_29_0.png)


    # **KolibriOS**

    **6/10**


    KolibriOS is written in the FASM assembly

    language and based on the source code of

    the MenueOTS operating system. It boots

    in a flash and gives you access to a

    number of useful apps. There’s no

    installation involved, though you’ll have to

    make sure you select the option to save

    the changes you made during the session

    when you quit it down.

    The OS supports FAT and NTFS

    filesystems and ships with drivers for

    popular audio, video and Ethernet

    hardware. The desktop is fairly intuitive

    to operate, and new users aren’t

    permaped for casually exploring the

    desktop and its various apps.

    The only shortcoming of the OS is that

    its productivity apps aren’t really mature

    enough for everyday use, and the lack of a

    package manager doesn’t help its case

    either. On the other hand, if you like retro

    gaming there’s no better OS.


    ![](img/7a0a282248f9658f0c87e55744c797b6_29_1.png)


    # ## Documentation and support


    Will they guide you through the murky waters?


    **B**ecause Vysssys is primarily designed for developers

    and students, the bulk of its documentation caters for

    this group. There’s a lot of information that exposes the

    internals of the OS, which is a treasure trove for any Computer

    Science student. KolibriOS also has just enough documentation

    to help users get started with the OS. There’s a quick FAQ and

    some how-tos to help boot KolibriOS alongside Windows and

    Linux, as well as on virtual hardware. There’s also a fairly active

    multilingual forum for dispensing help.

    OpenIndiana fares a little better. It has a detailed FAQ and

    an (under construction) handbook, which is still fairly detailed.

    There’s also a wiki to help users and developers get orientated

    with the OS. The project surprisingly doesn’t have a forum, so

    you’ll need to use its mailing lists for your support queries, which

    is a rather clunky way of doing things.

    On the other hand, the ReactOS project has a wiki that hosts

    various tutorials designed to help first-time users install the OS

    and perform various tasks. The wiki is also home to developer

    documentation along with details about the internals of the OS.

    For support there’s a MatterMost-powered chatroom and

    multilingual forums.

    Similarly, Haiku’s website does everything it can to help

    orientate first-time users of the OS. It has various introductory

    documentation including a detailed FAQ, a fairly complete

    illustrated user guide, along with several other focused guides to

    help users install, update and virtualise the OS. There are several

    avenues for support as well including forums, IRC channels,

    mailing lists and so on.


    # **VERDICT**


    | OS | Score |

    |---|---|

    | HAiku | 8/10 |

    | KOLIBRIOS | 6/10 |

    | OPENINDIANA | 6/10 |

    | REACTOS | 8/10 |

    | VySSSYS | 4/10 |


    > *New users will feel most welcome with the support infrastructure of the

    ReactOS and Haiku projects.*'
