  md: "# # GPU passthrough\n\nExperience near-native graphics performance in a VM\
    \ with the magic of PCI passthrough. It’s better than watching rabbits being pulled\
    \ out of hats!\n\nLate ly, Steam Play has been getting a great deal of attention\
    \ from Linux gamers, and with good reason. It brings a whole raft of titles to\
    \ the platform, most of which stood zero chance of ever seeing an official port.\
    \ However, many of the officially blessed titles don’t perform as well on Linux\
    \ as they do on Windows, and many other titles run into all kinds of bugs, which\
    \ prevent them being played properly at all. Make no mistake, the Valve’s Proton\
    \ Wine fork and DXVK sponsorship are great, but they’re not going to convince\
    \ hardcore gamers to switch to Linux anytime soon. Even native Linux ports from\
    \ the likes of Feral and Aspyr rarely compete performance-wise with their Windows\
    \ counterparts.\n\nVirtual Function I/O (VFI0) enables the Linux kernel to pass\
    \ PCI hardware directly to VMs with negligible overhead. This includes complicated\
    \ hardware such as expensive graphics cards, so you can see where this is going.\
    \ Besides gaming on a Windows VM, this is useful if you have a deep learning or\
    \ mining environment set up in a VM. Many people that have this working have reported\
    \ close to 99 per cent native performance. In order to get this working though,\
    \ there are several hoops to jump though.\n\nFirst, so there’s no confusion let’s\
    \ be clear: This requires two graphics cards, the host OS relinquishes all control\
    \ of the passed-through GPU to the VM, so it’s as good as dead to it. There are\
    \ also a bunch of other hardware requirements that we’ve tried to sum up in the\
    \ box (right). If you’re using two dedicated cards, make sure you have sufficient\
    \ power to feed them. Theoretically, the one on the host shouldn’t be drawing\
    \ much power while the VM is busy, but you never know. Modern GPUs have become\
    \ efficient as well as powerful, but on a busy day the gruntier models can happily\
    \ draw 250W.\n\n# I need IOMMU\n\nAs well as activating it in the BIOS, we need\
    \ to tell the kernel to use IOMMU by way of some bootloader options, which we\
    \ can either add to the `linux` line in /boot/grub/grub.cfg, or we can use the\
    \ recommended drill of adding them to the `GRUB_CMDLINE_LINUX_DEFAULT` line in\
    \ `/etc/default/grub` and then running `grub-mkconfig`. On an Intel system, the\
    \ requisite option is `intel_iommu=on`, while on AMD it’s `amd_iommu=on`. Reboot,\
    \ then run the following script (appropriated from the helpful Arch Wiki VFI0\
    \ page, which is worth a read. https://wiki.archlinux.org/index.php/PCI_passthrough_via_OVMF):\n\
    \n```\n```bash\n#!/bin/bash\nshopt -s nullglob\nfor d in /sys/kernel/iommu_groups/*/devices/*;\
    \ do\n  n=${d#*/iommu_groups/}; n=${n%%/*}\n  printf \"IOMMU Group %s \"\\\"$n\"\
    \n  lspci -nns \"${d#*/}\"\ndone;\n```\n\n```\n\nPCI hardware can only be passed\
