  md: "Ransomware that phones home to some central server could use symmetric encryption\
    \ to perform its sordid garbling. A random key and a unique identifier could be\
    \ generated on the target machine and both of these numbers sent and then stored\
    \ on to command and control (C2) server. All traces of the key would be removed\
    \ from the victim's machine once files had been duly scrambled, and the unsuspecting\
    \ victim would then send the requested ransom, together with their unique identifier\
    \ to the extortionist.\n\n Said extortionist, if they had any shred of decency,\
    \ would then provide the decryption key and life would go on. This all relies\
    \ on some degree of centralisation: somewhere out there a list of keys and tokens\
    \ needs to be stored. For large-scale attacks this isn’t ideal – often, multiple\
    \ command and control servers are used for redundancy – and it makes more sense\
    \ to somehow store those keys locally. Without public-key encryption this turns\
    \ into a Catch-22 cascade of futility. You can encrypt the key and store it locally,\
    \ but then where do you store the key used to encrypt that key?\n\nInstead, an\
    \ attacker can use a hybrid scheme whereby the symmetric key (or keys) used to\
    \ scramble all the files is stored on the victim’s machine, but encrypted asymmetrically.\
    \ The simplest implementation of this type of scheme would require our attacker\
    \ to only look after a single private key, while the public key could be stored\
    \ locally – inside the decryption program, for example.\n\nSo in order to recover\
    \ their files, the victim needs to pay the ransom, which releases the attacker’s\
    \ private key, which is combined with the public key and these two keys used to\
    \ decrypt the locally stored symmetric key. Simple, right? Whoever said these\
    \ people don’t work for their money...\n\n# Scum, vile scum\n\nActually, they\
    \ don’t. Ransomware and command and control servers can be readily bought/rented\
    \ via the darker recesses of the dark web and all this key management business\
    \ can be taken care of with just a few clicks in a friendly interface. Having\
    \ a single private key governing all victims is also not a terribly smart idea.\
    \ It’s straightforward enough to protect it as it’s sent down the wire from the\
    \ C2 server to the victim machine over HTTPS or SSH, but a suitably meticulous\
    \ researcher would, given enough time and a retainer, be able to extract it from\
    \ memory during the decryption phase. In this way, paying the ransom once (or\
    \ maybe a few times) could provide decryption capability for everyone. Which is\
    \ not really what malware authors want and why more advanced key distribution\
    \ is generally used.\n\nThere have been a number of high-profile cases where ransom\
    \ has been paid and data has been liberated. For example, in 2016 a hospital in\
    \ Los Angeles coughed up 40 Bitcoins ($17000 at the time) after being infected\
    \ with the Locky ransomware. In life or death situations like this, it’s easy\
    \ to see why paying the ransom is a reasonable option. The sum of money involved\
    \ may well be less than the daily cost of working around a crippled network.\n\
    \nEven if the crooks don’t provide a decryption key, the ransom payment may be\
    \ dwarfed by these costs, so from an accounting (but not awfully principled) point\n\
    \nof view the victims aren’t that much worse off. Hospitals, and indeed all reputable\
    \ organisations, ought to have a watertight backup regime in place, but restoring\
    \ a whole network under considerable pressure is a complicated business. Consider\
    \ how long it would take you to restore your machine’s software stack, configuration\
    \ and data after it was wiped, then multiply this number by at least several hundred.\
    \ Locky evolved\n\n# HOW TO BLACKMAIL PEOPLE\n“Ransomware that phones home to\
    \ some central server could use symmetric encryption to perform its sordid garbling.”\n\
    \nover 2016 to become one of the (then) most-detected pieces of malware in the\
    \ wild, eventually being localised in 30 different languages and no longer requiring\
    \ C2 infrastructure – which, if it’s located in a friendly jurisdiction, is easy\
    \ enough for authorities to shut down once an outbreak becomes prevalent enough.\n\
    \nSome malware is selective about what it encrypts; it may just encrypt documents\
    \ (based on file extensions) and leave the rest of the OS intact. Doing this means\
    \ it only requires user permissions to run. If you’re lucky this means it’s easy\
    \ to clean up, at least once the source of the infection is tracked down and so\
    \ long as backups were taken. Of course, people have come up with ingenious ways\
    \ of hiding scripts and getting these infections to resurrect themselves. There’s\
    \ nothing more frustrating than thinking you’ve recovered everything to the pre-outbreak\
    \ state only to have it all come undone.\n\n‘Fileless malware’ is becoming the\
    \ new norm. This often travels by poisoned documents (PDFs in particular) which\
    \ contain some script or code to fetch hostile code from the internet and inject\
    \ it directly into memory. This makes it terribly tricky to detect.\n\n![](img/7a0a282248f9658f0c87e55744c797b6_64_0.png)\n\
    \nGwarn, put a bullet in our optical drive – we have backups and other PCs y know."
