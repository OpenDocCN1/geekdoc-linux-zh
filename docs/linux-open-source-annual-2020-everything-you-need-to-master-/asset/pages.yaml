  md: '# # Deploying and management


    # Are the servers easy to set up and use?


    **W**eb servers will be installed via the command line. Some installations are
    very simple one-liners that use `apt-get install` while others need to be installed
    from source using a few extra commands. Once installed, the servers can be used
    to quickly display a default web page. Since we will test our servers with the
    server-side language PHP and mySQL, we will see how easily they can be used with
    each server. Looking into details, we will see which software works easiest with
    basic commands or with the aid of very basic text editing to config files. On
    top of that, we will look at configuring each server so that it runs more efficiently
    and helps us get the results we need: a fast-loading website that won’t leave
    potential viewers so frustrated that they abort the site rather than wait for
    a page to load. In order to reach this goal, we use the Apache Benchmarking tool
    to calculate our requests-per-second rate for our web files. This tool can make
    thousands of requests and simulate concurrent users.


    # ## Apache 10/10


    During the apache2 installation, we can install mysql-server, PHP, libapache2-mod-php
    and php-mysql. After this, we can simply write PHP scripts that just work or build
    a full web app using popular tools such as WordPress, Laravel, or Magento. Apache’s
    ease of installation and performance for testing purposes makes it a great choice
    for building and testing web applications before they are uploaded and moved to
    the Internet on some sort of hosting platform: whether that be shared hosting,
    VPS or dedicated hosting. Since many web hosts still use Apache, it makes for
    a consistent, solid, uniform testing system. However, when using Apache, tuning
    can be very important since it can be slow if we don’t make the best of it. To
    make testing basic, we have a few tools such as the browser inspector and the
    Apache Benchmark tool to help reach our speed goals.


    ![](img/7a0a282248f9658f0c87e55744c797b6_127_0.png)


    # ## Nginx 9/10


    During Nginx installation, we can also install php-fpm in order to be able to
    build PHP apps and test them. However, there is a lot more to it than that. In
    order to be able to open PHP files in our web browser, we also need to edit the
    file /etc/nginx/sites-available/default and un-comment the stanza that set up
    and location ~ \.phps { . After we remove the comments that are blocking the PHP
    code from running, we can reload Nginx and PHP works just fine. Now, we can run
    and test any PHP applications whether they are custom scripts, WordPress, Magento,
    Joomla, Drupal or many others from such a long list. Now, Nginx performs exceptionally
    well, which is one of the main reasons its popularity has increased over recent
    years. And since Nginx is so easy to set up and run, it is a wonderful option
    for third- party web hosting.


    ![](img/7a0a282248f9658f0c87e55744c797b6_127_1.png)


    # # Speed and performance


    # Benchmarking the requests per second.


    **F**or our performance tests, we used the browser and the Apache Benchmarking
    tool. The browser tests were quite simple, we right-clicked on our page, selected
    ‘Network’, refreshed the page and clicked the line which showed our URL. Once
    we clicked the line, we had access to the request and response headers. The headers
    enabled us to see some performance stuff such as the server itself (that is, Nginx,
    Apache or Lighttpd), Keep-alive, gzip and cache control. As far as the Apache
    HTTP Benchmarking tool goes, we used it to test retrieving an image 25,000 times,
    since this is a good way to gauge a rough of idea of the requests per second that
    each server was capable of. To put each through their paces with set them running
    to fetch over 25,000 requests of a 200Kb JPEG file with 50 concurrent users (users).
    The top two servers – both were within the eight-second range – were Nginx and
    Lighttpd (aka Lighty). Coming in after this bracket, we see Openlightspeed appearing
    at around 14 seconds, Apache at 19 seconds and, finally, Tomcat just coming in


    at a touch over 20 seconds. Looking into the requests-per-second details, we see
    Nginx manages around 3,011 with Lighttpd just behind with 2,890. The rest clump
    together somewhat further back with Openlightspeed at 1,776, Apache at 1,314 and
    Tomcat at 1,229. Although these times were quite a spread, the naked eye cannot
    tell which server is being used since the images and pages load quickly enough
    with all platforms. Thus, all tools are good for testing web applications on a
    local machine. When tests were made with an entire URL, like a default WordPress
    installation, results for speed variance amongst the servers were very similar
    for the image requests.


    # ## VERDICT


    | Server | Score |

    | :--- | :--- |

    | APACHE | 7/10 |

    | NGINX | 10/10 |

    | LIGHTTPD | 10/10 |

    | TOMCAT | 7/10 |

    | OPENLIGHTSPEED | 8/10 |


    **Nginx and Lighttpd are just plain faster out of the box.**'
  merge: -1
  img_proc: true
