    containers as required in response to problems or fluctuations in load.


    Kubernetes itself was born out of Google’s GIEEE (“Google’s Infrastructure for
    Everyone Else”) initiative, and was designed to be a friendly version of Borg
    that could be useful outside Google. It was donated to the Linux Foundation in
    2015 through the formation of the Cloud Native Computing Foundation (CNCF).


    Kubernetes provides a system whereby you “declare” your containerised applications
    and services, and it makes sure your applications run according to those declarations.
    If your programs require external resources, such as storage or load balancers,
    Kubernetes can provision those automatically. It can scale your applications up
    or down to keep up with changes in load, and can even scale your whole cluster
    when required. Your program’s components don’t even need to know where they’re
    running; Kubernetes provides internal naming services to applications so that
    they can connect to “wp_mysql” and be automatically connected to the correct resource.


    The end result is a platform that can be used to run your applications on any
    infrastructure, from a single machine through an on-premise rack of systems to
    cloud-based fleets of virtual machines running on any major cloud provider, all
    using the same containers and configuration. Kubernetes is provider-agnostic:
    run it wherever you want.


    # ALIEN BEGINNINGS


    > “The origin of Kubernetes is Borg, an internal Google project that’s used to
    run most of Google’s tools”


    Kubernetes is a powerful tool, and is necessarily complex. Before we get into
    an overview, we need to introduce some terms used within Kubernetes.


    Containers run single applications, as discussed above, and are grouped into pods.
    A pod is a group of closely linked containers that are deployed together on the
    same host and share some resources. The containers within a pod work as a team:
    they’ll perform related functions, such as an application container and a logging
    container with specific settings for the application.


    Four key Kubernetes components are the API Server, the Scheduler, the Controller
    Manager and a distributed configuration database called etcd. The API Server is
    at the heart of Kubernetes, and acts as the primary endpoint for all management
    requests. These may be generated by a variety of sources including other Kubernetes
    components, such as the scheduler, administrators via command-line or web-based
    dashboards, and containerised applications themselves. It validates requests and
    updates data stored in etcd.


    The Scheduler determines which nodes the various pods will run on, taking into
    account constraints such as resource requirements, any hardware or software constraints,
    workload, deadlines and more.


    data storage and more manually. With container orchestration, all of that (and
    much more) is taken care of. We specify the results we require and our container
    orchestration tools fulfil our requirements. We specify what we want done, rather
    than how we want it done.


    # Become a Kubernete


    Kubernetes (ku-ber-net-ez) is the leading container orchestration tool today,
    and it came from Google. If anyone knows how to run huge-scale IT infrastructures,
    Google does. The origin of Kubernetes is Borg, an internal Google project that’s
    still used to run most of Google’s applications including its search engine, Gmail,
    Google Maps and more. Borg was a secret until Google published a paper about it
    in 2015, but the paper made it very apparent that Borg was the principal inspiration
    behind Kubernetes.


    Borg is a system that manages computational resources in Google’s data centres
    and keeps Google’s applications, both production and otherwise, running despite
    hardware failure, resource exhaustion or other issues occurring that might otherwise
    have caused an outage. It does this by carefully monitoring the thousands of nodes
    that make up a Borg “cell” and the containers running on them, and starting or
    stopping


    # » CHECK OUT THESE RESOURCES


    If you’re not familiar with Docker (also see *tutorials* in LXF237) start here:
    https://docs.docker.com/get-started. There’s an interactive, tutorial on deploying
    and scaling an app here: https://kubernetes.io/docs/tutorials/kubernetes-basics.
    And see https://kubernetes.io/docs/setup/scratch for how to build a cluster. You
    can play with a free Kubernetes cluster at https://tryk8s.com. Finally, you can
    pore over a long, technical paper with an excellent overview of Google’s use of
    Borg and how it influenced the design of Kubernetes here: https://storage.googleapis.com/pub-tools-public-publication-data/pdf/43438.pdf.'
