- pgno: 61
  md: '# Do more


    # Backup your files


    They say there are two kinds of people in this world: people who don''t backup
    their files, and people who have never experienced data loss.


    T here''s no shortage of backup tools available for Linux. *Timeshift* is great
    for backing up system files. It''s vaguely analogous to System Restore in Windows
    or Time Machine on macOS and it comes as standard with Linux Mint (which is very
    handy). For backing up personal files we recommend *DéjàDup* ([https://wiki.gnome.org/Apps/DéjàDup](https://wiki.gnome.org/Apps/DéjàDup))
    – it has a simple GUI and can automate everything for you. In its own words "It
    hides the complexity of doing backups the Right Way (encrypted, off-site, and
    regular)". It also comes by default with Ubuntu, so check out our handy six-step
    guide to using it, opposite.


    ![](img/7a0a282248f9658f0c87e55744c797b6_61_0.png)


    Behind the scenes *DéjàDup* uses the *Duplicity* command line tool, so if you
    prefer to do things old-school you can hack up some scripts, *cron jobs* and what
    have you to invoke this directly. All the magic (incremental backups, encryption,
    scheduling) happens in *Duplicity*, so if your command line and scripting mojo
    is strong this might be the option for you. It''s great for server-type things
    where you don''t necessarily have the luxury of a GUI.


    For typical home use your personal files are, we think, much more important than
    the rest of the system. Whatever flavour of Linux you have, if your system gets
    hosed you can re-install it (all the applications in a matter of between minutes
    (Ubuntu) and days (Arch). Fair enough, it might take longer to replicate all the
    little tweaks that you''ve added along the way, and maybe it''ll never end up
    quite the same. Your photos and documents and movies are far more precious though.


    You may, and should, already back up some of these to some kind of cloud storage,
    be it an open source offering like Nextcloud (yay!) or a proprietary one such
    as Dropbox (meh). The trouble with clients like these – ones that automatically
    keep your local files and cloudy files synchronised – is that in the midst of
    a ransomware attack they will happily send scrambled files to the cloud. So instead
    of having an off-site backup you effectively have an off-site rubbish dump.


    This all depends on the nature of the ransomware – perhaps it changes filenames,
    or perhaps the malware interferes with the client and prevents the sync from


    happening, in which case you would be okay. Still, why take the risk? Use a proper
    backup tool, and backup to an external hard drive that isn''t always connected:
    cold storage, if you like.


    # Keeping regular


    Backing-up for the first time might give you some sense of security, and rightly
    so. But backing-up should be a way of life, not a one-off event or even something
    you do on an ad hoc basis. Unless you integrate it into your digital routine then
    you''re risking all your latest and greatest work (or fresh memes). Back up, back
    up, back up. Fortunately, thanks to modern tooling this is easier than ever.


    Of course, life will be much easier if your files are in some kind of ordered
    state, but we can''t all be *Melvil Dewey* (for one thing, *imagine how everyone''s
    address book would look* – Ed.). Your first backup may take a long time, depending
    on how much stuff you have so pop the kettle on. Or you may have to cancel it
    when you realise certain directories should have been included or excluded. But
    once it''s done, you''re happy with it and don''t go messing up your document
    structure too much, subsequent backups will be much easier. Later backups will
    probably be much quicker, since they are done incrementally – only files that
    have changed since the last backup will be stored.


    If you''re using Mint you may prefer to use its own *Backup Tool* which is simple
    to use but doesn''tt have the scheduling and other features of *DéjàDup*. You
    can install it on Mint and other Debian-like systems (you already have it if you''re
    using Ubuntu) with:


    ```

    $ sudo apt install deja-dup

    ```


    Then fire it up and follow this handy guide to securing your precious files.


    We like the KeePassXC logo - and we also like when our readers use it and perform
    regular backups'
