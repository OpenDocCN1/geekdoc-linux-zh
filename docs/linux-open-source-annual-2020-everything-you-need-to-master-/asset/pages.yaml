- pgno: 160
  md: '# # Availability

    ## How to get a program working...


    Sometimes it requires extra efforts to obtain and install a program. You might
    have to visit its web site and find the correct download option. There are no
    such issues with *Gimp* because it’s included with every Linux distribution, but
    we’re working with a supercharged *Gimp* installation, packed with extra plugins.
    GREYC’s Magic for Image Computing might be available in your system’s package
    repositories, but if not you can grab it from *http://gmice.eu*, unpack the archive
    and put the executable file in `~/config/GIMP/2.10/plug-ins`. The FX Foundry pack
    has its own page at *www.gimpfx-foundry.sourceforge.net* and similarly it should
    be unpacked into a neighbouring directory in `~/config/GIMP/2.10/scripts`. Although
    there’s nothing difficult about this requirement, novice users may consider these
    extra actions to be an advanced task.


    *Rawtherapee* and *Darktable* already come with everything bundled inside the
    software packages. Those two programs are rarely included in distributions’ default
    offerings out of the box, but they’re always available in online repositories
    – just check it with your software store or package manager. However, *Darktable*
    scores more in this test because it’s also available in Snapsstore and Flathub,
    while *Rawtherapee* has only an AppImage.


    The way *Lightzone* is distributed is somewhat cumbersome. Due to the proprietary
    legacy, the official project web site still lists outdated information, which
    might confuse some users who want to get the application. However, *Lightzone*
    is based on Java, which means it should be a platform-agnostic application, and
    so it’s often packaged for many Linux distros. Ready-to-use packages exist for
    Ubuntu, Fedora and openSUSE and many others. For Ubuntu-compatible distros you
    can use the PPA at *ppa:lightzone-team/lightzone*.


    ![](img/7a0a282248f9658f0c87e55744c797b6_160_0.png)


    > Pixeluvo includes a functional limitation, which is supposed to motivate users
    to purchase the full version.


    *Pixeluvo* costs money, $34 to be precise. The official web page offers 30-day
    trial downloads, with DEB and RPM packages for Ubuntu and Fedora, respectively.
    Those packages can be used for other RPM- and DEB-based distributions as well,
    or repacked for other flavours of Linux (treat *Pixeluvo* downloads like archives).
    *Pixeluvo* includes a static set of the old Qt4 libraries at `/opt/pixeluvo/libfs64`,
    which you may want to delete in order to force the program to use your system’s
    libraries. We’ll admit that this is a non-intuitive task for many users. Additionally,
    the trial version doesn’t enable saving modified images with sizes larger than
    800x600. We recommend making those tweaks!


    # ## VERDICT


    | | GIMP | LIGHTZONE |

    |---|---|---|

    | DARKTABLE | 10/10 | PIXELUVO |

    | RAWTHERAPEE | 9/10 | 7/10 |


    There are many easy methods of getting hold of and installing Darktable.


    # # Ease of use

    ## How user-friendly is each of our five contenders?


    Previously, *Gimp* was a mess of floating windows that required a lot of manual
    arrangement. Nowadays the program uses the single-window mode by default. Its
    photo-editing features are located in different places under Filters->Enhancement,
    Filters->G’MIC-Qt and a separate top-level menu for FX Foundry. Unless you know
    where your tools are beforehand, it isn’t easy to find them.


    *Darktable* has no such fragmentation. However, you first need to point the application
    to the directory with your images and then select one for editing. By default,
    the editing tools are hidden under the categories on the right side of the screen.
    *Rawtherapee* has the more thoughtful UI design. It’s similar to the one in *Darktable*,
    but you don’t lose the file manager tree on the left when editing an image. Furthermore,
    all the useful tools are already expanded in the right panel. Similar to *Darktable*,
    *Lightzone* suggests switching between browsing and editing modes. When editing,
    each filter or tool is presented like a separate floating panel, which you can
    turn off or on.


    Our remaining program, *Pixeluvo*, also shine in terms of usability. Photo-editing
    capabilities could be found under the


    ![](img/7a0a282248f9658f0c87e55744c797b6_160_1.png)


    Colour and Effect sections of the top menu bar. *Pixeluvo* was designed with simplicity
    in mind, and consequently it was nearly impossible to get lost in its clear and
    simple lists of available tools.


    # ## VERDICT


    | | GIMP | LIGHTZONE |

    |---|---|---|

    | DARKTABLE | 8/10 | PIXELUVO |

    | RAWTHERAPEE | 10/10 | 10/10 |


    Having frequently used tools at hand is the key to winning our usability test.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Fixing colours, shadows and more


    Want to give your photos a natural look?


    W

    may prefer one tool over another purely for subjective reasons, but there are
    some practical tests that expose the real value of each photo-editing program.


    For this Roundup we used a couple of images as test subjects while exploring the
    five programs. One was a scanned historic colour film frame with inadequate lighting,
    film grain and insufficient exposure, while another was an unprocessed RAW shot
    of a night urban scenery with illumination. One image was also underexposed.


    The aim was to try to achieve the best possible results from both shots in each
    of our five programs. We paid special attention to the white balance fixer and
    any available colour adjustment sliders, as well as the shadows, highlights and
    level correction tools.


    In the end, a good program is one that can either fix everything using automatic
    algorithms, or by offering adequate tools for manual work. It goes without saying
    that the only acceptable editing mode is a non-destructive one, where the user
    can always roll back to the original image without losing anything irreversibly.


    # Gimp


    10/10


    When it comes to correcting colours, Gimp shines thanks to its fast GEGL engine.
    We didn''t need any third-party plug-ins for fixing the colours of our test photo.
    The Colour>Levels menu enabled us to fix the white balance (look for three pickers
    for choosing black, grey and white spots), but we also managed to remove that
    distasteful green hue on certain parts of the image by adjusting levels manually
    for green channel only. Using Gimp''s standard features for tuning up levels and
    curves turned out to be easier than in specialised software such as Rawtherapee
    and Digikam. Not that one application is better than another, but Gimp is just
    easier to use for an average user.


    When processing RAW files, Gimp can integrate with UFRaw, Rawtherapee and possibly
    other similar tools. The result depends on how well a user can handle the many
    tools of a RAW processor.


    ![](img/7a0a282248f9658f0c87e55744c797b6_161_0.png)


    # Darktable


    6/10


    Darktable has some advanced tools for working with colours, including a dedicated
    White Balance section. The neutral Color Picker tool sits under the Levels section,
    but it''s not intuitive and takes quite a lot of time to fix white balance. Getting
    this tool to work correctly in Darktable is crucial. We achieved acceptable results
    by adjusting the colour temperature and each of RGB channels separately. We believe
    that Darktable has too many tools, many of which overlap, so the program is more
    likely to help you achieve artistic effects than bring back natural colours.


    The positive side of Darktable was working with RAW files. For example, the application
    offers the original algorithm for exposure compensation, which resulted in a pleasing
    image with less noise and better local contrast. Another Darktable-only tool is
    Velvia, which boosts image saturation for brighter parts of the image only.


    ![](img/7a0a282248f9658f0c87e55744c797b6_161_1.png)


    # Removing image noise


    How good are these programs for eliminating noise and restoring detail?


    T

    he reason why we equipped Gimp with third-party plug-ins is because they grant
    the program advanced tools for combating colour noise and removing grain. The
    Repair category inside the G''MIC interface contains some advanced denoising filters,
    of which the most powerful is perhaps Iain''s Noise Reduction. This filter contains
    a range of configurable options that effectively remove film grain or colour noise
    that has been created by high ISO values.


    We managed to achieve reasonable results simply by combining several filters in
    succession. However, the built-in options for reducing noise and grain in Darktable
    proved to be even more efficient because they managed to preserve details more
    effectively. Darktable has a bilateral denoise feature for high ISO; the non-local
    tool can be used when denoising chrome and luma; there''s a dedicated chromatic
    denoise tool for RAW images; and the universal Equalizer tool can enhance many
    things, including clarity as well and reduce colour noise. Rawtherapee''s denoising
    tools are slightly less effective, but when it comes to processing RAWs with high
    ISO, we think Rawtherapee has the edge because it produces much smoother JPEGs
    compared to those processed by Darktable.


    In contrast to the other programs, Lightzone just has a simple denoise tool with
    only two sliders for colour and grain. Sadly, for some of our test images, that
    denoise filter had little or no effect.


    Finally, the Reduce Noise feature in PixEluvo is only there for the sake of box-checking.
    It works as a primitive median filter and removes noise together with precious
    details. It''s best avoided unless you want to change the nature of your original
    photo.


    # VERDICT


    | GIMP | 8/10 | LIGHTZONE | 5/10 |

    | DARKTABLE | 8/10 | PIXELUVO | 5/10 |

    | RAWTHERAPEE | 10/10 | | |


    Choose Gimp for retouching old photos and go with Rawtherapee for creating perfect
    JPEGs out of your RAW shots.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Rawtherapee 10/10


    We started with our greenish old film and tried to fix its colours in *Rawtherapee*.
    First we rolled out tools under the Colour section, chose the white balance picker
    and quickly made the colours look much more natural. However, we also had to manually
    remove the erroneous green hue of the wooden bar while keeping the rest of the
    image natural. *Rawtherapee* has a rich set of colour correction tools, including
    colour channels and RGB curves for selective colour correction.


    For the second image we switched to the Exposure section, hit the Auto levels
    button and then adjusted colour compression, brightness, contrast and exposure
    sliders to make the picture brighter and more vivid in general without turning
    illuminated parts into glowing spots. It wasn''t too difficult thanks to *Rawtherapee*
    providing all the necessary tools for achieving this.


    ![](img/7a0a282248f9658f0c87e55744c797b6_162_0.png)


    # Lightzone 10/10


    Playing with colour settings in *Lightzone* proved to be relatively easy. The
    application offers its own original way of adjusting colour balance, which was
    a bit unusual but no less efficient in the end.


    Expanding the White Balance section in the Edit mode enabled us to select a neutral
    spot in the image, making colours look more natural. In addition, the Color Balance
    feature provided us with a tool to select a colour range and change its temperature.
    This approach was perhaps the best and the most intuitive for our purposes, when
    we needed to selectively remove certain tints from the image.


    Working with dark night shots led us to the Reelight section, a dedicated tool
    set for repairing underexposed parts of the image.


    Another useful thing was Zonomapper with its luminosity gradient. This tool changes
    the exposure value, whereas Reelight sliders are ideal for shadows and highlights.


    ![](img/7a0a282248f9658f0c87e55744c797b6_162_1.png)


    # Pixeluvo 10/10


    There are plenty of colour-related tools in *Pixeluvo*, including Color Balance,
    Replace Color and Levels sections for working with colour temperature and white
    balance. The neutral colour picker is also there, under the Levels settings. *Pixeluvo*''s
    available tools show a noticeable shift towards creative image processing, such
    as toning, colourising, boosting vibrance and improving local contrast. The number
    of tools is limited, but everything you need is here. It''ll take you a little
    time to learn how to fix images with incorrect colours in *Pixeluvo*, but if you
    decide to buy the software your money will be well spent.


    *Pixeluvo* includes a decent RAW processor with some useful features. There''s
    the Auto-exposure button (worked like a charm for our test image) and a bunch
    of sliders including the useful Recovery option. *Pixeluvo* worked perfectly when
    enhancing RAW image files, too.


    ![](img/7a0a282248f9658f0c87e55744c797b6_162_2.png)


    # Editing tools


    # How about brushes, layers or selection tools?


    | VERDICT | SCORE |

    | :--- | :--- |

    | **GIMP** | **10/10** |

    | **DARKTABLE** | **6/10** |

    | **RAWTHERAPEE** | **1/10** |

    | **LIGHTZONE** | **8/10** |

    | **PIXELUVO** | **9/10** |


    *Rawtherapee* only works with entire images. For editing tools we''d recommend
    choosing either *Gimp* or *Pixeluvo*.'
