- pgno: 88
  md: 'Windows anti-malware programs are characterised by over-the-top GUIs and paranoid
    ''Threat Detected'' klaxons. ClamTk is a graphical interface to ClamAV, but its
    m1cm7 mere reserved in its appearance. It comes in its own package, clamtk, and
    can also be found in the Ubuntu Software Centre. There are also dedicated Linux
    programs, a couple of which deserve a mention here, if only because they''ve been
    around for a long time: rkhunter and chkrootkit. These are command-line tools
    for the detection of rootkits and other nasties.


    ![](img/7a0a282248f9658f0c87e55744c797b6_88_0.png)


    # ### Secure your servers


    Linux servers offer a much more juicy target than Linux desktops, and potentially
    are more useful than taking over a Windows desktop machine too. There are a lot
    of Linux servers on the internet, many of them housing considerable computing
    power and attached to very fat pipes. So they''re ideal targets for cryptomining
    attacks or turning into spam-spewing zombies.


    Such machines may never be turned off and only rarely rebooted, so they''re compromised
    suddenly disappear or changes IP address as home machines are wont to do. Sadly,
    a lot of the Linux servers who have got their grubby paws on the latest weaponised
    proof of concept code.


    System administrators can be socially engineered into giving up passwords or running
    dodgy programs in the same way as home users can (although they should feel ashamed
    when they do), but another avenue is to attack the services running on your servers.
    The open source software that powers popular websites – Apache, Drupal, PHP, MySQL,
    WordPress and pretty much anything else you could care to name – has at some stage
    suffered from some kind of vulnerability. So has other software found commonly
    on Linux boxes; vulnerabilities in OpenSSL and Bash led to more than their fair
    share of sysadmin hair loss when the Heartbleed and Shellshock vulnerabilities
    struck in 2015 and 2014.


    Besides conventional Linux servers, the burgeoning world of the Internet of Things
    offers a new kind of (often) Linux-based target. This situation is in some ways
    apose to hijacking a server. To an attacker, the server is a single, powerful
    machine. However, if an attacker finds a vulnerability in, say, a popular brand
    of home security camera, then they can – through the magic of services like www.shodan.io,
    a search engine for servers and IoT devices – find and take over a sizeable army
    of these (not very powerful) things. Collectively, they might have a considerable
    amount of computing power (Hello Bitcoins! – Ed) or bandwidth which is now at
    the attacker''s disposal.


    This is precisely how the Mirai botnet was able to launch a huge DDoS (Distributed
    Denial of Service) attack against DNS provider Dyn, causing major websites to
    disappear from the internet in 2016. Mirai (see interview LXF244) was able to
    become so large because so many devices run an easy-to-find telnet server with
    well-known, often hard-coded, username and password combinations. The Mirai source
    code is easy to find online, and new variants of it are still appearing


    A verified European Institute for Computer Anti- Virus Research (EICAR) test signature.


    # ## THE THREATS NEVER END


    > “The burgeoning world of the Internet of Things offers a new kind of (often)
    Linux-based target.”


    today, in 2017 one was spotted infecting Huawei routers. In 2018, one, known as
    Satori, even attacked cryptocurrency mining operations through a vulnerability
    in the popular Claymore''s Miner software, interfering with payment addresses
    for nefarious profit.


    If security-conscious people had their way, IoT devices would never ship with
    default credentials, but it seems marketing people got that going. Coming up with
    new credentials before you can use your fancy internet-enabled fridgecam (or whatever),
    it would seem, deemed rather unfriendly. It''s well worth going out of your way
    to change any default passwords on webcams, routers, NAS devices and the like.


    For devices where this things are hard-coded, the device should be firewalled
    so that it''s not accessible from the outside world – or possibly taken back to
    the shop. It''s also worth running a portscan on your network to see what services
    are running on what devices. Our favourite tool for this purpose is Nmap, which
    you can find in all good repos, and which will tell you all about your network
    with something like:


    ```

    ```

    $ sudo nmap 192.168.0.*

    ```


    ```


    Running it as root thinsly allows Nmap to identify devices through MAC descriptors.
    LXF'
