  md: '# # TOP 20 DISTROS


    # ## BUSINESS DISTROS


    +   * **CLEAROS**

    The CentOS-based distribution can roll out all kinds of network services and has
    an intuitive web-based management interface.


    +   * **NETHSERVER**

    Another all-around distribution for all your business server needs. Only its slightly
    less-polished interface lets it down.


    +   * **KOOZALI SME**

    The distro can be used as an effective gateway server and offers advanced features,
    albeit through an unpolished interface.


    +   * **ZENTYAL**

    Its intuitive interface is probably the best in its class, but it offers very
    limited server functions compared to the others.


    +   * **IFFIRE**

    This distro is billed as a firewall server, but its impressive package management
    system can flesh it out to perform several other server functions.


    ```

    # cp /etc/{shadow,passwd,group} ~/archive/

    airoots/etc/

    ```


    Another use of the airootfs filesystem is to set up and launch the graphical environment.
    First find out the service file for the login manager in your current setup with:

    $ ls -l /etc/systemd/system/display-manager.service


    Assuming you''re using GDM, you''ll then have to symlink the file into the new
    filesystem with:

    # ln -s /usr/lib/systemd/system/gdm.service \

    ~/archive/airootfs/etc/systemd/system/

    display-manager.service


    Just like before, to copy over any files that you want within the user''s /home
    directory, you need to place them in the /etc/skel directory. First, create it
    with mkdir ~/archive/airootfs/etc/skel and then copy over the files like cp -R
    -/ config ~/archive/airootfs/etc/skel/.


    To log in automatically as your user instead of the default root user, open the
    ~/archive/

    airootfs/etc/systemd/system/getty@tty1.

    service.d/autologin.conf file in a text editor and modify this line to swap the
    auto-login user:

    ExecStart= -sbin/getty --autologin

    <username> --noclear %I 38400 linux

    Replace <username> with the user that you want to log in as.


    # ### Customise the image


    Inside root''s home folder (~

    ~/archive/airootfs/

    root) there''s a file named customize-root-

    image. sh. Any administrative task that you would normally do after an Arch install
    can be scripted into this file. Remember that the instructions within the file
    have to be written from the perspective of the new environment, which is to say
    that / in the script represents the root of the distro it''s being assembled.
    Open the file in a text editor, find the line that sets /etc/localtime and change
    it to your timezone. For example:

    ln -s /usr/share/zoneinfo/Europe/London

    ~/etc/localtime


    Also make sure that the shell is set to Bash by changing the userrmod line to
    read:

    $ userrmod -s /usr/bin/bash root


    Scroll down and add a line to copy the contents of the /skel directory into your
    user''s home directory as well and set proper ownership permissions with:

    cp -aT /etc/skel /home/<bodhi>

    chown bodhi /home/<bodhi>-R


    In both these commands, remember to replace <bodhi> with the name of your user.


    Finally, scroll down to the end of the file where you''ll notice a bunch of systemctl
    commands. To boot straight into the graphical desktop, change the default target
    from multi-user by editing the line so that it reads:

    systemctl set-default graphical.target

    That''s it. You''re now all set to build the ISO for your custom distro. Enter
    the ~/archive directory and run the following:

    ./build.sh -vv -L LXArch -v0.1 -L LXArch0.1


    to initiate the build process. The -v switch enables the verbose mode, the -N
    switch sets the name of the ISO image, -v sets the version number and -L appends
    a label to the generated ISO image. The process doesn''t usually throw any errors
    but if you get any pacman-related complaints try refreshing its authentication
    keys with pacman-key --refresh-keys.


    The process will take some time depending on the number of packages it has to
    fetch. It''ll create and process everything under the ~/archive/

    work/ directory. When it''s done, the script will rebuild the ISO and calls to
    the build script will fail. You can get around that limitation by deleting the
    ~/archive/ work/ directory.


    Have fun building your own distro, but remember a distro isn''t just for Christmas,
    it''s for life; so you''ll need to support it, forever. Make sure you tell us
    how you got on as well! EX


