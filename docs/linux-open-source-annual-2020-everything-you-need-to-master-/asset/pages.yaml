- pgno: 138
  md: 'Social networks have become an increasingly dominant force in our online lives.
    The major players here – Facebook, Twitter, Instagram, Tumblr and let’s be generous
    and even include Google+ – all have different platform features, but they have
    some key things in common.


    Thing One is that they’re all centralised services with huge userbases, run by
    single companies with commercial interests. Thing Two is that they’re able to
    provide their services for free because they make money from advertising. Thing
    Three is that the reason they can make so much money from advertising is because
    they’re able to supply highly targeted advertising to the highest bidder, because
    they hold a considerable amount of information on their users. None of these are
    particularly encouraging, yet somehow a goodly portion of the Internet-accessing
    world holds accounts on one or more of these services.


    Moving away from a centralised service like Twitter, to something decentralised
    like Mastodon is an empowering process. But it can also be a confusing one. Anyone
    can host a Mastodon instance (we’ll show you how in the coming pages) and lots
    of people do. So there are thousands to choose from.


    # The main Mastodon


    People’s first question, then, is often: “Which is the main instance?” This is
    easy to laugh off and respond to with some sarcastic guidance to the dictionary
    definition of “decentralised”. Confusingly though, there’s a sort of flagship
    instance at https://mastodon.social, where a number of Mastodon celebrities, influencers
    and tech journalists (what now?–Ed) can be found. This instance is administered
    by Mastodon developer Eugen Rochko and periodically is closed to new registrations.


    Even if it’s not though, it’s worth looking at other instances. There’s even a
    hand site (http://instances.social) that will help you find one based on your
    interests, language and tolerance of movie spoiliers. Mastodon instances are communities
    within themselves, vaguely akin to forums of old or subreddit of today. Some are
    close knit and small, while others are large and loosely connected. Some have
    strict codes of conduct, some tolerate things which may upset some people’s sensitivities,
    others are just plain weird.


    Once you’ve signed up to an instance you can view the Local timeline, which are
    all the posts (toots) of everyone on that instance (in chronological order with
    no algorithmic voodoo or re-ordering or promoted postings). For small communities
    this is great; for larger ones this can be like drinking from a fire hose – one
    that serves a variety of potable and non-potable liquids. So, just like on Twitter
    (perversely referred to as the birdsite on Mastodon), you can follow individuals
    on an instance, and then view a Home timeline consisting of those accounts.


    The neat thing about Mastodon is that having an account on a given instance enables
    you to follow accounts on other instances. This is what’s known in the business
    as federation, which as well as sounding fairly Trekkie is all the rage right
    now. It’s also nothing new. Think about how email works: different providers can


    ![](img/7a0a282248f9658f0c87e55744c797b6_138_0.png)


    talk to each other, and even people signed up to a particular provider may enjoy
    some extra closeness (instant delivery, less spam filtering, integrated features
    specific to that provider).


    A collection of federated components is known as a federiverse, so in the context
    of Mastodon this term refers to all the Mastodon instances. Besides an instance’s
    Local timeline, you can view its Federated timeline. This consists of toots from
    all the accounts followed by members of that instance. This is a good way to find
    accounts on other instances to follow. More precisely, short of knowing someone’s
    username, it’s currently the only way to find outsiders to follow. If you do know
    someone’s username, then you can just type it into the search box on any instance
    and follow straight from


    +   Friendica is federated via the pum/p.io protocol and has at least one node
    dedicated entirely to pirates. Yarr.


    # MASTODON AIN’T TWITTER


    We didn’t earlier not being able to search for individuals by name. This is a
    deliberate measure designed to reduce harassment, protect privacy and generally
    make the Mastodon federiverse a more wholesome place than the birdsite (oh, look
    at you all down with the lingo – Ed). In fact, a Mastodon instance is only searchable
    through the use of hashtags, so if you want your toot to be found you’ll need
    to, in the inapt words of UK Home Secretary Amber Rudd, understand the necessary
    hashtags. Mastodon communities may be more or less tolerant of certain kinds of
    speech, but instances hosting (potentially) offensive content can be blocked or
    silenced by other instances.


    Other key differences to Twitter include a 500-character limit on toots, so that
    discussions can be more meaningful, and much more flexibility about who can see
    one’s toots: they can be visible to specific users, all followers, hidden from
    public timelines or public. Furthermore, there’s a distinctly tusk up attitude
    towards advertising. It’s not that corporate peaches are banned outright, but
    the emphasis is very much on each account having a single, real person behind
    it (even bots have their masters). Excepting a Mastodon administrator modifying
    the codebase (which would only affect their instance), there’s no opportunity
    for paid advertising or data mining with Mastodon – it’s designed to be about
    human communication, not making money.'
