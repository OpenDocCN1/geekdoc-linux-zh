- pgno: 167
  md: '# # Image tools


    Check out these nifty options for managing or editing your image collection.


    # » PENCIL 2D


    You can use *Pencil 2D* to create both static and animated drawings. It’s a comprehensive
    program that will help digital designers create professional-grade cartoons and
    animations in multiple layers. The intuitive tool is well complemented by the
    video tutorials on its website. **www.pencil2d.org**


    # » FOTOXX


    A comprehensive image-manipulation program with a rich set of retouch and edit
    functions that go beyond changing brightness, contrast and colour. Like most dedicated
    image editors, *Fotobox* enables you to select an object or area within an image
    using various tools such as freehand outline, follow edges and select matching
    tones. Another unique feature of the tool is that it makes it possible to edit
    the images without using layers. You can also use *Fotobox* to create HDR and
    panoramic images, reduce noise and remove dust spots, create collages, mashups,
    and slideshows with animations. There are also several artistic effects to help
    convert a photo into a line drawing, sketch, painting, embossing, cartoon, dot
    image, or mosaic.


    ![](img/7a0a282248f9658f0c87e55744c797b6_167_0.png)


    > You can use *Fotobox* on resource-strapped machines and the program can be navigated
    entirely with the keyboard.


    On the initial launch, *Fotobox* fires up its quick start guide in the web browser,
    along with a dialog to index your image library. This process can take some time
    depending on the number of images you have in your library. All its features can
    be accessed from the relevant options that are clearly labelled in the left-side
    panel. **https://komrelix.net/fotobox/fotobox.html**


    # » DARKTABLE


    If you work with RAW images, *darktable* will help you create a professional digital
    darkroom to process them. The tool’s interface gives you access to a full gamut
    of image manipulation and editing tools on par with commercial heavyweights from
    the likes of Adobe and Apple. **www.darktable.org**


    # » RAPID PHOTO DOWNLOADER


    This program might seem redundant considering that most photo-management tools
    can import photos themselves. *Rapid Photo Downloader*, however, is designed for
    transferring photos and videos. It offers a lot more functionality that makes
    it a perfect tool for downloading, processing and organising photos and videos.


    The tool gives you control over how it processes and sorts the downloaded photos.
    The program’s default rules automatically transfer the downloaded photos inside
    date-based subfolders.


    You can also define custom rules as per your requirements. For example, you can
    ask the program to sort photos by shoot type, which comes in handy if you shoot
    both RAW and JPEGs. In fact, you can create complex subfolder hierarchy by defining
    naming rules based on Exif values, such as focal length, ISO, and so on. You can
    also specify an external USB storage device as the back-up destination, and the
    program will automatically back up the photos while downloading them from the
    camera. **https://damonlynch.net/rapid**


    # » CONVERSEEN


    *Converseen* is a straightforward frontend to various command-line conversion
    utilities that can convert images to and from over 100 formats, rotate and flip
    them, change their dimensions, and rename them in a fraction of the time it would
    take to perform these tasks manually. **http://converseen.fasterland.net**


    ![](img/7a0a282248f9658f0c87e55744c797b6_167_1.png)


    > Manipulate any number of images within the Action panel.


    # FROGR


    Use this tool to upload content to Flickr and also access its basic upload features
    such as the ability to describe images, set specific licenses and categorise them
    into sets and group pools. **https://mariospr.org/category/tfrog**


    # NOMACS


    This image viewer can display images in all the popular image formats. In addition
    to the usual features it has some surprising ones such as the ability to synchronize
    viewing between multiple network instances. **https://nomacs.org**


    # ENTANGLE


    Use this tool to tether and control your camera from the computer. *Entangle*
    will also help you set up the shot by tweaking the aperture, shutter speed, ISO
    and other settings and then download the image. **https://entangle-photo.org**


    # FLAMESHOT


    You can use *Flameshot* to capture the whole or a specific portion of the screen.
    Additionally, it also provides you with a whole set of drawing tools to add annotations
    to your screenshot. **https://github.com/lupoDharkael/flameshot**


    # LYCHEE


    *Lychee* has a simple user interface, and is a platform for storing and sharing
    photos. You can run it from a SBC like the Raspberry Pi and use it to upload,
    manage and share photos. **https://lychee.electricious.com**'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Audio and Video


    Edit your videos within an inch of their lives, and organise your music.


    # » UMS


    This streaming server will transform your Linux desktop into the ultimate media
    streaming station to broadcast media to other computers, smartphones, tablets,
    gaming consoles and even TVs. *UMS* streams media via the Universal Plug and Play
    (UPnP) protocols to any DLNA-compliant device. You’ll have to roll-out *UMS*,
    although the procedure is fairly simple.


    The first time you launch it, *UMS* takes you through a basic three-step configuration
    wizard. Although you can start streaming without further configuration, UMS does
    include an admin panel that offers customisable options and tips to guide new
    users. It also includes a minimal web interface for streaming your content.


    www.universalmediadisaserver.com


    # » EMBY


    ![](img/7a0a282248f9658f0c87e55744c797b6_168_0.png)


    This is an all-inclusive media server that comes with plenty of features. *Emby*
    is a one-stop shop for accessing and viewing all your media on any device: from
    other computers and mobile platforms to Android TV, Chromecast, Roku, Xbox and
    more. Besides local folders, *Emby* enables you to add network shares, which is
    a great time-saver if you have media on different computers in your network. The
    *Emby* server is available as a pre-packaged binary and its website has installation
    instructions for all popular distros including Arch, CentOS, Fedora and Ubuntu.
    You can right-click items to reveal useful options such as downloading them, adding
    them to playlists and collections, converting them or editing their metadata.
    You can change the stream quality during playback and display full-screen. *Emby*
    also enables you to set up parental controls, and you can block items that have
    a higher rating than the maximum you’ve defined.


    https://emby.media


    ![](img/7a0a282248f9658f0c87e55744c797b6_168_1.png)


    *Emby* can also connect to TV tuner cards and DVR devices to stream and record
    live TV.


    # » MPV


    A resource-conscious video player that also looks good on modern machines. Based
    on *mplayer2*, *MPV* continues the tradition of *CLI* by introducing optimised
    and cleaned-up code with new configuration options and features. It offers a minimal
    user interface that stays out of the way, enabling you to watch your videos in
    peace.


    https://mpv.io


    ![](img/7a0a282248f9658f0c87e55744c797b6_168_2.png)


    # » SHOTCUT


    A fairly advanced video editor. *Shotcut* is one of the few tools that supports
    editing 4K video. The program supports many audio and video formats along with
    a variety of transitions and effects. It has a long list of impressive features
    and a collection of video tutorials to help orient first-time users.


    https://shotcut.org


    # » CURLEW


    Powered by the *ffmpeg* library, *Curlew* is an easy-to-use media converter. It
    has the ability to crop and pad videos and convert only specified portions of
    files. Select from one of its preset settings for various devices and formats
    and you’ll also be able to preview the files before the conversion.


    https://curlew.sourceforge.io


    # AIRSONIC (35)


    Based on the now closed-source project, the *Airsonic* media streamer makes your
    music omnipresent. It does on-the-fly conversion and can stream files in almost
    any format to multiple players simultaneously.


    https://airsonic.github.io


    # TUPITUBE


    A set of tools to encourage kids to create 2D animations. *TupiTube* has an easy-to-use
    interface with just the right number of features and a host of textural and video
    documentation to get started.


    www.maefloresta.com


    # PICARD


    A nifty little tool, *Picard* will get your music collection back into shape.
    The program can sort your music library and fill in missing tags, rename oddly
    named files and identify incomplete albums.


    https://picard.musicbrainz.org


    # TRAVERSO DAW


    A powerful audio recording and editing platform, *Traverso* is a digital audio
    workstation tool that can do everything from creating simple recordings to editing
    multi-track audio.


    https://traverso-daw.org


    # MIXXX


    If you need to play DJ at an event, run through your music library with *mixxx*
    and use its scratchable waveform to loop beats, after the tempo of tracks and
    change their pitch to create your own mix.


    www.mixxx.org'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# # Disk tools


    Keep your hard drive in tip-top shape, recover lost data or delete it safely.


    # **FOG**


    The constant barrage of repetitive tasks such as running checks, troubleshooting
    errors, swapping out dead hard disks, doing fresh installations over and over
    again can sap the energy out of any system admin, irrespective of the size of
    their network. Using FOG you can image and clone machines from the comforts of
    the admin HQ. FOG is a complex piece of software and offers plenty of options,
    with various fields to describe the host images. It can also arrange them into
    groups for easier management. There are also several options to schedule the imaging
    process, FOG can also be used to debug imaged computers, remotely wipe hosts and
    more. The server also handles regular admin tasks such as installing software
    and can even manage printers on the network. The FOG server is scalable and can
    manage large networks spread over multiple locations in the same building or on
    the other side of the planet. One of the most useful features of the FOG server,
    especially for admins of larger networks, is the multicast ability. Using this
    feature you can deploy multiple machines in one go. To supplement it on such large
    networks, you can have multiple FOG installations configured as storage servers
    that help take the load of the main FOG server when imaging computers. [https://fogproject.org](https://fogproject.org)


    # **DUPLICATI**


    An easy-to-use back-up application, *Duplicati* enables you to fine-tune the list
    of locations you want to preserve by either defining filters or toggling one of
    the predefined options to exclude certain types of files. You can manage the tool
    via a browser-based interface. The program breaks down critical tasks into wizards
    and also exposes just the right number of features for the job at hand, while
    advanced options are just a pull-down menu away. Files are encrypted with AES-256
    and you can also use GPG before sending the backups to their destination. *Duplicati*
    also compresses all data before it''s encrypted. It supports Zip and 7Z compression,
    and can skip compression of already compressed files such as MP3 and JPG. [www.duplicati.com](http://www.duplicati.com)


    # **PHOTOREC**


    *Photorec* is a nifty little command-line based tool that can restore accidentally
    deleted files. When you delete a file, the file system just marks it as deleted,
    and makes the space the file occupies available to other files. *PhotoRec* works
    by recovering such files that are missing regular metadata such as a filename.
    Despite its name, the CLI utility can sniff files in various formats. [www.cgsecurity.org/wiki/PhotoRec](http://www.cgsecurity.org/wiki/PhotoRec)


    ![](img/7a0a282248f9658f0c87e55744c797b6_169_0.png)


    Photorec is part of almost every recovery distro and it ships along with TestDisk.


    # **GPARTED**


    One of the best graphical utilities to manage partitions, you can use GParted
    to create, delete, resize, move and copy partitions while preserving the data
    they house. The program works with all kinds of hard disks, SSDs, and RAID devices
    and supports all the filesystem in vogue. [https://gparted.org](https://gparted.org)


    # **SECURE-DELETE**


    The secure-delete package contains various utilities to securely delete files
    and wipe all traces of data in the free space on the disk. There''s *srm* that
    make it impossible to remove any deleted files, *sfill* to wipe all data from
    the free space on the disk, and *swap* to wipe data from the swap partition. [http://srn.sourceforge.net](http://srn.sourceforge.net)


    # **CDEMU**


    The CDEmu tool enables you to mount disc images in various formats including,
    ISO, bin and .nr. The CLI tool also has several graphical front-ends for Gnome
    and KDE desktops. [https://cdemu.sourceforge.io](https://cdemu.sourceforge.io)


    # **DUC**


    If you''re looking to free up some disk space, use *Duc* in the first instance
    to gain a better idea of the files occupying the space. The tool does a better
    job in inspecting your hard disk than the file manager. [https://duc.zew.nl](https://duc.zew.nl)


    # **DDRESCUE**


    Try image a failing drive with *ddrescue* before attempting recovery. The utility
    doesn''t write zeros to bad sectors, and tries to fill in the gaps without wiping
    out the data already rescued. [https://gnu.org/software/ddrescue](https://gnu.org/software/ddrescue)


    # **PYYDF**


    A replacement for *df, pydf* is a Python script that highlights the different
    types of filesystems. It has an large set of configurable parameters and various
    options to control its output. [https://pypi.org/project/pydf](https://pypi.org/project/pydf)


    # **SMARTCTL**


    Bundled as part of the *smartmontools* package, the *smartctl* utility controls
    and monitors the SMART system built into hard disks. Use the tool periodically
    to run self-assessment health checks on the disks. [www.smartmontools.org](http://www.smartmontools.org)'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# File management


    Control your data, where it can be accessed, and archive it, too.


    # ECI E L (45)


    Everything in Linux is a file and the access control list (ACL) helps determine
    the access rights for each file. You can modify the permissions from the command
    line or use the graphical **Eiciel** utility that''s in the official repositories
    of most distros. https://rofi.roger-ferer.org/eiciel


    # NEXTCLOUD


    Online storage services are a convenient option for accessing and sharing your
    data anywhere on the planet. With **Nextcloud** you can roll out a hosted storage
    server that gets you the convenience of an omnipresent storage service without
    shelling out wads of cash and your data to a third party. Installing and rolling
    out Nextcloud is a fairly straightforward and well documented process. It has
    a feature-rich and intuitive web interface that shouldn''t prove to be difficult
    to navigate even for first-time users, which is a feat in itself considering the
    sheer number of features it wraps underneath. The project scales well and can
    be used on a home network as well as an enterprise one. You can use its administration
    section to hook it up with other related network services such as a directory
    server to import users. Sharing files with other users on the network or publicly
    via URLs is simple enough. The server ensures that changes made to shared files
    are synced to all users. It can also access files stored on a variety of cloud
    services such as Amazon, Google and Dropbox. https://nextcloud.com


    ![](img/7a0a282248f9658f0c87e55744c797b6_170_0.png)


    Nextcloud has an extensive plugins framework that enable you to use it for many
    deployments.


    # FSLINT


    You can use the graphical **FSLint** tool for a comprehensive cleanup of your
    file system. It can remove duplicate files, temporary files as well as files that
    are otherwise difficult to locate and remove, such as files with invalid names,
    empty directories and bad IDs. www.pixelbeat.org/fslint


    # OPEN MEDIA VAULT


    If you need more protection for your data than a simple back-up solution, then
    you need to convert an unused computer (or even a Raspberry Pi) into a dedicated
    network attached storage (NAS) device with the Debian-based *Open Media Vault*
    (OMV) server. *OMV* is straightforward to roll out and simple to manage, thanks
    to its well-designed browser-based user interface, which makes it suitable for
    even non-technical users. It supports all the popular deployment mechanisms, including
    several levels of software RAID, and you can access the data it holds using all
    the popular network protocols such as SSH, SMB/CIFS, FTP and Rsync. The server
    also has an extensive permissions systems to control access to the shared volumes
    and folders. The server is modular and can be extended with a variety of official
    and third-party plugins. For instance you can turn your NAS into a torrent client
    to download data directly into the NAS storage or use it to stream stored music
    across the network. www.openmediavault.org


    # SYNCTHING


    The open source alternative to the popular but proprietary *BitTorrent Sync*,
    **Syncthing** can sync your files between computers over your LAN or across the
    web. The service uses a global discovery server to connect clients anywhere on
    the Internet. https://syncthing.net


    ![](img/7a0a282248f9658f0c87e55744c797b6_170_1.png)


    Use Syncthing''s browser-based interface to add shared folders and all of your
    various devices.


    # CATFISH


    A graphical alternative to the find and locate CLI utilities. **Catfish** is a
    versatile tool that has various options to help you prune the search results and
    find the file you were looking for. www.twooastst.de/index.php/catfish


    # PEAZIP


    The graphical compression utility can read most archiving formats and boasts of
    some useful data security features such as the ability to create archives with
    encryption and two-factor authentication. www.pezip.org


    # EXIFTOOL


    A CLI utility for working with metadata in images, **exiftool** helps you manipulate
    the files based on their metadata. Users can also use it to strip all metadata
    before sharing images online. www.snog.quenu.ca/~phil/exiftool/


    # TKDIFF


    A graphical front-end to the **diff** utility, you can use **TkDiff** to compare
    two files. The tool can connect with a range of source code management systems
    and has several other features. https://tkdiff.sourceforge.io


    # RANGER


    **Ranger** has a curses-based interface that works inside the console. The tool
    supports *Vi* keybindings, makes use of the rifle file launcher and is able to
    preview images and videos. https://github.com/ranger/ranger'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# FOSS


    # Communication


    Chat securely or set up your own social network. In your face, Facebook!


    # » JITSI


    An all-in-one instant messaging app, Jitsi has an impressive set of audio and
    video-conferencing features. As a VoIP client, it enables you to make calls using
    the Session Initiation Protocol (SIP). It has all the features you''d expected
    from a softphone in that it can mute, put on hold, transfer and record calls.
    It can also make registrar-less SIP calls to other Jitsi users on the local network.


    You can use Jitsi to make video calls to one user or to several on both SIP and
    XMPP networks, while using Jitsi Videobridge, you can host multi-user video calls.
    It''s also a capable IM client with several unique features including the ability
    to stream and share the desktop of users at both ends of the call at the same
    time.

    https://jitsi.org


    # » ROCKET.CHAT


    Billing itself as the ''ultimate chat platform'', Rocket.Chat is filled with useful
    features. In addition to essentials ones like threaded conversations and the ability
    to edit and delete messages, the collaborative communications server offers several
    interesting ones such as live chat, with which you can use Rocket.Chat to have
    conversations with visitors to your website.


    You can roll out Rocket.Chat on a snap-supported distro with a single command,
    and it also support deployments over Docker and a wide range of PaaS services.
    It can also import your data from another service like Slack or Hipchat and with
    the SlackBridge plug-in can also mirrors messages received in a Slack channel
    or private group into Rocket.Chat in real-time.


    Rocket.Chat also enables you to have a video conference with your team. You can
    also record and send voice messages to a public or a private conversation.

    https://rocket.chat/community


    # » TOX


    If regular IM clients aren''t secure enough for you, use the Tox IM protocol which
    encrypts all chats with the NaCl encryption library and instead of a central server,
    routes them over direct P2P connections between users. The IM uses Tox IDs, which
    are public keys of peers instead of a user account and also allow for greater
    anonymity.

    https://tox.chat


    ![](img/7a0a282248f9658f0c87e55744c797b6_171_0.png)


    There are several apps that can communicate using the Tox protocol and one of
    the most popular ones is Gtox, which works on several platforms.


    ![](img/7a0a282248f9658f0c87e55744c797b6_171_1.png)


    Rocket.Chat enables you to preview links shared during a conversation including
    those from popular services like Twitter and Youtube.


    # » BEEBEEP


    An IM client with a difference, BeeBEEP is designed to connect you directly with
    peers on your network. It''ll automatically detect other BeeBEEP users on the
    network and provides all the features of a modern chat client and apart from encrypted
    text messages, can also share files.

    http://beebep.sourceforge.net


    # » OPENFIRE


    There are several XMPP-based IM servers available but Openfire is one of the easiest
    to manage. It implements many of the commonly used functions of the XMPP protocol.
    While you can use any XMPP-compatible IM client to chat through Openfire, it works
    best with its own Spark client. www.igniterealtime.org/projects/openfire


    # SIGNAL


    The Signal messaging app helps secure communications over the mobile network.
    The app is endorsed by top security experts and uses end-to-end encryption to
    secure all your text, audio and video calls.

    https://signal.org


    # RIOT.IM


    The Matrix protocol enables users registered with one service provider to seamlessly
    communicate with users of another. Riot.im is one of the best clients based on
    the federated Matrix protocol.

    https://about.riot.im


    # RETROSHARE


    A P2P communications and file sharing platform, RetroShare creates encrypted connections
    between friends. You can add friends by sharing your keys privately or you can
    exchange them via a chat server.

    http://retroshare.net


    # SOGO


    One of the best alternatives to MS Exchange, SOGO has all the necessary groupware
    functions with native desktop and mobile clients. Try the online demo before deploying
    it on your server.

    https://sogo.nu


    # HUMHUB


    With HumHub you can deploy your own social network on the internet network. It
    has all the standard social networking features that I expect and the project''s
    website hosts an online demo as well.

    www.humhub.org'
