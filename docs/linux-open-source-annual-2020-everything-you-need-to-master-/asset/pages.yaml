  md: '# Social engineering


    Convincing people to do things not in their interests has become quite the artform,
    so don''t be fooled. Click here for puppies...


    T here are all kinds of devious ways that unscrupulous scammers will use to get
    hold of unsuspecting marks'' data – whether it''s tricking them to install ransomware
    or some other kind of malware such as a keylogger, or having them visit a booby-trapped
    website and enter valuable credentials. Most people nowadays know better than
    to reply to an email purporting to come from a Nigerian prince who needs some
    help organising a wire transfer for his considerable inheritance. Indeed, most
    scammers no longer bother with these kinds of ruses; their game has been considerably
    upped. They may play on local events, especially natural disasters. They may also
    send targeted email based on public information harvested from the target''s social
    media accounts. For this reason you should be awfully careful about what information
    your broadcast publicly about yourself. Knowing your interests, location or even
    those of your friends is enough to gain a data-mining foothold. WannaCry and others
    like it exploited an unpatched vulnerability in Windows to spread, but this is
    comparatively rare. Most ransomware, and indeed most unauthorised access to computers,
    is installed by unwitting users being schemed and duped. Fraudsters will send
    email from domains that at a glance look legitimate – say, linux4ORMAT.com – or
    direct you to counterfeit websites at such domains.


    ![](img/7a0a282248f9658f0c87e55744c797b6_65_0.png)


    It''s incredibly easy to cosmetically clone an entire website with open source
    spidering tools which have legitimate uses. Widgets and search facilities are
    harder to reproduce, but if you can dupe victims into thinking the site is real
    long enough for them to enter their username and password then you''ve already
    won. People tend to drop their guard considerably if they feel they are communicating
    with a friend, so contact lists from plundered email clients are valuable too.
    Social media accounts can become like gold for scammers. We''d rather you didn''t
    use Facebook and such, but if you do, it offers a few ways you can secure your
    account. In particular, you can nominate a person or persons that you trust so
    that, in the event you get hacked, they will be able to trigger a password reset
    for you. You''ll find these and other options in the Security and Login section
    of Facebook''s settings. You may have already witnessed hijacked accounts sending
    messages of the form “Help, I''m trapped in Timbuktu. Please send money” which
    are easy enough to sniff out. But with a little imagination and a little knowledge
    about the victim – and if you have access to their social media you''ll have plenty
    at your disposal – a much more convincing con can be crafted. Human beings aren''t
    really designed to remember passwords or indeed come up with secure ones, so it
    should come as no surprise that password-reset mechanisms or forgeries thereof
    are popular means for hijacking accounts. If you search your email address on
    Troy Hunt''s https://haveibeenpwned.com website, you may well find it has appeared
    on one of the many lists of breached credentials that are now forever in the public
    domain. This doesn''t mean that email address is compromised, just that an account
    associated with it has been published – possibly something insignificant and maybe
    even something that has since been secured. For obvious reasons, the actual credentials
    aren''t listed, so you can''t check their validity. But doing a thorough password
    audit is never a bad idea. If a password you used on a forum 12 years ago that''s
    similar to any you use today is in any way traced to a different account, that
    account is at risk. It''s a painful process, going through all the places where
    you may have signed up, resetting passwords or cancelling accounts as appropriate.
    But it might just save you identity, or prevent your contacts getting phished,
    or something else beneficial. Rather than trying to remember a bunch of secure
    and different passwords, it''s much more sensible to use a password manager. That
    way you just need to remember a single'
  merge: -1
  img_proc: true
