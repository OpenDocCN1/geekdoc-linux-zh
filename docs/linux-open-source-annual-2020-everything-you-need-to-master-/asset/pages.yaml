- pgno: 152
  md: '# Video editors


    # The Verdict


    With the exception of accidentally overwriting or deleting a file, there''s precious
    little that can go wrong when you test drive a new software, right? While this
    may be true for most benign software, such as text editors and web browsers, it
    certainly isn''t the case with video editors of the like that we featured in this
    Roundup.


    All the tools feature a myriad combination of menu bars, tabs, sidebars and buttons.
    It''d be unfair to these tools for us to declare any one style or appearance as
    superior to the others, because each of these tools boasts of vast user communities,
    which suggests that there are ample number of users that favour their user interface.


    More than anything else, your choice of application will ultimately come down
    to which one offers intuitive workflow, because they''re all well matched in terms
    of what you can achieve with them. Furthermore, your choice is something that
    will vary for every individual. If you''re anything like most other people, you''ll
    begin to work with one tool, and over time as you become immersed into the art
    of film editing, learn to appreciate the different offerings of each tool. It
    wouldn''t surprise us if you even choose to work with multiple tools when working
    on a project. So, for example, you might use one for their transitions and effects,
    and another for manipulation audio.


    If you''re a novice just getting started with video editing, you might find feel
    daunted by the sheer scope of the possibilities. This is why documentation is
    so important, and the biggest reason for deciding on Kdenlive as the winner.


    Flowblade''s documentation wildly conflicts with its current design, which makes
    it unlikely new users will get very far with the tool. Although there''s little
    wrong with the project itself, we can''t recommend it to users for this reason.
    If not for the Quick Introduction Guide, LiVES would suffer a similar fate.


    Openshot and Shotcut fared nearly identical in all the tests. The use of images
    to explain the different effects by the latter is a novel feature, which all the
    other tools should consider adding. We''ve very reluctantly pushed LiVES off the
    podium on account of its lack of official binaries for different distributions.


    ![](img/7a0a282248f9658f0c87e55744c797b6_152_0.png)


    **1st** **Kdenlive** 9/10


    Web: https://kdenlive.org Licence: GPL

    Version: 18.04.1

    Its interface is cluttered, but the rich documentation makes it easy to use.


    **2nd** **Openshot** 8/10


    Web: www.openshot.org Licence: GPLv3+

    Version: 2.4.2

    Designed especially for animations, but works just as well for regular videos.


    **3rd** **Shotcut** 7/10


    Web: https://shotcut.org Licence: GPLv3

    Version: 18.09

    Doesn''t take long to start producing sharp content.


    **4th** **LiVES** 6/10


    Web: http://lives-video.com Licence: GPLv3+

    Version: 2.10

    Feature-rich but far slower than the others.


    **5th** **Flowblade** 5/10


    Web: https://jliljebl.github.io/flowblade Licence: GPLv3+

    Version: 1.16

    Only for users who are already familiar with video editing.


    # ALSO_CONSIDER


    A quick look at the Wikipedia page for video editors will reveal close to a dozen
    active open source applications. Couple this with all the freezane offerings and
    you get a sizeable number of alternatives to choose from.


    Cinelerra is a professional-grade editor that''s complex for absolute beginners.
    Avideumx is fairly straightforward to use, but only provides basic functionality.
    It''s also not as actively developed as the tools featured in this Roundup.


    While we''ve focused on the more established applications in this Roundup, Natron
    is a viable alternative. First released in 2014, its interface is influenced by
    commercial professional-grade software such as BlackMagic Fusion and Nuke.


    Although it hasn''t seen a new release since 2016, Ptitvi is another alternative.
    Available as a Flatpak package, the application was once tightly integrated into
    GNOME desktop, but now works flawlessly with all desktops.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Roundup

    Google Drawings» Gravit Designer »

    Inkscape » LibreOffice Draw » Vectr


    ![](img/7a0a282248f9658f0c87e55744c797b6_153_0.png)


    **Mike Bedford**

    is always on

    the lookout for

    ways to do

    things differently.


    # Vector graphics


    Vector-based drawing software is ideal for creating technical and business diagrams
    and illustrations. **Mike Bedford** put five packages to the test.


    # HOW WE TESTED...


    The most obvious differentiator between vector drawing packages are their more
    advanced graphics features, so it could be argued that any testing strategy should
    concentrate on these. However, a significant majority of users have little need
    for many of the more esoteric features; what they really need are just the basic
    tools for creating illustrations and diagrams for technical, scientific or business
    applications. This, therefore, has been our emphasis.


    That doesn''t mean, however, that all software is equal. While the basic drawing
    tools might be largely similar, products differ significantly in areas related
    to productivity, so our testing has also considered this aspect. This goes far
    beyond the design of the user interface. Included under the heading of ease-of-use,
    for example, is the availability of tutorials and good user documentation, while
    in a team scenario, features that simplify collaboration and sharing of illustrations
    are vital. We''ve also looked at licensing.


    ![](img/7a0a282248f9658f0c87e55744c797b6_153_1.png)


    S o-called paint packages are the most commonly used type of graphic editing software.
    But while they''re perfect for touching up photos, they''re far from ideal for
    creating diagrams and illustrations. A much better solution is to use a drawing
    package, otherwise known as vector-based graphics software, which works at the
    level of picture elements such as lines, circles, boxes and text. The waters have
    been muddied by some paint software appearing to offer similar functionality,
    but if you want full control over the drawing process, there''s no better option
    than vector-based software.

    This type of software can be used by graphics artists, but our assumption here
    is that most LXF readers will have more down-to-earth applications, for which
    vector-based software is ideal. Perhaps you''re a scientist or engineer with a
    need to create 2D technical drawings or diagrams. Maybe you need to produce flow
    diagrams. Or conceivably you have a business application such as creating a company
    logo or drafting an organisational diagram. For all this and more, there''s something
    to meet your needs.'
