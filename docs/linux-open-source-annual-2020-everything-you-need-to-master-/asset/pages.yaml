    for installing DEB files – ideal for those who are command-line adverse.


    From the Activities view find the Pop!_Shop launcher either by typing it or selecting
    the Pop Applications button on the dock to the right. Pousing for a second to
    admire the bold icon design. You could say that Pop!_OS’s initial app offering
    is quite sparse, but the idea is that you add only what you need to it. Not everyone
    wants Visual Studio Code or Slack, but if you don’t they’re very easy to find
    in the Pop!_Shop.


    Today’s application picks are brought to you by the letter G: Goxel – making voxel
    art is surprisingly calming; Gnome Twitch – for watching Gaming On Linux videos;
    and GIMP, which is still the best way to manipulate images.


    # CHOOSE YOUR OWN ADVENTURE


    > “Pop!_OS’s initial app offering is quite sparse, but the idea is that you add
    only what you need to it.”


    Naturally, command-line installation with apt is possible too, and many packages
    don’t have a Pop!_Shop entry. One thing missing from the Pop install is the OpenVPN
    plug-in for NetworkManager, which if you use a VPN (or envisage doing so in the
    future) you’ll want to remedy with:


    ```

    $ sudo apt install network-manager-openvpn-gnome

    ```


    We hope your Pop install doesn’t break, but if it does help is at hand in the
    form of a recovery partition. This essentially lets you boot to something like
    the Live environment on the DVD, from whence repairs can be carried out. Press
    Shift and Escape while the system is booting and select the recovery environment
    from the menu. If that doesn’t work you can perform a Refresh


    Install, which resets all system configuration and applications, but retains your
    user information and documents, much like the equivalent Windows utility.


    Speaking of booting the system, Pop is pretty much unique among major distros
    in that it uses System-boot – formerly GrubMint – to boot the system on UEFI installs.
    This means that for once we can say you won’t run into any horrible GRUB problems
    on this distro, unless you use classic-BIOS booting. You shouldn’t run into any
    systemd-boot troubles either, by the way, as System76 test all kinds of weird
    and wonderful configurations on its hardware.


    The included video player is fine, but you may prefer to install MPV, which handles
    its own codecs. Once installed it also takes advantage of whatever hardware acceleration
    is on offer (VDPAU, VA-API or some unholy combination of the t’wain is configured
    out of the box) to decode video without bothering your CPU.


    The Pop!_OS team has done a great job of preparing documentation too. There’s
    a growing list of guides to common tasks at https://support.system76.com/ articles.
    For example, all the abstract references to terminal commands throughout this
    magazine make no sense to you, find out more in the Terminal Basics article there.


    The team are enthusiastic about getting more people involved with development,
    too. They even mark out specific bugs in their project as being ‘bitesize’, suitable
    for aspiring coders to put their teeth into. We have to credit them for this,
    as the growing divide between users and developers will only be lessened if more
    people get involved, and such outreach efforts are a fine way to encourage that
    kind of involvement.


    We also must credit System76 for its excellent open hardware efforts. Besides
    contributing to open firmware causes, its flagship Thelio machine includes a custom
    daughterboard for managing airflow. The specs for this are completely open, and
    System76 hopes to develop more hardware that follows this mode. We’re definitely
    excited to see more. LXF


