- pgno: 135
  md: '# ## Network use


    # Are these tools good for only imaging local disks and partitions?


    Y ou can use **Clonezilla** for multicast cloning via two available options. **Clonezilla
    Server Edition** requires setting up a Diskless Remote Boot in Linux (DRBL) server
    to broadcast images across the network. On a smaller network, you can use the
    **Clonezilla Lite Server** mode on the bootable CD to set up a temporary server.


    You use **Clonezilla** to save the cloned image of a disk or individual partitions
    on the network. For this it can establish a connection to the remote machine via
    SSH, or through an SMB, NFS or WebDAV server.


    Similarly, in addition to creating and restoring local images, **G4L** also has
    impressive network capabilities. You can use it to backup/restore and image to/from
    a remote machine on the network via various mechanisms, including FTP and UDPcast.
    To use the latter, configure the Live environment to set up one machine as a multicast
    server, which then broadcasts images stored locally or elsewhere on the network.


    Unlike the other tools on test here, **FOG Project** is built from the ground
    up to work over the network. It works best when it doubles up as the DHCP and
    PXE server. All of FOG Project’s imaging tasks, including capturing and deployment,
    are handled remotely over the network. Unlike the other solutions it forces the
    use of a lot


    ![](img/7a0a282248f9658f0c87e55744c797b6_135_0.png)


    > You can use the G4L Live CD to turn remote computers into receivers that’ll
    pull the broadcasted images and restore them over the network.


    more network services such as DHCP and PXE servers, which are optional with the
    other tools. By contrast, neither **Deepin Clone** nor **WereSync** offer any
    network awareness of their own. With **Deepin Clone**, though, you could obviously
    mount a remote computer in the local filesystem and point to it as the destination
    for saving the image of a local disk/partition.


    # VERDICT


    | | **CLONEZILLA** | | **G4L** |

    |---|---|---|---|

    | | 8/10 | | 8/10 |

    | **DEEPIN CLONE** | 5/10 | **WERESYNC** | 1/10 |

    | **FOG PROJECT** | 9/10 | | |


    FOG Project is designed from the ground up to reside on the network, while Clonezilla
    and G4L can be used to work across the network as well.


    # ## Deploying images


    # Putting the cloned images to use.


    W e wouldn’t fault you for thinking that the process for restoration would be
    the reverse of the imaging process for each of the tools. But **Deepin Clone**
    and **WereSync** will surprise you in this respect.


    **Clonezilla** has a very straightforward process for restoring a partition or
    an entire disk from a cloned image. You begin by first selecting the repository
    that houses the cloned images. Next, Clonezilla displays a list of all the unmounted
    partitions to which you can restore the image.


    After you’ve made your selection, **Clonezilla** wipes the partition and creates
    a new partition table on the disk, so be careful with this. Also keep in mind
    that the destination partition needs to be equal to or larger than the source,
    as it can’t restore an image to smaller disks.


    When restoring with **G4L**, you must point the tool to the saved image, followed
    by the location of the disk or partitions where you want to restore the image.
    During our tests, while G4L certainly began restoring a cloned image from a larger
    disk to a smaller one, the process never completed successfully. On the other
    hand, attempts at restoring images of a smaller disk to a larger one went more
    smoothly.


    With **FOG Project**, you first need to register the target machine with the server
    and then associate a cloned image with it. To do the actual rollout, you’ll have
    to create a deploy image task before the image is rolled over to the machine via
    PXE. The same process works irrespective of whether you wish to deploy to a single
    computer or multiple ones.


    ![](img/7a0a282248f9658f0c87e55744c797b6_135_1.png)


    > All tools can perfectly restore a smaller image to a larger disk, but only WereSync
    promises to restore a larger image to a smaller disk.


    To restore an image with **Deepin Clone**, all you have to do is point the app
    to the image file along with the disk or partition you want to restore it to.
    As with its cloning process, the restoration doesn’t offer any configurable options.


    By default, **WereSync** directly clones a drive to another, so there’s no option
    for restoration. However, you can force the app to image a drive by changing the
    destination to an IMG file. To restore from the image, you’ll have to reverse
    the fields and specify the IMG file as the source.


    # VERDICT


    | | **CLONEZILLA** | | **G4L** |

    |---|---|---|---|

    | | 8/10 | | 8/10 |

    | **DEEPIN CLONE** | 5/10 | **WERESYNC** | 5/10 |

    | **FOG PROJECT** | 9/10 | | |


    They’re all well-matched, with the exception of WereSync and Deepin Clone.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# # Disk cloning tools

    ## The Verdict


    With their varied ways of working, you can find a situation that’s best suited
    to each one of the tools featured here. For instance, Deepin Clone is an ideal
    intuitive solution for home users, which just works. But while the app is available
    for non-Deepin distros such as Arch, we don’t feel comfortable using it in any
    other distro.


    WereSync is based on the venerable rsync utility and is the only one that can
    clone a larger disk to a smaller one. It didn’t make the podium on account of
    its direct disk-to-disk cloning mechanism, which we dislike. Coupled with its
    limited directory and sparse documentation, the program manages to reach the fourth
    spot at best.


    While advanced users will probably have no issues working through G4L’s interface,
    first-time users will surely feel inundated by all the options at their disposal.
    Critical administrative software, such as disk cloning tools, require a certain
    degree of comforting familiarity, and new users will take quite some time to get
    there with G4L.


    All things considered, Clonezilla and FOG Project are the only viable options
    that also scale well. We can easily recommend them to individual users for use
    on their home network, as well as to admins of larger networks.


    While both do similar tasks, they go about it very differently. The most visible
    differences between the two solutions are their user interfaces and the fact that
    Clonezilla runs from a Live CD, while FOG Project requires setting up a server.
    FOG Project is also more comprehensive in that it can perform several tasks in
    addition to imaging, such as installing apps remotely in Windows installation
    via a feature called snap-ins.


    If your machines aren’t on a network, you’ll have no option but to use Clonezilla.
    Both solutions are on an equal footing in a networked environment, but Clonezilla’s
    network options make the most sense in an environment like a library, where the
    remote clients don’t require much administration once they’ve been imaged. If
    you need to look after machines once they’ve been cloned, there’s no better solution
    than FOG Project, as its post-imaging options are excellent.


    ![](img/7a0a282248f9658f0c87e55744c797b6_136_0.png)


    +   **1st FOG Project 9/10**

    *Web:* https://fogproject.org *Licence:* GPL v3

    *Version:* 1.5.5

    A comprehensive imaging solution that works across networks of all sizes.


    +   **2nd Clonezilla 8/10**

    *Web:* http://clonezilla.org *Licence:* GPL v2

    *Version:* 2.6.0-37

    A feature-rich tool that works with all the usual cloning use-cases.


    +   **3rd G4L 8/10**

    *Web:* https://sourceforge.net/projects/g4l *Licence:* GPL v2

    *Version:* 0.55

    Similar to Clonezilla, but loses out because of its cumbersome UI.


    +   **4th Deepin Clone 5/10**

    *Web:* www.deepin.org/en/original/deepin-clone

    *Licence:* GPL v3 *Version:* 1.1.0

    Works as advertised but currently only caters to users of the Deepin distro.


    +   **5th WereSync 4/10**

    *Web:* https://github.com/DonyorM/WereSync

    *Licence:* Apache License 2.0 *Version:* 1.0

    Can clone disks, but its design and backend restricts its use cases.


    # ## ALSO CONSIDER


    Two of the tools featured in LXF in the past, but not included this time around
    due to them not showing any signs of life, are Redo Backup & Recovery and Mondo
    Rescue. The former is by far the easiest bare-metal cloning option we’ve run into.
    Its downside, however, is that it takes away a lot of the control over the cloning
    process in lieu of convenience.


    The only real alternatives for cloning disks besides the ones we’ve already covered
    in the Roundup are the command-line ones that do the grunt work in the background.
    The two that are really worth mentioning are Partclone and FSArchiver. They both
    support a large number of filesystem formats and can quickly roll disks and partitions
    into movable archives. The real CLI veterans, however, don’t need anything else
    besides the venerable dd tool, which can be used to effortlessly clone a disk
    or a partition with a single command. You’ll need to know what you’re doing!'
  merge: -1
