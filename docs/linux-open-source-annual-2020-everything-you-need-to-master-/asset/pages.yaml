- pgno: 24
  md: 'Wayland has been in the works for ages. It was dreamed up in 2008 when developer
    Kristian Høgsberg was driving through the New England town of the same name. For
    many desktop users, it would come to sit, alongside systemd and GNOME 3, firmly
    in the box of ''solutions looking for problems.'' After all, we already had X
    – why not modernise and extend that, rather than adopt this thing which a) doesn''t
    work and b) even if it did it doesn''t do everything X.org (the current implementation
    of the X Window System standard set out in 1984) did? But sometimes less is more,
    and let''s see why.


    ![](img/7a0a282248f9658f0c87e55744c797b6_24_0.png)


    > This little cog is your gateway to Wayland, or indeed any other desktops you
    may have installed.


    One of X''s most powerful features was its network transparency. Its client-server
    architecture afforded the machine running the X server – the one connected to
    the monitor and input devices – the luxury of not caring whether X clients (applications)
    were run locally or from another machine. This is a handy feature – you haven''t
    lived it if you''ve never run a graphical application over SSH – and enabled the
    thin client paradigm to flourish in the ''80s and ''90s.


    Wayland, having offered a full Wayland session since 2015. By only slightly tenuous
    extension, the best distro on which to try Wayland is Fedora, having long provided
    a solid, unadulterated GNOME experience. If you really don''t want to use Fedora
    then you can follow along, using GNOME on Ubuntu or any other distribution that
    floats your boat. However, we would strongly recommend that to really get the
    most from the


    Having all your applications installed on a single powerful machine served over
    the network to machines running little more than X saved businesses and colleges
    a lot of money, and also made UNIX skills more valuable. In a desktop context
    though, network transparency is rarely used, so all that model does is add complication.
    Remote rendering is tricky and today, for home use at least, it usually makes
    more sense to use a remote desktop program. Thus Wayland doesn''t support network
    transparency directly, though you can still run remote X applications via XWayland.


    # # WHY WAYLAND (W)ROCKS


    Wayland is just a protocol, so we can''t apply the same notion of a display server
    to it. A graphical program wanting to render through Wayland does so by means
    of a display compositor. The reference compositor for Wayland is called Weston.
    Modern X desktops have display compositors too – they''re integrated into window
    managers now on fully featured desktops (GNOME has Mutter, KDE Plasma has Kwin),
    and on bare-bones window managers like i3 you can add a compositor like Compton.


