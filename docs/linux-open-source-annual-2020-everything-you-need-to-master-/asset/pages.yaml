- pgno: 151
  md: '# Editing aids


    Effects, transitions and music.


    The video editors featured in this *Roundup* can help you weave a compelling narrative
    by manipulating the different clips and using various effects to enhance their
    appearance. At the minimum, you need to be able to make smooth transition from
    one clip to the next.


    Although rather equally matched, as you spend more time with them, you''ll come
    to realise that some tools are more intuitive at manipulating files than others.


    *Shotcut*, for instance, refers to these as Effects, and clicking the Effects
    button at the top presents a panel on the left from where you can introduce different
    video, audio and other effects into your clips. The application resorts to use
    of buttons to segregate the different effects, but unfortunately there aren''t
    any helpful tooltips to assist users.


    *Kdenlive* comes across as far more polished on this front, offering a text list
    of all available effect, split into different categories such as Artistic, Audio,
    Blur and hide, which makes for easy selection. It also enables you to filter the
    available choices into video and audio.


    A clip has 540 frames as per *LIVES*, when deploying an effect, it pops open a
    dialog advising you that it''s adding an effect onto all 540 individual frames.
    The application is unusable during this process, which is far slower, compared
    to all the other tools.


    ![](img/7a0a282248f9658f0c87e55744c797b6_151_0.png)


    > Be prepared to constantly resize the different elements in the application interface,
    otherwise you''ll only ever get to see a small part of them.


    In stark contrast to the other applications, *Openshot* presents helpful pictures
    to depict the different effects and transitions such as cross, distortion, hue
    saturation, wave and so on. This is incredibly helpful for novice users, because
    the alternative is to deploy an effect or transition to determine what each does,
    as you must with the other tools.


    # VERDICT


    | FLOWBLADE | 7/10 | OPENSOT | 8/10 |

    |---|---|---|---|

    | KDENLIVE | 9/10 | SHOTCUT | 8/10 |

    | LIVES | 7/10 | | |


    The scores here are more reflective of how easy it is to deploy the different
    effects within each program.


    # Extra features


    What makes them special?


    One of the most unique features of *Flowblabe* and *Kdenlive* is the ability to
    use proxy editing. When original media files are far too demanding of resources
    such as CPU or disk bandwidth to allow for responsive editing, the tool makes
    it possible for you switch to working on proxy clips instead, saving system resources.


    *Flowblabe* also enables you perform batch rendering operations and split audio
    from video files. This option leaves you free to change the soundtrack and you
    can also insert watermarks on to your files.


    This is where *Kdenlive*''s custom layout feature comes in. Users can tweak the
    layout to their liking, depending on their workflow, and the tool makes it possible
    to save your custom layout so you don''t have to make the necessary changes every
    time you launch the tool. Best of all, it also enables you to configure the keyboard
    shortcuts to match your custom layout. Because video editing is a creative process
    requiring frequent changes, the automatic backup of project files is incredibly
    handy.


    If you want to introduce additional functionality to *LIVES*, you can do so by
    writing your own custom plugins, which can be in Perl, C or C++, Python and so
    on. It automatically scales when necessary, depending on the detected hardware.
    This is why the tool has been successful on the most number of devices, including
    x86, amd64, PPC and xBox/x86. Like *Kdenlive*, *LIVES* can also preserve backups
    of your project and should the application ever crash, you can attempt to recover
    the files you were working on by starting it with the *lives-recover* command.
    You can also use the application to load single images or directory of image files
    in numerical order and assemble them into videos or slideshows.


    ![](img/7a0a282248f9658f0c87e55744c797b6_151_1.png)


    > The right sidebar on Openshot features a History record of all your actions,
    starting from the time you start a new project.


    command. You can also use the application to load single images or directory of
    image files in numerical order and assemble them into videos or slideshows.


    *Openshot* provides real-time previews so you can quickly assess your work. It
    can also be used to create 2D animation and adding 3D animated titled and effects
    to your clips. *Shotcut* offers unlimited undo and redo for playlist edits including
    a history view. You can also export single frame as image or video as image sequence.


    # VERDICT


    | FLOWBLADE | 10/10 | OPENSOT | 8/10 |

    |---|---|---|---|

    | KDENLIVE | 10/10 | SHOTCUT | 8/10 |

    | LIVES | 10/10 | | |


    Shotcut and Openshot are versatile, but lack proxy editing and custom plugins.'
