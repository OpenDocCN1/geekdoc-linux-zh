    类的实例，或者在 Java 虚拟机 (JVM) 启动时，它会初始化单个实例，被称为系统属性（system properties）。在系统属性中，你可以找到许多“已知”值，例如指示主机操作系统的值。你还可以从命令行在这些表中设置额外的值。例如，如果按照如下方式调用程序：


