    invoking this method. If the calling client has a transaction, the container suspends
    the transaction and starts a new one. This is not a nested transaction because
    the outcome of the new transaction has no impact on the suspended transaction.
    If the calling client does not have a transaction, then the container creates
    a new transaction and invokes the method.

    - The Not Supported attribute means the method cannot handle a transaction. If
    the calling client has a transaction, then the container suspends the transaction
    before'
