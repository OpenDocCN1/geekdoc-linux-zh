    池，通过能够用更少的资源处理更多请求，从而提高了应用程序的可扩展性。


    ## 2.9 实体 bean、有状态 bean 和无状态 bean 的用途


    实体 bean（Entity beans）用于持久化实体数据。实体 bean 是共享的企业级数据对象，可以被多个用户并发使用。


    无状态会话 bean 用于管理服务器上用户会话的状态。无状态 bean 的示例可用于实现应用程序业务逻辑和工作流。


    ## 2.10 使用 Bean 池管理 EJB


    容器无法处理无限数量的 EJB，因此容器必须对资源进行池化并在用户之间共享。每个 EJB 在部署时都会指定要池化和重用的实例数量。EJB 不是可以根据需要创建和销毁的轻级对象。它们是创建和销毁需要消耗大量资源的重量对象。因此，应用程序服务器将管理一个
    EJB 池，用户可以在整个应用程序中使用它。通过拥有此池，应用程序服务器如果不再花费时间创建和销毁对象，就可以处理更多请求。


    ## 2.11 EJB 的钝化


    钝化（Passivation）是将 bean 的状态写入文件系统文件的过程，以便 bean 实例可以被另一个会话使用。你使用钝化可以用更少的资源处理更多请求。这适用于实体
    bean 和有状态会话 bean。对于无状态 bean，你无法使用钝化，因为没有状态。当钝化会话返回时，bean 被激活，bean 状态被重新加载到 bean
    实例中。


    ## 2.12 使用事务


    事务是大多数企业应用程序的重要部分，事务允许你改变主意并返回之前的操作（回滚）或继续进行并提交操作。没有事务，你就无法删除或更改已执行的工作。事务必须遵循
    ACID 原则。它必须是原子性的（Atomic）、一致的（Consistent）、隔离的（Isol）和持久的（Durable）。原子性意味着事务不会部分完成。它要么完全完成，要么回滚到起点。一致性事务让数据存储处于一致状态。你可以访问数据存储并获得正确的结果。隔离性事务独立于你控制之外的另一个事务。持久性事务在系统故障后生存。如果系统在事务过程中失败，系统应该为了一致性和原子性回滚事务。


    当你编写 J2EE 应用程序时，你决定事务应该在何处发生。例如，应该在 servlet 中启动并传播到 EJB 吗？必须使用程序式控制还是声明式控制？声明式控制允许你配置事务的启动。程序式控制等同于
    bean 管理事务（BMT）。声明式控制由容器管理（CMT）。CMT 允许你在运行时配置 bean 的事务属性。BMT 和 CMT 在处理事务时没有区别。声明式控制由容器处理事务支持。以下描述了在事务支持下的所有属性行为，见
    2.1。


    - Required 属性，容器确保在事务中调用方法。如果客户端没有事务，容器将启动事务。

    - New 属性意味着容器在调用方法时总是启动一个新的事务。如果客户端有事务，容器会挂起该事务并启动一个新的。这不是嵌套事务，因为新事务的结果对挂起的事务没有影响。如果客户端没有事务，容器创建一个新事务。

    - Not Supported 属性意味着方法无法处理事务。如果客户端有事务，容器在调用方法前将其挂起。如果客户端没有事务，则。

    - Supports 属性意味着 bean 接受可用事务，但不要求应用程序服务器创建新事务。如果客户端有事务，容器将传播事务。如果客户端没有事务，容器将调用方法。

    - Mandatory 属性规定客户端必须有事务。如果客户端有事务，容器将传播事务。如果客户端没有事务，容器将抛出 `java.transaction.TransactionRequiredException`。

    - Never 属性意味着 bean 不期望事务。如果客户端有事务，容器将抛出 `java.rmi.RemoteException`。如果客户端没有事务，容器将调用方法。


    表 2.1 总结了容器在各种事务属性下的行为。


    # 表 2.1. 事务属性


    | 事务属性 | 客户端有事务 | 客户端无事务 |

    | --- | --- | --- |

    | Required | 事务传播 | 新事务 |

    | Requires New | 挂起事务并启动新事务 | 新事务 |

    | Not Supported | 挂起事务 | |

    | Supports | 事务传播 | 抛出 java.transaction.TransactionRequiredException |

    | Never | 抛出 java.rmi.RemoteException | |


    ## 2.13 使用容器管理持久化


    实体可以使用容器管理持久化（CMP）或 bean 管理持久化（BMP）。在 CMP 中，容器处理在数据源中插入、读取和更新对象所需的代码实现。在 BMP 中，应用程序开发者创建插入、读取和更新对象的实现代码。CMP
    是开发应用程序的理想方式，因为当数据模型更改时，应用程序开发者需要的代码较少。然而，为了提供这种灵活性，CMP 生成的 SQL 不是最高效。


    遗憾的是，对象关系映射工具仍在成熟中。作为工具，你应该结合数据访问对象（DAO）使用 BMP。


