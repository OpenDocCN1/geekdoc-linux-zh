    - 1. 确定谁想执行某些操作（例如使用登录名）

    - 2. 确定该人员是否如其所称的身份（例如使用密码）

    - 3. 确定该人员是否应该执行此操作（例如使用权限列表）


    在网络方面，你必须处理另一个问题。通过网络发出的请求通常需要经过与上述讨论类似的类型验证，但此外，你必须假设在传输中传输的消息对于除请求者以外的人来说是可见的。这通常需要额外的安全层级对这些消息进行伪装，以使其对窥探者变得无用，且无法被其伪造。


    在继续后续讨论之前，你必须确保自己已经熟悉后续段落中定义的术语。


    首先考虑关于保护计算机的讨论——即关于“某人想执行 X，我们允许他们执行”的讨论。通常，被授予或不授予特定权限的可能不是某个特定的人类。它可能是一个职位功能（例如系统管理员或人力资源总监），也可能是另一台计算机或进程。在安全领域，被授予权限的“可识别的人员、功能或实体”的概念被称为“主体”（principal）。职位功能有时被称为“角色”（roles），包括
    J2EE 服务器在内的许多系统提供了一种列出具有特定角色的所有主体的机制。大多数系统都有主体列表。在系统内部，每个主体都有一个标识代码，用于指示该工作是为哪个主体执行的，或者数据数据属于哪个主体。该代码（通常是一个数字）是一种识别方法。


    当请求以给定主体的名义执行某项工作时，必须尽力确定请求者是否属于该主体。这被称为**身份验证**（authentication），通常通过使用密码完成。在登录机制中，人类提交一个登录名（在内部被翻译为某种识别代码）作为标识，然后提交一个密码作为身份验证。


    一旦获得了经过身份验证的标识，系统必须确定请求主体是否应该被允许执行请求的工作。这被称为**授权**（authorization）。


    为了使授权机制产生价值，必须有一种方法来强制执行确认为合适的规则。这需要某种形式的访问控制或资源访问控制。为了确保有效，资源访问控制机制必须基于为为此目的设计的主机操作系统特性。例如，Java
    虚拟机的安全性，如果运行在一个允许从任何网络地址登录且没有任何形式身份验证的主机系统上，将是无效的。


    熟悉的标识、身份验证等机制可以很好地工作，尽管系统在某些情况下会迅速失效。想象一个用户已经登录并离开了无人看管的终端。路人可能会使用该终端输入对于该用户未授权但对于已登录用户已授权的命令。当涉及网络时，这个问题会变得更加严重。考虑通过网络接收消息的情况；消息请求打开某个文件并将其内容发送给请求者。系统如何知道是否应该执行该操作？如何确保返回的数据仅对授权的接收者可用？这些以及其他类似问题属于密码学（cryptography）的范畴，它是下一节的主题。


    ## 5.3 密码学


    密码学是指允许修改信息的技巧，使其信息可以在通过公共视野的同时，对接收者进行加密传输，但不能被公众还原到原始形式。在常用中有两种不同的密码学形式：对称加密和非对称加密，虽然这两种形式之间有很多区别，但它们也有显著的差异。


    在对称加密中，发送者和合法的接收者共享他们之间传输的信息伪装的秘密。仔细考虑，这种伪装机制通常包含两个部分：一个定义了对数据加密时执行哪些数学操作的算法，以及密钥。尽管你通常不会公开你使用的算法，但它并不被认为是你系统安全性的重要部分。相比之下，密钥绝对重要。你可能在小时候上学时尝试过这种密码学，例如通过在字母表中移动特定位数来更改消息中的每个字母。例如，算法是“将消息中的字母替换为字母表中字母向后移动
    n 个位置的字母，如果在计数时超出字母 Z 的末尾，则从 A 开始”。在这里，密钥就是你所移动的总位移。密钥的唯一性允许多对发送者和接收者使用相同的算法，而无法读取发给他人的消息。这些系统在概念上相当容易理解（尽管在数学上可能并不如此）。它们在适当的条件下也是有效的，并且对运行这些系统的
    CPU 有相当高的要求。


    非对称加密也涉及算法和密钥。然而，在这种情况下，通信的末端使用了两个不同但相关的密钥。一个称为私钥（private key），保持保密；另一个是公钥（public
    key），供任何人查看。关于非对称加密有两个重要的概念。首先，一个密钥不能用来推导出另一个密钥。其次，如果用一个密钥加密消息，那么另一个密钥必须解密它。这种方案具有重要的后果。其中之一是你向世界发布一个密钥，同时保留另一个密钥，这样任何人都可以向你发送消息，并知道只有你本人能读取它。这是因为只有一个密钥在公共领域中，而该密钥不能用于创建另一个密钥，也不能用于解密它所加密的消息。


    起初，加密消息但在给定密钥的情况下无法反转过程的想法听起来似乎有些不可思议。很难想象单向操作容易但反向操作困难的数学。考虑法法通常比除法容易。找到一个数的平方比找到平方根要容易得多（假设你是手动操作，而不是使用计算器）。还有其他操作反向操作困难得多，这些操作为非对称加密提供了基础。实际上，私钥和公钥之间存在关系。毕竟，公钥与私钥是一对；事实上，两者都是从一个数字通用生成的。然而，公共加密成功的秘诀在于从一个密钥推导出另一个密钥是如此困难的。这种难度使得一组高性能计算机可能需要一或两年时间才能完成计算。这种类型的操作被称为**计算上不可行的**（computationally
    intractable）。这意味着加密系统并不是阻止未经授权的人读取消息，而是加密系统使得这样做变得昂贵且耗时。其想法是使其变得如此昂贵以不再值得这样做，或者让数据在坏人能够读取它时已经失去了价值。这关乎于密码学所保护的秘密的质量和长效性。


    > 公钥为非对称加密提供了另一个可能更常见的名称——公钥加密：公钥加密对执行加密的系统的 CPU 要求通常更高。由于这个原因，你通常尝试使用对称加密进行通信，并使用非对称加密发送尽可能少的数据。


    总结一下，公钥加密是一种允许你发布一个公钥供全世界查看的技术。世界随后利用它来加密消息，但不能通过解密来推导出私钥。无论你是否见过他们，任何人都可以向你发送消息，而只有你本人能读取它，这是一项实用的功能，但你可以使用这些工具提供更多的实用性。


