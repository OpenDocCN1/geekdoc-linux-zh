    - B. It controls access to a single instance.

    - C. It permits a variable number of instances.

    - D. It allows a collection of objects to be manipulated as a single object.


    - 7: What is an advantage of asynchronous messaging?

    - A. a simple architecture

    - B. Components get an immediate response.

    - C. Components are guaranteed delivery of a response.

    - D. Components can make requests then perform tasks without waiting for

