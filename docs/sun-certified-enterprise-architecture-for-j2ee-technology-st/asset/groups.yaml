    - 4. 系统使用库存子系统验证产品的可用性，并根据请求的更改更新购物车。\n\n## 用例 – 创建账户\n\n当客户决定在购物后结账时，客户必须登录。如果客户没有账户，则客户必须创建一个账户。您也可以通过点击“创建账户”按钮访问此用例。\n\
    \n## 主流程\n\n以下步骤概述了“创建账户”用例的主流程：\n\n- 1. 当用户没有设置账户时，系统显示客户账户表。\n- 2. 客户输入姓名、家庭地址、配送地址、多个电话号码、多个信用卡以及请求的用户\
    \ ID 和密码。\n- 3. 系统验证用户 ID 和密码并创建客户账户。\n\n## 用例 – 结账\n\n“结账”用例允许客户购买购物车中的产品。\n\n\
    ## 主流程\n\n以下步骤概述了“结账”用例的主流程：\n\n- 1. 客户在任何屏幕上点击结账按钮/链接。\n- 2. 系统返回账户登录表。\n- 3.\
