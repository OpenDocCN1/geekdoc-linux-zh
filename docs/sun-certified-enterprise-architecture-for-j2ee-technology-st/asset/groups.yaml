    fundamental mistakes that might result in a particularly insecure application,
    and that you have a basic understanding of the security controls that the Java
    programming language imposes on applets in a browser.


    The first objective addresses the constraints applied to applets. This is relevant
    even if you don''t use applets because you understand what applet security protects
    you against, and why, then you also a level of comprehension of some risks that
    all hosts face. The second objective requires you to have a general familiarity
    with the technology and terminology of security.


    You must recognize that this chapter cannot make you a computer security expert.
    Rather, you will be exposed to the main ideas, the concepts, and the terminology.
    If goes well, you can participate in discussions with security gurus and understand
    the bulk of what they are saying. As additional reading, the books and references
    can add to your ability to make sound decisions, and help you know when you''re
    in over your head and call some expensive to help.


    +   - Firewalls and Internet Security: Repelling the Wily Hacker. Checker, William
    R. and Bellovin, Steven M. Addison-Wesley Publishing Co., 1994. ISBN: 0201633574

    - Intranet Security: Stories from the Trenches. McCarthy, Linda. Prentice Hall.
    1997. ISBN: 0138947957

    - Applied Cryptography: Protocols, Algorithms, and Source Code in C. Schneider,
    Bruce, 2nd Edition. John Wiley & Sons. 1995. ISBN: 0471117099

    - Practical UNIX and Internet Security. Garfinkel, Simeon, and Spafford, Gene.
