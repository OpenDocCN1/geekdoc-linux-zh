    # # Chapter 6. Internationalization


    +   * 6.1 System Internationalization

    * 6.2 The APIs


    The World Wide Web (WWW) really does have worldwide reach. Partly as a result
    of this reach, businesses are less willing to do business solely within their
    own national boundaries. Therefore, new applications, regardless of whether they
    are initially designed for Web deployment, must make a deliberate choice regarding
    internationalization, and the extent to which internationalization might be important
    to the application both immediately and over the life of the application.


    After completing this chapter, you will be able to meet the following J2EE Architect
    objectives:


    +   * State three aspects of an application that might need to be varied or customized
    in different deployment locales.

    * Match the following features of the Java 2 platform with descriptions of their
    functionality, purpose, or typical uses: `Properties`, `Locale`, `ResourceBundle`,
    `Unicode`, `java.text` package, `InputStreamReader`, and `OutputStream`.


    # # Introduction


    The exam objectives in this chapter are designed to ensure that, as an architect,
    you are familiar with the capabilities of the Java 2 platform that support international
    programming. These objectives do not require any significant knowledge of the
    API from a programming perspective, they only require you to know what aspects
    of a system might benefit from internationalization, and the broad capabilities
    of the API. In fact, Java technology provides easy to use and powerful internationalization
    APIs. As an architect, you should know the capabilities of the API so that you
    can direct your design team to goals that can be achieved using it. In some situations,
    if your role as architect extends to that of mentor or team leader for later phases
    of the same project, a more detailed knowledge of the API might also be valuable.
    This book, however, does not cover this information.


    # # Prerequisite Review


    There are no technical prerequisites to the material in this chapter. You are
    not expected to be able to program with the APIs that are discussed, but you will
    need to recognize the purpose and capabilities of those APIs


    # # 6.1 System Internationalization


    First, consider two pieces of terminology: internationalization and localization.
    Internationalization refers to creating a program that does not have information
