    \ 部署图\n\n![](img/5715971f4d127ce26084f269dd89411b_50)\n\n# 要点 (Essential Points)\n\
    \n以下总结了本章的要点：\n\n- UML 有三种构建块：元素、关系和图。\n- 有四种元素：\n    - 结构元素创建模型的静态部分。\n    -\
