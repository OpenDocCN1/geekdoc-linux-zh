    # J2EE™ Sun 认证企业架构师

    技术学习指南


    Mark Cade

    Simon Roberts

    出版商：Prentice Hall PTR

    第一版，2002年3月11日

    ISBN: 0-13-04916-4, 220页


    ![](img/5715971f4d127ce26084f269dd89411b_0_0.png)


    - 前言部分

    - 目录

    - 关于作者


    这是由架构师考试的首席开发人员和评估人员编写的唯一学习指南。


    本指南是针对具有挑战性的 Java 2 平台企业版（Enterprise Edition）Sun 认证企业架构师考试的首本权威学习指南。Java 平台专家
    Cade 和 Roberts 为设计有效的 J2EE 技术架构提供了专业的指导和背景知识，并为每个考试元素提供了全面的准备：多选题考试、作业和论文答辩。你将发现对每个
    J2EE 平台架构问题和每个考试目标的全方位覆盖，包括：


    - 理解系统架构的目标

    - 创建作为整个开发过程蓝图的需求文档和架构文档

    - 利用经过证明的设计模式

    - 为你的应用程序识别正确的 J2EE 技术和 API

    - 在企业环境中实现安全性最大化并考虑防火墙

    - 提供遗留系统访问：适当的技术和应避免的错误

    - 使用 Enterprise JavaBeans™ 架构容器模型以最大化可扩展性

    - 评估现有架构的优缺点


