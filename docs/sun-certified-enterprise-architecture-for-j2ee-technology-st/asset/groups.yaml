    is no state. When the passivation session returns, the bean is activated and the
    bean state is reloaded into the instance of the bean.


    # 2.12 Using Transactions


    Transactions are a big part of most enterprise applications, Transactions enable
    you to change your mind and return to a previous action (rollback) or go forward
    and commit the action. Without transactions, you cannot delete or change the work
    performed. A transaction must adhere to the ACID principal. It must be Atomic,
    Consistent, Isolatable, and Durable. Atomic means the transaction does not partially
    complete. It is either totally complete or is backed out to where it started.
    A consistent transaction leaves the datastore in a consistent state. You can access
    the datastore and get the correct result. An isolatable transaction is independent
    of another transaction outside of your control. Durable transactions should survive
    a system failure. If the system fails in the middle of the transaction, then the
    system should back out the transaction for consistency and atomicity.


    When you are a J2EE application, you decide where the transaction should take
    place. For example, should the transaction start in a servlet and propagate to
    an EJB or should the transaction fully contained in the EJB? You must also decide
    whether to use programmatic control or declarative control of the transaction.
    Programmatic control allows you to demonstrate the start of a transaction. This
    equates to bean-managed transactions (BMTs). There is no difference in BMT and
    CMT when the transaction has been managed. Both methods use the same rollback
    and commit process. Declarative transaction support is handled by the container
    and does not require you to code the declaration. Declarative control is used
    in container-managed transactions (CMTs). CMT allows the deployer to configure
    the bean at runtime by modifying the transaction attributes for bean methods.
    The transaction attribute defines the container''s behavior when a client is invoking
    the bean method. The following describes the six attributes that cover all behaviors
