    # Essential Points


    Downloaded code, such as applets running in a browser, are generally limited by
    default in the following ways:


    +   - Downloaded classes have no access to the file system. This precludes reading,
    writing, modifying, or deleting files, reading directory hierarchies, determining
    identical file information such as the number of files, date and time stamps,
    file sizes, and file owners

    - Downloaded classes have restricted access to other threads, so the downloaded
    code cannot block or kill other threads. However, deadlock conditions might still
    be engineered, and on some operating systems, threads might make excessive use
    of the CPU.

    - Downloaded classes have restricted access to the I/O system so, for example,
    they are not permitted to display a top level window with no warning, nor to grab
    keyboard or mouse events from other windows.

    - Downloaded classes have restricted access to system packages. Classes are downloaded
    only into unprivileged packages and cannot replace or hide any system class.

    - Classes live in a partitioned namespace associated with the URL from which a
    class is loaded, so they can neither interfere with other classes from other locations,
    nor the system classes.

    - Downloaded classes have restricted access to the system properties table, so
    they cannot determine potentially sensitive information, nor can they modify any
    such information.


    Important security concepts have key terms or phrases to describe them. include:


    +   - Principal – A person or entity that is relevant to the security system.

    - Identification – Identifies a principal inside the system.

    - Authentication – Verifies that a principal is who or what they claim to be.

    - Authorization – Determines whether access to a given resource should be permitted
    to an identified principal.

    - Access Control, or Resource Access Control – Enforces the rules specified by
    the authorization system.

    - Private key – A value used in encryption or signing that must be kept secret
    the security of the encrypted messages or the validity of the signatures is to'
