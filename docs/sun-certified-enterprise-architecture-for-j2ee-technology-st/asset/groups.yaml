    # ## 2.13 Using Container-Managed Persistence


    There are any entity bean can persist the object, container-managed persistence
    (CMP) or bean-managed persistence (BMP). In CMP, the container handles the implementation
    of the code necessary to insert, read, and update an object in a data source.
    In BMP, the application developer creates the implementation for the insert, read,
    and update of an object. CMP is the ideal way to develop an application because
    it requires less code changes by the application developer when the data model
    changes. However, to provide this flexibility, CMP does not generate the most
    efficient SQL.


    Unfortunately, the object relation mapping tools are still maturing. As the tools,
    you should use BMP with data access objects (DAO).'
