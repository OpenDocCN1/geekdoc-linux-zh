    +   5.6 Protecting Systems


    +   5.7 Topologies for Securing Networks


    +   5.8 Monitoring


    +   5.9 Tunneling


    Security is an important feature of any serious application. This is true regardless
    of whether the application is connected to the Internet, although the Internet-connected
    application is probably subject to more undirected and unmotivated attack than
    a non-Internet connected application. This is because many troublemakers use the
    Internet to attack systems for no reason except the desire to prove that they
    can. Even though this is the case, a large part of the financial damage associated
    with computer crime results from attacks specifically against a particular company,
    web site, or private individual. Even more damage originates within the victim
    organization. Because of the multitude of threats, it is extremely imprudent to
    contemplate any kind of system without how to protect its security.


    After completing this chapter, you will be able to meet the following J2EE Architect
    objectives:


    +   * Select, from a list, the security restrictions that Java 2 environments
    normally impose on aspects running in a browser.

    * Given an architectural system specification, identify appropriate locations
    for implementation of specified security features, and select suitable technologies
    for implementation of these features.


    # Introduction


    The exam has two objectives on the topic of security. These objectives are not
    designed to make you a security expert, but rather to ensure that you can understand
    security issues sufficiently to participate in discussions with experts, that
    you avoid some of the more'
