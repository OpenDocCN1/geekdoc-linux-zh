    # 工厂方法模式 (Factory Method Pattern)


    工厂方法模式定义了一个创建对象的接口，但让子类来决定实例化哪个类。工厂方法让类将实例化推迟到子类，这对于在不知道要实例化的具体类的情况下，为特定目的构建单个对象非常有用。这允许你可以在不修改代码的情况下引入新类，因为新类仅实现了接口，因此可以被客户端使用。你创建一个新的工厂类来创建新类，而该工厂类实现工厂接口。图
    4-3 展示了工厂方法模式。


    # 图 4-3 工厂方法模式


    ![](img/5715971f4d127ce26084f269dd89411b_60_0.png)


    # 优点


    以下列表列出了使用工厂方法模式的好处：


    -   消除了将应用程序类绑定到代码中的需求。代码只处理接口，因此你可以与任何实现该接口的类工作。

    -   允许子类提供对象的扩展版本，因为在类内部创建对象比直接在客户端中创建对象更灵活。


    # 使用时机


    在以下情况下，你应该使用工厂方法模式：


    -   类无法预知它必须创建的对象的类型。

    -   类希望其子类来指定它所创建的对象。

    -   将责任委托给几个辅助子类之一，并且你希望本地化关于哪个辅助子类是代理的知识。


    # 原型模式 (Prototype Pattern)


    原型模式允许对象在不知道其确切类或创建细节的情况下创建定制化对象。它使用原型实例来指定要创建的对象类型，并通过复制此原型来创建新对象。原型模式通过向一个对象引入原型对象并启动对象的创建来工作。启动创建的对象通过请求原型对象创建自身的副本来创建对象。原型模式通过定义其对象可以复制自身的类，来实现动态地创建对象。图
    4-4 展示了原型模式。


    ## 图 4-4 原型模式


    ![](img/5715971f4d127ce26084f269dd89411b_61_0.png)


    ## 优点


    以下列表列出了使用原型模式的好处：


    -   在运行时添加和删除产品

    -   通过改变值来指定新对象

    -   通过改变结构来指定新对象

    -   减少子类划分

    -   动态地使用类配置应用程序


    # 使用时机


    在以下情况下，你应该使用原型模式：


    -   要实例化的类在运行时指定（例如通过动态加载）。

    -   为了避免构建与产品类层次结构并行的工厂类层次结构。

    -   当一个类的实例的状态只有只有几种不同的组合之一时。


    # 单例模式 (Singleton Pattern)


    单例模式确保一个类只有一个实例，并为该类提供全局访问点。它确保所有使用该类实例的对象都使用同一个实例。图 4-5 展示了单例模式。


    # 图 4-5 单例模式


    ![](img/5715971f4d127ce26084f269dd89411b_62_0.png)


    # 优点


    以下列表列出了使用单例模式的好处：


    -   对唯一实例的受控访问

    -   减少命名空间

    -   允许对操作和表示进行精炼

    -   允许数量数量的实例

    -   比类操作更灵活


    # 使用时机


    在以下情况下，你应该使用单例模式：


    -   一个类必须恰有一个实例。


    # 4. 结构模式 (Structural Patterns)


    结构模式控制应用程序大部分部分之间的关系。结构模式以多种方式影响应用程序，例如，适配器模式允许两个不兼容的系统进行通信，而外观模式允许你向用户呈现简化的接口，而无需移除系统中所有选项。


    结构模式允许你在不重写或自定义代码的情况下创建系统。这为系统提供了增强的重用性和健壮的功能。


    这里描述了以下结构模式：


    -   适配器 (Adapter)

    -   桥接 (Bridge)

    -   组合 (Composite)

    -   装饰器 (Decorator)

    -   外观 (Façade)

    -   享权重 (Flyweight)

    -   代理 (Proxy)


    # 适配器模式 (Adapter Pattern)


    适配器模式充当两个类之间的中间人，转换一个类的接口使其能与另一个类一起使用。这使得接口不兼容的类能够协同工作。适配器模式实现客户端已接口，并提供对客户端未知的类实例的访问。适配器对象提供了接口的功能，而无需知道用于实现该接口的类。图
    4-6 展示了适配器模式。


    图 4-6 适配器模式


    ![](img/5715971f4d127ce26084f269dd89411b_63_0.png)


    # 优点


    以下列表列出了使用适配器模式的好处：


    -   允许两个或多个不兼容的对象进行通信和交互

    -   提高旧版功能的重用性


    # 使用时机


    在以下情况下，你应该使用适配器模式：


    -   你想使用一个现有的类，但它的接口与你需要的接口不匹配。

    -   你想创建一个可重用的类，使其能与无关或不可预见的类协作，这些类并不一定具有兼容的接口。

    -   你想在一个期望接口与对象接口不同的环境中使用该对象。

    -   必须在多个源之间进行接口翻译。


    # 桥接模式 (Bridge Pattern)


    桥接模式将一个复杂组件划分为两个或多个继承层次结构：功能抽象和内部实现。这使得改变组件的任何方面变得更容易，以便两者可以独立变化。


    当存在抽象层次结构和相应的实现层次结构时，桥接模式非常有用。桥接模式不是将抽象组合成许多不同的类，而是将抽象实现为可以动态组合的独立类。图 4-7 展示了桥接模式。


    # 图 4-7 桥接模式


    ![](img/5715971f4d127ce26084f269dd89411b_64_0.png)


    # 优点


    以下列表列出了使用桥接模式的好处：


    -   允许将接口与实现分离

    -   提高可扩展性

    -   向客户端隐藏实现细节


    # 使用时机


    在以下情况下，你应该使用桥接模式：


    -   你想避免抽象与其实现之间存在永久绑定。

    -   抽象和它们的实现都应该能够使用子类进行扩展。

    -   抽象实现的改变不应对客户端产生影响；也就是说，你不必重新编译他们的代码。


    # 组合模式 (Composite Pattern)


    组合模式允许你创建不同复杂性的分层树结构，同时允许结构中的每个元素通过统一的接口操作。组合模式将对象组合成树形结构以表示整个层次结构或其一部分。这种组合模式允许客户端统一地对待单个对象和对象组合。图
    4-8


    图 4-8 组合模式


    ![](img/5715971f4d127ce26084f269dd89411b_65_0.png)


    # 优点


    以下列表列出了使用组合模式的好处：


    -   定义了由原始对象和组合对象组成的类层次结构

    -   更容易添加新种类的组件

    -   提供了结构的灵活性和易于管理的接口


    # 使用时机


