    # Preface


    ## Why We Wrote This Book


    Sun certification exams are not given after class. If they were, it''s unlikely
    that they would receive the wide-ranging industry recognition that they enjoy.
    These exams are hard, and meaning that they prove something, and that makes them
    worth passing. Not everybody passes, even after repeated attempts.


    The exams are arguably unique in that you don''t have Sun training to pass, although
    of course, Sun training is helpful and a good idea to do anyway. The exams have
    wide-ranging objectives that don''t relate to any particular training course.
    The objectives for the Sun Certified Enterprise Architect (SCEA) for the Java
    2 Platform, Enterprise Edition Technology exam are broad; they attempt to capture
    the main ideas that would be learned over a number of years as competing professional,
    typically in a career that spans a longer time frame and more languages than just
    Java technology.


    To address these issues, Sun''s certification division plans to provide a study
    guide for each of its tests. This is one of those. This book is probably not the
    only study available for the exam, and it''s certainly not the only way to prepare
    for the exam; however we find it helpful and that you learn something of value
    for your professional development, not just how to answer the exam questions.
    After all, the exam is meant to give you the opportunity to be a better architect,
    which in the long term will be far more helpful to your career than a piece of
    paper saying you passed an exam.


    ## About the Authors


    Between us, we have over ten years experience working with Java technology, in
    terms of developing systems, teaching, and working on the certification exams.
    We have considerably more experience in the pre-Java technology world of computing,
    including C, C++, maine languages, hardware design, networking with Transmission
    Control Protocol/Internet Protocol (TCP/IP), netbios and Novell, and database
    technologies. We were privileged to be members of the team that developed the
    architect certification exam, so we have an intimate knowledge of the difficulty
    of writing questions for this huge topic, and a fairly accurate view of the nature
    and scope of the exam. We don''t claim to know all, we don''t think anyone does,
    this topic is too large. However, we hope that we have enough background knowledge,
    experience, and the right communication skills, to help you pass the architect
    certification exam, and to help you realize your potential as an architect.


    We believe that whatever study method you use, and whatever resources you use
    to help you, the knowledge you gain will help you build better systems, and thereby
    become more successful in your work. We became involved in the exam project because
    we enjoy the thrill of creating a really elegant and successful system, and we
    wanted to help others experience that same satisfaction. For the same reason,
    we decided to take on the project that resulted in the book you''re now reading.


    ## About This Book


    The SCEA is intended for seasoned computing personnel, and it is not possible
    to condense all the required knowledge into a single book. This book is a study
    guide. We''ve tried to cover the key facts tested in the exam, but you must understand
    the concepts as well as the facts to pass this exam. You should probably do additional
    reading, and you must develop a general understanding of the ideas tested in the
    exam.


    Some of the exam questions might look at a particular issue from a slightly different
    perspective than the one presented in this book. That is why it is important that
    you understand the issues. We deliberately avoided giving you the answers to questions,
    which would only devalue the exam. Furthermore, the exam is the subject of ongoing
    development, with new questions being added and old ones being removed. It''s
    probably obvious that this is to reduce the chance of cheating, which would devalue
    the effort you put into passing it.


    Given that this book doesn''t just list the questions, what does it do? It introduces
    the key concepts covered in the exam and clarifies the terminology. This will
    ensure that you''re "on the same page" as the exam developers. It also lists references
    in which you can find additional discussion of topics that you might want to research.
    And, it provides self-evaluation questions that are designed to help you understand
    the topic.


    You might be surprised to know that you could disagree with some of the answers
    given in this book and not wrong. Architecture depends on the interaction of a
    great many conflicting forces, and two experienced architects will often come
    to contradictory conclusions about how best to solve a particular problem.


    Most of the questions in this book carefully enumerate the values of the customer,
    and using these values as hints, you should be able to see why a particular answer
    is listed as correct. However, it''s probably more important that you can see
    the relationship between the correct answers and the alternative answers.


    In the multiple choice element of the exam there is only one acceptable answer
    (or combination of answers). Because of this, you must have the ability to evaluate
    the questions dispassionately. You must answer them solely on the information
    provided, and you should avoid the tendency to fill in additional "ifs, buts,
    and wherefores." Often the real exam lists a possible answer that is perfectly
    reasonable if you include just one value judgement, but because that value judgement
    is unsupported by the question, the answer is wrong in the context of the exam.


    Learning to think like this isn''t just a skill for getting through the exam,
