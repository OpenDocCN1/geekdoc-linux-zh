    # 2.2 J2EE APIs


    The following list describes the technologies used by J2EE to implement parts
    of a distributed computing application:


    +   * Java 2 Standard Edition (J2SE)

    * Java Database Connectivity (JDBC) – A standard API used to connect the Java
    platform to database resources in a vendor-independent manner.

    * RMI-JRMP – Remote Method Invocation (RMI) that uses the Java Remote Message
    Protocol (JRMP).

    * Java Interface Definition Language (IDL) – A service that incorporates Common
    Object Request Broker Architecture (CORBA) into the Java platform to provide interoperability
    using standard Interface Definition Language (IDL) defined by the Object Management
    Group (OMG).

    * Remote Method Invocation-Inter-ORB Protocol (RMI-IOP) – Protocol that enables
    RMI programmers to combine the benefits of using RMI APIs and CORBA IIOP communications
    protocol to communicate with CORBAcompliant clients that have been developed using
    any language with CORBA.

    * Enterprise JavaBeans (EJB) – A component architecture for the development and
    deployment of component-based distributed business applications.

    * Servlets – Interact with a Web client in a request-response mechanism. This
    mechanism is based on behavior of the HTTP.

    * Java Pages (JSP) – Used for building applications containing dynamic content,
    such as Dynamic HyperText Markup Language (DHTML), and Extensible Markup Language
    (XML).

    * Java Message Service (JMS) – An API with Message Oriented Middleware (MOM) to
    enable point-to-point and publish/subscribe messaging systems.

    * Java Naming and Directory Interface (NDI) – A unified interface to access different
    types of naming and directory services.

    * Java Transaction API (JTA) – A set of APIs that enables transaction management.
    Applications can use the JTA APIs to start, commit, and abort transactions.

    * JavaMail – An API that provides a platform-independent and protocol-independent
    framework to build and messaging applications.

    * JavaBeans Activation Framework (JAF) – API for an activation framework that
    is used by other packages, such as JavaMail. You can use JAF to determine the
    type of data, encapsulate access to that data, discover the operations available
    on that data, and instantiate the appropriate bean to perform these operations.
    For example, JavaMail uses JAF to determine what object to instantiate based on
    the mime type of object.


    # 2.3 Components of J2EE


    J2EE is built on a container model. The four core container components provide
    runtime support for the J2EE components by means of APIs. These core'
  - '[PAGE 20]


    components relate to the four types of containers supported in J2EE, which are
    Application Client, Applet, Web, and EJB. The following are the core application
    components supported by J2EE:


    +   - The Java application – The Java application components are standalone programs
    that run inside the Application Client container. The Application Client container
    provides the APIs for lost messaging, remote invocation, database connectivity
    and lookup services. The following APIs are required for the Application Client
    container: J2SE, JMS, JNDI, RMI-IIOP, and JDBC. This container is provided by
    the application server vendors.

    - Applets – Applet components are Java applets that run in the Applet container,
    which is the base browser that supports the Java technology. The Applet must support
    the J2SE APIs.

    - Servlets and JSPs – Servlet and JSP components are Web-based components that
    run in the Web container, which is supported by a Web server. The Web container
    is the run-time environment for JSPs and servlets. The Web container must support
    the following APIs: J2SE, JMS, JNDI, JavaMail, JAF, RMI-IIOP, and JDBC. Servlets
    and JSPs provide a mechanism for dynamic content preparation, processing and formatting
    related to presentation.

    - Enterprise JavaBeans (EJB) – EJB components are components that run in the EJB
    container. The EJB components are the core of a J2EE application. The EJB container
    provides transaction management, state management, resource pooling, and security
    checks. The EJB container must support the following APIs: J2SE, JMS, JNDI, JavaMail,
    JAF, RMI-IIOP, and JDBC. Because EJB components are the core of J2EE, most exam
    questions are related in some way to EJB. Therefore, the majority of this chapter
    describes different components and functions of EJB.


    # 2.4 Using EJB


    EJB should contain the business logic for the application, so it is no surprise
    that EJB is the heart of most applications. An enterprise bean has the following
    characteristics:


    +   - Contains business logic that operates on enterprise data

    - Created and managed by a container

    - Mediates client access

    - Contains metadata, such as transaction and security attributes, separate from
    the bean

    - Provides transaction management, state management, resource pooling, and security
    checks. If you have an application that does not require security and/or transaction
    support, then you must really question whether to use EJB.


    # 2.5 Specifying Classes and Interfaces for EJB


    To keep consistency for EJB, each EJB must have the following interfaces and class:'
  - '[PAGE 21]


    +   * The home interface is developed by the bean developer. The Application server
    provides an implementation for this interface. The home interface should extend
    javax.ejb.EJBHome. The home interface acts as a factory pattern to create instances
    of the EJB. It also allows the client to create, remove, or find an EJB.


    +   * The remote interface is developed by the bean developer and the Application
    server provides an implementation. It should extend javax.ejb.EJBObject. The remote
    interface contains the business methods that can be called by the client.


    +   * The bean class is developed by the bean developer and contains the implementation
    of the method defined in the remote interface. It should extend javax.ejb.Session
    or javax.ejb.Entity.


    Figure 2-1 illustrates the classes and interfaces for EJB.


    # Figure 2-1. Classes and Interfaces for EJB


    | Source Files | Remote Interface | EJB Class |

    | --- | --- | --- |

    | Home Interface | | |

    | | Vendor Tools | |

    | Runtime | Home Object Stub | Home Object | EJB Object Stub | EJB Object | Enterprise
    Bean Object |


    # 2.6 Using Session and Entity Beans


    Enterprise applications require flexible components in the business logic. Components
    must provide stateless services, provide conversational state, and support the
    sharing of enterprise data. Enterprise JavaBeans (EJB) provides two basic types
    of beans to support the different components required in an enterprise application:
    session and entity. Entity beans provide for persistence and sharing of data in
    a J2EE application. This is not to say that a session bean can persist an object,
    the entity bean specializes in persisting objects. Session beans provide the business
    logic and workflow associated with the J2EE application, which corresponds to
    the stateless services and conversational services.


    # 2.7 Stateless and Stateful Session Beans


    There are two types of session beans: stateless andful.'
