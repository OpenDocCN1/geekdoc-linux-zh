    # HTTPS


    HTTPS is HTTP using SSL as the transport layer. SSL connection provides encryption
    and potentially verifies the parties at each end of the connection, but in the
    context of this discussion, the SSL connection also provides a maintenance of
    state between one request and the next. Using the state in the SSL connection
    at the application level avoids the security problems associated with cookies
    or URL rewriting, and enhances security by the nature of SSL.


    # Applets and Other Thin Clients


    If you can embed an applet into a Web page, then that applet can maintain the
    necessary state. If appropriate, the applet can open a dedicated connection to
    the server, using any protocol that suits your needs, and by keeping the connection
    open, state is inherently maintained. Keeping a connection open has some consequences;
    each-response cycle is faster than creating and destroying a separate connection
    for each cycle; however, maintaining an open connection places some additional
    demands on the server and is unlikely to scale well.


    # Security in HTTP


    From a security point of view, you should be aware of some issues with HTTP. You
    should consider HTTP requests and responses to be insecure. HTTP sends all messages,
    both requests and responses, in "clear text," that is, unencrypted. The participants
    (client and server) are unverified. You might think that failure to verify the
    server is not a major problem, because the client can see the URL they loaded,
    and URL identifies the server. However, this is not a sound assumption. Because
    of the nature of the domain name service (DNS), which provides the name/address
    translation, it is possible to see the correct DNS name in a URL even though you
    are not connected to the correct server.


    Most clients allow outbound connections to port 80 on an external server. All
    protocols, or perhaps some other target ports, are often blocked. Most firewalls
    block connections to unknown ports but firewalls that include proxy servers examine
    the contents of requests and responses and these firewalls block other services
    because the messages of different services are not recognized and are dropped.


    HTTP is usually able to pass through firewalls so it is a common choice for tunneling.
    Tunneling is a technique that uses one protocol as the transport for another.
    So, for example, you can use HTTP as the transport for RMI or CORBA/IIOP messages.
    A request is encoded in an HTTP request (usually a POST request) and sent to the
    tunneling-proxy server, which is a server that mimics a Web server. The tunneling-proxy
    server takes the request and converts it into the native request that it issues
    to the real server. When the native response arrives at the tunneling-proxy server
    it is wrapped in an HTTP response and sent back to the client. The client must
    create its requests in the HTTP-wrapped format and unwrap the responses it receives.
    This technique is common, because firewalls are common at the client end and are
    outside the control of the server administrators, but it is inefficient. You should
    try to avoid using tunneling; specifically, do not use it in any situation where
    you are in control of both the client and all firewalls between the clients and
    the servers.


    # 7.2 HTTPS


    HTTPS is not a single protocol, rather it is the combination of HTTP over an SSL
    transport. The properties of both HTTP and SSL are embodied in HTTPS. By including
    SSL, you gain the following three benefits: encryption, identification of parties,
    and session state.


    SSL provides encryption using any number of protocols. When SSL establishes a
    connection, it first negotiates which protocol to use. The result should be the
    strongest encryption algorithm that both ends support. Of course, if one supports
    only a weak encryption algorithm, the resulting connection will be insecure. For
    systems where the strength of encryption is important, you should validate that
    the algorithm chosen is acceptable. You can do this either programmatically or
    by asking the user, but consider whether the users will be capable of making an
    informed determination.


    If a party involved in setting up an SSL connection has a certificate, then SSL
    can send this to the other party. This allows the other party to validate the
    identity of the first party. Validation is not 100 percent certain, although the
    mathematical process of the validation is close. The weaknesses arise mainly from
    human issues, such as a third party having copied the private key of the certificate''s
    legitimate owner. Such issues are discussed in Chapter 5, “Security.”


    SSL connections are state, and because of this, HTTPS can support sessions without
    the security risks of URL rewriting or cookies. However, because HTTPS arises
    directly from SSL, the connection setup is substantially slower. This is a direct
    result of the negotiation of protocols and cannot be avoided.


    # 7.3 IIOP


    The Internet-ORB Protocol (IIOP), is the protocol used by CORBA systems to call
    methods and pass the argument and returned data for those methods over the network.
    CORBA APIs, with them IIOP, are available for many platforms and programming languages,
    including the Java programming language. This platform and language independence
    can be a significant benefit to using IIOP when connecting to legacy systems;
    if you have to install support code onto the host of the legacy system, then do
    not overlook the possibility of using RMI directly by installing a JVM on that
    host and using, after all, the JVM is free and you''re probably using it in other
    parts of your system.


    A substantial body of standard services are defined for CORBA systems, covering
    a variety of both vertical and horizontal markets. Horizontal services for CORBA
    include, but are not limited to, naming, security and transaction management.
    CORBA services are not usually free software though they might be included in
    a CORBA package. However, if any CORBA services are installed on the local network,
    the ability to access these might be a significant benefit to using IIOP over
    your systems.


    Java technology systems use IIOP in two ways, either by using the Java IDL APIs
    or by running RMI IIOP. The Java IDL APIs are the most direct way to use CORBA
    in a Java application. Running RMI over IIOP allows most of coding simplicity
    while using IIOP as the underlying transport.


    Sometimes you might need to run a thin-client program on a system that is not
    in your own network. In this situation, it is likely that the network has a firewall
    that does not allow outbound traffic. Such firewall is typically bypassed by tunneling
    the required messages over another port or protocol that is permitted. Usually,
    this is port 80 and the protocol is HTTP. IIOP is aware of these issues, and can
    tunnel through HTTP.


    # 7.4 JRMP


    JRMP is the native transport protocol of RMI. Similar to IIOP, it can invoke methods,
    and pass arguments, return values, and exceptions over the network. RMI does not
    typically come with a body of services, though there is a naming service included
    with it. The most significant difference from IIOP however, is that JRMP does
    not restrict argument and return types to data values, JRMP handles objects. Objects
    have state and behavior, which means that JRMP provides a mechanism to transfer
    the class file of an object into the recipient of an argument or returned value
    (an exception for that matter). This copying of class file is done on as-needed
    basis to avoid bandwidth. Where you copy classes, you must complete additional
    administrative setup. Because these tasks are not done, or done incorrectly, you
    sometimes find RMI/JRMP systems that exhibit the limited behavior of CORBA, that
    is, do not move over the network, but only move state. This is not always a problem,
    provided the system is designed that way, indeed, it can result in slightly higher
    performance and slightly lower network bandwidth usage.


    Because JRMP is the native protocol for RMI and does not have to support a myriad
    of different host formats and byte ordering, there is less overhead in setting
    up the argument and return values for a call over JRMP than with language neutral
    systems.


    JRMP does not include encryption or identification of parties by default. However,
    it is easy to set JRMP to use SSL as a transport. This is achieved by using "socket
    factories." Further information on the mechanics of this is in the API documentation.
