    ## 安全管理器禁止了什么？


    考试要求你了解安全管理器在浏览器中的默认行为。这具有两个价值：首先，你将立即知道小程序（applet）是否可以在没有权限的情况下执行任何特定操作；其次，你将对为什么这些操作可能有害产生一些理解。不要忘记，如果
    applet 默认无法执行给定的操作，那么在实践中，你可能应该假设 applet 不是该功能的合适选择，因为大多数浏览器用户不愿且可能无法向 applet
    授予权限。


    安全管理器的工作原理是检查请求权限的类是否被授予了特定的权限（permission）。权限由一个描述权限的类来表示。权限类的实例通过添加名称（name）和操作（action）来更详细地描述权限。在某些权限类中，名称和操作是可选的，当使用它们时，它们限定了被允许的具体行为。例如，可以授予
    `java.io.FilePermission` 权限类以 "read" 为名称和 "tmp/*" 为操作，，允许读取 `/tmp` 目录下的任何文件（但不包括子目录）。


    权限机制是可扩展的，因此你可以添加新的权限来控制对你创建的设备或行为的访问，并在运行时验证它们是否已被授予。运行时不关心任意权限，因为这些权限默认对下载的代码是拒绝的。因此，你只需要关注核心
    JDK 部分的权限即可。例如，你不需要学习每一个权限及其所有的变体。相反，你应该考虑被允许的权限类别和被拒绝的权限类别。此外，请记住权限会随着 JDK 新版本的发布而发生变化（即添加新权限）。


    ## 允许的操作


    通常，授予给不受信任代码的权限很少；通常情况下，只授予程序运行所需的权限，例如创建线程的能力、在浏览器为 applet 创建的线程组中操操作线程的有限能力、执行使
    GUI 正确运行的、对 AWT 事件队列进行至关重要操作的能力，以及读取但不可修改任何系统属性的有限能力。除了这些权限外，applet 通常被允许与其加载的宿主机建立网络连接。你可能会奇怪为什么
    applet 被防止连接到其他主机。原因有两个，其中一个比较微妙，且另一个更有可能。如果 applet 能够与其他主机建立任意连接，那么 applet 就可以被用作对其他系统进行拒绝服务攻击的源头。然而，禁止网络连接的原始原因仅仅是，许多系统根据请求的源
    IP 地址授予网络请求权限。如果 applet 可以连接到任意主机，那么它就连接到你公司网络内部的服务器。如果该服务器根据 IP 地址授予对你机器的访问，那么它就会授予
    applet 访问权限，因为它是从你的机器发送的请求。然后 applet 就可以获取敏感信息并将其传回给作者，而这是你不希望允许的。


    ## 被拒绝的操作


    通常，任何可能损害宿主机的操作都会被拒绝。这些唯一的例外是 CPU 使用、内存使用和网络带宽使用。在本文编写时的安全系统中，没有检查来确定 applet 是否正尝试使用过量的
    CPU 时间。在 UNIX 操作系统上，这不是一个显著问题，因为浏览器可用的 CPU 数量是由操作系统限制的。在其他系统中，applet 可能会故意创建许多线程，导致宿主机系统（而不只是浏览器）瘫痪。


    类似地，applet 对内存的使用不受安全系统的限制。预期是宿主机操作系统会防止任何单个进程变得过度贪婪。再次，在某些系统上可能并非如此。


    最后，网络带宽的使用不受限制，这使得 applet 可以连接到其加载的宿主机并以尽可能快的速度开始发送网络数据包。这将降低运行此类 applet 的宿主机的网络性能。


    这些行为缺陷都不会造成永久性，它们是令人恼的，并且通常可以通过杀死运行该恶恶意 applet 的浏览器来停止。如果 applet 能够访问宿主机计算机上的文件、执行任意程序或向任何任意选定的主机发送网络消息，情况将严重得多。这些功能由所有版本的浏览器普遍保护，并且从
    applet 第一次运行以来一直如此。


    由于 applet 可以通过网络向宿主机发送信息，安全系统的一个重要目标是防止访问敏感信息。例如，尽管 applet 只能与加载它们的宿主机建立标准的 TCP/IP
    连接，但它们也可以向互联网上的协作主机发送数据。这可以通过多种方式实现，但通常涉及常用互联网协议或服务的使用，如 DNS。


    JavaStart 是另一种适用于瘦客户端的技术。随着 1.4 的出现，它成为了 JDK 核心发行的一部分。JavaStart 提供了 applet 的所有优点并解决了让
    applet 不够理想的问题。在编写时，还没有专门针对 JavaStart 的目标；但是，它是一种强大且优雅的技术，简化了维护并增强了安全性。任何使用内部应用程序的公司都会从使用
    WebStart 中受益。因此，对该技术进行简要概述是合理的，部分由于与该技术相关的目标可能会加入考试。


    JavaStart 提供了一个类似于 Windows 桌面的小窗口，显示图标。这些图标并不一定安装，而是指向 Web 服务器上代码的链接。


    当你启动 JavaStart 桌面上的一个应用程序时，运行该应用程序所需的类从 Web 服务器下载。这种行为与 applet 类似。然而，一旦下载，类就会存储在本地。这使得后续使用应用程序时启动更快。更好，每当你尝试运行该应用程序时，系统都会检查
    Web 服务器上是否有可用更新，如果有，将下载所需的更改。这确保了即使计算机没有连接到网络，应用程序也可以准备就绪，同时也确保可以使用最新版本。这不需要安装阶段即可完成。


    ## 5.2 安全基础


    安全的核心点是保护资源免受未经的访问。这需要两类保护：网络上的数据，以及计算机本身的数据和进程。


