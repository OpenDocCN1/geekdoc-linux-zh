    You can employ a number of possible layouts to make a network more secure, or
    more flexible. However flexibility and security are mutually incompatible, and
    you must balance these conflicting needs when designing a network.


    # Simple Firewall Installation


    Figure 5-1 illustrates a simple firewall installation.


    # Figure 5-1. Firewall Installation


    ![](img/5715971f4d127ce26084f269dd89411b_102_0.png)


    In simple situations, it might be sufficient to build a network that simply uses
    a single firewall for protection like that shown in the previous figure. In this
    layout, all messages that pass between any system in the internal network and
    any system on the rest of the Internet must pass through the firewall. Such a
    system would be relatively simple to administer, and might provide adequate protection
    for a network that provides little in the way of services for the outside. For
    example, if your network only allows connection from the outside for incoming
    e-mail.


    In the single firewall arrangement, any breach of the firewall''s security immediately
    and completely opens your network to direct attack. This is the main reason that
    such a simple system is not usually sufficient for a corporate network.


    # Two Firewalls and a DMZ


    Figure 5-2 illustrates two firewalls with a demilitarized zone (DMZ).


    # Figure 5-2. Two Firewalls and a DMZ'
  - '[PAGE 103]


    ![](img/5715971f4d127ce26084f269dd89411b_103_0.png)


    In this approach, the outer firewall allows a significant variety of traffic to
    and from the services in the DMZ, but little, or typically no traffic is permitted
    between the inner region and the Internet. In cases where a message must be passed
    from a proxy server that is located in the DMZ. Inbound messages are never sent
    directly to the inner network but only to a Web server or proxy server in the
    DMZ. If appropriate, that server might choose to forward the message inside the
    inner network, or it might format a new request to an inner machine so that it
    can answer the request it has received.


    Complex layouts are possible, and in many cases appropriate, but most are some
    derivative of this, with layers of protection wrapped around one. For example,
    there might be some systems that should not be accessible to the general user
    inside the company network. Accounting, payroll, and HR systems usually fall into
    this category. It''s reasonable to create inner protected areas inside the main
    network for these types of systems. Figure 5-3 illustrates this notion.


    # Figure 5-3. Security-Protected System


    104'
  - '[PAGE 104]


    ![](img/5715971f4d127ce26084f269dd89411b_104_0.png)


    This layout begins to address the issues of internal attacks, while also greatly
    increasing the security of the more sensitive parts of your system.


    Each of these configurations shares a number of common themes:


    +   * Firewalls, DMZs, and similar protection mechanisms serve to increase the
    effort required to break into your central network. This type of layout also serves
    to slow down an attacker. They should not be considered to be "absolute defense."

    * Nothing should be permitted any firewall without a carefully thought out decision
    that the messages are necessary and worth whatever they might entail. These decisions
    should be made by a competent security committee. These decisions should be specific
    to which machines might receive or originate these messages.

    * Messages should generally not pass directly to any system behind a firewall.
    Rather, all messages are passed using a proxy. Web servers act as proxies (using
    servlets and other techniques) to application servers and databases.

    * Proxy software should be simple in design and run on a system that has a minimum
    of services so it offers the fewest possible points of attack. Web servers are
    considerably more complex than an ideal proxy.


    # 5.8 Monitoring


    Many people assume that a firewall is a "fit and forget it" option; this is not
    the case. You should assume that a firewall-protected network is still vulnerable,
    although you can reasonably expect that attacking it will take more time.


    To further improve the security of a network, you should arrange for continuous
    monitoring of activity passing through the DMZ. The idea is that if someone tries
    to break into your network, you have a chance of noticing the attempts before
    they are successful, and therefore you have an opportunity to protect whatever
    it is they try to attack. In many cases, that opportunity might be simply to pull
    the plug on your main Internet connection point for a while.'
  - '[PAGE 105]


    If you have to look at every packet that passes in or out of your network then
    you are not going to stand much chance of detecting unusual activity. Therefore,
    an important key to effective monitoring is to automate the bulk of the work.
    If the system can notify you when something suspicious occurs, you have a much
    better chance of monitoring effectively.


    There are a number of tools available for monitoring, often built into or supplied
    afield. You should investigate these and compare their capabilities with the types
    of activities that your network must allow. In addition, you might be able to
    monitor the behavior of your applications. A crude but workable example for monitoring
    UNIX programs would be to run the program under the truss command. You use the
    truss command to list all kernel calls that a program makes, along with the arguments
    to call. If you search that list (using the grep command) for kernel calls that
    should not be made, you will spot it at some types of attack.


    Perhaps the biggest problem with monitoring is the "false-positive" problem. If
    a network monitoring system complains that something strange is happening too
    often, and most of the time it proves to be false, then there is a strong tendency
    to start to ignore its warnings. This is exactly parallel to the "boy who cried
    wolf"


    # 5.9 Tunneling


    Tunneling is a way of creating a covert channel, that is, a communication path
    for messages of one type that uses a path actually intended for some other type
    of message. Tunnel can be used to sneak past firewall restrictions either to get
    into a network or out of a network. Using tunneling to get out of a network might
    be a reasonable way to behave, but using it to get into a network usually suggests
    that someone doesn''t understand his/her job. The rest of this section discusses
    these two options to give you an understanding of the benefits and costs of setting
    up tunneling, and enable you to make a decision about it when to use it.


    # Tunneling into a Network


    Once a firewall and DMZ have been set up, it becomes harder to add new Internet-accessible
    services to the internal networks. This, in the first instance is simply because
    these services are invisible to the Internet as a consequence of the proper operation
    of the firewall.


    To add a new service to your DMZ, access must be granted through the firewall.
    This might involve opening a new route through the packet-filtering router element
    of the firewall, and perhaps adding a new proxy program to the firewall. Unfortunately,
    there is a tendency for firewall administrators, or the policies created by higher
    management under which a firewall is operated, to refuse outright any request
    to open up new access through the firewall system.


    When faced with such a situation, there are really only three possible ways to
    proceed:'
  - '[PAGE 106]


    +   1. Decide that the service is business critical and abandon the project.


    +   2. Persuade the firewall administrators that the service is business critical
    and convince them that granting access to it is a legitimate business need that
    they should permit.


    +   3. Use an existing opening in the firewall to create a covert channel to the
    service that the firewall administrators do not know about.


    Option 1 is not likely to be acceptable if your job is to provide the given service.
    Option 2 might seem impossible from a political perspective. However, as phrased,
    Option 3 also seems doubtful. You would, in effect, be lying to your company and
    deliberately compromising your system''s security measures. However, the popular
    option of "tunneling through port 80" amounts to this behavior.


    The primary problem with Option 3 is that security problems do not arise as a
    result of a particular port accessible on a particular machine. Rather, the problem
    arises when a particular service is accessible, and has a service vulnerability.
    By using tunneling, which is sadly quite impossible without the permission of
    the firewall administration. Because of this, the firewall group cannot adequately
    monitor the traffic, they cannot know if the service needs a patch. In short,
    the tunnel risks completely bypassing all the benefits of the firewall.


    Now, while this is clear in mind, the problem remains that some firewall administrators
    simply don''t understand enough to be persuaded by the arguments, and continue
    to refuse to allow proper access to your service. Indeed some specifically recommend
    tunneling as the proper way to provide access to your service. If you come across
    this, which is sadly quite likely, then you probably have to use tunnelling despite
    the loss of both security and performance that it causes. However, in such situations,
    you should keep in mind that the firewall administrators do not know about your
    service, and cannot adequately perform monitoring or regular patching on the service.
    You should try to ensure that these functions are performed somewhat.


    # Tunneling out of a Network


    Although tunneling is a really solution to a political rather than a technical
    problem, there are times when the problem is not within your control. Others arises
    legitimately when you are writing an app, or other client, that run inside someone
    else''s network and needs access to a service that you run inside your own network.
    Imagine you have created an app that you want a customer to use your services.
    That customer might be behind a firewall that restricts outgoing messages. You
    do not have the authority to reconfigure that firewall. In this case, tunneling
    is a reasonable, inefficient option.


    Before you set up your app to perform tunneling, consider whether it might be
    sufficient simply to run your new service on a particular port, typically port
    80. In this'
- md: '

    situation, you set up your applet and server to operate with their own native
    messages, but the server listens for connections on a port that is normally used
    by some other service, such as a Web server. This approach works well if the customer''s
    firewalls check the destination port number but do not inspect the content of
    the messages. If, by contrast the customer''s system is set up to use a caching/proxy
    Web server at their firewall, this approach is unlikely to be of value, because
    the messages are not in HTTP format, and are dropped.


    # Essential Points


    Downloaded code, such as applets running in a browser, are generally limited by
    default in the following ways:


    - Downloaded classes have no access to the file system. This precludes reading,
    writing, modifying, or deleting files, reading directory hierarchies, determining
    identical file information such as the number of files, date and time stamps,
    file sizes, and file owners

    - Downloaded classes have restricted access to other threads, so the downloaded
    code cannot block or kill other threads. However, deadlock conditions might still
    be engineered, and on some operating systems, threads might make excessive use
    of the CPU.

    - Downloaded classes have restricted access to the I/O system so, for example,
    they are not permitted to display a top level window with no warning, nor to grab
    keyboard or mouse events from other windows.

    - Downloaded classes have restricted access to system packages. Classes are downloaded
    only into unprivileged packages and cannot replace or hide any system class.

    - Classes live in a partitioned namespace associated with the URL from which a
    class is loaded, so they can neither interfere with other classes from other locations,
    nor the system classes.

    - Downloaded classes have restricted access to the system properties table, so
    they cannot determine potentially sensitive information, nor can they modify any
    such information.


    Important security concepts have key terms or phrases to describe them. include:


    - Principal – A person or entity that is relevant to the security system.

    - Identification – Identifies a principal inside the system.

    - Authentication – Verifies that a principal is who or what they claim to be.

    - Authorization – Determines whether access to a given resource should be permitted
    to an identified principal.

    - Access Control, or Resource Access Control – Enforces the rules specified by
    the authorization system.

    - Private key – a value used in encryption or signing that must be kept secret
    the security of the encrypted messages or the validity of the signatures is to
    be maintained. Private keys are created along with a corresponding public key
    and are used in pairs.


    - Public key – a value that can be known by anyone. You can use a public key to
    encrypt messages that are to be sent to the owner of the corresponding private
    key, or to verify the signature on a message received from the owner of the private
    key.

    - Encryption – The process of producing a modified message from an original message
    so that the original message can be easily recovered from the modified (or encrypted)
    message, but the recovery by the intended recipient, be difficult to the point
    of futility for anyone else.

    - Signing – The process of producing a short message (signature) that is impractical
    to create without knowledge of a particular key, but can be identified as correct
    using only the public key associated with that private key.

    - Certificate – a message, signed by one principal (the certificate authority),
    that identifies the key of another as being valid according to the belief of the
    certificate authority.

    - Certificate Authority – An organization that validates (to some degree) the
    identity of a person or organization and issues a certificate carrying the public
    key provided by that person or organization.

    - Certification Statement (CPS) – the statement of the process by which a Certificate
    Authority decides that a is actually the property of a person or organization
    that is asking for a Certificate to be issued.

    - Message digest – a short message that can be matched with a particular message,
    to prove that the digest was created from the message and that neither has been
    altered since creation.

    - Packet-filtering router – a router that allows packets to pass only to or from
    certain ports on machines. This arrangement is used as the sole point of access
    to a protected network from the Internet. A packet-filtering router is a fundamental
    element of a firewall system.

    - Firewall – an extension of the packet-filtering router that provides additional
    security behavior. Most commonly, a firewall provides proxy services to further
    control access by the outside world to your services.

    - Demilitarized zone (DMZ) – a region between two firewalls that controlled access
    from the Internet is permitted by the first firewall only to systems in the DMZ.
    Access to the systems by the second firewall is permitted only to the systems
    in the DMZ not to any systems to the Internet.

    - Tunneling – a means of providing a covert channel to a service when firewall
    administrators will not grant direct access. Using to allow connections out of
    a network to the Internet, tunneling is a valuable way to circumvent the rules
    of firewalls that are not in your own control. By contrast, however, tunneling
    to get into your own networks should be viewed as breaking your company’s rules,
    and should be avoided if at all possible.


    The following lists corrections to common misconceptions:


    - A signature does not prove that the owner of the corresponding private key read,
    signed, or approved the document. A signature proves beyond reasonable doubt only
    that the corresponding private key was used to sign the document. If the owner
    of the key failed to take adequate care of the key, or the computer in which the
    key was stored was compromised (such as by an e-mail Trojan horse), the signature
    can easily be created without the private owner''s consent or knowledge.


    - A message digest does not prove that the message is the original message. All
    you know from an unencrypted message that the digest was created from the message
    matches. If the message was changed, then the digest must have been regenerated.


    - A certificate does not directly verify the identity of the holder of the private
    key. Rather, the certificate shows that someone has a copy of what you believe
    to be the certificate authority''s private key you believes, or you want to believe,
    that the holder of the private key noted on the certificate claims it. If this
    sounds a mouthful, that it is. Many things can go wrong here: You might have the
    wrong public key for the certificate, for example if you accepted a copy of it
    from a malicious third party who substituted a bogus key. The certificate authority
    might have given you false information, through malice, or perhaps as a result
    of having been lied to.


    # Review Your Progress


    This section reviews the objectives described in the chapter and provides review
    questions to ensure that you understand the important points in the chapter.


