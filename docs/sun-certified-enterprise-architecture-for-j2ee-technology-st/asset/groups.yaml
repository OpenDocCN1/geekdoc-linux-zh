    The only study guide written by the lead developers and assessors of the architect
    exam.


    The first authorized study guide for the challenging Sun Certified Enterprise
    Architect for Java 2 Platform, Enterprise Edition exams. Java platform experts
    Cade and Roberts provide expert guidance and background for designing effective
    J2EE technology architectures—as well as comprehensive preparation for every exam
    element: multiple-choice exam, assignment, and essay. You''ll find start-to-finish
