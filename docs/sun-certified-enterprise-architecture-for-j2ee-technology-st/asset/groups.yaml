    # Activity Diagram


    An activity diagram is a special kind of a statechart diagram that shows the flow
    from activity to activity within a system. An activity diagram addresses the dynamic
    view of a system. This type of diagram is important in modeling the function of
    a system and emphasizing the flow of control objects.


    Figure 3-25 starts with Activity1 and then creates parallel execution to Activity2
    and Activity3. Activity2 has two possible outcomes. If Activity2 fails, then proceed
    to Activity4 and exit. If Activity2 succeeds, then proceed to Activity5 and join
    with the parallel execution from Activity3. After Activity3 and Activity5 are
    joined, execution continues with Activity6 and then completes.


