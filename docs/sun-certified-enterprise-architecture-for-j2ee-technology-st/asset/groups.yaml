    # Chapter 3. Documenting an Architecture


    # 3.1 The Building Blocks of UML


    # 3.2 Common Mechanisms in UML


    The current industry standard for visual modeling is the Unified Modeling Language
    (UML). This chapter starts with an overview of the building blocks of UML, continues
    with a description of the common mechanisms in UML and then finishes with examples
    of the different types of UML diagrams along with an explanation of how to interpret
    these diagrams. By the end of this chapter you will know how to draw and interpret
    UML diagrams.


    After completing this chapter, you will be able to meet the following J2EE Architect
    objectives:


    - Explain how to draw UML diagrams to define the system architecture.

    - Explain how to interpret UML diagrams.


    # Introduction


    As you create an architecture, you must communicate this system architecture to
    the designers and developers who will build the system. The best way to describe
    an architecture is to use visual models and narratives. The visual models are
    contained in two different documents. The first is the System Requirements document,
    which contains all of the requirements of the system. The requirements are depicted
    in a use-case diagram, object diagram, sequence or collaboration diagrams, and
    activity diagrams. In addition, the use cases are also described in narrative
    format. The second document is the System Architecture document, which contains
    the models of the system architecture. You use the class diagram, package diagram,
    component diagram, deployment diagram and the statechart diagram to visually communicate
    your architecture. In addition to the visual models in the System Architecture
    document, you should supply narratives that justify your choices and provide additional
    description for better understanding.


    # Prerequisite Review


    Using models to define the system architecture is not sufficient. You must support
    the models with narratives and identify and document your requirements using use
    cases. This chapter does not cover how to write technically or write use cases
    to document your requirements and architecture.


    # Discussion


    What is a model? A model is a simplification of reality. You build models using
    UML diagrams to better understand the system you are developing. The models you
    build will help you:


    - Visualize the system as it is or as you want it to be

    - Specify the structure or behavior of a system

    - Provide a template to guide the construction of the system

    - Document the decisions made about the system


    To start modeling with the UML, you need to learn the three major elements of
    the UML: building blocks, rules for combining blocks, and common mechanisms. Once
    you have mastered the three elements, you can read and create UML diagrams.


    # 3.1 The Building Blocks of UML


    There are three types of building blocks: elements, relationships, and diagrams.
    Elements are the abstractions that are first-class citizens in a model; relationships
    tie these elements together, and diagrams group collections of related elements
    by means of relationships.


    # Elements


    There are four kinds of elements in UML:


    - Structural – Used to create the static parts of a model by representing elements
    that are conceptual or physical

    - Behavioral – Allows you to model the behavior of the system.

    - Grouping – Allows you to organize the structural and behavioral elements in
    your model

    - Annotational – Explanatory parts of the model


    These elements are the basic elements used in creating models.


    # Structural Elements


    There are seven structural elements: class, interface, collaboration, use case,
    active class, component, and node.


    - A class is a set of objects that share the same attributes, operations, relationships
    and semantics. The class is represented by a rectangle with three areas. The first
    area contains the name of the class, the second area contains the attributes of
    the class and the third contains the operations of the class. Figure 3-1 illustrates
    a class.


    > Figure 3-1. A Class


    ![](img/5715971f4d127ce26084f269dd89411b_37_0.png)


    - The interface is a collection of operations that specify a service of a class
    or component. The interface is represented by a rectangle with the same three
    areas as the class. An interface has the addition of the word “interface” above
    the interface name to identify it as an interface. Figure 3-2 illustrates an interface.


    ### Figure 3-2. An Interface


    ![](img/5715971f4d127ce26084f269dd89411b_37_1.png)


    - The collaboration defines an interaction and a combination of roles and other
    elements that work together to provide some cooperative behavior that''s bigger
    than the sum of all the elements. The collaboration is represented by a dashed-line
    ellipse. Figure 3-3 illustrates a collaboration.


    ### Figure 3-3. A Collaboration


    ![](img/5715971f4d127ce26084f269dd89411b_37_2.png)


    - A use case is a description of a set of actions that a system performs to yield
    an observable result of value to an actor. An actor is a person or subsystem outside
    the bounds of the system to be defined. The visual representation of a use case
    is the ellipse with the use case name inside the ellipse. Figure 3-4 illustrates
    a use case.


    ### Figure 3-4. Use Case


    ![](img/5715971f4d127ce26084f269dd89411b_37_3.png)


    - The Active class is a class whose objects own one or more processes or threads
    and therefore can initiate control activity. An active class looks the same as
    a class with the three areas, has a bold border. Figure 3-5 illustrates an Active
    class.


    ### Figure 3-5. An Active Class


    ![](img/5715971f4d127ce26084f269dd89411b_38_0.png)


    - A component is a physical and replaceable part of a system that conforms to
    and provides the realization of a set of interfaces. Visually, the component is
    a rectangle with two prongs so that it appears it could be plugged into something.
    Figure 3-6 illustrates a component.


    ### Figure 3-6. A Component


    ![](img/5715971f4d127ce26084f269dd89411b_38_1.png)


    - A node is a physical element that exists at run time and represents a computational
    resource, generally having at least some memory and often processing capability.
    Visually, the node looks like a cube with a name on the front side of the cube.
    Figure 3-7 illustrates a node.


    ### Figure 3-7. A Node


    ![](img/5715971f4d127ce26084f269dd89411b_38_2.png)


    # ## Behavioral Elements


    Behavioral elements are used to model the behavior of a system. There are two
    types of behaviors, interaction and state machine. Interaction is a type of behavior
    that comprises a set of messages exchanged among a set of objects within a particular
    context to accomplish a specific purpose. An interaction is represented by a solid
    arrow line. Figure 3-8 illustrates an arrow.

