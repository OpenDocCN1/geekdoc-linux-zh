    # 第 3 章 架构文档化


    # 3.1 UML 的构建块


    # 3.2 UML 中的常见机制


    当前视觉建模的行业标准是统一建模语言（UML）。本章从 UML 构建块的概述开始，继续描述 UML 中的常见机制，最后以不同类型 UML 图的示例结束，并解释如何解读这些图表。在本章结束时，你将学会如何绘制和解读
    UML 图。


    在完成本章后，你将能够满足 J2EE 架构师的目标：


    - 解释如何绘制 UML 图来定义系统架构。

    - 解释如何解读 UML 图。


    # 引言


    在你创建架构时，必须向将构建系统的设计人员和开发者传达这种系统架构。描述架构的最佳方法是使用视觉模型和叙述。视觉模型包含在两个不同的文件中。第一个是《系统需求》文档，它包含了系统的所有需求。需求通过用例图、对象图、序列图或协作图以及活动图来描绘。此外，用例还以叙述格式进行描述。第二个文档是《系统架构》文档，它包含了系统架构的模型。你使用类图、包图、组件图、部署图和状态图来视觉化地传达你的架构。除了《系统架构》文档中的视觉模型外，你还应该提供叙述来证明你的选择是合理的，并提供额外的描述以便更好地理解。


    # 前提知识回顾


    使用模型定义系统架构是不够的。你必须用叙述来支持模型，并使用用例识别和记录你的需求。本章不涵盖如何编写技术性文档或如何编写用例来记录你的需求和架构。


    # 讨论


    什么是模型？模型是对现实的简化。你使用 UML 图构建模型，以便更好地理解你正在开发的系统。你构建的模型将帮助你：


    - 可视化地呈现现状或你希望它的样子

    - 规范系统的结构或行为

    - 提供一个指导系统构建的模板

    - 记录关于系统的决策


    要开始使用 UML 建模，你需要学习 UML 的三个主要元素：构建块、组合块的规则和常见机制。一旦你掌握了这三个元素，就可以读取和创建 UML 图了。


    # 3.1 UML 的构建块


    构建块有三种：元素、关系和图表。元素是模型中一等公民的抽象；关系将这些元素连接在一起，而图表则通过关系将相关的元素集合分组。


    # 元素


    UML 中有四种元素：


    - 结构类 – 通过表示概念性或物理性的元素来创建模型的静态部分

    - 行为类 – 允许你对系统的行为进行建模

    - 分类类 – 允许你组织模型中的结构元素和行为元素

    - 注释类 – 模型中的解释性部分


    这些元素是创建模型时使用的基础元素。


    # 结构性元素


    共有七种结构元素：类、接口、协作、用例、活动类、组件和节点。


    - 类是一组共享相同属性、操作、关系和语义的对象集合。类由一个带有三个区域的矩形表示。第一个区域包含类的名称，第二个区域包含类的属性，第三个区域包含类的操作。图
    3-1 展示了一个类。


    > 图 3-1. 一个类


    ![](img/5715971f4d127ce26084f269dd89411b_37_0.png)


    - 接口是操作集合，用于指定类或组件的服务。接口由一个与类相同三个区域的矩形表示。接口在接口名称上方增加了“interface”一词以识别其为接口。图 3-2
    展示了一个接口。


    ### 图 3-2. 一个接口


    ![](img/5715971f4d127ce26084f269dd89411b_37_1)


    - 协作定义了一种交互，它是一组元素在特定语境内相互交换某些消息的组合，以实现特定目的。协作由实线箭头线表示。图 3-3 展示了协作。


