  - '[PAGE 11]


    Architecture is a set of structuring principles that enables a system to be comprised
    of a set of simpler systems each with its own local context that is independent
    of but not inconsistent with the context of the larger system as a whole.[1]


    [1] Sun Microsystems, Inc.


    Both definitions focus on system structure. You create an architecture to describe
    the structure of the system to be built and how structure supports the business
    and service-level requirements. You can define the structure of a system as the
    mechanisms that the system employs to solve the common problems of the system.
    A mechanism is a capability that supports the business requirements in a consistent
    and uniform manner. For example, persistence is a mechanism that should be used
    consistently throughout the system. This means that any time the system uses persistence,
    it is handled in the same manner. By defining persistence as an architectural
    mechanism, you provide a default method of addressing persistence that all designers
    should follow and implement consistently. The architectural mechanisms, such as
    persistence, distribution, communication, transaction management, and security
    are the infrastructure on which you build the system and must be defined in your
    architecture.


    What does it mean to create an architecture? It means that you have created a
    software infrastructure that addresses the service-level requirements that have
    been identified for the system. For example, if the system has a service-level
    requirement that states no user response time will be greater than three seconds,
    the software infrastructure must ensure that the system can meet this requirement.
    It also means that you have given the designers an infrastructure to design and
    code the system without worrying about compromising this service-level requirement.
    One of the real issues around architecture is: When does the creation of an architecture
    stop the design process begin? There is not a definitive answer for every system.
    This issue of architecture and design can be summed up in terms of focus and control.
    Architecture defines what is going to be built and design outlines how you will
    build it. Architecture is controlled by one or two individuals who focus on the
    big picture and design is controlled by many individuals who know the details
    of how to achieve the big picture. An architect creates an architecture to a point
    where the design team can use it to make the system achieve its goals. So, if
    you are creating an architecture for experienced designers, you might not produce
    the detail that you need if you had a group of less experienced designers.


    As you create an architecture to satisfy the business and service-level requirements
    of a system, you usually don''t have unlimited funds to purchase hardware, software
    and development resources, so you need to make the system work within your defined
    limitations. For example, how can you make the system scale to meet the demands
    of the Internet age, when you have only a single computer to support your internal
    employees? How do you create an architecture without funds to buy products? These
    are examples of problems faced by architects when they are creating a system architecture.
    You will be presented with many difficult choices and make many trade-offs to
    solve these types of problems. As you make these trade-offs, it is important that
    you document each decision made regarding the architecture of the system. If you
    make a decision to'
  - '[PAGE 12]


    have Oracle database persist the objects in the system, then you should document
    why you chose Oracle over another database vendor. This allows others working
    on the project or entering the project at a later time to understand why decisions
    were made and prevents you from justifying your decision over and again. Most
    of the trade-offs you make when creating an architecture focus on the service-level
    requirements or mechanisms. Most systems do not have the funding available to
    meet all of the service level envisioned by the system stakeholders. So, as the
    architect must balance the service-level requirements against the cost to attain
    them. If it costs your entire budget to buy high-availability hardware to achieve
    the 24x7 availability, thereby leaving no money to purchase an application server
    to help maintain that service-level requirement on the software side, you must
    make adjustments in your architecture. These adjustments depend on the system
    for which you are creating the architecture and your relationship with the stakeholders.


    # 1.2 Role of the Architect


    > The ideal architect should be a person of letters


    Vitruvius, circa 25 BC


    Vitruvius was not referring to a software architecture, but the basic idea is
    that the architect should have the following characteristics. An architect should
    be a person who is wellrounded, mature, experienced, learns quickly, a leader,
    communicates well and could make the difficult decision when necessary. For architects
    to be well-rounded, they must have a working knowledge of the business or problem
    domain. They can gain this knowledge through experience or education. In addition,
    architects must have a broad knowledge of technology. An architect might have
    first-hand experience with a particular technology, but they must have at least
    a general understanding of competing technologies to make informed decisions about
    which technology can work best. A good architect evaluates all possible solutions
    to a problem regardless of the technology used.


    What does the architect do? What is the difference between an architect compared
    with a senior developer? These are some of the common questions asked. The designer
    is concerned with what happens when a user presses a button and the architect
    is concerned with what happens when ten thousand users press a button. An architect
    mitigates the technical risks with a system. Risk is something that is unknown,
    unproven, or untested. Risks are usually associated with the service-level requirements
    and can occasionally be associated with a business requirement. Regardless of
    the type of risk, it is easier to address the risks early in the project while
    creating an architecture, then to wait until construction when you have a large
    developer base that could potentially be waiting while risks are solved.'
  - '[PAGE 13]


    An architect must lead the development team to ensure the designers and developers
    build the system according to the architecture. As the leader, difficult decisions
    must be made about trade-offs in the system and the architect is the person who
    must make those decisions. To lead, the architect must be a good written and oral
    communicator. It is up to the architect to communicate the system to the designers
    and developers who will build it. This is typically done with visual models and
    group discussions. If the architect cannot communicate effectively, then the designers
    and developers will probably not build the system correctly.


    # 1.3 Service-level Requirements


    In addition to the business requirements of a system, you must satisfy the service-level
    or quality of service (QoS) requirements. As an architect, it is your job to work
    with the stakeholders of the system during the inception and elaboration phases
    to define a quality of service measurement for each of the service-level requirements.
    The architecture you create must address the following service-level requirements:
    performance, scalability, reliability, availability, extensibility, maintainability,
    manageability, and security. If you have to make trade-offs between these requirements
    the most important service-level requirement is the performance of the system,
    you might sacrifice the maintainability and extensibility of the system to ensure
    that you meet the performance quality of service. As the expanding Internet opens
    more opportunities, the service-level requirements are becoming increasingly important
    as the users of these Internet systems are no longer just company employees, but
    they are now the company''s customers.


    # Performance


    The performance requirement is usually measured in terms of response time for
    a given screen transaction per user. In addition to response time, performance
    can also be measured in throughput, which is the number of transactions in a given
    time, usually one second. For example, you could have a performance measurement
    that could be more than three seconds for each screen form or a transaction throughput
    of one hundred transactions in one second. Regardless of the performance, you
    need to create an architecture that allows the designers and developers to complete
    the system without considering the performance measurement.


    # Scalability


    Scalability is the ability to support the required quality of service as the system
    load increases without changing the system. A system can be considered scalable
    if, as the load increases, the system still responds within the acceptable limits.
    It might be that you have a performance measurement of a response time between
    two and five seconds. If the system load increases and the system can maintain
    the performance quality of service less than a five second response time, then
    your system is scalable. To understand scalability, you must first understand
    the capacity of a system, which is defined as the maximum number of processes
    or users a system can handle and still maintain the quality'
- md: '

    of service. If a system is running at capacity and can no longer respond within
    an acceptable time frame, then it has reached its maximum scalability. To scale
    a system that has met capacity, you must add additional hardware. This additional
    hardware can be added vertically or horizontally. Vertical scaling involves adding
    additional processors, memory, or disks to the current machine(s). Horizontal
    scaling involves adding more machines to the environment, thus increasing the
    overall system capacity. The architecture you create must be able to handle the
    vertical or horizontal scaling of the hardware. Vertical scaling of a software
    architecture is easier than the horizontal scaling. Why? Adding more processors
    or memory typically does not have an impact on your architecture, but having your
    architecture run on multiple machines and appear to be one system more difficult.
    The remainder of this book describes how you can make your system scale horizontally.


    ## Reliability


    Reliability ensures the integrity and consistency of the application and all its
    transactions. As the loads increase on your system, your system must continue
    to process requests and handle transactions accurately as it did before the load
    increased. Reliability can have a negative impact on scalability. If the system
    cannot maintain the reliability as the load increases, then the system is really
    not scalable. So, for a system to truly scale it must be reliable.


    ## Availability


    Availability ensures that a service/resource is always accessible. Reliability
    can contribute to availability, but availability can be achieved even if components
    fail. By setting up an environment of redundant components and failover, an individual
    component can fail and have a negative impact on reliability, but the service
    is still available due to the redundancy.


    ## Extensibility


    Extensibility is the ability to add additional functionality or modify existing
    functionality without impacting existing system functionality. You cannot measure
    extensibility when the system is deployed, but it shows up the first time you
    must extend the functionality of the system. You should consider the following
    when you create the architecture and design to help ensure extensibility: low
    coupling, interfaces, and encapsulation.


    ## Maintainability


    Maintainability is the ability to correct flaws in the existing functionality
    without impacting other components of the system. This is another of those qualities
    that you cannot measure at the time of deployment. When creating an architecture
    and design, you should consider the following to enhance the maintainability of
    a system: low coupling, modularity, and documentation.


    ## Manageability


    Manageability is the ability to manage the system to ensure the continued health
    of a system with respect to scalability, reliability, availability, performance,
    and security. Manageability deals with system monitoring of the QoS requirements
    and the ability to change the system configuration to improve the QoS dynamically
    without changing the system. Your architecture must have the ability to monitor
    the system and allow for dynamic system configuration.


    ## Security


    Security is the ability to ensure that the system cannot be compromised. Security
    is by far the most difficult system quality to address. Security includes not
    only issues of confidentiality and integrity, but also relates to Denial-of-Service
    (DoS) attacks that impact availability. Creating an architecture that is separated
    into functional components makes it easier to secure the system because you can
    build security zones around the components. If a component is compromised, then
    it is easier to contain the security violation to that.


    ## Essential Points


    Architecture is a set of structuring principles that enables a system to be comprised
    of a set of simpler systems each with its own local context that is independent
    of but not inconsistent with the context of the larger system as a whole. [1]


    > [1] Sun Microsystems, Inc.


    - The role of the architect is to make designer and developers productive as quickly
    as possible.

    - Creating an architecture to address the service-level requirements will help
    you to avoid that "CNN" moment.

    - Scalability is the ability to support the required quality of service as the
    system load increases without changing the system.

    - Reliability ensures the integrity and consistency of the application and all
    of its transactions.

    - Availability ensures that a service/resource is always accessible.

    - Extensibility is the ability to add additional functionality or modify existing
    functionality without impacting system functionality.

    - Maintainability is the ability to correct flaws in the existing functionality
    without impacting other components of the system.

    - Manageability is the ability to manage the system to ensure the continued health
    of a system with respect to scalability, reliability, availability, performance,
    and security.

    - Security is the ability to ensure that the system cannot be compromised.


