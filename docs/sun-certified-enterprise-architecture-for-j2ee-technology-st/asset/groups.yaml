    orders for later submission.

    D. An assistive technology system that modifies the behavior of the host interface
    by the addition of speech input and output.

    E. A utility that lists all the system properties.


    A: The correct answer is A.


    The applet described in A is a typical front end client, for which an applet is
    a reasonable option. This applet only makes network communication with its own'
