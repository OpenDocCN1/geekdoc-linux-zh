    base. At this time, they are expanding from a strictly mail-order-based company
    to one with an electronic business (e-business) presence. GES is trying to transition
    most of their business to a Web commerce site.


    GES has back-office systems in place to support the current operating environment
    that supports its Web commerce site. The back-office systems are: Accounting,
    Content Management, Inventory, Payment Server, and Shipping. The Accounting system
    from Big O Corporation written in the Java programming language. The Content Management
    from Vine Corporation provides C++ and Java technology interfaces. The Inventory
    system from FIFO Corporation is written in C++ with CORBA backbone. Payment Server
    is provided by ePay, which has both Java technology and C++ interfaces. The Shipping
    system is a home-grown system that is written in the Java programming language.


    The current business process is for customers to place their orders by mail, fax,
    or phone using a catalog that was previously mailed to them. When the order is
    received at GES, it is entered into the Order Entry system, which deducts the
