    A Locale is a representation of a set of cultural and language preferences. It
    is represented in two, or perhaps three, parts. The first part is the language
    code, and this is considered to be the most significant part. The second part
    is the country code. The country code adds a "fine tuning" to the localization
    provided by selection of the correct language. For example, British and American
    locales share the language code "en" for English; however, because there are a
    number of other variations, such as spellings, currency symbol, these variations
    are represented in a suffix to the main language code. The locale name for American
    is en_US, while the locale name for British is en_GB.


    In the Java APIs, Locale is a class. Objects of the class represent these regional
