    ## 3. CONTACT PROMETRIC TO SCHEDULE YOUR EXAM


    The exam takes place at an authorized Prometric Testing Center. To register for
    a convenient date, time, and location, go to http://www.2test.com for information
    on your local Prometric office. In some countries, you may register for the exam
    online.


    ## 4. TAKE YOUR EXAMINATION


    Before starting the exam, you must agree to maintain confidentiality and sign
    the Certification Candidate Pre-Test Agreement, which can be viewed at http://suned.sun.com/US/certification/register/policies.html.
    If you do not sign the agreement, you will not be allowed to take the exam.


    After completing your exam, you will receive your score and a section-by-section
    assessment of your test performance. Your exam results will be available at http://suned.sun.com/US/certification/my-certification/index.html
    within five business days. If you do not pass the exam, you must wait two weeks
    before taking it again.


    ## 5. REGISTER FOR THE ARCHITECTURE AND DESIGN PROJECT


    Once you''ve successfully completed the multiple-choice exam, you can purchase
    the architecture and design project from your local Educational Services office.
    Within 24 hours, you''ll be given permission to download the project. To find
    your local office, go to http://www.sun.com/service/suned and choose the country
    in which you want to register.


    ## 6. DOWNLOAD AND SUBMIT THE ARCHITECTURE AND DESIGN PROJECT


    Go to My Certification database to download the architecture and design project
    at http://suned.sun.com/US/certification/my-certification/index.html.


    Once you''ve completed the project, you can submit your project by uploading it
    to My Certification database.


    ## 7. VERIFY THE EXAM NUMBER AND REGISTER FOR THE ESSAY EXAM


    After you''ve submitted the architecture and design project and you''re ready
    to register for the essay exam, you can purchase an exam voucher from your local
    Educational Services office. Go to http://www.sun.com/service/suned and choose
    the country in which you want to take the test.


    Once you''ve received the voucher, repeat steps three and four. You''ll receive
    your score and performance feedback from the Sun Certification database at http://suned.sun.com/US/certification/my_certification/index.html
    within three to four weeks. If you do not pass, you may do the architecture and
    design project again and resubmit it for an additional $150 fee (or as locally
    placed). You will not have to retake the essay exam.


    After you''ve successfully completed all of the certification requirements, you''ll
    receive a Welcome Kit from Sun, which includes a letter of congratulations, personalized
    certificate, a lapin and license agreement which, once signed, allows you to use
    the Java Technology logo on your business card. At that time, you might want to
    start thinking about the next certification in your professional future. To begin
    preparation, visit http://suned.sun.com/US/certification/to download the Certification
    Success Guide for the next certification in your career path.


    ## Testing Objectives


    Testing objectives for the Sun Certified Enterprise Architect for J2EE Technology
    include:


    ## COMMON ARCHITECTURES


    - Given an architecture described in terms of network layout, list benefits and
    potential weaknesses associated with it


    ## LEGACY CONNECTIVITY


    - Distinguish appropriate from inappropriate techniques for providing access to
    a legacy system from Java technology code given an outline description of the
    legacy system

    - Distinguish between stateful and stateless session beans

    - Distinguish between session and entity beans

    - Recognize appropriate uses for entity, stateful session, and stateless session
    beans

    - State the benefits and costs of container-managed persistence

    - State the transactional behavior in a given scenario for an enterprise bean
    method with a specified transactional attributed as defined in the deployor descriptor

    - Given a requirement specification detailing security and flexibility needs,
    identify architectures that fulfill these requirements

    - Identify costs and benefits of using an intermediate data-access object between
    an entity bean and the data resource


    ## ENTERPRISE JAVABEANS


    ## ENTERPRISE JAVABEANS™ CONTAINER MODEL:


    - State the benefits of bean pooling in an Enterprise JavaBeans container

    - Explain how the Enterprise JavaBeans container does lifecycle management and
    has the capability to increase scalability


    ## PROTOCOLS:


    - Given a list of some of its features, identify a protocol that is one of the
    following:

    - HTTP, HTTPS, IIOP, or JRMP

    - Given a scenario description, distinguish appropriate from inappropriate protocols
    to implement that scenario

    - Select common firewall features that might interfere with the normal operation
    of a given protocol


    ## APPLICABILITY OF J2EE™ TECHNOLOGY:


    - Identify application aspects that are suited to implementation using J2EE technology

    - Identify application aspects that are suited to implementation using Enterprise
    Beans

    - Identify suitable J2EE technologies for the implementation of specified application
    aspects


    ## DESIGN PATTERNS:


    - Identify the most appropriate design pattern for a given scenario

    - Identify the benefits of using design patterns

    - State the name of a Gamma et al. design pattern given the UML diagram and/or
    a brief description of the pattern''s functionality

    - Identify benefits of a specified Gamma et. design pattern

    - Identify the Gamma et al. design pattern associated with a specified J2EE technology
    feature


    ## MESSAGING:


    - Identify scenarios that are appropriate to implementation using messaging, Enterprise
    JavaBeans technology, or both

    - List benefits of synchronous and asynchronous messaging

    - Identify scenarios that are appropriate to implementation using messaging

    - Identify scenarios that are more appropriate to implementation using asynchronous
    messaging, rather than synchronous

    - Identify scenarios that are more appropriate to implementation using synchronous
    messaging, rather than asynchronous


    ## INTERNATIONALIZATION:


    - State three aspects of any application that might be varied in different locales

    - List three features of the Java language that can create internationalized application


    ## SECURITY:


    - Identify security restrictions that Java environments normally impose on applets

    - Given an architectural system, identify appropriate locations for implementation
    of features and select suitable technologies


    ## Sample Questions


    - 1: Which statement describes active replication for fault tolerance?

    - A. Active replication requires all members to execute the same

    - B. Active replication requires the master member to synchronize state with the
    slave members.

    - C. Active replication requires the master member to notify the slave members
    for each invocation.

    - D. Active replication requires the master member to send state to the backplane.


    - 2: A shipping company is building an enterprise system to track the location
    of packages. One part of the tracking system is a network of inventory devices.
    The devices can only be accessed using a custom, TCP/IP protocol. How should you
    encapsulate interaction with the inventory system?

    - A. with a Java class that uses JMS to interact with the inventory system

    - B. with a CORBA object that uses IIOP to interact directly with the inventory
    system

    - C. with an EJB stateful bean that uses sockets to interact with the inventory
    system

    - D. with EJB entity bean that uses container-managed persistence to encapsulate
    the inventory system


    - 3: Which object can be used to increase cross-database and cross-schema portability?

    - A. entity bean

    - B. home object

    - C. session bean

    - D. data-access object


    - 4: What are two features of HTTPS? (Choose two.)

    - A. It is secure.

    - B. It is connectionless.

    - C. It is connection-based.

    - D. It is used for load balancing.

    - E. It is used for remote object communications.


    - 5: You are developing a system with the following requirements:

    Users will access the system using a standard Web browser.

    All incoming requests will be filtered based on the user''s IP address.

    The response to the request will be an appropriate static HTML page, based on
    the user''s IP address.

    Which two J2EE technologies should be used to handle HTTP requests? (Choose two.)

    - A. JSP

    - B. JTS

    - C. EJB

    - D. SNMP

    - E. servlets


    - 6: What are two benefits of the Singleton pattern? (Choose two.)

