    # ## Behavioral Elements


    Behavioral elements are used to model the behavior of a system. There are two
    types of behaviors, interaction and state machine. Interaction is a type of behavior
    that comprises a set of messages exchanged among a set of objects within a particular
    context to accomplish a specific purpose. An interaction is represented by a solid
