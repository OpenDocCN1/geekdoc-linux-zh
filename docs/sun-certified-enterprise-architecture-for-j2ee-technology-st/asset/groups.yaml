    # HTTPS


    HTTPS 是使用 SSL 作为传输层的 HTTP。SSL 连接提供了加密，并可能验证连接两端的双方身份，但在本文讨论的语文中，SSL 连接还提供了在一次请求和下一次请求之间维持状态的功能。在应用层使用
    SSL 连接中的状态可以避免与 cookie 或 URL 重写相关的安全问题，并由于 SSL 的本质特性增强了安全性。


    # Applet 及其他轻级客户端


    如果你可以将 applet 嵌入到 页面中，那么该 applet 就可以维持必要的状态。如果合适，applet 可以使用任何适合你需求的协议与服务器建立一个专用连接，通过保持连接开启，状态就从本质上得到了维持。保持连接开启会有一些后果：每个请求-响应周期都比为每个周期创建并销毁单独的连接要快；然而，维持打开连接会对服务器产生一些额外需求，并且不太可能良好扩展。


    # HTTP 中的安全


    从安全的角度来看，你应该意识到 HTTP 的一些问题。你应该将 HTTP 请求和响应视为是不安全的。HTTP 以“明文”（即未加密）的形式发送所有消息（包括请求和响应）。参与者（客户端和服务器）是未经验证的。你可能认为未能验证服务器并不是大问题，因为客户端可以看到它们所加载的
    URL，而 URL 标识了服务器。然而，这种假设并不稳妥。由于域名服务（DNS）的特性（它提供名称/地址的转换），即使由于你没有连接到正确的服务器，也可能在
    URL 中看到正确的 DNS 名称。


    大多数客户端允许向外部服务器的 80 端口建立出站连接。所有协议，或者可能是某些其他目标端口，通常会被拦截。大多数防火墙阻止到未知端口的连接，但包含代理服务器的防火墙会检查请求和响应的内容，这些防火墙会拦截其他服务，因为不同服务的消息无法识别并会被丢弃。


    HTTP 通常能够穿过防火墙，因此它是隧道化的常用选择。隧道技术是一种使用一种协议作为另一种协议的传输层的技术。例如，你可以使用 HTTP 作为 RMI 或
    CORBA/IIOP 消息的传输层。请求被封装在 HTTP 请求中（通常是 POST 请求）并发送到隧道代理服务器，该服务器是一个模仿 Web 服务器的服务器。隧道代理服务器获取请求并将其转换为发送给真实服务器的本地请求。当本地响应到达隧道代理服务器时，它会被封装在
    HTTP 响应中并传回客户端。客户端必须以 HTTP 封装的格式创建其请求并解封装它们收到的响应。这种技术很常见，因为客户端端的防火墙很常见且不在服务器管理员的控制范围内，但它是无效的。你应该尝试避免使用隧道化；具体来说，在你同时控制客户端以及客户端与服务器之间所有防火墙的情况下，不要在任何情况下使用它。


    # 7.2 HTTPS


    HTTPS 不是单一协议，而是而是基于 SSL 传输的 HTTP 的结合。HTTP 和 SSL 的属性都体现在 HTTPS 中。通过引入 SSL，你获得了以下三个益处：加密、身份识别和会话状态。


    SSL 使用任意数量的协议提供加密。当 SSL 建立连接时，它首先协商使用哪种协议。结果应该是两端支持的最强加密算法。当然，如果其中一方仅支持弱的加密算法，则生成的连接将是不安全的。对于对加密强度重要的系统，你应该验证所选的算法是可接受的。你可以通过编程或询问用户来做到这一点，但要考虑用户是否有能力做出明智的判断。


    如果参与建立 SSL 连接的某方证书，那么 SSL 就可以将此发送给另一方。这允许另一方验证第一方的身份。验证并不是 100% 确定的，尽管验证的数学过程非常接近完美。弱性主要源于人为问题，例如第三方复制了证书合法所有者的私钥。此类问题在第
    5 章“安全”中会有讨论。


    SSL 连接是有状态的，并且正因如此，HTTPS 可以支持会话，而不会产生 URL 重写或 cookie 的安全风险。然而，由于 HTTPS 直接源于 SSL，连接的建立要慢得多。这是协议协商的直接结果，无法避免。


    # 7.3 IIOP


    Internet-ORB 协议 (IIOP) 是 CORBA 系统用于在网络上调用方法并传递参数以及这些方法的返回数据的协议。CORBA API 及其 IIOP
    一样，适用于许多平台和编程语言，包括 Java 编程语言。这种平台和语言的独立性在连接到遗留系统时使用 IIOP，可能是一个重大的益处；如果你必须在遗留系统的主机上安装支持代码，那么不要忽略通过在该宿主机上安装
    JVM 并直接使用 RMI 的可能性，毕竟 JVM 是免费的，而且你可能在系统的其他部分也在使用它。


    CORBA 系统定义了大量的标准服务，涵盖了各种垂直和水平市场。CORBA 的水平服务包括但不限于：命名、安全和事务管理。CORBA 服务通常不是免费软件，尽管它们可能被包含在
    CORBA 软件包中。然而，如果本地网络上安装了任何 CORBA 服务，那么访问这些服务的能力对于在你的系统中使用 IIOP，可能是一个重大的益处。


    Java 技术系统以两种方式使用 IIOP：通过使用 Java IDL API 或通过运行 RMI IIOP。Java IDL API 是在 Java 中使用
    CORBA 的最直接的方法。在 IIOP 上运行 RMI 允许在利用 IIOP 作为底层传输层的同时，保持大部分代码的简单性。


    有时你可能需要在一个不在你自己的系统上运行客户端程序。在这种情况下，网络可能存在不允许出站流量的防火墙。这种防火墙通常通过其他允许的端口或协议进行隧道化。通常是
    80 端口且协议是 HTTP。IIOP 知晓这些问题并可以穿透 HTTP。


    # 7.4 JRMP


    JRMP 是 RMI 的原生传输协议。与 IIOP 类似，它可以在网络上调用方法并传递参数、返回值和异常。RMI 通常不带有大量的服务，尽管它包含一个命名服务。然而，与
    IIOP 最显著的区别是 JRMP 不将参数和返回类型限制为数据值，它处理对象。对象具有状态和行为，这意味着 JRMP 提供了一种机制，将对象的类文件传输到参数或返回值的接收方（异常）。这种类的复制是按需进行的以避免带宽。在复制类的地方，你必须完成额外的管理设置。由于这些任务没有执行或执行错误，你有时会发现
    RMI/JRMP 系统表现出 CORBA 的有限行为，即不在网络上移动，只移动状态。只要系统是这样设计的，这并不总是问题；事实上，它可以带来略高的性能和略低的网络带宽消耗。


    由于 JRMP 是 RMI 的原生协议，且不需要支持各种不同的主机格式和字节序，因此在 JRMP 上设置参数和返回值的开销比语言中立的系统要小。


    JRMP 默认不包含加密或身份识别。然而，很容易设置 JRMP 使用 SSL 作为传输。这通过使用“套接工厂”来实现。关于此机制的更多信息请参见 API 文档。此外，Java
    身份验证和授权服务 (JAAS) 是一个用于分布


