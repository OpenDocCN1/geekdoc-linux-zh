    originating host. The applet doesn''t need any special access to the local file
    system, or other privileged resources.


    The applet described in B is described as needing to connect to arbitrary hosts.
    If the connection could be handled in a hub and spoke manner, using the originating
    hosts as the hub, then the scheme could be made to work, as documented, it will
    fail because of the security manager restrictions.


    The applet described in C would be difficult to arrange because the disconnected
    mode requires data to be stored on the local system. If the client wants to, then
    this can be arranged, but it will be prohibited by the default configuration of
    the security manager.


    The applet described in D would require full access to the window system. The
    security manager permits only access to the window system—specifically to read
    the events that were directed at windows that are owned by the applet.


    The applet described in E would not be able to list all the values of the properties,
    because some properties are considered privileged by the security manager. It
    would also be reasonable to expect any such utility to edit and store these values,
    both of which would also be prohibited behaviors.


    - 2. Which ability might be granted to a typical applet?


    A. Reading a file

    B. Writing a file

    C. Reading a system property

    D. Writing a system property

    E. Setting a thread to maximum priority


    A: The correct answer is C.

    Not all properties can be read by untrusted code, but some are at least readable
    inside the normal sandbox. Modification of properties is never permitted. Normally,
    no access is granted to any files, for read or write, and thread priorities are
    limited to reduce the chance of CPU hogging.


    # Objective: Given an architectural system specification, identify appropriate
