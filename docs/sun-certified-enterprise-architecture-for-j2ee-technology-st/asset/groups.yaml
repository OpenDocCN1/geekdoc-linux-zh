    \n![img/5715971f4d127ce2608f26dd89411b_143_0\n\n应用层划分为以下包：客户、订单和目录。客户包包含创建和维护账户的组件。订单包包含处理订单和退货的组件。目录包包含搜索和浏览目录的组件。图\
