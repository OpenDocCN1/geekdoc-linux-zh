    ## 简单的防火墙安装


    图 5-1 展示了一个简单的防火墙安装。


    ### 图 5-1 防火墙安装


    ![](img/5715971f4d127ce26084f269dd89411b_102_0.png)


    在简单的情况下，构建一个如之前所示仅使用单个防火墙保护的网络即可。在这种布局中，内部网络任何系统与互联网上任何系统之间传输的消息都必须通过防火墙。这种系统的管理相对简单，对于对外提供的服务较少的网络可能提供足够的保护。例如，如果你的网络只允许外部连接传入电子邮件。


    在单防火墙配置中，防火墙安全的任何突破都会立即完全让你的网络暴露在直接攻击之下。这就是这种简单系统通常不适用于公司网络的主要原因。


    ## 两个防火墙和一个 DMZ


    图 5-2 展示了带有非军事化区（DMZ）的两个防火墙。


    ### 图 5-2 两个防火墙和一个 DMZ


    ![](img/5715971f4d127ce26084f269dd89411b_103_0.png)


    在这种方法中，外部防火墙允许进出 DMZ 的服务之间有大量流量，但内部区域与互联网之间允许的流量很少，或者通常不允许任何流量。在消息必须从位于 DMZ 的代理服务器传递的情况下，传入消息永远不会直接发送到内部网络，而是只发送到
    DMZ 中的 Web 服务器或代理服务器。如果合适，该服务器可能会选择将消息转发到内部网络，或者可能向内部机器格式化一个新请求，以便其回答收到的请求。


    复杂的布局是可能的，而且在许多情况下是合适的，但大多数是这种布局的变体，即在某些层周围包裹多层保护。例如，某些系统不应让公司网络内的普通用户访问。财务、薪资和人力资源系统通常属于此类。。在主网络内部为此类系统创建内部受保护区域是合理的。图
    5-3 展示了这一概念。


    ### 图 5-3 安全保护系统


    ![](img/5715971f4d127ce26084f269dd89411b_104_0.png)


    这种布局开始解决内部攻击问题，同时大大增加了你系统中更敏感部分的安全性。


    这些配置中的共享许多共同主题：


    - 防火墙、DMZ 和类似的保护机制的作用是增加破解你中心网络所需的努力。这种布局也有助于减慢攻击者的速度。它们不应被视为“绝对防御”。

    - 除非经过深思熟虑并决定这些消息是必要的且值得承担其可能带来的任何代价，否则不应允许任何消息通过任何防火墙。这些决定应该由一个胜任的安全委员会做出。这些决定应该具体到哪些机器可能会接收或产生这些消息。

    - 消息通常不应直接传递到防火墙后的任何系统。相反，所有消息都通过代理进行传递。Web 服务器作为代理（使用 servlets 和其他技术）连接到服务器和数据库。

    - 代理软件的设计应该简单，并运行在服务最少的系统上，以便提供最少的攻击点。Web 服务器比理想的代理要复杂得多。


    ## 5.8 监控


    许多人认为防火墙是一个“装好后就可以不管”的选项；事实并非如此。你应该假设受防火墙保护的网络仍然是脆弱，尽管你可以合理地预计攻击它将花费更多时间。


    为了进一步提高网络的安全性，你应该安排对通过 DMZ 的活动进行持续监控。这种想法是，如果有人尝试入侵你的网络，你有机会在他们成功之前注意到这些尝试，因此你有机会保护他们试图攻击的任何东西。在许多情况下，这种机会可能只是暂时拔掉你的主互联网连接点。


    如果你必须查看每一个进出你网络的数据包，那么你检测异常活动的机会将非常小。因此，有效监控的一个关键是将大部分工作自动化。如果系统进现在发生可疑情况时通知你，你就有更大的机会进行有效监控。


    有很多监控工具可用，通常内置或由第三方提供。你应该研究这些工具，并将它们的功能与你的网络必须允许的活动类型进行比较。此外，你可能还可以监控应用程序的行为。监控
    UNIX 程序的一个粗略但有效的示例是在 `truss` 命令下运行程序。你使用 `truss` 命令列出程序执行的所有内核调用以及调用的参数。如果你使用
    `grep` 命令搜索该列表中的不应发生的内核调用，你就能在某些类型的攻击中发现它。


    也许监控最大的问题是“误报”问题。如果一个网络监控系统经常抱怨发生了奇怪的事情，而大多数时间证明是虚假的，那么人们就会倾向于开始忽略它的警告。这与“放羊的小孩”完全相似。


    ## 5.9 隧道技术


    隧道技术（Tunneling）是创建隐蔽通道的一种，即为某种类型的消息创建通信路径，但使用的路径实际上是用于其他类型消息的。隧道可以用于绕过防火墙限制，以进入网络或离开网络。使用隧道技术离开网络可能是一种合理的行为，但用它进入网络通常意味着某人不理解自己的工作。本节的其余部分将讨论这两个选项，以便让你理解设置隧道技术的优势和成本，并使你能够在何时使用它时做出决定。


    ## 隧道进入网络


    一旦设置了防火墙和 DMZ，向内部网络添加新的可从访问的服务就会变得更加困难。首先，这是因为由于防火墙的正常运行，这些服务对互联网是不可见的。


    要向你的 DMZ 添加新服务，必须通过防火墙授予访问权限。这可能涉及通过防火墙的数据包过滤路由器元素开启一条新路由。


    面对这种情况时，实际上只有三种处理方法：


    - 决定该服务对业务至关重要并放弃该项目。

    - 说服防火墙管理员该服务对业务至关重要，并说服他们允许。

    - 使用防火墙中现有的开启通道创建一个管理员不知道的隐蔽通道。


    如果你的工作是提供服务，选项 1 可能是不可接受的。选项 2 从政治角度来看似乎是不可能的。然而，选项 3 看起来也很怀疑。你实际上在欺骗你的公司并故意破坏你的安全措施。然而，流行的“通过
    80 端口隧道”方案正是这种行为。


    ## 隧道离开网络


    虽然隧道技术实际上是解决政治而非技术问题的方案，但有时问题并不在你的控制范围内。当你编写运行在他人网络内部的应用或其他客户端，并且需要访问你在自己的网络内部运行的服务时，这种问题是合法的会出现。假设你创建了一个你想让客户使用的应用程序。该客户可能位于一个限制输出消息的防火墙之后。


    在这种情况下，考虑简单的将你的新服务运行在特定端口（通常是 80 端口）上是否足够。

