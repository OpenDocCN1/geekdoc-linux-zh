    - 6. 系统返回应付总额和支付方式。\n- 7. 客户选择信用卡支付。\n- 8. 系统从支付服务器获取信用卡批准，分配订单号并将订单发送到库存系统。\n\
    \n## 备用流程\n\n以下描述了“结账”用例的备用流程：\n\n- 无客户账户（主流程中的第 3 步）：\n  - 3a. 用户没有账户，因此用户选择“创建客户账户”，这会调用账户用例并返回主流程的第\
