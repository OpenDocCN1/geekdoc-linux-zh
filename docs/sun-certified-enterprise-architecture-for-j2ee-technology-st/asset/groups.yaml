    # Physical Security and the Insider


    Despite the obvious and newsw troubles caused by script-kiddies (usually youngsters
    programmers with hacking tools they found on the Internet), international politically-motivated
    viruses, and deliberate attacks directed against specific businesses, the majority
    of fraud still involves an insider. Disaffected employees or, perhaps more commonly,
    ex-employees, go into the systems of their company either to damage or steal money,
    intellectual property, or more sensitive information. No amount of technical wizardry
    can address this, it is a personnel and physical security issue. however, building
    any system, you should not ignore such issues—always remember that it carries
    less glamour and romance, and typically does not involve technical solutions,
    these issues should be addressed early, often, and continuously. Your role here
    is to ensure that management understands the issues. For more information about
    this subject, see the examples in the book Intranet Security: Stories from the
    Trenches.


    # External Threats


    Obviously, not every attack is the carefully thought out plan of an insider. External
    attacks are damaging from a publicity point of view, potentially expensive in
    direct losses and in the cost of repairs, and they are also annoying. These attacks
    can be categorized in two groups; those that take place in real time, with someone
    or some program actively and continuously sending messages across the network
    to try to control some part of your system, and those in which a program is sentreptiously
    sent to your system with the intention that it will take some control at a later
    time. These two vectors involve different operating practices, but may exploit
    similar weaknesses.


    Real-time attacks generally involve sending messages to your system that resemble
    legitimate service requests, that, if successful, give the attacker more access
    than should be allowed. These attacks range from the simple attempt to guess a
    user name and password pair to more esoteric attempts to break the network software
    of your systems by exploiting a bug. In case of this category, if the messages
    do not reach your system, then your systems remain reasonably safe.


    Delayed time attacks are epitomized by the virus. A program that is designed to
    copy itself onto other systems finds a way onto one of your systems. It then uses
    system similar to start attacking the other systems it finds around it, propagating
    in a manner similar to a disease. Some viruses are intended to damage, often randomly,
    while others install "back doors”—trojan-horse-like programs that allow more,
    possibly real time, access later.'
