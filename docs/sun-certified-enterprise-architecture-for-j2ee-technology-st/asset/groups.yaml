    ## Introduction


    There are many different definitions of the word architecture. Webster''s definition
    is "the art or science of building." Webster''s computer definition of architecture
    is "the manner in which the components of a computer or computer system are arranged
    and integrated." This chapter presents a variation of Webster''s definition of
    architecture with the remainder of the book re-enforcing this definition.


    Creating an architecture to build a system has grown ten-fold in the last couple
    of years, due to the growth of the Internet. Before the Internet, an architect
    created an architecture to handle the internal users of the company, which could
    number in the hundreds. However, the Internet has opened a company''s computing
    resources to their customers, which means the architect must now create a system
    architecture that can handle thousands of users with unpredictable usage patterns.
    If your systems do not perform and meet the expectations of the customers, then
    these customers will find other companies with systems that can handle their expectations.
    Therefore, the architectures you can create have a direct impact on your company''s
    bottom line.


    ## Prerequisite Review


    In an attempt to keep this book from getting larger than the dictionary, it assumes
    a certain level of knowledge for the readers. If you do not have the prerequisite
    knowledge, you must gain this knowledge elsewhere before proceeding with this
    book. This book assumes the following prerequisites:


    - You understand object-oriented concepts, such as encapsulation, inheritance,
    polymorphism, and interfaces.

    - You have programmed in an object-oriented language, preferably the Java programming
    language.

    - You have designed object-oriented programs and systems.

    - You are using this book to prepare for the Sun Certified Enterprise Architect
    (SCEA) for Java 2 Platform, Enterprise Edition Technology exam.


    Becoming a full-fledged system architect requires years of real world experience
    creating architectures and designing systems. This book will provide you with
    the knowledge you need to start gaining valuable experience, as well as prepare
    you to become a Sun Certified Enterprise Architect for Java 2 Platform, Enterprise
    Edition (J2EE) technology.


    # Discussion


    The best starting point for this book, is to make sure you are on the same page
    as the exam developers. Having this common vocabulary will reduce confusion in
    the later chapters. A clear and concise definition of architecture is imperative
    to your success on this exam. Once you understand the definition, you must understand
    your role in creating an architecture. You must realize what your tasks are. Finally,
    you must understand the purpose of creating architecture. You create an architecture
    to support the service-level requirements of a system. Without service-level requirements,
    your systems cannot meet customer demand for availability, reliability, and scalability.
    This is service-level requirements that keep a company from having a “CNN” moment,
    which occurs when the failure of your computer systems makes news on CNN.


    ## 1.1 Understanding Architecture


    According to the Unified Process:


    > Software architecture encompasses the significant decisions about the organization
    of a software system. The selection of the structural elements and their interfaces
    by which the system is composed together with their behavior as specified in the
    collaboration among elements. The composition of the structural and behavioral
    elements into progressively larger subsystems, the architectural style that guides
    this organization, elements, and their interfaces, their collaborations, and their
    composition. Software architecture is concerned not only with structure and behavior
    but also with usage, functionality, performance, resilience, reuse, comprehensibility,
    economic and technology constraints and trade-offs, and aesthetic choices.[1]


