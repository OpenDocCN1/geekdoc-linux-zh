    # 第 4 章. 设计模式


    4.1 创建模式


    4.2 结构模式


    4.3 行为模式


    模式最早由 20 世纪 70 年代一位名为 Christopher Alexander 的建筑师使用。他发现某些解决方案可以反复应用于相同或相似的问题。他还将组合这些现有的解决方案来为新问题创建新的解决方案。1987
    年，Ward Cunningham 和 Kent Beck 开发了五种用于接口设计的模式。但直到 1994 年，Erich Gamma、Richard Helm、John
    Vlissides 和 Ralph Johnson 才出版了著名的《设计模式：可复用面向对象软件的基础结构》，书中描述了一种记录模式的方法，这种方法已成为行业标准。这些人通常被称为“四人帮”（GoF）。随着新模式的开发，大多数模式都遵循《设计模式》一书中描述的文档标准。


    本章介绍了你可以如何使用模式来帮助你创建架构。这些模式通常处于对象和类级别，但它们也可以抽象到更高的层次。


    在完成本章后，你将能够满足以下 J2EE 技术考试目标：


    - 从列表中为给定场景选择最合适的设计模式。模式将限于 Gamma 等人在书中记录的，并使用书中给出的名称。

    - 陈述使用设计模式的益处。

    - 给定 UML 图和/或对模式功能的简要描述，陈述 Gamma 等设计模式的名称。

    - 从列表中选择指定的 Gamma 等设计模式的益处。

    - 识别与指定的 J2EE 特性相关的 Gamma 等设计模式。


    # 预备复习


    本章假设你已经熟悉《设计模式：可复用面向对象软件的基础结构》中描述的四人帮（GoF）模式。本章将在考试目标的背景下复习这些模式，以涵盖考试所需的材料。


    # 讨论


    设计模式是软件开发中遇到的常见问题的通用解决方案。在本章中，我们从以下方面描述了模式：


    - 名称 – 用于识别模式的问题、解决方案和后果的标签。模式名称应具有描述性，并保持在一或两个词内。

    - 描述 – 模式的简短描述，以及一个 UML 图和代码示例均用于定义模式。

    - 益处 – 描述使用指定模式的优势。

    - 使用时机 – 描述在应用程序设计中何时应该使用该模式。


    GoF 模式有三种：


    - 创建模式

    - 结构模式

    - 行为模式


    # 4.1 创建模式


    创建模式支持系统中对象的创建。创建模式允许在系统中创建对象，而无需在代码中识别特定的类类型，你不需要编写大型、复杂的代码来实例化对象。它通过让类的子类创建对象来实现。然而，这可能会限制系统中可以创建的对象的类型或数量。


    string描述了以下创建模式：


    - 抽象工厂（Abstract Factory）

    - 建造器（Builder）

    - 工厂方法（Factory Method）

    - 原型（Prototype）

    - 单例（Singleton）


    # 抽象工厂模式


    该模式提供了一种接口，用于创建相关或依赖的对象族，而无需指定它们的具体类。


    给定一组相关的抽象类，抽象工厂模式提供了一种从匹配的一组具体子类创建这些抽象类实例的方法。图 4-1 展示了抽象工厂模式。


    图 4-1. 抽象工厂模式


