    作业的交付物是类图、组件图和序列图。只要您提供了所需的图表，额外的将不会加分。\n\n## 层级图\n\n层次图显示了系统的分层。应用层是代码所在的地方，通用服务代码除外。通用服务代码在多个系统中共享。上层由\
