    # Appendix A. Certification Success Guide


    Java™ technology certification is a valuable, career-building opportunity—and
    a great way to help you take charge of your career. Sun Educational Services is
    behind you from the start with education, training, and the resources you need
    to help you reach your certification goals.


    Sun Educational Services offers coursework and certification to support you in
    expanding your career opportunities and creating the systems and applications
    that fuel the future. The learning paths provide at-a-glance training and education
    information, so you know what you need to learn to successfully prepare for exams.


    # The Benefits of Certification


    # For The Individual


    Becoming certified in Java technology can help you improve your career potential,
    gain more respect, and increase job security. With certification, you have hard
    evidence that you''re qualified for the tasks that lie ahead, helping you increase
    your opportunities for professional advancement, such as salary increase, job
    role modifications, and promotions.


    # For The Corporation


    Corporations that employ certified individuals do so to gain a competitive advantage.
    The skills that are verified during the certification process are the same skills
    that can help lead to decreased time to market, increased productivity, less system
    failure, and higher employee satisfaction rates.


    Recruiting certified employees and certifying existing employees can lead to a
    more stable work environment, which in turn can lead to greater success as a whole.
    When companies demonstrate that they are willing to invest in their employees,
    those employees can be more productive, more loyal, and are more likely to remain
    in their jobs.


    # Certification Requirements Checklist


    The Sun Certified Enterprise Architect for J2EE™ Technology is composed of three
    elements: a multiple-choice exam, an architecture and design project, and an essay
    exam.


    You must successfully complete all three elements to become certified. The exam
    details are as follows:'
