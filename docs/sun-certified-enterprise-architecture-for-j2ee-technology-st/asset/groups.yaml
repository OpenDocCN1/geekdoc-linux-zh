    if a cached page can be refreshed. To this, the HEAD request returns the date
    and time associated with the Web page and this can be compared with the date and
    time associated with the cache.


    By default, Web servers, and therefore HTTP requests use port 80. However, the
    port mechanism does not influence or control the data that can be passed over
    the port, so you can use any other port that might suit your needs. For example,
    you might need to run a Web server on a port other than 80 if you are running
    a second server on the same machine. Each port can be used by one process, so
    the two servers must have different ports. Ports with numbers up to 1024 are considered
    privileged in UNIX systems and cannot be opened by processes unless those processes
    have root privileges. If you use ports other than 80 for Web servers, the most
    common choices are 8000, 8080, 8008, and other ports in the range 80xx. Remember
    though, these port numbers are not significant to either HTTP, the Web server,
    nor to the TCP/IP mechanisms.


    The port number for any given request is embodied in the URL, and if there is
    no specific port number in the URL, then 80 is assumed. Because the majority of
    URLs loaded by a Web browser are taken directly from a Web page (as a result of
    the user following a link), using nonstandard port numbers is not usually a problem
    for the user. However,'
  - '[PAGE 125]


    you should minimize the complexity of any URL the user might type as a starting
    point. For this reason, if you can use port 80 for your home page, you probably
    should do so.


    The HTTP protocol is stateless and this sometimes causes difficulty in complex
    situations. A stateless protocol means that each request/response pair is an isolated,
    self-contained, unit. Data from an earlier request or response is not available
    to subsequent responses. This is not an issue when loading static Web pages, which
    is unacceptable in many Web applications. Consider a typical shopping cart application.
    Some state must be maintained between requests, otherwise it is impossible to
    associate the contents of one particular shopping cart with any particular request.


    You can add state to a browser connection using one of the following:


    +   * Cookies

    * URL rewriting

    * HTTPS

    * Applets and other clients


    A cookie is a variable, or name-value pair that is set by the Web server and stored
    on the browser. The browser can query the value of a given cookie and thereby
    associate a new request that a client makes with earlier requests. This allows
    the server to maintain state across multiple requests. Although a simple and offseason
    mechanism itself, browsers have suffered from a number of bugs in the implementation
    of cookies. These bugs have led to security breaches and as some result users
    are not willing to allow their browsers to provide cookies to servers.


    # URL Rewriting


    URL rewriting is a technique in which the server modifies every link in a given
    Web page so that the URLs are unique to this client. When the browser follows
    a link in the page, it submits the modified URL and the server can make the logical
    connection between this new request and the previous one. This technique has a
    number of weaknesses, but is useful if a client has disabled cookies. The problem
    is that a user tries to use a URL or keeps a bookmark, then it is unlikely these
    URLs will reflect the correct rewriting and jumping to one of them will lose the
    state. Another problem is that this technique is susceptible to security risks.
    Arguably, the risks with URL rewriting are greater than those of cookies, because
    the risks are systemic rather than implementational. Specifically, if a user jumps
    to a new site, the new site can read the URL of the referring page. Because this
    URL has been rewritten and includes the state of the connection, it becomes possible
    for the new server to “break into” the user’s connection with the original host.'
