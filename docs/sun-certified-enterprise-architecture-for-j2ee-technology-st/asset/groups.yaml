  mdcn: '

    在以下情况下，你应该使用组合模式：


    - 您想要表示对象的整个层次结构或该层次结构的某部分。

    - 您希望客户端能够忽略对象组合与单个对象之间的区别。

    - 结构可以具有任何级别的复杂度，并且是动态的。


    ## 装饰器模式


    装饰器模式允许你在不改变对象外部外观或功能的情况下，添加或移除对象的功能。它通过使用原始类子类的实例，并将操作委托给原始对象，从而以一种对客户端透明的方式来改变对象的功能。装饰器动态地为对象附加额外的职责，为不使用静态继承的情况下改变对象功能提供了一种灵活的替代方案。图
    4-9 阐了装饰器模式。


    ## 图 4-9. 装饰器模式


    ![](img/5715971f4d127ce26084f269dd89411b_66_0.png)


    ## 优点


    以下列出了使用装饰器模式的优点：


    - 比静态继承更具灵活性

    - 避免在层次结构高层出现功能密集的类

    - 简化了编码，因为你编写的是一系列类，每个类都针对功能的特定部分，而不是将所有行为编码到对象中

    - 增强了对象的可扩展性，因为你通过编写新类来做出更改


    ## 使用时机


    在以下情况下，你应该使用装饰器模式：


    - 您想动态且透明地为单个对象添加职责，即不影响其他对象对象。

    - 您想为未来可能想要更改的对象添加职责。

    - 当通过子类进行扩展不切实际时。


    ## 外观面模式


    外观面模式为子系统中的一组接口提供统一的接口。

    外观面模式定义了一个更高层次的接口，使得子系统更容易使用，因为你只需要一个接口。这个统一接口允许对象仅通过与子系统通信的接口来访问子系统。图 4-10 阐了外观面模式。


    > 图 4-10. 外观面模式


    ![](img/5715971f4d127ce26084f269dd89411b_67_0.png)


    ## 优点


    以下列出了使用外观面模式的优点：


    - 在不减少系统提供的选项的情况下，为复杂系统提供简单的接口。

    - 将客户端与子系统组件隔离。

    - 促进子系统与其客户端之间的弱耦合。

    - 如果每个子系统都使用自己的外观面模式，系统的其他部分使用外观面模式与子系统通信，则减少子系统之间的耦合。

    - 将客户端请求转换为可以这些这些请求的子系统。


    ## 使用时机


    在以下情况下，你应该使用外观面模式：


    - 您想为复杂的子系统提供一个简单的接口。

    - 客户端与抽象的实现类之间存在许多依赖。

    - 您想对子系统进行分层。


    ## 享重量模式


    享重量模式通过共享对象来减少系统中低级、详细对象的数量。如果包含相同信息的类实例可以互换，享重量模式允许程序通过共享一个实例来避免多个包含相同信息的实例的开销。图
    4-11 阐了享重量模式。


    > 图 4-11. 享重量模式


    ![](img/5715971f4d127ce26084f269dd89411b_68_0.png)


    ## 优点


    以下列出了使用享重量模式的优点：


    - 减少了处理的对象数量

    - 如果对象是持久化的，则减少了存储设备上的内存和代理


    ## 使用时机


    在满足以下所有条件的情况下，你应该使用享重量模式：


    - 应用程序使用了大量对象。

    - 由于对象的数量，存储成本很高。

    - 应用程序不依赖于对象标识。


    ## 代理模式


    代理模式提供一个代理或占位对象来控制对原始对象的访问。代理模式有几种实现类型，其中远程代理和虚拟代理是最常见的。图 4-12 阐了代理模式。


    ## 图 4-12. 代理模式


    ![](img/5715971f4d127ce26084f269dd89411b_69_0.png)


    ## 优点


    以下列出了使用代理模式的优点：


    - 远程代理可以隐藏对象位于不同地址空间的事实。

    - 虚拟代理可以执行优化，例如按需创建对象。


    ## 使用时机


    在以下情况下，你应该使用代理模式：


    - 你需要一个比简单指针更多功能或更复杂的对象引用。


    ## 4.3 行为模式


    行为模式影响状态和行为在系统中的流动。通过优化状态和行为传输和修改的方式，你可以简化、优化并增加应用程序的可维护性。


    文中描述了以下行为模式：


    - 责任链

    - 命令

    - 解释器

    - 迭代器

    - 中介者

    - 备备

    - 观察者

    - 状态

    - 策略

    - 模板方法

    - 访问者


    ## 责任链模式


    责任链模式在系统中建立了一条链，以便消息可以在最初接收的级别被处理，或者定向到可以处理它的对象。图 4-13 阐了责任链模式。


    > 图 4-13. 责任链模式


    ![](img/5715971f4d127ce26084f269dd89411b_70_0.png)


    ## 优点


    以下列出了使用责任链模式的优点：


    - 降低了耦合

    - 增加了分配职责的灵活性

    - 允许一组类作为一个整体行为，因为在类类中产生的事件可以发送给其他处理类


    ## 使用时机


    在以下情况下，你应该使用责任链模式：


    - 多个对象可以处理请求，且未知处理者。

    - 您想在不明确指定接收者的情况下向多个对象发布请求。

    - 处理对象的集合应该是动态。


    ## 命令模式


    命令模式将请求封装在对象中，这允许你存储命令、将命令传递给方法并像其他对象一样返回命令。图 4-14 阐了命令模式。


    ## 图 4-14. 命令模式


    ![](img/5715971f4d127ce26084f269dd89411b_71_0.png)


    ## 优点


    的优点：


    - 将调用操作的对象与知道如何执行操作的对象分离。

    - 添加新命令很容易，因为你不需要更改现有类。


    ## 使用时机


    在以下情况下，你应该使用命令模式：


    - 您想通过要执行的操作对对象赋值。

    - 您在不同的时间指定、队列和执行请求。

    - 您必须支持撤销、日志记录或事务。


    ## 解释器模式


    解释器模式解释一种语言以定义其语法的表示，以及一个使用该表示来解释语言中句子的解释器。图 4-15 阐了解释器模式。


    ## 图 4-15. 解释器模式


    ![](img/5715971f4d127ce26084f269dd89411b_72_0.png)


    ## 优点


    以下列出了使用解释器模式的优点：


    - 易于更改和扩展语法

    - 实现语法简单


    ## 使用时机


    在以下情况下，你应该使用解释器模式：


    - 语言的语法简单。

    - 效率不是关键问题。

    '
