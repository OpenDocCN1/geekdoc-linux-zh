    how two hosts connect, pass certificates between one another, negotiate keys to
    use, and decide on an encryption mechanism. At this time, SSL is the de-facto
    standard for all Internet-based secure communications.


    The SSL standard, currently Internet Engineering Task Force (IETF) Transport Layer
    Security 1.0 (TLS 1.0) on SSLv3, is not a standard for encryption, but is a framework
    for negotiating a acceptable set of encryption and key exchange protocols. SSL
    is not the primary source of security in a connection, rather, the connection
    security is mainly provided by the encryption algorithms and key handling protocols
    selected by SSL in its negotiations.


