    # 2.9 Uses of Entity Beans, Stateful Beans, and Stateless Beans


    Entity beans are used to persist the entity data. The entity bean is a sharable
    enterprise data object that can be used by many users concurrently.


    The stateless session bean is used to manage the state of a users session on the
    server. An example of a stateless bean would be used to implement the business
    logic and workflow of an application.


    # 2.10 Managing EJB Using Bean Pooling


    The container cannot handle an unlimited number of EJB, therefore the container
    must pool the resources and share them across users. Each EJB, when deployed,
    specifies the number of instances to pool and reuse. EJB are not lightweight objects
    that can be created and destroyed when necessary. They are heavy objects that
    take considerable resource to create and destroy. Therefore, the application server
    will manage a pool of EJB that users can use throughout the application. By having
    this pool, the application server can handle more requests if it does not spend
    time creating and destroying objects.


    # 2.11 Passivation of EJB


    Passivation is the process of writing the bean''s state to a file on the file
    system, so the instance of the bean can be used by another session. You use passivation
    to handle more'
