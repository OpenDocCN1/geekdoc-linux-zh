    - 1. The client invokes create(args) method on home interface.

    - 2. The container invokes newInstance() method on the bean.

    - 3. The bean calls the setSessionContext() method and the ejbCreate() method
    on the instance and the EJB object reference to the client. The instance of the
    stateful bean is ready to accept business methods.

    - 4. Based on the transaction context, the stateful bean invokes the method with
    either the tx method or non-tx method. Nontransaction methods are executed while
    the bean is in a ready state. The invocation of the transactional method causes
    the instance to be included in transaction. The container issues the afterBegin()
    method on the bean.

    - 5. If a transaction commit has been requested, the transaction service notifies
    the container, which uses a beforeCompletion method on the bean instance.

    - 6. The transaction service attempts to commit the transaction, resulting in
    either a commit or rollback.

    - 7. When the transaction is complete, the container issues the afterCompletion()
    method on the bean instance specifying the status of completion as either commit
    or rollback. If the status is rollback, the bean instance might need to restore
    the conversational state.

    - 8. The container might decide that the bean instance should be evicted from
    memory. In this case, the container issues an ejPassivate() method on the instance.

    - 9. While in a passivated state, the container can remove the instance after
    a timeout has expired. If a client attempts to access the bean instance, the container
    throws java.rmi.NoSuchObjectException.

    - 10. If a client invokes a passivated bean that has not timed out, the container
    restores the bean''s state from secondary storage and issues ejActivate() method.
    The bean instance is again ready for client methods.

    - 11. When a client calls the remove() method on an EJB object, this causes the
    container to issue the ejRemove() method on the bean.


    The only option if a client invokes the cost of creating a bean session is if
    one does not exist. If a bean already exists, then is pulled from the method-ready
    pool, used and replaced when done. This is a pool of beans that improves the scalability
    of the application by being able to handle more requests with fewer resources.


    ## 2.9 Uses of Entity Beans, Stateful Beans, and Stateless Beans


    Entity beans are used to persist the entity data. The entity bean is a sharable
    enterprise data object that can be used by many users concurrently.


    The stateless session bean is used to manage the state of a users session on the
    server. An example of a stateless bean would be used to implement the business
    logic and workflow of an application.


    ## 2.10 Managing EJB Using Bean Pooling


    The container cannot handle an unlimited number of EJB, therefore the container
    must pool the resources and share them across users. Each EJB, when deployed,
    specifies the number of instances to pool and reuse. EJB are not lightweight objects
    that can be created and destroyed when necessary. They are heavy objects that
    take considerable resource to create and destroy. Therefore, the application server
    will manage a pool of EJB that users can use throughout the application. By having
    this pool, the application server can handle more requests if it does not spend
    time creating and destroying objects.


    ## 2.11 Passivation of EJB


    Passivation is the process of writing the bean''s state to a file on the file
    system, so the instance of the bean can be used by another session. You use passivation
    to handle more requests with fewer resources. This is only available with entity
    and stateful session beans. With a stateless bean, you cannot use passivation
    because there is no state. When the passivation session returns, the bean is activated
    and the bean state is reloaded into the instance of the bean.


    ## 2.12 Using Transactions


    Transactions are a big part of most enterprise applications, Transactions enable
    you to change your mind and return to a previous action (rollback) or go forward
    and commit the action. Without transactions, you cannot delete or change the work
    performed. A transaction must adhere to the ACID principal. It must be Atomic,
    Consistent, Isolatable, and Durable. Atomic means the transaction does not partially
    complete. It is either totally complete or is backed out to where it started.
    A consistent transaction leaves the datastore in a consistent state. You can access
    the datastore and get the correct result. An isolatable transaction is independent
    of another transaction outside of your control. Durable transactions should survive
    a system failure. If the system fails in the middle of the transaction, then the
    system should back out the transaction for consistency and atomicity.


    When you are a J2EE application, you decide where the transaction should take
    place. For example, should the transaction start in a servlet and propagate to
    an EJB or should the transaction fully contained in the EJB? You must also decide
    whether to use programmatic control or declarative control of the transaction.
    Programmatic control allows you to demonstrate the start of a transaction. This
    equates to bean-managed transactions (BMTs). There is no difference in BMT and
    CMT when the transaction has been managed. Both methods use the same rollback
    and commit process. Declarative transaction support is handled by the container
    and does not require you to code the declaration. Declarative control is used
    in container-managed transactions (CMTs). CMT allows the deployer to configure
    the bean at runtime by modifying the transaction attributes for bean methods.
    The transaction attribute defines the container''s behavior when a client is invoking
    the bean method. The following describes the six attributes that cover all behaviors
    for transaction support on [Table 2.1]


    - The Required attribute, the container ensures that the method is invoked with
    a transaction. If the calling client does not have a transaction, then the container
    starts a transaction. If the calling client has a transaction, then the container
    passes the transaction to the method.

    - The New attribute means that the container always starts a new transaction when
    invoking this method. If the calling client has a transaction, the container suspends
    the transaction and starts a new one. This is not a nested transaction because
    the outcome of the new transaction has no impact on the suspended transaction.
    If the calling client does not have a transaction, the container creates a new
    transaction.

    - The Not Supported attribute means the method cannot handle a transaction. If
    the calling client has a transaction, then the container suspends the transaction
    before invoking the method. If the calling client does not have a transaction,
    the container invokes the method.

    - The Supports attribute means the bean accepts a transaction if available, but
    does not require the application server to create a new transaction. If the calling
    client has a transaction, the container propagates the transaction to the method.
    If the calling client does not have a transaction, the container invokes the method.

    - The Mandatory attribute states that the calling client must have a transaction.
    If the calling client has a transaction, the container propagates the transaction
    to the method. If the calling client does not have a transaction, the container
    throws a java.transaction.TransactionRequiredException.

    - The Never attribute means the bean is not expecting a transaction. If the calling
    client has a transaction, then the container throws java.rmi.RemoteException.
    If the calling client has no transaction, then the container invokes the method.


    Table 2.1 summarizes the behavior of the container for each of the transaction
    attributes.


    # Table 2.1. Transaction Attributes


    | Transaction Attribute | Calling Client Has Transaction | Calling Client Does
    not have transaction |

    | --- | --- | --- |

    | Required | Transaction Propagated | New Transaction Started |

    | Requires New | Transaction suspended, then new transaction is started | New
    transaction started |

    | Not Supported | Transaction suspended | |

    | Supports | Transaction propagated | Throws java.transaction.TransactionRequiredException
    |

    | Never | Throws java.rmi.RemoteException | |


    ## 2.13 Using Container-Managed Persistence


    There are any entity bean can persist the object, container-managed persistence
    (CMP) or bean-managed persistence (BMP). In CMP, the container handles the implementation
    of the code necessary to insert, read, and update an object in a data source.
    In BMP, the application developer creates the implementation for the insert, read,
    and update of an object. CMP is the ideal way to develop an application because
    it requires less code changes by the application developer when the data model
    changes. However, to provide this flexibility, CMP does not generate the most
    efficient SQL.


    Unfortunately, the object relation mapping tools are still maturing. As the tools,
    you should use BMP with data access objects (DAO).

