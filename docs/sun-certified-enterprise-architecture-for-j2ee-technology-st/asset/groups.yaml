    ## 3.2 UML 中的通用机制


    UML 中贯穿始终四种通用机制：规范（specifications）、装饰（adornments）、划分（division）和扩展性（extensibility）。


    ### 规范


    UML 不仅仅是图形语言。在每个图形表示之后都有一个文本说明的规范。规范为构建块提供了完整set的属性、操作和行为。视觉上，规范可能只显示类的一部分，也可能显示整个类。考虑到这一点，你可以通过反向工程创建图形并构建规范。图
    3-17 包含了 -attribute1 和 +operation1()，它们是类的规范。


    ## 图 3-17. 类的规范示例


    | name |

    | -attribute1 |

    | +operation1() |


    ### 装饰


    装饰机制指示元素是公有的、私有的还是保护的，分别由 +, # 表示。在之前的示例中，attribute1 是私有的，operation1 是公有的。


    ### 划分


    划分指定元素的实例。例如，如果元素名称带有下线，它就是一个实例。你元素元素带有 :a 并拥有匿名实例。你可以在 : 前放置名称并拥有命名实例。图 3-18
    包含 :name，这意味着你有一个类的匿名实例。


    ## 图 3-18. 划分


    | :name | |


    ### 扩展性机制


    扩展性机制允许你根据项目需求塑造和扩展 UML。此外，这些机制通过从现有的 UML 构建块创建新的构建块，使 UML 快速适应新技术。


    - 模式（Stereotypes）：扩展 UML 的词汇，允许你创建新类型的构建块。这些构建块源自现有的构建块但特定于你的问题。

    - 标记值（Tagged values）：扩展 UML 构建块的属性，允许你在元素的规范中创建新信息。

    - 约束（Constraints）：扩展 UML 构建块的语义，允许你添加新规则或修改现有规则。


    ## UML 图


    图是元素集的图形化表示，通常渲染为由顶点（元素）和弧（关系）组成的连接图。


    ### 用例图


    用例图显示了一组用例和参与者及其关系。用例图处理系统的静态用例视图。这些图对于组织和建模系统行为特别重要。


