    the issues of protecting systems against abuse or attack. In principle, these
    issues are addressed by the notions of identification, authentication, authorization,
    and resource control that were discussed earlier. In practice, these issues are
    more complex than first described. The following sections examine some of the
    issues that surround protection of a distributed, Internet connected, computing
    system.


    # Physical Security and the Insider


    Despite the obvious and newsw troubles caused by script-kiddies (usually youngsters
    programmers with hacking tools they found on the Internet), international politically-motivated
    viruses, and deliberate attacks directed against specific businesses, the majority
    of fraud still involves an insider. Disaffected employees or, perhaps more commonly,
    ex-employees, go into the systems of their company either to damage or steal money,
    intellectual property, or more sensitive information. No amount of technical wizardry
    can address this, it is a personnel and physical security issue. however, building
    any system, you should not ignore such issues—always remember that it carries
    less glamour and romance, and typically does not involve technical solutions,
    these issues should be addressed early, often, and continuously. Your role here
    is to ensure that management understands the issues. For more information about
    this subject, see the examples in the book Intranet Security: Stories from the
    Trenches.


    # External Threats


    Obviously, not every attack is the carefully thought out plan of an insider. External
    attacks are damaging from a publicity point of view, potentially expensive in
    direct losses and in the cost of repairs, and they are also annoying. These attacks
    can be categorized in two groups; those that take place in real time, with someone
    or some program actively and continuously sending messages across the network
    to try to control some part of your system, and those in which a program is sentreptiously
    sent to your system with the intention that it will take some control at a later
    time. These two vectors involve different operating practices, but may exploit
    similar weaknesses.


    Real-time attacks generally involve sending messages to your system that resemble
    legitimate service requests, that, if successful, give the attacker more access
    than should be allowed. These attacks range from the simple attempt to guess a
    user name and password pair to more esoteric attempts to break the network software
    of your systems by exploiting a bug. In case of this category, if the messages
    do not reach your system, then your systems remain reasonably safe.


    Delayed time attacks are epitomized by the virus. A program that is designed to
    copy itself onto other systems finds a way onto one of your systems. It then uses
    system similar to start attacking the other systems it finds around it, propagating
    in a manner similar to a disease. Some viruses are intended to damage, often randomly,
    while others install "back doors”—trojan-horse-like programs that allow more,
    possibly real time, access later.


    In fact, the most common form of “virus” at the present time is really an active
    e-mail payload, it is a trojan horse not a virus, because it comes disguised as
    legitimate e-mail and uses the recipient to help it get into the target system.
    Once in the target system, it exploits poorly designed software to wreak havoc
    when you try to read it. As with real-time threats, if the attack never reaches
    your system, then it is unlikely to damage.


    One type of attack cannot be prevented by refusing to accept hostile messages.
    Denial of Service attacks (sometimes called DoS, DDoS, Distributed Denial of Service)
    by simply flooding the victim''s network connections. In these cases, refusing
    to accept or acknowledge the inbound messages does not help. The only effective
    protection is to have the routers in the Internet infrastructure recognize the
    malicious messages and refuse to forward them. This, unfortunately, is hard to
    achieve because it requires the cooperation of three parties.


    ## Keeping Attacks at Bay


    A number of techniques are in regular use that are intended to prevent attacks
    from ever reaching sensitive systems. The most fundamental of these is the packet-filtering
    router. This system provides a single point of connection between a group of sensitive
    systems (“the intranet”) and the outside world (the Internet). The router allows
    packets into the intranet only if they are destined for specifically listed systems
    on specific ports. That is, it allows network traffic to communicate only with
    specific server software. This type of approach can be quite helpful, and is simple
    to implement. It minimizes the number of points in your systems against which
    malicious behavior can be directed and thereby reduces the amount of work required
    to check that all vulnerable points are as secure as possible. This approach directly
    protects against attacks that seek weaknesses in services you don''t intend to
    offer; however, by reducing the number of points of potential attack, it allows
    you to focus on securing the systems you need to provide.


    Along being selective about what systems and ports inbound packets can reach,
    your systems should allow packets into your network only if there is a reasonable
    chance that the packet''s source address is valid. A packet claiming to be from
    an address that is inside your network has no business appearing from the outside.
    Given that privilege is sometimes granted based on the source IP address, this
    type of “spoof” attack must be prevented at the first available point.


    These three filter criteria: destination IP address, destination port, and the
    source IP address are a bare minimum. You should add additional criteria of restriction
    based on the content of the messages, rather than just the source and destination
    addresses. A system that performs additional filtering is generally called a firewall.
    Different firewall can provide different features, but a typical firewall at least
    includes packet filtering and one or more proxy servers. A proxy server mimics
    the network protocol of a particular service, but rather than providing the service,
    it inspects the inbound request for validity. Then the message appears to be server
    passes on the request. If, however, the message appears to be malformed, or contain
    other unwelcome characteristics, the message is abandoned.


    You might ask what is the value of a proxy server. Well, most software is very
    complex, and with increasing complexity comes a rapidly increasing risk of bugs
    that lead to security vulnerabilities. Proxy software would be very simple and
    relatively unlikely to have bugs. Furthermore a proxy does not act upon the content
    of network messages (other than abandoning or passing them) it is much less likely
    that the messages can persuade a proxy to execute any nasty behavior.


    The behavior of a typical proxy can be understood by looking at an example. Consider
    an e-mail proxy. Proxy probably consists in two parts. The first part is a minimal
    program that accepts connections, and copies the essential data from a request
    to a file. This proxy runs as an unprivileged user in a sandbox (for example,
    that is locked to a subtree of the file system in UNIX environment), so that its
    access to resources is as limited as possible if it is compromised. A second program
    runs from time to time, looking for the data files created by the first. When
    such a file is found, contents are read and if the messages seem to be valid,
    they are forwarded to the real server over the internal network.


    Using this approach, each piece of code is very simple, thereby limiting the chance
    of security vulnerability.


