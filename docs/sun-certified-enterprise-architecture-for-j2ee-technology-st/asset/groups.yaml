    ![](img/5715971f4d127ce26084f269dd89411b_73_0.png)


    # BENEFITS


    The following lists the benefits of using the Iterator pattern:


    - Supports variations in the traversal of a collection

    - Simplifies the interface of the collection


    # WHEN TO USE


    You should use the Iterator pattern when you want to:


    - Access collection object''s contents without exposing its internal representation.

    - Support multiple traversals of objects in a collection.

    - Provide a uniform interface for traversing different structures in a collection.


    # Mediator Pattern


    The Mediator pattern simplifies communication among objects in a system by introducing
    a single object that manages distribution among other objects. The Mediator pattern
    promotes loose coupling by keeping objects from referring to each other explicitly,
    and it lets you vary their interaction independently. Figure 4-17 illustrates
    the Mediator pattern.


    Figure 4-17. The Mediator Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_74_0.png)


    # BENEFITS


    The following lists the benefits of using the Mediator pattern:


    - Decouples colleagues

    - Simplifies object protocols

    - Centralizes control

    - The individual components become simpler and easier to deal with, because they
    no longer need to pass messages to each other

    - Components are more generic, because they no longer need to contain logic to
    deal with their communication with other components.


    # WHEN TO USE


    You should use the Mediator pattern when:


    - A set of objects communicate in well-defined but complex ways.

    - You want to customize a behavior that''s distributed between several objects
    without using subclasses.


    # Memento Pattern


    The Memento pattern preserves a "snapshot" of an object''s state, so that the
    object can return to its original state without having to reveal its content to
    the rest of the world. Figure 4-18 illustrates the Memento pattern.


    # Figure 4-18. The Memento Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_74_1.png)


    # BENEFITS


    The following lists the benefits of using the Memento pattern:


    - Preserves encapsulation boundaries

    - Simplifies the originator


    # WHEN TO USE


    You should use the Memento pattern when:


    - A snapshot of an object''s state must be saved so that it can be restored to
    that state later.

    - Using a direct interface to obtain the state would expose implementation details
    and break the object''s encapsulation.


    # Observer Pattern


    The Observer pattern provides a way for a component to flexibly broadcast messages
    to interested receivers. It defines a one-to-many dependency between objects so
    when one object changes state, all dependents are notified and updated automatically.
    Figure 4-19 illustrates the Observer pattern.


    # Figure 4-19. The Observer Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_75_0.png)


    # BENEFITS


    The following lists the benefits of using the Observer pattern:


    - Abstract coupling between subject and observer

    - Support for broadcast communication


    # WHEN TO USE


    You should use the Observer pattern when:


    - A change to one object requires changing the other object and you don''t know
    how many objects need to change.

    - An object should be able to notify other objects without making assumptions
    about the identity of those objects.


    # State Pattern


    The State pattern allows an object to alter its behavior when its internal state
    changes. The object appears to change its class. Figure 4-20 illustrates the State
    pattern.


    # Figure 4-20. The State Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_76_0.png)


    # BENEFITS


    The following lists the benefits of using the State pattern:


    - Localizes state-specific behavior and partitions behavior for different states

    - Makes state transitions explicit


    # WHEN TO USE


    You should use the State pattern when:


    - An object''s behavior depends on its state and it must change its behavior at
    runtime depending on that state.

    - Operations have large, multipartite conditional statements that depend on the
    object''s state.


    # Strategy Pattern


    The Strategy pattern defines a group of classes that represent a set of possible
    behaviors. These behaviors can then be used in an application to change its functionality.
    Figure 4-21 illustrates the Strategy pattern.


    # Figure 4-21. The Strategy Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_77_0.png)


    # BENEFITS


    The following lists the benefits of using the Strategy pattern:


    - An alternative to subclassing

    - Defines each behavior in its own class, which eliminates conditional statements

    - Easier to extend a model to incorporate new behaviors without recoding the application.


    # WHEN TO USE


    You should use the Strategy pattern when:


    - Many related classes differ only in their behavior.

    - You need different variants of an algorithm unknown to clients.


    # Template Method Pattern


    The Template Method pattern provides a method that allows subclasses to override
    parts of the method without rewriting it. Define the skeleton of an algorithm,
    deferring some steps to subclasses. Template method lets subclasses define certain
    steps of an algorithm without changing the algorithm''s structure. Figure 4-22
    illustrates the Template Method pattern.


    # Figure 4-22. The Template Method Pattern


    | AbstractClass | TemplateMethod() | PrimitiveOperation1() | PrimitiveOperation2()
    |

    | :--- | :--- | :--- | :--- |

    | ConcreteClass | PrimitiveOperation1() | PrimitiveOperation2() |


    ![](img/5715971f4d127ce26084f269dd89411b_78_0.png)


    # BENEFITS


    The following lists the benefit of using the Template Method pattern:


    - Fundamental technique for reusing code


    # WHEN TO USE


    You should use the Template Method pattern when:


    - You want to implement the invariant parts of an algorithm once and use subclasses
    to implement the behavior that can vary.

    - When common behavior among subclasses should be factored and localized in a
    common class to avoid code duplication.


    # Visitor Pattern


    The Visitor pattern provides a maintainable, easy way to represent an operation
    to be performed on elements of an object structure. The Visitor pattern lets you
    define a new operation without changing the classes of the elements on which it
    operates. Figure 4-23 illustrates the Visitor pattern.


    Figure 4-23. The Visitor Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_79_0.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_1.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_2.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_3.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_4.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_5.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_6.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_7.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_8.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_9.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_10.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_11.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_12.png)


    # BENEFITS


    The following lists the benefits of using the Visitor pattern:


    - Makes adding new operations easy

    - Gathers related operations and separates unrelated ones


    # WHEN TO USE


    You should use the Visitor pattern when:


    - An object structure contains many classes of objects with differing interfaces
    and you want to perform operations on these objects that depend on their concrete
    classes.

    - Classes defining the object structure rarely change but you often want to define
    new operations over the structure.


    # Essential Points


    The following summarizes the most important points described in this chapter:


    - Creational patterns allow objects to be created in a system without having to
    identify a specific class type in the code, so you do not have to write large,
    complex code to instantiate an object.

    - The Abstract Factory pattern provides an interface for creating families of
    related or dependent objects without specifying their concrete classes.

    - The Builder pattern separates the construction of a complex object from its
    representation so the same process can create different objects.

    - The Factory Method pattern defines an interface for creating an object, but
    lets the subclasses decide which to instantiate.

    - The Prototype pattern allows an object to create customized objects without
    knowing their exact class or the details of how to create them.

    - The Singleton pattern ensures that a class has only one instance, and provides
    a global point of access to that class.

    - Structural patterns control the relationships between large portions of applications,
    converting the interface of one so it can be used with the other.

    - The Bridge pattern divides a component into two separate but related inheritance
    hierarchies: the functional approach and the internal implementation.

    - The Composite pattern enables you to create hierarchical tree structures of
    varying complexity, while allowing every element in the structure to operate with
    a uniform interface.

    - The Decorator pattern enables you to add or remove object functionality without
    changing the external appearance or function of the object.

    - The Facade pattern provides a unified interface to a group of interfaces in
    a subsystem.

    - The Flyweight pattern reduces the number of low-level, detailed objects within
    a system by sharing objects.

    - The Proxy pattern provides a surrogate or placeholder object to control access
    to the original object.

    - Behavioral patterns influence state and behavior flow through a system.

    - The Chain of Responsibility pattern establishes a chain within a system, so
    that a message can either be handled at the level where it is received, or directed
    to an object that can handle it.

    - The Command pattern encapsulates a request in an object, which enables you to
    store the command, pass the command to a method, and return the command like any
    other object.

    - The Interpreter pattern interprets a language to define a representation for
    its grammar along an interpreter that uses the representation to interpret sentences
    in the language.

    - The Iterator pattern provides a consistent way to sequentially access items
    in a collection that is independent of and separate from the underlying collection.

