    The following lists lists the benefits of using the Bridge pattern:


    +   • Enables you to separate the interface from the implementation

    • Improves extensibility

    • Hides implementation details from clients


    # WHEN TO USE


    You should use the Bridge pattern when:'
  - '[PAGE 65]


    +   • You want to avoid a permanent binding between an abstraction and its implementation.

    • Both the abstractions and their implementations should be extensible using subclasses.

    • Changes in the implementation of an abstraction should have no impact on clients;
    that is, you should not have to recompile their code.


    #  Composite Pattern


    The Composite pattern enables you to create hierarchical tree structures of varying
    complexity, while allowing every element in the structure to operate with a uniform
    interface. The Composite pattern combines objects into tree structures to represent
    the whole hierarchy or a part of the hierarchy. This Composite pattern allows
    clients to treat individual objects and compositions of objects uniformly. Figure
    4-8


    Figure 4-8. The Composite Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_65_0.png)


    # BENEFITS


    The following lists the benefits of using the Composite pattern:


    +   • Defines class hierarchies consisting of primitive objects and composite
    objects

    • Makes it easier to add new kinds of components

    • Provides flexibility of structure and a manageable interface


    # WHEN TO USE'
- md: '

    You should use the Composite pattern when:


    - You want to represent the whole hierarchy or a part of the hierarchy of objects.

    - You want clients to be able to ignore the difference between compositions of
    objects and individual objects.

    - The structure can have any level of complexity, and is dynamic.


    ## Decorator Pattern


    The Decorator pattern enables you to add or remove object functionality without
    changing the external appearance or function of the object. It changes the functionality
    of an object in a way that is transparent to its clients by using an instance
    of a subclass of the original class that delegates operations to the original
    object. The Decorator attaches additional responsibilities to an object dynamically
    to provide a flexible alternative to changing object functionality without static
    inheritance. Figure 4-9 illustrates the Decorator pattern.


    ## Figure 4-9. The Decorator Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_66_0.png)


    ## BENEFITS


    The following lists the benefits of using the Decorator pattern:


    - More flexibility than static inheritance

    - Avoids feature-laden classes high up in the hierarchy

    - Simplifies coding because you write a series of classes, each targeted at a
    specific part of the functionality, rather than coding all behavior into the object

    - Enhances the object''s extensibility because you make changes by coding new
    classes


    ## WHEN TO USE


    You should use the Decorator pattern when:


    - You want to add responsibilities to individual objects dynamically and transparently,
    that is, without affecting other objects.

    - You want to add responsibilities to the object that you might want to change
    in future.

    - When extension by subclassing is impractical.


    ## Façade Pattern


    The Facade pattern provides a unified interface to a group of interfaces in a
    subsystem.

    The Facade pattern defines a higher-level interface that makes the subsystem easier
    to use because you have only one interface. This unified interface enables an
    object to access the subsystem using only the interface to communicate with the
    subsystem. Figure 4-10 illustrates the Facade pattern.


    > Figure 4-10. The Facade Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_67_0.png)


    ## BENEFITS


    The following lists the benefits of using the Facade pattern:


    - Provides a simple interface to a complex system without reducing the options
    provided by the system.

    - Shields clients from subsystem components.

    - Promotes weak coupling between the subsystem and its clients.

    - Reduces coupling between subsystems if every subsystem uses its own Façade pattern
    and other parts of the system use the Façade pattern to communicate with the subsystem.

    - Translates the client requests to the subsystems that can fulfill these requests.


    ## WHEN to USE


    You should use the Facade pattern when:


    - You want to provide a simple interface to a complex subsystem.

    - There are many dependencies between clients and the implementation classes of
    an abstraction.

    - You want to layer your subsystems.


    ## Flyweight Pattern


    The Flyweight pattern reduces the number of low-level, detailed objects within
    a system by sharing objects. If instances of a class that contain the same information
    can be used interchangeably, the Flyweight pattern allows a program to avoid the
    expense of multiple instances that contain the same information by sharing one
    instance. Figure 4-11 illustrates the Flyweight pattern.


    > Figure 4-11. The Flyweight Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_68_0.png)


    ## BENEFITS


    The following lists the benefits of using the Flyweight pattern:


    - Reduction in the number of objects to handle

    - Reduction in memory and proxy on storage devices, if the objects are persisted


    ## WHEN TO USE


    You should use the Flyweight pattern when all of the following are true:


    - The application uses a large number of objects.

    - Storage costs are high because of the quantity of objects.

    - The application does not depend on object identity.


    ## Proxy Pattern


    The Proxy pattern provides a surrogate or placeholder object to control access
    to the original object. There are several types of implementations of the Proxy
    pattern with the Remote proxy and Virtual proxy being the most common. Figure
    4-12 illustrates the Proxy pattern.


    ## Figure 4-12. The Proxy Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_69_0.png)


    ## BENEFITS


    The following lists the benefits of using the Proxy pattern:


    - A remote proxy can hide the fact that an object resides in a different address
    space.

    - A virtual proxy can perform optimizations, such as creating an object on demand.


    ## WHEN TO USE


    You should use the Proxy pattern when:


    - You need a more versatile or sophisticated reference to an object than a simple
    pointer.


    ## 4.3 Behavioral Patterns


    Behavioral patterns influence how state and behavior flow through a system. By
    optimizing how state and behavior are transferred and modified, you can simplify,
    optimize, and increase the maintainability of an application.


    The following Behavioral patterns are described:


    - Chain of Responsibility

    - Command

    - Interpreter

    - Iterator

    - Mediator

    - Memento

    - Observer

    - State

    - Strategy

    - Template Method

    - Visitor


    ## Chain of Responsibility Pattern


    The Chain of Responsibility pattern establishes a chain within a system, so that
    a message can be either handled at the level where it is first received, or directed
    to an object that can handle it. Figure 4-13 illustrates the Chain of Responsibility
    pattern.


    > Figure 4-13. The Chain of Responsibility Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_70_0.png)


    ## BENEFITS


    The following lists the benefits of using the Chain of Responsibility pattern:


    - Reduced coupling

    - Added flexibility in assigning responsibilities to objects

    - Allows a set of classes to behave as a whole, because events produced in one
    class can be sent on to other handler classes within the composite


    ## WHEN TO USE


    You should use the Chain of Responsibility pattern when:


    - More than one object can handle a request, and the handler isn''t known.

    - You want to issue a request to one of several objects without specifying the
    receiver explicitly.

    - The set of objects that can handle a request should be specified dynamically.


    ## Command Pattern


    The Command pattern encapsulates a request in an object, which enables you to
    store the command, pass the command to a method, and return the command like any
    other object. Figure 4-14 illustrates the Command pattern.


    ## Figure 4-14. The Command Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_71_0.png)


    ## BENEFITS


    The following lists the benefits of using the Command pattern:


    - Separates the object that invokes the operation from the one that knows how
    to perform it.

    - It''s easy to add new commands, because you don''t have to change existing classes.


    ## WHEN TO USE


    You should use the Command pattern when:


    - You want to parameterize objects by an action to perform.

    - You specify, queue, and execute requests at different times.

    - You must support undo, logging, or transactions.


    ## Interpreter Pattern


    The Interpreter pattern interprets a language to define a representation for its
    grammar along with an interpreter that uses the representation to interpret sentences
    in the language. Figure 4-15 illustrates the Interpreter pattern.


    ## Figure 4-15. The Interpreter Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_72_0.png)


    ## BENEFITS


    The following lists the benefits of using the Interpreter pattern:


    - Easy to change and extend the grammar

    - Implementing the grammar is easy


    ## WHEN TO USE


    You should use the Interpreter pattern when:


    - The grammar of the language is simple.

    - Efficiency is not a critical concern.

