    can be attacked either through attacking the key or the encryption. If the key
    generation or exchange is flawed, an attacker might be able to gain knowledge
    about the key. SSL is directly involved in this process, so the design and implementation
    must be correct if the key exchange is to be secure. The algorithm, by contrast,
