    ## Class Diagram


    The class diagram is a little different from the Business Domain Object Model
    (BDOM) provided by the business analyst, but it provides additional details and
    still meets the requirements of the BDOM. The Address, CreditCard, and ShoppingCart
    all been added with relationships to Customer. Payment and LineItem have been
    added to expand the Order. Manufacturer is no longer an object, it is an attribute
    of Product. In addition, an Order no longer has a direct relationship to Product,
    it must use Lineitem to form the relationship. Stateless beans have been added
    to show the classes that will handle the workflow and business rules.


    The home and remote interfaces for the EJBs have not been added, because those
    interfaces tend to clutter the diagram and the developers already know how an
    EJB needs a home and remote interface. At this point, attributes and operations
    have not been added to the classes because that information will be done during
    the detailed design. This diagram just shows the basic classes that will be used
    in the system to provide some structure and business rules. A detailed class diagram
    will be created by the developers during the design of the system. Figure 8-6
    illustrates a class diagram.


    ## Figure 8-6. Class Diagram


    ![](img/5715971f4d127ce26084f269dd89411b_145_0.png)


    ## Component Diagrams


    The component diagrams for this system have been broken down into three separate
    diagrams. There is one diagram for each package structure within the system. These
    diagrams provide additional information about the basic structure of the system
    and how it will function.


    The Catalog Component Diagram (Figure 8-7) shows the flow of events that take
    place between the components to handle the action of browsing the catalog and
    searching the catalog. The CatalogController serves as the controller for all
    user interface requests. The ServiceLocator is a class that is used by the CatalogController
    to find and load the SearchProcessor. This ServiceLocator is contained in the
    CommonServices package and is used in all the component diagrams.


    ### ### Figure 8-7. Catalog Component Diagram


    ![](img/5715971f4d127ce26084f269dd89411b_146_0.png)


    The Order Component Diagram (Figure 8-8) shows the component flow that should
    be followed when doing the detail design on the following use cases: Review Order,
    Checkout, Return Item and Request Item. UserController serves as the control mechanism
    for the user interface. The ServiceLocator locates OrderProcessor, which is the
    business logic and workflow. The OrderDAO is used to retrieve the order data used
    in the processing of orders. Because the Shipping, Payment, and Accounting systems
    have Java technology APIs and the data is not persisted, you have direct access
