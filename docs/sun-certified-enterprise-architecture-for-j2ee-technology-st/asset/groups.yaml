    ## 2.2 J2EE API


    以下列表描述了 J2EE 用于实现分布式计算应用程序部分功能的技术：


    - Java 2 标准版 (J2SE)

    - Java 数据库连接 (JDBC) – 一种标准 API，用于独立于供应商的方式将 Java 平台连接数据库资源。

    - RMI-JRMP – 使用 Java 远程消息协议 (JRMP) 的远程方法调用 (RMI)。

    - Java 接口语言 (IDL) – 一项将通用对象请求代理架构 (CORBA) 整合到 Java 平台的服务，通过使用对象管理组 (OMG) 定义的标准接口定义语言
    (IDL)提供互操作性。

    - 远程方法调用-跨 ORB 协议 (RMI-IOP) – 一种允许 RMI 程序员结合使用 RMI API 的优势和 CORBA IIOP 通信协议的优势，与使用任何支持
    CORBA 的语言开发的符合 CORBA 的客户端进行通信。

    - 企业级 JavaBean (EJB) – 一种用于开发和部署基于组件的分布式业务应用程序的组件架构。

    - Servlet – 在请求-响应机制中与 Web 客户端交互。该机制基于 HTTP 的行为。

    - Java 页面 (JSP) – 用于构建包含动态内容的应用程序，例如动态超标记语言 (DHTML) 和可扩展标记语言 (XML)。

    - Java 消息服务 (JMS) – 一种带有面向消息中间件 (MOM) 的 API，用于实现点对点和发布/订阅消息系统。

    - Java 命名和目录接口 (NDI) – 用于访问不同类型命名和目录服务的统一接口。

    - Java 事务 API (JTA) – 一组启用事务管理的 API。应用程序可以使用 JTA API 来启动、提交和中止事务。

    - JavaMail – 一种提供平台无关且协议无关框架的 API，用于构建构建和消息传递应用程序。

    - JavaBean 激活框架 (JAF) – 供其他包（如 JavaMail）使用的激活框架的 API。你可以使用 JAF 来确定数据类型、封装对该数据的访问、发现该数据上可的操作，并实例化相应的
    bean 来执行这些操作。例如，JavaMail 使用 JAF 根据对象的 MIME 类型来确定实例化哪个对象。


    ## 2.3 J2EE 的组件


    J2EE 构建在容器模型之上。四个核心容器组件通过 API 为 J2EE 组件提供运行时支持。这些核心组件对应 J2EE 支持的四种容器类型，分别是应用程序客户端
    (Application Client)、Applet、Web 和 EJB。以下是 J2EE 支持的核心应用组件：


    - Java 应用程序 – Java 组件是运行在应用程序客户端容器内部的独立程序。应用程序客户端容器提供了消息、远程调用、数据库连接和查找服务的 API。应用程序客户端容器需要以下
    API：J2SE、JMS、JNDI、RMI-IIOP 和 JDBC。该容器由应用程序服务器供应商提供。

    - Applet – Applet 组件是运行在 Applet 容器中的 Java Applet，该容器是支持 Java 技术的基础浏览器。Applet 必须支持
    J2SE API。

    - Servlet 和 JSP – Servlet 和 JSP 组件是运行在 Web 容器中的 Web 组件，由 Web 服务器支持。Web 容器是 JSP
    和 servlet 的运行时环境。Web 容器必须支持以下 API：J2SE、JMS、JNDI、JavaMail、JAF、RMI-IIOP 和 JDBC。Servlet
    和 JSP 提供了一种与展示相关的动态内容准备、处理和格式化的机制。

    - 企业级 JavaBean (EJB) – EJB 组件是运行在 EJB 容器中的组件。EJB 组件是 J2EE 应用的核心。EJB 容器提供了事务管理、状态管理、资源池和安全检查。EJB
    容器必须支持以下 API：J2SE、JMS、JNDI、JavaMail、JAF、RMI-IIOP 和 JDBC。因为 EJB 组件是 J2EE 的核心，因此大多数考试题在某种程度上与
    EJB 相关。因此，本章大部分内容描述了 EJB 的组件和功能。


    ## 2.4 使用 EJB


    EJB 应该包含应用程序的业务逻辑，因此 EJB 是大多数应用程序的核心并不意外。企业级 bean 具有以下特征：


    - 包含对企业数据操作的业务逻辑

    - 由容器创建和管理

    - 协调客户端访问

    - 包含元数据（如事务和安全属性），且与 bean 分离

    - 提供事务管理、状态管理、资源池和安全检查。如果你有一个不需要安全和/或事务支持的应用程序，那么你真的需要考虑是否应该使用 EJB。


    ## 2.5 为 EJB 指定类和接口


    为了保持 EJB 的一致性，每个 EJB 必须具有以下接口和类：


    - Home 接口由 bean 开发人员开发。应用程序提供该接口的实现。Home 接口应该扩展 `javax.ejb.EJBHome`。Home 接口充当工厂模式，用于创建
    EJB 实例。它还允许客户端创建、移除或查找 EJB。

    - 远程接口（Remote interface）由 bean 开发人员开发，应用程序提供实现。它应该扩展 `javax.ejb.EJBObject`。远程接口包含客户端可以调用的业务方法。

    - Bean 类由 bean 开发人员开发，并包含远程接口中定义的方法的实现。它应该扩展 `javax.ejb.Session` 或 `javax.ejb.Entity`。


    图 2-1 展示了 EJB 的类和接口。


    | 源文件 | 远程接口 | EJB 类 |

    | --- | --- | --- |

    | Home 接口 | | |

    | | 厂商工具 | |

    | 运行时 | Home Object | EJB Stub |

    | | | Enterprise Object


    ## 2.6 使用 Session 和 Entity Bean


    企业应用程序需要灵活的组件。组件必须提供无状态服务、会话状态并支持数据共享。企业级 JavaBean (EJB) 提供了两种基本 bean 来支持企业应用所需的组件：session
    和 entity。Entity bean 为 J2EE 应用提供数据的持久化和共享。并不是说 session bean 可以持久化对象，entity bean
    专门持久化对象。Session bean 提供与 J2EE 应用相关的业务逻辑和工作流，对应于无状态和会话服务。


    ## 2.7 Stateless 和 Stateful Session Bean


    Session Bean 有两种类型：Stateless 和 Stateful。


    # Stateless Bean


    Stateless session bean 不为客户端持有任何会话状态。但这并不意味着它们不能持有状态，Stateless session bean 可以持有状态，但不保证状态特定于调用客户端。这意味着你可以使用
    stateless session bean 执行应用程序中的任何操作。


    # Stateful Session Bean


    Stateful session bean 赋予你为客户端持有会话状态的能力。在企业应用程序中处理会话状态有很多方法，但如果状态需要靠近业务逻辑，那么它应该放在
    stateful session bean 中。购物车是 stateful session bean 的例子。


    ## 2.8 EJB 生命周期


    每个 EJB 都有独特的生命周期。该生命周期决定了 EJB 的行为。如果你使用合适的 EJB，EJB 的生命周期就可以帮助应用程序的可扩展性。


    图 2-2 展示了无状态 session bean 的生命周期。


