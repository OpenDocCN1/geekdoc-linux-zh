    ## 2.14 Using Intermediate Data-Access Objects


    If you decide that BMP is the best approach for your entity beans, then this means
    you are coding the SQL into your entity beans. It''s an attempt to reduce the
    coupling of the entity beans with the SQL necessary to read, insert, update and
    delete an object, create a DAO that encapsulates the SQL. By encapsulating the
    code necessary to read, insert, update and delete an object you have reduced your
    dependency on code and data changes.


    The DAO contains the implementation code to insert, update, delete, and read an
    object in a data source. This allows an entity bean to be defined as BMP, but
    the entity bean can change to CMP when the beans are better suited to handle the
    CMP. Encapsulating the data access into the DAO instead of the entity bean allows
    for the bean to replace the DAO with CMP support from the container.


    The cost of using DAOs is the additional layer and overhead of creating garbage
    collection of the DAO. In addition, if you are not experienced with writing SQL
    code, then you could be writing slow SQL commands.


    # Essential Points


    The following summarizes the most important points described in this chapter:


    - Applications that are distributed and require transactions, security, and resource
    management are suitable for implementation using J2EE technology.

    - JSP and servlets are well suited to implement the user component of a J2EE application.

    - EJBs are suited to the implementation of business logic in a J2EE application.

    - Application aspects that are suited to implementation using EJB persistence,
    transaction, support, and security.

    - The classes required to implement an EJB are: java.ejb.EJBHome, java.ejb.EJBObject,
    and your method implementations using either java.ejb.Session or java.ejb.EntityBean.

    - Entity beans are a shared resource that is persisted and session beans are associated
    with a user request and are not shared.

    - Stateful session beans maintain a user''s conversational state whereas a stateless
    session bean is shared among many users and each user controls the bean for a
    single request/response.

    - Bean pooling allows for more users to use the system with fewer resources.

    - Passivation allows the EJB container to use fewer session beans to support more
    resources.

    - CMP allows you to create persisted objects without having to maintain the code
    to persist the object. The down side to CMP is that the tools are not enough to
    provide the performance necessary for an enterprise application.

    - DAOs allow you to control the access of data from resources and switch to CMP
    when the tools have better support, but this means you must write and maintain
    the SQL code.


    # Review Your Progress


    This section reviews the objectives described in the chapter and provides review
    questions to ensure that you understand the important points in the chapter.


    Objective: Select, from a list, the application aspects that are suited for implementation
    using J2EE


    + 1. Which of the following is not an application aspect suited for J2EE?


    A. Transactions

    B. Applet

    C. Security

    D. Resource management

    E. Distributed


    A: The correct answer is B.


    An applet is a technology and not an application aspect


    Objective: Identify suitable J2EE technologies for the implementation of specified
    application aspects


    + 2. Which technology would you use to implement asynchronous messages within
    J2EE?


    A. JMS

    B. RMI

    C. JNDI

    D. HTTP


    A: The correct answer is A.


    MMS is the technology used to implement asynchronous messaging within J2EE.

    RMI, JNDI, and HTTP do not provide for asynchronous messages.


    Objective: Select, from a list, those application aspects that are suited to implementation
    using EJB


    + 3. Which is not an application aspect suited to implementation using EJB?


    A. Distribution

    B. Security

    C. Resource management

    D. Naming service


    A: The correct answer is D.


    Distribution, security, and resource management are application aspects that you
    would use EJB to implement. Naming service is an application aspect, but you would
    use JNDI instead of EJB.


    # Objective: List the required classes/interfaces that must be provided for an
    EJB


