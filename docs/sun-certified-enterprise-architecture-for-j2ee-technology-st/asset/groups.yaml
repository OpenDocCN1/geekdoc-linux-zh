    # 优点


    以下列出了使用迭代器（Iterator）模式的优点：


    - 支持集合遍历的不同方式

    - 简化集合的接口


    # 使用场景


    当你想实现以下操作时，应该使用迭代器模式：


    - 在不暴露内部表示的情况下访问集合对象的内容。

    - 支持对集合中的对象多次遍历。

    - 为遍历集合中不同的结构提供统一的接口。


    # 中者模式


    中者模式通过引入一个管理其他对象之间分发的单一对象，简化了系统中对象之间的通信。中者模式通过防止对象之间显式的相互引用来促进松耦合，并它允许你独立地改变它们的交互作用。图
    4-17 展示了中者模式。


    图 4-17. 中者模式


    ![](img/5715971f4d127ce26084f269dd89411b_74_0.png)


    # 优点


    以下列出了使用中者模式的优点：


    - 解耦同事类（colleagues）

    - 简化对象协议

    - 集中控制

    - 单个组件变得更简单且更容易处理，因为它们不再需要相互传递消息

    - 组件更具通用性，因为它们不再需要包含处理与其他组件通信的逻辑。


    # 使用场景


    在以下情况下，你应该使用中者模式：


    - 一组对象以定义良好但复杂的方式进行通信。

    - 你想在不使用子类的情况下，自定义分布在多个对象之间的行为。


    # 备忘模式


    备忘模式保存了对象状态的“快照”，使得对象可以返回原始状态，而无需向世界其他部分暴露内容。图 4-18 展示了备忘模式。


    # 图 4-18. 备忘模式


    ![](img/5715971f4d127ce26084f269dd89411b_74_1.png)


    # 优点


    以下列出了使用备忘模式的优点：


    - 保护封装边界

    - 简化源源对象（originator）


    # 使用场景


    在以下情况下，你应该使用备忘模式：


    - 必须保存对象状态的快照，以便以后恢复到该状态。

    - 使用直接接口获取状态会暴露实现细节并破坏对象的封装。


    # 观察者模式


    观察者模式提供了一种组件灵活向感兴趣的接收者广播消息的方法。它定义了对象之间一对多的依赖关系，因此当一个对象的状态改变时，所有依赖项都会收到通知并更新。图
    4-19 展示了观察者模式。


    # 图 4-19. 观察者模式


    ![](img/5715971f4d127ce26084f269dd89411b_75_0.png)


    # 优点


    以下列出了使用观察者模式的优点：


    - 主体与观察者之间的抽象耦合

    - 支持广播通信


    # 使用场景


    在以下情况下，你应该使用观察者模式：


    - 一个对象的改变需要改变另一个对象，而你不知道有多少个对象需要改变。

    - 对象应该能够通知其他对象，而无需对这些对象的身份做任何假设。


    # 状态模式


    状态模式允许对象在内部状态改变时改变其行为。该对象似乎改变了它的类。图 4-20 展示了状态模式。


    # 图 4-20. 状态模式


    ![](img/5715971f4d127ce26084f269dd89411b_76_0.png)


    # 优点


    以下列出了使用状态模式的优点：


    - 将特定状态的行为局部化，并为不同状态划分行为

    - 使状态转换显式化


    # 使用场景


    在以下情况下，你应该使用状态模式：


    - 对象的行为取决于它的状态，并且必须根据该状态在运行时改变行为。

    - 操作具有依赖于对象状态的多部分条件语句。


    # 策略模式


    策略模式定义了一组表示可能行为的类。这些行为随后可以在应用程序中使用，以更改其功能。图 4-21 展示了策略模式。


    # 图 4-21. 策略模式


    ![](img/5715971f4d127ce26084f269dd89411b_77_0.png)


    # 优点


    以下列出了使用策略模式的优点：


    - 子类化的替代方案

    - 将每个行为定义在它自己的类中，从而消除了条件语句

    - 更容易扩展模型以引入新行为，而无需重新编码应用程序。


    # 使用场景


    在以下情况下，你应该使用策略模式：


    - 许多相关类仅在行为上不同。

    - 你需要客户端未知的算法的不同变体。


    # 模板方法模式


    模板方法模式提供了一种方法，允许子类重写方法的部分内容而无需重写整个。定义算法的骨架，将某些步骤推迟给子类。模板方法允许子类在不改变算法结构的情况下定义算法的某些步骤。图
    4-22 展示了模板方法模式。


    # 图 4-22. 模板方法模式


    | AbstractClass | TemplateMethod() | PrimitiveOperation1() | PrimitiveOperation2()
    |

    | :--- | :--- | :--- | :--- |

    | ConcreteClass | PrimitiveOperation1() | PrimitiveOperation2() |


    ![](img/5715971f4d127ce26084f269dd89411b_78_0.png)


    # 优点


    以下列出了使用模板方法模式的优点：


    - 重用代码的基础技术


    # 使用场景


    在以下情况下，你应该使用模板方法模式：


    - 你想实现算法中不变的部分，并使用子类来实现可变的部分。

    - 子类之间的共同行为应该提取并局部化在公共类中避免代码重复。


    # 访问者模式


    访问者模式提供了一种易于维护、简单的方法来表示对对象结构执行的操作。访问者模式允许你在不改变所操作元素类的情况下定义新操作。图 4-23 展示了访问者模式。


    图 4-23. 访问者模式


    ![](img/5715971f4d127ce26084f269dd89411b_79_0.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_1.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_2.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_3.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_4.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_5.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_6.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_7.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_8.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_9.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_10.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_11.png)

    ![](img/5715971f4d127ce26084f269dd89411b_79_12.png)


    # 优点


    以下列出了使用访问者模式的优点：


    - 使添加新操作变得简单

    - 聚合相关操作并分离不相关的操作


    # 使用场景


    在以下情况下，你应该使用访问者模式：


    - 对象结构包含许多具有不同接口的类，而你想对这些对象执行取决于具体类的操作。

    - 定义对象结构的类很少改变，但你经常想在结构上定义新操作。


    # 核心要点


    以下总结了本章描述的最重要点：


    - 创建模式允许在系统中创建对象，而无需在代码中识别特定的类类型，因此你不需要编写大型复杂的代码来实例化对象。

    - 抽象工厂模式提供了一个创建相关或依赖对象族的接口，而无需指定它们的具体类。

    - 构建器模式将复杂对象的构建与它的表示分离开，使得相同的过程可以创建不同的对象。

    - 工方法模式定义了创建对象的接口，但让子类来决定实例化哪一个。

    - 原型模式允许对象在不知道其确切类或创建细节的情况下创建定制化对象。

    - 单例模式确保一个类只有一个实例，并提供对该类的全局访问点。

    - 结构型模式控制应用程序大部分部分之间的关系，通过转换一个的接口使其能与另一个配合。

    - 桥接模式将组件划分为两个独立但相关的继承层次：功能性方法和内部实现。

    - 组合模式允许你创建不同复杂性的层次级树形结构，同时允许结构中的每个元素使用统一的接口操作。

    - 装饰器模式允许你在不改变对象外部外观或功能的情况下添加或删除对象功能。

    - 外外观模式为子系统中的一组接口提供统一的接口。

    - 享重量模式通过共享对象减少系统内低级、详细对象的数量。

    - 代理模式提供一个代理或占位对象来控制对原始对象的访问。

    - 行为模式影响状态和行为在系统中的流。

    - 责任链模式在系统中建立一条链，使得消息可以在接收的层级被处理，也可以定向到可以处理它的对象。

    - 命令模式将请求封装在对象中，这允许你存储命令、将命令传递给方法并像其他任何对象一样返回命令。

    - 解释器模式解释语言以定义其语法的表示，并带有一个使用该表示来解释语言句子的解释器。

    - 迭代模式提供了一种一致的方式来顺序访问集合中的项，且这种方式与底层集合是独立且分离的。


