    coded into it that makes it difficult to use in different cultures. Localization,
    by contrast, describes the process of taking an internationalized program, and
    configuring it to run in a particular regional or cultural environment.


    The primary question that you, the architect must address is always, “what is
    the cost-benefit analysis?” There is, undeniably, a cost with creating a system
    that is flexible enough to support multiple languages and cultures. It might be
    that the customer does have a clear vision of what the business intends to pursue
    in foreign markets, or the might even believe that the future of the business
    is entirely local. You should consider the following issue before committing a
    project to a future that includes an-internationalized structure: Will the general
    gain in flexibility be worth the effort, even if the flexibility is not used for
    internationalization?


    Consider this point for a moment. If a program uses the internationalization facilities
    of Java technology, then it readily supports multiple versions of user interface,
    multiple functionality sets, and so on. This flexibility can be valued, even if
    the input language or target never changes. For example, you can use the internationalization
    capabilities to present totally different interfaces on the program. You could
    use this to improve methods based on usability studies or to present different
    versions, with different functionality enabled, to different clients. This is
    similar to the way the 486X chip was created by designing the numeric coprocessor
    on a 486DX. The technique allows multiple products to be created for a lower total
    cost, because every product in the line shares the bulk of its code and testing
    the rest of the line.


    Internationalization requires that a number of issues be addressed in the structure
    of a program. First, you must identify any aspect of the system that might vary
    by the language or region in which the program is being used. Second, you should
    examine the nature of the potential variations. Finally, you must create a structure
    that allows the variable parts to be plugged in at run time in such a way that
    you can add new languages locales to the finished program without recompiling
    the whole system. This chapter describes these three issues.


    ## What Aspect of the System Needs Internationalization?


    The most obvious aspect of any system that should change when the system is used
    in other locations is the language. The program might require a change in the
    text of any messages, labels, and so on. Perhaps less obvious is that program
    code—algorithms—might need to vary also. For example, different countries have
    different taxation systems. So, it is important that you recognize that the changes
    that internationalization might require a wider scope than simply changing the
    text of a message.


    ## What Types of System Variations Should Be Supported?


    Both code and text will often need to be internationalized. The following is a
    list of the common types of changes that you should support.


    - Language used for messages

    - Parameter substitution order in messages

    - Language used for parameters in messages

    - Numeric formats

    - Date formats

    - Dictionary sort order

    - Currency symbols and their position

    - Tax and other legal rules

    - Cultural preferences such as colors and symbols


    If the user''s language varies, each message needs to be translated. In addition,
    changes in language often require changes in word order, and of both numeric and
    calendar date presentations. Some nations, for example, use a comma to indicate
    a decimal point, and a period to indicate a thousands separator.


    ## Using Java Technology APIs to Create an Internationalized Strategy


    The type of flexibility required for all the issues discussed, and almost anything
    else might be needed, is easily supported using resource bundles, as provided
    by the class java.util.ResourceBundle. A resource bundle is a collection of objects
    (which can be strings, naturally) that are located using a unique key. For example,
    you could locate the message indicating a disk failure by searching the key "disk-failed".
    It is important to recognize that the resource bundle can contain any object,
    including user interfaces, and is not limited to textual content. In fact the
    only information items that you cannot place in a resource bundle are primitive
    types, and even these can be handled using wrapper objects.


    A crucial feature of the resource bundle notion is that a bundle is to be used
    at run time using a hierarchy searching mechanism based on the locale specified
    in the environment. For example, if you try to load a bundle for TextMessages,
    in Quebec, the system will first attempt to load a resource bundle class called
    TextMessages_fr_CA. If this fails, the next attempt will be to load a class called
    TextMessages_fr, and finally, if it fails, then the system will fall back to the
    default class, which will be called simply TextMessages in this example.


    ## 6.2 The APIs


    Now that you have considered what might need to be internationalized in a system,
    you should take a look at the APIs that you can use, and get a feel for what each
    one does. Although many of the Java 2 platform APIs can provide assistance for
    an internationalized program, the objectives are quite specific about those that
    might appear in the exam. For this reason, you consider the following APIs:


    ```

    Properties, Locale, ResourceBundle, Unicode, java.text package,

    InputStream and OutputStreamWriter.

    ```


