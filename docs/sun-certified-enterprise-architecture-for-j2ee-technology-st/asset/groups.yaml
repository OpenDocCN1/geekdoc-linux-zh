    - 3. In a corporate network, there are three divisions, payroll, human resources,
    and the board, that have special systems. This systems contain privileged data,
    and this data must be protected against unauthorized access from other parts of
    the company and from the Internet.


    As a minimum, what must be provided to address the protections as specified?


    - A. A firewall around the three groups as a whole

    B. A firewall around the payroll systems

    C. A firewall around the human resources systems

    D. A firewall around the board systems

    E. A firewall around the whole company intranet


    # A: Correct answers are B, C, and D.


    As specified, there is no requirement to protect the main network. In fact the
    only specified requirement is to protect each group from anything not in those
    groups.

    Means that the only immediate need is for a firewall around each group.


    In reality, you would not leave the company network unprotected, and there might
    be well other requirements. However, from the point of view of a precise answer
    to the question as asked, B, C, and D are the correct and minimal requirements.


    - 4. List the issues you would consider if asked to rank the following into order
    of preference as techniques for obtaining a public key to be used in secure communication
    with Bob.


    - A. Trent, a friend of Bob, gives you the key.

    B. You find a certificate on an unknown Web site. The certificate signature validates
    the certificate as issued by a certificate authority using the key installed in
    the browser that you copied from a friend.

    C. You find a certificate on Bob''s Web site. The certificate signature is unrecognized.

    D. You receive a certificate from a certificate authority you do not know. You
    validate the signature on that certificate by phoning the certificate authority
    to obtain their public key.

    E. Bob gives you his private and public keys personally over lunch.


    # A: In option A, the biggest question is whether you can trust Trent. Even if
    he is Bob''s friend, you do not know he is your friend. He might substitute a
    different key without intending to cheat Bob, but intending to cheat you.


    In option B, the biggest risk is the use of preinstalled keys in a browser you
    copied from an insecure source. You do not know if your friend''s system might
    have been subverted by bogus keys for nonexistent certificate authorities. Compounded
    with the uncertain origin of the key itself, the result is probably a weak form
    of verification.


    Option C has no mathematical reliability, but depends upon Bob''s Web site, and
    the connection between you and the Web site and whether it was secure at the time
    you downloaded the certificate. Although the signature on the certificate cannot
    be verified and it would be hard to recommend this approach, the odds are good
    that this approach might yield a true key. However, if you intend to use this
    key for something important you should use a third-party certificate authority
    to supplement your confidence.


    Option D suffers from the the uncertainty about the certificate authority. Phoning
    them to validate their key, and thereby the certificate, is a reasonably strong
    approach: however, if you have never heard of the CA, you might just have taken
    careful steps to prove that the key given to you by organized attackers is genuinely
    the one created by those organized attackers.


    Option E is almost certainly the most sure way to know that you really have Bob''s
    keys. However, if Bob understands the notions of asymmetric cryptography so little
    that he gives you (even as his trusted friend) his private key, then this suggests
    that while you have confidence that you have his public key, you cannot have much
    confidence in the security of his private key. If his private key is indeed compromised,
    there is really not much that you can assume about any subsequent communications
    that you might have using the public key he gave you.


