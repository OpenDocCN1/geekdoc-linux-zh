    # Chapter 4. Design Patterns


    4.1 Creational Patterns


    4.2 Structural Patterns


    4.3 Behavioral Patterns


    Patterns were first used by a building architect named Christopher Alexander in
    the 1970s. He realized that there were certain solutions that you could apply
    over and over again to the same or similar problems. He also combined these existing
    solutions to create new solutions to a new problem. In 1987, Ward Cunningham and
    Kent Beck developed five patterns to use in interface design. But it wasn''t until
    1994 that Erich Gamma, Richard Helm, John Vlissides and Ralph Johnson published
    the famous book Design Patterns: Elements of Reusable Object-Oriented Software,
    which described a way of documenting patterns that has become the industry standard.
    These men are often referred to as the Gang of Four (GoF). As new patterns are
    developed, most follow the documentation standards described by the Design Patterns
    book.


    This chapter describes how you can use patterns to help you create an architecture.
    These patterns are usually at the object and class level, but they can also be
    abstracted to a higher level.


    After completing this chapter, you will be able to meet the following J2EE technology
    exam objectives:


    - From a list, select the most appropriate design pattern for a given scenario.
    Patterns will be limited to those documented in Gamma et al and named using the
    names given in that book.

    - State the benefits of using design patterns.

    - State the name of a Gamma et al. design pattern given the UML diagram and/or
    a brief description of the pattern''s functionality.

    - From a list, select the benefits of a specified Gamma et al. design pattern.

    - Identify the Gamma et al. design pattern associated with a specified J2EE feature.


    # Prerequisite Review


    This chapter assumes that you are already familiar with the Gang of Four (GoF)
    patterns, as described in “Design Patterns: Elements of Reusable Object-Oriented
    Software.” This chapter reviews the patterns in the context of the exam objectives
    to cover the material necessary for the exam.


    # Discussion


    A design pattern is a common solution to a common problem encountered in software
    development. In this chapter, we have described the patterns in terms of the following:


    - Name – A label used to identify the problem, solution, and consequences of a
    pattern. The pattern name should be descriptive and kept to one or two words.

    - Description – A short description of the pattern, a UML diagram, and code sample
    are all used to define the pattern.

    - Benefits – Describes the advantages using the specified pattern.

    - When to Use – Describes when in the application design you should use the pattern.


    There are three types of the GoF patterns:


    - Creational

    - Structural

    - Behavioral


    # 4.1 Creational Patterns


    Creational patterns support the creation of objects in a system. Creational patterns
    allow objects to be created in a system without having to identify a specific
    class type in the code, you do not have to write large, complex code to instantiate
    an object. It does this by having the subclass of the class create the object.
    However, this can limit the type or number of objects that can be created within
    a system.


    The following Creational patterns are described:


    - Abstract Factory

    - Builder

    - Factory Method

    - Prototype

    - Singleton


    # Abstract Factory Pattern


    This pattern provides an interface for creating families of related or dependent
    objects without specifying their concrete classes.


    Given a set of related abstract classes, the Abstract Factory pattern provides
    a way to create instances of those abstract classes from a matched set of concrete
    subclasses. Figure 4-1 illustrates the Abstract Factory pattern.


    Figure 4-1. The Abstract Factory Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_58_0.png)


    The Abstract Factory pattern provides an abstract class that determines the concrete
    class to instantiate to create a set of products. The client interacts only with
    the product interfaces and the Abstract Factory class. The client never knows
    about the concrete classes, provided by this pattern. The Abstract Factory pattern
    is similar to the Factory Method pattern, except it creates families of related
    objects.


    # BENEFITS


    The following lists the benefits of using the Abstract Factory pattern:


    - Isolates concrete classes.

    - Makes exchanging families easy.

    - Promotes consistency among products.


    # WHEN TO USE


    You should use the Abstract Factory pattern when:


    - The system should be independent of how its products are created, composed,
    and represented.

    - The system should be configured with one of multiple families of products, for
    example, Microsoft Windows or Apple Macintosh classes.

    - The family of related product objects is designed to be used together, and you
    must enforce this constraint. This is the key point of the pattern, otherwise
    you could use a Factory Method.

    - You want to provide a class library of products, and reveal only their interfaces,
    not their implementations.


    # # Builder Pattern


    The Builder pattern separates the construction of a complex object from its representation
    the same process can create different objects. The Builder pattern allows a client
    object to construct a complex object by specifying only its type and content.
    The client is shielded from the details of the object''s construction. This simplifies
    the creation of complex objects by defining a class that builds instances of another
    class. The Builder pattern produces one main product and there might be more than
    one class in the product, but there is always one main class. Figure 4-2 illustrates
    the Builder pattern.


    # Figure 4-2. The Builder Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_59_0.png)


    When you use the Builder pattern, you create the complex objects one step at a
    time. Other patterns build the object in a single step.


    # # BENEFITS


    The following lists the benefits of using the Builder pattern:


    - Lets vary a product''s internal representation.

    - Isolates code for construction and representation.

    - Gives you greater control over the construction process.


