    # Chapter 7. Protocols


    ## 7.1 HTTP


    ## 7.2 HTTPS


    ## 7.3 IIOP


    ## 7.4 JRMP


    The exam objectives specifically list HTTP, HTTPS, IIOP, and JRMP. These protocols
    serve two distinct purposes; HTTP and HTTPS are primarily intended for Web page
    transport, IIOP and JRMP are transports for CORBA and RMI respectively. However,
    HTTP and HTTPS are sometimes used for other purposes, and IIOP can be used as
    an alternative transport for RMI. In fact, IIOP is the preferred transport for
    EJB system. After completing this list you will be able to meet the following
    objectives:


    - Given a list of features, identify a protocol that is one of the following:
    HTTP, HTTPS, IIOP, or JRMP.

    - Given a scenario description, distinguish appropriate from inappropriate protocols
    to implement that scenario.

    - How firewall might interfere with the normal operation of a given protocol.


    # Prerequisite


    This chapter assumes you are familiar with the purpose and typical uses of HTTP
    and HTTPS. It also assumes that you understand some aspects of the nature of firewall
    in particular packet-filtering and proxy servers. For more information about firewalls,
    see Chapter 5, “Security.”


    ## 7.1 HTTP


    HTTP is primarily intended for loading Web pages over the Internet. It provides
    a number of request formats for the client. The main request formats are GET,
    POST, and HEAD. The GET, POST, and HEAD are not acronyms, rather strings used
    by the client.


    A GET request is the simplest form of HTTP request. It carries a single URL into
    the server and the server should respond with data. The URL for a GET request
    is reflected in the location bar at the top of most browsers. If the request requires
    any parameters, for example to perform a search, then these parameters are encoded
    in the URL using hexadecimal code that avoids use of spaces or any characters
    other than ASCII. A URL that performs a search for the string "hello there" might
    look like:


    ```

    http://myserver.com/search?hello%20there

    ```


    This type of request can carry only a modest amount of information into the server,
    otherwise the length of the URL becomes excessive. Significant number of attacks
    against Web servers have exploited long URLs. If you need to pass substantial
    amounts of data from the client to the server then you should probably use POST


    As with a GET request, the primary intent of a POST request is to obtain a Web
    page. However, a POST request differs from a GET request in that it is designed
    to transfer significant amount of data from the client to the server in multiple
    lines, rather than all the data embedded in the URL.


    A HEAD request is used to obtain limited amount of information about a Web page
    without loading the page itself. The intention of HEAD request is to determine
    if a cached page can be refreshed. To this, the HEAD request returns the date
    and time associated with the Web page and this can be compared with the date and
    time associated with the cache.


    By default, Web servers and therefore HTTP requests use port 80. However, the
    mechanism does not influence or control the data that can be passed over the port,
    so you can use any other port that might suit your needs. For example, you might
    need to run a Web server on a port other than 80 if you are running a second server
    on the same machine. Each port can be used by one process, so the two servers
    must have different ports. Ports with numbers up to 1024 are considered privileged
    in UNIX systems and cannot be opened by processes unless those processes have
    root privileges. If you use ports other than 80 for Web servers, the most common
    choices are 8000, 8080, 8008, and other ports in the range 8xx. Remember though,
    these port numbers are not significant to either HTTP, the Web server, nor to
    the TCP/IP mechanisms.


    The port number for any given request is embodied in the URL, and if there is
    no specific port number in the URL, then 80 is assumed. Because the majority of
    URLs loaded by a Web browser are taken directly from a Web page (as a result of
    the user following a link), using nonstandard port numbers is not usually a problem
    for the user. However, you should minimize the complexity of any URL the user
    might type as a starting point. For this reason, if you can use port 80 for your
    home page, you probably should do so.


    The HTTP protocol is stateless and this sometimes causes difficulty in complex
    situations. A stateless protocol means that each request/response pair is an isolated,
    self-contained unit. Data from an earlier request or response is not available
    to subsequent responses. This is not an issue when loading static Web pages, which
    is unacceptable in many Web applications. Consider a typical shopping cart application.
    Some state must be maintained between requests, otherwise it is impossible to
    associate the contents of one particular shopping cart with any particular request.


    You can add state to a browser connection using one of the following:


    - Cookies

    - URL rewriting

    - HTTPS

    - Applets and other clients


    A cookie is a variable, or name-value pair that is set by the Web server and stored
    on the browser. The browser can query the value of a given cookie and thereby
    associate a new request that a client makes with earlier requests. This allows
    the server to maintain state across multiple requests. Although a simple offseason
    mechanism itself, browsers have suffered from a number of bugs in the implementation
    of cookies. These bugs have led to security breaches and as some result users
    are not willing to allow their browsers to provide cookies to servers.


