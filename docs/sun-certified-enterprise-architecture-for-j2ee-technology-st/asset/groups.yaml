    In fact, the most common form of “virus” at the present time is really an active
    e-mail payload, it is a trojan horse not a virus, because it comes disguised as
    legitimate e-mail and uses the recipient to help it get into the target system.
    Once in the target system, it exploits poorly designed software to wreak havoc
    when you try to read it. As with real-time threats, if the attack never reaches
    your system, then it is unlikely to damage.


    One type of attack cannot be prevented by refusing to accept hostile messages.
    Denial of Service attacks (sometimes called DoS, DDoS, Distributed Denial of Service)
    by simply flooding the victim''s network connections. In these cases, refusing
    to accept or acknowledge the inbound messages does not help. The only effective
    protection is to have the routers in the Internet infrastructure recognize the
    malicious messages and refuse to forward them. This, unfortunately, is hard to
    achieve because it requires the cooperation of three parties.


    # ## Keeping Attacks at Bay


    A number of techniques are in regular use that are intended to prevent attacks
    from ever reaching sensitive systems. The most fundamental of these is the packet-filtering
    router. This system provides a single point of connection between a group of sensitive
    systems (“the intranet”) and the outside world (the Internet). The router allows
    packets into the intranet only if they are destined for specifically listed systems
    on specific ports. That is, it allows network traffic to communicate only with
    specific server software. This type of approach can be quite helpful, and is simple
    to implement. It minimizes the number of points in your systems against which
    malicious behavior can be directed and thereby reduces the amount of work required
    to check that all vulnerable points are as secure as possible. This approach directly
    protects against attacks that seek weaknesses in services you don''t intend to
    offer; however, by reducing the number of points of potential attack, it allows
    you to focus on securing the systems you need to provide.


    Along being selective about what systems and ports inbound packets can reach,
    your systems should allow packets into your network only if there is a reasonable
    chance that the packet''s source address is valid. A packet claiming to be from
    an address that is inside your network has no business appearing from the outside.
    Given that privilege is sometimes granted based on the source IP address, this
    type of “spoof” attack must be prevented at the first available point.


    These three filter criteria: destination IP address, destination port, and the
    source IP address are a bare minimum. You should add additional criteria of restriction
    based on the content of the messages, rather than just the source and destination
    addresses. A system that performs additional filtering is generally called a firewall.
    Different firewall can provide different features, but a typical firewall at least
    includes packet filtering and one or more proxy servers. A proxy server mimics
    the network protocol of a particular service, but rather than providing the service,
    it inspects the inbound request for validity. Then the message appears to be'
