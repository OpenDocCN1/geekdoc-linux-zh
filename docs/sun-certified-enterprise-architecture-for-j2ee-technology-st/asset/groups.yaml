    ## 2.14 使用中间数据访问对象（DAO）


    如果你决定 BMP（无值映射）是你的实体豆（entity beans）的最佳方法，这意味着你正在将 SQL 编码到你的实体豆中。为了减少实体豆与读取、插入、更新和删除对象所需的
    SQL 之间的耦合，可以创建一个封装了 SQL 的 DAO（数据访问对象）。通过封装读取、插入、更新和删除对象所需的代码，你减少了对代码变化和数据变化的依赖。


    DAO 包含了在数据源中插入、更新、删除和读取对象的实现代码。这允许实体豆被定义为 BMP，但当豆更适合处理 CMP（容器管理映射）时，该实体豆可以更改为
    CMP。将数据访问封装在 DAO 而不是实体豆中，允许豆使用容器提供的 CMP 支持来替换 DAO。


    使用 DAO 的代价是额外的层级以及创建 DAO 垃圾回收的开销。此外，如果你不熟悉编写 SQL 代码，你可能会写出缓慢的 SQL 命令。


    # 核心要点


    以下总结了本章描述最重要的点：


    - 分布式且需要事务、安全和资源管理的应用程序适用于使用 J2EE 技术实现。

    - JSP 和 servlets 非常适合实现 J2EE 应用程序的用户组件。

    - EJBs 适用于 J2EE 中业务逻辑实现。

    - 适用于使用 EJB 持久化、事务、支持和安全实现的应用方面。

    - 实现 EJB 需要的类是：`java.ejb.EJBHome`、`java.ejb.EJBObject` 以及使用 `java.ejb.Session`
    或 `java.ejb.EntityBean` 的方法实现。

    - 实体豆是持久化的共享资源，会话豆（session beans）与用户请求关联且不共享。

    - 有状态会豆维护用户的对话状态，而无状态会豆在多个用户之间共享，每个用户通过单个请求/响应控制该豆。

    - 豆池（Bean pooling）允许更多的用户使用更资源使用系统。

    - 钝化（Passivation）允许 EJB 容器使用更少的会豆来支持更多资源。

    - CMP 允许你创建持久化对象而无需维护持久对象的代码。CMP 的缺点是工具不足以提供企业级应用所需的性能。

    - DAO 允许你控制从资源访问数据并在工具提供更好支持时切换到 CMP，但这意味着你必须编写和维护 SQL 代码。


    # 复习进度


    本节回顾了本章描述的目标，并提供了复习题以确保你理解了本章的要点。


    目标：从列表中选择适用于使用 J2EE 实现的应用方面


    + 1. 下列哪项不是适用于 J2EE 的应用方面？




    A. 事务

    B. Applet

    C. 安全

    D. 资源管理

    E. 分布式


    A: 正确答案是 B。


    Applet 是一种技术，而不是应用方面。


    目标：识别用于实现特定应用方面的合适 J2EE 技术


    + 2. 你将使用哪种技术在 J2EE 中实现异步消息？


    A. JMS

    B. RMI

    C. JNDI

    D. HTTP


    A: 正确答案是 A。


    JMS 是用于在 J2EE 中实现异步消息的技术。

    RMI、JNDI 和 HTTP 不提供异步消息。


    目标：从列表中选择适用于使用 EJB 实现的应用方面


    + 3. 哪一项不是适用于使用 EJB 实现的应用方面？


    A. 分布式

    B. 安全

    C. 资源管理

    D. 命名服务


    A: 正确答案是 D。


    分布式、安全和资源管理是你使用 EJB 实现的应用方面。命名服务是一个应用方面，但你应该使用 JNDI 而不是 EJB。


    # 目标：列出 EJB 提供的类/接口


    + 4. 如果你正在实现实体豆，哪类类不是必须的？


    + A. javax.ejb.EJBObject

    B. javax.ejb.Entity

    C. javax.ejb.EJBRemote

    D. java.ejb.EJBHome


    A: 正确答案是 C。


    没有 `javax.ejb.EJBRemote` 类。


    目标：区分会话豆和实体豆


    + 5. 关于会话豆的哪个陈述是正确的，但关于实体豆是不正确的？


    + A. 豆在 MVC 设计模式中被用作模型。

    B. 状态是持久的，可以代表数据库表中的行。

    C. 豆可以使用数据访问对象来促进迁移到 CMP。

    D. 状态代表特定客户端的对话状态。


    A: 正确答案是 D。


    MVC 中的模型是实体豆。实体豆将数据作为数据库表中的行持久化，CMP 仅用于实体豆。


    目标：区分有状态会豆和无状态会话豆


    + 6. 关于有状态会豆的哪个陈述是正确的，但关于无状态会豆是不正确的？


    A. 状态可以缓存，但不代表客户端状态。

    B. 状态可以缓存，并且代表客户端状态。

    C. 状态是持久的。

    D. 状态先缓存，后持久化。


    A: 正确答案是 B。


    答案 A 对于有状态豆是正确的，对于无状态豆不是。有状态豆是被缓存的，但不是持久化的，所以答案 C 和 D 是错误的。


    目标：识别实体豆、有状态豆和会话豆的适当用途


    + 7. 如果你有处理工作流的代码并想要最轻量级的 EJB，你应该使用哪种 EJB？


    A. 实体

    B. 有状态会豆

    C. 无状态会豆

    D. Servlet


    A: 正确答案是 C。


    Servlet 不是 EJB，所以我们可以排除该选项。每个 EJB 都可以用于工作流，但最轻量级的 EJB 是无状态会豆。


    目标：解释 EJB 容器如何进行周期管理并具有增加扩展性的能力


    + 8. 关于会话豆生命周期的哪个陈述是正确的？


    A. 有状态会豆的数据在服务器崩溃后仍然存在

    B. 崩溃重启的服务器可以反序列化有状态会豆的缓存数据

    C. 会话豆实例可以通过句柄重建

    D. 容器激活无状态会豆以释放资源


    A: 正确答案是 C。


    会话豆可以通过会话豆生成的句柄重建。无状态豆从不被钝化，生存服务器崩溃的豆是实体豆。


    目标：阐述 EJB 容器中豆池的用处


    + 9. 关于池化的哪个陈述是正确的？


    A. 池化的无状态豆限制了与其他厂商的互操作性

    B. 池化的实体豆提供了到数据库的连接池

    C. 池化减少了所需的组件实例

    D. 池化的实体豆提供了更好的 SQL 支持


    A: 正确答案是 C。


    豆池用于减少服务用户所需的组件数量，从而减少应用程序资源。


    目标：阐述 EJB 容器中钝化的用处


    + 10. 关于钝化的哪个陈述是正确的？


    A. 容器必须将临时值设置为空或零。

    B. 容器必须使用 Java 技术序列化来钝化豆实例。

    C. 容器调用 ejbPassivate 将豆实例的状态保存到数据库。

    D. 只要遵循 Java 序列化规则，容器可以使用任何序列化技术来钝化豆实例。


    A: 正确答案是 D。


    答案 A 是错误的，因为规范没有强制容器将临时值设置为空或零。答案 B 是错误的，因为容器可以使用选择的序列化方式。答案 C 是错误的，因为 ejbPassivate
    将状态写入文件系统而不是数据库。


