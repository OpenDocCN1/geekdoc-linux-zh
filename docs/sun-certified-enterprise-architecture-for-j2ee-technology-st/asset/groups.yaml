    + A. javax.ejb.EJBObject

    B. javax.ejb.Entity

    C. javax.ejb.EJBRemote

    D. java.ejb.EJBHome


    A: The correct answer is C.


    There is no javax.ejb.EJBRemote class


    # Objective: Distinguish between session and entity beans


    + 5. Which statement is true about session beans, but is NOT true about entity
    beans?


    + A. The bean is used as the model in the MVC design pattern.

    B. State is persistent and can represent a row in a database table.

    C. The bean can use a data access object to facilitate migration to CMP.

    D. State represents a conversational state for a specific client.


    A: The correct answer is D.


    The model in MVC is an entity bean. Entity beans persist data as a row in the
    database table and CMP is used only for entity beans.


    # Objective: Distinguish between stateful and stateless session beans


    + 6. Which statement is true about stateful session beans, but is NOT true about
    stateless session beans?


    A. State can be cached but is not representative of the client state.

    B. State can be cached but is representative of the client state.

    C. State is persistent.

    D. State is cached first, then persisted.


    A: The correct answer is B.


    Answer A is true of stateful and not stateless. A stateful bean is cached, but
    is not persisted, so answer C and D are incorrect.


    # Objective: Recognize appropriate uses for entity, stateful, and session beans


    + 7. If you have code that deals with workflow and you want the lightest EJB,
    which EJB should you use?


    A. Entity

    B. Stateful session bean

    C. Stateless session bean

    D. Servlet


    A: The correct answer is C.


    A Servlet is not an EJB, so we can eliminate that option. Each of the EJBs could
    be used for workflow, but the lightest EJB is the stateless session bean.


    # Objective: Explain how the EJB container does life-cycle management and has
    the capability to increase scalability


    + 8. Which statement about the life cycle of session bean is true?


    A. The data in a stateful session bean survives a server''s crash

    B. A server that has crashed and been restarted can deserialize cached data for
    a stateful session bean

    C. A session bean instance can be recreated through the use of a handle.

    D. The container canivate a stateless session bean to free resources


    A: The correct answer is C.


    A session bean can be recreated from the handle that is generated by the session
    bean. Stateless session beans are never passivated and the only bean to survive
    a server crash is an entity bean.


    # Objective: State the benefits of bean pooling in an EJB container


    + 9. Which statement about bean pooling is true?


    A. Pooled stateless beans limit interoperability with other server vendors

    B. Pooled entity beans provide connection pooling to the database

    C. Pooling reduces the number of component instances needed

    D. Pooled entity beans provide better support for SQL


    A: The correct answer is C.


    Bean pooling is used to reduce the number of components needed to service the
    users, thus reducing resources for the application.


    # Objective: State the benefits of passivation in an EJB container


    + 10. Which statement on passivation is true?


    A. Containers must set the transient values to null or zero.

    B. Containers must use Java technology serialization to passivate a bean instance.

    C. Container calls ejbPassivate to save the bean instance''s state to the database.

    D. Container can use any serialization technique to passivate a bean instance
    as long as it follows Java serialization rules.


    A: The correct answer is D.


    Answer A is false because the specification does not mandate the container set
    transient values to null or zero. Answer B is false because the container can
    use the serialization of choice. Answer C is false because ejbPassivate writes
    the state to the file system and not the database.

