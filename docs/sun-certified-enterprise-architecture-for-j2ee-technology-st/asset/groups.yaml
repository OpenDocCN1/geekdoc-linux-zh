    - CERT advisories, http://www.cert.org/contact_cert/certmailist.html

    - Crypto-gram, the newsletter of Counterpane Internet Security, Inc. http://www.counterpane.com/crypto-gram.html


    # Prerequisite Requirement


    This chapter discusses security issues in terms that require no prior understanding.
    As such, no prerequisite app apply, although you would appreciate the fundamental
    goals of security, which are protection of data from unauthorized reading or modification,
    protection of computer resources against unauthorized use, and guaranteeing correctness
    and availability of resources and data for authorized persons and entities.


    # 5.1 Downloaded Code, Applets, and the Java Security Manager


    You probably have heard discussions about what applets can do in a Java-enabled
    browser. These discussions often gloss over one important point. Java doesn''t
    apply security rules specifically to instances of subclasses of the java.applet.Applet
    class. Rather, it uses a security manager to apply rules to all classes. Different
    rules are applied'
- md: '

    to different classes depending on where the particular class was loaded, and what,
    if any, signature was associated with it. Generally, the security manager applies
    restrictions to all classes except those that are loaded from the system''s boot
    classpath. The boot classpath is the list of locations from which core classes
    are loaded. Usually, this is restricted to the jarfiles in the directory jre/lib
    under the main Java installation.


    This discussion suggests classes loaded from the local file system using CLASSPATH
    are still subject to security rules, but whatever programs open files successfully.
    You probably know, or can guess, that opening arbitrary files is something the
    security manager would normally prohibit. How can your program, which is not loaded
    from the boot classpath, succeed in opening the file if the security restrictions
    apply to all nonempty classes? In a Java application, the security manager is
    not installed unless you deliberately install it. Installing the security manager
    can be done in the program [using System.setSecurityManager(new SecurityManager())]
    or from the command line [using java -Djava.security.manager]. If code is running
    in a browser, it is important that the security manager should be installed by
    default, and that is handled by the browser itself.


    ## What Does the Security Manager Prohibit?


    The exam requires you to know the default behavior of the security manager in
    a browser. This is valuable for two reasons: first, you will know immediately
    if an applet can perform any particular operation without privilege, and second,
    you gain some understanding of why these operations might be harmful. Don''t forget
    that if an applet cannot perform a given operation by default, then in practice
    you should probably assume that an applet is not a suitable choice for this functionality
    because most browser users are unwilling, and possibly unable, to grant permissions
    to an applet.


    The security manager works by checking whether a particular permission is granted
    to the requesting class. A permission is represented by a class describing the
    permission. Instances of the permission class describe the permission in more
    detail by adding a name and action. The name and action are optional in some permission
    classes, when used, they qualify the exact behavior that is to be allowed. For
    example, the permission class java.io.FilePermission can be granted with the name
    "read" and the action "tmp/*" permission to read any file in the /tmp directory
    (but not subdirectories).


    The permission mechanism is extensible, so you can add new permissions that control
    access to devices or behavior you create, and verify whether they have been granted
    at run. The time is not concerned with arbitrary permissions because these are
    denied to downloaded code by default. Consequently, you need to concern yourself
    only with the permissions that are part of the core JDK. For example, you do not
    have to learn every permission, with all its variants. Instead, you should consider
    the categories of permission that are permitted and those that are denied. Also,
    bear in mind that the permissions change (that is, new ones are added) from time
    to time with new releases of the JDK.


    ## PERMITTED OPERATIONS


    In general, few permissions are granted to untrusted code; typically, only those
    permissions needed for a program to work, such as the ability to create a thread,
    the limited ability to manipulate threads in the thread group that the browser
    created for the applet, the ability to perform essential manipulation of the AWT
    event queue that a GUI operates correctly, and the limited ability to read but
    not modify any system properties. In addition to these permissions, an applet
    is generally permitted to make network connections to the host from which it was
    loaded. You might wonder why the applet is prevented from connecting to other
    hosts. There are two reasons, one subtle and more probable than the other. If
    an applet could make arbitrary connections to other hosts, then applets could
    be used as the origin for denial of service attacks against other systems. However,
    the original reason that network connections are prohibited is simply that many
    systems grant privilege to network requests based on the origin IP address of
    that request. If an applet could connect to arbitrary hosts, then would be possible
    for it to connect to a server inside your corporate network. If that server grants
    access to your machine based on IP address, then it would grant access to the
    applet, because it is sending requests from your machine. the applet could then
    obtain sensitive information and pass it back to its author, which you do not
    want to allow.


    ## DENIED OPERATIONS


    In general, any operation that might be to compromise the host is denied. The
    only exceptions to these are CPU usage, memory usage, and network bandwidth usage.
    In the security system at the time of writing, there are no checks to determine
    if an applet is trying to use excessive amounts of CPU time. On UNIX operating
    systems, this is not a significant issue, because the amount of CPU available
    to the browser is restricted by the operating system. On other systems, an applet
    could deliberately create so many threads that the host system, rather than only
    the browser, becomes crippled.


    In a similar way, the use of memory by an applet is not restricted by the security
    system. The expectation is that the host operating system guards against any single
    process becoming excessively greedy. Again, it is possible that on systems this
    might not be the case.


    Finally, use of network bandwidth is not restricted, making it possible for an
    applet to connect to the host from which it was loaded and start sending network
    packets as fast as it can. This would degrade the network performance of the host
    that runs such an applet.


    None of these faults of behavior cause permanent damage, they are irritating and
    can generally be stopped by killing the browser that is running the rogue applet.
    It would be more serious if an applet could access files on the host computer,
    or execute arbitrary programs, or send network messages to any arbitrarily chosen
    host. This is functions that are universally guarded by all versions of browsers,
    and have been so since the first time an applet was run.


    Because an applet can send information over the network to the host, an important
    goal of the security system is to prevent accessing sensitive information. For
    example, although applets can make normal TCP/IP connections only with the host
    from which they were loaded, it is possible for them to send data to cooperating
    host on the Internet. This can be achieved in a variety of ways, but usually the
    techniques involve the use of common Internet protocols or services, such as DNS.


    Java WebStart is another technology that is available for thin client systems.
    It becomes part of the core distribution of JDK with the advent of 1.4. Java WebStart
    provides all the benefits of applets and addresses the problems that make applets
    less satisfactory. At the time of writing, there are no objectives that relate
    specifically to Java WebStart; however, it is a powerful and elegant technology
    that simplifies system maintenance and thereby enhances security. Any company
    that uses internal applications is likely to benefit from using WebStart. Therefore,
    it seems reasonable to include a brief outline of this technology, partly because
    the objectives related to the technology might be added to the exam in the future.


    Java WebStart provides a small window that presents icons in a manner similar
    to a Windows desktop. These icons do not necessarily installed, but are typically
    links to code on a Web server somewhere.


    When you launch one of the applications in the Java WebStart desktop, the classes
    needed to run that application are downloaded from the Web server. This behavior
    is similar to that of an applet. However, once downloaded, the classes are stored
    locally. This allows for a faster startup on subsequent uses of the application.
    Better yet, each time you try to run that application, the system checks to see
    if any updates are available on the Web server, and if any updates exist, the
    needed changes are downloaded. This ensures that the application is always ready
    to run, even if your computer is not connected to the network, but also ensuring
    that the most up-to-date version is possible used. This occurs with no need for
    an installation phase.


    From the point of view of this chapter, the most significant feature of Java WebStart
    is that it provides a modified sandbox, the security manager used in Java WebStart
    does not necessarily reject any request for privileged behavior. Rather, it can
    be configured easily by either the system administrator or the user to allow such
    behavior when it is deemed appropriate.


    ## 5.2 Foundations of Security


    The essential point of security is to protect resources from unauthorized access.
    This requires two categories of protection: data on the network, and both data
    and processes on the computer itself.

