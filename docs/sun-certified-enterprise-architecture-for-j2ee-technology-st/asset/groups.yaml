    # Stateless Beans


    Stateless session beans do not hold any conversational state for a client. However,
    this does not mean they cannot hold a state, Stateless session beans can hold
    a state, but the state is not guaranteed to be specific to the calling client.
    This means you can use stateless session beans to do almost anything in your application.


    # Stateful Session Beans


    Stateful session beans give you the capability to hold a conversational state
    for a client. There are any number of ways to handle a conversational state in
    an enterprise application, but if the state needs to be close to the business
    logic, then it should be in a stateful session bean. A shopping cart is an example
    of a stateful session bean.


    # 2.8 EJB Life Cycle


    Each EJB has a unique life cycle. This life cycle dictates the behavior of the
    EJB. If you use the appropriate EJB, then it is the life cycle of the EJB that
    can help the scalability of an application.


    Figure 2-2 illustrates the life cycle of a stateless session bean.


    > Figure 2-2. Life Cycle of a Stateless Session Bean'
