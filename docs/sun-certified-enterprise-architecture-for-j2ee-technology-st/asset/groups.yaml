    A state machine is a type of behavior that specifies the sequence of states an
    object or an interaction goes through during its lifetime in response to events,
    together with its responses to those events. Figure 3-9 illustrates a state machine.


    # ### Figure 3-9. A State Machine


    ![](img/5715971f4d127ce26084f269dd89411b_39_0.png)


    # ### Grouping Element


    There is only one type of grouping element and that is a package. A package is
    a general-purpose mechanism for organizing elements into groups. Figure 3-10 illustrates
    a package.


    # ### Figure 3-10. A Package


    ![](img/5715971f4d127ce26084f269dd89411b_39_1.png)


    # ### Annotational Elements


    There is only one type of annotational element and it is a note. A note is a symbol
    for rendering comments that you attached to other elements or collections of elements.
    Visually, the note is represented by a rectangle with the upper right corner folded
    in. Figure 3-11 illustrates a note.


    # ### Figure 3-11. A Note


    ![](img/5715971f4d127ce26084f269dd89411b_39_2.png)


    # ### Relationships


    There are four standard relationships in UML: dependency, association, generalization,
    and realization. You use the relationships to create links between the elements
    in your model.


    A dependency is a semantic relationship between two elements in which a change
    to one thing (the independent thing) can affect the semantics of the other thing
    (the dependent thing). The dependency is represented as a dashed-line with an
    arrow on the end. The arrow indicates the direction of the dependency. Using the
    following diagram, Class1 has'
  - '[PAGE 40]


    a reference to Class2, either passed as a method parameter or defined as a method
    variable in some method. Figure 3-12 illustrates a dependency relationship.


    # Figure 3-12. A Dependency Relationship


    ![](img/5715971f4d127ce26084f269dd89411b_40_0.png)


    An association is a structural relationship that describes a set of links. A link
    is a connection between objects. The association is a solid line. Each association
    has two roles. A role is a direction on the association and can be named with
    a label.


    In the example, the Company class has a class variable of type Employee and the
    role of Employee to Company is named Employer. Each role can have a multiplicity,
    which is an indication of the number of participants in the relationship. Table
    3-1 indicates the different types of multiplicity.


    # Table 3-1.


    | Multiplicity | MEANING |

    |---|---|

    | 1 | One and only one |

    | 0..* or * | Zero to infinity |

    | 1..* | One to infinity |

    | 2..4 | Range of 2 to 4 |

    | 2,4 | 2 or 4 |


    Using the example, a Company has to many Employees and an Employee can belong
    to only one Company. Associations also can be navigated (navigability), in the
    direction of the association and this is represented by an arrow. Navigability
    indicates whether the object has a responsibility to inform the other. To put
    another navigability indicates which object has a class variable referencing the
    other object. If you have navigability in one direction indicated by an arrow
    on one end, then you have a unidirectional association. No arrow on either end
    means you have a bidirectional association. Using the following example, there
    is no arrow; therefore, the association is bidirectional. This means the Company
    class has a class variable of type Array, Vector, or Collection that holds objects
    of type Employee and Employee has a class variable of type Company. Figure 3-13
    illustrates an association.


    # Figure 3-13. An Association


    ![](img/5715971f4d127ce26084f269dd89411b_40_1.png)'
  - '[PAGE 41]


    Aggregation is a special kind of association, representing a structural relationship
    between a whole and its parts. The Aggregation is a diagram with an open diamond
    on the side of the whole. Using Figure 3-14, we can see that a Company is comprised
    of its parts which is the Employees. Figure 3-14 illustrates an aggregation.


    # Figure 3-14. An Aggregation


    | Company | 1..* Employee |

    |---|---|

    | employer | |


    Generalization is a specialization/generalization relationship in which objects
    of the specialized element (child) are substitutable for objects of the generalized
    element (parent). Generalization is visually represented as a line with an open
    arrow on the end. The arrow points from the child/subclass to the parent/superclass.
    Figure 3-15 illustrates a generalization.


    # Figure 3-15. Generalization


    | Subclass | Superclass |

    |---|---|

    | | |


    A realization is a semantic relationship between classifiers, where one classifier
    specifies a contract that another classifier guarantees to carry out. The realization
    relationship is represented by a dashed-line with a solid arrow. Figure 3-16 illustrates
    a realization.


    # Figure 3-16. A Realization


    ![](img/5715971f4d127ce26084f269dd89411b_41_0.png)


    # 3.2 Common Mechanisms in UML


    There are four common mechanisms that apply consistently throughout UML: specifications,
    adornments, common division, and extensibility.


    # Specifications


    UML is more than just a graphical language. Beyond every part of its graphical
    notation there is a specification that provides a textual statement of the syntax
    and the semantics of that building block. For example, a class icon has a specification
    that provides the full set of attributes, operations, and behaviors described
    by class. Visually, a class icon might show only a small part of the specification
    or it might show the entire specification. With this in mind, you could create
    diagrams with only icons and build up the specification, or you could create the
    specification by reverse engineering and then'
  - '[PAGE 42]


    build up the diagrams. Figure 3-17 contains the -attribute:int and +operation1():void,
    which are the specification of the class name.


    # Figure 3-17. An Example of a Specification of a Class Name


    | name |

    | -attribute1:int |

    | +operation1():void |


    # Adornments


    The adornments mechanism indicates whether an element is public, private, protected
    respectively represented by +, -, #. In the previous example, attribute1 is private
    and operation1 is public.


    # Common Divisions


    The common division designates instances of an element. For example, if the element
    name is underlined, it is an instance of an element. You can proceed an element
    name with :a and have an anonymous instance. You can place a name in front of
    the : and have a named instance of an element. Figure 3-18 contains the :name,
    which means that you have an anonymous instance of class name.


    # Figure 3-18. Common Division


    | name |

    | -attribute1:int |

    | +operation1():void |


    # Extensibility Mechanisms


    Extensibility mechanisms allow you to shape and grow UML to meet your project''s
    requirements. In addition, these mechanisms enable UML to adapt quickly to new
    technologies by creating new building blocks from the existing UML building blocks.'
  - '[PAGE 43]


    +   - Stereotypes – Extends the vocabulary of UML allowing you to create new kinds
    of building blocks. These building blocks are derived from existing building blocks
    but are specific to your problem.

    - Tagged values – Extends the properties of a UML building block allowing you
    to create new information in that element''s specification.

    - Constraints – Extends the semantics of a UML building block, allowing you to
    add new rules or modify existing ones.


    # The UML Diagrams


    A diagram is the graphical presentation of a set of elements, most often rendered
    as a connected graph of vertices (elements) and arcs (relationships).


    # Use-Case Diagram


    A use-case diagram shows a set of use cases and actors and their relationships.
    Use-case diagram addresses the static use case view of a system. These diagrams
    are especially important in organizing and modeling the behaviors of a system.


    Figure 3-19 has actors Customer, Catalog System, Service Rep, and Warehouse. The
    Customer and Service Rep actors interact with the use-cases Browse Catalog, Search
    for Product, Create Customer Account, and Checkout. The Browse Catalog and Search
    for Product use cases retrieve or send information to the Catalog System actor.
    The Checkout use case retrieves or send information to the Warehouse actor.


    Figure 3-19. Use-Case Diagram


