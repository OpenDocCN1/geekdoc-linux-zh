    # 第 7 章 协议


    ## 7.1 HTTP


    ## 7.2 HTTPS


    ## 7.3 IIOP


    ## 7.4 JRMP


    考试目标专门列出了 HTTP、HTTPS、IIOP 和 JRMP。这些协议具有两个不同的目的；HTTP 和 HTTPS 主要用于 Web 页面传输，IIOP
    和 JRMP 分别是 CORBA 和 RMI 的传输。然而，HTTP 和 HTTPS 有时用于其他用途，且 IIOP 可以作为 RMI 的替代传输。事实上，IIOP
    是 EJB 系统的优传输。完成此列表后，你将能够实现以下目标：


    - 给定特性列表，识别出一个是 HTTP、HTTPS、IIOP 或 JRMP 之一的协议。

    - 给定场景描述，区分实现该场景的合适和不合适的协议。

    - 防火墙如何干扰给定协议的正常运行。


    # 前提


    本章假设你熟悉 HTTP 和 HTTPS 的目的和典型用途。它假设你理解防火墙性质的某些方面，特别是数据包过滤和代理服务器。有关防火墙的更多信息，请参见第
    5 章“安全”。


    ## 7.1 HTTP


    HTTP 主要用于在互联网上加载 Web 页面。它为客户端提供了多种请求格式。主要的请求格式是 GET、POST 和 HEAD。GET、POST 和 HEAD
    并不是缩写，而是客户端使用的字符串。


    GET 请求是 HTTP 请求的最简单形式。它将单个 URL 携带到服务器，服务器应该返回数据。GET 请求的 URL 反映在大多数大多数浏览器顶部的地址栏中。如果请求需要任何参数（例如为了执行搜索），则这些参数将使用十六进制代码编码在
    URL 中，以避免使用空格或 ASCII 以外的任何字符。执行字符串 "hello there" 搜索的 URL 如下所示：


    ```

    http://myserver.com/search?hello%20there

    ```


    这种类型的请求只能向服务器携带适量的量信息，否则 URL 的长度将变得过长。针对 Web 服务器的大量攻击利用了长 URL。如果你需要从客户端向服务器传递大量数据，那么可能应该使用
    POST。


    与 GET 请求一样，POST 请求的主要意图是获取 Web 页面。然而，POST 请求与 GET 请求的不同之处在于，它被设计为多行从客户端向服务器传输大量数据，而不是将所有数据嵌入
    URL 中。


    HEAD 请求用于获取有关 Web 页面的有限信息，而不加载页面本身。HEAD 请求的意图是确定缓存页面是否可以刷新。为此，HEAD 请求返回与 Web 页面相关的日期和时间，这可以与缓存相关的日期和时间进行比较。


    默认情况下，Web 服务器以及因此 HTTP 请求使用端口 80。然而，该机制不会影响或控制通过该端口传递的数据。由于要在同一台机器上运行另一个服务器，你可能需要在非
    80 端口上运行 Web 服务器。每个端口只能由一个进程使用，因此两个服务器必须具有不同的端口。1024 以下的端口在 UNIX 系统中被认为是特权端口，除非进程具有
    root 权限否则无法打开。如果你对 Web 服务器使用非 80 端口，常见的选择是 8000、8080、8008 以及 8xx 范围内的其他端口。但记住，这些端口号对于
    HTTP、Web 服务器或 TCP/IP 机制并不重要。


    任何请求的端口号体现在 URL 中，如果 URL 中没有特定的端口号，则假设为 80。由于大多数由浏览器加载的 URL 是直接从 Web 页面获取的（用户点击链接的结果），使用非标准端口对用户通常没有问题。然而，你应该尽量减少用户可能输入的任何
    URL 的复杂性。出于这个原因，如果你可以使用 80 端口作为你的主页，你可能应该这样做。


    HTTP 协议是无状态的，这在复杂情况下有时会导致困难。无状态协议意味着每个请求/响应对都是孤立的、自包含单元。早期请求或响应的数据对后续响应不可用。在加载静态
    Web 页面时这不是问题，但在许多 Web 中是不可接受的。考虑一个典型的购物购物车应用程序。在请求之间必须维护状态，否则无法将特定购物购物车的内容与任何特定请求关联。


    你可以使用以下之一为浏览器连接添加状态：


    - Cookies

    - URL 重写

    - HTTPS

    - Applets 和其他客户端


    Cookie 是由 Web 服务器设置并存储在浏览器中的变量或键值对。浏览器可以查询给定 cookie 的值，从而将客户端发出的新请求与之前的请求关联起来。这允许服务器跨多个请求维护状态。虽然
    Cookie 本身是一个简单的机制，但浏览器在实现 cookie 时遭受了许多漏洞。这些漏洞导致了安全漏洞，作为某些结果，用户不愿意允许浏览器向服务器提供
    cookie。


