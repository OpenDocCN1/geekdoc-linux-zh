  md: '# 4.3 Behavioral Patterns


    Behavioral patterns influence how state and behavior flow through a system. By
    optimizing how state and behavior are transferred and modified, you can simplify,
    optimize, and increase the maintainability of an application.


    The following Behavioral patterns are described:


    +   - Chain of Responsibility

    - Command

    - Interpreter

    - Iterator

    - Mediator

    - Memento

    - Observer

    - State

    - Strategy

    - Template Method

    - Visitor


    # Chain of Responsibility Pattern


    The Chain of Responsibility pattern establishes a chain within a system, so that
    a message can be either handled at the level where it is first received, or directed
    to an object that can handle it. Figure 4-13 illustrates the Chain of Responsibility
    pattern.


    > Figure 4-13. The Chain of Responsibility Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_70_0.png)


    # BENEFITS


    The following lists the benefits of using the Chain of Responsibility pattern:


    +   - Reduced coupling

    - Added flexibility in assigning responsibilities to objects'
  merge: -1
  pgno: 70
- img_proc: true
  md: '+   - Allows a set of classes to behave as a whole, because events produced
    in one class can be sent on to other handler classes within the composite


    # WHEN TO USE


    You should use the Chain of Responsibility pattern when:


    +   - More than one object can handle a request, and the handler isn''t known.

    - You want to issue a request to one of several objects without specifying the
    receiver explicitly.

    - The set of objects that can handle a request should be specified dynamically.


    # Command Pattern


    The Command pattern encapsulates a request in an object, which enables you to
    store the command, pass the command to a method, and return the command like any
    other object. Figure 4-14 illustrates the Command pattern.


    # Figure 4-14. The Command Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_71_0.png)


    # BENEFITS


    The following lists the benefits of using the Command pattern:


    +   - Separates the object that invokes the operation from the one that knows
    how to perform it.

    - It''s easy to add new commands, because you don''t have to change existing classes.


    # WHEN TO USE


    You should use the Command pattern when:


    +   - You want to parameterize objects by an action to perform.

    - You specify, queue, and execute requests at different times.

    - You must support undo, logging, or transactions.'
  merge: -1
  pgno: 71
