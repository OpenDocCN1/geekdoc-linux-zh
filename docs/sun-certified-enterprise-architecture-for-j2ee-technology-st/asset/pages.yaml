    # Steps to Certification


    # 1. PREPARE FOR TESTING


    Review the exam objectives in this guide to help verify that you have sufficient
    knowledge to complete them successfully.


    # 2. VERIFY THE EXAM NUMBER AND REGISTER FOR THE MULTIPLE-CHOICE EXAM


    When you''re ready for the multiple-choice exam, you can purchase an exam voucher
    from your local Sun Educational Services office. To find your local office, go
    to http://www.sun.com/service/suned and choose the country in which you want to
    take the test.'
