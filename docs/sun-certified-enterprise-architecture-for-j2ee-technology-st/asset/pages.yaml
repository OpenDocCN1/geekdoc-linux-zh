  md: '+   - Promotes weak coupling between the subsystem and its clients.

    - Reduces coupling between subsystems if every subsystem uses its own Façade pattern
    and other parts of the system use the Façade pattern to communicate with the subsystem.

    - Translates the client requests to the subsystems that can fulfill these requests.


    # WHEN to USE


    You should use the Façade pattern when:


    +   - You want to provide a simple interface to a complex subsystem.

    - There are many dependencies between clients and the implementation classes of
    an abstraction.

    - You want to layer your subsystems.


    # Flyweight Pattern


    The Flyweight pattern reduces the number of low-level, detailed objects within
    a system by sharing objects. If instances of a class that contain the same information
    can be used interchangeably, the Flyweight pattern allows a program to avoid the
    expense of multiple instances that contain the same information by sharing one
    instance. Figure 4-11 illustrates the Flyweight pattern.


    > Figure 4-11. The Flyweight Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_68_0.png)


    # BENEFITS


    The following lists the the benefits of using the Flyweight pattern:


    +   - Reduction in the number of objects to handle'
  merge: -1
