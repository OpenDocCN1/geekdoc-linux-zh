- img_proc: true
  md: '# 3. CONTACT PROMETRIC TO SCHEDULE YOUR EXAM


    The exam takes place at an authorized Prometric Testing Center. To register for
    a convenient date, time, and location, go to http://www.2test.com for information
    on your local Prometric office. In some countries, you may register for the exam
    online.


    # 4. TAKE YOUR EXAMINATION


    Before starting the exam, you must agree to maintain confidentiality and sign
    the Certification Candidate Pre-Test Agreement, which can be viewed at http://suned.sun.com/US/certification/register/policies.html.
    If you do not sign the agreement, you will not be allowed to take the exam.


    After completing your exam, you will receive your score and a section-by-section
    assessment of your test performance. Your exam results will be available at http://suned.sun.com/US/certification/my_certi-fication/index.html
    within five business days. If you do not pass the exam, you must wait two weeks
    before taking it again.


    # 5. REGISTER FOR THE ARCHITECTURE AND DESIGN PROJECT


    Once you''ve successfully completed the multiple-choice exam, you can purchase
    the architecture and design project from your local Educational Services office.
    Within 24 hours, you''ll be given permission to download the project. To find
    your local office, go to http://www.sun.com/service/suned and choose the country
    in which you want to register.


    # 6. DOWNLOAD AND SUBMIT THE ARCHITECTURE AND DESIGN PROJECT


    Go to My Certification database to download the architecture and design project
    at http://suned.sun.com/US/certification/my_certi-fication/index.html.


    Once you''ve completed the project, you can submit your project by uploading it
    to My Certification database.


    # 7. VERIFY THE EXAM NUMBER AND REGISTER FOR THE ESSAY EXAM


    After you''ve submitted the architecture and design project and you''re ready
    to register for the essay exam, you can purchase an exam voucher from your local
    Educational Services office. Go to http://www.sun.com/service/suned and choose
    the country in which you want to take the test.'
