    URLs will reflect the correct rewriting and jumping to one of them will lose the
    state. Another problem is that this technique is susceptible to security risks.
    Arguably, the risks with URL rewriting are greater than those of cookies, because
    the risks are systemic rather than implementational. Specifically, if a user jumps
    to a new site, the new site can read the URL of the referring page. Because this
    URL has been rewritten and includes the state of the connection, it becomes possible
    for the new server to “break into” the user’s connection with the original host.'
