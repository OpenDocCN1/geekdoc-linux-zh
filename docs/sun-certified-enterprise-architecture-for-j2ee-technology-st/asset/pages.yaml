  md: 'Because an applet can send information over the network to its originating
    host, an important goal of the security system is to prevent applets from accessing
    potentially sensitive information. For example, although an applet can read keystrokes
    that are sent to it, it should not be able to read keystrokes that are intended
    for other parts of the browser or other programs running on the host system. Although
    applets can make normal TCP/IP connections only with the host from which they
    were loaded, it is possible for them to send data to cooperating host on the Internet.
