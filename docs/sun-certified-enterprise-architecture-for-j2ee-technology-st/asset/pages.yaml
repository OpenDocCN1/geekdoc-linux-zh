  md: '# Discussion


    What is a model? A model is a simplification of reality. You build models using
    UML diagrams to better understand the system you are developing. The models you
    build will help you:


    +   - Visualize the system as it is or as you want it to be

    - Specify the structure or behavior of a system

    - Provide a template to guide the construction of the system

    - Document the decisions made about the system


    To start modeling with the UML, you need to learn the three major elements of
    the UML: building blocks, rules for combining blocks, and common mechanisms. Once
    you have mastered the three elements, you can read and create UML diagrams.


    # 3.1 The Building Blocks of UML


    There are three types of building blocks: elements, relationships, and diagrams.
    Elements are the abstractions that are first-class citizens in a model; relationships
    tie these elements together, and diagrams group collections of related elements
    by means of relationships.


    # Elements


    There are four kinds of elements in UML:


    +   - Structural – Used to create the static parts of a model by representing
    elements that are conceptual or physical

    - Behavioral – Allows you to model the behavior of the system.

    - Grouping – Allows you to organize the structural and behavioral elements in
    your model

    - Annotational – Explanatory parts of the model


    These elements are the basic elements used in creating models.


    # Structural Elements


    There are seven structural elements: class, interface, collaboration, use case,
    active class, component, and node.


    +   - A class is a set of objects that share the same attributes, operations,
    relationships and semantics. The class is represented by a rectangle with three
    areas. The first area contains the name of the class, the second area contains
    the attributes of the class and the third contains the operations of the class.
    Figure 3-1 illustrates a class.


    > Figure 3-1. A Class'
