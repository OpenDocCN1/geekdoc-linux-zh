    # 7.2 HTPS


    HTTPS is not a single protocol, rather it is the combination of HTTP over an SSL
    transport. The properties of both HTTP and SSL are embodied in HTTPS. By including
    SSL, you gain the following three benefits: encryption, identification of parties,
    and session state.


    SSL provides encryption using any number of protocols. When SSL establishes a
    connection, it first negotiates which protocol to use. The result should be the
    strongest encryption algorithm that both ends support. Of course, if one supports
    only a weak encryption algorithm, the resulting connection will be insecure. For
    systems where the strength of encryption is important, you should validate that
    the algorithm chosen is acceptable. You can do this either programmatically or
    by asking the user, but consider whether the users will be capable of making an
    informed determination.


    If a party involved in setting up an SSL connection has a certificate, then SSL
    can send this to the other party. This allows the other party to validate the
    identity of the first party. Validation is not 100 percent certain, although the
    mathematical process of the validation is close. The weaknesses arise mainly from
    human issues, such as a third party having copied the private key of the certificate''s
    legitimate owner. Such issues are discussed in Chapter 5, “Security.”


    SSL connections are state, and because of this, HTTPS can support sessions without
    the security risks of URL rewriting or cookies. However, because HTTPS arises
    directly from SSL, the connection setup is substantially slower. This is a direct
    result of the negotiation of protocols and cannot be avoided.


