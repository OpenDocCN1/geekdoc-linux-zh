  md: '+   - Reduction in memory and proxy on storage devices, if the objects are
    persisted


    # WHEN TO USE


    You should use the Flyweight pattern when all of the following are true:


    +   - The application uses a large number of objects.

    - Storage costs are high because of the quantity of objects.

    - The application does not depend on object identity.


    # Proxy Pattern


    The Proxy pattern provides a surrogate or placeholder object to control access
    to the original object. There are several types of implementations of the Proxy
    pattern with the Remote proxy and Virtual proxy being the most common. Figure
    4-12 illustrates the Proxy pattern.


    # Figure 4-12.The Proxy Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_69_0.png)


    # BENEFITS


    The following lists the benefits of using the Proxy pattern:


    +   - A remote proxy can hide the fact that an object resides in a different address
    space.

    - A virtual proxy can perform optimizations, such as creating an object on demand.


    # WHEN TO USE


    You should use the Proxy pattern when:


    +   - You need a more versatile or sophisticated reference to an object than a
    simple pointer.'
  merge: -1
