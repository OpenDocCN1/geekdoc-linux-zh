    objects, indexed for retrieval by a textual key. You can use instances of the
    Properties class for your own purposes in a program, or at startup, the Java virtual
    machine (JVM), initializes a single instance, known as the system properties.
    In the system properties you can locate a number of "well-known" values, such
    as one that indicates the host operating system. You can also have additional
    values set in this table from the command line. For example, if a program is invoked
    as follows:


    ```

    java -Dconfig.option=false MyApplication

    ```


    When MyApplication starts, it will find the value Boolean.FALSE stored alongside
    the key value config.option.


    The Properties class can also be read from a text file, and this makes the properties
    mechanism especially suitable for local configuration on individual machines.


    # The Locale Class


    A Locale is a representation of a set of cultural and language preferences. It
    is represented in two, or perhaps three, parts. The first part is the language
    code, and this is considered to be the most significant part. The second part
    is the country code. The country code adds a "fine tuning" to the localization
    provided by selection of the correct language. For example, British and American
    locales share the language code "en" for English; however, because there are a
    number of other variations, such as spellings, currency symbol, these variations
    are represented in a suffix to the main language code. The locale name for American
    is en_US, while the locale name for British is en_GB.


    In the Java APIs, Locale is a class. Objects of the class represent these regional
    variations, and are used to trigger the most appropriate behavior in a number
    of other classes. For example, the Calendar class uses Locale to describe the
    user''s preferences to define what default behavior is required when presenting
    dates.


