    # Discussion


    JEE is a platform for developing distributed enterprise software applications.
    JEE consists of the following (known as the JEE Framework):


    +   - J2EE Platform – A standard platform for hosting JEE applications.

    - Reference Implementation – An application server that supports the latest specification,
    except its focus is the most recent release of the specification and it is not
    production ready.

    - Compatibility Test Suite – A utility that verifies an application server is
    compatible with JEE. Without the Compatibility Test Suite, each vendor could interpret
    and implement the specification differently, reducing the benefit of the write
    once, near anywhere functionality in the JEE platform.

    - Application Programming Model (APM) Blueprint – A reference to teach individuals
    how to develop distributed applications using JEE. In the last year, the APM has
    lost some of its usefulness as more people become familiar with developing distributed
    applications and more books and training classes available.


    # 2.1 Implementing Applications Using J2EE


    The JEE Framework allows you to develop distributed applications by providing
    a set of basic services around transaction management, security checks, state
    management, and resource management. It is the application server that provides
    the actual implementation of the JEE Framework. Prior to the application server,
    each company and sometimes each system developed the basic distributed applications
    services of transactions, security and persistence.'
