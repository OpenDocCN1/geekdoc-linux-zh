  md: 'A GET request is the simplest form of an HTTP request. It carries a single
    URL into the server and the server should respond with the data for URL. The URL
    for a GET request is reflected in the location bar at the top of most browsers.
    If the request requires any parameters, for example to perform a search, then
    these parameters are encoded in the URL using a format that avoids use of spaces
    or any characters other than ASCII. You have probably noticed such encoding, it
    is often separated from the main body of the URL by a query symbol "? and the
    encoding simply uses the hexadecimal code for each special character by a percent
    % symbol. a URL that performs a search for the string "hello there" might look
    like the following:


    ```

    http://myserver.myco.com/searchtest_search?hello%20there

    ```


    This type of request can carry only a modest amount of information into a server
    request, otherwise the length of the URL becomes excessive. A significant number
    of attacks against Web servers have exploited buffer overflows over-long URLs.
    If you need to pass substantial amounts of data from the client to the server
    then you should probably use the POST request


    As with a GET request, the primary intent of a POST request is to obtain a Web
    page. However, a POST request differs from a GET request in that it is designed
    to transfer a significant amount of information from the client to the server
    when making the request. To accommodate this, a POST request sends the data from
    the client in multiple lines following the original request, rather than all the
    data embedded in the URL.


    A HEAD request is used to obtain limited amount of information about a Web page
    without loading the page itself. The intention of a HEAD request is to determine
    if a cached page can be refreshed. To this, the HEAD request returns the date
    and time associated with the Web page and this can be compared with the date and
    time associated with the cache.


    By default, Web servers, and therefore HTTP requests use port 80. However, the
    port mechanism does not influence or control the data that can be passed over
    the port, so you can use any other port that might suit your needs. For example,
    you might need to run a Web server on a port other than 80 if you are running
    a second server on the same machine. Each port can be used by one process, so
    the two servers must have different ports. Ports with numbers up to 1024 are considered
    privileged in UNIX systems and cannot be opened by processes unless those processes
