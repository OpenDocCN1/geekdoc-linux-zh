    to a file. This proxy runs as an unprivileged user in a sandbox (for example,
    chorizo, that is locked to a subtree of the file system in UNIX environment),
    so that its access to resources is as limited as possible if it is compromised.
    A second program runs from time to time, looking for the data files created by
    the first program. When such a file is found, contents are read and if the messages
    seem to be valid, they are forwarded to the real mail server over the internal
    network.


    Using this approach, each piece of code is very simple, thereby limiting the chance
    of security vulnerability. Each program has limited capabilities, so even if it
    is compromised, the benefit to an attacker is minimal.


    A proxy can also perform content-specific filtering. For example, the e-mail proxy
    might refuse to forward any of an e-mail that is not plain text, or it might include
    a virus scanning capability that would recognize the bite patterns of known viruses
    and refuse to forward the attachment containing the suspect data. Always remember
    that each complexity increases the chance of a bug, but done carefully, filtering
    based on contents can be a powerful and effective tool.


    In addition to restricting the messages that enter your network, you should minimize
    the amount of software that is installed on any system that is accessible in any
    way from the Internet. Even if software is not running, it might be used by an
    attacker as a stepping stone to a goal.


    # 5.7 Topologies for Securing Networks


    The way that a network is laid out can greatly influence the vulnerability of
    that network. For a firewall to be effective, you must ensure that an attacker
    cannot simply "walk around" the barrier presented by the firewall. In other words,
    the firewall must be the only entry point to your network. Many breaches in corporate
    networks occur because someone connects a laptop that has been infected with a
    virus while connected to a home Internet connection. Allowing systems on the intranet
    to make modern connections has similar potential for disaster.'
