    # Essential Points


    The following summarizes the most important points described in this chapter.


    +   * HTTP can run on any port as needed, although port 80 is the default.

    * HTTP GET requests carry a limited amount of data from client to server, POST
    requests can carry unlimited amounts.

    * HTTP is a stateless protocol. State can be added by using cookies, URL rewriting,
    or using SSL as a transport (which produces HTTPS).

    * HTTP on port 80 is usually allowed out of firewalls, so HTTP is a common choice
    for tunnelling.

    * HTTPS is HTTP over SSL

    * SSL gives encryption, validation of parties, and an identifiable session for
    maintaining state.

    * Encryption and validation in SSL depend on configuration and capabilities of
    both ends, and might be negotiated to not.

    * SSL, and therefore HTTPS, has a startup overhead.

    * IIOP is the method-invocation protocol for CORBA.

    * IIOP moves state for arguments and return values of method calls.

    * CORBA defines a variety of standard services that, if installed, will be available
    to IIOP.

    * CORBA services include security, transactions, and naming.

    * CORBA, and therefore, IIOP, is available for a variety of languages and platforms.

    * IIOP is supported by Java IDL and RMI/IIOP.

    * IIOP supports tunneling over HTTP/port 80.

    * JRMP is the method-invocation protocol for RMI.

    * JRMP moves state and behavior (whole objects) for arguments, return values,
    and exceptions in method calls.'
