  md: '# Objective: Select a common firewall feature that might interfere with the
    normal operation of a given protocol


    6. Rank the protocols in order of likelihood that the protocol will pass out of
    a customer''s firewall, and state your reasons for your choice.


    +   A. HTTP

    B. HTTPS

    C. JRMP

    D. IIOP


    A: The correct answers are A, B, D, and C.


    Don''t panic, you will not get a question like this on the exam. You''re right,
    this is not something for which an absolutely right answer is possible. However,
    this question is here to make you think, and what matters is that you understand
    the following discussion.


    Many firewall administrators restrict outgoing connections. The usual argument
    for this is to limit the opportunity for company data to be sent out, either by
    malicious attackers who have broken in, or by disaffected employees. There are
    two ways a firewall normally limits such traffic. There are port restrictions
    and service proxies.


    When setting restrictions, most administrators use the rule "which is not explicitly
    permitted is denied." This is a sound and long standing security mantra that means,
    more or less, turn all traffic off, then turn back on only those elements that
    a) you think are safe, and b) have determined are required. Unfortunately, tunneling
    makes the whole notion pointless, because any data can be sent out over port 80
    in the form of an HTTP request. Nevertheless, this is the approach usually taken,
    and it is better than nothing.


    The upshot is that many firewalls restricting outgoing connections to a few known
    services. HTTP is usually one of them, making A the first correct choice. HTTPS
    is usually thought of as being used by legitimate e-business, and is quite often
    allowed. Of course, if you are tunnelling for the deliberate purpose of stealing
    company data, then HTTPS is a better choice than HTTP, because you can encrypt
    the content of the messages, and ensure that no one can see that the message contains
    confidential domains. In practice, however, HTTPS is the next most likely to be
    allowed.


    Choosing JRMP and IIOP for the third and fourth options is harder. A firewall
    administrator is unlikely to allow connections to the ports of either protocol
    if the firewall is restricting outgoing connections at all, but since IIOP has
    been around longer, and is therefore slightly better known, it is the third choice.
    If you chose JRMP third, or perhaps scored a draw between IIOP and JRMP, that''s
    fine'
