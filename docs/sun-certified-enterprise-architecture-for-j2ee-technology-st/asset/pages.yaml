  md: '# Chapter 7. Protocols


    # 7.1 HTTP


    # 7.2 HTTPS


    # 7.3 IIOP


    # 7.4 JRMP


    The exam objectives specifically list HTTP, HTTPS, IIOP, and JRMP. These protocols
    serve two distinct purposes; HTTP and HTTPS are primarily intended for Web page
    transport, IIOP and JRMP are transports for CORBA and RMI respectively. However,
    HTTP and HTTPS are sometimes used for other purposes, and IIOP can be used as
    an alternative transport for RMI. In fact, IIOP is the preferred transport for
    RMI in an EJB system.


    After completing this list, you will be able to meet the following J2EE technology
    architect objectives:


    +   - Given a list of its features, identify a protocol that is one of the following:
    HTTP, HTTPS, IIOP, or JRMP.

    - Given a scenario description, distinguish appropriate from inappropriate protocols
    to implement that scenario.

    - Select a common firewall that might interfere with the normal operation of a
    given protocol.


    # Prerequisite Review


    This chapter assumes you are familiar with the purpose and typical uses of HTTP
    and HTTPS. It also assumes that you understand some aspects of the nature of a
    firewall, in particular packet-filtering routing and proxy servers. For more information
    about firewalls, see Chapter 5, “Security.”


    You can see that these objectives do not require any significant knowledge of
    APIs, nor of programming details, rather they focus on the appropriate use of,
    and issues arising from the use of, these protocols.


    # 7.1 HTTP


    HTTP is primarily intended for loading Web pages over the Internet. It provides
    a number of request formats for the client. The main request formats are GET,
    POST, and HEAD. The GET, POST, and HEAD formats are not acronyms, rather they
    are the actual request strings used by the client.'
