  md: '# Chapter 3. Documenting an Architecture


    # 3.1 The Building Blocks of UML


    # 3.2 Common Mechanisms in UML


    The current industry standard for visual modeling is the Unified Modeling Language
    (UML). This chapter starts with an overview of the building blocks of UML, continues
    with a description of the common mechanisms in UML and then finishes with examples
    of the different types of UML diagrams along with an explanation of how to interpret
    these diagrams. By the end of this chapter you will know how to draw and interpret
    UML diagrams.


    After completing this chapter, you will be able to meet the following J2EE Architect
    objectives:


    +   - Explain how to draw UML diagrams to define the system architecture.

    - Explain how to interpret UML diagrams.


    # Introduction


    As you create an architecture, you must communicate this system architecture to
    the designers and developers who will build the system. The best way to describe
    an architecture is to use visual models and narratives. The visual models are
    contained in two different documents. The first is the System Requirements document,
    which contains all of the requirements of the system. The requirements are depicted
    in a use-case diagram, object diagram, sequence or collaboration diagrams, and
    activity diagrams. In addition, the use cases are also described in narrative
    format. The second document is the System Architecture document, which contains
    the models of the system architecture. You use the class diagram, package diagram,
    component diagram, deployment diagram and the statechart diagram to visually communicate
    your architecture. In addition to the visual models in the System Architecture
    document, you should supply narratives that justify your choices and provide additional
    description for better understanding.


    # Prerequisite Review


    Using models to define the system architecture is not sufficient. You must support
    the models with narratives and identify and document your requirements using use
    cases. This chapter does not cover how to write technically or write use cases
    to document your requirements and architecture.'
  merge: -1
  pgno: 35
