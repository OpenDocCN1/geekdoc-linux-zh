  md: 'Protecting an individual computer is usually addressed by the following familiar
    steps:


    +   1. Determine who wants to do something (for example using a login name)


    +   2. Determine if the person is who they claim to be (for example using a password)


    +   3. Determine if the person should be doing this (for example using a permission
    list)


    Where the network is concerned, you must address another problem. Requests that
    are made over the network are usually subjected to a similar type of validation
    as just discussed, but in addition, you must assume that messages sent over the
    wire are visible to people other than just the person making the request. This
    often requires an additional level of security to disguise these messages so that
    they are not useful to, and cannot be forged by, snoopers.


    Before this discussion proceeds, you must ensure that you are familiar with the
    terminology that is defined in the following paragraphs.


    Consider first the discussion about protecting a computer—the "someone wants to
    do X, we do them" discussion. In general, it might not be an individual human
    to a particular privilege is or not. It might be a job function (for example,
    system administrator or HR director), or it might be another computer or process.
