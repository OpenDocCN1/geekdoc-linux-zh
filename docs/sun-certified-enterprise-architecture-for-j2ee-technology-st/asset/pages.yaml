    ![](img/5715971f4d127ce26084f269dd89411b_72_0.png)


    # BENEFITS


    The following lists the benefits of using the Interpreter pattern:


    +   - Easy to change and extend the grammar

    - Implementing the grammar is easy


    # WHEN TO USE


    You should use the Interpreter pattern when:


    +   - The grammar of the language is simple.

    - Efficiency is not a critical concern.


    # Iterator Pattern


    The Iterator pattern provides a consistent way to sequentially access items in
    a collection that is independent of separate from the underlying collection. Figure
    4-16 illustrates the Iterator pattern.


