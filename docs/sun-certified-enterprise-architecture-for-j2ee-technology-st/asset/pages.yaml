  md: 'If you have to look at every packet that passes in or out of your network then
    you are not going to stand much chance of detecting unusual activity. Therefore,
    an important key to effective monitoring is to automate the bulk of the work.
    If the system can notify you when something suspicious occurs, you have a much
    better chance of monitoring effectively.


    There are a number of tools available for monitoring, often built into or supplied
    afield. You should investigate these and compare their capabilities with the types
    of activities that your network must allow. In addition, you might be able to
    monitor the behavior of your applications. A crude but workable example for monitoring
    UNIX programs would be to run the program under the truss command. You use the
    truss command to list all kernel calls that a program makes, along with the arguments
    to call. If you search that list (using the grep command) for kernel calls that
    should not be made, you will spot it at some types of attack.


    Perhaps the biggest problem with monitoring is the "false-positive" problem. If
    a network monitoring system complains that something strange is happening too
    often, and most of the time it proves to be false, then there is a strong tendency
    to start to ignore its warnings. This is exactly parallel to the "boy who cried
    wolf"


    # 5.9 Tunneling


    Tunneling is a way of creating a covert channel, that is, a communication path
    for messages of one type that uses a path actually intended for some other type
    of message. Tunnel can be used to sneak past firewall restrictions either to get
    into a network or out of a network. Using tunneling to get out of a network might
    be a reasonable way to behave, but using it to get into a network usually suggests
    that someone doesn''t understand his/her job. The rest of this section discusses
    these two options to give you an understanding of the benefits and costs of setting
    up tunneling, and enable you to make a decision about it when to use it.


    # Tunneling into a Network


    Once a firewall and DMZ have been set up, it becomes harder to add new Internet-accessible
    services to the internal networks. This, in the first instance is simply because
    these services are invisible to the Internet as a consequence of the proper operation
    of the firewall.


    To add a new service to your DMZ, access must be granted through the firewall.
    This might involve opening a new route through the packet-filtering router element
    of the firewall, and perhaps adding a new proxy program to the firewall. Unfortunately,
    there is a tendency for firewall administrators, or the policies created by higher
    management under which a firewall is operated, to refuse outright any request
