  md: '# Chapter 4. Design Patterns


    4.1 Creational Patterns


    4.2 Structural Patterns


    4.3 Behavioral Patterns


    Patterns were first used by a building architect named Christopher Alexander in
    the 1970s. He realized that there were certain solutions that you could apply
    over and over again to the same or similar problems. He also combined these existing
    solutions to create new solutions to a new problem. In 1987, Ward Cunningham and
    Kent Beck developed five patterns to use in interface design. But it wasn''t until
    1994 that Erich Gamma, Richard Helm, John Vlissides and Ralph Johnson published
    the famous book Design Patterns: Elements of Reusable Object-Oriented Software,
    which described a way of documenting patterns that has become the industry standard.
    These men are often referred to as the Gang of Four (GoF). As new patterns are
    developed, most follow the documentation standards described by the Design Patterns
    book.


    This chapter describes how you can use patterns to help you create an architecture.
    These patterns are usually at the object and class level, but they can also be
    abstracted to a higher level.


    After completing this chapter, you will be able to meet the following J2EE technology
    exam objectives:


    +   - From a list, select the most appropriate design pattern for a given scenario.
    Patterns will be limited to those documented in Gamma et al and named using the
    names given in that book.

    - State the benefits of using design patterns.

    - State the name of a Gamma et al. design pattern given the UML diagram and/or
    a brief description of the pattern''s functionality.

    - From a list, select the benefits of a specified Gamma et al. design pattern.

    - Identify the Gamma et al. design pattern associated with a specified J2EE feature.


    # Prerequisite Review


    This chapter assumes that you are already familiar with the Gang of Four (GoF)
    patterns, as described in “Design Patterns: Elements of Reusable Object-Oriented
    Software.” This chapter reviews the patterns in the context of the exam objectives
    to cover the material necessary for the exam.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Discussion


    A design pattern is a common solution to a common problem encountered in software
    development. In this chapter, we have described the patterns in terms of the following:


    +   - Name – A label used to identify the problem, solution, and consequences
    of a pattern. The pattern name should be descriptive and kept to one or two words.

    - Description – A short description of the pattern, a UML diagram, and code sample
    are all used to define the pattern.

    - Benefits – Describes the advantages using the specified pattern.

    - When to Use – Describes when in the application design you should use the pattern.


    There are three types of the GoF patterns:


    +   - Creational

    - Structural

    - Behavioral


    # 4.1 Creational Patterns


    Creational patterns support the creation of objects in a system. Creational patterns
    allow objects to be created in a system without having to identify a specific
    class type in the code, you do not have to write large, complex code to instantiate
    an object. It does this by having the subclass of the class create the object.
    However, this can limit the type or number of objects that can be created within
    a system.


    The following Creational patterns are described:


    +   - Abstract Factory

    - Builder

    - Factory Method

    - Prototype

    - Singleton


    # Abstract Factory Pattern


    This pattern provides an interface for creating families of related or dependent
    objects without specifying their concrete classes.


    Given a set of related abstract classes, the Abstract Factory pattern provides
    a way to create instances of those abstract classes from a matched set of concrete
    subclasses. Figure 4-1 illustrates the Abstract Factory pattern.


    Figure 4-1. The Abstract Factory Pattern'
  merge: -1
  pgno: 57
- img_proc: true
  md: '![](img/5715971f4d127ce26084f269dd89411b_58_0.png)


    The Abstract Factory pattern provides an abstract class that determines the appropriate
    concrete class to instantiate to create a set of concrete products that implement
    a standard interface. The client interacts only with the product interfaces and
    the Abstract Factory class. The client never knows about the concrete construction
    classes, provided by this pattern.


    The Abstract Factory pattern is similar to the Factory Method pattern, except
    it creates families of related objects.


    # BENEFITS


    The following lists the the benefits of using the Abstract Factory pattern:


    +   - Isolates concrete classes.

    - Makes exchanging product families easy.

    - Promotes consistency among products.


    # WHEN TO USE


    You should use the Abstract Factory pattern when:


    +   - The system should be independent of how its products are created, composed,
    and represented.

    - The system should be configured with one of multiple families of products, for
    example, Microsoft Windows or Apple Macintosh classes.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '+   - The family of related product objects is designed to be used together,
    and you must enforce this constraint. This is the key point of the pattern, otherwise
    you could use a Factory Method.

    - You want to provide a class library of products, and reveal only their interfaces,
    not their implementations.


    # # Builder Pattern


    The Builder pattern separates the construction of a complex object from its representation
    the same process can create different objects. The Builder pattern allows a client
    object to construct a complex object by specifying only its type and content.
    The client is shielded from the details of the object''s construction. This simplifies
    the creation of complex objects by defining a class that builds instances of another
    class. The Builder pattern produces one main product and there might be more than
    one class in the product, but there is always one main class. Figure 4-2 illustrates
    the Builder pattern.


    # Figure 4-2. The Builder Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_59_0.png)


    When you use the Builder pattern, you create the complex objects one step at a
    time. Other patterns build the object in a single step.


    # # BENEFITS


    The following lists the benefits of using the Builder pattern:


    +   - Lets vary a product''s internal representation.

    - Isolates code for construction and representation.

    - Gives you greater control over the construction process.


    # # WHEN TO USE


    You should use the Builder pattern when:'
  merge: -1
  pgno: 59
- img_proc: true
  md: '+   - The algorithm for creating a complex object should be independent of
    both the parts that make up the object and how these parts are assembled.

    - The construction process must allow different representations of the constructed
    object.


    # Factory Method Pattern


    The Factory Method pattern defines an interface for creating an object, but lets
    the subclasses decide which class to instantiate. The Factory method lets a class
    defer instantiation to subclasses, which is useful for constructing individual
    objects for a specific purpose without knowing the specific class being instantiated.
    This allows you to introduce new classes without modifying the code as the new
    class implements only the interface so it can be used by the client. You create
    a new factory class to create the new class and the factory class implements the
    factory interface. Figure 4-3 illustrates the Factory Method pattern.


    # Figure 4-3. The Factory Method Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_60_0.png)


    # BENEFITS


    The following lists the benefits of using the Factory Method pattern:


    +   - Eliminates the need to bind application classes into your code. The code
    deals only with the interface, so you can work with any classes that implement
    that interface.

    - Enables the subclasses to provide an extended version of an object, because
    creating an object inside a class is more flexible than creating the object directly
    in the client.


    # WHEN TO USE


    You should use the Factory Method pattern when:


    +   - A class cannot anticipate the class of objects it must create.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '+   * A class wants its subclasses to specify the objects it creates.

    * delegate responsibility to one of several helper subclasses, and you want to
    localize the knowledge of which helper subclass is the delegate.


    # # Prototype Pattern


    The Prototype pattern allows an object to create customized objects without knowing
    their exact class or the details of how to create them. It specifies the kinds
    of objects to create using a prototypical instance, and creates new objects by
    copying this prototype. The Prototype pattern works by initiating prototypical
    objects to an object and initiates the creation of objects. The creation-initiating
    object then creates objects by asking the prototypical objects to make copies
    of themselves. The Prototype pattern makes creating objects dynamically by defining
    classes whose objects can duplicate themselves. Figure 4-4 illustrates the Prototype
    pattern.


    # ## 4-4. The Prototype Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_61_0.png)


    # ## BENEFITS


    The following lists the benefits of using the Prototype pattern:


    +   * Adding and removing products at run time

    * Specifying new objects by varying values

    * Specifying new objects by varying structure

    * Reduced subclassing

    * Configuring an application with classes dynamically


    # ## WHEN TO USE


    You should use the Prototype pattern when:


    +   * The classes to instantiate are specified at run time, for example, by dynamic
    loading.

    * To avoid building a class hierarchy of factories that parallels the class hierarchy
    of products.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '+   * When instances of a class can have one of only a few different combinations
    of state.


    # Singleton Pattern


    The Singleton pattern ensures that a class has only one instance, and provides
    a global point of access to that class. It ensures that all objects that use an
    instance of this class use the same instance. Figure 4-5 illustrates the Singleton
    pattern.


    # Figure 4-5. The Singleton Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_62_0.png)


    # BENEFITS


    The following lists the benefits of using the Singleton pattern:


    +   * Controlled access to sole instance

    * Reduced name space

    * Permits refinement of operations and representation

    * Permits a variable number of instances

    * More flexible than class operations


    # WHEN TO USE


    You should use the Singleton pattern when:


    +   * There must be exactly one instance of a class.


    # 4.2 Structural Patterns


    Structural patterns control the relationships between large portions of your applications.
    Structural patterns affect applications in a variety of ways, for example, the
    Adapter pattern enables two incompatible systems to communicate, while the Facade
    pattern enables you to present a simplified inter-face to a user without removing
    all options in the system.


    Structural patterns allow you to create systems without rewriting or customizing
    the code. This provides the system with enhanced reusability and robust functionality.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'The following Structural patterns are described:


    +   * Adapter

    * Bridge

    * Composite

    * Decorator

    * Façade

    * Flyweight

    * Proxy


    # Adapter Pattern


    The Adapter pattern acts as an intermediary between two classes, converting the
    interface of one class so it can be used with the other. This enables classes
    with incompatible interfaces to work together. The Adapter pattern implements
    an interface known to its clients and provides access to an instance of a class
    not known to its clients. An adapter object provides the functionality of an interface
    without having to know the class used to implement that interface. Figure 4-6
    illustrates the Adapter pattern.


    Figure 4-6. The Adapter Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_63_0.png)


    # BENEFITS


    The following lists lists the benefits of using the Adapter pattern:


    +   * Allows two or more incompatible objects to communicate and interact

    * Improves reusability of older functionality


    # WHEN TO USE


    You should use the Adapter pattern when:'
  merge: -1
  pgno: 63
- img_proc: true
  md: '+   • You want to use an existing class, and its interface does not match the
    interface you need.

    • You want to create a reusable class that cooperates with unrelated or unforeseen
    classes, that is, classes that don''t necessarily have compatible interfaces.

    • You want to use an object in an environment that expects an interface that is
    different from the object''s interface.

    • Interface translation among multiple sources must occur.


    # Bridge Pattern


    The Bridge pattern divides a complex component into two or separate related inheritance
    hierarchies: the functional abstraction and the internal implementation. This
    makes it easier to change either aspect of the component so that the two can vary
    independently.


    The Bridge pattern is useful when there is a hierarchy of abstractions and a corresponding
    hierarchy of implementations. Rather than combining the abstractions into many
    distinct classes, the Bridge pattern implements the abstractions as independent
    classes that can be combined dynamically. Figure 4-7 illustrates the Bridge pattern.


    # Figure 4-7. The Bridge Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_64_0.png)


    # BENEFITS


    The following lists lists the benefits of using the Bridge pattern:


    +   • Enables you to separate the interface from the implementation

    • Improves extensibility

    • Hides implementation details from clients


    # WHEN TO USE


    You should use the Bridge pattern when:'
  merge: -1
  pgno: 64
- img_proc: true
  md: '+   • You want to avoid a permanent binding between an abstraction and its
    implementation.

    • Both the abstractions and their implementations should be extensible using subclasses.

    • Changes in the implementation of an abstraction should have no impact on clients;
    that is, you should not have to recompile their code.


    #  Composite Pattern


    The Composite pattern enables you to create hierarchical tree structures of varying
    complexity, while allowing every element in the structure to operate with a uniform
    interface. The Composite pattern combines objects into tree structures to represent
    the whole hierarchy or a part of the hierarchy. This Composite pattern allows
    clients to treat individual objects and compositions of objects uniformly. Figure
    4-8


    Figure 4-8. The Composite Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_65_0.png)


    # BENEFITS


    The following lists the benefits of using the Composite pattern:


    +   • Defines class hierarchies consisting of primitive objects and composite
    objects

    • Makes it easier to add new kinds of components

    • Provides flexibility of structure and a manageable interface


    # WHEN TO USE'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'You should use the Composite pattern when:


    +   * You want to represent the whole hierarchy or a part of the hierarchy of
    objects.

    * You want clients to be able to ignore the difference between compositions of
    objects and individual objects.

    * The structure can have any level of complexity, and is dynamic.


    # Decorator Pattern


    The Decorator pattern enables you to add or remove object functionality without
    changing the external appearance or function of the object. It changes the functionality
    of an object in a way that is transparent to its clients by using an instance
    of a subclass of the original class that delegates operations to the original
    object. The Decorator attaches additional responsibilities to an object dynamically
    to provide a flexible alternative to changing object functionality without static
    inheritance. Figure 4-9 illustrates the Decorator pattern.


    # Figure 4-9. The Decorator Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_66_0.png)


    # BENEFITS


    The following lists the benefits of using the Decorator pattern:


    +   * More flexibility than static inheritance

    * Avoids feature-laden classes high up in the hierarchy

    * Simplifies coding because you write a series of classes, each targeted at a
    specific part of the functionality, rather than coding all behavior into the object'
  merge: -1
