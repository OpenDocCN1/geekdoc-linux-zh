    simplicity of RMI while using IIOP as the underlying transport, and therefore
    allowing access to any available CORBA services. Running RMI over IIOP also admits
    the possibility of using both IIOP and JRMP, the native RMI protocols, concurrently
    on the same network.


    Sometimes you might need to run a thin-client program on a system that is not
    in your own network, for example running an app on a customer''s system. In this
    situation, it is likely that the alien network has a firewall that does not allow
    outbound traffic. Such firewall is typically bypassed by tunneling the required
    messages over another port or protocol that is permitted. Usually, this is port
    80 and the protocol is HTTP. IIOP is aware of these issues, and can tunnel through
    80/HTTP.


    # 7.4 JRMP


    JRMP is the native transport protocol of RMI. Similar to IIOP, it can invoke methods,
    and pass arguments, return values, and exceptions over the network. RMI does not
    typically (at this time) come with a body of services, though there is a naming
    service included with it. The most significant difference from IIOP however, is
    that JRMP does not restrict argument and return types to data values, JRMP handles
    objects. Objects have state and behavior, which means that JRMP provides a mechanism
    to transfer the class file of an object into the recipient of an argument or returned
    value (an exception for that matter). This copying of class file is done on as-needed
    basis to avoid bandwidth. Where you copy classes, you must complete additional
    administrative setup. Because these tasks are not done, or done incorrectly, you
    sometimes find RMI/JRMP systems that exhibit the limited behavior of CORBA, that
    is, do not move over the network, but only move state. This is not always a problem,
    provided the system is designed that way, indeed, it can result in slightly higher
    performance and slightly lower network bandwidth usage.


    Because JRMP is the native protocol for RMI and does not have to support a myriad
    of different host formats and byte ordering, there is less overhead in setting
    up the argument and return values for a call over JRMP than with language neutral
    systems, such as IIOP. Used correctly, this can result in higher performance.


    JRMP does not include encryption or identification of parties by default. However,
    it is easy to set JRMP to use SSL as a transport. This is achieved by using "socket
    factories." Further information on the mechanics of this is in the API documentation.
    Additionally, Java Authentication and Authorization Service (JAAS) is a framework
    for distributed'
