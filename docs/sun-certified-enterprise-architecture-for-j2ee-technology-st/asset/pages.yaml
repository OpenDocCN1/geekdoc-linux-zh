  md: '+   - Enhances the object''s extensibility because you make changes by coding
    new

    classes


    # WHEN TO USE


    You should use the Decorator pattern when:


    +   - You want to add responsibilities to individual objects dynamically and

    transparently, that is, without affecting other objects.

    - You want to add responsibilities to the object that you might want to change
    in

    tuture.

    - When extension by subclassing is impractical.


    # Façade Pattern


    The Facade pattern provides a unified interface to a group of interfaces in a
    subsystem.

    The Facade pattern defines a higher-level interface that makes the subsystem easier
    to use

    because you have only one interface. This unified interface enables an object
    to access

    the subsystem using only the interface to communicate with the subsystem. Figure
    4-10

    illustrates the Facade pattern.


    > Figure 4-10. The Faade Pattern


    ![](img/5715971f4d127ce26084f269dd89411b_67_0.png)


    # BENEFITS


    The following lists the benefits of using the Faade pattern:


    +   - Provides a simple interface to a complex system without reducing the options

    provided by the system.

    - Shields clients from subsystem components.'
  merge: -1
  pgno: 67
