  \n## 无线组织\n\n有很多无线组织，但其中两个是：Wi-Fi Alliance 和 IEEE。\n\n### IEEE（电气电子工程师学会）\n\n在书中，我们提到了无线标准，如\
  \ 802.11、802.11a、802.11b、802.11g 和 802.11i。这些标准由 `IEEE` ([www.ieee.org](http://www.ieee.org))\
  \ 执行。电气电子工程师学会 (`IEEE`）已运行数十年，以开发无线局域网（LAN）、无线城域网（MAN）和无线个人区域网（PAN）的开放无线标准而闻名。你可以将\
  \ `802.11` 标准（空中传输）与 802.3 以太网标准（线缆传输）区分来。你可以通过访问之前的章节或咨询互联网博客和论坛了解更多关于 `IEEE` 标准的信息。\n\
  \nWi-Fi Alliance\n\n\n\n\n\n该组织曾名为 WECA，成立于 1999 年。Wi-Fi 联盟（[www.wifialliance.com](http://www.wifialliance.com)）最初是一个非营利组织，根据\
  \ IEEE 802.11 规范认证所有无线局域网产品的互操作性。这家公司现在非常大，在全球拥有 200 多家子公司。此外，它拥有超过 1000 台认证的设备。\n\
