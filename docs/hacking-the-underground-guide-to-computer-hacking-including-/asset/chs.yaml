- "# Hacking：计算机黑客地下指南，涵盖无线网络、安全、Windows、Kali Linux 与渗透测试\n\n\n\n![](img/Image0000.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n# 作者记\n\n首先，感谢你购买此本书。\n\n希望你喜欢这本书，并能够学习更多关于黑客的知识。\n\n书末有一个术语表，如果你对任何单词或技术术语不清楚，可以参考它。此外，附录中提到了许多链接和程序，你可以利用它们。\n\
  \n最后，在你读完这本书后，能否请你好心地在 Amazon 上留一个好评？我将不胜感激！\n\n免责声明：本书中提供的关于黑客攻击的信息仅供教育和研究之用。作者对书中书中提供信息的任何误用行为不承担任何责任。\n\
  \n# 第一章：黑客攻击简介\n\n在当今的许多国家，黑客攻击被认为是最严重的威胁之一。曾几何，黑客攻击就像和朋友玩耍或在计算机上进行无害的恶作，但现在已不再如此。它现在被视为一种犯罪。情报机构和一些国家的安全部门将黑客攻击视为恐怖主义的形式，政府也对此表示谴责。\n\
  \n用通俗的话说，黑客攻击进入你没有访问权限的计算机，并通过绕过安全措施窃取隐私信息的行为。它是危险的，因为它破坏了整个计算机系统。\n\n“hacking”（黑客攻击）一词的起源可以追溯到\
  \ 20 世纪 60 年代和 70 年代。一些被称为 `Yippe` 的黑客是反战抗议者和国际青年党的成员。他们在街上恶作剧，他们的大多数恶作剧技术都是在小组内部传授的。需要注意的是，他们还参与了监听电话线路。\n\
  \n逐渐地，这种被称为恶作剧的行为达到了另一个水平，并被称为 hacking。然而，这一次他们使用的工具是尖端的巨型核心处理器和多功能等离子屏。\n\n黑客战术正越来越多地被恐怖组织用于许多恶行，包括获取非法资金、传播宣传活动、发射导弹、威胁政府以及收集有关秘密军事行动的情报。\n\
  \n在书中，将对各种类型的黑客攻击进行分解和解释。我们将提供逐步步骤的指导说明，以便你保护自己免受办公室、家里以及互联网上黑客的攻击。\n\n## 黑客 – 概述\n\
  \n本章将为你提供黑客攻击背后的概念和基础知识。谁是黑客？他们在做什么？我们还将讨论不同类型的黑客及其分类。\n\n在最基本的定义中，黑客攻击可以描述为利用计算机系统及其网络弱点和缺陷的行为。在对这些弱点的利用中，非法行为可能包括窃取隐私信息、访问并更改网络配置、破坏计算机操作系统的结构视图等等。\n\
  \n黑客攻击在几乎所有国家都存在。然而，它在发达国家占据主导地位。过去二十年信息技术的进步表明，大多数黑客位于南亚和东南亚等发展中国家。\n\n“hacker”（黑客）一词在今天是许多争议的来源，并让许多人感到困惑。有些人将“黑客”视为那些有能力随心所欲让计算机执行任何事情的人。在另一种语境下，黑客被视为计算机安全专家，其首要工作是发现计算机系统或网络的漏洞并修复它们。这些漏洞发现者有时被称为\
  \ `crackers`。黑客世界中的所有这些歧义使得识别谁是黑客变得困难，这一事实也使得检测可能正在玩弄你系统的黑客活动变得极其困难。\n\n黑客攻击的背后有许多原因。有些人热衷黑客仅仅是为了赚钱。他们可以偷取你的密码，入侵你的隐私信息，甚至篡改你的正确信息使其错误，这一切都是为了金钱利益。其他黑客加入游戏仅仅是为了挑战或竞争。此外，一些黑客是计算机世界的社会流氓，其目的是获取网络或系统的访问权限。在获得访问后，这些黑客将使网络失效，导致用户无法正常使用它。\n\
  \n例如，如果一个社区正在对某事进行抗议，它可以尝试入侵系统作为对当局抗议的信号。它可以选择这样做，而不是违反它认为重要的其他法律。\n\n## 黑客分类\n\n\
  有不同类型的黑客，他们有不同的意图。根据他们的操作模式，我们可以将黑客分为以下几类：\n\n1. 白帽黑客\n\n这些人是好人，因为他们没有恶意。也许他们被命名为“白帽”黑客是因为白色象征着纯洁和洁净。他们入侵系统是为了消除其漏洞，或者作为为关注计算机安全的公司或学校进行研究的手段。他们也被称为伦理黑客。他们执行渗透测试并评估计算机系统的漏洞。\n\
  \n2. 黑帽黑客\n\n\n\n\n\n这些黑客是“邪恶”黑客。他们的意图和方法违背了对“善良”的所有定义。黑帽黑客出于恶意意图进行攻击，旨在打破书中所有的规则。他们黑客是为了个人利益以及金钱。众所周知，他们来自非法社区，完全符合计算机犯罪分子的刻板印象。黑帽黑客利用网络弱点使系统失效。如果有机会，这些黑客还会销毁你的数据和信息。当这些黑客进入你的系统时，他们会威胁要将你的私人信息公开给公众，目的是让你去做他们想要的任何事情。不用说，黑帽黑客不会修复你计算机系统或网络的漏洞，而是会利用这些漏洞来对你。\n\
  \n### 3. 灰帽客 (GREY HAT HACKERS)\n\n灰帽客的意图与上述的黑客无法相比。这些黑客会在互联网上寻找计算机系统或网络的弱点并入侵。他们这样做可能是为了向网络管理员展示漏洞，并就特定价格建议修复这些漏洞的方法。\n\
  \n### 4. 蓝帽客 (BLUE HAT HACKERS)\n\n据说蓝色代表法律执法部门的成员，尽管这仅仅是一种惯例。这些黑客是将其黑客技能作为服务的自由职业者。计算机安全公司聘请黑客专家测试他们的网络，以便在发布给公众之前检查其弱点、漏洞和缺口。蓝帽客是“好人”，与灰帽客不同，后者的意图可能不可预测。\n\
  \n### 5. 精英黑客 (ELITE HACKERS)\n\n这些是社区中的专家级黑客。在大多数情况下，他们可以突破不可攻的防御，并编写复杂的黑客程序。精英黑客的一个例子是\
  \ `Gary McKinnon`。在时期，McKinnon 入侵了 `NASA` 的频道，安装了病毒并删除了文件。精英身份主要由该人员所属的黑客社区或团体授予。\n\
  \n### 6. 脚本小子 (SKIDDIE)\n\n这些黑客并非完全的新手。`Skiddie` 一词代表 `Script Kiddie`。他们通过使用由其他专家黑客创建的工具来入侵计算机系统或网络。在大多数情况下，他们对程序的背景和创建了解之甚少。他们只是为了使用这些程序。\n\
  \n### 7. 新手 (NEWBIE)\n\n根据百科全书，`newbie` 一词的意思是“新用户或对某项活动极其陌生且缺乏经验的参与者”。新手黑客是黑客世界的初学者。他们没有先前的知识或经验。他们徘徊在社区边缘，目标是从同伴那里学习门道。\n\
  \n### 8. 黑客行动 (HACKTIVISM)\n\n这种版本的黑客行为是一个社区或个人利用黑客技术，通过被入侵的系统向公众推送信息的过程。黑客主义可以分为两类：\n\
  \n1. 网络恐怖主义：之所以被称为恐怖主义，是因为黑客意图入侵系统是为了彻底破坏或损坏该系统或网络。黑客将使计算机完全无法使用。\n2. 信息主权：这些人会入侵系统或网络，从公共和私源收集机密数据，让任何人都能获取这些信息。\n\
  \n### 9. 情报机构 (INTELLIGENCE AGENCIES)\n\n任何国家都可能被入侵。为了保护国家免受黑客攻击，情报机构联合反网络恐怖主义机构从事自己的形式的黑客活动。他们这样做是为了保护国家免受外国攻击和威胁。从通常意义上说，我们不能得出这是黑客的结论，因为这些机构充当了蓝帽客的角色，采用防御策略。\n\
  \n### 10. 组织犯罪 (ORGANIZED CRIME)\n\n在许多犯罪电影中，反派有一个为其效力的“教父”。组织犯罪黑客为老板工作。他们与黑帽黑客有关，因为他们通过犯罪和违反法律，来协助其所属的教父或帮派实现犯罪目标。\n\
  \n## 黑客入侵系统/网络执行的步骤\n\n在黑客入侵系统之前，他或她必须完成某些过程。其中一些步骤包括：\n\n1. 侦察 (RECONNAISSANCE)\n\
  \n为了避免被入侵，你应该保持你的私人信息非常安全。在此语境下，`reconnaissance` 一词是指黑客尝试收集有关你（目标）以及你系统中任何弱点的所有手段。黑客利用这一步骤获取尽可能多关于目标的信息。\n\
  \n2. 扫描与枚举 (SCANNING AND ENUMERATION)\n\n在这个阶段，黑客利用在上阶段收集的信息来测试和检查你的网络。扫描涉及使用智能系统端口扫描来检查你系统的开放端口和脆弱点。攻击者可以使用许多自动化工具来检查和测试你系统的漏洞。\n\
  \n3. 获取访问 (GAINING ACCESS)\n\n如果黑客能够完成上述两个阶段，他/她的下一个阶段就是获取你系统的访问权限。这个阶段是黑客所有乐趣开始的地方。他或她将利用在侦察和扫描你的系统期间发现的缺陷来突破你的连接。黑客可以利用你的局域网、互联网（在线或离线）或对\
  \ PC 的本地访问。在现实意义上，黑客入侵你的系统或网络的一刻，黑客被视为该系统的所有者。安全泄露是指黑客可以使用邪恶技术破坏你系统的阶段。\n\n4. 维持访问\
  \ (MAINTAINING ACCESS)\n\n在上一个阶段，我们说一旦黑帽黑客入侵了你的系统，它就不再属于你了。在这个阶段，在黑客突破了你的安全访问并完全入侵你的系统后，他或她可以通过创建后门来未来访问你的计算机。因此，即使你再次获得了该计算机系统或网络的访问，你仍然无法确定处于完全控制。黑客可能会安装一些脚本，即使在你认为威胁已经消失时也能允许访问你的系统。\n\
  \n5. 清除痕迹 (CLEARING TRACKS)\n\n黑客获得了你系统的访问权限，同时维持了对该系统的访问。你认为黑客接下来会做什么？黑客随后会清除他所有的痕迹，以避免被安全人员或机构发现，以便他能够继续使用该系统。在其他情况下，黑客这样做可能只是为了防止对其采取法律行动。今天，许多安全泄露未被发现。已经出现过即使在有警的日志检查的情况下，防火墙被绕过的情况。\n\
  \n## 基本安全准则 (BASIC SECURITY GUIDELINES)\n\n到目前，你应该对黑客的本质有一定的了解。现在我们将概述基本的安全准则，这些准则将保护你、你的系统和信息免受外部威胁。我们将提供的所有信息都是基于已成功的实用方法。这些方法将帮助防止计算机系统被恶意用户攻击和破坏。\n\
  \n### 更新你的操作系统 (Operating System)\n\n操作系统面临不同类型的攻击。每天都有新病毒发布；光是这些就应该让你保持警惕，因为你的操作系统可能受到一组新威胁的侵害。这就是为什么这些操作系统的供应商定期发布新更新，以便领先于新威胁。保护自己免受新威胁的最佳方法是每周或每月更新一次操作系统。这将帮助你提高安全性，并降低系统成为病毒宿主的风险。\n\
  \n\n\n\n\n在上一节中，我们讨论了更新的重要性。更新后的软件具有更高的效率和便利性，甚至拥有更出色的内置安全功能。因此，频繁更新你的应用程序、浏览器和其他程序是至关重要的。\n\
  \n### 杀毒软件\n根据我们的研究，我们发现某些操作系统很容易受到攻击，特别是 `Microsoft` 或 `Windows` 平台。保护系统免受病毒的方法之一是使用杀病毒程序。杀病毒程序可以在许多方面为你提供帮助。你可以在系统上安装许多杀病毒程序（免费或付费）来防范威胁。恶意黑客可以通过互联网在你的系统中植入病毒，但通过良好的杀毒扫描，你可以发现并消除这些威胁。与任何其他软件或程序一样，你的杀毒软件需要频繁更新才能保持\
  \ 100% 的有效性。\n\n### 反间谍软件\n该程序同样重要，因为你不希望系统上出现木马程序。你可以在互联网上找到许多反间谍软件；只需确保选择一个评价良好的即可。\n\
  \n### 选择 Macintosh\n`Windows` 操作系统非常流行，因此许多黑客和破解者都针对它。你可能读过一些文章和博客，说 `Macintosh`\
  \ 操作系统的安全性较低；然而，`Macintosh` 对许多影响 `Windows` 的威胁具有免疫力。因此，我们建议你尝试 `Macintosh` 平台。但是，正如我们在其他章节中解释过的，世界上没有任何系统是完全防黑的，所以请不要掉以轻心。\n\
  \n### 避免不良网站\n当你浏览 `Facebook` 时，可能会遇到向你发送带有链接消息的陌生人，其中一些是以点击诱饵的形式。避免点击此类链接。此外，你必须避免色情网站，或那些承诺好得不可置信的事物的网站。其中一些网站承诺在你点击链接时赠送免费音乐，而另一些则提供免费现金或电影。这些网站由恶意黑客运营，他们正寻找通过恶意软件链接损害你电脑的方法。请注意，在某些恶意网站上，你甚至不需要点击任何内容就会被黑。良好的浏览器会在带你进入坏网站之前始终提醒你。始终听从浏览器的警告，并在必要时返回安全区域。\n\
  \n### 防火墙\n如果你是某机构机构工作的计算机专家，你可能会遇到多个计算机系统处于同一个网络下的情况。在这种情况下，你必须安装提供安全防火墙的软件。`Windows`\
  \ 操作系统内置了防火墙，你可以直接激活并使用。此防火墙功能适用于不同版本的 `Windows`，包括 `Windows XP`、`Windows Professional`、`Windows\
  \ 10` 以及其他版本。\n\n### 垃圾邮件\n你也可能因为垃圾邮件被黑。邮件提供商已主动根据一组参数对邮件进行分类。某些邮件将直接发送到收件箱，而另一些将发送到垃圾箱。为了安全，请避免打开看起来可疑的邮件。某些邮件包含你不应该打开的附件。无论邮件提供商采取什么安全措施，某些垃圾邮件仍会绕过过滤器直接进入你的收件箱。避免打开此类邮件，不要下载随附的附件。\n\
  \n### 备份选项\n无论是经营自己的业务，还是作为伦理黑客为机构工作，备份你的工作都至关重要。某些文件包含机信息，如个人文件、财务数据和无法丢失的工作文档。你应该注册\
  \ `Google Drive`、`Onedrive` 和其他云盘公司，这样你就可以上传文件作为一种备份形式。你也可以购买外部硬盘，并将所有重要文件传输到其中。采取所有这些安全措施，因为无论你安装了什么杀毒软件，单一恶意软件都可能扰乱你的数据。一旦执行了某些操作，你就无法撤销，所以请始终保持备份。\n\
  \n### 密码\n这是安全最重要的方面。强密码的重要性无论如何强调都不为过。从你的电子邮件、文档甚至是安全的服务器，良好的密码都是防御外部威胁的第一道也是最后一道防线。密码分为两类：弱密码和强密码。弱密码是用你的手机号、姓名、家人姓名或其他易被猜到的内容制成的。避免使用这种密码，因为即使是业余黑客也能猜到它。\n\
  \n有些人使用生日或特殊纪念日等日期；但仍然并不安全。创建密码时，请花些时间做一些基础计算，因为你的密码必须同时包含字母和数字。你甚至可以将其与特殊字符结合。例如，如果你的初始密码是“jack”，你可以将其改为“J@ck007”。这样的密码即使简单也几乎不可能被猜到。此外，避免写下你的密码。你的密码不是需要备份的文件；它必须是你私人的。确保你使用一个简单但非常强的密码。然而，请记住，强密码并不能让你完全安全。\n\
  \n## 通用安全提示\n到此时，你应该对黑客行为的本质有了深入的了解，并掌握了一些确保计算机系统或网络安全的指南。以下是应该遵循的通用提示，以避免成为黑客的受害者。\n\
  \n*   当你登录电子邮件时，应避免打开来自未知来源的邮件。最重要的是，不要下载此类邮件附的任何附件。\n*   不要访问不安全的网站。始终访问安全的网站，例如带有“https`\
  \ 的网站。尽量只进行安全浏览。\n*   在安装新程序之前，确保该程序已通过扫描以确保其没有病毒。然后，你需要删除任何旧的安装文件，因为你现在已经有了新的安装文件。如果黑客利用那些旧文件作为后门，这可以为你节省损失。\n\
  *   定期扫描你的文件。同时确保系统上的所有应用程序都已更新到最新版本。\n*   如果你在家工作，请确保你与安全专业人士或公司保持联系，他们可以帮助你检查并尽快修复网络漏洞。\n\
  *   始终备份你的文件。你可以使用安全的云盘，如 `Google Drive` 或 `Dropbox`。你也可以购买外部驱动器以保持你的重要文件安全且完整。\n\
  *   你在社交网络上吗？避免点击陌生人发送的链接。此类诱人的信息可能是私人聊天室的邀请，或者是点击链接后给钱的承诺。避免它们并保持安全。\n*   随着技术的进步，软件开发人员也在进步。始终确保你使用良好的浏览器上网。例如，某些浏览器内置了病毒或危险检测机器人，当你尝试访问不安全的网页时，它们会向你警报。当你想要下载浏览器时，请选择具有更好内置安全功能的浏览器。推荐以下浏览器：\n\
  \    a) `Google Chrome`\n    b) `Mozilla Firefox`\n    c) `Safari`\n*   当使用浏览器连接互联网时，使用对你重要的功能。例如，如果你在连接时没有使用\
  \ `Java` 或 `Active X`，请在浏览器中禁用它们。一直保持连接是不安全的。\n*   研究表明，最安全的操作系统是 `Linux` 和 `Macintosh`。如果这两个系统满足你的需求，建议切换到它们。它们更安全，因为与流行的\
  \ `Windows` 系统相比，它们的黑客攻击事件较少。\n\n\n\n\n\n- 当你睡觉，如果你的计算机系统处于开启且空闲或睡眠模式，你仍然可能受到攻击。为了防止这种情况，请确保在不使用电脑时完全关闭它。关闭的系统是不可能被入侵的。\n\
  \n# 第二章：无线网络攻击简介\n\n技术每天都在进步。无线网络也被称为无线局域网（WLANs）或 Wi-Fi 网络。随着技术的改进，几乎所有的办公室、家庭、酒店和咖啡馆都在安装\
  \ WLAN 作为连接手段。Wi-Fi 网络因为其给用户带来的舒适性、移动性以及价格低廉的简单事实而具有良好的适应性和实用性，因此几乎任何人都能负担得起。除了这种网络成本更低之外，它也比\
  \ LAN（局域网）等其他有线网络连接更容易实施。考虑到客户的需求、用户的解决方案以及公司寻求的标准，Wi-Fi 技术是真实且真正的。我们可以说，这种技术将长久存在。然而，问题是，这种技术的安全性究竟如何？\n\
  \n无线网络基于 `IEEE 802.11`（电气与电子工程师学会）WLAN 标准。`IEEE` 是于 1980 年 2 月成立的团体——这也是该名称成立的同年同月。在\
  \ `IEEE 802.11` 名称中，结尾的 `.11` 指 WLAN 工作组，它是 `802` 组的一个子集。在竞争最佳无线网络的行业团体中，游戏中最好且最热门的玩家是\
  \ Wi-Fi 联盟和 `IEEE 802.11` 工作组。\n\n随着多年过去，对无线网络的需求大幅增加，WLAN 小基市场已针对大多数专业应用进行了明确。今天，无线技术的使用非常泛滥，因为每个人都在使用\
  \ WLAN。无论你使用的是 Android、iOS 还是任何其他操作系统，你都在使用 WLAN。此外，如果你在没有通过太网线连接调制解调器的电脑上上网，你就可以得出你正在使用无线网络。\n\
  \n你需要记住的一个关键点是：“没有任何计算机网络是完全安全的。”这种技术的广泛使用使计算机暴露在许多新危险之中。尽管 `IEEE` 团体规模很大，但无线网络的普及使其成为比预想中更大的目标。有线等效加密（在\
  \ `802.11` 无线协议中被称为 `WEP`）的缺陷也没有提供任何帮助。引用微软的话，事实证明，你的商业地位越高、名气越大，你遭受的攻击就越多。\n\n\
  随着无线网络为我们的生活带来的灵活性（包括便利性、生产力和成本效益），安全变成了一个更高的风险。无线网络最常见的安全问题曾是弱密码、间谍软件和缺失补丁。尽管所有提到的风险仍然存在并且仍在增加，但\
  \ WLAN 从完全不同的角度带来了一系列新的漏洞，例如伦理攻击（道德攻击）的诞生。这种攻击有时被称为白帽攻击，用于防御不守道德的黑客。\n\n伦理攻击的意义不仅在于名称；你可以将其视为渗透测试以及漏洞测试行为。在黑客领域，有很多类型的黑客：黑帽黑客、灰帽黑客等。你可以明确地说他们是坏人。伦理攻击技术涉及提前计划，通过使用坏人可能使用的工具，在他们攻击之前防御他们的行动。你可以通过使用复杂的测试方法并跟进其他修复来反击。\n\
  \n在本章中，我们将研究与 `802.11` 无线网络相关的漏洞，以及你可以如何以伦理的方式攻击它们，使其更安全、更受保护。\n\n## 测试你的无线系统\n\n\
  自从发明以来，无线网络一直没有完全安全。人们发现了许多弱点，包括加密缺陷、认证问题和物理安全问题。还有许多工具可以测试你的无线系统。已经出现了两种无线安全标准来应对攻击者：`IEEE\
  \ 802.11i` 和 Wi-Fi 保护访问（WPA）。\n\n`Wi-Fi Protected Access (WPA)`：Wi-Fi 联盟开发了这一标准，作为\
  \ `WEP` 漏洞的过渡修复。直到 `IEEE` 提出 `802.11i` 标准的想法，它一直在使用。\n\n`IEEE 802.11i`：该标准也被称为 `WPA2`\
  \ 标准。它正式归 `IEEE` 标准所有。其后的理念是将针对 `WEP` 的 `WPA` 修复与其他形式的加密和认证机制相结合。这反促进网络安全。\n\n无论\
  \ `802.11a/b/g` 协议存在漏洞，这两个标准都解决了许多安全问题。大多数安全标准的问题在于解决方案不起作用，因为许多管理员对变化产生抵触，没有完全实施它们。当网络在实施后配置完成，管理员会避免重新配置现有的无线设置。他们希望避免设计和实施完整的安全机制，担心会使网络管理复杂。这些是合理的顾虑，但在过程中它们让大多数无线网络暴露在危险之中。\n\
  \n谈到完全保护，在系统中实施这些标准以及其他无线安全策略仍然不能保证网络将得到完全保护。计算机网络是不完全安全的。例如，假设你在一家公司工作，员工在网络上安装了不安全的无线接入点，而你对它们一无知。无论你在网络上实施了所有标准，过去的经验表明，这些系统大多数面临威胁。因此，你不能停止学习。黑客就像杀病毒版本的升级，你必须频繁更新自己。\n\
  \n## 理解你的系统正面临的风险\n\n在深入讨论伦理攻击之前，我们应该涵盖一些稍后将在使用的概念定义。其中包括：\n\n`Vulnerability`（漏洞）：这是易受攻击的倾向或弱点。一个很好的例子是没有采用加密或在接入点上使用弱密码的系统网络。接入点\
  \ (`AP`）被认为一组无线系统的中央核心。许多无线网络弱点将在以后讨论。\n\n`Threat`（威胁）：这是信息系统中存在或即将发生之危险的指示。代理黑客是威胁的很好例子，不满的员工也是如此。此外，恶意软件可能是间谍软件，包括能够在计算机网络中制造破坏的病毒。\n\
  \n这些是基础，但在此之外，还有几件事在威胁能够利用计算机网络弱点时可能会出现。在这种情况下，这种行动被称为 `risk`（风险）。有时，你甚至可能认为你的无线网络没有发生黑客感兴趣的事情，但总有许多危险的机会。与弱无线网络相关的风险包括：\n\
  \n*   密码被盗\n*   获得对从服务器传输的文件的完全访问权限\n*   引导黑客进入有线网络的后门接入点\n*   被截获的电子邮件\n*   拒绝服务攻击，可能导致停机和生产力损失\n\
  *   违反与隐私和业务财务报告相关的州、联邦或国际法规\n*   垃圾邮件\n\n\n\n\n\n* `Zombies`（利用你的计算机网络来攻击其他网络的黑客；这无疑会使你和你的系统陷入不利）\n\
  \n无线网络相关的危险与有线网络的危险并无本质。简而言之，无线网络存在许多漏洞。\n\n尽管情况看起来糟糕，但如果你没有必要的工具，要发现自己何时被黑客攻击将变得非常困难甚至是不可能的，即使你在一英里外进行观察也是如此。无线网络可以在任何地方运行；这可能包括一个好奇的邻居，他正在使用频率扫描仪切换你的连接并收听你的无线手机会话。如果没有良好的保护工具，一切皆有可能。\n\
  \n## 了解你的敌人\n\n无线网络的漏洞本身并不是缺点；问题在于那些不惜时间滥用这些弱点的恶意黑客。这显然会让你的生活变得更加困难。俗话说：“要追踪小偷，你必须表现得像小偷一样思考。”为了保护你的系统，你需要像黑客那样进行推理。你和恶意黑客在攻击计划方面可能有完全不同的视角。但尽管如此，你至少会理解问题源于何以及他们是如何操作的。\n\
  \n首先，如果你的安全系统访问所需的投入较少，黑客很可能会黑入你的系统网络。黑客通常会针对只有几个无线接入点的组织。。其原因有许多，如下文所示：\n\n* 无线接入点较少的系统更有可能没有更改默认设置，这使得他人更容易入侵系统。\n\
  * 小型组织的网络管理员监控其操作的时间较少。\n* 小型网络系统不太可能具有 `WPA` 或 `WPA2` 等网络检查和控制，甚至没有 `WIDS`（无线入侵检测系统）。这些是黑客在尝试破解你的网络时首先检查的内容。\n\
  \n然而，并非只有小型网络容易受到黑客的攻击。在各种规模的网络中，还有许多其他黑客可以利用的弱点，包括：\n\n* 一些网络管理员没有时间监控网络内部的恶意行为。\n\
  * 因为无线网络是其第一代（有线网络）的延伸，只要有 `AP`，后面就最可能有一个有线网络。\n* 流量也可以成为弱点。这是因为如果一个网络很大，破解 `WEP`（有线等效隐私）加密密钥将更容易。流量是大型网络接收高流量以及发送到服务器进行捕获的数据包量增加的原因。这导致了更快、更快的\
  \ `WEP` 破解速度。\n* `Service-Set-Identifiers` (`SSIDs`) 被设置为可识别的名称或特定的部门名称。这可以让黑客或入侵者洞察到应该先攻击哪个系统网络。\n\
  \n## 无线网络的复杂性\n\n安装防火墙或创建一组强密码并具有详细的访问控制设置不足以保持安全。除了上述提到的所有标准和漏洞，你必须理解，保护无线网络最大且最乏味的的障碍是网络内部的复杂性。然而，没有任何无线网络是完全安全的。有些东西并不复杂，但仍可能被认为是障碍。例如，一个普通的\
  \ `AP` 和无线 `NIC`（网卡）实际上可能并不复杂，尽管你可以推断出后台运行着复杂得多。\n\n`802.11` 协议并非为了完美而开发，因为它们存在大问题。这些协议并不仅仅像旧以太网那样帮助你以最优的管理开销发送和接收信息。相反，`802.11`\
  \ 协议是极其复杂的。大多数无线网络只是传输和接收携带网络数据包的 `RF`（射频）信号。`802.11` 网络实际上会执行更复杂的功能，例如：\n\n* 加密数据以提高数据隐私。\n\
  * 验证客户端以确保只有授权的人员才能访问其网络。\n* 设置定时消息数据包以确保客户端同步并帮助避免数据传输冲突。\n* 检查数据完整性以确保所有信息保持未受污染。\n\
  \n尽管 `802.11` 协议非常复杂，但它们的网络设计还与更多复杂性相关，例如：\n\n* 维护你的无线设备，这可能包括笔记本电脑、`APs` 和 `PDAs`（个人数字助理）。\n\
  * 实施什么类型的天线以及将它们放置在哪里。\n* 确切知道哪些类型的设备允许进入网络。\n* 调整信号功率设置，以防止你的射频信号泄漏到住宅之外。\n\n所有这些无线网络的复杂性汇聚成了旧传统有线网络中不存在的众多安全漏洞。\n\
  \n## 使用正确的工具\n\n生活的每项特定任务都需要正确的工具。没有浏览器，你就无法浏览互联网。即使有了浏览器，也不能保证你能上网。这是因为某些网页是用不同的语言编写的，如果你的浏览器没有开发出能够处理这种语言的能力，它加载网页将很困难。你必须拥有适当的测试工具，这恰恰是道德黑客过程中最重要的部分。准备工作意味着朝着正确的结果努力；否则，你很可能是在徒用功，无法获得良好的结果。\n\
  \n你的无线工具是为了完成特定目标而开发的，这一事实并不保证它们能成功执行该测试。有时你甚至需要更改设置以获得你想要的结果，或者有时你可能需要将一个结果与另一个结合。还存在获得假阳性（即你的工具说你有漏洞，但实际上没有）或假阴性（即你的工具说你没有漏洞，但实际上有一个）的可能性。\n\
  \n随着技术每天演进，以下是你可以用于无线网络安全的一些最佳工具：\n\n* 笔记本电脑\n* Google\n* GPS 卫星接收器\n* 网络扫描器软件\n\
  * `QualysGuard` 漏洞软件\n* `AiroPeel` 网络分析软件\n* `WEPcrack` 破解软件（用于破解加密）\n\n许多工具可以在互联网上获得。\n\
  \n## 保护的基础分析\n\n\n\n\n在保护之前，你首先需要进行检查。当你准备好所有的测试工具时，就是时候准备好对你的无线网络进行测试了，通过对自己的网络系统进行多次伦理黑客和攻击。通过这种方式，你正在向自己揭示你网络中脆弱的区域。在攻击网络的过程中获得的结果将让你更深入地了解你的无线网络漏洞何漏洞，以及安全漏洞可能修复或无法修复的深度。以下是你可以采取的应对措施，以解决你在自系统攻击过程中会遇到的漏洞。\n\
  \n- 非技术攻击：这些是用来利用人性弱点的攻击——缺乏安全意识、对陌生人过度信任或过于粗心。\n- 网络攻击：这类攻击可能包括安装恶意的无线 AP，以及诱导网络客户端连接到此类客户端的阴险手段，尽管存在如\
  \ `SNMP` 这样的网络服务器协议。\n- 软件攻击：对 `802.11` 协议的安全担忧并未此结束，因为我们还应该关注安装在无线系统上的应用程序和操作系统。它们也容易受到攻击。软件攻击可能涉及：\n\
  \    1. 破解你无线网络加密的 `WEP` 密钥。\n    2. 通过利用你脆弱的身份验证系统获取你无线网络的访问权限。\n    3. 通过默认密码（如果你没有更改默认设置）以及易于获取的\
  \ `SSIDs` 进入你的无线网络进行攻击。\n\n# 伦理黑客的十诫\n\n每个过程都有其自身的规则和诫律。圣经有信徒要遵守的规则。以下是指导伦理黑客流程的原则。\n\
  \n## 1. 你必须设定你的目标\n\n让我们分析一下。当 Jack 还是个孩子时，他喜欢玩一种叫“夺旗”（Capture the Flag）的游戏。他在营地开始玩这个游戏；他的营员对这个游戏产生了兴趣并加入了他。后来，这个游戏得到了改进。营员将营员分成两组：一组拿着绿旗，另一组拿着红旗。每个游戏都有一个玩家必须遵守的规则：如果你在绿旗队，你和整个团队就必须找到红旗队隐藏的红旗，反之亦然。\n\
  \n尽管这个游戏规则很简单，但情况可能会变得有点混乱。这关乎一种专注的心态：夺旗。这种专注与渗透测试有关，这意味着具有定义目标或目的的安全测试，只有在目标实现或时间耗尽时才能结束。尝试访问另一个接入点类似于试图寻找对手隐藏的旗帜。你的对手知道你会为了访问接入点而不惜一切手段，所以他或她会尽一切努力来保护它，因为对手知道你会绕过防御——你会尝试“夺旗”。\n\
  \n伦理黑客与渗透测试有关系吗？伦理黑客本身是一种渗透测试，可以作为一种营销手段，但涉及更多的系统，这意味着有多个要实现的目标。\n\n如果你在绿旗队并想要定位对方隐藏的红旗，你需要像一个守旗者一样进行逻辑思考。你会说：“如果我在另一队，我会把旗藏在哪里？”你有一个要实现的目标，这就是为什么你对无线网络安全的评估应该回答三个逻辑问题：\n\
  \n- 入侵者将如何处理被盗的信息？\n- 入侵者能够在目标网络或接入点上看到哪些隐私信息？\n- 目标基地的用户会注意到入侵者的尝试吗？\n\n你的目标可以非常简单，比如你可能会选择寻找非法无线接入点的\
  \ `AP`。你也可以决定定位或获取你系统中有线网络的信息。无论你选择做什么，关键点在于，你必须明确你的目标并通知你的赞助者。\n\n“三个脑袋胜过两个脑袋。”无论你做什么，都需要一个好的计划才能成功。在此时，你必须让其他人参与你的计划和目标设定过程。如果你不，你规划过程中的一切都可能变得困难。目标决定了好的计划。引用柴猫对爱丽丝关于目标的回答：“如果你不知道要去去哪里，哪条路都能带你那里。”在设定目标的过程中包含投资者，因为他们建立的信任将在以后带来丰厚的回。\n\
  \n## 2. 你必须有一个计划\n\n在生活中，并非一切都按计划进行。例如，我们并不是都有无限的预算；总有一些东西限制着我们的计划。这些限制可以是时间、金钱或人员。这里的观点是你需要为你的测试制定计划。\n\
  \n良好的计划会导致良好的结果。因此，以下是关重要的：\n\n- 知道你想测试什么并识别网络。\n- 评估测试周期。\n- 评估测试方法。\n- 实施良好的计划并与利益相关者分享。\n\
  - 等待你的计划获得批准。\n\n不要担心人们会认为你想破解无线网络；分享并公布你的计划。如果你工作的机构像大多数其他机构一样，它极不可能反对组织惯性来采取任何行动阻碍你的努力。最重要的是，不要忘记你并不是在普通条件下在在评估你的“测试过程”。\n\
  \n## 3. 你必须获得许可\n\n不要忘记你正在进行伦理黑客。如果你没有获得适当的许可，你可能会进监狱。回想一个内部审计员的案例，他被当场抓获兑取一张他不工作的工资支票。当他被质问时，他回答：“我不是在偷东西，我只是在检查系统的控制措施。”他本可以在向组织建议解决方案之前获得检查系统漏洞的许可，但他没有这样做，那个行为导致他进了监狱。在伦理黑客中，不要遵循那句老话——“寻求原谅比请求许可容易得多”。如果你不请求许可，你一定会进监狱。\n\
  \n记住，这种许可可能是你与黑白条纹制服之间的唯一障碍。寻找并获得一张“免死牌”。这张卡片将作为证据，证明你对网络的测试是经过授权的，你正在按照计划执行操作。票据将说明，如果你被指控犯罪或因你的行为被起诉，你的组织将支持你。只要你坚持与组织一起创建的计划，一旦出现问题，你的卡片将为你提供组织和法律支持。\n\
  \n## 4. 你必须伦理地操作\n\n伦理黑客与白帽黑客是一样的，因为黑客的意图和良知总是好的。这条诫律告诉你你必须按照你提供的并已批准的计划工作。避免采取未授权的或在计划之外的行为。成为一名伦理黑客定义了你内在的善良，所以要伦理地工作。\n\
  \n在操作过程中，你发现的每一条信息都必须保密，不能向第三方披露。\n\n\n\n\n作为一名伦理黑客，你必须努力确保你在操作中所做的一切都能促进你组织的进步并推进其目标的实现。如果你有必须更改的地方，请告知你的机构。如果你遇到意料之外的情况，可能需要调整计划，例如某些对组织整个网络构成重大风险的情况。不要独自做决定。如果你的机构政策或法律禁止，请避免进行伦理黑客。\n\
  \n## 5. 你必须保存记录。\n\n要在伦理黑客这一职业中生存并取得成功，你需要具备耐心、勤奋工作和严谨的精神。这是因为成为一名伦理黑客需要大量的时间；在某些情况下，你可能会独自在黑暗中对着电脑键盘坐几个小时，直到感到压力巨大且疲惫。为了实现目标，你可能还需要进行一些工作外的工作。然而，这并不意味着你必须穿上黑客装备或开始喝红牛。这一切的目标是确保你实现目标，并成为一名不可阻挡的伦理黑客。\n\
  \n上一条诫律说明了伦理黑客保持在其操作范围内有多么重要。你必须以专业人士的方式运营，这意味着你必须记录。你可以通过纸质或电子方式通过以下策略保存记录：\n\n\
  *   记录所有执行的操作。\n*   为你的日志制作副本。\n*   在日志中记录所有数据。\n*   记录并保留所有事实记录；即使你认为你的工作没有成功，也应该记录下来。\n\
  *   对每一次测试进行记录并注明日期。\n\n在每个组织中，始终有报告工作的需求。你的报告可以是你的成果、测试设计和分析。在记录记录和整体工作方面要极度勤勉。\n\
  \n## 6. 你必须尊重他人隐私。\n\n你需要对你收集的每一条数据和信息保持尊重和保密。你必须维护私人信息的机密性。在测试期间，你将收集有关加密密钥和明文密码等信息。所有这些信息必须保密且隐私。例如，不要窥探私人公司账户或个人的私生活。妥善处理你获得的信息；像对待你自己的信息一样对待它们。名誉胜过财富。\n\
  \n## 7. 你不可造成伤害。\n\n你今天所做的一切终将报回到身上；这被称为因果报。作为一名伦理黑客，你的首要目标是“不造成伤害”。克制过头的冲动。相反，要坚持你的原始计划。记住，在伦理黑客过程中很容易被发现。如果你尝试了某种方法并成功了，你就会习惯。然而，没有什么是永远的，你可能会导致服务中断或篡改他人的信息或个人权利。不要超出你的计划大纲。\n\
  \n我们将在本书的后面讨论用于执行黑客攻击的工具，但请务必阅读关于每个工具目的和功能的每一个细节。不要在了解其本质的情况下就跳进去使用任何工具。你应该理解，你正在设置一笔资金，而整个攻击可能会导致拒绝服务。在在使用黑客工具之前，放松一下并深呼吸；然后准备好阅读关于该工具的完整文档。当然，这可能是无聊的，但这是成为伟大者付出的代价之一。\n\
  \n## 8. 你必须使用科学过程。\n\n这条诫律并不意味着你将遵循科学过程的所有步骤。你只需要在操作中采用该过程的一些基本原则。如果你在工作中采用准科学的方法或流程，你将拥有一个结构，并防止混乱（即在网络中随机游走可能导致的活动）。\n\
  \n科学过程包含三个步骤，分别是：\n\n1.  制定并选择你的计划和目标。\n2.  使你的网络能够实现你的目标。\n3.  说服你的组织认可你的工作。\n\n\
  前两步已经在之前的诫律中讨论过。让我们来看第三步。如果你采用经验方法，你的工作结果将获得更大的认可。经验过程具有以下属性：\n\n*   **设定可量化的目标**：在夺旗赛（CTF）中，每个团队在找到对手旗帜之前都不会停止。设定可量化目标的目的是让你知道何时达到了目标。这通过两种方式实现：你找到了旗帜，或者没找到。联系伦理黑客，你必须选择一个你知道可以实现的目标；然后将所选目标与最多\
  \ 10 个接入点 (`APs`)、破解的加密密钥以及内部服务器上的文件相关联。时间可量化的目标包括自测你的系统或网络，以了解它可以如何承受连续三天的攻击。\n\
  *   **测试是稳定且可重复的**：一致性是指当你自测系统或网络时，使用不同的方法获得相同的结果。如果你的结果始终不一致，那么它就不稳定。从科学角度来说，你应该能够对任何形式的不一致或无效测试结果提交一份说明报告。你也可以问自己一个你应该预料到组织提出的问题：如果重复你的测试，它会有相同的结果吗？如果你确保了测试被重复并一直获得相同的结果，你就可以确信无论相同的测试复制多少次，结果都是相同的。\n\
  *   **测试结果应保持一致性**：你通过测试获得的准确结果应该在一个较长范围内保持（成为永久结果）。如果你的测试是真实的，那么在测试解决永久性问题的情况下，你的组织更容易接受。如果一个测试只能解决瞬时或暂时的困难，那么它将意义不大。\n\
  \n## 9. 你不可盗取邻居的工具。\n\n对你所拥有的保持满足。无线黑客工具将继续席卷软件市场，无论你现在有多少工具，你都会不断发现新的。由于技术的进步，更多的工具将不断涌现。在无线黑客的早期，与我们现在拥有的丰富工具相比选择有限。例如\
  \ `Network Stumbler`，它在 Windows 操作系统上被称为 `NetStumbler`。它与 Linux 操作系统上的 `Kismet`软件功能相同。早期的软件选择有限。现在，你有更多选择，如\
  \ `WarLinux`、`Aerosol`、`AirScanner`、`APsniff`、`dstumbler`、`Gwireless`、`BSD-Airtools`、`iStumbler`、`MacStumbler`、`KisMAC`、`Mognet`、`MiniStumbler`、`THC-RUT`、`PocketWarrior`、`THC-Scan`、`PocketWiNc`、`THC-WarDrive`、`WarLinux`、`Radiate`、`WiStumbler`、`Wellenreiter`、`Wlandump`\
  \ 等。这些只是互联网上提供的免费工具。你可以购买的付费工具有 `AiroPeek`、`Air Sniffer`、`AirMagnet`、`AP Scanner`、`Sniff-em`、`NetChaser`\
  \ 和 `Sniffer Wireless`。这里的想法很简单：如果你有更多的钱和时间，可以去互联网下载免费工具或购买你需要的工具。不要偷取或被邻居的工具诱惑。获取自己的并习惯它们。\n\
  \n## 10. 你必须汇报所有发现。\n\n当某人的隐私因操作或测试而面临风险时，他们会对可能发生的情况感到紧张。因此，请确保及时提供进度更新。避免在他们已经知道你正在入侵他们的网络时让他们处于悬念中。频繁更新至关重要。在发现过程中，你发现的每一个漏洞必须立即报告。此类漏洞包括：\n\
  \n\n\n\n\n# 违入\n\n*   通过匿名访问即可利用的漏洞。\n*   利用率极高的漏洞。\n*   对生命造成危害的漏洞。\n\n如果你发现了一个漏洞并计划报告但没有这样做，一旦其他人利用了这一弱点，你将会处于境地，因为你没有做正确的事。\n\
  \n如果你保持谦逊的态度，你的善良和诚实定会获得回报。一旦你检测到你组织系统或网络中的漏洞并立即上报，你的工作真实性将获得认可。这将对他人对你完成任务方式的评估产生积极影响。你的同事可以检查你的分析、方法论、发现和结论。他们可以提供诚恳的批评和建议，以改进你的工作。\n\
  \n如果你发现自己的报告受到不公正的批评，只需遵循这 10 条戒律，因为它们将帮助你更好地准备报告。\n\n此外，如果你进行了一项测试并发现了 30 个问题，请务必报告你检测到的所有\
  \ 30 个问题。你不需要在摘要中包含所有 30 个问题，但要在叙述中包含它们。如果你认为要报告的内容太多而选择保留某些信息，组织内后期发现这些问题的人会将你标记为无能或懒惰。因此，最好避免这种情况，并报告所有内容。\n\
  \n# 第三章：无线测试方法论的实施\n\n在你说想要开始测试无线漏洞之前，你需要为之实施一套方法论。对无线网络进行伦理黑客攻击不仅仅是随心所欲地扫描端口。为了获得成功的测试，你需要遵循一些正式程序，这些程序应该被整合到你的方法论中。这些包括：\n\
  \n*   收集 IP 地址和域名作为你的公开信息。\n*   对你的网络进行映射，以对结构有一个大致的概念。\n*   扫描你的系统或网络，以获取哪些设备正在运行并传输信息的概览。\n\
  *   确定正在运行的服务。\n*   发现并定位特定的漏洞。\n*   入侵系统并完成任务。\n\n我们将在下一节讨论更多关于这些方法论的细节。在第二章中，我们涵盖了具体目标以及如何实现它们，以及明确你的方向以专注于完成测试。不要忘记这部分，因为它会让你的工作变得轻松得多。\n\
  \n记录你所做的一切日志。备份至关重要。你的日志也可以保存为屏幕截取或截图，你可以使用 `Snaglt` 工具为此（可在 `http://techsmith.com`\
  \ 获取）。有时你可能无法重现进展的相同视觉样本；那就是屏幕截取大显身场的时候。记录日志非常重要，因为有时你需要你之前所做的特定数据；因此，保存日志将使你能够获取那些数据。例如，你的客户可能会为你他们执行的操作注意到安全入侵，并可能想要追踪入侵者的移动。有了日志，你有能力向客户展示你执行操作的精确时刻，包括日期和时间。\n\
  \n在上一章中，我们讨论了伦理黑客攻击的重要戒律。不要忘记在你的黑客方法论中采用科学方法。当你进行任何涉及隐私信息的安全测试时，请确保你按条理地工作。此外，确保为正确的任务使用正确的工具；不要混用工具。使用正确的工具将帮助你获得尽可能准确的漏洞结果，并展示弱点。按条理工作的另一个优势是，你能够最大限度地减少系统的疏忽，并避免系统或网络崩溃。不同的系统应该使用不同的工具，因为它可能有不同的规格。\n\
  \n你的敌人不是你的朋友，从这个意义上说，敌人可能是试图破坏你所负责系统的黑帽黑客。为了避免失败，要在你的方法论中保持灵活。在面对敌人时，适应战争的规则和规定。\n\
  \n在一部名为 `Transformers` 的电影中，敌人被称为变形金刚，而人道主义机构是好人。一个与敌人战斗的好人告诉，当他们与坏人战斗时，必须使用正确的武器。当情况变得糟糕时，他感到沮丧并说：“为什么坏人总是得到好东西？”将这种电影分析联系到你的敌人（坏黑客），你应该预判敌人会使用最最先进的工具。因此，你也应该获取那些工具。如果他们从街街对面入侵你的网络，你必须能够能够从街街对面进行测试。如果他们跨越互联网入侵你的网络配置，你也应该对你的网络进行互联网测试。要知，两个伦理黑客是不可能相同的。如果需要你调整程序和方法，请不要犹豫去做必要的事。\n\
  \n## 确定他人所知\n\n基本上，其他黑客最初所做的是探测和刺探他们的目标系统以找到所有漏洞。如果你想在你的领域立足，你也必须这样做。从不同的角度运行不同的测试，并尝试从局外人的视角观察你的网络。这将帮助你获得更准确的结果，关于你的网络对敌人来说是什么样的，而不仅仅是你在系统上看到的样子。这在无线网络领域非常重要，因为我们没有像有线系统那样的额外物理安全屏障。\n\
  \n### 你需要寻找的内容\n\n在开始无线测试之前，这里有几件非常需要寻找的事：\n\n*   软件版本\n*   IP 划分方案\n*   无线电信号强度\n\
  *   硬件品牌和版本\n*   正在广播的特定 SSID\n*   加密，如 VPN 或 WEP 流量\n\n## 方法论 1：整合公众视野\n\n我们之前提到过将进一步讨论上述方法论。你应该了解的一个关键点或方法论是，伦理黑客攻击的第一步是执行高层网络侦查，称为足迹探测（footprinting）。例如，如果你被要求对系统或网络进行更广泛的信息安全测试，你可能需要寻找如商标名称、员工姓名、公司文件或母公司名称。所有这些信息都可以使用\
  \ Google 等可用公开工具找到或访问。你还可以使用组织的网站或使用商标局网站（`www.uspto.gov`）收集信息。此外，公开可用信息可能不像网络系统中的另一种形式那样普遍。这是因为无线网络更具局部性且基于基础设施。尽管如此，花时间看看你能在那里收集到什么仍然值得的。\n\
  \n### 使用 Google 收集信息\n\n\n\n\n\nGoogle 是 21 世纪最好的工具之一。没有它，许多企业将无法生存。虽然有许多搜索引擎，但\
  \ Google 是其中最好的。通常情况下，Google 被认为是执行安全测试的优秀工具。Google 让你能够执行多次网页及其他查询，以查找有关你无线系统的信息。通过\
  \ Google 的高级关键词搜索功能，你可以对更详细的查询、搜索结果以及网络配置进行关键词搜索。通过这个工具，你还可以访问论坛，在论坛中发现人们正在讨论你搜索的关键词；你可能会发现有人谈论他如何改进与你所拥相同的网络。你还可能遇到网络崩溃的原因。这些信息将帮助你从安全方面改进你的系统或网络。某些网络配置可能会无意公开，这会让黑客在攻击或黑入此类无线系统时领先一步。以下是你使用\
  \ Google 高级搜索可以搜索的一些关键词：\n\n*   电子表格\n*   文字处理文档\n*   网络图\n*   无线配置\n*   网络分析包文件\n\
  *   演示文稿\n*   Network stumbler 映射文件\n\nFoundstone 公司提供计算机安全专业服务，并拥有整洁的查询工具，可以执行像\
  \ Google 一样的高级查询，包括你可能甚至想过的查询。以下是链接：\n\n[https://ww.foundstone.com/resources/freetools.htm]\n\
  \n### 搜索 Wi-Fi 数据库\n\n互联网非常广泛，从不同的来源可以获取不同的信息。然而，你在互联网上找到的所有内容并非都是真实准确的。你找到关于你无线系统的互联网准确信息的另一种方法是使用\
  \ Wi-Fi 数据库。你在这些数据库中找到的信息可以包括 `MAC addresses`、`SSIDs` 以及你甚至没有想过的更深入的信息，这些信息已被某些好奇的外部人员或匿名用户发现。你可以从使用\
  \ `WiGLE` 数据库开始寻找一些灵感：\n\n[https://www.wigle.net/gps/gps/GPSDB/query]\n\n注意：你需要在访问其网站的公共数据库之前在网站上注册。你也可以检查你的\
  \ `AP` 是否列在该网站上。一旦你加入该网站，你将能够提交各种搜索选项或查询，例如：\n\n*   纬度\n*   经度\n*   最后更新时间\n*  \
  \ `BSSID` 或 `MAC`\n*   `SSID` 或网络\n\n`WiGLE` 的另一个替代方案是 `WiFimaps`。你可以访问其网站 [www.wifimaps.com](http://www.wifimaps.com)\
  \ 检查你的 `AP` 是否也在那里。\n\n要查看更多关于你的公开信息，你可以使用 [www.whois.org](http://www.whois.org)\
  \ 查找你的域名公开数据。要查询你的 `IP` 地址，你可以使用 [`ws.arin.net/cgi-bin/whois.pl`](http://ws.arin.net/cgi-bin/whois.pl)（称为美国互联网号码注册机构）。这些数据库将提供关于你无线系统或网络的敏感信息——甚至包括你不应该公开的信息。访问这些网站并检查你的无线详情。\n\
  \n## 方法论 2：映射你的网络\n\n这种方法论将教你如何创建网络地图，这将让你对无线系统的布局了一目了然。这需要从无线网络的内部和外部同时进行。就像有三维图像一样，在无线网络或系统中，有必要了解你的网络从内部和外部是如何布局的，因为无线网络有一个被称为“电波维度”的第三维度。电波维度使得你的无线系统可能从物理建筑或防火墙的任何侧被发现。这个维度不仅可以向你展示外部和内部配置信息，还可以显示明确标记为网络内外传输的无线电波的信息。\n\
  \n在有线网络中，数据传输的过程与无线网络有所不同。这是因为无线网络为其过程开启了一个新维度。如前所述，这些电波可以被视为虚拟的第三维度；实际上，这个维度为黑客提供了一种访问能力，使其能够跨越传统的边界。\n\
  \n以下是完美且专业地映射你网络的最佳可用工具。\n\n*   `Network Stumbler`：经过多年的研究，我们可以说这是从内外部映射你无线网络 `APs`\
  \ 的最佳工具。你可以从 [www.netstumbler.com/downloads](http://www.netstumbler.com/downloads)\
  \ 下载该工具`Network Stumbler` 是一个基于 `Windows OS` 的工具。该工具或软件允许你从建筑外部扫描电波。它将为你提供一份分析报告，说明坐在公园里或开车经过的黑客可以在你的网络上看到什么。你也可以从内部运行此软件，帮助你发现任何不属于你的无线\
  \ `APs`。\n*   `AiroPeek`：这是另一个可以帮助你收集网络映射信息的佳工具。它也被无线网络分析器和/或嗅探器。\n*   `Cheops-ng`\
  \ 和 `QualysGuard`：首先，你需要收集通过射频 (`RF`) 传输的所有信息，以及通过内部有线网络可以获得的有关无线网络的任何其他信息。为了收集这些信息，你需要开源工具\
  \ `Cheops-ng`（位于 [www.cheops-ng.sourceforge.net](http://www.cheops-ng.sourceforge.net)）。你也可以在\
  \ [www.qualys.com](http://www.qualys.com) 获取 `QualysGuard` 的商业版本。要创建无线网络的内部映射，这两个工具中的任何都可以通过布局通用\
  \ `IP` 结构和内部主机名来帮助你。此外，你可以执行内部使用的相同过程来映射外部无线网络，以确定外部 `IP` 地址和名称，以及可用公共主机的 `DNS`\
  \ 主机名（域名系统）。简而言之，这两种方法通过为网络提供更多的骨干使你的无线网络更加安全。\n*   `nmap` 和 `fping`：在 `Windows`\
  \ 命令提示符中，为了确认你已连接到互联网，你只需输入 `ping + web address`。网页地址可以是任何站点（例如，[www.Google.com](http://www.google.com)）。如果你在输入此命令后得到一个显示发送数据包和其他细节的统计报告，那么说明你的系统已连接到互联网。同样的逻辑适用于这里的\
  \ `nmap and fping`，但这次你实际上使用了互联网。这两种工具被认为是网络映射实用，允许使用 `ICMP`（互联网控制消息协议）来确定你网络上“存活”且“活跃”的系统。你可以通过对你的网络进行“ping”扫描来执行此操作，这可以使用\
  \ `nmap` 工具 (www.insecure.org/nmap) 完成。`Nmap` 是一个基于 `Windows` 的实用，而 `fping` 工具适用于\
  \ `UNIX` 和 `LINUX` 操作系统（[www.fping.com](http://www.fping.com)）。尽管这两个工具不会为你的网络创建图形化布局视图，但你应该在网络映射程序中期待这类内容。同时，它们非常有用。\n\
  \n\n\n\n\n实用提示：从外部（即从公共互联网）扫描你的网络可能并非轻而易举。然而，你可以尝试以下方法：尝试获取任何可以分配给你的计算机进行测试的可用公共\
  \ IP 地址。然后，将其插入到连接到互联网的路由器或防火墙的“公网侧”。\n\n此外，上述并非所有方法都能识别出有线系统和无线系统的精确运行状态。你才是那个决定属于你的网络或设备的\
  \ IP 地址、IP 网络和主机名的人。既然你已经可以成功地绘制网络地图，并能够确定网络上活跃且运行的系统，接下来需要了解的是如何扫描你的无线网络或系统以获取更多信息，例如主机名、开放端口等。\n\
  \n## 方法论 3：扫描你的系统\n\n到此时，你对无线网络的理解将比阅读这本书之前要更得广泛。你现在对 IP 地址和 `SSIDs` 有了更多了解。你可以通过被称为`枚举`（enumeration）的过程来进一步学习这两个术语。`枚举`\
  \ 一词可以解释为对你的网络或系统的一切内容进行分析的形式。你在这个过程中遇到或发现的所有细节创建一个列表，包括它们的工作原理和作用。通过`枚举`，你可以找到：\n\
  \n* RF 信号强度\n* 无线 AP 和客户端上的端口是否开放且活跃\n* 是否启用了 `WEP` 加密\n* 运行的无线主机\n\n之前提到的 `Network\
  \ Stumbler` 网络映射工具不仅能够发现运行的无线主机（ad-Hoc 客户端和 AP），其设计还使其能够获取有关射频强度以及是否启用 `WEP` 加密的更深层信息。如果你被告知这个\
  \ `Network Stumbler` 工具也非常适合`枚举`，请不要感到惊讶。\n\n如 `SuperScan` 或 `nmap` 等端口扫描器在你想寻找无线客户端和\
  \ AP 上开放的网络端口时也非常用于探测网络。使用这些工具时你可以获取更详细的信息。你可以在以下地址获取 `SuperScan`：[www.foundstone.com/resources/proddesc/superscan.htm](http://www.foundstone.com/resources/proddesc/superscan.htm)\n\
  \n一些开发者会对他们的软件添加一些限制，因此无论你是否使用的是免费软件，请务必检查你的软件许可证。这是为了确保你遵守他们的规则。互联网上提供的许多免费软件都有许可证，规定软件不能用于商业用途。此外，如果你在使用带有此类许可证的工具，你可以将其用于个人内部测试；这仍然没有问题。然而，如果你在为付费客户测试无线网络，这就像是你正在穿越百慕大大三角，因为你已经违背了许可证限制。\n\
  \n扫描端口显然不仅仅是等待工具完成扫描后获取扫描结果。它实际上帮助你创建一个关于你无线网络中可用内容的更详尽的蓝图。黑客喜欢这一点也就不不足为奇了。当你的端口被扫描时，黑客将获得大量他们用来利用你潜在网络或系统漏洞的敏感信息。以下是开放时易受攻击的端口列表：\n\
  \n| 端口号 | 服务协议 |\n| :--- | :--- |\n| 20 | FTP 数据 TCP |\n| 21 | FTP 控制 TCP |\n| 22\
  \ | SSH TCP |\n| 23 | Telnet TCP |\n| 25 | 邮件传输协议 (SMTP) TCP |\n| 53 | 域名系统 (DNS)\
  \ UDP |\n| 80 | 超文本传输协议 (HTTP) TCP |\n| 110 | 邮局协议版本 3 (POP3) TCP |\n| 135 | Microsoft\
  \ 网络的 RCP/DCE 端点映射器 UDP, TCP |\n| 137, 138, 139 | TCP/IP 之 NetBIOS UDP, TCP |\n\
  | 161 | 简单网络管理协议 (SNMP) UDP, TCP |\n| 443 | HTTPS (SSL 之上的 HTTP) TCP |\n| 512, 513,\
  \ 514 | Berkeley r 命令（例如 rsh, rlogin 和 rexec）TCP |\n| 1433 | Microsoft SQL Server\
  \ UDP, TCP |\n| 1434 | Microsoft SQL 监控器 UDP, TCP |\n| 3389 | Windows 终端服务器 TCP\
  \ |\n\n## 方法论 4：确定正在运行的服务\n\n当你扫描系统或网络端口时需要更加小心，因为在在此过程中，你的系统细节可能会被捕获。记住，知识就是力量。知识既可以用来帮助你，也可以伤害你。然而，如果你你个人能够确定你无线网络的开放端口，那么某个不是你的人也能确定那些开放端口。连接到你可用的开放端口可以让你对枚举信息有更深入的洞察，例如：\n\
  \n* 软件及其固件版本（它将以错误或横幅消息返回）\n* 横幅页面上的可接受使用政策警告\n* 可接受使用的登录警告\n* 你的操作系统和应用程序的配置\n\
  * 你的操作系统版本（它将以错误或横幅消息返回）\n\n在连接开放端口的过程中，你可能会发现一些漏洞，或者关于你的 AP、服务器和工作站的大量可利用信息。在此时不要害怕，因为你的大部分无线系统可能不是面向公众的，所以你的无线设备拥有公共\
  \ IP 地址的可能性非常低。另一方面，你必须启用某些无线服务器或无线热点以便其公共访问。这些系统通常且容易被攻击者访问，因为即使你的防火墙和其他保护措施可能无法阻止他们。当攻击者访问它时，获取你的配置细节将非常容易。这种访问性也会导致一些不可避免的漏洞，如果你想让你的网络执行实际、有用的工作，这是一个必要的恶。\n\
  \n尽管如此，获得的所有信息都可以用来对付你。记住，“永恒的警惕是生产力的代价。”这将引导我们进行实际的漏洞测试，通过测试你可以发现网络中真正的漏洞。虽然测试结果可能是误报，但它产生的问题并不重要。\n\
  \n## 方法论 5：发现并定位特定漏洞\n\n现在你已经发现了进入你无线网络的潜在窗口。现在是时候找出是否有任何你应该注意的重要漏洞了。尝试看看你的黑客可能会看到什么。这是如何做到的？你必须连接到你的无线系统，并系统地、谨慎地尝试从黑客的角度看看你能发现什么。当你执行这一过程时，你可能会定位并收集更多关键信息，并使用嗅探器工具凭空捕数据。你甚至可以确定网络是否缺少某个特定的补丁。\n\
  \n发现的任何东西都必须记录。不要因为你正进入测试的正式“漏洞评估”部分就忽略你所发现的内容。无论你是否深入或进一步探测你的无线网络，你已经发现的信息可能包含一些有趣的漏洞，例如未启用\
  \ `WEP` 和默认 `SSIDs`。此外，某些关键服务器可以通过无线网络访问。这些漏洞可以通过两种方式查看：手动或自动。\n\n### 手动评估\n\n\n\
  \n\n这是你可以用来查看这些漏洞的第一种方法。尽管它是最耗时的，但它是必不可少的。起初，使用这种方法评估漏洞可能会困难，但随着时间的推移、投入和投入，后来会变得更容易。这被称为手动评估，尽管它涉及许多半自动安全工具，但由于过程中需要人为引导，这些工具并不会执行常规的机器人评估。了解哪些方法有效、哪些无效将对你的手动评估有所帮助。手动评估网络漏洞是必要的，书中稍后还会提到了执行此类评估的各种其他方法。\n\
  \n## 自动评估\n\n这是寻找你系统或网络漏洞的第二种方法。你可以通过使用名为 `Nessus` 的开源工具来执行这种自动化方法。（你可以在 `www.nessus.org`\
  \ 获取它）。你也可以使用商业性的 `LANguard Network Security Scanner` ([www.gfi.com/lannetscan](http://www.gfi.com/lannetscan))\
  \ 或 `QualysGuard`。这些工具能够通过扫描活动系统、确定是否存在漏洞（实际或潜在的），帮助你实现整个漏洞评估过程的自动化。这些工具花费的时间通常较长，因此当它们扫描漏洞时，你可以处理邮件或看电影。在不使用这些工具的情况下，你无法进行自动化的道德黑客攻击。\n\
  \n今天有许多软件选择。因此，你应该能够在互联网上寻找更好且完全免费的无线黑客工具。然而，如果你预算充足，可以考虑高级工具。它们在运行各自特定的测试方面表现都很好，尽管但当你准备好仔细查看你的系统漏洞时，这些免费的商业工具将证明它们的价值。当你精细地探测操作系统以及在无线网络上运行的所有应用程序时，你将获得“物超所值”。\n\
  \n## 寻找更多信息\n\n当你最终使用工具发现网络中可疑的漏洞时，你仍然可以采取许多步骤来了解更多关于漏洞的资源信息。这样做将让你对收集到的漏洞有更多了解。你开始的正确位置是你的无线供应商的网站。例如，如果你正在使用\
  \ `Windows` 操作系统并遇到了一个超出你知识范围的问题，一个很好的起点是 `Windows` 网站。在他们的网站上，你可以查看用户论坛，在那里你可以找到相关问题和解决方案。你可能足够幸运地找到可用的安全补丁。下面的数据库也可以用于获取特定漏洞及其修复方法更深层次的想法：\n\
  \n*   `NIST ICAT Metabase`（位于 [`icat.nist.gov/icat.cfm`](http://icat.nist.gov/icat.cfm))\n\
  *   `US-CERT Vulnerability Notes Database`（位于 [www.kb.cert.org/vuls](http://www.kb.cert.org/vuls))\n\
  *   `Common Vulnerabilities and Exposures`（位于 [`cve.mitre.org/cve`](http://cve.mitre.org/cve))\n\
  \n另一种你可以用来寻找更多特定漏洞问题信息的极佳方法是使用搜索引擎。建议使用 `Google` 网页和组搜索进行查询。你可能会找到解决方案以及关于你正在寻找的更多信息。\n\
  \n## 方法论 6：黑入系统\n\n这是我们列表中的最后一种方法论。你应该能够尝试之前提到的方法论。在映射你的网络后，尝试查看正在运行的系统并寻找可能的漏洞。道德黑客方法论还有一个阶段，但它是可选的。这个阶段被称为系统渗透阶段。这个阶段将真正测试你的无线网络上哪些信息和系统可以被破坏，并为你提供有关恶意黑客首要目标的信息。\n\
  \n黑入你的无线系统可以看作是获得了资源的未经授权访问并获取了信息。这时你将加入无线网络，连接到不同的系统并执行以下操作：\n\n*   浏览互联网\n*  \
  \ 登录网络\n*   更改 AP 配置设置\n*   发送和接收电子邮件\n*   编辑、复制和删除文件\n*   映射到网络驱动器\n*   使用 `AiroPeek`\
  \ 或 `Ethereal` 等嗅探器捕捉通过网络传输的数据 ([www.ethereal.com](http://www.ethereal.com))\n\n\
  我们可以说这些行为是不合道德的，但黑客们确实在这样做。所以，你自己尝试这些操作并洞察你的网络上可能发生的情况是有意义的。\n\n**实用提示：** 当你黑入或渗透你的系统时，请务必非常小心并谨慎渗透。留出时间；不要急于破坏任何东西或采取可能导致你迷失的步骤。换句话说，你想尽量减少你可能造成的任何干扰。\n\
  \n# 第四章：破解无线网络的十大最佳工具\n\n要以正确的方式完成任何工作，你需要正确的工具。以下是执行你的攻击的 10 个最佳工具：\n\n## 工具 1：笔记本电脑\n\
  \n在浏览互联网之前，你需要一个互联网数据连接。你在互联网上执行一切操作的根是一个计算机系统。没有计算机系统，你什么也做不了。对于初学者来说，你需要一台电脑来进行测试；我推荐使用笔记本电脑等便携式系统。虽然可以使用个人电脑\
  \ (`PC`) 进行破解，但与你在笔记本电脑上找到工具相比，它的工具非常有限。\n\n不同的无线网络系统有不同的规格，因此你应该使用具有多种操作能力的系统。使用可以双启动\
  \ `Windows` 和 `Linux` 的系统，或者最好是运行如 `VMware` 等虚拟机 (`VM`) 程序的 `Windows` 系统，你可以在上面安装两个不同的操作系统。大多数只能运行单个操作系统的计算机系统始终具有最低的硬件要求。\n\
  \n在规格方面，你在单个操作系统上应该寻找的至少是至少 256MB 的 `RAM`、一个 `Pentium III` 处理器以及至少 30-40 GB 的 HDD（硬盘驱动）。然而，如果你打算在系统上运行\
  \ `VMware` 或任何其他类型的虚拟机系统，你可能想在其他地方寻找更好的规格。你需要更多的 `RAM` 和更强大的硬盘。\n\n## 工具 2：无线网卡\n\
  \n获取一台规格符合你要求的笔记本电脑是第一步。现在你有一台笔记本电脑，你需要一个高效的无线 `NIC`（网络接口卡）。找到一个不仅与各种无线工具兼容，而且兼容外部天线的\
  \ `PC NIC`。这种兼容性将帮助你更有效地接收更多信号。今天的一切通常都是按级别制造的，这意味着我们可以根据预算选择设备。有些设备适用于预算较低的人，而另一些设备则是为预算较高的人设计的。今天笔记本电脑中的大多数无线\
  \ `NIC` 都是很好的通用卡，尽管你可能会限制你的测试结果。这是因为它们的无线传输范围比内置天线短。\n\n## 工具 3：天线和连接线\n\n\n\n\n\
  有不同类型的天线，它们具有不同的信号范围。例如，高增益全向或单向天线在扫描无线系统的无线电波时，会大显身威。罐式天线（cantenna）是另一种选择。购买天线时，请选择与你的无线\
  \ `NIC` 匹配的跳线连接接口。请注意，这些跳线线的长度不宜过长，应尽可能保持短。这是因为这些跳线线使用了极薄的微波同轴电缆；这些电缆在微波频率以及电缆两端的连接器处会有极高的信号损失。为了避免这种损耗，请确保你的跳线线不超过五英尺，这将帮助你避免高电缆损耗。\n\
  \n## 工具 4：GPS 接收器\n\n根据字典定义，全球定位卫星 (`GPS`) 是一种可以安装在民用车辆上作为导航辅助的音视频设备。如果你要进行步行入侵（warwalking）或开车入侵（wardriving），或者你的无线系统跨越一栋大楼，现在是考虑新维度的完美时机。在这些情况下，`GPS`\
  \ 将非常有用，因为你将能够集成无线测试工具或软件，它们可以在几米范围内精确确定无线系统的所在位置。`GPS` 是电影中间谍用来追踪目标的工具，尽管任何人都可以根据需要使用它。\n\
  \n## 工具 5：扫描软件 (Stumbling Software)\n\n扫描发现工具是黑客职业中不可或缺的，你离不开它。扫描软件将帮助你绘制出信号强度、`SSIDs`\
  \ 以及使用 `WEP` 加密的系统。你可以使用多种软件来执行此类操作，但如果你使用的是 Windows 系统，建议使用 `Network Stumbler`。你也可以使用无线\
  \ `NIC` 管理软件。你知道吗，你甚至可以使用 Windows XP 内置的管理软件进行扫描？你是可以做到的，尽管它只适用于基础扫描。\n\n## 工具 6：无线网络分析器\n\
  \n现在你已经能够成功扫描网络了。但对于黑客来说，工作并并就此结束。你需要深入探测电磁波。你可以通过使用网络分析软件来实现这一点。诸如 `AiroPeek`、`Kismet`\
  \ 和 `Ethereal` 等程序可以帮助你分析和监控无线信道中使用的协议。这些工具还可以帮助你搜索无线系统的异常。它们最棒的一点是，甚至可以直接从空气中捕获无线数据。\n\
  \n## 工具 7：端口扫描器\n\n像专业人士一样攻击无线网络时，端口扫描也是一个需要完成的关键步骤。最好使用的工具是 `nmap` 或 `SuperScan`。它们被认为是扫描你发现的无线系统的极佳工具，帮助发现更多关于运行情况的深层信息。此外，它们非常有用，因为它们可以帮助你发现网络中可能存在漏洞的地方。\n\
  \n## 工具 8：漏洞评估工具\n\n进一步探测网络以查看网络中仍然存在的漏洞是另一个极好的步骤。执行此任务的最佳工具是 `Languard Network\
  \ Security Scanner`、`Nessus` 或 `QualysGuard`。当使用其中一种工具运行扫描并获得结果显示网络中哪些地方仍然存在漏洞时，你获得的信息也可以作为一种保护形式，揭示黑客可能从何利用你的网络。\n\
  \n## 工具 9：谷歌\n\n你可以去 Google 并对之前提到的工具进行快速搜索，这将提供更有趣的搜索。你可以使用 Google 搜索 `Network\
  \ Stumbler` 和 `NSI` 文件，深入研究你的 AP 内置的 Web 服务器软件，研究特定的漏洞，寻找最新的无线安全工具并学习新的黑客技巧。\n\n\
  ## 工具 10：802.11 参考指南/书籍\n\n你不会记住读过的所有内容。即使是专家也需要继续学习。因此，当你对无线网络进行伦理攻击时，你需要一本关于 `IEEE\
  \ 802.11` 标准的良好参考书或指南。该标准非常复杂并随着时间演变，这意味着你需要继续阅读有关最新趋势的内容。你可能需要查找有关频率范围、特定数据包的作用及其用途的信息。也许，你还需要学习更多关于特定的默认\
  \ `802.11` 设置。\n\n# 第五章：破解加密\n\n### 章节目标：\n\n- 理解加密\n- 加密帧\n- WEP 问题\n- 升级到 WPA\n\
  - AES 加密概念\n- 使用 VPN 隧道化互联网\n\n大多数人认为，当信息被加密时，它是不可破解且安全的，但事实并非如此。随着技术的不断进步，新的加密安全特性可能并不如你想象的那样稳健。你知道加密特性可能存在缺陷吗？你可能为正确的任务使用了错误的算法、过短的密钥、有缺陷的算法，甚至发生了安全漏洞。在本章中，我们将讨论这些缺陷中的一个或全部如何影响你的无线网络。本章将讨论你用于加强访问点安全所需的技巧。\n\
  \n**实用提示：** 建议将内置的安全特性作为你重要的整体防御机制。\n\n## 会发生什么\n\n`IEEE 802.11` 标准的特性之一是无线网络必须维护安全的工作环境。一个主要特性是采用加密来提供以下功能：\n\
  \n- **消息隐私**：加密的趣味在于，你可以确保你的加密敏感信息在两个无线实体之间传输时是安全的。这是因为它可以防止第三方追踪你的数据。因此，你的隐私在某种种程度上得到了保障。\n\
  - **消息完整性**：实体可以帮助发送者和接收方知道有人更改或访问了正在发送的消息。\n\n就像任何其他技术一样，它也会有一些缺点。尽管 `802.11` 标准试图解决完整性和隐私问题，但仍有一些问题未能完全到位。以下是对这些特性及其缺点的讨论。\n\
  \n## 保护消息隐私\n\n在不考虑安全级别的情况下设计系统是不可能的；你不希望你的系统容易受到攻击。`IEEE 802.11` 试图通过使用加密程序来支持有自己隐私的用户，这些程序处理无线用户接口。当这些技术引入时，第一个且最广泛使用的算法被称为“有线等隐私”（wired\
  \ equivalent privacy）。`WEP` 在之前的章节中讨论过，它是确保隐私的首批算法之一。\n\n有线等隐私使用 `RC4` 对称密钥，该密钥被集成到流加密系统中产生伪随机数据结构。`WEP`\
  \ 密钥流有一个简单的函数，通过模 2 计算加到正在传输的数据中。可能会说：“哇，`WEP` 非常安全。”实际上，其实并不安全。不幸的是，它所有的属性加起来并没有产生非常令人印象深刻的安全。\n\
  \n这是一个简单的算法——加密越长，越难破解。`WEP` 有些过时了，因为它只支持 `802.11` 标准中定义的 40 位共享密钥长度。然而，市场上的大多数供应商都提供\
  \ `WEP` 的非标准扩展，支持从 40 位到约 104 位的密钥长度。需要注意的是，`WEP` 在加密帧之前使用 `IV`（初始化向量）来作为算法的种子。\n\
  \n\n\n\n无线黑客行业众所周知，密钥长度的增加会增强加密技术的安全性。因此，如果你在实现或设计上存在缺陷，它可能会导致你无法使用长密钥。\n\n根据研究，可以得出结论：对于流畅且健壮的设计和实现，超过\
  \ `80 bits` 的密钥会让暴力破解密码分析成为一项几乎不可能完成的任务。然而，大多数 `802.11 WLAN` 密钥依赖于简短的密钥，即 `40 bits`。但是，没有哪个计算机是完全安全的。在最近的攻击中，显示\
  \ `WEP`隐私方法对某些攻击非常脆弱。无论密钥大小如何，这些攻击都成功了。\n\n# 保护消息完整性\n\n与拿起手机给朋友打电话或分享敏感信息不同是不安全的，因为第三方可以破解你的通信。加密消息防止了你对发送的消息拥有完全的灵活性，但由于你可以确保你的信息是\
  \ 100% 安全的。加密的基本安全任务是确保你的消息完整地送达接收者。`IEEE 802.11` 规范在这方面提供了良好的安全性，它概述了一种名为 `CRC`（`循环冗余校验`）的简单检查。该检查的目的是确保你的消息具有数据完整性，使客户端与接入点（access\
  \ points）之间传输的消息更加安全。\n\n这项安全服务是为了拒绝任何人可能在传输过程中更改的任何。这项服务并不意味着你可以简单地登录网络，向客户端编写消息并假设它是完全安全的。这还需要更多。接入点和客户端在传输之前，会为每一帧计算一个名为\
  \ `ICV`（`完整性检查值`）的 `CRC-32` 帧校验序列。加密并不是你可以直接发送给朋友并用纯英文或中文阅读的消息。（你可以称其为技术术语。）对于一个碰巧读到加密消息的门外汉来说，它实际上没有任何意义。\n\
  \n尽管消息经过了加密，接收者也必须有一种方法以人类可读的语言读取并理解它。读取加密数据或信息的过程被称为解密。为了确认正在传输的消息未被更改，接收者需要解密该帧，然后对消息重新计算\
  \ `CRC`。解密后，接收者将把计算出的 `CRC` 与原始消息进行比较。在此过程中，如果接收者发现 `CRCs` 不相等，就可以推断出发生了错误。此时，接收者将不得不丢弃该帧，因为它已经被破解了。\n\
  \n这是一个好主意。如果你认为这种信息加密形式是最好的，请重新考虑一下。这个主意的实现非常糟糕，因为可以使用数据翻转位，而这些位仍然可以通过 `CRC` 检查。\n\
  \n**结论：修改消息是可能的。**\n\n尽管 `CRC` 加密拥有所有优点，人们可能会认为它是一个顶级安全特性。然而，通过 `CRC` 发送的消息是可以被修改的，这使得\
  \ `CRC-32` 不足以防御蓄意的数据完整性攻击。因此，你需要更多真实的加密机制，例如消息摘要或 `MAC`（`消息认证码`）来防止蓄意攻击。想象一下尝试黑入像\
  \ `Facebook` 这样的公司的网络，而你唯一的工具是 `Internet Explorer`。这还有意义吗？记住，你需要为正确的工作使用正确的工具。使用非加密机制将有助于对密码学的攻击。其原因之一是使用了\
  \ `64` 或 `128` 密钥来保护隐私和完整性。因此，这是密码学中的大忌。\n\n# 使用加密\n\n博客、媒体和其他在线文章已经做了很多工作，阻碍个人和组织使用无线网络。如果你一直关注技术博客，你将会看到很多关于无线网络安全的负面文章。负面情绪集中在那些处理加密的人身上。然而，并不是每个在互联网上发布的人都理解他们发布的内容；有些人只是复制粘贴，而另一些则是付费发布的。研究显示，大多数发布关于无线安全负面文章的人并不十分了解\
  \ `WEP` 的基础。通过 `WEP`（`有线等效隐私`）这个名称，开发者意图给用户提供与有线网络相同水平的安全性。然而，坦率地说，这种水平并没有提供多少安全性。在排除全交换环境的情况下，监听者可以在帧穿过有线网络时随心所欲地处理并甚至篡改未加密的数据。`WEP`\
  \ 的实现和设计实际上从未打算提供任何形式的消息完整性或机密性。\n\n在 `WEP` 的设计中，结合了对称的 `RC4 算法`（`RC4`）和`伪随机数生成器`（`PRNG`）。`WEP`\
  \ 的初始实现使用一种标准，规定了 `40` 和 `128-bit` 密钥长度以及 `24-bit IV`（`初始化向量`）。它遇到的问题之一是对网络层的覆盖不完全：`WEP`\
  \ 加密第 `3` 到 `7` 层，尽管它不加密 `MAC` 层（第 `2` 层）。记得 `WEP` 使用的是对称算法；这就是为什么 `WEP` 给客户端提供密钥和其他任何必要的配置数据。\n\
  \n`RC4` 配置通常并不坏，因为它被大多数网络浏览器用于其 `SSL`（`安全套接层`）。然而，它在 `WEP` 实现中产生的问题以及它所营造的负面安全感并不好。然而，这在\
  \ `WEP` 中具体是如何工作的？\n\n它使用的简单算法工作原理是：它获取初始化向量，该向量最初是明文（人类可读）形式。在以 `IV` 形式获取后，它将其附加在密钥的前的前。（解密器实际上知道这一点。）操作完成后，`WEP`\
  \ 将获取结果并将其接入 `RC4` 以重新生成一个新的密钥流。然后算法将将密钥流与名为 `CipherText` 的内置工具进行 `XOR`（异或）。这将带给我们明文值。最后，`WEP`\
  \ 对传输的消息重新执行 `CRC-32` 校验，以确保它与加密明文上的完整性检查值完全匹配。如果校验和不匹配怎么办？`WEP` 会立即假设某处的其他人破解了正在发送的数据包，并自动将其丢弃。\n\
  \n之前提到了接入点。接入点通常只有三个可用的加密设置。这些是：\n\n-   无（None）：名字看起来简单，但这些接入点加密设置恰恰是所有设置中最危险的。原因是正在传输的数据可以很容易被他人拦截，他们可以读取甚至更改在网络传输的未加密数据。在使用这些设置时你必须小心。\n\
  -   40 位共享密钥（40-Bit Shared Key）：位数的增加实际上并没有说它有自己的负面影响。此设置会加密网络通信数据，但仍然可能被破解；它只是比第一种设置安全一点。然而，从好的一方面来说，这种\
  \ 40 位加密以前通过在高端显卡计算机上启动的暴力破解攻击破解过。需要注意的是，在低端计算机上也可能破解密钥。最终，40 位共享密钥的价值存疑。在本书的后续部分，我们将讨论你可以用来恢复\
  \ 40 位密钥的工具。然而，如果如果你能够恢复此类密钥，其他黑客也可以实现相同的目标。\n\n\n\n\n# 104 位设置\n\n加密密钥的数量越多，其他黑客破解它们的难度就越大。此设置被认为比\
  \ 40 位加密更可靠、更安全，至少更具安全性，因为从密码密钥空间的大小来看，它具有更显著的差异。它有时也被称为 128 位设置。然而，由于在初始化向量（initialization\
  \ vectors）的使用上加密设计不佳，这对于 802.11 WEP 并非完全如此。推荐将其作为一种良好的做法，仅仅是因为因为它仍然更安全。当你从任何供应商处购买任何物品时，请务必保持警惕。检查软件和固件的更新。你可能会幸运地发现一些能够解决某些\
  \ WEP 问题的更新。\n\n如果你足够幸运，你会发现一些支持 152 位密钥的供应商，但这仅是一个例子。通常认为 40 位密钥不足以满足常规系统的加密需求。为了让你对自己的安全有信心，你至少应该寻找\
  \ 80 位密钥。研究表明，位长于 80 位的加密密钥实际上效果更好。密钥越长，第三方通过暴力攻击破解你访问点的概率就越小。简而言之，此设置被认为更安全，所以尽管使用它吧。\n\
  \n## WEP 弱点\n\n所有计算机无线网络都有漏洞。研究人员检查了使用 WEP 的 WLAN 的安全问题，并记录了恶意黑客实施的攻击。这些问题如下：\n\n\
  *   **被动攻击 (Passive attacks)**：基于此级别的问题用于解密流量的统计分析问题。\n*   **主动攻击 (Active attacks)**：这类攻击通过欺骗\
  \ AP（访问点）来解密流量。\n*   **用于从授权移动站注入新流量的主动攻击**：这些攻击涉及已知明文。\n*   **字典攻击 (Dictionary\
  \ attacks)**：这些是在对非常繁忙的网络或服务器分析了足够的流量后进行的攻击。\n\n让一个懒惰的保镖守卫房子显然比没人守卫要好。WEP 面临的最大问题之一，是安装者从初就未能让它正常运行。安全性不够也比没有没有要好。\n\
  \n不要忘记，即使你的汽车也需要定期维护以防发生故障。关键在于确保你定期更换 WEP 密钥。否则，考虑一下不定期维护的汽车例子——它很容易发生故障。如果你的无线网络中有太多用户长时间共享几乎相同的密钥，这将导致你的系统变得更加脆弱。如果你不经常更换密钥，其他黑客可以轻松捕获破解你密钥所需的所有帧。\n\
  \n然而，我们不能将不定期更换密钥的责任全部归于 AP 管理员。由于是 WEP 协议本身不提供任何类型的密钥管理机制。这种情况是极其危险的。例如，你组织中的某人丢失了他的/她的笔记本电脑；密码可能会泄露。这不仅仅是一个坏消息；使用相同密码的其他计算机也可能被泄露。\n\
  \n世界上并不是所有人都能富有原因的：如果每个人都是富有的，钱就不再有价值。这里的逻辑是共享密钥可能会危及你的无线网络。随着共享你密钥的用户数量增加，你的无线网络面临风险的机会也随之增加。加密有一个简单的原则，即“特定计算机的安全性通常取决于密钥的私密性”。一旦你暴露了密钥，你就暴露了文本。一旦你分享或暴露了密钥，你就给了破解者解密它的权限。此外，如果大多数站共享完全相同的密钥，你可以确定你已经让窃听者获得了控制你大量流量进行分析攻击的权限。\n\
  \n### 有用提示：\n\n1.  保持你的密钥私密。\n2.  不要与你不信任的任何人共享密钥。\n3.  定期更换你的密钥。\n4.  始终对你的安全文件备份。\n\
  5.  为你的访问点加密使用更长的密钥。\n\n## 攻击 WEP\n\n攻击 WEP 可能简单到外行都能做，但我们已经为你研究了轻松实现这一目标的最佳方法。有几种被动和主动的方法可以攻击\
  \ WEP。它们是：\n\n*   主动攻击用于根据已知明文注入流量。\n*   主动攻击通过欺骗访问点来解密流量。\n*   字典攻击在收集到足够的流量后进行。\n\
  *   被动攻击通过统计分析来解密流量。\n\n以下是对这些攻击的更详细描述。\n\n### 1. 主动流量注入 (ACTIVE TRAFFIC INJECTION)\n\
  \n假设恶意黑客知道你在使用被动技术加密特定消息时使用的明文版本。关于已知明文版本的坏消息是，他或她可以使用这些信息在你的网络上构建新的且加密正确的数据包。构建完成后，你应该预期他或她会将这些数据包插入你的网络中。然而，为了让黑客实现这一点，他或她将通过计算\
  \ `CRC-32` 值并对原始消息的加密形式进行某种位翻转来构建新消息。在实现这一点后，攻击者可以在完全不被发现的情况下将数据包发送到访问点。好消息是，有几种技术的变体可以让你避免此类攻击。\n\
  \n*   **AirePlay**：这是一个你必须拥有的有趣工具。该程序允许你获取任何捕获的数据包并重新注入你的网络。\n*   **WEPWedgie**：你也可以使用此工具注入帧，但它略有不同。`WEPWedgie`\
  \ 工具箱可确定 `802.11` WEP 密钥流，并使用已知的密钥流注入流量。（在 `http://sourceforge.net/projects/wepwedgie`\
  \ 下载工具箱。）\n\n### 2. 双侧的主动攻击 (ACTIVE ATTACK FROM BOTH SIDES)\n\n这是在前一节中提到的主动注入技术的扩展。攻击者在这一节中的角色很简单；黑客对数据包头的内容进行随机猜测，而不是数据包负载。上一节中提到了位翻转，但我们没有解释它的实际作用。位翻转可以转换目标地址，然后将流量路由到可以进行传输的危险设备。通过采用有根据的猜测，攻击者具备获取你的端口信息的能力，并通过将其更改为网络流量的默认端口（即端口\
  \ `80`）来通过防火墙。\n\n### 3. 基于表的攻击 (TABLE-BASED ATTACK)\n\n加密表的建立基于一种高可能性：即关于 WEP 初始化向量\
  \ (`IVs`) 的某些信息会在短间隔内重复使用。通过使用被动技术，黑客可以获得一些明文信息。当黑客最终获得这些信息时，他或她就可以计算初始化向量使用的 `RC4`\
  \ 密钥流。研究表明，重复技术通常允许攻击者基于所有可能的 `IVs` 构建一个完整的解密表。坏消息是，这让黑客在解密每一个传输的数据包时处于优势。\n\n###\
  \ 4. 被动攻击解密 (PASSIVE ATTACK DECRYPTION)\n\n\n\n\n如果你正在寻找“入侵”的定义，那么这就是它。攻击者不仅攻击你的网络，还会进行深度渗透。攻击者躲在一个角落监控你的流量，直到发生初始化向量（IV）碰撞。什么是碰撞？这是算法重复使用初始化向量的状态。然而，在碰撞过程中，你的密钥是不安全的。这是因为当碰撞发生时，共享密钥和重复的初始化向量将导致一个之前使用过的密钥流。此外，当算法发送信息时，它会以密文的形式发送。这时，跟踪所有进出流量的黑客就能识别出碰撞何时发生。当这种情况发生时，黑客就能利用产生的\
  \ XOR 信息来注入关于消息内容的数据。\n\n自然地，IP 流量具有大量的冗余性。因此，该过程的重复可以很容易产生足够解密加密消息的信息。\n\n## 破解密钥\n\
  \n任何使用算法的东西都可以被破解；这取决于你的破解技巧有多灵活。到本书为止，我们已经广泛地讨论了 WEP 及其漏洞。有线等效协议（WEP）只是一种通常用于保护无线网络免受简单攻击的算法。遗憾的是，这项安全特性有很多安全漏洞，使得\
  \ WEP 极易受到破解攻击。在某人破解 WEP 密钥之前，需要以下内容：\n\n- 大量的捕获帧（frames）。\n- 一个可以处理所捕获帧的程序。\n\n\
  互联网上有许多工具可以破解 WEP 密钥；有些是免费的，有些是付费的。目前，我们将重点关注 `WEPcrack` 和 `AirSnort` 等工具来破解密钥，尽管你可以使用任何完成任务的工具。你可以使用像\
  \ `Kismet` 这样的程序，它可以保存弱初始化向量（IVs）并输入到另一个如 `WEPcrack` 的破解程序中。\n\n### 使用 WEPCRACK\n\
  \n该工具被认为是破解 WEP 密钥最著名的工具之一。`WEPcrack`（下载地址：http://sourceforge.net/projects/wepcrack）是最公开\
  \ WEP 破解工具。这个神奇的工具可以捕捉日志并破解 IV 以提供重要的密钥。然而，在运行 `WEPcrack` 之前，你需要一些 `PERL` 和数据包。\n\
  \n该工具的开发者编写代码使其可以在任何有 `PERL` 解释器的地方使用。此外，对于 UNIX 平台用户来说，这个要求很容易满足。若想在 UNIX 中运行 `WEPcrack`，只需运行命令\
  \ `wizard`，输入代码 `per1/tmp/WEPcrack.pl`。然而，如果你的安装位置不同，只需将 `per1` 更改为安装 `WEPcrack`\
  \ 脚本的文件夹名称。微软不提供 `PERL`。这对于 Windows 用户来说可能是震惊的，因为使用 `WEPcrack` 将不会那么简单。然而，Windows\
  \ 用户的最佳替代方案是一个名为 `Cygwin` 的工具。你可以在网上获取它，或者你可以为你的 Windows 操作系统获取一个 `PERL` 解释器，例如名为\
  \ `ActivePerl` 的工具。\n\n假设你正在 Windows 操作系统上，并决定获取并安装 `ActivePerl`。你可以在 [www.activestate.com/Products/ActivePerl](http://www.activestate.com/Products/ActivePerl)\
  \ 下载它。通过 `ActivePerl`，你可以在 Windows 平台上实现与 UNIX 用户相同的目标。要安装此工具并使用它运行 `WEPcrack`，请按照以下步骤操作：\n\
  \n1. 使用上述链接从 ActiveState 网站下载该工具。\n2. 启动 `ActivePerl` 安装程序。\n3. 屏幕上将出现许可协议。阅读它，然后点击\
  \ `Next` 接受。\n4. 屏幕上将出现一个新窗口，询问你想将 `ActivePerl` 安装在哪里。选择位置；然后点击 `Next`。\n5. 上述步骤\
  \ (IV) 是可选的；如果你不想让它安装在根目录下，可以选择安装在自定义目录中。要安装在自定义目录中，点击 `Browse` 按钮，然后浏览硬盘上的目录树直到直到你想要安装的位置。\n\
  6. 弹出的新窗口将是 `PPM New Features` 窗口。你可以通过点击 `enable PPM3` 允许其将你的个人资料发送到 ASPN，或者直接点击\
  \ `Next` 并忽略。\n7. 根据你的选择，任何你认为你不会使用的选项都可以通过点击 `Next` 来忽略。\n8. 在此处，点击 `Install` 按钮在你的\
  \ Windows 上安装 `ActivePerl`。\n9. 步骤 (VII) 可能需要一些时间才能完成。它将为你提供一个安装状态窗口，你可以在其中看到安装进度。过程完成后，你就可以使用\
  \ `PERL` 了。\n10. 从开始菜单中选择 `Run`。\n11. 在对话框中输入命令并点击 `OK`。\n12. 按 `Win+R` 启动命令提示符；然后在对话框中输入\
  \ `cmd` 并按键盘上的回车。当命令提示符打开时，输入 `perl\\progra~1\\wepcrack\\pcapgetIV.pl`。\n13. 步骤\
  \ (X) 中的路径是工具应安装和所在的默认根目录。如果你在安装过程中使用了自定义目录，请确保编辑命令中的目录，使其能够正常工作。然而，我们在这里显示的 Perl\
  \ 程序只是一个示例。脚本本身是没用的，因为为了让它正常运行，你需要一个从另一个程序丢入的捕获包，例如 `prismdump` 或 `ethereal`。需要大量的帧（例如\
  \ 500 万帧）。之后，你就可以继续下一步。\n14. 通过输入 `perl\\progra~1\\wepcrack\\wepcrack.pl ivfile.log`\
  \ 启动 `WEPcrack` 软件。\n15. 完成后，你可以点击右上角的 `X` 关闭窗口。\n16. 注意，密钥始终是十进制格式。因此，在成功使用它之前，你仍然需要将十进制转换为十六进制格式。\n\
  \n### 使用 AIRSNORT\n\n这是另一个用于破解 WEP 密钥的神奇被动扫描工具。该工具的工作方式非常简单有趣。它收集弱 IV 并开始破解 WEP\
  \ 密钥。密钥中可能存在的总初始化向量的最接近值是 1600 万。在这 1600 万个初始化向量中，大约有 9000 个极其弱的 128 位密钥。`AirSnort`\
  \ 随后将扫描所有 1600 万个密钥并寻找弱密钥。Shmoo Group 的成员估计了确定 WEP 密钥所需的弱 IV 数量，并得出大约需要 2000 个弱初始化向量的结论。\n\
  \n可以在 [`sourceforge.net/projects/airsnort/`](http://sourceforge.net/projects/airsnort/)\
  \ 下载 `AirSnort`。\n\n`AirSnort` 在 UNIX 平台上运行良好。也可以在 Windows 上使用。要在 Windows 上运行 `AirSnort`，你需要在\
  \ [www.nwp.nevillon.org/attack.html/](http://www.nwp.nevillon.org/attack.html/)\
  \ 下载 `WinAirSnort`。\n\n你也可以在 Linux 上使用此工具。按照以下步骤在 Linux 上安装 `AirSnort`：\n\n1. 下载文件并解压缩。要在\
  \ Linux 上解压缩它，请使用以下命令：\n```bash\ngunzip airsnort-0.2.7e.tar.gz\n```\n2. 此时，你必须对文件进行\
  \ Untar 操作。要实现此，请使用以下命令：\n```bash\ntar -xvf airsnort-0.2.7e.tar\n```\n3. 在解压文件过程中，切换到你使用的目录。你可以通过以下命令实现：\n\
  ```bash\ncd airsnort-0.2.7e\n```\n4. 编译并安装 `AirSnort`。\n5. 不要忘记 Linux 平台之间存在差异。大多数平台需要不同的命令来运行。在编译过程中，`AirSnort`\
  \ 的二进制文件将被放置在 `/user/local/bin` 目录。但此命令会因你的平台不同而变化。如果该命令对你的 Linux 平台不起，请尝试以下之一：\n\
  ```bash\nairsnort-0.2.7e# make\n```\n\n\n\n\n```bash\n/airsnort-0.2.7e# ./autogen.sh\n\
  ```\n\n```bash\n/airsnort-0.2.7e# make install\n```\n\n6 安装完成后，如需运行 AirSnort 软件，请打开终端窗口并输入以下命令：\n\
  \n```bash\n/airsnort-0.2.7e# airsnort\n```\n\n7 要选择通道，请使用向上和向下方向键选择你想要扫描的通道。\n\n\
  8 请记住，你可以使用 `Kismet` 来扫描你的无线网络。最好情况下，你可以使用任何你选择的工具。如果你使用 `Kismet` 扫描你的无线网络以识别通道，可以推断你已经知道想要监控的通道。然而，如果你想监控所有通道，请点击\
  \ `Scan`（扫描）按钮。\n\n9 从网络设备下拉列表中选择你的网络设备。\n\n10 你将手动选择想要使用的网络设备。所选的设备将是你想要监控的设备。例如，选择\
  \ `eth0`。`AirSnort` 不会自动将网卡置于监控模式，而是会手动进行操作。\n\n11 要手动选择你的网卡，请点击 `Card Type`（卡类型）下拉列表。然后选择你喜欢的无线网络接口卡（NIC）。\n\
  \n12 例如，选择 `ORiNOCO`。\n\n13 你可以控制破解密钥的时间。例如，如果你想缩短破解密钥的时间，可以增加 40 位或 128 位的破解宽度（crack\
  \ breadth）。\n\n14 注意，增加破解宽度将增加 `AirSnort` 尝试破解 WEP 密钥时可以检查的密钥可能数量。\n\n15 点击底部栏左下侧的\
  \ `start`（启动）按钮开始破解过程。\n\n16 当进程开始时，`AirSnort` 将开始为你显示敏感的 SSID，并最终为你破解密钥。\n\n###\
  \ 使用 AIRCRACK\n\nChristophe Devine 开发了这款 WEP 破解工具。你可以在 [www.cr0.net:8040/code/network](http://www.cr0.net:8040/code/network)\
  \ 下载它。`Aircrack` 设计设计用于在 Linux 和 Windows 两个操作系统上有效运行。为了本教程，我们将更多地关注专门为 Windows 操作系统设计的\
  \ `Aircrack` 版本。\n\n`Aircrack` 被认为是攻击 WEP 的最快手段之一。它实现了 `KoreK` 的攻击以及改进后的 `Fluhrer-Mantin-Shamir\
  \ (FMS)`。要使用 `Aircrack` 执行有效的破解，你需要做的就是从 WEP 加密的无线网络中尽可能收集数据包。`Aircrack` 使用数据包来执行其破解。按照以下步骤使用\
  \ `Aircrack`：\n\n1. 访问上述网站下载 `Aircrack` 软件 `aircrack-2.1.zip`。成功下载后，使用解压缩工具解压 `Aircrack`\
  \ 文件。你可以使用 `Winrar` 解压。解压压缩文件后，在内部文件列表中，你现在应该会在 `win32` 子目录下看到一个名为 `airodump` 的文件。这个\
  \ `airodump` 程序就是数据包捕工具。\n\n2. 要开始数据包捕捉，只需双击 `airodump` 图标。将弹出一个新窗口，显示已知无线接口列表。选择它并按下\
  \ `enter` 键来使用。另一个新窗口将再次弹出。在新窗口中，选择你的接口并按下 `enter` 键。例如，要选择 `Orinoco/Realtek` 接口，选择\
  \ `o`；如果你想选择 `Aironet/Atheros` 接口，选择 `a`。\n\n3. 现在输入你想扫描的通道，然后按下 `enter` 键。如果你刚好知道想要漫游（wardrive）的通道号，请手动输入该数字。如果你不知道通道号，请输入零\
  \ (`0`) 并扫描所有可用通道。\n\n4. 为输出文件指定一个名称并按下 `enter` 键。确保你输入了一个这里合理的名称。你还应该确保为你将使用的名称包含日期和时间。\n\
  \n5. 你将拥有许多与可用通道成比例的 MAC 地址选项。如果你想过滤特定的 MAC 地址，请手动输入。如果不是，只需输入代表“无”（none）的字母 `p`。然后按下\
  \ `enter` 键。\n\n6. 当 `Airodump` 开始捕捉帧时进行预期并观察。随着操作的进行，将会出现新窗口。从新窗口中，你可以看到 `Airodump`\
  \ 在积累初始向量（IV）时的进度和状态。\n\n7. 双击 `Aircrack` 图标。\n\n8. `Aircrack` 的另一个很人的特性是可以在几秒内确定\
  \ WEP 密钥，尽管执行时间有所不同。John 花了很多天才才破解了一个活动较少且使用 40 位密钥的 WEP。注意，更短的执行时间需要更多的流量、更多的运气、更多的初始化向量以及最低的成功修正因子（fudge\
  \ factor）。该因子是一个设置，告诉 `Aircrack` 在尝试新密钥时应该进行多疯狂、多深层的猜测。`Aircrack` 的设计使得 `fudge factor`\
  \ 越高，猜测的密钥就越多。\n\n\n\n\n\n回想 WEP 是一种对称算法，在加密和解密时使用相同的密钥。发送者和接收方必须拥有相同的密钥才能确保操作顺利。此外，如果他们必须共享密钥，就必须有一种安全交换这些共享密钥的方法。这种共享需要以这种方式进行以防止他人的入侵。\n\
  \n`802.11` 标准中关于密钥管理的细节并不多。事实上，密钥管理是加密系统最关键的方面。显然，根据 802.11 系统，密钥管理被遗留给了用户。密钥管理是\
  \ WLAN 环境容易受到许多漏洞的原因之一。它还导致密钥分发问题悬而未决。外行人如何做才能确保密钥交换的安全呢？如果不正确理解如何安全地交换密钥，将无法正确使用受\
  \ WEP 保护的 WLAN。\n\n当一个组织意识到需要频繁更改密码并使其随机化时，他们希望立即实施更改。然而，在大型 WLAN 环境中，这种任务并不容易。可能会有\
  \ 4,000 台工作站需要更改，这会非常累人。这 4,000 台工作站中的每一台必须共享相同的秘密密钥——而且每台工作站的所有者必须对密钥保密。对于像这样的大型环境，生成、加载、分发和管理密钥面临着巨大的挑战。如果黑客破解了一个客户端，他或也将获得所有其他工作站的密钥。\n\
  \n# 使用 WPA\n\n802.11 标准的另一个版本是 `802.11i`。标准末尾的“i”表示比之前的版本更高。IEEE `802.11i` 定义了健壮安全网络，通常被称为\
  \ `RSN`。任何可以运行此标准的接入点将只允许具备 RSN 能力的设备与其连接。将 RSN 视为一个随着技术进步而演进的环境，因为它提供了网络所需的安全特性或服务。\n\
  \n然而，通过使用 RSN 实现的 IEEE `802.11i` 标准并不意味着它是完全完美的。只有时间才能证明该标准是否存在缺陷。然而，`802.11i` 的特性将在本节中提到，在我们之后讨论\
  \ AES 加密时也会提到。并不是每个喜欢硬件和这个 802.11i 标准的人都愿意接受硬件的注入。每个人都需要改进的安全性，而该功能中硬件的使用可能会是一个问题。这就是\
  \ WPA 出现的地方。\n\n将 WPA 视为一种改进 WLAN 解决方案的方案。用通俗的话说，Wi-Fi 访问（WPA）是一项改进 WLAN 安全性的计划，最重要的是解决了\
  \ WEP 的问题。WPA 使用了一种名为 `TKIP`（临时密钥完整性协议）的特性，它可以在不需要调整硬件的情况下解决问题。简而言，WPA 通过修改软件和固件驱动程序来解决问题。此外，`TKIP`\
  \ 本身是 RSN 的一部分，这提供了灵活性。\n\nWPA 被认为是固件或软件补丁的合适示例，因为它不直接处理硬件。作为过渡安全解决方案，Wi-Fi 保护访问不需要对现有的\
  \ 802.11 设备进行硬件升级。然而，IEEE `802.11i` 标准确实需要升级。没有什么完美的，这就是为什么我们可以说在安全特性方面 WPA 是最好的。无论如何，WPA\
  \ 仍然是一个很好的选择，因为其尝试提供针对长期 WEP 问题的增强保护，而这些问题在 802.11i 安全特性出现之前就已经存在了。WPA 有两个关键特性：\n\
  \n* `802.1X` 支持。\n* `TKIP`（临时密钥完整性协议）。\n\nWPA 使用 `802.1X` 端口访问控制按分段分发密钥。此最大的优势是它提供了一个允许使用健壮的上层认证协议的框架。\n\
  \n与提供分段密钥分发功能的 `802.1X` 不同，`TKIP` 提供的更多。临时密钥完整性协议允许密钥混合，并还给你一个更长的 `IV`（初始化向量）。然而，并非于此。`TKIP`\
  \ 还为你提供了消息完整性检查，被称为 `MIC`。你知道当你在无线网络上传输数据时，你的传输数据有被窃听的机会吗？`MIC` 的出现解决了这个问题，因为它防止了无线数据在传输过程中被修改。此外，这些特性为无线网络安全提供了额外的支持，包括：\n\
  \n* 密钥管理。\n* `IV` 空间的扩展。\n* 促进。加密密钥应该频繁更改。然而，`TKIP` 帮助你促进会话密钥的使用。\n* 四种帮助你增强 802.11\
  \ 安全性的新算法。\n* 密钥分发和派生。\n* 包密钥构建。\n* 所有这些属性也意味着它提供了整体的加密完整性。\n\n说临时密钥完整性协议防御了前面提到的的许多安全攻击是准确的。某些攻击包括重放攻击或对数据完整性的攻击。最重要的是，`TKIP`\
  \ 帮助你频繁更改密钥，这是一个极大的属性。WPA 的最初目标是向市场引入一种基于标准的安全解决方案以取代 WEP，直到 IEEE 802.11i `RSNs`（基于对现有\
  \ WLAN 标准的修订）可用。需要注意的是，RSN 包含了用于完整性和机密性的 `AES` 加密。\n\nWPA 本身远非完美，因为它也有自己的问题。黑客可能会破解基于字典中单词的短密码语组成的\
  \ Wi-Fi 保护访问预共享密钥。基于字典的密钥很容易破解，因为黑客可以监控只需要几秒钟即可完成的短交易。黑客可以看到打字速度和输入字符串的长度。\n\n其他安全手段具有防止它们被轻易攻击的工具。WPA\
  \ 也有自己用于破解密钥的软件/工具。你可以使用名为“WPA Cracker”的工具（在 `www.tinypeap.com/page8.html` 下载）。该工具在某种意义是原始的，因为它要求你输入通过嗅探器检索到的准确信息。为了学习，建议使用\
  \ ethereal 作为你的嗅探工具。\n\n在使用 WPA 时，你可以通过遵循这些指南来保护自己：\n\n* 确保你选择了一个良好的密码。不要使用字典中可以找到的单词组成的密码。\n\
  * 确保你的密码至少由 20 个字符组成。你也可以借此避免暴力攻击。\n* 随机选择你的密码。\n* 确保你使用 WPA 企业版——或者更好，配合 WPA 使用\
  \ `802.1X`。\n* 确保你使用 `VPN`（虚拟专用网络）技术。\n\nWPA、RSN 和 `TKIP` 是非常复杂的话，这些领域仍在进行许多研究。如果需要，你可以在网上找到更多信息。\n\
  \n# 组织加密攻击应对措施\n\n安全不仅适用于家庭，因为组织也无法免疫攻击。这就是为什么组织应该在可行的情况下采用家庭网络提供的策略。无论你采用哪种策略，都应该用以下措施之一进行补充：\n\
  \n* `WPA2` 技术\n* `VPN` 技术\n\n## 使用 WPA2\n\n\n\n\n\n这是对之前 WPA 的升级，正如“WPA2”末尾的“2”所示。然而，无论某些工具如何升级，某些事情将始终保持不变。例如，如果你在使用旧版本的“WhatsApp”，新版本不会停止向你联系列表中的人员发送消息。WPA2\
  \ 仍然基于 `RC4` 算法，这是一种流加密算法。另一方面，RSN 的主要组件是使用 `AES`（高级加密标准）加密来确保数据的完整性和机密性。随着技术市场的日益发展，你可以找到名为\
  \ `AES WRAP`（无线稳健身份验证协议）的产品。然而，该 `AES WRAP` 的最终规范需要 `AES-CCMP` 算法，其全称为计数模式密码块链接\
  \ MAC 协议。\n\n如 `802.11i` 标准所示，WPA2 帮助你增强消息完整性并保护消息隐私。此外，它还能防止重放攻击和不可抵赖。\n\n`802.11i`\
  \ 规范在数据层面上为你提供基于 `AES` 的加密服务。这些服务根据 `FIPS 140-2`（联邦标准）进行了验证。这是因为高级加密标准能够缓解你可能对主动无线攻击或无线窃听产生的大多数担忧。如果你在数据链路层存在无线协议，它将只保护无线子网络，而不是整个网络。在某些情况下，可能需要高层保护。例如，你的流量可能会跨越其他网络网段，如局域网或广域网、互联网和有线网段。在这里可能需要考虑额外的安全性。当我们谈论额外的安全性时，指的是实施更高层次、经过\
  \ `FIPS` 验证的端到端 (`E2E`)加密保护。\n\n如果你在智能手机上使用 WhatsApp 通信器，你应该已经注意新的加密形式，它现在是端到端的。这使得应用程序的开发者无法监视用户传输的消息。基于\
  \ `AES` 的解决方案为未来提供了非常稳健的安全保障。这种加密唯一的问题是它需要新的自定义硬件和协议更改。包括你所在内的许多组织在实施 `AES` 使用时可能会遇到困难，因为这将要求构建\
  \ `PKI`（公钥基础设施）。然而，对于许多组织来说，这不是实行的解决方案，因为成本昂贵。\n\n目前还没有针对 `AES-CCMP` 的破解工具。这太棒了，因为我们现在拥有了完全无法破译的安全。然而，这只能随着时间证明其合理性，因为那里有许多破解者正在努力破解它。可能已经存在破解它的工具。因此，你需要保持警惕并跟上节奏。\n\
  \n## 使用 VPN\n\n是否见过有人以英国公民的身份在美国浏览你所属的网络？`VPN` 让这种有趣的玩法成为可能。你的组织可以使用 `VPN`（虚拟专用网络）补充之前提到的控制措施。这种网络是在公共电缆连接到私有节点时创建的。你可以将\
  \ `VPN` 认为在互联网内部构建的安全隧道。`VPN` 的“墙”是由高层加密措施组成的。此外，`VPN` 很有吸引力，因为它对硬件的投资较少。通常情况下，当你在公共空间连接互联网时，你的信息都可以被其他人访问。如果你在公园外喝果汁时尝试访问你的\
  \ Facebook 账号，如果不使用 `VPN`，那是危险的。这是因为坐在你旁边甚至在公园里远一点的人可以使用本章中提到的工具解密或拦截你的工作。通常情况下，每当你使用公共无线网络时，你都需要安装并使用\
  \ `VPN` 技术来保护自己免受恶意黑客的侵害。\n\n`VPN` 有三种类型：\n\n*   `远程访问 VPN`：这是最常见的 `VPN` 类型。它的流行源于它赋予远程用户安全访问内部应用程序（例如电子邮件）的能力。\n\
  *   `外网 VPN`：这种类型的 `VPN` 允许一个组织在不被察觉的情况下安全地访问另一个组织。\n*   `内网 VPN`：在此类 `VPN` 中，在组织网络中传输的数据是加密的。\n\
  \n今天互联网上有许多平台可以教你如何创建一个用于数据传输的网络。通常情况下，`VPN` 确保只有授权用户才能访问网络；任何其他未经授权的人都无法拦截数据。这就像你想在森林里盖房子而不让任何人知道，只有你给过路指示的人才能拜访你一样。`VPN`\
  \ 为两个网络建立了一种只有授权用户才能访问的隧道。当你需要该隧道时，你就建立它；当你用完时，你就将其关闭。比起 `E2E` 加密应用，你工作的组织可能会发现在传输层通过公共网络构建隧道是必要的。有不同类型的\
  \ `VPN` 解决方案，从商业应用程序到我们电脑上使用的操作系统提供的高级功能不等。以下列出了一些可用的 `VPN` 协议：\n\n*   `PPTP`：点对点隧道协议\n\
  *   `L2TP`：数据链路隧道协议\n*   `IPSec`：网际安全\n*   `SSH`：安全 Shell\n\n## 使用微软的 PPTP\n\n这种技术是访问网络的一种极其快速且相对简单的方法。如果你是一个小型企业主，可能也会考虑为你的网络使用点对点隧道协议。`PPTP`\
  \ 提供的加密级别对于大多数企业主来说是足够的。大多数中小企业主偏于使用 `PPTP`，因为它不需要证书服务器并且支持原生 Windows 命令。即使大多数商业\
  \ `VPN` 供应商也支持这种协议。通过点对点隧道协议，你可以选择使用密码的身份验证。然而，你需要了解关于 `PPTP` 的一个关键事实：在生成密码方面，它高度依赖你的技能。\n\
  \n## 使用 L2TP\n\n与适用于所有微软系统的点对点隧道协议不同，二层隧道协议仅适用于 `Windows 2000` 和 `Windows 2003`\
  \ 平台。尽管它很好，但它有一个缺点：它需要证书服务器或第三方证书。然而，这在许多情况下可能是昂贵的且负担不起的。\n\n## 使用 IPSEC\n\n这是一项加密行业标准，微软将其包含\
  \ `Windows 2000`、`Windows XP` 和 `Windows 2003` 操作系统。该协议在 Windows 机器之间非常易用，并且提供了卓越的安全。它和\
  \ `L2TP` 一样也有缺点，需要使用证书服务器。\n\n`IPSEC` 有两种模式，分别是 `transport`（传输）和 `tunnel`（隧道）。隧道模式加密每个数据包的头部和载荷。然而，传输模式只加密载荷。\n\
  \n## 使用 SSH2\n\n这种协议在组织中非常有用。`Secure Shell`（安全 Shell）是另一种隧道，主要用于组织内部隧道传输具有明文密码的服务，例如\
  \ `FTP` 和 `Telnet`。另一方面，当你尝试安全地登录到远程主机计算机时，该协议为你提供了灵活性。你还将获得在远程机器上运行命令的能力，并尽享两个网络或机器之间加密、安全且经过身份验证的通信。\n\
  \n\n\n\n然而，你不应该认为 VPN 是一个完全安全的“灵丹妙药”。外部恶意黑客仍然可以对 VPN 发起客户端和服务器端的攻击。不要忘记，恶意黑客需要时间来寻找你的弱点。如果你的弱点在于客户端，那里就是你受到攻击的地方。\n\
  \n# 第六章：网站与 Web 应用程序的缺陷\n\n在网络上，可能没有什么是不需要使用网站或 Web 应用程序的，特别是随着互联网普及性的提高、网页设计的扩散与改进以及\
  \ Web 应用程序开发的增长。\n\n尽管生产力和易用性有所提高，但人们对我们在网络上的安全性日益担忧，包括我们的信息安全以及在网络上的通用存在性。已经出现过许多著名的安全失败案例，包括图片泄露、客户信息泄露以及最近的\
  \ `Ransomware`（勒索软件）病毒。普通网络用户也越来越增强安全意识，努力保护自己的隐私数据。更多的插件和其他应用程序被开发出来，以防止来自带有下载软件的网站的间谍软件和木马。另一些则旨在在用户尝试浏览不安全网站时发出警告。\n\
  \n然而，为了在使用网站或 Web 应用时有效保护保护自己，你必须了解信息可能被泄露和访问的不同方式。在使用网站或 Web 应用时，有四个层次需要注意。这些层次在下方提到，从基础层到顶层：\n\
  \n1. **数据库**：这是存放客户端信息的地方——所有注册信息都存储在这里，包括位置、电子邮件地址以及应用程序或网站正常运行所需的其他关键信息。\n2. **Web\
  \ 服务器**：这是作为应用程序或网站与数据文件之间接口的门户。它就像一扇进入仓库的门，只要文件存在，你就可以获取所需的任何内容。它是根据浏览器通过 `HTTP`\
  \ 发出的请求类型向用户提供内容的软件或计算机。\n3. **网站或 Web 应用程序**：这是我们在浏览网站或使用 Web 应用时看到并交互的界面。它存储开发和设计网站时使用的代码。它包含了向服务器请求文件检索或存储的指令，以及如何对网站或\
  \ Web 应用界面上的各种用户输入或操作做出响应的指令。\n4. **浏览器**：我们都知道网络浏览器用于显示网页。有些人可能对其重要性产生争论，但我自信地告诉你，在涉及安全和隐私时，它的重要性与其他层相当。此前，大多数代码运行在\
  \ Web 服务器上。然而在最近，由于许多 `JavaScript` 等客户端脚本语言和各种框架的改进，现在更多的 Web 应用代码运行在浏览器上。这些网络浏览器存储了大量信息，如\
  \ `cookies`、经常访问的网站、书签、用户名和密码。\n\n现在，数据库的缺陷为网站或 Web 应用的客户端或用户构成了巨大的风险。这些缺陷可以轻松访问数据库，并暴露如客户姓名、位置、账号数字甚至社会安全号等信息。松散的\
  \ Web 服务器安全也会在网站向服务器发送请求时，泄露本应受保护的信息。来自应用程序或网站本身的信息泄露可能由于网站或应用编程或开发过程中产生的错误引起。这些错误通常与用户输入验证、应用程序或网站本身向服务器发送的不安全指令，甚至是揭示应用程序或网站结构的注释有关。然而，对于浏览器来说，它们存储了大量信息（密码、收藏的网站等），这使其成为黑客利用的“甜点”。如果黑客访问了如收藏网站等信息，他或她可以创建一个克隆网站来重定向用户并收集关键信息。黑客还可以利用网站\
  \ Flash 代码或 `JSON` 中存在的缺陷从用户处获取信息。\n\n网站或 Web 应用中可能存在的常见安全缺陷如下文所示。据说，要正确保护你的网站或\
  \ Web 应用，你需要了解这些安全缺陷是如何产生的以及它们是如何被利用的。\n\n## 1. 信息泄露\n\n当应用程序或浏览器向服务器发送信息，而这些本应受保护或隐藏的信息显示给用户或黑客时，就会发生这种情况。在这种情况下，信息已经泄露了。这种基础安全缺陷发生在编码或应用程序开发过程中。它详细描述了网站或\
  \ Web 应用的结构，以及信息在整个过程中的流。如果黑客获得了相关代码，他或她就可以利用该网站或 Web 应用。这种信息泄露发生有两种主要方式：\n\n###\
  \ 目录浏览\n\n在解释目录浏览如何泄露信息之前，让我们先解释一下它。在网络上，有两种寻找资源、信息或内容的方法。第一种是通过搜索引擎，其中最流行的是 `Google`。搜索引擎是使用名为\
  \ `spiders`（爬虫）或爬角的自动化工具或脚本的 Web 应用程序。这些爬虫遍历网络，识别关键词，读取页面内容并跟踪这些页面上的相关链接。它们存储访问的每一个页面以及\
  \ Web 服务器上的每一个后续页面。因此，当你搜索关键词时，你会得到一个在服务器上存储或索引的页面列表。另一方面，网络目录是一个被分类到各种类别的网站目录或列表。这些列表由人工管理和处理。网站所有者将他们的网站提交到目录，管理目录的人员会对网站进行审核，以确认其符合在其目录中列出的标准。如果我们为了研究寻求信息、想要真实的内容，或者想要与特定主题相关的广泛资源，我们将会想要使用网络目录。当\
  \ `HTML` 中的目录浏览标记被间接配置时，或者当本应是私密的文件列在目录中时，恶意用户可以访问该文件并获取关键信息。`DirBuster` 是 `Kali\
  \ Linux` 上的一个执行此任务的工具。该应用程序扫描网站及其端口（取决于网站是否为加密网站，端口可能是 `80` 或 `443`）。然后它使用 wordlist（[注：此处译为词汇表/字典]）在网站中搜索不应可见的目录。如果发现其中任何目录，它们可能会导致数据库并引起严重的信息泄露。为了防止恶意用户未经授权访问目录或文件，建议根据你为网站使用的\
  \ Apache 服务器还是 IIS 服务器，妥善配置 `.htaccess` 文件或 `appcmd` 命令。\n\n\n\n\n### 关于 HTML 页面的注释\n\
  \n这主要是在部署网站或 Web 应用程序时出现的代码问题。编程最佳实践要求程序员对代码块进行注释，以解释其功能原理以及代码采用这种结构的原因。有时开发者还会提到存储信息的变量和数据库名称，以及这些信息在整个应用程序过程中是如何使用的。这在多个程序员协作同一个项目时尤为重要。然而，在部署网站或\
  \ Web 应用程序时，必须从代码中移除这些注释。在浏览器中查看网站时，右键点击页面并选择“查看源代码”选项，会打开一个独立的窗口，显示所有的 HTML 代码和一些\
  \ JavaScript 代码。这些代码用于构建网站或 Web 应用程序。\n\n在 `Kali Linux` 上，可以使用名为 `WebScarab` 的插件仅过滤出网页上的注释。这是通过在片段标签的下拉菜单中选择片段（fragment）和注释（comment）选项来实现。为了防止此类信息泄露，必须移除包含\
  \ Web 应用程序敏感信息的注释。为了格外起见，可以选择移除所有注释。\n\n### 2. 身份验证问题\n\n身份验证是网络安全的一个关键方面。这是应用程序验证用户的凭据或登录详情，并确认其是否存在于应用程序或网站的数据库中的过程。这不应与授权（authorization）混淆。授权是在完成身份验证后，允许用户或客户端访问其被许可访问的文件的过程。身份验证是通过网站或\
  \ Web 应用程序用户提供的用户名和登录信息实现的。以下是网站和 Web 应用程序中常用的身份验证协议类型。\n\n#### HTTP-Basic 身份验证\n\
  \n这是使用用户名和密码来验证用户。当用户在基于 `HTTP-Basic` 身份验证的站点提供其用户名和密码时，这些信息将通过 `base64` 编码系统以加密格式发送。用户名和密码在通过\
  \ `base 64` 算法编码之前以 `username: password` 的形式发送。然而，如果黑客决定使用 `Burpsuite` 和 `Wireshark`\
  \ 等工具，这些加密信息可能会被拦截。该身份验证系统的问题在于 `base 64` 编码系统，它可以被轻易解密，因为 `Wireshark` 会解密加密的凭据。此外，用户名和密码是以带冒号（:`）的明文传输的，因此非常容易被监听。使用\
  \ `SSL` 可以限制与此类漏洞相关的风险。\n\n#### HTTP-Digest 身份验证\n\n这种身份验证类型的开发是为了应对 `HTTP-basic`\
  \ 身份验证的安全问题。在此类身份验证中，服务器产生一个名为 `nonce` 的随机值。该 `nonce` 与用户名、密码、`nonce` 值、`HTTP` 方法和页面的\
  \ `URL` 结合，创建一个发送到服务器的加密消息。该消息使用 `md5` 算法加密，无法反向解密，就像 `HTTP-Basic` 身份验证那样。为了使解密可能，黑客必须意识到加密过程中使用的那四个凭据。然而，如果恶意用户能够向服务器重建相同的摘要消息，他或她将获得访问权限。为了限制此类攻击，服务器通常使用\
  \ `nonce` 值创建时间戳，这样每当向服务器发送访问请求时，服务器都会检查与该 `nonce` 值关联的时间戳，如果时间未超时则允许访问。\n\n####\
  \ 基于表单的身份验证\n\n网站上常用的身份验证形式是基于表单的身份验证。在这里，客户端在登录页面提供用户名和密码。登录页面通常使用 HTML `<input>`\
  \ 标签创建。当标签中输入信息时，信息将传输到服务器，凭据将从输入标签中提取并与变量名关联，然后与用户名和密码数据库进行比对。服务器随后返回一个响应，验证用户身份或拒绝用户访问网站或\
  \ Web 应用程序的某些区域。此类身份验证没有预定义的加密其接收到的登录信息的方法，使其具有高度的可定制性。然而，除非使用 `SSL`，否则信息也将以明文共享。如果黑客决定在\
  \ `Kali Linux` 中使用 `Hydra` 等工具，基于表单的身份验证非常容易受到暴力破解。暴力破解是一种通过猜密码获取访问权限的方法。它需要一个用户名列表和一个密码列表，将凭据交叉应用于服务器以获取相应的登录详情。例如，如果用户名列表包含五个用户名，密码列表包含五个可能的密码，暴力破解工具将为每个用户名尝试五个可能的密码，总共产生\
  \ 25 次登录尝试。此列表是在信息收集过程中利用社会工程学构建的。\n\n### 3. 基于注入的漏洞\n\n注入漏洞（Injection flaws）可能是影响网站或\
  \ Web 应用程序最常见且破坏性最强的漏洞。客户端基本上是向网站或 Web 应用程序上的任何输入字段中注入恶意代码或脚本。这些信息被发送到服务器，如果应用程序设计不当，服务器将执行代码中存在的命令，并允许客户端访问敏感数据或应用程序的根目录。这总发生在应用程序对输入数据验证不充分的情况下，允许黑客欺骗应用程序执行非期望的操作。最终，这会导致黑客获得对应用程序的控制。两种常见的基于注入的漏洞类型是：\n\
  \n#### 命令注入\n\n这种注入攻击针对服务器操作系统本身。代码是用提交到服务器的输入数据编写的。向服务器发送 shell 命令以检索信息的应用程序非常容易受到命令注入的影响。这些代码通常是服务器可以运行的\
  \ shell 命令。如果没有适当的输入验证系统，服务器将执行发送到服务器的代码，允许黑客访问服务器。使用解释型语言开发的应用程序更容易受到注入攻击。\n\n\
  #### SQL 注入\n\n这是此处列出的两种注入攻击中最常见的。没有数据库，每个网站或 Web 应用程序都被认为是不完整的。数据库是 Web 应用程序自身的命脉。关系型数据库是与网站和\
  \ Web 应用程序关联的最流行的形式。关系型数据库本质上是将信息存储在包含行和列的表格中的产品。与数据库交互可能是网站或 Web 应用程序执行的最关键操作。为了让\
  \ Web 应用程序或网站与数据库交互，必须对数据库中存在的信息发出请求；此外，必须向数据库添加新数据，并对现有数据进行编辑或修改。应用程序使用 `SQL` 命令来实现这一壮举。在程序员中，这被称为“查询数据库”。输入表单、cookie、URL\
  \ 属性或变量如 `headers` 和 `XML` 请求可用于向数据库发送恶意指令，欺骗其泄露用户名、密码和信用卡信息等敏感数据。通过绑定 `SQL` 命令与用户输入来查询数据库的应用程序也非常容易受到\
  \ `SQL injection` 攻击。\n\n\n\n\n运行模式通常是发现应用或网站中存在的各种输入字段，然后测试每个字段以查看网站对每个命令的响应。这允许我们确定网站上使用的数据库类型，并预测该网站或\
  \ Web 应用是否容易受到 SQL 注入攻击。`SELECT` 命令用于从数据库检索信息，是目前网站或 Web 应用发送的最常见的命令，因为用户几乎总是需要数据库中的信息。用于修改、删除和向数据库输入新信息的\
  \ `UPDATE`、`DELETE` 和 `INSERT` 命令也是非常常见的 SQL 命令。在攻击的探测阶段，黑客会测试不同的命令并观察其收到的响应。在这种情况下，错误报告有助于黑客识别服务器当前运行的操作系统和数据库类型。这使黑客能够构建一个与目标数据库匹配的查询列表。然而，出于安全考虑，网站可能会传递通用的错误信息，而不泄露受攻击的数据库类型或操作系统。这被称为盲注攻击。\n\
  \nKali Linux 上存在多种工具，可以让 SQL 注入变得可行且简单。其中一种工具是 `Sqlsus`。该工具用于测试和利用 MySQL 注入漏洞。`Sqlninja`\
  \ 工具也具有相同的功能，但侧重于基于 Microsoft SQL Server 的数据库。`Sqlninja` 工具只利用漏洞，而不进行测试。更健壮的工具是\
  \ `Sqlmap`，它支持大量的数据库。它可以发现注入漏洞，准确猜测网站或 Web 应用使用的数据库类型，并执行使用使用户对目标数据库拥有完全控制权的命令。该工具对于盲注漏洞和基于错误的漏洞同样有效。专注于盲注的工具是\
  \ `BBQSql`，它是一种盲 SQL 注入工具，通过提问并根据获取的响应构建 SQL 攻击来运行。\n\n## 4. 跨站脚本 (XSS) 和跨站请求伪造\
  \ (CSRF)\n\n### 跨站脚本 (XSS)\n\n在当今，Web 应用的发展旨在实现几乎在线上的任何功能。这些 Web 应用用途包括执行银行交易、在线购物、在股票或比特币市场进行交易，甚至保存医疗记录。由于\
  \ Web 应用在执行此类敏感活动的使用日益增加，确保它们提供针对访问此类信息的黑客的保护至关重要。拥有银行应用用户会话的黑客可以在该人的账户上进行交易，或代表该个人进行购买，这完全是一场噩梦。因此，网站或\
  \ Web 应用必须是安全的，并且对任何用户为任何输入字段提供的数据必须进行彻底检查，以确保数据是该特定输入字段的合法或适当数据。\n\n与发生在 Web 应用或网站上的大多数攻击一样，跨站脚本的发生是因为输入验证缺陷，即当用户输入没有得到妥当检查时。这允许具有恶意意的客户端向网站或\
  \ Web 应用注入恶意脚本，并感染访问该网站的用户。与基于注入的漏洞不同，跨站脚本主要由运行在用户浏览器上的 JavaScript 代码组成。`JavaScript`\
  \ 在浏览器上执行其命令而不是在 Web 服务器上执行；这就是为什么跨站脚本通常被称为客户端攻击的原因。在 `JavaScript` 的早期，富有意的黑客能够读取数据并访问在备用或相邻窗口中打开的网站数据。然而，随着最近\
  \ `JavaScript` 的改进和黑客的创意，在浏览器上执行的恶意 `JavaScript` 代码可以访问用户的 cookie 并窃取会话、记录用户的按键输入、扫描端口、检查浏览器历史、查找用户的操作系统属性并收集其他浏览器数据。跨站脚本分为三种类型：\n\
  \n**持久型 XSS (Persistent XSS)**：在持久型跨站脚本中，黑客发送一个恶意脚本，该脚本被存储在网站或 Web 应用的数据库或 Web 服务器中。每当用户访问该网站时，恶意代码就会发送并在用户的浏览器上执行。由于脚本存在于数据库或\
  \ Web 服务器中，脚本在不经过数据过滤的情况下发送到用户的浏览器。这就是它也被称为存储型 XSS 的原因。持久型 XSS 的热门目标平台是社交平台、电子商务网站或\
  \ Web 应用的评论区、新闻网站和网络论坛。运行模式通常涉及恶意用户测试网站或 Web 应用的各种输入字段。然后，他在没有足够过滤系统的特定字段中插入恶意代码，该字段通常是发送后后显示输入参数的字段（例如，评论部分）。该代码随后被发送并存储在数据库或服务器中，以便每当另一个用户来到该特定字段时，服务器就会部署该代码并在用户的浏览器上执行。\n\
  \n**反射型 XSS (Reflective XSS)**：反射型 XSS 是一种针对性的 XSS 攻击。因为 XSS 攻击的目标是在用户浏览器上执行恶意脚本，黑客首先制作脚本并将其绑定到\
  \ URL 上。然后他将该链接发送给目标用户。该链接通常通过邮件发送，诱骗受害者点击该链接。一旦用户点击链接，用户将被重定向到 URL 中的网站，脚本将自动执行，允许攻击者利用其浏览器进行邪恶活动。与脚本保存在数据库或\
  \ Web 服务器中的持久型 XSS 攻击相反，在反射型 XSS 攻击中，用户被发送一个链接，点击该链接会在其浏览器中执行脚本。\n\n**DOM（文档对象模型）XSS**：在持久型和反射型\
  \ XSS 中，用户的浏览器都会收到服务器的响应，假设它是合法的响应，然后运行它。正如我们所知，`JavaScript` 用于显示动态 Web 内容并在不完全重新加载网页的情况下刷新网页，例如网站显示实时比分时。这种\
  \ XSS 是在浏览器中完成的，完全不需要到达 Web 服务器。使用用户输入执行 `JavaScript` 代码的网站（特别是对于 `GET` 响应类型的网站）非常容易受到此类攻击。它是通过在原本应该是合法脚本的地方插入恶意脚本来实现的，使浏览器执行该脚本就像它是原始的合法脚本一样。\n\
  \n### 跨站请求伪造 (CSRF)\n\n\n\n\n跨站请求伪造（CSRF）不像 XSS 攻击。在 XSS 攻击中，黑客利用用户对该网站的信任，使用户接受通过该网站接收到的指令。然而，在\
  \ CSRF 攻击中，黑客利用的是用户对网站或 Web 应用的信任。一旦用户在网站或 Web 应用上通过身份验证，网站或 Web 应用就会相信并执行用户给它的任何命令。不在每次请求时对用户进行重新身份验证的\
  \ Web 应用很容易受到 CSRF 攻击。攻击者诱导用户点击一个在浏览器中运行代码的链接。该代码允许攻击客劫持用户在 Web 应用或网站上的会话，并代表该用户执行操作。例如，一个在银行应用上通过身份验证的用户可能会收到一个包含脚本的链接，该脚本会劫持其会话并将资金从其账户转入黑客的账户。这种攻击不仅限于欺诈性转账，还可以用于在线购物、更改电子邮件地址和在线投票。\n\
  \n缓解此类攻击的良好方法是使用重新身份验证或验证码系统，在执行用户提出的每个请求之前进行检查。\n\n## 5. 文件包含漏洞\n\n文件包含攻击以两种不同的方式发生：远程文件包含（RFI）和本地文件包含（LFI）。正如你可能猜到的那样，文件包含攻击是由用户输入验证不足或不当引起的。在这种攻击类型中，具有恶意的用户可以通过调用服务器上的脚本（本地文件包含）或远程服务器上的脚本（远程文件包含）在服务器上执行命令。这种漏洞主要发生在\
  \ PHP 编写的程序中。PHP 使用 `include` 关键字来引用单独编写但需要在当前程序中实现的代码。例如，可能会编写一段代码为页面提供导航；程序员可能需要将此代码包含在每个页面中，以便用户能够轻松地导航网站。程序员通过使用\
  \ PHP 中存在的 `include` 功能来实现这一点。该功能对于代码复用性至关重要，因为它消除了编写新代码的需求，从而节省了开发过程中的时间。\n\n当恶意黑客发现用户输入会导致应用访问脚本时，就可以进行远程文件包含攻击。当请求通过\
  \ HTTP 发送时，攻击者可以编辑地址以包含远程服务器上的脚本。因此，当该网站加载时，它会执行从该远程服务器检索的脚本。本地文件包含攻击的原理本质相同，只是它访问的是与应用位于同一\
  \ Web 服务器上的脚本。\n\n文件包含攻击可能是致命的。它们可以被用于劫持用户的会话；能够窃取客户端浏览器中的 Cookie 和令牌（tokens）。它们还可以用于窃取数据，在\
  \ Web 应用的情况下甚至可以控制整个应用程序。\n\n然而，这种网站或 Web 应用攻击可以通过采取一些关键步骤来妥善处理。网站或 Web 应用应该通过 `include`\
  \ 功能限制调用脚本的用户输入能力。如果无法消除这一点，则应对根据允许的用户字符数量对输入进行适当的验证和限制。应用或网站应该拒绝特殊字符或不需要的字符。避免文件包含攻击的最佳方法是确保用户输入一旦输入经过适当验证。\n\
  \n## 6. 基于会话的缺陷\n\n会话（Session）是用户与网站或 Web 应用交互花费的时间。每当用户使用登录详情登录站点时，服务器会验证用户身份并为其提供一个会话令牌（session\
  \ token）。会话令牌非常重要，因为它可以防止用户在与网站或 Web 应用交互期间发送每次请求时都必须登录。此令牌通常是一个随机的长数字，作为与 Web 服务器的自动重新身份验证。这本质上意味着当会在话开始你登录网站时，令牌就像你的登录凭据，它应该受到严格保护。如果攻击者获得了你的令牌，他或她就可以轻松地在与该\
  \ Web 应用或网站的交互中伪装你。\n\n令牌通过网站的 URL、Cookie 甚至隐藏的表单字段从服务器传递到浏览器。黑客可以使用各种方法窃取这些令牌。一些比较流行的方法是：\n\
  \n-   **中间人攻击**：这主要在使用安全套接层（`SSL`）保护的网站上进行。对于用户来说，黑客伪装成服务器；对于服务器来说，黑客伪装成合法用户。这允许黑客获取从用户发送到服务器的信息，以及从服务器返回给用户的数据。\n\
  -   **数据包或数据嗅探**：这是黑客在通信通道上嗅探发送的数据包以信息。这主要发生在未使用安全套接层（`SSL`）的通信中。\n-   **暴力破解**：某些网站以特定的、定义的格式创建令牌，甚至重用令牌。如果黑客可以获得足够的令牌进行分析，并使用具有卓越计算能力的机器，他或她就可以暴力破解令牌，并生成可以在访问网站时使用的合法令牌。\n\
  -   **使用 XSS 攻击窃取令牌**：由于我们已经讨论了一点 XSS 攻击，我相信你对这里发生了什么有了了解。攻击者等待用户登录 Web 应用，服务器发送令牌，令牌随后被保存在浏览器中。接下来，黑客执行跨站脚本攻击并诱骗用户在其浏览器上执行它。执行的脚本通常是窃取令牌的脚本，它会将令牌发送到远程服务器。黑客随后可以使用此令牌与网站或\
  \ Web 应用进行交互。\n-   **会话固定攻击（Session fixation attack）**：这种攻击对于在 URL 中发送令牌的网站非常常见。黑客访问网站或\
  \ Web 应用，登录并获得一个令牌。黑客随后构造一个带有其收到的令牌的 URL，并将链接发送给目标用户。用户被诱导使用该链接访问网站，并使用该令牌登录。然而，一旦用户登录，他或她就不会获得新令牌，因为他或她正在使用现有的令牌。一旦黑客确认用户已使用该会话\
  \ ID 登录，黑客执行同样的操作并劫持用户的会话。所以，本质上，黑客获取一个令牌，将其固定在 URL 上，并说服用户使用它登录。\n\n为了防止基于会话的攻击，我们需要确保我们的网站或\
  \ Web 应用不会受到跨站脚本攻击（XSS）的影响，这将使得运行窃取令牌的脚本变得容易。你应该确保令牌和会话得到妥善管理。此外，强烈不建议通过 URL 发送令牌。你还应该拒绝所有用户提供的令牌，因为生成令牌的任务应该交给服务器。\n\
  \n\n\n\n由于网站和 Web 应用有许多用途，因此安全性至关重要。每当 Web 应用或网站运行时，就会发生数据传输。在 Web 应用和数据库之间传输的信息可能是敏感信息，如果落入坏人之手，可能会被用于恶意目的。随着能够嗅探数据传输甚至在数据到达服务器或客户端之前对其进行修改的工具的创造性和可用性提高，数据传输过程中对安全性的需求也日益迫切。当数据包被拦截且会话被劫持时，可能会获得访问数据库的权限，从而暴露并破坏\
  \ Web 应用或网站所属的操作系统。使用磁盘加密系统和令牌可以保护数据库中的数据，但在这些数据传输时无效。因此，为了应对传输数据安全相关的问题，创建了 `SSL`（安全套接层）。\n\
  \n## Secure Socket Layer (SSL)\n\n安全套接层（SSL）对传输期间的数据进行加密。如果攻击者恰好截获了这些数据，对他来说也是没用的，因为他必须解密数据。`SSL`\
  \ 保护客户端和服务器之间的数据传输。通过 `SSL` 传输的数据在发送到客户端或服务器之前会被加密，然后客户端或服务器在接收后，借助数据传输中包含的解密密钥解密消息。然而，创建于\
  \ 1994 年的 `SSL` 已经被更安全的 `TLS` 所取代。`SSL` 被取代很大程度上因为它容易受到 `CRIME`、`POODLE` 和 `BEAST`\
  \ 攻击。正如你可能看出的，`POODLE` 并不是狗，而 `BEAST` 在这里也不是一种动物。\n\n### SSL Attacks\n\n`POODLE`\
  \ 是“针对降级遗留加密的填充 Oracle 攻击”的缩写，中间人攻击（`MITM`）的结果。黑客对用户发起中间人攻击，完全控制路由器，然后强制浏览器将其 `SSL`\
  \ 降级为安全性较低的协议。随后，黑客破解该协议并窃取信息。然而，在 `BEAST`（“针对 SSL 和 TLS 攻击的浏览器利用”）攻击中，黑客试图猜测用于保护传输信息的加密密钥的每个字符。\n\
  \n## SSL 中的加密方法\n\n在使用安全套接层（`SSL`）传输时涉及两种主要的加密方法：非对称加密和对称加密。\n\n### 非对称加密\n\n在这种加密类型中，数据传输时使用一个密钥（公钥），一旦到达目的地，将由另一个独立的私钥进行解密。为了让这个概念的解释更易理解，让我们使用这个类比。假设你有一些与你分享敏感信息的同事。我们把这些人称为\
  \ `Bob`、`Paul`、`Betty` 和 `Mike`。你建造了四个不同的邮箱箱（每人一个），并给他们每人一把带有各自钥匙的锁。然而，你也手握这些密钥的副本。然后，你又买了四个带有你专属钥匙的独立锁。当他们带来邮件时，他们会用自己的锁和你的锁将邮件锁上。每你想取出邮件时，都可以用你的钥匙打开邮箱箱。在\
  \ `SSL` 中，数据在传输时用公钥加密，到达预期目的地时用私钥解密。\n\n非对称加密模型是一种安全的模型。常用的非对称加密算法包括椭圆曲线密码学（通常用于手持设备）、Rivest-Shamir-Adleman\
  \ 或 `RSA`（这是目前最常用的非对称算法加密）以及 `Diffie-Hellman` 密钥交换（这可能是第一个为数据传输开发的非对称加密算法）。\n\n\
  ### 对称加密\n\n与非对称加密的情况不同，加密和解密数据使用同一个密钥。对称算法运行的两种主要方式是通过块加密（在这一类对称加密模型中，数据按块加密）和流加密（传输的数据逐位逐位加密）。\n\
  \n在对称加密中使用的算法有 `DES`、`AES` 和 `IDEA`，它们分别代表数据加密标准、高级加密标准和国际数据加密算法。\n\n## SSL 连接与\
  \ MITM 攻击\n\n在安全套接层（`SSL`）连接中，浏览器创建一个密钥并发送到服务器，服务器对该密钥进行验证。然后，发送到服务器的数据使用之前为该会话生成的密钥进行加密。哈希函数用于验证或测试共享信息的完整性。在\
  \ `SSL` 连接中，始终有一个独立的密钥交换算法、一个身份验证算法、一个独立的加密算法和一个唯一的哈希算法。这些内容构成了客户端与服务器之间最初共享的信息，以确保通信过程中的正确加密和解密。\n\
  \n在 `MITM`（中间人）攻击中，黑客首先通过伪装成服务器并使用伪造证书来攻击用户的计算机。用户的浏览器会通知用户网站的证书是伪造的。然而，如果用户无视警告继续创建连接，用户将与黑客建立\
  \ `SSL` 连接。黑客随后能够嗅探并拦截在安全套接层中发送的信息。然后，黑客会伪装成原始用户，与原始目标服务器建立 `SSL` 连接。然而，由于黑客已经拦截了与用户的连接，服务器误认为黑客就是用户，并与黑客完成连接。\n\
  \n### Kali Linux 中的工具\n\n`Kali Linux` 中的工具使我们具备创建 `SSL` 连接并发起中间人攻击的能力。其中一些工具具有为目标用户创建伪造证书进行身份认证的能力。某些用于测试\
  \ SSL 弱性和发起 `MITM` 攻击的常用工具包括：\n\n- `SSL split tool`\n- `SSL strip tool`\n- `SSL\
  \ strip tool`\n- `SSL scan tool`\n- `Open SSL tool`\n\n某些工具可以扫描 `SSL` 连接并确定使用的密钥、身份验证、加密和哈希算法组合。虽然\
  \ `SSL strip tool` 可以生成证书并欺骗浏览器认为正在与服务器通信，但 `SSL sniff tool` 则欺骗用户认为服务器接受未安全的连接。\n\
  \n## PHISHING（网络钓鱼）\n\n网络钓鱼是诈骗者和黑客常用的的一种网络攻击。通过伪装成真实受信任的权威，它操纵受害者交出个人信息。黑客可以通过伪装成\
  \ IT 公司或银行的代表、在线支付系统的员工甚至是社交媒体网站的朋友来实现这一点。网络钓鱼是一种社会工程攻击技术。它试图将用户引导到一个网站，该网站通常是用户熟悉或经常访问的原始网站的克隆。\n\
  \n网络钓鱼通常通过克隆合法网站来实现，以获取用户的登录详情。网站被克隆得与原始网站一模一样；编写一段代码来收集网站上使用的用户名和密码。这些信息随后会被保存在远程位置，通常为文本格式。接下来，这个克隆网站将使用用户的登录凭据在原始站点创建登录尝试，从而让用户登录原始网站。\n\
  \n\n\n\n用户还会通过钓鱼邮件被诱导访问克隆网站，邮件提示用户点击一个链接，将其重定向到克隆网站。`Kali Linux` 中的 `Social Engineering\
  \ Toolkit` 是实现这一壮举的重要工具。该社会工程工具包含了完全克隆原始网站上网站的选项。它还包含一个用于向多个目标电子邮件地址或单个目标电子邮件地址发送批量电子邮件的工具。\n\
  \n要有效执行执行钓鱼攻击，你必须登录你的 `Kali Linux` 发行版，点击应用程序图标，进入 `BackTrack` 并选择右侧的 `Exploitation\
  \ Tools` 选项。这将显示另一组选项，包含 `Web Exploitation` 工具和 `Physical Exploitation` 工具等工具。我们的重点将是点击\
  \ `Social Engineering tools`。我们选择 `Social Engineering Toolkit`。`Social Engineering\
  \ Toolkit` 将打开终端并显示一个包含不同社会工程攻击工具的菜单。我们选择 `Web Attack Vector` 选项，然后选择选项 `3` 中的 `credential\
  \ harvester` 攻击方法。此选项允许我们克隆一个网站。\n\n`credential harvester` 选项打开一个包含三个选项的菜单：(1) `web\
  \ template` 选项，允许社会工程工具导入一组我们可以在攻击中使用的预定义网络应用程序；(2) `site cloner`，帮助我们克隆选择的任何网站；以及\
  \ (3) 导入我们自定义的 HTML 模板。选项二会让 `Social Engineering Toolkit` 请求用于监听的 IP 地址和要克隆的网站。一旦提供了这两个参数，工具就开始克隆网站。当毫无防备的受害者访问此网站时，`SET`\
  \ 会收集用户名和密码。网站复制通常与 `spear-phishing` 选项配合使用，其中克隆网站的链接通过批量电子邮件攻击发送给多个目标或仅一个目标。\n\n\
  # 键盘记录器\n\n键盘记录是脚本或设备，允许黑客跟踪受害者的每次键盘或数字键盘按键，并将其保存为文本或可读格式。它是信息收集非常有用的工具。通常情况下，键盘记录是运行在安装它们的计算机后台的程序或脚本，尽管物理键盘记录器以\
  \ `USB` 多端口或 `P2S` 端口的形式存在，键盘在连接到 CPU 之前连接到这些端口。这种类型的物理键盘记录包含一个内存芯片，可以将其移除并检查其存储的所有信息和键盘击键。还有无线键盘记录器，可以嗅探、拦截和劫持从键盘发送到接收器的数据。此外，还有安装在目标计算机上的键盘记录软件。这种类型的键盘记录软件运行在后台，不会干扰受害者在其个人电脑上的活动。\n\
  \n基于软件的键盘记录器必须安装在受害者的计算机上。这可以通过多种方式实现，我们稍后会讨论。黑客可能意识到客户端使用的某个应用程序中存在漏洞，然后利用该漏洞欺骗受害者访问一个下载并执行键盘记录器的网站。黑客可能会向受害者发送下载包含键盘记录器的应用程序或文件的链接。当受害者安装此应用程序时，它会在后台运行键盘记录器安装程序并启动键盘记录器程序。另一方面，黑客可能会将键盘记录器放在带有\
  \ `autorun` 文件的 `USB` 驱动器中。当个人拿起该驱动器并将其插入其/她的电脑，并好奇驱动器里有什么时，键盘记录器会在后台自动执行并开始跟踪用户的击键。\n\
  \n大多数此类键盘记录器都是远程运行的，需要互联网连接以将键盘记录发送给黑客。其他类型的键盘记录器将击键本地保存在受害者的计算机上，需要黑客物理接触计算机以检索日志文件。键盘记录器还能执行跟踪击键以外的操作。它们可以截图并保存屏幕上复制以及复制到剪贴板的信息。\n\
  \n键盘记录器是强大的程序。它们很容易构建，大多数作为 `rootkit` 的一部分执行。像键盘记录器这样的间谍软件非常强大，在操作系统上运行所需的代码和资源极少。它们可以避开监控，无法被系统的防病毒软件检测到。它们通常由一个动态链接库和一个安装程序组成，安装程序安装这些文件并允许它们在后台运行。可以使用\
  \ `Kali Linux` 中的 `Metaspoilt` 选项配合 `meterpreter` 创建键盘记录。`keyscan_start` 命令用于启动键盘记录器，而\
  \ `keyscan_dump` 命令请求并接收键盘击键的日志文件。\n\n建议任何 PC 用户都对键盘记录器进行。。此的良好方法是在计算机系统上安装 `antispyware`。键盘记录器可能非常狡猾，并避免\
  \ PC 上防病毒软件的检测。间谍软件工具将搜索并筛选出后台运行的键盘记录器。某些反间谍软件还会加密键盘击键，导致键盘记录器向远程黑客发送杂乱的日志文件。这种加密技术对硬件键盘记录器也同样有效。虽然没有一种通用的方法来防止键盘记录器，但建议定期扫描系统，检查后台是否有运行的异常进程，并避免下载和安装可疑应用程序。\n\
  \n# 分布式拒绝服务或 DDOS\n\nDDoS（分布式拒绝服务）攻击极具吸引力。与我们讨论过的其他类型的网站或 Web 应用攻击不同，这种攻击不是隐性攻击。它是一种声明攻击。目的是在网站或\
  \ Web 应用所有者的心中产生一种“你正在被攻击”的意识。这是臭名的黑客组织 `Anonymous` 最常用的攻击类型。\n\n创建分布式拒绝服务攻击的方法涉及向网站发送超过其处理能力的巨大流量。这是通过控制大量用户或机器人同时向网站发送服务器请求来实现的。在此特定行动过程中，服务器每秒收到的服务器请求多于其在该时间范围内能够充分提供的数量。这导致\
  \ Web 应用或网站无法供用户使用。实现这种流量洪水有两种方法：\n\n*   协调成百上千个用户同时发送请求。\n*   使用机器人或脚本向网站发送虚假流量。\n\
  \nDDoS 攻击与 `DOS` 攻击的区别在于，`DOS` 攻击涉及一个系统尝试淹没网站。而在 `DDOS` 中，使用了具有多个 `IPs` 的多个系统。这使得网站或\
  \ Web 应用很难屏蔽单个 `IP`，因为无法确定哪些流量是真实的，哪些不是。使用机器人也具有相同的效果，因为它们是从多个位置弹出的。一个完美的类比是厨房水槽。当你打开水龙头时，一定数量的水可以同时通过排水口。如果倒入水槽的水量超过了通过排水口的水流量，水槽就会溢满，直到整个厨房被淹没。\n\
  \n\n\n\n描述 DDOS 攻击的另一种方法是将其比作一个只有一个桥可以进入的城镇。这个城镇可以比作托管网站的服务器，而桥梁则是该网站提供流量服务的带宽。与大桥相连的另一个城市是试图关闭网站的攻击者或黑客。如果大桥在特定时间内只能允许约\
  \ 300 辆车通过，而在同一时刻有 900 辆车从那条道路驶出城市，那么道路上的车辆数量就会让大桥不堪重负。结果就是桥上发生严重的交通拥堵。这可能会导致进出城镇的货物停滞，合法用户无法访问大桥，并瘫痪经济，如果这种情况持续下去，将导致数百万美元的损失。\n\
  \n随着易于发起此类攻击的免费工具出现，DDOS 攻击变得更具破坏性。此类工具会导致服务器崩溃并最终导致服务中断。DDOS 攻击通常是为了宣传，因为它们是试图获得名声或威望的黑客的“声明”。以下是用于执行针对服务器的\
  \ DDOS 攻击时使用的一些免费工具。\n\n### 低轨道离子炮 (LOIC)：这个工具可能是目前最流行的免费 DOS 攻击工具。该工具非常易于使用，即使是新手也能轻松胜任。该工具曾被臭名昭著的匿名黑客组织使用过。它只需要用户提供服务器地址，其余会自动完成其余工作。它还具有远程控制和协调其他\
  \ LOIC 系统对网站进行 DDOS 攻击的能力。然而，该工具不会隐藏你的 IP 地址，如果你将其用于恶意目的，可能会导致你被追踪和捕。\n\n### XOIC：该工具在易用性上与\
  \ LOIC 相似。然而，创建者声称它比 LOIC 更安全。它有三种攻击模式可以根据黑客的意图进行选择。\n\n### HTTP 不可承受负载之王 (HULK)：这是另一种流行的\
  \ DDOS 攻击工具，为黑客提供了更好的安全性。它具有在执行攻击期间规避检测的能力。\n\n### RUDY (你还没死吗？/R-U-Dead-Yet)：如果不提到我们亲爱的\
  \ RUDY，我就无法讨论 DDOS 攻击工具。它使用 HTTP POST 方法执行攻击。它检测网站上存在的表单，并利用表单字段执行攻击。\n\n网络上存在无数免费的\
  \ DDOS 攻击工具。一些黑客会远这些在毫无防备的用户拥有的计算机上，并远程控制它们执行 DDOS 攻击。这类计算机被称为僵尸计算机。然而，其中一些免费工具是为了测试而创建的，尽管黑客已使用它们来执行恶意的服务器攻击。\n\
  \n防止 DDOS 攻击应该是任何组织 Web 或在线目标的首要任务。实现这一点的基本方法涉及安装强大的防火墙，以检测并阻止虚假流量。发送到网站的流量也可以重定向到另一个\
  \ IP 地址进行分析、检测和拒绝。这种方法被称为空洞（sinkholing）。通过清洗中心路由流量以过滤流量是防止 DDOS 攻击的另一种方法。对于个人 PC，用户避免从未知、非法的来源安装软件至关重要。此类应用程序大多包含木马，允许黑客远程访问\
  \ PC，从而在其僵尸网络中使用该 PC 执行 DDoS 攻击。通过安装安全修复程序或补丁以及使用优秀的防病毒程序来保持操作系统的更新也非常重要。\n\n##\
  \ 水坑攻击\n\n黑客一直一直在寻找巧妙的方法对用户发起攻击。有时这些攻击可能针对个人，而另一些时候目标可能是一个公司或组织。另一方面，黑客可能只是撒开大网，希望用户落网。水坑攻击是涉及广撒的针对性攻击。攻击者关注某个组织的员工，并设置一个针对至少一个目标员工的陷阱。水坑攻击的概念源于动物界，捕食者在水坑旁等待猎物。捕食者躲起来，每当猎物来喝水时，捕食者就会下手。\n\
  \n基本上，黑客识别一个要攻击的组织，然后观察该组织的员工，并发现大多数员工访问的网站。一个理想的网站是中小型网站，其所有者对安全意识不是特别敏锐。黑客扫描该网站的漏洞；一旦识别出这些缺陷，黑客就会在网站中注入利用这些漏洞的代码。每当员工访问此网站时，他们会被提示下载内容或访问另一个页面。一旦这些恶意代码通过下载恶意软件或路过攻击在受害者设备上执行，黑客就获得了对受害者系统的控制权，并可以使用该系统对组织的网络发动攻击。\n\
  \n## 路过攻击 (DRIVE-BY ATTACKS)\n\n有时，仅当用户访问受感染的网页时，系统就会被破解。这主要是通过路过攻击实现的。今天，随着用户通过手机、平板电脑和计算机系统等各种设备访问网站，网站的设计对屏幕尺寸、屏幕分辨率和操作系统的变化更具响应性。\n\
  \n网站现在包含指令，用于寻找和查找诸如浏览器类型、Flash 和 Java 插件版本以及调整网站以适应客户端设备所需的其他细节。当黑客破解包含此类信息指令的网页时，他们就具备了发起针对性攻击的充分设备，重点利用系统浏览器或插件中的漏洞。\n\
  \n此类攻击非常难以检测，因此用户确保其应用程序和操作系统始终更新到最新版本至关重要。在安全补丁发布后立即下载它们也非常重要。\n\n## 点击劫持 (CLICKJACKING)\n\
  \n这是一种用户界面重装攻击。当用户意图点击网站上展示的合法链接时，黑客欺骗用户点击恶意链接。这种类型的攻击通常不被察觉，不像其他网站攻击那样流行。这种特定的攻击会将你的注意力从重要的事情转移，在你反应过来之前，你就被破解了。事实上，这是一种非常高明的黑客手段。\n\
  \n攻击者访问一个网站，通常是金融或电子商务网站。攻击者导航到一个合适的页面。然后攻击者在那个网站上创建一个 `iframe`，描述一个关于金钱或奢侈品的绝佳优惠——受害者很可能会点击此类内容。然后他将该框架覆盖在网站的合法链接上，该链接可能对你没兴趣，但在点击时会起到黑客的目的。你被该信息所吸引并点击了链接，导致金钱或货物发送到黑客的账户或地址。\n\
  \n# 第章：使用框架进行攻击\n\n## 社会工程\n\n\n\n\n由于技术在几乎所有活动中的应用日益增加，公司和组织投入了巨资以确保它们所使用的技术能够免受黑客的攻击。这些公司已经开发并实施了广泛的防火墙，以防止任何可能的安全泄露。尽管通过互联网连接获取信息非常方便，但大多数互联网用户并没有安全意识。加之事实，大多数恶意黑客将精力集中在计算机服务器和客户端应用程序的漏洞上。多年来，这些黑客在收集信息以及构建对网站和网络应用程序的攻击方面变得更有创意了。考虑到在网络安全上投入的巨资，我们本以为恶意信息窃取或控制应该已经消失。然而，事实并非如此。\n\
  \n这就是我们利用社会工程学来实现目标的地方。这是一种非技术的方法，可以绕过公司的安全措施。无论公司的在线应用程序有多安全，它们仍然容易受到黑客攻击。黑客已经通过社会工程学和基于社会工程学的工具实现了这一点。社会工程学是一种实操性的黑客方法。它针对个人并操纵他们提供关键信息，从而导致安全系统的泄露。这些个人可能是组织的员工，甚至是目标组织高层的亲属，他们会被接触并迫使信任黑客。他们开始收集在黑客过程中可能有用的信息。这通常是公司防火墙能够有效阻止外部渗透时采取的方法。当黑客获取了必要信息（例如，社会工程学目标的登录信息），他们就可以从内向外对公司进行攻击。\n\
  \n人们认为，人类是任何信息安全链中最薄弱的环。。社会工程学的物理方法有多种发生方式，在本章中无法涵盖所有方法。然而，流行的手段包括接触公司员工并成为他们的朋友（甚至是亲密伴侣）。有时，员工会收到一个包含电影或其他他们感兴趣的文件的闪存驱动。员工插上驱动器并启动一个在后台执行脚本的文件，从而授予黑客访问相应机器的权限。社会工程学攻击也发生在有人给公司员工打电话时，冒充呼叫中心代表并告诉员工他们需要信息来纠正一项重要的服务。黑客可能通过员工的社交媒体账户或与该人的私人对话收集了有关员工的细节。一旦黑客获取了信息（可能包括受害者的社会安全码或登录详情），黑客就会劫持账户并在上面进行欺诈交易，或将其用于额外的攻击。社会工程学使得构建有帮助的用户名和密码列表变得简单。\n\
  \n### 社会工程学工具包 (SET)\n\n社会工程学工具包是计算机辅助社会工程学攻击中使用的非常重要的工具。它预装在 Kali Linux 中。用 Python\
  \ 语言编写，也是开源工具包。社会工程学工具包或 `SET`，由 David Kennedy 创建，用于利用安全中的人性因素。然而，确保社会工程学工具包保持更新是非常重要的。一旦工具更新，就可以设置配置文件。默认配置文件足以让\
  \ `SET` 无任何问题地运行。高级用户可能想要编辑和调整某些设置。但是，如果你是初学者，最好在变得更熟悉社会工程学工具包之前保持其原样。要访问配置文件，打开终端并切换目录到\
  \ `SET`。打开 `config` 文件夹，你将发现 `set_config` 文件，你可以用文本编辑器打开并编辑。\n\n可以通过点击应用程序图标，然后点击\
  \ Kali Linux 桌面访问社会工程学工具包。接下来，点击 BackTrack，然后点击 Exploitation Tools 选项。点击 Social\
  \ Engineering Tools 并通过点击 `SET` 选择社会工程学工具包。`SET`将在终端窗口中打开。或者，也可以直接在终端中输入 `setoolkit`（不带引号）来打开\
  \ `SET`。\n\n社会工程学工具包在终端中以基于菜单选项的形式打开。菜单包含根据你需要的社会工程学攻击类型提供的不同选项。编号 1 的选项用于鱼叉式钓鱼攻击向量，它允许用户执行钓鱼攻击。钓鱼攻击是一种电子邮件攻击。就像通过向随机潜在受害者发送电子邮件来撒网。相反，鱼叉式钓鱼针对特定的个人，且邮件更具个性化。\n\
  \n`SET` 菜单上的第二个选项是网站攻击向量，它使用不同的网络攻击方法针对其目标受害者。网站攻击向量选项是社会工程学工具包中最受欢迎、可能也是最常用的选项。点击网站攻击向量选项将打开包含\
  \ Java applet 攻击向量、Metasploit 浏览器漏洞、用于克隆网站的凭据收集器攻击、tabnabbing 攻击、中间人攻击、web jacking\
  \ 攻击和多重攻击网络方法的菜单。\n\n\n\nSocial Engineering Toolkit（SET）菜单上的第三个选项是感染性媒介生成器工具。这个工具非常易用，目标是那些能够允许黑客访问组织网络的个人，从而使黑客能够从网络内部进行攻击。该工具允许黑客创建一个包含恶意脚本的\
  \ USB 盘或 DVD，该脚本可以让黑客获取目标 shell（终端）访问权限。选择此选项将打开一个菜单，提示用户在文件格式利用程序或标准的 `Metasploit`\
  \ 可执行文件之间进行选择。选择文件格式选项将打开一个载荷列表，供用户选择。默认是一个嵌入在可执行脚本中的 `PDF` 文件。然后，该文件会被发送到驱动器，同时会创建一个带有\
  \ `PDF` 文件的 `autorun.inf` 文件。当员工在驱动器上打开该文件时，文件将在后台执行，黑客即可获得受害者计算机的 shell 访问。\n\n\
  第四个选项是 `generate-a-payload-with-listener`。此选项允许黑客创建一个恶意脚本作为载荷，并生成一个监听器。该脚本是一个 `.exe`\
  \ 文件。关键在于让目标受害者点击并下载此脚本。一旦受害者下载并执行了 `.exe` 文件，监听器就会提醒黑客，黑客即可访问受害者的 shell。\n\nSocial\
  \ Engineering Toolkit 中的第五个选项是邮件发送器。点击此选项会弹出一个包含两个选项的菜单：单邮件地址攻击和批量邮件发送器攻击。单邮件地址攻击允许用户向单个电子邮件地址发送邮件，而批量邮件发送器攻击则允许用户向多个电子邮件地址发送邮件。选择此选项将提示用户选择一个包含多个电子邮件地址的列表，然后邮件将发送到这些地址。\n\
  \n列表中的第六是基于 Arduino 的攻击。通过此选项，你获得了入侵基于 Arduino 设备的手段。而第七个选项是 `SMS` 伪装选项，它允许黑客向个人发送\
  \ `SMS`。此 `SMS` 伪装选项会打开一个菜单，可以选择执行 `SMS` 伪装形式的攻击或创建一个社交工程模板。选择第一个选项将发送单个号码或批量 `SMS`\
  \ 攻击。仅选择单个号码将提示用户输入接收者的电话号码。然后你会被要求使用预定义的模板或编写自己的消息。根据你对 `SMS` 的偏好，输入 `1` 选择第一个选项，输入\
  \ `2` 选择第二个选项。然后你输入源号码，即你希望接收者看到的 `SMS` 发送者号码。接下来，你输入想让接收者看到的消息。你可以嵌入钓鱼网站的链接或导致用户下载恶意\
  \ `.exe` 文件的页面链接。消息编写完成后，屏幕上会显示用于 `SMS` 伪装的服务的选项。其中是付费选项，另一些是免费的。\n\n`SET` 中的第八选项是无线\
  \ AP 攻击向量。此选项用于创建一个虚假的无线 AP，让毫无防备的公共 Wi-Fi 用户连接，黑客可以嗅探他们的流量。该选项使用其他应用程序来实现这一目标。`AirBase-NG`、`AirMon-NG`、`DNSSpoof`\
  \ 和 `dhcpd3` 是与无线 AP 攻击向量协同工作的所需应用程序。\n\n菜单中的第九项是 `QR` 代码攻击向量。今天，`QR` 代码无处不在，从物品识别到获取销售产品的详细信息。现在\
  \ `QR` 代码甚至被用于支付。有些网站使用 `QR` 代码进行登录或作为 Web 应用。使用这种登录方法是因为它认为是一种更安全的访问方式，因为黑客可以窃取\
  \ cookie、执行中间人攻击，甚至使用暴力破解密码获取未经授权的访问。然而，`QR` 代码使用的增加为黑客提供了更多利用受害者的途径。`QR` 代码攻击向量帮助黑客创建一个恶意的\
  \ `QR` 代码。然后黑客使用凭据收集器选项创建或克隆一个类似 Facebook 的网站，并将此恶意的 `QR` 代码嵌入指向克隆网站的链接中。黑客向受害者发送钓鱼邮件或伪造\
  \ `SMS`，提示对方用移动设备扫描代码。当受害者访问网站并输入登录详情时，这将泄露受害者的 GPS 位置和其他信息。\n\n菜单中的第十选项是 `PowerShell`\
  \ 攻击向量。此选项允许黑客在操作系统的 `PowerShell` 中部署载荷。在 Windows 操作系统中，`PowerShell` 比命令提示符更强大。它允许访问操作系统的不同区域。它由微软开发，旨在方便任务自动化和文件配置，从\
  \ Windows Vista 发布以来就一直随 Windows 系统。`PowerShell` 攻击向量允许攻击者创建一个脚本，然后在受害者的 `PowerShell`\
  \ 中执行。选择此选项将引出四个菜单选项：`PowerShell alphanumeric injector`、`PowerShell SAM database`、`PowerShell\
  \ reverse` 和 `PowerShell bind shells`。其中任何一个选项都会创建一个针对性的 `PowerShell` 程序并导出到 `PowerShell`\
  \ 文件夹。欺骗目标访问、下载并执行此程序即可为攻击者创建访问权限。\n\n到此时，你应该已经意识到 `SET` 在执行计算机辅助社交工程攻击方面是多么强大。这个工具对于渗透测试人员非常有价值，因为它提供了一种稳健且多样的方法来检查组织网络可能存在的各种漏洞。\n\
  \n## BeEF\n\n`BeEF` 代表 Browser Exploitation Framework（浏览器利用框架）。该工具包含在大多数基于安全性的 Linux\
  \ 发行版中，如 `Parrot OS` 和 `Kali Linux`。`BeEF` 最初是一个通过攻击者浏览器访问的服务器。它的创建是为了针对网络浏览器的漏洞，从而获取目标系统的命令执行权限。`BeEF`\
  \ 是由 `Wade Alcorn` 领导的团队在 `Rails` 平台上用 `Ruby` 语言编写的。如前，密码、cookie、登录凭据和浏览历史通常存储在浏览器中，因此对客户端进行\
  \ `BeEF` 攻击可能非常糟糕。\n\n但在 `Kali Linux` 上，`BeEF` 已包含在发行版中。可以通过进入应用程序，点击利用工具，然后点击 `BeEF\
  \ XSS framework` 来启动 `BeEF` 框架。这将打开一个终端，显示 `BeEF` 框架服务器已启动。一旦服务器启动，我们打开喜欢的浏览器并访问端口\
  \ `3000` 的 `localhost`。在浏览器的 URL 中显示为 `localhost:3000/ui/authentication` 或 `127.0.0.1:3000/ui/authentication`。这将进入\
  \ `BeEF` 框架的身份验证页面，需要用户名和密码。默认情况下，用户名是 `beef`；密码也是 `beef`。\n\n\n\n一旦进入 BeEF 框架，它会打开一个“Get\
  \ Started”（入门指南）标签页。在这里你将熟悉该框架并学习如何使用它。特别重要的是挂钩（hooking）浏览器。挂钩浏览器涉及点击 JavaScript\
  \ 载荷（payload），这使得 BeEF 框架能够访问客户端浏览器。有多种部署此载荷的方法，但最简单的方法是创建一个包含该载荷的页面，引导目标访问该页面并执行\
  \ JavaScript 载荷。在这方面你可以充分发挥创意。另一方面，“Get Started”页面上有一个链接，可以将你重定向到“The Butcher”（屠夫）页面。该页面下方有包含\
  \ JavaScript 载荷的按钮。点击这些按钮将执行脚本，从而挂钩你的浏览器。当你的浏览器被挂钩后，你将会在 BeEF 控制面板左侧浏览器图标旁边看到一个挂钩图标，标题为“已挂钩的浏览器”（Hooked\
  \ browser），以及在线和离线浏览器的文件夹。\n\n一旦浏览器被挂钩，无论它是在线还是离线，我们都可以从 BeEF 控制面板控制它。点击控制面板中的详细菜单可以提供如受害者浏览器版本和已安装的插件等信息。浏览器的窗口大小也可用于确定受害者的屏幕尺寸、浏览器平台（即\
  \ PC 上的操作系统）以及许多其他信息。要在浏览器上执行命令，我们点击控制面板中的命令菜单。这会弹出一系列可以在受害者浏览器上执行的不同命令。这些命令会在受害者的浏览器上创建一个弹窗消息，因此在执行之前可以对其进行创意性的重命名以避免引起怀疑。该菜单中可以执行的命令包括：Get\
  \ all Cookie（获取所有 Cookie）命令（开始收集受害者的浏览器 Cookie）、Screenshot（截图）命令、Webcam（摄像头）命令（拍摄受害者的照片）、Get\
  \ visited URL（获取过的 URL）命令等。该菜单中有许多命令。\n\nBeEF 框架的 JavaScript 载荷也可以挂钩手机浏览器。如果我们最终挂钩了手机浏览器，在挂钩后检查详情标签页将获得特定信息。点击模块并搜索\
  \ `PhoneGap` 命令允许我们执行针对手机的命令，例如定位设备和在受害者设备上启动音频录制。点击 `Ipec` 菜单还会显示一个终端，我们可以利用它向受害者系统发送\
  \ shell 命令。\n\n一旦 BeEF 框架挂钩了浏览器，可能性是无限的。我们几乎可以做任何事情。因此，在点击链接、弹出窗口或闪 消息时要非常小心。\n\n\
  ## METASPLOIT\n\nMetasploit 框架可能是今天最大、最完整的渗透测试和安全审计工具。该工具是一个开源工具，定期更新新模块以监控即使是最新的漏洞。Metasploit\
  \ 随 Kali Linux 发行版一起。它用 Ruby 语言编写，尽管在创建之初是用 Perl 编写的。该工具由 HD Moore 于 2003 年开发，并于\
  \ 2009 年卖给一家名为 Rapid7 的 IT 公司。\n\nMetasploit 是一个极其强大的工具，具有极大的通用性。要充分利用 Metasploit，你必须熟练使用终端（一种控制台窗口）。然而，有一个选项允许在\
  \ GUI 窗口中使用 Metasploit。开源工具 Armitage 使得这种可能成为可能，尽管它没有能力充分利用 Metasploit 框架攻击中的所有方面。Metasploit\
  \ 框架中的 `meterpreter` 是一个注入到受害者系统中的模块，使黑客能够控制那台 PC 并为未来对该系统的黑入保持访问权限。在 Kali Linux\
  \ 上开始使用 Metasploit 只需打开终端并输入 `msfconsole`（不带引号）。\n\nMetasploit 包含了可以在黑客期间使用的模块。其中一些模块由开源社区的开发者或贡献者编写。一组重要的模块包括载荷（payloads）。在\
  \ Metasploit 框架内执行攻击时，这些载荷至关重要。这些载荷是经过编写的代码，以便黑客能够在受害者的计算机上获得立足点。在这些载荷中，最流行的可能是\
  \ `meterpreter`。这种特定的载荷非常强大，因为它不会在系统硬盘上留下任何黑客痕迹，它仅存在于受害者的系统内存中。\n\n然后是 `Exploits`（利用）模块。这些利用程序是针对受害者操作系统中特定缺陷编写并打包的代码。针对不同的操作系统漏洞存在不同的利用程序，因此针对某一漏洞的로利用程序在用于另一个漏洞时将会失败。\n\
  \n`encoders`（编码器）模块用于对部署到目标系统的不同载荷进行编码，以避免被受害者的病毒软件、反间谍软件或其他安全工具检测。\n\nMetasploit\
  \ 框架上提供的其他模块还有 `Post` 模块（允许黑客收集密码、令牌和哈希）、`Nops` 模块（大部分允许 100% 执行载荷或利用程序）以及 `Auxiliary`（辅助）模块（不属于其他类别的）。\n\
  \n该框架非常健壮，可以执行各种黑客程序。若干程序是通过组合模块并让它们以不同的方式工作来实现的。初学者学习更多 Metasploit 框架的一种好方法是在 Metasploit\
  \ 框架控制台中输入 `help`（不带引号）。\n\n# 第八章：作为主动安全措施的渗透测试与网络安全措施\n\n## 渗透测试\n\n渗透测试是道德黑客。对于我们拥有的每种资产，我们必须提供足够的安全保障，如果这些资产被他人（可能是我们的客户）使用更是如此。如果你运行一个保存或接收用户敏感信息的网站，那么你的网站或\
  \ Web 应用必须能够被访问。\n\nPentesting：这是渗透测试的另一种说法。它是测试计算机系统或 Web 应用以寻找攻击者可以利用的漏洞实践。这是一种经过认证的模拟攻击，旨在寻找漏洞并逐渐获取系统数据的权限。它有助于确定安全策略合规性、员工的安全意识以及组织识别和响应安全事件的能力。它是非常有效的，因为如果发生入侵，它可以发现跨系统的一些最复杂的攻击向量。它还可以帮助检测黑客的攻击方法，从而防止其再次发生。渗透测试需要使用大量工具进行手动和自动测试。\n\
  \n渗透测试的过程可以简化为两个部分。第一部分与发现漏洞有关，包括所有允许测试人员运行此类操作的法律流程。第二部分涉及利用漏洞获取单台机器的访问权限，其目的是利用一个漏洞。单次成功的利用为控制网络中的其他系统打开了大门。这一特定过程被称为\
  \ `pivoting`（枢纽）。还有许多其他渗透策略，可以根据它们要应对的威胁进行选择。\n\n通常，目标测试是由组织的 IT 小组执行的。该小组与渗透测试小组合作以实现预期结果。此外，外部渗透测试针对公司外部可检测的服务器或设备，包括\
  \ DNS、Web 服务器和电子邮件服务器。主要目标是确定黑客是否可能控制网络，以及如果是，会造成多大的破坏。\n\n\n\n盲测是指测试人员仅拥有企业的细节（例如目标的名称）的情况。这种方法为安全人员提供了一些时间来调查应用程序攻击的性质以及攻击最可能发生的地方。\n\
  \n渗透测试包含了 IT 专业人员为了发现系统漏洞而采取的所有活动。虽然领先于新漏洞至关重要，但要跟上最新的黑客技术和零日恶意软件是非常的。这就是为什么在进行安全审计时，获取一份优先级测试列表至关重要。\n\
  \n# 保护您的网站\n\n为您的网站提供防止黑客的保护比以往任何时候都重要。网站所有者必须为访问者提供一个安全的上网环境。充分地保护网站可以防止其免受恶意软件感染，保护访问者的信息，提高您的网站排名，并确保您的业务能够长期运营。请记住，一旦您的网站被破解，恢复将非常困难。当您的网站宕机时，您将失去客户，声誉也会随之丢失。\n\
  \n我们讨论了网站服务器端和客户端可能被利用的各种漏洞。其中一些攻击非常难以检测，因此预防是最好的策略。\n\n如果您运行基于 `WordPress` 或 `Joomla`\
  \ 等内容管理系统的网站，请务必安装该 CMS 提供的安全插件。`Sitelock` 是一个非常有价值的工具，它可以每天扫描网站漏洞、恶意软件和病毒。投资良好的云保护服务也是一个很棒的主意，它可以过滤掉所有到达网站的内容，并筛选可疑流量和机器人。\n\
  \n最流行且最常见的网站攻击之一是 `SQL injection`。利用此漏洞可以让黑客获取私有信息。这种攻击发生在具有接受用户输入的表单字段的网站上。防止这种攻击的一种极佳方法是使用参数化查询。这确保了网站包含参数，使得无法插入恶意代码。\n\
  \n我们还讨论了跨站脚本攻击，简称为 `XSS` 攻击。我们现在知道跨脚本攻击是由于在客户端浏览器中执行 `JavaScript` 代码导致的。与 `SQL injection`\
  \ 攻击一样，防止 `XSS` 攻击要求程序员或开发者显式地声明浏览器各种用户输入字段中允许哪些条目。实现此点的一种很好的方法是实施内容安全策略，简称为 `CSP`。这将为浏览器不同的输入字段提供指令，包括哪些字段应该允许执行脚本，而哪些字段不应该允许。\n\
  \n对于需要用户登录信息的网站，在用户注册时坚持使用强密码非常重要。用户应该创建一个字母、数字和特殊字符或符号的混合密码。当用户登录网站时，确保密码经过加密也是重要的。这一措施使得黑客在碰巧执行中间人攻击时难以破解密码。此外，请记住，黑客只需要一个弱弱密码即可获得所有账户的访问权限。\n\
  \n还应确保在用户输入以及发送到服务器时，对用户输入进行适当的验证。这种客户端和服务器端的验证确保了恶意代码不会被误执行。关于浏览器，在网页上，定义需要输入的字段并确保它们遵循输入字段规范是重要的。一个用于数字的字段在内容发送到服务器进行另一阶段的输入验证之前，应该拒绝字母或特殊字符的输入。\n\
  \n如果您运行电子商务商店、银行应用程序或任何接收并存储非常敏感信息的网站，请获取 SSL 证书。这为您的网站提供了额外的安全保护。访问您网站的客户和用户看到\
  \ `HTTPS` 出现在您的网站 URL 前时会感到放心。`HTTPS` 加密了在与您的服务器之间传输的所有信息。它即使黑客正在进行嗅探攻击，使其试图获取的任何信息变得毫无用处。\n\
  \n显示给用户的错误信息应尽可能少。如果必须向用户显示错误信息，它不应包含数据库类型或错误代码等关键信息。将错误信息配置为显示通用消息是一个好主意，因为错误信息会向黑客提供有关网站或\
  \ Web 应用底层结构的信息，这些信息可用于协调针对性攻击。\n\n您的管理员用户名和密码非常强大也是重要的。确保登录页面上的登录尝试次数有限。确保在用户使用“忘记密码”链接时提问安全问题。即使用户回答正确了问题，也要避免将登录用户名、密码或其他凭据发送到用户的邮箱中。\n\
  \n确保在任何人访问您的文件之前，已设置了严格的权限。确保只有管理员可以编辑某些文件，同时保持其他文件对网站用户可读。限制网站上可以上传的文件数量也是一种实用的做法。通过文件上传，很容易嵌入恶意代码，从而使网站遭受攻击。确保所有上传的文件都保存在私有文件夹中，只能通过专门为该目的编写的脚本来显示。此外，你不应允许上传的文件到达根目录。\n\
  \n与 Web 应用和网站一样，确保我们在对项目进行编码或与程序员合作时，采用所谓的安全编码实践至关重要。安全编码实践的示例包括设计一个能够最大防止黑客的系统、单独构建每个模块、对模块进行漏洞测试并将所有内容合并，以便对整个应用程序进行其他漏洞的测试。\n\
  \n保持设计尽可能简单也是一种良好的策略。复杂的网站或 Web 应用设计更容易产生产生错误和恶意用户可以利用的问题。正如本书中反复提到的，数据清洗对于保护您的网站或\
  \ Web 应用非常重要。务必对流经您的应用程序的数据进行清洗，无论它们是来自用户、服务器甚至是第三方链接的应用程序。\n\n# 结论\n\n保护您的网站、Web\
  \ 应用和设备是一个永恒的过程。要开始工作，您应该列出您所处理的所有设备、网络、网站和 Web 应用。在完成这些之后，分析它们中的每一个，并找出黑客可以利用的各种漏洞。如果您以前遭受过攻击，它是如何发生的？在被破解之前的最初迹象是什么？这些漏洞仍然存在于系统或网络中吗？您采取了哪些步骤来减少损害，又采取了哪些步骤来确保未来不再发生？回答这些问题将为您提供视角。这些问题将帮助您发现系统中可能成为攻击重点的区域，并帮助您将更多的安全精力集中在正确的地点。它们还将帮助您确定每项工作需要什么类型的人以及能够有效执行这些工作的工具。您将能够聘用具备必要技能的人才，在不损害安全或质量的情况下完成工作。\n\
  \n\n\n你使用的安全工具至关重要，这些工具的实施也同样重要。如今的安全市场提供了许多许多可以满足公司安全需求的工具。然而，仅仅因为某个工具更昂贵或评分高，并不意味着它对你或你的团队来说是最好的。价格并不是质量的衡量标准，许多开源工具可以为你的安全需求提供出色的解决方案。你应该问的问题如下：你工作在什么样的环境中？这个特定的工具在该环境中能运行得完美吗？你的团队是否具备实施该工具的技术知识？它是否能无缝集成到你现有的网络或工作工具中？使用它的成本能转化为显著的投资回报吗？在选择安全工具以防止漏洞时，这些都是重要的考虑点。\n\
  \n通常情况下，始终了解自己的优势和优势非常重要。在制定安全策略和规划安全措施时，请扮演黑客的角色。正如俗话所：“攻击是最好的防御形式。”用黑客的思维分析你的系统，并假设黑客的角色。你会如何破解你的系统？基于你对系统的深入了解，它如何能被远程破解？黑客如何能从内部控制你的系统或网络？\n\
  \n认真对待渗透测试、风险分析和漏洞评估，并确保在你的系统中频繁执行。你有多弱取决于链中最薄弱的一环。训练并测试你的团队成员，以便他们能够有效应对网络或系统安全漏洞。如果可能，聘请安全机构对你的系统进行模拟攻击，看看他们如何反应。此外，自动化你的大部分工作是一个好主意，因为自动化将简化在系统中实施适当安全措施的难度，并在威胁出现时易于处理。\n\
  \n最后一点，务必备份你的数据。用新更改更新数据，并确保过程正确完成，以避免产生无用的损坏备份数据。这样，你就可以放心地，不必担心数据丢失。\n\n# 第九章：LINUX\n\
  \nLinux 开发于上世纪中叶，是一种被全球商业机构、工业领域和计算机用户使用的操作系统。它存在于几乎所有的可用计算机、智能手机和类似的电子设备上。Linux\
  \ 是互联网的基石和计算世界的背景。它是科学发展、计算进步和技术成就背后的大脑。Linux 仍然是人类发明的最好的操作系统之一，因为它可靠、用户友好且非常安全。\n\
  \n## 什么是 LINUX？\n\nLinux 是一种可以在任何计算机上运行的操作系统（OS）。操作系统是运行在计算机后台的强大程序，对于其他程序在计算机上运行是必需的。操作系统的示例包括\
  \ `Windows`、`Mac`、`Chrome`、`FreeBSD` 等。操作系统是计算机硬件和软件之间的桥梁。没有操作系统，计算机只是一个引擎。\n\n\
  以下是操作系统的部分。\n\n`Bootloader`（引导加载）：在计算机可以使用之前，它必须通过一个可能需要几分钟的过程进行启动。这段启动从你打开计算机时开始。`bootloader`\
  \ 是操作系统中负责这一过程的部分。\n\n`Kernel`（内核）：这是操作系统的底层，但同时也是最重要的部分。它控制操作系统的其他部分以及与系统处理相关的活动。\n\
  \n`Daemons`（守护进程）：这些是操作系统上的程序，它们在用户控制之外运行，并根据硬件活动执行。这些活动发生在计算机界面处或计算机运行时。\n\n`Shell`（外壳）：在“旧”Linux\
  \ 时代，人们有时认为他们必须学习一系列命令结构来启动 Linux。随着新的桌面级 Linux 发明，现在不再需要了。`shell` 让用户能够通过命令轻松控制或使用计算机。\n\
  \n`Graphical Server`（图形服务器）：图形服务器或 `X server` 负责在显示器上显示图像。\n\n`Desktop Environment`（桌面环境）：桌面环境包含各种隔间，显示不同的实用程序并需要用户的相应操作。它还包括在计算机上执行的应用程序和任务。\n\
  \n`Applications`（应用程序）：包括用户可以在桌面环境帮助并在计算机上安装和运行的数千软件。某些桌面环境并不按常规模式排列应用程序。与这些桌面环境不同，Linux\
  \ 提供了用户可能需要并安装的无数种软件。Linux 桌面环境包含了提供各种应用程序供安装的商店。\n\n## 为什么 LINUX 很重要？\n\n用户对 Linux\
  \ 与其他操作系统之间的差异感到好奇。为什么 Linux 被认为是人类发明的最好的软件类型之一？与其他操作系统相比，Linux 非常容易操作，并为用户创造了更少的问题。它能够防止各种硬件问题，包括病毒和蠕虫、崩溃、许可费、每月升级、清理以及与其他与其他操作系统相关的其他问题。它是免费的，因为没有与软件或服务器相关的许可费用。当我们把一个随机的\
  \ Linux 服务器的价格与 `Windows` 服务器的价格相比时，`Windows` 服务器的成本大约为 1,200 美元，这还不包括你可能想在上面运行的其他软件的许可费。此外，由于有服务器安装指南，安装\
  \ 数据库服务器和其他活动非常简单。\n\n如果你热于计算机网络的安装管理或维护，Linux 是一个很好的选择。如果你对 Linux 仍有怀疑，请考虑这样一个事实：用户很少抱怨有关病毒或不重启的问题。用户可以证明，Linux\
  \ 服务器可以运行很长时间而不重启。\n\nLinux 还以开源许可分发。正因如此，它具有以下特性：\n\n1. 自由出于任何原因运行该程序。\n2. 自由理解程序的原理并根据需要以任何方式对其修改。\n\
  3. 自由为了其他目的复制副本。\n4. 自由与其他计算机用户共享副本。\n\n发明这种操作系统的意图是清楚的。它旨在成为任何计算机用户的仆人，这意味着它是为了减轻用户使用其他操作系统的负担。他们可以投入更少的精力获得更有效的结果。这就是为什么许多计算机用户决定选择\
  \ Linux。\n\n## 发行版\n\n发行版（或“distros”）是提供给任何用户的各种形式的 Linux。无论你的计算机知识水平如何，总有一个你可以轻松操作的\
  \ Linux 版本。这些发行版是免费提供的，可以使用 `USB` 传输到另一台计算机用于各种用途。\n\n一些常见的 Linux 版本有：\n\n*   `Linux\
  \ Mint`\n*   `Red Hat`\n*   `Fedora`\n*   `Debian/GNU Linux`\n*   `Ubuntu`\n*  \
  \ `Centos`\n*   `openSUSE`\n*   `Protean OS`\n*   `Mandriva Linux`\n*   `Arch Linux`\n\
  \n\n\n\n每个发行版都有其独特的方法和相互联系，其中一些是非常新的。`Ubuntu` 和 `Debian` 是经典示例，而另一些则遵循旧有的习俗。`openSUSE`\
  \ 就是一个典型的例子。如果你是一个普通的计算机用户，学习 `Linux` 的唯一先决条件是有一台允许你安装 Linux 程序的计算机。然而，在其他情况下，一些编程知识可能非常重要。你可以开始使用\
  \ `Linux` 处理一些简单任务，如浏览网页、修改图片、发送电子邮件和听音频。`Linux` 的源代码使用易于的编程语言编写并向公众开放，以便其他人可以使用他们的母语言重现该软件。\n\
  \n对于初学者来说，以下版本非常棒：\n* Ubuntu\n* Linux Mint Cinnamon\n* Manjaro Linux\n* Linux Server\n\
  \nLinux 服务器是开源 Linux 操作系统的强大且动态的版本（例如 `Ubuntu server`）。虽然你可以免费获取其中的一些服务器（`Ubuntu`\
  \ 和 `Centros`），但另一些则需要付费，且具有额外优势且价格尚合理（`SUSE` 和 `Red Hat enterprise Linux`）。\n\n\
  要确定一个适合你操作的发行版，你必须考虑下面提到的某些因素：\n1. 你使用计算机的熟练程度。\n2. 你倾向于服务器还是桌面。\n3. 你倾向于现代还是传统的桌面界面。\n\
  \n普通计算机用户最好选择初级发行版，它们非常易于学习和使用。一些例子包括 `Ubuntu` 和 `Manjaro Linux`。然而，如果你非常练练擅长处理计算机，可以选择如\
  \ `Fedora` 和 `Debian` 这样难度较大的发行版。如果你是一个计算机高手，你可以升级到如 `Gentoo` 等复杂的发行版。\n\n如果你选择的是服务器类型，你需要在服务器发行版和桌面界面之间做出决定。你还需要确定是否将仅通过使用命令行进行操作。需要注意的是，`Ubuntu\
  \ server` 不允许安装 GUI 界面，这意味着你需要一些关于启动命令行的知识。否则，你的服务器将在加载图形界面时卡住并无法进展。另一个选项是在使用单命令行的\
  \ `Ubuntu server` 上安装 GUI 软件包。\n\n系统分析师在做出选择之前会考虑发行版的特性。哪种服务器最符合你的需求？例如，如果你需要一个自给自足、能为你选择服务器提供所有必要需求的发行版，你应该选择\
  \ `Centos`。\n\n# 如何成功执行 LINUX 安装\n\n`Linux` 是一个用户友好的操作系统，这一点怎么强调都不为过。基本上，你只需要遵循几个步骤。Linux\
  \ 安装可以直接从光盘或驱动器完成，无需对你的硬盘进行任何更改。在安装过程开始时，只需点击屏幕上显示的安装图标。安装程序通常会带有一个安装向导，作为成功安装 Linux\
  \ 操作系统的指南。以下步骤将引导你成功安装 `Red Hat` 版本的 Linuxss。请注意，你必须确保你的计算机与你想要安装的 Linux 版本兼容。你可能还需要包含一些对程序更有用的插件或第三方软件。\n\
  \n1. 首先，将 `Red Hat Linux` 盘片放入硬盘驱动器中，等待直到屏幕上显示“install Red Hat Linux”或类似的内容。一旦出现这种情况，点击“install”，安装将自动开始。程序会要求你确认用于安装的光盘是否已正确插入。不要担心这一点，继续继续安装过程即可。\n\
  2. 接下来，你需要选择你偏好的语言选项。系统将提供若干种语言供选择。完成后，你就可以进入安装过程的下一个阶段。\n3. 程序随后会询问与你的计算机匹配的键盘。同样会显示多种选项，你应该从中选择正确的键盘类型。完成后，你就可以跳到安装的下部分。\n\
  4. 在这里，程序将要求安装代码以验证你是否有许可使用该软件。在其他情况下，你可以简单地跳过此部分并进入下一阶段；但是，如果你希望充分发挥程序的功能，你需要一个许可代码。一旦你正确输入代码，将自动进行验证，你就可以自由地移动到下一步。\n\
  5. 下一步是在你的计算机硬盘上创建程序的安装路径或位置。使用驱动器上的可用空间并创建一个布局。将其设为默认，以免干扰你计算机上的任何其他操作系统。创建必要的分区及其各自的大小，以确保软件的正常运行。\n\
  6. 接下来，选择网络设置。为所需的网络地址提供必要的数据。设置正确的时间。选择你的时区并创建超级用户密码。\n7. 最后一步是完成安装过程并重启计算机。\n\n\
  # 在 Linux 上安装任何所需的应用程序\n\n几乎每个操作系统都带有一个商店（store），其中包含数百种不同的软件程序，你可以通过安装和卸载这些程序来充分发挥操作系统的性能。安装过程非常简单，特别是对于\
  \ `Linux` 来说。某些发行版采用高级软件包工具（`APT`）来轻松安装软件。`APT` 在搜索程序时会扫描硬盘中的数据库以及程序在硬盘中的各种位置。使用\
  \ `APT`，你可以输入任何软件的名称，搜索并安装它。\n\n早期的 `Linux` 由于缺少软件工具，处理起来更加困难。安装是通过 `Minix` 下的一种复杂的安排形式实现的。现在，在安排好的软件传输到正确位置后开始安装。随着\
  \ `Linux` 版本的最新进展，发行版配备了各种软件工具，包括 `Portage`。`Portage` 是复杂的 `Gentoo` 发行版使用的软件工具。这些工具最重要的点是，它们具有相同的主要功能：从各种位置编译软件以进行安装。GUI\
  \ 是极大影响这些软件工具的因素，因为许多工具需要 GUI 才能运行。\n\n对于不使用 GUI 的服务器，命令行将是下一个选择。一个例子包括 `Debian`\
  \ 和 `Fedora`，它们将使用 `apt-get` 等工具。在 `Debian` 发行版中，要安装 `apt-get`，你需要以前缀命令 `sudo`。例如，要安装\
  \ `curl` 工具，命令语句将是 `sudo apt-get install curl`。\n\n要升级发行版上安装的软件版本，你可以使用 `upgrade`\
  \ 命令。为了平衡升级依赖关系，点击 `dist-upgrade`。有可能同时安装许多软件程序。要做到这一点，可以在像 `goaccess` 等命令后列出软件名称。\n\
  \n在尝试卸载软件时保留软件文件的配置，请使用 `remove` 命令。`purge` 命令的功能是彻底删除文件，包括任何配置文件。如果你只需要软件程序的源码，请使用\
  \ `download only source` 软件包选项。\n\n# LINUX 相比于其他操作系统的优势\n\n\n\n“Linux 是人类发明以来兼容性最好的操作系统。”你现在应该已经熟悉这句话了。在这里，我们将测试\
  \ Linux 与 `Windows` 等其他流行操作系统的功能对比。Linux 虽有缺点，但它的优势远超缺点。\n\n## 成本\n\n那些不提供像 `Linux`\
  \ 那种服务的操作系统，其价格相当荒谬。在经过一段时间后，其他操作系统将需要支付费用才能升级到下一个版本。不支付这笔费用将导致操作系统的功能减少。`Microsoft`\
  \ 和其他操作系统只能在特定的计算机上授权。尝试将操作系统与另一台计算机共享将需要另一笔授权费用。这与 `Linux` 不同，`Linux` 的版本可以在尽可能多的计算机上共享而无需额外费用。除了某些高级版本外，所有\
  \ `Linux` 版本都是免费的，这些版本在授权或升级方面几乎不需要费用，且只需支付一次费用。\n\n## 安全性\n\n抛开成本，让我们在安全性维度上衡量包括\
  \ `Linux` 在内的操作系统。`Linux` 的安全性强度远超其他操作系统。有了 `Linux`，就不存在更新杀毒版本的需求。其他操作系统并非如此。一个\
  \ `Linux` 程序可以运行多年而不受恶意软件、病毒或蠕虫的威胁。`Linux` 程序的开源使得任何随机用户在病毒影响系统时几乎都能立即清理系统。而在其他操作系统上，你必须等待负责的公司提供病毒的解决方案。\n\
  \n## 选择（自由）\n\n作为一名 `Linux` 用户，你有能力以许多方式控制操作系统。你可以控制的两个非常重要的事情是桌面显示内核内核`kernel`）。在\
  \ `Windows` 中，默认显示可能会让你无所适从，并导致你因尝试安装某种第三方外壳而破坏系统。\n\n## 软件\n\n有成百千个软件程序可以使用来完成你的主要任务。如果你想修改命令行，你有各种选项可供选择。每天，普通用户都可以升级\
  \ `Linux` 程序中已有的功能特性，添加新功能并改进应用程序使其运行得更顺畅。此外，来自 `Linux` 的应用程序或软件比任何随机软件都有更多的特性和功能。源代码随处可用，几乎所有软件都是免费安装的。此外，如果你是一个熟练的程序员，你可以编辑源代码并根据自己的喜好发明新功能。所有这些只有在\
  \ `Linux` 中才能实现。\n\n## 硬件\n\n`Linux` 适用于处理能力或存储空间极小或没有的旧电脑。运行在你电脑上的 `Linux` 程序可以充当防火墙甚至甚至是备份服务器。几乎没有\
  \ `RAM` 的旧电脑也能流畅地运行 `Linux` 程序。\n\n## 灵活性\n\n无需担心反盗版的小花招。当你访问安全论坛时，你会看到很多问题得到了解答，并提供了安全问题的解决方案。你有权执行单次杀毒测试，以及其他控制方案（`SELinux`、`grsecurity`\
  \ 等）。在其他操作系统上，可能有超过 50 种杀毒测试、反恶意软件应用、入侵防御应用以及其他几种安全应用可能会让你困惑。\n\n## LINUX 的缺点\n\n\
  ### 学习\n\n在尝试学习 `Linux` 操作系统及其功能时，你必须保持耐心。你必须决心投入所需的时间，这可能会让你跳出舒适区。为了让这个学习过程变得更容易，你应该向那些已经拥有\
  \ `Linux` 知识和经验的人寻求帮助。\n\n### 兼容性\n\n虽然 `Linux` 是免费的，但它确实有一些缺点。`Linux` 在品牌硬件亲和性方面存在缺陷。`kernel`\
  \ 的贡献者和维护者勤奋地每天更新 `kernel`。与许多操作系统不同，`Linux` 在企业支持方面提供的很少。你能找到第三方应用程序就已经很幸运了。\n\n\
  ### 替代程序\n\n尽管 `Linux` 程序员们已经很好地为 `Windows` 等流行操作系统创建了替代软件，但某些 `Windows` 软件在 `Linux`\
  \ 上完全找不到。一些示例包括 `Chrome OS`、`FreeBSD`、`Syllable`、`ReactOS` 和 `Haik`。\n\n## 高级 UNIX\
  \ 编程对比 Linux\n\n一位 `Linux` 用户讲述了她第一次遇到 `UNIX` 的经历。她在 1972 年还是个孩子时遇到了 `UNIX`。当时她正前往\
  \ `Bell Labs`，那是 `UNIX` 发明的地方。经过很长一段时间，像她那样的程序员变得非常熟悉被称为 `UNIX` 的“主要内容”。尽管当时 `Linux`\
  \ 也已经存在，但她对它持怀疑态度，并不相信 `Linux`。这可能不是她见过的第一个 `UNIX` 克隆版本，因为她曾发表过关于具有类 `UNIX` 特性系统的评论。该评论于\
  \ 1985 年发表在《BYTE》杂志的一期上。她得出结论认为，在系统调用方面，`Coherent` 是相当可靠的，尽管命令并不真正相似。然而，它无法匹配典型\
  \ `UNIX III` 系统的工业强度。\n\n20 世纪 90 年代初，从 80 年代后期开始，衍生自 `AT&T` 的 `UNIX` 系统无处不在，因此隆并没有太吸引她。此外，由于\
  \ `AT&T` 硬件成本昂贵，每个二进制代码的费用对总成本几乎没有影响。她和其他人一样，她从未知道 `Idris` 和类似的克隆版本最终会消失。\n\n她在\
  \ 1990 年到 1991 年间参加一次会议时，随后注意到一个类似的系统。她遇到了熟悉 `BSD UNIX` 的人，它不包含 `AT&T` 的代码。在那个时期，问题不是运行在几乎免费的\
  \ `Intel` 基础上的。`GNU` 的主要目标是一套完整的操作系统。不久后，她偶然发现了 `Linux`。虽然这个名字对她听起来很熟悉，但她想不起第一次在哪里听到的。她唯一记得的是她急切想知道\
  \ `Linux` 是什么。与此同时，她正领导着由一群程序员进行的研究。大约 1998 年，该团队在一次实验使用了 `Linux`。她感到震惊，因为在当时运行\
  \ `Linux` 程序的概率几乎为零。\n\n\n\n\n在市场营销方面，Linux 取得了巨大进展，这得益于关于微软动荡、SCO 诉讼以及 Sun 公司的衰落的报道。即使不考虑\
  \ Linux 在社会和国内收益，情况也是如此。\n\n与 UNIX 克隆版本不同，Linux 以及大多数其他源自 BSD 的系统拥有开源文件，因此用户可以操纵甚至开发该文件。这意味着不仅是用户可以访问源代码，工程师也可以。计算机用户可以在没有外部协助的情况下创建并改进自己的内核。或者，他们可以找到发行版并决定自己解决一切问题，探索程序，学习软件的细节，并在此基础上创造出更好的东西。\n\
  \n尽管某些操作系统也是开源的，但 Linux 启动或维持一项事业所需的资源极少。像 HP 和 IBM 这样成熟的软件和硬件营销商严重依赖 `SUSE` 和 `Arch\
  \ Linux` 来生存。如今许多大型 Linux 用户处于“地下”状态，以规避 `SCO` 的雷达。Linux 的另一个增长动力来自沃尔玛，因为该公司从中获利。\n\
  \n事实上，Linux 可以取代 `UNIX`。尽管它们并非真正相同，但在某些方面是相似的。如果对 Linux 企业版进行修改，也许这些软件程序之间的差异可以被弥合。\n\
  \nLinux 在卖家和软件用户中变得越来越流行。在经历了开源的体验后，消费者现在正向 `Sun`、`Microsoft` 等大多数闭源发行商处订购。最初被认为无不可侵的现有供应商正开始意识到\
  \ Linux 在消费者市场的影响，因为 Linux 威胁要占领企业桌面。\n\n对于那些仍处于发展阶段的国家来说，Linux 是一个很好的选择。它可以被有效地训练其工人，这些工人可以获取并使用它，而不会浪费资金，也不会违反机构与用户之间的知识产权协议。\n\
  \n## Linux 开发进程\n\n操作系统虚拟化技术被系统地用于在特定的 Linux 宿主机上创建多个 Linux 环境。与其他虚拟设备或虚拟机不同，Linux\
  \ 容器永远不会允许奇异的操作系统运行；相反，它将宿主操作系统的内核进行切分，并提供部分客户操作系统以允许必要的操作系统功能。没有哪个操作系统是完全忠实的，因此\
  \ Linux 容器的初始化速度比虚拟机得多。\n\n一些内核亮点，例如 `profiles`、`chroot` 和 `CGroups` 内核功能正被 Linux\
  \ 容器用于创建类似于虚拟机的的内容。Linux 中的安全模块允许进入主机，同时控制容器内核以防止任何未经授权的访问。此外，只要操作系统能够在同一 CPU 上同时运行，容器可以直接从宿主机操作系统中容纳多个\
  \ Linux 版本。\n\n关于各种 Linux 发行版，Linux 容器将提供生成容器镜像的方法、用于生命周期的 `APL`、随 `APL` 移动的工具、快照功能以及将容器实例传输到不同主机的方法。\n\
  \n## 容器历史\n\n`chroot` 这种容器发明于 1979 年，被称为 `UNIX Chroot`。该操作系统与 `UNIX` 操作系统几乎相同。当时需要将进程的根目录传输到系统上的新位置，只有可见的进程才能感知到，因为每个进程都需要空空间。这一特性在三年后被包含在\
  \ `BSD` 中。\n\nWoolworth 在 2000 年发明了第一个容器之一。该操作系统与 `Chroot` 相似，但包含了一些用于分离文件系统、用户和网络的新元素和特征。它提供了一种通过\
  \ IP 地址识别监狱（jail）、配置和安装的方法。\n\n“Linux 服务器”是一个用于描述特定监狱特征的术语，该功能作为处理单元（网络 IP）上资源的加固隔离。创建的部分和视觉系统分别被称为“安全内容”和“虚拟专用服务器”。\n\
  \n`Solaris` 容器发明于 2004 年用于特殊系统，第一版 `Solaris` 于 2005 年发布。`Solaris` 容器结合了各种控制和各种区域（zones）创建的空间。这些区域完全在指定的限制内运行，限制由操作系统的边界组成。\n\
  \n`Open VZ` 发明于 2005 年，与 `Solaris` 相同。它通过使用 `Linux kernel` 创建可视化和其他显著特征。每个 `Open\
  \ VZ` 容器都拥有一个抽象文件系统。\n\nGoogle 启动了一个进程容器来管理资源包并收集各种进程。随着时间的推移，名称改为“控制组”（control\
  \ group），以避免当 `Linux kernel` 版本集成到另一个 `Linux kernel` 版本中时，“容器”一词可能与其他含义混淆。\n\n`LXC`\
  \ 是“Linux container”的缩写，是第一代容器管理器。它通过使用 `Linux` 中的命名空间发起的，并存储在 `LXC` 程序集中。它为各种 `APIs`\
  \ 提供了语言脚本。另一个需要注意的重要点是，`LXC` 容器可以在无补丁的情况下运行。此外，`Canonical Ltd.` 为资金并支持任何 `LXC` 项目。\n\
  \n2011 年，`Warden` 被 `Cloud Foundry` 激活。在激活过程中使用了 `LXC`。在 `Warden` 完全开发后，该程序被替换为\
  \ `LXC`。尽管 `LXC` 和 `Warden` 之间不存在强关系，但后者可以在任何可以建立分离环境方法的随机操作系统上运行。`daemon` 可以在 `Warden`\
  \ 上运行，因为它为控制容器提供了一个主 API。\n\n`LMCTFY` 是“let me contain that for you”的缩写。它作为应用容器的提供者，因为它向\
  \ `libcontainer` 贡献想法的开源项目。正如此，`LMCTFY` 没有进行任何更新。`Docker` 启动了 `libcontainer` 任务，现在\
  \ `OCF`（开放容器基金）接管了它。\n\n2016 年初，`Docker` 的使用像野火一样蔓延。它在大范围内得到了认可。一家名为 `dotCloud`\
  \ 的流行公司实际上命名了 `Docker` 并开发了它。就像 `Warden` 一样，`Docker` 在起始阶段借用了 `LXC`。随着容器的增长，`LXC`\
  \ 被 `Docker` 的 `libcontainer` 替换。`Docker` 的重要性之一是它提供了一个可以管理其他容器的环境。容器由分层且高效的镜像模型组成。它本质上是不同容器、`API`\
  \ 等的注册表。最近，`Docker` 开始生产一种名为 `Docker Swam` 的容器，提供各种管理选项。\n\n`CoreOS` 为了复制 `Docker`\
  \ 容器，设计了一种非常相似但改进得多的容器，名为 `Rocket`。它于 2014 年建立。`CoreOS` 的真实目的是设计一种比 `Docker` 更安全的容器。在应用容器方面，它被视为标准。`CoreOS`\
  \ 生产其他同品牌的类似容器，包括 `Docker` 示例如 `CoreOS`、`flannel` 等。\n\n\n\n\n\n几年前，有一种标准方法可以将软件应用程序的容器从虚拟机中迁移。开展这一过程的一个主要原因是为了确保与虚拟机相比，容器具有灵活且廉廉的价格。在与\
  \ `Borg` 和 `Omega` 容器管理进行多年合作后，Google 成功地实现了在海量平台上运行 Google 应用程序的容器化知识。通过参与 `libcontainer`\
  \ 程序并强制执行 `cgroups`，Google 成功丰富了容器社区。长期以来，Google 通过有效最大化容器效益取得了巨大成就。一段时间后，在服务器产品线中缺乏虚拟机的微软，通过在其服务器上提供容器，弥补了这一缺陷。\n\
  \n由于不同的容器暴露于单点故障风险，在软件测试设置中，不同的容器无法在单个主机上运行。如果它们共同在那个单机主机上运行，该主机的故障也会影响这些容器。为了避免这种情况，使用了容器集群。Google\
  \ 采取了这一行动并利用了一个名为“Kubernetes”的容器集群，它是开源的。另一方面，`Docker` 发明了 `Docker swam` 解决方案，但该方案在市场上尚未被完全接受。\n\
  \n另一个值得关注的软件或程序是利用容器的 `Microservices`（微服务）。微服务是 Web 功能的简单用法，启动速度比标准的 Web 函数更快。实现这一点的方法是将功能单元分组在单个服务中，并将其注入到简单的\
  \ Web 服务器中。\n\n深入思考这些因素，我们可以预见到在几年后，虚拟机将被挤出并完全被容器取代。几年前，专家们合作在 `POC` 阶段实施了容器解决方案。然而，一些专家想冒险在制造环境中对其进行测试。随着集群随时间的推移而发展，现状将发生快速变化。\n\
  \n# KALI LINUX\n\nKali Linux 是一个 Linux 发行版的名称，其特征包括针对 `Debian Linux` 类型的高渗透测试和安全平衡。Kali\
  \ Linux 拥有广泛的设备，用于保护和安全目的，如研究、测试和反向工程过程。Kali Linux 背后的赞助商是声誉卓著的“OFFENSIVE SECURITY”，他们专注于信息和网络安全。\n\
  \n2013 年 3 月，Kali Linux 以 `Debian` 发行版质量内核的形式正式发布，以取代旧的 Linux “Back Track”。与几乎所有的\
  \ Linux 版本一样，Kali Linux 对任何用户都完全免费。此外，远程无线支持是所有 Linux 发行版中无线链接的常态。Kali Linux 运行在不同的硬件上，并设计为尽可能服务于无线网络。\n\
  \nKali Linux 带有许多不同的渗透特性。作为 `Back Track` 的升级版本，它带有许多新功能。`Back Track` 中出现的许多故障和错误都得到了改进。\n\
  \n开源 `Git` 树是一个免费的 Windows `Git` 客户端，致力于增加和改进操作系统的源代码。开发树对任何意图以任何方式重构程序的用户开放。此外，`FSH`\
  \ 选项允许用户访问库、文件和帮助部分。Kali Linux 严格遵守文件系统标准。\n\n许多渗透测试人员会进行广泛的无线调查，以便在内核包含注入补丁。因此，Kali\
  \ Linux 在一个加固且安全的氛围中开发。Linux 开发者是一群受信任的个人团队，他们熟悉这些软件包，并可以访问保存和存储文件的网站。每个 Linux 发行版上都有其开发者或工程师的签名。软件包也经过了签名。\n\
  \n所有的渗透工具最初都是用英文编写的，尽管 Kali Linux 拥有多语言辅助，允许不同语言的用户使用该软件包。此外，许多用户可能对构建方式不满意，因此用户有一个选项可以根据喜好更改软件，从内核开始。\n\
  \nKali Linux 还拥有对 `ARMEL` 和 `ARMHF` 的支持。具有单板系统的 ARM 设备（如 `Black`、`Raspberry Pi`\
  \ 等）变得非常流行且昂贵。在这方面，Kali Linux 自身的 `ARM` 支持将非常广泛，使其能够同时与 `ARMEL` 和 `ARMHF` 设备工作。Kali\
  \ Linux 存在于嵌入了其主分支特征的各种 `ARM` 设备上。由于此，`ARM` 随发行版不断升级。\n\nKali Linux 专门为专攻渗透测试的用户设计。渗透测试有助于最大化\
  \ Kali Linux 程序的使用并防止攻击。由于 Kali Linux 设计用于满足高强度渗透测试和专业安全的标准，该软件已进行了许多更改。由于 Kali\
  \ Linux 设计为在单根用户设置下运行，渗透测试中使用的某些工具也经过了修改。\n\n在禁用的网络服务方面，Kali Linux 具有一些特殊功能，包括自动关闭网络服务的钩子（hooks）。这些钩子允许在\
  \ Kali Linux 上同时进行不同的安装过程，确保发行版对于其安装的任何内容受到自动保护。某些特殊服务也自动包含在软件中。\n\n# 安装 KALI LINUX\n\
  \n在桌面上安装 Kali Linux 并不困难。通常，第一要工作是获取一个能够容纳该软件的桌面。能够容纳 Kali Linux 的系统包括 `AMD64`、`i386`、`ARMEL`\
  \ 和 `ARMHF`。所需的硬件如下。改进的硬件运行得更好。例如，`i386` 镜像具有自动内核，以便它们可以在 4GB 内存上运行。Kali Linux 可以拷贝到磁盘、下载或通过使用\
  \ Linux 驱动器作为安装介质。\n\n在考虑安装 Linux 之前，你必须具备以下条件：\n\n*   20 GB 或更多的可用空间用于安装软件\n* \
  \  最少 1 GB RAM，以及 `i386` 或 `AMD64` 设计\n*   CD 驱动器或 USB 支持\n\n### 启动安装过程\n\n1. 首先，成功下载\
  \ Kali Linux 程序。\n2. 将 Kali Linux 拷贝到磁盘或 `ISO` 中。\n3. 确保你的系统已准备好从 CD 启动。\n\n###\
  \ 遵循以下步骤操作\n\n1. 从你最初选择的方法开始。`Kali Boot` 将弹出。选择一个安装选项：图形模式或文本模式。我们将选择 `GUI` 安装选项。\n\
  2. 接下来，选择首选语言选项和位置。将显示一个包含多个国家选项的列表，你可以在其中选择特定的国家。你还被要求选择并配置带有键位的键盘类型。\n3. 确认你的位置。\n\
  4. 镜像将自动拷贝到硬盘。你的网络将被扫描，然后你需要从设备提供一个主机。例如，我们可以输入 `KALI LINUX` 作为主机名。\n5. 你可以手动输入域名或默认选择。\n\
  6. 你的设备需要一个非 root 用户。\n7. 根据你提供的所有信息，程序将自动创建一个身份账户。\n8. 将时间调整为你地理区域的时间。\n9. 系统将进行调查，并基于此显示几个选项。在本例中，我们将采用整个磁盘而不是\
  \ `LVM`。然而，一些专家更倾向于使用手动过程进行配置。\n\n\n\n\n\n10. 选择要分区的磁盘。\n\n11. 确定你是希望将所有文件保护在特定的分区中，还是将它们分离到你任意数量的分区中。\n\
  \n12. 现在，程序将要求你检查已提供的所有信息，以确认你提供的信息是否正确，或者是否存在可能阻程序运行的错误。一旦完成此操作，信息将被永久保存且无法撤销，请务必小心。\n\
  \n13. 在 `Kali` 中，有一个用于发布应用程序的核心注册表。必须提供正确的地址和信息。然而，如果你选择 `NO` 选项，你将**永远**无法从 Kali\
  \ 应用注册表安装内容。\n\n14. 安装 `Grub`。\n\n15. 最后，关闭或重启系统以完成安装。\n\n你现在已完成安装。你可以根据需要更改程序以产生结果。以下是你可以选择深入研究的测试方法：\n\
  \n* 伦理黑客\n* 渗透测试\n* 漏洞评估\n* 安全审计\n\n## Web 服务器分析\n\n在针对一家公司时，首要采取步骤之一是在不让对方发现的情况下收集大量信息。这些信息的来源通常是基于互联网的资源，包括\
  \ `CNN` 新闻网站、域名数据库（`DNS`）、`EDGAR` 数据库和搜索引擎。你可以通过以下三个步骤了解更多关于公司的安全措施的信息：\n\n1. 足迹探测\
  \ (Foot printing)：此步骤收集信息并对公司的安全状况进行特定的画像。足迹探测使用简单的工具收集诸如行政和账单信息，包括员工姓名、电子邮件、地址和位置。所有这些数据都可以从互联网轻松获取。\n\
  \n2. 扫描 (Scanning)：在扫描过程中，通过端口扫描、ping 扫描和操作系统识别来检测通过互联网可用且可访问的系统。在此处提取的信息涉及系统架构和特定的\
  \ `IP` 地址。\n\n3. 枚举 (Enumeration)：这一步简单地使用特定于操作系统的技术（如路由表、系统横幅、用户和组名以及 `SNMP` 信息）从系统中提取有效账户。\n\
  \n当完成这些操作后，由于信息是被动的，即使公司安装了 `IDS`（入侵检测软件），它们也无法检测到是谁在收集关于它的信息。\n\n在进行渗透测试的过程中，你必须收集信息、获取目标网络的详细地图并进行完整评估。你必须能够识别网络中的每个相应系统。信息收集分为两类：被动信息收集和主动信息收集。\n\
  \n## 被动与主动信息收集\n\n我们可以将被动信息收集定义为通过难以追溯到发现者 `IP` 地址的媒体收集信息。它也被称为开源情报，通过寻找基于互联网的信息来工作。你可以访问到对被动信息收集有用的价值信息。这些信息可以用于构建地图、理解组织结构并评估员工及其与其他公司的关系。这些信息可以在之前提到的数据库中找到，例如\
  \ `EDGAR` 数据库或存档的公司信息。由于这些信息是公开的，因此存储它们既不违法也不违道德。大多数数据库都为你提供了轻松访问这些信息的工具和资源。公司首页是一个宝贵的资源，可用于揭示敏感信息。可以在不经公司检测或直接连接的情况下获取信息。价值信息，如公司位置、网络和系统以及所有权信息是在被动信息收集期间收集的。在收集被动信息时，收集位于目标网络系统的存档信息非常重要。需要进行不同的搜索，搜索信息列表包括：\n\
  \n* 目标网络存在情况（注意：这不仅是指网页）\n* 与目标相关的搜索引擎信息\n* 包含员工或公司数据的 Web 组\n* 员工的个人网站\n* 安全和交换数据，以及关于目标的任何额外财务信息\n\
  * 运行时间统计网站\n* 目标发布的职位公告\n* 用于额外信息的存档网站\n* 新闻组\n* 域名注册商\n* 目标是否通过第三方服务提供反向域名系统 (`DNS`)\
  \ 信息\n\n主动信息收集是被动信息收集的相反面。在这里，你通过连接到目标（公司）来收集信息。当你收集信息旨在更好地了解现有的结构和系统时，公司会意识到你的意图。主动信息收集并不比被动信息收集更有用，因为存储的信息可能会发生泄漏。这在渗透测试期间可能有用，使得主动信息收集与被动信息收集相似。当信息与网络相关时尤其如此，因为起初很难从公共存档中找到隐私信息。\n\
  \n## 反向映射 (INVERSE MAPPING)\n\n这是一种利用思想和假设寻找缺失环节来收集主机主机信息的技术。反向映射使用 `RESET` 扫描并从路由器获取信息，路由器提供了网络的内部架构信息。路由器扫描\
  \ `IP` 地址并根据扫描结果做出。。会对无法访问的地址提供反馈。可以调查路由器以获取 `IP` 列表，结果用于映射目标网络的 `IP`。\n\n域名查询答案从探测计算机发送，随后它通过回答域名问题，以提取针对不存在的主机的\
  \ `ICMP` 不可到达消息。\n\n## 端口扫描 (PORT SCANNING)\n\n端口扫描有两个目标：\n\n1. 验证目标系统是否存在并查看这些系统中哪些是存活的。\n\
  2. 获取接受连接的通信通道列表。\n\n端口扫描有四种：\n\n1. 隐身扫描 (Stealth scan)\n\n这种允许你通过过滤规则并避免网络流量的扫描技术。最流行的隐身扫描技术是显式的，通过\
  \ `XMAS` 扫描、`NULL` 扫描、`SYN/ACK` 扫描和 `FIN` 扫描执行。\n\n`XMAS` 扫描称为圣诞树扫描，发送带有 `FIN`、`ACK`、`PST`\
  \ 和 `RST` 标志的 `TCP` 包。`NULL` 扫描使用 `TCP` 包关闭所有标志，并在探测系统向所有关闭端口发送 `RESET`。`NULL` 扫描适用于大多数\
  \ `TCP` 实现，无论运行在什么操作系统上。`SYN/ACK` 是三次 `TCP` 握手的第一步。`TCP` 将数据包识别为错误并发送 `RESET` 以断开连接，这正是检测关闭端口状态的正确响应。这是因为如果数据包来自开放端口，`SYN/ACK`\
  \ 隐身扫描将忽略该包。`FIN` 扫描使用 `FIN` 包探测目标端口系统，然后等待其响应。\n\n2. TCP 连接扫描 (TCP connect scan)\n\
  \n\n\n\n这种扫描使用基础 TCP 连接为目标机器上感兴趣的端口建立机制。扫描向特定系统发送一个 `SYN` 包，并等待读取其使用的数据包类型。如果收到的响应是\
  \ `SYN/ACK` 包，则该端口处于`LISTENING”（监听）状态。如果扫描接收到 `RST/ACK` 包，则该端口不处于`LISTENING`状态，连接将被`RESET”（重置）。在收到\
  \ `SYN/ACK` 的情况下，我们可以发送一个 `ACK`。当整个连接建立过程完成后，连接将终止。唯一的问题是 TCP 扫描很容易被检测。\n\n### 3.\
  \ TCP SYN 扫描\n\n也称为半开放扫描，它与 TCP 连接扫描不同，因为它不允许与目标机器上感兴趣的端口建立完整连接。系统发起并发送一个 `SYN`\
  \ 包。如果你收到 `SYN/ACK` 包，则表示该端口是`LISTENING`端口。如果收到 `RST/ACK` 包，则表示该端口是非监听端口。当收到 `SYN/ACK`\
  \ 包时，连接会被断开并`RESET`。这会终止 TCP 握手，且对站点的扫描尝试不会记录任何日志。\n\n### 4. 代理扫描/文件传输协议反射扫描\n\n\
  在代理扫描中，攻击者尝试连接到具有可写目录的 FTP 服务器，建立控制通信连接，并请求 FTP 服务器启动活动数据传输过程，以便其跨互联网发送文件。\n\n##\
  \ 端口扫描技术\n\n有很多端口扫描技术，但我们将只讨论五类：\n\n1. `Slow scan`（慢扫描）\n2. `Fragmentation scan`（分片扫描）\n\
  3. `Random port scan`（随机端口扫描）\n4. `Decoy scan`（诱骗扫描）\n5. `Coordinated scan`（协调扫描）\n\
  \n慢扫描利用入侵检测系统判断是否有特定 IP 地址试图扫描相关网络。这被称为站点检测阈值；攻击用户通常非常有耐心，给扫描留出足够的运行时间。\n\n在分片扫描中，所有携带数据的\
  \ IP 包都会被分片，并使用 TCP 进行数据分片。这种分片将目标端口和源端口与发送的第一个包关联。通常需要 8 字节的数据来包含源和目的端口号。这会将 TCP\
  \ 标志推入第二个分片，而某些入侵检测系统和过滤设备在扫描期间会假设被扫描的网络已经通过访问列表检查，从而进行重组。Linux 是一个很好的例子，因为它在`CONFIG_IP_ALWAYS-DEFRAG`内核选项上有一个过滤设备。\n\
  \n随机端口扫描通过对探测端口序列随机化来防止检测。它使用商业入侵检测系统搜索连续的连接尝试。当模式发现匹配时，就会报告端口扫描。\n\n某些网络扫描器在攻击期间启用了诱骗功能或使用了伪造地址。诱骗功能会导致入侵检测系统假设目标网络正受到所有主机的端口扫描，因此钓出真正的攻击者几乎是不可能的。在过去，入侵检测系统通过使用扫描数据包中的\
  \ `TTL`（存活时间）字段值来检测诱骗主机。如果 `TTL` 值是恒定的，它们看起来就像是出厂生成的。在诱骗主机中检测真实扫描的另一种方法是追踪源地 IP\
  \ 地址的路由。如果使用了不可路由的 IP 地址，将导致拒绝服务。当 IP 地址属于网络上不存在的主机时也可能发生这种情况。为了防止这种情况发生，攻击者会使用已经运行的主机的伪造\
  \ IP 地址。\n\n协调扫描用于针对单个主机或整个网络。当攻击者合作以实现试图非法访问目标网络的共同目标时，扫描就是协调的。当多个 IP 地址探测目标网络时，它们都从不同的机器在不同的时间进行探测，这使得检测这些扫描几乎成为可能。协调攻击如果执行得当，是探测目标最有效的方法，因为它几乎无法被检测。\n\
  \n识别运行在目标主机/机器上的操作系统是非常重要的，因为有很多安全漏洞依赖于操作系统。攻击者可以扫描范围 IP 地址以获取 UDP、TSP 端口及其操作系统类型。当发现依赖于操作系统的安全漏洞时，系统只需要通过列表并匹配信息即可。\n\
  \n有许多服务可以识别操作系统。最著名的是`TELNET` 服务。识别操作系统的第二个服务是 `DNS HINFO Record`记录，它使用主机的信息记录来配对识别主机操作系统和硬件类型的字符串。`DNS\
  \ HINFO Record` 效果并不理想，因为它已经过时了，结果是大多数管理员都避免使用它。\n\nTCP 栈实现中的不同变体用于通过栈指纹识别技术确定远程操作系统。IP\
  \ 栈指纹识别的原理在于，它向目标 IP 发送 TCP 包并等待响应，这种响应在不同的操作系统上是不同的，并且随着不同厂商对 IP 栈的实现而异。\n\nTCP\
  \ 栈指纹识别使用 `Nmap` 和 `Questo` 等工具。`Nmap` 拥有比任何其他工具更大的操作系统响应数据库。为了获得最准确的结果，`Nmap` 需要目标主机上至少有一个端口开放。\n\
  \n以下是用于确定操作系统类型的探测类型和过程：\n\n* fin 探测\n* 虚假标志探测 (bogus flag)\n* TCP 初始序列采样\n* 初始窗口\n\
  * ACK 值\n* ICMP 错误消息抑制\n* “不分片位”\n* ICMP 消息引用\n* ICMP 错误消息回显完整性\n* 分片处理\n* TCP 选项\n\
  \n### 1. FIN 探测\n\n要使用 `FIN` 探测，我们针对一个开放端口并发送 `FIN` 探测。然后等待回复。理想情况下，这种回复不会到来。`RFC793`\
  \ 的预期行为确保 `FIN` 探测不会收到响应。大多数栈实现将通过 `RESET` 响应。这些系统包括 Windows、CISCO、BSDI、IRIX 和 HP-UX\
  \ 以及 MVS，它们会返回 `RESET`。\n\n### 2. 虚假标志探测\n\n此类探测使用带有未定义标志的 `SYN` 包并将其发送到目标主机。运行内核早于\
  \ `2.0.35` 的 Linux 操作系统设备将在其返回的响应中记录标志集。然而，某些操作系统在收到 `SYN+BOGUS` 探测时似乎会`RESET` 连接。\n\
  \n### 3. TCP 初始序列号采样\n\n在这里，我们可以搜索在 TCP 实现中为了响应链接或连接请求而最初使用的序列号的模式。\n\n我们可以将其分为不同的组：\n\
  \n* 传统的 64k（旧版 Unix）\n* 随机递增（如 DG-UX、新版本的 Solaris、FreeBSD、IRIX）\n* 使用时间依赖系统的窗口框（MS\
  \ Windows）\n* 真正的“随机”（OpenVMS、Linux 等）\n\n### 4. “不分片位”\n\n为了提高性能，某些操作系统会设置“不分片位”。\n\
  \n监视这种行为可以为攻击者提供有关目标操作系统的额外信息。\n\n### 5. TCP 初始窗口\n\n多个栈实现的返回数据包的初始窗口大小是独特的。例如，AIX\
  \ 仍然是使用 `0x3F25` 值的操作系统。`FreeBSD` 和 `OpenBSD` 使用 `0x402E`。\n\n### 6. ACK 值\n\n在某些情况下，由于\
  \ `ACK` 字段中设置的值存在差异，IP 栈可能会发生更改。\n\n\n\n\n例如，假设你向 TCP 关闭的端口发送了“FIN|PSH|URG”消息。在大多数实现中，返回数据包中的\
  \ `ACK` 被 设置为与序列号相同。Windows 对带有 `+1` 序列号的 `ACK` 字段响应得更好。\n\n### 7. ICMP 错误消息抑制（quenching）\n\
  \n某些操作系统遵循 `RFC 1812` 的建议，限制各种错误消息的发送速率。众周知的只有少数操作系统遵循该 `RFC`。例如，在 `Linux` 内核中，目标不可到达消息的生成被限制为每秒\
  \ 80 个。如果超过此限制，将会有四分之一秒的惩罚。为了测试这一点，黑客可以生成大量数据包并发送到随机选择的几个高 UDP 端口。然后，黑客将统计不可到达消息的数量。\n\
  \n### 8. ICMP 消息引用（quoting）\n\nICMP 错误消息应该引用引发错误的 ICMP 消息中的极少量信息。当接收到 IP 头加八个字节（`IP\
  \ header+8byte`）的“PORT UNREACHABLE”消息时，收到的信息就会被引用。\n\n### 9. ICMP 错误消息回显完整性\n\n\
  当发回 ICMP 错误消息时，某些栈实现可能会拦截 IP 头。如果攻击者检查了头部所做的各种更改类型，攻击者可能会对目标操作系统做出某些假设。\n\n### 10.\
  \ 服务类型（TOS）\n\n在发送了“ICMP PORT UNREACHABLE”消息的情况下，攻击者应该检查 `TOS` 字段。在大多数实现中，该错误使用数字\
  \ `0`。然而，在 `Linux` 中始终使用 `0xC0`。\n\n### 11. 分片处理\n\n在处理 `IP` 的重叠分片时，不同的栈实现方式不同。在某些情况下，新部分用于覆盖旧部分，而在其他情况下，重新组装分片时情况则相反。\n\
  \n### 12. TCP 选项\n\n并非所有主机都实现 TCP 选项。一旦你向目标主机发送带有设置选项的查询，目标主机只有在支持它时才会在回复中设置该选项。现在，如果发送一个包含所有选项的数据包，就可以同时测试所有选项。在检查响应包时，你需要检查所有的选项字段，查看是否有任何一个被设置了。某些操作系统支持所有高级选项，而另一些仅支持少数几个。\n\
  \n## 黑客指南\n\n正如我们在前面的章节中讨论过的样，黑客行为是一项大犯罪。本节中解释或教授的任何仅用于开发、教育和研究目的。我们将考虑入侵 `Android`\
  \ 设备，但在那之前我们需要问一些问题。为什么要入侵 `Android` 设备？目的是什么？大量的人拥有 `Android` 设备。\n\n与软件开发类似，黑客攻击是困难的，你无法一夜之间成为专业黑客。黑客攻击需要高超的技巧和推理水平。作为一个黑客，你的大脑必须像处理单元一样运行。为了在一个平台上练习黑客攻击，你需要对各种编程语言之一有一定的经验。在黑客攻击方面，了解\
  \ `C++`、`Linux` 和 `FORTRAN` 等编程语言非常有用。然而，你还需要其他知识来成为一名熟练的黑客。随着安全措施的升级，黑客攻击变得越来越困难。作为一个黑客，你必须学会理解并击败安全挑战。\n\
  \n## KALI LINUX 2.0 的特性\n\n如果你是渗透服务器和破解网络的专家，开展业务最简单的方法就是利用 `Kali Linux 2.0` 的力量。`Kali\
  \ Linux 2.0` 是让程序员进行黑客变得非常容易的最佳 `Linux` 发行版。你可以在短时间内实现目标并成为你个人网络的所有者。\n\n`Kali Linux`\
  \ 最重要的特性如下：\n\n### 1. Metasploit\n\n`Metasploit` 是一个帮助创建漏洞利用、壳代码、触发器、蜜罐和负载的框架。`Metasploit`\
  \ 是封装在其框架中的若干个漏洞和类似元素的库。该软件是公开的，可以在许多操作系统上使用，包括 `Linux` 和 `Windows`。它随 `Kali Linux`\
  \ 默认。`Metasploit` 是一个威胁其他网络的危险设备。你想检查网络安全中的漏洞并学习如何管理它们以防止外部攻击。\n\nWeb 应用和服务器也会受到\
  \ `Metasploit` 的攻击。在 `Metasploit` 中，`GUI` 和命令行界面同样存在。`Metasploit` 提供免费版本，但也有付费版本（`Metasploit\
  \ Pro`），它提供了更多功能。\n\n### 2. NMAP\n\n`NMAP` 是“network mapper”（网络映射器）的缩写。它在扫描网络的同时搜索可访问端口以映射网络服务器等。`NMAP`\
  \ 的核心功能是安全分析和对网络进行检查以检测在线的计算机。`NMAP` 使用 `IP` 地址和数据包的方式揭示了关于网络的有用细节。例如，它显示了可以访问网络的端口以及计算机上正在使用的应用程序。建议在进一步进入\
  \ `GUI` 之前先对命令有一些了解。\n\n### 3. Armitage\n\n`Armitage` 是一种用于网络安全的显示控制工具，它为 `Metasploit`\
  \ 插件创建一个接口，简化了 `Metasploit`，使其不那么复杂更容易理解。如果你想学习更多关于 `Metasploit` 的知识，`Armitage`\
  \ 是很好的起点。`Metasploit` 的所有功能在破解过程中都由 `Armitage` 收集，因为它们的目的是利用、绕过和突袭网络。\n\n### 4.\
  \ Jhon the Ripper\n\n`JTC` 是“Jhon the Ripper”的缩写。它是一个破解受密码严密保护区域的著名工具。在黑客世界中被简称为\
  \ `Jhon`，它是启动所谓的字典入侵的主要工具。`Jhon the Ripper` 有一个名为“单词列表”的文本库，由以前破解的密码组成。`Jhon the\
  \ Ripper` 从其库中选择其中一个密码，并替换待破解密码的 `wordlist`。然后它给出新输入密码的结果。换句话说，黑客取一个以前破解的密码，并干预系统，使得这个以前破解的密码替换掉待破解的密码。之后，`Jhon`\
  \ 重新启动过去的成功，并对替换的密码进行重新破解。`Jhon the Ripper` 与类似的破解工具 `THC Hydra` 之间有相似之处。细微的区别在于，`Jhon`\
  \ 用于离线破解，而 `Hydra` 用于在线破解。\n\n### 5. Wireshark\n\n`Wireshark` 是一个开源工具，通过网络流量概述来监视网络。该工具属于网络嗅探器一类。\n\
  \n`Ethereal` 是 `Wireshark` 的旧名。它的核心功能是监控用于网络流量的差异，并调查往返的数据包。在完成这一切之后，结果将以可以理解的格式呈现给用户。随着时间的推移，已经取得了明显的进展。例如，创建了过滤器以及颜色编码等各种数据包处理功能。所有开发在某种方面提供了帮助，特别是增强了测试人员的渗透能力。这些测试人员能够进一步渗透到网络并彻底检查数据包。\n\
  \n如果你真的想成为网络分析、网络渗透大师并获得其他黑客技能，你必须拥有关于 `Wireshark` 的经验和知识。\n\n### 6. THC Hydra\n\
  \n\n\n\n\nHydra 与 John 非常相似，是一种破解密码的设备。在专家黑客手中，Hydra 可能非常危险。它通常与 John 结合使用，因为两者经常同时运行。Hydra\
  \ 通过结合字典攻击和暴力破解的力量，对输入密码的界面进行攻击。Hydra 支持很大范围的协议，包括 `SSH`、`POP3`、`IMAP`、`Database`、`SMB`、`VNC`、`LDAP`、`RTPS`、`HTTP`、`POP`、`TCP`\
  \ 和 SMTP。\n\n目前在线最强大的工具是“Suite”。Suite 是一个提供 Web 服务和渗透测试的应用程序。当充分利用时，其用途几乎是无限的。以下是\
  \ Burp Suite 的某些功能：\n\n- `Intercepting Proxy`（拦截代理）是一种监控并改进应用程序与网络浏览器之间通信的功能。\n\
  - `Spider`（爬虫）是一个用于指定网络上存在的所有文件列表、名称和特征的功能。\n- `Web Scanner`（Web 扫描）是一个扫描服务器漏洞的重要功能。\n\
  - `Intruder`（入侵者）是一个用于对网络发起攻击的功能。它用于扫描缺陷并利用这些缺陷。\n- `Repeater`（重放器）代表用户改进并发出请求。\n\
  - `Sequencer`（序列器）检查令牌的 `CSRF`、身份验证令牌等是否存在不规则性。\n- `Extensions`（扩展）允许用户包含自己的自定义插件，或直接从系统数据库安装插件。它们被用于创造性地策划战术性和隐蔽性的攻击。\n\
  \n## 7. OWASP Zed\n\n`OWASP Zed Attack Proxy`（缩写为 `ZAP`）的一个特点是它没有价格。它的开源版本向公众开放。`OWASP`\
  \ 是一个流行的功能且有效的代理工具，可以替代 Burp Suite。`OWASP` 用户界面友好，并且能够高效地完成工作，因为它暴露了 Web 应用程序的漏洞。`OWASP`\
  \ 的功能总结如下：\n\nA. 手动测试\nB. 检查网络泄漏情况\nC. 检查用户目标\n\n## 8. 工程工具包\n\n社会工程工具包（Social-Engineering\
  \ Toolkit），简称 `SET`，是另一个值得提到的重要工具。使用该工具，攻击的是操作系统的用户而非系统本身。它具有某些允许访问 Java applet\
  \ 的特殊属性。用户对这些 applet 一无不知，因为 `SET` 确保一切都在后台进行。此命令行在充分利用的情况下，可以产生有效的结果。它运行于任何基础操作系统，包括\
  \ `Linux` 和 `Windows`。\n\n## 9. Aircrack-ng\n\n这是另一个破解密码并允许用户访问互联网的工具包。在高手手中，它可以成为盈利工具。然而，它是困难的且需要大量努力。对于新手来说，`Aircrack-ng`\
  \ 是一种短波破解程序。它是一个针对 `802.11` `WEP` 和 `WPA-PSK` 密钥的破解套件，可以从各种数据中恢复密钥。但是，数据必须具有足够的包并被捕获（在监听模式下）。`Aircrack-ng`\
  \ 是你绝对需要的工具。\n\n新手应该能够使用正确的工具破解加密的 `WEP`。然而，破解 `WPA/WPA2` 将需要大量的努力。\n\n## 你需要了解的基础端口扫描技术\n\
  \n端口扫描是一种借助特殊工具分析计算机系统开放端口的过程。执行此类扫描并不需要在目标系统上进行注册，因为你只需要通过本地网络连接到它即可。在端口扫描器的帮助下，向不同的端口发送特殊数据包，并由工具分析和评估相应的错误信息或消息。无论使用的端口扫描程序功能如何，不仅可以获取关于哪些端口开放或关闭的信息，还可以获取目标计算机所使用的操作系统信息。此外，端口扫描还可以告诉你是正在使用相应端口的服务或应用程序。\n\
  \n端口扫描是系统管理员控制网络数据流量和过滤潜在弱点的非常有效的方法。在某些情况下，还可以解决特定的网络问题。由于这些工具对被检查系统的性能不会产生显著影响，因此可以毫无犹豫地用于此类安全措施。在家庭环境中，只要防火墙不阻止，端口就会自动打开。端口扫描有助于维护整体视图，并显示不再需要的端口。然后可以关闭这些端口，以最大限度地减少可能影响安全的风险。\n\
  \n### 端口扫描到底是如何工作的？\n\n有许多不同的方法用于扫描端口，大多数都围绕着 `TCP` 连接协议。要理解端口扫描过程中发生的基本流程，理解 `TCP`\
  \ 协议连接是如何建立的。。\n\n1. 在名为“三次握手”的过程框架内，客户端首先向相应的目标端口发送一个 `SYN`（同步）包。\n2. 如果它到达应用程序，它将接收一个\
  \ `SYN / ACK` 包（同步确认 = “确认同步”）来确认连接。\n3. 客户端在第三也是最后一步用 `ACK` 包（确认 = “确认”）进行响应，之后连接建立建立并开始数据交换。\n\
  4. 如果与关闭端口建立连接，客户端将收到一个带有 `RST`（重置 = “重置”）标志的包。因此，协商被中断。\n\n由于与各种应用程序进行数据交换将非常昂贵且复杂，因此端口扫描器限于简单的连接尝试，如下文提到的扫描方法所示。\n\
  \n#### TCP SYN\n\n在 `TCP SYN` 的情况下，可以将其称为半开放扫描，因为其并不旨在建立完整的 `TCP` 连接。在这种模式下，可以使用端口扫描器向每个端口发送典型的\
  \ `SYN` 包，然后等待目标主机的响应。如果主机用 `SYN / ACK` 包响应，则相应的端口将变为开放并可以建立连接。如果响应由 `RST` 包组成，则端口保持关闭。如果目标主机尚未发送响应，则是防火墙等数据包过滤器干预了过程。`TCP\
  \ SYN` 扫描对于被检查的应用程序是不可见的，因此不会产生日志数据。因此，它们也是“隐身扫描”。\n\n#### TCP Connect\n\n如果你正在使用端口扫描器执行连接类型的过程，你并不是在生成或发送数据包，而是在调用\
  \ `connect` 系统。这种“调用”在几乎所有的操作系统上都可用。此外，网络浏览器也使用调用建立建立到服务器。此扫描工具不参与建立连接，而是由负责它的操作系统处理。用户可以\
  \ (1) 创建成功连接并确认端口开放，或 (2) 尝试失败并指示相应端口已关闭。如果连接完全建立，很容易在（开放端口的应用程序的日志文件中）看到是否使用了这种轮询方法。然而，如果你缺乏发送原始数据包的权限，`TCP\
  \ connect` 方法可以是 `SYN` 扫描的有用替代方案。\n\n#### TCP FIN, Xmas and Null\n\n\n\n\n\n通过这三种端口扫描方法，你也可以区分开放端口和关闭端口。为此，可以应用在\
  \ `TCP` (793) `RFC` (请求意见) 中注册的两个基本原理。一方面，关闭端口必须对除 `RST` 包以外的传入数据做出响应。另一方面，开放端口必须忽略所有标记为\
  \ `SYN`、`RST` 或 `ACK` 的包。这三种方法的行为完全相同。由于 `RFC` 的规定，发送的测试包会被妥善：关闭端口会用 `RST` 包响应，而开放端口在该方面不会做出任何反应。然而，由于只有部分路由器会在端口被过滤时传输错误消息，因此在端口被过滤的情况下也可能无响应。尽管这些程序比\
  \ SYN 扫描更离散，但它们的缺点是当系统不严格遵守 `RFC 793` 协议时将无法工作。在这种情况下，Windows 是最重要的代表。\n\n### UDP\n\
  \n向所有目标端口发送空闲且不带数据的 `UDP` 头部。如果服务用 `UDP` 包做出响应，则属于它的端口是开放的。如果路由器发送端口扫描器错误消息“端口不可达”（Type\
  \ 3, Code 3），则端口是关闭的。其他类型的错误消息报告数据包过滤器拦截了端口。使用 `UDP` 扫描端口的一个大问题是耗时很久，因为出于安全考虑，许多系统中发布相应错误消息的任务可能很久，而且开放端口的响应非常不稳定。`Linux`\
  \ 内核限制消息数量，例如每秒一条，这意味着你可以在大约 18 小时内扫描 65,535 个端口。\n\n### 端口扫描器的用途\n\n安全扫描器对于系统管理员和网络管理员非常有用的工具，因为它们可以用于监控安全。另一方面，黑客有时利用端口扫描器来入侵系统。然而，端口扫描器不认为是直接的黑客工具，因为它们不是直接攻击系统。相反，它们被用于在攻击之前收集信息。\n\
  \n## 如何识别你的操作系统 (OS)\n\n操作系统是计算机上最重要的软件程序之一。操作系统执行基础任务，如向屏幕发送信息、识别键盘连接、跟踪磁盘上的目录和文件，以及监控扫描仪、打印机等外部设备。操作系统还用于保护和确保系统安全，防止未经授权的用户获得访问权限。有不同类型的操作系统，下文将介绍。\n\
  \n### 单用户\n\n单用户操作系统是指那些一次仅支持一个用户的操作系统，无论计算机拥有多少个处理器，或者用户可以同时执行多少个进程或任务。个人计算机通常具有这种操作系统。\n\
  \n### 多用户\n\n多用户操作系统能够同时为多个用户。它们将使用通过通信网络中的远程会话连接到计算机的多个终端，或者通过机器中每个用户可以同时执行的多个处理器来运行。\n\
  \n### 单任务\n\n单任务系统是指那些允许用户一次只能完成一个任务的系统。这可能出现在多用户单任务系统中，在该系统中允许同时有多个用户，但每个用户每次只能完成一个任务。\n\
  \n## 网络操作系统\n\n网络操作系统 (`NOS`) 是一种允许计算机互连以访问服务、资源、硬件和软件的软件。这本质上创建了一个计算机网络。正如计算机没有操作系统无法工作一样，计算机网络没有网络操作系统无法运行。它由使计算机系统能够在网络环境中与其他计算机通信的软件组成。\n\
  \n## 操作系统网络处理器\n\n根据自由软件基金会的说法，自由操作系统提供四种自由。它允许你：\n\n1. 无限制地运行程序以执行你想要的任何活动。\n2.\
  \ 研究程序的操作并根据你的需要对其修改。\n3. 重新分发程序的副本。\n4. 改进程序并发布修改后的副本。\n\n### 操作系统类型\n\n`OS` 唤醒计算机并使其识别\
  \ `CPU`、内存、击键、视频系统和磁盘驱动器。此外，它提供了用户与计算机通信的功能，并作为运行程序的平台。下面提到了最流行的操作系统。\n\n1) `DOS`:\
  \ 著名的 `DOS`，代表磁盘操作系统，以 `PC-DOS` 和 `MS-DOS` 的名闻世。`MS-DOS` 由微软创建，本质上与 `PC-DOS` 是同一个\
  \ `OS`。它持续受欢迎的原因是可用软件的海量以及已安装的 Intel 基计算机基础。当 Intel 发布 `80286` 时，`DOS` 变得非常流行，以\
  \ `DOS` 及其应用程序占据了 PC 软件市场大部分份额。那时，IBM 兼容性成为产品成功的必要条件。即使市场上出现了了新的操作系统，`DOS` 在今天提供的各种操作系统软件中仍然是一个强有力的竞争者。\n\
  \n2) `Windows 3.1`: 微软决定创建一个具有友好图形界面的操作系统，结果就是 `Windows`。该系统在屏幕上显示代表不同文件或程序的图标，可以通过鼠标双击进行访问。为\
  \ `Windows` 创建的所有应用程序看起来都一样，因此一旦有人学会了基础知识，就很容易学会如何使用新软件。\n\n3) `Windows 95`: 1995\
  \ 年，微软推出了全新且改进版本的 `Windows 3.1`。对该 `OS` 的改进包括多任务支持和 32 位架构，这允许用户运行更好的应用程序并提高效率。\n\
  \n4) `Windows NT`: 此版本的 `Windows` 专注于网络和服务器。通过这个 `OS`，用户可以在两个或多个计算机之间进行有效的交互。\n\n\
  5) `OS/2`: 这个 `OS` 由 IBM 创建。它具有 32 位支持，且界面非常好。这个操作系统的问题是，它在应用程序方面没有得到应有的支持。也就是说，许多应用程序还没有创建来利用该\
  \ `OS` 的特性，因为大多数软件市场被 `Windows` 垄断了。\n\n6) `Mac OS`: 如果没有 `Mac OS` 作为主操作系统，Macintosh\
  \ 计算机就不会这样流行了。这个操作系统非常友好，任何人都可以在很短时间内学会使用。它对于组织文件和有效使用它们也非常棒。这是由 Apple 创建的。\n\n\
  7) `UNIX`: `UNIX` 操作系统由 AT&T 的贝尔实验室于 1969 年创建，现在是信息公路的支柱之一。`UNIX` 是多用户多任务 `OS`，运行在不同的计算机上，包括超级计算机、主机、小型计算机、个人计算机和工作站。这意味着许多用户可以通过终端使用同一台计算机。\n\
  \n`Kali` 是新手黑客的梦想，他们知道它将解决他们的很多问题。`Kali` 配有设计有序、易于操作的设备。然而，还有其他操作系统与之相当。\n\n## PARROT\
  \ SECURITY OS 特性\n\n与 `Kali` 一样，Parrot 安全操作系统源自 Debian，通常用于渗透测试、法证和其他目的。它大约在四年前发布，经过了广泛开发，具有许多令人兴奋的属性。\n\
  \n\n\n\n\n*   Parrot Home 是 Parrot 的一项功能，旨在协助用户，让他们体验 Debian 优美的氛围并接触内置的渗透测试工具。它还提供了如何有效使用这些工具的帮助。\n\
  *   Parrot Air 属性主要用于无线渗透测试系统。\n*   Parrot Studio 属性侧重于多媒体创作功能。\n*   Parrot Cloud\
  \ 属性运行在 VPS 和跳板上。它针对处理服务器的应用程序，使用户能够访问除前端图形之外的完整渗透测试工具包。\n*   Parrot IOT 属性是为 Pine64、树莓派（Raspberry\
  \ Pi）和 Orange Pi 等低资源系统构建的。\n*   Parrot Security 属性是真正的 Parrot OS，其设计充分考虑了隐私。它的设计也倾向于取证、渗透测试和未来发展。尽管它的功能范围并不广泛，但其重心并未偏离原始的发行版和初衷。凭借多种安全特性，该程序是一个能够满足成功渗透所需的桌面级力量。它定义了黑客攻击的本质。\n\
  \nKali 的用户也会发现 Parrot 对他们的工作不可或缺。就像使用 Kali 一样，你会觉得在 Parrot 中非常如鱼得水，而且不需要重新学习与该操作系统交互的基础知识。\n\
  \n### 步骤 1：安装 Parrot Security OS。\n\n首先，我们需要下载一个名为 Parrot Security ISO 的操作系统。你可能可以在\
  \ Parrot Security 官方网站获取它，以及 ISO 的哈希值（hash）。下载成功后，应该确认哈希值。如果哈希值与 ISO 类型不符，则文件已损坏且无效。一个主意是访问\
  \ Parrot 网站并下载最新版本。确认哈希是一个简单的过程。要在 Windows 上验证哈希，请按下 `WIN+R` 打开运行向导，然后在对话框中输入 `CMD`。按回车。当命令提示符打开时，输入代码\
  \ `certutil .`。\n\n```bash\ncertutil .\n```\n\n```bash\ncertutil-hashfile Parrot-full-3.8_amd_64\
  \ SHA1\n```\n- 如果你的版本是 3.8。\n\n在 Mac 操作系统中确认哈希，启动命令行并执行代码 - `shasum Parrot-full-3.8_amd_64.ova`。\n\
  \n在 Linux 上确认，输入代码 `sha1sum .`。\n\n如果哈希值对应，你就可以继续进行下一阶段。\n\n### 步骤 2：创建虚拟机。\n\n\
  为了运行该操作系统，我们需要在随机机器上对其进行测试。首先，你需要将镜像拷贝到驱动器然后启动系统。虽然这种方法可行，但需要大量时间。新设备可以成功运行 Linux\
  \ 的客户端软件。因此，虚拟化将变得更有趣。此外，如果设备出现很多问题，我们可以放弃该设备。\n\n我们将在 Windows 操作系统上使用离线网站的 `VirtualBox`（`VirtualBox`\
  \ 是一种强大的虚拟化且极其高效的工具，带有 GNU 开源许可）。如果操作得当，该程序应该在所有主要的平台上都能运行。\n\n在安装过程中，你可以尝试使用光盘而不是虚拟磁盘。启动\
  \ `VirtualBox` 后，管理器会立即弹出。\n\n系统将打开一个 Parrot 系统。如果你需要重启或运行另一个，滚动到左上角进行操作。输入你选择的机器名称并点击\
  \ Linux。之后，将提供一些版本。选择 Debian，但确保该版本适用于你的系统。选择 32 位或 64 位版本，并确保磁盘上有足够的空间。\n\n# 结论\n\
