  \n## 安全意识与培训\n\n有些事情自然是容易避免的。例如，让管理层或员工关注信息；这并不是一项易事。有些公司会为你处理这类事情并帮助你传达信息：\n\n\
  - Greenidea, Inc Visible Statement: [www.greenidea.com](http://www.greenidea.com)\n\
