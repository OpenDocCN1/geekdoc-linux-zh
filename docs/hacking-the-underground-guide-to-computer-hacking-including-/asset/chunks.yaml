  raw: 'If you are looking for the definition of an intrusion, this is it. The attacker
    not only attacks your network but intrudes deeply. The attacker sits in one corner
    and monitors your traffic until an initialization vector collision occurs. What
    is a collision? This is a state in which an algorithm reuses an initialization
    vector. However, your secrets aren’t safe in the course of a collision. This is
    because when a collision occurs, both the shared secret and the repeated initialization
    vector will result in a keystream that has been used previously. Moreover, when
    an algorithm sends out information, it will send it in a ciphertext. Then, a hacker
    who is keeping track of all the traffic going in and out will be able to identify
    when a collision occurs. When this happens, the hacker will be able to use the
    resulting XOR information to infuse the data regarding the message content.


    Naturally, IP traffic is very much redundant. Therefore, replication of the process
    can easily yield enough information to decipher the encrypted message.


    ## CRACKING KEYS


    Anything that uses an algorithm can be cracked; it just depends on how flexible
    you are with your cracking skills. So far in this book, we have extensively discussed
    WEP and its flaws. The wired equivalent protocol is just an algorithm that is
    generally used to protect wireless networks from easy attacks. Unfortunately,
    this security feature has a lot of security flaws, which make WEP very much open
    to crack attacks. The following things are needed before someone can crack WEP
    keys.


    *   A large number of captured frames.


    *   A program that can process the frames that were captured.


    Numerous tools on the internet can crack WEP keys; some are free while some are
    paid. For now, we will focus on tools such as WEPcrack and AirSnort to crack keys,
    although you can use any tool that does the job. You can use a program like Kismet,
    which can save weak initialization vectors (IVs) to feed into another cracking
    program like WEPcrack.


    ### USING WEPCRACK


    This tool is considered to be one of the most famous tools for cracking WEP keys.
    WEPcrack (download at http://sourceforge.net/projects/wepcrack) was the first
    WEP cracking tool to go public. This amazing tool can capture logs and crack IVs
    to provide important keys. However, before you can run WEPcrack, you will need
    some PERL and packets.


    The developers of this tool have coded it in such a way that it can be used anywhere
    there is an interpreter for PERL. Moreover, this requirement is easy to meet for
    UNIX platform users. For you to run WEPcrack in UNIX, just run the command wizard,
    type the code “per1/tmp/WEPcrack.pl.” However, if your installed location is different,
    simply change the “per1” to the name of the folder where you installed the WEPcrack
    script. Microsoft does not provide PERL. This might be astonishing for Windows
    users, as it won’t be so easy to use WEPcrack. However, the best alternative for
    Windows users is a tool called Cygwin. You can get it online or perhaps you can
    get a PERL interpreter for your Windows operating system instead, such as a tool
    called ActivePerl.


    Let’s assume you are on the Windows OS and you decide to get ActivePerl and install
    it. You can download it at [www.activestate.com/Products/ActivePerl](http://www.activestate.com/Products/ActivePerl)
    . With ActivePerl, you can achieve the same goal as a UNIX user on your Windows
    platform. To install this tool and use it to run WEPcrack, simply follow the steps
    below:


    1.  Download the tool from the ActiveState website using the link above.


    2.  Start the ActivePerl setup .


    3.  The license agreement will appear on the screen. Read it and then accept by
    clicking Next .


    4.  A new window will appear on the screen asking you to choose where you want
    the ActivePerl to be installed. Choose your location; then click on Next .


    5.  Step (IV) above is optional; you can choose to install it in a custom directory
    if you don’t want it to be installed in the root directory. To install in a custom
    directory, click on the Browse button and then browse the directory trees on your
    hard drive until you see the location where you want it to be installed.


    6.  The new window that pops up will be a PPM New Features window . You can either
    give it access to send your profile details to ASPN by clicking on enable PPM3
    , or just click Next and ignore.


    7.  Based on your choice, any option you think you won’t be using can be ignored
    by clicking on Next .


    8.  Here, click on the Install Button to install ActivePerl on your Windows computer.


    9.  Step (VII) can take a little while to complete. It will give you an installation
    status window where you can see the progress of the installation. After this process
    is complete, you are ready to use PERL.


    10.  Select Run from the start menu.


    11.  Type command in the dialog box and click OK .


    12.  Launch your command prompt by pressing Win+R ; then type cmd in the dialog
    box and press enter on your keyboard. When the command prompt opens, type perl\progra~1\wepcrack\pcapgetIV.pl
    .


    13.  The path in step (X) is the default root where the tool should be installed
    and located. If you have used a custom directory during the installation process,
    make sure you edit the directories in the command so that it can work properly.
    However, the Perl routine we show here is just an example. The script itself is
    useless because for it to function properly, you need a captured packet that you
    can drop in from another program, for instance, prismdump or ethereal . A large
    number of frames (like 5 million) will be needed. After this, you can proceed
    to the next step.


    14.  Start the WEPcrack software by typing perl\progra~1\wepcrack\wepcrack. pl
    ivfile.log .


    15.  When you are done, you can close the window by clicking on the X at the upper
    right corner.


    16.  Take note that the key is always in a decimal format. Therefore, you will
    still need to convert the decimal into a hexadecimal format before you can use
    it successfully.


    ### USING AIRSNORT


    This is another amazing passive scanner tool used for cracking WEP keys. This
    tool works in a very simple and interesting way. It gathers weak IVs and begins
    to crack the WEP key. The closest approximation to the total initialization vectors
    that could be in a key is 16 million. In these 16 million initialization vectors,
    there are approximately 9,000 128-bit keys that are stupendously weak. AirSnort
    will then scan all 16 million keys and look for the weak ones. Members of the
