    ## Gathering IP ADDRESSES AND SSIDs


    Online blogs and other article directories say that you will be safer if you turn
    off your SSID broadcasting as a control, but this is essentially a fallacy. Many
    programs out there can help you get the SSIS of a system when it is turned off.
    They are:


    - `air-jack`: [http://sourceforge.net/projects/airjack/](http://sourceforge.net/projects/airjack/)

    - `Arping`: [www.habets.pp.se/synscan/programs.php?prog=arping](http://www.habets.pp.se/synscan/programs.php?prog=arping)

    - `essid_jack`: [http://sourceforge.net/projects/airjack/](http://sourceforge.net/projects/airjack/)

    - `pong`: [http://mobileaccess.de/wlan/index.html?go=technik&sid](http://mobileaccess.de/wlan/index.html?go=technik&sid)

    - `SSIDsniff`: [www.bastard.net/~kos/wifi/ssidsniff-0.40.tar.gz](http://www.bastard.net/~kos/wifi/ssidsniff-0.40.tar.gz)


    ## LEAP CRACKERS


    You can find the acronyms of all of these terms in Appendix B of this book. EAP
    has been tagged as the solution to WEP authentication problems. On the other hand,
    what is tagged as being a protection has its own flaws as well. Following are
    the tools you can employ to help crack LEAP:


    - `anwrap`: [http://packetstormsecurity.nl/cisco/anwrap.pl](http://packetstormsecurity.nl/cisco/anwrap.pl)

    - `asleap`: [http://asleap.sourceforge.net/](http://asleap.sourceforge.net/)

