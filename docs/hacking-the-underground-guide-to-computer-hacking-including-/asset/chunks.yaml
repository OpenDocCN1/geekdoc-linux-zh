- fmt: '

    The user is also cajoled into visiting the cloned website through the use of a
    phishing email that prompts the user into clicking a link that redirects the user
    to the cloned website. The `Social Engineering Toolkit` in `Kali Linux` is an
    important tool in achieving this feat. The social engineering tool contains options
    for cloning a website exactly as it is on the original website. It also contains
    a tool for sending the mass email to several target email addresses or to a single
    target email address.


    To execute a phishing attack effectively, you must log into your `Kali Linux`
    distro, click the application icon, go to `BackTrack` and choose the `Exploitation
    Tools` option on the right. This will display another set of options containing
    tools like `Web Exploitation` tools and `Physical Exploitation` tools. Our focus
    will be on clicking the `Social Engineering tools`. We choose the `Social Engineering
    Toolkit`. The `Social Engineering Toolkit` will open the terminal and show a menu
    containing different social engineering attack tools. We choose the `Web Attack
    Vector` option, then choose the `credential harvester` attack method on option
    `3`. This option would allow us to clone a website.


    The `credential harvester` option opens up a menu containing three options: (1)
    the `web template` option which allows the social engineering tool to import a
    set of pre-defined web applications we can use in the attack; (2) the `site cloner`,
    which helps us clone any site of our choosing; and (3) importing our own customized
    HTML template. Option two would make the `Social Engineering Toolkit` ask for
    the IP address on which to listen and for the website to be cloned. Once these
    two parameters are provided, the toolkit starts cloning the website. When an unsuspecting
    victim visits this website, the `SET` collects the username and password. The
    website clone is typically used with the `spear-phishing` option, in which the
    link to the cloned website is sent in a mass email attack to several targets or
    to just one target.


    # KEYLOGGERS


    Keyloggers are scripts or devices that allow the hacker to track each keyboard
    or keypad stroke of the victim and save it in a text or readable format. It is
    a very useful tool for information gathering. Often, keyloggers are programs or
    scripts that run in the background on the computer on which they are installed,
    although physical keyloggers exist as `USB` multiports or as `P2S` ports to which
    the keyboard is connected before being connected to the CPU. This type of physical
    keylogger contains a memory chip that can be removed and checked for all the information
    and keyboard strokes it has stored. There are also wireless keyloggers that can
    sniff, intercept and hijack data sent from a keyboard to its receiver. In addition,
    there is keylogger software that is installed on the target computer. This type
    of keylogger software runs in the background without interfering with the victim''s
    activity on his or her personal computer.


    Software-based keyloggers must be installed on the victim''s computer. This can
    be done in various ways, which we will discuss shortly. A hacker may be aware
    of a flaw present in an app the client uses and then exploit this vulnerability
    to trick the victim into visiting a website that downloads and executes the keylogger.
    The hacker may send the victim links to download an app or file containing the
    keylogger. When the victim installs this application, it runs the keylogger installation
    in the background and starts the keylogger program. A hacker may, on the other
    hand, place the keylogger in a `USB` drive with an `autorun` file. When an individual
    picks up this drive and inserts it into his/her computer, curious about what is
    on the drive, the keylogger is automatically executed in the background and starts
    tracking the user’s keystrokes.


    Most of these types of keyloggers work remotely and need an internet connection
    to send the keylogs to the hacker. Other types of keyloggers save the keystrokes
    locally on the victim''s computer and require the hacker to have physical access
    to the computer to retrieve the log files. Keyloggers are also capable of doing
    more than tracking keystrokes. They can take screenshots and save information
    copied on the screen and copied to the clipboard.


    Keyloggers are powerful programs. They are easy to build, and most are executed
    as part of a `rootkit`. Spyware like keyloggers are very powerful, and require
    minimal coding and resources to run on the operating system. They can fly under
    the radar and be undetectable by the system’s antivirus application. They typically
    consist of a dynamic link library and an installer which installs these files
    and enables them to run in the background. The keylogger can be created using
    the `Metaspoilt` option in `Kali Linux` with the `meterpreter`. The `keyscan_start`
    command is used to start up the keylogger, while the `keyscan_dump` command requests
    and receives the log files of the keyboard strokes.


    Protection against keyloggers is recommended for any PC user. A good way to do
    this is by installing `antispyware` on the computer system. Keyloggers can be
    very sneaky and can avoid detection by the antivirus software on a PC. The spyware
    tool would search and pick out keyloggers running in the background. Some antispyware
    also encrypts the keystroke of the keyboard, causing the keylogger to send a jumbled-up
    logfile to the remote hacker. This encryption technique is also useful against
    hardware keyloggers. Although there is no one-size-fits-all approach to protection
    against keyloggers, it is advisable to regularly scan the system, check background
    processes for odd processes running in the background and avoid downloading and
    installing suspicious applications.


    # DISTRIBUTED DENIAL OF SERVICE OR DDOS


    DDoS (Distributed Denial of Service) attacks are incredibly fascinating. Unlike
    the other kinds of website or web app attacks we have discussed, this attack is
    not a stealth attack. It is a statement attack. It is meant to create a “you are
    being hacked” awareness in the website or web app owner’s mind. This is the kind
    of attack most used by the infamous hacker group `Anonymous`.


    The method used in creating a Distributed Denial of Service attack involves flooding
    a website with more traffic than it can handle. This is done by controlling a
    large number of users or robots that send server requests to the website simultaneously.
    In the course of this particular action, the server receives more server requests
    per second than it can adequately serve in that timeframe. This leads to the web
    app or website being unavailable to its users. There are two ways of achieving
    this kind of traffic flooding:


    *   Coordinating hundreds or thousands of users into sending requests at the same
    time.

    *   Using robots or bots which flood the website with bogus traffic.


    The DDoS attack is different from the `DOS` attack in that the `DOS` attack involves
    one system trying to flood a website. With `DDOS`, multiple systems with multiple
    `IPs` are used. This makes it very difficult for the website or web app to block
    a single `IP`, as it is not sure which traffic is real and which is not. The use
    of bots has this same effect, as they are being bounced from multiple locations.
    A perfect analogy is the kitchen sink. When you open the tap, a certain amount
    of water can pass through the drain at once. If the amount of water poured into
    the sink exceeds the amount that can flow through the drain, the sink fills until
    the whole kitchen is flooded.

