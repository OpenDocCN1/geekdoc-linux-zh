  trans: '

    无线黑客行业众所周知，密钥长度的增加会增强加密技术的安全性。因此，如果你在实现或设计上存在缺陷，它可能会导致你无法使用长密钥。


    根据研究，可以得出结论：对于流畅且健壮的设计和实现，超过 `80 bits` 的密钥会让暴力破解密码分析成为一项几乎不可能完成的任务。然而，大多数 `802.11
    WLAN` 密钥依赖于简短的密钥，即 `40 bits`。但是，没有哪个计算机是完全安全的。在最近的攻击中，显示 `WEP`隐私方法对某些攻击非常脆弱。无论密钥大小如何，这些攻击都成功了。


    # 保护消息完整性


    与拿起手机给朋友打电话或分享敏感信息不同是不安全的，因为第三方可以破解你的通信。加密消息防止了你对发送的消息拥有完全的灵活性，但由于你可以确保你的信息是 100%
    安全的。加密的基本安全任务是确保你的消息完整地送达接收者。`IEEE 802.11` 规范在这方面提供了良好的安全性，它概述了一种名为 `CRC`（`循环冗余校验`）的简单检查。该检查的目的是确保你的消息具有数据完整性，使客户端与接入点（access
    points）之间传输的消息更加安全。


    这项安全服务是为了拒绝任何人可能在传输过程中更改的任何。这项服务并不意味着你可以简单地登录网络，向客户端编写消息并假设它是完全安全的。这还需要更多。接入点和客户端在传输之前，会为每一帧计算一个名为
    `ICV`（`完整性检查值`）的 `CRC-32` 帧校验序列。加密并不是你可以直接发送给朋友并用纯英文或中文阅读的消息。（你可以称其为技术术语。）对于一个碰巧读到加密消息的门外汉来说，它实际上没有任何意义。


    尽管消息经过了加密，接收者也必须有一种方法以人类可读的语言读取并理解它。读取加密数据或信息的过程被称为解密。为了确认正在传输的消息未被更改，接收者需要解密该帧，然后对消息重新计算
    `CRC`。解密后，接收者将把计算出的 `CRC` 与原始消息进行比较。在此过程中，如果接收者发现 `CRCs` 不相等，就可以推断出发生了错误。此时，接收者将不得不丢弃该帧，因为它已经被破解了。


    这是一个好主意。如果你认为这种信息加密形式是最好的，请重新考虑一下。这个主意的实现非常糟糕，因为可以使用数据翻转位，而这些位仍然可以通过 `CRC` 检查。


    **结论：修改消息是可能的。**


    尽管 `CRC` 加密拥有所有优点，人们可能会认为它是一个顶级安全特性。然而，通过 `CRC` 发送的消息是可以被修改的，这使得 `CRC-32` 不足以防御蓄意的数据完整性攻击。因此，你需要更多真实的加密机制，例如消息摘要或
    `MAC`（`消息认证码`）来防止蓄意攻击。想象一下尝试黑入像 `Facebook` 这样的公司的网络，而你唯一的工具是 `Internet Explorer`。这还有意义吗？记住，你需要为正确的工作使用正确的工具。使用非加密机制将有助于对密码学的攻击。其原因之一是使用了
    `64` 或 `128` 密钥来保护隐私和完整性。因此，这是密码学中的大忌。


    # 使用加密


    博客、媒体和其他在线文章已经做了很多工作，阻碍个人和组织使用无线网络。如果你一直关注技术博客，你将会看到很多关于无线网络安全的负面文章。负面情绪集中在那些处理加密的人身上。然而，并不是每个在互联网上发布的人都理解他们发布的内容；有些人只是复制粘贴，而另一些则是付费发布的。研究显示，大多数发布关于无线安全负面文章的人并不十分了解
    `WEP` 的基础。通过 `WEP`（`有线等效隐私`）这个名称，开发者意图给用户提供与有线网络相同水平的安全性。然而，坦率地说，这种水平并没有提供多少安全性。在排除全交换环境的情况下，监听者可以在帧穿过有线网络时随心所欲地处理并甚至篡改未加密的数据。`WEP`
    的实现和设计实际上从未打算提供任何形式的消息完整性或机密性。


    在 `WEP` 的设计中，结合了对称的 `RC4 算法`（`RC4`）和`伪随机数生成器`（`PRNG`）。`WEP` 的初始实现使用一种标准，规定了 `40`
    和 `128-bit` 密钥长度以及 `24-bit IV`（`初始化向量`）。它遇到的问题之一是对网络层的覆盖不完全：`WEP` 加密第 `3` 到 `7`
    层，尽管它不加密 `MAC` 层（第 `2` 层）。记得 `WEP` 使用的是对称算法；这就是为什么 `WEP` 给客户端提供密钥和其他任何必要的配置数据。


    `RC4` 配置通常并不坏，因为它被大多数网络浏览器用于其 `SSL`（`安全套接层`）。然而，它在 `WEP` 实现中产生的问题以及它所营造的负面安全感并不好。然而，这在
    `WEP` 中具体是如何工作的？


    它使用的简单算法工作原理是：它获取初始化向量，该向量最初是明文（人类可读）形式。在以 `IV` 形式获取后，它将其附加在密钥的前的前。（解密器实际上知道这一点。）操作完成后，`WEP`
    将获取结果并将其接入 `RC4` 以重新生成一个新的密钥流。然后算法将将密钥流与名为 `CipherText` 的内置工具进行 `XOR`（异或）。这将带给我们明文值。最后，`WEP`
    对传输的消息重新执行 `CRC-32` 校验，以确保它与加密明文上的完整性检查值完全匹配。如果校验和不匹配怎么办？`WEP` 会立即假设某处的其他人破解了正在发送的数据包，并自动将其丢弃。


    之前提到了接入点。接入点通常只有三个可用的加密设置。这些是：


    -   无（None）：名字看起来简单，但这些接入点加密设置恰恰是所有设置中最危险的。原因是正在传输的数据可以很容易被他人拦截，他们可以读取甚至更改在网络传输的未加密数据。在使用这些设置时你必须小心。

    -   40 位共享密钥（40-Bit Shared Key）：位数的增加实际上并没有说它有自己的负面影响。此设置会加密网络通信数据，但仍然可能被破解；它只是比第一种设置安全一点。然而，从好的一方面来说，这种
    40 位加密以前通过在高端显卡计算机上启动的暴力破解攻击破解过。需要注意的是，在低端计算机上也可能破解密钥。最终，40 位共享密钥的价值存疑。在本书的后续部分，我们将讨论你可以用来恢复
    40 位密钥的工具。然而，如果如果你能够恢复此类密钥，其他黑客也可以实现相同的目标。

    '
- fmt: '

    # 104-bit settings


    The higher the number of encryption keys, the harder it will be for another hacker
    to crack them. This setting is considered more reliable, safer and at least more
    secure than 40-bit encryption because it simply has more significant differences
    in terms of the size of the cryptographic key space. It is sometimes also referred
    to as a 128-bit setting. However, poor cryptographic design in the use of initialization
    vectors has made it not so true for 802.11 WEP. It is recommended as a good practice
    simply because it is still more secure. Whenever you are purchasing anything from
    any vendor, be vigilant. Check on upgrades for software and firmware. You might
    get lucky and find some that solve a few of the WEP problems.


    If you are lucky enough, you will find some vendors who support 152-bit keys,
    but this is just an example. It is generalized that 40-bit keys are not competent
    enough for a regular system’s form of encryption. For you to be confident in your
    security, the least you should be looking for is an 80-bit key. Research has shown
    that encryption keys longer than 80 bits actually get the job done better. The
    longer your keys, the lesser the chance a third party has to compromise your access
    point by using a brute force attack. In short, this setting is considered more
    secure, so go for it.


    ## WEP WEAKNESSES


    All computer wireless networks have weaknesses. Researchers have examined the
    security issues of a WLAN that uses WEP and documented the attacks that are carried
    out by malicious hackers. The problems are mentioned below.


    *   **Passive attacks**: Problems based on this level are statistical analysis
    issues that are used to decrypt traffic.

    *   **Active attacks**: These kinds of attacks are based on tricking the AP (access
    point) in order to decrypt traffic.

    *   **Active attacks used to inject new traffic from authorized mobile stations**:
    These attacks are concerned with known plaintexts.

    *   **Dictionary attacks**: These are attacks that are carried out after analysing
    sufficient traffic on a very busy network or server.


    Having a lazy bodyguard guarding your house is apparently still better than having
    no one. One of the biggest issues WEP is facing arises when an installer fails
    to allow it to perform properly in the first place. Having security that is not
    good enough is better than having none at all.


    Don’t forget that even your car needs regular service so that it won’t break down.
    The point is to make sure you are changing your WEP keys periodically. Otherwise,
    consider the example of a car that is not being serviced regularly–it will be
    prone to failure. If there are too many users in your wireless network who are
    sharing almost the same keys for long periods of time, then this will cause your
    system to be more vulnerable. Other hackers can easily capture all of the frames
    that are needed to crack your keys if you do not change your keys often enough.


    However, we can’t place all of the blame on the AP administrators for not regularly
    changing keys. The reason is that the WEP protocols themselves don’t offer any
    sort of key managing provisions. This situation is critically dangerous. Take,
    for instance, someone working in your organization who lost his/her laptop; the
    password can be compromised. And that’s not the only bad news; it can be compromised
    with other computers that are using the same password.


    There is a reason why everyone in the world can’t be rich: If everyone were rich,
    money would no longer have value. The logic here is that shared keys could compromise
    your wireless network. When the number of users sharing your key grows, so do
    your chances of putting your wireless network at risk. Cryptography has a simple
    tenet, which is that “the security of a particular computer is generally reliant
    on the privacy of the keys.” The moment you expose your keys, you have exposed
    the text. The moment you share or expose the key, you have given a cracker the
    access to decipher it. Plus, if most of the stations share an identical key, you
    can be sure you have given an eavesdropper access to control a huge sum of your
    traffic for analytic attacks.


    ### Helpful Tips:


    1.  Keep your keys private.

    2.  Don’t share your key with anyone you don’t trust.

    3.  Periodically change your keys.

    4.  Always have a backup of your security files.

    5.  Use longer keys for your access point encryptions.


    ## ATTACKING WEP


    Attacking WEP might be so simple that a layman could do it, but we have examined
    the best ways for you to achieve this easily. There are several passive and active
    ways to attack WEP. They are:


    *   Active attacks are used to inject traffic based on known plaintexts.

    *   Active attacks are used to decrypt traffic by tricking access points.

    *   Dictionary-based attacks are carried out after enough traffic is gathered.

    *   Passive attacks are used to decrypt traffic through statistical analysis.


    Below is a description of these attacks in more detail.


    ### 1. ACTIVE TRAFFIC INJECTION


    Assume that a malicious hacker knows the plaintext version you used in a specific
    message that was encrypted using the passive technique. The bad news about knowing
    your plaintext version is that he or she can use this information to construct
    new and correctly encrypted packets on your network. After construction, you should
    expect him or her to insert these packets on your network. However, for the hacker
    to achieve this, he or she will have to construct a new message by calculating
    `CRC-32` values and performing some sort of bit-flips on the original message
    in its encrypted form. After achieving this, the attacker can send the packets
    to the access points completely undetected. The good news is that there are several
    variations of a technique you can use to avoid such an attack.


    *   **AirePlay**: This is an interesting tool that you must have. This program
    allows you to take any captured packet and then reinject it back into your network.

    *   **WEPWedgie**: You can also use this tool for injecting frames but it’s a
    little different. The `WEPWedgie` toolkit can be used to determine `802.11` WEP
    keystreams and also to inject traffic with known keystreams. (Download the toolkit
    at `http://sourceforge.net/projects/wepwedgie` .)


    ### 2. ACTIVE ATTACK FROM BOTH SIDES


    This is an extension of the active injection technique which was mentioned in
    the previous section. The role of the attacker in this section is simple; the
    hacker makes random guesses about the packet header contents instead of the packet
    payload. Bit-flipping was mentioned in the previous section, but we didn’t explain
    what it actually does. Bit-flipping can transform the destination address and
    then route traffic to dangerous devices where transmission can occur. By employing
    educated guessing, the attacker has what it takes to get your port information
    and then allow passage through firewalls by changing it to the default port for
    web traffic, which is port `80` .


    ### 3. TABLE-BASED ATTACK


    Encryption tables are built from the high likelihood that some information about
    WEP initialization vectors (`IVs`) will be reused at short intervals. With the
    use of a passive technique, the hacker can gain some plaintext information. When
    the hacker finally gains this information, he or she can then compute the `RC4`
    keystream, which is used by the initialization vector. Research has shown that
    repetitive techniques usually allow an attacker to build a complete decryption
    table based on all possible `IVs`. The bad news is that it gives the hacker an
    edge in deciphering every packet that is transmitted.


    ### 4. PASSIVE ATTACK DECRYPTION

