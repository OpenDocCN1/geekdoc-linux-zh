- fmt: '

    It is generally known in the wireless hacking industry that an increase in key
    size will have an increased effect on the security of a cryptographic technique.
    Therefore, if you have a flawed implementation or design, it can prevent you from
    having a long key.


    According to research, it can be concluded that keys longer than `80 bits` make
    brute force cryptanalysis a nearly impossible task for smooth and robust design
    and implementation. However, most `802.11 WLAN` keys rely on scrawny, which is
    `40 bits`. However, no computer is completely safe. In recent attacks, it was
    shown that the `WEP` approach to privacy is very vulnerable to some attacks. These
    attacks were successful regardless of the key size.


    # Protecting Message Integrity


    Unlike picking up your phone to call your friend or to share sensitive information,
    it''s not safe because the third party can breach your communication. Encrypting
    your messages prevents you from having total flexibility regarding the messages
    being sent because you can be sure your information is 100 percent secure. Encryption’s
    basic security task involves making sure your messages get to the receiver intact.
    The `IEEE 802.11` specification offers good security in this respect by outlining
    a simple check called `CRC` (`Cyclic Redundancy Check`). The purpose of this check
    is to ensure your messages are provided with data integrity, making your transmitted
    messages between clients and access points more secure.


    This security service was made to reject any message anyone may have changed during
    the transmission. This service does not mean that you can simply log into your
    network, compose a message to a client and assume total security. It needs a lot
    more. The access point and client compute a `CRC-32` frame check sequence called
    an `ICV` (`Integrity Check Value`) for each frame before transmission. Encryption
    isn’t a direct message you can send to a friend to read in pure English or Chinese.
    (You can call it tech jargon.) It actually won’t make any sense to a layman who
    happens to read an encrypted message.


    Despite the fact that a message is encrypted, there must be a way for the receiver
    to read and understand it in a human-readable language. The process of reading
    encrypted data or information is called decryption. To confirm whether the message
    being transmitted hasn’t been changed, the receiver will need to decrypt the frame
    and then recompute the `CRC` on the message. After the decryption, the receiver
    will compare the computed `CRC` with the original message. In this process, if
    the receiver sees that the `CRCs` are not equal, it can be deduced that an error
    has occurred. At this point, the receiver will have to discard the frame since
    it has been compromised.


    This is a great idea. If you think this form of encrypting information is the
    best, think again. This idea is poorly implemented, as it is possible to flip
    bits with data that will still end up passing the `CRC` check.


    **Verdict: Message modification is possible.**


    With all of the pros of `CRC` encryption, one would think that it is a top-notch
    security feature. However, it is possible to modify a message that is sent on
    `CRC`, which has made the `CRC-32` inadequate for protecting against intentional
    data integrity attacks. Therefore, you need more real cryptographic mechanisms
    such as a message digest or `MAC` (`message authentication code`) to prevent deliberate
    attacks. Imagine trying to hack the network of a company like `Facebook`, and
    your only tool is `Internet Explorer`. Does this even make sense? Remember, you
    need the right tools for the right job. Using non-cryptographic mechanisms will
    facilitate an attack against cryptography. One reason for this is the use of `64`
    or `128` keys for privacy and integrity. Thus, this is a cryptography no-no.


    # Using Encryption


    Blogs, the press and other online articles have done a lot to discourage both
    individuals and organizations from using wireless networks. If you have been paying
    attention to the tech blogs, you will have seen a lot of negative articles regarding
    the security of wireless networks. The focus of the negativity lies with those
    dealing with encryption. However, not everyone posting on the internet understands
    what they are posting about; some just copy and paste, while others are paid to
    post. Research shows that most people who post negative articles about wireless
    security do not have a clear understanding of the basis of `WEP`. Through the
    name `WEP` (`Wired Equivalent Privacy`), the developers intended to give users
    the same level of security that is found on a wired network. However, to be candid,
    this level does not provide much security at all. With the exclusion of a fully
    switched environment, eavesdroppers can have their way with frames while traversing
    a wired network. The implementation and design of `WEP` were actually never intended
    to provide message integrity or confidentiality in any form.


    In the design of `WEP`, there is an incorporation of a symmetrical `Ron’s code
    four algorithm` (`RC4`) and a `Pseudo Random Number Generator` (`PRNG`). The initial
    implementation of `WEP` uses a standard which specified `40` and `128-bit` key
    lengths with a `24-bit IV` (`Initialisation Vector`). One of the issues it encountered
    was incomplete coverage of network layers: `WEP` encrypts layers `3` through `7`,
    although it doesn’t encrypt the `MAC` layer, which is layer `2`. Recall that `WEP`
    uses a symmetrical algorithm; this is why `WEP` gives its clients the key and
    any other necessary configuration data.


    `RC4` configuration, in general, isn’t so bad because it is used in most web browsers
    for their `SSL` (`Secure Sockets Layer`). However, the problem it has with `WEP`
    implementation and also the negative sense of security it creates is not so good.
    However, how does this work exactly in `WEP`?


    The simple algorithm it uses works in such a way that it takes the initialization
    vector, which is originally in a plaintext (human readable) form. After taking
    it in `IV` form, it sticks it on the front end of the secret key. (The decrypter
    will actually know this.) When this is done, `WEP` will take the result and plug
    it into the `RC4` to regenerate a fresh key stream. The algorithm will then `XORs`
    the key stream with the inbuilt tool called `CipherText`. This will give us the
    values in plaintext. Finally, `WEP` re-performs the `CRC-32` checksum on the transmitted
    message to ensure that it matches the integrity check value exactly as it is on
    the encrypted plaintext. What if the checksums did not match each other? `WEP`
    will immediately assume someone else somewhere has compromised the packets being
    sent and will automatically discard it.


    Earlier, access points were mentioned. Access points generally have only three
    encryption settings available. These are:


    - None: The name looks simple, but these access point encryption settings happen
    to be the riskiest of them all. The reason is that the data being transmitted
    can easily be intercepted by someone else, who can read and even alter the unencrypted
    data traversing the network. You must be careful using these settings.

    - 40-Bit Shared Key: The increase in bits doesn’t actually say it has its own
    bad side. This setting will encrypt the network communication data, but can still
    be compromised; it is just a bit safer than the first settings. However, on the
    bright side, this 40-bit encryption has been broken before using a brute force
    cryptanalysis attack, which was commenced on a high-end graphics computer. It
    should be noted that it is also possible to break the keys on a low-end computer.
    By the end, the 40-bit shared key has a questionable value. Later in this book,
    we will talk about the tools you can use to recover 40-bit keys. However, if it
    is possible for you to recover such keys, it is possible for other hackers to
    achieve the same goal.

