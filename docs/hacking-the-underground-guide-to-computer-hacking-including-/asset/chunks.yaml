    ## HACKER STUFF


    As we have stressed in other chapters, if you want to catch an enemy, you need
    to think like an enemy. The same applies to a thief. In The Art of War , Sun Tzu
    writes that you need to understand your enemy to defeat him/her. This relates
    back to the methodology that learning about your enemy is an excellent tactic.
    You need to understand your enemy, think like him and act like him because if
    you can really put yourself in your enemy’s mindset, you will be able to understand
    him/her better. We have compiled for you the best sites that will help you better
    understand crackers and hackers.


         Honeypots: Tracking Hackers: [www.tracking-hackers.com](http://www.tracking-hackers.com)


         The Hacker Quarterly magazine: [www.2600.com](http://www.2600.com)


         Computer Underground Digest: [www.soci.niu.edu/~cudigest](http://www.soci.niu.edu/~cudigest)


         The Online Hacker Jargon File: [www.jargon.8hz.com](http://www.jargon.8hz.com)


         PHRACK: [www.phrack.org](http://www.phrack.org)


         Hacker t-shirts and other equipment: [www.thinkgeek.com](http://www.thinkgeek.com)


    ## WIRELESS ORGANIZATIONS


    There are many wireless organizations out there, but two of them are: Wi-Fi Alliance
    and IEEE.


    IEEE (Institute of Electrical and Electronics Engineers)


    In this book, we have mentioned wireless standards like 802.11, 802.11a, 802.11b,
    802.11g and 802.11i. These standards are implemented by the IEEE ( [www.ieee.org](http://www.ieee.org)
    ). The Institute of Electrical and Electronics Engineers (IEEE) has been in operation
    for decades and is known for developing open wireless standards for Wireless Local
    Area Networks (LANs), Wireless Metropolitan Area Networks (MANs) and Wireless
    Personal Area Networks (PANs). You can differentiate the 802.11 standards (“Over
    the air”) from the 802.3 Ethernet standards (“Over the wire”). You can read more
    about IEEE standards by visiting previous chapters or consulting Internet blogs
    and forums.


    Wi-Fi Alliance'
