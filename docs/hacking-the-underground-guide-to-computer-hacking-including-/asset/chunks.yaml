- fmt: '

    These hackers are the “evil” hackers. Their intentions and their methodology violate
    every definition of “good.” Black hat hackers hack with a malicious intention
    of breaking every rule in the book. They hack for personal gain, as well as for
    monetary reasons. They are known to be from illegal communities that perfectly
    fit the stereotype of computer criminals. Black hat hackers use a network’s weak
    spots to render the system useless. These hackers will also destroy your data
    and information if they are given the chance to do so. When these hackers get
    into your system, they will threaten to expose your private information to the
    public with the goal of getting you to do whatever they want. Needless to say,
    black hat hackers will not fix vulnerabilities in your computer system or network,
    but will use them against you.


    ### 3. GREY HAT HACKERS


    The intentions of grey hat hackers cannot be compared to those of the hackers
    mentioned earlier. These hackers will trawl the internet and look for weaknesses
    in a computer system or network and hack into it. They may do this to show loopholes
    in the network to the network administrator and suggest ways of rectifying those
    loopholes for a given price.


    ### 4. BLUE HAT HACKERS


    It is said that the color blue represents a member of law enforcement, although
    this is just a convention. These hackers are freelancers who sell their hacking
    skills as a service. Computer security firms hire hacking experts to test their
    networks so that they can be checked for weaknesses, vulnerabilities and loopholes
    before they are released to the public. Blue hat hackers are “good guys” and are
    different from grey hat hackers, whose intentions may be unpredictable.


    ### 5. ELITE HACKERS


    These are hackers who are the experts in the community. In most cases, they can
    break into something impenetrable and also write complex hacking programs. An
    example of an elite hacker is `Gary McKinnon`. As a kid, McKinnon broke into the
    channels at `NASA`, installed viruses and deleted files. Elite status is conferred
    on this type of person primarily by the hacking community or group to which the
    person belongs.


    ### 6. SKIDDIE


    These hackers are not complete newbies. The term `Skiddie` stands for `Script
    Kiddie.` They hack into a computer system or network by using tools that were
    created by other expert hackers. In most cases, they have little knowledge about
    the program’s background and creation. They are only there to use the programs.


    ### 7. NEWBIE


    According to the encyclopedia, the word `newbie` means “A new user or a participant
    who is extremely new and inexperienced to carry out an activity.” Newbie hackers
    are beginners in the world of hacking. They have no prior knowledge or experience.
    They hang around at the periphery of the community with the objective of learning
    the ropes from their peers.


    ### 8. HACKTIVISM


    This version of hacking is a process in which a community or an individual uses
    hacking skills to push information to the public through the hacked system. Hacktivism
    can be classified into two kinds:


    1. Cyber terrorism: This is called terrorism because the hacker intends to break
    into a system with the purpose of totally destroying or damaging that system or
    network. The hacker will render the computer completely useless.

    2. Right to information: These people will hack into a system or a network to
    gather confidential data from both public and private sources, making the information
    accessible to anyone.


    ### 9. INTELLIGENCE AGENCIES


    Any country can be hacked. To keep a country safe from hacking, intelligence agencies,
    along with anti-cyber terrorism agencies, engage in their own form of hacking.
    They do this to protect their countries from foreign attacks and threats. In the
    normal sense, we can’t conclude that this is hacking because these agencies are
    acting as blue hat hackers to employ a defense strategy.


    ### 10. ORGANIZED CRIME


    In many crime movies, the villain has a godfather for whom he or she works. Organized
    crime hackers work for bosses. They are related to black hat hackers because they
    commit crimes and break laws to aid in the criminal objectives of the godfather
    or gang to which they belong.


    ## STEPS PERFORMED BY HACKERS TO HACK A SYSTEM/NETWORK


    Before a hacker can hack into a system, he or she must complete certain processes.
    Some of these are:


    1. RECONNAISSANCE


    To avoid being hacked, you should keep your private information very secure. The
    word `reconnaissance` in this context is a means by which the hacker tries to
    gather all information regarding you (the target) and any weak spots in your system.
    The hacker uses this step to find as much information as possible about the target.


    2. SCANNING AND ENUMERATION


    In this phase, the hacker uses the information gathered during the previous phase
    to test and examine your network. Scanning involves the use of intelligent system
    port scanning to examine your system’s open ports and vulnerable spots. The attacker
    can use numerous automated tools to check and test your system’s vulnerabilities.


    3. GAINING ACCESS


    If the hacker was able to complete the two phases above, his/her next stage is
    to gain access to your system. This stage is where all of the hacker’s fun will
    begin. He or she will use the weaknesses discovered during the reconnaissance
    and scanning of your system to break into your connection. The hacker could exploit
    your local area network, your internet (both online or offline) or your local
    access to a PC. In the real sense, the moment a hacker breaks into your system
    or network, the hacker is considered to be the owner of that system. The security
    breach refers to the stage in which the hacker can use evil techniques to damage
    your system.


    4. MAINTAINING ACCESS


    In the previous phase, we said that once a black hat hacker hacks your system,
    it is no longer yours. In this phase, after the hacker has breached your security
    access and hacked your system completely, he or she can gain future access to
    your computer by creating a backdoor. So even if you get access to that computer
    system or network again, you still can’t be sure you are in total control. The
    hacker could install some scripts that would allow access to your system even
    when you think the threat is gone.


    5. CLEARING TRACKS


    The hacker gained access to your system and at the same time maintained access
    to that system. What do you think the hacker will do next? The hacker will then
    clear all of his or her tracks to avoid detection by security personnel or agencies
    so that he or she can continue using the system. In other cases, the hacker may
    do this just to prevent legal action against him or her. Today, many security
    breaches go undetected. There have been cases in which firewalls were circumvented
    even when vigilant log checking was in place.


    ## BASIC SECURITY GUIDELINES


    By now, you should have some insight into what hacking is all about. Now we will
    outline the fundamental security guidelines that will protect you, your system
    and your information from external threats. All of the information we will provide
    is based on practical methodologies that have been used successfully. These methodologies
    will help prevent a computer system from being attacked and ravaged by malicious
    users.


    ### Update Your OS (Operating System)


    Operating systems are open to different types of attacks. On a daily basis, new
    viruses are released; this alone should make you cautious because your operating
    system might be vulnerable to a new set of threats. This is why the vendors of
    these operating systems release new updates on a regular basis, so that they can
    stay ahead of new threats. The best way to protect yourself from new threats is
    to update your operating system on a weekly or monthly basis. This will help you
    improve your security and reduce the risk of your system becoming a host to viruses.

