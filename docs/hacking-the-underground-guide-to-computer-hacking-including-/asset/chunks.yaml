- fmt: '

    Once you are in the BeEF framework, it will open a “Get Started” tab. Here you
    are introduced to the framework and learn how to use it. Of particular importance
    is hooking a browser. Hooking a browser involves clicking a JavaScript payload
    that gives the BeEF framework access to the client''s browser. There are various
    ways by which we can deploy this payload, but the simplest way is to create a
    page with the payload, prompt the target to visit that page and execute the JavaScript
    payload. You can be very creative about this aspect. On the other hand, there
    is a link on the Get Started page that redirects you to The Butcher page. Below
    this page are buttons containing the JavaScript payload. Clicking on this button
    will execute the script and, in turn, hook your browser. When your browser is
    hooked, you will see a hook icon beside your browser icon on the left side of
    the BeEF control panel with the title “Hooked browser” along with folders for
    online and offline browsers.


    Once a browser is hooked, whether it’s online or offline, we can control it from
    our BeEF control panel. Clicking on the details menu in the control panel will
    provide information like the victim’s browser version and the plugins that are
    installed. The window size of the browser also can be used to determine the victim’s
    screen size, the browser platform (which is also the operating system on the PC),
    and a lot more information. For executing commands on the browser, we click on
    the command menu in the control panel. This brings up a different command we can
    execute on the victim''s browser. This command would create a pop-up message on
    the victim''s browser, so it can be renamed creatively before execution to avoid
    raising any suspicion. Some of the commands that can be executed in this menu
    include the Get all Cookie command (which starts harvesting the victim''s browser
    cookies), the Screenshot command, the Webcam command for taking pictures of the
    victim, the Get visited URL command and so on. There are a lot of commands in
    this menu.


    The BeEF framework JavaScript payload can also hook mobile phone browsers. Checking
    the details tab after hooking will give that particular information if we end
    up hooking a phone browser. Clicking on the module and searching the `PhoneGap`
    command allows us to execute phone targeted commands like geolocating the device
    and starting an audio recording on the victim''s device. Clicking on the `Ipec`
    menu also displays a terminal we can use to send shell commands to the victim''s
    system.


    Once the BeEF framework hooks a browser, the possibilities are endless. We can
    do virtually anything. Therefore, it is important to be careful when clicking
    links and pop-up or flash messages.


    ## METASPLOIT


    The Metasploit framework is perhaps the larget, most complete penetration testing
    and security auditing tool today. This tool is an open source tool that is regularly
    updated with new modules for monitoring even the most recent vulnerabilities.
    Metasploit comes with the Kali Linux distro. It is written in Ruby, although when
    it was created it was written in Perl. This tool was developed by HD Moore in
    2003 and was then sold to an IT company called Rapid7 in 2009.


    Metasploit is an immensely powerful tool that has great versatility. To fully
    utilize Metasploit, you must be comfortable using the terminal, which is a console
    type window. However, there is an option that allows for the use of Metasploit
    in a GUI window. Armitage, an opensource tool, makes this possible, although it
    does not have the capacity to fully utilize all aspects of the Metasploit framework
    in an attack. The `meterpreter` in the Metasploit framework is a module that is
    dumped in the victim''s system, making it easy for the hacker to control that
    PC and maintain access for future hacks in that system. Getting started with Metasploit
    on Kali Linux is as good as opening the terminal and typing `msfconsole` without
    the quotes.


    Metasploit contains modules that can be used during a hack. Some of these modules
    are written by developers or contributors from the open source community. An important
    set of modules includes the payloads. The payloads are very important when it
    comes to performing attacks within the Metasploit framework. These payloads are
    codes that have been written so that the hacker can gain a foothold in the victim''s
    computer. Perhaps the most popular among these payloads is the `meterpreter`.
    This particular payload is very powerful, as it leaves no trace of a hack on the
    system''s drive. It exists solely on the victim''s system memory.


    Then there is the `Exploits` module. These exploits are codes that have been written
    and packed for specific flaws in a victim''s operating system. Different exploits
    exist for different operating system flaws, so flaws that are targeted for one
    vulnerability would fail when used for another.


    The `encoders` are modules that encode the different payloads deployed into the
    target system to avoid detection by the victim''s antivirus, anti-spyware or other
    security tools.


    Other modules available on the Metasploit framework are the `Post` modules (which
    allow the hacker to gather passwords, tokens and hashes), the `Nops` modules (most
    of which allow for 100 percent execution of the payload or exploit) and the `Auxiliary`
    modules (which do not fit into other categories).


    This framework is quite robust, as many kinds of hacking procedures can be carried
    out. Several procedures are executed by combining the modules and making them
    work in different ways. A good way for a beginner to learn more about the Metasploit
    framework is to type `help` without the quotes in the Metasploit framework console.


    # CHAPTER EIGHT: PENETRATION TESTING AS A PROACTIVE SECURITY MEASURE AND WEB SECURITY
    MEASURES


    ## PENETRATION TESTING


    Penetration testing is ethical hacking. For every asset we own, we must provide
    adequate security, even more so if those assets are being used by other people,
    who may be our customers. If you run a website that saves or receives sensitive
    information from your users, your website or web apps must be accessed.


    Pentesting: This is another way of saying penetration testing. It is the practice
    of testing a computer system or web application to find vulnerabilities that an
    attacker could exploit. It is a certified pretend attack that looks for vulnerabilities
    and gradually gains access to the system’s data. It helps determine security policy
    compliance, employees’ security awareness and an organization’s ability to identify
    and respond to security incidents. It is very effective because it finds some
    of the most complex attack vectors across systems if an intrusion is made. It
    can also help detect the attack approach of a hacker and therefore prevent its
    reoccurrence. Pentesting requires manual and automated testings that are performed
    by using a vast array of tools.


    The process of penetration testing may be simplified into two parts. The first
    has to do with discovering vulnerabilities including all of the legal processes
    that allow those testing the network to run illegal operations. The second involves
    taking advantage of the vulnerabilities to allow access to just one machine, which
    is meant to exploit a vulnerability. This singular successful exploit opens the
    door to controlling the other systems in the network. This particular process
    is known as `pivoting`. There are many other pentesting strategies, which can
    be selected depending on the threat they are meant to deal with.


    In general, targeted testing is executed by the organization’s IT group. This
    group works together with the penetration group to achieve desired results. Furthermore,
    external penetration testing is aimed at a company''s externally detectible servers
    or devices, including DNS, web servers and e-mail servers. The primary goal is
    to determine whether it is possible for a hacker to gain control of the network
    and if so, how much destruction can be caused.

    '
