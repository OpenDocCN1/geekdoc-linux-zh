- fmt: '

    Another way to describe a DDOS attack is by comparing it to a town accessible
    by just one bridge. This town would be likened to our server hosting the website
    while the bridge is the bandwidth that website has for serving traffic. The other
    city to which the bridge is linked is the attacker or hacker trying to shut down
    the website. If the bridge can allow passage of about 300 cars at a particular
    time, and if 900 cars drive out of the city on that road at a particular time,
    the number of cars on the road would overwhelm the bridge. The result would be
    a bumper-to-bumper traffic jam on the bridge. This could stall the movement of
    goods to and from the town, deny legitimate users access to the bridge and cripple
    the economy, which would lead to the loss of millions in revenue if the situation
    were to continue for a long time.


    The DDOS attack becomes even more devastating with the availability of free tools
    that make it easy to launch this type of attack. Such tools cause server crashes
    and ultimately take down the service. DDOS attacks are usually done for publicity
    because they are the “statements” of hackers who are trying to gain a reputation
    or prestige. The following are some of the free tools used in performing a DDOS
    attack on a server.


    ### Low Orbit Ion Canon (LOIC): This tool is perhaps the most popular free DOS
    attacking tool available. This tool is so easy to use, as even newbies have no
    problem utilizing it. This tool has been used by the infamous Anonymous hacker
    group. It requires only that the user provide the address of the server and does
    the rest by itself. It also has the ability to control and coordinate other LOIC
    systems remotely to perform a DDOS attack on a website. However, this tool does
    not mask your IP address and can cause you to be traced and arrested if you use
    it for a malicious purpose.


    ### XOIC: This tool is just like LOIC in its ease of use. However, the creators
    claim it is more secure than LOIC. It has three attacking modes that can be chosen
    based on the hacker’s intention.


    ### HTTP Unbearable Load King (HULK): This is another popular DDOS attack tool
    that comes with improved security for the hacker. It has the ability to avoid
    detection during execution of the attack.


    ### RUDY (R-U-Dead-Yet): I could not possibly talk about DDOS attack tools without
    mentioning our dear RUDY. It executes an attack using an HTTP POST method. It
    detects forms present on the website and executes its attack using the form fields.


    A myriad of free DDOS attacking tools are present on the web. Some hackers remotely
    install these tools on computers owned by unsuspecting users and can remotely
    control them to perform a DDOS attack. These types of computers are called zombie
    computers. However, some of these free tools are created for testing purposes,
    although hackers have used them to execute malicious server attacks.


    Protecting against a DDOS attack should be a top priority in any organization’s
    web or online objective. The basic approach to doing this involves installing
    a powerful firewall that detects and blocks fake traffic. Traffic sent to the
    website can also be redirected to another IP address for analysis, detection and
    rejection. This approach is called sinkholing. Routing the traffic through cleaning
    centers to sift the traffic is another way to prevent DDOS attacks. For personal
    PCs, it is important that the user avoids installing software from unknown, illegitimate
    sources. Most of these types of applications contain trojans which can allow the
    hacker to remotely access the PC, thereby using the PC in his/her zombie network
    to execute a DDoS attack. It is also very important to keep the operating system
    up to date by installing security fixes or patches and by using a great antivirus
    program.


    ## Waterhole attacks


    Hackers have always sought ingenious ways to launch attacks on users. Sometimes
    these attacks may be focused on individuals, while other times the focus may be
    a company or organization. On the other hand, a hacker may just cast a broad net
    and hope a user falls into it. Waterhole attacks are focused attacks that involve
    a broad net. The attacker focuses on employees of an organization and sets a trap
    that is meant for at least one of the targeted employees. The concept of the waterhole
    attack stems from the animal kingdom, in which a predator waits around a watering
    hole for prey. The predator hides and whenever the prey comes around for a drink,
    the predator moves in for the kill.


    Basically, the hacker identifies an organization to attack, then observes the
    employees of that organization and discovers the websites that are visited by
    most of those employees. An excellent website would be a small to average-sized
    one whose owner is not particularly security conscious. The hacker scans this
    website for vulnerabilities; once he identifies these flaws, the hacker injects
    codes in the website that take advantage of these vulnerabilities. Whenever employees
    visit this website, they are prompted to download contents or visit another page.
    Once this malicious code is executed on the victim''s device through either the
    download of malware or drive-by attacks, the hacker gains control of the victim''s
    system and can execute attacks on the organization’s network for that system.


    ## DRIVE-BY ATTACKS


    Sometimes a system is compromised simply when a user visits a compromised web
    page. This is done mostly by using drive-by attacks. Today, with users accessing
    a website through a wide range of devices, like smartphones, tablets and computer
    systems, websites are designed to be more responsive toward changes in screen
    size, screen resolution and the operating system.


    Websites now contain instructions that seek and find details like browser type,
    Flash and Java plugin versions, and other details necessary for adjusting the
    website to the client''s device. When hackers compromise a web page that contains
    instructions about this information, they become adequately equipped to launch
    targeted attacks that are focused on exploiting vulnerabilities in the system’s
    browser or plugins.


    Attacks like these are very difficult to detect, so it is important that users
    ensure their applications and operating systems are always up to date. It is also
    important to download all security patches as soon as they become available.


    ## CLICKJACKING


    This is a user interface redressing attack. The hacker fools the user into clicking
    on a malicious link when the user intends to click on a legitimate link presented
    on a website. This type of attack usually flies under the radar and is not as
    popular as the other website attacks. This particular attack takes your attention
    from what matters, and before you know it, you have been hacked. In fact, it is
    a very clever way of hacking.


    The attacker visits a website, which is usually a financial or e-commerce site.
    The attacker navigates to a page that is suitable. The attacker then creates an
    `iframe` on that website describing a marvelous offer for money or luxury goods–something
    the victims would be likely to click. Then he places that frame over the legitimate
    link on the website that may not interest you but that will serve the purpose
    of hacking when clicked. You are fascinated by the message and click on the link,
    which causes money or goods to be sent to the hacker’s account or address.


    # CHAPTER SEVEN: ATTACKING WITH FRAMEWORKS


    ### SOCIAL ENGINEERING

