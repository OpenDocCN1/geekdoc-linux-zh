    ## 安全意识与培训


    有些事情自然是容易避免的。例如，让管理层或员工关注信息；这并不是一项易事。有些公司会为你处理这类事情并帮助你传达信息：


    - Greenidea, Inc Visible Statement: [www.greenidea.com](http://www.greenidea.com)

    - The Security Awareness: [www.thesecurityawarenesscompany.com](http://www.thesecurityawarenesscompany.com)

    - Security Awareness, Inc Resources: [www.securityawareness.com](http://www.securityawareness.com)

    - U.S. Security Awareness: [www.ussecurityawareness.org](http://www.ussecurityawareness.org)


    ## 无线工具


    书中的无线章节包含许多关于工具的细节。我们描述了许多可以于无线网络的工具。上述提到的大多数工具都进行了总结，并提供了获取它们的信息。然而，以防你刚刚起步，我们将提到的工具将构成一份很不错的列表。


    你听过“跨平台”这个术语吗？这指的是无论系统操作系统类型如何，都能运行在任何类型的计算机上的程序。所有工具都放置在类别中，类别定义了它们的功能。然而，在所有这些工具中，有些是无法归类的。我们没有忽略这些优秀的工具，而是列出了以下列表：


    - BLADE Software Informer: [www.bladesoftware.net](http://www.bladesoftware.net)

    - Foundstone SiteDigger Google tool: [www.foundstone.com/resources/freetools.htm](http://www.foundstone.com/resources/freetools.htm)

    - MAC-address-vendor lookup: [`coffer.com/mac_find`](http://coffer.com/mac_find)

    - SMAC MAC-address editor for Windows: [www.klcconsulting.net/smac/](http://www.klcconsulting.net/smac/)

    - WiGLE database: [www.wigle.net/gps/GPSDB/query/](http://www.wigle.net/gps/GPSDB/query/)

    - WiFimaps: [www.wifimaps.com](http://www.wifimaps.com)


    ## 漏洞数据库


    显然，不知道不知道来源就无法解决问题，如果你不采取措施就无法保持保护。作为一名伦理黑客，你必须了解与你的软件或硬件相关的漏洞或缺陷。当你参与规划过程中，你收到的信息将决定你对系统执行的测试类型。一些漏洞数据库如下：


    - US-CERT Vulnerability Notes Database: [www.kb.cert.org/vuls](http://www.kb.cert.org/vuls)

    - NIST ICAT Metabase: [`icat.nist.gov/icat.cfm`](http://icat.nist.gov/icat.cfm)

    - Common Vulnerabilities and Exposures: [`cve.mitre.org/cve`](http://cve.mitre.org/cve)


    ## Linux 发行版


    尽管 Windows 操作系统很有名，但它并不是某些无线测试工具的最好操作系统。当我们谈论市面上最好的操作系统时，可以看看 LINUX、UNIX 或 BSD。许多无线测试工具在这些操作系统上运行得完美。这意味着你不仅需要熟悉
    Windows，还需要熟悉这些其他操作系统。作为 Linux 用户，你可以购买 Red Hat Linux 或 SuSe 这样的商业产品。唯一的问题是对于你的目的来说这大材小用了。与其购买那些工具，不如尝试免费的
    Linux 发行版？以下是你可以免费使用的发行版列表：


    - Auditor: [`new.remote-exploit.org/index.php/Auditor_main`](http://new.remote-exploit.org/index.php/Auditor_main)

    - Cool Linux CD: [`sourceforge.net/project/showfiles.php?group_id=55396&release_id=123430`](http://sourceforge.net/project/showfiles.php?group_id=55396&release_id=123430)

    - DSL (Damn Small Linux): [www.damnsmalllinux.org/](http://www.damnsmalllinux.org/)


