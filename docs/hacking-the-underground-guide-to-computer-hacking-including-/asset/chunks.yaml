    “Linux 是人类发明以来兼容性最好的操作系统。”你现在应该已经熟悉这句话了。在这里，我们将测试 Linux 与 `Windows` 等其他流行操作系统的功能对比。Linux
    虽有缺点，但它的优势远超缺点。


    ## 成本


    那些不提供像 `Linux` 那种服务的操作系统，其价格相当荒谬。在经过一段时间后，其他操作系统将需要支付费用才能升级到下一个版本。不支付这笔费用将导致操作系统的功能减少。`Microsoft`
    和其他操作系统只能在特定的计算机上授权。尝试将操作系统与另一台计算机共享将需要另一笔授权费用。这与 `Linux` 不同，`Linux` 的版本可以在尽可能多的计算机上共享而无需额外费用。除了某些高级版本外，所有
    `Linux` 版本都是免费的，这些版本在授权或升级方面几乎不需要费用，且只需支付一次费用。


    ## 安全性


    抛开成本，让我们在安全性维度上衡量包括 `Linux` 在内的操作系统。`Linux` 的安全性强度远超其他操作系统。有了 `Linux`，就不存在更新杀毒版本的需求。其他操作系统并非如此。一个
    `Linux` 程序可以运行多年而不受恶意软件、病毒或蠕虫的威胁。`Linux` 程序的开源使得任何随机用户在病毒影响系统时几乎都能立即清理系统。而在其他操作系统上，你必须等待负责的公司提供病毒的解决方案。


    ## 选择（自由）


    作为一名 `Linux` 用户，你有能力以许多方式控制操作系统。你可以控制的两个非常重要的事情是桌面显示内核内核`kernel`）。在 `Windows`
    中，默认显示可能会让你无所适从，并导致你因尝试安装某种第三方外壳而破坏系统。


    ## 软件


    有成百千个软件程序可以使用来完成你的主要任务。如果你想修改命令行，你有各种选项可供选择。每天，普通用户都可以升级 `Linux` 程序中已有的功能特性，添加新功能并改进应用程序使其运行得更顺畅。此外，来自
    `Linux` 的应用程序或软件比任何随机软件都有更多的特性和功能。源代码随处可用，几乎所有软件都是免费安装的。此外，如果你是一个熟练的程序员，你可以编辑源代码并根据自己的喜好发明新功能。所有这些只有在
    `Linux` 中才能实现。


    ## 硬件


    `Linux` 适用于处理能力或存储空间极小或没有的旧电脑。运行在你电脑上的 `Linux` 程序可以充当防火墙甚至甚至是备份服务器。几乎没有 `RAM`
    的旧电脑也能流畅地运行 `Linux` 程序。


    ## 灵活性


    无需担心反盗版的小花招。当你访问安全论坛时，你会看到很多问题得到了解答，并提供了安全问题的解决方案。你有权执行单次杀毒测试，以及其他控制方案（`SELinux`、`grsecurity`
    等）。在其他操作系统上，可能有超过 50 种杀毒测试、反恶意软件应用、入侵防御应用以及其他几种安全应用可能会让你困惑。


    ## LINUX 的缺点


    ### 学习


    在尝试学习 `Linux` 操作系统及其功能时，你必须保持耐心。你必须决心投入所需的时间，这可能会让你跳出舒适区。为了让这个学习过程变得更容易，你应该向那些已经拥有
    `Linux` 知识和经验的人寻求帮助。


    ### 兼容性


    虽然 `Linux` 是免费的，但它确实有一些缺点。`Linux` 在品牌硬件亲和性方面存在缺陷。`kernel` 的贡献者和维护者勤奋地每天更新 `kernel`。与许多操作系统不同，`Linux`
    在企业支持方面提供的很少。你能找到第三方应用程序就已经很幸运了。


    ### 替代程序


    尽管 `Linux` 程序员们已经很好地为 `Windows` 等流行操作系统创建了替代软件，但某些 `Windows` 软件在 `Linux` 上完全找不到。一些示例包括
    `Chrome OS`、`FreeBSD`、`Syllable`、`ReactOS` 和 `Haik`。


    ## 高级 UNIX 编程对比 Linux


    一位 `Linux` 用户讲述了她第一次遇到 `UNIX` 的经历。她在 1972 年还是个孩子时遇到了 `UNIX`。当时她正前往 `Bell Labs`，那是
    `UNIX` 发明的地方。经过很长一段时间，像她那样的程序员变得非常熟悉被称为 `UNIX` 的“主要内容”。尽管当时 `Linux` 也已经存在，但她对它持怀疑态度，并不相信
    `Linux`。这可能不是她见过的第一个 `UNIX` 克隆版本，因为她曾发表过关于具有类 `UNIX` 特性系统的评论。该评论于 1985 年发表在《BYTE》杂志的一期上。她得出结论认为，在系统调用方面，`Coherent`
    是相当可靠的，尽管命令并不真正相似。然而，它无法匹配典型 `UNIX III` 系统的工业强度。


    20 世纪 90 年代初，从 80 年代后期开始，衍生自 `AT&T` 的 `UNIX` 系统无处不在，因此隆并没有太吸引她。此外，由于 `AT&T` 硬件成本昂贵，每个二进制代码的费用对总成本几乎没有影响。她和其他人一样，她从未知道
    `Idris` 和类似的克隆版本最终会消失。


    她在 1990 年到 1991 年间参加一次会议时，随后注意到一个类似的系统。她遇到了熟悉 `BSD UNIX` 的人，它不包含 `AT&T` 的代码。在那个时期，问题不是运行在几乎免费的
    `Intel` 基础上的。`GNU` 的主要目标是一套完整的操作系统。不久后，她偶然发现了 `Linux`。虽然这个名字对她听起来很熟悉，但她想不起第一次在哪里听到的。她唯一记得的是她急切想知道
    `Linux` 是什么。与此同时，她正领导着由一群程序员进行的研究。大约 1998 年，该团队在一次实验使用了 `Linux`。她感到震惊，因为在当时运行
    `Linux` 程序的概率几乎为零。

