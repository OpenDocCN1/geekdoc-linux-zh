- fmt: '

    Cross-site request forgery is not like the XSS attack. In the XSS attack, the
    hacker takes advantage of the trust the user has placed in that website, making
    the user accept instructions received via that website. However, in the CSRF attack,
    the hacker takes advantage of the user’s trust in the website or web app. The
    website or web app believes and executes any command the user gives to it once
    the user is authenticated on the website or web app. A web app that does not re-authenticate
    the user on every request is prone to CSRF attack. The attacker cajoles the user
    to click on a link which runs the code in the browser. That code then allows the
    attacker to hijack the user’s session on the web app or website and performs activities
    on behalf of that user. For example, a user who has been authenticated on a banking
    app may be sent a link containing a script that hijacks his/her session and makes
    the money transfer from his/her account into the hacker’s account. This attack
    is not only limited to fraudulent transfers; it can also be used to make purchases
    online, change email addresses and vote online.


    A good way to mitigate this kind of attack is to use a re-authentication or captcha
    system to check each request the user makes before execution.


    ## 5. File Inclusion Vulnerabilities


    File inclusion attacks occur in two separate ways: remote file inclusion and local
    file inclusion. The file inclusion attack is caused by, as you might have guessed,
    insufficient or bad user input validation. In this type of attack, a user with
    malicious intent can execute a command on the server by calling a script on the
    server (local file inclusion) or a remote server (remote file inclusion). This
    type of vulnerability occurs mostly on PHP written programs. The PHP syntax uses
    the `include` keyword in referencing codes that were written separately but that
    need to be implemented in the present program. For instance, a piece of code may
    be written to provide navigation for a page; the programmer may need to include
    this code in each page to enable the user to navigate the website easily. The
    programmer implements this by using the `include` functionality present in PHP.
    This functionality is essential for code reusability, as it eliminates the need
    to write new codes, thereby saving time in the developmental process.


    A remote file inclusion attack can be made when the malicious hacker discovers
    that the user input causes the app to access a script. When the request is sent
    in HTTP, the attacker can edit the address to include a script on a remote server.
    Thus, when that website loads, it executes this script retrieved from that remote
    server. The local file inclusion attack occurs essentially the same way, except
    that it accesses a script present on the same web server as the app.


    File inclusion attacks can be lethal. They can be used to hijack a user’s session;
    they are capable of stealing cookies and tokens present on the client''s browser.
    They can also be used to steal data or even take control of the total application
    in the case of a web application.


    However, this type of website or web app attack can be appropriately dealt with
    by taking some vital steps. The website or web app should limit the capacity of
    a user input that calls a script by using the `include` functionality. If this
    cannot be eliminated, the input should be properly validated and restricted in
    terms of the number of user input characters allowed. The app or website should
    reject special characters or characters that are not needed. The best way to avoid
    the file inclusion attack is simply to ensure that user input is properly validated
    once it is entered.


    ## 6. Session-based flaws


    A session is the time a user spends interacting with a website or web app. Whenever
    a user logs onto a site with his or her login details, the server authenticates
    the user and provides him or her with a session token. Session tokens are very
    important, as they prevent the user from having to log in every time a request
    is sent during interaction with the website or web app. This token is often a
    random long number and serves as automatic re-authentication with the web server.
    This essentially means that a token was like your login credentials when you were
    logging onto the website at the beginning of your session, and it should be strictly
    protected. If an attacker were to gain access to your tokens, he or she could
    easily impersonate you in the interaction with that web app or website.


    Tokens are passed from the server to the browser in the URL of the website or
    the cookies, or even in hidden form fields. The hacker can steal these tokens
    using various methods. Some of the more popular methods are:


    - **Man-in-the-middle attack**: This is conducted primarily on websites using
    Secure Socket Layer (`SSL`) protection. To the user, the hacker pretends to be
    the server, while to the server, the hacker pretends to be a legitimate user.
    This allows the hacker to get the information being sent from the user to the
    server and also the data being sent back from the server to the user.

    - **Packet or data sniffing**: This is when the hacker sniffs the data packet
    sent on a communication channel for information. This occurs mostly in communications
    that do not use the Secure Socket Layer (`SSL`).

    - **Brute force**: Some websites create tokens in a particular, definite format
    or even reuse tokens. If the hacker can get enough tokens to analyze and is using
    machines with excellent computing abilities, he or she can brute force the tokens
    and generate legitimate tokens that can be used when accessing the website.

    - **Using an XSS attack to steal tokens**: Since we have talked a little about
    XSS attacks, I believe you have an idea of what happens here. The attacker waits
    for the user to log into the web app and the server to send the token, which is
    then saved in the browser. Next, the hacker performs a cross-site script attack
    and tricks the user into executing it on his or her browser. This executed script
    is often a token-stealing script that sends the token to a remote server. The
    hacker can then use this token to interact with the website or web app.

    - **Session fixation attack**: This type of attack is very common for sites that
    send their tokens in the URL. The hacker visits a website or web app, logs in
    and is given a token. The hacker then crafts a URL with the token he or she has
    received and sends the link to the targeted user. The user is cajoled into visiting
    that website with the link and also logs in using that token. However, once the
    user logs in, he or she is not given a new token because he or she is using an
    existing token. Once the hacker has confirmed that the user has logged in with
    that session ID, the hacker does the same and hijacks the session from the user.
    So, in essence, the hacker gets a token, fixes it on a URL and persuades the user
    to log in with it.


    To protect against session-based attacks, we need to ensure that our website or
    web app is not vulnerable to cross-site scripting attacks (XSS), as this would
    make it easy to run token-stealing scripts. You should ensure that tokens and
    sessions are properly managed. In addition, sending tokens through URLs is highly
    discouraged. You should also ensure that all user-provided tokens are rejected,
    as the task of generating tokens should be left to the server.


    ## 7. SSL-Based Vulnerabilities

