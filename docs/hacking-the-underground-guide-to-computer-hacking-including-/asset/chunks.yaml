    * `Zombies` (hackers who use your computer network to exploit other networks;
    this will definitely incriminate your and your system)


    The dangers associated with wireless networks aren’t that different from those
    associated with wired networks. In short, wireless networks have a lot of vulnerabilities
    attached to them.


    As bad as it might look, if you don’t have the necessary tools, it will be very
    difficult or even impossible for you to know when you are being hacked, even if
    you are watching from a mile away. The wireless network can operate anywhere;
    this can include a curious neighbor who is using a frequency scanner to alternate
    your connection and listen to your cordless mobile conversations. Without a good
    tool for protection, anything is possible.


    ## KNOW YOUR ENEMY


    The vulnerabilities of a wireless network are not disadvantages in of themselves;
    the problem lies in the malicious hacker who takes his or her time to abuse these
    weaknesses. This will obviously make life harder for you. There is a saying: “To
    track a thief, you have to think like a thief yourself.” For you to protect your
    system, you need to reason the way a hacker would. You and your malicious hacker
    might have an entirely different perspective regarding the planning of the attack.
    Still, you will at least understand where the problem is coming from and how they
    operate as well.


    For starters, your hacker is likely to hack your system network if your security
    requires less work to access it. Hackers will usually target an organization that
    has only a few wireless access points. There are numerous reasons for this, as
    mentioned below:


    * Systems with fewer wireless access points are more likely to have not changed
    the default settings, which makes it easier for someone to hack into the system.

    * Small organizations will have less time for network administrators to watch
    their operations.

    * Small network systems are less likely to have network checking and controls
    like `WPA` or `WPA2`, or even a `WIDS` (Wireless Intrusion-Detection System).
    These are the first things a hacker will check out when trying to hack your network.


    However, not only small networks are vulnerable to a hacker’s attack. In networks
    of various sizes, there are plenty of other weaknesses a hacker can play around
    with, including the following:


    * Some network administrators do not have time to monitor the malicious behavior
    within their network.

    * Because a wireless network is an extension of its first generation (a wired
    network), whenever there is an `AP`, a wired network is most likely behind it.

    * Traffic can also be a weakness. This is because if a network is large, it is
    going to be easier to crack the `WEP` (Wired Equivalent Privacy) encryption keys.
    Traffic is the reason why large networks receive high traffic and an increased
    volume of packets is sent to the server to be captured. This leads to quicker
    and faster `WEP` cracking terms.

    * `Service-Set-Identifiers` (`SSIDs`) are set to recognizable companies or specific
    department names. This can offer the hacker or intruder insight into which system
    network should be attacked first.


    ## WIRELESS NETWORK COMPLEXITIES


    Installing a firewall or creating a strong set of passwords and having detailed
    access control settings is not enough to stay protected. In addition to all of
    the standards and vulnerabilities mentioned above, you must understand that the
    largest and most tedious obstacles to securing your wireless network are the complexities
    found within the network. However, no wireless network can be completely secured.
    There are some things that are not complex but may still be considered an obstacle.
    For instance, a plain old `AP` and a wireless `NIC` (interface card) might not
    actually be complex, although you can deduce that a lot more is going on at the
    backend.


    The `802.11` protocols aren’t developed to be perfect because they have big issues.
    These protocols don’t simply help you send and receive information with optimal
    management overhead, like the old Ethernet. Rather, the `802.11` protocols are
    deeply complex. Most of the wireless networks simply transmit and receive `RF`
    (radio frequency) signals which carry a packet of network data. The `802.11` network
    will actually perform more complex functions, such as:


    * Encrypting data to improve data privacy.

    * Authenticating clients to be sure only authorized personnel have access to their
    network.

    * Setting timing message packets to be certain about client synchronization and
    to help avoid data-transmission conflicts.

    * Checking the data integrity to make sure that all information remains uncontaminated.


    As complex as the `802.11` protocols are, their network design is associated with
    more complexities such as:


    * Staying updated with your wireless devices, which may include laptops, `APs`
    and `PDAs` (Personal Digital Assistants).

    * The kind of antennae to implement and where to locate them.

    * Knowing the exact type of devices that are allowed on your network and also
    those that are not.

    * Adjusting signal-power settings which will prevent your radio frequency signal
    from leaking outside your residence.


    All of these wireless network complexities add up to a multitude of security weaknesses
    that are not available in the old traditional wired networks.


    ## HAVING THE RIGHT TOOLS


    Every specific task in life requires the right tool. You can’t browse the internet
    without a browser. Even having a browser doesn’t guarantee that you can surf the
    web. This is because some webpages are written in a different language and if
    your browser is not developed to handle such a language, it will have a hard time
    loading the webpages. You must have the proper testing tools, which happen to
    be the most important component of the process of ethical hacking. Preparation
    involves working towards the right results; otherwise, you are most likely to
    turn your wheels and you won’t achieve a good outcome.


    The fact that your wireless tools were developed to accomplish a specific goal
    doesn’t guarantee that they will perform that test successfully. Sometimes you
    will even need to change your settings to achieve the result you seek, or sometimes
    you might need to combine the result of one with another. There is also the potential
    of getting a false positive (i.e., your tool says you have a vulnerability when,
    in fact, there are none) or a false negative (i.e., your tool says you have no
    vulnerability when, in fact, there is one).


    As technology is evolving on a daily basis, below are some of the best tools you
    can use to test wireless network security:


    * Laptop computer

    * Google

    * GPS satellite receiver

    * Network stumbler software

    * `QualysGuard` vulnerability software

    * `AiroPeel` network-analysis software

    * `WEPcrack` cracking software (for cracking encryption)


    Many of them are available on the internet. You obviously can''t do without good
    security testing software or tools, but it is crucial that you know none of these
    tools is the ultimate saviour in terms of finding and putting an end to your wireless
    network’s vulnerabilities. A mix of all of these tools will create the perfect
    combination for finding the vulnerabilities in your system. More importantly,
    you need to know how to use these tools and what specific tasks each is capable
    of handling.


    ## THE FUNDAMENTAL ANALYSIS OF PROTECTION

