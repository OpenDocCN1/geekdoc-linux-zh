    ### Comments on the HTML page


    This is primarily a coding problem that arises when deploying a website or web
    app. Programming best practices require that a programmer comment a block of code
    to explain how things function and why the code is structured the way it is. Sometimes
    developers also mention variables and database names that store information and
    how this information is used throughout the application process. This is especially
    important when multiple programmers work on a single project. However, when deploying
    the website or web app, it is necessary to remove these comments from the codes.
    When viewing a website on a browser, right-clicking on the page and choosing the
    view page source option opens a separate window where all of the HTML codes and
    some JavaScript codes are displayed. These codes were used in the building of
    the website or web app.


    On `Kali Linux`, a plugin named `WebScarab` can be used to filter out only the
    comments on a web page. This is done by choosing the fragment and the comment
    option in the fragment tabs drop-down menu. To prevent this type of information
    leak, it is necessary to remove the comments that contain sensitive information
    about the web app. To be extra careful, one can choose to remove all of the comments.


    ### 2. Authentication issues


    Authentication is a critical aspect of web security. This is when the application
    verifies the credential or login details of a user and confirms his/her presence
    in the database of the application or website. This should not be confused with
    authorization. Authorization is the process of allowing users or clients to access
    files they have been permitted to access after authentication is completed. Authentication
    is achieved using the username and login information provided by the user of the
    website or web app. Below are the common types of authentication protocols employed
    in websites and web apps.


    #### HTTP-Basic authentication


    This is the use of a username and password in authenticating a user. When a user
    provides his/her username and password for access in an `HTTP-Basic` authentication-based
    site, that information is sent in an encrypted format via a `base64` encoding
    system. The username and password are sent in the form of `username: password`
    before they are encoded using the `base 64` algorithm. However, this encrypted
    information can be intercepted if hackers decide to use tools like `Burpsuite`
    and `Wireshark`. The issues with this authentication system come from the `base
    64` encoding system, which can be easily decrypted because `Wireshark` automatically
    decrypts the encrypted credentials. Also, the usernames and passwords are transmitted
    in plain text with a colon(`:`), so they are very susceptible to eavesdropping.
    Using `SSL` can limit the risk associated with this type of vulnerability.


    #### HTTP-Digest authentication


    This authentication type was developed to combat the security issues of the `HTTP-basic`
    authentication. In this type of authentication, the server produces a random value
    called the `nonce`. This `nonce` is used in combination with the username, password,
    `nonce` value, `HTTP` method and `URL` of the page in creating an encrypted message
    that is sent to the server. This message is encrypted using an `md5` algorithmic
    encryption that cannot be decrypted backward, as in the case of `HTTP-Basic` authentication.
    For decryption to be possible, a hacker must be aware of those four credentials
    that are used in the encryption process. However, if a malicious user can recreate
    the same digest message to the server, he or she would be granted access. To restrict
    these types of attacks, servers often create timestamps with the `nonce` value
    so that any time an access request is sent to the server, the server checks the
    time stamp associated with that `nonce` value and allows access if the time is
    not exceeded.


    #### Form-Based authentication


    The most common form of authentication used on websites is form-based authentication.
    Here, the client provides a username and a password on the login page. Login pages
    are usually created with an HTML `<input>` tag. When information is entered into
    the tag, the information is transmitted to the server, where the credential is
    removed from the input tag, associated with a variable name and then checked against
    the username and password database. The server then returns a response that verifies
    the identity of the user or denies the user access to some areas of the website
    or web app. This type of authentication does not have a predefined way of encrypting
    the login information it receives, making it very customizable. However, the information
    is also shared in plain text unless `SSL` is used. Form-based authentication is
    very susceptible to brute-force attacks if hackers decide to use tools like `Hydra`
    in `Kali Linux`. Brute forcing is a password-guessing way of gaining access. It
    requires a username and a password list in which the credentials are cross-applied
    to the server to get the appropriate login details. For instance, if a username
    list contains five usernames and a password list contains five possible passwords,
    the brute forcing tool will try the five possible passwords for each of the usernames,
    creating a total of 25 login attempts. This list is built during the information-gathering
    process using social engineering.


    ### 3. Injection-based flaws


    Injection flaws are perhaps the most common and devastating flaws that can affect
    a website or web app. The client basically injects malicious code or script into
    any input field on a website or web app. This information is sent to the server
    and if the application is poorly designed, the server executes the commands that
    were present in the code and allows the client to access sensitive data or the
    root folder of the app. This always occurs when the application inadequately validates
    the input data, which allows the hacker to trick the application into performing
    undesired actions. Ultimately, this causes the hacker to gain control of the application.
    The two common types of injection-based flaws are:


    #### Command injection


    This type of injection-based attack targets the operating system of the server
    itself. The code is written with the input data that is submitted to the server.
    Applications that send shell commands to the server for information retrieval
    are very susceptible to command injections. These codes are usually shell commands
    that can be run by the server. Without a proper input validation system, the server
    executes the code that was sent to the server, allowing the hacker to access the
    server. Applications developed with an interpreted language are more prone to
    injection attacks.


    #### SQL injection


    This is by far the most common of the two types of injection attacks listed here.
    Every website or web app is considered incomplete without a database. This is
    the lifeblood of the web app itself. A relational database is the most popular
    form of database associated with websites and web apps. A relational database
    is essentially the product of storing information in a table that contains rows
    and columns. Interacting with this database is perhaps the most critical operation
    that a website or web app performs. To enable the web app or website to interact
    with this database, requests must be made for information present in that database;
    in addition, fresh data must be added to the database and existing data must be
    edited or modified. The application uses `SQL` commands to achieve this feat.
    Among programmers, it is called “querying the database.” Input forms, cookies,
    URL properties or variables like `headers` and `XML` requests can be used to send
    malicious instructions to the database, which trick it into divulging sensitive
    data like usernames, passwords and credit card information. Applications that
    query the database by binding an `SQL` command with the user input are also very
    prone to `SQL injection` attacks.

