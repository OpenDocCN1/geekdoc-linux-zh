    - When you sleep, you can still be attacked if your computer system is on and
    idle or in sleep mode. To prevent this, make sure your computer is completely
    switched off when you are not using it. It is not possible to hack into a system
    that is switched off.


    # CHAPTER TWO: INTRODUCTION TO WIRELESS NETWORK HACKING


    Technology is improving on a daily basis. Wireless networks are also called Wireless
    Local Area Networks (WLANs) or Wi-Fi networks. With the improvement of technology,
    almost all offices, homes, hotels and coffee shops are installing WLAN as a means
    of connection. Wi-Fi networks are adaptable and useful because of the comfort
    they bring to the user, their mobility and the simple fact that they can be less
    expensive, so almost anyone can afford them. Aside from the fact that this network
    is less expensive, it is also easier to implement than other wired network connections
    such as LANs (Local Area Networks). Given the customer’s demand, users’ solutions
    and the standard a company seeks to have, Wi-Fi technology is real and genuine.
    We can say that this technology is here to stay. However, the question is, how
    safe is this technology?


    Wireless networks are based on the `IEEE 802.11` (Institute of Electrical and
    Electronics Engineers) set of standards for WLANs. The `IEEE` is a group formed
    in February 1980–the same year and month the names were founded. In the name `IEEE
    802.11`, the `.11` at the end refers to the WLAN working group, which is a subset
    of the `802` group. In the industry of groups competing for the best wireless
    network, the best and hottest players in the game are the Wi-Fi Alliance and the
    `IEEE 802.11` working group.


    As the years have passed, the demand for wireless networks has increased tremendously
    and the WLAN niche has been specified for most specialized applications. Today,
    the use of wireless technology is rampant as everyone uses WLANs. You are using
    a WLAN whenever you use a smartphone, be it an Android, iOS, or any other operating
    software. Moreover, if you are surfing the web on computer that is not linked
    to a modem by an ethernet cable, you can conclude that you are using a Wireless
    network.


    One key point you need to remember is that “ No Computer Network is Completely
    Safe. ” The widespread use of this technology has exposed computers to many new
    dangers. As large as the `IEEE` group is, the prevalence of wireless networks
    has made them a bigger target than was ever anticipated. The weakness in the Wired
    Equivalent Privacy, which is known as `WEP` in the `802.11` wireless protocol,
    has not been of help either. Quoting Microsoft, it has been demonstrated that
    the higher you go in business and the more popular you are, the more attacks you
    will suffer.


    With the flexibility that wireless networks have brought into our lives, including
    convenience, productivity and cost savings, security is a higher risk. The most
    common security issues known to a wireless network used to be weak passwords,
    spyware and missing patches. Although all the mentioned risks are still in existence
    and are still increasing, WLAN has brought about a new set of vulnerabilities
    from an entirely different angle, such as the birth of ethical hacking. This hacking
    is sometimes referred to as white hat hacking and is used to defend against unethical
    hackers.


    Ethical hacking goes deeper than just the name; you can consider it to be an act
    of penetration testing along with vulnerability testing. In hacking, there are
    many types of hackers: black hat hackers, gray hat hackers and much more. You
    can categorically say they are bad guys. Ethical hacking techniques involve planning
    ahead by using the tools the bad guys might use to defend against their moves
    before they strike. You can counterattack by using complex testing methodologies
    and following up on other fixes.


    In this chapter, we will look at the vulnerabilities associated with the `802.11`
    wireless networks and ways you can ethically hack them to make them more secure
    and protected.


    ## TESTING YOUR WIRELESS SYSTEMS


    Since their invention, wireless networks have not been fully secure. Numerous
    weakness which include encryption flaws, authentication issues and physical security
    problems have been discovered. There are also many tools that can be used to test
    your wireless systems. Two wireless security standards have emerged to tackle
    the attackers: `IEEE 802.11i` and Wi-Fi Protected Access.


    `Wi-Fi Protected Access (WPA)`: The Wi-Fi Alliance developed this standard which
    served as an interim fix for `WEP` vulnerabilities. It was in use until the `IEEE`
    came up with the idea of the `802.11i` standard.


    `IEEE 802.11i`: This standard is also referred to as the `WPA2` standard. It is
    officially owned by the `IEEE` standard. The idea behind it is to incorporate
    the `WPA` fixes for `WEP` with respect to their other forms of encryption and
    authentication mechanisms. This in turn will promote network security.


    Regardless of the vulnerabilities of the `802.11a/b/g` protocols, these two standards
    resolved many security issues. The problem with most security standards is that
    the solutions don’t work because many of the administrators are resilient to change
    and don’t completely implement them. When the network has been configured after
    implementation, admins avoid reconfiguring their existing wireless settings. They
    want to avoid designing and implementing complete security mechanisms for fear
    of complicating their network management. These are legitimate concerns, but they
    leave most of the wireless networks exposed to danger in the process.


    Talking about being fully protected, implementing these standards on a system
    along with other wireless security strategies still doesn’t guarantee that a network
    will be fully protected. Computer networks cannot be completely safe. For example,
    let’s say you are working for a company whose staff installed unsecured wireless
    access points on the network and you have no idea about them. Regardless of all
    the standards you have implemented on your network, past experience still shows
    that most of these systems are open to threats. Thus, you cannot stop learning.
    Hacking is like an antivirus version upgrade, as you must keep updating yourself
    frequently.


    ## UNDERSTANDING THE RISK YOUR SYSTEM IS FACING


    Before discussing ethical hacking in depth, we should cover some conceptual definitions
    which we will use later in the book. Some of them are:


    `Vulnerability`: This is a susceptibility to attack or weakness. A good example
    is a system network that is not engaging itself with encryption or that has weak
    passwords on its access points. The access point (`AP`) is known as the central
    core for a set of wireless systems. Many of the wireless network weaknesses will
    be discussed later on.


    `Threat`: This is an indication of potential or imminent danger within an information
    system. Agent hackers are good examples of threats, as are disgruntled employees.
    Moreover, malicious software could be spyware, which include viruses that have
    the ability to wreak havoc on a computer network.


    These are the basics but beyond them are a few things that could surface when
    a threat is able to exploit the weaknesses of a computer network. In this case,
    the action is known as risk. Sometimes, you might even think that nothing is going
    on with your wireless network that hackers would be interested in, but there are
    always plentiful opportunities for danger. Some of the risks connected with weak
    wireless networks include:


    * Stolen passwords

    * Having complete access to the files that are being transmitted from the server

    * Back-door access points which lead the hackers into the wired network

    * Intercepted e-mails

    * The rejection of service attacks which can cause downtime along with productivity
    losses

    * Breaking state, federal or international regulations in relation to privacy
    and business financial reporting

    * Spamming

