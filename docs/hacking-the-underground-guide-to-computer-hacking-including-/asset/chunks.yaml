    运行模式通常是发现应用或网站中存在的各种输入字段，然后测试每个字段以查看网站对每个命令的响应。这允许我们确定网站上使用的数据库类型，并预测该网站或 Web
    应用是否容易受到 SQL 注入攻击。`SELECT` 命令用于从数据库检索信息，是目前网站或 Web 应用发送的最常见的命令，因为用户几乎总是需要数据库中的信息。用于修改、删除和向数据库输入新信息的
    `UPDATE`、`DELETE` 和 `INSERT` 命令也是非常常见的 SQL 命令。在攻击的探测阶段，黑客会测试不同的命令并观察其收到的响应。在这种情况下，错误报告有助于黑客识别服务器当前运行的操作系统和数据库类型。这使黑客能够构建一个与目标数据库匹配的查询列表。然而，出于安全考虑，网站可能会传递通用的错误信息，而不泄露受攻击的数据库类型或操作系统。这被称为盲注攻击。


    Kali Linux 上存在多种工具，可以让 SQL 注入变得可行且简单。其中一种工具是 `Sqlsus`。该工具用于测试和利用 MySQL 注入漏洞。`Sqlninja`
    工具也具有相同的功能，但侧重于基于 Microsoft SQL Server 的数据库。`Sqlninja` 工具只利用漏洞，而不进行测试。更健壮的工具是
    `Sqlmap`，它支持大量的数据库。它可以发现注入漏洞，准确猜测网站或 Web 应用使用的数据库类型，并执行使用使用户对目标数据库拥有完全控制权的命令。该工具对于盲注漏洞和基于错误的漏洞同样有效。专注于盲注的工具是
    `BBQSql`，它是一种盲 SQL 注入工具，通过提问并根据获取的响应构建 SQL 攻击来运行。


    ## 4. 跨站脚本 (XSS) 和跨站请求伪造 (CSRF)


    ### 跨站脚本 (XSS)


    在当今，Web 应用的发展旨在实现几乎在线上的任何功能。这些 Web 应用用途包括执行银行交易、在线购物、在股票或比特币市场进行交易，甚至保存医疗记录。由于
    Web 应用在执行此类敏感活动的使用日益增加，确保它们提供针对访问此类信息的黑客的保护至关重要。拥有银行应用用户会话的黑客可以在该人的账户上进行交易，或代表该个人进行购买，这完全是一场噩梦。因此，网站或
    Web 应用必须是安全的，并且对任何用户为任何输入字段提供的数据必须进行彻底检查，以确保数据是该特定输入字段的合法或适当数据。


    与发生在 Web 应用或网站上的大多数攻击一样，跨站脚本的发生是因为输入验证缺陷，即当用户输入没有得到妥当检查时。这允许具有恶意意的客户端向网站或 Web
    应用注入恶意脚本，并感染访问该网站的用户。与基于注入的漏洞不同，跨站脚本主要由运行在用户浏览器上的 JavaScript 代码组成。`JavaScript`
    在浏览器上执行其命令而不是在 Web 服务器上执行；这就是为什么跨站脚本通常被称为客户端攻击的原因。在 `JavaScript` 的早期，富有意的黑客能够读取数据并访问在备用或相邻窗口中打开的网站数据。然而，随着最近
    `JavaScript` 的改进和黑客的创意，在浏览器上执行的恶意 `JavaScript` 代码可以访问用户的 cookie 并窃取会话、记录用户的按键输入、扫描端口、检查浏览器历史、查找用户的操作系统属性并收集其他浏览器数据。跨站脚本分为三种类型：


    **持久型 XSS (Persistent XSS)**：在持久型跨站脚本中，黑客发送一个恶意脚本，该脚本被存储在网站或 Web 应用的数据库或 Web 服务器中。每当用户访问该网站时，恶意代码就会发送并在用户的浏览器上执行。由于脚本存在于数据库或
    Web 服务器中，脚本在不经过数据过滤的情况下发送到用户的浏览器。这就是它也被称为存储型 XSS 的原因。持久型 XSS 的热门目标平台是社交平台、电子商务网站或
    Web 应用的评论区、新闻网站和网络论坛。运行模式通常涉及恶意用户测试网站或 Web 应用的各种输入字段。然后，他在没有足够过滤系统的特定字段中插入恶意代码，该字段通常是发送后后显示输入参数的字段（例如，评论部分）。该代码随后被发送并存储在数据库或服务器中，以便每当另一个用户来到该特定字段时，服务器就会部署该代码并在用户的浏览器上执行。


    **反射型 XSS (Reflective XSS)**：反射型 XSS 是一种针对性的 XSS 攻击。因为 XSS 攻击的目标是在用户浏览器上执行恶意脚本，黑客首先制作脚本并将其绑定到
    URL 上。然后他将该链接发送给目标用户。该链接通常通过邮件发送，诱骗受害者点击该链接。一旦用户点击链接，用户将被重定向到 URL 中的网站，脚本将自动执行，允许攻击者利用其浏览器进行邪恶活动。与脚本保存在数据库或
    Web 服务器中的持久型 XSS 攻击相反，在反射型 XSS 攻击中，用户被发送一个链接，点击该链接会在其浏览器中执行脚本。


    **DOM（文档对象模型）XSS**：在持久型和反射型 XSS 中，用户的浏览器都会收到服务器的响应，假设它是合法的响应，然后运行它。正如我们所知，`JavaScript`
    用于显示动态 Web 内容并在不完全重新加载网页的情况下刷新网页，例如网站显示实时比分时。这种 XSS 是在浏览器中完成的，完全不需要到达 Web 服务器。使用用户输入执行
    `JavaScript` 代码的网站（特别是对于 `GET` 响应类型的网站）非常容易受到此类攻击。它是通过在原本应该是合法脚本的地方插入恶意脚本来实现的，使浏览器执行该脚本就像它是原始的合法脚本一样。


    ### 跨站请求伪造 (CSRF)


