    also provides a probability adjustment with its percent command, which is a line
    option (--perc). WepLab operates in relatively few branches–that is, higher settings
    increase the number of branches taken. Another advantage for using WepLab is that
    it provides brute force attack and dictionary cracking attacks, which can be very
    useful in cracking WEP keys. These attributes are the things that make WepLab
    an essential tool in the industry.


