    7. To select the channels, use the up and down arrows to select the channels you
    want to scan.


    8. Recall that you can use `Kismet` to scan your wireless network. Preferably,
    you can use any tool of your choice. If you used `Kismet` to scan your wireless
    network to identify channels, it can be deduced that you know the channels you
    want to monitor. However, if you wish to monitor all the channels, click the `Scan`
    button.


    9. Select your network device from the network device drop-down list.


    10. You will manually select the network device you want to use. The device selected
    will be the device which you want to monitor. For instance, select `eth0`. `AirSnort`
    will not put the cards into monitoring automatically, but rather it will do this
