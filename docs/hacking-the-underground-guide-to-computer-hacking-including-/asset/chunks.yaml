    ## 软件模拟器


    你是否想过在同一台计算机系统上同时运行两个不同的操作系统？或者从一个操作系统复制内容到另一个操作系统？如果你好奇这些操作是如何实现的，可以考虑使用软件模拟器产品。有些人人称之为分区。以下是家名的软件模拟器产品公司列表：


    - Bochs: [`bochs.sourceforge.net/`](http://bochs.sourceforge.net/)

    - Cygwin: [`cygwin.com/`](http://cygwin.com/)

    - DOSEMU: [www.dosemu.org/](http://www.dosemu.org/)

    - Microsoft Virtual PC: [www.microsoft.com/mac/products/virtualpc/virtualpc.aspx?pid=virtualpc](http://www.microsoft.com/mac/products/virtualpc/virtualpc.aspx?pid=virtualpc)

    - Plex86: [`savannah.nongnu.org/projects/plex86/`](http://savannah.nongnu.org/projects/plex86/)

    - Vmware: [www.vmware.com/](http://www.vmware.com/)

    - WINE: [www.winehq.com/](http://www.winehq.com/)

    - Win4lin: [www.netraverse.com/](http://www.netraverse.com/)


    ## RF 预测软件


    射频预测软件可以帮助你模拟接入点（AP）的辐射模式，而无需物理安装它。作为测试人员，你可以使用确切软件来预测你可能可能发现信号的地方。以下是你可以使用的三个此类程序：


    - Airespace: [www.airespace.com/products/AS_ACS_location_tracking.php](http://www.airespace.com/products/AS_ACS_location_%20tracking.php)

    - Alcatel: [www.ind.alcatel.com/products/index.cfm?cnt=omnivista_acs_locationtrack](http://www.ind.alcatel.com/products/index.cfm?cnt=omnivista_acs_locationtrack)

    - Radioplan: [www.electronicstalk.com/news/rop/rop100.html](http://www.electronicstalk.com/news/rop/rop100.html)


    ### RF 监控


    人类创造机器，但机器的结果可能比人类的结果更准确。在没有任何工具的情况下自己监控信号强度是非常困难的。这就是为什么你需要一个工具来帮助测试信号强度和比特错误率。尽管我们已经提到了一些可以使用来监控信号强度的工具，例如
    `Kismet` 或 `NetStumbler`，但它们的的结果不如以下工具准确：


    - aphunter: [www.math.ucla.edu/~jimc/mathnet_d/download.html](http://www.math.ucla.edu/~jimc/mathnet_d/download.html)

