    # Breaches


    * Weaknesses that are exploited with anonymous access.

    * Vulnerabilities which will have a high exploitation rate.

    * Vulnerabilities which are hazardous to lives.


    If you detect a vulnerability and you planned to report it but didn’t, in case
    someone else exploits this weakness, you will not be okay because you have not
    done the right thing.


    If you have humility, you will definitely be awarded for your goodness and honesty.
    Once you detect a vulnerability in your organization’s system or network and report
    it immediately, you will be recognized for the authenticity of your work. This
    will also positively affect others’ assessment of the way you complete your tasks.
    Your peers can examine your analysis, methodologies, findings and conclusions.
    They can offer honest criticism and suggestions which can improve your work.


    If you find your reports unjustly criticized, just follow these 10 Commandments,
    as they will help you prepare your reports better.


    Furthermore, if you perform a test and are able to detect 30 problems, make sure
    you report on all of these 30 problems you detected. You don’t need to include
    all 30 problems in your summary, but include them in the narrative. If you are
    thinking you have too much to report and choose to withhold some of the information,
    another person within the organization who detects it later will tag you as an
    incompetent or lazy. Therefore, it is best to avoid this kind of a situation and
    report everything.


    # CHAPTER THREE: THE IMPLEMENTATION OF WIRELESS TESTING METHODOLOGY


    Before you can say you want to start testing your wireless vulnerabilities, you
    need to implement a methodology for it. Ethical hacking of a wireless network
    is not just about scanning willy-nilly for open ports. For you to have successful
    testing, you need to follow some formal procedures, which should be incorporated
    into your methodology. These include:


    * Gathering IP addresses and domain names as your public information.

    * Mapping your network to have a general idea of the structure.

    * Scanning your system or network to get a general overview of which devices are
    active and transmitting information.

    * Determining the services that are running.

    * Finding and locating specific vulnerabilities.

    * Hacking into the system and finishing the job.


    We’ll discuss more details about these methodologies in the next section. In chapter
    two, we covered specific goals and how to achieve them, as well as knowing where
    you are headed to stay focused on completing your test. Don’t forget about this
    part, as it will make your job a lot easier.


    Keep a log of everything you are doing. Backup is important. Your logs can also
    be saved as a screen capture or screenshot, and you can use the `Snaglt` tool
    for this (available at `http://techsmith.com`). Sometimes you might not be able
    to reproduce the same visual samples of your progress; that is when screen captures
    come in handy. Logging is very important because sometimes you will need particular
    data on what you previously did; thus, saving logs will make it easy for you to
    get that data. For instance, your client might notice a security intrusion in
    what you did for him or her and may want to track the movement of the intruder.
    With your loggings, you have the ability to show the client the exact moment you
    performed your operation, including the date and time.


    In the previous chapter, we discussed the important commandments for hacking ethically.
    Don’t forget to employ the scientific method in your hacking methodology as well.
    When you are performing any kind of security testing that involves private information,
    make sure you are working methodically. Moreover, make sure you are using the
    right tool for the right task; don’t mix up tools. Using the right tool will help
    you achieve the greatest number of accurate vulnerability results and show you
    the weaknesses. Another advantage of working methodically is that you will be
    able to minimize the sloppiness of the system and avoid crashing the system or
    network. A different tool should be used for a different system, since it will
    likely have different specifications.


    Your enemy is not your friend and in this sense, your enemy may be a black hat
    hacker trying to bring down the system you are in charge of. To avoid defeat,
    be flexible in your methodologies. Adapt the rules and regulations of warfare
    when it comes to your enemy.


    In a movie titled `Transformers`, the enemies were called Decepticons and the
    humanitarian agencies were the good guys. One of the good guys fighting the enemy
    taught that when they battled against the bad guys, they had to use the right
    weapon. He was frustrated when things got bad and said, “Why do the bad guys always
    get the good stuff?” Relating this movie analysis to your enemy (the bad hacker),
    you should always expect your enemy to use the best and latest tools. Therefore,
    you should also get those tools yourself. If they are breaking into your network
    from across the street, you must be able to perform your tests from across the
    street as well. If they are breaking into your network configuration from across
    the internet, you should perform an internet test on your network as well. Know
    that two ethical hackers cannot be alike. If the need arises for you to adjust
    your procedures and methods, then do not hesitate to do what is necessary.


    ## DETERMINING WHAT OTHERS KNOW


    Basically, what other hackers do at first is prod and poke their target’s system
    to find all of the vulnerabilities. You have to do this as well if you want to
    last in your game. Run different tests from different angles and try to look into
    your network from an outsider’s perspective. Doing this will help you get more
    accurate results in terms of what your network looks like to your enemy and not
    just how it looks to you on your system. This is very important in the realm of
    wireless networks because we don’t have the added veil of physical security as
    we do with hard-wired systems.


    ### Things You Need to Look For


    Before you get started with your wireless testing, here are a few things that
    are very important to look for:


    * Software versions

    * IP addressing schemes

    * Radio signal strength

    * Hardware makes and versions

    * Specific SSIDs which are being broadcasted

    * Encryption, such as VPN or WEP traffic


    ## METHODOLOGY 1: CONSOLIDATING THE PUBLIC EYE


    We said earlier that we would further discuss the methodologies we mentioned above.
    One crucial point or methodology you should know about is that the very first
    step in ethical hacking is performing a high-level network reconnaissance called
    footprinting. For instance, if you are asked to perform broader information security
    testing on a system or network, you might need to look for things like trademarks
    names, employee names, company files or parent names. All this information can
    be found or accessed using available public tools such as Google. You can also
    gather information using your organization’s website or by using the trademark
    office website (`www.uspto.gov`). Moreover, information available publicly might
    not be as prevalent as it could be in another form of a network system. This is
    because the wireless network is more localized and infrastructure-based. Still,
    it is worth your time to see what you can gather out there.


    ### Gathering Information with Google

