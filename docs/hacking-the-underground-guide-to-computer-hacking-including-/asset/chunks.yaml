    With these three methods of port scanning, you can also differentiate between
    open and closed ports. For this, the two basic principles registered in the `RFC`
    (Request for Comments) of `TCP` (793) can be applied. On the one hand, a closed
    port must always respond to incoming packets other than `RST` packets. On the
    other hand, the open port must ignore all packages not marked as `SYN`, `RST`
    or `ACK`. These three methods behave exactly the same way. The test packets that
    are sent are taken care of because of the `RFC` provisions; a closed port responds
    with an `RST` packet and an open port does not show any reaction on its part.
    However, because only some routers transmit error messages when a port is filtered,
    there may also be a non-response in the case of a filtered port. Although these
    procedures are more discrete than SYN scans, they have the disadvantage of not
    working when systems do not strictly conform to the `RFC 793` protocol. Windows
    would be the most important representative in this case.


    ### UDP


    `UDP` headers are sent empty and out of data `UDP` headers to all target ports.
    If a service responds with a `UDP` packet, the port belonging to it is open. If
    the router sends the port scanner error message "Port unreachable" (Type 3, Code
    3), the port is closed. Other types of error messages report that a packet filter
    blocks the port. The big problem that comes with scanning ports with `UDP` is
    that it takes a lot of time, as in many systems the task of issuing the corresponding
    error messages can be lengthy for security reasons, and open ports respond very
    irregularly. The `Linux` kernel limits the number of messages to, say, one per
    second, which means you can scan 65,535 ports in about 18 hours.


    ### Uses of a Port Scanner


    Security scanners are very useful tools for system administrators and network
    administrators because they can used to monitor security. On the other hand, a
    port scanner is sometimes used by hackers to breach a system. However, port scanners
    are not considered to be from the direct hacking tools because they are not used
    to attack a system directly. Rather, they are used to gather information before
    an attack is launched.


    ## HOW TO IDENTIFY YOUR OPERATING SYSTEM (OS)


    The operating system is one of the most important software programs on a computer.
    Operating systems execute elementary tasks such as sending information to the
    screen, recognizing the keyboard connection, keeping track of directories and
    files on the disk, and monitoring external devices such as scanners, printers,
    etc. The operating system is also used to protect and secure the system, preventing
    unauthorized users from gaining access. There are different kinds of operating
    systems, which are explained below.


    ### SINGLE-USER


    Single-user operating systems are those that support only one user at a time,
    regardless of the number of processors the computer has or the number of processes
    or tasks the user can execute at the same time. Personal computers typically have
    this kind of operating system.


    ### MULTI-USERS


    Multi-user operating systems are capable of servicing more than one user at a
    time. They will either use several terminals that will be connected to the computer
    through remote sessions in a communications network, or through the number of
    processors in the machine that each user can execute simultaneously.


    ### MONO TASKS


    Mono tasks systems are those that allow only one task to be completed at a time
    by the user. This may be the case in a multi-user and single-task system, in which
    multiple users are allowed at the same time but each can complete only one task
    at a time.


    ## NETWORK OPERATING SYSTEM


    A network operating system (`NOS`) is software that allows the interconnection
    of computers to access services, resources, hardware and software. This essentially
    creates a computer network. Just as a computer cannot work without an operating
    system, a computer network cannot function without a network operating system.
    It consists of software that makes it possible for a computer system to communicate
    with other computers in a network environment.


    ## OPERATING SYSTEM NETWORK PROCESSORS


    A free operating system, according to the Free Software Foundation, offers four
    types of freedoms. It allows you to:


    1. Run the program to perform any activity you want without restrictions.

    2. Study the operation of the program and modify it according to your needs.

    3. Redistribute copies of the program.

    4. Improve the program and distribute copies of the modifications.


    ### Types of Operating Systems


    The `OS` awakens the computer and causes it to recognize the `CPU`, memory, keystroke,
    video system and disk drives. In addition, it provides the facility for users
    to communicate with the computer and serves as a platform from which to run application
    programs. The most popular operating systems are mentioned below.


    1) `DOS`: The famous `DOS`, which stands for Disk Operating System, is best known
    by the names `PC-DOS` and `MS-DOS`. `MS-DOS` was created by Microsoft and is essentially
    the same `OS` as `PC-DOS`. The reason for its continued popularity is the overwhelming
    volume of available software and the installed base of Intel-based computers.
    When Intel released the `80286`, `DOS` became so popular that `DOS` and its applications
    represented most of the PC software market. At that time, IBM compatibility became
    a necessity for products to succeed. Even with the new operating systems that
    have hit the market, `DOS` is still a solid contender among the various operating
    software that are available today.


    2) `Windows 3.1`: Microsoft decided to create an operating system that had a user-friendly
    graphical interface and the result was `Windows`. This system displayed icons
    on the screen that represented different files or programs, which could be accessed
    by double clicking with the mouse. All of the applications created for `Windows`
    looked alike, so it was easy to learn how to use new software once someone had
    learned the basics.


    3) `Windows 95`: In 1995, Microsoft introduced a new and improved version of `Windows
    3.1`. Improvements to this `OS` included multitasking support and 32-bit architecture,
    which allowed the user to run better applications and improve efficiency.


    4) `Windows NT`: This version of `Windows` specialized in networks and servers.
    With this `OS`, the users could interact effectively between two or more computers.


    5) `OS/2`: This `OS` was created by IBM. It has 32-bit support and its interface
    is very good. The problem with this operating system is that it has not received
    the support it deserves in terms of applications. That is, many applications have
    not been created to take advantage of the features of the `OS`, as most of the
    software market has been monopolized by `Windows`.


    6) `Mac OS`: Macintosh computers would not be as popular as they are if they did
    not have `Mac OS` as the plant operating system. This operating system is so user
    friendly that anyone can use it in a very short time. It is also great for organizing
    files and using them effectively. This was created by Apple.


    7) `UNIX`: The `UNIX` operating system was created by AT&T''s Bell Labs in 1969
    and is now one of the pillars of the information highway. `UNIX` is a multi-user
    and multitasking `OS`, which runs on different computers, including supercomputers,
    mainframes, minicomputers, personal computers and workstations. This means many
    users can use the same computer through terminals.


    `Kali` is the dream of upcoming hackers, who know that it will solve a lot of
    their problems. `Kali` is wired up with orderly designed equipment that is easy
    to operate. However, there are still other operating systems that match its quality.


    ## FEATURES OF PARROT SECURITY OS


    Just like `Kali`, the Parrot security operating system is Debian-derived and is
    used generally for penetration testing, forensics and other purposes. Released
    some four years ago, it has been extensively developed and has many exciting attributes.

