    ### 关于 HTML 页面的注释


    这主要是在部署网站或 Web 应用程序时出现的代码问题。编程最佳实践要求程序员对代码块进行注释，以解释其功能原理以及代码采用这种结构的原因。有时开发者还会提到存储信息的变量和数据库名称，以及这些信息在整个应用程序过程中是如何使用的。这在多个程序员协作同一个项目时尤为重要。然而，在部署网站或
    Web 应用程序时，必须从代码中移除这些注释。在浏览器中查看网站时，右键点击页面并选择“查看源代码”选项，会打开一个独立的窗口，显示所有的 HTML 代码和一些
    JavaScript 代码。这些代码用于构建网站或 Web 应用程序。


    在 `Kali Linux` 上，可以使用名为 `WebScarab` 的插件仅过滤出网页上的注释。这是通过在片段标签的下拉菜单中选择片段（fragment）和注释（comment）选项来实现。为了防止此类信息泄露，必须移除包含
    Web 应用程序敏感信息的注释。为了格外起见，可以选择移除所有注释。


    ### 2. 身份验证问题


    身份验证是网络安全的一个关键方面。这是应用程序验证用户的凭据或登录详情，并确认其是否存在于应用程序或网站的数据库中的过程。这不应与授权（authorization）混淆。授权是在完成身份验证后，允许用户或客户端访问其被许可访问的文件的过程。身份验证是通过网站或
    Web 应用程序用户提供的用户名和登录信息实现的。以下是网站和 Web 应用程序中常用的身份验证协议类型。


    #### HTTP-Basic 身份验证


    这是使用用户名和密码来验证用户。当用户在基于 `HTTP-Basic` 身份验证的站点提供其用户名和密码时，这些信息将通过 `base64` 编码系统以加密格式发送。用户名和密码在通过
    `base 64` 算法编码之前以 `username: password` 的形式发送。然而，如果黑客决定使用 `Burpsuite` 和 `Wireshark`
    等工具，这些加密信息可能会被拦截。该身份验证系统的问题在于 `base 64` 编码系统，它可以被轻易解密，因为 `Wireshark` 会解密加密的凭据。此外，用户名和密码是以带冒号（:`）的明文传输的，因此非常容易被监听。使用
    `SSL` 可以限制与此类漏洞相关的风险。


    #### HTTP-Digest 身份验证


    这种身份验证类型的开发是为了应对 `HTTP-basic` 身份验证的安全问题。在此类身份验证中，服务器产生一个名为 `nonce` 的随机值。该 `nonce`
    与用户名、密码、`nonce` 值、`HTTP` 方法和页面的 `URL` 结合，创建一个发送到服务器的加密消息。该消息使用 `md5` 算法加密，无法反向解密，就像
    `HTTP-Basic` 身份验证那样。为了使解密可能，黑客必须意识到加密过程中使用的那四个凭据。然而，如果恶意用户能够向服务器重建相同的摘要消息，他或她将获得访问权限。为了限制此类攻击，服务器通常使用
    `nonce` 值创建时间戳，这样每当向服务器发送访问请求时，服务器都会检查与该 `nonce` 值关联的时间戳，如果时间未超时则允许访问。


    #### 基于表单的身份验证


    网站上常用的身份验证形式是基于表单的身份验证。在这里，客户端在登录页面提供用户名和密码。登录页面通常使用 HTML `<input>` 标签创建。当标签中输入信息时，信息将传输到服务器，凭据将从输入标签中提取并与变量名关联，然后与用户名和密码数据库进行比对。服务器随后返回一个响应，验证用户身份或拒绝用户访问网站或
    Web 应用程序的某些区域。此类身份验证没有预定义的加密其接收到的登录信息的方法，使其具有高度的可定制性。然而，除非使用 `SSL`，否则信息也将以明文共享。如果黑客决定在
    `Kali Linux` 中使用 `Hydra` 等工具，基于表单的身份验证非常容易受到暴力破解。暴力破解是一种通过猜密码获取访问权限的方法。它需要一个用户名列表和一个密码列表，将凭据交叉应用于服务器以获取相应的登录详情。例如，如果用户名列表包含五个用户名，密码列表包含五个可能的密码，暴力破解工具将为每个用户名尝试五个可能的密码，总共产生
    25 次登录尝试。此列表是在信息收集过程中利用社会工程学构建的。


    ### 3. 基于注入的漏洞


    注入漏洞（Injection flaws）可能是影响网站或 Web 应用程序最常见且破坏性最强的漏洞。客户端基本上是向网站或 Web 应用程序上的任何输入字段中注入恶意代码或脚本。这些信息被发送到服务器，如果应用程序设计不当，服务器将执行代码中存在的命令，并允许客户端访问敏感数据或应用程序的根目录。这总发生在应用程序对输入数据验证不充分的情况下，允许黑客欺骗应用程序执行非期望的操作。最终，这会导致黑客获得对应用程序的控制。两种常见的基于注入的漏洞类型是：


    #### 命令注入


    这种注入攻击针对服务器操作系统本身。代码是用提交到服务器的输入数据编写的。向服务器发送 shell 命令以检索信息的应用程序非常容易受到命令注入的影响。这些代码通常是服务器可以运行的
    shell 命令。如果没有适当的输入验证系统，服务器将执行发送到服务器的代码，允许黑客访问服务器。使用解释型语言开发的应用程序更容易受到注入攻击。


    #### SQL 注入


    这是此处列出的两种注入攻击中最常见的。没有数据库，每个网站或 Web 应用程序都被认为是不完整的。数据库是 Web 应用程序自身的命脉。关系型数据库是与网站和
    Web 应用程序关联的最流行的形式。关系型数据库本质上是将信息存储在包含行和列的表格中的产品。与数据库交互可能是网站或 Web 应用程序执行的最关键操作。为了让
    Web 应用程序或网站与数据库交互，必须对数据库中存在的信息发出请求；此外，必须向数据库添加新数据，并对现有数据进行编辑或修改。应用程序使用 `SQL` 命令来实现这一壮举。在程序员中，这被称为“查询数据库”。输入表单、cookie、URL
    属性或变量如 `headers` 和 `XML` 请求可用于向数据库发送恶意指令，欺骗其泄露用户名、密码和信用卡信息等敏感数据。通过绑定 `SQL` 命令与用户输入来查询数据库的应用程序也非常容易受到
    `SQL injection` 攻击。


    '
- fmt: '

    The mode of operation is usually to discover the various input fields that exist
    in an app or website, then to test each field to see how the website responds
    to each command. This allows us to determine the type of database at play on the
    website and also to predict whether the website or web app is prone to a SQL injection
    attack. A command like `SELECT`, which is used to retrieve information from the
    database, is by far the most common command sent by the website or web app because
    a user would almost always need information present in the database. The `UPDATE`,
    `DELETE` and `INSERT` commands, which are used for modifying, deleting and inputting
    new information into the database, are also very common SQL commands. During the
    probing stage of the attack, the hacker tests different commands and observes
    the response he or she receives. Error reports, in this case, help the hacker
    identify the operating system and the database type with which the server is working
    at the time. This also enables the hacker to build a query list that matches the
    database in question. However, for security reasons, the website may deliver a
    generic error message without revealing the database type or operating system
    under attack. This is known as a blind injection attack.


    Different tools exist on Kali Linux that make SQL injection possible and easy.
    One of these tools is `Sqlsus`. This tool is used to test and exploit MySQL injection
    flaws. The `Sqlninja` tool does the same thing, but focuses on the Microsoft SQL
    server-based database instead. The `Sqlninja` tool only exploits the flaws; it
    does not test for them. A more robust tool is the `Sqlmap`, which supports a large
    number of databases. It can discover injection flaws, accurately guess the type
    of database a website or web app uses, and execute commands that give its user
    total control over the targeted database. This tool is equally effective for both
    blind injection flaws and flaws that are error based. A tool that focuses on blind
    injection is the `BBQSql`, which is a blind SQL injection tool that operates by
    asking questions and by building the SQL attack based on the responses it gets.


    ## 4. Cross-site scripting (XSS) and cross-site request forgery (CSRF)


    ### Cross-site scripting (XSS)


    In this age, web apps are being developed to do almost anything online. The uses
    of these web apps include performing bank transactions, making purchases online,
    trading in the stock market or bitcoin markets, and even keeping medical records.
    Due to the increased use of web apps in performing activities of this sensitive
    nature, it is paramount that they provide protection against hackers who are seeking
    access to this information. A hacker with access to a user session in a bank app
    can perform transactions on the person''s account or make purchases on the individual''s
    behalf, which is a total nightmare. Therefore, it is essential that a website
    or web app be secure and that the data provided by any user for any input field
    be thoroughly checked to ensure it is the legitimate or appropriate data for that
    particular input field.


    Like most of the attacks that occur on web apps or websites, cross-site scripting
    occurs because of input validation flaws, i.e., when a user input is not properly
    checked. This allows clients with malicious intent to inject the website or web
    app with a malicious script and infect users who access that website. Unlike injection-based
    flaws, cross-site scripting is mostly made up of JavaScript codes that run on
    the user''s browser. `JavaScript` executes its commands on the browser and not
    on the web server; this is why cross-site scripting is commonly called a client-side
    attack. In the early days of `JavaScript`, creative hackers were able to read
    data and gain access to data on websites that were open in an alternate or adjacent
    window. However, with recent improvements in `JavaScript` and the creativity of
    hackers, malicious `JavaScript` codes that are executed on the browser can access
    the user''s cookies and snatch sessions, log the user''s key input, scan ports,
    check the browser''s history, find the user’s operating system properties and
    gather other browser data. Cross-site scripting is of three types:


    **Persistent XSS**: In persistent cross-site scripting, a hacker sends a malicious
    script which is stored in the database or web server of the website or web app.
    Any time a user visits that website, the malicious code is sent and executed on
    that user''s browser. Because the script exists in the database or the web server,
    the script is sent to a user’s browser without filtering the data. This is why
    it is also called stored XSS. Popularly targeted platforms for the persistent
    XSS are social networking platforms, review sections of an e-commerce website
    or web app, news websites and web forums. The mode of operation usually involves
    the malicious user testing the various input fields of a website or web app. Then
    he or she inserts a malicious code in a particular field that does not have an
    adequate filtering system, which is usually a field that displays the input parameter
    after it has been sent (for example, the comments section). This code is then
    sent and stored in the database or the server so that any time another user comes
    to that particular field, the server deploys that code and executes it on that
    user''s browser.


    **Reflective XSS**: A reflective XSS is a targeted XSS attack. Because the goal
    of an XSS attack is to execute a malicious script on the user''s browser, the
    hacker first cooks up the script and binds it to a URL. Then he or she sends the
    link to the user who is being targeted. This link is often sent in the mail, cajoling
    the victim to click that link. Once that user clicks on the link, the user is
    directed to the website in the URL and the script is executed automatically, allowing
    the attacker to use his/her browser for sinister deeds. Contrary to the persistent
    XSS attack in which the script is saved in the database or web server, in the
    reflective XSS attack, the user is sent the link where clicking the link executes
    the script in his or her browser.


    **DOM (Document Object Module) XSS**: In both the persistent and reflective XSS,
    the user’s browser gets a response from the server, assumes it is a legitimate
    response and then runs it. `JavaScript`, as we know, is used for displaying dynamic
    web content and refreshes the web page without fully reloading that web page,
    like when a website displays live scores. This kind of XSS is done in the browser
    without getting to the web server at all. Websites that execute `JavaScript` codes
    using user input, especially for a `GET` response kind of site, are very susceptible
    to this type of attack. It is carried out by inserting a malicious script where
    an otherwise legitimate script should have been present, making the browser execute
    that script as if it were the original, legitimate script.


    ### Cross-site request forgery (CSRF)

