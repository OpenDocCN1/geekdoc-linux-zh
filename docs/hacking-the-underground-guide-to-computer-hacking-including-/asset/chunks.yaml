  toc: []
  trans: '


    描述 DDOS 攻击的另一种方法是将其比作一个只有一个桥可以进入的城镇。这个城镇可以比作托管网站的服务器，而桥梁则是该网站提供流量服务的带宽。与大桥相连的另一个城市是试图关闭网站的攻击者或黑客。如果大桥在特定时间内只能允许约
    300 辆车通过，而在同一时刻有 900 辆车从那条道路驶出城市，那么道路上的车辆数量就会让大桥不堪重负。结果就是桥上发生严重的交通拥堵。这可能会导致进出城镇的货物停滞，合法用户无法访问大桥，并瘫痪经济，如果这种情况持续下去，将导致数百万美元的损失。


    随着易于发起此类攻击的免费工具出现，DDOS 攻击变得更具破坏性。此类工具会导致服务器崩溃并最终导致服务中断。DDOS 攻击通常是为了宣传，因为它们是试图获得名声或威望的黑客的“声明”。以下是用于执行针对服务器的
    DDOS 攻击时使用的一些免费工具。


    ### 低轨道离子炮 (LOIC)：这个工具可能是目前最流行的免费 DOS 攻击工具。该工具非常易于使用，即使是新手也能轻松胜任。该工具曾被臭名昭著的匿名黑客组织使用过。它只需要用户提供服务器地址，其余会自动完成其余工作。它还具有远程控制和协调其他
    LOIC 系统对网站进行 DDOS 攻击的能力。然而，该工具不会隐藏你的 IP 地址，如果你将其用于恶意目的，可能会导致你被追踪和捕。


    ### XOIC：该工具在易用性上与 LOIC 相似。然而，创建者声称它比 LOIC 更安全。它有三种攻击模式可以根据黑客的意图进行选择。


    ### HTTP 不可承受负载之王 (HULK)：这是另一种流行的 DDOS 攻击工具，为黑客提供了更好的安全性。它具有在执行攻击期间规避检测的能力。


    ### RUDY (你还没死吗？/R-U-Dead-Yet)：如果不提到我们亲爱的 RUDY，我就无法讨论 DDOS 攻击工具。它使用 HTTP POST
    方法执行攻击。它检测网站上存在的表单，并利用表单字段执行攻击。


    网络上存在无数免费的 DDOS 攻击工具。一些黑客会远这些在毫无防备的用户拥有的计算机上，并远程控制它们执行 DDOS 攻击。这类计算机被称为僵尸计算机。然而，其中一些免费工具是为了测试而创建的，尽管黑客已使用它们来执行恶意的服务器攻击。


    防止 DDOS 攻击应该是任何组织 Web 或在线目标的首要任务。实现这一点的基本方法涉及安装强大的防火墙，以检测并阻止虚假流量。发送到网站的流量也可以重定向到另一个
    IP 地址进行分析、检测和拒绝。这种方法被称为空洞（sinkholing）。通过清洗中心路由流量以过滤流量是防止 DDOS 攻击的另一种方法。对于个人 PC，用户避免从未知、非法的来源安装软件至关重要。此类应用程序大多包含木马，允许黑客远程访问
    PC，从而在其僵尸网络中使用该 PC 执行 DDoS 攻击。通过安装安全修复程序或补丁以及使用优秀的防病毒程序来保持操作系统的更新也非常重要。


    ## 水坑攻击


    黑客一直一直在寻找巧妙的方法对用户发起攻击。有时这些攻击可能针对个人，而另一些时候目标可能是一个公司或组织。另一方面，黑客可能只是撒开大网，希望用户落网。水坑攻击是涉及广撒的针对性攻击。攻击者关注某个组织的员工，并设置一个针对至少一个目标员工的陷阱。水坑攻击的概念源于动物界，捕食者在水坑旁等待猎物。捕食者躲起来，每当猎物来喝水时，捕食者就会下手。


    基本上，黑客识别一个要攻击的组织，然后观察该组织的员工，并发现大多数员工访问的网站。一个理想的网站是中小型网站，其所有者对安全意识不是特别敏锐。黑客扫描该网站的漏洞；一旦识别出这些缺陷，黑客就会在网站中注入利用这些漏洞的代码。每当员工访问此网站时，他们会被提示下载内容或访问另一个页面。一旦这些恶意代码通过下载恶意软件或路过攻击在受害者设备上执行，黑客就获得了对受害者系统的控制权，并可以使用该系统对组织的网络发动攻击。


    ## 路过攻击 (DRIVE-BY ATTACKS)


    有时，仅当用户访问受感染的网页时，系统就会被破解。这主要是通过路过攻击实现的。今天，随着用户通过手机、平板电脑和计算机系统等各种设备访问网站，网站的设计对屏幕尺寸、屏幕分辨率和操作系统的变化更具响应性。


    网站现在包含指令，用于寻找和查找诸如浏览器类型、Flash 和 Java 插件版本以及调整网站以适应客户端设备所需的其他细节。当黑客破解包含此类信息指令的网页时，他们就具备了发起针对性攻击的充分设备，重点利用系统浏览器或插件中的漏洞。


    此类攻击非常难以检测，因此用户确保其应用程序和操作系统始终更新到最新版本至关重要。在安全补丁发布后立即下载它们也非常重要。


    ## 点击劫持 (CLICKJACKING)


    这是一种用户界面重装攻击。当用户意图点击网站上展示的合法链接时，黑客欺骗用户点击恶意链接。这种类型的攻击通常不被察觉，不像其他网站攻击那样流行。这种特定的攻击会将你的注意力从重要的事情转移，在你反应过来之前，你就被破解了。事实上，这是一种非常高明的黑客手段。


    攻击者访问一个网站，通常是金融或电子商务网站。攻击者导航到一个合适的页面。然后攻击者在那个网站上创建一个 `iframe`，描述一个关于金钱或奢侈品的绝佳优惠——受害者很可能会点击此类内容。然后他将该框架覆盖在网站的合法链接上，该链接可能对你没兴趣，但在点击时会起到黑客的目的。你被该信息所吸引并点击了链接，导致金钱或货物发送到黑客的账户或地址。


    # 第章：使用框架进行攻击


    ### 社会工程


    '
- fmt: '

    Due to the increase in the use of technology for almost all of our activities,
    companies and organizations have invested a huge amount of money in ensuring that
    the technologies they use are properly secured from hackers. These companies have
    developed and implemented extensive firewalls to protect against any possible
    security breach. Most internet users are not security conscious despite the ease
    with which information can be obtained over an internet connection. This is coupled
    with the fact that most malicious hackers concentrate their efforts on computer
    servers and client application flaws. Over the years, these hackers have become
    more creative in how they gather information and structure their attacks on websites
    and web apps. With the enormous amount of money invested in online security, we
    would expect that malicious information theft or control would have been eliminated.
    However, this has not happened.


    This is where we use social engineering to achieve our goal. It is a non-technical
    approach that circumvents a company’s security measures. No matter how secure
    a company’s online applications are, they are still susceptible to hacking. Hackers
    have been able to achieve this using social engineering and tools based on social
    engineering. Social engineering is a hands-on approach to hacking. It involves
    targeting individuals and manipulating them into giving out vital information
    that can lead to a breach in the security system. These individuals, who may be
    employees of the organization or even a close relative of the top person at the
    target organization, are approached and coerced into trusting the hacker. They
    begin to gather information that could be of use in the hacking process. This
    is usually an approach taken when the company’s firewalls are effective at thwarting
    outside penetration. When the hackers have obtained the necessary information
    (for instance, the login information of the social engineering target), they can
    hack the company from the inside out.


    It is believed that human beings are the weakest link in any information security
    chain. The physical approach toward social engineering can occur in so many ways
    that it is impossible to cover all of them in this chapter. However, popular means
    include approaching and becoming friends with (or even a significant other of)
    employees at the company. Sometimes the employees are given a flash drive containing
    movies or other files in which they may be interested. The employees plug in the
    drive and launch a file that executes scripts in the background, granting the
    hackers access to the respective machines. The social engineer attack can also
    occur when a person calls an employee of a firm, impersonates a call center representative
    and tells the employee that he or she needs information to rectify a service that
    is important. The hacker would have gathered details about the employee from the
    employee’s social media account or through personal conversations with the person.
    Once the hacker has received the information (which may include the victim''s
    social security number or login details), the hacker hijacks the account and performs
    fraudulent transactions on it, or uses it for additional attacks. Social engineering
    makes it easy to build a username and password list that helps.


    ### Social Engineering Toolkit (SET)


    The Social Engineering Toolkit is a very important tool used in computer-aided
    social engineering attack. It comes pre-installed with Kali Linux. It is written
    in the Python language and is also an open source toolkit. The Social Engineering
    Toolkit, or `SET`, was created by David Kennedy to exploit the human aspect of
    security. However, it is important to make sure that the Social Engineering Toolkit
    is up to date. Once the tool has been updated, the configuration file can be set.
    The default configuration file is sufficient to make the `SET` run without any
    problems. Advanced users may want to edit and tweak certain settings. However,
    if you are a beginner, it is better to leave it the way it is until you become
    more familiar with the Social Engineering Toolkit. To access the configuration
    file, open the terminal and then change the directory to `SET`. Open the `config`
    folder and you will find the `set_config` file, which you can open and edit with
    a text editor.


    The Social Engineering Toolkit can be accessed by clicking on the Application
    icon, then clicking on the Kali Linux desktop. Next, click on BackTrack and then
    on the Exploitation Tools option. Click on Social Engineering Tools and select
    the Social Engineering Toolkit by clicking on `SET`. The `SET` will open in a
    terminal window. Alternatively, the `SET` can be opened directly from the terminal
    by typing `setoolkit` without the quotes.


    The Social Engineering Toolkit opens in the terminal as a menu-based option. The
    menu contains different options based on the type of social engineering attack
    you need to use. The option at number 1 is for spearphishing vectors which enable
    the user to execute a phishing attack. The phishing attack is an email attack.
    It is like casting a net by sending emails to random potential victims. Spear-phishing,
    on the other hand, targets one individual and the email is more personalized.


    The second option on the `SET` menu is the website attack vector, which uses different
    web-attack methods against its target victim. The website attack vector option
    is by far the most popular and perhaps most used option in the Social Engineering
    Toolkit. Clicking on the website attack vector option opens menus containing the
    Java applet attack vector, the Metasploit browser exploits, the credential harvester
    attack used in cloning websites, the tabnabbing attack, the man-in-the-middle
    attack, the web jacking attack and the multi-attack web method.

