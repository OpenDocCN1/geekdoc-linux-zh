- fmt: '

    Recall that WEP is a symmetric algorithm that uses the same key for encryption
    and decryption. Both the sender and the receiver must have the same key for the
    operation to go well. Plus, if they must share keys, there has to be a way for
    them to exchange those shared keys securely. The sharing needs to be done this
    way to prevent intrusion from others.


    There is not much detail regarding the management of keys in the `802.11` standards.
    In fact, key management is the most crucial aspect of a cryptographic system.
    Apparently, key management is left to the user, according to the 802.11 systems.
    Key management is one of the reasons why the WLAN environment is suspect to so
    many vulnerabilities. It also has left key distribution unresolved. What would
    a layman do to secure the exchanging of keys? Without a proper understanding of
    how keys should be exchanged securely, one will not be able to use WEP-secured
    WLANs properly.


    When an organization recognizes the need to change passwords frequently and to
    make them random, it wants to implement changes immediately. However, this kind
    of task is not easy in a large WLAN environment. There might be 4,000 workstations
    that need to be changed, and this can get really tiresome. Each of those 4,000
    workstations must share the same secret key–and the owner of each workstation
    must keep the key a secret. Generating, loading, distributing and managing the
    keys for a large environment like this one poses a serious challenge. If a hacker
    compromises one client, he or she will have the key to all of the other workstations
    as well.


    # Using WPA


    Another version of the 802.11 standards is `802.11i`. The “i” at the end of the
    standard indicates a higher version than the previous one. IEEE `802.11i` defines
    the robust security network, which is commonly known as `RSN`. Any access point
    that can operate with this standard will allow only RSN-capable devices to connect
    with it. Consider RSN to be an environment that is evolving with the progress
    of technology because it provides the security features or services that are required
    for a network.


    However, the IEEE `802.11i` standard that is implemented with the use of RSN doesn’t
    mean it is completely perfect. Only time will tell whether there will be flaws
    in this standard. However, `802.11i` features will be mentioned in this section
    and also when we discuss AES encryptions. Not everyone who likes the idea of hardware
    and this 802.11i standard will work with the infusion of hardware. Everyone needs
    improved security, and the use of the hardware in this feature could be a problem.
    This is where WPA comes to the rescue.


    Consider WPA as a solution that improves the solution of WLAN. In laymen’s terms,
    Wi-Fi protected access (WPA) is an initiative that improves WLAN security and
    most importantly addresses the issues regarding WEP. WPA uses a feature called
    `TKIP` (Temporal Key Integrity Protocol), which solves problems without having
    to fiddle with hardware. In short, WPA modifies the software and firmware drivers
    to solve problems. Furthermore, `TKIP` itself is part of the RSN, which allows
    for flexibility.


    WPA is considered a suitable example of a firmware or software patch since it
    doesn’t deal with the hardware directly. As an interim security solution, Wi-Fi
    protected access does not require a hardware upgrade to the existing 802.11 equipment.
    However, the IEEE `802.11i` standard does require an upgrade. Nothing is perfect,
    and this is why we can say that WPA is the best when it comes to security features.
    Regardless, WPA is still a good choice because of the way it attempts to deliver
    enhanced protection against chronic WEP problems, which predate the availability
    of 802.11i security features. There are two key features of the WPA:


    * `802.1X` support.

    * `TKIP` (Temporal Key Integrity Protocol)


    WPA uses `802.1X` port access control to distribute keys on a section-by-section
    timeframe. The biggest advantage of this is that it provides a framework that
    allows for the use of robust upper layer authentication protocols.


    Unlike `802.1X`, which provides a key distribution-per-section feature, `TKIP`
    gives you more. The temporal key integrity protocol allows for key mixing and
    also gives you a longer `IV` (initialization vector). However, it doesn’t end
    there. `TKIP` also provides you with a Message Integrity Check, known as the `MIC`.
    You know that when you transmit data over a wireless network, there is a chance
    that your transmitted data is being tapped into? `MIC` comes to the rescue because
    it prevents wireless data from being modified during its transmission. Moreover,
    these features provide additional support for wireless network security, including:


    * Management of keys.

    * Extension of the `IV` space.

    * Facilitation. Cryptographic keys should be changed frequently. However, `TKIP`
    helps you facilitate the use of session keys.

    * Four new algorithms that help you enhance the security of your 802.11.

    * Key distribution and derivation.

    * Per-packet key construction.

    * All of these attributes also mean that it provides cryptographic integrity as
    a whole.


    It is accurate to say that the Temporal Key Integrity Protocol protects against
    numerous security attacks that were mentioned earlier. Some of the attacks include
    replay attacks or attacks on data integrity. Most importantly, `TKIP` helps you
    change keys frequently, which is a great attribute. The main objective of WPA
    was initially to bring a standard-based security solution to the marketplace to
    replace WEP until the IEEE `802.11i` `RSNs` (which were based on an amendment
    to the existing WLAN standard) became available. It is important to note that
    RSN includes `AES` encryption for integrity confidentiality.


    WPA itself is nowhere near perfection because it also has its problems. It is
    possible for a hacker to crack Wi-Fi Protected Access pre-shared keys that consist
    of short passphrases based on words that could be located inside the dictionary.
    Dictionary-based keys are easy to crack because the hacker can monitor a short
    transaction that only takes a few seconds to complete. The hacker can see the
    speed of typing and the length of the string that was entered.


    Other means of security have tools that prevent them from being attacked easily.
    WPA also has its own software/tool that can be used in cracking keys. You can
    use the tool called “WPA Cracker” (download at `www.tinypeap.com/page8.html`).
    This tool is somewhat primitive in the sense that it requires you to enter the
    accurate information retrieved via a sniffer. For learning, it is recommended
    to use ethereal as your sniffing tool.


    While using WPA, you can protect yourself by following these guidelines:


    * Make sure you choose a good passphrase. Do not use a passphrase made of words
    that can be found inside a dictionary.

    * Make sure your passphrase consists a minimum of 20 characters. You can avoid
    a brute force attack with this as well.

    * Randomly chose your passphrase.

    * Make sure you use WPA Enterprise – or better still, use `802.1X` with WPA.

    * Make sure you use a `VPN` (Virtual Private Network) technology.


    WPA, RSN and `TKIP` are very complex topics and there is lots of research still
    being done in these areas. You can find additional information on the web if needed.


    # ORGANIZATION ENCRYPTION ATTACK COUNTERMEASURES


    Being safe doesn’t apply to homes only because organizations are not immune to
    attacks. This is why an organization should adopt the strategies provided for
    a home network where practical. Whichever strategy you adopt should be supplemented
    with either of the measures below:


    * `WPA2` technology

    * `VPN` technology


    ## Using WPA2

