  trans: '


    *   Parrot Home 是 Parrot 的一项功能，旨在协助用户，让他们体验 Debian 优美的氛围并接触内置的渗透测试工具。它还提供了如何有效使用这些工具的帮助。

    *   Parrot Air 属性主要用于无线渗透测试系统。

    *   Parrot Studio 属性侧重于多媒体创作功能。

    *   Parrot Cloud 属性运行在 VPS 和跳板上。它针对处理服务器的应用程序，使用户能够访问除前端图形之外的完整渗透测试工具包。

    *   Parrot IOT 属性是为 Pine64、树莓派（Raspberry Pi）和 Orange Pi 等低资源系统构建的。

    *   Parrot Security 属性是真正的 Parrot OS，其设计充分考虑了隐私。它的设计也倾向于取证、渗透测试和未来发展。尽管它的功能范围并不广泛，但其重心并未偏离原始的发行版和初衷。凭借多种安全特性，该程序是一个能够满足成功渗透所需的桌面级力量。它定义了黑客攻击的本质。


    Kali 的用户也会发现 Parrot 对他们的工作不可或缺。就像使用 Kali 一样，你会觉得在 Parrot 中非常如鱼得水，而且不需要重新学习与该操作系统交互的基础知识。


    ### 步骤 1：安装 Parrot Security OS。


    首先，我们需要下载一个名为 Parrot Security ISO 的操作系统。你可能可以在 Parrot Security 官方网站获取它，以及 ISO
    的哈希值（hash）。下载成功后，应该确认哈希值。如果哈希值与 ISO 类型不符，则文件已损坏且无效。一个主意是访问 Parrot 网站并下载最新版本。确认哈希是一个简单的过程。要在
    Windows 上验证哈希，请按下 `WIN+R` 打开运行向导，然后在对话框中输入 `CMD`。按回车。当命令提示符打开时，输入代码 `certutil
    .`。


    ```bash

    certutil .

    ```


    ```bash

    certutil-hashfile Parrot-full-3.8_amd_64 SHA1

    ```

    - 如果你的版本是 3.8。


    在 Mac 操作系统中确认哈希，启动命令行并执行代码 - `shasum Parrot-full-3.8_amd_64.ova`。


    在 Linux 上确认，输入代码 `sha1sum .`。


    如果哈希值对应，你就可以继续进行下一阶段。


    ### 步骤 2：创建虚拟机。


    为了运行该操作系统，我们需要在随机机器上对其进行测试。首先，你需要将镜像拷贝到驱动器然后启动系统。虽然这种方法可行，但需要大量时间。新设备可以成功运行 Linux
    的客户端软件。因此，虚拟化将变得更有趣。此外，如果设备出现很多问题，我们可以放弃该设备。


    我们将在 Windows 操作系统上使用离线网站的 `VirtualBox`（`VirtualBox` 是一种强大的虚拟化且极其高效的工具，带有 GNU 开源许可）。如果操作得当，该程序应该在所有主要的平台上都能运行。


    在安装过程中，你可以尝试使用光盘而不是虚拟磁盘。启动 `VirtualBox` 后，管理器会立即弹出。


    系统将打开一个 Parrot 系统。如果你需要重启或运行另一个，滚动到左上角进行操作。输入你选择的机器名称并点击 Linux。之后，将提供一些版本。选择 Debian，但确保该版本适用于你的系统。选择
    32 位或 64 位版本，并确保磁盘上有足够的空间。


    # 结论


    再次感谢购买本书！


    我希望这本书能够帮助你学习更多关于客攻击的知识。下一部分是关于你可以使用并从中学习的各种在线资源。


    最后，如果你喜欢这本书，我想请你帮个忙。你是否愿意在 Amazon 上给这本书留个评价？我将不胜感激！


    祝你好运！


    # 附录 A：无线黑客攻击资源


    随着技术进步的速度，特别是在无线网络领域，你需要通过关注不断发展的标准和工具来确保自己和你公司的安全。虽然本书已经带你介绍了各种黑客攻击和自我保护的技术，但随着时间的推移，仍有许多内容需要学习。以下是一些你可以用来学习更多知识的资源。


    ## 认证


    我们在书中涵盖了伦理黑客攻击（ethical hacking），我们认为这是你可以参加的、用以检验自己知识水平的最佳测试之一。以下是两家提供个人认证的机构：


    *   认证无线网络专家计划：[www.cwnp.com/](http://www.cwnp.com/)

    *   认证伦理黑客：[www.eccouncil.org/CEH.htm/](http://www.eccouncil.org/CEH.htm/)


    ## 通用资源


    根据研究，几乎 90% 的人每天无法离开互联网。每个人都在浏览，每个人都想要 Facebook 账号。互联网是一项宝贵的资源。然而，使用互联网就像试图从消防水管中喝口水。你必须控制信息流。我们编写了一系列定期提供无线网络关键信息的网站列表。此外，你可以订阅他们的免费邮件列表。


    *   SearchNetworking.com: [www.searchnetworking.com](http://www.searchnetworking.com)

    *   SearchSecurity.com: [www.searchsecurity.com/](http://www.searchsecurity.com/)

    *   SearchMobileComputing.com: [www.searchmobilecomputing.com/](http://www.searchmobilecomputing.com/)


    ## 黑客事物


    正如我们在其他章节中强调的样，如果你想抓住敌人，你就需要像敌人一样思考。对于小偷来说也是如此。在《孙兵法》中，孙子写道你需要了解你的敌人才能击败他。这回到了了一种方法论：了解你的敌人是一项极佳的策略。你需要理解敌人，像他一样思考，像他一样行动，因为如果你真的能让自己进入敌人的心态，你将能够更好地理解他。我们为你整理了可以帮助你更好地理解破解者和黑客的最佳网站。


    *   蜜罐技术（Honeypots）：追踪黑客：[www.tracking-hackers.com](http://www.tracking-hackers.com)

    *   《The Hacker Quarterly》杂志：[www.2600.com](http://www.2600.com)

    *   计算机地下摘要（Computer Underground Digest）：[www.soci.niu.edu/~cudigest](http://www.soci.niu.edu/~cudigest)

    *   在线术语表（The Online Jargon File）：[www.jargon.8hz.com](http://www.jargon.8hz.com)

    *   PHRACK：[www.phrack.org](http://www.phrack.org)

    *   黑客 T 恤和其他设备：[www.thinkgeek.com](http://www.thinkgeek.com)


    ## 无线组织


    有很多无线组织，但其中两个是：Wi-Fi Alliance 和 IEEE。


    ### IEEE（电气电子工程师学会）


    在书中，我们提到了无线标准，如 802.11、802.11a、802.11b、802.11g 和 802.11i。这些标准由 `IEEE` ([www.ieee.org](http://www.ieee.org))
    执行。电气电子工程师学会 (`IEEE`）已运行数十年，以开发无线局域网（LAN）、无线城域网（MAN）和无线个人区域网（PAN）的开放无线标准而闻名。你可以将
    `802.11` 标准（空中传输）与 802.3 以太网标准（线缆传输）区分来。你可以通过访问之前的章节或咨询互联网博客和论坛了解更多关于 `IEEE` 标准的信息。


    Wi-Fi Alliance


