    random long number and serves as automatic re-authentication with the web server.
    This essentially means that a token was like your login credentials when you were
    logging onto the website at the beginning of your session, and it should be strictly
    protected. If an attacker were to gain access to your tokens, he or she could
    easily impersonate you in the interaction with that web app or website.


    Tokens are passed from the server to the browser in the URL of the website or
    the cookies, or even in hidden form fields. The hacker can steal these tokens
    using various methods. Some of the more popular methods are:


    Man-in-the-middle attack: This is conducted primarily on websites using Secure
    Socket Layer (SSL) protection. To the user, the hacker pretends to be the server,
    while to the server, the hacker pretends to be a legitimate user. This allows
    the hacker to get the information being sent from the user to the server and also
    the data being sent back from the server to the user.


    Packet or data sniffing: This is when the hacker sniffs the data packet sent on
    a communication channel for information. This occurs mostly in communications
    that do not use the Secure Socket Layer (SSL).


    Brute force: Some websites create tokens in a particular, definite format or even
    reuse tokens. If the hacker can get enough tokens to analyze and is using machines
    with excellent computing abilities, he or she can brute force the tokens and generate
    legitimate tokens that can be used when accessing the website.


    Using an XSS attack to steal tokens: Since we have talked a little about XSS attacks,
    I believe you have an idea of what happens here. The attacker waits for the user
    to log into the web app and the server to send the token, which is then saved
    in the browser. Next, the hacker performs a cross-site script attack and tricks
    the user into executing it on his or her browser. This executed script is often
    a token-stealing script that sends the token to a remote server. The hacker can
    then use this token to interact with the website or web app.


    Session fixation attack: This type of attack is very common for sites that send
    their tokens in the URL. The hacker visits a website or web app, logs in and is
    given a token. The hacker then crafts a URL with the token he or she has received
    and sends the link to the targeted user. The user is cajoled into visiting that
    website with the link and also logs in using that token. However, once the user
    logs in, he or she is not given a new token because he or she is using an existing
    token. Once the hacker has confirmed that the user has logged in with that session
    ID, the hacker does the same and hijacks the session from the user. So, in essence,
    the hacker gets a token, fixes it on a URL and persuades the user to log in with
    it.


    To protect against session-based attacks, we need to ensure that our website or
    web app is not vulnerable to cross-site scripting attacks (XSS), as this would
    make it easy to run token-stealing scripts. You should ensure that tokens and
    sessions are properly managed. In addition, sending tokens through URLs is highly
    discouraged. You should also ensure that all user-provided tokens are rejected,
    as the task of generating tokens should be left to the server.


    7. SSL-Based Vulnerabilities'
