    - `SSIDsniff`: [www.bastard.net/~kos/wifi/ssidsniff-0.40.tar.gz](http://www.bastard.net/~kos/wifi/ssidsniff-0.40.tar.gz)


    ## LEAP 破解


    你可以在本书的附录 B 中找到这些术语的缩写。EAP 被标记为解决 WEP 认证问题的解决方案。另一方面，被认为具有保护作用也有其自身的缺陷。以下你可以用来帮助破解
    LEAP 的工具：


    - `anwrap`: [`packetstormsecurity.nl/cisco/anwrap.pl`](http://packetstormsecurity.nl/cisco/anwrap.pl)

    - `asleap`: [`asleap.sourceforge.net/`](http://asleap.sourceforge.net/)

    - `THC-LEAPcracker`: [`thc.org/releases.php?s=4&q=&o`](http://thc.org/releases.php?s=4&q=&o)


    ## 网络映射


    在上一章中，我们讨论了网络映射。连接到接入点后，你可能希望对网络进行映射。这是因为你想知道可以找到多少台服务器，以及服务器运行什么操作系统。你可以使用以下工具来映射你的网络：


    - `Cheops`: [www.marko.net/cheops/](http://www.marko.net/cheops/)

    - `Cheops-ng`: [`cheops-ng.sourceforge.net`](http://cheops-ng.sourceforge.net)

    - `SNMPUTIL.EXE`: [www.microsoft.com](http://www.microsoft.com)

    - `Snmpwalk`: [www.trinux.org](http://www.trinux.org)

    - `Solarwinds Standard Edition Version`: [www.solarwinds.net](http://www.solarwinds.net)

    - `WhatsUp Gold`: [www.ipswitch.com/products/networkmanagement.html](http://www.ipswitch.com/products/networkmanagement.html)


    ## 网络扫描器


    作为网络所有者，你应该了解网络上发生的一切。在网络扫描器的帮助下，你能够识别运行在网络系统上的应用程序。你可能会在网络设备和服务器上发现这些应用程序。我们使用过工具包括：


    - `fping`: www.fping.com

    - `GFI LANguard Network Security Scanner`: [www.gfi.com/lannetscan](http://www.gfi.com/lannetscan)

    - `nessus`: [www.nessus.org](http://www.nessus.org)

    - `nmap`: [www.insecure.org/nmap](http://www.insecure.org/nmap)

    - `QualysGuard`: [www.qualys.com](http://www.qualys.com)

    - `SoftPerfect Network Scanner`: [www.softperfect.com/products/networkscanner](http://www.softperfect.com/products/networkscanner)

    - `SuperScan`: [www.foundstone.com/resources/proddesc/superscan.htm](http://www.foundstone.com/resources/proddesc/superscan.htm)


