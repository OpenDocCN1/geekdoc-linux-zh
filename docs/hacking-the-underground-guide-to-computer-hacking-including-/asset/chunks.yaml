    ## CRACKING PASSWORDS


    Some tools out there can grab packets, look for passwords and amazingly, provide
    those passwords for you. These tools include:


         Dsniff (Windows port): [www.datanerds.net/~mike/dsniff.html](http://www.datanerds.net/~mike/dsniff.html)


         Dsniff (MacOS X port): [http://blafasel.org/~floh/ports/dsniff-2.3.osx.tgz](http://blafasel.org/~floh/ports/dsniff-2.3.osx.tgz)


         Cain & Abel: [www.oxid.it/cain.html](http://www.oxid.it/cain.html)


         Dsniff: [www.monkey.org/~dugsong/dsniff/](http://www.monkey.org/~dugsong/dsniff/)


    Don’t forget the 10 Commandments of ethical hacking; make sure you crack the password
    you are authorized to crack. If you try to crack a password that is not meant
    to be cracked, you can end up in jail.


    Dictionary Files and Word Lists


    You can actually crack a password using a dictionary or word list. Most password
    crackers take a dictionary or a list of words and then encrypt the words. After
    the encryption, they compare the result to the password file. Then, the password
    is cracked successfully. Thus, you must seek out different wordlists or dictionaries.
    We have created a list of exceptional sources for wordlists and dictionaries:


         CERIAS Dictionaries and Wordlists: [ftp://ftp.cerias.purdue.edu/pub/dict](ftp://ftp.cerias.purdue.edu/pub/dict)


         Default vendor passwords: [www.cirt.net/cgi-bin/passwd.pl](http://www.cirt.net/cgi-bin/passwd.pl)


         Outpost9 Wordlists: [www.outpost9.com/files/WordLists.html](http://www.outpost9.com/files/WordLists.html)'
