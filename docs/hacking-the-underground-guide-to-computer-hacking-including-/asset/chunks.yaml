    There are different types of antennas, all of which have different signal ranges.
    Take, for instance, a high-gain omnidirectional or unidirectional antenna that
    will perform wonders in the process of your scanning airwaves for wireless systems.
    A cantenna is another option. When buying an antenna, go for one that has a pigtail
    connection matching the one on your wireless `NIC`. Note that the length of these
    pigtail cables should not be too long, so keep them as short as possible. This
    is because these pigtails are made with a critically thin microwave coax; the
    cables have impartially high signal losses at microwave frequencies and also with
    the connectors that are placed on either end of the cable. To avoid this stress,
    make sure your pigtail cable is no longer than five feet, which will help you
    avoid high cable losses.


    ## TOOL 4: GPS RECEIVER


    According to its dictionary meaning, a global positioning satellite (`GPS) is
    an audio-visual device that can be fitted into a civilian’s road vehicle as an
    aid for navigation. If you’ll be warwalking or wardriving, or if your wireless
    system spans a large building, this is the perfect time to think along a new global
    dimension. `GPS` will come in handy in these situations because you’ll have the
    ability to integrate your wireless testing tool or software, which will pinpoint
    the exact locations of wireless systems within a few meters. `GPS` is the tool
    used by spies in movies to track their targets even though anyone can use it as
    needed.


    ## TOOL 5: STUMBLING SOFTWARE


    The stumbling tool is essential to the hacking profession and you can''t do without
    it. A stumbling software will help you map out things like signal strength, `SSIDs`
    and the systems that use `WEP` encryptions. There are many kinds of software you
    can use to perform this type of operation, but it is recommended to use the `Network
    Stumbler` if you are on Windows. You can also use a Wireless `NIC` management
    software. Did you know you can even perform stumble using the management software
    built into Windows XP`? You can, although it’s applicable only for basic stumbling.


    ## TOOL 6: WIRELESS NETWORK ANALYZER


    So now you’ve been able to stumble the network successfully. It doesn’t end there
    for you as a hacker. You need to probe deep into the airwaves. You can get this
    done by using a network analyzer software. Programs such as `AiroPeek`, `Kismet`
    and `Ethereal` can help you analyze and monitor wireless channels for protocols
    that are in use. These tools can also help you search for wireless system anomalies.
    The best part about them is that they can even capture wireless data, right out
    of thin air.


    ## TOOL 7: PORT SCANNER


    Port scanning is also an essential step that needs to be completed when hacking
    a wireless network like a pro. The best tools to use are `nmap` or `SuperScan`.
    They are considered great tools for scanning the wireless system that you stumbled
    to help find more in-depth information about what’s running. Moreover, they are
    useful because they will help you find what’s potentially vulnerable in the network.


    ## TOOL 8: VULNERABILITY ASSESSMENT TOOL


    Probing that network further to see the vulnerabilities that still exist in the
    network is another great step to take. The best tools for this task are `Languard
    Network Security Scanner`, `Nessus` or `QualysGuard`. When the scan is run using
    either of these tools and you have a result indicating what is still vulnerable
    on your network, the information you obtain can also be used as a form of protection
    that reveals where hackers can potentially exploit your network.


    ## TOOL 9: GOOGLE


    You can go to google and run a quick search on the previously mentioned tools,
    which will provide more interesting results. You can use Google to search for
    `Network Stumbler` and `NSI` files, dig deeper into web server software built
    into your AP, research specific vulnerabilities, find the latest wireless security
    tools and learn about new hacking tricks.


    ## TOOL 10: 802.11 REFERENCE GUIDE/BOOK


    You will not remember everything you read. Even experts need to continue learning.
    So while you are carrying out your ethical hacking on a wireless network, you
    will need a good reference book or guide on `IEEE 802.11` standards. This standard
    is very complex and evolves over time, which means you’ll want to continue reading
    about the latest trends. You’ll likely need to look up information about channel
    frequency ranges, what a certain packet does and what it is used for. Perhaps,
    you may also need to learn more about a specific default `802.11` setting.


    # CHAPTER FIVE: CRACKING ENCRYPTION


    ### Chapter Objectives:


    - UNDERSTANDING ENCRYPTION

    - THE ENCRYPTING FRAMES

    - WEP PROBLEMS

    - UPGRADING TO WPA

    - THE CONCEPT OF AES ENCRYPTION

    - TUNNELLING THE INTERNET WITH A VPN


    Most people believe that when something is encrypted, it is unbreakable and secure,
    but this is not true. As technology keeps progressing and new security features
    regarding encryption may not be as robust as you like. Did you know that cryptography
    features can have flaws? You may use the wrong algorithm for the right task, a
    short key, a flawed algorithm or even a security breach. In this chapter, we will
    discuss how one or all of these flaws can affect your wireless networks. The techniques
    you need to use to strengthen your access point will be discussed in this chapter.


    **Helpful Tip:** It is recommended that you employ the built-in security features
    as your important overall defense mechanism.


    ## WHAT CAN HAPPEN


    One of the features of the `IEEE 802.11` standard is that a wireless network must
    maintain a secure working environment. One primary feature was the adoption of
    encryption to provide the following:


    - **Message Privacy**: Encryption is interesting in the sense that you can be
    sure that your encrypted sensitive information is safe while it is being sent
    between two wireless entities. This is the case because it will prevent the third
    party from tracking your data. Therefore, your privacy is guaranteed to a certain
    extent.

    - **Message Integrity**: An entity can help both the sender and receiver know
    if someone has changed or accessed the message being sent.


    Just like any other technology, there will be some shortcomings. Despite the fact
    that `802.11` standards attempted to address integrity and privacy, some things
    still never fell into place. Below is a discussion of these features and their
    drawbacks.


    ## PROTECTING MESSAGE PRIVACY


    It is not possible for you to design a system without considering its security
    level; you don’t want your system vulnerable to attack. `IEEE 802.11` tried to
    support users that had their own privacy with the use of cryptographic procedures,
    which address the wireless user interface. When these techniques were introduced,
    the first and most widely used algorithm was called `wired equivalent privacy`.
    `WEP` was discussed in the previous chapters and is one of the first algorithms
    to be made to ensure privacy.


    Wired equivalent privacy uses an `RC4` symmetric key which is incorporated into
    a stream cipher system to produce a pseudo-random data structure. The `WEP` keystream
    has a simple function that is added via a modulo two calculation to the data being
    transmitted. One may say, “Wow, `WEP` is so secure.” Actually, it’s really not.
    Unfortunately, all of its attributes don’t add up to very impressive security.


    It is a simple algorithm–the longer an encryption, the harder it is to crack it.
    `WEP` is a bit outdated because it supports only the 40-bit size of the shared
    key, as defined in the `802.11` standards. However, most of the vendors in the
    market are offering non-standard extensions of `WEP` which support key lengths
    from 40 to about 104 bits. It should be noted that `WEP` uses `IV` to seed its
    algorithm before it encrypts the frame.

