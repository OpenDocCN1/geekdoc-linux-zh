    12.  For instance, select ORiNOCO.


    13.  You can control the time it takes to crack the key. For instance, if you
    wish to decrease the time it will take to crack the key, increase the 40-bit or
    128-bit crack breadth.


    14.  Note that increasing the crack breadth will increase the number of key possibilities
    that can be examined when AirSnort attempts to break the WEP key.


    15.  Start the cracking process by clicking on the start button on the lower left
    part of the bar at the bottom.


