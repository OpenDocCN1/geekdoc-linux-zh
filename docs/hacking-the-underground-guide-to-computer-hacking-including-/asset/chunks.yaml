    program and is exported to the PowerShell folder. Tricking the target to access,
    download and execute this program creates access for the attacker.


    By now, you should realize how powerful the SET is in executing computer-aided
    social engineering attacks. This tool is very valuable for a penetration tester,
    as it provides a robust and diverse means of checking the various vulnerabilities
    that may exist in an organization’s network.


    ## BeEF


    BeEF stands for Browser Exploitation Framework. This tool comes with most of the
    security-based Linux distro, like the Parrot OS and Kali Linux. BeEF started as
    a server that was accessed through the attacker''s browser. It was created to
    target vulnerabilities in web browsers that would give access to the target systems
    for executing commands. BeEF was written in the Ruby language on the Rails platform
    by a team headed by Wade Alcorn. As stated before, passwords, cookies, login credentials
    and browsing history are all typically stored on the browser, so a BeEF attack
    on a client can be very nasty.


    On Kali Linux, however, BeEF has been included in the distro. The BeEF framework
    can be started by going into applications, clicking on exploitation tools and
    then clicking on the BeEF XSS framework. This brings up a terminal that shows
    the BeEF framework server has been started. Once the server has been started,
    we open our browser of choice and visit the localhost at port 3000\. This is written
    in the URL space of the browser as localhost:3000/ui/authentication or 127.0.0.1:3000/ui/authentication.
    This would bring us to the authentication page of the BeEF framework, requiring
    a login username and password. By default, the username is beef ; the password
    is also beef.'
