    This is the first method you can employ to look at these vulnerabilities. It’s
    also the most time consuming, although it is essential. At first, using this method
    to assess weaknesses can be difficult but time, dedication and commitment will
    make it easier later on. This is called a manual assessment, although it involves
    numerous semiautomatic security tools which don''t perform a run-of-the-mill robot
    assessment because of the need for a guiding hand in the process. Understanding
    what works and what doesn’t will help with your manual assessment. Manually assessing
    your network’s vulnerabilities is necessary, and various other ways through which
    you can perform this assessment are mentioned later on in this book.


    ## AUTOMATIC ASSESSMENT


    This is the second method or way of looking for vulnerabilities in your system
    or network. You can perform this automated method by using an open source tool
    called `Nessus`. (You can get it at `www.nessus.org`.) You can also use the commercial
    `LANguard Network Security Scanner` ([www.gfi.com/lannetscan](http://www.gfi.com/lannetscan))
    or `QualysGuard`. These tools have the ability to help you automate the whole
    process of vulnerability assessment by scanning live systems, determining whether
    vulnerabilities (either actual or potential) exist. The time taken by these tools
    is usually a bit lengthy, so while they scan for vulnerabilities, you can catch
    up on emails or watch a movie. There is no way you can perform an automated ethical
    hacking without the use of these tools.


    Many software choices are available today. Thus, you should be able to explore
    the internet for better wireless hacking tools which are absolutely free. However,
    if you have a strong budget, you can go for the premium tools. They all work well
    at running their own specific tests, although when you are ready to take a closer
    look at your system’s vulnerabilities, these free commercial tools will prove
    their worth. You will get what you pay for the moment you are delicately probing
    the operating system and all of the applications that are active on your wireless
    network.


    ## FINDING MORE INFORMATION


    When you have finally used your tools to find the suspected vulnerabilities on
    your network, you can still take numerous steps to learn more about the vulnerabilities
    and resources. Doing this will give you more information about the weaknesses
    you have gathered. The right place for you to start is at your wireless vendor’s
    website. For instance, if you are using a `Windows` operating system and have
    an issue with it which supersedes your knowledge, a good place to start is the
    `Windows` website. On their website, you can look at the users’ forums where you
    can find related problems and solutions. You may even be lucky enough to find
    available security patches. The database below can also be exploited for a more
    in-depth idea about a specific vulnerability as well as these fixes:


    *   `NIST ICAT Metabase` (located at [http://icat.nist.gov/icat.cfm](http://icat.nist.gov/icat.cfm))

    *   `US-CERT Vulnerability Notes Database` (located at [www.kb.cert.org/vuls](http://www.kb.cert.org/vuls))

    *   `Common Vulnerabilities and Exposures` (located at [http://cve.mitre.org/cve](http://cve.mitre.org/cve))


    Another excellent method you can use to find more information about specific vulnerability
    problems is using a search engine. It is recommended to use the `Google` web and
    groups search for queries. You will likely find a solution and more information
    about what you are looking for.


    ## METHODOLOGY 6: HACKING INTO THE SYSTEM


    This is the last methodology on our list. You should have been able to try the
    methodologies mentioned earlier. After you map your network, try to see the systems
    running and find possible vulnerabilities. There is one more phase in the ethical
    hacking methodology but it is optional. This phase is called the system penetration
    phase . This is the phase that will truly test what information and systems can
    actually be compromised on your wireless network and provide you with information
    regarding the top goals of a malicious hacker.


    Hacking into your wireless system can be seen as being given unauthorized access
    to resources and to geting away with the information. This is when you will join
    the wireless network, connect to different systems and do things like:


    *   Browsing the Internet

    *   Logging into the network

    *   Changing the AP configuration settings

    *   Sending and receiving e-mails

    *   Editing, copying and deleting Files

    *   Mapping to network drives

    *   Capturing data being sent over the network using a sniffer such as `AiroPeek`
    or `Ethereal` ([www.ethereal.com](http://www.ethereal.com))


    We can say that these things are unethical, but hackers are doing them. So it
    makes sense for you to try them yourself and get insight into what is possible
    on your network.


    **Helpful Tip:** When you are hacking or penetrating your system, be very careful
    and penetrate with caution. Take your time; don’t be in a rush to damage anything
    or take steps that might get you lost. In other words, you want to minimize any
    disruptions you might create.


    # CHAPTER FOUR: TEN BEST TOOLS FOR HACKING WIRELESS NETWORKS


    For any job to be done in the right way, you need the right tool for it. Following
    are the 10 best tools for performing your hack:


    ## TOOL 1: LAPTOP COMPUTER


    Before you can surf the internet, you need an internet data connection. The root
    of everything you can perform on the internet is a computer system. Without a
    computer system, there is nothing you can do. For beginners, you need a computer
    to conduct your tests; I recommend portable systems such as laptops. While it
    is possible to hack using a pocket personal computer (`PC`), it has limited tools
    compared to what you’ll find on a laptop.


    Different wireless network systems have different specifications, so you should
    use a system that has multiple operating capabilities. Use a system that can dual
    boot `Windows` and `Linux`, or preferably a `Windows`-based system that is running
    a `VM` (virtual machine) program such as `VMware` on which you can install two
    different Operating Software. Most computer systems that are capable only of running
    a single operating system always have minimal hardware requirements.


    In terms of specifications, the least you should be looking for on a single operating
    system is `RAM` of at least 256MB, a `Pentium III` processor and at least 30-40
    HDD (hard disk drive). However, if you intend to run a `VMware` or any other kind
    of virtual machine system on your system, you might want to look elsewhere for
    a better specification. You will need more `RAM` and a more powerful hard drive.


    ## TOOL 2: WIRELESS NETWORK CARD


    Getting a laptop with the specifications of your choice is the first step. Now
    you have a laptop and you need an efficient wireless `NIC` (network interface
    card). Find a `PC NIC` that is not only compatible with various wireless tools
    but also one that is compatible with an external antenna. This compatibility will
    help you pick up more signals efficiently. Everything today is usually built on
    class, which means that we can have devices that are built according to our budgets.
    Some devices are available for people with low budgets while others exist for
    people with higher budgets. Most of the wireless `NICs` in today’s laptops are
    good general-purpose cards even though you can limit your test results. This is
    true because they have a shorter radio range capability than internal antennas.


    ## TOOL 3: ANTENNAS AND CONNECTING CABLES

