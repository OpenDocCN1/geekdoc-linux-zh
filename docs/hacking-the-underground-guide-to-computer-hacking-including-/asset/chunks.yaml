    to see if your AP is listed there as well.


    To see more about your public information, you can use [www.whois.org](http://www.whois.org)
    to look up your domain name public data. To look up your IP address, you can use
    [http://ws.arin.net/cgi-bin/whois.pl](http://ws.arin.net/cgi-bin/whois.pl) (known
    as American registry for internet numbers). These databases will provide with
    sensitive information about your wireless system or network–even information you
    ought not to be advertising. Access those websites and check your wireless details.


    ## METHODOLOGY 2: MAPPING YOUR NETWORK


    This methodology will teach you how to create your network map, which will enlighten
    you on how your wireless systems are laid out. This is to be done from both the
    inside and outside of your wireless network. Just like there are third-dimensional
    images, in wireless networks or systems it is necessary to know how your network
    is laid out from both inside and outside because wireless networks have a third
    dimension known as the radio wave dimension. The radio wave dimension makes it
    possible for your wireless system to be discovered from either side of your physical
    building or firewall. This dimension is capable of showing you not only external
    and internal configuration information but also information that is tagged explicitly
    to the wireless radio waves being transmitted inside and outside of the network.


    On a wired network, the process of transmitting data is a bit different compared
    to that of a wireless network. This is because a wireless network opens a new
    dimension for its process. As mentioned earlier, these radio waves can be seen
    as a virtual third dimension; in effect, this dimension gives hackers a kind of
    accessibility to be able to jump over a conventional boundary.


    Below are the best available tools for mapping your network perfectly and professionally.


    *   Network Stumbler: With years of research, we can say that this is the best
    tool for mapping your wireless network APs both internally and externally. You
    can download this tool from [www.netstumbler.com/downloads](http://www.netstumbler.com/downloads)
    . Network Stumbler is a Windows OS-based tool. This tool or software allows you
    to scan the airwaves from outside your building. It will give you an analysis
    report about what a hacker sitting in the park or driving by can see on your network.
    You can also run this software from the inside to help you find any additional
    wireless APs that don’t belong.


    *   AiroPeek: This is another fantastic tool that can help you gather network
    map information. It is also known as a Wireless Network Analyser and/or the sniffer.


    *   Cheops-ng and QualysGuard: To start, you will need to gather all the information
    transmitted through radio frequency (RF) along with any other information regarding
    the wireless network that is accessible through the internal wired network. To
    gather this information, you need the open source tool Cheops-ng (at [www.cheops-ng.sourceforge.net](http://www.cheops-ng.sourceforge.net)
    ). You can also get the commercial version of QualysGuard at [www.qualys.com](http://www.qualys.com)
    . To create the internal mapping of your wireless network, either of these two
    tools can help you by laying out general IP addressing structures and internal
    hostnames. Furthermore, you can perform the same process used internally to map
    your wireless network outside to determine the external IP addresses and names,
    along with the DNS hostnames (domain name system) of the public hosts that are
    available. In short, these two methods can make your wireless network more secure
    by giving the network more of a backbone.


    *   nmap and fping: In a Windows command prompt, for you to confirm that you are
    connected to the internet, you can simply type “ping + web address.” The web address
    can be any site, (e.g., [www.Google.com](http://www.google.com) ). If after typing
    this command you get a statistics report showing the sent packets and other details,
    you can say that your system is connected to the internet. The same logic applies
    to the “nmap and fping” here, but this time you actually use the internet. The
    two of them are considered to be network mapping utilities that allow the usage
    of the ICMP (Internet Control Message Protocol) to determine the systems that
    are “alive” and “active” on your network. You can perform this operation by “pinging”
    a sweep of your network, which can be performed by using the nmap utility (www.insecure.org/nmap).
    Nmap is a Windows-based utility and the fping utility applies to the UNIX and
    LINUX operating systems ( [www.fping.com](http://www.fping.com) ). Although these
    two utilities will not create a graphical layout view for your network, you should
    be expecting these sorts of things from network-mapping programs. At the same
    time, they are very beneficial and useful.'
