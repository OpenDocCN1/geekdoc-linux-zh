    * Ubuntu

    * Linux Mint Cinnamon

    * Manjaro Linux

    * Linux Server


    Linux servers are powerful and dynamic versions of the open source Linux operating
    system (e.g. the `Ubuntu server`). While you can get some of these servers for
    free (`Ubuntu` and `Centros`), others come with a price tag and are somewhat affordable
    with additional advantages (`SUSE` and `Red Hat enterprise Linux`).


    To determine the distribution that would be easy for you to work with, you must
    consider certain factors mentioned below:

    1. Your competence in using the computer.

    2. What you would prefer between a server and desktop.

    3. Whether you would prefer a modern or traditional desktop interface.


    An average computer user would do better to opt for the beginner’s distribution,
    which is very easy to learn and use. Some examples are `Ubuntu` and `Manjaro Linux`.
    However, if you’re quite good at handling a computer, you could opt for more difficult
    distributions like `Fedora` and `Debian`. If you’re a computer guru, you can upgrade
    to complex distros like `Gentoo`.


    If your choice is the server type, you’ll need to decide between a server distribution
    and a desktop interface. You will also need to determine whether you will be operating
    solely by using command lines. It is important to note that the `Ubuntu server`
    does not permit the installation of a GUI interface, which means you will need
    some knowledge regarding the initiation of command lines. Otherwise, your server
    will be stuck and unable to progress when loading graphics. Another option is
    to install a GUI package on an `Ubuntu server` that uses single command lines.


    Systems analysts will consider the features of a distribution before making a
    choice. Which server will best suit your needs? For example, if you need a self-sufficient
    distribution that will provide all of the necessary requirements for your choice
    of server, you should choose `Centos`.


    # HOW TO SUCCESSFULLY PERFORM A LINUX INSTALLATION


    The fact that `Linux` is a user-friendly operating system cannot be stressed enough.
    Basically, you just need to follow a few steps. Linux installation can be done
    directly from a CD or a drive without any alterations to your hard drive. At the
    beginning of the installation process, simply click on the installation icon displayed
    on the screen. The installation often comes with an installation wizard that serves
    as a guide to successful installation of the Linux operating system. The following
    steps will lead to the successful installation of `Linux`ss `Red Hat` version.
    Note that you must ensure your computer is compatible with the Linux version you
    wish to install. You might also need to include some plugins or third-party software
    that will be of more use to the program.


    1. First, place the `Red Hat Linux` disc into the hard drive and wait until “install
    Red Hat Linux” or something similar shows up on the screen. Once that happens,
    click on “install” and then installation will begin automatically. The program
    will ask you to confirm whether the disc from which you are installing is properly
    inserted. Do not worry about this and just continue with the installation process.

    2. Next, you will need to select your preferred language option. A list of several
    languages to choose from will be provided. After this has been done, you can move
    on to the next stage of the installation process.

    3. The program will then ask for the keyboard that matches your computer. Again,
    a variety of options will be displayed, from among which you should select the
    right keyboard type. Once this is done, you can skip to the next part of the installation.

    4. Here, the program will ask for the installation code to verify whether you
    are licensed to use the software. In other cases, you could simply skip this part
    and move on to the next stage; however, if you wish to fully maximize the program,
    you will need a licensing code. Once you have correctly entered the code, verification
    will take place automatically and you will be free to move on to the next step.

    5. The next step is to create the installation path or location of the program
    in your computer’s hard disc. Use the available space on the drive and create
    a layout. Set it as default so as not to interfere with any other operating system
    on your computer. Create the necessary partitions and their respective sizes for
    proper functioning of the software.

    6. Next, select the network setting. Provide the necessary data for the required
    network address. Set the proper time. Select your time zone and create the super
    user password.

    7. The final step is to complete the installation process and restart the computer.


    # Installing any desired app on Linux


    Almost every operating system comes with a store containing hundreds of different
    software programs you can install and uninstall to fully maximize the operating
    system. The installation process is quite easy, especially when it comes to `Linux`.
    Some distributions employ an Advanced Packaging Tool (`APT`) for easy installation
    of software. The `APT` skims the database in the hard drive while searching for
    programs and their various locations in the drive. Using `APT`, you can type the
    name of any software, search for it and install it.


    Early versions of `Linux` were more difficult to handle due to an absence of software
    tools. Installation was achieved by a complex form of arrangment under a `Minix`.
    Installation now commences after the arranged software is transferred to the right
    locations. With recent advances in `Linux` versions, distribution comes along
    with varying software tools, including `Portage`. `Portage` is a software tool
    that is used by the complex `Gentoo` distribution. The most important thing about
    these tools is that they have the same primary function of compiling software
    from various locations for installation. The GUI is a factor that greatly affects
    these software tools, as many of them need a GUI to function.


    For servers that don’t employ GUIs, the command line will be the next option.
    A prime example of this includes `Debian` and `Fedora`, which will employ tools
    like `apt-get`. In the `Debian` distribution, to install the `apt-get`, you would
    need to initiate the command `sudo` as a prefix. For example, to install the `curl`
    tool, the command statement will be `sudo apt-get install curl`.


    To upgrade the versions of software installed on a distribution, you can use the
    `upgrade` command. To balance the upgrade dependencies, click on `dist-upgrade`.
    There is a possibility of installing many software programs at the same time.
    To do this, list the names of the software after a command such as `goaccess`.


    To keep the configuration of software files when trying to uninstall them, use
    the `remove` command. The function of the `purge` command is to completely eradicate
    the file including any configuration files. If you need only the source file of
    a software program, use the `download only source` package option.


    # ADVANTAGES OF LINUX OVER OTHER OPERATING SYSTEMS

