    11. To select your network card manually, click on the `Card Type` drop-down list.
    Then select your preferred wireless network interface card (NIC).


    12. For instance, select `ORiNOCO`.


    13. You can control the time it takes to crack the key. For instance, if you wish
    to decrease the time it will take to crack the key, increase the 40-bit or 128-bit
    crack breadth.


    14. Note that increasing the crack breadth will increase the number of key possibilities
    that can be examined when `AirSnort` attempts to break the WEP key.


    15. Start the cracking process by clicking on the `start` button on the lower
    left part of the bar at the bottom.


    16. When the process begins, `AirSnort` will start showing you sensitive SSIDs
    and eventually crack the key for you.


    ### USING AIRCRACK


    Christophe Devine developed this WEP cracking tool. You can download it at [www.cr0.net:8040/code/network](http://www.cr0.net:8040/code/network).
    `Aircrack` was designed to work effectively on the two operating systems, which
    are Linux and Windows. For the sake of this tutorial, we will concentrate more
    on the version of `Aircrack` specially designed for the Windows OS.


    `Aircrack` is considered to be one of the fastest means of attacking WEP. It implements
    `KoreK`’s attacks along with the improved `Fluhrer-Mantin-Shamir (FMS)`. To perform
    an effective hack with `Aircrack`, all you need to do is collect as many packets
    as you can from a WEP encrypted wireless network. `Aircrack` uses packets to carry
    out its tweak. Follow the steps below to use `Aircrack`:


    1. Access the website above to download the `Aircrack` software `aircrack-2.1.zip`.
    After downloading it successfully, use an unzipping tool to unzip the `Aircrack`
    file. You can use `Winrar` to unzip. After the zipped file has been unzipped,
    in the list of the inner files, you should now see a file named `airodump` in
    the `win32` subdirectory. This `airodump` program is the packet-capture tool.


    2. To start the packet capture, simply double click on the `airodump` icon. A
    new window will pop up with a list of known wireless interfaces. Choose the one
    to use by selecting it and hitting the `enter` key. A new window should pop up
    again. In this new window, choose your interface and press the `enter` key. For
    instance, to choose `Orinoco/Realtek` interfaces, choose `o`, or if you would
    like to go for the `Aironet/Atheros` interface, choose `a`.


    3. Now enter the channel you want to scan and then press the `enter` key. If you
    happen to know the number of the channel you want to wardrive, enter its number
    manually. If you don’t know the number of the channel, enter the number zero (`0`)
    and scan all of the available channels.


    4. Give a name you want for the output file and hit the `enter` key. Make sure
    you enter a proper name that makes sense here. You also want to make sure you
    give a date and time to the name you will be using.


    5. You will have many MAC address options proportional to the available channels.
    If you wish to filter a specific MAC address, enter it manually. However, if not,
    just enter the letter `p`, which stands for none. Then press the `enter` key.


    6. Anticipate and observe as the `Airodump` starts capturing frames. A new window
    will appear as the operation proceeds. From this new window, you can see the progress
    and status of the `Airodump` while it racks up on initial vectors.


    7. Double click on the `Aircrack` icon.


    8. Another awesome attribute about `Aircrack` is that it can determine a WEP key
    in few seconds, although the execution time varies. It took John many days to
    crack a WEP with less activity and a 40-bit key. Note that shorter execution times
    will require more traffic, more luck, even more initialization vectors and the
    lowest successful fudge factor. This factor is a setting that tells `Aircrack`
    how wildly and deeply it should guess when it''s trying out new keys. `Aircrack`
    was designed in such a way that the higher the fudge factor, the higher the keys
    `Aircrack` will try. This rule will increase both the likelihood of the attack
    working out well and the potential time of execution.


    9. This fudge factor has its default value, which is 2 (two), but you have the
    chance to set it to your own custom positive integer value. However, try to change
    the default value of the fudge factor only when other means of attack do not succeed.
    The general trade-off is: The higher the fudge factor, the longer the execution
    time.


    10. If you choose to use a value for the fudge factor that is different from the
    default value, which is two, type it manually and press the `enter` key.


    11. Access the file you created in steps 1-9.


    12. You can manually type the name and hit the `enter` key. You can also do it
    like a pro by dragging the file to the place where you need it.


    13. Enter the number 0 and press the `enter` key.


    ### USING WEPLAB


    This is another interesting tool developed by Jose Ignacio Sanchez. You can use
    this to crack the WEP key. `WepLab` ([http://weplab.sourceforge.net](http://weplab.sourceforge.net))
    provides an alternative implementation of the `KoreK` attacks. `WepLab` is a bit
    similar to `Aircrack`’s fudge factor. In `Aircrack`’s fudge factor, the default
    is two while `WepLab` has a default of 5. `WepLab` operates in relatively few
    branches–that is, higher settings increase the number of branches taken. `WepLab`
    also provides a probability adjustment with its percent, which is a line option
    (`--perc`). `WepLab` provides brute force attack and dictionary cracking. These
    attributes are the things that make `WepLab` an essential tool in the industry.


    ### FINDING OTHER TOOLS


    The ability to conduct more research on your own is the first step in learning
    more about this field. Search engines will come in handy in this section. There
    are thousands (if not millions) of tools available on the internet that you can
    find only when you conduct your research. Nevertheless, you are not totally stranded.
