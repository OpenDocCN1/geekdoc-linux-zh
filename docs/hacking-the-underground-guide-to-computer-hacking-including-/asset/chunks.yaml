    old files as a backdoor.


    *   Scan your files from time to time. Also make sure that all of the applications
    on your system are updated frequently to the latest version.


    *   If you work at home, make sure you are in contact with security professionals
    or firms that can help you check network loopholes and rectify them as soon as
    possible.


    *   Always back up your files. You can use safe cloud drives such as Google Drive
    or Dropbox. You can also purchase an external drive to keep your important files
    safe and intact.


    *   Are you on a social network? Avoid clicking on links sent by people you don’t
    know. Such tempting messages can be invitations to private chat rooms or promises
    of money if you click on the links. Avoid them and stay safe.


    *   As technology is improving, so are software developers. Always make sure you
    are surfing the internet with a good browser. For instance, some browsers have
    inbuilt virus or danger detection bots, which will alert you if you are trying
    to access a web page that is not safe. When you want to download a browser, go
    for one with better inbuilt security features. The following browsers are recommended:


    a)     Google Chrome


    b)     Mozilla Firefox


    c)     Safari


    *   Use the features that matter to you when you are connected to the internet
    with your browser. For instance, if you are not using Java or Active X while you
    are connected, deactivate them in your browser. Having them connected all the
    time is not safe.


    *   Research has shown that the most secure operating systems are Linux and Macintosh.
    If the these two systems meet your needs, it is recommended that you switch to
    them. They are more secure, as they have had fewer incidences of hacking compared
    to the popular Windows systems.'
