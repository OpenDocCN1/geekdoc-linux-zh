    ## 7. OWASP Zed


    `OWASP Zed Attack Proxy`（缩写为 `ZAP`）的一个特点是它没有价格。它的开源版本向公众开放。`OWASP` 是一个流行的功能且有效的代理工具，可以替代
    Burp Suite。`OWASP` 用户界面友好，并且能够高效地完成工作，因为它暴露了 Web 应用程序的漏洞。`OWASP` 的功能总结如下：


