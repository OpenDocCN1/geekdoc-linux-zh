    concluded that there were approximately 2,000 weak initialization vectors.


    The AirSnort software can be downloaded at [http://sourceforge.net/projects/airsnort/](http://sourceforge.net/projects/airsnort/)
    .


    AirSnort runs smoothly on the UNIX platform. It can also be used on Windows. To
    run AirSnort on Windows, you will need to download WinAirSnort at [www.nwp.nevillon.org/attack.html/](http://www.nwp.nevillon.org/attack.html/)
    .


    You can use this tool on Linux as well. Follow the steps below to install AirSnort
    on Linux:


    1.  Download the file and unzip it. To unzip it on Linux, use the command below:


    /#gunzip airsnort-0.2.7e.tar.gz


    2.  At this point, you will have to Untar the file. To achieve this, use the command
    below:


    /#tar –xvf airsnort-0.2.7e.tar


    3.  During the process of uncompressing the file, change the directory to the
    location you used. You can do this by using the command below:


    /#cd airsnort-0.2.7e


    4.  Compile and install AirSnort.


    5.  Don’t forget that Linux platforms differ from each other. Most of them require
    different commands to work with them. During the process of compilation, the binaries
    of AirSnort will be placed in the directory /user/ local/bin . But this command
    varies because your platform might be different. If the command doesn’t work for
    your Linux platform, try one of the following:


    /airsnort-0.2.7e# make'
