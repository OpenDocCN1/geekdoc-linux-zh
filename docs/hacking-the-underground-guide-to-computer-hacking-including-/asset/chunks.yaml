    Social Engineering Toolkit（SET）菜单上的第三个选项是感染性媒介生成器工具。这个工具非常易用，目标是那些能够允许黑客访问组织网络的个人，从而使黑客能够从网络内部进行攻击。该工具允许黑客创建一个包含恶意脚本的
    USB 盘或 DVD，该脚本可以让黑客获取目标 shell（终端）访问权限。选择此选项将打开一个菜单，提示用户在文件格式利用程序或标准的 `Metasploit`
    可执行文件之间进行选择。选择文件格式选项将打开一个载荷列表，供用户选择。默认是一个嵌入在可执行脚本中的 `PDF` 文件。然后，该文件会被发送到驱动器，同时会创建一个带有
    `PDF` 文件的 `autorun.inf` 文件。当员工在驱动器上打开该文件时，文件将在后台执行，黑客即可获得受害者计算机的 shell 访问。


    第四个选项是 `generate-a-payload-with-listener`。此选项允许黑客创建一个恶意脚本作为载荷，并生成一个监听器。该脚本是一个
    `.exe` 文件。关键在于让目标受害者点击并下载此脚本。一旦受害者下载并执行了 `.exe` 文件，监听器就会提醒黑客，黑客即可访问受害者的 shell。


    Social Engineering Toolkit 中的第五个选项是邮件发送器。点击此选项会弹出一个包含两个选项的菜单：单邮件地址攻击和批量邮件发送器攻击。单邮件地址攻击允许用户向单个电子邮件地址发送邮件，而批量邮件发送器攻击则允许用户向多个电子邮件地址发送邮件。选择此选项将提示用户选择一个包含多个电子邮件地址的列表，然后邮件将发送到这些地址。


    列表中的第六是基于 Arduino 的攻击。通过此选项，你获得了入侵基于 Arduino 设备的手段。而第七个选项是 `SMS` 伪装选项，它允许黑客向个人发送
    `SMS`。此 `SMS` 伪装选项会打开一个菜单，可以选择执行 `SMS` 伪装形式的攻击或创建一个社交工程模板。选择第一个选项将发送单个号码或批量 `SMS`
    攻击。仅选择单个号码将提示用户输入接收者的电话号码。然后你会被要求使用预定义的模板或编写自己的消息。根据你对 `SMS` 的偏好，输入 `1` 选择第一个选项，输入
    `2` 选择第二个选项。然后你输入源号码，即你希望接收者看到的 `SMS` 发送者号码。接下来，你输入想让接收者看到的消息。你可以嵌入钓鱼网站的链接或导致用户下载恶意
    `.exe` 文件的页面链接。消息编写完成后，屏幕上会显示用于 `SMS` 伪装的服务的选项。其中是付费选项，另一些是免费的。


    `SET` 中的第八选项是无线 AP 攻击向量。此选项用于创建一个虚假的无线 AP，让毫无防备的公共 Wi-Fi 用户连接，黑客可以嗅探他们的流量。该选项使用其他应用程序来实现这一目标。`AirBase-NG`、`AirMon-NG`、`DNSSpoof`
    和 `dhcpd3` 是与无线 AP 攻击向量协同工作的所需应用程序。


    菜单中的第九项是 `QR` 代码攻击向量。今天，`QR` 代码无处不在，从物品识别到获取销售产品的详细信息。现在 `QR` 代码甚至被用于支付。有些网站使用
    `QR` 代码进行登录或作为 Web 应用。使用这种登录方法是因为它认为是一种更安全的访问方式，因为黑客可以窃取 cookie、执行中间人攻击，甚至使用暴力破解密码获取未经授权的访问。然而，`QR`
    代码使用的增加为黑客提供了更多利用受害者的途径。`QR` 代码攻击向量帮助黑客创建一个恶意的 `QR` 代码。然后黑客使用凭据收集器选项创建或克隆一个类似
    Facebook 的网站，并将此恶意的 `QR` 代码嵌入指向克隆网站的链接中。黑客向受害者发送钓鱼邮件或伪造 `SMS`，提示对方用移动设备扫描代码。当受害者访问网站并输入登录详情时，这将泄露受害者的
    GPS 位置和其他信息。


    菜单中的第十选项是 `PowerShell` 攻击向量。此选项允许黑客在操作系统的 `PowerShell` 中部署载荷。在 Windows 操作系统中，`PowerShell`
    比命令提示符更强大。它允许访问操作系统的不同区域。它由微软开发，旨在方便任务自动化和文件配置，从 Windows Vista 发布以来就一直随 Windows
    系统。`PowerShell` 攻击向量允许攻击者创建一个脚本，然后在受害者的 `PowerShell` 中执行。选择此选项将引出四个菜单选项：`PowerShell
    alphanumeric injector`、`PowerShell SAM database`、`PowerShell reverse` 和 `PowerShell
    bind shells`。其中任何一个选项都会创建一个针对性的 `PowerShell` 程序并导出到 `PowerShell` 文件夹。欺骗目标访问、下载并执行此程序即可为攻击者创建访问权限。


    到此时，你应该已经意识到 `SET` 在执行计算机辅助社交工程攻击方面是多么强大。这个工具对于渗透测试人员非常有价值，因为它提供了一种稳健且多样的方法来检查组织网络可能存在的各种漏洞。


    ## BeEF


    `BeEF` 代表 Browser Exploitation Framework（浏览器利用框架）。该工具包含在大多数基于安全性的 Linux 发行版中，如
    `Parrot OS` 和 `Kali Linux`。`BeEF` 最初是一个通过攻击者浏览器访问的服务器。它的创建是为了针对网络浏览器的漏洞，从而获取目标系统的命令执行权限。`BeEF`
    是由 `Wade Alcorn` 领导的团队在 `Rails` 平台上用 `Ruby` 语言编写的。如前，密码、cookie、登录凭据和浏览历史通常存储在浏览器中，因此对客户端进行
    `BeEF` 攻击可能非常糟糕。


    但在 `Kali Linux` 上，`BeEF` 已包含在发行版中。可以通过进入应用程序，点击利用工具，然后点击 `BeEF XSS framework`
    来启动 `BeEF` 框架。这将打开一个终端，显示 `BeEF` 框架服务器已启动。一旦服务器启动，我们打开喜欢的浏览器并访问端口 `3000` 的 `localhost`。在浏览器的
    URL 中显示为 `localhost:3000/ui/authentication` 或 `127.0.0.1:3000/ui/authentication`。这将进入
    `BeEF` 框架的身份验证页面，需要用户名和密码。默认情况下，用户名是 `beef`；密码也是 `beef`。

