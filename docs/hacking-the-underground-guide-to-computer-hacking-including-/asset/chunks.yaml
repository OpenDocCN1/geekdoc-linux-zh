- fmt: "\nBefore you can protect, you need to inspect. When you get all of these testing\
    \ tools prepared, that’s the time you need to get ready to test them on your wireless\
    \ network by performing numerous ethical hacks and attacks on your own network\
    \ system. By doing this, you are revealing to yourself the areas which are vulnerable\
    \ on your own network. The results you obtain in the process of attacking your\
    \ network will give you more insight into where your wireless network is vulnerable,\
    \ and the depth of the security loopholes that are likely or unlikely to be fixed.\
    \ Below are the countermeasures you can take to tackle the vulnerabilities you’ll\
    \ encounter in the course of your self-system attack.\n\n- Non-Technical Attack:\
    \ These are attacks used to exploit the weaknesses of a human being – lack of\
    \ awareness, being too trusting of strangers or being too careless.\n- Network\
    \ Attacks: These types of attacks can include the installation of rogue wireless\
    \ APs and dirty tricks that convince network clients to connect with such clients,\
    \ notwithstanding network server protocols like `SNMP`.\n- Software Attacks: Security\
    \ worries about `802.11` protocols don’t end because we should also be concerned\
    \ about the applications installed on wireless systems and the operating system.\
    \ They are also vulnerable to being attacked. Software attacks can involve:\n\
    \    1. Cracking the `WEP` keys of your wireless network encryption.\n    2. Gaining\
    \ access to your wireless network by playing around with your weak authentication\
    \ systems.\n    3. Attacking by breaking into your wireless network by using default\
    \ passwords (if your default settings aren’t changed) and also `SSIDs` which can\
    \ be easily obtained.\n\n# THE 10 COMMANDMENTS OF ETHICAL HACKING\n\nEvery process\
    \ has its own rules and commandments. The bible has rules for its believers to\
    \ follow. Below are the principles guiding the ethical hacking procedure.\n\n\
    ## 1. THOU SHALT SET THY GOALS .\n\nLet’s do some analysis. When Jack was a little\
    \ boy, he liked playing a game called Capture the Flag. He started this game at\
    \ camp; his camp counselors became interested in this game and they joined him.\
    \ Later, this game was improved. The counselors split the campers into two teams:\
    \ one with a green flag and another with a red flag. Every game had a rule which\
    \ the players had to follow: If you were on the green flag team, you and your\
    \ entire team would have to find the red flag, which was hidden by the red flag\
    \ team, and vice versa.\n\nAs simple as this game rule was, things could get a\
    \ bit messy. This was about a single-minded mindset: Capture the flag. This single-mindedness\
    \ is related to penetration testing, which means the security test with its defined\
    \ goal or aim can end only when the goal is achieved or when time runs out. Trying\
    \ to have access to another access point is similar to trying to find the flag\
    \ hidden by the opposing team. Your opponent knows you will do anything to access\
    \ the access point, so he or she will do all it takes to protect it because the\
    \ opponent knows you will circumvent the defences–you will try to “capture the\
    \ flag.”\n\nIs ethical hacking related to penetration testing? Ethical hacking\
    \ on its own is a penetration test which can be used as a marketing ploy but with\
    \ more systems, which means there is more than one goal to achieve.\n\nIf you\
    \ are on the green flag team and you want to locate the red flag hidden by the\
    \ other team, you need to reason like a flag keeper yourself. You would say, “Where\
    \ would I hide the flag if I were on the other team?” You have a goal to achieve\
    \ and this is why your evaluation of wireless network security should seek to\
    \ answer three logical questions:\n\n- What will the intruder do with the stolen\
    \ information?\n- What private information will the intruder be able to see on\
    \ the target’s network or access points?\n- Will users on the target’s base notice\
    \ the intruders’ attempt?\n\nYour own goal can be very simple in the sense that\
    \ you might choose to find an illegal wireless access point’s `AP`. You can also\
    \ decide to locate or obtain information from a wired network in your system.\
    \ Whatever you choose to do, the point is, you have to articulate your aims and\
    \ inform your sponsors about it.\n\n“Two heads are better than one.” Whatever\
    \ you do, you will require a good plan to be successful at it. At this point,\
    \ you must involve others in your plan and goal-setting process. If you don’t,\
    \ everything about your planning process might be difficult. Goals determine a\
    \ good plan. Quoting the Cheshire Cat’s reply to Alice concerning goals: “If you\
    \ don’t know wherever you are heading, any path can get you there.” Include investors\
    \ in the process of setting a goal, as they will build trust that will pay later\
    \ on in spades.\n\n## 2. THOU SHALT HAVE a PLAN .\n\nIn life, not everything goes\
    \ as planned. For instance, we don’t all have unlimited budgets; there is something\
    \ that always binds our plans with constraints. These limitations can be time,\
    \ money or personnel. The idea here is that you need to plan for your tests.\n\
    \nA good plan will lead to a good result. Thus, the following are essential:\n\
    \n- Know what you want to test and identify the networks.\n- Evaluate the testing\
    \ period.\n- Evaluate the testing methodology.\n- Implement a good plan and share\
    \ it with stakeholders.\n- Wait to obtain your plan’s approval.\n\nDon’t worry\
    \ about the fact that people will believe you want to hack a wireless network;\
    \ share and publicize your plan. If the organization you work for is like most\
    \ other organizations, it is very unlikely it can oppose the organizational inertia\
    \ to do anything to obstruct your efforts. Most importantly, do not forget that\
    \ you are not evaluating your “testing process” under ordinary conditions.\n\n\
    ## 3. THOU SHALT GET PERMISSION .\n\nDon’t forget you are performing an ethical\
    \ hacking. If you do not obtain proper permissions, there is a chance that you\
    \ will land yourself in prison. Recall the case of an internal auditor who was\
    \ caught red-handed cashing a payroll check that he didn’t earn. When he was questioned,\
    \ he replied: “I wasn’t stealing, I was only checking out the controls of the\
    \ system.” He could have obtained permission to check the system’s vulnerabilities\
    \ before suggesting a solution to the organization, but he didn’t, and that act\
    \ landed him in prison. In ethical hacking, do not go by the old saying that says,\
    \ “Seeking forgiveness is easier than asking for permission.” If you do not ask\
    \ for permission, you will surely land in prison.\n\nRemember that this permission\
    \ can be the only thing standing between you and the black-and-white striped uniform.\
    \ Seek and obtain a get-out-of-jail-free card. This card will serve as evidence\
    \ that your test on the network is authorized and that you are performing your\
    \ operation according to plan. The ticket will say that your organization will\
    \ stand behind you if you are charged with a criminal offense or sued for your\
    \ actions. As long as you stick to the plan you created with your organization,\
    \ your card will provide you with organizational and legal support if something\
    \ goes wrong.\n\n## 4. THOU SHALT OPERATE ETHICALLY .\n\nEthical hacking is the\
    \ same thing as white hat hacking because the intentions and conscience of the\
    \ hacker are always good. This commandment is telling you that you have to work\
    \ according to the plan you provided and that was approved. Avoid taking actions\
    \ that were not authorized or that are outside your plan. Being an ethical hacker\
    \ defines the goodness in you, so work ethically.\n\nIn the process of your operation,\
    \ every bit of information you uncover must be confidential and not disclosed\
    \ to a third party.\n"
  raw: 'Before you can protect, you need to inspect. When you get all of these testing
    tools prepared, that’s the time you need to get ready to test them on your wireless
    network by performing numerous ethical hacks and attacks on your own network system.
    By doing this, you are revealing to yourself the areas which are vulnerable on
    your own network. The results you obtain in the process of attacking your network
    will give you more insight into where your wireless network is vulnerable, and
    the depth of the security loopholes that are likely or unlikely to be fixed. Below
    are the countermeasures you can take to tackle the vulnerabilities you’ll encounter
    in the course of your self-system attack.


    *   Non-Technical Attack: These are attacks used to exploit the weaknesses of
    a human being – lack of awareness, being too trusting of strangers or being too
    careless.


    *   Network Attacks: These types of attacks can include the installation of rogue
    wireless APs and dirty tricks that convince network clients to connect with such
    clients, notwithstanding network server protocols like SNMP.


    *   Software Attacks: Security worries about 802.11 protocols don’t end because
    we should also be concerned about the applications installed on wireless systems
    and the operating system. They are also vulnerable to being attacked. Software
    attacks can involve:


    1.  Cracking the WEP keys of your wireless network encryption.


    2.  Gaining access to your wireless network by playing around with your weak authentication
    systems.


    3.  Attacking by breaking into your wireless network by using default passwords
    (if your default settings aren’t changed) and also SSIDs which can be easily obtained.


    ## THE 10 COMMANDMENTS OF ETHICAL HACKING


    Every process has its own rules and commandments. The bible has rules for its
    believers to follow. Below are the principles guiding the ethical hacking procedure.


    1.  THOU SHALT SET THY GOALS .


    Let’s do some analysis. When Jack was a little boy, he liked playing a game called
    Capture the Flag. He started this game at camp; his camp counselors became interested
    in this game and they joined him. Later, this game was improved. The counselors
    split the campers into two teams: one with a green flag and another with a red
    flag. Every game had a rule which the players had to follow: If you were on the
    green flag team, you and your entire team would have to find the red flag, which
    was hidden by the red flag team, and vice versa.


    As simple as this game rule was, things could get a bit messy. This was about
    a single-minded mindset: Capture the flag. This single-mindedness is related to
    penetration testing, which means the security test with its defined goal or aim
    can end only when the goal is achieved or when time runs out. Trying to have access
    to another access point is similar to trying to find the flag hidden by the opposing
    team. Your opponent knows you will do anything to access the access point, so
    he or she will do all it takes to protect it because the opponent knows you will
    circumvent the defences–you will try to “capture the flag.”


    Is ethical hacking related to penetration testing? Ethical hacking on its own
    is a penetration test which can be used as a marketing ploy but with more systems,
    which means there is more than one goal to achieve.


    If you are on the green flag team and you want to locate the red flag hidden by
    the other team, you need to reason like a flag keeper yourself. You would say,
    “Where would I hide the flag if I were on the other team?” You have a goal to
    achieve and this is why your evaluation of wireless network security should seek
    to answer three logical questions:


    *   What will the intruder do with the stolen information?


    *   What private information will the intruder be able to see on the target’s
    network or access points?


    *   Will users on the target’s base notice the intruders’ attempt?


    Your own goal can be very simple in the sense that you might choose to find an
    illegal wireless access point’s AP. You can also decide to locate or obtain information
    from a wired network in your system. Whatever you choose to do, the point is,
    you have to articulate your aims and inform your sponsors about it.


    “Two heads are better than one.” Whatever you do, you will require a good plan
    to be successful at it. At this point, you must involve others in your plan and
    goal-setting process. If you don’t, everything about your planning process might
    be difficult. Goals determine a good plan. Quoting the Cheshire Cat’s reply to
    Alice concerning goals: “If you don’t know wherever you are heading, any path
    can get you there.” Include investors in the process of setting a goal, as they
    will build trust that will pay later on in spades.


    2.  THOU SHALT HAVE A PLAN .


    In life, not everything goes as planned. For instance, we don’t all have unlimited
    budgets; there is something that always binds our plans with constraints. These
    limitations can be time, money or personnel. The idea here is that you need to
    plan for your tests.


    A good plan will lead to a good result. Thus, the following are essential:


    *   Know what you want to test and identify the networks.


    *   Evaluate the testing period.


    *   Evaluate the testing methodology.


    *   Implement a good plan and share it with stakeholders.


    *   Wait to obtain your plan’s approval.


    Don’t worry about the fact that people will believe you want to hack a wireless
    network; share and publicize your plan. If the organization you work for is like
    most other organizations, it is very unlikely it can oppose the organizational
    inertia to do anything to obstruct your efforts. Most importantly, do not forget
    that you are not evaluating your “testing process” under ordinary conditions.


    3.  THOU SHALT GET PERMISSION .


    Don’t forget you are performing an ethical hacking. If you do not obtain proper
    permissions, there is a chance that you will land yourself in prison. Recall the
    case of an internal auditor who was caught red-handed cashing a payroll check
    that he didn’t earn. When he was questioned, he replied: “I wasn’t stealing, I
    was only checking out the controls of the system.” He could have obtained permission
    to check the system’s vulnerabilities before suggesting a solution to the organization,
    but he didn’t, and that act landed him in prison. In ethical hacking, do not go
    by the old saying that says, “Seeking forgiveness is easier than asking for permission.”
    If you do not ask for permission, you will surely land in prison.


    Remember that this permission can be the only thing standing between you and the
    black-and-white striped uniform. Seek and obtain a get-out-of-jail-free card.
    This card will serve as evidence that your test on the network is authorized and
    that you are performing your operation according to plan. The ticket will say
    that your organization will stand behind you if you are charged with a criminal
    offense or sued for your actions. As long as you stick to the plan you created
    with your organization, your card will provide you with organizational and legal
    support if something goes wrong.


    4.  THOU SHALT OPERATE ETHICALLY .


    Ethical hacking is the same thing as white hat hacking because the intentions
    and conscience of the hacker are always good. This commandment is telling you
    that you have to work according to the plan you provided and that was approved.
    Avoid taking actions that were not authorized or that are outside your plan. Being
    an ethical hacker defines the goodness in you, so work ethically.


    In the process of your operation, every bit of information you uncover must be
    confidential and not disclosed to a third party.'
