    ## PROFILING THE WEB SERVER


    One of the first steps to take when targeting a company is to put together extensive
    information from companies without them finding out. The sources of this information
    are usually internet-based sources. These include the `CNN` news website, domain
    name databases (`DNS`), `EDGAR` databases and search engines. You can learn more
    about the company’s security measures by following three steps:


    1. Foot printing: This step collects information and makes a specific profile
    of the company’s security position. Foot printing uses simple tools to collect
    data such as administrative and billing information, which includes employee names,
    emails, addresses and locations. All of this data is easily accessible from the
    internet.


    2. Scanning: During the scanning process, systems that are available and reachable
    via the internet are detected through port scanning, ping sweeps and operating
    system identification. The information extracted here involves system architecture
    and specific `IP` addresses.


    3. Enumeration: This step simply extracts valid accounts from a system using operating-system-specific
    techniques like routing tables, system banners, user and group names, and `SNMP`
    information.


    When this is done, the information is passive and no company can detect who is
    gathering information about it even if they have `IDS` (Intrusion Detection Software)
    installed.


    In the process of conducting a penetration test, you must gather information,
    have a detailed map of the target network and conduct a complete assessment. You
    must also be able to identify each respective system within a network. Information
    gathering is of two types: passive information gathering and active information
    gathering.


    ## PASSIVE AND ACTIVE INFORMATION GATHERING


    We can define passive information gathering as the gathering of information via
    media that would be hard to trace back to the finder’s `IP` address. It’s also
    called open-source intelligence and works by finding internet-based information.
    You have access to valuable information that is useful for passive information
    gathering. It can be used to build maps, understand organizational structures,
    and assess employees and their relationships with other companies. The information
    can be found on databases mentioned earlier, like the `EDGAR` database or archived
    company information. Since this information is publicly accessible, it’s not illegal
    or unethical to store it. Most databases provide you with tools and resources
    for accessing this information easily. The homepage of a company is a valuable
    resource and can be used to reveal sensitive information. The information can
    be obtained without the company’s detection or direct connection. Valuable information
    like the location of the company, network and system, as well as ownership information,
    is gathered during passive information gathering. When passive information is
    being gathered, it is important to collect archived information about systems
    that are located in the target’s network. Different searches are made and the
    list of searched information includes:


    * The target web presence (note: this is not referring only to web pages)

    * Search engine information related to the target

    * Web groups containing employee or company data

    * Personal websites of employees

    * Security and exchange data and any additional financial information regarding
    the target

    * Up-time statistics sites

    * Job postings submitted by the target

    * Archival sites for additional information

    * News groups

    * The domain registrar

    * Whether the target provides reverse Domain Name System (`DNS`) information through
    a third-party service


    Active information gathering is the opposite of passive information gathering.
    Here you gather information by connecting to the target (company). The company
    is very much aware of your intentions as you gather information with the intention
    of better understanding the structures and systems that are in place. Active information
    gathering is not more useful than passive information gathering because there
    could be a leak in the information that is stored. This could be helpful during
    penetration testing, which makes active information gathering similar to passive
    information gathering. This is especially the case when the information is related
    to the network, as it is not easy to find private information about public archives
    in the first place.


    ## INVERSE MAPPING


    This is a technique that collects information about hosts that are hard to reach
    using ideas and assumptions to find missing links. Inverse mapping uses `RESET`
    scans and obtains information from routers, which provide the internal architecture
    information of the network. Routers scan for `IP` addresses and make their decisions
    based on what is scanned. They provide feedback about addresses that are unreachable.
    Routers can be investigated for the `IP` lists, and the outcome is used to map
    the targeted network’s `IP`.


    Domain Query Answers are sent from the probing computer, which then answers domain
    questions as a means of extracting the `ICMP` unreachable messages for a host
    that doesn’t exist.


    ## PORT SCANNING


    A port scan is done with two objectives in mind:


    1. To verify the existence of the target systems and to see which of these systems
    is alive.

    2. To obtain lists of communication channels that can accept connections.


    There are four types of port scanning:


    1. Stealth scan


    This is a scanning technique that allows you to pass through filtering rules and
    avoid network traffic. The most popular stealth scan techniques are explicit and
    are carried out through `XMAS` scans, `NULL` scans, `SYN/ACK` scans and `FIN`
    scans.


    An `XMAS` scan, also called the Christmas tree scan, sends `TCP` packets with
    `FIN`, `ACK`, `PST` and `RST` flag sets. The `NULL` scan uses a `TCP` packet to
    turn off all flags as it probes the system to send back a `RESET` to all of the
    closed ports. `NULL` scanning works against most `TCP` implementations, no matter
    what operating system it runs on. The `SYN/ACK` is the first step in a three-way
    `TCP` handshake. The `TCP` identifies the packet as a mistake and sends a `RESET`
    to break up connections, which is exactly the right response to detect the existence
    of a closed port. This is because a `SYN/ACK` stealth scan ignores the packet
    if it was from an open port. The `FIN` scan uses the `FIN` packet to probe the
    system of a target port and then waits for its response.


    2. TCP connect scan

