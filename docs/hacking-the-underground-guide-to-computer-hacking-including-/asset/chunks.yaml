    跨站请求伪造（CSRF）不像 XSS 攻击。在 XSS 攻击中，黑客利用用户对该网站的信任，使用户接受通过该网站接收到的指令。然而，在 CSRF 攻击中，黑客利用的是用户对网站或
    Web 应用的信任。一旦用户在网站或 Web 应用上通过身份验证，网站或 Web 应用就会相信并执行用户给它的任何命令。不在每次请求时对用户进行重新身份验证的
    Web 应用很容易受到 CSRF 攻击。攻击者诱导用户点击一个在浏览器中运行代码的链接。该代码允许攻击客劫持用户在 Web 应用或网站上的会话，并代表该用户执行操作。例如，一个在银行应用上通过身份验证的用户可能会收到一个包含脚本的链接，该脚本会劫持其会话并将资金从其账户转入黑客的账户。这种攻击不仅限于欺诈性转账，还可以用于在线购物、更改电子邮件地址和在线投票。


    缓解此类攻击的良好方法是使用重新身份验证或验证码系统，在执行用户提出的每个请求之前进行检查。


    ## 5. 文件包含漏洞


    文件包含攻击以两种不同的方式发生：远程文件包含（RFI）和本地文件包含（LFI）。正如你可能猜到的那样，文件包含攻击是由用户输入验证不足或不当引起的。在这种攻击类型中，具有恶意的用户可以通过调用服务器上的脚本（本地文件包含）或远程服务器上的脚本（远程文件包含）在服务器上执行命令。这种漏洞主要发生在
    PHP 编写的程序中。PHP 使用 `include` 关键字来引用单独编写但需要在当前程序中实现的代码。例如，可能会编写一段代码为页面提供导航；程序员可能需要将此代码包含在每个页面中，以便用户能够轻松地导航网站。程序员通过使用
    PHP 中存在的 `include` 功能来实现这一点。该功能对于代码复用性至关重要，因为它消除了编写新代码的需求，从而节省了开发过程中的时间。


    当恶意黑客发现用户输入会导致应用访问脚本时，就可以进行远程文件包含攻击。当请求通过 HTTP 发送时，攻击者可以编辑地址以包含远程服务器上的脚本。因此，当该网站加载时，它会执行从该远程服务器检索的脚本。本地文件包含攻击的原理本质相同，只是它访问的是与应用位于同一
    Web 服务器上的脚本。


    文件包含攻击可能是致命的。它们可以被用于劫持用户的会话；能够窃取客户端浏览器中的 Cookie 和令牌（tokens）。它们还可以用于窃取数据，在 Web
    应用的情况下甚至可以控制整个应用程序。


    然而，这种网站或 Web 应用攻击可以通过采取一些关键步骤来妥善处理。网站或 Web 应用应该通过 `include` 功能限制调用脚本的用户输入能力。如果无法消除这一点，则应对根据允许的用户字符数量对输入进行适当的验证和限制。应用或网站应该拒绝特殊字符或不需要的字符。避免文件包含攻击的最佳方法是确保用户输入一旦输入经过适当验证。


    ## 6. 基于会话的缺陷


    会话（Session）是用户与网站或 Web 应用交互花费的时间。每当用户使用登录详情登录站点时，服务器会验证用户身份并为其提供一个会话令牌（session
    token）。会话令牌非常重要，因为它可以防止用户在与网站或 Web 应用交互期间发送每次请求时都必须登录。此令牌通常是一个随机的长数字，作为与 Web 服务器的自动重新身份验证。这本质上意味着当会在话开始你登录网站时，令牌就像你的登录凭据，它应该受到严格保护。如果攻击者获得了你的令牌，他或她就可以轻松地在与该
    Web 应用或网站的交互中伪装你。


    令牌通过网站的 URL、Cookie 甚至隐藏的表单字段从服务器传递到浏览器。黑客可以使用各种方法窃取这些令牌。一些比较流行的方法是：


    -   **中间人攻击**：这主要在使用安全套接层（`SSL`）保护的网站上进行。对于用户来说，黑客伪装成服务器；对于服务器来说，黑客伪装成合法用户。这允许黑客获取从用户发送到服务器的信息，以及从服务器返回给用户的数据。

    -   **数据包或数据嗅探**：这是黑客在通信通道上嗅探发送的数据包以信息。这主要发生在未使用安全套接层（`SSL`）的通信中。

    -   **暴力破解**：某些网站以特定的、定义的格式创建令牌，甚至重用令牌。如果黑客可以获得足够的令牌进行分析，并使用具有卓越计算能力的机器，他或她就可以暴力破解令牌，并生成可以在访问网站时使用的合法令牌。

    -   **使用 XSS 攻击窃取令牌**：由于我们已经讨论了一点 XSS 攻击，我相信你对这里发生了什么有了了解。攻击者等待用户登录 Web 应用，服务器发送令牌，令牌随后被保存在浏览器中。接下来，黑客执行跨站脚本攻击并诱骗用户在其浏览器上执行它。执行的脚本通常是窃取令牌的脚本，它会将令牌发送到远程服务器。黑客随后可以使用此令牌与网站或
    Web 应用进行交互。

    -   **会话固定攻击（Session fixation attack）**：这种攻击对于在 URL 中发送令牌的网站非常常见。黑客访问网站或 Web 应用，登录并获得一个令牌。黑客随后构造一个带有其收到的令牌的
    URL，并将链接发送给目标用户。用户被诱导使用该链接访问网站，并使用该令牌登录。然而，一旦用户登录，他或她就不会获得新令牌，因为他或她正在使用现有的令牌。一旦黑客确认用户已使用该会话
    ID 登录，黑客执行同样的操作并劫持用户的会话。所以，本质上，黑客获取一个令牌，将其固定在 URL 上，并说服用户使用它登录。


    为了防止基于会话的攻击，我们需要确保我们的网站或 Web 应用不会受到跨站脚本攻击（XSS）的影响，这将使得运行窃取令牌的脚本变得容易。你应该确保令牌和会话得到妥善管理。此外，强烈不建议通过
    URL 发送令牌。你还应该拒绝所有用户提供的令牌，因为生成令牌的任务应该交给服务器。

