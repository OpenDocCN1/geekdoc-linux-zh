    正如我们在前面的章节中讨论过的样，黑客行为是一项大犯罪。本节中解释或教授的任何仅用于开发、教育和研究目的。我们将考虑入侵 `Android` 设备，但在那之前我们需要问一些问题。为什么要入侵
    `Android` 设备？目的是什么？大量的人拥有 `Android` 设备。


    与软件开发类似，黑客攻击是困难的，你无法一夜之间成为专业黑客。黑客攻击需要高超的技巧和推理水平。作为一个黑客，你的大脑必须像处理单元一样运行。为了在一个平台上练习黑客攻击，你需要对各种编程语言之一有一定的经验。在黑客攻击方面，了解
    `C++`、`Linux` 和 `FORTRAN` 等编程语言非常有用。然而，你还需要其他知识来成为一名熟练的黑客。随着安全措施的升级，黑客攻击变得越来越困难。作为一个黑客，你必须学会理解并击败安全挑战。


    ## KALI LINUX 2.0 的特性


    如果你是渗透服务器和破解网络的专家，开展业务最简单的方法就是利用 `Kali Linux 2.0` 的力量。`Kali Linux 2.0` 是让程序员进行黑客变得非常容易的最佳
    `Linux` 发行版。你可以在短时间内实现目标并成为你个人网络的所有者。


    `Kali Linux` 最重要的特性如下：


    ### 1. Metasploit


    `Metasploit` 是一个帮助创建漏洞利用、壳代码、触发器、蜜罐和负载的框架。`Metasploit` 是封装在其框架中的若干个漏洞和类似元素的库。该软件是公开的，可以在许多操作系统上使用，包括
    `Linux` 和 `Windows`。它随 `Kali Linux` 默认。`Metasploit` 是一个威胁其他网络的危险设备。你想检查网络安全中的漏洞并学习如何管理它们以防止外部攻击。


    Web 应用和服务器也会受到 `Metasploit` 的攻击。在 `Metasploit` 中，`GUI` 和命令行界面同样存在。`Metasploit`
    提供免费版本，但也有付费版本（`Metasploit Pro`），它提供了更多功能。


    ### 2. NMAP


    `NMAP` 是“network mapper”（网络映射器）的缩写。它在扫描网络的同时搜索可访问端口以映射网络服务器等。`NMAP` 的核心功能是安全分析和对网络进行检查以检测在线的计算机。`NMAP`
    使用 `IP` 地址和数据包的方式揭示了关于网络的有用细节。例如，它显示了可以访问网络的端口以及计算机上正在使用的应用程序。建议在进一步进入 `GUI` 之前先对命令有一些了解。


    ### 3. Armitage


    `Armitage` 是一种用于网络安全的显示控制工具，它为 `Metasploit` 插件创建一个接口，简化了 `Metasploit`，使其不那么复杂更容易理解。如果你想学习更多关于
    `Metasploit` 的知识，`Armitage` 是很好的起点。`Metasploit` 的所有功能在破解过程中都由 `Armitage` 收集，因为它们的目的是利用、绕过和突袭网络。


    ### 4. Jhon the Ripper


    `JTC` 是“Jhon the Ripper”的缩写。它是一个破解受密码严密保护区域的著名工具。在黑客世界中被简称为 `Jhon`，它是启动所谓的字典入侵的主要工具。`Jhon
    the Ripper` 有一个名为“单词列表”的文本库，由以前破解的密码组成。`Jhon the Ripper` 从其库中选择其中一个密码，并替换待破解密码的
    `wordlist`。然后它给出新输入密码的结果。换句话说，黑客取一个以前破解的密码，并干预系统，使得这个以前破解的密码替换掉待破解的密码。之后，`Jhon`
    重新启动过去的成功，并对替换的密码进行重新破解。`Jhon the Ripper` 与类似的破解工具 `THC Hydra` 之间有相似之处。细微的区别在于，`Jhon`
    用于离线破解，而 `Hydra` 用于在线破解。


    ### 5. Wireshark


    `Wireshark` 是一个开源工具，通过网络流量概述来监视网络。该工具属于网络嗅探器一类。


    `Ethereal` 是 `Wireshark` 的旧名。它的核心功能是监控用于网络流量的差异，并调查往返的数据包。在完成这一切之后，结果将以可以理解的格式呈现给用户。随着时间的推移，已经取得了明显的进展。例如，创建了过滤器以及颜色编码等各种数据包处理功能。所有开发在某种方面提供了帮助，特别是增强了测试人员的渗透能力。这些测试人员能够进一步渗透到网络并彻底检查数据包。


    如果你真的想成为网络分析、网络渗透大师并获得其他黑客技能，你必须拥有关于 `Wireshark` 的经验和知识。


