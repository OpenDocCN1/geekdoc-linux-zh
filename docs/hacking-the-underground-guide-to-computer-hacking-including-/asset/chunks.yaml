    ## BASIC PORT SCANNING TECHNIQUES YOU NEED TO KNOW


    Port scanning is a procedure that aims to analyze the open ports of a computer
    system with the help of special tools. To carry out this scanning, it is not necessary
    to register on the target system as you must only be connected to it through a
    local network. With the help of port scanners, special data packets are sent to
    the different ports and the corresponding error messages or messages are analyzed
    and evaluated by the tool. Regardless of the functionality of the port scanning
    program being used, information can be obtained not only about which ports are
    open or closed, but also about the operating system that is being used by the
    target computer. Furthermore, port scanning can also tell you about the services
    or applications that are using the corresponding ports.


    Port scanning is a very efficient way for system administrators to control data
    traffic in networks and to filter out their potential weaknesses. In some cases,
    specific network problems can also be solved. Because the tools do not have a
    significant influence on the performance capacity of the systems being examined,
    they can be used without hesitation for such security measures. In a domestic
    atmosphere, the ports are automatically opened, provided that the firewall does
    not prevent them. Port scanning helps maintain an overview and shows ports that
    are no longer needed. These ports can then be closed to minimize risks that may
    affect security.


    ### How exactly does port scanning work?


    There are many different methods that are used to scan ports, most of which revolve
    around the `TCP` connection protocol. To understand the basic processes that occur
    in port scanning, it is important to understand how a `TCP` protocol connection
    is established.


    1. Within the framework of a process called the three-way handshake, the client
    first sends a `SYN` (synchronize) packet to the corresponding destination port.

    2. If it reaches an application, it receives a `SYN / ACK` packet (synchronize
    acknowledge = "confirm synchronization") that confirms the connection.

    3. The client responds in the third and final step with an `ACK` (acknowledge
    = "confirm") package, after which the connection is established and data exchange
    is initiated.

    4. If the contact is established with a closed port, the client receives a packet
    with the flag `RST` (reset = "reset") in response. Thus, negotiation is interrupted.


    Since data exchange with the various applications would be very costly and very
    complex, the port scanner is limited to a simple connection attempt, as shown
    by the scanning methods that are mentioned below.


    #### TCP SYN


    In the case of `TCP SYN`, it is possible to speak of an average open scanning,
    since it does not aim to establish a complete `TCP` connection. In this mode,
    typical `SYN` packets can be sent to each of the ports with the port scanner,
    after which a response from the destination host is expected. If the host responds
    with a `SYN / ACK` packet, the corresponding port becomes open and the connection
    can be established. If the response consists of an `RST` packet, the port remains
    closed. If the destination host has not yet sent a response, a packet filter such
    as a firewall has interfered in the process. `TCP SYN` scans are not visible to
    the reviewed applications and therefore do not generate log data. Hence, they
    are also “stealth scans.”


    #### TCP Connect


    If you are using your port scanner to carry out a connect-type process, you are
    not generating or sending the data packets, but you are calling the `connect`
    system instead. This “calling” is available on almost all operating systems. Also,
    the web browser uses calling to establish a connection to a server. This scanning
    tool is not involved in establishing the connection, but is the operating system
    for the person in charge of it. The person can either (1) create a successful
    connection and confirm that the port is open, or (2) fail in the attempt and indicate
    that the corresponding port is closed. If the connection is established completely,
    it is easy to see (in the log files of applications with open ports) whether this
    polling method was used. However, if you lack the rights to send raw data packets,
    the `TCP connect` method can be a useful alternative to `SYN` scanning.


    #### TCP FIN, Xmas and Null

