    Helpful Tip: It may not be effortless and straightforward to scan your network
    from the outside, i.e., from the public internet. However, here is what you can
    do. Try to get any available public IP address that you can assign to your computer
    for testing. Then, plug in on the “public” side of your router or firewall that
    is connected openly to the internet.


    Additionally, not all of the methods mentioned above will be able to decipher
    the exact live systems that are wired and the ones which are wireless. You are
    the one who will determine the IP addresses, IP networks and hostnames belonging
    to your network or devices. Now that you can map your network successfully and
    are able to determine the systems that are live and active on your network, the
    next thing to know is how to scan your wireless network or systems for more information,
    such as hostnames, open ports and much more.


    ## METHODOLOGY 3: SCANNING YOUR SYSTEMS


    By now, your understanding of the wireless network will be broader than what you
    had before you read this book. You now know more about IP addresses and `SSIDs`.
    You can learn more about these two terms through a process called `enumeration`.
    The term `enumeration` can be explained as a form of analyzing everything about
    your network or system. You create a list of all the details you encountered or
    discovered in the process, including how they work and what they do. With `enumeration`,
    you can find:


    * RF signal strength

    * Whether ports are open and active on wireless APs and clients

    * Whether or not `WEP` encryption is enabled

    * Live wireless hosts


    The `Network Stumbler` network mapping tool mentioned earlier is not only capable
    of finding live wireless hosts (ad-Hoc clients and APs), it is also designed in
    such a way that it has the ability to grab more in-depth information regarding
    Radio Frequency strength and whether or not `WEP` encryption is enabled. Don’t
    be surprised if you are told that this `Network Stumbler` tool is also perfect
    for `enumeration`.


    Port scanners such as `SuperScan` or `nmap` are also very good for prodding a
    network when you are looking to find the network ports that are open on your wireless
    clients and APs. You can get a more details when you use these tools. You can
    get access to `SuperScan` at: [www.foundstone.com/resources/proddesc/superscan.htm](http://www.foundstone.com/resources/proddesc/superscan.htm)


    Some developers add a few restrictions to their software, so make sure you check
    your software licenses, regardless of whether you are using free software. This
    is to make sure you are abiding by their rules. Much of the software available
    for free on the internet has a license that says the software cannot be used for
    commercial purposes. Moreover, if you are using tools with such licenses, you
    can use them for your personal internal testing; that is still okay. However,
    if you are testing wireless networks for paying clients, this is like a Bermuda
    Triangle you are crossing because you are already going against the license limitation.


    Scanning your ports is apparently not just about waiting to get a scan result
    after the tool has done the scanning. It actually helps you create an even more
    detailed picture of what is available on your wireless network. It’s no wonder
    that hackers love this. When your ports are scanned, the hackers are given a lot
    of sensitive information they need to exploit your potential network or system’s
    vulnerabilities. Below is a table of the ports that are vulnerable to attack when
    opened:


    | Port Numbers | Service Protocols |

    | :--- | :--- |

    | 20 | FTP data TCP |

    | 21 | FTP control TCP |

    | 22 | SSH TCP |

    | 23 | Telnet TCP |

    | 25 | Simple Mail Transfer Protocol (SMTP) TCP |

    | 53 | Domain Name Office (DNS) UDP |

    | 80 | Hypertext Transfer Protocol (HTTP) TCP |

    | 110 | Post Office Protocol Version 3 (POP3) TCP |

    | 135 | RCP/DCE end point mapper for Microsoft networks UDP, TCP |

    | 137, 138, 139 | NetBIOS over TCP/IP UDP, TCP |

    | 161 | Simple Network Management Protocol (SNMP) UDP, TCP |

    | 443 | HTTPS (HTTP over SSL) TCP |

    | 512, 513, 514 | Berkeley r commands (e.g., rsh, rlogin and rexec) TCP |

    | 1433 | Microsoft SQL server UDP, TCP |

    | 1434 | Microsoft SQL monitor UDP, TCP |

    | 3389 | Windows terminal server TCP |


    ## METHODOLOGY 4: DETERMINE THE SERVICES THAT ARE RUNNING


    You need to be more careful when you are scanning your system’s or network’s ports
    because, during the process, there is a possibility that your system’s details
    will be snagged. Remember that knowledge is power. The knowledge can be used to
    help you or harm you. However, if you as a person are capable of determining the
    open ports of your wireless network, somebody who isn’t you is capable of determining
    those open ports as well. Connecting to the open ports you have available can
    give you more insight into enumeration information like:


    * The software and its firmware version (it will be returned as an error or banner
    message)

    * Acceptable usage policy warnings on banner pages

    * Acceptable usage login warnings

    * The configurations of your OS and applications

    * Your OS versions (it will be returned as an error or banner message)


    During the process of connecting to your open ports, there is a probability that
    you will discover some vulnerabilities or a ton of exploitable information about
    your APs, servers and workstations. Do not be afraid at this point because most
    of your wireless system is likely not public facing, so the possibility that your
    wireless devices have public IP addresses is very low. On the other hand, you
    need some wireless-based servers or wireless hotspots you must enable to be publicly
    accessible. These systems are usually and easily reachable by an attacker because
    even your firewalls and other protective measures might not stop them. When an
    attacker has access to it, obtaining your configuration details will be very easy.
    The accessibility will also cause some unavoidable vulnerability, which is a necessary
    evil if you want your network to do actual, useful work.


    Nevertheless, all information obtained can be used against you. Keep in mind that
    “Eternal Vigilance is the price of productivity.” This will lead us to perform
    an actual vulnerability test through which you can discover the true vulnerabilities
    in your network. Although the result of the test can be a false positive, the
    issues it produces won’t matter.


    ## METHODOLOGY 5: FIND AND LOCATE SPECIFIC VULNERABILITIES


    Now you’ve found potential windows into your wireless network. Now is the time
    to find out whether there are any significant vulnerabilities you should be mindful
    of. Try to see what your hacker might see. How is this done? You will have to
    connect to your wireless systems and make a systematic, discreet attempt to see
    what you can find from a hacker’s point of view. When you perform this process,
    you are likely to locate and gather more crucial information and also capture
    data out of thin air using a sniffer tool. You may even determine whether a specific
    patch is missing on your network.


    Anything found must be counted. Do not discount what you have found because you
    are just getting to the formal “Vulnerability Assessment” portion of your testing.
    Regardless of whether or not you are going deeper or prodding your wireless network
    further, the information you already discovered may contain some juicy vulnerabilities
    like `WEP` not being enabled and default `SSIDs`. Furthermore, some critical servers
    are accessible through a wireless network. These vulnerabilities can be looked
    at in two ways: manually or automatically.


    ### MANUAL ASSESSMENT

    '
