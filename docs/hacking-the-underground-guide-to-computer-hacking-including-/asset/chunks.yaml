- fmt: '

    This is an upgrade to the previous WPA, as indicated by the “2” at the end of
    “WPA2”. However, regardless of the upgrade of certain tools, some things will
    always remain the same. For example, if you are using an old version of “WhatsApp,”
    the new version won’t stop sending messages to people on your contact list. WPA2
    is still based on a `RC4` algorithm, which is a stream cipher. On the other hand,
    the major component of RSN is the use of `AES` (Advanced Encryption Standard)
    encryption for both its data integrity and confidentiality. With the boost of
    the technology market on a daily basis, you can find products named `AES WRAP`
    (Wireless Robust Authenticated Protocol). However, the final specification of
    this `AES WRAP` requires the `AES-CCMP` algorithm, which stands for Counter Mode
    Cipher Block Chaining MAC Protocol.


    As specified in the `802.11i` standard, WPA2 helps you enhance message integrity
    and also protects message privacy. Furthermore, it prevents replays and repudiation.


    The `802.11i` specification offers you `AES`-based cryptographic services at the
    data level. This offering validates them according to the `FIPS 140-2` (Federal
    Standard). This is because the advanced encryption standard is capable of mitigating
    most of the concerns you may have about active wireless attacks or wireless eavesdropping.
    If you have a wireless protocol present at the data link level, it will protect
    only the wireless subnetwork, not the entire network. There are some cases in
    which high-level protection could be needed. For example, you may have traffic
    traversing other network segments such as local or wide area networks, the internet
    and wired segments. There might be a need to consider additional security here.
    When we talk about additional security, we are talking about implementing higher
    level, `FIPS`-validated, end-to-end (`E2E`) cryptographic protection.


    If you use the WhatsApp messenger on your smartphone, you should have noticed
    the new form of encryption, which is now end to end. This also makes it impossible
    for the developers of the app to spy on their users’ transmitted messages. The
    `AES`-based solution provides a highly robust security stance for the future.
    The only issue with this encryption is that it requires new custom hardware and
    protocol changes. Many organizations, including yours, could have difficulties
    implementing the use of `AES` because it will require you to build a `PKI` (Public
    Key Infrastructure). However, this is not a practical solution for many organizations
    because it is expensive.


    There seems to be no cracking tool for `AES-CCMP`. This is brilliant because we
    now have security that is totally impenetrable. However, this can be justified
    only with time because there are many crackers out there who are working to break
    it down. It is possible that a tool to crack it already exists. Therefore, you
    need to remain vigilant and stay up on your game.


    ## USING A VPN


    Ever seen people in the United States browsing your network as a citizen of the
    United Kingdom? `VPN` makes this fun play possible. Your organization can supplement
    the previously mentioned controls with a `VPN` (Virtual Private Network). This
    is a network that is created when public wires are connected to private nodes.
    You can think of `VPN` as a secure tunnel that is built within the internet. A
    `VPN`’s “wall” is made of high-level encryption measures. Moreover, a `VPN` is
    attractive because it requires less investment in hardware. In general, whenever
    you are connected to the internet in a public space, your information can be accessed
    by others easily. Trying to access your Facebook account while you are sipping
    juice outside the park is dangerous if you do not use a `VPN`. This is because
    the person sitting next to you or even a bit farther away in the park can decrypt
    or intercept your work with the use of the tools we mentioned in this chapter.
    In general, you need to install and use `VPN` technology to protect yourself from
    malicious hackers whenever you use a public wireless network.


    There are three types of `VPN`:


    *   `Remote Access VPN`: This is the most common type of `VPN`. It gained its
    popularity from the capability it gives a remote user to securely access internal
    applications (for instance, e-mail).

    *   `Extranet VPN`: This type of `VPN` allows one organization to securely access
    another organization without being detected.

    *   `Intranet VPN`: In this type of `VPN`, the data transmitted in the organization’s
    network is encrypted.


    There are many platforms available on the internet today that will teach you how
    to create a network for the purpose of data transmission. Typically, a `VPN` ensures
    that only the authorized user can access the network; no other person without
    authorization will be able to intercept the data. It’s like if you wanted to build
    your house inside the forest without anyone knowing about it and only the person
    to whom you gave directions would be able to visit you. `VPN` sets up a kind of
    tunnel for two networks that only an authorized user can access. When you need
    the tunnel, you set it up, and when you are finished using it, you close it off.
    Instead of `E2E` cryptographic applications, the organization you work with may
    find it necessary to build tunnels over the public networks at the transport layer.
    There are different kinds of `VPN` solutions, ranging from commercial applications
    to sophisticated features that are available as part of the operating systems
    we use on our computers. A few of the available protocols for `VPNs` are listed
    below:


    *   `PPTP`: Point-to-Point Tunnelling Protocol

    *   `L2TP`: Layer 2 Tunnelling Protocol

    *   `IPSec`: Internet Protocol Security

    *   `SSH`: Secure Shell


    ## USING MICROSOFT’S PPTP


    This technique is an incredibly quick and relatively easy method of accessing
    your network. If you are a small business owner, you might also consider using
    a point-to-point tunneling protocol for your network. `PPTP` offers a level of
    encryption that is adequate for most business owners. Most small and medium-sized
    business owners prefer `PPTP` because it doesn’t require a certificate server
    and supports native Windows commands. Even most commercial `VPN` vendors support
    this protocol. With the point-to-point tunneling protocol, you can choose authentication
    that uses passwords. However, you need to understand one crucial fact about `PPTP`:
    It relies heavily on your skills when it comes to password generation.


    ## USING L2TP


    Unlike the point-to-point tunneling protocol, which is available for all Microsoft
    Operating systems, the layer two tunneling protocol is available only on the `Windows
    2000` and `Windows 2003` platforms. As good as it is, it has a setback. It requires
    a certificate server or a third-party certificate. However, this can be expensive
    and not affordable in many cases.


    ## USING IPSEC


    This is an industry standard for encryption that Microsoft included in `Windows
    2000`, `Windows XP` and the `Windows 2003` operating systems. This protocol is
    straightforward to use between Windows machines and also offers excellent security.
    It also has a setback, just like the `L2TP`, and requires the use of a certificate
    server.


    There are two modes in `IPSEC`, which are `transport` and `tunnel`. The tunnel
    mode encrypts the header and also the payload of each packet. However, the transport
    mode encrypts only the payload.


    ## USING SSH2


    This protocol is very useful in organizations. `Secure Shell` is another tunnel
    that is mostly used in organizations to tunnel services that have cleartext passwords,
    such as `FTP` and `Telnet`. On the other hand, this protocol gives you flexibility
    when you try to log into a remote host computer securely. You will also have the
    ability to run commands on a remote machine and you will enjoy encrypted, secured
    and authenticated communication between two networks or machines.

