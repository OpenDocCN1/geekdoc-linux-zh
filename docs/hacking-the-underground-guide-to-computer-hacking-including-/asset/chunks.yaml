    ## WIRELESS SNIFFERS


    There is an old saying: “A picture is worth a thousand words.” This saying applies
    not only to life in general, but also to you as a cryptic ethical hacker. Show
    someone his or her password that you just captured because it wasn’t encrypted
    and that person won’t repeat the mistake. There are different packet capture tools
    you can use for this type of operation. Following is a list:


    - AirMagnet: [www.airmagnet.com/](http://www.airmagnet.com/)

