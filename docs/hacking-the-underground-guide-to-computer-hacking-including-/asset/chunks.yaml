    13. 在 `Kali` 中，有一个用于发布应用程序的核心注册表。必须提供正确的地址和信息。然而，如果你选择 `NO` 选项，你将**永远**无法从 Kali
    应用注册表安装内容。


    14. 安装 `Grub`。


    15. 最后，关闭或重启系统以完成安装。


    你现在已完成安装。你可以根据需要更改程序以产生结果。以下是你可以选择深入研究的测试方法：


    * 伦理黑客

    * 渗透测试

    * 漏洞评估

    * 安全审计


    ## Web 服务器分析


    在针对一家公司时，首要采取步骤之一是在不让对方发现的情况下收集大量信息。这些信息的来源通常是基于互联网的资源，包括 `CNN` 新闻网站、域名数据库（`DNS`）、`EDGAR`
    数据库和搜索引擎。你可以通过以下三个步骤了解更多关于公司的安全措施的信息：


    1. 足迹探测 (Foot printing)：此步骤收集信息并对公司的安全状况进行特定的画像。足迹探测使用简单的工具收集诸如行政和账单信息，包括员工姓名、电子邮件、地址和位置。所有这些数据都可以从互联网轻松获取。


    2. 扫描 (Scanning)：在扫描过程中，通过端口扫描、ping 扫描和操作系统识别来检测通过互联网可用且可访问的系统。在此处提取的信息涉及系统架构和特定的
    `IP` 地址。


    3. 枚举 (Enumeration)：这一步简单地使用特定于操作系统的技术（如路由表、系统横幅、用户和组名以及 `SNMP` 信息）从系统中提取有效账户。


    当完成这些操作后，由于信息是被动的，即使公司安装了 `IDS`（入侵检测软件），它们也无法检测到是谁在收集关于它的信息。


    在进行渗透测试的过程中，你必须收集信息、获取目标网络的详细地图并进行完整评估。你必须能够识别网络中的每个相应系统。信息收集分为两类：被动信息收集和主动信息收集。


    ## 被动与主动信息收集


    我们可以将被动信息收集定义为通过难以追溯到发现者 `IP` 地址的媒体收集信息。它也被称为开源情报，通过寻找基于互联网的信息来工作。你可以访问到对被动信息收集有用的价值信息。这些信息可以用于构建地图、理解组织结构并评估员工及其与其他公司的关系。这些信息可以在之前提到的数据库中找到，例如
    `EDGAR` 数据库或存档的公司信息。由于这些信息是公开的，因此存储它们既不违法也不违道德。大多数数据库都为你提供了轻松访问这些信息的工具和资源。公司首页是一个宝贵的资源，可用于揭示敏感信息。可以在不经公司检测或直接连接的情况下获取信息。价值信息，如公司位置、网络和系统以及所有权信息是在被动信息收集期间收集的。在收集被动信息时，收集位于目标网络系统的存档信息非常重要。需要进行不同的搜索，搜索信息列表包括：


    * 目标网络存在情况（注意：这不仅是指网页）

    * 与目标相关的搜索引擎信息

    * 包含员工或公司数据的 Web 组

    * 员工的个人网站

    * 安全和交换数据，以及关于目标的任何额外财务信息

    * 运行时间统计网站

    * 目标发布的职位公告

    * 用于额外信息的存档网站

    * 新闻组

    * 域名注册商

    * 目标是否通过第三方服务提供反向域名系统 (`DNS`) 信息


    主动信息收集是被动信息收集的相反面。在这里，你通过连接到目标（公司）来收集信息。当你收集信息旨在更好地了解现有的结构和系统时，公司会意识到你的意图。主动信息收集并不比被动信息收集更有用，因为存储的信息可能会发生泄漏。这在渗透测试期间可能有用，使得主动信息收集与被动信息收集相似。当信息与网络相关时尤其如此，因为起初很难从公共存档中找到隐私信息。


    ## 反向映射 (INVERSE MAPPING)


    这是一种利用思想和假设寻找缺失环节来收集主机主机信息的技术。反向映射使用 `RESET` 扫描并从路由器获取信息，路由器提供了网络的内部架构信息。路由器扫描
    `IP` 地址并根据扫描结果做出。。会对无法访问的地址提供反馈。可以调查路由器以获取 `IP` 列表，结果用于映射目标网络的 `IP`。


    域名查询答案从探测计算机发送，随后它通过回答域名问题，以提取针对不存在的主机的 `ICMP` 不可到达消息。


    ## 端口扫描 (PORT SCANNING)


    端口扫描有两个目标：


    1. 验证目标系统是否存在并查看这些系统中哪些是存活的。

    2. 获取接受连接的通信通道列表。


    端口扫描有四种：


    1. 隐身扫描 (Stealth scan)


    这种允许你通过过滤规则并避免网络流量的扫描技术。最流行的隐身扫描技术是显式的，通过 `XMAS` 扫描、`NULL` 扫描、`SYN/ACK` 扫描和 `FIN`
    扫描执行。


    `XMAS` 扫描称为圣诞树扫描，发送带有 `FIN`、`ACK`、`PST` 和 `RST` 标志的 `TCP` 包。`NULL` 扫描使用 `TCP`
    包关闭所有标志，并在探测系统向所有关闭端口发送 `RESET`。`NULL` 扫描适用于大多数 `TCP` 实现，无论运行在什么操作系统上。`SYN/ACK`
    是三次 `TCP` 握手的第一步。`TCP` 将数据包识别为错误并发送 `RESET` 以断开连接，这正是检测关闭端口状态的正确响应。这是因为如果数据包来自开放端口，`SYN/ACK`
    隐身扫描将忽略该包。`FIN` 扫描使用 `FIN` 包探测目标端口系统，然后等待其响应。


    2. TCP 连接扫描 (TCP connect scan)


    '
- fmt: '

    This scan uses basic TCP connections to establish mechanisms for the interested
    port on a targeted machine. The scan sends a `SYN` packet to the specific system
    and waits to read the type of packet it uses. If the response received is a `SYN/ACK`
    packet, the port is in a `LISTENING` state. If the scan receives a `RST/ACK` packet,
    the port is not in a `LISTENING` state and the connection will `RESET`. In a case
    in which a `SYN/ACK` is received, we can send an `ACK`. The connection will be
    terminated when the full connection establishment process has been completed.
    The only problem is that TCP scans can easily be detected.


    ### 3. TCP SYN scan


    Also called the half opening scanning, this differs from the TCP connect scan
    because it does not allow a full connection to be established with the interested
    port on the target machine. A `SYN` packet is initiated and sent. If you receive
    a `SYN/ACK` packet, it signifies a `LISTENING` port. If a `RST/ACK` packet is
    received, it indicates a Non-Listening port. When a `SYN/ACK` packet is received,
    the connection is broken down to `RESET`. This terminates the TCP handshake and
    no logs are recorded for the scanning attempts on the site.


    ### 4. Proxy scanning/file transfer protocol bounce scanning


    In Proxy scanning, the attacker tries to connect to the FTP server with its writable
    directory, establishes a control communication connection and requests an active
    data transfer process from the FTP server so that it can send a file across the
    internet.


    ## PORT SCANNING TECHNIQUES


    There are many port scanning techniques but we will discuss only five types:


    1. `Slow scan`

    2. `Fragmentation scan`

    3. `Random port scan`

    4. `Decoy scan`

    5. `Coordinated scan`


    The slow scan uses an intrusion detection system to determine if someone with
    a specific IP address is trying to scan relevant networks. This is called the
    site detection threshold; the attacking user is usually patient and gives the
    scan a long time to run through its course.


    In a fragmentation scan, all IP packets that carry data are fragmented and information
    is carried out using a TCP for data fragmentation. This fragmentation links the
    destination port and the source port with the first packet that was sent. Eight
    octets of data are usually needed to contain the source and destination port numbers.
    This pushes the TCP flags into a second fragment, while some intrusion detection
    systems and filtering devices reassemble during scanning by assuming that the
    scanned network has already been checked from the access list. Linux is a good
    example because it has a filtering device on the `CONFIG_IP_ALWAYS-DEFRAG` kernel
    option.


    The random port scan randomizes the sequences of the port that is probed to prevent
    detection. It uses a commercial intrusion detection system to search for sequential
    connection attempts. When a pattern finds a match, the port scan is reported.


    Some network scanners are enabled with the decoy feature or with spoofed addresses
    during an attack. The decoy feature causes an intrusion detection system to assume
    that the targeted network is undergoing a port scanning by all of the hosts, so
    that fishing out the real attacker becomes almost impossible. In the past, intrusion
    detection systems detected decoy hosts by using `TTL` (Time To Live) field values
    in their scanned packets. If `TTL` values were constant, it would seem like they
    were all factory generated. Another method used to detect a genuine scan among
    decoys is to trace the route of the originator’s IP address. If a non-routable
    IP address is used, it would lead to denial of service. This can also happen when
    the IP address belongs to a host that is not live on the network. To prevent this
    from happening, the attacker uses spoofed IP addresses of the host that is up
    and running already.


    Coordinated scans are used to target single hosts or an entire network. The scans
    are coordinated when attackers team up to achieve the common goal of trying to
    get illegal access to a targeted network. When multiple IP addresses probe a targeted
    network, they all probe from a different machine and at a different time, which
    makes it almost impossible to detect these scans. A coordinated attack, when carried
    out properly, is the most effective way to probe a target because it is hardly
    ever detectable.


    Identifying the operating system that runs on a target host/machine is very important
    because of the many security holes that are operating-system-dependent. Attackers
    may scan a range of IP addresses for the UDP, TSP ports and its operating system
    type. When an operating-system-dependent security hole is discovered, the system
    only needs to go through the list and match the information.


    There are many services that can be used to identify operating systems. The most
    notable is the `TELNET` service. The second service for identifying an operating
    system is the `DNS HINFO Record`, which uses the host’s information record to
    pair strings that identify the host’s operating system and the hardware type.
    `DNS HINFO Record` is not very effective because it is archaic and as a result,
    most administrators avoid using it.


    Distinct variations in TCP stack implementation are used to determine a remote
    operating system through the stack fingerprinting technique. The idea behind IP
    stack fingerprinting lies in the fact that it sends TCP packets to the target
    IP and waits for a response, which is distinct on various operating systems and
    varies from one vendor’s implementation of the IP stack to another.


    TCP stack fingerprinting uses tools like `Nmap` and `Questo`. `Nmap` has a larger
    database of responses from the operating systems than any other tool. For the
    most accurate results, an `Nmap` needs one port opened, at least, at the target’s
    host.


    Below are the types of probes and processes used to determine operating system
    types:


    * The fin probe

    * The bogus flag probe

    * Initial sequence sampling of TCP

    * TCP initial window

    * ACK value

    * ICMP error message quenching

    * “Do not fragment bit”

    * ICMP message quoting.

    * ICMP error message echoing integrity

    * Fragmentation handling

    * TCP options


    ### 1. The FIN probe


    To use a `FIN` probe, we target an open port and send a `FIN` probe to it. Then,
    we wait for a reply. Ideally, such a reply would not come. The `RFC793` expected
    behavior ensures that a `FIN` probe is not responded to. Most stack implementations
    will react with a `RESET`. This set of systems includes Windows, CISCO, BSDI,
    IRIX and HP-UX, and MVS, with a `RESET`.


    ### 2. The bogus flag probe


    This type of probe uses a `SYN` packet with undefined flags and sends the packet
    to the targeted host. Devices running on the Linux operating system with a kernel
    prior to `2.0.35` will log the set of flags in the responses they send back. There
    are, however, operating systems that appear to `RESET` the connection in the event
    of the receipt of `SYN+BOGUS` probe.


    ### 3. TCP initial sequence number sampling


    Here, we can search for patterns in the sequence numbers that were initially employed
    in the implementation of TCP to respond to a linking or connection request.


    We can divide this into different groups:


    * The traditional 64k (older UNIXs)

    * Random increment (such as DG-UX, new versions of Solaris, FreeBSD, IRIX)

    * Window boxes that use time-dependent systems (MS Windows)

    * True “random” (OpenVMS, Linux, etc.)


    ### 4. “Do not fragment bit”


    To enhance performance, some operating systems set a “do not fragment bit”.


    Monitoring this behavior can give the attacker additional information about the
    targeted operating system.


    ### 5. TCP initial window


    The initial size of the window for the returned packets of several stack implementations
    is unique. AIX, for example, remains the only operating system that uses the `0x3F25`
    value. `FreeBSD` and `OpenBSD` use `0x402E`.


    ### 6. ACK value


    In some cases, changes can be made in IP stacks because of a difference in the
    values that were set in the `ACK` fields.

    '
