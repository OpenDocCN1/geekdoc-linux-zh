    *   Parrot Home is a feature of Parrot that is meant to assist users, giving them
    access to the beautiful atmosphere of Debian and exposing them to the inbuilt
    penetration testing tools. It also provides assistance in terms of how they can
    be effectively used.

    *   The Parrot Air attribute is employed mainly in the wireless system of penetration
    testing.

    *   The Parrot Studio attribute focuses on multimedia creation functions.

    *   The Parrot Cloud attribute operates on a VPS and jump box. It is aimed at
    apps that deal with servers and enables the user to access the full package of
    penetration test kits excluding the front-end graphics.

    *   The Parrot IOT attribute was built for systems that have low resources such
    as the Pine64, Raspberry Pi and Orange Pi systems.

    *   The Parrot Security attribute, being the real Parrot OS, was designed with
    privacy in mind. Its design also favors forensics, penetration testing and future
    developments. Attention hasn’t shifted from the original distribution and purpose,
    even if it doesn''t really have a wide range of functions. With several security
    features, the program is a desktop force that has the requirements for successful
    penetration. It makes hacking what it is.


    Users of Kali will also find Parrot indispensable for their work. As with Kali,
    you''ll feel very much at home with Parrot, and you won’t need to re-learn the
    basics of flowing with the operating system.


    ### Step 1: Install the Parrot Security OS.


    First, we need to download an OS called Parrot Security ISO. You can probably
    get it on Parrot Security’s official website along with the ISO’s hashes. After
    a successful download, the hash should be confirmed. If the hash is not of the
    same type as the ISO, the file is affected and is not valid. A good idea would
    be to visit the Parrot site and download the most recent version. Confirming the
    hash is a simple process. For the hash to be verified on Windows, open the run
    wizard by pressing the `WIN+R` and then type `CMD` into the dialog box. Hit enter.
    When the command prompt opens, type the code `certutil .`.


    ```bash

    certutil .

    ```


    ```bash

    certutil-hashfile Parrot-full-3.8_amd_64 SHA1

    ```

    - if your version is 3.8.


    For hash confirmation in a Mac operating system, start the command line and execute
    the code - `shasum Parrot-full-3.8_amd_64.ova`.


    For confirmation on Linux, input the code `sha1sum .`.


    Should the hash correlate, you''re free to proceed to the following stage.


    ### Step 2 : Create a Virtual Machine.


    To run the operating system, we need to test it on a random machine. First, you’ll
    need to copy the image on a drive and then start the system. While this method
    works, it requires a lot of time. The new devices can successfully run Linux’s
    Guest software. As a result, virtualization will become more engaging. What’s
    more, we can do away with the device if it poses a lot of problems.


    We will make use of a `VirtualBox` on a Windows operating system that is detached
    from the VirtualBox site. (`VirtualBox` is a strong virtualization and highly
    efficient tool that comes with an open-source license under GNU.) If properly
    done, the procedure ought to operate on all significant platforms available.


    During the installation, you can experiment with a live disc rather than a virtual
    disc. After you kickstart `VirtualBox`, the manager will pop up immediately.


    There will be a Parrot system open on the system. If you need to restart or run
    another one, scroll to the left corner to do so. Input the name of your machine
    of choice and click on Linux. After this, some versions will be provided. Choose
    Debian but make sure that the version is suitable for your system. Choose either
    a 32 or 64-bit version and make sure that there is enough space on your disc.


    # CONCLUSION


    Thank you again for purchasing this book!


    I hope this book was able to help you learn more about hacking. The next section
    is about the various online resources that you can use and learn from.


    Finally, if you enjoyed this book, then I’d like to ask you for a favor. Would
    you be kind enough to leave a review for this book on Amazon? It’d be greatly
    appreciated!


    Good luck!


    # APPENDIX A: WIRELESS HACKING RESOURCES


    With the rate at which technology is improving, especially in the wireless network
    niche, you need to keep yourself and your company safe by staying up to date on
    developing standards and tools. Although this book has walked you through various
    techniques for hacking and protecting yourself, there is still a lot to learn
    as time goes by. Below are some of the resources you can use to learn more.


    ## CERTIFICATIONS


    We have covered ethical hacking in this book, and we think this is one of the
    best tests you can take to see how knowledgeable you are. The following are the
    two organizations that certify individuals:


    *   Certified Wireless Network Professional Program: [www.cwnp.com/](http://www.cwnp.com/)

    *   Certified Ethical Hacker: [www.eccouncil.org/CEH.htm/](http://www.eccouncil.org/CEH.htm/)


    ## General Resources


    According to research, the Internet is something almost 90 percent of people can''t
    do without daily. Everyone browses, everyone wants a Facebook account. The internet
    is a valuable resource. However, using the internet is like trying to get a sip
    of water from a firehose. You must stem the flow of information. We have compiled
    a list of sites that provide vital information about wireless networks on a regular
    basis. Plus, you can subscribe to their free email lists.


    *   SearchNetworking.com: [www.searchnetworking.com](http://www.searchnetworking.com)

    *   SearchSecurity.com: [www.searchsecurity.com/](http://www.searchsecurity.com/)

    *   SearchMobileComputing.com: [www.searchmobilecomputing.com/](http://www.searchmobilecomputing.com/)


    ## HACKER STUFF


    As we have stressed in other chapters, if you want to catch an enemy, you need
    to think like an enemy. The same applies to a thief. In *The Art of War*, Sun
    Tzu writes that you need to understand your enemy to defeat him/her. This relates
    back to the methodology that learning about your enemy is an excellent tactic.
    You need to understand your enemy, think like him and act like him because if
    you can really put yourself in your enemy’s mindset, you will be able to understand
    him/her better. We have compiled for you the best sites that will help you better
    understand crackers and hackers.


    *   Honeypots: Tracking Hackers: [www.tracking-hackers.com](http://www.tracking-hackers.com)

    *   The Hacker Quarterly magazine: [www.2600.com](http://www.2600.com)

    *   Computer Underground Digest: [www.soci.niu.edu/~cudigest](http://www.soci.niu.edu/~cudigest)

    *   The Online Jargon File: [www.jargon.8hz.com](http://www.jargon.8hz.com)

    *   PHRACK: [www.phrack.org](http://www.phrack.org)

    *   Hacker t-shirts and other equipment: [www.thinkgeek.com](http://www.thinkgeek.com)


    ## WIRELESS ORGANIZATIONS


    There are many wireless organizations out there, but two of them are: Wi-Fi Alliance
    and IEEE.


    ### IEEE (Institute of Electrical and Electronics Engineers)


    In this book, we have mentioned wireless standards like 802.11, 802.11a, 802.11b,
    802.11g and 802.11i. These standards are implemented by the `IEEE` ([www.ieee.org](http://www.ieee.org)).
    The Institute of Electrical and Electronics Engineers (`IEEE`) has been in operation
    for decades and is known for developing open wireless standards for Wireless Local
    Area Networks (LANs), Wireless Metropolitan Area Networks (MANs) and Wireless
    Personal Area Networks (PANs). You can differentiate the `802.11` standards (“Over
    the air”) from the `802.3` Ethernet standards (“Over the wire”). You can read
    more about `IEEE` standards by visiting previous chapters or consulting Internet
    blogs and forums.


    Wi-Fi Alliance

