- fmt: '

    When it comes to marketability, Linux has gained a lot of ground because of publications
    about Microsoft''s jitters, SCO''s litigation and the Sun''s decline. This is
    the case without even considering the social and domestic benefits of Linux.


    Unlike UNIX clones, Linux and most other systems that the BSD-derived have an
    open source file, so users can manipulate and even develop the file. This means
    that it is not just the users who can access the source, but also engineers. Computer
    users can create and improve their kernel without external assistance. Alternatively,
    they can find distributions and decide to work everything out by themselves, explore
    the program, learn the ins and outs of the software and make something better
    out of it.


    Even though some operating systems are also open source, Linux requires minimal
    resources to start or maintain a venture. Well-established software and hardware
    marketers like HP and IBM depend heavily on `SUSE` and `Arch Linux` to survive.
    Many big Linux users are underground these days so that they can circumvent `SCO`s
    radar. Another boost to Linux comes from Walmart, since the company makes money
    from it.


    In fact, Linux could replace `UNIX`. Both are similar in some ways even if they
    are not really the same. Perhaps the differences between these software programs
    can be bridged if the Linux enterprise is modified.


    Linux has become more popular among sellers and software users. After the experience
    with the open source, consumers are now ordering from most of the closed source
    distributors like `Sun`, `Microsoft`, etc. Existing vendors that were initially
    considered invulnerable are becoming aware of Linux’s influence in the consumer
    market as it threatens to capture corporate desktops.


    Linux is a good choice for nations that are still in their developmental stage.
    It can be used for effectively training their workers, who can acquire and use
    it without wasting money or running afoul of I.P. agreements between the institution
    and user.


    ## THE LINUX DEVELOPMENT PROCESS


    The OS virtualization technology is systematically used to create several Linux
    environments on a particular Linux host. Unlike other virtual devices or machines,
    a Linux container will never permit a strange operating system; instead it fractionizes
    the kernel of the host OS and also gives a portion of the guest OS to permit the
    necessary OS functions. No OS is actually faithful, so Linux containers are much
    more quickly initialized than virtual machines.


    Some kernel highlights such as `profiles`, `chroot` and `CGroups` kernel features
    are being employed by Linux containers to create something similar to a virtual
    machine. Security modules in Linux allow entrance into the host machine while
    the container’s kernel is being controlled to prevent any of unauthorized access.
    What’s more, containers can accommodate several Linux versions directly from the
    operating system of the host provided that the operating system can function simultaneously
    on the same CPU.


    With respect to the various Linux distributions, the Linux container will make
    available methods of producing container images, an `APL` for the lifespan, tools
    that move with the `APL`, snapshot features, and ways to transfer container instances
    to different hosts.


    ## HISTORY OF THE CONTAINER


    `chroot`, a container, was invented in 1979 as the `UNIX Chroot`. The operating
    system is almost the same as the `UNIX` operating system. There is a need to transport
    the root directory of a process to a new destination on the system that only visible
    processes can sense because each process needs free space. This feature was included
    in `BSD` some three years later.


    Woolworth invented one of the first containers in the year 2000. The operating
    system resembles `Chroot` except that it contains some new elements and features
    for separating the filesystem, user and network. It provides a way to identify
    jails, configuration and installation with an IP address.


    “Linux server” is a term that is used to portray a particular jail feature that
    functions as a fortified parting of resources on the processing unit (the network
    IP). The parts created and the visual systems are known as “security content”
    and “virtual private servers,” respectively.


    The `Solaris` container was invented in 2004 for special systems and the first
    version of `Solaris` was released in 2005. A `Solaris` container combines various
    controls and the space created by various zones. These zones work totally within
    specified limits, which are made up by the boundaries of the operating system.


    `Open VZ` was invented in 2005 and is almost the same as `Solaris`. It creates
    visualization and other notable features by using a `Linux kernel`. Every `Open
    VZ` container possesses an abstract file system.


    Google initiated a process container to manage resource packages and to collect
    various processes. As time passed, the name was changed to ‘control group’ to
    avoid a situation in which the term ‘container’ could be confused with a different
    meaning when the version of the `Linux kernel` was integrated into another version
    of the `Linux kernel`.


    `LXC` is the acronym for ‘Linux container’ and is a first-generation container
    manager. It was initiated by using the name space in `Linux` and stored in an
    `LXC` collection of programs. It provided a language script for various `APIs`.
    Another important thing to note is that `LXC` containers will run without patches.
    Furthermore, `Canonical Ltd.` funds and supports any project of `LXC`.


    In 2011, `Warden` was activated by `Cloud Foundry`. In the process of activation,
    `LXC` was employed. After `Warden` was completely developed, the program was substituted
    for `LXC`. Although no strong relationship exists between `LXC` and `Warden`,
    the latter can function on any random operating system that can establish a method
    of detaching the environment. A `daemon` can run on `Warden`, as it makes a provision
    for a chief API to control containers.


    `LMCTFY` is the acronym for “let me contain that for you”. It serves as a provider
    of app containers, because it is the open source that chips in ideas into the
    `libcontainer`. Because of that, no update whatsoever has been made to `LMCTFY`.
    `Docker` kicked off the `libcontainer` task and now the `OCF` (Open Container
    Foundation) has taken control of it.


    In the beginning of 2016, `Docker` usage spread like wildfire. It was recognized
    on a very large scale. A popular company known as `dotCloud` actually named `Docker`
    and developed it. Just like `Warden`, `Docker` borrowed `LXC` in its beginning
    stage. As the container grew, `LXC` was replaced with `Docker`’s `libcontainer`.
    One importance of `Docker` is that it provides an environment in which other containers
    can be managed. The container is composed of an image model that is layered and
    very efficient. It is essentially a register of different containers, `API` and
    so on. Lately, `Docker` has ventured into producing a container called `Docker
    Swam` that provides various management options.


    `CoreOS`, in a bid to replicate the `Docker` container, designed a very similar
    but much improved container called `Rocket`. It was established in 2014. The actual
    purpose of `CoreOS` was to design a more secure container than `Docker`. On the
    App container, it is regarded as the standard. `CoreOS` produces other similar
    containers of the same brand including `Docker` examples such as `CoreOS`, `flannel`,
    etc.


    In 2015, `Microsoft` took a step toward including a container to assist its system
    server for apps that are Windows-based. This container is called `Windows container`.
    Although it was not yet released at that time, it was made public with the `Windows
    server` in 2016. The execution of the project will make `Docker` function on Windows
    without the need for a virtual machine.


    ## THE FUTURE

    '
