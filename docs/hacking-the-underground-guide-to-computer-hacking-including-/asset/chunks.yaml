    However, you should not have the impression that VPN is a completely secure silver
    bullet. The malicious hackers out there can still mount client-side and server-side
    attacks on VPNs. Don’t forget that your malicious hacker will take time to find
    your weaknesses. If your weakness is your client, that is where you will be attacked.


    # CHAPTER SIX: FLAWS IN WEBSITES AND WEB APPLICATIONS


    There is perhaps nothing we can do on the web that does not require the use of
    websites or web applications, particularly with the increase in accessibility
    of the internet, the proliferation and improvements in web design, and the growth
    of web application development.


    Even though there has been an increase in productivity and ease of use, there
    is a growing concern about how safe we are on the web, including the security
    of our information and general presence on the web. There have been many popular
    cases of security failures, including picture leakages, customer information leaks
    and more recently the `Ransomware` virus. There has also been an increase in the
    desire for the average web user to be more security conscious and to make efforts
    to guard his or her private data. More plugins and other applications have been
    developed to guard against spyware and trojans from websites that have downloadable
    software. Others are designed to warn the users when they are attempting to surf
    an unsecured website.


    However, to effectively protect yourself when using websites or web apps, you
    must understand the different ways in which your information may be leaked and
    accessed. There are four levels to note when you are using a website or a web
    app. These levels are mentioned below, from the base level to the top level.


    1. **The database**: This is where the client information is held–where all of
    the signups are stored, including locations, email addresses and other vital information
    that the application or website needs to function properly.

    2. **The web server**: This is the portal that acts as the interface between the
    application or website and the files of data. It is like a door into the warehouse
    that allows you to retrieve whatever you want so long as it exists. It is a software
    or computer that provides content to users based on the type of request made from
    the browser via `HTTP`.

    3. **The website or web application**: This is the interface we see and interact
    with when we are surfing a website or using a web app. This holds the codes used
    in developing and designing the website. It contains the instructions to the server
    for file retrieval or storage and instructions on how to respond to various user
    inputs or actions on the website or web app interface.

    4. **The browser**: We all know web browsers are used to display web pages. Some
    would argue about the importance of this, but I can tell you confidently that
    it matters as much as the other layers when security and privacy are concerned.
    Previously, most of the codes were run on the web server. In recent times however,
    due to the improvement in many client-side scripting languages like `JavaScript`
    and various frameworks, more web app codes run on browsers now. These web browsers
    store lots of pieces of information like `cookies`, the most frequently visited
    websites, bookmarks, usernames and passwords.


    Now, flaws in the database pose an enormous risk for clients or users of the website
    or web app. These flaws can allow easy access to the database and expose pieces
    of information like the client''s name, location, account numbers and even social
    security number. Loose webserver security also reveals information that should
    otherwise have been protected when sending requests to the server by the website.
    Information leakage from the application or website itself can occur through errors
    that were made during programming or development of the website or app. These
    errors often have to do with user input validation, insecure instructions to the
    server by the application or website itself, or even comments that reveal the
    structure of the application or website. For browsers however, the significant
    amount of information they store (passwords, favorite websites, etc.), makes them
    a sweet spot for hackers to exploit. If the hacker accesses information like favorite
    websites, he or she can create a clone website to redirect the user and collect
    vital information. The hacker can also use flaws that are present in website flash
    codes or `JSON` to get information from the user.


    The common security flaws that can exist in websites or web apps are mentioned
    below. It is said that to correctly secure your website or web apps, you need
    to understand how these security flaws occur and how they can be exploited.


    ## 1. Information leakage


    This occurrs when an app or a browser sends information to the server and that
    information–which should otherwise have been protected or hidden–is shown to the
    user or hacker. In this context, information has been leaked. This basic security
    flaw occurs in the coding or application development process. It details how the
    website or the web app is structured, as well as how information flows in the
    whole process. If a hacker obtains the relevant codes, he or she can then exploit
    the website or web app. There are two primary ways in which this information breach
    can occur:


    ### Directory browsing


    Before we explain how directory browsing can leak information, let’s explain what
    it is. On the web, there are two ways of looking for resources, information or
    content. The first is through search engines, among the most popular of which
    is `Google`. Search engines are web applications that use an automated tool or
    script called `spiders` or `crawlers`. These crawlers go through the web, identify
    keywords, read the contents of the page and follow related links on those pages.
    They store every single page they visit and every subsequent page on the web server.
    Thus, when you search a keyword, you get a list of pages that have been stored
    or indexed on the server. A web directory, on the other hand, is a directory or
    list of websites that have been classified into various categories. These lists
    are managed and handled by people. Website owners submit their websites to the
    directory and the people managing the directory then vet the websites to confirm
    they meet the criteria for listing in their directory. If we are seeking information
    for research, want authentic content, or want a broad range of resources related
    to a particular topic, we will want to use a web directory. When the directory
    browsing tag in the `HTML` is indirectly configured, or when files that should
    be private are listed in the directory, a malicious user can access the file and
    gain critical information. `DirBuster` is a tool on `Kali Linux` that does this
    task. This application scans a website and its port, which can be `80` or `443`
    depending on whether it is a secured website. It then uses a wordlist to search
    for directories in the website that should not be visible. If any of those directories
    are found, they could lead to the database and cause significant information leaks.
    To prevent unauthorized access to directories or files by a malicious user, it
    is advisable to properly configure the `.htaccess` file or the `appcmd` command
    depending on whether you are using the Apache server or the IIS server for your
    website.

