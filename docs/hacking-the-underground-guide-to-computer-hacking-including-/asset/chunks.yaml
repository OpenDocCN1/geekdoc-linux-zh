    该组织曾名为 WECA，成立于 1999 年。Wi-Fi 联盟（[www.wifialliance.com](http://www.wifialliance.com)）最初是一个非营利组织，根据
    IEEE 802.11 规范认证所有无线局域网产品的互操作性。这家公司现在非常大，在全球拥有 200 多家子公司。此外，它拥有超过 1000 台认证的设备。


    ## 本地无线小组


    Facebook 由这些人控制，因为一个人无法完成所有工作。你是否考虑过如何认真对待无线伦理黑客？如果答案是肯定的，你需要沉浸在那种文化中。你需要与无线爱好者建立联系；他们可以向你介绍新工具、实用的白皮和其他和其他。无线组织像杂草一样涌现，让个人能够遇到志同道合的人士。以下是一些你可以开始加入的无线用户组：


    - Corkwireless, Cork, Cork County, IE: [www.corkwireless.com/](http://www.corkwireless.com/)

