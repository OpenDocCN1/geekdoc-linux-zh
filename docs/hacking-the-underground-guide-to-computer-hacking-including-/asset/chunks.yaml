    ## Software Emulators


    Have you ever thought about using two different operating systems on one computer
    system at the same time? Or pasting from one OS to another? If you have wondered
    how things like this are done, consider a software emulation product. Some call
    it partitioning. Below is a list of companies known for software emulation products:


    - Bochs: [http://bochs.sourceforge.net/](http://bochs.sourceforge.net/)

    - Cygwin: [http://cygwin.com/](http://cygwin.com/)

    - DOSEMU: [www.dosemu.org/](http://www.dosemu.org/)

    - Microsoft Virtual PC: [www.microsoft.com/mac/products/virtualpc/virtualpc.aspx?pid=virtualpc](http://www.microsoft.com/mac/products/virtualpc/virtualpc.aspx?pid=virtualpc)

    - Plex86: [http://savannah.nongnu.org/projects/plex86/](http://savannah.nongnu.org/projects/plex86/)

