    # CHAPTER ONE: INTRODUCTION TO HACKING


    In many countries today, hacking is considered to be one of the biggest national
    threats. At one time, hacking was like playing with your friend or engaging in
    harmless pranks on your computer, but this is no longer the case. It is now considered
    a crime. Intelligence agencies and some countries’ security services view hacking
    as a form of terrorism while governments have condemned it.


    In layman’s terms, hacking is the act of breaking into someone else’s computer
    to which you have no access and stealing private information by circumventing
    the security measures. It is dangerous because it sabotages the entire computer
    system.


    The origin of the word “hacking” can be traced back to the 1960’s and 1970’s.
    Some hackers, called `Yippe`, were anti-war protestors and members of the Youth
    International Party. They played pranks in the streets, and most of their prank
    techniques were taught within their group. It is important to note that they were
    involved in tapping telephone lines as well.


    Gradually, what was called a prank grew to another level and became known as hacking.
    However, this time their tools were state-of-the-art mega core processors and
    multi-function plasma screens.


    Hacking tactics are increasingly being used by terrorist organizations for numerous
    acts of evil, including obtaining illegal funding, spreading propaganda, launching
    missiles, threatening the government and gathering intelligence about secret military
    movements.


    In this book, various types of hacking will be broken down and explained. Step
    by step instructions will be provided so that you can protect yourself from hackers
    in your office and home, as well as on the internet.


    ## HACKER – AN OVERVIEW


    This chapter will provide you with the concepts and fundamentals behind hacking.
    Who are hackers and what do they do? We will also discuss the various types of
    hackers and their classifications.


    In the most elemental definition, hacking can be described as the act of exploiting
    the weaknesses and shortfalls in a computer system, as well as the network of
    such a system. In the exploitation of these weaknesses, illegal acts might include
    stealing private information, accessing a network’s configuration and altering
    it, sabotaging the structural view of the computer’s operating system and much
    more.


