  trans: "\n在保护之前，你首先需要进行检查。当你准备好所有的测试工具时，就是时候准备好对你的无线网络进行测试了，通过对自己的网络系统进行多次伦理黑客和攻击。通过这种方式，你正在向自己揭示你网络中脆弱的区域。在攻击网络的过程中获得的结果将让你更深入地了解你的无线网络漏洞何漏洞，以及安全漏洞可能修复或无法修复的深度。以下是你可以采取的应对措施，以解决你在自系统攻击过程中会遇到的漏洞。\n\
    \n- 非技术攻击：这些是用来利用人性弱点的攻击——缺乏安全意识、对陌生人过度信任或过于粗心。\n- 网络攻击：这类攻击可能包括安装恶意的无线 AP，以及诱导网络客户端连接到此类客户端的阴险手段，尽管存在如\
    \ `SNMP` 这样的网络服务器协议。\n- 软件攻击：对 `802.11` 协议的安全担忧并未此结束，因为我们还应该关注安装在无线系统上的应用程序和操作系统。它们也容易受到攻击。软件攻击可能涉及：\n\
    \    1. 破解你无线网络加密的 `WEP` 密钥。\n    2. 通过利用你脆弱的身份验证系统获取你无线网络的访问权限。\n    3. 通过默认密码（如果你没有更改默认设置）以及易于获取的\
    \ `SSIDs` 进入你的无线网络进行攻击。\n\n# 伦理黑客的十诫\n\n每个过程都有其自身的规则和诫律。圣经有信徒要遵守的规则。以下是指导伦理黑客流程的原则。\n\
    \n## 1. 你必须设定你的目标\n\n让我们分析一下。当 Jack 还是个孩子时，他喜欢玩一种叫“夺旗”（Capture the Flag）的游戏。他在营地开始玩这个游戏；他的营员对这个游戏产生了兴趣并加入了他。后来，这个游戏得到了改进。营员将营员分成两组：一组拿着绿旗，另一组拿着红旗。每个游戏都有一个玩家必须遵守的规则：如果你在绿旗队，你和整个团队就必须找到红旗队隐藏的红旗，反之亦然。\n\
    \n尽管这个游戏规则很简单，但情况可能会变得有点混乱。这关乎一种专注的心态：夺旗。这种专注与渗透测试有关，这意味着具有定义目标或目的的安全测试，只有在目标实现或时间耗尽时才能结束。尝试访问另一个接入点类似于试图寻找对手隐藏的旗帜。你的对手知道你会为了访问接入点而不惜一切手段，所以他或她会尽一切努力来保护它，因为对手知道你会绕过防御——你会尝试“夺旗”。\n\
    \n伦理黑客与渗透测试有关系吗？伦理黑客本身是一种渗透测试，可以作为一种营销手段，但涉及更多的系统，这意味着有多个要实现的目标。\n\n如果你在绿旗队并想要定位对方隐藏的红旗，你需要像一个守旗者一样进行逻辑思考。你会说：“如果我在另一队，我会把旗藏在哪里？”你有一个要实现的目标，这就是为什么你对无线网络安全的评估应该回答三个逻辑问题：\n\
    \n- 入侵者将如何处理被盗的信息？\n- 入侵者能够在目标网络或接入点上看到哪些隐私信息？\n- 目标基地的用户会注意到入侵者的尝试吗？\n\n你的目标可以非常简单，比如你可能会选择寻找非法无线接入点的\
    \ `AP`。你也可以决定定位或获取你系统中有线网络的信息。无论你选择做什么，关键点在于，你必须明确你的目标并通知你的赞助者。\n\n“三个脑袋胜过两个脑袋。”无论你做什么，都需要一个好的计划才能成功。在此时，你必须让其他人参与你的计划和目标设定过程。如果你不，你规划过程中的一切都可能变得困难。目标决定了好的计划。引用柴猫对爱丽丝关于目标的回答：“如果你不知道要去去哪里，哪条路都能带你那里。”在设定目标的过程中包含投资者，因为他们建立的信任将在以后带来丰厚的回。\n\
    \n## 2. 你必须有一个计划\n\n在生活中，并非一切都按计划进行。例如，我们并不是都有无限的预算；总有一些东西限制着我们的计划。这些限制可以是时间、金钱或人员。这里的观点是你需要为你的测试制定计划。\n\
    \n良好的计划会导致良好的结果。因此，以下是关重要的：\n\n- 知道你想测试什么并识别网络。\n- 评估测试周期。\n- 评估测试方法。\n- 实施良好的计划并与利益相关者分享。\n\
    - 等待你的计划获得批准。\n\n不要担心人们会认为你想破解无线网络；分享并公布你的计划。如果你工作的机构像大多数其他机构一样，它极不可能反对组织惯性来采取任何行动阻碍你的努力。最重要的是，不要忘记你并不是在普通条件下在在评估你的“测试过程”。\n\
    \n## 3. 你必须获得许可\n\n不要忘记你正在进行伦理黑客。如果你没有获得适当的许可，你可能会进监狱。回想一个内部审计员的案例，他被当场抓获兑取一张他不工作的工资支票。当他被质问时，他回答：“我不是在偷东西，我只是在检查系统的控制措施。”他本可以在向组织建议解决方案之前获得检查系统漏洞的许可，但他没有这样做，那个行为导致他进了监狱。在伦理黑客中，不要遵循那句老话——“寻求原谅比请求许可容易得多”。如果你不请求许可，你一定会进监狱。\n\
    \n记住，这种许可可能是你与黑白条纹制服之间的唯一障碍。寻找并获得一张“免死牌”。这张卡片将作为证据，证明你对网络的测试是经过授权的，你正在按照计划执行操作。票据将说明，如果你被指控犯罪或因你的行为被起诉，你的组织将支持你。只要你坚持与组织一起创建的计划，一旦出现问题，你的卡片将为你提供组织和法律支持。\n\
    \n## 4. 你必须伦理地操作\n\n伦理黑客与白帽黑客是一样的，因为黑客的意图和良知总是好的。这条诫律告诉你你必须按照你提供的并已批准的计划工作。避免采取未授权的或在计划之外的行为。成为一名伦理黑客定义了你内在的善良，所以要伦理地工作。\n\
    \n在操作过程中，你发现的每一条信息都必须保密，不能向第三方披露。\n"
- fmt: '

    As an ethical hacker, you must also strive to make sure everything you do in your
    operation promotes the progress of your organization and advances its goals. If
    there is something you must change, inform your agency. You might need to change
    your plans if you encounter something outside your expectations, such as something
    that poses a significant risk to the organization’s entire network. Don’t make
    decisions alone. Avoid performing ethical hacking if your organization’s policy
    or the law forbids it.


    ## 5. THOU SHALT SAVE RECORDS .


    To survive and be successful in the profession of ethical hacking, you need to
    have a lot of patience, be hardworking and have a spirit of thoroughness. This
    is because being an ethical hacker requires a lot of time; in some cases you will
    spend hours with a computer’s keyboard alone in the dark until you become stressed
    out and tired. To achieve your goals, you might even need to perform some off-hour
    work. However, this doesn’t mean you will have to put on hacker gear or start
    drinking Red Bull. The objective of all this is to make sure you achieve your
    goal and become an unstoppable ethical hacker.


    The previous commandment stated how important it is for an ethical hacker to remain
    within his/her mode of operations. You must operate as a professional, which means
    that you must keep records. You can keep your records via paper or electronically
    by using the following strategies:


    *   Log all operations performed.

    *   Make duplicates of your logs.

    *   Record all data in your log.

    *   Record and keep all factual records; even when you think your work is not
    successful, you should still record it.

    *   Document and date every test.


    In every organization, there is always a need to report your work. Your report
    can be your outcome, test design and analysis. Be very diligent in your documentation
    of records and your work as a whole.


    ## 6. THOU SHALT RESPECT PEOPLE’S PRIVACY .


    You need to treat every bit of data and information you collect with respect and
    confidentiality. You must guard the secrecy of private information. In the testing
    period, you will gather information about, for instance, encryption keys and plain
    text passwords. All this information must be kept confidential and private. Do
    not, for instance, snoop into private corporate accounts or individuals’ private
    lives. Take care of the information you have; treat it as if it is yours. A good
    name is better than riches.


    ## 7. THOU SHALT NOT DO HARM .


    Whatever you do today always comes back to you; this is known as karma. As an
    ethical hacker, your prime objective is “do no harm.” Resist the urge to go too
    far. Instead, stick to your original plans. Remember that it is very easy to be
    caught in ethical hacking. If you try something and it works, you will get used
    to it. However, nothing lasts forever, and you can easily cause an outage or tamper
    with someone’s information or personal rights. Don’t go outside your plan’s outline.


    We will discuss the tools which you can use to perform hacking later in this book,
    but be sure you read every detail about each tool’s purpose and function. Do not
    jump into using any tool without understanding the nature of it. You should understand
    that you are setting up a sum of money and the whole attack can create a rejection
    of service. Before you engage a hacking tool, relax and take a breath; then be
    ready to read the full documentation about the tool. Of course, it can be boring,
    but it’s one of the prices to pay to be great.


    ## 8. THOU SHALT USE THE SCIENTIFIC PROCESS .


    This commandment does not necessarily mean you will follow all of the steps of
    the scientific process. You just have to adopt some of the fundamental principles
    of the process in your operation. If you adopt a quasi-scientific method or process
    in your work, you will have a structure and also prevent chaos (activities which
    can result from a random walk through your network).


    The scientific process contains three steps, which are:


    1.  Develop and select your plan and goals.

    2.  Make your network capable of addressing your goals.

    3.  Persuade your organization to acknowledge your work.


    The first two steps have been addressed in the previous commandments. Let’s take
    a look at the third step. If you employ an empirical method, your work outcome
    should garner greater acceptance. An empirical process has the following properties:


    *   **Set quantifiable objectives**: In the capture-the-flag game, each team doesn’t
    stop until the opponent’s flag has been found. The purpose of setting a quantifiable
    objective is that you will know when the goal has been reached. This happens in
    one of two ways: You find the flag, or you don’t. Relating this to ethical hacking,
    you have to select a goal you know you can achieve; then associate the selected
    goal with up to 10 access points (`APs`) and the broken encryption keys, as well
    as files on an internal server. Time-quantifiable objectives can include self-testing
    your system or network to understand how it can withstand up to three days of
    consecutive attacks.

    *   **Tests are steady and repeatable**: Consistency is when you self-test your
    system or network and achieve the same result using different approaches. If your
    results are not the same throughout, it is not steady. Scientifically, you should
    be able to file an explanation report for any form of inconsistency or invalid
    test result. You can also ask yourself a simple question that you should be expecting
    from your organization: If your test is repeated, would it have the same result?
    If you made sure your tests were repeated and you kept getting the same result,
    you can be confident that no matter how many times the same test is replicated,
    the result will be the same.

    *   **Test results should maintain consistency**: Your accurate result from a
    test should maintain a good timeframe (be a permanent result). If your tests are
    true, they will be received by your organization with more ease in cases in which
    the tests address permanent problems. If a test can address only transitory or
    temporary difficulties, it will be of little use.


    ## 9. THOU SHALT NOT STEAL THY NEIGHBOUR’S TOOLS .


    Always be satisfied with what you have. More tools for wireless hacking will keep
    storming the software market and no matter how many you have today, you will keep
    discovering new ones. More tools will be coming out from time to time because
    technology is here to stay. In the early days of wireless hacking, there were
    a limited choice of tools compared to the plethora we have today. Take, for instance,
    `Network Stumbler`, which used to be known as `NetStumbler` on the Windows operating
    systems. It has the same function as the `Kismet` software on Linux operating
    systems. There were limited software choices in earlier days. Now, you have more
    choices, like `WarLinux`, `Aerosol`, `AirScanner`, `APsniff`, `dstumbler`, `Gwireless`,
    `BSD-Airtools`, `iStumbler`, `MacStumbler`, `KisMAC`, `Mognet`, `MiniStumbler`,
    `THC-RUT`, `PocketWarrior`, `THC-Scan`, `PocketWiNc`, `THC-WarDrive`, `WarLinux`,
    `Radiate`, `WiStumbler`, `Wellenreiter`, `Wlandump` and much more. These are just
    the free ones available on the internet. The premium tools which you can purchase
    are `AiroPeek`, `Air Sniffer`, `AirMagnet`, `AP Scanner`, `Sniff-em`, `NetChaser`
    and `Sniffer Wireless`. The idea here is simple: If you have more money and time,
    you can go to the Internet and download the free tools or purchase the ones you
    need. Do not steal or be tempted by your neighbor’s tools. Get your own and become
    accustomed to them.


    ## 10. THOU SHALT ACCOUNT ALL FINDINGS .


    When someone’s privacy is on the line with an action or test, they get nervous
    about whatever might be going on. For this reason, make sure you are providing
    timely updates on your progress. Avoid keeping people in suspense when they already
    know you are breaking into their network. Frequent updates are critical. During
    your findings, every vulnerability you discover must be reported immediately.
