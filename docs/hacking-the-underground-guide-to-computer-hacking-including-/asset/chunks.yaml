    回想 WEP 是一种对称算法，在加密和解密时使用相同的密钥。发送者和接收方必须拥有相同的密钥才能确保操作顺利。此外，如果他们必须共享密钥，就必须有一种安全交换这些共享密钥的方法。这种共享需要以这种方式进行以防止他人的入侵。


    `802.11` 标准中关于密钥管理的细节并不多。事实上，密钥管理是加密系统最关键的方面。显然，根据 802.11 系统，密钥管理被遗留给了用户。密钥管理是
    WLAN 环境容易受到许多漏洞的原因之一。它还导致密钥分发问题悬而未决。外行人如何做才能确保密钥交换的安全呢？如果不正确理解如何安全地交换密钥，将无法正确使用受
    WEP 保护的 WLAN。


    当一个组织意识到需要频繁更改密码并使其随机化时，他们希望立即实施更改。然而，在大型 WLAN 环境中，这种任务并不容易。可能会有 4,000 台工作站需要更改，这会非常累人。这
    4,000 台工作站中的每一台必须共享相同的秘密密钥——而且每台工作站的所有者必须对密钥保密。对于像这样的大型环境，生成、加载、分发和管理密钥面临着巨大的挑战。如果黑客破解了一个客户端，他或也将获得所有其他工作站的密钥。


    # 使用 WPA


    802.11 标准的另一个版本是 `802.11i`。标准末尾的“i”表示比之前的版本更高。IEEE `802.11i` 定义了健壮安全网络，通常被称为 `RSN`。任何可以运行此标准的接入点将只允许具备
    RSN 能力的设备与其连接。将 RSN 视为一个随着技术进步而演进的环境，因为它提供了网络所需的安全特性或服务。


    然而，通过使用 RSN 实现的 IEEE `802.11i` 标准并不意味着它是完全完美的。只有时间才能证明该标准是否存在缺陷。然而，`802.11i` 的特性将在本节中提到，在我们之后讨论
    AES 加密时也会提到。并不是每个喜欢硬件和这个 802.11i 标准的人都愿意接受硬件的注入。每个人都需要改进的安全性，而该功能中硬件的使用可能会是一个问题。这就是
    WPA 出现的地方。


    将 WPA 视为一种改进 WLAN 解决方案的方案。用通俗的话说，Wi-Fi 访问（WPA）是一项改进 WLAN 安全性的计划，最重要的是解决了 WEP 的问题。WPA
    使用了一种名为 `TKIP`（临时密钥完整性协议）的特性，它可以在不需要调整硬件的情况下解决问题。简而言，WPA 通过修改软件和固件驱动程序来解决问题。此外，`TKIP`
    本身是 RSN 的一部分，这提供了灵活性。


    WPA 被认为是固件或软件补丁的合适示例，因为它不直接处理硬件。作为过渡安全解决方案，Wi-Fi 保护访问不需要对现有的 802.11 设备进行硬件升级。然而，IEEE
    `802.11i` 标准确实需要升级。没有什么完美的，这就是为什么我们可以说在安全特性方面 WPA 是最好的。无论如何，WPA 仍然是一个很好的选择，因为其尝试提供针对长期
    WEP 问题的增强保护，而这些问题在 802.11i 安全特性出现之前就已经存在了。WPA 有两个关键特性：


    * `802.1X` 支持。

    * `TKIP`（临时密钥完整性协议）。


    WPA 使用 `802.1X` 端口访问控制按分段分发密钥。此最大的优势是它提供了一个允许使用健壮的上层认证协议的框架。


    与提供分段密钥分发功能的 `802.1X` 不同，`TKIP` 提供的更多。临时密钥完整性协议允许密钥混合，并还给你一个更长的 `IV`（初始化向量）。然而，并非于此。`TKIP`
    还为你提供了消息完整性检查，被称为 `MIC`。你知道当你在无线网络上传输数据时，你的传输数据有被窃听的机会吗？`MIC` 的出现解决了这个问题，因为它防止了无线数据在传输过程中被修改。此外，这些特性为无线网络安全提供了额外的支持，包括：


    * 密钥管理。

    * `IV` 空间的扩展。

    * 促进。加密密钥应该频繁更改。然而，`TKIP` 帮助你促进会话密钥的使用。

    * 四种帮助你增强 802.11 安全性的新算法。

    * 密钥分发和派生。

    * 包密钥构建。

    * 所有这些属性也意味着它提供了整体的加密完整性。


    说临时密钥完整性协议防御了前面提到的的许多安全攻击是准确的。某些攻击包括重放攻击或对数据完整性的攻击。最重要的是，`TKIP` 帮助你频繁更改密钥，这是一个极大的属性。WPA
    的最初目标是向市场引入一种基于标准的安全解决方案以取代 WEP，直到 IEEE 802.11i `RSNs`（基于对现有 WLAN 标准的修订）可用。需要注意的是，RSN
    包含了用于完整性和机密性的 `AES` 加密。


    WPA 本身远非完美，因为它也有自己的问题。黑客可能会破解基于字典中单词的短密码语组成的 Wi-Fi 保护访问预共享密钥。基于字典的密钥很容易破解，因为黑客可以监控只需要几秒钟即可完成的短交易。黑客可以看到打字速度和输入字符串的长度。


    其他安全手段具有防止它们被轻易攻击的工具。WPA 也有自己用于破解密钥的软件/工具。你可以使用名为“WPA Cracker”的工具（在 `www.tinypeap.com/page8.html`
    下载）。该工具在某种意义是原始的，因为它要求你输入通过嗅探器检索到的准确信息。为了学习，建议使用 ethereal 作为你的嗅探工具。


    在使用 WPA 时，你可以通过遵循这些指南来保护自己：


    * 确保你选择了一个良好的密码。不要使用字典中可以找到的单词组成的密码。

    * 确保你的密码至少由 20 个字符组成。你也可以借此避免暴力攻击。

    * 随机选择你的密码。

    * 确保你使用 WPA 企业版——或者更好，配合 WPA 使用 `802.1X`。

    * 确保你使用 `VPN`（虚拟专用网络）技术。


    WPA、RSN 和 `TKIP` 是非常复杂的话，这些领域仍在进行许多研究。如果需要，你可以在网上找到更多信息。


    # 组织加密攻击应对措施


    安全不仅适用于家庭，因为组织也无法免疫攻击。这就是为什么组织应该在可行的情况下采用家庭网络提供的策略。无论你采用哪种策略，都应该用以下措施之一进行补充：


    * `WPA2` 技术

    * `VPN` 技术


    ## 使用 WPA2


