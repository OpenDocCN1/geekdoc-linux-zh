- fmt: '

    Blind testing refers to a scenario in which the tester only has the details of
    the enterprise, like the name of the target. This approach gives security staff
    some time to investigate the nature of an application attack and where it is most
    likely to take place.


    Penetration testing includes all activities that are undertaken by IT professionals
    to discover the flaws in a system. Although it is important to stay ahead of new
    vulnerabilities, it is difficult to stay on top of recent hacking techniques and
    zero-day malware. This is why it is important to obtain a list of priority tests
    when doing a security audit.


    # SECURING YOUR WEBSITE


    Providing your website with adequate protection from a hacker is more important
    than ever before. The website owner must give visitors a safe surfing environment.
    Adequately securing the website protects it from being infected with malware,
    protects your visitor''s details, improves your web ranking and ensures you continue
    doing business for a long time. Keep in mind that once your website is hacked,
    it is very difficult to put it back together. You will lose customers when your
    website goes down and your reputation will also be lost.


    We have talked about the various flaws that can be exploited on the server and
    client sides of a website. Some of these attacks are very difficult to detect
    and that is why prevention is the best policy.


    If you run a website based on a content management system like `WordPress` or
    `Joomla`, always install security plugins that are available on that CMS. `Sitelock`
    is a valuable tool that scans a website daily for flaws, malware and viruses.
    Investing in a good cloud protection service is also a great idea, as it will
    filter all of the content that reaches the site and screen out suspicious traffic
    and bots.


    One of the most popular and commonly executed website attacks is the `SQL injection`.
    Exploiting this flaw gives a hacker access to private information. This type of
    attack is executed on websites that have form fields which accept user input.
    A very good way to prevent this attack is to use parameterized queries. This ensures
    the website contains parameters that make it impossible to insert malicious codes.


    We also talked about cross-site scripting attacks, or `XSS` attacks for short.
    We now know that cross-script attacks are a result of `JavaScript` codes that
    are executed in the client''s browser. As with the `SQL injection` attack, preventing
    the `XSS` attack requires that the programmer or developer state explicitly what
    entries are allowed in a browser’s various user input fields. A great way to do
    this is by implementing a content security policy, or `CSP` for short. This will
    give directions to the browser for different entry fields, including which field
    should allow for executable scripts and which should not.


    For websites that require user login information, it is important to insist on
    strong passwords when the user registers. Users should create a password that
    is a mixture of letters, numbers and special characters or symbols. It is also
    important to ensure that passwords are encrypted when users log into the website.
    This measure makes it difficult for hackers to crack the password if they happen
    to execute a man-in-the-middle attack. Also keep in mind that it takes just one
    weak password for a hacker to gain access to all of the accounts.


    Also ensure that user inputs are properly validated when they are typed in and
    when they are sent over to the server. This client side and server-side validation
    ensures that malicious codes are not mistakenly executed. Regarding the browser,
    on the web page, it is important to define the fields that require input and to
    also make sure they follow the input field specification. A field that is meant
    for numbers should reject a letter or a special character input before the content
    is sent to the server for another phase of input validation.


    If you run an e-commerce store, a banking app or any other website that accepts
    and stores very sensitive information, get an SSL certificate. This provides an
    extra layer of security for your website. Customers and clients who visit your
    site will rest easy when they see that `HTTPS` precedes your website URL. This
    `HTTPS` encrypts all of the information traveling to and from your server. It
    renders any information being sought by a hacker as useless even if he or she
    is performing the sniffing attack.


    Error messages displayed to the user should be kept minimal. If an error message
    is to be shown to the user at all, it should not include vital information like
    the database type or error code. It is a good idea to configure the error message
    to display a generic message because error messages give a hacker information
    about the underlying structure of the website or web app, which can be used to
    coordinate a targeted attack.


    It is also important that your admin username and password are very strong. Make
    sure there is a limited number of login trials on the login page. Ensure that
    security questions are asked when a user uses the “forgot password” link. Even
    if the user gets the question right, avoid sending the login username, password
    or other credentials to the user''s email.


    Make sure you set strict permissions that need to be granted before anyone can
    access your files. Ensure that only the admin can edit some files, while keeping
    other files readable for the website’s users. It is also a useful practice to
    limit the number of files that can be uploaded on your website. Through file uploads,
    it is easy to embed malicious codes that can open up a website to attacks. Make
    sure that all uploaded files are saved in a private folder and can only be shown
    by executing a script written solely for that purpose. Furthermore, you should
    not allow the uploaded files to reach the root folder.


    As with web apps and websites, it is important that we ensure that when coding
    or working with programmers on a project, we adopt what is known as secure coding
    practice. Examples of secure coding practice include designing a system for maximum
    protection against hacks, building each module separately, testing modules for
    flaws and merging everything together so that the entire application can be tested
    for other vulnerabilities.


    It is also a good policy to keep designs as simple as possible. Complex websites
    or web app designs are more prone to errors and issues that a malicious user can
    take advantage of. As mentioned throughout this book, data sanitization is very
    important for securing your website or web app. Always sanitize the data that
    is flowing through your application, whether it is coming from the user, the server
    or even a third-party-linked application.


    # CONCLUSION


    Securing your website, web app and devices is a never-ending process. To get started,
    you should list all of the devices, networks, websites and web apps you work with.
    After doing this, analyze each of them and find out the various flaws that can
    be exploited by a hacker. If you have been attacked before, how did it happen?
    What were the initial signs before you were hacked? Are those flaws still present
    in the system or network? What steps did you take to minimize the damage and what
    steps have you taken to ensure it does not occur in the future? Answering these
    questions will give you perspective. These questions will help you find parts
    of your system that could be the focus of an attack and also help you focus more
    of your security efforts in the right places. They will also help you determine
    the kind of people you will need for each job and the kind of tools that will
    do those jobs effectively. You will be able to hire people who have the necessary
    skills to get the job done without compromising security or quality.

