  trans: '

    由于技术在几乎所有活动中的应用日益增加，公司和组织投入了巨资以确保它们所使用的技术能够免受黑客的攻击。这些公司已经开发并实施了广泛的防火墙，以防止任何可能的安全泄露。尽管通过互联网连接获取信息非常方便，但大多数互联网用户并没有安全意识。加之事实，大多数恶意黑客将精力集中在计算机服务器和客户端应用程序的漏洞上。多年来，这些黑客在收集信息以及构建对网站和网络应用程序的攻击方面变得更有创意了。考虑到在网络安全上投入的巨资，我们本以为恶意信息窃取或控制应该已经消失。然而，事实并非如此。


    这就是我们利用社会工程学来实现目标的地方。这是一种非技术的方法，可以绕过公司的安全措施。无论公司的在线应用程序有多安全，它们仍然容易受到黑客攻击。黑客已经通过社会工程学和基于社会工程学的工具实现了这一点。社会工程学是一种实操性的黑客方法。它针对个人并操纵他们提供关键信息，从而导致安全系统的泄露。这些个人可能是组织的员工，甚至是目标组织高层的亲属，他们会被接触并迫使信任黑客。他们开始收集在黑客过程中可能有用的信息。这通常是公司防火墙能够有效阻止外部渗透时采取的方法。当黑客获取了必要信息（例如，社会工程学目标的登录信息），他们就可以从内向外对公司进行攻击。


    人们认为，人类是任何信息安全链中最薄弱的环。。社会工程学的物理方法有多种发生方式，在本章中无法涵盖所有方法。然而，流行的手段包括接触公司员工并成为他们的朋友（甚至是亲密伴侣）。有时，员工会收到一个包含电影或其他他们感兴趣的文件的闪存驱动。员工插上驱动器并启动一个在后台执行脚本的文件，从而授予黑客访问相应机器的权限。社会工程学攻击也发生在有人给公司员工打电话时，冒充呼叫中心代表并告诉员工他们需要信息来纠正一项重要的服务。黑客可能通过员工的社交媒体账户或与该人的私人对话收集了有关员工的细节。一旦黑客获取了信息（可能包括受害者的社会安全码或登录详情），黑客就会劫持账户并在上面进行欺诈交易，或将其用于额外的攻击。社会工程学使得构建有帮助的用户名和密码列表变得简单。


    ### 社会工程学工具包 (SET)


    社会工程学工具包是计算机辅助社会工程学攻击中使用的非常重要的工具。它预装在 Kali Linux 中。用 Python 语言编写，也是开源工具包。社会工程学工具包或
    `SET`，由 David Kennedy 创建，用于利用安全中的人性因素。然而，确保社会工程学工具包保持更新是非常重要的。一旦工具更新，就可以设置配置文件。默认配置文件足以让
    `SET` 无任何问题地运行。高级用户可能想要编辑和调整某些设置。但是，如果你是初学者，最好在变得更熟悉社会工程学工具包之前保持其原样。要访问配置文件，打开终端并切换目录到
    `SET`。打开 `config` 文件夹，你将发现 `set_config` 文件，你可以用文本编辑器打开并编辑。


    可以通过点击应用程序图标，然后点击 Kali Linux 桌面访问社会工程学工具包。接下来，点击 BackTrack，然后点击 Exploitation Tools
    选项。点击 Social Engineering Tools 并通过点击 `SET` 选择社会工程学工具包。`SET`将在终端窗口中打开。或者，也可以直接在终端中输入
    `setoolkit`（不带引号）来打开 `SET`。


    社会工程学工具包在终端中以基于菜单选项的形式打开。菜单包含根据你需要的社会工程学攻击类型提供的不同选项。编号 1 的选项用于鱼叉式钓鱼攻击向量，它允许用户执行钓鱼攻击。钓鱼攻击是一种电子邮件攻击。就像通过向随机潜在受害者发送电子邮件来撒网。相反，鱼叉式钓鱼针对特定的个人，且邮件更具个性化。


    `SET` 菜单上的第二个选项是网站攻击向量，它使用不同的网络攻击方法针对其目标受害者。网站攻击向量选项是社会工程学工具包中最受欢迎、可能也是最常用的选项。点击网站攻击向量选项将打开包含
    Java applet 攻击向量、Metasploit 浏览器漏洞、用于克隆网站的凭据收集器攻击、tabnabbing 攻击、中间人攻击、web jacking
    攻击和多重攻击网络方法的菜单。

    '
- fmt: '

    The third option on the Social Engineering Toolkit menu is the infectious media
    generator tool. This is a very easy tool to use and is targeted at individuals
    who can give a hacker access to the organization network, thus enabling the hacker
    to hack from inside the network. This tool allows the hacker to create a USB disk
    or DVD containing a malicious script that gives the hacker access to the target
    shell. Choosing this option opens a menu with a prompt to choose from between
    a file-format exploit or a standard `Metasploit` executable. Choosing the file-format
    option opens a list of payloads from which to select. The default is a `PDF` file
    embedded in an executable script. This is then sent to the drive where the `autorun.inf`
    is created with the `PDF` file. When an employee opens the file on the drive,
    the file is executed in the background and the hacker gains shell access to the
    victim''s computer.


    The fourth option is the `generate-a-payload-with-listener` option. This option
    allows the hacker to create a malicious script as a payload and therefore generate
    a listener. This script is a `.exe` file. The key is getting the intended victim
    to click and download this script. Once the victim downloads the `.exe` file and
    executes it, the listener alerts the hacker, who can access the victim''s shell.


    The fifth option in the Social Engineering Toolkit is the mass mailer option.
    Clicking this option brings up a menu with two options: single email address attack
    and the mass mailer email attack. The single email address attack allows the user
    to send an email to a single email address while the mass mailer email attack
    allows the user to send an email to multiple email addresses. Choosing this option
    prompts the user to select a list containing multiple email addresses to which
    the email is then sent.


    Sixth on the list is the Arduino-based attack. With this option, you are given
    the means to compromise Arduino-based devices. The seventh option, on the other
    hand, is the `SMS` spoofing option, which enables the hacker to send `SMS` to
    a person. This `SMS` spoofing option opens a menu with an option to perform an
    `SMS` spoofing form of attack or create a social-engineering template. Selecting
    the first option will send to a single number or a mass `SMS` attack. Selecting
    just a single number prompts the user to enter the recipient''s phone number.
    Then you are asked to either use a predefined template or craft your own message.
    Typing `1` chooses the first option while typing `2` chooses the second option
    depending on your preference for the `SMS`. Then you enter the source number,
    which is the number you want the recipient to see as the sender of the `SMS`.
    Next, you type the message you want the recipient to see. You can embed links
    to a phishing site or to a page that will cause the user to download a malicious
    `.exe` file. After the message has been crafted, the options for services used
    in `SMS` spoofing appear on the screen. Some are paid options and others are free.


    Option eight in the `SET` is the wireless AP attack vector. This option is used
    to create a fake wireless AP to which unsuspecting users of public Wi-Fi can connect
    and the hacker can sniff their traffic. This option uses other applications in
    achieving this goal. `AirBase-NG`, `AirMon-NG`, `DNSSpoof` and `dhcpd3` are the
    required applications that work hand in hand with the wireless AP attack vector.


    Option nine in the menu is the `QR` code attack vector. Today, `QR` codes are
    used everywhere, from the identification of items to obtaining more details about
    products on sale. Now `QR` codes are even used to make payments. Some websites
    use `QR` codes for logins or as web apps. This login method is used because it
    is perceived as a more secure way of gaining access due to hackers’ being able
    to steal cookies, execute a man-in-the-middle attack and even use a brute-force
    password to gain unauthorized access. However, this increase in the use of `QR`
    codes has given hackers more avenues for exploiting their victims. The `QR` code
    attack vector helps the hacker create a malicious `QR` code. Then the hacker creates
    or clones a website like Facebook using the credential harvester option and embeds
    this malicious `QR` code with the link to the cloned website. The hacker then
    sends a phishing email or spoofed `SMS` to a victim, which prompts that person
    to scan the code with a mobile device. This reveal’s the victim’s GPS location
    and other information when the victim visits the website and enters their login
    details.


    The tenth option in the menu is the `PowerShell` attack vector. This option allows
    the hacker to deploy payloads in the `PowerShell` of an operating system. The
    `PowerShell` is a more powerful option than the command prompt in the Windows
    operating system. It allows access to different areas of the operating system.
    It was developed by Microsoft to ease the automation of tasks and configuration
    of files and has come with the Windows operating system since the release of Windows
    Vista. The `PowerShell` attack vector enables the attacker to create a script
    that is then executed in the victim’s `PowerShell`. The selection of this option
    brings out four menu options: `PowerShell alphanumeric injector`, `PowerShell
    SAM database`, `PowerShell reverse` and `PowerShell bind shells`. Any of these
    options creates a targeted `PowerShell` program and is exported to the `PowerShell`
    folder. Tricking the target to access, download and execute this program creates
    access for the attacker.


    By now, you should realize how powerful the `SET` is in executing computer-aided
    social engineering attacks. This tool is very valuable for a penetration tester,
    as it provides a robust and diverse means of checking the various vulnerabilities
    that may exist in an organization’s network.


    ## BeEF


    `BeEF` stands for Browser Exploitation Framework. This tool comes with most of
    the security-based Linux distro, like the `Parrot OS` and `Kali Linux`. `BeEF`
    started as a server that was accessed through the attacker''s browser. It was
    created to target vulnerabilities in web browsers that would give access to the
    target systems for executing commands. `BeEF` was written in the `Ruby` language
    on the `Rails` platform by a team headed by `Wade Alcorn`. As stated before, passwords,
    cookies, login credentials and browsing history are all typically stored on the
    browser, so a `BeEF` attack on a client can be very nasty.


    On `Kali Linux`, however, `BeEF` has been included in the distro. The `BeEF` framework
    can be started by going into applications, clicking on exploitation tools and
    then clicking on the `BeEF XSS framework`. This brings up a terminal that shows
    the `BeEF` framework server has been started. Once the server has been started,
    we open our browser of choice and visit the `localhost` at port `3000`. This is
    written in the URL space of the browser as `localhost:3000/ui/authentication`
    or `127.0.0.1:3000/ui/authentication`. This would bring us to the authentication
    page of the `BeEF` framework, requiring a login username and password. By default,
    the username is `beef` ; the password is also `beef`.

    '
