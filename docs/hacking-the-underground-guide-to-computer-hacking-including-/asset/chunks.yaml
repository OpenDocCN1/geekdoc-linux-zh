    ## SECURITY AWARENESS AND TRAINING


    Some things are naturally easy to avoid. Take, for instance, getting management
    or staff to pay attention to information; this is not an easy task. Some companies
    will take care of such things for you and help you get the message across:


    - Greenidea, Inc. Visible Statement: [www.greenidea.com](http://www.greenidea.com)

    - The Security Awareness: [www.thesecurityawarenesscompany.com](http://www.thesecurityawarenesscompany.com)

    - Security Awareness, Inc. Resources: [www.securityawareness.com](http://www.securityawareness.com)

    - U.S. Security Awareness: [www.ussecurityawareness.org](http://www.ussecurityawareness.org)


    ## WIRELESS TOOLS


    The wireless sections in this book have many details about tools. We have described
    numerous tools that can be used in wireless networks. Most of the tools mentioned
    above were summarized and information was provided about where to get them. However,
    in case you are just starting out, the tools we will mention will make for a nice
    list.


    Have you ever heard the term “cross-platform”? This refers to programs that have
    the ability to work on any kind of computer regardless of the type of OS on the
    system. All tools are placed in the category, which defines what they do. However,
    among all these tools, there are some that defy categorization. Instead of ignoring
    these excellent tools, we have made the following list:


    - BLADE Software Informer: [www.bladesoftware.net](http://www.bladesoftware.net)

    - Foundstone SiteDigger Google tool: [www.foundstone.com/resources/freetools.htm](http://www.foundstone.com/resources/freetools.htm)

    - MAC-address-vendor lookup: [http://coffer.com/mac_find](http://coffer.com/mac_find)

    - SMAC MAC-address editor for Windows: [www.klcconsulting.net/smac/](http://www.klcconsulting.net/smac/)

    - WiGLE database: [www.wigle.net/gps/GPSDB/query/](http://www.wigle.net/gps/GPSDB/query/)

    - WiFimaps: [www.wifimaps.com](http://www.wifimaps.com)


    ## VULNERABILITY DATABASES


    You obviously can’t solve a problem without knowing its origin, and you can’t
    stay protected if you are not taking measures yourself. As an ethical hacker,
    you must understand the vulnerabilities or weaknesses associated with your software
    or hardware. When you engage in the planning process, the information you receive
    will determine the type of tests you will perform on your system. Some of the
    vulnerability databases are:


    - US-CERT Vulnerability Notes Database: [www.kb.cert.org/vuls](http://www.kb.cert.org/vuls)

    - NIST ICAT Metabase: [http://icat.nist.gov/icat.cfm](http://icat.nist.gov/icat.cfm)

    - Common Vulnerabilities and Exposures: [http://cve.mitre.org/cve](http://cve.mitre.org/cve)


    ## LINUX DISTRIBUTIONS


    As famous as the Windows operating system is, it is not the best OS for some wireless
    testing tools. When we want to talk about the best operating systems out there,
    we can look at LINUX, UNIX or BSD. Many wireless testing tools operate perfectly
    on these operating systems. This means you need to familiarize yourself with not
    just Windows but also these other operating systems. As a Linux user, you can
    purchase a commercial product like Red Hat Linux or SuSe. The only problem is
    that it is overkill for your purposes. Instead of purchasing those tools, why
    not try the free Linux distributions? Below is a list of distributions you can
    use for free:


    - Auditor: [http://new.remote-exploit.org/index.php/Auditor_main](http://new.remote-exploit.org/index.php/Auditor_main)

    - Cool Linux CD: [http://sourceforge.net/project/showfiles.php?group_id=55396&release_id=123430](http://sourceforge.net/project/showfiles.php?group_id=55396&release_id=123430)

    - DSL (Damn Small Linux): [www.damnsmalllinux.org/](http://www.damnsmalllinux.org/)

