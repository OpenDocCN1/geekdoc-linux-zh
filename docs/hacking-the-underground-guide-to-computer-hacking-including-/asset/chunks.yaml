  raw: 'The mode of operation is usually to discover the various input fields that
    exist in an app or website, then to test each field to see how the website responds
    to each command. This allows us to determine the type of database at play on the
    website and also to predict whether the website or web app is prone to a SQL injection
    attack. A command like SELECT, which is used to retrieve information from the
    database, is by far the most common command sent by the website or web app because
    a user would almost always need information present in the database. The UPDATE,
    DELETE and INSERT commands, which are used for modifying, deleting and inputting
    new information into the database, are also very common SQL commands. During the
    probing stage of the attack, the hacker tests different commands and observes
    the response he or she receives. Error reports, in this case, help the hacker
    identify the operating system and the database type with which the server is working
    at the time. This also enables the hacker to build a query list that matches the
    database in question. However, for security reasons, the website may deliver a
    generic error message without revealing the database type or operating system
    under attack. This is known as a blind injection attack.


    Different tools exist on Kali Linux that make SQL injection possible and easy.
    One of these tools is Sqlsus. This tool is used to test and exploit MySQL injection
    flaws. The Sqlninja tool does the same thing, but focuses on the Microsoft SQL
    server-based database instead. The Sqlninja tool only exploits the flaws; it does
    not test for them. A more robust tool is the Sqlmap, which supports a large number
    of databases. It can discover injection flaws, accurately guess the type of database
    a website or web app uses, and execute commands that give its user total control
    over the targeted database. This tool is equally effective for both blind injection
    flaws and flaws that are error based. A tool that focuses on blind injection is
    the BBQSql, which is a blind SQL injection tool that operates by asking questions
    and by building the SQL attack based on the responses it gets.


