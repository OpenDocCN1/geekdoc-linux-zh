    and developed it. Just like Warden, Docker borrowed LXC in its beginning stage.
    As the container grew, LXC was replaced with Docker’s own “libcontainer.” One
    importance of Docker is that it provides an environment in which other containers
    can be managed. The container is composed of an image model that is layered and
    very efficient. It is essentially a register of different containers, API and
    so on. Lately, Docker has ventured into producing a container called “Docker Swam”
    that provides various management options.


    CoreOS, in a bid to replicate the Docker container, designed a very similar but
    much improved container called “Rocket.” It was established in 2014\. The actual
    purpose of CoreOS was to design a more secure container than Docker. On the App
    container, it is regarded as the standard. CoreOS produces other similar containers
    of the same brand including Docker examples such as CoreOS, flannel, etc.


    In 2015, Microsoft took a step toward including a container to assist its system
    server for apps that are Windows-based. This container is called “Windows container.”
    Although it was not yet released at that time, it was made public with the Windows
    server in 2016\. The execution of the project will make Docker function on Windows
    without the need for a virtual machine.


    ## THE FUTURE'
