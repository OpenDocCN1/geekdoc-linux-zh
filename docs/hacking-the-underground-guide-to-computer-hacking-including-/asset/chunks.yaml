  trans: '

    这种扫描使用基础 TCP 连接为目标机器上感兴趣的端口建立机制。扫描向特定系统发送一个 `SYN` 包，并等待读取其使用的数据包类型。如果收到的响应是 `SYN/ACK`
    包，则该端口处于`LISTENING”（监听）状态。如果扫描接收到 `RST/ACK` 包，则该端口不处于`LISTENING`状态，连接将被`RESET”（重置）。在收到
    `SYN/ACK` 的情况下，我们可以发送一个 `ACK`。当整个连接建立过程完成后，连接将终止。唯一的问题是 TCP 扫描很容易被检测。


    ### 3. TCP SYN 扫描


    也称为半开放扫描，它与 TCP 连接扫描不同，因为它不允许与目标机器上感兴趣的端口建立完整连接。系统发起并发送一个 `SYN` 包。如果你收到 `SYN/ACK`
    包，则表示该端口是`LISTENING`端口。如果收到 `RST/ACK` 包，则表示该端口是非监听端口。当收到 `SYN/ACK` 包时，连接会被断开并`RESET`。这会终止
    TCP 握手，且对站点的扫描尝试不会记录任何日志。


    ### 4. 代理扫描/文件传输协议反射扫描


    在代理扫描中，攻击者尝试连接到具有可写目录的 FTP 服务器，建立控制通信连接，并请求 FTP 服务器启动活动数据传输过程，以便其跨互联网发送文件。


    ## 端口扫描技术


    有很多端口扫描技术，但我们将只讨论五类：


    1. `Slow scan`（慢扫描）

    2. `Fragmentation scan`（分片扫描）

    3. `Random port scan`（随机端口扫描）

    4. `Decoy scan`（诱骗扫描）

    5. `Coordinated scan`（协调扫描）


    慢扫描利用入侵检测系统判断是否有特定 IP 地址试图扫描相关网络。这被称为站点检测阈值；攻击用户通常非常有耐心，给扫描留出足够的运行时间。


    在分片扫描中，所有携带数据的 IP 包都会被分片，并使用 TCP 进行数据分片。这种分片将目标端口和源端口与发送的第一个包关联。通常需要 8 字节的数据来包含源和目的端口号。这会将
    TCP 标志推入第二个分片，而某些入侵检测系统和过滤设备在扫描期间会假设被扫描的网络已经通过访问列表检查，从而进行重组。Linux 是一个很好的例子，因为它在`CONFIG_IP_ALWAYS-DEFRAG`内核选项上有一个过滤设备。


    随机端口扫描通过对探测端口序列随机化来防止检测。它使用商业入侵检测系统搜索连续的连接尝试。当模式发现匹配时，就会报告端口扫描。


    某些网络扫描器在攻击期间启用了诱骗功能或使用了伪造地址。诱骗功能会导致入侵检测系统假设目标网络正受到所有主机的端口扫描，因此钓出真正的攻击者几乎是不可能的。在过去，入侵检测系统通过使用扫描数据包中的
    `TTL`（存活时间）字段值来检测诱骗主机。如果 `TTL` 值是恒定的，它们看起来就像是出厂生成的。在诱骗主机中检测真实扫描的另一种方法是追踪源地 IP
    地址的路由。如果使用了不可路由的 IP 地址，将导致拒绝服务。当 IP 地址属于网络上不存在的主机时也可能发生这种情况。为了防止这种情况发生，攻击者会使用已经运行的主机的伪造
    IP 地址。


    协调扫描用于针对单个主机或整个网络。当攻击者合作以实现试图非法访问目标网络的共同目标时，扫描就是协调的。当多个 IP 地址探测目标网络时，它们都从不同的机器在不同的时间进行探测，这使得检测这些扫描几乎成为可能。协调攻击如果执行得当，是探测目标最有效的方法，因为它几乎无法被检测。


    识别运行在目标主机/机器上的操作系统是非常重要的，因为有很多安全漏洞依赖于操作系统。攻击者可以扫描范围 IP 地址以获取 UDP、TSP 端口及其操作系统类型。当发现依赖于操作系统的安全漏洞时，系统只需要通过列表并匹配信息即可。


    有许多服务可以识别操作系统。最著名的是`TELNET` 服务。识别操作系统的第二个服务是 `DNS HINFO Record`记录，它使用主机的信息记录来配对识别主机操作系统和硬件类型的字符串。`DNS
    HINFO Record` 效果并不理想，因为它已经过时了，结果是大多数管理员都避免使用它。


    TCP 栈实现中的不同变体用于通过栈指纹识别技术确定远程操作系统。IP 栈指纹识别的原理在于，它向目标 IP 发送 TCP 包并等待响应，这种响应在不同的操作系统上是不同的，并且随着不同厂商对
    IP 栈的实现而异。


    TCP 栈指纹识别使用 `Nmap` 和 `Questo` 等工具。`Nmap` 拥有比任何其他工具更大的操作系统响应数据库。为了获得最准确的结果，`Nmap`
    需要目标主机上至少有一个端口开放。


    以下是用于确定操作系统类型的探测类型和过程：


    * fin 探测

    * 虚假标志探测 (bogus flag)

    * TCP 初始序列采样

    * 初始窗口

    * ACK 值

    * ICMP 错误消息抑制

    * “不分片位”

    * ICMP 消息引用

    * ICMP 错误消息回显完整性

    * 分片处理

    * TCP 选项


    ### 1. FIN 探测


    要使用 `FIN` 探测，我们针对一个开放端口并发送 `FIN` 探测。然后等待回复。理想情况下，这种回复不会到来。`RFC793` 的预期行为确保 `FIN`
    探测不会收到响应。大多数栈实现将通过 `RESET` 响应。这些系统包括 Windows、CISCO、BSDI、IRIX 和 HP-UX 以及 MVS，它们会返回
    `RESET`。


    ### 2. 虚假标志探测


    此类探测使用带有未定义标志的 `SYN` 包并将其发送到目标主机。运行内核早于 `2.0.35` 的 Linux 操作系统设备将在其返回的响应中记录标志集。然而，某些操作系统在收到
    `SYN+BOGUS` 探测时似乎会`RESET` 连接。


    ### 3. TCP 初始序列号采样


    在这里，我们可以搜索在 TCP 实现中为了响应链接或连接请求而最初使用的序列号的模式。


    我们可以将其分为不同的组：


    * 传统的 64k（旧版 Unix）

    * 随机递增（如 DG-UX、新版本的 Solaris、FreeBSD、IRIX）

    * 使用时间依赖系统的窗口框（MS Windows）

    * 真正的“随机”（OpenVMS、Linux 等）


    ### 4. “不分片位”


    为了提高性能，某些操作系统会设置“不分片位”。


    监视这种行为可以为攻击者提供有关目标操作系统的额外信息。


    ### 5. TCP 初始窗口


    多个栈实现的返回数据包的初始窗口大小是独特的。例如，AIX 仍然是使用 `0x3F25` 值的操作系统。`FreeBSD` 和 `OpenBSD` 使用 `0x402E`。


    ### 6. ACK 值


    在某些情况下，由于 `ACK` 字段中设置的值存在差异，IP 栈可能会发生更改。

    '
- fmt: '

    For example, suppose you send the message ‘FIN|PSH|URG’ to the TCP closed port.
    In most implementations, the `ACK` in the returned packet is set to be the same
    as the sequence number. Windows responds better to an `ACK` field with the `+1`
    sequence number.


    ### 7. ICMP error message quenching


    Some operating systems follow the `RFC 1812` advice of limiting the sending rate
    of the various error messages. Only a few operating systems are known to follow
    this `RFC`. In the `Linux` kernel, for instance, the generation of destination
    unreachable messages is limited to 80 in every second. If this is exceeded, there
    is a quarter-of-a-second penalty. To test this, a hacker can generate a bunch
    of packets and send them to several high UDP ports that are chosen randomly. Then,
    the hacker will count the number of unreachable messages received.


    ### 8. ICMP message quoting


    An ICMP error message should quote a minute amount of information from the ICMP
    message that caused the error. The information received is quoted when the message
    ‘PORT UNREACHABLE’ is received in the IP header plus eight bytes (`IP header+8byte`).


    ### 9. ICMP error message echoing integrity


    When an ICMP error message is sent back, certain stack implementations may intercept
    the IP header. If an attacker examines the types of alternations that have been
    made to the headers, the attacker may make certain assumptions about the target
