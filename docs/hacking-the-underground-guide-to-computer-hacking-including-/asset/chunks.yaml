    - WINE: [www.winehq.com/](http://www.winehq.com/)

    - Win4lin: [www.netraverse.com/](http://www.netraverse.com/)


    ## RF Prediction Software


    The radio frequency prediction software helps you simulate the radiation pattern
    of an AP without having to physically install one. As a tester, you can use the
    exact software you need to predict wherever you may find a signal. Following are
    three such programs you can use:


    - Airespace: [www.airespace.com/products/AS_ACS_location_tracking.php](http://www.airespace.com/products/AS_ACS_location_%20tracking.php)

    - Alcatel: [www.ind.alcatel.com/products/index.cfm?cnt=omnivista_acs_locationtrack](http://www.ind.alcatel.com/products/index.cfm?cnt=omnivista_acs_locationtrack)

    - Radioplan: [www.electronicstalk.com/news/rop/rop100.html](http://www.electronicstalk.com/news/rop/rop100.html)


    ### RF Monitoring


    Humans create machines, but a machine’s results can be more accurate than those
    of humans. Monitoring a signal strength yourself without any tools can be very
    difficult. This is why you need a tool to help you test signal strength and bit
    error rate. Although we have already mentioned some tools you can use to monitor
    signal strength, such as `Kismet` or `NetStumbler`, their results are not as accurate
    as those of the following tools:


    - aphunter: [www.math.ucla.edu/~jimc/mathnet_d/download.html](http://www.math.ucla.edu/~jimc/mathnet_d/download.html)

    - E-Wireless: [www.bitshift.org/wireless.shtml](http://www.bitshift.org/wireless.shtml)

    - Gkrellm wireless plug-in: http://gkrellm.luon.net/gkrellm wireless.phtml

    - Gnome Wireless Applet: [http://freshmeat.net/projects/gwifiapplet/](http://freshmeat.net/projects/gwifiapplet/)

    - Gtk-Womitor: [www.zevv.nl/wmifinfo/](http://www.zevv.nl/wmifinfo/)

    - GWireless: [http://gwifiapplet.sourceforge.net/](http://gwifiapplet.sourceforge.net/)

    - Kifi: [http://kifi.staticmethod.net/](http://kifi.staticmethod.net/)

    - KOrinoco: [http://korinoco.sourceforge.net/](http://korinoco.sourceforge.net/)

    - KWaveControl: [http://kwavecontrol.sourceforge.net/](http://kwavecontrol.sourceforge.net/)

    - KWiFiManager: [http://kwifimanager.sourceforge.net/](http://kwifimanager.sourceforge.net/)

    - Linux Extensions: [http://pcmciacs.sourceforge.net/ftp/contrib/](http://pcmciacs.sourceforge.net/ftp/contrib/)

    - Mobydik.tk: [www.cavone.com/services/mobydik_tk.aspx](http://www.cavone.com/services/mobydik_tk.aspx)

    - NetworkControl: [www.arachnoid.com/NetworkControl/index.html](http://www.arachnoid.com/NetworkControl/index.html)

    - NetworkManager: [http://people.redhat.com/dcbw/NetworkManager/](http://people.redhat.com/dcbw/NetworkManager/)

    - Qwireless: [www.uv-ac.de/qwireless/](http://www.uv-ac.de/qwireless/)

    - Wavemon: [www.janmorgenstern.de/wavemon-current.tar.gz](http://www.janmorgenstern.de/wavemon-current.tar.gz)

    - WaveSelect: [www.kde-apps.org/content/show.php?content=1952](http://www.kde-apps.org/content/show.php?content=1952)

    - Wimon: [http://imil.net/wimon/](http://imil.net/wimon/)

    - Wmap: [www.datenspuren.org/wmap](http://www.datenspuren.org/wmap)

    - wmifinfo: [www.zevv.nl/wmifinfo/](http://www.zevv.nl/wmifinfo/)

    - WMWave: [www.schuermann.org/~dockapps/](http://www.schuermann.org/~dockapps/)

    - WmWiFi: [http://wmwifi.digitalssg.net/?sec=1](http://wmwifi.digitalssg.net/?sec=1)

    - Wscan: [www.handhelds.org/download/wscan/](http://www.handhelds.org/download/wscan/)

    - wvlanmon: [http://file.wankota.org/program/wavelan/](http://file.wankota.org/program/wavelan/)

    - XNetworkStrength: [http://gabriel.bigdam.net/home/xnetstrength/](http://gabriel.bigdam.net/home/xnetstrength/)

    - xosview: [http://open-linux.de/index.html.en](http://open-linux.de/index.html.en)


    ## Antennae


    An antenna can help you broadcast signals, but can also cost a lot of money. We
    understand that you are working on a budget and, therefore, you’t spend all your
    money on an antenna. The beauty is that you can build a custom antenna or purchase
    one for a reasonable amount of money. We have found some sites that offer economical
    antennae you can use for your ethical hacking work. The sites are:


    - Cantenna: [www.cantenna.com](http://www.cantenna.com)

    - Hugh Pepper’s cantennas, pigtails and supplies: [http://home.comast.net/~hughpep](http://home.comast.net/~hughpep)

    - Making a wireless antenna from a Pringles can: [www.oreillynet.com/cs/weblog/view/wlg/448](http://www.oreillynet.com/cs/weblog/view/wlg/448)


    And at the same time, you can find an excellent reference page for antennae at:
    [www.wardrive.net/general/antenna](http://www.wardrive.net/general/antenna)


    ## Wardriving


    According to Wikipedia, wardriving is the act of searching for Wi-Fi networks
    by a person who is in a moving vehicle, using a smartphone or a laptop. It can
    be a handy tool for your wireless ethical hacking kit. Luckily, numerous tools
    are available. They are:


    - Aerosol: [www.sec33.com/sniph/aerosol.php](http://www.sec33.com/sniph/aerosol.php)

    - Airscanner: [www.snapfiles.com/get/pocketpc/airscanner.html](http://www.snapfiles.com/get/pocketpc/airscanner.html)

    - AP Scanner: [www.macupdate.com/info.php/id/5726](http://www.macupdate.com/info.php/id/5726)

    - AirMagnet: [https://goo.gl/AXf4L](https://goo.gl/AXf4L)

    - AP Radar: [http://apradar.sourceforge.net](http://apradar.sourceforge.net)

    - Apsniff: [www.monolith81.de/mirrors/index.php?path=apsniff](http://www.monolith81.de/mirrors/index.php?path=apsniff)

