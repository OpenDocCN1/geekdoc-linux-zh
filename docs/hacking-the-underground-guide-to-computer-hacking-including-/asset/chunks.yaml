    This organization was formerly known as WECA and was formed in 1999. The Wi-Fi
    Alliance ([www.wifialliance.com](http://www.wifialliance.com)) started as a non-profit
    organization that certified the interoperability of all wireless LAN products
    based on IEEE 802.11 specifications. This company is very large now, as it has
    more than 200 subsidiaries from around the globe. Plus, it has more than 1,000
    certified devices.


