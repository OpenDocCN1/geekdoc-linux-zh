- fmt: '

    Because websites and web apps serve a lot of purposes, security is paramount.
    Whenever web apps or websites operate, the transmission of data occurs. Information
    transmitted between the web app and the database might be sensitive information
    that could be used for sinister purposes if it were to fall into the wrong hands.
    With the improved creativity and availability of tools capable of sniffing data
    transmissions and even altering them before they get to the server or client,
    a need exists for an increase in security when transmitting data. When data packets
    are intercepted and sessions are hijacked, they could grant access to the database,
    thereby exposing and compromising the operating system on which the web app or
    website is based. Using a disk encryption system and tokens can protect data in
    the database, but not when this data is being transmitted. So, to combat issues
    related to the security of transmitted data, the `SSL` or Secure Socket Layer
    was created.


    ## Secure Socket Layer (SSL)


    The Secure Socket Layer encrypts data being transmitted in its period of transmission.
    If an attacker happens to intercept that data, it would be useless to him because
    he would have to decrypt the data. The `SSL` secures the data transmission between
    the client and the server. The data being transferred through the `SSL` is encrypted
    before it is sent to the client or server, which then decrypts the message upon
    receipt with the help of a decrypted key included in the data transmission. However,
    the `SSL`, which was created in 1994, has been replaced by the more secure `TLS`.
    The replacement of the `SSL` was in large part due to its being prone to `CRIME`,
    `POODLE` and `BEAST` attacks. As you can probably tell, the `POODLE` is not a
    dog and the `BEAST`, in this case, is not an animal.


    ### SSL Attacks


    `POODLE`, which stands for Padding Oracle On Downgraded Legacy Encryption, is
    a result of a man-in-the-middle attack (`MITM`). The hacker initiates a man-in-the-middle
    attack on the user, takes total control of the router and then forces the browser
    to downgrade its `SSL` to a less secure protocol. The hacker then hacks the protocol
    and steals the information. However, in the `BEAST`, which stands for Browser
    Exploit Against SSL and TLS attacks, the hacker tries to guess each character
    of the encryption key used to protect the information being transmitted.


    ## Encryption Methods in SSL


    There are two main methods of encryption involved in using the Secure Socket Layer
    (`SSL`) transmission: asymmetric and symmetric.


    ### Asymmetric Encryption


    In this encryption type, when data is transmitted, it is done with a key (a public
    key), and once it gets to its destination it is again decrypted by a separate
    private key. To make this explanation of the concept a little more understandable,
    let''s use this analogy. Assume you have colleagues with whom you share sensitive
    information. Let’s call these people `Bob`, `Paul`, `Betty` and `Mike`. You build
    four different mailboxes (one for each of them) and you give each of them a padlock
    with his or her respective key. However, you also hold a copy of those keys. Then
    you buy your own four separate padlocks with keys just for you. Once they bring
    in their email, they lock it with their padlocks and your padlock as well. Whenever
    you want to take out the mail, you can unlock the mailbox with your key. In `SSL`,
    data is encrypted with a public key when it is transmitted and decrypted with
    a private key when it gets to its intended destination.


    The asymmetric encryption model is a secure model. The popular asymmetric encryption
    algorithm used includes the Elliptical curve cryptography (this is commonly used
    in handheld devices), Rivest Shamir Adleman or the `RSA` (this is the most popular
    asymmetric algorithmic encryption used today) and the `Diffie-Hellman` key exchange
    (this is perhaps the first asymmetric algorithm developed for data transmission).


    ### Symmetric Encryption


    Unlike in the case of asymmetric encryption, the same key is used for encrypting
    and decrypting the data. The two major ways by which the symmetric algorithm works
    is through Block cipher (in this type of symmetric encryption model, the data
    is encrypted in blocks) and Stream cipher (the transmitted data is encrypted bit
    by bit).


    The algorithms used in symmetric encryption are `DES`, `AES` and `IDEA`, which
    stands for Data Encryption Standard, Advanced Encryption Standard and International
    Data Encryption Algorithm, respectively.


    ## SSL Connection and MITM Attacks


    In a Secure Socket Layer (`SSL`) connection, the browser creates a key which is
    sent to a server, and the server authenticates this key. Then the data to be sent
    to the server is encrypted using the key previously generated for that session.
    A hashing function is used in authenticating or testing the integrity of the shared
    information. In an `SSL` connection, there is always a separate key exchange algorithm,
    an authenticating algorithm, a separate encryption algorithm and a unique hashing
    algorithm. These constitute the information initially shared between the client
    and the server to ensure proper encryption and decryption in the communication
    process.


    In an `MITM` – man-in-the-middle – attack, the hacker first attacks the user’s
    computer by posing as a server and using a fake certificate. The user’s browser
    then informs the user that the site’s certificate is fake. However, if the user
    continues creating the connection despite the warning, the user creates an `SSL`
    connection with the hacker. The hacker is then able to sniff and intercept the
    information being sent in the Secure Socket Layer. The hacker then proceeds to
    create an `SSL` connection with the originally intended server posing as the original
    user. However, since the hacker has been able to intercept the connection with
    the user, the server assumes the hacker is the user and completes the connection
    with the hacker.


    ### Tools in Kali Linux


    Tools in `Kali Linux` give us the ability to create an `SSL` connection and initiate
    a man-in-the-middle attack. Some of these tools come with the ability to create
    a fake certificate for authentication with the targeted user or client. Some widely
    known and used tools in testing SSL weakness and initiating a `MITM` attack are:


    - `SSL split tool`

    - `SSL strip tool`

    - `SSL strip tool`

    - `SSL scan tool`

    - `Open SSL tool`


    Some of these tools can scan `SSL` connections and determine the kind of key,
    authentication, encryption and hashing algorithm combination used in a connection.
    While the `SSL strip tool` can generate a certificate and trick the browser into
    believing it is communicating with the server, the `SSL sniff tool` fools the
    user into believing that a server can accept an unsecured connection.


    ## PHISHING


    Phishing is a popular web attack used by both scammers and hackers. By pretending
    to be an authentic and trusted authority, it manipulates the victim into giving
    out personal information. The hacker can achieve this by pretending to be a representative
    of an IT company or bank, an employee of an online payment system or even a friend
    from a social media website. Phishing is a social engineering attack technique.
    It attempts to pull a user to a website that is often a clone of an original website
    with which the user is familiar or that the user visits frequently.


    Phishing is usually achieved by cloning a legitimate website in the hopes of getting
    the user''s login details. The website is cloned to look exactly like the original
    website; a piece of code is written that collects the username and password used
    on the website. That information is then saved in a remote location, usually in
    text format. Next, this cloned website uses the user’s login credentials to create
    a login attempt on the original site so the user will be logged into the original
    website. This is a very important step in the phishing procedure, as it is essential
    that the victim does not suspect foul play during his or her attempt of logging
    into the website.

    '
