    # Installing the New Modules


    Installation of the modules is a little trickier because, by default, the module
    installation will want to overwrite existing modules. Modules are installed in
    the /lib/modules directory in a directory called after the kernel version. (Kernel
    version can be had with the uname -r command.) For my setup, this means a path
    of /lib/modules/2.0.35.


    To save the current modules, move them out of the way:


    ```

    [root@digital linux]# mv /lib/modules/2.0.35 /lib/modules/2.0.35-old

    ```


    Install the new ones with


    ```

    [root@digital linux]# make modules_install

    ```


    After the new modules install, set things back to the way they were so that the
    old kernel can still find them. You can do this by


    ```

    [root@digital linux]# mv /lib/modules/2.0.35 /lib/modules/2.0.35-apm

    [root@digital linux]# mv /lib/modules/2.0.35-old /lib/modules/2.0.35

    ```


    If the new kernel you are installing is a different version, then this step is
    unnecessary because the new modules will have a different version and directory.


    # Configuring LILO


    The final step in installing your kernel is setting up LILO. LILO (the Linux Loader)
    is the program that boots Linux from your disk. The LILO configuration file will
    look something like this:


    ```

    [root@digital /]# more /etc/lilo.conf

    #

    # general section

    #


    boot = /dev/sdb1

    install = /boot/boot.b

    ```'
  merge: -1
  img_proc: true
