- pgno: 35
  md: 'another. In this situation, you might have to iconify a window to get it out
    of the way or access the window you want through a menu or the taskbar.


    ![](img/edf072a03d4de1f8f4a13465ac79e7fb_35_0.png)


    The Windowlist menu in the panel gives you access to all your open windows. It
    provides a convenient way to access a window that is covered by another.


    # Scrollbars


    If the window is too small to display the contents of the document you are viewing,
    the window will display scrollbars. Scrollbars are placed along the bottom if
    the document is wider than the window or to the right if the document is taller
    than the window.


    ![](img/edf072a03d4de1f8f4a13465ac79e7fb_35_1.png)


    Scrollbars allow you to view a document that is larger than can fit in a window.


    A scrollbar works like a slider: You move its knob (also called the “thumb”) up
    and down (or left and right), and the document scrolls in that direction. You
    can also press the arrow buttons at the ends of the scrollbar to scroll continuously.
    If you click on the scrollbar area, the document will scroll one unit, line, or
    page, depending on how the application behaves.


    # Resizing Windows


    Windows can be resized by grabbing them on one of their edges or corners. When
    you are in the resize zone, the cursor will change to the window resize cursor
    (see Chapter 1, “The First Login on the KDE Desktop.”


    ![](img/edf072a03d4de1f8f4a13465ac79e7fb_35_2.png)


    To resize a window in one dimension, grab one of its edges. To resize on both
    dimensions at the same time, drag from a corner.


    # Moving a Window


    You can move a window around by dragging it by its title bar. As you drag, the
    window will follow your cursor. When you have placed the window where you want
    it, release the mouse button.


    Another way of moving a window is by using the move command available'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'under the window menu. (You can also obtain a window menu by right-clicking
    the window’s title bar.)


    Finally, if you press the Alt key and press the mouse button anywhere on a window
    (not just the title bar), the window will move anywhere you drag your mouse.


    ![](img/edf072a03d4de1f8f4a13465ac79e7fb_36_0.png)


    Moving a window by dragging its title bar.


    # Closing a Window


    When you are finished working with a document or application, you can close it
    by clicking its close button on the title bar. If the document needs saving, the
    application should prompt you to save changes. You usually don’t have to worry
    about shutting down an application and accidentally losing your work! But because
    some applications might not be consistent, it’s always a good idea to save a document
    before you close its window; otherwise, changes could be lost. Windows can also
    be closed by issuing the Close command from the window menu.'
  merge: -1
  img_proc: true
