  md: '# Complete Idiot''s Guide to Linux


    (Publisher: Macmillan Computer Publishing)

    Author(s): Manuel Ricart

    ISBN: 078971826x

    Publication Date: 12/22/98


    To access the contents, click the chapter and section titles.


