- pgno: 291
  md: '# Complete Idiot''s Guide to Linux:Customizing Your Linux Kernel


    ```

    [root@digital linux]# make clean

    [root@digital linux]# make zImage

    [root@digital linux]# make modules

    ```


    The preceding commands (especially make zImage) will take a while. It can be anywhere
    from a few minutes (on a Pentium computer) to several days (on a 386 computer),
    depending on your choices and the speed of your hardware. If they all finish without
    any errors, you are ready to install your new kernel.


    # Installing the New Kernel


    The newly built kernel exists in /usr/src/linux/arch/i386/boot/zImage. Before
    you install it, you need to make sure that you don’t overwrite the existing kernels.
    These are stored as /vmlinuz and in /boot/vmlinuz-2.0.35-modular (the version
    will depend on your installation). You don’t need to move them, simply make sure
    that you don’t overwrite them. If you do and your new kernel fails to work properly,
    your system might become unbootable.


    Copy your new kernel, with a new name, into the /boot directory:


    ```

    # cp /usr/src/linux/arch/i386/boot/zImage /boot/vmlinuz-2.0.35-apm

    ```


    I named my new kernel for its version and added the apm (Advanced Power Management)
    portion so that I can distinguish it from the existing kernels. Any additional
    name is fine, provided you don’t overwrite an existing kernel.


