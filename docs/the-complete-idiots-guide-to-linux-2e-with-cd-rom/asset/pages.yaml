    # Basic Requirements for Installing Caldera OpenLinux


    So, what kind of hardware do you need to have to install Linux? Linux runs on
    a slew of platforms. The CD included with this book is only intended for Intel-based
    PCs. Other distributions have software for Digital Alpha hardware, Sun SPARC,
    PowerPC, and PA-RISC workstations from Hewlett-Packard. But keep in mind, the
    basic PC requirement is any 386, 486, Pentium, Pentium Pro, or compatible PC or
    clone.


    In terms of memory, the basic requirements for an install are actually quite modest,
    especially when compared with other OSs. You should be able to install Linux on
    an Intel-based computer that has 8MB of RAM. If you intend to use a graphical
    environment, I strongly recommend that you consider 16MB as the reasonable minimum.
    Although this is on the questionable side of being enough, it might be all you
    need for minimum installations. Don’t expect a minimal system to be speedy, because
    the resources are going to be taxed to the max. Given today’s beyond reasonable
    memory prices, a 32MB system should be the minimum you consider if you will be
    working with Linux using a graphical environment. Having 32–40MB will keep Linux
    zooming right along and should prove to be more responsive than your current OS.


    In terms of disk space, a minimal installation can probably fit on 54MB (100MB
    if you’re installing X Windows), but at this size, many important functions will
    have been omitted. A small installation takes about 136MB. But keep in mind that
    418MB is the recommended space for a standard install; this'
