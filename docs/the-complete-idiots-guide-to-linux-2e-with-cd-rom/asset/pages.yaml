    # Part 4

    Appendixes


    Are you ready for an adventure? Anxious to check out Linux and see what it can
    do? Then let’s get you on the right path by installing Linux. The information
    in Appendix A helps you get the Linux operating system up and running. Appendix
    B is a hardware compatibility guide to help you figure out if any part of your
    box isn’t Linux-compatible. Now, let’s get started and breathe some life into
    your computer!


    # Appendix A

    Linux Installation


    # In This Appendix


    +   - Getting to Know Your Hardware

    +   - Basic Requirements for Installing Caldera OpenLinux

    +   - The Multiboot System

    +   - Installing Linux

    +   - Starting the Install

    +   - Configuring X-Windows


    The process of installing Linux on your computer is not any more difficult than
    installing Windows or any other operating system (OS). If you have ever'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'installed an OS on a PC, you already know how frustrating it can be. For some
    reason, “plug and play” devices sometimes are not recognized, or a driver shipped
    with your hardware is not really compatible with the version of the OS you are
    installing; or worse, the driver included with the OS is not compatible with your
    hardware. As I’m sure you’re aware, installing an OS is tricky business.


    You can save yourself a lot of grief and frustration by following a few basic
    guidelines and preparing for the task at hand. First, you really ought to have
    a clue about the hardware you are installing the OS on. If you don’t, you can
    try to install Linux, but I bet you are going to spend lots of time working out
    what hardware you have. To reduce your general stress levels, you really need
    to know your hardware a little more than you’d probably care to.


    The basic steps for installing follow:


    +   - Gather information about your hardware

    +   - Check compatibility lists to ensure your hardware is supported

    +   - Decide if your Linux installation will share the computer with another OS

    +   - Install the software

    +   - Provide some configuration


    # Getting to Know Your Hardware


    Before you even attempt to do anything, making a list of what’s inside will save
    you eons. People who install OSs typically know what’s in their boxes, and they
    have the documentation for every little bit of hardware they have. Live by example—do
    as they do!


    # Sources of Information


    There are several sources of information you can use to identify your hardware:


    +   - **Original equipment manuals:** (You saved them, right?)

    +   - **Hardware specifications from the manufacturer:** The Web can be a very
    good starting place for this information. More and more manufacturers are putting
    their complete specifications on the Web. It’s a good idea to look them up before
    you start your install. And don’t forget to check back periodically for updated
    drivers and information after your system is up and running.

    +   - **The manufacturer itself:** You can ask the system manufacturer for what’s
    under the hood. If you lost your manuals, you can also ask the manufacturer to
    sell you a replacement manual. (A greater number of manufacturers are also putting
    their manuals, or portions thereof, on the Web.)

    +   - **The store where you bought the computer:** If it’s not a chain store or
    a fly-by-night merchant, its salespeople are likely to know what they sold you.'
