- pgno: 323
  md: '# IDE Drives


    Following is the list of IDE Drives that are supported by the Caldera OpenLinux
    release 1.3.


    # IDE Hard Drives, CD-ROM Drives, and Tape Drives


    A disk geometry translation with “255 heads” is detected and supported by the
    genhd module.


    These drivers support up to four IDE interfaces on one or more IRQs with up to
    eight disk/CD=ROM/tape/floppy drives. OpenLinux, by default, ships with support
    for IDE hard drives on the first two controllers (2 drives per controller = 4
    drives total) and includes device files for up to four more devices without partitions.
    The only devices that can use partitions without creating new device files are
    the first four hard drives that are connected to the first two IDE controllers
    only.


    Users who have hard drives connected to a sound card IDE interface will need to
    have new device files made. OpenLinux Base and OpenLinux Standard customers can
    contact tech support for details on how to make these device files.


    # Compatible Drives


    | Model | Module |

    | --- | --- |

    | Hard Drives | ide |

    | CD-ROM Drives | ide-cd |

    | Tape Drives | ide-tape |


    # IDE Floppy (Removable) Drives


    A word of warning: This arena of hardware support is considered to be fairly unstable
    with current “full release” kernels, including 2.0.35 (which OpenLinux 1.3 systems
    run by default). Use caution when operating with removable IDE drive support,
    and consider using other types of hardware if this is going to run on a production
    or mission critical system.


    # Floppy Drives


    | Company | Model | Module |

    | --- | --- | --- |

    | EASYSTOR | LS-120 | ide-floppy |

    | Iomega | ZIP Drive | ide-floppy |


    # Mouse Pointing Devices


    The generic serial port drivers in the Linux kernel support serial mouse devices.
    If the port is recognized, the mouse connected to it should be'
