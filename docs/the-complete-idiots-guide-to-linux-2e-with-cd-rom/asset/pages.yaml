- pgno: 300
  md: 'book assumes that you have at least that. More or less space will be required,
    depending on the options you choose to install. A full install will take around
    1000MB, but the majority of users will never need these extra functions.


    In addition to these basic requirements, you’ll also need a mouse and a supported
    video card if you intend to take advantage of a graphical interface.


    If your computer meets or exceeds these standards (any modern $350 PC seems to
    do), you are ready to check if your hardware is supported.


    As a rule of thumb, Win devices (Winmodems, Winprinters, and so on) are not supported.
    Bleeding-edge hardware, as opposed to leading-edge, is also likely not to be supported.
    Standard clone stuff will work due to the high-quality standard components and
    wide availability.


    See Appendix B, “OpenLinux Compatibility Guide,” for the most current list of
    compatible hardware at the time of this writing. Make a list of the required modules,
    if any. If your hardware is not listed, it is probably not supported. Some components,
    such as Ethernet cards, will work if you try the NE2000/NE1000 and provide the
    IRQ and memory address for the card.


    # The Multiboot System


    If your hardware is supported, you only need to make one more decision before
    you install. If you are not sure that Linux is for you, it is possible to install
    Linux alongside your current OS. This involves a little more preparation but gives
    you the opportunity to boot your computer with Linux or your other OS.


    If you are considering having a dual-boot computer and have not yet installed
    the other OS, go ahead and do so now. Your installation will be easier if the
    other OS is already there. It is likely that Linux will be aware of other OSs,
    but your other OS probably doesn’t know how to handle Linux.


    # Sharing the Disk with Another OS


    Whether or not you are considering sharing the disk with another OS, you’ll need
    to create at least two new partitions solely for Linux. Partitions are portions
    of a disk that are owned and used by a single OS. One partition will accommodate
    Linux itself, and the other will be used for virtual memory storage (swap space).
    The minimum size of the swap partition is 16MB, but typically, you’ll want to
    allocate a swap space of the same size as you have RAM memory. Therefore, if you
    have 32MB of RAM, you’ll want a 32MB swap area.


    If your current OS’s partition is using all available disk space, you still might
    be able to install Linux, provided there is free space available within the partition.
    Included with the Linux distribution is software to allow you to repartition the
    hard disk without destroying the current contents of your disk. This software
    is called fips.


    Before you run fips, you’ll need to defragment the disk to ensure that there’s
    enough space for the repartitioning process. Your OS should have a tool such'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'as defrag.exe or optimize.exe for this purpose. If not, there are several available
    from commercial vendors (Norton Utilities is one) that will do the job. Fips is
    only able to handle DOS and Windows 95-style partitions. If you are running Windows
    NT or OS2, you might need to take a look at a commercial product like PartitionMagic
    (see http://www.powerquest.com) that also supports NTFS and HPFS—even Linux drives.


    The fips program, along with some readme files you should definitely read before
    installing, is located on the CD-ROM under col\tools\fips15. Let’s take a quick
    look at how to repartition your disk space using fips:


    +   1. Back up any important data before repartitioning. If something goes wrong,
    you will lose all your existing data.

    +   2. Defragment your system.

    +   3. Boot your computer into DOS. (You might need to create a DOS boot diskette;
    follow your computer’s manuals on how to do this.)

    +   4. Insert the Linux CD-ROM into your computer. If your boot diskette does
    not enable use of the CD-ROM, you might have to copy the fips program to another
    diskette.

    +   5. If your CD-ROM is located on drive D, at the prompt type d:col\tools\fips15\fips.exe.
    If your CD-ROM is accessible by another letter, substitute it for the correct
    drive.


    Follow the onscreen instructions to reserve the amount of space you expect to
    need for Linux. A good estimate should include allowances for the size of your
    Linux install (usually 418MB), the size of your swap space (same size as your
    memory), and extra space for data you create while using Linux (usually a few
    hundred megabytes). To resize your DOS partition, use the arrow keys on your keyboard.
    Press Enter to set the appropriate size. Confirm your changes and reboot your
    computer.


    # Installing Linux


    How you install Linux will depend on whether your BIOS supports booting from a
    CD-ROM. If your computer’s BIOS doesn’t support booting from a CD-ROM, you’ll
    have to create two floppy disks: One disk will be a boot disk, and the other will
    be a modules (drivers) disk.


    If your computer supports booting from a CD, you can skip building the floppies;
    go directly to the section “Starting the Install.”


    # Building the Boot and Modules Floppies


    If your computer doesn’t support booting from a CD-ROM device, you’ll need to
    create two floppies that start the Linux installation. One disk is required to
    boot the computer (the boot disk). The other disk (the modules or drivers disk)
    will contain additional software that is necessary if you


    +   - Need access to a PC card (PCMCIA device support) while installing. (Maybe
    you are using a PCMCIA network or SCSI card or some other peripheral.)'
