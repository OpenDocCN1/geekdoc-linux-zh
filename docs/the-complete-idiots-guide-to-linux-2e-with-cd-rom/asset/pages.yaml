    # The Active Window


    To work with a window, the window needs to be focused or active. The active window
    is one that has the dark title bar. It is the one that will receive keystrokes
    if you started typing. There can only be one active window at any one time.


    ![](img/edf072a03d4de1f8f4a13465ac79e7fb_34_0.png)


    Active windows have dark title bars and are able to receive keyboard input. Inactive
    windows have a grayed title bar.


    How you activate a window will depend on the focus policy. Essentially, there
    are two main ways you can activate a window: The first is by clicking on the window
    (the default setting in KDE); the other is by moving the cursor over the window
    you want active (default on other window managers).


    I like the click to change active windows, because I can activate a window and
    bring it to the front by clicking anywhere on it. The other policy, although potentially
    saving you some clicks in the course of a day, require that you are careful where
    you park your mouse.


    # Accessing Windows that Overlap


    It is possible for windows to completely overlap so that one completely covers'
