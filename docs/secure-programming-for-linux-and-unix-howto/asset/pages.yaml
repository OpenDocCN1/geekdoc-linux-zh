    some secure recovery function after a failure. It''s often useful to replay detection
    (when an attacker is trying to replay order actions) and usually a TOE must make
    sure that any access checks are always invoked and actually succeed before performing
    a restricted area.

    - Resource Utilization (FRU). Perhaps you need to provide fault tolerance, a priority
    of service, or support resource allocation (as a quota system).

    - TOE Access (FTA). There may be many issues controlling sessions. Perhaps there
    should be a limit on the number of concurrent sessions (if you''re running a web
    service, would it make sense for the same user to be logged in simultaneously,
    from two machines?) Perhaps you should lock or terminate a session automatically
    (e.g., after a timeout), or let users initiate a session. You might want to use
    a standard warning banner. One surprisingly useful piece of information is displayed,
    on login; information about the last session (e.g., the date/time and location
    of the last login) and the date of the last unsuccessful attempt – this gives
    information that can help them interceptors. Perhaps establish other criteria
    (e.g., perhaps you can only use the program during business hours).

    - Trusted path/channels (FTP). A common trick used by attackers is to make the
    screen appear to be something it isn''t, e.g., an ordinary program that looks
    like a login screen or a forged web site. Thus, perhaps there needs to be a "trusted
    path" – a way that users can ensure they are talking to the "real" program.


    # 4.4. Assurance Measure Requirements


    As noted above


    +   - Configuration management (ACM). At least, have a unique identifier for each
    TOE release, so that users know what they have. You gain more assurance if you
    have good tools to control your software, and have separate identifiers for each
    piece (typical CM tools like CVS can do this, although CVS does not record changes
    as atomic which is a weakness of it). There''s more under configuration management;
    don''t just control your code, but also control documentation, track all problem
    reports (especially security-related ones), and all development tools.

    - Delivery and operation (ADO). Your delivery mechanism ideally let users detect
    unauthorized modifications to prevent someone masquerading as the user, and even
    better, prevent modification in the first place. You should provide documentation
    on how to securely install, generate, and start-up the TOE, generating a log describing
    how the TOE was generated.

    - Development (ADV). These CC requirements deal with describing the TOE implementation,
    and they need to be consistent between each other (e.g., the information in the
