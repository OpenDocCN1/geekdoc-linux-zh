    # # 7.12. Set up a Trusted Path


    The counterpart to needing trustworthy controls (see Section 7.11) is assuring
    users that they are really working with the program or system they intended to
    use.


    The traditional example is a `fake login` program. If a program is written to
    look like the login screen of a system, it can be left running. When users try
    to log in, the fake login program can capture their passwords for later use.


    A solution to this problem is ` trusted path`. A trusted path is simply some mechanism
    that provides confidence that the user is communicating with what the user intended
    to communicate with, ensuring that attackers cannot intercept or modify whatever
    information is being communicated.


    If you''re asked for a password, try to set up trusted path. Unfortunately, Linux
    distributions and many other Unixes do not have a trusted path for their normal
    login session. One approach is to require an unforgeable login key, for example,
    Windows/NT2000 use `control-alt-delete` before logging in; there''s a Linux equivalent,
    the Secure Authentication Key (SAK); it''s recommended that this be mapped to
    `control-alt-pause`. Unfortunately, at the time this SAK is inactive and not well-supported
    by Linux distributions. Another approach for implementing a trusted path is to
    locally control the security display so that only the login program can perform.
    For example, if you could modify the login lights (the LEDs showing Num Lock,
    Caps Lock, and Scroll Lock), then a login program could display a running pattern
    to indicate that it''s the real login program. Unfortunately, since current Linux
    normal users can change the LEDs, the LEDs can''t be used to confirm a trusted
    path.


    Sadly, the problem is much worse for network applications. Although setting up
    a trusted path is desirable for network applications, completely doing so is quite
    difficult. When sending a password over a network, the very least encrypt passed
    between trusted endpoints. This will at least prevent eavesdropping of passwords
    by those not connected to the system, and make attacks harder to perform. If you
    are concerned about trusted path for the actual communication, make sure that
    the communication is encrypted and authenticated (or at least authenticated).


    It turns out that this isn''t enough to have a trusted path to networked applications,
    in particular for web-based applications. There are documented methods for fooling
    users of web browsers into thinking they are in one place when they are actually
    elsewhere. For example, Fewlet [1997] describes “web spoofing”, where users believe
    they are viewing one web page in fact all the web pages they view go through an
    attacker''s site (who can then monitor traffic and any data sent in direction).
    This is accomplished by rewriting URL. The rewritten URLs can be made nearly invisible
    using other technology (such as Javascript) to hide any evidence in the status
    line, location, and so on. See their paper for more details. Another technique
    for hiding such URLs is rarely-used URL syntax, for example, the URL `http://www.com/stuff/mysite.com`
    is an actual request to view “malvolent” site using itself. If the URL is long
    enough, the real material will not be displayed and users are unlikely to notice
    the exploit away. Another approach is to create sites with names barely similar
    to the “real” site – users may not know the difference. In all these cases, encrypting
    the line doesn''t – the attacker can be quite content in encrypting data while
    completely controlling what''s.


    Countering these problems is more difficult; at this time I have no technical
    solution for preventing `fooling` web users. I would recommend browser developers
    to create such `fooling`, making it easier to stop. If it is possible that your
    users connect to the correct site, have use simple procedures to


