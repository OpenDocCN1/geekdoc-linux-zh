    # 5.11.4. Validating Hypertext Links (URIs/URLs)


    Careful readers will notice that I did not include the hypertext link <a> as a
    safe tag in HTML. Clearly, you could add <a href="URI"> (hypertext link) to the
    safe list (not permitting any other attributes unless you''ve checked them). If
    your application requires it, then do so. However, permitting third parties to
    create links is much less safe, because defining "safe" turns out to be very difficult.
    Many browsers accept all sort of URIs which might be dangerous to the user. This
    section discusses how to validate URIs


    First, briefly look at URI syntax (as defined by various). URIs can be "absolute"
    or "relative". The syntax of an absolute URI looks like this:


    ```

    scheme://[authority][path][query][#fragment]

    A URI starts with a scheme (such as "http”), the characters "//", the authority
    (such as "www.example.com”), a path (which looks like a directory or file name),
    a question mark followed by a query, and a hash (\#) followed by a fragment identifier.
    The square brackets optional portions – e.g., URIs do not always include the query,
    or fragment), – and many schemes may have additional requirements unique to them.
    Many schemes permit the "authority" field to identify optional usernames, passwords,
    and ports, by using this syntax for the "authority" section:

    [username:password@]host[:port]

    The "host" can be either a name (such as "www.example.com") or an IPv4 address
    (127.0.0.1). A "relative" URI references one object relative to the "current"
    one, and its syntax looks a lot like filename:path[query][#fragment]

    ```


    There is a limited number of characters permitted in the URI, so to get around
    this problem, 8-bit characters may be "URL encoded" as %hh (where hh is the hexadecimal
    value of the 8-bit character). For more detailed information on valid URIs, see
    RFC 2396 and its related specifications.


    Now that we''ve looked at URIs, let''s examine the risks of each part:


    +   - Scheme: Many schemes are downright dangerous. Permitting someone to insert
    a `javascript` scheme into your material would allow them to trivially mount denial-of-service
    attacks (e.g., by repeatedly creating windows so the user''s machine freezes or
    unusable). Moreover, they might be able to exploit a vulnerability in the javascript
    implementation. Some schemes can be a nuisance, such as `mailto:` when a mailing
    is not expected, and some schemes may not be sufficiently secure to control the
    machine. Thus, it''s necessary to limit the set of allowed schemes to just a few.

    - Authority: You should limit links to "safe" sites, but this is difficult to
    do in practice. However, you can certainly do something about usernames, passwords,
    and port numbers: which for forbid them. Systems exposing usernames (especially
    with passwords!) are guarding more important material: rarely is needed in published-post
    URIs, and someone could try this functionality to convince users to expose their
    information how to access/or to modify the information. These URIs permit semantic
    attacks; see Section 7.16 for more information. Usernames without passwords are
    no less dangerous, since browsers typically cache the passwords.


