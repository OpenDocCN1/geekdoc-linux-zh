    # 11.5. Cryptographic Algorithms and Protocols


    Often cryptographic algorithms and protocols are necessary to keep a secure system,
    particularly when communicating through an untrusted network such as the Internet.
    Wherever possible, use cryptographic techniques to authenticate and keep the information
    private (but don''t assume that encryption automatically authenticates you). You
    will generally need to use a set of available tools to secure your application.


    For background information and code, you should probably look at the classic "Applied
    Cryptography" [Schneier]. The newsgroup "sci.crypt" has a series of FAQs; you
    can find them at many locations, including http://www.landfield.com/faq/cryptography-faq.
    Linux-specific resources include the Linux Encryption HOWTO at http://marc.com/Encryption-HOWTO/;
    A discussion on how to use the basic algorithms can be found in [Opplinger 1998].
    A useful collection of examples on how to apply cryptography in protocols can
    be found in [Stallings 1996]. What follows is a few comments; these areas are
    specialized and covered thoroughly.


    Cryptographic protocols are difficult to get right, so not create your own. Instead,
    here you can, protocols and algorithms that are widely-used, heavily analyzed,
    and accepted as secure. When you must create something, use the wide public view
    and make sure that professional security analysts examine it for problems. In
    particular, do not create your own encryption algorithms unless you are an expert
    in cryptography, know what you''re doing, and plan to spend years in professional
    review of the algorithm. Creating encryption algorithms (that are any good) is
    a task for experts only.


    A number of algorithms are patented; even if the owners permits "free use" at
    the moment, without a signed contract they can change their mind later, putting
    you at extreme risk. In general, all patented algorithms – in most cases there''s
