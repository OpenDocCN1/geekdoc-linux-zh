  md: '# Secure Programming for Linux and Unix HOWTO


    # 7.10.1. Sequencing (Non–Atomic) Problems


    In general, you must check your code for any pair of operations that might fail
    if arbitrary code is executed between them.


    Note that loading and saving a shared variable are usually implemented as separate
    operations and are not atomic. This means that an “increment variable” operation
    is usually converted into loading, incrementing, and saving operation, so if the
    memory variable is shared the other process may interfere with the incrementing.


    Secure programs must determine if a request should be granted, and if so, on that
    request. There must be no way for an untrusted user to change anything used in
    this determination before the program acts on it. This kind of race condition
    is sometimes termed a “time of check – time of use (TOCTOU) race condition.


    # 7.10.1.1. Atomic Actions in the Filesystem


    The problem of failing to perform atomic actions repeatedly comes up in the filesystem.
    In general, the filesystem is a shared resource used by many programs, and some
    programs may interfere with its use by other programs. Secure programs should
    generally avoid using access(2) if a request should be granted, followed later
    by open(2), because users may be able to move files between these calls, creating
    symbolic links or files of their own choice instead. A secure program should set
    its effective id or filesystem id, then make the open call access(2), only when
    the user cannot affect the file or any directory path from the filesystem root.


    When creating a file, you should open it using the O_CREAT | O_EXCL flag and grant
    only narrow permissions (only to the current user); you’ll also need to prepare
    for opening the file. If you need to be able to open the file (to prevent a denial-of-service),
    you’ll need to repetitively (1) create a “random” filename, (2) open the file
    as named, and (3) stop when the open succeeds.


    Ordinary programs can become security weaknesses if they do not create files properly.
    For example, the “joe” editor had a “DEADIE” symlink vulnerability. If joe was
    exited in a non own way (such as a system crash, closing an editor, or a network
    connection dropping) joe could unconditionally append its buffer to the “DEADIE”.
    This could be exploited by the creation of DEADIE symlinks in directories where
    root would normally use it. In this way, joe could be used to attack gateway to
    potentially-sensitive files, resulting in a denial of service/or unauthorized
    access.


    As example, when performing a series of operations on a file’s meta-information
    (such as changing its owner, stat-ing the file, or changing its permissions),
    first open the file and then use the operations on open files. Using the functions
    filenames as fchown(3), fstat(2), or chmod(2) system calls, doing so will prevent
    the file from being replaced while your program is running (a possible race condition).
    For example, if you close a file and then use chmod() to change its permissions,
    an attacker may be able to move or remove the file between these two steps and
    create a symbolic link to affect the file (say /etc/passwd). Other interesting
    features include /dev/zero, which can provide an infinitely-long data stream of
    input to an attacker; if you “switch” the file midstream, the results could be
    dangerous.


    But even this complicated – when creating files, you must give them a minimum
    set of rights as possible, and generally, you will need to use umask and/or open’s
    parameters to limit initial access to the user and group. For example, if you
    create a file that is inherently world-readable, then try to off the “world readable”
    bit, an attacker could try


