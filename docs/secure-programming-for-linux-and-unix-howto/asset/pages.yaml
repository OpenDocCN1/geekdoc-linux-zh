    # 8.4. Call Only Interfaces Intended for Programmers


    Call only programming interfaces (APIs) that are intended for use by programs.
    Usually a program can invoke any other program, including those that are designed
    for human interaction. However, it is unusual to invoke a program for human interaction
    in the same way as a human. The problem is that program''s human interfaces are
    intentionally rich in functionality and are difficult to completely control. As
    discussed in Section 8.3, interactive programs often have "escape" codes, which
    might enable an attacker to perform undesirable functions. Also, interactive programs
    often try to intuit the "most likely" defaults; this might not be the default
    you were expecting, and an attacker may find a way to exploit this.


    Examples of programs you shouldn''t include mail, mailx, ed, vi, and emacs. At
    the very least, don''t call these without checking their input format.


    Usually there are parameters to give you access to the program''s functionality,
    or a different API or application that''s used for programs; use that instead.
    For, instead of invoking a text editor to edit some text (such as ed, vi, or emacs),
    use where you can.


    # 8.5. Check All System Calls


    Every system that can return an error code must have that error checked. One reason
    is that nearly all systems require limited resources, and users can affect resources
    in a variety of ways. Setuid/setgid has limits set on them calls such as setattr(3)
    and nice(2). External users of server programs and CGI scripts may be able to
    cause resource exhaustion by making a large number of simultaneous requests. If
    the error cannot be handled gracefully, then fail safe as desired earlier.


    # 8.6. Avoiding vfork(2)


    The portable way to create new processes in Unix-like systems is to use the fork(2).
    BSD introduced a variant vfork(2) as an optimization technique. In vfork(2), unlike
    fork(2), the child borrows the parent''s memory and thread of control until it
    calls exec(2) or an exit; the parent is suspended while the child is using it.
    The rationale is in old BSD systems, fork(2) would actually cause memory to be
    copied while vfork(2) would not. Linux never had this problem; Linux used copy-on-write
    pages when changed (changed, actually, there are still some tables that have to
    be copied; in some circumstances the overhead is not significant). Nevertheless,
    since some programs depend on vfork(2), recently implemented the BSD vfork(2)
    semantics (previously vfork(2) had an alias for fork(2)).


    There are a number of problems with vfork(2). From a portability point-of-view,
    the problem with vfork(2) is that it''s actually tricky for a program to interfere
    with it, especially in high-level languages. The "not interfering" requirement
    applies to the actual code generated, and many compilers generate hidden variables
    and code structures that cause unintended interference. The result: programs using
    vfork(2) can fail even when compiler versions change.


    For secure programs it gets worse on Linux systems, Linux (at least 2.2 versions
    from 2.2.17) is vulnerable to a race condition in vfork(2)''s implementation.
    If a privileged process uses a vfork(2)/execve(2)


