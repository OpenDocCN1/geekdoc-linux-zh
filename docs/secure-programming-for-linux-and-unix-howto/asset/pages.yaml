    # ## 5.9. Character Encoding


    # ### 5.9.1. Introduction to Character Encoding


    For many years Americans have exchanged text using the ASCII character set; since
    all U.S. systems support ASCII, this permits easy exchange of English text. Unfortunately,
    ASCII is completely inadequate in handling the characters of nearly all languages.
    For many different countries have adopted techniques for exchanging text in different
    languages, making it difficult to exchange in an increasingly interconnected world.


    Recently, ISO has developed ISO 10646, the `Universal–Octet Coded Character Set
    (UCS). UCS is a character set which defines a single 31-bit value for each of
    the world''s characters. The first 65536 characters of the UCS (which fit into
    16 bits) are termed the `Basic Multilingual Plane` (BMP), and the BMP is intended
    to cover nearly all of today''s spoken languages. The Unicode forum develops the
    Unicode standard, which concentrates on the UCS and adds some additional conventions
    to aid interoperability. Historically, Unicode and ISO 10646 were developed by
    competing groups, but fortunately they realized they needed to work together and
    coordinate with each other.


    If you''re writing new software that handles international characters, you could
    be using ISO 10646/Unicode as a way for handling international characters. However,
    you may need to process older documents in various older (language-specific) character
    sets, in which case, you need to ensure that an untrusted user controls the setting
    of document character set''s center (this would significantly affect the document''s
    interpretation).


    # ### 5.9.2. Introduction to UTF-8


    Most software is not designed to handle 16 or 32 characters, yet to create a universal
    character set more than 8 bits was used. Therefore, a special format called UTF-8
    was developed to encode these potentially international characters in a format
    more easily handled by existing programs and libraries. UTF-8 is defined, over
    other places, in RFC 2279, which is a well-defined standard that can be freely
    read and used. UTF-8 is a variable-width encoding; characters numbered 0 to 0x7f
    (127) encode as a single byte, with larger values encoded into 2 to 6 bytes of
    information (depending on their value). The encoding has been specially designed
    to have the following nice properties (this information is from the RFC and Linux
    utf-8 man page):


    +   - The US ASCII characters (0 to 0x7f) encode as units, so files and strings
    contain only 7-bit ASCII characters have the same encoding under both ASCII and
    UTF-8. This is fabulous for backward compatibility with the many existing U.S.
    programs and data files.

    - All characters beyond 0x7f are encoded as a multibyte sequence consisting only
    of bytes in the range 0x80 to 0xff. This means that no ASCII byte can appear as
    part of another character. Many


