  md: 'One example is URIs that, while legitimate, may fool users into thinking they
    have a different meaning. For example, look at this URI:


    ```

    http://www.bloomberg.com@badguy.com

    ```


    If a user clicks on that URI, they might think that they are going to Bloomberg
    (who provide financial commodities news), but instead they are going to badguy.com
    (and providing the username www.bloomberg.com, which www.badguy.com will conveniently
    ignore). If the badguy.com website imitated the bloomberg.com site, a user might
    be convinced that they''re seeing the real thing (and make investment decisions
    based on attacker-controlled information). Then on URIs used in an unusual way
    - clickable URIs can have usernames, but usually not. One solution for this case
    is for the web browser to detect such unusual URIs and create a pop-up confirmation
    widget, “You are about to go into badguy.com as user www.bloomberg.com; do you
    wish to proceed?” If the widget allows the user to change these entries, it provides
    additional functionality to the user as well as providing protection against that
    attack.


    Another example is homographs, particularly international homographs. Certain
    letters look similar to each other, and these can be exploited as well. For example,
    since 0 (zero) and O (the letter O) look similar to each other, users may not
    realize that WWW.BLOOMBERG.COM and WWW.BLOMBERG.COM are different web addresses.
    Other similar-looking letters include 1 (one) and l (lower-case L). If international
    characters are allowed, but the computer will treat them differently. Currently
    most systems don''t allow Roman characters to look essentially as the Roman letters,
    but for good reasons it''s widely agreed that for them will be necessary in the
    future. One proposed solution has been to display letters from different regions
    using different colors – that way, users get more information visually. If the
    users look at URI, they will hopefully notice the strange color. [Gabrilovich
    2002] However, this does show the essence of a semantic attack – it''s difficult
    to defend against, precisely because the computers are working correctly.


    # 7.17. Be Careful with Data Types


    Be careful with the data types used, in particular those used in interfaces. For
    example, ``signed” and ``unsigned” values are treated differently in many languages
    (such as C or C++).'
