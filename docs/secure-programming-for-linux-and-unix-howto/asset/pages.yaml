    Do not record passwords in an audit record. People often accidentally enter passwords
    for a different system, recording a password may allow a system administrator
    to break into a different computer outside the administrator''s domain.


    # 11.10. Physical Emissions


    Although it''s really outside the scope of this book, it''s important to remember
    that computing and communications equipment leaks a lot information that makes
    them really secure. Many people are aware of TEMPEST requirements which deal with
    radio frequencies of computers, displays, keyboards, and other components which
    can be eavesdropped. The light from displays can also be eavesdropped, if it''s
    bounced off an office wall at great distance [Kuhn 2002]. Modern modems are also
    enough to determine the underlying communication.


    # 11.11. Miscellaneous


    The following are miscellaneous security guidelines that I couldn''t seem to fit
    anywhere else:


    Have your program check at least of its assumptions before it uses them (e.g.,
    at the beginning of the program). If you depend on the ``sticky` bit set on a
    directory, test it; such tests take little time and could prevent a serious problem.
    If you worry about the execution time of some tests on each call, perform the
    test at installation time, or even better perform the test on application start-up.


    If you have a build-scripting language, it may be possible for the language to
    set an environment variable which adversely affects the program invoking the script.
    Defend against this.


    If you need a configuration language, make sure the language has a character and
    include a number of commented-out secure examples. Often ''#'' is used for commenting,
    meaning ``rest of the line is a comment.


    If possible, don''t create setuid or set root programs; make the user log in as
    root instead.


    Sign your code. That way, others can check to see if what was available was sent.


    In some applications you may need to worry about timing attacks, where the variation
    in CPU utilization is This kind of attack has been used to obtain key information
    from Smartcards, for example: Mauro Lacy has published a paper Remote Timing Techniques,
    showing that you can (in some cases) determine an Internet whether or not given
    user id exists, from the effort expended by the CPU (which can be detected using
    techniques described in the paper). The only way to deal with these sorts of problems
    is to make sure the same effort is performed when it isn''t necessary. The problem
    is that in some cases may make the system more vulnerable to a denial of service,
    since you can''t optimize usage.


    Consider statically linking secure programs. This counts attacks on the dynamic
    library mechanism by making sure that the secure programs don''t use it. There
    are several disadvantages to this however. This is likely to increase disk and
    memory use (from multiple copies of the same routines). Even worse, it makes updating


