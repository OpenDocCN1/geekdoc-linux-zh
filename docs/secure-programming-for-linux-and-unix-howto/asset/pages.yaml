    # 6.3 Compilation Solutions in C/C++


    A completely different approach is to use compilation methods that perform bounds–checking
    (see [Sitaker 1999 for a list]). In my opinion, such techniques are useful when
    having multiple layers of defense, but it''s not wise to use this technique as
    your sole defense. There are at least two reasons for this. First, all such generally
    only provide a partial defense against buffer overflows and “complete” defenses
    are 12–30 times slower; C and C++ simply not designed to protect against buffer
    overflows. Off of open source programs you cannot be what values will be used
    to compile the program; using the default “normal” compiler for a system might
    steadily open flaws.


    One of the more useful tools is “StackGuard”, a modification of the GNU C compiler
    gcc. StackGuard works by inserting a “guard value (called a “canary”) in front
    of the return address; if a buffer overflows the return address, the canary value
    (hopefully) changes and the system detects this using it. This is quite valuable,
    but it does not protect against buffer overflows other values (which they may
    still be used to attack a system). There is work to extend StackGuard to add canaries
    to other data items, called “PointGuard”. PointGuard will automatically protect
    certain values (e.g., function pointers and longer buffers). However, protecting
    other values using PointGuard requires specific programmer intervention (the programmer
    has to identify which data values must be protected with canaries). This can be
    valuable, but it''s easily omit protection for a value you didn''t need protection–
    anyway. More information on StackGuard, PointGuard, and other alternatives is
    in Conan [1999].


    IBM developed a stack protection system called Prolice on the ideas of StackGuard.
    IBM does not include the Prolice in our system – it’s called “GCC extension for
    protecting applications from stack-smashing attacks.” Like StackGuard, Prolice
    is a GCC (GNU Compiler Collection) extension for protecting from stack-smashing
    attacks. Applications written in C are protected by automatically inserting code
    into the program at compilation. Prolice is slightly different from StackGuard,
    by adding three features: (1) ordering local variables to places after pointers,
    (2) copying pointers in function to an area preceding local variables (to prevent
    the corruption of pointers that could be used to corrupt arbitrary memory locations),
    and (3) omitting code from some functions (it basically assumes that only characters
    are arrays); while this is strictly true, it''s mostly true, as a result Prolice
    has better performance while retaining most of its protective capabilities. The
    IBM website includes information for how to build Red Hat Linux and FreeBSD with
    this protection; FreeBSD has already added Prolice to their base system. I think
    this is extremely promising, and I hope to see this included in future versions
    of gcc and in various distributions. In fact, this kind of capability should be
    the default – what would mean the largest single class of attacks would no longer
    enable attackers to take control in most cases.


    As a related issue, in Linux you could modify the kernel so that the stack segment
    is not executable; such patch to Linux does not exist (see Designer’s patch),
    which includes this,


