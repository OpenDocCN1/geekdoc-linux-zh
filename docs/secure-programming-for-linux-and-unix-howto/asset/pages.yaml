    evidence to justify any claims made. Thus, evaluations require documentation,
    and usually the available documentation has to be improved or developed to meet
    CC requirements (especially at the higher assurance levels). Every claim has to
    be justified to some level of confidence, the more claims made, the stronger,
    and the more complicated the design, the more expensive an evaluation is. Although,
    when flaws appear, they will need to be fixed. Note that a laboratory is to evaluate
    a product and determine the truth. If your product doesn''t meet its claims, then
    you have two choices: fix the product, or change (reduce) the claims.


    It''s important to discuss with customers what''s desired before beginning a formal
    ST evaluation; an ST that includes functional or assurance requirements not needed
    by customers will be unnecessarily expensive to evaluate, and an ST that omits
    necessary requirements may not be acceptable to customers (because necessary piece
