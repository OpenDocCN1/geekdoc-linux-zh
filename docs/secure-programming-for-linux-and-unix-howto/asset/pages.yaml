  md: '# Secure Programming for Linux and Unix HOWTO


    Format languages are essentially little programming languages – so developers
    let attackers control the format string are running programs by attackers; Surprisingly,
    many people seem to see the power of these formatting capabilities, and data from
    untrusted users as the format parameter. The guideline here is clear – never unfiltered
    data from an untrusted user as the format parameter. Failing to follow this guideline
    results in a string vulnerability (also called a format vulnerability). Perhaps
    this is best shown by example:


    ```

    /* Wrong ways: */

    print(string_from_untrusted_user);

    /* Right ways: */

    nprintf("%*s", string_from_untrusted_user); /* safe * */

    fputs(string_from_untrusted_user, stdout); /* better for simple strings */

    ```


    If an attacker controls the formatting information, an attacker can cause all
    sorts of mischief by carefully selecting the format. The code of C''s printf is
    a good example – there are lots of ways to exploit user-controlled strings in
    printf(). This can buffer overflows by creating a long format string (this can
    result in the attacker having control over the program), conversion specifications
    that use unpassed parameters (causing unexpected data to be inserted), and creating
    formats which produce totally unanticipated result values (by prepending or appending
    argument, causing problems in later). A particularly nasty case is %n conversion
    specification, where the number of characters written so far is the pointer; using
    this, an attacker can overwrite what was intended for printing! An attacker can
    even overwrite arbitrary locations, since the attacker can specify a "parameter"
    that wasn''t actually passed. The %n conversion specification has been a standard
    part of C since 1989. Greg KH did a search of source code and identified the problem
    in Bitdx (a program editor/source editor/IDE/Debugger) using %n, and there are
    countless more. Deprecating %n would probably be a good idea, but without %n there
    can be many programs. Many discuss these issues in more detail, for you can see
    [Avoiding security holes when developing an application – Part 4](format strings).


    Since in many cases the results are sent back to the user, this attack can also
    be used to expose information about the stack. This information can be used to
    check stack protection systems like StackGuard and ProPolice; StackGuard uses
    "canary" values to detect attacks, but if the stack''s contents can be displayed,
    the current value of the canary will be exposed, making the software vulnerable
    to attacking the stack.


    A formatting string should always be a constant string, possibly involving a function
    call to implement a lookup for internationalization (e.g., gets()). Note that
    this lookup must be limited to values the program controls; the user must be allowed
    to only output message files controlled by the program. It is possible to use
    user data before using it (e.g., designing a filtering list legal characters for
    the format string such as [A-Za-z-9]), but it''s better to prevent the problem
    by using a constant format string or fputs(input). Note that although I''ve listed
    this as an "output" problem, this can cause problems in a program before output
    (since the output routines are saving to a file, or even just integer string via
    snprintf()).


    The problem of input formatting causing security problems is not an ideal problem;
    see CERT Advisory CA-2000-13 for example of how these problems can be exploited,
    Paul Bouchaire''s article titled "[Paper] published in the July 18, 2000 edition
    of [Bugtra](Bugtra). As December 2000, developmental versions of the gcc compiler
    started warning messages for insecure format string usages, in an attempt to help
    developers avoid this.


    Of course, all these question is about whether or not the localization lookup
    is, in fact, secure. If you''re creating your own localization routines, make
    sure that an untrusted user can


