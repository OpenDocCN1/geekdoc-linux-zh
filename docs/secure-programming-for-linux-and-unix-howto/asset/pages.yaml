    # 11.5.6. Randomized Message Authentication Mode (RMAC)


    NIST has developed and proposed a new mode for using cryptographic algorithms
    called Randomized Message Authentication Code (RMAC). RMAC is intended for use
    as a message authentication code technique.


    Although there is a formal proving that RMAC is secure, the proof depends on the
    highly questionable assumption that the underlying cryptographic algorithm meets
    the ''ideal cipher model'' - in particular, that the algorithm is secure against
    a variety of specialized attacks, including related-key attacks. Unfortunately,
    related-key attacks are poorly studied for many algorithms; this is not the kind
    of property or attack that most people worry about when using cryptographic algorithms.
    It is known-DES doesn''t have the proof proper, and it''s unclear if other widely-accepted
    algorithms like AES have this property (it appears AES is at least weaker against
    related-key attacks than usual attacks).


    The best advice right now is "don''t use RMAC". There are other ways to message
    authentication, such as HMAC combined with a cryptographic hash algorithm (e.g.,
    HMAC-SHA1). HMAC isn''t the same (e.g., technically it doesn''t include a nonce,
    so you should rekey), but the theoretical weaknesses of HMAC are merely theoretical,
    while the problems in RMAC seem far more important in the real world.


    # 11.5.7. Other Cryptographic Issues


    You should include and integrity checks of data that''s important. Don''t depend
    on the encryption also providing integrity - an attacker may be able to change
    the bits into a different value, and although the attacker may not be able to
    change it to a specific value, changing the value may be enough. In general, you
    should use different keys for integrity and secrecy, to avoid subtle attacks.


    One issue not discussed enough is the problem of ''''traffic analysis." That is,
    even if messages are encrypted and the encryption is not, an adversary can make
    a great deal from the encrypted messages. For example, if the presidents of two
    companies start exchanging encrypted messages, one may suspect that the companies
    are considering a merger. For another example, many SSH implementations have been
    found to have a weakness in exchanging passwords: observers could look at packets
    and determine the length (or length range) of the password, even if they couldn''t
    determine the password itself. They could also determine more information about
    the password that significantly aided in breaking it.


    Be sure to make possible to solve a problem in parts, and use different keys when
    the trust environment (who is trusted) doesn''t use the same key for too long
    - after a change, the session or password so an adversary will have to start over.


    Generally you should compress your encrypt - this adds a fixed header, which isn''t
    so good, but it eliminates many patterns in the result of the message as well
    as making the result smaller, so it''s usually viewed as "win" if compression
    is likely to make the result smaller.


