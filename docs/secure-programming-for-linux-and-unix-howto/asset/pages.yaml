- pgno: 44
  md: '# Secure Programming for Linux and Unix HOWTO


    See the program has extensions that you need to know about.


    While using user input, it''s a good idea to temporarily drop all privileges,
    or create separate processes (with the parser permanently dropped privileges,
    and the other process performing security checks against the parser requests).
    This is especially true if the parsing task is complex (e.g., if you use a lex-like
    or yacc-like tool), or if the programming language does not protect against buffer
    overflows (e.g., C and C++). See Section 7.4 for more information on minimizing
    privileges.


    When using data for security decisions ("let this user in"), be sure to use trustworthy
    channels. For example, on a public Internet, don''t just use the IP address or
    port number as the sole way to authenticate users, because in most environments
    this information can be set by the (potentially malicious) user. See Section 7.11
    for more information.


    The following subsections discuss different kinds of inputs to a program; note
    that input enters as environment variables, mask values, and so on. Not all inputs
    are under the control of an untrusted user, so you only worry about those inputs
    that are.


    # 5.1. Command line


    Many people take input from the command line. A setuid/setgid program''s command
    line data is provided by an untrusted user, so setuid/setgid program must defend
    itself from potentially hostile command line values. Attackers can send just any
    kind of data through a command line (through calls as the execve(3) call). Therefore,
    setuid/setgid programs must completely validate the command line inputs and must
    not trust the name of the program reported by command line argument zero (an attacker
    can set it to any value including NULL).


    # 5.2. Environment Variables


    By default, environment variables are inherited from a process'' parent. However,
    when a program executes another program, the calling program can set the environment
    variables to arbitrary values. This is dangerous to setuid/setgid programs, because
    their invoker can completely control the environment variables they''re given.
    Since they are usually inherited, this applies transitively; a secure program
    might call other program and, without special measures, would pass potentially
    dangerous environment values to the program it calls. The following subsections
    discuss environment variables and what to do with them.


    # 5.2.1. Some Environment Variables are Dangerous


    Environment variables are dangerous because many libraries and programs are controlled
    by environment variables in ways that are obscure, subtle, or undocumented. For
    example, the IFS variable is used by the sh and bash shell to determine characters
    separate command line arguments. Since the shell is invoked by low-level calls
    (like system(3) and popen(3) or the back-tick operator in Perl), setting IFS to
    unusual values can subvert-safe calls. This behavior is documented in bash and
    sh, but it''s obscure; quite used often for its intended purpose. What is worse
    is not all environment variables are documented, and even if they are, other programs
    may change and add dangerous environment variables. Thus, the only real solution
    (described below) is to select the ones you need and throw away the rest.


