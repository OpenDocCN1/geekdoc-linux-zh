    # 2.5. Types of Secure Programs


    Many types of programs may need to be secure programs (as the term is defined
    in this book). Some common types:


    +   - Application programs used as viewers of remote data. Programs used by viewers
    (such as word processors or file viewers) are often asked to view data sent by
    an untrusted user (this request may be automatically invoked by a web browser).
    Clearly, the user''s input should not be allowed to cause the application to run
    arbitrary programs. It''s unusual to use initialization macros (run when the data
    is displayed); If you must, then you must create a secure sandbox (a complex and
    prone-error-prone task that almost never succeeds, which is why you shouldn''t
    support macros in the first place). Be careful of issues such as buffer overflow,
    discussed in [Chapter 6](https://example.com) which might allow an untrusted user
    to run an arbitrary program.

    - Application programs used by the administrator (root). Such programs shouldn''t
    trust information that can be controlled by non-administrators.

    - Local servers (also called daemons).

    - Network--accessible servers (sometimes called daemons).

    - Web-based applications (using CGI scripts). They are a special case of network-accessible
    servers, but they sometimes deserve their own category. Such programs are invoked
    indirectly via a web server, which filters out some attacks but nevertheless leaves
    many that must be withstood.

    - Applets ( downloaded to the client for automatic execution). This is something
    Java is especially famous for, though other languages (such as Python) support
    mobile code as well. There are several security viewpoints here; the implementer
    of the app infrastructure on the client side is to make sure that all operations
    performed are ''''safe'''' ones with the problem of hostile hosts (in other words,
    which can never trust the client). There is some research attempting to deal with
    running applets on hostile hosts, but frankly I''m skeptical of the value of these
    approaches and this subject is exotic enough that I don''t cover it further.

    - setuid/segid programs. These programs are invoked by a local user and, when
    executed, immediately retain the privileges of the program''s owner and/or owner''s
    group.


