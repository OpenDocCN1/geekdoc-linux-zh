    In Linux, if you really need to know what attributes are associated with each
    process, the most definitive source is the Linux source code, in particular /usr/include/linux/sched.h
    definition of task_struct.


    The portable way to create new processes is the fork(2). BSD introduced a variant
    vfork(2) as an optimization technique. The bottom line with fork(2) is simple:
    don''t use it if you can avoid it. Section 8.6 for more information.


    Linux supports the unique-clone(2). This call works like fork(2), but allows specification
    of which resources should be shared (e.g., memory, file descriptors, etc.). Various
    BSD systems implement an rfork(2) system call (originally developed in Plan9);
    it has different semantics but the same general idea (it creates a process with
    tighter control over what is shared). Portable programs shouldn''t use these calls
    directly, if possible; as noted, they should rely on threading libraries that
    use such calls to implement threads.


    This book is not a full tutorial on writing programs, I will skip widely-available
    information handling processes. You can see the documentation for wait(2), exit(2),
    and so on for more information.


    # 3.1.2. POSIX Capabilities


    POSIX capabilities are sets of bits that permit the privileges typically held
    by root into a larger set of more specific privileges. POSIX capabilities are
    defined by a IEEE standard; they are not unique to Linux but are not universally
    supported by other Unix-like systems. Linux kernel 2.0 did not support POSIX capabilities,
    while version 2.2 added support for POSIX capabilities. When Linux documentation
    (including this one) says "requires root privilege", nearly all cases it really
    means "requires capability" as documentation. If you need to know the specific
    capability, look it up in the capability documentation.


    In Linux, the eventual intent is to permit capabilities to be attached to the
    filesystem; as of this writing, this is not yet supported. There is support for
    transferring capabilities, which is disabled by default. Linux version 2.2.11
    added a feature that makes capabilities more useful, called the "capability bounding
    set". The capability binding is a list of capabilities that may be held by any
    process on the system (otherwise, only the special init process can hold). If
    a capability does not appear in the bounding set, it cannot be executed by any
    process, no matter how privileged. This feature can be used to, for example, kernel
    module loading. A sample tool that takes advantage of this is LCAP at http://pweb.netcom.com/~spoon/lcap/


    More information about POSIX capabilities is available at ftp://linux.kernel.org/pub/linux/libs/security/privs.


    # 3.1.3. Process Creation and Manipulation


    Processes may be created using fork(2), the non-recommended vfork(2), or the Linux–unique
    clone(2); all of these calls duplicate the existing process, creating two processes
    out of it. A process can execute a different program by calling execve(2), or
    various front-ends to it (for example, see exec(3)), and popen(3).


