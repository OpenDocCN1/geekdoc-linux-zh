- pgno: 128
  md: '# # Chapter 11. Special Topics


    Understanding is a foundation of life to those who have it, but folly brings punishment
    to fools.

    Proverbs 16:22 (NIV)


    # ## 11.1. Passwords


    Where possible, don''t write code to handle passwords. In particular, if the application
    is local, try to depend on the normal login authentication by a user. If the application
    is a CGI script, try to depend on the web server to provide the protection as
    much as possible – but see below about authentication in a server. If the application
    is over a network, avoid sending the password as cleartext (where possible) since
    it can be easily captured by network sniffers and reused. `Encrypting a password
    using some key in the algorithm or using sort of sorting is essentially the same
    as sending the password as cleartext.


    For networks, consider at least digest passwords. Digest passwords are developed
    from hashes; typically the server will send the client data (e.g., date, time,
    name of server), the client combines this data with the user password, hashes
    this value (the "digest password") and replies the hashed result; the server verifies
    this value. This works, because the password is never sent in any form; the password
    is used to digest the hash. Digest passwords aren''t considered `encryption` in
    the usual sense and are usually accepted in countries with lax encryption for
    confidentiality. Digest passwords are vulnerable to attack threats by passive
    network sniffers. One weakness is, for digest passwords to work, the server must
    have the unaltered passwords, making the server a very tempting for target.


    If your application permits users to set passwords, check the passwords and permit
    only `good` passwords (e.g., not in a dictionary, having certain minimal length,
    etc.). You may want to look at information such as http://consult.cern.ch/writeup/security/security_3.html
    on how to choose a good password. You should use PAM if you can, which supports
    password checkers.


    # ## 11.2. Authenticating on the Web


    On the web, a server is usually authenticated to users using SSL or TLS and a
    server certificate – but it''s not as easy (e.g., web browsers do not support
    a single user certificate format and find it difficult to install them). You can
    learn about how to set up certificates from many pages, e.g., Pebrain. Java or
    JavaScript has its own problems, since many users disable them, some firewalls
    filter them out, and they tend to be. In most cases, requiring every user to install
    a plug-in is impractical, too if the system is only for an intranet for relatively
    small number of users who may be.


    If you''re building an authentication system, you should generally consider whether
    authentication system is used by your users. Kerberos, NIS+, or LDAP. You may
    also need to deal with Windows-based authentication schemes (which can be viewed
    as proprietary variants of Kerberos and LDAP). Thus, if your organization on Kerberos,
    design your system to the rest of your application, since the organization (will!)
    change their authentication system over time.'
