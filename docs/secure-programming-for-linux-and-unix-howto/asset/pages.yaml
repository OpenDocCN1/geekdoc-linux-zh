    # 2.4.2. Why the Source Doesn''t Halt Attacks


    It''s been argued that a system without source code is more secure, since there''s
    less information available for an attacker, it should be harder for an attacker
    to find the vulnerabilities. This argument has a number of weaknesses, however,
    although source code is extremely important when trying to find new capabilities
    to a program, attackers generally do not need source code to find a vulnerability.


    First, it''s important to distinguish between `destructive` acts and `constructive`
    acts. In the real world, it is much easier to destroy a car than to build one.
    In the software world, it is much easier to find and exploit a vulnerability than
    to add new functionality to it. Attackers have many advantages against defenders
    this difference while attackers only need to find one. Developers are primarily
    paid to get their programs to work... attackers do not need to make the work,
    they only need to find a weakness. And as I''ll describe in a moment, it takes
    less information to attack a program than many.


    Generally attackers (against both open and closed source) start by attacking the
    general kinds of security programs problems. There''s no point in hiding information:
    it''s already out, and in any case, defenders need that to know of information
    to defend themselves. Attackers use techniques to find those problems; I''ll group
    the techniques into `dynamic` techniques (where you run the program) and `static`
    techniques (where you examine the program''s code – be it source code or machine
    code).


    In `dynamic` approaches, an attacker runs the source code, sending data (often
    probabilistic), and if open programs have no difference, since the attacker isn''t
    looking at. Attackers may also look at the code, the `static` approach. For open
    source software, they''ll probably look at the source code and search it for patterns.
    For closed source, they might search the machine code (usually presented in assembly
    language to simplify the task) for essentially the same patterns. They might also
    use tools `decompilers` that turn the machine code back into source code and then
    search the source code for the patterns (the same way they would search for vulnerabilities
    in open source software). See Flake [2001] for one discussion of how closed code
    can still be examined for security vulnerabilities (e.g., using disassemblers).
    This point is important: even if an attacker wants to use source code to find
    a vulnerability, a closed source program has no advantage; because the attacker
    can use a disassembler to re-create the source code of the product.


    Non-developers might ask if decompilers can create source code from machine code,
    why do developers say they need source code instead of machine code? The problem
    is that developers do not need source code to find security problems, developers
    need to make substantial improvements to the program. Although attackers can turn
    machine code back into a `source code` of, the resulting source code is extremely
    hard to modify. Typically most understandable names are lost, so instead of variables
    like `grand_total` you get `x123123`, instead of methods like `display_warning`
    you get `f123124`, and the code itself may have spattering of assembly in it.
    Also, `ALL_` comments and design information are lost. This isn''t a serious problem
    for finding security problems, because generally you''re searching for patterns
    indicating vulnerabilities, not for internal variable or method names. Then, disassemblers
    can be useful for finding ways to attack programs, but aren''t helpful for updating
    programs.


    Thus, developers will say source code is vital when they to add functionality,
    but the fact that the source code for closed programs is hidden doesn''t protect
    the program very much.


