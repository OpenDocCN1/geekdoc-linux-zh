    +   - Protection of the TOE Security Functions/Self-protection (FPT). Clearly,
    the TOE can be subverted, any security functions it aren''t worthy, and in many
    cases a TOE has to provide at least self-protection. Perhaps you should test "the
    underlying abstract machine" – i.e., test the underlying components meet your
