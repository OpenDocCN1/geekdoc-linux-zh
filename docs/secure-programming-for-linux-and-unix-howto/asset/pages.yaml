  md: "```\nC='t3'\nD='t4'\nE='t5'\n```\n\n```\n% # Here's another solution, using\
    \ range:\n% eval something [range $str1 0 end] t2\n% -test\nA='t1'\nB='1'\nC='puts'\n\
    D='HELLOWORLD'\nE='t2'\n```\n\nUsing range is useful when concatenating arguments\
    \ to a called function, e.g., with more complex libraries using callbacks. In\
    \ Tcl, eval is often used to create a one–argument version of a function that\
    \ takes a variable number of arguments, and you need to be careful when using\
    \ this way. Here’s another example (presuming you’ve defined a \"printf\" function):\n\
    \n```\nproc printf {str arglist}\n  eval printf [$str] [range $arglist 0 end]\n\
    ```\n\n```\n% 1+1=2 2+2=4\n% printf \"%1+1=%d %2+2=%d\" 1 2\n```\n\nFundamentally,\
    \ when passing a command that will be evaluated, you must pass Tcl commands as\
    \ a (possibly concatenated) string. For example, the \"after\" command runs a\
    \ Tcl command after a number of milliseconds; if the data in Param1 can be controlled\
    \ by an attacker, the Tcl code is dangerously wrong:\n\n```\n# DON'T DO IF param\
    \ can be controlled by an attacker\nafter 1000 \"someCommand someparam$param1\"\
    \n```\n\nThis is because, if an attacker can control the value of $param1, the\
    \ attacker can control the program. For example, if the attacker can cause $param1\
    \ to have '[exit]', the program will exit. Also, if $param1 would be ';exit',\
    \ it will also exit.\n\nThus, the proper alternative would:\n\n```\nafter 1000\
    \ [list command someparam$param1]\nEven better would be something like the following:\n\
    ```\n\n```\nset cmd [list command someparam$param1]\nafter 1000 [concat $cmd $param1]\n\
    ```\n\nHere's another example showing what you shouldn't do, pretending that $params\
    \ is controlled by malicious user:\n\n```\nset params \"-%20s TESTSTRING\"\nputs\
    \ \"${[eval format $params]}*\"\nwill result in:\n```\n\n'TESTSTRING'\nBut, when\
    \ the untrusted user sends data with an embedded newline, like this:\n\n```\n\
    set params \"-%20s TESTSTRING\\nputs HELLOWORLD\"\nputs \"${[eval format $params]*\"\
    \nThe result will be:\n```\n\n```\nHELLOWORLD\n'TESTSTRING'\n```\n\nWojciech shows\
    \ the simplest solution in this case is to convert this to a list using range,\
    \ making this:\n\n```\nset params \"-%20s TESTINGSTRINGnputs HELLOWORLD\"\nputs\
    \ \"${[eval format [range $params 0 end]]}*\"\nThe result would be:\n```\n\n#\
    \ Chapter 10. Language–Specific Issues"
