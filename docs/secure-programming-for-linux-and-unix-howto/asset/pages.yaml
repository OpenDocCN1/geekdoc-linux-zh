    # 11.4. Specially Protect Secrets (Passwords and Keys) in User Memory


    If your application handle passwords or non-public keys (such as session keys,
    private keys, or secret keys), try to hide them and overwrite immediately after
    using them so they have minimal exposure.


    Systems like Linux use the mlock() and mockall() to keep memory from being paged
    to (since someone might acquire the key from the swap file). Note that Linux is
    a privileged system call, which calls its own issues (the program special privileges
    so call mlock, if it doesn''t need others?).


    Also, if your program handles secret keys, be sure to disable creating core dumps
    (via utility). Otherwise, an attacker may be able to halt the program and find
    the secret in the data dump.


    Beware – normally processes can monitor other processes through the debuggers
    (e.g., via ptrace(2) and the /proc pseudo-filesystem) [Vena 1996] Kernels protect
    against these monitoring routines if the process is setuid or setgid (the few
    ancient ones, there isn''t really a good way to defend yourself before upgrading).
    Thus, if your program manages secrets, you should probably make it setid or setgid
    (to a different unprivileged group or user) to forcibly inhibit this kind of monitoring.
    Once it is set, use setgid (since this grants privileges).


