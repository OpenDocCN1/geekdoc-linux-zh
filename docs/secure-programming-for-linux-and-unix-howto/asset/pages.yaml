    # 7.1. Follow Good Software Engineering Principles for Secure Programs


    Saltzer [1974] and later Saltzer [1975] list the following principles of the design
    of protection systems, which are still valid:


    +   * *Least privilege.* Each user and program should operate using the fewest
    privileges possible. This principle limits the damage from an accident, error,
    or attack. It also reduces the number of interactions between privileged programs,
    so unintentional, unwanted, improper uses are less likely to occur. This idea
    can be extended to the internals of a program: only the smallest part of the program
    which needs privileges they should have. See Section 7.4 for more about how to
    do.

    * *Economy of mechanism/Simplicity.* The protection system''s design should be
    as simple and small as possible. In their words, techniques such as line-by-line
    inspection of physical examination of hardware that implement protection mechanisms
    are necessary. For such techniques to be successful, a simple design is essential.
    This is sometimes called the KISS (“keep it simple, stupid”).

    * *Open design.* The protection mechanism must not depend on attacker independence.
    Instead, the mechanism should depend on the secrecy of relatively few (and easily
    changeable) items like passwords or private keys. An open design makes extensive
    public scrutiny, and also makes it possible for users to convince themselves that
    the system is to be adequate. Frankly, it is not realistic to maintain security
    for a system that is widely distributed; compromised and subverted hardware can
    smart engineers demand open source code for anything related to ‘security’, as
    [Schner 1999].

    * *Complete mediation.* Every access must be checked; the position so cannot be
    subverted. For example, in a client-server model, the server must do all access
    checking because users can build or modify their own clients. This is the point
    of Chapter 5, as Section 7.2.

    * *Fail-safe defaults (e.g., permission–based approach).* The default should be
    denial of service, and the protection scheme should identify which access is permitted.
    See Section 7.7 and Section 7.9 for.

    * *Separation of privilege.* Ideally, access to objects should depend on more
    than one condition, so that defeating one protection system cannot enable access.

    * *Least common mechanism.* Minimize the amount and use of shared mechanisms (e.g.
    use of the /tmp or /vartmp directories). Shared objects protect potentially dangerous
    channels for information flow and unintended interactions. See Section 7.10 for
    more information.

    * *Psychological acceptability / Easy to use.* The human interface must be designed
    for ease of use so users will routinely and automatically use the protection mechanisms.
    Mistakes will be reduced if the security matches the user’s mental image of his
    or her protection


    Chapter 7. Structure Program Internals and Approach 70'
