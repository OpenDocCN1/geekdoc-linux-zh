    # 2.4. Is Open Source Good for Security?


    There''s a lot of debate by security practitioners about the impact of open source
    approaches to security. One of the key issues is that open source exposes the
    source to examination by everyone, both the attackers and defenders, and reasonable
    people disagree about the ultimate impact of this situation. (Note – you can get
    the latest version of this essay by going to the main website for this book, http://www.dwheeler-secure-programs.


    # 2.4.1. View of Various Experts


    First, let''s examine what security experts have to say.


    Bruce Schneier is a well-known expert on computer security and cryptography. He
    argues that smart engineers `demand open source code for anything related to security`
    [Schneier 1999], and he also discusses some of the preconditions which must be
    met to make open source software. Vincent Rijmen, a developer of the winning Advanced
    Standard (AES) encryption algorithm, believes that the open nature of Linux provides
    a superior vehicle for making security vulnerabilities easier to spot and fix,"Not
    only more people can look at it, but more importantly, because the model forces
    people to write clearer code, and to adhere to standards. In this turn facilitates
    security review" [Rijmen 2000].


    Elias Lev (Aleph1) is the former manager of one of the most popular security discussion
    groups – Bugtraq. He discusses some of the problems in making open source secure
    in his article. "Is Open Source More Secure than Closed?" His summary is:


    > So all means that Open Source is no better than closed source when it comes
    to security vulnerabilities? No. Open Source certainly does have the potential
    to be more secure than its closed counter counterpart. But no mistake, simply
    being open source is no guarantee of security.


    Whitfield Diffie is the co-inventor of public-key cryptography (the basis of all
    Internet security) and chief security officer and senior staff engineer at Micros
    Systems. In his 2003 article Risk: Keeping a secret, he argues that proprietary
    vendor''s claim that their software is more secure because it is nonsense. He
    identifies and counts two main claims by proprietary vendors: (1) that release
    of code benefits attackers more than anyone else because a lot of hostile enemies
    can also look at open-code, and (2) that a few experts are better than random
    ones. He first notes that while giving access to a piece of software doesnt guarantee
    their security unless carefully, there is a group of programmers who can be called
    deeply: those who use the software personally or work for an enterprise that depends
    on it. In fact, auditing the programs on which an enterprise depends for its own
    security is a natural function of the enterprise’s own information–security organization."
    He then counters the second argument, noting that "As for the notion that open
