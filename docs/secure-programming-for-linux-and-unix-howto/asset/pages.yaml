- pgno: 65
  md: '# Secure Programming for Linux and Unix HOWTO


    If your program can be used to send email to others (such as a mail transfer agent,
    generator of data sent by email, or a mailing list manager), you should strive
    to write your program to prevent unauthorized use as a mail relay. A program should
    ideally only allow authorized users to send email to others (e.g., those inside
    your company''s mail server or those legitimately subscribed to the service).
    More information about this is in RFC 2505. Also, if you manage a mailing list,
    make sure that it can enforce the rule that only subscribers can post to the list,
    and create a “log in” feature that will make it somewhat harder for spammers to
    spam, and unsubscribe easily.


    One way to directly counter SPAM is to incorporate for the MAPS (Mail Abuse Prevention
    System LLC) RBL (Realtime Blackhole List), which maintains in real-time list of
    IP addresses where SPAM is known to occur. For more information, see http://mail-abuse.org/rbl/.
    Many Mail Transfer Agents (MTAs) already use the RBL; see their websites for how
    to configure this. The usual way to use the RBL is to refuse to accept any requests
    from IP addresses in the blacklist; this is harsh, but solves the problem. Another
    service is the Open Relay Database (ORDB) at http://ordb.org/, which identifies
    dynamically those that permit open email relays (open email relays are misconfigured
    servers that allow spammers to send email through them). Another location for
    information is SPEWS. I believe there are other similar services as well.


    I suggest that many systems and programs, by default, enable spam blocking if
    they can send email on others whose identity is under control of a remote user
    – and includes MTAs. At least, consider this. There are real problems with this
    suggestion, of course – you might (rarely) inhibit communication with a legitimate
    user. On the other hand, if you don''t block spam, it''s likely that else will
    be your system and not allow you to send email. It''s not a simple issue, because
    no matter what you do, people will not allow you. And of course, how do you trust
    the organization keeping the real-time blacklist list – they will add truly innocent
    sites to the blacklist, and they will remove sites from the blacklist list once
    all is okay? It becomes a trade-off – is it more important to talk to spammers
    (and a few innocent as well), or is it more important to talk to many other systems
    with spam blocks (losing those innocent who share equipment with spammers)? Obviously,
    this must be configurable. This is somewhat controversial advice, so consider
    your options for your circumstance.


    # 5.14. Limit Valid Input Time and Load Level


    Place timeouts and load limits, especially on incoming network data. Otherwise,
    an attacker might be able to cause a denial of service by constantly requesting
    the service.'
