- pgno: 77
  md: '# Secure Programming for Linux and Unix HOWTO


    A common technique is to create a special group, change a file''s ownership to
    that group, and make the program setgid to that. It''s better to make a program
    setid instead of setuid where you can, since group members grant rights (in particular,
    it does not grant the right to change file permissions).


    This is commonly done for high scores. Games are usually setgid games, the scores
    are owned by the group games, the programs and their configuration files are owned
    by someone else (say root). Thus, breaking into a game allows the perpetrator
    to change high scores doesn''t grant the privilege to change the game''s executable
    or configuration file. The latter is important; if an attacker could change the
    game''s executable or its configuration files (which might control the executable
    runs), then they might be able to gain control of a user who ran it.


    If creating a new pseudroup is insufficient, considering a new pseudroup (really,
    a special role) to manage a set of resources – often a new nobody(again, a special
    role) is also created to run a program. Web servers typically do this; web servers
    are set up with a user (“nobody”) so that they can be isolated from others. Indeed,
    web servers are instructive: web servers need root privileges to start up (so
    they can attach to port 80), but once started they usually all their privileges
    and run as the user “nobody”. Don''t use the “nobody” account (unless you are
    writing a webserver; instead, create your own pseudroup or new group. The purpose
    of this approach is to isolate different programs, processes, and data from each
    other, by exploiting the operating system''s ability to keep users and groups
    separate. If different programs share the same account, breaking into one program
    would also grant privileges to the other. Usually the pseudroup should not own
    the programs it runs; that way, what breaks into the account cannot run the program.
    By isolating parts of the system into running separate users and groups, breaking
    one part will not necessarily break the system''s security.


    If you''re using a database system (by calling its query interface), limit the
    rights of the database that the application uses. For example, if you have access
    to all of the system stored procedures that the application only needs access
    to a handler of user-defined interfaces. Everything is kept inside procedures.
    This way, even if someone manages to force arbitrary strings into the query, the
    damage that can be done is limited. If you must pass a regular SQL query with
    client supplied data (and you usually shouldn''t), wrap it in something that limits
    its activities (e.g., sp_execql). (My thanks to SPI Labs for these database suggestions).


    If you must run a program privileges usually as root, consider using POSIX capabilities
    as soon as your program can minimize the privileges provided to root. POSIX capabilities
    are available in Linux 2.2 and in many other Unix-like systems. By calling cap_set_proc(3)
    or the Linux-specific capset(3) routines immediately after starting, you can permanently
    reduce the abilities of your program to what it actually needs. For example the
    time daemon (ntpd) traditionally has as root, as it needs to modify the current
    time. However, patches have been deployed so ntpd only needs a single capability,
    CAP_SYS_TIME, so even if an attacker gains control over it it''s much more difficult
    to exploit the program.


    I say “somewhat limited” because, unless other steps are taken, retaining a privilege
    using POSIX capabilities requires that the process to have the root user. Because
    many files (configuration files, binaries, and so) are owned by root, an attacker
    controlling a program with limited capabilities can still modify system files
    and gain full root-level privilege. A Linux kernel extension (available in versions
    2.4.X and 2.2.19+) provides a better way to limit the abilities: a program can
    start as root (with all POSIX capabilities), prune its capabilities down to what
    it needs, prctl(PR_SET_KEEPKAPS), and then use setuid to change to a non-root
    process. PR_SET_KEEPKAPS sets a mark so that when a process changes deuid to a
    nonzero value, the capabilities are retained (normally they are cleared). This
    process is cleared on exit). However, note


