- pgno: 69
  md: '# Secure Programming for Linux and Unix HOWTO


    strncpy() does not usually add a trailing NIL n characters. This makes it harder
    to determine if a program using strncpy() is safe.


    You can use sprintf while preventing buffer overflows, but you need to be careful
    when doing so; it''s so easy to mistake that it''s hard to recommend. The sprintf
    string can contain various conversion specifiers (e.g., "%s”), and the control
    specifiers also have optional field width (e.g., "%%10s") and precision (e.g.,
    "%.10s”). These look quite similar (the only difference is a period) but they
    are very different. The field width specifies a minimum length and is completely
    worthless for preventing buffer overflows. In contrast, the precision specifies
    the maximum length that string will have when you have it in output as a string
    specifier— and thus it can be used to protect against overflows. The precision
    specifies only the maximum length when dealing with a string; if the size is given
    as a parameter "* then you can pass the maximum size as a parameter (e.g., the
    result of a sizeof() operation). This is most easily shown by an example—the right
    and wrong way to use sprintf() to protect against overflows.


    ```

    char buf[SIZE];

    sprintf(buf, "%s", sizeof(buf)-1, "long-string"); /* WRONG */

    sprintf(buf, "%.*s", sizeof(buf)-1, "long-string"); /* RIGHT */

    ```


    In theory, sprintf() would be very helpful because you can use it to specify complex
    formats. Sadly, it''s easy to get things wrong with sprintf(). If the format is
    complex, make sure that the destination is large enough for the largest possible
    size of the entire format, but the precision field only controls the size of one
    parameter. The "largest possible" value is often there when a complicated operation
    is being created. If a program doesn''t allocate enough space for the possible
    combination, a buffer overflow may occur. Also, sprintf() appends a null to the
    destination after the operation is complete— this extra character is easy to forget
    and creates an opportunity for off-by-one errors. So, while it works, it can be
    used in some circumstances.


    Also, a quick note about the above code—note that the sizeof() operation used
    the size of the array. If the code were changed so "buf" was a pointer to some
    allocated memory, then all "sizeof() operations would have to be changed (or sizeof
    would just measure the size of the pointer, which isn''t enough space for values).


    The scanf family is a little murky. An obvious question is whether or not the
    maximum width value can be used in % to prevent these attacks. There are multiple
    official specifiers for scanf; some clearly state that the width parameter is
    the absolute number of characters, others aren''t as clear. The biggest implementations,
    modern implementations that I know of support maximum widths, I cannot say with
    certainty that all libraries properly implement maximum widths. The safest approach
    is to do it yourself in some cases. However, few will fail if you simply use scanf
    and include the widths in the format strings (but not to count ''0, or you''ll
    get the wrong length). If you use scanf, it''s best to test in your implementation
    scripts to ensure that the library properly limits length.


    # 6.2.2. Static and Allocated Buffers


    Functions like strncpy are useful for dealing with allocated buffers. This programming
    approach where a buffer is allocated for the "longest useful size" and then stays
    a fixed size from then. The alternative is to dynamically reallocate buffers as
    you need them. It turns out that both approaches have security implications.


    There is a general security problem when using fixed-length buffers: the fact
    that a buffer is a fixed length may be exploitable. This is a problem with strncpy(3)
    and strcat(3), snprintf(3), strlcat(3), and other functions. The basic idea is
    that the attacker sets up a really long string so that the string is


