    # 5.9.3. UTF-8 Security Issues


    The reason to mention UTF–8 is that some byte sequences are not legal UTF–8, and
    this might be an exploitable security hole. UTF–8 is supposed to use the “shortest
    possible” encoding, but naive decoders may accept encodings that are longer than
    necessary. Earlier standards permitted decoders to accept “non-shortest form”
    encoding. The problem here is that dangerous input could be represented multiple
    ways, which might defeat security routines checking for dangerous inputs. The
