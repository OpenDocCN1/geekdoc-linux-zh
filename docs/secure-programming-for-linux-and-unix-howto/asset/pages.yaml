  md: '# Secure Programming for Linux and Unix HOWTO


    FreeBSD has a new system call, jail(2). The jail system supports sub-partitioning
    an environment into many virtual machines (in a sense, a `super-chroot`); its
    most popular use is to provide virtual services for Internet Service Providers.
    Inside a jail, all processes (even those owned by root) have the scope of their
    requests limited to the jail. When a FreeBSD system is booted after a fresh, no
    processes will be in jail. When a process is placed in a jail, any descendants
    of that process created will be in jail. In a jail, access to the file system
    is restricted in the style of chroot(2) (with typical escape routes), the ability
    to bind network resources is limited to a specific IP address, the ability to
    manipulate system resources and perform privileged operations is sharply curtailed,
    and the ability to interact with other processes is limited to processes inside
    the same jail. Note that each jail is bound to a single IP address; processes
    within the jail may not use of any other IP address for outgoing or incoming connections.


    Some extensions available in Linux, such as POSIX capabilities and some mount-time
    options, have already been deemed. Here are a few of these efforts for Linux systems
    creating restricted execution environments; there are many different approaches.
    The U. National Security Agency (NSA) has developed Security-Enhanced Linux (Flask),
    which supports defining a policy in a specialized language and then enforces it.
    The Medusa D59 extends Linux by supporting, at the kernel level, a user-space
    tracers files and processes, allowing administrators to `lock down` their system.
    The `Rule Set Based Access Control` system, RSBAC is based on the Generalized
    Framework for Access Control (GFAC) by Abrams and LaPadula and provides a flexible
    system of access control based on several kernel modules. Subterfuge is a framework
    for `observing and playing with the reality of software`; can intercept system
    calls and change their parameters and/or change their return values to implement
    sandboxes, tracers; and so; it runs under Linux 2.4 without changes (it doesn''t
    require any kernel modifications). Janus is a security tool for sandboxing untrusted
    applications within a restricted execution environment. Some have used User-mode
    Linux, which implements `Linux on Linux`, as a sandbox implementation. There are
    so many different approaches to implementing more sophisticated security models,
    Linux Torvalds has requested a generic approach be developed so different security
    policies can be inserted; for more information about this, see: http://mail.wirex.com/mailing/list/linux-security-module.


    There are many other extensions for security on Unix–like systems, but these are
    really outside the scope of this document.'
