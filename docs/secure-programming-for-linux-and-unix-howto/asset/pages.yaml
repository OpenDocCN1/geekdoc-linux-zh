    of possible security requirements that someone might want. PP authors pick from
    the various options to describe what they want, and ST authors pick from the options
    to describe what they provide.


    Since many people have difficulty identifying a reasonable set of assurance requirements,
    so pre-created sets of assurance requirements called `evaluation levels` (EALs)
