- pgno: 64
  md: '# Secure Programming for Linux and Unix HOWTO


    If the only action that a malicious content attack perform is to make the user
    view unexpected data, this isn''t as serious as a problem. This can still be a
    problem of course, since there are some attacks that can be made using this capacity.
    For example, there a potential loss of privacy by the user requesting something
    unexpected, possible real-world effects from appearing illegal or infringing material,
    or by making the user request information in certain ways the information may
    be exposed to an attacker in ways normally would not be expected. However, even
    more serious effects can be caused by the attacker can cause just data viewing,
    but changes in data, through a cross-site link.


    Typical HTTP interfaces (such as most CGI handlers) normally hide the differences
    between GET and POST, since for getting data it''s useful to treat the methods
    "the same way". However, for attacks that actually do something other than a data
    query, check to see if the request is something other than POST; if it is, simply
    display a filled-in form with the data and ask the user to confirm that they really
    mean the request. This will prevent cross-site malicious attacks while still giving
    the users convenience of confirming the action with a single click.


    Indeed, this behavior is highly recommended by the HTTP specification. By the
    HTTP 1.1 specification (IETF RFC 2616 section 9.1), the GET and HEAD methods SHOULD
    NOT have the significance of taking an action other than retrieval. These methods
    should be considered "safe". This allows user agents to represent other methods,
    such as POST, PUT and DELET, in a way, so that the user is made aware of a possibly
    unsafe action is being requested.


    In interest of fairness, I note that this doesn''t completely solve the problem,
    because some browsers (in configurations) scripted posts can do the same thing.
    For example, imagine a web browser with ECMScript(JavaScript) received the following
    HTML snippet - on some browsers, simply displaying this snippet will automatically
    force the user to send a POST request to a website chosen by them, with data defined
    by the attacker:


    ```

    <form action=http://script.cgi method=post>

    <input type=hidden name=action value="do something">

    <input type=submit>

    </form>

    <script>document.b.submit()</script>

    ```


    My thanks to David pointing this out. However, although this advice doesn''t solve
    all problems, it is still worth doing. In fact, this problem can be solved by
    smarter web browsers (e.g., by always confirming the data before allowing ECMScript
    to send a web form) or by browser configuration (e.g., disabling ECMScript). Also,
    this attack doesn''t work in many-cross scripting exploits, because many websites
    do not allow users to post "script" commands but do allow URL links. Thus, limiting
    the attacker GET command to perform queries significantly improves application
    security.


    # 5.13. Counter SPAM


    Any program that can send email, by request from the network, can be used to transport
    spam. Spam is the same name for unsolicited bulk email (UBE) or mass unsolicited
    email. It''s sometimes called unsolicited commercial email (UCE), though that
    name is misleading - not all spam is commercial. For a discussion of why spam
    is such a serious problem and more general discussion about it, see my essay at
    http://www.dwwheeler.com/essays/spam.html, as well as http://mail-abuse.org/;
    spam.abuse.net/ CAUCE, and JETF RFC 2635. Spam receivers and intermediaries bear
    most of the cost of spam, while the spammer spends little to send. There many
    people regard spam as a theft of harmless activity, and that number increases
    as the amount of spam increases.


