  md: '# Secure Programming for Linux and Unix HOWTO


    put in an opening "<" and `helpfully` insert one – attackers can exploit this
    behavior and use the ">" to create an undesired "<"


    Usually the character set for transmitting HTML is ISO-8859-1 (even when international
    text), the filter should also omit most control characters (linefeed and tab are
    usually okay) and characters with their high-order bit set.


    One problem with this approach is that it can really surprise users, especially
    those entering international text if all international is quickly removed. If
    the invalid characters are quickly removed without warning, that data will be
    irrevocably lost and cannot be reconstructed later. One alternative is forbidding
    such characters and sending error messages back to users who attempt to use them.
    This at least warns users but doesn''t give them the functionality they were looking
    for. Other alternatives are encoding this data or validating this data, which
    are discussed next.


    # 5.11.2. Encoding HTML Data


    An alternative that is nearly as safe is to transform the characters so that their
    meaning in HTML. This can be done by translating "<" to &lt;, ">" to &gt;, and
    "&" to &amp;. Arbitrary international characters can be encoded in Latin-1 using
    the format &#value; – do not forget the ending semicolon. Encoding the international
    characters means you know what the input encoding was, of course.


    One possible danger here is if these are accidentally interpreted twice, they
    will become a vulnerability. However, this approach permits later users to see
    the "intent" of the input.


    # 5.11.3. Validating HTML Data


    Some applications, to work at all, must accept HTML from third parties and send
    them to their users. Beware — you are trading dangerous ground at this; be sure
    you really want to do this. Even the idea of accepting HTML from arbitrary places
    is controversial among some security practitioners, because it is extremely difficult
    to get it right.


    However, if your application must accept HTML, and you believe that it''s worth
    the risk, at least identify a list of `safe` HTML commands and only permit those
    commands.


    Here is a minimal set of `safe` HTML tags that might be useful for applications
    (such as guestbooks) that support short comments: `<p>`, `<b>`, `<i>`, `(italics)`,
    `<em>`, `<strong>`, `<em>` (<preformatted>), `<br>` (forced line break – it does
    not require a closing) as well as all their ending tags.


    Not only do you need to ensure that only a small set of `safe` HTML commands are
    accepted, you also that they are properly nested and closed (i.e., the HTML commands
    are "balanced”). In XML, this is termed ``well-formed``. few exceptions could
    be made if you''re accepting standard HTML (e.g., supporting an implied `<p>`
    where not provided a `<p>` would be fine), but to accept HTML in its full generality
    (including closing tags in many cases) is not needed for most applications. Indeed,
    if you''re trying to stick to XHTML (instead of HTML), then well-formedness is
    a requirement. Also, HTML tags are case-insensitive; they can be uppercase, lower
    case, or a mixture. However, if you intend to use XHTML then you will require
    all tags to be in lower case (XML is case-sensitive; XHTML uses XML and the tags
    to be in lower case).


