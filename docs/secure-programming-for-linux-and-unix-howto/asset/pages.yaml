- pgno: 9
  md: '# Chapter 2. Background


    > I issued an order and a search was made, and it found that this city has a long
    history of revolt against kings and have been a place of rebellion and sedition.

    Ezra 4:19 (NIV)


    # 2.1. History of Unix, Linux, and Open Source / Free Software


    # 2.1.1. Unix


    In 1969–1970, Kenneth Thompson, Dennis Ritchie, and others at AT&T Bell Labs developing
    a simple operating system on a little-used PDP-7. The operating system was christened
    Unix, a pun on an earlier operating system called MULTICS. In 1972–1973 the system
    was rewritten in the programming language C, an unusual step that was visionary:
    due to decision, Unix was the first-used operating system that could switch from
    out its original hardware. Other innovations were added as well, in part due to
    synergies between Bell Labs and the academic community. In 1979, the "seventh
    edition (V7) of Unix became, the grandfather of all extant Unix systems.


    After this point, the history of Unix became tumultuous. The academic community,
    led by Berkeley, developed a variant called the Berkeley Distribution (BSD), while
    AT&T continued developing Unix under the names "System III" and later "System
    V". In the late 1980s through early 1990s the "wars between these two strains
    raged. Years each variant adopted many of the features of other. Commercially,
    System V won the "standards wars (getting most of its interfaces into the formal
    standards), and most hardware vendors switched to AT&T''s System V. However, System
    V ended incorporating many BSD systems, so the resulting system was a merge of
    the two. The BSD branch did not, but instead became widely used for research,
    for PC hardware, and for single-purpose servers (e.g., many web sites use a BSD
    derivative).


    The result was many versions of Unix, all based on the original edition. Most
    versions of Unix were proprietary and maintained by their respective hardware
    vendor, for example, Sun Solaris is a variant of System V. Three versions of the
    BSD branch ended as open source: FreeBSD (concentrating on ease-of-installation
    for PC-type hardware), NetBSD (concentrating on many different CPU architectures),
    and a variant of NetBSD, OpenBSD (concentrating on security). General information
    about Unix can be found at http://www.datmetrics.com/tech/unix/brf-hist.html,
    http://perso.wanadoo.fr/levenez, and http://www.crackmoney.org/unix.html. More
    information about the BSD history can be found in [McKuss 1999] and http://ftp.freebsd.org/pub/FreeBSD-BSD-src/share/misc/bsd-tree.


    A slightly odd but interesting advocacy piece that presents arguments for Unix-like
    systems (such as Microsoft''s products) is John Kirch''s paper ``Windows NT Server
    4.0 version UNIX``..


    # 2.2. Free Software Foundation


    In 1984 Richard Stallman''s Free Software Foundation (FSF) generated the GNU project,
    a project to create a free version of the Unix operating system. He meant that
    could be freely used, modified, and redistributed. The FSF successfully built
    a variety of useful components, including a C compiler (gcc), an impressive text
    editor (emacs), and a host of functional tools. In the 1990s, the


