    Before discussing guidelines on how to use Linux or Unix security features, it''s
    useful to know what those features are from a programmer''s viewpoint. This section
    briefly describes those features that are widely available on all Unix-like systems.
    However, note that there is considerable variation between different versions
    of Unix-like systems, and not all systems have the attributes described here.
    This chapter also notes some extensions or features specific to Linux; Linux distributions
    to be fairly similar to each other from the point-of-view of programming for security,
    which all essentially use the same kernel and C library (or GPL based license
    encourage rapid dismissal of any innovations). It also notes some of the security-relevant
    differences between Unix implementations, but please note that this isn''t an
    exhaustive list. This chapter doesn''t discuss such implementations of mandatory
    access control (MAC) which many Unix-like systems do not use. If you need, feel
    free to skip this section.


    Many programming guides skip over the security-relevant portions of Linux or Unix
    and skip important information. In particular, they often discuss ``how to use
    something'''' in great detail but gloss over the security attributes that affect
    their use. Conversely, there''s a great deal of information in the manuals about
    individual functions, but the manual sometimes obscures key security issues with
    detailed discussions on how to use each function. This section tries to bridge
    that gap, it offers an overview of the security mechanisms in Linux that are likely
    to be used by a programmer, concentrating specifically on the security ramifications.
    This section has more than the typical programming guides, focusing specifically
    on security-related matters, and references to where you can get more details.


    First, the basics. Linux and Unix are fundamentally divided into two parts: the
    kernel and user space. Most programs execute in user space (on top of the kernel).
    Linux uses the concept of ``kernel modules'''', which is simply the ability to
    dynamically load code into the kernel, but note that it still has this fundamental
    division. Other systems (such as the HURD) ``microkernel'''' based systems; have
    a small kernel with limited functionality, and a set of ``user'''' processes that
    implement the lower-level functions traditionally implemented by the kernel.


    Some Unix systems have been extensively modified to support security, in particular
    to U.S. Department of Defense requirements for Mandatory Access Control (level
    B1 or B2). This version of book doesn''t cover these issues; I hope to expand
    that in a future version. More detailed information on some of them is available
    elsewhere, for example, details on SGI''s ``Trusted IRIX/B'''' are available in
    NASA''s, [Final Evaluation Reports (FERs)].


    When using id, their usernames are mapped to integers marking their ``UID''''
    (for ``user id'''') and ``GID'''' (for ``group id'''') that they are member of.
    A privileged user (role) traditionally called ``root'''', on many Unix-like systems
    (including Unix) can root over most security checks and is used to operate the
    system. On some Unix systems, GID 0 is also special and permits access to resources
    at the group level (Gao, 2000, 228); this isn''t on other systems (such as Linux),
    but even in those systems group 0 is essentially all-powerful so many special
