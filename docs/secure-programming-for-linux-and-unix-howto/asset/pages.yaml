    # 5.3. File Descriptors


    A program is a set of open file descriptors, that is, pre-opened files. A setuid/setgid
    program must deal with the fact the user selects what files are open and to what
    (their permission limits). A setuid/setgid program must not assume that opening
    a new file will always open into a fixed file descriptor id, or that the open
    will succeed at all. It must also not assume that standard input (stdin), standard
    output (stdout), and standard error (stderr) refer to a terminal or are even open.


    The rationale behind this is easy; since an attacker can open a file descriptor
    before starting the program, the attacker could create an unexpected situation.
    If the attacker closes the standard output, when the program next the file it
    will be opened as the output, and then it will be all standard output to that
    file well. Some libraries will automatically open stdin, stdout, and stderr if
    they aren''t already opened on; for example, on some systems it''s possible to
    create a race condition that causes this atomic opening to fail (and still run
    the program).


    # 5.4. File Names


    The names of files, in certain circumstances, can cause serious problems. This
    is especially a problem for secure programs that run on computers with untrusted
    users, but this is limited to that circumstance. Remote users might be able to
    trick a program into creating undesirable filenames (programs should prevent this,
    but not all), or remote users may have partially penetrated a system and try using
    this to penetrate the rest of the system.


    Usually you will not want to include "..." (higher directory) as a value from
    an untrusted user, though that depends on the circumstances. You might also want
    to list only the characters you will permit, and forbidding any filenames that
    do not match the list. It is better to prohibit any change in directory, e.g.,
    by not including "^" in the set of legal characters, if you are taking data from
    an external user and transforming it into a filename.


    Often you shouldn''t support "globbing", which is expanding filenames using "*",
    "?", and possibly "[]" (matching \*\**: For example, the command "ls *.png" does
    a glob on *.png" to list all PNG files. The C fopen3 (example) does not enable
    globbing, but the shell performs glob by default, and in C you can request globbing
    (using example) glob3). If you don''t need globbing, just use the calls that don''t
    need it (e.g., globbing characters in a shell). It is especially careful if you
    want to permit globbing. Globbing can be useful, but complex glob takes a lot
    of dealing with time. For example, on some fp servers, performing a few of these
    requests can cause a denial–service of the entire machine.


    ```

    ftp ~ /*/*/*/*/*/*/*/*/*/*/*/*/*/*/*/*/*/*/*

    ```


    Trying to allow globbing, yet limit glob patterns, is probably futile. Instead,
    make sure that any programs run as a separate process and use process limits to
    limit the amount of CPU and other resources they can consume. See Section 7.4.8
    for more information on this approach, and Section 3.6 for more information on
    how to set these limits.


