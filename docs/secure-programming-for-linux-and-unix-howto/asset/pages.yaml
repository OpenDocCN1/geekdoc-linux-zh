    > Proverbs 2:12 (NIV)


    Some inputs are from untrustable sources, so those inputs must be validated (filtered)
    before being used. You should determine whether that input is legal and reject
    anything that does not match that definition. Do not do the reverse (identify
    what is illegal and write code to reject those cases), because you are likely
    to handle important case of input.


    There is a good reason for identifying `illegal` values


    Limit the maximum length (and minimum length), and not to lose control when lengths
    exceed (see Chapter 6 for more buffer overflows).


    Here are some common data types, and which you should validate before using from
    an untrusted user:


    +   * For strings, identify the legal characters or legal patterns (e.g., as a
    regular expression) and reject anything not matching that form. For are special
    problems when strings contain control characters (especially linefed or NIL) or
    metacharacters (especially shell metacharacters); it is often best to `escape`
    such characters immediately when received so that such characters are not accidentally
    sent. CERT gets you escape all characters that are not in a list of metacharacters.
    [CERT 1998, CMC 1998]. See Section 8.3 for more information on metacharacters.
    Note that line ending varies you need to support all of different systems: Unix-systems
    use character 0x0a (linefeed), CPM and DOS systems (including Windows) use 0x0d
    0x0a (carriage-return line), and IBM OS/39 uses 0x0d 0x85 (which sometimes called
    newline).

    * Limit all numbers to the minimum (zero) and maximum allowed values.

    * A full email address is actually quite clean, because there are legacy formats
    that might greatly validate input if you need to support all of them; see mailaddr
    [RFC 822] for more information if such checking is necessary. Friedl [1997] developed
    a regular expression to check if an email address is valid (according to the specification);
    his `short` regular expression is 4,724, and his `optimized` expression (in appendix
    B) is 6,598 long. And even that regular expression isn''t perfect; it cannot recognize
    local email addresses, and it cannot handle nested parentheses (in the comments
    specification). If you can simplify and only permit the `common` Internet addresses.

    * Filenames should be checked; see Section 5.4 for more information on filenames.

