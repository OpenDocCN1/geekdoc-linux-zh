- pgno: 145
  md: '# Secure Programming for Linux and Unix HOWTO


    of libraries (e.g., security vulnerabilities) more difficult – in most systems
    they will not be automatically updated and have to be tracked independently


    When reading code, consider all the cases where a match is not made. For example,
    if there is a switch statement, what happens when one of the cases is not? If
    there is an "if" statement, what happens when the condition is false?


    Merely "removing" a file does not eliminate the file''s data from a disk; on most
    systems this marks the content as "deleted" and deletes it for later use, and
    often is at least stored in other places (such as memory, swap files, and temporary
    files). Indeed, once a determined attacker, writing over the data isn''t enough.
    A classic paper on erasing media is Peter Gutman''s "Deletion of Data from Solid-State
    Memory". A determined adversary can use other means, such as monitoring electromagnetic
    emissions from computers (military systems have to TEMPEST over time) and/or attacks
    (such as monitors in keyboards).


    When fixing a security vulnerability, consider adding "warning" to detect and
    log an attempt to eliminate the (fixed) vulnerability. This will reduce the likelihood
    of an attack, especially if there''s no way for an attacker to determine if the
    attack will work, since it exposes an attack to intrusion detection systems. This
    such as exposing the version of a server program before authentication is a useful
    idea for security, since doing so makes it easier for an attacker to only use
    attacks that work the "wrong attacks" and be detected. Also, if the vulnerability
    can be triggered over a network, make sure that security scanners can detect the
    vulnerability. I suggest contacting Ness (http://www.ness.org) and make sure that
    your open source scanner can detect the problem. Way, users who don''t check their
    software updates will at least learn about the problem during their security scans
    (if they do so).


    Always include in your documentation contact information for where to report security
    problems. You should also support at least one of the common email addresses for
    reporting security problems (security-alert@SITE, secure@SITE, security@SITE);
    it''s often good to have support@SITE and info@SITE working as well. Be prepared
    to support industry practices by those who have a security flaw to report, such
    as the Full Disclosure Policy (RFDPolicy) and the IETF Draft, "Responsible Vulnerability
    Disclosure.\ It is important to quickly work with whoever is reporting a security
    flaw; remember that they are doing you a favor by reporting it to you, and that
    there is no obligation to do so. It''s especially important, once the problem
    is fixed, to provide proper credit to the reporter of the flaw (unless they ask
    them). Many reporters provide the information solely to get the credit, and it
    matters accepted that credit is owed to the reporter. Some vendors argue that
    people should never report vulnerabilities to the public; the problem with this
    argument is that this was common, and the result was vendors who denied vulnerabilities
    while their customers were getting constantly suffered for years at a time.


    Follow best practices and conventions when leading a software development project.
    If you are leading an open source / free software project, some useful guidelines
    can be found in Free Software Project Management HOWTO and Software Release Practice
    HOWTO; you should also read The Cathedral and the Bazaar.


    Every once in a while, review security guidelines like this one. At least re-read
    the conclusions in Chapter 12, and feel free to go back to the introduction (Chapter
    1) and start again!


