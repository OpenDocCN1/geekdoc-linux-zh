    # 7.9. Fail Safe


    A secure program should always `fail safe`; that is, it should be designed so
    that if the program fails, the safest result should occur. For security-critical
    programs, which usually means that if some of misbehavior is detected (malformed
    input, reaching a `can''t get here` state, and so on), the program should immediately
    deny service and stop processing that request. Don''t try to `figure out what
    the user wanted` can decrease reliability or usability (from a user''s perspective),
    but increases security. There are a few cases where this might not be desired
    (e.g., where denial of service is worse than loss of confidentiality or integrity),
    but such cases are quite rare.


    Note I recommend `stop processing the request`, not `fail altogether`. In particular,
    most servers should not completely halt when given malformed input, because that
    creates a trivial opportunity for a denial of service attack (the attacker sends
    barrage to prevent you from using the service). Sometimes the whole server down
    is necessary, in particular, reaching some `can''t get here` states may signal
    a problem so drastic that continuing is unwise.


    Consider carefully what error message you send back when a failure is detected.
    If you send nothing back, it might be hard to diagnose problems, but sending back
    too much might unintentionally aid an attacker. The best approach is to reply
    with `access denied` or `miscellaneous error encountered` and then write more
    detailed information to an audit log (where you can have more control over who
    sees the information).


    # 7.10. Avoid Race Conditions


    A `race condition` can be defined as `Anomalous behavior due to unexpected dependence
    on the relative timing of events` [FOLDOC0]. Race conditions generally involve
    one or more processes accessing a shared resource (such a file or variable), where
    multiple access has not been properly controlled.


    In general, processes do not execute atomically; another process may interrupt
    it between any two instructions. If a secure program''s process is not prepared
    for these interruptions, another process may be able to interfere with the secure
    program''s process. Any pair of operations in a secure program must work correctly
    if arbitrary amounts of another''s code are executed between them.


    Race condition problems can be notionally divided into two categories:


    +   * Interference caused by untrusted processes. Some security taxonomies call
    this problem a `sequence` or `non-atomic` condition. These cases are caused by
    processes running other, different programs, which `slip in` over actions between
    steps of the secure program. These other programs might be invoked by an attacker
    specifically to cause the problem. This book will call these sequencing problems.


    +   * Interference caused by trusted processes (from the secure program''s point
    of view). Some call these deadlock, livelock, or locking failure conditions. These
    are caused by processes running the `same` program. Since these different processes
    may have the `same` privileges, if not properly controlled they may be able to
    interfere with each other in a way other programs can''t. This kind of interference
    can be exploited. This book will call these locking problems.


    Chapter 7. Structure Program Internals and Approach


