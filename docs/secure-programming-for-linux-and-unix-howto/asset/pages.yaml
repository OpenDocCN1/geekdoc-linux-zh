  md: '# Secure Programming for Linux and Unix HOWTO


    Microsoft. If you are trying to write source programs for Microsoft''s Windows
    systems, it''s a good book. Another useful source of source programming guidance
    is the Open Web Application Security Project (OWASP) Guide to Building Secure
    Applications and Web Services; it has more on process, and less than this book,
    but it has useful material in it.


    This book covers all Unix-like systems, including Linux and the various strains
    of Unix, and particularly stresses stresses and provides details about Linux specificity.
    There''s some material specifically on Windows CE, and if you know relevant information
    not already included here please let me know.


    This book is copyright (C) 1999–2002 David A. Wheeler and is covered by the GNU
    Free Documentation License (GFDL); see [Appendix C](#) and [Appendix D](#) for
    for more information.


    Chapter 2 discusses the background of Unix, Linux, and security. Chapter 3 describes
    the general Unix and Linux security model, as giving an overview of the security
    attributes and operations of processes, filesystem objects, and so on. This is
    followed by the meat of this book, a set of design and implementation guidelines
    for developing applications on Linux and Unix systems. The book ends with conclusions
    in Chapter 12, followed by a bibliography and appendices.


    The design and implementation guidelines are divided into categories which I believe
    emphasize the programmer''s viewpoint. Programs accept inputs, process data, call
    to other resources, and produce output, as shown in [Figure 1–1](#): notionally
    all security guidelines fit into one of these categories. I''ve subdivided "process
    data" into structuring programs internals and approach, avoiding buffer overflows
    (which in some cases also be considered an input issue), language-specific, and
    special topics. The chapters are ordered to make the material easier to follow.
    The book chapters give guidelines validating all input [Chapter 5](#), avoiding
    overflows [Chapter 6](#), structuring programs internals and approach [Chapter
    7](#), carefully calling out to other resources [Chapter 8](#), judiciously sending
    information back [Chapter 9](#), language-specific information [Chapter 10](#),
    and finally information on special topics such as how to acquire random numbers
    [Chapter 11](#


