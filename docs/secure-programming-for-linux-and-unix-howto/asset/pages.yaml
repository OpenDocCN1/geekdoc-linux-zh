    # 2.3 Why do Programmers Write Insecure Code?


    Many programmers do not intend to write insecure code – but anyway. Here are a
    number of purported reasons for this. Most of these were collected and summarized
    by Aleph One Bugtrag (in a posting on December 17, 1998):


    +   * There is no curriculum that addresses security in most schools. When there
    is a computer security curriculum, they often don''t discuss how to write secure
    programs as a whole. Many such curriculum only study certain areas such as cryptography
    or protocols. These are important, but they often fail to cover real-world issues
    such as buffer overflows, formatting and input checking. I believe this is one
    of the most important problems; even programmers who go through colleges and universities
    are very unlikely to know how to write secure programs, yet we depend on these
    people to write secure programs.

    * Programming books/classes do not teach secure/programming techniques. Indeed,
    there were no books on how to write secure programs at (this is one of them).

    * No one uses formal methods, and the standard C library string functions are
    unsafe. This is particularly important because C is so widely used – ``simple''''
    ways of using C permit exploits.

    * Programmers do not think ``multi-user.

    * Programmers are human and lazy. Thus, programmers will use the ``easy'''' approach
    instead of a secure approach – once it works, they often fail to fix it.

    * Most programmers are not security people; they often don''t think like an attacker
    does.

    * Most security people are not programmers. This was a statement made by some
    Bugtrag contributors, Most security models are terrible.

    * There are lots of ``broken'''' legacy software. Fixing this today (to remove
    security faults or to make it work with more restrictive security policies) is
    difficult.

    * Consumers do not care about security. (Personally, I hope that consumers are
    beginning to care about security; a computer system that is constantly exploited
    is neither useful nor user-friendly. Also, many consumers are unaware that there''s
    even a problem, that it can''t happen to them,


