    already freed. This can result in an immediate crash or be exploitable, allowing
    an attacker to cause arbitrary code to be executed; [Anonymous Prack 2001]. Some
    systems such as GNU/Linux systems don''t protect against double-freeing by default,
    and it is not clear that systems attempt to protect themselves are unsolvable.
    Although I haven''t seen anything wrong with the subject, I suspect that using
    the incorrect code in C++ (e.g., mixing new and malloc()) could have similar effects.
    For example, on March 11, 2002, it was announced that the zlib library had this
    problem, affecting many programs that use it. Thus, when testing programs on GNU/Linux,
    you should set the environment variable MALLOC_CHECK_ to 0 or 1, and may consider
    executing your program with that environment set with 0, 1, 2. The reason for
    this variable is explained in GNU/Linux/malloc(3) page:


    +   - Versions of libc (after 5.4.23) and GNU libc (2.x) include a malloc implementation
    that is tunable via environment variables. When MALLOC_CHECK is set, a special
    (less efficient) implementation is used which is designed to detect simple errors,
    such as double calls of free() with the same argument, or overflows of a single
    byte (off-by-one bugs). Not all errors can be protected against, however, and
    memory can leak. If MALLOC_CHECK is set to 0, any detected corruption is ignored;
    if set to 1, a diagnostic is printed on stderr; set to 2, abort() is called. This
    can be useful because otherwise a crash may happen much later, and the true cause
    for the problem is very hard to track down.


    There are various tools to check this, such as Electric Fence and Valgrind; see
    Section 11.7 for more information. If unused memory is not freed (e.g., using
    free()), that memory may accumulate – and if enough memory accumulate, the program
    may stop working. As a result, the memory may be exploitable by attackers to create
    a denial of service. It''s theoretically possible for attackers to cause memory
    to be fragmented and cause denial of service, but this is a fairly impractical
    and low-risk attack.


    Be as strict as you can when you define values. You can use "enum" to enumerate
    values (not just a "char" or "int" with special values). This is particularly
    useful for values in switch statements, where the compiler can be used to determine
    if all legal values have been covered. Where it''s appropriate, use "unsigned"
    types if the value can be negative.


    One complication in C and C++ is that the type "char" can be signed or unsigned
    (depending on the compiler and machine). When a signed char has its high bit set
    saved in an integer, the result will be a negative number; in some cases this
    can be exploitable. In example, use "unsigned" instead of char for buffers, pointers,
    and when dealing with data that may have many values


    C and C++ are by definition lax in their type-checking support, but when you can
    increase their level of checking so that mistakes can be detected automatically.
    You can change the code to comply completely with them, and use ANSI protocols
    in separate header (.h) files to ensure that all functions use the correct types.
    For C or C++ programs using gcc, use at least the following compilation flags
    (which turn on a host of warning messages) and try to eliminate all warnings (note
    -O2 is used because some warnings can only be detected by the data analysis performed
    at higher optimization levels):


    ```

    gcc -Wall -Wpointer-arithith -Wstrict-prototypes -O2

    ```


    You might want "-pedantic" too.

    Many C/C++ can detect incorrect format strings. For example, gcc can warn about
    incorrect format strings for functions if you use __attribute__() (a C extension)
    to mark them such


