    # ## 9.6 Prevent Include/Configuration File Access


    When developing web applications, do not allow users to access (read) files such
    as the program include and configuration files. This data may provide enough information
    (e.g., passwords) to break into your system. This guideline also applies to other
    kinds of applications. There are several actions you can take to do this:


    +   * Place the include/configuration files outside of the web document root (so
    that the web server will serve the files). Really, this is the best approach unless
    there''s some reason the files have to be inside the document root.

    * Configure the web server so it will not include files as text. For example,
    if you''re using Apache, you can add a handler or an action for .inc files like
    so:

    * Use a filter to deny access to the files. For Apache, this can be done using:


    ```

    <Files "*.inc">

    Order allow,deny

    Deny from all

    </Files>

    ```


    ```

    <Files "*.phpincludes">

    Order allow,deny

    Deny from all

    </Files>

    ```


    +   If you need full regular expressions to match filenames, in Apache you could
    use the FilesMatch directive.

    * If your include file is a valid script, which your server will parse, make sure
    that it doesn''t act on user-supplied parameters and it''s designed to be secure.


    These approaches will protect you from users who have access to the directories
    your files are in if they are world—readable. You could change the permissions
    of the files so that only the uid/gid of the webserver can read these files. However,
    this approach won''t work if the user can get the web server to run his own scripts


