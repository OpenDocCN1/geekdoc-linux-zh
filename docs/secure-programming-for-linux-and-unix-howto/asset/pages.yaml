    # 11.9. Write Audit Records


    Write audit logs for program startup, session startup, and for suspicious activity.
    Possible information of value

    include date, time, uid, eid, gid, terminal information, proc, and command line
    values. You may

    find the syslog(3) helpful for implementing audit logs. One awkward problem is
    that your logging

    system should be able to record a lot of information (since this could be very
    helpful), yet if the

    information is not handled correctly the audit tool itself could be used to create
    an attack. All, if the

    attacker controls some of the input being sent to the program. When recording
    data by a possible attacker,

    identify list of `expected` characters and escape any `unexpected` characters
    that the log is not corrupted.

    Not doing this can be a problem; users may use logging characters such as control
    characters (especially NIL

    or end-of-line) that can cause real problems. If an attacker embeds a newline,
    then they can log

    forge entries by following the newline with the desired entry. Sadly, there doesn''t
    seem to be a

    standard convention for escaping these. For the URL encoding mechanism (%wh when
    he

    the hexadecimal value of the escaped byte) but there are others including the
    C convention (\voo for control). There’s also the c-system (^I is

    control), that doesn''t handle bytes over 127 gracefully.


    There is the danger that a user can cause a denial-of-service attack (or at least
    auditing) by performing

    a very large number of events that can audit record runs the system out of resources
    to store the

    records. One approach to counter this threat is to rate-limit audit recording;
    intentionally slow down

    tresponse rate if “too many” audit records are being created. You could try to
    slow the response rate only to the suspected attacker, but in many situations
    a single attacker can masquerade as many users.


    Selecting what is “suspicious activity” is, of course, dependent on the program
    and its input

    that fails is clearly a candidate (e., containing NIL).

    Inputs that could not result from normal use should probably be logged, e.g.,
    a CGI program where certain

    required fields are missing in suspicious ways. Any input with phrases like /etc/passwd
    or /etc/shadow and the


