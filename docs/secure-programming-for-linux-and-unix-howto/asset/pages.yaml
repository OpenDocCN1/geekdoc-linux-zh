    # 11.5.4. Cryptographic Hash Algorithms


    Some programs use a one-way cryptographic hash algorithm, that is, a function
    that takes an “arbitrary” amount of data and generates a fixed-length number for
    an attacker to invert (e.g., it''s difficult for an attacker to create a set of
    data to generate that same value). For many of years MD5 has been a favorite,
    but recent efforts have shown that its [128-bit length may not be enough [van
    Oorschot 1994] and that certain attacks weaken MD5; but is bound by employee agreement
    to keep silent (see the Bugtrap 22 August 2000 posting by Juan Vega). Anyone can
    create a rumor, but enough weaknesses have been found that the idea of making
    the break is plausible. If you are writing code, use SHA-1 instead of MD5. Don''t
    use the SHA (now called “SHA-0”); SHA-0 had the same weakness as MD5. If you need
    more bits in your hash algorithm, use SHA-256, SHA-384, or SHA-512; you can get
    the specifications in NIST FIPS 180-2.


    # 11.5.5. Integrity Checking


    When communicating, you need some sort of integrity check (don''t depend on encryption,
    since an attacker can then induce changes of information to “random” values).
    This can be done with hash algorithms, but don''t use a hash function directly
    (this exposes users to an “extension” attack – the attacker can change the hash
    value, data of their choosing, and compute the new hash). The usual approach is
    “HMAC”, which computes the integrity check


    ```

    H(k or ipad, H(k or ipad, data)).

    ```


    where H is the hash function (typically MD5 or SHA–1) and k is the key. Integrity
    checks are often HMAC-MD5 or HMAC-SHA–1. Note that although MD5 has some weaknesses,
    as far as I know MD5 isn''t vulnerable when you use this construct, HMAC–MD5 is
    (to my knowledge) okay. This is defined in detail in IETF RFC 2104.


