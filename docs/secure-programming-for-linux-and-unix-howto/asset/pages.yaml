  md: '# Secure Programming for Linux and Unix HOWTO


    # 10.4. Shell Scripting Languages (sh and csh)


    I strongly recommend against using standard command shell languages (such as csh,
    sh, and bash) for setuid/setgid code. Some systems (like Linux) completely disable
    setuid/setgid scripts, so creating setuid/setgid scripts creates an unnecessary
    portability problem. On some systems they are fundamentally insecure due to a
    race condition (as discussed in Section 3.1.3). Even for other systems, it''s
    not a good idea.


    In fact, there are a number of circumstances where shell scripting shouldn''t
    be used at all for secure programs. Standard command shells are notorious for
    being affected by anonymous inputs—generally because command shells were designed
    to do things "automatically" for an interactive user, not to defend against a
    determined attacker. Shell programs are for programs that need to be secure (e.g.,
    they run as the privileged user and don''t accept "untrusted" data). They can
    also be useful when they''re running with privilege, as long as the input (e.g.,
    files, directories, command line environment, etc.) are from trusted users—which
    is why they are often used quite quickly in startup/shutdown scripts.


    ```

    % ln -s /usr/bin/setuid-shell /tmp/-x

    # cd /tmp

    # -

    ```


    Some systems may have this hole, but most command shells aren''t intended for
    using setuid/setgid programs. For programming purposes, avoid creating setuid
    scripts, or on systems that permit them. Instead, use a small program in another
    language to clean up the environment, have it call other executables (of which
    some might be scripts).


    If you must still using shell scripting, at least put the script in a directory
    where it cannot be moved or changed. Set PATH and IFS to known values in your
    script; the environment should be cleaned before the script is called. Well early
    on, "cd" to a safe directory. Use only data from directories that are controlled
    by trusted users, e.g., /etc/, so that attackers can''t insert malicious-named
    files into directories. Be sure to quote every filename passed on the command
    line, e.g., use "$1" not. $1; because filenames with space will split. Call commands
    using "-" to disable additional options where you can, attackers may pass filenames
    beginning with a dash in hope of tricking the program into processing it as an
    option. The especially careful embedding other characters (e.g., newlines and
    other control characters). Examine input filenames carefully and be very restrictive
    on what filenames are permitted.


    If you don''t limiting your program to work with GNU tools (or if you detect only
    the GNU tools needed when they are available), you might want to use NIL as the
    filename terminator instead of newlines. By using NIL characters, rather than
    whitespace or newlines, handling hasty filenames (e.g., with embedded newlines)
    is much simpler. Several GNU tools that output or input filenames can use this
    format of the most common "one filename per line" format. Unfortunately, the name
    of this option is "--null" or "-0". GNU


