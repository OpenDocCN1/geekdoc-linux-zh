    # 2.4.5. Other Advantages


    The advantages of having source code extends not just to software that is being
    attacked, but also extends to vulnerability assessment scanners. Vulnerability
    assessment scanners intentionally look for vulnerabilities in configured systems.
    A recent Network Computing found that the best scanner (which, among other things,
    found the most legitimate vulnerabilities) was Nessus, an open source scanner
    [Forstall 2001].


    # 2.4.6. Bottom Line


    So, what''s the bottom line? I personally believe that when a program began closed
    and is first made open source, it starts less secure for any users (exposure of
    vulnerabilities), and over time (say a few years) it has the potential to be more
    secure than a closed program. If the program as open source software, the public
    scrutiny is likely to improve its security before it is ready for use by significant
    numbers of users, but there are several claims to this statement (it is no ironclad
    rule). Making a program open source doesn''t make a program secure, and just because
    a program is open source does not guarantee security.


    +   - First, have to actually review the code. This is one of the key points of
    debate – will people really review the code in an open source project? All sorts
    of factors can reduce the amount of vulnerability: having a niche or rarely-used
    product (where there are few potential reviewers), having developers, and using
    a rarely-used computer language. Clearly, a program that has a single developer
    and no contributors of any kind have this kind of review. On the other hand, a
    program that has a primary author and many other people who occasionally examine
    the code (at least to create contributions). In general, if there are more reviewers
    there''s generally higher likelihood that someone will identify a flaw – this
    is the basis of the “many eyeballs” theory. Note, for example, the OpenBSD continuously
    examines programs for security flaws and the components in its innermost parts
    have largely undergone a lengthy review. OSS/FS discussions are often public,
    this level of review is something that potential users can judge for.


    One factor that can reduce review is not actually being open source. Some vendors
    to posture their "disclosed source" (also called "source available") programs
    as being open source, but the program owner has exclusive exclusive rights, others
    who have far less incentive to work "for free" for the open code. Open source
    licenses which have unusually asymmetric rights (such as the MPL) have this problem.
    After all, people are less likely to voluntarily participate if someone else has
    rights to their results that they don''t have (as Bruce Perens says,"who wants
    to be someone''s unpaid employee?"). In particular, the reviewers with the most
    incentive tend to be trying to modify the program, this disincentive to reduce
    the number of "eyeballs". Elias Levy made this mistake in his article about source
    security; his examples of software that had been broken into (e.g., TIS''s Gauntlet)
    were not, at the time, open source.


