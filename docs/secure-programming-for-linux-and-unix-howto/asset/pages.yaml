    # ## 3.5. Signals


    Signals are a form of `interruption` in the Unix-like OS world, and are an ancient
    part of Unix. A process can set a `signal` on another process (using kill(1) or
    kill(2)), and that process will receive and handle the signal asynchronously.
    For a process to have permission to send an arbitrary signal to other, the sending
    process must have privileges, or the real or effective user ID of the sending
    process must equal the real or saved user-ID of the receiving process. In particular,
    SIGURG can be delivered over a network through the TCP/IP out-of-band (OOB) method.


    Although signals are an ancient part of Unix, they had different semantics in
    different implementations. Basically, they involved questions as what happens
    when a signal occurs while handling another signal? The older Linux used 5 different
    set of semantics for some signal operations than the newer GNU libraries. Calling
    C functions is often unsafe within a log handler, and even system calls can''t
    fail; you need to examine the documentation for each call you make to see if it
    is possible to call inside a signal. For more information, see the glibc faq (on
    some systems a log copy is available at `/usr/doc/glibc-*/FAQ/`).


    For new programs, just use the POSIX signal system (which was based on BSD kernel);
    this is widely supported and doesn''t have the problems that the older signal
    systems did. The POSIX signal system is built using the `sigset_t` datatype, which
    can be manipulated through a set of operations: sigemptyset(), sigfillset(), sigaddset(),
    sigsigdelset(), and sigmask(). You can read about these in sigsetsopt(2), sigproc(2),
    sigmask(2), and sigsuspend(2) to set up an asynchronous signal handling (see their
    man pages for more information).


    In general, any signal handlers were short and simple, and look carefully for
    race conditions. Signals, since they are by nature asynchronous, can easily cause
    race conditions.


    A common convention exists for servers: if you receive SIGHUP, you should close
    all log files, reopen and reread configuration files, and then-open the log files.
    This supports reconfiguration without restarting the server and without data loss.
    If you are writing a server this convention makes sense, please support it.


    Michal Zalewski [2001] has an excellent tutorial on how signal handlers are exploited,
    and has recommendations for how to eliminate signal race problems. I encountered
    looking at my summary of information; here are my recommendations, which are similar
    to Michal''s work:


    +   * Where possible, your handler sets a specific flag and do nothing else.

    * If you must have complex signal handlers, use only calls designated as being
    safe for use in signal handlers. In particular, don''t malloc() or free() in C
    (which most systems are protected against signals), nor the functions that depend
    on them (such as the printf() family and syslog()). You could try to `wrap` calls
    to insure library calls check a global flag (to avoid retry), but I wouldn''t
    recommend it.

    * Block signal delivery in all non-atomic operations in the program, and block
    signal delivery inside signal handlers.


    Chapter 3. Summary of Linux and Unix Security Features'
