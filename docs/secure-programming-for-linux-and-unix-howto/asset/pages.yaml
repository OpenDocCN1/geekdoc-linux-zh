    CGI script may be setuid or be configured in a way that has the same effect),
    and some programs are divided into several executables which can be considered
    a different "type" of program. The advantage of considering all of these program
    types together is that we can consider all issues without trying to apply an inappropriate
    category to a program. As will be seen, the principles apply to all programs that
    need to be secured.


    There is a slight bias in this book toward programs written in C, with some notes
    on other languages as C++, Perl, PHP, Python, and Java. Because C is the most
    common language for implementing secure programs on Unix-like systems (other than
    CGI scripts, which tend to use languages as Perl, PHP, or Python). Also, most
    others'' implementations use the C library. This is not to imply that C is somehow
    the "best" for this language, and most of the principles described here regardless
    of the programming language used.


    # 2.6 Paranoia is a Virtue


    The primary difficulty in writing secure programs is that writing them requires
    a different mind-set, in short, a paranoid mind-set. The reason is that the impact
    of errors (also called defects or bugs) can be profoundly different.


    Normal-secure programs have many errors: While these errors are undesirable they
    usually involve rare or unlikely situations, and if a user stumble one they will
    try to avoid using the tool that way in the future.


    In secure programs, the situation is reversed. Certain users will intentionally
    search out and cause rare or unlikely situations, in hope that attacks will give
    them unwanted privileges. As a result, writing secure programs, paranoia is a
    virtue.


    # 2.7 Why Did I Write This Document?


    One question I have been asked "why did you write this book? Here''s my answer:
    Over the last years I noticed that many developers for Linux and Unix seem keep
    falling into the same security pitfalls again and again. Auditors were slowly
    catching problems, but it would have been better if the problems were put into
    the code in the first place. I believe that of the problem there wasn''t a single,
    obvious place where developers could get information on how to know pitfalls.
    The information was publicly available, but it was hard to find, out-of-date,
    incomplete, or had other problems. Most such information didn''t particularly
    discuss Linux at all, even when it was becoming widely used! That leads up to
    the reason: I developed this book in the hope that future developers won''t repeat
    past mistakes, resulting in more secure systems. You can see a larger discussion
    of this at http://www.linuxsecurity.com/feature-stories/story-6.html


    A related question that could be asked "why did you write your book instead of
    just referring to other documents?" There are several answers:


    Chapter 2. Background'
