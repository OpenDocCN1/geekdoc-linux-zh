  md: '# Secure Programming for Linux and Unix HOWTO


    The first subsection discusses how to identify special characters that need to
    be filtered, encoded, or validated. This is followed by subsections describing
    how to filter or encode these characters. There''s no subsection discussing how
    to validate data in general, however for input validation see Chapter 5 and if
    the input is HTML text to a URI, see Section 5.11. Also note that your web application
    can receive malicious cache-posts, so non-queries should forbid the GET protocol
    (see Section 5.12).


    # 7.15.2.1. Identifying Special Characters


    Here are the special characters for a variety of circumstances (my thanks to the
    CERT, who developed this list):


    +   * In the content of a block–level element (e.g., in the middle of a paragraph
    of text in HTML or a block in XML):

    * "<" is special because it introduces a tag.

    * "&" is special because it introduces a character entity.

    * "" is special because some browsers treat it as special, on the assumption that
    the author of the page really means to put it in an opening "<", but omitted it
    in error.

    * In attribute:

    * In attribute values enclosed with double quotes, the double quotes are special
    because they mark the end of the attribute value.

    * In attribute values enclosed with single quotes, the single quotes are special
    because they mark the end of the attribute value. XML''s definition allows some
    parsers don''t handle them correctly, so you might avoid using single quotes in
    XML.

    * Attribute values without any quotes make the white–space characters such as
    space and tab special. Note that these aren''t legal in XML either, and they make
    more characters special. Thus, I recommend unquoted attributes if you''re using
    dynamically generated values in them.

    * "&" is special when used in conjunction with some attributes it introduces a
    character entity.

    * In URLs, for example, a search engine might provide a link within the results
    that the user can click to re-run the search. This can be implemented by encoding
    the search query inside the URL. When this is done, it introduces special characters:
    Space, and new line are special because they mark the end of the URL.

    * "&" is special because it introduces a character entity or CGI parameters.

    * Non-ASCII characters (that is, everything above 128 in the ISO–8859–1 encoding)
    aren''t allowed in URLs, so they are all special here.

    * The "" must be filtered from input any parameters encoded with HTTP escape sequences
    are decoded by server–side code. The code %68%65%6C%6C%6F becomes "hello" when
    it opens on the page.

    * Within the body of a <SCRIPT> </SCRIPT> the semicolon, comma, and new line should
    be filtered in situations where text could be inserted directly into a preexisting
    script tag.

    * Server–side scripts that convert any exclamation characters (!) in input to
    double–quote characters (") might require additional filtering.


    Note that, in general, the ampersand (&) is special in HTML and XML.


    # Chapter 7. Structure Program Internals and Approach'
