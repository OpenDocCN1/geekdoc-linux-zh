  md: "# Secure Programming for Linux and Unix HOWTO\n\n\"Why Should Not Use Tcl?\
    \ For example, Tcl was originally designed to support only one data type (string).\
    \ Frankly, these issues have been addressed over time. In particular, version\
    \ 8.0 added support for more data types (integers are stored internally integers,\
    \ lists and so on). This improves its capabilities, and in particular improves\
    \ its security.\n\nAs with all scripting languages, Tcl has an \"eval\" command\
    \ that parses and executes arbitrary Tcl commands. And like all scripting languages,\
    \ this eval command needs to be used especially carefully, or an attacker could\
    \ insert characters with special meaning in input to cause malicious things to\
    \ occur. For example, an attacker may be inserted whitespace and newline, double-quote,\
    \ curly braces, square brackets, dollar signs, semicolon, or pound sign or create\
    \ to input these characters to be created during processing). This also applies\
    \ to any function that passes data to eval (well depending on how eval is called).\n\
    \nHere is a small example that may make this concept clear; first, let's define\
    \ a small function and then interactively invoke it — note that these uses are:\n\
    \n```\nproc something (a b c d e) {\n    puts \"A=$a*\"\n    puts \"B=$b*\"\n\
    \    puts \"C=$c*\"\n    puts \"D=$d*\"\n    puts \"E=$e*\"\n}\n```\n\n```\n#\
    \ Imagine that strl is set by an attacker:\n# set strl (test [1 HELLOWORLD])\n\
    ```\n\n```\n# This works as well\n# something $str1 t2 t3 t4 t5\nA=test 1 [puts\
    \ HELLOWORLD]\nB=t2\nC=t3\nD=t4\nE=t5\n```\n\nHowever, continuing the example,\
    \ lets see how \"eval\" can be incorrectly and correctly called. If you call eval\
    \ in an incorrect (dangerous) way, it allows attackers to misuse it. However,\
    \ by using commands like list or brace to group the input, you can avoid this:\n\
    \n```\n# This is the WRONG way - strl is interpreted.\n# eval something $strl\
    \ t2 t3\nHELLOWORLD\nA=test\nB=1\nC=\nD=t2\nE=t3\n```\n\n```\n# Here's one solution,\
    \ using \"list\".\n# eval something [list $strl t2 t3 t4 t5]\nA=test 1 [puts HELLOWORLD]\n\
    B=t2\n```\n\nChapter 10. Language–Specific Issues"
  merge: -1
