    A number of programs, especially designed for human interaction, "escape" codes
    that perform "extra" activities. One of the more common (and dangerous) escape
    codes is one that brings up a command line. Make sure that these "escape" commands
    can''t be included (unless you''re sure that the specific command is safe). For
    example, many line-oriented programs like shell and vi use this as an escape character,
    which can be used to send a number of commands. As a result--innocent commands
    such as `mail < file-user` can be used to execute arbitrary programs. Interactive
    programs as vi, emacs, and had "escape" mechanisms that allow users to run shell
    commands from their session. Always check the documentation of the programs you
    use for escape by other programs; use Section 8.4.


    The issue of avoiding escape codes goes down to low--level hardware components
    and elements of. Most modern programs use the so-called "Hays" code. Unless the
    command is disabled, introducing a delay, by the phrase `+\+\+\`, and then another
    delay allows the modem to interpret any following text as the command it intends.
    This could be used to prevent denial-of-service attacks (by sending `ATH0`, a
    hang-up command) or forcing a connection to someone else (a sophisticated attack
    that could re-route a user''s connection through a machine under the attacker''s
    control). For the specific case of modern, this is easy to control (e.g., ATS255
    in the initialization string), but the general issue still holds: if you''re controlling
    a lower-level component, or an emulation of one, make sure that you disable or
    handle any escape codes built into.


    Many "terminal interfaces implement escape codes of ancient, long--gone physical
    terminals like the VT100. These codes can be useful, for example, for building
    characters, changing font color, or moving to a particular location in a terminal
    interface. However, do not allow arbitrary data to be sent directly to a terminal
    screen, when some of these codes can cause serious problems. On some systems you
    can remap keys (e.g., when a user sends "Enter" or a function key it sends the
    commands you want them to). On some you can even send codes to clear the screen,
    display a set of commands you''d like to run, and then send that `back`, forcing
    the victim to run the attacker''s commands without waiting for a keystroke. This
    is typically implemented using `page-mode buffering`. This security problem is
    well emulated by the pseudo-devices in /dev/tty which should be writable by their
    owners and never anyone else--they should never have "other write" permission,
    unless the user is a member of the group (i.e., "user-private group"), the "group
    write" permission should not be either for the terminal (Filipski 1986). If you''re
    displaying the data to a (simulated) terminal, you need to filter out all control
    commands (characters with values less than 32) from sent back to the user unless
    they''re identified as safe. Worse if the program returns all characters with
    their high bit set, as values greater than 127 are many times trickier to handle;
    some old systems implemented them as if they weren''t set, by simply filtering
    them out including input. In this case, you need to look at the types of your
    situation.


    A related problem is the NIL character (\0) which can have surprising effects.
    Most C and C++ functions assume this character marks the end of a string, string-handling
