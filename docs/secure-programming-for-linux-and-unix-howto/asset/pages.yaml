- pgno: 108
  md: '# # Chapter 9. Send Information Back Judiciously


    > Do not answer a fool according to his folly, or you will be like him yourself.


    > Proverbs 26:4 (NIV)


    # ## 9.1. Minimize Feedback


    Avoid giving much information to untrusted users; simply succeed or fail, and
    if it failed just say it failed and minimize information on why it failed. Save
    the detailed information for audit trail logs. For example:


    +   - If your program requires some sort of user authentication (e.g., you''re
    writing a network service or login program), give the user as little information
    as possible before they authenticate. In particular, avoid giving away the version
    of your program before authentication. Otherwise, if a particular version of your
    program is found to have a vulnerability, then users will not upgrade from that
    version to attackers that they are vulnerable.

    - If your program accepts a password, don''t echo it back; this creates another
    way passwords could be seen.


    # ## 9.2. Don''t Include Comments


    When returning information, don''t include any "comments" unless you''re sure
    that the receiving user is able to view them. This is a particular problem for
    web applications that generate files (such as HTML). Often web applications wish
    to comment the code (which is fine), but instead of simply leaving the comment
    in the code it is included as part of the generated file (usually HTML or XML)
    that is returned to the user. The trouble is that these comments sometimes provide
    insight into how the system works in a way that aids attackers.


    # ## 9.3. Handle Full/Unresponsive Output


    It may be possible for a user to clog or make unresponsive your secure program''s
    output channel back to that. For example, a web browser could be intentionally
    halted or have its TCP/IP channel response slowed. The secure program should handle
    such cases, in particular should release locks quickly (preferably before replying)
    so this will not create an opportunity for a Denial-of-Service attack. Always
    place time-outs on outgoing network-oriented write requests.


    # ## 9.4. Control Data Formatting (Formatting Strings/Formatting)


    A number of output routines in computer languages have a parameter that controls
    the generated format. In C, the most obvious example is the printf! family of
    routines (including printf(), snprintf(), sprintf()), and so on. Other examples
    in C use syslog() (which writes system log information) and setproctitle(which
    sets the string to display process identifier). Many functions with names containing
    "err" or "warn", containing "log", or ending in "printf" are worth consideration.
    Python includes the "%%" operation, which formats strings formatting in a similar
    manner. Many programs and libraries define formatting functions, by calling built-in
    routines and adding additional processing (e.g., glib''s g_sprintf())'
