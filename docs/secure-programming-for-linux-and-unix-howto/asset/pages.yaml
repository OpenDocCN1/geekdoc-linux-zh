    here</A>

    ```


    In short, a web application cannot accept input (including any form) without checking,
    filtering, or encoding it. Even another user may have surreptitiously supplied
    the data. Even if including material won''t hurt your system, it will enable your
    system to be a conduit of attacks to your users. Even worse, those attacks will
    appear to come from your system.


    CERT describes the problem in this advisory:


    +   A web site may inadvertently allow malicious HTML tags or script in a dynamically
    generated page based on unvalidated input from untrustworthy sources (CERT Advisory
    CA-2000-02, Malicious HTML Tags Embedded in Client Requests).


    More information from CERT about this is available at http://www.cert.org/archive/pdf/cross_site_scripting.pdf.


    # # 7.1.2. Solutions to Cross–Site Malicious Content


    Fundamentally, this means all web application output produced by any user must
    be filtered (so characters that can cause this problem are removed), encoded (so
    the characters that cause this problem are encoded in a way to prevent the problem),
    or validated (to ensure only "safe" data gets through). This includes all output
    derived from input as URLs, parameters data, cookies, database queries, CORBA
    results, and data from users stored in files. In many cases, filtering and validation
    should be done at the input, but encoding could be done during input or output
    generation. If you''re just passing the data without analysis, it''s probably
    better to encode the data on input (if it won''t forgotten). If your program processes
    the data, it can be easier to encode it on output instead. CERT recommends that
    filtering and encoding be done during output data; this isn''t a bad idea, but
    there are many cases where it makes sense to do it at input. The critical issue
    is to make sure that you cover all cases for every output, which is not an easy
    thing to do regardless of approach.


    > —in many these techniques can be subverted unless you''ve also gained control
    over the character encoding of the output, an attacker could use an "unexpected"
    character to bypass the techniques discussed here. Frankly, this isn''t hard;
    gaining control over output encoding is discussed in Section 9.5.


    One minor defense, that''s often doing, is the "HttpOnly" flag for cookies. Scripts
    that run in a browser cannot access cookies that have the HttpOnly flag so they
    get an empty value. This is implemented in Microsoft Internet Explorer and Netscape
    to make this issue soon. You should set HttpOnly for any cookie you need, unless
    you have scripts that need the cookie, to counter kinds of cross–site scripting
    (XSS) attacks. However, the HttpOnly flag can be circumvented in a variety of
    ways, so using it as primary defense is inappropriate. Instead, it''s a helpful
    secondary defense that may save you in your case application is written correctly.


    Chapter 7. Structure Program Internals and Approach'
