- pgno: 45
  md: '# Secure Programming for Linux and Unix HOWTO


    # 5.2.2 Environment Variable Storage Format is Dangerous


    Normally, programs should use the standard access routines to environment variables.
    For example, in C, you should get values using getenv(3), set them using the POSIX
    standard putenv(3) or the BSD setenv(3) and eliminate environment variables using
    unsetenv(3). I should note that setenv(3) is implemented in Linux, too.


    However, crackers need not be so nice; crackers can directly control the environment
    variable area passed to a program using execve(2). This permits some nasty attacks,
    which can only be understood by understanding how environment variables really
    work. In Linux, you can use environ(5) for a summary of about environment variables
    really work. In short, environment variables are internally stored as a pointer
    to an array of pointers to characters; each terminated by a NULL pointer (so you''ll
    know when the array ends). The pointers to characters, each point to a NIL-terminated
    string of the form NAME=value. This has several implications, for example variable
    names can''t include the equal sign, and neither the name nor value can have embedded
    NIL characters. However, a dangerous implication of this format is that it allows
    multiple entries with the same variable name, but with different values (e.g.,
    one for SHELL). While typical command prohibit doing this, a locally-executing
    cracker can create such a situation using execve(2).


    The problem with this storage (and the way it''s) is that a program might check
    one of these values (to see if it''s valid) but actually use a different one.
    In Linux, the GNU libc libraries help shield programs from this; libc 2.1''s implementation
    of getenv will always get the first matching entry, setenv and unsetenv will always
    unset all of the matching entries (congratulations to the GNU implementers for
    implementing unset this way!). Some programs go directly to the environment variable
    and iterate across all environment variables; in this case, they might use the
    last matching entry instead of the first one. As a result, if checks were made
    against the first matching entry instead but the actual value used was the last
    matching entry, a cracker can use this to circumvent the protection routines.


    # 5.2.3. The Solution – Extract and Erase


    For secure/setuid programs, the short list of environment variables needed (if
    any) should be carefully extracted. The entire environment should be erased, followed
    by restoring a small set of necessary environment variables to safe values. There
    isn''t a better way if you make calls to subordinate programs; there''s no practical
    method of listing "all the dangerous values". Even if you review the source code
    of every program you call directly or, someone might add undocumented environment
    variables after you write code, and one of them could be exploitable.


    The simple way to erase the environment in C/C++ is by setting the global variable
    environ to NULL. The global variable environ is defined in <unistd.h>; C/C++ users
    want to #include this header file. You will need to manipulate this before spawning
    threads, but that''s rarely a problem, since you want to do these manipulations
    early in your program''s execution (usually before threads are spawned).


    The global environ''s definition is defined in various standards; it''s not clear
    that the official standards agree on changing its value; I am unaware of any Unix-like
    that has trouble doing this. I normally modify the "environ" directly; manipulating
    such low-level components is non-portable, but it assures that you get a clean
    (and safe) environment. In the rare case where you need later access to the entire
    set of variables, you could save the "environ" variable''s value somewhere, but
    this is rarely necessary; nearly all programs need only a few values, and the
    rest can be dropped.


