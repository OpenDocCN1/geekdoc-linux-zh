    feature in a product; an product with a higher EAL rating is not necessarily more
    secure than a similar product with a lower rating or no rating; the environment
    might be different, the evaluation may have saved money and time by not evaluating
    the other product at a higher level, or perhaps the evaluation seemed important.
    Evaluations are not proofs; they simply impose a defined min bar to gain confidence
    in the requirements and product.


    # 4.2. Security Environment and Objectives


    The first step in developing a PP or ST is identify the security environment.
    This means that you have to consider the physical environment (can attackers access
    the computer hardware?), the assets requiring protection (files, databases, authorization
    credentials, and so on), and the purpose of the TOE (what kind of product is it?
    what is the intended use?).


    In developing a PP or ST, you''d end up with a statement of assumptions (who is
    trusted? the network or platform benign?), threats (that the system or its environment
    counter), and organizational security policies (that the system or its environment
    must meet). A threat is characterized in terms of a threat agent (who might perform
    the attack?), a presumed method, any vulnerabilities are the basis for the attack,
    and what is under attack.


    You''d then define a set of security objectives for the system, and show that
    those objectives counter the threats and satisfy the policies. If you aren''t
    creating a PP or ST, thinking about your assumptions, threats, and possible policies
    can help avoid foolish decisions. For example, if the computer network is being
    sniffed (e.g., the Internet), then unencrypted protocols are a foolish in this
    circumstances.


    For the CC, you''d then identify the functional and assurance requirements that
    would be met by the TOE, and which ones would be met by the environment, to meet
    those security objectives. These requirements would be selected from the "chinese
    menu" of the CC''s possible requirements, and the next sections will describe
    the major classes of requirements. In the CC, requirements are grouped into classes,
    which are subdivided into families, which are further subdivided into components;
    the details of all this are in the CC itself if you need to know about this. A
    good diagram showing how this works is in the CC part 1, figure 4.5, which I cannot
    reproduce.


    Chapter 4. Security Requirements'
