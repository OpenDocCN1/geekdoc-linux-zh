    pair in Linux to execute commands, there''s a race condition while the process
    is already running as the user''s UID, but hasn''t entered execve(2) yet. The
    user may be able to send signals, including SIGSTOP, to this process. By the semantics
    of fork(2), the privileged parent would not be blocked as well. As a result, an
    unprivileged process could cause the privileged process to halt, in a denial–of–service
    of the privileged service. FreeBSD and Open, at least have to code specifically
    with this case, so to know they are not vulnerable to this problem. My thanks
    to Solar Designer, who noted and documented this problem in Linux on the `security-audit`
    mailing list on October 7, 2000.


    The bottom line with vfork(2) is simple: don''t use vfork(2) in your programs.
    This shouldn''t be difficult; the primary use of vfork(2) is to sort out programs
    that need vfork''s semantics.


    # 8.7. Counter Web Bugs When Retrieving Embedded Content


    In a web bug, a reference is intentionally inserted into a document and used by
    the content author to track who, and how often a document is read. The author
    can also track how a "bugged" document is passed from one person to another or
    from one organization to another.


    The format has has issue for some time. [Privacy Foundation](http://www.privacy.org).


    Web bugs used extensively today by Internet advertising companies on Web pages
    and in HTML-based emails for tracking. They are typically 1–by–1 pixel in size
    to make them invisible on the screen to disguise the fact that they are used for
    tracking. However, they could be any image (using the img tag); other HTML tags
    can make web bugs, e.g., frames, windows, and scripts. By itself, invoking the
    web bug will provide the "bugging" site reader''s IP address, the page the reader
    visited, and various information about the browser by also using cookies it possible
    to determine the specific identity of the reader. A survey about web bugs is available
    at

    http://www.security.com/s/survey/data/man_200102/webbug.html.


    What is more concerning that other document formats seems such a capability, too.
    When viewing HTML from a site with a web bug, there are other ways of getting
    information on who is reading the data, but when viewing a document in another
    format from an email user feels that the act of reading the document can be monitored.
    However, for many formats, a reader can be monitored. For example, it has been
    recently demonstrated that Microsoft Word can use web bugs; [the Foundation advisory
    for more information](http://www.privacy.org). As noted in their advisory, recent
    versions of Microsoft Excel and Microsoft PowerPoint can be bugged. In some cases,
    cookies can be used to even more information.


    Web bugs are primarily an issue with the design of the layout format. If you use
    your privacy value, you will probably want to limit the automatic downloading
    of included files. One exception might be when the file itself is being downloaded
    (say, via a web browser); downloading other files from the same location at time
    is much less likely to concern yours.


    Chapter 8. Carefully Call Out to Other Resources


