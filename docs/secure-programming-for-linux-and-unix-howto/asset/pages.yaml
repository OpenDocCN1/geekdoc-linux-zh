  md: '# Secure Programming for Linux and Unix HOWTO


    POSIX "Capabilities" have been recently implemented in the Linux kernel. These
    "Capabilities" are an additional form of privilege control to enable more specific
    control over what privileged processes do. Capabilities are implemented as three
    (fairly large) bitfields, each representing a specific action a privileged process
    can perform. By setting bits, the actions of privileged processes can be controlled
    — access is granted for various functions only to the specific parts of a program
    that require them. It is a security measure. The problem is that capabilities
    are copied with fork(), meaning that if capabilities are managed by a parent process,
    they can be carried over. The way that this is exploited is by setting all of
    them (are off) in each of the three bitfields and executing a suited program that
    attempts to drop privileges before executing code that could be dangerous if run
    as root, as sendmail does. When sendmail attempts to drop privileges using setuid(getuid()),
    it fails not having the capabilities required to do so in its bitfields and no
    checks on its return value . It continues executing with supervise privileges,
    and can run users .forward file as leading to a compromise.


    One approach, by sendmail, is to attempt to setuid(0) after a setuid(getuid());
    normally this should fail. If it succeeds, for more information, see http://sendmail.org/~feed/000607linuxbug.
    In the short term this might be a good idea in other programs, clearly the better-term
    approach is to upgrade the system.


    # 7.4.3. Minimize the Privilege to Active


    Use setuid(2), setid(2), setgroups(2), and related functions to ensure that the
    program has these privileges when necessary, and temporarily deactivate the privilege
    when it''s not in use. Note above, you might want to ensure that these privileges
    are disabled while parsing user input, but more generally, only turn privileges
    when they''re actually needed.


    Note that some buffer overflow attacks, if successful, can force a program to
    run arbitrary code, and code could re-enable privileges that were temporarily
    dropped. There, it is much better to completely drop privileges as soon as possible.
    There are many papers that describe how to do this, "Designing Shellcode Demystified".
    Some people claim that ~setuid() [is considered harmful] because of the many attacks
    it counter. Still, temporarily deactivating these permissions prevents a class
    of attacks, such as techniques to convince a program to write into a file that
    perhaps it didn''t intend to write into. Since this technique prevents many attacks,
    it''s worth noting that if permanently dropping privileges can''t be done at that
    point in the program.


    # 7.4.4. Minimize the Modules Granted the Privilege


    If only a few modules are granted the privilege, it''s much easier to determine
    if they''re secure. One way to do so is to have a single module use the privilege
    and then drop it, so that other modules never misuse the privilege. Another approach
    is to have separate commands in executables; one command might be a complex tool
    that can handle a vast number of tasks for a privileged user (e.g., root), while
    the other tool is suited to a small tool that only permits a small command subset
    (and does not trust the invoker). The small, simple tool checks to see if the
    input meets criteria for acceptance, and if it determines the input is acceptable,
    it must do a thorough job checking its limits and will pass the command along
    to the complex tool, or if this is a vulnerability. Communication can be sent
    via invocation, or any IPC mechanism. These approaches can be layered several,
    a complex user tool could call a simple suited


