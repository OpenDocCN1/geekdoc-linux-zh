    In general, if multiple users can write to a directory in a Unix-like system,
    you''d better have the `sticky` bit set on that directory, and sticky directories
    had better implemented. It''s much better to completely avoid the problem, however
    and create directories that only a trusted process can access (and implement them
    carefully). The traditional Unix directories (/tmp and /var/tmp) are universally
    implemented as `sticky` directories, and all security problems can still surface,
    as we will see next.


    # 7.10.2. Temporary Files


    This issue of performing atomic operations particularly comes up when creating
    temporary files. Temporary files in Unix-like systems are traditionally created
    in the /tmp or /var/tmp directories, which are shared by all users. A common trick
    by attackers is to use symbolic links in the temporary directory to some other
    file (e.g., /etc/passwd) while your security program is running. The attacker''s
    goal is to create a situation where the security program determines that a filename
    exists, then the attacker creates the symbolic link to another file, and then
    the security program performs some operation (but now it actually opened an unopened
    file). Often important files can be corrupted or modified while. There are many
    variations to this attack, as creating normal files, all based on the idea that
    the attacker can create (or sometimes otherwise file system) objects in the same
    directory used by the security program for temporary files.


    Michael Zalewski exposed in 2002 another problem with temporary directories involving
    automatic cleaning of directories. For more information, see his posting to Bugtrap
    December 20, 2002, subject “[RAZOR] Problems with mktemp”. Zalewski notes its
    a common practice to have a program automatically sweeps temporary directories
    like /tmp and /var/tmp and remove “old” files that have not been accessed for
    a while (e.g., several days). Such programs are sometimes called “temp cleaners”
    (pronounced “temp cleaners”). Possibly the most common temp cleaner is “tmpwatch”
    by Erik Tran and Preston Brown of Red Hat Software; another one is “tmpclean”
    by Stanislav Sanov; many administrators roll their own as well. Unfortunately,
    the existence of tmp cleaners creates an opportunity for new security-race conditions;
    an attacker may be able to time that the temp cleaner interferes with the security
    program. For example, an attacker could create an “old” file for the attacker
    to delete the file himself, and run a security program that creates the file –
    now the temp cleaner will delete the program''s file! Or, imagine that a program
    has long delays after the file use (e.g., a setup program with SIGSTOP and resumed
    after many days with SIGCONT, or simply creating a lot of work). If the temporary
    file isn''t used for long enough, it will be removed by the temp cleaner.


    The general problem when creating files in these shared directories is that you
    must guarantee that the filename you do not already exist at time of creation,
    and atomically create the file. Checking “before” before you create the file doesn''t
    work, because the check occurs before, but another process can create that file
    with filename. Using an “unpredictable” or “unique” filename doesn''t work in
    general, because another process can create it repeatedly until it succeeds. Once
    the file is created atomically, you may use the returned file descriptor (or file
    stream, if created from the file descriptor) or any operations that use the filename
    as a parameter – use all of them. Otherwise, the tmp race issues noted above will
    cause problems. You can''t create the file, close it, and re-open it, even if
    the permissions limit who can open it. Note that comparing the descriptor and
    a reopend file to verify node numbers or ownership – please refer to “Symlinks
    and Cryogenic Sleep” by Olaf Kirch.


