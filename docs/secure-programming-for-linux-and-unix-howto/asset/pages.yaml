    link directories (so they''ll follow the standard conventions), then write a cache
    to /etc/ld.so.cache that is used by other programs. ldconfig has to be run when
    a DLL is added, when a DLL is removed, or when the set of DLL directories changes;
    running ldconfig is often one of the steps performed by package managers when
    installing a library. On start-up, a program uses the dynamic loader to read the
    /etc/ld.so.cache and then loads the libraries.


    Environment variables can control this process, and in fact there are environment
    variables that you might override this process (for example, you can temporarily
    substitute a different library for particular execution). In Linux, the environment
    variable LD_LIBRARY_PATH is a colon-separated set of directories where libraries
    are searched for, before the standard set of directories; this is useful when
    debugging a library or using a nonstandard library for special purposes, but be
    sure those who can control those directories. The variable LD_PRELOAD allows object
    functions that override the standard set, just as LD_DEBUG displays information;
    if set to “all”, information about the dynamic linking process is displayed while
    it''s occurring.


    Permitting user over dynamically linked libraries would be disastrous for setid/segid
    programs unless special measures are taken. In the GNU glibc implementation, if
    a program is setid or segid these variables (and other similar variables) are
    greatly limited in what they can do. The glue library determines if a program
    is setid or setgid by checking the credentials; if the UID and UUID or the GID
    and EGID differ, the program is setid/segid (descended from one) and therefore
    limits its abilities to control linking. If you load the glue libraries, you can
    see this; especially the files /etc/ld.so and /sysd/generic/ld-sysdep.c. This
    means that if you use UID and GID to equal EUID and EGID and then call a program,
    these variables will have full effect. Other Unix-like systems handle the situation
    differently but for the same reason: setid/segid program should not be audited
    by the environment variables used. Note that graphical user interfaces generally
    do permit user control over dynamically linked libraries, because executables
    that directly invoke graphical interface toolkits should not, be ever (or have
    special privileges) at all. For more about how to secure GUI applications, see
    Section 7.4.4.


    For Linux systems, you can get more information from my document, the Program
    Library HOWTO.


    # 3.8. Audit


    Unlike Unix-like systems have auditing “audit”. In Linux, the most common mechanism
    is syslog(8), usually working in conjunction with klogd(8). You might also want
    to look at w(5), utmp(5), lastlog(8), and act(2). Some programs (such as the Apache
    web server) also have their own audit trail mechanisms. According to the FHS,
    audit logs are stored in /var/log or in their subdirectories.


    # 3.9. PAM


    Solar and nearly all Linux systems use the Pluggable Authentication Modules (PAM)
    system for authentication. PAM permits run-time configuration of authentication
    methods (e.g., use of passwords, smart cards, etc.). See Section 11.6 for more
    information on PAM.


