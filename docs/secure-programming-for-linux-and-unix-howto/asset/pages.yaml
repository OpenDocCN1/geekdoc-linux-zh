    • Cyclone is a C–like language intended to prevent C security vulnerabilities.
    In theory, you can always switch to a language that is `more secure`, but this
    doesn''t always help (a language can help avoid mistakes that it can''t read your
    mind). John Vie reviewed Cyclone, and in December 2001 he said: Cyclone is nearly
    perfect. It''s a dialect that doesn''t feel like taking anything away, adds safety
    guarantees, with many features that can be a real boon to programmers. Unfortunately,
    Cyclone isn''t offer enough advantages over Java (or even C with a good set of
    tools) to make it worth the risk of using what is still a very young technology.
    Perhaps in a few years, Cyclone will make it a robust, wisely seen language that
    comes directly close to C in terms of efficiency. If that comes, you will see
    yourself abandoning C for good." The Cyclone compiler has been released under
    the GPL and LGPL. You can get more information from the Cyclone web site.


    Some tools to detect security flaws at run-time, either to detect them or at least
    warn the developer them. Much of Crispen Cowan''s work, as StackGuard, is here.


    There are several tools to detect any C/C++ memory management problems; these
    are really general-purpose software quality tools, and not specific to security,
    but memory management problems can easily cause security breaches. An especially
    capable tool is Valgrind, which detect memory-management problems (such as uninitialized
    memory, reading or writing memory after it''s been freed, reading/writing off
    the end of allocated blocks, and memory leaks). Another tool is Electric Fence
    (efence) by Bruce Perez, which can detect certain memory management errors. Memwatch
    (public domain) and YAMD (GPL) can detect memory allocation problems for C and
    C++. You can even use the built-in capabilities of GNU C''s malloc library, which
    handles the MALLOC_CHECK environment variable (see its manual for more information).
    There are many others.


    Another approach is to create tests and run the program, in attempt to find weaknesses
