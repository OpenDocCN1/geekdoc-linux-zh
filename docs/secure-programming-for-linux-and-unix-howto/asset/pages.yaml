- pgno: 102
  md: '# Chapter 8. Carefully Call Out to Other Resources


    > Do not put your trust in princes, in mortal men, who cannot save.


    > *Psalms 146:3 (NIV)*


    Practically no program is truly self-contained; nearly all programs call out to
    other programs for resources, such as programs provided by the operating system,
    software libraries, and so on. Sometimes this calling out to other resources is
    not obvious or involves a great deal of "hidden" infrastructure that may be depended
    on, e.g., the mechanisms to implement dynamic libraries. Clearly, you must be
    careful about what other resources your program uses and make sure the way you
    send requests to them.


    # 8.1. Call Only Safe Library Routines


    Sometimes there is a conflict between security and the development principles
    of abstraction (information hiding and reuse). The problem is that some high-level
    library routines may not be implemented securely, and their specifications won''t
    tell you. Even if a particular implementation is secure, it may not be possible
    to ensure that other versions of the routine will be safe, or that the same interface
    will be safe on other platforms.


    In the end, if your application must be secure, you must re-implement your own
    versions of library routines. Basically, you have to re-implement routines if
    you''re not sure that the library routines will perform the actions you need for
    security. If, in some cases the library''s implementation should be fixed, but
    your users will be hurt if you choose a library routine that is a security weakness.
    If can, try to use the high-level interfaces when you re-implement something—that
    way, you can the high-level interface on systems where its use is secure.


    If you can, test whether the routine is secure or not, and use it if it''s secure—ideally
    you could perform this test as part of compilation or installation (e.g., as part
    of an "autocfig" script). For programs this kind of running-testing is impractical,
    but for other conditions, this can eliminate many problems. If you don''t want
    to bother to re-implement the library, at least to make sure it''s safe and halt
    installation if it isn''t. That way, users accidentally install an insecure program
    and know what the problem is.


    # 8.2. Limit Call–outs to Valid Values


    Ensure that any call to another program only permits valid and expected values
    for every parameter. This is more difficult than it sounds, because many library
    calls or commands call lower-level routines in potentially surprising ways. For
    example, many system calls are implemented by calling the shell, which means passing
    characters are shell metacharacters can have dangerous effects. So, let''s discuss
    metacharacters


    # 8.3. Handle Metacharacters


    Many systems, such as the command line shell and SQL interpreters, have ``metacharacters'''',
    that is, characters in their input are not interpreted as data. Such characters
    may delimit data from commands or other data. If there''s a language specification
    for that system''s interface you''re using, then it has metacharacters. If your
    program invokes those other systems and allows attackers to insert such metacharacters,
    the usual result is that an attacker can completely control your program.


    Chapter 8. Carefully Call Out to Other Resources

    97'
