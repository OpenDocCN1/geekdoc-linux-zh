  md: '# Secure Programming for Linux and Unix HOWTO


    This approach to HTML encoding isn''t enough in some circumstances. As discussed
    in Section 9.5, you need to specify the output encoding (``charset``). If some
    of your data is encoded using a different character encoding the output encoding,
    you''ll need to make sure your output is consistent and correct encoding. Also,
    you''ve selected an output encoding other than ISO-8859-1, you need to make sure
    that any alternative encodings for special characters (such as "<") can''t slip
    through to the browser. Use UTF-7 or UTF-8; see Section 5.9 for more information
    on how to prevent "alternative" encodings of characters. One way is to translate
    characters internally internally to 10046 (which has the same character values
    as Unicode), and then using numeric reference or character entity to represent
    them


    +   * A numeric character reference like &#D;, where D is a decimal, or &#XH;,
    where H is a hexadecimal number. The number is the ISO 1046 character id (which
    has the same character values as Unicode). Then &#1048; is the Cyrillic letter
    "T". The hexadecimal value isn''t supported in the SGML standard (ISO 8879), I''d
    suggest using the decimal system for output. Also, in some circumstances, many
    systems won''t handle it – always include the trailing semicolon.

    * A character entity does the same thing but uses mnemonic names instead of numbers.
    For example, &lt; represents the <. If you''re generating HTML, see the HTML specification
    which lists all mnemonic entities.


    Either system (numeric or character entity) works; I suggest using character entity
    references for ''<'', ''>'', and ''&'' because it makes your code (and output)
    easier to handle. Under that, it''s not clear one or the other is better. If you
    expect humans to edit the output by late on, you''d use the decimal character
    references just because they''re easier to read. This encoding scheme can be quite
    inefficient for some users (especially Asian languages); if it is your primary
    content, you might choose to use a different character encoding (charset), filter
    on the characters (e.g., "<") and ensure that no alternative encodings for characters
    are allowed.


    URIs are here percent encoding, commonly ``URL encoding.'''' In this system, characters
    are not permitted in URLs are represented using a percent sign followed by its
    two-digit hexadecimal value. It''s recommended to first translate the codes to
    UTF-8, and then encode it. See Section 5.11.4 for validating URIs.


    # 7.16. Foil Semantic Attacks


    A "semantic attack" is an attack in which the attacker uses the computing infrastructure/system
    in a way that fools the victim into thinking they are doing something, but are
    doing something different, while the computing infrastructure/system is working
    exactly as it was designed to. Semantic attacks often involve financial scams,
    where the attacker is trying to fool the victim into giving large sums of money
    (e.g., thinking they''re investing in something). For example, the attacker may
    try to convince the user that they are looking at a trusted website, even if it
    isn''t.


    Semantic attacks are difficult to counter, because they''re exploiting the correct
    operation of the computer. The way to deal with semantic attacks is to help the
    user additional information, so that when "odd" happens the human will have more
    information or a warning will be presented that something may not be what it appears
    to.


    Chapter 7. Structure Program Internals and Approach


