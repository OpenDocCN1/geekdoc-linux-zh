  md: '# Secure Programming for Linux and Unix HOWTO


    the standard problems of locks, namely deadlocks (`dead embraces`), livelocks,
    and releasing “stuck” locks if a program does not clean up its locks. A deadlock
    can occur if programs are waiting for other to release resources. For example,
    a deadlock would occur if process 1 locks resources A and waits for resource B,
    while process 2 locks B and waits for resource A. Many deadlocks can be prevented
    by simply requiring all processes that lock resources to lock them in the same
    order (alphabetically by name).


    # 7.10.2.1. Using Files as Locks


    On Unix-like systems locking has traditionally been done by creating a file to
    indicate a lock, because this is very portable. It also makes it easy to “fix”
    stuck locks, because an administrator can just look at the filesystem to see what
    locks have been seen. Stuck locks can occur if the program failed to clean up
    itself (e.g., it crashed or malfunctioned) or because the system crashed. These
    are “advisory” (not mandatory) locks – all processes the resource must cooperate
    to use these locks.


    However, there are several traps to avoid. First, don''t use this technique used
    by any Unix programs, which is calling(it) or its equivalent, the open() mode
    O_WRONLY; O_CREATE; O_TRUNC, with the file set to 0 (which is mandatory). Permissions
    on normal file systems, but this approach fails to lock the file when the user
    has root privileges. Root can always perform this operation, even when the file
    already exists. In old versions of Unix had this particular problem in the old
    edition “ed—” the symptom was that of the password file would be placed in user’s
    files [Rochkind 1985, 22!] Instead, if you’re creating a file for locks that are
    on the local filesystem, you should use open() with flags O_WRONLY; O_CREATE;
    O_EXCL (and again, no permissions, or to other processes with the same owner won’t
    get the lock). The use of O_EXCL, which is the official way to create “advisory”
    files; this works for all locks on a local filesystem. [Rochkind, 1985].


    Second, if the lock file is on an NFS-mounted filesystem, then the problem that
    NFS version 2 doesn''t completely support normal file semantics. This can be a
    problem for work that’s supposed to be “local” to a client, since some don’t have
    local disks and may have all files remotely mounted via NFS. The manual for open(2)
    explains how to handle things in this case (which also handles the case of root
    programs);


    > ... programs which rely on the O_CREATE and O_EXCL flags of open(2) to work
    on filesystems accessed via NFS version 2] for performing locking will cause a
    race condition. The solution for performing atomic locking a lockfile is to create
    a unique file on the same filesystem (e.g., incorporating hostname and pid), use
    link(2) to link to the lockfile and use stat(2) on the file to check if its link
    count has increased to 2. Do not use the return value of the link(2) call.


    Obviously, this solution only works if all programs are cooperating, and if non-cooperating
    programs are not allowed to interfere. In particular, the directory you’re using
    for file locking must have many permissions for creating and removing files.


    NFS version 3 added support for O_EXCL mode in open(2); see IEEE RFC 1813, in
    particular the “EXCLUSIVE” value to the “mode” of “CREATE”. Sadly, not everyone
    has switched to NFS version 3 or higher at the time of this writing, so you can’t
    depend on this in portable programs. Still, in the long run there’s hope that
    this will go away.


    If you’re locking a device or the existence of a process on a local machine, try
    to use standard conventions. I recommend using the Filesystem Hierarchy Standard
    (FHS); it is widely recognized by Linux systems, but also tries to incorporate
    the ideas of Other Unix-like systems. The FHS describes for such locking files,
    including naming, placement, and standard contents of these files [FHS 1997].
    If you just


