    do nothing. Here are some examples:


    +   * Image code that gethostname(3) and, if successful, immediately copies host->h_name
    to a fixed-size buffer using strcpy or strncpy. Using sprintf prevents an overflow
    of an excessively long full-qualified domain name (FQDN), you might think you''re
    done. However, this could result in chopping off the end of the FQDN. This might
    be very undesirable, depending on what happens next.

    * Image code that strcpy, strncpy, sprintf, etc., to copy the full path of a filesystem
    object to some buffer. Further that the original value was provided by an untrusted
    user, and that the copying is a part of process to prevent a computation to a
    function. Sounds safe, right? Now imagine an attacker uses a path with a large
    number of ''s at the beginning. This could result in future operations being performed
    on the file ”. If the program values belief that the result will be safe, the
    program may be exploitable. Or, the attacker could devise a filename longer than
    the buffer length, so attempts to copy the filename will fail to occur (or partially
    occur in ways that may be exploitable).


    When using-allocated buffers, you will need to consider the length of the source
    and destination arguments. Sanity checking the input and the resulting intermediate
    computation might do this, too.


    Another alternative is to dynamically reallocate all strings instead of fixed-size
    buffers. This general approach is recommended by the GNU programming guidelines,
    which permits programs to handle arbitrarily-sized strings until they run out
    of memory. Of course, the program with dynamically allocated strings is may to
    run out of memory. The memory may be exhausted at some other point dynamic reallocation
    may be inefficient if allocated; it is entirely possible to run out of memory
    even though there is enough memory available to the program to continue. In addition,
    before running out of memory the program will probably use a great deal of memory;
    this can easily result in “thrashing”, a situation in which the computer spends
    all its time just shuffling information between the disk and memory (instead of
    doing useful work). This can have the effect of a denial attack. Reasonable limits
    on input size can help. In general, the program must be designed to fail safely
    when memory is exhausted if you dynamically allocated strings.


    # 6.2.3. strcpy and strcat


    An alternative, employed by OpenBSD, is the strcpy(3) and strcat(3) functions
    by Miller and de Raadt [1999]. This is a minimal, statically-sized buffer that
    provides C string copying and concatenation with a different (and less-prone)
    interface. Source and documentation of these functions are available under a new
    OpenBSD-style open license at ftp://open.bsd.org/OpenBSD/src/lib/string/strcpy.3.


    First, here are their prototypes:


    ```

    size_t strcpy(char *dest, const char *src, size_t size);

    size_t strcat(char *dest, const char *src, size_t size);

    ```


    Both strcpy and strcat take the full size of the destination buffer as a parameter
    (not the maximum number of characters to be copied) and guarantee to NIL-terminate
    the result (as long as size is larger than 0). Remember that you should include
    a byte for NIL in the size.'
