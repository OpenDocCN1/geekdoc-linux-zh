  md: 'xargs --null or -0, tar --null, finds --print0, grep uses each

    --null or, and sort uses -z or --terminated. Those who find this inconsistency
    particularly

    disturbed are inviting to supply patches to the GNU; I would suggest making every
    program

    supported "--null" since that is the most common option. For example, there''s
    one way to

    move files to a target directory, if there may be many files and some have awkward

    names with embedded newlines (thanks to Jim Jenkins for reminding me of this):


    ```

    find -print0 | xargs --null mw --target-dir=$STARG

    ```


    In a similar view, I recommend not trusting "restricted shells" to implement security
    policies. Restricted shells

    are shells that intentionally prevent users from running a large set of activities;
    their goal is to ensure

    to only a run set of scripts. A restricted shell can be used as a defense-in-depth
    measure, but

    shell are notoriously hard to configure correctly and are often subverted. For

    example, restricted shells will start by running some file in an unrestricted
    mode (e.g., "profile") if a

    user can change this file, then execution control is gone. A restricted shell
    should be set up to only run

    f few programs, but if any of them have "escapes" to use other programs, attackers

    to escape the restricted shell. Even if the programs don''t have escapes, it''s

    quite likely that they can be exploited (along with the shell capabilities) to
    escape the

    restrictions. Of course, if you don''t set the PATH of a restricted shell, allowing
    any program to run, then

    an attacker can use the shell escapes of many programs (including text editors,
    mailers, etc.). The problem is

    the purpose of the shell is to run other programs, but those other programs may
    have unintended operations --

    the shell doesn''t oversee itself to prevent these operations.


    # 10.5. Ada


    It''s common for Ada programmers to believe that the String''s first index is
    always I, but

    this isn''t true if the string is sliced. Avoid this error.


    It''s worth noting that SPARK is a "high-integrity subset of the Ada programming
    language"; SPARK users

    use a tool called the "SPARK Examiner" to check compliance with SPARK rules, flow
    analysis, and

    there are various supports for full proof of the code if desired. See the SPARK
    website for more

    information. To my knowledge, there are OS/FS SPARK tools. If you''re storing
    passwords and private

    keys you should still lock them into memory and overwrite them as soon as possible.
    Note that

    spark is used in environments where paging does not occur.


    # 10.6. Java


    If you''re developing programs using Java, firstly your first step (after learning
    Java) is to read the two

    primary texts for Java security, namely Gong [1999] and McGraw [1999] (for the
    later, look particularly at

    section 7.1). You should also look at Spart security code guidelines at

    http://java.sun.com/security/seccodeguide.html and there is a nice article by
    Sahu et al [2002] A set of slides

    describing Java''s security model are fully addressed at http://www.dweler.com/javasec
    You can also see


