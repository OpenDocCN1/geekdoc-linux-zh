- pgno: 36
  md: '# Chapter 4. Security Requirements


    You will know that your tent is secure; you will take stock of your property and
    find nothing missing.


    Job 5:24 (NIV)


    Before you can determine if a program is secure, you need to determine exactly
    what its security requirements are for many circumstances, the Common Criteria
    [CC 1999], standardized as ISO/IEC 15048:1999. The CC is the culmination of decades
    of work to identify information technology security requirements. There are other
    schemes for defining security requirements and evaluating products to see if it
    meets the requirements, such as FIPS-140 for cryptographic equipment, but these
    others are generally focused on a specialized area and will not be considered
    here.


    This chapter describes the Common Criteria (CC) and how to use its concepts to
    help you informally identify security requirements and talk with others about
    security requirements using standard terminology. The language of CC is precise,
    but it''s also more formal and harder to understand; hopefully the text in this
    section will "get the just"


    Note that, in some circumstances, software cannot be used unless it has undergone
    a CC evaluation by an accredited laboratory. This includes kind of users in the
    U.S. Department of Defense (as specified by NISTSSP Number 11, which requires
    that some products be used unless they are evaluated or other), and in the event
    such a requirement may also include some kinds of software for the U.S. federal
    government. This section does not provide information if you plan to go through
    a CC evaluation. If you plan to go through a formal evaluation, you need to read
    the real CC, examine various websites to understand the basics of the CC, and
    eventually contract a lab to do a CC evaluation.


    # 4.1. Common Criteria Introduction


    First, some general information about the CC will help understand how to apply
    its concepts. The CC''s official name is "The Common Criteria for Information
    Security Evaluation", which it''s normally just the Common Criteria. The CC document
    has three parts: the introduction (that describes the CC overall), security functional
    requirements (that lists various kinds of functions that might want to include),
    and security assurance requirements (that lists various methods of assuring that
    a product is secure). There is also a related document, the "Common Evaluation
    Methodology" (CEM), which details how evaluators apply the CC when doing formal
    evaluations (in particular, it qualifies the CC in certain cases).


    Although the CC is International Standard ISO/IEC15048:1999, it is outrageously
    expensive to order the CC from ISO. Hopefully ISO will follow the lead of other
    organizations such as the IETF and the W3C, which freely standards. Surprisingly,
    IETF and W3C standards are followed more often than ISO standards, because ISO
    CC''s fees for standard size making them inaccessible to most developers. (I don''t
    mind others being paid for their work, but ISO doesn''t fund most of the standards
    development – many of the developers of ISO documents are volunteers – so ISO
    CC developers anticipated this problem and made sure that the CC''s technical
    content is freely available to all; you can download the CC''s technical content
    from http://csrc.nist.gov/ccv/ccv2list.html Even doing formal evaluation processes
    uses only these editions of the CC, and not the ISO versions; with simply no need
    to pay ISO for them.


    Chapter 4. Security Requirements


