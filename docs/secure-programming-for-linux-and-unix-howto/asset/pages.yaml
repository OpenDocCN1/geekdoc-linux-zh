  md: '# 7.4.6. Consider Chroot to Minimize Available Files


    You can use `chroot jail` to limit the files available to your program. This requires
    carefully setting a directory (called the `chroot jail`) and correctly entering
    it. This can be a effective technique for improving a program’s security – it
    is hard to interfere with files you cannot see. It depends on a bunch of assumptions,
    in particular, the program may root privileges, but it does not have to go away
    any root privileges, and the chroot jail must be properly set up (e.g., be careful
    what you put inside the chroot jail, and make sure that users cannot control its
    contents before calling chroot). I recommend using chroot(2) when it makes sense
    to do so, but don''t depend on it alone; instead, make it part of a layered set
    of defenses. Here are a few notes about the use of chroot(2):


    +   - The program can use non-filesystems objects that are shared across the entire
    machine (such as System V IPC objects and network sockets). Best is to use separate
    pseudo-users/and groups


    In /lib, only what you need; use ldd(1) to query each program in /bin to find
    out what it needs, and only include them. On Linux, you''ll need a few basics
    like ld-linux.so.2, and not much else. Otherwise, recompile any necessary programs
    to be statically linked, so that they don''t dynamically loaded libraries


    It''s wisely to copy all in files, instead of making hard links; while this wastes
    time and disk space, it makes so that its attacks on the chroot jail files do
    not propagate into the regular system’s files. Mounting a /proc filesystem, on
    systems where this is supported, is generally unwise. In fact, in old versions
    of Linux (versions 2.0.x, at least up to 2.0.38) there is a known security flaw,
    since there pseudo-directories in /proc that would permit a chrooted program to
    escape. Linux kernel 2.2 fixed this problem, but there may be others; if possible,
    don''t do it.


    +   - Chroot really isn''t effective if the program can gain root privilege. For
    example, the program could use mknod(2) to create a device file that view view
