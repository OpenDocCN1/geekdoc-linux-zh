    # 3.1. Processes


    In Unix-like systems, user-level activities are implemented by running processes.
    Most Unix systems support a "thread" as a separate concept; threads share memory
    inside a process, and the system scheduler actually schedules threads. Linux does
    this differently (and, in my opinion uses a better approach): there is no difference
    between a thread and a process. Instead, in Linux, when a process creates another
    it can choose what resources are shared (e.g., memory). The Linux kernel performs
    optimizations to get thread-level speeds; see clone(2) for more information. It''s
    worth noting that the kernel developers tend to use the "task," not "thread" or
    "process", but the external documentation tends to use the process (I''ll use
    "process"). When programming a multi-threaded application, it''s utterly better
    to use the process model to hide these differences. Not only does this make threading
    more portable, but some libraries provide an additional level of indirection,
    by implementing more than one application-level thread as single operating system
    thread; this can provide some improved performance on some systems for applications.


    # 3.1.1. Process Attributes


    Here are typical attributes associated with each process in a Unix-like system:


    +   * RUID


    Here are less-common attributes associated with processes:


    +   * FSUID, FGID - UID and GID used for filesystem checks; this is usually equal
    to the EUID and EGID. This is a Linux-unique attribute.

    * capabilities - POSIX capability; there are actually three of capabilities on
    a process: the effective, inheritable, and permitted capabilities. See for more
    information on POSIX capabilities. Linux kernel version 2.2 and greater support
    this; some Unix-like systems do too, but it''s not widespread


