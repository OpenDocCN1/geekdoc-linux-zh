- pgno: 10
  md: '# Secure Programming for Linux and Unix HOWTO


    FSF was having trouble the operating system kernel [FSF 1998]; without a kernel
    then their dream of a completely free operating system would not be realized.


    # 2.1.3. Linux


    In 1991 Linus Torvalds began developing an operating system kernel, which he named
    “Linux” [Torvalds 1999]. This kernel could be combined with the FSF material and
    other software (in particular some of the BSD components and MIT’s X–windows software)
    to produce a freely-modifiable and very useful operating system. This system will
    turn itself the “Linux kernel and an entire combination like “Linux”. Note that
    many use the term “GNU/Linux” for this installation.


    In the community, different organizations have combined the available components
    differently. Each combination is called a “distribution”, and the organizations
    that develop distributions are “distros”. Common distributions include Red Hat,,SuSE,
    Caldera, Corel, and Debian. There are differences between the various distributions,
    but all distributions are based on the same foundation: the Linux kernel and the
    GNU libraries. Some are covered by “copyleft” style licenses, which means these
    foundations must be made available to all, a unifying force the Linux distributions
    at their foundation that does not exist between the BSD and AT&T-derived Unix
    systems. This book is not specific to any distribution; when it discusses Linux
    kernel version 2.2 or greater and the C library 2.1 or greater, valid assumptions
    for essentially all major Linux distributions.


    # 2.1.4. Open Source / Free Software


    Increased interest in software that is freely shared has made it increasingly
    necessary to define and explain it. A widely used term is “open source software”,
    which is further defined in [OSI 1999]. Eric Raymond [1997] wrote several essays
    examining various development processes. Another widely-used is “free software”,
    where the “free” is short for “freedom”: the usual expectation is free speech,
    not free peer. Neither phrase is perfect. The term “free software” is often confused
    with programs which are given away at no cost, but whose source code cannot be
    viewed, modified, or redistributed. Conversely, the term open source is sometimes
    (adjusted) to mean software whose source code is visible, but for its usual meaning,
    that is, software which has its source code available for use, viewing, modification,
    and redistribution; a more detailed definition is contained in the Open Source
    Definition. In some cases, a difference is suggested; preferring the term “free
    software” to strongly emphasize the need for freedom, while others have other
    objectives (e.g., higher reliability) or simply to appear less ardent. For information
    on this definition of free software, and the motivations behind it, can be found
    at http://www.fsf.org.


    Those interested in reading advocacy pieces for open source and free software
    should see http://www.opensource.org and http://www.fsf.org. There are other documents
    which examine whether the open source software was notably more reliable than
    proprietary software (using for example, Miller [1995] found using measurement
    technique, which measured resistance to crashing due to random input).


