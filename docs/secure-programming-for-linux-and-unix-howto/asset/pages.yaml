    # 2.2. Security Principles


    There are many general security principles which you should be familiar with;
    one good place for information on security is the Information Assurance Technical
    Framework (IATF) [NSA 2000]. NIST has identified high-level "accepted principles
    and practices" [Swanson 1996]. You could also look at a general textbook on computer
    security, as [Pleeeger 1997]. NIST Publication 800–27 describes a number of good
    engineering principles (although they''re abstract, they''re insufficient for
    actually building security – hence this); you can get a copy at http://crsc.nist.gov/publications/nistnpubs/800–27/sp800-27.pdf.
    A few security principles are summarized here.


    Common security objectives (or goals) are described in terms of three overall
    objectives:


    +   - Confidentiality (as secrecy), meaning that the computing system''s assets
    can be read only by authorized parties.

    - Integrity, meaning that the assets can only be modified or deleted by authorized
    parties ways.

    - Availability, meaning that the assets are accessible to the authorized parties
    in a timely manner (as determined by the systems requirements). The failure to
    meet this goal is called a denial of service.


    Some people define major security objectives, which others count additional goals
    as special cases of these three. Some identify non-reputation as an objective;
    this is to identify whether a sender sent or received a message (or both), even
    if the sender or receiver wishes to deny it. Privacy is sometimes addressed separately
    from confidentiality; define this the confidentiality of a user (e.g., their identity)
    instead of the data. Most objectives require identification and authentication,
    which are listed as a separate objective. Sometimes "access control" and "authenticity"
    are listed separately as well. For example, the U.S. Department of Defense (DoD),
    in DoD directive 3600.1 defines "information assurance" as "information operations
    (IO) that protect and defend information and information systems by ensuring their
    availability, integrity, authentication, confidentiality, and nonrepudiation.
    It includes providing for restoration of information systems by incorporating
    protection, detection, and reaction capabilities.


    In any case, it is important to identify your program''s overall security objectives,
    no matter how you group them together, so you''ll know when you''ve met them.


