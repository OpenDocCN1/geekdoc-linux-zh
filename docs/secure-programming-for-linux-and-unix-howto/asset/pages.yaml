  md: '# Chapter 6. Avoid Buffer Overflow


    An enemy will overrun the land; he will pull down your strongholds and plunder
    your fortresses.


    Amos 3:11 (NIV)


    An extremely common security flaw is vulnerability to a `buffer overflow`. Buffer
    overflows are also called `buffer overruns`, and there are many kinds of buffer
    overflow attacks (including `stack smashing` and `heap smashing` attacks). Technically,
    a buffer overflow is a problem of the program''s implementation, but it''s such
    a common and serious problem that I have placed this information in our chapter.
    To give you an idea of how important this subject is, at the CERT, 9 of 13 advisories
    in 1998 and least half of the 1999 advisors involved buffer overflows. An informal
    1999 survey on Bugfound that approximately 2/3 of the respondents felt buffer
    overflows were the leading cause of system vulnerability (the remaining respondents
    identified `mis-configuration` as the leading cause) [Cowan 1999]. This is an
    old, well-known problem, yet it continues to resurface [McGraw 2000].


    A buffer overflow occurs when a set of values (usually a string of characters)
    is fetched into a fixed length buffer and at least one value falls outside of
    its boundaries (usually past its end). A buffer overflow can occur when reading
    input from the user into a buffer, but it can also occur during other times of
    processing in a program.


    If a secure program permits a buffer overflow, the overflow can be exploited by
    an adversary. If the buffer is a C variable, the overflow can be used to force
    the function to return to an attackers'' choice. This specific variation is often
    called `stack smashing` attack. A buffer in the heap isn''t much better; attackers
    may be able to use overflows to control other variables of the program. More details
    can be found from Aleph [1996], Judge [1995], or the Nathan P. Smith''s `Stack
    Smashing Vulnerabilities` at http://destroy.net/machines/security/. A discussion
    of the problem and some ways to counter them is by Crispin Cowan et al., 2000,
    at http://immux.org/StackGuard/Dissex00.pdf. A discussion of the problem and some
    ways to counter them in Linux is by Pierre-Allen Faille and Vincent Glaume at
    http://www.ensirb.fr/~claume/index.html.


    Most high-level languages are immune to this problem, because they automatically
    resize (e.g., Perl), or because they naturally detect and prevent buffer overflows
    (e.g., Ada). C provides no protection against stack overflows, and C++ as well.
    Assembly also provides no protection, and some languages normally have this protection
    (for performance reasons). Even if most of your program is written in another
    language, many library routines are written in C or C++, well as `glue` to call
    them, so other languages often don''t provide a complete protection from buffer
    overflows you''d like.


    # 6.1. Dangers in C/C++


    C users must avoid dangerous functions that do not check bounds unless they''ve
    ensured the bounds will never get exceeded. Functions used in most cases (or ensure
    protection) include the functions strcpy(3), strcat(3), sprintf(3) (with vsprintf(3)),
    and gets(3). These should be replaced with functions such as strncpy(3), strncat(3),
    and fgets(3) respectively, see the discussion below. The function strlen(3) should
    be avoided unless you can ensure that there a terminating NULL character to find.
    The scanf(3) (scanf(3), sscanf(3), vscanf(3), vscanf(3), and vfscanf(3)) is often
    dangerous to use; do not use it to send a string to a window without controlling
    the length (the format %s is a particularly problematic one). Other dangerous
    functions that may permit buffer overruns (depending on


