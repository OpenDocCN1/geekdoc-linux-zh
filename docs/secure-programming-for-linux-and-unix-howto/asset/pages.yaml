  md: "# Secure Programming for Linux and Unix HOWTO\n\nMcGraw[1998].\n\nObviously,\
    \ a great deal depends on the kind of application you're developing. Java code\
    \ intended for use the client has a completely different environment (and trust\
    \ model) than code on a server side. The general principles apply, of course;\
    \ for example, you must check and filter any input from an untrusted source. However,\
    \ in Java there are some \"hidden\" inputs or potential inputs that you need to\
    \ be wary of, as discussed by Jonathan Nightingale [2000] made an interesting\
    \ statement summarizing many of the issues in Java programming:\n\n> ... the big\
    \ thing with Java programming is minding your inherits. If you inherit methods\
    \ from parents, interfaces, or parents' interfaces, you risk opening doors to\
    \ your code.\n\nThe following are a few key guidelines, by Gong [1999], McGraw\
    \ [1999], Sun's guidance, and my own experience:\n\n+   1. Do not use public fields\
    \ or variables: declare them private and provide accessors to them so you can\
    \ limit their accessibility.\n2. Make methods private unless there is a good reason\
    \ to do otherwise (and if you do otherwise, document why). These non-private methods\
    \ protect themselves, because they may receive tainted data (unless you've somehow\
    \ arranged to protect them).\n3. The JVM may not enforce the accessibility (e.g.,\
    \ \"private\") at run-time in an application (as opposed to an applet). My talks\
    \ to John Steven (Cital Inc.), who pointed out this on the \"Secure Programming\"\
    \ mailing list November 7, 2000. This is that it depends on which class loader\
    \ the request was loaded. If the class was loaded with a class loader (including\
    \ the null/ primitive class), the access check returns \"TRUE\" (allowing access).\
    \ For example, this works (at least with Sun's 1.2.2 VM ; it might not work with\
    \ other implementations):\n   a. write a class (V) with a public field, compile\
    \ it\n   b. write an 'attack' class (A) that accesses field, compile it\n   c.\
    \ change V's public field to private, re\n   d. run A - ill access V's (no private)\
    \ field.\nHowever, the situation is different with applets. If you convert A to\
    \ an applet and run it as an applet (e.g., with appletviewer or browser), its\
    \ class loader is no longer a (or null) class loader. The code will throw java.lang.IllegalAccessException,\
    \ with the message that you are trying to access a field V.from class A\n4. Avoid\
    \ using static field variables. These variables are attached to the class (not\
    \ class instances), and can be located by any other class. As a result, static\
    \ fields can be found by any other class, making them much difficult to secure.\n\
    5. Never return a mutable object to potentially malicious code (the code might\
    \ change it without you). Note that arrays are mutable (even if the array contents\
    \ aren't), so don't return a reference to an internal array with sensitive data.\n\
    6. Never store your mutable objects (including arrays of objects). Otherwise,\
    \ the user could handle the object to secure code, let the secure code \"check\"\
    \ the object and change the data while the code was trying to use it. Clone arrays\
    \ before saving them internally, and be careful here (e.g., beware of user-written\
    \ cloning routines). There are several ways to allocate uninitialized objects.\n\
    7. Don't make everything final, unless there's a good reason not to. If a class\
    \ or method is non-final, an attacker could try to extend it in a dangerous and\
    \ unforeseen way. Note that this causes a loss of extensibility, in exchange for\
    \ security.\n\nChapter 10. Language–Specific Issues"
  merge: -1
  img_proc: true
