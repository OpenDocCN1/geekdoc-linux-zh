    # 4.3. Security Functionality Requirements


    This section describes the CC functionality requirements (by CC class), primarily
    to give you an idea of the kind of security requirements you might want in your
    software. If you want more detail about the CC''s requirements, see CC part 2.
    Here are the major classes of CC security requirements, with the 3-letter abbreviation
    for that:


    +   * Audit (FAU). Perhaps you''ll need to recognize, record, store, and analyze
    security-relevant activities. You''ll need to identify what you want to make auditable,
    since often you can''t leave all possible auditing enabled. Also, consider what
    to do when there''s no room for auditing – if you stop the system, an attacker
    may intentionally do be logged and lose the system.

    * Communication/Non-repudiation (FCO). This class is poorly named in the CC; officially
    it''s called communication, but the real meaning is non-repudiation. It is important
    that the originator cannot deny sending a message, or that a recipient cannot
    deny receiving it? There are limits to how well technology can support non-repudiation
    (a user might be able to give their private key ahead of time if they wanted to
    be able to repudiate later), nevertheless for some applications non-repudiation
    capabilities are very useful.

    * Cryptographic Support (F). If you are using cryptography, what operations use
    cryptography, what algorithms and sizes are you using, and how are you managing
    your keys (including distribution and destruction)?

    * User Data Protection (PDP). This class specifies requirement for protecting
    user data, and is a class in the CC with many families inside. The basic idea
    is that you should specify a policy for data (access control or information flow
    rules), develop means to implement the policy, support off-line storage, import,
    and export, and provide integrity when transferring user data to TOES. One-forgotten
    issue is residual information protection – it is acceptable if an attacker can
    recover "deleted" data

    * Identification and authentication (FIA). Generally you don''t just want a user
    to report who they are (identification) – you need to verify their identity, a
    password authentication. Passwords are the most common mechanism for authentication.
    It''s often useful to limit the number of authentication attempts (if you can)
    and limit the feedback during authentication (e.g., displaying asterisks instead
    of the actual password). Certainly, limit what a user can do before authenticating;
    may be many issues when a session can start, but in the CC world this is handled
    by "TOE access" (FTA) class described below instead.

    * Security Management (FMT). Many systems will require some sort of management
    (e.g., to control who can do what), generally by those who are a more trusted
    role (e.g., administrator). Beware those special operations are, and ensure that
    only the trusted roles can invoke them. You must limit trust; even more trusted
    roles should be limited in what they can do.

    * Privacy (FPR). Do you need to anonymity, pseudonymity, unlinkability, or unobservability?
    If so, are there conditions where you want or don''t want these (e.g., an administrator
    to be able to determine the real identity of someone hiding behind a pseudonym?).
    Note that these can easily conflict with non-repudiation, if you want those too.
    If you''re worried about sophisticated threats, these functions can be hard to
    provide.


