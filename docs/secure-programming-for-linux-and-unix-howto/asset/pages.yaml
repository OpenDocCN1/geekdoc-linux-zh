- pgno: 167
  md: '# Appendix F. About the Author


    ![](img/401d1ed43cfdf80ee7899e4f3adc4d24_167_0.png)


    David A. Wheeler is an expert in computer security and has long specialized in
    development techniques for large and high-risk software systems. He has been involved
    in software development since the mid–1970s, and has been involved with Unix and
    computer security since the early 1980s. His areas of knowledge include computer
    security, software safety, vulnerability analysis, inspections, Internet technologies,
    software-related standards (including POSIX), real-time software development techniques,
    and numerous computer languages (including Ada, C, C++, Perl, Python, and Java).


    Mr. Wheeler is co-author and lead editor of the IEEE book *Software Inspection:
    An Industry Best Practice*, author of the book *Ada95: The Lovelace Tutorial*,
    and co-author of the *GNOME User''s Guide*. He is also the author of many smaller
    papers and articles, including the *Linux Program Library HOWTO*.


    Mr. Wheeler hopes that by making this document available, other developers will
    make their software more secure. You can reach him at dwheeler@dwheeler.com (no
    spam please), and you can also see his web site at http://www.dwheeler.com.


    # Notes


