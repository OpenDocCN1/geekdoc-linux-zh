- pgno: 129
  md: '# Secure Programming for Linux and Unix HOWTO


    Many techniques do not work very well. One approach that works in some cases is
    use "basic authentication", which is built into essentially all browsers and servers.
    Unfortunately, basic authentication sends passwords unencrypted, so it makes them
    easy to steal; basic authentication itself is rarely useful for worthless information.
    You could store information in the URLs selected by the users, but for most circumstances
    you should never do this – not only are the URLs unprotected over the wire (as
    with authentication), but there are many too other ways that this information
    can leak to others (e.g., through browser history stored by many browsers, of
    logs, and other web sites via the Referer: field). You could wrap all communication
    with a web server using SSL/TLS connection (which you encrypt; this is necessary
    depending on how you are), and you could also use "digest authentication", which
    is easy but costly in terms of performance. You could also use authentication
    which exposes the communication but at least authenticates the user without exposing
    the underlying password to authenticate the user. Digest authentication is intended
    to be a simple solution for low-value communications, but digest authentication
    is not widely supported in an interoperable way by web browsers and servers. In
    fact, as noted in March 18,2002 eweek article, Microsoft''s web client (Internet
    Explorer) and web server (IIS) incorrectly implement the standard (RFC 2617),
    and won''t work with other servers or browsers. Since Microsoft does not view
    this incorrect implementation as a serious problem, it will be a long time before
    most of their customers have a correctly-working program.


    Thus, the most common technique for authenticating on the web is today cookies.
    Cookies are not really designed for this purpose, but they can be used for authentication
    – but there are many ways to use them that create security vulnerabilities, be
    careful. For more information about cookies, see IETF RFC 2965, with the older
    specifications about them. Note to use cookies, some browsers, of Internet Explorer
    6 may insist that you have a profile name (named p3.xml on the root directory
    of the server).


    Note that some users dont accept cookies, so this solution has some problems.
    If you want to support these users, you should send this authentication information
    back and forth via HTML form fields (since nearly all browsers support them without
    concern). You''d use the same approach as cookies – you''d just use a technology
    to have the data sent from the user to the server. Naturally, if you implement
    this approach, you need to include settings to ensure that these pages are not
    cached for others. Others, while I agree thinking cookies is preferable, in practice
    these approaches often require more development effort. Since it''s so hard to
    implement this on a large scale for many developers, I''m not countless stressing
    these approaches. I would rather describe approaches that are hard to implement
    correctly (by either developers or users). However, if you can do so much effort,
    all by means supporting the authentication information using form fields and an
    encrypted link (e.g., SSL/TLS). With all cookies, for these cookies you should
    them on the HttpOnly flag unless you have a web script that must be able to read
    them.


    Fu [2001] discusses client authentication on the web, with a suggested approach,
    and this is approach I suggest for most cases. The basic idea is that client authentication
    is split into two parts,"login procedure" and "subsequent requests." In the login
    procedure, the server asks for the user''s username and password, the server then
    replies with an "authentication". In the subsequent requests, the client (web
    browser) sends the authentication to the server (along with its request); the
    server verifies that the user is valid, and if it is, services the request. Another
    good source of information about web authentication is Seifert [2001].


    One serious problem with web authentication techniques is that they are vulnerable
    to a problem called "session fixation." In a session attack, the attacker fixes
    the user''s session ID before the user even enters the target server, eliminating
    the need to obtain the user''s session ID afterwards. The attacker obtains an
    account, and then tricks another user into the attacker''s account – often by
    creating a


    # Chapter 11. Special Topics


