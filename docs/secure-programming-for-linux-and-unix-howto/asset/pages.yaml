- pgno: 131
  md: '# 11.2.2. Authenticating on the Web: Subsequent Actions


    Once a user logs in, the server sends back a cookie with an authentication token
    that will be used from then on. A separate authentication token is used, so that
    users do not need to keep logging in, so that passwords are never sent back and
    forth, so that unencrypted communication can be used if desired. A suggested technique
    (ignoring session fixation attacks) would look like this:


    ```

    exp+time=s&digest=m

    ```


    Where i is the expiration time of the token (day, in several months), and s identifies
    the user (the username or session id). The digest is a keyed digest of the other
    fields. Feel free to change the field name of "data" to be more descriptive (e.g.,
    username or sessionid). If you have more than one field of data (e.g., both a
    username and a sessionid), make sure the digest uses both the names and data values
    of all fields you''re authenticating; concatenate them with a pattern (like %)
    that cannot occur in any of the field values. A keyed digest could be a cryptographic
    hash of the other information, in the token, the keyed digest should use HMAC-MDS
    or HMAC-SHA1, using a different server key (key2), using SHA1 might be okay for
    some purposes (or even MDS, if the risks are low). key2 is subject to force guessing
    attacks, so it should be long (say 12 characters) and unguessable: it does NOT
    need to be easily remembered. If this key2 is compromised, anyone can authenticate
    to the server, but it is easy to change key2 – when you do, simply force “logged
    in” users to re-authenticate. See [2001] for more details.


    There is a potential weakness in this approach. I have concerns that Fu''s approach,
    as originally described, is weak against session fixation attacks (from several
    directions, which I do not want to get into here). Now I suggest modifying Fu''s
    approach and using this token format:


    ```

    exp+data=client&digest=m

    ```


    This is the same as the original Fu approach, and older versions of this book
    (before December 2002) suggest it. This modification adds a new "client" field
    to uniquely identify the client''s location/identity. The data in the client field
    should be something that should change if someone else tries to use the account;
    its new value should be unguessable, though that''s hard to implement in practice.
    Ideally the client field should be the client''s SSL certificate, but currently
    that''s a suggestion that is hard to manage. At least, it should be the user''s
    IP address (as perceived from the server, and for IPv6 addresses). This modification
    completely counter session fixation attacks, unfortunately (if an attacker can
    determine what the user would send, the attacker may be able to make a request
    to a server and convince the client to accept those values). However, it does
    address the attack. The digest must now include all of the other data.


    Here''s an example. If a user logs in successfully, you might see the expiration
    date 2002–12–T01800 (let''s assume it is ASCII text in the format for us), the
    username is "fred", the client client as "1234", and you may determine the client''s
    IP address is 5.6.7.8. If you use a simple SHA-1 keyed digest (and use a key hashing
    the rest of the data), with the server key value of "rM!qp-v-Dvx", the digest
    could be:


    ```

    exp=2002-12-T01800&user=freesession=1234&client=5.6.7.8

    ```


    A keyed digest can be computed by running a cryptographic hash code, using the
    server key,2 then the data; in this case; the digest would be:


    ```

    10iebcfc6ffb64c3de53f616e9f59894d94

    ```


    From then on, the server must check the expiration time and recompute the digest
    of this authentication token, and accept only if the digest is correct. If not,
    the server should reply with the user login page (with a hidden field to show
    the successful login would go ahead).


    # Chapter 11. Special Topics


    126'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'It would be prudent to display the username, especially on important screens,
    to help counter session fixation attacks. If users are given feedback on their
    username, they may notice if they don''t have the expected username. This is helpful
    anyway if it is possible to have an unexpected username (e.g., a family that shares
    the same machine). Examples of important screens include those when a file is
    uploaded that should be kept private.


    One odd implementation issue: although the specifications for the "Expires:(expiration
    field) for cookies permit time zones, it turns out that some versions of Microsoft''s
    Internet Explorer don''t implement time zones correctly for cookie expiration.
    You need to use UTC time (also Zulu Time) in cookie expiration times for maximum
    portability. It''s a good idea to use UTC time for values, and convert when necessary
    for human display, since this eliminates other time zone and daylight savings
    issues.


    If you include a sessionid the authentication token, you can limit access further.
    Your server could "track" what pages a user has seen in a given session, and only
    permit access to other appropriate pages from that point (e.g., only those linked
    from the page). For example, if a user is granted access to foo.html and foo.html
    has pointers to resources bar1.jpg and bar2.png, then accesses to bar4.cgi can
    be rejected. You could even kill the session, though only if the authentication
    information is valid (otherwise this would make it possible for attackers to cause
    denial-of-service attacks on other users). This would somewhat limit the access
    of the attacker, if they successfully hijack a session, showing clearly an attacker
    with time and authentication could "walk" the links as a normal user would.


    One decision is whether or not require the authentication token/or data to be
    sent over a secure connection (e.g., SSL). If you use an authentication token
    in the clear (non-secure), someone who intercepts the token could do whatever
    the user could until the expiration time. If you send data over an unencrypted
    link, the risk of unnoticed change by an attacker; or that someone might change
    the data on the way, you then need to authenticate the data being transmitted.
    Encrypting by itself doesn''t guarantee authentication, but it does make corruption
    more likely to be detected, and typical libraries support both encryption and
    authentication in a TLS/SSL connection. In general, if you are encrypting a message,
    you should also authenticate it. If you need variety, one alternative is to create
    two authentication tokens – one is only used in a "secure" connection for important
    operations, while the other is used for less-critical operations. Make sure the
    token used for "secure" connections is marked so that only connections (typically
    encrypted SSL/TLS connections) are used. If users aren''t really different, the
    authentication token could omit the "data" entirely.


    Again, make sure that these pages with authentication aren''t cached. There are
    other reasonable schemes also; the goal of this text is to provide at least one
    secure solution. Many variations are possible.


    # 11.2.3. Authenticating on the Web: Logging Out


    You should always provide users with a mechanism to "log out" – this is especially
    helpful for customers using shared browsers (at a say at the library). Your "logout"''s
    routine is simple – just unset the client''s authentication token.


    # 11.3. Random Numbers


    In many cases programs must generate "random" numbers that cannot be guessed by
    an adversary. Examples include session keys, public or private keys, symmetric
    keys, and IVs used in many protocols, salts, and so on. Ideally, you should use
