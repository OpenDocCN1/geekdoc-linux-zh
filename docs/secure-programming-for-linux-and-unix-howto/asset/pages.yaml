  md: "# Secure Programming for Linux and Unix HOWTO\n\n+   9. Don't depend on package\
    \ scope for security. A few classes, as java.lang, are closed by default, and\
    \ some Java Virtual Machines (JVMs) let you close off other packages. Otherwise,\
    \ Java classes are not closed. Then, an attacker could introduce a new inner package,\
    \ and use this class to access the things you thought you protecting.\n\n+   10.\
    \ Don't use inner classes. When inner classes are translated into byte codes,\
    \ the inner class is translated into a accessible class in the package. Even worse,\
    \ the enclosing class's private fields silently become non-private to permit access\
    \ by the inner class!\n\n+   11. Minimize privileges. Where possible, don't require\
    \ any special permissions at all; McGraw goes further and recommends not signing\
    \ any code; I say go ahead and sign the code (so users can decide to `run` only\
    \ signed code by this list of senders), but try to write the program so that it\
    \ needs more than the sandbox set of privileges. If you must have more privileges,\
    \ audit code that code especially hard.\n\n+   12. If you must sign your code,\
    \ put it all in one archive file. Here's better to code McGraw [1999]:\n\nThe\
    \ goal of this is to prevent an attacker from carrying out a min-and-match attack\
    \ in which the attacker constructs a new app or that links some of your signed\
    \ classes with malicious classes, or signed classes that you never meant to be\
    \ used. By signing a group of classes, you make this attack more difficult. Existing\
    \ code-signing systems do an inadequate job of preventing mix-and-match attacks,\
    \ so this rule cannot prevent such attacks completely. Using a single archive\
    \ cannot hurt.\n\n+   13. Make your classes uncloneable. Java's-cloning mechanism\
    \ allows an attacker to instantiate a class without using any of its constructors.\
    \ To make a class uncloneable, just define the method in each of your classes:\n\
    \n```\npublic final Object clone() throws java.lang.CloneNotSupportedException\
    \ {\n  throw new java.lang.CloneNotSupportedException();\n}\n```\n\nIf you really\
    \ need to make your class cloneable, there are some protective measures you can\
    \ take to prevent attackers from redefining your clone method. If you define your\
    \ own clone method, just make it final. If you're not, you can prevent the clone\
    \ method from being malicious by overriding the following:\n\n```\npublic final\
    \ void clone() throws java.lang.CloneNotSupportedException {\n  super.clone();\n\
    }\n```\n\n+   14. Make your classes unserializable. Serialization allows attackers\
    \ to view the internal state of your objects, even private. To prevent this method\
    \ to your classes:\n\n```\nprivate final void writeObject(ObjectOutputStream out)\
    \ \n  throws java.io.IOException {\n  throw new java.io.IOException(\"Object cannot\
    \ be serialized\");\n}\n```\n\nIn cases where serialization is used, be sure to\
    \ use the secret key for the fields that contain direct handles to system resources\
    \ and that contain information relation to an address space. Otherwise, deserializing\
    \ the class may permit improper access. You may also want to identify sensitive\
    \ information from attack.\n\nIf you define using your serialization for a class,\
    \ it should not pass an internal array to any DataInputOutputStream that takes\
    \ an array. The rationale: All DataInputOutput methods can be overridden. If a\
    \ serializable class passes a private array directly to a DataOutputStream(byte\
    \ [] b)) method, an attacker could subclass ObjectOutputStream and override the\
    \ write(byte [] b))\n\n# Chapter 10. Language-Specific Issues"
