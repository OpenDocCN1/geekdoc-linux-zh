    resulting device file to modify kernel memory whatever privileges it desires.
    Another example of how a root program can break out of chroot is demonstrated
    at http://www.suid.edu/breakchroot.c. In this example, the program opens a file
    descriptor for the current directory, and creates chroot into a subdirectory,
    sets the current directory to the previously-opened current directory, repeatedly
    cd from the current directory (since it is outside the current chroot succeeds
    in moving up to the real filesystem root), and then calls chroot the result. By
    the time you have read this, these weaknesses have been plugged, but the root
    privilege has traditionally meant `all privileges` and it''s hard to strip away.
    It''s better to assume that a program requiring root privileges will only be mildly
    helped using chroot(). Of course, you may be able to kick in your program parts,
    so that at least part of it can be in a chroot jail.


    # 7.4.7. Consider Minimizing the Accessible Data


    Consider the amount of data that can be accessed by the user. For example, in
    CGI scripts, place all data used by CGI script outside of the document unless
    there is a reason the user needs to see the data. Some people may have the false
    notion that by not publishing a link, no one can access the data, but this is
    simply not true.


    # 7.4.8. Consider Minimizing the Resources Available


    Consider the computer resources available to a given process so, even if it ``goes
    haywire,'''' its damage can be limited. This is a fundamental technique for preventing
    a denial of service. For network servers, a common approach is to set up a separate
    process for each session, and for each process the limit of CPU time (etc) that
    session can use. That, if an attacker makes a request that uses memory or 100%
    of the CPU, the limit will kick in and prevent that from interfering with other
    tasks. Of course, an attacker can establish many sessions, but this least raises
    the bar for an attack. [Section 3.6](#section36) for more information on how to
    set these limits (e.g., limit(1)).


    # 7.5.0. Minimize the Functionality of a Component


    In a related mode, minimize the amount of functionality by your component. If
    it does several functions, breaking its implementation into those smaller functions.
    That way, users who don''t need some functions can disable those portions. This
    is particularly important when a flaw is discovered — this way, users can disable
    one component and use the other parts.


    # 7.6. Avoiding Setuid/Setgid Scripts


    Many Unix-like systems, as in Linux, simply ignore the setuid and setgid bits
    on scripts to avoid the race condition earlier. Since support for setuid scripts
    varies on Unix-like systems, they''re avoided in new applications where possible.
    A percl includes a special setup to support setuid scripts, using setuid and setgid
    is acceptable if you really need this kind of functionality. If you need to support
    this kind of functionality in your own interpreter, examine does this. Otherwise,
    a simple approach is to ``wrap'''' the script in a setuid/setgid executable that
    creates a safe environment (e.g., clears and sets environment variables) and then
    calls the script (using the script''s full path). Make sure that script cannot
    be changed by an attacker! Shell scripting languages have additional problems,
    and really should not be setuid/setgid; [Section 10.4](#section104) for more information
    about this.


    Chapter 7. Structure Program Internals and Approach'
