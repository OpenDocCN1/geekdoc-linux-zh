    # ## 2.10. Document Conventions


    System pages are referenced in the format *name(number)*, where *number* is the
    section number of the manual. The pointer value *null* does not point anywhere;
    is called NULL; C will convert the integer 0 to NULL in most circumstances where
    a pointer is needed, but note that in the C standard requires NULL to be implemented
    by a series of all-zero bits; C and C++ treat this character ‘0’ (ASCII) specifically,
    and is referred to as NULL (this is usually called “NULL,” BUT” and “NULL” sound).
    Function and method names use the correct case, even if that some sentences use
    with a lower case letter. I use the term “-like” to mean Linux, or other systems
    whose underlying are very similar to Unix; if you cannot say POSIX, because there
    are systems such as Windows 2000 that implement portions of POSIX have very different
    semantics.


    An attacker is called “attacker,” “cracker,” or “adversary,” and not a “hacker.”
    Some journalists mistakenly use the word “hacker” instead of “attacker”; this
    avoids this misuse, because many Linux and Unix developers refer to themselves
    as “hackers” in the non-trivial sense of them. Linux and Unix developers, the
    “hacker” continues to mean simply an expert or enthusiast, particularly regarding
    computers. It is true that some hackers perform malicious or intrusive acts, but
    many hackers do not, and it’s unfair to say that all hackers perform malicious
    activities. Many other glossaries note that not all hackers are crackers. For
    example, the Industry Advisory Council’s Information Assurance (IA) Glossary defines
    hacker as “A person who delights having an intimate understanding of the internal
    workings of computers and network. The term is used in a negative context where
    ‘cracker’ should be. The Jargon File has a long and complicated definition for
    hacker, starting with “A person enjoys the details of programmable software and
    how to stretch their capabilities, as opposed to most users, who prefer to learn
    only the minimum necessity;” it notes some people use the term to mean A malicious
    modifier who tries to discover sensitive information by poking around; it also
    states that this definition is deprecated and that the correct term for this sense
    is “cracker”.


    This book uses the “new” or “logical” quoting system, instead of the traditional
    American quoting system: quoted information does not include any trailing punctuation
    if the punctuation is not part of the material being quoted. While this may cause
    a loss of typographical beauty, the traditional American system causes extraneous
    characters to be placed inside the quotes. These extraneous characters have no
    effect on prose but can be disastrous in code or command shells. I use standard
    (not British) spelling; I’ve yet to meet an English speaker on any continent who
    has trouble with this.


    Chapter 2. Background'
