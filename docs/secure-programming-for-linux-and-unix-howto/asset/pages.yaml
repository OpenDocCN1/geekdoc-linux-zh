- pgno: 37
  md: '# Secure Programming for Linux and Unix HOWTO


    Although it can be used in other ways, the CC is typically used to create two
    kinds of documents, a `Protection Profile` (PP) or a `Security Target` (ST). A
    `protection profile` (PP) is a document created by groups of users (such, a consumer
    or group organization) that identifies the desired security properties of a product.
    Basically, a PP is a list of security requirements, described in a very specific
    way by the CC. If you are building a product to match existing products, it''s
    possible that there are one or more PPs that define what are necessary for that
    kind of product (e.g., an operating system or framework). A `security target`
    (ST) is a document that identifies what a product actually does, or a subset of
    it, that is, security-relevant. An ST does not meet the requirements of any particular
    PP, but an ST could meet the requirements of one or more PPs.


    Both PPs and STs can go through a formal evaluation. An evaluation of a PP ensures
    that the PP meets various documentation rules and checks. An ST evaluation not
    just examining the ST, but importantly involves evaluating an actual system (the
    `target of evaluation`, or TOE). The purpose of an ST is to ensure, to the level
    of the requirements specified by the ST, the actual product (the TOE) meets the
    ST''s functional requirements. Customers can then compare STs to PPs describing
    what they want. Through this comparison, consumers can determine if the products
    they require — and if not, where the limitations are.


    To create a PP or ST, you go through a process of identifying the security environment,
    namely, your assumptions, threats, and relevant organizational policies (if any).
    From the security environment, you derive the objectives for product or product
    type. Finally, the requirements are selected so that they meet the objectives.
    There are two kinds of security requirements: functional requirements (what a
    product has to do) and assurance requirements (measures to ensure confidence that
    the objectives have been met). Actually creating a PP or ST is not a simple straight
    line as outlined here, the final result needs to show a clear relationship that
    no critical point is easily overlooked. Even if you don''t plan to write an PP
