- pgno: 130
  md: '# Secure Programming for Linux and UNIX HOWTO


    secure hypertext link and trick the user clicking on it. A good paper describing
    session fixation is the paper by Mitja Kolsek [2002]: A web authentication system
    should be resistant to session fixation.


    # 11.2.1. Authenticating on the Web: Logging In


    The login procedure is typically implemented as an HTML form; I suggest using
    the fields `username` and `password` so that web browsers can automatically perform
    useful actions. Make sure that the password is sent over an encrypted connection
    (SSL or TLS, then https: connection) – otherwise, eavesdroppers could collect
    the password. Make sure all password text fields are marked as passwords in the
    HTML, so that the text is not visible to anyone who can see the user’s screen.


    If both the username and password fields are filled in, do not try to authenticate
    in as user. Instead, display the login form with the user and password fields;
    this lets the user verify that they really want to log in as user. If you do this,
    attackers will be able to exploit this weakness to perform a session attack. Paranoid
    systems might simply ignore the password field and make the user fill it in, but
    this interferes with browsers that can store passwords for users.


    When the user enters username and password, it must be checked against the account
    database. This database shouldn''t store the passwords in ``clear`, if someone
    gets hold of this database they''ve then get everyone''s password (and users often
    reuse passwords). Some crypt() to handle this, crypt can only handle a small input,
    so I recommend using a different approach (this is my approach – For [2001] doesn''t
    suffice). Instead, the user database should store a username, salt, and password
    hash for that. The “salt” is a random sequence of characters, used to make it
    harder for attackers to determine even if they get the password – an 8-character
    random sequence. It doesn''t need to be cryptographically random, just different
    from others. The password hash should be computed by concatenating server!key
    with the salt, and then running a cryptographically secure hash algorithm. Server
    key is a secret key so someone who has server key can then run programs to crack
    user passwords if they also had the password. Most secure would be HMAC–SHA-1
    or HMAC–MD5; you could use SHA-1 (most web sites use MD5) or MD5 (but MD5 would
    be poorer choice; see the discussion about MD5).


    Thus, when users create their accounts, the password is hashed and hashed against
    the hash in the database (they may be equal). When users change their password,
    they should type in both the old and new password, and the new password twice
    (make sure they don''t mistype it); and again, make none of these password characters
    are visible on the screen.


    By default, don''t save the passwords themselves on the client’s web browser –
    users may sometimes use shared clients (say as some coffee shop). If you want,
    do make sure that the password is set to only transmitted by “secure” connections,
    and make sure the user has specifically to request it (don''t do this by default).


    Make sure that the page is not marked to be cached, or a proxy server might serve
    that to other users.


    Once a user successfully logs in, the server needs to send the client an ``authentication
    token'''' in a cookie, which is described next.


    # Chapter 11. Special Topics


    125'
