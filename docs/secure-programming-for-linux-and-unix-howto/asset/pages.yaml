- pgno: 83
  md: '# 7.7. Configure Safely and Use Safe Defaults


    Configuration is considered to be the number security problem. Therefore, you
    should spend some effort to (1) make the initial installation secure, and (2)
    make it easy to reconfigure the system while keeping it secure.


    Never have the installation routines install a working `default` password. If
    you need to install `users`, that''s fine — just them up with an impossible password,
    leaving time for administrators to set the password (leaving the system secure
    before the password is set). Administrators will probably install hundreds of
    passwords and almost never forget to set the password — it''s unlikely they will
    know it, if you create a default password.


    A program should have the most restrictive access policy until the administrator
    has a chance to configure it. Please don''t create `sample` working users or `allow
    access to all` configurations as the starting configuration; many users just `install
    everything` (installing all available services) and never get around to configuring
    many. In some cases the program may be able to determine that a more generous
    policy is reasonable by depending on the authentication system, for example, an
    ftp server could legitimately determine that a user who can log into user''s directory
    should be allowed to access that user''s files. Be careful with such assumptions,
    however.


    Have installation scripts install a program as safely as possible. By default,
    install all as root or some other system user and make them unreadable by others;
    this prevents root users from installing viruses. Indeed, it''s best to make them
    unreadable by all the trusted user. Allow non-root installation wherever possible,
    so that users without root privileges and administrators who do not fully trust
    the installer can use the program.


    When installing, check to make sure that any assumptions necessary for security
    are true. Some library routines are not on some platforms; see the discussion
    of this in Section 8.1. If you know your application will run on, you do not need
    their specific attributes, but in that case you should check to make sure the
    program is being installed on one of those platforms. Otherwise, you should require
    a manual override to install the program, because you don''t know if the result
    will be.


    Try to make configuration as easy and clear as possible, including post-installation
    configuration. Make using the `secure` approach as easy as possible, or many users
    use an insecure approach without understanding the risks. On Linux, take advantage
    of tools like linuxconf, so that users can configure their system using an existing
    infrastructure.


    If there''s a configuration language, the default should be deny access until
    the user specifically grants it. Include many comments in the sample configuration
    file, if there is one, so the administrator understands what the configuration
    does.


    # 7.8. Load Initialization Values Saf


    Many programs read an initialization file to allow their defaults to be configured.
    You must ensure that an attacker can''t change which initialization file is used,
    nor create or modify that file. Often you should not use the current directory
    as a source of information, if the program is used as an editor or browser, the
    might be viewing the directory controlled by someone else. Instead, if the program
    is a typical application, you should load any user defaults from a hidden file
    or directory in the user''s home directory. If the program is setuid/setgid, don''t
    read any file controlled by the user unless carefully filter it'
