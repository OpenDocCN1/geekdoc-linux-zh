    \ are sent to the shell, their special interpretation will used unless escaped;\
    \ this fact can be used to break programs. According to the WWW Security FAQ [Stein\
    \ 1999, Q37], these metacters are:\n\n```\n$ \\ | * | ? ~ ^ ^ ( ) [ ] | \\ $ n\
    \ r\n```\n\nI should note that in many situations you will also want to escape\
