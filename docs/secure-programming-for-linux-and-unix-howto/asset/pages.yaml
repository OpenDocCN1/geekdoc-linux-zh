  md: '# 5.11.5. Other HTML tags


    You might even considering more HTML tags. Obvious next are the list-oriented
    tags, such as <ol> (ordered list), <ul> (unordered list), and <li> (list item).
    However, after a certain point you''re really full publishing (in which case you
    need to trust or perform more secure chaining than will be described). Even more
    importantly, every new functionality you add creates an opportunity for error
    (exploit).


    One example would be permitting the <img> (image) tag with the same URI pattern.
    It turns out this is substantially less safe, because this permits third parties
    to insert ``web bugs`` into the document, identifying who read the content and
    when. See Section 8.7 for more information on web bugs.


    # 5.11.6. Related Issues


    Web applications should explicitly specify the character set (usually ISO–8859–1),
    and not permit other characters, if data from untrusted users is being used. See
    Section 9.5 for more information.


    Since this kind of input is easy to get wrong, other alternatives have been discussed
    as well. One option is to use a different language, much simpler than HTML, that
    you''ve designed – and you give that language very limited functionality. Another
    approach is parsing the HTML into some “safe” format, and then translating that
    safe back to HTML.


    Filtering can be done on input, output, or both. The CERT filters data during
    the output process, before it is rendered as part of the dynamic page. This is
    because, if it is done correctly, this approach ensures all dynamic content is
    filtered. The CERT believes that filtering on the input side is less effective
    because dynamic content can be entered into a web database(s) via other methods
    than HTTP, and in this case, the server may never see the data as part of the
    input process. Unless the filtering is implemented in all places where dynamic
    data is, the elements may remain tainted.


    I don''t agree with CERT on this point for all cases. The problem is that it is
    easy to forget to filter all the output, and allowing “tainted” input into your
    system is a disaster waiting to happen. A secure program has to filter its inputs,
    so it''s sometimes better to include all of these checks as part of the filtering
    (so that maintainers can see what the rules are). In some secure programs there
    are many different program locations that output a value, but only a few ways
    and locations where data can be entered into; in such cases filtering input might
    be a better idea.


    # 5.12. Forbid HTTP To Perform Non–Queries


    Web-applications using HTTPS should prevent the use of the HTTP `GET` or `HEAD`
    method for anything other than queries. HTTP includes a number of methods; the
    most popular methods are used GET and POST. Both GET and POST are used to transmit
    data from a form, the GET method transmits data in the URL, while the POST method
    transmits separately.


    The security problem of using GET to perform non-queries (such as changing data,
    transferring money, or signing up for a service) is that an attacker can create
    a hyperlink with link that contains malicious form data. If the attacker convinces
    a victim to click on the link (in the case of a hyperlink), or even view a page
    (in the case of transformed such as HTML''s img), the victim will perform a GET.
    When the GET is performed, all of the form data created by the attacker will be
    a cross–site malicious content attack, as discussed further in Section 7.15.


    Chapter 5. Validate All Input


