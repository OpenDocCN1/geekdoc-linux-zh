    they choose EAL 2 plus some additional measures (if the combination isn''t enough
    to achieve a higher EAL level, such as a combination would be called `EAL 2 plus`).
    There are mutual agreement signed between many of the world''s nations that accept
    an evaluation by an accredited laboratory in the other countries as long as the
    assurance measures taken were at the EAL 4 or less.


    If you want to write an ST or PP, there''s an open software program that can help
