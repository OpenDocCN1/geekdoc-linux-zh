    # 9.5. Control Character Encoding in Output


    In general, a secure program must ensure that it synchronizes its content to any
    assumptions made by the secure program. One common issue affecting websites is
    that they use to specify the character encoding of their output. This is not an
    problem if the data is from trusted sources, but if some of the data is from untrusted
    sources, the unwanted source may use a different encoding than the one expected
    by the program. This opens the door for a cross-site malicious attack; see [Section
    5.10](Section 5.10) for more information.


    [CERT''s tech tip on malicious code mitigation](CERT''s tech tip on malicious
    code mitigation) explains the problem of unspecified character encoding fairly
    well, so I quote it:


    > Many pages believe the character encoding ("charset" in HTTP) undefined. In
    earlier versions of HTML and HTTP, the character encoding was supposed to default
    to ISO-8859-1 if it wasn''t defined. In fact, many browsers have a different default,
    so it was not possible to rely on the default being ISO-8859-1. HTML version 4
    legitimizes this – if the character encoding is not specified, any encoding can
    be used.


    If the web server doesn''t specify which encoding is used


    For example, UTF-7 provides alternative encoding for "<" and ">", and several
    browsers recognize it as the start and end of a tag. This is not a bug in those
    browsers. If the character encoding is UTF-7, then this is correct. The problem
    is that it is possible to get into a situation in which the browser and the server
    disagree on encoding.


    Though the issue is tricky, its resolution in HTML is easy. In the HTML header,
    simply specify the charset, like this example from CERT:


    ```

    <HTML>

    ```


