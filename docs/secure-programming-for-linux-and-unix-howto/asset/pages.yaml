- pgno: 30
  md: '# Secure Programming for Linux and Unix HOWTO


    Note that in Linux, only root can change the owner of a given file. Some Unix-like
    systems allow ordinary users to transfer ownership of their files to another,
    but this causes complications and is forbidden by Linux. For example, if you''re
    trying to limit disk usage, such operations would allow users to claim that large
    files actually belonged to some ``victim``.


    # 3.2.4. Using Access Control Attributes


    Under Linux and Unix-like systems, reading and writing attribute values are only
    checked when the file is opened; they are not re-checked on every read or write.
    Still, a large number of calls do check these attributes, since the filesystem
    is central to Unix-like systems. Calls that check these attributes include open(2),
    create(2), link(2), unlink(2), rename(2), mknode(2), symlink(2), and socket(2).


    # 3.2.5. Filesystem Hierarchy


    Over the years conventions have been built with ``what files go where''''. Where
    possible, please follow conventional use when placing information in the hierarchy.
    For example, place global configuration information in etc. The Filesystem Hierarchy
    Standard (FHS) defines these in a logical manner, and is widely used by Linux
    systems. The FHS is an update to the previous Linux Filesystem Structure (FSSTAND),
    incorporating lessons learned and approaches from Linux, BSD, and System V. See
    http://www.pathname.com/fs for more about the FHS. A summary of these things is
    in here(5) for Linux and here(7) for Solaris. Sometimes different conventions
    disagree; where these situations configurable at compile or installation time


    I should note that the FHS has been adopted by the Linux Standard Base which is
    developing and promoting a set of standards to increase compatibility among Linux
    distributions and to enable software applications to run on any compliant Linux
    system.


    # 3.3. System V IPC


    Many-like systems, including Linux and System V systems, support System V interprocess
    communication (IPC) objects. Indeed System V IPC is required by the Open Group''s
    Single UNIX Specification, Version 2 [Open Group]. System V objects can be of
    two kinds: System V message queues, semaphore sets, and shared memory segments.
    Each object has the following attributes:


    +   * read and write permissions for each creator, group, and others.

    * creator UID and GID – UID and GID of the creator of the object.

    * owning UID and GID – UID and GID of the owner of the object (initially equal
    to the creator UID).


    When such objects, the rules are as follows:


    +   * if the process has root privileges, the access is granted.

    * if the process EUID is the owner or creator UID of the object, the appropriate
    creator permission bit is checked if access is granted.

    * if the process'' EGID is the owner or creator GID of the object, or one of the
    process'' groups is the owning or creating GID of the object, the appropriate
    group permission bit is checked for access.

    * otherwise, the appropriate ``other'''' permission bit is checked for access.


    Chapter 3. Summary of Linux and Unix Security Features


