  md: "# Secure Programming for Linux and Unix HOWTO\n\n#  7.15.2.2. Filtering\n\n\
    One approach to handling these special characters is simply eliminating them (usually\
    \ during input or output).\n\nIf you're already validating your input for valid\
    \ characters (and you generally should), this is easily done by simply omitting\
    \ the special characters from the list of valid characters. Here's an example\
    \ in Perl of a filter that accepts only legal characters, and since the filter\
    \ doesn't accept any special characters other than the space, it's quite acceptable\
    \ for areas such as a quoted attribute:\n\n```\n```n# Accept only legal characters:\n\
    $summary -= tr/A-Za-z0-9_\\\\; /dc;\nHowever, if you really want to strip away\
    \ only the smallest number of characters, then you could create a\n\nub remove_special_chars\
    \ {\n    local ($ss) = @_;\n    $ss =~ s/[<\\\"\\\\\\\\;\\\\&+]//g;\n    return\
    \ $ss;\n}\n\n# Sample use:\n$data = &remove_special_chars($data);\n```\n```\n\n\
    #  7.15.2.3. Encoding (Quoting)\n\nAn alternative to removing the special characters\
    \ is to encode them so they don't have any meaning. This has several advantages\
    \ over filtering the characters, in particular, it prevents data loss. If data\
    \ is \"mangled\" from the user's point of view, then at least it's possible to\
    \ reconstruct the data that was originally sent.\n\nHTML\n\nScripting languages\
    \ may consider specialized auto-quoting techniques, the interesting approach developed\
    \ in the web application Quixote. Quixote includes a \"template\" feature which\
    \ allows easy mixing of HTML text and Python code; text generated by a template\
    \ is passed back to the web server as an HTML document. As of version 0.6, Quixote\
    \ has kinds of text (of a single kind as such languages). Anything that appears\
    \ in a literal, quoted string is of type \"html\", and it is assumed to be exactly\
    \ what the programmer wanted it to be (which is reasonable, since the quote takes\
    \ the form of an Python string, is automatically quoted when the template is executed).\
    \ As a result, text from a database or other external source is automatically\
    \ quoted, and cannot be used for a cross-site scripting attack. Thus, Quixote\
    \ provides a safe defense – programmers no longer need to worry about every bit\
    \ of text that passes through the application (bugs infrequently too to be a serious\
    \ problem, and is obvious in testing). Quixote uses an open source license, and\
    \ the Linux Weekly News.\n\nChapter 7. Structure Program Internals and Approach\n\
    \n94"
