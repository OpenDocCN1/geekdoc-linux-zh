    # 5.9.5. UTF–8 Related Issues


    This section has discussed UTF-8, because it''s the most popular multibyte encoding
    of UCS, simplifying a lot of international text handling issues. However, it''s
    certainly not the only encoding; there are other encodings, such as UTF-16 and
    UTF-7, which have the same kinds of issues and must be validated for the reasons.


    Another issue is that phrases can be expressed in more than one way in ISO 10646/Unicode.
    For example, some accented characters can be represented as a single character
    (with the accent) and also as one of characters (e.g., base plus a combining accent).
    These two forms appear identical. There also a zero-width space could be inserted,
    which would make-similar items considered different. Beware of situations where
    hidden text could interfere with the program. This is an issue that is hard to
    solve; most programs don''t have such control over the clients that they know
    how completely a particular sequence will be displayed (this depends on the client''s
    font, display, locale, and so on).


    # 5.10. Prevent Cross–site Malicious Content on Input


    Some programs accept data from one untrusted user and pass that data to a second
    user; the user''s application may then cause data in a harmful way to the second
    user. This is a particularly common problem for web applications, we will call
    this "cross–site malicious content.\ In short, you accept input (including any
    form data) without checking, filtering, or encoding it. For more information,
    see Section 7.15.


    Ultimately, this means that all application input must be filtered (so characters
    that can cause this problem are removed), encoded (to ensure that only "safe\u201data
    gets through). Filtering and validation should often be done at the input, but
    encoding can be either at input or output time. If you''re passing the data without
    analysis, it''s probably better to encode the data (so it''s not forgotten), but
    if you''re processing the data, there are arguments for encoding output.


    # 5.11. Filter HTML/URIs That May Re–presented


    One case where cross–site malicious content must be prevented is web applications
    which are designed to accept HTML or XHTML from one user, and send it on to other
    users (Section 7.15 for more information on cross–site malicious content). The
    following subsections discuss filtering specific kind of input, handling it is
    a common requirement.


    # 5.11.1. Remove or Forbidden Some HTML Data


    It''s safe to remove all (X)HTML tags so they cannot affect anything, and this
    is relatively easy to do. As you noted above, you should identify the list of
    legal characters, rejecting or removing those characters that aren''t in the list.
    In this filter, simply include the following characters in the list of legal characters:
    "\u201cs\u201d, \u201e\u201f, and \u2016 (and if they are used in attributes,
    the double-quote \u201c\u201d\u201e\u201f). If browsers only operated the HTML
    specifications, the \u201e\u201f\u201c\u201d wouldn''t need to be removed, but
    in practice it must removed. This is because some browsers assume the author of
    the page meant to


