    # 2.4.3. Why Keeping Vulnerabilities Secret Doesn''t Make Them Go Away


    Sometimes it''s noted that a vulnerability exists but is unknown cannot be exploited,
    the system `practically secure.` In theory this is true, but the problem is once
    someone finds the vulnerability, finder may ignore the vulnerability instead of
    helping to fix it. Having unknown vulnerabilities doesn''t really make the vulnerabilities
    away; it simply means that the vulnerabilities are a time bomb, with no way to
    know when they''ll exposed. Fundamentally, the problem of exploiting a vulnerability
    is a discover for both open and closed source systems.


    One related claim made (though not directly related to OSS/FS) is that people
    should not post about vulnerabilities and discuss them. This sounds good in theory,
    but the problem is that attackers already distribute information about vulnerabilities
    through a large number of channels. In short, such approaches would defend vulnerabilities,
    while doing nothing to inhibit attackers. In the past, companies actively tried
    to prevent disclosure of vulnerabilities, fix vulnerabilities until they were
    widely known to their users (who could then know that the vulnerabilities be fixed).
    This is all part of the argument for “full disclosure.” Commentary: Hyper Group
    has a blunt comment in a CNET article titled “Tech News.” They stated:


    The comments of Microsoft''s Scott Coup, manager of the company''s security response
    center, echo a common refrain in a long, ongoing battle over information. Discussions
    of morality regarding the distribution of information go back and are very familiar.
    Several centuries ago, for example, the trick used to Copernicus and Galileo''s
    theory of the sun being at the center of the solar system... Coup''s blame “information
    professionals” for the recent spate of vulnerabilities in Microsoft products is
    best distinguished. Perhaps it represents an attempt to deflect criticism from
    the company that built these products... Efforts of all parties contribute to
    a continuous process of improvement. The more widely vulnerabilities become, the
    more quickly they get fixed.


    # 2.4.4. How OSS/FS Trojan Horses


    It''s sometimes argued that open source programs, because have no control by a
    single company, permit people to insert Trojan Horses and other malicious code.
    Trojan horses can be inserted into open source code, but can also be inserted
    into proprietary code. A dribbled or bundled exe is much less likely to be found
    in an open source program. After all, no one outside the organization can review
    the source code, and companies review their code entirely (or, if they do, can
    be assured that the reviewed code is what is used). And the notion that a closed-source
    program can be used later has little evidence; nearly all licenses disclaim warranties,
    and guarantees which not help software development companies like.


    Borland''s InterBase server is an interesting case in point. Between 1992 and
    1994, Borland inserted an unintentional “back door” into their database server,
    “InterBase.” This back door could allow any local or remote user to manage any
    database object and install arbitrary programs, and in some cases could lead to
    controlling the machine as “root.” This vulnerability stayed in the product for
    at least 6 years – no one could review the product, and Borland had no incentive
    to remove the vulnerability. Borland released its source code in July 2000. The
    “Firebird” project began working with the source code, and uncovered this existence
    of this back door with InterBase in January 2001. The CERT announced the existence
    of this back door CERT CA–2001–01. What''s discouraging is that the backdoor can
    be easily found simply by looking at an ASCII dump of the program (a common trick).
    This problem was found by open source developers reviewing the code, it was patched
    quickly. You could argue


