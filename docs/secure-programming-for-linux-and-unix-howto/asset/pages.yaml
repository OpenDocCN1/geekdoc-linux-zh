- pgno: 6
  md: '# # Chapter 1. Introduction


    A wise man attacks the city of the mighty and pulls down the stronghold in which
    they trust.


    Proverbs 21:22 (NIV)


    This book describes a set of guidelines for writing secure programs on Linux and
    Unix systems. For purposes of this book, a “secure program” is a program that
    sits on a security boundary, taking input from a source that does not have the
    same access rights as the program. Such programs include application programs
    used as viewers of remote data, web applications (including CGI scripts), network
    servers, and setuid/setgid programs. This book does not address the operating
    system kernel itself, although many of the principles discussed here apply. These
    guidelines were developed as a survey of “lessons learned” from various sources
    on how to create secure programs (along with identical observations by the author),
    reorganized into a set of larger partitions. This book includes specific guidance
    for a number of languages, including C, C++, Perl, PHP, Python, Tcl, and Ada.


    You can find the master copy of this book at http://www.dw.com/secure-programs.
    This book is also part of the Linux Documentation Project (LDP) at http://www.ldp.org
    It is also mirrored in several other places. Please note that these mirrors, the
    LDP copy and/or your copy in distribution, may be older than the master copy.
    I''d like to hear comments on this and/or, please do not send comments until you''ve
    checked to make sure your comment is valid for the latest version.


    This book does not cover assurance measures, software engineering processes, and
    quality assurance approaches, which are important but widely discussed elsewhere.
    Such measures include testing, peer review, configuration management, and formal
    methods. Documents identifying sets of development assurance measures for security
    issues include the Common Criteria (CC, [1999]) and the Security Engineering Capability
    Model (S-CMM). Inspections and peer review techniques are discussed in [Wheeler
    1996]. This book briefly discusses ideas of the CC, but also as an organizational
    aid to discuss security requirements. More general sets of software engineering
    processes are defined in documents such the Software Engineering Institute''s
    Capability Model for Software Engineering (SW-CMM) [Paulk 1993, 1993b] and ISO
    12207 [ISO 12207]. General standards for quality systems are defined in ISO 9000
    and ISO 9001.


    This book does not discuss how to configure a system (or network) to be secure
    in a given environment. This is clearly necessary for secure use of a general
    program, but many other documents discuss secure configurations. An excellent
    book on configuring Unix-like systems is described by Garfinkel [1996]. You can
    also find information on configuring Unix-like systems at web sites such as http://www.unix.com/security.html.
    Information on configuring a Linux system to be secure is available in a wide
    variety of documents including Feishti [1999], Seifrei [1997], Swan [1998], and
    Anonymous [2009]. Geedsoft [2001] describes how to Harden OpenBSD, and many of
    its suggestions are useful for any Unix-like system. Information on auditing existing
    Unix-like systems is discussed in Mookhee [2002]. For Linux systems (and eventually
    other Unix-like systems), you may want to examine the Bastille Hardening System,
    which attempts to “harden” or “tighten” the operating system. Learn more about
    Bastille at http://bastille-linux.org/; it is available for the General Public
    License (GPL). The U.S. National Security Agency (NSA) maintains a set of security
    recommendations at http://nsa1.confinement, which includes the “60 Minute Security
    Guide.” If you’re trying to establish a public key infrastructure (PKI) using
    open source tools, you might want to look at Cox of [2000]. The Open Source PKI
    Book. More about firewalls and Internet security is found in [Cheswick 1994].


    Chapter 1. Introduction'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# Secure Programming for Linux and Unix HOWTO


    Configuring a computer is only part of Security Management, a area that also covers
    how to deal with viruses, what kind of organizational security policy is needed,
    business continuity, and so on. There are international standards and security
    guidance. ISO 13335 is a five-part technical report giving guidance on security
    management [ISO 13335]. ISO/IEC 17799:2000 defines a code of practice [ISO 17799];
    its stated purpose is to provide high-level and general “recommendations for information
    security management for those who are responsible for initiating, maintaining
    or maintaining security in their organization.” The document specifically identifies
    it as a starting point for developing organization security.” It also states that
    not all of the guidance and controls it contains may be applicable, and that additional
    controls not may be required. More importantly, they are intended to be broad
    guidelines covering a number of areas, and not intended to give definitive details
    or “how-tos”. It’s worth noting that the signing of ISO/IEC 17799:2000 was controversial;
    Belgium, Canada, France, Germany, Italy, Japan and the West used against its adoption.
    However, it these votes were made primarily by prominent on parliament, not the
    content of the document, and certainly people are welcome to use ISO 1779 if they
    find it helpful. More information about ISO 17799 can be found in NIST’s ISO/IEC/17799.2000
    FAQ ISO is highly related to BS part 1 and 2; more information about BS 1779 can
    be found at http://www.iec.com/faq.html. ISO 17799 is currently revised. It is
    important to note that some of these standards (ISO 13335, ISO 17799, or BS part
    1 and 2) are intended to be a detailed set of technical guidelines for software
    developers; they are all intended to provide guidelines in a number of areas.
    This is important, because software developers who simply follow (for example)
    ISO 17799 will not naturally produce secure – developers need much, much, much
    more than ISO 17799 provides.


    The Commonly Accepted Security Practices & Recommendations (CASPR) project at
    http://www.caspr.org is trying to distribute security management knowledge into
    a series of papers available to all (under the GNU license, so that future document
    derivatives will continue to be available to all). Clearly, security management
    needs to keep up with patches that vulnerabilities are vulnerable and found. Beattie
    [2002] provides an interesting analysis on how to determine when to apply patches
    contrasting risk of bad patch to the risk of intrusion (e.g., under certain conditions,
    patches are optimally applied 10 or 30 days after they are revealed.


    If you’re in the current state of vulnerabilities, there are other resources available
    to use. The CVE http://www.mitre.org provides a standard identifier for each (widespread)
    vulnerability. The SecurityTracker Statistics analyzes vulnerabilities to determine
    what are the most common vulnerabilities. The Internet Storm at http://https.incidents.org
    shows the prominence of various Internet attacks around the world.


    This book assumes that the reader understands computer security issues in, the
    general security model of Unix-like systems, not the C programming language. This
    book includes some information about the Linux and Unix programming model for
    security. If you need more information on TCP/IP networks and protocols work,
    including their security protocols, consult general works on TCP/ip as [Murhammer
    1998].


    When I first writing this document, there were many short articles but no books
    on writing secure programs. There are two other books on writing secure programs.
    One is “Building Secure Software” by John Viega and Gary McGraw [Viega 2002];
    this is a very good book that discusses a number of important security issues,
    but it lacks a number of security topics that are instead covered here. covers
    them well, but at the cost of omitting many other important topics. The Viega
    book has a little information for Unix-like systems than for Windows systems,
    but it is not of the kind of system. The other book is “Writing Secure Code” by
    Michael Howard and David LeBlanc [Howard 2002]. The title of this book is misleading;
    the book is solely about writing secure programs for Windows, and is basically
    worthless if you are writing programs for any other system. This would be surprising;
    it’s published by Microsoft press, and its copyright is owned by


    Chapter 1. Introduction'
