    want to be sure your server does not execute more than once on a given machine,
    you should create a process identifier as /var/run/NAME.pid with the pid as its
    contents. In a similar vein, you should place lock files for things like device
    lock in /var/lock. This approach has the minor disadvantage of leaving files hanging
    around if the program halts, but it''s standard practice and the problem is easily
    handled by other systems.


    It''s important that programs which are cooperating using files to represent the
    locks use the same directory, not just the same directory name. This is an issue
    with networked systems: the FHS explicitly notes that /var/run and /var/lock are
    unshareable, while /var/mail is sharable. Thus, if you want the lock to work on
    a single machine, but not interfere with other machines, unshareable directories
    like /var/run (e.g., you want to permit each machine to run its own server). However,
    if you want all sharing files in a network to obey the lock, you need to use a
    directory that they share; /var/mail is one such location. FHS section 2 for more
    information on this subject.


    # 7.10.2.2. Other Approaches to Locking


    Of course, not use files to represent locks. Network servers often need more than
    the matter of binding a port to a kind of lock, since there''s an existing server
    bound to a given port, no other server will be able to bind to that.


    Another approach to locking is to use POSIX record locks, implemented through
    fcntl(2) as a `discretionary lock`. These are discretionary, that is, using requires
    the cooperation of the programs needing the lock (just as using files to represent
    locks does). There''s to to recommend POSIX record locks: POSIX locking is supported
    on nearly all Unix-like platforms (it mandated by POSIX), it can lock portions
    of a file (not just the whole), and it can handle the difference between read
    and write locks. Even more usefully, if a process dies, its locks are automatically
    removed, which is usually what is desired.


    You can also use mandatory locks, which are based on System V''s mandatory locking
    scheme. These only apply to files where the locked set bit is set. Also, you must
    mount the filesystem to permit mandatory lock files. In this case, every read(2)
    and write(2) are checked for locking; while this is more than advisory locks,
    it''s also slower. Also, mandatory locks don''t port as widely as other Unix-like
    systems (they''re available on Linux and System V-based systems, but not necessarily
    on others). Note that processes with root privileges can be held up by a mandatory
    lock, too, making it possible that this could a denial-of-service attack.


    # 7.11. Trust Only Trustworthy Channels


    In general, only trust information (or results) from trustworthy channels. For
    example, the routines getlogin(3) and tname(3) return information that can be
    controlled by a local user, so you don''t trust them for security purposes.


    In many contexts (and certainly for the Internet at), unauthenticated transmission
    is trustworthy. For example, packets sent over the public Internet can be viewed
    and modified at any point along their path, and arbitrary packets can be forged.
    These forged packets might include forged information about the sender (their
    machine (IP) address) or receiver. Therefore, dont use these values as your primary
    criteria for security decisions unless you can authenticate them (say using cryptography).


    This means that, under special circumstances, two old techniques for authenticating
    users in TCP/IP should not be used as the sole authentication mechanism. One technique
    is to limit users to `certain machines` by checking the `from` address in a data
    packet; the other is to limit access by requiring


