  md: '# Secure Programming for Linux and Unix HOWTO


    # 6.2.6. Libsafe


    Aratoo, Timothy Tsi, and Navjot Singh (of Lucent Technologies) have developed
    Libsafe, a wrapper of several library functions known to be vulnerable to stack
    smashing attacks. This wrapper (which they call a "middleware") is a simply dynamically
    loaded library that contains modified versions of C library functions such as
    strcpy().). These modified versions implement the original functionality, but
    in a manner that ensures any buffer overflows are contained within the current
    stack frame. Their initial performance analysis shows that this library is useful.
    Libsafe and source code are available at http://www.research.avalabs.com/project/libsafe.
    under the LGPL license.


    Libsafe appears somewhat useful. Libsafe should be considered for inclusion in
    Linux distributors, and its use is worth considering as well. For example, I know
    that the Mandrake distribution of Linux (version 7.1) includes it. However, as
    a software developer, Libsafe is a mechanism to stop defense-in-depth it does
    not really prevent buffer overflows. There are reasons why you shouldn''t just
    depend on Libsafe during code development:


    +   * Libsafe protects a small set of known functions with obvious buffer overflow
    issues. At the time of this writing, this is significantly shorter than the list
    of functions in this book to know about. It will not protect against code you
    write (e.g., in a while loop) that causes buffer overflows.

    * Even if Libsafe is installed in a distribution, the way it installs impacts
    its use. The documentation recommends LD_PRELOAD to cause Libsafe''s protections
    to be enabled, but the problem is that users can unset this environment variable...,
    causing the protection to be disabled for programs they execute!

    * Libsafe protects against buffer overflows of the stack onto the return address;
    you can still overrun the heap or other variables in procedure frame.

    * Unless you can be assured that all deployed platforms use Libsafe (or something
    like), you have to protect your program as if it wasn''t there.

    * Libsafe seems to assume that saved frame pointers are at the beginning of each
    stack frame. This is always true. Compilers (such as gcc) can optimize things
    away, and in particular the option "fomit-frame-pointer" removes the information
    that Libsafe seems to need. Thus, Libsafe may fail to work for some programs.


    The developers themselves acknowledge that software developers shouldn''t just
    depend on Libsafe. In their words:


    It is generally accepted that the best solution to buffer overflow attacks is
    to fix the defective programs. However, fixing defective programs requires that
    a particular program is defective. The true benefit of using libsafe and other
    security measures is protection against future attacks on programs that are not
    yet known to be.


    # 6.2.7. Other Libraries


    The glib (not glibc) library is a widely-available source library that provides
    a number of useful functions for C programmers. GTK+ and GNOME use glib, for example.
    As I noted earlier, glib version 1.3.2, _strcpy() and _strcat() have been added
    through a patch which I submitted.


    6. Avoid Buffer Overflow'
