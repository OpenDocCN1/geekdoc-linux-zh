    goals.


    A good overview of various design principles for security is available in Peter
    Neumann''s Principled Assedly Trustworthy Composable Architectures.


    # 7.2. Secure the Interface


    Interfaces should be minimal (simple as possible), narrow (provide only the functions
    needed), and non-bypassable. Trust should be minimized. Consider limiting the
    data that the user can see.


    # 7.3. Separate Data and Control


    Any files you support should be developed to completely separate (passive) data
    from programs that are executed. Applications and data viewers may be used to
    display files developed externally, so in general don''t allow them to accept
    programs (also known as ''''scripts'''' or ''''macros''''). The most dangerous
    kind is an auto-executing macro that executes when the application is loaded and/or
    when the data is initially displayed; from a security-point-of-view this is generally
    a disaster waiting to happen.


    If you must support programs remotely (e.g., to implement an access standard),
    make sure you have extremely strong control over the macro can do (this is often
    called a ''''sandbox''''). Past experience has shown that real sandboxes are hard
    to implement correctly. In fact, I can''t remember a widely-used sandbox that
    hasn''t been repeatedly exploited (yes, includes Java). If possible, at least
    have the programs stored in a separate file, so that it''s easier to block them
    when another sandbox has been found but not fixed. Storing them separately makes
    it easier to reuse code and to make it helpful.


    # 7.4. Minimize Privileges


    As noted, it is an important general principle that programs have the minimal
    amount of privileges necessary to do its job (this is termed ''''least privilege'''').
    That way, if the program is broken, its damage is limited. The extreme example
    is to not write a secure program at all—if this can be done, it usually should
    be. For example, don''t make your program setuid if you can; just make it an ordinary
    program, and require the administrator to log in before running it.


    In Linux and Unix, the primary determinant of process privileges is the set of
    ID''s associated with it: each process has a real, saved id for both the user
    and group (a few old Unix have a ''''saved'''' id). Linux also has, as a special
    extension, a filesystem UID and GID for each process. Manipulating these values
    is critical to keeping privileges minimized, and there are several ways to minimize
    them (discussed below). You can also chroot(2) to minimize the visible files to
    a program, which chroot(2) is difficult to use correctly. There are few other
    values determining privilege in Linux and Unix, for example, POSIX capabilities
    (supported by Linux 2.2 and greater, by other Unix–like systems).


    # 7.4.1. Minimize the Privileges Granted


    Perhaps the most effective technique is to minimize the highest privilege granted.
    In particular, avoid granting a root privilege if possible. Don''t make a program
    setuid root if it only needs access to a small set of files; consider separating
    user or group accounts for different function.


    Chapter 7. Structure Program Internals and Approach'
