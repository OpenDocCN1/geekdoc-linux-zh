- pgno: 124
  md: "# Secure Programming for Linux and Unix HOWTO\n\nTESTINGSTRING\nNote that this\
    \ solution prevents that the potentially malicious text is concatenated to the\
    \ end of the text; as with all languages, make sure the attacker cannot control\
    \ the format.\n\nAs a style of using curly braces when using; while, for, expr,\
    \ and any other command which parses an argument using expr/eval; Doing this will\
    \ avoid a common error when T called unintended double substitution (aka double\
    \ substitution). This is best explained by example; the following code is incorrect:\n\
    \n```\nwhile [![eof file] {\n    set line [$getfile]\n}\n```\n\nThe code is incorrect\
    \ because the \"[$eof file]\" will be evaluated by the Tcl parser when the while\
    \ command is executed, and not re-evaluated in every iteration as it should. Instead,\
    \ do:\nwhile {![eof file]} {\n    set line [$getfile]\n}\n\nNote that both the\
    \ condition, and the action to be performed, are surrounded by curly braces. Although\
    \ there are cases where the braces are redundant, they never hurt, and when you\
    \ fail to include the curly braces where they're needed (say, when making a minor\
    \ change) subtle and hard-to-find errors occur.\n\nMore information on good Tcl\
    \ style can be found in documents such as Ray Johnson's Tcl Style Guide.\n\nIn\
    \ the past, I have stated that I do not recommend Tcl for writing programs must\
    \ guarantee a security boundary. Tcl seems to have improved since, but I cannot\
    \ guarantee Tcl will work for your needs, I cannot guarantee that any other language\
    \ will work for you. Again, thanks to Wojciech Kocjan who provided some of these\
    \ suggestions on how to use Tcl code for secure operations.\n\n# 10.8. PHP\n\n\
    SecureReality put out a very interesting paper `A Study in Scarlet - Exploiting\
    \ Common Vulnerabilities in PHP` (Clowes 2001), which discusses some of the problems\
    \ in writing secure programs in PHP, particularly in versions before PHP 4.1.0.\
    \ Clowes concludes that `it is very hard to secure a PHP application (in the default\
    \ configuration of PHP), if you try.\n\nGranted, security issues exist in any\
