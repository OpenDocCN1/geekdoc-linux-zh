    dending on this security. You might also investigate the ``Penguin Module for
    Secure Distributed Internet

    Scripting'''', though at the time of writing the code and documentation seems
    to be unavailable.


    Many installations include a suited root version of perl named ''''suidperl''''.
    However, the perdelta man page

    version 5.6.1 recommends using sudo, stating the following:


    > "Note suidperl is neither built installed by default in any recent version of
    perl. Use

    of suidperl is highly discouraged. If you think you need it, try alternatives
    as sudo first.

    See http://www.courtesan.com/sudo/"


    # 10.3. Python


    As with any language, beware of any functions which allow data to be executed
    as parts of a program, to

    s sure an untrusted user can''t affect their input. This includes exec(), eval(),
    and execfile() (and frankly,

    y should check carefully call to compile()). The input statement is also surprisingly
    dangerous.

    [Watters 1996, 150].


    Python programs with privileges that can be invoked by underprivileged users (e.g.,
    setuid/setgid programs) might

    not import the ''''user'''' module. The user module uses the python.py file to
    read and execute. Since this

    file will be under the control of an untrusted environment, importing the user
    module allows an attacker to force the

    trusted program to run arbitrary code.


    Python does very little compile-time — it has no compile-time type information,
    and it

    even not check the number of parameters are legal for a given function or method.
    This is

    unfortunate, in a lot of latent bugs (John Vega and I have experienced this).
    Hopefully

    soday Python will implement static typing and type-checking, an idea that has
    been discussed for

    some time. A partial solution is for PyChecker, a lint-like program that checks
    for common bugs in

    Python code. You can get PyChecker from http://pychecker.sourceforge.net


    Python includes for ''''Restricted Execution'''' through its Rex class. This is
    primarily intended for

    executing applets and mobile code, but it can also be used to limit privilege
    in program even when the code

    hot been provided. By default, a restricted execution permits reading (no

    w) files, and does not include operations for network or GUI interaction. These
    defaults can

    changed, but creating loopholes in the restricted environment. In allowing a user
    to

    unrestricted addresses to a class permits all sorts of ways to circumvent the
    environment because Python''s

    implementation calls make ''''hidden'''' methods. Note that, by Python objects
    are passed by

    reference; if you insert a reference to a mutable value into a restricted environment,
    the restricted

    program can change the object in a way that is outside the restricted environment!
    If you want to

    age access to a mutable value, in many cases you should copy the mutable value
    or use the Bastion module

    (which supports restricted access to another object). For more information, see
    Kuchling [2000]. I''m uncertain

    of the amount of auditing that the restricted execution has undergone, so programmer
    beware.


    Chapter 10. Language-Specific Issues'
