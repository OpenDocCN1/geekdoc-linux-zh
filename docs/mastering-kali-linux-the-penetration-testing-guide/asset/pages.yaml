    # 8.2 WapITI (Web Application Vulnerability Scanner)


    Wapiti is an open-source tool that checks for multiple vulnerabilities in web
    applications, database injections, file leakage, cross-site scripting, XXE injection,
    CRLF injection. The injection database includes of SQL, XPath, PHP, ASP and JSP.
    Command execution attacks include eval (), system (), and pastru () vulnerabilities.


    This scanner enables the web applications or websites to be audited.


    It conducts web analysis black scan boxes by crawling the pages of the deployed
    web applications, detection scripts and forms in what it can inject.


    After the list of URLs, and their inputs is obtained, Wapiti acts like a fuzzer,
    sending payloads to check whether a script is vulnerable.


    Wapiti can detect the following:


    +   - Database Injection

    - Shellshock

    - Command Execution detection

    - CRLF Injection

    - Presence of backup files giving sensitive information

    - File disclosure


