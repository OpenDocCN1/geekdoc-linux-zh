  md: '# 4.2.2 Rules


    Each rule is expressed as conditions -j action options. If numerous conditions
    are defined in the same rule, then the standard is the conjunction (logical AND)
    of conditions, which is at least limiting as each condition.


    The -p protocol condition shall match the protocol of the IP packet. The most
    common values are TCP, UDP, ICMP and icmpv6. The condition can be supplemented
    by conditions on the TCP ports, with clauses such as --source-port and --destination-port.


    The -s address or -d network/mask matches the source address of the packet. Corresponding,
    -d address or - network/mask matches the destination address.


    The -i interface condition selects packets coming from the provided network interface.
    -o interface selects packets going out on a specific interface.


    The --state condition shall match the state of a packet in a connection (this
    requires the ipt_conntrack kernel module, for tracking connection). The NEW state
    describes a packet starting a new connection, ESTABLISHED matches packets that
    belongs to an already existing connection, and RELATED matches packets initiating
    a new connection that relates to an existing one.


    To print all rules in the selected chain


    +   * sudo iptables -S

    * sudo iptables -S INPUT

    * iptables -S OUTPUT


    Viewing iptables rules


    +   * iptables

