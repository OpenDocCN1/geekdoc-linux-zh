  md: '# Chapter 13

    Forensics


    # 13.1 ANDROID DEBUG BRIDGE (ADB)


    Android Debug Bridge (adb) is a versatile command-tool that lets you communicate
    with a device. The adb command facilitates a variety of device actions, such as
    installing and debugging apps, and it provides access to a Unix shell that you
    can use to run a variety of commands on a device. It is a client-server program
    that includes three components:


    +   * A client, which sends commands. The client runs on your development machine.
    You can invoke a client from a command-line terminal by issuing an adb command.


    +   * A daemon (adb), which runs commands on a device. The daemon runs as a background
    process on each device.


    +   * A server, which manages communication between the client and the daemon.
    The server runs as a background process on your development machine.


    # 13.1.1 How Android Debug Bridge (ADB) works


    When starting an adb client, the client first checks if there is already an adb
    server process running. If there is no, the server process starts. It connects
    to local TCP port 5037 when the server begins and listens for commands sent from
    adb clients— all adb clients use port 5037 to communicate with the adb server.


    The server then sets up connections to all running devices. It locates emulators
    by scanning oddnumbered ports in the range 5555 to 5558, which are used by the
    first 16 emulators. Where the server finds an adb daemon (adb), it sets up a connection
    to that port. Note that each emulator uses a pair of sequential ports — an even-numbered
    port for console connections and an odd-numbered port for ad connections. For
    example:


    ```

    Emulator 1, console: 5554

    Emulator 1, adb: 5555

    Emulator 2, console: 5556

    Emulator 2, adb: 5557

    and so on...

    ```


    As shown, the emulator connected to adb on port 5555 is the same as the emulator
    whose listens listens on port 5554.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Secbay Press


    Once the server has set up connections to all devices, you can use adb commands
    to access those devices. Because the server manages connections to devices and
    handles connections from multiple adb clients, you can control any device from
    any client (or from a script).


    # 13.1.2 Android Debug Bridge (ADB) Commands


    Query for devices


    Before issuing adb commands, it is helpful to know what device instances are connected
    to the adb server. You can generate a list of attached devices using the devices
    command.


    ```

    adb devices -l

    ```


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_307_0.png)


    # 13.1.3 Send commands to a specific device


    If multiple devices running, you must specify the target device when you issue
    the adb command. To specify the target, use the adb command to get the serial
    number of the target.


    Once you have the serial number, use the -s option with the adb commands to specify
    the serial number. If you use both -s and $ANDROID_SERIAL,

    -s overrides $ANDROID_SERIAL.


    In the following example, the list of attached devices is obtained, and then the
    serial number of one of the devices is used to install the helloWorld.apk on that
    device.


    ```

    $ adb devices

    List of devices attached

    emulator-5554 device

    emulator-5555 device

    $ adb -s emulator-5555 install helloWorld.apk

    ```'
