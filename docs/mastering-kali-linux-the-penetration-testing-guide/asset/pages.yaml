    # 8.6 OpenVAS


    OpenVAS is a tool for assessing vulnerability. OpenVAS is now called Greenbone
    Vulnerability Manager (GVM) and is a fork of Nessus. You may say it is still referred
    to as OpenVAS in commands and library documentation so just know that GVM and
    OpenVAS are the same thing. OpenVAS is suited to gathering information in large
    networks where manual scanning is to be developed and time consuming. OpenVAS
    allows administrators to identify potential security threats on a network.


    OpenVAS has a lot of moving parts and it sometimes can be a challenge to set up
    manually. Frankly, Kali has an easy-to-use tool `openvas-setup` to set up OpenVAS,
    download signatures, and generate a password for the admin user.


