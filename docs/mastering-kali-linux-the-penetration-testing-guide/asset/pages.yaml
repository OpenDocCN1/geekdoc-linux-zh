  md: '# # Chapter 12


    #  Wireless Attacks


    # ## 12.1 Understanding Wireless Network Technologies


    A wireless network is a network set up to communicate between computers and other
    network devices by using the radio signal frequency. It''s also sometimes called
    Wi-Fi network or WLAN. This network is becoming famous nowadays because the functionality
    is easy to set up and no cabling is involved. You can connect computers without
    the need for cables anywhere in your house.


    Here''s a simple explanation of how it works, let''s say you''ve got two computers
    with a wireless adapter and you''ve set up a wireless router. The binary data
    will be encoded at radio frequency and transmitted via wireless router when the
    computer sends out the data. Then, the receiving machine decodes the signal back
    to binary data.


    Wireless router or access point and wireless customers are the two main components.


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_278_0.png)'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'If you already have a wired Ethernet network at home, you can attach a wireless
    access point to existing network router and have wireless access at home.


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_279_0.png)


    Wireless routers or access points should be installed in such a way to maximize
    both coverage and throughput. The coverage given is generally referred to as a
    cell of coverage. Large areas generally require more than one point of access
    to ensure adequate coverage. To improve coverage, you can also add access points
    to your existing Wireless Router.'
