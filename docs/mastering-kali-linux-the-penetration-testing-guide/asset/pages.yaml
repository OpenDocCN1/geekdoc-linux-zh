    # 7.0.1 Whois Lookup


    Whois lookup involves finding additional information associated with a domain.
    Whois lookup consists of two steps:


    +   - Finding the domain name registration.

    - Finding the IP address range.


    ```

    Domain names in the com and net domains can now be registered with many different
