    attachment and how are validated.


    You can get a list of all the clusters and their status with pg_isclusters. And,
    you can automate the migration of your cluster to the latest PostgreSQL version
    with pg_upgradecluster old-version cluster-name.


    The old cluster is not dropped in the process, as it also wont be started automatically.
