    substantial systems work fine against single hosts.


    Nmap is available on all PC working operating systems, and binaries are available
    for Linux, Windows, and Mac OS. Notwithstanding the direct line Nmap executable,
    the Nmap suite incorporates a polished GUI and results watcher (Zenmap), an adaptable
    information exchange, redirection, and investigating apparatus (Ncat), for looking
    at output results (Nniff), and a bundle age and reaction examination inbuilt (Nping).


