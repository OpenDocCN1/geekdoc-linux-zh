  md: '# CHAPTER 1


    # Kali Linux Intro


    Kali Linux is a Debian-based Linux distribution aimed at security professionals
    and IT administrators, enabling them to conduct advanced Penetration Testing and
    Security Auditing. Kali contains several hundred tools which are tailored towards
    various information tasks, such as Penetration Testing, Security research, Computer
    Forensics and Reverse Engineering. But it''s more than just the tools, it has
    a completely customized interface and kernel that is purpose built for just about
    any Cybersecurity application.


    # 1.0 A Bit of History


    Kali Linux is an enterprise prepared security auditing Linux distribution based
    on Debian GNU/Linux operating systems and is the successor to the widely successful
    Backtrack Linux. Kali Linux was released on the 13th of March 2013, top-to-bottom
    rebuild of Backtrack Linux, adhering completely to Debian OS development standards.


    The first release (version 1.1.0) happened two years later, in February 2015,
    and was based on Debian 7 "Wheezy"Debian''s distribution at the time. In that
    year of development, Kali Linux packaged hundreds of penetrations testing related
    applications and built a robust infrastructure. Even though the number of applications
    is critical, the list has been meticulously curated, dropping applications that
    do not work or duplicate options already available in better programs.


    In 2015, Debian 8 - "Jessie" came out, Kali Linux was rebased on top of it. Kali
    Linux 1.x avoided the GNOME Shell in this version, it was decided to embrace and
    enhance it. Kali Linux added some GNOME extensions to acquire missing features,
    most notably the Applications menu. Kali Linux 2.0, published in August 2015,
    became the result of that work.


    > NOTE: GNOME is Kali Linux''s Default Desktop Environment

    A desktop environment is a series of graphical applications sharing a common graphical
    toolkit and intended for use on workstations. For general, desktop environments
    are not used on servers. Application launcher, file manager, web browser, email
    client, office suite, etc. are usually provided by them.


    The idea of "Kali Rolling": While the moving circulation has been accessible for
    a long time, Kali 2016 was the primary discharge to formally grasp the moving
    idea of dissemination: when you introduce the most recent Kali distribution, your
    framework really tracks the Kali Rolling repository and each every day you get
    new updates.


    # 1.1 Basics of Linux


    Linux! It''s been around the mid ''90s and has since reached a user-base that
    spans industries across continents. For those who know, you understand that Linux
    is everywhere. It''s in your phones, in your cars, in your refrigerators, your
    Roku devices. It runs most of the Internet - the supercomputers making scientific
    breakthroughs and the world''s stock exchanges. Before Linux became the'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Secbay Press


    platform to run desktops, servers, and embedded systems, it was (and is) one of
    the most reliable, secure, and worry-free operating systems available.


    Just like Windows XP


    Linux is also distributed under an open-source license. Open source follows the
    following key philosophies:


    +   * The freedom to run the program, for any purpose.

    * The freedom to study how the program works and change it to make it do what
    you wish.

    * The freedom to redistribute copies so you can help your neighbor.

    * The freedom to distribute copies of your modified versions to others.


    # 1.2 Components of Linux


    The OS is composed of several pieces:


    +   * **Bootloader**: A Bootloader is a piece of code that runs before any operating
    system runs and is used to boot other operating systems, typically each operating
    system has a set of specific loaders.

    * **Kernel**: The kernel is the core of the system and manages the peripheral
    devices, CPU, and memory. The kernel is the '' lowest '' OS level and has the
    highest security permissions.

    * **Daemons**: These are background services (printing, sound, scheduling, etc.)
    which run unobtriously in the background, rather than under a user''s direct control,
    waiting to be activated by a specific event or condition occurring. Many Linux
    systems rely on daemons and are an essential part of the Linux system, helping
    to keep it running smoothly and providing services to other applications and users.

    * **Shell**: A command process that provides the user-to-operating system interface
    and allows you to control the computer through commands typed into a text interface.
    This is what scares people off Linux the most because it''s unique to Linux/UNIX
    operating systems. This isn''t the case for conventional Linux desktops that have
    been modernized to make working with the shell easier.

    * **Graphical Server**: This is the sub-system on your monitor that displays the
    graphics. It''s commonly called the X server or just "X.\ Responsible for managing
    input devices like mice and keyboards, and handling communication between applications
    and the display hardware.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'The X server is responsible for drawing windows, icons, and other graphical
    elements on the screen, and for managing their interaction with input devices.
    It runs as a background process, listening for commands from applications and
    other components of the system.


    Applications that require graphical output, such as web browsers, text editors,
    and media players, interact with the X server through a client-server model. The
    application acts as a client, sending commands to the X server to create windows,
    draw graphics, and receive user input. The X server then manages the display of
    these graphical elements on the screen.


    The X server also supports remote display, allowing applications to be run on
    one machine and displayed on another. This feature is common in user environments
    where applications are run on a central machine accessed remotely by other computers.


    +   - Desktop Environment: This is the piece of puzzle with which users interact
    and there are several desktop environments available to choose from (Unity, GNOME,
    Cinnamon, Enlightenment, KDE, XFCE, and so on). There are built-in applications
    for each desktop environment (such as file managers, configuration tools, web
    browsers, games, etc.).


    +   - Applications: Desktop environments don''t offer the full range of applications.
    Unlike Windows and Mac, Linux provides uponous thousands of high-quality software
    titles that can be easily installed and found. Many modern Linux distributions
    like Ubuntu (and its derivatives) provide tools like the App Store that finalize
    and simplify the installation of applications.


    # 1.3 Difference between Windows & Linux


    | Linux | Windows |

    |---|---|

    | Linux is a completely open-source project. You can have a look at the source
    code of a Linux OS, which is plus. | Windows is a closed source software. Closed
    source means that source code for any application or OS is not readable by end
    user |

    | Linux has various Distributions which are highly customizable by end user for
    his/her needs | Windows has limited distributions and very little customization
    features |

    | Linux is licensed with GPL. GPL license means that the public is allowed to
    take the source code and customize as per their needs | Windows comes with Microsoft
    license Microsoft Licensed users are not allowed to customize the Source code
    |

    | Linux distributions don''t collect user data. | Windows collect all user details
    which lead to privacy concern.'
  merge: -1
