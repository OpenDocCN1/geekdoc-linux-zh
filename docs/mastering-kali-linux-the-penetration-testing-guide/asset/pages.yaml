    There are three standard chains in a filter table:


    +   - INPUT: fears packet whose destination would be firewall itself.

    - OUTPUT: fears packets that shall be forwarded by firewall.

    - FORWARD: fears packets that shall be passed through firewall (neither source
    nor destination).


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_97_0.png)


    There are three standard chains in a NAT table:


    +   - PREROUTING: to change packets as fast as they are received.

    - POSTROUTING: to change packets when they are prepared to go on to their destination.

    - OUTPUT: to change packets which are to be produced by the firewall.


    Chains are a list of rules with a set of default conditions and actions to be
    performed when certain conditions are matched. When a packet is processed the
    firewall scans the respective chain rules by one. Once they are matched, it resumes
    a specified action to continue the process. Choosing one standard action disturbs
    the processing of a chain because the packets are sealed.


