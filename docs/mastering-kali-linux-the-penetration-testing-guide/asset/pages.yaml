  md: '# CHAPTER 8


    # Vulnerability Assessment


    # 8.0 Vulnerability Assessment


    The process of defining, detecting, categorizing, and prioritizing vulnerabilities
    in computer systems, applications and networks that provide an organization with
    an evaluation that provides the necessary information, risk factors, and other
    potential risks that can affect the organization if not properly reacted.


    Many automated tools shall assist a security staff or organization in carrying
    out this assessment which will help them by defending and preventing vulnerability
    assessment from these attacks.


    When security vulnerabilities are not adequately patched, hackers will be able
    to access the IT systems and software as these vulnerabilities can be exploited
    Together with a management program, a comprehensive vulnerability assessment will
    help companies improve their system security.


    There are many ways to perform a vulnerability assessment based on different environments
    and this evaluation process includes a variety of tools, methods, vulnerabilities,
    risks, and threats.


    These are some of the different types of scans:


    +   - Network-based scans are used to identify potential network security vulnerabilities.
    In wired and wireless networks, they can also detect vulnerable systems.

    - Host-based scans will recognize and locate vulnerabilities in systems such as
    servers, workstations, or network hosts. This form of scan usually inspect ports
    and resources that can be accessed for network-based scans, but also makes configuration
    settings and device history more visible (patches).

    - Wireless network scans of an organization''s Wi-Fi networks normally focus on
    wireless infrastructure points of attack. A wireless network scan may also validate
    that a company''s network is configured securely in addition to identifying rogue
    access points.

    - Application scans can be used to evaluate websites to detect known software
    vulnerabilities and defective network or web application configurations.

    - Database scans are used to identify database vulnerabilities to avoid malicious
    attacks, such as SQL injection attacks.


