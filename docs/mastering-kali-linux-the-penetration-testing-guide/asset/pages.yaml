  md: '# CHAPTER 7


    # Information Gathering


    # 7.0 Information Gathering


    Information gathering is often referred to as. This is the preparatory phase where
    we collect as much information as possible about the target of evaluation. We
    usually collect information about three groups,


    +   - Network

    - Host

    - People involved


    There are two types of Footprinting:


    +   - Active: Directly interacting with the target to gather information about
    the target. E.G. Using Nmap tool to scan the target.


    +   - Passive: Trying to collect information about the target without directly
    accessing the target. This involves collecting information from social media,
    public websites etc.


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_144_0.png)


    During this phase, a hacker can collect the following information:


    +   - Searching for News Articles

    - Searching For publicly Available Data

    - Finding Social Media Accounts

    - Domain name

    - IP Addresses

    - Namespaces

    - Employee information

    - Phone numbers

    - E-mails

    - Job Information

    - Monitoring Website Traffic'
