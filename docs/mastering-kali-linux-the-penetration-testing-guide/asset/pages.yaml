    # Additional Kali Linux Updates


    # 14.1 Kali Linux 2023.1 Release (Kali Purple and Python Changes)


    Kali has reached its 10th Anniversary and their developers are adding some special
    things to the venerable ethical hacking pentesting distribution of Linux. This
    chapter will summarize the most recent updates to the distribution as well as
    some major changes in Python and the introduction of a new flavor of Kali Linux
    called Kali Purple. While there are many more tools available in Kali Linux, the
    aim of this book is not to cover every single tool (as that would be massive),
    but rather to pick out the most critical important tools and their applications.


    This is a list of the updates to the new 2023.1 release:


