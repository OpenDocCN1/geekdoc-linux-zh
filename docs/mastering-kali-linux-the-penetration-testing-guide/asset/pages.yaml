  md: '# 2.3 Basic Linux Commands


    Command line proficiency is essential to be a security professional. This section
    gives a brief description of the covered commands, all of which have multiple
    options.


    # 2.3.1 pwd


    The pwd command refers to the present working directory, it shows the current
    file system location. The target directory, by default, will take you to your
    home directory.


    ```

    ckptkali:-$ pwd

    /home/cklpt

    ckptkali:-$ cd Downloads

    ckptkali:~/Downloads pwd

    /home/cklpt/Downloads

    ckptkali:~/Downloads$

    ```


    Figure 11 pwd command


    In this example, when the pwd command is executed by default, the home directory
    i.e., /home / sysadmin is displayed and when the cd Documents command is executed,
    it navigates to the document directory as a result when the /home / sysadmin /
    Documents command is displayed for the second time.


    # 2.3.2 ls


    Ls is directory list command, by default ls lists directories. Through adding
    more options to the ls commands, you can list hidden files, directories and more.


    # Syntax


    ls [options] [argument]


    ```

    ckptkali:-$ ls

    Desktop Documents Downloads Music Pictures Public Templates Videos

    ckptkali:-~$

    ```


    Figure 12 ls command


    # Options


    Some useful options are -l, -a, -s, -h and -R.'
