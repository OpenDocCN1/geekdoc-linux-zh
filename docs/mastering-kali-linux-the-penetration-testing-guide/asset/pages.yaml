  md: '# 12.5 Wi-Fi Chalking


    War driving


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_295_0.png)


    # War driving


    Wardriving is the search act for moving vehicle Wi-Fi networks. It includes moving
    around an area slowly to locate wireless internet signals. This may be done by
    a person or two more individuals, who drive one person and search for Wireless
    networks by others.


    The search for Wi-Fi using a smartphone in a vehicle may be as straightforward
    as it is. However, the phrase often relates to hardware and software setup intended
    specially to locate and record wireless networks. Typically comprises the wardriving
    equipment:


    # War Chalking


