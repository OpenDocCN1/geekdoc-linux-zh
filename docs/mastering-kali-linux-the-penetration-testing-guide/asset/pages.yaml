    # Answers to Chapter Review Questions


    1. Answer: A


    Explanation: The correct nmap command for performing an OS scan is "nmap -O".
    This command instructs nmap to attempt to determine the operating system of the
    target host. Therefore, option A is correct.


    2. Answer: B


    Explanation: The correct nmap command to perform a service scan is "nmap -A".
    This command enables aggressive service detection with OS detection, version detection,
    script scanning, and traceroute. Therefore, option B is correct.


    3. Answer: C


    Explanation: When performing an nmap scan on a target, it is considered an active
    scanning technique as it directly interacts with the target to gather information
    about open ports, services, and potentially the operating system. Therefore, option
    C is correct.


    4. Answer: B


    Explanation: The correct nmap command to bypass firewall filtering using nmap
    is "nmap -Pn". This command instructs nmap to treat all hosts as online and skip
    host discovery, effectively bypassing firewall filters that block ICMP requests.
    Therefore, option B is correct.


    5. Answer: B


    Explanation: recon-ng is a tool primarily used for web reconnaissance and information
    gathering. It helps in discovering information about web applications, domains,
    and other online entities. Therefore, option B is correct.'
