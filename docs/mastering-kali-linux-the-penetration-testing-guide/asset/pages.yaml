    # 10.6 Whaling


    The term was coined for spear phishing attacks specifically directed towards senior
    executives and high-profile targets. In such cases, the content will be crafted
    to target an upper manager and the role of the person in the business. The content
    of a whaling attack can be an executive issue, such as a subpoena or a complaint
    from customers.


    # 10.6.1 How Whaling Attacks Work


    Whaling attacks require more preparation and investigation than spear-phishing
    assaults as normal. To target a high-value goal, they must take their time to
    find the ideal method to sound like their goal. Most also identify a way of reaching
    what they goal and what information the victims may.


    To define and plan of attack, cyber-criminals analyze social media and public
    corporate information. They can even enter the network using malware and rootkits:
    an attack that originates from the CEO''s account is far more effective than a
    faked email account. If these emails contain information to make the attacks appear
    to come from better still.


    # 10.6.2 Whaling Attacks Example


    In 2016, Snapchat an employee divulged payroll information from the file to a
    fraudster a from the CEO appeared like it had been reacted by the employee quickly.
    HR and payroll departments are often targeted by whaling attacks as they have
    access to sensitive personal information.


