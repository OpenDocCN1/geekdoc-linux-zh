    # 11.3 John the Ripper


    +   - John the Ripper is an open-source password cracking software.


    +   - John Ripper uses the dictionary attack. It encrypt sets of sample dictionary
    passwords and compares it to the encrypted password.


    +   - John the Ripper is designed to be feature-rich and fast. It combines several
    cracking modes in one program and is fully configurable for your needs.


    +   - Out of the box, John supports (and autodetects) the following Unix crypt(3)
    hash types: traditional DES-based, "bigcrypt", BSDI extended DES-based, FreeBSD
    MD5-based (also used on Linux and in Cisco IOS), and OpenBSD Blowfish-based (now
    also on some Linux distributions and supported by recent versions of Solaris).


