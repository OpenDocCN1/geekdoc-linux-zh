  md: '# 2.3.13 sudo


    Just like one can run the computer or system as an administrator in Windows and
    can give permission to run programs/files for user, Linux''s sudo command gives
    permissions to other users to execute a command as another. sudo needs authentication
    to run any commands. Once the user has been authenticated, a timestamp will be
    generated.


    Syntax: sudo -V | -h | -L | -v | -k | -K | [-H] | [-s] | [-P] [-S] | [-b]


    ```

    [-p prompt] [-c class] [-a auth_type] [-r rule] [-t type]

    ```


    # Options


    +   -V The (version) option allows sudo to print the version number and exit.
    If the invoking user is already ready, the -V option will print out a list of
    the defaults sudo was compiled with as well as the machine''s local network addresses.

    - -L The (list) option will print out the commands allowed (and forbidden) the
    user on the current host.

    - -L The (list defaults) option will list out the parameters that may be set in
    a Defaults line along with a short description for each. This option is useful
    in conjunction with grep.

    -h The -h (help) option causes sudo to print a usage message and exit.

    -v If given the -v (validate) option, sudo will update the user''s timestamp,
    prompting for the user''s password if necessary. This extends the sudo timeout
    for 5 minutes (or whatever the timeout is set to) but does not run a command.

    -k The -k (kill) option to sudo invalidates the user''s timestamp by setting it
    to the epoch. The next time sudo runs a password will be required. This option
    does not require a password and was added to allow a user to revoke sudo permissions
    from a .logout file.

    -K The -K (sure kill) option to sudo removes the user''s timestamp entirely. Likewise,
    this option does not require a password.

    -b The -b (background) option tells sudo to run the given command in the background.
    Note that if you use the -b option you cannot use shell job control to manage
    the process.


    # 2.3.14 uname


    In order to know the system information, uname is used.


    Syntax: uname [OPTION]'
