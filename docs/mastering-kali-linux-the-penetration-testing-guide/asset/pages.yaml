    * iptables --list

    * iptables -L

    * iptables -S TABLE_NAME

    * iptables --table NameHere --list

    * iptables -t NameHere -L -n -v --line-nodes


    To block a malicious network traffic from a range of hosts from IP address 10.0.1.15


    COMMAND:


    ```

    # iptables -A INPUT -s 10.0.1.5 -j DROP

