  md: '# About this Program:


    This course is designed to make users familiar with the various hacking tools
    and techniques using which one can discover and exploit various vulnerabilities
    pertaining to a network, a system, or the whole infrastructure of an organization.
    This course teaches you the rudiments of Kali Linux and its importance in the
    field of information security, cybersecurity, and digital forensics. Here you
    can learn and explore a variety of options to scan and discover vulnerable services
    that might affect the integrity and availability of the data.


    # Target Audience:


    This course is for someone who is new to Linux and Security and desires to learn
    more about the two subjects. It is also meant for security professionals who are
    on the path to learning Linux and wants to upgrade their arsenal of techniques
    and tools for discovering different vulnerabilities in the system or a web application.
    This book covers all the basic scenarios on network pen-testing, system pen-testing
    & also web application security testing.


    In terms of designations, this course would be of great help to:


    +   - Security Analyst

    - Penetration Testers

    - Application Testers

    - Forensic Investigators

    - System Administrators


    # Program Prerequisites:


