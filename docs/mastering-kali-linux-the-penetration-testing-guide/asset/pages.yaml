    Nikto Web Scanner is a Web server scanner which assesses Web servers for harmful
    (malicious)/CGI files, outdated (unpatched) server software and other issues.
    It performs specific checks for the generic and the server type. It also snaps
    and prints the cookies you expect to receive.


    Web scanner performs through testing of different things against web servers,
    including more than 6700 potentially hazardous records / CGIs, validates for any
    outdated servers with more than 1250 servers, and problems with different versions
    on more than 270 servers. It also tests the presence of multiple index files,
    HTTP server options for server configurations, and attempts to find installed
    web servers and software. The scanning devices and plugins are updated with automatic
    updates.


    As MacNikto, there are few variations of Nikto. MacNikto is an AppleScript GUI
    which a shell script wrapper built into Xcode from Apple. It provides easy access
    to a subset of features available in the Nikto web security scanner, which is
    installed in conjunction with the MacNikto application, Open Source.


    Really useful and operational, this tool is NOT stealthy. A website that includes
    an IDS or other authentication measures will sense that you are checking it. Initially
    designed for security testing, was never intended to be stealthy.


    Secbay Press 178 | Page'
