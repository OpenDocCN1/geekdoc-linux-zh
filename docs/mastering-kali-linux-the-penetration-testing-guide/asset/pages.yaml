  md: '# 7.1 OSINT Framework


    OSINT Framework, as its name implies, is a cybersecurity framework, a collection
    of OSINT tools to make your intel and data collection tasks easier. This tool
    is mostly used by security researchers and penetration testers for digital footprint
    printing, OSINT research, intelligence gathering, and reconnaissance.


    It provides a simple web-based interface that allows you to browse different OSINT
    tools filtered by categories. It provides an excellent classification of all existing
    intel sources, making a great resource for knowing infosec areas you are neglecting
    to explore, or what will be the next suggested OSINT steps for your investigation.


    OSINT Framework is classified based on different topics and goals. This can be
    easily seen while taking a look at the OSINT tree available through the web interface.


