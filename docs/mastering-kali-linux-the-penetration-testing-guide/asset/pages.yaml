    # 11.0 Password attacks


    Password attacks are attacks that contradict a service''s authentication. These
    outbreaks are often cracked into online password attacks and disconnected password
    attacks, which we find replicated in the menu group Password Attacks. Many attempts
    are made against a live system during online password attack. Encrypted password
    values are used in offline password attack and the attacker attempts to obtain
    plain text.


    Unlike this kind of attack, it is computational to operate, the defense will set
    restricted number of attempts per second. Which can be configured using some software
    or the active directory settings in windows.


    There are few online and scripts available for many Password attack tools. The
    advantage of using Kali Linux is that few of the tools are built to attack. In
    this chapter we will integrated password attacking tools and a few online tools
    to update us.


