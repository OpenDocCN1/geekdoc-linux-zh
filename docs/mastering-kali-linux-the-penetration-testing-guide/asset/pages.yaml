    # 1.6 Kali Linux Policies


    Although Kali Linux aims to follow Debian at any conceivable level, there are
    a few places where Kali has made unstable decisions due to the specific needs
    of security experts.


    +   - Single Root User by Default


    Kali changed to a non-root user policy by default since the release of 2020.1.


    This means:


    During the installation of amd64 and i386 images, it will prompt you for a standard
    user account to be created.

    \Any default operating system credentials used during Live Boot, or pre-created
    image (like Virtual Machines & ARM) will be:


    | User: kali |

    | Password: kali |

    | Vagrant image (based on their policy): |

    | Username: vagrant |

    | Password: vagrant |

    | Amazon EC2: |

    | User: kali |

    | Password: <ssh key> |


    +   - Network Services Disabled by Default


    Many default services that are available on other Linux distributions are turned
    off in Kali by default. Unlike Debian, Kali Linux keeps well known services such
    as HTTP to a minimum, though SSH is enabled. The reason behind this option is
    to limit exposure during a penetration test when it unexpected system connections
    report your identity and location.'
