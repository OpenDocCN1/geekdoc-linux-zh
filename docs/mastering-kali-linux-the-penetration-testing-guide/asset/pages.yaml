  md: '# 11.1 Types of password Attacks


    **Guessing** - Simple repeated attempts to use common passwords or known facts
    about the user obtaining a user''s password physically or electronically-may include
    sniffing network communications.


    **Dictionary Attack** - Automated password guessing by loading predetermined list
    of possible passwords values


    **Brute Force Attack** - Use of password-cracking software to attempt every possible
    alphanumeric password combination.


    **Rainbow Tables** - Sets of related plaintext passwords and their hashes. Hashes
    are computed beforehand, saving processing time during the actual attack.


    **Hybrid Password Attack** - Combination of several password attacks


    **Birthday Attack** - Attack exploits weaknesses in the mathematical algorithms
    used to generate hashes.


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_256_0.png)'
  merge: -1
