    # 9.5 Cross-site scripting and Types of XSS attacks on a web application


    Cross-Site Scripting (otherwise known as XSS) is one of the most well-known web
    attacks on the application layer. XSS vulnerabilities target content inserted
    on a page that is executed on the client side (in the browser of the client) as
    security shortcomings of customer-side scripting languages make, for example,
    HTML and JavaScript. XSS concept is to control a web application''s customer-side
    content to execute in the way the pernicious client wants it to. Such control
    can install content on a page that can be executed whenever the page is stacked
    or whenever a related event occurs.


    XSS is the security vulnerabilities most widely recognized in programming today.
    That should not be the situation as XSS is anything but hard to find and easy
    to solve. For example, XSS vulnerabilities may result in alterations and touch
    information breakdowns.


