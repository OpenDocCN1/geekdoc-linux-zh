    # 3.3.5 Configuring Apache


    By default, Kali Linux incorporates the Apache web server, which is given by the
    apache2 bundle. It is disabled by default, which is built-in. You can start it
    with systemctl start apache2.


    With many attacks on web applications and the development of web applications
    in the industry it''s nice to have the knowledge of these web components as it
    gives you the idea of what''s happening in the background


    Apache is a modular server, and many modules are executed by external modules
    during initialization by the main program. The default setup simply invokes the
    most basic modules, and the use of a2enmod module effectively invokes other modules.
    Use a2dismod module to disable a module. These commands automate the configuration
    interfaces in/etc/apache2/mods-enabled/, pointing to the real records (put away/etc/apache2/mods-accessible/).


    There are many modules, but two worth considering are: PHP and SSL. PHP-composed
    web applications are executed by the Apache web server with the aid of the committed
    module provided by the libapache-mod-php bundle thus empowering the module to
    be established.


    Apache 2.4 incorporates the SSL module required for secure HTTP (HTTPS) out of
    the box. It first needs to be activated with a2enmod ssl, then the required directives
    are added to the configuration. A setup precedent is given in/etc/apache2/sites-available/default-ssl.conf.
    With its default setup, the web server runs on port 80 (as assigned in /etc/apache2/ports.conf)
    and serves pages from the /var/www/html/catalog as a matter of course.'
