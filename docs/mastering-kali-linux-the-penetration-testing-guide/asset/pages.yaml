    # 13.7 Imaging Disk Using FTK® IMAGER


    FTK Imager is a data preview and imaging tool that allows you to rapidly examine
    electronic evidence to determine whether additional investigation using a forensic
    tool like AccessData® Forensic Toolkit (FTK) is required. FTK Imager can also
    produce flawless reproductions of computer data (forensic pictures) without altering
    the original evidence.


    FTK Imager can generate flawless copies or forensic pictures of data without altering
    the source evidence. The forensic image is identical to the original in every
    aspect, including file slack and unallocated or free space. This allows you to
    keep the original material secure while the investigation continues with the picture.


    Create hash reports for normal files and disk images to serve as a benchmark to
    demonstrate the integrity of your case evidence. When imaging a drive, a hash
    generated by FTK Imager may be used to verify that the image hash and the drive
    hash match after the image is formed, and that the image has not changed after
    acquisition.


