  md: '# 4.5 Logging


    Data privacy and protection is an essential part of security however it is similarly
    important to guarantee accessibility of administrations. As an admin and security
    professional, one should guarantee that everything works fine, and it one''s responsibility
    for detecting anomalous behavior and degradation in time constraints. Checking
    and logging programming assumes a key job in this part of security, providing
    knowledge into what is going on the system and the network.


    # 4.5.1 Logcheck


    Logcheck is a program that monitors logs every hour by default and sends unusual
    log messages for further review to the administrator.


    The list of monitored files is stored in /etc/logcheck/logcheck.files. The default
    values work if the /etc/syslog.conf file has not been completely overhauled.


    Paranoid, server, and workstation are the three different levels that Logcheck
    can report.


    Paranoid mode should perhaps be limited to certain servers like firewalls. Server
    mode is default mode and recommended. Workstation mode is for workstations which
    is extremely concise.


    Logcheck should be customizable for excluding few extra messages (for easy briefing).


    /usr/share/doc/ logcheck-database/README.logcheck-database.gz is a required albeit
    a challenging read.


    The applied rules can be split into several types:


    +   * Those that succeed a message as a cracking effort (will be stored in a file
    in the /etc/logcheck/cracking.d/ directory)

    * Logs of ignored crack attempts (/etc/logcheck/cracking.ignore/)

    * Categorizing a message as a security alert (/etc/logcheck/violations.d/)

    * Logs of ignored security alerts (/etc/logcheck/violations.ignore/)

    * Applying to all the remaining messages (considered as system events).'
