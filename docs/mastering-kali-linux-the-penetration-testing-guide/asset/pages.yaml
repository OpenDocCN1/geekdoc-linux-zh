  md: '# Stager


    Stager payloads work in conjunction with stage payloads to perform a particular
    task. Stager creates a communication channel between the attacker and the victim
    and reads for execution on the remote host in a stage payload.


    # Meterpreter


    Meterpreter, Meta-Interpreter''s short form is an advanced, multifaceted payload
    which operates via dll injection. The Meterpreter remains solely in the remote
    host memory and leaves no traces on the hard drive, making it very hard to locate
    with traditional forensics techniques. Scripts and plugins can be dynamically
    loaded and unloaded as required and the development of Meterpreter is very strong
    and is constantly.


    # PassiveX


    PassiveX is a payload which can help circumvent restrictive outbound firewalls.
    It does this by building a hidden Internet explorer using an ActiveX control it
    communicates with the attacker via HTTP requests and responses using the new ActiveX
    control.


    # NoNX


    The NX (No Execute) bit is a feature that is built into some CPUs to prevent executing
    code in certain memory areas. NX is implemented in Windows as a Prevention of
    Data Execution (DEP). The Metasploit NoNX payload is designed to circumvent DEP.


    # Ord


    Ordinal payloads are payloads based on Windows loaders, with distinct advantages
    and disadvantages. The advantages of working on any Windows flavor and dating
    back to Windows 9x without explicit return address definition. They are extremely
    small, too. Two rarer common disadvantages, however, do not make them the default
    option. The first is that it relies on the fact that ws32.dll is loaded before
    exploitation in the process being used. The second is it is a little less stable
    than the other stagers.


    # IPv6


    As the name indicates, the Metasploit IPv6 payloads are designed to operate over
    IPv6 networks.


    # Reflective DLL injection


    Reflective DLL Injection is a technique by which a stage payload is injected into
    a memory-running, compromised process that never reaches the hard drive. By the
    VNC and Meterpreter payloads use reflective DLL injection. You can learn more
    about this from the creator of reflective DLL injection method Stephen Fewer.'
