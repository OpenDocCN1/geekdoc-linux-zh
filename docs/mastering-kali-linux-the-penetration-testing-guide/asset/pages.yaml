  md: '# 12.1.3 Types of Wireless Network


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_283_0.png)


    The main types of wireless networks are as following:


    +   - Personal Area Network (WPAN) connects devices located in the close area
    of a person. WPANs are short-range networks that make use of Bluetooth. They are
    typically used to interconnect compatible devices, such as a desk, near a central
    location. A WPAN has a typical 30-foot-range.


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_283_1.png)'
  merge: -1
  pgno: 283
- img_proc: true
  md: 'Local Area network (WLAN) provides communication of two or more devices using
    an access points to the Internet. WLAN is a wireless network, utilizing radio
    waves. Cables are generally used by the backbone network, with one or more wireless
    access points linking wireless users to the wired network. WLAN coverage can be
    everywhere from a single room to a whole campus.


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_284_0.png)


    Metropolitan Area Network (MAN), connects several local networks, A wireless MAN,
    or WOM, is a fixed wireless installation that interconnects buildings or locations.


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_284_1.png)'
  merge: -1
  pgno: 284
- img_proc: true
  md: 'Wide Area Network (WWAN) covers a large area such as cities and nearby towns
    and settlements. WWANs are generated by using mobile phone signals typically provided
    by different mobile (cellular) service providers and managed by them such as 2G,
    2.5G, 3G, and 4G. Even when removed from other means of network access, WWANs
    can provide a way of staying connected.


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_285_0.png)


    | Abbreviation | Name | Example | Distance |

    | --- | --- | --- | --- |

