    that hackers'' dictionaries and rainbow tables must recognize the hash of your
    password to successfully crack it.


    +   - The hacking community does not have every possible password hashed, so the
    key to not falling prey to a dictionary or rainbow table attack is to ensure that
    you do not use passwords that would be common or short enough (10 characters or
    less) to end up in a hackers'' dictionary or rainbow table. To stay ahead of the
    curve, having passwords of twelve characters or more in length will help to keep
    your password safe against these types of attacks.'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Secbay Press


    +   - System administrators should configure systems to use "salt" in the hashing
    process. Applying a salt value to the password hashing process results in totally
    different hashes being generated. That would mean that any hackers'' dictionary
    or rainbow table that is based on no salt or a different salt value would be rendered
    useless to someone trying to crack our passwords.


    +   - We must do all we can to prevent a malicious individual from downloading
    password hashes from our systems, i.e., strong anti-virus protection, timely software
    updates, strong passwords especially for administrator accounts, etc.


    +   - System designers should consider incorporating more than one factor to authenticate
    users, i.e., what you know (a password/PIN), what you have (a physical token),
    what you are (biometrics).


    # Summary


    +   - Password attacks are attacks in contradiction of the authentication of a
    service. These outbreaks are frequently cracked into online password attacks and
    disconnected password attacks, which we will find replicated in Password Attacks
    menu group. In online password attacks, multiple attempts are made against a live
    system. In offline password attack, encrypted values of the passwords are found,
    and the attacker tries to obtain plain text.


    +   - Their various types of attacks mode for effective password recoveries. Brute
    Force, Combinator attack, Toggle-case attack, Hybrid attack, Fingerprint attack,
    Permutation attack, Dictionary attack, Mask attack, Rule- based attack Table Lookup
    attack, etc.'
