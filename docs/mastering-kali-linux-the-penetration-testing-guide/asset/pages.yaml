    # 14.2 Kali Linux Purple


    Over the years, we have perfected what we have specialized in, offensive security.
    We are now starting into a new area, defensive security! We are doing an initial
    preview launch of "Kali Purple". This is still in its infancy and is going to
    need time to mature. But you can start to see the direction Kali is expanding
    into. You can also be a part of helping to shape the direction!


    Kali Purple is the one stop shop for Blue and Purple Teams


