    managed for more.


    # Nmap Reference Guide


    | NMAP(1) | |

    |---|---|

    | nmap | Network exploration and security / port scanner |

    | SYMSCAN | -S [Scan type] [target specification] |

    | DESCRIPTION | -S is a SYN scan for network exploration and security auditing.
    Nmap is designed to scan large networks, although it works fine against single
    hosts. Nmap uses IP packets in order to determine what hosts are online, what
    ports are open, and what services are running on those ports. Nmap can detect
    OS (OS versions) they are running, and perform for fire fire detection, version
    detection, and script scanning. Nmap is used for a variety of tasks such as network
    inventory, managing service upgrade schedules, and monitoring host or service
    uptime.


    When Nmap scans a target, it produces a summary of results. The key information
    is contained in the "interesting ports" table. That table lists the port number,
    service, name, and state of each port. If a port is open, Nmap also attempts to
    determine what application is running on that port, as well as the version of
    the service. By blocking the port that Nmap cannot tell whether it is open or
    closed. Closed ports have no application listing on them. Filtered ports are blocked
    by a firewall or packet filter. Nmap reports whether the port is open or filtered.
    Nmap can also be used to detect vulnerabilities using the Nmap Script Engine (NSE).
    Scripts include software vulnerabilities. Nmap provides information about hosts
    when IP protocol scan is requested (-s). Nmap provides


    Figure 58 Useful Flags


    # -S


    The -S flag is the default scanning flag for Nmap. It specifies what Nmap will
    scan. Even though it''s default, probably a good idea to identify it. This is
    also called a syn scan or a stealth scan which doesn''t establish a tcp connection
    (three-way handshake).


    # -T


    It may be critical to timing. The speed of the scan not only determines how long
    it will take to scan, but it can also be instrumental in triggering or avoiding
    firewalls and other device safeguards. While Nmap provides more fine-grained timing
    control, it provides the -T flag with a set of six pre-configured templates. These
    range from 0 to 5, with 0 being the slowest and least invasive and 5 the fastest
    and most aggressive. -T is the default timing flag, but many users prefer -T4
    to up the scan.


