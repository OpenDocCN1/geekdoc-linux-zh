  md: '# 3.3.4 Connection Type and Client Authentication


    PostgreSQL tunes for approaching connection in two different ways:

    - on TCP port 5432 of the localhost interface

    - on record based attachment /var/run/postgresql/s.PGSQL5432.

    This can be arranged in postgresql.conf with different mandates: listen_addresses
    for the addresses to tune in, for the TCP port, and unix_socket_directories to
