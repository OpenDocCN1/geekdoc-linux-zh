    # ## 4.7.2 Subsets of IDS


    There is also subset of IDS types. The most common variants are based on signature
    detection and anomaly detection.


    +   1. **Signature-based IDS**: Detects potential threats by looking for certain
    patterns in network data, such as byte sequences, or known dangerous instructions
    used by malware. The term "signature" comes from antivirus software, which refers
    to the patterns that are identified as signatures. Although signature-based IDS
    may readily detect attacks, new assaults for which no pattern exists are to detect.


    +   2. **Anomaly-based**: A modern technology that detects and adapts to unknown
    assaults, owing to the proliferation of malware. This detection approach uses
    machine learning to construct a specified model of trustworthy behavior, which
    is compared against fresh behavior. This method allows for the identification
    of previously undiscovered assaults, it is susceptible to false positives, in
    which previously unknown legal behavior is mistakenly labeled as harmful.


