    +   1. Host based Intrusion Detection System

    2. Network based Intrusion Detection System


    # 4.7.1.1 HIDS (Host based Intrusion Detection System)


    A host-based intrusion detection system (HIDS) is a system that is capable of
    monitoring and analyzing the insides of a computing system and the network packets
    on the network interfaces. The first type of intrusion detection software to be
    designed, keeping original target system being the system computer where outside
    interaction shall be infrequent.


