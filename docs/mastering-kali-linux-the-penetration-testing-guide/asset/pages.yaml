  md: '# Secbay Press


    Let me explain the command, -w is for writing into a file that we are going to
    create i.e. mtl-org, -c is used for channel 4.


    Now after typing the command wait for 10-15 minutes to capture around 15,000 IVs
    packets. The time duration depends on the traffic on the network, your distance
    from the access point and the no. of IVs you have captured (refer to the next
    image).


    If, here are only few packets coming then you can try to death to generate more
    data packets with following command:


