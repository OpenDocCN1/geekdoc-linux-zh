    # 11.6 Rainbow Table


    A rainbow table is a pre-computed table that can be used to reverse cryptographic
    hash functions, typically to crack password hashes. Tables are generally used
    to recover a password that consists of a restricted set of characters up to a
    certain length.


    What exactly does a rainbow table have well basically a rainbow table just put
    of hashes. Those are represented by a different algorithm. So this is a table
    of hashes encoded by a given algorithm. It could, for example, encoded with base64.
    That''s a simple example.


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_267_0.png)


    # Rainbow Table


    ```

    aaaa 19330d1d

    qwer da09d7dc

    ```


    So what happening, the tables are hashed and then the tables are a hash of words
    stored in the table. So rainbow tables are used to crack harder and more complex
    hashes. We''re going to use rainbow crack being the package. Rainbow generating
    rainbow tables. Those rainbow tables use a dictionary attack.


    Rainbow table generates the password guessing based on the parameters. If the
    word does not exist in the word list then you''re not going to get the password.
    If that in the case of dictionary attacks, it''s going to go through random combinations
    of the different characters of hashed by the algorithm. it is extremely important
    in the scope of a penetration test. Especially when you talk about password cracking,
    we use the syntax RTGEN'
