    as SSH, PostgreSQL, and Apache) work and how to set them up.


    # 3.3.1 Configuring SSH for Remote Login


    SSH stands for Secure Shell which allows users to remotely login, execute commands
    and/or securely transfer files from one system to another.


    By default, the SSH server package is installed, the SSH service is disabled by
    default and is not started at boot time. The SSH service can be started using
    the following command: systemctl start ssh. We can also manually configure the
    SSH to start during the pc''s boot, using the following command: systemctl enable
    ssh. We can use the command to apply new settings to the SSH: systemctl reload
    ssh.


    > By default, the SSH service listens on port 22 but this can change with the
    Port Directive.


    Every server has its own cryptographic keys. They are referred to as "SSH host
    keys" and stored in /etc/ssh/ssh_host *. If you want confidentiality, they must
    be kept private and should not be shared by multiple machines.


    By copying full disk image (instead of Debian installer) when you install your
    program, the image can contain pre-generated SSH keys that you should replace
    with newly generated keys. The image originally came with a default root password
    that you would like to reset simultaneously. You can do all this with the following
    commands:


    ```

    # password

    # rm /etc/ssh/ssh_host_*

    # dpkg-reconfigure openssh-server

    # service ssh restart

    ```'
