    # 10.2 ARP POISONING


    Unlike devices on the internet, LAN devices do not interact directly with IP addresses.
    In local IPv4 networks, they instead employ physical hardware addresses for addressing.
    These MAC addresses (Media Access Control) are 48-bit identifiers that allow each
    device in the LAN to be identified via its network card.


    Example of a MAC address: 00-80-41-ae-fd-7e


    MAC addresses are issued by hardware manufacturers and are unique globally. In
    theory, these hardware addresses may be used for global addressing. In reality,
    this does not work IPv4 networks are too small to map the MAC address. Address
    resolution through ARP is inevitable in IPv4 networks.


    If Computer A wishes to communicate with Computer B on the same network, it must
    first identify the correct MAC address for its IP address. This employs the Address
    Resolution Protocol (ARP), a network protocol that follows the request response
    methodology.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Secbay Press


    After locating the correct MAC address, Computer A sends a broadcast request (or
    ARP request) to all network devices. The following information is included in
    this request:


    A computer with the MAC address xx-xx-xx-xx-xx and the IP address yyy.yyy.yyy
    wants to communicate with a computer with the IP address zzz.zzz.zzz.zzz and needs
    the proper MAC address.


    All machines on the LAN get the ARP request. Every computer in the network conducts
    a local table called the ARP cache to prevent an ARP request from being sent prior
    to the transmission of each data packet. All known MAC addresses are temporarily
    maintained in these tables, along their corresponding IP addresses.


    As a result, the broadcast request, and all the associated sender address, is
    recorded by all computers on the network. Computer B is anticipated to respond
    to the broadcast request. Its ARP response includes the following information:


    This is the system with the IP address zzz.zzz.zzz.zzz.zzz.zzz.zzz.zzz.z The desired
    MAC address is aa-aa-aa-aa-aa-aa-aa-aa-aa-aa


    If ARP response is provided to Computer A, it contains all of the information
    to transmit data packets to Computer B. Nothing can impede communication across
    the local network.


    What if the target does not respond, but the response comes from another device
    controlled by an inside attacker with criminal intent? Here''s where ARP spoofing
    comes in handy.


    # 10.21 ARP spoofing


    The request response system of ARP protocols is set in such a way that the first
    response to an ARP request is accepted and saved. In the context of ARP spoofing,
    hackers attempt to preempt the real target computer to send an erroneous reply
    packet and alter the querying machine''s ARP table. This is known as ARP poisoning
    or "infection" of the ARP caches. These data packets often contain the MAC address
    of a network device under hacker control. The targeted system then associates
    the output with the incorrect address and routes all data packets to the hacker-controlled
    machine. This technology now has the capability of recording and manipulating
    all data traffic.


    To avoid detection, intercepted data traffic is typically forwarded to the real
    target system. A hacker is then transformed into a guy in the center. ARP spoofing
    can cause a denial of service if captured data are not routed but instead discarded
    (DoS). ARP spoofing may be used in both LAN and WLAN settings. Wireless network
    encryption using Wi-Fi Protected Access (WPA) provides no safety. All linked devices
    in local IPv4 networks must resolve MAC addresses — which can only be done via
    ARP.


    Cain& is a well-known piece of malware that particularly targets broadcast requests
    and answers bogus ARP responses. A hacker does not have to wait on ARP queries
    to "contaminate" a network''s ARP cache. Another technique is to constantly flood
    the network with bogus ARP responses. While most systems discard packets that
    cannot be attributed to a request, this changes when a computer on the LAN initiates
    an ARP request and therefore expects a response. Depending on the


