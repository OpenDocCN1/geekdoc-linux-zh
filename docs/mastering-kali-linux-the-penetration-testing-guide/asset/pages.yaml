    # 9.6 Directory listing


    Web servers can be designed to list the substance of catalogs which do not have
    a record page presence. This can support an attacker by enabling them to easily
    identify the assets in each way, and to continue to break down and attack those
    assets. Directory listing is a web server feature that displays a list of all
    the files in each website directory there is no index file, such as index.php
    and default.as.


    For example, if a user request www.abc.com without specifying a file, this request
    will be processed by the web server and the index file for directory returned
    and the actual website appears. If the index file does not exist, the web server
    must return a list of a directory''s contents. This function can be parallel to
    the command line directory listing in operating systems, such as ''ls'' on Unix
    and Linux systems and ''dir'' on Windows. It should also be noted that the Directory
    Listing could be caused by using special requests to exploit any software vulnerabilities.


