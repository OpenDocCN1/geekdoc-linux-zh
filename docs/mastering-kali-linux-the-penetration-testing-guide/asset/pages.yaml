  md: '# 12.1.1 Wireless Operating Mode


    There are several kinds of devices, including wireless adapters and access points
    that can be used to build a Wi-Fi wireless network.


    Wireless adapters, or Network Interface Controllers (NICs in short), are 802.11
    standard network cards that allow a computer to connect to a wireless network.
    Wi-Fi adapters are available in a wide variety of formats, including PCI cards,
    PCMCIA cards, USB adapters and CompactFlash. A station is any device which has
    a card like this.


    Access points, also known as APs or hotspots, allow nearby Wi-Fi-equipped stations
    to access a wired network that directly connects to the access point.


    The IEEE 802.11 standards specify two operating modes: Infrastructure mode and
    ad hoc mode.


    Infrastructure mode, computers with wireless network adapters, also known as wireless
    clients, are connected to an existing wired network with the aid of a wireless
    router or access point. In this mode the 2 examples I have listed above work.


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_280_0.png)'
