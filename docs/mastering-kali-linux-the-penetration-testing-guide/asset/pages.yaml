  md: '# Answers to Chapter Review Questions


    1. Answer: C


    Explanation: LAMP stands for Linux, Apache, MySQL, PHP. It represents a common
    software stack used for hosting dynamic websites and web applications. Therefore,
    option C is correct.


    2. Answer: A


    Explanation: IIS (Internet Information Services) is a web server software created
    by Microsoft and is only available for Windows operating systems. Therefore, option
    A is correct.


    3. Answer: C


    Explanation: Elasticsearch is not typically considered a component of a web server.
    It is a separate search and analytics engine used for indexing and searching data.
    Therefore, option C is correct.


    4. Answer: D


    Explanation: The default port for the Apache web server is port 80 for HTTP traffic.
    Therefore, option D is correct.


    5. Answer: B


    Explanation: The correct command to start the Apache web server in most Linux
    distributions, including Kali Linux, is "service apache2 start". Therefore, option
    B is correct.


    6. Answer: D


    Explanation: The correct command to check the status of the Apache web server
    in Kali Linux is "service apache2 status". Therefore, option D is correct.


    7. Answer: A


