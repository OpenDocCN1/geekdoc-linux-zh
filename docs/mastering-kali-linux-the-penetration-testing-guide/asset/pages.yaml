  md: '# 13.3 How to back up your android device''s data using ADB


    +   1. Plug your Android device into your computer

    2. Using either Command Prompt or Terminal, navigate to the folder in which the
    ADB tools are located and type in "ADB \ A pop-up on the Android device will appear
    if you need to grant your computer permission to interact with the phone or tablet.
    You will know if the command worked on your computer if it returns with the connected
    device''s identification number

    3. Type in "adb backup -apk -shared -f <filepath>/backup.ab"

    4. Your Android device will now show the full backup window. Here you can encrypt
    your backup with a password (which is recommended)

    5. Tap on Back up my data.

    6. This process can take several minutes and when completed, a new file will be
    placed on your computer.


    # 13.4 How to restore your Android device''s data using ADB


    +   1. Plug your Android device into your computer

    2. Using either Command Prompt or Terminal, navigate to the folder in which the
    ADB tools are located and type in "ADB devices". A pop-up on the Android device
    will appear if you need to grant your computer permission to interact with the
    phone or tablet. You will know if the command worked on your computer if it returns
    with the connected device''s identification number

    3. Type in "adb restore <filepath>/backup.ab"

    4. Your Android device will now show the full restore window. If you added a password
    to your backup file, enter it in the space given

    5. Tap on Restore my data.

    6. This process can take several minutes and when completed, if not all your previously
    installed applications will be present on your device as well as photos and other
    data.


