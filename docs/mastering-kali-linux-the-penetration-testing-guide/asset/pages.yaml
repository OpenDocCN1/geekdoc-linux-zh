    # 10.7 OS X Exploits


    OS X may be considered Apple''s desktop OS magnum work, but its vulnerability
    has not been lacking (1,250 to date per the CVE database).


    # 10.7.1 Vulnerability


    CVE-2014-4431


    Dock handles screen-lock status in versions of Apple OS X before 10.10. This might
    allow attackers to reach an unexpected workstation in physical proximity. This
    issue is not present in recent versions of OS X and upgrades to a later version
    remedy the vulnerability efficiently.


    # 10.7.2 Mail Vulnerability


    CVE-2014-4431


    Mail versions before 10.10 do not acknowledge that the recipient''s message has
    been properly removed. Remote attackers might get sensitive information if they
    read a communication exclusively meant for other recipients.


    # 10.7.3 Security-Keychain Vulnerability


    CVE-2014-1380


    In OS versions before 10.9.4, the security keychain component does not correctly
    support keystroke observers. This could enable nearby attackers to bypass the
    screen lock protection system and insert characters via the keyboard input into
    an arbitrary window under the lock window. This vulnerability is successfully
    addressed by upgrading to version 10.11 or later.


    # 10.7.4 LaunchServices Vulnerability


    CVE-2015-1142


    Before 10.10.3, LaunchServices in OS X may allow local attackers, through specifically
    crafted localization data, to cause denial-of-service crash.'
