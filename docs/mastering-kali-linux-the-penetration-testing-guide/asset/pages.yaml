  md: '# Secbay Press


    ![](img/8ce6ad080bbaee4f5508e48ea7a3d6ee_63_0.png)


    Unlike other systems Linux only has one such hierarchy. It can combine multidisks
    data, and one of those disks be the root. The Linux command – mount – is obtainable
    beneath the mount points for mounting directories in the hierarchy and other disks,
    which enables users to keep home directories (traditionally located inside /home/)
    on a discrete hard disk containing the root directory (with other home directories
    of users). The disk has been mounted on the /home/directories, paths such as /home
    / root / Downloads / hello.txt are kept active at the same locations.


    There are several file systems formats similar to the many ways to physically
    save data on disks. While there are others, the commonly known ones are ext2,
    ext3 and ext4; for instance, VFAT is the file system used by the operating systems
    of DOS and Windows. The reinforcement of Linux for VFAT also allows hard disks
    to be available under both Kali and Windows. Before you can mount it (formatting)
    a file system must be prepared on a disk.


    mkfs stands for Make Filesystem, that is used to handle formatting. This operation
    is damaging and should be run only on one occasion, except when you want to distribute
    a filesystem or start afresh.


    Additionally, there are organized filesystems such as NFS, which do not store
    information on a local disk. Alternatively, information is transmitted to a server
    through which the system stores and retrieves it requested.


    Due to the reflection of the read framework, you don''t have to stress how this
    disk is associated, and the documents remain open in their typical way.


