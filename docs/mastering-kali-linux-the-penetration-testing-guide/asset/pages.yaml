    ```


    Figure 52 Whois Lookup


    # Finding the domain name registration


    While registering a domain, the domain registrar gathers additional information
    about the registrant. This information is normally available for public access.
    The general steps are:


    +   - Querying the InterNIC website to find the registrar associated with a domain.
    Normally InterNIC performs a Whois lookup and provides the result.

    - The attacker then queries the registrar''s Whois database to get the registration
    information.


    # 7.0.2 Finding the IP address range


    The attacker needs to find the IP addresses associated with an organization. For
    this he queries the organization''s name against the Whois database of an appropriate
    Regional Internet Registry (RIR). There are five RIR each associated with a specific
    geographic location:


    +   - APNIC (Asia-Pacific region)

    - ARIN (North America)

    - LACNIC (Latin America and Caribbean)

    - RIPE (Europe, Central Asia, Middle East regions)

    - AfriNIC (Africa)


    Secbay Press 146 | Page'
