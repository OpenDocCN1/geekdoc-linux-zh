  md: '# 2.3.10 locate


    Locate command is used to find file. It acts as an alternative to the search feature
    in Windows Operating Systems. It is not always installed by default in all Linux
    distributions.


    Each time you search for file using locate command, it searches for the file name
    from the updated Access Control List (ACL) which consists of all file name and
    permissions, and hence giving fast results.


    Syntax: locate [options] search string.


    # 2.3.11 echo


    Echo command is used in scripts, batch files, and as part of individual commands;
    anywhere you may need to insert text.


    Syntax: echo [SHORT-OPTION] [STRING]


    +   -n Do not output a trailing newline.

    -e Enable interpretation of backslash escape sequences (see below for a list of
    these).

    -E Disable interpretation of backslash escape sequences (this is the default).

    --help Display a help message and exit.

    --version Output version information and exit.

    \\ A literal backslash character (").\n-a An alert (the BELL character).

    -b Backspace

    -c Produce no further output after this.

    -e The escape character; equivalent to pressing the escape key.

    -f A form feed.

    -n A newline.

    -r A carriage return

    -t A horizontal tab.

    -v A vertical tab.


    # 2.3.12 cat


    Cat command is used to preview the file without opening the file. Using cat command,
    you can even add few lines to the top and bottom of the file. You can use cat
    to add the output into a new file; cat stands for *concatenate*. Cat command reads
    the file and displays the file content on the terminal. Cat can also output multiple
    files.


    Syntax: cat [OPTION] [FILE]


    +   -E show ends. Display "$\$ at end of line.

    -n number all output lines.

    -s Suppress repeated output lines.'
