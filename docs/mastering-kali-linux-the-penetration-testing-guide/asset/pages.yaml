  md: '10. Network based vulnerability scan can detect both wired and wireless vulnerabilities


    A. True


    B. False


    C. Sometimes false


    D. None of the above


    # Answers to Chapter Review Questions


    1. Answer: A


    Explanation: Penetration testing (pen-testing) is not an unintentional attack;
    it is a deliberate and authorized attempt to evaluate the security of a system
    or network. Therefore, option A is the wrong statement.


    2. Answer: A & D


    Explanation: Penetration testing indeed can evaluate the security of a system
    or network (option A) and determines critical vulnerabilities (option D). Therefore,
    options A and D are correct.


    3. Answer: C


    Explanation: Code reviews are essential for organizations to be compliant with
    certain ISOs or other certification bodies. Regular code reviews help ensure that
    software development practices align with security standards and best practices,
    contributing to compliance requirements. Therefore, option C is correct.


    4. Answer: C and D


    Explanation: The disadvantages of manual testing include that it does not cover
    the entire system (option C) and it tends to be slow (option D). Therefore, options
    C and D are correct.


    5. Answer: B and D


    Explanation: The merits of manual testing include accuracy (option B) and familiarity
    with new threats (option D). Therefore, options B and D are correct.


    6. Answer: D


    Explanation: Common Vulnerabilities and Exposures (CVE) is a dictionary of common
    names for publicly known information security vulnerabilities. Therefore, option
    D is correct.'
