  md: '# 12.1.2 Advantages & disadvantages of Wireless Networks


    | Advantages | Disadvantages |

    | --- | --- |

    | Better mobility | Lesser range |

    | Mobility is a great advantage offered by wireless networks, especially for businesses.
    It enables you to access the server from anywhere in the office | Normally, the
    range of a medium-range wireless network is up to around 100 meters. This may
    be suitable for a home or a small office, but insufficient for larger structures.

    | Cost effective. | Security issues |

    | Compared to wired network, wireless network is cost effective because it requires
    no cables and other addresses to connect | Security is a major concern in any
    form of communication. Wireless networks involve the risk of modification and
    eavesdropping. So, they may use of certain encryption techniques for security.
    |


    VOIP facility

    VOIP or voice over internet protocol facility is available with wireless networks.
    It is a phone service using the internet which is very reasonable when compared
    to traditional telephone service.


    Reliability

    Since wireless networks work with radio communication, the signal is affected
    by much interference. It is also subjected to certain propagation effects.


    Scalability

    Expanding a wired network can be costly and difficult with adding new cables and
    rerouting the existing ones. But expansion with wireless is pretty easy


    Less speed

    The maximum speed of 802.11n network is 600Mbps. This is only half the speed of
    a wired network. Same is the case with all the wireless networks.


    > Table 4 Advantages & disadvantages of Wireless Networks'
