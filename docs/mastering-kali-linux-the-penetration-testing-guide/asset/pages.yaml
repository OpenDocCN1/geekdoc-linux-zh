    # 4.7 IDS (Intrusion Detection System)


    An intrusion detection system (IDS) is a hardware or software program that looks
    for malicious activity or policy breaches on a network. A security information
    and event management system are generally used to report or guard any harmful
    activity or violation. Some IDSs can respond to intrusions as they are discovered.
    They are called Intrusion prevention systems (IPS).


