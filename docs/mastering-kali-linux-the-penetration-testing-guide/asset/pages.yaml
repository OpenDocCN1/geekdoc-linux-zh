    # 8.4 JoomScan


    A vulnerability scanner is an open-source project developed to automate the vulnerability
    detection process for deployments in Joomla. Written in Perl, it makes it possible
    to scan Joomla installations seamlessly and easily, leaving a minimum footprint
    with its modular architecture. It detects known vulnerabilities in the offensive
    but can also detect many misconfigurations and weaknesses at the administrative
    level that adversaries can exploit to compromise the system. JoomScan provides
    a simple interface and compiles the final reports in either text or html format.


    # 8.4.1 Features of Joomscan:


