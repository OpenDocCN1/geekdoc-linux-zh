  md: '# CHAPTER 2


    # Linux Fundamentals


    # 2.0 Linux Fundamentals


    Kali Linux is an open-source OS built around the Linux kernel. Linux is usually
    packaged in a form known as a Linux distribution (or distro for short) for both
    desktop and server use. The Linux kernel is the fundamental part of a Linux distribution.
    The Free Software Foundation uses the name GNU/Linux to refer to the family of
    operating systems and to specific distributions.


    Linux was originally developed on the Intel x86 architecture for personal computers
    but has since been ported to more platforms than any other operating system. Linux
    has the largest base of general-purpose operating systems due to the popularity
    of the Linux-based Android OS on smartphones.


    Arch Linux, CentOS, Debian, Fedora, Gentoo Linux, Linux Mint, Mageia, openSUSE
    and Ubuntu are some of the most popular and mainstream Linux distributions, along
    with commercial distributions intended to run on servers as Red Hat Enterprise
    Linux and SUSE Linux Enterprise Server. Distributions intended for servers omit
    all standard installation graphical environments and may include other software
    to set up and operate a solution stack such as LAMP instead. As Linux can be freely
    redistributed anyone can create a distribution for any intended use.


    # 2.1 Unifying File Systems


    File systems within the kernel play a vital role. Unix-related systems maintain
    a single hierarchy by merging all file stores, allowing users and applications
    to access data by knowing their hierarchical address.


    This hierarchy''s initial point is called the root, represented by the character
    "/". This directory contains subdirectories named after them. The home directory
    "/" is called "home/, for example. This subdirectory, and so on, can contain other
    subdirectories. Directories, where data is stored, may also contain files. Therefore,
    /home / root / Downloads / hello.txt refers to a file named hello.txt stored in
    Downloads subdirectory of the home directory, which is present in the root. The
    kernel helps translate the naming and disk storage addresses.'
