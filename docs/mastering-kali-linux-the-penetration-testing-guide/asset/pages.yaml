    # 12.10 Mobile Security Threats


    Threats to mobile device security are on the rise. Kaspersky discovered about
    3.5 million pieces of malware on over 1 million consumer devices in 2014. Kaspersky''s
    in-lab detection algorithms processed 360,000 suspicious files by 2017. And 78%
    of the files were malware programs, implying that approximately 280,000 malware
    files were discovered every day, many of targeted mobile devices. Here are the
    top seven mobile device risks, as well as what the future holds.


    # 1) Data Breach


    Unintentional data leaking is frequently caused by mobile apps. For example, "riskware"
    apps represent a significant risk to mobile users who have extensive access but
    do not necessarily verify security. These are generally free programs available
    in legitimate app stores that work as described but also transfer personal—and
    possibly corporate—data to a distant server, where it is mined by advertising
    and, in some cases, hackers.


    # 2) Unsecured Wi-Fi


    Nobody wants to use up their data when there are free Wi-Fi hotspots available—but
    free Wi-Fi networks are typically insecure. Three British lawmakers volunteered
    to participate in a free wireless security experiment were hacked by technical
    specialists, according to V3. Their social networking accounts, PayPal accounts,
    and even VoIP chats were hacked. To be safe, use free Wi-Fi on your mobile device
    sparsely. Furthermore, never use it to get access to private or personal services,
    such as banking or credit card information.


    # 3) Network Spoofing


    When hackers put up phony access points—connections that seem like Wi-Fi networks
    but are traps—in high-traffic places like coffee shops, libraries, and airports,
    they are engaging in network spoofing. To entice people to connect, cybercriminals
    offer access points popular names such as "Free Airport Wi-Fi" or "Coffeehouse."


    # 4) Phishing Attacks


    Because mobile devices are always turned on, they are on the front lines of most
    phishing attacks. Mobile users, according to CSO, are especially exposed since
    they frequently check their email in real-time, and reading emails as they arrive.
    Email apps on mobile devices are even more vulnerable since they offer less information
    to fit the smaller screen sizes. For example, when an email may only show the
    sender''s name until the header bar is expanded. Never click on unknown email
    links. And, if the situation isn''t urgent, leave the answer or action items until
    you get to your computer.


    # 5) Spyware


    Although many mobile users are concerned about malware sending data streams to
    hackers, there is a more local threat: Spyware. In many situations, consumers
    should be concerned about spyware deployed by spouses, coworkers, or employees
    to track their movements and activities rather than malware from unknown attackers.
    Many of these applications, also known as stalkware, are meant to be installed
    on the target''s smartphone without their knowledge or consent. A complete antivirus
    and malware detection suite should employ specific scanning algorithms for this
