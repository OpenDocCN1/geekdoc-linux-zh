    Figure 3.2: LAN-based backup.


    To estimate the disk space required for the image database portion of the NetBackup
    catalog:


    +   1. Estimate the maximum number of files that each schedule backs up during
    a single backup of all its clients.


    +   2. Determine the frequency and retention period of the full and incremental
    backups for each policy.


    +   3. Use the information from Steps 1 and 2 to calculate the maximum number
    of files that exist at any given time.


    Assume you schedule full backups every seven days with a retention period of four
    weeks and differential incremental backups daily with a retention period of one
    week. The number of file paths must allow space for four times the number of files
    in a full backup plus one week''s worth of increments.


    The following formula expresses the maximum number of files that can exist at
    any given time for each type of backup (daily, weekly, etc.):


    Files per Backup × Backups per Retention Period = Maximum Number of Files


    If a daily incremental schedule backs up 1200 files for all its clients and the
    retention period is seven days, the maximum number of files resulting from these
    increments can exist at one time as follows:


    1200 × 7 days = 8400


    If a weekly full backup backs up 3000 files for all its clients and the retention
    period is four weeks, the maximum number of files due to weekly full backups that
    can exist at one time as follows:


    3000 × 4 weeks = 12,000


    Obtain the total for a server by adding the maximum files for all the schedules
    together. The maximum number of files that can exist at one time due to the preceding
    two schedules is the sum of the totals, which is 20,400.


    Note For policies that collect true image restore, an incremental backup collects
    catalog information on all files (if it was a full backup). The preceding calculation
    for the incremental from 1200 × 7 = 8400 to 3000 × 7 = 21,000. After adding 12,000
    for the fulls, the total for the two schedules is 33,000, rather than 20,400.'
