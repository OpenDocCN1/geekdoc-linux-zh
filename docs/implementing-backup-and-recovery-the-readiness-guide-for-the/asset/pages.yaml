    # # Volumes


    Now that we have configured the physical devices, we need to define some storage
    media to be used for the backups. The physical cartridges are called tapes, media,
    or volumes. When we discuss them within NetBackup Media Manager, they are referred
    to as volumes. These are the actual tapes will be used to hold the data that is
    backed up. When you have configured one or robotic devices, you can use the Volume
    Configuration Wizard. An easy way to proceed, at least for the first time, is
    to use this tool and inventory the robotic libraries. If you are not using a library
    or have media without barcodes, you can use the Volume Configuration Wizard, but
    you would use the ''Create new volumes for in standalone drives'' option.


    As shown in Figure 5.19, any robots you have defined will show up in the screen,
    and you can select the one you want to inventory.


    Once you have made your selection, the wizard returns the list of actions that
    are required. This can include new volumes to be added to the database, volumes
    that the database shows as being in the library but the robot indicates are not
    present, and volumes that are in different slots. When you select Next, the volume
    database is updated to match the robot inventory. This is shown in Figure 5.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_71_1.png)


    Figure 5.19: Volume Configuration Wizard.'
