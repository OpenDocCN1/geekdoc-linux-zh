  md: '# Real-Time Backup


    Real-time backup is another feature that combines different technologies. Here
    data is backed up (or replicated) as changes, resulting in continuous backups.
    The data is replicated to a second host and then backed up from the second (target)
    host. This moves the backup burden to the target system for a steady impact on
    the source system and network. Real-time backup also offers you the opportunity
    to create versions based on more system-based events. Markers would be used in
    the log to synchronize the state and checkpoints with quiescence. Some solutions
    today sit at the application layer, above the cache, and will replicate changes
    incrementally across the entire filesystem. These software solutions provide a
    higher level of protection in the event of a failure, so the replication must
    be committed before the actual source information is committed.


    # Backup and Replication


    Backup of a filesystem is typically accomplished by copying files from the source
    hard disk across the network to server hosting drives. The backup system would
    need to ''walk'' the filesystem to accomplish its task. The frequency of the backups
    is governed by practical considerations such as network impact, system impact,
    and available media. On the other hand, remote replication seeks to copy these
    changes to a remote location for safekeeping. Some solutions do a full file copy,
    block changes, or simply incremental or delta changes of a file when they sense
    a file change. The remote replica can be utilized for disaster recovery in the
    case of major physical damage to the primary filesystem. Data protection in this
    scenario occurs in real time as objects change. Its use is governed by network
    impact, available replica storage, and overhead on the server. Figure 10.2 is
    an example of a real-time backup configuration.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_158_0.png)


    What if we replicate only the block changes? Well, that''s being done today, with
    VERITAS Volume Replicator, FalconStorIPS, EMC, Hitachi, and other solutions. What
    if we were able to back up only those changes for infinite recovery level based
    on the retention of these blocks written to tape, as shown Figure 10.2? Taking
    the block-level replication to the next level may include an option to integrate
    with the backup software that allows only these incremental changes to be written
    to tape, either continuously or scheduled. In the future, we may have the ability
    to recover a particular file from a particular point in time from blocks that
    are backed up or archived to tape after migrated from the disk-based solution,
    providing an infinite level of recovery. The challenges that we will continue
    to face is the backup of these very large databases and filesystems, and how to
    best protect this'
