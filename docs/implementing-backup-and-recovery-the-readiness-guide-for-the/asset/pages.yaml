- img_proc: true
  md: '# Monitoring Disk Load


    To use disk counters to monitor the disk performance in Performance Monitor, you
    may need to enable these counters. Windows may not have enabled the disk performance
    counters for your system.


    For more information about disk performance counters, from a command prompt, type:


    ```

    diskperf -help

    ```


    To enable these counters and allow disk monitoring:


    +   1. From a command prompt, type:


    ```

    diskperf -y

    ```


    +   2. Reboot the system.


    To disable these counters and cancel disk monitoring:


    +   1. From a command prompt, type:


    ```

    diskperf -n

    ```


    +   2. Reboot the system.


    When you monitor disk performance, the use of %Disk Time counter for the PhysicalDisk
    object to track the performance of elapsed time that the selected disk is busy
    serving read or write requests.


    Also monitor the Avg. Disk Queue Length counter and watch for values greater than
    1 that lasts more than one second. Values greater than 1 for more than a second
    indicate multiple processes are waiting for the disk to serve their requests.


    Several techniques may be used to increase disk performance, including:


    > Check the fragmentation level of the data. A highly fragmented disk limits throughput
    levels. Use a disk maintenance utility to defragment the disk.


    > Consider adding additional disks to the system to increase performance. If multiple
    processes are attempting to log data simultaneously, dividing the data among multiple
    physical disks may help.


    > Determine if the data transfer involves a compressed disk. The use of Windows
    compression to automatically compress the data on the drive adds additional overhead,
    affecting the performance of NetBackup. Use Windows NT compression if it is needed
