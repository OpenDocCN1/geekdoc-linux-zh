    was causing extensive restore times because of hardware failure. The DWO, or Drive
    Written On, indicates the drive number of the physical drive used to write the
    image fragment you are looking at in this report or on the has listed in the report.
    So, in Figure 6.19, the DWO was 0 the first and the drive that it wrote was su009.
    This particular client found a problem which would not manifest itself during
