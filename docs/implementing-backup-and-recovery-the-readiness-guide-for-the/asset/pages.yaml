- img_proc: true
  md: '# Chapter 7: Evaluating Other Backup-Related Features and Options


    We have discussed architecting a backup and recovery solution using traditional
    backup methods. We have looked at some of the things that must be considered in
    selecting the systems that will function as the master and possible media servers
    within the domain. In many cases, this will allow you to successfully perform
    necessary backups and restores, but in some situations, you will need to look
    at other features and options. In this chapter, we discuss several of these features
    and options, some of which require additional software or a new license, and we
    provide guidance as the situations where you might want to use them.


    # Backing Up and Restoring in a SAN Environment


    It is becoming common to find storage in the enterprise on a storage area network.
    This allows servers to have better access to disks and makes it possible to have
    better utilization of the resources. It is also desirable, and in some cases necessary,
    to use the SAN for backup and recovery. There are a couple of reasons why we do
    this. The most obvious is to have the ability to make the backup data from the
    client side to the tape drive without going over the local area network. The primary
    way is is use library sharing as discussed in Chapter 3. In this case, multiple
    media servers are directly connected to a Fibre Channel switch, with one of the
    media servers having robotic control. A specific media server now owns one or
    more of the drives through this direct connection and is able to do LAN-free backups.
    The downside of this solution is that the drives are only accessible by the media
    server directly connected to it. When the media server is finished with its own
    backup, the drive or drives sit idle or that media server must start backups of
    clients on the LAN. This is shown in Figure 7-1.


    Another option for LAN-free backups is to use a SAN solution. Servers that have
    too much data to be effectively backed up over the LAN can be connected to a fiber
    switch or controller that has drives connected to it. Now instead of each media
    server being directly connected to a drive or drives, all the media servers in
    the SAN can access all the drives connected to the SAN. This allows each media
    server to use as many drives as needed to finish its backup. When it is finished,
    the drives are reassigned to another media server. As long this allows you to
    get much better utilization of your tape drive resources. The drives can either
    be located in a robotic library or standalone drives, as long as they are connected
    to the SAN. This gives you a way to share standalone drives that is not possible
    in a standard backup environment. The assignment of the drives is arbitrated by
    the backup application.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '![](img/acb44d4c8cce95a9dfc81e127fceac76_103_0.png)


    Figure 7.1: Library sharing.


    # BACKUP AND THE SAN


    One example of SAN backups involved a customer who had been doing standard backups
    with NetBackup for a couple of years. Their environment had grown to the point
    that, even after adding media servers, tape libraries, and drives, backups were
    just about exceeding their window, taking 18 to 19 hours to finish each day. They
    finally decided that more hardware wasn''t the answer and implemented a backup
    SAN. This more effective use of existing hardware enabled their backups to finish
    in eight hours.


    VERITAS Software offers this feature with NetBackup Shared Storage Option (SSO),
    shown in Figure 7.2. With this feature, the backup and recovery data moves across
    the SAN, not the LAN. It also means the drives are connected to the media server
    via Fibre Channel instead of SCSI Channel. It eliminates the SCSI cable restrictions
    for connecting the drives.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_103_1.png)


    Figure 7.2: NetBackup Shared Storage Option (SSO).'
