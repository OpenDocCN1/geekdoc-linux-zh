    between the volumes for each of these drives. This is done by using DLT, DLT 2,
    and DLT 3 designations for the drive and media types. The other method to differentiate
    between volumes is volume pools.


    # Volume Pools


    As you build your backup environment, you will find that you need to be able to
    control the flow or keep backup data. A volume pool identifies a logical set of
    volumes by usage. You can create pools that span libraries. It is common practice
    to have retention backups, as the monthly full backups, to have a unique pool.
    If you are duplicating volumes, you should always have the duplicate copies in
    a different pool than the original copy. It is best if you configure your volume
    pools before adding volumes, since you cannot put volumes in a pool that does
    not already exist. You can also use the concept of a scratch pool whereby you
    define all your pools but put all the volumes in a scratch pool. NetBackup would
    automatically move a volume from the scratch pool to a designated pool as required.


