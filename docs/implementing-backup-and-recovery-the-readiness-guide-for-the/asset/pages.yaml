  md: '# Assessment Team


    This team evaluates the situation, identifies the severity of the damage, and
    reports back to the emergency-call team leader. Once again, there be a list of
    people involved in the team. A sample of this team is listed in Table D.4.


    Table D.4: Key Positions on the Assessment Team


    | KEY POSITION | DESCRIPTION |

    |---|--|

    | Primary contact | Organizes and mobilizes the team. |

    | Secondary leader | Assists primary, assumes role in the event the team leader
    is unavailable. |

    | Tertiary leader | Assumes primary role in the event both primary and secondary
    leaders are unavailable. |

