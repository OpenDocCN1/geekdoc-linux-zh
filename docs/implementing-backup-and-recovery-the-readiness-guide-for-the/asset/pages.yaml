    # Location of Data


    If all the data is located on a couple of large file servers, you should make
    them media servers by physically connecting them to tape drives and maybe have
    one more to handle all the network-based clients. If the data is spread throughout
    your enterprise, you must decide how you want to configure the backup domain.
    You can configure a dedicated media server or servers and back up all the data
    over the LAN, or you can distribute media servers closer to the clients. The restriction
    here will be the SCSI cable length restrictions from the media servers to the
    libraries.


    # Speed of Networks


    If a significant amount of data rests on clients on a slow network, you should
    consider installing a high-speed backup network, or if there is enough data, making
    one of these clients a media server. The other consideration is the amount of
    traffic the backup and recovery requirements will add to the existing networks.
    If possible, you should put the backup and recovery traffic on a dedicated network.
    If is not possible, you might have to throttle large backup clients on slow networks
    or they will dominate the network. [Table 3.4](#) will determine how different
    networks will affect the overall performance.


    # Backup Window


    The backup window can also come into play you are determining media server requirements.
    Some straightforward formulas are used to calculate how many tape drives are required
    to back up a known amount of data in a fixed amount of time, assuming no bottlenecks.
    We discuss this in the next chapter. If the amount of data to be backed up and
    the amount of time available result in too many required for a single media server,
    this would indicate another media server is needed. You must always stay within
    the system constraints when configuring media servers. It does not good to put
    more tape devices on a server than has the I/O bandwidth to handle. You do not
    want to create any unnecessary bottlenecks.


