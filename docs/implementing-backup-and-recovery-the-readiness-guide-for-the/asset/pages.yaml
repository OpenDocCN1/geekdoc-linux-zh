  md: '# Appendix G: NetBackup Performance Tuning on Windows


    # Document Description


    This document contains information on ways to optimize NetBackup on Windows systems.
    It is relevant for NetBackup 4.5 and earlier releases. This document is intended,
    primarily for system administrators, to provide a guide for NetBackup performance
    evaluation. It is not intended to provide tuning advice for particular systems.
    If you would like help fine-tuning your system, please contact the VERITAS consulting
    service.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Introduction to NetBackup Performance


    Before we examine the factors that affect backup performance, please note that
    an important first step is to ensure that your system meets NetBackup''s recommended
    minimum requirements. Refer to your NetBackup Installation Guide and Release Notes
    for information about these requirements. Additionally, we recommend that you
    have the most recent Net software patch installed. For example, if you are testing
    NetBackup 3.4x, patch 341_1 includes significant performance enhancement in target3.2e.


    The final measurement of performance is the length of time required for backup
    operations to complete (usually known as the backup window), or the length of
    time required for a critical restoration to complete. However, in order to measure
    performance and then use those measurements to improve performance, a performance
    metric more reliable and reproducible than wall clock time is needed.


    Many issues can be traced to hardware or other environmental issues. A basic understanding
    of the entire data transfer path is essential in determining the maximum obtainable
    performance in your environment. Poor performance is often the result of poor
    planning, which can be caused by unrealistic expectations of any particular component
    of the data transfer path.


    The slowest component in the data transfer path (for a backup, the path starts
    at the disk and ends with a backup copy on tape) will be the bottleneck that will
    limit the overall performance of NetBackup. For example, a fast tape drive combined
    with an overloaded server will yield poor performance.


    This document subdivides the standard NetBackup data transfer path into four basic
    components: the NetBackup client, the network, the NetBackup server, and the storage
    device. While it may be useful to subdivide the data transfer path further in
    some installations, to identify and ease specific bottlenecks, these four components
    offer a good approach to illustrate the ''divide and conquer'' approach to improving
    overall NetBackup performance.


    This document discusses NetBackup performance evaluation and improvement from
    a testing perspective. It describes ways to isolate performance variables in order
    to get a sense of the effect each variable has on overall performance, and to
    optimize NetBackup performance with regT that to target. It may not be possible
    to optimize every variable on your production system.


    This document was written with file system backups in mind. Database backups may
    have different requirements.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Measuring Netback Performance


    Once you have established an accurate metric as described here, you can measure
    the current performance of Netback and your system components to compile a baseline
    benchmark. Once you have a baseline, you can apply changes in a controlled way.
    By measuring performance after each change, you can accurately measure the effect
    of each change on Netback''s performance.


    The following topics are covered in this section:


    +   - Controlling variable systems for consistent testing conditions

    - Evaluating performance through the Activity Monitor and the All Log Entries
    report

    - Evaluating system components, such as your CPU and memory


    # Controlling System Variables for Consistent Testing Conditions


    For reliable performance evaluation, eliminate as many unpredictable variables
    as possible in order to create a consistent backup environment. Only a consistent
    environment will produce reliable and reproducible performance measurements. Some
    of the variables to consider are described below as they relate to the Netback
    server, the network, the Netback client, or the data itself.


    # Server Variables


    Of course, it is important to eliminate all Netback activity from your environment
    when you are measuring the performance of a particular Netback operation. One
    area that you must consider during this process is the automatic scheduling of
    backup jobs by the Netback scheduler.


    When policies are created, they are usually set up to allow the Netback scheduler
    to initiate the backups. The Netback scheduler will initiate backups based on
    the traditional frequency-based scheduling or on certain days of the month, or
    other time. This process is called calendar-based scheduling and is also in Netback
    4.5. As part of the backup policy definition, the Start Window is used to identify
    when the Netback scheduler can start backups. When you perform backups for the
    purpose of performance testing, this setup might interfere since the Netback scheduler
    may initiate backups unexpectedly, especially if the operations that you intend
    to measure are run for an extended period of time.


    The simplest way to prevent the Netback scheduler from running backup jobs during
    your performance testing (assuming you are testing the performance of a backup
    job) is to create a policy specifically for use in performance testing and to
    leave the Start Window field blank in the schedule definition for policy. This
    prevents the Netback scheduler from initiating any backups automatically for that.
    After creating the policy, you can run the backup on demand by using the Manual
    command from the Netback Administration Console.


    To prevent the Netback scheduler from running backup jobs unrelated to the performance
    test, you may want to set all backup policies to inactive using the Deactivate
    command from the Netback Administration Console. Of course, you reactivate the
    policies to start backup again


    You can use a user-directed backup to run the performance test as (or immediate
    backup, as it is sometimes called) instead of a user-directed de-coupled backup
    to more closely simulate the initiation of a backup job by the Netback Scheduler.
    Additionally, if you use a manual backup, the backup policy will contain the entire
    definition of the backup job, including the clients and files that are part of
    the performance test. Configuring the definition of the backup job to a single
    location makes it easier to manage changes to the definition, which in turn makes
    reliable performance test results more likely.'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'You may want to consider changing the wakeup interval for the Netback Scheduler
    to a larger value for the duration of performance testing. Use the Global Netback
    Attributes of the Server Properties to modify the wakeup interval. Access the
    Server Properties through the Host Properties of the Netback Administration Console
    in release 4.5, or Configure the Netback GUI in earlier releases. The wakeup interval
    controls how often the Netback Scheduler examines the policies on master server
    to determine if there are any new jobs to start. If there are a large number of
    Netback policies defined for the master server, this activity may affect the performance
    testing. Setting the wakeup interval to a large value, such as 1440 (24 hours)
    will avoid any of this processing on the performance test.


    Be aware that the wakeup interval will not reflect performance in your actual
    production environment. For more realistic results, use the wakeup interval specified
    in your production environment.


    Before you start the performance test, check the Activity Monitor to make sure
    there is no Netback processing currently in. Similarly, check the Activity Monitor
    for unexpected activity (such as an unanticipated restore job) that may have occurred
    during the test.


    Additionally, check for non-Netback activity during the performance test and try
    to reduce or eliminate it.


    # Network Variables


    Network performance is key to achieving optimum performance with Netback. Ideally,
    you would use a completely separate network for performance testing to avoid the
    possibility of skewing the results by unrelated network activity during the course
    of the test.


    In many cases, a separate network is not available. Ensure that no Netback activity
    is kept to an absolute minimum while you are evaluating performance. If possible,
    schedule testing when times are not active. Even occasional bursts of network
    activity may be enough to skew the results of portions of the test. If you are
    sharing the same network as your production backups occurring for other systems,
    you must account for this activity during the performance test.


    Another variable you must consider is host name resolution. Netback depends heavily
    upon a timely resolution of hosts to operate correctly. If there are any delays
    in host name resolution, including reverse name lookup to identify a server name
    from an incoming connection from a certain IP address, you may want to eliminate
    this delay by using the HOSTS file for host name resolution on systems involved
    in your performance test environment.


    # Client Variables


    Make sure the client is in a relatively quiet state during performance testing.
    A lot of activity, especially disk-intensive activity as virus scanning, will
    limit the data transfer rate and skew the results of your test.


    One possible mistake is to allow another Netback server, such as a production
    backup server, to have access to the client during the course of the test. This
    may result in Netback attempting to backup the client to two different servers
    at the same time, which would severely impact the results of a performance test
    in progress at that time.


    When OTM (Open Transaction Manager) is enabled to back up open files on the client
    during performance testing, OTM will delay for a certain amount of time waiting
    for the disk drive to quies. This delay can vary from one performance test to
    the next, causing unreliable results. You may want to disable OTM on the client
    during performance testing if it is not needed to back up open files and avoid
    this unpredictable delay.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Data Variables


    Monitoring the data you are backing up improves the repeatability of performance
    testing. If possible, move the data you use back to its own drive or logical partition
    (not a mirrored drive), and defragment the drive before you begin testing. For
    testing results, start with an empty disk drive or a recently defragmented drive
    with empty space. This will help reduce the impact of disk fragmentation, etc.,
    on the NetBackup performance run and yield more consistent results between tests.


    Similarly, for backing up to tape, start each test with an empty piece of media.
    You can do this by expiring existing images for that piece of media through the
    Catalog node of the NetBackup Administration Console (in release 4.5), or by running
    the `bpexdate` command. Another approach is to use the `freeze` command to freeze
    any existing backup images so that NetBackup selects a new piece of media for
    the backup operation. This will help reduce the impact of tape positioning, etc.,
    on the NetBackup performance test run and yield more consistent results between
    tests. When you restore from tape, always restore from the same backup image to
    achieve consistent results between tests.


    In general, using a large data set will generate a more reliable and reproducible
    performance test than a small data set. A performance test using a small data
    set would probably be skewed by startup and shutdown overhead within the NetBackup
    operation. These variables are difficult to keep consistent and are therefore
    likely to produce inconsistent results. Using a large data set will minimize the
    effect of start times.


    Design the makeup of the dataset to represent the makeup of the data in the intended
    production environment. For example, if the data set in the production environment
    contains many small files on file servers, then the data set for performance testing
    should also contain many small files. A representative data set will more accurately
    predict the NetBackup performance that you can reasonably expect in a production
    environment.


    The type of data can reveal bottlenecks in the system. Files consisting of non-compressible
    (random) cause the tape drive to run at its lower rated speed. As long as the
    other components of the data transfer path are keeping up, you may identify the
    tape drive as the bottleneck. On the other hand, files consisting of highly-compressible
    data can be processed at higher rates by the tape drive when hardware compression
    is enabled. This scenario may result in a higher overall throughput and possibly
    expose the network as the bottleneck.


    Many values in NetBackup provide amounts in KB and rates in KB/Sec. For greater
    accuracy, divide by 1024 rather than rounding up to 1000 when you convert KB to
    MB or from KB/Sec to MB/Sec.


    | < PREV | Day Up > | NEXT > |'
