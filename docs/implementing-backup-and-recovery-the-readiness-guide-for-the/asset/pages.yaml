    \ through today. The success of the plan will be measured by the thoroughness\
    \ of your work during the development of your plan.\n\n# Hardware Inventory\n\n\
    Include as much detail as possible about the hardware that will be protected by\
    \ this DR plan. The more detail the better. Also include as much information about\
    \ the maintenance contract as possible for the hardware as well. Here's a brief\
    \ sample list of what you may want to include in your hardware inventory:\n\n\
    +   * Server name\n* Make/model\n* Serial number\n* OS\n  * Patch level\n* Memory\n\
    \  * Amount\n  * Type\n* Disk controllers\n* Disk drives\n* Partitions\n* Network\
