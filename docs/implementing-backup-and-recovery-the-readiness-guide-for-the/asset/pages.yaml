  md: "# S\n\n# schedules\n\nControls when backups can occur in addition to other\
    \ aspects of the backup, such as the type of backup (full, incremental) and how\
    \ long NetBackup retains the image.\n\n# Server-directed restores\n\nUsing the\
    \ client interface on the master server to restore files to any client. Only the\
    \ administrator can perform this operation.\n\n# Server-independent restore\n\n\
    Restoring files using a NetBackup server other than the one that was used to write\
    \ the backup; this feature is available only with NetBackup DataCenter.\n\n# server\
    \ list\n\nThe list of servers that a NetBackup client or server refers to when\
    \ establishing or verifying connections to NetBackup servers. On a Windows NT/2000\
    \ server and Microsoft Windows clients, you update the list through a dialog box\
    \ in the interface. On a UNIX server and Macintosh clients, the list is in the\
    \ bp.conf file. In NetBackup 4.5, this list can be configured and managed from\
    \ the Java GUI. On Net target and OS2 clients, the list is in the bp.ini file.\n\
    \n# service\n\nPrograms on a Windows NT/2000 system that runs in the background\
    \ and performs some task (for example, starting other programs when they are needed).\
    \ Services are generally referred to as daemons on UNIX systems.\n\n# session\n\
    \nAn instance of NetBackup checking its schedules for backups that are due, adding\
    \ them to its work list, and completing all jobs in the work list. For backups\
    \ and archives, a session usually consists of a single backup or archive.\n\n\
    # SSO (Shared Storage Option)\n\nSSO allows for individual tape drives to be shared\
    \ dynamically among multiple NetBackup media servers. See alsoMulti-Hosted Drives.\n\
    \n# standalone\n\n qualifier qualifies drives and media to indicate they are not\
    \ associated with a robot. For example, a standalone tape drive is one where you\
    \ manually find and insert tapes before using them. A standalone volume is one\
    \ that is located in a standalone drive or is outside of a drive and designated\
    \ as standalone in the volume configuration.\n\n# status code\n\nIA numerical\
    \ code usually accompanied by a message that indicates the outcome of a particular\
    \ operation.\n\n# storage area network (SAN)\n\nA network to connect hosts and\
    \ storage devices. Typically these networks are built using Fibre Channel equipment.\n\
    \n# storage unit\n\nLogical representation of the physical storage devices that\
    \ is used by NetBackup to identify storage resources and manage backups. It can\
    \ be a set of drives in a robot or consist of one or more single tape drives that\
    \ connect to the same host."
