  md: '# HP Data Protector (Formerly Omniback II)


    Hewlett-Packard, was founded in 1939 by Bill Hewlett and Dave Packard, has evolved
    over the last several decades into the HP, one of the leading technology solution
    providers in the storage industry. HP recently launched a new data protection
    software product, HP OpenView Storage Protector, or Data Protector for short,
    that builds upon and enhances their previous generation of data protection, HP
    OpenView Omniback II. Data Protector adds new levels of disk-based recovery and
    additional features for service-level management as of the newest release of the
    software.


    The HP OpenView Storage Data Protector software builds on a foundation of backup
    and recovery software using distributed agent technology acquired by HP with their
    purchase of Apollo Computers in the late 1980s. The second generation of this
    technology, HP OpenView Omniback II, was first launched in September in 1994,
    and has been continually enhanced and improved since then. The current incarnation
    of HP''s data protection software, HP OpenView Storage Data Protector, was launched
    in June of 2002.


    # Methodology of Backup


    Data Protector incorporates a flexible architecture that can span up to nine generations,
    Incremental-1 through Incremental-9. This is a variation on the traditional grandfather-father-son
    approach for backups. Typically, users will concentrate on combinations of small
    and few number of backups to accommodate their specific protection and recovery
    needs. Even with the power up to nine levels of incremental backup is available,
    recovering a lost directory from a deep level would require copies of all nine
    levels backups and the most-recent full backup, potentially a large number of
    tapes, and it would take a bit of time to recover.


    # Principles of Recovery


    Data Protector can support a variety of disaster recovery options. These options
    consist of the following:


    +   **Traditional manual disaster recovery.** Reinstallation of the operating
    system, reininstallation of the Data Protector agent, and recovery of the applications
    and data from a backup.


    +   **Assisted manual disaster recovery.** After a staff person manually restores
    the operating system on the downed server, the staff uses the Data Protector''s
    restore command from the management station to automatically restore the Data
    Protector to the downed server and automatically initiate the restoration of the
    applications and data from the server tape.


    +   **Enhanced automatic disaster recovery.** This approach uses recovery disks,
    or recovery CD, that are prepared ahead of time using Data Protector to facilitate
    the unattended restoration of the operating system and Data Protector agent. The
    recovery of the applications and data can be initiated in the usual fashion using
    Data Protector.


    +   **One-button disaster recovery (OBDR).** For Windows NT or 2000 servers having
    directly connected tape drives compatible with OBDR, Data Protector enables the
    creation of recovery tapes supporting this. With One-Button Disaster Recovery,
    a staff person can simply reboot the downed server while the reset button on the
    tape drive, with the OBDR tape loaded in that drive, and the server automatically
    identifies the tape as a bootable device and begins to load from that drive. When
    the process completes, the server has reloaded the operating system, applications,
    and data from the tape copied them to its disk, and it is running in a fully operational
    state.'
