  md: '# Appendix B: Glossary


    # A


    active job


    A job for which NetBackup is currently processing backup or restore data.


    activity logs


    Logs that may be optionally enabled for specific NetBackup programs and processes
    and then used to further investigate problems.


    Activity Monitor


    A NetBackup administration utility that displays information about NetBackup jobs,
    services, and processes, and provides limited control over them.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# B


    backup identifier (backupid)


    The unique identifier assigned to each backup image. This is the identifier that
    is stored with the backup information in the NetBackup image catalog and used
    to track all backup images.


    backup window


    The time or window of opportunity given to the backup process in which to execute
    scheduled or user-directed backups.


    barcode


    A label that is affixed to a cartridge and read by a barcode reader to allow the
    storage library to identify the media.


    bpduplicate


    Command-line interface used to duplicate NetBackup backup images. Also used by
    bpVault if configured to automate the duplication processes.


    bpVault


    A utility used to automate the off-site vaulting process of tape media, whether
    duplicated media or original media. Replaced by NetBackup 4.5 Vault.


    bpVault Reports


    bpVault generates several reports; the most common ones are the Picking List for
    Library, Distribution List for Vault, Picking List for Vault, and Distribution
    List for Library and Volume Inventory.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# C


    catalogs

    nThe internal NetBackup and Media Manager databases; these catalogs contain information
    about configuration, media, devices, status, errors, and the files and directories
    in the stored backups.


    class

    nSeepolicy. This was the NetBackup term before the current 4.5 release.


    command-line interface (CLI)

    nCommands that users can execute either from the system prompt or in scripts.


    cron

    nThe cron command starts a process that executes commands at specified dates and
    times. Regularly scheduled commands can be specified according to instructions
    found in crontab files in the directory var/spool/cron/crontabs. Users can submit
    their own crontab file using the crontab(1) command. Commands that are to be executed
    only once may be submitted using the at command.


    cumulative-incremental backup

    An attribute of a class schedule, this type of backup collects all files that
    have changed since the last successful full backup. All files are backed up if
    no prior backup has been done. See differential-incremental backup.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# database-agent clients


    NetBackup clients with additional software designed to allow backup of certain
    relational databases.


    # database-extension clients


    Seedatabase-agent-clients.


    # device host


    A Media Manager host with either a physical attachment or a definition of a drive
    or robotic control.


    # Device Monitor


    A Media Manager administration utility allowing monitoring and manual control
    of Media storage devices. For example, an administrator or computer room operator
    can use this utility to manually reset devices or set them to the UP or DOWN state.


    # DHCP


    Dynamic Host Configuration Protocol. This TCP/IP protocol automatically assigns
    IP addresses to hosts when they connect to the network.


    # differential-incremental backup


    Scheduled by the administrator on the master server, this backup backs up files
    that have changed since the last successful incremental or full backup. All files
    are backed up if no prior backup has been made. Seecumulative-incremental-backup.


    # directory depth


    The number of levels below the current directory level that the NetBackup interfaces
    show in their directory and file lists.


    # directory tree


    The hierarchy of how the files are organized on a disk. Each directory lists the
    files and directories that are below it in the tree. On UNIX, the topmost directory
    is called the root directory.


    # disaster recovery (DR)


    The act or process of recovering data from backups after a crash or other catastrophe.


    # disk-image backup


    A bit-by-bit backup from a filesystem of a drive on Windows NT/2000.


    # Distribution List for Library


    Part of bpVault. All of the VOLERS or media IDs that have been returned from the
    Offsite Vendor. This report may blank if none of the VOLERS have met their expiration
    date. The report contents are the same as the Picking List for Vault report by
    slot number listed instead of VOLSER number.


    # Distribution List for Vault


    Part of bpVault. Lists all the VOLERS or media IDs that have been sent off-site
    to the Vaulting Vendor. This report is listed in numerical order by slot number
    and is used by the Offsite Vendor to ensure all of the tapes sent are accounted
    for based on the report. The report contents are the same as the Picking List
    for Library.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# duplicate image


    A duplicate copy of a particular backup image.'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# E


    EVSN


    External volume serial number. An identifier written on a media cartridge or canister
    so the operator can identify the volume before inserting it into a drive or robot.
    For labeled media, the EVSN must be the same as the RVSN (identifier recorded
    on the media). For all media, the EVSN is the same as the media ID.


    exclude list


    Files or directories to exclude from automatic backups are contained within this
    list.


    expiration (image)


    The date and time when NetBackup stops tracking a backup image.


    expiration (volume)


    The expiration date of a volume is the date and time when the physical media (tape)
    is considered to be no longer usable.'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# F


    # Fibre Channel


    The collection of physical interconnect hardware and the Fibre Channel protocol.


    # frequency (backup)


    This determines how often NetBackup performs automatic scheduled backups within
    a particular policy (class). For example, if the frequency is seven days, then
    backups occur once a week.


    # FROZEN media state


    If a volume is FROZEN, NetBackup keeps it indefinitely and can restore from it
    but not use it for further backups or archives.


    # full backup


    A backup that copies to a storage unit includes all files and directories that
    are beneath a specified directory.


    # FULL media state


    If this appears in a report or listing, it indicates the volume is full and cannot
    hold more data or be used for further backups.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# G


    # global attributes


    These are configuration attributes that affect the entire NetBackup master domain.


    # Global Data Manager (GDM)


    An optionally purchased utility that provides a tree view and administration of
    multiple master servers within the enterprise. The server where the option is
    installed is called a master of masters.


    # GNU TAR


    A public domain version of the UNIX TAR program.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# image


    The collection of data that NetBackup saves for an individual client during each
    backup or archive. The image contains all the files, directories, and catalog
    information associated with the backup or archive.


    # import


    The process of re-creating NetBackup records of images that have previously expired
    or are not included in an active environment so the images can be restored.


    # include list


    This list designates files or directories to add back in from the exclude list.


    # incremental backup


    See cumulative-incremental backup, differential-incremental backup.'
  merge: -1
