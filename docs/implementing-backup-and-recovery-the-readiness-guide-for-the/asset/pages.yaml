    numerically.


    # policy


    In NetBackup 4.5, defines the backup characteristics for a group of one or more
    clients that have similar backup requirements.


    # primary copy


    The copy of an image that NetBackup uses to satisfy restores. When NetBackup duplicates
    an image, the original is designated as the primary copy.'
