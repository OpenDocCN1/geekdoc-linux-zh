  md: 'You can use the bptm debug log file to verify that the tunable parameters have
    successfully set to the desired values. You can use these parameters and the Wait
    and Delay counter values to analyze problems. These additional values include:


    **Data buffer size.** The size of each shared data buffer can be found on a line
    similar to:


    +   - io_init: using 65536 data buffer size


    **Number of data buffers.** The number of shared data buffers may be found on
    a line similar to:


    +   - io_init: using 16 data buffers


    **Parent/child delay values.** The values in use for the duration of the parent
    and child delays can be found on a line similar to:


    +   - io_init: child delay = 20, parent delay = 30 (milliseconds)


    **NetBackup Media Server Network Buffer Size.** The values in use for the Network
    Buffer Size parameter on the media server can be found on lines similar to (may
    only be part of 4.5 debug log files):


    The receive network buffer is used by the bptm child process to read from the
    network during a remote backup.


    +   - setting network buffer to 263168 bytes


    The send network buffer is used by the bptm child process to write to the network
    during a remote restore.


    +   - setting send network buffer to 131072 bytes


    See the section on NetBackup Network Performance for more information about the
    Buffer Size parameter on the media server.


    Suppose you want to analyze a local backup in which there is a 30-minute data
    transfer baseline at 5 MB/sec with a total data transfer of 9000 MB. Because a
    local backup is involved, if you want to refer to the table ''Order of Processes
    during Backup and Restore Operations,'' you can determine that ppbkar32 is the
    data producer and bptm is the consumer.


    You now want to determine the Wait and Delay values for bpbkar32 and bptm by following
    the procedures in the section ''Determining Wait and Delay Counter Values.'' For
    this example, suppose those values were:


    | PROCESS | WAIT | DELAY |

    |---|---||

    | bpbkar32 | 29936 | 58033 |

    | bptm | 95 | 105 |


    Using these values, you can determine that the ppbkar32 process is forced to be
    waited by a bptm process which cannot move data due to loss of the shared buffer
    exhaust.


    Next, you can determine the delay value by multiplying the Delay value by the
    parent or child delay value, whichever applies.


    In this example, the ppbkar32 process uses the child delay value, while the bptm
    process uses the parent delay value. (The defaults for these values are 20 for
    child delay and 30 for parent delay.) The values are specified in milliseconds.
    See ''Parent/Child Delay Values'' under the ''NetBackup Server Performance'' section
    for more information on how to modify these values.'
