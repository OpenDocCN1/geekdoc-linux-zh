  md: '# Legato NetworkWorker


    Legato Systems was founded in 1988 by four engineers from Sun Microsystems (Jon
    Keeces, Bob Lyon, Moran, and Russell Sandberg) to provide an integrated set of
    storage management solutions that simplify the administration of client/server
    computing. Legato was the first in the market to introduce a common tape format
    (OpenTape) and a common media interface (SmartMedia), and it codified the Network
    Data Management Protocol (NDMP). In the important SAN industry, Legato was a founding
    member and a member of the Board of Directors of the Storage Network Association
    (SNIA) in the United States and Europe.


    Legato NetworkWorker protects the client business by simplifying, centralizing,
    and automating backup and recovery operations across UNIX, Windows, Linux, and
    VMware platforms in DAS, NAS, and SAN environments. Built upon open, highly scalable
    client/server architecture, the NetworkWorker product reduces frequency demands
    by providing ''lights out'' protection of storage assets in the largest data centers
    and the smallest satellite branches. Advanced indexing and media management, cluster
    support, high-speed tape copying, and cross-platform tape interoperability, NDMP
    support-based data transfer, and dynamic drives are the key components that enable
    organizations to protect storage assets and minimize downtime. Database, messaging,
    and ERP modules enable online protection and granular recovery. Auto/silo media
    enables hands-free protection using a wide variety of robotic devices. Storage
    nodes enable load sharing and distribution of backup traffic, NetworkWorker is
    also tightly integrated with complementary Legato applications, such as hierarchical
    storage management (HSM), systems, simplified operator administration, and Web-enabled
    management of multiple Network services.


    # Methodology of Backup


    A NetworkWorker scheduled backup may perform a full, incremental, consolidated,
    and/or level backup. A full backup (level 0) consists of all files or not they
    have changed. An incremental backup ups all files that have changed since the
    last backup regardless of the level. However, the incremental level backups, of
    which there are nine, allow you to creatively architect the manner in which you
    wish to perform your data. The incremental level backups up files that have changed
    since the last level number or all the files that have changed since the last
    level 2 backup, incremental or full backup. A level 9 backups up all the files
    that have changed since the last level 8,7,6,5,4,3,2,1 or full. A consolidated
    backup backs up all files that has changed since the last full backup and subsequently
    merges these changes with the last full backup, effectively building a synthetic
    backup. NetworkWorker also has what is called ''skip'' backup type, which skips
    a backup that may, for example, on a holiday or may be skipped if no one is available
    to perform tasks such as change or media volumes.


    # Principles of Recovery


    NetworkWorker Data Recovery takes full advantage of the information stored in
    its client index and media database to quickly locate files and recover them to
    their original location or another location if desired. The two methods employed
    by NetworkWorker for recovery are as follows:


    +   **Client File Index-Based Recovery.** An end user or administrator browses
    the client index using graphical tools or command-line interface (CLI) and selects
    individual files or directories to recover.

    **Save Set Recovery.** An administrator or end user recovers an ever save set
    to the originating client from the NetworkWorker GUI or CLI.'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'In addition to these methods, NetWorker maintains the ability to recover data
    that has been expired by using a utility scanner. Scanner reads a NetWorker volume
    independent of the NetWorker server, making it possible to rebuild the media database
    and client indices in the unusual event that the NetWorker data was inaccessible.


    NetWorker is designed with disaster recovery as a primary focus. If a disaster
    occurs-whether it is isolated to a single system, the NetWorker server itself,
    or an entire site-NetWorker is able to respond quickly so that data can be restored
    and operations continue in minimal time. NetWorker protects its data through the
    creation of bootstraps. A bootstrap contains the site-specific information that
    the NetWorker server requires to recover in the case of a disaster.


    Legato AlphaStor provides drive sharing and advanced management for the NetWorker
    servers. As with other products, Legato customers implement multiple NetWorker
    servers to maximize backup performance, which naturally increases complexity with
    multiple databases and client file indices having multiple points of administration.
    AlphaStor helps to reduce this complexity by providing a single and consolidated
    view of all NetWorker media, as well as other storage media.


    AlphaStor''s advanced media management includes the following:


    +   - A simple-to-use, browser-based interface for data center operation personnel

    - On-site and off-site tape rotation management and tracking

    - The ability to schedule, track, and automate movement of all media, regardless
    of location, based on defined policies and retention policies defined within NetWorker

    - Ability to share tape devices and libraries across multiple NetWorker servers
    and storage nodes

    - A consolidated view of all media and drive usage

    - Consolidated reporting of tape pools and media by location

    - Support for SAN environments


    Much of the disaster recovery principles are contained within the functionality
    of AlphaStor. This is an add-on product and not included in the base product.


    # High Availability


    There is extensive support for clustered environments, including Sun Cluster,
    Compaq TruCluster, Microsoft Cluster Services, Hewlett-Packard MSCG, IBM HACMP,
    and Legato Availability Manager. It also has the ability to cluster NetWorker
    Servers.


    # Key Differentiators


    The following are the key differentiators for NetWorker:


    +   - The core product is engineered for performance, resiliency, and scalability.

    - 13,000 enterprise customers utilize NetWorker worldwide; SAP standardizes on
    NetWorker (12+ TB daily), protects six global data centers with NetWorker, 28
    separate NetWorker OEM agreements (most in industry; example: Sun Solstice Backup
    is NetWorker OEM).

    - It is the only data protection software shipping with every IBM LTO library,
    and the only data protection software shipping with every Oracle 8 and 9 database.

    - It enables standardization on one application to protect information in the
    largest data centers, the smallest branch offices, and throughout a heterogeneous
    global enterprise.

    - Open Tape format provides interoperability between UNIX, Windows, Linux, and
    NetWare backup platforms, increasing disaster recovery and platform migration
    capabilities.

    - Advanced indexing architecture eliminates risk of corruption and speeds file
    recovery.'
