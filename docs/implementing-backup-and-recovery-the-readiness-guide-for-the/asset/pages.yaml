  md: '# Appendix C: Tuning Your Backup and Recovery Application


    Tuning is something that just about everyone wants to tune, and tuning your backup
    and recovery application is no exception. Because backup and recovery touch so
    many areas of the system, and in fact, the enterprise becomes more difficult to
    define clearly. The backup servers need to be tuned for optimum I/O performance,
    as well as shared memory, message queues, and network performance. The clients
    need to tune to their network performance, then they need to have good disk performance.
    All the variables that need to be considered, tuning becomes a large task that
    some appears to be more of an art.


    Generally, we leave the majority of the tuning to the system administrators and
    the other operating systems. In this appendix, we discuss some of the tuning that
    can be done specifically for application, NetBackup, and OS tuning that directly
    affects the application. We also use some tuning references that you can use.
    If you go to the VERITAS Software web site, http://support.veritas.com, and select
    Knowledge Base Search, you can search for a specific phrase and limit it to a
    specific product. We searched for ''tuning'' and the specific product and found
    ''NetBackup Configuration Guide for Linux Platforms (http://support.veritas.com/docs/240733.html)
    and Tuning NetBackup on NT Systems for Optimal Performance (http://support.veritas.com/docs/248573.html).
    These two documents contain a lot of specific tuning steps for Windows and Unix.


    The key to tuning of your backup servers is to understand what resources are being
    used and how they are being used. With a NetBackup media server, the primary function
    is to receive data from a client and move data to tape. One of the first areas
    to tune is the size of the data buffers the application will be using. You will
    generally get better performance if the application''s write buffers match the
    drive cache which are a function of the cache. After many tests we have found
    that in most cases a larger buffer size used with NetBackup is 256 KB, or 262144.
    This usually gives the best tape write performance.


    There is another buffering parameter that controls how many of these write buffers
    the application is allowed to use. This is a little harder to quantify, but 8
    or 16 seems to be a good starting number. If you do not manually set these configuration
    files, the application uses default values. These values can change with the version
    of the application and also on the platform type (Unix or Windows) and whether
    you are using multiplexing.


    As mentioned, tuning is more art than science. The art portion of the equations
    when you want to establish the exact values for each of these configuration files
    we mentioned are generally good, depending on the configuration and type, and
    you might want slightly different ones. The only way to get the best settings
    is to test and measure, then test and measure again. Table C.1 and C.2 list the
    default values for the common parameters used at NetBackup 4.5.


    # Table C.1: Default Values-SIZE_DATA_BUFFERS


    | MULTIPLEXED | NONMULTIPLEXED |

    |---|--|

    | UNIX | 64K | 32K |

    | Windows | 64K | 64K |


    # Table C.2: Default Values-NUMBER_DATA_BUFFERS'
  merge: -1
