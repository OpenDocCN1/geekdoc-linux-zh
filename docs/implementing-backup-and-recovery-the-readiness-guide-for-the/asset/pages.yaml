- img_proc: true
  md: '# Caveats:


    +   - Don''t you restores.

    - Doing this affects ALL disk-based backups on the server (all go to null).

    - I have been told that while it has yet to be proven, it may cause problems with
    tape based backups as well. I personally haven''t had this experience.

    - Doing this leaves extra information lying around in NB databases.

    - Expire any images that you create with this test over by using the bpexdate
    command.

    - When you are done remove the /usr/open/netbackup/bpdm_dev_null file.


    # Using FTP


    The final test is simply using FTP. We have now tested and backed up at the client
    to the client bucket, client to the server and now we want to try the network,
    from the client to the server. This will tell us if we are looking at a client
    issue, server issue or network issue. If anything it will give us good information
    as how to proceed resolving our performance problem.


    Run this test from the client, then from the server and evaluate both findings
    to determine the next step.


    +   1. FTP from the client to the server, then server to client.

    2. FTP something large enough to be measure (1 GB preferably).


    While this may seem like a real test, it does accomplish something for us. We
    are able to transfer data OUTSIDE of the backup application, allowing us to compare
    the times with FTP and the times with backup. With all of this information and
    testing complete, the profile of the client backup should be relatively clear
    and we should be able to at least determine where the root cause of the problem
    exists. If this is not the case, open a support call with VERITAS. Be prepared
    to submit your documentation to them, so you can avoid any lost time resolving
    your issue.


