  md: '# NetBackup Client Performance


    This section lists factors to consider when you evaluate the NetBackup client
    component of the NetBackup data transfer path. Examine these conditions to identify
    possible changes that may improve the overall performance of NetBackup.


    +   **Disk Fragmentation.** Fragmentation is a condition where data is scattered
    across the disk in contiguous blocks. This condition severely impacts the data
    transfer rate from the disk. Fragmentation can be prevented using hard disk management
    utility software offered by a variety of vendors.


    +   **Virus Scanning.** If virus scanning is turned on for the system, it may
    severely impact the performance of the NetBackup client during a backup or restore
    operation. This may be especially true for systems such as large NT file servers.
    You may wish to disable virus scanning during backup or restore operations to
    avoid the impact on performance.


    +   **NetBackup Scripts.** The `bpstart_notify.bat` and `bpend_notify.bat` scripts
    are very useful in situations, such as shutting down an application to back up
    its data. These scripts must be written with care to avoid any unnecessary delays
    at the start or end of the backup job. If the scripts are not performing tasks
    essential to the backup operation, you may want to remove them.


    +   **NetBackup Software Location.** If the data being backed up is on the same
    physical drive as the NetBackup installation, performance may be adversely affected,
    especially if NetBackup log files are being used. If they are used, the extent
    of degradation will be greatly influenced by the NetBackup verbose setting for
    the debug logs. If possible, install NetBackup on a separate physical drive to
    avoid this disk contention.


    +   **Open Transaction (OTM).** When OTM is enabled, there is a delay at the start
    of the backup while information is gathered about the volumes being snapped and
    while waiting for the activity to query. In some cases, there will be an additional
    delay while NetBackup treats the data transfer rates as affected by this delay
    because the backup process is started on the client. You may wish to disable OTM
    this delay unless it is needed to back up open files.


    +   **Job Tracker.** If the NetBackup Job Tracker is running on the client, NetBackup
    will gather an estimate of the data to be backed up prior to the start of a backup
    job. Gathering this estimate will affect the startup, and therefore the data throughput
    rate, because no data is being written to the NetBackup server during this estimation
    phase. You may wish to avoid using the NetBackup Client Job to avoid this delay.


    +   **Client Location.** You may wish to consider adding a locally attached tape
    device to the client and changing the client to NetBackup media if you have a
    substantial amount of data on the client. For example, backing up 100 GBs of data
    to a locally attached tape will generally be more efficient than backing up the
    same amount of data across a network connection to a NetBackup server. Of course,
    there are many variables to consider, such as the bandwidth available on the network,
    which will affect the decision to back up the data to a locally attached tape
    as opposed to moving the data across the network.


    +   **Determining the Theoretical Performance of the NetBackup Client Software.**
    There is a useful feature in the NetBackup client utility `bpbkar32` that may
    be used to determine'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'the speed at which the NetBackup client can read the data to be backed up from
    the disk drive. This feature can be used to eliminate a possible performance bottleneck
    the speed at which the data can be read when you are attempting to improve a poorly
    performing NetBackup installation. Use the following syntax for this utility:


    ```

    bpbkar32 -nocont <filepath> > NUL 2 > NUL

    ```


    In the above syntax, <filepath> would be replaced with the path to the data to
    be read from the disk, C:\ for example. Using this syntax simulates an infinitely
    fast speed for the other components of the NetBackup data transfer path, such
    as the network.


    You can view the performance statistics of the operation in the bpbkar debug log
    file, or use a stopwatch to time the operation and then manually calculate the
    performance statistics.


