  md: '# IBM Tivoli Storage Manager


    IBM''s Workstation DataSave was developed in the late 1980s at the Almaden Research
    Center to meet customer requirements for distributed network backup. The program
    underwent significant redevelopment to the ADSTAR distributed storage manager
    (ADM) in 1993 and became later IBM Tivoli Storage Manager (TSM). The need for
    network backup emerged from distributed client/server computing during the proliferation
    of personal computers and workstations. The goal was to consolidate the protection
    of distributed data in an environment where information was no longer centralized.
    Backing up locally attached devices was, and still is, costly and error-prone,
    and often does not meet requirements for disaster recovery. With TSM, clients
    can back up data to central servers, store data on a variety of media and track
    location for later retrieval. TSM protects from hardware failures and other errors
    by storing backup and copies of offline storage.


    Scaling to protect hundreds of computers running dozen operating systems ranging
    from laptops to mainframes and connected via the Internet, WANs, or LANs, TSM''s
    centralized Web-based management, smart-data move and store techniques, and comprehensive
    policy-based automation minimize data protection costs and impact to both computers
    and networks. Optional modules allow business-critical applications that run 24
    x 365 to TSM''s centralized data protection with no interruption to their service.


    # Methodology of Backup


    IBM TSM uses incremental backup rather than the full-plus-incremental/differential
    methodology of some the other backup solutions. Its sophisticated architecture
    allows it to just back up new or changed files. Likewise, when you are doing a
    restore, only the version of the files requested is restored, so there is no need
    to restore a full and then incremental or differential backups on top of that.


    # Principles of Recovery


    TSM has the ability to automatically create as many copies of the backed-up data
    onto whatever type of media you specify. This capability can be scheduled for
    administrator ease. ESM only creates copies of the files that were not previously
    backed up. TSM can simultaneously create and reclaim space on off-site sites.
    This is done at the time of initial backup with simultaneous write to primary
    and copy storage pools. TSM has an open API that allows for integration by any
    interested third party or any company who wants to integrate with TSM. The Ker
    Group (acquired by VERITAS Software) has integrated its Bare Metal Restore with
    TSM, providing true bare recovery of a failed system.


    # High Availability


    IBM TSM supports integration with Windows clustering and AIX HACMP from a hardware
    integration perspective, and works well with IBM ESS (FlashCopy and EMC Smetric
    TimeFinder.


    # Key Differentiators


    One of the things that differentiates IBM TSM''s product from the field is its
    relational database architecture and transaction logging. This enables a host
    of unique capabilities:


    +   - Back up just files that have changed or are new

    - Migrating data from one type of media to another

    - Performing advanced tape management capabilities that allow for the reclamation
    of dead space'
