  md: '# NetBackup Commands for Windows


    **beconv** Converts Backup Exec on-disk catalogs to NetBackup on-disk catalogs.


    **bephyniv** Updates the Media Manager database, NetBackup media database, and
    Backup Exec database for a set of Backup Exec media.


    **bparchive** Archives files to the NetBackup server by processing files that
    you list on the command line or in the file with the -listfile option. Any file
    path entered can be a file or directory name. If the file includes a directory,
    bparchive archives all files and subdirectories starting at the directory.


    **bpauthorize** Manages the authorize.txt file on remote servers. This command
    is available only on NetBackup master servers and sets up authentication files
    on NetBackup servers and clients according to the options that are specified with
    the command.


    **bpauthsync** Synchronization files on NetBackup servers and clients. This command
    is available only on NetBackup master servers and sets up authentication files
    for NetBackup servers and clients according to the options that are specified
    with the command.


    **bpbackup** Backs up files to the NetBackup server. If issued on a client, bpbackup
    starts a backup that is equivalent to what is performed using the interface on
    the client. This type of backup can be started from any NetBackup client in order
    to back up files from that client. The backup command processes the files that
    you list on the command line or in the file with the -listfile option. Any file
    path can be a file or directory name. If the named file includes a directory,
    bpbackup ups all files and subdirectories of that starting at the directory.


    If issued on the master server, bpbackup starts an immediate-manual backup of
    a client. This variation requires the -i option on the bpbackup command and is
    available only to the administrator on the master server. It is the equivalent
    of starting a manual backup from the NetBackup administrator''s interface. Use
    the -h option to specify the host.


    **bpbackupdb** initiates a backup of one or more NetBackup image catalogs specified
    on the command line. It also backs up the default set of NetBackup catalogs, unless
    the command line contains -ndbpaths. If the command line specifies a destination,
    the backup is stored there. Otherwise, the backup is stored at the default location
    for backups of the NetBackup internal databases, which are called catalogs.


    **bpchangeprimary** Promotes a copy of backup to the primary copy. The bpchangeprimary
    command lets you change which copy is the primary for a set of backup images.


    **bpclient** Manages client entries on a master server.


    **bpconfig** Modifies or displays the global configuration attributes for NetBackup.
    These attributes affect operations for all policies and clients.


    **bpdbjobs** Interacts with the NetBackup jobs database and is useful in scripts
    or as a command line administration tool. Use bpdbjobs to print the entire jobs
    database, print a summary, delete done jobs, clean incomplete jobs, and clean
    old jobs.'
