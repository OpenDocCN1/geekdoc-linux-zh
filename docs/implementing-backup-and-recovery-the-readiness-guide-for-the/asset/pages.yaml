  md: '# M


    Mail CAP


    A tape library term. A place where tapes are transferred in and out of the tape
    library without compromising the integrity of the tape library''s inventory. CAP
    stands for Cartridge Access Port.


    master and media server cluster


    This is defined as the NetBackup master server and the remote media servers in
    an enterprise configuration. It is possible to configure clusters only with NetBackup
    DataCenter servers.


    master of masters


    The masters is a NetBackup host where Global Data Manager software is installed.
    When logging into this, the interface has a tree where the administrator can view
    and manage multiple servers.


    master server


    The NetBackup server provides administration and control for backups and restores
    for all clients and servers in a master and media server cluster.


    media


    The physical media tapes, optical disks, or magnetic disks where data is stored.


    media host


    The NetBackup host writing the data to the attached storage device that is received
    from the client.


    media ID


    An identifier that is written on a volume as part of the recorded label.


    Media Manager


    Software that part of NetBackup and manages the storage devices and removable
    media.


    Media Manager host


    Simply put, a host where Media Manager software is installed.


    media server


    A NetBackup server provides storage within a master and media server cluster.
    The master can also be a media server. A media server that is not the master is
    called a remote media server (or slave server).


    Multi-Hosted Drives


    Also known as SSO (Shared Storage Option), an additional piece of software that
    allows tape drives (standalone or in a library) to be dynamically shared between
    multiple NetBackup and Media Migrator servers. This option is supported only on
    NetBackup DataCenter servers. ...See also SSO.


    Multiple Data Streams (MDS)


    Policy (class) attribute that allows more than one data stream from a client to
    be simultaneously backed up. Note: This implies the global attribute Max Jobs
    Per Client has been modified to greater than one or a client database has been
    created using the bpplent command.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# multiplexing


    The process of sending data from multiple sources (clients) to a single destination
    (storage device), interleaving those streams onto one piece of media.'
