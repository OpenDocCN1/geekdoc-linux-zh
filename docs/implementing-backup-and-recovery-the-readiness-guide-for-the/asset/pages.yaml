  md: 'UNSET and UNSET_ALL. These directives are used to control policy-specific directives
    such as set. An example would be if you had a policy type that supported the set
    command and wanted the set command passed to the first two streams but not the
    last, UNSET or UNSET_ALL can be used at the beginning of the third stream to prevent
    it from being passed to the last stream.


    ```

    NEW_STREAM

    set despatch=/etc/home

    /tmp

    /use

    NEW_STREAM

    /export

    NEW_STREAM

    UNSET_ALL

    /var

    ```


    Auto-discovery streaming mode is enabled if ''Allow multiple data streams'' is
    selected and ALL_LOCAL_DRIVES is not the first line in the file list. If this
    is the case, the file list is sent to the client, which precesses the list and
    splits the backup into streams.'
