  md: '# Block Level Database Backups Using Database Editions


    While database agents are very helpful in the backup process, sometimes they are
    not. For backups of Oracle database, VERITAS Software offers an alternative. By
    combining the VERITAS Database Edition for Oracle with NetBackup for Oracle Advanced
    BL, you can do block-level incremental backups of your database. The VxFS Storage
    Checkpoint facility keeps track of blocks modified by the database since the last
    backup. This is a copy-on-write snapshot facility, which we discuss in detail
    later in the chapter. NetBackup with BL leverages this to back up only changes,
    an incremental backup. A database backup is done at the filesystem level, which
    means only changed blocks, not the changed files, are backed up. The VxFS Storage
    Checkpoint facility identifies changed blocks in real time, Block Backup does
    not need to search the entire database for the modified blocks. Block Backup saves
    time, decreases the amount of media required, and reduces CPU and overhead during
    backups. In addition, this allows more frequent backups, making backup images
    more up-to-date. BL Backup works as a block-level, incremental backup and supports
    both cold (offline) and hot (online) backup to meet database availability and
    performance needs.


    The Advanced BL Agent interfaces with RMAN (Recovery Manager) via the Proxy copy
    feature. Proxy copy requires System to Tape (SBT) API 2.0, which was introduced
    in Oracle 8.1.5. There are two types of Storage Checkpoints: Nodata and Fulldata.
    The Advanced BL Agent uses Nodata Storage Checkpoints for Proxy copy BL backups.
    Nodata Storage Checkpoints track changed VxFS filesystem blocks with a bitmap.
    With Nodata Checkpoints, the tablespaces are kept in hot backup mode for the duration
    of the backup. An added benefit of using the RMAN Proxy copy feature is that backup
    and restore operations are managed and controlled via RMAN, reducing administration
    complexity.


    If you choose not to RMAN, the NetBackup for Oracle Advanced BL Agent offers a
    script-based alternative. The script method uses both the Storage Checkpoint (described
    previously), as well as the Fulldata Storage Checkpoint. The Fulldata Storage
    Checkpoint differs from the Nodata in two ways: first, a copy of the changed filesystem
    block is copied into the Storage Checkpoint before the first write change is made
    to the block. Second, the tablespaces are left in hot backup mode only for the
    amount of time it takes to create the Storage Checkpoint.'
  merge: -1
