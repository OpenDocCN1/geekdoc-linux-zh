    +   * **Override policy volume pool.** This is similar to the storage unit selection
    but for volume pools.


    **Retention.** Here you specify how you want to keep the backups created by this
    schedule.


    **Media multiplexing.** This allows you to send data from multiple data sources
    to a single tape.\ After getting all the schedules configured, click OK if you
    are finished making changes to the policy; if you want to add more clients or
    change the file list, select Add, and the Clients tab or the Files tab, as appropriate.
    On the Files tab, you can select add directives. These work together with the
    attribute of multiple data streams to control how many data streams are actually
    started when a policy begins and how many data streams are from a specific client.
    On a Windows policy type and standard policy type, the directives are the same,
    with the exception of System_State, which is only applicable for Windows. In this
    list, we provide brief explanations of the common directives, but we strongly
    recommend reading the entire section on file directives in the system administrator''s
    guide.


    **ALL_LOCAL_DRIVES.** If the file list contains the ALL_LOCAL_DRIVES directive,
    NetBackup backs up the entire client but splits each drive (Windows NT) or filesystem
    (UNIX) into its own backup stream.


    **NEW_STREAM.** If this directive is the first entry in the file list, each occurrence
