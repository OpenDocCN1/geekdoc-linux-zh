  md: '# Evaluating Performance


    There are two primary locations from which Netback data performance statistics
    can be obtained for a NetBackup operation: the Netback Activity Monitor and the
    Netback All Log Entries report. The choice of which location to use is determined
    by the type of NetBackup operation you are performing: non-multiplex backup, or
    multiplexed backup.


    You can obtain statistics for all three types of operations from the NetBackup
    All Log Entries report. You obtain statistics for non-multiplex backup or restore
    operations from the NetBackup Activity Monitor (for restore operations they are
    available in the Activity Monitor (with the 4.5 release). For multiplexed backup
    operations, you can obtain the statistics from the All Log Entries report after
    all the individual backup operations which are part of the multiplexed backup
    are complete. In this case, the statistics available in the Activity Monitor for
    each of the individual backup operations are relative only to that operation,
    and not the actual throughput to the tape.


    There may be small differences between the statistics available from these two
    locations due to differences in rounding techniques between the entries in the
    Activity Monitor and the entries in the All Logs report. Therefore, we suggest
    you pick one location to obtain statistics and consistently use it to compare
    performance test runs.


    # Evaluating Performance Through the NetBackup Activity Monitor


    +   1. Run the backup or restore job (restore job statistics available only in
    the 4.5 release).


    +   2. Open the NetBackup Activity Monitor.


    +   3. Verify the backup or restore job completed successfully. A 0 should appear
    in the status column.


    +   4. View the details for the job by selecting the Details menu option, or double-clicking
    on the entry for the job.


    +   5. Select the Detailed Status tab.


    +   6. Obtain the Netback performance statistics from the following:


    +   - Started/Ended: These fields show the time window when the backup or restore
    job took place.


    +   - Elapsed: This field shows the elapsed time when the job was initiated to
    completion and can be used as an indication of wall clock time for the operation.


    +   - KB/sec: This is the data throughput rate.


    +   - Current Kilobytes Written: Compare this value to the amount of data. Although
    it should be comparable, the data will be slightly higher than administrative
    information, known as metadata, saved for the backed up data.


    For example, if you display properties for a directory containing 500 files, each
    1 MB in size, the directory size of 500 MB, or 524,288,000 bytes, which is equal
    to 512,000 KB. The Netback report may show 513,225 KB written, representing an
    extra 1,255 KB provided through viewing the directory''s properties. This is true
    for a fact. Subdirectory structures may differ due to the way the operating system
    used and available space on the media, and the operating system may be reporting
    how much space was allocated for the files in question, not how much data is actually
    there. For example, if the allocation block size is 1 KB, 1000 bytes will report
    a total size of 1 MB, even though 1 KB of data is all that exists. The greater
    the number of files, the larger this discrepancy may become.'
  merge: -1
  pgno: 287
