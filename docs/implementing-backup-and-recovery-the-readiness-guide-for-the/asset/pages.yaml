  md: '# NetBackup Server Performance


    This section lists factors to consider when you evaluate the NetBackup server
    component of the NetBackup data transfer to identify possible changes that may
    improve the overall performance of NetBackup.


    **Number and Size of Shared Data Buffers.** By default, NetBackup uses eight shared
    data buffers for a multiplexed backup, 16 shared data buffers for a non-multiplexed
    backup, 12 shared data buffers for a multiplexed restore, and 16 shared data buffers
    for a non-multiplexed restore.


    To change these settings, create the following file():


    ```

    <install_path>\NetBackup\db\config\NUMBER_DATA_BUFFERS

    <install_path>\NetBackup\db\config\NUMBER_DATA_BUFFERS_RESTORE

    ```


    These files contain a single integer specifying the number of shared data buffers
    NetBackup will use.


    If the NUMBER_DATA_BUFFERS file exists, its contents will be used to determine
    the number of shared data buffers used for multiplexed and non-multiplexed backups.


    If the NUMBER_DATA_BUFFERS_RESTORE file exists, its contents will be used to determine
    the number of shared data buffers used for multiplexed restores.


    By default, NetBackup uses 64 KB (65536 bytes) as the size of each shared data
    buffer. A single I/O operation is performed for each shared data buffer. Therefore,
    this size must not exceed the maximum block size for the tape device or operating
    system. For Windows systems, the maximum block size is generally 64 KB, but in
    some cases customers are using a larger value.


    For this reason, the terms ''tape block size'' and ''shared data buffer size''
    are synonymous in this context.


    The NetBackup media server will query the tape device for its maximum block size,
    and cause the backup operation to fail if the shared data buffer size exceeds
    the value that is returned.


    > **Note:

    Some tape devices may not reliably return this information. It is critical to
    perform both backup and restore testing if the shared data buffer size is changed.
    If all NetBackup media servers are not running in the same operating system environment,
    it is critical to test restores on each of the NetBackup media servers. For example,
    if a UNIX NetBackup media server is used to write to tape with a shared data buffer
    (block size) of 256 KB, it is possible that a Windows NetBackup media server will
    not be able to read that tape. In general, we strongly recommend you test restore
    as well as backup operations.


    To change the shared data buffers, create the following file:


    ```

    <install_path>\NetBackup\db\config\SIZE_DATA_BUFFERS

    ```


    This file contains a single integer specifying the size of each shared data buffer
    in bytes. For example, to use a shared data buffer size of 32 KB, the file would
    contain 32768.


    Note that the size of the shared data buffers used for a restore operation is
    determined by the size of the shared data buffers in use at the time the backup
    was written. This file is not used by restores.'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'In general, the number and size of shared data buffers can be used to calculate
    the amount of shared memory required by NetBackup using this formula:


    ```

    (number_data_buffers * size_data_buffers * number_tape_drives * max_multiplexing_setting)

    ```


    For example, if the number of shared data buffers is 16, the size of the shared
    buffers is 64 KB, there are two tape drives, and the maximum multiplexing setting
    is four. Following the above, the amount of shared memory required by NetBackup
    is:


    ```

    (65536 * 16) * 2 * 4 = 8 MB

    ```


    See below for information about how to determine if you should change these settings.


    **Parent/Child Delay Values.** Although rarely changed, it is possible to modify
    the parent and child delays for a process.


    **To change these values, create the following files:


    ```

    <install_path>\NetBackup\db\config\PARENT_DELAY

    <install_path>\NetBackup\db\config\CHILD_DELAY

    ```


    These files contain a single integer specifying the value in milliseconds to use
    for the delay name of the file. For example, to use a delay of 50 milliseconds,
    the PARENT_DELAY file would contain the integer 50.


    See below for information about how to determine if you should change these settings.


    The following section refers to the bptm process on the media server during back
    and restore operations from a tape storage device. If you are backing up or restoring
    from a disk storage device, substitutebptm for bptm throughout the text. For example,
    to debug logging for a storage device, the following directory must be:


    ```

    <install_path>\NetBackup\logs\bptm

    ```


    # Using NetBackup Wait and Delay Counters


    During a backup or restore the NetBackup media server uses sets of shared data
    buffers to isolate the process of communicating with the tape from the process
    of interacting with the disk or network. Through the use of Wait and Delay counters,
    you can determine which process on the NetBackup media server, the data producer
    or the data consumer, has more often.


    Achieving a good balance between the data producer and the data consumer is an
    important factor in achieving optimal performance from the NetBackup server component
    of the NetBackup data transfer path.


    # The Two-Party Communication Process


    The two-party communication process differs depending on whether the operation
    is a backup and restore and whether the operation involves a local client or a
    remote client.


    # Local Clients


    When the NetBackup media server and the NetBackup client are part of the same
    system, the NetBackup client is referred to as a local client.


    **Backup of Local Client.** For a local client, the bpkar32 process reads data
    from the disk during a backup and places it in the shared buffers. The bptm process
    reads data from the shared buffer and writes it to tape.'
