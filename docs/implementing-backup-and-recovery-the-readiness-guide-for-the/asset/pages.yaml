    # WHAT TO ASK BEFORE DECLARING A DISASTER


    Operations, IT management, or facilities may declare a disaster and invoke the
    recovery process, depending on the answers to the following questions:


    +   - Are you affected any of flash floods in your area?

    - Has this affected any of the critical data centers?

    - Are your facilities experiencing water problems, such as flood, broken pipe,
