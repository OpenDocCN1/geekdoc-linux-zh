  md: '# Evaluating System Components


    In addition to NetBackup''s performance, you should also verify that common system
    resources are in adequate supply. You may want to use the Windows Performance
    Monitor included with Windows NT or 2000. For information about using the Performance
    Monitor, refer to your Microsoft documentation.


    The Performance Monitor organizes information by object, counter, and instance.


    An object is a system resource category, such as a processor or physical disk.
    Properties of an object counters. Counters for the Processor object include %Processor
    Time, and Interrupts/sec. Duplicate counters are handled via instances. For example,
    to monitor%Processor Time of a specific CPU on a multiple CPU system, the Processor
    is selected, then the %Processor Time counter for that object is selected, followed
    by the specific CPU instance for the counter.


    When you use the Performance Monitor, you can view data in real time format or
    collect the data in a log for future analysis. Specific elements to include CPU
    load, memory usage, and disk load.


    # Monitoring CPU Load


    To determine if the system has enough power to accomplish the requested tasks,
    monitor the % Processor counter for the Processor object to determine how the
    CPU is working, and monitor the Processor Queue Length counter for the System
    to determine how many processes are waiting for the processor.


    %Processor, values of 0 to 80 percent are generally considered safe. Values from
    80 percent to 90 percent indicate that the system is being pushed hard, while
    values above 90 percent indicate that the CPU is a bottleneck.


    Spikes approaching 100 percent are normal and do not necessarily indicate a bottleneck.
    However, if sustained loads approaching 100 percent are observed, effort to tune
    the system to decrease process load or upgrade to a faster processor should be
    considered.


    SustainedProcessor Queue Length greater than two indicate too many threads are
    waiting to be executed. Correct the Performance Monitor may be a tracking-related
    counter. If you see a queue length of 0, verify that a non-zero value can be displayed.


    The default case for the Processor Queue Length may not be equal to 1. Be sure
    to read the data correctly. For example, if the default case is 10x, then a reading
    of 40 actually means that only 4 processes are waiting.


    # Monitoring Memory Use


    Memory is a critical resource for increasing the performance of backup operations.
    When you examine memory usage, information on:


    +   **Committed Bytes.** Committed Bytes displays the size of virtual memory that
    has been committed, as opposed to reserved. Committed memory must have disk storage
    available or may not require the disk storage because the main memory is large
    enough. If you encounter problems with page swapping.


    +   **Page Faults/sec.** Page Faults/sec is a count of the page faults in the
    processor. A page fault occurs when a process refers to a virtual memory page
    that is not in its Working Set in main memory. A high Page Fault rate may indicate
    insufficient.'
