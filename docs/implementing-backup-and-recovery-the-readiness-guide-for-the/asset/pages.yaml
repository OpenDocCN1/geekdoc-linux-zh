  md: '# Appendix A: Command-Interface Guide


    Just about any backup and recovery application you will offer a graphical user
    interface (GUI). These are very helpful in the normal day-to-day operations, but
    there are times when they aren''t what you are looking for. If you want to access,
    control, or configure your backup using a slow-speed dial-up line, a GUI can be
    painful to use or may not work at all. There are also situations where you might
    want to schedule your backups with a third-party scheduler. In cases, you you
    need to use a command-line interface (CLI). A good understanding of the CLI for
    backup and recovery applications gives you the ability to access, configure, control,
    and monitor backups and restores from a non-terminal or over a slow line. It also
    offers a method to interface the backup application with a third-party scheduler.


    In this appendix, we list the most common commands used for VERITAS NetBackup.
    We also define the command, complete list of the supported commands, with their
    options and switches, which can be found in the pages for NetBackup and in the
    Administrator''s Guide. There is a UNIX and Windows NetBackup System Administrator''s
    Guide and a UNIX and Windows Media Manager Administrator''s Guide. A useful companion
    on the CLI and greatly on its uses. For some point, if you find it enough, we
    will write it for UNIX NT and 2000 scripts, check out www.NetBackupCentral.com.


    # NetBackup Commands for UNIX


    +   - bp The NetBackup menu interface that lets users archive, backup, and restore
    files, directories, or raw partitions from their client workstations.


    +   - bpdam The NetBackup menu interface for administrators, who an administrator
    can use to configure NetBackup and monitor its operations. bpdam requires root
    privileges.


    +   - barchive Archives files to the NetBackup server by processing files that
    you list on the command line or in the file you specify with the -listfile option.
    Any file path entered can be a file or directory name. If the list of files includes
    a directory, barchive archives all files and subdirectories of that directory
    starting at the directory.


    +   - bpauthorize Manages the authorizetxt file on multiple servers. This command
    is available only on NetBackup master servers and sets up authentication files
    on NetBackup servers and clients according to the options that are specified with
    the command.


    +   - bpasync Synchronizes authentication files on NetBackup servers and clients.
    This command is available only on NetBackup master servers and sets up authentication
    files on NetBackup servers and clients according to the options that are specified
    with the command.


    +   - bpbackup Back ups files to the NetBackup server. If issued on a client,
    bpbackup starts a user backup that is the equivalent to what is performed by using
    the interface on the client. This type of backup can be started from any NetBackup
    client in order to back up from that client. The bpbackup command processes the
    files that you list on the command line or in the file you specify with the -listfile
    option. A file path can be a file or directory name. If the name includes a directory,
    bpbackup backs up all files and subdirectories of that directory starting at


    the master server, bpbackup starts an immediate-manual backup of a client. This
    variation requires the -i option on the bpbackup command and is available only
    to the administrator on the master server. It is the equivalent of starting a
    manual backup from the NetBackup administrator''s interface. Use the -h option
    to specify the host.'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'bpbackupdb Initiates a backup of one or more NetBackup image catalogs specified
    on the command line. It also backs up the default of NetBackup catalogs, unless
    the command line contains --nodbackup. If the command line specifies a destination,
    the backup is stored there. Otherwise, the backup is stored at the default location
    for the NetBackup internal databases, which are called catalogs.


    bpchangeprimary Promotes a copy of a backup to the primary copy.


    bpclient Manages clients on a master server.


    bpconfig Modifies or displays the global configuration attributes for NetBackup.
    These attributes affect operations for all policies and clients.


    bpdbjobs Interacts with the NetBackup jobs database and is useful in scripts or
    as a command-line tool. Use bpdbjobs to print the entry jobs database, print a
    summary, delete done jobs, cancel incomplete jobs, and clean old jobs.


    bpdbm NetBackup database manager daemon responds to queries related to the NetBackup
    internal databases, which are called catalogs. bpdbm must be running in order
    for NetBackup commands and utilities to work properly. This daemon runs only on
    the master server and can be started by the administrator.


    bpduplicate Creates copies of backups created by NetBackup; can also change the
    primary copy in order to enable restoring from a duplicated backup. The primary
    copy is used to satisfy restore requests and is initially the original copy.


    perror Displays NetBackup status and troubleshooting information or entries from
    the NetBackup error catalog. It displays information from either the same source
    as the onlinehooter (in the Activity Monitor or Reports applications) or from
    the NetBackup error catalog.


    bpexdate Changes the expiration date of backups in the image catalog and it is
    also used to change the expiration of removable media in the NetBackup media catalog.


    bpimagelist Queries the NetBackup image catalog and produces a report on the status
    of the NetBackup images. It will produce two types of reports:


    +   - Report images satisfying a set of criteria (if -media is absent)

    - Remove on removable media satisfying a set of criteria (if -media is absent)


    bpimedia Queries the NetBackup image catalog and reports on the NetBackup images.
    It can produce two reports:


    +   - An Images-on-Media report

    - A Spanjang report


    bpimport Imports NetBackup and Exec backups that are expired or are from another
    NetBackup or Backup Exec server.


    bplabel Writes a NetBackup label on tape media. Labeling is required only for
    media that was used for NetBackup catalog backups or by a non-NetBackup application.
    You can also use it to assign specific media IDs.'
