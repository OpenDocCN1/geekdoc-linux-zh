  md: '# Capacity Planning


    In a previous chapter we discussed how to plan for your initial backup architecture,
    including the following considerations:


    +   * What data to back up

    * How much data to back up

    * The rate of change for that data


    Capacity planning is a very similar but easier exercise, since we have most of
    the information already in our hands. Using the information gathered during our
    interview of the data owners, you should be able to extrapolate an estimation
    of how fast the data will grow. Most database administrators that we have talked
    to have a very good idea of the percentage of growth within their databases. Make
    sure you ask these questions during your interview phase with to make this part
    of your capacity planning as smooth as possible. Here are a few sample questions
    to ask data owners:


    +   * How large is your/database?

    * What percentage of change happens to your data daily?

    * Is there a particular point when the data changes more than usual?

    * How much of that change is actual data growth?

    * Can you anticipate an annual percentage of growth?

    * What are your recovery expectations?


    The most important part of capacity planning is determining where your data plateaus
    during the backup schedules and retentions you have subscribed. It is the plateau
    that will allow you to properly size your environment. The charts and tables to
    follow graphically represent the equations we used to arrive at the results in
    our examples. Even though these equations look daunting, trust us, it is only
    and we will explain in detail how we are achieving these numbers.


    Table 9.1 shows a sample of the data we have collected at a client site with regard
    to growth and capacity planning. By making things easy, we converted frequency
    and retention levels to days.


    # Table 9.1: Capacity Planning Chart


    | SERVER | AMOUNT OF DATA | FULL FREQUENCY (DAYS) | RETENTION (DAYS) |

    | --- | --- | --- | --- |

    | Mammoth | ~100 GB | 7 | 28 |

    | INCREMENTAL FREQUENCY (DAYS) | RETENTION (DAYS) | PERCENTAGE OF STORAGE | REQUIRED
    STORAGE |

    | 1 | 14 | 10% | 520 GB |


    Here we will present the formula we used to calculate the required backup storage
    media needed for the server, Mammoth, based on the maximum retention level, or
    28 days. The percentage of change from our initial interview of the data owners,
    who may know the estimated percentage of change, or by simply taking a rough estimate,
    for the sake of example we are going to use 10 percent as our rate of change.
    While this rate of change may seem high or low, it makes the examples much easier
    to visualize. If you are using VERITAS NetBackup, you may use your File System
    Analyzer tool, which may give you a more accurate value.


    The chart in Figure 9.1 visually represents the equation used to define the total
    capacity required for the full backups. While you may not need a chart to understand
    how much data a full backup will take, this graph and these equations are a consistent
    method for which to use in modeling your backups.'
