  md: '# Summary


    In this chapter, we looked at some things to consider when you run into problems
    and have to troubleshoot your backup and recovery system. We looked at some of
    the tools and also provided some real-world examples to give you a better idea
    of how to approach problems or performance issues.


    In the next chapter, we look at ways to handle growth in your enterprise and the
    accompanying growth in your backup and recovery requirements.'
