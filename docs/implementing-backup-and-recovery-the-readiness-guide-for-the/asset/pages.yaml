    \ as possible; if you are using VERITAS NetBackup, use the NetBackup Configuration\
    \ Verification Utility (NCVU) found on VERITAS' support Web site. It will make\
    \ running this inventory much easier. For Windows NT and 2000 servers, formal\
    \ software packages are available that will help create this type of information.\
    \ How it is gathered is not the issue; the fact that you gather it all deemed\
    \ critical is what is important.\n\n# Architecture Inventory\n\nThe reason we\
    \ included this heading under Hardware Inventory is that we feel the two go in\
    \ hand. We want to stress the importance of diagrams that illustrate your network\
