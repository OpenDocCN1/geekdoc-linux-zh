  md: '# NetBackup Network Performance


    This section lists factors to consider when you evaluate the network component
    of the NetBackup data transfer path to identify those that may improve the overall
    performance of NetBackup.


    **Network Load.** There are two key considerations to monitor when you evaluate
    remote backup performance:


    +   - The amount of network traffic

    - The amount of time that network traffic is high


    Small bursts of high network traffic for short durations will have some negative
    impact on the throughput rate. However, if the network traffic remains consistently
    high for a significant amount of time during the operation, the network component
    of the NetBackup data transfer path will become the bottleneck. Always try to
    schedule backups during times when network traffic is low. If your network is
    heavily loaded, you may wish to implement a secondary network which can be dedicated
    to backup and restore traffic.


    **NetBackup Media Server Network Buffer Size.** The NetBackup media server has
    a parameter that you can use to adjust the size of the Windows2 network communications
    buffer to receive data from the network (backup) or write data to the network
    (a restore). The parameter value that you use to call the (setsocket()) Windows2
    API to set the network buffer size for backups (RCVBUF) and restores (SNDBUF).


    The default value for this parameter in release 3.4.1 and earlier is 32032 bytes.
    In release 4.5, the default value you use is derived from the NetBackup data buffer
    size (see below for more information about the data buffer traffic) using the
    following formula:


    For backup jobs: `<buffer_size> * 4` + 1024


    For restore jobs: `<buffer_size> * 2` + 1024


    Because the default value for the NetBackup data buffer size is 65536, this formula
    results in a default value of 263168 bytes for backups and 132096 bytes for restores.


    To set this parameter, create the following files:


    +   - `<install_path\NetBackup\NET_BUFFER_SZ>`n- `<install_path\NetBackup\NET_BUFFER_SZ_REST>`n-
    (in 4.5, not used in earlier releases)


    These files contain a single integer specifying the network buffer size in bytes.
    For example, to use a network buffer size of 64 KB, the file would contain 65536.
    If the files contain the integer 0 (zero), the setsocket() Windows2 API will be
    called and the system default value for the network buffer size will be used.


    If the NET_BUFFER_SZ file exists, its contents will be used to specify the network
    buffer size for both backup and restores.


    If NET_BUFFER_SZ_REST file exists (only in 4.5), its contents will be used to
    specify the network buffer size for restores.


    If both files exist, the NET_BUFFER_SZ file will be used to specify the network
    buffer size for backups, and the NET_BUFFER_SZ_REST file will be used to specify
    the network buffer size for restores.'
