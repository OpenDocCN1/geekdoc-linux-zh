  md: '# Summary


    This appendix should give you a jump-start on creating business impact analyses
    for your company or organization. Remember to use an agenda when you conduct an
    interview and keep it on a professional level at all times. This is a very critical
    business function you are attempting to document and thus requires focus. Stay
    with the agenda, keep focused, and if you have a difficult with the interviews
    or are not comfortable with interviewing, we suggest you role-play with other
    members of your IT staff. Write down notes for yourself if you find that you drift
    during the role-playing, and create reminders to help you maintain the appropriate
    level of quality that you are attempting to plan for. This is a dynamic process,
    so as the interview takes place, you may have other questions that come up. Write
    them down on your agenda, and make sure to ask them during the meeting, keeping
    in mind that the question should be within the context of the agenda you have
    set forth. Also, ask if you can record the meeting for the purposes of increasing
    the quality of your analysis.'
