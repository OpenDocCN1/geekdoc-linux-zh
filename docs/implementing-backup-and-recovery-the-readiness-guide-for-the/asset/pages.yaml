    # Disaster Recovery


    For systems that are part of your DR strategy, you need to ensure you have all
    the data required to rebuild a system in an easily identified group. You must
    also ensure you have all the supporting data necessary to recover these systems.
    When including the OS data as well as everything required for the backup application
    in order to do full system restores. Using a vault-type system where backups are
    off-site to be restored in conjunction with the backup application greatly helps
    this task.


    The biggest challenge is identifying which systems and applications are critical
    and how fast they have to be online. A part of the DR strategy should include
    the prioritizing of recovery these. The speed of recovery can dictate some of
    the backup decisions. It is very likely that systems are a part of your DR strategy
    might also require protection within one of the other systems. You would configure
    your backup and recovery system to provide the DR protection in any other requirements.
    Keep in mind that when you declare a disaster it may mean you no longer have access
    to your primary site. In any reports, documentation, call lists, operations guides,
    and so on you may require that to be in an off-site location along with your DR
    backup. Many DR test plans fail because one document or component was overloaded.


    # Application Failure


    The data needs protection against application corruption usually requires more
    frequent backups. In these instances, the use of both incremental and full backups
    is very important. The highest risk of application data corruption is database
    applications, so you should develop a specific backup strategy for these applications.
    Most of the backup applications can interface with the database applications to
    allow full and incremental backups that can be either hot (with the database still
    active) or cold (with the database down). The systems that require this type of
    data protection might also be part of your DR strategy, so they should be of multiple
    strategies.


    # User Error


    For the data that is user-generated or -accessed, you might want to consider a
    backup strategy for user error protection. This might also include mailboxes,
    but in these instances, the backup and recovery strategy is dictated by the application.
    The very nature of user error protection implies that there are many more instances
    of single file or directory stores, the backup strategy needs to support this.
    This strategy would generally involve more incremental backups. The frequency
    of backups is on important consideration if it involves data that users are deleting
    and restoring on a regular basis. You would also want to ensure the backups are
    configured to facilitate faster browsing and recovery.


    # Service Level Agreements


    You might find some of the data being backed up to meet a specific service level
    agreement (SLA). The backup strategy will depend on the expectation. It is very
    possible that the SLA will be for a recovery requirement. If that is the case,
    the backup strategy will be governed by these requirements. This is often the
    situation where a dedicated backup and recovery administration staff provides
    this service for a particular company or agency. The other groups or business
    units become the customers of the backup group and have specific SLAs. This will
    usually dictate the backup strategy. This is also the case in hosting centers.
    It is very important to exactly determine what the exact requirements are. These
    can involve any of the backup types mentioned, with the'
