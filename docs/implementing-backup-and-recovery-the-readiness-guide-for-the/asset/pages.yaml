- img_proc: true
  md: '# N


    # NetBackup Client Service


    NetBackup Windows NT/2000 service that runs on clients and servers and listens
    for connections from NetBackup servers and clients in the network. When a connection
    is made, the service starts the necessary programs.


    # NetBackup configuration options


    On UNIX servers and UNIX and Macintosh clients, these settings are made in the
    bp.conf file. On Windows NT/2000 servers and Microsoft Windows clients, these
    settings are called properties and are made through the Backup, Archive, and Restore
    interface or the Configure-NetBackup window in the administration interface. With
    NetBackup 4.5 these can be set from the Java GUI through properties settings.


    # NetBackup Database Manager Service


    NetBackup Windows NT/2000 service that runs on the master server and manages the
    NetBackup internal databases (called catalogs). This service must be running on
    the master server during all NetBackup administrative operations.


    # NetBackup databases


    See catalogs.


    # NetBackup Device Manager Service


    The NetBackup Windows NT/2000 service that runs on a NetBackup server and starts
    the robotic control processes and controls the reservation and assignment of volumes.
    This service runs only if the server has devices under Media Manager control.
    The process is lidt, local tape interface interface daemon.


    # NetBackup properties


    Same as NetBackup configuration options. Called NetBackup properties on Microsoft
    Windows platforms and UNIX platforms with NetBackup 4.5.


    # NetBackup Request Manager Service


    The NetBackup Windows NT/2000 service that runs on the master server and starts
    the scheduler and receives requests from clients.


    # NetBackup Volume Manager Service


    A NetBackup Windows NT/ 2000 service that runs on a NetBackup server, remote administration
    of Media Manager, and manages volume information. The process is vmd.


    # nonrobotic


    See standalone.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# parameter file


    This is a bpVault term. The basic bpVault configuration requires setting up a
    parameter file to show which servers use, how many drives per server, which classes
    to duplicate (or eject), the name of the duplicate copy, the name of the vault,
    and the location for vault''s working subdirectories. Bpvault can have several
    vaults running on the same server simultaneously as they have different vaults
    and different pools. You may wish to append the vault name to the end of the parameter
    file, for instance, dup_param_V1, dup_param_V2, and so.


    # patch


    A program that corrects a problem or adds a feature to an existing release of
    software.


    # pending request


    When a request is made for a vault that is not in the robot or a standalone drive,
    Media Manager displays a pending request in the Device Monitor interface.


    # Picking List for Library


    Part of bpVault. Lists all of the VOLSERs or media IDs to be off-site to the Vaulting
    Vendor. This report is listed in numerical order by VOLSER number and should be
    used by operations to ensure all of the tapes retrieved from the Mail CAP are
    accounted for based on the report. The report contents are the same as the Distribution
    List for Library report with.


    # Picking List for Vault


    Part of bpVault. Lists all of the VOLSERs or media IDs that are to be returned
    from the Offsite Vendor, sorted numerically by slot number. This report is to
    be used by the Offsite Vendor to facilitate the retrieval of the tapes. This report
    may be blank if none of the VOLSERs have their expiration date. The report contents
