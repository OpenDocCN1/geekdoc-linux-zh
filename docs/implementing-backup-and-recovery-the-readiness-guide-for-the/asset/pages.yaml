    | AIT-2 | 21,1 | 50 | 27 sec | 2.6:1 |

    | AIT-3 | 42 | 100 | 27 sec | 2.6:1 |


    When you start actually figuring how many which kind of drive you will need, we
    recommend using the native transfer rates and capacities without compression.
    It is very difficult to estimate what kind of compression is very compressible
    rate you will experience, as it is totally dependent on the makeup of your data.
    Some data is very compressible, while other data will yield very little compression.
    If you your architecture based on no compression, the only surprises you should
    experience should be good ones; you will have plenty of capacity with room for
    growth.'
