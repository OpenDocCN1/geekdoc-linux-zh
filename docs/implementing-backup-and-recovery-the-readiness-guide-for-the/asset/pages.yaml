- img_proc: true
  md: 'As you identify all the systems in the enterprise, you should note the specific
    recovery requirements of each system. It is very helpful in setting up the backup
    strategy. If an order processing application can tolerate an eight-hour outage
    without severe consequences, for an incremental backup strategy that minimizes
    backup time at the expense of restore time be appropriate. For a retail application,
    on the other hand, where every minute of downtime means less sales, a strategy
    that replicates data in real time might be more appropriate, with its greater
    impact on application performance. The other item to note is the order in which
    these systems need to be recovered as part of your overall disaster recovery (DR)
    plan.


    # # Identify Data and Application Availability Requirements Backup


    As you assess the backup requirements of each system, you should also make sure
    you know which of the databases must be kept ''hot'' during the backup and which
    can be shut down to ''cold''. There are performance trade-offs involved with backing
    up a database while it is online, but this is necessary. This is due to the increased
    IO activity, since database activity is continuing, along with additional backup
    IO. There are other methods of handling database backups, either hot or cold,
    frozen image technologies and possibly off-host backup methods. These are discussed
    later in the book.


    # # Determine the Best Way to Move the Data


    You have several options for moving the data from disk to tape. Each has its advantages
    and disadvantages. The methods include the following:


    +   **Files.** This involves using the operating system to read all the files
    within the backup set and move data from disk to tape. This method has more operating
    system overhead but allows for single files to be backed up and restored. It also
    enables the application to check each file to determine access or modification
    time if incremental backups can be performed.


    +   **Volumes.** An entire volume can be backed up without reading the filesystem
    structure but by doing a bit-by-bit copy of the data from disk to tape. This is
    called a *raw backup*. This method allows for much faster data transfers but in
    general does not allow for single-file backups and restores. It also does not
    allow incremental backups. This method results in an entire volume being backed
    up, even the portions that do not contain valid data.


    +   **Block level.** If the filesystem has enough information about the files,
    it is possible to determine which blocks have changed. If the backup application
    can interface with the filesystem, you can back up the changed blocks. This type
    of backup is called *block level incremental*.


    +   **Mapped raw.** Some backup applications, such as VERITAS Software''s NetBackup,
    can map a raw volume and perform a raw backup while retaining the filesystem map
    so single files can be restored. This type of backup is discussed in more detail
    in the section on frozen image backups in [Chapter 7](''Evaluating Other Backup-Related
    Features and Options.'')


    +   **Off-host backup.** This is a mechanism where data is moved from disk to
    tape without the application host being directly involved in the disk reads or
    tape writes. This type of backup is discussed in more detail in Chapter 7.


