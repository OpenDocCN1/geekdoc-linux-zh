  md: '# Where Do We Start?


    As you start planning your backup and recovery system, you need to start gathering
    detailed information on your enterprise. You need to know the network layout for
    all systems. If your enterprise is made up of multiple networks, you need to know
    how much data resides on each and the speed of each network or subnet. Obviously,
    it is much faster to move data across a 100Mb/sec (100Base-T) network than a 10Mb/sec
    (10Base-T) network. You need to understand the network layout and architecture
    to identify potential bottlenecks and take them into consideration as you architect
    your backup and recovery system. This is also necessary in determining where to
    put backup servers (see later chapter).


    As look at the network that makes your enterprise, you need to understand the
    network speed and topology. You also need to understand the disk layout, especially
    for the larger file servers and database servers, or who has this knowledge. You
    should watch for bottlenecks involving the disks, as well as the networks, SCSI
    connections, and any other appropriate I/O paths. When considering the decisions
    that need to be made when architecting backup strategy, the two things you must
    keep in mind are the effect on normal production and on restore speed and performance.
    This usually involves making the necessary cost trade-offs to achieve the best
    of all worlds.


    Here are some of the steps necessary for you to gather the information needed
    before establishing the backup strategy:


    +   1. Identify all the systems, the order in which they would need to be recovered
    following a disaster.


    +   2. Identify all networks involved, including speed of network and existing
    load at various times throughout the 24-hour day and night.


    +   3. Locate all backup-related hardware, such as tape drives and libraries.


    +   4. Identify recovery requirements.


    +   5. Identify data and application availability requirements during backup.


    +   6. Determine the best way to move the data.


    We discuss each of these points in a little more detail in the sections that follow.


    # Identify All Systems


    You need to identify all systems that need to be backed up. Generally this will
    be most if not all of the systems in the enterprise, with the exception of user
    workstations. There may be some systems that are basically replicated systems
    and can be easily re-. In general, it is only necessary to back up one of these
    systems. The following information should be gathered for all the systems:


    +   - Amount of data


    +   - Speed of system


    +   - Number and type of networks


    +   - Type of data-database or filesystem?


    +   - Priority of recovery in DR


    +   - Tape drive or library installed?


    # Identify All Networks Involved'
