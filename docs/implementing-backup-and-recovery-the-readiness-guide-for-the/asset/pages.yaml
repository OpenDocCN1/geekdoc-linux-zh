    Another method similar in look and feel is SAN.


    # Storage Area Network (SAN)


    Sometimes called a TAN, for tape area network (if that''s all being hosted on
    the switches), a SAN usually consists of some kind of fiber or fabric switch,
    host bus adapters (HBAs) in the servers, and a zoning configuration on the switches
    to ensure proper routing of devices and information. A SAN is very similar to
    what you are used to with traditional networking. A LAN, for instance, consists
    of a switch or even a hub that has servers and other computing devices attached
    to it for the purposes of sharing resources. The mainly purpose of a SAN is to
    share resources, but instead of a 100-Mbps switch, it is a fiber switch. Not only
    can servers attach to it but also storage devices. A SAN is not as complex as
    you might think. Really, if you think about it, networking is just plumbing. You
    have a variety of pipes that connect in order to deliver something. In a home,
    it''s wait; in a data center, the complexity of plumbing that allows the sharing
    of resources in a very efficient and surprisingly fast manner.


    Figure 9.12 is a basic design of a SAN, two SAN routers for redundancy, SCSI-to-Fibre
    bridge in order to bring the tape drives into the SAN, dual HBAs in the servers,
    and a master server, all connected to the SAN switches. This type of configuration
    would enable the data to be read from the SAN-attached clients and written to
    the SAN attached tapes, without having to traverse the public network with large
    amounts of data.'
