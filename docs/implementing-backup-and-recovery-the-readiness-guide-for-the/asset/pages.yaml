  md: '# Catalog Backup


    The installation and configuration is almost complete. All that really remains
    to configure the application to back up its own database. The Getting Started
    walks you through the process, or you can do it directly from the Administrative
    Console. It is important to complete this step so you can protect your environment.
    The wizard prompts you for the information needed to set up this protection. You
    are to provide the media server where the catalog backup will be performed, the
    paths to all the critical data on the master, the names of all the media servers,
    and the paths to their


    Figure 5.32 shows the Catalog Backup Wizard.


    The critical data paths should always be included for the master server are as
    follows:


    +   - /usr/popen/netbackup/db. Automatically created for master during installation

    - /usr/popen/volmgr/database. Automatically created for master during installation

    - /usr/popen/var. Automatically created for master during installation

    - /usr/popen/db. Must be manually added


    You will also want to configure the catalog paths for all media servers. These
    must be backed manually.


    +   - media_server_name:/usr/popen/netbackup/db/media

    - media_server_name:/usr/popen/volmgr/database

    - media_server_name:/usr/popen/var


    After setting up the file paths to ensure all the data will be backed up, you
    need to configure the destination for these backups. You can either have the catalogs
    sent to tape or disk. NetBackup can use two different destinations and rotate
    between the two on each backup. If you select Disk, you need to identify an absolute
    path to be the store of the catalog. If you select Tape, you must select one or
    two volumes. Once a catalog backup has been sent to tape, that tape cannot be
    used for normal backups without it being manually relabeled. You can configure
    configure NetBackup to use a tape for one destination and a disk for the other.
    In this situation, every backup will go to tape and every other will go to disk.
    The catalog backups do not append tape. The tape is rewound, and the previous
    image is overwritten. The last decision for the catalog backup is the schedule.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_80_0.png)


    Figure 5.32: NetBackup Catalog Backup Wizard.


    The choices are to back up the catalog


    After each session of scheduled, user, or manual backups. Back the catalogs after
    any session that results in the creation of at least one successful backup or
    archive. This includes automatic, manual, and user backups.'
  merge: -1
  pgno: 80
