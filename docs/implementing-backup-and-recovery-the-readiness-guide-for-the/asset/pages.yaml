- img_proc: true
  md: '# Configuring NetBackup


    In this section, we go through the steps for configuring NetBackup. The steps
    include configuring the physical devices-tape or optical as well as configuring
    the storage units, which may be tape, optical, or disk, and then finishing up
    by configuring a policy. The policy is the who, what, when, and how of NetBackup
    configuration. It is best to truly think about the implementation of how the backup
    policies should be configured, executed and so on. Often, when we are asked to
    perform NetBackup assessments, the policy structure that people want to spend
    most of their time on. Unfortunately very little time is given to the overall
    structure and task of creating the backup policies, and it''s the one that can
    cause the most pain down on the road.


    # Devices


    After the server software is installed on the master and any media servers, the
    next step is to configure the backup devices. During the installation, you should
    have supplied the name of the master server and any media servers. This allows
    the install process to build the basic server configuration file. All of the physical
    devices must be visible to the operating system on the media server, and the appropriate
    devices must exist. VERITAS Software provides a document titled Veritas NetBackup
    DataCenter 4.5 Manager Device Configuration Guide to assist in the process. This
    document guides you in configuring the system-specific devices to access the backup
    devices.


    After ensuring the operating system has access to the physical storage devices,
    you can now configure the backup application to use these devices. With most server
    platforms and with most robotic devices, the device configuration can be completed
    using the Device Discovery and Configuration Wizard. At the end of the installation
    process, you were prompted to start all the daemon processes. If you selected
    not to start the processes, you will need to start them before continuing the
    configuration process. There are a couple of ways to start all the processes.
    If you are on a UNIX system you can execute the script /usr/open/netbackup/bin/initdb
    and /usr/open/volmgr/bin/itid. This should start all the necessary daemons. On
    a Windows master, you can use Control Panel, Administrative Tools, Services to
    start the NetBackup processes.


    With the daemon processes running, you can start the administrative interface
    by issuing the following command on a UNIX system: /usr/open/netbackup/bin/jnbSA.
    This starts the Java GUI. The first thing you need to do is log in as either root
    or as designated non-root administrator on the login screen.'
