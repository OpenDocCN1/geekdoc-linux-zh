    we could only write to NUL for all of our backups, our performance issues would
    not get any worse. But we don''t want to show-for for it, so we can''t. If that
    if you do not have any negative effects on your environment. Particularly with
    this one, if you will be unable to restore any data from storage units, because
    the data will simply not be there.


    So here''s the reason we want to run this type of test. First of all will let
    us know how NetBackup is processing the data. Could there be inherently anything
    wrong with our NetBackup configuration? Hopefully part of this test will help
    us to get a bit clearer. The second reason we want to run this test, is after
    we validate our NetBackup Server configuration has been ruled out the culprit,
    the client is performing well with its local test, we can test the backup from
    the client to the server across the network.


    Here''s how we begin:


    +   1. Create a storage unit even if we have some recommended that you create
    a new one and call it DISK_TEST or something similar.

    2. Now touch /usr/open/netback/bpdm_dev_null for the WINTEL systems, create an
    empty file bdpm_dev_null in the NetBackup directory.

    3. Run your backup.


    I usually create a backup policy that I use for ad hoc backups or testing . You
    may want to do something similar use any modifications of your production backup
    policies. When you decide to come, make sure the DISK_TEST storage unit is used
    by the test backup policy. When this backup job runs, the fragments will be created
    but the file length will remain 0 and bdpm will write the image to the bit-bucket
    (/dev/null).


    > Note:

    When you back up to a disk storage unit, bptm (backup tape manager) daemon or
    process will not be invoked, after the test proves to be successful, then we may
    be looking at a issue with regard to shared memory and tape buffers.


    Since we are deleting all the image data to NUL, we will not be able to restore
    any of that data we backed up during our test. This is true for ALL disk storage
    units on this particular media server. You must remember to DELETE bdpm_dev_null
    after your testing is complete.


    If you follow the test, you should see the following in bdpm debug log for backups:


    ```

    > really writing to /dev/null

    ```


    This tells us we have created the storage unit for this test and that any other
    subsequent backups to a disk storage unit on this media server will write to /dev/null.'
