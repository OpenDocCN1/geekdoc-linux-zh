  md: '# Evaluating Performance Using the All Log Entries Report


    +   1. Run the backup or restore job.


    +   2. Run the All Log Entries report from the NetBackup reports in the NetBackup
    Administrative Console release 4.5, or the NetBackup Reports GUI in earlier releases.
    Be sure that the Date/Time Range you select covers the time period during which
    the job was run.


    +   3. Verify that the job completed by searching for an entry such as the ''requested
    operation was successfully completed'' for a backup, or ''successfully completed
    (restore) backup id...'' for a restore.


    +   4. Obtain the NetBackup performance statistics from the entries in the report.
    (Note that the entries shown are based on release 4.5. The entries for earlier
    releases will be the same or similar.)


    | ENTRY | STATISTIC |

    | --- | --- |

    | started backup job for client <name>, policy schedule <name> on storage unit
    | **Date** and **Time** fields for this entry show the time at which the backup
    job started. |

    | successfully wrote backup id <name>, copy <number>, Kbytes | For a multiplexed
    backup, this entry shows the size of the individual backup and the **Date** and
    **Time** fields show the time at which the job finished writing to the storage
    device. The overall statistics for the multiplexed backup and data throughput
    rate to the storage device are found in a subsequent entry below. |

    | successfully wrote of <number> multiplexed backups, total Kbytes <number> at
    Kbytes/sec | For multiplexed backups, this entry shows the overall statistics
    for the multiplexed backup group including the data throughput rate. |

    | successfully wrote backup id <name>, copy <number>, fragment <number> at Kbytes/sec
    | For non-multiplexed backups, this entry essentially combines the multiplexed
    backups in the previous two entries into one entry showing the size of the backup
    job, the data throughput rate, and the time, in the **Date** and **Time** fields,
    at which the job finished writing to the storage device. |

    | requested operation was successfully completed | **Date** and **Time** fields
    for this entry show the time at which the job completed. This value is later than
