  md: '![](img/acb44d4c8cce95a9dfc81e127fceac76_94_0.png)


    To provide you with a greater understanding of what NetBackup and Media Manager
    are doing, we have included the command-line equivalents for each of the reports
    below and a brief description of what processes are used and databases that are
    touched.


    To run the media list report using the command line, you may issue the following
    command either through NT/900 or UNIX server:


    ```

    /usr/opencv/netbackup/bin/admincmd/bpmedlist -U -h <MEDIA SERVER>

    c:\Program Files\Veritas\NetBackup\bin\admincmd\bpmedlist.exe -U -h

    <MEDIA SERVER>

    ```


    If you run this command from the master server without specifying a media server,
    the master will report on all active media servers in your network. These CLs
    always report to STDOUT, so if you wanted to keep this report you should redirect
    STDOUT somewhere else, such as a file, printer, or mail recipient. A UNIX term,
    STDOUT, or standard output, refers to the screen or monitor. Similarly, STDIN,
    or standard input, refers to the keyboard. When we talk about redirecting STDOUT,
    it means you will change the typical output device using the redirect symbol on
    the command line. Following is an example of STDOUT being redirected to a file:


    ```

    /usr/opencv/netbackup/bin/admincmd/bpmedlist -U -h SRVR > report.txt

    c:\Program Files\Veritas\NetBackup\bin\admincmd\bpmedlist.exe -U -h

    SRVR > report.txt

    ```


    We expand on the use of STDOUT and STDIN in Appendix A, ''Command-Line Interface
    Guide.''


    Some important information to note in this report are the images and vimagos columns.
    These indicate the total number of images, as shown in Figure 6.17.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '![](img/acb44d4c8cce95a9dfc81e127fceac76_95_0.png)


    Figure 6.17: Media list report.


    This report is useful to identify the number of tapes used and their particular
    *states*. A tape can be in one of five states, as shown in the figure:


    **ACTIVE**: An assigned piece of media with active backups, available for use
    until the End of Tape (EOT) marker is reached.


    **FULL**: A tape that has reached its EOT and is marked FULL**; it is no longer
    available to be written to will be available for reads until the last image on
    the tape has expired.


    **SUSPENDED**: A tape that has been suspended is no longer available to be written
    to will be available for reads until the last image on the tape has expired. When
    all the images on a suspended tape expire, the tape will be made available again.
    Tapes can be suspended as a result of media errors or operation intervention.


    **FROZEN**: A tape that has frozen due to hard errors during a backup will no
    longer be available to be written until the tape has been manually unfro by an
    administrator. The tape will, however, be available for reads until the last image
    has expired.


    **IMPORTED**: A tape that has expired previously or brought into this NetBackup
    domain from another one and has now been imported in order to facilitate recovery
    of some files. An imported tape will never be available for writes, but it will
    naturally be available for reads.'
  merge: -1
  pgno: 95
- img_proc: true
