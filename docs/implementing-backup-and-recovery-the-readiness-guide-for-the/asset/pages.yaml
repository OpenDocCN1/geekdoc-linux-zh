  md: '# Synthetic Backups


    Synthetic backups will offer the technology to allow less frequent and cumulative
    incremental backups while allowing acceptable restore performance. Generally speaking,
    you establish the frequency for full backups based on recovery requirements and
    volatility of data. The less frequently you do backups, the more images will be
    required to do a full filesize or volume recovery. Synthetic backups will create
    new (synthetic) full backups from a series of incremental backups and new (synthetic)
    cumulative backups from a series of differential incremental backups. The intent
    is that you will be able to schedule synthetic backups just like normal.


    The basic idea behind synthetic backups is to manufacture a compact set of data
    from a disparate set of data spread among many pieces of removable media. It is
    essentially a restore operation used to manufacture a new full backup. The first
    synthetic backup is up to determine the data that needs to be collected to manufacture
    your new image. For a synthetic cumulative backup, the last full backup sets or
    images are used as a reference point for collecting this data. Each peer each
    other and can span any time period between the last full backup and the current
    date.


    The next task is to look into the catalog entries for the constituent backup sets
    or images and determine which files are necessary for the final new synthetic
    image. Basically the most recent unique sets of objects are the ones desired for
    the synthetic backup. The time of the backup is used to order the objects correctly.
    Based on this information, the data is routed to a destination media that will
    constitute a synthetic backup. At the condition of the operation, the files needed
    to be appropriately cataloged as either a new full or cumulative incremental backup.
    You would now have a viable compact set of media that represents a point in time
    of your data as recent as your latest offline copy.


    Once again, disk-based backup solutions will add tremendous value when creating
    these synthetic full backups to tape; its random access serves well in this scenario.'
  merge: -1
