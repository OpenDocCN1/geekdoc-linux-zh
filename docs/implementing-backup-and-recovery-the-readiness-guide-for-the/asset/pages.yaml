- img_proc: true
  md: '# Chapter 9: The Expanding Backup System


    Once you have decided (or inherited) your backup architecture, experienced a successful
    rollout, and had an opportunity to monitor the performance, activity, and usage,
    eventually it will be time to address growth and expansion. Naturally, the best
    way to grow is to anticipate through capacity growth; however, most find themselves
    in the middle of expansion while the lifeboat of preventing at their disposal.
    As a result, many of the decisions being made are reactive, based on the person
    or groups that have to be, frankly speaking, threatening the most bodily harm.


    In this chapter, we give you the information you need about expanding your backup
    environment to make your life a storage administrator as easy as possible. The
    backup tool you selected for your environment will dictate the practical application
    of what we will be discussing in this chapter. For purposes of illustration, Veritas
    NetBackup is used in most of the examples, and when possible, a more generic approach
    for capacity planning is used.


    # React versus Respond


    Time is slipping away. We, in most of the amount time we are given for backup
    is shrinking. Neither of us has ever been at a client site where we told that
    we have been given another three hours for backup window, that just doesn''t-happen
    in our experience. Now, time is slipping away from us, but the data continues
    to grow, sometimes at an alarming rate. Once, a pristine backup environment would
    successfully complete every job before the backup window. Now we are struggling
    to get all jobs done within the window. For the unprepared administrator, this
    happens very slowly, almost unnoticed, until one day we are faced with a full
    sort of failures and begin to react as opposed to respond to managers, administrators,
    and users who are at your door looking for their data be restored. We will illustrate
    this contrast in the next chapter, but it is enough to say that we need to be
    better when we react as opposed to being able to properly respond. We need to
    move away from a reactive posture to a responsive posture as storage administrator.
    When we react we tend to lose our temper and make irrational decisions. Conversely,
    with a responsive posture, we need to start with a goal in mind, and make moves
    planned and internal, again putting the pressure on the people who control the
    budgets so that they may take a responsive winter within their own job responsibilities.


    It''s human to react when you feel you are being attacked. In that context we
    may do one of two things: fight or flee. This concept has around for a long time.
    In disaster recovery (DR), the presenters will show how many in the audience actually
    have a DR plan. Inevitably someone speaks up and says, "Yeah, its my updated résumé",
    in other words, a flee response. Then there are the shooting matches you surely
    have witnessed between a storage administrator and a business manager when data
    was lost and not recovered. What was called a turned nightmare often became a
    classic fight response. Both of these examples are unhealthy for our professional
    careers or our physical health, instead of the fight or flee reaction, let''s
    be prepared with responsive solutions. You may never be able to avoid some battles,
    but with the right storage administrator can at least stay calm during the process
    and still be productive at the end of the day. When you can achieve this kind
    of harmony within your organization, you will find growing your backup environment
    to match the expansion of your enterprise is not daunting as you might have otherwise
    believed.'
  merge: -1
  pgno: 134
