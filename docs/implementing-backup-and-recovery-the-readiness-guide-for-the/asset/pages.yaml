    # # Windows Media Server


    As seen in the last section, the media server installation is very similar to
    the master server installation. During the media server installation, you provide
    the name of the master server and any other media servers. This allows NetBackup
    to set up all the configuration files to properly reflect your backup domain.


    # # Windows Clients


    Windows client software can be pushed from a Windows master server or can be locally
    installed using the NetBackup release CD-ROM.'
