    Figure 6.4: Job Details: Details tab.


    Following are the fields in the screen shown in Figure 6.3:


    +   1. Unique Job ID for the job in queue.

    2. The current status of the job.

    3. Navigation buttons to scroll through the Activity Monitor.

    4. Job Details Tabs.

    5. Job Type, whether Archive, Backup, Restore, Catalog, or Duplication.

    6. A description of how the job was submitted, either Immediate, manually submitted,
    or Scheduled.

    7. The client this job is currently working with.

    8. The master server.

    9. Backup policy information.'
