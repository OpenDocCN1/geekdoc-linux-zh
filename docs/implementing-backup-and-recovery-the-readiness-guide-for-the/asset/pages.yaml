  md: '# Determining Your Need for Additional Resources


    Now that we have determined some of the advantages and disadvantages of dividing
    our backup domains, we will know if we need to add more device hosts or media
    servers, tape capacity, or perhaps even both.


    Note VERITAS uses the terms device host and media server to indicate a server
    that has some control of physical devices for the purposes of backup and restore
    with regard to VERITAS NetBackup.


    # When to Add More Device Hosts


    Again using the NetBackup illustration, the good news is that adding device hosts
    or media servers is not a daunting task as determining whether or not to divide
    your backup domain. Typically when you find that you''re needing your backup window,
    but you have plenty of capacity in your tape library, it''s a sure sign that you
    need to add a media server. By performing some basic mathematical formulas, you
    can approximate the amount of data that your current environment can easily handle.
    First, identify any bottlenecks in your backup environment before you decide that
    you need to invest in more of anything.


    As an example, let''s look at a master server with one network interface and a
    100-Mbps Ethernet on a switched backup network, illustrated in Figure 9.7.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_146_0.png)


    **Figure 9.7**: 100-Mbps network bottleneck.


    With a GBE between the backup server and the switch, as in Figure 9.8, you can
    drive 125 MB/sec to the backup server, or approximately 20 DLT 8000 tape drives.
    Naturally, all of this would be dependent on the I/O interface to the backup server,
    but assuming you have multiple SCSI interfaces or are using Fiber-connected drives,
    the network would hold fairly true. Would you really want to drive 20 DLT drives
    from one backup server? Probably not. At that point you would want to expand to
    another media server or another device type. Table 9.2 shows some tape drives
    that you can use to help decide which device needs.


    Either inheritance, slow growth, or quite frankly, a tight budget year, one will
    be faced with a backup environment that hops across networks. When the time comes,
    and budgets are loosening up, you definitely want to consider introducing a media
    server into this type of environment. Not only are you backing up another network,
    but you are also pulling in all of data across the network back to the master
    server to be written to tape. Wouldn''t it be better to have that data remain
    within the network of its origin and only have to send the meta data back to the
    master server? We hope you answered yes. If you didn''t, you are probably still
    under very tight budgetary constraints.'
