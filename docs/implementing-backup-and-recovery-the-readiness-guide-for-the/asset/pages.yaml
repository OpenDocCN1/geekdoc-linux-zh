  md: 'Disk-image delivery. In a SAN environment, recovery staff can connect a recovery
    server running to the boot volume of the downed server via the SAN: restore the
    operating system, applications, and data of the downed boot volume from tape;
    then simply reboot the downed server, which comes up in a fully operational state.
    In a standalone environment, when a downed server becomes corrupted and that server
    goes down, the staff can use a recovery server that accommodates physical disk
    mechanisms compatible with the original downed server to restore the operating
    system, applications, and data of the downed server from tape. Then the recovery
    staff can physically remove the disk from the recovery server, replace the corrupted
    disk on the downed server with the new physical disk, and reboot the server to
    come up in a fully operational state.


    Data Protector also supports copying backup tapes, for the purposes of providing
    added redundancy or sending a copy of backup tapes off-site for disaster recovery
    purposes.


    # High Availability


    Data Protector is fully cluster-aware; the management station, disk agents, and
    media agents are all cluster-aware components, operating as resources within a
    cluster, and they fully take advantage of the automatic failover capabilities
    within the clustering software. HP/ServiceGuard, Microsoft Cluster Server, and
    Veritas Cluster Server (with only disk agent support) have been tested.


    Data Protector supports additional capabilities within selected disk architectures,
    including zero-downtime backup. This is the ability to eliminate backup windows
    by automatically invoking an application-server-level, split-mirror, or snapshot
    backup, enabling 24/7 continuous operation without performance impact on the application
    server. It also provides instant recovery, which is the restoration of selected
    information from a split-mirror or snapshot image on disk, rather than a recovery
    image on tape. This instant recovery capability occurs much more rapidly than
    restoring information from disk, and in some cases, it can occur with no movement
    of data within the disk array at all. Zero-downtime out-of-the-box integrated
    with Oracle, SAP, Exchange 2000, and MS-SQL, across Windows 2000, HP-UX, and Solaris
    environments.


    # Key Differentiators


    Data Protector keys versus other data protection capabilities is its tight integration
    with applications and storage arrays such as instant recovery and zero-downtime
    backup. HP Data Protector provides a healthy breadth of capabilities, across the
    range of operating systems, applications, and storage arrays, as HP does. In particular,
    since Data Protector works with a combination of local and remote mirroring software
    (in the case of the HP XP array as well as EMC), Data Protector can provide a
