    Once we lose the master server, all backup, restore, and duplications are lost
    until the server is recovered and returned to an online status. This adds to the
    cost of ownership, since we would have to purchase some clustering software to
    eliminate this disadvantage. Note that if you elect to use Veritas Cluster Server
    (VCS) or other High Availability (HA) host, you must not only fail the application
    if it is a master server, but also favor the device control if it is also a media
    server. Figure 9.5 depicts a master server, with no robotic or physical device
    whatsoever, with VCS configured in an active-passive role. This, in our opinion,
    is the best approach when attempting to make NetBackup a highly available service,
