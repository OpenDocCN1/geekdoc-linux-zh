  md: '# Appendix F: Performance Test Tech Note


    # Introduction


    This document has been compiled from notes that have been made over the past several
    years working with NetBackup. Some of the information is original and some has
    come from other NetBackup Professional Consultants. This was created to assist
    in the troubleshooting of network performance issue as it relates to NetBackup.
    Some of the following are undocumented and ''unsupported'' by Veritas Software,
    and are provided merely for testing purposes only.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Test Performance with NetBackup


    There are a variety of tests one can perform to identify where the ''problems''
    exist within ones backup environment. This document only covers a few that I have
    found to be most useful in my capacity as a Consultant working with NetBackup.
    This document will briefly expose you to some of these ideas and concepts.


    # Where to Begin


    Perhaps you have noticed that there is some performance problem with some of your
    backup clients. You have been receiving or you have been using client_clutphish
    script and noticed a decline in performance for a particular client. Whatever
    the case may be, you are now here looking ways to troubleshoot this issue. We
    have many points that could be bottlenecks for your backup client. The client
    has CPU, MEMORY, DISK, NIC, NETWORK in between the client and the server. We were
    seeing similar issues with the server as well. So saying that performance problems
    is a very broad statement and requires us to drill ''down'' and narrow a statement
    bit. The way we do this is to attempt to divide these issues as much as possible
    to troubleshoot with a high level of consensus as possible. Why network performance
    is probably blamed for 90% of the backup performance problems? Because network
    is the easiest target, where''s the defense of the network groups out there, it
    may be your backup server, or the client''s disk. It may be the network, but this
    document will help us decide where the problem lies.


    # Dumping to the ''Bit-Bucket''


    Now there are a couple of thing that can eliminate the many variables that exist
    between the client and the server. For our first example, we make an assumption
    that the client and server are two different machines and therefore take the network
    and server out of the equation and solely on the client. What we want to do is
    test how fast the client can ''read data off of the disk. We will do this by sending
    it to an incredibly fast device, the bit-bucket or NUL.


    # From the Client


    To see if the bottleneck is in the network performance, perform the following
    using bpbkar, which is in the directory where your NetBackup software is installed.
    For information''s, bpbkar is the backup/archive process or daemon that is responsible
    for file collection and creating the image that will eventually be on the tape
    or disk used for backup. In our example we will not be sending data across the
    network, but redirect STDOUT to NUL and STDERR to a file. This will give you the
    number of files that it processed and the size of the ''backup image'' that was
    created, but ultimately to NUL. When you begin this process, you want to select
    a sizeable amount of data in order to get a fairly representation and want to
    simply track the amount of time it takes to process this. Do not use the same
    device you are reading from, this will yield your results.


    # NT/2000:


    This test will use jbpbkar writing to /dev/null (the bit bucket), which eliminates
    the network portion of the equation.


    ```

    c:\Veritas\NetBackup\bin\bpbkar32.exe -nocont > NUL (for NT)

    i.e. c:\Veritas\NetBackup\bin\bpbkar32.exe -nocont c:\> NUL 2>temp.f

    ```


    temp.f will contain all of the files that bpbkar has collected. This will grow
    considerably if there is a large file system or directory structure you are testing
    with. BE WARNED.


    # From Unix:'
  merge: -1
  pgno: 253
- img_proc: true
  md: '```

    /usr/open/netbackup/bin/bpbkar -noconct > /dev/null 2>

    /tmp/files.out

    ```


    Same idea.


    # From the Server


    So now we have taken the testing from the client to the server. Both of these
    tests will have left the network completely of the respective equations. If your
    testing of the client has left you with reasonable results, then it is time to
    test the server. This may most especially if your backup performance is good with
    the exception of a few clients. But as good-natured System Administrators want
    to make sure that we have adequate test documentation before we answer our network
    group. It''s always good to perform these self-assess whenever and now.


    There is an undocumented feature with NetBackup that allows you to eliminate the
    tape subsystems, disk and drive controllers from the engine and simply write your
    backups to it, the bucket. As I mentioned before this is an infinitely fast device,
    if we could only write to NUL for all of our backups, our performance issues would
    get away. We can show- for it, so we can''t. If you would like to do this, you
    must understand that there are SEVERAL CAVATS AND WARNINGS that if you do not
    have negative effects on your environment. With this one, you will be unable to
    restore any data from storage units, as the data will simply not be there.


    So here''s the reason we want to run this type of test. First of all let us know
    how NetBackup is processing the data. Could there be anything inherently wrong
    with our NetBackup configuration? Hopefully part of this test will help us to
    get a bit clearer. The second reason we want to run this test, is after we validate
    our NetBackup Server configuration has ruled out the culprit, or client is performing
    well with its local test, we can test the backup from the client to the server
    across the network.


    Here''s how we begin:


    +   1. Create a disk status; even if you have some recommended that you create
    a new one and call it DISK_TEST or something.

    2. Now touch /usr/open/netbackup/bpdm_dev_null or for the WINTEL systems, create
    an empty file bpdm_dev_null in the NetBackup directory.

    3. Run your test backup.


    I usually create a backup policy called special that I use for ad hoc backups
    or testing . You may want to do something similar for any modifications of your
    production backup policies. When you decide to do, make sure the DISK_TEST storage
    unit is used by the test backup policy. When this job runs, the fragments will
    be created but the file length will remain 0 and bpdm will write the image to
    the bit-bucket (/dev/null).


    > NOTE:

    When you back up to a disk storage unit, bpdm (backup tape manager) daemon or
    process will not be invoked, rather bpdm (backup disk manager) will. If the test
    proves to be successful, then we may be looking at a issue with regard to shared
    memory and tape buffers.


    Since we are sending all of the image data to NUL, we will not be able to restore
    any of that data backed up during our test. This is true for ALL disk storage
    units on this particular media server. You must remember to DELETE bpdm_dev_null
    after your testing is complete.


    If you touch the file, you should see the following in bpdm debug log for backups:


    ```

    > really writing to /dev/null

    ```


    This tells us that we have created the storage unit for this test and that any
    other backup to a disk storage unit on this media server will write to /dev/null.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Caveats:


    +   - Don''t you restores.

    - Doing this affects ALL disk-based backups on the server (all go to null).

    - I have been told that while it has yet to be proven, it may cause problems with
    tape backed backups as well. I personally haven''t had this experience.

    - Doing this leaves extra information lying around in NB databases.

    - Expires any images that you create with this test the test is over using the
    bpexdate command.

    - When you are done remove the /usr/open/netbackup/bpmdm_dev_null file.


    # Using FTP


    The final test is simply using FTP. We have now tested and backed up the client
    to the client bit bucket, client to the server and now we want to try the network,
    from the client to the server. This will tell us if we are looking at a client
    issue, server issue or network issue. If anything it will give us good information
    as to how to proceed resolving our performance problem.


    Run this test from the client, then from the server and evaluate both findings
    to determine the next step.


    +   1. FTP from the client to the server, then server to.

    2. FTP something large enough to measure (1 GB preferably).


    While this may not seem like a real test, it does accomplish something for us.
    We are able to transfer data OUTSIDE of the backup application, allowing us to
    compare the times with FTP and the times with backup. With all of this information
    and testing complete, the profile of the client backup should be relatively clear
    and we should be able to at least determine where the root cause of the problem
    exists If this is not the case, open a support call with VERITAS. Be prepared
    to submit your documentation to them, so you can avoid any lost time resolving
    your issue.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_255_0.png)'
  merge: -1
  pgno: 255
