  md: '# How This Book Is Organized


    This book is oriented as many publications: table of contents in the beginning,
    index at the end, appendices before the index, and a glossary in there as well.
    Why are we bothering to state the obvious? Well, we think that when you use a
    technology book, or any book for matter, it is important to note that all of these
    components are first before you read the first chapter. We often begin reading
    a book from page 1, Chapter 1, but rarely ourselves picking out the gems of wisdom
    there by the author (yes, we have one or two for your reading pleasure).


    We want you to challenge: Do not start at page 1, Chapter 1 with our book; rather,
    read the introduction, read the back, scan the index for terms that are of interest
    to you, read the glossary and become familiar with the terms that we use in this
    book. Next, inspect the table which gives a list of contents for chapters that
    pique your interest before you read page 1 of Chapter 1. This gives you a better
    start as you begin to read and hopefully a much richer experience than you just
    read out, but any book.


    Now on the organization of our book. This work is separated into three parts.
    Part One is an introduction to backup and recovery in the enterprise. We felt
    it important to lay down some foundational facts and information in Chapters 1
    and 2 protecting data that you would otherwise never be able to protect.


    Part Two builds on this foundation. Here, we begin to look at the components of
    backup through a backup tutorial. After providing you with the groundwork and
    basics, we take a more practical view of how the information is gathered by Part
    1 through the steps of laying out, installing, and configuring a backup application.
    Since we have over 10 years'' experience with Veritas Software''s NetBackup product
    specifically, we will be using NetBackup for the purposes of illustration throughout
    the book. NetBackup is the installed backup and recovery solution in the UNIX
    space and is considered standard in the Unix world.


    Every site is different, with different business needs and requirements. The business
    will drive many of the decisions for your backup plan, as we will provide in our
    approach and some of the real-life scenarios. While we won''t be able to give
    you a step-by-step roadmap for architecting your backup and recovery system, we
    will provide you with a foundation to build upon, with additional resource to
    help on some of the components you add to the environment to match your specific
    needs, reinforcing your backup infrastructure.


    Chapters 3 to 7 really run out our discovery of NetBackup as a product, including
    discussions on its architecture, how to determine your media requirements, installation
    considerations, configuration, and monitoring. Chapters 8 to 9 will really be
    focusing on taking NetBackup''s ''stock'' configuration and enhancing it through
    options and features. Here we also offer troubleshooting tips.


    In Part Three we explore the explosive-growth backup enterprises face and provide
    suggestions for design with growth. What you might want to read this section before
    your architecture because it is always a good idea to plan for the future rather
    than having to react to it. We also take a peek into the backup and recovery crystal
    ball and share some of the things that are being considered for the future of
    backup and recovery, others that are to be explored. We have included input from
    some of the best minds in the field for this information.


    Lastly, we have added some rich content in the appendices to help you in your
    labor. You will find a business impact analysis (BIA) kit, disaster recovery (DR)
    planning kit, NetBackup tuning guide, performance testing note, Command Line Interface
    (CLI) guide, and a glossary of terms. The planning kits, while not exhaustive,
    provide you a very nice starting place if you have not performed BIA or DR plans
    at your company. The tuning guide will give you very practical methods for making
    sure your NetBackup is performing optimally.


    Throughout the book we will use our personal experiences with real-life client
    situations to explain'
