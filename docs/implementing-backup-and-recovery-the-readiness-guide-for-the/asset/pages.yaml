- img_proc: true
  md: '# Chapter 6: Monitoring the Backup Process


    Now that you have successfully installed and configured your backup domain, you
    are ready to sit back and take it easy. But someone knocks on your door now you
    will have to start monitoring the backup and restore processes. While we are at
    it, we might as well look at monitoring some of the other elements in the backup
    domain that might need attention. In this chapter, we go through some of the tools
    available to monitor the activities of our example backup and restore application,
    VERITAS NetBackup.


    # Using the Activity Monitor


    The most common tool for monitoring the backup and restore activity is the Activity
    Monitor. This is available on both the UNIX Java GUI and the Windows GUI. Selecting
    the Activity Monitor on the Administration Console, see Figure 6.1, results in
    the screen shown in Figure 6.2.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_84_0.png)


    Figure 6.1: Administration Console.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_84_1.png)


    Figure 6.2: Activity Monitor.


    This screen lists all the jobs that are currently being tracked by NetBackup,
    including jobs that are queued, active, and finished. You can also see the summary
    information that includes all jobs in each of these categories, plus the sum of
    all jobs and the master server name. From the Activity Monitor, you can cancel
    individual jobs or cancel running jobs. This is done from the Actions menu at
    the top of the screen.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# # Fields in Activity Monitor


    The following list details the information contained within the Activity Monitor
    window:


    **Job ID.** This field displays the identifier that is assigned by NetBackup to
    each job.


    **Type.** This shows the type of job activity, which can include any of the following
    job types:


    +   - **Backup.** All backup jobs, no matter how they are initiated.

    - **Restore.** All restore jobs, no matter how they are initiated.

    - **Archive.** User-directed archive.

    - **Catalog Backup.** All catalog backup, no matter how they are initiated.

    - **Duplication.** Image duplication jobs used to create a copy of an existing
    image.

    - **Import.** Import image jobs used to build a catalog entry to restore from
    an image that is unknown to the master.

    - **Verify.** Image verify jobs that are running to verify the contents of a tape.

    - **Vault.** Jobs that are running as part of the vault process.


    **State.** The Activity Monitor gives the current state of all the jobs. Following
    are the states:


    +   - **Queued.** Jobs in the NetBackup scheduler queue waiting to run. A queued
    restore job is one for which NetBackup is still determining which files are needed.

    - **Active.** Currently active jobs.

    - **Re-Queued.** Jobs that are placed back in the scheduler queue as retries because
    the previous attempt was unsuccessful.

    - **Done.** Completed jobs.


    **Status.** This field shows the status of each job. The status is shown when
    the job completes. A status of 0 indicates the job completed successfully. Any
    other status indicates that there was some problem with the job.


    **Note: NOTE**

    A backup that completes with a status of 1 is considered partially successful
    but the image is written to tape and the image header file is updated in the catalog
    and marked as a complete backup. This indicates that the image will be kept for
    the normal retention period.


    There are additional fields that give information about each job, including the
    actual policy name and schedule for backups, start time, elapsed time, media server
    name, client name, end time, number of this attempt, and others. These are all
    detailed in both the UNIX and NT versions of the System Administrator''s Guide.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Detailed View


