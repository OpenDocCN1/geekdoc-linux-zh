  md: '# Layout Backup Domain


    Now the fun begins. You have gathered tons of data and know more about your enterprise
    than ever thought possible. It is time to put all of this knowledge to use. If
    this is the first time an actual backup and recovery strategy has been implemented,
    you will be able to tailor the backup domain. If this is an upgrade or application
    change, you will probably have to work within the confines of the existing layout,
    making changes required.


    Using NetBackup as the application in this domain, you first want to list all
    the systems that need to be backed up as clients. This will give you an idea of
    the number of systems that need to be backed up and the distribution of data.
    Any systems that have a large amount of data, over 100 GB for example, with the
    contents being changed, might want to make them media servers. The other important
    thing to consider is their network connectivity. If there are a lot of network-based
    clients on slow networks, you should consider high-speed backups. This gives increased
    backup and recovery performance, as well as keeping backup and recovery traffic
    off the production network. It is now common to install a 100Base-T or Gigabit
    Ethernet network as a backup and recovery network.


    A NetBackup requires at least one master server. In most situations, there will
    be only one; in a later chapter we will discuss some reasons how to handle more
    than one. The system you choose for the master will depend on the size of your
    enterprise-number of clients, the total number of files being backed up, and the
    storage of units you will need. In a smaller environment, the master server could
    be used for other purposes as well. Figure 3-2 shows an example of a configuration
    where the master server is also a media server and all the client backups are
    basically LAN-based backups.


    In larger environments, the master server is usually a dedicated NetBackup server,
    although it could be a media server. This server must have enough disk capacity
    to handle the NetBackup catalogs and, potentially, the debug logs. Some of the
    debug logs are located in /usr/open/netbackup/logs. If this directory is not on
    a separate partition, you must make sure do not allow the logs to grow and fill
    the disk. The largest part of the catalog is the image database, which is located
    in /usr/open/netbackup/db/images. It is recommended for this directory to be a
    separate partition. All of the metadata for all the backups are stored in the
    image database portion of the catalog. The maximum amount of disk space that NetBackup
    requires at any given time varies according to the following factors:


    +   - Number of files that you are backing up

    - Frequency of full and incremental backups

    - Number of user backups and archives

    - Retention period of backups

    - Average length of full pathname of files

    - File information (such as other permissions)

    - Average amount of error log information existing at any given time

    - Whether you have enabled the master compression option'
