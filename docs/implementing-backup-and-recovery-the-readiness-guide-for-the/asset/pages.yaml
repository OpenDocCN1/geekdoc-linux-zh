    Many different scenarios based on the combination of these technologies are being
    investigated, and we are sure we will see many of them come to market in the not
    too distant future. The ability to create consistent versions of data to protect
    against corruption while allowing for disk-based rollback to a point in time is
    very attractive. Coupled with this is the ability to move data to tape for true
    data protection with minimal impact on production systems and applications-a very
    attractive feature.'
