  md: 'It is assumed that clients will target a protection server that will host replicas
    of their data. These replicas will be backed up to tape via normal scheduled backups.
    In this scenario, the protection server acts as a disk consolidation server and
    performs optimized backups from this consolidated storage. This type of backup
    does not require SAN, but the protection server storage certainly could justify
    SAN connectivity. The replica data on the protection server can be backed up using
    traditional backup methods or any of the frozen image backups.


    An anticipated way to further leverage technologies and get even more benefits
    from real-time backup is to use injected markers in the replication stream to
    notify the remote target or protection server server that the application has
    been quiesced and that it is safe to take a snapshot. This allows the creation
    of consistent point-in-time snapshots that can potentially be used for rollback
    and can be written to tape. Figure 10.5 shows an example of this.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_160_0.png)


