  md: '# Virtual Backup


    The future is now, or at least portions of it, for we are seeing the virtual backup
    technologies today with the integration of current technologies. However, it hasn''t
    made the main stage yet. The virtual backup involves making persistent images
    of the data being protected and managing them. The frozen image can be either
    a mirror or a snapshot. This offers a way for you to use disk storage for high-performance
    data protection, and allows you to encompass various technologies for managing
    systems and volumes. Local versions can be accessed for restoration, instead of
    the data being accessed on tape or remote storage, allowing you to protect your
    data ''instantaneously'' via an automated and manual facility. In this, the restoration
    of your data can be just as instantaneous as backups. The hope is to keep most
    differences in the underlying technologies away from you, the end. If data was
    protected to tape or locally via a virtual backup, the user should be comfortable
    in locating and recovering every version of a file. This technology was actually
    introduced with VERITAS Software''s NetBackup 4.2.


    The implementation of this feature involves the integration of frozen image technology
    with the backup reality. The real innovation is that backup controls the creation
    of the frozen images, catalogs the data in the frozen image, tracks the versions
    of the frozen image, and facilitates restores You can configure the number of
    frozen images to be kept (versions) and how often they will be. Since no data
    is actually transferred during the backup, this offers a very low impact backup
    option. The only constraint is available disk space. The frozen images are disk
    images of the data, so the restore performance should also be almost instantaneous.


    Figure 10.1 shows an example of doing virtual backups using VERITAS Software''s
    VxVM mirrors. In this example, NetBackup is managing three mirrors the live volume.
    This gives the appearance of rotating mirrors. The biggest difference is that
    with the mirror version, you must allocate the disk space for all mirrors before
    initiating virtual backup. With storage checkpoints, the disk space is allocated
    as needed, and the disk space is deallocated as a checkpoint becomes obsolete.
    The mirrors potentially have less system overhead but will use more disk space.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_157_0.png)


    Figure 10.1: Virtual backups.


    Other software solutions perform similarly by making periodic, scheduled point-in-time
    copies of the data. These solutions collect the changes and not the entire file;
    therefore, they do not take up a significant amount of storage. The solutions
    typically integrate with most backup solutions by various type of pre- and post-processing
    scripts. The future of virtual backups will be led by the backup software vendors
    and most certainly validated by the emerging technology companies that will provide
    this in a cross-backup-platform solution.'
