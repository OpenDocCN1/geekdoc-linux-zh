    Analysis of the Wait and Delay counter values indicates which process, producer
    or consumer, has to wait most often and for how long.


    There are four basic Wait and Delay counter relationships:


    **Data Producer >> Data Consumer.** The data producer has substantially larger
    Wait and Delay counter values than the data consumer.


    The data consumer is unable to receive data fast enough to keep the data producer
    busy. Invest means to improve the performance of the data consumer. For a backup
    operation, check if the data buffer size is appropriate for the tape drive used
    (see below).


    If data consumer has a substantially large value in this case, increasing the
    number of shared data buffers to improve performance (see below).


    **Data Producer = Data Consumer.** The data producer and the data consumer have
    very similar Wait and Delay counter values, but those values are relatively large.


    This may indicate that the data producer and data consumer are regularly attempting
    to use the same data buffer. Try increasing the number of shared data buffers
    to improve performance (see below).


    **Data Producer = Data Consumer.** The data producer and the data consumer have
    very similar Wait and Delay counter values, but those values are relatively small.


    This indicates that there is a good balance between the data producer and data
    consumer, which should yield good performance from the NetBackup server component
    of the NetBackup data transfer path.


    **Data Producer << Data Consumer.** The data producer has substantially smaller
    Wait and Delay counter values than the data consumer.


    The data producer is unable to deliver data fast enough to keep the data consumer
    busy. Invest means to improve the performance of the data producer. For a restore
    operations, check if the data buffer size (see below) is appropriate for the tape
    drive used.


    If the data producer has a relatively large value in this case, increasing the
    number of shared data buffers to improve performance (see below).


    The points above describe the four basic relationships. Possible concern is the
    relationship and the size of the values. Information on determining substantial
    trivial values appears on the following pages. These values only provide a starting
    point in the analysis. Additional investigative work may be needed to positively
    identify the cause of a bottleneck within the NetBackup data transfer path.


    # Determining Wait and Delay Counter Values


    Wait and Delay counter values can be found by creating and reading debug log files
    on the NetBackup media server.


    > NOTE:

    Writing the debug log files introduces some additional overhead and will have
    a small impact on the overall performance of NetBackup. This impact will be more
    noticeable for a verbose level setting. Normally, you should not need to run with
    debug logging on a production system.


    To determine Wait and Delay counter values for a local client backup:'
