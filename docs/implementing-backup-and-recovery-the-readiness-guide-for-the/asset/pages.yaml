- img_proc: true
  md: '# Retention of Backups


    A common mistake people make is to retain their backups for too long. This increases
    the cost of backups, since you will need more media. You need to make sure you
    understand all the legal and business requirements for keeping copies of the backups
    and ensure you meet them. For normal operations, you want to make sure you have
    a retention level that at least exceeds the frequency you do a particular backup
    weekly at least one week or you will be unprotected. A general practice is to
    keep at least two copies of each type of backup. This means you will always have
    two copies of the tape doing the backup. This method allows you to recover from
    a crash that might occur on the daytime for the next backup, but it provides an
    extra copy in case there is a problem with one of the tapes. Another common practice
    is to assign off-site tapes this vary, but it is driven by the business. For instance,
    perhaps the business requires that the backup images be kept on-site for 30 days
    for recovery purposes, while off-site images must be kept for 180 days.


    Give this entire issue careful thought, and don''t just say you are going to keep
    everything forever. If this describes your particular situation, do not have an
    uphill battle ahead of you, but it is not the end of the world. The best thing
    to do from this point is to make sure you can classify your data properly, redesign
    your backup policies so you are only backing up and keeping the data you need
    for the periods of time you require.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Security of Backups


    Security of the backups is else that must be taken into consideration. Your business
    might require encrypted backups so that the data on the tapes cannot be recovered
    without the proper key or password. Many backup and recovery offers provide this
    kind of backup, but there is a performance penalty with encrypted backups. The
    data be encrypted on the client system before being sent across the network, so
    this will require CPU cycles on the client and will also slow down the rate of
    data being presented to the network for backup. The data is very secure, since
    it is encrypted before it is sent across the network and is still encrypted when
    written to tape. This also requires the key to be known in order to do a restore.
    Most people rely on keeping the media secure rather than implementing data security
    by using encryption.'
  merge: -1
