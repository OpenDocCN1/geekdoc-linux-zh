  md: '# Summary


    As we have seen, features and options are available to help you enhance a standard
    backup and recovery architecture. Some of these may be necessary from the beginning,
    while others might be added as your enterprise grows and changes. To highlight,
    the features and options are as follows:


    +   - SAN backup and recovery

    - Database agents

    - Database editions

    - Frozen image backups

    - Offhost backups

    - Managing a diverse environment with GDM

    - Vault solutions

    - Disk-based storage units

    - Storage Migrator and Backup


    You want to always keep up-to-date on the additional features and options available.
    This should allow you to address your backup and recovery needs as your enterprise
    changes. In the next chapter, we will look at some hints and tips on troubleshooting
    your backup and recovery environment.'
