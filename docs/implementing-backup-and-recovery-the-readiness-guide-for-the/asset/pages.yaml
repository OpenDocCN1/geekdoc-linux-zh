  md: '# First Order of Business: What Problem Are You Troubleshooting?


    First things first: We need a problem to troubleshoot. How do you determine the
    problem is? You may see a variety of symptoms, but understanding the root problem
    is key to troubleshooting.

    Symptoms include the following:


    +   - Performance slow.

    - Backups fail.

    - Restores fail.

    - You cannot start a backup on client A.

    - Backups start fast, but decline.


    And a favorite of every technical support person:

    - Nothing changed, and all of a sudden, all of your backup jobs won''t start.


    So are these symptoms or the actual problem? The way to determine is to drill
    down further and further into the issue with reasonable detail. If it is a performance
    problem, is it tape drive performance, client performance, network performance,
    or disk performance? How do we determine where the problem lies? What failed backups?
    Could that be bad media or a bad tape drive? In this chapter, we present an outline
    for troubleshooting that we have found to be very helpful in our years of experience
    assisting clients with their troubleshooting


    As mentioned, the key is to determine what exactly is the problem. Here is an
    example from an actual client that had a couple of issues: First, the client said
    that their tape usage had increased considerably, the amount of data they were
    backing up had not changed, nor the backup changed. The assumption was that some
    tape media were having problems and either were not writing to the end of the
    tape or had firmware problems that would cause the data to be written improperly.
    Unfortunately, to add fuel to the fire, one of the tape manufacturers announced
    that some of their tapes they were were flawed because of a servo problem at their
    plant. The servo problem would either fail the backup with bad media or write
    the job successfully until the tape was full or failed with media errors. This
    led the client to the quick conclusion that it in fact the tapes corrects themselves,
    along with the drives, causing the problems they had detected.


    Upon arriving on-site to have a look at the problem, we asked the administrators
    several questions, such as ''What has changed in the last three months on the
    system?'' Naturally, the answer was, ''Nothing has changed. It has fairly static.''
    The key words are ''fairly static'' which means nothing had changed. Because we
    didn''t know exactly what, we began assessing the problem.'
