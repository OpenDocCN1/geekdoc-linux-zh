  md: '![](img/acb44d4c8cce95a9dfc81e127fceac76_76_0.png)


    Frozen image clients. This field defines if any client in this policy will be
    using frozen images. This is discussed in more detail in Chapter 7.


    NFS. If selected, this option allows NetBackup to back up data from any NFS-mounted
    filesystems that are in the file list.


    Cross mount points. This option controls whether NetBackup cross filesystem boundaries
    during a backup or archive on UNIX clients or whether NetBackup enters volume
    mount points during a backup or archive on Windows clients.


    Collect true image restore (with move detection). If this option is selected,
    NetBackup will collect the information to allow a directory to restore the exact
    image that existed at a specific backup. Deleted files and directories are not
    restored. If move detection is also selected, files or directories that are renamed
    or moved will be backed up and restored to the correct location.


    Compression. This enables software compression on the client. This selection can
    reduce the amount of data moved across the network on a backup; however, it increases
    the computing overhead on the client.


    Allow multiple data streams. This option specifies that, depending on directories
    in the file list, NetBackup can divide automatic backups for each client into
    multiple jobs, with each job backing up part of the file list. The jobs are in
    separate data streams and can occur concurrently.


