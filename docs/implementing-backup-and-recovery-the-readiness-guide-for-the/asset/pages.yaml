    \ the parent bptm process reads data from the tape and places it in the shared\
    \ buffers. the child bptm process reads the data from the shared buffers and writes\
    \ it to the network. the tar32 process on the remote client receives data from\
    \ the network and writes it to disk.\n\n# Roles of Processes during Backup and\
    \ Restore Operations\n\nWhen a process attempts to use a shared data buffer, it\
    \ first verifies that the next buffer is in a correct state. A data producer needs\
    \ an empty buffer, while a data consumer needs a full buffer. The following chart\
    \ provides mapping of processes and roles during backup and restore operations:\n\
