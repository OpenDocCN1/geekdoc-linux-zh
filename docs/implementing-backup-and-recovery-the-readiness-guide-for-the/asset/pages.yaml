  md: '# Disk-Based Units


    What''s the best way to increase performance of your tape backup solution? Take
    the out of tape backup and replace it with disk. Disk-based methods are becoming
    quite popular, with the cost of disks dropping dramatically in recent years. Before
    we get into the implementations of the diskbased methods, let''s look at what
    is on the market today. First disk-based solutions like Quantum DX-30 and Alacritus''s
    SecureDisk Virtual Tape Library Appliance that frontend the disk to the backup
    device work just like a tape library. Then there are filer-based solutions like
    Mikro''s MatchIt, NetStore, and Veritas Network''s solution. Large independent
    software vendors (ISVs) like LEGATO and VERITAS offer disk backup solutions within
    their applications, as one of the smaller ISVs, BackupStore''s NetBackup. IBM''s
    Toli Storage Management (TSM), which can use disks as a cache area during backup
    to stream the tapes down the back end. At this point, you might be saying, "But
    disks are finite storage device. That is true, so in order to implement a solution
    like this, you need to do some mounting and maybe some scripting, depending on
    the backup tool you have selected. We will use Veritas NetBackup for specific
    examples, but we believe the concepts can carry over to any solution that supports
    disk-based backup.


    # Implementing Disk-Based Storage


    Since disk-based storage is finite, you really need to take into consideration
    how you will manage it your backups are on devices. But more importantly, you
    need to determine which clients you want to back up to it. You surely cannot select
    all of the clients. That would require an amount of diskbacked storage as online
    storage. Practically speaking, it is best to determine which clients will be backed
    up.

    Once you have decided which clients will be backed up to the disk-based storage
    device, you need to keep the backup there as long as you possibly can to facilitate
    restores before the need arise. For illustration purposes, let''s say you want
    to keep the backup for a week. It is best to ensure you have enough space for
    72 hours before you effectively run out of space. Now what? Well, you can migrate
    manually by doing a copy, or by duplication to a tape device. You can also implement
    a hierarchical storage management (HSM) solution, VERITAS Storage Migrator, that
    will manage the filesystem for you automatically by migrating the ''data'' to
    a secondary or territory device. You can use the plug-module Watermark for seamless
    tape Guide by NetBackup Solutions, which will help you manage the system of the
    disk unit for growth and make a duplicate of the disk tape when the user-deletable
    watermark is met, or it will expire backup images that already have more than
    one copy, freeing up valuable disk space. Another solution is to use NetBackup
    Vault to duplicate stored images through disk staging. Disk staging allows you
    to back up to disk and then schedule duplication of the disk-based image to one
    or more tapes. The tape or tapes can have different retention periods both the
    disk-based image and each other. You can also configure Vault to delete the disk
    image as the duplication successfully finishes.


    The bottom line is that disk-based storage devices are inexpensive, fast, and
    potentially highly reliable. The first rule of thumb when performance tuning is
    to address all of your bottlenecks and tape may be one of those in your environment.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# # Storage Migration Products and Backup


    Full backups must by definition back up all the files in a filesystem. By adding
    an HSM software package such as VERITAS Storage Migrator to NetBackup environment,
    you can drastically reduce the amount of data that needs to be backed up while
    still protecting your data.


    HSM manages files for optimizing space and reducing the management time. Optimizing
    space involves copying inactive files from the primary storage medium (hard drive)
    to another medium, like tape, optical, or a less expensive drive. Once the inactive
    data is secured within another medium, the data blocks on the primary do not need
    to be backed up anymore to safeguard the data.


    An intelligent backup like NetBackup recognizes that the HSM has secured at least
    one copy of the data to another medium, NetBackup only needs to back up the meta
    (inode or placeholder) for that file. So instead of backing up all the data blocks
    for all the static files in a filesystem during a full backup, it only needs to
    back up the active (nonmigrated) and the files for the migrated data. Real-world
    testing has shown that a backup of 3.5 hours can be reduced to about an hour by
    simply adding an HSM to your environment.


    The primary reason that backups are ever done is for: you need to be able to recover
    your company''s data, for some reason, it''s gone. For the most, you generally
    do backups in a lesser manner (relatively speaking), but you almost always rely
    in a panic. Using HSM technology can also help reduce the amount of data backed
    up, and also increase your speed when restoring a filesystem. By doing your backups
    more intelligently by incorporating an HSM, you can not only decrease your backup
    window, but improve your recovery. With NetBackup and Storage Migrator, a full
    restore of the filesystem works exactly the same as a ''normal'' restore, except
    that you physically restore the active migrating files and all the files for migrated
    data are available just through access placeholders which behave like a normal
    file. Meanwhile, while you''re in business, since your active data is up, Storage
    Migrator will cache the data blocks to the filesystem, automatically. You can
    start processing faster than if you had to wait for all the active and inactive
    files to be restored. For safeguarding your data, it''s highly recommended that
    you let the HSM keep two copies of all your migrated data off-site, for all full
    and incremental backups. This prevents a disaster recovery problem in case of
    a total system failure.


    Starting with NetBackup 3 for UNIX, there is a tool called the File System Analyzer
    that analyzes your filesystem and reports back the usage patterns, size, and number
    of files within a filesystem. It provides a what-if analysis you can change to
    see how many files you back up on every full backup that hasn''t changed in a
    long time. Most customers are surprised at how much of their data isn''t used
    every year. The analyzer can be very helpful in determining if a particular system
    or filesystem/within a system is a good candidate for an HSM product.


    Another way to utilize Storage Migrator with NetBackup is as a repository for
    backup images. If you have many slow clients, even with multiplexing, you can
    never keep a tape drive performance guests. A tape drive can''t be kept, the tape
    drive''s performance is guaranteed. A way to address this problem is to back up
    to a disk storage unit. Storage Migrator can manage the disk storage unit. As
    NetBackup creates images on disk (or file systems on other networks), it creates
    backup fragments. Each NetBackup image, Storage Migrator can migrate these fragments
    to secondary storage. By doing this, each restore creates its own image without
    having a tape drive spinning its tape (shoe-ining, as we discuss in Chapter 9,
    which means the tape drive is not spinning and must wait to receive data before
    it begins again. Once the backups are done, Storage Migrator can efficiently recover
    the image. Now, your system administrators know that all your restores are done
    within a few days of the backup. If you have adequate disk space, the images could
    still be on disk. Your restores would be from disk instead of tape. If the image
    has been purged from disk for space considerations), Storage Migrator will automatically
    retrieve the backup images from tape and the backup will continue as normal.'
  merge: -1
  pgno: 115
