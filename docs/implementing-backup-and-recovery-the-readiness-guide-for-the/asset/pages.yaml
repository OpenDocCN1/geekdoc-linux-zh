    benefits to the end user would be the ability to use the ''best of bred'' products
    to back up your devices. Your decision would no longer be tied to the proprietary
    structure, if you didn''t want to be


    Embedded technology opens up the door for true server-independent backups as.
    The device will no longer need to be mediated by a server; embedded technology
    would allow it to go directly to the backup storage device, eliminating the middleware
