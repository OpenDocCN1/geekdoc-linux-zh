  md: '# Monitoring Disk Load


    To use disk counters to monitor the disk performance in Performance Monitor, you
    may need to enable these counters. Windows may not have enabled the disk performance
    counters for your system.


    For more information about disk performance counters, from a command prompt, type:


    ```

    diskperf -help

    ```


    To enable these counters and allow disk monitoring:


    +   1. From a command prompt, type:


    ```

    diskperf -y

    ```


    +   2. Reboot the system.


    To disable these counters and cancel disk monitoring:


    +   1. From a command prompt, type:


    ```

    diskperf -n

    ```


    +   2. Reboot the system.


    When you monitor disk performance, use the %Disk Time counter for the PhysicalDisk
    object to track the performance of elapsed time that the selected disk is busy
    reading or write requests.


    Also monitor the Avg. Disk Queue Length counter and watch for values greater than
    1 that for more than one second. Values greater than 1 for more than second indicate
    that multiple processes are waiting for disk to service their requests.


    Several techniques may be used to increase disk performance, including:


    > **Check the fragmentation level of the data.** A highly fragmented disk limits
    throughput levels. Use a disk maintenance utility to defragment the disk.


    > **Consider adding additional disks to the system to increase performance.**
    If multiple processes are attempting to log data simultaneously, dividing the
    data among multiple physical disks may help.


    > **Determine if the data transfer involves a compressed disk.** The use of Windows
    NT compression to automatically compress the data on the drive adds additional
    overhead to disk read or write operations, adversely affecting the performance
    of NetBackup. Use Windows NT compression if it is needed to avoid a disk full
    condition.


    > **Consider converting to a system based on a Redundant Array of Independent
    Disks (RAID).** Though more expense, RAID devices generally offer greater throughput,
    and (depending on the RAID level employed), improved reliability.


    > **Determine what type of controller technology is being used to drive the disk.**
    Consider if a different system would yield better results. The following table
    shows some typical throughput rates for controllers:'
