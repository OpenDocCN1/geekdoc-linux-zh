    # BACKUP OF 19 IN 10 TO 11 HOURS: THINGS''S WRONG


    Another client took 18 months to solve, mainly because the consultant on the project
    was called to architect another backup solution, only to return to the original
    project that the problem was never remedied. This didn''t involve backup jobs,
    crashing servers, or anything else so. It was a simple case of bad backups. The
    client assured that there was a full T3 between their backups (45 Mb/sec), so
    we had to be blazing for speeds. (We dont debate why they chose to backup across
    this T3 as opposed to putting another backup server in the facility. Our budget
    was cut (primary reason.) So it was on the consultant''s shoulders to make this
    work and well.


    The numbers say that a T3 could push 5.62 MB (that''s megabytes) per second, 337.5
    MB per minute, and 20 GB per hour. The throughput that the client had for the
    servers was 100BT, which could push 12.5 MB/sec, 750 MB/minute, or 45 GB/hour.
    As you can see, it seemed like our T3 was the bottleneck for our backups. As we
    were testing and tweaking we found that the backups were taking properly-specifically,
    that we had a NIC set to 100 FULL and not AUTO, so we know that some switches
    and a had server manufacturer''s host-motherboard-Ethernet interface do not play
    well when set to AUTO-NEGOTI.


    All of the network issues were worked out on our end; we made sure the administrators
    at the other location verified all of the network points as well, including server,
    switch, and router. They assured us everything was A-OK. After running the second
    test, the performance numbers were realized. Making sure all of our connection
    were properly configured, it was necessary to link it to the network group to
    have them at the link between the backups-maybe the T1 was actually primary and
    the T3 was secondary.


    One thing to remember, though, is that the IT in the remote facility didn''t get
    along well with their counterparts in the primary facility. This is never a good
    thing. Teamwork and intercommunication are key to any successful IT organization.


    After the network department assured that the T3 is primary and wasn''t even to
    close being fully utilized, we turned it back onto our network configurations
    between buildings. Naturally, the primary building where our consultant was sitting
    was reviewed a second time to make absolutely sure that it was configured properly.
    However, the IT on the remote site didn''t feel it was necessary to check their
    work, so they told us they already done that.


    About this problem, our consultant was pulled off to work the architecture job;
    he had instructed the customer that the problem appeared to be on the remote site,
    without having physical access, it was difficult to prove. During the absence
    of our consultant, the test policy went into production and the backup continued
    to return'
