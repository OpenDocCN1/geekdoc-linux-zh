  md: 'Because local backup or restore jobs on the media server do not send data over
    the network, this parameter has no effect on those operations. It is used only
    by the NetBackup server processes which read from or to the network, specifically,
    the bptm or bpdm processes. It is not used by any other NetBackup for Windows
    processes on a master server, media server, or client.


    This is the counterpart to the media server to the Communications Buffer parameter
    on the client, which is described below. The network buffer sizes are not required
    to be the same on all of your NetBackup systems for NetBackup to function properly,
    however, setting the Network Buffer Size on the media server and the Communications
    Buffer parameter on the client (see below) to the same value has achieved the
    best performance in some NetBackup installations.


    Similarly, the network buffer size does not have a direct relationship with the
    NetBackup buffer size (see below). They are separately tunable parameters. However,
    as you can see by the default value for network buffer size release in 4.5, setting
    the network buffer to a substantially larger value than the data buffer has achieved
    the best performance in some NetBackup installations.


    Tuning this parameter along with the Communications Buffer parameter on the client
    has resulted in significant improvements in the throughput of the network component
    data transfer path in some NetBackup installations.


    # NetBackup Client Communications Buffer Size.


    The NetBackup client has a tunable parameter that allows you to adjust the data
    transfer to the network. This parameter specifies the value that is used to call
    the setsockopt()\ Winsock2 API to set the network buffer size for backups (SO_SNDBUF).


    This is the counterpart to the client to the NetBackup server on the media server,
    described below. As mentioned, the buffer sizes are not required to be the same
    on all of your NetBackup systems for NetBackup to function properly. However,
    setting the Network Buffer Size on the media server (see above) and the Communications
    Buffer Size on the client to the same value achieves the best performance in some
    NetBackup installations.


    # To set the Communications Buffer Size parameter:


    +   1. From Host Properties in the NetBackup Administration Console in release
    4.5, or from the Configure NetBackup GUI in earlier releases, open the Client
    Properties dialog for the client on which the parameter is to be changed.


    +   2. From the Windows client set the Communications buffer size field:


    This parameter is specified in kilobytes. The default value is 32. An kilobyte
    is added internally for backup processes (SO_SNDBUF). Therefore, the default network
    buffer size for backups is 33792 bytes. In some NetBackup installations, this
    default value is too small. Increasing the value to 128 improves performance in
    these installations.


    Another way to set this parameter is to configure the Buffer_Size parameter in
    the registry.

    Locate the key using HKEY_LOCAL_MACHINE


    ```

    Software/ Veritas/NetBackup/CurrentVersion/Config

    ```


    Add or modify the Buffer_Size value, if the media server does not send data over
    the network, this parameter has no effect on those local operations. It is used
    only by the NetBackup client processes which write to the network, specifically,
    the bpbkar32 process. It is not used by any other NetBackup for Windows processes
    on a master server, media server, or client.


