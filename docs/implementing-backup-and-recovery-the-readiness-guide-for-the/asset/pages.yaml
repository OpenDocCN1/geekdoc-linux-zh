  md: '# Response Teams


    DR plans are executed by a group of people we call the response team. The team
    consists of subgroups responsible for executing this plan in a successful manner,
    including the emergency-call, assessment, and recovery teams. Certain members
    of the response team should manage the overall execution of the DR plan; preferably,
    in order to remain focused, they should have no other subgroup responsibilities.


    # Emergency On-Call


    The emergency-call team is the first line of support when the declaration is made.
    The primary team lead will initiate the plan once they have confirmed the declaration.
    An example of key positions and their responsibilities are listed in Table D.2.


    Fill out the complete call tree in Table D.3, including as many as possible.


    # Table D.2: Key Positions on the Emergency On-Call Team


    | KEY POSITION | RESPONSIBILITY |

    |---|---|

    | Primary contact | Leader of the recovery teams, assignment of tasks, and management
    of the DR plan. |

    | Secondary contact | Second in command to the Primary and would assume all responsibilities
    of the primary in the event the primary is not available. |

    | Tertiary contact | Assumes primary role in the event both primary and secondary
    leaders are not available. |

    | Management representative | Business unit representative whose responsibility
    to act as a liaison between the recovery team and corporate management. This individual
    should be instrumental in acquiring any additional resources necessary to make
    the recovery successful. |

    | Networking | Primary contact with group managing wide-area and local-area network
    infrastructure. |

    | Finance | This individual has appropriate authority to authorize purchases of
    assets or services in order to successfully recover the declared disaster. This
    person should have limits on her authority, and beyond that, a senior finance
    representative should be available for additional authorization. |

    | Facilities | Physical building, environmental controls, and so on. |

    | P.R. | This group will be responsible for all media communication when necessary.
    |


    # Table D.3: Emergency On-Call Team'
