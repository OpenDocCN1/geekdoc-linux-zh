  md: '# What Reports Are Available and What Do They Tell?


    As you start to use your backup application, you will want to create reports that
    help you know how things are going and enable you to update the status of the
    backup domain to others. Reports are an important part of backup application.
    NetBackup has reports that are available from the GUI. Most of these are created
    by executing a CLI with specific options. Many of these commands are documented,
    so you can use them to create custom reports if you do not find exactly what you
    want. Figure 6.14 shows the reports available from the Windows Administration
    Console.


    Following is a list of the ''named'' reports, but keep in mind there are literally
    endless possibilities for reporting if you dare dive into the CLI and create a
    custom reporting. Several of these scripts may be found at www.BackupScripts.com,
    a Web community devoted to the sharing of scripts, tips, and traps associated
    with NetBackup.


    Click here to expand list of each report.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_92_0.png)


    **Figure 6.14:** Reports from Windows Administration Console.


    +   - Status of Backups

    - Client Backups

    - Problems

    - All Log Entries

    - Media Lists

    - Media Contents (Caution: This will mount a tape and read its contents. This
    could potentially take a considerable amount of time depending on the size of
    the backup image you are reading.)

    - Images on Media

    - Media Logs

    - Media Summary

    - Media Written


    If you are using a UNIX master and want to see the reports without using the CLI
    or GUI, you can use the character-based menu interface bpdam. This also gives
    you access to all the reports. Figure 6.15'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'lists the backup reports and the media report category available to. This interface
    may be a bit difficult to navigate, if you are used to using a GUI, but after
    a few times, it should become quite easy and much faster for remote management
    needs.


    The two interfaces are very similar in that they both allow you to run the exact
    same reports, but the character-based interface presents their selections bit
    differently from the GUI. As you can see in Figure 6.15, the following backup
    reports are listed:


    +   * Backup Status

    * List Client Backups

    * Problems

    * All Log Entries


    While this interface may not be your first choice, it is an excellent tool to
    help you understand the NetBackup architecture. The reports in the list are purely
    NetBackup reports, relying completely on the NetBackup logs, /usr/open/netbackup/db/error
    on UNIX or c:\Program Files\Veritas\NetBackup\db\error on Windows NT/2000.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_93_0.png)


    **Figure 6.15**: Character-based interface bpmdm.


    There are two general types of reports: backup reports and media reports. Backup
    reports report on the jobs and errors. Media reports give you the ability to look
    at the catalog information from the perspective of the media and the perspective
    of the image. As mentioned earlier, these are the canned reports that are available
