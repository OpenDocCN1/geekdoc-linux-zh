    (TLH) robot.


    +   **tmld** Tape Library Multimedia (TLM) daemon interfaces with Media Manager
    to mount and unmount tapes in a Tape Library Multimedia (TLM) robot.


    +   **ptautocont** Manages the global database host is normally used by the Device
