    As we review this list, we first need to prioritize what we want to accomplish
    and make sure that as we move through the troubleshooting process, the task leads
    to the next, when possible. So as we begin, let''s prioritize based on good feel,
    so you apply it in this environment, keep this in mind: There is no perfect method
    for troubleshooting, simply varies. Choose your style and run with it.


    Our plan was to focus on the first client and not the network, especially since
    we knew RAID5 was involved. For those who do not know, RAID is good for writes
    but terrible for reads. With backup, we do lots of reads and very few writes.
    Knowing this made our troubleshooting job much easier. Picture an example: the
    initial task in the water is possible with the NT/2000 client, and each subsequent
    ripple is another one of our, ultimately leading us out to our backup server.
    A natural progression is a good practice to adhere to possible.


    From the client, our test plan looked something like this:


    +   1. Run ScanDisk, if we can get approval from the admin team for this box.


    +   2. Copy data from disk in question to a separate disk, note time started and
    finished, size (minimum 1 GB of data).


    +   3. Use utility from backup software if available to read data from disk in
    question. Note time started and finished. Size should be a minimum of 1 GB of
    data.


    +   4. Investigate number of files/directories.'
