  md: '# Back Cover


    System backup is essential in any enterprise—backup is equivalent to protecting
    the company or agency. Whether you have the task of implementing backup and recovery
    system for your organization or are thinking about backup and recovery within
    the scope of total data availability, Implementing Backup and Recovery is an invaluable
    resource. This detailed guide takes you through the necessary and steps of deploying
    services by showing you how to address the architecture, limitations, and capabilities
    of the existing network infrastructure.


    After an introduction to backup and recovery in the enterprise, Little and Chapa
    provide a tutorial on the components of backup. Then, VERITAS NetBackup as an
    example, they show you how to install and configure NetBackup application, and
    how to customize services to meet customer needs. Throughout the book, the authors
    use real-life client situations to explain specific concepts. In addition, you
    will also learn:


    +   * The business and legal requirements of backup systems

    * VERITAS NetBackup''s tiered architecture and configuration elements

    * What the future holds for backup and recovery


    # About the Authors


    David B. Little is the Senior Product Specialist for VERITAS NetBackup. For the
    last thirty-five years, he has had a variety of technical positions working with
    enterprise companies.


    David A. Chapa is the Director of Consulting Services for DataStaff, Inc. and
    co-founder and Vice President of Gray House Solutions, Inc., a software company
    that provides integrated disaster recovery solutions. His experience spans eighteen
    years in the computer industry.'
