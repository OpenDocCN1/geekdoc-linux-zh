  md: '# Installation


    The normal procedure when setting up a backup domain is to install NetBackup on
    the master server and then install the master servers if applicable. The clients
    are usually pushed from the master, as long as they are similar in that we can
    push UNIX clients from a UNIX master server and Windows clients from a Windows
    server. The actual installation steps are for UNIX and Windows servers.


    # UNIX Master Server


    NetBackup supports many UNIX platforms. To simplify the installation procedure,
    an installation script is provided that interfaces with the specific operating
    system. This script will work with all the supported UNIX servers for both the
    master server and media server installation. The easiest way to install the software
    on a master server is to load the CD-ROM containing the NetBackup release for
    the appropriate operating system in the local CD-ROM drive. You then change your
    working directory to the CD-ROM. A list of files on the CD-ROM will look like
    the following for Sun, HP, or Linux system:


    ```

    # ls

    NB-Java NBClients hp-ux install linux solaris

    Doc

    ```


    It is not necessary to change directory to the subdirectories at this point, as
    the install script will control all this. If you are installing from other UNIX
    CD-ROM, the list will look like this:


