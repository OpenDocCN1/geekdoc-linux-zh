  md: '# Intelligent Backup Software


    How intelligent we want the backup software to be? Well, let''s speculate. First
    of all, let''s all agree that backup administrator isn''t the most appreciated
    position in the company. In fact, the only time we seem to hear any kind of comment
    is when there is a problem. In most cases, we find ourselves having to track down
    problems that may been introduced by an undocumented system change thanks to a
    hasty administrator who wanted to get his weekend started a little early on a
    Friday afternoon. We don''t find out the problem exists until backup starts at
    10:00 P.M. or even later. It wouldn''t be great if the backup client had level
    of intelligence built-in, to the point that it may be capable of re-installing
    backup client software, discovering additional filesystems, performing some self-tunning,
    and handling other tasks that we usually have to perform?


    In today''s production environments, we rarely seem to optimize the server performance
    for fear that we may stop something from working. The basic rule of thumb is,
    ''if it ain''t broke, don''t fix it,'' and if we decide to optimize, we hire consultants
    to perform an audit, which isn''t a bad idea. But wouldn''t you like to have a
    self-tunning backup server, or at least one that would email you an update of
    its findings so you might proactively make adjustments and changes based on the
    recommendations of the intelligent backup server? What about one that periodically
    query the client software installed and remind the administrators, we would find
    out about problems at lunchtime rather than bedtime.


    What about true load balancing? Perhaps the backup servers in the future will
    dynamically balance their ever-increasing data loads to the backup storage devices.
    Optionally, they would make some logical choices before the backup window opens
    and further refine those choices during the backup process. Or even, as previously
    stated, this intelligent server could email us with recommendations for load balancing
    before we allow it to make those changes.'
