  md: '# The Great Divide


    As most of the backup products on the market, you can add additional backup servers
    to offset the workload of an overly burdened server. The question is, what advantage
    or disadvantage is there when implementing a solution like this? In this section,
    we will use VERITAS NetBackup as the backup tool for the illustrations, but practically
    speaking, the concepts within this chapter can be applied to other solutions on
    the market as well. A word of advice before we jump into this section of the chapter:
    Unless there is a compelling reason for additional servers, maintaining the existing
    environment for as long as you can minimize its complexity.


    For, one of our clients used VERITAS NetBackup to decide what to make with regard
    their expanding estate. They had, say, building A and building B 6 miles apart,
    with a fairly equal amount of data in each data center. Their buildings had a
    large-capacity site and tape drive fibre between the buildings-the dark fibre
    yet to be implemented as well as a 2-GB network pipe used for connectivity. They
    wanted to expand into building B, the decision before there was to add another
    primary backup or a secondary server within the current primary domain. The other
    challenge presenting itself was a request from the business to address the architecture
    to meet their data requirements.


    The business managers made it known that they wanted their data off-site as close
    to the completion of the backup jobs as possible. This seemed like an unrealistic
    expectation that off-site vendors typically operate during business hours for
    pickup and delivery, unless you pay a premium. We did do some research to see
    what an off-site vendor would charge for that type of service, just in case the
    client asked for any input on the matter. If memory servers caught, the expense
    outweighed the benefit. They decided to look other options, such as using the
    buildings 6 miles apart to move data back to ''off-site'' staging facility.


    One of the options would consist of placing a media server in building B within
    the domain of the NetBackup server in building. The media server in building B
    would back up the data in the same building, then a copy would be created to be
    off-site.


    > Note NetBackup master manages the what, where, and why of the backup policies.
    A backup server under the control of a NetBackup master server is called a media
    server, which is types, storage, tape drive, optical drives, control, and robotic
    management. The media server will respect the NetBackup master server for mounts
    and optical units, and it tracks the physical condition and location of all the
    media.


    The architecture of this expansion takes on a new perspective, since this client
    used VERITAS NetBackup Version 3.4, which does not support the pooling of local
    storage or storage units (called storage groups in Version 4.5).


    > Note Had the client deployed NetBackup Version 4.5, they could have used unit
    groups to contain the data to a geographic location. For example, if all the data
    in building B had be backed up to building A, a storage unit group could have
    been created containing all of building A''s units. Then they all would have had
    to modify the backup policies to use the storage group versus the single unit.
    If you find yourself running into this situation, you should consider an upgrade
    to Version 4.5.


    So this would mean that all backup policies for building B would specifically
    request the storage unit in building B. If building B grows beyond its current
    size, this would work beautifully, but as we know data grows, so eventually they
    would have to expand with yet another media server in building B. The complexity
    of this solution within NetBackup Version 3.4 increases and becomes much more
    difficult to manage.


    In this scenario, the administrator would basically be required to ''balance''
    the backup policies between the storage units. However, this didn''t meet the
    original expectations of the business managers,'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'who wanted to have their data off-site as soon after the backup as possible.
    The idea of a cross-building backup was introduced; again, this would work well
    with NetBackup Version 4.5, using the storage units groups.


    Now we were starting to see the complexity of having to manage 40 or more backup
    policies and balance them among the storage units between buildings, as a result
    of the limited functionality of pr-4.5 NetBackup. If there were a compelling reason
    to upgrade to the latest version of software, this is one of them. If you choose
    Any Storage Unit in your backup policy, NetBackup, in a round-robin fashion, select
    any available storage unit not defined by demand (only backup that specifically
    demand this storage unit may it). If all of the storage units are available by
    the Any Storage Unit attribute, it very well means that data we backed up to the
    other building might be locally backed up.


    You can start to see the complexity of building up now. This is all part of a
    storage architect: planning based on customer expectations and working through
    all of the possible scenarios to create a reasonable solution. This particular
    scenario proved to be the wrong solution for this environment, giving the customer''s
    desire to remain at the current environment.


    The second option was creating a completely separate NetBackup master server domain
    in building B. This would allow cross-building backup and effectively meet the
    expectations of the business managers. The storage units could be created by any
    backup policy, so no administration would be required for the backup policies;
    the backup from A to building B happen without issues.


    All of the issues that were uncovered when reviewing the additional Media Server
    would be addressed by either upgrading to NetBackup Version 4.5 or by continuing
    with NetBackup 3.4 and deploying the second server. A higher priority was given
    to bringing building B without an upgrade, but an upgrade was planned for some
    next year during phase III of the architecture plan.


    If you go there, you have two catalogs to back up and are working properly, two
    separate client configuration files to maintain, two separate global configuration
    policies to maintain, two backup policies, media databases and the list goes on.
    However, this was the best solution giving what the customer was interested in.


    The question of how to divide into multiple backup servers is clearly answered
    by two words: it depends. It depends on your environment, the customers, and whether
    your business is willing to tolerate. Remember, change for the sake of change
    only adds potentially unnecessary complexity to our already busy schedule as administrators.


    > Tip Identify those compelling reasons for change, decide if the benefit outweighs
    the pains of change, plan your work and work your plan.


    # ## Advantages and Disadvantages of the Great Divide


    There are advantages and disadvantages in any choices we make. For instance, consider
    the purchase of a new vehicle. When you have more seating-capacity-the-back but
    find that the larger requires more fuel to operate-the-driving. Further, the advantage
    may even become the de facto chafeleaver whenever you have more seating capacity,
    you do find that when you have large group lunch outings.


    You can come up with many reasons why or not to buy your configuration into multiple
    server domains. In the following, we outline some advantages and disadvantages
    of using a single backup server or multiple backup servers or masters:


    # ## Lone-Server Advantages


    The benefits of keeping a single master include having a single point of control,
    configuration, and backup image catalog repository. This doesn''t sound like much
    when you are only talking about two servers, one master and one media. However,
    if you have one master and 22 media servers, it minimizes the complexity of the
    environment.


    # ## Single Point of Administration'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'There is one location to manage all of the servers within the domain. This
    includes all of the policy control, job control, device control, and media control.
    While additional server resources will add complexity to your environment, having
    a single point of administrative control will minimize the management effort.


    # Central Catalog Repository


    The image catalog for VERITAS NetBackup typically will be the largest of all the
    catalogs that it, and it is a very critical piece of the puzzle when recovering
    client data. Having only one master means there is only one location for the image
    catalog which means there is only one catalog back up.


    # Central Configuration Control


    Backup policy or global configuration changes are made at one server for all of
    the backup servers within the domain. Again, if we are speaking of two or three
    servers, this might not sound that terrible, but when the number reaches 22, you
    start to see the benefit of a single primary or master server.


    # Storage Access


    With the additional servers or media servers, there exist more storage devices
    to be used during the backup process and sharing of the backup workload across
    all servers. If the reason for the expansion was performance related, this might
    help to increase the aggregate throughput of the backup jobs.


    # Minimize Complexity


    Simpler is better. You are less likely to have a misunderstanding with the more
    junior members of the administration staff, or even the senior members. A single-master
    approach also minimizes the site documentation that needs to be developed and
    maintained, which we know can be tedious work.


    # Scalability


    At least with NetBackup, its strength is in its scalability: it can transition
    from a small to medium-size site with one server acting as master and media server
    to an environment with multiple servers protecting the environment and all controlled
    by one master.


    # Lone-Server Disadvantages


