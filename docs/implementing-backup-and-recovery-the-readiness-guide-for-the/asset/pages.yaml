  md: '# Who Should Read This Book


    This book should provide helpful information for anyone who is involved in protecting
    the ever-growing volume of data that everyone depends on. This could be the person
    in the information technology (IT) or information services (IS) department, the
    database administrator, or the backup administrator. This could also include the
    value-added reseller (VAR) who is responsible for assisting his or her clients
    in setting up a backup and restore system. Also, anyone who uses VERITAS Software''s
    NetBackup will find this book invaluable, especially the detailed appendices.
    This book is also a necessity for anyone who wants to complete the ultimate computer
    library. There is a chapter that discusses the other major applications that are
    available, where we give equal billing to the ''major players''.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Summary


    We hope you find this work very useful as you plan, maintain, and administer your
    backup environments. It is our desire that the practices found in this work provide
    you a level of consistency in the planning, architecting, and delivery of your
    solutions. One thing we have learned while writing this book is that there is
    a variety of ways to accomplish the same task. What we have attempted to do here
    is to document those practices that will minimize the complexity within your environment
    while maintaining a highly efficient and effective solution.


    In the beginning of this introduction, we welcomed you to the wonderful world
    of backup and recovery. However, when it comes to planning, we should really call
    it the wonderful world of ''recovery and backup.'' As you see in the pages that
    follow, it is the recovery requirement that defines our backup strategy-not the
    speed of our backup. The strategy, and it is our time to recovery that defines
    our success-the role of the backup administrator is integral in any company; in
    fact, you can consider it the second most important job in your company. When
    does it become the first? When they cannot access their data!'
  merge: -1
