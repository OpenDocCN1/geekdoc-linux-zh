  md: '# Offhost Backups


    As the challenges of backup continue to grow, everyone is looking for new ways
    to meet these challenges. One of the new backup methods is sometimes referred
    to as serverless or server-free backup. The more correct name is offhost backup.
    This backup method uses a separate backup agent located on a media server or a
    third-party party (3PC) device to actually move the data from the client disk
    to storage.


    Figure 7.3 shows an example of an implementation of offhost backup using NetBackup.
    The backup agent in this case could be either a media server or a third-party
    party (3PC) device that implements SCSI Extended Copy commands. Many types of
    3PC devices can act as backup agents, as as


    +   - Bridge

    - Router

    - Robotic library

    - Disk array


    One of the key elements for offhost backups is that the backup must be done from
    a frozen image. Any of the frozen image types listed in the section can be used.
    Sometimes this feature is confused with the LAN-free backup feature such as the
    NetBackup SSO feature. If the requirement is to keep the backup data off the LAN
    or to do a frozen image backup so that the application can continue to be available,
    either SSO or frozen image backups will fulfill the need. If the problem is that
    the backup overhead is too much for the application server to handle, offhost
    backup is the solution. By using offhost backup, you are moving the disk reads
    and the tape writes to a separate backup agent who will actually perform this
    work.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_110_0.png)'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# Managing a Large Environment Using Global Data Manager (GDM)


    Many people find that a single backup domain is no longer an option. This can
    be due to physical reasons (domains in different geographic locations), business
    reasons (different business units), or size (too big for a single domain). Finding
    yourself with multiple domains makes the administration much more complicated.
    In situations like this it is nice to find a feature as Global Data Manager (GDM)
    from VERITAS Software. This feature is a fourth tier in the NetBackup architecture.
    It is a master of masters that provides a single console that allows you to see
    and manage all of your backup domains. This type of feature makes it much easier
    to administer distributed backup domains by using a dashboard that gives you,
    at a glance, the real-time status and health of all your domains.


    Figure 7.4 shows a typical GDM layout. As you can see, each of the masters or
    stores gathers data about its domain and rolls the data up to the master of masters
    or stores it in a local database where it is needed. Figure 7.5 is a sample of
    the dashboard used by GDM.


