- img_proc: true
  md: '# # Frozen Image Backups


    The administrator faces many challenges with backups, but one of the determining
    how to finish the backup within the allotted backup window. One of the constraints
    on the backup window is the requirement to keep the database or filesystem available
    as much as possible. As we have seen, the backup agents make it possible to do
    that backups, but there is still a performance impact. Another way to address
    the requirement to backup data, especially data that resides in volumes or databases
    with a minimal impact on the application, is to use some type of frozen backup.
    A frozen image is a static copy of the copy data made prior to backup. Such a
    copy is important on active filesystems and databases, where files or tables can
    occur at any time. In such cases, making a consistent copy (frozen image) is a
    prerequisite to making a correct backup. A frozen image is created very rapidly,
    causing minimal impact on other operations. There are two types: copy-on-write
    snapshot and mirror.


    # # Copy-on-Write Snapshot


    A-on-write snapshot is a detailed copy of data as it existed at a certain moment.
    Unlike a mirror, which we discuss next, it is not really a copy of the data, but
    a particular ''record'' of it. The copy-on-write snapshot process works as:


    +   1. When a frozen image is active, any unfinished transactions or changes to
    the source data are allowed to complete, but new changes are temporarily stalled.

    2. The source is momentarily (made quiescent), and a snapshot is injected into
    the host operating system.

    3. Once the snapshot driver is activated, new transactions or changes (writes)
    to the source data are allowed to take place. The snapshot driver intercepts or
    holds the requests, while it copies any blocks that will be affected by those
    writes and keeps a record of the cached blocks.


    In other words, the snapshot driver reads each block that is about to change,
    copies the block''s current data to cache, records the location and identity of
    the cached blocks. The interrupted writes are allowed to take place in the source
    blocks. The immediate results of the snapshot are as follows:


    +   - A cached copy of those portions of the source that were about to change
    at a certain moment

    - A record of where cached portions (blocks) are stored


    The copy-on-write snapshot does not produce a copy of the source; it cached copies
    of the blocks that have changed and a record of their location. The backup process
    refers to the source data or copy of data directed by the snapshot driver. An
    accurate image is obtained by combining the unmerged portions of the data with
    the snapshot cache. When a backup of the frozen image begins, the backup process
    copies the source data until it comes to a block that has changed after the snapshot
    driver tells the backup process to skip that block and read in the cached (original)
    copy. The backup application continues reading data as the snapshot driver directs
    it. Once the finished, it is an exact copy of the source as it existed at the
    moment the snapshot driver was activated.


    Different kinds of snapshots are available. Veritas NetBackup offers a copy-on-write
    snapshot using a proprietary snapshot driver called rnb_snap that works with either
    Sun Solaris UFS filesystem or Veritas VxFS filesystem. It also supports clones,
    which is a feature of VxFS.


    Another backup challenge can be helped with snapshots the backup of a filesystem
    that contains hundreds of thousands or millions of small files. Doing a standard
    backup of such a using the standard operating system commands is very time-consuming.
    Just to traverse'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'the filesystem buried a list of all the files takes a lot of time. The best
    way to back it up without using snapshot technology is to do the following:


    +   1. Unmount the filesystem.

    2. Perform a raw backup of the filesystem.

    3. Remount the filesystem.


    There are some disadvantages to doing this kind of backup:


    * The filesystem is not available during the time of the backup.

    * All backups are full backups.

    * All restores are full filesystem restores. Single file restores are not possible.


    The better option for backing up this kind of data is to use a snapshot. An example
    is the NetBackup FlashBack option. With this technology, you have the advantages
    of a raw backup without the penalties. It is a copy-on-write snapshot technology
    using a proprietary snapshot driver. This feature is available for the following
    filesystem types: Sun Solaris UFS, VERITAS VxFS on Solaris or HP-UX, and Online
    JFS on HP-UX. FlashBack creates consistent, point-time backups at the file level.
    In the event of a restore, it enables file mapping created during the snapshot
    to restore single files or directories. It also enables administrators with millions
    of files to conduct and restore operations by a combination of file mapping and
    snapshot technologies.


    The advantages of using such a technology as FlashBack over standard filesystem
    or raw backups are as follows:


    * It provides increased performance, especially if the filesystem contains a very
    large number of files and most of the filesystem blocks are allocated.

    * It allows individual file restores.

    * The volume or filesystem remains mounted.

    * It supports multiple streams and incremental backups.


    # Mirror


    Mirror is a data copy on a separate disk, physically independent of the source.
    Every change or write to the source data on the primary disk is also the copy
    on the secondary disk. This creates a mirror image of the source data. With a
    copy-on-write snapshot, when an image is required, transactions are allowed to
    finish and new I/O on the primary disk is briefly held. When the mirror image
    is up-to-date with the source (made identical to it), the mirror is split from
    the primary, meaning any new changes that can be made to the primary but not to
    the mirror. At this point, the mirror can be backed up.


    Since mirroring requires an exact, complete copy of the primary image, it consumes
    more disk space than a copy-on-write snapshot. The data can exist in a disk management
    software, such as Veritas Snapshot Mirror, or it can exist on a disk array controlled
    by the array-specific mirroring software, such as EMC TimeFinder DataShowMirror,
    HP-UX BusinessCopy, IBM FlashCopy, and others. At the end of the backup, the split
    mirror is rejoined with the primary mirror and mirrors are resynchronized. Some
    applications, such as NetBackup, allow you to run with the mirrors and resynchronize
    the mirrors just prior to backing up the data. This is for those who like to synchronizing
    the mirrors once a day and run with the mirrors split.


    # BACKING UP THE MAIL


    No doubt there are many examples of customers using frozen image backups to handle
    applications such as mail. We know of one in particular that was using a UNIX
    system and'
