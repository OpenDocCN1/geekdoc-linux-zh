  md: 'Total Number of Incremental Backups = $T_{RU} / l_I$

    Days of Full Backups (Differential Not Needed) = $T_F = T_F / l_F$

    Size of Incremental Backup = $D_{inc} = D_{inc} \cdot l_I$


    Proof:

    Total Archive Size:


    ```

    $Diff_{inc} = D_{inc} (T_{RU} - T_F)$

    $Diff_{inc} = D_{inc} (T_{RU} - T_F)$

    $= D_{inc} \cdot (\frac{l_I}{F_I} - \frac{l_I}{F_F})$

    $= D_{inc} \cdot l_I \cdot (\frac{1}{F_I} - \frac{1}{F_F})$

    ```


    **Figure 9.4:** Proof of Differential Archive.


    Grip a piece of paper and use your 2 pencil and follow along with the proof. Math
    is a wonderful thing.

    So as you can, capacity planning is much easier by employing these charts, graphs,
