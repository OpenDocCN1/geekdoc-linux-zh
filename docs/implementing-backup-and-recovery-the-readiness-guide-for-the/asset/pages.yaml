  md: '# NT/2000, 300GB, RAID5, and Home Directories


    The next real-life example involves an NT/2000 server backup client and a UNIX
    backup server. The customer indicated that this particular NT machine was having
    problems its backup job. The backup job failing with a Network Timeout error.
    The information our consultant received that it was an NT/2000 machine whose serving
    was as a home directory server, it used RAID5, and it had 300 GB of disk, of which
    80 percent was in use. The backup infrastructure for this customer is quite impressive;
    large STK9310, 9840A, 9840B, and 9940A drives; ACS/IS library software; Sun servers
    for the backup servers; and GB Ethernet server-network environment to work in.
    Now before you jump to conclusions, this NT client had a return performance number
    of ~3 MB/second. This NT server was no slough; it was nicely configured as well:


    +   - Windows 2000 SP2


    +   - 2-GB RAM


    +   - 20/100 Compaq NC3131


    +   - One Gigabit Ethernet Compaq NC6134


    +   - One Compaq Smart Array 4311 Controller


    +   - Two Compaq StorageWorks HBA


    +   - Three Intel P3 550 MHz

    As mentioned, the storage on this server had a volume of 300 GB with 80 percent
    utilized, or approximately 240 GB of home directory data.


    Before we get into the troubleshooting, let''s talk about what we should expect
    to see out of this client. Gigabit Ethernet could give you nearly 100 MB/second
    transfer speeds. The 9840A, the slowest of these, is rated at 10 MB/second and
    35 MB/second compressed. As you can see, if we can push data at 40 percent of
    the Ethernet rate, we would still be able to keep drive streaming-the operative
    word being *should*. However, we were only seeing 3 to 5 MB/second to the tape
    drive for this particular client. Now, there are several components that can drive:


    +   - Network

    - Client

    - Backup server

    - Tape hardware

    - Tape hardware connectivity to backup server


    Any of these items could be the culprit at the customer site. As troubleshooter,
    it is your job to narrow your scope in order to bring closure to this issue quickly.
    One of the ways that we do is by logical deduction.


    Here''s what we know about the problem:


    +   1. It is not pervasive; in other words, it is not affecting all clients across
    the board.

    2. Other clients are completing successfully to the same tape hardware as the
    failed client with relatively good good performance numbers.

    3. Our review did not conclusively pinpoint a particular tape drive as the potential
    culprit.

    4. It appears only to fail on full backup jobs; incremental jobs seem to finish,
    although they are beginning to fail as well.'
