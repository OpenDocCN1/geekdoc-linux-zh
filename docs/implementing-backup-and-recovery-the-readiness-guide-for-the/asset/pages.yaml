  md: 'VERITAS NetBackup utilizes the traditional, tried-and-true method of backup,
    full and incremental. Incremental backups copy files that have changed since the
    last backup; this type of NetBackup is called a differential. However, in Version
    2.0 of NetBackup, engineering introduced True Image Recovery (TIR) to allow the
    backup administrator to recover a failed disk or directory to a specific time.
    One of the dilemmas of the method was the fact that you may recover more than
    you have space and potentially more files than the user needed because of the
    deleted files. TIR addresses this problem by maintaining an in-place database
    of all the deleted files. This requires space, but the software typically manages
    tapes and true image database. When TIR is restore it identifies which files need
    to be recovered on the restore criteria. The ending result is a disk or directory
    which is exactly what the user had anticipated from the last backup, a true image
    restore.


    While this is a significant improvement over the traditional method, it requires
    all those differential backup tapes, which may delay your recovery slightly. This
    is how VERITAS introduced another type of incremental backup, cumulative backup,
    a backup that copies all files changed since the last backup. The benefit of implementing
    cumulative incremental backup jobs is reducing the number of tapes required for
    a full recovery. Many customers have blended differential and cumulative incremental
    backups to aid in shortening their recovery times from tape.


    # Principles of Recovery


    VERITAS views recovery in terms of information availability. How much do down
    systems cost your business? VERITAS offers integrated solutions that can deliver
    as much as 95 percent uptime to 95.9999 percent uptime or time. Via backup, Replication,
    Clustering, and global clustering, the VERITAS product supports the creation of
    comprehensive disaster recovery plans based on the level of information availability.


    Through Veritas''s recent acquisition of The Kernel Group, it has now added Bare
    Metal Recovery (BMR) to its product offerings. BMR utilizes the TIR function of
    NetBackup to recover systems without operator intervention beyond a few clicks
    of the mouse via the browser-based interface. During installation, OS images are
    installed to the BMR server for the clients that are protected by the NetBackup
    servers. Next, disk partition information is saved to the BMR server for the clients
    that have BMR protection to facilitate the complete and total.


    Bare Metal Recovery protects systems using HP-UX, AIX, Sun Solaris, and Microsoft
    Windows NT 4.0/2000, with additional platform support planned for future releases.


    At the base of any disaster recovery plan, however, is backup and recovery with
    off-site tape vaulting. The essence of vaulting is to create duplicate backup
    tapes, which are brought from the primary site to an off-site location (vault).
    If the primary site is rendered inaccessible and data are lost, the remote location
    may be used with backup hardware to recover data and restore information availability.


    NetBackup Vault is highly integrated within NetBackup 4.5. NetBackup automates
    the duplication, tracking, and reporting for the purposes of offsite storage as
    a disaster recovery center, in the event of a facility loss or on-site media failure,
    a Vault-protected environment has the option of retrieving duplicate data for
    recovery. NetBackup 4.5 now supports up to 10 copies of a backup image versus
    the previous version two-copy limitation.


