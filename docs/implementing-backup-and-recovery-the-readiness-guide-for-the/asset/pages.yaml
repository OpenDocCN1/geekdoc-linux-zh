  md: '# Chapter 1: Backup and Recovery System Requirements Explained


    # Overview


    backup is a copy of a defined set of data, ideally as it exists at a point in
    time. It is central to any data protection architecture. In a well-run information
    services operation, backups are stored at a physical distance from operational
    data, usually on tape or other removable media, so that they can survive events
    that destroy or corrupt operational databases. Backups may be


    +   - Kept at the data center, so that if a storage device, system, or application
    failure operational error destroys vital online data, the business can restore
    its operational records as of a relatively recent fixed point in time. From that
    point, database logs can restore (nearly) up-to-date business data.

    - Moved to one or more alternate sites, to protect against environmental events
    that destroy an entire data center. With recent backups of operational databases,
    a business can resume operation quickly when alternative computing facilities
    are available.

    - Made unalterable (for example, copied onto CD-ROM) to provide durable business
    records for regulatory and business policy purposes when the data is no longer
    required online.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Backup Seems Simple ...


    Conceptually, a backup strategy is simple. A system administrator decides what
    data is critical for business operation, what has a minimal effect on operations,
    and uses a backup utility to make the copies. The backups are stored in a safe
    place so they can be used to recover from a failure.


    Though a backup strategy is simple in concept, the difficulty comes in the details.
    Architecting a backup and recovery strategy is more involved than most people
    realize. One of the most frustrating and discouraging tasks is determining where
    to start. What first seems a simple task becomes daunting as you dig deeper and
    how many elements of the backup strategy are interconnected. For example, as a
    system administrator of a large enterprise, are you wanted without the burden
    of deciding what to backup, and for how long is it kept? In first fact, you may
    be presented with various analysis summaries of the business units or the task
    of interviewing the business managers yourself in order to have them determine
    the data, the window in which backup may run, and the retention of the data once
    it is stored on the backup media. This is often called a business impact analysis
    (BIA) and would yield some results that would be useful during the policy-making
    process. The reports should also be updated. Knowledge of these requirements may,
    in fact, change the entire budget structure for your backup environment, so it
    is imperative during the design and architecture phase that you have some understanding
    of what the business goals are with regard to recovery.


    You will find that many business managers are not as concerned about backup as
    we are with recovery. As you can see from the complexity of our example, too often
    the resulting frustration may lead to inactivity where nothing gets done- at least
    not in the most effective manner. The obvious intent of a backup and recovery
    system is to provide data protection. Since we are to protect the data, each step
    determines how much data is in the enterprise and where it resides. This is an
    important part of establishing the backup and recovery system. In addition to
    knowing how much data you have and where it is, you must also have a good understanding
    of why the data is being backed up and what the recovery requirements are. This
    is necessary so you can make the appropriate decisions about the overall backup
    and recovery strategy. The more you understand the nature of the data and the
    level of protection required, the better decisions you can make in setting up
    the entire backup and recovery environment.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# The Goals of Tape Backup


    You always want to keep in mind that the overall goal of tape backup is to make
    copies of your data that can be used to recover from any kind of data loss. The
    primary goals of the tape backup portion of an overall data protection strategy
    are to do the following:


    +   - Understand the goals of the business in order to deliver a properly configured
    backup environment.

    - Enable information services to resume as quickly as physically possible after
    any system component failure or application error.

    - Enable data to be relocated to where it''s needed, when it''s needed by the
    business.

    - Meet regulatory and business policy data retention requirements.

    - Meet recovery goals; in the event of a disaster, return the business to a predetermined
    operating level.


    Each of these goals relates to a specific area of data protection and needs to
    be considered as we put together our overall backup strategy. Specifically, you
    should ask why data is backed up. As you consider each system or group of systems,
    keep in mind whether the data is being backed up to protect against failure, disaster,
    or regulatory requirements; and if the goals of the business will be met in the
    event of a failure or disaster. In reality, your success as a backup administrator
    will not be measured by how fast you are able to back up your data but how swiftly
    you are able to meet the aforementioned goals. Stated simply, your success will
    be defined by the restorability of the data in the environment.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# The Role of Tape Backup


    For a personal computer, backup typically making a copy of the data on the computer''s
    hard drive onto a tape or CD-ROM. Personal backup media are often labeled by hand
    and are ''managed'' by storing them in a drawer or cabinet in the room with the
    computer. In the enterprise, data protection is a little more complex. Enterprise
    backup must be able to do the following:


    +   - Make copies of your data, whether organized as files, databases, or the
    contents of logical volumes or disks.

    - Manage the backup media that contain these copies so that any backup copy of
    any data can be quickly and reliably located when required, and so that the media
    can be tracked accurately, regardless of the number.

    - Provide mechanisms to duplicate sets of backed up data that while a copy remains
    on-site for quick restores, another copy can be taken off-site for archival or
    disaster protection purposes.

    - Track the location of all copies of data accurately.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Why Is the Data Backed Up?


    Why you are backing up data seems like a question, but it really needs to be answered
    for all the data in the enterprise. Some of the most common answers to this question
    are as follows:


    +   - Business requirement

    - Hardware failure protection

    - Disaster recovery (DR)

    - Protection from application failure

    - Protection from user error

    - Specific service-level agreements with the users/customers (SLA)

    - Legal requirements


    We need to understand what data systems falls into each category. By interviewing
    the data owners, you will be better equipped to categorize what it takes to recover
    the operating system and in some cases, the database engines and other applications.
    However, one must be placed upon the data owner (customer) for the administrators
    to fully understand the impact to the business in the event there is a data loss
    (BIA). Addressing these questions will save so much money, and potential embarrassment.
    Several years ago one of us suggested that building a backup solution would allow
    for quick recovery. ''Quick'' recovery seems so easy, so what is your expectation
    of a ''quick'' recovery? Based on the requirement of 30 minutes, a proposal was
    drafted for the type of system that needs to be designed to meet this 30-minute
    window. After management reviewed the proposal, we agreed to a more realistic
    time frame. So you can see how this would give you an opportunity to show how
    much money their requirements will cost without having to lose sleep in the process.


    You will usually find some of the systems have fairly static and would probably
    be backed up to protect against hardware failure or DR. Other systems are very
    dynamic with a very active user base. backup of this data should be considered
    for protection against application failure or user error. What is generally seen
    is a mixture of these data types. The operating system (OS) and base applications
    are usually static and can be rebuilt from release materials, while data used
    by the application can be very volatile. We will discuss each of these in more
    detail. Defining data types is vital, understanding the data allows us to determine
    the recovery requirements. In most cases, the recovery requirements dictate the
    backup strategy.


    # Hardware Failure


    Some of the data in an enterprise is backed up properly to protect against hardware
    failure. You want to be sure you can recover an entire volume or database in case
    a disk or server fails. The probability of doing any error (less than the entire
    volume is very small). The backup protection will be guaranteed by this recovery
    strategy.


    The best pure failure protection is disk mirroring-making a complete second copy
    of the data on disk to another disk; however, the practice does not eliminate
    the need for backups. For a disk that falls into this category, you might consider
    volume backups where all the data in a disk volume is backed up a bit-by-bit backup
    of a partition of a drive on Unix. In Windows NT 2000, this is called disk-image
    backup. You do not read the data via the filesystem, so you avoiding this process
    to the system overhead. A raw backup can give you much better backup performance;
    however, it has some restrictions. The primary restriction is that you back up
