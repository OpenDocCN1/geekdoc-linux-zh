    \ receives data from the network and places it in the shared buffers. The parent\
    \ bptm process on the media server reads the data from the shared buffers and\
    \ writes it to tape.\n\n# Restore of Remote Client. During the restore of the\
    \ remote client, the parent bptm process reads data from the tape and places it\
    \ into the shared buffers. The child bptm process reads the data from the shared\
    \ buffers and writes it to the network. The tar32 process on the remote client\
    \ receives data from the network and writes it to disk.\n\n# Roles of Processes\
    \ during Backup and Restore Operations\n\nWhen a process attempts to use a shared\
    \ buffer, it first verifies that the next buffer is in a correct state. A data\
    \ producer needs an empty buffer, while a data consumer needs a full buffer. The\
    \ following chart provides a mapping of processes and their roles during backup\
    \ and restore operations:\n\n| OPERATION | DATA PRODUCER | DATA CONSUMER |\n|\
    \ --- | --- | --- |\n| Local Backup | bpbkar32 | bptm |\n| Remote Backup | bptm\
    \ (child) | bptm (parent) |\n| Local Restore | bptm | tar32 |\n| Remote Restore\
    \ | bptm (parent) | bptm (child) |\n\nIf a full buffer is needed by the consumer\
