  md: '# Appendix E: Business Impact Analysis PlanningnKit-The Storm Before the Calm


    The storm before the calm? It makes sense when you think about it. When you starting
    the business at a business level, you may stir up a few things. For example, a
    client retains their data ''forever'' ever so. Why? Very good question. It is
    legal pod: Should anyone sue, would it be to subpoena all of those records. Second,
    it costs a lot of money for those tape recorders. The answer I received was enough:
    We don''t know how to categorize our data and differentiate its importance. The
    more I probed, the more uncomfortable things became at the business level. I uncovered
    an area that the business really needs to address which had been left untouched
    for many years.


    This planning kit provides the initial information to create a compelling business
    impact analysis (BIA) that will help you identify the critical components of your
    environment and the cost associated with their unavailability. We hope using this
    planning kit helps you achieve a sense of calm knowing that you will be well prepared
    in the event you experiences a disaster.


    # An Introduction to BIA


    We touched on BIAs in Appendix D. In this appendix, we go into greater detail.
    Let''s begin with defining exactly what a business impact analysis is. As mentioned
    in the previous BIA, a DIA is evaluation of your company''s strengths and weaknesses
    with respect to its ability to recover from a severe interruption to a complete
    disaster. The BIA can stand on its own, it should be included as a component of
    the DR plan. Here''s what you should look at as you conduct this type of analysis:


    +   - Intellectual property, critical hardware, software, and any custom applications

    - Your time to recovery, based on the amount of money your company will stand
    to lose, plus the level of importance for this particular application, server,
    or service

    - The conditions you should be in the very least order to recover successfully,
    including how old the data is


    When planning for DR, you should take into consideration the entire process of
    determining, implementing, and documenting everything that must be done in order
    to return some critical component of your business to its normal working order
    following a disaster. There is a common methodology used by number of clients
    for DR planning involves seven steps. If you have the DR planning kit, you will
    be familiar with these steps, listed here:


    +   1. Perform BIA.

    2. Perform risk assessment.

    3. Determine recovery strategies.

    4. Update/develop backup plan and operations guide.

    5. Update/develop a recovery plan.

    6. Test.

    7. Update and maintain the DR plan.


    We will be concerned with only Step 1 in this planning kit you help address the
    needs of the business and the business units with respect to data protection and
    availability by providing a means to define the importance of each component of
    the business unit and how each will have an impact should it become unavailable
    for a period of time. What you should find as a result of conducting BIAS is that
    you now have the basis for all the other steps in your DR planning'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'process.


    As you begin the process of interviewing the business unit managers, data owners,
    and administrators, you will identify areas and associated costs that may not
    line up with the financial expectations for this unit''s recovery. a second interview
    with the business unit managers would be required to resolve or prioritize their
    goals so that they fall in line with the financial picture. However, you may find
    recovering this business unit''s applications would require more than otherwise
    financially tolerable resources. As this goes, it may in fact force changes to
    be made to the backup plan, DR plan, or even the beats


    The BIA is a methodology that helps identify the impact of losing access to a
    particular system or application to your organization. The BIA is primarily an
    information-gathering process. In the end you will have several key components
    for each of the business units you have worked with, of which we have listed here:


    +   1. The criticality a a particular system or application has to the organization


    +   2. How quickly it must be recovered in order to minimize the company''s risk
    of exposure


    +   3. How the current data must be at the time of recovery


    This information is essential to your DR and backup plans, as it describes the
    business requirements for backup and recovery.


    In the past, most organizations viewed the IT staff as the bits-and-bytes types
    who didn''t interface well with others. That in our marketing effort and fostering
    relationships with the various business areas. The business unit managers will
    be attracted to the relationship by the information you provide to them, such
    as the impact to the business a disaster could bring to this particular unit.


    The information that is collected during the interview process will be the basis
    for the analysis, which in turn will be used within the DR plan. You may choose
    to use these or create your own. Whatever you decide, we strongly recommend that
    you use and maintain a level of consistency throughout your analysis.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_240_0.png)'
  merge: -1
