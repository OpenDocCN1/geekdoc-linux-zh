  md: '# Appendix D: Disaster Recovery Planning Kit-From To Beginning


    # Overview


    Recovery and backup-it''s an interesting twist on a common term we have heard
    for years, backup and recovery. When was the last time you heard someone mention
    recovery? So much emphasis is placed on backup, highly compressed data, and Backup
    is important; restorability defines our expectations. We want fast backups of
    large amounts of data with minimum impact on our networks-at least that''s what
    management has been telling us (and we want it by 4:00 the next afternoon). Unless
    we have our diligence, we will be poorly prepared to rebuild expectations. Simple
    responses such as ''that''s not possible'' without the facts to backup will fall
    off on ears.


    Now, that you are here, this appendix will help you prepare your answers to management
    when expectations are placed on you for backup and recovery-recovery and backup.
    When often, we should consider starting with the result and work backward. Just
    the mazes that we used to do as children, it seems to be easier when we start
    from the end and work our way. Well, we don''t know of any scientific proof, but
    it probably to deal with the change in our expectations. Our perspectives change
    when we start to plan our management policies backward from recovery, and when
    we plan backward, we can define our goals more clearly, identify potential issues
    and present a message of the financial impact that expectations have on our overall.


    # BACKUP IS IMPORTANT: RESTORABILITY DEFINES OUR SUCCESS


    Before we discuss the disaster recovery plan, let''s talk about recovery plans
    in general. A recovery plan can be divided into four parts. The first part of
    the document contains every step administrators take for granted when during the
    normal course of day, they are called to ''fix or maintain the server or application
    for which they are responsible. The second part not contains the information documented
    as though these administrator and developers are not available. This is much more
    detailed and written to the level of the most likely person to execute the plan.
    This means if the likelihood of a junior system administrator executing the plan
    is high, the person must be able to read and understand the recovery steps without
    question. The third part now includes a call tree to be used in the event any
    of the critical components (administrators) need to be contacted in their absence.
    Finally, the fourth part contains pertaining to different levels of interruptions.
    It can range from severe weather to complete facility access being cut off.


    What rounds out the recovery plan and what makes a disaster recovery plan the
    business impact analysis that tell how much money it will cost if a particular
    application or server is unavailable for a period of time. A very strong element
    of your disaster recovery plan is the business impact analysis and assessments.
    These are prerequisites to beginning your plan. If you haven''t already done so,
    please begin with the business impact planning kit that we prepared for this appendix
    or one that your organization has standardized before you launch out into your
    DR plan. The valuable information that will be generated from these reports, your
    DR plan will be weak.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# How to Use This Kit


    We used several Internet resources and past experiences for our research in developing
    this planning kit. We have been privileged to work with several DR professionals
    from various companies who had created excellent DR plans, and we have used their
    expertise to aid in putting this small planning kit together. It is not an exhaustive
    planning kit, but we believe it touches on much of the high points of DR.


    The purpose of this document is to assist in planning and the creation of a DR
    plan for your organization. We have not included absolutely every administrator
    who would want to consider or her DR plan, this is rather not exhaustive and should
    provide you a good base on how to build your plan. One of the primary reasons
    for having a DR plan is to limit the decisions that must be made when a disaster
    strikes, the decision-making process is tainted because of the events surrounding
    the disaster, as well as the physical demand that disaster places on those without
    the aid of a plan such as this. It also removes dependencies the company may have
    upon certain people or groups that would be required for the recovery process,
    such as consulting partners, hardware or software vendors, and so.


    **Note:** When responding to a disaster, it is imperative that you follow your
    company''s policies with regard to media communication, especially if your organization
    is a well-known target for media coverage.


    You should decide what steps to take during the development of your DR plan. Many
    companies have been very successful using the model illustrated in Figure D.1,
    but it may be modified to suit your needs. It is a seven-layer model that covers
    most bases.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_215_0.png)'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Getting Started


    Always include an objective, site-specific details, and a list of terms to be
    used throughout your document. This is all of your up-front information that you
    want to reader: it should also give those who are not necessarily the ones executing
    the plan the ability to comprehend just what the plan will accomplish if done.
    In this manner accomplishes a couple of things:


    +   - Sets expectations for the use of this plan at the outset


    Let''s look at the following example of a DR plan.


    # SAMPLE DR PLAN


    # OBJECTIVE


    Maintain the <Company Name>''s ability to service customers, complete sales, and
    deliver their online services in a global market place. This ability hinges on
    four primary data centers located across the United States and Canada.


    These data centers consist of many decentralized servers that were singularly
    located on legacy mainframe hardware. Therefore, the protection of the data systems
    with regular duplications and off-site storage with enough detail to facilitate
    recovery is critical to the success of this plan. As part of this plan, regular
    testing will be scheduled to ensure the company''s ability to survive a disaster.


    # DEFINITION OF TERMS


    Assessment team.This person or group of persons will be responsible for assessing
    the level of damage caused by the disaster to the organization''s facilities,
    IT infrastructure, intellectual property (data), and on. This team may consist
    of different business units depending on the depth and breadth of the DR plan.


    Business-critical.Defined as any resource, be it data, applications, personnel,
    and so, that would be (mission-critical: see below) in the priority of the plan
    of recovery in the event of disaster, loss, or interruption. An example of a business-critical
    application will be payroll and accounting.


    Business interruption.Any event whether unplanned or chain of events that disrupts
    the normal course of business operations at one of your locations, which if not
    addressed within a predetermined amount of time may turn into a disaster.


    Disaster.A disaster declared when an event results in the inability of an organization
    to provide critical business functions for a period of time and/or causes the
    company to move from using standard operating procedures to employing its disaster
    recovery plan after a predetermined period of time, potentially at another facility.


    Emergency-call.This is the front line in the event of a disaster. This person
    or group of persons will be contacted in the event of a disaster, and as part
    of the response team, will execute this plan and begin the process of recovery.


    Functional.Critical back-office functions such as file and print.


    Management team.The person or group of persons managing the entire execution of
    the DR plan. This team will ultimately have full responsibility for the success
    or failure of the DR plan.'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'Mission-critical.Defined as any resource, be it data, applications, personnel,
    and so on, that would be of the highest priority in the plan of recovery in the
    event of disaster, loss, or interruption. An example might be online ordering
    or reservations systems.


    Recovery team.The person or group of persons that will take on the responsibility
    of the actual recovery process. This may involve restoration of the data from
    backup media or, in, fact, the management of the restoration of physical infrastructure,
    facilities, and so on. This team may include a number of different people units.


    Response team.The person or group of persons responsible for carrying out the
    declaration of and recovery from a disaster.


