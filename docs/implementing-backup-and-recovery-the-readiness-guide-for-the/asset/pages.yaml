- img_proc: true
  md: 'The network layout is an important part of the information required. Identifying
    the layout can be very critical to establishing the backup and recovery strategy.
    This step addresses the potential performance bottlenecks, because slow networks
    are often some of the primary bottlenecks. If a significant amount of data is
    on a slow network, a media server may need to be located on the network. Any systems
    that have large amounts of backup data, such as a system with more than 100 GB,
    should be considered as media servers and have direct connections to a tape drive
    or drives. Following is the information needed for the networks:


    +   - Speed of network

    - Amount of data residing on the systems

    - Location of any backup hardware

    - Current and proposed production traffic


    # Locate Backup Hardware


    Identifying all the systems and mapping the network topology should provide ideas
    of the total backup requirements. Part of this information is the location of
    the potential backup devices. The next step is to make sure the hardware is correctly
    located within the enterprise. Any enterprise backup and recovery strategy should
    be based on an application that supports library and data sharing to ensure the
    tape drives and libraries are connected throughout the enterprise in such a way
    to minimize bottlenecks, as to gain the most from these very expensive drive resources.
    In a local area network (LAN) environment, it might be advisable to physically
    locate the tape library or libraries close to the tape drives so that large amounts
    of data can be directly connected to the tape drives and perform backup without
    without errors across the network. These systems become media servers and control
    access to their drives. Data handle from all tape-servers, you need either to
    add more drives and give these systems access to their own drives or use the media
    servers to handle the backups for the systems that do not have their own drives.
    Also, the systems must be physically located close enough to the tape devices
    to be connected via SCSI interfaces.


    # LEARN FROM THE ERRORS OF THEIR FAIL


    Backup is a part of any data protection strategy, but there are other technologies,
    such as replication, that are part of it as well. The key to strategy is to incorporate
    all the different technologies. I have been involved in too many discussions with
    people who were trying to recover from an outage only to discover they were not
    protected as they thought. One particular can insurance company had lost their
    primary data that ran their most critical application. They spent several hours
    trying to recover from mirrored disks, when the failure was file system corruption.
    Mirrors did not help in this case. Their outage was extended, but they were able
    to recover, since they had backups. My worst call working in support was from
    a system administrator who had done a delete from the wrong window and removed
    enough of the operating system that could not reboot. When he asked what he had
    to recover, I told him that the process would be to restore from his latest backup.
    This, he answered configuring for backups was his "list of things to do".


    # Locate Backup Hardware-SAN Alternative


    If a storage area network (SAN) is available, it can allow for more flexibility
    in the backup and recovery strategy. The backup hardware can be better shared
    among the large-resident systems while still keeping the data off the production
    LAN. This can also allow large systems to be backed up directly to tape without
    making the application servers general-purpose media servers and having these
    systems back up other LAN-based clients.


    # Identify Recovery Requirements'
  merge: -1
