  md: '# Chapter 3: An Introduction to NetBackup


    Many commercial backup products are available on the market today. The leader
    amongst them on UNIX platforms is Veritas NetBackup DataCenter. We will use this
    product, which we refer to as NetBackup, in our explanations and examples of setting
    up a backup domain. We start with an introduction to NetBackup, including an explanation
    of the unique architecture of the product, and then define the terms it uses.
    Most of the latest release, 4.5, but we will mention when there is a significant
    difference between older releases.


    # NetBackup Tiered Architecture


    NetBackup uses a four-tiered architecture for backup domains, as shown in Figure
    3.1.


    The tiers are as follows:


    +   **Client.** Any system that contains data that needs to be backed up.


    +   **Media server.** Any system that has physically connected storage devices
    to be used for backups. These can be robotic devices, standalone tape drives,
    or optical storage devices.


    +   **Master.** The NetBackup server provides administration and control for backups
    and restores for all clients and servers. It is also the system that contains
    catalog information for the backup domain.


    +   **Global Data Manager.** A master of masters that can monitor and facilitate
    management of multiple master servers and multiple backup domains.


    All systems within a NetBackup domain fall within at least one of the same system.
    The fourth tier, the Global Data Manager tier, is usually found when there are
    multiple NetBackup domains that are monitored and administered from a single location.
    The first three tiers are always present, even if more than one. This tiered architecture
    is one of the things that makes NetBackup so scalable and easy to manage; you
    can have a single master server that provides you a single point of administration,
    and at the same time, you can have as many media servers as needed to support
    your configuration. As you grow, you can add more media devices and just add more
    media servers without having a great impact on your overall configuration. If
    your enterprise continues to grow, you can simply add another master server with
    media servers as needed. At this point, you might add the fourth tier. The first
    tier, clients, can be added or deleted easily, since the configuration is kept
    on the master server.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_36_0.png)'
  merge: -1
