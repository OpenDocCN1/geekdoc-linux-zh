    # # Additional Information


    The NetBackup Log entries will also have entries similar to those described for
    other NetBackup operations as image duplication operations to create additional
    copies of a backup image. These entries have a very similar format and may be
    useful for analyzing the performance of NetBackup for those operations.


    The debug log file will contain the entries that are in the All Log Entries report,
    as well as additional detail that may be useful for performance analysis. One
    example of such additional detail is the intermediate data throughput rate message
    for multiplexed backups, as shown:


    > ... intermediate after <number> successful, <number> Kbytes at <number> Kbytes/sec


    This message is generated when an individual backup job that is part of a multiplexed
    backup group finishes. In the debug log file for a multiplexed backup group consisting
    of three individual backup jobs, for example, there could be two intermediate
    status lines, and the final (overall) throughput rate.


    For a backup operation, the bbpkar log file will also contain additional detail
    about the operation that may be useful for performance analysis. One example would
    be data regarding the delay in initializing OTM to backup open files on the NetBackup
    client.


    Keep in mind, while writing the debug logs during the NetBackup operation introduces
    some overhead that would not normally be present in a production environment.
    Factor that additional overhead into any calculations on data captures while debug
    log files are in use.


    See the NetBackup Troubleshooting Guide to learn how to set up NetBackup to write
    these debug log files during the NetBackup operation.


