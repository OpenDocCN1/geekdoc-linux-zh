  md: '# Evaluating Performance Using the All Log Entries Report


    +   1. Run the backup or restore job.


    +   2. Run the All Log Entries from the NetBackup reports in the NetBackup Administrative
    Console release in 4.5, or the NetBackup Reports GUI in earlier releases. Be sure
    that the Date/Time range that you selects the time period during which the job
    was run.


    +   3. Verify that the job completed successfully by searching for an entry such
    as the ''requested operation was successfully completed for a backup, or ''successfully
    backed (restore) backup id ...'' for a restore.


    +   4. Obtain the NetBackup performance statistics from the entries in the report.
    (Note that the entries shown here are based on release 4.5. The entries for earlier
    releases will be the same or similar.)


    | ENTRY | STATISTIC |

    | started backup job for client <name>, schedule <name> on storage unit | **Date**
    and **Time** fields for this entry show the time at which the backup job started.
    |

    | successfully wrote backup id <name>, copy <number>, Kbytes | For a multiplexed
    backup, this entry shows the size of the individual backup and the **Date** and
    **Time** fields show the time at which the job finished writing to the storage
    device. The overall statistics for the multiplexed backup and data throughput
    rate are found in a subsequent entry below. |

    | successfully wrote of <number> multiplexed backups, total Kbytes <number> at
    Kbytes/sec | For multiplexed backups, this entry shows the overall statistics
    for the multiplexed backup group including the data throughput rate. |

    | successfully wrote backup id <name>, copy <number>, fragment <number>, Kbytes
    at <number> Kbytes/sec | For non-multiplexed backups, this entry essentially combines
    the multiplexed backups in the previous two entries into one entry showing the
    size of the backup job, the data throughput rate, and the **Date** and **Time**
    fields, at which the job finished writing to the storage device. |

    | requested operation was successfully completed | **Date** and **Time** fields
    for this entry show the time at which the job completed. This value is later than
    the ''successfully wrote'' entry because it includes extra processing time at
    the end of the job for tasks such as NetBackup image validation. |

    | begin reading backup <name>, (restore), copy <number>; fragment <number> from
    media id <name> on drive index <number> | **Date** and **Time** fields for this
    entry show the time at which the restore job started reading from the storage
    device. (Note that the latter part of the entry is not shown for restores from
    disk, as it does not apply.) |'
