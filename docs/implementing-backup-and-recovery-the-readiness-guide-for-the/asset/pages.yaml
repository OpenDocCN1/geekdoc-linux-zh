- img_proc: true
  md: '# Capacity


    After selecting the appropriate drive technology that provides the performance
    and cartridge capacity you need, next you want to look at many cartridges you
    will need to have available. This involves all the elements we have looked at
    so far. The number of cartridges depends on the amount of data that you are backing
    up, the frequency of your backups, your retention periods, and the capacity of
    the media used to store your backups. A simple formula that can be used as follows:


    Number of tapes = (Total data to back up × Frequency of backups × Retention period)/Tape
    capacity


    Following is an example:


    +   - Total amount of data = 100 GB

    - Full backups per month = 4

    - Retention period for full backups = 6 months

    - Incremental backups per month = 30

    - Retention period for incremental backups = 1 month


    Preliminary calculations:


    +   - Size of full backups = 100 GB × 4 per month × 6 months = 2.4 TB

    - Size of incremental backups = (20 percent of 100 GB) × 30 × 1 month = 600 GB

    - Total data stored = 2.4 TB + 600 GB = 3 TB


    Solution:


    +   - Tape drive = DLT 700

    - Tape capacity without compression = 31.5 GB

    - Total tapes needed for full backups = 2.4 TB / 31.5 GB = 76.2 = 77

    - Total tapes needed for incremental backups = 600 GB / 31.5 GB = 19.1 = 20

    - Total tapes needed = 77 + 20 = 97


    By looking at this example, you would need to have a minimum of 97 active cartridges
    at any given time. This assumes that all the cartridges will be filled and there
    will be no unused tape. These calculations are based on no compression. This gives
    you an idea of the steps necessary to plan for an appropriately sized tape library.
    We would never recommend implementing an enterprise backup strategy that does
    not include a robotic tape library with a barcode reader. Without this, the management
    can become overwhelming and very susceptible to human error. It is much better
    to turn over management to an enterprise backup application.


    When figuring out how many slots are required to support your environment, do
    not forget to include some slots for cleaning tapes and at least two for catalog
    backups. Actually, you will want to reserve many slots for catalog backups as
    needed so you can keep a copy of the catalog. If you are including an off-site
    solution of type tape (vaulting) as part of your backup strategy, you need to
    include this in your total capacity calculations, since creating duplicate copies
    requires additional tapes.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Library?


    As stated in the previous section, most enterprise backup strategies will include
    some of robotic tape library. There are several library manufacturers, each with
    an entire line of libraries from small to very large. Part of this decision will
    be based on the drive technology you use, as some libraries only certain drives.
    The considerations for selecting a library are as follows:


    +   * Does it handle the desired drive type?

    * Will it handle the required number of drives?

    * Does it support the needed number of slots?

    * Does it have expansion capability?

    * What type of connection, SCSI or Fiber?

    * Does it support barcode labels


    As you look at the different libraries available, you should also consider if
    your strategy is best served by one large library that contains all the drives
    and media or by smaller libraries that are distributed throughout your enterprise.
    We will discuss some of the reasons for picking one or the other in a later chapter.
    Part of this decision is whether you plan to implement a SAN or distributed media
    servers (or both). Generally, it is cheaper to buy one large than two smaller
    libraries that equal the same capacity in drives and slots.


    A sample of the library vendors are ADIC, ATL, Compaq, Exabyte, Fuji, IBM, NEC,
    Sony, Spectra Logic, and StorageTek. Each of these companies has a Web site that
    contains all the information for their entire line of libraries. This would be
    an excellent place to go for information.'
  merge: -1
  pgno: 52
