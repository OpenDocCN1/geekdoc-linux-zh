- img_proc: true
  md: 'Using the following equations to determine the amount of time lost due to these
    delays:


    | | |

    |---||

    | bpbkar32 | = 58033 delays X 0.020 seconds

    | = 1160 seconds

    | = 19 minutes 20 seconds |

    | bptm | = 105 X 0.030 seconds

    | = 3 seconds |


    This is useful in determining that the delay duration for the bpbkar32 process
    is significant. If this delay were entirely removed, the resulting transfer time
    of 10:40 (total transfer time of 30 minutes minus delay 19 minutes and 20 seconds)
    would indicate a throughput of 14 Mb/sec, nearly a threshold increase. This type
    of performance increase would warrant effort investing to investigate how the
    drive performance can be improved.


    The number of delays should be interpreted within the context of how much data
    was moved. As the amount of data increases, the significance threshold for counter
    values increases as well.


    Again, using the example of a total of 9,000 MB of data being transferred, assume
    a 64 KB buffer size. You can determine the total number of buffers to be transferred
    using the following equation:


    | Number_Kbytes | = 9,000 X 1024

    | = 9,216,000 KB |

    | Number_Slots | = 9,216 / 64

    | = 144,000 |


    The Wait counter value can now be expressed as a percentage of the total divided
    by the number of buffers transferred:


    | | |

    |---||

    | bpbkar32 | = 29364 / 144,000

    | = 20.39% |

    | bptm | = 95 / 144,000

    | = 0.07% |


    In this example, in the 20 percent of cases where the bpbkar32 process needed
    an empty shared data buffer, that shared data buffer has not yet been emitted
    by the bptm process. A large value indicates a serious problem, and additional
    investigation would be warranted to determine whether the data consumer (bptm)
    is having keeping up.


    In contrast, the delays experienced by bptm are insignificant for the amount of
    data transferred.


    You can also view the Delay and Wait counters as a ratio:


    | bpbkar32 | = 58033/29364

    | = 1.98 |


    In this example, on average the bpbkar32 process had to delay twice for each wait
    counter that was encountered. You may wish to consider increasing the parent or
    child delay value, which avoids unnecessary overhead of checking for a shared
    data buffer in the correct state too often. Conversely, if this ratio is close
    to 1, you may wish to consider reducing the applicable delay to check more often
    and see if that increases your throughput performance. Keep in mind that the parent
    and child delay values are rarely changed in most NetBackup installations.


    The preceding information explains how to determine the values for Wait and Delay
    counters are'
