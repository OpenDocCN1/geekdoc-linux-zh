    # Common Restore Performance Issues


    This section details performance problems often seen with restore actions.


    +   **Improper Multiplex Settings.** If multiplexing is too high, needless tape
    searching may occur. The ideal backup is the minimum needed to stream the data.


    +   **NetBackup Catalog Performance.** The disk subsystem where the NetBackup
    catalog resides has a large impact on the overall performance of NetBackup. To
    improve restore performance, configure this subsystem for fast reads.


    +   **Fragment Size.** The *fragment size* affects where tape markers are placed
    and how many tape markers are used. Fewer tape markers can slow recovers if a
    fast block is not available. SCSI fast block positioning can help. A typical fragment
    size setting is 2048 MB.


    +   **MPX_RESTORE_DELAY setting.** NetBackup can perform multiple restores at
    the same time from a single multiplexed tape. The default delay setting is 30
    seconds. If multiple restore requests are submitted within the time window indicated
    by this delay setting, they will be considered candidates to be run at the same
    time, if possible. This may be a useful parameter to change if multiple stripes
    from a large database backup are multiplexed together on the same tape.


