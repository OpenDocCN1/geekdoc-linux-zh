  md: '# # Chapter 4: Evaluating Storage Media Requirements


    # ## Overview


    The next step in a backup and recovery strategy is to determine the storage media
    requirements. Based on the information you have already gathered, you should have
    a pretty good idea of how much data is going to be backed up, how many copies
    you will need, and how long you will keep them. All of this information goes into
    the storage media requirements. If this is a new backup, you can use this information
    to determine what type of tape drives and media will work best. If this is an
    existing domain, you can determine if you have enough drive and library capacity.


    As no doubt you have already figured out, this is not an exact science. Every
    piece is interrelated. The size of the servers is dependent on the number of drives.
    The number of drives is dependent on the amount of data being backed up and the
    backup window. The ability to use the bandwidth of the drives is related to the
    networked speed and layout. That is why we picked a starting point of analyzing
    the data and moved forward from here. You will need all the data gathered using
    the guidelines in the first three chapters before proceeding.


    As you move forward with evaluating storage media, you need to consider the selection
    of a suitable drive technology. The number of different drive types and the number
    of different libraries that support the informed decision. One place that can
    provide a comparison of all the different types is www.storagemountain.com/hardware-drives.html.
    This site shows all the different technologies and gives speeds, capacities, and
    load/unload times, as well as access times. All these figure into the final decision.
    Backup generation with a high-density cartridge might be the best solution. If
    recovery speed is more important, you might want to look at a fast drive with
    fast access, but high-density may not suit your requirements. If you want to recover
    a single file from the end of a tape, it would be better to fit it on a 120-GB
    tape.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Backup Window and Amount of Data


    One of the most critical steps in evaluating the storage media requirements is
    determining the actual backup window. This must be the actual amount of time you
    are allowed to have backups running, while at the same time, controlling the backup
    hardware, using a major part of the network, and using resources on the systems
    being backed up. The size of your backup window is becoming a much harder measurement
    to define. You must be able to determine the number of hours in a day and in a
    week that can be dedicated to backups, as this is an integral part of the equation
    to determine media requirements.


    Based on the data we collected in the earlier chapters, you should have a very
    good idea of how much needs to be backed up each day and each week. You need to
    know how much data needs to be backed up during each window. Generally, the largest
    backups will be the full backups. In the past, most administrators performed daily
    incremental backups and did their full backups over the weekend when people were
    not working. This concept is changing. It is very common for now systems to have
    incremental backups each day. The weekends are saved to do maintenance or to say,
    one-fifth to full backups done each day and the remaining systems to catch up.
    If this is close to your model, then your window would be the time each day when
    backups are performed, and the amount of data that would be backed up, roughly
    a fifth of your total data. If you do not have specific operational information
    on the amount of data that will make up your incremental, you can estimate using
    a percentage of change to calculate the amount of data. It is common to use 20
    percent, unless you have a more accurate measurement. The goal here is to try
    to get as close as possible to your actual environment.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Drives


    Now that we have the amount of data and the number of hours needed to store that
    data, all we have left to do some basic math: Just take the total amount of data
    that has to be backed up daily by division of the daily backup window:


    Ideal data transfer rate = Amount of data back up ÷ Backup window


    If you have 100 GB of data and an 8-hour window, your ideal data transfer rate
    would be 12.5 GB/hr.


    After you have an idea of the ideal data transfer rate, you can then look at the
    different drive types to which might offer the best fit for your needs. Surprisingly,
    this is a little more complicated than just looking at the base numbers. With
    potential drive technology, you must consider both performance and capacity. In
    large enterprises, one usually does not fit all. As mentioned several, you will
    need to look at the recovery time of drives, some that very high performance but
    less capacity and some that higher capacity with performance. Data that is backed
    up for long retention periods might be better suited for lower-performance higher-capacity
    media. Data that might be required for immediate restores where time is money
    might be better suited to have backups backups to high-performance drives and
    then the images vaulted to high-capacity drives and media for off storage.


    A sample of tape transfer strategies, capacities, and times is given in Table
    4.1. This information can be very helpful in determining which technology you
    need, but never forget that these are all numerical and without taking into account
    the internal drive compression. Drive manufacturers advertise compression rates
    for the different drive technologies. These vary depending on the drive but are
    also numerical. These specifications can change with new firmware levels or versions
    of the drives. To get the most accurate numbers, contact the drive vendor or go
    to their Web site, where you will find up-to-date specification sheets.


    # Table 4.1: Tape Data Transfer Rates and Capacities


