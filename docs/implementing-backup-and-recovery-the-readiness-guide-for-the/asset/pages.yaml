  md: '![](img/acb44d4c8cce95a9dfc81e127fceac76_78_0.png)


    This screen shows additional configuration points to consider:


    **Schedule type.** Calendar-based scheduling or frequency-based scheduling.


    **Destination:**


    +   * **Multiple copies.** If the vault option is installed, you can select up
