  md: '# Vault Solutions


    Backup is a very important part of any enterprise data protection strategy, it
    alone does not provide true disaster recovery. Any enterprise DR strategy should
    include an off-site backup management system such as VERITAS Software''s NetBackup
    Vault or Gray House Solutions'' Duplication Suite. A vault product is one that
    enables you to make copies of your backup images, gives you the tools to eject
    the desired tapes from the robotic library, and provides the reports to track
    the movement of the tapes outside the library. The tapes that outside the library
    are generally stored at an off-site location. The vault product provides tracking
    of the tapes in the off-site location, and notifies you when the images on the
    off-site tapes have expired and the tapes should be returned to the library. This
    is done if there is a disaster at the primary site, the data will still be available
    from the off-site tapes.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_112_0.png)


    Figure 5: GDM dashboard.

    The requirements for an off-site backup management system are as follows:


    +   - A schedule for sending media off-site

    - A method to determine what data to send off-site

    - A mechanism to automate the creation of duplicate media (images)

    - A mechanism to duplicate the catalog

    - A way to determine which media to retrieve from off-site storage for reuse

    - A system for tracking both the data and the media stored at the off-site location

    - A method for reporting on media shipments

    - Efficient use of resources


    Since this is the cornerstone in any enterprise DR strategy, the selection of
    the product to fulfill these requirements is very important. Make sure you select
    a product that gives you all the functionality you need, along with flexibility
    and ease of use. Vault is generally considered a three-step process:


    +   1. Duplication of backups.

    2. Backup of the catalog.'
