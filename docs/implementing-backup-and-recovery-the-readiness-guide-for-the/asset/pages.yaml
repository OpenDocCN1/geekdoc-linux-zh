  md: '# # Chapter 11: Major Players in the Backup Arena


    # ## Overview


    Once said, "Backup is just a tool. It doesn''t matter what one you have; it''s
    just a matter of how you use it." I vehemently disagreed with that person back:
    "Backup isn''t just a tool; it is an integral part of your organization''s business
    functions. Being a very critical tool, it makes a difference which you eventually
    decide to use. Your data and sometimes your job or reputation depend on it." It
    is interesting to read those words now and have discussions with colleagues throughout
    the years about backup management. We use the word tool quite a bit in reference
    to backup, something I didn''t even realize until the first draft of that chapter
    had been written.


    Backup as a tool, like a hammer- serves a unique purpose with an anticipated outcome.
    When you hit a 16-penny nail with the head of the hammer, the force causes the
    nail to drive down into the wall, eventually, the nail is firmly implanted into
    the piece of wood. Given the same scenario with a slab of concrete instead of
    wood, the outcome would be different. The anticipated outcome is quite variable,
    because we are not using the right set of tools for the job.


    Backup, as a tool, is exactly the same. Very simplistically, backup is designed
    to carry data from the client to some remote; in most cases protection from losing
    the ability to recover this data at some time. If your environment''s characteristics
    or requirements are unique, the very simple "hammer and nail" approach to backup
    may need to be reviewed to properly select the right tool for the job. A number
    of vendors in the market offer backup: all store some data and provide a means
    to recover in the event of a loss. However, the methods by which they accomplish
    these things play a role in the selection process.


    In this chapter, we present an overview of the major players, the features, and
    the functions of the various products to help identify the best tool for your
    environment. The selection was quite scientific; we used what the technology research
    bodies listed as the market leaders, then selected the four: Hewlett-Packard (HP),
    IBM, Legam, and VERITAS Software. We discuss them in alphabetical order by company
    name. When we did the research for this software, we asked the individual vendors
    to provide their responses to the chapter outline. The outline was very simple:


    **Company/Product Overview.** A brief history of the company and how the product
    was developed over the years in the current product available to the consumer
    market.


    **Backup Methodology.** The company''s approach to backup, such as full incremental,
    progressive incremental, and synthetic full.


    **Principles of Recovery.** A philosophical view of recovery based on the specific
    vendor product, such as tape cloning, duplication, or copying, depending on terms
    used by the vendor for the properties of recovery of an entire server, system,
    data center, or even critical files or directories.


    **Storage Support.** What any unique device or number of devices are supported?
    If there were none that fit this criteria, this heading was not included in the
    Vendors section. It is to say that each of these favors supports a wide range
    of backup storage devices. None of them seem lacking support for any of the most
    popular media types.


    **High Availability.** HA-aware products are more and more important to the 7x24x365
    data centers, so we want to know what integrates with product.


    **Key Differentiators.** How the vendors would position themselves among the major
    players if you had in a room together. This is the chance you have been waiting
    for. Here we document what each company views as their key differentiators-what
    makes them better, faster,'
