  md: '# Things to Check Before Calling Your Dedicated Support Professional


    Usually, we think about troubleshooting problems after they have failed. A little
    planning in the beginning really helps. Most backup applications have the ability
    to create their own specific logs. We need to know how logging works within your
    application and prepared to enable logging. The authors usually enable logging
    during the initial installation so we have the appropriate logs if your initial
    attempt at backups or restores are not successful. After things looking good,
    you should reduce or shut down logging. In some instances there can be a performance
    impact from logging, and in all instances logs will consume disk space.


    You also need to know how each operating system in your environment handles warning,
    error, and normal messages. You will discover that about every operating system
    will handle these a little by default. On most UNIX systems you can see how the
    system will handle logging by looking at /etc/syslog.conf file. Here is a sample
    of this file from a Solaris system:


    ```

    #ident "(@) syslog.conf 1.5 99/02/03 SMI" /* SunOS 5.0 */

    # Copyright (c) 1991-1999 Sun Microsystems, Inc.

    # syslog configuration file.

    # This file is processed by m4 so be careful to quote ('''') names

    # that match m4 reserved words. Also, within ifdefs, arguments

    # containing must be quoted.

    # .err,kern.auth.notice /dev/sysmsg

    # .err,kern.debug:daemon.notice:mail /var/adm/messages

    *.alert,kern.err:daemon.err operator

    *.alert root

    *.emerg *

    ```


    ```

    # if a non-localhost machine chooses to have authentication messages

    # sent to the localhost machine, un-comment the following line:

    #auth.notice ifdef(''LOGHOST'', /var/log/authlog,

    @loghost)

    ```


    ```

    mail.debug ifdef(''LOGHOST'', /var/log/syslog,

    @loghost)

    ```


    ```

    # if non-localhost machines will use the following lines to cause "user"

    # log messages to be logged locally.

    ```


    ```

    ifdef(''LOGHOST'', , /dev/sysmsg

    user.err /var/adm/messages

    user.err

    user.alert `root, operator''

    user.emerg *

    )

    ```


    As you can see, of the messages you are interested in are logged to /var/adm/messages.
    On an HP-UX system you will see something completely different. Here is a sample
    /etc/syslog.conf file from an HP system:'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# # (#) $Revision: 74.1 $


    # # syslog configuration file.


    # See syslog(5) for information about the format of this file.


    ```

    mail.debug

    * /var/ad/syslog/mail.log

    * /var/ad/syslog/syslog.log

    * /dev/console

    * *alert

    root

    * *alert

    * *emerg

    ```


    You are really looking for two things: the log file and sure it is not disabled.
    If there is a hash (#) in the first column, that line is commented out. By default,
    some systems have all the logging in the /etc/syslog.conf commented out. You should
    enable the appropriate lines to ensure logging is on. This is where you will see
    if the system is reporting problems, along with some of the processes that are
    running as part of the backup application as they log to the system. In Windows
    systems, the application will usually have its own logs. In addition you will
    need to access system logs and the application logs. You should also be familiar
    with network error logging, since the network can play a very large role in backing
    and recovering systems. The netstat command is commonly used to get a basic idea
    of the condition of your network. Here is a sample netstat command output on a
    Solaris system.


    ```

    netstat -i

    Name Mtu Net/Dest Address Ipkts Ierrs Opkts Oerrs

    Colis Queue

    lo0 8232 loopback localhost 434768 0 434768 0

    0

    hme0 1500 burreed burreed 280473 0 254050 0

    546

    ```


    Your application should also include a troubleshooting manual that will provide
    helpful information, including a list of error codes and recommended actions.
    If you have a backup or restore failure, you can look up the specific error code
    and get an idea of where the problem might lie. If it appears to be network related,
    you should make sure you have good network connectivity between the systems involved.
    You could go to each system and see what the network logs show. The troubleshooting
    manual might also suggest some commands to try. As you investigate, be sure to
    gather all the logging information as well as configuration information, so when
    you call the support person needs to assist you hotline, you will already have
    the information that they needs to assist you.


