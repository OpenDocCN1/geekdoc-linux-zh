  md: '# Chapter 10: The Future of Backup


    # Overview


    The future of backup seems like an oxymoron. The future involves forward thinking,
    and backup involves an archive or history. However, it is critical to consider
    that in the future, we will need to recover what was done in the past to protect
    the present. This consideration is as critical as archiving, planning, installing,
    configuring, and updating the backup and recovery solution for your enterprise.


    So far, everything we have talked about has based on the current technologies
    and techniques available to perform backup storage management for the enterprise.
    Throughout this book, we have made every effort to ensure that our content is
    not speculative and that the solutions and methods mentioned are real and available
    today. In this chapter, we take a peek into the crystal ball and see how possible
    changes in technology and business requirements will affect the way you do backup
    and recovery. While this chapter contains some ideas and methods that are underway,
    it also contains some speculation. This might take up space or at the least inspire
    to develop our thoughts further. Having said that, we make no claims to having
    a better crystal ball than anyone else we have tried to gather information from
    these same visionaries and innovators. We are not saying that this is the way
    it will be-that these are some of the things that could happen


    The trends are reality for some of the changes. We are seeing capacity doubling
    every day, resulting in having more and more data to protect. Network bandwidth
    is doubling every nine months. Network backup will remain in some environments,
    but the overall amount of data to be protected will necessitate changes. Networked
    storage is becoming more complex with more integrated SAN. These are seen as enablers
    of some backup technologies. We will begin to see these hardware and software
    solutions integrate more closely from the backup perspective?


    Still, the greatest visionaries and innovators have not been able to expand the
    day 24 hours to provide us with the ability to back up ever-growing data in light
    of the most prevalent problem, the 24 x 7 backup operations. Backup servers cannot
    be taken down for maintenance, as disappearing, or repairing, they are expected
    to be running double the backup window. The backup is disappearing, merging with
    the traditional product window, but at the same time, the requirements are increasing.
    This is for an always instant recover-point option. In fact, backup and recovery
    is now being seen as an integral part of data availability, instead of just data
    storage. Everyone wants to make the storage available on demand so that it can
    be logically moved around the enterprise and be where is most needed, but it must
    be backed up. When you couple this with the requirement to cluster everything,
    including the applications, the data, and the data protection, makes backup and
    recovery even more challenging. This is leading to the idea of hot backup systems
    or even backup sites. Will backup become an appliance like what we have seen with
    Network File Systems (NFS) and electronic material?


    As we look at these trends and requirements, one hardware trend stands out. The
    cost of disk versus tape hardware, with relative performance, is changing very
    quickly. Tape drives are getting faster and media has more capacity, but the costs
    are also going down. Dis are getting cheaper every day, and now we are seeing
    increasingly inexpensive high-density disks with good performance and reliability.
    This trend makes disk attractive as a backup device or at least suitable for quick
    backup access makes it very effective as a recovery device. Will disk be the new
    backup medium, as we have seen in some cases today? What will happen to tape?
    Will solid-state solutions prevail? What will the longevity of these solid-state
    devices mean, if anything, for off-site storage capacities?


    Another area being explored is the potential of merging or integrating different
    software products to provide an overall data protection strategy. The focus is
    not on traditional backup anymore. This'
