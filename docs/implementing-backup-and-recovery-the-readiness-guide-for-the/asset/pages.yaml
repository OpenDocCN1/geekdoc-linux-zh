  md: '# Advanced Reporting


    As we have seen, there are reports for jobs, media, and images. These reports
    can provide you with most, if not all, the information you need to manage your
    backup domain. Unfortunately, there are other reporting needs. Sometimes it is
    nice to be able to produce graphical reports and to have reports on other parts
    of the overall backup domain. These advanced reports may be produced in various
    ways. Veritas software offers an option product, NetBackup Advanced Reporter (NBAR),
    with over 30 different reports. You can also write your own custom scripts that
    can integrate the program interface in NBAR to produce your own. This is a Web-based
    tool. The reports help you analyze your NetBackup environment by presenting NetBackup
    data from four broad viewpoints:


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_99_0.png)


    Figure 6.22: Media contents report.


    +   - High-level summaries, which you can drill down to the specific trouble spots

    - Detailed operational views, including a consolidated error log

    - Historical perspective for trend analysis and event/time correlation

    - Performance indicators, such as data throughput


    Many of these reports are tailored to provide exactly the information you need.
    NBAR also includes an online version of the NetBackup Troubleshooting Guide. NBAR
    gives you a tool that allows you to use the information provided in the NetBackup
    debug logs to manually analyze the text log files. NBParser scans the Veritas
    NetBackup logs for information about each client and operation. It uses that data
    to generate reports on NetBackup backup and restore activities, catalog operations,
    and media usage. Maintaining a separate database allows Advanced Reporter to retain
    a record of NetBackup activities long after the NetBackup administrator has purged
    expired backup information from the NetBackup logs.


    NBAR consists of the following components:


    +   - A client delivery system that distributes the Java applet GUI to individual
    browsers

    - The Java applet GUI that is started from a browser

