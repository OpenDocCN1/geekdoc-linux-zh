  md: '# Summary


    In this chapter, we looked at what is needed to actually start the installation
    and configuration of a backup application. We then went through the individual
    installation and configuration steps required to complete a basic installation
    of VERITAS Software’s NetBackup. We touched on all the steps and also looked at
    the different interfaces. This should give you an idea of what is involved in
    setting up your basic backup application. In the next chapter, we will look at
    how to monitor your backups.'
  merge: -1
