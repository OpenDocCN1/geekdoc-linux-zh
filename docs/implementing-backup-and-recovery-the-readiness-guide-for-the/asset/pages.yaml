    # # Storage Units


    You have completed the configuration of the physical devices with NetBackup. This
    makes the devices accessible. As stated earlier, NetBackup now prompts you to
    continue with the logical configuration of NetBackup. This is the logical representation
    of the physical devices that NetBackup uses when assigning devices to jobs. The
    next wizard is the storage unit screen, shown in Figure 5.14.


    This screen lists all the configured libraries and prompts you to make a storage
    unit for each one. As you create them, make sure you give each one appropriate
    attributes. The first characteristic you need to select is the storage unit type-whether
    it is media manager unit, removable media, or a disk storage unit. This is done
    from the screen shown in Figure 5.15.


    If you select Disk, the default behavior is for the storage unit to be on demand
    only. This means the storage unit cannot be used by NetBackup as a destination
    for backups unless specifically named by the job. This is not a requirement. On
    the other hand, if you select Media Manager, on demand only the behavior is not
    default, but you may select it if desired.


    ![](img/acb44d4c8cce95a9dfc81e127fceac76_68_1.png)'
  merge: -1
