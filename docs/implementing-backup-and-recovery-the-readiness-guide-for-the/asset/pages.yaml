  md: '# Developing a Test Plan


    What is a DR plan if it is not tested? Not very good-since the whole purpose for
    putting together a DR plan is to be prepared in the event you any measured loss
    of data, equipment or services. This plan is supposed to give us an edge on such
    events, but if we do not test it, our planned outcome may be different. Therefore
    take this simple methodology to heart as you begin this process: Plan your test,
    test your plan. This very simple statement means that you must define a scope
    for your test because it is within this scope you will find success or failure
    of your DR plan. If you fail to do it, you lose consistency and repeatability
    of your DR plan. Remember, we are testing the DR plan so we are prepared; failure
    during a test that is documented and addressed is actually a success. However,
    failures that are ignored remain failures.


    # Planning the Test


    When you begin the process of planning your test, start at the result and work
    backward, much like we described at the beginning of this approach. If you define
    results as goals, you should be able to build the steps to achieve each goal.
    For example, the end result of your DR plan is that you would have your Online
    Reservations System (ORS) up and within 14 hours. To accomplish this in face of
    a declared disaster, you need to take the following steps:


    +   1. Disaster is declared: Assumption Facility inaccessible. To successfully
    test, you must make assumptions in order to test each level of the response teams.
    Other examples are as follows:

    na. System failure

    nb. Application corruption

    nc. Advancing weather conditions

    2. Contact response teams, including

    a. Management team lead

    nb. Emergency on-call team lead

    c. Assessment team lead

    nd. Recovery team lead

    3. Hot-site facility must be notified if this is required.

    4. Off-site vendor must be notified and most recent tapes need to be delivered
    to hot-site facility.

    5. Install/configure backup server.

    6. Recover backup server''s database.

    7. ORS recovery machine is installed/configured with an OS and backup client software.

    8. Begin recovery of data.


    In this example, each step may have substantially more detail that can be expanded
    upon, but it gives you a good idea of where you need to go with planning your
    test. Again, the more detailed your test plan, the greater is the probability
    that you will find success during its execution. Do not letverbosity guide the
    guiding light; begin where you are with what you have and use the results of the
    tests, including both failures and successes, to build a stronger, more resilient
    plan. You may want to only test certain components of your disaster recovery plan,
    such as the restore process. In case, make your test plan modular; in other words,
    create it in a way that you can pull out components without compromising consistency.
    We strongly recommend that you perform these tests on your off-site media at least
    every six months-preferably'
  merge: -1
  pgno: 236
- img_proc: true
  md: quarterly, if you are allowed. Just remember to stay within the scope of your
    test plan as you are executing the test plan, so you can see the holes. Do not
    stop, continue until you can go no further. Then document everything so you can
    per your test better the next time.
