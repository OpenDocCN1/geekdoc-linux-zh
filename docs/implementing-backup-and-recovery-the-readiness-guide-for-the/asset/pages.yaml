    at the end of the job for tasks such as NetBackup image validation. |

    | begin reading backup <name>, (restore), copy <number>; fragment <number> from
    media id <name> on drive index <number> | **Date** and **Time** fields for this
    entry show the time at which the restore job started reading from the storage
