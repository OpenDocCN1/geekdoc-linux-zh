  md: '# Frequency of Backups


    Once you understand the general backup requirements for all of the data and the
    business and legal requirements, you have a pretty good idea of how much data
    needs to be backed up and at least a minimum requirement for the frequency. The
    trick in establishing the ideal frequency policy is to come up with a schedule
    that gives you adequate protection with minimal media usage. You don''t want to
    back up more often than to get the necessary level of protection, since ''more
    often'' means more tapes, more data moving, and more administration. When in doubt,
    however, go with more media.


    Establishing the best frequency and retention policy for data that is covered
    by business and legal requirements also involves knowing why the data is being
    backed up and what recovery requirements are. In general, truly static or data
    systems might not need very frequent backups. They might be backed up infrequently
    as once a week or once a month. As far as the number of copies, a normal practice
    is to keep between two and four copies of the backups.


    Data that is more dynamic requires more frequent backups and probably needs one
    of the incremental types. Decision between differential and incremental is on
    recovery requirements versus media usage. Weekly full backups and daily differential
    incremental backups require up to six tapes to restore a directory, filesystem,
    or database in a worst-case scenario. Each of the incremental images might be
    small, but each day''s changes could be on a separate tape, or at least images
    on the same tape. If you did the backup sequence with cumulative incremental backups
    you would need more than two images on two tapes; however, if there were enough
    changes, the cumulative incremental backups approach a full backup in size. You
    must decide whether it is better to use fewer tapes for different backups but
    run the risk of having to mount more tapes on a restore or potentially use more
    tapes on the backups but only have two to restore an entire backup.


    Obviously, another piece of this equation is the anticipated type of recovery
    activity. If the data is backed up for DR protection to protect against hardware
    failures, the question of differential versus cumulative is important. The recovery
    requirements also come into play. By using the information gathered during your
    review process with the data owners, you can realistically plan based on the expectations
    you set during your discovery. If the absolute speed of recovery is important,
    the use of cumulative incremental backups is desired. The incremental type generally
    comes into play when you are working with filesystem. With databases, you generally
    work with the tools that are integrated with the backup application, and this
    will dictate much of what you do.'
