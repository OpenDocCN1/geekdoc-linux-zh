  md: '# The Natural Progression of Troubleshooting


    When troubleshooting, always start with the most obvious first, such as network
    cable, daemons, or filesystems (unless, of course, you have ruled out through
    your identification process). The most obvious place to start is also the least
    time-consuming. This is important to keep in mind, especially if you have service
    level agreements with your customers. You should plan your strategy for troubleshooting,
    then work that to fruition.


    Because it seemed appropriate, we started looking at the error logs to determine
    what was happening internally to the backup application. This is an important
    exercise. If you do not understand why the errors pertaining to the backup application,
    it is strongly suggested that you take the time for self-education or review yourself
    in the next available training class and be sure to inform the instructor that
    deciphering the logs is one of your objectives.


    Since our experience with VERITAS NetBackup, we decided to continue to use our
    method of example whenever. When we looked through the logs, we need to identify
    what we are looking for. Remember, this is a courtesy review of the most obvious
    place to start; therefore, we look for obvious errors, such as missed alerts or
    any physical errors that have been logged regarding the directives themselves
    in /var/messages.


    Nothing was uncovered during this discovery, so we completed this courtesy review
    of the logs and began confirming the configuration. Since the problem described
    was not necessarily pertaining to the configuration of the backup policies, we
    knew we could address and focus squarely on the physical aspects of the configuration.
    NetBackup is composed of two components: NetBackup and Manager. The Media Manager
    component deals with physical devices and media, so this is a natural place to
    begin after reviewing the logs. The best way to display the configuration from
    the command line with NetBackup is to use the following:


    ```

    /usr/open/volmgr/bin/tpconfig -d

    ```


    or


    ```

    /usr/open/volmgr/bin/tpconfig -data

    ```


    This displays how the physical devices and robots are configured and a good first
    step for your troubleshooting. Since this problem hinged on data storage to tape,
    it was reasonable to ensure that the correct devices were being used, and since
    it was a UNIX installation, we wanted to make sure that the compression device
    was being used. Once confirmed, in fact, we found that the next step was to check
    the stconf file. Since this was a Server, we need to check the stconf file. The
    stconf file, found in /kernel/dev, is the configuration file for SCSI tape devices
    that allows you to configure how the device will interface with the physical device,
    and how it will handle compression.


    When we reviewed the entries for the client''s tape devices, we found that the
    compression settings were at default: none of our settings were present. At that
    point, we also noticed a ''stale'' state that the server had been in the past
    several months. We found that the client didn''t realize that they had installed
    a jump patch to this server after 45 days prior. What the client''s solution was
    to update the stconf file during its patching process, and then apply the patch
    and reboot the server. After a few weeks, it was apparent to the client that this
    problem was all over again.


    When you are troubleshooting, you really take on the role of the investigator,
    especially if you are not the primary administrator on the server. When you are
    asked to help out, you really need to be prepared to ask questions to help you
    determine the root cause. We recommend asking questions as though you know nothing
    of the application, with reason, and again asking questions. Here''s a sample
    of the questions that were asked in order to begin work troubleshooting the previous
    example:


    +   1. What exactly is the problem(s) you are seeing?

    2. When did you notice the change or the errors?'
  merge: -1
