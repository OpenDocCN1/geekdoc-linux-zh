  md: '# How to Gather Information


    The different backup applications have their own mechanisms or methods to gather
    data. With VERITAS Software''s NetBackup, a script named ''support'' is provided
    with the system in /usr/open/netbackup/bin/goodies. In a Windows system, the script
    is in\Program Files\VERITAS\NetBackup\bin\goodies. This script can be used to
    gather system, patch, version, and configuration information. It can also be used
    to gather information from the application logs. The output of the script is placed
    in a file that can be sent to the support folks to investigate any problems.


    In addition, a newer utility, NCVU, can be used to verify your configuration.
    For more information about this utility, go to http://seer.support.veritas.com/docs/247698.htm.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# Where to Find Information to Assist in Self-Diagnosis


    The best source for troubleshooting is located in the application troubleshooting
    guide. This information is located online with many of the applications today
    and is accessible via hot keys. The operating system also contains valuable information
    in helping diagnose problems, including the pages and other online documentation.
    As you get into some of the more complex configurations, the troubleshooting also
    gets complex. If you are using a SAN, there are actual diagnostic tools (HBA)
    for the different elements in the SAN, such as the switch, router, and each host
    bus adapter that supports logging facility, and VERITAS is also a log analyzer
    designed to help you debug logs on editors or backups. You can enter a job ID,
    and the utility will be available at http://seer.support.veritas.com/docs/248369.html.


    As you consider troubleshooting your backup, remember, it is an application that
    touches many parts of the system. With this in mind, you should become familiar
    with the assistance commands and support tools available at the operating system
    level. Your backup application, such as NetBackup, is an application, and as such,
    it relies on the operating system and its infrastructure to operate its mission.


    Tools are available with most operating systems that will assist you in gathering
    additional information produced by the operating system during its normal operation.
    The first place to look is usually the system''s logs. Many times, errors that
    seem to occur in the backup application are triggered by a lower-level failure
    that is seen by the operating system. Often, these types of failures are reported
    to the application and in turn reported as an error code by the application. A
    case in point is a Status 23 reported by NetBackup. NetBackup describes this as
    a "Cannot Connect on Socket" error. While this is technically true, the underlying
    cause is usually found to be a failure in the system networking structure.


    Although this section cannot delve into all types of errors and their analysis,
    we hope that an explanation of how you go about resolving issues will help you
    understand the interaction and usage of the operating system as means of troubleshooting
    and solving problems. We hope that following this chapter, you will begin to automatically
    think of the interaction of the application, operating systems, mechanical infrastructure,
    and mechanical infrastructure software found in the switches, routers, and drives
    that make up an enterprise.


    In the next section, we will include the infrastructure used by the backup application
    as part of your troubleshooting technique. This will help you become more efficient
    in your daily activities.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# Some Tools to Become Familiar With


    Most systems and devices have some form of commands or interfaces that can be
    used in troubleshooting. We will take a quick look at a few of them to help you
    understand how the use of these additional tools can resolve problems more rapidly.
    Many of these commands have equivalent commands in other operating systems.


    Following are some of the basic operating system commands:


    +   - **truss (1)** - Trace system calls and signals on Sun Solaris


    +   - **tusc**- Trace system calls and signals on HP systems


    +   - **par**- Trace system calls and signals on Silicon Graphics systems


    These commands can be used to determine what is happening within a given process.
    They can be used when the backup application is hung. By using truss or one of
    its equivalents, you can determine whether a particular file residing on a filesystem,
    when accessed by the operating system, could cause the same type of hang to occur.
    You can then confirm this by reading the file using some other type of operating
    system. In this case, the use of the system command od could also enable you to
    determine that a file had an incorrect symbolic link to it.


    Another scenario is when the od command is used to show that access to a file
    will cause the drive to not respond. This type of troubleshooting made clear that
    the problem was not with the application since was waiting for the operating system
    to return the requested data. Therefore, the correction must be action within
    the operating system.


    In the second example, the system log should show a failure a timeout posted by
    the drive. However, in the case of the incorrect symbolic link in the first example,
    the system was spending its time trying to determine the endpoint of a circular
    link, resulting in the application crash when hung to back up a particular file.
    The od command can also be used manually to read the data on a tape to help determine
    if the backup utility is writing the headers and data to tape.


    While rare, it is possible that the backup application can either directly or
    indirectly cause a system to panic or crash. In some cases this is caused by interoperability
    between the different vendors'' hardware or firmware versions. In these cases,
    analysis by the vendors is required for the problem to be determined. By using
    commands such as crash, you can determine if the problem is repetitive, which
    may signify a coding problem, or random, which might point to some type of hardware
    problem. It is not our intention to teach you system debugging; however, we want
    to make you aware of some of the tools that can help.


    Other areas that you need to become familiar with are the utilities that are incorporated
    in some peripheral devices, including those that are part of the SAN, such as
    switches, and routers. Although the terms bridge and router are sometimes used
    interchangeably in the networking world, a distinction may be made. A bridge connects
    medium between devices. For example, the Channelpar FS1310 connects SAN devices
    and fiber networks. It is a bridge with a router, there may not be a transformation
    of medium.


    No matter what the code involves, failures at this level will result in the backup
    application reporting errors. Keep in mind that the backup application will likely
    be the first place that there is an opportunity for the error to be visible to
    the user. Most devices that are on the SAN or network, there is also what one
    could consider a small operating system that is responsible for a particular type
    of activity. In these devices, there is a small command that you can use to help
    determine the cause of a failure. These command sets can be used to show connections,
    errors, firmware levels, and so on. In addition, you sometimes use these command
    sets to determine status of connections, health of the physical medium, and so
    on, as well as to determine where a'
