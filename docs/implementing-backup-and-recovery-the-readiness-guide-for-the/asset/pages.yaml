  md: '# R


    # Registry


    The Microsoft Windows 2000, NT, 98, or 95 databases that has configuration information
    about hardware and user accounts.


    # remote media server


    A media server that is *not* the master. Note that only NetBackup DataCenter supports
    remote media servers.


    # residence


    In Media Manager, information about the location of each volume is stored in a
    volume database. This residence entry contains information such as robot number,
