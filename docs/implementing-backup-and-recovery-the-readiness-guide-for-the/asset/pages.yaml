    The Jobs Details screen contains two tabs: Job Overview and Detailed Status. These
    scenes can give you a very good idea of what is going on with a specific job.
    Also, if a job has a nonzero status, you can select the Troubleshooter Button.
    This wizard provides an explanation of the specific status code and can be very
    helpful in discovering what might have caused a job to end with a nonzero status.


    Figures 6.6, 6.7 show an example of a nonzero backup job that has completed, as
    well as how to enter the Troubleshooter.


