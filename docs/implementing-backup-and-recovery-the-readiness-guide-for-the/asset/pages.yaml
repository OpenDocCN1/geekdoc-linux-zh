  md: '# Complexity in Enterprise Backup


    The functions of enterprise tape backup may seem straightforward. But implementing
    a truly functional backup environment that meets enterprise data protection requirements
    can be a complex undertaking. When you design or update a backup strategy, complexity
    can arise for several reasons:


    +   **Ability to back up all of the data.** For the strategy to be useful, it
    must ensure that all data that can be lost is backed up. In an enterprise with
    many information services, of which may have data with others, identifying the
    sets of data objects to be backed up can be a significant effort.


    +   **Frequency.** Backup frequency is essentially a trade-off between resources
    (network and I/O bandwidth, processor capacity, tape and library hardware, and
    application access) and the need for the most current data possible. Again, with
    many information services needing data protection, finding the right balance between
    backup frequency and resource consumption is a challenge.


    +   **Integration of all data managers.** Enterprises with many information services
    are likely to use multiple data management systems (filesystems and database management
    systems), each with its own mechanisms for backing up data objects that it recognizes.
    Your task is integrating these mechanisms into a schedule that provides a consistent
    backup of all required data for a service and keeping them up-to-date as the service
    changes.


    +   **Continuous availability.** Continuous application availability is increasingly
    required in the today''s enterprise. A variety of mechanisms enable backups with
    minimal application downtime. Choosing among these and implementing the choice
    can be a complex task.


    +   **Media management.** Business or regulatory requirements can result in multiyear
    data retention requirements. Enterprises can find themselves responsible for maintaining
    backups and archives on tens or even hundreds of media (tape cartridges, optical
    disk platters, etc.). The procedures for managing large numbers of media can also
    be complex.


    +   **Management of multiple locations.** Business considerations may require
    that servers and data be located in multiple locations. Maintaining a consistent
    set of backup procedures across multiple data centers can require extensive design
    or management talent.


    The backup component of an enterprise data protection strategy has to accommodate
    all of these factors.'
