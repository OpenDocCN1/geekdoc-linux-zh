    +   * Media summary report.

    * Images on media.

    * Media log entries.

    * Media written report.


    +   * Media contents report. We mentioned this before, but it is worth repeating.
    When this report is run, it will actually mount the requested tape, read the contents
    of the tape, and compare the headers on the tape against the information stored
    in the NetBackup catalog.'
