- - '###'
  - 理解 SELinux 工作模式
- - '#'
  - 此文件控制系统上 SELinux的状态。
- - '#'
  - SELINUX= 可以取以下三个值之一：
- - '#'
  - enforcing - 强制执行 SELinux 安全策略。
- - '#'
  - permissive - SELinux打印警告而非强制执行。
- - '#'
  - disabled - 不加载 SELinux策略。
- - '#'
  - 另见：https://docs.fedoraproject.org/en-US/quick-docs/getting-started-
- - '#'
  - 注意：在早期的 Fedora内核构建版本中，SELINUX=disabled也会在启动期间完全禁用SELinuxux。如果你需要一个完全禁用SELinuxux的系统，在不加载任何策略的情况下运行SELinuxux，需要在内核命令行中传递selinux=0。你可以使用grub持久地设置引导加载程序以selinux=0启动：
- - '#'
  - grubby --update-kernel ALL --args selinux=0
- - '#'
  - 恢复到启用SELinuxux：
- - '#'
  - grubby --update-kernel ALL --remove-args selinux
- - '#'
  - SELINUXTYPE= 可以取以下三个值之一：
- - '#'
  - targeted - 保护目标进程，
- - '#'
  - minimum - 最小目标。
- - '#'
  - mls - 多级安全保护。
