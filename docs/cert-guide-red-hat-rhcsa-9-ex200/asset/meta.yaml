- - '###'
  - 基础主题
- - '###'
  - 3. 加载引导程序：从启动设备找到启动引导程序。在 RHEL 上，这通常是 `GRUB 2`。
- - '###'
  - 4. 加载内核：启动引导程序可能会向用户显示启动菜单，也可以配置为自动启动默认操作系统。加载 Linux，内核将与 `initramfs` 一起被加载。`initramfs`
    包含了启动所需的所有硬件的内核模块，以及继续进入阶段阶段所需的脚本。在 RHEL 9 上，`initramfs` 包含一个完整的操作系统（用于故障排除目的）。
- - '###'
  - 5. 启动 `/sbin/init`：一旦内核加载到内存中，就会加载第一个进程，但仍然来自 `initramfs`。这就是 `/sbin/init` 进程，在
    RHEL 上它链接到 `Systemd`。还会加载 `systemd-udevd` 守护进程以处理后续的硬件初始化。所有这些操作仍在 `initramfs`
    镜像中进行。
- - '###'
  - 6. 处理initrd.target`：Systemd 进程执行来自 `initrd.target` 的所有单元，这准备了一个最小的运行环境，其中磁盘上的根文件系统挂载在
    `/sysroot` 目录上。此时，已经加载了足够的内容来传递给写入硬盘的系统安装。
- - '###'
  - 7. 切换到根文件系统：系统切换到磁盘上的根文件系统，此时也可以从磁盘上加载 Systemd 进程。
- - '###'
  - 8. 运行默认目标：Systemd 查找要执行的默认目标并运行其所有的单元。在此过程中，会显示登录界面，用户可以进行身份验证。请注意，登录提示可能会在所有
    Systemd 单元文件成功加载之前。
