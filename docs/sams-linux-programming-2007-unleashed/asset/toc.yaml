- - '###'
  - 'UDP: 用户数据协议'
- - '###'
  - 运行 UDP 示例程序
- - '###'
  - 总结 全这些 UDP 示例程序表明，如果不需要担心消息丢失，使用 UDP 是非常简单的。记住，在局域网上，丢失 UDP 消息包的可能性并不大，因此少少的“握手”就足够确保发送和接收程序都在正常运行。尽管你通常会使用
    TCP 套接字，但 UDP 是提高分布式系统性能的一种强大技术。在第21 章“使用组播套接字”中，你将看到如何使用从一个发送者到多个接收者的组播广播。我们将使用
    UDP 而非 TCP 进行组播广播。你会发现，发送组播广播的代码与使用 UDP 几乎相同，但在接收组播 IP 广播时，你必须额外的工作。
