  md: '# Chapter 1: Installing Red Hat Linux


    # Understanding Partitions


    A single disk can be divided into one or more partitions. To the operating system,
    a partition looks like a seperate disk. Using partitions allows you to divide
    a disk (or disks) into distinct parts. An operating system like Linux can then
    keep the files that comprise its various systems separate from each other. This
    practice makes for a more reliable and easily maintained system. For instance,
    you can create a partition for the operating system and its files, and one for
    your users'' home directories. You can reinstall your entire operating system
    without touching your users'' files and data. The separation creates a easily
    managed system.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_36_0.png)


    Linux uses the fdisk program to partition a disk. The Red Hat installation process
    uses either the fdisk program or its own Disk Druid to format a disk. DOS/Windows
    uses the FDISK program to partition a disk. Both the Linux and DOS versions have
    the same name and the same function, but they are different programs.


    # Understanding File Systems


    A file system is an organizational structure that is written to a partition. The
    file system basically allows programs to read and write files and directories
    to a disk. Since a file system is laid on top of a partition, each file system
    must ''live'' within its own partition.


    Linux uses the mkfs program to format a disk partition; this process installs
    a file system onto the partition. DOS/Windows uses the FORMAT program to put a
    FAT or FAT32 system onto a disk partition. The mkfs program can use the Linux
    standard ext2 file system or of any other types of file systems, including a DOS
    one. Note that you can mount DOS file systems onto your Linux system.


    When you boot your Linux computer, the operating system attaches—mounts, its internal
    data structures. The root file system can be stored in memory, on a floppy or
    ZIP disk, or of course, on a hard drive. A Linux system can have just one file
    system—the rootor more than one. When you have multiple file systems, they are
    all mounted directly or indirectly to the root file system. If you look at them
    as the branches of a tree, you can see that they are all rooted to that location.


    # USING THE DUAL BOOT METHOD


    Linux can be installed on the same disk with other operating systems, including
    Microsoft Windows. The focus of this book, is an existing network consisting of
    Windows products so the discussion is oriented in that direction. If you are using
    other operating systems, however, you should be able to use this method with modifications.'
  merge: -1
