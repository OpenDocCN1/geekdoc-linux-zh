  md: '# Part III: Connecting Your Network to the Internet


    modify your /etc/resol.conf file to look as follows:


    ```

    domain paunchy.net

    nameserver 192.168.1.254

    nameserver 192.168.32.2

    ```


    Where the last nameserver entry is a fake one and should be replaced the IP address
    of your ISP''s nameserver.


    Test its operation by starting the nslookup program. At the nslookup prompt, enter
    a network name like atlas.


    ```

    nslookup>atlas

    ```


    The nslookup utility should return the numeric IP address of atlas:


    ```

    Name: chivas.paunchy.net

    Address: 192.168.1.250

    Aliases: atlas

    ```


    If you enter an address that is not found within the named files in the /var/named
    directory, then your ISP nameserver is accessed. In the case where you enter a
    name of a network device on your own network, then the name lookup fails. You
    should enter the device name and address information in your local named configuration
    files.


    # Using DIP to Connect to the Internet


    The dip package is part of the default Red Hat installation. To use it in root
    and enter the command dip -t from the command line. You get the DIP> prompt as
    shown.


    ```

    DIP: Dialup IP Protocol Driver 3.3.70-uri (8 Feb 96)

    Written by Fred N. van Kemp, MicroWalt Corporation.

    DIP>

    ```


    Dip is in command mode. Every valid word that you enter is interpreted as a command.(Enter
    help for a list of commands.) You need to tell dip where to find the modem so
    you enter the following command at the DIP> prompt.


    ```

    DIP>port modem

    ```


    The modem parameter was set in Setting Up Your Modem earlier in the chapter. Next,
    change into terminal emulation mode as follows:


    ```

    DIP>term

    ```'
