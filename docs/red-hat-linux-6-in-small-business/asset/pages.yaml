- img_proc: true
  md: 'This bash shell script is used by chat to both dial the modem and negotiate
    the authentication during the log process; some of the documentation lines have
    been removed to help accentuate the important parameters. The important lines
    are as follows:


    +   - The phone number is that of your ISP''s dial-up phone line.


    +   - USER_CHAT_SEQ="login" defines the prompt dial/chat expects to see at the
    start of the PPP authentication process. The remote PPP server of your ISP responds
    to your modem connection (one that is assigned to handle PPP connections) with
    a login prompt This is similar to the login prompt that you are given when logging
    into your Linux computer. The chat program uses the string ogin; as the indication
    that it should send your PPP login name. Note that the first character, which
    is a capital L (Login) is left out in order not to get confused by a system that
    has to use a lower case l. USER_CHAT_SEQ is the variable that dial/chat uses to
    store the string.


    +   - USER_NAME="Iwantpp" The Iwantpp is the name of your PPP account. The capital
    P in the user name is a widely used convention to designate a PPP account from
    a normal user account. USER_NAME is the dial/chat variable used to store the string.


    +   - PASSWD_CHAT_SEQ="word" The string defines what dial/chat expects to see
    before entering the password. The partial word is used again because it has a
    higher probability of being constant across PPP servers. PASSWD_CHAT_SEQ is the
    variable that chat uses to store the string.


    +   - PASSWORD="frankearlyyears" The stringfrankearly is the password for your
    PPP account. It is also analogous to the password supplied for a normal user account.
    PASSWD is the dial/chat variable used to store the string.


    +   - PROMPT="PPP session" The PPP session is the string that dial/chat expects
    to see once the PPP server has authenticated you and started a PPP connection.
    PROMPT is the variable that dial/chat uses to store the string. Of all the parameters
    mentioned, this string is most likely to vary from one PPP server to another.


    +   - PROTOCOL_START="ppp" The command that dial/chat sends to the ISP to start
    the session. If the PROMPT="" is left blank, then dial/chat does not send any
    command.


    +   - /var/log/dial.connect This is the syslog file to store information about
    all dial ups and PPP connections.'
