- img_proc: true
  md: '# Chapter 1: Installing Red Hat Linux


    # # Partitions to Format


    You need to format the new partitions. A format is different from a partition.
    Formatting installs a file system on top of a partition. A file system is what
    the operating system uses. Files and directories are placed on a file system.
    For instance, when you use the ls command, the information displayed are the files
    and directories that sit on top of a file system.


    One advantage of using multiple file systems is that you do not have to format
    any or all of them when you are this point in the installation process. For instance,
    you can do a complete installation over an existing Linux system without destroying
    data or applications. If you have a separate /home file system for your home directories,
    then you can choose not to format it at point; the same goes for the /usr/local
    file system (or any file system) too. By formatting the /(root) and /usr file
    system, for instance, you install a new operating system without touching the
    user data in /home or the extra applications loaded in /usr/local.


    After you choose the partitions to format, the system scans for software.


    # # Components to Install


    This is the point where you get to choose what, if any, the Red Hat software packages
    come with the distribution to install. By default, Red Hat installs the essential
    packages as well as a selection of others deemed popular or useful. In many cases,
    and especially while you are suffering through the initial learning curve, it
    is reasonable to accept the default. However, you should be aware that you do
    not have a choice.


    If you wish to modify the software selection then you can make general or more
    detailed choices. The general choices fall into categories such as the Extra Documentation
    component shown in Figure 1-3.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_50_0.png)


    Figure 1-3: Components to install dialog box'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'You can also make more detailed selections if you choose the Select Individual
    packages option shown in Figure 1-4. (Red Hat uses its own creation called the
    Red Hat Package Manager (RPM) to store, install, remove, and get information about
    all the software that you use. RPM is a very popular system because it is an efficient,
    convenient and reliable software distribution method. It is discussed in more
    detail in Chapter 5.) When dealing with individual packages RPM is what the installation
    process is using.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_51_0.png)


    This book uses HOWTO and FAQ documents that are included on the companion CD-ROM.
    It is highly recommended that you install that documentation during this installation
    process. It only takes a few megabytes of disk space and is well worth its weight.
    Go to the bottom of the installation dialog box and click the Extra Documentation
    item to do.


    Once you finish selecting the software to install and press the OK button the
    software is copied onto your disk. A reasonably CD-ROM drive takes around 10 to
    12 minutes to finish. A simple progress display is shown. It is reasonable accurate
    in estimating the time to go.


    # # Install Log


    You are told where you can view the installation log after the installation is
    completed. Click OK and the installation proceeds.


    # # Running


    The file systems are formatted.


    # # Install Status


    During the installation you are shown the Install Status window. This display
    shows each package as its being installed as well as the number of packages already
    installed. It also lets you see how many packages are left to go and the estimated
    time it will take to install them.


    # # Configuring Your New Linux

    Installation


    After the installation of the software is complete the process focuses on configuring
    your new Linux computer.'
