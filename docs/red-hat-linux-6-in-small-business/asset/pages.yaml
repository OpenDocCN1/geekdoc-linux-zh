  md: '# Booting directly from the Red Hat CD-ROM


    If you have a fairly new PC, then you might be able to start the installation
    process directly from the Red Hat distribution CD-ROM. Enter the BIOS setup by
    rebooting your computer and by pressing the DEL key (some BIOSes use the Esc or
    F2 key). While the computer is checking the memory, you should see the memory
    check numbers incrementing during time.


    From the BIOS menu choose the ... menu (or similar message) and if you can toggle
    the drive bootup to something like "boot from CD-ROM" and then this method probably
    works. Select that method, insert the Red Hat CD-ROM and reboot your system. Your
    computer boots from the CD-ROM and the installation process starts.


    # Using the Red Hat Boot Floppy Disk


    You can create boot and supplemental disks by running the RAWRITE.EXE program
    from the companion CD-ROM in \DOSUTILS directory. If you are working from the
    D: (CD-ROM) prompt, type the following:


    ```

    D:\CD\IMAGES

    D:\IMAGES>DOSUTILS\RAWRITE.EXE

    ```


    The program asks you enter for an input file name and the destination drive. To
    create the boot diskette enter boot.img and A:; and supp.img and A: for the supplemental
    diskette. Note that by changing to the directory where the boot.img and supp.img
    file are created you can simply enter their names when prompted rather have to
    include the entire pathname.


    > The rescue.img file found along with boot.img and supp.img is used to create
    a disk that can be used to start Linux from the boot and rescue floppies alone.
    Use RAWRITE and enter supp.img when prompted for the input file. If, in the future,
    you can start your Linux system then you can use the disk to get going and hopefully
    fix whatever the problem is. The file /mnt/cdrom/doc/rescue.txt on the companion
    CD-ROM contains further information on this subject.'
  merge: -1
