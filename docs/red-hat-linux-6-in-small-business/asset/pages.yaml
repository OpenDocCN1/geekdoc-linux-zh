  md: '# Chapter 1: Installing Red Hat Linux


    uses, with slight variations, the Linux File System Standard (FSSTND) as its convention.
    For instance, Red Hat often wants to keep its log files in the /var/log directory.
    Please refer to http://www.pathname.com/fhs for more information.


    # UNDERSTANDING LINUX FILES


    Linux uses the UNIX concept of describing almost everything as a file. Thus, Linux
    uses the file construction to interact with peripheral devices in the same way
    that it interacts with data stored in a file disk. Although Linux treats devices
    as a file, it does not treat network devices as a file. A directory is also just
    another file as Linux is concerned, and a directory file contains the names of
    the files that are associated with it.


    # INTRODUCING LINUX COMMANDS


    Commands that are used, or are useful, are listed in Table 1-1. A brief description
    and the DOS equivalents—if they exist—are shown here.


    # TABLE 1-1 BASIC LINUX COMMANDS


    | Command | Function | DOS Equivalent |

    | --- | --- | --- |

    | ls | Lists the files in the current directory | DIR |

    | cd | Change directory | CD |

    | clear | Clears the current screen | CLS |

    | cat | Display file contents | TYPE |

    | fdisk | Partitions a disk | FDISK |

    | ifconfig | Configure a network interface | IPCONFIG |

    | lmod | Lists modules in use by the kernel | |

    | man | Displays information about a command | HELP |

    | mkfs | Formats a partition with a file system | FORMAT |

    | mount | Makes a file known to the operating system | |

    | netstat | Display networking information | NETSTAT |

    | ps | Display process list | |

    | route | Configure an IP route | ROUTE |


    These Linux commands are discussed in more detail in Chapter 2.'
