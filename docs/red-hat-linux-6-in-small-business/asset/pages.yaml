- img_proc: true
  md: '# Introducing Systems Administration


    Your goal for administering a Linux server should be to make it work as efficiently
    and safely as possible. Any type of computer system—and Linux is no exception—will
    always take a lot of effort to run efficiently and reliably. However, following
    the guidelines described in this chapter, you can run your system, instead of
    letting your system run you.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_137_0.png)


    The term Systems Administration often includes many, if not all, of the functions
    of Network Administration. The terms can be used interchangeably. For the purposes
    of this book they are treated separately in order to help break this amorphous
    subject into more manageable and easily understood chunks.


    This goal certainly requires a lot of work to reach. However, the more that you
    concentrate on creating a structure that encourages your computer and network
    to run smoothly, the less you''ll have to do in the future.


    The ideal working structure is a computer that has a recent operating system with
    all the latest updates (patches) installed. Its file system should be well thought
    out and consistent with only the necessary daemons running and the minimum system
    software installed. All application software should be installed correctly and
    its documentation kept in one place. The partitions themselves should be no more
    than 80 percent full. Minimalism is good when dealing with computers.


    The list goes on and on, but you get the idea. The use of a consistent logic in
    the design your systems create more easily managed computer, because trouble very
    often occurs at the intersection of two elements. If you have more hardware or
    software than you really need, you''re forcing more systems than necessary to
    interact with each other. More interactions lead to more complexity and very often
    spells trouble.


    # Understanding and Creating Policy


    Seldom does one get to create the structure that is necessary for creating the
    ideal, or even reasonable, computer environment. Perhaps if you are starting your
    business from scratch and have the time and money to create a good computer model,
    then you can engineer a good environment. However, in the more common situation
    where you don''t have the time or money (or else inherit an existing system) then
    your situation is more problematic; and you''ll have your hands full just making
    sure your system is up and running.


    You should have goals, however, and if you don''t try to set and reach them, you
    will never have anything close to a smoothly running system. They are often'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Chapter 6: Administering Your Linux Server 111


    useful in setting base lines to work from. Whatever your situation is, if you
    can imagine the structure that you want to operate from, then you will be better
    off in the long run.


    The policies you set now are your tools for freeing yourself from the control
    of the computers. Whether you''re the sole proprietor and have a mental list,
    or the VP in charge of a significant number of people and have written policies,
    they are important to think about. The following list outlines several categories
    of everyday system administration that you might consider.


    +   * Backups: When, how, why, and what kind of backups are performed. Your needs
    will depend on your normal tasks are. Use your best judgment.


    +   * Security: Protect your computer(s) from unauthorized access.


    +   * Servicing your customers: Adding, deleting modifying accounts and other
    related services.


    +   * Troubleshooting: Finding problems that occur and fixing them.


    If you set your policies and follow them, then you''ve made a consistent structure
    for your system. You need to balance ease of use for you and your users along
    with the extra work that such structures require. It''s a balancing act just like
    everything else in your operation. Judgement is key.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_138_0.png)


    It''s very common to inherit a computer system, which means you''ll inherit the
    current structure is, if any. However, there are no clear guidelines, your out
    practices can become new policy. For instance, if you always perform backups on
    Friday nights, after a while that''s when people will expect backups to be performed.
    If you put it into writing, it will almost certainly become the facto policy.
    Whenever possible write it down.


    # Backing Up Your File Server


    This is the single most important job to do. This is an important topic that''s
    included in this section with other generalities. If you are consistent, reliable
    backups you''ll be okay no matter what goes wrong. Consistency and liabilities
    are key.


