- img_proc: true
  md: '# Chapter 11: Connecting to the Internet 251


    Dip goes into terminal emulation mode.


    [Entering TERMINAL mode. Use CTRL-] to get back.]


    Everything you type in now is sent to the modem. If you type Ctrl, then dip returns
    to control mode.

    Tell the modem to dial your ISP as follows:


    atdt 5555309


    The at characters tell the modem to pay attention. The d character tells it to
    dial the t to use tone dialing. Substitute your ISP''s phone number for the one
    used here. Once you press the return key, your modem dials up your ISP.

    A Linux or UNIX-based ISP typically gives you the following prompt.


    myisp login:


    Enter your PPP account name (not your Linux user name) and then the PPP account
    password. If you is configured to set up a PPP connection then you will see a
    line or two of garbled looking text. That is the ISP PPP daemon trying to handshake,
    or connect with your PPP client.\Next, return to your dip command mode by entering
    the CTRL-] key sequence (press Ctrl]). You should see the DIP> prompt again. You
    need to tell dip to get the dynamic IP address assigned to your Linux gateway
    by entering the following command.


    ```

    DIP>get $local 0.0.0.0

    ```


    Dip queries the remote PPP server about its new IP address and assigns it to the
    internal DIP variable local. The default route is designated by the numeric IP
    address 0.0.0.0.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_278_0.png)


    You are not limited to assigning your PPP connection to the default route. If
    you are connecting to another network with say, the 192.168.16.0 network (which
    is fake, in this case), then you would use the instruction DIP>get $local 192.168.16.0.


    To complete the PPP connection, enter the command:


    ```

    DIP>mode PPP

    ```'
  merge: -1
