  md: '# Chapter 3


    # Editing Files


    IN THIS CHAPTER


    +   - Choosing an Editor

    - Working with pico

    - Working with joe

    - Working with vi

    - Introducing emacs

    - Checking your spelling


    BEFORE LONG, YOU''RE going to need to edit text files when working with Linux.
    Probably the most common file you''ll work with is a text file. Many of the systems
    that comprise Linux are configured via text files—the startup, shutdown scripts
    (/etc/rc.d) are all text files. The networking system and X Window System and
    many others use text files too. Editing these files can be a significant job if
    you administer your own network.


    There are also many types of text-based files other than system configuration
    letters, shopping lists, reports, and e-mail messages, among others, consist of
    mostly text information. The recent development of full-featured word processors
    largely negates the necessity of doing big jobs with text editors, but you still
    need a quick and consistent method for modifying configuration and other files.


    # Choosing an Editor


    There are several text editors available for Linux. A text editor, unlike a word
    processor, works on simple text files. Some, like vi (Visual editor), have been
    around for many years. Others are recent entries, like the Emacs editor, which
    provides powerful document editing features.


    The best text editor is probably the one that you''re most familiar with. Familiarity
    and muscle memory mean much more than the features do. However, before you develop
    that muscle memory you should look over the available editors.'
