  md: '# Chapter 8: Sharing Files and Printers with Samba


    The first few lines of the smbpasswd file look like the following (some of the
    X''s have been deleted by the entries fit onto the page):


    ```

    #

    # SMB password file.

    root:0:XXXXXXXXXXXXXXXXXXXX:XXXXXXXXXXXXXXXXXXXX:root:/root:/bin

    bin:1:XXXXXXXXXXXXXXXXXXXX:XXXXXXXXXXXXXXXXXXXX:bin:/bin:

    deamon:2:XXXXXXXXXXXXXXXXXXXX:XXXXXXXXXXXXXXXXXXXX:daemon:/sbin:

    adm:3:XXXXXXXXXXXXXXXXXXXX:XXXXXXXXXXXXXXXXXXXX:adm:/var/adm:

    lp:4:XXXXXXXXXXXXXXXXXXXX:XXXXXXXXXXXXXXXXXXXX:lp:/var/spool/lpd:

    ```


    Delete any lines that don''t start with the username of a user on your system.
    Leaving entries for the system users (root, daemon, bin) can create a security
    hole.


    Next, you need to create a Samba password for each user that you want to provide
    with Samba access. Run the smbpasswd command as follows, where iamuser is the
    name of the user whose password you want to set:


    ```

    smbpasswd iamuser

    ```


    The smbpasswd program prompts you to enter the password twice. The iamuser entry
    in the /etc/smbpasswd should now look like this:


    ```

    iamuser:500:834A0B3B453DD1:8XEED80EBE5326::/home/iamuser:/bin/bash

    ```


    The X''s have been replaced with the encrypted password. Next, you need to repeat
    this process for each user. Restart the Samba deemons:


    ```

    /etc/rc.d/init.d/smb restart

    ```


    Log on to your Windows machine and enter a username and password that correspond
    to a user you have entered in the Samba password file. You should see that user''s
    home directory in the Windows Network Neighborhood folder.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_206_0.png)


    > If you configure Samba to accept encrypted passwords, it still accepts plain
    text ones as well. When using encryption, Samba first tries to authenticate a
    request against the encrypted version of the associated password. If that fails,
    Samba attempts to authenticate the plain text password.'
