  md: '# Working with joe


    The editor got its name from its author—Joseph H. Allen. J-O-E is actually an
    acronym that stands for Joe''s Own Editor. It comes in five different versions—joe,
    rjoe, jpico, jmac, and jstar. Joe is its own personality; joe is a restricted
    version of joe. The restriction is that you can only edit files specified on the
    command line.


    Each of the other versions is actually joe pretending to be a different editor.
    jpico, for example, is joe acting like pico. That means that all the commands
    that work with joe, work the same way with jpico. Jmac is joe acting like the
    Emacs editor, and jstar is joe acting like WorkStar. Only the basic version of
    joe is described in this section.


    # Starting joe


    Like text editors, you can start joe with a blank file or start editing a current
    file. To edit a current file, type:


    ```

    joe filename

    ```


    If you type joe by itself, start working on a new file. If joe is already running
    and you want to load in a file, press Ctrl-K, E and joe prompts for a filename.
    If you want a list of files, at the filename prompt, press your Tab key. In fact,
    any time joe prompts for a filename you can press the tab key to get a list of
    files in the current directory.


    All you need to do to start typing is start typing. Like pico, joe is a modal
    editor (moed modes which are described in the section on vi). Use the arrow keys
    to move around, or if you prefer, you can use control keys as with pico.


    +   Ctrl-B moves the cursor left

    Ctrl-F moves the cursor right

    Ctrl-P moves the cursor up one line

    Ctrl-N moves the cursor down one line

    Ctrl-Z moves to the previous word

    Ctrl-X moves to the next word

    Ctrl-A moves the cursor to the beginning of a line

    Ctrl-E moves the cursor to the end of a line

    Ctrl-U moves to the previous screen

    Ctrl-V moves to the next screen'
