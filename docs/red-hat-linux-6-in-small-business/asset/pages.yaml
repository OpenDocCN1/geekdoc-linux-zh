- img_proc: true
  md: '# Part II: Managing Your Linux Network


    The c parameter specifies that you are copying the files from the specified directory
    (/etc); while the v specifies that operates in a verbose mode (displaying the
    files being copied). The f declares the destination file to copy (in this case
    the device file copies to the actual file etc.tar). If you list the files in your
    current directory you using the etc.tar file. It contains the archive and you
    can view the contents by using the tell (t) parameter as follows:


    ```

    tar tvf etc.tar

    ```


    You see long listing of the /etc files and directories that were stored to the
    tar file. Note that the files found in the etc.tar file do not contain a leading
    slash. a leading slash was included it would be referring to the root directory
    (/) and also peg any restorations--called extractions--to that directory. Because
    the tar file does not include the leading slash, any extractions are from your
    current directory. Therefore, if you are in the root user''s home directory /root
    and restore from another, then an etc directory is created within the /root directory.
    Make sure that you are in that directory (use the cd /root command to make sure)


    ```

    tar xvf etc.tar

    ```


    There should be a new mirror image directory of the /etc directory in root''s
    home directory (/root/etc). Next, delete that directory (rm -rf /root/etc) and
    by extracting an individual file by:


    ```

    tar xvf etc.tar etc/hosts

    ```


    The full file name as tar knows it - /etc/hosts - must be specified. List the
    directory and you see the etc directory again. The hosts file has also been extracted
    within the etc directory. Erase that directory (rm -rf /root/etc) again and this
    time extract an entire directory.


    ```

    tar xvf etc.tar etc/X11

    ```


    All the files and directories within what was the /etc/X11 are extracted to /root/etc.


