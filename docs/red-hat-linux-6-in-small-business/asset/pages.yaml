    # Getting More Help with vi


    Quite a bit of information has been given about vi, but there is more available.
    Frankly there is a plethora of information available for vi. In fact, entire books
    have been written on this application alone. In addition to the vi man page there
    is some more documentation found in the /usr/doc/vim-common-5.3/ directory. That
    includes a tutorial that takes 25 to 30 minutes to complete.


    # Introducing emacs


    emacs is an editor with powerful formatting capabilities. Since this book introduces
    and uses ApplixWare Word processor, the use of emacs is not described.

    Many Linux users find they need no other editor or word processor than emacs.
    However, it takes a fair amount of time to learn and it is left up to you to investigate
    it. A graphical version—Emacs—is also available for the X Window System.


    # Checking Your Spelling


    You can check the spelling in a text file. There are several Linux programs that
    check the words found in computerized dictionaries against those found in the
    text file. The most common programs are spell and ispell. The spell program sends
    the words that you think are misspelled to the standard output. The ispell program
    is interactive and works from a menu. The syntax is:


    ```

    ispell filename

    ```'
