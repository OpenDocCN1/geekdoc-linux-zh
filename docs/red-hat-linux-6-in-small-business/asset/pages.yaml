    # Troubleshooting


    Arkeia is a sophisticated system. A full troubleshooting manual is beyond the
    scope of this book. However, this section provides an overview of the Arkeia system
    plus a few hints. By understanding the system as a how, then is easier to overcome
    problems when they occur.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_259_0.png)


    Keep in mind that Knox Software maintains considerable documentation on their
    Web site in addition to the text provided on the companion CD-ROM. The Arkeia
    GUI also contains sensitive help screens. You can obtain 30 days of free support
    by filling out your registration form on the http://www.arkeia.com/download.html
    page.


    The Arkeia client-server backup system consists of three parts: the client, the
    server, and the interface GUI. The client daemon and server daemon can operate
    on the same machine as in case of the backup server. The client can operate on
    computers that are on the network as the server.


    When the Arkeia client is on a different machine than the server then you need
    to make sure that all the normal connectivity works. That is, if a client workstation
    cannot communicate with the server (ping, telnet, etc.) then the backup will not
    work. If you are having problems making a backup work make sure the network is
    okay before you look to the backup software as the problem.


    The Arkeia server has five components all need to work for backups to succeed.
    Arkeia uses the concept of Pools, Tapes, Drives, Drivepacks, and Savepacks. These
    components separate the hardware from the software. The computer(s) backups do
    not need to know anything about the underlying hardware that the data is to be
    stored.


    The Pool concept logically combines one or more backup media—such as DAT—into
    a single object. Arkeia controls the object that maintains all the book-keeping
    details on which volume(s) belong to it, which files and directories from'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Chapter 10: Automating Network-wide Backups


    which clients are contained on each volume and where volumes can be found. A volume
    is an abstraction for physical media; a volume can be a tape, a disk file, a floppy
    disk, a Zip file or any number of other devices.


    When creating tapes of the File type care must be taken when creating tape the
    Tape management window. The device, as Zip drive, must be mounted and the value
    that you enter in the Bar code field in the Create tape(s) window must include
    the mount directory and the name of the simulated tape (for instance, /mnt/zip/FileTape-).
    Otherwise, the simulated tapes are created in the same directory as the mount
    directory. If you use the Bar code value of /mnt/zip/FileTape-1, then the simulated
    tapes are created in the root directory file system as /mnt/zip/FileTape-2, etc.
    In that case, your data is written to your hard disk and not the Zip disk. Linux
    ext2 file system.


    Drivepacks link together one or more backup devices. It is another logical device.
    You must define at least one drive before you can create a drivepack.


    Libraries define where a volume or volumes can be accessed. If you have a library,
    the library management system controls it. A tape library is a device that combines
    multiple tapes, one or more drives and a robotic arm to load and unload the tapes,
    into a single case) Otherwise, the library management system logically defines
    a volume such as a Zip disk into directories that mimic individual volumes in
    separate slots.


    Savepacks the client''s file systems to be backed up with a drivepack. A savepack
    makes easy to make a client backup. For instance, to backup your server Chivas
    you simply specify that, for instance, the directory XYZ on Chivas uses drivepack
    W. You can then execute the Savepack manually or schedule it to some specific
    time.


    The log files contain a good source of information that can be useful for debugging
    purposes. Click Utilities -> Log management from the Server administration window
    and you are given a choice of five logs. The logs cover the backups finished,
    general information and the drives, tapes and restorations that you have done.
    Log information is displayed in all the windows that you access from the Server
    administration interface.


    Once you have configured the four Arkeia then it becomes a simple process to backup
    any computer with the software. You are divorced from having to execute, verify
    and maintain manual systems as you would with. Arkeia runs the show and you are
    left to monitor it and keep it fed with volumes.


    If you have problems configuring the system or backing up, then there are numerous
    places that you can look for help. As mentioned there are both locally (for instance,
    :/usr/doc/arkeia-server-4.0.9/html/install/solving.htm) and at the Arkeia web
    site. There is also the information that is displayed on the Server administration
    GUI. Arkeia also maintains several log files that can be accessed from the Server
    administration window-ow by clicking on the Utilities -> Log management menus.'
  merge: -1
