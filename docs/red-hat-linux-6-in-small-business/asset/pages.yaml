    You can configure fetchmail to automatically retrieve your company's e-mail in\
    \ couple of ways.\n\nOne way is to run fetchmail in daemon mode and periodically\
    \ download mail. It must be run as root and be run in multidrop mode. For instance,\
    \ if you run it as fetchmail -d 300, then fetchmail downloads your e-mail every\
    \ 5 minutes (or 300 seconds). If you run fetchmail in this mode, then you need\
