  md: '# Dealing with Installation Problems


    Troubleshooting problems is a fact of life for anyone who is running a computer
    or a network. Computers are complex devices and networking them together increases
    the complexity. It is necessary to systematically anticipate and deal with problems
    as much as possible.


    The installation of Red Hat Linux can be problematic at times. Therefore, the
    topic of troubleshooting is introduced here to help you deal with the cases when
    the installation does not go smoothly.


    # Introducing Troubleshooting


    Troubleshooting is more of an art than a science. It''s an art because there are
    so many variables to deal with that it''s impossible to quantify them all. It''s
    a science because computers and networks are ultimately deterministic beings and
    every problem has an underlying reason or reason for existing (even if they cannot
    be readily identified)


    The poor human is responsible for dealing with problems must simply try and get
    a handle on what the particular problem is. The more one knows about a system
    the better one''s mind can sort through all the variables and find a solution.
    The experienced administrator-troubleshooter is able to subconsciously sort through
    the evidence to find a pattern that points to a solution. If one uses the simple
    technique of eliminating the simplest cases before working through more complex
    ones, then troubleshooting becomes less of a mystery.


    # Troubleshooting the Red Hat Installation Problems


    If you have encountered problems with the installation process then there are
    some common processes and tools to use in order to fix your problem.


    # INTRODUCING TOOLS


    The Linux commands introduced in Table 1-1 can be useful in solving installation
    problems. You can make any of those commands by using the virtual consoles that
    Red Hat has available to you during the installation process.


    A virtual console is a separate terminal session that you can access by pressing
    a key sequence. The installation process starts out and remains in console one
    unless you change to another one. You change consoles by pressing the Alt-F1 through
    Alt-F5 keystrokes. Table 1-5 describes the virtual console functions. You can
    switch back and forth between any of them by using the access code combinations.'
