    you''re logged into your home directory because although the full directory name
    is /home/paul, only the last subdirectory in the full path is shown to keep the
    prompt from getting too long.


    When you log on as root, a pound sign (#) is shown instead of a dollar sign ($),


    ```

    [root@bart /root]#

    ```'
