    # Worrying about Security


    One of the big headaches of computer administration is security. It''s your responsibility
    to keep your computers safe from unauthorized access and abuse.


    This book does not intend to attempt to cover the topic in depth. There''s enough
    information on the subject of security to fill the entire book. But hopefully
    you''ll learn how to lay down a strong foundation of philosophy and build a sturdy
    house to get started safely. From that point, you can go on to as much as you
    think necessary to match the dangers that your particular business faces.


    First, there is no silver bullet when it comes to security. These hackers will
    not be stopped by one type of firewall or one type of password encryption and
    you should view security as an amorphous and evolving animal. Your best protection
    is your own paranoia, which should be tempered by knowledge and as you gain it,
    experience. The following ideas or policies should help your paranoia into focus.


    Used layered security. You don''t want your system to fail because of one breach.
    Therefore use a firewall, use good passwords, monitor your system and be aware
    that all of your protective mechanisms are only as good as the people who manage
    them.


    Educate yourself and your employees. The Internet is a great resource and you
    should keep track of security-oriented newsgroups and Web sites. There are numerous
    professional groups such as USENIX (www.usenix.org) and SANS (www.sans.org) which
    provide professional (and tax deductible) conférences on system administration
    and security topics. These conferences are probably the best way to get knowledge
    that you''ve gained on the job, because professionals will help you down the essential
    topics into half or full day tutorials which will help you with the basics.


    The knowledge or experience level of the people attempting to break into your
    system can vary. Some crackers (the hackers are the good guys in this book, after
    hackers created Linux) are very sophisticated; others, such as the ones referred
    to as script kiddies or kiddiescriptors, not necessarily have in-depth knowledge
    of computers and networks. They simply run publicly programs that gather information
    and attack your system. Therefore, having too much paranoia and awe can be detrimental
    to your role as security administrator because it prevents you from reasonably
    scoping your opposition.


    The education of your employees or whoever works on your systems is also essential.
    Sometimes just knowing why it''s important to set up good passwords or'
