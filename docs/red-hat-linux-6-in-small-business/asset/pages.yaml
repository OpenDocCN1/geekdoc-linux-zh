  md: "up a system that does not have a startup script in the /etc/rc.d/init.d directory\
    \ is to use the /etc/rc.local file. Log in as root and add the following lines\
    \ to the rc.local file.\n\n```\nif [ -f /etc/fetchmail ]; then\n  /usr/bin/fetchmail\
    \ -d 300\nfi\n```\n\nAnother method is to cron kick off a fetchmail process. Log\
    \ in as root and run the crontab -e command. It starts up vi (or whatever you\
    \ default text editor is) and edits the crontab file for the user root. Add the\
    \ line like following:\n\n```\n# Fetch mail from mail.myisp.com\n* * * * /usr/bin/fetchmail\
    \ -v\n```\n\nCron starts the fetchmail process as the user root every 20 minutes.\
    \ Please refer to the crontab man page for information about the scheduling details.\n\
    \nFinally, you might want to opt to download mail whenever you connect to your\
    \ ISP. You may modify the /usr/local/etc/ipchains.rules to include the following\
    \ line at the end of the file.\n\n```\n/usr/bin/fetchmail -d 60 -v\n```\n\nOnce\
    \ the PPP connection is made, dial/chat kicks off a fetchmail daemon that checks\
    \ for e-mail every 60 seconds (you can choose any interval that you want).\n\n\
    Add the following rule to the /usr/local/etc/ipchains.rules script to stop the\
    \ fetchmail daemon when PPP is disconnected.\n\n```\nkillall -9 fetchmail\n```\n\
    \nYou can use this method by itself or in conjunction with the previous methods.\
    \ There is no reason why you shouldn't download your e-mail every time you connect.\
    \ It doesn't cost you anything other than the filling up your PPP connection with\
    \ the e-mail coming across.\n\n# Troubleshooting\n\nDesigning and maintaining\
    \ an e-mail server can be a very complex job. Fortunately, the default Red Hat\
    \ installation provides a ready made sendmail system that works for a small network.\
    \ By adding fetchmail to get e-mail, a complete e-mail system can readily be constructed.\
    \ Please test your new e-mail system before using it as your primary e-mail system."
