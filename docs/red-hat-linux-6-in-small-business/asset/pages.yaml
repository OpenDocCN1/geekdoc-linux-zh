  md: 'UNIX UNIX is a type of operating system that provides the interface between
    the computer''s hardware and the human operator/user. UNIX and Linux are very
    similar in operation but Linux does not share the numerous copyrights that UNIX
    has.


    user A person who logs onto a computer and uses it.


    user account The login account that belongs to a user.


    Virtual memory The system where pieces (pages) of memory are taken (swapped) out
    of RAM and placed onto disk storage (swap). This makes the memory “look” larger
    than it is.


    X Window System Also X, X11, or Window. A client-server graphical window system
    developed by the Massachusetts Institute of Technology (MIT). It is used extensively
    in the Linux/UNIX world.


    World Wide Web (WWW) The sum total of all the computers connected to the Internet
    that serve information via the http protocol.'
