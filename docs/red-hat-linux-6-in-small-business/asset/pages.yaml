    Ctrl-K, L joe asks for a specific line number which you want to move.


    # Working with Multiple Files


    One feature joe over pico is the ability to open multiple editing screens simultaneously.
    Press Ctrl-K, O to split the screen in half. Now you have two windows—or views—to
    the same file. To move your cursor to the lower window, press Ctrl-K, N. To move
