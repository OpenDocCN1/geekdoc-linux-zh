  md: '# Viewing Files


    Linux gives you quite a few ways to view a file. Viewing and editing files is
    discussed in detail in Chapter 4 but a quick discussion is given here for your
    convenience.


    # Concatenating a File


    The cat concatenates an entire file to your screen. For instance,


    ```

    cat /etc/passwd

    ```


    displays the contents of the password file to your screen. It works in much the
    same way as TYPE in the DOS world.


    # Displaying Pages of a File


    If a file is too big to fit on the screen, then you can use more to display the
    file one page at a time. For example, type:


    ```

    more /var/log/messages

    ```


    > More prompts after you it displays one screen worth of the file, and waits for
    your input. To continue one line at a time through the file, press Enter. To skip
    to the next page, press the Space bar. You can also go back a page at a time by
    pressing Ctrl-B or search for a string by pressing the slash (/) key. Pressing
    H displays a help screen. If you want to stop before the you''ve viewed the whole
    file, press Q to return to the command prompt.


    # Using less


    The less command displays a file page at a time more. However it allows you to
    move backwards as well as forward:


    ```

    less /var/log/messages

    ```


    The man pages for less describe the differences in full.


