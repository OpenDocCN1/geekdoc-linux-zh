    MANAGING A COMPUTER SYSTEM is a difficult and complex job. The sheer number of
    topics that you have to master requires a large effort over a long time, and the
    fact that running your business is your main focus makes it even more difficult
    to find the time. However, the more your business depends on computers, the more
    important it is that you take the time to learn. Computers and networks must be
    managed correctly to prevent problems and disasters, and this is necessary to
    make your systems run productively.


    This chapter is designed to introduce you to the philosophy of administration
    and the details needed to do''most important jobs. The focus of this chapter is
    on managing a Linux server, as the next chapter focuses on networking issues.
    However, some topics such as security are symbiotic to both, and are discussed
    in both chapters.


    Once you have a good overview of systems administration, the job will seem daunting
    and you can be sure that you are not missing anything important. This chapter
    is oriented to management issues specific to the operation of a Linux server and
    leaves network-oriented topics to Chapter 7.'
