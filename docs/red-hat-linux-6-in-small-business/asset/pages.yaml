  md: '# Part III: Connecting your Network to the Internet


    address of the PPP connection on the Linux gateway/firewall. Once on the Internet
    they all appear to be coming from a single machine. No matter what computer on
    the private network you are using, all packets appear to come from a single computer.


    If you use IP masquerading, then you do not need any official registration to
    allow your network to access the Internet. Without masquerading you would have
    to register with InterNIC (the organization that distributes IP addresses) to
    obtain IP addresses for your network. It also conserves the quickly diminishing
    pool of IP addresses.


    IP masquerading also provides the advantage of hiding your network behind a single
    address. Anyone trying to probe or attack your private network has to go through
    your one-way street (and typically dynamically) address. Since IP masquerading
    is die on the tye. That is because packets originating from the outside will not
    get translated into the address of a private network machine and, thus, never
    find their way to your computer.


    The only way for a probe or attack to get a foothold is to join an existing connection.
    However, even if that''s possible, the packets will have to be part of an connection
    originating from the private network. The packets will be treated as return packets
    and should never be able to start a new connection. IP masquerading has the effect
    of making your firewall safer without it.


    The last line in the ipchains.rules script, in "Building a Working Filter," describes
    the masquerading rule for the paunchy.net network. IP masquerading converts one
    IP address into another IP address. That translation permits one or more computers
    to masquerade as single IP address. If that address is your dynamic, dial-up IP
    address, then your entire network can access the Internet.


    What the rule says is that local IP address 192.168.1.0 (the /24 specifies a subnet
    mask of 255.255.255.0) that shows up at the Linux gateway is destined for the
    default route 0.0.0.0 masqueraded. The default route is pegged to the PPP connection--ppp--which
    has a dynamic IP address given by your ISP. The source address of the packets
    destined for the Internet is changed to the dynamic IP address. For instance,
    if your PPP connection has an address of 192.168.32.15 and the packets from the
    Windows machine toluca have a source address of 192.168.1.2, then the packets
    that get to the Internet get the source address of 192.168.32.15. The computer
    toluca appears to the rest of the world as


    A little more happens during masquerading than just the source address translation.
    The source port gets converted to another port. Recall that the TCP/IP protocols
    make use of both IP addresses and ports. Ports are used to separate network communication
    between different applications. For instance, standard Hypertext Transport Protocol
    (HTTP) uses port 80 by default. If you look at the /etc/services file, then you
    will see all the applications and protocols along'
