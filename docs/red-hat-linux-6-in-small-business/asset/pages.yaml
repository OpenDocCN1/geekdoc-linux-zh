  md: '# # Stopping Linux Properly


    You should not simply turn off the power to a Linux computer. The file systems
    are buffered in memory, and if they are not properly written to disk first, then
    data is lost and damage to your file system can occur.


    The proper method for shutting down Linux is to run the shutdown program from
    a text console after logging out of X.


    shutdown -h "chivas is now being shut down for maintenance."


    The above command tells the system to halt (-h), to start the process immediately
    (now) and the quoted message is sent to all users. You can exchange the halt for
    a reboot (-r), and extend the time to reboot by reboot now with the number of
    seconds.


    Once the message "System halted" is displayed, then you can safely power off your
    computer.


    # # Troubleshooting


    Linux computer system administration is often spread over many topics. Troubleshooting
    is often a matter of knowing what subsystem is not working. The following tips
    are intended to help point you in the right direction.


    One of the best troubleshooting tools is the system logger syslog. For instance,
    if you are having problems then you might be able to determine what is happening
    by looking at /var/log/messages log file.


    LinuxConf and Control Panel can be used to reconfigure misbehaving systems. /etc/passwd,
    /etc/shadow, /etc/group files and make sure that the user home directory exists
    and is properly configured. Or, you can manually examine the /etc/passwd file,
    or use the configuration GUIs to examine and reconfigure the problem account,
    if necessary.


    Always make backups in order to recover from trouble. No matter what goes wrong
    with your computer, you can recover to some extent if you have backups. For instance,
    if you lose a disk, then troubleshooting the problem is accomplished by simply
    restoring the data to the original or some other disk.


    Use the fsck command to recover from disk problems. Sometimes, after an improper
    shutdown, the default fsck is not adequate. In such cases, you may be prompted
    to enter the root mode; that is a minimal system that is similar to Windows Safe
    Mode. At that point you run fsck manually and are prompted by fsck to make fixes.'
