    # Summary


    This chapter describes how to set up your Linux server as a printer server. It
    shows how to configure both local and remote printers. It also extended the discussion
    of Samba printers.


    +   - An introduction to the Linux printer daemon lpd is given. It''s responsible
    for knowing when a print job has been submitted. It must also communicate with
    the printer being accessed and transmit the information to the printer. The /etc/printcap
    configuration file controls how lpd interacts with the printer(s) that it controls.


    +   - A description of using a local printer is given. A local printer is attached-usually
    through the parallel printer port--directly to the Linux server. It can be configured
    via the RHS Linux Print System Manager or by manually editing the /etc/printcap
    file.


    +   - A description of a remote printer is given. A remote printer can be attached
    to another Linux server or directly connected to a network. It can be configured
    via the RHS Linux Print System Manager or by manually editing the /etc/printcap
    file.


    +   - A description of using a Samba printer is given. A Samba printer share can
    be configured by using the RHS Linux Print System Manager or by manually editing
    the /etc/smb.conf file. A Samba printer share can access either a local or remote
    printer.


    +   - A description of using Windows computers to access Linux printers via Samba
    is given. You use the Printer Manager to browse and then connect to the Linux
    printers. You can make a Samba printer your default printer if desired.


    +   - An introduction to troubleshooting techniques is given. Troubleshooting
    Samba shares is no different than troubleshooting Samba shares as discussed in
    Chapter 8. Troubleshooting locally and remote printers is a matter of checking
    the connecting cables or the network.'
