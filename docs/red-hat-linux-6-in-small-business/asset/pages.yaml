    of its subdirectories.


    # Changing the File Ownership


    At some point you may want to change the ownership of a file. Maybe you''ve been

    working on a project and someone else is taking it over. Logically, they would
    set the

    new file permissions. Linux lets you change a file''s ownership with the chown

    command using the syntax of chown newowner filename. You must be logged in

    as root in order to use this command.


    ```

    chown nobody /root/Xrootenv.

    ```


    This example changes the owner of the specified file to nobody, one of the stan-

    dards who use Red Hat configurations during the installation.


    # Changing the Group of a File


    Like changing file ownership, you may want to change the group a file belongs
    to.

    When you create a new document, by default, Red Hat Linux assigns the group

    rights to the file using your username. But you''re really part of a sales group,
    and

    every in that group needs access to the file. To change the ownership to sales,

    use the chgrp command. The syntax is chgrp newgroup filenames. For our exam-

    ple, type:


    ```

    chgrp sales prospect.list

    ```


    # Copy Files


    You can use the cp command to copy files in Linux. For example, if you want to

    turn the file project1 over to user lidia, your first step would be to copy the
