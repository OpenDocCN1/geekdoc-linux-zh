  md: '# Glossary


    10base2 A version of Ethernet that transfers data at 10 megabits per second. It
    uses an RG58 coaxial cable. It''s also referred to as Thinnet.


    10baseT A version of Ethernet that transfers data at 10 megabits per second but
    uses twisted pair wires instead of coaxial cable. The twisted pair cable is similar
    to telephone cable in appearance. This is the most popular media for Ethernet
    networks.


    100baseT A Version of Ethernet that transfers data rates up to 100 megabits per
    second using special grades (category 5) of twisted-pair cables.


    ATAPI CD-ROM Advanced Technology Attachment Packet Interface. This bus is used
    to connect a CD-ROM or tape device to a computer, using the standard IDE interface.
    ATAPI is an improvement over the first CD-ROMs that used proprietary interface
    adapters and drivers.


    bash Bourne Again Shell. The standard Linux shell.


    bit A binary cell of information. It can either be on (1) or off (0). A computer
    hard disk, floppy disk, Zip disk, or Jaz disk stores a bit magnetically on a small
    piece (the size depends on the density of the disk) of the disk. A CD-ROM or other
    optical disk stores a bit by slight distortion in the media that reflects a laser
    beam one way or another depending on the state (1 or 0) of the bit.


    boot The process of powering on or resetting a computer.


    bus The electrical interface between devices on a computer or a network. In a
    computer, it carries the data (in digital format), memory addresses and timing
    signals between the CPU, memory and its associated internal and external devices.
    On a network carries information (in analog radio frequency format) that is converted
    into digital packet form at the network hosts; an example of a bus network device
    is 10base2 (Thinnet) Ethernet. Every device on a bus – computer and network –
    receives all of the information being broadcast; each device uses or discards
    the information depending on whether it is addressed to the device or not.


    byte A unit of 8 bits of binary information.


    CD-ROM Compact Disk-Read Only Memory. Computer storage media that uses the same
    form as a music disc. It is a read only media although writable forms are available.
    It is the most commonly used form to distribute computer software and information.'
  merge: -1
  pgno: 386
- img_proc: true
  md: 'CPU Central Processing Unit. The chip that processes the instructions of the
    operating system and all other software.


    directory a system for organizing individual files. Under Linux, a directory is
    a file itself that contains a list of files and directories that are assigned
    to it. A directory can be contained in another directory, in which case it is
    called a subdirectory.


    Disk Druid The Red Hat utility used to create and edit partitions.


    Distribution There are numerous companies and organizations that package Linux
    and its support software into a single entity. That combination is called a distribution.
    The Red Hat distribution is one example.


    DNS Domain Name Server. Converts numeric IP addresses (for instance, 192.168.1.1)
    to names myserver.mydomain.net and vice versa.


    Dual boot describes the method of storing two or more operating systems on a single
    disk.


    EIDE Enhanced IDE. An advanced version of the IDE bus. It is also referred to
    as ATA-2. ATAPI is part of this interface.


    Ethernet A protocol that defines network communication, in the form of packets,
    which will take place on a single bus. That bus is physically shared by the one
    or more network devices that use the Ethernet protocol. The packets contain a
    header that describes the recipient.


    FAQ Frequently Asked Questions. This type of document gives answers to typical
    questions about a given topic.


    file A file is the collection of bytes that are stored on a device such as a hard
    disk or CD ROM.


    file partition A partition is the way that Linux (and many other operating systems,
    including DOS and Windows) divides a disk device in order to create a file system
    on.


    file systems The file system is the way that the kernel logically organizes a
    physical device, such as a hard drive, to store information in the form of a file
    or directory. The kernel is connected to a file system when it is mounted.


    firewall A system that protects one network from unauthorized access from another
    network. Typically a firewall protects an individual or organization''s private
    network from the Internet.'
