  md: '# Part 1: Building and Using a Basic Linux Computer


    # The GNU General Public License (GPL)


    Linux is distributed under the GNU General Public License (GPL). The Free Software
    Foundation developed the GPL as the key concept to its software that should be
    distributed freely. To that end, the GPL is designed to promote GNU''s freedom
    to distribute software.


    Distributing software under the GPL does not necessarily mean that the software
    is free. For instance, you need to purchase Red Hat official distribution on the
    CD-ROM that comes with their manual. However, you can download that same software
    without paying for it from their Web site. The following highlights describe some
    of the features of GPL:


    +   Software published under GPL in not in the public domain. It''s copyrighted
    (some call copylefted) to the author(s) and is protected by all international
    copyright laws. The author allows you to use it under the restrictions of the
    GPL


    +   GPL published software is not shareware. Shareholders own the copyright to
    their software but ask you (without enforcing it) to pay after you using your
    software.


    +   GPL software can be distributed either free or for a fee. For instance, you
    can get Linux off the Internet for no charge or buy it from Red Hat for a fee.
    Both use GPL.


    +   You can modify GPL software in any way that you want. If you want to distribute
    the software, then you must place it under the GPL.


    +   GPL-based software must advertise that it is covered under the GPL


    This is an ingenious mechanism. It enables the unhindered distribution of GPL
    software such as Linux and allows both individuals and companies to make money
    by enhancing the value of the basic Linux software. It also encourages people
    to work on GPL software purely for personal satisfaction. Finally, it prevents
    people from gaining a restrictive hold on GPL software.


