    (MB) per second data rates.


    The advantage of twisted-pair, which is also called 10baseT (10Mb), is that it
    is easy to connect and disconnect NICs once you have wired your office or building.
    It makes use of phone connectors and allows you to plug in and out as you desire.
    It''s also capable of handling up to 100 megabits-per-second data rates (must
    use category 5 twisted-pair cables for 100 MB (10baseT and 100baseTX) systems
    while using category 3 twisted-pair cable suffices for 10baseT). The disadvantage
    is that you need to purchase an Ethernet hub or switch.


    The primary difference between a hub and a switch is that the hub transmits Ethernet
    packets (frames) to all the NICs connected to it. If you load your LAN too much,
    all of your connected machines see all of the traffic and the response time is
    greatly diminished. A switch permits the segregation of traffic and effectively
    increases the bandwidth available to each machine. For instance, packets from
    machine A destined for machine B do not get relayed to machine C if A and B are
    on a different switch (also called domain) than C.


    Ethernet hubs can be either managed or unmanaged. Unmanaged hubs do not require
