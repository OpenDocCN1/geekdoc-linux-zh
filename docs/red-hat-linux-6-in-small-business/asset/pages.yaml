  md: '# Education is Your Firewall Too


    It should be emphasized that the security methods discussed here are effective
    but not complete. They are a reasonable place to start. However, firewall security
    and security in general is a big topic. It is wise to treat all of this as a process.
    If you continue to educate yourself on the subject, then you stand a much better
    chance of keeping ahead of the wolves.

    There are several places to look at the Internet:


    +   - The Computer Emergency Response Team (CERT) web page at www.cert.org

    - http://www.cis.ohio-state.edu/text/faq/usenet/computer-security/\http://olympus.cs.ucdavis.edu/

    - http://www.cs.pdx.edu/~mchugh/cs510sc.html

    - http://www.cs.umsl.edu/~sanjiv/security.html

    - http://www2.pitt.edu/HOME/Security.org/

    - http://www.insecure.org (one of my favorites and also one of the best!)


    The following are newsgroups:


    +   - comp.linux.security

    - comp.firewalls


    If you can find a college course on Internet or computer security, then that is
    certainly worthwhile. There are conferences that are very good at disseminating
    a great deal of information in a short time. Look up the schedules at www.sans.org
    and www.usenix.org for instance.


    # Troubleshooting


    The two most difficult systems to install and maintain are the ipchains filtering
    firewall and the DNS server. Some basic troubleshooting hints and techniques are
    described in this section. The other systems discussed in this chapter deal with
    the monitoring and maintenance of the above services and are not difficult to
    use.'
