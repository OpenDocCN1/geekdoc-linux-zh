  md: '# Chapter 12


    # # Creating a Simple Firewall


    IN THIS CHAPTER


    +   - Introducing firewalls

    - Connecting your LAN to the Internet via masquerading

    - Protecting your Internet connection with a hybrid firewall

    - Monitoring your firewall

    - Monitoring your server for break-ins

    -Keeping track of the bad guys

    - Testing your firewall with nmap

    - Verifying your Server with Tripwire

    - Learning more about firewalls and security

    - Troubleshooting your firewall


    # # Introducing Firewalls


    firewall is a computer, router, or a dedicated device that is configured to prevent
    unauthorized access to one network from another network. For the purposes of this
    book, a firewall is a Linux computer set up to protect your simple business network
    from troublemakers on the Internet.


    This book uses terminology that is somewhat different than what you''ll find in
    the technical literature. Your small business network is referred to as the private
    network; the private network is often referred to as the protected network in
    other places. The Linux computer that functions as a firewall is called the firewall
    server (in other circles machine is often referred to as a Screening Router).
    Hopefully, the terms used here are descriptive and clear.


    Firewalls come in two flavors: filtering and proxy. Filtering firewalls look at
    every IP packet and decide whether to pass or reject the packets based on a set
    of rules that you use; they work at the OSI Network layer (see the section "The
    OSI Network Layer Model" in Chapter 7 for more information). Proxy firewalls act'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# Part III: Connecting Your Network to the Internet


    as an intermediary between a program client and its server by replicating the
    communication. They work at the OSI application layer.


    There are several strategic locations to place a firewall in a network. Two common
    configurations put a firewall either directly on the private network or on a separate
    network dedicated to security. The former allows a simple firewall to be easily
    constructed and depending on what services it provides, it can be reasonably safe.
    The latter is more difficult to configure but provides a higher degree of safety;
    this book refers to the latter as a Firewall Network but the DMZ and Demilitarized
    Zone.


    # IP Filtering Firewalls


    Filtering firewalls look at each packet coming into and going out of it, and compare
    the source IP and port as well as the destination IP and port to a set of rules.
    The packet is either permitted to pass or not depending on these rules, which
    you, the network administrator, choose.


    Red Hat Linux comes with the iptchains package, which provides filtering capabilities.
    This package allows the filter rules to be configured dynamically and also perform
    numerous levels of logging. The dial program described in Chapter 11 can automatically
    set up the iptchains rules. This allows you to completely automate both your PPP
    connection and firewall.


    Filtering firewalls are relatively easy to configure. They are also efficient;
    an Intel 486 firewall server can easily handle a medium sized network (zens of
    computers) to connect to the Internet through a T1 Frame Relay connection (1.45
    Mbps). They are also safe as firewalls when providing one-way communication to
    the Internet.


    The problem with IP filters is that once you start allowing connections from the
    Internet. For instance, if you want to interactively connect into your private
    network from your home computer (assuming that they are not in the same), then
    you need to set a rule(s) that allows incoming Telnet connections. There are tools
    (for instance nmap, which is discussed in the section Using NMAP to Test Your
    System) that can potentially find holes and use them against you.


    # Proxying Firewalls


    Proxying firewalls allow you to add application-level authentication to permit
    incoming connections. For instance, if you want to connect to your private network
    from your home computer, a proxying firewall forces you to provide a password
    before allowing you through. Using one-time passwords makes it very difficult
    to gain unauthorized access to your system.


    The problem with proxy firewalls is that they are relatively difficult to set
    up, are somewhat inefficient, and are vulnerable to software bugs and new attack
    methods.'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Chapter 12: Creating a Simple Firewall


    The difficulty of configuration is because each application that you want to proxy
    requires its own configuration. (The SOCKS system, however, only has one configuration.)
    It is inefficient because the communication processing is doubled for every application
    because packet has to be rewritten as it passes through the proxy.


    It''s somewhat vulnerable to new attacks because any attack that finds an opening
    can only be fixed by the programming of the proxy itself. For instance, Denial
    of Service attacks first proved, any proxy felt victim had to be reprogramed.
    Unfortunately, this isn''t something that a pressed administrator can do easily,
    if they can do it at all. (Filtering firewalls, while not immune to new attacks,
    can be reprogrammed to simply deny the IP packets that carry the new attack.)
    The fact that a proxying firewall is often sitting out on the Internet means that
    potentially everyone on the Internet can pound away at your firewall. The more
    attempts made on your firewall the higher the probability that a weak spot can
    be found.


    Don''t assume proxying firewalls are inadequate for the job; the potential hazards
    are pointed out for comprehension. Proxy firewalls are not used in this book because
    a better alternative (for the needs of the network being built in this book) exists
    in the hybrid system described in the next section "Hybrid Firewalls."


    One of the most widely used proxy firewall systems is the TIS Firewall. It is
    freely available for US citizens by way of the Internet. Please check the www.tis.com
    web page for license and download instructions.


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_294_0.png)


    Please refer to the Firewall-HOWTO in the `/usr/doc/HOWTO` directory for more
    information on proxying firewalls.


    # ipchains


