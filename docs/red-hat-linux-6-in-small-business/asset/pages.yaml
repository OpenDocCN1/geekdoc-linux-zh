    paunchy.net

    ```


    Your ISP must know what name you are known as too. That process is discussed in
    the section Registering your Domain Name later in this chapter.

    The /etc/sendmail.cf file must be modified too. Modify the parameter #Dj$w.Foo.COM
    as shown below.


    ```

    Dj$w.paunchy.net

    ```


    This line tells sendmail the local domain name is.


    # Configuring Sendmail for External Mail


    To send mail from your network to the outside world through your ISP, you need
    to make another modification to the /etc/sendmail.cf file. Log in as root and
    edit the sendmail.cf file. Find the section that looks as follows:


    ```

    # "Smart" relay host (may be null)

    DS

    ```


    Modify the DS parameter to DSmsp.com which tells sendmail to deliver external
    mail to your ISP.

    The modified configuration file should look like the following.


    ```

    # "Smart" relay host (may be null)

    DSmail.myisp.com

    ```


    Next, comment out the following line to allow your messages to be relayed to your
    ISP. This line can be found at, or around, line 1033 in the /etc/sendmail.cf file.


    ```

    # anything else is bogus

    ###R$ $#error @ 5.7.1 $: "550 Relaying denied"

    ```'
