  md: '# Chapter 7: Managing Your Network


    # Check your Windows Computer


    If you suspect that your Windows computer is misbehaving, then you should check
    the Ethernet NIC and routes in the same manner as with your Linux machine. You
    can work from an MS-DOS window. Recall from Chapter 1 the DOS commands that are
    equivalent to the Linux ping, ifconfig, route and netstat are PING, IPCONFIG,
    ROUTE AND NETSTAT.


    Windows also provides an interactive troubleshooting system called the Network
    Troubleshooter. From the Windows desktop click on Start → Help. Search for the
    Network Troubleshooter. It asks you questions down and narrows the possible cases
    depending on your answer. It can solve every possible problem but is surprisingly
    good in fixing windows networking problems.


    # If you still have problems


    This section is by no means exhaustive description of troubleshooting your network.
    It covers the simplest and some of the most frequent problems and solutions. If
    you continue to have problems please look at the HOWTOS and FAQs. Recall that
    they are installed in /usr/doc directory or can be installing the howto-5.2.2.noarch.rpm
    on the companion CD-ROM.


    You can also use the Internet for answers. Connecting your computer and to the
    Internet is discussed in Chapters 11 and 12. Skipping ahead and connecting to
    the net can be problematic if you are having trouble getting your LAN going, so
    in that case try to find a computer with an existing connection that you can use.


    Once on the Internet, you can ask for help using one of the many newsgroups or
    going to Red Hat directly. Follow their rules and requirements as necessary.


    # Summary


    This chapter focused on the process of network administration. If you can start
    focusing on the high-level aspects of managing a network, then the low-level jobs
    become more manageable. Your network will run more smoothly and efficiently if
    you take a holistic approach.


    +   - Network administration is discussed in general terms. The policies that
    you make or inherit determine what you do and how you do it. The more that you
    do to shape policy, the better you can control your network.

    - Network security is an ongoing job. The subject is a complex and everevolving
    one. No one solution or technique exists, and the process is the most important
    aspect of the subject. You must use good judgment and experience to manage the
    ever-changing dangers.'
