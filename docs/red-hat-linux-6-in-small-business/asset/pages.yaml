    +   - A description of obtaining information from the Internet is shown. The Internet
    was the incubator for Linux and now provides many different sources of information
    and help for the user.


    +   - A discussion of using Linux publications is given. There are numerous magazines
    that are both traditional paper-based and online. These provide another useful
    resource.'
