    lidia''s home directory. cp is the command to copy files in Linux. The format
    is cp

    oldfile newfile. So in this case, you would type:


    ```

    cp project.file /home/lidia

    ```


    After copying the file to lidia''s directory, type the following to give Lidia
    owner-

    ship of the file:


    ```

    chown lidia /home/ lidia/project.file

    ```'
