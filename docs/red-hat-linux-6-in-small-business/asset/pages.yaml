  md: '# Part 1: Building and Using a Basic Linux Computer


    ![](img/715fe99ccd2f8b7e4f2f45952c4ba42f_37_0.png)


    Linux uses the concept of partitions somewhat differently than Microsoft. When
    you create a file partition under Linux, you divide a disk or disks into logically
    distinct areas just like under Windows/DOS. The partition is formatted so that
    the operating system can read and write files to the disk. The difference is that
    the partition(s) must be mounted before Linux can use them. Mounting is the process
    where the Linux kernel is made aware of where it can access that particular file
    system. Under Windows/DOS the partition is intrinsically linked to the operating
    system.


    If your computer is already running Windows and you have extra partitions, then
    you can install Linux on one or more of those partitions.

    If computer has one large partition running Windows then you can still install
    Linux along side it. However, you need to make room on the Windows partition for
    Linux using the first nondestructive Interactive Partition Splitting (FIPS) program.
    FIPS reduces the space used by the Windows partition without destroying any data.
    The free space can then be used to create a Linux partition and install Linux.
    More information about FIPS can be found on the Web at www.igd.fhg/~aschafe/fips
    or at the Linux Documentation Project (LDP) sunsite.unc.edu/LDP.


    # USING FIPS


    You should prepare your disk before running FIPS. Because FIPS looks for unused
    sectors to reallocate, it is advisable to first check for, and mark as unusable,
    any bad sectors. ScanDisk is the Microsoft utility that provides that. If you
    combine files that are physically scattered across the surface of the disk into
    one contiguous location, then you can free more space for Linux to use. The process
    for this is as follows:


    +   - Back up any data or programs that you cannot afford to lose. You should
    ideally back up your entire disk.

    - Run the ScanDisk tool by selecting Start -> Programs -> Accessories -> System
    Tools -> ScanDisk.

    - From the ScanDisk dialog box, select the Thorough and Automatically Fix Errors
    options. Then click the Start button to initiate the process. Be prepared to wait
    a long time if you have a large disk.

    - After ScanDisk is finished, go to the Defragmenter utility by selecting Start
    -> Programs -> System Tools -> Defragmenter. Select a Drive dialog box appears.
    Select the appropriate drive and click OK. Back in the Defragmenter dialog box,
    click the Start button. The disk is defragmented. Again, this can take a long
    time.'
